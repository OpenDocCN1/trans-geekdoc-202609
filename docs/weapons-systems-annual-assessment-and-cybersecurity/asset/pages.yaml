  md: '# Ground Based Strategic Deterrent (GBSD)


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_219_0.png)


    # Ground Based Strategic Deterrent (GBSD)


    The Air Force’s GBSD is replacing the aging Minuteman III, the land-based component
    of the nuclear triad providing strategic deterrence. GBSD will include new missile
    systems, weapon system command and control, and ground systems, as well as restored
    and modernized Minuteman III silos. GBSD aims to improve performance and affordability
    over the Minuteman III and be more adaptable to changing technologies and new
    threat environments as they arise from the first fully integrated weapon system,
    projected in fiscal year 2029, through 2075.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_219_1.png)


    # Program Essentials


    Program office: Hill Air Force Base, UT

    Prime contractors: Northrop Grumman and Boeing

    Contract type: Cost-plus-fixed-fee (technology maturation and risk reduction)

    Next major milestone: Development start (September 2020)


    # Current Status


    The Air Force started technology development on the GBSD in August 2016. The program
    office later awarded two technology maturation and risk reduction contracts, both
    for a period of 36 months, in August 2017. To ensure that GBSD is delivered by
    2029, the Air Force’s acquisition strategy relies on using low risk, mature technologies.
    As such, the program’s focus during the technology development phase is on risk
    reduction with minimal focus on technology maturation. Contractors plan to demonstrate
    a set of subsystem prototypes and deliver a preliminary design for a complete,
    integrated weapon system to the government by mid-2020. The program office’s plan
    to conduct preliminary design reviews prior to entering system development in
    fiscal year 2021 aligns with acquisition best practices and statutory requirements.


    Uncertainties in GBSD acquisition costs led officials in the Office of Cost Assessment
    and Program Evaluation (CAPE) to present DOD decision makers at Milestone A with
    two independent cost estimates between 34 percent and 139 percent higher than
    the Air Force’s initial estimate for its acquisition budget. Government officials
    cited estimating challenges such as:


    +   - gaps in historical cost data from analogous systems dating back to the 1960s
    or 1980s,

    +   - differences in labor rates used to project costs up to 60 years in the future,

    +   - lack of definition in key aspects of the weapon systems, particularly the
    ground systems, and

    +   - differences in both the timing of costs and projected duration of development.


    DOD ultimately selected the CAPE lower estimate as its official initial cost position.
    In 2018, the program office expects to obtain updated estimates—further informed
    by contractors’ design choices—although many of the same data limitations will
    still apply.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.


