- pgno: 20
  md: 'chapter we refer to these three phases more simply as technology development,
    system development, and production. Programs typically complete a series of milestone
    reviews and other key decision points that authorize entry into a new acquisition
    phase.


    Our body of work has shown that attaining high levels of knowledge before significant
    commitments are made during product development drives positive acquisition outcomes.^10
    We have found that in order to reduce risk there are three key points where programs
    should demonstrate critical levels of knowledge before proceeding to the next
    acquisition phase: development start, system-level critical design review, and
    production start. Figure 1 aligns the acquisition milestones described in DOD
    Instruction 5000.02, which establishes policy for the management of acquisition
    programs, with these three key decision points.


    Knowledge associated with these three points builds over time. Our prior work
    on knowledge-based approaches shows that a knowledge deficit early in a program
    can cascade through design and production, leaving decision makers with less knowledge
    to support decisions about when and how to move into subsequent acquisition phases
    that require more budgetary resources. Under a knowledge-based approach, demonstrating
    technology maturity is a prerequisite for moving forward into system development,
    during which time the focus should be on design and integration. Similarly, a
    stable and mature design is also a prerequisite for moving into production, where
    the focus should be on efficient manufacturing. Appendix III provides additional
    details about key practices at each of the knowledge points.


    ^10 GAO, *Best Practices: DOD Can Achieve Better Outcomes by Standardizing the
    Way Manufacturing Risks Are Managed*, GAO-10-439 (Washington, D.C.: Apr. 22, 2010);
    *Best Practices: High Levels of Knowledge at Key Points Differentiate Commercial
    Shipbuilding from Navy Shipbuilding*, GAO-09-322 (Washington, D.C.: May 13, 2009);
    *Defense Acquisitions: A Knowledge-Based Funding Approach Could Improve Major
    Weapon System Program Outcomes*, GAO-08-619 (Washington, D.C.: July 2, 2008);
    *Best Practices: Capturing Design and Manufacturing Knowledge Early Improves Acquisition
    Outcomes*, GAO-02-701 (Washington, D.C.: July 15, 2002); *Best Practices: Better
    Matching of Needs and Resources Will Lead to Better Weapon System Outcomes*, GAO-01-288
    (Washington, D.C.: Mar. 8, 2001); and *Best Practices: Better Management of Technology
    Development Can Improve Weapon System Outcomes*, GAO/NSIAD-99-162 (Washington,
    D.C.: July 30, 1999).'
