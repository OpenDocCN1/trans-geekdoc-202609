    # Production Readiness


    Boeing has manufactured four development aircraft and two low-rate initial production
    aircraft for use in testing. It is also in the process of producing 30 additional
    low-rate initial production aircraft. According to program officials, Boeing is
    completing some production work out of sequence due to the earlier wiring and
