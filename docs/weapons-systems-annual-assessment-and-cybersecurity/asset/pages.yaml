    # MQ-25 Unmanned Aircraft System (MQ-25 Stingray)


    The Navy''s MQ-25 will be a catapult-launched unmanned aircraft system (UAS) operating
    from aircraft carriers. When complete, it is primarily intended to provide a refueling
    capability for the carrier air wing and a secondary intelligence, surveillance,
    and reconnaissance (ISR) capability. The system is made up of an aircraft segment,
    a control station segment, and a carrier modification segment. It is the outcome
    of a restructure of the former Unmanned Carrier-Launched Airborne Surveillance
    and Strike (UCLASS) program.


