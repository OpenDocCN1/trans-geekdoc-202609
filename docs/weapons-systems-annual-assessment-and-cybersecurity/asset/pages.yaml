    Integrated Air and Missile Defense (IAMD)

    The Army''s Integrated Air and Missile Defense (IAMD) program is being developed
    to network sensors, weapons, and a common battle command system across an integrated
    fire control network to support the engagement of air and missile threats. The
    IAMD battle command system will provide a capability to control and manage IAMD
    sensors and weapons, such as the Sentinel radar and Patriot launcher and radar,
    through an interface module that supplies battle management data and enables networked
    operations.

    Source: Northrop Grumman


