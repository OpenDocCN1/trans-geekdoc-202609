- pgno: 213
  md: 'well as necessary rework affecting initial production lots. Officials stated
    that the government’s liability for cost growth is capped by the production contracts’
    terms and that the contractor is exploring opportunities to reduce production
    costs. Officials added that the use of a fixed-price incentive contract reduces
    the cost risk for the government because the contractor generally must absorb
    costs that exceed the price ceiling.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
