    said that the current developmental test phase, which began at Pacific Missile
    Range Facility in August 2016, included live testing to demonstrate surface warfare
    and integrated air and missile defense capabilities. According to the program
    office, the combat systems integration test event completed in May 2017 led to
    lessons learned for both the radar and combat system that'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'will enable improvements in interfaces. The program office also said that modeling
    indicates the ability to support the needs of the Aegis operational requirements
