  md: '# Long Range Precision Fires (LRPF)


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_102_0.png)


    # Long Range Precision Fires (LRPF)


    The Army''s Long Range Precision Fires (LRPF) will be part of a family of ballistic
    missiles designed to attack area and point targets to planned ranges of at least
    300 kilometers. Each LRPF launch pod missile container is planned to hold one
    to four missiles. LRPF will be compatible with existing M142 and M270 rocket launch
    systems. LRPF is intended to replace the Army Tactical Missile System (ATACMS)
    and comply with statutory requirements for insensitive munitions and DOD policy
    on cluster munitions.


    CONCEPT 03/17 Technology development start 01/18 GAO review SYSTEM DEVELOPMENT
    01/21 Development start 10/22 Design review PRODUCTION 03/25 Low-rate decision
    07/26 Start operational test 12/26 End operational test 02/27 Initial capability


    # Program Essentials


    +   - Program office: Redstone Arsenal, AL

    +   - Prime contractors: Advanced Technology International, Lockheed Martin, and
    Raytheon

    +   - Contract types: Various cost-reimbursement types (technology maturation
    and risk reduction)

    +   - Next major milestone: Development start (January 2021)


    # Current Status


    LRPF entered technology development in March 2017, with the start of system development
    scheduled for 2021. The Army continues to refine its planned performance requirements
    for the system, and program officials stated that they expect these requirements
    to be approved in mid-2018.


    According to program officials, they continue to evaluate two requirements—LRPF
    range and lethality. The program officials stated that, in fiscal year 2017, the
    Army proposed an increase to the planned range requirement—from 300 to 400 kilometers—and
    considered an increase in the planned minimum number of missiles per launch container
    from one to two, with no change to the planned maximum of four. LRPF contractors
    subsequently conducted trade studies that found that the desired range and lethality
    could be met with two missiles per launch container.


    Under its technology maturation and risk reduction contracts, the Army plans to
    competitively prototype the LRPF system ahead of a planned “down-select” to a
    single contractor for system development. According to the program office, it
    has contracted for four prototypes each from Lockheed Martin and Raytheon. The
    Army plans to conduct a preliminary design review in November 2018. Following
    the review, both contractors will conduct three flight tests each between July
    and December 2019. The Army plans to use the results of these tests and the preliminary
    design review to inform its source selection for system development.


