  md: '+   - A cyber vulnerability is a weakness in a system that could be exploited
    to gain access or otherwise affect the system’s confidentiality, integrity, and
    availability.¹

    +   - A cybersecurity threat is anything that can exploit a vulnerability to harm
    a system, either intentionally or by accident.

    +   - Cybersecurity risk is a function of the threat (intent and capabilities),
    vulnerabilities (inherent or introduced), and consequences (fixable or fatal).


    **Key Concept**


    Security Controls are safeguards or countermeasures to protect the confidentiality,
    integrity, and availability of a system and its information.


    For example, a firewall is a common control to allow or block traffic based on
    a set of rules. Because it is impossible to define a rule for every scenario,
    attackers look for ways to access a system that are not covered by the rules.
    For example, a firewall may block traffic from a specific country, but attackers
    may make it appear that they are in a country that is not blocked. They may use
    tools to avoid the firewall, such as embedding malicious software in an e-mail
    and waiting for a user to open it and inadvertently install the code.


    Source: GAO analysis of NSA and NIST information. | GAO-19-128


    Although some weapon systems are purely IT systems, most—such as aircraft, missiles,
    and ships—are what the National Institute of Standards and Technology (NIST) and
    sometimes DOD refer to as “cyber-physical systems.” NIST defines these systems
    as “co-engineered interacting networks of physical and computational components.”¹²
    These cyber systems can affect the physical world so the consequences of a cyber
    attack'
