  md: '# SDB II Program


    # Technology Maturity and Design Stability


    SDB II''s four critical technologies—guidance and control, multi-mode seeker,
    net ready data link, and payload—are mature. These technologies were not mature
    until May 2015, almost 5 years after development start. The program reported that
    SDB II had a stable design at its January 2011 design review. After production
    start, qualification and flight test failures revealed deficiencies in SDB II''s
    design that required hardware and software changes. Even so, the program reported
    it has currently released 100 percent of design drawings. Due to the aforementioned
    changes, and because, according to officials, the contractor does not track revisions
    to previously released design drawings, there is not visibility into whether the
    design stability reported at critical design review has since been disrupted.
    We have updated our attainment of product knowledge table from what we reported
    in 2017 to reflect this lack of visibility.


    Since October 2016, the program has conducted a Government Confidence Test (GCT)
    phase, which is intended to conduct 28 shots in flight in normal attack mode.
    The program added these tests at the direction of the Office of the Secretary
    of Defense to test against additional, real world scenarios. To date, the program
    conducted tests of 24 shots. Four tests did not achieve their objectives. Specifically,
    one did not impact a moving target, two did not impact a stationary target, and
    one did not impact a stationary wheeled target at long range. A fifth test missed
    its target but detonated near the target, and officials stated it was deemed successful.
    They said these failures were largely the result of software deficiencies and
    most involved problems with the aircraft relaying inaccurate or incomplete information
    to the weapon. These failures and issues scheduling the test range resulted in
    a 5-month flight test delay. The program has released new software updates to
    address these failures and has plans for further updates.


    Continued software rework and flight-test failure investigations have further
    delayed GCT flight tests to the extent that the program is now at risk of a schedule
    breach. Following completion of the GCT, the program'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'plans to conduct 55 operational test shots over a 1-year period. To help mitigate
    a possible schedule breach, program officials stated they may count some development
    flight tests towards the 55 total shot operational tests to reduce the overall
    number of tests needed.


    # Production Readiness


    In prior assessments, we have reported that SDB II manufacturing processes were
    mature. However, based on updated information provided by the program office for
    our 2018 assessment, we determined that the program has not achieved this maturity.


    The program reports that the contractor began low-rate initial production of the
    first 144 units (Lot 1) in March 2017 with a 2-month delayed delivery date for
    some necessary rework, from the end of August 2017 to the end of October 2017.
    Officials reported it awarded a second production contract (Lot 2) in September
    2016 for 250 additional units, a third contract (Lot 3) in January 2017 for 312
    additional units, and a fourth contract (Lot 4) in February 2018 for 570 units.
    Officials reported that, as of February 2018, 65 Lot 2 weapons were delivered
    according to the contract schedule.


    The Air Force is the sole customer for the first three production lots. The program
    office stated that the Navy does not intend to procure any SDB II quantities until
    Lot 4, and that the Navy may be affected by funding limitations under continuing
    resolutions. In fiscal year 2013, the Navy revised its platform integration strategy
    because it plans to field SDB II from F/A-18E/F aircraft prior to integrating
    it with F-35 aircraft. Officials said that the weapon’s integration with the F/A-18E/F
    is scheduled for fiscal year 2020 and integration with the F-35 for September
    2022.


    # Other Program Issues


    In 2017, the contractor reported cost growth on contracts covering the first three
    production lots. Program officials said they expect this growth to occur in the
    first five production lots and stated it is due to the contractor’s overly aggressive
    cost proposals early in the system development phase as'
  merge: -1
