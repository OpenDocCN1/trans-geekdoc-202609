  md: '# DOD Has Undertaken Initiatives, in Part Directed by Congress, to Help Understand
    and Address Weapon Systems’ Cyber Vulnerabilities


    Section 1647 of the National Defense Authorization Act for Fiscal Year 2016 requires
    the Secretary of Defense to evaluate the cyber vulnerabilities of each DOD weapon
    system by the end of 2019 and develop strategies to mitigate risks stemming from
    those vulnerabilities.50 In response to this direction and The DOD Cyber Strategy,
    which also calls for DOD to assess and initiate improvements to the cybersecurity
    of current and future weapons systems, DOD is taking steps to improve its understanding
    of its weapon systems’ vulnerabilities, determine how to mitigate risks from those
    vulnerabilities, and inform future development of more secure systems. The Office
    of the Under Secretary of Defense (Acquisition and Sustainment) is leading this
    initiative in collaboration with military test organizations. DOD is compiling
    existing vulnerability information and conducting some new tests to provide information
    about the cybersecurity posture of individual systems, concentrating mostly on
    fielded systems. These assessments are important, in part because some of those
    systems did not undergo cybersecurity testing prior to fielding and DOD does not
    have a permanent process in place to periodically assess the cybersecurity of
    fielded systems. Furthermore, vulnerabilities and risks can change after fielding
    as system software becomes obsolete.


    As part of this initiative, for two mission areas, the Office of the Under Secretary
    of Defense (Acquisition and Sustainment) has been trying to incorporate cybersecurity
    into large scale military exercises to take a more integrated look at impacts
    of vulnerabilities across systems. The goal is to understand how vulnerabilities
    in some systems may affect DOD’s ability to achieve its mission and to identify
    what other options are available to complete a mission if certain capabilities
    were disabled or degraded. This'
  merge: -1
