  md: '# B-2 Extremely High Frequency Satellite Communications (B-2 EHF SATCOM)


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_218_0.png)


    # B-2 Extremely High Frequency Satellite Communications (B-2 EHF SATCOM)


    The Air Force''s B-2 EHF SATCOM is one of several efforts to modernize and upgrade
    the B-2 bomber aircraft. B-2 EHF SATCOM will replace an aging system with a new
    one to provide reliable, two-way, secure, and survivable communications capability
    to the B-2 during conventional and nuclear missions. This effort includes technology
    maturation leading to the development, procurement, and installation of radio,
    antenna, and related components.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_218_1.png)


    # Program Essentials


    +   - Program office: Wright-Patterson Air Force Base, OH

    +   - Prime contractor: TBD

    +   - Contract type: TBD

    +   - Next major milestone: Development start (October to December 2018)


    # Estimated Program Cost (fiscal year 2018 dollars in millions)


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_218_2.png)


    # Planned quantities


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_218_3.png)


    # Current Status


    In 2017, the Air Force placed the B-2 EHF SATCOM program on hold—a status that
    remained in place at the time of our review. According to program officials, this
    hold resulted from analysis that projected the program would deliver a poor return
    on investment. Consequently, the program reported that it is not planning to request
    funding for fiscal year 2019. Funding budgeted for the effort in fiscal years
    2016 through 2018 totaled $170.44 million.


    The Air Force initially planned to develop the B-2 EHF SATCOM system in three
    increments. The program began Increment 1 development in 2007 and completed it
    in 2016 at a cost of $540.4 million. This increment upgraded the B-2''s computing
    and information systems so the EHF SATCOM system could be installed and to allow
    for other future upgrades. In December 2013, the Air Force terminated the other
    two increments—which, together, would have enabled the B-2 to interface with DOD''s
    information technology infrastructure—because of funding uncertainties and delays
    in a related program that would have provided B-2 communications terminals.


    In October 2016, the Air Force initiated plans to combine the previously canceled
    increments under a new B-2 EHF SATCOM program. At that time, the Air Force estimated
    that this new program would cost $1.18 billion in total and planned to begin technology
    development in the fourth quarter of fiscal year 2017.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program stated that the Air Force intended to provide a system that ensured
    secure command and control communications in modern battlespace. It also said
    the system was intended to replace an existing satellite communication system.
    According to the program, the Air Force''s "Bomber Vector" roadmap established
    future planning guidance for the bomber force. Per program officials, the Air
    Force developed a plan to retire the B-2A bomber as the B-21 bomber begins fielding,
    while still maintaining the necessary force structure for both nuclear and conventional
    missions. Officials further said that, based on the timing of that transition,
    it was not prudent to continue EHF SATCOM as B-2 retirements would begin less
    than a decade after the EHF SATCOM systems were fielded.'
