- pgno: 51
  md: '# EIGHT OBSERVATIONS FROM OUR ASSESSMENT

    OF KNOWLEDGE ATTAINED BY PROGRAMS AT KEY

    JUNCTURES AND RELATED IMPLICATIONS FOR

    TESTING AND SOFTWARE DEVELOPMENT


    Our analysis of 57 selected programs shows that DOD programs continue to not fully
    implement knowledge-based acquisition practices. We observed several current and
    future programs have proceeded, or plan to proceed, into system development, through
    critical design reviews, and into production without meeting key acquisition practices,
    thereby increasing their risk of undesirable cost, schedule, and performance outcomes.
    At the same time, based on an exploratory statistical analysis of our previous
    work dating back to 2003, we observed MDAPs that implemented one or more of three
    specific knowledge-based acquisition practices had lower cost and schedule growth
    than those that did not.²³ This analysis provides additional insight as to the
    importance of following a knowledge-based acquisition approach, yet this pattern
    remains the exception, not the norm. We observed that programs frequently accept
    knowledge shortfalls, even if it impairs performance in the near-term, in order
    to produce or deliver their capability in accordance with their schedules. In
    addition to the shortfalls at our three knowledge points, we also observed acceptance
    of knowledge shortfalls in program schedules for (1) developmental testing and
    production, (2) software development, and (3) initial operational test and evaluation.


    ²³ Our exploratory statistical analysis examined eight key knowledge-based acquisition
    practices, which we have annually assessed individual programs on since 2003,
    and select programs’ cost and schedule changes. We found that three of the eight
    key practices held a statistically significant relationship to programs’ cost
    and schedule changes. See appendix II for more information.'
  merge: -1
  img_proc: true
