  md: 'Unmanned Aircraft System, and potentially other future carrier-based aircraft.
    The restructure also accelerated the development of the program’s aircraft auto-land
    capabilities. The changes associated with the restructure increased the development
    funding needed by the program and reduced system quantities, resulting in unit
    cost growth and a critical breach of statutory unit cost thresholds in March 2014.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_125_0.png)


    # Joint Precision Approach and Landing System (JPALS)


    JPALS is a program to develop a Global Positioning System (GPS)-based aircraft
    landing system that will allow aircraft such as the F-35 Lightning II and the
    MQ-25 Unmanned Aircraft System to operate from aircraft carriers and amphibious
    assault ships. JPALS intends to provide a reliable, sea-based precision approach
    and landing capability that is effective in adverse weather conditions. JPALS
    functionality is primarily software-based, although it will also feature off-the-shelf
    hardware such as antennas and racks.


