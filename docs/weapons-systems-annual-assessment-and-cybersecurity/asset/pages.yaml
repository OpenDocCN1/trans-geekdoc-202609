- pgno: 271
  md: '# WHY GAO DID THIS STUDY


    DOD plans to spend about $1.66 trillion to develop its current portfolio of major
    weapon systems. Potential adversaries have developed advanced cyber-espionage
    and cyber-attack capabilities that target DOD systems. Cybersecurity—the process
    of protecting information and information systems—can reduce the likelihood that
    attackers are able to access our systems and limit the damage if they do.


    GAO was asked to review the state of DOD weapon systems cybersecurity. This chapter
    addresses (1) factors that contribute to the current state of DOD weapon systems’
    cybersecurity, (2) vulnerabilities in weapons that are under development, and
    (3) steps DOD is taking to develop more cyber resilient weapon systems.


    To do this work, GAO analyzed weapon systems cybersecurity test reports, policies,
    and guidance. GAO interviewed officials from key defense organizations with weapon
    systems cybersecurity responsibilities as well as program officials from a non-generalizable
    sample of nine major defense acquisition program offices.


    # WHAT GAO RECOMMENDS


    GAO is not making any recommendations at this time. GAO will continue to evaluate
    this issue.


    # WHAT GAO FOUND


    The Department of Defense (DOD) faces mounting challenges in protecting its weapon
    systems from increasingly sophisticated cyber threats. This state is due to the
    computerized nature of weapon systems; DOD’s late start in prioritizing weapon
    systems cybersecurity; and DOD’s nascent understanding of how to develop more
    secure weapon systems.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'DOD weapon systems are more software dependent and more networked than ever
    before (see Figure).


    Automation and connectivity are fundamental enablers of DOD’s modern military
    capabilities. However, they make weapon systems more vulnerable to cyber attacks.
    Although GAO and others have warned of cyber risks for decades, until recently,
    DOD did not prioritize weapon systems cybersecurity. Finally, DOD is still determining
    how best to address weapon systems cybersecurity.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_272_0.png)


    Source: GAO analysis of Department of Defense information. | GAO-19-128


    Embedded Software and Information Technology Systems Are Pervasive in Weapon Systems
    (Represented via Fictitious Weapon System for Classification Reasons).


    In operational testing, DOD routinely found mission-critical cyber vulnerabilities
    in systems that were under development, yet program officials GAO met with believed
    their systems were secure and discounted some test results as unrealistic. Using
    relatively simple tools and techniques, testers were able to take control of systems
    and largely operate undetected, due in part to basic issues such as poor password
    management and unencrypted communications. In addition, vulnerabilities that DOD
    is aware of likely represent a fraction of total vulnerabilities due to testing
    limitations. For example, not all programs have been tested and tests do not reflect
    the full range of threats.


    DOD has recently taken several steps to improve weapon systems cybersecurity,
    including issuing and revising policies and guidance to better incorporate cybersecurity
    considerations. DOD, as directed by'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Congress, has also begun initiatives to better understand and address cyber
    vulnerabilities. However, DOD faces barriers that could limit the effectiveness
    of these steps, such as cybersecurity workforce challenges and difficulties sharing
    information and lessons about vulnerabilities. To address these challenges and
    improve the state of weapon systems cybersecurity, it is essential that DOD sustain
    its momentum in developing and implementing key initiatives. GAO plans to continue
    evaluating key aspects of DOD’s weapon systems cybersecurity efforts.


    October 9, 2018


    The Honorable James M. Inhofe Chairman


    The Honorable Jack Reed

    Ranking Member

    Committee on Armed Services United States Senate


    The Department of Defense (DOD) plans to spend about $1.66 trillion to develop
    its current portfolio of weapon systems.¹ These weapons are essential to maintaining
    our nation’s military superiority and for deterrence. It is important that they
    work when needed, yet cyber attacks have the potential to prevent them from doing
    so. Cyber attacks can target any weapon subsystem that is dependent on software,
    potentially leading to an inability to complete military missions or even loss
    of life. Examples of functions enabled by software—and potentially susceptible
    to compromise—include powering a system on and off, targeting a missile, maintaining
    a pilot’s oxygen levels, and flying aircraft. An attacker could


    ¹ We use “weapon systems” and “acquisition programs” to refer to major defense
    acquisition programs. These include a broad range of systems, such as aircraft,
    ships, combat vehicles, radios, and satellites. They are programs that are estimated
    to require a total expenditure for research, development, test, and evaluation
    of more than $480 million, or for procurement of more than $2.79 billion, in fiscal
    year 2014 constant dollars, for all increments or are designated as such by DOD
    for oversight purposes. For more information, see GAO, Weapon Systems Annual Assessment:
    Knowledge Gaps Pose Risks to Sustaining Recent Positive Trends, GAO-18-360SP (Washington,
    D.C.: Apr. 25, 2018).'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'potentially manipulate data in these systems, prevent components or systems
    from operating, or cause them to function in undesirable ways.


    Some advanced threat actors are aware of this and have well-funded units that
    focus on positioning themselves to potentially undermine U.S. capabilities. For
    example, according to the National Security Agency (NSA), advanced threats are
    targeting national security systems. According to the Department of Homeland Security’s
    U.S. Computer Emergency Readiness Team and industry reports, advanced threats
    may conduct complex, long-term cyber attack operations. These reports show that
    threats may employ cyber reconnaissance, such as probing systems, and cyber espionage,
    such as cyber theft, to develop detailed knowledge of the target system to design
    and deploy more damaging attacks.


    Furthermore, in 2017, the Director of National Intelligence testified that some
    adversaries remain undeterred from conducting reconnaissance, espionage, influence,
    and even attacks in cyberspace.²


    Cybersecurity is the process of protecting information and information systems
    by preventing, detecting, and responding to attacks. It aims to reduce the likelihood
    that attackers can access DOD systems and limit the damage if they do.³ Since
    1997, we have designated federal information security—another term for cybersecurity—as
    a government-wide high-risk area.⁴ We have also reported and made hundreds of
    recommendations on a wide range of topics related to cybersecurity, such as information
    security programs across the federal government, privacy of personally identifiable
    information, critical infrastructure, and federal facility cybersecurity.⁵ We


    ² Coats, Worldwide Threat Assessment of the US Intelligence Community, testimony
    delivered to the Senate Select Committee on Intelligence on May 11, 2017.


    ³ Definition adapted from National Institute of Standards and Technology, Framework
    for Improving Critical Infrastructure Cybersecurity, Version 1.1 (Apr. 16, 2018).


    ⁴ GAO, High-Risk Series: Information Management and Technology, GAO/HR-97-9 (Washington,
    D.C.: February 1997); and High-Risk Series: Urgent Actions Are Needed to Address
    Cybersecurity Challenges Facing the Nation, GAO-18-622 (Washington, D.C: Sept.
    6, 2018).


    ⁵ See for example: GAO, Federal Information Security: Agencies Need to Correct
    Weaknesses and Fully Implement Security Programs, GAO-15-714 (Washington, D.C.:
    Sept. 29, 2015); Information Security: IRS Needs to Further Improve Controls over
    Financial and Taxpayer Data, GAO-16-398 (Washington, D.C.: Mar. 28, 2016); Critical
    Infrastructure Protection: Additional Actions Are Essential for Assessing Cybersecurity
    Framework Adoption, GAO-18-211 (Washington, D.C.: Feb. 15, 2018); Federal Facility.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'have found that the federal government needs to, among other things, improve
    its abilities to detect, respond to, and mitigate cyber incidents and expand its
    cyber workforce planning and training efforts.


    You asked us to conduct a series of reviews on DOD’s efforts to improve the cybersecurity
    of the weapon systems it develops. This chapter addresses (1) factors that contribute
    to the current state of DOD weapon systems cybersecurity, (2) vulnerabilities
    in weapons that are under development, and (3) steps DOD is taking to develop
    more cyber resilient weapon systems. We focused primarily on weapon systems that
    are under development.


    To identify factors that contribute to the current state of DOD weapon systems
    cybersecurity, we reviewed reports issued from 1991 to the present on software,
    information technology (IT), networking, and weapon systems from the National
    Research Council, the Defense Science Board (DSB), GAO, and other organizations
