  md: '+   - Initial operational test and evaluation is a separate event that is intended
    to evaluate a system’s effectiveness and suitability under realistic operational
    conditions before a program makes a full-rate production decision.

    +   - Consequently, programs can declare initial operational capability on the
    basis of full, partial, or no initial operational test and evaluation.

    +   - We observed that 5 programs declared, or plan to declare, initial operational
    capability before initial operational test and evaluation begins. Another 11 programs
    declared, or plan to declare, this capability before the testing completes.

    +     - Programs that declare initial capability before completing initial operational
    test and evaluation risk fielding systems to warfighters that are not operationally
    effective or suitable for the missions they will be tasked to perform.

    +   - These totals represent a significant change over last year’s assessment,
    which we attribute in part to additional visibility we gained into programs’ operational
