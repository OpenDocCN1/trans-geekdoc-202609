- pgno: 255
  md: '# Table 12. Best Practices for Knowledge-based Acquisitions


    | Best Practices |

    |---|

    | **Knowledge Point 1:** Technologies, time, funding, and other resources match
    customer needs. Decision to invest in product development. |

    | Demonstrate technologies to a high readiness level—Technology Readiness Level
    7—to ensure technologies are fit, form, function, and work within a realistic
    environment* |

    | Ensure that requirements for product increment are informed by system-level
    preliminary design review using system engineering process (such as prototyping
    of preliminary design) |

    | Establish cost and schedule estimates for product on the basis of knowledge
    from system-level preliminary design using system engineering tools (such as prototyping
    of preliminary design) |

    | Constrain development phase (5 to 6 years or less) for incremental development
    |

    | Ensure development phase fully funded (programmed in anticipation of milestone)
    |

    | Align program manager tenure to complete development phase |

    | Contract strategy that separates system integration and system demonstration
    activities |

    | Conduct independent cost estimate |

    | Conduct independent program assessment |

    | Conduct major milestone decision review for development start |

