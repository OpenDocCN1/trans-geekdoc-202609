    By not incorporating cybersecurity into key aspects of the requirements and acquisition
    processes, DOD missed an opportunity to give cybersecurity a more prominent role
    in key acquisition decisions. Numerous officials we met with said that this failure
    to address weapon systems cybersecurity sooner will have long-lasting effects
    on the department. Due to this lack of focus on weapon systems cybersecurity,
    DOD likely has an entire generation of systems that were designed and built without
    adequately considering cybersecurity. Bolting on cybersecurity late in the development
    cycle or after a system has been deployed is more difficult and costly than designing
    it in from the beginning. Not only is the security of those systems and their
    missions at risk, the older systems may put newer systems in jeopardy. Specifically,
    if DOD is able to make its newer systems more secure, but connects them to older
    systems, this puts the newer systems at risk. Furthermore, even if they are not
    connected, if the newer systems depend on the older systems to help fulfill their
