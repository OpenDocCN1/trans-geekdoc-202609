- pgno: 130
  md: '# Production Readiness


    To date, the Navy has accepted delivery of 11 LCSs and another 15 are in various
    phases of construction. In 2015, the Navy provided the LCS shipbuilders schedule
    relief; however, even with revised delivery dates, shipbuilders continue to deliver
    LCS seaframes behind schedule. Program officials told us that the shipyards will
    not deliver four LCSs as planned in fiscal year 2017. The Navy accepted delivery
    of LCS 9 and LCS 12 in September 2017, both approximately 18 months behind schedule.
    LCS 11 and LCS 14, which were also planned for delivery in 2017, began acceptance
    trials in December 2017 and delivery has been delayed to approximately February
    2018. The Navy still expects to take delivery of four additional seaframes in
    2018—LCS 13, LCS 15, LCS 16, and LCS 18—all of which will be delivered, on average,
    15 months later than the original schedule.


    # Other Program Issues


    In December 2016, DOT&E reported that the ability of LCS to perform its intended
    missions depends upon the effectiveness of both the seaframe and its installed
    mission packages, which have yet to be demonstrated as effective. Additionally,
    a September 2017 LCS seaframe program office risk assessment noted that if the
    LCS program is unable to deliver LCSs that are operationally ready, the delay
    may affect fleet schedules and operations.


    Over the past 2 years, the Navy has reported diminishing program cost savings.
    While program officials stated that some of the decrease is attributable to a
    change in how the savings were previously calculated, they also cited recent funding
    instability associated with the Navy operating under a continuing resolution that
    increased the costs to complete ship construction and offset some of the forecasted
    savings. Further, the program has also identified schedule and cost risks that
    may arise if the LCS shipbuilders are unable to sustain their workforces because
    of uncertainty in their business base after fiscal year 2019. According to the
    program office, this could occur in part as a result of the acquisition'
