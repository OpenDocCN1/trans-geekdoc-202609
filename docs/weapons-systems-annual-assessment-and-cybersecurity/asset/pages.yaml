    # John Lewis Class Fleet Replenishment Oiler (T-AO 205)


    # T-AO 205 Program


    # Technology Maturity


    The Navy matured Lewis class critical technologies prior to initiating detail
    design, which is a best practice in shipbuilding. In 2014, the Navy identified
    three critical technologies for the Lewis-class design. All three technologies
    were associated with a new underway replenishment system for transferring cargo
    to other ships. When the program conducted a Technology Readiness Assessment,
    the results of land-based and at-sea prototype testing of these technologies showed
    that they were fully mature, and the Navy determined that no further technology
    development would be necessary. We have previously reported that fully maturing
    technologies prior to beginning detail design is an important step in reducing
    risk of cost growth and schedule delay. In 2017, the Navy opted to drop one of
    the three technologies, the Heavy e-STREAM cargo delivery system, designed to
    deliver loads too heavy for the standard e-STREAM system. Navy officials told
    us that they originally needed the Heavy system to deliver power modules for the
    F-35 Lighting II, but the Navy has since decided to use aircraft to deliver these
    modules, thus negating the requirement. As a result, Lewis class ships will now
    be able to deliver all of their solid cargo using the standard system.'
