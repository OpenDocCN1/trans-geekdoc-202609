    # Amphibious Ship Replacement (LX(R))


    The Navy''s LX(R) program plans to build a new class of ships to replace existing
    amphibious ships, which the Navy uses to transport Marines and their equipment
    to distant operating areas and enable expeditionary operations ashore. The LX(R)
    will include a larger hull than the retiring ships, and will also be used for
    non-combat operations due to its storage space and ability to transfer people
    and supplies. Starting in fiscal year 2020, the Navy plans to procure 13 ships
    with delivery of the first LX(R) scheduled for 2026.


