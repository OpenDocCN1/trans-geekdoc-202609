  md: 'primarily for National Security Space missions to meet statutory assured access
    to space requirements.


    The Air Force stated that to avoid a gap in launch capability for National Security
    Space launch missions, the Air Force awarded agreements in early 2016, utilizing
    DOD’s “other transaction” authority, for rocket propulsion system development.
    According to the program office, the awardees are on track for propulsion systems
    to be qualified and ready for production by 2019 to support the program’s requirement
    for assured access to space.


    Furthermore, in October 2017, the EELV program office released a Launch Service
    Agreement request for proposals and by summer 2018 plans to award at least three
    other transaction agreements to develop launch vehicle prototypes capable of meeting
    national security requirements. The Air Force is requesting proposals for shared
    public-private investment in the launch systems. According to the program, in
    2019, it plans to award contracts to two of the launch providers for a combined
    total of approximately 25 launches to occur from 2022 through 2026.


    Implementing a strategy to support multiple providers may prove challenging as
    the program stated that it expects demand for national security launches to decline
    from about eight per year to five per year from 2022 to 2026 and providers will
    have to rely more heavily on conducting civil government and commercial launches,
    which have historically been difficult to predict. However, the Air Force recently
    released a request for information to gather detailed data from potential launch
    providers on the number of launches they require to close their business cases.


    The Air Force may face challenges in supporting additional launches of its heaviest
