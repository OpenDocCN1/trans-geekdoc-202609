    # ### Current Status


    In early 2019, the Navy plans to award a multi-billion dollar, multi-year procurement
    contract for construction of 10 Block V submarines. Under the Navy''s plan, all
    Block V ships will include the acoustic superiority improvements, while the new
    mid-body section (called the Virginia Payload Module) will be added starting with
    the second Block V submarine. According to program officials, the design of Block
    V submarines will differ from Block IV submarines by approximately 20 percent.
    Of this redesigned 20 percent, the program office considers 70 percent to constitute
    major changes. The program office completed basic and functional designs by lead
    ship construction start, which would be consistent with GAO-identified best practices.
    However, the program is currently behind schedule in its design efforts for the
    new payload module. While the program office has identified plans to recover from
    these design delays, success will hinge on the Navy and shipbuilders'' ability
    to sufficiently staff remaining Block V design workload corresponding with ongoing
    design efforts for the new Columbia class ballistic missile submarine. Similarly,
    construction will require the shipyards to manage the demands from both programs
    since Columbia class starts construction in fiscal year 2021.


    According to the Navy''s justification materials for the planned multi-year procurement,
    the Block V submarine unit cost totals approximately $48 million more in constant
    year 2018 dollars than the unit cost for Block IV submarines. The Block V effort
    is under the SSN 774 major defense acquisition program, which was downgraded in
    2015 by the Office of the Secretary of Defense (OSD) to be under Navy—and not
    OSD-level—program oversight. SSN 774 had already completed its required milestone
    reviews before the introduction of Block V but, according to program officials,
    the program continues to conduct regular Navy-level oversight reviews. The Navy
    also is not planning to develop an independent cost estimate for the Block V prior
    to awarding the multi-billion dollar contract, but has developed a program cost
    assessment and holds cost-related meetings with OSD.


