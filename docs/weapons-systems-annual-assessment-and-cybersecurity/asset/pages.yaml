    not provide adequate capability. The ASW package now consists of the Escort Mission
    and the Light Weight Tow Torpedo Defense modules. According to the Navy, the ASW
    systems are mature as they have been deployed and operated by U.S. Navy and foreign
    navies. Program officials stated that they have resolved excess weight issues
