  md: 'the 34 programs with established affordability constraints, all but one reported
    that they were on track to stay under their identified cost constraint.


    DOD Instruction 5000.02 requires DOD components to develop life-cycle affordability
    goals early in the acquisition process, as well as affordability caps before starting
    system development, for major defense acquisition programs. These goals and caps,
    also referred to as constraints, should be stated in terms of procurement unit
    cost and sustainment costs.


    Affordability constraints are intended to ensure that capability requirements
    prioritization and cost tradeoffs occur as early as possible and throughout a
    program’s life cycle, as well as to keep unaffordable programs from entering or
    remaining within the acquisition process. DOD policy instructs that when approved
    affordability constraints cannot be met, a program’s technical requirements, schedule,
    and required quantities must be revisited by DOD. Under the policy, if the program
    still cannot meet its constraints, and DOD cannot raise the program’s affordability
    constraints by obtaining approval to lower constraints elsewhere, the program
    is to be canceled.


    +   - The 23 programs that do not have established affordability constraints include
    those that:

    +     - have not started system development,

    +     - were already in production prior to the affordability constraint requirement,

    +     - currently operate under legislatively mandated cost caps, or

    +     - are a nonstandard program or a development-only program with no planned
    procurement phase.

    +   - Of the 34 programs that report establishing affordability constraints, 33
