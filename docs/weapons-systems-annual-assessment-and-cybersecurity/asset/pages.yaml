  md: '# JAGM Program


    # Technology Maturity


    JAGM has three critical technologies—the guidance seeker assembly/sensor platform,
    sensor software, and mission software, all of which the program has assessed as
    mature following two successful test shot events in June 2016. JAGM components,
    including the motor, warhead, and electronics, are common with the existing Hellfire
    missile. The Army''s decision to include these components in the JAGM design followed
    a 2010 system-level preliminary design review (PDR) and a 2012 program restructuring,
    which included extending technology development by more than 2 years to address
    affordability concerns and risk reduction needs. JAGM did not conduct a second
    PDR following this restructuring because the program had already conducted a system-level
    PDR in 2010.


    # Design Stability


    At the January 2016 critical design review (CDR), the program had released over
    90 percent of JAGM drawings—performance consistent with our best practices criteria
    for design stability. Since then, the total number of JAGM drawings has increased
    slightly, but not to an extent that undermines the program’s design stability.
    The program now expects 199 engineering drawings at program completion and has
    released 96 percent of these drawings to manufacturing.


    # Production Readiness


    JAGM will be manufactured at the same facility as the Hellfire missile. The program
    office is tracking 15 different metrics related to hardware and software to assess
    JAGM''s readiness for production. According to program officials, these metrics
    currently meet expected values, and the program expects all production processes
    to be mature prior to low-rate initial production.


    Nevertheless, the program is monitoring a risk related to consistently producing
    a circuit card coating material within specifications. Program officials stated
    that they are addressing this production issue, which affects'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'circuit cards in the missile’s guidance section, with the subcontractor and
    also exploring alternative materials that could be used.


    In August 2017, program officials reported a 6-month delay to JAGM’s low-rate
    initial production decision. The program officials reported that this delay stems
    from a combination of production issues from the JAGM contractor, Lockheed Martin,
    that have delayed test asset deliveries needed to complete system development.
    Despite these delays, program officials expect that the initial capability and
    full-rate production dates outlined in JAGM’s revised August 2017 acquisition
    program baseline remain achievable.


    # Other Program Issues


    The Army has delayed initial operational testing and evaluation (IOT&E) by 2 years
    because the AH-64 Apache helicopter''s current software—used to launch Hellfire
    missiles—requires more pilot input to access JAGM functionality than expected.
    New platform software in development will enable pilots to select the full range
    of options with far less physical interface with the platform. Flight testing
    of this new software is planned for the fourth quarter of fiscal year 2018 to
    be followed by IOT&E.


    In the interim, the program has plans to conduct a limited user test of 10 missile
    shots with existing platform software and hardware to demonstrate the missile''s
    capabilities. The Army previously scheduled this limited user test for May 2017,
    but has since delayed it to January 2018. Program officials stated that they do
    not expect any material changes to the missile between the limited user test and
    IOT&E.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office did not have any comments.'
