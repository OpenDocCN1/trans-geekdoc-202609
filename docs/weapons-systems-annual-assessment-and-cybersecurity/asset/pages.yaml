  md: "# # Small Diameter Bomb Increment II (SDB II)\n\n![](img/43698ea8af5a4b46ccccdfa98ec6b016_210_0.png)\n\
    \n**Small Diameter Bomb Increment II (SDB II)**\n\nThe Air Force's Small Diameter\
    \ Bomb Increment II (SDB II) is a joint interest program with the Navy and is\
    \ designed to provide attack capability against mobile targets in adverse weather\
    \ from extended range. It combines radar, infrared, and semi active laser sensors\
    \ in a tri-mode seeker to acquire, track, and engage targets. It uses airborne\
    \ and ground data links to update target locations, as well as a global positioning\
    \ system and an inertial navigation system to ensure accuracy. SDB II will be\
    \ integrated with Air Force and Navy aircraft, the F-15E, F/A-18E/F, and F-35\
    \ aircraft, among others.\n\n![](img/43698ea8af5a4b46ccccdfa98ec6b016_210_1.png)\n\
    \n### Program Essentials\n\n**Program office:** Eglin Air Force Base, FL  \n**Prime\
    \ contractor:** Raytheon  \n**Contract types:** Fixed-price incentive (development);\
