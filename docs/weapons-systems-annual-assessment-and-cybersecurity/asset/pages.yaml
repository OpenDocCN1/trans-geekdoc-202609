  md: '# KC-46 Tanker Modernization Program (KC-46A)


    The Air Force''s KC-46A program plans to convert an aircraft designed for commercial
    use into an aerial refueling tanker for operations with Air Force, Navy, Marine
    Corps, and allied aircraft. The program is the first of three planned phases to
    replace roughly a third of the Air Force''s aging aerial refueling tanker fleet,
    comprised mostly of KC-135s. The Air Force has designed the KC-46A to improve
    on the KC-135''s refueling capacity, efficiency, and capabilities for cargo and
    aeromedical evacuation, and to integrate defensive systems.


