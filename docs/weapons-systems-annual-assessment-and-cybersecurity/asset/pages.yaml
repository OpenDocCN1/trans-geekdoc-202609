    the AIM-9X interceptor, the Integrated Air and Missile Defense (IAMD) Battle Command
    System (IBCS), and the multi-mission launcher. Specifically, systems pose potential
    integration challenges to Block 1 system development because their capabilities
    will be used in new ways to prosecute different threats.


    The Army’s IAMD program will produce the IBCS, which is currently designed to
    control the Patriot missile launcher and radar system. However, the IAMD program
