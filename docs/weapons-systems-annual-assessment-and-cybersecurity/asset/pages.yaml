  md: '# CVN 78 Class Program


    # Technology, Design, and Production Maturity


    In May 2017, the Navy accepted delivery of the lead ship in the Ford class (CVN
    78), despite the carrier’s reliance on immature technologies and struggle to demonstrate
    the reliability of mature systems. CVN 78 began construction with immature technologies
    and an incomplete design, leading to cost and schedule growth. The ship delivered
    20 months later than the Navy planned, with construction-related work still remaining
    and over 40 serious deficiencies that could impact ship operation or safety. As
    of January 2018, the Navy reported 11 of the program’s 13 critical technologies
    are mature. Shipboard testing continues for several critical systems, including
    the advanced weapons elevators, electromagnetic aircraft launch system (EMALS),
    advanced arresting gear (AAG), and dual band radar (DBR). The elevators, AAG,
    and DBR are struggling to meet reliability targets the Navy uses in assessing
    ship performance. If these systems cannot show reliability, CVN 78 may not demonstrate
    it can rapidly launch and recover aircraft—a key requirement for the new class
    of carriers. The Navy reported EMALS is now meeting reliability targets; however,
    the Director, Operational Test and Evaluation, raised concerns because the Navy
    lowered the EMALS reliability target. This lower target will also prevent the
    ship from meeting the program’s aircraft launch and recovery requirement.


    Until the Navy fully matures the CVN 78 class critical technologies, the form
    of these technologies and how they fit on the ship could evolve. Such changes,
    which are typical outcomes of technology development, could introduce the need
    for additional design changes to CVN 78 class ships. Despite this, construction
    continues on the second ship, CVN 79, which is 34 percent complete and the Navy
    will soon review proposals for the third ship, CVN 80. CVN 79 uses the CVN 78
    design with some modifications—that the Navy considers complete—most notably,
    replacement of DBR with the Enterprise Air Surveillance Radar (EASR), which is
    still in development and completed its critical design review in August 2017.
    The Navy does not identify this new system as a critical'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'technology in the Ford Class because it derives from the pre-existing Air and
    Missile Defense Radar. The Navy plans to procure two EASR units for CVNs 79 and
    80 and install the CVN 79 unit during that ship’s second phase of delivery. The
    Navy expects to receive and review shipbuilder proposals for CVN 80 in early 2018.
    The shipbuilder is already procuring materials for the third ship under the advance
    procurement contract the Navy reported it awarded in May 2016.


    # Other Program Issues


    In 2007, Congress established a procurement cost cap of $10.5 billion for CVN
    78, but lead ship procurement costs have since increased by 23 percent to the
    current cost cap of $12.9 billion. The National Defense Authorization Act (NDAA)
    for Fiscal Year 2016 reduced the cap for follow-on ships, including CVN 79 to
    $11.4 billion, although costs for this ship may also increase. In a prior report,
    we found that the funds the Navy budgeted for CVN 79 are likely to be insufficient
    to complete ship construction. Previously, the Navy expressed confidence that
    CVN 79 would deliver within its cost cap, which assumes unprecedented construction
    efficiency—namely that CVN 79 production hours will be over 18 percent lower than
    CVN 78. However, recent construction performance reporting shows the shipbuilder
    is not meeting this goal. If the shipbuilder cannot achieve its predicted efficiency
    gain, CVN 79 is at risk of exceeding its current $11.4 billion cost cap. The NDAA
    for Fiscal Year 2018 raises the cost cap for ships that follow CVN 79 to $12.6
    billion.


    The NDAA for Fiscal Year 2018 also provides the Secretary of Defense with another
    way to waive a fiscal year 2016 NDAA limitation on funding for CVN 79 that would
    not require a certification that the full ship shock trial be completed on CVN
    78. The Navy originally planned to defer this test until after CVN 78’s initial
    deployment. In a prior report, we raised concerns about the Navy’s plan to delay
    this trial because such tests can identify potential mission-critical failures
    before the ship is in an active combat environment. In 2015, the Deputy Secretary
    of Defense for Acquisition ordered the Navy to conduct the trial before the first
    deployment.'
