    Our work has led to multiple recommendations that DOD has generally or partially
    agreed with and made progress in implementing. For example, our previous work
    recommended DOD ensure programs conduct a preliminary design review prior to starting
    development, and DOD’s policy now reflects this. Further, our work has influenced
    efforts within DOD and Congress to address some of the challenges in the defense
    acquisition system—primarily, that it takes longer and costs more to develop and
    produce the systems required to perform DOD’s various missions and operations.
    Notably, the Weapon Systems Acquisition Reform Act of 2009 (WSARA) sought to improve
    the way DOD acquires major weapon systems and incorporated many of our related
    recommendations.[^11] WSARA revised the certifications that programs were expected
    to complete before being approved for system development start. Programs are currently
    required to make certain determinations and


    [^11]: Pub. L. No. 111-23.'
