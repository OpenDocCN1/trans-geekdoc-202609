    needed knowledge due to its highly specialized nature. Without this expertise,
    it will be difficult for programs to effectively implement cybersecurity policies
    and guidance. For example, the RMF allows programs to determine which controls
    are most appropriate to apply, but a knowledgeable workforce is necessary for
    making such decisions.


    DOD has various efforts underway to recruit and develop the skills of DOD’s cybersecurity
    workforce, according to several DOD officials. For example, the services are aiming
    to recruit cybersecurity analysts by using internships and engaging in partnerships
    with secondary schools and universities. In addition, the services are developing
    and offering courses to grow expertise within their existing acquisition workforce.
    DOD is determining how to share specialized expertise related to weapon systems
    cybersecurity. Specific efforts related to this include the Cyber Developmental
    Test Cross Service Working Group that meets quarterly and invites industry expertise
    to present cutting edge techniques as well as a “capture the flag” competition,
    which will now be offered to other services as well. In addition, Navy Systems
    Commands employees participate in periodic regional cyber competitions to hone
    knowledge learned in classroom environments and use training funds to pursue additional
    or higher degrees and cyber certificate programs.


    # Barriers to Information Sharing


    Officials from many of the offices we interviewed, as well as the National Research
    Council, DSB, and RAND have expressed concerns'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'about barriers to information sharing. It is difficult to find the correct
    balance between protecting information, so that it is not accessible to potential
    adversaries, and sharing it, so that DOD has an informed workforce. For example,
    classification is important because it protects information about vulnerabilities,
    and in some cases, intelligence methods. Access to information about vulnerabilities
    makes it easier for potential adversaries to attack DOD systems. Similarly, limiting
    the distribution of classified information to those who have the need to know
    is likewise important because it reduces the likelihood that internal and external
    threats will access it. Although DOD officials explained that there is no DOD-wide
    cybersecurity classification guidance, Air Force guidance and DOD officials indicated
    that vulnerabilities in fielded systems are typically classified as at least Top
    Secret or Top Secret/Sensitive Compartmented Information, and details of threats
    are more restricted.55 This high level of classification for weapon systems cyber
    vulnerabilities and threats helps protect sensitive information, but it makes
    it difficult for DOD to share information about aspects of weapon systems cybersecurity
    with cybersecurity personnel across DOD. For example, some experts told us that
    flawed designs can still be found in new systems if their designers were not aware
    that they resulted in vulnerabilities in other systems. More generally, because
    they are not sharing vulnerability and threat information across programs, programs
    are unaware of their full risk exposure and DOD may have less insight into vulnerabilities
    across its weapon systems portfolio. Officials from most organizations we spoke
    to, including NSA, acknowledged challenges with sharing information across all
    levels within DOD. Examples of these challenges are listed in Table 5.


    55 DOD uses classification to protect national security information. “TOP SECRET”
    is a classification level above SECRET and is applied to information, the unauthorized
    disclosure of which reasonably could be expected to cause exceptionally grave
    damage to the national security; Sensitive Compartmented Information is a special
    category of classification for information about or from intelligence sources,
    methods, or analytical processes.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Table 5. Challenges with Sharing Information about Cyber Vulnerabilities
    and Threats


    | Challenge | Example |

    |---|---|

    | Limited insight into connected systems | Officials from a program with a heavily
    connected weapon system stated that their system is only as secure as its weakest
    link, but they do not have information on the vulnerabilities of systems it connects
    to due to classification. |

    | Problems obtaining details about attacks | If a weapon system experienced a
    cyber attack, DOD program officials would not be provided specific details of
    that attack from the intelligence community due to the type of classification
    of that information. |

    | Cannot leverage information across programs | Office of the Secretary of Defense
    officials who are responsible for assessing weapon system cyber vulnerabilities
    and developing strategies to mitigate their risks are not allowed to share what
    they learn about specific vulnerabilities with other programs. |

    | Uninformed operators | Some system operators, including defenders, do not have
    the clearances to access threat or vulnerability information. |

    | Inability to obtain classified information while deployed | Some Navy ships
    do not have the facilities to receive or store highly classified information.
    |


    Source: Department of Defense officials. | GAO-19-128.


    Although limitations to information sharing can lead to inefficiencies and other
    challenges, DOD has so far opted to favor protection of information—perhaps because
    the stakes are so high if it does not. As we mentioned previously, one of the
    reasons potential adversaries collect information on weapon systems is because
    the better they understand a weapon system, and especially what vulnerabilities
    it may have, the more options they have to attack it. Reports over the years about
    cyber espionage attacks on defense contractors show that concerns about protecting
    sensitive information are warranted.56'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# AGENCY COMMENTS


    We provided a draft of this chapter to DOD for review and comment. DOD provided
    technical comments, which we incorporated where appropriate.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_317_0.png)


    Cristina T. Chaplain


    Director, Contracting and National Security Acquisitions


    # APPENDIX I: SCOPE AND METHODOLOGY


    To identify factors that contribute to the current state of Department of Defense
    (DOD) weapon systems cybersecurity, we reviewed reports published from 1991 to
    the present on software, information technology, networking, and weapon systems
    from the National Research Council, the Defense Science Board, GAO, DOD’s Director
    of Operational Test and Evaluation, DOD’s Joint Chiefs of Staff, and the RAND
    Corporation. To inform our discussion of networking, we also reviewed concepts
    of operations for selected systems of systems. To determine the extent to which
    DOD focused on cybersecurity in weapon system acquisitions, we analyzed selected
    information assurance, acquisition, requirements, and testing policies and guidance.
    For this and all other objectives, we conducted interviews with or obtained written
    responses from the following organizations:


    +   - Office of the Secretary of Defense organizations: Office of the Director,
    Operational Test and Evaluation; Office of the Deputy Assistant Secretary of Defense
    for Developmental Test and'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Evaluation; Office of the Chief Information Officer including the Defense Information
    Systems Agency; Office of the Chairman of the Joint Chiefs of Staff; Office of
    the Under Secretary of Defense (Acquisition and Sustainment); and Office of the
    Under Secretary of Defense (Research and Engineering).


    +   - Military service test organizations: Air Force Operational Test and Evaluation
    Center, Army Operational Test and Evaluation Command, Navy’s Commander Operational
    Test and Evaluation Force, and Marine Corps Operational Test and Evaluation Activity.

    +   - Selected program offices reflecting a purposeful sample of nine major defense
    acquisition program offices. We identified a variety of program offices to represent
    each service, multiple domains, and programs that are extensively connected to
    other weapons systems. We are not listing the names of these offices for sensitivity
    reasons.

    +   - Other key DOD organizations with cybersecurity responsibilities: the National
    Security Agency, Defense Information Systems Agency, and U.S. Cyber Command.

    +   - Selected organizations with cybersecurity expertise, referred to as “experts”
    in the report: Carnegie Melon’s Software Engineering Institute, the MITRE Corporation,
    the RAND Corporation, Pacific Northwest National Laboratory, Sandia National Laboratory,
    and Renaissance Strategic Advisors. We selected these based on their research
    or roles advising DOD on weapon systems cyber security-related topics.


    To identify vulnerabilities in weapon systems under development, we reviewed cyber
    assessment reports of selected weapon systems conducted between 2012 and 2017.
    We selected at least one program from each service as well as different types
    of weapon systems (e.g., aircraft vs ships vs communication systems). To gain
    further insights into assessment findings and understand their limitations, we
    interviewed officials from the Office of the Secretary of Defense and military
    test service organizations.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'We discussed the cybersecurity of individual programs, implementation of controls,
    and assessment findings with program offices. We also interviewed officials from
    several organizations with cybersecurity expertise to discuss weapon system vulnerabilities
    and test limitations. Vulnerabilities for specific weapon systems are classified,
    so we have not identified the programs covered in these test reports. The examples
    we cite are unique to each weapon system and are not applicable to all weapon
    systems. Furthermore, cybersecurity assessment findings are as of a specific date
    so vulnerabilities identified during system development may no longer exist when
    the system is fielded.


    To determine the steps DOD is taking to develop more cyber resilient weapon systems,
    we analyzed key DOD information assurance/ cybersecurity, acquisition, requirements,
    and testing policies and guidance that have been updated since 2014 to better
    address weapon systems cybersecurity. We selected 2014 because DOD began revising
    several policies at that time. These include DOD’s Risk Management Framework,
    Department of Defense Instruction 8500.01, Cybersecurity; the Department of Defense
    Instruction 5000.2, Operation of the Defense Acquisition System; DOD Program Manager’s
    Guidebook for Integrating the Cybersecurity Risk Management Framework into the
    System Acquisition Lifecycle; the Joint Capabilities Integration and Development
    System Manual; the Cyber Survivability Endorsement Implementation Guide; and the
    DOD Cybersecurity Test and Evaluation Guidebook. To identify barriers DOD faces
    in developing cyber resilient systems and implementing updated cybersecurity policies
    and guidance, we interviewed Office of the Secretary of Defense, military service
    test organizations, selected program offices, other DOD organizations, experts,
    and operators.


    We took additional precautions to avoid revealing sensitive information. We illustrated
    some concepts using notional depictions. In some cases, we were deliberately vague
    and excluded details from examples to avoid identifying specific weapon systems.
    We also presented examples of publicly known attacks in sidebars to illustrate
    how poor cybersecurity can enable cyber attacks. DOD conducted a security review
    of the report and approved it for public release.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# APPENDIX II: EXAMPLES OF TYPES OF CYBER ATTACKS


    # Table 6. Examples of Types of Cyber Attacks


    | Type of attack | Description |

    |---|---|

    | Denial of service | An attack that prevents or impairs the authorized use of
    networks, systems, or applications by flooding the system with data and exhausting
    resources. |

    | Distributed denial of service | A variant of the denial of service attack that
    uses numerous hosts to perform the attack. |

    | Malware | Also known as malicious software, malware refers to a program that
    is inserted into a system, usually covertly, with the intent of compromising the
    confidentiality, integrity, or availability of the victim’s data, applications,
    or operating system or otherwise annoying or disrupting the victim. Examples of
    malware include logic bombs, Trojan horses, ransomware, viruses, and worms. |

    | Man-in-the middle | A form of active eavesdropping attack in which the attacker
    intercepts to read or modify data communications to masquerade as one or more
    of the entities involved. |

    | Pass-the-hash | The attacker captures an encrypted version of a username and
    password in order to authenticate to a server or service. The attacker does not
    have to decrypt the username and password (i.e., they do not actually know what
    they are), yet can still use them to log in to a system. |

    | Social engineering | An attempt to trick someone into revealing confidential
    information (e.g., a password) that can be used to attack systems or networks.
    Examples include: phishing—when the attacker masquerades as a legitimate business
    or reputable person via an e-mail or website to obtain certain information; spear-phishing—when
    phishing attacks are closely tailored to the audience; and whaling—phishing that
    targets high ranking members of organizations. |

    | Spoofing | False signal is broadcasted with the intent to mislead the victim
    receiver, such as a Global Positioning System or email user. |

    | Structured query language injection | An attack that involves the alteration
    of a database query, usually in a web-based application, which can be used to
    read, edit, or delete information in a database. |

    | Supply chain | An adversary inserts vulnerabilities in hardware or software
    in order to manipulate those systems at the developer, assembly, or designer’s
    location. Can be activated at a later point in time without direct access by the
    attacker. |

    | War driving | The method of driving through cities and neighborhoods with a
    wireless-equipped computer—sometimes with a powerful antenna—searching for wireless
    networks potentially to exploit. |

    | Zero day exploit | An exploit that takes advantage of a security vulnerability
    previously unknown to the general public. In many cases, the exploit code is written
    by the same person who discovered the vulnerability. By writing an exploit for
    the previously unknown vulnerability, the attacker creates a potent threat since
    the compressed timeframe between public discoveries of both makes it difficult
    to defend against. |


    Source: GAO analysis of data from the National Institute of Standards and Technology,
    the National Security Agency, United States Computer Emergency Readiness Team,
    and industry reports. | GAO-19-128.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# APPENDIX III: ROLES AND RESPONSIBILITIES FOR CYBERSECURITY IN THE DEPARTMENT
    OF DEFENSE


    # Cybersecurity Roles and Responsibilities


    The Department of Defense (DOD) is responsible for defending the U.S. homeland
    and interests from attack, including those that occur in cyberspace and has developed
    capabilities for cyber operations. In order to achieve this objective, the department
    must be able to defend its own networks, systems, and information from cyber attack.
    To establish a cybersecurity program to protect and defend DOD information and
    information technology, DOD has assigned some of its components and senior officials
    with a variety of cybersecurity responsibilities, some of which are described
    below.


    # APPENDIX III: ROLES AND RESPONSIBILITIES FOR CYBERSECURITY IN THE DEPARTMENT
    OF DEFENSE


    # Cybersecurity Roles and Responsibilities


    The Department of Defense (DOD) is responsible for defending the U.S. homeland
    and interests from attack, including those that occur in cyberspace and has developed
    capabilities for cyber operations. In order to achieve this objective, the department
    must be able to defend its own networks, systems, and information from cyber attack.
    To establish a cybersecurity program to protect and defend DOD information and
    information technology, DOD has assigned some of its components and senior officials
    with a variety of cybersecurity responsibilities, some of which are described
    below.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Table 7. Selected Roles and Responsibilities for Cybersecurity in the Department
    of Defense


    | DOD Senior Officials and Components | Key Cybersecurity Roles and Responsibilities
    |

    |---|---|

    | Authorizing official | Senior official or executive with the authority to formally
    assume responsibility for operating an information system at an acceptable level
    of risk to organizational operations (including mission, functions, image, or
    reputation), organizational assets, individuals, other organizations, and the
    nation. |

    | Defense Information Systems Agency | Provides, operates, and assures command
    and control, information sharing capabilities, and a globally accessible enterprise
    information infrastructure for DOD and other partners. |

    | Deputy Assistant Secretary of Defense, Developmental Test and Evaluation | Focused
    on improving developmental test and evaluation planning and execution, building
    the professional workforce, and providing data-driven support to the DOD Components
    to improve acquisition outcomes. |

    | Director, Operational Test and Evaluation | Issues policy and procedures, oversees
    operational test planning, and independently evaluates and reports on test results.
    |

    | DOD Chief Information Officer | Principal staff assistant and senior advisor
    to the Secretary of Defense for information technology, information resources
    management, and efficiencies. Oversees management of DOD cyberspace information
    technology and cybersecurity workforce. Responsible for policy, oversight, and
    guidance for the architecture and programs related to DOD’s networking and cyber
    defense. |

    | DOD component heads | Responsible for ensuring DOD systems under their authority
    comply with the Risk Management Framework. |

    | Milestone decision authority | Designated individual with overall responsibility
    for a program. Has authority to approve entry of an acquisition program into the
    next phase of the acquisition process and is to be accountable for cost, schedule,
    and performance reporting to higher authorities. |

    | National Security Agency | Provides support to DOD components for assessing
    threats to, and vulnerabilities of, information technologies, and provides cybersecurity
    products and services to support of DOD components. |

    | Under Secretary of Defense for Acquisitions, Technology, and Logisticsᵃ | Oversees
    all DOD cyber-capability acquisitions. Oversees DOD cybersecurity research and
    engineering investments, including research at the National Security Agency. Ensures
    information assurance training of the DOD acquisition workforce. |

    | U.S. Cyber Command | Provides mission assurance for the operation and defense
    of the DOD information environment, defends the nation against strategic threats
    to U.S. interests and infrastructure, and supports the achievement of joint force
    commander objectives. |


    Source: DOD policies and guidance. | GAO-19-128.


    ᵃIn response to Section 901 of the National Defense Authorization Act for Fiscal
    Year 2017 (Pub. L. No. 114-328), DOD is restructuring the office of the Under
    Secretary of Defense, Acquisition, Technology and Logistics. Effective February
    1, 2018, that office was reorganized into two separate offices: the Under Secretary
    of Defense (Research and Engineering) now advises the Secretary on key investments
    to retain technical superiority based on the analytical rigor and understanding
    of risk associated with these technologies; and the Under Secretary of Defense
    (Acquisition and Sustainment) advises the Secretary on all matters regarding acquisition
    and sustainment and is involved in the oversight of individual programs as required.
    We describe the Under Secretary of Defense for Acquisition, Technology and Logistics’
    role here because cybersecurity roles of the new offices have not yet been fully
    documented in policy.'
