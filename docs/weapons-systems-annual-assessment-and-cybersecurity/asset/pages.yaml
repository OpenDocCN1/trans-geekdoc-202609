    manufacturing processes are in statistical control—an approach inconsistent with
    best practices. The program does not collect data on statistical process controls
    or assess process capabilities using manufacturing readiness levels. Rather, the
    program office collects metrics on the status of production from the prime contractor,
    such as discovery of manufacturing defects. Program officials noted that the MQ-8C
    has a commercial airframe procured by the government and provided directly to
    the prime contractor as government-furnished equipment for conversion to an MQ-8C.


