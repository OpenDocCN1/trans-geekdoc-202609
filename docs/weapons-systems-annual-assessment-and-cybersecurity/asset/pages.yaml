    cyber attacks. |


    # DOD Weapon Systems Requirements and Acquisition Processes


    Weapons systems are developed, acquired, and deployed within the defense acquisition
    system, a system of statutes and regulations. Subject to control of the DOD, the
    Army, Air Force, Navy, and Marine Corps by law have authority to “organize, train,
    and equip” their services.¹⁹ Their decisions regarding what to develop and how
    best to do so are informed by documents and deliberations under DOD’s requirements
    and acquisition processes respectively. Early in the acquisition lifecycle, the
    requirements process identifies what capabilities are needed and evaluates options
    to best meet those needs.²⁰ The acquisition process is a gated review process
    that assesses programs against established review criteria, such as the program’s
    cost, schedule, performance, and whether the weapon system is ready to move forward
    in the acquisition process.²¹ Numerous military-


