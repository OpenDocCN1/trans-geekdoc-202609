  md: '# ACV 1.1 Program


    # Technology Maturity


    The ACV’s two critical technologies, the Driver Vision Enhancement (DVE) system
    and the Remote Weapon Station (RWS), entered development as mature technologies.
    The DVE system operates on a legacy system the ACV is replacing the Assault Amphibious
    Vehicle. The RWS is based on a system that is also used on a different platform
    and has undergone successful testing for water suitability. According to Department
    of Defense testing officials, ACV contractors have integrated both government-furnished
    technologies in ACV prototypes as part of developmental testing.


    # Design Stability


    The Marine Corps awarded two separate contracts to competing vendors for the development
    phase of the ACV 1.1. Under these contracts, the vendors were to design and produce
    16 ACV prototype vehicles each for testing and evaluation. Contractors delivered
    all 32 prototypes by November 2017.


    The ACV 1.1 program completed at least 90 percent of expected drawings at the
    time of the system-level critical design review in July 2016. As of October 2017,
    the program office reported that it has now completed 100 percent of the expected
    design drawings, indicating that the design is stable.


    DOD began developmental testing of the prototypes in March 2017. The first round
    of developmental testing ended with a corrective action period to incorporate
    any potential design changes identified during the course of testing. The prototypes
    will undergo three rounds of developmental testing and corrective action periods
    through the end of the development phase and into production. Live fire testing
    to support capabilities such as force protection and system survivability started
    in June 2017. The Marine Corps has scheduled an operational assessment from January
    through March 2018 to inform the program about a number'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'of areas that includes satisfying ACV capability requirements and readiness
    to proceed into low-rate initial production.


    # Production Readiness


    The program will make two critical decisions in 2018: the first is to choose a
    single vendor for the production contract, and the second is to determine if the
    program is ready start low-rate initial production. The decision to enter low-rate
    production is scheduled for June 2018.


    The Marine Corps started a production readiness review in November 2017 to determine
    if contractors’ production maturity was sufficient for starting low-rate production
    after the production decision. In December 2017, the program sent solicitations
    to the two participating contractors to obtain their proposals for low- and full-rate
    production, with each reflecting updated information about test performance and
    design modifications through November 2017. The competing contractors, which,
    according to program officials, previously submitted pricing for production vehicles
    in their original proposals for the development contracts, are able to adjust
    the price of the ACVs in their proposals for the production contract, based on
    design changes and other changes realized through development. The proposals were
    due to the program office in January 2018. The Marine Corps plans to consider
    the results of the prototype performance tests and the proposed prices when selecting
    a final contractor for production.


    # Other Program Issues


    The program has adopted some best practices to minimize acquisition risk, such
    as using mature technologies and fostering competition. However, the Marine Corps
    is employing an aggressive schedule to obtain initial operational capability (IOC)
    by fiscal year 2020. The program is scheduled to continue developmental testing
    more than a year into the production phase, raising the risk that concurrent developmental
    testing and production could result in costly retrofits and schedule delays. The
    concurrency risk increased in 2016 when the start date for development testing
    was delayed and test events were pushed back 2 to 12 months as a'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'result of a stop-work order that was issued to the contractors after a bid
    protest was filed. For example, the program had to push back a number of scheduled
    developmental tests by three months while hot weather testing was rescheduled
    one year later. The Marine Corps moved back the production decision by 4 months,
    but maintained an August 2020 date for IOC.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.
    The program office also stated that although it maintains an aggressive schedule,
    it has met its schedule benchmarks to date and is on track for a low-rate initial
    production decision in June 2018. According to the program, all key requirements
    have been proven to be achievable through developmental testing, and the ACV 1.1
    operational assessment that is underway has identified no significant issues to
    date.


    The program said the concurrency risk we reported is low and unlikely to result
    in costly retrofits. It also stated that it had mitigated concurrency risk by
    conducting developmental testing at extreme temperatures. According to the program,
    preliminary results of these developmental tests indicate that no significant
    redesign efforts will be required.


