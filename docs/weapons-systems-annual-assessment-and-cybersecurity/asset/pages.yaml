  md: "# Chapter 2\n\n# WEAPON SYSTEMS CYBERSECURITY:  \nDOD JUST BEGINNING TO GRAPPLE\
    \  \nWITH SCALE OF VULNERABILITIES*\n\n*United States Government Accountability\
    \ Office*\n\n# ABBREVIATIONS\n\n| Abbreviation | Meaning |\n|---|---|\n| DOD |\
    \ Department of Defense |\n| DOT&E | Director of Operational Test and Evaluation\
    \ |\n| DSB | Defense Science Board |\n| IT | Information Technology |\n| NSA |\
    \ National Security Agency |\n| NIST | National Institute of Standards and Technology\
    \ |\n| RMF | Risk Management Framework |\n\n* This is an edited, reformatted and\
    \ augmented version of United States Government Accountability Office; Report\
    \ to the Committee on Armed Services, U.S. Senate, Publication No. GAO-19-128,\
    \ dated October, 2018."
  merge: -1
