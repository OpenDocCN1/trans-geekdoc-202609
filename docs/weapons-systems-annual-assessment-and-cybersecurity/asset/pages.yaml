    # A REPORT TO CONGRESSIONAL COMMITTEES


    This special report, GAO’s 16th annual assessment of the Department of Defense’s
    (DOD) $1.66 trillion portfolio of 86 major weapon systems acquisition programs,
    examines changes in the portfolio since 2016, including DOD’s progress implementing
    acquisition reforms. Drawing from questionnaire data, this chapter also offers
    a quick look at the cost, schedule, and performance of 57 individual weapon programs.


    Since DOD began to implement acquisition reforms 8 years ago, new defense weapon
    systems programs have done a better job staying within budget estimates than their
    predecessors. However, most programs continue to proceed without the key knowledge
    essential to good acquisition outcomes. As the figure shows, DOD’s major acquisition
    programs proceed through three phases—technology development, system development,
    and production—that align with three key points for demonstrating knowledge.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_12_0.png)


    Source: GAO analysis of DOD-provided data, DOD Instruction 5000.02, and best practices.
    | GAO-18-360SP.


    Department of Defense (DOD) Acquisition Process.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# DOD’s 2017 Portfolio Has Grown in Cost and Size: Programs Initiated since
    2010 Demonstrated Better Cost Performance


    DOD’s 2017 portfolio of major weapon programs has grown in cost and size. GAO’s
    analysis shows that programs initiated since 2010 had better cost performance
    between 2016 and 2017 than the rest of the portfolio—an estimated $5.6 billion
    decrease versus a $60.3 billion increase. It is too early to say whether this
    performance will continue and curb future cost growth. Future cost outcomes hinge
    on how these programs perform once they enter production, when cost growth is
    most prevalent. (See Figure.)


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_13_0.png)


    Source: GAO analysis of Department of Defense data. | GAO-18-360SP.


    DOD''s Portfolio Increased in Cost and Size; Most Cost Growth Occurred after Production
    Start.


    # Programs that Implemented Acquisition Strategies to Promote Competition for
    Contracts Reported Decreased Total Acquisition Cost Estimates


    Programs that implemented acquisition strategies to promote competition, including
    competitive award of contracts, reported decreases in total acquisition cost estimates
    as compared to others. In 2010, DOD implemented reforms including some aimed at
    increasing competition to introduce greater affordability and efficiency.'
  merge: -1
  img_proc: true
