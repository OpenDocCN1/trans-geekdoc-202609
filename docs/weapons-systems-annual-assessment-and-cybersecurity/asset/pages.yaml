    major defense acquisition programs. Of these 11 programs, 9 are in either system
    development or early production while 2 are future programs that DOD expects to
    enter system development in the next few years. We found the Army currently estimates
    a need of $55 billion to complete the acquisition of these 11 programs. We also
    compared these programs’ first full estimates of cost and schedule with their
    current estimates and found that:


