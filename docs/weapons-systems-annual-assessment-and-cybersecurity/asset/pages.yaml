  md: '# VC-25B Presidential Aircraft Recapitalization (PAR)


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_221_0.png)


    # VC-25B Presidential Aircraft Recapitalization (PAR)


    The Air Force''s PAR program plans to replace the current VC-25A presidential
    aircraft with a new modified commercial plane to transport the President of the
    United States. The PAR aircraft will be a four engine widebody, commercial derivative
    aircraft, uniquely modified to provide the President, staff, and guests with safe
    and reliable air transportation with the same level of security and communications
    capability available in the White House.


