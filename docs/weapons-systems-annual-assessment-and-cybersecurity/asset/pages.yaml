    Boeing and the program office modified the schedule to account for prior delays
    Boeing experienced in developing the KC-46A, including wiring challenges, a fuel
    component re-design, and a fuel contamination event. The Air Force and Boeing
    overcame these challenges, but lost time working through them. According to the
