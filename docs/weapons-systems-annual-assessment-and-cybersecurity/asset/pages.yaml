    # Current Status


    In May 2017, the Navy shifted away from its plan for a new frigate derived from
    minor modifications to an LCS design and now plans to select a new frigate design
    and shipbuilder through a full and open competition that is not limited to LCS
    derivatives. The program intends to leverage the proposed capabilities of the
    original frigate program and expand upon them to create a more lethal and survivable
    ship.


    In fiscal year 2018, the FFG(X) program plans to focus on system specifications
    development and approval, acquisition program documentation needs, test strategy
    development, and combat management system integration. The program released a
    request for conceptual design proposals in November 2017 and plans to award multiple
    contracts in 2018 in an effort to reduce risk by maturing industry designs to
    meet FFG(X) capability needs.


    Consistent with statute and knowledge-based practices, the Navy has scheduled
    a preliminary design review prior to a development start decision in February
    2020. To support the development start decision, the program expects to complete
    an independent cost estimate, affordability and should-cost analyses, and an independent
    technical risk assessment. Although the number of planned frigates remains uncertain
    due to previous Secretary of Defense direction to cap the combined total of LCS
    and frigates at 40 ships, the program plans to award what the Navy refers to as
    a "block buy" contract for FFG(X) detail design and construction in September
    2020. This block buy contract, which the Navy plans to award to a single shipbuilder,
    is intended to achieve more favorable pricing, but as planned, would require the
    Navy to commit to more than 1 year''s worth of procurement in a single contract.
    If the Navy requests congressional authorization during 2019 for the planned fiscal
    year 2020 block buy, the Navy will lack key knowledge, such as an independent
    cost estimate, to support its request.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program stated that conceptual design allows the Navy to mature multiple designs
    and better understand cost and capability drivers across design options before
    a detail design and construction award, as well as inform final specifications
    that will achieve a best value solution.


    # Amphibious Ship Replacement (LX(R))


