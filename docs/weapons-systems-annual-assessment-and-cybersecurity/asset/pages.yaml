    # Current Status


    In March 2016, the Under Secretary of Defense for Acquisition, Technology and
    Logistics approved a revised P-8A acquisition strategy, which made Increment 3
    part of the baseline program. Increment 3 capabilities will be developed and delivered
    as a series of engineering change proposals, or design changes. The goal of these
    efforts is to deliver improved capabilities and implement an open architecture
    that will introduce competition, increase the government''s role in developing
    future upgrades, and eventually lower costs. Increment 3 initial operating capability
    is planned for fiscal year 2024 and these capabilities are to be incorporated
    into all P-8A aircraft by 2034. Program officials said that the program received
    $70 million less in development funds than requested for fiscal year 2017, and
    that this delayed the planned introduction of the last sets of capabilities by
    one year.


    One of the most significant developments in Increment 3 is the upgrade of the
    P-8A combat system, which is part of engineering change proposal 6. This set of
    capabilities will require the integration of new hardware and software, including
    hardware changes to the aircraft. According to program officials, these capabilities
    are all based on mature technologies. The combat system upgrade includes an application-based
    open system architecture that will allow the program to compete the development
    and integration of future capabilities. The program used full and open competition
    to award two contracts for the design of the architecture upgrade prototype. The
    program will choose the best parts of each design and act as the lead integrator
    for the combat system. The program plans to complete the development and integration
    of the combat system into the aircraft in fiscal year 2022. The last upgrade in
    Increment 3 is dependent on combat system hardware updates.


