  md: '# F-35 Program


    # Technology Maturity and Design Stability


    All of the F-35 program’s critical technologies are mature and designs for each
    of the three aircraft variants are stable. However, in 2013, the program deferred
    a critical technology: the prognostics and health management system, which is
    part of the Autonomic Logistics Information System (ALIS). The program office
    is still facing challenges in delivering ALIS capabilities, for all the variants.
    The program also continues to address deficiencies with other, non-critical technologies,
    such as the next-generation helmet, which can produce a “glow” effect on the visor
    making night landings on a carrier difficult, and continues to analyze potential
    solutions to the excessive vibrations that F-35C pilots currently experience during
    catapult launch from aircraft carriers. More recently, the program discovered
    that the F-35 engine’s main fuel throttle valve can cause excessive thrust, causing
    the aircraft to move suddenly and without stopping until the engine was shut down.
    According to the program office, they are in the process of implementing hardware
    and software changes to resolve the problem.


    Although the aircraft designs were not stable at their critical design reviews
    in 2006 and 2007, the program office has since released all baseline engineering
    drawings. Officials continue to identify and address technical risks, some of
    which are specific to individual variants of the F-35. For example, the contractor
    reported they are implementing design changes to address deficiencies with the
    tires of the F-35B, the Marine Corps’ aircraft. In addition, pilots have recently
    reported experiencing symptoms of oxygen deprivation during flights of the F-35A.
    As a result, test officials grounded the aircraft at one Air Force base in June
    2017. Despite the program’s review of these cases, it has not been able to identify
    the root cause of this issue. The program faces the risk of additional design
    changes to address these issues until developmental testing is completed, and
    others that could be discovered in operational testing through 2019.'
