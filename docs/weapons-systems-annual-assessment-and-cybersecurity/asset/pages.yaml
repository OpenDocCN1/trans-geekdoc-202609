  md: 'In May 2015, the Navy’s operational test agency reported that the steep angle
    of SSC’s loading ramp may create operational hazards for certain vehicles. Program
    officials stated that they have developed a solution using wooden beams that will
    be laid on the ramp to reduce the angle when necessary. While program officials
    stated that the Navy is satisfied with this approach, it will not be able to test
    this and other operational aspects of the craft until testing of the first craft,
    which is scheduled for the second quarter of fiscal year 2018 through the third
    quarter of fiscal year 2019.


    # Production Readiness


    The program entered low-rate production in May 2015 after demonstrating that all
    materials, manpower, tooling, and facilities were proven and available to meet
    the low rate production schedule, as recommended by DOD guidance. However, according
    to best practices, programs should also take the additional steps to demonstrate
    that manufacturing processes are in statistical control prior to production start,
    which the program has not done. Specifically, critical processes should be repeatable,
    sustainable, and consistently producing parts within the quality standards.


    The program has experienced delays in its production schedule. Nine SSC craft
    are under contract, with six already under construction. The program expects to
    accept delivery of the initial test and training craft in April 2018, a 7-month
    delay compared to the schedule at the time of our last review; there had also
    been previous delays. The program also expects a similar slip in delivery of the
    second craft. According to the program, work required to address the engine issues
    discovered during testing was one source of these delays. Another source of delays
    has been the supply of propeller blades, 12 of which are needed for each craft.
    A fire destroyed the manufacturer’s facility in 2015, and production yield from
    the replacement facility has been unreliable. Blades for the first two craft have
    now been delivered; program officials also stated that the manufacturer began
    construction of a new facility in December 2017, and they are optimistic that
    yields will continue to increase.'
