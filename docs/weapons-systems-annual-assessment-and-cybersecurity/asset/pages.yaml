  md: '# NGJ Mid-Band Program


    # Technology Maturity and Design Stability


    The NGJ Mid-Band program has seven critical technologies that are all approaching
    maturity and a stable design. This design stability could be disrupted, however,
    as technologies continue to mature up to and potentially beyond the system’s start
    of production in September 2019.


    The program entered system development in April 2016 with its critical technologies
    approaching maturity. These technologies include two separate arrays—each with
    different transmit/receive modules, circulators, and apertures—as well as a power
    generation system. The program plans to rely on subsystem integration tests scheduled
    for 2019 to fully mature its critical technologies.


    The NGJ program completed its critical design review in April 2017 and, as of
    August 2017, the contractor had released 100 percent of design drawings. This
    current design stability is premised on assumptions about the final form, fit,
    and function of critical technologies—and how these technologies will perform
    in a realistic environment—that may not come to fruition as NGJ critical technologies
    continue to mature. Further, program officials stated that the methodologies used
    to conduct a structural analysis of the pod (in support of the critical design
    review) have since proven to be incomplete and flawed. The program office plans
    to conduct this analysis again and implement any needed design changes by May
    2018. The program office has also not yet tested a system-level integrated prototype
    of the jamming pod, which GAO identified best practices recommends completing
    by critical design review. The program now plans to complete this prototype testing
    on an EA-18G in May 2019, about 4 months before the start of production in September
    2019.


    # Production Readiness


    The program currently plans to demonstrate its critical manufacturing processes
    prior to the September 2019 start of production, consistent with best practices.
    At the same time, the program does not plan to test a production-representative
    prototype, or complete system-level'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'developmental testing, until 9 months and 1 year, respectively, after production
    starts. Although DOD policy allows some degree of concurrency between initial
    production and developmental testing, we have previously found that beginning
    production before demonstrating that a system will work as intended increases
    the risk of needing substantial design changes and costly modifications to already-produced
    systems.


    Program officials do not consider this concurrency to pose risk to their ability
    to complete the NGJ Mid-Band program within current cost and schedule estimates.
    According to program officials, the program’s extensive use of contractor and
    government systems integration labs, along with the use of test chambers to evaluate
    pod performance, will significantly reduce risk prior to the program’s planned
    start of production. Officials also stated testing in these labs will also help
    address one of the main software development risks: the concurrent development
    of software for the pod and the EA-18G aircraft. Program officials also plan to
    conduct mission representative flight tests for an operational assessment that
    will inform the Navy’s NGJ Mid-Band production decision.


