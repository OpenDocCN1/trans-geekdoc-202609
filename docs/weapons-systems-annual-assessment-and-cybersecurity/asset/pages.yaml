    and expects to complete airborne antenna development by the end of 2018. The program
    delivered a CPT for the first E-6 platform for integration during the preventative
    depot maintenance cycle which began in late 2017. Per program officials, they
    submitted a revised baseline in January 2018, with new key milestones that have
    been approved by the functional capabilities board and are on track for Joint
    Requirements Oversight Council approval. Program officials say they transmitted
    the FET cost capability analysis report to Air Force Global Strike Command in
    January 2018, and that'
