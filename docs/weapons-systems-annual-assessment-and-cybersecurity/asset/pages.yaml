  md: '# DOD FACES SYSTEMIC BARRIERS TO IMPROVING

    WEAPON SYSTEMS CYBERSECURITY


    # Cybersecurity Workforce Challenges


    DOD faces barriers that will challenge its ability to develop more cyber resilient
    weapon systems and make it more difficult for DOD’s recent policy changes and
    new initiatives to be as effective as possible.


    DOD struggles to hire and retain cybersecurity personnel, particularly those with
    weapon systems cybersecurity expertise. Our prior work has shown that maintaining
    a cybersecurity workforce is a challenge government-wide and that this issue has
    been a high-priority across the government for years.^53^ Program officials from
    a majority of the programs and test organizations we met with said they have difficulty
    hiring and retaining people with the right expertise, due to issues such as a
    shortage of qualified personnel and private sector competition. Test officials
    said that once their staff members have gained experience in DOD, they tend to
    leave for the private sector, where they can command much higher salaries. According
    to a 2014 RAND study, personnel at the high end of the capability scale, who are
    able to detect the presence of advanced threats, or finding the hidden vulnerabilities
    in software and systems, can be compensated above $200,000 to $250,000 a year,
    which greatly exceeds DOD’s pay scale.^54^


    Even when cybersecurity positions are filled, it may not necessarily be with the
    right expertise. Officials from some program offices said that general cybersecurity
    expertise is not the same as weapon systems


