    # Respond/Recover


    Multiple test reports indicated that operators did not effectively respond to
    test team activities. In multiple tests, operators did not respond because, as
    noted above, they were simply unaware of the test team activities. In some cases,
    however, operators were unable to effectively respond even when they identified
    or were notified that the test team had carried out an attack.43 One test report
    indicated that operators identified test team intrusion attempts and took steps
    to block the test team from accessing the system. However, the test team was able
    to easily circumvent the steps the operators took. In another case, the test team
    was able to compromise a weapon system and the operators needed outside assistance
    to restore the system.


    # DOD Has Limited Insight into Weapon Systems Cybersecurity


    DOD does not know the full extent of its weapon systems cyber vulnerabilities
    due to limitations on tests that have been conducted. Cybersecurity assessments
    do not identify all vulnerabilities of the systems that are tested. This is, in
    part, because cybersecurity assessments do not reflect the full range of threats
    that weapon systems may face in operation. Test teams reported that they portray
    realistic threats and environments. However, the nature of tests imposes limitations
    on testers that do not apply to potential adversaries. For example, DOD officials
    said that most cybersecurity assessments are conducted over a few days to a few
    weeks. One test report indicated that the cybersecurity assessment was cut short
    due to external factors so the test team only had 41 hours to work with the


