    The Navy''s new guided missile frigate program is intended to develop and deliver
    a small surface combatant with enhanced lethality and survivability as compared
    to the Littoral Combat Ship (LCS). The Navy expects FFG(X) to be an agile, multi-mission
    ship that provides local air defense, maximizes anti-surface and -submarine warfare
    capabilities, and delivers capability to protect and enable communications in
    hostile environments.


