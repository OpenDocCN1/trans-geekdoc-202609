  md: '# M109A7 FOV Program


    # Technology Maturity and Design Stability


    The M109A7 FOV program currently has mature critical technologies and a stable
    design. The program’s two critical technologies—power pack integration and the
    ceramic bearing of the generator assembly—were immature at development start,
    but assessed as fully mature at the program’s October 2013 entry into low-rate
    initial production. The contractor has released all of the expected drawings for
    the M109A7 FOV to manufacturing and has demonstrated a system-level integrated
    prototype. However, discrepancies in the design of the transmission oil cooler
    might be the cause behind recent engine component failures. These failures, according
    to the program office, have led to an interim design change to improve the transmission
    oil cooler’s structural robustness. Following additional testing, the contractor
    plans to develop a final design change, which will be introduced during full-rate
    production.


    # Production Readiness


    To date, the program has not demonstrated that its manufacturing processes are
    in statistical control, more than 5 years after production began. The program
    started low-rate initial production in October 2013, and the Army accepted delivery
    of the first vehicle in March 2015. To assess production readiness and efficiency
    gains over time, the program compares totals for expected and actual manufacturing
    hours. Our best practices work has shown that if a program''s critical manufacturing
    processes are not demonstrated and in control before production begins, it is
    at risk of increased cost and schedule delays.


    # Other Program Issues


    The program’s current schedule is predicated on completing initial operational
    test and evaluation (IOT&E) with few, if any, new discoveries of technical deficiencies.
    The program started IOT&E in October 2016, but suspended that testing with less
    than one-third of the planned missions accomplished primarily due to failures
    in the legacy gun components and reliability issues. According to program officials,
    these failures will not be'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'addressed until follow-on developmental work is completed. The major technical
    risk for the program is that it may fall short of its reliability requirements
    due to the use of these legacy components. Since the program was unable to complete
    the scheduled IOT&E, a second IOT&E event has been scheduled to start and complete
    in March 2018—a delay of approximately 16 months. To prepare for this testing,
    the program has made several changes to the vehicle including upgrading breech
    components, system software, and manuals and training, along with minor hardware
    changes to improve reliability. The Army will evaluate the effectiveness of these
    changes during IOT&E. If the changes prove effective, the program does not expect
    to exceed its cost threshold. However, previously established program dates, such
    as initial capability, have already been breached. In the event that remaining
    testing identifies new deficiencies and the need for additional design changes
    and retrofitting, the program will likely incur cost growth and further schedule
    delays.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.


