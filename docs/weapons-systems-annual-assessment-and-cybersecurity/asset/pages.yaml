  md: '# G/ATOR Program


    # Technology Maturity and Design Stability


    The program office noted that the system is on track to demonstrate all of its
    key performance requirements; however, reliability—while improved—remains a concern.
    In October 2017, the G/ATOR program office reported that all six of its critical
    technologies were mature and its design stable, with 100 percent of design drawings
    released. We were unable to assess the system’s technological maturity at development
    start because the necessary information was unavailable. The program did not meet
    best practices criteria for design stability at the design review. During developmental
    testing, G/ATOR hardware has proven to be reliable, but software issues have affected
    the reliability of the overall system. The program office previously reported
    that it has made software updates to address quality and reliability issues and
    noted that performance had subsequently improved. In 2017, the program office
    conducted G/ATOR Block 1 and Block 2 developmental testing and completed an operational
    assessment of Block 1 to support a planned early fielding decision in January
    2018. According to the program office, initial results from these tests indicate
    that G/ATOR is on track to demonstrate its key performance requirements.


    # Production Readiness


    The G/ATOR program is well into low-rate initial production, but has yet to demonstrate
    that its production processes are in statistical control. At the program’s March
    2014 production decision, the contractor had demonstrated G/ATOR production processes
    to the DOD recommended level, but had not brought them into statistical control,
    which is inconsistent with best practices. This status is unchanged. According
    to program officials, they instead track a variety of other production metrics,
    including ones related to labor efficiency, cost, and quality, and report that
    the program is meeting its goals in these areas. They reported that the Marine
    Corps accepted delivery of five production radars in 2017, as planned, with the
    sixth radar delivered in January 2018.'
