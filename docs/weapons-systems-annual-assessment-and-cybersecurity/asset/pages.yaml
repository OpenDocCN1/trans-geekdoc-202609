    # Exploratory Analysis Suggests that Certain Knowledge-Based Acquisition Practices
    Correspond with Better Acquisition Outcomes


    5. We found that, on average, MDAPs that completed some or all of the following
    three actions had lower cost increases than other programs:


    +   - demonstrated all critical technologies were very close to final form, fit,
    and function, within a relevant environment, before starting development;²⁶


    26 GAO’s best practices work has shown that a Technology Readiness Level (TRL)
    7— which corresponds to demonstrating all critical technologies in form, fit,
    and function within a realistic environment—is the level of technology maturity
    that constitutes a low risk for starting development. DOD’s policy, however, permits
    development to start at a lower technology maturity level—TRL 6, which corresponds
    to demonstrating technology in a relevant environment. DOD’s policy is based on
    a statute that generally prohibits a major'
