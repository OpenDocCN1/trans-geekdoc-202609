    # Knowledge from Operational Testing Is Often Not Prerequisite to DOD Declaring
    a Weapon System Capable to Conduct Operations


    8. Over one-third of the 45 current programs we assessed declared, or intend to
    declare, initial operational capability on the basis of limited or, in a few cases,
    no initial operational test and evaluation.


    Initial operational capability occurs when a unit or organization has been equipped
    and trained and is determined to be capable of conducting operations with a newly
    fielded system.'
