    # DOD Programs Continue to Not Fully Implement Key Knowledge-Based Acquisition
    Practices.


    Subsequently, GAO observed that individual programs have taken steps to implement
    acquisition strategies that promote competition. Of the programs in this year’s
    assessment that awarded development, test, or production contracts, 61 percent
    did so competitively. As in previous assessments, DOD programs continue to not
    fully implement knowledge-based acquisition practices. GAO observed that most
    of the 45 current programs have proceeded into system development, through critical
    design reviews, and into production without completing key knowledge-based practices
    associated with each of these three points. (See table.) Further, almost all of
    the 12 future programs GAO reviewed, not yet in DOD’s'
