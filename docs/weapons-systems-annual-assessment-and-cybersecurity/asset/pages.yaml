  md: 'system. Ahead of the planned March 2019 low-rate initial production decision,
    the program plans to complete software development and a test readiness review
    by March 2018. The program also expects to receive its first of the two new prototypes
    purchased for developmental testing in March 2018.


    # Other Program Issues


    Because JPALS is GPS-based, it will need to be compliant with with any updates
    to DOD’s GPS systems, such as integration of “M Code”—a new military GPS signal
    designed to further improve anti-jamming and secure access to GPS signals for
    military users. The JPALS program office told us that it contracted for a trade
    study to determine future M Code integration and implementation options, as well
    as potential costs and schedule issues.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated as appropriate.
    Officials noted that JPALS is installed on nuclear aircraft carriers and amphibious
    assault type ships and provides at-sea, precision approach landing capabilities
    for F-35 Lightning II, MQ-25, and future ship-based aircraft in virtually any
    weather condition. JPALS provides alignment, navigation, and surveillance capabilities
    for low observable and unmanned aircraft and supports auto-land on nuclear aircraft
    carriers. The program office stated that the JPALS test readiness review supports
    integrated developmental and operational test events scheduled for fiscal year
    2018. Further, the program office stated that JPALS will begin production and
    permanent shipboard installations in the second quarter of fiscal year 2019. According
    to the program, JPALS was certified for operational fleet use aboard the USS Wasp
    (LHD 1) in March 2018.'
