  md: 'may be greater than those of attacks on other types of systems. For example,
    an attack on a weapon system could have physical consequences that may even result
    in loss of life.


    Nevertheless, weapon systems share many of the same cyber vulnerabilities as other
    types of automated information systems. Weapon systems are large, complex, systems
    of systems that have a wide variety of shapes and sizes, with varying functionality.13
    Despite obvious differences in form, function, and complexity, weapon systems
    and other types of systems are similar in some important, if not obvious, ways.
    For example, DOD reports state that many weapon systems rely on commercial and
    open source software and are subject to any cyber vulnerabilities that come with
    them. Weapon systems also rely on firewalls and other common security controls
    to prevent cyberattacks. Weapon system security controls can also be exploited
    or bypassed if the system is not properly configured. Finally, weapon systems
    are operated by people—a significant source of cybersecurity vulnerability for
    any system.14


    # Anatomy of a Cyber Attack


    One common way to discuss cybersecurity is through the activities necessary to
    defend (or attack) a system. System developers and operators take steps to protect
    the system from cyber attacks, while attackers attempt to defeat those protections
    as depicted in Figure 1. The cyber attack sequence is also referred to as a cyber
    kill chain or cyber attack lifecycle. There are multiple models for understanding
    cyber attacks, each with their own terminology and sequence of steps. The attack
    sequence below is simpler, but generally consistent with existing cybersecurity
    models.15 We


