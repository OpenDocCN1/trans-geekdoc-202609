    the fiscal year 2018 budget.


    # Current Status


    In September 2016, the Under Secretary of Defense for Acquisition, Technology
    and Logistics (USD AT&L) approved the PAR program for entry into system development.
    Following this approval, the Air Force solicited proposals for system development
    and, in August 2017, purchased two Boeing 747-8 aircraft under firm-fixed-price
    terms.


    USD AT&L waived several requirements for the program to assess affordability,
    assess technology maturity, and complete a preliminary design review that are
    supposed to occur prior to entering system development. USD AT&L determined that
    without such waivers, the acquisition of the new aircraft and replacement of the
    legacy aircraft would be significantly delayed, and DOD would be unable to meet
    critical national security objectives. Since then, the program has operated without
    an approved acquisition program baseline, which currently precludes us from analyzing
    cost and schedule performance in a two-page assessment format.


    The Air Force plans to modify its contract with Boeing in August 2018 to start
    PAR development activities in earnest. In the interim, Boeing is completing preliminary
    design activities for PAR, and the program continues risk reduction activities
    first initiated in 2012. Further, a task force of Air Force and Boeing officials
    are assessing affordability and schedule concerns prior to the program establishing
    an acquisition program baseline and awarding the planned contract modification.


    The program plans to modify and test both aircraft in a phased approach starting
    in 2019, using research and development funding. By fiscal year 2024, the Air
    Force plans to accept delivery of aircraft that are fully capable to support presidential
    missions.


