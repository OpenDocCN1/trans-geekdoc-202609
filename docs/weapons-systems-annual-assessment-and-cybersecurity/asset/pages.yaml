  md: 'As part of radar development, the contractor built a full-scale, single-face
    radar array, which the Navy has used extensively for developmental testing. This
    production-representative array is undergoing live ballistic missile defense and
    anti-air and anti-surface warfare testing through mid-2018 at the Navy''s Pacific
    Missile Range Facility. In April 2019, the Navy plans to integrate the array and
    an initial version of the Aegis combat system—which integrates ship sensors and
    weapon systems to engage threats—planned for DDG 51 Flight III at a land-based
    test site to support further testing. However, the Navy will not test the full
    integrated radar and Aegis combat system until both are installed on the lead
    ship, sometime in 2022.


    In spring 2017, AMDR completed software development to support core AN/SPY-6(V)1
    capabilities prior to entering production. Remaining software development includes
    software updates—occurring through 2020— that are intended to enhance radar defense
    capabilities and integrate the radar with the combat system.


    # Design Stability and Production Readiness


    AMDR entered low-rate initial production for three AN/SPY-6(V)1 radars in May
    2017—4 months ahead of schedule—with core system hardware and software complete,
    a stable design, and production capabilities that meet DOD guidelines, but which
    fall short of industry best practices. Program officials stated AMDR also realized
    an overall reduction in procurement cost from the original independent cost estimate
    due to a better understanding of ownership, production, and material costs realized
    during development.


    The AMDR program office plans to procure more than two-thirds of the total radars
    prior to operational testing completion. The Navy deliberately planned for AMDR
    to begin production prior to the start of Aegis upgrade software development,
    a prerequisite for operational testing, to allow time for key radar technologies
    to mature and for the design to stabilize, minimizing the risk of beginning combat
    system development with insufficient radar knowledge. However, the concurrency
    between AMDR’s schedule for Aegis combat system integration, land- and sea-'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'based testing, and production dictates that the Navy will need to address any
    deficiencies yet to be identified for radar integration with the Aegis upgrade
    after production is underway or complete for many of the radars. Any retrofitting
    needed to address these deficiencies could increase costs.


    # Other Program Issues


    AMDR entered production without an approved Test and Evaluation Master Plan. DOD’s
    Director, Operational Test and Evaluation (DOT&E) has expressed concern for several
    years that the Navy’s proposed test approach cannot provide for realistic operational
    conditions without including the use of an unmanned self-defense test ship equipped
    with AN/SPY-6(V)1 and Aegis. In 2016, the Deputy Secretary of Defense directed
    the Navy to include funding for such a test ship in its budget planning. However,
    in December 2017, program officials stated that the Navy does not plan to request
    funds for the test ship. Instead, the Navy expects to complete initial operational
    test and evaluation for DDG 51 Flight III, AN/SPY-6(V)1, and Aegis upgrade through
    a segmented test approach that includes land-based tests, tests on a manned Flight
    III ship, and models and simulation. DOT&E reaffirmed to us in late 2017 that
    for initial operational test and evaluation, the only way to adequately demonstrate
    the required self-defense capability for Flight III is to test AN/SPY-6(V)1 and
    Aegis aboard an unmanned test ship.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
