  md: '# Improved Turbine Engine Program (ITEP)


    The Army''s Improved Turbine Engine Program (ITEP) is developing a replacement
    engine for the Black Hawk and Apache helicopter fleets. The new engine is designed
    for increased power, performance, and fuel efficiency; enhanced reliability; increased
    service life, and a lower maintenance burden. The Army plans to begin fielding
    these engines in fiscal year 2026.


    ![](img/43698ea8af5a4b46ccccdfa98ec6b016_68_0.png)


    # Program Essentials


    +   - Program office: Redstone Arsenal, AL

    +   - Prime contractor(s): Advanced Turbine Engine Corporation and General Electric
    Company

    +   - Contract types: Fixed-price incentive (firm target) (technology maturation
    and risk reduction)

    +   - Cost-plus-incentive-fee (development; planned)

    +   - Next major milestone: Development start (December 2018)


    # Current Status


    ITEP entered the technology maturation and risk reduction phase in August 2016
    with the Army''s award of two fixed-price incentive (firm target) contracts to
    General Electric and Advanced Turbine Engine Corporation. Each contractor will
    hold a separate preliminary design review in February and March 2018 to establish
    an allocated baseline for the engine that will define all ITEP subsystems and
    how they are to work together.


    In November 2017, the Acting Assistant Secretary of the Army for Acquisition,
    Logistics and Technology approved the solicitation of contract proposals for ITEP
    development. The Army intends to award a cost-plus-incentive-fee contract for
    system development to one of the two contractors that are developing preliminary
    designs. Currently, the program schedule provides for an acquisition cycle time
    of approximately 11 years.


    The program''s three critical technologies—advanced inlet particle separator,
    compressor/advanced aerodynamics, and hybrid bearings—were identified as approaching
    maturity during a preliminary technology readiness assessment in October 2014.
    Consistent with DOD policy, the Army plans to complete a technology readiness
    assessment in June 2019, prior to the program''s December 2018 development start.


    Since 2015, Sikorsky Aircraft Corporation and Boeing, the manufacturers of the
    Black Hawk and Apache helicopters, have conducted analyses in support of integrating
    ITEP hardware, electrical systems, and software into the helicopter airframes.
    These efforts, designed to identify integration risks and facilitate development
