    Our observations in this chapter are based on three sets of programs:


    +   - We assessed 86 major defense acquisition programs (MDAP) in DOD’s 2017 portfolio
    for cost and schedule performance.⁸ We obtained cost, schedule, and quantity data
    from DOD’s December 2016 Selected Acquisition Reports (SAR)—which detail initial
    cost, schedule, and performance baselines and changes over the past year—and from
    the Defense Acquisition Management Information Retrieval (DAMIR) system, a DOD
    repository for program data. We conducted our own assessment of data reliability
    by comparing the SAR data we entered into our weapon system database and the DAMIR
    data and determined the data were sufficiently reliable for the purposes of our
    report.

    +   - We also assessed 45 MDAPs currently between the start of development and
    the early stages of production. We developed a questionnaire to obtain information
    on the extent to which these programs are following knowledge-based acquisition
    practices for technology maturity, design stability, and production readiness.
    The questionnaire asked programs to provide information about systems engineering,
    design drawings, manufacturing planning and execution, and the implementation
    of specific acquisition reforms. In addition, the questionnaire requested that
    programs provide details on scheduling, critical technology levels, major


    ⁷ The government uses individual subcontracting reports on eSRS as one method
    of monitoring small business participation, as the report includes goals for small
    business subcontracting.


    ⁸ Major defense acquisition programs (MDAP) are those identified by DOD or that
    have a dollar value for all increments estimated to require eventual total expenditure
    for research, development, test, and evaluation of more than $480 million, or
    for procurement of more than $2.79 billion, in fiscal year 2014 constant dollars.
    DOD maintains a list of programs designated as future major defense acquisition
    programs. These programs have not formally been designated as MDAPs; however,
    DOD plans for these programs to either system development, or bypass development
    and begin production, at which point DOD will likely designate them as MDAPs.
    We refer to these programs as future or planned major defense acquisition programs
    throughout this report.'
