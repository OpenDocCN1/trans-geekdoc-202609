    # CIRCM Program


    # Technology Maturity and Design Stability


    The CIRCM program office reported that the system’s six critical technologies
    are fully mature and nearly 100 percent of all expected drawings are complete.
    In our 2017 assessment, we reported that CIRCM had nine critical technologies
    that were approaching maturity. However, three of those technologies were unique
    to the design of a contractor, BAE Systems, which is not continuing into Engineering
    and Manufacturing Development. For the six remaining critical technologies, the
    program increased their maturity levels by integrating the system onto an Army
    aircraft and completing the initial testing, which demonstrated that the technologies
    perform in a realistic environment.


    At its October 2016 critical design review, the CIRCM program had released 97
    percent of its planned design drawings, which constitutes a'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'stable design. However the CIRCM has yet to meet its reliability requirement
    and changes to design could be necessary. In April 2017, the DOD Inspector General
    found that the CIRCM requirements documents and test plan did not require demonstration
    of minimum reliability requirements until after the program’s full-rate production
    decision. Specifically, the Inspector General found that the program’s approved
    requirements documents and test plans show that CIRCM is scheduled to enter full-rate
    production after it has demonstrated only 70 percent (150 hours) of its 214 hour
    requirement for mean time between operational mission failures. The Inspector
    General subsequently recommended that the Army revisit and improve its CIRCM requirements
    and test plans before the system enters production. The Program Executive Officer
    for Intelligence, Electronic Warfare, and Sensors (PEO IEW&S), who oversees CIRCM,
    concurred with the Inspector General’s recommendation.


    # Production Readiness


    The program is identifying critical manufacturing processes at production readiness
    reviews. These reviews are scheduled to be completed in April 2018. Prototype
    and production-representative articles have already been built. Full-rate production
    will use the same equipment, stations, processes, and personnel as the production-representative
    items to demonstrate manufacturing capabilities on a pilot production line before
    CIRCM enters production. Program officials stated that CIRCM is now ready to move
    into the production phase, based on test results from the system’s integration
    onto an Army aircraft and completion of contractor flight testing activities.
    In 2017, the Army conducted testing at Redstone Arsenal to demonstrate CIRCM in
    a production configuration on the aircraft as well as performance while exposed
    to motion, vibration, and electromagnetic environments specific to the aircraft.
    The tests provided information on CIRCM capabilities to acquire, track, point
    and emit laser energy in various environments.


    Despite the Army’s assertion that the program is ready for production, it has
    postponed its planned production decision for CIRCM from March 2018'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'until September 2018 due to schedule delays experienced during system development.
    These delays resulted from late deliveries of key CIRCM components, including
    system processor units, lasers, and pointers/trackers, as well as from reliability
    test failures.


    # Program Office Comments


    We provided a draft of this assessment to the program office for review and comment.
    The program office provided technical comments, which we incorporated where appropriate.
    According to program officials, poor performance by the prime contractor and its
    subcontractors, sub-tier manufacturing and quality problems, and higher-than-anticipated
    reliability failures resulted in a 6-month delay to the low-rate initial production
    decision, which is now scheduled for September 2018. The program stated that,
    in response to the aforementioned shortfalls, PEO IEW&S established a committee
    to oversee improvements to CIRCM reliability. It also stated that the program
    successfully conducted testing in the first quarter of fiscal year 2018 to demonstrate
    reliability improvements to date. Officials further stated that the program addressed
    hardware delivery delays as part of a comprehensive corrective action plan that
    the committee developed. Per program officials, they have realigned CIRCM hardware
    deliveries to account for the 6-month delay and to support upcoming reliability
    demonstration and flight testing events.


    # Handheld, Manpack, and Small Form Fit Radios (HMS)


