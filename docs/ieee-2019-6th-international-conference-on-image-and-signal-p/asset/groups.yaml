    # F. Muhammad et al.: Decoded DL-UL Coverage Analysis with Interference Management


    # IEEE Access


    TABLE 2. Simulation parameters.


    | Parameter | Configuration |

    |---|---|

    | MBSs and SBSs deployment | Independent heterogeneous PPPs |

    | Channel bandwidth | 10 MHz |

    | $\lambda_M$ | 1 MBS/km² |

    | $P_M^t, P_S^t$ | $3 \sim 6$ SBS/MHz |

    | $\alpha_M, \alpha_S$ | $40 \sim 42$ dB and $20 \sim 24$ dB, respectively |

    | $\mu_M, \mu_S$ | $3 \sim 5$ |

    | Noise | 0 dB and $\sim 10$ dB, respectively - 170 MHz |

    | Access strategy and network model | Open access strategy and fully loaded |


    In Fig. 4, we study the effect of different values of association bias on the
    coverage probability, considering both Co-DU and De-DU with RFA scheme. The lower
    set of plots shows that the coverage probability monotonically decreases with
    the increase in $T_s$. This means that under based MPR, if no proper interference
    management scheme is employed, users prefer to associate with SBSs with lower
    SINR. Here overloading using based MPR strategy is suboptimal with larger $T_s$
    since all the users associate to SBSs. The upper set of plots shows that optimal
    coverage probability is achieved with RFA scheme without interference. The RFA
    scheme coverage can be not affected by the optimal coverage of the De-DU as the
    Co-DU, since users prefer to associate with DL and SBS in UL direction.


    ![](img/50c5c77000cc0e118c831908687e75a5_7_0.png)


    FIGURE 3. Effect of Co-DU and De-DU with RFA scheme.


    Fig. 5 depicts the coverage performance with the increasing range of $R^{(in)}$.
    The plots show how RFA affects of the CRE-based cell association scheme while
    considering Co-DU and De-DU. Without the RFA scheme, the coverage probability
    of HetCNets with Co-DU and De-DU increases very slowly as $R^{(in)}$ coverage
    increases. This improves 0.2% and 0.4%, respectively.


    ![](img/50c5c77000cc0e118c831908687e75a5_7_1.png)


    ![](img/50c5c77000cc0e118c831908687e75a5_7_2.png)


    FIGURE 4. Effect of Co-DU and De-DU with RFA scheme.


    The above is a clear that simulations results for the proposed two tier setup
    match the evaluated analytical results.


    FIGURE 5. Coverage probability vs inner region coverage range. till the optimal
    coverage extension is 80% for the proposed two tier set. The coverage improvement
    of the proposed De-DUA with the RFA scheme is 5.9% for the optimal $R^{(in)}$
    coverage extension, which is 70%. distinctly reveals that HetCNet with RFA scheme,
    when considering De-DUA, outperforms all other methods in terms of coverage performance.


    In Fig. 7, the coverage of MBS is compared with the SBS users for different values
    of $\lambda_L$ and association bias $T_s$. It is observed that the coverage of
    unbiased SBS users increases. This is because the factor of offloaded SBS users
    increases and load of the MBS decreases. It is also observed that the effect of
    MCI on the unbiased SBS users increases as the coverage of MBS users increases.
    This is due to fewer number of MBS users share the available resources, as well
    as because each user type as $\lambda_L$ increases, since density decreases. In
    addition, the RFA scheme further improves the coverage performance.


    ![](img/50c5c77000cc0e118c831908687e75a5_8_0.png)


    ## VII. CONCLUSION


    In this paper we consider a two-tier HetCNet models, and statistically measure
    the coverage performance with the joint effect of RFA employment and De-DUA. We
    observe the effect of association and RFA employment on the coverage, while considering
    De-DUA. Numerical results clearly indicate that the coverage performance improves
    of RFA employment increases the MCI on offloaded users. It is also observed, as
    SBS density increases, number of users are associated with MBS and SBS in DL directions.
    By selecting appropriate values of $R^{(i)}$ coverage range and association bias,
    the coverage performance can be significantly improved.


    6. shows the relationship between the user association and different values of
    SBS, while Co-DUA and De-Dua. It is observed that the average fraction of users
    associated with MBS in DL direction and UL direction grows with the increase in
    SBS density. The maximum user association is achieved at $\lambda_S/\lambda_M
    = 8$. It is also observed that user association with SBS in DL direction and MBS
    in UL direction is 0.


