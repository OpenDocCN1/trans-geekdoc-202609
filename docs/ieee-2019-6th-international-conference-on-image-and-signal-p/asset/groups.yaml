    # 面向增强异构小区网络的带有干扰管理的解耦下行-上行覆盖分析


    FAZAL MUHAMMAD¹（IEEE 学生会员），ZIAEL HAQ ABBAS², GHULAM ABBAS²（IEEE 高级会员），以及 LEI JAO³（IEEE
    会员）


    *¹ 工程学院，Gushk Iqbal Khan 工程科学与技术学院，Top 236-60, 巴基斯坦

    *² 工程学院，Gushk Iqbal Khan 工程科学与技术学院，Top 236-60, 巴基斯坦

    *³ 信息与通信技术系，奥格德大学，N-466 Grimstad, 挪威

    通讯作者：F. Muhammad (fazal_engr@giki.edu)


    **摘要** 异构网络（HetNCs）为应对当前小区网络拥堵提供了一种很有前景的解决方案。由于传输功率差异巨大，在倾向于最大功率（MPR）关联方案的情况下，关联宏小区基站（MBS）的用户数量多于小小区基站（SBS）。因此，异构网络内部出现了分配不均。通过使用基于小区范围扩展（CRE）的关联，我们可以平衡异构网络的负载。然而，使用
    MPR 关联方案会导致用户面临两个挑战：1）宏小区干扰，即 MBS 干扰了过载用户；2）解耦的下行-上行关联，即随机用户在上行（UL）方向和下行（DL）方向上分别与单层级的基站（BS）关联。本文在考虑双层场景的同时解决了了这些问题。我们采用了一种反向频率分配（RFA）方案。除了耦合的下行-上行关联（Co-DU）外，本文还强调了解耦的下行-上行关联的概念。在
    De-DU 中，随机用户与两个不同层级的基站关联，其中一层的基站负责下行，另一层负责上行。我们的结果表明，与 Co-DU 相比，采用 RFA 的 De-DU
    实现了更好的覆盖性能。


    - **索引术** 异构小区网络，小小区基站，反向频率分配，下行-上行关联，覆盖性能。


    # I. 引言


    为了满足当前的无线数据洪流，小区网络进入了一个新范式，即低功率小小区（如皮基级小区和飞米级小区）利用了异构小区网络（HetNCs）中高功率宏小区的现有基础设施
    [1]。不同类型的基站其发射功率、基站密度、关联用户密度以及小区选择偏移之间存在差异。由于发射功率更高，宏小 way覆盖范围比低功率小小区更大。关联到小小区的用户数量较少。小区范围扩展（CRE）[2]
    是流行的负载均衡方法之一，在小小区的参考信号中添加小区选择偏移（也称为关联），以增加其覆盖范围，从而将部分用户从宏小区推向小小区。负载均衡为异构网络带来了益处，即将宏小区拥塞和过载用户转移到小小区，以有效利用其资源。然而，除了这些关键挑战外，异构网络还面临宏小区对过载用户的干扰以及下行小区关联的问题。


