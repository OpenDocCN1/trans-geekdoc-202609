    子帧（ABSs）。ABSs 被完全分配给 MCI 云中的卸载用户，该方案导致了宏资源的减少，这些 ABSs 被小小区使用。[5] 中提出了了基于频率的资源划分，其中
    MBS 位于部分子带上，这些子带分配给卸载用户。在 [6] 中，作者研究了基于信干加噪声比（SINR）的资源划分分析。然而，在他们的帧工作方案中并未考虑负载。在
    [7] 中扩展了 [6] 中提出的工作，并观察了负载均衡和基于资源的划分对性能指标的影响。然而，之前的研究 [4]–[7] 考虑了上行关联，即随机用户与单个基站关联
    [8]。此外，[10]–[12] 指明他们的模型中没有考虑上行关联。在这些模型中，作者将用户在下行链路方向与一个基站关联，以连接到上行方向的任何其他基站。这被称为解耦。在
    [13] 中，作者考虑了下行和上行用户关联。[14] 中的作者考虑了考虑不同下行和上行关联策略的速率和性能率。[15] 和 [16] 中的研究通过考虑不同的下行和上行关联策略来阐述速率和性能。我们的模型通过考虑解耦的资源划分来缓解宏小区干扰。


    本文中，我们采用了一种反向频率分配（RFA）方案。除了耦合的下行-上行关联（Co-DU）外，本文还强调了解耦下行-上行关联的概念。在 De-DU 中，随机用户与两个不同层级的基站关联，其中一层的基站负责下行，另一层的基站负责上行。我们的结果表明，与
    Co-DU 相比，采用 RFA 的 De-DU 实现了更好的覆盖性能。


    本文中，我们考虑双层场景。我们采用了一种反向频率分配（RFA）方案。除了耦合的下行-上行关联（Co-DU）外，本文还强调了解耦下行-上行关联的概念。在 De-DU
    中，随机用户与两个不同层级的基站关联，其中一层的基站负责下行，另一层的基站负责上行。我们的结果表明，与 Co-DU 相比，采用 RFA 的 De-DU 实现了更好的覆盖性能。


    本文的主要贡献可以总结为：

    - 我们考虑了具有资源划分模式的双层异构网络模型，即耦合（Co）和解耦（De）关联。

    - 我们概率性地描述了采用 RFA 的关联性能。

    - 我们的结果显示解耦关联优于其他方法。


    本文的其余部分组织如下：第二节介绍系统模型；第三节介绍 SIR 分布和关联；第四节描述我们的关联；第五节给出数值结果；第六节得出结论。


    # II. 系统模型


    ### A. 基站与用户分布


    考虑一个双层异构网络模型，其中基站根据密度发射功率通过独立的泊点过程 $\Phi_i$ 部署，密度为 $\lambda_i \in \{M, S\}$，分别为宏小区和小小区。由于异构网络也通过另一个均匀泊点过程
    $\Phi_u$ 分布；根据 Slyayak 定理 [20]，如果在典型位置进行分析，结果保持不变。


    ### B. 信道模型与用户关联


    用户从基站接收的接收功率和基站从用户接收的功率分别为 $P_{R,u}^{DL} = T_{BS}h_u$ 和 $P_{R,b}^{UL} = T_{UE}h_b$。在这里，$T_{BS}$
    和 $T_{UE}$ 代表基站和关联用户的发射功率，$H_h$ 是基站信道，$H_v$ 表示用户的衰落。基站与用户之间的信道用指数分布建模。所有信道使用均值为瑞利衰落，例如直接信道和干扰信道，$H_i
    \sim \exp(1)$，其中 $X$ 是概率密度函数为 $f_X(x) = e^{-x}$ ($x \ge 0$) 的随机变量，且 $H_i = H \sim
    \exp(1)$，因为衰落与基站位置无关。


    ### C. 反向频率分配方案


