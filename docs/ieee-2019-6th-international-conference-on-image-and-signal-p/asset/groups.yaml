    **ABSTRACT** Heterogeneous networks (HetNCs) offer a promising solution to cope
    with the current cellular network crunch. Due to the large transport power disparity,
    while favoring maximum power (MPR) association scheme, a higher number of users
    are associated with macro-cell BS (MBS) than small-cell BS (SBS). Hence, an imbalance
    allocation takes places across the HetNCs. Using cell range expansion-based association,
    we can balance the load across the HetNCs. However, using MPR association scheme,
    users leads to two challenges: 1) macro-cell interference, in which the MBS interfers
    with the overloaded users, and 2) decoupled downlink-uplink association, where
    a random user associates with a single tier''s base station (BS) in uplink (UL)
    and downlink (DL) directions. This paper addresses these problems while considering
    a two-tier scenario. We employ a reverse frequency allocation (RFA) scheme. Besides
    Coupled DL-UL association (Co-DU), this paper also highlights the notion of decoupled
    DL-UL association. In De-DU, a random user associates with two different tiers
    BS, with one tier''s BS in DL and the other tier''s BS in UL. Our results illustrate
    that, in comparison with the Co-DU, De-DU with RFA employment achieves a better
    coverage performance.


    +   **INDEX TERMS** Heterogeneous cellular networks, small-cell BS, reverse frequency
    allocation, downlink-uplink association, coverage performance.


