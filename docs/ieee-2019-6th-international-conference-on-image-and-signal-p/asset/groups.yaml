    在图 4 中，我们考虑了在带有 RFA 方案 Co-DU 和 De-DU 的情况下，关联偏置不同值对覆盖概率的影响。下方的图表显示，覆盖概率随 $T_s$
    的增加而单调递减。这意味着在基于 MPR 的情况下，如果没有采用适当的干扰管理方案，用户将倾向于关联 SINR 较低的 SBS。当 $T_s$ 较大时，基于
    MPR 策略的过载是次优的，因为所有用户都关联到了 SBS。上方的图表显示，在没有干扰的情况下，通过 RFA 方案实现了最佳覆盖概率。RFA 方案的覆盖不受
    De-DU 与 Co-DU 最佳覆盖的影响，因为用户倾向于在 UL 方向上关联 DL 和 SBS。


    ![](img/50c5c77000cc0e118c831908687e75a5_7_0.png)


    图 3. 带有 RFA 方案的 Co-DU 和 De-DU 的影响。


    图 5 描述了随 $R^{(in)}$ 范围增加的覆盖性能。图表显示了在考虑 Co-DU 和 De-DU 的情况下，RFA 如何影响基于 CRE 的小区接入方案。在没有
    RFA 方案的情况下，随着 $R^{(in)}$ 覆盖的增加，带有 Co-DU 和 De-DU 的 HetCNets 的覆盖概率增长缓慢。分别提升了 0.2%
    和 0.4%。


    ![](img/50c5c77000cc0e118c831908687e75a5_7_1.png)


    ![](img/50c5c77000cc0e118c831908687e75a5_7_2.png)


    图 4. 带有 RFA 方案的 Co-DU 和 De-DU 的影响。


    上述结果表明，所提两层结构的仿真结果与评估的分析结果相符。


    图 5. 覆盖概率与内区域覆盖范围。对于所提的两层结构，最佳覆盖扩展为 80%。带有 RFA 方案的所提 De-DUA 在最佳 $R^{(in)}$ 覆盖扩展（70%））的覆盖提升为
    5.9%，这清楚地表明，在考虑 De-DUA 时，带有 RFA 方案的 HetCNet 在覆盖性能方面优于所有其他方法。


    在图 7 中，比较了在不同 $\lambda_L$ 和关联偏置 $T_s$ 下 MBS 与 SBS 用户的覆盖情况。观察到无偏 SBS 用户的覆盖有所增加。这是因为卸载
    SBS 用户的因素增加了，而 MBS 的负载降低了。还观察到，随着 MBS 用户覆盖的增加，MCI 对无偏 SBS 用户的影响也之增加。这是因为共享可用资源的
    MBS 用户数量减少，而且随着每个用户类型 $\lambda_L$ 的增加，密度在降低。此外，RFA 方案进一步提升了覆盖性能。


    ![](img/50c5c77000cc0e118c831908687e75a5_8_0.png)


    ## VII. 结论


    在本文中，我们考虑了两层 HetCNet 模型，并从统计上测量了 RFA 采用和 De-DUA 共同作用的覆盖性能。我们在考虑 De-DUA 的情况下，观察了关联和
    RFA 采用对覆盖的影响。数值结果清楚地表明，随着 RFA 采用增加了对卸载用户的 MCI，覆盖性能得到了提高。还观察到，随着 SBS 密度的增加，在 DL
    方向关联 MBS 和 SBS 的用户增加。通过选择合适的 $R^{(i)}$ 覆盖范围和关联偏置值，可以显著提高覆盖性能。


    6 显示了用户关联与不同 SBS 值之间的关系，同时考虑 Co-DUA 和 De-Dua。观察到在 DL 方向和 UL 方向关联 MBS 的用户平均比例随
    SBS 密度的增加而增长。最大用户关联在 $\lambda_S/\lambda_M = 8$ 时达到。还观察到，DL 方向关联 SBS 和 UL 方向关联
    MBS 的用户关联为 0。


