    # VI. NUMERICAL RESULTS AND DISCUSSION\n\nIn this section, we present numerical\
    \ results of our proposed model and demonstrate the performance of RFA with Co-DU,\
    \ and without RFA. We validate our proposed model and evaluate analytical results\
    \ through using test set as described in Section II, with parameters listed in\
    \ Table 2.\n\nThe variation of coverage probability is plotted for different coverage/SINR\
    \ threshold $\beta$, by considering both Co-DU and De-DU. The coverage performance\
    \ decreases with the increase in $\beta$. As shown in the figure below, the coverage\
    \ performance is better. This is due to the fact that in CRE-based analysis in\
    \ HetNets, users prefer to use BSs of lower SINR. It can also be observed that\
    \ the proposed HetNet, De-Dual algorithm outperforms all other methods.\n\n6256\n\
