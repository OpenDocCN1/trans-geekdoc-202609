    # C. REVERSE FREQUENCY ALLOCATION SCHEME


    In the co-coupled deployed multi-tier, transmissions in DL and UL direction of
    a tier co-occur with the transmissions of other tier, which causes MCI. The mitigation
    of such type of interference is one of the challenges in HetNets. Several approaches
    are presented in the state-of-the-art (e.g., see [4] and references in [5]). However,
    in this paper, we present our work, we use the RFA scheme to abate MCI. De-UA
    to achieve maximum performance gain. To employ RFA, we split the available region
    $R$ into two subregions, $R^{(\alpha)}$ and an outer subregion, $R^{(1-\alpha)}=R$,
    where $R^{(\alpha)}$ is the subregion where the MBS provides reasonable coverage
