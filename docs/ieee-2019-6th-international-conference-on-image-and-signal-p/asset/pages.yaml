    \ is presented in this section.\n\nTheorem 1 (The SINR coverage of a TUE associated\
    \ with a BL location $y_v$, can be as)\n\n```\n$P_{v,v,cup}^{(R)}}(\beta_v) =\
    \ E[P_{v,v,cup}(\\beta_v) > \\beta_1].$\n```\n\nUsing the interference distribution\
    \ (in Section III-A) with Theorem 1, the coverage probabilities for Co-DU and\
