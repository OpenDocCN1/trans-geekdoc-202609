    \ > y|V_Y=y) f_{V_Y}(y) f_{V_S}(y)$\n```\n\nAssuming $\\alpha_v = \\alpha_\\alpha$\
    \ and substituting into (10) over, along with mathematical manipulations completes\
    \ the proof of (11).\n\nCASE-II: If TUE associates with SBSs of two types, i.e.,\
    \ biased and unbiased association.\n\nUnbiased association: If a TUE associates\
    \ with uncoupled-SBS, i.e., $v \\in \\{S\\}, \\tau \\in \\{M\\}$ holds $P_{V_S}^{M}\
    \ > P_{V_Y}^{M}$, as a consequence of the evented events in (10) is $||V_Y||_{-AM}\
    \ > ||V_S||_{-AM}$, because, $P_{M}^{uncou} > 1$.\n\nTherefore, the association\
    \ probability, is written as\n\n```\n$U_{B,M}^{uncou} = \\frac{\\lambda_S e^{-\\\
    lambda_S Z}}{\\sum_{\\Omega=S,M} \\lambda_\\Omega e^{-\\lambda_\\Omega Z}} > 1.$\n\
    ```\n\nWhere $P_S^M$ is the ratio of the interfering MBS to the SBS transmit power.\n\
    \nBiased association: If a TUE associates with biased-SBS, i.e., $v \\in \\{S\\\
    }$ and $\tau \\in \\{M\\}$ holds $P_{V_S}^{M} > P_{V_Y}^{M}$, as the consequence\
    \ of the events in (10) is $P_{T_S}||V_S|| > P_{T_M}||V_M|| > P_{T_Y}||V_Y||$.\
    \ Assuming identical path losses equal, $\\alpha_{AM} = \\alpha$, the association\
    \ probability is\n\n```\n$U_{B-S}^{uncou} = \\frac{\\lambda_S e^{-\\lambda_S Z\
    \ (T_{\\Omega} P_\\Omega^M)}}{\\sum_{\\Omega=S,M} \\lambda_\\Omega e^{-\\lambda_\\\
    Omega Z (T_\\Omega P_\\Omega^M)}}$\n```\n\nEq.(14) indicates that increasing small-cell\
    \ bias factor, $T_{UE}$, the average number of offloaded SBSs increases as $T_{B-S}$\
    \ increases.\n\n# 2) ASSOCIATION PROBABILITY OF DE-DUA\n\nIn De-DU a TUE can associate\
    \ with two different SBSs in BS and DL direction. Let us assume that the TUE associates\
    \ with BS in DL direction and RBS in UL direction. The association probability\
    \ can be\n\n```\n$U_{decup} = P_{T_S}(||V_Y||_{-AM} > ||V_S||_{-AM}) > P_{T_M}(||V_Y||_{-AM}\
    \ > ||V_M||_{-AM}) \\n||V_S||_{-AM} > ||V_Y||_{-AM})$\n```\n\nHere, $v \\in \\\
    {S\\}, \\tau \\in \\{M\\}$ and $v \\neq \tau$. There are two ways to simplify\
    \ (15).\n\na) If the TUE associates with MBS in DL direction, if $v \\in \\{M\\\
    }$ and SBS in UL direction, i.e., $\tau \\in \\{S\\}$,\n\n```\n$U_{decup,S.M}\
    \ = \\frac{\\lambda_S e^{-\\lambda_S Z}}{\\sum_{\\Omega=S,M} \\lambda_\\Omega\
    \ e^{-\\lambda_\\Omega Z}}$\n```\n\nb) If the TUE associates with SBS in DL direction,\
    \ if $v \\in \\{S\\}$ and MBS in UL direction, i.e., $\tau \\in \\{M\\}$,\n\n\
    Since the above events can also intersect, the association probability is written\
    \ as $||V_Y||_{-AM} > ||V_S||_{-AM}$. Using the above event the association probability\
    \ $U_{decup}^{uncou}$ is given as\n\n```\n$U_{decup,S.M} = \\frac{\\lambda_M e^{-\\\
    lambda_M Z}}{\\sum_{\\Omega=S,M} \\lambda_\\Omega e^{-\\lambda_\\Omega Z}}$\n\
    ```\n\nSince the above events do not intersect, the association probability of\
    \ the above case is 0, i.e., $U_{decup,S.M} = 0$."
