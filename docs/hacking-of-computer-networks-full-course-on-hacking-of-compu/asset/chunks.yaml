    # 通过 Java 签名 Applet 进行客户端攻击


    这是一个客户端攻击。当黑客在 `metasploit` 中使用 `java signed applet` 模块时，它将作为一个 Web 服务器，并拥有一个带有
    `Java meterpreter reverse tcp` 负载的网站。这要求客户端安装了 `java` 程序以执行 `java` 负载。任何访问该网站的人都会下载并安装该负载，黑客就可以控制该计算机。它可以攻击任何安装了
    `java` 应用的机器。你需要设置 `LHOST` 和 `RHOST`（黑客 IP 地址）。`LPORT` 可以是任意端口，`RPORT`  `8080`
    或 `80` 或任何其他端口。将 URI 部分设置为 `/`。


    ## 社会工程工具包 (SETK) 配置


    我们将为 `www.google.com` 创建一个伪造网站。当本地网络中的任何人想要访问此网站时，他们将首先访问你的伪造网站，随后伪造网站会将负载下载到客户端计算机。


    1. 进入 `backtrack`，然后选择 `exploitation tools`，接着是 `social engineering tools`，然后是
    `social engineering toolkit`，最后执行 `set` 命令。

    2. 执行以下命令：

    ```bash

    sudo ./setup.py install

    ./set-update

    ./settoolkit

    ```

    3. 选择 `1` 进行 `social engineering attack`（社会工程攻击）。

    4. 选择 `2` 进行 `website attack vectors`（网站攻击向量）。

    5. 选择 `1` 进行 `java applet attack method`（Java applet 攻击方法）。

    6. 选择 `2` 进行 `site cloner`（站点克隆）。

    7. 选择 `n` 以仅对内部网络计算机应用方法。

    8. 输入黑客计算机的 IP：`192.168.52.135`。

