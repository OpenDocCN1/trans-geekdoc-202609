    ![](image-8dyikv5j.jpg) Click `airrack-ng` decrypt WEP password. You will get
    the password.  In the `WEP` encryption, the pre shared key length is constant.
    They thought to find a way that has variable key and so they discovered the Temporary
    key integrity protocol `TKIP`, where it can change the key every time through
    four handed check. There is `WEP` personal where we use the pre-shared key in
    the authentication, while in the `WEP` enterprise we use the radius server in
    the authentication. ![](image-m0t3u3ie.jpg) ![](image-8jzgokmx.jpg) ![](image-d4v73oxz.jpg)


    The key consists of `TKIP` (Temporary encryption key) and with it `TSE` and it
    is (`IV` and `EIV`). The two parts called key mixing. Then they enter the `RC4`
    Cipher. The data consists of two parts, the `MSDU` `MIC` key. The two parts go
    to `michael` algorithms and this algorithm will secure the data so nobody can
    edit the data. The output of the algorithm will be segmented and the output will
    go to `CRC-32` checksum algorithm to make error detection and correction and the
    output will be `ICV` attached with the packet. It will make `XOR` to the data
    and the key and will be put in the packet as `Ciphertext`. To change the temporary
    key encryption, we use four ways handshake. It happens through the `EAP` success
    and this the protocol that can change th password through sending the access point
    sends `Anoce`. The smart devices that have `PTK` will understand the `Anoce` and
    will send with it `Snoce` and with it the `MIC`. The access point will verify
    the `MIC` and it will respond if it was ok. ![](image-yz5akucq.jpg) We will listen
    on the network through the monitoring mode. Any packet we will find will make
    capture for it on file. We will wait any client that makes hand check with access
    point and we will separate the client and we will receive the responses to capture
    them in file. Through the dictionary attack, we will make decrypt for the file
    and we will find the password.


    ### Activate monitoring mode

    ```

    #airmon –ng start wlan1

    ```

    To see the networks around me

    ```

    #airodump –ng mon0

    ```

    ![](image-wga7rdv2.jpg)


    ### To capture the packets in a file

    ```

    #airodump –ng -c 5 (ch no) --bssid (mac) -w www mon0

