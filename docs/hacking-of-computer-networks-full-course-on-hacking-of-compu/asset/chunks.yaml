    # Part 3: Methodology Methodology


    Certified Ethical Hacker (CEH) Course By Dr. Hidaia Mahmood Alassouli

    Hidaia_alassouli@hotmail.com


    The steps for hacking: Reconnaissance, Scanning, Gaining Access, Maintaining Access,
    Covering Tracks.


    ## Web Server Type Identification


    To know the type of web server, we use the `whatweb` tool in linux.

    ```bash

    ./whatweb www.microsoft.com

    ```

    We can use `httprecon` tool for the same purpose to know the type of web server.
    We can use the site `news.netcraft.com` to get all information about web server.
    We can use the `telnet` command to know the type of web server:

    ```bash

    telnet 192.168.1.1 80

    GET / HTTP / 1.0

    ```

    We can use `netcat` in linux to know the type of web server:

    ```bash

    nc –n 192.168.28.139 80

    GET / HTTP / 1.0

    ```

    We can use the tool `httrack` and `wget` for mirroring websites. You can use them
    to download and save websites. In backtrack, we use the `THCSSLCheck` tool:

    ```bash

    wine THCSSLCheck www.yahoo.com 443

    ```

    Or use the tool `sslscan`:

    ```bash

    sslscan www.cnn.com

    ```

    To detect the load balancing, we use the tool `lbd` (load balance detector):

    ```bash

    www.yahoo.com

    ```

    It will try to find whether it is a load balancing server. It will find the type
    of server, whether `dns` or `http`. It will check the `dns` load balancing and
    the `http` load balancing. Then it will tell whether load balancing is made by
    `http` or `dns`.


    You can detect the web application firewall. There is a tool called `wafw00f`
    which can detect some firewalls. Go to `waffit` in backtrack:

    ```bash

    www.contra.gr

    ```

    Some websites can help help in time. `Centralops.net` can make service scan and
    network `whois`, domain `whois`, and `traceroute` and find `dns` records. Other
    websites can do the same purpose: `serversniff.net` and `mrdns.com`. On `firefox`,
    add the `passiverecon` addon and you can get all information about the web site
    you are browsing.


    ## Scanning Methodology


    Using the `scapy` tool to send a packet. It will find which devices are active
    in the network. There are many tools to make `ping sweep`: `angry`, `hping`, and
    `nmap`.


    Use `nmap`:

    ```bash

    nmap –sn 192.168.28.0 /24

    ```

    Use `hping`. Use `angry` tools in windows.


    Use `nmap` to know the open ports in a host:

    ```bash

    nmap 192.168.152.130 -p 80

    ```

    Use `nmap` to make a scan on all ports:

    ```bash

    nmap 192.168.152.130

    ```

    Use `metasploit` for the same purpose:

    ```bash

    msfconsole

    Msf> search scanner/portscan

    Msf> Use auxiliary/scanner/tcp

    Msf> Info

    Msf> Set RHOSTS 192.168.28.139

    Msf> Set PORTS 1-1000

    Msf> run

    ```

    The problem is if there is a firewall, we will not get results. In stealth scan
    or half open scan:

    ```bash

    nmap –sS 192.168.28.13 -p 80

    ```

    Use `metasploit` for the same purpose:

    ```bash

    msfconsole

    Msf> search scanner/portscan

    Use auxiliary/scanner/syn

    Info

    Set RHOSTS 192.168.28.139

    Set PORTS 1-1000

    Run

    ```

    We can use the `ACK` to know the unfiltered ports on the firewall:

    ```bash

    nmap –sA 192.168.28.138 -p 138

    ```

    It will tell you it is an unfiltered port in the firewall. Use `metasploit` for
    the same purpose:

    ```bash

    msfconsole

    Msf> search scanner/portscan

    Use auxiliary/scanner/ack

    Info

    Set RHOSTS 192.168.28.139

    Set PORTS 3380-3390

    Run

    ```

    It will tell you the unfiltered ports. The `FIN` scan is another way of scan.
    The computer sends a `FIN` packet and if the host answered, it is open:

    ```bash

    nmap –sF 192.168.28.138 -p 1-1000

    ```

    The `XMAS` scan is another way of scan. The source machine sends `FIN`, `URG`,
    and `PUSH`, and if the destination did not answer, the port is open; if it did
    answer with `RST`, it is closed:

    ```bash

    nmap –sX 192.168.28.138 -p 80

    ```

    Here the source machine sends a `TCP` packet with the `NO` flag set. If the destination
    does not answer, the port is open; if it answers with `RST`, it is closed:

    ```bash

    nmap –sN 192.168.28.138 -p 80

    ```

    The `Idle` scan is another way of scan. When we make a scan, the destination does
    not register that we made it, but the `IDS` registers the `Zombie` that made the
    scan. This technique is used with printer networks. We make IP spoofing. We send
    `SYN/ACK` to the `Zombie` and it responds with `RST`. We send `SYN ACK` again
    to the `Zombie` and take the packet ID. If the ID increases by two numbers, the
    port is open; if it increases by one number, the port is closed. In `UDP` scan,
    the hacker sends a `UDP` probe to the destination. If the destination did not
    answer, the port is open; otherwise, it is closed:

    ```bash

    nmap –sU 192.168.28.138 -p (all ports)

    ```

    It will show all open `UDP` ports. `Firewalking` is the combination of `portscanning`
    and `tracerouting`:

    ```bash

    hping3 1-1024 -S -t 5 scanme.nmap.org

    ```

    The `decoys` scan is a hiding process. To slow down scans, write:

    ```bash

    nmap 192.168.28.138 -p 445

    ```

    To bypass firewalls so it will not detect `nmap`:

    ```bash

    nmap –PN -g53 192.168.28.138 -p 445

    ```

    To do fingerprinting, we have many tools: `NetworkMiner`, `p0f`, `Satori`. In
    backtrack, there is a tool called `p0f`:

    ```bash

    p0f –i eth0

    ```


    ## Fingerprinting


    ### i. Banner Grabbing

    ```bash

    nmap 192.168.28.135

    ```

    You can get the type of operating system by writing:

    ```bash

    telnet 192.168.1.20 80

    GET/HTTP/1.1

    ```

    In my computer, it shows the operating system is `linux`. It also tells the web
    server is `apache` and the web application is `php`.


    ### ii. Network Scan Tools

    You can use the `superscan` windows tool. You can use `advanced IP scanner`. In
    backtrack, you can scan using `nmap`:

    ```bash

    nmap 192.168.28.139

    ```

    You can use `Znmap` tool. You can use the `nmap` command:

    ```bash

    nmap –A –v –oA report 192.168.1.0/24 -p

    ```

    If you want to make a scan without showing the offline hosts, remove `-v`:

    ```bash

    nmap –A –oA report 192.168.1.0/24 -p

    ```

    Use the program `Dradis`. Go to backtrack reporting tools, evidence management.
    It works over `https`. Go to the browser and write `https://127.0.0.1:3004`. Write
    the username `admin` and the password `admin`. In `Dradis`, click on `import from
    file` > choose the `xml` file and upload. You will get all destinations in the
    subnetwork.


    Scan by `metasploit` `armitage`: Go to backtrack exploitation tools, network exploitation
    tools, `metasploit framework`, `armitage`.


    We can use `Cobalt Strike` tool. You must buy the tool as it is not free.


    ### iii. Vulnerability Scanning

    There are many programs for vulnerability scanning: `Nessus`, `acunetix`, `w3af`,
    `armitage`, `netsparker`, `cobalt strike`. `Nmap` scripting engines: you can check
    using `nmap` on version detection, operating system detection, and `traceroute`.
    You can scan your host using a script on your computer.


    `Nessus` scan: In backtrack write:

    ```bash

    apt-get install nessus

    ```

    Go to `Nessus` in `/opt/nessus`:

    ```bash

    cd /opt/Nessus

    cd sbin

    ```

    Add the user with the command `Nessus-adduser`.

