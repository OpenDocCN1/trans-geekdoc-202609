    GET / HTTP / 1.0

    ```

    可以在 Linux 中使用 `netcat` 来识别 Web 服务器的类型：

    ```bash

    nc –n 192.168.28.139 80

    GET / HTTP / 1.0

    ```

    我们可以使用 `httrack` 和 `wget` 工具进行网站镜像。你可以用它们下载并保存网站。在 Backtrack 中，我们使用 `THCSSLCheck`
    工具：

    ```bash

    wine THCSSLCheck www.yahoo.com 443

    ```

    或者使用 `sslscan` 工具：

    ```bash

    sslscan www.cnn.com

    ```

    为了检测负载均衡，我们使用 `lbd` 工具（负载均衡检测器）：

    ```bash

    www.yahoo.com

    ```

    它将尝试查找其是否为负载均衡服务器。它会找到服务器类型，是 `dns` 还是 `http`。它会检查 `dns` 负载均衡和 `http` 负载均衡。然后它会告诉负载均衡是通过
    `http` 还是 `dns` 实现的。


    你可以检测 Web 应用防火墙。有一个名为 `wafw00f` 的工具可以检测某些防火墙。进入 Backtrack 中的 `waffit`：

    ```bash

    www.contra.gr

    ```

    有些网站可以及时提供帮助。`Centralops.net` 可以进行服务扫描和网络 `whois`、域名 `whois` 以及 `traceroute` 并找到
    `dns` 记录。其他网站也可以实现同样的目的：`serversniff.net` 和 `mrdns.com`。在 `firefox` 上添加 `passiverecon`
    插件，你就可以获取关于正在浏览的网站的所有信息。


    ## 扫描方法论


    使用 `scapy` 工具发送数据。它将发现网络中哪些设备是活跃的。有很多工具可以进行 `ping sweep`（ping 扫描）：`angry`、`hping`
    和 `nmap`。


    使用 `nmap`:

    ```bash

    nmap –sn 192.168.28.0 /24

    ```

    使用 `hping`。在 Windows 中使用 `angry` 工具。


    使用 `nmap` 知主机上的开放端口：

    ```bash

    nmap 192.168.152.130 -p 80

    ```

    使用 `nmap` 对所有端口进行扫描：

    ```bash

    nmap 192.168.152.130

    ```

    使用 `metasploit` 实现同样的目的：

    ```

    msfconsole

    Msf> search scanner/portscan

    Msf> Use auxiliary/scanner/tcp

    Msf> Info

    Msf> Set RHOSTS 192.168.28.139

    Msf> Set PORTS 1-1000

    Msf> run

    ```

    问题是如果有防火墙，我们将无法获得结果。在隐蔽扫描或半开放扫描中：

    ```bash

    nmap –sS 192.168.28.13 -p 80

    ```

    使用 `metasploit` 实现同样的目的：

    ```

    msfconsole

    Msf> search scanner/portscan

    Use auxiliary/scanner/syn

    Info

    Set RHOSTS 192.168.28.139

    Set PORTS 1-1000

    Run

    ```

    我们可以使用 `ACK` 来了解防火墙上的未过滤端口：

    ```bash

    nmap –sA 192.168.28.138 -p 138

    ```

    它会告诉你这是防火墙中的一个未过滤端口。使用 `metasploit` 实现同样的目的：

    ```

    msfconsole

    Msf> search scanner/portscan

    Use auxiliary/scanner/ack

    Info

    Set RHOSTS 192.168.28.139

    Set PORTS 3380-3390

    Run

    ```

    它会告诉你未过滤的端口。`FIN` 扫描是另一种扫描方式。计算机发送一个 `FIN` 包，如果主机回答了，则是开放的：

    ```bash

    nmap –sF 192.168.28.138 -p 1-1000

    ```

    `XMAS` 扫描是另一种扫描方式。源机器发送 `FIN`、`URG` 和 `PUSH`，如果目标没有回答，则端口是开放；如果它用 `RST` 回答，则是关闭的：

    ```bash

    nmap –sX 192.168.28.138 -p 80

    ```

    这里源机器发送一个设置了 `NO` 标志的 `TCP` 包。如果目标没有回答，则端口是开放；如果它用 `RST` 回答，则是关闭的：

    ```bash

    nmap –sN 192.168.28.138 -p 80

    ```

