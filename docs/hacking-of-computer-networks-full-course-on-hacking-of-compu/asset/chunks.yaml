    When Microsoft saves the password, it saves them in `LMHash`. Now there is `NTLM`
    hash. The Microsoft in work group environment registers the passwords in `sam`
    files. It is in the `system32/config` folder. We can''t do anything to the `SAM`
    file while the operating system is active as it is protected. To get the data
    in `SAM` file we have two methods. The first method is to bring a program that
    can extract the data in `SAM` file and the second method is to boot from another
    operating system through a live CD.


    ## Method 1 to get the data in SAM file


    This method is used if you are local in the machine as a normal user and you want
    to get the password of the machine for administrator. To find the administrator
    user while you are not administrator, you can use the `cain` program. Click `cracker`.
    Ask it to bring the hash for `local system`.


    ![](image-3lzs1van.jpg)

    ![](image-y03wxuda.jpg) ![](image-vfc5gyz2.jpg)


    ## Method 2 to use CD to reset the password or crack the SAM file hash


