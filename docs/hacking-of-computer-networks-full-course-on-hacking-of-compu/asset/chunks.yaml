    ## 作者简介

    我是 Hidaia Mahmoud Mohamed Alassouli 博士。我于 2003 年 2 月前在捷克理工大学获得电气工程学博士学位，并于 1995
    年 6 月在巴林大学获得电气工程学硕士学位（`M. Sc.`）。此外，我还在加沙的伊斯兰大学完成了一年电信和计算机工程最核心课程的学习。因此，在學習期間，我涵盖了电气工程、计算机工程和电信工程领域最重要的科目。我的国籍是加沙带巴勒斯坦人。


    我获得了许多 `MCSE`、`SPSS`、`Cisco (CCNA)`、`A+` 和 `Linux` 的认证课程。我曾在许多机构担任电气、电信和计算机工程师。我也曾担任过计算机网络管理员。我在多所大学的各类课程中拥有丰富的本科教学经验。我负责过电气、电信和计算机工程中最重要的科目的教学。


