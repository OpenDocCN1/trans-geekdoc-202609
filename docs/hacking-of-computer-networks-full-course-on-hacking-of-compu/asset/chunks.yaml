    # Nessus 注册指南

    注册 Nessus：执行 `/opt/Nessus/bin`。完成后，进入应用程序（applications），后退到漏洞评估（vulnerability
    assessment）、漏洞扫描器（vulnerability scanners）、`nessus`。在浏览器中输入 `https://127.0.0.1:8834`
    并添加网络子网进行扫描。


    ## Web 漏洞扫描器

    - 使用 `Acunetix` Web 漏洞扫描器。

    - `W3af` Web 漏洞扫描器：前往 `Vulnerability Assessment`、`Web Application Assessment`、`Web
    Vulnerability Scanner`、`w3af gui`。

    - 使用 `armitage` 和 `metasploit` 扫描漏洞。


    ## 隧道与代理技术

    你可以使用 `TOR` 代理服务器。使用工具 `super network tunnel`。在服务器和客户端安装它并进行配置。当存在防火墙拦截除 HTTP
    端口 `80` 和 `443` 以外的所有服务器端口时，且我们想要通过开放的端口 `80` 与服务器通信，但必须在服务器上也安装程序的服务器部分。添加用户，然后启动服务器。在客户端计算机上设置程序。给它服务器的
    IP。输入你在服务器上创建的用户名和密码。你可以通过隧道添加 Internet Explorer 并通过 `ftp` 隧道登录。


    在服务器上安装 `Copssh` 工具并为客户端创建用户。激活用户。在客户端安装 `putty` 的同时，使用 `SSH` 作为代理服务器。


    ## IP 欺骗

    使用 `nmap` 进行 IP 欺骗：

    ```bash

    nmap -e eth1 -S 192.168.15 192.168.1.10

    ```


    # 第 4 部分：枚举

    由 Hidaia Mahmood Alassouli 教授提供的认证道德黑客（CEH）课程第 4 部分（Hidaia_alassouli@hotmail.com）。


    ## 枚举工具

    有一个工具叫做 `Dumpsec`。我们可以从这个工具获取有关机器的信息。你可以使用 `sid2user` 工具。


    使用 `nmap` 查看端口 `161` 是否开启：

    ```bash

    nmap 192.168.28.137

    nmap 192.168.28.137

    ```

    前往应用程序、信息收集（information gathering）、网络分析（network analysis）、snmp 分析（snmp analysis）、`snmpenum`：

    ```bash

    ./snmpenum.pl 192.168.1.1 public

    ```


    ## 邮件服务器继枚举

    在邮件服务器枚举中，尝试从邮件服务器获取信息。我们可以发现邮件服务器是否为开放继（open relay）；垃圾邮件者可以发送大量邮件导致其被列名单。要确定邮件服务器是否为开放继，检查
    `http://www.mailradar.com/openrelay/`：


    ```

    220 smtp01.gov HELO mailradar.com

    250 smtp01.gov MAIL FROM:<>

    554 Relay denied

    221.0.0 Bye

    ```

    测试完毕！主机未接受任何继！


    在 linux 中使用 `netcat` 检测服务器是否为开放继。使用 `msfconsole`：

    ```bash

    search smtp

    use auxiliary/scanner/smtp/smtp_enum

    show options

    set RHOST 213.244.82.152

    ```


    ### 其他邮件用户方法

    另一种从邮件服务器获取用户的方法：输入命令 `smtp-usr-enum`：

    ```bash

    smtpscan 213.244.82.152

    ```

    另一个工具叫做 `smtpscan`。要进行 LDAP 枚举，端口 `389` 必须开启。使用工具 `LDAP Admin`。你可以在 Windows 工具中使用
    `ldp.exe` 实现相同目的。我们使用 `nslookup dnsstuff.com` 进行 DNS 枚举。


    # 第 5 部分：系统破解

    由 Hidaia Mahmood Alassouli 教授提供的认证道德黑客（CEH）课程第 5 部分。


    ## 目录服务

    在工作组中，用户名和密码存储在同一台机器的 `SAM` 文件中。如果我们能从 `SAM` 文件获取数据，我们就可以破解密码。在域中，用户名和密码存储在域控制器（domain
    controller）中。目录服务由四部分组成：域分区（domain partition）、架构分区（schema partition）、配置分区（configuration
    partition）和应用程序分区（application partition）。

    - `domain`：包含关于网络中所有对象的数据。

    - `schema partition`：由属性或类模板组成。

    - `configuration partition`：由域控制器的基础设施组成。


    在 Active Directory 域中，机器使用 `Kerberos` 服务登录。当客户端想要访问任何资源时，它会访问 `Kerberos` 下一个名为
    `TGS`（票据授予服务）的服务。`TGS` 携带 `TGT`（授权票据）。`TGT` 包含用户的 `SID` 以及用户所属的安全组。机器在想要访问服务时请求
    `TGT`，Active Directory 授予服务票据和会话密钥；机器将服务票据和身份验证提供给服务。


    ## Cain and Abel 工具

    使用 `Cain and Abel` 工具：告诉它你想使用网络。选择进行 `ARP poisoning`（ARP 污染）。选择运行 `NTLM authentication`（NTLM
    认证）。前往 `sniffers`，然后选择 `hosts` 并点击 `add`。点击所有主机。前往 `ARP`，检查网关，并选择我们想要进行 `ARP poisoning`
    的目标。浏览网络中的任一机器以查看其共享内容。


    然后回到 `Cain and Abel`，点击 `passwords`，然后点击 `SMB`，我们将找到 `LM hash` 和 `NTLM hash`。我们可以从这些哈值破解密码。


    ## 高级密码恢复

    可以使用 `hydra` 查找密码：

    ```bash

    hydra -l msfadmin -P dictionary.txt 192.168.1.3 ftp

    ```

    使用 `ncrack` 实现相同目的：

    ```bash

    ncrack -u msfadmin -P /pentest/wordlists/darkde.lst 192.168.1.29

    ```

    你有一个优盘，当你将其插入设备时，它会窃取信息。nirsoft.net 上有一个工具可以恢复所有类型的密码。


    ### 方法 1：U 盘

    从网站获取程序：`mspass`、`pspv`、`passwordfox`（例如 `iepv_setup.exe`、`mailpv_setup.exe`）。获取程序并将其放入文件夹中。安装
    `iepv` 和 `mailpv` 程序并从程序文件夹获取它们的程序。在文件夹中创建 `autorun.inf`。


    ### 方法 2：USB 工具

    使用 `USB_Utilities`。选择 USB thief。浏览并选择你解压 USB 工具的位置。获取 `USBThief` 文件夹中的数据并放入闪存盘中。当你将闪存插入机器时，它将导出所有密码。


