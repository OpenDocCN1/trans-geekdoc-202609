    # Nessus Registration Guide

    To register in Nessus: `/opt/Nessus/bin`. After you finish, go to applications,
    backtrack, vulnerability assessment, vulnerability scanners, `nessus`. In browser,
    write `https://127.0.0.1:8834` and add the network subnet to scan.


    ## Web Vulnerability Scanners

    - Use the `Acunetix` web vulnerability scanner.

    - `W3af` Web Vulnerability scanner: Go to `Vulnerability Assessment`, `Web Application
    Assessment`, `Web Vulnerability Scanner`, `w3af gui`.

    - Scan vulnerability using `armitage` and `metasploit`.


    ## Tunneling and Proxy Techniques

    You can use `TOR` proxy server. Use the tool `super network tunnel`. Install it
    in the server and client and make the configuration. It is used when there is
    a firewall blocking all ports to the server except the HTTP ports `80` and `443`,
    and we want to communicate with the server through the open port `80`, but we
    must install the server part of the program also in the server. Add user, then
    start server. Setup the program in client computer. Give it the IP of the server.
    Put the username that you created in the server and the password. You can add
    Internet Explorer over tunnel and logon through `ftp` tunnel.


    Install `Copssh` tool in the server and create the user for a client. Activate
    a user. While installing `putty` in the client, use the `SSH` as proxy server.


    ## IP Spoofing

    Use `nmap` to do IP spoofing:

    ```bash

    nmap -e eth1 -S 192.168.15 192.168.1.10

    ```


    # Part 4: Enumeration

    Part 4 of Certified Ethical Hacker (CEH) Course by Dr. Hidaia Mahmood Alassouli
    (Hidaia_alassouli@hotmail.com).


    ## Enumeration Tools

    There is a tool called `Dumpsec`. We can get information about machines from this
    tool. You can use `sid2user` tool.


    Use `nmap` to see if port `161` is open:

    ```bash

    nmap 192.168.28.137

    nmap 192.168.28.137

    ```

    Go to applications, information gathering, network analysis, snmp analysis, `snmpenum`:

    ```bash

    ./snmpenum.pl 192.168.1.1 public

    ```


    ## Mail Server Relay Enumeration

    In mail server enumeration, try to get information from the mail server. We can
    find if the mail server is an open relay; spammers can send too many emails so
    it gets blacklisted. To know whether the mail server is open relay, check `http://www.mailradar.com/openrelay/`:


    ```

    220 smtp01.gov HELO mailradar.com

    250 smtp01.gov MAIL FROM:<>

    554 Relay denied

    221.0.0 Bye

    ```

    All tested! No relays accepted by host!


    Use `netcat` in linux to detect if the server is open relay. Use `msfconsole`:

    ```bash

    search smtp

    use auxiliary/scanner/smtp/smtp_enum

    show options

    set RHOST 213.244.82.152

    ```


    ### Other Mail User Methods

    Another way to get user from mail server: type the command `smtp-usr-enum`:

    ```bash

    smtpscan 213.244.82.152

    ```

    Another tool called `smtpscan`. To do LDAP enumeration, port `389` must be open.
    Use the tool `LDAP Admin`. You can use `ldp.exe` in Windows tools for the same
    purpose. We use DNS enumeration using `nslookup dnsstuff.com`.


    # Part 5: System Hacking

    Part 5 of Certified Ethical Hacker (CEH) Course by Dr. Hidaia Mahmood Alassouli.


    ## Directory Services

    In a workgroup, usernames and passwords are stored in the `SAM` file on the same
    machine. We can crack the passwords if we get the data from the `SAM` file. In
    domains, the usernames and passwords are stored in the `domain controller`. The
    directory service consists of four parts: `domain partition`, `schema partition`,
    `configuration partition`, and `application partition`.

    - `domain`: contains data about all objects in the network.

    - `schema partition`: consists of attributes or class templates.

    - `configuration partition`: consists of the infrastructure of the domain controller.


    In Active Directory domains, the machine logs using `Kerberos` service. When the
    client wants to access any resource, it goes to a service under `Kerberos` called
    `TGS` (Ticket Granting Service). The `TGS` carries `TGT` (Ticket Granting Ticket).
    The `TGT` contains the `SID` for users and the security groups the users belong
    to. The machine requests the `TGT` when it wants to access a service, and the
    Active Directory grants a service ticket and session key; the machine gives the
    service ticket and authentication to the service.


    ## Cain and Abel Tool

    Using the `Cain and Abel` tool: tell it you want to use the network. Choose to
    make `ARP poisoning`. Choose to run `NTLM authentication`. Go to `sniffers`, then
    `hosts`, and `add`. Click all hosts. Go to `ARP`, check the gateway, and choose
    the destination we want to make `ARP poisoning`. Browse any machine in the network
    to see its shares.


    Then go to `Cain and Abel`, click `passwords`, then click `SMB`, and we will find
    `LM hash` and `NTLM hash`. We can crack the password from this hash.


    ## Advanced Password Recovery

    You can find the password using `hydra`:

    ```bash

    hydra -l msfadmin -P dictionary.txt 192.168.1.3 ftp

    ```

    Use `ncrack` for the same purpose:

    ```bash

    ncrack -u msfadmin -P /pentest/wordlists/darkde.lst 192.168.1.29

    ```

    You have a flash drive and when you put it inside the device, it will steal information.
    There is a tool in `nirsoft.net` to recover all types of passwords.


    ### Method 1: USB Drive

    Take the programs from the website: `mspass`, `pspv`, `passwordfox` (example:
    `iepv_setup.exe`, `mailpv_setup.exe`). Take the programs and put them in a folder.
    Setup the `iepv` and `mailpv` programs and take their programs from the program
    folder. Create `autorun.inf` in the folder.


    ### Method 2: USB Utilities

    Use `USB_Utilities`. Choose the USB thief. Browse and choose the place where you
    extracted the USB utilities. Take the data in the `USBThief` folder and put it
    in flash memory. When you put the flash in the machine, it will dump all passwords.
    When you go home, open the dump folder.

