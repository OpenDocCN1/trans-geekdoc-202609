    ![](img/image-8dyikv5j.jpg) 点击 `airrack-ng` 解密 WEP 密码。你将获得密码。在 `WEP` 加密中，预共享密钥的长度是固定的。他们试图找到一种具有可变密钥的方法，因此发现了临时密钥完整性协议
    `TKIP`，它可以每次通过四次握手来更改密钥。在 `WEP` 个人模式中，我们在认证中使用预共享密钥；而在 `WEP` 企业模式中，我们在认证中使用 radius
    节点。![](img/image-m0t3u3ie.jpg) ![](img/image-8jzgokmx.jpg) ![](img/image-d4v73oxz.jpg)


    密钥由 `TKIP`（临时加密密钥）以及紧随其后的 `TSE`（即 `IV` 和 `EIV`）组成。这两部分被称为密钥混合。然后它们进入 `RC4` 密算法。数据由两部分组成：`MSDU`
    `MIC` 密钥。这两部分进入 `michael` 算法，该算法将保护数据，使任何人无法编辑数据。算法的输出将被分段，并发送到 `CRC-32` 校验算法进行错误检测和纠正，输出的
    `ICV` 将附在包上。它会对数据和密钥进行 `XOR` 运算，并作为 `Ciphertext` 放入数据包。为了更改临时密钥加密，我们使用四次握手。它通过
    `EAP` 成功发生，该协议通过向接入点发送 `Anoce` 来更改密码。拥有 `PTK` 的智能设备将理解 `Anoce` 并回回发送 `Snoce` 以及
    `MIC`。接入点将验证 `MIC`，如果正常则会响应。![](img/image-yz5akucq.jpg) 我们通过监控模式监听网络。发现的任何数据包都会将其捕获并保存到文件中。我们将等待任何与接入点进行握手的客户端，分离该客户端并接收其响应将其捕获到文件中。通过字典攻击，我们将对文件进行解密并找到密码。


