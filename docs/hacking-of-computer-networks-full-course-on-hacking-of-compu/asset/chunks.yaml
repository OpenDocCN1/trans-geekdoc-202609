    IP 伪装。我们向 `Zombie` 发送 `SYN/ACK`，它响应以 `RST`。我们再次向 `Zombie` 发送 `SYN ACK` 并获取包 ID。如果
    ID 增加了两个数字，则端口是开放；如果增加了一个数字，则端口是关闭。在 `UDP` 扫描中，黑客向目标发送 `UDP` 探测。如果目标没有回答，则端口是开放的；否则是关闭的：

