    # 基于机器学习预测模型的建筑 HVAC 系统优化：一种基于算法的经济分析


    Mofeyang Li

    山西省高市第一号中学

    中国，山西

    1319407831@qq.com


    摘要——暖、通风与空调（HVAC）系统已在中国办公场所广泛应用。然而，城市中的 24 小时运行计划往往由于额外电力消耗了不必要的能量而导致成本高昂。为了应对这一挑战并使
    HVAC 运行效率最大化，本研究构建了包括聚类、回归和深度学习在内的机器学习（ML）算法预测模型，对源自中国某办公楼的数据数据进行优化。优化的目标是通过控制温度来最大限度地减少消耗较少的冷量。通过训练后的模型，优化结果显示出良好的前景：对于单栋办公楼，它能够降低能源成本、净现值（NPV）、生命周期成本分析（LCCA）以及社会碳成本（SCC）。研究发现可应用于能源领域：电力配电，通过为
    HVAC 系统提出一种优化方法，本文还旨在通过先进的机器学习技术激发更多节能工作，希望通过日常生活中更强大、更好的方法来缓解波动的全球气候。


    （此处）用于 HVAC 系统，但它不仅能缓解短缺，对于减少非可再生能源消耗、保护生态环境和维持空气质量具有重要意义。本文提出了一种调整建筑 HVAC 操作涉及的系统参数的方法，以实现低能耗和低成本的系统。该方法使用了建筑冷水机冷却系统和加热水的实际数据，包括从两个观测点获取的
    414 个参数，并应用机器学习来优化中央空调系统的运行策略，然后基于全生命周期成本法、净现值（NPV）以及使用社会碳成本（SCC）的社会经济效益计算经济效益，实际上实现了城市节能的目标。


    **关键词**——HVAC 系统、机器学习、预测、节能


    # I. 引言


    随着中国的快速发展、人们生活水平的提高以及人均建筑面积的持续扩大，HVAC 的应用已普及。HVAC 系统的节能挑战成为一个待解决的能源问题。2018 年，建筑总能耗占总能耗的
    80 亿吨。此外，中国单位建筑的能源使用量仍是气候相似的发达国家的三倍。HVAC 领域需要更多技术创新来降低能耗。建筑 HVAC 系统的作用体现在加热、通风和空调三大主要方面。为了实现节能目的，我们可以选择合适的系统设计并加强系统控制。如果节能减耗措施


    （此处缺失）


    建筑运行的经典控制算法包括 PID 和模糊控制等逻辑。然而，由于 PID 或模糊控制无法确保在保持建筑正常运行的同时实现最小能耗的最优运行，研究人员已专注于开发机器学习算法，以利用建筑能源系统的历史数据实现最优预测
    [1][2]。因此，优化节能是可能的，特别是 HVAC 系统，可以在保持舒适度控制等正常运行的同时节省能源。


    # II. 相关工作

    *（注：提供的 OCR 文本中缺少第二部分，直接从 I 跳到 III。根据源文本，我将直接进入第三部分。）*


    # III. 贡献


    本文提出了基于机器学习算法（梯度提升、随机森林、自适应回归）的数据驱动模型，以降低办公楼 HVAC 系统的冷水机功率和电力预测。开发了一种新框架，通过冷水机动态运行优化冷水机房，在不增加新硬件和成本的情况下降低能效和碳排放，这是通过训练好的预测模型监控并控制
    HVAC 控器中的参数实现的，在不牺牲任何热舒适度或冷量的情况下将使用降至最低。通过将 LCCA（生命周期成本分析）和 SCC（社会成本）与 NPV（净现值）相结合，本文生动地连接了通过节能算法可能产生的商业效益和社会效益。机器学习是强大的，当它准确有效地处理数据时，它确实发挥作用。通过伪代码、数字表格和示例，这些算法应该易于可视化并推广到能源领域其他具有实现成就潜力的方面。


    3) Adboost 回归，Adboost 级联弱学习器，并在添加它们之前对之前训练的每个学习器进行权重调优。Adboost 提供了一个不需要特征选择的相对预测模型。然而，如果噪声加剧可能会误导每一步的权重调整并增加时间。Adabo
    中的参数列如下表 III 所示。


    # IV. 方法论


    # A. 冷功率预测和电力预测模型的开发


    1) 梯度提升（Gradient Boosting, GBR）是用于训练模型以准确预测冷功率的主要算法。梯度提升是梯度下降的一种。GBR 中有几个关键参数需要注意：估计器数量、学习率、最小样本分裂、最大深度和损失函数。表
    I 显示了每个参数的描述。通过对参数进行网格搜索，可以以最佳性能优化模型。


    表 I 梯度提升 (GBR) 中的参数


    | 参数名称 | 描述 |

    | :--- | :--- |

    | number of estimators | 执行的阶段数量 |

    | learning rate | 每个阶段贡献的百分比 |

    | minimum sample split | 分裂内部节点所需的样本数 |

    | maximum depth | 每个个体（树）的最大深度 |


    2) 随机森林回归，梯度随机森林由大量的决策树组成，它们在线性回归问题上运行良好且快速。对于本研究中使用的的数据集（涉及近 200 个特征），随机森林算法在不需要特征选择的情况下表现良好；它还有助于归纳哪些特征对最终结果更重要。随机森林参数列如下表
    II 所示。


    $R'' = 1 - \frac{\sum_{i=1}^{n} (\hat{y}_i - y_i)^2}{\sum_{i=1}^{n} y_i^2}$


    等等，$R'' = 1 - \frac{\sum_{i=1}^{n} (\hat{y}_i - y_i)^2}{\sum_{i=1}^{n} y_i^2}$，其中
    $\hat{y}$ 代表产出的预测值，$y$ 代表数据集中对应的实际值。


    表 II 随机森林算法中的参数


    | 参数名称 | 描述 |

    | :--- | :--- |

    | number of estimators | 森林中树的总数 |

    | minimum sample split | 分裂内部节点所需的最小样本数 |

    | maximum depth | 每棵单体树的最大深度 |


    表 III ADBOOST 中的参数


    | 参数名称 | 描述 |

    | :--- | :--- |

    | number of estimators | 执行的提升阶段数量 |

    | learning rate | 每个阶段贡献的百分比 |

    | Random state | 森林中使用的随机数 |


    4) 指标，有五种不同的指标用于检测和监控性能：


    > MAE（平均绝对误差）

    $$MAE = \frac{1}{n} \sum_{i=1}^{n} |\hat{y}_i - y_i|$$


    > MSE（均方误差）

    $$MSE = \frac{1}{n} \sum_{i=1}^{n} (\hat{y}_i - y_i)^2$$


    > RMSE（均方根误差）

    $$RMSE = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (\hat{y}_i - y_i)^2}$$


    > WMAPE（加权绝对百分比误差）

    $$WMAPE = \frac{\sum_{i=1}^{n} |\hat{y}_i - y_i|}{\sum_{i=1}^{n} y_i}$$


    模型中 192 个参数的特征重要性有助于检测哪些变量影响冷功率或其他参数，从而将能源成本降低到更低的水平。其机制是随机扰动特定参数的值，并观察修改对模型性能的影响；如果有影响，完美版本应该产生较低的准确率，反之亦然。与
    MAPE 相比，加权 WMAPE 更适用于数据集，因为在某些参数空间存在零。


