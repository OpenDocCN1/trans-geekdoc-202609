    # C. Economic analysis


    To fulfill NPV, the actual data is required for calculations. The electricity
    rate in China from 0.7 RMB/kWh to RMB/kWh for commercial. For simplicity, we assume
    the average rate to be RMB/kWh. The discount rate in China, updated in June 2020,
