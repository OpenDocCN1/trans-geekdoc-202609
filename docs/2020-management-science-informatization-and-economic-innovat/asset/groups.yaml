    To illustrate how the best parameters are found, the following methods can be
    used: Gradient Boosting Regression apply to the other algorithms as well. The
    parameters interact with each other so the value of each is determined by a exhaustive
    search in a reasonable parameter space, with each search evaluating the model
    based on like-squared parameters. For example, min sample split in GBR is optimized
    to a value where the R-score reaches a point between a range of [2,12]. Each time
    the process is repeated, the parameters are updated to the next optimal value
    for a further iteration searching for another parameter until parameters are updated
    to their optimum.


    Figure 5- The exhaustive search for the optimal value of the parameter min_sample_split
    in GBR.


