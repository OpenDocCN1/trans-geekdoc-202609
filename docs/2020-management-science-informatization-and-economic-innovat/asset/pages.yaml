    # C. Economic analysis


    To fulfill NPV, the actual data is required for the calculations. The electricity
    rate in China from 0.7 RMB/kWh to 1 RMB/kWh for commercial. For simplicity, we
    assume the average rate to be 1 RMB/kWh. The discount rate in China, updated in
    June 2020, NPV formula with all the parameters helps to estimate Present Value
    for the life of 50 years. For this investment, the cost of implementing the algorithm
    into the actual building is estimated to be $40,000. Meanwhile, the SCC for China
    is estimated to be $24 per tonCO$_2$].


    Having large wind-power and solar power capacity in the world, China has developed
    green technologies for decades. However, to face fossil fuels, energy use has
    a lower priority over total energy consumption. Future development in this field
    is emerging to be more important, which will be seen in the future. Machine learning
    algorithms, like the one in this paper, should be a crucial part of innovations
    and creations in green energy. Energy storage and dispatch technologies should
    be developed in hand with experts who have joined cleaner energy. For example,
    Germany and its citizens have suffered from extra costs created in redistributing
    and stabilizing the volatility of energy through smart grids.


