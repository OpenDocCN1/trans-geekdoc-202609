    4) Metrics There are five different metrics to detect and monitor model performances;:


    > MAE (Mean Absolute Error)

    $$MAE = \frac{1}{n} \sum_{i=1}^{n} |\hat{y}_i - y_i|$$


    > MSE (Mean Squared Error)

    $$MSE = \frac{1}{n} \sum_{i=1}^{n} (\hat{y}_i - y_i)^2$$


    > RMSE (Root Mean Squared Error)

    $$RMSE = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (\hat{y}_i - y_i)^2}$$


    > WMAPE (Weighted Absolute Percentage Error)

    $$WMAPE = \frac{\sum_{i=1}^{n} |\hat{y}_i - y_i|}{\sum_{i=1}^{n} y_i}$$


    Feature importance for the 192 parameters in the model are helped to detect which
    variables contribute to the chilling power or other parameters to reduce the energy
    cost to a lower level. The mechanism is to randomly perturb the values of a particular
    parameter and observe how much modification affects the performance of the model;
    if a performance, the perfect version should yield a lower accuracy and vice versa.


