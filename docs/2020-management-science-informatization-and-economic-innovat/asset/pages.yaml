    # VI. CONCLUSIONS


    The hypothesis that applying prediction and optimization methods to real office
    buildings can achieve budget savings and energy conservation is supported by the
    results in this paper. By controlling settings in HVAC systems that programmed
    to manage the power output when the amount of cooling is demanded, power usage
    can be effectively monitored and reduced to a desirable level.


    This paper studies and predicts optimization machine learning algorithms for energy
    conservation in HVAC systems in office buildings yields economic benefits for
    the society by implementing such algorithms.


    Results are quite promising for future development in this field. For the particular
    HVAC use, economic analysis shows that it would save more than $30,000 annually
    for the booming society of China. The validity of the results and findings in
