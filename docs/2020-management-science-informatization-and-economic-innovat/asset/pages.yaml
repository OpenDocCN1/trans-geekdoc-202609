    Abstract—The Heating, Ventilation and Air Conditioning (HVAC) systems have been
    widely employed by offices in China. However, 24-hour running schedules in cities
    are often costly due to unnecessary energy consumed by extra power. To cope with
    this challenge and maximize HVAC running efficiency, this study builds prediction
    models with machine learning (ML) algorithms including clustering, regression,
    and deep learning to optimize the systems data derived from an office building
    in China. The goal of optimization is to minimize the amount of cooling which
    is less consumed, which is done by controlling the temperature. With trained models,
    the results of optimization showing a promising outcome, that for a single office
    building, it can reduce the energy cost, Net Present Value (NPV), Life Cycle Cost
    Analysis (LCCA), and Social Carbon Cost (SCC). Findings can be found in the field
    of energy: power distribution by suggesting an optimization methodology for HVAC
    systems, this paper also aims to inspire more work in energy conservation through
    advanced machine learning technologies, in the hope that the volatile, global
    climate can be mitigated by greater and better approaches in everyday life.


    are for the HVAC system, but it will not only alleviate the shortage, but also
    have important significance for reducing the consumption of non-renewable energy,
    protecting the ecological environment, and maintaining air quality. This paper
    presents a method by adjusting system parameters involved in HVAC operations in
    buildings to order that a lower energy and cost system can be achieved. The method
    uses the actual data of the chiller cooling system and heating water from a building
    including 414 parameters from two points observed, and applies machine learning
    to optimize the operation strategy of the central air conditioning system, and
    then calculates the economic benefits of the model based on the full life cost
    method and Net Present Value(NPV) and socioeconomic benefits using Social Cost
    of Carbon (SCC) actually achieving the goal of energy saving for the city.


    **Keywords**—HVAC system, machine learning, prediction, energy conservation


    # I. INTRODUCTION


    With the rapid growth of China, the improvement of people''s living standards
    and the continuous expansion of per capita building area, the application of HVAC
    has become widespread. The challenge of energy conservation of HVAC systems becomes
    an energy problem to solve. In 2018, the total energy consumption of building
    was 8 billion tons of the total energy consumption. In addition, the energy use
    per unit of building in China is still three to that of developed countries with
    similar climates in development. More technological innovations are needed in
    the field of HVAC to reduce energy consumption. The role of building HVAC system
    is reflected in the three major aspects of heating, ventilation and air conditioning.
    To achieve the purpose of energy saving, we can select the appropriate system
    design, and strengthen the system control. If energy saving and consumption reduction
    measures


    The classical control algorithms for building operations include logic like PID
    and fuzzy control. However, since PID or fuzzy control cannot ensure the optimal
    operation for minimizing energy consumption while maintaining the normal building
    operations, researchers have focused on developing machine learning algorithms
    to realize optimal prediction with historical data from building energy systems
    [1][2]. Therefore, it has possible to optimize energy saving, especially HVAC
    systems to save energy while maintaining normal operations such as comfort control.


    # III. CONTRIBUTIONS


