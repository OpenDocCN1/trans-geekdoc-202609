    1871–1876. IEEE, 2015.

    - [2] Pooja Anand, Yashwant Singh, and Arvind Selwal. Internet of things (iot):
    Vulnerabilities and remediation strategies. In *The International Conference on
    Recent Innovations in Computing*, pages 265–273. Springer, 2020.

    - [3] Kamal Benzekki, Abdelsam El Fergougui, and Abdelkik Elbelrhiti Elalaoui.
    Software-defined networking (sdn): a survey. *Security and communication networks*,
    9(18):5803–5833, 2016.

    - [4] Peter Edemekong, Pavan Annamaraju, and Micelle Haydel. Health insurance
    portability and accountability act. *StatPearls*, 2020.

    - [5] Open Networking Foundation. Software-defined networking: The new norm for
    networks. *ONF White Paper*, 2(2-6):11, 2012.

    - [6] Hamidreza Ghorbani, M Saeed Mohammadzahed, and M Hossein Ahmadzadegan. Ddos
    attacks on the iot network with the emergence of 5g. In *2020 International Conference
    on Technology and Entrepreneurship-Virtual (ICTE-V)*, pages 1–5. IEEE, 2020.

    - [7] Adra Hammoud, Mohamed Lahmer, Samir Mbarki, and Fatima Sifou. The contribution
    of mda in software-defined network: A survey. In *Advancements in Model-Driven
    Architecture in Software Engineering*, pages 118–134. IGI Global, 2020.

    - [8] W. Iqbal, H. Abbas, M. Daneshmand, B. Rauf, and Y. A. Bangash. An in-depth
    analysis of iot security requirements, challenges, and their countermeasures via
    software-defined security. *IEEE Internet of Things Journal*, 7(10):10250–10276,
    2020.

    - [9] Yaser Jararweh, Mahmoud Al-Ayyoub, Ala Darabseh, Elhadj Benkhelifa, Mladen
    Vouk, and Andrew Rindos. Software defined cloud: Survey, system and evaluation.
    *Future Generation Computer Systems*, 58, 10 2015.

    - [10] Anneke G Kleppe, Jos Warmer, Jos B Warmer, and Wim Bast. *MDA explained:
    the model driven architecture: practice and promise*. Addison-Wesley Professional,
