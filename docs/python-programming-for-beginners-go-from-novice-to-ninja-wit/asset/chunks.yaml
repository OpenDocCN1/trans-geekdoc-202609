    organized, and reusable code. You''ve reached a coding milestone! Good on you!
    Now let''s move on to the next phase of your journey!


    ## Chapter 5: Python and Object-Oriented Programming


    Being the powerful and versatile language that it is, Python, of course, supports
    Object-Oriented Programming (OOP). OOP is a programming paradigm that allows you
    to model real-world concepts as objects, hence the name "Object-Oriented Programming."
    It''s probably a little unfortunate that OOP is one letter off from "oops," which
    is what happens when you make a coding mistake, but that''s how it is.


    # Section 1: What is OOP?


    "Object-oriented programming (OOP) is a programming paradigm in computer science
    that relies on the concept of classes and objects. It is used to structure a software
    program into simple, reusable pieces of code blueprints (usually called classes),
    which are used to create individual instances of objects. There are many object-oriented
    programming languages, including JavaScript, C++, Java, and Python." (Doherty,
    n.d.)


    Python is not limited to OOP, it also supports [procedural programming](#part0017.xhtml#a3E9)
    styles.


    # Section 2: The Building Blocks of OOP


    OOP has four essential building blocks:


    - Classes

    - Objects

    - Methods

    - Attributes


    # Classes


    Classes are user-defined data types (Doherty, n.d.). We touched on this in our
    weather app project. Another way to think of classes is to see them as blueprints
    for objects. For example, to build a house, you need a blueprint to know how to
    construct it.


    # Objects


    Objects are instances built from classes. An instance is the house you build from
    your blueprint. You can build many houses from one blueprint. You can also create
    many instances from one class. Something to keep in mind is that you can build
    many houses from one blueprint, but they don''t all have to look exactly alike.
    You can use different colors and other accents to make each house unique. How
    does that apply to instances? More on that later.


    # Methods


    Methods are representations of actions in your class. To use a method with an
    object, you use "dot" notation. For the weather app, we did this:


    ```python

    # Create a window instance

    window = tk.Tk()


    # Set the window title

    window.title("Weather Forecast App")

    ```


    We created a "Tkinter" window object, then we called the `title` method to put
    a title on the app.


    # Attributes


    Attributes, also referred to as fields, store data in your class. The state of
    an object is defined by its attributes. If we go back to our blueprint analogy,
    let''s say you made a "house" class. With instance attributes (attributes that
    affect the individual instances of your class), you could have one called `self.color`,
    and with that, you could make one instance of a house blue and another red.


    # Section 3: Inheritance and Composition


    "Inheritance and composition are two major concepts in object oriented \[sic\]
    programming that model the relationship between two classes. They drive the design
    of an application and determine how the application should evolve as new features
    are added or requirements change.


    Both of them enable code reuse, but they do it in different ways." (Python, 2023)


    # The Inheritance Model


    Inheritance models the "is a" relationship. It represents the relationship between
    a base class and any class that is derived from it. For example, let''s say you
    have a base class called "Vehicle". In that class, you have some initial attributes
    such as year, make, and model. The class also has a method to start the engine
    and another to stop it. You can make a specific model of vehicle, So, you create
    a "Car" class derived from "Vehicle", meaning your car class has this relationship
    with the vehicle class: "Car" is a "Vehicle".


    In our example, "Car" is referred to as a subclass, a derived class, or a subtype.
    The "Vehicle" class is referred to as a superclass, or base class. Our "Car" class
    is said to inherit, derive from, or extend the vehicle class. Because "Car" is
    derived from "Vehicle", it inherits the interface and implementation of "Vehicle".
    This means that your "Car" class has year, make, and model included and has access
    to the start and stop engine methods in the "Vehicle" class.


    # About Methods


    Methods are essentially functions, but they live inside a class and are called
    using "dot" (.) notation.


    # About Class Names


    In Python, classes use "camel case" for their names. This means class names always
    start with capital letters and if the class name is more than one word, the next
    word is capitalized with no spaces. Example: `ClassNameIsLong`.


    # Composition


    Composition models a "has a" relationship. Let''s go back to our car analogy.
    We derived the Car from the Vehicle class, but a car needs an engine. So, let''s
    create a "Motor" class. The Car class is not derived from the Motor class. Instead,
    it uses the Motor class as a component. In this relationship between the Car class
    and the Motor class, Car is the composite class, and Motor is the component class.
    Logically, a car is a vehicle that has a motor.


    # Let''s demonstrate this with some example code.


    # Vehicle Class Example


    ![A screenshot of a computer program Vehicle super class.](image_rsrc3JY.jpg)


    In the example shown above, note that "\\" is being used to break the lines. They
    can be removed if you are writing this in your own code.


    Line 1: The class name. As mentioned before, class names in Python are capitalized.


    Line 2: The `__init__` declaration has two underscores on either side of. The
    `__init__` definition is called automatically when a class is initialized and
    defines class attributes on initialization. This definition is referred to as
    the class''s constructor since it is what the code uses to construct an instance
    of the class. In this example, the constructor is initializing the make, model,
    and year attributes. The `self` keyword is a reference to the specific instance.
    Think of it as the instance saying, "me", or "my".


    Lines 3-4: This means that this class will accept inputs for these attributes
    when initialized.


    Lines 7-9 and 11-13: These are the `start_engine` and `stop_engine` functions
    of the Vehicle class. When these functions are referred to outside of the Vehicle
    class, these very functions are referred to as methods.


    # Car Subclass/Inheritance Example


    The Car class is a subclass of Vehicle. It can also be called a "derived" class.
    It inherits the attributes of the Vehicle class by extending the Vehicle class.


    ![Car subclass code part 1](image_rsrc3JZ.jpg)


    Line 26: Note the word "Vehicle" inside the parentheses. This says that the Car
    class is extending the Vehicle class and therefore is inheriting its attributes.

