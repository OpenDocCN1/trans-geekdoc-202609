    # Chapter 7 Recap!


    This has been a long and detailed chapter! If you put all the code in yourself,
    rather than just copying and pasting it in, good on you!


    In this chapter, you learned a little about web frameworks. Granted, it was not
    in-depth, but you did get some exposure. If want to learn more about `Flask` or
    other web frameworks, there are plenty of resources available, especially on YouTube.
    Of all the ways to deploy your code, converting your code into a web app is probably
    the most popular and the most user-friendly.


    In addition to using a web framework, you also learned some basic `git` commands.
    If you''re going to be doing a lot of programming, learning how to use `git` is
