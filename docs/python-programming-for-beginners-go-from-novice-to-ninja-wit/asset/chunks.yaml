    # 第 4 节：模块与库


    ## 模块


    模块化编程是所有现代编程语言中的核心概念。它是将你的编程代码拆分为更小的、自包含的模块的做法。例如，你的汽车有一个电池。电池起着一个功能：为你的车辆提供电源。它可能服务于汽车中其他更复杂的部件，但电池的功能是简单且定义明确。它提供动力。在代码术中，我们可以说当你向汽车里放入一节电池时，你正在导入一个电池模块并在你的汽车程序中使用。不仅如此，你可以在大多数汽车中放置汽车电池。你不需要购买特定品牌的汽车电池。无论什么种车辆，它们的作用都是相同的。


    在 Python 中，模块的工作方式非常相似。它只是一个带有 `.py` 扩展的文件，其中包含语句和定义。你在编码项目中使用过模块。每当你使用 `import`
    关键字时，你都在导入一个模块。Python 有一个庞大的内置导入列表，位于此处：


    [`docs.python.org/3/py-modindex.html`](https://docs.python.org/3/py-modindex.html)


    由于 Python 是开源的，网上有许多模块，你也可以编写自己的模块。


    模块的优点包括：


    -   **组织性**：模块通过按功能将项归在一起，帮助你保持代码组织整洁。

    -   **可重用性**：考虑 Python 的 `math` 模块。它内部包含了各种数学函数，可以导入到任何需要数学函数的 Python 代码中。它是可重用的，并且让你避免了自己亲手编写数学函数。

    -   **命名空间安全**：模块为你的函数和变量创建了独立的命名空间。一个模块中包含的变量或函数名很有可能也出现在另一个模块中。得益于“点”表示法，潜在的冲突被降到了最低，因为要使用模块中的函数，语法是
    `module_name.function_name()`。因此，即使你使用的两个模块都有一个名为 `walk_dog` 的函数，你也可以在函数调用中使用模块名来指定你指的是哪一个函数。

    -   **封装**：封装允许模块隐藏其操作的某些方面，从而便于他人使用。例如，要启动你的汽车，你只需要知道如何转动点火处的钥匙。你不需要了解或解释引擎、变速箱、刹车等复杂细节。你只需要使用这些东西，而无需操心它们。


    ## 库


    库简单来说就是模块的集合。虽然不是强制要求的，但库倾向于具有通用的主题。有些是通用的，如 Python 的标准库。另一些专注于机器学习或 Web 开发。


    # 简单代码示例


    我在同一个目录下有两个文件：


    - `test_module.py`

    - `module.py`


    `module.py` 文件内部有两个函数。一个用于两个数字相加，另一个用于相乘。在 `test_module.py` 中，我导入了 `module` 并使用了它的两个方法：


    ![A screenshot of a computer Description automatically generated](img/image_rsrc3K3.jpg)


    当我运行它时，第 3 行得到结果 15，第 4 行得到结果 56。执行工作的方法在 `module` 模块中。你可能需要为代码中反复执行的操作创建一个自定义模块。创建自己的模块的能力使得这一切变得可行。


    `module.py` 文件：


    ![A screenshot of a computer Description automatically generated](img/image_rsrc3K4.jpg)


    # 第 5 部分总结


    在本节，我们查看了面向对象编程的构建块以及 Python 如何支持它。在学习 OOP 的过程中，我们查看了继承和组合，并了解到继承模型具有“是”的关系，而组合模型具有“拥有”的关系。（汽车是一种车辆，它有一个电机。）最后，我们查看了模块和库，并了解模块如何帮助将代码组织成可重用且方便的单元，就像汽车电池可以使用各种车辆一样。


