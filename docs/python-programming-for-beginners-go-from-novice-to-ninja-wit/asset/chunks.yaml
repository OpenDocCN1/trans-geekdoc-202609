    # Section 4: Bulk Mailer


    Sometimes you might have a situation where you need to send emails out to several
    people in your organization and you need to personalize them. Let''s say, for
    example, each quarter you receive a CSV file with quarterly review scores, and
    you need to send those results out to each individual. This script will help you
    parse a CSV file, build the emails, and send them out.


    Note: This example uses Gmail. You will need a Google account if you want to follow
    along with this. Or, you could use this as a template and modify it to use a mail
    service of your choice.


    # The CSV file


    First, create a folder called "MailerApp". Inside that, create a folder called
    "DataFiles." For this example, we''ll be using a file called "Employees.csv."
    You can download that file using the link at the end of the [Answer Key](#part0018.xhtml#a3D2)
    section.


    Save the CSV file in the DataFiles folder. The file contains three fields: name,
    email, and score. The emails are dummy emails. If you run this script with the
    dummy emails, you will get a bunch of undeliverable emails sent back to you. I
    would recommend making at least one of the records have an email address you can
    send to so you can see your results.


    # Setup


    Now go back to your MailerApp folder and create a new file called "mailer.py."
    Put these imports in it:


    ![A close-up of a computer screen Description automatically generated](image_rsrc3PJ.jpg)


