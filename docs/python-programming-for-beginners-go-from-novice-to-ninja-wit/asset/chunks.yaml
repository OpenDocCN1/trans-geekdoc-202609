    ## 索引错误 (Index Errors)\n\n当你尝试访问超出序列范围的索引时，就会发生索引错误。这是处理列表或字符串时常见的错误。\n\n## 键错误\
    \ (Key Errors)\n\n当你尝试访问字典中不存在的键时，就会发生键错误。这通常发生在键名拼写错误的情况下。\n\n## 属性错误 (Attribute\
    \ Errors)\n\n当你尝试访问对象不具备的属性时，就会发生属性错误。这可能是由于拼写错误或使用了错误的对象。\n\n# 第 2 部分：系统性的排除故障策略\n\
    \n## 隔离问题\n\n观察症状。排除故障的一部分就像医生询问病人。从识别如下症状开始：\n\n*   错误消息\n*   异常行为\n*   错误的输出\n\
    \n 缩小问题范围。找出问题是从什么时候开始的。是从一开始就有问题，还是在代码更改后开始的？\n\n*   错误消息告诉了你什么？有时它们可以定位位置。\n\
    *   将你的代码拆分成更小的部分并进行测试。例如，如果你已经确定某个特定函数（或函数）是问题所在，尝试将它们放入一段单独的代码块中。\n\n## 重现问题\
    \ (Reproduce the Issue)\n\n与上述类似，创建一个代码的简化版本，尽可能移除所有不相关的部分。你需要的是一个最小化的、运行的程序版本，专注于问题所在。有了此，你需要重现问题，以便识别根本原因。\n\
    \n## 进行代码走读并检查输入输出\n\n在视觉上和口头上过一遍你的代码，并注意输入和输出。当我说“口头上”时，我的字面意思是通过说话的方式过你的代码并解释它在做什么。在这一步，有一个在那里听你解释代码的人会有帮助，因为这会迫使你从工作中抽离出来并客观地审视它。\n\
    \n## 使用版本控制 (Use Version Control)\n\n如果你正在使用 Git 这样的版本控制系统，请回退到问题发生之前的代码版本。创建一个单独的分并缓慢地重新引入更改，直到问题再次出现。这也将帮助你隔离并纠正问题。\n\
    \n"
