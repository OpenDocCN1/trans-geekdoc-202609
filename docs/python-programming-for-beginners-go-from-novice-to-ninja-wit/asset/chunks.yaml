    点击“Add User”按钮并为自己创建一个具有`DB Admin`角色的用户。为自己选择一个用户名。保持“Host”和`<All Hosts (%)>`保持不变。输入你的用户凭据并记住它们！我在两个屏幕使用了相同的凭据。这可能不是最好的主意，但很容易记忆。


    点击“Next”。


    ## Windows 服务


    除非有理由，否则请保持默认设置并点击“Next”。


    ## 服务器文件权限


    除非有理由，否则请保持设置不变并点击“Next”。


    ## 应用配置


    点击“Execute”。执行完成后，点击“Finish”。按照提示完成安装。系统会提示你将日志复制到剪贴板。如果你想以后参考，可以将其保存。


    ## 将 Python 连接到 MySQL 数据库


    ### 在 MySQL 中创建数据库


    打开`MySQL Command-Line Client` 并运行此命令：


    ```

    Create database Quotes;

    ```


    如果你愿意，可以更改数据库名称，但在本示例中，我们将创建一个包含引言的小数据库。


    ## 编写 Python 脚本


    ### 创建文件夹：


    在你的 IDE 中创建一个名为 `to` 的文件夹来存放数据库示例。我将我的文件夹命名为“PyDbSample”。


    ### 创建你的文件：


    在该文件夹中创建以下文件：


    * `.env`

    * `.gitignore`

    * `create.py`

    * `delete.py`

    * `my_sql_db.py`

    * `read.py`

    * `show_records.py`

    * `update.py`


    我知道有很多文件，但目标是使代码模块化，保持主文件尽可能整洁，并将每个 `CRUD` 操作放在单独的文件中以便引用。


    ### “点”开头的文件


    `.env` 文件用于存储你之前在安装 `MySQL Server` 时创建的用户和密码。这样我们就可以在代码中访问这些信息而不将其暴露。


    在 `.env` 文件中，为用户创建一行，为密码创建另一行。完成后，你的文件应该像这样：


    ```

    user=YourUsername

    password=YourPassword

    ```


    将“YourUsername”更改为你的用户名（无引号），将“YourPassword”更改为你的密码（无引号）。


    在 `.gitignore` 文件中输入 `.env`（无引号）并保存。这是以防你决定将代码部署到 GitHub。


