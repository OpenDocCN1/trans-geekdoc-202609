- raw: 'What else did we learn? We learned about data types and type conversion, how
    to write and call functions and methods. We also learned how to write code by
    writing code! It''s the best way to learn any programming language. On our journey,
    we ended up learning how to write a weather app three different ways: As a standalone
    GUI, a command line app, and finally a web-based application that we deployed
    to the web! Not bad for just starting out!


    We also learned how to deploy code to an online repository called GitHub, a good
    skill to know if you''re planning a career as a programmer.


    Beyond just writing a few scripts, we also covered the basics of Object-Oriented
    Programming, a programming paradigm that relies on the concept of classes and
    objects. In that discussion, we talked about how derived classes have an "is a"
    relationship with their parent classes and that composite classes have a "has
    a" relationship. (A car is a vehicle, and it has a motor.)


    We went over common programming errors, how to diagnose and treat them, and how
    to perform systematic troubleshooting strategies.


    Chapter 7 was dedicated solely to the task of creating a web-based weather app.
    That''s where we wrote a command-line version of the app and used that to build
    our web-based one.


    After that, we looked at data analysis and visualization and we saw how by turning
    our numbers into visual representations we can better convey our data''s story.


    Then we dove into scripting and automation with several hands-on scripts. There
    again, we only scratched the surface, but you have a good foundation to build
    on.


    Finally, we covered database basics and Python integration where we learned how
    to connect Python to a database and wrote an app to interact with one. We also
    learned some basic SQL concepts and commands.


    While this is the end of this book, don''t let this be the end of your Python
    journey! Challenge yourself and think of ways you can use Python to automate tasks,
    solve problems, and even enhance your career!


    # Please Leave Me a Review!


    If you enjoyed what you learned from this book, please take a few moments to leave
