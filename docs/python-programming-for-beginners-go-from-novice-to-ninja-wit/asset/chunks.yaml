    \n## While 循环\n\n像 \"for\" 循环一样，“while\" 循环也是迭代函数。但与 \"for\" 循环不同，“while\" 循环在条件保持为真的情况下持续运行。\"\
    while\" 循环的语法如下：\n\n```python\nwhile condition:\n    # Code\n```\n\n为了更好地理解，让我们来看示例：\n\
    \n![While example](img/image_rsrc3HS.jpg)\n\n首先，第 2 行设置了一个计数器。\"while\" 循环并不总是需要设置，但通常是如此。第\
    \ 4 行打印计数。第 5 行引入了新的运算符 `+=`。还有类似的 `-=`、乘法 `*=` 和除法 `/=`。\n\n# 无限循环\n\n如果你没有设置适当的检查，“while\"\
    \ 循环可能会设置为“永远”运行。例如，如果你漏掉了第 5 行，你会看到屏幕。\n\n# 遍历字典和其他数据类型\n\n我们查看了遍历列表，但也提到过循环可以遍历其他类型。任何以顺序存储的数据都可以被迭代。当我们学习数据分析时会详细介绍。现在，这里有一个显示如何使用\
