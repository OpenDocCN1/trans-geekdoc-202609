  trans: '

    将您的代码部署为 Web 应用程序可以使其独立于平台。您的代码运行在后端服务器上，由它处理所有的繁重工作，并通过所有浏览器都能理解的协议共享结果。由于几乎每台计算机/设备都有浏览器和互联网连接，将您的应用程序
    Web 化意味着任何拥有浏览器的人都可以使用您的应用，无需进行任何设置。


    # 缺点


    用户必须连接互联网并使用浏览器。如果用户使用的是不支持的浏览器，他们必须使用更主流的浏览器才能运行您的应用程序。


    # 第 2 部分：让我们构建一个 Web 版天气应用吧！


    虽然我鼓励你在编写过程中编写此应用程序的代码，但你也可以按照此处提供的说明下载完整的文件，并将它们放在指定的位置。你也可以下载并仅将其作为参考。链接位于答案解析章节的末尾。


    # 第一步：为应用程序创建一个文件夹


    这将成为你的程序包。在我的机器上，我创建了一个名为“WebWeather”的文件夹。你可以创建任何你喜欢的名称。


    在 VSCode 中打开你刚刚创建的文件夹。你需要确保在后续的步骤中处于该文件夹内。如果你在使用其他开发工具，请确保在已创建的文件夹内部进行操作。


    # 第二步：创建虚拟环境


    确保你处于第一步中创建的文件夹中。为工作创建一个虚拟环境可以让你能够像在 Web 上运行一样开发并测试你的应用程序。


    # 打开终端窗口


    输入 `CTRL + \``（不带引号）打开终端窗口。在大多数键盘上，你看到的那个小符号位于 ESC 键下方。请注意终端打开时看到的文件夹路径。确保它位于第一步中创建的文件夹中。


    # 创建环境


    确保你在第一步的文件夹中打开了终端窗口。根据你的操作系统使用以下所示命令之一：


    Windows: `py -m venv .venv`


    Unix/macOS: `python3 -m vevn .venv`


    当你运行该命令时，你会在为本次练习创建的文件夹内看到一个 `.venv` 文件夹。


    # 激活环境


    在终端窗口中根据你的操作系统运行以下命令：


    [注意，下方列出的两个命令中 `venv` 之前都有一个点 (.)]


    Windows: `.venv\Scripts\activate`


    Unix/macOS: `source .venv/bin/activate`


    激活环境后，你应该应该能在终端窗口的提示符前看到 `(.venv)`。


    # 如果你需要退出虚拟环境


    只需在终端窗口中输入 `deactivate`（不带引号）。执行后，你应该看到终端窗口提示符中的 `(.venv)` 消失。要重新激活它，只需按照上述激活步骤操作。你不需要重新安装虚拟环境。


    # 第三步：安装包和支持文件/文件夹


    为了让应用程序运行，必须安装三个包。过去，我们一次安装一个包。通过下面的命令，我们将一次性安装三个包：


    *   `requests`

    *   `python-dotenv`

    *   `Flask`


    如果你有一个终端窗口，请打开它。在我们的文件夹中，我们将使用：


    ```

    pip install requests python-dotenv Flask

    ```


    当你运行该命令时，你会在为本次练习创建的文件夹内看到一个 `.venv` 文件夹。


    # .gitignore


    在我们情况下，我们将使用它来防止某些文件发送到 GitHub：


    ```

    .venv/

    __pycache__/

    ```


    # .env 文件


    在你的应用程序文件夹中创建一个名为 `.env` 的文件。该文件将存储你的环境变量：


    ```env

    API_KEY=YOUR_API_KEY

    ```


    # 添加 OpenWeatherMap.org API Key


    如果你一直在跟着操作并构建应用，你已经有一个 API 密钥了。如果没有，你可以去 [openweathermap.org](https://openweathermap.org/)
    注册一个——它是免费的。要将你的 API 密钥添加到 `.env` 文件中，只需打开它并添加此行即可：


    ```env

    API_KEY=YOUR_API_KEY

    ```


    # 支持文件夹


    在你的应用程序文件夹中创建这两个子文件夹：


    *   `static`

    *   `templates`


    注意：`templates` 的名称必须是复数，不能是单数。这非常重要，因为我们将使用的 Web 框架 Flask 如果发现文件没有按所示命名，将会报错。


    # CSS 文件


    在 `static` 文件夹内部创建一个名为 `styles` 的子文件夹。在 `styles` 文件夹内部创建一个名为 `style.css` 的新文件。


    # HTML 文件


    我们将为应用程序使用三个 HTML 文件：


    *   `index.html`

    *   `weather.html`

    *   `badweather.html`


    这些文件需要存放在 `templates` 文件夹内。

    '
