    # Section 1: Identifying and Understanding Common Python Errors


    This is not an exhaustive list, but these are some of the most common Python coding
    errors.


    # Syntax Errors.


    Syntax errors are a common problem for beginning programmers. You''ll find as
    you become more proficient in writing code, you''ll have fewer syntax errors.
    Here is a very common example:


    ![](image_rsrc3K5.jpg)


    So, what''s the problem? In Line 1 an assignment operator is being used in place
    of a comparison operator. Line 1 is attempting to assign the value of 10 to "x".
    You cannot do that in an "if" statement. What''s needed here is a double-equals
    (==) to essentially ask the question: "Is the current value of x equal to 10?"
    Here''s what the code should look like:


    ![A white background with black and red letters Description automatically generated](image_rsrc3K6.jpg)


    # Indentation Errors


    If you''ve been writing the code in this book as you''ve been reading, you should
    be a pro at this. Because Python emphasizes readability, it enforces strict rules
    on things like indentation. Here''s an example of an indentation error:


    ![](image_rsrc3K7.jpg)


    Python will see this as an incomplete "for" loop because the print statement underneath
    it is not indented. This is the correction:


    ![A close up of text Description automatically generated](image_rsrc3K8.jpg)


    Let''s modify this to show another indentation problem:


    ![](image_rsrc3K9.jpg)


    At first glance, this appears to be correct. Both statements are indented correctly
    when viewed by themselves. However, the "if" statement will throw an indentation
    error because it is not indented below the "for" loop. The correct syntax should
    be:


    ![A white background with colorful text Description automatically generated](image_rsrc3KA.jpg)


    # Naming Errors


    Naming errors occur when you try to use a function that has not been declared.
    Here is a simple example:


    ![A black text with blue letters Description automatically generated](image_rsrc3KB.jpg)


    If you were to try to run this code, it would throw an error because the function
    "my\_func" has not been defined yet.


    # Type Errors


    Type errors occur when you try mixing types. For example, you try to add the string
    representation of a number to an actual number.


    ![A close up of a math equation Description automatically generated](image_rsrc3KC.jpg)


    This will throw a type error because the code is trying to add (or concatenate)
    the number 5 to the string "3". There are two possible solutions to this depending
    on what outcome you want.


    This will add and give you the number 8:


    ![A close up of a number Description automatically generated](image_rsrc3KD.jpg)


    This will concatenate and give you the string "53":


    ![A black and blue text Description automatically generated](image_rsrc3KE.jpg)


    # Index Errors


    Index errors occur when you try to access an index in something like a list and
    you request an index that is out of bounds, meaning you are trying to access an
    index that does not exist. Consider this example:


    ![A white background with black text Description automatically generated](image_rsrc3KF.jpg)


    This is because indexes always start with zero and index 4 is out of range. To
    get back the number 4 from "my\_list" I would need index 3:


    ![A close-up of a number Description automatically generated](image_rsrc3KG.jpg)


    To see the length of a list, you can use the "len" function as shown in line 2
    and remember that the last available index would be one less than the length of
    your list.


    # Key Errors


    Key errors are like index errors. Where index errors occur when you try to access
    a non-existent index, key errors occur when you try to access a non-existent key
    in something like a dictionary. Here''s an example:


    ![](image_rsrc3KH.jpg)


    The correct version of this code would look like this:


    ![A close up of a text Description automatically generated](image_rsrc3KJ.jpg)


    # Attribute Errors


    Attribute errors happen when you try to access an object attribute in the wrong
    way, or you try to access an attribute that does not exist in the object. Going
    back to our list example, let''s say you wanted to add the number 5 to it.


    ![A close up of a math equation Description automatically generated](image_rsrc3KK.jpg)


    This will not work because you cannot use "add" to add another item to a list.
    Instead, you need to use the "append" attribute.


    ![A close up of a math equation Description automatically generated](image_rsrc3KM.jpg)


    As you become more proficient in your use and understanding of Python, you''ll
    likely commit fewer and fewer of these kinds of errors. Now that you understand
    what they are and how to fix them, you can become more confident in your Python
    programming skills.


    # Section 2: Systematic Troubleshooting Strategies


    # Isolate the Problem


    Look at the symptoms. Part of troubleshooting is a bit like a doctor interviewing
    a patient. Start by understanding the problem symptoms such as:


    *   Error messages


    *   Unexpected behavior


    *   Incorrect output


    Narrow the problem down. See if you can identify the problem to a specific part
    of your code.


    *   Troubleshooting 101: Find out when the problem started happening. Has it been
    an issue from day one, or did it start after a change in the code or a change
    in how the code was being applied? Knowing the history of a problem can go a long
    way toward pinning it down.


    *   What are the error messages telling you? Sometimes they can pinpoint the location
    of the problem.


    *   Break your code into smaller pieces and test them individually. For instance,
    if you have identified a particular function (or functions) to be part of the
    issue, try to put them into a separate piece of code, feed it the parameters it
    needs and see how it responds.


    # Reproduce the Issue


    Like the above, create a simplified version of your code, removing as many unrelated
    parts as possible. What you want is a minimized, functioning version of your program
    that focuses on the problem pieces. With that, you want to reproduce the problem
    so you can identify the root cause.


    # Do a Code Walk-through and Check Inputs and Outputs


    Visually and verbally go through your code and pay attention to the inputs and
    outputs. When I say, "verbally," I literally mean talk your way through your code
    and explain what it''s doing. For this step, it helps to have someone there to
    whom you are explaining your code because doing that forces you to step outside
    of your work and look at it objectively. You will be surprised how often using
    that technique helps you see things you missed.


    # Use Version Control


    If you''re using a version control system like Git, revert to a previous version
    of the code before the issue started. Create a separate branch and slowly reintroduce
    changes until you see the problem re-emerge. This will also help you to isolate
    the issue and correct it.


    # Use Print Statements to Trace Program Flow


    I suppose you can call the use of print statements "the poor man''s debugger,"
    but it is a quick and effective way to spot problems in your code. The process
    is simple:


    # Use Strategically Placed Print Statements


    *   Print variables, and intermediate results at key points in your code.


    *   Use the type() function to print the classes of variables and results where
    needed.


    *   Include clear descriptions to identify where in the code you are so you can
    find fail points more easily.


    # Use Conditional Printing'
