- raw: 'On the next screen, you will see your selected repo. Click the "Connect" button
    to continue.


    ![A white rectangular object with black text Description automatically generated](image_rsrc3N6.jpg)


    The next page presents you with several options. Fill these out as shown below:


    # Deployment Page


    Name: You can have this match the name of your repo, or name it something else.


    Region: You can leave this at its default or choose a region that is closer to
    you.


    Branch: If your branch lives on the main branch (which is how the example is set
    up), you can leave this at "main." If you have your repo on a different branch,
    change it to that branch.


    Root Directory: Leave as is.


    Runtime: Python 3


    Build Command: Change this to


    pip install -U pip && pip install -r requirements.txt


    This is to allow for pip to be upgraded if needed. The command after the "&&"
    updates the requirements.txt to include all the packages associated with your
    application.


    Start Command: python3 server.py


    This is how you would run this if you were running the app from inside the terminal.


    Instance Type: Scroll down to see this section. I recommend that you use the free
    option.


    Environment Variables: For us, this section is necessary because this is where
    we will include our API key. For "NAME\_OF\_VARIABLE" enter "API\_KEY" (without
    the quotes). For "value" enter your API key (from the .env file).


    You now need to click "Add Environment Variable" to add the version of Python
    you''re using. For "NAME\_OF\_VARIABLE" enter "PYTHON\_VERSION" (without the quotes).
    For "value" enter your Python version. To figure that out, go into your IDE and
    run this command in the terminal window:


    py --version


    Take only the version number shown and enter that as your value.


    Once all this is in place, scroll to the bottom of the page and press "Create
    Web Service." The deployment will take a few minutes to complete. When the last
    line on the screen says, "Your service is live," you can open your site. The URL
    will be listed toward the top of the screen. You can click that and go straight
    to your new site.


    Your web application is now on the web! Congratulations!


    # Chapter 7 Recap!


    This has been a long and detailed chapter! If you put all the code in yourself,
    rather than just copying and pasting it in, good on you!


    In this chapter, you learned a little about web frameworks. Granted, it was not
    in-depth, but you did get some exposure. If want to learn more about Flask or
    other web frameworks, there are plenty of resources available, especially on YouTube.
    Of all the ways to deploy your code, converting your code into a web app is probably
    the most popular and the most user-friendly.


    In addition to using a web framework, you also learned some basic git commands.
    If you''re going to be doing a lot of programming, learning how to use git is
    a worthy investment of your time. Whether you choose to use the GUI version of
    the command line version of git is up to you, but knowing how to use the command
    line version is probably the better choice in my opinion. Also, if you''re interviewing
    for a programming job, saying that you are familiar with how to use git, is a
    point in your favor even if the place where you''re interviewing uses some other
    kind of version control platform. It shows that you are familiar with the concept.


    In Chapter 8 we''ll dive into Python and data analysis where we''ll cover using
    Pandas, data visualization, and how to put data analysis to practical use.


    Chapter 8: Data Analysis and Visualization


    Data analysis is a crucial part of programming, whether you''re working for a
    large corporation and analyzing sales trends to determine future production forecasts,
    running your own business, and looking at customer trends to see what sells best,
    or engaged in scientific analysis working on the next great breakthrough. But
    raw data is of no value if you don''t have a way to analyze it in a meaningful
    way. Because of its many powerful libraries, and its simplicity, Python is a popular
    choice for data analysis tasks.


    As always, while I encourage you to write this code as you go along, you can find
    the completed Chapter 8 code using the link at the end of the [Answer Key](#part0018.xhtml#a3D2)
    section.


    # Section 1: Pandas and Numpy


    Python has several libraries for data manipulation and analysis. Two of the most
    well-known are "Pandas" (Python Data Analysis) and "Numpy" (Numerical Python). 


    # Installing Pandas and NumPy


    Before we dive in, go ahead, and create a new folder called "DataAnalysis." Open
    that folder in VSCode (or the IDE of your choice) and then open a terminal window
    (CTRL + \`). In the terminal window run this command to see if you already have
    Pandas and NumPy installed:


    pip list


    Scroll through the results and check if Pandas and NumPy are listed. If not, run
    this command in the terminal to install them:


    pip install pandas


    Under normal circumstances, when you install Pandas, NumPy installs along with
    it. To be sure, run the "pip list" command to be sure NumPy is also installed.
    If not, run "pip install numpy" to install it.


    Now open a new file in your folder called "panda\_data.py". In that file enter
    this code to import pandas into your module:


    import pandas as pd


    The "as pd" piece is just an alias you''re assigning to the import for ease of
    reference. For Pandas, the common practice is to use "pd" as the alias. You might
    be wondering why we''re not specifically importing NumPy. This is because Pandas
    is built on top of NumPy so when you use objects such as DataFrames, any underlying
    NumPy operations to support them will be handled seamlessly in the background.


    To store our data sample, create a subfolder called "DataFiles."


    # Manipulating Data with Panda


    # Loading the Data


    For this next part, we need some sample data. There is a .csv file for chapter
    8 called "BookData.csv." You can download it using the link at the end of the
    [Answer Key](#part0018.xhtml#a3D2) section.


    Be sure to save it in your "DataFiles" subfolder. You can also use a .csv file
    of your own if you''d like. Now we need to read the .csv file. So, add this to
    your code:


    data = pandas.read\_csv(''BookData.csv'')


    In your IDE, your code should look something like this:


    ![A close up of a text Description automatically generated](image_rsrc3N7.jpg)


    If, for some reason, you want to skip the first row in your data file, you can
    modify the above like this:


    data = pd.read\_csv(''YourFile.csv'', skiprows = 1)


    If you need to skip more than one consecutive row, you can increase the skiprows
    number. If you have nonconsecutive rows to skip, you can use line indices to tell
    the reader what rows to ignore:


    data = pd.read\_csv(''YourFile.csv'', skiprows =\[0,2\])


    This would tell the reader to skip rows 1 and 3. Remember, indexes always start
    with zero (0), so rows 1 and 3 would equate to 0 and 2.


    The Pandas reader is also not limited to reading CSV files. It can read other
    formats as well, including Excel. Consider this example:


    ![A computer code with black text Description automatically generated](image_rsrc3N8.jpg)


    Here, the reader is looking at an Excel file and it is being instructed to read
    the first sheet, skip the first 2 rows, and only look at columns 1 and 2.''


    # Exploring the Data


    To see what data we have, we''ll use a simple print statement:


    print(data.head())


    This will print the first few rows of data. If you want a specific number of rows,
    you can modify it like this:


    print(data.head(10))


    To get a summary of statistics in our data, add this line:


    print(data.describe())


    Your code should look like this:


    ![A screenshot of a computer code Description automatically generated](image_rsrc3N9.jpg)


    Save and run this to see the results. You''ll probably think, "This is not easy
    to read." Just hang on! We''ll cover data visualization in the next section.


    # Getting a Better View of CSV Files'
