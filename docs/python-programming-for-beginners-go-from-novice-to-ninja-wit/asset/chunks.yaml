    branch, change it to that branch.


    **Root Directory**: Leave as is.


    **Runtime**: Python 3


    **Build Command**: Change this to


    ```

    pip install -U pip && pip install -r requirements.txt

    ```


    This is to allow for `pip` to be upgraded if needed. The command after the `&&`
    updates the `requirements.txt` to include all the packages associated with your
    application.


    **Start Command**: `python3 server.py`


    This is how you would run this if you were running the app from inside the terminal.


    **Instance Type**: Scroll down to see this section. I recommend that you use the
    free option.


    **Environment Variables**: For us, this section is necessary because this is where
    we will include our API key. For `NAME_OF_VARIABLE` enter `API_KEY` (without the
    quotes). For `value` enter your API key (from the `.env` file).


    You now need to click "Add Environment Variable" to add the version of Python
    you''re using. For `NAME_OF_VARIABLE` enter `PYTHON_VERSION` (without the quotes).
    For `value` enter your Python version. To figure that out, go into your IDE and
    run this command in the terminal window:


    ```bash

    py --version

    ```


    Take only the version number shown and enter that as your value.


    Once all this is in place, scroll to the bottom of the page and press "Create
