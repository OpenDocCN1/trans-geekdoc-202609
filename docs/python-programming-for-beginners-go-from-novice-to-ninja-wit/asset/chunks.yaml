- raw: "Deploying your code as a web-based app makes it platform-independent. Your\
    \ code is run on a back-end server that does all the heavy lifting and simply\
    \ shares the results in a protocol understood by all browsers. Since nearly every\
    \ computer/device has a browser and an Internet connection, web-enabling your\
    \ application means anyone with a browser can use your app with hardly any setup\
    \ on their part.\n\n# Cons\n\nUsers must have an Internet connection and a browser.\
    \ If a user is using an unsupported browser, they will have to use a more mainstream\
    \ one to use your application.\n\n# Section 2: Let's Build a Web-Based Weather\
    \ App!\n\nWhile I encourage you to write the code for this application as you\
    \ go, you can also download the completed files and put them in their designated\
    \ locations as per the instructions given here. You can also download and just\
    \ use them as a point of reference. The link is given at the end of the [Answer\
    \ Key](#part0018.xhtml#a3D2) section.\n\n# Step One: Create a Folder for your\
    \ App\n\nThis will become your program's package. On my machine, I created a folder\
    \ called: \"WebWeather.\" You can make yours whatever you want.\n\nIn VSCode,\
    \ open the folder you just created. You need to make sure you are in this folder\
    \ for the remaining steps. If you are in some other development tool, make sure\
    \ you are working from within the folder you have created.\n\n# Step Two: Create\
    \ a Virtual Environment\n\nMake sure you are in the folder you created in step\
    \ one. Creating a virtual environment for you to work in allows you to develop\
    \ your application and test it as though it were on the web.\n\n# Open a terminal\
    \ window:\n\nOpen a terminal window by typing \"CTRL + \\`\" (without the quotes).\
    \ The little symbol you see in the command is located just below the ESC key on\
    \ most keyboards.  Pay attention to the folder path you see when the terminal\
    \ opens. Make sure it is in the folder you created in step one.\n\n# Create the\
    \ environment:\n\nMake sure you have a terminal window open in your folder from\
    \ step one. Use one of the commands shown below based on your OS:\n\nWindows:\
    \ py -m venv .venv\n\nUnix/macOS: python3 -m vevn .venv\n\nWhen you run the command,\
    \ you'll see a .venv folder inside the folder you created for this exercise.\n\
    \n# Activate the environment:\n\nFrom your terminal window, run the command below\
    \ based on your OS:  \n\n\\[Note there is a dot(.) before the venv in both the\
    \ commands listed below.\\]\n\nWindows: .venv\\\\Scripts\\\\activate\n\nUnix/macOS:\
    \ source .venv/bin/activate\n\nWhen the environment is activated, you should see\
    \ (.venv) in front of the prompts in your terminal window.\n\n# If you need to\
    \ deactivate your virtual environment:\n\nJust type \"deactivate\" in the terminal\
    \ window (without the quotes). When you do, you should see the (.venv) disappear\
    \ from the prompts in your terminal window. To reactivate it, just follow the\
    \ activation steps shown above. You will not need to reinstall the virtual environment.\n\
    \n# Step Three: Install Packages and Support Files/Folders\n\nThree packages must\
    \ be installed for our app to work. In the past, we have installed one package\
    \ at a time. With the command below, we are going to install three packages at\
    \ once:\n\n*   requests\n\n*   python-dotenv\n\n*   Flask\n\nOpen a terminal window\
    \ if you have not already (CTRL + \\`), make sure you are in the folder you created\
    \ in step one, activate your virtual environment if you have not done so already,\
    \ then run this command:\n\npip install requests python-dotenv Flask\n\nNote that\
    \ there are spaces between each of the package names. When you run the command,\
    \ you may see a prompt that recommends an upgrade for pip. It will look something\
    \ like this:\n\n![](image_rsrc3KX.jpg)\n\nYou can run the upgrade using the command\
    \ shown in the prompt, or just use this:\n\npy -m pip install -U pip\n\nThat's\
    \ how all the cool kids run the upgrade. Note that the \"U\" in that command is\
    \ UPPERCASE. It's shorthand for \"upgrade.\" When the installation completes,\
    \ it will show the new version number above the command prompt.\n\n# Requirements\
    \ file\n\nSince our goal is to deploy this application, we need a requirements\
    \ file. To do this, run this command in your terminal window:\n\npip freeze >\
    \ requirements.txt\n\nThe \"freeze\" is a subcommand in pip that lists all the\
    \ packages installed in an application. The \">\" (greater than) symbol is a redirect\
    \ that instructs \"freeze\" to list all the packages in a text file. In our case,\
    \ that is the \"requirements.txt\" file. When the command completes, you should\
    \ see a \"requirements.txt\" file in your application folder. You can run this\
    \ command again to update it if you install more packages.\n\n# Why is this important?\n\
    \nWhen you decide to deploy this into the world, the requirements.txt file will\
    \ let your hosting service know what packages to install to make your application\
    \ work. You won't have to do that yourself. It will happen in the background for\
    \ you.\n\n# The .gitignore file\n\nIn this chapter, as part of our deployment\
    \ process, we'll be sending our code into a GitHub repository (\"repo\"). When\
    \ planning to do something like that, certain files do not need to be shared publicly.\
    \ A .gitignore file is what you use to prevent certain files from being sent to\
    \ GitHub. So, in VSCcode (or IDE of your choice), create a file called \".gitignore\"\
    \ (without the quotes). Also note that the file name is preceded with a dot (.).\
    \ When you create the file in VSCode, you'll notice in the file explorer that\
    \ it gets a special icon next to it. Inside this file, you want to add these two\
    \ entries:\n\n.venv\n\n.env\n\nThe first one is the folder for our virtual environment.\
    \ The second one is a file for holding environment variables. In our case, that's\
    \ the API key for our weather application. Because both are in our .gitignore\
    \ file, none of their content will be loaded into the online repository.\n\n#\
    \ The .env file\n\nIn your application folder, create a file called \".env\" (without\
    \ the quotes), noting that this file's name also has a dot (.) at the beginning\
    \ of it. As mentioned above, we will use this to hold our API key.\n\n# Adding\
    \ OpenWeatherMap.org API Key\n\nIf you've been following along and building the\
    \ weather app from the previous chapters, you already have an API key. If you\
    \ don't have one, you can go to [openweathermap.org](https://openweathermap.org/)\
    \ and sign up for one – it's free. To add your API key to your .env file, just\
    \ open it and add this line:\n\nAPI\\_KEY= \\[YOUR\\_API\\_KEY\\]\n\nReplace the\
    \ brackets and everything inside them with your API key without quotes around\
    \ it.\n\n# Support Folders\n\nIn your application folder create these two subfolders:\n\
    \n*   static\n\n*   templates\n\nNote: The name \"templates\" must be plural,\
    \ not singular. This is important because Flask, the web framework we'll be using,\
    \ will throw an error if this file is not named as shown above.\n\nInside the\
    \ static folder create a subfolder called \"styles\".\n\n# CSS File\n\nInside\
    \ the styles folder create a new file called \"style.css\". Discussion of CSS\
    \ files, what they do, and how they work is outside the scope of this book, but\
    \ there are plenty of resources online to answer those questions if you're curious.\
    \ For now, just know that CSS files help with the \"look and feel\" of the pages\
    \ for your web application. The code for our CSS file is below:\n\n![A computer\
    \ code with text Description automatically generated with medium confidence](image_rsrc3KY.jpg)![A\
    \ screenshot of a computer code Description automatically generated](image_rsrc3KZ.jpg)![A\
    \ close-up of a computer code Description automatically generated](image_rsrc3M0.jpg)\n\
    \n# HTML Files\n\nThere are three HTML files that we will use for our application:\n\
    \n*   index.html\n\n*   weather.html\n\n*   badweather.html\n\nAs with the CSS\
    \ file, the discussion of what HTML pages do, etc. is outside the scope of this\
    \ book. These files need to live inside the templates folder. The code for each\
    \ is below:\n\n# Index.html\n\n![A screenshot of a computer code Description automatically\
    \ generated](image_rsrc3M1.jpg)"
