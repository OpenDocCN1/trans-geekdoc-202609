    1 个参数，但 Python 仍然认为它收到了 3 个，因为另外两个已经被设置为了“0”。


    如果你运行这段代码，将会得到一个错误：


    ![A white background with black and green text Description automatically generated](img/image_rsrc3J7.jpg)


    代码会在第一次函数调用 `print(add(1,2,3))` 时抛出错误并提示：


    ```

    TypeError: add() takes 2 positional arguments but 3 were given

    ```


    为什么会这样说？首先，因为 Python 是从上往下读取代码的。其次，即使参数不同，Python 也无法接受重复函数名。它会看到第一个方法，但当它遇到同名的第二个方法时，会将其视为对第一个方法的替换。因此产生了错误。


    本小节向你介绍了创建能够适应各种输入的多功能 Python 函数的概念。我们强调了默认值和任意参数列表的使用，以便你编写代码来处理不同的场景。我们还简要讨论了多态性，以及在
    Python 不支持它的情况下如何让 Python 模拟该功能。现在让我们来看一个真实的示例，这样你就可以看到这些概念如何在实际中应用。


    # 案例研究：具有实际用途的真实函数


    ## 我们的场景：


    我们想创建一个图书馆目录。它将存储收藏中书籍的信息，包括标题、作者等。这些信息将存储在一个列表中。用户可以根据不同的标准搜索此列表。对于这个示例，我们将关注排序功能。


    ## 选项：


    你可以边看代码边学习，或者你也可以创建一个自己的 Python 文件并在阅读时编写代码，以便更熟悉 Python 编程的语法和背后的思维方式。


    ## 问题：


    我们的函数需要能够接受书籍列表并响应用户的排序标准。为了实现这一点，我们需要有一个内置的允许搜索的选项列表，并在用户选择了不允许的选项时能够对用户错误做出响应。


    ## 展望


    在这个真实示例中，我们将使用两个我们尚未涵盖的概念：`lambda` 函数和 `raise Exception` 语法。


    ## 定义函数


    这是我们将用于图书馆目录的函数：


    ![Catalog demo code](img/image_rsrc3J8.jpg)


    让我们逐行分析一下：


    第 2 行：这是函数定义。它接受两个参数：一个名为 `book_list` 的列表和一个名为 `sort_option` 的字符串。


    第 4 行：这声明了列表 `valid_criteria`。


    第 5 行：它获取用户的 `sort_option` 并将其与 `valid_criteria` 列表进行检查。它使用 `not in` 语句来判断用户是否输入了无效的搜索选项。


    第 6 行：这一行使用了 `raise Exception` 语法。在这种情况下，如果用户输入了无效的搜索选项，它将抛出 `ValueError` 异常并向用户显示自定义消息：“Invalid
    sorting criterion。”关于 Python 内置异常列表，你可以访问此网站：


    [`docs.python.org/3/library/exceptions.html`](https://docs.python.org/3/library/exceptions.html)


    第 10 行：如果用户的排序选项是被允许的，那么列表将根据用户的选择进行排序。为了执行此排序，函数使用了 Python 内置的 `sorted` 函数。要查看
    Python 内置函数的完整列表及其语法，你可以访问此网站：


    [`docs.python.org/3/library/functions.html`](https://docs.python.org/3/library/functions.html)


    `sorted` 函数有一个必填参数和两个可选参数。


    -  `iterable`（可迭代对象）意味着它接受一个可迭代项，如列表或字典。该参数是必填的。

    - `key` 是可选的，默认值为 "none"。如果包含它，它必须指向正在排序的键值对中的某个键。

    - `reverse` 选项默认值为 "False"。如果设置为 true，则会反转排序顺序。


    在我们的真实示例中，对 `sorted` 函数的调用使用了 `key` 并填充了一个 `lambda`。`lambda` 函数也称为匿名函数。当一个函数需要一个函数作为参数时，可以将其看作一个占位函数。`sorted`
    函数中的 `key` 选项需要一个函数作为参数，而 `lambda` 正符合。


    `lambda` 的语法如下：


    ```

    lambda arguments: expression

    ```


    在我们的示例中，我们使用的 `key` 选项如下：


    ```

    key=lambda book:sort_option

    ```


    翻译成白话，我们是在告诉 key：“Lambda 是你的函数。该函数接受的参数是 book。你要使用的 sort_option 是用户恰好选择的那。”所以，如果用户恰好选择了“author”作为他们的排序键，`book_list`
    中的所有书籍将按作者排序。如果你觉得在这个解释期间你的大脑放假了，请担心。你越频繁使用 `sorted` 函数和 `lambdas`，它们就越容易理解。这种知识需要时间来积累。


    第 12 行：在函数完成排序后，它会返回排序后的列表。


    # 填充库


    现在函数已经就绪，我们需要填充库。库是一个字典对象的列表。字典是具有键值对的列表，字典中的每个值由一个键来标识。这是我们的库：


    ![A close-up of a text Description automatically generated](img/image_rsrc3J9.jpg)


    # 调用函数


    这里是一些函数调用。最后一个是不正确的：


    ![A white background with black text Description automatically generated](img/image_rsrc3JA.jpg)


    如果我们现在运行，`print` 将不会运行，因为最后一个函数调用想要按一个不允许的选项进行排序。因此，代码将抛出我们之前提到的错误：


    ```

    ValueError("Invalid sorting criterion")

    ```


    移除它后，按标题显示书籍的 `print` 请求将运行：


    ![](img/image_rsrc3JB.jpg)


    '
