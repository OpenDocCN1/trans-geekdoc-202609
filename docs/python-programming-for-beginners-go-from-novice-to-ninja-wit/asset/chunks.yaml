    Go ahead save the code and run it to see the results.


    # Pie Chart Example:


    For this, we only need to change a few lines. So, to save time, make a copy of
    your bar chart example and rename it "pie\_chart.py."


    The only change is in the plotting section:


    ![A close-up of a computer screen Description automatically generated](image_rsrc3NP.jpg)


    Line 15: The "sales\_by\_format" piece is a Panda Series object. The ".index"
    represents the formats found in the data set. These become the labels used in
    the chart.


    Line 16: The "autopct" piece displays the percentages that each wedge of the pie
    represents. If it is set to None, then no percentages display. Putting a numeric
    format on it shows the percentages. The format used in our example limits the
    number of decimal places to one.


    The "startangle" attribute determines where the first wedge of the pie is placed.
    You can experiment with this to see how it changes the layout of the pie.


    Line 20: The ".axis" attribute determines the scale of the axes in the chart.
    For our example, setting the axis will have little impact, but for pie charts
    in general, it''s best to set this to "equal" so that the pie remains circular.


    # Two sides to the same story:


    You''ll notice that each chart represents the results with a different emphasis.
    The bar chart does a comparison focused on sales in dollars. The pie chart displays
    the same data in terms of percentages. Both are important aspects of your data''s
    story.


