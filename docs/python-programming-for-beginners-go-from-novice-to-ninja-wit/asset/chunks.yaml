    particular about its syntax. When something is not formatted correctly, it will
    throw an error.


    **Iteration**: "Iteration, in the context of computer programming, is a process
    wherein a set of instructions are repeated a specified number of times or until
    a condition is met. When a set of instructions is executed again, it is called
    iteration." (Rouse, 2011)


    **Machine Learning**: “Machine learning is a branch of artificial intelligence
    (AI) and computer science which focuses on the use of data and algorithms to imitate
    the way humans learn, gradually improving its accuracy.” (What Is Machine Learning?
    | IBM, n.d.)


    **Module**: a file that contains `Python` code that can be used by other programs.
    For example, if your code is designed to print something, rather than writing
    your code to print a file, you can use a module.


    **Numpy**: a scientific computing and numerical operations library for `Python`.


    **Parameter**: a variable that is used by a function as an input to complete a
    task. For example, the `print()` function takes a `String` parameter to output
    the string it was given.


    **PEP 8**: a style guide for writing `Python` code that is clear and readable.
    The guide is not written in stone. If your syntax is acceptable to `Python`, it
    will work, but code written in the style as laid out by `PEP8` is best practice.


    **Pipenv**: a `Python` package manager that manages dependencies and simplifies
    the use of libraries and dependencies for `Python` projects.


    **Procedural Programming**: "Procedural programming is a programming paradigm
    built around the idea that programs are sequences of instructions to be executed.
    They focus heavily on splitting up programs into named sets of instructions called
    procedures, analogous to functions. A procedure can store local data that is not
    accessible from outside the procedure''s scope and can also access and modify
    global data variables." (DeepSource | the Modern Static Analysis Platform, n.d.)


    **ocode**: “Pseudocode is a detailed yet readable description of what a computer
    program or algorithm should do. It is written in a formal yet readable style that
    uses a natural syntax and formatting so it can be easily understood by programmers
    and others involved in the development process.” (Sheldon, 2023)


    **Pythonic**: adherence to `Python`''s coding style and best practices. Writing
    code in a way that follows `Python` conventions and guidelines.


    **Scientific Computing**: “Computational science, also known as scientific computing,
    technical computing or scientific computation (SC), is a division of science that
    uses advanced computing capabilities to understand and solve complex physical
    problems.” (Wikipedia contributors, 2023)

