    - **Tuples**: These are like lists except they are immutable, meaning you cannot
    add/remove members once the tuple has been declared. They are used for fixed collections
    of data. For example, you might have a string tuple that contains the names of
    the planets in our solar system. That is unchangeable – unless the scientific
    community demotes yet another planet from the list. (Pluto forever, my brothers
    and sisters!) Tuples are enclosed in parentheses. Example: `(1,2,3)`


    - **Dictionaries (dict)**: These are unordered collections of key-value pairs.
    Each value in the dictionary is connected to a unique key. You would use the key
    to retrieve the value from the dictionary. Dictionaries are defined with curly
    braces and colons like this: `{"object" : "ball", "color" : "blue", "material"
    : "plastic"}` So if I were using this dictionary, and I wanted to know what kind
    of object is in it, I could retrieve the object key and find out it is a ball.


    - **Sets**: Sets are also unordered collections of unique elements. They are also
    declared using curly braces, but they contain no keys. Example: `{1, 2, 3}`


    - **NoneType (None)**: First, note that the abbreviated form of this type is capitalized.
    It is "None," not "none." `None` is used to represent the absence of a value.
    In Python, it is used to indicate a missing or undefined value.


    - **Complex Numbers (complex)**: These consist of a real part and an imaginary
    part. For example, in `2 + 3j`, `2` is the real part and `3` is the imaginary
    part.


    With these essential data types, Python can handle a wide range of data from the
    simple to the complex.


    # Integers


    As we mentioned above, integers are whole numbers, meaning they are numbers with
    no decimals. Integers can be negative or positive. So, numbers like `12`, `-7`,
    `0`, and `115` are all integers. Integers are used often in calculations and as
    indexes in things like lists.


    # Floats


    Floats are numbers that have decimals. These are also referred to as "floating
    point" numbers. It''s like calling snap beans haricot vert. Same thing, just a
    different name. Floats can be positive or negative. So, numbers like `3.14`, `-2.6`,
    and `0.1` are all floats. Floats are typically used when greater precision is
    needed.


    # Strings (str)


    Strings and string manipulation are an integral part of the Python programming
    language. We use strings to communicate with our users to explain results or provide
    feedback. As mentioned earlier, strings are surrounded by single (''''), double
    ("""), or triple quotes (`''''''` or `"""`). If you try to declare a string and
    forget to enclose it in quotes, Python will throw an error message at run time.
    If you''re using a code editor like `VSCode`, your editor will flag it as a syntax
    error.


