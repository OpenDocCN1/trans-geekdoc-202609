- raw: "Goal #1 – A strong foundation. A strong foundation in Python programming is\
    \ fundamental to helping you build confidence in your programming abilities. My\
    \ goal is to give you something you can continue to build on beyond the pages\
    \ of this book. As part of that strong foundation, we will work to help you master\
    \ fundamental concepts and syntax.\n\nIf you've ever learned a foreign language,\
    \ you know that you often start by learning the alphabet, and then you progress\
    \ to a few vocabulary words. From there you move on to sentence structure so that\
    \ you can convey ideas. Learning a programming language is a little like that,\
    \ but our goal will be to make you fluent in Python. So that you can be confident\
    \ in it. Along the way, you'll also learn building blocks that are common to most\
    \ programming languages so that you can feel confident in extending your programming\
    \ knowledge into other coding languages.\n\nGoal #2 – Learning through practical\
    \ application. The only way to learn any programming language is to just start\
    \ using it. This book is built around programming projects that address practical\
    \ scenarios, and solving common problems to help you apply the Python concepts\
    \ you are learning. So, by the time you're done, you'll have some practical programming\
    \ experience under your belt.\n\nGoal #3 – Skill building. This is related to\
    \ the previous goal but goes beyond just knowing how to apply it and why. Again,\
    \ this is so that you can continue to explore Python (and other programming languages)\
    \ independently.\n\nBonus: There are two coding projects that we will build throughout\
    \ this book: A GUI-based weather app and a web-based weather app that We'll deploy\
    \ online. So, not only will you learn Python, but you'll also have a couple of\
    \ apps to show for it!\n\n# Here's what you'll learn:\n\n# Chapter One: Python\
    \ Essentials\n\n*   You'll learn why Python is a great language for beginners\
    \ as well as a great choice for helping to enhance your career and skill set.\n\
    \n*   You'll be shown how to set up Python on your machine whether your OS is\
    \ Windows, Linux, or macOS.\n\n*   You'll write your first Python script.\n\n\
    *   You'll also start on your first standalone app: A GUI-based weather application.\n\
    \n# Chapter Two: Diving Deeper into Python.\n\n*   We'll dive deeper into operators\
    \ and expressions.\n\n*   You'll see what they are, how to use them, and why.\n\
    \n*   We'll explore loops and iteration, concepts that are fundamental to a strong\
    \ foundation in programming.\n\n*   You'll take what you've learned here to continue\
    \ working on the weather app.\n\n# Chapter Three: Building Functions.\n\n*   You'll\
    \ learn how to define functions according to proper Python standards.\n\n*   We'll\
    \ explain parameters and arguments, and how to use them.\n\n*   You'll also learn\
