  trans: '

    我们还学习了什么？我们学习了数据类型和类型转换，如何编写和调用函数以及方法。我们还学会了通过编写代码来学习代码！这是学习任何编程语言的最佳方式。在旅程中，我们最终学会了用三种不同的方法编写了一个天气应用：作为一个独立的
    GUI 应用程序、命令行应用程序，最后是一个我们部署到网络上的 Web 应用程序！对于初学者来说这已经不错了！


    我们还学习了如何将代码部署到名为 `GitHub` 的在线仓库，如果你计划从事程序员的职业，这是一项必须掌握的良好技能。


    除了编写几个脚本之外，我们还涵盖了面向对象编程的基础知识，这是一种依赖于`classes`（类）和`objects`（对象）概念的编程范式。在部分讨论中，我们探讨了派生类与其父类之间存在“是一个”（is
    a）的关系，而复合类之间存在“有一个”（has a）的关系。（汽车是一种车辆，它有一个发动机。）


    我们回顾了常见的编程错误、如何诊断和处理这些错误，以及如何执行系统性的故障排除策略。


    ## 第 7 章专门用于创建 Web 版天气应用的任务。在那里，我们编写了该应用的命令行版本，并用它来构建了我们的 Web 版本。


    之后，我们查看了数据分析和可视化，并看到通过将数字转换为视觉表示，我们可以更好地传达数据背后的故事。


    然后，我们通过几个实操脚本深入研究了脚本和自动化。同样，我们只是触及了皮毛，但你已经有了良好的基础在此基础上构建。


    最后，我们涵盖了数据库基础和 `Python` 集成，我们学习了如何将 `Python` 连接到数据库，并编写了一个与之交互的程序。我们还学习了一些基础的
    `SQL` 概念和命令。


    虽然本书结束了，但不要让这成为你 `Python` 之旅的终点！挑战自己，思考如何使用 `Python` 来自动化任务、解决问题，甚至提升你的职业生涯！


    # 请给我留评价！


    如果你喜欢从这本书中中学到的内容，请花几时间留个评价。作为一个营销预算有限的独立作者，评价是我在这个平台上的生计。如果你喜欢这本书，我将非常感谢你的诚实反馈。我很乐意听到你的声音，我个人会阅读每一条评论。


    `https://www.amazon.com/dp/B0CRS9HJC7`


    # 关注我！


    你可以在 Facebook 页面 `Nontechnically Speak` 上关注并给我留言，地址：`https://www.facebook.com/ntspeak`


    你也可以在 Instagram 上关注我：`https://www.instagram.com/htack210/`


    # 词汇表


    **API**: 应用程序接口。这些在编码世界中无处不在。大多数软件程序都有一个 `API`，这是一组允许你的代码与特定应用程序交互的规则集。例如，`ChatGPT`
    有一个 `API`，允许将它的 `AI` 整合到你的网页中，对用户的问题提供类人的回答。


    **Boolean（布尔值）**: 一种真或假设置的数据类型。你会在条件语句中使用 `Booleans`。该数据类型以 19 世纪英国数学家 `George
    Boole` 命名，读音为：ˈˈbo͞olēən/。书写时应当大写，因为它是一个专有名词。


    **Decorator（装饰器）**: 一个修改其他函数或的方法。


    **Data Science（数据科学）**: “数据科学将数学和统计学、专业编程、高级分析、人工智能（AI）和机器学习与特定的领域专业知识相结合，以揭示隐藏在组织数据中可操作的见解。这些见解可以用于指导决策和战略规划。”（What
    Is Data Science? | IBM, n.d.）


    **Dunder Methods（双下方法）**: 在 `Python` 中使用运算符重载的方法（例如 `__init__`）。


    **Function（函数）**: 执行特定任务的代码模块。


    **Git**: 这是一个用于跟踪代码更改的版本控制系统。如果你正在尝试一个新功能，可以为该功能创建一个单独的代码分支，并在你满意新功能稳定后将其合并到主代码中。当你与其他开发人员协作项目时，这非常有帮助。你们每个人都可以在主代码自己的分支上工作，完成各自负责的项目部分。然后你可以审查彼此的工作，并决定哪些内容应该合并到主代码中。


    **Indentation Error（缩进错误）**: 导致错误的缩进错误。Python 对其语法要求非常严格。当某些内容格式不正确时，它会抛出错误。


    **Iteration（迭代）**: “在计算机编程的语境下，迭代是指一组指令按照指定的次数重复，或者直到满足某个条件的过程。当一组指令再次执行时，它被称为迭代。”（Rouse,
    2011）


    **Machine Learning（机器学习）**: “机器学习是人工智能（AI）和计算机科学的一个分支，侧重于使用数据和算法来模仿人类的学习方式，逐渐提高其准确性。”What
    Is Machine Learning? | IBM, n.d.）


    **Module（模块）**: 包含 `Python` 代码的文件，可以被其他程序使用。例如，如果你的代码设计用于打印内容，而不是编写代码来打印文件，你可以使用模块。


    **Numpy**: 一个用于 `Python` 的科学计算和数值操作库。


    **Parameter（参数）**: 函数作为输入完成任务的变量。例如，`print()` 函数接收一个 `String` 参数来输出它收到的字符串。


    **PEP 8**: 编写清晰易读的 `Python` 代码的风格指南。该指南并不是不可规定的。如果你的语法被 Python 接受，它就可以运行，但按照 `PEP8`
    标准编写的代码是最佳实践。


    **Pipenv**: 一个 `Python` 包管理器，用于管理依赖并简化 `Python` 项目中库和依赖的使用。


    **Procedural Programming（过程化编程）**: “过程化编程是一种基于程序是指令序列这一点的编程范式。它侧重于将程序拆分为命名的指令集，称为过程。过程可以存储从外部无法访问的本地数据，也可以访问和修改全局数据变量。”（DeepSource
    | the Modern Static Analysis Platform, n.d.）


    **Pseudocode（伪代码）**: “伪代码是对计算机程序或算法应该做什么的详细且易读的描述。它以正式但易读的风格编写，使用自然的语法和格式，以便程序员和其他参与开发的人轻松理解。”（Sheldon,
    2023）


    **Pythonic（Python 式的）**: 遵循 `Python` 编码风格和最佳实践。以符合 `Python` 标准的方式编写代码。


    **Scientific Computing（科学计算）**: “计算科学，也称为科学计算、技术计算或科学计算（SC），是一门利用高级计算能力理解和解决复杂物理问题的科学分支。”（Wikipedia
    contributors, 2023）


