    在下一节中，我们将涵盖你已经通过示例见过的内容：返回语句。返回语句是函数向调用它的代码传递反馈的机制。


    # 第 3 节：返回语句


    ## 返回语句的力量


    返回语句充当函数内部逻辑与程序其他部分之间的桥梁。回到我们的拼图类比，你有一组拼图团队成员负责“天空”碎片。由于拼图的主题是一座谷仓，你还有另一组负责“谷仓碎片”，以此类推。当每个小组都在处理拼图的特定部分时，目标是让每个小组与其他小组分享他们的工作结果。你预期负责“天空碎片”的人返回一张天空的图像，负责“谷仓”的人构建出谷仓的图像，以此类推。


    函数的返回语句就像这样。它们各自都有特定的任务，完成后，它们应该返回被分配执行的任务。我们已经见过几次了，甚至在我们最近的例子中也是。


    ## 利用返回语句的结果


    函数并不是孤立存在的。它们被用于完成复杂的任务。函数的威力在于，你可以将复杂的问题分解为更小、更易管理的任务，并利用它们返回的结果产生更复杂的结果。


    ## 示例：读取文件


    梳理文件可能不是一项复杂的任务，但它可能是非常单调且耗时的任务。如果你有数百个文件要处理，每个文件都有数千行数据，那么这项任务可能会花费很长时间。函数可以快速高效地处理这类任务，即使它包含许多文件和许多行数据。这里有一个示例：


    ![自动生成的计算机代码描述屏幕截图](img/image_rsrc3JC.jpg)


    第 1 行：你在其他一些示例中见过过 `import` 语句。`import` 关键字用于使一个模块中的代码对另一个模块可用。如需 Python 内置导入的列表，可以访问此网站：[`docs.python.org/3/py-modindex.html`](https://docs.python.org/3/py-modindex.html)


    我们的示例正在导入 Python 的 `csv` 模块。“CSV”是逗号分隔值文件。这意味着每行数据中的数据点之间用逗号（或其他分隔符，如分号 `;`）隔开。我们的读取器设计用于“读取”这些数据，以便我们的代码可以使用它们。


    第 3 行：这是我们的函数定义，它接收一个文件路径。这样做是为了让我们的代码知道去哪里找到需要处理的文件。


    第 4 行：这是创建一个名为 `file_data` 的空列表。这将文件中的数据行存储在列表中，可以对列表进行迭代以进一步分析。


    第 5 行：这一行向我们引入了 `with` 关键字。目前，请将其视为一种打开资源进行处理、并在完成后关闭资源的手段。我们告诉代码的是：“使用此对象，执行以下任务。”在我们的
    `with` 语句中，我们正在打开用户提供的文件。`open` 语句中的 `r` 以读取模式打开文件，而不是写入模式，因为我们只想读取内容，不想更改任何内容。`as
    file` 语句只是为被读取的对象分配一个变量名。


    第 6 行：这是将 Python CSV 读取器对象赋值给变量 `csv_reader`，以便处理 CSV 的内容。


    第 7-8 行：这个 `for` 循环遍历 `csv_reader`，并将每行数据放入之前创建的 `file_data` 列表中。


    第 9 行：`return` 语句将文件内容返回给程序的其他部分。


    有了返回语句的数据，你可以创建另一个名为 `find_rows` 的函数，该函数接受列表和字符串作为参数。`find_rows` 函数可以被委托查找包含特定数据字符串的行，并将其放入一个新的、更精简的文件中，只包含用户需要的数据，或者供代码中的其他函数使用。


    ## 个人示例


