    # 第一节：列表和元组


    ## 理解列表和元组


    在书的目前，你已经见过这些内容了，但让我们深入观察一下。


    在 Python 中，`lists` 和 `tuples` 是可以存储项目集合的数据对象。两者都有一个被称为“索引”（index）的东西，用于识别集合中的每个项目。这些对象中的索引从
    0 开始，这意味着如果你想获取 `list` 或 `tuple` 中的第一个项目，你需要请求索引为 0 的项目：`print(my_list[0])`。`lists`
    和 `tuples` 都保持顺序，可以排序，并且可以包含异构集合，这意味着一个列表可以同时包含字符串、整数和浮点数。


    `lists` 是可变的，意味着你可以随时更改它们。`tuples` 则不可。例如，如果你正在构建一个任务管理器应用程序，你可以使用 `list` 来存储任务，因为任务可能会随时发生变化：


