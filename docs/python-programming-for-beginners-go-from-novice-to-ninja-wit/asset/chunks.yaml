    # 为什么这很重要？


    广泛的机会。因为 Python 不局限于任何一个行业且易于适应，学习 Python 为你作为一名 Python 程序员开启了广阔的机会。凭借这套技能，你可以轻松地从一个行业过渡到另一个行业。


    跨领域解决方案。由于 Python 可以在不同行业之间轻松转换，它还可以为许多不同的行业提供解决方案。它与其他工具协作得良好，这意味着它可以与其他平台结合，具有高度的可扩展性。


    # 它是一门高级语言


    高级语言是一种计算机语言，它“抽象”了许多许多低级细节，例如内存管理。可以这样想：你不需要考虑如何保持心率在健康水平。你的大脑会自动处理这一点，这样你就可以处理更重要的事情，比如担心这个月如何交电费了。


    # 为什么这很重要？


    你可以专注于解决问题。因为 Python 允许你进行高层次的编程，你可以专注于特定任务的逻辑解决，而无需担心内存泄漏或你的代码将如何与计算机硬件通信。Python
    会为你无缝地完成这一切。


    # 它拥有庞大且活跃的社区


    提到 Python，你在开发旅途中永远不会孤单。因为它是开源的，工具、库、论坛和回答你 Python 问题的资源无处不在。


    # 为什么这很重要？


    资源丰富。无论你是去 Stack Overflow 这样的论坛，还是利用 GitHub 这样的开源库，Python 开发者社区都提供了丰富的资源供你借鉴。


    # 设置 Python


    如果你打算开始使用 Python，需要在你的机器上进行设置。Python 适用于许多平台。对于本书，我将为你提供 Windows、macOS 和 Linux
    的指令。除了不同操作系统上设置 Python 的差异外，你学的所有其他 Python 步骤都适用于任何操作系统。


    在写作时，有两个版本的 Python 可用：版本 2 和版本 3。版本 2 是旧版本，不再受到活跃支持。请使用版本 3，因为它是目前活跃支持的版本，也是我们在书中使用的版本。


    # 安装


    以防万一，最好检查你的机器上现在是否有任何版本的 Python。要这样做，请进入机器上的命令提示符。在 Windows 中，如果你在任务栏的搜索区域输入 `CMD`
    并按 `ENTER`，就会看到命令提示符。在 macOS 和 Linux 中，命令提示符被称为“终端”。


    在命令提示符中，输入：

    ```bash

    python --version

    ```


    那是 `python`，后面跟着一个空格、两个连字符，以及紧随连字符之后的 `version` 单词。现在按 `ENTER`。如果你没有安装 Python，你会看到“Python
    not found（未找到 Python）”。如果你已经安装了 Python，请记住版本。除非你有迫切的需求不升级，否则你可能需要升级你的 Python 版本。


    Windows 用户可能会注意到，如果你只是在命令提示符处输入 `python` 并按 `ENTER`


    # Windows 安装步骤


    步骤 1：在浏览器中，导航到 `python.org`。它将带你进入：


    ![Python 截图](img/image.jpg)


    步骤 2：一旦下载了软件，按照提示操作。它将带你进入：


    ![Python 截图](img/image.jpg)


    步骤 3： 在“高级选项”（Advanced Options）部分，在 `Add Python to environment variable`（将 Python
    添加到环境变量）处勾选。只有在你有充分理由的情况下才修改它。


    步骤 4：点击 `Install`（安装）。


    # macOS 安装步骤


    步骤 1：打开你的终端。


    步骤 2：如果你还没有 Homebrew，请安装它。你可以通过运行安装 Homebrew：

    ```bash

    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"

    ```


    步骤 3：通过运行安装 Python 3：

    ```bash

    brew python

    ```


    # Linux 安装（适用于 Ubuntu 和 Debian）


    步骤 1：打开你的终端。


    步骤 2：使用此命令更新软件包列表：

    ```bash

    sudo apt update

    ```


    步骤 3：通过运行安装 Python 3：

    ```bash

    sudo apt install python

    ```


    # 检查安装


    为了确保 Python 安装正确，进入命令提示符（或终端）再次运行：

    ```bash

    python --version

    ```


    你应该会看到一个显示 Python 版本的提示符。


    # 测试运行


    从命令提示符（终端）运行此命令：

    ```bash

    python

    ```


    你应该会看到另一个名为 Python 解释器的提示符出现在你的命令/终端窗口中。现在输入此内容然后按 `ENTER`：

    ```python

    print("Hello, Python!")

    ```


    它应该响应为：Hello, Python!


    要退出 Python 解释器，输入 `exit()` 或按 `CTRL+Z` 然后按 `ENTER`。


    # 开发环境 (IDEs)


    虽然你可以使用简单的文本编辑器创建 Python 程序，但大多数开发者更倾向于使用所谓的集成开发环境或 IDE。IDE 可以帮助你处理语法、修复错误、代码提示等。流行的
    Python IDE 包括 Python 和 Jupyter Notebook。不过，我更倾向于使用 Visual Studio Code，因为它支持多种编程语言，在普通开发者中非常流行，并提供了更健壮的编码环境。


    # 安装 Visual Studio Code


    步骤 1：访问 Visual Studio Code 网站：([`code.visualstudio.com/`](https://code.visualstudio.com/))


    步骤 2：下载适用于你操作系统的版本。


    步骤 3：打开 VSCode 并可选安装 Python 扩展。有关此步骤的完整指令，请访问此链接：[`code.visualstudio.com/docs/python/python-tutorial`](https://code.visualstudio.com/docs/python/python-tutorial)


    在书中我们将在 VSCode 中进行代码示例。然而，你可以自由使用任何你喜欢的 IDE。现在你已经完成了设置，准备好开始你的 Python 编程之旅了！让我们开始吧！


    # 你的第一个 Python 程序！


