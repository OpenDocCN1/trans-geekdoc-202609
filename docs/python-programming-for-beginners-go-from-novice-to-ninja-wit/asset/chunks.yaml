- raw: 'Save the code and run it. You should see a result that contains "40.0" We''ll
    worry about properly formatting prices to 2 decimal places later in the book.
    Just for fun and to help you get more familiar with how expressions behave, take
    your variable for "item\_price" and "quantity" and move them below the line that
    multiplies them. What happens? What happens when you try to run your code like
    that? Once you''ve seen go ahead and put your code back to the way it was. When
    Python reads your expressions, it reads them from the top down. So, if you try
    to run an operation before you''ve declared your variables, you''ll get errors.
    Your IDE will warn you of the problem even before you run your code.


    # Getting User Input


    You''ve already seen the input() function in action in other coding examples.
    Now let''s do that here. The math expression code was fun and all, but it''s static.
    Let''s say that this is a cash register program we''re writing, and the cashier
    needs to put in the price per item and the quantity to get a total price. How
    do we get the cashier''s input?


    Change your "item\_price" and "quantity" variables to look like this:


    item\_price = float(input("What is the cost per item? "))


    quantity = int(input("How many of that item do they have? "))


    Now save and run your code. With just some minor changes in your expressions,
    you''ve gone from a static set of instructions to something a little more dynamic
    and interactive. There are some concerns here, however. The input() function is
    very accommodating. It takes a string as a prompt to show the user, and then it
    accepts any input the user may try to enter. For "item\_price" the user could
    have entered "kittens". The input() function would happily accept them but your
    code would throw an error. So, we still have some bugs to work out and We''ll
    cover that when we cover error handling.


    # Example 2 – Conditional Expression


    Create a new file called "conditionals.py" in your IDE and enter this code in
    it:


    \# Conditional Expression


    is\_adult = age >= 21


    You can already see that your IDE has a problem with it. The "age" variable has
    not been declared. Go ahead and create it but make it so it can accept user input.
    (Try to do this before reading ahead to my solution.)


    Next, add a print line that says, "You are old enough" and shows whether that
    is true or not.


    "Age => 18" uses a conditional operator (greater than or equal to), so it returns
    a Boolean (true or false) result. Because "is\_adult" is assigned the result of
    our conditional statement, Python infers that "is\_adult" is a Boolean data type.
    This is why your print statement shows "True" or "False" depending on the age
    you entered.


    ![Conditional expression example](image_rsrc3HG.jpg)


    To give this some context, let''s say that this is an enhancement to our cash
    register program where the buyer must be a certain age before making certain purchases.
    Our solution will work, but it''s a little awkward. "You are old enough true,"
    or "You are old enough false" sounds a little caveman-y. It would be nice if our
    code gave one response to a user of the right age and another to a user who is
    too young. Later in the book, We''ll explore exactly how to do that.


    # Example 3 – String Concatenation Expression


    Expressions are not just limited to numbers. They can be used with strings as
    well. In your IDE create a file called "concat.py" and put this code into it:


    \# String concatenation expression


    full\_name = first\_name + " " + last\_name


    Initialize (declare) the "first\_name" and "last\_name" variables in a way that
    accepts user input and then add a print line that says: "Hello, \[full\_name\]"
    where "full\_name" is the concatenation of the other two variables. (Notice that
    with strings, the concatenation operator is the plus sign ("+").


    This is my take on it:


    ![Concatenation example.](image_rsrc3HH.jpg)


    On line 3, the apostrophe on "What''s" works just fine because the whole statement
    is surrounded by double quotes.


    On line 4, however, I have surrounded my statement with single quotes. For the
    apostrophe to work without causing a syntax error, I had to use an "escape" character,
    the backslash (\\), before the apostrophe. "Escaping" a character means you are
    telling your programming language to take the character after the \\ as a string
    literal, not a part of your command. If I had left the backslash out, Python would
    have assumed that my input statement was just "What" and then the IDE would have
    flagged the rest of the statement as a syntax error. If I had run with it anyway,
    I would have seen this:


    ![Python syntax error message.](image_rsrc3HJ.jpg)


    That''s Python''s way of saying: "Hey, you''re missing a quote around one of your
    strings." Actually, I''m not missing a quote, it''s just that I''m using an apostrophe
    and Python thinks it''s a quote. The escape (\\) character tells Python just to
    show that single quote as is on the screen and not interpret it as a single quotation
    mark.


    # Section 2: Conditional Statements


    Conditional Statements, also known as "branching statements," or ""if statements,"
    are statements that allow your program to make choices (to branch one way or another)
    based on the outcome of a condition: "If this is true then do this. Else, do that."


    # Exploring if, elif, and else Statements.


    # The "if" Statement


    This is probably the most common of conditional statements in programming. The
    generic syntax for an "if" statement is this:


    If \[test condition\] then \[result/response\]


    Because of its indentation rules, it looks like this in Python:


    If \[test condition\]:


    ​\[result/response\]


    Now let''s look at our code from earlier:


    ![Conditional expression example from earlier.](image_rsrc3HG.jpg)


    We can improve this a little by applying an "if" statement.:


    ![Improved conditional with if statement.](image_rsrc3HK.jpg)


    That''s a little better. If someone is at or above the age of 21, they get a response
    saying they meet the requirement. But what about people under 21? Right now, they
    are completely ignored. This is where the "else" statement comes in.


    # The "Else" Statement


    You use the "else" statement for situations where none of your conditions apply.
    In our case, the condition is the person needs to be 21 or older. To handle users
