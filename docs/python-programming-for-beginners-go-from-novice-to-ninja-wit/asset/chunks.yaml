    Introduction


    Python is known for its readability, simplicity, and ease of use. Because of these
    and several other characteristics, it is a great programming language for beginners,
    but don''t let those features fool you into thinking Python is somehow second-rate.
    It''s exactly because of those features and its rapid development capabilities
    that it has an impressive resumé. Here is a short list of companies that use Python:


    Reddit, one of the world''s largest social media and discussion platforms, started
    off using Common Lisp and later migrated to Python because of its readability
    and ease of use.


    Pinterest, an image-sharing and social media platform, uses Python extensively.


    Quora is a question-and-answer platform founded by former Facebook employees and
    of all the options out there, they chose Python as their development platform
    of choice.


    Spotify, a music streaming company, uses Python for several things including data
    analysis and parts of its backend infrastructure. The same holds true for Uber,
    the ride-sharing company.


    Survey Monkey, a company specializing in survey development and data collection
    started out with Python and continues to use it for internal tools and scripts
    as well as Django, Python''s high-level web framework.


    A surprise on this list of clients is NASA. Technically it is not a company but
    to have it as part of your list of clients is impressive. NASA uses Python for
    scientific and computational tasks, data analysis, and simulations.


    So, if you''re new to programming, trying to change career paths and move into
    the tech sector, or just looking to add to your skill set, learning Python is
    a worthy investment.


    # What is This Book About Python Going to Do for You?


    I have three overarching goals in mind for you in this book.'
