    example, if you have a set of numbers and you want all the even ones, you could
    iterate through the set dividing each number by % 2 (mod 2) and then extract only
    the numbers where x % 2 = 0 where "x" is one of the numbers from the set. 12 %
    2 (12 mod 2), for example, would have no remainder, so it would be one of the
    numbers extracted.


    Lines 21-23: If you need to apply an exponent to a number, the exponentiation
    operator is \*\*. In our example, we took 6 to the power of 4 so Python did this
    with 6 \*\* 4 and gave us the result of 1296.


    # Calling Functions vs. Calling Methods


    One more thing before we go on to the coding practice for this section, and that''s
    calling functions vs. calling methods. You''ve already seen the print( ) function
    several times. You also saw the .upper( ) and .lower( ) methods in action. There
    is a significant difference in how functions and methods are called. Functions
    can be called from anywhere. Methods, however, must be attached to an object or
    a class. If you look at the ".upper( )" method above, you''ll see that it is attached
    to the text object we created. The text object in our example is a String data
    type. I cannot call "upper" from out of nowhere. I have to have an object to attach
    it to and I have to use "dot notation" to use it. Notice in the code that it was
    "text.upper()," not just "upper." If you were reading that code aloud, you read
    it as "text dot upper." That "dot" is what attaches the method to a class/object.
    To put it another way, a method cannot act independently. A function, however,
    can be called from anywhere. You''ve seen that in all the print() function calls
    we''ve made so far. It was not ''some\_object dot print." It was just print(TEXT).


    "In Python, methods and functions have similar purposes but differ in important
    ways. Functions are independent blocks of code that can be called from anywhere,
    while methods are tied to objects or classes and need an object or class instance
    to be invoked. Functions promote code reusability, while methods offer behavior
    specific to objects. Functions are called by name, while methods are accessed
    using dot notation. Understanding these distinctions is crucial for writing organized,
    modular code in Python and harnessing the full power of methods and functions
    in various programming scenarios. " (Singh & Singh, 2023)


