- raw: '# Using \*\*kwargs


    While it would make for a great Klingon name, the keyword "kwargs" is short for
    "keyword arguments" and is used for parameters that contain key-value pairs. A
    key-value pair is a list of items where each item in the list is identified by
    a unique key.


    Let''s add another function to our "flex\_param.py" code:


    ![kwargs code example](image_rsrc3J5.jpg)


    In line 12 we''re showing ourselves the data type we''re using, and in lines 14-15
    we''re iterating the list and formatting the output to show us the key and its
    corresponding value. The blank space at line 13 is not required, but I do it to
    break things up within my code blocks for clarity. It''s clear that lines 14-15
    are a "for" loop and have a purpose distinct from the opening lines of the function.


    # "Polymorphism"


    Polymorphism (a.k.a. function overloading) based on parameter types is not supported
    by Python as it is in other languages. To give you a rough idea of this kind of
    polymorphism, let''s say we have the language "J." In "J," I can have two methods
    by the same name like this:


    brewCoffee(String brand)


    brewCoffee(String brand, int quantity)


    These both have the same name. How would my code "know" which one I wanted? It
    would know by the parameters I entered. The first one only takes a single parameter
    of type String. The other takes two parameters, one of type String and one of
    type int. If I wrote "brewCoffee("Maxwell House")," it would know I meant the
    first method. If I wrote "brewCoffee("Maxwell House", 2)," it would know I meant
    the second one.


    Python can mimic this kind of polymorphism by using a non-default parameter followed
    by default parameters:


    ![Python fake polymorphism code.](image_rsrc3J6.jpg)


    In the above example, I was able to call the "add" function with three different
    sets of parameters. This is because parameters "b" and "c" have defaults set on
    them. This is not true polymorphism. Even though in the first function call I
    only have 1 parameter, Python still thinks it''s getting 3 because the other two
    have already been set to "0."


    If you were to run this code, you would get an error:


    ![A white background with black and green text Description automatically generated](image_rsrc3J7.jpg)


    The code would throw an error at the first function call print(add(1,2,3)) and
    tell you this:


    TypeError: add() takes 2 positional arguments but 3 were given


    Why would it say that? First, because Python reads the code from the top down.
    Second, Python cannot accept duplicate function names even if the parameters are
    different. It will see the first method but when it runs into the second one with
    the same name, it will see it as a replacement of the first. Hence, the error.


    This subsection introduced you to the concept of creating versatile Python functions
    that can adapt to varying inputs. We highlighted the use of default values, and
    arbitrary argument lists so that you can write code to handle different scenarios.
    We also briefly discussed polymorphism and how we can get Python to mimic that
    functionality even though it does not support it. Now let''s look at a real-world
    example so you can see these concepts used in a practical way.


    # Case Study: A Real-World Function with Practical Use


    # Our Scenario:


    We want to create a library catalog. It will store information about the books
    in the collection, including title, author, etc. This information will be stored
    in a list. Users can then search this list based on different criteria. For this
    example, we''ll focus on the sorting functionality.


    # Optional:


    You can simply read along as we walk through this code, or you can create your
    own Python file and write the code as you read to get more familiar with the syntax
    and thought process behind coding in Python.


    # Problem:


    Our function needs to be able to accept lists of books and respond to the user''s
    sort criterion. To make this work, we need to have a built-in list of allowable
    search options and be able to respond to user errors when they choose an option
    that is not allowed.


    # Looking Ahead


    In this real-world example, we are going to use two concepts we have not covered
    yet: lambda functions and the "raise Exception" syntax.


    # Defining the Function


    Here is the function we will use for the library catalog:


    ![Catalog demo code](image_rsrc3J8.jpg)


    Let''s go through this line by line:


    Line 2: This is the function definition. It takes two parameters: a list called
    "book\_list" and a string called "sort\_option."


    Line 4: This declares the list "valid\_criteria."


    Line 5: This takes the user''s "sort\_option" and checks it against the "valid\_criteria"
    list. It uses a "not in" statement to see if the user entered an invalid search
    option.


    Line 6: This line uses the "raise Exception" syntax. In this case, if the user
    enters an invalid search option, it raises the ValueError exception and shows
    the user the custom message: "Invalid sorting criterion." For a list of Python''s
    built-in exceptions, you can go to this site:


    [https://docs.python.org/3/library/exceptions.html](https://docs.python.org/3/library/exceptions.html)


    Line 10: If the user''s sort option is allowed, then the list is sorted according
    to the user''s choice. To perform this sort, the function uses Python''s built-in
    "sorted" function. To see a complete list of Python''s built-in functions and
    their syntax, you can go to this site:


    [https://docs.python.org/3/library/functions.html](https://docs.python.org/3/library/functions.html)


    The "sorted" function has one required and two optional parameters.


    *   The word "iterable" means it takes an iterable item like a list or a dictionary.
    This parameter is required.


    *   The "key" is optional and defaulted to "none." If it is included, it must
    point to a key in the key-value pair that is being sorted.


    *   The "reverse" option is defaulted to "False." If set to true, it reverses
    the sort order.


    In our real-world example, the call to the "sorted" function uses the key and
    populates it with a "lambda." The "lambda" function is also known as an anonymous
    function. Think of it as a dummy function when a function needs a function as
    a parameter. The "key" option in the "sorted" function requires a function as
    a parameter and a "lambda" suits that purpose.


    The syntax for a "lambda" looks like this:


    lambda arguments: expression


    In our example, the "key" option we are using looks like this:


    key=lambda book:book\[sort\_option\]


    To put this into plain English we are telling the key, "Lambda is your function.
    The argument that function takes is book. The "sort" key you''re going to use
    is whatever sort\_option the user happened to pick." So, if the user happens to
    pick "author" as their sort key, all the books in the book\_list will be sorted
    by author. Don''t worry if it feels like your mind went on vacation during that
    explanation. The more you use the "sorted" function and the more you use "lambdas"
    the more they will make sense. Knowledge like this takes time to develop.


    Line 12: This returns the sorted list once the function completes the sort.


    # Populating the Library


    Now that the function is in place, we need to populate the library. The library
    is a list of dictionary objects. Dictionaries are lists that have key-value pairs
    where each value in the dictionary is identified by a key. Here is our library:


    ![A close-up of a text Description automatically generated](image_rsrc3J9.jpg)


    # Calling the Function


    Here are some sample function calls. The last one is incorrect:


    ![A white background with black text Description automatically generated](image_rsrc3JA.jpg)


    If we run this now, the "print" command will not run because the last function
