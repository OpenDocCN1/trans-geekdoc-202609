    # 第 4 节：最小化调试和故障排除的最佳实践


    在本章的开头，我基本上提到过，代码中的 bug 是不可避免的。在某种程度上，它们确实如此。但这并不意味着我们不能努力编写无 bug 代码。因此，为了编写便于调试的整洁代码，这里有一些非常有价值的提示。


    ## 使用有意义的变量名


    虽然你不希望代码过于冗长，但也不希望在编码时过于极简以至于晦涩难懂。当你编写代码并创建变量名时，请记住那个必须在你之后对代码进行故障排除或添加新功能的程序员。那个程序员可能就是你自己！如果真的有其他程序员需要接手你的工作，请成为那个让大家感叹：“他们写的代码可真整洁！”的人。不要成为那个让大家说：“修复他的代码？还不如从头重来容易！”的那个人。


    此外，避免使用单字母变量名，除非是在循环等标准实践中。


    ## 模块化你的代码


    尽可能将你的代码拆分为模块化的函数或类。在编写代码时，要从可重用的角度进行思考。当然，在很多情况下，你编写的代码是非常针对项目的，但即使在这种项目中，也有机会编写可以在其他地方使用的代码。此外，通过遵循模块化的编码方法，你是在为自己和他人提供帮助，因为模块化的代码更容易调试、故障排除和维护。


    ## 有效地记录代码


    如果你读过名为《不幸的一系列》（*A Series of Unfortunate Events*）的书丛，你可能还记得《爬虫屋》（*The Reptile
    Room*），其中约瑟芬阿姨写了满页的“不准”字，以此警告鲍德莱尔孩子们潜在的危险。


    如果可以的话，我会写满一页的“文档！文档！文档！”因为我无法如何强调才能强调代码文档有多么重要。我知道，对于那些压力着产代码和赶截止日期的程序员来说，文档听起来像是一种奢侈品，但从长远来看，代码文档可以节省大量时间。你会惊讶于自己有多少次回到自己的代码并心想：“我当时在想什么？”对于其他人看别人写的代码来说，情况甚至更糟。


    在代码中包含注释来描述函数的目的。在这些函数内部包含注释，描述那些显而易见的操作。在代码顶部包含注释来解释文件及其函数的整体目的。甚至可以描述假设、潜在问题和未来的计划。


    ## 编写单元测试


    尽可能自动化你的单元测试。只需确保包含单元测试，以便在开发早期发现问题。


    ## 第 6 章总结！


    在本章中，我们涵盖了代码调试和故障排除这一非常重要的课题。当然，我们的目标是从一开始就让代码无 bug，但正如我们在本章开头所说的，调试和故障排除是程序员生活的一部分。在本章中，我们列出了一些常见的编码错误、如何识别它们以及如何排除它们。我们还查看了各种故障排除和调试工具，从
    IDE 中包含的工具等。

