    *   `SQLite` 是一个无服务器、轻量级且自包含的数据库，最适合以简单和最小配置为关键的中小型项目和应用程序。`SQLite` 非常适合本地存储应用、移动应用和桌面软件。

    *   `MySQL` 是一个开源的关系型数据库管理系统 (RDBMS)，适用于大型运营和网站。它以可扩展性闻名，采用客户端/服务器架构，并允许多用户访问。你通常会在内容管理系统
    (CMS)、Web 应用程序和大型企业环境中看到这种数据库。

    *   `PostgreSQL` 与另外两个一样也是开源的。它以可扩展性、可扩展性和 SQL 兼容性闻名，非常适合大型应用程序。它通常用于需要数据仓库和大型信息系统等高级功能的项目。


    ## NoSQL 数据库


    这些是不遵循结构化数据库模型的数据库。两个流行的 NoSQL 数据库系统包括 `MongoDB` 和 `Redis`。


    *   `MongoDB` 是面向文档的，数据存储在 `BSON` 文档中，这些类似于 `JSON` 文档。（我们的天气应用使用 `JSON` 文档来存储数据。）由于它是无模式（schema-less）的，因此非常适合更动态、结构化程度较低的数据环境。你可能会在社交媒体平台和实时分析工具中使用这种数据库。

    *   `Redis` 使用内存键值模型。它通常用作快速数据检索的缓存机制。它适用于需要实时信息的应用程序，如游戏或即时消息应用。虽然这种描述可能会给人内存是瞬态的印象（意味着应用程序结束后存储的内容会立即消失），但默认情况下，它被配置为使用“快照”和“仅追加文件”
    (`AOF`) 长期存储到磁盘。


    ## 为你的 Python 应用选择数据库时需要考虑的五件事


    从之前的讨论中你可以看出，“与 Python 配合哪种数据库最好？”这个问题没有标准答案。最好的答案是“这取决于情况”。以下是五个需要考虑的因素：


    ### 第一：数据结构与复杂性


    如果你知道数据将具有（或需要）定义良好的结构和关系，那么关系型数据库系统是最合理的。如果你的数据更灵活且易于变化，NoSQL 数据库是更好的选择。


    ### 第二：可扩展性需求


    如果你预计你的项目未来将经历大幅增长，请考虑可以使用随你的需求扩展的数据库。起初，使用一个扩展性较差但更易于使用的数据库似乎是个好主意，但事后追赶增长并迁移到更健壮的系统可能会被证明是有问题的。


    ### 第三：社区与支持


    你正在考虑的数据库系统背后有什么种社区和支持？良好的社区支持意味着可以获得资源、技巧和更快的错误修复。你希望你的项目嫁给一个稳定的数据库系统，而不是一个“疯狂猫奴娘”（向任何非疯狂猫奴娘的女士道歉）。


    ### 第四：项目规模与复杂性


    规模和复杂性并不一定正相关。你可能有一个只需要简单数据库的大项目。更大、更复杂的项目可能需要像 `PostgreSQL` 之类的高级功能。而其他可能不需要。


    ### 第五：与 Python 的集成


    确保你选择的与 Python 工作的数据库有一个支持良好的 Python 驱动程序。在某些情况下，你被要求与现有的数据库工作，而更换数据库是不可能的。虽然你可能可以在
    Python 和该数据库之间建立定制的连接，但请记住，你必须能够长期维护该连接。这包括在 Python 和所给数据库都进行升级时保持其正常运行。如果无法更改数据库，你可能需要考虑
    Python 以外的解决方案。因为最终，你的目标是让你的应用程序和数据库无缝协作。


    ## 第 2 部分：基础 SQL CRUD 操作


    CRUD 代表“创建 (Create)、读取 (Read)、更新 (Update) 和删除 (Delete)”。这些是 SQL 中的标准操作。技术上讲，“创建”对应
    `INSERT` 语句，“读取”对应 `SELECT` 语句，但那样就是“ISUD”，谁能记得住呢？


    CRUD 操作适用于 RDMS（关系型数据库管理系统）和 NoSQL 数据库。然而，NoSQL CRUD 命令随系统而异。某些 NoSQL 数据库使用类似于
    SQL 的查询语言，而另一些则使用内置函数处理。下面显示的示例适用于 RDBMS 系统（CrowdStrike, 2023）。


    ### 创建 (Insert)


    ```

    INSERT INTO <table name> VALUES (field value 1, field value, 2…)

    ```


    ### 读取 (Select)


    ```sql

    SELECT field 1, field 2, …FROM <table name> \[WHERE <condition>\]

    ```


    `WHERE` 子句是可选的，用于应用搜索条件以提取特定的记录集。


    ### 更新


    ```sql

    UPDATE <table name> SET field1=value1, field2=value2,… \[WHERE <condition>\]

    ```


    这里的 `WHERE` 子句在技术上是可选的，但通常是一个好主意，这样你就不会意外更新比计划多的记录。此外，良好的做法是先运行 `SELECT` 语句，然后将其转换为
    `UPDATE` 语句，以确保你只影响你想影响的记录。


    ### 删除


    ```sql

    DELETE FROM <table name> \[WHERE <condition>\]

    ```


    与 `UPDATE` 语句一样，`WHERE` 子句是可选的，但通常是个好主意。在转换为 `DELETE` 查询之前，先运行 `SELECT` 查询也是好的，以确保你不会意外删除比计划多的记录。这种情况会发生吗？是的。我遇到过一次由于错误的删除操作导致删除了
    TB 级信息。


    ## 第 3 部分：数据库示例


    本节将引导你如何将 Python 连接到数据库并执行 CRUD 操作。一如既往，我鼓励你边读边写代码。不过，如果你愿意，可以使用答案密钥部分末尾的链接下载完成的代码。


    ## 运行此代码


    如果你想运行这段代码，你需要在机器上安装 MySQL Server。如果你不习惯这样做，你仍然可以跟随代码并学习如何连接和与数据库交互。你只是无法执行数据库操作。


    ## 安装 MySQL Server


    在下载或安装任何内容**之前**，请阅读所有这些步骤，以便了解涉及的内容。


    ### 适用于 Windows


    在此处下载 MySQL Server 安装程序：[`dev.mysql.com/downloads/installer/`](https://dev.mysql.com/downloads/installer/)


    在写本文时，当你到达安装程序页面时，有两种“版本”。我选择了较小的那个。点击该链接后，系统会提示你打开 Oracle 账户。你不需要打开。你可以点击“不需要，直接开始下载”链接。


    下载安装程序后，打开它并按照提示操作。


    ### 为其他操作系统安装 MySQL Server


    如果你想为不同的操作系统安装 MySQL Server，请访问此链接并按照上面的说明：[`dev.mysql.com/doc/refman/5.7/en/installing.html`](https://dev.mysql.com/doc/refman/5.7/en/installing.html)


    ### 适用于所有系统


    #### 选择 MySQL Server 安装类型


    为了节省我的机器空间，我选择了“仅服务器 (Server only)”选项。如果你喜欢，可以选择完整安装。从那里开始，继续按照提示操作。


    #### 类型和网络


    对于“配置类型 (Config Type)”我选择了“开发机 (Development Computer)”。我保持其他所有默认设置。


    #### 身份验证方法


    我选择了推荐设置。


    #### 账户和角色


    输入密码并保存好！


