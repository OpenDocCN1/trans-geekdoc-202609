    [https://www.amazon.com/dp/B0CRS9HJC7](https://www.amazon.com/dp/B0CRS9HJC7)


    # Follow Me!


    You can follow and message me on Facebook page Nontechnically Speak at: [https://www.facebook.com/ntspeak](https://www.facebook.com/ntspeak)


    You can also follow me on Instagram at [https://www.instagram.com/htack210/](https://www.instagram.com/htack210/)


    Glossary


    API: Application Programming Interface. These are common throughout the coding
    world. Most software programs will have an API which is a set of rules that allow
    your code to interact with a given application. For example, ChatGPT has an API
    that allows you to incorporate its AI with your web page to provide human-like
    responses to user questions.


    Boolean: A data type with a true or false setting. You''ll see Booleans used in
    conditional statements. The data type is named for 19th\-century English mathematician
    George Boole and is pronounced: /ˈbo͞olēən/. When written, it is supposed to be
    capitalized since it is a proper noun.


    Decorator: A function that modifies other functions or methods.


    Data Science: “Data science combines math and statistics, specialized programming,
    advanced analytics, artificial intelligence (AI), and machine learning with specific
    subject matter expertise to uncover actionable insights hidden in an organization''s
    data. These insights can be used to guide decision-making and strategic planning.”
    (What Is Data Science? | IBM, n.d.)


    Dunder Methods: A way to use operator overloading in Python (e.g., \`\_\_init\_\_\`).


    Function: A module of code that performs a specific task.


    Git: This is a version control system for tracking changes in your code. If you
    are experimenting with a new feature, you can create a separate branch of your
    code just for that feature, and later merge it into your main code once you''re
    satisfied the new feature is stable. It''s also helpful if you are collaborating
    on a project with other developers. Each of you can work on your own branch of
    the main code and work on your portion of the project. You can then review each
    other''s work and decide what should be merged into the main project.


    Indentation Error: A mistake in indentation that leads to coding errors. These
    are errors in syntax rather than logic. Python is particular about its coding
    structure and uses indentation to enforce its syntax rules. When something is
    not formatted correctly, it will throw an error because the syntax is how it understands
    what you are trying to do. Seems harsh, I know. It''s kind of like that high school
    English teacher who''s keeping you from graduating because you used a comma splice
    once. It''s a pain in the neck, but you have to respect the syntax!


    Iteration (iterating, iterative): " Iteration, in the context of computer programming,
    is a process wherein a set of instructions or structures are repeated in a sequence
    a specified number of times or until a condition is met. When the first set of
    instructions is executed again, it is called an iteration. When a sequence of
    instructions is executed in a repeated manner, it is called a loop." (Rouse, 2011)


    Machine Learning: “Machine learning is a branch of artificial intelligence (AI)
    and computer science which focuses on the use of data and algorithms to imitate
    the way that humans learn, gradually improving its accuracy.” (What Is Machine
    Learning? | IBM, n.d.)


    Module: A mode is a file that contains Python code that can be used by other programs.
    For example, if your code is designed to print something, rather than writing
    your code to print a file, you can use a Python printer module instead.


    Numpy: A scientific computing and numerical operations library for Python.


    Parameter: A variable that is used by a function as an input to complete a task.
    For example, the print() function takes a String parameter. It uses that parameter
    to output the string it was given and show it on the screen.


    PEP 8: A style guide for writing Python code that is clear and readable. The guide
    is not written in stone. If your syntax is acceptable to Python, it will work,
    but code written in the style as laid out by PEP is best practice.


    Pipenv: A Python package manager that manages dependencies and simplifies the
    use of libraries and dependencies for Python projects.


    Procedural Programming: "Procedural programming is a programming paradigm built
    around the idea that programs are sequences of instructions to be executed. They
    focus heavily on splitting up programs into named sets of instructions called
    procedures, analogous to functions. A procedure can store local data that is not
    accessible from outside the procedure''s scope and can also access and modify
    global data variables." (DeepSource | the Modern Static Analysis Platform, n.d.)


    Psuedo Code: “Pseudocode is a detailed yet readable description of what a computer
    program or algorithm should do. It is written in a formal yet readable style that
    uses a natural syntax and formatting so it can be easily understood by programmers
    and others involved in the development process.” (Sheldon, 2023)


    Pythonic: Adherence to Python''s coding style and best practices. Writing code
    in a way that follows Python conventions and guidelines.


    Scientific Computing: “Computational science, also known as scientific computing,
    technical computing or scientific computation (SC), is a division of science that
    uses advanced computing capabilities to understand and solve complex physical
    problems.” (Wikipedia contributors, 2023)'
