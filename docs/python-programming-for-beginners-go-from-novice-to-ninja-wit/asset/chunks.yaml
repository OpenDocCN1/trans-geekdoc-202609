    # Chapter 8 Recap!


    In this chapter, we looked at the topic of data analysis and visualization. We
    used some of the data analysis features available in Python''s libraries, specifically
    Pandas, and we also saw how visualizing data can help communicate its story in
    a clear and easy-to-grasp way. Additionally, we demonstrated how you can make
    your charts interactive.


    In industry, the trend is toward more and more automation. The mantra is: "If
    a task needs to be done more than once, it needs to be automated." It''s an important
    consideration because it cuts costs, and improves efficiency. So, in Chapter 9,
    we''ll dive into scripting and automation. See you there!


    Chapter 9: Scripting & Automation


    Automation is used for a wide range of automation tasks: file manipulation, web
    and application testing, data scraping, image processing, and more. Not only does
    it free up valuable IT time, but it also reduces errors and increases efficiency.
    And automation is not just limited to the corporate world. Every smart appliance
    from phones, to outlets, to door locks are examples of automation. Forget to lock
    the doors when you left the house? Just get on your phone and tell your smart
    locks to lock up. Too cold to start your car in the morning? Use the remote start
    on your key fob and make the car start itself.


    "Implementing IT automation with Python scripts is popular because of the programming
    language’s simplicity, intuitiveness, versatility, support of data structures,
    and powerful libraries." (Blog, 2023)


    In this chapter, we''ll cover several hands-on examples to get you familiar with
    what Python can do when it comes to automation.


    # Section 1: What is Scripting and Automation?


    When we say "scripting and animation" we mean writing scripts in languages like
    Python to automate tasks. So, scripting is the means and automation is the goal.
    Scripting is used to handle repetitive tasks. Automation is using technology to
    perform such tasks with little to no human interaction.


    The best way to learn how to do scripting is to get your hands on it. So, the
    following sections are all hands-on examples.


    As always, while I encourage you to write the code as you go, you can find all
    the code for Chapter 9 using the link at the end of the [Answer Key](#part0018.xhtml#a3D2)
    section.


    # Section 2: File Copier


    In your IDE, create a folder called "FileCopier" and make sure your terminal window
    is working from this folder as well.


    For this example, we''re going to create a script that copies the files from one
    folder to another. I chose "copy" instead of "move" just to be safe, but you can
    change this to move files if that''s what you prefer. The user simply provides
    a source and destination folder, and Python will do the rest.


    # Setup


    In your FileCopier folder create a file called "copy\_files.py." In your file
    include these imports:


    ![A close-up of a word Description automatically generated](image_rsrc3NY.jpg)


    These are all part of the Python Standard Library so there''s no need to do any
    separate installations for them.


    # Capture user input


    ![A close-up of a computer screen Description automatically generated](image_rsrc3NZ.jpg)


    Lines 7 and 8 are wrapped to fit the page. You can combine them into one line
    in your code by removing the \\ and combine lines 7 and 8 into one.


    # The While loop


    This is the main part of our code. I am breaking this into sections to fit the
    page. As you enter it into your code, pay attention to your indentations. Your
    IDE should warn you if there are problems.


    ![A computer code with text Description automatically generated with medium confidence](image_rsrc3P0.jpg)


    Notice the indentation. Lines 11-16 are all indented underneath the ''while''
    statement.


    Line 10: While loops will run until their conditional statement is True. On this
    line, we are purposely setting it to True. It will not stop until the user chooses
    to exit.


    Lines 15: This checks to see if the user has opted to exit the application. To
    ignore case, the user''s response is always set to lowercase.


    Line 16: This will break out of the ''while'' loop and end the program if the
    user has typed ''exit'' in response to the prompt.


    These lines prompt the user for a destination directory. They are wrapped to fit
    the page. In your code combine them into one so you don''t have odd spacing in
    your prompt.


    ![](image_rsrc3P1.jpg)


    # Inner While loop


    This ''while'' loop is an inner loop, meaning it needs to be indented underneath
    the outer "while'' loop and anything inside the inner loop must be indented within
    it.


    This is the opening of the inner while loop.


    ![A computer code with text Description automatically generated with medium confidence](image_rsrc3P2.jpg)


    Line 21: This checks to see if the directory entered by the user exists.


