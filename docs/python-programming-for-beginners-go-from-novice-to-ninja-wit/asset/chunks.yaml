    # 2 深入探索 Python


    为什么它被称为 "Python"？Python 由吉多·范罗苏（Guido van Rossum）创建。为了给他的新编程语言命名，他想要一个简短、独特且带点神秘色彩的名字。当时，他正在阅读《蒙提
    Python 的飞行之旅》（Monty Python''s Flying Circus）的剧本，那是 20 世纪 70 年代英国 BBC 的喜剧节目。（据称，“spam”一词就源于该节目中的一个小品。）他非常喜欢这个节目，因此决定向它致敬并以此命名他的语言。（通用
    Python FAQ，n.d.）这正说明程序员确实有幽默感。它扭曲而奇特，有时超乎凡俗的理解，但它确实存在。


    # 第 1 节：运算符与表达式


    ## 理解运算符及其在 Python 中的作用


    ### 什么是运算符？为什么它们很重要？


    运算符对于任何编程语言（包括 Python）都是至关重要的。它们是用于对数据执行各种操作的特殊符号。这些包括数学方程、进行比较、执行逻辑评估以及赋值。观察它们的作用，就能明白为什么它们如此重要。它们之所以重要是因为它们可以操纵数据、控制程序流、帮助你的代码做出决策、为变量赋值并存储和检索数据。如果不理解如何有效使用运算符，就像在不学习任何动词的情况下学习外语。你将无法进行有效的交流。


    ## 运算符分类


    运算符分为几大类：


    ### 算术运算符

    正如名称所示，这些运算符用于执行数学计算。你已经在第一章见过它们的一些用法了。它们包括加 (`+`)、减 (`-`)、乘 (`*`)、除 (`/`)、整除
    (`//`)、模（又称余数，%`）和幂 (`**`）。


    在这个示例中，代码使用减法来获取用户的出生：


    ![](img/image_rsrc3HC.jpg)


    ### 比较运算符

    这些运算符比较值并确定它们之间的关系。这类运算符包括等于 (`==`)、不等于 (`!=`)、大于 (`>`)、小于 (`<`)、大于等于 (`>=`) 和小于等于
    (`<=`)。


    在这个示例中，代码检查学生的成绩是否及格：


    ![一个带有黑色文本的白色背景，自动生成的描述](img/image_rsrc3HD.jpg)


    第 2 行要求用户输入分数。


    第 3 行将及格线设为 70。


    在第 4 行中，Python 将 `is_passing` 视为一个布尔值（真或假），因为比较运算符根据结果返回“true”或“false”。在这种情况下，如果学生的成绩大于或等于及格线，结果为“true”。


    第 6 行向用户显示结果。


    ### 逻辑运算符

    它们比较多个条件并确定表达式的整体值是否为真。逻辑运算符包括“与” (and)、“或” (or) 和“非” (not)。


    下一个示例使用逻辑运算符 `and` 来判断是否是野餐日：


    ![一个带有黑色文本的白色背景，自动生成的描述](img/image_rsrc3HE.jpg)


    第 5 行是一个布尔值，因为逻辑运算符将根据它们的评估返回真或假。所问的是：“是晴天而且天气温暖吗？”如果答案都为真，那么语句返回“true”。


    ### 赋值运算符

    赋值运算符将值赋予变量。常见的赋值变量是等号 (`=`)。


    示例：`x = 7`。


    当你在 Python 中编写这样的代码时，它将根据你赋予的值确定变量的类型。因此，对于 `x = 7`，Python 会确定 `x` 是一个值为 7 的 `INTEGER`（整数）。如果你编写
    `x = 7.0`，那么 Python 会确定 `x` 是一个值为 7.0 的 `FLOAT`（浮点数）。


    尽管等号很简单，但它会让初学者感到困惑，因为他们可能会误地将其用作比较运算符。但比较运算符是 `==`。区别在哪里？区分它们最简单的方法是……


    ## 创建表达式与执行操作


    表达式是计算的核心。但当我们谈论表达式时，我们在说什么？（等等，原文此处似乎有重复/乱码）。我们说的是如何以某种方式组合值、变量和运算符以产生准确的结果。精通表达式的关键在于实践。不要害怕实验——用你自己的代码——你对它们的理解越深，就会发现越多使用它们的方法。除了进行简单的数学计算，你还会发现表达式还可以用于决策和响应输入。


    ### 示例 1 – 一个简单的表达式


    在你的 IDE 中创建一个新文件并输入以下代码：


    ```python

    # 一个简单的表达式

    total_cost = item_price * quantity

    ```


    将此文件命名为 `math_expression.py` 并保存。你的 IDE 应该已经标记了错误。在继续阅读之前，你能告诉为什么吗？


    你通过让 `total_cost` 等于 `item_price * quantity` 的值来给它赋值。你需要为那两个变量赋值。由于物品的价格通常是带有小数的数字，所以它应该是一个
    `float`，而由于数量通常是整数，所以它应该是一个 `integer`。因此，将你的代码修改为：


    ```python

    # 一个简单的表达式

    item_price = float(10)

    quantity = int(5)

    total_cost = item_price * quantity

    ```


    这应该解决你的语法错误。我们所做的是显式地声明了 `item_price` 和 `quantity` 的数值数据类型。我们也可以通过这种方式隐式地声明它们的类型：


    ```python

    item_price = 10.0

    quantity = 5

    ```


    从这里，Python 会推断出 `item_price` 是 `float`，因为该数字包含小数，它会推断 `quantity` 是 `int`，因为它是一个整数值。此时，我们可以在
    IDE 终端中运行代码，前提是确保我们在代码所在的相同目录下，然后运行命令：


    ```bash

    python math_expressions.py

    ```


    唯一的问题是我们将看不到任何内容，因为我们还没有告诉代码如何输出它。我们需要添加一个 `print()` 语句。记住 `print()` 函数必须有一个字符串变量，所以我们需要将变量
    `total_cost` 转换为字符串。因此，在代码底部添加添加：


    ```python

    print("The total cost is " + str(total_cost))

    ```


