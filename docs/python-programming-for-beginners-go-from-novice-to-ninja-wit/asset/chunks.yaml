    ## 第 5 章：Python 与面向对象编程


    Python 作为这样一种强大且多功能的语言，当然支持面向对象编程（OOP）。OOP 是一种编程范式，允许你将现实世界的概念建模为对象，因此得名“面向对象编程”。可能有点遗憾的是，OOP
    与 "oops"哎呀）只差一个字母，而后者正是在你犯代码错误时发生的情况，但事实就是如此。


    # 第 1 节：什么是 OOP？


    “面向对象编程（OOP）是计算机科学中的一种编程范式，基于类和对象的概念。它用于将软件程序结构成简单的、可重用的代码蓝图（通常称为类），这些蓝图用于创建对象的实例。有很多面向对象的编程语言，包括
    JavaScript、C++、Java 和 Python。”(Doherty, n.d.)


    Python 不限于 OOP，它还支持过程化编程风格。


    # 第 2 节：OOP 的构建块


    OOP 有四个基本的构建块：


    字体 类 (Classes)

    - 对象 (Objects)

    - 方法 (Methods)

    - 属性 (Attributes)


    # 类


    类是用户定义的数据类型（Doherty, n.d.）。我们在天气应用项目中已经接触过这一点。考虑类的另一种思考方式是将它们看作对象的蓝图。例如，为了建造一个房子，你需要一张蓝图来知道如何构建它。


    # 对象


    对象是从类中构建的实例。实例就是你根据蓝图建造的房子。你可以从一张蓝图建造很多栋房子。你也可以从一个类创建许多实例。需要记住的是，你可以从一张蓝图建造很多房子，但它们并不非得看起来完全一样。你可以使用不同的颜色和其他装饰让每栋房子都独一无二。这如何适用于实例呢？稍后会介绍。


    # 方法


    方法是类中动作的表示。要对对象使用方法，你使用“点”符号。对于天气应用，我们是这样做的：


    ```python

    # 创建一个窗口实例

    window = tk.Tk()


    # 设置窗口标题

    window.title("Weather Forecast App")

    ```


    我们创建了一个 "Tkinter" 窗口对象，然后调用了 `title` 方法为应用添加了标题。


    # 属性


    属性（也称为字段）存储你类中的数据。对象的状态由其属性定义。如果我们回到蓝图类比，假设你创建了一个“房子”类。通过实例属性（影响你类中单个实例的属性），你可以有一个名为
    `self.color` 的属性，通过它，你可以让一个房子实例是蓝色的，另一个是红色的。


    # 第 3 节：继承与组合


    “继承和组合是面向对象编程中的两个主要概念。它们允许代码重用，并随着功能的添加或需求的改变而演进类与类之间的关系。”


    # 继承模型


    继承建模了“是一个”（is a）关系。它指的是基类和派生类之间的关系。在示例中，Car 类被称为子类或派生类。这意味着 Car 类继承自 Vehicle 类，因此继承了它的属性。在示例中，Vehicle
    类拥有了 start 和 stop 方法。 (Python, 2023)


    # 方法


    方法本质上是函数。要对对象使用方法，你使用“点”符号 (.)。


    # 类命名


    在 Python 中，类名始终以大写字母开始。如果类名是多个单词，则使用“驼峰命名法”（camel case）。例如：`ClassNameLong`。


    # 组合


    组合建模了“有一个”（has a）关系。让我们回到汽车类比。汽车需要发动机。所以，让我们创建一个“Motor”类。Car 类并不是派自 Motor 类。相反，它将
    Motor 类作为组件。在 Car 类和 Motor 类之间的关系中，Car 是组合类，而 Motor 是组件类。逻辑上讲，汽车有一个发动机。


