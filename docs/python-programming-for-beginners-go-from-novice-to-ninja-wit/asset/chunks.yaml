    # Goal #1 – A strong foundation.


    A strong foundation in `Python` programming is fundamental to helping you build
    confidence in your programming abilities. My goal is to give you something you
    can continue to build on beyond the pages of this book. As part of that strong
    foundation, we will work to help you master fundamental concepts and syntax.


    If you''ve ever learned a foreign language, you know that you often start by learning
    the alphabet, and then you progress to a few vocabulary words. From there you
    move on to sentence structure so that you can convey ideas. Learning a programming
    language is a little like that, but our goal will be to make you fluent in `Python`.
    So that you can be confident in it. Along the way, you''ll also learn building
    blocks that are common to most programming languages so that you can feel confident
    in extending your programming knowledge into other coding languages.


    # Goal #2 – Learning through practical application.


    The only way to learn any programming language is to just start using it. This
    book is built around programming projects that address practical scenarios, and
    solving common problems to help you apply the `Python` concepts you are learning.
    So, by the time you''re done, you''ll have some practical programming experience
    under your belt.


    # Goal #3 – Skill building.


    This is related to the previous goal but goes beyond just knowing how to apply
    it and why. Again, this is so that you can continue to explore `Python` (and other
    programming languages) independently.


    ## Bonus


    There are two coding projects that we will build throughout this book: A GUI-based
    weather app and a web-based weather app that We''ll deploy online. So, not only
    will you learn `Python`, but you''ll also have a couple of apps to show for it!


    # Here''s what you''ll learn:


    ## Chapter One: Python Essentials


    *   You''ll learn why `Python` is a great language for beginners as well as a
    great choice for helping to enhance your career and skill set.

    *   You''ll be shown how to set up `Python` on your machine whether your OS is
    `Windows`, `Linux`, or `macOS`.

    *   You''ll write your first `Python` script.

    *   You''ll also start on your first standalone app: A GUI-based weather application.


    ## Chapter Two: Diving Deeper into Python.


    *   We''ll dive deeper into operators and expressions.

    *   You''ll see what they are, how to use them, and why.

    *   We''ll explore loops and iteration, concepts that are fundamental to a strong
    foundation in programming.

    *   You''ll take what you''ve learned here to continue working on the weather
    app.


    ## Chapter Three: Building Functions.


    *   You''ll learn how to define functions according to proper `Python` standards.

    *   We''ll explain parameters and arguments, and how to use them.

    *   You''ll also learn how to create and use return statements.

    *   We''ll also continue to build on your knowledge of correct `Python` syntax
    so that your code is compliant with `Python` standards and looks clean, clear,
    and professional.

    *   We''ll apply what you''ve learned here to define the function in the GUI-based
    weather app.


    ## Chapter Four: Data Structures in Python.


    *   `Lists` and `tuples`, what they are, and how to use them.

    *   `Dictionaries` and `sets`, how they compare to `lists` and `tuples`, and how
    they can help organize and retrieve data from complex data sets.

    *   How to work with `files`, including writing a script.


    ## Chapter Five: Object-Oriented Programming.


    *   We''ll learn how to define `classes`.

    *   We''ll explore `inheritance` and `encapsulation`.

    *   We''ll learn how to use `objects` effectively.


    ## Chapter Six: Debugging and Troubleshooting.


    *   We''ll learn how to find and fix errors in your code.

    *   We''ll use debugging tools and techniques.

    *   We''ll learn how to write more robust code.


    ## Chapter Seven: Web Development with Python.


    *   We''ll learn how to build web applications using `Python`.

    *   We''ll explore web frameworks and libraries.

    *   We''ll learn how to deploy our web app online.


    ## Chapter Eight: Data Analysis and Visualization.


    *   We''ll learn how to analyze data using `Python`.

    *   We''ll use libraries for data visualization.

    *   We''ll learn how to work with large datasets.


    ## Chapter Nine: Python in the Real World.


    *   We''ll learn how to automate repetitive tasks with `Python`.

    *   We''ll explore how `Python` is used in various industries.

    *   We''ll learn how to build professional-grade Python applications.


    ## Chapter Ten: Database Basics.


    *   We''ll learn how to work with databases using `Python`.

    *   We''ll explore `SQL` and database management.

    *   We''ll learn how to store and retrieve data efficiently.

    '
  trans: '


    # 目标 #1 – 坚实的基础。


    在 `Python` 编程方面打下坚实的基础是帮助你对自己的编程能力建立信心的根本。我的目标是为你提供在本书之外可以继续构建的内容。作为这一坚实基础的一部分，我们将努力帮助你掌握基础概念和语法。


    如果你学过外语，你就会知道通常从学习字母表开始，然后学习一些词汇。接着，你将转向句式结构，以便表达你的观点。学习编程语言也如此，但我们的目标是让你精通 `Python`，从而使你对它充满自信。在此过程中，你还将学习大多数编程语言中通用的构建块，这样你就能有信心地将你的编程知识扩展到其他编码语言。


    # 目标 #2 – 通过实践进行学习。


    学习任何编程语言的唯一方法就是开始使用它。本书围绕解决实际场景的编程项目构建，通过解决常见问题来帮助你应用所学的 `Python` 概念。因此，当你完成学习时，将积累一些实用的编程经验。


    # 目标 #3 – 技能构建。


    这与上一个目标相关，但它不仅限于知道如何应用以及为什么应用。同样，这是为了让你能够独立地探索 `Python`（以及其他编程语言）。


    ## 奖励


    在整书中，我们将构建两个编程项目：一个基于 GUI 的天气应用和一个我们将部署到线上的 Web 端天气应用。因此，你不仅将学会 `Python`，还将会有几个应用可以展示！


    # 以下是你将学到的内容：


    ## 第一章：Python 基础


    *   你将学习为什么 `Python` 是初学者的优秀语言，也是帮助提升职业生涯和技能的极佳选择。

    *   你将学习如何在你的机器上安装 `Python`，无论你的操作系统是 `Windows`、`Linux` 还是 `macOS`。

    *   你将编写你的第一个 `Python` 脚本。

    *   你还将开始你的你的第一个独立应用：一个基于 GUI 的天气应用。


    ## 第二章：深入探索 Python。


    *   我们将更深入地探讨运算符和表达式。

    *   你将看到它们是什么、如何使用以及为什么要使用它们。

    *   我们将探索循环和迭代，这些是建立坚实编程基础的基础概念。

    *   你将把在这里学到的知识继续用于天气应用。


    ## 第三章：构建函数。


    *   你将学习如何按照正确的 `Python` 标准定义函数。

    *   我们将解释参数和参数以及如何使用它们。

    *   你还将学习如何创建和使用返回语句。

    *   我们继续加强你对正确 `Python` 语法的理解，使你的代码符合 `Python` 标准，并且看起来简洁、清晰且专业。

    *   我们将应用在这里学到的知识来定义 GUI 天气应用中的函数。


    ## 第四章：Python 中的数据结构。


    *   `Lists`（列表）和 `tuples`（元组），它们是什么以及如何使用它们。

    *   `Dictionaries`（字典）和 `sets`（集合），它们与 `lists` 和 `tuples` 的对比，以及它们如何帮助从复杂数据集中组织和检索数据。

    *   如何处理 `files`（文件），包括编写脚本。


    ## 第五章：面向对象编程。


    *   我们将学习如何定义 `classes`（类）。

    *   我们将探索 `inheritance`（继承）和 `encapsulation`（封装）。

    *   我们将学习如何有效地使用 `objects`（对象）。


    ## 第六章：调试与故障排除。


    *   我们将学习如何发现并修复代码中的错误。

    *   我们将使用调试工具和技术。

    *   我们将学习如何编写更健壮的代码。


    ## 第七章：使用 Python 进行 Web 开发。


    *   我们将学习如何使用 `Python` 构建 Web 应用。

    *   我们将探索 Web 框架和库。

    *   我们将学习如何将我们的 Web 应用部署上线。


    ## 第八章：数据分析与可视化。


    *   我们将学习使用 `Python` 分析数据。

    *   我们将使用用于数据可视化的库。

    *   我们将学习如何处理大型数据集。


    ## 第九章：现实世界 Python。


    *   我们将学习如何使用 `Python` 自动化重复任务。

    *   我们将探索 `Python` 在各行业中的应用。

    *   我们将学习如何构建专业级的 Python 应用。


    ## 第十章：数据库基础。


    *   我们将学习如何使用 `Python` 操作数据库。

    *   我们将探索 `SQL` 和数据库管理。

    *   我们将学习如何高效地存储和检索数据。


    '
