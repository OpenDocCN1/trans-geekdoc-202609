    # Code Explanation


    Line 1: This is a comment showing what this code is about.


    Line 2: This declares a variable called `integer_number`. Because it has no decimal
    value, Python assumes it is `int`. It does not need to be explicitly declared
    as an `int`.


    Line 3: This declares the variable `float_number`. Because we want Python to treat
    this as a float, we have to "cast" it as a float like this: `float(integer_number)`.
    This tells Python to take our integer and treat it as a float for our `float_number`
    variable.


