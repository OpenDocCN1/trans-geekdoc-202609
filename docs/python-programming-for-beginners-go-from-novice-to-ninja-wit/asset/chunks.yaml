    # Step Six: Deploying to Git


    This section will guide you through deploying your work to GitHub. You will need
    a GitHub account to do this. If you do not have a GitHub account, you will need
    to go to this site:


    [https://github.com/](https://github.com/)


    From there, follow the prompts to open a free account. (You can also open a paid
    account if you prefer, but that is up to you.)


    # Installing Git on Your Machine:


    Before attempting to install GitHub on your machine, check to see if you already
    have it.


    Windows Users: Open a command prompt in administrator mode and at the prompt type
    this: git version. If you have git installed on your machine, it will show you
    what version of git you have installed. If you do not have git on your machine,
    you will see an error message of some kind stating that it is an unknown command.


    If you do not have git installed, you can go here:


    [https://gitforwindows.org/](https://gitforwindows.org/)


    The installer will give you the latest version of git, which will include both
    the command line version and the GUI version.


    Mac Users: Most MacOS versions already come with git installed. You can run "git
    version" (without the quotes) from the terminal to check. If you do not have git
    for some reason, you can also visit this site to download the latest version:


