    *   The FROM keyword identifies the table(s) from which you want to pull records.


    *   The WHERE clause is optional. With a WHERE clause, you can set conditions
    to limit which rows you pull into your data set. (SELECT queries do NOT alter
    data. They only SHOW data based on the query.)


