    \ we built a sample DB and did some database manipulation.\n\nGreat work! Pat\
    \ yourself on the back for staying with it. Now it's time to wrap things up.\n\
    \nConclusion\n\nWhen the Apostle John ended his gospel on the Lord Jesus Christ,\
    \ he wrote: \"And there are also many other things which Jesus did, the which,\
    \ if they should be written every one, I suppose that even the world itself could\
    \ not contain the books that should be written. Amen.\"  (John 21:25)\n\nI am\
    \ by no means implying that the book you're reading right now is a gospel – not\
    \ at all!\n\nI quote that verse because writing anything that strives to lay down\
    \ foundational principles is not as simple as it seems on the surface. What do\
    \ you include? What do you exclude? When do you decide, \"OK. Let's stop here.\"\
    \ Those are not easy choices to make and if it seems we've only scratched the\
    \ surface, you're right. For Python and any other coding language, there is always\
    \ more to learn and more to discover than what you can fit in a book, explain\
    \ in a video, or teach in a course. But a good education doesn't teach you everything.\
    \ Instead, it gives you a solid foundation and teaches you how to learn the next\
    \ thing. I hope that I accomplished that for you in this book. I encourage you\
    \ to keep on learning!\n\nSo, what did we cover in the span of this book on Python\
    \ programming for beginners?\n\nWe covered Python essentials such as what is Python\
    \ and why to use it? We went over how to set up your IDE (and what an IDE is).\
    \ We talked about data types in Python, and what you'll find as you continue learning\
    \ is that much of what we covered about Python applies to other languages too.\
    \ So, I encourage you to expand your horizons and become \"multilingual\" in programming\
    \ languages."
