    \n# 编程挑战：遛狗\n\n嵌套的 \"if\" 语句在编程中非常常见。对于这个挑战，我希望你使用嵌套的 \"if\" 语句。所以，请记住你的缩进规则。你将编写的代码将检查是否可以遛狗。以下是参数：\n\
