    # Section 4: Best Practices to Minimize Debugging and Troubleshooting.


    At the beginning of this chapter, I pretty much said that bugs in your code are
    inevitable. To some extent, they are. But that doesn''t mean we cannot strive
    to write bug-free code. So, in the interest of writing clean code that is debug-friendly,
    here are some valuable tips.


    # Use Meaningful Variable Names:


    While you don''t want to be too wordy, you also don''t want to be so minimalist
    in your coding as to be cryptic. When you write your code and create variable
    names, remember the coder who has to come behind you to troubleshoot it, or add
    new features. That coder might be you! If another coder does have to pick up where
    you left off, be that person where everyone says: "They really wrote clean code!"
    Don''t be the person where everyone says: "Fix their code? It''d be easier to
    start from scratch!"


    Also, avoid single-letter variable names except where it''s standard practice
    such as in loops.


    # Modularize Your Code


    As much as possible, break your code into modular functions or classes. When you
    write your code, think in terms of reusability. Of course, there are lots of situations
    where the code you''re writing is very project-specific, but even in projects
    like that, there is an opportunity to write code that can be used elsewhere. Also,
    by following a modular approach to your coding, you''re doing yourself and others
    a favor because modularized code makes for easier debugging, troubleshooting,
    and maintenance.


    # Document Code Effectively


    If you have ever read the Lemony Snicket book series called A Series of Unfortunate
    Events, you might remember The Reptile Room where Aunt Josephine writes a page
    full of "Nevers" to warn the Baudelaire children of potential dangers.


    If I could get away with it, I''d write a page full of the words "Document! Document!
    Document!" Because I cannot emphasize enough how important code documentation
    is. I know that for programmers under pressure to produce code and meet deadlines,
    documentation sounds like a luxury, but code documentation is a huge time-saver
    in the long run. You''d be surprised how many times you return to your own code
    and wonder, "What was I thinking?" It''s even worse for others looking at code
    someone else wrote.


    Include comments to describe the purpose of functions in your code. Include comments
    within those functions that describe actions that are not obvious. Include a comment
    at the top of your code to explain the overall purpose of the file and its functions.
    Even describe assumptions, potential issues, and future plans.


    # Write Unit Tests


    Automate your unit testing as much as possible. Just be sure to include unit tests
    to catch issues early in the development process.


    # Chapter 6 Recap!


    In this chapter, we covered the very important topic of debugging and troubleshooting
    code. Of course, our goal is to make our code bug free to begin with, but as we
    said at the opening of this chapter, debugging and troubleshooting are part of
    the programmer''s life. In this chapter, we listed some common coding errors,
    how to identify them, and how to troubleshoot them. We also looked at various
    troubleshooting and debugging tools, from those included in IDEs to the debugger
    built into Python. In that section, we also discussed how to do troubleshooting,
    how to build debugging into our code, and how to understand traceback messages.
    Then we ended with some best practices for writing code that is debug friendly
    and easy to troubleshoot.


    In Chapter 7, we''re going to dive into the world of web development in Python.
    We''ll touch upon development basics, and how to use the web framework called
    Flask. By the time we''re done, you''ll have a simple weather application deployed
    to the web! See you in Chapter 7!


    Chapter 7: Web Development in Python


    In the 1931 classic Frankenstein, the defining scene is when Dr. Frankenstein''s
    creation comes to life and he begins to shout, "It''s alive! It''s alive!" Turning
    your code from concept to reality and seeing it work like you planned is a little
    like that. You run your code, it works, and you think: "It''s alive! It''s alive!"
    There''s just a certain sense of satisfaction that comes from writing successful
    code. Yet as exciting as that is, now that "it''s alive," the next step is to
    release it into the world. OK, I know, it didn''t work out so great for the monster
    but that''s fiction. Here, we''re talking real code.


    The focus of this chapter is to deploy your code to the web, but let''s take a
    brief look at other ways to deploy your code.


    You can see that classic Frankenstein scene here:


    | [http://tinyurl.com/1931M](http://tinyurl.com/1931M) |


    | --- |


    # Section 1: Ways to Deploy Your Python Code


    # Python Library


    If you''ve been following along in the book, you''ve already had experience with
    libraries. For some of our imports, we''ve used "pip install \[library name\]"
    to gain access to modules for us to use in our code. These installations pulled
    code libraries into our work. As you become more proficient with Python, you may
    find that you have scripts that you use frequently and that might be of use to
    others. Publishing your code as a code library is a great way to give back to
    the Python community. Going into the details of how to do this is outside the
    scope of this book, but if you want to pursue this, you can refer to this link:


    [https://realpython.com/pypi-publish-python-package/](https://realpython.com/pypi-publish-python-package/)


    # Pros


    Your code remains close to the original script and adds only what is needed to
    run it.


    # Cons


    Your users will need to run your code with Python. The average user will not know
    how to do this. Others may not want to install Python on their device just to
    run your code.


    # Standalone Program


    Turning your script into a standalone program is a more user-friendly approach
    to distributing your scripts. Your options include packaging your code or building
    a GUI (graphic user interface).


    # Packaging your code


    There are several tools available for packaging your code. These include


    *   Briefcase


    *   py2app


    *   py2exe


    *   PyInstaller


    # Pros


    Packaging your code eliminates most dependency issues. Your package includes an
    executable and any of its dependencies.


    # Cons


    While packaging your code can simplify distribution, using your code can prove
    difficult for many. Your code will need to run from a command prompt. Many users
    will not be familiar with how to do that or will consider it too impractical when
    other apps they have can run using a GUI.


    # Building a GUI


    A GUI, or graphic user interface, is familiar to most users. The average user
    already understands how to use an application in this way. Some of the packages
    that help you build a GUI for your app include:


    *   TKinter


    *   wxPython


    *   PySimpleGUI


    # Pros


    A GUI makes your application accessible to a much broader audience.


    # Cons


    Your users will need to figure out what version of your application will work
    on their OS, and they will have to download and install your program. While this
    is not a problem for most users, if your app needs to run on a particular version
    of a given OS, some users may have difficulty determining what OS version they
    have and could run into installation issues.


    # Python Web Application


    The most popular way to deploy your Python app to a large audience is by turning
    it into a web application.


    # Pros'
