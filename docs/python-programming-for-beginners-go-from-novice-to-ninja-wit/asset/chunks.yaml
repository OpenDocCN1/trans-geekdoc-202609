    ```python

    weekdays = ("Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday",
    "Saturday")

    ```


    `"Sunday"` 在索引 0，因为所有索引都从 0 开始。""Saturday"` 在索引 6。我们将其作为终点，是因为我们想要 "Friday"，所以我们在它之后放置了索引，因为结束索引是不包含的。“步长”将从起始索引开始，由于它设置为
    "2"，它将为我们提供每两个项目：周一、周三和周五。


    当你对 `list` 或 `tuple` 等对象进行切片时，对象本身不会发生变化。


