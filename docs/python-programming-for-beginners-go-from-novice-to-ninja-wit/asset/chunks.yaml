    # Why is this important?


    Wide range of opportunities. Because Python is not locked into one industry and
    is easily adaptable, learning Python opens a wide range of opportunities for you
    as a Python programmer. With that skill set, you can easily transition from one
    industry to another.


    Cross-domain solutions. Because Python can easily transition between industries,
    it can also provide solutions to many different industries. It also plays well
    with others, meaning it can be combined with other platforms, making it highly
    scalable.


    # It is a High-level Language


    A high-level language is a computing language that “abstracts” many of the lower-level
    details such as memory management. Think of it this way: You don''t have to think
    about keeping your heart rate at a healthy level. Your brain handles that automatically
    so you can do more important stuff like worry about how you''re going to pay this
    month''s electric bill.


    # Why is this important?


    You can focus on problem-solving. Because Python allows you to do programming
    at a high level, you can focus on problem-solving a specific task without having
    to worry about things like memory leaks, or how your code is going to communicate
    with your computer''s hardware. Python does all that for you seamlessly.


    # It has a Large, Active Community


    When it comes to Python, you are never alone on your development journey. Because
    it is open-sourced, tools, libraries, forums, and resources to answer your Python
    problems are everywhere.


    # Why is this important?


    Abundance of resources. Whether you''re going to a forum like Stack Overflow,
    or tapping into open-source libraries like GitHub, Python''s community of developers
    provides ample resources to draw from.


    # Setting Up Python


    If you''re going to start using Python, you need to have it set up on your machine.
    Python is available across many platforms. For this book, I''ll give you instructions
    for Windows, macOS, and Linux. Other than the differences in how to set up Python
    on your OS, all other Python steps you learn will apply to you regardless of your
    OS.


    As of this writing, there are two versions of Python available: Version 2 and
    Version 3. Version 2 is the legacy version and is no longer actively supported.
    Please use Version 3 as this is the one actively supported and the one we''ll
    be using in this book.


    # Installation


    Just in case, it''s good to check if you have any versions of Python on your machine
    now. To do this, go to the command prompt on your machine. In Windows, if you
    type CMD in the search section of your taskbar, and press ENTER, you''ll see the
    command prompt. In macOS and Linux, the command prompt is referred to as “the
    terminal.”


    In the command prompt, type python --version


    That''s “python”, followed by a space, two dashes, and the word “version” right
    after the dashes. Now press ENTER. If you do not have Python installed, you''ll
    see a “Python not found error.” If you do have Python installed, make a note of
    the version. You might need to upgrade your Python version unless you have a compelling
    need not to.


    You Windows users might notice that if you just type “python” at the command prompt
    and press ENTER, the Windows store will open. While you can install Python that
    way, I recommend that you do not. Follow the instructions below instead.


    # Installation steps for Windows


    Step 1: In your browser, navigate to python.org. It will take you to a site that
    looks like this:


    ![A screenshot of a computer Description automatically generated](image_rsrc3GD.jpg)


    When you hover over the Downloads menu, the site will attempt to show you the
    version best suited to your OS. If for some reason, that is incorrect, click on
    All releases, or on the platform that matches what you are using. Be sure to download
    the stable release version of Python, not any of the beta versions. This book
    will be using the latest available stable release version at the time of this
    writing.


    Step 2: Once you have downloaded the Python installation file, open it, and follow
    the prompts. You''ll see a screen like this:


    ![A screen shot of a computer Description automatically generated](image_rsrc3GE.jpg)


    Step 3: Be sure to put a checkmark in the two boxes at the bottom of the install
    screen before proceeding. “Admin privileges” will make sure you can install the
    software without any user issues. The “Add to path” option will make sure that
    your OS knows where to find the executables for the Python software.


    Step 4: Click the “Customize installation” option on the installation screen.


    *   Leave the “Optional Features” as they are and then click “Next.”


    *   In the “Advanced Options” section, put a checkmark where it says “Install
    Python X.XX for all users” where the X''s represent your version number.


    *   The program will install to the default path on your machine. Only change
    this if you have good reason to do so.


    *   Click “Install.”


    On Windows you may be asked if you want to proceed with the installation, just
    choose “Yes.”


    # Installation steps for macOS


    Step 1: Open your terminal.


    Step 2: Install Homebrew if you don''t already have it.


    You can install Homebrew by running \`/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"\`


    Step 3: Install Python 3 by running \`brew install python3\`


    # Installation for Linux (applies to Ubuntu and Debian)


    Step 1: Open your terminal.


    Step 2: Use this command to update your package list: \`sudo apt update\`


    Step 3: Install Python 3 by running: \`sudo apt install python3\`


    # Check your installation


    To make sure Python installed correctly, go to the command prompt (or terminal
    and again run this command: python --version


    You should see a prompt showing you what version of Python you have installed.


    # Test Run


    From the command prompt (terminal) run this command:


    Python


    You should see another prompt known as the Python interpreter appear in the command/terminal
    window. Now type this and then press ENTER:


    print("Hello, Python!")


    It should respond with: Hello, Python!


    To get out of the Python interpreter type exit() or press CRL+Z and then press
    ENTER. That will return control to your command/terminal window.


    # Development Environment (IDEs)


    While you can create Python programs using a simple text editor, most developers
    prefer to use what is called an Integrated Development Environment or IDE. IDE''s
    can help you with syntax, bug fixing, coding hints, and more. Popular Python IDEs
    include Python and Jupyter Notebook. However, I prefer to use Visual Studio Code
    because it can support multiple coding languages, it''s popular among developers
    in general and provides a more robust coding environment.


    # Installing Visual Studio Code


    Step 1: Visit Visual Studio Code''s website:


    ([https://code.visualstudio.com/](https://code.visualstudio.com/))


    Step 2: Download the version that applies to your operating system.


    Step 3: Open VSCode and optionally install the Python extensions. For complete
    instructions for this step, go to this link:


    [https://code.visualstudio.com/docs/python/python-tutorial](https://code.visualstudio.com/docs/python/python-tutorial)


    Throughout this book, we will be doing our coding examples in VSCode. However,
    you are free to use whichever IDE you prefer. And now that you have completed
    your setup, you''re ready to get started on your Python programming journey! Let''s
    Go!


    # Your First Python Program!'
