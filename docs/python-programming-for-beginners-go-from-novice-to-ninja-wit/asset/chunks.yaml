    This is creating something called an "instance." In this case, we are creating
    an instance of the "TK" class which represents the main window for our application.
    We''ll get more into this when we cover Object-Oriented Programming, but the "Tk"
    class is the blueprint for an application''s main window. The "window" variable
    is an instance of that class, meaning we used the blueprint to build an application
