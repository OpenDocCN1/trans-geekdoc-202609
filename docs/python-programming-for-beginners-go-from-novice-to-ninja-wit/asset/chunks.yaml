    Line 5: This gave you the whole number `5`.


    Line 6: This gave you the float number `5.0` because floats always have decimals.


    Line 7: This gave you a float result. Why? Because when you do operations where
    types are mixed, the result will be promoted to the higher type. Integers are
    a basic type. Floats are a higher-order type (for lack of a better term).


