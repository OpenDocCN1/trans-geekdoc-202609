    4 Data Structures in Python


    Python''s data structure capabilities are powerful enough to handle everything
    from simple to-do lists to complex data management. In this chapter, we''ll be
    diving into Python''s data structures.


    # Section 1: Lists and Tuples


    # Understanding Lists and Tuples


    You have already seen these by this point in the book, but let''s take a deeper
    look.


    In Python, lists and tuples are data objects that can store collections of items.
    Both have something called an "index" that identifies each item in the collection.
    The index in these objects starts at 0, meaning if you want to get the first item
    in a list or tuple, you would ask for the item at index 0: print(my\_list\[0\]).
    Both lists and tuples maintain order, can be sorted, and can contain heterogeneous
    collections, meaning that a single list, for example, can contain strings, integers,
    and floats at the same time.


    Lists are mutable, meaning you can change them at any time. Tuples are not. For
    example, if you were building a task manager app, you could use a list to store
    tasks because tasks can change at any time:


    task = \[\]


    But let''s say you''re building a scheduling program, and you need to maintain
    a collection of weekdays. Since the names for the days of the week don''t change,
    you''d want to use a tuple:


    weekdays = (''Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday",
    "Saturday")


    # Indexing, Slicing, and Manipulating Data


    # Indexing


    As already mentioned, you can get to any single member of a list or tuple using
    an index. But there may be times when you want more than one but not all the items
    from the list or tuple. "slicing" lets you do just that.


    # Slicing


    To slice a list, tuple, or string, you specify the starting index and the ending
    index. You can also include an optional ''step" that indicates what you want to
    skip within the slice. The syntax looks like this:


    sequence\[start:end:step\]


    "sequence" is the name of the sequence you want to slice. From our earlier tuple
    example, we had a sequence called "weekdays."


    "start" is the beginning index for the section you want. The start is inclusive,
    meaning it is considered part of the slice.


    "end" is the last index of the section you want. The end is exclusive, meaning
    it is not included in the slice. The example below will help to illustrate this.


    Using our scheduling program scenario, let''s say you''re using it to keep track
    of a class schedule. "Underwater Basket Weaving" meets on Monday, Wednesday, and
    Friday. To get just those days from your "weekdays" variable, your code would
    look like this:


    class\_days = weekdays\[1:6:2\]


    Remember, we declared our weekday sequence like this:


    weekdays = ("Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday",
    "Saturday")


    "Sunday" is at index 0 because all indices start with 0. "Saturday" is at index
    6. We''re making that our endpoint because we want "Friday," so we have put the
    index after it because the end index is exclusive. The ''step" will begin at the
    starting index, and because it is set to "2," it will give us every second item:
    Monday, Wednesday, and Friday.


    When you slice an object like a list or tuple, nothing happens to the original
    object. Our "weekdays" list is still intact, but now we have a new "class-days"
    list.


    # Data Manipulation


    # Appending Data


    Because lists are mutable, you can add to them using the "append()" method. For
    instance, if you had a grocery list and you needed to add items to it, you could
    do this:


    fruits = \["oranges", "apples", "cherry"\]


    fruits.append("grapes")


    # Modifying Data


    Because lists have indices, you can modify items at a given index in your list.
    For example, let''s say that in our fruits list, we don''t want cherries, we want
    strawberries. In our code we could do this:


    fruits = \["oranges", "apples", "cherry"\]


    fruits\[2\] = "strawberries"


    # Removing Data


    To remove something from a list, there are two options: "remove()," or "pop()."
    The "remove" method will remove a specific list element while "pop" will remove
    an item at a given index.


    fruits.remove("apples") or fruits.pop(1)


    Notice that we''ve only been talking about manipulating lists. With tuples that
    is not possible. If we tried the "remove" or "pop" methods with our "weekdays"
    tuple, we''d get an error and that''s because tuples are immutable. They are meant
    to remain constant throughout your code and for some collections, that is what
    you want.


    # Section 2: Dictionaries and Sets


    Like tuples, dictionaries and sets are indexed using keys for easily retrieving
    information from complex data sets. They are also crucial to complex data organization.


    # Exploring Dictionaries and Sets


    # What Are Dictionaries?


    Dictionaries are a data structure that stores information in key-value pairs.
    Unlike lists or tuples, dictionaries are not ordered. It''s not necessary since
    you can retrieve what you need from a dictionary using a key rather than an index.
    The keys in the key-value pair must be unique but the data in a key-value pair
    can be of any type. One dictionary can have multiple data types inside it. Another
    important fact about dictionaries is that they are mutable, meaning they can be
    changed after being created.


    # What Are Sets?


    Sets are collections of unique elements. Like dictionaries, sets are mutable.
    To add to a set you use the "add()" function. To remove something from a set you
    use the "remove()" function. Also, like dictionaries, sets can contain multiple
    data types – as long as the data types themselves are immutable. So, you can have
    strings, numbers, and tuples in a set because those types are immutable, but you
    cannot have other sets or lists in a set because those data types are mutable.


    Sets are not ordered, they do not have an index, and they do not have key-value
    pairs. So, you cannot access an individual member of a set. What you can do is
    check if something is a member of a set.


    my\_set = {1, 2, 3}


    if 2 in my\_set:


    print("2 is in the set")


    The strength of a set is its ability to enforce uniqueness. For example, if you
    tried to create this set:


    my\_set = {1, 2, 2, 3}


    Python would still compile the code without error, but the set object would automatically
    exclude the duplicate "2" so that the set would only contain {1, 2, 3}.


    # Using a Dictionary.


    Let''s create a small contact management system using dictionaries. In our contact
    management system, we want to keep track of students. So, we have their name,
    email, phone, and GPA. We want to manage several student records, so the plan
    is to make a dictionary of dictionaries. So, that means I''ll have an outer dictionary
    and an inner one. For the outer dictionary, we''ll use student IDs for the key.
    The value attached to the key will be the dictionary holding each student''s information.


    ![Nested dictionary example](image_rsrc3JG.jpg)'
