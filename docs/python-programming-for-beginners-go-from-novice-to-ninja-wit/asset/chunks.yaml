    \ vertically. This simple example only prints the items, but any number of actions\
    \ could have been taken on the items in the list. The loop knows to start at the\
    \ beginning of the list and continue to the end unless a condition inside the\
    \ loop instructs it to stop.\n\n## The While Loop\n\nLike the \"for\" loop, the\
    \ \"while\" loop is an iterative function. Unlike the \"for\" loop, however, a\
    \ \"while\" loop will continue as long as the condition remains true. The syntax\
    \ for \"while\" loop looks like this:\n\n```python\nwhile condition:\n    # Code\n\
    ```\n\nTo better understand this, let's look at an example:\n\n![While example](image_rsrc3HS.jpg)\n\
    \nFirst, Line 2 sets a counter. \"While\" loops do not always have to be set,\
