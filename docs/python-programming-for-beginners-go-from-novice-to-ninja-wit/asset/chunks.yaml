    测试完 Web 应用后，你可以关闭页面，并在终端窗口中按 `CTRL+C` 停止本地主机。


    # 第六步：部署到 Git


    本节将引导你将工作部署到 GitHub。你需要一个 GitHub 账户来完成此操作。如果你没有 GitHub 账户，你需要访问此网站：[`github.com/`](https://github.com/)


    从那里，按照提示创建一个免费账户。（如果你愿意，也可以创建一个付费账户，但这取决于你的个人。）


    ## 在你的机器上安装 Git


    在尝试在你的机器上安装 GitHub 之前，先检查是否已经安装了它。


    **Windows 用户**：以管理员模式打开命令提示符，然后在提示符处输入：`git version`。如果你的机器上安装了 git，它会显示你已安装的
    git 版本。如果你的机器上没有 git，你将看到某种错误信息，说明它是一个未知命令。


    如果你没有安装 git，可以去这里：[`gitforwindows.org/`](https://gitforwindows.org/)


    安装程序将为你提供最新版本的 git，其中包含命令行版本和 GUI 界面版本。


    **Mac 用户**：大多数 MacOS 版本都已预装了 git。你可以从终端运行 `git version`（不带引号）进行检查。如果由于某种原因你没有
    git，你也可以访问此网站下载最新版本：[`sourceforge.net/projects/git-osx-installer/files/git-2.23.0-intel-universal-mavericks.dmg/download?use\_mirror=autoselect`](https://sourceforge.net/projects/git-osx-installer/files/git-2.23.0-intel-universal-mavericks.dmg/download?use_mirror=autoselect)


    在 Mac 上安装 git 的另一种推荐方法是访问该网站并按照那里的安装说明进行：[`sourceforge.net/projects/git-osx-installer/files/git-2.23.0-intel-universal-mavericks.dmg/download?use\_mirror=autoselect`](https://sourceforge.net/projects/git-osx-installer/files/git-2.23.0-intel-universal-mavericks.dmg/download?use_mirror=autoselect)


    ## 初始化本地仓库


    在应用程序文件夹内部的终端窗口中运行以下命令：


    ```bash

    git init

    ```


    当你运行此命令时，你的 `.env` 和 `.venv` 文件应该显示为灰色。如果不是，请确保将它们添加到 `.ignore` 文件（注：此处通常为 .gitignore）中。你需要这样做是因为这些文件包含了你在部署代码时不希望在
    GitHub 上公开共享的数据。


    你想要添加到 `.gitignore` 文件中的另一个内容是 `__pycache__` 文件夹。（文件夹名称两边各有两个下划线）。当你向应用程序添加模块时，该文件夹会自动创建。这不是你希望发布到
    GitHub 的内容。


    ## 更新你的仓库


    一旦一切都准备就绪且你的 `.gitignore` 文件已更新，就是时候将所有内容添加到你的仓库中，为部署到 GitHub 做准备了。


    ### 将你的文件添加到仓库


    要将所有文件添加到本地仓库，请运行此命令：


    ```bash

    git add .

    ```


    点 `.` 指令 `git` 将所有文件添加到你的仓库。当你执行此操作时，你会发现带有 "U" 字（已更新）的文件将变成 "A" 字（已添加）。你还会发现你添加到
    `.gitignore` 文件中的文件被忽略了，它们旁边没有字母。


    ### 提交你的文件


    下一步是将你的文件提交到仓库。要执行此操作，请运行命令：


    ```bash

    git commit -m "first commit"

    ```


    `-m` 标志代表 "message"消息），在你进行的每一次提交中添加一条消息是一个好主意，这样你就对你所做的每项更改都有一份运行中的注释。消息不需要超级详细，只需要足够的细节来提醒你在特定提交期间做了什么。在运行命令后，你将看到
    `git` 提交到仓库的项目列表。


    ## 将你的文件添加到 GitHub


    要执行此操作，你需要登录你的 GitHub 账户并创建一个新的 GitHub 仓库。这是你发送本地仓库文件的地方。


    ### 点击 New（新建）


    ![一张自动生成的计算机描述截图](img/image_rsrc3MU.jpg)


    当你点击 "New" 时，你会来到一个新屏幕，在那里看到你的账户列为仓库所有者。


    ### Choose a Repo Name（选择仓库名称）


    ![一张自动生成的计算机描述截图](img/image_rsrc3MV.jpg)


    在“Repository name”（仓库名称）下输入你喜欢的名称。如果名称可用，GitHub 将在名称字段下方用绿色字体显示。如果由于某种原因你选择的名称不可用，只需选择另一个。


    ### Public or Private（公共或私有）


    在你输入仓库名称的区域下方有将仓库设为公共或私有的选项。


    ![一张自动生成的白色背景黑色文字描述](img/image_rsrc3MW.jpg)


    ### Create Repository（创建仓库）


    完成上述步骤后，点击底部的 "Create Repository"。


    ### 获取 Git 命令


    在下一个屏幕上，你会看到一个复制图标。


    ![一个白色的框](img/image_rsrc3MY.jpg)


    ### 运行复制的命令


    现在，回到 VSCode 或你选择的 IDE，并在终端中粘贴命令。要在 VSCode 终端中这样做，只需右键点击（CTRL+V 可能无效）。


    前两个命令将运行。它会在第三条命令处暂停并等待你按 `ENTER`。


    # 第七步：部署到网络


    我们将使用 Render.com 将天气应用部署到网络。你可以设置一个免费账户。我们使用它是因为它可以从 GitHub 直接拉取文件。为了方便，我使用了 GitHub
    账户登录，但你也有其他选项。


    ![一张自动生成的截图](img/image_rsrc3MZ.jpg)


    ### Start a New Service（启动新的 Web 服务）


    登录后，你会来到 Render 面板。点击 "New" 按钮并选择 "Web Service"。


    ![一张自动生成的截图](img/image_rsrc3N0.jpg)


    ### Import Your Files from Git（从 Git 文件文件）


    在屏幕上，选择 "Build and deploy from a Git repository"从 Git 仓库构建并部署）。然后点击 "Next"。


    ![一张自动生成的截图](img/image_rsrc3N1.jpg)


    ### Connect Your Git Repository（连接你的 Git 仓库）


    在接下来的屏幕上，系统将提示连接你的 GitHub 账户以便拉取文件。


    ![一张自动生成的截图](img/image_rsrc3N2.jpg)


    在下一个屏幕上，你将有权选择所有的 GitHub 仓库或只选择一个。如果你有多个仓库且只想使用用于项目的仓库，请使用 "Only select repositories"（仅选择仓库）选项。


    ![一张自动生成的截图](img/image_rsrc3N3.jpg)


    当你选择第二个选项时，你会看到一个下拉按钮，可以在其中选择想要拉取的仓库。


    ![一张自动生成的截图](img/image_rsrc3N4.jpg)


    选择你的仓库后，点击 "Install"。


    ![一张自动生成的截图](img/image_rsrc3N5.jpg)

