- raw: '*   SQLite is a serverless, lightweight, and self-contained DB that is best
    suited for small to medium-sized projects and applications where simple and minimal
    configuration is key. SQLite is great for local storage applications, mobile apps,
    and desktop software.


    *   MySQL is an open-source relational database management system (RDBMS) that
    is good for large-scale operations and websites. It is known for its scalability,
    uses a client-server architecture, and allows for multiple-user access. You typically
    see this kind of DB in content management systems (CMS), web applications, and
    large-scale corporate environments.


    *   PostgreSQL, like the other two, is also open source. It is known for its extensibility,
    scalability, and SQL compliance, and is well-suited to large-scale applications.
    It is often used for projects requiring advanced features such as data warehousing
    and large-scale information systems.


    NoSQL Databases:


    These are DBs that do not follow the structured database model. Two popular NoSQL
    database systems include MongoDB and Redis.


    *   MongoDB is document-oriented and stores data in BSON documents, which are
    similar to JSON documents. (Our weather app uses JSON documents for its data.)
    Because it is schema-less, it is well-suited to data environments that are more
    dynamic and less structured. You would most likely find this kind of DB in use
    on social media platforms and real-time analytics tools.


    *   Redis uses an in-memory key-value model. It is often used as a caching mechanism
    for fast data retrieval. It''s well-suited for applications requiring real-time
    information such as gaming or messaging apps. While that description may give
    the impression that its memory is volatile (meaning what it stores immediately
    vanishes when the app is done), by default, it is configured to use "snapshotting"
    and "append-only file" (AOF) for long-term storage to disc.


    # Five Things to Consider When Selecting a Database for Your Python Application:


    As you can tell from the previous discussion, there is no one answer to the question:
    "What is the best database to use with Python?" The best answer to that is, "It
    depends." Here are five things to consider:


    # One: Data Structure and Complexity


    If you know your data will have (or need) well-defined structures and relationships,
    a relational database system makes the most sense. If your data is more fluid
    and prone to change, a NoSQL database is the better choice.


    # Two: Scalability Requirements


    If you anticipate your project will experience significant growth in the future,
    consider using a DBS that can scale with your demand. Using a DB that is less
    scalable and simpler to use may seem like a good idea at first, but having to
    scramble to keep up with growth and migrate to a more robust system can prove
    problematic.


    # Three: Community and Support


    What sort of community and support is behind the DB system you''re considering?
    Good community support means access to resources, know-how, and quicker bug fixes.
    You want your project married to a stable database system, not the crazy cat lady.
    (Apologies to any non-crazy cat ladies.)


    # Four: Project Size and Complexity


    Size and complexity do not necessarily go hand in hand. You might have a large
    project that only needs a simple database. Larger, more complex projects might
    need the advanced capabilities of something like PostgreSQL. Others may not.


    # Five: Integration with Python


    Make sure that the database you choose to work with Python has a Python driver
    that is well-supported. There may be situations where you''re asked to work with
    an established DB and changing DBs is out of the question. While you might be
    able to make a tailor-made connection between Python and that DB, keep in mind
    that you will have to be able to maintain that connection over time. That would
    include keeping it working through upgrades in both Python and the given DB. If
    the DB cannot be changed, you may need to consider a solution other than Python.
    Because, ultimately, your goal is to have your application and your DB work together
    seamlessly.


    # Section 2: Basic SQL CRUD Operations


    CRUD stands for "Create, Read, Update, and Delete." These are standard operations
    in SQL. Technically, "create" is for INSERT statements, and "read" is for SELECT
    statements, but that would spell "ISUD" and who would remember that?


    CRUD operations apply to both RDMS (relational database management system) and
    NoSQL databases. However, NoSQL CRUD commands vary from system to system. Some
    NoSQL DBs use a query language similar to SQL, while others handle them with built-in
    functions. The examples shown below are for RDBMS systems (CrowdStrike, 2023).


    Create (Insert):


    INSERT INTO <table name> VALUES (field value 1, field value, 2…)


    Read (Select):


    SELECT field 1, field 2, …FROM <table name> \[WHERE <condition>\]


    The "WHERE" clause is optional and is used to apply search conditions to pull
    a specific set of records.


    Update:


    UPDATE <table name> SET field1=value1, field2=value2,… \[WHERE <condition>\]


    The "WHERE" clause here is technically optional but usually a good idea so that
    you don''t accidentally update more records than you planned. Also, it''s good
    practice to run a SELECT statement first and then turn it into an UPDATE statement
    to be sure you''re only affecting the records you mean to affect.


    Delete:


    DELETE FROM <table name> \[WHERE <condition>\]


    As with the UPDATE statement, the "WHERE" clause is optional but usually a good
    idea. It''s also good to run a SELECT query first before turning it into a DELETE
    query just to be sure you don''t accidentally delete more than you planned. Does
    it happen? Yes. I know of a situation where a terabyte of information was deleted
    by an incorrect deletion action. You don''t want to be that guy. That guy didn''t
    want to be that guy.


    # Section 3: Database Example


    This section walks you through connecting Python to a database and performing
    simple CRUD actions. As always, I encourage you to write the code as you read
    through the steps. However, if you prefer, you can download the completed code
    using the link at the end of the [Answer Key](#part0018.xhtml#a3D2) section.


    # To Run This Code


    If you want to run this code, you will need to install MySQL Server on your machine.
    If you are not comfortable with doing that, you can still follow along through
    the code and learn how to connect and interact with a DB in Python. You will just
    not be able to perform the database actions.


    # Installing MySQL Server


    Please read all these steps BEFORE downloading or installing anything so you know
    what is involved.


    # For Windows


    Download the MySQL Server installer from here:


    [https://dev.mysql.com/downloads/installer/](https://dev.mysql.com/downloads/installer/)


    As of this writing, when you get to the installer page, there are two "flavors."
    I went with the smaller one. After clicking that link, you''ll be prompted to
    open a free Oracle account. You don''t have to open an account. You can click
    the link that says: "No thanks, just start my download" instead.


    After downloading the installer, open it and follow the prompts.


    # Installing MySQL Server for Other Operating Systems


    If you want to install MySQL Server for a different OS, please go to this link
    and follow the instructions there:


    [https://dev.mysql.com/doc/refman/5.7/en/installing.html](https://dev.mysql.com/doc/refman/5.7/en/installing.html)


    # For All Systems


    # Choosing a MySQL Server Setup Type


    To save space on my machine, I chose the "Server only" option. You can choose
    the full setup if you prefer. From there, continue following the prompts.


    # Type and Networking


    For "Config Type" I chose "Development Computer." I left everything else at the
    default settings.


    # Authentication Method


    I opted for the recommended setting.


    # Accounts and Roles


    Enter a password and save it somewhere!'
