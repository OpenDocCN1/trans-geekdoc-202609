    # 缩进规则与最佳实践


    那么，我们如何避免格式错误（以及挫败感）呢？在格式化代码时，有几点需要注意。


    ## 空格至关重要


    Java 等语言不在乎空格。对于 Python 来说，空格是正确格式的关键。缩进使用空格和制表符（tabs）。为了保持一致，最好使用制表符，并在代码编辑器中将制表设置为四个空格。这是
    Python 开发社区的常见做法。你可以混合使用空格和制表符，但这会导致格式粗糙、不一致以及代码难以阅读。


    ## 缩进级别非常重要


    在缩进代码块时要保持一致。代码块的缩进是优秀 Python 代码的标志，这也是它如此易读的原因。每一级缩进都使用四个空格。


    ## 代码块由缩进定义


    在 Python 中，条件、循环和函数定义等代码块是由缩进定义的。由于这条规则，不需要使用大括号等符号来识别和定义代码块。只需通过观察代码的形状，就能清楚地看出代码块。Java
    程序员可能会想：“我们也使用缩进。”是的，我们使用，但那主要是出于习惯俗例。在 Python 中，缩进是强制执行的。如果忽略了 Python 的缩进规则，将在运行时导致错误。


    ## 样式是灵活的，但存在标准


    `PEP8` 是 Python 的风格指南，也是涉及最佳实践的终权威资源。关于缩进使用四个空格的建议就源于这本指南。如果你正在使用 IDE，并且它已配置为使用
    Python 规则，它将帮助你保持代码格式正确。大多数 IDE 会会在你出现语法或格式错误时标记你的代码，以便你在运行前进行纠正。默认情况下，大多数 IDE
    已经将制表设置为四个空格。


    ## 冒号符号表示代码块的开始


    正如前面提到的，缩进代码块的开始由冒号指示。你会在 `if`、`else`、`for` 和 `while` 等语句的末尾看到它们。你也会在函数定义中使用它们。下面是一个函数定义的示例。


