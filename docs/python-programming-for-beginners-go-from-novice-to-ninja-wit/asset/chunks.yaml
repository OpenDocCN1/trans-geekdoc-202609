    \n# 3 构建 Python 函数\n\n假设你参加一个朋友聚会。你正在聊天、吃东西，玩得很开心，这时聚会的主持人拿着一个纸箱走出来：“嘿，我这有一个拼图。”他高举着盒子，现在没人能看到里面。他摇了摇盒子说：“我有这玩意儿好段时间了，但因为丢了带图片的封面，一直没拼好。我想它应该是秋天里被树木环绕的老房子。你们想试一下吗？”\n\
    \n起初有些犹豫，但随后有人说：“好，为什么不呢？”于是，你的朋友把盒子里的东西倒在桌子上，你们都围了过来。\n\n在处理代码时，你可能会收到一个编程难题。问题可能定义得很清晰，也可能不是。\n\
    \n当你拼图时，你可能有盒子的封面，也可能。无论哪种情况，第一步通常是将碎片按逻辑分组进行组织：“天空”碎片放在一组，“地面”碎片放在另一组，也许在每个角放置角碎片，等。编程中的函数有点像这个过程。当你编写它们时，它们需要解决问题，但就像拼图任务中的“角”碎片一样，函数被设计用来处理问题的特定部分。\n\
    \n在“构建 Python 函数”这一章节中，我们将学习如何定义函数、如何构建它以及如何将其特定任务。\n\n## 第 1 ：定义函数\n\n### 什么是函数？\n\
    \n“Python 函数是一个组织良好、可重用的代码块，用于执行单一的操作。函数为你的应用程序提供了更好的模块化和高度的代码重用性。”(Python - Functions,\
    \ n.d.)\n\n在我在本节审查的定义中，我喜欢这一个，因为它涵盖了构成良好的 Python 函数的主要特征：\n\n*   **组织性 (Organization)**：函数的设计是为了保持代码组织良好、逻辑且清晰。\n\
    *   **单一性 (Singularity)**：你写的每个函数都应该定义一个清晰且单一的动作。\n*   **模块化 (Modularity)**：虽然这听起来很像单一性，但函数的这个功能体现了编码哲学。当你编写代码时，你需要以模块的方式思考，这些模块组合形成整体。这有点像使用乐高®\
    \ 积木工作。\n*   **可重用性 (Reusability)**：这是建立在模块化想法之上的。函数旨在被重用。就像你可以用乐高® 积木造消防车一样，你也可以用它盖房子。\n\
    \n好了，现在我们已经定义了什么是函数，让我们定义一个自己的函数吧。\n\n### 函数语法\n\n基本的函数语法应该是这样的：\n\n![演示基础 Python\
