    *   INSERT INTO is the command that inserts new records into a database table.
    In the INSERT clause, you name the fields (columns) you are affecting. Columns
    that are not required do not have to be named in the INSERT.


    *   The VALUES clause represents the values you are putting into the record and
    must match the number, data type, and position of the columns named in the insert
    clause.  So, for example, if I have a table with columns A, B, C, and D where
