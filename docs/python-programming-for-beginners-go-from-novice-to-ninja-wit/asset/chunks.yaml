    \ increment operator `+=`. There are other similar: `-=` times-equals `*=` and\
    \ divide-equals `/=`.\n\n# Infinite Loops\n\n\"While\" loops can be set to run\
    \ \"forever\" if you fail to put a proper check. For example, if you left out\
