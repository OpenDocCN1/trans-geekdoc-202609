    # Data Selection and Indexing


    In our data sample, we have book titles and sales revenue data. Let''s say we
    just want to know what titles are seeing $500 or more in monthly sales. We know
    that book titles live in a column called ''Book Title'' and that sales revenue
    data lives in a column called ''Sales Rev.'' Since we only want to see titles
    with greater than $500 in monthly sales, we need to filter the data to give back
    only those rows. So, add this to your code:


    filtered = data\[data\[''Sales Rev.''\] > 500\]


    To cut down on clutter, comment out lines 5, 7, 9-11. Your code should look something
    like this:


    ![A screenshot of a computer code Description automatically generated](image_rsrc3NE.jpg)


    Line 13: The data type on the "filtered" variable is called a Pandas DataFrame.
    Within that data frame we are telling our code to only keep records where sales
    revenue is greater than $500.


    Now we need to see the results of that filter and the titles of those books. Add
    these two lines to your code:


    ![](image_rsrc3NF.jpg)


    Line 16: Our "filtered" variable still contains all the columns from our CSV file,
    but only the records that meet our criteria. However, we do not want to see all
    the columns, just "Book Title" and "Sales Rev.", so we''re telling the dataframe
    to show only those two columns.


    Save your code and run it to see the results.


    # Data Cleansing


    When dealing with large sets of data, data integrity issues are not uncommon.
    These methods in the Pandas library can help with that: dropna() and fillna().


    | Aspect || dropna() || fillna(0) |


    | --- | --- | --- |


    | Handling of Missing Values || Removes entire rows if any value is missing. ||
    Replaces missing values with a specified value. |


    | Effect on DataFrame Size || May reduce the size of the DataFrame. || Keeps the
    same number of rows. |


    | Preservation of Data || Loses data in rows with at least one missing value.
    || Keeps all rows, introducing a default value. |


    | Use Case || Suitable when working with complete cases is critical. || Suitable
    when replacing missing values with a default value is preferred. |


    | Handling Non-Numeric Data || Works well with both numeric and non-numeric data.
    || More suitable for numeric data; may need adaptation for non-numeric data. |


    (ChatGPT, n.d.)


    # Dropna()


    Let''s say that in our data sample, we had rows that were missing data, and we
    cannot use incomplete rows. By default, dropna() has its axis value set to zero(0)
    and deletes rows. This line of code would remove any rows that had at least one
    field that was absent of data or null. In Python, absent or null data is referred
    to as NaN.


    clean\_data = data.dropna()


    It can be set to delete columns instead if written this way:


    clean\_data = data.dropna(axis=1)


    # Fillna()


    This method fills NaN fields with a specified value. This might be useful in situations
    where you want to keep all the rows and filling the NaN fields will not interfere
    with how your data is processed.


    For example, let''s say you have a production signal that is sent to a plant to
    create widgets. The standard operating procedure is to put a 0 in for locations
    not receiving any widgets from the plant. However, the person in charge of creating
    the plant signal accidentally left the quantity field empty for location X. It
    is now NaN. Location X is not supposed to get any widgets, but the empty field
    stops the signal from going through to the plant, and this stops all production.
    Fortunately, the program that handles all of this runs on Python and you just
    finished reading this paragraph about fillna(). You realize defaulting NaN fields
    to 0 will not harm anything. In fact, it would save the day. So, you run this
    line of code to fill the data set:


    fill\_data = data.fillna(0)


    Now, the quantity field for location X is 0 instead of NaN. The signal goes through,
    and the plant can continue production. You just saved the company millions! Your
    manager is elated and says that you''re getting a Starbucks gift card in your
    pay envelope this week. You don''t like Starbucks, but you''re a team player.
    So, you smile and say, "Thanks!" Because it''s not about the money. It''s about
    the satisfaction that comes from solving a problem and saving the day! (Wink!
    Wink!)


