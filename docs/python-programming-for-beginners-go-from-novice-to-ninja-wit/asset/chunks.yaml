    CSV 列”（Align CSV Columns）选项，每一列都将对齐，使数据更具可读性。你可以通过选择“缩小”（Shrink）选项来取消对齐。


    # 列出你数据中的列


    有时你只想查看代码中存在哪些列，以便了解数据涵盖的内容。要查看数据中存在哪些列，请在代码中添加以下几行：


    ![一张自动生成的数学方程描述特写，置信度中等](img/image_rsrc3NC.jpg)


    列出列的另一个原因是你可以看到 `Python` 看到这些列的方式。如果你安装了 `Rainbow CSV`，请在 `VSCode` 中打开 `BookData.csv`
    文件。在屏幕底部点击“对齐”（Align）选项并保存 `CSV` 文件。


    ![一张自动生成的计算机截图](img/image_rsrc3ND.jpg)


    现在返回并运行你的 `panda_data.py` 代码，并查看列名列表。例如注意 ''Book Title''（书名）列。现在的标题中有很多空格，这就是
    `Python` 看到它的方式。现在，回到 `csv` 文件，点击页面底部的“缩小”（Shrink）选项，并再次保存文件。重新运行 `panda_data.py`
    代码并查看列列表。空格消失了，这就是现在 `Python` 看到它的方式。


    # 数据选择与索引


    在我们的数据样本中，我们有书名和销售收入数据。假设我们只想知道哪些标题的月销售额达到 500 美元或以上。我们知道书名位于名为 ''Book Title''
    的列中，销售收入数据位于名为 ''Sales Rev.'' 的列中。由于我们只想查看月销售额大于 500 美元的标题，我们需要过滤数据以只返回那些行。因此，请在代码中添加以下内容：


    ```python

    filtered = data[data[''Sales Rev.''] > 500]

    ```


    为了减少杂乱，注释掉第 5、7、9-11 行。你的代码看起来应该这样：


    ![一张自动生成的计算机代码截图](img/image_rsrc3NE.jpg)


    第 13 行：`filtered` 变量的数据类型称为 `Pandas DataFrame`。在那个数据框中，我们告诉代码只保留销售收入大于 500 美元的记录。


    现在我们需要查看该过滤的结果以及那些书的标题。在代码中添加以下两行：


    ![](img/image_rsrc3NF.jpg)


    第 16 行：我们的 `filtered` 变量仍然包含 `CSV` 文件中的所有列，但仅包含符合我们标准的记录。然而，我们不想看到所有的列，只需看到“Book
    Title”和“Sales Rev.”，所以我们告诉数据框只显示那两列。


    保存代码并运行它以查看结果。


    # 数据清洗


    在处理大型数据集时，数据完整性问题并不罕见。`Pandas` 库中的这些方法可以很有帮助：`dropna()` 和 `fillna()`。


    | Aspect | `dropna()` | `fillna(0)` |

    | --- | --- | --- |

    | 缺失值处理 | 如果任何值缺失，则删除整行。 | 用指定值替换缺失值。 |

    | 对 DataFrame 大小的影响 | 可能会减小 `DataFrame` 的大小。 | 保持行数不变。 |

    | 数据保留 | 丢失至少一个缺失值的行数据。 | 保留所有行，引入默认值。 |

    | 使用场景 | 适用于处理完整案例至关重要的情况。 | 适用于倾向于用默认值替换缺失值的情况。 |

    | 处理非数值数据 | 对数值和非数值数据均效果良好。 | 更适用于数值数据；对非数值数据可能需要调整。 |


    (ChatGPT, n.d.)


    # Dropna()


    假设在我们的数据样本中，我们有缺失数据的行，而我们不能使用不完整的行。默认情况下，`dropna()` 的 `axis` 值为零 (0) 并删除行。此行代码将删除任何至少包含一个字段缺失或为空的行。在
    `Python` 中，缺失或空数据被称为 `NaN`。


    ```python

    clean_data = data.dropna()

    ```


    如果这样写，可以被设置为删除列：


    ```python

    clean_data = data.dropna(axis=1)

    ```


    # Fillna()


    此方法用指定值填充 `NaN` 字段。这在你想要保留所有行并填充 `NaN` 字段的情况下可能很有用。


    例如，假设你有一个发送到工厂的生产信号。填充 `NaN` 字段不会干扰你的数据处理方式。


    ```python

    fill_data = data.fillna(0)

    ```


    # 更多示例


    在我们的数据示例中，我们找到了一本月销售额超过 500 美元的书。现在让我们查看所有的总收入。在代码中添加以下两行，保存并运行：


    ```python

    total_rev = data[''Sales Rev.''].sum()

    print(f''Total Sales: ${total_rev:.2f}'')

    ```


    虽然拥有数值数据很好，但对许多终端用户来说，信息似乎是不完整的。“这些数字意味着什么？它们告诉了我们什么？”当我们进入第 2 部分时，我们将通过从数据操作转向视觉故事来扩展理解。


    # 第二部分：数据可视化


    让我们让我们从一个简单的示例开始。我们将创建一个条形图。在你的 IDE 中，打开“DataAnalysis”文件夹并创建一个名为 `bar_chart.py`
    的新文件。


    # 安装 matplotlib：


    在运行此代码之前，你需要确保已安装了 `matplotlib`。正如我们之前做的那样，你可以在终端窗口中运行 `pip list` 来检查它是否在你的包列表中。如果你没有安装，只需运行此命令：


    ```bash

    pip install matplotlib

    ```

