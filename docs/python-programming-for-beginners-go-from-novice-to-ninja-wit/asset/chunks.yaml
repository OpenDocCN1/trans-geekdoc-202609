    \ the deletion and you will notice in the output that there is a break in the\
    \ ID sequence because a record was deleted.\n\nLine 102 runs a \"commit\" statement\
    \ that commits all our record changes to the table.\n\nThis is the end of our\
    \ \"if\" block.\n\nWhy is a \"commit\" statement necessary?\n\nEven though we\
    \ can see the changes we made to the records in our DB, they are not made permanent\
    \ without executing the \"commit\" statement. Instead, our changes are held in\
    \ a temporary space outside the DB. This is so you can roll back your transactions\
    \ using the SQL \"rollback\" command if you realize a mistake has been made. If\
    \ you have multiple users logged onto a database and you forget to commit your\
    \ transactions, the other users will not see your changes because until you commit\
    \ them, your changes are only visible to you in your current session.\n\n# The\
    \ Except Block:\n\nThis block lives at the same indentation level as our \"try\"\
    \ block so it's on the left of our \"if\" section. It will capture any SQL errors\
    \ in our code at runtime and display a message in the terminal explaining what\
