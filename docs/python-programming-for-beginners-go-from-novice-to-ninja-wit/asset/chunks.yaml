  trans: '


    这意味着使用条件语句，只有在满足某些特定条件时才打印内容。当你预期某个行为会发生（或不发生），而程序没有按照预期方式响应时，这种方法特别有帮助。


    # 使用调试器控制台


    如果你正在使用 IDE 开发代码，可以使用调试器控制台来帮助你查看哪里出了问题。


    # 读取错误信息


    ## 回溯轨迹 (Tracebacks)


    在 Python 中，`traceback`（回溯轨迹）是一份显示导致异常发生的报告。一个 `traceback` 通常包含以下信息：


    * 错误类型和消息。这包括发生的异常类型（`TypeError`、`NameError` 等）以及描述错误的消息。

    * 文件和行号。这对于帮助你准确定代码在何处出错非常有帮助。消息会告诉你错误发生在哪个文件以及哪一行。这两者都是非常有价值的信息。

    * 函数调用。这会告诉你是哪些函数调用导致了错误的错误的发生。


    # 在 Google 上搜索错误


    有时，处理错误最快的方法是使用 Google。为了获得最佳结果，请复制错误消息并将其粘贴到 Google 搜索中。很有可能其他人也遇到过相同或类似的情况。


    # 使用 ChatGPT


    ChatGPT 的有用之处在于它能够理解人类输入并以易于理解的方式回答。尽管它非常智能，但给它提供上下文总是有帮助。例如：


    “我正在为一个天气应用编写 Python 代码，但它一直给我这个错误：[在此处插入错误消息]。我的代码在下面。你能告诉我有什么吗？


    [在此处插入你的代码]


    ChatGPT 将分析你的代码，识别问题，并经常提供修改建议。你提供的细节越多，结果就越好。


    # 咨询文档


    你可以在这里找到 Python 的官方文档：


    [`docs.python.org/`](https://docs.python.org/)


    如果你正在处理的错误涉及 Python 关键字或内置函数的使用，该文档将解释如何使用该函数，并通常提供正确用法的示例。


    # 寻求帮助


    有很多专门针对 Python 的网站和社区平台。只需确保对问题提供清晰的描述、任何相关的代码片段，以及你试图通过代码实现目标的解释。


    # 示例调试场景


    假设我们设计了一个计算数字列表平均值的函数。


    ![一张电脑截图](img/image_rsrc3KN.jpg)


    我们的函数没有问题。但现在有人尝试使用我们的代码并输入了如下列表：


    ![](img/image_rsrc3KP.jpg)


    只需看代码就能看出问题。列表中包含一个字符串形式的 60，而不是数字。但为了这个场景起见，让我们运行它并查看结果。


    ![一张自动生成的电脑代码描述截图](img/image_rsrc3KR.jpg)


    这是我从 VSCode 终端窗口获取的回溯轨迹消息。（示例中的行为了适应页面已折行处理。）


    第 19 行显示错误发生在代码第 14 行的函数调用中。它还显示了错误发生的文件。如果你的代码引用了多个文件，这特别有用。


    第 21 行显示了实际的函数调用。


    第 25 行显示了函数中发生错误的那行。


    第 26 行显示了错误类型并解释了问题所在：在预期整数的地方有一个字符串。


    乍一看，问题似乎出在 `calculate_average` 函数中。然而，当你查看错误类型时，你会发现问题不在于函数，而是在于它接收到的数据。从那里你就知道要检查函数调用发生的地方（第
    21 行），并查看传递了什么数据。正如我们上面所说，当你查看传递的列表时，在应该是整数的地方有一个字符串。


    这是一个非常简单的调试示例，但它展示了调试过程，并向你说明了回溯消息如何帮助识别代码中的问题。


    # 第 3 部分：调试工具


    ## 集成开发环境


    大多数 IDE 都内置了调试工具。书中大部分代码截图都来自 Visual Studio Code，这是我首选的 IDE。对于不想让 IDE 标记干扰视图的截图，我使用的是
    Notepad++。


    Python 的 IDE —— `IDLE` 也具有一些内置调试功能，但很有限。其他包含调试器的 IDE 还包括 `PyCharm` 和 `Thonny`。


    ## Print 语句


    我们在之前的章节中已经涵盖了，但使用 print 语句也是调试的形式。即使有内置调试器，print 语句也很有帮助，因为它们快速又易用。


    ## 日志


    Python 有一个 `logging` 模块，提供了一种灵活的方法来跟踪代码进度，并提供与 print 语句类似但更有结构化的消息。这是一个显示如何在代码中设置日志的示例：


    ![白色背景上的电脑代码，自动生成描述](img/image_rsrc3KS.jpg)


    第 1 行：导入 `logging` 模块。


    第 4 行：`logging.basicConfig` 正如其名，允许你收集一些基础日志信息。


    第 5 行：因为这个示例演示了日志的调试功能，所以级别设置为 `DEBUG`。以下是可用级别的列表：


    * `DEBUG` (10)：提供用于诊断的详细信息，通常用于测试和调试。

    * `INFO` (20)：提供一般信息，让你知道程序运行是否符合预期。如果需要持续监控你的应用，可以使用此作为验证代码是否按预期执行的手段。

    * `WARNING` (30)：用于显示存在可能需要进一步调查的问题，但不是致命的。换句话说，你的代码仍然可以工作，但可能需要修复。

    * `ERROR` (40)：表示发生了需要关注的错误。根据你的代码设计响应特定错误的方式，可以将代码设置为停止，也可以继续运行但需要关注。

    * `CRITICAL` (50)：表示可能导致你的应用程序停止运行的错误，需要立即关注。


    这些设置每个都有对应的数字，可以使用数字代替单词，但使用单词会让代码更清晰（在我看来）。关于这些数值级别需要理解的另一点是，每个级别只会显示该级别及以上级别的消息。因此，`INFO`
    将显示 `INFO` 消息及其以上的所有内容，但不会显示 `DEBUG` 消息。


    第 6 行：允许你配置生成的日志消息的格式。


    第 7 行：如果你想将日志保存到文件，此设置允许你设置文件名。


    在代码中使用日志遵循的语法类似于 print 语句。（参见下方的第 12 行和第 14 行。）


    ![带有文本的电脑代码描述](img/image_rsrc3KT.jpg)


    # Python 的调试功能


    要使用 Python 内置调试器，你需要导入 Python 调试器 (`pdb`) 模块。


    ![一个 Logo 特写](img/image_rsrc3KU.jpg)


    完成后，你可以在代码中设置一个或多个断点。这将告诉调试器开始调试过程。


    调试器启动后，可以使用控制台命令来控制调试器的行为：


    * `n` (next)：这将执行当前行，然后停在函数的下一行。

    * `s` (step)：这将在步进当前代码行，在调用的或当前函数中尽可能停止。

    * `c` (continue)：它将继续执行代码直到下一个断点（如果有）。否则，它将允许代码运行直到结束。


