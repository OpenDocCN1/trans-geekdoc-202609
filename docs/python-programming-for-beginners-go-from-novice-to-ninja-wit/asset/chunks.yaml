    \n```python\nfor iterator_variable in sequence_object:\n    # Code\n```\n\n单词\
    \ *for* 和 *in* 被设为斜体，以强调它们是必须作为 \"for\" 循环语句一部分的关键字。为了更好地理解这一点，让我们来看代码示例：\n\n\
