    # Indentation Rules and Best Practices


    So, how do we avoid formatting errors (and frustration)? There are several things
    to keep in mind as you format your code.


    # Whitespace Matters:


    Languages like Java don''t care about whitespace. For Python, whitespace is key
    to proper formatting. Indentation is done using spaces and tabs. To be consistent,
    it''s best to use tabs and to have the tabs in your code editor set to four spaces.
    This is common practice in the Python development community. You could mix spaces
    and tabs but that can lead to sloppy and inconsistent formatting and hard-to-read
    code.


    # Indentation Levels are Important:


    Be consistent when indenting blocks of code. Code block indentation is the hallmark
    of good Python code and is why it is so easily readable. Four spaces are used
    for each level of indentation.


    # Blocks of Code are Defined by Indentation:


    In Python, code blocks such as conditionals, loops, and function definitions are
    defined by indentation. Because of this rule, there is no need to use things like
    braces to identify and define a block of code. The blocks are obvious just by
    looking at the shape of the code. Java coders might be thinking: "We use indentation."
    Yes, we do, but that is mostly out of common practice. In Python, indentation
    is strictly enforced. If Python''s indentation rules are ignored, it will cause
    an error at run time.


    # Style is Flexible But There is a Standard:


    PEP 8 is Python''s style guide and the definitive resource when it comes to best
    practice. The recommendation for things like four spaces for indentation comes
    from this guide. If you''re using an IDE, and it is set up to use Python rules,
    it will help you keep your code properly formatted. Most IDEs will flag your code
    when you have a syntax or formatting error so that you can correct it before run
    time. By default, most already have tabs set to four spaces.


    # The Colon Symbol Signals the Start of a Code Block


    As touched upon earlier, the start of an indented block of code is signaled by
    a colon. You''ll see them at the end of statements like "if," "else," "for," and
    "while." You''ll also see them used in function definitions. Below is an example
    of a function definition.


    ![Snippet of Python code showing properly formatted function definition.](image_rsrc3H4.jpg)


    Line 2 gives the name of the function and shows that it can accept a parameter.
    The colon indicates a block of code is to follow.


    Line 3 is an "if" statement and is indented underneath the opening line to indicate
    that it is part of the function definition as per Python rules. It also ends with
    a colon to show another statement of code is coming.


    Line 4 is indented below line 3 making it clear to Python that this line of code
    belongs to the "if" statement. There is no colon at the end of this line and there
    are no other lines after it at the same indentation level. So, Python considers
    this part of the "if" statement complete.


    Line 5 is an "else" statement. It is indented at the same level as the "if" statement
    because it is part of the function definition. Line 5 ends with a colon indicating
    that another block of code is to follow. Line 6 is indented underneath the "else"
    statement signifying it is part of the "else" block. Nothing follows it, so Python
    considers this block and the function definition to be complete.


    If you were to put this into your IDE without the indentations, your IDE would
    flag it for formatting errors and if you tried to run it anyway, you would get
    run time errors.


    If you think of all this in terms of "block rankings," the outer block encompasses
    everything indented beneath it. If it has "if/else" statements inside it, they
    would be indented. Anything inside the "if/else" lines would be indented underneath
    them. If you had nested "if" statements, the inner "ifs" would be indented inside
    their outer "ifs." (The more you code in Python, the more this will make sense.)


    # Code Comments and Best Coding Practices


    As simple as Python is to read and understand, I cannot emphasize enough how important
    and useful code comments can be. Not only are they helpful to other developers
    who might be collaborating on your code with you, they are helpful to you as well.
    When you''re "in the zone" on a coding project, everything is still fresh in your
    mind, and it all makes sense. Fast forward a few weeks or months later. Someone
    says they found a use case that is throwing an error, or management says they
    want you to add a new feature to the code you helped write. Even if you wrote
    it yourself, when you go back to your old code, you''re likely going to have those
    "what was I thinking" moments. Comments can help make it clear to you and everyone
    else "what you were thinking."


    In Python, comments are preceded by the # (hash, or pound) symbol. Comments can
    appear above a section of code, or they can appear as an inline comment.


    ![A white background with black text Description automatically generated](image_rsrc3H5.jpg)


    Good practice would be to have the first line give the title for the code and
    perhaps an additional line or two stating its purpose. For each method or function
    in the code, you should also include a comment describing what the function/method
    does. Example:


    #Personnel data method


    Just by looking at that, I know that this method handles personnel data somehow.
    I don''t have to dig through the code to figure that out, and that comment gives
    me some context so that I can interpret the code correctly.


    In methods and functions that are complex, it''s also good to insert comments
    explaining what the different sections do.


    # Best Coding Practices


    # Use descriptive variable names.


    Avoid oversimplified names like "count". Is that a total count? A running count?
    A count of items? A count of iterations? Variable names like "running\_count",
    "total\_count", or "item\_count" are more descriptive.


    If your variable name consists of more than one word, separate each word with
    an \_ (underscore). Example: this\_is\_a\_multiword\_variable. Also, when creating
    variable names, use all lowercase, not mixed case, or camel case.


    If you''re ever stumped on what best practice is in a given scenario, refer to
    PEP or just Google it to find out.


    # Multi-line Comments


    To make multi-line comments in Python, precede and follow your multi-line comment
    with triple quotes. (""" or """). You can use this same syntax to create a multiline
    string variable. Here is a multi-line example:


    ![A close up of text Description automatically generated](image_rsrc3H6.jpg)


    The first one is a comment, the other is populating a variable.


    # Comment Keyboard Shortcut


    Most IDEs support this. If you want to comment out a line quickly, just press
    CTRL + / and the line the cursor is on will be commented out. You can undo this
    on a commented line using the same shortcut.


    If you want to comment/uncomment multiple lines at once, just highlight the lines
    you want to do this to and press CTRL + / and all the lines (including any blank
    lines) will be commented out. This shortcut comes in handy when you want to quickly
    comment out lines of code to try different coding scenarios.


    # Case Study: Analyzing a Real-World Python Script


    The best way to learn good code is to study good code and see what makes it tick.
    As we do this case study, we''re not going to focus on how each piece works. For
    now, we''re just focused on what good code looks like.


