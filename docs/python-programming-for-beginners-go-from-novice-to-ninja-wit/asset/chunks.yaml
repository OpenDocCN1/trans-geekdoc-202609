    are met. This is especially helpful in scenarios where you are expecting a certain
    behavior to occur (or not occur) and the program is not responding as expected.


    # Use the Debugger Console


    If you''re using an IDE to develop your code, you can use the debugger console
    to help you see what is going wrong.


    # Read the Error Messages


    # Tracebacks


    In Python, a traceback is a report that shows what caused an exception to occur.
    A traceback typically includes the following information:


    *   Error Type and Message. This includes the type of exception that occurred
    (TypeError, NameError, etc.), and a message describing the error.


    *   File and Line Number. This is very helpful in helping you pinpoint where your
    code went off the rails. The message will tell you what file the error occurred
    in and on what line number. Both are valuable pieces of information.


    *   Function Calls. This tells you what function call(s) led up to the error.


    # Google the Error


    Sometimes the fastest way to figure out how to handle an error is to use Google.
    For best results, copy the error message and paste it into your Google search.
    Chances are, someone else has run into the same or similar situation.


    # Use ChatGPT


    What is helpful with ChatGPT is its ability to understand human inputs and respond
    in a human-friendly manner. As intelligent as it is, it always helps to give it
    a context. For example:


    "I am writing Python code for a weather app, and it keeps giving me this error:
    \[INSERT ERROR MESSAGE HERE\]. My code is below. Can you tell me what is wrong
    with it?


    \[INSERT YOUR CODE\]"


    ChatGPT will analyze your code, identify the problem, and often offer corrections.
    The more detail you provide, the better your results.


    # Consult the Documentation


    You can find Python''s official documentation here:


    [https://docs.python.org/](https://docs.python.org/)


    If the error you are dealing with involves the use of a Python keyword or built-in
    function, this documentation will explain how the function should be used and
    often offers examples of correct use.


    # Ask for Help


    There are plenty of sites and community platforms that are dedicated to Python.
    Just be sure to provide a clear description of the issue, any relevant code snippets,
    and an explanation of what you are trying to accomplish with your code.


    # Sample Debugging Scenario


    Let''s say we''ve designed a function that averages a list of numbers.


    ![A screenshot of a computer](image_rsrc3KN.jpg)


    There''s nothing wrong with our function. But now someone tries to use our code
    and enters a list like this:


    ![](image_rsrc3KP.jpg)


    The problem is obvious just by looking at the code. The list includes 60 as a
    string rather than a number. But for the sake of this scenario, let''s run it
    and see the result.


    ![A screenshot of a computer code Description automatically generated](image_rsrc3KR.jpg)


    This is the traceback message I got from the VSCode terminal window. (The lines
    in this example have been wrapped to fit the page.)


    Line 19 shows that the error occurred in the function call at line 14 in the code.
    It also shows what file the error occurred. This is especially helpful if your
    code references multiple files.


    Line 21 shows the actual function call.


    Line 25 shows the line in the function where the error happened.


    Line 26 shows the error type and explains what the problem is: there is a string
    where an integer is expected.


    At first glance, it looks like the problem is in the "calculate\_average" function.
    However, when you look at the error type, you can see that the problem is not
    with the function but with the data it''s receiving. From there you would know
    to check where the function call occurred (line 21) and look at what data was
    being passed in. As we said above, when you look at the list being passed in,
    there is a string where there should be an integer.


    This is a very simple debugging example, but it demonstrates the debugging process
    and shows you how traceback messages can help identify problems in your code.


    # Section 3: Debugging Tools


    # Integrated Development Environments


    Most IDEs have built-in debugging tools. Most of the code screenshots in this
    book come from Visual Studio Code, my IDE of choice. For shots where I don''t
    want IDE markups to clutter the view, I am using Notepad++.


    Python''s IDE called IDLE also has some built-in debugging, but it is limited.
    Other IDEs that include debuggers include PyCharm and Thonny.


    # Print Statements


    We already covered this in a previous section, but using print statements is also
    a form of debugging. Even with a built-in debugger, print statements can be helpful
    since they are quick and easy to use.


    # Logging


    Python has a "logging" module that provides a flexible way to track your code''s
    progress and provide messaging akin to using print statements but more structured.
    Here is an example showing how to set up logging in your code:


    ![A computer code on a white background Description automatically generated](image_rsrc3KS.jpg)


    Line 1: This imports the logging module.


    Line 4: "logging.basicConfig" as the name suggests, allows you to gather some
    basic logging information.


    Line 5: Because this example demonstrates the debugging feature of logging, the
    level is set to "DEBUG". Here is a list of the available levels:


    *   DEBUG (10): This provides detailed information for diagnostic purposes and
    is typically used for testing and debugging.


    *   INFO (20): This gives general information and lets you know if things are
    running as expected. If constant monitoring of your app is needed, you can use
    this as a means of verifying that your code is performing as it should.


    *   WARNING (30): This is used to show that there is an issue that might need
    further investigation but is non-fatal. In other words, your code will still work
    but there may be fixes needed.


    *   ERROR (40): This indicates an error that requires attention. Depending on
    how your code is designed to respond to a particular error, your code can be set
    to stop, or it can continue but require attention.


    *   CRITICAL (50): This indicates an error that could stop your application from
    running and requires immediate attention.


    Each of these settings has a corresponding number and the numbers can be used
    instead of the word, but the use of the word makes for clearer code (in my opinion).
    The other thing to understand about these numerical levels is that each level
    will only display messages at that level or above. So, INFO will show INFO messages
    and everything above it, but it will NOT show DEBUG messages.


    Line 6: This allows you to configure the format of the log messages produced.


    Line 7: If you want the log saved to a file, this setting allows you to set the
    file name.


    To use logging in your code, you follow a syntax similar to using a print statement.
    (See lines 12 and 14 below.)


    ![A computer code with text Description automatically generated with medium confidence](image_rsrc3KT.jpg)


    # Python''s Debugging Features


    To use Python''s built-in debugger, you need to import the Python Debugger (pdb)
    module.


    ![A close up of a logo Description automatically generated](image_rsrc3KU.jpg)


    Once you have done that, you can set one or more breakpoints in your code. This
    will tell the debugger to start the debugging process.


    ![A close up of a text Description automatically generated](image_rsrc3KV.jpg)


    When the debugger starts you can then use these console commands to control the
    debugger''s behavior:


    *   "n" (next): This will execute the current line and then stop at the next line
    in the function.


    *   "s" (step): This will step through the current line of code, stopping where
    possible in called or current function.


    *   "c" (continue): It will continue code execution until the next breakpoint,
    if any. Otherwise, it will allow the code to run until the code is finished.'
