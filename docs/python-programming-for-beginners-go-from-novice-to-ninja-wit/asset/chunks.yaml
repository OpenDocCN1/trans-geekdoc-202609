    # 整数 (Integers)


    正如我们在上面提到的，整数是整数，意味着没有小数的数字。整数可以是负数也可以是正数。因此，像 `12`、`-7`、`0` 和 `115` 这样的数字都是整数。整数经常用于计算以及作为列表等对象的索引。


    # 浮点数 (Floats)


    浮点数带有小数。它们也被称为“浮点”数。这就像把四季豆称为另一种名字一样。是一回事，只是名字不同。浮点数可以是正数也可以是负数。因此，像 `3.14`、`-2.6`
    和 `0.1` 这样的数字都是浮点数。通常在需要更高精度时使用浮点数。


