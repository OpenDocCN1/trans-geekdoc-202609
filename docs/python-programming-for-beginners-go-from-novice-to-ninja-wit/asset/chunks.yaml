- raw: 'In our next section, we''ll cover something you have already seen by way of
    example: return statements. Return statements are how functions can communicate
    feedback to the code that called it.


    # Section 3: Return Statements


    # The Power of Return Statements


    Return statements serve as the bridge between a function''s internal logic and
    the rest of your program. Going back to our puzzle analogy, you have that group
    of the puzzle team who are in charge of the ''sky" pieces. Since the subject of
    the puzzle was a barn, you also have the group in charge of the "barn pieces,"
    and so on. While each group is working on a particular section of the puzzle,
    the goal is for each to share the results of their work with the group. You expect
    that the "sky piece" people are returning an image of the sky and that the "barn"
    people are building the image of the barn and so on.


    Return statements on functions are a little like that. They each have their specific
    task and when they are done, they should return what they were assigned to do.
    We have seen that several times already, even with our most recent example.


    # Leveraging Return Statement Results


    Functions do not exist in a vacuum. They are used to complete complex tasks. The
    power of functions comes from the fact that you can break complex problems into
    smaller more manageable tasks and leverage what they return to produce the more
    complex result.


    # Example: Reading a File


    Combing through a file might not be a complex task, but it can be a very monotonous
    and time-consuming one. If you have hundreds of files to process, each with thousands
    of lines of data, that task can take a very long time. A function can handle tasks
    like that quickly and efficiently, even if it has many files and many lines of
    data. Here is an example:


    ![A screen shot of a computer code Description automatically generated](image_rsrc3JC.jpg)


    Line 1: You have seen import statements in some of our other examples. The "import"
    keyword is used to make the code in one module available to another. For a list
    of Python''s built-in imports, you can visit this site:


    [https://docs.python.org/3/py-modindex.html](https://docs.python.org/3/py-modindex.html)


    Our example is importing Python''s csv module. A "CSV" is a comma-separated values
    file. This means the data points in each row of data are separated by commas (or
    some other separator like semicolons ( ; )). Our reader is designed to "read"
    this data so that our code can use it.


    Line 3: This is our function definition, and it takes a file path. This is so
    our code can know where to find the file that needs to be processed.


    Line 4: This is creating an empty list called "file\_data." This will store the
    lines of data from the file into a list that can be iterated for further analysis.


    Line 5: This line introduces us to the "with" keyword. For now, think of it as
    a means of opening a resource for processing and then closing the resource when
    it''s done. What we are telling our code is: "With this object, do the following
    tasks." In our "with" statement we are opening the file provided by the user.
    The "r" in the "open" statement opens the file in read mode as opposed to write
    mode because we just want to read the contents, not change anything. The "as file"
    statement is simply assigning a variable name to the object being read.


    Line 6: This is assigning a Python CSV reader object to the variable "csv\_reader"
    so that the contents of the CSV can be processed.


    Lines 7-8: This for loop iterates through the csv\_reader and puts each line of
    data into the file\_data list created earlier.


    Line 9: The return statement returns the contents of the file to the rest of the
    program.


    With the data from the return statement, you could create another function called
    "find\_rows" that accepts lists and search strings as parameters. The "find\_rows"
    function could then be tasked to find rows with specific data strings to put into
    a new, more streamlined file with only the data needed by the user, or some other
    function in your code.


    # A Personal Example


    At the company where I work, we have files that we process that are too large
    for the commercial spreadsheet software we normally use. On top of that, the files
    are so large that most of the laptops used by our company cannot open them, let
    alone pull the needed data from them. To handle this, I wrote a program that could
    process the files a line at a time, rather than all at once, pull only the needed
    lines of data, and then format the data in a way that the commercially available
    spreadsheet program could consume – and this could all be done using any company
    laptop. To accomplish all this meant breaking the tasks into smaller, manageable
    functions that shared their data with each other so that they could accomplish
    the larger task.


    # Project: The Gui Weather App


    In the previous chapter, you were introduced to functions by building one of the
    three we need for our app. Now that you have a better understanding of functions,
    let''s add two. Then, in Chapter Four we''ll add the finishing touches.


    # Step Five: Defining the "get\_weather" Function


    Add these lines of code to create the "get\_weather" function. The first line
    of the definition must be on the same indent level as the precious function.


    ![A screen shot of a computer code Description automatically generated](image_rsrc3JD.jpg)


    Line 21 defines our new function. This one takes an argument called "location".


    Line 22 needs the API key you got earlier. Be sure to surround it in quotes.


    Line 23 declares the "unit" parameter. Note that it is "unit" singular, not plural.
    In the example, I have it set to ''imperial'' to get the temperature in Fahrenheit.
    You can change that to something else if you prefer.


    Line 24 populates the "params" variable. In that variable we are formatting our
    request in the way "Open Weather" API expects to receive it.


    Line 25 populates the response variable. To get its data, it uses the "requests"
    module we imported earlier to send the request to Open Weathers''s API.


    # The "if" statement


    There is an "if" statement below line 25 that needs to start at the same indent
    level as line 25. That''s because it is part of the "get\_weather" function.


    ![A close-up of a white background Description automatically generated](image_rsrc3JE.jpg)


    Line 27-28 should look a little familiar to you. It''s a conditional. If our request
    comes back with a status code of 200, it means our request to the API was accepted
    and we have data coming back.


    Line 29 is also part of the "if" statement. The "return" keyword will give us
    the data we received from the API.


    Lines 30-31 is what our code''s response will be if we get anything other than
    a status code of 200. Instead of capturing an error message, we''re just going
    to have our code return nothing. This will keep it from crashing, or showing our
    user an error code. Instead, it will just allow the user to try again. IMPORTANT:
    Not that in our return statement that "None" is capitalized. That is a Python
    requirement. It will not recognize "none," or "null."


    # Step Six: Defining the "display\_weather" Function


    To get the weather data that you''ll display in your GUI app, add these lines
    of code:


    ![A screen shot of a computer program Description automatically generated](image_rsrc3JF.jpg)


    Line 34 declares the definition of our "display\_weather" function and must be
    at the same indent level as our previous functions.


    Line 35 "result\_label" is a Tkinter widget that we are leaving blank for now.
    It will change based on the results we get from the API.


    Lines 36-42 is a conditional statement. If we get a correct response from Open
    Weather''s API, it will return JSON data that our code will parse into a human-readable
    message in our GUI.'
