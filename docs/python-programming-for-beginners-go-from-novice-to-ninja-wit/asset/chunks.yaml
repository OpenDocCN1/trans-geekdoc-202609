    # Initializing a local repo:


    In a terminal window inside your application folder, run the following command:


    git init


    When you run this command your .env and .venv files should appear grayed out.
    If not, be sure to add them to your .ignore file. You want to do this because
    those files contain data you do not want to share publicly in GitHub when you
    go to deploy your code.


    One other thing you want to add to your .gitignore file is the \_\_pycache\_\_
    folder. (The folder name has two underscores on either side of it.) This folder
    is created automatically as you add modules to your application. It''s not something
    you want to publish to GitHub.


    # Updating your repo:


    Once you have everything in place and your .gitignore file up-to-date, it''s time
    to add everything to your repository to get it ready for deployment to GitHub.


    # Adding your files to your repository


    To add all your files to your local repo, run this command:


    git add.


    The dot instructs git to add all the files to your repo. When you do this, you''ll
    notice that files with a "U" next to them (updated) will have an "A" next to them
    (added). You''ll also notice that the files you added to your .gitignore file
    are ignored. There are no letters next to them.


    # Committing your files


    The next step is to commit your files to the repository. To do that, run this
    command:


    git commit -m "first commit"


    The "-m" flag stands for "message" and it''s a good idea to add a message to every
    commit you make so that you have a running commentary of every change you make.
    The message does not have to be super detailed, just enough detail to remind you
    what you did during a specific commit. After you run the command, you''ll see
    a list of items that git committed to the repository.


    # Adding your files to GitHub:


