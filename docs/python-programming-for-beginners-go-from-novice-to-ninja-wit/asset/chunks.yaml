- raw: 'Unlike strongly typed languages like Java where you must declare a type on
    parameters, in Python you do not. This falls in line with Python''s philosophy
    of code clarity and readability. It can get away with this because it uses something
    called "dynamic typing," meaning Python determines a parameter''s type at runtime.
    As you have already seen, it does the same with variables. You can, however, use
    "type hints," where you can give hints as to what the parameter types are. Here
    is an example of a function with type hints:


    ![Snippet showing type hints.](image_rsrc3HW.jpg)


    Type hints are not a Python requirement and Python will not enforce any kind of
    typing rules at runtime. However, hints are helpful to you and other developers
    if the type is not obvious, or if you have multiple parameters of different types.


    # Calling Functions


    Another way to describe a function is to say that it is a block of code that runs
    when it''s called. That''s probably why Python is called "Python" and not "Feline"
    because then functions would never run when called. (Pause for laughter.)


    So, how do you call a function? Below is an example of a function call:


    ![A screenshot of a computer code Description automatically generated](image_rsrc3HX.jpg)


    In this example, the function accepts a "name" parameter and then prints a greeting.
    To format the greeting correctly, the print function has an "f string" in it.
    The "f" = "formatted." It tells Python that the string it''s about to print must
    be formatted in a certain way. What you see in the print statement is: (f"Hello,
    {name}!") The curly braces around "name" let Python know that this is a parameter,
    meaning it should print the contents of the parameter that was passed in. This
    way, it prints "Hello, Alice!" and not "Hello, {name}!"


    In the function call, you see that it is just the name of the function with the
    parameter in parentheses. A function call can be a standalone statement as you
    see in our example, or it can be called from inside another function or method.


    # Let''s Write a Function


    Remember our puzzle analogy? Let''s solve one. Open your IDE and create a file
    called "function\_example.py." Then follow the steps below to solve our coding
    puzzle.


    # Step 1 - The puzzle


    We need to create a function that determines the area of a rectangle, and then
    we need to call it. Remember: to get the area of a rectangle, you need to multiply
    the width by the length.


    # Step 2 – Define the Function


    The first thing we need to do is come up with a name for our function. It needs
    to be simple and clear. So, let''s go with "area\_calculator." You could also
    use something with "rectangle" in the name if you want. The point is that you
    want function names that easily identify what the function does. The definition
    line should look like this:


    ![Function definition example](image_rsrc3HY.jpg)


    # Step 3 – Function Body


    The body of your function needs to be indented below the definition. So, it should
    look like this:


    ![Function definition with body](image_rsrc3HZ.jpg)


    In this example, we declare the variable "area" and assign it the result of width
    \* length. Then we return "area." You could shorten this by leaving out the variable
    and just returning the result of the formula like this:


    ![Alternate function body](image_rsrc3J0.jpg)


    # Step 4 – Calling the Function


    Now let''s call the function from the print() function.


    ![Function followed by function call.](image_rsrc3J1.jpg)


    # Step 5 – Check Your Work


    In the terminal window of your IDE, run the program by running this:


    python area\_calculator


    You should get back the result of 15. Test it with other numbers as well, including
    decimal numbers to make sure it works as expected.


    # Section 2: Parameters and Arguments


    # What Are Parameters and Arguments?


    Parameters are the variables that appear between the parentheses in a function
    definition. In the previous section, our function parameters were "width" and
    "height." These were the values being passed into our function.


    Arguments are values you pass to a function when you call it. Again, going back
    to our previous example, we called our function with two arguments, a 3 and a
    5:


    area\_calculator(3, 5)


    Go back to your function, remove the arguments from the function call, and see
    what happens. When you try to call a function that expects parameters, but you
    don''t include the arguments in your function call, you''ll get an error. If a
    function has two parameters, and you send in only one, you will also get an error.


    Now go back to your function, enter your numbers with single quotes around each,
    and see what happens. You sent in two arguments, but you sent them in as the wrong
    type. You sent them in as strings instead of numbers. When you call a function,
    you need to respect the number of arguments as well as the type of arguments the
    function is expecting.


    # Creating Versatile Functions with Varying Inputs


    When writing code, the better you can anticipate how a user might interact with
    your program, the more you can improve the user experience. Functions in Python
    are powerful and versatile in this way because they allow you to write code that
    can respond to different scenarios.


    # Default Parameters


    In the function we wrote for section one when you left out the arguments, you
    got an error. This is because when a function is designed to expect errors and
    you provide none, the function will throw an error. With default parameters, you
    can anticipate scenarios where an argument might be missing. In your function,
    change the definition to look like this:


    def area\_calculator(width \=2, length \= 2):


    Now, call the function with no arguments and see what happens. Try it again with
    just one parameter. Because you had default values for your parameters, Python
    had what it needed for that function and was able to return a result.


    This behavior isn''t just good for handling user errors; it''s also good for scenarios
    where there is an expected default behavior, and a variation is the exception.
    Let''s say the company you work for makes 2x2 squares. Occasionally there are
    exceptions, but mostly they make 2x2 squares. With the modification to our function
    definition, we don''t have to remember to enter "2, 2" in our area\_calculator
    function. We can just call the function without arguments and get the 2x2 result
    we expect.


    # Arbitrary Argument Lists


    In our function we knew there would only be two arguments needed because we were
    calculating area: width \* length. But what happens if you know your function
    needs to work with a list of parameters, but that list can vary? For example,
    let''s say you want to create a grocery list app. How would you make a function
    flexible enough to accept a list that could change from week to week? This is
    where "\*args\*" and "\*\*kwargs" can help you.


    # Using \*args


    The "\*args" argument allows you to accept a non-keyword list of arguments. To
    use an "\*args" parameter in your function you prefix the parameter with an asterisk
    followed by the parameter name. Let''s try it out. Go ahead and create a file
    in your IDE and call it, "flex\_param.py."


    We''re going to create an "arg" function demo. So, let''s define it like this:


    ![Arg example with function definition](image_rsrc3J2.jpg)


    Now let''s show ourselves the kind of data type we''re using:


    ![Arg example with data type print line](image_rsrc3J3.jpg)


    In line 3 in the screenshot above, notice how we are getting the data type. Inside
    the curly braces, we have "type(items)".  This comes in handy when you''re not
    entirely clear about what kind of data type is being used in a section of code.


    Now, let''s add a print statement and follow that up with a function call so we
    know what''s in our items list:


    ![Arg code example](image_rsrc3J4.jpg)


    When you run this, notice that it is a "tuple," and ordered list. Because it''s
    a list, we were able to iterate it (lines 5-6) and have it do something with the
    items in the list. In our case, we just printed them.'
