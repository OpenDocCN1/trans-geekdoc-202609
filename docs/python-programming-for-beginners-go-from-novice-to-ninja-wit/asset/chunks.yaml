- raw: '2 Diving Deeper into Python


    Why is it called "Python"? Python was created by Guido van Rossum. To name his
    new programming language, he wanted something short, unique, and a little mysterious.
    At the time, he"''d been reading the published scripts from Monty Python''s Flying
    Circus, a popular BBC comedy show from the 1970s. (We allegedly got the term ''spam"
    from a skit on that show.) He liked the show so much that he decided to name his
    new programming language in tribute to it. (General Python FAQ, n.d.) It just
    goes to show that programmers do have a sense of humor. It''s warped and quirky,
    and sometimes lives beyond the grasp of mere mortals, but it does exist.


    # Section 1: Operators and Expressions


    # Understanding Operators and Their Role in Python


    # What are Operators and Why Are They Important?


    Operators are essential for any programming language, Python included. They are
    special symbols used to perform various operations on data. These include mathematical
    equations, making comparisons, performing logical evaluations, and assigning values.
    Seeing what they do makes clear why they are so important. They are important
    because they manipulate data, control program flow, help your code make decisions,
    give variables their values, and store and retrieve data. Failing to understand
    how to use operators effectively would be like trying to learn a foreign language
    without learning any of the verbs. You''d have a hard time communicating anything
    effectively.


    # Operator Categories


    Operators fall into several broad categories:


    Arithmetic Operators: As the name suggests, these are used to perform mathematical
    calculations. You''ve seen some of these in action already in chapter one. They
    include addition (+), subtraction (-), multiplication (\*), division (/), integer
    division (//), modulus a.k.a. remainder (%), and exponentiation (\*\*).


    In this example, the code is using subtraction to get a user''s birth year:


    ![](image_rsrc3HC.jpg)


    Comparison Operators. These operators compare values and determine the relationship
    between them. Operators in this category include equal to (==), not equal to (!=),
    greater than (>), lesser than (<), greater than or equal to (>=), and lesser than
    or equal to (<=)


    In this example, the code checks to see if a student has a passing grade:


    ![A white background with black text Description automatically generated](image_rsrc3HD.jpg)


    Line 2 asks the user to enter their score.


    Line 3 sets the passing grade at 70.


    In line 4, "is\_passing" is seen by Python as a Boolean (true or false) because
    comparison operators return "true" or "false" depending on the outcome. In this
    case, if the student''s grade is greater than or equal to the passing grade, the
    result is "true."


    Line 6 shows the user the result.


    Logical Operators. These compare multiple conditions and determine whether the
    overall value of an expression is true. Logical operators include "and," "or,"
    and "not."


    This next example uses the logical operator "and" to see if it is a picnic day:


    ![A white background with black text Description automatically generated](image_rsrc3HE.jpg)


    Line 5 is a Boolean because logical operators will return true or false based
    on their evaluation. What is being asked is, "Is it sunny and is it warm?" If
    the answer to both is true, then the statement returns "true."


    Assignment Operators. Assignment operators assign values to variables. The most
    common assignment variable is the equal sign (=).


    Example: x = 7.


    When you write code like that in Python, it will determine the variable''s type
    based on the value you assign it. So, for x = 7, Python will determine that x
    is an INTEGER with the value of 7. If you write x = 7.0, then Python would determine
    that x is a FLOAT with the value of 7.0.


    As simple as the equal sign is, it can be confusing to new programmers because
    they can mistakenly try to use it as a comparison operator. But that operator
    is ==. What''s the difference? The easiest way to keep these straight is to read
    = and "is" and == as ''same as."


    Let''s say you had two variables, one named "glass\_of\_water" and the other named
    "glass\_of\_wine" and you wanted to compare the two to see if they were the same.
    If you wrote this in your code: "glass\_of\_water = glass\_of\_wine," you''d be
    asking Python to turn water into wine. Python''s powerful, but it''s not that
    powerful. Why doesn''t that work? Because you''re trying to tell Python that "glass\_of\_water"
    is "glass\_of\_wine" rather than asking it if the glass\_of\_water is the same
    as the glass\_of\_wine. The correct notation would be: "glass\_of\_water" == "glass\_of\_wine."


    Membership Operators. These operators check to see if a value is a member of a
    sequence like a list, a string, or a tuple. Membership operators include "in"
    and "not in."


    This example checks if a value is part of a list of fruits:


    ![A white background with black text Description automatically generated](image_rsrc3HF.jpg)


    The variable "is\_approved" is seen by Python as a Boolean because membership
    operators return a Boolean result. If the user enters "cabbage" as an item, "is\_approved"
    will return "false." If the user enters something that is a member of the list,
    "is\_approved" will return "true."


    # Creating Expressions and Performing Operations.


    Expressions are the heart of computation. But what are we talking about when we
    talk about "expressions?" We''re talking about combining values, variables, and
    operators in a way that produces accurate and reliable results. Expressions allow
    you as a programmer to perform something as ordinary as a simple math calculation
    to a complex logical evaluation designed to analyze scientific data for NASA.
    The key to becoming proficient with expressions is practice. Don''t be afraid
    to experiment – with your own code – not code from NASA! The more you work with
    expressions the better you''ll understand them. The more you understand them,
    the more you''ll find ways to put them to proper use. Besides just doing simple
    math, you''ll see that expressions can also be used to make decisions and respond
    to different conditions and inputs.


    # Example 1 – A Simple Arithmetic Expression


    In your IDE create a new file and enter this code:


    \# A simple math expression


    total\_cost = item\_price \* quantity


    Name this file math\_expression.py and save it. Your IDE should already be flagging
    errors. Before you read on, can you tell why?


    You''ve assigned a value to "total\_cost" by making it equal to the value of "item\_price
    \* quantity." You need to assign values to those two variables. Since the price
    of things is usually a number with a decimal it should be a float and since the
    quantity is usually a whole number, that should be an integer. So, change your
    code to look like this:


    \# A simple math expression


    item\_price = float(10)


    quantity = int(5)


    total\_cost = item\_price \* quantity


    That should have cleared up your syntax errors. What we did is we explicitly declare
    the numeric data types for item\_price and quantity. We could have implicitly
    declared their types by doing this:


    item\_price = 10.0


    quantity = 5


    From that, Python would have inferred that item\_price was a float because the
    number contained a decimal value, and it would have inferred the quantity was
    an int because it had a whole number value. At this point, we can run the code
    in our IDE terminal by making sure we are in the same directory as our code and
    then running the command:


    python math\_expressions.py


    The only problem is we won''t see anything because we have not told our code how
    to output it yet. We need to add a print() statement. Remember the print() function
    has to have a string variable, so We''ll need to cast our variable "total\_price"
    as a string. So, add this to the bottom of your code:


    print("The total cost is " + str(total\_cost))'
