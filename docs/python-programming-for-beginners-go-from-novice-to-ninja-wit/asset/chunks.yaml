    # Section 4: Modules and Libraries


    # Modules


    Modular programming is a key concept in all modern programming languages. It is
    the practice of breaking your programming code into smaller, self-contained modules.
    For example, your car has a battery. The battery serves one function. It provides
    an electrical source for your vehicle. It might serve other more complex parts
    in your car, but the battery''s function is simple and clearly defined. It provides
    power. In code-speak, we could say that when you put a battery in your car, you''re
    importing a battery module to use in your car program. Not only that, but you
    can put a car battery in most cars. You don''t have to buy a brand-specific car
    battery. They do the same thing regardless of the vehicle.


    In Python, a module works in much the same way. It is just a file with a ".py"
    extension that contains statements and definitions. You have used modules in your
    coding projects. Whenever you used the "import" keyword you were importing a module.
    Python has a huge list of built-in imports located here:


    [https://docs.python.org/3/py-modindex.html](https://docs.python.org/3/py-modindex.html)


    Because Python is open source, there are plenty more online and you can write
    your own as well.


    The advantages of modules include:


    *   Organization: Modules help you to keep code organized by keeping things together
    by functionality.


    *   Reusability: Consider Python''s "math" module. It has all kinds of math functions
    inside it and can be imported into any Python code requiring math functions. It
    is reusable and it keeps you from having to write math functions yourself.


    *   Namespace Safety: Modules, create separate namespaces for your functions and
    variables. It''s very possible that a variable or function name included in one
    module could also be present in another. Thanks to "dot" notation, the potential
    conflict is minimized because to use a function from a module, the syntax is module\_name.function\_name().
    So, even if two modules you were using both had a function called "walk\_dog",
    you can specify which function you mean by using the module name in the function
    call.


    *   Encapsulation: Encapsulation allows a module to hide certain aspects of its
    operation and serves to make it easier for others to use. For example, to start
    your car, you just need to know how to turn the key in the ignition. You don''t
    have to know about or explain the intricacies of the motor, the transmission,
    the brakes, etc. You can just use those things and not have to concern yourself
    with them.


    # Libraries


    Libraries are simply collections of modules. Although they are not required to,
    libraries tend to have general themes. Some are general purpose like Python''s
    Standard Library. Others are focused on machine learning or web development.


