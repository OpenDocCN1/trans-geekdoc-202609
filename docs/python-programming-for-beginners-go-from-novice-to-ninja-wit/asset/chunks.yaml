    ,\"cheese\",\"ice cream\",\"butter\"]`\n*   `meat = [\"beef\",\"pork\",\"bacon\"\
    ,\"coldcuts\"]`\n*   `fruit = [\"apples\", \"bananas\", \"oranges\"]`\n*   使用\
    \ \"for\" 循环遍历 `shopping_list`。\n*   使用其他列表打印项目是什么以及它在哪个区域。例如：“bacon 在肉类中。”\n\
