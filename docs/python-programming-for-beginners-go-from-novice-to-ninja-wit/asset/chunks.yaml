    与 `Java` 等强类型语言不同，在这些语言中你必须对参数声明类型，但在 Python 中不需要。这符合 Python 代码清晰和可读的哲学。它之所以可以这样做，是因为它使用了所谓的“动态类型”（dynamic
    typing），这意味着 Python 在运行时确定参数的类型。正如你已经看到的，它对变量也是这样处理的。不过，你可以使用“类型提示”（type hints），你可以对参数的类型提供提示。这里有一个带有类型提示的函数示例：


    ![显示类型提示的代码片段](img/image_rsrc3HW.jpg)


    类型提示并不是 Python 的要求，Python 不会在运行时强制任何类型的类型规则。然而，如果类型并不显而易见，或者你有多个不同类型的参数，这些提示对你和其他开发者来说非常有帮助。


    # 调用函数


    描述函数的另一种方式是说它是一个在被调用时运行的代码块。这可能就是为什么 Python 被称为“Python”而不是“Feline”（猫科动物），因为那样的话函数在被调用时永远不会运行。（停顿大笑。）


    那么，如何调用函数呢？下面是一个函数调用的示例：


    ![自动生成的计算机代码描述截图](img/image_rsrc3HX.jpg)


    在这个示例中，函数接受一个 `"name"` 参数然后打印问候语。为了正确格式化问候语，`print` 函数内部包含一个“f string”。`"f"` 代表“formatted”（格式化的）。它告诉
    Python 即将打印的字符串必须以特定方式格式化。你在 print 语句中看到的是：`f"Hello, {name}!"`。`"name"` 周的大括号让
    Python 知道这是一个参数，意味着它应该打印传入参数的内容。这样，它就会打印“Hello, Alice!”而不是“Hello, {name}!”。


    在函数调用中，你看到它只是函数名加上括号里的参数。函数调用可以像我们的示例中那样是一个独立的语句，也可以从另一个函数或方法内部调用。


    # 让我们写一个函数


    还记得我们的谜题类比吗？让我们来解决一个。打开你的 IDE 并创建一个名为 `function_example.py` 的文件。然后按照以下步骤解决我们的编程谜题。


    ## 第 1  - 谜题


    我们需要创建一个确定矩形面积的函数，然后我们需要调用它。记住：要得到矩形的面积，你需要将宽度乘以长度。


    ## 第 2  – 定义函数


    我们需要做的第一件事是为我们的函数起一个名字。它需要简单清晰。所以，我们就用 `"area_calculator"` 吧。如果你愿意，也可以在名称中使用 `"rectangle"`。要点是，你想让函数名能够轻松识别该函数的功能。定义行应该像这样：


    ![函数定义示例](img/image_rsrc3HY.jpg)


    ## 第 3  – 函数体


    你的函数体需要缩进在定义下方。所以，它应该像这样：


    ![带有函数体的函数定义](img/image_rsrc3HZ.jpg)


    在这个示例中，我们声明了变量 `"area"` 并将其赋值为 `width * length` 的结果。然后我们返回 `"area"`。你可以通过省略变量并直接返回公式的结果来简化它，如下所示：


    ![另一种函数体](img/image_rsrc3J0.jpg)


    ## 第 4  – 调用函数


    现在让我们从 `print()` 函数调用该函数。


    ![函数及其后的函数调用](img/image_rsrc3J1.jpg)


    ## 第 5 – 检查你的工作


    在 IDE 的终端窗口中，通过运行以下命令运行程序：


    ```bash

    python area_calculator

    ```


    你应该会得到 15 的结果。也用其他数字进行测试，包括小数，以确保它按预期工作。


    # 第二部分：参数和参数


    ### 什么是参数和参数？


    参数是函数定义中括号之间的变量。在上一节中，我们的函数参数是 `"width"` 和 `"height"`。这些是传递给函数的值。


    参数是指你在调用函数时传递给函数的值。再次回到之前的示例，我们用两个参数调用了函数：3 和 5：


    `area_calculator(3, 5)`


    回到你的函数，从函数调用中移除参数，看看会发生什么。当你尝试调用一个期望参数的函数，但你没有在函数调用中包含参数时，你将得到一个错误。如果一个函数有两个参数，而你只发送了一个，你也会得到错误。


    现在回到你的函数，为每个数字加上单引号并输入，看看会发生什么。你发送了两个参数，但发送的类型错误。你发送的是字符串而不是数字。当你调用函数时，你不仅需要尊重参数的数量，还需要尊重函数期望的参数类型。


    ### 使用不同输入创建多功能函数


    在编写代码时，你越能预判用户如何与你的程序交互，你就越能提高用户体验。Python 中的函数在这方面是强大且多功能的，因为它们允许你编写可以响应不同场景的代码。


    ### 默认参数


    在我们在第一节编写的函数中，当你漏掉参数时，得到了一个错误。这是因为当函数被设计为期望参数而你没有提供时，函数将抛出错误。通过默认参数，你可以预判参数可能缺失的情况。在你的函数中，将定义修改如下：


    ```python

    def area_calculator(width=2, length=2):

    ```


    现在，不带参数调用函数看看会发生什么。再次尝试只使用一个参数。因为你为参数设置了默认值，Python 拥有该函数所需的内容并能够返回结果。


    这种行为不仅适用于处理用户错误，对于预期默认行为且变化是异常的情况也有处。假设你工作的公司制造 2x2 的正方形。偶尔会有例外，但大多数时候它们制造 2x2
    的正方形。通过对函数定义进行修改，我们不需要记住在 `area_calculator` 函数中输入 `"2, 2"`。我们可以直接不带参数调用函数并获得我们预期的
    2x2 结果。


    ### 任意参数列表


    在我们函数中，我们知道只需要两个参数，因为我们在计算面积：`width * length`。但如果你知道你的函数需要处理一个参数列表，但该列表是可以变化的，会发生什么呢？例如，假设你想创建一个购物列表应用。你会如何让函数足够灵活，以接受每周都会变化的列表呢？这就是
    `*args` 和 `**kwargs` 可以帮你的地方。


    ### 使用 *args


    `*args` 参数允许你接受非关键字的参数列表。要在函数中使用 `*args` 参数，请在参数名前前面加一个星号。让我们尝试一下。好的，在你的 IDE 中创建一个文件并命名为
    `flex_param.py`。


    我们将创建一个 `"arg"` 函数演示。所以，让我们这样定义它：


    ![带有函数定义的 arg 示例](img/image_rsrc3J2.jpg)


    现在让我们展示正在使用的数据类型：


    ![带有类型打印行的 arg 示例](img/image_rsrc3J3.jpg)


    在上面的截图第 3 行，注意我们是如何获取数据类型的。在大括号内，我们写了 `type(items)`。当你对代码段中使用的数据类型不完全清楚时，这非常有用。


    现在，让我们添加一个打印语句并紧跟一个函数调用，以便我们知道项目列表里有什么：


    ![arg 代码示例](img/image_rsrc3J4.jpg)


    当你运行它时，注意它是一个“元组”（tuple），并且是有序列表。因为它是列表，我们能够遍历它（第 5-6 行）并对列表中的项执行某些操作。在我们的案例中，我们只是打印了它们。


