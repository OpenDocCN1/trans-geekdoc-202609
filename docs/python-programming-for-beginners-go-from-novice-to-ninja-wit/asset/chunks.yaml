- raw: 'If you''ve come this far, that means you''ve already set up Python on your
    machine. Congratulations! I think that''s the hardest part of the whole process.
    Now the fun begins! So, let''s get started on the classic “Hello, world!” program.
    For most programming languages, the “Hello, world!” program is the rite of passage
    into any new coding language you embark upon. By the time you are done with this
    section, you''ll have written and executed your first Python program!


    # Launch Your Code Editor


    If you installed VSCode, just open that and create a new file using these steps:


    *   Click File → New File (CTRL+ALT+WIN+N).


    *   When prompted, give the file a name like “hello.py”. It must have the “.py”
    extension.


    *   Save it.


    # Write Your First Piece of Python Code


    Just type this into the code editor:


    print(“Hello, World!”)


    # Running Your Code


    First, be sure to save your file if you have not already. In VSCode any file(s)
    that have not been saved yet will have a dot next to the file name. ![](image_rsrc3GF.jpg)


    Second, open a terminal window in VSCode. To do that, go to the top menu and click
    Terminal \>> New Terminal. (CTRL+ \`) For the keyboard shortcut, the backtick
    (\`) is usually located under the ESC key. The terminal screen will appear at
    the bottom of the VSCode window.


    ![A screenshot of a computer Description automatically generated](image_rsrc3GG.jpg)


    Third, navigate to where you saved your file. If you don''t remember where that
    was, look just above your first line of code in the code editor. You''ll see the
    path spelled out for you. Navigate to that path in the terminal window.


    For Windows:


    cd path\\to\\your\\file


    For macOS and Linux:


    cd /path/to/your/file


    (“CD” = change directory or change disk)


    Fourth, type python hello.py without the quotes. If everything runs right, you
    should see “Hello, World!” in the terminal.


    ![A computer screen shot of a program Description automatically generated](image_rsrc3GH.jpg)


    | ![A black background with a black square Description automatically generated
    with medium confidence](image_rsrc3GJ.jpg) || In VSCode, if you want to clear
    the screen, just type “clear” without the quotes and press ENTER. |


    | --- | --- |


    | ![A black background with a black square Description automatically generated
    with medium confidence](image_rsrc3GJ.jpg) || If you want to reuse a command you
    just typed, use the up or down arrow to cycle through recent commands. |


    | [Tip icons created by Pixel Perfect - Flaticon](https://www.flaticon.com/free-icons/tip)
    |


    |  ||  |


    By the way, congratulations! You just created your first piece of Python code!
    You are a Python coder now! (Too late. You can''t go back.)


    Now let''s take a close look at the code you just wrote.


    # Understanding the Code


    print(“Hello, World!”)


    *   This command is using a function and a variable.


    *   When you call a [function](#part0017.xhtml#a3ES), you always end it with a
    pair of parentheses (“parens” for short), even if you don''t put anything in them.
    This is how Python understands you''re calling a function and not just randomly
    typing in a word.


    *   Inside the parens of the print() function, we passed in a string variable.
    A [variable](#part0017.xhtml#a3EE) is a value that can change. They are passed
    to methods and functions to be acted upon. In our example, we passed the string
    variable “Hello, World!” to the print() function so it could show that on the
    screen. Because it is a variable, we could have put any string we wanted. For
    example, we could have put, “I miss Tom Brady!” and our code would have said that
    instead. What is important to note is that string variables must always be surrounded
    by quotes.


    *   We did not use this in our code, but in Python, if you want to add a comment
    to your code, you would precede your comment with a # (hash/pound sign). Don''t
    confuse that with a hashtag you might use on social media. Not the same thing!
    When Python sees a #, it knows it''s not supposed to process that line as code.
    It is just a comment for the sake of the programmers looking at it.


    *   Below is an example of a code comment.


    ![](image_rsrc3GK.jpg)


    As you can see, line one only appears in my code. It does not appear in the output.


    # Why are comments important?


    Comments are important because they are a good way to document your code to explain
    what you were doing and why when you wrote the code. This way, when you or someone
    else comes back to it, you have your notes to jog your memory.


    # Section 2: Python Variables and Data Types


    # Variables


    Variables are a crucial part of programming. They make your code dynamic. In the
    “Hello, World!” example, we used a variable in the print() function. Thanks to
    variables, the print() function can do more than just say “Hello, World!” It can
    say all kinds of things.


    In Python (and most other coding languages), a variable is a container for storing
    data. Let''s say you had a recycling station with four receptacles. The first
    was labeled “Glass”. The second was labeled “Plastic.” The third was labeled “Paper.”
    And the fourth was labeled "Aluminum cans.” Now it''s recycling day and you''re
    the guy who has to take everything to the recycling plant. In an ideal world,
    each of your containers would only contain what the label said. Those were the
    variables. But we don''t live in an ideal world. Not everybody follows the rules,
    and it would not be surprising to you as the recycling guy to find stuff in the
    wrong containers or to find stuff that didn''t even belong in the containers (concrete
    blocks, 2x4s, etc.)


    In the coding world, it''s not so chaotic. Variables have types.


    # Data Types


    Data types determine what kind of data a variable can hold. If a variable is declared
    to be of type string, it can only have strings (or characters) in it. Data types
    are crucial in programming languages because the data type of a variable determines
    what kinds of operations can be performed with that variable. For example, if
    I had a variable called “Y” and gave it a data type of string and then stored
    the string “dog” inside it, that would be fine. But then if I tried to multiply
    variable Y by 3, I''d get some kind of data type error because you can''t multiply
    “dog” \* 3. It makes no sense. Variables all have data types, and those types
    must be respected.


    This list shown here is just to give you an overview. Don''t get too bogged down
    trying to figure everything out here. Things will make more sense as we progress
    through the book.


    *   Integers (int): These are whole numbers both positive and negative. (Ex.:
    0, -1, 23)


    *   Floating-point Numbers (float): These are numbers both positive and negative
    with decimals. (Ex.: 0.34, 3.14, -1.72)


    *   Strings (str): These are sequences of characters. Strings can be enclosed
    with single ("), double ("), or triple quotes (""", or """). (Ex.: "dog", "12345",
    "jumping the shark"). When you enclose a number with quotes, it becomes a string
    representation of that number, not the value. I can add 7+7. I cannot add "7"
    + 7.


    *   Boolean (bool): Booleans represent true or false values. They are crucial
    to conditional statements.


    *   Lists: These are ordered collections of elements. This means items in a list
    will each have an index indicating their position in the list. You can add or
    remove items from a list as needed. Lists can be of various data types and are
    enclosed in square brackets (\[ \]). For example, \[5,6,7\] and \["eggs", "bacon",
    "toast"\] are both lists. The first one is an integer list and the second is a
    string list.'
