    will display our grids side by side.


    The ''figsize'' attribute determines the size of each displayed grid. In our case,
    each grid will be 10 inches wide by 5 inches tall.


    The "subplots" method returns two values: a figure that contains all the elements
    for the given chart, and an array of Axes (or axs) objects. Think of Axes objects
    as the elements of the chart structure and the figure as the container that the
