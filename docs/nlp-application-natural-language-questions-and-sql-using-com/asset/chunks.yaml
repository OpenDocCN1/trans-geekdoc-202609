  trans: '


    表 17 (附录 9) 突出了文献中主要的相似工作，并与本研究提出的工作相比，总结了它们的优缺点。


    接下来按时间顺序排列了相似工作的布局。该部分也在表 17、附录 9 (图 5) 中进行了总结。


    ![图 5 研究思路及其当前现有解决方案。](img/fig5_B.jpg)


    图 5 研究思路及其当前现有解决方案。


    # 4 实施计划


    DOI: [10.1201/b23367-4](https://dx.doi.org/10.1201/b23367-4)


    当前的研究框架组件从 `NLIDB` 接口开始，用户通过它输入 `NLQ` 句子。为了理解输入的 `NLQ`，`NLQ` 必须通过底层 NLP 任务（如 `lemmatizing`、`tokenizing`、`annotating`
    和基于规则的解析）进行 `POS` 识别。下一步 `disambiguation` 是一个条件步骤，只有当 `NLQ` 存在模糊的 `POS` 词时才会经过该步骤（例如：“content”是名词还是形容词？“separate”是动词还是形容词？）。之后，识别出的
    `NLQ` 标记将被交付到 `matcher/mapper` 步骤，将这些标记映射到 `RDB` 模式模式的 `MetaTables` 元素中，并将识别出的词汇映射到
    `SQL` 子句中。匹配到的词汇将用于接下来的 `SQL` 生成步骤，该步骤将随后执行。


    ## NLQ 输入接口


    在运行任何脚本之前，必须下载所需的依赖项和包（这些包都是开源且可用的），并通过 Python 终端进行下载和导入。然后，用户将在数据输入接口中插入一个 `NLQ`。用户将返回来自
    `MySQL` 数据库生成的 `SQL` 结果或错误提示。错误提示可能涉及输入的 `NLQ` 语言问题，或者由于 `RDB` `MetaTable` 中的
    `NLQ` 参数存在多个匹配或完全无匹配的错误。


    `NLQ` 和 `RDB` 的 `MetaTables` 是通过向 `RDB` 元素或 `NLQ` 标记添加跨度标签创建的，以便将其与其语法和语义角色关联。它们还使用
    `WordNet` 本体论函数对其同义词进行标注。添加 `MetaTables` 数据的成本相对于 `RDB` 本身的大小是极小的。对于小型 `RDB`，它可以在原始
    `RDB` 大小的基础上额外增加 3%。对于较大的 `RDB`（例如 `WikiSQL`），它可能会增加高达 10%的额外存储空间。当 `RDB` 变化时，翻译处理不受更新的影响，因为添加的条记录都将由框架自动注释，包含必要的注释和元数据。


    `NLQ` 通过 `NLI` 屏幕作为输入数据插入，长度最多 200 个字符，这得益于两个 Python 库：“server.bot”（接受输入的 `NLQ`）和
    `text_processing.text_nlp”（后者通过分离单词并将其作为参数传递给下一个模块来初始处理 `NLQ`）。`NLI` 将 `NLQ` 单词识别为参数，这将在以后帮助准备以识别它们的语义和语法角色。图
    6 简要总结了将 `NLQ` 转换为 `SQL` 语句的步骤。这些步骤将在本章中进一步明确。


    ![图 6 详细的研究架构流水线。](img/fig6_B.jpg)


    图 6 详细的研究架构流水线。


    ## POS 识别


    多层翻译算法框架将 `NLQ` 拆分为其组成标记。然后，这些标记与 `RDB` `MetaTables` 的内容进行比较，以提取出 `NLQ` 句子中的关键词。通过标记匹配模式数据（即词汇），`NLQ`
    能够进行语义解析，以识别标记的语义角色框架（如名词、动词等），这有助于翻译过程。语义解析是通过使用 `Stanford CoreNLP` 库生成解析树完成的，输入来自英语本体
    `WordNet`，它为系统提供 `NLQ` 单词含义（语义）。


    对 `NLQ` 字符串执行的第一个过程是 `lemmatizing` 并将其单词还原为分解后的原始词根形式。这是通过删除单词的词变化后缀并返回其基础形式来实现的，例如将‘entries’转换为‘entry’。词性还原简化了等效
    `RDB` 元素的选择和映射过程。它也有助于标记的语法和语义意义的识别。然后是根据预定义的语法规则和内置语法角色对单词词根进行解析和 `tokenizing`
    分为标记的步骤。这些语法角色将映射到特定的 `RDB` 元素，例如 `NLQ` 动词将映射为 `RDB` 关系。


    对于任何 `NLQ` 翻译过程，解析后的标记及其随后的 `POS` 标签都必须被清晰、准确地识别。这是通过底层的多层流水线完成的，该流水线从标记 `NLQ`
    `POS` 开始。然后，应用分词器、标注、语义和语法（基于规则）解析器，并移除任何标点符号。此步骤的一部分是从 `NLQ` 词组中省略系统定义的无意义冗余词（例如
    a, an, to, of, in, at, are, whose, for 等）。解析后，生成解析树并将标记的名称、语法角色和同义词维护在 `NLQ` `MetaTable`
    中。此外，还会识别 `NLQ` 的主语、宾语、动词和其他语言角色。因此，每个标记单词由语法分析器注册到 `NLQ` `MetaTable` 中。标记随后传递给语义分析器进行处理。


    语义分析器使用语言词典或本体（如 `WordNet`）采用类型识别器。类型识别器（如 `WordNet`）识别单词或短语（如普通名词）在句子中扮演什么样的语义角色，以及赋值者。此外，语义分析器能够识别条件或符号词，并将其映射为语言本体中的相应表示。例如，“bigger
    than”短语将被替换为运算符 `>`。换句话说，语义分析器的实体标注器检测 `NLQ` 实体中的条件或符号词。然后，它将其替换为之前由模式标注器识别的等效语义类型。实体替换创建了
    `NLQ` 的新形式，便于 `SQL` 生成器或模式匹配器检测。


    实体标注器不是 `NLQ` 处理的唯一标注器。还有其他 `NLQ` 经过的标注器，例如数值标注器、日期标注器、比较标注器等。在未来的工作中，此步骤可以进一步改进，以搜索之前的标注结果，以检查任何存储的词汇化规则模式。这将有助于更快地确定合适的
    `SQL` 模板类型或其进一步子查询划分。


    `NLQ` 被转换为标记流，并为 `NLQ` 的每个单词提供标记 ID。标记被归类为相应的语言类别，如名词、代词、动词或字面值（字符串/整数变量）。算法根据其语言类别和语义角色将标记映射到表、属性、值或关系。获取的其他信息将根据标记的标记形成
    `SQL` 查询子句（即比较或操作表达式）。


    '
