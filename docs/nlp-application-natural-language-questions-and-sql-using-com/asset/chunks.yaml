- raw: 'Moreover, the area under the ROC curves, called AUC and shown in [Figures
    18](#ch6.xhtml#fig18) and [19](#ch6.xhtml#fig19), for Zomato RDB is almost 100%
    while WikiSQL AUC area is 93%. We conclude from this AUC comparison that the proposed
    algorithm shows accurate results for smaller RDBs, but not as much accuracy for
    RDBs that cover big data.


    ## Implementation limitations


    ### Mapping Limitations


    The reason for the lack of accuracy in bigger RDBs, according to the proposed
    algorithm’s experiments, is the system’s confusion between the actual RDB elements’
    names in the RDB MetaTable and the synonyms table as a whole. Thus, if a field
    is actually named “Birth\_Day”, and another field is named “BD” but has a synonym
    of “Birthday”, the system will give priority to the field named “Birth\_Day”,
    which is the main source of confusion. However, the adoption of the synonym’s
    table in NLP is quite immature and could be improved using appropriate machine
    learning techniques. Such techniques include classifying the synonyms and recognizing
    the actual column names.


    Another cause of inaccuracy in the proposed framework is the mapping table. When
    NER or data profiling is used to import RDB’s unique values and fields and tables’
    names, the algorithm will be obstructed from correctly mapping an NLQ token to
    an RDB value. This occurs when the NLQ token is not a unique value and therefore
    not included in the mapping table. Though the algorithm is supposed to search
    for the mentioned NLQ value in the whole RDB, it still starts with the RDB’s unique
    values table (the mapping table) to minimize the searching time. This precedence
    prioritizes the RDB’s unique values list, stored in the mapping table, over the
    entire RDB elements which increases the chances that the included unique values
    are mistakenly selected as a matching lexicon. Yet the value retrieval accuracy
    would still not be guaranteed since this depends greatly on how clearly the data
    clerk have entered the data and whether it had adequate synonyms attached to it.


    ### SQL Generation Limitations


    Other minor SQL generation errors, especially in the WikiSQL RDB, were due to
    the system’s inability to grasp a thorough semantic understanding of the NLQ.
    An example is the system’s inability to understand that the “king’s speech” is
    the same as the “speech of the king”. Other errors were related to SELECTing the
    wrong field due to NLQ’s unresolved ambiguity.


    In addition, the huge size of the WikiSQL RDB increases the likelihood of the
    presence of similarly named fields and tables which might even have identical
    labeling and synonyms. To mitigate this problem, RDBs must be preprocessed to
    have unique attribute and table names. Based on the proposed system and experiment
    results, the smaller the NLQ/SQL training patterns set the better results the
    system produces.


    Larger sets have higher chances to cause rules conflictions or complications,
    while adding more rules would not always solve this conflict or increase results’
    accuracy. Translation failures could also be due to missing SQL clauses and not
    being retrieved because of ambiguous NLQs, or possibly due to mismatching in nested
    SQLs.


    ### General Implementation Limitations


    In the proposed system, the aim is building an automatic NLQ translation into
    an understandable language by a machine, that is SQL. However, NLIDBs require
    a significant amount of manual work for rule-based constraints, grammar specifications
    and RDB MetaTables annotation. In addition, RDB entities must be organized by
    properly naming tables and fields, converting all relationships’ names into verbs,
    defining unique tables and identifying stored data types. With all said efforts,
    there is no need for a tailored data dictionary like most NLIDB question answering
    systems. This is because the designed MetaTables already have all knowledge-based
    facts needed for NLQs translation. On the other hand, the algorithm does require
    a significant amount of manual work in exchange, which can be worth it if the
    system will not need heavy future maintenance or customization along the way.


    There are other general implementation limitations in this work, such as:


    *   The use of MetaTables as a Knowledge Base implies that the system is domain-dependent.
    This mandates MetaTables reconfiguration on any other RDB system, on which it
    is implemented, to be used by a DBA. The amount of manual work required is preprocessing
    the new RDB to have unique attribute and table names. Also, any acronyms or abbreviations
    must be excluded and changed to their proper namings as it is hard for the system
    to annotate acronyms with synonyms. The rest of the reconfiguration process is
    automatic in that the system has to process the RDB to be annotated and tagged
    with necessary metadata as illustrated in the RDB MetaTable.


    *   The Zomato RDB mapping table covers unique values of 5 fields and is about
    12 KB, but with a larger DB, the mapping table becomes a limitation on the system
    resources (i.e., storage disks). As such, about 10% extra storage on large RDBS
    will be required to store all the metadata present in the RDB MetaTable.


    *   After executing SQL statements, the results returned are in a less human-understandable
    format; that is, columns and rows. Hence, the result should be manipulated to
    enable its presentation in an NLQ format. As an example, Yes/No questions, such
    as “Is there inpatients in the ICU Ward 5?”, will return records if the answer
    is “Yes” and return no results if the actual result is “No”!


    *   The coding language used to implement such an algorithm must possess the capability
    to connect to an RDBMS and handle NLP tasks, i.e., Python or Java.


    *   Some queries are unanswerable and cannot be converted to SQL because they
    are too general, i.e., “Who is alive?” Another reason could be that the NLQ equivalent
    token in the RDB or its MetaTables cannot be mapped due to vague terms used in
    the NLQ sentence, i.e., “young” instead of “age between 4 to 7” or “heavy” instead
    of “weight more than 100 kilograms”. The direct reason for unanswerable queries
    is the nonexistence of any matching records to the query conditions and constraints.
    In this case, the adoption of Fuzzy Logic solutions is necessary.


    *   Limitations regarding SQL language itself. For example, there is no loop operator
    or curser management capability in SQL. Also, expressing a universal quantifier
    in SQL requires a double-negated EXIST construct.


    *   Complicated or nested queries (i.e., aggregate functions) are not covered
    in the proposed algorithm as the model is tested on simple SELECT statements only.
    The current approach can be expanded to more complex queries. However, that might
    require an SQL construction module rather than an SQL template generator.


    *   The system has no embedded temporary memory (i.e., Cache or RAM) that stores
    past NLQs for accelerated frequent data retrieval. Temporary storage memory could
    also be used to store recently retrieved tables temporarily in case the user asks
    a follow-up question. It would be helpful if the temporary memory hosts related
    data until the user asks an NLQ of a different subject.


    # 8 Conclusion and Future Work


    DOI: [10.1201/b23367-8](https://dx.doi.org/10.1201/b23367-8)


    ## Conclusion


    It is almost impossible to find a technical application that does not require
    some sort of data storage and retrieval. The era of HCI, and the means of interaction,
    that is NLP, is in an ever-growing mode. In summary, the proposed algorithm aims
    at solving the language translation gap in the literature with the proposed mapping
    algorithm. The algorithm is designed to work on any RDB schema domain.'
