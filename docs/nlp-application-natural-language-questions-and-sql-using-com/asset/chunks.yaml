- raw: 'Authors of \[[79](#reference.xhtml#refbm_79)\] aim to explore NLQ constructs’
    relationships with the OO world for the purpose of mapping NLQ constructs that
    contain vague terms specified in fuzzy modifiers (i.e. ‘good’ or ‘bad’) into the
    corresponding class diagrams through an NLI, to eventually form an SQL statement
    which, upon execution, delivers answers and a corresponding degree of vagueness.
    Authors focused on the fuzzy set theory \[[49](#reference.xhtml#refbm_49)\] because
    it is a method of representing vague data with imprecise terms or linguistic variables
    \[[85](#reference.xhtml#refbm_85), [86](#reference.xhtml#refbm_86)\]. Linguistic
    variables consist of NL words or sentences (i.e. old, young), excluding numbers
    (i.e. 20 or 30), yet imprecise NLQ terms and concepts can be precisely modeled
    using these linguistic variables by specifying natural and simple specifications
    and characterizations of imprecise concepts and values.


    In \[[79](#reference.xhtml#refbm_79)\] real-world objects’ connectivity paths
    are mapped to SQLs during the NLQ execution by extracting the class diagram from
    the NLQ in a form of a sub-graph/tree (a validation sub-tree) of the SOM diagram
    that contains relevant objects connecting the source and the target, that have
    been identified by the user earlier in a form of objects and attributes. The source
    is objects and their associations that have valued attributes to illustrate the
    relationship of objects and attributes of interest, while the object of ultimate
    destination is the target. Results are then sent to the connectivity matrix to
    look for any existing logical path between the source and the target to eventually
    map the logical path to an equivalent QL statement which can be simplified by
    inner joins. Schema and membership function represented in class diagram are used
    to link each fuzzy modifier with their corresponding fuzzy classes.


    Isoda \[[87](#reference.xhtml#refbm_87)\] discovered that OO-based analysis applications
    enable intuitive and natural real-world modelling by identifying the corresponding
    classes of those real-world objects.


    Moreno and Van \[[88](#reference.xhtml#refbm_88)\] proved that NLQs constructs’
    conceptual modeling formalization can be mapped naturally into an OO conceptual
    model, just like how Metais \[[89](#reference.xhtml#refbm_89)\] mentioned about
    NLQ and DB conceptual schema, and how efficient they are at representing the real
    world’s conceptualization features.


    Yager et al. \[[90](#reference.xhtml#refbm_90)\] prove that the fuzzy sets (consists
    of fuzzy terms like young and rarely) theory provides a linguistic-based application
    of NLQs modeling. Furthermore, fuzzy NLQs allow users to describe real-world objects
    more intuitively through vague predicates including larger number of tuples.


    Based on \[[79](#reference.xhtml#refbm_79)\], fuzzy NLQs with linguistic terms
    and fuzzy terms are more flexible compared with precise NLQs as they provide more
    potential answers in case of no available direct answers. Regarding the linguistic
    inter-relationship with DB schema, NLQs are linguistically analyzed to reduce
    ambiguity and complexity by using a linked dictionary and predefined grammar-based
    rules, while a DB schema acts as a DB conceptual design blueprint.


    In the same vein, Owei \[[91](#reference.xhtml#refbm_91)\] came up with a concept-based
    QL that facilitates query formulation by means of DB queries’ conceptual abstraction
    to exploit the semantic data models and map NLQ’s constructs to their equivalent
    specific objects in the real-world DB.


    L2S \[[92](#reference.xhtml#refbm_92)\] is a hybrid approach to transform NLQs
    into SQL. It maps NL vocabularies to SQL using semantic information via underlying
    tools and uses bipartite tree-like graph-based processing models for handling
    and evaluating the remaining lexicons for the matching stage. This hybrid approach
    was designed to help language transformation systems that lack adequate training
    data and corpus, specific domain background knowledge and observation analysis
    and inefficient employed NLQ linguistic tools (e.g., tokenizer and parser).


    Most language transformation approaches or question answering systems rely on
    rich annotated training data with employed statistical models or non-statistical
    rule-based approaches. Generally speaking, rule/grammar-based approaches \[[93](#reference.xhtml#refbm_93)\]
    require extensive manual rules defining and customizing in case of any DB change
    to maintain accuracy and is used more often in real-life industrial systems \[[94](#reference.xhtml#refbm_94)\].


    Statistical models are mostly used in academic research, and they work by building
    a training set of correct and incorrect NLQ to SQL pairs \[[24](#reference.xhtml#refbm_24)\].
    The language transformation then becomes a binary classification task to correctly
    map and label each NLQ to its equivalent SQL. In addition, ML Features extraction
    is derived from tokens and syntactic trees of correctly mapped and labeled NLQs
    into SQLs transformation processes \[[95](#reference.xhtml#refbm_95)\].


    In addition to statistical and non-statistical models, there are syntactic-based
    analysis \[[59](#reference.xhtml#refbm_59)\] that is not rule-based, as well as
    graph-based models \[[47](#reference.xhtml#refbm_47)\] and Prolog-like representation
    \[[96](#reference.xhtml#refbm_96)\], in addition to complex NLQ to SQL transforming
    operations in frameworks such as the high-level ontology data representation with
    huge amount of data.


    L2S functions are spread across three steps \[[92](#reference.xhtml#refbm_92)\].
    During the first pre-processing step, NLQ and DB are analyzed, and all ML features
    are extracted. This step is supported by three pre-processing components: a linguistic
    component that analyzes the NLQ to generate the list of lexicons and discover
    any conditional tokens (i.e. greater/less than). This component has embodied tools
    such as Name Entity recognizer (NER) \[[97](#reference.xhtml#refbm_97)\] and Coltech-parser
    in GATE \[[98](#reference.xhtml#refbm_98)\] to extract semantic information that
    lies within an NLQ. Also, this component handles the NLQ tokenization and named
    entity tagging by using Java Annotation Patterns Engine (JAPE) grammars. The output
    of this first step is an attachment constraint. The second component is the lexicon,
    used for DB elements analysis and their attachment constraints. The third component
    is the ambiguity Solving, used for NLQ input correction to guarantee an ambiguity-free
    NLQ. In this Component, L2S compares all NLQ tokens with DB elements to find out
    the ambiguous tokens that match with non or more than two DB elements through
    the use of ellipsis method or the highest possibility selection. The next L2S
    step is the Matching step which has two main components, the Semantic Matching
    and the Graph-Based Matching components. This step handles the interlingual mapping
    to produce equivalent SQL elements to the output of the first step. The third
    step is generating a complete and accurate SQL statement. Authors of \[[92](#reference.xhtml#refbm_92)\]
    built a mapping table manually to match the DB lexicons with the NLQ tokens. L2S
    transforms NLQ and DB elements into a tree-like graph, then extracts the SQL from
    the maximum bipartite matching algorithm result. L2S effectiveness was validated
    and the results maintained high accuracy over different domains. It was also proved
    that switching domains requires minimal customization work.'
