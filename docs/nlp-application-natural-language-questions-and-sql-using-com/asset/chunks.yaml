  trans: "\n映射过程根据一个手动编写的基于规则的映射约束算法进行。开发了两个映射器（mapper）：一个将 `NLQ` 令牌映射到 `RDB` 元素，另一个将识别出的\
    \ `RDB` 词汇映射到 `SQL` 子句。该算法首先通过执行一系列 NLP 任务来分析输入的 `NLQ`。在每个分析阶段，数据都会被进一步处理，以形成并生成\
    \ `SQL`。最后，执行 `SQL` 并从 `RDB` 中获取数据并显示给用户。\n\n所提出的算法通过以下解决方案涵盖了许多近期文献工作的不足：\n\n\
    1. 限制了与用户的人机交互（HCI），以确保最自然的沟通方式，即直接的问答。通过这种方式，用户不需要识别任何 `NLQ` 令牌的语义角色。\n2. 不需要标注的\
    \ `NLQ`/`SQL` 对语库进行训练，使其具有领域无关性并能适应任何环境。\n3. 使用基于计算语言学的简单算法规则来完全理解输入的 `NLQ`，以获得最佳的翻译准确性。\n\
    4. 发明了 `NLQ` 和 `RDB` 的元表（MetaTables），以增加 `NLQ` 令牌、`RDB` 词汇以及 `SQL` 子句之间的映射准确性。\n\
    5. 将 `NLQ` 动词与 `RDB` 关系映射，这是表示 `RDB` 元素关系最简单且有效的方法。\n6. 通过使用支持性的元表和 `WordNet`\
    \ 本体论，克服了任何底层语言工具性能不佳的问题。\n7. 使用计算语言学算法（元表约束）支持 `NLQ` 的句法和语义语法分析。这些约束有助于 `NLQ`\
    \ 令牌向到 `RDB` 词汇的映射，而无需使用高权重且复杂的技巧。\n8. 提出了一种显著更简单的算法，因为它依赖于更少但更有效的语言工具和映射规则，且没有使用中间表征层。\n\
    \n据我们所知，这项关于 `NLQ` 到 `SQL` 映射和翻译的建议研究提出了一种新颖的机制。这项工作通过使用强大的底层 NLP 技术的简单语言翻译算法，弥补了\
    \ `RDBs` 与非技术数据库管理员之间的鸿沟。这项工作使没有 `RDB` 语义知识的非技术用户具备了从所使用的 `RDBs` 中检索信息的能力。\n\n\
    所提研究实验和结果的验证显示出优的 `NLQ` 到 `SQL` 转换和翻译性能。因此，较小的 `RDB` 实现了 95% 的准确率，高于较大的 `RDB`（后者得分约为\
    \ 93%）。这一结论与应用的性能指标和衡量标准一致，如准确率、精确率、召回率和 `F-Measure`。\n\n然而，实验中较大的 `RDBs` 显示了明确的改进领域，以将其语言转换准确性提高到\
    \ 93% 以上。另一个较大的改进领域是进一步简化算法编码，并在更好的实现环境和技术资源上进行测试。目标是最小化翻译时间，因为在给定 `NLQ` 的情况下，返回格式良好的\
    \ `SQL` 平均需要 1.5 分钟。\n\n## 未来工作\n\n由于围绕 `NLIDBs` 的研究仅有几年，有许多未来的工作机会可以扩展这项工作，包括但不限于：\n\
    \n* 采用 `NoSQL` 查询。\n* 扩展到分布式存储 `RDBs`。\n* 采用社区检测算法。\n* 领域无关的模式构建。\n* 通过模糊约束解决\
    \ `NLQ` 的歧义和不确定性。\n* 通过存储模糊属性值和模糊真值的模糊 `RDBs` 处理模糊和不精确的数据。\n* 为 `NLQ` 输入附加一个设计良好的用户界面。\n\
    * 研究基于权重方案或错误/正确率的用于 `SQL` 排名和分类的神经网络学习方法。\n* 处理带有 `NLQ` 修饰符（如几乎、接近、非常）的 `NLQs`。\n\
    * 处理用 `NLQ` 表达的 `NLQs`（例如：通过、期间、由于）。\n* 输出并从 `SQL` 翻译结果转换为 `XML` 格式。\n\n## 附录\
    \ 1\n\n## 附录 2\n\n## 附录 3\n\n## 附录 4\n\n## 附录 5\n\n## 附录 6\n\n### 包含的 `SQL` 查询\
    \ 类型\n\n* **简单查询**：\n    * 在表中选择 1 或多个列，不带条件显示所有数据。\n* **嵌套查询（子查询）**：\n    * 使用语义语法解析将\
    \ `NLQs` 映射到其 `SQLs`，在表中选择 1 或多个列。\n* **级联查询**：\n    * 在 `SQL` 语句中使用 `WHERE` 子句连接\
    \ 2 或多个表，如果 `table-name1` 的主键（PK）等于 `table-name2` 的外键（FK），在 `table-name1` 中。\n\
    * **否定查询**：\n    * 使用 `NOT` 操作符在 `WHERE` 子句中进行训练。\n* **简单 WHERE 条件**：\n    * 1\
    \ 个操作条件（`=`、`<>`）。\n    * 1 个聚合条件（`max`、`min`）。\n    * 否定条件（`NOT`）。\n* **复杂 WHERE\
    \ 条件**：\n    * 2 或多个操作条件（`=`、`<>`）。\n    * 2 或多个聚合条件（`max`、`min`）。\n    * 用户指定的连接。\n\
    \    * 2 或多个否定条件（`NOT` `AND`）。\n    * 包括从句和连词\n* **排序/分组**：\n    * 升序（`Asci.`）。\n\
    \    * 降序（`Desc.`）。\n\n## 附录 8\n\n## 附录 9\n\n### 表 17 文献比较\n\n| # | 领域 | 现有解决方案\
    \ | 优点 | 缺点 | 本文不同之处 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | `NLQ`\
    \ 到 `SQL` 映射 | 基于接口的系统 | 使用语义语法规范，为语言表达式提供准确的规则。 | 高度依赖用户在界面上修改使用的关键词或短语。 | 需要大量的专家投入来识别和指定\
    \ `RDB` 元素和概念。 | 仅在 `NLQ` 单词拼写错误或歧义短语的情况下涉及用户。对于语言表达式的语义解析，使用了 NLP 工具进行词还原、分词、定义和标记每个\
    \ `NLQ` 令牌。 |\n| 2 | 通过归归逻辑编程丰富 `NLQ`/`SQL` 对 | 广泛应用于机器学习问题。 | 提供逻辑知识和推理。 | 在数据库变化时需要大量的手动规则定义和自定义以保持准确性。\
    \ | 所实现的基于规则的观察算法完全与领域无关，并可以迁移到任何自然语言翻译框架。 | 为 `NLQ`/`SQL` 对添加额外的元数据，以便为 `NLQ`\
    \ 的歧义短语找到语义解释以实现准确映射。 |\n| 3 | 使用机器学习算法 | `NLQ`/`SQL` 对语库引导语义语法解析将 `NLQs` 映射到其\
    \ `SQLs`。 | 通过训练支持向量机 (`SVM`) 分类器，这是高维数据集的高效机器学习算法。 | 需要巨大的领域特定 `NLQ`/`SQL` 翻译对语库。数据准备耗时且枯燥。\
    \ | 需要领域专家来训练和测试系统。 | 系统过度定制，在任何其他领域均无法运行。 | 假设用户熟悉数据库模式、数据和内容。 | 过度依赖机器学习对于降低翻译错误率或提高准确性并不有效。\
    \ | `SVM` 算法需要大量的内存空间。 |\n"
