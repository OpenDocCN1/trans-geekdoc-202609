    Uses reinforcement learning and rewards from in-the-loop query execution to learn
    an `SQL` generation policy.


    - Incompatible with cross entropy loss optimization training tasks.

    - Requires manually annotated `NLQ`/`SQL` pairs for generating the `SQL` conditions.

    - Execution accuracy is as low as 59.4% and logical form accuracy is 48.3%.

    - Proved to be inefficient and unscalable on large `RDBs`.


    - Uses manually written rule-based grammar for the mapping.

    - Produces high measures of accuracy and recall.

    - No need for training and testing labeled data.


    ### 40 | MLA Sequence-To-Sequence-Style Model


    - Employs a mapping algorithm without reinforcement learning.

    - Showed small improvements to generate `SQL` queries when order does not matter.

    - Solves the “order-matters” design problem.


    - Has very low performance measures.

    - Had to use dependency graphs and the column attention mechanism for performance
    improvement.

    - The model has to be frequently and periodically retrained to reflect the latest
    dataset updates, which increases the system’s maintenance costs and computational
    complexity.


    - Translates `NLQs` into `SQLs` while maintaining high simplicity and performance.

    - The system does not need to be updated or maintained periodically.


    ### 41 | A Deep-Learning-Based Model


    - Predicts and generates the `SQL` directly for any given `NLQ`.

    - Uses attentive-copying mechanism, a recover technique and task-specific look-up
    tables, to edit the generated `SQL`.

    - Overcomes the shortcomings of sequence-to-sequence models.

    - Proved its flexibility and efficiency.


    - `NLQ`/`SQL` pairs were manually written for model training and testing.

    - The used `RDB` is specifically customized to the used framework and environment
    applied on.

    - Highly questionable in terms of generalizability, applicability and adaptability
    on other domains.


    - Uses `RDBs` that are public source namely, `Zomato` and `WikiSQL`, only for
    algorithm validation and testing.

    - Does not need labeled data for developing.

    - The translator algorithm is domain-independent and configurable on any other
    environment.


    ### 42 | RDB Lexica into SQL Clauses Mapping (Intermediate Representation) | Regular
    Expressions (regexps)


    - Represents NLP tokens phonology and morphology.

    - Uses `NLQ` intermediate semantic representation layers to represent `NLQ` lexica
    as `SQL` clauses.

    - Tokens representation happens by applying First Order Predicate Calculus Logic
    resembled by DB-Oriented Logical Form (`DBLF`) and Conceptual Logical Form (`CLF`)
    with some `SQL` operators and functions to build and generate `SQLs`.


    - `regexps` collections in `NLQ` sentences are not clearly articulated in the
    literature.

    - Proved to be not as effective as the NLP tools, `MetaTables` and mapping tables
    in terms of accuracy and precision.


    - Uses `NLQ` MetaTables and `RDB` MetaTables to increase accuracy of mappings
    between `NLQ` tokens into `RDB` lexica and then into `SQL` clauses.

    - Tries to save every possible information given by the `NLQ` so as each `NLQ`
    token is used and represented in the `SQL` clauses and expressions production.

    - Uses multiple NLP tools, `MetaTables` and mapping tables for unique values to
    fully understand the `NLQ` and map its tokens to their corresponding `RDB` elements.


    ### 43 | The Similarity-Based Top-K Algorithm


    - Processes `NLQ` tokens to map them to their internal conceptual representation
    layer.

    - Uses Entity-Attribute-Value (`EAV`) DB metadata and grammatical parse trees.


    - Proved to be not effective because of the high complexity and time consumption
    approaches applied.


    - No conceptual representation is needed for the mapping.

    - The identified attributes are automatically mapped into the `SQL SELECT` clause,
    while the tables are extracted from the `SELECT` clause to generate an `SQL FROM`
    clause, and the values are used as a conditional statement in the `WHERE` clause.


    ### 44 | Lambda-Calculus


    - Uses `lambda-calculus` to map tokens to their corresponding meaning representations.


    - A supervision-extensive system.


    - No meaning representation is needed for the mapping.

    - Does not require any human supervision to properly function.


    ### 45 | An Intermediate Tree-Like Graph


    - Transforms DB lexica into an intermediate tree-like graph.

    - Extracts the `SQL` from the maximum bipartite matching algorithm.


    - Computationally expensive and processing is time consuming.


    - No internal graphical representation is needed for the mapping.

    - Processing the mapping has an average speed of 1.5 mins.


