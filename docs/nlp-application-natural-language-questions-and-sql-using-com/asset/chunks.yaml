  trans: '

    通过对来自 Zomato RDB 的 NLQ/SQL 对进行随机洗牌，对所提出的映射算法进行测试。此步骤使用了四个库函数，即 `random.shuffle`、`collections.defaultdict`、`tqdm`
    和 `sql_parse.get_incorrect_sqls`。首先，通过向系统输入 NLQ 的词干还原标记来测试底层的 NLP 工具和 `Matcher/Mapper`
    模块。然后，这些标记通过 `Matcher/Mapper` 模块，与其在 NLQ `MetaTable` 中内置的同义词进行匹配。之后，标记及其同义词将根据其句法角色映射到相邻的
    RDB 值、属性、表或关系。为了测试 SQL 模板生成器模块，将一组 RDB 词汇传递给该模块，并对生成的 SQL 的正确性、准确性以及下一节中讨论的其他性能指标进行检查。


    ## 性能评估衡量标准


    所提算法的目的是从 NLQ 自动生成 SQL。对于这种语言翻译算法，获得可靠的性能估计至关重要。然而，算法的准确性性能可能依赖于学习算法之外的其他因素。这些因素可能包括类别分布、分类错误（代价）的影响以及训练集和测试集的大小。因此，为了验证算法的性能和效率，使用了更详细的准确性指标通过以下方式测试生成的
    SQL 的准确率、精确率和召回率：


    * 假正率 (`FPR = C/(C+D)`)：被错误分类为正例的查询，但实际上是负例。

    * 真负例率 (`TNR = D/(C+D)`)：正确分类为负例的查询。

    * 假负率 (`FNR= B/ (A+B)`)：被错误分类为负例的查询，但实际上是正例。

    * 真正例率 (`TPR = A/(A+B)`)：正确分类为正例的查询。


    其中 `A` = 真正例，`B` = 真负例，`C` = 假正且 `D` = 假负。


    此处的分类过程是将当前框架生成的 SQL 与测试 RDB 中原始存在的指定 SQL 进行比较。


    召回率性能指标代表了正确生成的正例（正确）查询的比例，`Recall(R) = A/(A+B)`。它还衡量了系统呈现所有相关单词的比例。这里的单词代表从 RDB
    中正确识别的派生词汇，并导致了正确的 SQL 生成。在这种情况下，`Recall = 从 RDB 检索到的相关单词（词汇）数量 / 未检索到的相关单词（词汇）数量`。


    精确率代表生成的正例（正确）查询中被正确生成并被视为正确 SQL 构造的比例，`Precision (P) = A/(A+C)`。它还衡量了系统仅检索相关单词（词汇）的效率。在这种情况下，精确率衡量系统检索和呈现仅相关词汇的能力。`Precision
    = 检索到的相关词汇数量 / 检索到的词汇总数`。


    此外，结果的正确性或准确性是所有生成的正例（正确）SQL 中被正确生成的比例。`Accuracy = (A+D)/(A+B+C+D)`。无序检索查询集可以通过精确率和召回率进行评估。对于排序集合，在每次查询检索后，应将精确率随召回率进行绘图。


    还会使用受试者工作特征（ROC）曲线 `[176]`。ROC 是一种关于 `TPR`（也称为敏感性）相对于 `FPR`（也称为 1-特异性）的机器学习图表。它比较了当前工作中的两个翻译实验：一个是使用
    Zomato RDB 的实验，另一个是使用 WikiSQL RDB 的实验。该分类测试考虑了当前框架生成的 SQL 以及已存在于测试 RDB 中的中的 SQL。ROC
    曲线显示了两个实验集可能连接的地方。这是因为每一个 `TPR` 或 `FPR` 预测实例都是 ROC 空间上的一个点。ROC 曲线下方的面积越大，使用相关测试的益处就越大。换句话说，越靠近左上角的预测器曲线提供了越好的准确性性能。根据输出
    SQL 与原始 NLQ 输入之间的匹配准确性，对所提算法进行了评估和记录。


    在带有 Zomato RDB 的第一个实验中，系统上执行了 20 次迭代（epochs），其中执行了输入的 NLQ 并生成其相应的 SQL 作为输出。然后，实现结果在
    `Table 13` 和 `Figure 18` 中声明了以下性能指标。


    Table 13 带有 Zomato RDB 的第一个实验混淆矩阵


    | F-Measure: 94.5 || 实际正例 || 实际负例 |

    | --- | --- | --- |

    | 预测正例 || 43 TPR (A) || 3 FPR (C)第一类错误 |

    | --- | --- | --- |

    | 预测负例 || 2 FNR (B)第二类错误 || 49 TNR (D) |

    | Accuracy: 94.85% || Recall: 0.96 || Precision: 0.93 |


    ![Figure 18 带有 Zomato RDB 的第一个实验的 ROC 曲线。](img/fig18_B.jpg)


    Figure 18 带有 Zomato RDB 的第一个实验的 ROC 曲线。


    对于带有 WikiSQL RDB 的第二个实验，实现结果在 `Table 14` 和 `Figure 19` 中声明了以下性能指标。


    Table 14 带有 WikiSQL RDB 的第二个实验混淆矩阵


    | F-Measure: 92 || 实际正例 || 实际负例 |

    | --- | --- | --- |

    | 预测正例 || 42 TPR (A) || 4 FPR (C)第一类错误 |

    | --- | --- | --- |

    | 预测负例 || 3 FNR (B) || 48 TNR (D) |

    | Accuracy: 92.78% || Recall: 0.93 || Precision: 0.91 |


    ![Figure 19 带有 WikiSQL RDB 的第二个实验的 ROC 曲线。](img/fig19_B.jpg)


    Figure 19 带有 WikiSQL RDB 的第二个实验的 ROC 曲线。


    与 WikiSQL 上的类似工作相比，所提工作在 `Table 15` 和 `Figure 20` 中展示了最高的准确性指标。


    Table 15 WikiSQL 上的 NLQ 到 SQL 翻译工作


    | # |  | 方法 | 准确率 (%) |

    | --- | --- | --- | --- |

    | 1 | 所提算法 | 计算语言学。 |

    | 2 | SEQ2SQL `[177]` | 强化学习。 | 59.4 |

    | 3 | TypeSQL `[174]` | NLQ 识别和双向 LSTM。 | 82.6 |

    | 4 | SQLOVA `[178]` | 表上下文感知 NLQ 上下文化和表示。 | 89.6 |

    | 5 | X-SQL `[179]` | 使用上下文强化模式表示。 | 91.8 |

    | 6 | WHERE 子变体 `[180]` | 注意力循环神经网络 (RNN)。 | 88.6 |

    | 7 | DialSQL `[181]` | 通过用户交互提升现有算法性能的对话框架。 | 69 |

    | 8 | SQLNet `[182]` | 依赖图、序列到集合模型和列注意力机制。 | 68.3 |

    | 9 | 问题模式 `[183]` | 包含依赖图的问题模式模型。 | 未测量 |

    | 10 | ValueNet `[184]` | 基于编码器-解码器架构的神经模型，用于合成 SQL 查询。 | 67 |


    ![Figure 20 WikiSQL 工作准确性对比图。](img/fig20_B.jpg)

