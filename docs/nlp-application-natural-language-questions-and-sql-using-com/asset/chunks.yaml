  trans: '


    1. 简单直接的问题，其语言结构简单，包含一个疑问词，语义完整且无歧义表达；或

    2. 复杂的通用问题，包含许多歧义表达和模糊谓词。这种歧义可能源于省略了必要的词、添加了无关的词、包含多个疑问词或缺少了疑问词。


    此外，`NLQ` 问题可以进一步分类为询问特定实体、数量、实体列表排名或比例关系的问题。它们也可以是疑问句，并以祈使句或陈述句的否定或肯定形式存在。NLP
    语言学工具经过训练，可以捕捉这些问题结构和类型。


    在所提的研究中，选择基于 `NLQ` 的接口作为自然语言接口数据库（`NLIDB`）系统的接口。这是这是与计算机通信的最自然方式。对于作为所提研究目标受众的决策者来说，这也是他们最理想的通信方式。此外，在尝试将其翻译为任何其他查询语言之前，系统对
    `NLQ` 的完整语义理解是最核心的部分。


    关于所采用的 `NLQ` 类型，仅考虑了简单直接的问题，即前文解释的第一种 `NLQ` 问题类型。这是因为所提研究的主要重点和贡献是映射机制，而不是解决或消除结构错误或不完整
    `NLQs` 的歧义。尽管针对简单的 `NLQ` 问题实现了一个简单的消歧模块。然而，处理复杂的通用问题（即带有聚合或否定的问题）是未来研究的主要建议之一。


    ## 词性 (POS) 识别


    为了识别 `NLQs` 的词性 (`POS`)，必须首先明确以下后续层级。


    ### 语言组件层


    在所提系统中，形态学分析在词法分析期间进行，以便识别关键词的属性并将其拆解为基本组件。形态学分析和词法分析的一个很好的例子是 `WordNet` [[19]]。它追踪关键词之间的连接，并将单词与其后缀或派生词离开来（例如，将
    `Client’s` 分离为‘client’和‘s’）。此外，`WordNet` 还将单词与其标点符号（即非词标记）隔离开来。


    其他语言组件也是当前研究框架中 NLP 工具的一部分，包括分词器（`tokenizer`）、词性标注器（`POS tagger`）、依存句法解析器（`dependency
    tree parser`）、命名实体识别（`NER`）以及语法和语义分析器，例如 `Link Grammar Parser` [[20]] 和 `Stanford
    Parser` [[21]]。这些 NLP 工具主要用于将 `NLQ` 标记转换为解析树结构，然后将它们映射到相应的 `SQL` 查询模板。语用分析（`Discourse
    Analysis` [[22]]）和语用（`Pragmatics` [[23]]）属于后一种 `NLQ` 翻译方法。`SQL` 语法解析树通常是 100%
    准确的。`NLQ` 解析树也是准确的，但通常会引入影响整体 `NLQ` 特征表示准确性的噪声 [[24]]。


    `NLQ` 语法分布在不同的语言学领域，包括语用、语用和文本理论 [[23]]。具体来说，包含的语言领域包括认知设计（`Cognitive Designs`
    [[25]]）和描述模块（`Descriptive Modules` [[26]]）。


    #### 语法解析器（基于规则）


    语法是研究单词如何组合的科学。它包含了语义、形态学、语音学，并且在句法解析之前需要 `POS` 标签。语法解析器通过其排除和包含来分析 `POS` 的范围
    [[27]]。


    在句法解析下，有以下子任务：


    1. **文本结构**：这是研究单词如何构建的科学 [[28]]。

    2. **词形还原器（Lemmatizer）**：该模块推导出每个 `NLQ` 单词的原始形式（根节点），这发生在分词之前。

    3. **分词器（Tokenizer）**：输入的 `NLQ` 通过分离标记被分词化。这些标记将传递给下一个模块。

    4. **词性标注器（POS Tagger）**：也称为词类消歧。`POS 标注` 同时考虑了单词的定义和其语境。


    #### 语义解析器（基于规则）


    语义是研究单词实际含义的科学，将句法成分与谓语联系起来 [[29]]。这是因为由句法分析器创建的所有结构都有含义。当句法结构没有语义表示时，整个句子将由语义解析器拒绝并忽略。


    `NLQs` 根据其准确的语义属性进行处理，这些属性由语义解析器等底层 NLP 工具指明。在 `NLQ` 中定义超出词法属性的信息的语境是非常关重要的。


    在语义分析和解析下，有以下定义：


    1. **语用（Pragmatics）** [[23]]：研究文本上下文如何影响表达的含义。它利用句子当前的结构表示来探索表达的隐含含义。接下来，对表达进行重新解释以确定其特定的隐含含义。

    2. **形态学（Morphology）** [[30]]：研究特定语言中的意义或功能单位（称为词素）。一个词素可以是单词、词缀、前缀或其他单词结构。

    3. **音学（Phonology）** [[31]]：研究特定语言的声音模式，以确定哪些音是有意义且显著的（音位）。音学还研究音节结构以及描述句子离散单元（段）所需的特征。

    4. **语音学（Phonetics）** [[32]]：研究口语语言的声音。语音学研究音位是如何产生和感知的。


    #### 词汇（Lexicon）


    词汇旨在研究语言词汇，即单词和短语。在当前的研究工作中，`RDB` 词汇存储在 `RDB MetaTable` 中，它用于将 `NLQ` 单词映射到 `RDB`
    中的正式表示（例如表名、属性名等）。词汇由句法和语义解析器共同分析。


    ### 中间语言表示层


