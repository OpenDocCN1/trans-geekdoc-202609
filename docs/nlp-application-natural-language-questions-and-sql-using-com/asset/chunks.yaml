  trans: '

    此外，ROC 曲线下的面积（称为 `AUC`）在图 18 和图 19 中显示，`Zomato RDB` 接近 100%，而 `WikiSQL` 的 `AUC`
    面积为 93%。通过这一 `AUC` 比较，我们得出结论：所提算法对于较小的 `RDBs` 显示出准确的结果，但对于涵盖大数据的 `RDBs`准确性不足。


    ## 实现局限性


    ### 映射局限性


    根据所提算法的实验，较大 `RDBs` 准确性的原因是系统在 `RDB MetaTable` 中的实际 `RDB` 元素名称与整个同义词表之间的混淆。因此，如果一个字段实际命名为
    `Birth_Day`，而另一个字段命名为 `BD` 但具有同义词 `Birthday`，系统将优先考虑命名为 `Birth_Day` 的字段，这是混淆的主要来源。然而，`NLP`
    中对同义词表的采用尚不成熟，可以使用适当的机器学习技术进行改进。这些技术包括同义词的分类以及识别实际列名。


    所提框架中不准确的另一个原因是映射表。当使用 `NER` 或 `data profiling` 来导入 `RDB` 的唯一值、字段和表名时，算法将阻碍正确地将
    `NLQ` 标记映射到 `RDB value`。当 `NLQ` 标记不是唯一值且因此未包含在映射表中时，就会发生这种情况。尽管算法本应该在整个 `RDB`
    中搜索提到的 `NLQ` 值，但它仍然从 `RDB` 的唯一值表（映射表）开始，以最小化搜索时间。这种优先顺序优先考虑了存储在映射表中的 `RDB` 唯一值列表，而不是整个
    `RDB` 元素，这增加了所包含的唯一值被误选为匹配词汇的可能性。然而，值检索的准确性仍无法保证，因为这很大程度上取决于数据录入员输入数据的清晰程度，以及是否附带了足够的同义词。


    ### SQL 生成局限性


    其他细微的 `SQL` 生成错误（特别是在 `WikiSQL RDB` 中）是由于系统无法对 `NLQ` 建立彻底的语义理解造成的。例如，系统无法理解“king’s
    speech”等同于“speech of the king”。其他错误与由于 `NLQ` 未解决的歧义导致 `SELECT` 错误的字段有关。


    此外，`WikiSQL RDB` 的巨大尺寸增加了同名字段和表存在的可能性，这些表甚至可能具有相同的标签和同义词。为了缓解这个问题，必须对 `RDBs` 进行预处理，以具有唯一的属性名和表名。根据所提系统和实验结果，`NLQ/SQL`
    训练模式集越小，系统产生的结果越好。


    较大的集合有更高的概率导致规则冲突或复杂化，而增加更多规则并不总是能解决这种冲突或提高结果的准确性。翻译失败也可能是由于缺少 `SQL` 子句以及由于模糊的
    `NLQs` 未被检索，或者可能是由于嵌套 `SQLs` 中的不匹配导致的。


    ### 通用实现局限性


    在所提系统中，目标是通过机器自动将 `NLQ` 翻译成人类可理解的语言，即 `SQL`。然而，`NLIDBs` 需要大量的后续工作来完成规则约束、语法规范和
    `RDB MetaTables` 注释。此外，必须正确命名表和字段来组织 `RDB` 实体，将所有关系的名称转换为动词，定义唯一的表并识别存储的数据类型。在所有这些努力之后，不需要像大多数
    `NLIDB` 问答系统那样定制数据字典。这是因为设计的 `MetaTables` 已经包含了 `NLQs` 翻译所需的所有知识事实。另一方面，算法确实需要大量的人工工作作为交换，如果系统在未来不需要沉重的维护或定制，那么这种交换是值得的。


    这项工作中还有其他通用的实现局限性，例如：


    *   将 `MetaTables` 作为知识库意味着系统是依赖域的。这要求在任何实现它的其他 `RDB` 系统上重新配置 `MetaTables`，以便供
    `DBA` 使用。所需的人工工作是预处理新的 `RDB` 以具有唯一的属性名和表名。此外，任何缩写或缩略词都必须排除并更改为它们的正式名称，因为系统很难为缩写词注释同义词。重配置的其余部分是自动的，因为系统必须处理待注释和标记的
    `RDB`，并带有如 `RDB MetaTable` 所示的元数据。


    *   `Zomato RDB` 映射表涵盖了 5 个字段的唯一值，大小约为 12 KB，但对于更大的 `DB`，映射表将成为系统资源（即存储磁盘）的限制。因此，大型
    `RDBS` 需要额外约 10%的存储空间来存储 `RDB MetaTable` 中存在的所有元数据。


    *   执行 `SQL` 语句后，返回的结果是人类较难理解的格式；即列和行。因此，应对对结果进行处理以便以 `NLQ` 格式呈现。例如，是/否问题，如“5
    号病房是否有住院患者？”，如果答案是“是”，将返回记录；如果实际结果为“否”，则不返回任何结果！


    *   实现此类算法的编程语言必须具备连接 `RDBMS` 并处理 `NLP` 任务的能力，即 `Python` 或 `Java`。


    *   某些查询是无法回答且无法转换为 `SQL` 的，因为它们太泛泛了，例如“谁活着？”另一个原因可能是由于 `RDB` 或其 `MetaTables`
    中的 `NLQ` 等效标记无法由于 `NLQ` 句子中使用的模糊术语而映射，例如用“年轻”代替“年龄在 4 到 7 岁之间”，或用“重”代替“体重超过 100”。无法回答查询的直接原因是不存在与查询条件和约束的匹配记录。在这种情况下，采用
    `Fuzzy Logic` 解决方案是必要的。


    *   关于 `SQL` 语言本身的局限性。例如，`SQL` 中没有循环操作或游标管理。此外，在 `SQL` 中表示全称量词需要双重否定的 `EXIST`
    结构。


    *   复杂的或嵌套查询（即聚合函数）未包含在提算法中，因为模型仅在简单的 `SELECT` 语句上进行了测试。当前的方法可以扩展到更复杂的查询。然而，这可能需要一个
    `SQL` 构建模块而不是 `SQL`模板生成器。


    # 8 结论与未来工作


    DOI: [10.1201/b23367-8](https://dx.doi.org/10.1201/b23367-8)


    ## 结论


    几乎无法找到不需要某种形式数据存储和检索的技术应用。`HCI` 时代以及交互手段 `NLP` 正处于一种不断增长的模式中。总之，所提算法通过所提映射算法旨在解决文献中的语言翻译差距。该算法设计用于适用于任何
    `RDB` 模式领域。

    '
