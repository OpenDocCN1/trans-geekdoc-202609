- raw: 'Those layers use a knowledge base to assist the NLQ with the SQL translation
    process. A good example for this is the discourse representation structure. This
    type of structure converts NLQs into SQLs using an ontology-based semantic interpreter
    as an intermediate language representation layer. Discourse Integration Analysis
    \[[22](#reference.xhtml#refbm_22)\] is the study of information exchange such
    as in conversations where sentences meanings may change according to the preceding/proceeding
    sentences. An example is the use of pronouns in sentences such as “He” which will
    depend on the subject or the actor in the preceding sentence. In order for the
    discourse analysis process to be thorough, the NLQ tokens must be annotated. Hence,
    the annotator is essential in this method.


    #### Annotator


    Annotations are metadata that provide additional information on particular data.
    Natural language datasets are called corpora (the plural of corpus). When a corpus
    is annotated, this is called an annotated corpus. Corpora are used to train Machine
    Learning Algorithms (MLA). The annotation types include:


    *   POS Annotation.


    *   Phrase Structure Annotation.


    *   Dependency Structure Annotation.


    In the current research work, all of the above underlying NLP layers are considered
    and implemented as part of the POS recognition module, with the exception of the
    intermediate language representation layer. The employed POS recognition Python
    library is “speech\_recognition”. This module is essential to the thorough understanding
    of the given NLQ for proper and accurate translation.


    ## Disambiguation


    In the current research work, disambiguation is only required when the mapper
    finds more than one matching RDB element to a certain NLQ token. Generally, a
    word’s meaning disambiguation has special techniques and algorithms. An example
    is the statistical keyword meaning disambiguation process using N-Gram Vectors
    \[[33](#reference.xhtml#refbm_33)\], where N ranges from 1 to the length of the
    text. N-Gram Vectors’ statistics are gathered using a training corpus of English
    language, while a customised corpus gather statistics as the system is being used.
    The latter corpus requires that the user reviews the presented NLQ interpretation
    and makes any necessary changes before submitting it for execution. N-Gram Vectors
    are principally used for capturing lexical context. It is considered as a measure
    of how likely a given token has a particular meaning in a particular user NLQ
    input. This is because every token’s meaning depends on the context in which it
    was used. This meaning comparison procedure follows a vector similarity ranking
    measure where the higher the meaning rank the closer it is to the true meaning.


    Other words’ meaning disambiguation studies involve computational linguistics
    and statistical language understanding. Such studies focus on word sense disambiguation
    within a large corpus. Another method to disambiguate a word sense is using word
    collocations. The word collocations method measures the meaning likelihood of
    more than one word when they all exist in the same NLQ. Iftikhar \[[34](#reference.xhtml#refbm_34)\]
    proposed a solution to the disambiguation problem by parsing domain-specific English
    NLQs and generate SQL queries by using the Stanford Parser \[[21](#reference.xhtml#refbm_21)\].
    This approach is widely used with the Not Only Structured Query Language (NoSQL)
    DBs for automatic query and design.


    Rajender \[[35](#reference.xhtml#refbm_35)\] used a controlled NLIDB interface
    and recommended SQL query features to reduce the ambiguity in an NLQ input. This
    is because the less ambiguous the domain the more accurate results the system
    can produce. What can also help resolve such ambiguity is the weighted relationships
    or links \[[36](#reference.xhtml#refbm_36)\] between RDB elements. In this method,
    the relationship’s weight increases by one each time that particular relationship
    is used. As such, it is a given that the bigger the relationship weight is the
    more often the related RDB elements are queried. This helps the NLIDB system recommend
    smarter options for the user to select from with ordered options, where the topmost
    option is the most likely.


    In the current research work, NLQ disambiguation is not the main focus. Thus,
    a simple NLQ disambiguation module is used by applying Stanford CoreNLP \[[21](#reference.xhtml#refbm_21)\]
    and “nltk.corpus” Python library \[[37](#reference.xhtml#refbm_37)\]. Those tools
    are solely used to check for NLQ validity. A syntactic rules checker is also used
    for any NLQ grammatical mistakes. The adopted procedure is interactive where an
    error message pops up to the user, asking them to rephrase a word or choose from
    a few potential spelling corrections. A Naïve Bayes Classifier \[[38](#reference.xhtml#refbm_38)\]
    is implemented to simply classify user’s response as positive or negative (i.e.,
    Yes or No).


    ## Matcher/Mapper


    The Matcher/Mapper module is considered the most complicated part in NLP science
    \[[14](#reference.xhtml#refbm_14)\]. Therefore, a keyword-based search has attracted
    many researchers as the simplest mapping approach since keywords are explicitly
    identified. Researchers used it to improve the information retrieval from DBs
    and solve (or avoid) the challenge of understanding NLQ tokens and mapping them
    into the underlying DB or schema model \[[39](#reference.xhtml#refbm_39)\]. The
    mapper can be Entity-Attribute-Value (EAV) Mapper \[[40](#reference.xhtml#refbm_40)\],
    Entity Relational (ER) Mapper \[[13](#reference.xhtml#refbm_13)\], or eXtensible
    Markup Language (XML) Documents Mapper \[[41](#reference.xhtml#refbm_41)\]. NLQs
    are translated into SQL queries if the used DB or scheme model is EAV or ER. NLQ
    can be translated to XML documents only if the used system employs a document-based
    data model in the underlying information system. More background information on
    this module is given in [Chapter 3](#ch3.xhtml), the literature review.


    In the current research work, the adopted mapper is the EAV mapper in addition
    to the RDB relationships. NLQ tokens are mapped into RDB lexica using the NLQ
    and RDB MetaTables, [Tables 1](#ch2.xhtml#table1) and [2](#ch2.xhtml#table2),
    respectively. The matching lexica will then be mapped with the SQL clauses. This
    mapping uses the proposed rule-based algorithm that is based on the observational
    assumptions table discussed later in [Table 4](#ch4.xhtml#table4) (in [Chapter
    4](#ch4.xhtml)).


    [Table 1 NLQ MetaTable](#ch2.xhtml#R_table1)


    | Words || Syntactic role || Category || Synonyms |


    | --- | --- | --- | --- |


    | Sarah || Instance || Value || Person, Patient, Physician |


    | --- | --- | --- | --- |


    | Has || Verb || Relationship || Own, Obtain, Have |


    | Physician || Noun || Attribute || Doctor, Provider, Psychiatrist, Surgeon |


    [Table 2 RDB elements MetaTable](#ch2.xhtml#R_table2)


    | Words || Syntactic role || Category || Data type || PK/FK || Enclosing source
    || Synonyms |


    | --- | --- | --- | --- | --- | --- | --- |


    | Disease || Noun || Table || Word || No || RDB: PTSD || Illness, Sickness |


    | --- | --- | --- | --- | --- | --- | --- |


    | Take || Verb || Relationship || Word || No || Tables: Patient->Medication ||
    Acquire, Absorb, Get, Gain |


    | P\_ID || Noun || Attribute || Digits || Yes || Attributes: Patient, Physician,
    Medication, Disease || Patient, Identification, Number, Person |


    [Table 1](#ch2.xhtml#table1) is an example of the NLQ MetaTable that breaks down
    the entered NLQ into its subsequent tokens. [Table 2](#ch2.xhtml#table2) is an
    example of the RDB elements MetaTable that explains each RDB element in terms
    of its nature, category, syntactic role etc. These two tables will be referenced
    to and elaborated on frequently throughout this research document.


    ## SQL template generator'
  fmt: 'Those layers use a knowledge base to assist the NLQ with the SQL translation
    process. A good example for this is the discourse representation structure. This
    type of structure converts NLQs into SQLs using an ontology-based semantic interpreter
    as an intermediate language representation layer. Discourse Integration Analysis
    [[22](#reference.xhtml#refbm_22)] is the study of information exchange such as
    in conversations where sentences meanings may change according to the preceding/proceeding
    sentences. An example is the use of pronouns in sentences such as “He” which will
    depend on the subject or the actor in the preceding sentence. In order for the
    discourse analysis process to be thorough, the NLQ tokens must be annotated. Hence,
    the annotator is essential in this method.


    ### Annotator


    Annotations are metadata that provide additional information on particular data.
    Natural language datasets are called corpora (the plural of corpus). When a corpus
    is annotated, this is called an annotated corpus. Corpora are used to train Machine
    Learning Algorithms (MLA). The annotation types include:


    * POS Annotation.

    * Phrase Structure Annotation.

    * Dependency Structure Annotation.


    In the current research work, all of the above underlying NLP layers are considered
    and implemented as part of the POS recognition module, with the exception of the
    intermediate language representation layer. The employed POS recognition Python
    library is `speech_recognition`. This module is essential to the thorough understanding
    of the given NLQ for proper and accurate translation.


    ## Disambiguation


    In the current research work, disambiguation is only required when the mapper
    finds more than one matching RDB element to a certain NLQ token. Generally, a
    word’s meaning disambiguation has special techniques and algorithms. An example
    is the statistical keyword meaning disambiguation process using N-Gram Vectors
    [[33](#reference.xhtml#refbm_33)], where N ranges from 1 to the length of the
    text. N-Gram Vectors’ statistics are gathered using a training corpus of English
    language, while a customised corpus gather statistics as the system is being used.
    The latter corpus requires that the user reviews the presented NLQ interpretation
    and makes any necessary changes before submitting it for execution. N-Gram Vectors
    are principally used for capturing lexical context. It is considered as a measure
    of how likely a given token has a particular meaning in a particular user NLQ
    input. This is because every token’s meaning depends on the context in which it
    was used. This meaning comparison procedure follows a vector similarity ranking
    measure where the higher the meaning rank the closer it is to the true meaning.


    Other words’ meaning disambiguation studies involve computational linguistics
    and statistical language understanding. Such studies focus on word sense disambiguation
    within a large corpus. Another method to disambiguate a word sense is using word
    collocations. The word collocations method measures the meaning likelihood of
    more than one word when they all exist in the same NLQ. Iftikhar [[34](#reference.xhtml#refbm_34)]
    proposed a solution to the disambiguation problem by parsing domain-specific English
    NLQs and generate SQL queries by using the Stanford Parser [[21](#reference.xhtml#refbm_21)].
    This approach is widely used with the Not Only Structured Query Language (NoSQL)
    DBs for automatic query and design.


    Rajender [[35](#reference.xhtml#refbm_35)] used a controlled NLIDB interface and
    recommended SQL query features to reduce the ambiguity in an NLQ input. This is
    because the less ambiguous the domain the more accurate results the system can
    produce. What can also help resolve such ambiguity is the weighted relationships
    or links [[36](#reference.xhtml#refbm_36)] between RDB elements. In this method,
    the relationship’s weight increases by one each time that particular relationship
    is used. As such, it is a given that the bigger the relationship weight is the
    more often the related RDB elements are queried. This helps the NLIDB system recommend
    smarter options for the user to select from with ordered options, where the topmost
    option is the most likely.


    In the current research work, NLQ disambiguation is not the main focus. Thus,
    a simple NLQ disambiguation module is used by applying Stanford CoreNLP [[21](#reference.xhtml#refbm_21)]
    and `nltk.corpus` Python library [[37](#reference.xhtml#refbm_37)]. Those tools
    are solely used to check for NLQ validity. A syntactic rules checker is also used
    for any NLQ grammatical mistakes. The adopted procedure is interactive where an
    error message pops up to the user, asking them to rephrase a word or choose from
    a few potential spelling corrections. A Naïve Bayes Classifier [[38](#reference.xhtml#refbm_38)]
    is implemented to simply classify user’s response as positive or negative (i.e.,
    Yes or No).


    ## Matcher/Mapper


    The Matcher/Mapper module is considered the most complicated part in NLP science
    [[14](#reference.xhtml#refbm_14)]. Therefore, a keyword-based search has attracted
    many researchers as the simplest mapping approach since keywords are explicitly
    identified. Researchers used it to improve the information retrieval from DBs
    and solve (or avoid) the challenge of understanding NLQ tokens and mapping them
    into the underlying DB or schema model [[39](#reference.xhtml#refbm_39)]. The
    mapper can be Entity-Attribute-Value (EAV) Mapper [[40](#reference.xhtml#refbm_40)],
    Entity Relational (ER) Mapper [[13](#reference.xhtml#refbm_13)], or eXtensible
    Markup Language (XML) Documents Mapper [[41](#reference.xhtml#refbm_41)]. NLQs
    are translated into SQL queries if the used DB or scheme model is EAV or ER. NLQ
    can be translated to XML documents only if the used system employs a document-based
    data model in the underlying information system.


    In the current research work, the adopted mapper is the EAV mapper in addition
    to RDB relationships. NLQ tokens are mapped into RDB lexica using the NLQ and
    RDB MetaTables, `Tables 1](#2.xhtml#table1)` and `2](#2.xhtml#table2)`, respectively.
    The matching lexica will then be mapped with the SQL clauses. This mapping uses
    the proposed rule-based algorithm that is based on the observational table discussed
    later in `Table 4](#4.xhtml#table4)` (in `Chapter 4](#4.xhtml)). More background
    information on this module is given in `Chapter 3](#3.xhtml)`, the literature
    review.

