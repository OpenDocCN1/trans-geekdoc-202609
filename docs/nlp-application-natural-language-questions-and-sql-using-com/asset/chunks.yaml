  trans: '


    `[79]` 的作者旨在探索自然语言查询（NLQ）结构与面向对象（OO）世界之间的关系，目的是将包含模糊修饰符指定的模糊术语（例如“好”或“坏”）的 NLQ
    结构通过自然语言接口（NLI）映射到相应的类图中，最终形成一个 SQL 语句，在执行后提供答案以及相应的模糊程度。作者关注了模糊集理论 `[49]\]`，因为它是一种使用不精确术语或语言变量来表示模糊数据的方法
    `[85, 86]\]`。语言变量由自然语言单词或句子（例如“老的”或“年轻的”）组成，不包括数字（例如 20 或 30），但通过对不精确概念和值指定自然且简单的规范和刻画描述，可以使用这些语言变量对不精确的
    NLQ 术语和概念进行精确建模。


    在 `[79]\]` 中，真实世界对象的连接路径在 NLQ 执行期间被映射为 SQL，其方法是从 NLQ 中提取类图，其形式为 SOM 图的子图/树（一个验证子树），该图包含了连接源和目标的相关对象，这些对象在之前已由用户以对象和属性的形式被识别。源是具有值属性的对象及其关联，用以说明感兴趣的对象和属性之间的关系，而最终目的地是目标对象。然后将结果发送到连接矩阵，寻找源和目标之间是否存在任何逻辑路径，最终将逻辑路径映射到等效的
    QL 语句，该语句可以通过内连接（inner joins）进行简化。类图中表示的 和成员函数用于将每个模糊修饰符与其相应的模糊类连接起来。


    Isoda `[87]\]` 发现，通过识别这些真实对象对应的类，基于面向对象的分析应用程序能够实现直观且自然的真实建模。


    Moreno 和 Van `[88]\]` 证明了 NLQ 结构的概念建模形式化可以自然地映射到面向对象的概念模型，正如 Metais `[89]\]` 提到的
    NLQ 和 DB 概念模式那样，以及它们在表示真实世界的概念化特征方面的高效。


    Yager 等人 `[90]\]` 证明了模糊集（包含如“年轻”和“很少”等模糊术语）理论提供了一种基于语言的 NLQ 建模应用。此外，模糊 NLQ 允许允许通过包含更多元组的模糊谓词更直观地描述真实世界对象。


    基于 `[79]\]`，带有语言术语和模糊术语的模糊 NLQ 比精确的 NLQ 更灵活，因为在没有直接答案的情况下，它们可以提供更多潜在答案。关于与 DB
    架构的语言关系，通过使用链接字典和预定义的基于语法的规则对 NLQ 进行语言分析，以减少歧性和复杂性，而 DB 架构充当 DB 概念设计蓝图。


    同样，Owei `[91]\]` 提出了一种基于概念的 QL，通过数据库查询的概念抽象来促进查询制定，以利用语义数据模型并将 NLQ 结构映射到等效的特定对象中。


    ### L2S 函数与步骤


    L2S 功能分布在三个步骤 `[92]\]`。在第一个预处理步骤中，对 NLQ 和 DB 进行分析并提取所有 ML 特征。这一步由三个预处理组件支持：语言组件，用于分析
    NLQ 以生成词汇表列表并发现任何条件标记（例如大于/小于）。该组件包含了工具，如命名实体识别器 (NER) `[97]\]` 和 GATE 中的 Coltech-parser
    `[98]\]`，用于提取位于 NLQ 中的语义信息。此外，该组件使用 Java 模式引擎 (JAPE) 语法处理 NLQ 的分词和命名实体标记。第一步的输出是附加约束。第二个组件是词典，用于分析
    DB 元素及其附加约束。第三个组件是歧义消除，用于修正 NLQ 输入以确保无歧义的 NLQ。在此组件中，L2S 将所有 NLQ 标记与 DB 元素进行比较，通过省略法或最高概率选择找出匹配两个或多个
    DB 元素的歧义标记。接下来的 L2S 步骤是匹配步骤，包含两个主要组件：语义匹配和基于图的匹配。这一步处理跨语言映射，产生与第一步输出等效的 SQL 元素。第三步是生成完整准确的
    SQL 语句。


    ### 技术方法与建模


    大多数语言转换依赖于语法。通常，基于规则的方法 `[93]\]` 需要大量的手动定制，并常用于工业系统 `[94]\]`。


    统计模型主要用于学术研究，它们通过构建正确和错误的 NLQ 对训练集来工作 `[24]\]`。语言转换随后变为一个二分类任务，ML 特征从标记和标签中提取
    `[95]\]`。


    '
