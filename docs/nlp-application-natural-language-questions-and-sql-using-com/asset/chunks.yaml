- raw: 'Another example of recent works that generate their own SQLs is \[[115](#reference.xhtml#refbm_115)\],
    which used syntactic trees of NLQ/SQL pairs as an SQL compiler to derive NLQ parsing
    trees. In \[[115](#reference.xhtml#refbm_115)\], NLQ tokens’ lexical dependencies,
    DB schema and some synonym relations are used to map DB lexica with the SQL clauses
    via a Heuristic Weighting Scheme \[[41](#reference.xhtml#refbm_41)\]. Because
    \[[115](#reference.xhtml#refbm_115)\] does not use any NLQ annotated meaning resources
    (i.e., Prolog data \[[155](#reference.xhtml#refbm_155)\] or Lambda Calculus \[[129](#reference.xhtml#refbm_129)\])
    or any other manual semantic interpretation and representation to fully understand
    the NLQ, the SQL generator performance was considerably low. Therefore, authors
    of \[[115](#reference.xhtml#refbm_115)\] applied a reranker \[[120](#reference.xhtml#refbm_120)\]
    to try and boost accuracy using an advanced Heuristic Weights-Based SVM-Ranker
    \[[36](#reference.xhtml#refbm_36)\] based on String Tree Kernels \[[128](#reference.xhtml#refbm_128)\].
    The reranker indeed increased the recall of correct answers up to 94%, which is
    still lower than the recall of the proposed research work. This is because in
    the current work, RDB lexica MetaTable is used for lexical relations disambiguation.
    A mapping table is also used, which includes RDB data types, PKs and FKs and names
    of entities (unique values), in addition to other rule-based mapping constraints.
    Hence, building an SQL generator is more complicated in the language translation
    field and as a result increases the complexity of the translation algorithm. This
    is the main reason the current research work uses SQL templates and puts extra
    focus on passing accurate RDB lexia into SQL templates generator for a better
    performance and output.


    Neural networks have not been used in the current research work, nor for any of
    the mapping mechanisms. The reason why will be clearer with some recent work examples
    such as \[[124](#reference.xhtml#refbm_124), [156](#reference.xhtml#refbm_156)\].
    SEQ2SQL \[[124](#reference.xhtml#refbm_124)\] is a deep Sequence to Sequence Neural
    Network Algorithm \[[157](#reference.xhtml#refbm_157)\] for generating an SQL
    from an NLQ semantic parsing tree. SEQ2SQL uses Reinforcement Learning Algorithm
    \[[124](#reference.xhtml#refbm_124)\] and rewards from in-the-loop query execution
    to learn an SQL generation policy. It uses a dataset of 80,654 hand-annotated
    NLQ/SQL pairs to generate the SQL conditions which is incompatible with Cross
    Entropy Loss Optimization \[[158](#reference.xhtml#refbm_158)\] training tasks.
    This Seq2SQL execution accuracy is 59.4% and the logical form accuracy is 48.3%.


    SEQ2SQL does not use any manually written rule-based grammar like what is implemented
    in the current research work. In another recent work in 2019 \[[156](#reference.xhtml#refbm_156)\],
    a sequence-to-sequence neural network model has been proved to be inefficient
    and unscalable on large RDBs. Moreover, SQLNet \[[124](#reference.xhtml#refbm_124)\]
    is a mapping algorithm without the use of a reinforcement learning algorithm.
    SQLNet showed small improvements only by training an MLA sequence-to-sequence-style
    model to generate SQL queries when order does not matter as a solution to the
    “order-matters” problem. Xu et al. \[[124](#reference.xhtml#refbm_124)\] used
    Dependency Graphs \[[116](#reference.xhtml#refbm_116)\] and the Column Attention
    Mechanism \[[159](#reference.xhtml#refbm_159)\] for performance improvement. Though
    this work combined most novel techniques, the model has to be frequently and periodically
    retrained to reflect the latest dataset updates, which increases the system’s
    maintenance costs and computational complexity.


    The work in \[[157](#reference.xhtml#refbm_157)\] overcomes the shortcomings of
    sequence-to-sequence models through a Deep-Learning-Based Model \[[124](#reference.xhtml#refbm_124)\]
    for SQL generation by predicting and generating the SQL directly for any given
    NLQ. Then, the model edits the SQL with the Attentive-Copying Mechanism \[[160](#reference.xhtml#refbm_160)\],
    a Recover Technique \[[3](#reference.xhtml#refbm_3)\] and Task-Specific Look-Up
    Tables \[[161](#reference.xhtml#refbm_161)\]. Though this recent work proved its
    flexibility and efficiency, the authors had to create their own NLQ/SQL pairs
    manually. Besides, they also had to customize the used RDB, which is a kind of
    over-customization to the used framework and environment applied on. Hence, results
    are highly questionable in terms of generalizability, applicability and adaptability
    on other domains. On the other hand, the current research work used RDBs that
    are public sources namely, Zomato and WikiSQL.


    ### Intermediate Representations


    The current research work tries to save every possible information given by the
    NLQ tokens so that each of them is used and represented in the SQL clauses and
    expressions production. Therefore, multiple NLP tools, MetaTables and mapping
    tables (for unique values) are implemented to fully understand the NLQ and map
    its tokens to their corresponding RDB elements. Then, the identified attributes
    are fed into the SQL SELECT clause, while the tables are extracted from the SELECT
    clause to generate an SQL FROM clause, and the values are used as conditional
    statements in the WHERE clause. For this simple mapping purpose, other works in
    the literature use additional intermediate layers to represent NLQ tokens as SQL
    clauses, which, upon investigation, turned to be not as effective as the NLP tools,
    MetaTables and mapping tables.


    An example of the NLQ intermediate semantic representation layers is using Regular
    Expressions (regexps) \[[101](#reference.xhtml#refbm_101)\] to represent NLP tokens
    phonology and morphology. This representation happens by applying First Order
    Predicate Calculus Logic \[[162](#reference.xhtml#refbm_162)\] using DB-Oriented
    Logical Form (DBLF) and Conceptual Logical Form (CLF) with some SQL operators
    and functions to build and generate SQLs \[[107](#reference.xhtml#refbm_107)\].
    Yet, the use of regular expressions “regexps” collections in NLQ sentences are
    not clearly articulated in the literature.


    Another example is CliniDAL \[[27](#reference.xhtml#refbm_27)\], which used EAV
    type of DB metadata and grammatical parse trees to process NLQ tokens to then
    be mapped to their internal conceptual representation layer using the Similarity-Based
    Top-K Algorithm \[[138](#reference.xhtml#refbm_138)\]. More examples of the intermediate
    layers include PHLIQAl \[[4](#reference.xhtml#refbm_4)\], ASK \[[46](#reference.xhtml#refbm_46)\],
    USL \[[109](#reference.xhtml#refbm_109)\], and SEMRESP \[[7](#reference.xhtml#refbm_7),
    [129](#reference.xhtml#refbm_129), [111](#reference.xhtml#refbm_111), [122](#reference.xhtml#refbm_122)\]
    which defined intermediate tokens meaning representations manually.


    Also, the supervision-extensive system \[[7](#reference.xhtml#refbm_7), [113](#reference.xhtml#refbm_113),
    [126](#reference.xhtml#refbm_126)\] used Lambda Calculus to map tokens to their
    corresponding meaning representations. TEAM \[[16](#reference.xhtml#refbm_16)\]
    adopted intermediate semantic representation layers connected with a DB conceptual
    schema. In addition, L2S \[[92](#reference.xhtml#refbm_92)\] transforms DB lexica
    into an intermediate tree-like graph then extracts the SQL from the Maximum Bipartite
    Matching Algorithm \[[163](#reference.xhtml#refbm_163)\].


    All those great efforts unfortunately proved to be not as effective because of
    the high complexity and the time-consuming nature of the approaches. Those deficiencies
    mandated the introduction of a new system that translates NLQs into SQLs while
    maintaining a high simplicity and performance presented in the current research.
    The proposed research highlights a new solution to NLP and language translation
    problems.'
