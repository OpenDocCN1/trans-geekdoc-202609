  trans: '


    图 2 创伤后应激障碍 (PTSD) RDB 的 ERD


    1976 年，Chen \[13\] 首次使用 ERD 对 RDB 架构实体进行图形化建模，以表示 NLQ 结构。在 \[14\] 中，通过分析 NLQ 结构与
    ERD 甚至与类图概念模式之间的关系 \[15\]，利用 ERD 来表示 NLQ 结构。然而，以前的工作并未研究将 NLQ 结构的内部关系映射到 RDB 查询语言（如
    `SQL`）中的方法，而这种映射将在本研究工作中实现。内部关系是指句子结构（即单词）之间的词法依赖关系，例如动词与其宾语之间的关系。这种关系支持将标记映射到词汇。


    此外，RDB 允许通过 RDB 架构元表 `MetaTables` 将 NLQ 映射到 `SQL`，如表 1 和 2 所示（参见第 2 章）。`MetaTables`
    是数据仓库，充当数据字典，通过数据注解、跨标签和同义词关联来描述 RDB 元素及其之间的关系。除了使用的 RDB `MetaTables` 之外，NLQ 上文以及存储在多个连接
    RDB 表中的基于场景的知识都有助于提高数据检索的准确性。在所提研究范围内，重点将放在解决这样一个问题：我们如何利用 RDB 架构 `MetaTables`
    将非结构化的全文本 NLQ 表达式翻译为 `SQL` 语句，从而产生准确的结果？这种翻译机制及其框架设计（从 NLQ 接口到识别等效 `SQL` 子句）旨在实现其他次要任务，例如：


    *   缩写支持；例如，如果用户使用缩写“kg”询问患者体重，它会被识别为“kilogram”。

    *   支持 `SQL` 语法结构（如 `SELECT`、`FROM` 等关键字）的同义词，或处理 NLQ 中缺失这些结构的情况。

    *   多列 `SELECT`；识别多个 NLQ 的主名词或名词短语。

    *   将操作符和数字（例如 `Equal`、`Three`）转换为数值形式和符号（例如 `=`、`3`）。

    *   从 NLQ 中提到的字面值中推导出表名或属性名。

    *   支持命题术语（例如：上方、下方、之间）。

    *   考虑 NLQ 中的所有条件项并将其转换为多个 `WHERE` 条件。无论所有条件是应用于相同还是不同的 RDB 元素，均适用。

    *   支持聚合函数（例如：将‘highest’转换为 `MAX(Hight)` 或将‘youngest’转换为 `MIN(Age)`）。


    表 1 是 NLQ `MetaTable` 的一个示例，它将输入的 NLQ 拆分为后续的标记。表 2 是 RDB 元素 `MetaTable` 的一个示例，它从性质、类别、语法角色等方面解释了每个
    RDB 元素。这两个表将在整个研究文档中频繁被引用和详细阐述。


    访问任何类型的数据库都必须使用机器可读指令。这强调了在 NLQ 与 RDB 查询语言（如 `SQL`）之间寻找映射机制的必要性。通过分析语言的语义和语法角色，可以发现
    NLQ 与人工语言之间的通用语义。本研究工作通过在词处理层面手动编写基于规则的自动映射算法，解决了 NLQ 到 `SQL` 的翻译问题。手动工作在于创建基于规则的算法。算法开发完成后，映射过程将是自动的。


    本工作的目标是在保持简单算法配置的同时具有高性能的输出结果。除了简单的算法规则外，避免依赖巨大的标注语料库或编写的翻译示例模式也非常重要。这一研究思路克服了任何底层语言工具（如命名实体标记器、分词器或依赖解析器）性能不足的问题。本研究贡献是一种基于规则的算法，它在
    NLQ 的语义/语法信息、SQL 的语法信息以及 RDB 元素的语义角色之间应用了映射关联，并提供了一种将 NLQ 转换为 `SQL` 的有效翻译机制。


    ## 基础研究框架结构


    在所提算法的实现过程中，如图 3 所示，用户的 NLQ 作为输入到给定的 `NLIDB` 中，并配有相应的 RDB 架构。接下来，通过底层多层 NLP 框架执行
    NLQ 到 `SQL` 的翻译。之后，系统基本上可以理解 NLQ 并用等效的 `SQL` 查询做出响应。


    ![图 3 研究组织图。](img/fig3_B.jpg)


    图 3 研究组织图


    在接下来的章节中，第 2 章是对研究工作流水线组件的背景研究，作为第 4 章中描述的实际研究实施计划的引言。第 3 章是对主要研究贡献的文献综述，即两种映射算法。第
    5 章是一个使用实现用例场景的运行示例，用于说明每个组件的作用。本章还对算法过程进行了完整总结。第 6 章概述了算法的实现测试和验证方法，以及用于说明所提研究成功因素的性能测量。第
    7 章展示了框架实现结果和讨论，最后第 8 章提出了研究结论并概述了未来研究范围。


