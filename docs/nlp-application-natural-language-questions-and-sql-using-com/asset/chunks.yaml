  trans: '


    ML 算法在降维、聚类、分类和多线性子空间学习中具有广泛的应用[61, 62]]。在自然语言处理（NLP）中，ML 被用于提取查询模式，通过在 NLP 输入源之间建立链接，并将预测的`SQL`
    模板集预取到临时缓存内存中，从而提高响应时间[63]]。ML 算法通常封装在库中，并与查询和分析系统集成。主要的 ML 属性包括可扩展性、分布式执行和轻量级算法[62]]。


    自 20 世纪 80 年代以来，NLP 和基于知识的 ML 算法就一直用于知识处理和检索[64]]。Boyan 等人[65]通过对纯文本文档建立索引优化了网络搜索引擎，并使用强化学习技术通过图传播奖励来调整文档排名。Chen
    等人[66]使用了归纳学习技术，包括符号化`ID3`学习、遗传算法和模拟退火，以增强信息处理、检索和知识表示。类似地，Hazlehurst 等人[67]在在其查询引擎系统中使用了
    ML，通过开发智能查询引擎（`IQE`）系统，实现了基于查询相似性度量的自动信息检索。


    基于概率隐性语义分析的无监督学习被用于信息检索、NLP 和 ML[68]。Hofmann 利用文本和语言数据集，使用受温度控制的期望最大化算法进行模型拟合，开发了一种自动文档索引技术[68]。此外，Popov
    等人引入了知识与信息管理框架，用于基于语义查询从`RDF`存储库中对文档进行标注、索引、提取和检索[69]。


    Rukshan 等人[70]开发了一种基于规则的数据库自然语言 Web 接口（`NLWIDB`）。他们通过教系统如何识别`NLWIDB`系统中代表多个不同表和属性的规则、识别什么是转义词并忽略它们、以及数据库数据字典、聚合函数`MAX`的规则，以及表示“和”或“以及”概念或区间“等于”概念的多种表示方式的规则，从而构建了这些规则。数据字典通常用于定义已知属性之间的关系，例如，在比较操作中哪个属性在前，哪个属性在比较结构中在后。这个`NLWIDB`与目前的研究思路相似，但我们打算构建一种更简单、更通用的算法，适用于各种领域的系统。我们的算法不使用数据库元素作为规则识别的基础（如
    Rukshan 等人的研究那样），而是使用通用的句子结构模式识别来形成等效的`SQL`语句。


    `SPARK`[71]将查询关键词映射到本体论资源。翻译结果是基于`RDF`的查询语言（`QL`）格式的查询排序列表，由`SPARK`使用概率模型生成的`SPARQL`。`SPARK`使用的本体论资源被映射为用于提供`SPARQL`数据的图中的项。


    `SPARK`类似，`PANTO`[60]将基于关键词的查询翻译为`SPARQL`，但`PANTO`可以处理复杂的查询关键词（如否定、最高级）。此外，`PANTO`使用解析树而非图表示来表示生成`SPARQL`查询的中间结果。


    i2b2 药物提取挑战[60]提出使用命名实体识别方法，通过纯 ML 方法或 ML 与基于规则系统的混合方法进行概念识别，从临床笔记中进行高精度的药物概念信息提取。


    `Keyword++`框架[43]改进了`NLIDB`，并解决了搜索数据库时`NLQs`不完整和不精确的问题。`Keyword++`通过将关键词映射到其谓词，将基于关键词的查询翻译为`SQL`来工作。评分过程使用差异查询对完成。


    `Keymantic`系统[72]利用模式数据类型和其他意图知识手段，结合基于 Web 的词汇资源或本体论，处理 RDB 上基于关键词的查询。`Keymantic`生成关键词到其相应数据库术语的映射配置，以确定用于`SQL`生成的最佳配置。


    `HeidelTime`[73, 74]是一种时间标记器，使用基于规则和 ML 的混合方法提取和分类临床文本报告中的时间表达式，同时也成功解决了 i2b2
    NLP 挑战。


    `CliniDAL`[27]组合受限自然语言查询（`RNLQs`），从临床信息系统（CISs）中提取知识用于分析。`CliniDAL`的 RNLQ 到`SQL`映射和翻译算法通过采用时间分析器组件得到了增强，该组件采用双层规则方法解释查询中的时间表达式，无论是绝对时间还是相对时间/事件。时间分析器会自动查找并将这些表达式映射到
    CIS 不同数据设计模型底层数据元素的对应时间实体。


    `TimeText`[75]是一种时间系统架构，用于从临床文本报告（如出院摘要）中提取、表示和推理时间信息。然而，它只能回答非常简单的`NLQs`。


    '
