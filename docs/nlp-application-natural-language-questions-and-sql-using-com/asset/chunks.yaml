- raw: '[Table 17](#appendix9.xhtml#table17) ([Appendix 9](#appendix9.xhtml)) highlights
    the main similar works in the literature with their advantages and disadvantages
    summarized in comparison with the proposed work in the current research.


    In what follows, a layout of the similar works presented in a chronological order.
    This section is also summarized in [Table 17](#appendix9.xhtml#table17), [Appendix
    9](#appendix9.xhtml) ([Figure 5](#ch3.xhtml#fig5)).


    ![Figure 5 Research ideas with their current existing solutions.](images/fig5_B.jpg)


    [Figure 5 Research ideas with their current existing solutions.](#ch3.xhtml#R_fig5)


    # 4 Implementation Plan


    DOI: [10.1201/b23367-4](https://dx.doi.org/10.1201/b23367-4)


    The current research framework components start with the NLIDB interface that
    the user uses to enter the NLQ sentence. To understand the input NLQ, the NLQ
    must go through POS recognition via the underlying NLP tasks, such as lemmatizing,
    tokenizing, annotating and rule-based parsing. The following step, disambiguation,
    is a conditional step that the NLQ will go through only in the case that there
    was a vague POS word (i.e., Is “content” a noun or an adjective? Is “separate”
    a verb or an adjective?). After that, the identified NLQ tokens will be delivered
    to the matcher/mapper step for mapping the tokens into the elements of the RDB
    schema MetaTables and the identified lexica into the SQL clauses. The matching
    lexica will be used in the SQL generation step, which will be executed next.


    ## NLQ input interface


    Before running any script, required dependencies and packages, which are all open
    source and available, must be downloaded and imported through the Python terminal.
    Then, the user will insert an NLQ into the data input interface. The user will
    be returned either the generated SQL results from the MySQL DB or an error alert.
    The error alert could be concerning the entered NLQ linguistic issues or an error
    of an existence of more than 1 match or no match at all to the NLQ arguments in
    the RDB MetaTable.


    The MetaTables of NLQ and RDB are created by adding span tags to the RDB elements
    or the NLQ tokens to attach them with their syntactic and semantic roles. They
    are also annotated with their synonyms using the WordNet ontology functions. The
    cost of adding the MetaTables data are fractional to the original size of the
    RDB itself. For small RDBs, it could add extra 3% on top of the original RDB size.
    For larger RDBs, such as WikiSQL, it could add up to 10% extra storage space.
    When the RDB changes, the translation processing is not affected by the update
    because every added record will be automatically annotated by the framework to
    include necessary annotations and metadata.


    The NLQ is inserted through an NLI screen as input data up to 200 characters with
    the help of two Python libraries, namely, “server.bot”, which accepts the input
    NLQ, and “text\_processing.text\_nlp”, which initially processes the NLQ by separating
    the words and passing them as arguments to the next module. The NLI will identify
    NLQ words as arguments, which will later help preparing them for identifying their
    semantic and syntactic roles. [Figure 6](#ch4.xhtml#fig6) briefly summarizes the
    steps taken to transform an NLQ into an SQL statement. Those steps will be further
    clarified throughout this chapter.


    ![Figure 6 Detailed research architecture pipeline.](images/fig6_B.jpg)


    [Figure 6 Detailed research architecture pipeline.](#ch4.xhtml#R_fig6)


    ## POS recognition


    The multilayered translation algorithm framework splits the NLQ into its constituent
    tokens. Then, these tokens are compared with the RDB MetaTables’ contents to single
    out keywords in the NLQ sentence. With the tokens matching schema data, a.k.a.
    the lexica, the NLQ should be able to be parsed semantically to identify tokens’
    semantic-role frames (i.e., noun, verb, etc.) which helps the translation process.
    Semantic parsing is done by generating the parsing tree using the Stanford CoreNLP
    library, with input from the English language ontology, WordNet, which feeds the
    system with NLQ words meanings (semantics).


    The first process performed on the NLQ string is lemmatizing and stemming its
    words into their broken-down original root forms. This is done by deleting the
    words’ inflectional endings and returning them to their base forms, such as transforming
    ‘entries’ into ‘entry’. Lemmatizing eases the selection and mapping process of
    equivalent RDB elements. It also facilitates the tokens’ syntactic and semantic
    meaning recognition. Then comes the steps of parsing and tokenizing the words’
    stems into tokens according to the predefined grammatical rules and the built-in
    syntactic roles. Those syntactic roles will be mapped to specific RDB elements,
    for instance, NLQ verbs are mapped with RDB relationships.


    For any NLQ translation process, both the parsed tokens and their subsequent POS
    tags must be clearly and accurately identified. This is performed by an underlying
    multilayered pipeline which starts with tagging an NLQ POS. Then, the tokenizer,
    annotator, semantic and syntactic (rule-based) parsers will be applied and any
    punctuation marks will be removed. Part of this step is omitting the meaningless
    excess escape words that are predefined in the system (i.e., a, an, to, of, in,
    at, are, whose, for, etc.) from the NLQ words group. After parsing, a parse tree
    is generated and a dictionary of tokens’ names, syntactic roles and synonyms are
    maintained in the NLQ MetaTable. Also, the NLQ’s subjects, objects, verbs and
    other linguistic roles are identified. Hence, each tokenized word is registered
    into the NLQ MetaTable by the syntactic analyzer. Tokens are then passed to the
    semantic analyzer for further processing.


    The semantic analyzer employs a word-type identifier using a language vocabulary
    dictionary or ontology such as WordNet. The word-type identifier, such as WordNet,
    identifies what semantic role does a word or a phrase (i.e., common or proper
    noun) play in a sentence and what is their role assigner (the verb). Furthermore,
    the semantic analyzer is able to identify conditional or symbolic words and map
    them with their relative representation from the language ontology. For example,
    the phrase “bigger than” will be replaced by the operator “>”. In other words,
    the semantic analyzer’s entity annotator detects the conditional or symbolic words
    amongst the input NLQ entities. Then, it replaces them with their equivalent semantic
    types identified previously by the schema annotator. The entities replacement
    creates a new form of the same NLQ that is easier for the SQL generator or pattern
    matcher to detect.


    The entity annotator is not the only annotator the NLQ deals with. There are other
    annotators the NLQ gets passed through such as the numerical annotator, date annotator,
    comparator annotator, etc. In future work, this step can be further improved to
    search for the previous annotation results to check for any stored matching patterns
    of lexicalized rules. This step shall help determine the suited SQL template type
    or its further sub-queries’ divisions faster.


    The NLQ gets converted into a stream of tokens and a token ID is provided to each
    word of the NLQ. The tokens are classified into their linguistic categories such
    as nouns, pronouns, verbs or literal values (string/integer variables). The algorithm
    maps the tokens into tables, attributes, values or relationships according to
    their linguistic categories and semantic roles. The rest of the acquired information
    will be used to formulate SQL query clauses (i.e., comparative or operational
    expressions) according to the tagged tokens.'
