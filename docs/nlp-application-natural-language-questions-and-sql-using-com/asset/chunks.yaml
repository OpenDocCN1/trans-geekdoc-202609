- raw: 'The Mayo Clinic information extraction system \[[50](#reference.xhtml#refbm_50)\]
    extracts information from free text fields (i.e., clinical notes), including named
    entities (i.e. diseases, signs, symptoms, procedures, etc.) and their related
    attributes (i.e. context, status, relatedness to patients, etc.). The system works
    by implementing simple NLP tasks such as text tokenization, lemmatization, lexicon
    verification, and POS tagging.


    English Wizard, developed in **2009**, is an English NLQ translation tool for
    querying RDB using SQL. English Wizard distinguishing features include having
    a graphic user interface (GUI) to issue NLQs or report query results through client/server
    applications or other DB reporting tools \[[51](#reference.xhtml#refbm_51)\].


    GINLIDB, in **2009**, employed two types of semantic grammar to support a wide
    range of NLQs. The first type is a single lexicon semantic grammar for lexicon
    nonterminal words, and the second type forms terminal phrases or sentences using
    a composite grammar. In addition, GINLIDB uses ATN for Syntactic analysis to assure
    tokens structures’ compatibility with allowable grammatical structures \[[52](#reference.xhtml#refbm_52)\].


    In **2010**, CHAT-80 system used Prolog to process NLQs into three stages of representations.
    First, the system represents NLQ words in their logical constants, and then represents
    NLQ’s verbs, nouns and adjectives with their prepositions as predicates. For NLQ’s
    complex phrases or sentences, the system represents them by forming conjunctions
    of predicates on the DB. CHAT-80 integrates WordNet as a lexicon and the ontology
    as the semantic interpreter’s knowledge base. CHAT-80 is considered a domain-independent
    and portable NLIDB. It also uses OWL Ontology to define RDB Entity-Relational
    model to increase the accuracy of NLQ sentences \[[53](#reference.xhtml#refbm_53)\].


    In **2012**, an NLI for RDB system called Natural Language Application Program
    Interface (LANLI) was developed \[[54](#reference.xhtml#refbm_54)\]. LANLI utilized
    semantic and syntactic tree generation for query execution defined on a Local
    Appropriator. LANLI does the NLQ words matching with the corpus tokens via a matching
    algorithm before using the query formulating tree. LANLI is an effective NLIDB
    retrieval system due to its use of accurate tree formation algorithm for both
    the NLQ and the built-in DB, besides the use of knowledge dictionary-like tables
    that works at interpreting the knowledge that the NLQs might have.


    In **2014**, restricted NLQ to SQL translation algorithm was proposed through
    CliniDAL \[[55](#reference.xhtml#refbm_55)\] focusing on managing the complexity
    of data extraction from Entity-Attribute-Value (EAV) design model. The algorithm
    starts with the Controller receiving an NLQ with its main parameters’ quantity
    to perform advanced search. The NLQ gets parsed, categorized and optimized via
    the Query Processor using the query (parse) tree and the information stored in
    the data source context model, which is a kind of metadata, to produce a query
    or parse tree including entities, comparatives and their categories (i.e. Patient,
    Medical, Temporal, etc.). CliniDAL’s grammatical parser recognizes the part of
    the Restricted NLQ via a free-text resolution mechanism in addition to the data
    analytics post-processing steps for a question deep analysis. The third step is
    the Query Translator that identifies the NLQ tokens in the query tree so the Mapper
    can map them to their internal conceptual representation in the Clinical Information
    System (CIS). This mapping process is done using the similarity-based Top-k algorithm,
    in addition to embedded NLP tools (e.g., tokenization, abbreviation expansion
    and lemmatization). The mapping results are stored in a generic context model
    which feeds the translation process with necessary information just like an index.
    As such, the corresponding tables and fields for the NLQ tokens are extracted
    from the data source context model to be fed into the SQL SELECT clause, and the
    value tables are extracted from the SELECT clause to generate an SQL FROM clause.
    The query (parse) tree leaf nodes represent query constraint categories which
    reflect conjunction or disjunction using algebraic computations for clinical attributes
    and their values. CliniDAL uses the unique unified term, TERM\_ID, and its synonyms
    as the internal identifier for software processing purposes, as in composing SQL
    statements.


    In **2017**, the special purpose CliniDAL \[[42](#reference.xhtml#refbm_42)\]
    was introduced to integrate a concept-based free-text search to its underlying
    structure of parsing, mapping, translation and temporal expression recognition,
    which are independently functioning apart from the CIS, to be able to query both
    structured and unstructured schema fields (e.g. patient notes) for a thorough
    knowledge retrieval from the CIS. This translation is done using the pivoting
    approach by joining fact tables computationally instead of using the DBMS functionalities.
    Aggregation or statistical functions require further post-processing to be applied
    and computed.


    In **2018**, an NLI to RDB called QUEST \[[56](#reference.xhtml#refbm_56)\] was
    developed on top of IBM Watson UIMA pipeline (McCord) and Cognos. QUEST emphasized
    focus on nested queries, rather than simple queries, without restricting the user
    with guided NLQs. QUEST workflow consists of two major components, QUEST Engine
    Box and Cognos Engine Box. Quest Engine Box includes the schema-independent rule
    templates that work by extracting lexicalized rules from the schema annotation
    file in the online part of this box, besides the rule-based semantic parsing module
    that generates lexicalized rules used in the semantic parsing. Quest Engine Box
    also includes a semantic parser built on many Watson NLP components, including
    English Slot Grammar (ESG) parser, Predicate Argument Structure (PAS), and Subtree
    Pattern Matching Framework (SPMF). This box will finally produce a list of SQL
    sub-queries that are later fed into the QUEST other box, the Cognos Engine Box.
    The latter box focuses on final SQL statement generation and execution on IBM
    DB2 server. QUEST proved to be quite accurate compared to previous similar attempts.


    Despite the success of above attempts on NLIDB, token-based \[[57](#reference.xhtml#refbm_57)\],
    form/template-based \[[58](#reference.xhtml#refbm_58)\], menu-based \[[59](#reference.xhtml#refbm_59)\]
    or controlled NL-based search, are similar but simpler approaches require much
    more effort as the accuracy of the translation process depends on the accuracy
    of the mapping process.


    ### ML Algorithms


    NLP tools and ML techniques are among the most advanced practices for information
    extraction at present \[[42](#reference.xhtml#refbm_42)\]. In respect of ML techniques,
    they could be either *rule-based* or *hybrid approaches* for features identification
    and selection or rules classification processes. A novel supervised learning model
    was proposed for i2b2 \[[60](#reference.xhtml#refbm_60)\], that integrates rule-based
    engines and two ML algorithms for medication information extraction (i.e. drug
    names, dosage, mode, frequency, duration). This integration proved efficiency
    during the information extraction of the drug administration reason from unstructured
    clinical records with an F-score of 0.856.'
