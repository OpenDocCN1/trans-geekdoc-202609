    evaluation. In LREC (pp. 1312–1317).

    7. `Wong, Y. W., & Mooney, R. J.` (2006, June). Learning for semantic parsing
    with statistical machine translation. In Proceedings of the Main Conference on
    Human Language Technology Conference of the North American Chapter of the Association
    of Computational Linguistics (pp. 439–446). Association for Computational Linguistics.

    8. `Patil, S., & Davies, P.` (2014). Use of Google Translate in medical communication:
