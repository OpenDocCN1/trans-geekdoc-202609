- raw: 'The Python NLP lightweight library (TextBlob) is used as an NLQ POS recognizer
    (i.e., “speech\_recognition” library). NLQ tagger and lemmatizer are implemented
    to facilitate the equivalent RDB elements selection. In addition, other libraries
    are also considered including, but not limited to, “string\_punctuation”, “Stanford
    CoreNLPspellcheck”, “nltk.corpus” (using WordNet), “textblob.word”, “wordNetLemmatizer”,
    “nltk.stem”, “sentence\_tokenize”, “word\_tokenize”, “nltk.tokenize”, “unicodedata”
    (for mathematical operations and symbols), “textt\_processing”, “text\_nlp” and
    “server.tokenizer”. Those libraries’ usage and distribution is explained in [Figures
    7](#ch4.xhtml#fig7) and [16](#ch6.xhtml#fig16) ([Chapter 6](#ch6.xhtml)).


    ![Figure 7 Detailed research organization pipeline (light gray boxes are Python
    libraries; dark gray boxes are tasks & gray blobs are passed-on data).](images/fig7_B.jpg)


    [Figure 7 Detailed research organization pipeline (light gray boxes are Python
    libraries; dark gray boxes are tasks & gray blobs are passed-on data).](#ch4.xhtml#R_fig7)


    The system checks each NLQ word’s semantic role and adds it to the registry to
    be passed on to the next step, as illustrated in [PseudoCode 2](#appendix4.xhtml#box4_1)
    ([Appendix 1](#appendix1.xhtml)). For example, if the first element in the list
    (index\[0\]) is a common noun, the code would check if the NLQ word is a table.
    Also, if there is a corresponding attribute to a value, add the word to the values
    list, and so on. The algorithm applies the ‘Maximum Length Algorithm’, illustrated
    in [PseudoCode 3](#ch4.xhtml#box4_2), to remove tokens from the attributes list
    if the tokens are also in the values list. This algorithm enables the system to
    avoid duplicate use of the same tokens, which helps in avoiding potential errors
    and inaccuracy.


    To recognize literal values, the functions “parse\_decimal” and “NumberFormatError”
    are used from the “babel.numbers” library. “parser” and “WordNetLemmatizer” functions
    from the “nltk.stem” Python library are used to insert the RDB elements’ synonyms
    into the RDB schema automatically.


    This happens by adding the synonym and then creating the relationship ‘IS\_LIKE’
    with the corresponding RDB element as illustrated in [PseudoCode 4](#ch4.xhtml#box4_8).


    During the tokenizer and tagger stage, illustrated in [PseudoCode 5](#appendix2.xhtml#box2_1)
    ([Appendix 2](#appendix2.xhtml)), NLQ POS, semantic analysis and syntactic representation
    are expressed and extracted by tagging them. This helps to extract the tokens’
    linguistic sub-parts (i.e., adjectives and noun/verb phrases) for accurate mapping
    later. The POS tagger will tag each NLQ token to define its syntactic role. The
    tokenizer analyzes the NLQ token types discussed in [Table 4](#ch4.xhtml#table4)
    and returns the extracted sentence structure parts (i.e., verbs, noun phrases)
    mentioned in the NLQ, together with the tagged version of the lemmatized tokens.
    In addition, tokens’ semantic roles under the SQL scope, which is a value, attribute,
    table or a relationship, will also be returned.


    [Table 4 Main rule-based assumptions](#ch4.xhtml#R_table4)


    | NLQ token type || Example || Schema category || SQL slot |


    | --- | --- | --- | --- |


    | Instance (Proper Noun) || Sarah || Value || WHERE condition |


    | --- | --- | --- | --- |


    | Adjective, Adverb, Gerund || Strongly || Attribute || SELECT or WHERE (if accompanied
    with a value) clause |


    | Number (Literal Value) || 100 || Value || WHERE condition |


    | Common Noun || Patient || Attribute/Table || SELECT/FROM selection operator
    clause |


    | Comparative Expression || Most || Conditional Values || MAX, MIN, AVG, etc.
    clauses or with WHERE clause |


    | Comparative Operation || Equal || Conditional Values || \=, >, <, <>, ><, >=,
    <=, etc. with WHERE clause |


    | Verb || has || Relationship || WHERE condition, JOIN, AS, or IN |


    | Wh-phrases || What || Value’s Attribute Indicator || N/A |


    | Prepositions || With || N/A || N/A |


    | Conjunction/Disjunction || And || N/A || WHERE condition AND, OR, etc. |


    Not only RDB elements are tagged with their synonyms, but SQL keywords are also
    tagged with synonyms and semantic information. This tagging happens using the
    semantics dictionary (WordNet) and the “nltk.tokenize” libraries, namely, “sentence\_tokenize”
    and “word\_tokenize”, as illustrated in [PseudoCode 6](#ch4.xhtml#box4_3).


    Other SQL keywords such as aggregate functions (e.g., AVG, SUM, etc.) or comparison
    operations (e.g., >, <, =, etc.), defined in the Python “unicodedata” library,
    are also tagged with their synonyms for easy and accurate mapping, as illustrated
    in [PseudoCode 7](#appendix3.xhtml#box3_1) ([Appendix 3](#appendix3.xhtml)).


    After all of the NLQ and SQL words are tagged with their synonyms, the algorithm
    will start the testing module to validate the similarity of RDB Lexica and NLQ
    tokens compared with their tagged synonyms. If the “Similarity” is greater than
    or equal to 75% (the least-acceptable similarity variance), it is considered a
    matching synonym. In this case, lexica or tokens are tagged with their matching
    synonyms according to their semantics using WordNet synonym datasets.


    ## Disambiguation


    NLQ input disambiguation is an intermediate process and is done through contextual
    analysis. When the system cannot make a decision due to some ambiguity, it asks
    the user for further input. This occurs in case of the presence of more than one
    match for a particular NLQ token (e.g., “Is Adam a patient or a physician?”).
    However, engaging the user is solely for clarifying a certain ambiguity in the
    NLQ input by choosing from a list of suggestions of similar words or synonyms
    present in the lexica list.


    In future work, and as a further disambiguation step to guarantee generated SQL
    accuracy, a feedback system could be applied after NLQ analysis. This feedback
    system asks the user to confirm the translated NLQ into SQL query by asking the
    user “is this the desired SQL?”. However, since we assume the user’s ignorance
    of any programming abilities, including SQL, this feedback system is not applied
    in the current research work.


    The RDB elements with identical names are carefully managed according to the NLQ
    MetaTable ([Table 1](#ch2.xhtml#table1)) and the RDB elements’ MetaTable ([Table
    2](#ch2.xhtml#table2)). Hence, the ambiguity-checking module will eventually have
    a list of all identically named elements and their locations in the RDB.


    Every entered NLQ goes through a syntactic rules checker for any grammatical mistakes.
    This module checks the NLQ validity or the need for a user clarification for any
    ambiguity or spelling mistakes using the Python libraries “unittest” and “textblob”.
    The algorithm will proceed to the next step if the NLQ is valid. Otherwise, the
    algorithm will look for a clarification or spelling correction response from the
    user by asking them to choose from a few potential corrections. Then, the user’s
    response is classified to either positive (i.e., Yes) or Negative (i.e., No).
    This classification happens using the Naïve Bayes Classifier from the prebuilt
    Python library “textblob.classifiers” used as an SQL grammar classifier. If the
    user’s response is positive, it will use the corrected form, otherwise, it will
    use their original NLQ form and work with it. This step uses the “Stanford CoreNLP”
    and “nltk.corpus” libraries to check for the NLQ validity and uses the syntactic
    rules checker to check for spelling errors as illustrated in [PseudoCode 8](#appendix4.xhtml#box4_1)
    ([Appendix 4](#appendix4.xhtml)).


    ## Matcher/mapper'
