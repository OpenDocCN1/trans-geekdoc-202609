    ## 实现环境和系统描述


    用于此实验的机器是 `MacBook Pro`。它运行 `macOS Mojave` 版本 `10.14.2`。处理器速度为 `2.9 GHz` `Intel
    Core i7 (SATA Interconnect)`，架构为 `64bit`。内存为 8 GB RAM（分布在两个插槽中，每个支持 `1600 MHz`
    `Double Data Rate 3 (DDR3)` 类型），磁盘空间为 750 GB。该 MacBook 具有双核心，每个核心 `256 KB`。


    对于实现编码和执行，选择了 `Python 3.7` [164]，因为它具有清晰的语法和用于 NLP 任务的任务库。集成开发环境（IDE）`PyCharm`、`Xcode`
    和 `XQuartz` 用于开发和编译源码，它们拥有与 Python Foundation [130] 一致的单元测试框架。系统所需的依赖包括基础工具和支持工具。所有工具已本地安装在实验机器上。基础工具在图
    16 中说明：


    *   `Python 3.7` [164]: 一种简洁且轻级的编程语言，兼容大多数操作系统平台。

    *   `MySQL Community Server 8.0.18` [165]: `MySQL` 数据库后端服务器。

    *   `MySQL` [166]: 用于存储和查询数据的数据库工具。

    *   `NLTK` [40]: 提供用于词形还原、分词、标记、解析、分类和语义推理的 Python 兼容库。除了 WordNet 语料库外，它还支持多个词汇资源的接口。

    *   `TextBlob` [167]: 一个用于处理 NLP 任务（如 POS 标记、分类、名词短语提取和情感分析）的 Python 库。

    *   `Stanford CoreNLP 3.9.2` [21]: 提供了一集成 NLP 工具，通过 Python 兼容 API 对输入进行语言分析。它提供句子结构情感分析以及句法依赖分析。此外，`Stanford
    CoreNLP` 提供词干提取、POS 标记器、日期时间标准化器、NER、标注器、解析器和引导模式学习。它还提供开放信息提取工具，例如提取 Token 之间的关系。

    *   `WordNet` [19]: 一个大型英语数据库，包含名词、动词、形容词等，此外还有 `synsets` 库，这是一组认知同义词。


    ![图 16 框架结构、工具和库](img/fig16_B.jpg)


    图 16 框架结构、工具和库。


    系统的支持工具包括：


    *   IDE `PyCharm` [168]: 用于代码开发和单元测试的 Python IDE。

    *   `XQuartz 2.7.11` [169]: 为 Apple OS X 设计的开发环境，带有支持的库和应用程序。

    *   `Xcode 11` [170]: Apple OSX 的应用程序开发工具，在此实现中用于检查代码的语法正确。

    *   `MySQL Workbench` [171]: 一种 SQL 开发和管理工具，主要用于可视化建模。


    ## 数据库


    当前实现使用 `MySQL DBMS` 作为后端环境。实现测试使用了两个数据库：`Zomato` [172] 用于测试，`WikiSQL` [173] 用于验证。使用小型数据库验证了框架的功能。通过
    `Zomato` 和 `WikiSQL` 两个数据库的结果，在表 11 中比较了框架的准确性、效率和生成能力。


    表 11


    | | Zomato | WikiSQL |

    | --- | --- | --- |

    | 大小 | 2.5 MB | 200.5 MB |

    | | | |

    | NLQ/SQL 实例 | 9,552 | 80,654 |

    | 数据源 | Kaggle | Wikipedia |


    `Zomato` [172] 出于 2008 年，是一个大小为 `2.5 MB` 的小型数据库，包含 9,552 个 NLQ 对，存储在逗号分隔的 `csv`
    文件系统中，如图 17 所示。


    ![图 17 Zomato 架构](img/fig17)


    `WikiSQL` [174] 出于 2017 年，被选择是因为它是大型数据库，拥有 80,654 个手动标注的示例。此外，`WikiSQL` [175]
    被认为是语义解析最大的数据库，用于开发多样化的查询。因此，它是泛化算法的理想数据库。'
