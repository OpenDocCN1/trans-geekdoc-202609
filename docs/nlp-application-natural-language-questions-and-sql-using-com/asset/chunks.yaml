    \ [191]。\n\n# 7 结果讨论\n\nDOI: [10.1201/b2367-7](https://doi.org/10.1201/b2367-7)\n\
    \n在精确度方面，Zomato RDB 得分为 93%，而 WikiSQL 得分为 91%。这些是正确生成查询的比例。\n\n从上述的精确度和召回率可以推导出\
    \ F 值，公式为 `F-measure = 2PR/(P + R)`。F 值是应用算法后匹配 RDB 的平均性能指标。Zomato RDB 的实现 F 值为\
    \ 94.5%，而 WikiSQL 为 92%。在表 16 中，两个 RDB 实验的性能对比通过淆矩阵总结。表中的数字代表所有运行的平均值。\n\n| 指标\
    \ | Zomato RDB | WikiSQL RDB |\n| --- | --- | --- |\n| 准确率 (Accuracy) | 94.85\
    \ | 92.78 |\n| --- | --- | --- |\n| 召回率 (Recall) | 96 | 93 |\n| 真正性率 (TPR) | 43\
    \ | 42 |\n| 假正率 (FPR) | 3 | 4 |\n| 真负性率 (TNR) | 49 | 48 |\n| 假负性率 (FNR) | 2 |\
    \ 3 |\n| 精确度 (Precision) | 93 | 91 |\n| F 值 (F-Measure) | 94.5 | 92 |\n\n图 22\
    \ 展示并总结了所有上述性能测量指标。根据图 22 中准确率、召回率、精确度和 F 值的柱状图，结合错误率（FPR 和 FNR）的对比，可以得出所提算法运行正常且符合需求。因此，映射算法确实成功选择了正确的\
    \ RDB 元素，并使用新颖映射机制将其映射到正确的 SQL 子句中。这种映射是基于对句子结构的语言学研究，通过将句子拆分到单词级别并研究词与之间及内部的关系。\n"
