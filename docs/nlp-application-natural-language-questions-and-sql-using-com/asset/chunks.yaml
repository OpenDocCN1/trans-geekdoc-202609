    While the current work uses computational linguistics mapping constraints to transform
    RDB lexica into SQL clauses and keywords, [[119](#reference.xhtml#refbm_119)]
    uses the extended UML class diagrams representations [[34](#reference.xhtml#refbm_34),
    [104](#reference.xhtml#refbm_104), [118](#reference.xhtml#refbm_118)]. Those representations
    are used to extract fuzzy tokens’ semantic roles, which are imprecise terms or
    linguistic variables consisting of fuzzy terms like ‘young’, ‘rarely’, ‘good’
    or ‘bad’ [[60](#reference.xhtml#refbm_60), [83](#reference.xhtml#refbm_83), [86](#reference.xhtml#refbm_86),
    [103](#reference.xhtml#refbm_103), [117](#reference.xhtml#refbm_117), [137](#reference.xhtml#refbm_137),
    [141](#reference.xhtml#refbm_141)]. Fuzzy tokens’ semantic roles are extracted
    in the form of a validation sub-graph or tree of the Self Organizing Maps (SOM)
    diagram representation [[147](#reference.xhtml#refbm_147)]. SOM diagrams transform
    UML class diagrams into SQL clauses [[148](#reference.xhtml#refbm_148)] using
    the fuzzy set theory [[49](#reference.xhtml#refbm_49)]. According to [[119](#reference.xhtml#refbm_119)],
    fuzzy NLQs with fuzzy linguistic terms are more flexible compared with precise
    NLQs as they provide more potential answers in the case of no available direct
    answers. However, though this might provide higher measures of recall, it is significantly
    compromising the FPR ratio. Hence, fuzzy NLQs are not considered in the current
    research.


    In [[119](#reference.xhtml#refbm_119)], similar approaches to the current work
    are implemented for RDB lexica mapping into SQL clauses. The work of [[119](#reference.xhtml#refbm_119)]
    uses RDB relationships to map the lexica into NLQ linguistic semantic roles’ classes
    as a conceptual data model. However, since the current work uses supportive NLP
    linguistic tools, it is more capable of “understanding” the NLQ statement before
    translating it into SQL query, which highly contributes to the increase in the
    translation accuracy. Regarding the linguistic inter-relationships within the
    RDB schema in the current work, not only WordNet is used, but also a Natural Language
    Toolkit (NLTK) and NLP linguistic tools. In addition, a manual rule-based algorithm
    is also used to define how NLQ linguistic roles match with the RDB elements, which
    does not exist in [[119](#reference.xhtml#refbm_119)] and which explains the variance
    in translation accuracy and precision in comparison.


