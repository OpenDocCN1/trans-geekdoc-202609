- raw: 'For the join strategy, and in the DBLF formula, for each new relation reference
    a join operation is built in the SQL FROM clause recursively in a top-down direction.
    Universal quantifiers are usually implemented by creating counters using double-nested
    constructs as in (NOT EXISTS \[sub-SQL\]) which has been used in the TQA system
    \[[108](#reference.xhtml#refbm_108)\]. However, \[[107](#reference.xhtml#refbm_107)\]
    uses the temporary relation creation strategy instead to handle universal and
    numeric quantifiers and to handle ordinals and a mixture of aggregate functions
    as well. The temporary relations are created using the join-strategy to easily
    embed them in any SQL expression. Hence, whenever there is a quantifier, a temporary
    relation is built for it recursively. For the negation strategy, and in DBLF,
    negation is handled by setting the “reverse” marker for yes/no questions if the
    negation at the beginning of the sentence, and by using (NOT IN \[subquery\])
    constructs in case of verb-negation and negated quantifiers in other positions.
    Both negation handling methods are doable if the negation occurs in front of a
    simple predicate, and in this case, the number and position of negation particles
    is not restricted. For the Mixed strategies, any of the previous three strategies
    can be mixed arbitrarily as in building temporary relations when aggregate functions
    or ordinals occur.


    TQA \[[108](#reference.xhtml#refbm_108)\] is an NLI that transforms NLQs into
    SQL directly using semantic grammar and deep structure grammar to obtain a higher
    performance and better ellipses and anaphora handling. However, TQA and similar
    systems are almost not transportable and barely adaptable to other DB domains.


    PHLIQAl \[[4](#reference.xhtml#refbm_4)\], ASK \[[46](#reference.xhtml#refbm_46)\]
    and TEAM \[[16](#reference.xhtml#refbm_16)\] adopt the intermediate semantic representation
    languages connected with a Conceptual Schema (CS) to provide an efficient NLQ
    into SQL transformation tool. CS helps mapping NLQ tokens to their DB lexicon
    representations because it stores all NLQ tokens, DB terms of relations and attributes
    and their taxonomies, in addition to the DB hierarchy structure and metadata.


    The USL system \[[109](#reference.xhtml#refbm_109)\] is adaptable and transportable
    because it has a customization device. Yet its intermediate semantic and structure
    language is syntax-oriented, and not based on predicate logic. Hence, some semantic
    meanings are represented though tree structures forms.


    TQA and USL techniques together form the LanguageAccess system \[[107](#reference.xhtml#refbm_107)\],
    which has a unique SQL generation component that uses the DBLF and the Conceptual
    Logical Form (CLF) as two distinct intermediate semantic representation languages.


    LanguageAccess system works through many steps. First, a phrase structure grammar
    parses an NLQ to generate parse trees, which are then mapped to CLF using the
    CS. Generated CLF formulae are paraphrased in NL and then presented to the end
    user for ambiguous tokens interpretations and meaning verification. Once the end
    user chooses a CLF formula, using the CS, it gets transformed to DBLF, the source
    of SQL generation, which is then transformed to SQLs. DBLF considers the DB values
    internal representations (e.g. strings, numbers), the temporary relations order,
    and the generated expressions delivery mechanism to DBs.


    Authors of \[[7](#reference.xhtml#refbm_7), [110](#reference.xhtml#refbm_110),
    [111](#reference.xhtml#refbm_111)\] used NLQs semantic parsing to model algorithms
    to map NLQs to SQLs. Similar research work is done by \[[112](#reference.xhtml#refbm_112)\]
    using specific semantic grammar. Authors of \[[7](#reference.xhtml#refbm_7), [110](#reference.xhtml#refbm_110),
    [113](#reference.xhtml#refbm_113)\] used lambda calculus and applied it on NLQs
    meaning representation for the NLQ to SQL mapping process. Furthermore, \[[114](#reference.xhtml#refbm_114)\]
    used ILP framework’s defined rules and constrains to map NLQs using their semantic
    parsing. For the same purpose, \[[7](#reference.xhtml#refbm_7), [110](#reference.xhtml#refbm_110),
    [111](#reference.xhtml#refbm_111)\] followed a time-consuming and expensive approach
    by producing NLQ tokens’ meaning representations manually. Similarly, \[[112](#reference.xhtml#refbm_112)\]
    developed an authoring system through extensive expertise time and efforts on
    semantic grammar specification. Authors of \[[7](#reference.xhtml#refbm_7), [110](#reference.xhtml#refbm_110),
    [113](#reference.xhtml#refbm_113)\] developed a supervision-extensive system using
    lambda-calculus to map NLQs to their corresponding meaning representations.


    Similar to KRISP \[[78](#reference.xhtml#refbm_78)\], Giordani and Moschitti \[[115](#reference.xhtml#refbm_115)\]
    developed a model using only Q/A pairs of syntactic trees as the SQL compiler
    provides the NLQs derivation tree that is required to translate factoid NLQs into
    structural RDB SQLs with generative parsers that are discriminatively reranked
    using an advanced ML SVM-ranker based on string tree kernels. The reranker reorders
    the potential NLQ/SQL pairs list which has a recall of 94%, recalling the correct
    answers in this system.


    The system in \[[115](#reference.xhtml#refbm_115)\] does not depend on NLQ-annotated
    meaning resources (e.g. Prolog data, Lambda calculus, MR, or SQLs) or any manual
    semantic representations except for some synonym relations that are missing in
    WordNet. The first phase is the generation phase where NLQ tokens’ lexical dependencies
    and DB metadata-induced lexicon in addition to WordNet are used, instead of a
    full NLQ’s semantic interpretation, to build the SQL clauses (i.e. SELECT, WHERE,
    FROM, joins, etc.) recursively with the help of some rules and a heuristic weighting
    scheme. DB metadata does the relations disambiguation tasks and includes DB data
    types, Primary Keys (PKs) and Foreign Keys (FKs) and other constraints, names
    of entities, columns and tables according to domain semantics, and is also called
    DB catalog usually stored as INFO\_SCHEMA (IS) in a DB. The output of the generation
    phase is a ranked potential SQLs list created by the generative parser.


    In Dependency Syntactic Parsing is used to extract NLQ tokens’ lexical relations
    and dependencies. According to \[[19](#reference.xhtml#refbm_19)\], WordNet is
    efficient at expanding predicate arguments to their meaning interpretations and
    synonyms; however, WordNet generalizes the relation arguments but does not guarantee
    NLQ’s lack of ambiguity and noise which affects its meaning interpretation significantly.
    Therefore, this system generates every possible SQL with all of its clauses, including
    ambiguous ones, based on NLQs lexical and grammatical relations dependencies matches,
    extracted by the Stanford Dependencies Parser \[[116](#reference.xhtml#refbm_116)\],
    and SQL clauses’ logical and syntactic formulation structures.'
  fmt: '

    For the join strategy, and in the `DBLF` formula, for each new relation reference
    a join operation is built in the SQL `FROM` clause recursively in a top-down direction.
    Universal quantifiers are usually implemented by creating counters using double-nested
    constructs as in `(NOT EXISTS [sub-SQL])` which has been used in the `TQA` system
    [[108](#reference.xhtml#refbm_108)]. However, [[107](#reference.xhtml#refbm_107)]
    uses the temporary relation creation strategy instead to handle universal and
    numeric quantifiers and to handle ordinals and a mixture of aggregate functions
    as well. The temporary relations are created using the `join-strategy` to easily
    embed them in any SQL expression. Hence, whenever there is a quantifier, a temporary
    relation is built for it recursively. For the negation strategy, and in `DBLF`,
    negation is handled by setting the “reverse” marker for yes/no questions if the
    negation at the beginning of the sentence, and by using `(NOT IN [subquery])`
    constructs in case of verb-negation and negated quantifiers in other positions.
    Both negation handling methods are doable if the negation occurs in front of a
    simple predicate, and in this case, the number and position of negation particles
    is not restricted. For the Mixed strategies, any of the previous three strategies
    can be mixed arbitrarily as in building temporary relations when aggregate functions
    or ordinals occur.


    `TQA` [[108](#reference.xhtml#refbm_108)] is an NLI that transforms NLQs into
    SQL directly using semantic grammar and deep structure grammar to obtain a higher
    performance and better ellipses and anaphora handling. However, `TQA` and similar
    systems are almost not transportable and barely adaptable to other DB domains.


    `PHLIQAl` [[4](#reference.xhtml#refbm_4)], `ASK` [[46](#reference.xhtml#refbm_46)]
    and `TEAM` [[16](#reference.xhtml#refbm_16)] adopt the intermediate semantic representation
    languages connected with a Conceptual Schema (`CS`) to provide an efficient NLQ
    into SQL transformation tool. `CS` helps mapping NLQ tokens to their DB lexicon
    representations because it stores all NLQ tokens, DB terms of relations and attributes
    and their taxonomies, in addition to the DB hierarchy structure and metadata.


    The `USL` system [[109](#reference.xhtml#refbm_109)] is adaptable and transportable
    because it has a customization device. Yet its intermediate semantic and structure
    language is syntax-oriented, and not based on predicate logic. Hence, some semantic
    meanings are represented though tree structures forms.


    `TQA` and `USL` techniques together form the `LanguageAccess` system [[107](#reference.xhtml#refbm_107)],
    which has a unique SQL generation component that uses the `DBLF` and the Conceptual
    Logical Form (`CLF`) as two distinct intermediate semantic representation languages.


    `LanguageAccess` system works through many steps. First, a phrase structure grammar
    parses an NLQ to generate parse trees, which are then mapped to `CLF` using the
    `CS`. Generated `CLF` formulae are paraphrased in NL and then presented to the
    end user for ambiguous tokens interpretations and meaning verification. Once the
    end user chooses a `CLF` formula, using the `CS`, it gets transformed to `DBLF`,
    the source of SQL generation, which is then transformed to SQLs. `DBLF` considers
    the DB values internal representations (e.g. strings, numbers), the temporary
    relations order, and the generated expressions delivery mechanism to DBs.


    Authors of [[7](#reference.xhtml#refbm_7), [110](#reference.xhtml#refbm_110),
    [111](#reference.xhtml#refbm_111)] used NLQs semantic parsing to model algorithms
    to map NLQs to SQLs. Similar research work is done by [[112](#reference.xhtml#refbm_112)]
    using specific semantic grammar. Authors of [[7](#reference.xhtml#refbm_7), [110](#reference.xhtml#refbm_110),
    [113](#reference.xhtml#refbm_113)] used lambda calculus and applied it on NLQs
    meaning representation for the NLQ to SQL mapping process. Furthermore, [[114](#reference.xhtml#refbm_114)]
    used ILP framework’s defined rules and constrains to map NLQs using their semantic
    parsing. For the same purpose, [[7](#reference.xhtml#refbm_7), [110](#reference.xhtml#refbm_110),
    [111](#reference.xhtml#refbm_111)] followed a time-consuming and expensive approach
    by producing NLQ tokens’ meaning representations manually. Similarly, [[112](#reference.xhtml#refbm_112)]
    developed an authoring system through extensive expertise time and efforts on
    semantic grammar specification. Authors of [[7](#reference.xhtml#refbm_7), [110](#reference.xhtml#refbm_110),
    [113](#reference.xhtml#refbm_113)] developed a supervision-extensive system using
    lambda-calculus to map NLQs to their corresponding meaning representations.


    Similar to `KRISP` [[78](#reference.xhtml#refbm_78)], Giordani and Moschitti [[115](#reference.xhtml#refbm_115)]
    developed a model using only Q/A pairs of syntactic trees as the SQL compiler
    provides the NLQs derivation tree that is required to translate factoid NLQs into
    structural RDB SQLs with generative parsers that are discriminatively reranked
    using an advanced ML SVM-ranker based on string tree kernels. The reranker reorders
    the potential NLQ/SQL pairs list which has a recall of 94%, recalling the correct
    answers in this system.


    The system in [[115](#reference.xhtml#refbm_115)] does not depend on NLQ-annotated
    meaning resources (e.g. Prolog data, Lambda calculus, MR, or SQLs) or any manual
    semantic representations except for some synonym relations that are missing in
    WordNet. The first phase is the generation phase where NLQ tokens’ lexical dependencies
    and DB metadata-induced lexicon in addition to WordNet are used, instead of a
    full NLQ’s semantic interpretation, to build the SQL clauses (i.e. `SELECT`, `WHERE`,
    `FROM`, joins, etc.) recursively with the help of some rules and a heuristic weighting
    scheme. DB metadata does the relations disambiguation tasks and includes DB data
    types, Primary Keys (`PKs`) and Foreign Keys (`FKs`) and other constraints, names
    of entities, columns and tables according to domain semantics, and is also called
    DB catalog usually stored as `INFO_SCHEMA` (`IS`) in a DB. The output of the generation
    phase is a ranked potential SQLs list created by the generative parser.


    In Dependency Syntactic Parsing is used to extract NLQ tokens’ lexical relations
    and dependencies. According to [[19](#reference.xhtml#refbm_19)], WordNet is efficient
    at expanding predicate arguments to their meaning interpretations and synonyms;
    however, WordNet generalizes the relation arguments but does not guarantee NLQ’s
    lack of ambiguity and noise which affects its meaning interpretation significantly.
    Therefore, this system generates every possible SQL with all of its clauses, including
    ambiguous ones, based on NLQs lexical and grammatical relations dependencies matches,
    extracted by the Stanford Dependencies Parser [[116](#reference.xhtml#refbm_116)],
    and SQL clauses’ logical and syntactic formulation structures.

