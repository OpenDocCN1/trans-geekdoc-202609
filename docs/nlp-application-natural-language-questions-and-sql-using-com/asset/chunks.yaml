- raw: 'In the current research, the second approach is adopted because it does not
    restrict the user to using certain domain-specific keywords \[[40](#reference.xhtml#refbm_40),
    [72](#reference.xhtml#refbm_72)\], as is the case in the restricted NLQ input
    approach. This is because the aim in the current work is to facilitate the HCI
    without users’ prior knowledge of the RDB schema and the system’s infrastructure,
    underlying NLP linguistic tools or any specific query language.


    In addition, NLQ is the most natural way of communication for humans. The first
    approach, authoring interface-based systems, relies heavily on end-user input
    through all the interface screens that they have to go through to specify and
    modify the used keywords or phrases. Hence, it might seem to the user that it
    would have been easier for them if they had any programming knowledge to enter
    the SQL statement directly without using the Natural Language Interface (NLI)
    screens. Hence, the current work only involves end users in the case of any spelling
    mistakes or ambiguate phrases. In this regard, in \[[40](#reference.xhtml#refbm_40),
    [52](#reference.xhtml#refbm_52), [68](#reference.xhtml#refbm_68), [69](#reference.xhtml#refbm_69),
    [87](#reference.xhtml#refbm_87)\], authors described the menu-based or restricted
    keyword-based NLQ approaches as methods of mapping. In their paper, they explained
    how insignificant restricted NLQ input systems are in terms of accuracy and recall.
    Besides, it also has portability problems even with advanced algorithms such as
    Similarity-Based Top-k Algorithm \[[79](#reference.xhtml#refbm_79)\] that compares
    the similarity between dictionary k-records and NLQ tokens. This algorithm achieved
    an accuracy of 84% only \[[100](#reference.xhtml#refbm_100)\], whereas the current
    research system achieved an accuracy of as high as 95%.


    Most language translation approaches or QAS systems rely on rich annotated training
    data (corpus) with employed statistical models or non-statistical rule-based approaches.
    As such, the third approach that relies on MLA algorithms requires the presence
    of huge domain-specific (specific keywords used in the NLQ) NLQ/SQL translation
    pairs’ corpora. Such a corpus is difficult to create because it is very time-consuming
    and a tedious task required by a domain expert. NLQ/SQL pairs corpus requires
    hundreds of manually written pairs written and examined by a domain expert to
    train and test the system \[[70](#reference.xhtml#refbm_70), [76](#reference.xhtml#refbm_76),
    [138](#reference.xhtml#refbm_138)\].


    Avinash \[[102](#reference.xhtml#refbm_102)\] employed a domain-specific ontology
    for the NLQ’s semantic analysis. As a result, Avinash’s algorithm would fall under
    the over-customization problem, making the system unfunctional on any other domain.
    It is also neither transportable nor adaptable to other DB environments, except
    with extensive re-customisation. Such domain-specific systems assume the user
    is familiar with the DB schema, data and contents. On the other hand, the current
    research work uses simple algorithmic rules and is domain-independent. Hence,
    it does not assume prior knowledge of the adopted RDB schema or require any annotated
    corpora for training the system. Instead, it uses linguistic tools to understand
    and translate the input NLQ. However, the used NLQ/SQL pairs are only used for
    algorithm testing and validation purposes. Furthermore, relying heavily on MLAs
    proved to be not effective in decreasing the translation error rates or increasing
    accuracy \[[139](#reference.xhtml#refbm_139)\]. This remains the case even after
    supplying the MLA algorithm with a dedicated Error Handling Module \[[77](#reference.xhtml#refbm_77)\].
    In this regard, the current research work took proactive measures by using NLP
    linguistic techniques to make sure the NLQ is fully understood and well interpreted.
    This full interpretation happens through the intermediate linguistic layers and
    the RDB MetaTable before going any further with the processing; to avoid potential
    future errors or jeopardize accuracy. Computational linguistics is used here in
    the form of linguistics-based mapping constraints using manually written rule-based
    algorithms. Those manually written algorithms are mainly observational assumptions
    summarised in [Table 4](#ch4.xhtml#table4) ([Chapter 4](#ch4.xhtml)). [Table 4](#ch4.xhtml#table4)
    specifies RDB schema categories and semantic roles to map the identified RDB lexica
    into the SQL clauses and keywords.


    Generally speaking, rule/grammar-based approaches \[[102](#reference.xhtml#refbm_102)\]
    require extensive manual rules defining and customizing in case of any DB change
    to maintain accuracy \[[140](#reference.xhtml#refbm_140)\]. However, the rule-based
    observational algorithm implemented in the current research work is totally domain-independent
    and transportable to any NLQ translation framework. Generally, mapping is a complicated
    science \[[14](#reference.xhtml#refbm_14)\] because low mapping accuracy systems
    are immediately abandoned by end users due to the lack of system reliability and
    trust. Hence, this research work proposes a cutting-edge translation mechanism
    using computational linguistics. However, there are several aspects of the proposed
    research contribution which will be discussed in reference to the two mapping
    algorithms in [Figure 8](#ch4.xhtml#fig8) ([Chapter 4](#ch4.xhtml)).


    ## Mapping NLQ tokens into RDB lexica


    ### NLQ Tokens Extraction


    In the current research work, NLQ tokens extraction and their types identification
    happen through deep computational linguistics processes. The processes are done
    via underlying NLP linguistic tools that use an English word semantics dictionary
    (WordNet), RDB MetaTable (for the mapping algorithm) and a mapping table for unique
    values namely, Primary Keys (PKs) and Foreign Keys (FKs). The adopted linguistic
    method proved to be more accurate and effective than other tokens extraction methods
    such as:


    *   Morphological and word group analyzers for tokens extraction \[[35](#reference.xhtml#refbm_35)\],


    *   Pattern Matching \[[141](#reference.xhtml#refbm_141)\] to identify keywords
    and their types,


    *   NER Recognizer \[[93](#reference.xhtml#refbm_93)\] alone with the Coltech-parser
    in GATE \[[94](#reference.xhtml#refbm_94)\] to tokenize and extract NLQ’s semantic
    information,


    *   Java Annotation Patterns Engine (JAPE) grammars \[[88](#reference.xhtml#refbm_88)\]
    for NLQ tokenization and named entity tagging,


    *   Porter algorithm \[[97](#reference.xhtml#refbm_97)\] to extract tokens’ stems,


    *   Unification-Based Learning (UBL) algorithm \[[98](#reference.xhtml#refbm_98)\]
    which uses restricted lexical items and Combinatory Categorial Grammar (CCG) rules
    \[[98](#reference.xhtml#refbm_98)\] to learn and extract NLQ tokens,


    *   Dependency Syntactic Parsing \[[134](#reference.xhtml#refbm_134)\] to extract
    tokens and their lexical relations,


    *   Dependency-Based Compositional Semantics (DCS) \[[92](#reference.xhtml#refbm_92)\]
    system enriched with Prototype Triggers \[[92](#reference.xhtml#refbm_92)\], or


    *   Separate value and table extractor interfaces \[[29](#reference.xhtml#refbm_29)\],
    which is a compromising approach for not supporting the RDB schema elements’ MetaTables
    and synonyms such as in the current proposed system.


    ### RDB Lexica Mapping'
