- raw: 'This layer uses input from previous layers in conjunction with the available
    MetaTables’ data to translate NLQ into SQL. The complexity of SQL queries can
    be incredibly high because some of them might require aggregation, nesting or
    negation with multiple tables selection and joining. Therefore, logical expressions
    concatenations might be required to solve potential NLQ complexity (e.g., negation
    conjunction, subordinates, superlatives, etc.). Basic WHERE conditions are combined
    with AND, OR and NOT operators to fall onto the nested WHERE clauses where a second
    SELECT clause is nested in the WHERE clause.


    SQL templates and their complexity classifications determine which SQL category
    a particular NLQ falls under. The chosen SQL template’s clauses are filled with
    the matching RDB lexica. Furthermore, different translation systems support different
    SQL templates. Hence, accepted and recognized templates must be identified, together
    with their likelihood ratio and occurrence frequency.


    SQL Statements’ Types:


    *   Data Query Language (DQL): SELECT


    *   Data Manipulation Language (DML): INSERT, UPDATE, DELETE


    *   Data Definition Language (DDL): CREATE, ALTER, DROP


    *   Data Control Language (DCL): GRANT, REVOKE


    *   Transaction Control Language (TCL): BEGIN TRAN, COMMIT TRAN, ROLLBACK


    *   Data Administration Commands (DAC): START AUDIT, STOP AUDIT


    In the proposed research work, the focus is on the DQL, which has one command
    phrase (SELECT) in addition to other supplementary clauses (e.g., WHERE, AS, FROM).
    DQL, though it has one main command phrase, is the most used phrase among SQL’s
    other phrases, especially when it comes into RDB operations. The SELECT keyword
    is used to send an inquiry to the RDB seeking a particular piece of information.
    This could be done via a command line prompt (i.e., Terminal) or through an Application
    Program Interface (API). This research proposes a translation algorithm from NLQ
    into SQL using the SELECT command phrase and its supplementary clauses.


    ## SQL execution and result


    At this stage, the end user must establish a connection with the RDB to send along
    generated SQLs. This layer performs all Database Management System (DBMS) functions.
    Once the translation process is done and the SQL statement is generated, the query
    is executed against the RDB. The query results are integrated in the form of raw
    data, that is columns and rows, as NLIDB system output.


    The query results may get passed back to the first layer to produce a proper response
    to the end user in a natural language form. This is a reverse process to the original
    proposed research where SQL is the input and NLQ is the output for answer generation.
    This reverse process requires a discourse representation structure. The conversion
    from SQL into NLQ requires an ontology-based semantic interpreter. This interpreter
    is an intermediate language representation layer, which is not used in the original
    proposed research work.


    # 3 Literature Review


    DOI: [10.1201/b23367-3](https://dx.doi.org/10.1201/b23367-3)


    ## Related works


    ### NLP


    LUNAR \[[42](#reference.xhtml#refbm_42), [2013](#reference.xhtml#refbm_43) and
    [44](#reference.xhtml#refbm_44)\] was developed in **1971** to take NLQs about
    a moon’s rock sample and present answers from 2 RDBs using Woods’ Procedural Semantics
    to reference literature and an Augmented Transition Network (ATN) parser for chemical
    data analysis. However, it only handled 78% of the NLQs due to linguistic limitations
    as it manages a very narrow and specific domain.


    Philips Question Answering Machine (Philiqa) \[[4](#reference.xhtml#refbm_4)\]
    was developed in **1977**. Philiqa separates the syntactic and semantics parsing
    of NLQ as the semantic parser is composed of three layers, namely English Formal
    Language, World Model Language, and schema DB metadata.


    LIFER/LADDER \[[45](#reference.xhtml#refbm_45)\] was developed a year later, in
    **1978**, as a DB NLP system interface to retrieve information regarding US Navy
    ships. It used a semantic grammar to parse NLQs. Although LIFER/LADDER supported
    querying distributed DBs, it could only retrieve data for queries related to 1
    single table, or more than 1 table queries having easy join conditions.


    In **1983**, ASK \[[46](#reference.xhtml#refbm_46)\] was developed as a learning
    and information management system. ASK had the ability to communicate with several
    external DBs via the user’s NLQ interface. ASK is considered a learning system
    due to its ability to learn new concepts and enhance its performance through user’s
    interaction with the system.


    TEAM \[[16](#reference.xhtml#refbm_16)\] was developed in **1987** as an NLIDB
    with high portability and easy configurability on any DBA system without compatibility
    issues, which negatively affected TEAM’s core functionality. NLIDB is an NL-based
    query interface which the user can use as a means of interaction with the DB to
    access or retrieve data using NLQs. This interface tries to understand the NLQ
    by parsing and tokenizing it to tokens or lexicons, and then applying syntactic
    or semantic analysis to identify terms used in the SQL query formation.


    In **1997**, \[[17](#reference.xhtml#refbm_17)\] a method of conceptual query
    statement filtration and processing interface using NLP was defined to essentially
    analyze predicates using full-fledged NL parsing to finally generate a structured
    query statement.


    In **2002**, Clinical Data Analytics Language (CliniDAL) \[[27](#reference.xhtml#refbm_27)\]
    initiated a solution for the mapping problem of keyword-based search using the
    similarity-based Top-k algorithm. Top-k algorithm searches for k-records of a
    dictionary with a significant similarity matches to a certain NLQ compared to
    a predefined similarity threshold. This algorithm was successful with accuracy
    of around 84%.


    In **2002**, a Vietnamese NLIDB interface was developed for the economic survey
    of DBs. This proposal also included a WordNet-based NLI to RDBs to access and
    query DBs using a user’s NL \[[18](#reference.xhtml#refbm_18)\].


    In the same year, **2002**, DBXplorer employed two preprocessing steps, PUBLISH
    which builds symbol tables and associated structures, and SEARCH which fetches
    the matching rows from published DBs. Together, PUBLISH and SEARCH enable Keyword-based
    search to RDBs \[[12](#reference.xhtml#refbm_12)\].


    In **2004**, PRECISE \[[47](#reference.xhtml#refbm_47)\] was developed to use
    the Semantically Tractable Sentences concept. The semantic interpretation of the
    sentences in PRECISE is done by analyzing language dictionaries and semantic constraints.
    PRECISE matches the NLQ tokens with the corresponding DB structures in two stages.
    Stage 1, it narrows down possible DB matches to the NLQ tokens using the Maximum
    Flow Algorithm (MFA). MFA finds the best single Flow Network as a directed graph
    to finally specify one source and one path to increase the flow’s strength. MFA
    returns the maximum # of keywords back to the system. Stage 2 is analyzing the
    sentence syntactic structure. After that, PRECISE uses the information returned
    from both stages to accurately transform the NLQ to an equivalent SQL query. However,
    PRECISE has a poor knowledge base as it only retrieves results that are keyword-based
    due to NL general complexity and ambiguity.


    In **2005**, an NLP question answering system on RDB was defined for NLQ to SQL
    query analysis and processing to improve the work on XML processing for the structural
    analysis with DB support. Query mapping was used to derive the DB results \[[48](#reference.xhtml#refbm_48)\].


    In **2006**, NUITS system was implemented as a search algorithm using DB schema
    structure and content-level clustering to translate a conditional keyword-based
    query and retrieve resulting tuples \[[49](#reference.xhtml#refbm_49)\].'
