  trans: '

    尽管该领域的近期研究 [142]]使用了最先进的工具和技术，但在标记映射算法或处理复杂 SQL 方面仍然未能获得高准确率。2018 年的一项近期工作示例是
    Spider [142]]，它使用一个海量的人工标注 NLQ/SQL 对语料库作为训练和测试数据集来执行映射。此类数据集是使用复杂的跨领域语义解析和 SQL
    模式覆盖来创建的。然而，Spider 的表现出乎意料地导致其匹配和映射准确率非常低。因此，目前的研究工作与大多数之前的语言翻译机制尝试不同，因为这里的重点是将算法匹配结果的简单性和准确性视为最高优先级。


    目前的研究工作利用 `NLQ MetaTable`（表 1）将 NLQ 标记映射到 RDB 词表。`NLQ MetaTable` 涵盖了 NLQ 单词、其语言学或句法角色（名词、动词等）、匹配的
    RDB 类别（表、值等）、通用数据类型（单词、数字、混合等）、作为 PK 或 FK 的唯一性，以及它们的同义词和所属源（即表或属性）。`MetaTables`
    用于作为首要目标检查标记是否存在，然后将它们映射为作为关系、表、属性或值的逻辑角色。通用英语语言本体（`WordNet`）被用于支持 `MetaTables`
    单词的同义词、语义含义和词汇分析。


    所实现的 `MetaTables` 弥补了未使用任何深度 DB 架构数据字典（如 [81, 123]]）或有限数据字典（如 [43]]）的语言翻译算法准确率低的。根据
    [19]]，`WordNet` 能有效地将 NLQ 谓词参数扩展到它们的含义解释和同义词。然而，`WordNet` 泛化了关系参数，不能保证 NLQ 不存在歧义和噪声，这显著影响了它的含义解释。因此，当前的研究工作中采用了支持性技术，如消歧模块。此外，为了避免围绕
    RDB 唯一值的混淆，对大型 RDB 的统计进行了数据画像分析 [121]]，以自动编译唯一值、PK 和 FK 的映射表，并此查询频率更高的 RDB 元素。较小的
    RDB 映射表是手动构建的，而较大的 RDB 则使用数据画像技术来构建。唯一值通过指定它们的宿主源存储在映射表中，同时使用 `hashing function`
    来立即访问它们。


    ### RDB 词表关系


    NLQ 解析和依赖树（即增强转换网络 (ATN) 词汇关系解析器 [143]]）作为 NLP 语义和句法解析的一部分用于当前的研究工作中。这些解析器生成语法解析树来解释
    NLQ 标记的依赖和关系 [144]]。此外，在任何两个单词或值之间还发现了 RDB 词汇连接条件。这种连接基于单词或值之间的连通状态，或在依赖树中具有共同的父节点。解析有助于
    NLQ 语义提取和 RDB 词汇数据选择。RDB 元素的关系通过仅使用动词来表示 RDB 架构中的任何连接进行控制。动词的参数（主语或对象）映射到 RDB
    关系的对应元素：表、属性或值。如果 NLQ 动词未被识别或缺失，将通过分析匹配的 RDB 词表相互关系来寻找 NLQ 标记之间的关系。


    文献中还有其他方法识别词汇依赖和语法关系，例如 Stanford Dependencies Parser [145]]、依赖句法解析器 [134]] 和基于依赖的组合语义
    (DCS) 解析器 [92]]。当前的研究工作使用了一种简单的方法表示 RDB 元素的内部/内部关系。这种表示将 RDB 架构关系限制为动词形式，以便在 NLQ
    动词和 RDB 关系之间进行映射。


    ### NLP 句法和语义定义


    当前的研究通过分析两种语言的句法角色，发现了 NLQ 和 SQL 结构之间的共同语义。同样，通过找到其标记含义的组合来理解 NLQ，是语言映射和翻译过程中最核心的部分。因此，采用了词汇处理层面的计算语言学研究，而不是上述第五和第六种映射方法提到的类似于
    Lambda 演算术或树内核模型的方法。


    当前的研究框架克服了用于分析 NLQ 句法和语义的底层语言工具性能不佳的问题。通过使用支持性的 RDB 架构知识和语义数据模型（`MetaTables`）以及
    `WordNet` 本体，克服了这些缺陷。此外，除了基于句法的分析知识 [52] 外，还使用了 NLP 工具（如 NER 标记器、分词器或依赖解析器），从识别出的标记生成解析树，以便与
    RDB 元素进行正确映射。然而，仅依赖 NLQ 的句法和语义分析来进行映射过程是不够的，并且会产生很低的精确率、假阳性率 (FPR) 和真阴性率 (TNR)，如
    [1]], 7]], 46]], 51]], 57]], 76]], 115]], 116]], 131]] 所示。此类系统包括 [45]] 中的 LIFER/LADDER
    方法、SVM 算法或 SVM-Light 优化器 [146]]、通过核函数编码的 NLQ/SQL 语法树 [24]] 或概率上下文无关文法 (PCFG) 方法
    [111]]，后者在寻找优化语法方面被证明具有挑战性。因此，目前的工作通过 RDB 和 NLQ MetaTables 的形式，利用计算语言学支持 NLQ 的句法和语义语法分析。


    ## 将 RDB 词表映射到 SQL 子句


    ### SQL 子句映射


