    \ 服务器都需要建立一个新的服务请求。\n\n通常情况下，服务器的处理时间消耗取决于：\n\n*   查询的数量。\n*   每个查询所需的服务。\n* \
    \  服务器处理单个查询所需的时间。\n*   从队列中选择下一个查询的策略，即队列模型 [185]（例如，先来先服务 [186]、优先级调度 [187]\
    \ 或队列模型 [188]）。\n\n*注：此处原文逻辑似乎略有重复，翻译已按原意保留。*\n\n*   ...（此处原文为多次 队列模型 [188] \n\
