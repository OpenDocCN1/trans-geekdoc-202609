    Python NLP 轻量级库（`TextBlob`）被用作 NLQ POS（词性）识别器（即“speech_recognition”库）。实现了 NLQ
    标记器和词形还原器，以便于等效的 RDB 元素选择。此外，还考虑了其他库，包括限于：“string_punctuation”、“Stanford CoreNLPspellcheck”、`nltk.corpus`（使用
    WordNet）、`textblob.word`、`wordNetLemmatizer`、`nltk.stem`、`sentence_tokenize`、`word_tokenize`、`nltk.tokenize`、`unicodedata`（用于数学运算和符号）、`textt_processing`、`text_nlp`
    和 `server.tokenizer`。这些库的使用和分布在图 7 和 16（6 章）中进行了解释。


    ![图 7 详细的研究组织流程图（浅灰色框为 Python 库；深灰色框为任务；灰色色块为传递的数据）。](img/fig7_B.jpg)


    图 7 详细的研究组织流程图（浅灰色框为 Python 库；深灰色框为任务；灰色色块为传递的数据）。


    系统检查每个 NLQ 单词的语义角色并将其添加到注册表中以传递给下一步，如伪代码 2（附录 1）所示。例如，如果列表中的第一个元素（`index[0]`）是一个普通名词，代码将检查
    NLQ 单词是否为表。此外，如果值有对应的属性，则将该单词添加到值列表中，依此类推。算法应用了“最大长度算法”（如伪代码 3 所示。


    在分词器和标记器阶段（如伪代码 5（附录 2）所示），NLQ POS、语义分析和语法表示通过标记进行表达和提取。这有助于提取标记的语言子部分（即形容词和名词/动词短语），以便后续进行准确映射。POS
    标记器将标记每个 NLQ 标记以定义其语法角色。分词器分析在表 4 中讨论的 NLQ 标记类型，并返回 NLQ 中提到的提取出的句子结构部分（即动词、名词短语），以及带有标记的词形还原标记。此外，SQL
    范围内的标记语义角色（即值、属性、表或关系）也将被返回。


    表 4 主要基于规则的假设


    | NLQ 标记类型 || 示例 || Schema 类别 | SQL 槽 |

    | --- | --- | --- | --- |

    | 实例（专有名词） | Sarah | 值 | WHERE 条件 |

    | --- | --- | --- | --- |

    | 形容词、副词、动名词 | Strongly | 属性 | SELECT 或 WHERE 子句（如果伴随一个值） |

    | 数字（字面量值） | 100 | 值 | WHERE 条件 |

    | 普通名词 | Patient | 属性/表 | SELECT/FROM 选择操作子句 |

    | 比较表达式 | Most | 条件值 | MAX, MIN, AVG 等子句，或带有 WHERE 子句 |

    | 比较操作 | Equal | 条件值 | WHERE 子句中的 =, >, <, <>, ><, >=, <=, 等 |

    | 动词 | has | 关系 | WHERE 条件, JOIN, AS 或 IN |

    | 疑问词组 | What | 值的属性指示器 | N/A |

    | 介词 | With | N/A | N/A |

    | 连词/并列词 | And | N/A | WHERE 条件 AND, OR 等. |


    不仅 RDB 元素被标记了同义词，SQL 关键字也被标记了同义词和语义信息。这种标记使用语义字典（WordNet）和 `nltk.tokenize` 库，即
    `sentence_tokenize` 和 `word_tokenize` 完成，如伪代码 6 所示（附录 3）。


    在所有 NLQ 和 SQL 单词都标记了同义词后，算法将启动测试模块，验证 RDB 词典与 NLQ 标记的相似性。如果相似性大于等于 75%，则认为是匹配同义词。


    ## 消歧


    NLQ 输入消歧是一个中间过程，通过上下文分析完成。当系统由于歧义无法做出决策时，它会要求用户进一步输入。这发生在特定 NLQ 标记存在多个匹配项时（例如，“Adam
    是病人还是医生？”）。然而，引导用户完全是为了从词典中提供的建议列表中澄清 NLQ 输入中的某些歧义。


    在未来的工作中，作为确保 SQL 准确性的进一步消歧步骤，可以在 NLQ 分析后应用反馈系统。该反馈系统通过询问用户“这是所需的 SQL 吗？”来确认翻译后的
    SQL。然而，由于我们假设用户没有任何编程能力（包括 SQL），该反馈系统未应用于本文。


