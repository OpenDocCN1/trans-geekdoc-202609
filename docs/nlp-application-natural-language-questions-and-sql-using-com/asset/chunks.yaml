- raw: 'The majority of NLQ into SQL mapping processes employ sophisticated semantic
    and syntactic analysis procedures on the input NLQ \[[24](#reference.xhtml#refbm_24),
    [79](#reference.xhtml#refbm_79), [149](#reference.xhtml#refbm_149), [2013](#reference.xhtml#refbm_150)
    and [151](#reference.xhtml#refbm_151)\]. However, those analyses are computationally
    expensive. Hence, the current research work employs a lightweight approach for
    this type of query translations. In particular, the use of MetaTables which defines
    the lexicon semantic role (i.e., noun, verb, etc.) and its adjacent SQL slot,
    prioritising accuracy above complexity. Complex algorithms, such as the weighted
    links approach, compromise accuracy for complexity. An example is in \[[76](#reference.xhtml#refbm_76)\]
    that generates ordered and weighted SQLs scheme using Weighted Neural Networks
    \[[39](#reference.xhtml#refbm_39)\] and Stanford Dependencies Collapsed (SDC)
    \[[152](#reference.xhtml#refbm_152)\] as grammatical dependency relations between
    NLQ tokens. This system is expensive to implement and unscalable to bigger RDBs.
    It also prioritizes SQLs based on probability of correctness instead of accuracy
    and precision.


    However, what is interesting in \[[76](#reference.xhtml#refbm_76)\] is their use
    of linguistics in their algorithm where they identify NLQ’s subject or object
    to search the DB for matching attributes. This matching uses Weighted Projection-Oriented
    Stems \[[127](#reference.xhtml#refbm_127)\] to generate the SQL clauses accordingly.
    Yet the translation accuracy of this algorithm still falls behind the proposed
    algorithm in the current research work. This is because the current work uses
    further linguistic categories (i.e., adjectives, pronouns etc.) in addition to
    using the verbs to find the attributes’ and values’ intra-relationships instead
    of using a heavy weighted tool such as the Weighted Projection-Oriented Stems
    in \[[76](#reference.xhtml#refbm_76)\].


    Photon \[[153](#reference.xhtml#refbm_153)\] is another neural network-based NLQ
    into SQL translation approach that translates NLQs by parsing them into executable
    SQL queries. Photon is the state-of-the-art NLIDB introduced to the public in
    June 2020. It employs several modules as sublayers, such as a deep learning-based
    neural semantic parsing module, an NLQ corrector module, a DB engine and a response
    generator module. For the neural semantic parsing layer, BERT and a bi-directional
    Long-Short Term Memories (LSTM) machine learning algorithms were used to produce
    hidden representations that match NLQ tokens with table and attribute names. The
    NLQ corrector module detects untranslatable NLQs by highlighting an ambiguous
    or a confusion span around the token and then asks the user to rephrase the NLQ
    accordingly. Although Photon represents a state-of-the-art NLIDB and an NLQ translation
    mechanism, it still falls under the complex translation models while lighter weight
    translation algorithms are sought for. In addition, the Photon model relies on
    training datasets to train its translation algorithm, table value augmentation
    module, static SQL correctness checking module and neural translatability detector
    module. Furthermore, deep learning and neural networks approaches, generally speaking,
    tend to act as a black box where it is hard to interpret their predictions and
    hard to analyse their performance and evaluation metrics.


    An example of a simple mapping algorithm is SAVVY \[[154](#reference.xhtml#refbm_154)\]
    that uses pattern matching of DB query languages as a mapping algorithm. SAVVY
    does not apply any NLQ interpretation modules or parsing elaborations for the
    mapping process. Hence, its translation accuracy and overall performance is highly
    jeopardized.


    ### SQL Formation vs SQL Templates


    The current research work simplifies SQL queries generation by using ready SQL
    templates. Yet SQL construction constraints are used in the mapping algorithm
    to guarantee accurate SQL template selection. Despite the presence of flexible
    SQL templates, some recent works \[[52](#reference.xhtml#refbm_52), [91](#reference.xhtml#refbm_91),
    [105](#reference.xhtml#refbm_105), [107](#reference.xhtml#refbm_107), [108](#reference.xhtml#refbm_108),
    [120](#reference.xhtml#refbm_120)\] still use other methods to construct their
    own SQLs from scratch, which adds an extra computational complexity to the language
    translation system. An example is \[[91](#reference.xhtml#refbm_91)\], which defined
    a concept-based query language to facilitate SQL construction by means of NLQ
    Conceptual Abstraction \[[88](#reference.xhtml#refbm_88)\]. This work adds an
    additional unnecessary complex layer on top of the original system architecture.


    Furthermore, \[[103](#reference.xhtml#refbm_103), [106](#reference.xhtml#refbm_106)\]
    used semantic grammar analysis to store all grammatical words to be used for mapping
    NLQ’s intermediate semantic representation into SQLs. Due to this system’s complexity,
    this architecture can only translate simple NLQs, but not flexible with nested
    or cascaded SQLs. In comparison, the current proposed system does not map whole
    NLQs into existing SQLs, but maps NLQ lexica to the SQL clauses and keywords.
    This is to enable the translator algorithm to be domain-independent and configurable
    on any other environment, without the need of developing a training and testing
    datasets of NLQ/SQL pairs for every new domain such as in \[[24](#reference.xhtml#refbm_24)\].


    In \[[24](#reference.xhtml#refbm_24)\], a dataset of labeled NLQ/SQL pairs training
    and testing datasets are generated and classified to correct or incorrect using
    Kernel Functions and an SVM classifier. This mapping algorithm is at the syntactic
    level using NLQ semantics to build syntactic trees to select SQLs according to
    their probability scores. Giordani and Moschitti \[[24](#reference.xhtml#refbm_24)\]
    applies the statistical and shallow Charniak’s Syntactic Parser \[[126](#reference.xhtml#refbm_126)\]
    to compute the number of shared high-level semantics and common syntactic substructures
    between two trees and produce the union of the shallow feature spaces \[[24](#reference.xhtml#refbm_24)\].
    Such exclusive domain-specific systems are highly expensive and their performance
    is subjective to the accuracy and correctness of the employed training and testing
    datasets, which are manually written by a human domain expert. As such, the KRISP
    system \[[78](#reference.xhtml#refbm_78)\] achieved a 78% recall of correctly
    retrieved SQL answers, while the current research work achieved a 96% recall on
    the small RDB (2.5 MB) and a 93% recall on the large one (200.5 MB) due to the
    use of a light weighted mapping algorithm mapped to ready SQL templates.'
