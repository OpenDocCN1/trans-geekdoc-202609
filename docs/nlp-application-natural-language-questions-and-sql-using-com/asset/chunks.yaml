- raw: "While the aforementioned performance measurements are sufficient to answer\
    \ the current research question, the average time translating each query remains\
    \ 1.5 minutes. This could be mainly due to the humble computer system used to\
    \ run the testing and validation processes. However, this processing time could\
    \ be enhanced when analyzing the exact reasons of delay using further performance\
    \ analysis. For example, each server executing the NLQ into SQL translation requests\
    \ could be examined using the following specific performance metrics:\n\n*   Residence\
    \ time, RT = W/C: the system’s resource usage. This represents the average time\
    \ queries spend in the server (actual service time + waiting time).\n\n*   Utilization,\
    \ U = B/T: the average percentage of server’s busy time.\n\n*   Throughput, X\
    \ = C/T: the average percentage at which the server completes queries’ translation\
    \ requests.\n\n*   Queue length, N = W/T: the average number of queries at the\
    \ server, whether executing the translations or waiting for service.\n\n*   Mean\
    \ service time, S = B/C: the average time the server is busy with queries’ translation\
    \ processes.\n\n*   Area under graph, W = : the total time the server used to\
    \ translate all queries.\n\n    Where T = Total Period, C = Completed and B =\
    \ Busy Time.\n\nAfter running the analysis procedure, and as per [Figure 21](#ch6.xhtml#fig21),\
    \ it turns out that the process phase that took the longest time is the matching\
    \ and mapping phase. This is to be expected since it does most of the tasks executed\
    \ by the translation algorithm. A surprising discovery is the amount of time spent\
    \ on the query execution and results retrieval from the MySQL RDB as follows:\n\
    \n*   NL Interface = 0.04 secs\n\n*   POS Recognition = 0.25 secs\n\n*   Disambiguation\
    \ = 0.06 secs\n\n*   Matcher/Mapper = 0.63 secs\n\n*   SQL Template Generator\
    \ = 0.07 secs\n\n*   SQL Execution and Results = 0.45 secs\n\n![Figure 21 Translation\
    \ average time distribution of 1.5 minutes.](images/fig21_B.jpg)\n\n[Figure 21\
    \ Translation average time distribution of 1.5 minutes.](#ch6.xhtml#R_fig21)\n\
    \nThis time consumption breakdown represents the average time taken by each module\
    \ to execute a translation task. They were computed after running a group of translation\
    \ tasks and calculating the average time consumed by them combined.\n\nWhen an\
    \ SQL is passed to the DBMS engine for query processing, it is compiled by the\
    \ MySQL Community Server compiler for result retrieval. This process is faster\
    \ when dealing with small RDBs, but with large RDBs, the queries take much longer\
    \ to execute. This is mainly because the MySQL RDB is not designed for big data\
    \ application requirements.\n\nThe additional translation time consumed is proportional\
    \ to the size of the RDB since the matching and mapping process will have to examine\
    \ the whole RDB for potential matches. For example, with a 2MB RDB, the translation\
    \ could take 5 seconds to complete, while it could take up to 1.5 minutes for\
    \ a translation process to complete with an RDB of size 1GB.\n\nWhat also affects\
    \ the time consumption on the SQL execution and results phase is not having a\
    \ query optimizer module. Since the same SQL query can be written in several ways,\
    \ query optimization chooses the best way a query could be syntactically expressed.\
    \ Not well-formed or optimized queries take longer to execute, affecting the overall\
    \ process performance.\n\nFinally, MySQL Community Server does not use proper\
    \ temporary caching. Hence, frequently accessed data are not temporarily stored\
    \ in the cache to insure faster future accesses. Consequently, the MySQL Server\
    \ needs to establish a new service request whenever a new SQL query arrives for\
    \ execution.\n\nGenerally, the server processing time consumed depends on:\n\n\
    *   The number of queries.\n\n*   The amount of service each query needs.\n\n\
    *   The time required for the server to process individual queries.\n\n*   The\
    \ policy used to select the next query from the queue, the Queueing Model \\[[185](#reference.xhtml#refbm_185)\\\
    ] (e.g., the First-Come-First-Served \\[[186](#reference.xhtml#refbm_186)\\] or\
    \ Priority Scheduling \\[[187](#reference.xhtml#refbm_187)\\]).\n\nThe Queueing\
    \ Model \\[[188](#reference.xhtml#refbm_188)\\] could be used to enhance the translation\
    \ performance by grouping together the similar SQL types in the queue. However,\
    \ queueing models have dependency side effects considering the relationships between\
    \ the SQLs in the queue and the corresponding service times for each SQL execution\
    \ process.\n\nThose effects could be mitigated by using similar calculations based\
    \ on predicted workload intensity \\[[189](#reference.xhtml#refbm_189)\\] and\
    \ service requirements \\[[190](#reference.xhtml#refbm_190)\\]. The workload intensity\
    \ \\[[189](#reference.xhtml#refbm_189)\\] is a measure of the number of translation\
    \ requests made in a given time interval. The service requirements \\[[190](#reference.xhtml#refbm_190)\\\
    ] represent the amount of time each query translation request requires from the\
    \ server in the processing system.\n\nIf we assume that the system is fast enough\
    \ to handle the arriving translation requests, the queries’ translation completion\
    \ rate (throughput) would equal the arrival rate. In this ideal case, the implementation\
    \ environment would be called “jobs-flow balance” \\[[191](#reference.xhtml#refbm_191)\\\
    ] where each query translation duration equals zero minutes instead of 1.5 minutes,\
    \ as is the case in the current implementation environment.\n\n# 7 Implementation\
    \ Results Discussion\n\nDOI: [10.1201/b23367-7](https://dx.doi.org/10.1201/b23367-7)\n\
    \nIn terms of precision, Zomato RDB scored 93% while WikiSQL scored 91%. Those\
    \ are the proportion of the correctly generated queries. It also measures the\
    \ algorithm’s efficiency in the identification and retrieval of matching RDB lexica\
    \ since the retrieval of the wrong lexica would cause lower accuracy measures\
    \ due to wrong SQL generations.\n\nFrom the aforementioned precision and recall\
    \ measures, the F-measure can be derived where F-measure = 2PR/ (P + R). The F-measure\
    \ is the average performance measure of the matching RDB lexica retrieved as a\
    \ result of an accurate matching and mapping process during the NLQ into SQL translation.\
    \ Hence, the F-measure basically measures the accuracy of the data retrieved from\
    \ an RDB as a result of applying an algorithm. The implementation execution using\
    \ Zomato RDB had an F-measure of 94.5%, while WikiSQL had a 92%. In [Table 16](#ch7.xhtml#table16),\
    \ a comparison between the two RDB experiments’ performance measures is summarized\
    \ in a confusion matrix. The numbers in the table represent averages over all\
    \ runs of both experiments considering all queries in a run.\n\n[Table 16 Confusion\
    \ matrix comparison between the two RDB experiments](#ch7.xhtml#R_table16)\n\n\
    | Measure || Zomato RDB || WikiSQL RDB |\n\n| --- | --- | --- |\n\n| Accuracy\
    \ || 94.85 || 92.78 |\n\n| --- | --- | --- |\n\n| Recall || 96 || 93 |\n\n| TPR\
    \ || 43 || 42 |\n\n| FPR ||  3 ||  4 |\n\n| TNR || 49 || 48 |\n\n| FNR ||  2 ||\
    \  3 |\n\n| Precision || 93 || 91 |\n\n| F-Measure || 94.5 || 92 |\n\n[Figure\
    \ 22](#ch7.xhtml#fig22) illustrates and summarizes all aforementioned performance\
    \ metrics measures. With regard to the peaks of accuracy, recall, precision and\
    \ F-measure bars in [Figure 22](#ch7.xhtml#fig22), and in addition to the error\
    \ rates (FPR and FNR) comparison, it can be concluded that the proposed algorithm\
    \ is functioning properly and as needed. Hence, the mapping algorithm does indeed\
    \ select the correct RDB elements successfully and map them with the correct SQL\
    \ clauses using the novel mapping mechanism. This mapping is based on linguistics\
    \ studies of the sentence structure by breaking down the sentence into the words\
    \ level and study the words’ inter-/intra-relationships.\n\n![Figure 22 Comparison\
    \ between the two RDB experiments.](images/fig22_B.jpg)\n\n[Figure 22 Comparison\
    \ between the two RDB experiments.](#ch7.xhtml#R_fig22)"
