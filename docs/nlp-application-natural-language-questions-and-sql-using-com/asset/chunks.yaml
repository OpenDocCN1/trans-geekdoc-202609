    # Preface


    This book applies Natural Language Processing (NLP) concepts to help humans in
    their daily life. It discusses an automatic translation of an unstructured Natural
    Language Question (NLQ) into a Structured Query Language (SQL) statement. SQL
    is used as a Relational DataBase (RDB) interaction language with special query
    syntax and a computer-executable artificial language. This way, DataBase (DB)
    administrators or general users with little or no SQL querying abilities can perform
    queries on RDBs in an interactive manner. The Human–Computer Interaction (HCI)
    happens using users’ NLQs, which is in English in the proposed research. Users
    do not need to know SQL. (Note: The input text contained a repetitive loop which
    has been de-duplicated for clarity).


    # Introduction


    Natural Language Processing (NLP) is a field of artificial intelligence that focuses
    on the interaction between computers and human language. The goal is to enable
    computers to understand, interpret, and generate human language in a way that
    is useful and meaningful.

    '
