  fmt: '

    - `SVM` is not scalable to larger DBs.

    - Uses simple algorithmic rules and is domain independent.

    - It does not assume prior knowledge of the adopted `RDB` schema or require any
    annotated corpora for training.

    - `NLQ/SQL` pairs are only used for algorithm testing and validation purposes.

    - Focus is on understanding the `NLQ` to avoid potential future errors or jeopardize
    accuracy.


    ## 4. Restricted NLQ Input

    - Uses a simple keyword-based search structure.

    - Uses a user-friendly form or template based or menu based `NLI` to facilitate
    the mapping process.

    - Restricts the user to using certain domain-specific keywords.

    - Insignificant in terms of accuracy and recall.

    - Has portability problems even with advanced algorithms such as similarity-based
    `Top-k` algorithm.

    - The current work facilitates the interaction between humans and computers without
    `NLQ` restrictions.

    - Has a limited interaction with the user to assure the most natural way of communication,
    direct questioning and answering, without needing the user to identify any `NLQ`
    tokens semantic roles.

    - Provides high accuracy and recall.

    - Compatible with any `RDB` domain and a translation environment.


    ## 5. Lambda Calculus

    - Uses `NLQs` meaning representation for the mapping process.

    - A simple high-level language model of computation.

    - Has some complicated language logic.

    - Too abstract in many cases.

    - Very slow in execution.

    - Hard to define rules with its logical expressions.

    - Uses a compatible programming language, `Python`, that could be translated to
    any other language using grammatical parse trees and language compilers.

    - The current speed is an average of 1.5 mins per query.


    ## 6. Tree Kernels Models

    - Applies kernel functions on `NLQ/SQL` pairs syntactic trees to learn its grammar.

    - Applies linear kernels on a “bag-of-words” to train the classifier to select
    the correct `SQLs` for a given `NLQ`.

    - Requires a fully annotated `NLQ/SQL` pairs corpus.

    - Unable to recognise structural similarities and syntactic relations in an `NLQ`.

    - Has lower performance when scaled up to larger DBs.

    - Does not require an `NLQ/SQL` pairs corpus to develop.

    - The employed `NLP` tools carefully understands the `NLQ` and recognizes its
    structural similarities and syntactic relations.

    - Has an insignificantly lower performance with larger `RDB`s as well but is still
    acceptable.


    ## 7. Unified Modeling Language (UML)

    - Used to model the `DB`’s static relationships and data models.

    - Refers to the `DB`’s conceptual schema.

    - Limited to a few class diagram concepts (e.g., classes, attributes, associations,
    aggregation and generalization).

    - The end user has to identify classes and their constituents.

    - `UML` models visualization requires compatible environments.

    - `MetaTables` and mapping tables are used. They accommodate any type and kind
    of data.

    - Only `NLQ` input is required from the user.

    - Rule-based algorithm is compatible with all computational environments.


    ## 8. Weighted Links

    - Uses the highest weight meaningful joins for mapping between `NLQ` tokens, `RDB`
    lexica and `SQL` clauses.

    - Compromises accuracy with complexity.

    - Requires a huge annotated training dataset.

    - Computationally expensive.

    - Accuracy and simplicity are both the main focus in the current work.

    - No training dataset is needed.


    ## 9. NLQ Tokens into RDB Lexica Mapping (NLQ Tokens Extraction) | Morphological
    and Word Group Analyzers

    - Used for tokens extraction.

    - Analyses words’ morphology.

    - Requires a huge annotated training dataset.

    - Mapping accuracy is considerably low.

    - The English word semantics dictionary (`WordNet`) is used to extract words’
    semantic information.


    ## 10. Pattern Matching

    - Used to find keywords types.

    - Facilitates learning other domains’ features.

    - Requires a huge annotated training dataset.

    - Hard to analyse `NLQ/SQL` pairs mismatching causes.

    - `NLQ` tokens extraction and their types identification happens through `NLP`
    computational linguistics processes, mainly the `Lemmatizer` and the `tokenizer`.

    - The assumption-based rules make it easy to find out causes of `NLQ/SQL` pairs
    mismatching.


    ## 11. Name Entity Recognizer (NER) Alone with Coltech-Parser in GATE

    - Used to tokenize and extract `NLQ`’s semantic information.

    - Restricted to only recognize the `NLQ` tokens that already exist in the `NER`
    resource.

    - Integrating data from external resources is computationally expensive.

    - While `NER` tagging is part of the underlying `NLP` tools, the main data source
    is acquired from the `NLQ` and `RDB` `MetaTables`.

    - Mapping accuracy is considerably low.

    - `MetaTables` are used to check for tokens’ existence as a first goal, then mapping
    them to their logical role as a relationship, table, attribute or value.

    - `WordNet` is used to support the `MetaTables` with words’ synonyms, meanings
    and Lexical Analysis.


    ## 12. Java Annotation Patterns Engine (JAPE) Grammars

    - Used for `NLQ` tokenization and `NER` tagging.

    - Generates a tag probability distribution.

    - Applies a rich feature representation.

    - Less expressive than `SQL`-like languages.

    - It is memory extensive in that it creates a whole structured source tree for
    every `DB` element.

    - No source trees are required except for the `NLQ` tokens’ relations analysis
    step.


    ## 13. Porter Algorithm

    - Used to extract tokens’ stems.

    - Does not require knowledge structures’ reprocessing.

    - Only supports few languages.

    - Not a practical approach as it requires a huge memory to process.

    - Has a high false positives rate.

    - Hard to implement in other languages.

    - The current work is language independent.

    - Does not mandate the availability of a huge memory, except for the storage of
    the `RDB` and the `MetaTables`.


    ## 14. Unification-Based Learning (UBL) Algorithm

    - Extracts `NLQ` tokens using restricted lexical items and Combinatory Categorial
    Grammar (`CCG`) rules.

    - Long processing time.

    - Complicated nature of stemmer.

    - Has a high error rate in recognizing `NLQ` noun phrases.

    - Difficulty in analyzing tokens relations.

    - Average processing time of 1.5 mins per query.

    - The `NLP` tools easily identify tokens’ semantic roles and their lexical relations.


    ## 15. Dependency Syntactic Parsing

    - Used to extract tokens and their lexical relations.

    - Replaces parse trees with dependency structures.

    - Captures meaningful dependency relations directly.

    - Potential data loss during parse tree generation and expansion.

    - Eventual error propagation while applying the greedy parsing.

    - Language dependent.

    - `NLTK` parser parses the `NLQ` tokens according to the built-in semantic roles
    that are mapped to specific `RDB` elements.

    - A parse tree is generated and a dictionary of table names, attributes and tokens
    are maintained, and `NLQ`’s subjects, objects and verbs are identified.


    ## 16. Separate Value and Table Extractor Interfaces

    - A compromising approach for not supporting the `RDB` schema elements’ `MetaTables`
    and synonyms.

    - Ideal for complex `NLQ/SQL` pairs.

    - Requires a big annotated training dataset.

    - Does not provide information on `NLQ` tokens’ semantic relationships.

    - Requires a long time to process.

    - Supports `RDB` schema elements’ `MetaTables` and synonyms for tokens’ semantic
    information.

    - No need for a rich annotated corpus of `NLQ/SQL` pairs for algorithm training.

    - Domain-independent and configurable on any working environment.


    ## 17. NLQ Tokens into RDB Lexica Mapping (RDB Lexica Mapping) | Spider System

    '
  trans: '


    - `SVM` 无法扩展到更大的数据库。

    - 使用简单的算法规则，且与领域无关。

    - 它不假设对采用的 `RDB` 模式有先验知识，也不需要任何标注的语料库进行训练。

    - `NLQ/SQL` 对仅用于算法的测试和验证。

    - 重点在于理解 `NLQ` 以避免未来潜在的错误或损害准确性。


    ## 4. 限制性 NLQ 输入

    - 使用简单的基于关键词的搜索结构。

    - 使用用户友好的表单、模板或基于菜单的 `NLI` 来促进映射过程。

    - 限制用户使用某些领域特定的关键词。

    - 在准确率和召回率方面表现不佳。

    - 即使使用基于相似性的 `Top-k` 算法等先进算法，也存在移植性问题。

    - 当前的工作促进了人机交互，且不受 `NLQ` 限制。

    - 与用户的交互有限，以确保最自然的通信方式，即直接问答，无需用户识别任何 `NLQ` 标记的语义角色。

    - 提供了高准确率和高召回率。

    - 兼容任何 `RDB` 领域和翻译环境。


    ## 5. Lambda 演算

    - 使用 `NLQs` 语义表示进行映射过程。

    - 一种简单的层层语言计算模型。

    - 具有一些复杂的语言逻辑。

    - 在许多情况下过于抽象。

    - 执行非常慢。

    - 很难用其逻辑表达式定义规则。

    - 使用兼容的编程语言 `Python`，该语言可以通过语法解析树和语言编译器翻译成任何其他语言。

    - 当前速度为平均每次查询 1.5 分钟。


    ## 6. 树核模型

    - 在 `NLQ/SQL` 对的句法树上应用核函数以学习其语法。

    - 在“词袋”上应用线性核来训练分类器，为给定的 `NLQ` 选择正确的 `SQLs`。

    - 需要一个完全标注的 `NLQ/SQL` 对语料库。

    - 无法识别 `NLQ` 中的结构相似性和句法关系。

    - 在扩展到更大的数据库时性能较低。

    - 开发时不需要 `NLQ/SQL` 对语料库。

    - 用的 `NLP` 工具能仔细理解 `NLQ` 并识别其结构相似性和句法关系。

    - 在较大的 `RDB`s 上性能略有下降，但仍可以接受。


    ## 7. 统一建模语言 (UML)

    - 用于对 `DB` 的静态关系数据模型建模。

    - 指向 `DB` 的概念模式。

    - 限于少数类图概念（例如：类、属性、关联、聚合和泛化）。

    - 终端用户必须识别类及其组成部分。

    - `UML` 模型视觉化需要兼容的环境。

    - 使用了 `MetaTables` 和映射表。它们可以容纳任何类型和种类的数据。

    - 用户仅需 `NLQ` 输入。

    - 基于规则的算法兼容所有计算环境。


    ## 8. 加权链接

    - 使用权重最高的有意义连接进行 `NLQ` 标记、`RDB` 词汇和 `SQL` 子句之间的映射。

    - 在准确性和复杂性之间进行权衡。

    - 需要巨大的标注训练数据集。

    - 计算开销大。

    - 准确性和简单性都是当前工作的重点。

    - 不需要训练数据集。


    ## 9. NLQ 标记到 RDB 词汇的映射（NLQ 标记提取） | 形态与词组分析器

    - 用于标记提取。

    - 分析单词的形态。

    - 需要巨大的标注训练数据集。

    - 映射准确率相当低。

    - 英语单词的词词性。


    ## 10. 模式匹配

    - 用于提取类型。

    - 提取领域。

    - 需要巨大的标注训练数据集。

    - 解决 `NLQ/SQL` 对的匹配问题很困难。

    - 通过 `NLP` 词词器来处理 `NLQ` 标记。

    - 基于规则的算法解决 `NLQ/SQL` 对的匹配问题。


    ## 11. 命名实体识别 (NER)

    - 结合 GATE 资源进行 `NLQ` 标记和分词。

    - 提取语义信息。

    - 仅支持 `NLQ` 标记。

    - 整合外部数据的计算开销很大。

    - `NLP` 工具主要处理 `NLQ` 标记的 `MetaTables`。

    - 准确率相当低。

    - 使用 `WordNet` 确保 `NLQ` 标记的关系、表或值。


    ## 12. Java 标注引擎 (JAPE)

    - 用于 `NLQ` 标记和分词。

    - 生成概率分布。

    - 应用丰富的特征表示。

    - 表达能力不如 SQL 类语言。

    - 为每个 `DB` 元素创建结构化的源树。

    - 分析 `NLQ` 标记的关系。


    ## 13. Porter 算法

    - 用于提取标记词根。

    - 不需要结构重处理。

    - 仅支持少数语言。

    - 需要大量内存处理，因此并不实用。

    - 误报率高。

    - 在其他语言中实现困难。

    - 当前工作与语言无关。

    - 需要 `RDB` 和 `MetaTables`。


    ## 14. 基于统一的学习 (UBL) 算法

    - 使用限制词汇和组合范语法 (`CCG`) 提取 `NLQ`。

    - 处理时间长。

    - 词干器的复杂性。

    - 在识别 `NLQ` 名词短语方面错误率高。

    - 分析标记的关系。

    - 平均每次查询处理时间为 1.5 分钟。

    - `NLP` 工具可以轻松识别标记的语义角色及其词汇关系。


    ## 15. 依存句法分析

    - 用于提取标记及其词汇关系。

    - 用依赖结构取代解析树。

    - 直接捕捉有意义的依赖关系。

    - 在解析树生成和扩展过程中可能会丢失数据。

    - 应用贪婪解析时会出现错误传播。

    - 依赖语言。

    - `NLTK` 解析器根据映射到特定 `RDB` 元素的内置语义角色解析 `NLQ` 标记。

    - 生成解析树并维护表名、属性和标记的字典，并识别 `NLQ` 的主语、宾语和动词。


    ## 16. 值和表提取器接口

    - 一种不支持模式元素 `MetaTables` 和同义词的折中方案。

    - 适用于复杂的 `NLQ/SQL` 对。

    - 需要大型标注训练数据集。

    - 不提供 `NLQ` 标记语义关系的信息。

    - 处理时间长时间。

    - 支持 `RDB` 模式元素的 `MetaTables` 和同义词用于标记的语义信息。

    - 不需要丰富的 `NLQ/SQL` 对标注语料库进行算法训练。

    - 与领域无关，可在任何工作环境中进行配置。


    ## 17. NLQ 标记到 RDB 词汇的映射（RDB 词汇映射） | Spider 系统


