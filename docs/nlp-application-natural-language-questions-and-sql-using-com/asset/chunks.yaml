    *   `XQuartz 2.7.11` [[169](#reference.xhtml#refbm_169)]: A development environment
    designed for Apple OS X with supportive libraries and applications.

    *   `Xcode 11` [[170](#reference.xhtml#refbm_170)]: An application development
    tool for Apple OSX, used in this implementation to check codes’ syntactic rightness.

    *   `MySQL Workbench` [[171](#reference.xhtml#refbm_171)]: An SQL development
    and administration tool used mainly for visual modeling.


