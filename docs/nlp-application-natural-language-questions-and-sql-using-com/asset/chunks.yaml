- raw: '[Figure 2 ERD for Post-Traumatic Stress Disorder (PTSD) RDB.](#ch1.xhtml#R_fig2)


    In 1976, Chen \[[13](#reference.xhtml#refbm_13)\] was the first to graphically
    model RDB schema entities using ERD to represent NLQ constructs. In \[[14](#reference.xhtml#refbm_14)\],
    ERD was used to represent NLQ constructs by analyzing the NLQ constructs’ inter-relationship
    with the ERD or even with the Class Diagram Conceptual Schema \[[15](#reference.xhtml#refbm_15)\].
    However, NLQ constructs intra-relationships were not studied in the previous works
    in terms of mapping the constructs into an RDB query language, such as SQL, which
    will be implemented in the current research work. Intra-relationships are the
    lexical dependencies between the sentence constructs (i.e., words), such as the
    relationship between the verb and its object. This type of relationship supports
    the mapping of tokens into lexica.


    Furthermore, RDB enables NLQ into SQL mapping using RDB schema MetaTables, such
    as in [Tables 1](#ch2.xhtml#table1) and [2](#ch2.xhtml#table2) (see [Chapter 2](#ch2.xhtml)).
    MetaTables are data repositories that act as data dictionaries which describe
    the RDB elements and the relationships between them using data annotations, span
    tags and synonyms attachment. In addition to the used RDB MetaTables, the NLQ
    context and the situation-based linking of knowledge stored in multiple connected
    RDB tables all help enhance the accuracy of data retrieval. Under the scope of
    the proposed research, the major focus will be on finding an answer to the question:
    How can we translate an unstructured full-text NLQ expression to an SQL statement
    using RDB schema MetaTables such that it produces accurate results? This translation
    mechanism and its framework design, starting from the NLQ interface and up to
    identifying the equivalent SQL clauses, aims to achieve other secondary tasks,
    such as:


    Abbreviation support; so that if a user asks about a patient’s weight using the
    abbreviation “kg”, it is recognized as a “kilogram”.


    *   Support for SQL’s syntactic constructs’ (keywords such as SELECT, FROM, etc.)
    synonyms or the absence of them in the NLQ.


    *   Multiple columns SELECT; to recognize multiple NLQ’s main nouns or noun phrases.


    *   Converting operators and numbers (i.e., Equal, Three) into numerical forms
    and symbols (i.e., =, 3).


    *   Deriving tables’ or attributes’ names from the literal values mentioned in
    the NLQ.


    *   Support for propositional terms (i.e., above, below, between).


    *   Considering all conditional terms in the NLQ and converting them into multiple
    WHERE conditions. This shall apply whether all conditions are applied on the same
    or different RDB elements.


    *   Support for aggregate functions (e.g., convert ‘highest’ to ‘MAX(Hight)’ or
    ‘youngest’ to ‘MIN(Age)’).


    [Table 1](#ch2.xhtml#table1) is an example of the NLQ MetaTable that breaks down
    the entered NLQ into its subsequent tokens. [Table 2](#ch2.xhtml#table2) is an
    example of the RDB elements MetaTable that explains each RDB element in terms
    of its nature, category, syntactic role etc. These two tables will be referenced
    to and elaborated on frequently throughout this research document.


    Machine-readable instructions are mandatory to access any type of DB. This emphasizes
    the need to find a mapping mechanism between NLQ and the RDB query languages,
    such as SQL. Common semantics between NLQ and artificial languages can be discovered
    by analyzing the language semantic and syntax roles. This research work solves
    the NLQ into SQL translation problem by manually writing a rule-based mapping
    algorithm at the word-processing level for automatic mapping. The manual work
    is on creating the rule-based algorithm. After the algorithm is developed, the
    mapping process shall be automatic.


    The aim of this work is to maintain a simple algorithmic configuration with high
    outcome performance. Avoiding the reliance on a huge annotated corpus or written
    patterns of translation examples is also very important, except in the case of
    simple algorithmic rules. This research idea overcomes any poor underlying linguistic
    tools’ performance such as named entity tagger, tokenizer, or dependency parser.
    This research contribution is a rule-based algorithm that applies a mapping association
    between the NLQ’s semantic/syntactic information, the SQL’s syntactic information
    and the RDB elements’ semantic roles and it offers an effective translation mechanism
    to convert NLQs into SQLs.


    ## Basic research framework organization


    In the implementation of the proposed algorithm, and as illustrated in [Figure
    3](#ch1.xhtml#fig3), user’s NLQ is accepted as an input into a given NLIDB, together
    with its corresponding RDB schema. Next, an NLQ into SQL translation is performed
    by an underlying multi-layered NLP framework. Afterwards, the system can basically
    understand the NLQ and respond to it with its equivalent SQL query.


    ![Figure 3 Basic research organization diagram.](images/fig3_B.jpg)


    [Figure 3 Basic research organization diagram.](#ch1.xhtml#R_fig3)


    In the following sections, [Chapter 2](#ch2.xhtml) is a background study on the
    research work pipeline components, which acts as an introduction to the actual
    research work implementation plan described in [Chapter 4](#ch4.xhtml). [Chapter
    3](#ch3.xhtml) is a literature review of the main research contributions, which
    are the two mapping algorithms. [Chapter 5](#ch5.xhtml) is a running example using
    an implementation user case scenario to illustrate the role of each component.
    This chapter also presents a complete summarization of the algorithm’s processes.
    [Chapter 6](#ch6.xhtml) sets out the algorithm’s implementation testing and validation
    methods, in addition to the implementation performance measurements used to illustrate
    the success factors of the proposed research work. [Chapter 7](#ch7.xhtml) presents
    the framework implementation results and discussion and then, finally, [Chapter
    8](#ch8.xhtml) presents the research conclusion and outlines the scope for future
    study.


