- raw: 'Even recent studies in this field \[[142](#reference.xhtml#refbm_142)\] failed
    to score high accuracy for the tokens mapping algorithm or handling complex SQLs,
    despite using state-of-the-art tools and techniques. An example of recent works
    in 2018 is Spider \[[142](#reference.xhtml#refbm_142)\], which does its mapping
    using a huge human labeled NLQ/SQL pairs corpus as a training and testing dataset.
    Such datasets are created using complex and cross-domain semantic parsing and
    SQL patterns coverage. However, Spider’s performance surprisingly resulted in
    a very low matching and mapping accuracy. Hence, the current research work is
    distinct from most of the previous language translation mechanism efforts because
    the focus here gives highest priority to simplicity and accuracy of the algorithm’s
    matching outcome.


    The current research work employs the NLQ MetaTable ([Table 1](#ch2.xhtml#table1))
    to map NLQ tokens into RDB lexica. The NLQ MetaTable covers NLQ words, their linguistic
    or syntactic roles (noun, verb, etc.), matching RDB category (table, value, etc.),
    generic data type (words, digits, mixed, etc.), unique as PK or FK, besides their
    synonyms and enclosing source (i.e., tables or attributes). MetaTables are used
    to check for tokens’ existence as a first goal, then mapping them to their logical
    role as a relationship, table, attribute or value. The general-purpose English
    language ontology (WordNet) are used to support the MetaTables with words’ synonyms,
    semantic meanings and lexical analysis.


    The implemented MetaTables fill up the low accuracy gap in language translation
    algorithms that do not use any sort of deep DB schema data dictionaries such as
    \[[81](#reference.xhtml#refbm_81), [123](#reference.xhtml#refbm_123)\], or just
    a limited data dictionary such as \[[43](#reference.xhtml#refbm_43)\]. According
    to \[[19](#reference.xhtml#refbm_19)\], WordNet is efficient at expanding NLQ
    predicate arguments to their meaning interpretations and synonyms. However, WordNet
    generalizes the relation arguments and does not guarantee NLQ’s lack of ambiguity
    and noise, which significantly affects its meaning interpretation. Hence, supportive
    techniques are employed in the current research work such as the disambiguation
    module. In addition, to avoid confusion around the RDB unique values, data profiling
    \[[121](#reference.xhtml#refbm_121)\] is performed on large RDB’s statistics to
    automatically compile the mapping table of unique values, PKs and FKs, based on
    which RDB elements are queried more often. Mapping tables are manually built for
    smaller RDBs, while using a data-profiling technique to build them for larger
    RDBs. Unique values are stored in the mapping table by specifying their hosting
    sources while a hashing function is used to access them instantly.


    ### RDB Lexica Relationships


    NLQ parsing and dependency trees (i.e., Augmented Transition Network (ATN) Lexical
    Relations Parser \[[143](#reference.xhtml#refbm_143)\]) are used in the current
    research work as part of the NLP semantic and syntactic parsing. Those parsers
    generate grammar parse trees to explain the NLQ tokens’ dependencies and relations
    \[[144](#reference.xhtml#refbm_144)\]. Besides, the RDB lexical join conditions
    are also discovered between any two words or values. The joint is based on the
    words’ or values’ connectivity status with each other or having common parent
    node in the dependency tree. The parsing helps with the NLQ semantics extraction
    and RDB lexical data selection. RDB elements relationships are controlled by using
    only verbs to represent any connectivity in the RDB schema. The verbs’ parameters
    (subject or object) are mapped with the RDB relationship’s corresponding elements:
    tables, attributes or values. If the NLQ verb is unidentified or missing, the
    relationship between NLQ tokens will be found by analysing the matching RDB lexica
    intrarelationships with each other.


    There are other methods in the literature that identify lexical dependencies and
    grammatical relations, such as Stanford Dependencies Parser \[[145](#reference.xhtml#refbm_145)\],
    Dependency Syntactic Parser \[[134](#reference.xhtml#refbm_134)\] and Dependency-Based
    Compositional Semantics (DCS) Parser \[[92](#reference.xhtml#refbm_92)\]. The
    current research work used a simple way of representing RDB elements inter-/intra-relationships.
    This representation restricts the RDB schema relationships to be in the form of
    a verb for easy mapping between NLQ verbs and RDB relationships.


    ### NLP Syntax and Semantics Definition


    The current research discovered common semantics between NLQ and SQL structures
    by analyzing both languages’ syntax roles. In the same vein, understanding the
    NLQ, by finding the combination of its tokens’ meanings, is the most essential
    part in the language mapping and translation process. Thus, computational linguistic
    studies at the words processing level is employed as opposed to approaches similar
    to Lambda Calculus or Tree Kernels Models mentioned above in the fifth and sixth
    mapping approaches.


    The current research framework overcomes any poor underlying linguistic tools’
    performance that are meant to analyse NLQ syntax and semantics. It overcomes such
    inadequacies by using the supportive RDB schema knowledge and semantic data models
    (MetaTables) and WordNet ontology. Furthermore, NLP tools, such as NER tagger,
    tokenizer or dependency parser, are also employed in addition to the syntactic-based
    analysis knowledge \[[52](#reference.xhtml#refbm_52)\] to generate parse trees
    from the identified tokens for proper mapping with the related RDB elements. Nevertheless,
    relying solely on NLQ’s syntactic and semantic analysis for the mapping process
    is not sufficient and produces substantially low precision, False Positive Ratio
    (FPR) and True Negative Ratio (TNR) as indicated in \[[1](#reference.xhtml#refbm_1),
    [7](#reference.xhtml#refbm_7), [46](#reference.xhtml#refbm_46), [51](#reference.xhtml#refbm_51),
    [57](#reference.xhtml#refbm_57), [76](#reference.xhtml#refbm_76), [115](#reference.xhtml#refbm_115),
    [116](#reference.xhtml#refbm_116), [131](#reference.xhtml#refbm_131)\]. Such systems
    include the LIFER/LADDER method in \[[45](#reference.xhtml#refbm_45)\], SVM algorithm,
    or SVM-Light optimizer \[[146](#reference.xhtml#refbm_146)\], NLQ/SQL syntax trees
    encoded via Kernel Functions \[[24](#reference.xhtml#refbm_24)\] or the Probabilistic
    Context Free Grammar (PCFG) method \[[111](#reference.xhtml#refbm_111)\] which
    proved to be challenging in terms of finding the right grammar for optimization.
    Hence, the current work supports the NLQ’s syntactic and semantic grammar analysis
    with computational linguistics in the form of RDB and NLQ MetaTables.


    ## Mapping RDB lexica into SQL clauses


    ### SQL Clauses Mapping'
