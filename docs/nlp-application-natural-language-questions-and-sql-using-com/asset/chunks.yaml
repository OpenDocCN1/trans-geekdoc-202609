    > Q2: Who is the physician that Sarah has?


    *NLQ Tokens Breakdown*:


    * `Physician` = Common Noun = Attribute

    * `Sarah` = Instance (Proper Noun) = Value

    * `Has` = Verb = Relationship


    Here, relational DB is necessary because the relationship between the tables `Patient`
    and `Physician` is important. This relationship will help identify the table that
    the instance `Sarah` resides in, and who her physician is in the `Physician` table.
    This is identified by matching the patient ID in the two tables. All of these
    processes are computationally expensive in a non-relational DBMS. The difference
    here is that there is a critical piece of information attached to the relationship
    between the two tables, which must be a verb, that is translated automatically
    by the algorithm to match the verb in the NLQ (or its synonyms). Therefore, the
    acquired information is:


    * Table 1 = `Patient`

    * Table 2 = `Physician`

    * Attribute 1 = `P_Name`

    * Attribute 2 = `Ph_Name`


    For Sarah’s identification, it is similar to example 1. This NLQ example has a
    verb (`has`), which is translated automatically to a schema relationship. After
    a search among the schema relationships matching the verb `has` (or its synonyms
    e.g., have, obtain, acquire, etc.), more than 1 matching relationship appeared
    coming out of the `Patient` table. Hence, we will use the remaining information
    we have (`Physician`) to narrow down the results. The adjacent physician name
    to the patient name `Sarah` in the `Physician` table will be looked up. This is
    because this algorithm depends solely on linguistic searching tools, while other
    matching mechanisms involve technical procedures such as statistical similarity
    measures (e.g., `N-Grams Vectors’ Comparison Method`).


    After searching the RDB for the instance `Sarah`, it was found under `Patients.P_Name`,
    so the attribute name (`Patients`) is automatically found. This attribute name
    will later be fed to the `WHERE` clause.


    The second valuable token is `Physician`. Since every RDB element (e.g., attribute)
    has a list of synonyms, the table identified here is `Physician`, and the Attribute
    is (`Ph_Name`) with the synonym `Physician Name`. This attribute was chosen because
    there is only one table containing the attribute `Physician` as a synonym to the
    attribute stored in its metadata, `Ph_Name`.


    Although the word `Physician` also exists in the `Ph_BD` attribute metadata, the
    `WH-Word` in the NLQ (`Who`) refers to a human name instance (value), not consecutive
    digits or a number as in `Physician Birth Date (Ph_BD)` attribute.


    Therefore, the acquired information are:


    * Table 1 = `Patient`

    * Table 2 = `Physician`

    * Attribute 1 = `P_Name`

    * Attribute 2 = `Ph_Name`


    Since we have more than one table, the suitable SQL Template is:


    ```sql

    SELECT (Table2).(Attribute2) FROM (Table2) INNER JOIN (Table1) ON (Table1).(Attribute3)
    = (Table2).(Attribute4) WHERE (Table1).(Attribute1) = (Value);

    ```


    The `Unique Identifiers` library has a list of all IDs. The SQL template will
    mandate this function to look for the appropriate IDs from both tables to use
    in filling the SQL template. This will result in `P_ID` attribute in both tables.
    Now that all needed information are found, the algorithm is ready to execute the
    query with proper join clauses between the two tables as follows:


    ```sql

    SELECT Physician.Ph_Name FROM Physician INNER JOIN Patient ON Patient.P_ID = Physician.P_ID
    WHERE Patient.P_Name = "Sarah";

    ```


    ### Example 3

    Q3: What is the most illness?


    *Tokens Breakdown*:


    * `What` = Value Indicator

    * `Most` = Comparative Expression = `MAX` clause

    * `Illness` = Common Noun = Attribute


    Based on our main assumptions, any comparative expression will help identify the
    SQL clause. In this case it is `MAX`, and to calculate the maximum of any range,
    we have to know the values within that range. From the token `Disease`, and after
    a search around the RDB, we found only one table called `disease` with a synonym
    of `illness`. Under that table, there is one attribute containing the word `disease`,
    which is `Disease_Name`. This concludes all the required information to use the
    following SQL template:


    ```sql

    SELECT MAX(COUNT(Attribute)) FROM Table;

    ```


    And with the following acquired information:


    * Table = `Disease`

    * Attribute = `Disease_Name`


    Using the identified arguments, we can execute the following SQL query:


    ```sql

    SELECT MAX (ALL | DISTINCT Disease_Name) FROM Disease;

    ```


    [Figure 13](#ch5.xhtml#fig13) summarizes the steps taken to solve Example 3.


    ### Example 4

    Q4: What drug is Ahmed taking?


    *Tokens Breakdown*:


    * `What` = Value Indicator

    * `Ahmed` = Instance = Value

    * `Drug` = Common Noun = Attribute

    * `Taking` = Verb = Relationship


    Same as previous examples, except that the word `drug` has more than 1 matching.
    We have 1 table called `Medication` with a synonym of `Drug`, but we have 2 attributes
    under the `Medication` table with synonyms of `Drug`, namely `Med_Name` and `Med_Code`.
    Since the NLQ has no further tokens to decide which attribute the user is referring
    to, we will output both of them.


    For complex and nested queries like this example, the mapping and translation
    algorithm can be applied recursively. Following the same steps of previous examples,
    we reach to the following acquired information:


    * Table 1 = `Medication`

    * Table 2 = `Patient`

    * Attribute 1 = `Med_Name`

    * Attribute 2 = `Med_Code`

    * Attribute 3 = `P_ID`

    * Attribute 4 = `P_Name`


    And SQL query:


    ```sql

    SELECT Medication.Med_Name, Medication.Med_Code FROM Medication INNER JOIN Patient
    ON Patient.P_ID = Medication.P_ID WHERE Patient.P_Name = "Ahmed";

    ```


    [Figure 14](#ch5.xhtml#fig14) summarizes the steps taken to solve Example 4.


    ### Example 5

    Q5: What medications did John prescribe for his patients?


    *Tokens Breakdown*:


    * `What` = Value Indicator

    * `John` = Instance = Value

    * `Medications` = Common Noun = Attribute

    * `Prescribe` = Verb = Relationship


    Using the word `prescribe` will help us identify who is `John`, which is a very
    common name, could be in the patient’s table, as well as the physicians. Searching
    the RDB, we’ll only find 1 relationship pointing from physician to patient. Hence,
    we will look for the word value `John` in the `Physician` table, with proper join
    clauses to the three tables, following the below SQL template:


    ```sql

    SELECT (Table1).(Attribute1) FROM ((Table1) INNER JOIN (Table2) ON (Table1).(Attribute2)
    = (Table2).(Attribute2) INNER JOIN (Table3) ON (Table3).(Attribute3) = (Table3).(Attribute3))
    WHERE (Table3).(Attribute4) = (Value);

    ```


    With the acquired information:


    * Table 1 = `Medication`

    * Table 2 = `Patient`

    * Table 3 = `Physician`

    * Attribute 1 = `Med_Name`

    * Attribute 2 = `P_ID`

    * Attribute 3 = `Ph_ID`

    * Attribute 4 = `Ph_Name`


    We reach the following SQL query:


    ```sql

    SELECT Medication.Med_Name FROM (Medication INNER JOIN Patient ON Medication.P_ID
    = Patient.P_ID) INNER JOIN Physician ON Physician.Ph_ID = Physician.Ph_ID) WHERE
    Physician.Ph_Name = "John";

    ```

