    ## Implementation environment and system description


    The machine used for this experiment is a `MacBook Pro`. It was used to run this
    experiment with `macOS Mojave`, version `10.14.2 (18C54)`. The processor speed
    is `2.9 GHz`, `Intel Core i7 (SATA Physical Interconnect)`, and `64bit` architecture.
    The memory is 8 GB of RAM (distributed among two memory slots, each of which accepts
    a 1600 MHz memory speed and `Double Data Rate 3 (DDR3)` type of memory module),
    and 750 GB of disk space. The used MacBook has 1 Processor and 2 Cores, with `256
    KB` per core.


    For the implementation coding and execution, `Python 3.7` [[164](#reference.xhtml#refbm_164)]
    was chosen as the programming language due to its clear syntax and popular NLP
    libraries for RDB processing tasks. The Integrated Development Environment (IDE)
    `PyCharm C`, `Xcode` and `XQuartz` were used to develop and compile the source
    codes as they have a Python unit-testing framework that allows for unit-testing
    automation in consistence with the Python Software Foundation [[130](#reference.xhtml#refbm_130)].
    The system’s required dependencies include essential tools and supportive tools.
    All of the tools are downloaded and installed locally on the experiment machine.
    The essential tools are declared in [Figure 16](#ch6.xhtml#fig16), including:


    *   `Python 3.7` [[164](#reference.xhtml#refbm_164)]: A concise and lightweight
    programming language that is compatible with most OS platforms.

    *   `MySQL Community Server 8.0.18` [[165](#reference.xhtml#refbm_165)]: `MySQL`
    RDB backend server.

    *   `MySQL RDB` [[166](#reference.xhtml#refbm_166)]: The RDB tool used to store
    and query data.

    *   `NLTK` [[40](#reference.xhtml#refbm_40)]: Provides Python-compatible libraries
    for NLQ lemmatizing, tokenizing, tagging, parsing, classifying and semantic reasoning.
    It also supports interfaces to over 50 lexical resources in addition to WordNet
    corpora.

    *   `TextBlob` [[167](#reference.xhtml#refbm_167)]: A Python library to process
    NLP tasks such as POS tagging, classification, noun phrase extraction and sentiment
    analysis.

    *   `Stanford CoreNLP 3.9.2` [[21](#reference.xhtml#refbm_21)]: Provides a set
    of integrated NLP tools to apply linguistic analysis on any incoming NLQ via a
    Python-compatible API. It offers sentences’ structure sentiment analysis and syntactic
    and grammatical dependencies analysis. In addition, `Stanford CoreNLP` provides
    a stemmer, POS tagger, dates and times normalizer, NER, annotator, parser and
    bootstrapped pattern learning. Also, it offers the open information extraction
    tools such as extracting relationships between NLQ tokens.

    *   `WordNet` [[19](#reference.xhtml#refbm_19)]: A large English lexical DB that
    includes nouns, verbs, adjectives, etc., in addition to the `synsets` library,
    which is a grouped set of cognitive synonyms.


