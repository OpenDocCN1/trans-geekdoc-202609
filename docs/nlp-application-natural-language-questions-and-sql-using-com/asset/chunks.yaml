  trans: '

    另一个生成自身 SQL 的近期示例是 [115]，它使用 NLQ/SQL 对的句法树作为 SQL 编译器来推导 NLQ 解析树。在 [115] 中，NLQ
    token 的词法依赖关系、数据库架构（DB schema）以及某些同义关系被用于通过启发式权重方案 [41] 将数据库词汇映射到 SQL 子句。由于 [115]
    没有使用任何 NLQ 注释含义资源（即 Prolog 数据 [155] 或 Lambda 演算法 Lambda Calculus [129]）或任何其他手动语义解释和表示来完全理解
    NLQ，导致 SQL 生成器的性能相当低。因此，[115] 的作者应用了重排序器 [120]，尝试使用基于字符串树核（String Tree Kernels）
    [128] 的高级基于启发式权重的 SVM 排序器 [36] 来提高准确性。重排序器确实将正确答案的召回率提高到高达 94%，但这仍低于所提研究工作的召回率。这是因为在当前工作中，RDB
    词汇 MetaTable 被用于词法关系消歧。此外还使用了映射表，其中包含了 RDB 数据类型、主键（PK）、外键（FK）和实体名称（唯一值），以及其他基于规则的映射约束。因此，在语言翻译领域构建
    SQL 生成器更为复杂，从而增加了翻译算法的复杂性。这是当前研究工作使用 SQL 模板，并将额外重点放在将准确的 RDB 词汇传递到 SQL 模板生成器以获得更好性能和输出的主要原因。


    当前研究工作中没有使用神经网络，在任何映射机制中也是如此。原因通过一些近期的工作示例更加清晰，例如 [124]、156]。`SEQ2SQL` [124] 是一种用于从
    NLQ 语义树生成 SQL 的深度序列序列神经网络算法 [157]。`SEQ2SQL` 使用强化学习算法 [124] 和来自循环执行的奖励来学习 SQL 生成。它使用一个包含
    80,654 个手工标注 NLQ/SQL 对的数据集来生成 SQL 条件，这与交叉熵优化（Cross Entropy Optimization） [158]
    训练任务不兼容。该 Seq2SQL 的执行准确率为 59.4%，逻辑形式准确率为 48.3%。


    `SEQ2SQL` 没有使用任何类似于当前研究工作中实现的手动基于规则的句法。在 2019 年的另一项近期工作 [156] 中，序列到序列神经网络模型被证明在大型
    RDB 上效率低下且不可扩展。此外，`SQLNet` [124] 是一种没有使用强化学习的映射算法。`SQLNet` 通过训练一个 MLA 序列到序列风格模型在顺序不重要时生成
    SQL，显示了微小的改进。Xu 等人 [124] 使用依赖图（Dependency Graphs） [116] 和列注意力机制（Column Attention
    Mechanism） [159] 来提高性能。当前工作使用了 RDB 词汇 MetaTable 用于词法关系消歧。此外还使用了映射表，其中包含了 RDB 数据类型、主键、外键和实体名称，以及其他基于规则的映射约束。因此，构建
    SQL 生成器更为复杂，增加了翻译算法的复杂性。这是当前研究工作使用 SQL 模板，并将额外重点放在将准确的 RDB 词汇传递到 SQL 模板生成器以获得更好性能和输出的主要原因。


    ### 中间表示


    当前工作尝试保存由 NLQ 提供的每一个信息，以便它们被使用并表示在 SQL 子句中。因此，多个 NLP 工具、MetaTable 和映射表用于完全理解 NLQ
    并将其映射到相应的 RDB 元素。然后，识别出的属性被馈入 `SELECT` 子句，而表从 `SELECT` 子句提取以生成 `FROM` 子句，并在 `WHERE`
    子句中使用条件语句。为了这种简单的映射目的，文献中的其他工作使用额外的中间层来表示 NLQ，结果发现效果不如 NLP 工具、映射表。


    NLQ 中间语义表示的一个示例是使用正则表达式 (`regexps`) [101] 来表示 NLP 音位和形态。这种表示通过应用一阶谓词逻辑 [162]、使用面向数据库的逻辑（DBLF）和概念逻辑（CLF）以及某些
    SQL 操作符和函数来构建并生成 SQL。然而，在 NLQ 句子中使用正则表达式集合在文献中尚未阐述。


    另一个示例是 [27]，它使用 EAV 类型的数据库元数据和语法解析树来处理 NLQ token，然后通过基于相似性的 Top-K 算法 [138] 将其映射到内部概念层。中间层的更多示例包括
    `PHLIQAl` [4]、`ASK` [46]、`USL` [109] 以及 `SEMRESP` [7]、129]、111]、122]，它们手动定义了中间
    token 的含义表示。


    此外，强化系统 [7]、113]、126] 使用 Lambda 演算将 token 映射到相应的含义表示。`TEAM` [16] 采用了与数据库概念架构连接的中间语义表示层。此外，`L2S`
    [92] 将数据库词汇转换为中间树形图，然后通过最大二分图算法 [163] 提取 SQL。

    '
