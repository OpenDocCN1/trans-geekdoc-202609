  trans: '

    对于连接策略，在 `DBLF` 公式中，对于每个新的关系引用，在 SQL 的 `FROM` 子句中以自上而下的方向递归地构建连接操作。全称量词通常通过使用双嵌套结构创建计数器来实现，例如
    `(NOT EXISTS [sub-SQL])`，这已被用于 `TQA` 系统 [108]。然而，[107] 使用临时关系创建策略来处理全称量词和数值量词，并处理序数以及聚合函数的混合。临时关系使用
    `join-strategy` 创建，以便将其轻松嵌入任何 SQL 表达式中。因此，每当存在量词时，就会递归地为其构建一个临时关系。对于否定策略，在 `DBLF`
    中，否定处理是通过：如果否定出现在句首，则为是/否问题设置“反转”标记；在动词否定和其他位置的否定量词的情况下，则使用 `(NOT IN [subquery])`
    结构来处理。如果否定出现在简单谓词之前，这两种否定处理方法都是可行的，在这种情况下，否定粒子的数量和位置不受限制。对于混合策略，上述三种策略中的任何一种都可以任意混合，例如在出现聚合函数或序数时构建临时关系。


    `TQA` [108] 是一种自然语言接口（NLI），它使用语义语法和深结构语法直接将自然语言查询（NLQ）转换为 SQL，以获得更高的性能以及更好的省略和指代处理。然而，`TQA`
    和类似的系统几乎不可迁移，且难以适应于其他数据库领域。


    `PHLIQAl` [4]、`ASK` [46] 和 `TEAM` [16] 采用了与概念模式（`CS`）连接的中间语义表示语言，提供高效的 NLQ 到 SQL
    转换工具。`CS` 有助于将 NLQ 标记映射到其数据库词表表示，因为它存储了所有 NLQ 标记、关系和属性的数据库术语及其分类法，此外数据库的层级结构和元数据。


    `USL` 系统 [109] 是可适应且可迁移的，因为它有一个自定义设备。然而，它的中间语义结构语言是语法导向的，而不是基于谓词逻辑。因此，某些语义意义通过树结构的形式表示。


    `TQA` 和 `USL` 技术共同构成了 `LanguageAccess` 系统 [107]，该系统具有独特的 SQL 生成组件，使用 `DBLF` 和概念逻辑形式（`CLF`）作为两种不同的中间语义表示语言。


    `LanguageAccess` 系统通过许多步骤工作。首先，短句结构语法解析 NLQ 生成解析树，然后通过 `CS` 将其映射到 `CLF`。生成的 `CLF`
    公式在自然语言（NL）中重述，然后呈现给终端用户进行歧义标记的解释和含义验证。一旦终端用户选择了一个 `CLF` 公式，就会使用 `CS` 将其转换为 `DBLF`（SQL
    生成的源），然后将其转换为 SQL。`DBLF` 考虑了数据库值的内部表示（例如字符串、数字）、临时关系的顺序以及生成的表达式交付到数据库的机制。


    [7, 110, 111] 的作者使用了 NLQ 语义解析来建模将 NLQ 映射到 SQL 的算法。[112] 使用特定的语义语法完成了类似的研究。[7,
    110, 113] 的作者使用了 lambda 演算，并将其应用于 NLQ 含义表示用于 NLQ 到 SQL 的映射过程。此外，[114] 使用 ILP 框架定义的规则和约束通过其语义解析来映射
    NLQ。为了相同的目的，[7, 110, 111] 采用了一种耗时且昂贵的方法，通过手动生成 NLQ 标记的含义表示。类似地，[112] 通过在语义语法规范上投入大量的专家时间和精力开发了一个编写系统。[7,
    110, 113] 的作者开发了一个强化监督的系统，使用 lambda 演算将 NLQ 映射到其相应的含义表示。


    与 `KRISP` [78] ，Giordani 和 Moschitti [115] 开发了一个仅使用语法树的问答对构建的模型，因为 SQL 编译器提供了所需的
    NLQ 派生树，该模型通过生成式解析器将事实型 NLQ 转换为结构化 RDB SQL，并使用基于字符串树核的先进 ML SVM 排序器通过重排序器对其进行判别性重排序。重排序器重新排列了潜在的
    NLQ/SQL 对列表，该列表召回率为 94%，在该系统中召回了正确答案。


    [115] 中的系统不依赖于 NLQ 释义资源（例如 Prolog 数据、Lambda 演算、MR 或 SQL），除了 WordNet 中缺失的某些同义关系以外的任何手动语义表示。第一阶段是生成阶段，在该阶段使用
    NLQ 标记的词法依赖和数据库元数据引发的词表（加上 WordNet），而不是对整个 NLQ 进行语义解释，并在规则和启发式权重方案的帮助下递归构建 SQL
    子句（即 `SELECT`、`WHERE`、`FROM`、连接等）。数据库元数据负责关系消歧任务，并在数据库数据类型、主键（`PKs`）、外键（`FKs`）和其他约束、根据领域语义的实体、列和表名称，它通常也被称为存储在数据库
    `INFO_SCHEMA`（`IS`）中的数据库目录。生成阶段的输出是由生成式解析器创建的排序后的潜在 SQL 列表。


    依存句法分析被用于提取 NLQ 标记的词法关系和依赖。根据 [19]，WordNet 在将谓词参数扩展到其含义解释和同义词方面高效；然而，WordNet 通用了关系参数，但不能保证
    NLQ 没有歧义和噪声，这会显著影响其含义解释。因此，该系统根据 Stanford Dependencies Parser [116] 提取的 NLQ 词法和语法关系依赖匹配，以及
    SQL 子句的逻辑和句法公式结构，生成所有可能的 SQL（包括歧义的 SQL）。

    '
