  trans: '

    虽然当前的工作使用计算语言映射约束将 RDB 词汇转换为 SQL 子句和关键字，但 [119] 使用了扩展的 UML 类图表示 [34, 104, 118]。这些表示被用于提取模糊标记的语义角色，这些角色是不精确的术语或语言变量，由“年轻”、“很少”、“好”或“坏”等模糊术语组成
    [60, 83, 86, 103, 117, 137, 141]。模糊标记的语义角色是以自组织映射（SOM）图表示的验证子图或树的形式提取的 [147]。SOM
    图利用模糊集理论 [49] 将 UML 类图转换为 SQL 子句 [148]。根据 [119]，与精确的 NLQ 相比，带有模糊术语的模糊 NLQ 更加灵活，因为在没有直接答案的情况下，它们提供了更多的潜在答案。然而，尽管这可能提供更高的召回率衡量，但它显著损害了假阳性率（FPR）。因此，当前研究未考虑模糊
    NLQ。


    在 [119] 中，实现了与当前工作类似的方法，用于将 RDB 词汇映射到 SQL 子句。[119] 的工作利用 RDB 关系将词汇映射到 NLQ 语言语义角色类，作为概念数据模型。然而，由于当前工作使用了支持性的
    NLP 语言工具，它在将 NLQ 语句翻译成 SQL 查询之前更有能力“理解”该语句，这极大地有助于翻译准确性的提高。关于当前工作中 RDB 模式中的语言间关系，不仅使用了
    WordNet，还使用了自然语言包（NLTK）和 NLP 语言工具。此外，还使用了基于人工规则的算法来定义 NLQ 语言角色如何与 RDB 元素匹配，这在
    [119] 中是不存在的，也解释了两者翻译准确率和精确率的差异。


    关于 [119] 中使用的语言分析，用户必须识别模糊 NLQ 源（对象）、其关联或关系以及目标（属性），并将它们连接起来以用于 UML 类图提取阶段。结果源自连通性矩阵，通过搜索源和目标之间任何存在的逻辑路径，最终将它们映射到等效的
    SQL 模板。相比之下，由于当前研究旨在实现看似自然的 HCI 交互，用户不需要在他们的 NLQ 中识别任何语义角色。这是因为底层的 NLP 工具为他们完成了这一工作。此外，关系是通过
    NLQ 动词识别的，因此与其他文献工作相比，用户在使用当前研究算法通过 NLQ 中通信了更多信息。因此，它被认为比 [119] 更先进且友好。此外，不仅从
    NLQ 中提取了对象和属性；所提出的研究还提取了更低层的语言和语义角色（例如动名词和介词），这有助于以更高的准确性和精确度选择匹配的 RDB 词汇。


    ### 复杂度 vs 性能


    当前的研究工作被认为比大多数复杂的映射方法（如 [29]）要简单得多，因为它依赖于更少但更有效的底层 NLP 语言工具和映射规则。复杂语言翻译模型的一个例子是
    2020 年 5 月推出的生成式预训练 Transformer 3 (GPT-3) [30]。GPT-3 是由 OpenAI 开发的 AI 深度学习语言翻译模型
    [31]。GPT-3 是一个巨大的人工神经网络模型，拥有 1750 亿机器学习参数 [32]。因此， GPT-3 语言翻译和问答模型的性能非常高 [2]。GPT-3
    用于生成 NLP 应用、将 NLQ 转换为 SQL、生成类人文本以及设计机器学习模型。


    然而，GPT-3 预训练语言表示的 NLP 系统必须在文本、上下文信息和大数据（即包含所有互联网内容的数据库、大量的书籍和整个维基百科）上进行训练，以做出任何预测
    [31]。此外，对于模型训练，GPT-3 在每个矩阵乘法中使用模型并行来训练巨大的 GPT-3 模型 [30]。模型训练在微软的高带宽 V100 GPU 集群上执行。


    在此类先进计算资源上进行训练将极大有助于 GPT-3 的卓越性能。该模型最大的缺点是其极高的复杂度、对技术的高要求，以及只有在训练后才有效，因为 GPT-3
    无法访问表模式。


    对于此类基于语言的应用程序，算法简化是必要的。复杂系统的一个例子是 L2S [92]，它将所有现有的 NLQ 标记与现有的数据库元素进行比较。这种方法需要大量时间遍历所有数据库元素并将其与
    NLQ 标记比较。L2S 使用 NLP 工具、标记语义映射器和基于图的匹配器，因此，简单性是当前工作的关键。其他复杂系统的示例位于 [29] 和 [24]
    中，这些系统使用了二分树形图结构处理模型 [89]、省略法 [82] 和最高概率选择算法 [50] 实现的混合方法。这些方法需要领域背景知识和充分的训练数据集。因此，当前研究未考虑这些方法。文献中从
    RDB 词汇到 SQL 子句的映射算法从简单到复杂的方法不等。


    通过深入的研究，已经很清楚，当前研究工作中提出的算法在性能、简单性、易用性以及对不同框架环境和 RDB 领域的适应性方面都是最好的。两个实现的映射器都可以访问嵌入的语言语义角色框架模式（WordNet
    和 Stanford CoreNLP Toolkit）、元数据以及 RDB 模式和元数据。这些资源对于 SQL 模板的形成和生成至关重要。

    '
