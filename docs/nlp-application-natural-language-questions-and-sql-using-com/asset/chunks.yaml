- raw: 'In this phase, synonyms of NLQ tokens are replaced with their equivalent names
    from the embedded lexica list. Then, SQL keywords are mapped and appended with
    their corresponding RDB lexica. The Matcher/Mapper module applies all mapping
    conditions listed later in [Table 4](#ch4.xhtml#table4) which covers NLQ tokens,
    their associated RDB lexica, SQL clauses, conditional or operational expressions
    or mathematical symbols.


    This module has access to MetaTables (data dictionaries) of all attributes, relationships,
    tables and unique values (Mapping Tables). Both mappers in [Figure 8](#ch4.xhtml#fig8)
    can refer to an embedded linguistic semantic-role frame schema, data or language
    dictionary, or the underlying RDB schema. This layer uses RDB schema knowledge
    (the semantic data models, MetaTables) and related syntactic knowledge to properly
    map NLQ tokens to the related RDB structure and contents.


    ![Figure 8 The two embedded mappers.](images/fig8_B.jpg)


    [Figure 8 The two embedded mappers.](#ch4.xhtml#R_fig8)


    In regard to unique RDB values, and since it’s a storage crisis to store all RDB
    values in a RAM or CACHE memory, only unique values and PKs and FKs will be stored
    in a mapping table. The unique values’ hosting attributes and tables will be specified,
    and a hashing function will be used to access them.


    For smaller RDBs (i.e., Zomato), and, as explained in [Table 3](#ch4.xhtml#table3),
    the mapping table is built using the Python dictionary “server.map” that finds
    associations between NLQ tokens and RDB elements that are often queried together.
    For larger RDBs (i.e., WikiSQL), data profiling is performed on RDB elements’
    statistics to automatically compile the mapping table. This compilation is based
    on which RDB elements are queried more often, and then stored in the mapping table
    as a hashing function. The mapping table is expressed as mapping\_table\[unique\_value\]
    = corresponding\_attribute.


    [Table 3 Mapping table design options](#ch4.xhtml#R_table3)


    | RDB size || Example || Applied technique || Data used |


    | --- | --- | --- | --- |


    | Small || Zomato || Python dictionary “server.map” || Associations between NLQ
    tokens and RDB elements |


    | --- | --- | --- | --- |


    | Large || WikiSQL || Data profiling || RDB elements’ statistics |


    Compared to the great value the mapping table adds to the algorithm’s accuracy,
    there would not be any significant overhead added by integrating a mapping table.
    Ye, the bigger the RDB the bigger the mapping table size, which affects resources
    usage in terms of storage capacity.


    ### Mapping NLQ Tokens into RDB Elements


    This unit matches NLQ tokens with RDB schema MetaTables (lexica list) to check
    for their existence. This unit also checks the general-purpose English language
    ontology (WordNet) for NLQ tokens’ synonyms and meanings. Before discussing the
    mapping algorithm itself, the RDB schema relationships, its lexica (tables’ and
    attributes’ names) and the conditional and operational expressions must be defined.


    First, relationships in the RDB schema will be defined and registered. Then, they
    will be matched with the NLQ verb. If the NLQ verb is unidentified or missing,
    the relationship between the NLQ tokens will be found through analysing the lexica
    intra-relationships with each other as explained step by step in [PseudoCode 9](#ch4.xhtml#box4_4).


    Now that RDB relationships have been defined and registered, the algorithm is
    able to retrieve matching RDB lexica, and their hosting attribute or table. This
    matching happens in accordance with the matching NLQ lexica and the relationships
    built between them. The retrieved data will be then passed on to the next step
    to be used in the SQL clauses mapping as explained in [PseudoCode 10](#ch4.xhtml#box4_5).


    NLQ tokens are mapped with their internal representation in the RDB schema via
    the MetaTables and synonyms, and then mapped to the SQL clauses. Each input token
    is mapped with its associated RDB element (lexicon) category (e.g., value, column,
    table or relationship).


    The mapper translates the NLQ literal conditions and constraints, whether they
    are temporal or event-based, into the SQL query clauses such as translating “Older
    than 30” to “Age > 30”. The mapper also extracts matches of function or structure
    words (i.e., linking words or comparison words) and search tokens (i.e., Wh-question
    words) from the annotated NLQ. Function words could be prepositions (i.e., of,
    in, between, at), pronouns (i.e., he, they, it), determiners (i.e., the, a, my,
    neither), conjunctions (i.e., and, or, when, while), auxiliary (i.e., is, am,
    are, have, got) or particles (i.e., as, no, not).


    This module checks for the presence of any NLQ conditional, operational or mathematical
    expressions (i.e., min, max, avg, etc.) in the NLQ to customize the WHERE statement
    accordingly to retrieve only relevant data from the RDB, as explained in [PseudoCode
    11](#ch4.xhtml#box4_6).


    During the parsing phase, the NLQ is decomposed into a head-noun, noun modifiers,
    verbs that relate semantic roles together, objects and relationships descriptivism
    and adjectives or adverbs that describe verbs. Hence, NLQ tokens can be any of
    the token types in [Table 4](#ch4.xhtml#table4).


    According to those observation-based assumptions summarized in [Table 4](#ch4.xhtml#table4),
    an SQL template can be easily generated. The SQL template generator mainly needs
    to know the number of attributes, tables and relationships. In addition, further
    information are fed to the SQL generator, such as the AND/OR clauses (for JOIN
    clauses), conditional comparative expressions (for WHERE or AGGREGATE clauses),
    the conditional comparative operations (for INTERVAL clauses or controlled values)
    and numbers and instances (literals) as values. For example, if the token is a
    value, then the corresponding attribute (object) is its column name.


    Moreover, synonyms of SQL clauses are also considered. For example, ‘search’,
    ‘show’, ‘find’, ‘get’ or even the word ‘select’ are all synonyms of the SQL clause
    “SELECT”. Similarly, ‘count’, ‘how many’ or ‘how much’ are synonyms of the “COUNT”
    statement. Also, ‘where’, ‘who has’ or ‘with’ are synonyms of the “WHERE” clause.


    Since the RDB lexica may not be explicitly used in the NLQ, the matcher/mapper
    unit tries to match an NLQ token to an equivalent RDB lexicon by comparing every
    token (and its synonyms) to its potential RDB element (or its synonyms). In addition,
    NLQ verbs will also be matched with their equivalent RDB schema relationships
    to locate where in the RDB schema is this token being referenced to. If a match
    is found, the algorithm replaces the token with the matching lexicon and returns
    the match in the form (table, attribute, value, relationship) with each element
    surrounded by span tags. If the token is found to be an RDB value, the attribute
    and subsequent table will be known automatically. This step uses the Python library
    “server.mapper” as explained in [PseudoCode 12](#appendix5.xhtml#box5_1) ([Appendix
    5](#appendix5.xhtml)).


    Dependency trees, derived from the Stanford CoreNLP syntactic trees, are used
    to explain the relationships between any two values based on their connectivity
    status or having common parent node in the dependency tree.


    RDBs illustrate relationships based on the data types. As such, values and attributes
    existing in the same entity (column) are related, so as attributes’ tables or
    tables connected with a particular relationship.


    In the current research work, verbs will be mapped to associated relationships,
    and the verbs’ parameters (subject or object noun phrases) into their corresponding
    attributes in the lexica list. Identifying this relationship association proved
    to increase the corresponding attributes selection accuracy. Thus, the tokens
    list is defined in this phase by the lexical analyzer using the language ontology
    WordNet, and eventually replaced by the RDB MetaTable lexica and passed to the
    syntactic analyzer.'
