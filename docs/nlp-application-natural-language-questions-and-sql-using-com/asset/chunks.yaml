    In the same year, **2002**, DBXplorer employed two preprocessing steps, `PUBLISH`
    which builds symbol tables and associated structures, and `SEARCH` which fetches
    the matching rows from published DBs. Together, `PUBLISH` and `SEARCH` enable
    Keyword-based search to RDBs [[12](#reference.xhtml#refbm_12)].


    In **2004**, PRECISE [[47](#reference.xhtml#refbm_47)] was developed to use the
    Semantically Tractable Sentences concept. The semantic interpretation of the sentences
    in PRECISE is done by analyzing language dictionaries and semantic constraints.
    PRECISE matches the NLQ tokens with the corresponding DB structures in two stages.
    Stage 1, it narrows down possible DB matches to the NLQ tokens using the Maximum
    Flow Algorithm (MFA). MFA finds the best single Flow Network as a directed graph
    to finally specify one source and one path to increase the flow’s strength. MFA
    returns the maximum # of keywords back to the system. Stage 2 is analyzing the
    sentence syntactic structure. After that, PRECISE uses the information returned
    from both stages to accurately transform the NLQ to an equivalent SQL query. However,
    PRECISE has a poor knowledge base as it only retrieves results that are keyword-based
    due to NL general complexity and ambiguity.


    In **2005**, an NLP question answering system on RDB was defined for NLQ to SQL
    query analysis and processing to improve the work on XML processing for the structural
    analysis with DB support. Query mapping was used to derive the DB results [[48](#reference.xhtml#refbm_48)].


    In **2006**, NUITS system was implemented as a search algorithm using DB schema
    structure and content-level clustering to translate a conditional keyword-based
    query and retrieve resulting tuples [[49](#reference.xhtml#refbm_49)].

    '
  trans: '

    该层利用之前层的输入，结合可用的 MetaTables 数据，将自然语言查询（NLQ）翻译为 SQL。SQL 查询的复杂性可能非常高，因为某些查询可能需要聚合、嵌套或涉及多表选择和连接的否定。因此，可能需要进行逻辑表达式拼接来解决潜在的
    NLQ 复杂性（例如否定连词、从句、最高级等）。基础的 `WHERE` 条件通过 `AND`、`OR` 和 `NOT` 操作符组合，落到嵌套的 `WHERE`
    子句中，其中第二个 `SELECT` 子句嵌套在 `WHERE` 子句内部。


    SQL 模板及其复杂度分类决定了特定的 NLQ 属于哪种 SQL 类别。所选 SQL 模板的子由匹配的 RDB 词汇填充。此外，不同的翻译系统支持不同的 SQL
    模板。因此，必须识别被接受和认可的模板，以及它们的似然率和出现频率。


    ### SQL 语句类型


    - 数据查询语言 (DQL): `SELECT`

    - 数据操作语言 (DML): `INSERT`, `UPDATE`, `DELETE`

    - 数据定义语言 (DDL): `CREATE`, `ALTER`, `DROP`

    - 数据控制语言 (DCL): `GRANT`, `REVOKE`

    - 事务控制语言 (TCL): `BEGIN TRAN`, `COMMIT TRAN`, `ROLLBACK`

    - 数据管理命令 (DAC): `START AUDIT`, `STOP AUDIT`


    在所提出的研究工作中，重点是 DQL，它除了其他辅助子句（如 `WHERE`、`AS`、`FROM`）外还有一个命令短语（`SELECT`）。DQL 虽然只有一个主命令短语，但它是
    SQL 其他短语中最常用的短语，特别是在涉及其他短语时。`SELECT` 是主命令短语，用于在 RDB 中执行特定查询。`SELECT` 关键字用于查询。通过命令行（`Terminal`）或应用程序接口（`API`）使用
    `SELECT` 算法将 NLQ 翻译成 SQL。


    ## SQL 执行与结果


    在这一阶段，用户必须与 RDB 建立连接，以执行数据库管理系统（DBMS）功能。一旦翻译过程完成并生成 SQL 语句，将在 RDB 中执行。查询结果以列的形式呈现给用户。查询结果可能以自然语言的形式返回给用户，这是
    SQL 语句的输出。这需要一个基于本体的解释器来将 NLQ 翻译成 SQL。


    # 文献综述


    DOI: [10.1201/b2367-3](https://doi.org/10.1201/23367-3)


    ## 相关工作


    - [UNAR](https://wiki.example.org/UNAR) 开发于 **1971** 年，使用增强转换网络（ATN）处理 NLQ。

    - [NLP](https://wiki.example.org/NLP) 开发于 **1977** 年，作为句法解析器处理 NLQ，但存在局限性。

    - [Semantic Language](https://wiki.example.org/Semantic Language) 开发于 **1978**
    年，作为语义解析器使用。

    - [LIFER/ADDER](https://wiki.example.org/LIFER_ADDER) 开发于 **1978** 年，支持基于关键词的
    RDB 结果。

    - [ASK](https://wiki.example.org/ASK) 开发于 **1983** 年，作为学习系统与 RDB 交互。

    - [TEAM](https://wiki.example.org/TEAM) 开发于 **1987** 年，作为 NLIDB 的核心功能。

    - [Syntactic Analysis](https://wiki.example.org/Syntactic_Analysis) 开发于 **1997**
    年，通过句法分析识别 NLQ。

    - [Clinical Data Analytics (CliniDAL)](https://wiki.example.org/CliniDAL) 开发于
    **2002** 年，使用基于相似度的 Top-k 算法进行 SQL 查询。

    - [Vietnamese NLIDB](https://wiki.example.org/Vietnamese_NLIDB) 开发于 **2002** 年，用于
    RDB 调查。

    - [DBXplorer](https://wiki.example.org/DBXplorer) 开发于 **2002** 年，采用 `PUBLISH`
    和 `SEARCH` 实现基于关键词的搜索。

    - [PRECISE](https://wiki.example.org/PRECISE) 开发于 **2004** 年，使用语义可处理句子的概念。

    - [question answering system](https://wiki.example.org/question_answering_system)
    开发于 **2005** 年，基于 RDB 进行问答。

    - [NUITS](https://wiki.example.org/NUITS) 实现于 **2006** 年，使用 DB 架构结构和内容级聚类进行搜索。

    '
