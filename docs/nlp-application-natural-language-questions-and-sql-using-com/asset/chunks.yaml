  trans: '


    在当前的研究中，采用了第二种方法，因为它没有限制用户使用某些领域特定的关键词[[40, 72]]，这与限制性自然语言查询（NLQ）输入方法的情况不同。这是因为本工作的目标是在用户无需预先了解
    RDB Schema、系统基础设施、底层 NLP 语言工具或任何特定查询语言的情况下促进人机交互（HCI）。


    此外，自然语言查询是人类最自然的交流方式。第一种方法（基于基于界面的系统）高度依赖终端用户通过他们必须经过的所有界面屏幕进行输入，以指定和修改所使用的关键词或短语。因此，对于用户来说，如果他们有编程知识并直接输入
    SQL 语句而不使用自然语言界面（NLI）屏幕，似乎会更简单。因此，本工作仅在出现拼写错误或歧义短语时才涉及终端用户。在这方面，在[[40, 52, 68,
    69, 87]]中，作者将基于菜单或基于限制关键词的 NLQ 方法描述为映射方法。在他们的论文中，他们解释了在准确性和召回率方面，限制性 NLQ 输入系统是多么不足。此外，即使对于诸如比较字典
    k 记录与 NLQ 标记之间相似性的基于相似性的 Top-k 算法[79]]等先进算法，也存在迁移性问题。该算法的准确率仅为 84% [100]]，而当前的研究系统准确率高达
    95%。


    大多数语言翻译方法或问答系统（QAS）依赖于丰富的标注训练数据（语料库），并采用统计模型或非统计的规则方法。因此，依赖 MLA 算法的第三种方法需要大量的领域特定（NLQ
    中使用的特定关键词）NLQ/SQL 翻译对语料库。这种语料库很难创建，因为它是一项非常耗时且需要领域专家完成的繁琐任务。NLQ/SQL 对语料库需要由领域专家手动编写并检查数百对数据，以训练和测试系统[70,
    76, 138]]。


    Avinash [102]] 使用领域特定本体进行 NLQ 的语义分析。结果是，Avinash 的算法会陷入过度定制问题，导致系统在任何其他领域都无法运行。除非进行大量的重新定制，否则它无法迁移也无法适应其他
    DB 环境。这种领域特定系统假设用户熟悉 DB Schema、数据和内容。另一方面，当前的研究工作使用简单的算法规则且与领域无关。因此，它不假设对采用的 RDB
    Schema 有先知识，也不需要任何标注语料库来训练系统。相反，它使用语言工具来理解和翻译输入的 NLQ。然而，所使用的 NLQ/SQL 对仅用于算法测试和验证目的。此外，事实证明过度依赖
    MLA 对于降低翻译错误率或提高准确率并不有效[139]]。即使为 MLA 算法提供了专门的错误处理模块[77]]，情况依然如此。在这方面，当前的研究工作采取了积极措施，使用
    NLP 语言技术来确保 NLQ 被完全理解和很好解释。这种完全解释在进行任何进一步处理之前，通过中间语言层和 RDB MetaTable 完成；以避免未来潜在的错误或损害准确性。计算语言学在此处的应用形式是通过手动编写的基于规则的算法进行基于语言的映射约束。这些手动编写的算法主要是总结在表
    4（第 4 章）中的观察假设。表 4]]在 DB 发生变化时需要大量的人工规则定义和定制以维持准确性[140]]。然而，当前研究工作中实现的基于规则的观察算法是完全领域无关的，并且可以迁移到任何
    NLQ 翻译框架。通常，映射是一门复杂的科学[14]]，因为低映射准确性的系统会因为缺乏系统可靠性和信任而被用户立即抛弃。因此，本研究工作提出了一种使用计算语言学的尖端翻译机制。然而，所提研究贡献的几个方面将结合图
    8（第 4 章）中的两种映射算法进行讨论。


    ## 将 NLQ 标记映射到 RDB 词汇


    ### NLQ 标记提取


    在研究工作中，NLQ 标记提取及其类型识别通过深度计算语言学过程完成。这些过程通过底层 NLP 语言工具完成，这些工具使用了英语词典（WordNet）、RDB
    MetaTable（用于映射算法）以及用于唯一值（即主键 PK 和外键 FK）的映射表。所采用的语言方法证明比其他标记提取方法更准确、有效，例如：


    *   用于标记提取的形态和词组分析器[35]]

    *   用于识别关键词及其类型的模式匹配[141]]

    *   配合 GATE[94]] 中的 Coltech 解析器使用 NER 识别器[93]]来分词并提取 NLQ 的语义信息

    *   用于 NLQ 分词和命名实体标记的 Java 模式引擎（JAPE）语法[88]]

    *   用于提取标记词根的 Porter 算法[97]]

    *   使用受限词项和组合范畴语法（CCG）规则[98]]的基于统一的学习（UBL）算法来学习和提取 NLQ 标记

    *   用于提取标记及其词汇关系的依赖句法分析[134]]

    *   富了原型触发器[92]]的依赖关系组合语义（DCS）系统[92]]，或

    *   独立的值和表提取接口[29]]，这是一种折中方案，因为它不支持 RDB Schema 元素的元数据和同义词。


    ### RDB 词汇映射


    '
