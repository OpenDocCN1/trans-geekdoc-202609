    # 将 RDB 词汇映射到 SQL 子句


    该映射使用了基于假设表的建议规则算法（`表 4`）。


    第一步是构建主要的 SQL 子句，即 `SELECT`、`FROM` 和 `WHERE` 子句。属性名称将被输入 `SELECT` 子句。因此，`SELECT`
    关键字后附加表属性。属性通过对 Wh 疑问词的主名词短语或中心名词（名词短语中的主名词）进行语义分析来识别。`WHERE` 关键字映射为从自然语言查询（NLQ）语义中出的属性-值对。`FROM`
    关键字映射为 `SELECT` 和 `WHERE` 子句中引用的所有表名。如果存在多个表，会将表进行连接并添加到 `FROM` 子句。如果存在数据检索条件，将添加
    `WHERE` 子句，并如 `伪代码 13`（附录 6`）所示连接条件。


    在此阶段，关键映射函数是将 SQL 子句和关键字与 NLQ 识别的词汇进行映射，然后构建 SQL 查询。必须识别应该从哪些表中选择表名的列表。关系、属性和值及其关联属性的列表也应以（属性，值）的形式被识别。


    ## SQL 模板生成器


    SQL 的形成在此阶段完成。SQL 组件（即表名、Fica 托管源、属性-值对、数据检索条件和关系）从输入的 NLQ 中被识别，并按适当顺序进行排列。然后，将识别出的
    NLQ 词汇、模式匹配元素以及识别出的操作符（如果有）输入到 SQL 模板生成器，以生成正确的 SQL 语句。将根据识别出的表、属性和属性-值对的数量选择
    SQL 模板。之后，系统与 RDB 建立连接，将 SQL 传输到 RDBMS 执行。


    RDB 模式包含存储在依赖表（映射表）中的唯一标识符列表（例如 `PKs` 和 `FKs`）。该表唯一地标识每个属性的每个实例，以及它们是否通过关系与任何其他
    RDB 元素相连。每个属性的唯一标识符被添加到 SQL 查询约束中，以确保只返回感兴趣的特定信息。


    SQL 模板的 `SELECT` 语句列表考虑了根据 NLQ 问题和所需答案（使用之前步骤的所有输入）可能的 SQL。对于具有显式 `SELECT` 参数的
    NLQ，建议的基于假设的系统使用调查启发式程序来确定哪些参数属于哪个 SQL 槽位。这些参数可以作为查询约束（例如 `WHERE`、`IN` 等，如果它们已经有值），也可以作为
    `SELECT` 语句的一部分（如果它们需要从 RDB 中检索其值）。之后，使用输入值和必要的操作符在适当的 SQL 模板中构建查询约束。为每个 `WHERE`
    条件对（属性和值）分配合适操作符的示例是：将 NLQ 字符串“equal”转换为 SQL 关键字 `LIKE` 或操作符 `=`，或将“smaller or
    equal”转换为操作符 `<=`。


    在这项工作中，除了其他辅助子句（例如 `AS`、`COUNT` 等）外，仅考虑了以下 SQL 主子句：


    *   `SELECT`：根据 NLQ 处理器识别要检索的属性。

    *   `FROM`：识别 `SELECT` 属性所属的表，或属性来源的表。

    *   `WHERE`：识别条件。


    '
