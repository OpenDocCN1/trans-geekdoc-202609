- raw: 'While the current work uses computational linguistics mapping constraints
    to transform RDB lexica into SQL clauses and keywords, \[[119](#reference.xhtml#refbm_119)\]
    uses the extended UML class diagrams representations \[[34](#reference.xhtml#refbm_34),
    [104](#reference.xhtml#refbm_104), [118](#reference.xhtml#refbm_118)\]. Those
    representations are used to extract fuzzy tokens’ semantic roles, which are imprecise
    terms or linguistic variables consisting of fuzzy terms like ‘young’, ‘rarely’,
    ‘good’ or ‘bad’ \[[60](#reference.xhtml#refbm_60), [83](#reference.xhtml#refbm_83),
    [86](#reference.xhtml#refbm_86), [103](#reference.xhtml#refbm_103), [117](#reference.xhtml#refbm_117),
    [137](#reference.xhtml#refbm_137), [141](#reference.xhtml#refbm_141)\]. Fuzzy
    tokens’ semantic roles are extracted in the form of a validation sub-graph or
    tree of the Self Organizing Maps (SOM) diagram representation \[[147](#reference.xhtml#refbm_147)\].
    SOM diagrams transform UML class diagrams into SQL clauses \[[148](#reference.xhtml#refbm_148)\]
    using the fuzzy set theory \[[49](#reference.xhtml#refbm_49)\]. According to \[[119](#reference.xhtml#refbm_119)\],
    fuzzy NLQs with fuzzy linguistic terms are more flexible compared with precise
    NLQs as they provide more potential answers in the case of no available direct
    answers. However, though this might provide higher measures of recall, it is significantly
    compromising the FPR ratio. Hence, fuzzy NLQs are not considered in the current
    research.


    In \[[119](#reference.xhtml#refbm_119)\], similar approaches to the current work
    are implemented for RDB lexica mapping into SQL clauses. The work of \[[119](#reference.xhtml#refbm_119)\]
    uses RDB relationships to map the lexica into NLQs linguistic semantic roles’
    classes as a conceptual data model. However, since the current work uses supportive
    NLP linguistic tools, it is more capable of “understanding” the NLQ statement
    before translating it into SQL query, which highly contributes to the increase
    in the translation accuracy. Regarding the linguistic inter-relationships within
    the RDB schema in the current work, not only WordNet is used, but also a Natural
    Language Toolkit (NLTK) and NLP linguistic tools. In addition, a manual rule-based
    algorithm is also used to define how NLQ linguistic roles match with the RDB elements,
    which does not exist in \[[119](#reference.xhtml#refbm_119)\] and which explains
    the variance in translation accuracy and precision in comparison.


    Regarding the linguistic analysis used in \[[119](#reference.xhtml#refbm_119)\],
    the user has to identify the fuzzy NLQ source (object), its associations or relationships
    and the target (attribute) to connect them together for the UML class diagram
    extraction phase. The results are derived from the connectivity matrix by searching
    for any existing logical path between the source and the target to eventually
    map them into an equivalent SQL template. In comparison, and since the current
    research work aims for a seemingly natural HCI interaction, the user does not
    have to identify any semantic roles in their NLQ. This is because the underlying
    NLP tools does this for them. Also, the relationships are identified by the NLQ
    verbs, so the user is communicating more information in their NLQ using the current
    research algorithm compared to the other literature works. Hence, it is considered
    more advanced and user-friendly than that in \[[119](#reference.xhtml#refbm_119)\].
    Also, not only objects and attributes are extracted from the NLQ; the proposed
    research work extracts much lower-level linguistic and semantic roles (i.e., gerunds
    and prepositions) which help select the matching RDB lexica with higher accuracy
    and precision.


    ### Complexity vs Performance


    The current research work is considered significantly simpler than most complex
    mapping approaches such as \[[29](#reference.xhtml#refbm_29)\] as it relies on
    fewer, but more effective, underlying NLP linguistic tools and mapping rules.
    An example of a complex language translation model is the Generative Pre-trained
    Transformer 3 (GPT-3) \[[30](#reference.xhtml#refbm_30)\], introduced in May 2020.
    GPT-3 is an AI deep learning language translation model developed by OpenAI \[[31](#reference.xhtml#refbm_31)\].
    GPT-3 is an enormous artificial neural networks model with a capacity of 175 billion
    machine learning parameters \[[32](#reference.xhtml#refbm_32)\]. Therefore, the
    performance and quality of GPT-3 language translation and question-answering models
    are so high \[[2](#reference.xhtml#refbm_2)\]. GPT-3 is used to generate NLP applications,
    convert NLQ into SQL, produce human-like text and design machine learning models.


    However, GPT-3 NLP systems of pre-trained language representation must be trained
    on text, in-context information and big data (i.e., a DB that contains all internet
    contents, a huge library of books and all of Wikipedia) to make any predictions
    \[[31](#reference.xhtml#refbm_31)\]. Furthermore, for the model training, GPT-3
    uses model parallelism within each matrix multiply to train the incredibly large
    GPT-3 models \[[30](#reference.xhtml#refbm_30)\]. The model training is executed
    on Microsoft’s high-bandwidth clusters of V100 GPUs.


    Training on such advanced computational resources would largely contribute to
    the excellent performance of GPT-3 models. The biggest weakness of this model
    is its extreme complexity, advanced technology requirements and that it is only
    efficient once trained because GPT-3 does not have access to the underlying table
    schema.


    Algorithm simplification is necessary in such language-based applications. An
    example of a complicated system is L2S \[[92](#reference.xhtml#refbm_92)\] that
    compares all existing NLQ tokens with existing DB elements. This approach consumes
    a lot of time to run through all DB elements to compare them with the NLQ tokens.
    L2S uses NLP tools, tokens’ semantic mapper and graph-based matcher, hence, simplicity
    is key in the current work. Other examples of complicated systems are in \[[29](#reference.xhtml#refbm_29)\]
    and \[[24](#reference.xhtml#refbm_24)\] where a hybrid approach is implemented
    using Bipartite Tree-Like Graph-Based Processing Model \[[89](#reference.xhtml#refbm_89)\],
    Ellipsis Method \[[82](#reference.xhtml#refbm_82)\] and the Highest Possibility
    Selection Algorithm \[[50](#reference.xhtml#refbm_50)\]. Those approaches require
    a domain-specific background knowledge and a thorough training dataset. Hence,
    they are not considered in the current research work. The RDB lexica into SQL
    clauses mapping algorithms in the literature ranged from simple to complex methods.


    After thorough study and research, it has become clear that the proposed algorithm
    in the current research work is the best in terms of performance, simplicity,
    usability and adaptability to different framework environments and RDB domains.
    Both implemented mappers have access to an embedded linguistic semantic-role frame
    schema (WordNet and Stanford CoreNLP Toolkit), MetaTables and the RDB schema and
    MetaTables. Those resources are essential for SQL templates formation and generation
    which is a popular problem under the NLP era.'
