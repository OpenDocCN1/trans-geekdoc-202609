- raw: 'ML algorithms have a wide range of applications in dimensionality reduction,
    clustering, classification, and multilinear subspace learning \[[61](#reference.xhtml#refbm_61),
    [62](#reference.xhtml#refbm_62)\]. In an NLP, ML is used to extract query patterns
    to improve the response time by creating links between the NLP input sources and
    prefetching predicted sets of SQL templates into a temporary cache memory \[[63](#reference.xhtml#refbm_63)\].
    ML algorithms are typically bundled in a library and integrated with query and
    analytics systems. The main ML properties include scalability, distributed execution
    and lightweight algorithms \[[62](#reference.xhtml#refbm_62)\].


    NLP and knowledge-based ML algorithms are used in knowledge processing and retrieval
    since the 1980s \[[64](#reference.xhtml#refbm_64)\]. Boyan et al. \[[65](#reference.xhtml#refbm_65)\]
    optimized web search engines by indexing plain text documents, and then used reinforcement
    learning techniques to adjust documents’ rankings by propagating rewards through
    a graph. Chen et al. \[[66](#reference.xhtml#refbm_66)\] used inductive learning
    techniques, including symbolic ID3 learning, genetic algorithms, and simulated
    annealing to enhance information processing and retrieval and knowledge representation.
    Similarly, Hazlehurst et al. \[[67](#reference.xhtml#refbm_67)\] used ML in his
    query engine system to facilitate automatic information retrieval based on query
    similarity measures through the development of an Intelligent Query Engine (IQE)
    system.


    Unsupervised learning by probabilistic Latent Semantic Analysis is used in information
    retrieval, NLP, and ML \[[68](#reference.xhtml#refbm_68)\]. Hofmann used text
    and linguistic datasets to develop an automated document indexing technique using
    a temperature-controlled version of the Expectation Maximization algorithm for
    model fitting \[[68](#reference.xhtml#refbm_68)\]. Further, Popov et al. introduced
    the Knowledge and Information Management framework for automatic annotation, indexing,
    extraction and retrieval of documents from RDF repositories based on semantic
    queries \[[69](#reference.xhtml#refbm_69)\].


    Rukshan et al. \[[70](#reference.xhtml#refbm_70)\] developed a rule-based NL Web
    Interface for DB (NLWIDB). They built their rules by teaching the system how to
    recognise rules that represent several different tables and attributes in NLWIDB
    system, what are the escape words and ignore them, in addition to DB data dictionaries,
    Rules for the aggregate function MAX, and rules indicating several different ways
    to represent an ‘and’ or ‘as well as’ concept, or interval ‘equal’ concept. Data
    dictionaries are often used to define the relationship between the attributes
    to know, for example, which attribute comes first in a comparative operation,
    and which falls afterwards in the comparative structure. This NLWIDB is similar
    to the current research idea, however, we intend on building a simpler and more
    generic algorithm that could be applied on various domains systems. Our algorithm
    does not use DB elements as the basis or rules identification, as in Rukshan et
    al.’s research; rather, it uses general sentence structure pattern recognition
    to form an equivalent SQL statement.


    SPARK \[[71](#reference.xhtml#refbm_71)\] maps query keywords to ontology resources.
    The translation result is a ranked list of queries in an RDF-based Query Language
    (QL) format, called SPARQL, created in SPARK using a probabilistic ranking model.
    The ontology resources used by SPARK are mapped items represented in a graph format
    used to feed SPARQL queries.


    Similar to SPARK, PANTO \[[60](#reference.xhtml#refbm_60)\] translates the keyword-based
    queries to SPARQL, but PANTO can handle complex query keywords (i.e. negation,
    comparative and superlatives). Also, PANTO uses a parse tree, instead of graph
    representation, to represent the intermediate results to generate a SPARQL query.


    i2b2 medication extraction challenge \[[60](#reference.xhtml#refbm_60)\] proposed
    a high accuracy information extraction of medication concepts from clinical notes
    using Named Entity Recognition approaches with pure ML methods or hybrid approaches
    of ML and rule-based systems for concept identification and relation extraction.


    Keyword++ framework \[[43](#reference.xhtml#refbm_43)\] improves NLIDB and addresses
    NLQs’ incompleteness and imprecision when searching a DB. Keyword++ works by translating
    keyword-based queries into SQL via mapping the keywords to their predicates. The
    scoring process is done using deferential query pairs.


    Keymantic system \[[72](#reference.xhtml#refbm_72)\] handles keyword-based queries
    over RDBs using schema data types and other intentional knowledge means in addition
    to web-based lexical resources or ontologies. Keymantic generates mapping configurations
    of keywords to their consequent DB terms to determine the best configuration to
    be used in the SQL generation


    HeidelTime \[[73](#reference.xhtml#refbm_73), [74](#reference.xhtml#refbm_74)\]
    is a temporal tagger that uses a hybrid rule-based and ML approach for extracting
    and classifying temporal expressions on clinical textual reports which also successfully
    solved the i2b2 NLP challenge.


    CliniDAL \[[27](#reference.xhtml#refbm_27)\] composes Restricted Natural Language
    Query (RNLQs) to extract knowledge from CISs for analytics purposes. CliniDAL’s
    RNLQ to SQL mapping and translation algorithms are enhanced by adopting a temporal
    analyzer component that employs a two-layer rule-based method to interpret the
    temporal expressions of the query, whether they are absolute times or relative
    times/events. The Temporal Analyzer automatically finds and maps those expressions
    to their corresponding temporal entities of the underlying data elements of the
    CIS’s different data design models.


    Similar to CliniDAL, TimeText \[[75](#reference.xhtml#refbm_75)\] is a temporal
    system architecture for extracting, representing and reasoning temporal information
    in clinical textual reports (i.e., discharge summaries). However, it only answers
    very simple NLQs.


    ### NLQ to SQL Mapping'
