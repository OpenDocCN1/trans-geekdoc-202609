- raw: 'According to \[[99](#reference.xhtml#refbm_99)\], NLP is today an active technique
    of Human–Computer Interaction, especially in the social media era \[[99](#reference.xhtml#refbm_99)\],
    developed a structural design method to automatically convert and translate simple
    DDL and DML queries with standard join conditions from an NLQ format into SQLs
    through NLQ’s semantic extraction and optimized SQL generation. This work also
    provides a user-friendly NLI for end users to easily access the social web DB
    via any web source. Authors used Java Programming Language and its technical tools
    to build the NLIBD system’s front-end and used R-tool as a data collector to gather
    data from social web sources. For data storage in the system’s backend, authors
    used an oracle DB, the SQL server. They also used a limited Data Dictionary to
    store all system-related words. The system would receive an NLQ, process it, collect
    data using the R-tool interface, extract the semantic knowledge from the social
    web source, and finally generate the associated SQL statement.


    In \[[99](#reference.xhtml#refbm_99)\], a simple architectural layout framework
    is proposed. It starts with the four pre-processing phase modules; Morphological
    Analysis Module, Semantic Analysis Module, Mapping Table Module, and the Reports’
    Retrieval Module. In the first module, the Morphological Analysis, NLQ is received
    and tokenized into words, which will be then passed on to the extractor to stem
    them by identifying their root words. At this stage, unwanted words are removed.
    Then, the extractor does the stemming processes using the Porter algorithm, in
    addition to maintaining previously tokenized words, a.k.a. the predefined words,
    from previous NLQs to compare them with the newly tokenized words to extract the
    main keywords, which are passed to the second module. NLQ tokens’ synonyms are
    identified from the integrated DB elements’ names (i.e., column or table names),
    which are used to replace the extracted keywords.


    The Semantic Analysis Module generates a parse tree from the identified keywords
    and passes it on to the third module. The Mapping Table Module has all potential
    SQL templates and knows the maximum possibility of each NLP word, and hence does
    all the identified words mapping using the mapping table. The best suitable query
    is generated and passed on to the fourth and last module, the Reports’ Retrieval
    Module, to deliver it to the end user as a report.


    The noticeable effort in this work is that every entered NLQ goes through a Syntactic
    Rules Checker for any grammatical mistakes. Also, semantic analysis is used to
    map NLQ tokens to DB objects. The combination of tokens’ meanings defines the
    NLQ general meaning, which is used to come up with a list of potential SQL queries
    among which the end user has to choose.


    Akshay \[[100](#reference.xhtml#refbm_100)\] proposes an NLP search system interface
    for online Applications, search engines and DBs requiring high accuracy and efficiency.


    Kaur \[[101](#reference.xhtml#refbm_101)\] illustrates the useful usage of Regular
    Expressions (regexps), which are generic representations for strings, in NLP phonology
    and morphology, text search and analysis, speech recognition and information extraction.
    However, clear collections of regexps in NLQ sentences are not clearly specified.


    Avinash \[[102](#reference.xhtml#refbm_102)\] uses domain ontology in NLIDBs for
    NLQ’s semantic analysis and emphasizes on employing domain and language knowledge
    at the semantic level to enhance precision and accuracy.


    Kaur and Bali \[[45](#reference.xhtml#refbm_45)\] examined an NLQ into SQL conversion
    interface module by means of NLQ’s syntactic and semantic analysis, but this module
    is unable of processing complete semantic conversion for complex NLQ sentences.


    Arati \[[103](#reference.xhtml#refbm_103)\] used Probabilistic Context Free Grammar
    (PCFG) as an NLDBI system design method for NLP. It works by using NLQ’s syntactic
    and semantic knowledge to convert NLQ into an internal representation and then
    into SQL via a representation converter. However, finding the right grammar for
    optimization is challenging in this system design.


    Dshish \[[104](#reference.xhtml#refbm_104)\] used NLP for query optimization to
    translate NLQ into SQL by means of semantic grammar analysis, while using the
    LIFER/LADDER method in the syntax analysis. Since the LIFER/LADDER system only
    supports simple SQLs formation, this translation architecture is largely restricted.


    For RDBMSs, Gage \[[105](#reference.xhtml#refbm_105)\] proposed a method of an
    AI application in addition to fuzzy logic applications, phrase recognition and
    substitution, multilingual solutions and SQL keyword mapping to transform NLQs
    into a SQLs.


    Alessandra \[[24](#reference.xhtml#refbm_24)\] used Syntactic Pairing for semantic
    mapping between NLQs and SQLs for eventual NLQ translation using SVM algorithm
    to design an RDB of syntax trees for NLQs and SQLs pairs, and kernel functions
    to encode those pairs.


    Gauri \[[106](#reference.xhtml#refbm_106)\] also used semantic grammar for NLQ
    into SQL translation. In the semantic analysis, the author used the Lexicon to
    store all grammatical words, and the post-preprocessor to transform NLQs’ semantic
    representations into SQL. However, this architecture can only translate simple
    NLQs, but not flexible.


    Karande and Patil \[[51](#reference.xhtml#refbm_51)\] used grammar and parsing
    in an NLIDB system for data selection and extraction by performing simple SQLs
    (i.e. SQL with a join operation or few constraints) on a DB. This architecture
    used an ATN parser to generate parse trees.


    Ott \[[107](#reference.xhtml#refbm_107)\] explained the process of SQLs Automatic
    Generation via an NLIDBs using an internal intermediate semantic representation
    language based on formal logic of the NLQs that is then mapped to SQL+. This approach
    is based on First Order Predicate Calculus Logic resembled by DB-Oriented Logical
    Form (DBLF), with some SQL operators and functions (e.g., negation, aggregation,
    range, and set operator for SQL SELECT).


    This approach, called SQL+, aims to solve some of the SQL restrictions such as
    handling ordinals via loop operators (e.g., the 6th lowest, the 3rd highest).
    To replace the loop operator, SQL + expressions are entered into a programming
    interface to SQL supplied with a cursor management.


    SQL+ strives to save the ultimate power of NLQ by augmenting the SQLs in a way
    that each NLQ token is represented and answered by SQL expressions. Experiment
    results prove that even complex queries can be generated following three strategies,
    the Join, the Temporary Relation and the Negation Strategy, in addition to a mixture
    of these strategies \[[107](#reference.xhtml#refbm_107)\].'
