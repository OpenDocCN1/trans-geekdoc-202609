- raw: "### Mapping RDB Lexica into SQL Clauses\n\nThis mapping uses the proposed\
    \ rule-based algorithm that is based on the assumptions table ([Table 4](#ch4.xhtml#table4)).\n\
    \nThe first step is building the main SQL clauses, the SELECT, FROM and WHERE\
    \ clauses. The attribute names will be fed into the SELECT clause. Hence, the\
    \ SELECT keyword is appended with the table attributes. Attributes are identified\
    \ by semantically analysing the Wh-word’s main noun phrase or head noun (main\
    \ noun in a noun phrase). The WHERE keyword is mapped with the attribute-value\
    \ pairs derived from the NLQ semantics. The FROM keyword is mapped with all involved\
    \ tables’ names referenced in the SELECT and WHERE clauses. If there is more than\
    \ one table, tables will be joined and added to the FROM clause. If there is a\
    \ data retrieval condition, a WHERE clause will be added, and conditions will\
    \ be joined as illustrated in [PseudoCode 13](#appendix6.xhtml#box6_1) ([Appendix\
    \ 6](#appendix6.xhtml)).\n\nIn this phase, the key mapping function is mapping\
    \ SQL clauses and keywords with the NLQ identified lexica, and then building the\
    \ SQL query. The tables list which tables names should be selected from must be\
    \ identified. The list of relationships, attributes and values with their associated\
    \ attributes should also be identified in the form (attribute, value).\n\n## SQL\
    \ template generator\n\nSQL formation is done in this stage. SQL components (i.e.,\
    \ tables’ names, lexica hosting sources, attribute-value pairs, data retrieval\
    \ conditions and relationships) are identified from the input NLQ and arranged\
    \ in a proper sequence. The identified NLQ lexica, schema matching elements, and\
    \ the identified operators (if any) are then fed into the SQL template generator\
    \ to generate a proper SQL statement. SQL templates will be selected based on\
    \ the numbers of identified tables, attributes and attribute-value pairs. After\
    \ that, the system establishes a connection with the RDB to transfer SQLs to the\
    \ RDBMS for execution.\n\nThe RDB schema contains unique identifiers (e.g., PKs\
    \ and FKs) list stored in a dependency table (the mapping table). This table uniquely\
    \ identifies each instance of each attribute, and whether they are connected via\
    \ a relationship with any other RDB elements. Each attribute’s unique identifier\
    \ is added to the SQL query constraints to guarantee that only the particular\
    \ information of interest is returned.\n\nThe SQL templates list of SELECT statements\
    \ considers possible SQLs depending on the NLQ question and desired answer using\
    \ all input from previous steps. For NLQs with explicit SELECT parameters, the\
    \ proposed assumptions-based system uses an investigative heuristic procedure\
    \ to determine what parameters belong in which SQL slot. The parameters can be\
    \ used either as query constraints (e.g., WHERE, IN, etc.) if they already have\
    \ values, or as part of the SELECT statement; if they need their values to be\
    \ retrieved from the RDB. After that, the input values and necessary operators\
    \ are used to construct the query constraints in the proper SQL template. An example\
    \ of assigning a suitable operator for every WHERE conditional pair (attributes\
    \ and values) is converting the NLQ string “equal” to the SQL keyword “LIKE” or\
    \ the operator “=” or converting “smaller or equal” to the operator “<=”.\n\n\
    In this work, only the following SQL main clauses are considered, in addition\
    \ to other supplementary clauses (e.g., AS, COUNT, etc.):\n\n*   SELECT: identifies\
    \ desired attributes to be retrieved according to the NLQ processor.\n\n*   FROM:\
    \ identifies the tables where the SELECT attributes are from, or where the attribute-value\
    \ pairs appearing in the WHERE conditional statements are originally from. In\
    \ case of multiple tables, relationships between tables are identified using JOIN.\n\
    \n*   WHERE: identifies the conditions and criteria that must be applied on the\
    \ retrieved data in a form of conjunctions of attributes and their desired values.\
    \ If there is more than 1 table, JOIN conditions are used.\n\nFurthermore, it\
    \ is important to determine SQL classes which a system can or cannot generate.\
    \ All adopted SQL queries are simple, covering SELECT and WHERE clauses. Therefore,\
    \ the supported SQL statements are declared in [Figure 9](#ch4.xhtml#box4_4) ([Chapter\
    \ 5](#ch5.xhtml)).\n\nThe chosen SQL template solely relies on the number of NLQ\
    \ tokens related to tables, attributes and values. Yet the type of the generated\
    \ SQL template could be nested, aggregated, negated, or basic selection, joining\
    \ and projection. Those types are further categorized in Appendix7.\n\nThe Python\
    \ libraries “string.template” and “server.sql\\_templates” are used to construct\
    \ and generate SQL statements in the form: SELECT {attributes} FROM {table} \\\
    [, {table}\\] (WHERE {attribute=value} \\[and {attribute=value}\\]). The algorithm\
    \ uses default template strings (placeholders) until it receives the selected\
    \ lexica from the previous steps, particularly from the Matcher/Mapper step. This\
    \ process performs in accordance with [Table 4](#ch4.xhtml#table4) tokens mapping\
    \ rules and as illustrated in [PseudoCode 14](#ch4.xhtml#box4_7) ([Appendix 8](#appendix8.xhtml)).\
    \ It is important to note that all SQL templates use the DISTINCT keyword as per\
    \ the embedded Maximum Length Algorithm explained earlier.\n\nThe first step in\
    \ the SQL template generator module is connecting the SQL templates generator\
    \ environment to the MySQL server and the MySQL DB session via the “mysql.connector”\
    \ function. The SQL template generator will choose which template should be chosen\
    \ to generate the query. This SQL template election is based on the required number\
    \ of involved tables, attributes and attribute-value pairs derived from the RDB\
    \ schema using MySQL DB and the Python libraries “pymysql” and “server.sql”. After\
    \ selecting the right template, the algorithm will return the generated SQL statement\
    \ with the lexica inserted appropriately. Then, the query is pushed forward to\
    \ the MySQL server for execution on the connected RDB as illustrated in [PseudoCode\
    \ 14](#ch4.xhtml#box4_7).\n\n## SQL execution and result\n\nAfter the generated\
    \ SQL query execution, data is fetched from the RDB and displayed to the user\
    \ as raw data. An example of usage is the following query line entered into the\
    \ Python command line interface.\n\n```\npython3 -m nlqsql.main -d zomato/city.sql\
    \ -j output.json -i ‘What is the average size of restaurants with name Burrito?’\n\
    ```\n\nThe output would be:\n\n```\n{‘select’: {‘attribute’:‘size’, ‘type’:‘AVG’},\n\
    ‘from’ : {‘table’:‘restaurant’},\n‘where’: {‘conditions’:[{‘attribute’:‘name’,\
    \ ‘operator’:‘=‘, ‘value’:‘Burrito‘},]},}\n```\n\nAnd the execution result is:\n\
    \n```\n -----------------\n| AVERAGE (*)   |\n -----------------\n| 23 Square\
    \ Feet |\n ----------------\n```\n\n# 5 Implementation User Case Scenario\n\n\
    DOI: [10.1201/b23367-5](https://dx.doi.org/10.1201/b23367-5)\n\nTo match an NLQ\
    \ to a proper SQL template, NLQ text will be analyzed and tokenized to be matched\
    \ against the RDB index. The NLQ goes through a full-text search after it has\
    \ been tokenized, which is different from the common keyword search.\n\n[Figure\
    \ 9](#ch5.xhtml#fig9) shows the directed RDB chart diagram for the Post-Traumatic\
    \ Stress Disorder (PTSD) RDB. RDB representation is used here instead of ERD because\
    \ the RDB relationships are richer in information than ERDs \\[[13](#reference.xhtml#refbm_13)\\\
    ]. [Table 5](#ch5.xhtml#table5), [Table 6](#ch5.xhtml#table6), [Table 7](#ch5.xhtml#table7)\
    \ and [Table 8](#ch5.xhtml#table8) are the RDB tables. [Table 9](#ch5.xhtml#table9)\
    \ is the NLQ MetaTable and [Table 10](#ch5.xhtml#table10) is the PTSD RDB elements\
    \ MetaTable that stores all the entities in the RDB and their metadata.\n\n![Figure\
    \ 9 Included SQL classes.](images/fig9_B.jpg)\n\n[Figure 9 Included SQL classes.](#ch5.xhtml#R_fig9)\n\
    \n[Table 5 Medications table](#ch5.xhtml#R_table5)\n\n| P\\_ID || Med\\_Name ||\
    \ Med\\_Code |\n\n| --- | --- | --- |\n\n| 43159 || VOLTAREN 75MG TABLET || M01AB05\
    \ |\n\n| --- | --- | --- |\n\n| 31896 || TYLENOL and CODEINE TAB || N02AA59 |"
