    Regarding the linguistic inter-relationships within the RDB schema in the current
    work, not only WordNet is used, but also an `NLTK` and `NLP` tools. Besides, a
    manual rule-based algorithm is also used to define how NLQ linguistic roles match
    with the RDB elements, which explains the variance in translation accuracy and
    precision in comparison.


    - Assures a seemingly natural interaction between the user and the computer. Hence,
    the user does not have to identify any semantic roles in their NLQ. The underlying
    `NLP` tools does this for them.

    - The relationships are identified by the NLQ verbs, so the user is communicating
    more information in their NLQ using the current research algorithm compared to
    the other literature works. Hence, it is considered more advanced and user friendly.

    - Not only objects and attributes are extracted from the NLQ, the proposed research
    work extracts much lower level linguistic and semantic roles such as gerunds and
    prepositions which help select the matching RDB lexica with higher accuracy and
    precision.


    ## 29. RDB Lexica into SQL Clauses Mapping (Complexity vs Performance) - L2S System


    - Compares all existing NLQ tokens with existing DB elements using `NLP` tools,
    tokens’ semantic mapper and a graph-based matcher.

    - A complicated system that consumes a lot of time to run through all DB elements
    for comparison with NLQ tokens.

    - Computationally expensive.

    - Considered significantly simpler than most complex mapping approaches as it
    relies on fewer, but more effective, underlying linguistic tools and mapping rules.


    ## 30. Bipartite Tree-Like Graph-Based Processing Model


    - Employs sophisticated semantic and syntactic analysis of the input NLQ.

    - A complicated system that requires a domain-specific background knowledge and
    a thorough training and testing dataset.

    - The current work is the best in terms of performance, simplicity and adaptability
    to different framework environments and RDB domains.

    - The use of `MetaTables` to define the lexica semantic roles and their adjacent
    SQL slots for better mapping accuracy.


    ## 31. Ellipsis Method


    - Deals with instances of ellipsis (less than a sentence).

    - Uses a computationally cheap and robust approach.

    - Requires that NLQ be explained by the user.

    - A memory-based learning method.

    - Produces a few mismatched SQLs.

    - Employs a lightweight approach for query translations with no need to storage
    spaces other than storing the `MetaTables` and the mapping tables.


    ## 32. The Highest Possibility Selection


    - Automatically discards any features that are not necessary.

    - Memorizes and searches previous NLQ encounters to find relatable features.

    - Relies heavily on labeled training and testing data, which is expensive and
    tedious to create.

    - Not generalizable across other domains.

    - No need for labeled data for developing and executing.

    - Can be generalizable across domains.


    ## 33. Weighted Neural Networks and Stanford Dependencies Collapsed (SDC)


    - Generates ordered and weighted SQLs schemata.

    - Uses linguistics in their algorithm.

    - Computationally expensive.

    - Unscalable to bigger RDBs.

    - The translation accuracy of this algorithm still falls behind the proposed algorithm
    because of the use of further semantic roles and linguistic categories (i.e.,
    adjectives, pronouns etc.).

    - Uses NLQ’s subject or object to search the DB for matching attributes with weighted
    projection-oriented stems and generate the SQL clauses accordingly.

    - Prioritizes SQLs based on probability of correctness instead of accuracy and
    precision.

    - Uses the verbs to find the attributes’ and values’ relationships instead of
    using a heavy weighted tool such as the weighted projection-oriented stems.


    ## 34. Pattern Matching of SQL


    - Used as a mapping algorithm.

    - Easy to develop and execute.

    - Handles mixed data types of NLQ tokens.

    - Does not apply any NLQ interpretation modules or parsing elaborations.

    - Its translation accuracy and overall performance is highly jeopardized.

    - Both implemented mappers have access to an embedded linguistic semantic-role
    frame schema (`WordNet` and `Stanford CoreNLP Toolkit`), data dictionary (`MetaTables`)
    and the RDB schema. Those resources are essential for accurate SQL query formation
    and generation.


    ## 35. RDB Lexica into SQL Clauses Mapping (SQL Formation vs SQL Templates) -
    NLQ Conceptual Abstraction


    - A concept-based query language to facilitate SQL formulation.

    - Scalable to large datasets.

    - SQLs are constructed from scratch, which adds extra computational complexity
    to the language translation system.

    - Adds an additional unnecessary layer on top of the original system architecture.

    - Simplifies SQL queries generation by using ready SQL templates.

    - SQL construction constraints are used in the mapping algorithm to guarantee
    accurate SQL template selection.

    - This approach is considered as a simple and accurate method of generating SQLs.


    ## 36. Semantic Grammar Analysis


    - Used to store all grammatical words to be used for mapping NLQ’s intermediate
    semantic representation into SQL clauses.

    - Due to this system’s complexity, this architecture can only translate simple
    NLQs.

    - Not flexible with nested or cascaded SQLs.

    - Accommodates more complex SQL types as nested or cascaded SQLs.


    ## 37. Kernel Functions, SVM Classifier, and Statistical Charniak’s Syntactic
    Parser


    - Used to classify NLQ/SQL pairs as correct or incorrect.

    - The mapping algorithm is at the syntactic level.

    - Uses NLQ semantics to build syntactic trees to select SQLs according to their
    probability scores.

    - A parser is applied to compute the number of shared high-level semantics and
    common syntactic substructures between 2 trees to produce the union of shallow
    feature spaces.

    - Achieves low recall of correctly retrieved SQL answers.

    - Requires labeled training and testing datasets of NLQ/SQL pairs.

    - Such exclusive domain-specific systems are highly expensive.

    - Its performance is subjective to the accuracy and correctness of the training
    and testing datasets, which are manually written by a human domain expert.

    - No need to develop training and testing datasets of NLQ/SQL pairs for every
    new domain.

    - High recall due to the use of an accurate mapping algorithm mapped to ready
    SQL templates.


    ## 38. Heuristic Weighting Scheme


    - NLQ/SQL pairs syntactic trees are used as an SQL compiler to derive NLQ parsing
    trees.

    - NLQ tokens’ lexical dependencies, DB schema and some synonym relations are used
    to map DB lexica with the SQL clauses.

    - There is no use of any NLQ annotated meaning resources or manual semantic interpretation
    and representation to fully understand the NLQ.

    - The SQL generator performance is considerably low.

    - SQL generator is built from scratch, which adds high complexity to the language
    translation algorithm.

    - Uses simple algorithmic rules based on computational linguistics to fully understand
    the input NLQ to ensure highest translation accuracy.

    - RDB MetaTable is used for lexical relations disambiguation.

    - A mapping table is also used, which includes RDB lexica data types, `PKs`, `FKs`
    and names of entity sets (unique values), in addition to other rule-based mapping
    constraints.

    - Uses SQL templates and puts extra focus on passing accurate RDB lexia into SQL
    templates generator for better performance and correct output.


    ## 39. A Deep Sequence to Sequence Neural Network


    - Generates an SQL from NLQ semantic parsing.

    '
  trans: '


    关于本工作中 RDB 架构中的语言间相互关系，不仅使用了 WordNet，还使用了 `NLTK` 和 `NLP` 工具。此外，还使用了一种基于规则的人工算法来定义
    NLQ 语言角色如何与 RDB 元素匹配，这解释了翻译准确率和精确度对比中的差异。


    - 确保了用户与计算机之间进行看似自然的交互。因此，用户无需在他们的 NLQ 中识别任何语义角色。底层的 `NLP` 工具会替他们完成工作。

    - 关系是通过 NLQ 动词识别的，因此与其他文献工作相比，使用当前研究算法的用户可以在 NLQ 中传递更多信息。因此，它被认为更先进且用户友好。

    - 不仅从 NLQ 中提取对象和属性，所提出的研究还提取了更底层的语言和语义角色（如动名词和介词），这有助于以更高的准确性和精确度匹配 RDB 词汇。


    ## 29. RDB 词汇到 SQL 子句映射（复杂度 vs 性能） - L2S 系统


    - 使用 `NLP` 工具、标记的语义映射器和基于图的匹配器，将所有现有的 NLQ 标记与现有的 DB 元素进行比较。

    - 一个复杂的系统，耗费大量时间遍历所有 DB 元素以与 NLQ 标记进行比较。

    - 计算开销大。

    - 被认为比大多数复杂的映射方法简单得多，因为它依赖于更少但更有效的底层语言工具和映射规则。


    ## 30. 基于二分树形图的处理模型


    - 对输入的 NLQ 进行复杂的语义和句法分析。

    - 一个复杂的系统，需要领域特定的背景知识以及彻底的训练和测试数据集。

    - 当前工作在性能、简单性以及对不同框架环境和 RDB 领域的适应性方面是最好的。

    - 使用 `MetaTables` 来定义词汇语义角色及其相邻的 SQL 槽位，以获得更好的映射准确性。


    ## 31. 省略法


    - 处理省略实例（少于句子）。

    - 使用了一种计算开销低且稳健的方法。

    - 要求用户对 NLQ 进行解释。

    - 一种基于记忆的学习方法。

    - 会产生少量的不匹配的 SQL。

    - 采用轻量级方法进行查询翻译，除了存储 `MetaTables` 和映射表外，不需要额外的存储空间。


    ## 32. 最高概率选择


    - 自动丢弃任何非特征。

    - 记忆并搜索之前的 NLQ 遭遇记录以找到相关的特征。

    - 高度依赖标记的训练和测试数据，创建这些数据既昂贵又枯燥。

    - 无法泛化到其他领域。

    - 开发和执行不需要标记数据。

    - 可以跨领域泛化。


    ## 33. 加权神经网络和斯坦福依存关系折叠 (SDC)


    - 生成有序且加权的 SQL 架构。

    - 在算法中使用语言学知识。

    - 计算开销大。

    - 无法扩展到更大的 RDB。

    - 由于使用了更深层的语义角色和语言类别（如形容词、代词等），该算法的翻译准确性仍落后于提出的算法。

    - 使用 NLQ 的主语或宾在 DB 中搜索具有加权投影导向根的匹配属性，并相应生成 SQL 子句。

    - 根据正确性概率而非准确度和精确度对 SQL 进行优先级排序。

    - 使用动词来寻找属性和值之间的关系，而不是使用加权投影导向根等重型加权工具。


    ## 34. SQL 模式匹配


    - 作为映射算法使用。

    - 于开发和执行。

    - 处理 NLQ 标记的混合数据类型。

    - 不应用任何 NLQ 解释模块或解析详述。

    - 其翻译准确性和整体性能受到严重威胁。

    - 两个实现的映射器都可以访问嵌入的语言语义角色框架架构（`WordNet` 和 `Stanford CoreNLP Toolkit`）、数据字典（`MetaTables`）和
    RDB 架构。这些资源对于准确的 SQL 查询的形成和生成至关重要。


    ## 35. RDB 词汇到 SQL 子句映射（SQL 构建 vs SQL 模板） - NLQ 概念抽象


    - 一种基于概念的查询语言，用于促进 SQL 构建。

    - 可扩展到大型数据集。

    - SQL 是从零构建的，这为语言翻译系统增加了额外的计算复杂度。

    - 在原始系统架构之上增加了一个不必要的层。

    - 通过使用现成的 SQL 模板简化了 SQL 查询的生成。

    - 映射算法中使用 SQL 构建约束来保证准确的 SQL 模板选择。

    - 该方法被认为是一种生成 SQL 的简单且准确的方法。


    ## 36. 语义语法分析


    - 用于存储所有语法词，用于将 NLQ 的中间语义表示映射到 SQL 子句。

    - 由于该系统的复杂性，此架构只能翻译简单的 NLQ。

    - 对于嵌套或级联 SQL 不够灵活。

    - 能够适应更复杂的 SQL 类型，如嵌套或级联 SQL。


    ## 37. 核函数、SVM 分类器和统计法 Charniak 句法解析器


    - 用于将 NLQ/SQL 对分类为正确或错误。

    - 映射算法处于句法层面。

    - 使用 NLQ 语义构建句法树，根据其概率评分选择 SQL。

    - 应用解析器来计算两棵树之间共享的高层语义和共同句法子结构的数量，以产生浅层特征空间的并集。

    - 对于正确检索的 SQL 回答召回率较低。

    - 需要标记的 NLQ/SQL 对训练和测试数据集。

    - 此类特定的领域特定系统非常昂贵。

    - 其性能取决于训练和测试数据集的准确性和正确性，这些数据由人类专家手动编写。

    - 不需要为每个新领域开发 NLQ/SQL 对的训练和测试数据集。

    - 由于使用了映射到现有 SQL 模板的准确映射算法，召回率较高。


    ## 38. 启发权重方案


    - 使用 NLQ/SQL 对句法树作为 SQL 编译器导出 NLQ 解析树。

    - NLQ 标记的词法依赖、DB 架构和某些同义关系用于映射 DB 词汇与 SQL 子句。

    - 没有使用任何 NLQ 注释含义资源或手动语义解释表示来完全理解 NLQ。

    - SQL 生成器性能相当低。

    - SQL 生成器从零构建，为语言翻译算法增加了高复杂度。

    - 使用基于计算语言学的简单算法规则完全理解输入的 NLQ，以确保最高的翻译准确性。

    - RDB MetaTable 用于词法关系消歧。

    - 还使用了映射表，包含 RDB 词汇数据类型、`PK`、`FK` 和实体集名称（唯一值），以及其他基于规则的映射约束。

    - 使用 SQL 模板并重点将准确的 RDB 词汇传递到 SQL 模板生成器，以获得更好的性能和正确的输出。


    ## 39. 深度序列到序列神经网络


    - 从 NLQ 语义解析生成 SQL。


