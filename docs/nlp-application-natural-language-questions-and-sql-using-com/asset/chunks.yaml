    an unnecessary complex layer on top of the original architecture.


    Furthermore, [[103](#reference.xhtml#refbm_103), [106](#reference.xhtml#refbm_106)]
    used semantic grammar analysis to store all grammatical words to be used for mapping
    NLQ’s intermediate representation into SQLs. Due to this system’s complexity,
    this architecture can only translate simple NLQs, but not flexible with nested
    or cascaded SQLs. In comparison, the current proposed system does not map whole
    NLQs into existing SQLs, but maps NLQ lexica to the SQL clauses and keywords.
    This is to enable the translator algorithm to be domain-independent and configurable
    on any other environment, without the need of developing training and testing
    datasets of NLQ/SQL pairs for every new domain such as [[24](#reference.xhtml#refbm_24)].


    In [[24](#reference.xhtml#refbm_24)], a dataset of labeled NLQ/SQL pairs training
    and testing datasets are generated and classified to correct or incorrect using
    `Kernel Functions` and an `SVM` classifier. This mapping algorithm is at the syntactic
    level using NLQ semantics to build syntactic trees to select SQLs according to
    their probability scores. Giordani and Moschitti [[24](#reference.xhtml#refbm_24)]
    applies the statistical and shallow `Charniak’s Syntactic Parser` [[126](#reference.xhtml#refbm_126)]
    to compute the number of shared high-level semantics and common syntactic substructures
    between two trees and produce the union of the shallow feature spaces [[24](#reference.xhtml#refbm_24)].
    As such, the `KRISP` system [[78](#reference.xhtml#refbm_78)] achieved a 78% recall
    of correctly retrieved SQL answers, while the current research work achieved a
    96% recall on the small RDB (2.5 MB) and a 93% recall on the large one (200.5
    MB) due to the use of a light weighted mapping algorithm mapped to ready SQL templates.

    '
  trans: '


    大多数从自然语言查询（NLQ）到 SQL 的映射过程对输入的 NLQ 采用了复杂的语义和语法分析程序[24, 79, 149, 2013 和 151]]。然而，这些分析的计算成本很高。因此，目前的研究针对这类查询翻译采用了一种轻量级的方法。特别是使用
    `MetaTables` 来定义词汇语义角色（如名词、动词等）及其相邻的 SQL 槽位，将准确性置于复杂度之上。复杂的算法（例如加权链接方法）为了复杂度而牺牲了准确性。例如
    [76] 中的一个示例，它使用 `Weighted Neural Networks` [39] 和 `Stanford Dependencies Collapsed
    (SDC)` [152] 作为 NLQ 标记之间的语法依赖关系，生成了有序且加权的 SQL 方案。该系统实现成本高昂，且对于较大的关系数据库（RDB）缺乏扩展性。它还根据正确概率而非准确性和精确率对
    SQL 进行排序。


    然而，[76] 中有趣之处在于他们在算法中使用了语言学，通过识别 NLQ 的主语或宾语在数据库中搜索匹配属性。这种匹配使用 `Weighted Projection-Oriented
    Stems` [127] 来生成相应的 SQL 子句。然而，该算法的翻译准确性仍然落后于当前研究中提出的算法。这是因为当前的工作除了使用动词寻找属性和值的内部关系外，还使用了进一步的语言类别（如形容词、代词等），而不是使用
    [76] 中像 `Weighted Projection-Oriented Stems` 那样重量级的工具。


    `Photon` [153] 是另一种基于神经网络的 NLQ 到 SQL 翻译方法，它通过将 NLQ 解析为可执行的 SQL 查询来完成翻译。`Photon`
    是 2020 年 6 月向推出的的最先进自然语言交互数据库（NLIDB）。它采用多个模块作为子层，例如基于深度学习的神经语义解析模块、NLQ 纠正模块、数据库引擎和响应生成模块。对于神经语义解析层，使用了
    `BERT` 和双向长短期记忆（LSTM）机器学习算法来生成隐藏表示，将 NLQ 标记与表名及属性名相匹配。NLQ 纠正模块通过高亮显示标记周围的歧义或混淆范围来检测不可翻译的
    NLQ，然后要求用户相应重新表述 NLQ。尽管 `Photon` 代表了先进的 NLIDB 和 NLQ 翻译机制，但它仍然属于复杂的翻译模型，而人们正在寻求更轻量级的翻译算法。此外，`Photon`
    模型依赖训练数据集来训练其翻译算法、表值增强模块、静态 SQL 正确性检查模块和神经可翻译检测模块。此外，总而言之，深度学习和神经网络方法倾向于作为黑箱，很难解释其预测结果。


    简单映射算法的一个示例是 `SAVVY` [154]，它使用数据库语言的模式匹配作为映射算法。`SAVVY` 没有应用任何 NLQ 解释模块或解析，因此其翻译准确性和整体性能受到了严重影响。


    ### SQL 构建与 SQL 模板


    当前的研究工作通过使用现成的 SQL 模板简化了 SQL 生成。然而，映射算法中使用了 SQL 构建约束来确保 SQL 的准确选择。尽管存在 SQL 模板，但最近的一些工作
    [52, 91, 105, 107, 120] 仍然使用其他方法从零构建 SQL，这为语言系统增加了额外的计算复杂度。例如 [91]，它定义了一种基于概念的语言通过
    `Conceptual Abstraction` [88] 来促进 SQL 构建。这项工作在原始架构之上增加了一个不必要的复杂层。


    此外，[103, 106] 使用语义语法分析来存储所有用于将 NLQ 中间表示映射为 SQL 的语法单词。由于该系统的复杂性，该架构只能翻译简单的 NLQ，对于嵌套或级联的
    SQL 并不灵活。相比之下，当前提出的系统并没有将整个 NLQ 映射到现有的 SQL，而是将 NLQ 词汇映射到 SQL 子句和关键词。这是为了使翻译算法能够独立于领域并在任何其他环境中配置，而无需为每个新领域开发
    NLQ/SQL 对的训练和测试数据集，如 [24]所示。


    在 [24] 中，生成了标记的 NLQ/SQL 对训练和测试数据集，并使用 `Kernel Functions` 和 `SVM` 分类器分类为正确或错误。该映射算法处于语法层面，利用
    NLQ 语义构建语法树，并根据概率评分选择 SQL。Giordani 和 Moschitti [24] 应用了统计和浅层的 `Charniak’s Syntactic
    Parser` [126] 来计算两个树之间共享的高层语义和共同语法子结构的数量，并产生浅层特征空间的并集 [24]。因此，`KRISP` 系统 [78]
    实现了 78% 的正确检索 SQL 回答召回率，而当前研究由于使用了映射到现成 SQL 模板的轻量级映射算法，在小型 RDB (2.5 MB) 上实现了 96%
    的召回率，在大型数据库 (200.5 MB) 上实现了 93% 的召回率。


    '
