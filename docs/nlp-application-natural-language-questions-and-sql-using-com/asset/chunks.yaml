- raw: 'Testing the proposed mapping algorithm happens by running a randomized shuffling
    of the NLQ/SQL pairs from the Zomato RDB. This step uses four library functions
    namely, “random.shuffle”, “collections.defaultdict”, “tqdm” and “sql\_parse.get\_incorrect\_sqls”.
    First, the underlying NLP tools and the Matcher/Mapper module are tested by feeding
    the system the NLQ lemmatized tokens. Then, the tokens go through the Matcher/Mapper
    module to match the tokens with their synonyms built into the NLQ MetaTable. After
    that, tokens and their synonyms will be mapped to their adjacent RDB values, attributes,
    tables or relationships, each based on their syntactic role. To test the SQL template
    generator module, a set of RDB lexica will be passed to this module and the generated
    SQL will be examined for correctness, accuracy and other performance metrics discussed
    in the next section.


    ## Performance evaluation measurements


    The purpose of the proposed algorithm is generating SQLs from NLQs automatically.
    It is important to obtain a reliable estimate of performance for this language
    translation algorithm. However, the algorithm’s accuracy performance may rely
    on other factors besides the learning algorithm itself. Such factors might include
    class distribution, effect (cost) of misclassification and the size of training
    and test sets. Therefore, to validate the algorithm’s performance and efficiency,
    more detailed accuracy measures are used to test the generated SQLs accuracy,
    precision and recall using:


    *   False Positive Ratio (FPR = C/(C+D)): the incorrectly classified queries as
    positives, but they are actually negatives.


    *   True Negative Ratio (TNR = D/(C+D)): the correctly classified queries as negatives.


    *   False Negative Ratio (FNR= B/ (A+B)): the incorrectly classified queries as
    negatives, but they are actually positives.


    *   True Positive Ratio (TPR = A/(A+B)): the correctly classified queries as positives.


    Where A = True Positive, B = True Negative, C = False Positive and D = False Negative.


    The classification process here compares the generated SQL by the current framework
    against the designated SQL that is originally present in the testing RDB.


    The recall performance measure represents the proportion of positive case (correct)
    queries which are correctly generated, Recall(R) = A/(A+B). It also measures the
    presentation ratio of all relevant words by the system. The words here represent
    the derived lexica that are correctly identified from the RDB and lead to correct
    SQL generation. In this case, Recall = number of relevant words (lexica) retrieved
    from RDB/number of relevant words (lexica) not retrieved.


    Precision is the proportion of the generated positive case (correct) queries which
    are correctly generated and considered as correct SQL constructions, Precision
    (P) = A/(A+C). It also measures how efficient the system is in retrieving only
    relevant words (lexica). In this case, precision is a measure of the ability of
    a system to retrieve and present only relevant lexica. Precision = number of relevant
    lexica retrieved/total number of lexica retrieved.


    Moreover, results’ correctness or accuracy is the proportion of total number of
    positive (correct) SQL generations which were correctly generated. Accuracy =
    (A+D)/(A+B+C+D). Unordered sets of retrieved queries can be evaluated by Precision
    and Recall. For ranked sets, after each query retrieval, precision should be plotted
    against recall.


    The Receiver Operating Characteristics (ROC) curves \[[176](#reference.xhtml#refbm_176)\]
    will also be used. ROC is a machine learning graphical plot of the TPR (a.k.a.
    sensitivity) against the FPR (a.k.a. 1-specificity). It makes a comparison between
    the two translation experiments in the current work, the experiment using the
    Zomato RDB and the second experiment using the WikiSQL RDB. This classification
    test takes into consideration the generated SQL by the current framework and the
    SQL already present in the testing RDB. The ROC curves show where the two experiment
    sets would possibly connect. This is because every TPR or FPR prediction instance
    is a single point on the ROC space. The bigger the area under the ROC curve the
    bigger the benefit of using the associated test. In other words, predictors’ curves
    that are closer to the top-left corner provide better accuracy performance. Depending
    on the matching accuracy between the output SQL and the original NLQ input, the
    proposed algorithm is evaluated and documented.


    In the first experiment with the Zomato RDB, 20 iterations (epochs) are executed
    on the system where the input NLQs are executed and their equivalent SQLs are
    generated as output. Then, the implementation resulted with the following performance
    metrics declared in [Table 13](#ch6.xhtml#table13) and [Figure 18](#ch6.xhtml#fig18).


    [Table 13 First experiment confusion matrix with Zomato RDB](#ch6.xhtml#R_table13)


    | F-Measure: 94.5 || Actual positive || Actual negative |


    | --- | --- | --- |


    | Predicted Positive || 43 TPR (A) || 3 FPR (C)Type I error |


    | --- | --- | --- |


    | Predicted Negative || 2 FNR (B)Type II error || 49 TNR (D) |


    | Accuracy: 94.85% || Recall: 0.96 || Precision: 0.93 |


    ![Figure 18 ROC curve for the first experiment with Zomato RDB.](images/fig18_B.jpg)


    [Figure 18 ROC curve for the first experiment with Zomato RDB.](#ch6.xhtml#R_fig18)


    For the second experiment with the WikiSQL RDB, the implementation resulted with
    the following performance metrics declared in [Table 14](#ch6.xhtml#table14) and
    [Figure 19](#ch6.xhtml#fig19).


    [Table 14 Second experiment confusion matrix with WikiSQL RDB](#ch6.xhtml#R_table14)


    | F-Measure: 92 || Actual positive || Actual negative |


    | --- | --- | --- |


    | Predicted Positive || 42 TPR (A) || 4 FPR (C)Type I Error |


    | --- | --- | --- |


    | Predicted Negative || 3 FNR (B)Type II Error || 48 TNR (D) |


    | Accuracy: 92.78% || Recall: 0.93 || Precision: 0.91 |


    ![Figure 19 ROC curve for the second experiment with WikiSQL RDB.](images/fig19_B.jpg)


    [Figure 19 ROC curve for the second experiment with WikiSQL RDB.](#ch6.xhtml#R_fig19)


    Compared with other similar research works on WikiSQL, the proposed work still
    achieves the highest accuracy measure as illustrated in [Table 15](#ch6.xhtml#table15)
    and [Figure 20](#ch6.xhtml#fig20).


    [Table 15 NLQ to SQL translation work on WikiSQL RDB](#ch6.xhtml#R_table15)


    | # || Source || Approach || Accuracy (%) |


    | --- | --- | --- | --- |


    | 1 || Proposed Algorithm || Computational Linguistics. || 92.78 |


    | --- | --- | --- | --- |


    | 2 || SEQ2SQL \[[177](#reference.xhtml#refbm_177)\] || MLA through reinforcement
    Learning. || 59.4 |


    | 3 || TypeSQL \[[174](#reference.xhtml#refbm_174)\] || NLQ’s token type recognition
    and 2 bi-directional LSTM. || 82.6 |


    | 4 || SQLOVA \[[178](#reference.xhtml#refbm_178)\] || Table- and context-aware
    NLQ word contextualization and representations. || 89.6 |


    | 5 || X-SQL \[[179](#reference.xhtml#refbm_179)\] || Reinforce schema representation
    with context. || 91.8 |


    | 6 || WHERE clause variants \[[180](#reference.xhtml#refbm_180)\] || Attentional
    Recurrent Neural Network (RNN). || 88.6 |


    | 7 || DialSQL \[[181](#reference.xhtml#refbm_181)\] || A dialogue-based framework
    that boosts the performance of existing algorithms via user interaction. || 69
    |


    | 8 || SQLNet \[[182](#reference.xhtml#refbm_182)\] || A dependency graph, a sequence-to-set
    model and the column attention mechanism. || 68.3 |


    | 9 || Question Patterns \[[183](#reference.xhtml#refbm_183)\] || Question-pattern
    models containing dependency graphs. || Unmeasured |


    | 10 || ValueNet \[[184](#reference.xhtml#refbm_184)\] || A neural model based
    on an encoder-decoder architecture to synthesize the SQL query. || 67 |


    ![Figure 20 WikiSQL works accuracy comparison.](images/fig20_B.jpg)


    [Figure 20 WikiSQL works accuracy comparison.](#ch6.xhtml#R_fig20)'
