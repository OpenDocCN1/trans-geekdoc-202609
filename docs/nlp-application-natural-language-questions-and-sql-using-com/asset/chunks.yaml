  trans: '

    根据 [99]，自然语言处理（NLP）如今是人机交互的一项活跃技术，特别是在社交媒体时代 [99]，开发了一种结构化设计方法，通过 NLQ 的语义提取和优化的
    SQL 生成，将带有标准连接条件的简单 DDL 和 DML 查询从 NLQ 格式自动转换并翻译为 SQL。这项工作还为终端用户提供了一个用户型的 NLI，使其能够通过任何网络源轻松访问社交网络数据库。作者使用
    Java 编程语言及其技术工具构建了 NLIBD 系统的前端，并使用 R 工具作为数据收集器，从社交网络源收集数据。对于系统的后端数据存储，作者使用了 Oracle
    数据库 SQL Server。他们还使用了一个有限的数据字典来存储所有与系统相关的词汇。系统将接收 NLQ，对其进行处理，使用 R 工具接口收集数据，从社交网络源中提取语义知识，并生成相关的
    SQL 语句。


    在 [99] 中，提出了一种简单的架构布局框架。它包含四个处理阶段模块：形态分析模块、语义分析模块、映射表模块和检索模块。在第一阶段模块中，接收 NLQ 并对其进行分词处理，从社交网络源中提取语义知识，并通过提取器剔除不需要的词汇。然后，提取器使用
    Porter 词干算法对分词后的词进行词干提取，并传递到第二个阶段模块。在第二个阶段模块中，使用语法无关上下文文文法将分词后的 NLQ 标记映射到数据库元素（即列名或表名）。


    语义分析模块基于提取的关键词生成语法表示树，并将其传递给第三阶段模块。映射表模块拥有所有潜在的 SQL 模板，并根据 NLQ 的语义分析生成相应的 SQL，然后将其传递给第四个也是最后一个阶段的检索模块，向用户交付报告。该工作的显著努力在于通过语法检查器将
    NLQ 转换为 SQL，此外，语义分析用于将 NLQ 标记映射到 SQL 对象。SQL+ 系统通过定义了 NLQ 的含义，以供用户选择潜在的 SQL 查询列表。


    Akshay [100] 提出了一种用于 SQL 的 NLP 搜索接口，支持 SQL 的生成，并提高了准确性。


    Kaur [101] 阐述了正则表达式（regexps）在 NLP 中的有效用法，用于 SQL 搜索、文本形态学和语音识别。然而，NLQ 句子中的正则表达式形式尚未明确规范。


    Avinash [102] 在 NLDB 中对 NLQ 进行语义分析，并利用领域本体知识来增强查询的精确度。


    Kaur 和 Bali [45] 通过对 NLQ 进行语法分析和语义分析，在 SQL 转换接口中将 NLQ 转换为 SQL，但该模块无法处理复杂的 NLQ。


    Arati [103] 使用概率上下文无关文法（PCFG）在 NLDB 系统设计中对 NLQ 进行语法分析，并将其转换为内部表示形式，再转换为 SQL。然而，在该系统设计中，寻找正确的语法具有挑战性。


    Dshish [104] 使用 NLP 进行查询优化，将 NLQ 翻译为 SQL，并采用了 LIFER/LADDER 方法。由于 LIFER/LADDER
    系统仅支持简单的 SQL 构建，该翻译架构受到了很大限制。


    对于关系型数据库管理系统（RDBMS），Gage [105] 提出了一种 AI 应用方法，通过模糊逻辑、语音识别和替换将 NLQ 转换为 SQL。


    Alessandra [24] 使用 SVM 算法实现了 NLQ 和 SQL 之间的语义映射，设计了用于 RDB 的语法树，并使用核函数对这些映射进行编码。


    Gauri [106] 也使用了语义语法将 NLQ 翻译为 SQL。在语义分析阶段，作者使用词典存储了所有语法词汇，并通过后处理器将 NLQ 的语义表示转换为
    SQL。然而，该架构只能翻译简单的 NLQ，灵活性不足。


    Karande 和 Patil [51] 在 NLDB 系统中使用语法和解析，通过在数据库上执行简单 SQL（即带有连接操作或少量约束的 SQL）来实现数据的选择和提取。该架构使用了
    ATN 解析器生成语法树。


    Ott [107] 解释了通过 NLDB 自动生成 SQL 的过程，使用基于 NLQ 形式逻辑的内部中间表示语言，然后映射到 SQL+。这种方法基于类似于数据库面向逻辑形式（DBLF）的一阶谓词逻辑，包含了某些
    SQL 运算符（如否定、聚合、范围和 SQL SELECT 的集合运算符）。


    这种称为 SQL+ 方法旨在解决 SQL 的限制，例如通过循环操作处理序数（如第六小、第三大）。为了替换循环操作，将 SQL+ 表达式输入到带有光标管理的
    SQL 编程接口中。


    SQL+ 通过增强 SQL，使得每个 NLQ 标记都能通过 SQL 表达式进行表示和回答，从而保留 NLQ 的最终力量。实验结果证明，即使是复杂的查询，也可以遵循三种策略（连接策略、临时关系策略和否定策略）进行生成。

    '
