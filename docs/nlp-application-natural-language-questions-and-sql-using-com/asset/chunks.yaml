    RDB with a size of 2.5MB having 9,552 NLQ and SQL pairs stored in three comma-separated
    value (csv) file tables. Zomato RDB is about a restaurant search engine supplied
    by the public data platform “Kaggle”. Zomato RDB has the schema demonstrated in
    [Figure 17](#ch6.xhtml#fig17).


    ![Figure 17 Zomato RDB schema.](images/fig17_B.jpg)


    [Figure 17 Zomato RDB schema.](#ch6.xhtml#R_fig17)


    The WikiSQL\_DEV RDB \[[174](#reference.xhtml#refbm_174)\], published in 2017,
    was chosen because of its large RDB. It has 200.5 MB of 80,654 manually annotated
    RDB of NLQ and SQL pairs in 24,241 tables from Wikipedia. This RDB is used for
    developing NLIs for RDBs. Moreover, WikiSQL is considered the largest web-based
    realistic hand-annotated semantic parsing RDB \[[175](#reference.xhtml#refbm_175)\].
    This is because of the RDB’s large magnitude and variety of logical form examples,
    tables, columns, lengths and types of questions, and the length of queries. Hence,
    it is the ideal RDB to generalize the implemented mapping algorithm to new and
    diverse queries and table schemata. Some examples of WikiSQL\_DEV NLQ/SQL pairs
