- raw: 'The first relation executed on the GEOQUERIES corpus in the \[[115](#reference.xhtml#refbm_115)\]
    algorithm is the FROM clause relation to find the corresponding DB tuples considering
    the optional condition in the WHERE clause and then match the results with the
    SELECT clause attributes. In case of any empty clauses or nested queries mismatching,
    this algorithm will generate no results; otherwise, correct SQLs are generated
    among the top three SQLs in 93% of the times using standard 10-fold cross-validation
    performance measure. This high accuracy and recall are due to the robust and heuristic
    weights-based reranker that is built using SVM-Light-TK6 extending the SVM-Light
    optimizer \[[117](#reference.xhtml#refbm_117)\] by employing the tree kernels
    \[[118](#reference.xhtml#refbm_118), [119](#reference.xhtml#refbm_119)\] to use
    the addition STKn + STKs or the multiplication STKn × STKs. Default reranker parameters
    are used such as in the normalized kernels, λ = 0.4 and cost and trade-off parameters
    = 1. However, this approach mandates the existence of possible SQLs in advance
    as no new SQLs can be generated by the algorithm, it only verifies if an entered
    NLQ has a corresponding SQL to produce a correct answer.


    Conceptually similar to \[[115](#reference.xhtml#refbm_115)\], Lu et al.’s \[[120](#reference.xhtml#refbm_120)\]
    mapping system does not depend on NLQ annotation either, but on a generative model
    and the (MODELIII+R) which is a discriminative reranking technique. Also, DCS
    system \[[121](#reference.xhtml#refbm_121)\] does not depend on a DB annotation
    either and works as well as a mapping system enriched with prototype triggers
    (DCS+). In addition, from Q/A pairs, SEMRESP employs a semantic parser learner
    \[[122](#reference.xhtml#refbm_122)\] that works best on annotated logical forms
    (SQLs). Kwiatkowski et al. \[[123](#reference.xhtml#refbm_123)\] developed UBL
    system that when trained on SQLs and Q/A pairs, it is able to use restricted lexical
    items together with some CCG combinatory rules to learn newly entered NLQ lexicons.


    ## Current research work justification


    The main goal proposed in this work is to find a simple but accurate mapping mechanism
    between NLQ and machine-readable instructions such as the RDB query language,
    SQL. To date, there is no adequate NLQ into SQL translation mechanism that does
    not compromise accuracy and precision with complexity or exaggerated simplicity
    to an unfunctional level. Such translation mechanisms have numerous rules exceptions
    and resulted errors when applied on other RDBs. Thus, the proposed research exploits
    a simple manually written rule-based mapping constraints algorithm as a design
    to a unique and accurate NLQ into SQL translation mechanism. This algorithm maps
    NLQ tokens semantic and syntactic information into RDB elements categories (i.e.,
    value, attribute, etc.) and then into SQL clauses consistently. The algorithm
    uses computational linguistics analysis pairing and matching mechanisms through
    MetaTables. The study of translating NLQ into SQL-like languages has a long history
    starting from the 1971 to date \[[2](#reference.xhtml#refbm_2), [2013](#reference.xhtml#refbm_3)
    and [4](#reference.xhtml#refbm_4), [12](#reference.xhtml#refbm_12), [16](#reference.xhtml#refbm_16),
    [2013](#reference.xhtml#refbm_17) and [18](#reference.xhtml#refbm_18), [35](#reference.xhtml#refbm_35),
    [39](#reference.xhtml#refbm_39), [40](#reference.xhtml#refbm_40), [41](#reference.xhtml#refbm_41),
    [46](#reference.xhtml#refbm_46), [47](#reference.xhtml#refbm_47), [48](#reference.xhtml#refbm_48)
    and [49](#reference.xhtml#refbm_49), [52](#reference.xhtml#refbm_52), [53](#reference.xhtml#refbm_53),
    [57](#reference.xhtml#refbm_57), [59](#reference.xhtml#refbm_59), [60](#reference.xhtml#refbm_60),
    [65](#reference.xhtml#refbm_65), [66](#reference.xhtml#refbm_66), [67](#reference.xhtml#refbm_67),
    [68](#reference.xhtml#refbm_68) and [69](#reference.xhtml#refbm_69), [70](#reference.xhtml#refbm_70),
    [71](#reference.xhtml#refbm_71), [72](#reference.xhtml#refbm_72) and [73](#reference.xhtml#refbm_73),
    [99](#reference.xhtml#refbm_99), [100](#reference.xhtml#refbm_100), [124](#reference.xhtml#refbm_124),
    [125](#reference.xhtml#refbm_125), [126](#reference.xhtml#refbm_126), [127](#reference.xhtml#refbm_127),
    [128](#reference.xhtml#refbm_128), [129](#reference.xhtml#refbm_129) and [130](#reference.xhtml#refbm_130)\].


    According to the literature \[[57](#reference.xhtml#refbm_57), [74](#reference.xhtml#refbm_74)\],
    mapping NLQ into SQL occurs using any of the following approaches:


    ### Authoring Interface-Based Systems \[[131](#reference.xhtml#refbm_131)\]


    By using semantic grammar specifications designed by extensive expertise time
    and efforts to identify and modify RDB elements and concepts (e.g., CatchPhrase
    Authoring tool \[[131](#reference.xhtml#refbm_131)\]).


    ### Enriching the NLQ/SQL Pair


    By adding extra metadata to the pairs to easily find a semantic interpretation
    for NLQ’s ambiguous phrases for the matching problem (e.g., Inductive Logic Programming
    (ILP) \[[75](#reference.xhtml#refbm_75)\]).


    ### Using MLA Algorithms


    By using correct NLQ/SQL pairs’ corpora. A corpus induces semantic grammar parsing
    to map NLQs into SQLs by training a Support Vector Machine (SVM) classifier \[[33](#reference.xhtml#refbm_33)\]
    based on string subsequence kernels (i.e., Krisp \[[132](#reference.xhtml#refbm_132)\]).


    ### Restricted NLQ Input \[[35](#reference.xhtml#refbm_35)\]


    By using a keyword-based search structure \[[128](#reference.xhtml#refbm_128)\]
    through a form, template or a menu-based Natural Language Interface (NLI) \[[52](#reference.xhtml#refbm_52)\]
    to facilitate the mapping process.


    ### Lambda Calculus \[[7](#reference.xhtml#refbm_7), [112](#reference.xhtml#refbm_112),
    [114](#reference.xhtml#refbm_114)\]


    Applied on NLQs meaning representation for the NLQ into SQL mapping process.


    ### Tree Kernels Models \[[29](#reference.xhtml#refbm_29), [47](#reference.xhtml#refbm_47),
    [78](#reference.xhtml#refbm_78), [100](#reference.xhtml#refbm_100), [126](#reference.xhtml#refbm_126)\]


    A Kernel Function \[[110](#reference.xhtml#refbm_110), [113](#reference.xhtml#refbm_113),
    [133](#reference.xhtml#refbm_133)\] is a combination of Tree Kernels \[[134](#reference.xhtml#refbm_134)\]
    such as the Polynomial Kernel (POLY) \[[135](#reference.xhtml#refbm_135)\], Syntactic
    Tree Kernel (STK) \[[33](#reference.xhtml#refbm_33)\] and its extension with leaf
    features (STKe) \[[132](#reference.xhtml#refbm_132)\]. They can be applied on
    NLQs/SQLs pairs syntactic trees, while Linear Kernels \[[136](#reference.xhtml#refbm_136)\]
    are applied on a “bag-of-words”. They are used to train the classifier over those
    pairs to select a correct SQL for a given NLQ.


    ### Unified Modeling Language (UML) \[[34](#reference.xhtml#refbm_34), [118](#reference.xhtml#refbm_118)\]


    A standard graphical notation of Object Oriented (OO) Modeling \[[137](#reference.xhtml#refbm_137)\]
    and an information system design tool. UML is a combination of Rumbaugh’s Object-Modeling
    Technique (OMT) \[[119](#reference.xhtml#refbm_119)\], Booch’s OO Analysis and
    Design \[[74](#reference.xhtml#refbm_74)\], and Jacobson’s Objectory \[[100](#reference.xhtml#refbm_100)\].
    UML class diagrams are used to model the DB’s static relationships and static
    data model (DB schema) by referring to the DB’s conceptual schema.


    ### Weighted Links \[[81](#reference.xhtml#refbm_81)\]


    Is a mapping system that works by pairing with the highest weight meaningful joins
    between RDB lexica and SQL clauses.


    What follows is an explanation of each of the above mapping approaches and a justification
    of excluding them by choosing the second approach, enriching the NLQ/SQL pairs,
    as the most effective one.'
