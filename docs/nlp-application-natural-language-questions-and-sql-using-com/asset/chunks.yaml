- raw: "The mapping happens in accordance with a manually written rule-based mapping\
    \ constraints algorithm. Two mappers are developed, one to map NLQ tokens into\
    \ RDB elements, and another to map the identified RDB lexica into SQL clauses.\
    \ The algorithm starts by analyzing the input NLQ by executing a series of NLP\
    \ tasks. At each analysis stage, the data is further processed to lead to the\
    \ formation and generation of an SQL. At the end, the SQL is executed, and the\
    \ data are fetched from the RDB and displayed to the user.\n\nThe proposed algorithm\
    \ covers many recent literature works’ shortcomings using the following solutions:\n\
    \n1.  Limited HCI interaction with users to assure the most natural way of communication,\
    \ that is direct questioning and answering. This way the user does not need to\
    \ identify any NLQ tokens semantic roles.\n\n2.  Does not need an annotated NLQ/SQL\
    \ pairs corpus for training, making it domain-independent and adaptable on any\
    \ environment.\n\n3.  Uses simple algorithmic rules based on computational linguistics\
    \ to fully understand the input NLQ for best translation accuracy.\n\n4.  Inventing\
    \ NLQ and RDB MetaTables to increase mapping accuracy between NLQ tokens, RDB\
    \ lexica, and then SQL clauses.\n\n5.  Maps NLQ verbs with the RDB relationships\
    \ as the simplest and most effective way of representing RDB elements relationships.\n\
    \n6.  Overcomes any poor underlying linguistic tools’ performance by using the\
    \ supportive MetaTables and WordNet ontology.\n\n7.  Supports NLQ’s syntactic\
    \ and semantic grammar analysis with computational linguistic algorithms (MetaTables\
    \ constraints). Those constraints assist the NLQ tokens mapping to the RDB lexica,\
    \ without using heavy-weighted and complicated techniques.\n\n8.  Presents a significantly\
    \ simpler algorithm as it relies on fewer, but more effective, linguistic tools\
    \ and mapping rules without using intermediate representational layers.\n\nTo\
    \ the best of our knowledge, this proposed research work for NLQ into SQL mapping\
    \ and translation presents a novel mechanism. This work bridges the gap between\
    \ RDBs and nontechnical DB administrators through a simple language translation\
    \ algorithm using strong underlying NLP techniques. This work enables nontechnical\
    \ users with no knowledge of RDB semantics to have the capability to retrieve\
    \ information from employed RDBs.\n\nThe validation of the proposed research experiments\
    \ and results has shown promising NLQ into SQL transformation and translation\
    \ performance. As such, the smaller RDB performed a 95% accuracy, which is more\
    \ than the larger RDB, which scored about 93%. This conclusion is in accordance\
    \ with the applied performance metrics and measures such as accuracy, precision,\
    \ recall and F-Measure.\n\nHowever, larger RDBs in this experiment identified\
    \ clear areas of improvement to enhance their language transformation accuracy\
    \ to higher than a 93% accuracy. Another big area of improvement is further simplifying\
    \ the algorithm coding and testing it on better implementation environment and\
    \ technical resources. The aim is to minimise the translation time as it takes\
    \ an average of 1.5 minutes to return a well-formed SQL, given an NLQ.\n\n## Future\
    \ work\n\nSince the research around NLIDBs is only a few years old, there are\
    \ so many future work opportunities to expand this work, including but not limited\
    \ to:\n\n*   Adopting NoSQL queries.\n\n*   Scaling up to distributed storage\
    \ RDBs.\n\n*   Employing community detection algorithms.\n\n*   Domain independent\
    \ schema building.\n\n*   NLQ ambiguity and uncertainty resolution through fuzzy\
    \ constraints.\n\n*   Dealing with vague and imprecise data through fuzzy RDBs\
    \ that store fuzzy attribute values and fuzzy truth values.\n\n*   Attaching a\
    \ well-designed user interface for NLQ input.\n\n*   Investigating neural network\
    \ learning approaches for SQL ranking and classification based on a weighting\
    \ scheme or an error/correctness rate.\n\n*   Processing NLQs with NLQ modifiers\
    \ (i.e., almost, nearly, very).\n\n*   Processing NLQs expressed in NLQ time-stamped\
    \ forms with prepositions (i.e., on, during, since).\n\n*   Outputting and transforming\
    \ query translation and execution results into XML documents format. XML format\
    \ is a standard scheme to store, interchange or exchange semi-structured to structured\
    \ data.\n\n# Appendix 1\n\n# Appendix 2\n\n# Appendix 3\n\n# Appendix 4\n\n# Appendix\
    \ 5\n\n# Appendix 6\n\n# Appendix 7\n\nIncluded SQL Query Types:\n\n*   Simple\
    \ Queries:\n\n    *   SELECT 1 column in a table (or more) without conditions\
    \ to present all data under selected column.\n\n*   Nested Queries (Subqueries):\n\
    \n    *   SELECT 1 column in a table (or more) with WHERE condition\\\\s.\n\n\
    *   Cascaded Queries:\n\n    *   Join 2 or more columns FROM 2 or more tables\
    \ in the SELECT/FROM statement without conditions like:\n\n        table-name1\
    \ JOIN table-name2 ON attribute1(PK of table1) = attribute2 (attribute in table2\
    \ and also FK of table1)\n\n    *   Join 2 or more columns FROM 2 or more tables\
    \ in the SELECT/FROM statement with WHERE conditions. The WHERE clause is a single\
    \ condition or a joint of several conditions.\n\n*   Negation Queries:\n\n   \
    \ *   Using the NOT Operator with SQL syntax to negate a WHERE condition.\n\n\
    *   Simple WHERE Conditions:\n\n    *   1 Simple operational condition (=,>, <,\
    \ etc.)\n\n    *   1 Aggregation condition (max, min, etc.)\n\n    *   1 Negation\
    \ Condition (NOT)\n\n*   Complex WHERE Conditions:\n\n    *   2 or more operational\
    \ conditions (=,>, <, etc.)\n\n    *   2 or more Aggregation conditions (max,\
    \ min, etc.) concatenated “=” with a value specified by the end user.\n\n    *\
    \   2 or more Negation conditions (NOT AND)\n\n    *   Including subordinates\
    \ and conjunctions\n\n*   Order/group by:\n\n    *   Asci. (Alphabetical, numeric).\n\
    \n    *   Desc. (Alphabetical, numeric).\n\n# Appendix 8\n\n# Appendix 9\n\n Table\
    \ 17 Literature works comparison \n\n| \\#  || Area || Existing solutions || Advantage\
    \ || Disadvantage || How thesis system differs? |\n\n| --- | --- | --- | --- |\
    \ --- | --- |\n\n| 1 || NLQ into SQL mapping Approaches || Authoring Interface\
    \ Based Systems || \n\n*   Uses semantic grammar specification, which is a language\
    \ definition that provides accurate rules for linguistic expressions semantic\
    \ parsing.\n\n || \n\n*   Relies heavily on end-user input throughout multiple\
    \ interface screens to modify the used keywords or phrases.\n\n*   Requires extensive\
    \ expertise time and efforts to identify and specify RDB elements and concepts.\n\
    \n || \n\n*   Only involves end users in the case of any NLQ words spelling mistakes\
    \ or ambiguous phrases.\n\n*   For linguistic expressions semantic parsing, NLP\
    \ tools are used to lemmatize, tokenize, define and tag each NLQ token.\n\n |\n\
    \n| --- | --- | --- | --- | --- | --- |\n\n| 2 || Enriching the NLQ/SQL Pairs\
    \ via Inductive Logic Programming || \n\n*   Widely used in MLA problems.\n\n\
    *   Provides logical knowledge and reasoning.\n\n || \n\n*   Requires extensive\
    \ manual rules defining and customizing in case of any DB change to maintain accuracy.\n\
    \n || \n\n*   The rule-based observational algorithm implemented is totally domain-independent\
    \ and portable on any natural language translation framework.\n\n*   Adds extra\
    \ metadata to the NLQ/SQL pairs to easily find a semantic interpretation for NLQ’s\
    \ ambiguous phrases for accurate mapping.\n\n |\n\n| 3 || Using MLA Algorithms\
    \ || \n\n*   NLQ/SQL pairs’ corpora induces semantic grammar parsing to map NLQs\
    \ into their SQLs.\n\n*   Used by training a Support Vector Machine (SVM) classifier,\
    \ which is an efficient MLA for high dimensional datasets.\n\n || \n\n*   Requires\
    \ a huge domain specific NLQ/SQL translation pairs’ corpora that is manually written.\n\
    \n*   Data preparation is time consuming and a tedious task.\n\n*   Requires a\
    \ domain expert to train and test the system.\n\n*   System is over-customized\
    \ and unfunctional on any other domain.\n\n*   Assumes the user is familiar with\
    \ the DB schema, data and contents.\n\n*   Relying heavily on MLAs are not effective\
    \ in decreasing the translation error rates or increasing accuracy.\n\n*   SVM\
    \ algorithm needs a lot of memory space."
