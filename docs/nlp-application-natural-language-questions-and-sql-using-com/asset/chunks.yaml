    Query (`RNLQs`) to extract knowledge from CISs for analytics purposes. `CliniDAL`’s
    RNLQ to `SQL` mapping and translation algorithms are enhanced by adopting a temporal
    analyzer component that employs a two-layer rule-based method to interpret the
    temporal expressions of the query, whether they are absolute times or relative
    times/events. The Temporal Analyzer automatically finds and maps those expressions
    to their corresponding temporal entities of the underlying data elements of the
    CIS’s different data design models.


    `TimeText` \[[75](#reference.xhtml#refbm_75)\] is a temporal system architecture
    for extracting, representing and reasoning temporal information in clinical textual
    reports (i.e., discharge summaries). However, it only answers very simple `NLQs`.

