    > Q2: Sarah 的医生是谁？


    *NLQ 标记解析*：


    * `Physician`（医生） = 普通名词 = 属性

    * `Sarah` = 实例（专有名词） = 值

    * `Has`（有） = 动词 = 关系


    在这里，关系型数据库是必要的，因为 `Patient` 表和 `Physician` 两个表之间的关系很重要。这种关系有助于识别实例 `Sarah` 所在的表，以及
    `Physician` 表中她的医生是谁。这是通过匹配两个表中的患者 ID 来识别的。在非关系型 DBMS 中，所有这些过程的计算开销都很大。这里的区别在于，两个表之间的关系上附有一个关键信息，该信息必须是一个动词，算法会自动将其翻译以匹配
    NLQ 中的动词（或其同义词）。因此，获取的信息是：


    * 表 1 = `Patient`

    * 表 2 = `Physician`

    * 属性 1 = `P_Name`

    * 属性 2 = `Ph_Name`


    对于 Sarah 的识别，与示例 1 类似。这个 NLQ 示例包含一个动词（`has`），它会自动翻译为模式模式关系。在匹配动词 `has`（或其同义词，如
    have, obtain, acquire 等）的模式模式关系中进行搜索后，从 `Patient` 表中出现了 1 个多个匹配关系。因此，我们将使用已有的剩余信息（`Physician`）来缩小范围。将在
    `Physician` 表中查找与患者名称 `Sarah` 相邻的医生名称。这是因为该算法完全依赖语言搜索工具，而其他匹配机制则涉及技术程序，例如统计相似性度量（如
    `N-Grams Vectors’ Comparison Method`）。


    在 RDB 中搜索实例 `Sarah` 后，在 `Patients.P_Name` 下找到了它，因此自动找到了属性名（`Patients`）。该属性名稍后将被输入
    `WHERE` 子句。


    第二个价值标记是 `Physician`。由于每个 RDB 元素（例如属性）都有一个同义词列表，在这里识别出的表是 `Physician`，属性是 (`Ph_Name`)，其同义词为
    `Physician Name`。选择此属性是因为只有一个表包含 `Physician` 作为其元数据中存储的属性 `Ph_Name` 的同义词。


    虽然单词 `Physician` 也存在于 `Ph_BD` 属性元数据中，但 NLQ 中的 `WH-Word`（`Who`）指的是人类姓名实例（值），而不是像
    `Physician Birth Date (Ph_BD)` 属性那样的连续或数字。


    因此，获取的信息是：


    * 表 1 = `Patient`

    * 表 2 = `Physician`

    * 属性 1 = `P_Name`

    * 属性 2 = `Ph_Name`


    由于我们有多个表，合适的 SQL 模板是：


    ```sql

    SELECT (Table2).(Attribute2) FROM (Table2) INNER JOIN (Table1) ON (Table1).(Attribute3)
    = (Table2).(Attribute4) WHERE (Table1).(Attribute1) = (Value);

    ```


    `Unique Identifiers` 库包含所有 ID 的列表。SQL 模板将强制此函数从两个表中查找适当的 ID 以填充 SQL 模板。这将导致两个表中的
    `P_ID` 属性。现在所有所需信息都已找到，算法准备好在两个表之间使用适当的连接子句执行查询，如下：


    ```sql

    SELECT Physician.Ph_Name FROM Physician INNER JOIN Patient ON Patient.P_ID = Physician.P_ID
    WHERE Patient.P_Name = "Sarah";

    ```


