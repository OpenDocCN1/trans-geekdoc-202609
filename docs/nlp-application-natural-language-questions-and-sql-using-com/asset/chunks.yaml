    # Preface


    This book applies Natural Language Processing (NLP) concepts to help humans in
    their daily life. It discusses an automatic translation of an unstructured Natural
    Language Question (NLQ) into a Structured Query Language (SQL) statement. SQL
    is used as a Relational DataBase (RDB) interaction language with special query
    syntax and a computer-executable artificial language. This way, DataBase (DB)
    administrators or general users with little or no SQL querying abilities can perform
    queries on RDBs in an interactive manner. The Human**–**Computer Interaction (HCI)
    happens using users’ NLQs, which is in English in the proposed research. Users
    do not need to know any RDB schema elements or structures such as tables’ names,
    relationships, formats, attributes, or data types. The RDB schema is a brief description
    of the RDB elements’ organization, excluding any RDB values. In this work, a lightweight
    NLQ into SQL translation approach is implemented by utilizing an RDB MetaTable
    as a Hash table. The main goal is to exploit a manually written rule-based mapping
    constraints algorithm. This algorithm maps NLQ tokens’ semantic/syntactic information
    into RDB elements’ semantic roles (i.e., value, attribute) in addition to the
    Wh-Words (e.g., What, Where, How, and Who) of the actual data and the relationships
    between the attributes. via pairing and matching means. The matching RDB elements,
    called “identified lexica”, are then mapped into the SQL clauses consistently
    for SQL generation and execution. The matching process uses a computational linguistic
    analysis mapping algorithm, represented in the MetaTables. This mapping algorithm
    proved to be efficient especially with small RDBs with an accuracy of 95% and
    is about 93% accurate with larger RDBS.


    # 1 Introduction


    DOI: [10.1201/b23367-1](https://dx.doi.org/10.1201/b23367-1)


    NLP is a subfield of computer science and engineering under the field of Artificial
    Intelligence (AI), as illustrated in [Figure 1](#ch1.xhtml#fig1).


    ![Figure 1 Research area breakdown.](images/fig1_B.jpg)


    [Figure 1 Research area breakdown.](#ch1.xhtml#R_fig1)


    It is developed from the study of language and computational linguistics \[[1](#reference.xhtml#refbm_1),
    [2](#reference.xhtml#refbm_2)\] and often used to interpret an input Natural Language
    Question (NLQ) \[[3](#reference.xhtml#refbm_3)\]. NLP’s goal is to analyze and
    facilitate the interaction between human language and computing machines. HCI
    becomes a part of NLP when the interaction involves the use of natural language.
    Under NLP, there are several subareas, including Question Answering Systems (QAS)
    \[[4](#reference.xhtml#refbm_4)\], such as Siri for iPhones, \[[5](#reference.xhtml#refbm_5)\]
    and summarization tools \[[6](#reference.xhtml#refbm_6)\]. Such tools produce
    a summary of a long document’s contents or even generate slide presentations.
    Machine real-time translation \[[7](#reference.xhtml#refbm_7)\], such as Google
    Translate \[[8](#reference.xhtml#refbm_8)\] or BabelFish \[[9](#reference.xhtml#refbm_9)\],
    are among other examples of NLP subareas. In addition, document classification
    \[[10](#reference.xhtml#refbm_10)\] via learning models is a famous NLP subarea.
    It is used to train the classification algorithm to identify the category a document
    should be placed under, for example, news articles or spam filtering classification.
    Speech Recognition Models \[[11](#reference.xhtml#refbm_11)\] are another NLP
    subarea that recognizes spoken language words which work best only in specific
    domains.


    In the current research, the framework starts with a processing of simple Online
    Transactional Processing (OLTP) type of queries. OLTP queries are simple SELECT,
    FROM and WHERE statements of the Structured Query Language (SQL), which is the
    simplest query form. As in [Figure 1](#ch1.xhtml#fig1), NLP uses deep learning
    techniques as part of the AI area. It focusses on computational linguistics to
    analyze HCI in terms of the language used for this interactive communication.
    Basically, NLP bridges the gap between computers and humans and facilitates information
    exchange and retrieval from an adopted DataBase (DB), which is, in this case,
    a Natural Language Interface for DataBase (NLIDB).


    A Relational DataBase (RDB) model \[[12](#reference.xhtml#refbm_12)\], which was
    originally introduced in 1970, is used as the basis of a background data storage
    and management structure. RDB has been chosen as a data storage media for the
    proposed research because of the relationships between its entities, including
    their table attributes and subfields and their values. These relationships hold
    significant information themselves as if they were whole separate entities. In
    addition, the information stored on those relationships proved to increase the
    accuracy of data retrieval as will be demonstrated later in [Chapter 6](#ch6.xhtml)
    on implementation testing and performance measurements.


    RDB’s elements (i.e., Table, Attribute, Relationship, etc.) representation in
    [Figure 2](#ch1.xhtml#fig2) describes the relationships between the entity sets
    to express parts of Post-Traumatic Stress Disorder (PTSD) RDB semantics. Therefore,
    an Entity-Relational Diagram (ERD) \[[13](#reference.xhtml#refbm_13)\] was used
    to demonstrate the RDB structure because this makes data relationships more visible
    as follows:


    *   An entity sets represent a table, i.e., “Patient” table.


    *   The entity’s features represent specific table’s attributes, i.e., “P\_Name”.


    *   Any instance of a specific attribute represents an attribute’s value, i.e.,
    “Sarah”.


    *   The directed relationships represent entities’ act or impact on other entities,
    i.e., “take”.


    ![Figure 2 ERD for Post-Traumatic Stress Disorder (PTSD) RDB.](images/fig2_B.jpg)'
