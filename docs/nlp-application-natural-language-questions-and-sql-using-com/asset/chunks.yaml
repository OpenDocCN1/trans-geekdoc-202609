    In the same vein, Owei `[[91](#reference.xhtml#refbm_91)]\]` came up with a concept-based
    QL that facilitates query formulation by means of DB queries’ conceptual abstraction
    to exploit the semantic data models and map NLQ’s constructs to their equivalent
    specific objects in.


    ### L2S Functions and Steps


    L2S functions are spread across three steps `[[92](#reference.xhtml#refbm_92)]\]`.
    During the first pre-processing step, NLQ and DB are analyzed, and all ML features
    are extracted. This step is supported by three pre-processing components: a linguistic
    component that analyzes the NLQ to generate the list of lexicons and discover
    any conditional tokens (i.e. greater/less than). This component has embodied tools
    such as Name Entity recognizer (NER) `[[97](#reference.xhtml#refbm_97)]\]` and
    Coltech-parser in GATE `[[98](#reference.xhtml#refbm_98)]\]` to extract semantic
    information that lies within NLQ. Also, this component handles the NLQ tokenization
    and named entity tagging using Java Annotation Patterns Engine (JAPE) grammars.
    The output of this first step is an attachment constraint. The second component
    is the lexicon, used for DB elements analysis and their attachment constraints.
    The third component is the ambiguity Solving, used for NLQ input correction to
    guarantee an ambiguity-free NLQ. In this Component, L2S compares all NLQ tokens
    with DB elements to find out the ambiguous tokens that match with non or more
    two DB elements through the use of ellipsis method or the highest possibility
    selection. The next L2S step is the Matching step which has two main components,
    the Semantic Matching and the Graph-Based Matching components. This step handles
    the interlingual mapping to produce equivalent SQL elements to the output of the
    first step. The third step is generating a complete and accurate SQL statement.


    ### Technical Approaches and Modeling


    Most language transformation rely on binary grammar. Generally, rule-based approaches
    `[[93](#reference.xhtml#refbm_93)]\]` require extensive manual customizing and
    used often in industrial systems `[[94](#reference.xhtml#refbm_94)]\]`.


    Statistical models are mostly used in academic research, and they work by building
    training set of correct and incorrect NLQ pairs `[[24](#reference.xhtml#refbm_24)]\]`.
    The language transformation then becomes a binary classification task, ML Features
    extraction is derived from tokens and labeled `[[95](#reference.xhtml#refbm_95)]\]`.


    In addition to statistical and non-statistical models, there are syntactic-based
    analysis `[[59](#reference.xhtml#refbm_59)]\]` well as graph-based approaches
    `[[47](#reference.xhtml#refbm_47)]\]` and Prolog-like representation `[[96](#reference.xhtml#refbm_96)]\]`,
    in addition to high-level ontology representation with huge amount of data.

