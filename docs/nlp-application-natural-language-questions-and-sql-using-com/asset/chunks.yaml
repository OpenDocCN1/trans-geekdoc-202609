    \ + 等时间）。\n*   利用率，`U = B/T`：服务器忙时间的平均百分比。\n*   吞吐量，`X = C/T`：服务器完成查询翻译请求的平均百分比。\n\
    *   队列长度，`N = W/T`：服务器上查询的平均数量，无论是在执行翻译还是等待服务。\n*   平均服务时间，`S = B/C`：服务器忙于查询翻译过程的平均时间。\n\
    *   图表面积，`W = :`：服务器翻译所有查询的总时间。\n    其中 `T = Total Period`（总周期），`C = Completed`（已完成），`B\
    \ = Busy Time`（忙时间）。\n\n运行分析程序后，根据图 21，结果耗时最长的阶段是匹配和映射阶段。这是预料之中的，因为该阶段执行了翻译算法大部分的任务。令人惊讶的发现是查询执行和从\
    \ MySQL RDB 检索结果所花费的时间如下：\n\n*   NL 接口 = 0.04 秒\n*   POS 识别 = 0.25 秒\n*   消歧义\
    \ (Disambiguation) = 0.06 秒\n*   匹配器/映射器 (Matcher/Mapper) = 0.63 秒\n*   SQL 模板生成器\
    \ (SQL Template Generator) = 0.07 秒\n*   SQL 执行与结果 = 0.45 秒\n\n![图 21 翻译 1.5 分钟的平均时间分布。](img/fig21_B.jpg)\n\
    \n图 21 翻译 1.5 分钟平均时间分布。\n\n该时间消耗明细代表了每个模块执行翻译任务所花费平均时间。这些是在运行一组翻译任务并计算它们消耗的平均时间后得出的。\n\
    \n当 SQL 传递给 DBMS 引擎进行查询处理时，它会被 MySQL 社区服务器编译器编译以检索结果。在处理较小的 RDB 时，此过程更快；但对于大型\
    \ RDB，查询执行时间要长得多。这主要是因为 MySQL RDB 并不是为大数据应用需求设计的。\n\n消耗的额外翻译时间与 RDB 的大小成比例，因为匹配和映射过程必须检查整个\
    \ RDB 以寻找潜在的匹配项。例如，对于一个 2MB 的 RDB，翻译可能需要 5 秒完成，而对于大小为 1GB 的 RDB，翻译过程可能需要达 1.5\
    \ 分钟才能完成。\n\n影响 SQL 执行和结果阶段时间消耗的因素还包括查询优化器模块。由于同一个 SQL 查询可以用若干种方式编写，查询优化选择了查询在语法上表达的最优方式。格式不规范或未优化的查询执行时间更长，影响了整体流程性能。\n\
