  trans: '

    梅奥医学中心信息提取系统 `[50`]` 从自由文本字段（如临床笔记）中提取信息，包括命名实体（如疾病、体征、症状等）以及相关属性（如上下文、状态、与患者的相关性等）。该系统通过实现简单的
    NLP 任务工作，如分词、词形还原、词典验证和词性标记。


    English Wizard 开发于 2009 年，是一种使用 `SQL` 查询关系数据库的英语查询翻译工具。English Wizard 的功能包括具有图形用户界面（GUI），用于发布自然查询，或通过客户端/服务器应用程序或其他数据库报告工具
    `[51`]`。


    GINLIDB 在 2009 年采用了两种类型的语义语法来支持广泛的自然查询。第一类型是用于非终结词的单词典语义语法，第二类型是使用复合语法形成终结词短语或句子。此外，GINLIDB
    使用 `ATN` 进行句法分析，以确保标记结构与允许的语法结构兼容 `[52`]`。


    在 2010 年，CHAT-80 系统使用 `Prolog` 将自然查询处理为三个阶段表示。首先，系统将自然查询词表示为逻辑常量，然后将自然查询的动词、名词和形容词表示为谓词。对于复杂的自然查询短语或句子，系统通过在数据库上形成谓词的结合来表示。CHAT-80
    集成了 `WordNet` 作为词典，并将本体作为语义解释器的知识库。CHAT-80 被认为是领域无关且可移植的数据库。它还使用 `OWL 本体` 定义关系关系模型，以增加自然查询句子的准确性
    `[53`]`。


    在 2012 年，一种名为自然语言应用程序接口（LANLI）的关系数据库自然语言接口系统被开发 `[54`]`。LANLI 利用 `Local Appropriator`
    上定义的语义和句法树进行查询执行。在使用查询构建树之前，LANLI 通过匹配算法将自然查询词与语料库标记进行匹配。LANLI 是一种有效的数据库检索系统，因为它对自然查询和内置数据库使用了准确的树形成算法，此外还使用了类似字典的表来解释自然查询可能拥有的知识。


    在 2014 年，自然查询到 SQL 的翻译算法通过 `CliniDAL` `[55`]` 被提出，专注于管理从实体-属性-值（EAV）设计模型提取数据的复杂性。该算法始于
    `Controller` 接收带有主要参数数量的自然查询以执行高级搜索。查询通过 `Query Processor` 使用查询树和存储在数据源上下文模型中的信息（一种元数据）进行解析、分类和优化，以产生包括实体、比较级及其类别（如患者、医疗、时间等）的查询或解析树。CliniDAL
    的语法解析器通过自由文本解析机制识别自然查询的部分，还有用于深度分析的数据分析后处理步骤。第三步是 `Query Translator` 识别树中的自然查询标记，以便
    `Mapper` 将它们映射到临床信息系统（CIS）中的内部概念表示。此映射过程使用基于相似性的 Top-k 算法，以及嵌入的 NLP 工具（如分词、缩写扩展和词形还原）。映射结果存储在通用上下文模型中，像索引一样为翻译过程提供必要信息。因此，自然查询标记对应的表和字段从数据源上下文模型中提取并输入
    `SQL SELECT` 子句，值表从 `SELECT` 子句中提取以生成 `SQL FROM` 子句。查询解析树的叶节点表示查询约束类别，通过对临床属性及其值进行代数计算反映结合或取或。CliniDAL
    使用唯一的统一术语 `TERM_ID` 及其同义词作为软件处理目的的内部标识符，例如组合 SQL 语句。


    在 2017 年，引入了特殊的 `CliniDAL` `[42`]`，将基于概念的自由文本搜索集成到其底解析、映射、翻译和时间表达式识别结构中。这些结构独立于
    CIS 运行，能够查询结构化和非结构化的模式字段（如患者笔记），以便从 CIS 中进行彻底的知识检索。这种翻译通过通过计算连接事实表的“枢接法”来实现，而不是使用
    DBMS 功能。聚合或统计函数需要进一步的后处理来应用和计算。


    在 2018 年，开发了一种名为 `QUEST` 的自然语言到关系数据库接口 `[56`]`，基于 IBM Watson UIMA 管道和 Cognos。QUEST
    强调关注嵌套查询而非简单查询，而不限制用户使用自然查询。QUEST 工作流由两个主要组件组成 `QUEST Engine Box` 和 `Cognos Engine
    Box`。`Quest Engine Box` 包含了模式独立的规则模板，通过从在线部分的模式文件中提取词典规则来工作，此外还有基于规则的语义模块。`Quest
    Engine Box` 还包括构建在许多 Watson 组件上的语义解析器，包括英语槽语法（ESG）、谓词参数结构（PAS）和子树模式匹配（SPMF）。该框最终产生一个
    SQL 子查询列表，随后输入 QUEST 的另一个框 `Cognos Engine Box`。后者专注于在 IBM DB2 服务器上生成和执行 SQL 语句。与之前的类似尝试相比，QUEST
    被证明是非常准确的。


    尽管上述尝试（基于标记的 `[57`]`、基于表的 `[58`]`、基于菜单的 `[59`]` 或受控自然语言搜索）在数据库上取得了成功，但简单的方法需要更多努力，因为翻译过程的准确性取决于映射过程的准确性。


    ### 机器学习算法


    NLP 工具和机器学习技术是目前信息提取最先进的实践之一。在机器学习技术方面，可以是基于规则或混合方法，用于特征识别和选择以及规则分类过程。

    '
