  fmt: '

    ## Method Overviews and Analysis


    - Uses a rich corpus created using complex and cross-domain semantic parsing and
    SQL patterns coverage.

    - An incremental approach, new experiences affect processing.

    - Uses a huge human labeled `NLQ/SQL` corpus for training and testing.

    - Mapping accuracy is not significantly high.

    - Focuses on simplicity and accuracy of the algorithm’s mapping outcome with highest
    priority.

    - Uses `NLQ MetaTable` to map `NLQ` tokens into `RDB` lexica.

    - The implemented `MetaTables` fill up the low accuracy gap in language translation
    algorithms that do not use any sort of deep DB schema data dictionaries or just
    a limited `Data Dictionary`.


    ### 18 WordNet alone


    - Efficient at expanding `NLQ` predicate arguments to their meaning interpretations
    and synonyms.

    - Handles complex `NLQs` without an ontological distinction.

    - Generalizes the relation arguments and does not guarantee `NLQ`’s lack of ambiguity
    and noise which significantly affects its meaning interpretation.

    - Supportive techniques are employed in the current research work such as the
    disambiguation module.

    - To avoid confusion around the `RDB` unique values, data profiling is performed
    on `RDB`’s statistics to automatically compile the mapping table of unique values,
    `PKs` and `FKs`.

    - Unique values, `PKs` and `FKs` are stored in a mapping table by specifying their
    hosting attributes and tables while a hashing function is used to access them
    instantly.


    ### 19 NLQ Tokens into RDB Lexica Mapping (RDB Lexica Relationships) Stanford
    Dependencies Parser


    - Can parse any language in any free word order.

    - Displays all sentence structure and tokens dependencies.

    - Uses parsing trees to represent syntax and semantics.

    - It is an outdated lexicalized parser, which leads to unnecessary errors.

    - Sentences must follow `Chomsky Normal Form` (`CNF`) style.

    - `NLQ` can be in any form as long as it has correct spellings and no ambiguous
    tokens.


    ### 20 Dependency Syntactic Parsing


    - Simple and expressive.

    - Displays each token in the `NLQ` in a high level.

    - Does not show any semantic information.

    - Some parsing trees are erroneous in that they never lead to the targeted `RDB`
    elements.

    - Potential false early prune out.

    - The simplest and most effective way of representing `RDB` elements relationships
    is by restricting the `RDB` schema relationships to be in the form of a verb for
    easy mapping between `NLQ` verbs and `RDB` relationships.


    ### 21 Dependency-Based Compositional Semantics (DCS) System Enriched with Prototype
    Triggers


    - Parsing and learning is done using logical forms (trees).

    - Has rich a properties set of computations, statistics and linguistics.

    - Requires manual annotation of logical forms and semantic parsing.

    - Complex implementation.

    - Simple rule-based algorithm that uses the semantic role of a verb to link `RDB`
    lexica with each other.

    - No manual annotation is needed.


    ### 22 NLQ Tokens into RDB Lexica Mapping (NLP syntax and semantics) Named Entity
    Tagger


    - Recognizes a wide range of literal values of named or numerical entity sets.

    - Does not remember previously tagged entity sets.

    - Supports support limited languages.

    - Does not show dependencies between named entity sets.

    - Previously tagged entity sets are saved (temporarily in case of limited storage)
    in the `NLQ MetaTable`.

    - Supports the `NLQ`’s syntactic and semantic grammar analysis with computational
    linguistics algorithms in the form of `RDB` and `NLQ MetaTables` to assist tokens
    mapping into `RDB` lexica.

    - `NLP` syntactic and semantic tools show the source tables of each token, which
    explains tokens’ relationships.


    ### 23 Dependency Parser


    - Produces parallel syntactic dependency trees.

    - Constructs dependency trees directly without any parse trees conversions.

    - Does not recognise complex language phenomena.

    - Considers understanding the `NLQ`, by finding the combination of its tokens’
    meanings, is the most essential part in the mapping and translation process.

    - Employs computational linguistic studies at the words processing level is employed.

    - The current research discovered common semantics between `NLQ` and `SQL` by
    analyzing the language syntax roles.


    ### 24 LIFER/LADDER Method


    - Uses `NLQ` syntactic and semantic analysis alone.

    - Simple and easy to implement.

    - Not sufficient and produces substantially low precision, `FPR` and `TNR`.

    - This research framework overcomes any poor underlying linguistic tools’ performance
    that are meant to analyse `NLQ` syntax and semantics by using the supportive `MetaTables`
    and `WordNet` ontology. Such `NLP` tools include named entity tagger, `tokenizer`,
    or `dependency parser`.


    ### 25 NLQ/SQL Syntax Trees Encoded Via Kernel Functions


    - Learns multiple `NLQ` syntactic features.

    - Represents unrestricted features of domain-specific knowledge.

    - Limited to available data resources.

    - Expensive development and high time consumption.

    - Does not show dependencies between named entity sets.

    - `RDB` schema knowledge, the semantic data models in the form of `MetaTables`,
    and syntactic-based analysis knowledge are used to generate parse trees from the
    identified tokens to properly map `NLQ` tokens to the related `RDB` elements.


    ### 26 The Probabilistic Context Free Grammar (PCFG) Method


    - Models `NLQ` features using production rules with estimated probabilities.

    - Uses overlapping and interdependent features to build its probability models.

    - Proved to be challenging in terms of finding the right grammar for optimization.

    - Iterative production rules lead to inherited computational complexity.

    - Requires an annotated training and testing dataset.

    - The current research discovered common semantics between `NLQ` and `SQL` by
    analyzing the language syntax roles.

    - Does not require annotated datasets.


    ### 27 RDB Lexica into SQL Clauses Mapping (SQL clauses mapping) The Extended
    UML Class Diagrams Representations


    - Extracts fuzzy tokens semantic roles in a form of a validation sub-graph or
    tree of the `Self Organizing Maps` (`SOM`) representation that transforms class
    diagrams into SQL clauses using the fuzzy set theory.

    - More flexible than the `MLA` approaches.

    - Provides higher measures of recall.

    - Has a high False Positive Ratio.

    - Uses computational linguistics mapping constraints to transform lexica into
    SQL clauses and keywords.

    - Computational linguistics is used here in the form of linguistics-based mapping
    constraints using a manually written rule-based algorithm.

    - Those algorithms are mainly observational assumptions.

    - The MetaTable specifies `RDB` schema categories (value, relationship, attribute,
    etc.) to map the identified `RDB` lexica into SQL clauses and keywords.

    - Provides high measures or accuracy and recall.


    ### 28 RDB Relationships and Linguistic Analysis


    - Relationships are used to map the lexica into `NLQs` linguistic semantic roles’
    classes as a conceptual data model.

    - The mapping results are derived from the connectivity matrix by searching for
    any existing logical path between the source (objects) and the target (attributes)
    to eventually map the logical path to an equivalent SQL.

    - The user has to identify the source, its associations or relationships and the
    target in the fuzzy `NLQ` to connect them for UML class diagram extraction.

    - Extraction is not thorough or exhaustive.

    - Current work uses `RDB` relationships and `NLP` tools, which are more capable
    of “understanding” the `NLQ` statement before translating it to an SQL query.

    - This method highly contributes to the increase in the translation accuracy.

    '
  trans: '


    ## 方法概述与分析


    - 使用了通过复杂的跨领域语义解析和 SQL 模式创建的丰富语料库。

    - 一种增量方法，新的经验会影响处理过程。

    - 使用巨大的人工标注 `NLQ/SQL` 语料库进行训练和测试。

    - 映射准确率并不高。

    - 优先考虑算法映射结果的简单性和准确性。

    - 使用 `NLQ MetaTable` 将 `NLQ` 标记映射到 `RDB` 词汇。

    - 实现的 `MetaTables` 弥补了语言翻译算法中未使用任何深层数据库架构数据字典或仅使用有限 `Data Dictionary` 的低准确率差距。


    ### 18 仅使用 WordNet


    - 擅长将 `NLQ` 谓词参数扩展到其含义解释和同义词。

    - 在没有本体论区分的情况下处理复杂的 `NLQ`。

    - 对关系参数进行泛化，但无法保证 `NLQ` 无歧义和噪声，这会显著影响其含义解释。

    - 当前研究工作采用了支持性技术，例如消歧模块。

    - 为了避免 `RDB` 唯一值的混淆，对 `RDB` 的统计数据进行数据分析，自动编译唯一值、`PKs` 和 `FKs` 的映射表。

    - 唯一值、`PKs` 和 `FKs` 通过指定其所属属性和表存储在映射表中，同时使用哈希函数进行快速访问。


    ### 19 NLQ 标记到 RDB 词汇的映射（RDB 词汇关系）Stanford 依赖解析器


    - 可以解析任何自由语序的任何语言。

    - 显示所有的句子结构和标记依赖关系。

    - 使用解析树表示语法和语义。

    - 这是一个过时的词汇化解析器，会导致不必要的错误。

    - 句子必须遵循`乔姆斯基范范式` (`CNF`) 样式。

    - 只要 `NLQ` 拼写正确且没有歧义标记，就可以可以是任何形式。


    ### 20 依存句法分析


    - 简单且表达力强。

    - 在高层显示 `NLQ` 中的每个标记。

    - 不显示任何语义信息。

    - 某些解析树是错误的，因为它们永远不会指向目标 `RDB` 元素。

    - 潜在的错误过早剪枝。

    - 最简单且有效的表示 `RDB` 元素关系的方法是将 `RDB` 架构关系限制为动词形式，以便在 `NLQ` 动词和 `RDB` 关系之间进行映射。


    ### 21 基于依存的组合语义 (DCS) 系统，由原型触发器增强


    - 使用逻辑形式（树）进行解析和学习。

    - 拥有一丰富的计算、统计和语言学属性集。

    - 需要对逻辑形式和语义解析进行人工标注。

    - 实现复杂。

    - 一种简单的基于规则的算法，利用动词的语义角色将 `RDB` 词汇相互连接。

    - 不需要人工标注。


    ### 22 NLQ 标记到 RDB 词汇的映射（NLP 语法和语义）命名实体标记器


    - 识别命名实体或数值实体集的广泛字面量值。

    - 不记得之前标记的实体集。

    - 支持有限的语言。

    - 不显示命名实体集之间的依赖关系。

    - 之前标记的实体集保存（由于存储限制，临时保存）在 `NLQ MetaTable` 中。

    - 使用以 `RDB` 和 `NLQ MetaTables` 形式存在的计算语言学算法支持 `NLQ` 的语法和语义分析，以辅助标记映射到 `RDB` 词汇。

    - `NLP` 语法和语义工具显示每个标记的源表，解释了标记之间的关系。


    ### 23 依存解析器


    - 生成并行的句法依存树。

    - 直接构建依存树，无需经过任何解析树转换。

    - 不识别复杂的语言现象。

    - 认为通过寻找标记含义的组合来理解 `NLQ` 是映射和翻译过程中最核心的部分。

    - 采用了单词处理级别的计算语言学研究。

    - 当前研究通过分析语言语法角色，发现了 `NLQ` 和 `SQL` 之间的共同语义。


    ### 24 LIFER/LADDER 方法


    - 仅使用 `NLQ` 语法和语义分析。

    - 简单易于实现。

    - 不充分，会产生相当低的精确率、`FPR` 和 `TNR`。

    - 该研究框架通过使用支持性的 `MetaTables` 和 `WordNet` 本体，克服了用于分析 `NLQ` 语法和语义的底层语言工具性能不良的问题。此类
    `NLP` 工具包括命名实体标记器、`tokenizer` 或依存解析器。


    ### 25 通过内核函数编码的 NLQ/SQL 语法树


    - 学习多个 `NLQ` 语法特征。

    - 表示领域特定知识的无限制特征。

    - 受限于可用数据资源。

    - 开发昂贵且耗时。

    - 不显示命名实体集之间的依赖关系。

    - 使用 `RDB` 架构知识、以 `MetaTables` 形式存在的语义数据模型以及基于语法的分析知识，从识别出的标记生成解析树，从而正确地将 `NLQ`
    标记映射到相关的 `RDB` 元素。


    ### 26 概率上下文无关文法 (PCFG) 方法


    - 使用带有估计概率的产生规则对 `NLQ` 特征建模。

    - 使用重叠和相互依赖的特征构建其概率模型。

    - 证明在寻找合适的语法进行优化方面具有挑战性。

    - 迭代产生规则导致了继承的计算复杂度。

    - 需要标注的训练和测试数据集。

    - 当前研究通过分析语言语法角色，发现了 `NLQ` 和 `SQL` 之间的共同语义。

    - 不需要标注的数据集。


    ### 27 RDB 词汇到 SQL 子句的映射（SQL 子句映射）扩展 UML 类图表示


    - 以自组织映射 (`SOM`) 表示形式的验证子图或树，提取模糊标记的语义角色，该表示使用模糊集合理论将类图转换为 SQL 子句。

    - 比 `MLA` 方法更灵活。

    - 提供更高的召回率。

    - 具有较高的假阳性率 (False Positive Ratio)。

    - 使用计算语言学映射约束将词汇转换为 SQL 子句和关键字。

    - 此处的计算语言学是以手动编写的基于规则的算法的映射约束的形式使用的。

    - 这些算法主要基于观察的假设。

    - MetaTable 指定 `RDB` 架构类别（值、关系、属性等），将识别出的 `RDB` 词汇映射到 SQL 子句和关键字。

    - 提供高准确率和召回率。


    ### 28 RDB 关系与语言分析


    - 关系用于将词汇映射到 `NLQ` 语言语义角色类，作为概念数据模型。

    - 映射结果来自连通矩阵，通过搜索源（对象）和目标（属性）之间的任何逻辑路径，最终将逻辑路径映射到等效的 SQL。

    - 用户必须在模糊 `NLQ` 中识别源、其关联或关系以及目标，以便连接它们提取 UML 类图。

    - 提取并不彻底或详尽。

    - 当前工作使用 `RDB` 关系和 `NLP` 工具，这些工具在翻译 SQL 查询之前能更好地“理解” `NLQ` 语句。

    - 该方法对提高翻译准确率有很大贡献。


    '
