- raw: 'Giordani and Moschitti \[[76](#reference.xhtml#refbm_76)\] designed an NLQ
    translation system that generates SQLs based on grammatical relations and matching
    metadata using NL linguistic and syntactic dependencies to build potential SELECT
    and WHERE clauses, by producing basic expressions and combining them with the
    conjunction or negation expressions, and metadata to build FROM clauses that contain
    all DB tables that S and W clauses refer to, supported by pairing with highest-weight
    meaningful joins, with MySQL framework in the back end. However, queries that
    involve less joins and SQLs embedding the most meaningful referenced tables are
    preferred. Those clauses are then combined using a smart algorithm to form the
    final list of possible SQL statements that have matching structure and clauses’
    components related to the DB metadata, NLQ tokens and their grammar dependencies,
    which are mapped with NLQ tokens using a mapping algorithm. Generated SQLs have
    a weighting scheme which relies on how many results are found, to order them based
    on probability of correctness. NLQ tokens’ textual relationships are represented
    by the typed dependency relations called the Stanford Dependencies Collapsed (SDC).
    SDC works by representing the NLQq by its typed SDCq list, which is prepared by
    first pruning out the NLQ relations of useless stop/escape words, then stemming/lemmatizing
    the remaining NLQ’s grammatical relations to reach the optimized list SDCopt used
    to build the clauses SELECT S and WHERE W, and lastly adding the relations’ synonyms
    to the SDCopt list. After that, an iterative algorithm q is applied, which adds
    the modified stems to Π and/or Σ (e.g. subject or object) categories to search
    the DB metadata for matching fields with weighted projection-oriented stems and
    generate the SQL clauses S, F, W, or the nested queries, so the answers set A
    = SELECT S × FROM F × WHERE W contains all potential SQLs related to q. At the
    end, the system will select the single SQL from the A set that maximizes the probability
    of answering query Q correctly. This NLIDB system effectiveness and accuracy at
    selecting the correct SQL depends on the order of the SQL in the generated list.
    SQLs on top of the list (top 10) have 81% correct data retrieval, and 92% on the
    top 5 SQLs. Nevertheless, authors believe that these accuracies can be improved
    by learning a reranker to reorder the top 10 SQLs. Yet, this NLIDB is considered
    novel as it is expert-independent since all needed knowledge is already in the
    DB metadata stores \[[76](#reference.xhtml#refbm_76)\].


    A similar NLIDB system was designed by \[[77](#reference.xhtml#refbm_77)\] with
    comparable performance despite using different approaches as an expert user who
    specified semantic grammars is used to enrich the DB metadata and also implemented
    ad hoc rules in a semantic parser \[[77](#reference.xhtml#refbm_77)\]. Other similar
    work is the KRISP \[[78](#reference.xhtml#refbm_78)\] system, which achieved 94%
    Precision and 78% Recall of correctly retrieved SQL answers.


    Giordani and Moschitti \[[24](#reference.xhtml#refbm_24)\] have innovated a novel
    model design for automatic mapping of NL semantics into SQL-like languages by
    doing the mapping at syntactic level between the two languages. After that, Support
    Vector Machines (SVM) ML algorithm is applied on the mapping results to derive
    the common high-level semantics to automatically translate NLQs into SQLs. To
    do this, syntactic parsers were used to define NLQ and SQL trees through the ML
    algorithm using a statistical and shallow model. SVM is used here to build the
    training and test sets, where the ML model input is a corpus of questions and
    their correct answers. SVM then automatically generates the annotated and labeled
    set of all probable correct and incorrect relational Question/Answer (Q/A) pairs.
    Those RDB pairs are encoded in SVMs using Kernel Functions to compute the number
    of common substructures between two trees and produce the union of the shallow
    feature spaces of NLQs and SQLs. Moreover, Kernel Functions is also a combination
    of Tree Kernels (e.g. Syntactic Tree Kernel (STK) and Its Extension with leaf
    features (STKe)) applied to syntactic trees and Linear Kernels applied to bag-of-words,
    and both applied to the syntactic trees of NLQs and SQLs to train the classifier
    over those pairs to select the correct SQLs for an NLQ. Then, map this new NLQ
    to the set of available SQLs and rank all available SQLs according to their classifier
    scores and only use the higher scores NLQs. Ranking potential SQLs to a given
    NLQ is done through an SVM using advanced kernels to generate a set of probable
    NLQ/SQL pairs and classify them to correct or incorrect using an automatic categorizer
    on their syntactic trees by applying Charniak’s syntactic parser on NLQs and a
    modification of the SQL derivation tree using an ad hoc parser on SQL queries.
    Then, the top-ranked pairs are selected according to the automatic categorizer
    probability score output. Authors tested the mapping algorithm of NLQs into SQLs
    using a standard 10-fold cross-validation, the standard deviation, the learning
    curve and the average accuracy of correct SQLs selection for each NLQ. This approach
    proved to be able to capture the shared semantics between NLQs and SQLs. It also
    proved that the implemented kernel improves the baseline model (32%) according
    to the cross-validation experiments by choosing correct SQLs to a certain NLQ.
    However, a polynomial kernel (POLY) of 3rd degree on a bag of words is better
    than STK because it consists of individual tokens that does not exist in STK.
    Overall, kernel methods are reliable in describing relational problems by means
    of simple building blocks \[[24](#reference.xhtml#refbm_24)\].


    Tseng and Chen \[[79](#reference.xhtml#refbm_79)\] aim at validating the conceptual
    data modeling power in the NLIDB area via extending the Unified Modeling Language
    (UML) \[[80](#reference.xhtml#refbm_80), [81](#reference.xhtml#refbm_81)\] concepts
    using the extended UML class diagram’s representations to capture and transform
    NLQs with fuzzy semantics into the logical form of SQLs for DB access with the
    help of a Structured Object Model (SOM) representation \[[82](#reference.xhtml#refbm_82)\]
    that is applied to transform class diagrams into SQLs for query execution \[[50](#reference.xhtml#refbm_50)\].
    This approach maps semantic roles to a class diagram schema \[[80](#reference.xhtml#refbm_80),
    [81](#reference.xhtml#refbm_81), [83](#reference.xhtml#refbm_83)\] and their application
    concepts, which is one of the UML 9 diagrams used to demonstrate the relationships
    (e.g. Generalization and Association) among a group of classes. Carlson described
    several constraints to build semantic roles in English sentences \[[84](#reference.xhtml#refbm_84)\].


    UML is a standard graphical notation of Object-Oriented (OO) modeling and information
    systems design tool used for requirement analysis and software design. UML class
    diagrams are used to model the DB’s static relationships and static data models
    (the DB schema) by referring to the DB’s conceptual schema. SOM methodology is
    a conceptual data-model-driven programming tool used to navigate, analyze, and
    design DB applications and process DB queries \[[79](#reference.xhtml#refbm_79)\].'
