    ## NLQ input processing interface, the NLIDB


    This first step is a point of interaction with the user. The user interface could
    be either a simple coded data input interface or a web-based Graphical User Interface
    (GUI). GUIs use web design languages such as HTML, CSS, and PHP. This interface
    is used to enter a question in an NLQ form. Generally, NLIDB could be any of the
    following options:


    ### Interactive Form-Based Interface \[[16](#reference.xhtml#refbm_16)\]


    Though this looks attractive, it does not always retrieve data variations from
    the DB as we can easily define in a formal SQL statement.


    ### Keyword-Based Query Interface \[[17](#reference.xhtml#refbm_17)\]


    Extracts keywords from the input NLQ and identifies whether those keywords are
    domain-specific or language constructs. Next, the system applies translation rules
    from the generated knowledge base to use those keywords to form an SQL query.


    ### NLQ-Based Interface \[[18](#reference.xhtml#refbm_18)\]


    Unlike previous options, this approach tries to actually understand the NLQ first
    before converting it into an SQL statement. To do this, the system applies lexicon
    breakdown and NLP syntactic and semantic analysis on the input NLQ. Lexica is
    the plural of lexicon, which is the name of a matching RDB element with a stemmed
    NLQ token.


