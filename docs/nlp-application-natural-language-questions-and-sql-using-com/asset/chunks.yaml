- raw: '1.  Simple straightforward questions with simple linguistic structures that
    have one question word, complete semantic meanings, and no ambiguous expressions;
    or


    2.  Complicated general questions with lots of ambiguous expressions and fuzzy
    predicates. The ambiguity could be due to omitting necessary words, adding unrelated
    words, including more than 1 question word, or the lack thereof.


    Furthermore, NLQ questions can be further categorized as questions asking for
    a specific entity, quantity, rank of a list of entities or a proportion ratio.
    They can also be interrogative questions, being either imperative or declarative
    in a negative or affirmative form. The NLP linguistic tools are trained to capture
    those question structures and types.


    In the proposed research, an NLQ-based interface is chosen as an interface to
    the Natural Language Interface to DataBase (NLIDB) system. This is because it
    is the most natural way of communicating with a computing machine. It is also
    the most desirable way of communication for decision-makers, who are the target
    audience for the proposed research work. In addition, full semantic understanding
    of the NLQ by the system is the most essential part before attempting to translate
    it to any other query language.


    With regard to the adopted NLQ type, only simple straightforward questions, which
    is the first NLQ question type as explained earlier, are considered. This is because
    the main focus and contribution of the proposed research work is the mapping mechanism,
    not resolving or disambiguating misstructured or incomplete NLQs. Yet there is
    a simple disambiguation module implemented for simple NLQ problems. However, addressing
    the complicated general questions (i.e., with aggregation or negation) is one
    of the main suggestion for future study.


    ## Part of Speech (POS) recognition


    To recognize part of speech (POS) for NLQs, the following subsequent layers must
    be clarified first.


    ### Linguistic Components Layers


    In the proposed system, morphological analysis is performed during the lexical
    analysis in order to identify keywords’ properties and break them down into their
    basic components. A good example for morphological and lexical analysis is WordNet
    \[[19](#reference.xhtml#refbm_19)\]. This traces connections between keywords
    and separates the words from their suffixes or affixes (e.g., Client’s to ‘client’
    and ‘s’). In addition, WordNet separates words from their punctuations (a.k.a.
    non-word tokens).


    Other linguistic components, which are also part of the NLP tools in the current
    research framework, include the tokenizer, the POS tagger, the dependency tree
    parser, Named Entity Recognition (NER), and syntactic and semantic analyzers such
    as Link Grammar Parser \[[20](#reference.xhtml#refbm_20)\] and Stanford Parser
    \[[21](#reference.xhtml#refbm_21)\]. Those NLP tools are principally used for
    transforming NLQ tokens into a parse tree structure to then map them into their
    appropriate SQL query template. Discourse Analysis \[[22](#reference.xhtml#refbm_22)\]
    and Pragmatics \[[23](#reference.xhtml#refbm_23)\] also fall under the latter
    NLQ translation method. SQL syntactic parse trees are usually 100% accurate. The
    NLQ parse trees are also accurate but usually introduce some noise affecting the
    overall NLQ features representation accuracy \[[24](#reference.xhtml#refbm_24)\].


    The NLQ grammar is distributed to various linguistic areas, including discourse,
    pragmatics and text theory \[[23](#reference.xhtml#refbm_23)\]. More specifically,
    the included linguistic areas are Cognitive Designs \[[25](#reference.xhtml#refbm_25)\],
    Descriptive Convenience Modules \[[26](#reference.xhtml#refbm_26)\] or specific
    techniques such as syntax, semantics, morphology, phonology and lexica.


    #### Syntactic parser (rule-based)


    Syntax is the study of how words are combined to form sentences. It includes the
    analysis of POS to show how words are related to one another, and their aggregations
    to form larger sentence constructions. The syntax analyser ignores sentences that
    do not conform to a proper language grammar or rules of how words are supposed
    to be combined.


    POS tags are needed before sentence parsing. Syntactic parsing analyzes complex
    sentences with large amounts of ambiguousness and conditional relationships. It
    also defines the scope of exclusion and probability statements (statements on
    the probability of inclusion \[[27](#reference.xhtml#refbm_27)\]).


    Under syntactic parsing, there are subtasks that also take place, including:


    1.  Text Structure Analysis: This is the study of how similarly comparable words
    are and how their textual types are constructed to compose larger textual constructions
    \[[28](#reference.xhtml#refbm_28)\].


    2.  Lemmatizer: This module derives the original form (the root word) of each
    NLQ word, which happens before tokenization.


    3.  Tokenizer: Entered NLQ is tokenized by separating the NLQ textual words into
    separate tokens. Those tokens will be stored and passed on to the next module
    for further analysis.


    4.  POS Tagger: This is otherwise known as word category disambiguation or grammatical
    tagging. POS tagging takes into consideration both the word’s definition and its
    context in the sentence; to mark the word in the text or corpus to belong to a
    particular POS.


    #### Semantic parser (rule-based)


    Semantics is the study of the actual meaning of a word such that they relate a
    certain language word with its intentional meaning representation. An example
    of semantics analysis is relating a syntactic constituent with a predicate \[[29](#reference.xhtml#refbm_29)\].
    This is because all structures created by the syntactic analyzer have meanings.
    In the case when there was no equivalent meaning representation to a certain syntactic
    structure, the whole sentence is rejected and ignored by the semantic parser considering
    it semantically anomalous.


    NLQs are processed based on their accurate semantic properties, indicated by underlying
    NLP linguistic tools such as the semantic parser. It is important to define the
    context in an NLQ with information further than the equivalent lexical properties.
    As such, verbs, subjects, objects and their relationships must be identified.


    Under the semantics analysis and parsing, there are the following definitions:


    1.  Pragmatics \[[23](#reference.xhtml#refbm_23)\]: is studying how the textual
    context affects expressions’ meanings. It explores expression’s implicit meaning
    using the sentence’s current structure representation. Next, the expression is
    reinterpreted to determine its specific implicit meaning.


    2.  Morphology \[[30](#reference.xhtml#refbm_30)\]: is studying the units of meanings
    or functions (called morphemes) in a certain language. A morpheme can be a word,
    affix, prefix, or another word structure.


    3.  Phonology \[[31](#reference.xhtml#refbm_31)\]: is studying the sound patterns
    of a certain language to determine which phones are significant and meaningful
    (the phonemes). Phonology also studies syllables’ structures and the needed features
    to describe and interpret the discrete units (segments) in sentences.


    4.  Phonetics \[[32](#reference.xhtml#refbm_32)\]: is studying the sounds of spoken
    language. Phonetics studies how a phoneme is made and perceived. A phoneme is
    the smallest unit of an individual speech sound.


    #### Lexicon


    Lexicon studies aim at studying a language vocabulary, that is words and phrases.
    In the current research work, RDB lexica are stored in the RDB MetaTable which
    is used to map the NLQ words to their formal representations in an RDB (i.e.,
    table names, attribute names, etc.). Lexica are analyzed by both syntactic and
    semantic parsers.


    ### Intermediate Language Representation Layer'
