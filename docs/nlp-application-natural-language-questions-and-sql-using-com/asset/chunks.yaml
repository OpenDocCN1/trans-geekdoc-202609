    \ with comparable performance despite using different approaches as an expert\
    \ user who specified semantic grammars is used to enrich the DB metadata and also\
    \ implemented ad hoc rules in a semantic parser [[77](#reference.xhtml#refbm_77)]].\
    \ Other similar work is the `KRISP` [[78](#reference.xhtml#refbm_78)]] system,\
    \ which achieved 94% Precision and 78% Recall of correctly retrieved SQL answers.\n\
    \nGiordani and Moschitti [[24](#reference.xhtml#refbm_24)]] have innovated a novel\
    \ model design for automatic mapping of NL semantics into SQL-like languages by\
    \ doing the mapping at syntactic level between the two languages. After that,\
    \ Support Vector Machines (`SVM`) ML algorithm is applied on the mapping results\
    \ to derive the common high-level semantics to automatically translate NLQs into\
    \ SQLs. To do this, syntactic parsers were used to define NLQ and SQL trees through\
    \ the ML algorithm using a statistical and shallow model. `SVM` is used here to\
    \ build the training and test sets, where the ML model input is a corpus of questions\
    \ and their correct answers. `SVM` then automatically generates the annotated\
    \ and labeled set of all probable correct and incorrect relational Question/Answer\
    \ (`Q/A`) pairs. Those RDB pairs are encoded in `SVMs` using `Kernel Functions`\
    \ to compute the number of common substructures between two trees and produce\
    \ the union of the shallow feature spaces of NLQs and SQLs. Moreover, `Kernel\
    \ Functions` is also a combination of `Tree Kernels` (e.g. Syntactic Tree Kernel\
    \ (`STK`) and Its Extension with leaf features (`STKe`)) applied to syntactic\
    \ trees and `Linear Kernels` applied to bag-of-words, and both applied to the\
    \ syntactic trees of NLQs and SQLs to train the classifier over those pairs to\
    \ select the correct SQLs for an NLQ. Then, map this new NLQ to the set of available\
    \ SQLs and rank all available SQLs according to their classifier scores and only\
    \ use the higher scores NLQs. Ranking potential SQLs to a given NLQ is done through\
    \ an `SVM` using advanced kernels to generate a set of probable NLQ/SQL pairs\
    \ and classify them to correct or incorrect using an automatic categorizer on\
    \ their syntactic trees by applying Charniak’s syntactic parser on NLQs and a\
    \ modification of the SQL derivation tree using an ad hoc parser on SQL queries.\
    \ Then, the top-ranked pairs are selected according to the automatic categorizer\
    \ probability score output. Authors tested the mapping algorithm of NLQs into\
    \ SQLs using a standard 10-fold cross-validation, the standard deviation, the\
    \ learning curve and the average accuracy of correct SQLs selection for each NLQ.\
    \ This approach proved to be able capture the shared semantics between NLQs and\
    \ SQLs. It also proved that the implemented kernel improves the baseline model\
    \ (32%) according to the cross-validation experiments by choosing correct SQLs\
    \ to a certain NLQ. However, a polynomial kernel (`POLY`) of 3rd degree on a bag\
    \ of words is better than `STK` because it consists of individual tokens that\
    \ does not exist in `STK`. Overall, kernel methods are reliable in describing\
    \ relational problems by means of simple building blocks [[24](#reference.xhtml#refbm_24)].\n\
    \nTseng and Chen [[79](#reference.xhtml#refbm_79)]] aim at validating the conceptual\
    \ data modeling power in the NLIDB area via extending the Unified Modeling Language\
    \ (`UML`) [[80](#reference.xhtml#refbm_80), [81](#reference.xhtml#refbm_81)]]\
    \ concepts using the extended UML class diagram’s representations to capture and\
    \ transform NLQs with fuzzy semantics into the logical form of SQLs for DB access\
    \ with the help of a Structured Object Model (`SOM`) representation [[82](#reference.xhtml#refbm_82)]]\
    \ that is applied to transform class diagrams into SQLs for query execution [[50](#reference.xhtml#refbm_50)].\
    \ This approach maps semantic roles to a class diagram schema [[80](#reference.xhtml#refbm_80),\
    \ [81](#reference.xhtml#refbm_81), [83](#reference.xhtml#refbm_83)]] and their\
    \ application concepts, which is one of the UML 9 diagrams used to demonstrate\
    \ the relationships (e.g. Generalization and Association) among a group of classes.\
    \ Carlson described several constraints to build semantic roles in English sentences\
    \ [[84](#reference.xhtml#refbm_84)].\n"
  trans: '

    Giordani 和 Moschitti [76]] 设计了一种自然语言查询（NLQ）翻译系统，该系统利用自然语言语言和句法依赖关系构建潜在的 `SELECT`
    和 `WHERE` 子句，通过产生基础表达式并与连接词或否定表达式结合，以及利用元数据构建 `FROM` 子句；`FROM` 子句包含了 `S` 和 `W`
    子句所引用的所有数据库表，并由最高权重的语义连接提供支持，后端使用 `MySQL` 框架。然而，系统倾向于选择连接较少且 SQL 嵌入了最具意义引用表的查询。随后，这些子句通过智能算法组合，形成最终的可能
    SQL 语句列表，这些语句的结构和子句组件与数据库元数据、NLQ 标记及其语法依赖相关，而这些标记通过映射算法映射到 NLQ 标记。生成的 SQL 具有有一套权重方案，根据找到的结果数量来基于正确性概率对它们进行排序。


    NLQ 标记的文本关系通过称为斯坦福依赖关系折叠（Stanford Dependencies Collapsed, SDC）的类型依赖关系来表示。`SDC`
    的工作原理是通过其类型 `SDCq` 列表来表示 `NLQq`，该列表的准备过程首先是裁剪掉无用停用词/转义字的 NLQ 关系，然后对剩余 NLQ 的语法关系进行词干提取/还原化，以获得用于构建子句
    `SELECT S` 和 `WHERE W` 的优化列表 `SDCopt`，最后将关系的同义词添加到 `SDCopt` 列表中。之后，应用迭代算法 `q`，将修改后的词根添加到
    `Π` 和/或 `Σ`（例如主语或宾语）类别中，以在数据库元文中搜索具有加权投影型词根的匹配字段，并生成 SQL 子句 `S`、`F`、`W` 或嵌套查询，使得结果集
    `A = SELECT S × FROM F × WHERE W` 包含所有与 `q` 相关的潜在 SQL。最后，系统将从 `A` 集中选出一个使正确回答查询
    `Q` 概率最大的单个 SQL。该 NLIDB 系统在选择正确 SQL 方面的有效性和准确性取决于 SQL 在生成列表中的顺序。列表顶部（前 10 条）的
    SQL 的正确数据检索率为 81%，前 5 条 SQL 为 92%。尽管如此，作者认为这些准确性可以通过学习一个重排序器来重新排列前 10 条 SQL 以进行提高。然而，这种
    NLIDB 被认为是新颖的，因为它独立于专家，因为所有所需的知识都已存储在数据库元数据存储中 [76]。


    类似的 NLIDB 系统由 [77]] 设计，尽管使用了不同的方法（即使用指定了语义语法的专家用户来丰富数据库元数据，并在语义解析器中实现了即时规则 [77]]），但其性能相当。其他类似的工作是
    `KRISP` [78]] 系统，它实现了正确检索 SQL 答案的 94% 准确率和 78% 召回率。


    Giordani 和 Moschitti [24]] 通过在两种语言之间的句法层上进行映射，为自然语言语义自动映射到 SQL 类语言创新了一种新颖的模型设计。随后，在映射结果上应用支持向量机（`SVM`）机器学习算法，推导出共同的高层语义，从而自动将
    NLQ 翻译为 SQL。为了实现这一点，使用了句法解析器通过统计和浅层模型利用机器学习算法定义 NLQ 和 SQL 树。`SVM` 在此处用于构建训练和测试集，其中机器学习模型的输入是问题及其正确答案的语料库。`SVM`
    随后自动生成所有可能的正确和错误关系型问/答（`Q/A`）对的标注和标记集。这些关系对使用核函数（`Kernel Functions`）编码在 `SVM`
    中，以计算两个树之间公共子结构的数量，并产生 NLQ 和 SQL 浅层特征空间的并集。此外，`Kernel Functions` 还是应用于句法树的树内核（例如句法树内核
    `STK` 及其带有叶子特征的扩展 `STKe`）与应用于词袋的线性内核（`Linear Kernels`）的结合，两者都应用于 NLQ 和 SQL 的句法树，以便在这些对上训练分类器，从而为
    NLQ 选择正确的 SQL。然后，将此新 NLQ 映射到可用 SQL 集，并根据分类器评分对所有可用 SQL 进行排序，且仅使用分较高的 NLQ。对给定 NLQ
    的潜在 SQL 排序通过 `SVM` 使用高级内核完成的，用于生成一组可能的 NLQ/SQL 对，并通过在 NLQ 上应用 Charniak 句法解析器以及对
    SQL 查询使用即时解析器修改 SQL 推导树，在它们的句法树上使用自动分类器将它们分类为正确或错误。然后，根据自动分类器输出的概率评分选择排名靠前的对。作者使用标准的
    10 折交叉验证测试了 NLQ 到 SQL 的映射算法，并记录了标准差、学习曲线以及每个 NLQ 正确 SQL 选择的平均准确率。这种方法证明能够捕捉 NLQ
    和 SQL 之间的共享语义。交叉验证实验也证明，实现的内核通过为某个特定的 NLQ 选择正确的 SQL，改进了基准模型（32%）。然而，词袋上的 3 次多项式内核（`POLY`）比
    `STK` 更好，因为它包含了 `STK` 中不存在的单个标记。总而言，核方法通过简单的构建块可靠地描述关系型问题 [24]。


    Tseng 和 Chen [79]] 旨在验证 NLIDB 领域的概念数据建模能力，通过扩展统一建模语言（`UML`）[80, 81]] 概念，使用扩展的
    UML 类图表示来捕捉并将具有模糊语义的 NLQ 转换为 SQL 的逻辑形式以访问数据库，这有助于结构化对象模型（`SOM`）表示 [82]]，该表示用于将类图转换为用于执行的
    SQL [50]]。这种方法将语义角色映射到类图模式 [80, 81, 83]] 及其应用概念，该模式是 UML 九种图之一，用于演示一组类之间的关系（例如泛化和关联）。Carlson
    描述了在英语句子中构建语义角色的若干约束 [84]。

    '
