    [2013](#reference.xhtml#refbm_17), [18](#reference.xhtml#refbm_18), [35](#reference.xhtml#refbm_35),
    [39](#reference.xhtml#refbm_39), [40](#reference.xhtml#refbm_40), [41](#reference.xhtml#refbm_41),
    [46](#reference.xhtml#refbm_46), [47](#reference.xhtml#refbm_47), [48](#reference.xhtml#refbm_48),
    [49](#reference.xhtml#refbm_49), [52](#reference.xhtml#refbm_52), [53](#reference.xhtml#refbm_53),
    [57](#reference.xhtml#refbm_57), [59](#reference.xhtml#refbm_59), [60](#reference.xhtml#refbm_60),
    [65](#reference.xhtml#refbm_65), [66](#reference.xhtml#refbm_66), [67](#reference.xhtml#refbm_67),
    [68](#reference.xhtml#refbm_68), [69](#reference.xhtml#refbm_69), [70](#reference.xhtml#refbm_70),
    [71](#reference.xhtml#refbm_71), [72](#reference.xhtml#refbm_72), [73](#reference.xhtml#refbm_73),
    [99](#reference.xhtml#refbm_99), [100](#reference.xhtml#refbm_100), [124](#reference.xhtml#refbm_124),
    [125](#reference.xhtml#refbm_125), [126](#reference.xhtml#refbm_126), [127](#reference.xhtml#refbm_127),
    [128](#reference.xhtml#refbm_128), [129](#reference.xhtml#refbm_129), [130](#reference.xhtml#refbm_130)]`.
    According to the literature `[[57](#reference.xhtml#refbm_57), [74](#reference.xhtml#refbm_74)]`,
    mapping NLQ into SQL occurs using any of the following approaches:


    ### Interface-Based Systems

    By using `[[131](#reference.xhtml#refbm_131)]` to design RDB elements through
    a keyword-based interface `[[131](#reference.xhtml#refbm_131)]`.


    ### Enriching the NLQ/SQL Pair

    By adding extra features `[[132](#reference.xhtml#refbm_132)]` to the NLQ/SQL
    pairs to find semantic representation (e.g., Inductive Logic Programming (`ILP`)
    `[[75](#reference.xhtml#refbm_75)]`).


    ### Using Algorithms

    By using `[[33](#reference.xhtml#refbm_33)]` to map NLQs into SQL by training
    a Support Vector Machine (`SVM`) `[[33](#reference.xhtml#refbm_33)]`.


    ### Restricted NLQ Input

    By using `[[128](#reference.xhtml#refbm_128)]` through a template-based Natural
    Language Interface (`NLI`) `[[52](#reference.xhtml#refbm_52)]`.


    ### Tree Kernels Models

    A Kernel Function `[[110](#reference.xhtml#refbm_110), [113](#reference.xhtml#refbm_113),
    [133](#reference.xhtml#refbm_133)]` is a combination of Tree Kernels `[[134](#reference.xhtml#refbm_134)]`
    such as the Polynomial Kernel (`POLY`) `[[135](#reference.xhtml#refbm_135)]`,
    Syntactic Tree Kernel (`STK`) `[[33](#reference.xhtml#refbm_33)]` and its extension
    with leaf features (`STKe`) `[[132](#reference.xhtml#refbm_132)]`. They can be
    applied on NLQs/SQL pairs syntactic trees, while Linear Kernels `[[136](#reference.xhtml#refbm_136)]`
    are applied on a "bag-of-words". They are used to train the classifier over those
    pairs to select a correct SQL for a given NLQ.


    ### Unified Modeling Language (UML) `[[34](#reference.xhtml#refbm_34), [118](#reference.xhtml#refbm_118)]`

    A standard graphical notation of Object Oriented (OO) Modeling `[[137](#reference.xhtml#refbm_137)]`
    and an information system design tool. UML is a combination of Rumbaugh’s Object-Modeling
    Technique (`OMT`) `[[119](#reference.xhtml#refbm_119)]`, Booch’s OO Analysis and
    Design `[[74](#reference.xhtml#refbm_74)]`, and Jacobson’s Objectory `[[100](#reference.xhtml#refbm_100)]`.
    UML class diagrams are used to model the DB’s static relationships and static
    data model (DB schema) by referring to the DB’s conceptual schema.


    ### Weighted Links `[[81](#reference.xhtml#refbm_81)]`

    Is a mapping system that works by pairing with the highest weight meaningful joins
    between RDB lexica and SQL clauses.


    What follows is an explanation of each of the above mapping approaches and a justification
    of excluding them by choosing the second approach, enriching the NLQ/SQL pairs,
    as the most effective one.

    '
  trans: '

    在 GEOQUERIES 语料库上执行的第一关系是 `[115]` 算法中的 `FROM` 子句关系，它在考虑 `WHERE` 子句中可选条件的情况下寻找对应的数据库元组，然后将结果与
    `SELECT` 子句属性进行匹配。如果出现任何空子句或嵌套查询不匹配，该算法将不产生结果；否则，在使用标准的 10 折交叉验证性能衡量下，在 93% 的情况下前三个
    SQL 中生成正确的 SQL。这种高准确率和召回率得于鲁棒且基于启发式的权重重排序器，该重排序器使用 `SVM-Light-TK6` 构建，它通过扩展 `SVM-Light`
    优化器 `[117]` 并采用树核 `[118, 119]` 来使用加法 `STKn + STKs` 或乘法 `STKn × STKs`。使用了默认的重排序器参数，例如归一化核中的
    `λ = 0.4` 以及代价和权衡参数 = 1。然而，这种方法要求预先存在可能的 SQL，因为算法无法生成新的 SQL，它只验证输入的自然语言查询（NLQ）是否有对应的
    SQL 来产生正确答案。


    在概念上与 `[115]` 相似，Lu 等人的 `[120]` 映射系统也不依赖 NLQ 标注，而是依赖于生成模型和 `(MODELIII+R)`，这是一个判别性重排序技术。同样，`DCS`
    系统 `[121]` 也不依赖数据库标注，并且作为一个增强了原型触发器的映射系统（`DCS+`）一样工作。此外，从问答对中，SEMRESP 采用了一种语义解析器学习器
    `[122]`，它在标注的逻辑形式（SQL）上表现最好。Kwiatkowski 等人 `[123]` 开发了 `UBL` 系统，在 SQL 和问答对上训练后，它能够利用受限的词项结合一些
    CCG 组合规则来学习新输入的 NLQ 词汇。


    ## 当前研究工作的合理性


    本工作提出的主要目标是在 NLQ 和机器可读指令（如关系数据库查询语言 `SQL`）之间寻找一种简单但准确的映射机制。到为止，还没有一种既不因复杂性而牺牲准确性和精度，又不因过度简化而导致无法运行的
    NLQ 到 SQL 翻译机制。此类翻译机制在应用于其他关系数据库时会产生大量的规则异常和错误。因此，所提的研究利用了一种简单的手动编写基于规则的映射约束算法，设计了一种独特且准确的
    NLQ 到 SQL 翻译机制。该算法将 NLQ 标记的语义和语法信息映射到关系数据库元素类别（如值、属性等），然后一致地映射到 SQL 子句。该算法通过 `MetaTables`
    使用计算语言分析配对和匹配机制。将 NLQ 翻译为类 SQL 语言的研究有悠久的历史，从 1971 年一直延续至今 `[2, 2013, 4, 12, 16,
    2013, 18, 35, 39, 40, 41, 46, 47, 48, 49, 52, 53, 57, 59, 60, 65, 66, 67, 68,
    69, 70, 71, 72, 73, 99, 100, 124, 125, 126, 127, 128, 129, 130]`。根据文献 `[57, 74]`，将
    NLQ 映射为 SQL 通过以下任何方法实现：


    ### 基于接口的系统

    通过 `[131]` 使用基于关键字的接口 `[131]` 设计关系数据库元素。


    ### 增强 NLQ/SQL 对

    通过在 NLQ/SQL 对中添加额外特征 `[132]` 来寻找语义表示（例如，归纳逻辑编程 `ILP` `[75]`）。


    ### 使用算法

    通过使用 `[33]` 通过训练支持向量机 (`SVM`) `[33]` 将 NLQ 映射为 SQL。


    ### 受限的 NLQ 输入

    通过 `[128]` 使用基于模板的自然语言接口 (`NLI`) `[52]`。


    ### 树核模型

    核函数 `[110, 113, 133]` 是树核 `[134]` 的组合，例如多项式核 (`POLY`) `[135]`、语法树核 (`STK`) `[33]`
    以及其带有叶子特征的扩展 (`STKe`) `[132]`。它们可以应用于 NLQ/SQL 对的语法树，而线性核 `[136]` 则应用于“词袋”。它们用于对这些对训练分类器，以为给定的
    NLQ 选择正确的 SQL。


    ### 统一建模语言 (UML) `[34, 118]`

    一种面向对象建模 `[137]` 的标准图形化表示和信息系统设计工具。UML 是 Rumbaugh 的对象建模技术 (`OMT`) `[119]`、Booch
    的面向对象分析与设计 `[74]` 以及 Jacobson 的对象构造的组合。UML 类图用于通过引用数据库的概念模式来建模数据库的静态关系和静态数据模型（数据库模式）。


    ### 加权链接 `[81]`

    是一种映射系统，通过配对关系数据库词汇与 SQL 子句之间权重最大的意义连接来工作。


    下文是对上述所有映射方法的解释，并说明为何选择第二种方法（增强 NLQ/SQL 对）作为最有效的方法，从而排除其他方法。

    '
