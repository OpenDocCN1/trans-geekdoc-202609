    knowledge to properly map NLQ tokens to the related RDB structure and contents.


    ![Figure 8 The two embedded mappers.](images/fig8_B.jpg)


    [Figure 8 The two embedded mappers.](#ch4.xhtml#R_fig8)


    In regard to unique RDB values, and since it’s a storage crisis to store all RDB
    values in a RAM or CACHE memory, only unique values and `PKs` and `FKs` will be
    stored in a mapping table. The unique values’ hosting attributes and tables will
    be specified, and a hashing function will be used to access them.


    For smaller RDBs (i.e., Zomato), and, as explained in [Table 3](#ch4.xhtml#table3),
    the mapping table is built using the Python dictionary `server.map` that finds
    associations between NLQ tokens and RDB elements that are often queried together.
    For larger RDBs (i.e., WikiSQL), data profiling is performed on RDB elements’
    statistics to automatically compile the mapping table. This compilation is based
    on which RDB elements are queried more often, and then stored in the mapping table
    as a hashing function. The mapping table is expressed as `mapping_table[unique_value]
    = corresponding_attribute`.


    [Table 3 Mapping table design options](#ch4.xhtml#R_table3)


    | RDB size || Example || Applied technique || Data used |

    | --- | --- | --- | --- |

    | Small | Zomato | Python dictionary `server.map` | Associations between NLQ tokens
    and RDB elements |

    | Large | WikiSQL | Data profiling | RDB elements’ statistics |


    Compared to the great value the mapping table adds to the algorithm’s accuracy,
    there would not be any significant overhead added by integrating a mapping table.
    Ye, the bigger the RDB the bigger the mapping table size, which affects resources
    usage in terms of storage capacity.


    ### Mapping NLQ Tokens into RDB Elements


    This unit matches NLQ tokens with RDB schema `MetaTables` (lexica list) to check
    for their existence. This unit also checks the general-purpose English language
    ontology (WordNet) for NLQ tokens’ synonyms and meanings. Before discussing the
    mapping algorithm itself, the RDB schema relationships, its lexica (tables’ and
    attributes’ names) and the conditional and operational expressions must be defined.


    First, relationships in the RDB schema will be defined and registered. Then, they
    will be matched with the NLQ verb. If the NLQ verb is unidentified or missing,
    the relationship between the NLQ tokens will be found through analysing the lexica
    intra-structure.


