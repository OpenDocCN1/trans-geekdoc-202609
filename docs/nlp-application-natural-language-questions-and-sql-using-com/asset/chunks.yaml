    The current implementation uses `MySQL DBMS` as a backend environment. The implementation
    testing uses two RDBs, `Zomato RDB` [[172](#reference.xhtml#refbm_172)] for algorithm
    testing, and `WikiSQL RDB` [[173](#reference.xhtml#refbm_173)] for algorithm validation.
    The testing process using a small RDB confirms the framework’s functionality,
    while the framework validation process evaluates the framework’s accuracy, efficiency
    and productivity.


    Results from both `Zomato` (small RDB) and `WikiSQL` (large RDB) will be compared
    based on the RDB size. [Table 11](#ch6.xhtml#table11) compares between the two
