  trans: '

    这些层使用知识库来辅助自然语言查询（NLQ）的 SQL 翻译过程。这方面的一个很好的例子是话语表示结构。这种结构使用基于本体的语义解释器作为中间语言表示层，将
    NLQ 转换为 SQL。话语整合分析 [22] 是对信息交换的研究，例如在对话中，句子的含义可能会根据前句或后句而改变。一个例子是句子中使用代词（如“他”），它取决于前一个句子中的主语或执行者。为了使话语分析过程足够彻底，必须对
    NLQ 标记进行标注。因此，标注者在这种方法中是至关重要的。


    ### 标注者


    标注是提供特定数据附加信息的元数据。自然语言数据集被称为语料库（corpus 的复数）。当一个语料库被标注时，它被称为被标注语料库。语料库用于训练机器学习算法（MLA）。标注类型包括：


    *   POS 标注（词性标注）。

    *   短语结构标注。

    *   依存法结构标注。


    在目前的研究工作中，上述所有的底层 NLP 层都被考虑并实现为 POS 识别模块的一部分，但中间语言表示层除外。使用的 POS 识别 Python 库是 `speech_recognition`。该模块对于彻底理解给定的
    NLQ 以实现正确准确的翻译至关重要。


    ## 消歧


    在目前的研究工作中，只有当映射器发现某个 NLQ 标记对应多个匹配的 RDB 元素时，才需要进行消歧。通常，词语含义的消歧有特殊的技巧和算法。一个例子是使用
    N-Gram 向量的统计关键词含义消歧过程 [33]，其中 N 的范围从 1 到文本长度。N-Gram 向量的统计数据使用英语训练语料库收集，而自定义语料库则在系统使用期间收集统计。后者语料库要求用户在提交执行之前，检查所提供的
    NLQ 解释并进行任何必要的更改。N-Gram 向量主要用于捕捉词汇上下文。它被认为是衡量给定标记在特定用户 NLQ 输入中具有特定含义概率的指标。这是因为每个标记的含义都取决于它所处的上下文。这种含义比较程序遵循向量相似性排名方法，含义排名越高，越接近真实含义。


    其他词语含义的消歧研究涉及计算语言学和统计语言理解。此类研究侧重于大型语料库中的词义消歧。另一种消歧词义的方法是使用词汇搭配。词汇搭配方法衡量了当多个词存在于同一个
    NLQ 中时，它们含义的概率。Iftikhar [34] 通过解析特定领域的英语 NLQ，并使用 Stanford 解析器 [21] 生成 SQL 查询，提出了一种解决消歧问题的方案。这种方法广泛应用于非结构化查询语言（NoSQL）数据库的自动查询和设计。


    Rajender [35] 使用受控的 NLIDB 接口并推荐了 SQL 查询功能，以减少 NLQ 输入中的歧义。这是因为领域歧义越小，系统产生的结果就越准确。同样可以帮助解决这种歧义的是
    RDB 元素之间的加权关系或链接 [36]。在这种方法中，每使用一次该特定关系，关系的权重就会增加一。因此可以确定关系权重越大，相关的 RDB 元素被查询得越频繁。这有助于
    NLIDB 系统为用户提供更智能的排序选项供其选择，其中最顶部的选项是概率最大的。


    在目前的研究工作中，NLQ 消歧不是重点。因此，通过应用 Stanford CoreNLP [21] 和 `nltk.corpus` Python 库 [37]
    使用了一个简单的 NLQ 消歧模块。这些工具仅用于检查 NLQ 的有效性。句法规则检查器也用于检查任何 NLQ 语法错误。采用的程序是交互式的，错误消息会弹出给用户，要求他们重新表述单词或从几个可能的拼写纠正中进行选择。实现了一个朴素贝叶分类器
    [38]，简单地将用户的响应分类为正面或否定（即是或否）。


    ## 匹配器/映射器


    匹配器/映射器模块被认为是 NLP 科学中最复杂的部分 [14]。因此，基于关键词的搜索吸引了许多研究者的关注，作为最简单的映射方法，因为关键词是可以显式识别的。研究人员利用它改进从数据库检索信息，并解决（或避免）理解
    NLQ 标记将其映射到底层数据库或模式模型的挑战 [39]。映射器可以是实体-属性-值（EAV）映射器 [40]、实体关系（ER）映射器 [13]，或可扩展标记语言（XML）文档映射器
    [41]。如果使用的数据库或模式模型是 EAV 或 ER，则 NLQ 被翻译为 SQL 查询。只有当使用的系统在底层信息系统中基于文档的数据模型时，NLQ
    才能转换为 XML 文档。


    在目前的研究工作中，采用的映射器除了 RDB 关系外是 EAV 映射器。NLQ 标记分别通过 NLQ 和 RDB 元表 `表 1](#2.xhtml#table1)`
    和 `2](#2.xhtml#table2)` 映射到 RDB 词汇表中。匹配的词汇随后将与 SQL 子句映射。这种映射使用了提的基于规则的算法，该算法基于稍后在
    `表 4](#4.xhtml#table4)`（位于第 4 章](#4.xhtml））中讨论的观测表。关于该模块的更多背景信息在第 3 章](#3.xhtml)
    文献综述中给出。

    '
