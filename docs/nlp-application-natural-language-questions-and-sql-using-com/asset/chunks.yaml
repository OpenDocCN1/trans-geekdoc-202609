    # Mapping RDB Lexica into SQL Clauses


    This mapping uses the proposed rule-based algorithm that is based on the assumptions
    table ([`Table 4`](ch4.xhtml#table4)).


    The first step is building the main SQL clauses, the `SELECT`, `FROM` and `WHERE`
    clauses. The attribute names will be fed into the `SELECT` clause. Hence, the
    `SELECT` keyword is appended with the table attributes. Attributes are identified
    by semantically analysing the Wh-word’s main noun phrase or head noun (main noun
    in a noun phrase). The `WHERE` keyword is mapped with the attribute-value pairs
    derived from the NLQ semantics. The `FROM` keyword is mapped with all involved
    tables’ names referenced in the `SELECT` and `WHERE` clauses. If there is more
    than one table, tables will be joined and added to the `FROM` clause. If there
    is a data retrieval condition, a `WHERE` clause will be added, and conditions
    will be joined as illustrated in [`PseudoCode 13](#appendix6.xhtml#box6_1)` ([`Appendix
    6`](appendix6.xhtml)).


    In this phase, the key mapping function is mapping SQL clauses and keywords with
    the NLQ identified lexica, and then building the SQL query. The tables list which
    tables names should be selected from must be identified. The list of relationships,
    attributes and values with their associated attributes should also be identified
    in the form (attribute, value).


    ## SQL template generator


    SQL formation is done in this stage. SQL components (i.e., tables’ names, fica
    hosting sources, attribute-value pairs, data retrieval conditions and relationships)
    are identified from the input NLQ and arranged in a proper sequence. The identified
    NLQ lexica, schema matching elements, and the identified operators (if any) are
    then fed into the SQL template generator to generate a proper SQL statement. SQL
    templates will be selected based on the numbers of identified tables, attributes
    and attribute-value pairs. After that, the system establishes a connection with
    the RDB to transfer SQLs to the RDBMS for execution.


    The RDB schema contains unique identifiers (e.g., `PKs` and `FKs`) list stored
    in a dependency table (the mapping table). This table uniquely identifies each
    instance of each attribute, and whether they are connected via a relationship
    with any other RDB elements. Each attribute’s unique identifier is added to the
    SQL query constraints to guarantee that only the particular information of interest
    is returned.


    The SQL templates list of `SELECT` statements considers possible SQLs depending
    on the NLQ question and desired answer using all input from previous steps. For
    NLQs with explicit `SELECT` parameters, the proposed assumptions-based system
    uses an investigative heuristic procedure to determine what parameters belong
    in which SQL slot. The parameters can be used either as query constraints (e.g.,
    `WHERE`, `IN`, etc.) if they already have values, or as part of the `SELECT` statement;
    if they need their values to be retrieved from the RDB. After that, the input
    values and necessary operators are used to construct the query constraints in
    the proper SQL template. An example of assigning a suitable operator for every
    `WHERE` conditional pair (attributes and values) is converting the NLQ string
    “equal” to the SQL keyword `LIKE` or the operator `=` or converting “smaller or
    equal” to the operator `<=`.


    In this work, only the following SQL main clauses are considered, in addition
    to other supplementary clauses (e.g., `AS`, `COUNT`, etc.):


    *   `SELECT`: identifies desired attributes to be retrieved according to the NLQ
    processor.

    *   `FROM`: identifies the tables where the `SELECT` attributes are from, or where
    the attribute are from.

    *   `WHERE`: identifies the conditions.

