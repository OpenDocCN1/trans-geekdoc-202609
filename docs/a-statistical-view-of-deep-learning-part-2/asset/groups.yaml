  - '[PAGE 13]


    # Regression model


    # Model


    $$y = \beta_0 + \beta_1 x + \epsilon \text{ where } \epsilon \sim N(0, \sigma^2)$$

    $$= f(x)$$


    # Fitted model


    $$\hat{y} = \hat{\beta}_0 + \hat{\beta}_1 x$$

    $$= \hat{f}(x)$$


    # Loss function


    $$\sum_{i=1}^n (y_i - \hat{y}_i)^2$$'
  - '[PAGE 14]


    # Regression model


    ![](img/357c1568568ec7942f9e3cf49122ebd5_14_0.png)'
  - '[PAGE 15]


    # # Nonparametric regression


    \(\widehat{y} = \widehat{f}(x) = \widehat{\beta}_0 + \sum_{k=1}^K \widehat{\beta}_k
    \overbrace{\sigma_k(x)}^{\text{function of } x}\)


    # ## Examples


    +   1. Polynomial regression


    \(\sigma_k(x) = x^k \text{ so } \widehat{f}(x) = \widehat{\beta}_0 + \widehat{\beta}_1
    x + \widehat{\beta}_2 x^2 + \cdots + \widehat{\beta}_K x^K\)


    +   2. Regression splines


    +   > A spline is a function that is constructed piece-wise from polynomial functions.


    +   > Apply a family of transformations to \(x, \sigma_1(x), \sigma_2(x), \dots,
    \sigma_K(x)\)'
  - '[PAGE 16]


    # Nonparametric regression


    A spline of degree $K$ is a function formed by connecting polynomial segments
    of degree $K$ so that:


    +   - the function is continuous,

    +   - the function has $K - 1$ continuous derivatives, and

    +   - the $K$th derivative is constant between knots.'
