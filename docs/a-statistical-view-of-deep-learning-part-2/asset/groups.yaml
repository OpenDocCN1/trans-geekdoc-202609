    \ 激活函数\n\n- **Sigmoid**\n\n  \\(\\sigma(x) = \\frac{1}{1+e^{-x}}\\)\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_0.png)\n\
    \n- **Leaky ReLU**\n\n  \\(max(0.1x, x)\\)\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_1.png)\n\
    \n- **tanh**\n\n  \\(\\tanh(x)\\)\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_2.png)\n\
    \n- **Maxout**\n\n  \\(max(w_1^T x + b_1, w_2^T x + b_2)\\)\n\n- **ReLU**\n\n\
    \  \\(max(0, x)\\)\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_3.png)\n\n-\
    \ **ELU**\n\n  \\(\\begin{cases} x & x \\ge 0 \\\\ \\alpha(e^x - 1) & x < 0 \\\
    end{cases}\\)\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_4.png)\n\n图片来源：medium.com\n\
    \n## 网络结构\n\n### ReLU（修正线性单元）激活函数\n\n\\(\\sigma(x) = \\max(0, x) = \\left\\{ \\\
    begin{array}{ll} 0 & \\text{for } x < 0 \\\\ x & \\text{for } x \\ge 0 \\end{array}\
    \ \\right.\\)\n\n### Softmax 激活函数\n\n- 用于输出层的分类问题\n- 输入：\\( x \\in \\Re \\)，输出：\\\
    ( 0 \\le \\sigma(x_i) \\le 1 \\)\n\n\\(\\sigma(x_i) = \\frac{\\exp(x_i)}{\\sum_{j=1}^J\
    \ \\exp(x_j)} \\quad \\text{for } i = 1, \\dots, J\\)\n\n## 网络结构\n\n### 在 Keras\
    \ 的 R 接口中定义网络模型\n\n```\nmodel <- keras_model_sequential()\nmodel %>%\n  layer_dense(units\
    \ = 256, activation = 'relu') %>%\n  layer_dense(units = 128, activation = 'relu')\
    \ %>%\n  layer_dense(units = 10, activation = 'softmax')\n```\n\n- 序列模型：神经网络层的线性堆叠\n\
    - layer_dense：全连接层\n- units：层中的节点数\n- 激活函数\n\nkeras.rstudio.com\n\n## 深度学习：模型拟合\n\
    \n### 回顾极大似然估计\n\n- 模型拟合的步骤\n  1. 定义网络结构\n  2. 选择损失函数\n  3. 选择优化器\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_36_0.png)\n\
    \n## 损失函数\n\n损失函数\n\n- 衡量网络的预测性能\n- 衡量最后一层的输出与观测值的接近程度\n- 必须是一个数值摘要\n\n模型拟合的目标：\n\
    \n找到使损失最小化的参数值（权重）\n\n## 损失函数\n\n均方误差：用于连续响应数据\n\n\\(\\frac{1}{n} \\sum_{i=1}^n(y_i\
    \ - \\hat{y}_i)^2\\)\n\n交叉熵（偏差）：用于分类响应数据\n\n\\(- \\sum_{i=1}^n \\sum_{g=1}^G y_{ig}\
    \ \\log(\\widehat{\\pi}_{ig})\\)\n\n对于具有以下特征的问题：\n\n- g = 1, ..., G 个类别\n- \\\
    (\\widehat{\\pi}_{ig} = \\) 观测值 i 属于第 g 个类别的预测概率\n\n## 损失函数\n\n选择与最终层（输出层）激活函数兼容的损失函数\n\
    \n| 任务 | 损失函数 | 最后一层激活函数 |\n| :--- | :--- | :--- |\n| 二分类 | 二元交叉熵 | Sigmoid |\n\
    | 多类，单标签分类 | 类别交叉熵 | Softmax |\n| 多类，多标签分类 | 二元交叉熵 | Sigmoid |\n| 回归到任意值 | 均方误差\
    \ (MSE) | 无 |\n| 回归到 0 到 1 之间的值 | MSE 或二元交叉熵 | Sigmoid |\n\n## 损失函数\n\n在 R Keras\
    \ 中，\n\n1. 设置模型（参见上文）。\n2. 使用合适的损失函数、优化器和指标编译模型。\n\n```\nmodel %>%\n  compile(\n\
    \    loss = 'categorical_crossentropy',\n    optimizer = optimizer_rmsprop(),\n\
    \    metrics = c('accuracy')\n  )\n```\n\nR keras 中的损失函数\n\n## 模型拟合\n\n### 模型拟合的步骤\n\
    \n1. 定义网络结构\n2. 选择损失函数\n3. 选择优化器\n\n## 模型拟合\n\n### 目标：\n\n- 找到使损失最小化的参数值（权重）\n\
    - 估计参数值 $\\beta, \\alpha, ...$\n\n### 模型拟合也称为\n\n- 计算机科学：训练模型\n- 统计学：估计参数\n- 数学：优化损失函数\n\
    \n## 模型拟合\n\n神经网络有**许多**未知参数（权重）。\n\n### 参数计数\n\n- 一个节点中有 p + 1 个参数\n  - p 个协变量加上截距（偏置）\n\
    \  - 参数：$(\\alpha_{k0}, \\alpha_{k1}, ..., \\alpha_{kp})$\n- 每层 k = 1, ..., K\
    \ 个节点加上截距：$(\\beta_{g0}, ..., \\beta_{gK})$\n- g = 1, ..., G 层\n\n总计 $K(p + 1)\
    \ + G(K + 1)$ 个参数\n\n## 模型拟合\n\n示例：\n\n- p = 100 个协变量\n- K = 128 个节点/层\n- G =\
    \ 5 层\n- 128(100 + 1) + 5(128 + 1) = 13,573 个参数\n\n含义：\n\n- 参数众多，且\n- 所有参数高度相关。\n\
    - 因此，你需要大量数据和一种特殊的方法来估计参数。\n\n## 优化\n\n- 最小化损失的一般方法是使用随机梯度下降\n  - 为权重分配初始值\n \
    \ - 计算损失函数对每个权重的偏导数\n  - 沿下降方向（梯度的反方向）迈出一步\n  - 重复直到权重收敛\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_45_0.png)\n\
    \n## 优化\n\n### 深度学习优化\n\n- 这是对优化的简要概述。\n- Goodfellow 等人编写的《Deep Learning》一书中有很好的概述\n\
    - Keras 中的优化器：SGD, RMSprop, Adagrad, Adadelta, Adam, Adamax, Nadam\n- 优化器概述\n\n\
    ## 优化：综合所有内容（2 层网络）\n\n- 输入 X\n- 权重\n- 层数据变换\n- 权重\n- 层数据变换\n- 权重更新\n- 预测值 Y'\n\
    - 真实目标 Y\n- 优化器\n- 损失函数\n- 损失分数\n\n## 深度学习：实践中的模型拟合\n\n## 实践中的模型拟合\n\n训练深度学习模型需要做出许多决策\n\
    \n你选择：\n\n- 模型架构\n- 损失函数\n- 优化方法\n- 所有这些工作原理的细节\n\n## 实践中的模型拟合\n\n### 需要调整的一些深度学习参数\n\
    \n- 隐藏层数量和单元数\n- 正则化\n- 迭代次数和批量大小\n- 一般实践建议\n\n## 隐藏层数量和单元数\n\n宽度\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_51_0.png)\n\
    \n深度\n\n## 隐藏层数量和单元数\n\n### 多少层？\n\n- 旧策略：一层足够\n  - 通用逼近定理：一个隐藏层足以以任意精度表示任何函数的近似\n\
    \  - 理论与实践！\n- 当前建议\n  - 从具有一个或两个隐藏层且包含大量单元的网络开始\n  - 如果性能不佳且已调试，请尝试深度学习\n\n##\
    \ 欠拟合和过拟合\n\n### 简单示例\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_53_0.png)\n\n\
    欠拟合\n\n良好拟合/鲁棒\n\n过拟合\n\n图片来源：medium.com\n\n## 欠拟合和过拟合\n\n### 过拟合：\n\n- 结果无法推广到训练集之外\n\
    - 解决方案：获取更多训练数据或使用正则化\n\n### 欠拟合：\n\n- 结果无用\n- 解决方案：调整模型结构或模型拟合设置\n\n## 正则化\n\n\
    <- 欠拟合\n\n过拟合 ->\n\n最佳拟合\n\n测试误差\n\n训练误差\n\n误差\n\n模型\"复杂度\"\n\n图片来源：www.analyticsvidhya.com\n\
    \n"
