    \nError: 0.089235, Steps: 146\n\n## Statistics versus neural network terminology\n\
    \n| Statistics | Neural Networks |\n|---|---|\n| model | network, graph |\n| fitting\
    \ | learning, training |\n| coefficient, parameter | weight |\n| predictor, variable\
    \ | input, feature |\n| predicted response | output |\n| observation | exemplar\
    \ |\n| parameter estimation | training or learning |\n| steepest descent | back-propagation\
    \ |\n| intercept | bias term |\n| derived predictor | hidden node |\n| penalty\
    \ function | weight decay |\n\n## Neural networks in deep learning\n\n### Simple\
    \ Neural Network\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_8_0.png)\n\n### Deep\
    \ Learning Neural Network\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_8_1.png)\n\
    \n\U0001F534 Input Layer\n\n\U0001F7E1 Hidden Layer\n\n\U0001F535 Output Layer\n\
    \n## Some mathematics of neural networks\n\n## Opening the black box of deep learning\n\
    \n![](img/357c1568568ec7942f9e3cf49122ebd5_10_0.png)\n\n## Overview\n\nKey idea:\
    \ Neural networks are merely regression models with transformed predictors\n\n\
    Consider the following progression of models:\n\n- Regression model\n- Nonparametric\
    \ regression model\n- Neural network model\n- Deep learning model\n\n## Regression\
    \ model\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_12_0.png)\n\n## Regression\
    \ model\n\n### Model\n\n$$y = \\beta_0 + \\beta_1 x + \\epsilon \\text{ where\
    \ } \\epsilon \\sim N(0, \\sigma^2)$$\n$$= f(x)$$\n\n### Fitted model\n\n$$\\\
    hat{y} = \\hat{\\beta}_0 + \\hat{\\beta}_1 x$$\n$$= \\hat{f}(x)$$\n\n### Loss\
    \ function\n\n$$\\sum_{i=1}^n (y_i - \\hat{y}_i)^2$$\n\n## Regression model\n\n\
    ![](img/357c1568568ec7942f9e3cf49122ebd5_14_0.png)\n\n## Nonparametric regression\n\
    \n\\(\\widehat{y} = \\widehat{f}(x) = \\widehat{\\beta}_0 + \\sum_{k=1}^K \\widehat{\\\
    beta}_k \\overbrace{\\sigma_k(x)}^{\\text{function of } x}\\)\n\n### Examples\n\
    \n- 1. Polynomial regression\n\n\\(\\sigma_k(x) = x^k \\text{ so } \\widehat{f}(x)\
    \ = \\widehat{\\beta}_0 + \\widehat{\\beta}_1 x + \\widehat{\\beta}_2 x^2 + \\\
    cdots + \\widehat{\\beta}_K x^K\\)\n\n- 2. Regression splines\n\n> A spline is\
    \ a function that is constructed piece-wise from polynomial functions.\n\n> Apply\
    \ a family of transformations to \\(x, \\sigma_1(x), \\sigma_2(x), \\dots, \\\
    sigma_K(x)\\)\n\n## Nonparametric regression\n\nA spline of degree $K$ is a function\
    \ formed by connecting polynomial segments of degree $K$ so that:\n\n- the function\
    \ is continuous,\n- the function has $K - 1$ continuous derivatives, and\n- the\
    \ $K$th derivative is constant between knots.\n\n## Nonparametric regression\n\
    \n### Simple spline regression\n\nMoving window: \\(\\hat{y}\\) is the average\
    \ of the \\(y\\)’s for nearby \\(x\\) values or a weighted average (kernel smoothing)\n\
    \n![](img/357c1568568ec7942f9e3cf49122ebd5_17_0.png)\n\n## Nonparametric regression\n\
    \nBasis functions: every continuous function can be represented as a linear combination\
    \ of basis functions.\n\nMore advanced spline functions: basis splines\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_18_0.png)\n\
    \n## Nonparametric regression\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_19_0.png)\n\
    \nkey   df = 100   df = 3\n\n## Nonparametric regression\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_20_0.png)\n\
    \n## Nonparametric regression\n\nThe weaknesses of this approach are:\n\n- The\
    \ basis is fixed and independent of the data\n- If there are many predictors,\
    \ this approach doesn't work well\n- If the basis doesn't ‘agree’ with true f,\
    \ then K will have to be large to capture the structure\n- What if parts of f\
    \ have substantially different structure?\n\nAlternative approach: the data **tell**\
    \ us what kind of basis to use\n\n## Neural network model\n\nKey idea: think of\
    \ a neural network as a multiple regression model with transformed predictors\n\
    \nExample: One-layer neural network model with \\( K \\) hidden nodes \\( \\sigma_1(x),\
    \ \\sigma_2(x), \\dots, \\sigma_K(x) \\) and 3 predictors \\( (x_1, x_2, x_3)\
    \ \\)\n\n```\ny = \\beta_0 + \\beta_1 \\sigma_1(\\alpha_{10} + \\alpha_{11}x_1\
    \ + \\alpha_{12}x_2 + \\alpha_{13}x_3)\n+ \\beta_2 \\sigma_2(\\alpha_{20} + \\\
    alpha_{21}x_1 + \\alpha_{22}x_2 + \\alpha_{23}x_3)\n+ \\quad \\dots\n+ \\beta_K\
    \ \\sigma_K(\\alpha_{K0} + \\alpha_{K1}x_1 + \\alpha_{K2}x_2 + \\alpha_{K3}x_3)\
    \ \\quad \\text{function of } x\n```\n\n## Deep Learning Model\n\n### Neural network\
    \ model\n\n\\( y = \\beta_0 + \\sum_{k=1}^K \\beta_k \\sigma_k(\\alpha_{k0} +\
    \ \\alpha_{k1}x_1 + \\alpha_{k2}x_2 + \\alpha_{k3}x_3) \\)\n\n### Two-layer \"\
    deep\" learning model\n\n\\(\\hat{y} = \\hat{f}(x) = \\hat{\\beta}_0 + \\sum_{k=1}^K\
    \ \\hat{\\beta}_k \\sigma_k(\\alpha_{k0}+\\alpha_{k1}x_1 + \\alpha_{k2}x_2 + \\\
    alpha_{k3}x_3))\\)\n\nReplace each of these predictors with another neural network\
    \ model\n\n## Illustration of a deep learning model\n\nImage: Deep Learning, Fig\
    \ 1.2\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_24_0.png)\n\nCAR\n\nPERSON\n\
    \nANIMAL\n\nOutput (object identity)\n\n3rd hidden layer (object parts)\n\n2nd\
    \ hidden layer (corners and contours)\n\n1st hidden layer (edges)\n\nVisible layer\
    \ (input pixels)\n\n## A Statistical View of Deep Learning in Ecology\n\n### Part\
