    ### 第 1 部分：简介\n\n- 机器学习简介\n- 深度学习简介\n\n### 第 2 部分：深入探讨\n\n- 从三个视角看神经网络\n- 深度学习的数学\n\
    - 模型拟合\n- 深度学习模型的类型\n\n### 第 3 部分：深度学习实践\n\n- 深度学习中的伦理\n- 生态学中的深度学习\n\n## 深度学习：模型拟合\n\
    \n## 深度学习软件\n\n- Python\n  - 深度学习最流行的语言\n  - 面向对象的高级编程语言\n  - 主要包：TensorFlow,\
    \ PyTorch, Keras，...\n  - 你需要学习 Python 吗？也许\n\n- Keras\n  - 用 Python 编写的开源神经网络库。\n\
    \  - Keras 包是一个 API。\n  - API（应用程序编程接口）允许多个软件包进行交互。\n  - Keras 可以与以下软件交互：\n  \
    \  TensorFlow, Microsoft Cognitive Toolkit, R, Theano, PlaidML\n\n## Caret 包中的神经网络模型\n\
    \n- 1. 神经网络模型：nnet, mxnet, mxnetAdam, neuralnet 等\n\n- 2. 堆叠自动编码器深度神经网络\n\n- 3.\
    \ 许多其他选项\n\n### R 包：keras 和 kerasR\n\n- Python 深度学习包 Keras 的接口\n\n- Rstudio 的\
    \ keras 页面\n\n- 当它访问的任何包更新时，可能会出现 bug\n\n## 深度学习：模型拟合\n\n- 模型拟合的步骤\n- 1. 定义网络结构\n\
    - 2. 选择损失函数\n- 3. 选择优化器\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_29_0.png)\n\
    \n![](img/357c1568568ec7942f9e3cf49122ebd5_29_1.png)\n\n"
