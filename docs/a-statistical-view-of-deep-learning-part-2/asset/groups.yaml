  mdcn: "\n\n## 深度学习统计视角 第 2 部分\n\nJennifer Hoeting, 科罗拉多州立大学\n\n## 生态学中的深度学习统计视角\n\
    \n### 第 1 部分：简介\n\n- 机器学习简介\n- 深度学习简介\n\n### 第 2 部分：深入探讨\n\n- 从三个视角看神经网络\n- 深度学习的数学\n\
    - 模型拟合\n- 深度学习模型的类型\n\n### 第 3 部分：深度学习实践\n\n- 深度学习中的伦理\n- 生态学中的深度学习\n\n## 从三个视角看神经网络\n\
    \n**神经网络：** 允许计算机从数据中学习的算法\n\n**深度学习：** 多层神经网络\n\n## 从多个视角介绍神经网络\n\n### 神经网络\n\
    \n- 作为黑箱\n- 作为统计模型\n- 在深度学习中\n\n## 作为黑箱算法的神经网络\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_4_0.png)\n\
    \n图片来源：www.learnopencv.com\n\n## 作为统计模型的神经网络\n\n目标：提取输入的线性组合作为派生特征，然后将目标建模为这些特征的非线性函数\n\
    \n### 翻译为统计学：\n\n- 对响应变量和预测变量拟合非线性模型\n- 预测变量使用多变量技术进行转换\n\n### 神经网络是一个非线性模型\n\n\
    ## 作为统计模型的神经网络\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_6_0.png)\n\n错误：0.089235，步骤：146\n\
    \n## 统计术语与神经网络术语对比\n\n| 统计学 | 神经网络 |\n|---|---|\n| 模型 | 网络，图 |\n| 拟合 | 学习，训练 |\n\
    | 系数，参数 | 权重 |\n| 预测变量，变量 | 输入，特征 |\n| 预测响应 | 输出 |\n| 观测值 | 样例 |\n| 参数估计 | 训练或学习\
    \ |\n| 最陡下降 | 反向传播 |\n| 截距 | 偏置项 |\n| 派生预测变量 | 隐藏节点 |\n| 惩罚函数 | 权重衰减 |\n\n## 深度学习中的神经网络\n\
    \n### 简单神经网络\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_8_0.png)\n\n### 深度学习神经网络\n\
    \n![](img/357c1568568ec7942f9e3cf49122ebd5_8_1.png)\n\n\U0001F534 输入层\n\n\U0001F7E1\
    \ 隐藏层\n\n\U0001F535 输出层\n\n## 神经网络的一些数学\n\n## 揭开深度学习黑箱的面纱\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_10_0.png)\n\
    \n## 概述\n\n核心思想：神经网络只是带有转换预测变量的回归模型\n\n考虑以下模型的演进：\n\n- 回归模型\n- 非参数回归模型\n- 神经网络模型\n\
    - 深度学习模型\n\n## 回归模型\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_12_0.png)\n\n\
    ## 回归模型\n\n### 模型\n\n$$y = \\beta_0 + \\beta_1 x + \\epsilon \\text{ where } \\\
    epsilon \\sim N(0, \\sigma^2)$$\n$$= f(x)$$\n\n### 拟合模型\n\n$$\\hat{y} = \\hat{\\\
    beta}_0 + \\hat{\\beta}_1 x$$\n$$= \\hat{f}(x)$$\n\n### 损失函数\n\n$$\\sum_{i=1}^n\
    \ (y_i - \\hat{y}_i)^2$$\n\n## 回归模型\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_14_0.png)\n\
    \n## 非参数回归\n\n\\(\\widehat{y} = \\widehat{f}(x) = \\widehat{\\beta}_0 + \\sum_{k=1}^K\
    \ \\widehat{\\beta}_k \\overbrace{\\sigma_k(x)}^{\\text{function of } x}\\)\n\n\
    ### 示例\n\n- 1. 多项式回归\n\n\\(\\sigma_k(x) = x^k \\text{ so } \\widehat{f}(x) = \\\
    widehat{\\beta}_0 + \\widehat{\\beta}_1 x + \\widehat{\\beta}_2 x^2 + \\cdots\
    \ + \\widehat{\\beta}_K x^K\\)\n\n- 2. 回归样条\n\n> 样条是由多项式函数分段构建的函数。\n\n> 对 \\(x,\
    \ \\sigma_1(x), \\sigma_2(x), \\dots, \\sigma_K(x)\\) 应用一组转换\n\n## 非参数回归\n\n次数为\
    \ $K$ 的样条是通过连接次数为 $K$ 的多项式片段形成的函数，使得：\n\n- 该函数是连续的，\n- 该函数有 $K - 1$ 个连续导数，并且\n\
    - $K$ 阶导数在节点之间是常数。\n\n## 非参数回归\n\n### 简单样条回归\n\n移动窗口：\\(\\hat{y}\\) 是附近 \\(x\\\
    ) 值的 \\(y\\) 的平均值或加权平均值（核平滑）\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_17_0.png)\n\
    \n## 非参数回归\n\n基函数：每个连续函数都可以表示为基函数的线性组合。\n\n更高级的样条函数：基样条\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_18_0.png)\n\
    \n## 非参数回归\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_19_0.png)\n\n关键   df =\
    \ 100   df = 3\n\n## 非参数回归\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_20_0.png)\n\
    \n## 非参数回归\n\n这种方法的弱点在于：\n\n- 基函数是固定的，与数据无关\n- 如果预测变量很多，这种方法效果不好\n- 如果基函数与真实 f\
    \ 不“匹配”，那么 K 必须足够大才能捕捉结构\n- 如果 f 的部分具有显著不同的结构怎么办？\n\n替代方法：数据 **告诉** 我们该使用什么样的基函数\n\
    \n## 神经网络模型\n\n核心思想：将神经网络视为带有转换预测变量的多元回归模型\n\n示例：带有 \\( K \\) 个隐藏节点 \\( \\sigma_1(x),\
    \ \\sigma_2(x), \\dots, \\sigma_K(x) \\) 和 3 个预测变量 \\( (x_1, x_2, x_3) \\) 的单层神经网络模型\n\
    \n```\ny = \\beta_0 + \\beta_1 \\sigma_1(\\alpha_{10} + \\alpha_{11}x_1 + \\alpha_{12}x_2\
    \ + \\alpha_{13}x_3)\n+ \\beta_2 \\sigma_2(\\alpha_{20} + \\alpha_{21}x_1 + \\\
    alpha_{22}x_2 + \\alpha_{23}x_3)\n+ \\quad \\dots\n+ \\beta_K \\sigma_K(\\alpha_{K0}\
    \ + \\alpha_{K1}x_1 + \\alpha_{K2}x_2 + \\alpha_{K3}x_3) \\quad \\text{function\
    \ of } x\n```\n\n## 深度学习模型\n\n### 神经网络模型\n\n\\( y = \\beta_0 + \\sum_{k=1}^K \\\
    beta_k \\sigma_k(\\alpha_{k0} + \\alpha_{k1}x_1 + \\alpha_{k2}x_2 + \\alpha_{k3}x_3)\
    \ \\)\n\n### 两层“深度”学习模型\n\n\\(\\hat{y} = \\hat{f}(x) = \\hat{\\beta}_0 + \\sum_{k=1}^K\
    \ \\hat{\\beta}_k \\sigma_k(\\alpha_{k0}+\\alpha_{k1}x_1 + \\alpha_{k2}x_2 + \\\
    alpha_{k3}x_3))\\)\n\n将每个预测变量替换为另一个神经网络模型\n\n## 深度学习模型示意图\n\n图片：深度学习，图 1.2\n\n\
    ![](img/357c1568568ec7942f9e3cf49122ebd5_24_0.png)\n\n汽车\n\n人\n\n动物\n\n输出（对象身份）\n\
