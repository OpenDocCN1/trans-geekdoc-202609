  md: '# Types of Deep Learning Models


    # Bayesian networks


    +   - Can be any of the above (e.g., Bayesian convolutional network)

    +   - Pros: estimate uncertainty

    +   - Cons: slow to compute

    +   - Variational Bayes is a current approach for inference

