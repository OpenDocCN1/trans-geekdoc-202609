  md: '# Epochs and Batch Size


    To deal with large data sets, deep learning optimization algorithms break up the
    data into subsets.


    # Model fitting options:


    +   * Batch size: # of training samples to work through before updating the model

    +   * Epoch: number of complete passes through the data set

    +   * Validation split: Fraction of the training data to be used as validation
    data per epoch.'
