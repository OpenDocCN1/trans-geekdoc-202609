- pgno: 33
  md: "# # Activation Functions\n\n+   **Sigmoid**\n+   \n+   \\(\\sigma(x) = \\frac{1}{1+e^{-x}}\\\
    )\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_0.png)\n\n+   **Leaky ReLU**\n\
    +   \n+   \\(max(0.1x, x)\\)\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_1.png)\n\
    \n+   **tanh**\n+   \n+   \\(\\tanh(x)\\)\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_2.png)\n\
    \n+   **Maxout**\n+   \n+   \\(max(w_1^T x + b_1, w_2^T x + b_2)\\)\n\n+   **ReLU**\n\
    +   \n+   \\(max(0, x)\\)\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_3.png)\n\
    \n+   **ELU**\n+   \n+   \\(\\begin{cases} x & x \\ge 0 \\\\ \\alpha(e^x - 1)\
    \ & x < 0 \\end{cases}\\)\n\n![](img/357c1568568ec7942f9e3cf49122ebd5_33_4.png)\n\
    \nImage source: medium.com"
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Network structure


    # ReLU (Recticulated Linear Unit) activation function


    \(\sigma(x) = \max(0, x) = \left\{ \begin{array}{ll} 0 & \text{for } x < 0 \\
    x & \text{for } x \ge 0 \end{array} \right.\)


    # Softmax activation function


    +   - Used for classification problems on the output layer

    +   - Input: \( x \in \Re \), output: \( 0 \le \sigma(x_i) \le 1 \)


    \(\sigma(x_i) = \frac{\exp(x_i)}{\sum_{j=1}^J \exp(x_j)} \quad \text{for } i =
    1, \dots, J\)'
  merge: -1
  img_proc: true
