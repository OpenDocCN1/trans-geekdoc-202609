    一年年前，当他向公众展示新视频的计划失败时，进展并不顺利。他想：“难道我必须做所有这些工作，然后寻找地方来展示它吗？”接着，他在 NFT 基金组织的朋友要求他提交一些作品。他并不认为这很有创意，但他还是把它放到了网站上，因为他认为互联网是获取更多流量的好方法。它将以
    1,250 美元的价格产生一种动态的、动感色彩心态的罗夏墨测试。从那以后，他已经在同一价位共投放了 10 件作品。现在他想知道是否能成为一个自给自足的痛苦者。这实际上触动了我的世界观。在这个例子中，它真的让我回到了像艺术家的思考；当我看到自己创作的作品时，我能找到一个它可以产生影响的背景和场所。


    知名的创意且思想开放的当代艺术家也正获得 NFT 收藏家的认可。在当今世界，具有旋转 3D 场景、饱和色调板和幽默漫画的图形层出不穷。随着在 `Instagram`
    应用中长大的年轻一代以及对法币完全不熟悉的大众，这些互联网审美正在吸引现在和 `Twitter` 推馈客户的关注。金融科技是朋克人的事。街头艺术和反体制风格有助于向他人传达，那些金融科技客户在主流眼中仅仅是朋克。


    对于传统世界的人来说，这是一个好消息，因为他们不再担心自己在市场上的地位。A, 一位位于纽约的收藏家。我们正处于一个转折性的分水岭：这一人口的兴趣和精神精力远低于互联网初期。竞争对手拍卖行佳士得（Christie''s）证明了，即使其他实力巨头无法掌握艺术家的财务利益，Pak
    也理解了音乐流派。


    在缺乏主流机构支持的情况下，各年龄段的艺术家正在紧密的、由 `NFT` 运营的单一社区中进行协作生产，这呼应了过去运动中的艺术家，并从彼此以及不同代人那里获得反馈，这影响了他们的思考、方法和产出。在数字艺术和设计领域，这是一种完全无私的精神。主要地在独立音乐和纯艺术领域，人们有一种信念，除非一个人主导一切，否则项目就会失败。大家觉得每个人都能从中获益。


    存在小鱼和大鲸鱼共同迁移的情况。事实这是一个价值 6,900 万美元的个人收藏小组，名为 `Metapurse`，是两位新加坡投资者，他们正在探索基于尖端技术的合资模式。1
    月，这两位购买了 20 件 `Beeple` 艺术，免费在虚拟画廊中对其进行分类，并将业务分为 5,400 个代币的集合。这些概念到 3 月 16 日的价值增加了六倍。据推测，团队将把最新的头条新闻收购作品展示在一个先进的虚拟博物馆中。这是将艺术和创意世界带到每个人的门口。


    对于艺术家、投机者和收藏家来说，`NFT` 市场也有阴暗面。由于准入门槛高且需要技术专业知识，一些创作者可能会选择不参与其中。许多人担心有肤色的年轻艺术家将在“传统白人”的艺术世界中被边缘化。法律界正关注对这一新发展的理解，因为艺术家的作品在未经许可的情况下被复制和出售。这为人们提供了从他人作品中获利的新机会。


    最后，还需要考虑环境问题。创建 `NFTs` 使用了大量的计算能力，许多服务器运行在化石燃料上。加密货币专家警告说，“区块链分布式账本技术对环境的影响是巨大的”，尽管纽约大学的一位视觉艺术副教授对他们的评估深信不疑。


    区块链对气候未来的影响较小。例如，他们已经在发现 `NFT` 技术的新用途。例如，有些人已经为此付费了。

