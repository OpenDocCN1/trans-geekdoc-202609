    It is evident that the value of bitcoin cannot be realized through democracy since
    it is subject to market forces, and this can impact our social objectives. However,
    any new crypto-currency could possibly implement more egalitarian monetary policies,
    financial and governance models.


    So what if a "digital currency" could make a real contribution to those social
    issues, e.g., inclusive culture, equal opportunity, or mutualism; wouldn''t those
    be positive contributions?" With the rise of virtual currencies, such as bitcoin,
    the pace of innovation in the crypto-currency space has picked up.


    These factors influence the effectiveness of money in bringing about social and
    environmental change, whether it be through political ideology, the economic environment,
    community aspiration, or individual desire. In cases where a local currency could
    be created to build a more resilient local economy and enhance socioeconomic well-being,
    an investigation into a national currency must be undertaken. When the current
    economic system falters, one can see such symptoms as an increase in social divisions,
    higher crime, decreased physical well-being, low social participation, and an
    absence of a sense of community.


    #  CHAPTER FOUR


    ##  Block chain - for Normal People


    Traditionally, a transaction requires an intermediary to act as a go-between.
    Assuming that Rob wants to transfer $20 to Melanie, let''s assume that he would
    have to give her $10 worth of bitcoin. He can either give her £20 in cash or transfer
    it to her account via an app of his choice. In both cases, a bank is an institution
    that verifies a transaction: One is with a physical withdrawal, the other is with
    an app. It is up to the bank to decide whether the transaction is done. The bank
    updates all transactions pertaining to Rob whenever he pays or receives money.
    or in other words, the ledger is held and controlled by the bank.


    Without being completely confident in his banker, Rob would not risk his money.
    He needs to feel confident that the bank will not take advantage of him, or that
    he''ll lose his money, that he won''t be robbed, and that it won''t disappear
    without warning tomorrow morning. Even in the financial crisis of 2008, when banks
    were proven to be irresponsible, the government preferred to rescue them and risk
    the total destruction of trust.


    Another thing about blockchains is that is essential to know is that they are
    entirely decentralized. There is no central authority like a bank, there are no
    deposit boxes, and balances are distributed across all participants. Rather, each
    node stores a complete ledger is on its own hard drive. Nodes on the network that
    have the same ledger are connected by software known as a peer-to-to-peer (P2P)
    client, which ensures everyone has the latest version of the ledger at any given
    time.


    State-of-of-the-the-the-the-art cryptographic technology is used to encode each
    new transaction as it is entered. Once the transaction is encrypted, it is known
    as a block, and it''s equivalent to a collection of various transactions. That
    block is then sent throughout the computer network of nodes, where it is verified,
    and once verified, added to the previous list of blocks. The ''chain'' is known
    as a large network of multiple, linked computers, and therefore the tech is called
    a ''blockchain'' by default.


    Once the transaction has been recorded in the system, it can be finished. Basically,
    this is how cryptocurrency transactions like Bitcoin work.


    Accountability and the removal of trust


    This system has many advantages over banking or a central clearing system, doesn''t
    it? It seems unlikely that Rob would use normal currency instead, doesn''t it?


    Let''s put it this as simply as we can: "The answer is trust." Rob must know that
    his bank will protect his money and safeguard it because of the nature of his
    business. Additionally, large regulatory systems are created to ensure that banks
    are working efficiently. If you want something done right, do it yourself. The
    role of the Financial Services Authority is to prevent this type of mess from
    happening in the first place. Many banks have made many mistakes in the past,
    but we have also seen this time and time and time again. Power can easily be abused
    when you have a single source of authority. The trust between people and financial
    institutions is uncertain and tenuous: we distrust each other, but not one another.


    Blockchain systems, however, require you to have zero faith in them. All transactions
    (or blocks) must be verified by the network, and committed to the ledger is a
    single point of failure, and an open record of each transaction process is shared
    by all nodes. To hack the ledger on a blockchain, an attacker would have to take
    control of hundreds of thousands of nodes at the same time, an exceptionally difficult
    task. A system or network hacker would also need to be able to shut down all the
    computer systems distributed across the world.


    One factor that must be considered in creating security is the encryption process
    itself. Decentralized verification processes like the Bitcoin''s are purposefully
    designed to make it difficult to tamper with. Verification is avoided in the case
    of Bitcoin because of the processor- and time-intensive calculations required,
    such as puzzles or complex mathematical formulas. Completing the resource validation
    process gets you some Bitcoins and a transaction fee. People will be motivated
    to join the network, as there is a strong requirement for fast and capable computers
    as well as electricity in order to run this, and money will be made. This is called
    "mining" because it requires a lot of effort (for the machine, in this case).
    In addition, transactions are verified as independent as far as possible in the
    hands of the government.


    This decentralization, democratic, and highly secure nature of blockchains mean
    that they can operate without any government intervention (they''re self-regulating),
    but because of it, they''re also unregulated (unregulated), participatory, and
    mysterious (decentral and clever). Work that,  will be in the spite of fact having
    reason that people do not trust each other.


    Wait includes the reasoning that you must understand, and you may have sense of
    being excited about blockchain will begin to set in.


