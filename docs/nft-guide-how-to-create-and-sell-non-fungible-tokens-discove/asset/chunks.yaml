  trans: '


    敌人是指那些能够通过了解你的加密秘密来获利的人，无论是个人、组织、商业竞争对手、敌人、骗子还是行政部门。一个坚定的对手拥有大量的“脑力”和资产。最好的保护并不是针对敌人（这很难实现），而且此外，它优于最坚决的竞争对手！


    键盘记录器（key logger）是一种记录每一次按键击字输入的程序或设备。这是破坏基于密钥的框架利用的最佳方法。由于它们体积小、以隐蔽模式工作，并且很容易从网上下载，编写的键盘记录器程序非常常见。先进的键盘记录器可以在目标机器上无声息地运行，并将记录的信息发送给启动安全检查期间的客户端。按键观察与每一个人类动作一样，可能有用，也可能有害，取决于检查的原因。密码、用户名、身份验证详情、MasterCard
    详情和加密都是通过控制台传输到达 PC 电脑（如输入所示）的机密数据典型实例。


    我们将利用上一个描述中的模型。想象你拥有非常棒的钥匙，但没有锁，也没有可以干涉的锁匠。你的窗户和门门都被封锁了。总而言之，入侵者如何在不使用车辆撞破正门的情况下进入你的家？敌人可以通过移除屋顶的几英处材料进入你的家。这是一场抢劫（弱点）。每个系统、组织和个人中都存在漏洞。


    毕竟，这并不那么困难。如果你能理解本节中展示的内容，恭喜你具备了加密素养（占所有电脑用户总数的少于 1%）。如果你不信我，试着将你新学的知识应用到你的银行家或计算机专业朋友身上。


    “人类所有知识的总和是一个质数，”Stan Secrets 说道。


    “人类所有智慧的总和不是质数，”推论说道。


    # 第六章


    ## 加密货币在未来会被使用吗？


    未来的货币面貌会是什么样？想象进入一家餐厅，在数字菜单板上看到你最喜欢的套餐餐。它的价格不是 8.99 美元，而是列为 `.009 BTC`。


    加密货币真的能成为未来的货币吗？问题的答案取决于对从性能到安全和监管等许多关键问题的广泛共识。


    让我们看看（数字）货币的两面，看看传统的法币如何与加密货币相互作用。


    ### 第一个最重要的因素是信任


    人们应该对花费的钱充满信心。什么了美元的价值？是真实的黄金吗？自 20 世纪 70 年代以来，美元不再由黄金支撑。那么是什么赋予了美元或其他法币价值？某些货币被认为比其他货币更稳定。人们对发行该货币的政府的依赖（政府确保其“价值”）才是关键。


    由于比特币仍然是分布式的，没有发行硬币的治理机构；信任是如何工作的？比特币存储在 `blockchain` 中，这是一种在线会计账，允许世界上的任何人查看每笔交易。矿工（点点网络中的计算机用户）验证这些交易中的每一笔以防止欺诈并确保资金不重复。矿工因他们保证的每笔交易获得报酬，以换取维护
    `blockchain` 完整性的服务。由于有这么多矿工试图赚钱，他们会互相检查工作以发现错误。由于工作流的证据，`blockchain` 从未被黑客破解。这种信任实际上赋予了比特币价值。


    ### 让我们看看安全性，它是信任的好朋友


    如果我的银行被抢劫或我的信用卡被滥用会怎样？我的银行账户受到联邦存款保险公司 (`FDIC`) 的保护。我的银行可能会扣除我未批准的信用卡费用。这并不是说犯罪分子无法产生至少令人沮丧和耗时的影响。只要知道我方面的任何错误很快就会被完全弥补，这几乎可以让人安心。


    当涉及到在加密货币中储蓄资金时，你有许多其他选择。注意，你的交易所受保护。知名的交易平台如 `Binance` 和 `Coinbase` 有解决客户问题的历史。同样，世界各地有匿名银行，也有匿名加密货币交易。


    如果我把一张 20 美元钞丢进火里会怎样？加密货币也是如此。如果我丢失了欺诈或高级登录交易，我就无法获得那些硬币。我怎么强调都不为，与信机构合作是如此重要。


    ### 扩展性


    当我们继续进行时，面临的下一个问题是扩展性。目前，这可能是监管大规模 `blockchain` 交易的人面临的主要难题。在交易速度方面，法币比加密货币快得多。`Visa`
    每秒可以处理高达 40,000 笔交易。在正常情况下，`Blockchain` 每秒可以处理最多 10 笔交易。另一个游戏正在进行中，它将增长到每秒 60,000
    个位置。众知的 `Lightning Network` 可以引入加密现金期货。


    如果不提到通知，对话将结束。人们拥有共同银行业和消费习惯的趋势是什么？钱无疑很容易地将其大部分能量投入到那些喜爱它的人身上。如果你需要预订房屋或租车，你需要一张
    `Visa`。为了方便、安全和奖励，我无论去哪里都会带上我的 `Visa`。


    你的意思是加密货币世界中也有提供这些服务的组织吗？摩纳哥目前提供 `Visa` 信用卡，可以将你的优质货币转换为当地货币。


