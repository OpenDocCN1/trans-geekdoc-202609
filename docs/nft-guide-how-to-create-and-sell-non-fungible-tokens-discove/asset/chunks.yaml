  trans: '

    例如，美国目前发生的情况如下。美国国税局（IRS）在 2014 年决定，“可转换虚拟货币”（如比特币）将被视为财产。由于这一决定，使用信用卡支付的购买将面临资本利得（或亏损）和投资税处理，并需遵守所有相关的报告要求。鉴于许多零售商现在都接受信用卡作为支付方式，IRS
    要求每个人在使用信用卡时必须完成以下操作：


    • 记录你花费了多少钱

    • 为所花费的硬币分配成本基准。

    • 从花费硬币的成本基准中减去实际支付的价格。

    • 通知 IRS 差异，并根据购买硬币的日期计算资本利得或损失。


    这些信息包含在你的年度纳税表中，你必须支付应税额或申报资本亏损。消费者对“支付方式”的选择产生了这一切工作。这被许多分析师和评论员称为令人望而畏的、疯狂的泥潭。想象一下如果你每天用比特币作为支付方式买两杯咖啡，将会面临怎样的噩梦。你可能需要整支会计师军。


    在美国还会额外的问题，因为四个部门想要以各自独特的方式处理信用卡（CCs）：


    • 商品期货交易委员会（CFTC）将信用卡归类为商品。

    • 众所知的证券交易委员会（SEC）将“某些”硬币视为证券。

    • 财政部下属金融犯罪执法网络（Fin-CEN）表示，“涉及可转换虚拟货币的某些活动构成资金传输。”

    • 如前所述，IRS 坚持将信用卡视为财产。


    所以现在我们可能假设有四四种不同、不兼容且比例不一的分布在提示我们，我们决定提醒你双重检查你所在管辖区的信用卡税收规则。我们无法保证这是否符合逻辑或易于理解。这仍然包含了另一个体现市场“野蛮西部”本性质的例子。


    # 安全之谜：密码学的入门级概述


    考虑一下碎蛋的案例。首先，打破蛋壳，将内物倒入容器中，然后搅拌这些内物，直到得到你想要的结果——碎掉的蛋。这种混合蛋颗粒的演示被称为加密。考虑到原子是紧凑的（不规则状态），我们说蛋实现了很大程度的熵。中断循环是使产出的蛋恢复到其独特状态的方法（计算蛋壳的破碎）。这真的很离奇吗？


    然而，如果我们把“蛋”替换为“数字”，把“分子”替换为“位数”，它是**可能**的。朋友，这就是密码学令人兴奋的世界（简称 crypto）。这是一个相对新的领域，由天赋异华的数学家主，他们使用“非线性多项式关系”、“除描述系统外的多元多项式方程”以及“伽罗瓦场”等术语。这些密码学家使用的是我们这些凡人无法假装理解的语言。


    一切都以数字的形式存储在计算机中。你的 MP3 文件被分配了一个数字。你的短信中也有一个数字。你的通讯录里有更多数量的人。字符“A”由数字 `65` 表示，而小写“a”由数字
    `97` 表示，以此此类推。


    个人可以看到从 `0` 到 `9` 的数字，但 PC 只能看到 `0` 或 `1`。这是一个并行框架，它使用位而不是数字来寻址信息。只需将位数增加 `0.3`
    就能获得足够的数字。例如，如果比尔·盖斯的财富仅相当于他拥有 `256` 位的印度尼盾盾（世界上最小的货币单位之一），他的财富将微不足道。


    十六进制框架（16 进制）利用了从 `0` 到 `9` 的十个数字，加上六个从 `A` 到 `F` 的额外符号。十六进制名称来源于该集合中有十六个独特的“数字”。这份文档对于需要感知
    PC “真实本质”的 PC 客户端是有价值的。处理这些先进的货币框架，如欧元、瑞士法、英镑等。在这些不同的数学框架中，一个数字可能是“昂贵”的，例如，可以使用这些货币标准以不同的成本购买物品。


    你是否曾问过为什么你需要习惯学校里最好的数字？我确定，许多数学老师并没有正确答案。答案是：被称为公开密钥密码学的加密部分，它使用密钥数字直接处理信息。（他们注意到那里最大的数字，如
    `2048`、`4096` 和 `8192` 位。）


    当我们需要向某物添加某些东西时，我们需要使用代码。这段代码实际上是一个数字，类似于蛋糕方程。它后面跟着一段黑暗且保守且规模有限的文章。你需要一个密钥来完成加密协作（有些人人将其视为登录条件）。为了让密码学正常工作，代码中使用的密钥应该具有高熵。


    在 20 世纪 80 年代和 90 年代中期，数据加密标准（`DES`）首次作为标准在 70 年代后期提出，是最广泛使用的来源。它使用 `56` 位的密钥。在
    90 年代后期，使用花费约 `$250,000` 的特定 PC，它就能在 `56` 小时内被破解。使用目前的设备，可以在一天内破解。


    因此，三重 DES（Triple-DES）取代了 `DES`，成为监控早期投机的合理方法。它在三个步骤中使用两个 `56` 位密钥：


    1. 使用 `Key1` 加密。

    2. 使用 `Key2` 解密。

    3. 使用 `Key1` 加密。


    使用了 `112` 位动态密钥长度（等同于 `34` 位）。`0` 到 `5192296858534827628530496329200957853269984665640564039457584007913129639935`
    范围内的任何数字都可以作为密钥。


    美国国家标准与技术研究院（`NIST`）在 2001 年接受高级加密标准（`AES`）作为标准。`Rijndael`（读作“莱茵达”）算法是由两位比利时密码学家
    Victor Rijmen 和 Joan Daemen 制定的。`AES` 密钥通常为 `256` 位长（等同于 `78` 位）。


    2003 年 6 月，国家安全局（`NSA`）批准 `AES` 用于确保美国政府机构最机密的数据（事实上，一直到他们批准执行措施的程度）。


