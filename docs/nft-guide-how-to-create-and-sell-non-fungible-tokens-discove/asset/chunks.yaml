  trans: '

    由于区块链技术的进步，我们现在实际上可以在几乎所有我们拥有的物品上进行“刻印”操作。因此，在非流动性资产中，例如负债可以在任何地方、任何人之间、无论是面对面还是在网上进行交易。对任何可访问物品创建代币的能力使得一类完全自动化的资产成为可能。这些新资产正在生成中。因此，立法机构继续修改准则，以应对这些组织的强有力行动。


    # 代币分类学


    随着自动化资产宇宙的增长，监管机构和货币支持者对了解不同类型代币的渴望也日益增加。将电子资产划分到区块链上被称为代币逻辑分类。基本上，财务成本在未来的业务领域中将继续占据巨大份额，因为电子资产的划分决定了其收益和交易。例如，证券代币应当遵守证券规则。如果你不这样做，你将面临法律后果。接下来是准备就的三种主要代币类型：


    - **加密货币**：传统的加密形式货币，例如 `Bitcoin` 和 `Litecoin` 就是此类高级资产的案例。这些代币通常被用作前沿货币。它们是独立的，并为点对交易提供了合理的目标。

    - **实用代币**：例如一种机械资产，用于在数字环境中获得奖励并完成各种任务。注意，这并不意味着对公司拥有直接的所有权或权益。

    - **证券代币**：证券代币是代表公司股份或投资的。这些代币在零售、证券和货币交易等高度协调的业务领域广泛可用。


    # 代币化：永远改变市场


    房地产市场继续受到证券代币等机械资产的扰动。例如，`Red Swan` 等平台允许土地主检查他们的财产。该机构实际上与 `Polymath` 合作，在美国创建了一项价值
    22 亿美元的交易代币。带有代币的设计比传统的房屋协议有多得巨大的优势。在任何情况下，整个安排过程都是快速的，不需要大量的中间人联系。带有代币的计划还可以立即转移。


    ## 高级资产已无处不在


    高级资产现在可以在任何地方被发现。代币化的影响适用于任何货币、财产、购买或开放点。因此，“高级资产”一词将继续涵盖最广泛的物品。目前，代币化显然是未来的方向。


    ## 数字资产与加密资产


    任何存在于数字结构中的资源被称为数字资产。加密资产是利用数字货币技术的数字资产。


    - 所有加密形式的货币都是加密资产，所有加密资产都是数字资产，反之亦然。

    - 并非所有的数字资产都是加密的，并非所有数字资产都是加密资产。


    `Bitcoin` 是一种“加密”货币，因为它是一种依赖于数字货币使用的资源。


    尽管如此，许多通常被称为“数字货币”的资源完全没有打算像货币一样使用。


    某些实用代币（原则上）不被预期用于货币，而另一些具有重要代币的资源也没有被建议用于货币，例如，`crypto kitties`、`token protections`
    和代币化的黄金。


    由于许多类型的资源可以被标记，“加密资源”比“加密形式货币”是一个更好的集合，可以更有尊严地描述整个数字货币类别（即，大多数人使用加密形式货币来描述所有基于加密的资源，并不分好坏，也不分部分）。


    目前，并非所有的数字资产都需要依赖加密，因此数字资产是一个通义分类。数字资产是指任何具有价值且数字化的东西。


    一个额外的游戏记录可以卖超过 1 级记录，或者一个出口游戏中的皮肤可以比另一个卖得更好。这些不是加密资源，但它们是数字资产。


    # 关于资产、分类与处理的声明？


    计算机编程提供了更多自由来与每个人互动；之后，确保这些义务符合赞助保险、公共支付、市场诚信和理解。准则的目的不是防止创新或发展，而是制定提高伦道德的标准，使市场更高效、更多产。


    委员会作为尼日利亚主要业务部门的领导，负责根据《2007 年投资与证券法》第 13 条监管尼日利亚的投机和证券业务。根据这些力量，`SEC` 建立了三项标准。它的结构、准则以及寻求真实性和真实性的创始人的共同努力都将以此为指导。


    因此，当投机性质被被视为证券交易时，`SEC` 将管理 `crypto-token` 或 `crypto-coin` 实体。


    ## 将监管什么？


    1. 除非另有说明，`委员会`认可机密加密资源受保护。因此，拟议加密服务的提供者或经理负责证明他们没有接收，，因此不受 `SEC` 的管辖。

    2. 通过完成基础测试记录，提供者或爱好者依靠它们来履行证明确定资源不受保护的义务。如果 `委员会` 确保大型资产是防御性的（这可能建议通过明确支持的部分或其他发布的策略进行传达），提供者或支持者应该要求高级资产。

    3. 因此，注册资本资源的路径将分两步：一个为了达到担保重量的基础检查记录，以及完成适当的注册，可以通过支持者或支持者完成，或者在不符合担保重量的情况下。

    4. 此外，`委员会`将管理所有 `数字资产代币 (DATOs)`、`证券代币 ICO`、`货币 ICO (ICOs)` 以及其他基于尼日利亚区块链的高级捐赠，无论尼日利亚捐赠者或赞助者是否关注尼日利亚投资者。


    ## 将监管谁？


    1. 除非另有说明，履行其承诺的包括任何区块链相关组织或数字媒体组织的任何（个人或协会）应向 `委员会` 注册并遵守其管理准则。获取、发送和代表他人订单、卖家及其记录、董事会、理论指导、监督员或拟议组织都是这些限制的内部和外部示例。

    2. `委员会`的计划适用于加密资产的提供者或盟友（新组织或设立协会）。出口商或捐赠者如果是新的或非居民可能需要在尼日利亚开设分支机构。通道或新受益者，当然，如果尼日利亚与提供者或新帮助有回扣协议，将被
    `委员会`认可。

    3. 如果新提供者或支持国家是`国际证券监管机构`的人员，该国家 (`IOSCO`)将被承认。

