  trans: '

    Neo 是众多 NFT 市场平台之一：MakersPlace、Nifty Gateway、OpenSea、SuperRare、Rarible 和 Decentraland
    只是其中的少数。在 NBA 纪念品方面，通过 Top Shot 已完成了超过 2.3 亿美元的收藏——在那里你可以为自己的精彩集锦购买代币。


    YellowHeart - King of Leon 使用感知区块链的服务来防止门票欺诈，并将门票更直接地送送到粉丝手中。许多人认为，这可能是音乐演唱会的未来，并让艺术家能够掌控自己的命运。


    # 制作与销售 NFT


    你认为自己是有创造力，还是仅仅为了赚钱？你可以以任何想要的方式解读你的作品。价值 580,000 美元的 Nyan Pop-Tarts 可以变成一个可爱的
    Nyan Cat Pop-Tart 动画。通常，人们接受你的成本在不同网站之间会有所不同（以支付在 `Ethereum` 等平台上购买所需的电脑“燃料气费”）。你可能会发现该项目已从
    Nifty 网站中撤出，在他们的市场中申请 NFT 变得简单。在剥开 NFT 的初始层级时，会产生许多问题：伦理、物流和环境方面的困难随之而来。


    许多专家已经关注了 NFT 分配和交换通过环境变化、生态分离和自然失衡对受损地球造成的巨大影响。因此，NFT 是否与全球变暖有关？总结来说，可以这样表述：通过在区块链上生产创建
    NFT，结合交易潮（竞价、出售等），将构成区块链总用量的很大一部分。如果将贪婪推到极致，我们可能会面临新型的环境破坏。包含许多此类 NFT 的区块链 `Ethereum`
    计划实施权益证明机制（proof-of-of-stake）以降低能耗，但权益证明倡议尚未落实。目前，尚不清楚是否会有变化。


    从伦理上说，销售 NFT 的行为可能并不处于理想状态。著名数字艺术家 RJ Palmer 最近在 Twitter 上发布了警告，称有一个账户克隆了他的同事艺术作品，并将其作为正版数字艺术品出售。对于年轻艺术家来说，这是一个糟糕的机会，看到自己的作品被剥削，却没有任何救济，无法验证发行者是否真的是作者和版权所有者。加密货币提供的匿名性让他们容易受到盗窃和危险。


    ## 销售 NFT 的最佳例子是什么？


    问什么还没有被 NFT 化可能是一个更好的问题。这无非是将所有最热门的名字引入非同质化代币市场：技术、音乐、金融和商业。让我们用“动物园动物”为例：当某事运作良好时，就继续使用它：“没坏就不要修它”。


    “此页面上的所有内容均取自 Twitter。”不过，你可能在不同的网站找到相同的内容，或者可能会发现额外信息。


    一群“艺术爱好者和艺术家”购买了一幅班克斯西的作品，然后用这笔钱开始画一幅画。该画在在线市场上以 50,000 美元的价格出售。（她还预告说，将捐给“接受比特币的慈善机构，以赋能年轻人，让他们能够适应并学习人类正在见证的这场变革”。）Rob
    Gronkowski 目前每张限量版冠军戒指签名卡能赚取约 1,000,000,000 美元。但幸运的是，埃隆·马斯克基本上计划将一首关于 NFT 的最佳科技歌曲作为专辑标题。据估计，Aoki
    的作品“Cat”草图已带来超过 425 万美元，仍有一些作品可以以低于 500 万美元的价格购买。


    # 数字货币的未来将是什么？


    “你可能是的，但它现在是数字化的。”现在，是“数字”这个词，它源自拉丁语“digitus”，意思是“手指、脚趾”，也指计算机、音乐播放器、手表、手机等。那么，你对数字货币甚至数字公民想说什么？


    接着印刷机问世，被许多人誉为解放者。曾几何时，书籍只有富人才能拥有。我们现在有了任何人都可以电子书和其他设备。尽管它是数字化的并转换成了文字，我们仍然更偏于实体书，而不是必须充电才能工作的电子塑料。如果你真的相信
    `bitcoin` 等数字货币可以为世界带来积极变化，那是如何实现的？


    如果你想对这个问题给出答案，最重要的是根据我们如何构想一个“所有人的更好世界”来研究货币，我们必须问如何使用它、为什么要使用，并将将其包含在模型中。我学到货币与其他形式的财产不同，可以在事件发生之前使用。它无数的表现和影响并没有暗示任何含义，但它唯一的简单意义就是好或坏。这是一种特殊但经常被误解和利用不足的成分。这证明了这样一点：货币在用于买卖时是中性的，但在应用于其他目的（如伦理或道德决策）时是复杂的。它是内生的也是外生的，因为它具有内在特征，但同时也依赖于全球社区。它缺乏身份且易于替换，但在广泛背景下被视为不可再生资产。然而，从原则上讲，结果永远无法完全预测，如果你想使用它，这可能并非必须。


    货币必须被持有者认为具有内在价值。美国参院国土安全与事务委员会于 2013 年 11 月认定，像比特币这样的独特货币是一种真正的收入类型。移民劳工可以使用“比特币组织”向家庭汇款，而无需支付高额费用。欧洲委员会估计，如果全球汇款费用降至
    5%（G20 在 2011 年的支持），将为发展中国家提供额外的 150 亿美元。这些资金传输服务可以通过基础设施系统去中介。


    加密货币的独特之处在于它们是分布且去中心化的。由于互联网，我们可能只看到了新应用的冰一角。为了更有效地运作，过去公司必须将控制交给许多人；而今天，对网络的依赖让主导利益的少数精英掌握了网络的“权力”。据说
    `比特币` 是货币向去中心化的移动，它可能被认为是一种更精简的系统方法。`比特币` 代表了等同于文件共享和电话（例如 Skype）的范式转移。


