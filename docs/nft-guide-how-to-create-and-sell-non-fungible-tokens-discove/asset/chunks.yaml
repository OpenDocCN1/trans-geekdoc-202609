- raw: 'He disagrees with Christie’s on Beeple’s estimation of his current worth,
    classifying him as another contemporary art superstar in the class of Koons and
    Hockney. I don’t think that Christie’s sold one of the rarest and famous Pokémon
    cards for $1 billion.


    EXCESS FIAT CURRENCY, EXCESS CRYPTOCURRENCY


    Getting good academic training and joining an artist’s cooperative can be necessary
    for artists to achieve a measure of success in the art world. Work will reward
    a lifetime of appreciation for those who devote their entire lifetimes to it,
    Steib tells us.


    Underpinning this NFT is not a myth; there are no preconceptions of any kind that
    drive it,” he concludes. The second question is, Can I survive without the support
    of infrastructure and industry in this size NFT? I think I’m up to the task of
    following in Beeple’s footsteps. To put it mildly, I would say, stay in school,
    kid.


    NFTs aren’t a democratizing force in the world of fine art auctions. In an editorial
    written statement released in March, he estimates that the price MetaKovan, the
    winner of the Christie’s auction, took advantage of the emerging commercial rules
    of art appreciation and inflated the value of the pieces.


    No rational reasons exist to assume that Beeple’s elixir can increase 100 times
    or more in value in the highly volatile and mercurial crypto market. Instead of
    democratizing the art market, buying in Bitcoin effectively takes it even further
    into the stratosphere.” MetaKovan is a substitute for an elite group that possesses
    fiat currency.


    ##  Defining the Crypto Art Movement


