  trans: '

    当我们进入任何投机领域时，都应该对使用晦涩术语保持谨慎，例如“牛市和熊市展示”。此首要理由是，数字货币在 2017 年那场惊叹的“牛市”中看到了超过 12
    倍的收益。如果你最近向 `Bitcoin` 投入了 1000 美元，你最终将获得超过 10,000 美元的回报。这在传统的股票投资中从未发生过。`琼斯工业平均指数`在
    2017 年增长了 23%。


    谈到数据和图表时，我非常谨慎，因为我学过你可以操纵数字来说你说出你想说的任何话。正如加密货币在 2017 年经历了巨额增长一样，它在 2018 年也经历了快速回调。我竭尽全力表达的观点是，当我们比较事物时，我们应该尝试保持客观。


    新的风险让加密货币世界中的许多新手感到震惊。他们只是听过这些第一批人物是如何每一个变得富有并购买了 `Lambos`（兰基尼）。由于近期开支的增加，这种市场变化对于经验丰富的交易者来说尤为明显。许多人由于电子货币结构已经成为了一时间的富翁。显然，他们最终应该带来这些优势之一。


    此外，正如我所看到的，还需要考虑的是交易末尾的新的 `Bitcoin` 扩展。我承认这里有很大的力量在运作，由老牌安全官员推动，他们需要加密货币跌入谷底。交易所和涵盖加密货币
    `ETFs` 的能源也是让加密货币成为发展中阶段的“真实”公司的一种极佳方法，正如我所看到的。


    在说完这些之后，我开始思考，“想象一种这里存在关联的情况。”


    想象一种情况，华尔街的负面消息增加了像 `Coinbase` 和 `Binance` 这样的加密货币交易。两者可能同时完蛋吗？想象相反的情况正在发生，人们需要在其他地方存储他们的资金，这导致了加密货币的兴起。


    我希望能停下来，观察这个无偏见的野外中心，努力不持有数字并保持真实。这周对任何人来说都是很棒的，因为这就像两个专业部门发现了一个答案。


    对于接触加密货币交易的新手来说，交易从未关闭，这对于货币交易来说并不理想。我交易股票已超过 20 年，我理解周日晚上由于可能的疲劳而产生的尴尬感，


    “我希望我现在可以改变一两个仓，因为我看到当交易开市时价格将发生巨大变化。”


    这种类似于沃尔玛的段落可以消除在任何情况下可能释放的热浪。人们可以使用传统的货币交易来持有他们的选择，并将其视为一夜之间。


    我需要最近七天的加密货币数据和最新的五个长期 `DJIA` 数据来发现什么可以匹配一周的周期。


    这里是每周的测试（2018-3-3 到 2018-3-10）。`琼斯工业平均指数`下跌了 1330 点，跌幅 5.21%，因为 30 只成分股中有 20 只亏损了。


    发现冲突的、同类苹果和加密货币标准是危险的想法，认为不存在像`琼斯指数`这样的东西。此外，随着不断增加的循环超过其周转，这种情况正在发生变化。目前，最佳组合是使用市值最大的前
    30 种加密货币。


    根据 `coinmarketcap.com`，前 30 个硬币中有 20 个在过去七天内价值下跌。这听起来熟悉吗？加密市场的总价值已从 4450 亿美元下降到
    4220 亿美元。在此期间，作为黄金基准的 `Bitcoin` 下跌了 6.7%。

    '
