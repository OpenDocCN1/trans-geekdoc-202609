  trans: "\n\n# NFT 指南\n如何创建和出售非同质化代币，发现作为加密资产的加密艺术与收藏品\n\n## 目录\n- 引言\n- 第一章\n  \
    \  - 什么是非金融同质化代币 (NFT)?\n    - NFT 是如何工作的？\n    - NFT 的价值如何？ （注：源文件内容缺失）\n   \
    \ - NFT 带来的机会\n    - NFT 股票是你的投资选择吗？\n- 第二章\n    - NFT 会是现代艺术的未来吗？\n    - NFT\
    \ 是如何震动艺术世界的？\n    - 定义加密艺术运动\n- 第三章\n    - 如何购买 NFT\n- 第四章\n    - 区块链 - 针对普通人的科普\n\
    \    - 原理上的隐写术\n    - 为什么你应该购买画作的原因\n    - 出售艺术作品的七个简单技巧\n    - 如何开始出售艺术品\n- 第五章\n\
    \    - 什么是加密资产？\n    - 会计中的资产是什么？\n    - 加密资产的特征\n    - 关键在于及早进入\n    - 安全机密：简要概述\n\
    - 第六章\n    - 加密货币：颠覆者\n    - 加密趋势\n- 第七章\n    - 数字资产与加密资产\n    - 你需要数字资产的几大指标\n\
    - 结论\n\n## 引言\n直接投资加密货币（`CC`）需要使用新工具并采用新概念，这对于传统投资者来说可能令人生而畏。因此，如果你决定涉足这一市场，请确保你清楚自己正在做什么以及预期会什么。要买卖\
    \ `CC`，你必须首先找到一个提供你想要买卖的产品交易所，无论是比特币、莱特币还是任何其他可用代币。我们在之前的版本中简要描述了可用的产品和服务，以便让你对可用情况心中有所数。\n\
    \n如果你密切关注市场，加密交易是可以盈利的。然而，你有时可能会觉得很困难。幸运的是，如果你需要帮助，可以寻求加密服务。你可以利用它们提供的信号在正确的时间做出正确的决定。有许多服务可供选择。以下提供了一些帮助你选择最佳服务的几点要点。\n\
    \n`NFTs`（非同质化代币）是一种加密资产，其中每件物品或代币都是独特的。因此，它们作为货币是毫无用处的，但对于其他用途（如加密艺术）极其有用。继续阅读以了解更多信息。\n\
    \n## 第一章\n\n### 什么是非金融同质化代币 (NFT)?\n当我们说某物是“同质化”的，我们是指每个单位都可以相互交换。例如，货币单位就是同质化的。当你把一个美元换成另一个美元时，你本质上拥有的是相同的东西。而独一无二的艺术品另一种效果是，它们无法被复制。数字艺术品、视频片段、`gif`、推文甚至数字交易卡都可以被视为\
    \ `NFTs`。实际上是任何数字内容都可以，但目前关于利用这项技术以数字方式销售艺术品的热潮非常巨大。\n\n为什么现在这么火？我们看到数字艺术家 Beeple\
    \ 以 6900 万美元卖出件艺术品，推特创始人 Jack Dorsey 的推文以 290 万美元卖出。这些都是 `NFTs` 目前如此流行的几个原因之一。\n\
    \n### 到底什么是 NFT？\n非同质化代币。这个解释对事情一点帮助也没有。抱歉带来不便。“非同质化”实际上意味着它是特殊的，不能被任何其他东西替代。例如，`Bitcoin`\
    \ 可以被认为是同质化的，这意味着你可以交换它并得到相同的东西。独特的交易卡也是无法复制的。如果你可以换成另一张卡，你就能发现一些完全有趣的东西。“非同质化代币”一词指的是一种不可同质化的代币。在财务事务中，视觉辅助是单位组成部分，例如钱。对于现金，你可以把一张\
    \ 10 英镑钞票换成两张 5 英镑钞票，金额是相同的。\n\n如果某物无法这样运作将是不可想象的，这意味着某些事物最终会被单独交换。例如，一个房子或一件独特的艺术创作，如《蒙娜丽莎》。你可以为艺术品拍照或购买复印品，但总会有一幅原作不同的画作。在发达国家，`NFTs`\
    \ 是可以作为其他资产买卖的“不同”资源；然而，它们没有真实的结构。高级代币可以衡量对真实或虚拟资源的访问权限。\n\n### NFT 是如何工作的？\n\
    可以作为 `NFTs` 购买的艺术类型几乎是无限。在 Dorsey 的推文之后，这并未此结束。机器人 Sophia 的 `NFT` 艺术品以近 70 万美元售。《纽约时报》专栏的加密代币以\
    \ 56 万美元卖出。`NFTs` 的美之处在于，它们一旦被创建，就可以上传到 `NFT marketplace`（NFT 市场）。\n\n绘画和其他用于布置展览的常见物体在类型上很重要，因为它们是同一种类型。计算机记录也可以被有效且高效地复制。技术可以通过\
    \ `NFTs` 被“软化”，以创建一个可以被仔细买卖的专利。\n\n仅仅是先进的交换卡最终会产生各种卡片吗？关于谁拥有某物的记录（例如加密货币）被放在名为\
    \ `blockchain`（区块链）的标准记录中。\n\n"
