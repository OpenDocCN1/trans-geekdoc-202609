    规则 #5：黄金会逃离追逐不合理利润的人，逃离盲目跟随专业艺术家和艺术家的人，以及逃离依赖自身无知的人。第五条决策紧密地遵循了第四种情况。当你开始在互联网上寻找金钱指导并产生大量想法时，你的收件箱很快就会充满各种“部分”，它们提供国际业务，只需低于
