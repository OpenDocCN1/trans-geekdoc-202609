    你是否意识到目前有超过 5,000 种加密货币正在使用，而 `Bitcoin` 的地位处于最高水平？自 2009 年诞生以来，`Bitcoin` 本身拥有一段与伦比的交易历史。在它短暂的范围内，这种先进的数字货币经历了大量的活动。比特币最初的交易几乎不值钱。第一次重大的价值增长发生在
    2010 年 7 月，当时一个 `Bitcoin` 的估值从约 0.0008 美元扩大到至少 10,000 美元。从那时起，这种资产经历了巨大的社会波动和崩溃。尽管如此，随着“稳定”币的出现（例如由美元或黄金支撑的币），加密货币的波动性现在是可以被控制的。


    然而，在我们将这种基于加密的新型电子商务作为管理和利用资源（包括我们的“法币”储备）的方法之前，我们何来研究一下银行近年来是如何演进的。


    谁还记得旧的 `CheckBook` 呢？在 1987 年银行卡出现之前，支票是交换产品的重要方式。随后银行卡和 ATM 机出现了，这使得对 `FIAT`
    个人资源的获取变得容易，并让在线交易变得简单得多。


    银行的问题在于，我们大多数人无论如何都需要两个财务余额（活期和投资账户），而且我们做的每项业务都需要一个。此外，为了尝试将现金从你的财务余额“快速”转账给对方，据他说，唯一通用的地方是与
    `SWIFT` 完全不同的！


    费用也是一个问题。除了我们需要为每个 `Bank Account` 支付常规的服务费外，我们还需要为每笔交易支付巨额费用，而且显然，我们只在极少数情况下才能在活期账户上获得合适的贷款费用。


    此外，由于始终使用专业的金融经纪人（或者最近的人工智能 (AI) 交易框架），我们的每一项资产都将被卖出，而银行将成为我们商品最大的收入来源——而不是我们！看看“隔夜交易”创造收益的力量。


    简而言之，银行不仅在存放和发送我们的货物上收取更高的费用，还从我们资金的隔夜交易循环中获利，而我们却看不到任何收益。


    ## 五大黄金法则！


    我们生活在一个包容的时代，涉及到金钱时，我们希望现在就得到，而不是以后。无论是首付款，还是支付那些在我们停止使用后很久仍在耗尽我们精力的信用卡单，越快越好。在投资方面，我们希望选择简单且快速的回报。因此，当前的加密货币正在进攻。当
    `Ethereum` 处于一条更先进的路径上而 `Bitcoin` 是一份永恒的礼物时，为什么要投资机器学习或纳米技术呢？


    George S Clason 是上世纪的一位美国作家采取了不同的方法。他为世界提供了一份真正的财富——实际上——一套基于今天看来可能过时的财务原则：在《巴比伦富翁》中包含了警告、智慧和知识。Clason
    的财务建议是由古老巴比伦城的学者提供的，但它在今天与一个世纪前华街崩盘和大萧条临近时一样相关性。


    以这五条黄金法则为例。如果你想管理自己的财务，这适用于你：


    ### 第一条法则

    任何在任何情况下将其收入的十分之一储起来以备未来的人，他的金钱将会快乐地增长。如果你不确定，请做些研究。看到收入的十分之一可能的。投资成本相对较低，但谁知道它们在五或十年后会在什么位置？另外，由于复利，你的存款将增长得比你预期的快得多。


    ### 第二条法则

    对于储下收入十分之一的所有者，如果你接受你的公司有一个辉煌的前景，利用它是极好的。然而，你不应该将资金投入你不完全理解的市场或金融产品中。良好的财务顾问可以建议你获得必需品：年金、保险和便利。你可以直接投资，也可以通过单位基金投资。


    ### 第三条法则

    黄金坚持明智所有者在专业人士帮助下种植的安全性。在做出决定之前，咨询认证且经验丰富的财务顾问。如果他们没有数据，请要求他们提供这样做的人的数据。你可以在网上查看他们。他们什么样的经验？他们什么样的客户？查看更新。看看他们的奖金设计。


    ### 第四条法则

    黄金避开了那些将资金投入到对于具备实力的人来说不合适的新型组织或目标的人。如果你对食品行业有全面的了解，可以考虑投资一家获得行业整体份额的商店。基本上，如果你的公司提供员工股票计划，如果你接受你的公司有一个辉煌的前景，利用它是极好的。


    ### 第五条法则

    （原文未提供第五条法则的内容）


