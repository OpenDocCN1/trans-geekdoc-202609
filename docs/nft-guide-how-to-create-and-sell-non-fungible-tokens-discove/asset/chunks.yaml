    the least-research... Academic curiosity has always been my motivating factor
    in doing steganography. Although it is only employed in both military and commercial
    networks, steganography has not received much attention until recently.


    The word steganography originates for the Greek word, which translates to “to
    hide writing.” or “to write in a secret code.” Krypto means something that is
    no visible or simply that is hidden, and traces back to the become Greek Word
    kryptētērion. It was derived from the Greek word graph, which means “to write.”
    A cipher is a goal of writing down something so that even if someone sees it,
    they can’t understand it. All the written form of communication known as steganography,
    which was popular at one time, is still in use today, but much more rarely now
    (concealed writing). Stego means hidden. Stego is a way of writing rather than
    a replacement for cryptography. Although cryptography is part of it, steganography
    is different. As opposed to plaintext, the goal of cryptography is to obscure
    the message, and steganography is to hide the fact that one is sending a message.
    Combining these two techniques enables the embedded secret message to be encrypted
    first. If people can’t detect the transmission of encrypted messages, they’re
    less likely to find out how important they are.


    Hackers and investigators may be attracted to a data field even if it is encrypted
    and hidden by encrypting it, but they will not make an attempt to obtain the key
    to gain access. Disguising, data in the least significant bits of the medium while
    keeping it safe employs steganography. Embedding is necessary that the carrier
    media retains its color, consistency, appearance, and luster after curing.


    Other similar techniques include steganography, which aims to mark an image or
    sound file so that no one can discover who has altered it, and encumbering, in
    which modifying the file is an integral part of the process. Makeable alterations
    should be subtle; no one should be able to overwrite an existing mark or add a
    new one. This is an exciting new technology for the entertainment industry because
    it provides a simple method to know if something has been stolen from the web
