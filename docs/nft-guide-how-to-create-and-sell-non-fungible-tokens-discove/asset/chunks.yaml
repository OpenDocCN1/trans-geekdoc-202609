    In the beginning, the artist chose the topic, approach, and medium. When one finishes
    preparing the canvas for painting, one must prime it, apply texture, paint the
    subject, and finally coat it with a layer of paint.


    It varies a lot, but artists typically work on a painting 5-10 times before it
    is exhibited in public. Since multiple transparent and translucent layers are
    needed for the creation of the image, the painting process must be repeated many
    times.


    The characteristic of the reproduction process is that there is a short time allowance
