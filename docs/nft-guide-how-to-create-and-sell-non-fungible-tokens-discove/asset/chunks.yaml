    `CME` 的此举表明，`bitcoin` 已经大到无法被忽视的程度，因为过去的交易实际上动摇了加密货币的命运。`Bitcoin` 几乎是商界每个人的话题，尽管那些作为行业部门兴起并生存下来的交易公司一直保持异常沉默。由于估值和交易在成熟的市场中至关重要，对于某些其他交易（如
    `CME`）来说，要决定单一交易的最终命运是否结束似乎很难。


    在接受 `CNBC` 采访时，Duffy 表示：“你无法忽视这些是如何演变成一个持续存在的问题。”他说，“普通机构”需要进入 `bitcoin` 领域，并且对客户压力存在异常的需求。Duffy
    进一步承认，向将面向公众出售的机构投资者捐赠将有助于减轻 `bitcoin` 的疯狂程度。


    日本某市将使用加密货币在主要城市发展再生资产。


