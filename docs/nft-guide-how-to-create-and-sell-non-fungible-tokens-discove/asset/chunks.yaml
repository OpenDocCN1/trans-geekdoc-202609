    使用加密货币支付通常比使用英镑等认可的货币支付更慢且更贵。


    加密货币的开发是为了使其更易于使用，但目前它仍然并不像货币。这就是为什么现在央行将其统称为“加密资产”而非“加密货币”。


    加密货币现在通常被那些预期其价值上涨的人士作为投资持有。虽然某些加密货币的价值有所增加，但许多其他加密货币的价值已经大幅下降。如下图所示，它们极具不可预测性。即使与石油等其他波动性资产相比也是如此。十多年前，比特币是唯一的可用加密资产。经过多年来，其定义已经发生了变化。为了理解它们，你必须区分加密资产、加密货币和数字资产。


    ## 加密资产的含义


    在会计术语中，加密货币和加密资产具有相同的含义。它可以是以加密资产或加密货币的形式存在。无论你选择哪种，请记住这些是计算机化的资产，而不是实体资产。在加密资产会计中，它们是资产负债表上的资产。


    ## 会计中的资产是什么？


    在负债表上，资产位于负债的另一侧。资产是公司可以使用的有形或无形资产。为了获得准确的资产负债表，总资产必须等于负债和权益总和。理解固定资产和流动资产之间的区别也很重要。库存是可衡量且真实的有形资产示例。另一方面，无形资产（如股票和债券）是数字化的。


    ## 加密资产概述


    市场上有很多许多不同类型的加密资产。`Litecoin`、`Ripple`、`Bitcoin` 和 `Ethereum` 等加密货币就是例子。要使用加密技术访问数字资产，你需要使用加密技术。对于所有金融交易，它将用作交易环境之间的服务器介质。


    效用币、证券币和加密货币是加密资产的其他类型。为了创建更多单位和转移资产，货币是受安全的。这些数字货币大部分基于区块链技术。


    如果你投资加密资产，你将看到金融市场的剧烈变化。先进技术的使用日益普及，导致金融体系受到破坏。央行和金融机构有改变其影响的能力。当难以分类单个加密资产及其对生态系统的影响时，困难就产生了。代币、`bitcoin`
    和山币的趋势改变了金融体系。


    越来越多的金融机构对加密资产交易感兴趣；然而，费用和监管是一个主要问题。为了支持他们的交易，加密资产交易所必须考虑法币。


    ## 资产的主要类型是什么？


    组织、个人或政府持有或控制的、产生关键货币收益所需的资源称为资源。流动性、非流动性、实质性、理论性、实用和无用性资源统属于正常资源。准确识别和认可资源种类的能力对于组织的生存至关重要，特别是其目标和相关的风险。


    正如国际财务报告准则（`IFRS`）所示，“由于过去的事件，资源是对物质控制权的源泉，并且未来的货币收益将流向该元素是正常现象。”


    资源的几个实例是：

    * 应收账款

    * 金钱和价值

    * 投资

    * 货物

    * 汽车


    ### PPE（物资、设备和器具）

    * 版权（理论性资源）

    *  फर्नीचर


    ### 资源亮点

    该结构分为三个主要区域：

    * **所有权**：资产代表以后可以转换为货币或货币等物的占有。

    * **经济价值**：货物是重要的，可以出售或交易。

    * **资源**：资产是一种用于产生未来财务收益的资源。


    ### 资源分类

    产品被分为三类：

    1. **适应性**：根据其非常容易转换为现金的特性对货物分组。

    2. **常规资源**：资产根据其真实性（如硬件和无形资源）进行排列。

    3. **用途**：资源的特征取决于其利用情况或业务活动的原因。


    ### 资源分离：转换

    资源根据其转换为现金的能力被命名为流动资源或非流动资源。将短期资源与长期资源对比是传达这一概念的另一种方法。


    #### 1. 流动资产

    流动资产是指那些为了利用而可以快速转换为货币或现金等价物的资产（通常持有期为一年内）。流动资产，也称为流动性资产，包括：

    * 现金等价物

    * 现金

    * 应收账款

    * 短期存款

    * 可变现证券

    * 库存

    * 办公用品


    #### 2. 永久和当前资产

    那些不处于流动状态或无法快速转换为现金或现金等价物的资产。固定资产、长期资产和硬资产都是描述非流动资产的术语。以下是这些非流动性资产或可能是固定资产的示例：

    * 建筑物

    * 土地

    * 设备

    * 机械

    * 商标

    * 专利

