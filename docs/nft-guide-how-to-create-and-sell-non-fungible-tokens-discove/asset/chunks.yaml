    # 数字资产与 NFT 所有权


    版权保护声明最好被理解为计算机文件结合所有权验证（例如注册纸据）。它们存在于不可篡改的公共账本上，如 `Bitcoin`。与美元一样，每种加密货币都是法币，即每个
    `BTC` 与任何其他货币相同。与 `NFTs` 不同，伦勃朗或毕加索的绘画并没有被赋予任何特定的价值，这种价值可能因买家不同而异；每幅画的设定价值由最高出价者决定。


    为了在在线虚拟资产平台上成功出售作品，艺术家们必须注册，然后在区块链上“铸造”（mint）他们的详情（通常是 `Ethereum` 区块链，`Bitcoin`
    的竞争平台）。通常，你问题的答案在 40 美元到 200 美元之间。然后他们就可以在 `NFT eBay` 上发布广告。


    ## NFT 现象


    无论其货币价值如何，整个项目看起来都是荒谬的：富有的收藏家竟然为通常可以免费获得的作品出到六位到八位数字的价码。批评者将 `NFT` 现象描述为无非是一场市场狂热，这是对“今年数字游戏零售商崩溃”的双关语，正如近期围绕
    `GameStop` 股票的繁荣与幻灭经历。它吸引了各种各样的艺术家和投机者，他们渴望从最新的风尚中获利。


    这可能是一个泡沫。但今天的数字艺术家多年来在 `Facebook` 和 `Instagram` 等平台上一直过度承诺而交付不足，他们现在选择在其他地方寻找财富。艺术家——无论是作家、音乐家还是电影制作师——看到了一个变化的世界，在这个世界里，现在有了“拥有”和“出售”数字对象的能力。所有年龄和能力的艺术家都将获得相遇、联系和获得新职业道路的机会。他们为自己的艺术作品投入了许多时间和心血。”如果在适当的范围内获得回报让他们感觉良好，那是令人愉快的。未来在实现区块链革命方面可能发挥核心作用，这场革命将对贷款、医疗保健和个人数据管理产生重大影响。


    ## 稀缺性的价值


    由于可以免费获得，数字艺术长期以来被低估。稀缺性的贡献对于艺术家为其作品创造财务价值至关重要。对于某些收藏家来说，拥有原始物品要重要得多。很少有人会因为稀缺性而为一张印有传奇海盗
    `Honus Wagner` 图片的纸板支付那么多钱。此外，球鞋迷喜欢获得 `Nike` 和 `Adidas` 的最新发布品，据说 Martin 两年前曾以
    200 万美元买下了唯一的 `Wu-Tang Clan` 专辑。


    当你能看到并触摸到它们时，棒球卡、球鞋和 `Wu-Tang Clan CD` 具有价值这一事实更容易理解，但餐厅里的食物 CD、休息室里的手表和一袋海洛因就不是。要看出创意或数字媒体的意义也更困难，因为它们很容易被传输。”


    ## 数字艺术家的观点


    另一方面，许多数字艺术家声称，他们支付费用不仅是为了劳动力，也是为了图像。他们希望数字艺术被视为一种新兴的媒体形式。她渴望发现自己的热情，探索了绘画的创作可能，她说：“我希望你们能够观察这些物品并看到它们都是独特的。”我们对该产品的投资获得了很好的价值，因为艺术家在其中投入了大量的时间和精力。现在我们的大多数人大部分时间都花在了网络空间里，这一点变得越来越清晰了。


    ## 市场趋势与名人参与


    `NFT` 市场见证了来自各种平台和名人的活跃活动：


    - **Top Shot**: `NBA` 官方应用 `Top Shot` 自 10 月发布以来已售超过 3.9 亿美元。

    - **Gronk**: 这位橄榄球超级明星卖出了超过百万张他的超级碗锦交易卡。

    - **Twitter 创始人**: 据报道被要求公开他的首次推文，预计在拍卖中将至少达到 250 万美元。

    - **埃隆·马斯克 & 马克·库比**: 这些名人已在该领域进行了大量投资。

    - **温克沃斯兄弟**: 他们在 2019 年底向他们选择的加密货币投资了超过 70 万美元。

    - **Daniel Maegaard**: 一位澳大利亚 `bitcoin` 交易员，据报道自 2017 年以来已赚了 1500 万美元或更多，他在数字艺术和其他
    `NFT` 项目（如 `AxInfinity` 中的虚拟财产）上花费并赚回了数百万。


    ## 巨鲸的角色


    他认为所谓的巨鲸（即大大户）正在 `NFT` 领域（金融新闻交易）世界工作。这对大资金投资者和传教士对任何加密相关的事物都有重大的财务利益，并能从炒作中获得收益。`OpenSea`
    和 `MPlace` 经历了类似的增长；它们占了销售额的最高 15%。


    '
