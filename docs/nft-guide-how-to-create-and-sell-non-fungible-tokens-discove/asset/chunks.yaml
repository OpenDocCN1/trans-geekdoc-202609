    ##  Top Indications You Need a Digital Asset Management System


    You should seriously consider a digital or media asset management system if you
    find yourself experiencing any of the following or if you can relate to any of
    the following experiences.


    You can''t seem to find what you''re looking for: One of the most important features
    of any asset management system is a ability to search the content. Otherwise,
    if you can''t find what you''re looking for quickly, you''ll become frustrated
    and waste time and money on the redundant effort. It will slow you down, cause
    project delays, irritate your customers, and cause a slew of other issues. You''ll
    waste time attempting to determine which hard drive or archive tape contains the
    information you require. Furthermore, an asset management system will enable you
    to organize content into groups, projects, or categories, resulting in better
    content organization and easier, more secure searching. Content can be enhanced
    with metadata and other tags, allowing search results to be refined.


    You only have projects saved on hard drives: Data suicide is storing content solely
    on hard drives. Keeping backups on multiple drives isn''t a good idea, either,
    because you''re just adding to your headaches without a management system. Will
    you remember which drive has the backup if one of your drives fails? The main
    difference between a backup and an archive is that archive systems have brains
    that keep track of where your content is located, whereas backups are simply backups.
    Archive systems should ideally be self-describing, such as LTFS LTO (open standards
    for archival tape) tapes, so that no proprietary software or drives are required
    for restoration. Additionally, storing data (video, images, audio, documents,
    and so on) on a different type of media improves overall durability - LTO tape
    is certified for 30 years of archival use.


    You have a stack of videotapes on your library shelf that you have no idea what''s
    on: Here''s a suggestion if your library looks like an endless stack of tapes
    and you don''t know what to do with them. Make a digital copy of them. All kinds
    of miracles can happen once content is digitized. You can look at them, edit them,
    search for them, store them, manage them, repurpose them, and share them. The
    process of digitizing video and other content and storing it in a DAM (Digital
    Asset Management) or MAM (Media Asset Management - typically for video content)
    system is known as ingest. Effective management becomes possible once content
    has been ingested. Your operation will be much more efficient, and you can get
    rid of the videotapes if you want to save a lot of space (once you have backups
    in place). Outsource content ingest if you can''t do it yourself.


    You lost content without a backup: You think it''ll never happen to you, but when
    it does, it''ll hit you hard. Hard drives fail, and if you don''t have a backup,
    your data will be lost forever. Murphy''s Law is always in effect, and Murphy
    never rests. You might be able to get a restoration service at best. There''s
    a chance you''ll be able to recover the content from the hard drive, but there''s
    no guarantee. It is better in safing than sorry, so invest in a MAM system that
    includes an LTO archive. There are numerous cost-effective options available,
    with something to suit every budget.


    With content on multiple systems, your workflow is disorganized, redundant, and
    inefficient: Multiple groups are working on the same project, but there is a lack
    of communication, resulting in errors and delays. There are multiple storage systems
    that aren''t connected, and there''s no central management system to speak of.
    Content is strewn about, and some people aren''t sure where the important clips
    are. One group wastes time and money by duplicating the efforts of another. Another
    group overwrites another''s work, resulting in delays and rework. Because a key
    decision-maker was left in the dark about what was going on, unapproved content
    was released. All of these issues were solved by using a central MAM or DAM system.


    Inefficiencies cause projects to be late or behind schedule: Customers are yelling
    because their projects are behind schedule, and you can''t tell them why, so you
    make up excuses and lame reasons for the delays. Even if you are not yet behind
    schedule, you are frantically searching for the right content for the project.
    There''s no sweat with a MAM/DAM because the content is literally at your fingertips,
    and collaboration makes the entire process much smoother, efficient, and on time.
    In the end, a MAM/DAM system pleases both producers and customers.'
