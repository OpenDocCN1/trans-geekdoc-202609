    \ everyone has the latest version of the ledger at any given time.\n\nState-of-of-the-the-the-art\
    \ cryptographic technology is used to encode each new transaction as it is entered.\
    \ Once the transaction is encrypted, it is known as a `block`, and it's equivalent\
    \ to a collection of various transactions. That `block` is then sent throughout\
    \ the computer network of nodes, where it is verified, and once verified, added\
    \ to the previous list of blocks. The 'chain' is known as a large network of multiple,\
    \ linked computers, and therefore the tech is called a 'blockchain' by default.\n\
    \nOnce the transaction has been recorded in the system, it can be finished. Basically,\
    \ this is how cryptocurrency transactions like `Bitcoin` work.\n\n### Accountability\
    \ and the removal of trust\n\nThis system has many advantages over banking or\
    \ a central clearing system, doesn't it? It seems unlikely that `Rob` would use\
    \ normal currency instead, doesn't it?\n\nLet's put it this as simply as we can:\
    \ \"The answer is trust.\" `Rob` must know that his bank will protect his money\
    \ and safeguard it because of the nature of his business. Additionally, large\
    \ regulatory systems are created to ensure that banks are working efficiently.\
    \ If you want something done right, do it yourself. The role of the Financial\
    \ Services Authority is to prevent this type of mess from happening in the first\
    \ place. Many banks have made many mistakes in the past, but we have also seen\
    \ this time and time and time again. Power can easily be abused when you have\
    \ a single source of authority. The trust between people and financial institutions\
    \ is uncertain and tenuous: we distrust each other, but not one another.\n\nBlockchain\
    \ systems, however, require you to have zero faith in them. All transactions (or\
    \ `blocks`) must be verified by the network, and committed to the ledger is a\
    \ single point of failure, and an open record of each transaction process is shared\
    \ by all `nodes`. To hack the ledger on a blockchain, an attacker would have to\
    \ take control of hundreds of thousands of `nodes` at the same time, an exceptionally\
    \ difficult task. A system or network hacker would also need to be able to shut\
    \ down all the computer systems distributed across the world.\n\nOne factor that\
    \ must be considered in creating security is the encryption process itself. Decentralized\
    \ verification processes like the `Bitcoin`s are purposefully designed to make\
    \ it difficult to tamper with. Verification is avoided in the case of `Bitcoin`\
    \ because of the processor- and time-intensive calculations required, such as\
    \ puzzles or complex mathematical formulas. Completing the resource validation\
    \ process gets you some `Bitcoins` and a transaction fee. People will be motivated\
    \ to join the network, as there is a strong requirement for fast and capable computers\
    \ as well as electricity in order to run this, and money will be made. This is\
    \ called \"mining\" because it requires a lot of effort (for the machine, in this\
    \ case). In addition, transactions are verified as independent as far as possible\
    \ in the hands of the government.\n\nThis decentralization, democratic, and highly\
    \ secure nature of blockchains mean that they can operate without any government\
    \ intervention (they're self-regulating), but because of it, they're also unregulated\
    \ (unregulated), participatory, and mysterious (decentral and clever). Work that,\
