    # 简介

    在工作量证明的区块链上，其独特的身份和所有权将得到验证。这项技术支撑了大多数知名且流行的货币，如 `BTC` 和 `Ethereal`，以及其他知名代币。`Ethereum`
    平台被大多数 `NFTs` 使用，但人们对使用 `Cardano` 和 `Polkadot` 平台的兴趣日益增长。这解释了为什么 `Cardano` 和 `Polkadot`
    最近在加密货币领域取得了显著进展。


    由于世界上有许多电脑支撑着木工工作，因此无法进行记录。`NFTs` 同样可以进入严密的协议，例如，让工匠在未来的任何符号化交易中获得回扣。是什么阻止了个人模仿计算机手工艺？什么也没有。以
    `$ 6900 万` 的价格出售的人类手工艺已被许多人看到，而且这张图片被多次复制和传播。


    很多时候，工匠保留着其作品的版权，允许他们继续创作和销售副本。然而，`NFT` 的购买者会收到一个证明“原始”作品所有权的“令牌（token）”。一些人将其比为购买了一幅有签名的的版画。


    **数百万美元支付给令牌？** 是的，确实如此。这听起来一样疯狂。


    ## NFT 是如何工作的？

    在底层层面，许多 `NFTs` 是 `Ethereum` 区块链的一部分。`Ethereum` 就像 `bitcoin` 和 `dogecoin` 是一种数字货币；然而，它的区块链同样支持这些
    `NFTs`，这些令牌存储了额外的数据，允许它们以不同于 `ETH` 货币的方式运行。某些区块链能够特定的方式使用 `NFTs` 是重要的。


    ## 在 NFT 超市里你应该买什么？

    `NFTs` 可以是任何领域，可能是任何数字化的东西（绘画、音乐，甚至是你以最高速率下载的大脑，之后这转为了人工智能，但目前的关注点是集中在利用该技术销售所有相关的数字艺术）。


    ## 你的意思是人们为我的优质推文付钱吗？

    我的观点不是没人能阻止你让你无法继续，而是我想说的。很多讨论围绕着 `NFTs` 展开，但仅限于数字艺术背景。


    ## NFT 有多价值？

    从假设上说，任何人都可以为自己的作品签名并将其作为 `NFT` 出售，但最近关于数百万报价的文章已经创造了利润。


    热门的 `Nyan Cat` 动画，那张 2011 年飞行猫的图像，在 2 月 19 日售出了超过 `$ 500,000`。`Grimes` 在半个月后将其部分先锋作品卖了超过
    `$ 600 万`。手工艺并不是赋予令牌并出售的唯一物品。随着高达 `$ 250 万` 的报价，Twitter 创始人 `Jack Dorsey` 推出了第一条
    `NFT''s` 推文。士兰以 `$ 6900 万`（£ 5000 万）拍卖了数字手工艺师 `Beeple` 的 `NFT`，这为数字手工艺设定了高预期。


    尽管如此，作为数字货币，人们对区块链对环境的影响感到担忧。许多人更加悲观。


    根据《50 英尺高的区块链入侵》一作者 `David Gerard` 的说法，`NFTs` 类似于购买像交易卡那样的“官方收藏品”。有些艺术家确实在这些东西上赚了钱……但你可能不会，”他警告道。他将出售
    `NFTs` 的人描述为“加密骗子”。叙述者说：“那些一直干这事的家伙，试图想出一种新型的无价值魔豆，并把它们卖了钱。”持有和购买 `NFTs` 的想法“毫无意义”。购买一个不存在的东西的想法太奇怪了”。我相信投资者是一群混蛋，但我希望他们不要赔掉钱。”


    ## 人们真的相信这会变成一种艺术收藏的形式吗？

    我确定有几小组认真地相信这种方式，类似于某人支付了约 `$ 39 万美元` 观看 `Grimes` 的视频，或者有人支付了 `$ 660 万` 买了一个 `Beeple`
    的视频。说实话，`Beeple` 的作品之一在世界著名的拍卖管理公司佳士得（Christie''s）拍卖售出。抱歉，你当时太忙于点击那个 `Beeple`
    视频并下载那段花费了巨额美元的记录了。


    别嘲笑了。然而，确实，这正是情况变得困难的地方。你可以根据需要制作任意数量的计算机文档副本，包括伴随 `NFT` 的工艺。然而，`NFTs` 旨在给你提供一些你在其他地方无法获得的东西：作品所有权（尽管工匠仍然可以持有版权和传播，例如，身体工艺）。换句话说，任何人都可以通过收集身体工艺来购买
    `Monet`（莫奈）版画。然而，原作只能由一个人拥有。


    并不是想贬低 `Beeple`，那个视频并不完全是一个 `Monet`。你对售价为 `$3,600` 的 `Gucci Ghost` 有什么看法？你之前也没有让我说完。`Beeple`
    的图像被拍卖了。任何真正获得过那幅 `Monet` 的人实际上都会从中看到作为独一无二物品的价值。计算机手工艺的副本可能可以与原作相比。然而，拥有正版 `Beeple`
    带来的自由……


    ## 这的意义是什么？

    取决于你，你是作家还是买家，这取决于一切。


    ## 我可以说，我是最好的艺术家！

    首先，我祝贺你。祝贺你取得成就。你可能对 `NFTs` 感兴趣是因为它们允许你出售一件很难出售的作品。


    ## 如果你为一个 NFT 构思了一个了的想法，你会如何应对？

    可以在 `i-Message App Store` 中出售它吗？这绝对不可能。


    同样，`NFTs` 可以像其他理论资源一样工作，通过获得它，并且理想情况下，它的价格在长期内会上，这样你就可以获利出售。尽管如此，提到它我觉得很乱。


    ## 谁会为一个像交易卡的东西支付巨额美元？

    这在某种程度上让 `NFTs` 变得不那么吸引。少数小组将其视为收集引人注目艺术品的未来（读：作为极富人的游乐场），而另一些人将其视为宝可梦卡（对所有人开放，但此外也是富人的游乐场）。`
    Paul` 最近卖了一些与 `$ 1 百万` 宝可梦卡盒相关的 `NFTs`。


    ## 是的，出售 NFT 视频片段

    是的，出售 `NFT` 视频片段，利润最高达 `$ 20,000`，这些只是你随时可以在 `YouTube` 上观看的视频片段。他同样卖了 `Logan Paul`
    的宝可梦卡作为 `NFTs`。


    '
