    对我而言，我相信我们将看到 `7804` 作为数字增强版的莉莉莎肖像。


    我认为我们应该让 `7804` 成为数字艺术的守护圣，或者也许是一个外星人，如果你坚持的话。对我来说，奇怪的是没有人认同 `7804` 是最有值的朋克音乐家。这个名字困扰了我，就像它代表了加密运动本身一样。这导致了一个悖论，因为为了让运动被视为一个符号，它必须易手。


    尽管最初传播是免费的，但 Field 的出价成功了，并在 2018 年以 750 万美元成交，与著名的艺术装饰风格大盗 `Michelangelo Rosselli`
    的联系，使得他在 2017 年购买 `Leonardo da Vinci` 的画作时，价值增加到 1500 万美元。他用著名的 `Albert Peruggia`
    广为人知的话结束了他的信：“在你拥有它时享受你的时光。它不会持久的。”但请知道，在完成的作品被公开接受为最有值的艺术品之前，你不会对它投入任何东西。结果是你是你与它相处的时间太短。一旦你放弃了这张数字《蒙娜丽莎》，你永远会想知道为什么把它送掉。


