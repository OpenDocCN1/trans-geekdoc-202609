    5. **以艺术家的身份对自己陈述。** 许多画廊和展览都需要艺术家简介，这是对你本人及作品的简要描述。


    6. ) **作为艺术家，要对自己充满信心。** 有一些艺术家，他们完全可以画得画入神，却拒绝利用自己的技能来增加收入。他们想出各种理由来解释自己为什么无法在下一次当地艺术节上设位。“噢，我需要买一个帐篷”，“我不确定我的作品是否卖得出去”，或者“我没有你那么好”，这些都是借口的例子。后者是我最鄙视的。世界上确实有很糟糕的人，也有人认为我的作品很糟，但你猜怎么着？我的作品让我维持了生计。恐惧是所有这些借口的主要来源。作为艺术家，你必须不断前行。


    7. ) **不要放弃。** 遗憾的是，你在道路上会面临障碍和挑战，但最好的解决方案是拍掉身上的灰尘，继续前进。


    # 如何开始销售艺术品


    当你刚开始时，销售艺术品可能是困难的，无论在线还是线下销售都是如此。有许多理论、方法和流程可以帮助你销售作品，每种方法的效果将取决于你的工作方式、你擅长的领域以及你销售作品的决心。


    ### 建立观众


    在考虑如何销售艺术品时，这是一个经常被忽视或被认为是显而易见或常识的因素。如果你没有为你的作品建立观众，卖出任何东西的机会微乎其微。如果你在在线和线下都没有一个强大的观众群体，人们看到你的作品、与你交流甚至购买的机会就会很少。


    如果建立观众对于销售作品至关重要，那么你如何开始为你的作品建立观众的过程呢？


    ### 艺术展会


    当地的艺术展和平价艺术展可能看起来令人生畏，但它们正日益成为民主化的平台，让艺术家能够参与并向广泛的艺术爱好者展示作品。你可以以个人身份或艺术家集体的身份申请展位，在展会期间展示你的作品。如果你提交一份准备充分的申请，你有很大机会被合适的艺术展录取。


    虽然艺术展在让新人们接触你的作品以及让渴望艺术的观众开始熟悉你的作品方面是有益的，但在成本上存在劣势。参加艺术展通常需要支付费用，这取决于你想要的展位大小以及你希望在画展目录等处获得的曝光量。此外还有如何让你的作品在展会的人群中颖而出的问题。


    但不要被吓跑。在艺术展上展示作品的优势可以轻易超过成本。只需在当地规划好你的微型展览，并带上营销材料，如名片、传单，甚至可能还有你作品的小册，供人们带走。


    ### 展览机会


    除了艺术展会，你可能还可以利用你所在当地画廊的其他展览机会，或者你可以举办自己的展览。


    如果你有空间或有能力租赁商业空间，那么举办自己的展览或与其他当地艺术家共同举办展览既有趣又有益。（注：原文此处有大量重复句子，此处已按要求处理）。


    作为艺术家，你必须不断前行。如果你有空间或有能力租赁商业空间，这既有趣又有益。


    ## 推广


    ### 推广你的网站


    你应该在你所做的每件事中推广你的网站，将其作为建立观众和粉丝并从中销售作品的重要工具。你拥有的任何在线简介都应该包含指向网站的链接，你创作的任何打印材料都应该包含你的网址。


    ### 艺术家的社交媒体


    无论你的感受如何，像 `Facebook` 和 `Twitter` 这样的社交媒体平台都是建立观众和展示作品的绝佳工具。你可以利用这些平台分享你的作品并与粉丝联系。


    ### 使用模板建立艺术家网站


    创建一个艺术家网站看起来可能很难，但事实并非如此。现在有很多服务可以让你在不需要技术技能的情况下创建自己的网站。拥有一个网站为你提供了一个展示所有艺术作品的平台。


