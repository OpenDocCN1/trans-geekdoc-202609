    谁会花 20,000 美元买 Logan Paul 的视频剪辑？！


    我想一个手里拿着钱的傻瓜会立刻把钱分得精光吧？


    万一 Logan Paul 选择为类似的视频再出售另外 50 个 `NFTs`，那将是愚蠢的。


    Linkin Park 的 Mike Shinoda（他还为某段旋律卖出了一些 `NFTs`）确实是说：如果一个人真的由于某种方式变成了他所说的“堕落的倾斜的男人”，那么他做出这种事是完全无法想象的。我不是在说
    Logan Paul 是那种人；我是说你必须对购买的对象保持谨慎。


    确实如此，我能像购买 `NFT` 一样购买人类牙齿吗？


    人们已经做出更多尝试将 `NFTs` 与可验证的物品连接起来，通常作为一种检查方法。耐克拥有利用 `NFT` 框架来检查网鞋真伪的专利，这被称为 `Crypto-Kicks`。然而，不，到目前为止还没有更多的牙齿。我都不敢看。


    看？看哪儿？


    许多行业已经涌入 `NFTs` 领域，允许个人对其进行买卖。其中包括 `OpenSea`、另一个是 `Raible`，最后一个是 `Grimes` 拥有的
    `Nifty Gateway`，不过还有更多。


    据我所知，需要很多猫。如果不麻烦的话，告诉我，那些大狗的账户是怎么样的……


    当支持 `NFTs` 作为另一种规范特征的 `Ethereum` 包含了新增的区块链时，它们变得像预期中那样具有创新性且精湛。总而言之，一个名为 `CryptoKitties`
    的游戏（允许客户买卖视觉化的猫咪）是最初的计划之一。网络，万分感谢。


    我喜欢小猫。


    完全没那么简单，这取决于那个为单件物品支付了 170,000 美元的买家。


    啊


    基本上，这些小鸡展示了 `NFTs` 的一个迷人方面（对于我们这些不热衷于构建高级翼蛇工艺的人来说），它们在游戏中的利用方式。`NFTs` 现在就像某些游戏中的物品一样普及。`NFTs`
    可用于出售地块。玩家可以购买游戏武器、头盔，或任何类似 `NFT` 的东西，这些东西可以因人而异。


    我能消除历史中心抢劫案来夺取 `NFTs` 吗？


    那是相反的。区块链的魅力之一在于它记录了所有的交易，使其比历史中心的艺术品更难被盗取和交易。尽管，数字货币以前已经被分配过，所以一切取决于 `NFT` 是如何维护的，以及他们为了拿回资金可能付出多少努力。


    注意：不需要偷窃！求了。


    我应该担心数字艺术在 500 年后仍然存在吗？


    很有可能。我的真实想法包括：图像质量下降、文件格式变得不可读、网站关闭，以及人们忘记了钱包密码。相比之下，博物馆中的物理艺术品是惊人地脆弱。


    我想充分利用我的区块链体验。可以用加密货币购买 `NFTs` 吗？


    是的，确实可以。很有可能。`Ethereum` 被大量市场接受。然而，从技术上出售 `NFTs` 以及使用任何你要求的货币都是非常重要的！


    `NFTs` 会导致全球变暖并引起格陵兰岛融化吗？


    这是一个值得关注的问题。`NFTs` 消耗大量电力，因为它们使用的技术方法与高能耗的加密货币相同。人们正在努力解决这个问题，但许多 `NFTs` 仍与加密货币相关，那是温室气体的主要来源。在了解
    `NFTs` 对气候变化的潜在影响后，一些艺术家决定不再出售它们或取消了未来的发布。我非常感谢我的同事之一，他进行了彻底的调查，这样你就能找到指导，所以请读完这幅画面。


    `NFTs` 存储在被称为数字钱包的钱包中，就像加密货币一样。然而，你始终可以将持有资产的钱包储放在地下地堡的电脑上。


    ## NFT 的机遇


    当你能想象艺术品的转售价值时，`NFTs` 现在是市场上一个非常极具吸引力的机会。这类似于购买物理艺术品。如果你只是打算保留这件艺术品，拥有它不会给你带来任何好处。当然，盯着那件艺术品可能会带给你一种成就感。然而，大钱来自于将那件艺术品卖给出价最高的人。换句话说，如果你能买到独一无二的东西，你就能大赚一笔。


    区块链的完美之处在于它消除了欺诈和盗窃的可能性。会有代码和认证来验证你所拥有艺术品的真实性。


    ## NFT 股票是正确的投资吗？


    当有人在 1 月问你 `NFT stocks` 是什么时，你可能会一脸茫然地看着它们。正如我之前提到的，其中许多与此无关。然而，基于猜测，投资者相信这些公司将接触到
    NFT。


    很难说 `NFT stocks` 从长期来看是否会一飞冲天。看看 2017 年到 2019 年的股票。如果历史有任何参考价值，围绕 `NFT stocks`
    的炒作可能会消失。在所有的炒作中，很容易将其驳斥为永远不会发生的科幻小说。然而，如果我们仔细观察，我们会想象后台正在发生某些事情。我为什么要说这些？根据 `Nonible.com`，去年
    NFT 交易总额达到了 2.5 亿美元。上月 NFT 交易总额超过了 2.2 亿。


    # 第二章


    ## NFT 会是现代艺术的未来吗？


    传统上，任何在互联网上分享、保存或下载的数字艺术都可以被分享、保存和下载。然而，由于任何人都可以使用，并没有强烈的所有感。假设你是一个艺术家，一个非常有才华的艺术家。你还创作了一些令人惊叹的艺术品。但如何把你的创造力投入使用呢？到目前为止，你似乎还没有运气，至少对大多数人来说是这样。然而，有一种方法可以使用
    NFT 给数字艺术个性。


    艺术行业对 NFT 有巨大的潜力。然而，首先，市场必须受到监管。目前还没有规定谁被允许创建 NFT，谁不允许。在此之前，我不会在投资 NFT 股票之前先等待尘埃落定。


    ## NFT 如何震动艺术界？


    根据市场研究公司 `NonFible.com`，NFT 收藏家和投机者今年在各种基于 NFT 的收藏品上花费了超过 2 亿美元。在此之前，一位名为 `Beeple`
    的创意数字艺术家在 3 月 11 日在佳士得以创纪录的 6900 万美元卖出了一件作品。


    '
