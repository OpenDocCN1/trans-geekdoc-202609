    will they know where to begin looking?


    ### How do we manage our Digital Assets?


    Planning and preparing ahead of time, as with everything else in life, can save
    a lot of time and aggravation. My motto is, "Do It Right from the Start!" People
    are becoming more aware of all of this digital information, and there are now
    companies that can assist us in storing and organizing our Digital Assets throughout
    our lives, as well as automatically distributing our Digital Assets on the `Due
    Date`.

    '
  trans: '

    您向全球运输硬盘和 DVD 介质：由于您通过物理介质向全球发送数据，快递公司非常青睐您。然而，我们正处于 21 世纪，以这种方式物理传输大量数据太太 20
    世纪了。有了如今的宽带数据服务，内容可以在几秒或几分钟内交付，而不是几天。最棒的一点是它可以对您的业务来说是完全隐形的，为您节省了时间和金钱。您的快递账单将大幅减少，而且由于即时满足，您的内部和外部客户将更加满意。一个中央
    `MAM` 可以安全地通过互联网协调内容分发。由于 DVD 和其他介质可能会落入他人之手，电子交付要安全得多。谁可以看到哪些内容由 `MAM/DAM` 系统（资产或组权限）决定。如果您需要刻录
    DVD 或蓝光光盘，也可以进行安排。内容可以自动发送到客户所在地或附近的机器人 DVD 或蓝光刻录机上。


    # 结论


    ### 保护您的数字资产 - 从一开始就做对


    保险、事故和死亡都是人们希望避免讨论的话题。人们乐于谈论想买的汽车或电视、喜欢的食物、看过的电影等等。


    然而，尽管我们非常不喜欢讨论保险，但事实仍然是我们购买它——而且是购买很多——是因为我们需要它。我们购买保险是为了保护自己，无论是意外险、房屋险、医疗险，还是保护爱人的人寿险。


    同样的事情现在正发生在我们“数字资产”身上。这些是各种网站、密码、我们的遗嘱、保单以及我们正在快速积累的大量文件和文档。现在有许多事物以数字格式可用，包括书籍、音乐、照片和视频。如果我们相册中有照片，我们可以扫描它们并将其转换为数字格式。现在已经有了电子版书籍（使用如
    `Kindle` 等阅读器）。为了取代纸张，越来越多的机构和企业正通过电子邮件等数字格式向我们发送账单。


    当我去世或丧残时，我所有的数字资产会发生什么变化？这是一个我们不想讨论但应该讨论的大大问题。我的家人将如何发现我拥有什么，以及我打算如何处理它们？即使他们有我的电脑，他们知道该从哪里开始寻找吗？


    ### 我们如何管理自己的数字资产？


    像生活其他其他事情一样，提前计划和准备可以节省大量的时间和烦恼。我的格言是：“从一开始就做对！”人们对所有这些数字信息变得越来越重视了，现在有一些公司可以帮助我们在一生中存储和组织数字资产，并在
    `Due Date` 自动分配我们的数字资产。

