  trans: '

    对于数字或虚拟货币几乎没有建立法规，但现有的法律根据每个司法管辖区的金融法规而大不同：税收、股票、证券、刑事或民事权利、养老、商品或社会安全、消费者保护等。`bitcoin`
    面临的两个主要问题是它是否为法币以及它是否为一种资产。世界上有很多货币被明确规定为另一个国家的货币（例如，政府承认的美元）。德国作为减少交易成本努力全球领导者，允许使用通常被视为私人货币的先验账户单位（a
    priori of account）。在第一种假设下，明显的差异在于，与有形财产不同，数字货币具有被分成许多小部分的能力，尽管是短暂的，但这一点并非显而易见。当一个国家的经济发达时，通常意味着它让数字货币的繁荣变得异常容易。事实上，美国提供了大量的指导，下文所示。资本控制型经济体在隐含上是敌对的，因为它们可以被有效地定义为对自己的货币供应拥有控制权。非洲及少数其他国家的关注点是否将得到进一步考虑？


    显而易见，`bitcoin` 的价值无法通过民主来实现，因为它受到市场力量的影响，这可能会影响我们的社会目标。然而，任何新的加密货币都可能实施更平等的货币政策、金融和治理模型。


    那么如果一种“数字货币”能够对那些社会问题做出真实贡献，例如包容性文化、机会平等或互惠主义；难道那些不是积极的贡献吗？随着 `bitcoin` 等虚拟货币的兴起，加密货币领域的创新步伐加快。


    这些因素影响了货币在带来社会环境变化方面的有效性，无论是通过政治意识形态、经济环境、社区愿景还是个人欲望。在可以创建当地货币以建立更具韧性的地方经济并增强社会福利的情况下，必须对国家货币进行调查。当当前的经济体系出现问题时，人们可以看到此类症状，如社会分裂增加、犯罪率上升、身体健康下降、社会参与度低以及缺乏社区感。


    # 第四章


    ## 区块链 - 面普通人


    传统上，交易需要一个中间人担任桥梁。假设 Rob 想给 Melanie 转账 20 美元，假设他必须交给她价值 10 美元的 `bitcoin`。他既可以给她
    20 英镑现金，也可以通过他选择的 App 转账到她的账户。在这两种情况下，银行都是验证交易的机构：一个是物理取款，另一个是通过 App。交易是否完成由银行决定。每当
    Rob 支付或接收资金时，银行就会更新所有与 `Rob` 有关的交易。换句话说，账本是由银行持有和控制的。


    如果不完全信任他的银行家，`Rob` 就不会冒资金的风险。他需要确信银行不会利用他，或者他不会丢失钱，不会被抢劫，而且钱不会在明天早上无预警地消失。即使在
    2008 年的金融危机期间，当银行被证明是不负责任的时，政府仍然倾向于救援它们并承担信任完全崩溃的风险。


    关于区块链的另一个必须的点是，它们是完全去中心化的。没有像银行这样的中央权威，没有储蓄箱，余额分布在所有参与者中。相反，每个 `node` 都在自己的硬盘上存储一个完整的账本。网络上具有相同账本的节点通过被称为点对点（P2P）的软件连接，这确保了每个人在任何时候都拥有账本的最新版本。


    最先进的加密技术用于在输入每笔新交易时对其进行编码。一旦交易被加密，它被称为一个 `block`，它等同于各种交易的集合。该 `block` 然后被发送到整个节点计算机网络，并在那里通过验证，一旦通过，就会被添加到之前的区块列表中。“链”被称为由多个链接计算机组成的大型网络，因此该技术默认被称为“区块链”。


    一旦交易在系统中记录，它就可以完成了。基本上，像 `Bitcoin` 这样的加密货币交易就是这样工作的。


    ### 责任制与信任的消除


    这个系统与银行或中央结算系统相比有许多优势，不是吗？`Rob` 似乎不太可能使用普通货币作为替代，不是吗？


    让我们尽可能简单地说明这一点：“答案是信任。”`Rob` 必须知道他的银行会由于其业务性质而保护并维护他的资金。此外，建立大型监管体系是为了确保银行高效运行。如果你想把某事办好，就自己去把它。金融服务管理局的作用是从源上防止这种混乱情况的发生。许多银行在过去犯过许多错误，但我们也一次又一次看到。当你拥有单一权威来源时，权力很容易被滥用。人与金融机构之间的信任是不确定且脆弱的：我们互不信任，但彼此并不。


    然而，区块链系统要求你对它们零信任。所有交易（或 `blocks`）必须通过网络验证，提交到账本是一个单点故障，且每个交易过程的开放记录由所有 `nodes`
    。要破解区块链上的账本，攻击者必须同时控制成上万个 `nodes`，这是一项异常困难的任务。系统或网络黑客还需要能够关闭遍布全球的所有计算机系统。创建安全性时必须考虑的因素之一是加密过程本身。像
    `Bitcoin` 这样的去中心化验证过程被刻意设计成难以篡改。`Bitcoin` 避免了验证是因为需要耗费处理器和时间的计算，例如谜题或复杂的数学公式。完成资源验证过程可以让你获得一些
    `Bitcoins` 和交易费。人们会有动力加入网络，因为运行这对于快速强大的计算机以及电力有很强的要求，并且可以赚钱。这被称为“挖矿”，因为它需要大量的努力（在这种情况下是对机器而言）。此外，交易在政府手中尽可能作为独立实体进行验证。


    区块链这种去中心化、民主且高度安全的特性意味着它们可以在没有任何政府干预的情况下运行（它们是自律的），但正因如此，它们也是不受监管的（unregulated）、参与性的且神秘的（去中心化且聪明）。这种工作是在人们互不信任的事实面前进行的。


    等待包含了必须理解的推理，你可能会开始对区块链产生兴奋感。


    ### 智能合约


    '
