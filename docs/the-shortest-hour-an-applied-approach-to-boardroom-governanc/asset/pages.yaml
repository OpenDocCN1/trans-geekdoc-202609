  md: 'from company-operated datacenters and placing them in the hands of a cloud
    provider open new questions such as, “where does my data reside”, “can I perform
    an assessment on the security of my provider”, and other important questions.


    Adversaries understand that these complexities can work on their behalf and have
    targeted many of their efforts on cloud infrastructures. They look for cloud misconfigurations
    by the customer, perhaps inadequate access controls, exposed storage areas, default
    passwords, all within an environment that may not have proper monitoring or logging
    controls. The proliferation of cloud, along with the increased complexity and
    security threats, is enough to confuse even the most cyber-savvy business executive.
    By exploring the main themes of security in the cloud with the CISO, you can better
    understand the business risks associated with its use. Areas to question may include:


    +   1. Does our cloud infrastructure leverage a zero-trust type of model? This
    is to say that the company assumes every user of the environment, and every device
    may be a threat and requires robust authentication and constant validation.


    +   2. What is our level of monitoring for our cloud environment(s)? There are
    offerings for monitoring that look at performance, cloud usage, and costs/fees
    associated with your cloud deployment. Equally important is security monitoring
    from a variety of security and cloud monitoring tools to look for malicious activity
    across all your cloud instances. In both cases of IT and security monitoring,
    it is important to have benchmarks in place that help to identify when a measured
    activity exceeds a pre-determined, appropriate threshold.


    +   3. Do we have strong identity and access management (IAM) processes in place
    for our cloud environment(s)? Ensuring that access (by user, system, or other
    entity) is controlled, authenticated, and monitored is vital for today’s new deteriorated
    network perimeter infrastructure.


    +   4. What security tools do we have in place that protect our cloud environment(s)?
    Ensuring that these tools are present across all your various cloud instances
    (and providers) is critical to provide maximum coverage. Once this has been determined,
    the depth of the security tools is worthy of analysis. Already mentioned was adequate
    access control, and the security platform should address threats related to identity
