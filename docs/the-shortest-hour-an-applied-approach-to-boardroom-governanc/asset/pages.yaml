    done in deploying the solution; it merely reports on the number of data leakage
    incidents occurring but does not block those transmissions. No data classification
    program has been put in place for the company, nor has there been an inventory
    of what types of sensitive data exist in the company or where they reside. The
    company merely installed a DLP solution with factory settings. The audit requirement
    was fulfilled, but the core security issues pertaining to unauthorized data transmissions
    still exist.


    As another example, suppose a user has access to the Enterprise Resource Planning
    (ERP) solution for the enterprise, but the employee leaves the company. External
    auditors identify that the employee retained access to the ERP solution even after
    leaving the company. As a result of further investigation, they realize that network
    access, along with remote access capabilities, was indeed removed from the user
    effectively and in a timely manner. Auditors may say that because the employee
    could not access the network and traverse to the ERP solution where residual access
    remains, no audit finding exists. However, as companies move to more Software
    as a Service (SaaS) solutions, which may not require corporate network access,
    the ability to login to those SaaS solutions still presents a security issue at
    the application level. Both cases highlight the difference in compliance and security,
    and both of these are real-life scenarios I have seen often in my career. Good
    compliance does not equate to good security, but good security can be helpful
    in showing good compliance.


    In 2019, I contributed content to the book, *CISO Compass* by Todd Fitzgerald.^1
    In it, my article called “The Colonoscopy of Cyber Security” further details the
    differences between cyber security and compliance using a life insurance example.
    Comparing the limited medical screening done on behalf of the insurance carrier,
    to my full medical exam completed by my primary physician, I conclude that both
    medical screenings seek to accomplish the same thing: a determination of my health.
    But both do so for very different reasons. The same holds true between compliance
    and security insofar as they both seek to identify a security posture, but they
    attempt to accomplish this for different reasons.'
