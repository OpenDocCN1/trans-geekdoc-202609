- pgno: 146
  md: '# BROWN BAG SESSIONS


    I have found success with adding brown bag sessions to the information security
    awareness program to provide employees with an informal, learn as you wish type
    of service. I am always fascinated by the level of employee interest in these
    sessions, which almost always includes a full conference room or large number
    of virtual attendees. People want to learn more about cyber security and how they
    can protect themselves (and their families) from online threats. This program
    adds one more training avenue for individuals to accomplish that.


    The brown bag program could involve a reserved conference room, or video conferencing
    meeting space, typically during the lunch hour when employees can bring their
    lunch and listen to an informative session on a cyber security topic. At least
    twice per year, we will bring in food for attendees to enjoy as they learn. It
    is an informal, fun way to learn more about cyber security.


    # CYBER SECURITY AWARENESS MONTH


    Each year, October is recognized as cyber security awareness month, a chance for
    companies to highlight the importance of cyber security throughout the month.
    Capitalizing on this opportunity requires advanced planning early in the year
    to create a program filled with activities and learning sessions that invite employees
    to learn more about information security in a fun way. What follows are some tips
    on what my teams and I have created during National Cyber Security Awareness month.


    Promoting the awareness month starts in September with email blasts, posters,
    and a calendar of events that will take place in October. The goal is to generate
    excitement about the month-long event and provide employees with the chance to
    reserve time on their calendars to attend some of the upcoming activities. Pre-planning
    also involves administrative tasks such as booking conference rooms, reserving
    tables and chairs in common areas of the office to set up learning stations, as
    well as ordering any food or beverages for the events throughout the month’s activities.
    Additionally, during the pre-planning phase, arrangements can be made with security
    vendors to provide give-away items for employees such as t-shirts, pens, webcam
    covers, and other small items.


    On the first business day of October, a group of information security employees
    gather at the employee lobby entrance where tables are set up. Posters highlighting
    different cyber security topics adorn the walls of the lobby and tables are filled
    with cupcakes, wrapped in packaging with a note highlighting the internal website
    that details of the month’s activities. This type of welcoming event helps to
    kick off the awareness month and get employees enthusiastic about the upcoming
    events.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'The types of events a company can provide throughout the month are only limited
    by the team’s imagination. Some examples of past events my teams and I have created
    are:


    +   - **Password Strength:** Computers or tablets are set up in common areas for
    employees to stop by and enter in a password they consider to be strong. The application
    provides results of how fast the password can be compromised, the weaker the password
    the faster it can be compromised. Employees enjoy this activity because it is
    a hands-on way for seeing how well they can choose strong passwords.

    +   - **Breach Notification:** A table staged centrally in corporate office’s
    common areas, perhaps the cafeteria, has computers on them for employees to enter
    in their phone number and/or email address. The application will notify them if
    their email or phone were involved in a previous cyber breach.

    +   - **Word Jumbles/Games:** At the beginning of the month, employees can pick
    up a packet with different games such as crossword puzzles, word jumbles, etc.,
    that relate to cyber security topics. Throughout the month, the employees work
    on the puzzles and turn them in for a chance to win prizes.


    An important consideration to make for those companies with multiple locations
    is to ensure that the awareness month activities take place across the various
    sites around the world, each one with as much fanfare as the corporate office.
    This ensures that some employees are not left out of the activities and reinforces
    that cyber security is a global initiative for the company.


    National Cyber Security Awareness month is a fantastic way to focus on the importance
    of cyber security in fun and imaginative ways that employees enjoy. With some
    thoughtful, preliminary planning, your awareness month program can be successful
    in meeting these goals.


    # CYBER SECURITY BRANDING


    Marketing the cyber security program can take many forms, one of the most effective
    ways I have found is to provide branded materials for the employees. The first
    step is to create a cyber security logo, and with the help of the company’s digital
    and marketing teams, I have found wonderful results in developing a cyber security
    “brand” for the company. I typically don’t like to create a logo from scratch
    or one that is vastly different from the corporate brand. Usually, I just leverage
    the official corporate logo with the name of the team, i.e., cyber security, information
    security, information security and Compliance, or whatever the organization’s
    name, under that logo.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'By using the corporate brand, it makes the approval process by corporate marketing
    a bit simpler, not to mention it highlights the already established brand for
    the company. I have steered clear of unique and special logos that are a departure
    from the official company marketing materials, and definitely without stereotypical
    images such as hackers with hoodies or similar references.


    Once the security brand logo has been established, my team and I work to create,
    order, and purchase a wide variety of products with the new security logo embossed
    on them. We traditionally have two tiers of products: Tier One are small items
    such as water bottles, mugs, hats, pens, golf balls, etc., and Tier Two are more
    expensive products (coveted by employees) such as fleece pull-overs, polo shirts,
    backpacks, and the like.


    Tier-One merchandise is good for small giveaways at corporate cyber security events,
    such as the cyber security awareness month activities mentioned previously. Tier-Two
    items are perfect for raffles, handing out to participants of table-top exercises
    and special giveaways.


    In every company I have been a part of, this merchandise was highly desired by
    the employees and helped to strengthen the culture of security at the company.
    Employees talk to one another about how they obtained the item, which can lead
    to more in-depth conversations about cyber security.


    # CYBER SECURITY OPEN HOUSE


    Every cyber security program is a part of the business, an enabler to keeping
    business processes functioning effectively, with the ability to recover quickly
    after incidents. Historically, cyber security was seen as a super-secret society
    that operated in the dark recesses of a corporation, but as the topic has gained
    significant attention, more people are curious as to what the security teams are
    doing to help protect the company. Additionally, they are interested in how they
    can assist in the mission, as well as how they can protect themselves from cyber
    threats. Many corporations have seen the need to bring cyber security to the forefront
    of business operations, recognizing that it is time for security teams to turn
    on the lights and emerge from behind locked doors to share their capabilities.
    A great method to accomplish this is through an annual cyber security open house.


    As a standalone event, or as part of the National Cyber Security Awareness month
    in October, the Open House aims to share all the initiatives that the information
    security organization performs each day to help protect the corporation. My teams
    and I have put together many of these Open House programs during my career and
    each one is met with high enthusiasm from the employees.


    Usually once per year, tables are set up in a corporate office common area or
    large conference room. The tables make up several stations, each one equipped
    with a computer and large monitor facing the center of'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'the room. Behind each table is one or two members of the information security
    team and several small giveaways are displayed on the table for employees to grab.
    Each station represents a specific function or service that the security team
    provides; stations can be devoted to endpoint protection, vulnerability management,
    security awareness, policy management, forensics, and so on. At the specific station
    for endpoint protection, that technology is showcased on the display and the information
    security team members can explain what it does, what they look for, and how they
    react to certain threats. Similarly, the vulnerability management technology is
    displayed with commentary from the security staff on the type of tasks they do
    to find and address vulnerabilities. It isn’t uncommon to have eight to ten different
    stations for an Open House, each one providing a glimpse into a specific service,
    and combined, how they all work together to protect the company.


    Employees can browse each station at their own pace, viewing the technologies,
    asking questions, and learning more about the information security program. Tea,
    coffee, cookies, or other snacks are provided to make it an informal but informative
    event. In my career, these sessions alone have transformed how information security
    is viewed, sending a clear message that cyber security is a part of the business,
    not a secret standalone organization.


    # DYNAMIC AWARENESS: INTERNAL PHISHING CAMPAIGNS


    When I was a young boy in rural Ohio, my mother always told me not to touch the
    stovetop because it was hot. In my young mind I had a notion that touching the
    stovetop would be a negative experience, but it wasn’t until I actually touched
    it one Sunday morning that I realized why she warned me. It became personal to
    me. Through this empirical knowledge, I more effectively learned not to touch
    the stovetop. So powerful was this lesson, I remember it today, decades later.


    Security is personal too; it is a state of mind that we have and is quite embedded
    in our nature. For example, if we hear of an uptick in violent crime halfway across
    the world, we are certainly sympathetic to the affected people and hope that the
    perpetrators responsible for the violence are quickly brought to justice. But
    if that same increase in violent crime occurs one block away from our own homes,
    we go on alert much more than when we hear about it occurring so far away. It
    became personal to us.


    Security awareness training can often be looked upon in the abstract, with employees
    understanding that phishing attacks happen in the world, but the awareness activities
    are not personal to the employee. How can we make the training about the dangers
    of phishing more impactful to the end user? One answer lies in dynamic security
    awareness activities such as phishing our own employees.'
