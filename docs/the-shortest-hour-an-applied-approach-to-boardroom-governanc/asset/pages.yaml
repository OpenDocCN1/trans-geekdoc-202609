  md: 'that can be used as corporate standards which can provide employees with the
    ability to leverage AI types of technologies that have been reviewed by security.
    Aside from the security benefits, standardization of technology also helps with
    controlling overhead costs. Without clear guidance, corporate teams from all over
    the globe may leverage disparate technologies based on team preferences, which
    can drive up costs. Channeling users to a few specific technologies and documenting
    the few exceptions for non-standard use could help reduce the costs of leveraging
