  md: '# Chapter 16


    # Risk management


    The concept of risk management is certainly not absent from the work you perform
    as a director for a company. To be sure, you are actively engaged in multiple
    types of business risk, whether it be regulatory, financial, supply chain, or
    a host of others. There is no shortage of potential risks that emerge every year;
    we have recently seen variable levels of risks associated with the pandemic, wars,
    and economic uncertainty that impacted the risk universe for many companies. To
    keep track of these fluctuating risks and their potential impacts, corporations
    have leveraged enterprise risk management (ERM) programs.


    For each and every company that I have been a part of, cyber security, or specifically
    a cyber breach at the company, has been either the number one or number two identified
    risk on the prioritized ERM inventory of risks. At this stage in this book, you
    have a good grasp of the many different risks associated with cyber security,
    the work that your security team (and other employees) are doing to protect the
    company, and the potential impacts of a cyber breach. It makes good sense then
    that security is top of mind for the ERM program.


    Involvement in the ERM process by the CISO can vary widely, some an active participant
    in the recurring meetings with executives, while others may just update cyber
    security content for the materials used by others in the ERM meetings. It is my
    belief that if a risk is so prevalent among ERM groups across companies spanning
    multiple industries, and that risk is considered so high as to rate in the top
    five risks for the company, it makes good sense to have the CISO as part of the
    ERM meetings and discussions. Besides the ability to talk about the general risk
    of cyber breaches for a company, the CISO can explain the details of contributing
    risks that feed into those general concerns.


    Highlighting the downstream risks and how a corporation addresses them provides
    more details that speak to the likelihood of the macro cyber risks outlined in
    the ERM process. Usually done through what is called a'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'risk register, the CISO and team outline all of the risks associated with cyber
    security for the company. Examples could include the inconsistent management of
    privileged accounts, or perhaps inadequate network segmentation to limit the level
    of access to sensitive data.


    The risk register is not a one and done activity; it requires constant attention
    because, as you have read throughout this book, risks and threats evolve based
    on numerous internal and external factors. A shift in business strategy could
    significantly swing the risk posture of the company. As such, the risk register
    work is worthy of frequent nurturing.


    There are many good platforms to conduct and maintain a risk register program.
    Due to its dynamic nature, such platforms are better at outlining risks than static
    spreadsheets that live on one or two employees’ computer systems. Automation provides
    up-to-date information with workflows built in to allow for multiple people to
    develop and provide oversight over the risk program.


    A multitude of risk frameworks, 9 and 12 box approaches, and other standard risk
    tools are available. Exploring each one is not a goal of this book, rather, it
    is just worth noting that whichever methodology is chosen, it should be standardized
    across your company so that everyone is speaking the same risk vernacular and
    with the same goals in mind.


    Once all of the risk data mentioned thus far in this chapter are collected, the
    executives can begin to have a discussion and make decisions. After all, that
    is the goal of a risk management program, not to eliminate risks one hundred percent
    but to drive decisions on how a company addresses those threats through acceptance,
    transfer, or mitigation.


    # THIRD-PARTY RISK


    We rely on partners, suppliers, and service providers to help optimize our businesses;
    each one contributing to our success by providing important capabilities, leaving
    us to focus on our core business. In many cases, we leverage their technology
    offerings or have network connections into their infrastructures so that real-time
    data and services can be delivered. Yet, along with these important partnerships
    comes risk.


    Adversaries target service providers with this in mind, hoping that a breach of
    a partner can lead to lateral movement to its clients. It is important that the
    third parties we leverage have strong security programs which can help reduce
    easy opportunities for adversaries to be successful in their attacks. The difficulty
    is that third-party partners operate their own security programs, without oversight
    from your security organization. So how can companies protect themselves from
    the secondary effects of a partner cyber event? Many CISOs have built security
    services which seek to evaluate the security posture of a partner to determine
    any risks associated with conducting business with them.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'The first component of a good third-party risk program, like so many other
    programs within cyber security, lies in good asset management. Identifying all
    of the third-party partnerships via a complete inventory of providers is the first
    important step. You cannot measure and assess risk for unknown partnerships. In
    many cases, the IT organization will understand many of the business relationships
    through the integration services they provide. But increasingly common are partnerships
    that do not go through IT and are referred to as “shadow IT”. Perhaps a partnership
    was completed by a specific line of business, functional area, or a geographical
    region of the company; these partnerships are more difficult for the CISO to inventory.
    This struggle is often reduced through building internal relationships, perhaps
    through a BISO or cyber risk partner that was previously discussed in this book,
    to understand strategies across the various business entities. When there is still
    ambiguity for all the external relationships across the company, I’ve found success
    in a simple mantra: follow the money. At some point, through some channel, there
    may be evidence of the costs associated with leveraging a partner. Working with
    finance, I look to identify any service costs linked with external entities that
    my team and I are unfamiliar with.


    Whatever process is used, the inventory should be as complete as possible and
    incorporate all types of partnerships. Often, we may focus on obvious major partnerships
    with Fortune 100 technology corporations or service providers, but the list should
    include seemingly benign types of engagements as well. Things like manufacturing
    equipment suppliers, maintenance services, robotics, heating/ventilation/air conditioning
    providers, and other types of engagements may not immediately come to mind as
    one that would introduce risk into our company. Any network connection or partnership
    could be a potential vector for attack.


    When a new partnership is being considered, a popular process for evaluating third
    parties is through a vendor risk assessment. Questionnaires may be used to collect
    specific types of security information from the vendor, along with any formal
    documentation the vendor may share (i.e., SOC 2 reports that specify how they
    manage customer data, etc.). Some security teams may use different questionnaires
    based on the type of engagement that the company is considering with the partner.
    Vendors who do not deliver core or connected services may be given an ultralight
    questionnaire that covers only the basics because the likelihood of risk in doing
    business with them may be lower. At the opposite end of the scale, a scale that
    could include several intermediate levels, are those vendors who are deeply integrated
    into your company’s infrastructure and/or can access consumer or other sensitive
    data. The potential for risk is much higher for doing business with these types
    of engagements and as a result require an extensive questionnaire. These questionnaires
    are sent to the vendor, preferably through an automated system rather than attachments
    going back and forth, and after completion the vendor returns the questionnaire
    for a risk assessment.'
