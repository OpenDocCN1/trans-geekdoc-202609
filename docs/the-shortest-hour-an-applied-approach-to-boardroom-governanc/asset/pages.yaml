    # BOARD GOVERNANCE


    What could a high-performing board governance model for cyber security look like?
    Much as is the theme of this book, because every corporation is different, each
    company will have its own view of what success looks like in governing the cyber
    security program. What follows are some general themes based on personal experience,
    with an eye to the SEC rules previously outlined in this chapter.


    # THE CISO


    You have read about the role of the CISO in the early pages of this book and the
    importance of placing a well-qualified expert with extensive business competencies
    as your leader of the cyber security program. Hiring the right person for your
    corporation requires your significant input into the recruiting process. Whether
    it is the identified director with cyber security expertise, a committee chairperson,
    or a panel of board members, interviews with the final candidates should include
    at least one at the board level. Having knowledge and confidence in the expertise
    of the incumbent is critical. It is my belief that to garner that confidence,
    direct involvement in the selection of the person is required.


    For those companies who have proactively included a CISO into their business,
