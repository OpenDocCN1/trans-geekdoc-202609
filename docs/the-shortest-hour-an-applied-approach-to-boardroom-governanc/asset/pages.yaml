    # GIVING UP ON THE CISO ROLE


    As I write this, there are a few industry articles discussing the need to re-evaluate
    the CISO role due to its perceived failure. Failure in its evolution and planning,
    failure in its transition to be looked upon as a peer executive, and failure to
    align its focus outside of solely operational initiatives. Many authors of these
    posts mention the difficulty in finding CISOs who possess strong business experience
    in addition to the cyber security expertise needed. High stress, short tenures,
    and CISO accountability issues in the wake of breaches are also mentioned – all
    topics we’ve explored together earlier in this chapter. To alleviate these concerns,
    some argue the industry should come to terms that the CISO role failed and look
    for alternatives to address cyber risk among corporations. For the most part,
    I agree with all of these authors about the history and the issues that have arose
    with the CISO role as it matured. It is natural to have growing pains. Where our
    opinions differ is the manner in which we should address the matter. Rather than
    call for the demise of the role at the same time as regulatory requirements and
    breaches increase – my focus is to enhance the role through awareness, feedback
    loops, and creating an environment in which the role can add even more value.


    Proponents for moving the CISO role down a few organizational levels and re-focusing
    it on technical issues may suggest a different role to elevate to the executive
    team: the chief security officer (CSO), chief risk officer (CRO), or something
    similar. This role would lead a cross-functional team of cyber security, physical
    (corporate) security, risk management, business continuity, and perhaps privacy.
    With this model, the executive is now responsible for even more initiatives than
    the CISO, with the expectation that having more programs to oversee would somehow
    allow for increased adoption of the role by executive teams. I see the opposite
    happening: a dilution of focus on cyber security by adding more functions. Cyber
    security is much too important for our companies to move it down the organizational
    chart. I have served as a CSO for two corporations; additionally, I have seen
    how the disciplines of cyber security, corporate security, business'
