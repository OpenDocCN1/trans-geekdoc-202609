  md: 'misconfiguration, denial of service incident, lost or stolen device, privilege
    escalation, suspicious network activity, and a host of others.


    The format is flexible, the documentation can take the form of a Wiki, or perhaps
    formal documentation in a data repository – all of which are secured with strong
    access controls, up to potentially leveraging multi-factor authentication.


    # TECHNOLOGY


    With so many different types of security technologies in use at your company,
    it is imperative that information is retained for each one. Some data that may
    provide value in the operational model could include:


    +   - General information on the technology

    +   - Whitepapers, research, and industry reports from the vendor

    +   - Contact information for the vendor, account rep, technical support, etc.

    +   - Copies of the contract/renewal

    +   - Implementation notes from the professional services team

    +   - Configuration data


    In doing so, the information is readily available to the entire team rather than
    residing on one person’s computer.


    # DATABASE OF INFORMATION


    A perennial activity for most cyber security teams is answering a questionnaire
    for any variety of purposes. It may be for compliance reasons, cyber insurance
    policies, or perhaps general questions about the infrastructure size/type for
    scoping exercises when exploring new technology purchases. Rather than treating
    each questionnaire individually by assembling a team to research the answers,
    I have found that a one-to-many approach is much more efficient. The questions
    and answers are entered into a database of responses, always available, and can
    be leveraged to answer multiple types of inquiries. If new questions are asked
    that do not have a response, they are added to the database. Following this methodology
    means that only at regular intervals, perhaps annually or after a large change
    in the corporate infrastructure, the responses are checked to ensure they remain
    accurate.


    Value can also be found in storing reference architectures. These architectures
    provide a baseline approach to implementing a system and may include diagrams,
    process flowcharts, and other types of reference materials. Lastly, industry documentation
    such as common frameworks is a valuable addition to the operational model.'
