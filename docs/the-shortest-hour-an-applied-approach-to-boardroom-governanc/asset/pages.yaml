    have realized the importance of one of the key tenets in an effective CISO’s competencies:
    communicating in such a way to make the decision-making process easier for the
    audience. Lastly, it may prove beneficial to have a member of the CISO’s team,
    perhaps a high-performing leader, attend the meeting to give them exposure to
    the executive team and serve as a scribe to take notes and minutes from the meeting.
    Rotating multiple, high-performing employees into this administrative role could
