- pgno: 11
  md: '# About the Author


    ![](img/1f2064bafeb84712e9a55bdb844d2074_11_0.png)


    Lee Parrish is an award-winning technology executive with over two decades of
    unique experience in blending cyber security expertise with essential business
    competencies. As a chief information security officer, he has built customized
    cyber security strategies for global Fortune 500 corporations and has led real-world
    incident responses to cyber events. Lee has served as a trusted advisor on cyber
    security to multiple boards consisting of chief executive officers, a former White
    House chief of staff, retired high-ranking military officers, and a former U.S.
    Presidential candidate.


    Lee possesses two graduate degrees and is certified as both a Boardroom Qualified
    Technology Expert and a Certified Information Systems Security Professional. He
    has published numerous articles in industry journals, contributed to a best-selling
    information security book, and authored a children’s book on cyber security. He
    is a frequent speaker at international security conferences and a guest on various
    podcasts.


    Lee is a combat veteran of the United States Marine Corps.'
