  md: '# Chapter 3


    # Security vs. compliance


    It is important for me to begin this chapter by stating that compliance to regulatory
    requirements is of the utmost importance and I would never suggest that adherence
    to them is a wasted effort. With that said, I believe that there is a vast difference
    in compliance and security, with many opportunities to enhance the way corporate
    governance boards view compliance as it relates to cyber security. More to the
    point, one only needs to look at the typical board committee that discusses security,
    traditionally the audit committee (more on this later). Security is often viewed
    as a compliance or audit issue rather than what it could be viewed as a business
    risk issue with deep technological underpinnings.


    At first glance, bundling information security into compliance seems to make sense,
    after all, they are typically bound by similar topical areas. For example, reviewing
    effectiveness in user access reviews by the external auditor does indeed relate
    to the identity and access management domain in security. Another reason for combining
    the two is that packaging security into compliance is much easier when it comes
    to audit remediation. If I present a business case to management for approval
    and I tag on the statement, “this will address one of our audit items”, the approval
    process will typically be easier for me. That is because, in part, the audit item
    involves a project that has a start, a middle, and a finish. One can see, and
    measure, the adherence to a specific finding until its completion. With information
    security, there often isn’t such a clean process; even after implementing a project
    that deploys a security technology or process, a breach may still occur. Among
    all the content within this book, this is the most critical statement worth remembering:
    information security is not a project, instead, it is a program that requires
    constant nurturing and adjustments to make it effective – it has no completion
    date.


    For example, perhaps there is an audit finding that says there should be a security
    control such as a data loss prevention (DLP) technology deployed across the company.
    That audit project starts with the finding that no DLP solution exists within
    the company to protect against sensitive data leakage.'
