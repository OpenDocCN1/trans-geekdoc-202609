    | Policy management | Policy structure | Does the company have a robust cyber
    security policy program in place?<br><br>Are the documents separated by policy,
    procedure, standards, guidelines, etc., or are they all combined in one long hard
    to read document?<br><br>Are the policies written (as much as possible) in language
    that is easy for employees who may not have technical knowledge to understand?<br><br>Are
    policies brief, succinct, and reference more detailed documentation such as procedures,
    standards, and guidelines?<br><br>Are the policies easy to access by all employees?<br><br>Is
    the policy management program automated to reduce multiple versions of documents
    being sent back and forth via email?<br><br>Is there a waiver process in place
    that allows for temporary relief from mandates to allow users/teams to come into
    compliance? |

    | Risk management | Enterprise risk management | Is the CISO an active participant
    in the ERM program or do they merely update cyber security risks and deliver them
    to a larger team where someone else presents and the team discusses? |

    |  | Risk management process | Does the risk management process include the creation
    and ongoing maintenance of a risk register to log applicable risks to the enterprise?<br><br>Is
    the risk register reviewed and updated regularly? |

    |  | Third-party risk | Does the company have a robust program for assessing the
    risk of third-party partners and vendors? |'
