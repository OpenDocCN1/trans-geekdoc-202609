  md: '# COST OF THE SERVICE


    Not all companies allocate security costs by services provided. Some may do a
    general security allocation based on the number of employees or by email accounts,
    and others may do no allocation at all. Even without a cost allocation model,
    capturing the internal costs associated with providing the service can be beneficial
    in future demand management forecasting. This section of the service description
    highlights the labor costs for the time anticipated in providing the service,
    plus any additional internal or external costs that may be incurred in its delivery.


    It has been outlined previously that security services are more cost effective
    and with fewer project schedule delays when the information security team is brought
    into the initiative during its earliest stages. To help promote this, the service
    catalog highlights the varying levels of a service available to the requestor,
    possibly in the form of standard, gold, and platinum services. For example, if
    a requestor would like a vulnerability scan of a specific system tied to one of
    their critical processes, the standard service option may detail that the scan
    and subsequent reporting of results will take five business days. In some cases,
    the requestor may explain the service is just what they need, but they require
    it to be completed in three days. Security can still provide the service, but
    this gold level requires a 2x multiplier to the standard labor cost associated
    with the service. Perhaps the requestor would like the service, but time restrictions
    require the service to be completed in one business day. This platinum service
    includes a 3x multiplier to the standard labor cost due to the aggressive schedule.
    We see this type of service option when we order products online and are contemplating
    shipping options. There are standard shipping times, as well as a host of other
    options up to and including next day air, that deliver the product according to
    the consumer’s need. However, the product ordered is still the same. Incorporating
    these levels in a company that allocates costs based on services helps to incentivize
    earlier engagement of security. For those companies that do not do such allocation,
    this level of detail is still a benefit for planning purposes related to demand
    management by looking at trending data of how services are typically ordered and
    on what timeline.


    # SERVICE OPTIONS


    For an information security service, typically there are no alternative options
    available (or permitted) for the person requesting services. A requestor cannot
    leverage a third party of their choice to perform security offerings in a chartered
    information security program because the cyber security organization has been
    authorized by the executive'
