    As a technology industry, we’ve seen other roles marked for extinction as well.
    Going back ten plus years, more than a few consultancies discussed the demise
    of the CIO role, the top executive responsible for the information technology
    program, replacing it with other roles. A decade later, the CIO role is still
    a prominent role across executive leadership teams.


    Filling a critical role like the CISO takes strong engagement by the management
    team and board of directors, with some potential assistance from external professional
    service providers. The time invested in researching and drawing out the needed
    attributes for a CISO among your candidate pool will provide large dividends.
    A popular saying that I never grow tired of hearing is “always do something today
