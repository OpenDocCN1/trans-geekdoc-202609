    # CYBER RISK OVERSIGHT


    One of the rules from the SEC requires disclosure on a company’s processes for
    identifying and managing cyber security risks and threats. Such disclosure would
    require a significant amount of awareness to these activities by the board, in
    order to deliver more than just a macro-level response to broad cyber security
    themes.


    In my junior high school math class, our teacher’s homework assignments comprised
    of working through various math problems and writing the final answers for her
    to grade. As we progressed in the year, we tackled more complex mathematical topics,
    including algebra. Sometime around the halfway point of the school year, as the
    work became more difficult, my teacher asked us something that many students dread
    to hear when it comes'
