    company’s financial strategy, preferences, and regulations related to capitalization
    versus operating expense. As a result, ensuring the CISO’s plan is closely aligned
    with these corporate goals and preferences are important and should be explored
    in the strategy discussion.


    # TIMING OF INVESTMENTS


