  md: 'confidentiality. The discipline emphasizes our duty as communicators and listeners.
    Communication consists of an originator and a receiver of a message. The duty
    for clear and effective communication, ensuring the message is understood by the
    audience, lies with the originator. The discipline states that it is unethical
    to waste the receiver’s time and energy with unclear communication.


    Exceptional CISO candidates will demonstrate the ability to convey their message
    in such a way that it makes it easy for a listener of all skill levels to make
    solid business decisions. In other words, they understand the requirement for
    clear communication lies squarely on themselves. My approach to communicating
    a security strategy to an executive management team involves several conversations.
    If I know that I will be presenting my proposal to the CEO in the near future,
    I’ll create several versions of the strategic plan and have conversations with
    different members of the CEO’s direct staff.


    I will meet with the chief HR officer to discuss the labor aspects of my plan,
    outlining the critical skill sets needed for the security team, our skill gaps,
    and the number of FTEs I will need to execute the plan. We discuss training, geographic
    regions where I will be placing employees, and why the choice of regions provides
    value to the strategy. There is a conversation about the industry gap in well-qualified
    security experts and how I plan to address it. Perhaps we will discuss internships
    or potentially cross training employees from different departments on cyber security
    disciplines. At the end of the meeting, the CHRO completely understands the HR
    elements of the security plan.


    Next, I move to a one-on-one discussion with the CFO to discuss the financial
    aspects of my strategy. We focus on which initiatives can be capitalized and which
    are operating expense. Also important in this conversation are when each initiative
    will hit the budget in the fiscal year and what can be delayed. I highlight the
    labor costs as well as technology costs, with an explanation of what I plan to
    outsource and what will be built in-house.


    One of the final conversations is with the CIO in which we discuss the technology
    attributes of the strategy. How can we leverage existing technology partnerships
    and what capabilities need to be added to fill a gap? We explore how my proposed
    technologies will interact with currently deployed IT technologies or perhaps
    the potential latency impacts to systems as a result of an added security technology
    on top of it.


