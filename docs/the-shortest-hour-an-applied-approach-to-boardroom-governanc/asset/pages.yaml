- pgno: 54
  md: '# Chapter 6


    # The strategic plan


    Building a cyber security strategic plan for a company requires close integration
    with the goals of the business and is dependent on a wide array of factors which
    make it nearly impossible to transfer one corporation’s security strategy to another
    organization. Each company has a different risk profile, current security posture,
    and financial position that affects the timeline of the strategy.


    While many management teams focus on three-year strategic plans, others may accelerate
    their cyber strategy due to specific risks to the company or perhaps critical
    gaps that cannot wait for progressive improvement. The availability of free operating
    cash flow to fund the security strategy is different from company to company which
    requires even more reliance on risk-based security investment decisions. Whatever
    timeline a company chooses to deploy their strategic plan, it is important for
    you to remember that the velocity of cyber risk moves very quickly, and three
    years can equate to a lifetime in the world of information security.


    A good cyber strategy is one that prioritizes on risks to the company and doesn’t
    try to quickly address every single need in the security domain. Your CISO should
    deliver a plan that takes the needs of the business (not just cyber security needs)
    and puts them into a realistic timeline that allows for efficient risk mitigation,
    not all at once, but not over the course of several years either. This is the
    point in time in which all the due diligence you’ve demonstrated in searching
    and selecting a CISO with strong business expertise (and at the same level as
    the other C-level executives of your team) pays dividends.


    It was previously mentioned that a good briefing is done in such a way that facilitates
    easier decision-making for the management team. To accomplish this, cyber security
    strategies should have, at a minimum, three distinct categories: people, process,
    and technology. While they collectively are part of the larger cyber security
    strategy, each can be discussed individually with those executives of the management
    team responsible for those areas to gain their insights.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'What follows is an in-depth view into each of the three categories mentioned
    previously, as they relate to building the cyber security strategy. Of course,
    each strategy will vary from CISO to CISO, but I have found that the tips I offer
    in each of the following sections have proven successful across the global corporations
    in which I was fortunate to have worked.


    # PEOPLE


    Security vendors will sell their technology to anyone; they are not providing
    products and services to some CISOs and not to others. Each CISO is on a level
    playing field when it comes to security technology. Similarly, each CISO has access
    to best practices, research, and templates to deploy best of breed processes.
    Again, CISOs are on a level playing field in this area as well. *The true differentiator
    in a cyber security program lies in its people.* It is this category that separates
    the great security programs from the merely good ones.


    Unfortunately, a quick scan of industry research will show that there are many
    cyber security jobs that go unfilled each year due to a shortage of available
    talent that possess these specialized skills. The number of unfilled jobs varies
    from report to report, but the bottom line is that our industry has more demand
    than resources to fulfill them. CISOs must take this barrier into account and
    imagine innovative ways to staff a security program and do so in a cost-effective
    way.


    In the past few years, as the importance of cyber security grew even more and
    the talent gap widened, many people looked to the security industry as a logical
    choice for entering (or transitioning to) the field. As a hiring leader, a majority
    of the resumes that find their way to my inbox today are candidates with one,
    two, or three years of experience. In many cases, the resume has no security experience
    at all, but the candidate took a course to obtain a security certification in
    hopes of improving their hiring chances. Certification companies jumped at this
    market opportunity to provide “boot camps” and other fast certification prep courses
    to those who wish to accelerate their entrance into a hot industry. While these
    courses may provide theoretical foundations, they do not provide the hands-on
    type of experience that may be desired by companies to perform more advanced security
    roles.


    The ability to fully staff a complete team of cyber professionals with five or
    more years of experience, preferably ten years, may not be feasible unless the
    company is willing to pay well over market for such talent. CISOs who promote
    strategies that include staffing the entire team with highly experienced security
    practitioners may not have realistic expectations for acquiring such a qualified
    team and as such, that strategy should be challenged.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'I have found success in building teams by seeding the organization with just
    a few highly qualified candidates, and then filling the rest of the team with
    individuals who may not have significant cyber experience. In more than a few
    cases, I selected candidates with no security experience but had long tenures
    in the information technology field. The most critical attributes CISOs should
    look for in their non-security candidates are enthusiasm and curiosity. Individuals
    who demonstrate an energetic, highly enthusiastic manner are often the ones who
    reach out to others to consume the most knowledge they can on their new field.
    They typically volunteer to take on tasks so that they can acquire the knowledge
    to advance their career.


    Another critical attribute for candidates is curiosity, the ability to question
    how things work. They look for the unintended uses of a technology and imagine
    how these unintended uses can be leveraged to bypass controls. These candidates
    will follow a potential issue all the way until it is fully understood. This is
    exactly the mindset that our adversaries have and to find candidates who possess
    this curiosity, but with an intent to do good, is extremely valuable.


    Once I staff my team, I put them all together (in a room or virtually) so that
    they learn from one another. The experienced employees provide mentorship to the
    new teammates without cyber experience, and the new employees help to spark innovation
    by questioning the tenured teammates on the traditional ways of doing things.
    I have seen this strategy play out at multiple security programs I’ve led and
    the benefits of doing so have created productive, long-tenured security employees,
    nearly all of whom are still in the industry today and contributing greatly to
    our field.


    Training for the cyber security staff is a critical element for the organization
    not only because it lends itself to retention of valuable resources but also assists
    in maintaining optimal operational capabilities of the security program. Training
    is important for all employees, but within cyber security, where risks evolve
    so rapidly, it is a necessity.


    My goal is to attain a 70/20/10 rule when it comes to training. Seventy percent
    is actually doing the job, working with fellow teammates to complete the tasks
    at hand and learn from one another. Twenty percent is the training that an employee
    does on their own, perhaps reading books or looking online for opportunities to
    learn more about cyber security. The last ten percent is formal training, whether
    it is an industry conference or classroom instruction. While most employees tend
    to focus on the ten percent, I believe the remaining ninety percent is just as
    important to providing staff with security knowledge. Nevertheless, providing
    opportunities for security employees to attend conferences and interact with other
    members of the industry to share valuable information, and garner new relationships,
    should be a key component to the people aspect of any security strategy.


    The CISO should place an annual budget placeholder in the strategic plan to address
    security training needs for the organization. Typically, I allot for'
