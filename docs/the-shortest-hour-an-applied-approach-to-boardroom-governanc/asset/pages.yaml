- pgno: 176
  md: '| Topic | Questions |

    |---|---|

    | **Incident response plan** | Does the company have a well-documented incident
    response policy and plan? Is it well understood by all stakeholders?<br><br>Is
    the response plan updated regularly?<br><br>Has the response plan been reviewed
    by an external cyber security firm to ensure completeness?<br><br>Is the plan
    made up of all core elements such as reporting, roles/responsibilities, communication
    plan, and incident handling procedures?<br><br>Does the incident response plan
    include external stakeholders such as outside counsel, external PR firms, etc.?<br><br>Is
    there an “out of band” communication method in case the internal communication
    channels (corporate email) are compromised or out of service? |

    | **Response activities** | Does the plan include resource allocation, sending
    some employees home at the start to ensure there is a fresh team of responders
    after the first team has worked for many hours?<br><br>Is there a mechanism for
    tracking the time all responders (internal and external) working on the response
    so that costs associated with the incident can be calculated?<br><br>Is there
    a pre-developed process for communications to employees, external partners, and
    customers?<br><br>Are there appropriate resources available for the many requests
    for information by partners? |

    | **Ransomware response** | Is there a pre-determined process for deciding if
    a ransom will be paid or not paid? |'
