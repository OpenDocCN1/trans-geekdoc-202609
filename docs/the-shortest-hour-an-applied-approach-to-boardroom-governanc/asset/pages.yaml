- pgno: 68
  md: '![](img/1f2064bafeb84712e9a55bdb844d2074_68_0.png)


    *Figure 6.2*  Centralized security model.


    the CEO of the company. The Charter dictates that information security is critically
    important to the company, that security is every employee’s responsibility to
    help protect corporate resources, and the CISO (without specific names) and their
    organization are responsible for the creation and operational oversight of the
    company’s information security program. This simple document outlines clear responsibilities
    for all stakeholders and enforces the centralization of the security program.


    Following a centralized model does not mean that regional considerations cannot
    be met. It is valuable for a global corporation to sprinkle security resources
    across multiple geographic regions to provide close touch service to local support
    needs. Achieving a balance between this regional support and federation of an
    enterprise program is not easy; local resources may lean more heavily on the geographic
    area in which they sit. However, if done correctly, the enterprise program can
    enjoy a global style of support, and employees across the globe can gain experience
    in working on multiple different initiatives outside of their country.


    The choice between a centralized and de-centralized model should be made after
    significant analysis of the speed and cost of security services provided to the
    corporation is measured. Once a decision has been made, whichever it may be, organizations
    should maintain this model and squelch the sporadic building of additional cyber
    security teams.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# TECHNOLOGY


    It is no exaggeration to say that the cyber security technology market has exploded
    in recent years. At security conferences each year, organizers are adding more
    and more technology showroom floor space to accommodate the influx of new cyber
    companies. CISOs are bombarded with cold calls on office phones, mobile phones,
    email, text messages, social media, and informational mailings, to introduce new
    (proposed) best of breed capabilities that could displace other security tools
    and provide the CISO with a more accurate view of threats in a “single pane of
    glass”.


    Today’s security product industry is heavily focused on a marketing-driven strategy
    that often claims to solve nearly all the security woes for a company. Unlike
    other industries where customers dictate the demand and the natural market evolution
    follows (i.e., the elimination of certain styles/models of vehicles due to a lack
    in demand), cyber security companies often look to dictate the security demands
    for the consumer, telling the customer what they should be concerned with, along
    with a special product that addresses all those demands. As CISOs continue to
    do more in clearly conveying their needs to reduce risk, this trend will reverse
    itself to better align with a consumer-driven demand cycle. Until this is realized,
    our cyber industry will always have security vendors offering up products that
    seemingly provide a quick fix to a problem that doesn’t have a quick fix.


    Yet vendors in the cyber security space are very much needed and many provide
    exceptional products and services. Together as partners, security teams and vendors
    work to stifle the onslaught of breaches. It is up to the CISO to evaluate capabilities
    and find those vendors who seek to be the best in their field with a significant
    focus on quality of service.


    Acquisitions are rampant in the cyber market with companies acquiring startups
    and other corporations to expand their security portfolio. Previous niche players
    have been woven into large cyber security juggernauts that can provide an offering
    to a multitude of security needs. Often these vendors look to consolidate all
    security products for a customer into one platform, eliminating a consumer’s need
    for multiple security suppliers. You should look for strategies within the technology
    section of the CISO strategic plan that discuss the blending of vendors, versus
    an all-in-one security provider, to determine how the choice was made.


    Like so many other areas of the strategic plan (and quickly becoming a main theme
    for this book), there is no one strategy that fits all corporations. However,
    thoughtful research into the risks and financial aspects of each technology strategy
    should be demonstrated in the plan. Having many unique products often provides
    very good capabilities because each vendor focuses on one thing and, as a result,
    may do it better than their competitors. Leveraging multiple security vendors
    though may introduce more complexity when weaving the different solutions together,
    ensuring'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'that they complement one another, and avoiding negative interoperability issues.
    But by consolidating security technologies to one vendor, it may raise the risk
    of “having all your eggs in one basket” which could cause disruption if a significant
    flaw or vulnerability is discovered in that vendor’s platform.


    Increasingly present are vendor models that bundle general IT office technologies
    along with technologies in other industry verticals such as collaboration tools,
    cyber security, audio/video capabilities, and many more. The consumer pays one
    price which bundles all these solutions into one enterprise license. The dialogue
    between the vendor and the CIO then transitions to “why would you pay for all
    these separate security vendors when you get it for free with the license cost
    you are already paying with our product”? It is a compelling question and one
    that the CIO immediately asks of the CISO. While many companies successfully leverage
    vendors with this model and the interoperability enjoyed by having varying capabilities
    in one solution, there are three potential concerns; let’s outline those concerns
    next.


    As just mentioned, having all cyber security technologies with one provider could
    surface issues if there is an outage or vulnerability with the vendor. Next, not
    all technologies are “free” with the license cost. Advanced capabilities within
    a technology may come at an additional cost, which dilutes the value by increasingly
    higher add-on costs. Lastly, as threats evolve, it is increasingly difficult for
    vendors to be experts across all technology domains.


    For sports fans, you may have noticed the infrequent trend of an exceptional talent
    in one professional sport attempting to break into another. Perhaps a professional
    basketball player attempting a career in baseball, or maybe an all-star football
    player trying the same transition to multiple, other sports. Rarely do we see
    examples where that athlete has achieved mastery in all fields, and on all fields.


    As another example, many diners enjoy an evening meal at a restaurant that specializes
    in a specific type of food, perhaps Cajun cuisine, or maybe Italian fare. The
    food, for the most part, is focused on one style and they build their establishment
    around it, with diners enjoying the unique style, flavors, and ambiance it has
    to offer. Rarely have I gone into a restaurant and found exceptional meals by
    an establishment that serves up a multitude of various options including jambalaya,
    pasta primavera, Asian fried rice, pizza, barbeque, enchiladas, sushi, hamburgers,
    and Thai options, all on one menu. Trying to master everything (in any field)
    does indeed lead to a larger scope of capabilities but may lead to reduced expertise
    in each of those capabilities.


    The bottom line for a security technology strategy ultimately comes down to a
    simple mantra. *The CISO should allow the strategy to drive technology choices
    and not allow technology to drive the strategy.* I have never sat in'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'a vendor briefing of their technology and thought to myself, “wow, I didn’t
    know that was a risk I should have been thinking about”.


    Once the roster of security technologies has been identified, the strategic plan
    should include language on how the technologies will be implemented, and on what
    timeline based on prioritization. As a director, you need not be involved in managing
    the details of the implementation strategy; however, it is important for you to
    understand the broad themes of implementation to ensure it is included in the
    CISO thought process in building the technology portfolio. As more and more technologies
    are approved for purchase, the more difficult the implementation cycle, especially
    if there are limited security resources for the company.


    It would seem logical to include professional services in the purchase to help
    quick start implementation, but there are some areas to watch out for when leveraging
    these services. The vendor wants the implementation to go well so that the value
    of the product is fully realized. CISOs need a successful implementation as well
    to ensure optimal value of the purchase. The *manner* in which the execution of
    the services is achieved requires forethought.


    Like all other service providers, vendors have a team of implementation specialists
    that have competing engagements so it may not be realistic to plan for an immediate
    professional services engagement by the vendor. There may be a backlog of implementations
    that push your professional services out for several weeks, and this delay needs
    to be considered, especially when implementing more than one product or service
    from multiple vendors. Appropriate scheduling with the various vendors ensures
    that those with shorter backlogs may perform professional services first, and
    other partners with longer backlogs can assist later in the strategy.


    Next, solid preparation prior to the vendor’s implementation team arriving includes
    ensuring the CISO’s team, and other departmental resources are ready for the engagement.
    Having the appropriate resources ready to go when the vendor arrives helps to
    reduce the risk of the vendor’s professional services team sitting around waiting
    (at a cost to your company) while internal resources are preparing.


    Lastly, the professional services should be a partnership during the implementation.
    The service should be to assist the internal team with standing up a product and
    not solely doing all of it on behalf of your company. It becomes problematic to
    have professional services implement a product on their own and when they leave,
    the internal team knows very little about the implementation, its configuration,
    and ongoing operation. When future new configuration needs arise, the customer
    will require further support by the vendor, and it may be the case that the vendor
    will charge for those new services. By having the internal team learn and become
    familiar with the technology deployment during the professional services engagement,
    this costly risk can be avoided.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# CLOUD VS. ON-PREMISES


    A key decision to any security strategy’s technology plan often lies on the choice
    to host those cyber security technologies on premises in your own data centers
    or leveraging a cloud infrastructure managed by a third party. The movement to
    the cloud may provide security benefits by leveraging the best of breed computing
    resources, as a service, from a variety of different companies, i.e., Amazon Web
    Services, (AWS) Microsoft, (Azure), Google, etc. These cloud vendors absorb the
    capital expenditures needed to provide computing infrastructures and often include
    security-specific offerings (at an additional cost) to help further protect the
    customer’s computing instance. But leveraging the cloud does not equate to dropping
    in your company’s infrastructure with the expectation that the vendor will be
    responsible for the security of your environment. Cloud providers are very clear
    about responsibilities in their cloud service, and they document those responsibilities
    for their customers to understand. They will be responsible for the compute, storage,
    networking software, and infrastructure-related services. The customer is responsible
    for the security of the customer data, platform, applications, network and firewall
    configurations, encryption, and the access components of the service.


    More and more vendors of security products are providing cloud options for their
    customers, some security vendors even choosing a cloud-only type of deployment,
    where the product is hosted exclusively in the cloud without any options to have
    an on-premises version.


    The benefits of a cloud-first strategy may include transitioning much of the procurement,
    configuration, and oversight of on-premises hardware and software to the vendor,
    which frees up internal resources to focus on core competencies in cyber security.
    As with any solution, there are risks associated with cloud computing (more on
    these later). Directors should be fully aware of the cloud vs. on-premises decision
    and how that decision was factored into the strategic planning for the security
    organization at their company.


    # PUBLISHING THE STRATEGY


    The CISOs, in partnership with the information security organization, leadership,
    and other company departments, have finalized the strategic plan for security
    and are ready to share it broadly across the corporation. Gaining approval for
    the strategy is the first priority and as such, leadership should be the initial
    audience who sees the final strategic plan.


    Previously I suggested some tips in making the decision process easier by setting
    up one-on-one meetings with the CIO, CHRO, CFO, general counsel, etc. to show
    them the strategy components that may be of the most interest to each of them.
    Once their support and feedback are obtained, the'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'CISO should present to the CEO and his or her direct reports to get final approval
    on the plan. This approval accomplishes a few things, not the least of which allocates
    financial and labor resources (if required) to accomplish the strategy. Next,
    it shows top leadership support for the importance of executing the cyber security
    strategy to the employees of the corporation.


    The board of directors, through a committee or the full board, can then be briefed
    on the top risks for the company and the strategy to address them. Using the tips
    within this book, directors can inquire about specific points within the strategy
    to better understand the building blocks for the strategic plan, agree with the
    direction of the program, and advise on matters related to cyber security.


    Armed with the approvals and alignment from senior leadership and the board, the
    CISO is ready to begin the work of promoting the strategic plan with the rest
    of the company. All too often, security strategies are well known to the information
    security organization but remain a mystery outside this team. CISOs should not
    perpetuate a common stereotype that security is done behind the scenes in secrecy,
    far away from the business. In reality, security is part of the business, an enabler
    to those functions with direct impact to top-line revenue growth and/or bottom-line
    efficiencies. Isn’t it appropriate then that the cyber security strategy should
    be widely marketed across the business? Through corporate town halls, sales kick-off
    sessions, IT team meetings, or whatever the venue, capturing each opportunity
    to discuss the strategic vision of the security program helps to solicit wide-ranging
    support.


    Extremely important is the notion of tailoring these presentations to the audience
    by customizing each one. There are baseline portions of the plan to communicate
    to everyone, but the best marketing of the strategy comes with explaining how
    the strategy effects the specific job roles of the listening audience. What can
    they expect? How can they assist with the security vision? By tailoring the presentations
    to the audience, participants will be more actively engaged and feel more comfortable
    with asking insightful questions.


    There has been a tremendous amount of work that went into assessing the security
    posture of the company and creating a strategy to optimally address risk for your
    company. It was accomplished through hard work by multiple teams over several
    months to get to this milestone. And after all this effort should come the realization
    that your CISO has led your company not to the finish line; no, the work is just
    starting. Execution to the strategic plan has numerous important layers, and we’ll
    look into those in Chapter 7.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Chapter 7


    # # The importance of execution


    It would be difficult to find an executive at any large corporation who doesn’t
    believe that cyber security is an important topic that should be addressed. Within
    the end user population of a corporation, the overwhelming majority of them seek
    to do the right thing when it comes to protecting information and will follow
    cyber policies. I have found throughout my career that the area which holds the
    most debate and conflict in implementing security strategies lies at the manager
    and director levels. These are the levels where ideas become reality and where
    operational collisions may take place most often. These are the leaders who manage
    aggressive project schedules, with limited labor resources and dwindling budgets.
    In short, this is the level where execution happens.


    When most people hear of conflict, they may think of a negative connotation, usually
    imagining an argument between two or more people. I suggest that conflict is actually
    a good thing, and if done professionally can enhance the implementation of projects.
    It is through conflict where innovations are surfaced – a positive byproduct of
    effective teamwork. Yet, we often find ourselves avoiding conflict or in many
    cases give up on trying to come to a solution that meets security needs while
    not interfering too much with business goals.


    To help illustrate this point, there is a common document that has been swirling
    through the security industry for years called a risk acceptance form. While they
    differ in content, format, and the execution of the form, its basic function is
    to transfer risk. For example, security may be working with a small regional IT
    team to implement a security control that will help protect the overall company.
    The rest of the global IT teams adhered to the control and implemented it effectively.
    But this particular regional IT team pushes back explaining that they understand
    the goal of the security control, but it would negatively impact their business
    and would prefer if they did not have to implement the security initiative. The
    security team then explains why the control is so important and that it is part
    of a larger project to do this globally at the corporation. The small IT group
    reiterates that'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'they understand the need for it, but they just can’t impact the business and
    prefer not to implement the control. After considerable back and forth, the discussion
    concludes with the security executive providing a form to a leader within the
    regional team (director, VP, or higher level is best) that explains the needed
    security control and that the team under the leader’s supervision does not want
    to implement the control. It may also describe the risks associated with not implementing
    it, as well as a full understanding that if the risk is realized, the leader of
    that regional team takes full responsibility for any negative outcome or impact.
    The leader signs the form, and the security team files it away in case it is needed
    in the future to demonstrate unsuccessful attempts at mitigating the risk to this
    portion of the business.


    I’ve always disliked these forms.


    To me, it is a white flag of surrender in which the security leader says, “I’ve
    tried to work with this team, we cannot come to an agreement, therefore we are
    giving up and having them accept all the risk of not doing it”.


    Aside from my personal opinions on the matter, there are very real problems with
    leveraging such a form. It was mentioned previously that the network perimeter
    has significantly eroded and that a vulnerability in one small area can lead to
    adversarial exploitation with subsequent lateral movement to other critical areas
    of the network. By signing the risk acceptance form, the leader of that small
    regional team is not just accepting the risk for his or her area but may be accepting
    risk for the entire corporation – something they may not have the authority to
    accept.


    Examples such as these help to demonstrate the struggle of executing a security
    strategy; ask any CISO and they will provide clear memories of project struggles
    throughout their career. While there is no one size fits all cure to execution
    conflict (and I would suggest there should not be a desire for one), there are
    tips that can help to lessen the impact of conflict and better align stakeholders
    to the goals of security strategy.


    # CLEAR DIRECTION


    Prior to execution planning, the CISO has hopefully shared the security strategy
    with a wide audience of employees and leaders. The CISO has shown not only all
    the elements of the plan that was approved by leadership but how the plan fits
    to what each team receiving the presentation does in their organizations. Even
    better, the CISO would have incorporated feedback, concerns, and ideas that were
    learned in building the strategy to anticipate potential issues during execution,
    and plan as much as possible for those issues in advance. Sharing details of the
    strategy across a wide audience helps to align the direction of where the company
    is going with information security as well as the expectations for employees in
    the pursuit of cyber fluency across the enterprise.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# PLANNING AND FOLLOW-THROUGH


    Outlining clear milestones and tasks, then measuring progress to them, is critical
    for execution. Ask ten people and you will get ten different preferences for tools
    that can effectively track progress to project tasks and milestones. The key for
    your cyber security program is to choose one of them and ensure all stakeholders
    are leveraging the same solution. Also important is to confirm that the platform
    used is a corporate standard to provide adequate security controls to protect
    the information, as well as reduce the cost of multiple project planning tools.
    Once the underpinnings of tracking progress have been established, the CISO can
    then begin to inspect progress to the execution goals. The objective is to ensure
    that steady progress is made, even if only a limited number of minutes each week,
    establishing a mindset that continual advancement toward completion is critical.


    # REGULAR REVIEWS


    Documenting tasks, accountable parties, percentage complete, and project timelines
    are important for confirming that projects are understood by all stakeholders.
    Measuring the completion of tasks through actionable metrics paves the way for
    success, as well. However, documents and graphs are useless if the data is not
    reviewed on a regular basis. Through recurring project review meetings, security
    leaders can discuss progress (or lack thereof) to initiatives and assist the team
    with removing any barriers to progress.


    Traversing through each project regularly provides the team with the opportunity
    to discuss completion to tasks, as well as highlight items that should be included
    in the plan that may have been left out from the original project. It is a chance
    to reallocate resources from projects that are ahead of schedule to those that
    may be behind or require more assistance. These reviews are a wonderful way to
    seed updates on the execution of the strategy for senior leaders of the company
    when the CISO presents to them. Ultimately, without regular meetings to review
    progress, the execution of the strategy may be hindered, even though a substantial
    amount of documentation exists.


    You need not be involved in the execution details of the strategic plan; the aforementioned
    tips, however, may prove insightful if you find that the strategy’s timing is
    consistently offtrack. Questioning and understanding the execution methodology
    being used may provide insights into why the schedule is not being met.'
  merge: -1
  img_proc: true
