    to name a few. Once these are matured to an acceptable level, then more advanced
    processes can be added to the portfolio of security services.


    # **INFORMATION SECURITY GOVERNANCE**


    It is important for employees to understand that the CISO and their team do not
    arbitrarily make up security policies based on individual beliefs on risks. The
    expectations for each employee as it relates to information security are done
    through security policies. These policy decisions should come from executive leadership
    based on the corporate stance for a particular security topic, i.e., using personal
    computing devices for corporate work, etc.


    One method to create these high-level policies is through an Information Security
    Governance Committee, or perhaps called the Information Security Steering Committee.
    Usually chaired by the CISO and formally chartered, the committee membership may
    include, the CEO, CFO, CIO, General Counsel, Leader of Internal Audit, and CHRO,
    at a minimum. The committee meets quarterly to discuss information security topics,
    allocate security resources to security initiatives, arbitrate conflicts for security
    support to competing business initiatives, establish policy requirements, and
    garner bi-directional feedback on the performance of the cyber security program.


    The last thing any group desires is another committee, but the importance of the
    Information Security Committee is critical to the protection of the corporation,
    and at a cost of only an hour each quarter. Things can be done to enhance the
    productivity of the committee meetings. For starters, it should be set up so that
    eighty percent of the work is completed outside of the actual committee meeting.
    If each meeting consists solely of the CISO presenting slides for the attendees
    to listen to and ask an occasional question, the longevity of the meeting will
    suffer. Instead, when this impressive roster of executives assembles, the meetings
    should be conversational to a well-planned agenda with the goal of making them
    decision based in nature. Every major leadership representative of the corporation
    is in a room (or virtual), why pass up an extraordinary opportunity to make the
    committee optimally effective?


    Preparation is key. Building a collaboration space in your company’s standard
    technology platform helps to organize all the information. A calendar of committee
    meetings and events, committee member pre-reading materials, the agenda, and an
    area for supplemental reading or industry reports will all prove valuable. If
    timed well, the outputs from'
