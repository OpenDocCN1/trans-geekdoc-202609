  img_proc: true
- pgno: 45
  md: 'No matter the board format, CISOs should weave into all presentations the positive
    things about the cyber security posture, as well as any negative gaps of coverage.
    It is always good to hear of the positive strides your company is taking in cyber
    security, but more importantly, you should understand the concerns of the security
    executive so remediation plans can be discussed. This seems intuitive, but having
    a process for drawing out such concerns can alleviate future misunderstandings.
    To accomplish this, I had committee chairpersons and other directors formally
    ask me, “Are you aware of any material gaps in the cyber program and do you currently
    have all of the resources you need for the company’s cyber security program”?
    Such formality helps to promote an open conversation between the CISO and the
    director, as well as documenting the content in the committee/board minutes.


    There are many typical interaction types between the CISO and the board, and those
    interactions may include the following.


    # FULL BOARD PRESENTATIONS


    Gathering the entire board of directors for a cyber briefing is a great way to
    provide general industry news, the likelihood of risks for the corporation, and
    how the company might address those risks. Many CISOs have broad relationships
    across the security industry, and you should consider leveraging their relationships
    to enhance the full board presentations. Perhaps a briefing by the local office
    of the Federal Bureau of Investigation (FBI), Secret Service, or maybe a CEO from
    a top-rated cyber security company could enhance the awareness of cyber across
    the entire board?


    Dependent upon committee scheduling, often in my career I have seen non-audit
    committee members of the board sit in on my committee cyber security briefings
    because of an interest in the topic. Expanding the audience to the full board
    for listening to general cyber topical areas can be quite valuable for all members
    of the team.


    # REGULAR CYBER BRIEFINGS


    Whatever the committee structure or frequency of cyber updates that your board
    chooses, cyber security briefings on a regular cadence help to bring awareness
    to the company’s security initiatives. It is important to remember that each briefing
    is not a standalone session, nor does it deliver merely a general overview of
    the program with some metrics. Instead, each briefing is just one chapter in a
    larger book that collectively tells the overall story of the company’s security
    posture and its progressively increased ability to respond to threats.


    This “installment-based” style of briefing perfectly suits a company that is building
    or significantly enhancing a cyber security program. The'
