- pgno: 80
  md: 'omnichannel opportunities for customers. Each large shift requires a re-examination
    of the security capabilities to allow for the enablement of these transformative
    initiatives. And the earlier, the better.


    Whatever the trigger for change, consistent and effective evaluation of the budgetary
    impacts for the security program will help to reduce the negative effects to the
    business. The CISO is a great resource to help navigate the business through such
    changes and explain the risk implications for following a particular strategic
    path. Asking questions of the CISO regarding how financial proposals for the security
    program are determined will provide you with needed information so that you may
    advise leadership appropriately.


    # BUILDING FINANCIAL PROPOSALS


    Each budget proposal from the CISO most likely will include a justification for
    the required capability, costs, benchmarks, and perhaps some options. Often such
    proposals are followed by leadership requests seeking a return on investment (ROI)
    or defined value of the purchase from the CISO, however cyber security value is
    difficult to measure. While not impossible, there are methodologies available
    for the CISO to convert the purchase price of a security control into potential
    ROI calculations. Important to remember is that unlike traditional ROI, security
    ROI doesn’t speak much to the financial return a company will enjoy but rather
    the likelihood of risk that it addresses or the expected security improvement
    it provides.


    Potential attributes of a security ROI calculation could include avoidance costs:


    +   - Revenue lost due to the incident

    +   - Data loss costs, specifically trade secrets and regulatory data

    +   - Losses related to brand reputation


    The time that a CISO has with you can often be limited, so it is imperative that
    actionable information is shared and discussed within this allotted time. The
    aforementioned calculations provide data points that, on the surface, may provide
    a glimpse into specific financial impacts for a company, but all calculations
    rely on data points (and more importantly, the assumptions behind the data) to
    feed them. Because the director/CISO time together is so brief, I have found that
    describing these assumptions and all the underpinnings of the calculations takes
    time away from the core topics that aid the director in advising the company on
    cyber security matters. And in the end, the measurements don’t visualize the realities
    of specific impacts to your company. The devil is in the details, and understanding
    them, particularly when making financial decisions on security resources, is critical.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Browse the Internet and you will find many different reports that relate to
    cyber security topics, most of which are extremely valuable in providing an industry
    view. Several cyber security vendors produce annual (sometimes more frequently)
    reports that outline threats and other areas they are seeing in the industry.
    Important to remember with these reports, as valuable as they are, is that they
    may leverage data from just the author’s customer base (in other words, just a
    portion of the overall pool of available companies). There are think tanks and
    consultancies that deliver reports based on research, usually in the form of surveys
    and interviews, to provide industry numbers on a variety of cyber topics including
    security financials, i.e., the average cost of a breach, industries most financially
    impacted by a breach, etc. Diving into the research methodologies of the survey,
    one may find that a particular finding was based on surveying one thousand people
    in one specific geographical region (as an example). Understanding the particulars
    of the data and resulting findings is crucial in comparing the relevancy of them
    to your organization. Knowing the details of the survey, such as the number of
    respondents, title of the responding participants, do they have significant expertise
    in the area being surveyed, and other data points, can help translate the findings
    into which are valuable to leverage for decisions, as opposed to those findings
    that merely can be used as a conversation starter on the topic.


    Additionally, many findings are averages for the participants of the study, leading
    to potential variability in the cost of a breach data point which can be dependent
    upon the size of the breach. Parameters may be set by the organization performing
    the study which explains such variability, which helps make the data clearer.
    The reports provide general guard rails for estimations based on the contributing
    data from the participating organizations being interviewed. Much like the published
    miles per gallon fuel consumption for your vehicle, your mileage (or cyber security
    measurements) may vary.


    Security executives often leverage ratios that seek to quantify risks which are
    more specific to their company. Calculations such as annualized loss expectancy,
    probability of a security event, and a host of other, similar measurements often
    find their way into board presentations. With a desire to show clear, quantitative
    analysis of risk and how it applies to the company’s security posture, the intent
    is worth but only if all the underlying details behind the data are understood
    and considered when reviewing the ratios. As mentioned, the time for a CISO to
    brief a committee or board is limited and spending that time to debate the differences
    in predictability versus probability and other data inputs behind the figures
    may detract from the key issues. If used in combination with other justification
    factors, these computations may provide an additional, valuable data point, but
    on their own, I argue that funding or communicating a security program based solely
    on this type of analysis is not optimally effective.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Computations that seek to understand the impact on brand reputation are foggy
    as well. Few will argue (including me) that brands possess incredible value, some
    going back hundreds of years. There are many different types of valuations that
    help to measure brand value, with arguments on both sides related to the subjectivity
    of the analysis. My concerns for brand value relate to the ability in placing
    a specific dollar figure to the brand impact for a specific company who experiences
    a specific cyber security event.


    Whatever methodology a company may use to determine brand value, pinpointing the
    impact of a breach on that value may be problematic. If brand valuation is dependent
    on the financial performance of the company, revenue generation, and competitive
    advantage to name a few, which of these metrics highlight the influence of a security
    event? Even in the face of the compelling timing associated with a breach, a downturn
    in revenue could also be attributed to many factors outside of a breach, perhaps
    a pricing increase, new offerings by a competitor, or a host of other variables.
    Attributing any financial impact to brand value solely on a cyber event may not
    be an accurate measurement. Simply put, and using the common Latin logical fallacy,
    *post hoc ergo propter hoc* (”after this, therefore because of this”), there could
    be more behind the numbers than just the data breach.


    It is quite easy to conclude that breaches may cause significant financial distress
    for companies; I am a CISO, I would never suggest otherwise. However, there is
    a difference in stating that a breach impacts a company’s brand value, versus
    attributing a specific cost to (or percentage of) the value of the brand, as a
    result of the attack. These are two very different things; one is a logical argument,
    and the other is a proposed measurement that may not be accurate for a particular
    company. It is important to reinforce that I am speaking to brand value in this
    section and not impacts to top-line revenue, market valuation, and bottom-line
    efficiencies – those figures are often quantifiable.


    It may be true that a breach could involve diminishing consumer trust in a brand
    and as a result may have a negative influence on the brand image. With such deterioration
    of these brand attributes, it stands to reason that the value of the brand could
    be adversely affected. However, I suggest that designating a specific dollar amount
    to the brand value as a result of the breach is fundamentally flawed and may present
    a doomsday scenario without accurate (or actionable) data. All breaches are not
    equal, nor is each response to a breach. Each company has different nuances in
    the incident response process, and these can impact customer trust. If a company
    responds quickly, effectively, and are honest in communications around what took
    place, that is viewed much differently than a company that delays the response
    or worse, hides the facts surrounding the breach from its customers. Regulations
    on reporting help to keep all companies transparent to some degree, but I argue
    that how a company responds impacts consumer trust. And companies have varying
    effectiveness levels to responding'
