    # CLOUD SECURITY


    It isn’t an exaggeration to say that cloud computing has transformed the IT industry
    by introducing efficiencies in performance, cost, dependability, and many other
    categories. Like with any technological advancement, security concerns surface
    that need to be analyzed and addressed so a company can potentially enjoy the
    proposed benefits.


    The cloud introduces a web of complexity both technically and administratively.
    Customers may leverage a blend of on-premises and cloud infrastructures and possibly
    use multiple different cloud environments from different cloud providers. There
    are public clouds, private clouds, and a host of services such as software-as-a-service,
    infrastructure-as-a-service, and platform-as-a-service. When adding in technical
    details such as virtual machines, hypervisors, containerization, and many more,
    understanding cloud computing in executive terms can prove challenging, particularly
    when making core business decisions.


    Additionally, there are administrative complexities that make cloud computing,
    well, cloudy, when it comes to strategic business judgments. We explored in an
    earlier chapter the very detailed roles outlined between the cloud service providers
    and the customers, each one with specific duties as part of the relationship.
    Moreover, removing the infrastructure'
