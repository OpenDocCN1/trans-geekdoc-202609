  md: 'searching for a CISO (look online for yourself). What follows are a few actual
    job requirements I have found for a few CISO positions over the past year:


    +   - Significant practical, hands-on knowledge of the following:

    +     - packet analysis tools such as tcpdump, Wireshark, and ngrep

    +     - database structures and queries

    +     - Cisco or Palo Alto firewall/IPS administration

    +   - Expertise with UNIX, Linux, Windows operating systems

    +   - Hands-on experience with computer forensic investigation tools to collect,
    analyze, and preserve electronic evidence.

    +   - Working knowledge and practical application of security products (both on-prem
    and cloud) including firewalls, vulnerability detection, network devices, endpoint
    protection, application testing, etc.

    +   - Network security architecture development

    +   - Degree in Software Development/Programming


    CISO requirements such as these do little to advance the role to that of a peer
    executive in business and solidifies the long trend of thinking that the CISO
    is a technical position that administers technical controls and should report
    to another executive who has business experience and can translate it into corporate
    risk. It is true that some companies and recruiters do indeed understand the concept
    of what a true CISO should be; however, there is a clear opportunity to grow the
    role through education and challenging corporate leaders to the fact that an information
    security executive should be more focused on business risk than configuring firewall
    rule sets.


    Absent from the above job description requirements are significant competencies
    in finance, strategy, operations, human resources, legal, marketing, and above
    all else, leadership. All of which are vital to perform as an effective CISO.
    The deep, hands-on, daily job skills within security operations are crucial; however,
    they are crucial for other roles within the cyber security organization – not
    the CISO.


    Some industry colleagues may disagree with my addition of strong business qualifications
    in a CISO job description, explaining that the role should primarily have substantial
    expertise in information security; after all, information security is indeed in
    the job’s title. I agree that the addition of business qualifications in the role
    should not dilute the need for cyber security expertise. It is a vital part of
    success for the CISO, so I am not inferring that business competencies replace
    cyber security skills. Moreover, when I refer to business skills in the above
    domains, I am not suggesting a casual understanding of these skills. Instead,
    I believe the CISO should have deep expertise in these business domains, as much
    as any other “C-level” executive that holds a leadership position across finance,
    operations, HR, or strategy.'
