- pgno: 133
  md: '# # Incident response


    Even with all the preventative controls, detection capabilities, administrative
    security controls such as policy management and security awareness, all combined
    in a layered security program, at some point your corporation will need to respond
    to an incident. Data breaches and threats are commonplace today, perhaps even
    in your personal life you may have experienced the nuisance of replacing a credit
    card due to a compromise of your information. This inevitability of incidents
    requires a formalized and practiced incident response plan that guides the enterprise
    in a structured way during the chaos of a breach.


    What is an incident? Or better stated, which incidents rise to the level of critical
    severity that requires immediate and complete attention? Your CISO and team see
    millions of events pour out of the security platforms that have some sort of anomaly
    aspect to them. Looking at all of these events, one would think that every adversary
    across the world is trying to break into your corporate environment. Events are
    common, the majority of which end up being nuisance types of alerts, low severity
    concerns, false positives, or appropriate business processes that perhaps generated
    an event alert. After pruning through these events, much of which may be done
    with automation, perhaps a couple dozen remain that require further investigation.
    Of those, one or two may rise to the level of a serious security concern, possibly
    initiating the incident response plan process. Merely looking at the number of
    total events will not provide the data for your board to make actionable business
    decisions.


    Traditionally, external auditors meet with the CISO each quarter to discuss the
    cyber security program with one inevitable question: “Are you aware of any security
    events or incidents that occurred during the period of performance (quarter)”?
    This used to be an easy question to answer with very little ambiguity. Today,
    however, as external firms increase their cyber security knowledge, more regulatory
    implications surface, the public awareness of cyber breaches grows, and the impacts
    to the cyber insurance'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'market are felt, these external entities want to know more about all incidents
    impacting companies.


    The intent of the question has remained the same over the years; they seek to
    understand incidents that are significant in nature. Perhaps a more applicable
    question to get to the spirit of the inquiry would be, “are you aware of any *material*
    security incidents that occurred during the period of performance”? But what is
    considered material? Some external firms may do a good job of dictating what materiality
    is when inquiring about an incident, but as our industry grows, defining the terms:
    event, incident, and alert, will remain a challenge.


    Security platforms provide rich detail into network and system activity. Depending
    on the vendor and their product, the security professional can view alerts based
    on criticality of the alert, see how the potential threat traversed through the
    network or system, obtain information on the system such as operating system,
    user, etc., and perhaps even a geographical representation of where the alert
    is taking place. What security employees don’t see is a skull and crossbones icon
    representing the adversary moving across the screen to make it easy to identify
    malicious behavior. In many cases, valid credentials are stolen and used to illegally
    access the network, so the security engineer only sees what appears to be a valid
    employee’s actions.


    As a board member and committee person, you may not find value in understanding,
    or even knowing, about the potentially millions of events that your security team
    is alerted to each quarter. Your interests lie in understanding those incidents
    that impact bottom-line efficiencies and/or top-line revenue growth; anything
    that hinders your ability to manufacture products, provide services, and transact
    with your customers. The best way to decipher the distinction between noise and
    material incidents is to create thresholds (in advance) for what types of incidents
    are brought to the board’s attention.


    Once a process is in place to provide actionable updates to the board, it is wise
    to give notice to how frequent the updates to leadership should be provided during
    an actual incident response. Too few updates result in uncertainty to the progress
    of the response, while too many may impact the responders’ ability to effectively
    work on the response. In the wake of Hurricane Katrina, I was part of a small
    team that was charged with rebuilding a business segment located on the Mississippi
    Gulf Coast. All of us balanced the reconstruction of the corporate facilities
    with the rebuilding of our personal homes. As we worked on restoring IT services,
    it was important that we provided updates to our corporate office and the executives
    who desperately needed information on progress. We had generators running to provide
    power to the “war room” in which we all coordinated efforts. Fans were blowing
    consistently to provide some'
