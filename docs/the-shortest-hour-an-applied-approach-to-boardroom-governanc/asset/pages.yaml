  md: '# Chapter 9


    # The role of security vendors and consultants


    Depending on the analysis you may read from a variety of sources, the number of
    current cyber security companies can range anywhere between approximately 3000
    and 50,000. For our purposes here, let’s just agree that the number of companies
    providing some variation of cyber security products and/or services is massive.
    To be sure, it is a hot market with new start-ups springing up every year. As
    a CISO, I average roughly sixteen unsolicited vendor emails on my work account
    each day; four connection requests on social media daily from cyber security company’s
    sales representatives; eight phone calls from salespersons on my personal phone
    each day; and four daily phone calls on my work phone line. Each one with a request
    to tell me more about how their technology can strengthen my company’s security
    posture. It is truly an active market and there is simply not enough time for
    a CISO to answer each request.


    To help address this time constraint, I categorize security companies into three
    segments: vendors, partners, and extensions of my team. Vendors are those that
    I do not currently do business with, but I keep an eye on their emerging capabilities.
    Partners are those firms I leverage to some degree in my security program. Lastly,
    those companies that provide critical support to my security organization and
    work hard at nurturing the working relationships are ones that I consider to be
    extensions of my team.


    Companies rely on cyber security providers to assist them in combating threats,
    and the technologies they provide are an integral part to an information security
    program. Selecting those technologies, as well as their providers, can be a daunting
    task if there isn’t a structured process in place for determining selection. Prior
    to any discussions with vendors, the CISO should already understand their needs
    for a particular security technology and a basic understanding of the attributes
    desired, so that focused vendor discussions can take place. For example, when
    walking into a car dealership, customers don’t say, “Show me everything; I want
    to see it all – electric vehicles, trucks, compact cars, vans, sports cars, sedans,
    and SUVs”. No, instead the consumer already has an idea of one or two types'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'of vehicles they want to explore, maybe the color they desire and a general
    understanding of a price range they can expect to pay for the vehicle. With a
    similar understanding of needed security attributes, the CISO can be better positioned
    to choose the right technology and vendor.


    # UNDERSTANDING DESIRED ATTRIBUTES


    There are specific attributes to every security technology purchase. Attributes
    such as product performance, service after the sale support, interoperability
    with other technologies, price, and a host of others, each of which have varying
    levels of importance for the purchaser (the more a product matches the needed
    attributes, the better). No one attribute should be weighted so heavily that it
    ignores many of the other desired features. For example, a very low-cost solution
    may be an incredibly attractive attribute on its own, but it loses that appeal
    if the product isn’t of the appropriate quality and lacks many other attributes
    required to effectively address specific threats. The cost may be good, but the
    value is not.


    An effective way to understand which technology and vendor to leverage is through
    effective planning. One recommendation is for the CISO to assemble the appropriate
    stakeholders to discuss the approved strategic initiative and identify the specific
    needs for the technology that addresses the strategic initiative. Bringing together
    all affected parties, in small groups or as one large team, ensures that everyone
    can raise important characteristics that contribute to an effective technology
    selection. Most of the time, these stakeholders will include non-security team
    members.


    Documentation is key to ensure that attributes are clearly defined. As an example,
    if a CISO is looking to add a security awareness platform, some potential areas
    for the team to explore are partially outlined in Figure 9.1.


    Once the criteria have been established by the collective stakeholders, a popular
    additional step is to rank the different attributes within each of the categories
    of *critical needs*, *should have*, and *nice to have*. A simple system can be
    effective to label which attributes are the most important within each category.


    The CISO can then research the different capabilities of vendors in the desired
    technology space. Research firms, consultancies, online forums, and industry peers
    are very good sources for discovering which products and vendors lead in that
    technology vertical. However, this information serves merely as a data point because
    each technology deployment and experience are unique to each company.


    Armed with this information, the CISO and team are only now ready to begin talking
    with targeted vendors. Each discussion is usually comprised of an account representative
    and technical sales support person from the vendor, who both dive into the capabilities
    of the product, provide'
