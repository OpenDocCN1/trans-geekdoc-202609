- pgno: 38
  md: 'continuity, and privacy are addressed in many other corporations. While they
    are all very important areas of the business and absolutely should collaborate
    between one another, cyber security frequently has the most risk velocity among
    them. For smaller companies, the physical security (non-cyber security) functions
    often are expertly led at the director and manager levels.


    At enormous organizations, the roles of cyber security, corporate security, and
    privacy may be split across three executives (often vice president level) due
    to the extraordinarily complex work each was performing. The bottom line for how
    to organize all security-related functions is dependent on the nature and criticality
    for each of the domains for that particular company. But in no case have I seen
