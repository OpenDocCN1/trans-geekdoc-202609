  md: '| Topic | Questions |

    |---|---|

    | Incident updates | Is there a formalized process for material incidents being
    reported to the board? Thresholds for what is material? Who is contacted on the
    board of material incidents and by whom from the management team?<br><br>During
    an incident, is there a process for the frequency of incident updates that allows
    for the free flow of information, balanced by providing time for the responders
    to provide incident response?<br><br>Are the updates focused on remediation of
    issues, or do they sometimes stray to educational awareness that could be done
    in other forums? |

    | Response type | Is the response focused on the type of attack, i.e., website
    defacement and denial of service attacks, vs. nation-state attacks done under
    stealth? |

    | External support | Does your company leverage a *paid* incident response retainer
    with a company that has strong cyber security response expertise?<br><br>Does
    your incident response provider utilize the endpoint sensors already deployed
    on your network, or would they require time to deploy their own sensors?<br><br>Is
    your incident response provider on the list of preferred and/or approved providers
    by your outside counsel and cyber insurance providers? |

    | Privileged responses | Is there a threshold for what responses are considered
    to be standard and which will be under privilege?<br><br>If under privilege, is
    there a process/agreement to ensure the CISO is updated with information pertaining
    to the response? |


