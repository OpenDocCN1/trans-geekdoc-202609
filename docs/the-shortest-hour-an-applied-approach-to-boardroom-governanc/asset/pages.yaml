  md: 'alarms, but together, these events could be an indicator of something more
    serious. Using a fraud example, the SIEM may identify that a consumer of your
    product or service edited their contact and address information, while another
    log source identifies a transaction from that same consumer less than twenty-four
    hours after the address change. This may equate to a legitimate event for the
    customer, but it could also mean that potential fraud may be taking shape and
    something the company may want to investigate.


    The obvious goal for SIEM would be to ingest as many value-added logs as needed
    so that more complete analysis of the environment can be performed. But historically,
    SIEM solutions have been expensive, many charging by the amount of data brought
    into the system. For companies on a limited security budget, this could mean fewer
    logs are brought into the system, reducing the full value of the capability. SIEM
    vendors have responded with different pricing options that don’t charge solely
    by data consumption, while at the same time other companies have been created
    to provide ways to optimize/cleanse the data prior to ingestion by the SIEM. You
    should explore with your CISO if there are any negative impacts to the effectiveness
    of the SIEM deployment as a result of the pricing model your company leverages.
    Your CISO should explain the pricing option that provides the most value, not
    the least cost, for the company’s SIEM deployment and if that option lends itself
    to an effective security capability.


    We often equate security technologies with the core mission of protecting the
    enterprise, when in fact these technologies can also assist other areas of IT,
    and potentially the business, for non-security-related tasks. They can provide
    another valuable data point for IT assets, operating system types, and other metrics,
    and can contribute to troubleshooting IT-related issues. For business, the solutions
    may aid in providing intelligence for business operations, digital deployments,
    and manufacturing processes. Unlocking the potential of a company’s investment
    in security by including it in other business areas provides higher value and
    is something that should be explored when discussing detection and SIEM capabilities.
    Like with most purchases, leveraging enterprise pricing for larger orders unlocks
    larger discounts from the vendor. Evaluating how many teams can benefit from these
    technologies, even outside of the information security organization, identifies
    if the full value of the investment can be enjoyed, or if it is being used as
    a point solution for just one area of your business.


    # VULNERABILITY MANAGEMENT


    Seeking out weaknesses in systems so they may be strengthened, thus reducing the
    window of opportunity for them to be exploited, is at the heart of vulnerability
    management. Enterprises use vulnerability scanning solutions to scour their IT
    environment to assess its assets for vulnerabilities. As with other security platforms,
    it is important for companies to ensure they have'
