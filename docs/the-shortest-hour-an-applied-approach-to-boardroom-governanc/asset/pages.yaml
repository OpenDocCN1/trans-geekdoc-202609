- pgno: 50
  md: '# Chapter 5


    # Information security assessment


    An important part of any strategic journey is knowing where the organization is
    currently, and the best method for garnering this knowledge is through an initial
    assessment prior to developing a strategic plan. It provides a starting point
    by highlighting the current security posture for the organization and helps to
    do future prioritization of initiatives that will be forthcoming in the strategic
    plan.


    As a director, you will not likely be part of performing the assessment; instead,
    you will be more focused on the results of the assessment. This chapter highlights
    the core components of a security assessment so that you can garner a better understanding
    of how the assessment was completed. This will position you to ask probing questions
    related to the results. The manner in which the results were generated is often
    as important as the final report itself.


    A CISO can leverage many resources to help with assessing the security capabilities
    of a company. While not an exhaustive list, the following have proved helpful
    in my career, along with some tips for the director to inquire about the assessment
    processes used by their CISO.


    # CISO ASSESSMENT


    You have spent the time to build the requirements for your CISO role, interviewed
    candidates, and invested time in beginning to build the relationship with your
    new security executive. Unless your qualification requirements for your CISO role
    were open to candidates who may have not previously served in such a role, your
    new CISO will have experience in assessing security programs. It is beneficial
    to leverage their years of experience as they will know what to look for, specifically
    the components that make for an effective security program. As they examine the
    effectiveness of the different security disciplines, they can weave in what they
    are learning about their new company. To supplement their lack of deep understanding
    of their new company at this point in their tenure, their interviews with'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'current employees are a great way to measure effectiveness of security controls.


    Interview-based assessments begin with the CISO developing a list of very specific
    questions that target the different disciplines across information security. To
    supplement my expertise of cyber security, and to keep my series of questions
    industry-relevant and not created in a vacuum, I refer to common frameworks used
    in the security industry. Examples may include the National Institute of Standards
    and Technology 800–53 for Security and Privacy Controls for Information Systems
    and Organizations; (International Organization for Standardization (ISO)) 27000
    key international standard for information security; and Center for Internet Security
    (CIS) Controls. These provide a foundation guide for effective security programs,
    and I reference them frequently, particularly during the assessment phase.


    Meetings are scheduled with the internal information security team, employees
    from the IT organization, as well as representatives from the various lines of
    business and functional areas, including their leadership. While keeping the interviews
    conversational, I walk through my questions for a particular discipline, i.e.,
    asset management, intrusion prevention, application security, and a host of others.
    I have found that to achieve the highest accuracy in the assessment, I will ask
    a question multiple times over the course of the assessment timeline and of different
    people, particularly if there is ambiguity in the initial response.


    The current employees are a rich source of information for the assessment, after
    all, they have historical knowledge of the environment, but it is helpful to supplement
    the interview-based assessment with technical reviews as well. These will help
    validate the interview answers and give a more complete view into the security
    posture of the company. The CISO obtains access credentials to the multiple security
    platforms used by the security team and performs a review of how they are configured,
    recent alerts, and the overall health of the technology deployment. In addition
    to these technical checks, some third parties conduct technical assessments in
    the form of a compromise assessment, penetration testing, and other services.
    These reviews do not rely solely on human answers but instead review the technical
    aspects of the security program, which can prove extremely valuable for the initial
    assessment.


    # **INTERNAL REPORTS**


    The new CISO can avail themselves to security assessments conducted by internal
    sources from the past few years to provide additional clarity to their initial
    assessment. Specific reports by the internal audit department and external auditor
    can provide valuable specifics on where gaps may exist in certain areas of the
    security program because they are more detailed than what external consultants
    may provide. However, these reports typically'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'have a limited scope of review, i.e., data loss prevention program, the state
    of asset management, etc., and may not cover the entire security program. Regardless,
    they are a data point that can help to make the CISO assessment more comprehensive.


    # CONSULTANCY ASSESSMENTS


    General security assessments from consultants can provide a quick review of the
    security program by leveraging common frameworks to deliver a maturity rating
    based on the common Capability Maturity Model Integration (CMMI) model. Often,
    the consultant may use an assessment model developed by their firm to provide
    more details into the risk posture for the client. There may be some of these
    models that are more marketing-driven instead of true risk measurements. An example
    may be measuring and scoring an adversary’s ability (and desire) to break into
    the client’s network. This type of adversarial information may be available for
    tightly organized hacking groups where attribution can be determined. However,
    as mentioned previously, some threat actors are not organized to a particular
    group or may work alone. Determining that lone person’s hacking abilities and
    their specific desire to cause disruption to your specific corporate environment
    seems beyond the capabilities of a third-party consultancy. These types of assessments
    may not add value to the CISO assessment.


    Third-party security program assessments are often primarily interview-based and
    may only cover a short three-to-four-week service cycle. As a result, the findings
    are typically very broad in nature, after all, their view is that of an external
    one. The cost of these assessments should be considered as well, which could be
    very expensive for the client to just understand where the gaps lie, while not
    providing remediation to those gaps. Of course, the consultant group will promote
    their capabilities (at a separate cost) to assist the client in remediating those
    deficiencies.


    In some cases, contractual or regulatory requirements may dictate that a security
    review be done by an external party. The most valuable type of consultant assessment
    will be those that employ deep technical testing services rather than general
    interview-based inquiries. Their results can be beneficial to both the management
    team and the CISO, providing each of them with technical, non-biased, and factual
    results that can be leveraged (in part) in building the strategic plan.


    For you as a director, the bottom line for understanding the current risk posture
    for your company is to inquire the CISO how the assessment was performed, did
    it involve interview-based processes, technical reviews, or a combination of both?
    While it isn’t necessary to grasp every component of the assessment, through an
    understanding of the methodology used in deriving the results, you will have a
    good understanding for how solid the'
