- pgno: 15
  md: '# # Introduction


    Business is a dynamic discipline, constantly evolving, requiring corporate directors
    to advise on a variety of topics that aim to positively impact top-line revenue
    growth and improve bottom-line efficiencies, as well as pay notice to regulatory
    and legal matters for the company. Each director is heavily involved in multiple
    initiatives that extend from short-term actions to long-term growth. Each year,
    new disciplines and regulatory requirements are introduced that require attention
    as well, without removing the traditional categories from the director’s suite
    of responsibilities.


    When special events take place, such as bankruptcy, mergers, acquisitions, and
    divestitures, it is realistic that the director’s attention shifts to those events
    but without losing sight of the other baseline responsibilities. All of this is
    done as guardians of shareholder value. It is not a passive role and requires
    significant consideration to a variety of domains.


    This book reinforces a discipline that will require a director’s attention at
    even greater levels than ever before: *cyber security*. My goal in writing this
    book is not to make the reader an expert in cyber security. Instead, it is to
    provide valuable tips and information so that the Director can ask the proper
    questions of their corporate leadership team *and* understand the answers provided
    to them to ensure that their cyber security program is optimal and ready to react
    to business disruption. This book is for you, the newly appointed director, or
    a seasoned board member being introduced to the emerging boardroom topic of cyber
    security.


    This book can also be a valuable resource for C-level executives who want to understand
    more about cyber security but in an easy-to-understand format. As directors become
    even more educated on the discipline of cyber security, your cyber knowledge will
    be needed to answer their questions and importantly make informed decisions. Your
    chief information security officer (CISO) can help fill in the details of what
    you learn from these pages and then help you to apply them to your organization.


    Lastly, my colleagues in the cyber security industry may leverage this book for
    various reasons. Perhaps for someone wanting to pursue a CISO role, my hope is
    the insights I’ve gained from over two decades of working'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'with boards will provide you with what to expect from the role. For my seasoned
    peers, you are no doubt familiar with the concepts you are about to read, but
    hopefully there will be a few tips that are new and can be added to your security
    program.


    As we collectively explore new ways to enhance cyber security within the corporate
    governance structure, several industry publications, books, and social media posts
    have surfaced that provide very good discussion points on this topic. Many of
    these effectively highlight the need for cyber security to be discussed more frequently
    at the board level, increasing cyber fluency among board members, and the impacts
    for improving (or not improving) the dialogue within the boardroom. Additionally,
    I have seen published guidance with a roster of questions that directors can ask
    of their CISO pertaining to cyber security within their company. What I wanted,
    and probably why you are reading these pages too, is a source of information that
    not only provides questions that address common concerns in cyber but also provides
    a very general understanding of the topics so that you can understand the answers
    provided to you in order to deliver informed business guidance.


    In some areas, it may feel that I am covering areas a bit more deeply, but the
    broad underpinnings are important so that you may understand the answers to your
    questions. My commitment to you is that I’ll only detail enough for you to grasp
    the concepts and nothing further. Your CISO can go more deeply into the subject,
    should you desire. If the reader has not heard it previously, it is important
    to note here that when it comes to cyber breaches, it is not a question of “if
    it will happen” but “when it will happen”. Never has the importance of cyber security
    context, understanding a topic and the impacts to your company, been so critical.


    As those of you who work on more than one board can attest, not all information
    security programs are the same. Based on the unique risks to the company, their
    corporate strategies, operational model, financial position, and a host of other
    characteristics, it is natural (and necessary) for each company to have a customized
    security program that works for them but may not work for other companies. Despite
    what some consultancies may boast, there is no single strategy, no one size fits
    all type of security model that can be applied across multiple corporations. Each
    security strategy is as unique as a fingerprint, but the underpinnings and foundations
    of the strategy are as common as a finger. There are not too many instances where
    there may be an absolute correct way or an absolute wrong way to address a cyber
    security issue. More often than not, there are many nuanced considerations that
    require deeper analysis of the issues. My goal is to help the reader identify
    the core foundations while giving ideas on what to look for in each unique strategy.


    In my twenty-three-year career as an information security executive, I have had
    the unique privilege of working with several diverse and exceptional'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'boards across multiple industries: aerospace/defense, financial services, technology,
    manufacturing, retail, consumer products, engineering, and data marketing. With
    the exception of one, all the boards I’ve worked with had international responsibilities
    across hundreds of countries; and one board in particular had a non-U.S.-based
    governance structure. Each board, much like each company, has a personality: a
    unique blend of executives and challenges that differentiates itself from others.


    I have been fortunate insofar as the levels of interactions I experienced with
    each board were extremely varied. Of course, there is the traditional CISO engagement
    with a committee, usually the audit committee (more on this later), where most
    CISOs interact. Additionally, I often briefed the full board on matters of strategic
    security planning or in the wake of a significant incident response. When a new
    director was onboarded, I provided a one-on-one briefing on the state of information
    security for the corporation in which they were about to embark. Moreover, there
    were times when I met with directors or committee chairpersons to conduct special
    projects on their behalf. All of these interactions gave me first-hand knowledge
    of what was top of mind for each of them, as well as a view into where opportunities
    to enhance corporate governance on matters of cyber security reside.


    The members of the boards I worked with were equally diverse, all from various
    backgrounds with a unique contribution to the overall team. Whether it was a United
    States Presidential candidate, a White House chief of staff, retired high-ranking
    members of the military, or chief executive officers of Fortune 500 corporations,
    each director provided a distinctive opportunity for me to grow my competencies
    in working with boards. If not for each of them and the opportunities they provided
    me, this book would not be possible.'
  merge: -1
  img_proc: true
