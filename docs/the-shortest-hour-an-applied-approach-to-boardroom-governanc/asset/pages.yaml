- pgno: 119
  md: '# Cyber security overview


    The first half of this book focused on the industry, the role of the CISO, board
    engagements, financing security, the cyber security strategic plan, and execution
    of the plan, all of which are directly applicable to the development and ongoing
    operations of your corporate information security program. You may have discovered
    that many of the concepts we’ve explored so far in this book are not a large departure
    from baseline program considerations important to other business disciplines.
    Where the confusion sets in is around the technology surrounding cyber security.


    What follows in Section Two is a more broad-based view of many cyber security
    topics that serves as an overview for directors who may have focused their careers
    on other important business disciplines, which requires them to better understand
    some fundamentals of cyber security. Even though it is a broad-based view, there
    are tips woven into the following topics that can be leveraged to probe more deeply
    into one’s own cyber security program and should not be overlooked by directors
    who may have some cyber fluency.'
