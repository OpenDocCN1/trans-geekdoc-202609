- pgno: 46
  md: 'CISO begins with a briefing on the assessment of the current security program,
    then highlights the strategic information security plan (with all its components)
    and how it will deliver risk-mitigating services. At subsequent briefings, the
    CISOs can discuss their progress in executing the strategic plan. Ultimately,
    each committee member will have a full view of where the company’s security program
    was, the incremental success on the execution to the strategy, and a final view
    into how the investment areas of security to date have helped to reduce (not eliminate)
    the identified initial risks. All intertwined with the specific needs of the company.


    This type of briefing on the progress to the overall strategy should not be a
    perennial presentation. A large transformation of the security program, building
    a new security program or hearing from a new CISO on their strategic plan, should
    be limited in frequency. If you are consistently being briefed on large, programmatic
    changes to the security organization, it could be a sign that the company is changing
    CISOs too frequently or perhaps previous security strategies may not have been
    thoroughly comprehensive. Of course, strategies are dynamic in nature and must
    adjust to evolving business models, as well as evolving threats. Instead, I refer
    more to large strategies that focus on building a security program where one minimally
    exists, or a new strategic plan that usually follows the appointment of a new
    CISO to the company. In these cases, I suggest that an underlying factor may be
    present which causes the frequent strategic plan briefings and is a factor that
    you should investigate.


    Once an assessment and initial strategic plan briefing is completed and there
    is a transition to more steady-state briefings, the committee should hear of security
    topics that provide a solid understanding of current and upcoming risks based
    on corporate strategic adjustments, potential impacts to the company, security
    industry updates, as well as informative metrics. Every board will require unique
    metrics that assist them in their understanding of cyber and importantly how it
    relates to the company. Because each board is so unique, I like to ask the directors
    that I present to which specific metrics they would like to see. I supplement
    the requests with other security metrics that I feel are important for me to deliver.
    This “top-down, bottom-up” metrics strategy helps to provide insightful measurements
    for board members.


    I’ve been challenged on the notion of asking board members what metrics they would
