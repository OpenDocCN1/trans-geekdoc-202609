    the labor resources needed to close the gap. This data-driven analysis can be
    achieved through the SLO component of the service catalog and provides excellent
    justification for resources.


    # HOW TO ORDER THE SERVICE


    An important part of any service catalog is how a user orders the services from
    the information security team for the particular statement of work. Ordering the
    service may involve a ticketing system so that all services are tracked from order
    to completion or perhaps a request to a centralized corporate email box. Whatever
    method a company uses, the specifics for how to order the service are outlined
    in this section. On more than a few occasions, a cyber security service won’t
    involve the customer ordering the service, instead it is just something that is
    pushed out by the security team, i.e., network monitoring. This doesn’t negate
    the need for a service description and details such as these should be included
