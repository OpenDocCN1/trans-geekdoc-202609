- pgno: 136
  md: '# EXTERNAL SUPPORT


    Everyone requires assistance from time to time and incident response is no different.
    During extreme times of chaos and confusion, having a trusted partner who can
    assist you with the response will provide much needed piece of mind. The most
    effective way to prepare for a worst-case cyber event is to have a pre-paid incident
    response retainer with your preferred partner – in advance of needing the service.
    It provides you with the opportunity to pre-negotiate the bank of hours desired,
    the hourly cost of those hours, and service level agreements with the partner.
    These retainers are typically good for one year and if your company doesn’t leverage
    the retainer for a cyber event, the pre-paid hours can often be used for a host
    of other partner services such as table-top exercises, security staff training,
    review of your corporate incident response plan, and many other specialized services.
    It is strongly recommended that your CISO and executive team lean toward pre-paid
    retainers rather than just an agreement on which partner the company will call
    in case of an incident. In doing so, your company reduces the risk of a partner
    not having the resources to react at the time of your incident, or the ability
    for the partner to charge elevated costs for response services when you need those
    services the most.


    As important as the pre-paid retainer decision is with your incident response
    program, understanding which partner your CISO chooses is critical as well. There
    is a high likelihood that your company will leverage third parties such as outside
    counsel and cyber insurance providers, particularly if the response is being done
    under privilege from your law department. When choosing an incident response partner,
    it is imperative that the CISO checks with outside counsel and the insurance provider
    to ensure that your cyber security partner is on their desired or approved list
    of security providers. For example, if the determination is made to bring in an
    externally preferred cyber firm that worked previously with these external entities
    but is not your company’s cyber response firm, time delays may be introduced.
    One of the first things the new security firm will want to do is deploy their
    own sensors on the global network systems to understand what is happening on the
    network. The installation of these sensors takes time even under the best of circumstances,
    and I have seen deployment times lasting two weeks during an incident. In a critical
    security incident, two weeks is a lifetime, time you don’t have when answers are
    needed quickly. Having an approved partner, particularly one who leverages your
    currently deployed sensors, allows the cyber firm to quickly begin assessing the
    situation utilizing your already installed technology rather than installing new
    sensors.


    If the response is to be done under privilege, it is prudent to have discussions
    with outside counsel, the cyber security partner, and internal teams to talk about
    the flow of response information. Due to its privileged nature, in many cases
    the cyber firm will only work with outside counsel'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'who is leading the privileged response. Once the response is complete, the
    external law firm may dictate the type of format for the final report: a fully
    detailed written report, a written executive summary, or a conference call to
    discuss the findings. Pre-response discussions will ensure that all stakeholders
    have access to the appropriate information during the response while protecting
    the privileged nature of it. Your internal general counsel and outside counsel
    are great resources to consult with on the appropriate path for how the company
    responses under privilege.


    # THE INCIDENT RESPONSE PLAN


    During the fog of an incident, response steps could be missed or perhaps all the
    needed stakeholders are not included. To prevent situations like these and to
    ensure an effective, repeatable process for responding to breaches, an incident
    response plan is developed, communicated, and practiced. While there are many
    components to an incident response plan, the core elements for your company’s
    plan may include:


    +   - Reporting and compliance requirements

    +   - Roles and responsibilities of the various stakeholders of the incident response
    team

    +   - Communication plan

    +   - Incident handling procedures


    An effective response is a team effort. It is imperative to identify all stakeholders
    who can bring their expertise to the response process so that all facets of the
    response can be professionally addressed. It is natural to include the obvious
    members of the response team such as the CISO, information security team, various
    teams from the IT department, legal, and executives. Equally crucial is the inclusion
    of representatives from public relations, investor relations, finance, communications,
    facilities, human resources, and others. Additionally, there are external members
    of the response team: outside counsel, external PR firms, cyber security partners,
    and others. The goal is to identify all stakeholders and outline the incident
    response roles and responsibilities for each. Beyond this, it is imperative that
    all members of the response team fully understand their roles and the expectations
    of their contributions to the overall response.


    When the team has been identified, establishing the method for communicating effectively
    is an important part of the plan. Who will be responsible for external reporting?
    Who updates the executive team and board directors? Who alerts the insurance company
    in a timely fashion to adhere to the reporting requirements? How often does the
    response team meet to provide updates? All these considerations should be planned
    in advance so that multiple communication workstreams can be successfully accomplished'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'simultaneously. Additionally, there may be situations in which internal communication
    mechanisms (email, etc.) may be potentially compromised or brought down by the
    adversaries, requiring an “out of band” communication platform for responders
    to share information. Planning for this in advance can help to ensure the integrity
    of the communications is sustained.


    The incident handling procedures incorporate many different elements and provides
    the team with a detailed guide on important tasks. While many of the steps are
    intuitive by nature, especially for cyber security professionals, pre-assembling
    the procedures helps to reduce the risk of missing or incomplete steps during
    a high stress response environment. Moreover, the procedures provide a validated
    approach for incident response. They are effective and they work. Commercial airline
    pilots leverage years of experience in aviation to deliver their passengers safely
    to their destinations. Even with all this experience, they still rely on pre-flight
    checklists to ensure all steps have been completed. While the overwhelming majority
    of flights do not result in an incident, following the pre-flight checklist with
    vocal validation of the completion of each step by the cockpit crew is a good
    system to ensure flight safety. Similarly, pre-designed response checklists lend
    themselves to highly effective cyber responses.


    Cyber security professionals are an eccentric bunch. They love nothing more than
    to dive into a complex issue or dissect a technology to see what it can do, versus
    what it was designed to do. These are the folks we want on our side when things
    go sideways during a breach. I recommend a task for your incident response plan
    for when a breach is first discovered that runs counter to this enthusiasm from
    your team – send several of these energetic employees home immediately.


    Once the team begins working on the breach, the energy level is high, but after
    about twelve hours, the team is fatigued and may not operate at optimal levels.
    If the entire team is working on the response, at that twelve-hour mark, your
    entire response team will slow down considerably. By sending a large amount of
    your responders home immediately to rest and spend time with their families, when
    the current team begins to tire, you have a fresh bench of cyber professionals
    to step in and continue the response while the initial team goes home to rest
    and re-energize. It is also a good idea to use geography as a response enabler.
    If log analysis or a similar investigatory task is required, assigning that to
    cyber security professionals on your team halfway across the world ensures that
    analysis is being worked while the local team is resting. Demand management and
    resource allocation should definitely be part of your response plan to safeguard
    against a weary team.


    The incident response procedures should include a financial component as well.
    At the end of the response, a natural (and needed) question to ask your CFO is
    “how much did the response to this breach cost us”? With so many employees from
    various departments inside and outside the company involved, figuring out how
    many labor hours were used can be difficult'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'without a pre-determined method for tracking response hours. It is wise to
    develop a cost code or other hourly tracking mechanism with your finance department
    that all stakeholders can use to track their response time during an incident.
    In doing so, after-incident reports can be generated on the hours involved, as
    well attributing them to the specific hourly rates for the individuals. There
    may be other mechanisms that can supplement the internal tracking, billable hours
    to an external law firm or public relations agency, for example.


    Post breach conversations with partners, customers, and external entities can
    become unwieldy if no plan exists. After a response to a breach early in my career,
    the company averaged four to five requests per month from external partners to
    discuss the attack and any controls being implemented to reduce the risk of future
    attacks. For many of the large partners, we would fly to their home office to
    meet with their teams in all day sessions, conveying the state of cyber security
    for our company. Other engagements included conference calls or questionnaires
    looking for specifics of the incident. These interactions were vital in assuring
    our partners and other third parties that appropriate measures were being taken;
    however, they also impacted the cyber security resources of our team. Ensuring
    your company is ready to address these inquiries through a detailed process involving
    a cross-functional team of experts in cyber, communication, and business operations
    is of the utmost importance to manage concerns, as well as resources.


    # RANSOMWARE RESPONSE


    With the increased prevalence of ransomware attacks, a popular boardroom debate
    has grown over recent years on the topic of paying, or not paying, a ransom demand
    from an adversary who has encrypted the company’s systems, possibly rendering
    them ineffective in normal business operations. This debate remains active without
    a definitive answer in the industry on what a company should specifically do or
    not do. The response to a ransomware attack will fall under the company’s incident
    response plan, with all the considerations outlined in this chapter remaining
    relevant to this type of incident. Yet, there are nuances to the response that
    seem essential for this type of attack, which we’ll discuss in this section. It
    is important to understand that ransom decisions are unique to each company so
    what follows are thoughts from my experiences, as well as witnessing what some
    companies and the industry have experienced. Any of the following opinions on
    addressing ransomware are my own; go forward strategies for your company can only
    be attained after thorough internal discussions.


    The person who decides on whether to pay or not pay a ransom should be outlined
    in the incident response plan, preferably at the executive level, with clear documentation
    that identifies the company’s decision-making'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'authority (and perhaps a back-up person should the primary person is unavailable).
    The CISO, general counsel, CIO, COO, and other functional executives advise the
    decision maker on potential impacts and suggestions, but the ultimate choice is
    made by the decision maker, potentially the CEO or other senior executive, with
    input from the board of directors.


    There are several things to consider when deciding to pay a ransom. First and
    foremost, interactions with cyber criminals in and of itself should be weighed.
    The person or team that breached your network and caused disruption have already
    exhibited behaviors in conflict with appropriate business transactions. Moreover,
    they have attempted to extort money (Bitcoin, etc.) from your company to unlock
    the systems. These behaviors do not point to a high degree of confidence that
    future dealings with them will be forthright and professional. If the ransom is
    paid, there is no guarantee that systems will be unlocked by the adversary, that
    the decryption process works completely, or that they will not disclose your proprietary
    data anyway. Additionally, once the ransomware attack is successful, there are
    no guarantees that the same person or team won’t attack your company again, demanding
    another ransom.


    I’ve enjoyed fishing since my grandfather first took me as a young boy, and any
    time I get an opportunity, I like going out on the water to relax and try to catch
    my daily quota. I normally don’t fish in areas I haven’t tried too many times
    in the past. I always go to the sections of the lake or ocean where I have consistently
    caught fish before – I know that area has a better chance of success because it
    has worked for me in the past. Similarly, if the adversary has seen previous success
    in breaching a specific network and was paid, it stands to reason that the likelihood
    of future attacks and payment success for them on the same network may be better
    than average. When a ransom is paid, there is no promise by the adversary that
    they won’t attack you again.


    There are companies that specialize in negotiations between the attacker and the
    victim company. For a fee, these companies negotiate attacker’s demands to lower
    the ransom amount and serve as an intermediary between the two. While the negotiating
    firm may be reputable, the “breach supply chain” of the victim company, negotiator,
    and attacker still includes one non-reputable entity: the attacker. Even with
    just one bad player in the chain, the overall process still includes the potential
    for unreliable conclusions, even with the other two reputable companies are performing
    ethically.


    While no preventative controls work one hundred percent of the time, an argument
    can be made for a strategy that allocates funding in appropriate back-up systems
    and ransomware protections in a thoughtful budget process over time (before a
    ransomware attack) rather than spending millions on ransoms, only to have to implement
    security controls anyway at a later, post ransom point in time. A purely analytical,
    alternative argument may be that if I pay $2 million in a ransom, and it takes
    $4 million or more to'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'proactively strengthen preventative controls, it makes sense to just pay the
    ransom rather than spending a larger amount on prevention. Obviously, this is
    a short-sighted way to think about this issue. It may appear that, in this example,
    paying the ransom is more cost-efficient in time, effort, and cost to deploy preventative
    controls. But this argument only applies to this one instance. Imagine if it happens
    two or three times in a corporation, soon one would recognize that it isn’t a
    viable alternative. Not to mention the impact to the corporate brand because of
    multiple incidents as a result of inadequate preventative controls. As such, these
    types of alternative risk mitigations should not even be considered.


    All these deliberations should be discussed among your team and policies put in
    place prior to a ransomware event. Doing so puts all the decision-making processes
    on your terms rather than in an emergency when trying to beat a ransom demand
    countdown clock.


    # TURNING POLICY INTO PRACTICE


    You’ve invested significant work in building out the incident response policy,
    honed its processes, and identified the roles and responsibilities for all stakeholders.
    You even identified situations in which slight nuances to the response plan may
    be needed. In the end, you have a well-thought-out plan of attack for an incident.
    But if it only lives in a document that is rarely looked at, the response won’t
    be as effective as it could be.


    Like with most things, a good repeatable process takes practice.


    For every goal in a hockey game, behind it were several hours of ice time in the
    team’s practice facility. Weight training, viewing game highlights, endurance
    training, and practicing plays, all culminated in the few seconds it took to score
    a goal. Imagine if a team did no preliminary work and only took the ice during
    game time, the results would assuredly show ineffectiveness.


    A popular method for practicing your incident response plan is through table-top
    exercises. An attack scenario is created and introduced to your response team
    so that discussions and a walk-through of how the company would respond can be
    conducted. This is the time when mistakes and questions provide the most value.
    The more we learn in this environment, the better position we’ll be in when the
    real thing occurs. In the Marine Corps we used to say the more we sweat in peacetime,
    the less we may bleed in war.


    Leveraging a third-party partner to facilitate the table-top exercises can provide
    real value to your response practice. As mentioned previously, companies can leverage
    their cyber security partner for these services as part of their incident response
    retainer. A reputable firm will have a good understanding of the various attacks
    used, preferred vectors of attack, and some knowledge on tactics used. When engaging
    the partner, the CISO can help to describe what risks are most prevalent and the
    most important'
