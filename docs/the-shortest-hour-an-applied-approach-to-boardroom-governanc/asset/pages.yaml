    # OUTSOURCING SECURITY


    With increasing regulations, breaches, and the emergence of cyber security as
    a critical enabler of corporate business, in contrast with the available resources
    within the security industry, attracting and hiring experienced security talent
    has been challenging for some time. To address this, many security vendors have
    implemented services that provide full labor support (as a service) for their
    specific security platforms to alleviate the burden of clients hiring an FTE to
    perform this task. At first glance, this may appear to be an appealing alternative
    to solve a real labor constraint. Directors should dive more deeply into the decision
    to take advantage of these services, as well as the justification process for
    making the decision in these cases. It may be the case that a security platform
    vendor offers a support service for $200,000 U.S. annually (as an example) for
    supporting *only* their technology offering. If the estimate is an accurate representation
    of the costs associated with the service, it may not make good financial sense
    for a company. The price of that limited service could potentially fund two entry-level
    internal FTEs (fully burdened) for the security program who could support the
    particular platform, as well as supporting other cyber security initiatives. If
    a security organization leverages more than'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'one of these vendor service offerings, the collective value could diminish
    even more.


    Other vendors may provide dedicated resources to a client in the area of (again,
    as an example) threat intelligence. This resource would be committed to the client
    and provide very specialized services in garnering threat intelligence and reporting
    on them for the company. Since attracting and hiring a Threat Intelligence Specialist
    can be very difficult, and expensive, this type of service may make good fiscal
    sense for the company.


    Lastly, companies have built Managed Security Services Provider (MSSP) services.
    The vendor provides services to monitor and respond to cyber threats on behalf
    of the client, leveraging an operational model with security operation centers
    that may be sprinkled across the globe to provide 24×7×365 services. In the past
    decade, these providers have added more specialized services to their suite of
    capabilities such as forensics and incident response to round out their catalog.


    So how can you ensure that the CISO is choosing the right services to outsource,
    and which are appropriate to build in-house? It should come as no surprise when
    the answer is “it depends on the company”, as that is the common theme throughout
    this book. However, there are some tips and things to look for when making the
    outsourcing decision.


    The first is the need for expediency. To build capabilities in cyber security
    takes time to post jobs, attract talent, interview, make final candidate selections,
    background checks, and onboarding the new person. Leveraging outsourced services
    can help by standing up services quickly, especially when it comes to incident
    response (more on this topic later). If significant time constraints are present,
    it may make sense to outsource a specific capability, even if it is to only supplement
    the time it takes to build the capability internally.


    Next, it is important to consider the level of specialization needed to perform
    a specific task. Mentioned earlier were services such as threat intelligence and
    forensics, to name just two. For small- to medium-sized corporations, it may not
    make sense to build out such capabilities using internal resources and incur those
    costs when the company can leverage established, on-demand services provided by
    leading experts in the field.


    Evaluating the tasks being done by your in-house team to understand the engagement
    desires of the internal staff is also a very important consideration. Security
    experts with five or more years of experience may not feel fully engaged or may
    feel they are not participating in work they consider to be of high value, if
    they are merely monitoring network traffic looking for threats. They entered the
    field to perform engaging, highly technical work – tasks that provide them with
    challenge and self-fulfillment. In the absence of this type of work, the company
    may incur higher turnover of cyber security personnel who move on to other opportunities
    that provide more engaging work.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'One of the largest factors to consider in outsourcing is cost, or better stated,
    the value of the investment in outsourced services. Building an internal capability
    to provide 24x7x365 monitoring services can be quite a large investment for a
    company. There are direct costs associated with the labor required to provide
    such continuous monitoring for the company. Whether the staff is assembled in
    one location or spread across points all over the globe with the appropriate shift
    hand-offs, labor costs associated with building this important capability should
    be analyzed extensively. An internal capability will include the monitoring employees,
    shift supervisors, managers, and potentially a site director to run the program.
    Plans should be made to ensure there is an adequate number of staff to account
    for vacations, time-off, and time zone differences – if operating in multiple
    regions. CISOs should be cognizant of any gaps in coverage when switching monitoring
    services from site to site. Due to transferring the detection duties between global
    locations, there may be cases when a slight time frame exists where monitoring
    may not occur; potentially weekends and holidays, even if only for an hour. And
    in reviewing industry trends of when adversaries seek to attack, one will find
    it is often on weekends and holidays. Confirming the headcount that is appropriate
    to eliminate any gaps of coverage is vital, and management may find the results
    to be potentially expensive.


    Aside from the direct labor costs, there may be other expenses that surface to
    support such an internal model. For example, if the monitoring team(s) will be
    in a corporate office(s), there are required expenses to ensure the appropriate
    facility services are available, such as heating/cooling, security guards, and
    cafeteria/food services (when many offices may reduce these services outside of
    normal business hours).


    As an alternative to in-house development of detection services, several vendors
    have implemented an MSSP capability to provide monitoring (and other) services
    to clients which offer 24x7x365 coverage at a rate that can be much less than
    a company building its own ability. By leveraging economies of scale, the MSSP
    can monitor corporate networks and alert their clients to potential threats at
    a much lower cost. This relieves the client from incurring the expense of standing
    up an internal program while providing continuous monitoring around the clock.
    With the benefits of an outsourced monitoring contract comes a few watch items
    that should be considered when deciding to move such an important aspect of your
    information security program to a third party.


    First, not all MSSPs are considered equal. There are medium- and large-sized security
    corporations that specialize in cyber security and whose capabilities are best
    of breed. At the same time, there are very small vendors who offer similar services
    but without the focused competencies in cyber security. In the past decade, the
    industry has seen emerging offerings from small- and medium-sized consultancies
    who are very good in some domains'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'but may lack the expertise in detecting threats. Using the same criteria previously
    mentioned for determining the most important needs in an outsourced relationship,
    companies should evaluate the breadth and, importantly, the depth of the services
    provided by each of the vendor candidates.


    No matter which MSSP is chosen, it is important to remember that the vendor is
    providing baseline services to multiple clients. It is unlikely that a third party
