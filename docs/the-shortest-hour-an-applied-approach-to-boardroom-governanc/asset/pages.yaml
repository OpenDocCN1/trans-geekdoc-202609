  img_proc: true
- pgno: 142
  md: 'business risks the company wants to avoid. This helps to customize the table-top
    exercise to make it more realistic for the participants.


    In building the scenario, different “injects” can be added to the exercise. For
    example, after the response team learns the mean scenario (a ransomware attack
    at a manufacturing facility, for example) and begins working through the practice
    response, the partner will, at various intervals, add injects such as:


    +   - News of the breach is beginning to hit the press outlets.

    +   - The company’s stock price has just dropped significantly because of the
    news.

    +   - A reporter from a major news organization is on the phone and wants a comment
    on the breach.


    These injects serve to disrupt the flow of the response and cause distractions,
    events that could possibly occur during a real-life scenario. Customizing the
    tabletops and providing injects make the training optimally effective. An important
    factor to consider is to ensure the scenario is not shared with the participants
    in advance of the table-top exercise. Our adversaries don’t warn us about what
    they are about to do, so we should practice without participants’ advanced knowledge,
    making it as realistic as possible.


    Your CISO may suggest multiple table-top exercises: one for executives only, that
    serves as an awareness opportunity that shows what can potentially take place
    during an actual event; another for the technical teams to nail down the technical
    specifics of a response; and another for the entire response team in a full exercise.


    During an actual event, there will be external parties assisting you in your response
    and recovery. Your tabletops should include these important external partners
    to make the response as realistic as it would be in a real incident.


    In combination with an effective detection capability, an optimal incident response
    program ensures that threats can be identified quickly, and response processes
    initiated expediently, increasing the chances of the company returning to normal
    business processes quickly.'
