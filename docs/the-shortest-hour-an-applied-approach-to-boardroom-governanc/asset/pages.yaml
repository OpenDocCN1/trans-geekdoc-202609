- pgno: 127
  md: 'to reduce those risks. To be sure, many organizations, including the U.S. Government,
    are also exploring how generative and other forms of AI will impact industry.
    For example, the U.S. President recently issued a Presidential directive that
    seeks to develop an AI strategy to guard against misinformation and other potential
    downsides of the technology.


    Even with the need for more analysis, there are some things you can inquire about
    with your CISO regarding AI-related and AI-generative technologies while our collective
    security teams are performing their analysis. Ensuring that the security program
    keeps sight of the basics without a sole hyper focus on the technology is a good
    first start. In security, often what we should do is focus on the behaviors and
    not the technology. For example, a company may have historically had a policy
    that said no cameras are permitted in their data center. Over time, video camcorders
    became smaller and those were added to that policy to keep them out of the datacenters,
    as well. Then the emergence of mobile phones began, and more phone models included
    cameras. The policy would be expanded to include no cameras, no camcorders, and
    no mobile phones with cameras are permitted in the datacenter. In this particular
    example, the technology was the focus, losing sight of the behavior the company
    was trying to address: *no photographs are permitted inside the datacenter*. Our
    programs should put the attention on the behaviors we are trying to enforce (or
    disallow) and not solely focus on technologies that serve as a tool to these behaviors.


    Additionally, focusing on the behaviors will drive more directed outcomes related
    to what we call the CIA triad (confidentiality, integrity, and availability).
    Companies could strive to ensure that confidential information is not put into
    public-type AI-generative technologies. Moreover, addressing the integrity of
    the data outputs from AI solutions, ensuring that the information is internally
    and externally consistent, should be top of mind. Leaders depend on data to make
    business decisions and making sure the integrity of the AI-generated data being
    used to consider those decisions is crucial. These safeguards are not unique to
    AI technologies and are no different from the managing the CIA within messaging
    applications, email, or other technologies in use by corporations. Stick to the
    basics and address the key concerns.


    To convey expectations, it is wise for corporate security teams, in partnership
    with legal and privacy, to draft a policy directed toward generative AI usage
    to explain to employees what is allowed, and which actions are not permitted –
    as determined by the company.


    Many technology providers are exploring new ways to integrate AI-related technologies
    into their suite of products. Office productivity solutions and many other applications/services
