- pgno: 25
  md: 'who sabotages systems or steals corporate data to share or sell to competitors.
    Some employees may download large amounts of corporate data when leaving the company
    without the intent to sell to competitors, but the action still equates to an
    intentional and unauthorized act. Lastly, employees may cause disruption or data
    leakage without intent to cause harm or perform an unauthorized behavior. Instead,
    accidental actions by the employee, perhaps clicking on a link in a phishing email
    for example, can lead to grave damage to the company.


    To the degree that corporations dedicate time to their business model, our adversaries
    are doing the same, leveraging a huge unsavory market opportunity to conduct business.
    Important for the director to understand is that many of the threat actor groups
    are not loosely based; they have strong business models with revenue-sharing opportunities
    related to providing unauthorized access via an access broker.


    Companies are conducting business in new ways to increase top line revenue growth
    and improve bottom line efficiencies. The antiquated perimeter model of security
    is eroding to allow for more integrated partnerships. At the same time, our adversaries
    are growing their capabilities and tactics to launch attacks on any vulnerable
    corporation. Cyber insurance rates are climbing to historic levels and have become
    increasingly difficult to obtain. All of this makes for a perfect blend to raise
    cyber security to the top of any corporate executive’s attention. Not surprisingly,
    cyber security is often included as one of the top threats for a corporation in
    their enterprise risk management program.


    This section has painted a dismal view for corporations and my intent is to not
    fill the reader with fear, uncertainty, and doubt. Instead, it is to provide a
    realistic view into the threat landscape, while the rest of the book dives into
    areas where you can investigate within your corporate information security programs
    to reduce online risk.


    # Notes


    +   1. Dark Web – the deep part of the Internet and chat rooms where criminals
    conduct commerce and exchange malicious content.

    +   2. Denial of service is an attack whereby the adversary floods the targeted
    system/network with system traffic until the targeted system/network cannot respond
    to each request and then crashes, making the system unavailable for legitimate
    users.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Chapter 2


    # The chief information security officer role


    With the many threat variables outlined in Chapter 1, a dedicated resource to
    organize and address those threats across multiple security disciplines is critical
    for corporations today. The role of chief information security officer (CISO)
    has been in place (in some capacity) for a few decades but is still considered
    by many to be a relatively new role. It is typically the highest position dedicated
    to cyber security for a corporation and is responsible for the information security
    program. Due to the constant evolution of the position, as well as the public
    awareness to the continued onslaught of cyberattacks, it does indeed feel like
    a young role to many. In fact, while the number of CISO appointments continues
    to grow, not all companies have a CISO role. As a result, we live in an exciting
    time within our industry insofar as we have front row seats in witnessing the
    evolution of this unique executive position – and perhaps even have a hand in
    evolving it ourselves.


    In several cases, the role developed many years ago as breaches were increasing
    and regulatory issues were emerging, triggering a need for a leader to take point
    on information security. The logical choice was to appoint a person who deeply
    understood cyber security and was involved in the program. As a result, many technical
    persons who may not have possessed the core competencies in business administration,
    but had significant technical knowledge in cyber, were tapped for the responsibility.
    The new role then typically reported to the chief information officer (CIO) a
    mature executive role that balanced technology with business acumen and who could
    translate technology risks to senior management on behalf of the CISO. While the
    reporting structure for the CISO has evolved over the years, it still is a source
    of considerable debate in the security industry.


    When considering a reporting structure for your CISO, it may not prove very effective
    to benchmark industry trends or what other corporations are doing because the
    structure is vastly different across companies. There are CISOs who report to
    the board, some to the chief executive officer'
  merge: -1
  img_proc: true
- pgno: 27
  md: '(CEO), general counsel, the chief financial officer (CFO), chief operating
    officer (COO), or as previously mentioned, the CIO. The straight answer on where
    the role should report is “it depends.” What works for some companies may not
    be good for others. Traditionally the role reported to the CIO, but in recent
    years we’ve seen many CISO’s transitioning out of IT due to (in part) a perceived
    conflict of interest with the leader responsible for establishing open and business-enabling
    technologies, also leading the function that secures those technologies. There
    may be a case in which the CIO, who is incentivized to produce technology capabilities
    for the company, funds such technologies over security budget increases which
    do not have the same immediate value visibility as productivity investments. Additionally,
    the field of cyber security has widened so significantly over the past decade;
    it becomes increasingly difficult for the CIO to stay abreast of the security
    field while maintaining their core competencies in understanding and delivering
    the multitude of business technology solutions.


    Some in the industry say that placing a CISO as a direct report to the CEO demonstrates
    the company’s dedication and support to the information security program. By aligning
    security with the highest level of corporate leadership, the message sent to employees
    is that information security is so vital to the company; direct oversight by the
    CEO is required to stay aligned to its progress.


    Whatever the current argument within the industry related to reporting structure,
    the simple driver for deciding where to put the CISO in the org chart is simply
    around *access to leaders*. If the CISO has the ability to approach senior leaders
    with risk-based concerns and is able to present to you, the director, on a regular
    basis, reporting structure can be a moot point.


    In my career, I have reported to CFOs, CIOs, general counsels, a CEO, and executive
    vice presidents of shared services. There was no single case where the security
    program was more effective because of my reporting structure. What made the programs
    successful was my ability to convey important matters of security in an unbiased,
    unfiltered forum for the highest levels of corporate leadership to make risk-based
    decisions. However, there is a need to ensure that the CISO is organizationally
    well established within the company, so they are seen as a peer to other senior
    executives leading other important functions.


    Due to the importance of cyber security and its impact on the corporation, the
    role of CISO should be elevated to that of a senior executive in the corporation,
    and this would rely on the need for the CISO to have significant business expertise
    to excel in the position.


    An interesting benchmark to understand how the CISO role is sometimes perceived
    is to browse job postings by companies or recruiting agencies'
