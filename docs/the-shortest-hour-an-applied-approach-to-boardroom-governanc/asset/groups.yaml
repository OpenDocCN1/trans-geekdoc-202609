    # Chapter 10


    # Security service management


    It may be quite easy to conjure up an image of a corporate cyber security team
    and the way they carry out their important duties each day. If the stereotypical
    image comes to mind, no doubt they are assembled somewhere (either virtually or
    in an office) secretly performing “behind the curtain” functions that few outside
    of the team are aware of. While this is an exaggerated view (many security teams
    have evolved from this typecast), delivering cyber security services is indeed
    a novel concept that isn’t easily understood. Promoting the team as an enabler
    of the business and showcasing the services that are provided to the enterprise
    are great ways to shine light on this functional area that historically may have
    operated in the dark. We’ll discuss this more in the chapter on security awareness.
    For our purposes in this chapter, we’ll review the importance of service delivery
    for an information security organization and what it means for those outside the
    cyber team.


    Directors should seek out details in the security strategy that highlight the
    operating capabilities for the cyber security organization. A good way to demonstrate
    these capabilities is through a strong security service management program created
    by the CISO and their team. The program highlights its activities and explains
    the delivery and ongoing operations for each of its capabilities. In doing so,
    employees outside of the security organization can better understand how the security
    organization supports them. What follows are some general tips and guidelines
    that have proven successful for me across different companies. Remember that this
    is general information to enable the director to ask questions of the plan for
    his or her company and should not be seen as a complete service management program
    with all the elements that a professional in the service management field could
    provide. We’ll leave that to those experts. What follows is more than enough though
    to show the importance of a basic service management program for cyber security
    and its benefits.


    Leveraging the organizational structure of the security organization, each service
    tower consists of several buckets of service areas. For example, if one of'
