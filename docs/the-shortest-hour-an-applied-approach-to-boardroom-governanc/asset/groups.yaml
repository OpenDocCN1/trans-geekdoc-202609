  mdcn: "\n专注于人类心脏的专门训练和实践，几乎完全投入于此，这是一项我在进行手术时会觉得更有价值的专精技能。此外，这样一位经验丰富的心脏病专家可能已在学术医学期刊上发表过论文，并在医学会议上发表过主题演讲——所有这些都聚焦于心脏健康的*特定*领域，以推动行业发展。\n\
    \n关于何为专业能力的具体价值，可能会有不同的结论；我们刚刚探讨了其中的两种结论。一种来自调查受访者，他们认为自己的一位或多位董事会成员具备网络安全专业能力；另一种是我的观点，即受访者所陈述的专业能力可能达不到我之前定义的那种严格的专业能力要求。那么，谁是正确的呢？实际上，在受访者和我之间并没有正确的观点。专业能力是由做出决定或可能受该专业能力影响最大的个人所持有的个人看法。当我决定由谁为我实施心脏手术时，其他人认为谁是专家与我无关——选择我所认为的专家，是我的决定。\n\
    \n再考虑另一个例子：在法庭审判中，公诉人和辩护律师可能会邀请特定领域的委员会认证专家作证；通常，双方都会有自己的专家就同一件证据提供证词。尽管律师（以及专家本人）提供了大量资质证明来确立其专业地位，但最终哪位专家被认为更有学识、更可信，取决于该特定审判的法官或陪审团。就董事会中的网络安全专业能力而言，由谁给董事贴上网络专家标签并不重要，对这一专业能力的最终判断落在一个人身上：投资者。\n\
    \n这正是我们行业需要披露法规来识别不同公司董事会网络安全专业能力水平的原因；这将为投资者提供做出自己明智投资决策所需的知识。随着未来法规的出台，以及各公司对董事会网络安全专业能力构成内容的潜在披露浮出水面，供投资者和公众批判性地评估，我预计未来类似的研究将会显示，（总体而言）董事会中自称具备网络专业能力的肯定性回应会减少——直到这种可以被评估的聚焦式专业能力确实被添加进来并能够被证明合理。\n\
    \n向董事会增加一名网络安全专家，并不会让一位能够在网络之外的其它重要公司治理事务上做出贡献的董事失去席位。一位完全合格的、担任网络安全专家的董事会候选人，应当同时具备网络专业能力和卓越的业务资质。这两个属性并不是相互排斥的，虽然很难同时找到，但并非彼此分离。还记得我们那位对人类心脏有深厚专业知识的心脏病专家的例子吗？这并不预设该心脏病专家只能在心脏健康问题上为医学界做出贡献。他们拥有心脏之外的整体医学知识，并且能够在各种各样的医学话题上增加价值。此外，许多心脏病专家和其他专科外科医生经常在医院董事会和医疗行业专家组任职，为业务决策做出贡献。你的董事会网络安全专家可以在广泛多样的业务话题上增加价值，而不仅仅是网络。在一家公司内部，很少有职能能够更好地、更直观地看到整个公司正在发生的事情：网络安全就是其中之一。这种可见性有助于在诸多业务问题上进行更全面的决策。\n\
    \n## 董事会治理\n\n一个高绩效的网络安全董事会治理模型会是什么样子？正如本书的主题所强调的，由于每家公司都各不相同，每家公司对于治理网络安全项目成功与否都有自己的看法。以下是基于个人经验总结出的一些通用主题，并兼顾了本章前面概述的SEC规则。\n\
    \n### 首席信息安全官（CISO）\n\n你在本书前几页已经了解了CISO的角色，以及安排一位拥有广泛业务能力的资深专家担任网络安全项目负责人的重要性。为你的公司招聘合适的人选，需要你在招聘过程中投入大量精力。无论是被认定的具有网络安全专业能力的董事、委员会主席，还是董事会成员小组，对最终候选人的面试至少应有一位董事会层面的人参与。了解并信任在任者的专业能力至关重要。我认为，为了获得这种信任，就需要直接参与人选选拔。\n\
    \n对于那些主动将CISO纳入其业务的公司而言，了解CISO的专业能力和背景同样重要。去了解你的CISO；根据我的经验，他们了解你的背景，也了解你每一位同级董事的背景。研究董事会成员能够让CISO获得宝贵的洞察力，有助于他们履行向董事会报告的职责。同样，对于董事而言，直接了解其CISO的核心能力和经验也同样重要。\n\
    \n除了为你进行的定期报告之外，还应让CISO参与其他活动。让他们为新董事入职培训或特别项目提供协助，可以为你腾出更多时间与他们合作。CISO与董事会成员之间加强协作有助于建立信任，这是关系中一个关键要素。指示你的CISO将你纳入事件响应桌面演练或其他活动中，这些活动包括：\n\
    \n- 调查安全计划如何监控威胁的具体细节，包括人员/流程/技术、存在的任何差距，以及关于提供强大事件响应能力的深入对话，对于网络专家董事而言至关重要，以便能够提供指导。\n\
    - 识别安全计划中的任何差距以及弥补这些差距的潜在机会。\n  - 通过直接提问，具备网络专业能力的董事可以询问CISO是否拥有部署和维护有效安全计划所需的资源。在存在差距的地方，可以通过与CISO进行更深入的讨论来评估根本原因，以便为管理层提供指导。\n\
    - 分享与业务相关的威胁情报。\n  - 这是网络专家董事与CISO交谈的好机会，以更好地理解与公司安全计划相关或间接相关的外部威胁。了解公司所在行业特有的威胁形势，甚至可能针对公司本身的更具针对性的威胁情报，能够提供非常好的洞察。探索其他公司在特定领域正在做什么，以及/或一般的网络安全热门话题，也可以增加价值。\n\
    - 确认安全计划的人员、流程和技术属性是整体性的，并且与核心业务有强有力的整合。\n  - 正是在这些对话中，董事可以感受到公司内部特定运营部门的安全细节。支付卡流程的安全措施是什么样子的？驱动公司制造业的运营技术的安全性有多强？这些讨论有助于评估安全组织如何将其举措与业务联系起来——这是任何安全计划的关键组成部分。\n\
    \n我认为，为了进行这种高质量的讨论，董事会网络专家与CISO的交流频率应超过每季度一次。相反，每月一次的节奏不仅有助于识别主题领域的能力/差距，还能监控安全战略执行的进展，以及新出现的威胁和/或业务战略的变化，这些变化可能需要对交付给业务的网络安全服务进行调整。\n\
    \n当CISO向委员会或全体董事会提供更新时，董事会网络专家可以对主要主题进行评论，并担任董事会中非网络专家的翻译（尤其是在\n"
