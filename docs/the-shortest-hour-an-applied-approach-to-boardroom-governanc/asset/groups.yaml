    the provider’s infrastructure, the threat actor may be able to traverse to client
    networks. Significant resources from Nation-state adversaries are focused on these
    suppliers with this goal in mind and while cyber security focused MSSPs deploy
    significant controls to protect their offering, the increased targeting is a consideration
    to be weighed in deciding on which partner a company should engage to perform
