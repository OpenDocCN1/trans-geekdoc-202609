    # Chapter II


    # A vision for cyber security board

    governance


    An argument can be made about the need for increased board-level cyber security
    involvement by merely arguing the benefits to the business. Implementing preventative
    controls, continuous monitoring, and the ability to respond to cyber events in
    a timely manner, all contribute to the effectiveness of a company’s ability to
    manufacture products, ship them, deliver services, and transact with their customers.


    Good cyber security makes good business sense.


    Many corporations understand this and have implemented impressive cyber security
    programs without any direct regulations. Some have even created dedicated cyber
    security committees as part of their board structure. They have woven security
    into the rhythm of the business and look to cyber as an enabler of the business
    rather than a hindrance to it, or a necessary compliance requirement.


    A portion of these companies have built these impressive security functions on
    their own accord. They see the cyber security program in a visionary way, understanding
    the value in creating a robust capability for their business. Other companies
    may have built a cyber security program in which few others can compare, investing
    millions in the security budget, but have done so only after a major breach –
    when the realization of not having such a program becomes relevant for them. For
    some other companies, imposed regulations to increase cyber capabilities serve
    as the only driver for improvement.


    At the time of this writing, there are final rules by the U.S. Securities and
    Exchange Commission (U.S. SEC)¹ being implemented that seek to enhance and standardize
    disclosures regarding cyber security risk management, strategy, governance, and
    incident reporting by public companies. I believe there is an important distinction
    between the value of enhancing cyber security oversight by a company on its own
    accord and the value of implementing enhancements after being mandated to disclose
    its cyber security oversight. As mentioned, an effective cyber security program
    is good business and can be an enabler to it. I began writing this book a year'
