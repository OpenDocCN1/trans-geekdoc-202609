    But what exactly is a board cyber expert? It depends on who you ask. Browse the
    Internet and there is no shortage of industry reports, surveys, and research on
    the current state of cyber security expertise at the board level. Some of these
    reports highlight that the overwhelming majority of boards lack cyber security
    expertise, while other research shows a majority of boards have at least one,
    sometimes more than one, board member with cyber security expertise. And other
    reports show varying numbers in the middle. Why such a discrepancy in the results?
    My belief is that there are a few contributors to the variances in the findings.


    For example, many reports are generated by leveraging survey data, asking the
    subject of the study to self-evaluate expertise, which can lead to interpretation
    issues by the respondents of what true expertise may mean. Additionally, some
    of the reports interchange the words experience with expertise, both of which
    are vastly different from one another.


    In my personal opinion, I would respectfully challenge some of the surveys that
    showed a majority of respondents claimed their board had at least one cyber security
    expert or more. Did the “expertise” equate to a more general *expertise* in digital
    and technology knowledge that I previously outlined, and with indirect *experience*
    in cyber? Or was the expertise truly steeped in focused, specialized *expertise*
    in the domain of cyber security?


    Without diverting too much from our topic at hand, it does seem appropriate to
    investigate a bit more on this notion of expertise, to understand the different
    interpretations of expertise and to come to a general agreement on what constitutes
    expertise in a particular field. Even a technology executive, such as a CIO, who
    may have had management duties over cyber security, in addition to digital initiatives,
