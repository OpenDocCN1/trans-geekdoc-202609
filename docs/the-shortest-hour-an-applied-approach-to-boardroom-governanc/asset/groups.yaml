    agree, with various comments on the increased scope for audit committees surfacing
    in business articles.


    Imagine (as an example) that the average information security briefing for a company
    is fifteen minutes on the committee’s agenda each quarter. If accurate, it is
    my opinion that a total of one hour each year is not enough time for directors
    to understand, question, challenge, and provide guidance on important cyber security
    topics for the company, given today’s environment. This *shortest hour* is one
    of the most critical for protecting a corporation, and it would be prudent for
    boards to re-examine the placement of cyber security within the audit committee
    to allow more attention to the topic and make any necessary adjustments based
    on their assessment.


    In recent years, our industry has seen an increase of separation from cyber being
    discussed at the Audit Committee, moving instead to a Technology Committee, or
    in some cases (and with this author’s belief of anticipated frequency of the practice
    in the future), a dedicated Cyber Security Committee. These companies have realized
    that technology is an increasingly important enabler to their business strategy
    and directors desire to have more understanding of the strategies incorporating
    these technologies. Aside from the benefits for CIOs and their IT organizations,
    a technology committee provides a well-structured forum for the CISO to discuss
    important cyber security topics. During my career, I have worked with just one
    Technology Committee amongst all the Boards and committees to which I presented.
    I found the experience to be valuable to the degree that more security initiatives
    could be discussed, and while we never dive into technical details at the board
    committee level, the structure did allow for more depth in areas such as strategic
    and operational oversight.


    The emergence of dedicated cyber security committees is not out of the realm of
    possibility. In fact, there are predictions that more boards will have a dedicated
    cyber security committee in the not-so-distant future. Many factors contribute
    to the emergence of such a committee, not the least of which is the identification
    of cyber-related threats landing near the top of corporations’ enterprise risk
    management programs. Additionally, at the time of this writing, new emerging regulations
    require companies to publically divulge the details around their cyber security
    oversight. With more board attention to an area that is considered high risk for
    global corporations, the natural evolution of cyber-centric committees will follow.


    # ## BOARD ENGAGEMENTS


    The level of interaction between the CISO and the board of directors varies widely
    due to the uniqueness of board make-up, industry, security posture of the company,
    and a host of other variables. There are different options available to the director
    for learning more about cyber security, specifically the posture and potential
    impacts for your organization.'
