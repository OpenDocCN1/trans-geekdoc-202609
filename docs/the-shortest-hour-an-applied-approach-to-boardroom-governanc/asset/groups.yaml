  - '[PAGE 48]


    It was often the case when a new director was elected to the board, I was asked
    to brief them on the security program for the company where they were about to
    begin their duties. During my career there were many times when I would fly to
    a location and meet with the new director to provide this type of 1:1 briefing.
    Covering areas such as the security posture of the company, any residual risks
    that exist, the appropriateness of the security resources for the team, and top
    threats to the company are beneficial for the new director to understand. Additionally,
    it jump-starts the relationship between the CISO and the newest board member.


    The interaction between the committee chairperson and the CISO should reflect
    the criticality of this important relationship. You have read about my previous
    job interview with the technology committee chairperson and the benefits for both
    of us during that interaction, but the conversations extended beyond that discussion.
    We would meet one-on-one prior to the committee meeting to discuss what I will
    presenting, but with more detail on the intent or backstory of the content. This
    was very helpful as it laid out the upcoming session for the chairperson, as well
    as provided me with critical feedback on areas I could expand upon in the committee
    briefing. Whatever form it takes, directors should take advantage of the CISO’s
    knowledge to probe into more details on cyber security in an informal, one-on-one
    format.


    # INCIDENT RESPONSE BRIEFINGS


    Several years ago, I had to make a very difficult Saturday morning phone call
    to the CEO of my company at the time. I notified him that a significant breach
    was taking place at our company, and we stood up the incident response team (supplemented
    with third-party support from a cyber security firm) to remediate the issue. As
    we talked, I briefed him at a high level on what happened, our current response
    activities, and what I needed in the way of resources to assist in the response.
    He approved the resources, thanked me for the call, and asked that I fly to meet
    him for a special gathering of the full board the following Wednesday to update
    them on the incident.


    Proper incident response requires active involvement from the board, as well as
    informative and direct communication from the CISO. Briefings to the board on
    incident response should be reserved for large-scale attacks that involve adversarial
    occupation within the network, events that may cause large compliance or brand
    impact, or incidents involving significant disruption to the business. It can
    be easy for the board to be inundated with updates on broad-based incidents. Phishing
    attacks are rampant and usually it is the case that the security team can respond,
    triage, and remediate them quickly. Perhaps these types of attacks ought not be
    part of board involvement, but rather just updates during the regular briefings.


    A general practice I have seen in my career is the management team and the board
