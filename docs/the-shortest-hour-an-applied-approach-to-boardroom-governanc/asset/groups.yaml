    in a specific discipline is something that is garnered through deep experience,
    advanced training, and years of focused practice – *almost exclusively in that
    domain*. Moreover, a true expert moves beyond individual practice and shares their
    expertise more broadly through public speaking, publications, etc., *in that specific
