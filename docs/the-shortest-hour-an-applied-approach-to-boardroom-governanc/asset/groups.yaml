  - '[PAGE 98]


    example, and specifically role-based training, some of the steps could include
    the identification of training participants by role, curriculum development, creation
    of presentation materials, resource allocation steps (booking rooms or video conferencing),
    delivery of the training curriculum, reporting on who attended the training, and
    so on. The long service description provides all the details of what is included
    in the service so that delivery outcomes are clearly understood by all stakeholders.


    # SERVICE LEVEL OBJECTIVE (SLO)


    All relative timelines and expected quality of service results are included in
    this section. It highlights the components of what the final delivery product/service/report
    will include, timelines associated with the service, and appropriate measurements
    related to examining the effectiveness of the service. For some security organizations,
    particularly those that are in the building stage and not as mature as they would
    like to be, there may be a hesitance to commit to specific service levels knowing
    that they cannot meet them with current resources. I understand this reluctance,
    but by providing SLOs that outline where the security organization wants to be
    in a particular service area, measurements can be gathered to assist in resource
    planning. Rather than approaching senior leadership with labor addition requests
    that are justified by “we have a lot of work in this area and are falling behind”
    – a more effective method exists. By drawing a line in the sand with target SLOs,
    the CISO can show the average number of hours it takes to provide the service
    effectively, the current state of SLO performance, the gap between the two, and
    the labor resources needed to close the gap. This data-driven analysis can be
    achieved through the SLO component of the service catalog and provides excellent
    justification for resources.


    # HOW TO ORDER THE SERVICE


    An important part of any service catalog is how a user orders the services from
    the information security team for the particular statement of work. Ordering the
    service may involve a ticketing system so that all services are tracked from order
    to completion or perhaps a request to a centralized corporate email box. Whatever
    method a company uses, the specifics for how to order the service are outlined
    in this section. On more than a few occasions, a cyber security service won’t
    involve the customer ordering the service, instead it is just something that is
    pushed out by the security team, i.e., network monitoring. This doesn’t negate
    the need for a service description and details such as these should be included
    in this section of the service catalog.'
  - '[PAGE 99]


    # COST OF THE SERVICE


    Not all companies allocate security costs by services provided. Some may do a
    general security allocation based on the number of employees or by email accounts,
    and others may do no allocation at all. Even without a cost allocation model,
    capturing the internal costs associated with providing the service can be beneficial
    in future demand management forecasting. This section of the service description
    highlights the labor costs for the time anticipated in providing the service,
    plus any additional internal or external costs that may be incurred in its delivery.


    It has been outlined previously that security services are more cost effective
    and with fewer project schedule delays when the information security team is brought
    into the initiative during its earliest stages. To help promote this, the service
    catalog highlights the varying levels of a service available to the requestor,
    possibly in the form of standard, gold, and platinum services. For example, if
    a requestor would like a vulnerability scan of a specific system tied to one of
    their critical processes, the standard service option may detail that the scan
    and subsequent reporting of results will take five business days. In some cases,
    the requestor may explain the service is just what they need, but they require
    it to be completed in three days. Security can still provide the service, but
    this gold level requires a 2x multiplier to the standard labor cost associated
    with the service. Perhaps the requestor would like the service, but time restrictions
    require the service to be completed in one business day. This platinum service
    includes a 3x multiplier to the standard labor cost due to the aggressive schedule.
    We see this type of service option when we order products online and are contemplating
    shipping options. There are standard shipping times, as well as a host of other
    options up to and including next day air, that deliver the product according to
    the consumer’s need. However, the product ordered is still the same. Incorporating
    these levels in a company that allocates costs based on services helps to incentivize
    earlier engagement of security. For those companies that do not do such allocation,
    this level of detail is still a benefit for planning purposes related to demand
    management by looking at trending data of how services are typically ordered and
    on what timeline.


    # SERVICE OPTIONS


    For an information security service, typically there are no alternative options
    available (or permitted) for the person requesting services. A requestor cannot
    leverage a third party of their choice to perform security offerings in a chartered
    information security program because the cyber security organization has been
    authorized by the executive'
