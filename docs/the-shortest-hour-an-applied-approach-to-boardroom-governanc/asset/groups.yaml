  - "[PAGE 13]\n\n# Preface\n\nI believe we are the sum of all the people and experiences\
    \ that came before us, each providing inputs to our lives that collectively make\
    \ up who we are, sprinkled with a little of our own individuality. A book is a\
    \ lot like this too, I think. I am merely a storyteller of the collection of inputs\
    \ that have affected my life and contributed to the content of this book. Whether\
    \ it was two decades of collaborating with incredible teammates in large corporations,\
    \ partnering with the highest levels of corporate governance, or an impactful\
    \ two-minute conversation with an interesting stranger in an airport, each interaction\
    \ has helped shape my thoughts on so many different topics. For our purpose here,\
    \ my thoughts are focused on the management and oversight of a cyber security\
    \ program for a corporation.\n\nThis book is not a technical guide; that is an\
    \ important theme of this book: cyber security is not a technical issue. It is\
    \ a business issue that deserves significant attention from business executives.\
    \ Of course, technology plays a crucial role in cyber security but only as a tool,\
    \ a partial means to a larger end. It is very much like an adversary who uses\
    \ malicious software (malware) as a mechanism to achieve something that is deeper\
    \ than the technology, something that is at the heart of the issue: their malevolent\
    \ intent combined with their criminal behavior. As you will read in the following\
    \ chapters, I believe there should be a shift in how cyber security should evolve\
    \ in the boardroom. I hope that this book inspires change and imagines a vision\
    \ for where information security oversight could evolve.\n\n**Lee Parrish**  \n\
    *December 2023*\n\nFor feedback and inquiries regarding this book and/or speaking\
    \ engagement requests, please contact the author by visiting: www.novelsecurity.com"
