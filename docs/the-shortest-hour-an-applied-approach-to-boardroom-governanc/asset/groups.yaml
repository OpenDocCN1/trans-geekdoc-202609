    NIST、ISO 或 CIS 控制）为基准？ |

    | **网络安全战略规划** | **人员** | 安全计划是否完全以具备多年经验的高素质候选人（这可能不现实）来满足全部人力需求？<br><br>战略计划如何应对缺乏具有丰富网络安全经验的行业候选人的问题？<br><br>战略规划中是否包含针对安全员工的培训考量？
    |


    | 类别 | 问题 |

