    and medical industry panels, contributing to business decisions. Your board cyber
    security expert can add value to, across wide-ranging business topics, not just
    cyber. There are few functions inside a corporation that has a better, more visible
    role to all that is going on across the company: Cyber security is one of those
    functions. Such visibility lends itself to more comprehensive decision-making
    on a number of business issues.


    # BOARD GOVERNANCE


    What could a high-performing board governance model for cyber security look like?
    Much as is the theme of this book, because every corporation is different, each
    company will have its own view of what success looks like in governing the cyber
    security program. What follows are some general themes based on personal experience,
    with an eye to the SEC rules previously outlined in this chapter.


    # THE CISO


    You have read about the role of the CISO in the early pages of this book and the
    importance of placing a well-qualified expert with extensive business competencies
    as your leader of the cyber security program. Hiring the right person for your
    corporation requires your significant input into the recruiting process. Whether
    it is the identified director with cyber security expertise, a committee chairperson,
    or a panel of board members, interviews with the final candidates should include
    at least one at the board level. Having knowledge and confidence in the expertise
    of the incumbent is critical. It is my belief that to garner that confidence,
    direct involvement in the selection of the person is required.


    For those companies who have proactively included a CISO into their business,
    it is equally important to understand the CISO’s expertise and background. Get
    to know your CISO; I can say from experience, they know your background, as well
    as the backgrounds of each of your peer directors. Researching board members provides
    the CISO with valuable insights that assist them with performing their board reporting
    duties. The same can be said for directors having direct knowledge of their CISO
    regarding their core competencies and experience.


    Engage your CISO in other activities aside from the regular reporting they perform
    for you. Enlisting their services in new director onboarding or special projects
    helps to provide you with more time to partner with them. Increased collaboration
    between the CISO and the board members helps to develop trust, a key component
    in the relationship. Instruct your CISO to include you in incident response tabletop
    exercises or other activities that'
