    relationship between the service provider and the client is vital. Ensuring that
    service levels are agreed upon, open communication between the two entities is
    well established, and actionable metrics/alerts are provided to the client helps
    in this assurance. This relationship, unlike many others, is truly an extension
    of the internal team.


