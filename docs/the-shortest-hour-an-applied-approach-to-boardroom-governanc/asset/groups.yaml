    # Policy management


    While it may not be the most exciting aspect of cyber security, the information
    security policy program is the foundation for setting user expectations with regard
    to protecting the corporation and as such is a critical part of an information
    security program. The policies mandate what is permissible and what is not when
    it comes to computing practices for the corporation. It is important to understand
    that policies are created to provide direction to the users of a company’s computing
    systems, and as such, the policies should be easy to understand and written with
    the end user in mind.


    As a high-level overview, a policy program consists of the following types of
    documentation. Some organizations may include other documentation such as work
    instructions or topical manuals, depending on their needs. But the typical documents
    include:


    +   - **Policy:** A high-level document, ideally one or two pages, which outlines
    general expectations related to a particular security topic. Policies are mandatory;
    every user must adhere to the policy. Policies are reviewed annually, and a good,
    high-level policy will require little edits during the annual review process because
    of the generality of the document.

    +   - **Procedures:** Another mandatory document “procedures” expands on the policies
    and adds much more detail on expectations related to a specific security topic,
    which could include process steps, configuration requirements, or other considerations
    that apply to the policy.

    +   - **Standards:** Also mandatory, standards provide detailed requirements related
    to the policy and perhaps technology standards for adhering to the policy.

    +   - **Guidelines:** These are not mandatory and as the name suggests provide
    guidelines that are flexible for the user in implementation related to policies,
    as long as they adhere to the standards and procedures. As a point of interest
    for global corporations, there may be confusion regarding the word “guidelines”
    due to cultural interpretations. For example, in my career I have found that the
    term “guideline” is looked'
  - '[PAGE 153]


    upon as a mandatory requirement in certain country cultures, whereas in the United
    States, guidelines are recommendations. To some of these cultures, the word guideline
    is interchangeable with the word policy and are mandated. Should a similar issue
    arise for your global organization, this conflict in the expectation for guidelines
    should be addressed by the CISO to ensure everyone understands which policy documents
    are mandatory and which are recommendations.


    Together, these documents make up the information security policy program for
    a corporation. They provide a reference for employees to understand the company’s
    expectations of them when leveraging computing attributes and handling data. It
    is imperative then that every policy document is not filled with technical jargon
    that they don’t understand. Of course, in some of the deeper, more detailed procedures,
    there is a need for technical configuration requirements and the like, but policies
    in general should be easy to understand.


    When I arrived at three previous companies as the new CISO, I found that each
    security organization incorporated all aspects of the policy program: policies,
    procedures, standards, and guidelines, in one large document. Often times, this
    collective information security policy was over one hundred pages. I made cyber
    security my career and have a deep passion for it, but I even have difficulty
    reading hundred plus pages of security policy – how can we expect our employees
    to read it and understand it?


    I have found success with the method that many companies employ in their policy
    programs. Policies are developed as one or two pages of very broad language specific
    to a security topic, i.e., data protection policy. It is a quick reference that
    gives the statement of policy, language regarding who the policy applies to, and
    other important information. Because it is high level, employees may want to know
    more details on expectations. To provide that detail, each policy is linked to
    other separate policy documents such as procedures, standards, and guidelines,
    all interconnected so the employee can read as much detail as they wish, without
    having to sift through a hundred plus page document.


    Another issue with a combined, all-in-one document is that the document seeks
    to cover all information security topics. As a result, the document may not include
    all of the important procedural details related to every security policy. In the
    end, the program is left with trying to encompass too much, and at a cost of not
    covering each theme in enough detail.


    It is imperative that the policy documents are stored in an area where employees
    can readily access them, typically on a corporate web page that houses other important
    policies. Perhaps your company leverages an enterprise governance, risk, and compliance
    (eGRC) platform that automates the approval process and stores the policies as
    well. Whichever method is chosen, it is important to store the policies in one
    location, if possible.'
