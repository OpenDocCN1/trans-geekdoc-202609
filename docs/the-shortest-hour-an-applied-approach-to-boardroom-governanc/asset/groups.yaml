    +   1.1.5 Metrics and Reporting

    +   1.2 Policy Management

    +     1.2.1 Policy Development

    +     1.2.2 Policy Approval

    +     1.2.3 Exception Process

    +     1.2.4 Annual Policy Review

    +   1.3 Compliance

    +     1.3.1 PCI Compliance

    +       1.3.1.1 Evidence Collection

    +       1.3.1.2 Assessment Facilitation

    +       1.3.1.3 Delivery and Reporting

    +     1.3.2 Sarbanes-Oxley Compliance

    +       1.3.2.1 Evidence Collection

    +       1.3.2.2 Facilitation with Third-Party Auditors

    +       1.3.2.3 Reporting

    +   1.4 Risk Management

    +     1.4.1 Third-Party Risk Evaluations

    +     1.4.2 Enterprise Risk Management Support

    +     1.4.3 Risk Register Maintenance


    With the foundations in place, the service catalog is ready to be built out through
    the creation of service descriptions for each discrete service. Although they
    could vary depending on need, potential elements of the service descriptions could
    include the following.


    # SERVICE NAME


    As it suggests, this is the name of the service. Because the service catalog is
    geared for non-security personnel, industry or very technical terms should be
    avoided. For example, a service name should not be Static Application Security
    Testing. Instead, leveraging a simple descriptor such as Software Security Testing
    may be easier for readers to understand. Within the service description, any differentiation
    between the specific types of software testing can be explained.


    # SHORT DESCRIPTION


    This is a quick reference for the user to understand a summary of the service.
    Containing a few sentences, the short description provides an executive overview
    of the service being documented.


    # LONG DESCRIPTION


    Expanding on the short description, this section highlights more specifics related
    to the service, what is included, and a brief highlight of the steps involved
    in providing the service. Keeping with the security awareness'
