    each year, every year, for the life of the contract. The combination of training
    dollars, employee involvement in the industry, and sponsorship by our vendors
    together provide nearly limitless opportunities for each security employee to
    learn, grow, and maintain effectiveness in a fast-paced industry.


    As a director evaluating a security strategy, it is feasible for you to ask, “how
    many security employees should we have”, or “how many is considered too many”?
    There is no magic formula to determine the appropriate amount of security personnel
    your company should employ. The number relies on several factors such as the risk
    posture for your company, the financial position of the company for adding new
    talent, and the current maturity of the information security program. However,
    in your review of the labor components to the security strategic plan, solid analysis
    should be demonstrated by the CISO on how the number was reached.


    The first step the CISO performs is to identify the critical skill sets that are
    needed for the company’s security program. These skills will provide the company
    with the requisite capabilities to perform the desired security services most
    important to its cyber journey that support business objectives. Next, the security
    executive assesses the skills of the current security team, then identifies gaps
    between desired and current states. A basic business school graphic can help outline
    the required competencies needed to fill the gaps (see Figure 6.1).


    This simple exercise ensures that only the most critical needs are addressed first
    when building the people components of the cyber security program and reserving
    beneficial (but not critical) roles for onboarding later, as financial timing
