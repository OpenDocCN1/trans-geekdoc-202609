    |---|---|---|---|---|---|

    | Vulnerability Management | Endpoint Security | Policy Management | Security
    Awareness | Multi-Factor Authentication | Privileged Access |

    | Server/System Security | Monitoring & Detection | Compliance | Risk Management
    | Federation & Single Sign-On | Identity Access Lifecycle |

    | Cloud Security | Application Security |  |  | ERP Security | Architecture Services
    |

    | OT/IoT Security | Threat Intelligence |  |  | Data Loss Prevention | IAM Governance
    |


    *Figure 10.1* Security service towers.


    the teams is security operations, potential buckets could include vulnerability
    management, endpoint security, monitoring/detection, server/system security, cloud
    security, application security, OT/IoT security, threat intelligence, and penetration
    testing, to name a few possible examples. Another team may be focused on governance,
    risk, and compliance (GRC) and its buckets may include security awareness, risk
    management, policy management, metrics, third-party risk, and possibly compliance.
    How many service towers exist is dependent on the company, but the above areas
    serve as a good sample for our purposes here. When assembled, the service towers
    may look as in Figure 10.1.


    Each block within each service tower represents a bucket of services, with each
    block containing five to ten discrete services related to the service area. For
    example, under GRC there is a block called “security awareness,” and within that
    block contains individual services such as role-based training, annual security
    compliance training, security awareness articles, internal phishing campaigns,
    reporting, as well as other potential services. It is important to capture as
    many of the services the team provides and after identifying all the services
    within all the buckets across the different security towers, an information security
    service catalog begins to emerge.


    The next step is to create a work breakdown structure (WBS) that breaks down the
    enormous work areas performed by the cyber security team into manageable increments.
    A standard numbering system is sufficient to group smaller services with the larger
    service buckets within the security service tower. For example:


    +   1.0 **GRC Services**

    +      1.1 Security Awareness

    +         1.1.1 Role-Based Training

    +         1.1.2 Annual Security Compliance Training

    +         1.1.3 Security Awareness Articles

    +         1.1.4 Internal Phishing Campaigns'
