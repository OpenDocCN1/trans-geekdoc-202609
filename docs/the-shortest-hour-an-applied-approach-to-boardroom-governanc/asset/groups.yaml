    \n## 关于作者\n\n![](img/1f2064bafeb84712e9a55bdb844d2074_11_0.png)\n\n李·帕里什（Lee Parrish）是一位屡获殊荣的技术高管，拥有二十多年将网络安全专业知识与核心业务能力相结合的独特经验。作为首席信息安全官，他为全球财富500强企业定制了网络安全战略，并领导了针对网络事件的实际事件响应。李曾担任多个董事会的网络安全信任顾问，这些董事会成员包括首席执行官、前白宫幕僚长、退休的高级军官以及一位前美国总统候选人。\n\
    \n李拥有两个研究生学位，并同时获得“董事会合格技术专家”和“认证信息系统安全专家”的认证。他在行业期刊上发表了大量文章，参与撰写了一本畅销的信息安全书籍，并创作了一本关于网络安全的儿童读物。他经常在国际安全会议上发表演讲，并做客多个播客节目。\n\
    \n李是美国海军陆战队的战斗老兵。\n"
