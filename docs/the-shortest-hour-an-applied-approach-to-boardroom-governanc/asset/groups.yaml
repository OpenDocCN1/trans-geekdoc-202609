    # Chapter 6


    # The strategic plan


    Building a cyber security strategic plan for a company requires close integration
    with the goals of the business and is dependent on a wide array of factors which
    make it nearly impossible to transfer one corporation’s security strategy to another
    organization. Each company has a different risk profile, current security posture,
    and financial position that affects the timeline of the strategy.


    While many management teams focus on three-year strategic plans, others may accelerate
    their cyber strategy due to specific risks to the company or perhaps critical
    gaps that cannot wait for progressive improvement. The availability of free operating
    cash flow to fund the security strategy is different from company to company which
    requires even more reliance on risk-based security investment decisions. Whatever
    timeline a company chooses to deploy their strategic plan, it is important for
    you to remember that the velocity of cyber risk moves very quickly, and three
    years can equate to a lifetime in the world of information security.


    A good cyber strategy is one that prioritizes on risks to the company and doesn’t
    try to quickly address every single need in the security domain. Your CISO should
    deliver a plan that takes the needs of the business (not just cyber security needs)
    and puts them into a realistic timeline that allows for efficient risk mitigation,
    not all at once, but not over the course of several years either. This is the
    point in time in which all the due diligence you’ve demonstrated in searching
    and selecting a CISO with strong business expertise (and at the same level as
    the other C-level executives of your team) pays dividends.


    It was previously mentioned that a good briefing is done in such a way that facilitates
    easier decision-making for the management team. To accomplish this, cyber security
    strategies should have, at a minimum, three distinct categories: people, process,
    and technology. While they collectively are part of the larger cyber security
    strategy, each can be discussed individually with those executives of the management
    team responsible for those areas to gain their insights.'
