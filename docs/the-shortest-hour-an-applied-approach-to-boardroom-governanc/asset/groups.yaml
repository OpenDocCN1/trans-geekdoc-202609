    |  | 战略是否包含独特的工作角色，例如参谋长、副 CISO 等，并解释每个角色的价值，以评估是否需要这些类型的角色？ |

    | 流程 | CISO 与业务部门接触、巡视设施和办公室以了解业务需求的频率有多高？ |

    | 流程 | 战略是否与常见的安全框架（如 NIST、ISO 和 CIS 控制）保持一致？ |

