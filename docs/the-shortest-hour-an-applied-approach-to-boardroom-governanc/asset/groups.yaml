    \n无论选择哪家 MSSP，重要的是要记住，供应商是为多个客户提供基础服务的。第三方不太可能对您的企业网络、公司的业务流程和战略，或 IT 和业务部门的所有关键利益相关者有着同样深入的了解。即使采用外包模式，CISO\
    \ 仍然需要组建一支有能力的内置安全专家团队，负责调查警报、将其转化为对组织构成的实际威胁，并加以补救。与云外包模式类似，安全服务不能完全交给第三方，并期望随之获得全套的安全服务方案。服务提供商与客户之间的牢固关系至关重要。确保双方就服务水平达成一致，建立良好的开放式沟通渠道，并向客户提供可操作的指标/警报，都有助于实现这一目标。与许多其他关系不同，这种关系真正是内部团队的延伸。\n\
    \nMSSP 是攻击者的重大目标，他们希望入侵供应商的基础设施后，威胁行为者能够渗透到客户网络。国家级对手的大量资源正是着眼于这一目标而针对这些供应商，尽管以网络安全为重点的\
    \ MSSP 部署了大量控制措施来保护其服务，但这种日益增多的针对性攻击仍是在决定选择哪家合作伙伴来执行监控服务时需要权衡的考虑因素。\n\n网络安全供应商已扩展其服务组合，远远超出了检测范围。如前所述，在某些情况下，经验丰富的外包合作伙伴可以成为在公司内部构建这些非监控、高技术含量服务的不错替代方案。但与大多数事情一样，也可以论证建立内部能力在财务上可能更合理，尤其是对于大型企业而言。在我撰写本文时，我见过提供深度安全分析服务的供应商时薪从\
    \ 300 美元到 600 美元不等。如果一家大型企业对这类小众服务有持续的高需求，CISO 完全可以合理地辩称，他们可以按每小时 70–150 美元的全负担内部费率，再加上一些技术投入和对安全人员可能进行的专业培训来完成这项工作。说到安全员工，这种深度且有挑战性的工作正是他们想做的——这也是他们进入这个领域的原因。\n\
    \nCISO 在履行职责时需要帮助，而安全供应商是构建整体安全方案的重要组成部分。与此同时，安全产品/服务行业已经让高管们应接不暇——\n\n## 第 10\
    \ 章：安全服务管理\n\n人们很容易在脑海中浮现企业网络安全团队的形象，以及他们每天执行重要职责的方式。如果想到的是刻板印象，那毫无疑问，他们聚集在某处（无论是虚拟还是办公室）秘密地执行着“幕后”职能，团队之外很少有人知道。虽然这是一种夸张的看法（许多安全团队已从这种刻板印象中演变出来），但提供网络安全服务确实是一个不容易理解的新颖概念。将团队宣传为业务的推动者，并展示为企业提供的服务，是照亮这个历史上可能一直暗中运作的职能领域的好方法。我们将在关于安全意识的章节中进一步讨论这一点。在本章中，我们将探讨服务交付对信息安全组织的重要性，以及对网络团队之外的人员意味着什么。\n\
    \n主管应寻求安全战略中突出网络安全组织运营能力的细节。展示这些能力的一个好方法是通过 CISO 及其团队创建的强大安全服务管理计划。该计划突出其活动，并解释每项能力的交付和持续运营。通过这样做，安全组织之外的员工可以更好地理解安全组织如何为他们提供支持。以下是一些通用的技巧和指南，这些在我任职的不同公司中都被证明是有效的。请记住，这些是一般性信息，旨在让主管能够针对其所在公司的计划提出问题，而不应被视为完整的服务管理计划，包含服务管理领域专业人士可能提供的所有要素。我们把这些留给那些专家。不过，以下内容足以展示基础安全服务管理计划的重要性及其益处。\n\
    \n### 安全服务塔\n\n利用安全组织的组织结构，每个服务塔由多个服务领域桶组成。例如，如果其中一个团队是安全运营，潜在的桶可能包括漏洞管理、端点安全、监控/检测、服务器/系统安全、云安全、应用安全、OT/IoT\
    \ 安全、威胁情报和渗透测试等，仅举几例。另一个团队可能专注于治理、风险与合规（GRC），其桶可能包括安全意识、风险管理、策略管理、指标、第三方风险，以及可能的合规性。服务塔的数量取决于公司，但上述领域在我们这里作为很好的示例。组装完成后，服务塔可能如图\
    \ 10.1 所示。\n\n| 安全运营 | 治理、风险与合规 | 身份访问管理 |\n|---|---|---|\n| 漏洞管理<br>端点安全 | 策略管理<br>安全意识\
    \ | 多因素认证<br>特权访问 |\n| 服务器/系统安全<br>监控与检测 | 合规性<br>风险管理 | 联邦与单点登录<br>身份访问生命周期 |\n\
    | 云安全<br>应用安全 | — | ERP 安全<br>架构服务 |\n| OT/IoT 安全<br>威胁情报 | — | 数据丢失防护<br>IAM\
    \ 治理 |\n\n*图 10.1* 安全服务塔。\n\n每个服务塔中的每个块代表一个服务领域桶，每个块包含五到十个与该服务领域相关的离散服务。例如，在 GRC\
    \ 下有一个名为“安全意识”的块，该块内包含角色化培训、年度安全合规培训、安全意识文章、内部钓鱼演练、报告等单独服务，以及其他潜在服务。重要的是尽可能多地记录团队提供的服务；在识别了不同安全服务塔内所有桶中的所有服务之后，信息安全服务目录便开始成形。\n\
    \n下一步是创建工作分解结构（WBS），将网络安全团队执行的庞大工作领域分解为可管理的小部分。一个标准的编号系统足以将较小的服务与安全服务塔中较大的服务桶分组。例如：\n\
    \n- 1.0 **GRC 服务**\n  - 1.1 安全意识\n    - 1.1.1 角色化培训\n    - 1.1.2 年度安全合规培训\n  \
    \  - 1.1.3 安全意识文章\n    - 1.1.4 内部钓鱼演练\n    - 1.1.5 指标与报告\n  - 1.2 策略管理\n    -\
    \ 1.2.1 策略制定\n    - 1.2.2 策略审批\n    - 1.2.3 例外流程\n    - 1.2.4 年度策略审查\n  - 1.3\
    \ 合规性\n    - 1.3.1 PCI 合规\n      - 1.3.1.1 证据收集\n      - 1.3.1.2 评估协调\n      -\
    \ 1.3.1.3 交付与报告\n    - 1.3.2 萨班斯-奥克斯利合规\n      - 1.3.2.1 证据收集\n      - 1.3.2.2\
    \ 与第三方审计师协调\n      - 1.3.2.3 报告\n  - 1.4 风险管理\n    - 1.4.1 第三方风险评估\n    - 1.4.2\
    \ 企业风险管理支持\n    - 1.4.3 风险登记册维护\n\n基础工作就绪后，就可以通过为每个离散服务创建服务描述来构建服务目录。虽然可能因需求而异，但服务描述的潜在要素可能包括以下内容。\n\
    \n### 服务名称\n\n顾名思义，这是服务的名称。由于服务目录面向非安全人员，应避免使用行业术语或高度技术性的术语。例如，服务名称不应是“静态应用安全测试”。相反，使用诸如“软件安全测试”这样简单的描述可能更容易让读者理解。在服务描述中，可以解释具体类型的软件测试之间的区别。\n\
    \n### 简短描述\n\n这是供用户快速参考以理解服务摘要的部分。简短描述包含几句话，提供所记录服务的高层概述。\n\n### 详细描述\n\n在简短描述的基础上扩展，本节突出与服务相关的更多细节、包含的内容，以及提供服务所涉及步骤的简要说明。继续以安全意识为例——\n\
    \n"
