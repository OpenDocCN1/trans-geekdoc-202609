    ## Chapter II


    ### A vision for cyber security board governance


    An argument can be made about the need for increased board-level cyber security
    involvement by merely arguing the benefits to the business. Implementing preventative
    controls, continuous monitoring, and the ability to respond to cyber events in
    a timely manner, all contribute to the effectiveness of a company’s ability to
    manufacture products, ship them, deliver services, and transact with their customers.


    Good cyber security makes good business sense.


    Many corporations understand this and have implemented impressive cyber security
    programs without any direct regulations. Some have even created dedicated cyber
    security committees as part of their board structure. They have woven security
    into the rhythm of the business and look to cyber as an enabler of the business
    rather than a hindrance to it, or a necessary compliance requirement.


    A portion of these companies have built these impressive security functions on
    their own accord. They see the cyber security program in a visionary way, understanding
    the value in creating a robust capability for their business. Other companies
    may have built a cyber security program in which few others can compare, investing
    millions in the security budget, but have done so only after a major breach –
    when the realization of not having such a program becomes relevant for them. For
    some other companies, imposed regulations to increase cyber capabilities serve
    as the only driver for improvement.


    At the time of this writing, there are final rules by the U.S. Securities and
    Exchange Commission (U.S. SEC)¹ being implemented that seek to enhance and standardize
    disclosures regarding cyber security risk management, strategy, governance, and
    incident reporting by public companies. I believe there is an important distinction
    between the value of enhancing cyber security oversight by a company on its own
    accord and the value of implementing enhancements after being mandated to disclose
    its cyber security oversight. As mentioned, an effective cyber security program
    is good business and can be an enabler to it. I began writing this book a year
    prior to the SEC initially proposing the draft rules with the notion that cyber
    security oversight needed to be enhanced. Today, not only does effective cyber
    security oversight make good business sense, the disclosure of certain elements
    of a company’s cyber program now requires it.


    The rules require, among other things, current reporting about material cyber
    security incidents and periodic reporting to provide updates about previously
    reported cyber security incidents. The rules also require periodic reporting about
    a registrant’s processes to identify and manage cyber security risks; the registrant’s
    board of directors’ oversight of cyber security risk; and management’s role and
    expertise in assessing and managing cyber security risk.


    One of the rules that did not make the final requirements was the proposed rule
    for “annual reporting or certain proxy disclosures about the board of directors’
    cyber security expertise, if any.”²


    The final rules require more disclosure around various aspects of a public company’s
    cyber security program than ever previously required. Implicit then would be the
    notion that a company’s leadership, including its board of directors, understands
    these various aspects of their cyber program enough to have the ability to disclose
    them. Rather than repeat each of the SEC rules in this book, perhaps our time
    would best be served by examining the potential impacts, as well as some commentary
    from my perspective that may provide value for you in your oversight duties?


    As with any rule or regulation, time is needed to understand how they will affect
    real-world scenarios. Some may find initial ambiguity in terms such as “substantial
    likelihood” or “reasonable shareholder”, to name just two, but perhaps with time
    and application of the rules to real events, more clarity of the definitions will
    emerge. While there are foundations in place to determine the materiality of corporate
    issues, I believe materiality too may require more discussion across boards and
    management teams as it relates to cyber incidents. The intent of the rules, however,
    is very clear: to enhance elements of cyber security reporting for a publicly
    traded company to better inform investors.


    ### BOARD OVERSIGHT


    In many companies, cyber security updates are already integrated into full board
    and/or committee meetings. For those organizations where they are not fully integrated,
    the final rules will require disclosure of the board’s oversight of material risks
    from cyber security threats, and, if applicable, identify any board committee
    or subcommittee responsible for such oversight.


    Even within those companies where a regular cadence of cyber security conversations
