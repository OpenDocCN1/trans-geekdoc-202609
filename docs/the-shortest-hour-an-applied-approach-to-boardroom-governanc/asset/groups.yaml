    |  | 评估流程 | 第三方风险评估流程是否已自动化，还是依赖供应商与贵公司之间通过电子邮件来回发送问卷？<br><br>问卷是否针对不同类型的合作关系设计：可直连公司网络、可少量访问敏感数据/网络、不可访问敏感数据/网络？<br><br>是否定期审查供应商关系，以确保其服务范围与初始评估相比未发生变化？
    |


