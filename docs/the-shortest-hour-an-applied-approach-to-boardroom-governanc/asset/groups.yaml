    that they complement one another, and avoiding negative interoperability issues.
    But by consolidating security technologies to one vendor, it may raise the risk
    of “having all your eggs in one basket” which could cause disruption if a significant
    flaw or vulnerability is discovered in that vendor’s platform.


    Increasingly present are vendor models that bundle general IT office technologies
    along with technologies in other industry verticals such as collaboration tools,
    cyber security, audio/video capabilities, and many more. The consumer pays one
    price which bundles all these solutions into one enterprise license. The dialogue
    between the vendor and the CIO then transitions to “why would you pay for all
    these separate security vendors when you get it for free with the license cost
    you are already paying with our product”? It is a compelling question and one
    that the CIO immediately asks of the CISO. While many companies successfully leverage
    vendors with this model and the interoperability enjoyed by having varying capabilities
    in one solution, there are three potential concerns; let’s outline those concerns
    next.


    As just mentioned, having all cyber security technologies with one provider could
    surface issues if there is an outage or vulnerability with the vendor. Next, not
    all technologies are “free” with the license cost. Advanced capabilities within
    a technology may come at an additional cost, which dilutes the value by increasingly
    higher add-on costs. Lastly, as threats evolve, it is increasingly difficult for
    vendors to be experts across all technology domains.


    For sports fans, you may have noticed the infrequent trend of an exceptional talent
    in one professional sport attempting to break into another. Perhaps a professional
    basketball player attempting a career in baseball, or maybe an all-star football
    player trying the same transition to multiple, other sports. Rarely do we see
    examples where that athlete has achieved mastery in all fields, and on all fields.


    As another example, many diners enjoy an evening meal at a restaurant that specializes
    in a specific type of food, perhaps Cajun cuisine, or maybe Italian fare. The
    food, for the most part, is focused on one style and they build their establishment
    around it, with diners enjoying the unique style, flavors, and ambiance it has
    to offer. Rarely have I gone into a restaurant and found exceptional meals by
    an establishment that serves up a multitude of various options including jambalaya,
    pasta primavera, Asian fried rice, pizza, barbeque, enchiladas, sushi, hamburgers,
    and Thai options, all on one menu. Trying to master everything (in any field)
    does indeed lead to a larger scope of capabilities but may lead to reduced expertise
    in each of those capabilities.


    The bottom line for a security technology strategy ultimately comes down to a
    simple mantra. *The CISO should allow the strategy to drive technology choices
    and not allow technology to drive the strategy.* I have never sat in'
  - '[PAGE 71]


    a vendor briefing of their technology and thought to myself, “wow, I didn’t know
    that was a risk I should have been thinking about”.


    Once the roster of security technologies has been identified, the strategic plan
    should include language on how the technologies will be implemented, and on what
    timeline based on prioritization. As a director, you need not be involved in managing
    the details of the implementation strategy; however, it is important for you to
    understand the broad themes of implementation to ensure it is included in the
    CISO thought process in building the technology portfolio. As more and more technologies
    are approved for purchase, the more difficult the implementation cycle, especially
    if there are limited security resources for the company.


    It would seem logical to include professional services in the purchase to help
    quick start implementation, but there are some areas to watch out for when leveraging
    these services. The vendor wants the implementation to go well so that the value
    of the product is fully realized. CISOs need a successful implementation as well
    to ensure optimal value of the purchase. The *manner* in which the execution of
    the services is achieved requires forethought.


    Like all other service providers, vendors have a team of implementation specialists
    that have competing engagements so it may not be realistic to plan for an immediate
    professional services engagement by the vendor. There may be a backlog of implementations
    that push your professional services out for several weeks, and this delay needs
    to be considered, especially when implementing more than one product or service
    from multiple vendors. Appropriate scheduling with the various vendors ensures
    that those with shorter backlogs may perform professional services first, and
    other partners with longer backlogs can assist later in the strategy.


    Next, solid preparation prior to the vendor’s implementation team arriving includes
    ensuring the CISO’s team, and other departmental resources are ready for the engagement.
    Having the appropriate resources ready to go when the vendor arrives helps to
    reduce the risk of the vendor’s professional services team sitting around waiting
    (at a cost to your company) while internal resources are preparing.


    Lastly, the professional services should be a partnership during the implementation.
    The service should be to assist the internal team with standing up a product and
    not solely doing all of it on behalf of your company. It becomes problematic to
    have professional services implement a product on their own and when they leave,
    the internal team knows very little about the implementation, its configuration,
    and ongoing operation. When future new configuration needs arise, the customer
    will require further support by the vendor, and it may be the case that the vendor
    will charge for those new services. By having the internal team learn and become
    familiar with the technology deployment during the professional services engagement,
    this costly risk can be avoided.'
