  - '[PAGE 65]


    the Information Security Committee can be used to seed the topics for the upcoming
    board of directors information security update.


    When developing the agenda, it is wise for the CISO to obtain feedback from the
    committee members on what topics may be of interest to them. Supplemented with
    CISO-driven topics, the agenda will serve the departmental concerns of each participant.
    Once developed, the agenda is posted with each topical area outlined, who leads
    the discussion, links to any pre-readings, and an icon that highlights if the
    agenda item is informational only, an open discussion, or if a decision is needed.
    By highlighting the expectations for each agenda topic up front, each committee
    person understands desired outcomes and can better prepare for the meeting.


    Pre-reading materials are crucial to an effective committee flow. I’ve never met
    an executive who doesn’t like to see materials prior to a discussion, and when
    it comes to the Information Security Committee, it is essential. Such material
    highlights any concerns, associated metrics or reports that detail the issue,
    options for remediation, and recommendations by the CISO on a proposed path forward.
    For example, if an agenda item relies on an informative discussion (or decision)
    involving multiple references to a particular framework, perhaps NIST, it may
    be valuable to include the NIST framework (or applicable portions of it) in the
    supplemental reading so each committee person can familiarize themselves with
    it.


    All these committee materials are uploaded to the collaboration platform at least
    one to two weeks in advance of the meeting to give each member the opportunity
    to read, research, form questions, as well as opinions on the path forward for
    each agenda item. In doing so, the meeting will be more productive, and you will
    have realized the importance of one of the key tenets in an effective CISO’s competencies:
    communicating in such a way to make the decision-making process easier for the
    audience. Lastly, it may prove beneficial to have a member of the CISO’s team,
    perhaps a high-performing leader, attend the meeting to give them exposure to
    the executive team and serve as a scribe to take notes and minutes from the meeting.
    Rotating multiple, high-performing employees into this administrative role could
    aid in creating the bench strength previously mentioned in this book.


    # CENTRALIZATION VS. DE-CENTRALIZATION


    It is common in many corporations to have a centralized cyber security function
    with global reach that provides services to all entities within the company. Shared
    service, center of excellence, enterprise security, or whatever the organization
    may be called, this centralized model provides many benefits. In other corporations,
    a de-centralized model is chosen with two or more groups providing cyber security
    services to different portions of the corporation. This model can be effective
    for some organizations, as well. So, which is the right model for your company?
    Because security programs are'
  - '[PAGE 66]


    so unique, the answer lies in how the model aids in the delivery of security services
    for your particular corporation to lower risk, and in the most cost-effective
    way.


    In the mid-2000s, I led the security program for one of the operating sectors
    of an enormous global corporation. My sector alone had a revenue stream of approximately
    $5 billion with 35,000 employees, and the company had nine of these operating
    sectors at the time, each with their own information security executive. They
    sat with the local sector leadership and provided customized support to their
    security needs, while reporting to the corporate vice president and CISO for the
    corporation. Aside from a centralized security operations center that provided
    technical services to the entire company, each sector had their own cyber security
    program with a dedicated local security staff.


    In addition to the internal cyber security teams, there was a separate cyber security
    division that provided security services to external customers. All these separate
    programs converged annually (at a minimum) for a series of offsite meetings to
    share sector security information and best practices. Each entity had their own
    risk profile, unique regulations that it needed to comply with, and varying business
    goals to achieve. This is a good example of a de-centralized security model that
    best fit the needs of the company at that time.


    Two years into my role as a security executive for the sector at this company,
    I was awarded the newly created position of enterprise information security officer.
    My new role was responsible for taking nine disparate security organizations and
    striving for a holistic security program, all while maintaining the de-centralized
    model. This format worked well for the company at the time, providing local support
    while federating similar capabilities to address risk.


    As the CISO for a few other mid- to large-sized companies, there were traces of
    separate information security teams, in addition to the centralized organization
    which served the majority of the company. These disparate teams sprung up usually
    as a result of an acquisition of a company, or perhaps the desire for regional
    or dedicated security support to a particular business segment by that leader.
    In de-centralized cases such as these, the value of separate teams may not be
    as high, simply because there may be no clear business driver for doing so. It
    introduces gaps in security maturity across the teams and lends itself to a hyper
    focus on addressing security initiatives for a particular segment over another.


    When I arrived as the new CISO for a mid-sized corporation, I was speaking with
    one of the security managers who reported to me on the enterprise team; he was
    the product of an acquisition. As a result, his focus was on the security of that
    (now) business unit of the company. I asked him what type of perimeter security
    products we used at the company and when'
  - '[PAGE 67]


    he told me, I commented that the specific product was a very good one. He agreed
    and added, “Now, I don’t know what they use in the other business units, but that
    is what we use here in my business unit”. I had my work cut out for me.


    Disparate security focus within a corporation could potentially introduce significant
    risk, and disproportionate levels of security expertise among the different teams
    could cause unnecessary maturity variances in the security posture of the company.
    In the deteriorated perimeter environment in which many companies operate, small
    vulnerabilities in one segment could introduce risk for the entire corporation.
    For example, when going on vacation, it is prudent for homeowners to double check
    the locks on their windows and doors prior to leaving for their destination. If
    everything is locked up tight, except for one small window in the rear of the
    house, the solid security of the rest of the home doesn’t matter. A burglar will
    use any opening they can find to gain unlawful entry. Similarly, if there are
    robust controls in place across the corporate network, but just one small, non-critical
    system in another segment (under another security team’s jurisdiction) has significant
    vulnerabilities, an intruder will target that system to gain entry and attempt
    lateral movement to other, more critical systems. Additionally, de-centralized
    security functions could potentially lead to confusion in roles, responsibilities,
    and disproportionate security controls in corporate networks.


    It could be argued that certain networks in a de-centralized security service
    model could be segmented from the other areas of the technology landscape. While
    segmentation is a very good practice in general, without clear business requirements
    to justify the segmentation of security programs, as well as the overhead operating
    costs of creating and maintaining such a model across multiple security teams,
    may prove too costly. De-centralization introduces another finance-related complexity,
    as well. It will become increasingly difficult for a CISO to answer a basic question
    from the CFO or CEO: “How much do we spend on cyber security at our corporation
    each year?”


    Centralization of the security program on the other hand can be a cost-effective,
    value-added structure for most companies. It organizes security in a central center
    of excellence that provides security services to the entire corporation. In doing
    so, a company only needs to build the capabilities within one organization to
    avoid duplicative technology spend (and opens up enterprise discounts from vendors
    for larger purchases instead of several smaller ones); it centralizes security
    processes and maintains one team of experts following the same security vision
    for the company (see Figure 6.2).


    Pursuing a centralized security program is maximally efficient when an Information
