  - '[PAGE 111]


    of specialized training and practice focused almost exclusively on the human heart,
    a devoted skill that I would find more valuable in performing my surgery. Moreover,
    such an experienced cardiologist may have contributed publications to scholarly
    medical journals and provided keynote speeches at medical conferences – all focused
    on the *specific* domain of heart health to help advance the industry.


    There could be varying conclusions as to what constitutes the specific merits
    of expertise; we’ve just examined two of these conclusions. One conclusion was
    from survey respondents who believe that one or more of their board members have
    cyber security expertise, and the other was my opinion that the expertise stated
    by the respondents may not meet the same type of rigorous requirements for expertise
    that I defined previously. So, who is correct? Actually, there is no correct view
    between the respondents and myself. Expertise is a personal view by the individual
    who makes a decision or perhaps is most affected by the expertise. What another
    person considers to be an expert is irrelevant to me when I decide who will perform
    my heart surgery – it is my choice on what I consider to be an expert.


    Consider another example: During a legal trial, prosecutors and defense lawyers
    may call board-certified experts in a specific field; often each side will have
    their own expert to give testimony on the exact same piece of evidence. Even though
    the lawyers (and the experts themselves) provide substantial credentials to establish
    their expertise, ultimately the decision on which expert is considered more knowledgeable
    and believable falls on the judge or jury of that specific trial. In the case
    of cyber security expertise on a board, it doesn’t matter who labels a board member
    as a cyber expert, the ultimate judgement of that expertise falls on one person:
    the investor.


    This is precisely why our industry needs disclosure regulations for identifying
    the level of cyber security expertise across different corporate boards; it will
    provide the investor with the knowledge to make their own informed investing decisions.
    As future regulations emerge, and potential disclosures into what each company
    constitutes as cyber security board expertise surface for the investors and the
    public to critically evaluate, I anticipate similar studies in the future will
    show (overall) fewer affirmative responses of self-proclaimed cyber expertise
    in the boardroom – until such focused expertise that can be appraised is indeed
    added and can be justified.


    Adding a cyber security expert to your board doesn’t forfeit a seat away from
    a director who can contribute to other important business governance matters outside
    of cyber. A well-qualified board candidate to serve as a cyber security expert
    should have both cyber expertise and exceptional business qualifications. The
    two attributes are not mutually exclusive, difficult to find, yes, but not separate
    from one another. Remember our example of the cardiologist who has deep expertise
    in the human heart? That doesn’t presuppose that the cardiologist can only contribute
    to the medical community on matters of heart health. They possess a holistic medical
