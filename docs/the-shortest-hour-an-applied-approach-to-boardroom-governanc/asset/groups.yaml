    ## Chapter 17


    ## The path ahead


    Thank you for your time in reading this book to explore cyber security and how
    it can be beneficial for board members to dive more deeply into the underpinnings
    of their company’s cyber program. Your commitment demonstrates a spark in the
    evolution of cyber security governance at the boardroom level that is needed and,
    with a bit of work, can be realized. Board by board, director by director, increased
    dialogue on information security in the boardroom will intensify the top-down
    support for this critical business issue.


    Setting aside any regulatory mandates, exploring cyber security and how your company
    can enhance the security program makes very good business sense. Notwithstanding
    the risk mitigating benefits of a good cyber security program, it can enhance
    the *quality* of your business processes as well. Yes, outdated systems can introduce
    security vulnerabilities, but by refreshing those systems to current versions,
    it could mean less downtime and enhanced performance of the machines that are
    driving your core business.


    Employees who have administrative rights on their computers and are able to download
    and execute files from the Internet do indeed introduce security risks to your
    company. But consider the time and labor cost involved in re-configuring computers
    and correcting configuration errors made by non-IT employees by having those administrative
    rights. Realizing this means that in addition to the benefits of enhanced security,
    there may also be excessive labor cost savings.


    Developing approved standards for the types of technology your company uses each
    day helps to reduce complexity, ensure that the technology footprint is controlled,
    and each standard is critically reviewed by the security team. But it also helps
    to limit the number of costly disparate technology implementations from various
    business units and geographic regions, which equates to cost savings. For example,
    if your approved corporate standard for a collaboration platform is clearly communicated,
    why incur the costs of adding multiple investments in other, non-standard collaboration
    tools expertise to meet the demand, and ambiguity into the role of the CISO as
    a business executive.


    More than ever, cyber security needs more corporate attention to transition it
    from “the shortest hour” of the year to something that is dynamic and frequently
    discussed. You’ve taken an important initial step by reading this book. I look
    forward to what you will achieve in helping to transform the way that cyber security
    is addressed at the board level.


