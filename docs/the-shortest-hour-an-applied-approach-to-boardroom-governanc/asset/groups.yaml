    credentials, providing the adversary with valid login credentials. Variants of
    these types of attacks can extend to text messaging, impersonating an employee
    in a call to the help desk, and other technological avenues, making them a dangerous
    part of a user’s workday. These attacks are popular because they work. Each day,
    users fall victim to social engineering attacks and one of the best ways to reduce
    the likelihood of a successful one lies in the discipline of security awareness.


    Historically, security awareness was made up of compliance-type training modules,
    most frequently a ten-to-fifteen-minute computer-based training module, (CBT)
    that was required for every employee. Usually done at the end of the year and
    bundled with several other compliance training modules from other departments
    and disciplines, this type of awareness (only) did not provide optimal retention
    of the content. How can we expect that our employees will retain one fifteen-minute
    CBT module throughout the year?


    Like with many things in cyber security, our industry evolved and began providing
    other types of awareness activities to enhance the ways our employees consume
    content. Though not an exhaustive list, what follow are some general areas in
    which security awareness has been enhanced.


    # AWARENESS ARTICLES


    Throughout the year, timely articles on a variety of security topics can help
    to enhance cyber fluency across the workforce. Additionally, these regular updates
    can also be used to help our employees in their personal lives, away from work,
    by offering solid tips on how to protect themselves (and their families) online.
    The articles can be delivered through the corporate email system, or perhaps on
    the company’s Intranet homepage, for employees to read when they have an opportunity.


    Topics could include the dangers of phishing, risks associated with using unfamiliar
    USB thumb drives, or protecting themselves from online theft when shopping on
    their favorite website. It is important for the CISO and their team to develop
    a calendar of cyber security awareness articles that highlights when the article
    will be published during the year, the content/topic, and other details. In doing
    so, it is easier to build an awareness article program in which the topics build
    off one another. Additionally, the timing of the articles can be pre-determined
    so that messages are delivered at the optimal time. For example, a security awareness
    article highlighting how the employee can protect themselves while shopping online
    may be best delivered in the month of November, as the holiday shopping season
    begins to kick off in full swing. Doing the same article in the early part of
    the new year may not have the same impact when it is needed most.


    It is critical that the information security team works closely with the corporate
    communications department to ensure the articles are arranged'
