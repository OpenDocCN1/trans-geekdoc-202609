    who sabotages systems or steals corporate data to share or sell to competitors.
    Some employees may download large amounts of corporate data when leaving the company
    without the intent to sell to competitors, but the action still equates to an
    intentional and unauthorized act. Lastly, employees may cause disruption or data
    leakage without intent to cause harm or perform an unauthorized behavior. Instead,
    accidental actions by the employee, perhaps clicking on a link in a phishing email
    for example, can lead to grave damage to the company.


    To the degree that corporations dedicate time to their business model, our adversaries
    are doing the same, leveraging a huge unsavory market opportunity to conduct business.
    Important for the director to understand is that many of the threat actor groups
    are not loosely based; they have strong business models with revenue-sharing opportunities
    related to providing unauthorized access via an access broker.


    Companies are conducting business in new ways to increase top line revenue growth
    and improve bottom line efficiencies. The antiquated perimeter model of security
    is eroding to allow for more integrated partnerships. At the same time, our adversaries
    are growing their capabilities and tactics to launch attacks on any vulnerable
    corporation. Cyber insurance rates are climbing to historic levels and have become
    increasingly difficult to obtain. All of this makes for a perfect blend to raise
    cyber security to the top of any corporate executive’s attention. Not surprisingly,
    cyber security is often included as one of the top threats for a corporation in
    their enterprise risk management program.


    This section has painted a dismal view for corporations and my intent is to not
    fill the reader with fear, uncertainty, and doubt. Instead, it is to provide a
    realistic view into the threat landscape, while the rest of the book dives into
    areas where you can investigate within your corporate information security programs
    to reduce online risk.


    # Notes


    +   1. Dark Web – the deep part of the Internet and chat rooms where criminals
    conduct commerce and exchange malicious content.

    +   2. Denial of service is an attack whereby the adversary floods the targeted
    system/network with system traffic until the targeted system/network cannot respond
    to each request and then crashes, making the system unavailable for legitimate
    users.'
