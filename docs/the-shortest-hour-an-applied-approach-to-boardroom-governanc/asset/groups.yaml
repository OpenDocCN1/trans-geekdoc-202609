    Searching for vulnerable systems and providing needed updates/fixes to them may
    not appear to be a cutting-edge security control, but this foundational process
    is critical to the hygiene (and security) of a corporate infrastructure. These
    vulnerabilities are what the adversary looks for in a corporate network. To accomplish
    a successful preventative program requires a strong partnership between the information
    security and IT teams within your corporation. In working together successfully,
    this multi-departmental program will be enhanced.


    # APPLICATION SECURITY


    Whether a company develops its own code from a blend of frameworks, purchases
    commercial off the shelf (COTS) software, or customizes COTS software, ensuring
    that the code is secure as possible is critically important. If not addressed
    (preferably during the build and customization phases of development), software
    and coding vulnerabilities could lead to major problems for a corporation. The
    primary method for securing software lies in the software development lifecycle
    (SDLC) which aims to develop a structured process, through phases, to produce
    secure software for use in production. Security is very much a part of this important
    SDLC process to protect against insecure design and coding mistakes.


    Providing security training to software developers serves as a great incubator
    for a successful development program. Discussing the many different coding mistakes
    that may lead to software vulnerabilities helps to demonstrate for the developer
    their role in secure software coding practices. It may prove effective to “gamify”
    the training to make it exciting for the participant developers and introduce
    competition in completing the training, so each developer strives to win over
    their peers.


    You may hear your CISO mention something called a bug bounty program. Simply put,
    these are programs in which a company (usually those developing software) provides
    incentives for reporting software bugs (vulnerabilities) to the company. These
    incentives can be some form of recognition or even compensation of varying amounts.


    Testing the software code can help identify issues and there are many security
    vendors that provide products and services to conduct this type of testing. Two
    common tests are static testing and dynamic testing. A static code review is done
    before and during the development of the software, evaluating the code and issuing
    a report. You may want to inquire about the impact for speed to market the software
    developed (or customized) by the team because of security testing. It may be the
    case that the overall static testing program takes quite a bit of time to perform
    and when reports are generated, several false positives may be presented. After
    researching the false positives and correcting the true vulnerabilities, typically
    another scan is done to verify coding fixes. All of this takes time and could
    impact'
  - '[PAGE 126]


    how quickly the company can introduce new capabilities. Exploring how the application
    security program addresses these potential delays while maintaining the effective
    security of the software provides informative discussion topics for you and the
    CISO.


    Dynamic testing involves testing when the code is executed and checks for the
    functionality, security, and performance of the software. This testing is done
    after the development phase and as a result, any fixes will most likely be more
    expensive to correct than fixes done during development.


    All these components work together to provide a more secure application development
    program that aims to identify vulnerabilities early in the development stage.
    Through wrapping security into the overall SDLC process, enhancing developer training,
    and providing efficient testing for vulnerabilities, the application security
    program can be a beneficial addition to the cyber security program.


    # ARTIFICIAL INTELLIGENCE (AI) SECURITY


    One of the most difficult days for an information security professional is the
    day after a technology company delivers a major product launch amid huge fanfare
    to the public. Inevitably it leads to employees asking their security teams if
    they can plug in their new, ultra-awesome consumer product into the corporate
    network. Usually these consumer devices are not designed for corporate use, and
    may not be safe for use in a business environment. Similarly, every once in a
    while, a new technical advancement emerges that sparks huge industry interest.
    The marketing firms get ahold of it, massive demand ensues, and soon security
    teams across the planet are being asked to secure a new technology in a very short
    timeframe.


    If I wrote this book twenty years ago, I would be discussing the emergence of
    consumer mobile phones being used for business purposes. Had I written it seventeen
    or eighteen years ago, it would have been securing wireless networking technology.
    These emerging innovations have stabilized over time as more resources are invested
    to explore any risks and then develop subsequent security strategies to address
    them. But at first introduction, security teams scramble to understand how to
    best minimize risks associated with them, while the business is scrambling to
    exploit the benefits of the technology. I am including a section on AI here, as
    that is what is dominating the headlines at the time of this writing. Employees,
    industry peers, senior executives, and even board members are asking about AI;
    employees want to use it, and senior leaders want to know how we can leverage
    it in a secure way to reduce overhead costs to maximize profits.


    It is still relatively early in the mainstream lifecycle of AI-related technologies,
    specifically generative AI, so information security teams require time to evaluate
    and search for associated risks and potential countermeasures'
  - '[PAGE 127]


    to reduce those risks. To be sure, many organizations, including the U.S. Government,
    are also exploring how generative and other forms of AI will impact industry.
    For example, the U.S. President recently issued a Presidential directive that
    seeks to develop an AI strategy to guard against misinformation and other potential
    downsides of the technology.


    Even with the need for more analysis, there are some things you can inquire about
    with your CISO regarding AI-related and AI-generative technologies while our collective
    security teams are performing their analysis. Ensuring that the security program
    keeps sight of the basics without a sole hyper focus on the technology is a good
    first start. In security, often what we should do is focus on the behaviors and
    not the technology. For example, a company may have historically had a policy
    that said no cameras are permitted in their data center. Over time, video camcorders
    became smaller and those were added to that policy to keep them out of the datacenters,
    as well. Then the emergence of mobile phones began, and more phone models included
    cameras. The policy would be expanded to include no cameras, no camcorders, and
    no mobile phones with cameras are permitted in the datacenter. In this particular
    example, the technology was the focus, losing sight of the behavior the company
    was trying to address: *no photographs are permitted inside the datacenter*. Our
    programs should put the attention on the behaviors we are trying to enforce (or
    disallow) and not solely focus on technologies that serve as a tool to these behaviors.


    Additionally, focusing on the behaviors will drive more directed outcomes related
    to what we call the CIA triad (confidentiality, integrity, and availability).
    Companies could strive to ensure that confidential information is not put into
    public-type AI-generative technologies. Moreover, addressing the integrity of
    the data outputs from AI solutions, ensuring that the information is internally
    and externally consistent, should be top of mind. Leaders depend on data to make
    business decisions and making sure the integrity of the AI-generated data being
    used to consider those decisions is crucial. These safeguards are not unique to
    AI technologies and are no different from the managing the CIA within messaging
    applications, email, or other technologies in use by corporations. Stick to the
    basics and address the key concerns.


    To convey expectations, it is wise for corporate security teams, in partnership
    with legal and privacy, to draft a policy directed toward generative AI usage
    to explain to employees what is allowed, and which actions are not permitted –
    as determined by the company.


    Many technology providers are exploring new ways to integrate AI-related technologies
    into their suite of products. Office productivity solutions and many other applications/services
    in use today are expanding their offerings (or rapidly developing them) to include
    AI or generative AI type of technologies. Chasing each one of these technology
    deployments separately may seem futile. Perhaps the best path is to conduct security
    reviews of a few solutions'
