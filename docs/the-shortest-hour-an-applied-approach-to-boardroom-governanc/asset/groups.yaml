    not without risk. Several industry publications have explained that adversaries
    can potentially circumvent the MFA text process; if interested, your CISO is a
    good source to explain the findings of these reports.


    Additionally, there are authentication applications that provide MFA by generating
    a random code. The user enters their username/password, and then the system requests
    the random MFA code. The user opens the authenticator app to obtain the code,
    then enters it into the desired system/application. Another option with authenticator
    apps is a quick option to confirm an access request. When the user enters their
    username and password into the system in which they desire access, the authenticator
    app presents an option to authenticate with a YES or a NO button. The user presses
    YES and the authentication is completed. While this MFA option is easy on the
    user, it comes with potential issues – one example is an MFA fatigue attack. Should
    an adversary obtain the stolen username and password of a person, they can attempt
    access to a system multiple times, generating several MFA authenticator app requests
    to the user. In some cases, a user may press YES due to the nuisance, or uncertainty,
    of the repeated requests.


    Even with some of the risks outlined previously, MFA remains a strong preventative
    addition over just username/password authentication; your CISO can provide guidance
    on the best MFA type for your organization. The CISO will also keep you updated
    on the status of multi-factor deployments across your organization. I have been
    asked multiple times by senior leaders and board members, “Why can’t we just turn
    on MFA for everything, right now, all at once, so we can reduce our authentication
    risk in the short term?” It seems a logical request but in doing so, it may introduce
    other types of issues such as operational risk.


    Without testing and due diligence, one cannot anticipate all of the potential
    impacts to production that would be felt by implementing another step in the authentication
    process – particularly for system-based access. Additionally, does everyone in
    your organization possess a mobile device, or is willing to put a corporate application
    on their personal device? Moreover, are there potentially call center or manufacturing
    groups that require hard token MFA devices? Like with most things in cyber security,
    implementation requires a methodical process for testing prior to just flipping
    the switch.


    In today’s perimeter-less computing world, the importance of IAM takes on an important
    role. Previously, we operated with a model where the bad guys were thought to
    be on the outside and trusted employees were on the inside. Today, we must leverage
    a model where we should assume the bad guys are already on the inside and protect
    our systems accordingly with a zero-trust model. A robust IAM program is, in part,
    how we can achieve this.


    The discipline of security operations extends to many other areas as well, but
    for the purposes of this book, what are stated above are adequate to understand
    the foundational operational controls for your company. Prior'
