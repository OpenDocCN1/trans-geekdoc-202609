  mdcn: "\n\n![](img/1f2064bafeb84712e9a55bdb844d2074_12_0.png)\n\n## 前言\n\n我相信，我们是所有先于我们的人和经历的总和，每一个都为我们的生活提供输入，共同构成了我们是谁，再加上一点点我们自己的个性。一本书也与此非常相似，我认为。我只是一个讲述者，讲述那些影响了我生活并促成本书内容的种种输入。无论是与大型企业中出色的队友们长达二十年的合作，与最高层公司治理机构的合作，还是在机场与一位有趣的陌生人进行的一场影响深远的两分钟对话，每一次互动都帮助塑造了我对众多不同主题的思考。就我们此处而言，我的思考聚焦于企业网络安全项目的管理与监督。\n\
    \n本书不是一本技术指南；这是本书的一个重要主题：网络安全不是技术问题。它是一个商业问题，值得企业高管给予极大的关注。当然，技术在网络安全中扮演着至关重要的角色，但仅仅作为一种工具，一种通往更大目标的部分手段。这非常像一个对手，使用恶意软件（malware）作为机制来实现比技术更深刻的东西，一个处于问题核心的东西：他们的恶意意图与犯罪行为相结合。正如你将在后续章节中读到的，我认为网络安全在董事会上应该如何演进应当有一个转变。我希望这本书能激发变革，并为信息安全监督可能的发展方向描绘一个愿景。\n\
    \n**李·帕里什**  \n*2023年12月*\n\n有关本书的反馈与咨询及/或演讲邀请请求，请访问以下网站联系作者：www.novelsecurity.com\n\
    \n## 引言\n\n商业是一门动态的学科，不断演变，要求公司董事就各种旨在积极影响顶层收入增长和提高底层效率的主题提供建议，同时也要关注公司的监管和法律事务。每位董事都深度参与多项举措，从短期行动延伸到长期增长。每年都会引入新的学科和监管要求，这些都需要关注，而不会从董事的职责范围中移除传统类别。\n\
    \n当特殊事件发生时，例如破产、合并、收购和剥离，董事的注意力转向这些事件是现实的，但也不能忽视其他基线性职责。所有这些都是在作为股东价值守护者的角色下完成的。这不是一个被动的角色，需要对多个领域进行大量的考量。\n\
    \n本书强化了一门需要董事以比以往任何时候都更高的关注度来对待的学科：*网络安全*。我写这本书的目标不是让读者成为网络安全的专家。相反，它是提供有价值的提示和信息，以便董事能够向其企业领导团队提出恰当的问题*并*理解提供给他们的答案，以确保其网络安全项目处于最佳状态并准备好应对业务中断。本书适合你，无论是新任命的董事，还是正在接触董事会新兴议题——网络安全的资深董事会成员。\n\
    \n本书也可以成为希望以易于理解的格式了解网络安全的C级高管的有价值资源。随着董事们对网络安全这一学科的了解更加深入，你将需要运用自己的网络知识来回答他们的问题并做出明智的决策。你的首席信息安全官（CISO）可以帮助你填补从这些页面中学到的细节，然后帮助你将其应用于你的组织。\n\
    \n最后，我网络安全行业的同行可能会出于各种原因利用本书。也许对于那些想担任CISO角色的人，我希望我从二十多年与董事会合作中获得的见解能让你了解该职位需要面对什么。对于我的资深同行，你们无疑熟悉即将读到的概念，但希望会有一些新的技巧可以添加到你们的安全项目中。\n\
    \n当我们共同探索在企业管理结构中增强网络安全的新方法时，一些行业出版物、书籍和社交媒体帖子已经涌现，它们为这个话题提供了很好的讨论点。许多内容有效地强调了在董事会层面更频繁地讨论网络安全的必要性，提高董事会成员的网络素养，以及改善（或不改善）董事会内对话的影响。此外，我还看到已发布的指南中列出了一系列董事可以就其公司网络安全向CISO提出的问题。我所想要的，可能也是你阅读这些页面原因，是一个信息来源，它不仅提供解决网络安全常见关切的问题，还提供对这些主题的非常基本的理解，以便你能够理解提供给你的答案，从而提供明智的业务指导。\n\
    \n在某些方面，可能会觉得我涉及的内容有点深入，但广泛的基础是重要的，以便你能够理解你的问题的答案。我对你的承诺是，我只详细讲解足以让你掌握概念的内容，不会更多。如果你愿意，你的CISO可以更深入地探讨这个主题。如果读者之前没有听说过，重要的是在此指出，当涉及网络入侵时，问题不是“是否会发生”，而是“何时会发生”。网络安全背景、理解一个主题及其对公司的影响的重要性，从未如此关键。\n\
    \n正如你们中那些在多个董事会任职的人可以证明的那样，并非所有信息安全项目都是相同的。基于公司面临的独特风险、其企业战略、运营模式、财务状况以及一系列其他特征，每家公司拥有一个定制的安全项目是自然的（也是必要的），该项目对其有效，但可能对其他公司无效。尽管一些咨询公司可能吹嘘，没有单一的策略，也没有一种放之四海而皆准的安全模型可以应用于多家公司。每个安全策略都如同指纹般独特，但策略的基础和根基却如同手指一般普遍。在解决网络安全问题上，并没有太多情况存在绝对正确或绝对错误的方式。通常情况下，有许多细微的考量需要对问题进行更深入的分析。我的目标是帮助读者识别核心基础，同时就每种独特策略中应关注的内容提供想法。\n\
    \n在我二十三年的信息安全高管职业生涯中，我有幸与多个行业的多位多元且优秀的董事会合作：航空航天/国防、金融服务、技术、制造、零售、消费品、工程和数据营销。除一个外，我所合作的董事会都在数百个国家负有国际责任；其中一个董事会尤其采用了非美国本土的治理结构。每个董事会，就像每家公司一样，都有其个性：一种独特的决策者与挑战的组合，使其与众不同。\n\
    \n我很幸运，因为与每个董事会互动的层次极为多样。当然，有传统的CISO与委员会（通常是审计委员会，稍后详述）的接触，大多数CISO在其中互动。此外，我经常就战略安全规划事项或在重大事件响应后向全体董事会进行简报。当新董事入职时，我会针对他们即将加入的公司进行一对一的关于信息安全状况的简报。而且，有时我会与董事或委员会主席会面，代表他们开展特殊项目。所有这些互动使我对他们每个人最关心的问题有了第一手的了解，也让我看到了在网络安全事务上增强企业治理的机会所在。\n\
    \n我所合作的董事会成员同样多元，他们来自不同的背景，为整个团队做出了独特贡献。无论是美国总统候选人、白宫幕僚长、退役的军方高级将领，还是《财富》500强公司的首席执行官，每位董事都为我提供了独特的机会，让我在与董事会合作方面提升能力。如果不是他们每个人以及他们提供给我的机会，这本书就不可能问世。\n\
    \n"
