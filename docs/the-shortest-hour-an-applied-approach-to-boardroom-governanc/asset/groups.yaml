    and his or her direct reports takes place in which I walk through the strategy,
    there are many nodding heads of affirmation by the CEO’s team. They say, “Yes,
    I’ve seen the plan and am good with it”. The outcome is the CEO is in a better
    position to make a decision because the decision-making process was made easy
    for them. Regardless of the process the candidate uses in examples during the
    interview conversations, you should seek out'
