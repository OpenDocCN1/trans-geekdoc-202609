  - '[PAGE 82]


    Computations that seek to understand the impact on brand reputation are foggy
    as well. Few will argue (including me) that brands possess incredible value, some
    going back hundreds of years. There are many different types of valuations that
    help to measure brand value, with arguments on both sides related to the subjectivity
    of the analysis. My concerns for brand value relate to the ability in placing
    a specific dollar figure to the brand impact for a specific company who experiences
    a specific cyber security event.


    Whatever methodology a company may use to determine brand value, pinpointing the
    impact of a breach on that value may be problematic. If brand valuation is dependent
    on the financial performance of the company, revenue generation, and competitive
    advantage to name a few, which of these metrics highlight the influence of a security
    event? Even in the face of the compelling timing associated with a breach, a downturn
    in revenue could also be attributed to many factors outside of a breach, perhaps
    a pricing increase, new offerings by a competitor, or a host of other variables.
    Attributing any financial impact to brand value solely on a cyber event may not
    be an accurate measurement. Simply put, and using the common Latin logical fallacy,
    *post hoc ergo propter hoc* (”after this, therefore because of this”), there could
    be more behind the numbers than just the data breach.


    It is quite easy to conclude that breaches may cause significant financial distress
    for companies; I am a CISO, I would never suggest otherwise. However, there is
    a difference in stating that a breach impacts a company’s brand value, versus
    attributing a specific cost to (or percentage of) the value of the brand, as a
    result of the attack. These are two very different things; one is a logical argument,
    and the other is a proposed measurement that may not be accurate for a particular
    company. It is important to reinforce that I am speaking to brand value in this
    section and not impacts to top-line revenue, market valuation, and bottom-line
    efficiencies – those figures are often quantifiable.


    It may be true that a breach could involve diminishing consumer trust in a brand
    and as a result may have a negative influence on the brand image. With such deterioration
    of these brand attributes, it stands to reason that the value of the brand could
    be adversely affected. However, I suggest that designating a specific dollar amount
    to the brand value as a result of the breach is fundamentally flawed and may present
    a doomsday scenario without accurate (or actionable) data. All breaches are not
    equal, nor is each response to a breach. Each company has different nuances in
    the incident response process, and these can impact customer trust. If a company
    responds quickly, effectively, and are honest in communications around what took
    place, that is viewed much differently than a company that delays the response
    or worse, hides the facts surrounding the breach from its customers. Regulations
    on reporting help to keep all companies transparent to some degree, but I argue
    that how a company responds impacts consumer trust. And companies have varying
    effectiveness levels to responding'
  - '[PAGE 83]


    to an incident. If these thoughts are true, it would suggest that attaching an
    average industry dollar amount around impact to brand value for *all* companies
    in the aggregate after a breach is flawed.


    It is both wise and recommended that the CISO speaks to directors and leaders
    about the negative impacts to brand value that a breach can surface, however attempting
    to attach a dollar figure to that loss from an external, industry value will only
    drive more questions around the accuracy of the figure rather than actionable
    discussions regarding the core issue of protecting the brand.


    My comments in this chapter may lead you to believe that industry reporting on
    security financials and other metrics are not helpful; this is not my intent.
    There is great value in these reports if used for what they are, broad ranges
    of data that provide a general baseline for the industry. Particularly useful
    is when they are used informationally in identifying trends year over year, such
    as general industry increases in the costs associated with recovering from a breach
    for example. Where I believe they are not as effective is when they are used as
    a primary data point that can be applied to each and every company.


    There are other meaningful data that a CISO can present in building budgetary
    plans for funding a security strategy for their company. Data and measurements
    that are unique to the corporation are of the most value and these should be the
    calculations that the CISO leverages. As an analogous example, when reading the
    label on a bottle of medication, all the possible side effects associated with
    that medicine are listed in detail. It is important for all patients (the industry)
    to understand the potential side effects, but they are not an accurate measurement
    of what each patient will actually endure themselves. It may also be an important
    data point to understand what side effects family members (similar company size
    and revenue) had when taking the same medication. But the most valuable information
    is to understand what side effects the patient (the company) actually has when
    taking the medicine.


    An excellent start for CISOs in this process is detailing the critical business
    processes that generate significant value for the company, and then outline the
    systems that support those processes. Armed with this information, several variants
    of measurement can be applied. The specific financial impact to the company by
    hour, day, week, etc., if one of these systems suffer a breach or outage, could
    be one such measurement. The CISO could report on the number of critical vulnerabilities
    within that system and if they are actively being exploited by adversaries in
    real-world situations (the active exploitation portion is a good example of when
    the industry reports mentioned above can provide real value). If the critical
    system provides manufacturing capabilities and suffers a breach, as we have seen
    in a few companies in recent years, an understanding of lost productivity by hourly
    or daily units could also be explored and reported. Inventory levels could'
  - '[PAGE 84]


    be an effective measurement as well. If a company has a surplus of inventory and
    can measure how many days they can replenish customers after a breach, compared
    to a company with low inventory levels due to just in time manufacturing, this
    could provide valuable insight for the board. An example of supply chain impacts
    and subsequent shortages that comes to my mind is during the height of the recent
    pandemic, how many of us entered a grocery store and went straight to the isle
    with toilet tissue and hand sanitizer?


    If a goal for the strategic plan includes increased labor costs specific to monitoring
    the corporate environment for incidents and threats, a combination of external
    and internal data can help justify the need for this enhanced business resiliency.
    Presenting industry findings by organizations who specialize in threat intelligence
    and study the capabilities of formalized adversary groups helps to show data on
    average times associated with adversaries breaking into networks. Using this time-based
    data on adversary capabilities, the CISO then measures their own current detection
    capabilities (how long it takes the team to detect and remediate an incident)
    and then overlays that capability against the industry benchmarks. For example,
    an industry report may highlight that it takes a particular type of adversary
    a certain number of minutes to enter a network and begin lateral movement. The
    CISO then displays the organization’s current capabilities to detect and remediate
    threats. Using these metrics often can help to identify gaps and explain how the
    increased labor requests (or outsourcing) could aid in closing those gaps, enabling
    the security team to help get business processes back up and running in the event
    of a security incident. Of course, other metrics can be used to show the financial
    comparisons to building an internal monitoring capability versus outsourcing to
    a trusted partner.


    Ensuring that all stakeholders are aligned on the financial strategy for security
    prevents future misunderstandings that could delay program progress. Leaders and
    directors should ask detailed questions of their CISO regarding each justification
    data point. In some cases, measurements may be used that seem to highlight good
    business sense, but when diving into the details, the intent of the data may be
    misconstrued – particularly in the area of cost savings. An example of this misconstrued
    intent is when a requestor wishes to buy a technology and mentions one of the
    positive outcomes for the purchase as labor cost savings. They may say that the
    addition of the technology, while an increase to the budget, will provide cost
    savings in labor, the equivalent of two FTEs annually for example, due to the
    automation that the technology provides.


    This justification may make good business sense for the company and leadership
    approves the request, the technology is procured, and installed. Then the business
    leaders return to rightly question: when can we enjoy those cost savings by removing
    the funds for those two FTEs from the security budget, and either (a) recognize
    the savings, or (b) re-allocate the savings to another business initiative? The
    requestor frantically explains that the intent was not'
