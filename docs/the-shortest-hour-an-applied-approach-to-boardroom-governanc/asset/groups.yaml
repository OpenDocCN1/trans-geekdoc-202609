    # THE INCIDENT RESPONSE PLAN


    During the fog of an incident, response steps could be missed or perhaps all the
    needed stakeholders are not included. To prevent situations like these and to
    ensure an effective, repeatable process for responding to breaches, an incident
    response plan is developed, communicated, and practiced. While there are many
    components to an incident response plan, the core elements for your company’s
    plan may include:


    +   - Reporting and compliance requirements

    +   - Roles and responsibilities of the various stakeholders of the incident response
    team

    +   - Communication plan

    +   - Incident handling procedures


    An effective response is a team effort. It is imperative to identify all stakeholders
    who can bring their expertise to the response process so that all facets of the
    response can be professionally addressed. It is natural to include the obvious
    members of the response team such as the CISO, information security team, various
    teams from the IT department, legal, and executives. Equally crucial is the inclusion
    of representatives from public relations, investor relations, finance, communications,
    facilities, human resources, and others. Additionally, there are external members
    of the response team: outside counsel, external PR firms, cyber security partners,
    and others. The goal is to identify all stakeholders and outline the incident
    response roles and responsibilities for each. Beyond this, it is imperative that
    all members of the response team fully understand their roles and the expectations
    of their contributions to the overall response.


    When the team has been identified, establishing the method for communicating effectively
    is an important part of the plan. Who will be responsible for external reporting?
    Who updates the executive team and board directors? Who alerts the insurance company
    in a timely fashion to adhere to the reporting requirements? How often does the
    response team meet to provide updates? All these considerations should be planned
    in advance so that multiple communication workstreams can be successfully accomplished'
  - '[PAGE 138]


    simultaneously. Additionally, there may be situations in which internal communication
    mechanisms (email, etc.) may be potentially compromised or brought down by the
    adversaries, requiring an “out of band” communication platform for responders
    to share information. Planning for this in advance can help to ensure the integrity
    of the communications is sustained.


    The incident handling procedures incorporate many different elements and provides
    the team with a detailed guide on important tasks. While many of the steps are
    intuitive by nature, especially for cyber security professionals, pre-assembling
    the procedures helps to reduce the risk of missing or incomplete steps during
    a high stress response environment. Moreover, the procedures provide a validated
    approach for incident response. They are effective and they work. Commercial airline
    pilots leverage years of experience in aviation to deliver their passengers safely
    to their destinations. Even with all this experience, they still rely on pre-flight
    checklists to ensure all steps have been completed. While the overwhelming majority
    of flights do not result in an incident, following the pre-flight checklist with
    vocal validation of the completion of each step by the cockpit crew is a good
    system to ensure flight safety. Similarly, pre-designed response checklists lend
    themselves to highly effective cyber responses.


    Cyber security professionals are an eccentric bunch. They love nothing more than
    to dive into a complex issue or dissect a technology to see what it can do, versus
    what it was designed to do. These are the folks we want on our side when things
    go sideways during a breach. I recommend a task for your incident response plan
    for when a breach is first discovered that runs counter to this enthusiasm from
    your team – send several of these energetic employees home immediately.


    Once the team begins working on the breach, the energy level is high, but after
    about twelve hours, the team is fatigued and may not operate at optimal levels.
    If the entire team is working on the response, at that twelve-hour mark, your
    entire response team will slow down considerably. By sending a large amount of
    your responders home immediately to rest and spend time with their families, when
    the current team begins to tire, you have a fresh bench of cyber professionals
    to step in and continue the response while the initial team goes home to rest
    and re-energize. It is also a good idea to use geography as a response enabler.
    If log analysis or a similar investigatory task is required, assigning that to
    cyber security professionals on your team halfway across the world ensures that
    analysis is being worked while the local team is resting. Demand management and
    resource allocation should definitely be part of your response plan to safeguard
    against a weary team.


    The incident response procedures should include a financial component as well.
    At the end of the response, a natural (and needed) question to ask your CFO is
    “how much did the response to this breach cost us”? With so many employees from
    various departments inside and outside the company involved, figuring out how
    many labor hours were used can be difficult'
