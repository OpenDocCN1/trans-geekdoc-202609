    To me, the final SEC rules on disclosing details of the company’s cyber security
    oversight equates to my eighth-grade math class so many years ago: *show your
    work*. It will no longer be enough to demonstrate cyber security competency at
    a macro level and that core elements exist at your company. We must now show more
    details of how we arrived at that macro level of security. I anticipate there
    will be significant dialogue on this disclosure rule, but ultimately, our responsibility
    will extend to providing much more details on our cyber security programs than
    ever before.


    Without question, the final SEC rules will elevate the cyber security discussion
    at all levels of a company. Significant ongoing work is needed to be prepared
    for our disclosure requirements. While there is no magic formula for all companies
    to follow, the one common understanding will be that companies will need to devote
    substantial time, more than ever previously required, to enhance and/or demonstrate
    proper cyber security governance. The duty to preserve shareholder value extends
    beyond mere compliance to a security rule – it is also enhancing the cyber security
    posture for our companies to help maintain a continuity of business.


