    +   - Identifying any gaps in the security program and potential opportunities
    to remediate them.

    +     - Through direct questioning, the director with cyber expertise can inquire
    if the CISO has the resources needed to deploy and maintain an effective security
    program. Where gaps are present, assessing the root cause can be drawn out in
    these more in-depth discussions with the CISO so that guidance to management can
    be performed.

    +   - Share threat intelligence related to the business.

    +     - This is a wonderful opportunity for the cyber expert director to talk
    with the CISO to better understand external threats related to the company’s security
    program, or indirectly associated with it. Understanding the threat landscape
    specific to the company’s industry, or perhaps even more targeted threat intelligence
    regarding the company itself, can provide very good insights. Exploring what other
    companies are doing in a particular domain and/or general cyber security hot topics
    can add value as well.

    +   - Confirming that the people, process, and technology attributes of the security
    program are holistic, with strong integrations with the core business.

    +     - It is within these conversations where the director can get a feel for
    the security specifics of particular operating segments within the company. What
    does the security for any payment card processes look like? How robust is the
    security for the operational technology that drives manufacturing at the company?
    These discussions help to evaluate how the security organization links its initiatives
    with the business – a critical component of any security program.


    It is my belief that in order to have such quality-oriented discussions, the frequency
    of board cyber expert/CISO should be more than once per quarter. Instead, a monthly
    cadence would allow for not only identifying subject matter capabilities/gaps
    but also monitoring progress to the execution of security strategies, as well
    as emerging threats and/or shifts in business strategies that require adjustments
    in the cyber security services delivered to the business.


    When the committee or full board updates are provided by the CISO, the board cyber
    expert can provide commentary to the main themes and serve as a translator for
