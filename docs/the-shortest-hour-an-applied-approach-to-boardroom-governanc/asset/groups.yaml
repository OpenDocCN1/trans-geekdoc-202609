    earlier chapter the very detailed roles outlined between the cloud service providers
    and the customers, each one with specific duties as part of the relationship.
    Moreover, removing the infrastructure from company-operated datacenters and placing
    them in the hands of a cloud provider open new questions such as, “Where does
    my data reside?”, “Can I perform an assessment on the security of my provider?”,
    and other important questions.


