    \ 人工智能（AI）安全 112\n  - 云安全 114\n  - 身份与访问管理 116\n- 13. 事件响应 119\n  - 正确的响应 121\n\
    \  - 外部支持 122\n  - 事件响应计划 123\n  - 勒索软件响应 125\n  - 将政策转化为实践 127\n- 14. 安全意识 129\n\
    \  - 意识文章 130\n  - 基于角色的安全培训 131\n  - 自带午餐会 132\n  - 网络安全意识月 132\n  - 网络安全品牌建设\
    \ 133\n  - 网络安全开放日 134\n  - 动态意识：内部钓鱼活动 135\n- 15. 政策管理 138\n- 16. 风险管理 141\n\
