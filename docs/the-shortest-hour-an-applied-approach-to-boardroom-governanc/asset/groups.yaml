    - 2. The impacts of cyber security have increased exponentially in the past decade
    with increased risks, breaches, and regulations. I argue that the same level of
    risk velocity is not found in many other business domains, resulting in an increased
    need for cyber security expertise at the board level. Some may argue that adding
    a director to address each business domain specialty is not the best approach
    in building an effective board, and I somewhat agree. However, certain domains
    are more prevalent, impactful to the success of the company, and emerging at a
    high velocity (cyber security as an example), which require a more domain-specific
    specialty.


    - 3. A management team and board may leverage consultancies, outside law firms,
    and advisory partners to assist them with understanding cyber security risks.
    These services have a cost associated with them, and if the risk velocity of cyber
    is so great and will require assistance regularly over time, these costs add up
    with each engagement. It may be more cost-effective to have a director with cyber
    expertise (as well as requisite business competencies) to replace many (not all)
    of these external engagements.


    - 4. There were public comments to the proposed rules that reiterated the well-known
    fact that the cyber security industry has a shortage of experts. Even fewer are
    cyber experts who also have a deep understanding of business domains and could
    translate those skills to board service. Some commenters concluded that the proposed
    rule to require disclosure of board expertise should not be finalized due to this
    shortage of experts.


    As a CISO who builds security strategies and hires the appropriate staff to fulfill
    those services, I have identified an important issue that needed addressing but
    decided not to address it because finding the appropriate talent would prove too
    difficult due to a lack of available resources. Instead, my team and I worked
    on innovative solutions to find the appropriate talent or build it. The limited
    talent pool is a separate issue from the core issue of the need to have cyber
