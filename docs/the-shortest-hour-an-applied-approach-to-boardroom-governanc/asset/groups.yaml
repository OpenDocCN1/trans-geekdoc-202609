    The manner in which a CISO presents to their board of directors is as unique as
    the information security program for the company itself. Yet, there are some general
    themes that can be garnered from industry research into how a CISO reports to
    the board (or a committee). In today’s current environment, it is not uncommon
    for a majority of CISOs to present to a board committee, with many of these presentations
    provided to the audit committee.


    The inclusion of cyber security as an agenda item at the board level is a critical
    success factor for corporate governance and something that has significantly improved
    in the past decade. There is no better way for you to understand what the company
    is undertaking to combat cyber threats than by receiving regular updates from
    your CISO several times each year.


    The frequency of board-level cyber updates varies from company to company, but
    a typical cadence for my career has been quarterly updates. In some cases, the
    CISO presents to a committee for three consecutive quarters, with a full board
    briefing in one quarter (perhaps in Q1 or Q4 for an annual review type of briefing).


    The audit committee has historically been the home for cyber security updates
    to directors. Whatever the previous reasons for placing cyber security under the
    audit committee at these companies, it is time for boards to re-examine how cyber
    security issues are brought to their attention, as well as the committee structure
