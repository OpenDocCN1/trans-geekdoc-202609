  - '[PAGE 101]


    At the very least, such inquiries of the CISO about service delivery can produce
    insights for you on how the security program provides services for the company.


    # OPERATIONAL CADENCE AND THE RHYTHM OF SECURITY OPERATIONS


    While the service catalog focuses on the consumers of security services, there
    is an additional need for an internal program designed for the cyber security
    team that documents the operational cadence of the cyber security program. This
    operating model helps to clarify roles and responsibilities, internal processes,
    and instructions on how the cyber security organization conducts its operations.
    Above all else, it retains the information in a centralized place so that the
    documentation is readily available to all members of the team, helping to reduce
    single points of failure. The operational model can include multiple types of
    sections derived from what is important for the CISO to capture. Some examples
    may include the following.


    # PEOPLE


    Documenting the people aspects of the cyber security team adds value insofar as
    it explains each security employee’s expertise in certain areas, role, responsibilities,
    perhaps core competencies in specific security technologies, training updates,
    and more. It may also include contact information, certifications, and information
    that makes it easier for other security employees to understand who they can reach
    out to with questions or assistance with various tasks and details about specific
    security technologies.


    Equally important is to detail the experts outside of the information security
    organization, possibly from the IT team. Examples could include network administrators,
    email administrators, database experts, cloud infrastructure points of contact,
    and many more. To help thank the different non-security groups for providing their
    contact/expertise information, the CISO can give the other teams the established
    roster of the information security team that outlines expertise in the various
    security areas.


    # PROCESS


    Whether it is how to respond to specific tasks or the proper method for configuring
    a system, documenting the security processes helps to maintain consistency in
    operations no matter who from the team is performing the process. Step-by-step
    instructions are documented for various situations, examples may include business
    email compromise, data theft, device'
  - '[PAGE 102]


    misconfiguration, denial of service incident, lost or stolen device, privilege
    escalation, suspicious network activity, and a host of others.


    The format is flexible, the documentation can take the form of a Wiki, or perhaps
    formal documentation in a data repository – all of which are secured with strong
    access controls, up to potentially leveraging multi-factor authentication.


    # TECHNOLOGY


    With so many different types of security technologies in use at your company,
    it is imperative that information is retained for each one. Some data that may
    provide value in the operational model could include:


    +   - General information on the technology

    +   - Whitepapers, research, and industry reports from the vendor

    +   - Contact information for the vendor, account rep, technical support, etc.

    +   - Copies of the contract/renewal

    +   - Implementation notes from the professional services team

    +   - Configuration data


    In doing so, the information is readily available to the entire team rather than
    residing on one person’s computer.


    # DATABASE OF INFORMATION


    A perennial activity for most cyber security teams is answering a questionnaire
    for any variety of purposes. It may be for compliance reasons, cyber insurance
    policies, or perhaps general questions about the infrastructure size/type for
    scoping exercises when exploring new technology purchases. Rather than treating
    each questionnaire individually by assembling a team to research the answers,
    I have found that a one-to-many approach is much more efficient. The questions
    and answers are entered into a database of responses, always available, and can
    be leveraged to answer multiple types of inquiries. If new questions are asked
    that do not have a response, they are added to the database. Following this methodology
    means that only at regular intervals, perhaps annually or after a large change
    in the corporate infrastructure, the responses are checked to ensure they remain
    accurate.


    Value can also be found in storing reference architectures. These architectures
    provide a baseline approach to implementing a system and may include diagrams,
    process flowcharts, and other types of reference materials. Lastly, industry documentation
    such as common frameworks is a valuable addition to the operational model.'
