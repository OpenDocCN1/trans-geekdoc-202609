    There are several things to consider when deciding to pay a ransom. First and
    foremost, interactions with cyber criminals in and of itself should be weighed.
    The person or team that breached your network and caused disruption have already
    exhibited behaviors in conflict with appropriate business transactions. Moreover,
    they have attempted to extort money (Bitcoin, etc.) from your company to unlock
    the systems. These behaviors do not point to a high degree of confidence that
    future dealings with them will be forthright and professional. If the ransom is
    paid, there is no guarantee that systems will be unlocked by the adversary, that
    the decryption process works completely, or that they will not disclose your proprietary
    data anyway. Additionally, once the ransomware attack is successful, there are
    no guarantees that the same person or team won’t attack your company again, demanding
    another ransom.


    I’ve enjoyed fishing since my grandfather first took me as a young boy, and any
    time I get an opportunity, I like going out on the water to relax and try to catch
    my daily quota. I normally don’t fish in areas I haven’t tried too many times
    in the past. I always go to the sections of the lake or ocean where I have consistently
    caught fish before – I know that area has a better chance of success because it
    has worked for me in the past. Similarly, if the adversary has seen previous success
    in breaching a specific network and was paid, it stands to reason that the likelihood
    of future attacks and payment success for them on the same network may be better
    than average. When a ransom is paid, there is no promise by the adversary that
    they won’t attack you again.


    There are companies that specialize in negotiations between the attacker and the
    victim company. For a fee, these companies negotiate attacker’s demands to lower
    the ransom amount and serve as an intermediary between the two. While the negotiating
    firm may be reputable, the “breach supply chain” of the victim company, negotiator,
    and attacker still includes one non-reputable entity: the attacker. Even with
    just one bad player in the chain, the overall process still includes the potential
    for unreliable conclusions, even with the other two reputable companies are performing
    ethically.


    While no preventative controls work one hundred percent of the time, an argument
    can be made for a strategy that allocates funding in appropriate back-up systems
    and ransomware protections in a thoughtful budget process over time (before a
    ransomware attack) rather than spending millions on ransoms, only to have to implement
    security controls anyway at a later, post ransom point in time. A purely analytical,
    alternative argument may be that if I pay $2 million in a ransom, and it takes
    $4 million or more to'
