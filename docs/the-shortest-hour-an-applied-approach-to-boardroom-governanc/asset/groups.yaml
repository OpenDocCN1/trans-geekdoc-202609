  - '[PAGE 30]


    adversaries only have to be right one time while the CISO and their staff need
    to be correct every time. It is much more difficult to be in a constant cyber-defensive
    posture rather than the offensive position of our adversaries. There are large
    numbers of disciplines within cyber security that force the CISO to be attentive
    to multiple initiatives across a broad spectrum. In some cases, they may feel
    as if they are unable to initiate change in reducing risk given the culture of
    their new company. All these factors can lead to burnout and may have influence
    on the short tenure for many CISOs.


    To find a truly effective CISO, it is worth looking at the average tenure of past
    CISO roles that each of your candidates possesses. A successful CISO will have
    several years of average tenure at the companies in which they’ve worked. Careers
    are dependent upon a number of factors, and it is common to have perhaps one CISO
    tenure for a candidate lasting only one year, sprinkled in with other roles lasting
    several years. For example, a CISO may have worked for a company that they found
    to be less supportive of security initiatives than expected. Or perhaps after
    starting, the new executive realizes the financial posture of the company isn’t
    as strong as anticipated. The CISO should alleviate some of this risk during the
    interview process by asking direct questions related to corporate culture surrounding
    information security, or perhaps more deeply researching the company’s Annual
    and 10-K reports for information on free operating cash flow, debt, and other
    financial triggers pointing to the current financial posture. Regardless, there
    may be circumstances which, even with strong pre-hire research, the CISO finds
    themselves in a situation outside of their control which requires them to move
    on after just a year in the position. Therefore, it is imperative that senior
    leadership looks at the *overall* average tenure and strongly considers those
    with a higher average of successful years to move forward in the selection process.


    Those CISOs who consistently move from company to company after only one year
    may possess strong security strategy development skills, but they will lack the
    critical competencies of *executing* a strategic plan over time. Without the experience
    of implementation, feeling the struggles of applying a strategy and working through
    conflict, the candidate will not be as successful as their peers. A good CISO
    has the scar tissue from past execution experiences.


    Exploring a CISO candidate’s execution experience is also a good way to investigate
    how they go about staggered implementations. Does the candidate strive to do more
    with less resources as the funding is delivered incrementally, or do they wait
    until full funding has been provided prior to executing a plan? Answers to these
    questions may be indicators to how successful the candidate will be during a potentially
    challenging funding period.'
