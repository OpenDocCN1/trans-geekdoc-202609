    对许多公司来说，一次性资助所有必要的安全投资可能不可行（或不受欢迎）。平衡多种因素，例如执行项目的可用资源、公司安全态势特定领域中的巨大差距，或者资助安全项目的财务状况，可以确保制定一个稳健的计划来构建安全项目。为实现这种平衡，CISO可以从最关键的需求开始，然后在战略计划中稍后处理其他举措。利用已完成评估，可以使用简单的可视化图表来传达项目需求的优先顺序（见图8.1）。


