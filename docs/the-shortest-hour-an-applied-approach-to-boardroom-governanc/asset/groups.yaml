  - '[PAGE 36]


    the same example details except the financial impact was not materially impactful,
    this introduces a few issues. Using this logic, what is the financial threshold,
    that specific financial figure, that says any executive who’s financial loss impact
    is below that figure is safe, but any executive who’s financial impact is above
    that financial amount is terminated? There isn’t, nor should there be such a financial
    threshold.


    Sticking with this example just a bit longer, I believe the scale of responsibility
    should be evaluated. In the manufacturing example, not every employee has access
    to the manufacturing floor, and even fewer are service technicians capable of
    causing disruption. In the finance example, not every employee has access to money
    or to financial systems that provides a better than average opportunity to steal.
    But with cyber security, the number of employees capable of causing disruption
    is not as limited—every employee with access to a computer and email account can
    be sent phishing emails, social engineered on the telephone, insert an infected
    USB drive into a work computer, or fall for any number of risks. Moreover, the
    employee can be breached on their personal device/account, outside of work, which
    may carry over into the corporate infrastructure.


    The true effectiveness of a program lies in the preventative controls implemented,
    the ability to detect potential issues, and how robust the response capabilities
    are in the wake of an issue so that the business can return to normal operations.
    If such a program is in place and due diligence was achieved, the executive has
    performed their due care.


    Next, an effective CISO brings risks to leadership and advises on suggested strategies
    to mitigate those risks. Through executive decisions, or perhaps through an Information
    Security Steering committee made up of corporate executives, the CISO does not
    ultimately make the choice whether to invest in a risk mitigating process/technology
    on their own. Senior executives are the approvers of budget and allocate funds
    across the company. Effective security is a team endeavor, each one playing a
    vital role.


    Lastly, firing a CISO after a breach can be short sighted. I attend several information
    security conferences over the course of a year; it is a valuable chance to learn
    from industry peers and service providers on how to thwart the latest threats.
    After the keynotes are completed, attendees move to various breakout sessions,
    each one focusing on a different topic. The sessions that talk about general risks
    are usually the sessions that attendees can easily find a chair to settle into
    and listen to the speaker. Finding a seat in sessions that talk about specific
    methodologies that a CISO successfully deployed is a bit more difficult. But those
    sessions with a CISO speaker outlining the lessons learned from a recent large
    breach are always standing room only. Everyone wants to learn more about those
    nuggets of information that they can take back to their companies and fold them
    into their security program.


    Why terminate this CISO with all that real-life knowledge of incident response,
    only to watch them go to another company to apply those lessons'
