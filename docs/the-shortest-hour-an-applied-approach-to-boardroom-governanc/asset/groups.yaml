    security oversight needed to be enhanced. Today, not only does effective cyber
    security oversight make good business sense, the disclosure of certain elements
    of a company’s cyber program now require it.


    The rules require, among other things,


    current reporting about material cyber security incidents and periodic reporting
    to provide updates about previously reported cyber security incidents. The rules
    also require periodic reporting about a registrant’s processes to identify and
    manage cyber security risks; the registrant’s board of directors’ oversight of
    cyber security risk; and management’s role and expertise in assessing and managing
    cyber security risk.


    One of the rules that did not make the final requirements was the proposed rule
    for “annual reporting or certain proxy disclosures about the board of directors’
    cyber security expertise, if any”.^2


    The final rules require more disclosure around various aspects of a public company’s
    cyber security program than ever previously required. Implicant then would be
    the notion that a company’s leadership, including its board of directors, understands
    these various aspects of their cyber program enough to have the ability to disclose
    them. Rather than repeat each of the SEC rules in this book, perhaps our time
    would best be served by examining the potential impacts, as well as some commentary
    from my perspective that may provide value for you in your oversight duties?


    As with any rule or regulation, time is needed to understand how they will affect
