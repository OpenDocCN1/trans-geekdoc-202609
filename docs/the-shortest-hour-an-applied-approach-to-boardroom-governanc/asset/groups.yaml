  - '[PAGE 146]


    # BROWN BAG SESSIONS


    I have found success with adding brown bag sessions to the information security
    awareness program to provide employees with an informal, learn as you wish type
    of service. I am always fascinated by the level of employee interest in these
    sessions, which almost always includes a full conference room or large number
    of virtual attendees. People want to learn more about cyber security and how they
    can protect themselves (and their families) from online threats. This program
    adds one more training avenue for individuals to accomplish that.


    The brown bag program could involve a reserved conference room, or video conferencing
    meeting space, typically during the lunch hour when employees can bring their
    lunch and listen to an informative session on a cyber security topic. At least
    twice per year, we will bring in food for attendees to enjoy as they learn. It
    is an informal, fun way to learn more about cyber security.


    # CYBER SECURITY AWARENESS MONTH


    Each year, October is recognized as cyber security awareness month, a chance for
    companies to highlight the importance of cyber security throughout the month.
    Capitalizing on this opportunity requires advanced planning early in the year
    to create a program filled with activities and learning sessions that invite employees
    to learn more about information security in a fun way. What follows are some tips
    on what my teams and I have created during National Cyber Security Awareness month.


    Promoting the awareness month starts in September with email blasts, posters,
    and a calendar of events that will take place in October. The goal is to generate
    excitement about the month-long event and provide employees with the chance to
    reserve time on their calendars to attend some of the upcoming activities. Pre-planning
    also involves administrative tasks such as booking conference rooms, reserving
    tables and chairs in common areas of the office to set up learning stations, as
    well as ordering any food or beverages for the events throughout the month’s activities.
    Additionally, during the pre-planning phase, arrangements can be made with security
    vendors to provide give-away items for employees such as t-shirts, pens, webcam
    covers, and other small items.


    On the first business day of October, a group of information security employees
    gather at the employee lobby entrance where tables are set up. Posters highlighting
    different cyber security topics adorn the walls of the lobby and tables are filled
    with cupcakes, wrapped in packaging with a note highlighting the internal website
    that details of the month’s activities. This type of welcoming event helps to
    kick off the awareness month and get employees enthusiastic about the upcoming
    events.'
  - '[PAGE 147]


    The types of events a company can provide throughout the month are only limited
    by the team’s imagination. Some examples of past events my teams and I have created
    are:


    +   - **Password Strength:** Computers or tablets are set up in common areas for
    employees to stop by and enter in a password they consider to be strong. The application
    provides results of how fast the password can be compromised, the weaker the password
    the faster it can be compromised. Employees enjoy this activity because it is
    a hands-on way for seeing how well they can choose strong passwords.

    +   - **Breach Notification:** A table staged centrally in corporate office’s
    common areas, perhaps the cafeteria, has computers on them for employees to enter
    in their phone number and/or email address. The application will notify them if
    their email or phone were involved in a previous cyber breach.

    +   - **Word Jumbles/Games:** At the beginning of the month, employees can pick
    up a packet with different games such as crossword puzzles, word jumbles, etc.,
    that relate to cyber security topics. Throughout the month, the employees work
    on the puzzles and turn them in for a chance to win prizes.


    An important consideration to make for those companies with multiple locations
    is to ensure that the awareness month activities take place across the various
    sites around the world, each one with as much fanfare as the corporate office.
    This ensures that some employees are not left out of the activities and reinforces
    that cyber security is a global initiative for the company.


    National Cyber Security Awareness month is a fantastic way to focus on the importance
    of cyber security in fun and imaginative ways that employees enjoy. With some
    thoughtful, preliminary planning, your awareness month program can be successful
    in meeting these goals.


    # CYBER SECURITY BRANDING


    Marketing the cyber security program can take many forms, one of the most effective
    ways I have found is to provide branded materials for the employees. The first
    step is to create a cyber security logo, and with the help of the company’s digital
    and marketing teams, I have found wonderful results in developing a cyber security
    “brand” for the company. I typically don’t like to create a logo from scratch
    or one that is vastly different from the corporate brand. Usually, I just leverage
    the official corporate logo with the name of the team, i.e., cyber security, information
    security, information security and Compliance, or whatever the organization’s
    name, under that logo.'
