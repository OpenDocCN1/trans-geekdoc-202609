    | 分类 | 实践 | 问题 |

    |---|---|---|

    |  |  | 谁是有权决定支付或不支付的高管？如果主要负责人无法履职，谁是后备高管？ |

    |  |  | 公司是否已确定一名第三方谈判员，以促进公司与对手之间的讨论？ |

    |  | 将政策付诸实践 | 公司是否开展模拟网络事件的桌面推演，以演练响应步骤？ |

    |  |  | 演练是否包含适当的利益相关方（内部和外部）？ |

    |  |  | 桌面推演的频率是多少？ |

    |  |  | 演练是否由具备网络入侵响应专业知识的第三方主持？ |

    |  |  | 演练是否包含考虑贵公司业务、攻击类型以及针对贵行业的攻击者的场景？ |

    |  |  | 演练中是否有旨在打断响应流程的“注入”环节，例如股价下跌、记者要求置评等？ |

    | 安全意识 | 年度培训 | 公司是否对所有员工进行年度安全培训？培训完成情况是否跟踪到每位员工？ |

    | 安全意识 | 意识宣传文章 | 贵公司的安全团队是否定期向员工推送网络安全意识文章？ |

    | 安全意识 |  | 文章主题是否及时关联安全运营团队当前发现的威胁趋势，或节假日期间网上购物安全等话题？ |

    |  |  | 是否制定了每月推送主题的日历，以确保不会反复推送重复的主题？该日历是否允许根据公司安全运营团队发现的威胁调整主题？ |

    |  |  | 是否有针对紧急类型文章的流程？ |

    |  | 基于角色的培训 | 安全意识计划是否开展针对特定岗位的安全培训，重点聚焦敏感岗位（如系统管理员、高管、行政助理等）相关的风险？ |

    |  | 午餐学习会 | 是否有员工可自愿参加的安全培训机会，以学习更多网络安全知识？ |

    |  | 网络安全意识月 | 安全计划是否在十月——网络安全意识月——推出创新的意识宣传活动？ |

    |  | 意识宣传选项 | 安全团队是否提供独特的意识宣传机会，如赠品、安全开放日等，帮助员工牢记关键的网络安全知识？ |

    |  | 内部钓鱼演练 | 安全团队是否通过内部钓鱼演练，使安全培训对员工更具个人针对性？ |

    |  |  | 这些演练是否在企业、团队和员工个人三个层面衡量有效性？ |

    |  |  | 是否有针对多次未通过演练的员工提供额外培训的流程？ |

    |  |  | 演练是否从易于识别的钓鱼邮件开始，再逐步升级到难以察觉的更复杂钓鱼邮件？ |


    | 分类 | 政策结构 | 评估问题 |

    |---|---|---|

    | 政策管理 | 政策结构 | 公司是否建立了完善的网络安全政策体系？<br><br>文档是否按政策、流程、标准、指南等进行分类，还是全部合并在一份冗长且难以阅读的文档中？<br><br>政策（尽可能）是否使用易于理解的语言撰写，以便不具备技术知识的员工阅读？<br><br>政策是否简明扼要，并引用流程、标准、指南等更详细的文档？<br><br>所有员工是否都能方便地查阅这些政策？<br><br>政策管理流程是否已自动化，以减少多个版本文档通过电子邮件来回发送？<br><br>是否有豁免流程，允许用户/团队暂时免除强制要求，以便逐步实现合规？
    |

