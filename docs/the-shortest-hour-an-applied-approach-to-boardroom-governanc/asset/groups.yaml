    # Chapter I


    # # The threat landscape


    Cyber threats to organizations, as well as the malicious actors that exploit them,
    constantly evolve. So much so that by the time that you finish this book, material
    shifts in cyber threats may have already taken place, or at the very least, more
    than a few corporations will have been breached. Yet, there are some foundational
    threats that remain consistent, threatening our corporate infrastructures; and
    these are the threats that I will highlight in this chapter. In doing so, it provides
    a good foundation for what any organization connected to the Internet faces on
    a daily basis. Moreover, it is well known that all of us have varying levels of
    understanding of cyber security, so starting with the foundational concepts helps
    to explain what the information security industry is trying to achieve in their
    daily work, for readers of all skill levels.


    # ## WE ARE ALL TARGETS


    During my career as an information security executive, I have heard many senior
    executives tell me that their organization isn’t in the type of industry or a
    company that would be a target for adversaries. “We are just a small company,
    not a large aerospace and defense corporation; why would anyone want to target
    us?”


    While this may have historically been true, in recent years the adversaries have
    added new capabilities to their attack models so that sensitive data isn’t the
    only thing they seek to exploit. Data has value, but that value has a shelf life
    that may often diminish over time. Historically, criminals would steal data to
    sell on the dark web¹ for monetary gain. But as the data sits on the darkest corners
    of the Internet, consumers change credit card numbers or do other actions that
    make the data obsolete over time. Our adversaries realized this, and while stealing
    data is still very much prevalent in our industry, especially for trade secrets,
    personally identifiable information, access credentials, and other sensitive corporate
    data, they added ransomware to their arsenal of cyber weaponry.'
  - '[PAGE 22]


    Ransomware leveled the playing field for all industries as it relates to becoming
    a target. It doesn’t matter what industry a company is in; threat actors will
    seek to attack most anyone leveraging this tactic. Malicious software called ransomware
    encrypts a system so that it is unusable without the decryption keys, which the
    attacker possesses. For a fee (ransom), the threat actor promises to deliver the
    keys so that the system can be used again. If the victim does not pay, the system
    remains locked, and the adversary may threaten to post their data publicly. Leveraging
    this technique means the attacker (if paid) realizes one hundred percent of the
    economic value of the attack, each and every time they attack; there is no dilution
    of the value that may be seen in stealing data and selling it on the dark web.


    In recent years, we’ve seen a nuance to ransomware that exploits the victim company
    as detailed previously but adds a malicious twist insofar as if a ransom is indeed
    paid to unlock the system, the attacker then threatens to post the data publicly
    if *another* ransom (double ransom technique) is not paid. The decision to pay
    or not pay a ransom is a significant debate across corporate boardrooms and is
    a topic I’ll cover in more detail later in this book.


    Malicious actors are often motivated by financial gain, which makes disruption
    to industries and companies such as power plants, lifesaving healthcare, financial
    services, or mass transit attractive to them – in hopes of large payouts to keep
    critical services operational. Simultaneously, these are the industries that often
    may employ more robust cyber security programs than other companies; not impenetrable
    but potentially more difficult to bypass. Attacking small- to mid-cap companies,
    which may not possess as vigorous of a security program as critical infrastructures,
    can still be just as profitable for the attacker. At the same time, all victim
    companies, no matter the size or industry, feel similar impacts to their manufacturing,
    product development, and service delivery capabilities as a result of a breach.


    As adversaries continue to evolve, it has widened their attack surface beyond
    certain industries historically deemed critical. All companies, organizations,
    or any entity that conducts business online is a viable target.


    # THE PERIMETER IS DEAD


    Traditionally, corporations leveraged networks that had a perimeter, with security
    controls layered around it, with the notion that malicious and unauthorized persons
    were on the outside of that boundary and trusted employees were on the inside
    of the perimeter. Such an environment provided some advantages to security but
    did not produce absolute protection. It was realistic for two companies or programs
    to contractually require the installation of a firewall between the two zones
    but if that firewall was configured to allow network traffic to freely flow in
    and out without filtering, proper security was not provided, but the spirit of
    the contract was'
