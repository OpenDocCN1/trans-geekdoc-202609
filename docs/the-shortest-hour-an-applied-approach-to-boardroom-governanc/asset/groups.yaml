    enough funding to send everyone in the information security organization to at
    least one security conference per year, inclusive of travel to the event. It is
    a bulk amount for each employee to utilize how they wish, for whichever conference
    they choose, contingent on the fact that such training is related to the role
    that they hold in the security organization. If the employee serves on a conference
