    ## 规划与跟进


    制定清晰的里程碑和任务，然后据此衡量进展，对于执行至关重要。问十个人，你会得到十种不同的工具偏好，这些工具都能有效跟踪项目任务和里程碑的进展。你的网络安全计划的关键在于选择其中一种，并确保所有利益相关者使用同一套解决方案。同样重要的是，要确认所使用的平台符合企业标准，既能提供足够的安全控制来保护信息，又能降低同时使用多个项目规划工具的成本。一旦建立了跟踪进展的基础，CISO
    就可以开始检查执行目标的进展情况。其目标是确保稳步推进，即使每周只能投入有限的时间，也要建立一种“持续向完成迈进至关重要”的心态。


    ## 定期审查


    记录任务、责任方、完成百分比和项目时间表，对于确认所有利益相关者都理解项目至关重要。通过可操作的指标来衡量任务完成情况，同样为成功铺平了道路。然而，如果数据不进行定期审查，文档和图表就毫无用处。通过定期的项目审查会议，安全领导者可以讨论各项举措的进展（或缺乏进展），并帮助团队清除任何阻碍进展的障碍。


    定期逐个检查项目，让团队有机会讨论任务完成情况，并突出那些本应纳入计划但被原始项目遗漏的内容。这也是一个将资源从提前完成的项目重新分配到可能落后或需要更多帮助的项目的机会。当
    CISO 向公司高层汇报时，这些审查是播报战略执行情况更新的绝佳方式。归根结底，如果没有定期会议来审查进展，即使存在大量文档，战略的执行也可能受到阻碍。


    你不必参与战略计划的执行细节；然而，如果你发现战略的时间安排总是偏离轨道，上述建议可能会带来启发。质疑并理解所采用的执行方法，可能会让你洞察到为什么进度没有按计划完成。


    对于一家公司而言。如果企业采用去中心化的安全模型，由多个团队执行安全服务，那么了解总安全支出可能会更加困难。即使将所有安全能力整合到一个组织中，并详细了解总支出，将这一支出与类似行业、公司规模等的其他安全计划进行比较，也可能无法产生提供可操作基准的预期结果。


    不过，这种困境并没有阻止我们的行业进行尝试。可以创建许多不同的比率来跨多个变量比较安全支出。例如：


    -   分配给安全支出的 IT 预算百分比

    -   每名员工的安全成本

    -   每（某个美元增量）收入的安全支出

    -   安全全职当量（FTE）占 IT 总 FTE 的百分比

    -   以及更多……


    参与这些指标确实会产生数据点，可以与类似规模和行业的其他组织的比率进行比较。但考量数据背后的财务假设后，人们会意识到，基准数据中可能存在某些削弱其有效性的因素。例如，专门用于安全支出的
    IT 预算百分比就假设了许多因素。由于这是一个时间点比率，只衡量计算当时的当前百分比，数字可能会因安全支出的波动性而出现偏差。如果该比率是在同年 2 月发生泄露事件后的
    11 月计算的，那么预算可能反映出 IT 预算中很大一部分分配给了安全。这是大型泄露事件后的正常现象，此时可能会采购和实施新的控制措施。然而，在前一年，该比率可能低得多，因此这种时间点比率可能会产生误导。以此为例，一次性比率并不能显示安全财务的真实趋势，只是一种反应式衡量，尤其是如果未来几年安全资金出现下降的话。


    关于同一个比率，它假设 IT 预算具有足够的适当性。由于许多 IT 部门都在削减预算，这稀释了安全支出比率，因为其假设是 IT 成本越低，安全支出的必要性也遵循同样的缩减路径。此外，如果
    IT 预算并不代表公司的所有技术支出（也许是去中心化 IT 模式导致，有独立的数字团队、电子商务团队等），那么该比率就没有考虑为这些独立技术团队提供的安全服务（而安全部门几乎总是为整个公司提供服务，而不仅仅是
    IT 所代表的那些部门）。


    客户的全渠道机会。每一次重大转变都需要重新审视安全能力，以支持这些变革性举措的落地。而且越早越好。


    无论变化的触发因素是什么，对安全计划的预算影响进行一致且有效的评估，将有助于减少对业务的负面影响。CISO 是帮助企业应对此类变化并解释遵循特定战略路径的风险影响的重要资源。向
    CISO 询问安全计划的财务提案是如何确定的，将为你提供所需的信息，以便你恰当地为领导层提供建议。


    ## 构建财务提案


    CISO 的每份预算提案很可能都包含对所需能力、成本、基准以及可能的一些选项的论证。在此类提案之后，领导层往往会要求 CISO 提供投资回报率（ROI）或所购资产的明确价值，然而网络安全的价值很难衡量。虽然并非不可能，但
    CISO 可以借助一些方法将安全控制措施的购买价格转化为潜在的 ROI 计算。重要的是要记住，与传统 ROI 不同，安全 ROI 更多不是关于公司将享有的财务回报，而是关于它所解决的风险可能性或它提供的预期安全改进。


    安全 ROI 计算的可能属性可以包括规避成本：


    -   因事件导致的收入损失

    -   数据丢失成本，特别是商业秘密和监管数据

    -   与品牌声誉相关的损失


    CISO 与你的时间往往有限，因此在这一分配时间内共享和讨论可操作的信息至关重要。上述计算提供的数据点表面上可以让人一窥公司的具体财务影响，但所有计算都依赖于数据点（更重要的是数据背后的假设）来支撑。由于董事/CISO
    共处的时间如此短暂，我发现描述这些假设和计算的所有基础会占用核心话题的时间，而这些核心话题有助于董事就网络安全事务向公司提供建议。归根结底，这些衡量指标并不能直观地展现对贵公司的具体影响。细节决定成败，理解细节至关重要，尤其是在对安全资源做出财务决策时。


    浏览互联网，你会发现许多与网络安全主题相关的报告，其中大部分在提供行业视角方面极有价值。一些网络安全供应商会发布年度（有时更频繁）报告，概述他们在行业中看到的威胁和其他领域。这些报告虽然很有价值，但要记住的重要一点是，它们可能只利用作者客户群的数据（换句话说，只是可用公司总体中的一部分）。还有一些智库和咨询公司根据研究（通常以调查和访谈的形式）提供报告，给出各种网络主题的行业数据，包括安全财务数据，例如泄露的平均成本、受泄露影响最大的行业等。深入研究调查的研究方法，你可能会发现某一特定发现是基于对某一特定地理区域的一千人进行的调查（举例而言）。理解数据及由此得出的发现的具体细节，对于比较它们与你的组织的相关性至关重要。了解调查的细节，如受访者人数、受访者的职位、他们是否在被调查领域具有丰富的专业知识以及其他数据点，可以帮助甄别哪些发现可用于决策，哪些发现仅可作为该话题的谈资。


    此外，许多发现是研究参与者的平均值，导致泄露成本数据点可能存在变异性，这取决于泄露的规模。开展研究的组织可能会设置参数来解释这种变异性，这有助于使数据更清晰。这些报告基于受访参与组织提供的数据，为估算提供了大致的参考框架。就像你的车辆公布的每加仑英里数油耗一样，你的里程（或网络安全衡量指标）可能会有所不同。


    安全高管经常利用一些比率的量化风险，这些比率更针对其公司。诸如年度损失期望、安全事件概率以及其他许多类似衡量指标的计算，经常出现在董事会演示中。由于希望展示清晰、定量的风险分析及其如何适用于公司的安全态势，这一意图是值得的，但前提是在审查这些比率时理解并考虑数据背后的所有底层细节。如前所述，CISO
    向委员会或董事会汇报的时间有限，花时间争论可预测性与概率之间的差异以及数据背后的其他输入因素，可能会偏离关键问题。如果与其他论证因素结合使用，这些计算可以提供额外的、有价值的数据点，但仅靠这些分析来为安全计划提供资金或传达安全计划，我认为并非最优有效。


