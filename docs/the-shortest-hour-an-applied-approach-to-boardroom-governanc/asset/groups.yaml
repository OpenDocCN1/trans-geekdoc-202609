    # THE COST OF COMPLIANCE


    So far, this chapter has focused on the theoretical challenges with bundling compliance
    with information security, but there are operational and financial considerations
    as well. In addressing compliance issues (which again are of the utmost importance),
    the remediation is primarily focused on clearing the administrative audit finding
    itself and may not contribute to solving the root cause within security that may
    have initiated the finding. Significant resources and attention are dedicated
    to audit remediation, and it is not uncommon to assemble a large, multi-departmental
    team to devote substantial time in addressing a significant finding. Not absent
    from this team is the chief information security officer (CISO) and many team
    members from their security organization. Obviously, the CISO and their security
    team’s contributions are necessary in addressing compliance issues. However, could
    there be such a thing as too much lower-value involvement from the CISO in addressing
    audit finding remediation, particularly in activities that don’t require substantial
    cyber security expertise?


    When a CISO is embedded in compliance activities, they are pulled away from cyber
    security initiatives, perhaps even those initiatives that could prevent another
    similar audit finding in the future. Some common audit findings with security
    implications may fall under user access reviews and not obtaining evidence in
    the form of documented approvals by managers for permitting access to one (or
    more) of the employees on their team to a particular application. Resolving an
    active finding includes going to the managers multiple times and requesting that
    they approve, or show evidence of approval, for the access, each attempt done
    through email requests or physically going to the manager to request the approval.
    It may be an issue in which the manager doesn’t understand the technical jargon
    used within a platform that explains what entitlements are given at specific access
    levels. If this is the case, the CISO and security team work to provide education
    to the manager(s) on the various levels of access. Administrative tasks such as
    tracking and chasing down approvals or manually clarifying the various access
    levels are now being done by cyber security professionals, which the company is
    highly compensating them for to provide specialized security services in an industry
    with limited resources. But in this case, they are not performing those specialized
    services and instead are doing more time-consuming administrative type work and
    at a higher rate of compensation.


    Because compliance and information security are two different disciplines, as
    well as the notion that remediating specific compliance findings may not lend
    itself to solving the root cause of the finding, it seems appropriate that corporate
    leadership teams and directors thoughtfully consider if bundling security and
    compliance activities into one organization makes good business sense for the
    company. Through detailed demand management inquiries on the amount of time a
    CISO is involved in remediation activities,'
