  - '[PAGE 27]


    (CEO), general counsel, the chief financial officer (CFO), chief operating officer
    (COO), or as previously mentioned, the CIO. The straight answer on where the role
    should report is “it depends.” What works for some companies may not be good for
    others. Traditionally the role reported to the CIO, but in recent years we’ve
    seen many CISO’s transitioning out of IT due to (in part) a perceived conflict
    of interest with the leader responsible for establishing open and business-enabling
    technologies, also leading the function that secures those technologies. There
    may be a case in which the CIO, who is incentivized to produce technology capabilities
    for the company, funds such technologies over security budget increases which
    do not have the same immediate value visibility as productivity investments. Additionally,
    the field of cyber security has widened so significantly over the past decade;
    it becomes increasingly difficult for the CIO to stay abreast of the security
    field while maintaining their core competencies in understanding and delivering
    the multitude of business technology solutions.


    Some in the industry say that placing a CISO as a direct report to the CEO demonstrates
    the company’s dedication and support to the information security program. By aligning
    security with the highest level of corporate leadership, the message sent to employees
    is that information security is so vital to the company; direct oversight by the
    CEO is required to stay aligned to its progress.


    Whatever the current argument within the industry related to reporting structure,
    the simple driver for deciding where to put the CISO in the org chart is simply
    around *access to leaders*. If the CISO has the ability to approach senior leaders
    with risk-based concerns and is able to present to you, the director, on a regular
    basis, reporting structure can be a moot point.


    In my career, I have reported to CFOs, CIOs, general counsels, a CEO, and executive
    vice presidents of shared services. There was no single case where the security
    program was more effective because of my reporting structure. What made the programs
    successful was my ability to convey important matters of security in an unbiased,
    unfiltered forum for the highest levels of corporate leadership to make risk-based
    decisions. However, there is a need to ensure that the CISO is organizationally
    well established within the company, so they are seen as a peer to other senior
    executives leading other important functions.


    Due to the importance of cyber security and its impact on the corporation, the
    role of CISO should be elevated to that of a senior executive in the corporation,
    and this would rely on the need for the CISO to have significant business expertise
    to excel in the position.


    An interesting benchmark to understand how the CISO role is sometimes perceived
    is to browse job postings by companies or recruiting agencies'
  - '[PAGE 28]


    searching for a CISO (look online for yourself). What follows are a few actual
    job requirements I have found for a few CISO positions over the past year:


    +   - Significant practical, hands-on knowledge of the following:

    +     - packet analysis tools such as tcpdump, Wireshark, and ngrep

    +     - database structures and queries

    +     - Cisco or Palo Alto firewall/IPS administration

    +   - Expertise with UNIX, Linux, Windows operating systems

    +   - Hands-on experience with computer forensic investigation tools to collect,
    analyze, and preserve electronic evidence.

    +   - Working knowledge and practical application of security products (both on-prem
    and cloud) including firewalls, vulnerability detection, network devices, endpoint
    protection, application testing, etc.

    +   - Network security architecture development

    +   - Degree in Software Development/Programming


    CISO requirements such as these do little to advance the role to that of a peer
    executive in business and solidifies the long trend of thinking that the CISO
    is a technical position that administers technical controls and should report
    to another executive who has business experience and can translate it into corporate
    risk. It is true that some companies and recruiters do indeed understand the concept
    of what a true CISO should be; however, there is a clear opportunity to grow the
    role through education and challenging corporate leaders to the fact that an information
    security executive should be more focused on business risk than configuring firewall
    rule sets.


    Absent from the above job description requirements are significant competencies
    in finance, strategy, operations, human resources, legal, marketing, and above
    all else, leadership. All of which are vital to perform as an effective CISO.
    The deep, hands-on, daily job skills within security operations are crucial; however,
    they are crucial for other roles within the cyber security organization – not
    the CISO.


    Some industry colleagues may disagree with my addition of strong business qualifications
    in a CISO job description, explaining that the role should primarily have substantial
    expertise in information security; after all, information security is indeed in
    the job’s title. I agree that the addition of business qualifications in the role
    should not dilute the need for cyber security expertise. It is a vital part of
    success for the CISO, so I am not inferring that business competencies replace
    cyber security skills. Moreover, when I refer to business skills in the above
    domains, I am not suggesting a casual understanding of these skills. Instead,
    I believe the CISO should have deep expertise in these business domains, as much
    as any other “C-level” executive that holds a leadership position across finance,
    operations, HR, or strategy.'
  - '[PAGE 29]


    What makes the CISO role so challenging is the need for having deep technical
    underpinnings, expertise in managing risk, an understanding of attack tactics,
    their response measures, strategic security planning, *and* all the aforementioned
    business requirements, to make for an effective leader. Some of these skills,
    for example, incident response or technical expertise, lie dormant until they
    need to be leveraged in an exceptional situation. But the core business and leadership
    proficiencies are always there on the surface, used every day.


    For at least ten years within the cyber security industry, I have read or heard
    about the need for the CISO to “have a seat at the table” when it comes to discussions
    with the board of directors for corporations. It is a perennial discussion that
    desperately requires substance over a mere rally cry. What lacks in the debate
    are concrete examples of *how* CISO’s achieve this seat. Many will say that it
    has positively evolved, with many CISOs now presenting to the board multiple times
    per year, so progress has been made – which is indeed a positive trend for our
    role and our industry. But make no mistake, while there are many corporations
    that have invited CISOs to the boardroom on their own accord, many have not done
    so out of some transformational evolution of all CISOs speaking to the business
    aspects of cyber security. In reality, it was only because of regulatory requirements
    or industry pressure based on the onslaught of breaches that forced us to be there.
    Had it not been for these external pressures to have cyber security discussed
    at the board level, many CISOs would still be vacant from the boardroom. It is
    (long past) time for CISOs to proactively alter our destiny through less debate
    on *why* the role should have a seat at the table and demonstrate core competencies
    of *how* we can be drawn into the boardroom, rather than be regulated or pressured
    to be there.


    One positive outcome of the pressures to include cyber security more broadly across
    the business is awareness of the topic itself. Never in my career have I seen
    such interest or enthusiasm to learn more about our industry and the threats that
    impact all of us. Capitalizing on this opportunity requires more than just knowledge
    of cyber security; what a simple role it would be if we only had to recite common
    risks and potential countermeasures. What differentiates an effective CISO is
    the ability to understand these common risks and potential countermeasures, and
    then weave them into the business environment to which the CISO is delivering
    services. To do this requires a deep understanding of the business in which they
    belong, and to accomplish this understanding, a strong knowledge of all business
    domains is required. And this entire process takes time. It is nearly impossible
    to do this in a one-year tenure at an organization and unfortunately the tenure
    for many CISO’s is not as long as other executives.


    Many factors contribute to some of the high turnover in the CISO role. It is a
    high-stress position in which the executive must be ready to act at a moment’s
    notice equating to very little down time. In their work, the'
