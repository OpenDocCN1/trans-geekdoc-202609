    # # The Shortest Hour


    Independent directors of corporate boards understand the importance of cyber security
    as a business issue. Increased regulatory requirements, the onslaught of breaches,
    as well as the replacement of the corporate network perimeter with more third-party
    partnerships have all contributed to cyber security rising to the top of enterprise
    risks. Yet, many directors only receive a few brief cyber security updates during
    the year. Moreover, many directors have devoted their careers to other important
    business disciplines and may not fully grasp the technical concepts of cyber security.


    The challenge is that many publications on board cyber security governance address
    the topic at such a high level that it removes the important context of the cyber
    security details—or covers the topic too deeply with hard-to-understand technical
    language. These resources may often provide lists of security questions for directors
    to ask of their management team, but they do not provide the answers to the questions
    so that actionable oversight can be performed. What I would have wanted, and why
    you are probably reading this book summary, is a resource that delivers the questions
    to ask but also provides the answers and in a narrative, easy-to-understand style.


    An award-winning Chief Information Security Officer with over two decades of working
    with multiple Fortune 500 boards, Lee Parrish provides an example-laden vision
    to improve cyber security governance in the boardroom. Additionally, Lee deciphers
    the technical jargon to increase the reader’s cyber fluency—not to make you a
    cyber expert but to help you be able to ask direct questions, understand the answers
    provided, challenge strategies, and advise on important cyber decisions.


    Pick up your copy of *The Shortest Hour: An Applied Approach to Boardroom Governance
    of Cyber Security* today and start your journey on achieving more effective cyber
    security oversight.


    Want to learn more? Please visit www.novelsecurity.com'
