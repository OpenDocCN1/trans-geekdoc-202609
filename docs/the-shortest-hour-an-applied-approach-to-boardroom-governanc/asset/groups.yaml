  - '[PAGE 148]


    By using the corporate brand, it makes the approval process by corporate marketing
    a bit simpler, not to mention it highlights the already established brand for
    the company. I have steered clear of unique and special logos that are a departure
    from the official company marketing materials, and definitely without stereotypical
    images such as hackers with hoodies or similar references.


    Once the security brand logo has been established, my team and I work to create,
    order, and purchase a wide variety of products with the new security logo embossed
    on them. We traditionally have two tiers of products: Tier One are small items
    such as water bottles, mugs, hats, pens, golf balls, etc., and Tier Two are more
    expensive products (coveted by employees) such as fleece pull-overs, polo shirts,
    backpacks, and the like.


    Tier-One merchandise is good for small giveaways at corporate cyber security events,
    such as the cyber security awareness month activities mentioned previously. Tier-Two
    items are perfect for raffles, handing out to participants of table-top exercises
    and special giveaways.


    In every company I have been a part of, this merchandise was highly desired by
    the employees and helped to strengthen the culture of security at the company.
    Employees talk to one another about how they obtained the item, which can lead
    to more in-depth conversations about cyber security.


    # CYBER SECURITY OPEN HOUSE


    Every cyber security program is a part of the business, an enabler to keeping
    business processes functioning effectively, with the ability to recover quickly
    after incidents. Historically, cyber security was seen as a super-secret society
    that operated in the dark recesses of a corporation, but as the topic has gained
    significant attention, more people are curious as to what the security teams are
    doing to help protect the company. Additionally, they are interested in how they
    can assist in the mission, as well as how they can protect themselves from cyber
    threats. Many corporations have seen the need to bring cyber security to the forefront
    of business operations, recognizing that it is time for security teams to turn
    on the lights and emerge from behind locked doors to share their capabilities.
    A great method to accomplish this is through an annual cyber security open house.


    As a standalone event, or as part of the National Cyber Security Awareness month
    in October, the Open House aims to share all the initiatives that the information
    security organization performs each day to help protect the corporation. My teams
    and I have put together many of these Open House programs during my career and
    each one is met with high enthusiasm from the employees.


    Usually once per year, tables are set up in a corporate office common area or
    large conference room. The tables make up several stations, each one equipped
    with a computer and large monitor facing the center of'
