    # CISO OPTIONS


    Another popular trend for companies is to outsource the CISO role to a security
    company that provides virtual chief information security officer (vCISO) services.
    Akin to a consultant, the vCISO provides fractional or part-time security leadership
    services to a company so the customer can avoid the cost of a full-time equivalency
    (FTE) CISO. Aside from the proposed cost savings, the benefit of such a service
    may be marketed as the vCISO having good visibility into risks across multiple
    clients and industries and can then weave that knowledge into security strategies
    for your company. Along with the senior leaders of the company, you should closely
    evaluate the use of vCISO services to ensure it is the right choice for the business.


    As regulations increase and with cyber breaches on the rise, outsourcing such
    a critical role could prove problematic. Even if your company is very small, it
    doesn’t eliminate the risk of intrusion (recall that ransomware leveled the threat
    playing field for corporations of all sizes and industries). Additionally, the
    wide view of what other clients are doing in security is not likely to apply to
    every company since each one has such unique needs and risk postures.


    While many vCISO companies provide excellent services, an investigation into the
    overall vCISO industry will show more than a few examples of vCISO’s with little
    or no CISO experience. Persons with a desire to break into the CISO role may start
    by creating a limited liability company (LLC) for a few hundred dollars to provide
    vCISO services to clients but they lack the hands-on, past experience of holding
    a dedicated CISO role for a corporation. Outsourcing security services in general
    is not a negative strategy; later in this book, we will examine a few examples
    where outsourcing other portions of the security service catalog may make good
    financial sense. Like with any decision to proxy a critical portion of your business
    externally, deep analysis must be done to ensure it is the correct strategic plan
    for the company.


    # CISO SELECTION PROCESS


    Due to the criticality of the role, it is important for members of the board of
    directors to be involved in creating the criteria, as well as the selection process,
    for the CISO position. The depth of that involvement is up to each unique board.
    At one company in my career, the board helped to create the distinguishing competencies
    that the CISO should possess. In other cases, the third-party auditor assisted
    the board in building the selection criteria for the role in which I was awarded.
    And with one company, one of my final interviews was with the chairman of the
    technology committee of the board. We each flew to a central airport, met in the
    conference room of an airline'
  - '[PAGE 32]


    club, and spoke for three hours. While this level of involvement is extraordinary,
    it provided me with a preliminary close look into the security culture of the
    board, at the same time giving the committee chair a view into how I approached
    security. Additionally, it jump-started the relationship, which served valuable
    in my time at the company.


    There are several core competencies and traits that should be examined in CISO
    candidates. Above all else, trust in your new CISO is a key component for an effective
    relationship. It is understood that trust isn’t something that is easily drawn
    out in the interview process and takes time to build, but it is a key differentiator
    for what makes the CISO a successful one. Trust can be better measured by directors
    by engaging early and often with the candidate, and this could start with the
    interview process.


    The importance of business administration skills has been covered in the previous
    section but the criticality of these skills for a CISO to effectively perform
    in the role bear repeating. A CISO candidate should be able to discuss various
    business-related topics during the interview process that speak to the specific
    underpinnings of the financial posture for the company that they are pursuing.
    Conveying a deep understanding of the corporate make-up, leadership, top revenue-generating
    business units, as well any challenges the business is facing, is a good signal
    for you that the candidate can understand the business aspects of the company.
    Moreover, candidates who also intertwine that knowledge specific to your business
    with cyber security implications could be a very viable prospect. They won’t get
    it one hundred percent accurate by leveraging solely external data, but the thought
    process used by the candidate is a great indicator of potential success.


    You obviously desire that the potential CISO has expertise in cyber security,
    but not at the expense of the business. A truly secure computer is one that is
    turned off and unplugged. But in order to conduct business, solid risk management
    choices must be made in securing the infrastructure. Some historic CISO mindsets
    of consistently saying “no” to business initiatives have been replaced with approaches
    that deliver business goals, but in a customized and secure way. Ensuring that
    this new wave of thinking resides in your candidates is critically important,
    and the best way to draw this out is through examples and scenarios.


    Provide your applicant with business scenarios that highlight their views on risk
    management. These scenarios should be based on issues needing complex decisions
    without overtly correct or incorrect choices. An example of a poor scenario would
    be for the candidate to describe their views between a company patching system
    vulnerabilities, or not interfering with the business and allowing the systems
    to go unpatched for an extended period of time as long as they are documented.
    Instead, choose scenarios in which both choices may appear less than desirable.
    The key thing to look for in the candidates’ answers goes beyond discussing high
    severity risks and their potential impact to the business. A well-qualified, business-oriented'
