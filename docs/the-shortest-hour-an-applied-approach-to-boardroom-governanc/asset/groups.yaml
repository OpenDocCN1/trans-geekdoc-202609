  mdcn: "\n## 最短一小时\n\n公司董事会的独立董事理解网络安全作为商业问题的重要性。监管要求不断提高、安全漏洞的冲击，以及企业网络边界被更多第三方合作关系所取代，都促使网络安全上升到企业风险的首位。然而，许多董事在一年中只收到几份简短的网络安全更新。此外，许多董事将职业生涯奉献给了其他重要的业务领域，可能无法完全掌握网络安全的技术概念。\n\
    \n挑战在于，许多关于董事会网络安全治理的出版物要么从过于宏观的层面讨论这一主题，从而删除了网络安全细节的重要背景——要么用难以理解的技术语言过度深入地覆盖主题。这些资源往往提供一系列安全问题供董事向管理团队提问，但并未提供这些问题的答案，因此无法进行可操作的监督。我原本想要的，也可能正是你阅读本书摘要的原因，是一份既能提供应问的问题，又能以叙述性、易于理解的风格提供答案的资源。\n\
    \n李·帕里什（Lee Parrish）是一位屡获殊荣的首席信息安全官，拥有与多家财富500强董事会合作二十多年的经验。他提供了一个充满实例的愿景，以改善董事会中的网络安全治理。此外，李破解了技术术语，以提高读者的网络安全素养——不是让你成为网络安全专家，而是帮助你能够直接提问、理解所提供的答案、质疑战略，并就重要的网络安全决策提供建议。\n\
    \n立即购买您的《最短一小时：网络安全董事会治理的应用方法》副本，开始您实现更有效网络安全监督的旅程。\n\n想了解更多？请访问 www.novelsecurity.com\n\
    \n《安全、审计与领导力系列》出版面向安全与审计高管以及业务领导者的前沿书籍，涵盖关键主题，包括领导力、网络安全、安全领导力、隐私、战略风险管理、IT审计、审计管理与领导力。\n\
    \n- **《从收发室到董事会》** — 治理、风险、合规与审计领导者的独特见解 — *布鲁斯·特纳*\n- **《运营审计》** — 变化世界中的原则与技术（第二版）\
    \ — *赫尔南·默多克*\n- **CyRM℠** — 掌握网络安全的管理 — *大卫·X·马丁*\n- **《CISO为何失败》（第二版）** — *巴拉克·恩格尔*\n\
    - **《乘风破浪》** — 将项目管理科学应用于应急管理领域 — *安德鲁·博亚尔斯基*\n- **《最短一小时》** — 网络安全董事会治理的应用方法\
    \ — *李·帕里什*\n\n有关本系列的更多信息，请访问：https://www.routledge.com/Internal-Audit-and-IT-Audit/book-series/CRCINTAUDITA\n\
