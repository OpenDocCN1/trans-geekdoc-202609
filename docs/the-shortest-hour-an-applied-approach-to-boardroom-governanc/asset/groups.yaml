    understanding of the domain *is* required to perform oversight. As an analogy,
    a particular director on a board may not have deep, subject matter expertise in
    finance or served as a CFO for a corporation – instead, perhaps their expertise
    lies in manufacturing or supply chain operations. However, this particular director
    will indeed have a general understanding of the finance domain and can read/understand
    a balance sheet and all the associated financial measurements in order to contribute
    to the fiscal conversations and consultation to the management team. For those
    special oversight responsibilities that rely on deep financial expertise, a board
    will most likely have a director in their ranks with this type of advanced financial
    expertise; one who may have served as a CFO for a global corporation.


    Some may argue that all board members understand broad-based risk management:
    a key attribute to a director’s duties to be sure, and cyber security would simply
    follow these same risk management processes. But a key contributor in making risk-based
    decisions is analyzing the specifics of the identified risks, the likelihood of
    those risks, as well as the specific countermeasures in place to determine the
    potential impacts of a risk. If we agree on my very general definition of risk
    management, how can an effective risk-based decision be made if the specific risks,
    or specific countermeasures, are not completely understood? I am not inferring
    an understanding at the deepest level but a broad knowledge of cyber security:
    the threats and the basic risk mitigating measures that can be used.


    Following the finance example, at least one board member could similarly have
    deep expertise in cyber security to help translate the details for other directors,
    who have broad-based risk management skills and a general understanding of cyber
    security. By understanding the specific cyber security context in the general
    risk management process, the risks and countermeasures can be better understood,
    resulting in better risk-based decisions. Because cyber security is so important
    for corporate success, I would advocate for increased cyber fluency across all
    of the board members, not just the identified member with cyber security expertise.
    Certainly I am not suggesting that each board member be an expert in cybersecurity,
    however having the knowledge to question, understand the answers from the CISO,
    and the ability to advise based on this assessment, across the entire board, would
    be a key differentiator in corporate success. With your investment of time in
    reading this book, you are doing just that. The expert director could dive into
    more of the details, but with every director proficient in the basic, broad themes
    of cyber, it would allow them to discuss, challenge one another, and agree on
    specific cyber-related items.'
