    ## APPLICATION SECURITY


    Whether a company develops its own code from a blend of frameworks, purchases
    commercial off the shelf (COTS) software, or customizes COTS software, ensuring
    that the code is as secure as possible is critically important. If not addressed
    (preferably during the build and customization phases of development), software
    and coding vulnerabilities could lead to major problems for a corporation. The
    primary method for securing software lies in the software development lifecycle
    (SDLC) which aims to develop a structured process, through phases, to produce
    secure software for use in production. Security is very much a part of this important
    SDLC process to protect against insecure design and coding mistakes.


    Providing security training to software developers serves as a great incubator
    for a successful development program. Discussing the many different coding mistakes
    that may lead to software vulnerabilities helps to demonstrate for the developer
    their role in secure software coding practices. It may prove effective to “gamify”
    the training to make it exciting for the participant developers and introduce
    competition in completing the training, so each developer strives to win over
    their peers.


    You may hear your CISO mention something called a bug bounty program. Simply put,
    these are programs in which a company (usually those developing software) provides
    incentives for reporting software bugs (vulnerabilities) to the company. These
    incentives can be some form of recognition or even compensation of varying amounts.


    Testing the software code can help identify issues and there are many security
    vendors that provide products and services to conduct this type of testing. Two
    common tests are static testing and dynamic testing. A static code review is done
    before and during the development of the software, evaluating the code and issuing
    a report. You may want to inquire about the impact for speed to market the software
    developed (or customized) by the team because of security testing. It may be the
    case that the overall static testing program takes quite a bit of time to perform
    and when reports are generated, several false positives may be presented. After
    researching the false positives and correcting the true vulnerabilities, typically
    another scan is done to verify coding fixes. All of this takes time and could
    impact how quickly the company can introduce new capabilities. Exploring how the
    application security program addresses these potential delays while maintaining
    the effective security of the software provides informative discussion topics
    for you and the CISO.


    Dynamic testing involves testing when the code is executed and checks for the
    functionality, security, and performance of the software. This testing is done
    after the development phase and as a result, any fixes will most likely be more
    expensive to correct than fixes done during development.


    All these components work together to provide a more secure application development
    program that aims to identify vulnerabilities early in the development stage.
    Through wrapping security into the overall SDLC process, enhancing developer training,
    and providing efficient testing for vulnerabilities, the application security
    program can be a beneficial addition to the cyber security program.


