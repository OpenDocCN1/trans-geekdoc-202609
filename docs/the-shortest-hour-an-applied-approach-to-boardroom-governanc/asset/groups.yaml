  - '[PAGE 33]


    CISO candidate will also examine the *likelihood* of a risk being realized in
    all of their decisions. In business strategy, it is usually the likelihood of
    a risk that will tilt a decision to move forward with a plan or to shelve it.


    Emotional intelligence is an important attribute for all executives, and when
    it comes to CISOs, it could prove vital for the leader who is the one between
    your company and the adversaries. One of the most important attributes the role
    demands is remaining calm across multiple scenarios. The ability to identify and
    regulate our emotions (and those of others) as we navigate through the day as
    a security executive, whatever happiness or challenge it may bring, helps the
    CISO to be optimally effective. When a CISO is calm and assured, they can better
    identify with the feelings of others and make more empathetic decisions. Their
    ability to understand the different needs of the stakeholders, and those of the
    team, will help the CISO to consider all angles of an issue, which leads to more
    impactful decisions. The CISO can then make solid choices without allowing personal
    needs or emotions to cloud the decision.


    During a response to an incident, you need to know that the CISO is stable, calm,
    and focused on the response. A CISO who is excited and emotional can transfer
    these traits to their team. I’ve heard it called “having a steady heart rate”.
    Whatever description is chosen, a CISO who remains calm during the storm instills
    confidence in the responders that their leader is focused, and everything will
    ultimately be okay.


    Like the team, the adversary is closely watching, but their intent is to look
    for clues on the response. Does the CISO perform knee jerk, reactive tasks? If
    so, it may tip their hand to the adversary who will inevitably fold up tents and
    move somewhere else in the network, adding delays to the response. It is much
    better for the security executive to follow normal processes while they work up
    a response that is calm and measured.


    Whether it be times of great excitement and exhilaration, or intense frustration,
    the true security leader will work to identify and control their emotions to be
    maximally effective and to convey confidence to their team. You should seek out
    methods to understand and gauge the emotional intelligence of your CISO candidates.


    While there are many desired qualifications for your next CISO, the last one I
    will highlight is communication. A candidate who can translate complex technologies
    and security jargon into easy-to-understand concepts that aid in effective business
    decisions is no longer a nice to have trait; it is the baseline. We all have varying
    levels of understanding on different topics and cyber security is no different.
    Your search should begin and end with CISO candidates who can advise the board
    succinctly and effectively, no matter the board’s cyber fluency.


    My undergraduate degree is in philosophy with an interest in ethics. One of the
    domains in that course of study was communicative ethics, which goes beyond obvious
    things like truth telling and maintaining'
