  mdcn: '

    无论董事会的形式如何，CISO 都应在所有汇报中融入网络安全态势的积极方面，以及任何覆盖范围的负面缺口。听到贵公司在网络安全方面取得的积极进展总是好事，但更重要的是，你应该理解安全高管的关切，以便讨论补救计划。这似乎是理所当然的，但建立一套流程来引出这些关切，可以减轻未来的误解。为了实现这一点，我曾让委员会主席和其他董事正式问我：“你是否知晓网络计划中任何重大缺口？你目前是否拥有公司网络安全计划所需的全部资源？”这种正式性有助于促进
    CISO 与董事之间的开放对话，并将内容记录在委员会/董事会会议纪要中。


    CISO 与董事会之间存在许多典型的互动类型，这些互动可能包括以下内容。


    ## 全体董事会汇报


    召集全体董事会成员参加网络简报，是提供一般行业新闻、公司面临的风险可能性以及公司可能如何应对这些风险的好方法。许多 CISO 在安全行业拥有广泛的人脉，你应该考虑利用这些人脉来增强全体董事会的汇报。或许，联邦调查局（FBI）当地办事处、特勤局的简报，或者一家顶级网络安全公司的
    CEO 的演讲，都能提升整个董事会的网络安全意识？


    取决于委员会的日程安排，在我的职业生涯中，我经常看到董事会的非审计委员会成员出于对该话题的兴趣，列席我的委员会网络安全简报。将受众扩展到全体董事会，让他们听取一般性网络主题领域的内容，对团队所有成员都相当有价值。


    ## 定期网络安全简报


    无论董事会选择何种委员会结构或网络更新频率，定期举行的网络安全简报都有助于提升对公司安全举措的认识。重要的是要记住，每次简报都不是一次独立的会议，也不是仅仅提供计划的一般概述和某些指标。相反，每次简报只是一本更大书籍中的一个章节，这些章节共同讲述了公司安全态势的整体故事，以及其应对威胁能力的逐步提升。


    这种“分期式”简报风格非常适合正在构建或大幅增强网络安全计划的公司。CISO 首先汇报当前安全计划的评估情况，然后重点介绍战略信息安全计划（及其所有组成部分），以及该计划将如何提供风险缓解服务。在随后的简报中，CISO
    可以讨论他们在执行战略计划方面的进展。最终，每位委员会成员都将全面了解公司安全计划曾经所处的位置、战略执行中的增量成功，以及最终了解迄今为止的安全投资领域如何帮助降低（而非消除）已识别的初始风险。所有这些都与公司的具体需求交织在一起。


    这种关于整体战略进展的简报不应成为常年性的演示。安全计划的大规模转型、构建新的安全计划，或听取新任 CISO 介绍其战略计划，其频率都应受到限制。如果你不断收到关于安全组织重大计划性变更的简报，这可能是一个迹象，表明公司更换
    CISO 过于频繁，或者先前的安全战略可能不够全面。当然，战略本质上是动态的，必须适应不断变化的业务模式以及不断演变的威胁。不过，我更多指的是那些专注于在几乎不存在安全计划的地方构建安全计划的大型战略，或者通常是在公司任命新任
    CISO 之后出台的新战略计划。在这些情况下，我建议可能存在一个潜在因素，导致频繁的战略计划简报，而这个因素是你应该调查的。


    一旦评估和初步战略计划简报完成，并过渡到更稳定的常态化简报，委员会就应听取安全主题，这些主题能够基于企业战略调整、对公司的潜在影响、安全行业更新以及有参考价值的指标，提供对当前和即将面临风险的扎实理解。每个董事会都需要独特的指标，以帮助他们理解网络安全，以及更重要的是它与公司的关系。因为每个董事会都非常独特，我喜欢向我所汇报的董事询问他们希望看到哪些具体指标。我会用我认为需要传达的其他安全指标来补充这些请求。这种“自上而下、自下而上”的指标策略有助于为董事会成员提供有洞察力的衡量标准。


    我曾因“向董事会成员询问他们希望在更新中看到哪些指标”这一想法而受到质疑。不止一两位业内同行以及一些领导者告诉我，董事会不具备足够的安全知识来理解应该要求哪些指标；指标应该由了解该领域的
    CISO 来提供。我不同意这些质疑，因为指标用于做出决策并确保适当的监督。还有谁比实际进行决策和监督的人更清楚哪些数据有助于他们做出这些决策和监督呢？我没有设计和制造汽车的知识，但我能确定什么对我重要，以及我在购买时会关注什么。


    通常情况下，当新董事当选进入董事会时，我会被要求向他们介绍他们即将开始履职的公司的安全计划。在我的职业生涯中，有很多次我会飞到某个地方与新董事见面，进行这种一对一的简报。涵盖诸如公司安全态势、存在的任何残余风险、团队安全资源的适当性以及公司面临的主要威胁等领域，对新董事来说都是有益的。此外，这也有助于迅速建立
    CISO 与最新董事会成员之间的关系。


    委员会主席与 CISO 之间的互动应体现这一重要关系的关键性。你已经读到我之前与技术委员会主席的面试经历，以及那次互动对双方的好处，但对话远不止那一次讨论。我们会在委员会会议之前进行一对一会面，讨论我将要汇报的内容，并更详细地说明内容的意图或背景。这非常有帮助，因为它为主席梳理了即将召开的会议，也为我提供了关于在委员会简报中可扩展领域的宝贵反馈。无论采取何种形式，董事们都应利用
    CISO 的知识，以非正式的一对一方式深入探讨网络安全的更多细节。


    ## 事件响应简报


    几年前，我不得不在一个周六早晨给当时的公司 CEO 打一个非常艰难的电话。我通知他，我们公司正发生一次重大数据泄露事件，我们已启动事件响应团队（并辅以一家网络安全公司的第三方支持）来补救这个问题。在我们交谈时，我向他高层级地汇报了发生的事情、我们当前的响应活动，以及我需要哪些资源来协助响应。他批准了资源，感谢我的来电，并要求我飞往他那里，参加下周三的一次特别全体董事会会议，向他们通报该事件的最新情况。


    适当的事件响应需要董事会的积极参与，以及 CISO 提供信息丰富且直接的沟通。向董事会进行的事件响应简报应仅限于大规模攻击，包括网络中的对抗性入侵、可能造成重大合规或品牌影响的事件，或涉及业务严重中断的事件。董事会很容易被大量基础性事件的更新所淹没。网络钓鱼攻击猖獗，通常情况下，安全团队可以快速响应、分类并修复它们。也许这类攻击不应成为董事会参与的一部分，而只是在定期简报中作为更新内容即可。


