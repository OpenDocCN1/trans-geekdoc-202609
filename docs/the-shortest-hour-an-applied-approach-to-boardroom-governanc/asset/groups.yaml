  mdcn: "\n首席执行官（CEO）、总法律顾问、首席财务官（CFO）、首席运营官（COO），或如前所述的首席信息官（CIO）。关于该职位应向谁汇报的直接答案是“视情况而定。”对某些公司有效的做法可能并不适用于其他公司。传统上，该职位向CIO汇报，但近年来我们看到许多CISO从IT部门脱离，部分原因是他们认为与负责建立开放且支持业务的技术、同时也领导保护这些技术职能的负责人存在利益冲突。可能存在这样一种情况：CIO的激励来自于为公司创造技术能力，因此他们会优先资助此类技术，而不是增加安全预算，因为安全预算不像生产力投资那样具有立即可见的价值。此外，网络安全领域在过去十年中显著扩大；CIO在保持其核心能力以理解和交付众多业务技术解决方案的同时，要跟上安全领域的发展变得越来越困难。\n\
    \n业内一些人说，将CISO设为直接向CEO汇报，表明公司对信息安全项目的投入和支持。通过将安全与企业最高领导层对齐，向员工传递的信息是：信息安全对公司至关重要；需要CEO的直接监督才能与其进展保持一致。\n\
    \n无论业内当前关于汇报结构的争论如何，决定在组织架构中把CISO放在何处的简单驱动因素，仅围绕*与领导层的接触渠道*。如果CISO能够就基于风险的关切接触高级领导，并能定期向你（董事）汇报，那么汇报结构可能就无关紧要了。\n\
    \n在我的职业生涯中，我曾向CFO、CIO、总法律顾问、CEO以及共享服务执行副总裁汇报。没有任何一个案例表明，安全项目因为我的汇报结构而更加有效。让项目成功的是我能够在无偏见、无过滤的论坛上传达重要的安全事务，供企业最高领导层做出基于风险的决策。然而，有必要确保CISO在公司内部组织上地位稳固，使其被视为领导其他重要职能的其他高级管理层的同侪。\n\
    \n由于网络安全的重要性及其对公司的影响，CISO的角色应提升至公司高级管理层的级别，而这要求CISO具备深厚的业务专长才能在该职位上表现出色。\n\n要了解CISO角色有时是如何被看待的，一个有趣的基准是浏览公司或招聘机构发布的CISO招聘信息（你可以自己上网查看）。以下是我在过去一年中发现的几个CISO职位的实际招聘要求：\n\
    \n-   具备以下方面的扎实实践和动手知识：\n    -   数据包分析工具，如 tcpdump、Wireshark 和 ngrep\n    -  \
    \ 数据库结构和查询\n    -   Cisco 或 Palo Alto 防火墙/IPS 管理\n-   精通 UNIX、Linux、Windows 操作系统\n\
    -   具备使用计算机取证调查工具收集、分析和保存电子证据的实践经验。\n-   对安全产品（本地部署和云端）有工作知识并能实际应用，包括防火墙、漏洞检测、网络设备、终端保护、应用测试等。\n\
    -   网络安全架构开发\n-   拥有软件开发/编程学位\n\n诸如此类的CISO要求几乎无助于将该角色提升为企业的同级高管，反而固化了长期以来的趋势，即有效的领导者需要具备各项措施、战略安全规划*以及*所有上述业务要求。其中一些技能，例如事件响应或技术专长，在需要于特殊情况下加以利用之前都处于休眠状态。但核心的业务和领导能力始终显露在外，每天都在使用。\n\
    \n在网络安全行业至少十年里，我读到或听到过这样的说法：在与公司董事会讨论时，CISO需要“在桌边有一席之地”。这是一个常年讨论的话题，迫切需要实质内容，而非仅仅是一句口号。这场辩论所缺乏的是CISO*如何*获得这一席位的具体例子。许多人会说这一情况已积极发展，许多CISO现在每年多次向董事会汇报，因此已经取得了进展——这对我们的角色和行业来说确实是一个积极趋势。但别搞错，虽然有许多公司主动邀请CISO进入董事会会议室，但很多公司并非因为所有CISO在与网络安全的业务层面对话方面发生了某种变革性演进才这样做。实际上，只是因为监管要求或行业因入侵事件层出不穷而产生的压力，迫使我们出现在那里。如果没有这些迫使董事会层面讨论网络安全的外部压力，许多CISO可能仍然与董事会会议室无缘。现在（早已）是时候让CISO主动改变我们的命运了：少一点关于该角色*为何*应在桌边占有一席之地的争论，多一点展示我们*如何*能够被纳入董事会会议室的核心能力，而不是靠监管或压力才得以列席。\n\
    \n将网络安全更广泛地纳入业务的压力带来的一个积极成果，就是对该主题本身的认知提升。在我的职业生涯中，我从未见过如此多的人对了解我们行业以及影响我们所有人的威胁抱有如此大的兴趣或热情。要利用这一机会，需要的不仅仅是网络安全知识；如果我们只需复述常见风险和潜在对策，这将是一个多么简单的角色。高效CISO的与众不同之处在于，他们能够理解这些常见风险和潜在对策，并将其融入该CISO所服务的业务环境。要做到这一点，需要深入了解其所在的业务，而要实现这种理解，则需要全面掌握所有业务领域的知识。而整个过程需要时间。在组织的一年任期内几乎不可能做到这一点，不幸的是，许多CISO的任期并不像其他高管那样长。\n\
    \n许多因素导致了CISO角色中一些较高的离职率。这是一个高压职位，高管必须随时准备在接到通知的瞬间采取行动，这意味着几乎没有休息时间。在他们的工作中，\n"
