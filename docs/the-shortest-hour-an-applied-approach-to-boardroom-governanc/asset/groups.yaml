    in the corporate infrastructure, the responses are checked to ensure they remain
    accurate.


    Value can also be found in storing reference architectures. These architectures
    provide a baseline approach to implementing a system and may include diagrams,
    process flowcharts, and other types of reference materials. Lastly, industry documentation
    such as common frameworks is a valuable addition to the operational model.

