    ## 第5章：信息安全评估


    任何战略之旅的重要一环，是了解组织当前所处的位置；而获取这一认知的最佳方法，是在制定战略计划之前进行一次初步评估。评估通过凸显组织当前的安全态势，为后续工作提供起点，并有助于对战略计划中即将推出的各项举措进行优先级排序。


    作为董事，你可能不会亲自参与执行评估；相反，你会更关注评估的结果。本章重点介绍安全评估的核心组成部分，以便你能更好地理解评估是如何完成的。这将使你能够针对结果提出具有探究性的问题。结果的生成方式往往与最终报告本身同等重要。


    CISO 可以借助许多资源来评估公司的安全能力。虽然以下列表并非详尽无遗，但其中一些在我的职业生涯中被证明很有帮助，同时还有一些建议供董事询问其 CISO
    所使用的评估流程。


    ### CISO 评估


    你已经花费时间明确了 CISO 岗位的任职要求、面试了候选人，并投入时间开始与新的安全高管建立关系。如果你对 CISO 岗位的任职资格要求并未向那些此前未曾担任过该职位的人开放，那么你的新任
    CISO 将在评估安全项目方面拥有经验。利用他们多年的经验是有益的，因为他们知道应该关注什么，特别是那些能够构成有效安全项目的要素。当他们审视不同安全学科的有效性时，也会将自己对新公司的了解融入其中。为了弥补他们在任职初期对新公司缺乏深入了解的不足，与现有员工的面谈是衡量安全控制有效性的一个极佳途径。


    基于面谈的评估，始于 CISO 制定一份非常具体的问题清单，这些问题针对的是信息安全领域的各个不同学科。为了补充我在网络安全方面的专业知识，并确保我的系列问题具有行业相关性而非凭空产生，我会参考安全行业中常用的框架。例如：美国国家标准与技术研究院（NIST）800–53《信息系统和组织的安全与隐私控制》；国际标准化组织（ISO）27000，这是信息安全领域重要的国际标准；以及互联网安全中心（CIS）关键安全控制。这些为有效的安全项目提供了基础指南，我会经常参考它们，尤其是在评估阶段。


    CISO 会与内部信息安全团队、IT 部门的员工，以及来自各业务线和职能领域（包括其领导层）的代表安排会议。在保持面谈对话式氛围的同时，我会逐一梳理针对某一特定学科的问题，例如资产管理、入侵防御、应用安全以及其他众多领域。我发现，为了在评估中获得最高的准确性，我会在评估期间就同一个问题多次提问，并询问不同的人，尤其在初始回答存在模糊之处时更是如此。


    现有员工是评估过程中的丰富信息来源；毕竟，他们拥有对环境的歷史知识。不过，用技术审查来补充基于面谈的评估也很有帮助。这些技术审查有助于验证面谈答案，并更全面地展现公司的安全态势。CISO
    会获取安全团队所使用的多个安全平台的访问凭据，并对它们的配置方式、近期警报以及技术部署的整体健康状况进行审查。除了这些技术检查外，一些第三方还会以失陷评估、渗透测试和其他服务的形式开展技术评估。这些审查不仅仅依赖人工回答，还会审视安全项目的技术层面，这对于初始评估而言可能极具价值。


    ### 内部报告


    新任 CISO 可以利用过去几年内部来源所开展的安全评估，为其初始评估提供额外的清晰度。内部审计部门和外部审计师出具的具体报告，可以就安全项目某些领域可能存在的差距提供有价值的细节，因为这些报告比外部顾问可能提供的材料更为详细。然而，这些报告通常审查范围有限，例如数据防泄漏项目、资产管理状况等，可能无法覆盖整个安全项目。无论如何，它们都是一个数据点，有助于使
    CISO 的评估更加全面。


    ### 咨询评估


    来自顾问的通用安全评估可以借助通用框架，基于常见的能力成熟度模型集成（CMMI）模型给出成熟度评级，从而对安全项目进行快速审查。通常情况下，顾问可能会使用其公司自行开发的评估模型，以提供更多关于客户风险态势的细节。其中有些模型可能更多是营销导向，而非真正的风险衡量。例如，衡量并评分攻击者入侵客户网络的能力（和意愿）。这类攻击性信息或许适用于那些归属可以被确定的组织严密的黑客组织。然而，如前所述，一些威胁行为者并不属于特定组织，或者是单独行动。要确定那个单独行动者的黑客能力，以及其对企业特定环境造成破坏的具体意愿，似乎超出了第三方咨询机构的能力范围。这类评估可能不会为
    CISO 的评估增加价值。


    第三方安全项目评估通常主要基于面谈，并且可能仅涵盖三到四周的短暂服务周期。因此，其发现通常非常宽泛；毕竟，他们的视角是外部视角。这些评估的成本同样需要考虑，客户可能花费高昂代价仅仅是为了了解差距所在，却并未获得针对这些差距的修复方案。当然，顾问团队会推销他们的能力（以另行收费的方式）来帮助客户修复这些不足之处。


    在某些情况下，合同或监管要求可能规定安全审查必须由外部方执行。最具价值的咨询评估类型，是那些采用深度技术测试服务而非泛泛面谈式调查的评估。其结果对管理层和
    CISO 双方都有益处，能为他们每个人提供技术性的、不带偏见的、基于事实的结果，这些结果可以（部分地）用于制定战略计划。


    对于作为董事的你而言，要了解公司当前的风险态势，关键的做法是询问 CISO 评估是如何进行的：是采用了基于面谈的流程、技术审查，还是两者的结合？虽然没有必要完全掌握评估的每个组成部分，但通过理解得出评估结果所用方法论，你就能很好地理解其结果有多可靠。


    ## 第6章：战略计划


    为公司制定网络安全战略计划，需要与业务目标紧密整合，并依赖于诸多因素，这使得几乎不可能将一家企业的安全战略照搬到另一家组织。每家公司都有不同的风险概况、当前安全态势和财务状况，这些都会影响战略的实施时间表。


    虽然许多管理团队专注于三年战略计划，但另一些公司可能会因为面临特定风险，或存在无法等待渐进改善的关键差距，而加快其网络战略的推进速度。可用于资助安全战略的自由经营现金流因公司而异，这更要求安全投资决策以风险为基础。无论一家公司选择以何种时间表来部署其战略计划，你都必须记住：网络风险的变化速度非常快，而在信息安全领域，三年可能相当于一辈子。


    一个好的网络战略，应当优先处理公司面临的风险，而不是试图迅速解决安全领域中的每一个需求。你的 CISO 应当交付一份计划，将业务需求（不仅仅是网络安全需求）纳入一个现实的时间表，从而实现有效的风险缓解——既不是一下子全部完成，也不至于拖上好几年。正是在这一刻，你在寻找和遴选具有强大业务专长（且与其他
    C 级高管水平相当）的 CISO 过程中所展现出的所有审慎调查，开始获得回报。


    此前曾提到，一次好的简报应当以有助于管理层更容易做出决策的方式呈现。为实现这一目标，网络安全战略至少应包含三个不同的类别：人员、流程和技术。虽然它们共同构成更大网络安全战略的一部分，但可以分别与管理团队中负责相应领域的高管进行讨论，以获取他们的见解。


