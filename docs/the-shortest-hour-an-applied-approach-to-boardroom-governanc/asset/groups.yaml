    Saturday morning they had a maintenance window of a few hours when they did preventative
    maintenance on equipment. I asked the employee why can’t we inquire about patching
    the system during this maintenance time, so we don’t impact production? As a result,
    the security of the system was addressed, and production was not impacted. Without
    this local knowledge of the business, uninformed decisions could perpetuate the
    longstanding myth that cyber security is an impediment to the business rather
    than what it truly can be: an enabler and protector of the business.


    While it is critical to take the needs of the business into account when enhancing
    processes, these initiatives cannot be done in a vacuum that is insulated from
    the outside world. Strategies and processes should also have an industry view
    to make them optimally effective and externally relevant. A good method for accomplishing
    this is with the use of the security frameworks that were previously mentioned.
    They can serve as an effective guide to establishing process controls by detailing
    several common domains of cyber security, as well as the specific controls (at
    varying levels).


    Frequently, companies will leverage industry research firms to garner more information
    on best practices to implement effective processes. Through research data, one-on-one
    discussions with analysts, or the use of peer security member forums, the CISO
    can compare their process improvement plans to other programs to better understand
    potential gaps in coverage.


    One of the best methods for attaining an external perspective is for the CISO
    to leverage their network of peers. On many occasions I have reached out to peer
    CISOs to learn insightful tips on a particular process, how they implemented it,
    lessons learned, as well as pitfalls to avoid. Since all security programs are
    vastly different from one another, this feedback serves merely as an insightful
    data point, something that usually requires some customization to fit the needs
    of my company’s security program. What is interesting is that the cyber industry
    is a tight, collaborative group and when garnering insights from peers, even from
    competitors to your company, all competition is stripped away for the shared mission
    of stopping adversaries.


    Many hackers are lazy, those that are not simply don’t want to unreasonably over-invest
    time and resources to break into a network unless that time is necessary to meet
    their objective. For many adversaries, they have an arsenal of techniques and
    malware at their disposal. In some cases, threat actors will build custom malware
    specific to a particular engagement. However, they don’t want to use their best
    weapons until they must. Instead, they look for the open doors and windows of
    a corporate network, perhaps an unpatched system with a vulnerability, or maybe
    sending a phishing email to an unsuspecting employee. Whatever the path of least
    resistance, they will use that vector to accomplish their mission.


    So, when it comes to building processes for your information security program,
    the CISO should start with the fundamentals first. It may be attractive to create
    next-generation security capabilities, but to do so'
