    We are unable to use these images directly for our experiments. Recall that the
    ILSVRC remains the de facto standard for image classification algorithms. To keep
    this challenge fair (and to ensure no cheats), the labels for the testing set
    are kept private.

    First, a person/team/organization trains their algorithm using the training and
    testing sets. Once they are satisfied with the results, predictions are made on
    the testing set. The predictions from the testing set are then automatically uploaded
    to the ImageNet evaluation server where they are compared to ground-truth labels.
    At no point do any of the competitors have access to the ground-truth labels.
    Some readers of this book may access the ImageNet evaluation server, I encourage
    you to explore this further and consider submitting your predictions. However,
    many others may have obtained ImageNet without directly registering for an account
    on the ImageNet website. Whether is very perfectly okay (if you provided the licensing
    agreements mentioned in Chapter 4), but you will not have access to the evaluation
    server. Since this is open and accessible to everyone, we ignore the test set
    and create our own testing set by sampling the training data, just as we did for
    the Tiny ImageNet challenges in Chapter 11 and Chapter 12 of the Practitioner
    Bundle.


    # 5.2 ImageNet "train" Directory


    The train directory of ImageNet consists of a set of sub-directories:


    ```

    $ ls -d Data/CLS-LOC/train/ | head -n 10

    total 60020

    drwxr-xr-x 2 adrian 69362 Sep 2014 n01440764

    drwxr-xr-x 2 adrian 69362 Sep 2014 n01443537

