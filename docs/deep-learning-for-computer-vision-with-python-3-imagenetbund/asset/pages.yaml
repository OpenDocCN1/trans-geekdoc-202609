  md: "# 12.4 Correcting Orientation\n\nTo demonstrate that our VGG16 feature extraction\
    \ + Logistic Regression classifier can sufficiently classify images, let's write\
    \ a Python script that applies the pipeline to input images. Open up a new file,\
    \ name it orient_images.py, and insert the following code:\n\n```\n# import the\
    \ necessary packages\nfrom keras.applications import VGG16\nfrom keras.applications\
    \ import imagenet_utils\nfrom keras.preprocessing.image import img_to_array\n\
    from keras.preprocessing.image import load_img\nfrom imutils import paths\nimport\
    \ numpy as np\nimport argparse\nimport pickle\nimport imutils\nimport h5py\nimport\
    \ cv2\n```\n\nWe are importing our required Python packages. Notice how we will\
    \ once again need VGG16 for feature extraction. We'll also load helper utilities\
    \ used to facilitate loading image from disk and preparing it for feature extraction\
    \ by VGG16.\nLet's parse our line arguments:\n\n```\n# construct the argument\
    \ parser and parse the arguments\nap = argparse.ArgumentParser()\nap.add_argument(\"\
    --hdf5\", \"--db5\", required=True,\n    help=\"HDF5 dataset\"\nap.add_argument(\"\
    --dataset\", \"--dataset\", required=True,\n    help=\"path to the input images\
    \ dataset\"\nap.add_argument(\"--model\", \"--model\", required=True,\n    help=\"\
    path to trained orientation model\")\nargs = vars(ap.parse_args())\n```\n\nOur\
    \ script requires three line arguments, each of which are detailed below:\n* --db5:\
    \ We supply the path to our HDF5 dataset of extracted features residing on disk.\
    \ We only need this dataset to extract the label names (i.e., angles) from the\
    \ HDF5 file, otherwise this switch would not be needed.\n* --dataset: This is\
    \ the path to our dataset of rotated images residing on disk.\n* --model: Here\
    \ we provide the path to our trained Logistic Regression classifier used to predict\
    \ the orientation of the images.\nLet's go ahead and load the label names from\
    \ our HDF5 dataset, followed by creating a set of ten images from our input that\
