- pgno: 42
  md: '# 5.2 Building the ImageNet Dataset


    As mentioned, after applying your Python utility scripts, we''ll be left with
    three files — train.list, val.list, test.list — these files will contain the (integer)
    class label IDs and the full path to the image filenames for each of our data
    splits (Lines 40-42). The im2rec tool will take these .list files as input and
    create .rec files which store the actual raw images + labels together, similar
    to building an HDF5 dataset in Chapter 10 of the Practitioner Bundle:


    ```

    # the path to the output training, validation, and testing

    # image records

    TRAIN_MAX_REC = path.sep.join([MX_OUTPUT, "rec/train.rec"])

    VAL_MAX_REC = path.sep.join([MX_OUTPUT, "rec/val.rec"])

    TEST_MAX_REC = path.sep.join([MX_OUTPUT, "rec/test.rec"]

    ```


    The difference here is that these record files are much compact (as we can store
    images as compressed JPEG or PNG files, instead of raw NumPy bitmaps). Furthermore,
    record files are to be used exclusively with the MXnet library, allowing us to
    obtain better performance than HDF5 datasets.


    > I have chosen to include the lists and rec subdirectories inside the image directory
    for organizational purposes — I would highly suggest you do the same. Provided
    that you directory structure, please take the time to create your lists and rec
    subdirectories. If you wait until we execute the build_dataset.py you might forget
    to create these subdirectories, resulting in the script error out. But don''t
    worry! You can simply go back the lists and rec and re-execute the script.


    When building our dataset, we''ll need to compute the DATASET_MEAN for each of
    the RGB channels in order to perform normalization:


    ```

    # the path to the dataset mean

    DATASET_MEAN = "output/imagenet_mean.json"

    ```


    This configuration stores the path to where the meshes will be serialized to disk
    in JSON format. Provided you run all experiments on the same machine (or at least
    machines with identical ImageNet directory structures), the only configurations
    you will have to edit from experiment-to-experiment are the ones below:


    ```

    # the batch size and number of devices used for training

    BATCH_SIZE = 128

    NUM_DEVICES = 8

    ```


    Line AlexNet defines the BATCH_SIZE in images which will be passed through the
    network during training. For AlexNet we use mini-batch sizes of 128. Depending
    on how deep a CNN is, we may want to decrease this batch size. The NUM_DEVICES
    attribute controls the number of devices (whether CPUs, GPUs, etc.) used when
    training a given neural network. You should configure this variable based on the
    number of devices you have available for training your machine.'
