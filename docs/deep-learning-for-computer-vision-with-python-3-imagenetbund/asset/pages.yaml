    where the asterisk represents the digits 0-4 (Figure 14.2).

    After downloading the dataset, you can unarchive it using the following command:


    ```

    $ -xvf aligned.tar.gz

    ```


    When organizing the dataset on my machine, I choose to use the following directory
    structure:


    ```

    --- adience

    | --- aligned

    | | --- folds

    | | --- lists

    | | --- rec

    ```


    The alience directory contains a number of subdirectories which contain the example
    faces we will use to train our age and gender CNNs. Strictly for organizational
    purposes, I also decided to store all fold_.txt files (which Levi et al. originally
    used for cross-validation) inside a directory named folds. I then created the
    lists directory to store my generated .1st files with a rec directory for the
    mxnet record databases.'
