  md: "# Chapter 14. Case Study: Age and Gender Prediction\n\nFrom here, open up the\
    \ file and insert the following code:\n\n```\n# import the necessary packages\n\
    import mxnet as mx\nclass MxAgeGenderNet:\n    @staticmethod\n    def build(classes):\n\
    \        # data input\n        data = mx.sym.Variable(\"data\")\n\n        # Block\
    \ #1: first CONV -> RELU -> POOL layer set\n        conv1_ = mx.sym.Convolution(data=data,\
    \ kernel=(7, 7),\n            pad=(4, 4), num_filter=96)\n        act1_ = mx.sym.Activation(data=conv1_,\
    \ act_type=\"relu\")\n        bn1_ = mx.sym.BatchNorm(data=act1_)\n        pool1_\
    \ = mx.sym.Pooling(data=bn1_, pool_type=\"max\"\n            kernel=(3, 3), stride=(2,\
    \ 2))\n        do1_ = mx.sym.Dropout(data=pool1_, p=0.25)\n```\n\nLine 6 defines\
    \ the build method of our network, in all previous architectures covered in this\
    \ book. The data variable on Line 8 serves as the input to our network. From here,\
    \ we use a series of CONV -> RELU -> POOL layers on Lines 11-17. Our first CONV\
    \ layer in the network uses 9 filters, 7x7 kernels and 4x4 stride to reduce the\
    \ spatial dimensions of the input 227 -> 227 images. An activation is applied\
    \ after the convolution, by a batch normalization, following the recommended usage\
    \ of batch normalization (Chapter 11, Starter Bundle).\n\nMax pooling is applied\
    \ on Lines 15 and 16 with a kernel size of 3x3 and stride of 2x2 to reduce spatial\
    \ dimensions. Dropout with a probability of 25% is used to help reduce overfitting.\
    \ Our second series of layers applies the same architecture, only adjusting the\
    \ CONV layer to learn 256, 5x5 filters.\n\n```\n# Block #2: second CONV -> RELU\
    \ -> POOL layer set\nconv2_ = mx.sym.Convolution(data=do1, kernel=(5, 5),\n  \
    \  pad=(2, 2), num_filter=256)\nact2_ = mx.sym.Activation(data=conv2_, act_type=\"\
    relu\")\nbn2_ = mx.sym.BatchNorm(data=act2_)\npool2_ = mx.sym.Pooling(data=bn2_,\
    \ pool_type=\"max\"\n    kernel=(3, 3), stride=(2, 2))\ndo2_ = mx.sym.Dropout(data=pool2_,\
