  md: '# 16.3 Training Your Faster R-CNN


    book. Again, this is my personal preference but you may have your own best practices
    that you are comfortable with.


    Inside the LISA dataset directory I would also suggest creating the following
    directories for your experiments and data:


    ```

    $ cd lisa

    $ mkdir records experiments

    $ mkdir experiments/training experiments/evaluation experiments/exported_model

    ```


    The records directory will store three files:


    +   1. training.record: The serialized dataset of images, bounding boxes, and
    labels used for training.

    2. testing.record: The images, bounding boxes, and labels used for testing.

    3. classes.pbxt: A plaintext file containing the names of the class labels and
    their unique IDs.


    We have an experiments subdirectory that will house any files used for our training
    experiments. Inside the experiments directory there are three additional subdirectories:
    training, evaluation, and exported_model.


    The training directory will store the special configuration file to instruct the
    TFOD API how to train our model, the pre-trained model we''ll be using for fine-tuning,
    and any model checkpoints created during training.


    While we are running we''ll be running an evaluation script by the TFOD API —
    any logs generated by the evaluation script will be stored in the evaluation directory,
    enabling us to use TensorFlow tools to graph and plot the process using the special
    TensorBoard utility.


    Finally, exported_model will store the final exported, frozen weight model after
    training has completed.


    When I first started using the TFOD API I was overwhelmed by the number of files,
    directories, and subdirectories in order to use it. Through trial and error I
    developed this proposed directory structure to balance ease of use with what the
    TFOD API requires.


    For your convenience, I have included a template of the directory structure in
    the code associated with this book. Feel free to modify this proposed structure
    as you see fit, but until you successfully train your first model, consider using
    my proposed method.


