    # 4.2.3 Using External Services


    Due to the vast size of ImageNet dataset and for it to be distributed globally,
    the dataset itself will be being distributed via BitTorrent. The website AcademicTorrents.com
    provides downloads for both the training set and validation set (http://pyimg.com/asdyi)
    [13]. A screenshot of the webpage can be found in Figure 4.4.


    The testing set is not included in the torrent as we will not have access to the
    ImageNet evaluation server. Please keep in mind that if you do external services
    like AcademicTorrents to download the ImageNet dataset, you are implicitly bound
    to the Terms of Access. You can use ImageNet for researching and developing your
    own models, but you cannot repackage ImageNet and use it for profit – this is
    strictly an academic dataset provided by a joint venture between Stanford and
    Princeton. Respect the community and do not violate the Terms of Access.


    # 4.2.4 ImageNet Development Kit


    While you are downloading the ImageNet dataset, you may need to download the ImageNet
    Development Kit (http://pyimg.com/wijj7) we will henceforth simply refer to as
    “DevKit”.

    I have placed a mirror to the DevKit here: http://pyimg.com/ounw6

    The DevKit contains:


    +   - An overview and statistics for the data.

    - Meta data for the categories (allowing us to build our image filename to class
    label mappings).

    - MATLAB routines for evaluation (which we will not need).'
