    as well.


    The fourth block of VGG16 also contains three CONV layers on top of each other,
    and this time the total number of filters doubles to 512:


    ```

    # Block #4: (CONV = RELU) * 3 => POOL

    conv4_1 = mx.Convolution(data=data3, kernel=(3, 3),

    pad=(1, 1), num_filter=512, name="conv4_1"

    act4_1 = mx.ReLU(data=conv4_1, act_type="prelu",

    name="act4_1"

    bn4_1 = mx.BatchNorm(data=act4_1, name="bn4_1"

    conv4_2 = mx.Convolution(data=bn4_1, kernel=(3, 3),

    pad=(1, 1), num_filter=512, name="conv4_2"

    act4_2 = mx.ReLU(data=conv4_2, act_type="prelu",

    name="act4_2"

    bn4_2 = mx.BatchNorm(data=act4_2, name="bn4_2"

    conv4_3 = mx.Convolution(data=bn4_2, kernel=(3, 3),

    pad=(1, 1), num_filter=512, name="conv4_3"

    act4_3 = mx.ReLU(data=conv4_3, act_type="prelu",

    name="act4_3"

    bn4_3 = mx.BatchNorm(data=act4_3, name="bn4_3"

    pool4 = mx.Pooling(data=bn4_3, pool_type="max",nkernel=(2, 2), stride=(2, 2),
    name="pool4"

    doo4 = mx.Dropout(data=pool4, p=0.25)

    ```


    Interestingly, the size of CONV layers in VGG does not increase the number of
    filters and remains at 512. If this number did not double, I am not sure, but
    maybe it would be as either:


    +   1. Jumping from 512 to 1024 filters introduces too many parameters to the
    network which caused VGG16 to overflow.


    +   2. Training the network using 1024 filters in the final CONV blocks was simply
    too computationally-expensive.


    Regrettably, the final of CONV layers in VGG16 also learn 512 filters, each 3
    x 3:


    ```

