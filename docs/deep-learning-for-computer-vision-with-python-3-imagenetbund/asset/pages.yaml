    mean_g=means["G"],

    mean_b=means["B"]

    ```


    The validation data iterator is identical to the training data iterator, with
    the exception that no data augmentation is applied (but we apply mean subtraction
    normalization).

    Next, let''s define our optimizer:


    ```

    # initialize the optimizer

    opt = mx.SGD(learning_rate=1e-2, momentum=0.9, wd=0.0005,

    rescale_grad=1.0 / batchSize)

    ```


    Just like the original Krizhevsky paper, we are training AlexNet using SGD with
    an initial learning rate of 1e-2, a momentum term of 0.9, and an L2 regularization
    ("weight decay") of 0.0005. The rescale_grad parameter in the SGD optimizer is
    very important as it scales the gradients by our batch size. Without this, our
    network may be unable to learn.

    The next code block handles the path to our output checkpoints directory, with
