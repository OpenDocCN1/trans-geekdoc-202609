- pgno: 261
  md: "# Chapter 15. Faster R-CNNs\n\nboxes — these bounding boxes and associated\
    \ class labels are considered the final predictions of our network.\n\n# 15.2.7\
    \ The Complete Training Pipeline\n\nWe have a choice to make when training the\
    \ entire Faster R-CNN pipeline. The first choice is to train the RPN module, obtain\
    \ satisfactory results, and then move on training the R-CNN module. The second\
    \ choice is to combine the four loss functions (two for the RPN module, two for\
    \ the R-CNN module) via weighted sum and jointly train all. Which one is better?\n\
    \nIn nearly all situations you'll find that jointly training the entire network\
    \ end-to-end by minimizing the sum of the four loss functions not takes less time\
    \ but also obtains higher accuracy as well.\n\nIn our next chapter we will learn\
    \ how to use the TensorFlow Object Detection API to train our Faster R-CNN networks.\
    \ If you're interested in more details on the Faster R-CNN pipeline, RPN and ROI\
    \ Pooling methods, along with additional notes on how we minimize the four loss\
    \ functions, be to refer to the original Faster R-CNN publication [46] as well\
    \ as the TryLabs article [54].\n\n# 15.3 Summary\n\nIn this chapter we started\
    \ by reviewing the Faster R-CNN architecture, along with its earlier variants,\
    \ by Girshick et al. [43, 46, 51]. The R-CNN architecture has gone under a few\
    \ iterations and improvements, but with the latest Faster R-CNN architecture we\
    \ are able to train end-to-end deep learning objects.\n\nThe architecture itself\
    \ includes four primary components. The first component is the base network (i.e.,\
    \ ResNet, VGGNet, etc.) which is used as a feature extractor.\n\nWe then have\
    \ the Region Proposal Network (RPN), which accepts a set of anchors, and outputs\
    \ proposals as where it thinks objects are in an image. It is important to note\
    \ that the RPN does not know what the object is in the image, just that a potential\
    \ object exists at a given location.\n\nRegion of Interest Pooling is used to\
    \ extract feature maps from each proposal region.\n\nFinally a Region-based Convolutional\
    \ Neural Network is used to (1) obtain the final class label predictions for the\
    \ proposal and (2) further refine the proposal locations for better accuracy.\n\
    \nGiven the large number of moving parts in the R-CNN architecture, it is \textit{not}\
    \ advisable to implement the entire architecture by hand. Instead, it is recommended\
    \ to use existing implementations such as the TensorFlow/Object Detection API\
    \ API [55] or Luminoth from TryLabs [56].\n\nIn our next chapter we will learn\
    \ how to train a Faster R-CNN using the TensorFlow Object Detection API to detect\
    \ and recognize common United States street/road signs."
  merge: -1
