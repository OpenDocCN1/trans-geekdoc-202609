    As our output demonstrates, VGG16 reached 71.42% rank-1 and 90.03% rank-5 accuracy,
    which is nearly identical to the original VGGNet paper by Simonyan and Zisserman.
    As a matter of completeness, I have included my learning rate schedule in the
    Table 7.1 for readers who wish to replicate these results.


    The biggest downside to VGG16 (besides how long it takes to train) is the resulting
    model size, weighing over 533MB. If you are building a deep learning application
    and intended to ship the model with your site, you would already have a package
    >500MB to distribute. Furthermore, all weight is updated at some point, requiring
    you to repack and re-distribute a large 500MB package, over a network connection.
    For high-speed broadband connections, this large model size might not be an issue.
    But for constrained devices such as embedded devices, cell phones, and even self-driving
    cars, this 500MB model size can be a huge burden. In these types of situations,
    we prefer well small size devices.


    Luckily, all remaining models we will discuss are substantially smaller than VGGNet.
    The weights for our highly accurate ResNet come in 102MB. GoogLeNet is even smaller
    at 28MB. And the super tiny, SqueezeNet model size is only 4.9MB, making ideal
    for any type of resource constrained deep learning.


    # 7.5 Summary


    In this chapter, we implemented the VGG16 architecture using the mxnet library
    and trained it from scratch Instead of using the tedious, time-consuming process
    of pre-training small versions of our network architecture and subsequently using
    these pre-trained weights as initializations to our deeper architecture, we skipped
    this step, relying on the work of He and Mishnik et al..


    +   1. We replaced standard ReLU Activations with PReLu.

    2. We swapped Glorot/Xavier initialization for MSRA/He et. initialization.


    This process enables us to replicate the work of Simonyan and Zisserman in a single
    experiment. When training VGG-like architectures from scratch, definitely using
    PReL and MSRA initialization whenever possible. In some network architectures
    you''t notice an impact on performance when using PReLU + MSRA, but with VGG,
    the impact is substantial.


    Overall, our version of VGG achieved 71.42% rank-1 and 90.03% rank-5 accuracy
    in the ImageNet test set, the highest accuracy we have seen so far in this bundle.
    Furthermore, the VGG architecture has demonstrated itself to be well suited for
    generalization tasks. In our next chapter, we''ll explore micro-architectures
    in more detail, including the GoogLeNet model, which will set the stage for more
    specialized micro-architectures including ResNet and SqueezeNet.'
