    Deep learning is not like other areas of programming where you write a function
    once and it works forever. Instead, there are many knobs and levers that need
    to be tweaked. Once you tweak the parameters, you will be rewarded with a well
    performing CNN, but until then, be patient, and **log your results**! Making note
    of what *does and does not work is is invaluable* – these notes will enable you
    to reflect on your experiments and identify new avenues to pursue.


    # 6.5 Summary


    In this chapter, we implemented the AlexNet architecture using the mxnet library
    and trained it on the ImageNet dataset. This chapter was quite lengthy due to
    the need of us to comprehensively review the AlexNet architecture, the training
    script, and the evaluation script. Now that we have defined our training and evaluation
    Python scripts, we will be able to *reuse them* in future experiments, making
    training and evaluation substantially easier – the main task will be for us to
    *implement the actual network architecture.


    The experiments we performed allowed us to identify two important takeaways:


    +   1. Placing batch normalization *after the activation* (rather than *before*)
    will lead to higher classification accuracy/lower loss in most situations.

    2. Swapping out ReLUs for ELUs can give you a small boost in classification accuracy.
    Overall, we were able to obtain **59.80%** rank-1 and **81.75%** rank-5 accuracy
    on ImageNet, outperforming the standard Caffe reference model used to benchmark
    AlexNet.'
