    I won''t inspect every single image in my dataset, I''ll sample a few hundred
    for each class and spend 10-20 minutes looking at these errors. This validation
    process is critical and should not be skipped under any circumstance.


    Do not fall into the false assumption that your code executes and completes everything
    is working. Instead, take a pessimistic approach: nothing is working fine until
    you take the time to double-check your work.


    If you wish to work with your own datasets and build the associated files, you
    should use this as a starting point and modify the class label/bounding box parsing.
    Try not to modify the actual construction of the TFAnnotation object as you can,
    ensuring your minimum penalty of inserting boxes.


    While you can partially extract information from the TensorFlow result files after
    they are built, it''s tedious, time consuming and your time and effort is better
    spent before the anchor object is added to reload.


    Again, I cannot stress the importance of checking your bounding boxes—take your
    time, avoid costly errors, both in time and finances spent training your network.


    If you are not obtaining satisfactory accuracy on a particular object detection
    dataset, none of your hyperparameter recommendations matter or have an impact
    if you do not take the time to validate your dataset before you move on training—please,
    for your sake, keep this in mind when working with your data output.


    # 16.3 Configuring the Faster-CNN


    Training our Faster-CNN on the LiDAR dataset is four step process:


    +   1. Download the pre-trained Faster-CNN so we can fine-tune the network

    2. Download the sample TFOD API configuration file and modify it to point to our
    record files

    3. Start the training process and monitor

    4. Export the frozen model graph after training is complete


