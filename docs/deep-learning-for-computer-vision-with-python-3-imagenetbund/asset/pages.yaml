- pgno: 196
  md: '# 13.3 Evaluating the Vehicle Classifier


    Keep in mind that fine-tuning (large) networks such as VGG16 on small datasets
    (such as Stanford Cars), overfitting is an inevitability. When applying data augmentation
    there are simply too many parameters in the network and too few training examples.
    Thus, it''s extremely important that you get the initial learning rate correct
    – this is even more critical than training a network from scratch. Take your time
    when fine-tuning networks and explore a variety of learning rates. This process
    will give you the best chance of attaining the highest accuracy during fine-tuning.


    # 13.3 Evaluating our Vehicle Classifier


    Now that we have successfully fine-tuned VGG16 on the Stanford Cars Dataset, let''s
    move on to evaluate the performance of our network on the testing set. To accomplish
    this, open the test_cars.py file and insert the following code:


    ```

    # import the necessary packages

    from config import car_config as config

    from pymnetsearch.utils import rank5_accuracy

    import mxnet as mx

    import argparse

    import pickle

    import os

    ```


    Lines 1-7 import our required Python packages. We''ll need our car_config (aliased
    to config) so we can access our dataset specific configuration and variables (Line
    2). We''ll import the rank5_accuracy function from **Line 3** so we can compute
    the rank-1 and rank-5 accuracy on the testing set. The mxnet library is imported
    on **Line 4** so we can have access to the mxnet Python bindings.

    Let''s parse the command line arguments:


    ```

    # construct the parse argument and parse the arguments

    parse = argparse.ArgumentParser()

    parse.add_argument("--checkpoints", required=True)

    parse.add_argument("-p", "--prefix", required=True)

    parse.add_argument("name of model prefix")

    parse.add_argument("-e", "--epoch", type=int, required=True)

    parse.add_argument("load", action="store_true")

    args = vars(parse.parse_args())

    ```


    Similar to evaluating ImageNet, our command line arguments are nearly identical.
    To start, we use --checkpoints, which is the path to the directory where VGG16
    weights are serialized during the fine-tuning process. The --prefix controls the
    name of the network, which in this case will be vgnet. The --epoch is an integer
    which controls the weight epoch of VGG16 we are going to load for evaluation.

    From there, we can load the label encoder as well as initialize the ImageRecordIter
    for the testing set:


    ```

    # load the label encoder

    le = pickle.loads(open(config.LABEL_ENCODER_PATH, "rb").read())

    ```'
