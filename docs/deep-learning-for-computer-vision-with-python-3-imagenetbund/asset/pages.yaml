  md: "# 58\nChapter 6. Training AlexNet on ImageNet\n\nOur CONV layer learns 384,\
    \ 3 x 3 filters with a padding size of (1,1) to ensure the input\nspatial dimensions\
    \ match the output spatial dimensions. An activation is applied immediately\f\
    ollowing the convolution, followed by batch normalization. Our second CONV layer\
    \ also learns 384,\n3 x 3 filters, followed by an activation and a batch normalization.\
    \ The final CONV in the layer\nreduces the number of filters to 256; however,\
    \ many maintains the file size of 3 x 3.\n\nThe output of the final CONV is passed\
    \ through an activation and a batch normalization. Dropout\nPOOL operation is\
    \ used again to reduce the spatial dimensions of the network. Dropout follows\n\
    \nFollowing along with Table 6.1 above, the next step in implementing AlexNet\
    \ is to define thentfc sets:\n\n```\n# Block 4: first set of FC => RELU layers\n\
    flatten = mx.syn.Flatten(data=do3)\nfc1 = mx.syn.Connected(data=flatten, num_hidden=4096)\n\
    act4_i = mx.syn.LeakyReLU(data=fc1, act_type=\"elu\")\nb4_i = mx.syn.BatchNorm(data=act4_i)\n\
    do4 = mx.syn.Dropout(data=bn4_i, p=0.5)\n```\n\n```\n# Block 5: second set of\
    \ FC => RELU layers\nfc2 = mx.syn.Connected(data=do4, num_hidden=4096)\nact5_i\
    \ = mx.syn.LeakyReLU(data=fc2, act_type=\"elu\")\nb5_i = mx.syn.BatchNorm(data=act5_i)\n\
    do5 = mx.syn.Dropout(data=bn5_i, p=0.5)\n```\n\nEach of the FC layers contains\
    \ 4096 units, each followed by an activation, batch\nnormalization, and more aggressive\
    \ dropout of 50%. It is common to use dropouts that we would like to de-\nthe\
    \ FC layers as is where the CNN connections are most dense and overfitting is\
    \ most likely to\noccur.\n\nFinally, we apply our softmax classifier using the\
    \ following number of classes:\n\n```\n# softmax classifier\nfc3 = mx.syn.Connected(data=do5,\
    \ num_hidden=classes)\nmodel = mx.syn.SoftmaxOutput(data=fc3, name=\"softmax\"\
    )\n# return the network architecture\nreturn model\n```\n\nAfter this implementation,\
    \ you might be reminded of how similar the mxnet library\nto is Keras. While not\
