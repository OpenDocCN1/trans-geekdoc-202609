  md: "# 212 Chapter 14. Case Study: Age and Gender Prediction\n\nboundaries, we first\
    \ need to extract the class label names from le and sort label names in ascending\
    \ order based on the lower boundary (Lines 56 and 57). Line 58 defines the oneOff\
    \ dictionary we will use to quickly evaluate one-off accuracy.\n\nNext, we need\
    \ to loop over the index and name of the sorted class labels\n\n```\n# loop over\
    \ the index and name of the (sorted) class labels\nfor (i, name) in enumerate(classes):\n\
    \    # determine the index of the *current+ class label name\n    # in the *label\
    \ encoder (unordered) list, then\n    # initialize the index of the previous and\
    \ next age\n    # groups adjacent to the current label\n    current = np.where(le.classes_\
    \ == name)[0][0]\n    prev = -1\n    next = -1\n    # check to see if we compute\
    \ previous adjacent\n    # age group\n    if i > 0:\n        prev = np.where(le.classes_\
    \ == classes[i - 1])[0][0]\n    # check to see if we compute the next adjacent\n\
    \    # age group\n    if i < len(classes) - 1:\n        next = np.where(le.classes_\
    \ == classes[i + 1])[0][0]\n    # construct a tuple that consists of the current\
    \ age\n    # bracket, the previous age, and the next age\n    oneOff = (current,\
    \ prev, next)\n    # return the one-off mappings\n    return oneOff\n```\n\n**Line\
    \ 66** the index of the current class label name. Provided that our age bracket\
    \ is greater than the 0–2 range, we then determine the adjacent bracket (**Lines\
    \ 72 and 73**). In the case the current age bracket is less than 60+, we then\
    \ determine the adjacent bracket (**Lines 77 and 78**).\nTheoneOff dictionary\
    \ is then updated using the current age bracket as a key by a 3-tuple consisting\
    \ of the current label, with the two adjacent and next class labels. The oneOff\
    \ dictionary is returned to the calling function on **Line 86**.\nUtility functions\
    \ like these are great examples of why it's important to learn the fundamentals\
