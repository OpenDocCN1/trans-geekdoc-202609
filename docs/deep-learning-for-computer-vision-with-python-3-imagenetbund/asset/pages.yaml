    detector, which is exactly the topic of the next section.


    # 18.2.5 Potential Problems and Limitations


    There are two limitations and drawbacks to our results. The first one can be discerned
    from inspecting the results and reading Chapter 17, where we discussed the fundamentals
    of Single Shot Detectors — SSDs do not perform well on small objects.'
