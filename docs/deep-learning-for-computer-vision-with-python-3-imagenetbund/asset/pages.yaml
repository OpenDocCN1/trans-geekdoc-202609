    1. train.py: Used to train our learning-based object detectors.

    2. eval.py: Runs concurrently with train.py to evaluate on the testing set as
    we train.

    3. export_inference_graph.py: After our model is fully trained we''ll need to
    freeze the weights and export the model so we can import it into our own applications.

    All these scripts are part of the TFOD API and are not part of any custom code
    or implementation we will be writing. The directory structure and project structure
    for our R-CNN custom scripts and training/evaluation configurations can be seen
    below:


    ```

    | ssds_and_rcnn

    | --- build_lisa_records.py

    | | | --- config

    | | | | --- __init__.py

    | | | | --- lisa_config.py

    | | --- lisa/

    | | | --- allAnnotations.csv

    | | | --- categories.txt

    | |

    | | --- vid8/

    | | --- vid9/

    | | | --- videoSources.txt

    | | --- predict.py

    | --- predict_video.py

    ```


    There are a number of configurations required to build our custom object detector
    so we''ll create a file named lisa_config.py to store any configurations, such
    as file paths, class labels, etc.

    The build_lisa_records.py will be used to accept an input set of images, creating
    the training and testing splits, and create TensorFlow compatible record files
    that can be used for training.

    After our network has been trained, we can use both predict.py and predict_video.py
    to apply our network to images or video files/streams, respectively.

    The setup.sh script contains a single command that can be used to easily update
    your PYTHONPATH to include the TFOD API imports when you execute your Python scripts
    via the command line.

    The LISA directory contains all files relevant to the LISA Traffic Signs dataset
    as the raw images themselves and the serialized record files. I have decided to
    store the LISA dataset on a separate hard drive on my system (where I have more
    space) and then create a sym-link to the dataset in my project structure, similar
    to what we have done in previous chapters of this'
