- pgno: 179
  md: '# Chapter 12. Case Study: Correcting Image Orientation


    {0, 180, 360} degrees. We then applied transfer learning via feature extraction
    and the VGG16 network architecture to extract features from the final POOL layer
    in the network. These features were fed into a Logistic Regression classifier,
    enabling us to correctly predict the orientation of an image with 93% accuracy.
    Combining both the VGG16 network and our trained Logistic Regression model enabled
    us to construct a pipeline that can automatically detect and correct image orientation.


    Finally, it''s once again worth mentioning that this result would have been impossible
    if our CNN was rotation invariant. CNNs are robust image classification tools
    and can correctly classify images under a variety of orientations; however, the
    individual filters inside the CNN are not rotation invariant.


    Furthermore, CNNs are only able to classify objects under rotations on which they
    were trained. There is certainly a degree of generalization here as well; however,
    if these filters were truly rotation invariant the features we extracted from
    our input images would be near identical to each other. If the features were near
    identical, then the Logistic Regression classifier would not be able to discriminate
    between our image orientations. This is an important lesson to keep in mind when
    developing your own deep learning applications – if you expect input objects to
    exist under many orientations, make sure your training data reflects this requirement.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 13. Case Study: Vehicle Identification


    Have you ever seen the movie Minority Report? In the film, there is a scene where
    the protagonist (Tom Cruise) is walking through a crowded shopping mall. A combination
    of camera sensors mounted next to each LCD display, along with specialized computer
    vision algorithms, are able to (1) recognize who he is and (2) display advertising
    based on his specific profile.


    Back in 2002 when Minority Report was released, this type of robust, targeted
    advertising sounded like science fiction. But the truth is we aren''t too far
    from it. Imagine you were driving a car down a highway filled with billboards
    – only instead of being posters plastered on a big wall, you would see a different
    ad. The interests of a person driving a brand new BMW 5 series might receive ads
    for golfing fitness, while the driver of a later model minivan might be drawn
    to advertising on how to save money for their kids'' college. Whether or not these
    ads reflect the interests of individual driver is questionable, but on aggregate,
    the following process is exactly how advertising works:


    +   1. Analyze a demographic.

    2. Identify their interests.

    3. Display advertising that reflects these interests.


    In this chapter, we will learn how to build the computer vision component of an
    intelligent billboard system. Specifically, we will learn how to fine-tune a pre-trained
    CNN with the mxnet library to recognize over 164 vehicle makes and models (using
    remarkably little training data) with over 96.54% accuracy.


    # 13.1 The Stanford Cars Dataset


    The Stanford cars dataset is a collection of 16,185 images of 194 cars (Figure
    13.1), curated by Krause et al. in their 2013 publication, 3D Object Representation
    for Fine-Grained Classification [37].


    You can download an archive of the dataset here:


    http://pyimg.com/s9mx


    After downloading, use the following command to uncompress the dataset:'
