- pgno: 248
  md: '# 15. Faster R-CNNs


    Deep learning has impacted almost every facet of computer vision that relies on
    machine learning in a meaningful way. Image classification, image search engines
    (also known as Content-based Image Retrieval, or CBIR), localization and mapping
    (SLAM), image segmentation, to name a few, have all changed since the latest resurgence
    in neural networks and deep learning. Object detection is no different.


    One of the most popular deep learning-based object detection algorithms is the
    family of R-CNN algorithms, originally introduced by Girshick et al. in 2013 [43].
    Since then, the R-CNN algorithm has gone under a number of iterations, improving
    the algorithm with each new publication, outperforming traditional object detection
    algorithms (ex., Haar cascades [44]; HOG + Linear SVM [41]) at every step of the
    way.


    In this chapter we''ll discuss the Faster R-CNN algorithm and its components,
    including anchors, the base network, Region Proposal Network (RPN), and Region
    of Interest (ROI) pooling. This discussion of Faster R-CNN building will help
    you understand the core algorithm, how it works, and how end-to-end object detection
    is possible.


    In the following chapter, we''ll review the TensorFlow Object Detection API [45],
    including how to install, how it works, and how to use the API to train your Faster
    R-CNN object detectors on custom datasets.


    These two chapters on R-CNNs, along with the following chapters on Single Shot
    Detectors (SSDs), will focus on object detection from a self-driving car standpoint,
    demonstrating how to train object detectors to localize street signs and vehicles
    in images and video. You''ll be able to use these discussions and code examples
    as a starting point for your projects.


    # 15.1 Object Detection and Deep Learning


    Object detection, regardless of whether performed via deep learning or other computer
    vision techniques, has three primary goals — given an input image we wish to obtain:


    +   1. A list of bounding boxes, the (x,y)-coordinates for each object in an image

    2. A class label associated with each bounding box

    3. The probability/confidence score associated with each bounding box and class
    label'
  merge: -1
  img_proc: true
- pgno: 249
  md: '248


    Chapter 13. Faster R-CNNs


    Inside Chapter 13 of the Practitioner Bundle we reviewed the traditional object
    detection pipeline,

    including:


    +   - Sliding windows to locate objects at different locations

    - Image pyramids, used to detect objects at varying scales

    - Classification in a pre-trained CNN


    In this manner we were able to frame object detection as classification, simply
    by utilizing sliding windows and image pyramids. The problems with this are numerous,
    but the primary ones include:


    +   - **Slow and tedious**: running a sliding window at *every location* at every
    layer of an image is time consuming process

    - **Lack of aspect ratio**: Since our CNN requires a fixed-size input, we cannot
    encode the aspect ratio of a potential object into the ROI extracted and fed into
    the CNN. This leads to less accurate locations.

    - **Error prone**: Balancing speed (larger sliding window steps and fewer image
    pyramid layers) is incredibly challenging. This issue is further compounded by
    a lack of object aspect ratio in the ROI.


    What we really need is an end-to-end learning-based object detector that we input
    an image and obtain the bounding boxes and class labels for output. We''ll see
    building an end-to-end object detector that is not any easy task.


    #  15.1 Measuring Object Detector Performance


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_249_0.png)


    Figure 15.1: **Left:** An example of detecting a stop sign in an image. The predicted
    bounding box is drawn in red where the ground-truth bounding box is drawn in green.
    Our goal is to compute the Intersection Union of these two bounding boxes. **Right:**
    Computing the Intersection Union is as simple as dividing the area of overlap
    between the bounding boxes by the area of union.


    When evaluating detector performance we use an evaluation metric called **Intersection
    over Union (IoU)**. You''ll typically find IoU to evaluate the performance of
    HOG + Linear SVM detectors [41], Convolutional Neural Network methods, such as
    Faster R-CNN [46], SSD [47], You Only Look Once (YOLO) [48, 49], and others; keep
    in mind that the actual algorithm used to generate the predicted bounding boxes
    does not matter.


    Any algorithm that provides bounding boxes (and optionally class labels) as output
    can be evaluated using IoU. More formally, in order to apply IoU to evaluate an
    arbitrary object detector, we need:


    +   - The ground-truth bounding boxes (i.e., the hand labeled bounding boxes from
    our testing set that specify where in an image our object is).'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# 15.1 Object Detection and Deep Learning


    2. The predicted bounding boxes from our model.

    3. If you want to compare recall with prediction, you''ll also need the ground-truth
    class labels and predicted class labels.

    As long as we have two sets of bounding boxes we can apply IoU.


    In Figure 15.1 (left) I have included a visual example of a ground-truth bounding
    box (green) a predicted bounding box (red). Computing IoU can then be determined
    by the equation in Figure 15.1 (right).


    Examining this you can see that IoU is a ratio. In the numerator we count the
    area of overlap between the predicted bounding box and the ground-truth bounding
    box. The denominator is the area of union, which is encompassed by the predicted
    bounding box and ground-truth bounding box. Dividing the area of overlap by the
    area of union yields a fixed score — the Intersection over Union.


    # Where do the ground-truth examples come from?


    Before we get too far, you might be wondering where the ground-truth examples
    come from. I mentioned earlier in this chapter that our dataset must be "hand
    labeled", but what exactly does this mean?


    When training your own object detector, you need a dataset. This dataset should
    be broken into (at least) two groups:


    +   1. A training set for training your object detector

    2. A testing set for evaluating your object detector

    You may also have a validation set to tune the hyperparameters of your model.

    Both the training and testing set will consist of:

    1. The actual images themselves

    2. The bounding boxes associated with the object(s) in the image. The bounding
    boxes are simply the (x,y)-coordinates of the object in the image.


    The bounding boxes for training and testing sets are hand labeled, hence why we
    call them "ground-truth". Your goal is to take the images + bounding boxes, construct
    an detector, and then evaluate its performance on the testing set. An IoU score
    > 0.5 is normally considered a "good" prediction.


    # Why we use Intersection over Union?


    So in this book we have performed classification, or when a model predicts a set
    of class labels for an input — the predicted label with the highest probability
    is either correct or incorrect. This type of binary classification makes accuracy
    counting straightforward — it''s either correct or not; however, for object detection,
    it''s not simple.


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_250_0.png)


    Figure 15.2: An example of computing Intersection over Unions for various bounding
    boxes. The more the predicted bounding box overlaps with the ground-truth bounding
    box, the better the prediction, and the higher Io IoU score.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Chapter 15. Faster R-CNNs


    In reality, it is extremely unlikely that the (x,y)-coordinates of our predicted
    bounding box are going to exactly match the (x,y)-coordinates of the ground-truth
    bounding box. Due to varying parameters of our model, such as layer used for feature
    extraction, anchor placement, loss function, etc., a complete and total match
    between predicted and ground-truth bounding boxes is unrealistic.


    Because coordinates will not exactly match, we need to define an evaluation metric
    that rewards predicted bounding boxes for heavily overlapping with the ground-truth,
    as in Figure 15.2.


    In this illustration we have included examples of good and bad IoU scores. Predicted
    bounding boxes that overlap with the ground-truth bounding boxes have higher than
    those with overlap. This behavior makes IoU an excellent metric for evaluating
    object detection.


    Again we are not concerned with an exact match of (x,y)-coordinates, but we want
    to ensure that our predicted bounding boxes match as closely as possible — IoU
    is able to take this into fact account.


    Implementing IoU by hand is outside the context of this book, although it is a
    fairly straightforward-forward process. If you''re interested in learning more
    about IoU, including a walkthrough of Python code demonstrating how to implement
    it, please see PyImageSearch blog post: https://pyimagesearch.com/ag45


    # Average Precision (mAP)


    In the context of machine learning, precision typically defines accuracy — but
    in the context of object detection, IoU is our precision. We need to define a
    method to compute accuracy per class and all classes in dataset. To accomplish
    this, we need Average Precision (mAP).


    To compute average precision for a single class, we determine the IoU of all data
    points for a particular class. Once we have the IoU with the class labels for
    that specific class, averaging the precision. To compute the mean average precision,
    we compute the IoU for all N classes — then take the average of N averages, hence
    get the mean average precision.


    When reading detection papers you''ll typically see results reported in terms
    of mAP. In the dataset we''ll report mAP@0.5, indicating that for an object in
    the testing set to be marked as a "positive" it must have, 0.5 IoU with the ground-truth.
    The 0.5 value is tunable, is fair standard most object detection datasets.


    # 15.2 The (Faster) R-CNN Architecture


    In this section we''ll review the Faster R-CNN architecture. We''ll start with
    a brief discussion on R-CNNs and how they have evolved over series of three publications,
    leading to the Faster R-CNN architecture that we use now. Finally, we''ll explore
    the core blocks of the Faster R-CNN architecture, first at a high level and then
    again in more detail.


    As we''ll see, the Faster R-CNN architecture is complex, with many moving parts
    — we''ll focus our efforts on obtaining an understanding of tenets of this architecture
    prior to training the network on our custom datasets in Chapter 16.


    # 15.2.1 A Brief History of R-CNN


    To better understand how the Faster R-CNN object detection algorithm works, we
    first need to review the history of the R-CNN algorithm, including its original
    incarnation and how it has evolved.


    250'
