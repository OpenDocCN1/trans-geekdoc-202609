    # 14.7 Age and Gender Prediction Results


    In previous chapters in the Practitioner Bundle and ImageNet Bundle, I provided
    a series of experiments to demonstrate how I obtained an optimally performing
    model. However, due to the length of this chapter, I am going to present the best
    results only for both the age CNN and gender CNN.


    # 14.7.1 Age Results


    My best experiment on predicting using MxAgeGenderNet was obtained using the Adam
    optimizer with an initial learning rate of Le-4 (which is smaller than the default
    Le-3). An L2 weight decay of 0.0005 was also applied. Using a small initial learning
    rate enabled me to train the network without overfitting creep. I started training
    using the following:


    ```

    $ python train.py --checkpoints checkpoints/age --prefix aenet

    ```


    The gap between training and validation remains small until approximately epoch
    90 when divergence starts. I allowed training to continue to epoch 120 (Figure
    14.3, top-left), where I stopped, lowering the learning rate to 1e-5, and restarted
    training:


    ```

    $ python train.py --checkpoints checkpoints/age --prefix aenet \

    --start-epoch 120

    ```


    I allowed training to continue for 20 epochs (Figure 14.3, top-right). At this
    point, I began to see that both the validation loss and accuracy start level out
    a bit. I didn''t want to train too much over overfitting to the training data
    was a concern of mine. I decided to lower the learning rate to 1e-6 and resume
    training for 10 more epochs:


    ```

    $ python train.py --checkpoints checkpoints/age --prefix aenet \

    --start-epoch 140

    ```


    After epoch 150, I killed the training process and examined my validation set,
    noting the validation accuracy to be 71.65% rank-1 and 94.14% one-off (Figure
    14.3, bottom). Happy with these results, I evaluated on the testing set:


    ```

    $ python test_accuracy.py --checkpoints checkpoints/age --prefix aenet \

    --epoch 150

    [INFO] loading model...

    [INFO] predicting on ''age'' test data...

    [INFO] rank-1: 71.15%

    [INFO] one-off: 88.28%

