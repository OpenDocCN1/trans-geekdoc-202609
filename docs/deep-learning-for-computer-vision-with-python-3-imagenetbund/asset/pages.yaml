- pgno: 106
  md: '# 9. Training ResNet on ImageNet


    In this chapter, we''ll be implementing and training the seminal ResNet architecture
    from scratch. ResNet is extremely important in the history of deep learning as
    it introduced the concept of residual modules and identity mappings. These concepts
    have allowed us to train networks that have > 200 layers on ImageNet and > 1,000
    layers on CIFAR-10 depths that were previously thought impossible to reach while
    successfully training a network.


    We have reviewed the ResNet architecture in detail inside Chapter 12 of the Practitioner
    Bundle; however, this chapter will still briefly review the current incarnation
    of the residual module as a matter of completeness. From there, we will implement
    ResNet using Python and the mxnet library. Finally, we''ll perform a number of
    experiments training ResNet from scratch ImageNet with the end goal of replicating
    the work by He et al. [21, 22].


    # 9.1 Understanding ResNet


    The cornerstone of ResNet is the residual module, first introduced by He et al.
    in their 2015 paper, Deep Learning for Image Recognition [21]. The residual module
    consists of two branches. The first is simply a shortcut which connects the input
    to an addition of the second branch, a series of convolutions and activations
    (Figure 9.1, left).


    However, in the paper, it was found that bottleneck residual modules perform better,
    especially when training deeper networks. The bottleneck is a simple extension
    to the residual module. Instead of having our shortcut, only the second branch
    to our micro-architecture has changed. Instead of applying only two convolutions,
    we are applying three convolutions (Figure 9.1, middle).


    The first CONV consists of 1 x 1 filters, the second of 3 x 3, and the third of
    1 x 1 filters. Furthermore, the number of filters learned by the first CONV is
    1/4 the number learned by the final CONV – this is where the "bottleneck" comes
    in.


    Finally, in an 2016 publication, Identity Mappings in Deep Residual Networks [22],
    He et al. experimented with the ordering of convolution, activation, and batch
    normalization layers within the residual module. They found that by applying pre-activation
    (i.e., placing the RELU and BN before the CONV) higher accuracy could be obtained
    (Figure 9.1, right).'
  merge: -1
  img_proc: true
