  md: '# 15.2 The (Faster) R-CNN Architecture


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_256_0.png)


    Figure 15.6: The base network is used to extract features from the input image.
    We ensure our network is fully-convolutional by removing the fully-connected layers
    at the end of the network and still utilizing the output of the COV5 and POOL
    layers. This process allows our network to handle input images of arbitrary spatial
    dimensions. The features are then fed into the RPN and ROI Pooling modules.


    However, in VGG in Girshick et al., we know there are fully-connected layers at
    the end of VGG — it thus not a fully-convolutional network. There is a way to
    change the behavior of the CNN though. Keep in mind that we only need the output
    of a specific COV (or POOL) layer in the network — this output is our feature
    map, the process of which is visualized in Figure 15.6.

    We can obtain this feature by mapping the input image through the network and
    stopping at target layer (we do not have to pass the image through the entire
    network to obtain our feature map). The fact that VGG originally only accepted
    a 224 × 224 input is entirely arbitrary now that we are only interested in the
    output of a specific COV + POOL layer. This feature map will be used by Region
    Proposal Network and ROI Pooling module in the Faster R-CNN architecture.


    # 15.2.3 Anchors


    In object detection pipelines we use either (1) a combination of a sliding window
    + image pyramid or (2) a Selective Search-like algorithm to generate proposals
    for our classifier. Since our goal is to develop an end-to-end object detector
    using deep learning that the proposal, we need to define a method that will generate
    our ROIs.

    The core separation between classification and object detection is the prediction
    of bounding boxes, or (x, y)-coordinates surrounding an object. Thus, we expect
    our network to return a tuple consisting of the bounding coordinates of a particular
    object. But, there is a problem with this approach, namely:


    +   1. How do we handle a network predicting values outside the boundaries of
    the image?

    2. How do we encode restrictions such as x_min < x_max and y_min < y_max?

    It sounds out that this is a near impossible problem to solve. However, the solution
    proposed by-'
