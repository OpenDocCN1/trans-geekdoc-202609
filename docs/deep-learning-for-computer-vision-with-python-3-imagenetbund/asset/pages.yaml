    Figure 18.1: An example of rear views of vehicles and their associated bounding
    boxes in the dlib Vehicle dataset [67].


    Unfortunately, the TFOD API has no concept of “ignored” areas of images which
    can hurt our object detection performance. The goal of using dlib’s vehicle dataset
    is twofold:


    +   1. To train a high quality SSD object detector to localize front and rear
    views of vehicles in images

    2. To demonstrate how a combination of (1) SSD’s hard-negative mining with (2)
    the lack of “ignored” areas in the TFOD API can confuse our object detector


    By the end of this chapter you''ll have a strong understanding of both goals,
    enabling you to make intelligent decisions regarding which object detection framework
    to use when training your own detectors on custom datasets.


    # 18.2 Training Your SSD


