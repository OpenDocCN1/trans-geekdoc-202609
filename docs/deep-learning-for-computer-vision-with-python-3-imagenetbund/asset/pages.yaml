    # 6.4.1 AlexNet: Experiment #1


    In my first AlexNet on ImageNet I decided to empirically demonstrate why we place
    batch normalization layers after the activation than before. I also use standard
    ReLUs than ELUS to obtain a baseline for model performance (Krizhevsky et al.
    used ReLUs in their experiments). I modified the alexnet.py file detailed in this
    chapter to reflect the batch normalization and activation changes, a sample of
    which can be seen:


    ```

    # Block #1: first CONV -> RELU -> POOL layer

    conv1_1 = mx.sym.Convolution(data=data, kernel=(11, 11),

    stride=(4, 4), num_filter=96)

    bn1_1 = mx.sym.BatchNorm(data=conv1_1)

    act1_1 = mx.sym.Activation(data=bn1_1, act_type="relu")npool1 = mx.sym.Pooling(data=act1_1,
    pool_type="max",

    kernel=(3, 3), stride=(2, 2))

    drop = mx.sym.Dropout(data=pool1, p=0.25)

    ```


    Notice how my normalization layer is now before and I am using ReLU activation
    functions. I have included Table 6.2 to reflect my epoch number and associated
    learning rates—below we will explain why I chose to lower the learning rates at
    each respective epoch in the remainder of this section.


    I started training AlexNet using SGD with an initial learning rate of 1e–2, a
    momentum term of 0.9, and L2 weight decay of 0.0005. The command to start the
    training process like this:


    ```

    $ python train_alexnet.py --checkpoints checkpoints --prefix alexnet

    ```


    I allowed my network to train, monitoring progress approximately every 10 epochs.
    One of the worst mistakes I make when deep learning practitioners make is checking
    their training plots too often. In most cases, you need the context of 10-15 epochs
    before you can make the decision that a network is indeed overfitting, underfitting,
    or conflicting. After epoch 70, I plotted my loss and accuracy found had essentially
    stagnated at ~49–50%, a clear sign that the learning rate can be reduced to further
    improve accuracy.


    Thus, I updated the learning rate to be 1e–3 by editing Lines 53 and 54 of train_alexnet.py:


    ```

    # initialize the optimizer

    opt = mx.optimizer.SGD(learning_rate=1e-3, momentum=0.9, wd=0.0005,

    rescale_grad=1.0 / batchSize)

    ```


    Notice how the learning rate has been decreased from 1e–2 to 1e–3, but all SGD
    parameters have been left the same. I restarted training from epoch 50 using the
    following command:'
