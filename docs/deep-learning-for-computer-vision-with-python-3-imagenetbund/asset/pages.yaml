    \ each branch as they are. I provide a more thorough discussion on the assumptions\
    \ we make regarding the number of filters for CONV layer in the Inception module\
    \ in Chapter 12 of the Practitioner Bundle.\nTo learn deeper, richer features\
    \ that are more discriminative, we apply five Inception modules (4a-4e), followed\
    \ by another POOL:\n\n```\n# Block 4: (INCEP * 5) => POOL\nin4a = GoogLeNet.inception_module(pool3,\
    \ 192, 96, 208, 16,\n    48, 64)\nin4b = GoogLeNet.inception_module(in4a, 160,\
    \ 112, 224, 24,\n    64, 64)\nin4c = GoogLeNet.inception_module(in4b, 128, 256,\
    \ 24,\n    64, 64)\nin4e = GoogLeNet.inception_module(in4c, 256, 160, 320, 32,\n\
    \    128, 128)\npool4 = mx.sym.Pooling(data=in4e, pool_type=\"max\"\npad=(1, 1),\
    \ kernel=(3, 3), stride=(2, 2))\n```\n\nNotice the depth we get in the architecture\
    \ and the smaller the output volume, the more filters we learn – this is a common\
    \ pattern when creating Convolutional Neural Networks. Another two Inception modules\
    \ (5a and 5b) are used, followed by averaging pooling and dropout:"
