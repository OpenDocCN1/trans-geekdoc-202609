    stride=(2, 2), num_filter=96)

    relu_1 = mx.sym.LeakyReLU(data=relu_1, act_type="elu")

    pool_1 = mx.sym.Pooling(data=relu_1, kernel=(3, 3),

    stride=(2, 2), pool_type="max")

    ```'
