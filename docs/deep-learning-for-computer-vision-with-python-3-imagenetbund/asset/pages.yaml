- pgno: 252
  md: '# 15.2 The (Faster) R-CNN Architecture


    # R-CNN: Regions with CNN features


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_252_0.png)


    1. Input image 2. Extract region proposals (-2k) 3. Compute CNN features 4. Classify
    regions


    Figure 15.3: The R-CNN architecture consisted of (1) accepting an input image,
    (2) extracting ≈ 2,000 proposals via the Selective Search algorithm, (3) extracting
    features for each ROI using a pre-trained CNN (such as one trained on ImageNet),
    and (4) classifying the features for each ROI using class-specific SVM. Image
    merge: Figure 1 of Girshick et al. [43]


    The first R-CNN proposal, Rich feature hierarchies for accurate object detection
    and semantic segmentation, was published in 2013 by Girshick et al. [43] — we
    refer to this initial paper and associated implementation as simply R-CNN. An
    overview of the original R-CNN algorithm can be found in Figure 15.3, which includes
    a four step process:


    +   * Step #1: Accept an image.

    * Step #2: Extract regions proposals (i.e., regions of an image that potentially
    contains objects) using an algorithm such as Selective Search [50].

    * Step #3: Use transfer learning, specifically feature extraction, to compute
    features for each proposal (which is effectively ROI using the pre-trained CNN).

    * Step #4: Classify each proposal using the extracted features with a Support
    Vector Machine (SVM).


    In the first step we augment an image to our. We then run a region proposal algorithm
    as such Selective Search takes the place of sliding windows and image pyramids,
    intelligently examining the image at various scales and locations, dramatically
    reducing the total number of ROIs that will be sent to the network for classification.
    We can thus think of Selective Search as a smart sliding window and image pyramid
    algorithm.


    > A review of the Selective Search algorithm is outside the scope of this book
    so I recommend treating it as “ black box” that intelligently proposes ROI locations
    to use. For a detailed discussion of Selective Search refer to Uijlings et al.
    [50].


    Once we have proposal locations we crop each of them from the input image and
    apply transfer learning via feature extraction (Chapter 3 of the Practitioner
    Bundle). Instead of obtaining the final predictions from the CNN, we utilize feature
    extraction to enable a linear classifier to learn more discriminating patterns
    from these CNN features.


    The fourth and final step is to train a set of SVMs on top of these extracted
    features for each class.


    Looking at this pipeline for the original R-CNN we can clearly see inspirations
    and parallels from traditional object detectors such as Dal and Triggers seminal
    hog + Linear SVM framework:'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Instead of applying an exhaustive image pyramid and sliding window, we are
    swapping a more intelligent Selective Search algorithm


    Instead of extracting HOG features from each ROI, we are now extracting CNN features
    for the final classification of the input ROI, we''re training this SVM on the
    CNN rather than the HOG features


    The primary research approach worked so well due to the robust, discriminative
    features learned by a CNN — something we have explored thoroughly in Chapter 3
    and Chapter 5 on transfer learning the *Pritioner''s Bande*.


    The problem with the original R CNN approach is that it''s still incredibly slow.
    And furthermore, we''re not actually learning to localize via deep neural network.


    Instead, we''re leaving the localization to the Selective Search algorithm — we
    are only classifying the ROI once it is determined as “interesting” and “worth
    examining” by the region proposal algorithm, which raises the question: is it
    possible to obtain end-to-end learning-based detection?


    # Fast R-CNN


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_253_0.png)


    Figure 15.4: In the Fast R-CNN architecture, we use Selective Search to obtain
    our proposals, but now we use **ROI Pooling** by extracting a fixed-size window
    from the feature map and using these features to obtain the final class and bounding
    box. (Image credit: Figure 1 of Girshick al. [51])


    Approximately a year and a half after Girshick et al. submitted the original R-CNN
    publication to arXiv, *Fast R-CNN* [51]. Similar to the original R-CNN, R-CNN
    algorithm also utilized Selective Search to obtain region proposals, but a novel
    contribution was: **Region of Interest (ROI) Pooling**. A visualization of the,
    updated architecture can be seen in Figure 15.4.


    In this approach, we apply the CNN to the entire input image and extract a feature
    map from it using our network. ROI Pooling works by extracting a fixed-size window
    from the feature map and then passing it into a set of fully-connected layers
    to obtain the output layer for the ROI. We''ll discuss ROI Pooling in more detail
    in Section 15.2.5, but for the time being, understand that ROI Pooling operates
    the feature map from the CNN and extracts a *fixed-size window* from it.


    The primary benefit here is that the network is now, effectively, end-to-end trainable:


    +   1. Input an image and aggregate ground-truth bounding boxes

    2. Extract the feature map

    3. Apply ROI pooling and obtain the ROI feature map vector

    4. And use two sets of fully-connected layers to obtain (1) the class label predictions
    and (2) the bounding box locations for each proposal.


    While the network is now end-to-end trainable, performance suffered dramatically
    at inference'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 15.2 The (Faster) R-CNN Architecture


    (i.e., prediction) time by being dependent on the Selective Search (or equivalent)
    region proposal algorithm. To make the R-CNN architecture even faster we need
    to incorporate the region proposal directly into the R-CNN.


    # Faster R-CNN


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_254_0.png)


    Figure 15.5: The latest incarnation of the R-CNN family, Faster R-CNN, introduces
    a Region Proposal Network (RPN) that bakes region proposal directly in the architecture,
    alleviating the need for the Selective Search algorithm. (Image credit: Figure
    2 of Girishick et al. [46])


    A little over month after the Fast R-CNN paper was published, Girishick collaborated
    with Ren and Sun in a 2015 paper, Faster R-CNN: Towards Real-Time Object Detection
    with Region Proposal Networks [46].


    In this work, Girishick et al. created an additional component to the R-CNN architecture,
    a Region Proposal Network (RPN). As the name of this module, the goal of the RPN
    is to remove the requirement of running Selective Search prior to inference and
    instead bake the region proposal directly into the R-CNN architecture.


    Figure 15.5 provides a visualization of the updated architecture. Here we can
    see an image is presented to the network and its features extracted via pre-trained
    CNN (i.e., the network). These features, in parallel, are sent to two components
    of the Faster R-CNN architecture.


    The first component, the RPN, is used to determine *where in an image a potential
    object could be*. At this point we do not know what the object is, just that there
    is potentially an object at a certain location in the image.


    The proposed bounding box ROIs are based on the Region of Interest (ROI) Pooling
    module of the network along with the extracted features from the previous step.
    ROI Pooling is used to extract fixed-size windows of features which are then passed
    into two fully-connected layers (one for the class labels and one for the bounding
    coordinates) to obtain our final localizations.


    We''ll discuss the RPN in detail inside Section 15.2.4, but in essence, we are
    now going to place anchors uniformly across the entire image at varying scales
    and aspect ratios. The RPN will then examine these outputs and output a set of
    proposals as to it "thinks" an object exists.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '254


    Chapter 15. Faster R-CNNs


    It''s important to note that the RPN is not actually labeling the ROI; it''s computing
    its "objectness score" and asking: "Does this region look like an object of some
    sort?" I personally like to think of the RPN objectness score as a binary classifier
    of sorts where the RPN is labeling each ROI as "background" or "foreground". If
    the RPN thinks the ROI is further considered by the ROI Pooling and final label
    + bounding box fully-connected layers.


    At this point the entire architecture is end-to-end trainable and the complete
    object detection pipeline takes place inside the network:


    +   1. Region proposal

    2. Feature extraction

    3. Computing the bounding coordinates of the objects

    4. Providing class labels for each box


    And furthermore, depending on which GPU and base architecture is used, it''s now
    possible to obtain ≈ 7 – 10 frames per second (FPS), a huge step toward making
    real-time object detection with deep learning reality.


    Now we have a brief introduction to the components in a (Faster) R-CNN architecture,
    let''s examine each of them in detail in more.


    # 15.2 The Base Network


    In Figure 15.5 we can see the general modules in the Faster R-CNN architecture.
    After we input the image to the architecture, the first component we count is
    across the base. The base network is typically a CNN pre-trained for a classification
    task. This CNN will be used for transfer learning, in feature extraction.

    We use a pre-trained CNN here as the features learned by layer are often transferable
    to classification tasks outside of what the original network was trained on. For
    a complete review on transfer learning, feature extraction re-tuning, and how
    we can use transfer learning via pre-trained models, refer to Chapter 3 of the
    Practitioner Bundle.


    The original R-CNN paper used VGG [17] and ZF [52] as the ResNet [21, 22], or
    a smaller, more compact network for resource devices, such as MobileNet [53].


    One important aspect of object detection networks is that they should be fully-convolutional,
    not to be confused with fully-connected. A fully-convolutional neural network
    does not contain the fully-connected layers typically found at the end of a network
    to making output predictions. In the context of image classification, removing
    the fully-connected layers is normally accomplished by applying pooling across
    the entire volume to a single softmax classifier used for the image and network
    fit into memory, course


    A fully-convolutional neural network enjoys two primary benefits, including:


    +   1. Fast, to allow convolution operations


    +   2. To accept images of any spatial resolution (i.e., width and height), that
    provides the image and network can fit into memory, course


    When implementing object detection it''s important that we do not rely on fixed-size
    images that require us to force the image to a specific dimension. Not only can
    fix-sizes the aspect ratio of the input image, but it also has the worse side
    effect of making it extremely challenging for the network to detect small objects
    — if we reduce the spatial dimensions of our image too much, small objects will
    appear as tiny pixel blobs, too small for the network to detect. Therefore, it''s
    important that we allow the network to accept arbitrary spatial resolutions and
    allow input image to be a dimension made by the developer or engineer.'
  merge: -1
  img_proc: true
