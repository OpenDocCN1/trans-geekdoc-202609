    b.append((label, startX, startY, endX, endY))\nD[p] = b\n```\n\n**Line 46** builds\
    \ the full path to the current imageUsing BASE_PATH from the config file. We fetch\
    \ all bounding boxes + class labels for the current image, p (**Line 47**). We\
    \ append our label and bounding coordinates to the list b, and store it back in\
    \ the mapping dictionary, D (**Lines 51 and 52**).\n\nThis mapping may seem uncommon,\
    \ but keep in mind that we still need to:\n\n+   1. Create our training and testing\
    \ split\n2. Ensure that our training and testing split is performed on the images\
    \ rather than the *bounding boxes*\n\nOur goal is to ensure that if a particular\
    \ image is labeled as \"training\", then all bounding boxes for image are included\
    \ in the training set. Similarly, if an image is labeled as \"testing\", then\
    \ we want all bounding boxes for image to be associated with the testing set.\n\
    \nWe want to avoid situations where an image contains bounding boxes for both\
    \ training and testing sets. Not only is this behavior inefficient, it creates\
    \ a larger problem — some object detection algorithms utilize hard-negative mining\
    \ to increase their accuracy by taking non-labeled areas of the image and treating\
    \ them as\n\nIt's therefore possible that our network could think ROI was not\
    \ a road sign, and in fact it was, confusing our network and hurting accuracy.\
    \ Because of this nuance, we should always associate an image and * bounding box*\
    \ with either the training or testing set.\nSpeaking of which, we create our training/testing\
    \ split:\n\n```\n# create training and testing splits from our data dictionary\n\
    (trainKeys, testKeys) = train_split(D.keys()),\ntest_size=config.TEST_SIZE, random_state=62\n\
    ```\n\n```\n# initialize the data split files\ndatasets = [\n    (\"training\"\
    , trainKeys, config.TRAIN_RECORD),\n    (\"test\", testKeys, config.TEST_RECORD)\n\
    ]\n```\n\nWe use scikit-learn/train_split to create our split. Notice how we are\
    \ splitting on the *keys* of the D dictionary, ensuring we split on the images\
    \ rather than the bounding boxes, avoiding the potentially harmful scenario mentioned\
    \ above.\n\n**Lines 59-62** defines a datasets, associating the training and testing\
    \ splits with their associated output files.\n\nAt this point we are ready to\
    \ build our TensorFlow record files:\n\n```\n# loop over the datasets\nfor (dtype,\
    \ keys, outputPath) in datasets:\n    # initialize the TensorFlow writer and initialize\
    \ the first\n    # number of examples written to file\n    print(\"[INFO] processing\
    \ {}...\".format(dtype))\n    writer = tf.python.TFRecordWriter(outputPath)\n\
    ```"
