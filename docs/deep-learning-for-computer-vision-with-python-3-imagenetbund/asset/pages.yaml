    to date, but if you find a 404 is or the page does not look like the screenshot
    included in this book, please refer to the comment (http://pyimg.com/fnkkx) for
    the most-to-date links.


    To prepare our trained model, you will first want to head to the TensorFlow Object
    Detection Model Zwo: http://pyimg.com/l23zr


    Here you''ll find a table that lists various models that have been trained on
    the Common Objects in Context (COCO) dataset [59].


    The COCO dataset contains over 200,000 labeled images. Networks trained on the
    COCO challenge can detect 20 class labels, airplanes, bicycles, cars, dogs, and
    more. Networks trained on the large COCO dataset can typically be fine-tuned to
    recognize objects in other datasets as well.


    To download the model, find the Faster-CNN + ResNet-101 + COCO link in the table
    (Figure 16.2) and download it. At the time of this writing, the filename is faster_cnn_resnet101_coco_2018_01_28.tar.gz.
