    the data, we define the first convolution layer in SqueezeNet. This layer yields
    96 filters, of which are $7 \times 7$ with a size of $2 \times 2$. An ELU activation
    is applied (**Line 49**) before we reduce the spatial dimensions via max pooling


    Next come our three modules followed by another max pooling:


    ```

    # Block #2-4: (FIRE * 3) => POOL

    fire_2 = SqueezeNet.fire(pool_1, numSqueezeFilter=16,

    numExpandFilter=64)

    fire_3 = SqueezeNet.fire(fire_2, numSqueezeFilter=16,

    numExpandFilter=64)

    fire_4 = SqueezeNet.fire(fire_3, numSqueezeFilter=32,

    numExpandFilter=128)

    pool_4 = mx.Pooling(data=fire_4, kernel=(3, 3),

    stride=(2, 2), pool_type="max")

    ```


    Following with Figure 10.2, we then apply our four modules and another max pooling:


    ```

    # Block #5-8: (FIRE * 4) => POOL

    fire_5 = SqueezeNet.fire(pool_4, numSqueezeFilter=32,

    numExpandFilter=128)

    fire_6 = SqueezeNet.fire(fire_5, numSqueezeFilter=48,

    numExpandFilter=192)

    fire_7 = SqueezeNet.fire(fire_6, numSqueezeFilter=48,

    numExpandFilter=192)

    fire_8 = SqueezeNet.fire(fire_7, numSqueezeFilter=64,

    numExpandFilter=256)

    pool_8 = mx.Pooling(data=fire_8, kernel=(3, 3),

    stride=(2, 2), pool_type="max")

    ```


    At this point, at the deepest part of the network - we need to apply another module,
    dropout to reduce overfitting, a convolution to adjust the volume size to 13 x
    13 x 13, and globally averaging pooling to reduce the first 13 x 13 spatial dimensions
    to 1 x 1 x 1 classes:


    ```

    # Block #9-10: FIRE => DROPOUT => CONV => RELU => POOL

    fire_9 = SqueezeNet.fire(pool_8, numSqueezeFilter=64,

    numExpandFilter=256)

    do_9 = mx.Dropout(data=fire_9, p=0.5)

    conv_10 = mx.Convolution(data=do_9, num_filter=classes,

    kernel=(1, 1), stride=(1, 1))

    relu_10 = mx.akyReLU(data=conv_10, act_type="elu")

    pool_10 = mx.Pooling(data=relu_10, kernel=(13, 13),

    pool_type="avg")

    ```


    Our final code block handles flattening of the average pooling operation and creating
    the softmax output:'
