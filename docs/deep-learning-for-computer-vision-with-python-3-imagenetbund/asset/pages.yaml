- pgno: 142
  md: 'In this chapter, we are going to tackle Kaggle''s Facial Expression Recognition
    challenge [31] and claim a top-5 spot on the leaderboard. To accomplish this task,
    we are going to train a VGG-like network from scratch on the training data, while
    taking into account that our network needs to be small and fast enough to run
    in real-time on our CPU. Once our network is trained (and we have claimed our
    top-5 spot on the leaderboard), we''ll write some code to load the serialized
    model from disk and apply it to a video stream to detect emotions in real-time.


    However, before we started, it''s important to understand that as humans, our
    emotions are a constant fluid state. We are never 100% happy or 100% sad. Instead,
    our emotions mix together. "surprise" might also be feeling "happiness" (such
    as a surprise birthday party) or "fight" (if the surprise is not a welcome). And
    even during the "scared" emotion, we might feel hints of "anger".


    When studying emotion recognition, it''s important not to focus on a single class
    (as we sometimes do in other classification problems). Instead, it''s much more
    advantageous for us to look at the probability of each emotion and characterize
    the distribution. We''ll see later in this chapter, examining the distribution
    of emotion probabilities provides us with a more accurate gauge of emotion prediction
    than simply picking a single emotion with the highest probability.


    # 11. The Kaggle Facial Expression Recognition Challenge


    The Kaggle Emotion and Facial Expression Recognition challenge dataset consists
    of 27,809 images, each of which are 48 x 48 grayscale images (Figure 11.1). The
    faces have been automatically aligned such that they are approximately the same
    size in each image. Given these images, our goal is to categorize the emotion
    expressed on each face into seven distinct classes: angry, disgust, fear, happy,
    sad, surprise, and neutral.


    # 11.1 The FER13 Dataset


    The dataset used in the Kaggle competition was aggregated by Goodfellow et al.
    in their 2013 paper, Challenges in Representation Learning: A report on three
    machine learning contests [32].'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Chapter 11. Case Study: Emotion Recognition


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_143_0.png)


    Figure 11.1: A sample of the facial expressions inside the Kaggle: Facial Expression
    Recognition Challenge. We will train a CNN to recognize and identify each of these
    emotions. This CNN will also be able to run in real-time on your CPU, enabling
    you to recognize emotions in video streams.


    This expression dataset is called the FER13 dataset and can be found at the official
    Kaggle competition page and downloading the fer2013.tar.gz file:


    [http://pyimgg.com/a2so2](http://pyimgg.com/a2so2)


    The .tar.gz archive of the dataset is 92MB, so make sure you have a decent internet
    connection before downloading it. After downloading the dataset, you''ll find
    a file named fer2013.csv with three columns:


    +   * emotion: The class label.

    * pixels: A flattened list of 48 × 48 = 2,304 grayscale pixels representing the
    face itself.

    * usage: Whether the image is for Training, PrivateTest (validation), or PublicTest
    (testing).


    Our goal is now take this .csv file and convert it to HDF5 format so we can more
    easily train a Convolutional Neural Network on top of it.


    After I unpacked the fer2013.tar.gz file I set up the following directory structure
    for the project:


    ```

    fer2013

    | fer2013

    |--- hdf5

    |--- output

    ```


    Inside the fer2013 directory, I have included the contents of the unarchived fer2013.tar.gz
    file (i.e., the dataset itself). The hdf5 directory will contain the training,
    testing, and validation splits. Finally, we''ll save any training logs/plots to
    the output directory.


    # 11.1.2 Building the FER13 Dataset


    Let''s go ahead and setup our directory structure for this emotion recognition
    project:'
