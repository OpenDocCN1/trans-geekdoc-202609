    | max pool | 3×3 | 7×7×832 | 2 | | 256 | 160 | 320 | 32 | 128 |

    | inception (5a) | 1×1 | 7×7×1024 | 2 | | 256 | 160 | 320 | 32 | 128 | 128 |

    | inception (5b) | 3×3 | 7×7×1024 | 2 | | 392 | 384 | 48 | 128 | 128 |

    | avg pool | | 1×1×1024 | 1 | | | | | |

    | dropout (40%) | | 1×1×1024 | 1 | | | | | |

    | linear softmax | | 1×1×1000 | 1 | | | | | |


    > Figure 2.2: The GoogleLeNet architecture proposed by Szegedy. We''ll implement
    this architecture and replicate their capacity.


    2 x 2 . Dense CONV and POOL layers reduce our input volume size from 224 x 224
    x 3 all the way down to 56 x 56 x 64 (note how the spatial dimensions of the image
    drop).


    From another, each CONV layer is applied, where we use 192 x 3 x 3 filters. A
    POOL layer follows, reducing our spatial dimensions to 28 x 28 x 192. Next, we
    have two Inception modules (named 3a and 3b), followed by another POOL.


    To learn deeper features, we then stack Inception modules (4a-e), again followed
    by a POOL. Two more Inception modules are applied (5a and 5b), leaving us with
    an output volume size of 7 x 7 x 1024. Avoiding the usage of fully-connected layers,
    we can use global average pooling where we reduce the 7 x 7 volume to 1 x 1 x
    1024. Dropout can then be applied to reduce overfitting. Szegedy''s al. recommended
    for such networks – in this case, we''ll follow the original implementation as
    close as possible and use 40%. After the dropout, we apply only the fully-connected(1)
    layer in the entire architecture where the number of nodes is the total number
    of class labels (1,000) followed by a softmax classifier.


    # 8.1.3 Implementing GoogleLeNet


    Using the table detailed above, we can now implement GoogleLeNet using Python
