- pgno: 90
  md: '# 8. Training GoogLeNet on ImageNet


    In this chapter we are going to implement the full GoogLeNet architecture introduced
    by Szegedy et al. in their 2014 paper, *Going deeper with convolutions* [23].
    Both GoogLeNet and VGG were the top performers in the ImageNet Large Scale Visual
    Recognition challenge (ILSVRC) in 2014 with GoogLeNet slightly edging out VGG
    for the top #1 position. GoogLeNet also has the added benefit of being *significantly
    smaller than* VGG16 and VGG19 with only a 28.1MB model size versus the VGG, coming
    in at over 500MB.


    That is, it has been shown that the VGG family of networks:

    1. Achieve higher classification accuracy (in practice).

    2. Generalize better.


    The generalization, in particular, is that VGG is more used in transfer learning
    problems such as feature extraction and fine-tuning. Later iterations of GoogLeNet
    (which simply by the name of Inception *N* is the version released by Google)
    extend on the original GoogLeNet implementation and Inception module, bring further
    accuracy – that said, we tend to use VGG for transfer learning.


    Finally, it is also worth mentioning that many researchers (myself included) have
    had trouble replicating the original results by Szegedy et al. Independent ImageNet
    experiments, as we did using vfeat (an open source library for computer vision
    and machine learning), report both VGG16 and VGG19 outperforming GoogLeNet by
    a significant margin [24]. It is unclear why this is, but as we will find out
    in the remainder of this chapter, our GoogLeNet implementation does not outperform
    VGG, which is what we would expect from the original publication and ILSVRC 2014
    challenge. Regardless, it''s important for us to study this seminal architecture
    and to train it on the ImageNet dataset.


    # 8.1 Understanding GoogLeNet


    We''ll start off this section with a quick review of the Inception module, the
    novel contribution by Szegedy et al. in their seminal work. From there we''ll
    review the full GoogLeNet architecture that was used in the ILSVRC challenge.
    Finally, we''ll implement GoogLeNet using Python and mxnet.'
  merge: -1
  img_proc: true
- pgno: 91
  md: "# Chapter 8. Training GoogLeNet on ImageNet\n\n# 8.1.1 The Inception Module\n\
    \n![](img/7db52e410ee84ec5a30b3190e73b61d3_91_0.png)\n\nFigure 8.1: The original\
    \ Inception module used in GoogLeNet. The Inception module acts as a “same module\
    \ of the network. From computing $1 \times 1$, $3 \times 3$, and $5 \times 5$\
    \ convolutions within the same module of the network. From Szegedy et al., [2014]\n\
    \nThe Inception module is a four branch micro-architecture used inside the GoogLeNet\
    \ architecture (Figure 8.1). The primary purpose of the Inception is to learn\
    \ multi-scale features ($1 \times 1, 3 \times 3$, and $5 \times 5$ filters), then\
    \ let the network “decide” which weights are the most important based on the optimization\
    \ algorithm.\nThe *first branch* of the Inception module consists entirely of\
    \ $1 \times 1$ filters. The *second branch* applies $1 \times 1$ convolutions\
    \ followed by $3 \times 3$ filters. A smaller number of $1$ filters are learned\
    \ as a form of dimensionality reduction, reducing the number of parameters in\
    \ the overall architecture. The *third branch* is identical to the second branch,\
    \ however instead of learning $3 \times 3$ filters, it learns $5 \times 5$ filters.\n\
    The *fourth and final branch* in the Inception module is called the *pool projection\
    \ branch*. The pool projection applies $3 \times 3$ max pooling followed by a\
    \ series of $1 \times 1$ convolutions. The reasoning behind this is state-of-the-art\
    \ Convolutional Neural Networks 2014 applied usage of pooling. It was postulated\
    \ that to achieve high accuracy on the ImageNet dataset, the network must apply\
    \ pooling, hence why we see it inside the Inception module. We now know that pooling\
    \ is not a requirement in a network architecture and we can reduce volume size\
    \ through CDW layers [21, 25]; which was the prevailing thought at the time.\n\
    The output of the four branches are concatenated along the channel dimension,\
    \ forming a stack of filters, and then passed to the next layer in the network.\
    \ For a more detailed review of the Inception module, please refer to Chapter\
    \ 12 of the *Practitioner Bundle*.\n\n# 8.1.2 GoogLeNet Architecture\n\nFigure\
    \ 8.2 details the GoogLeNet architecture we will be implementing, including the\
    \ number of filters for each of the four branches of the Inception module. After\
    \ every convolution, it is *implicitly implied* (i.e., not shown to save space)\
    \ that a batch normalization is applied, followed by a ReLU activation. Typically\
    \ we would apply the batch normalization after the activation, but once again,\
    \ we will still stick to the original GoogLeNet implementation as possible.\n\
    We start off with a $7 \times 7$ convolution with a stride of $2 \times 2$ where\
    \ we are learning a total of 64 filters. A max pooling operation is immediately\
    \ appealed with a kernel size of $3 \times 3$ and a stride of"
  merge: -1
