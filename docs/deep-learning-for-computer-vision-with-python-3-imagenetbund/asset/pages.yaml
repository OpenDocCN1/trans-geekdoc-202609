- pgno: 294
  md: '# 17. Single Shot Detectors (SSDs)


    In our previous two chapters we discussed the Faster R-CNN Framework and then
    trained a Faster R-CNN to detect road signs in images. While Faster R-CNNs enabled
    us to achieve our goal, we found two problems that need to be addressed:


    +   1. The framework is complex, including multiple moving parts

    2. We achieved approximately 7~10 FPS — reasonable for a deep learning-based object
    detector, but not if we want true real-time performance


    To address these concerns we will review the Single Shot Detector (SSD) framework
    for object detection. The SSD object detector is entirely end-to-end, contains
    no complex moving parts, and is capable of super real-time performance.


    # 17.1 Understanding Single Shot Detectors (SSDs)


    The SSD framework was first introduced by Liu et al. in their 2015 paper, SSD:
    Single Shot Multbox Detector [61]. The Multbox component, used for the bounding
    box regression algorithm, comes from Szegedy (the same Christian Szegedy of Google''s
    Inception network) et al.’s 2015 paper,Scalable High Quality Object Detection
    [62].


    Combining both the regression technique with the SSD framework, we can create
    an object detector that reaches comparable accuracy to Faster R-CNN and obtain
    over 59~FPS — faster FPS can be obtained using smaller, more efficient base networks
    as well.


    In the first part of this section we will discuss the motivation behind SSDs,
    why they were created, and the problems they address in context of object detection.
    From here we review the SSD architecture, including the concept of MultiBox priors.
    Finally, we’ll discuss how SSDs are trained.


    # 17.1.1 Motivation


    The work of Girshick in their three R-CNN publications [43, 46, 51] is truly remarkable
    and has enabled deep learning-based object detection to become a reality. However,
    there are a few problems that both researchers and practitioners found with R-CNNs.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Chapter 17. Single Shot Detectors (SSDs)


    The first is that training required multiple phases. The Region Proposal Network
    (RPN) needed to be trained in order generate suggested bounding boxes before we
    could train the actual classifier to recognize objects in images. The problem
    was later mitigated by training the R-CNN architecture end-to-end, but prior to
    this, it discovered a tedious pre-training process.


    The second issue is training took too long. A (Faster) R-CNN consists of multiple
    components, including:


    +   1. A Regional Proposal Network

    2. A ROI Pooling Module

    3. The final classifier


    While all three fit together into a framework, they are still moving phases that
    slow down the entire production.


    The final issue, and arguably most important, is that inference was too slow –
    we could not obtain real-time object detection with deep learning.


    In fact we can see how SSD adapt to each of these problems by inspecting the name
    itself. The term Single Shot implies that both localization and detection are
    performed in a single forward pass of the network during inference time – the
    network only has to “look” at the image to obtain final detections


    It’s important to understand the significance of the single shot. Unlike R-CNNs
    that require refetching pixels from the original image or from the feature map,
    SSDs instead continue to propagate the feature maps, connecting the feature maps
    in a novel way that detects objects of various sizes and scales. As we’ll see,
    and according to Liu et al, the fundamental improvement in speed of SSD comes
    from eliminating bounding boxes and subsampling of pixels or features [61].


    The term Multbox from Szegedy et al’s original Multbox algorithm used for bounding
    regression [62]. It enables SSDs to localize objects of different classes, even
    if their bounding boxes overlap. In many object detection, overlapping objects
    of different classes are often suppressed into a single bounding box with the
    highest confidence.


    Finally, the detect identifies that we’ll not only localizing the (x,y)-coordinates
    of a set of objects, but also returning their class labels as well.


    # 17.2 Architecture


    Just like a R-CNN, an SSD starts with a base network. This network is pre-trained,
    normally on a large dataset such as ImageNet, enabling it to learn a rich set
    of discriminative features. We will use this network for transfer learning, propagating
    an input image to a pre-specified layer, obtaining the feature and moving forward
    to the object detection layers


    In the work of Liu et al., VGG16 was used [17], at the time of publication, VGG
    was found to provide better transfer learning accuracy/results than other network
    architectures. Today we would use ResNet [21, 22] or DenseNet [55] to obtain higher
    accuracy, or we swap in SNet [30] or MobileNet [53] for specific purpose. For
    the sake of the explanation of the SSD framework in this section, we use VGG as
    our base network.


    Figure 17.1 illustrates the SSD architecture. We utilize the VGG layers until
    conv_6 and then added to the architecture – these are the layers that make the
    SSD framework possible. As we see from the diagram, each of these layers are CONV
    layers as well. This behavior implies that our network is fully-convolutional:
    we can accept an input image of arbitrary size – we are no longer restricted by
    the 224 × 224 input requirements of VGG.


    We’ll review what these additional auxiliary layers do later in this chapter,
    but for the'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# 17.1 Understanding Single Shot Detectors (SSDs)


    # 295


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_296_0.png)


    Figure 17.1: A diagram of the Single Shot Detector (SSD) architecture. The SSD
    starts with a base network (typically pre-trained on ImageNet). By set of new
    CNN layers are used to replace CONV and POOL layers. Each CONV layer connects
    to the output FC layer. Combined with the (modified) MobileNet


    time being notice two important components:


    +   1. Progressively reduce the size in deeper layers, as we would be with a standard
    CNN

    2. Each of the CONV layers connects to the final detection layer.


    The fact that each feature map connects to the final detection layer is important
    — it allows the network to detect and locate objects at varying scales. Furthermore,
    this scale localization happens in a forward pass. No resample of feature maps
    is required, enabling SSDs to operate in an efficient feedforward manner — this
    is what makes SSDs fast and efficient.


    # 17.1.3 MultiBox, Priors, and Fixed Priors


    The SSD framework uses a modified version of Szegedy''s MultiBox algorithm [62]
    for bounding box proposals. This algorithm is inspired by Szegedy''s previous
    work on the Inception network — MultiBox uses both (1) a series of 1 × 1 kernels
    to reduce dimensionality (in terms of width and height) and (2) a series of 3
    × 3 kernels for feature-rich learning.


    The MultiBox algorithm starts with *priors*, similar to though not exactly like
    anchors from the Faster-CNN framework. The priors are fixed size bounding boxes
    whose dimensions have been pre-computed on the dimensions and locations of ground-truth
    bounding boxes for each class in the dataset.


    We call a “prior” as relying on Bayesian statistical inference, or more specifically,
    a *probability distribution*, where object locations will appear in an image.
    The priors are selected such that their Intersection over Union (IoU) is greater
    than 50% with ground-truth objects. It turns out that the problem, however, is
    that we need to pre-train the MultiBox predictor, undermining our goal of training
    a complete learning-based detector end-to-end.


    Luckily there is a solution: fixed priors — and it involves an anchor selection
    technique as R-CNNs.


    To visualize the concept of fixed priors, take a look at Figure 17.2. On the left
    have our original input image with ground-truth bounding boxes. Our goal is to
    generate feature maps that discretize the image into cells (middle and right)
    — this process will naturally happen as the image progresses through the CNN and
    the anchor spatial dimensions of our volumes become progressively smaller and
    smaller.


    Each cell in a feature map, to an anchor, has a small set of default bounding
    boxes (four of them) of varying aspect ratios. By discretizing the image into
    sized feature maps we are able to detect objects at different scales in the image'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Chapter 17. Single Shot Detectors (SSDs)


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_297_0.png)


    **Figure 17.2: Left:** The original image with ground-truth bounding boxes. **Middle
    and Right:** Generating feature map that discretizes the input image into cells
    of different sizes. Each (similar to an in Faster R-CNN terminology) has a set
    of default bounding boxes associated with it. The *smaller* the number of cells,
    the *larger* the object can be detected. The *larger* the number of cells, the
    *smaller* the object can be detected. (Credit: Figure 1 of Liu et al. [61])


    Understanding this process further, consider the middle $8 \times 8$ feature map.
    Here our bounding box priors are small, capable of localizing small objects. However,
    in the right $4 \times 4$ feature map are larger, capable of localizing larger
    objects.


    In the example from Liu et al., a $8 \times 8$ feature map, with the blue highlighted
    bounding prior, can be used to localize the dog in the image $4 \times 4$ feature
    map with the *roi* highlighted bounding box cross—the dog is much larger than
    the cat and this requires a discretized feature map with fewer cells.


    This process of discretization of feature maps (where spatial dimensions are subsequently
    reduced in the CNN combined with varying aspect ratios allows us to effectively
    localize objects of varying sizes, viewpoints, and ratios.


    Furthermore, like in Faster R-CNN, instead of predicting $(x, y)$ coordinates,
    we predict the bounding box offsets (i.e., deltas) for each class label.


    To make this point more clear, consider a bounding box consisting of two sets
    of $(x, y)$-coordinates with $b$ default priors per feature map cell with $c$
    total labels. The feature map spatial dimensions are $f = M \times N$, then we
    compute a map of $t = f \times b \times (4 + c)$ values for each feature map [61,
    63].


    Again, it''s important to keep in mind that for each predicted box we are also
    computing the probability of all classes inside the region rather than keeping
    only the bounding box with the largest probability across all classes. Computing,
    and retaining, the probability for the bounding boxes in a class-wise map enables
    us to detect overlapping objects as well.


    # 17.1.4 Training Methods


    When training a SSD we need to consider the loss function of the MultiBox algorithm
    which includes two components:


    +   1. Confidence loss


    +   2. Location loss


    Categorical cross-entropy loss is used for confidence, as it measures if we were
    correct in our class prediction for the bounding box. The location loss, similar
    to Faster R-CNN, with a smooth L1-loss, giving the SSD more leeway for close but
    not perfect localizations (i.e., the final predicted bounding box does not need
    to be just "close enough". Keep in mind that predicting bounding boxes that match
    the ground-truth is simply unrealistic.


    Before training your network you''ll also want to consider the number of default
    bounding boxes'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# 17.2 Summary


    used by the SSD — the original paper by Liu et al. recommends using four or six
    default boxes. You may adjust these numbers as you see fit, but you''ll typically
    want to keep them at the default recommended values. Adding more variations in
    scale and aspect ratio can potentially (but not always) enable you to detect more
    objects, but will significantly slow down your inference time.


    The same concept is true for the number of feature maps — you can include additional
    CDV blocks to the network, therefore increasing depth which leads to the likelihood
    of an object being correctly detected and classified. The tradeoff is again speed.
    The more layers you add, the slower the network wins.


    Liu et al. performed an extensive study of the tradeoffs between adding/removing
    the default bounding boxes and CDV blocks in their paper [61] — please refer to
    it if you are interested in more details on these tradeoffs.


    The SSD framework also includes a common object detection concept of hard-negative
    mining to increase accuracy. During the training process, cells that have a low
    IoU with ground-truth objects are treated as negative examples.


    By definition, most objects in an image will be contained in a small fraction
    of the image. It is possible that most of the image will be considered negative
    examples — if we use negative examples for an input, our proportions of positive
    to negative training examples would be utterly unbalanced.


    To ensure the number of negative examples do not overwhelm the number of positive
    ones, Liu et al. recommends keeping a ratio of negative to positive examples 3:1.
    Most SSD implementations will use this by sampling or provide it as a tunable
    parameter for the network.


    The SGD optimizer was used in the original paper to train end-to-end, but other
    optimizers can use Rprop or Adam, especially when fine-tuning an existing detection
    model.


    During prediction time, non-maximum suppression is used class-wise, yielding the
    final predictions from the network. Once, Liu et al. demonstrated SSDs comparable
    accuracy to their Faster R-CNN counterparts on a number of object datasets, including
    PASCAL VOC [58], COCO [59], and ILSRC [9].


    However, the major contribution is that SSDs can run at approximately 22 FPS on
    512 × 512 input images and 59 FPS on 300 × 300 images. Even higher FPS can be
    obtained by swapping out the VGG backbone network for a more computationally efficient
    MobileNet (although accuracy may decrease).


    # 17.2 Summary


    In this chapter we reviewed the fundamentals of the Single Shot Detector (SSD)
    framework. Unlike Faster R-CNNs which contain multiple moving parts and components,
    SSDs are unified, encapsulated in a single end-to-end network, making SSDs easier
    to train and capable of real-time object detection while still comparable accuracy.


    The primary criticism of SSDs is that they do not work well for small objects,
    because small objects may not appear on all feature maps — the more an object
    appears on a feature map, the more like the MultiBox algorithm can detect it.


    A common hack to address the problem is to increase the size of the input image,
    but that (1) reduces the speed at which SSD can run and (2) does not completely
    alleviate the problem of detecting small objects. If you are trying to detect
    objects that are small relative to the size of the input image you should consider
    using Faster-CNN instead. For further information on SSDs, refer to Liu et al.’s
    publication [61] with Eddie Forsson’s excellent introductory article [63].'
  merge: -1
  img_proc: true
