    |   |---|--- __init__.py\n|   |---|--- mxmetrics.py\n|---| nn\n|---|--- preprocessing\n\
    |---|--- utils\n```\n\nThe mxmetrics.py function will store our function to compute\
    \ the one-off evaluation metric. Defining mxnet callback metrics is unfortunately\
    \ not as easy as it is with Keras, so we'll need to take some care defining the\
    \ function. Open up mxmetrics.py and we'll get to:\n\n```\n# import the necessary\
    \ packages\nimport mxnet as mx\nimport logging\n\ndef one_off_callback(trainIter,\
    \ testIter, oneOff, ctxx):\n    def _callback(iterNum, sum, arg, out=None):\n\
    \        # construct a model for the symbol so we can make predictions\n     \
    \   # on our data\n        model = mx.mod.Module(symbol=symbol, context=ctxx)\n\
    \        model.bind(data=testIter.provide_data,\n                   label_shapes=testIter.provide_label)\n\
    \        model.params(arg, arg)\n\n        # compute one-off metric for both the\
    \ training and testing\n        # data\n        trainMAE = _compute_one_off(model,\
    \ trainIter, oneOff)\n        testMAE = _compute_one_off(model, testIter, oneOff)\n\
    \n        # log the values\n        logging.info(f\"Epoch {{{}}}: Train-one-off={:.5f}\"\
    .format(iterNum, trainMAE))\n        logging.info(f\"Epoch {{{}}}: Test-one-off={:.5f}\"\
    .format(iterNum, testMAE))\n\n        # return the callback method\n        return\
    \ callback\n```\n\nLines 2 and 3 import our required Pyton packages. We'll need\
    \ the logging package in order to log the one-off evaluation metric to the same\
    \ file as our training progress.\nFrom there, we define the actual callback function,\
    \ one_off_callback on Line 5. This function accepts four required parameters:\n\
    \n+   - trainIter: The training set.\n- testIter: The ImageIterator for either\
    \ validation or testing set.\n- oneOff: The dictionary of off mappings constructed\
    \ by the AgeGenderHelper class.\n- ctx: The context (e.g., CPU/GPU/ctx) that will\
    \ be used during the evaluation.\n\nIn order to turn this into a true \"callback\"\
    \ function, mxnet requires to define an encapsulated Python function (i.e., an\
    \ \"inner\" function) named _callback – those unfamiliar with encapsulated functions\
    \ should read this great introduction (http://pyimg.io/fbchc). Per the mxnet documentation,\
    \ the encapsulated _callback function must accept four parameters:"
