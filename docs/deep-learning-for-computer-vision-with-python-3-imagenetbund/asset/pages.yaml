    At this point, we have all the ingredients to train AlexNet on the ImageNet dataset.

    We have:


    +   1. A script to train the network.

    2. A script to plot training loss and accuracy over time.

    3. A script to evaluate the network.


    The final step is to start running experiments and apply the scientific method
    to arrive at AlexNet model weights that replicate the performance of Krizhevsky
    et.


    # 6.4 AlexNet Experiments


    When writing the chapters about this, especially related to training state-of-the-art
    architectures on ImageNet, I wanted to provide more than just code and example
    results. Instead, I wanted to show the actual "story" of how a deep learning practitioner
    runs various experiments to obtain a desirable result. Thus, almost every chapter
    contains a section like this where I create a hybrid of lab journey case study.
    In the remainder of this section, I''ll describe the experiments I ran, the results,
    and then describe the changes I made to improve the accuracy of AlexNet.


    When evaluating AlexNet performance, we normally use the BVLC AlexNet implementation
    by Caffeine rather than the original AlexNet implementation. This comparison is
    due to a number of reasons, including different data augmentations used by Krizhevsky
    et and the usage of the (now deprecated) Local Response Normalization layers (LRNs).
    Furthermore, the "CaffeNet" version of AlexNet tends to be more accessible to
    the scientific community. In the remainder of this section I''ll be comparing
    my results to the CaffeNet benchmark, but still referring back to the original
    Krizhevsky et al. paper.'
