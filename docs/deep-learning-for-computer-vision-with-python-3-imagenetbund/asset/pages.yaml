    # 14.5 Training Age and Gender Predictor


    Now that we have our record dataset generated as well as our one-evaluation metric
    implemented, let''s move on to train.py, script responsible for training both
    the age and gender CNNs. Our script will be able to handle both the age and gender
    CNNs due to our age_gender_config.py file - whatever we set the DATASET_TYPE to
    is what the CNN will be trained. Furthermore, the DATASET_TYPE also set relevant
    output directories inside age_gender_config. This is yet another great example
    of the use of configuration files being near identical to any of other projects
    in the ImageNet Bundle,

    Our train.py will review the file, we''ll start with our imports:


    ```

    # import the necessary packages

    from config import age_gender_config as config

    from pymagesearch.nn.convolution import MxAgeGenderNet

    from pymagesearch.utils import MxAgeGenderHelper

    from pymagesearch.mxcallbacks import one_of_callback

    import mxnet as mx

    import argparse

    import logging

    import pickle

    import json

    import os

    ```


    The most most important imports to take note of here are our MxAgeGenderNet implementation,
    the AgeGenderHelper, and our one_of_callback (Lines 3-5). From there, we can parse
    our command line arguments as we configure our logging file:


    ```

    # construct the argument parse and parse the arguments

    args = argparse.ArgumentParser()

    args.add_argument(''-c'', "checkpoints", required=True)

    args.add_argument(''--path'', "to output checkpoint directory")

    args.add_argument(''-p'', "prefix", required=True)

    args.add_argument(''--name'', "name of model prefix")

    args.add_argument(''-e'', "start-epoch", type=int, default=0)

    args.add_argument(''--epochs, "epoch to restart at")

    args = args.parse_args()

    ```


    ```

    # set the logging level and output file

    logging.basicConfig(level=logging.DEBUG,

    filename="training_{}.log".format(args["start_epoch\]),

    filemode="w")

    ```'
