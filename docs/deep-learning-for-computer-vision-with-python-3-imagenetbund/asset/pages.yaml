    \ num_filter=128, name=\"conv2_1\")nact2_1 = mx.LeakyReLU(data=conv2_1, act_type=\"\
    prelu\",\nname=\"act2_1\"\nbn2_1 = mx.sym.BatchNorm(data=act2_1, name=\"bn2_1\"\
    )\nconv2_2 = mx.sym.Convolution(data=bn2_1, kernel=(3, 3),\nnum_filter=128, name=\"\
