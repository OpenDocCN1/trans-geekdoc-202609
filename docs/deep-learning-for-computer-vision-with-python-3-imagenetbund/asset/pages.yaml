    3×3,512 ×9, 1×1,2048 | 1×1,512, 3×3,512 ×16, 1×1,2048 |


    Figure 9.2: Table 1 of ResNet architectures for ImageNet used by He et al. in
    their 2015 publication [21]. The residual modules are shown in brackets and are
    stacked on top of each other. The number of residual modules stacked can be increased
    by > n number to reach the targets.


    From here, we''ll starting residual modules on top of each other. To start, we''ll
    stack three residual modules (with bottleneck) to the bottleneck $K=256$ filters
    (the first two Conv layers will learn 64 filters, while the first Conv in the
    bottleneck will learn 256 filters). Downsampling via an intermediate Conv layer
    will then occur, reducing the spatial dimensions to $28 \times 28$.


    Then, four residual modules will be stacked on top of each other, each for learning
    $K=512$. Again, an intermediate residual module will be used to reduce the volume
    size from $28 \times 28$ to $14 \times 14$.


    Now we''ll stack more residual modules (the time, six of them) when $K=1024$.
    A residual downsampling is performed to reduce spatial dimensions to $7 \times
    7$, after each, we stack three residual modules to learn $K=2048$ features. After
    $7 \times7$ pooling is then applied (to remove the necessity of dense, fully-connected
    layers), followed by a softmax classifier. It''s interesting to note that there
    is no dropout applied to ResNet.


    I personally trained this version of ResNet50 from scratch on ImageNet using eight
    GPUs. Each epoch took approximately 1.7 hours, enabling me to complete a little
    over fourteen epochs in a single day.


    It takes hours of ResNet over two weeks to train the deepest variants of the architecture
    using 8 GPUs.


    The positive here is that it takes $\approx40$ days to successfully train ResNet
    (under three days). However, it''s likely not all of us have access to eight GPUs,
    let alone four GPUs. If you do access to eight GPUs, you should absolutely train
    the 50 and 101 layers of ResNet from scratch.


    However, if you have only two to three GPUs, I would recommend training more variations
    of ResNet by reducing the number of stages. If you have only one GPU, consider
    training ResNet18 or ResNet34 (Figure 9). While this version of ResNet will not
    obtain as a high accuracy as its deeper brothers and sisters, it will still get
    you practicing this seminal architecture. Again, keep in mind that ResNet and
    VGGNet are the most computationally expensive networks covered in this book. All
    other networks, including AlexNet, GoogLeNet, and SqueezeNet can be trained with
    fewer GPUs.


