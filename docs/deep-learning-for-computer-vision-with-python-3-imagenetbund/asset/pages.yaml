    \ preprocessor\ntrainAug = ImageDataGenerator(rotation_range=10, zoom_range=0.1,\n\
    \      horizontal_flip=True, resize=1 / 255.0, fill_mode=\"nearest\")\nvalAug\
    \ = ImageDataGenerator(rescale=1 / 255.0)\niap = ImageDataArrayPreprocessor()\n\
    ```\n\nAs expected, we will be applying data augmentation to the training set\
    \ to reduce overfitting and improve the classification accuracy of our model (Lines\
    \ 31 and 32). But you may be unfamiliar with using data augmentation to the validation\
    \ set (Line 33). Why would we not need to apply data augmentation to the validation\
    \ set? That is set to stay static and unchanging?\n\nThe answer lies in the rescale\
    \ attribute (which is also part of the data augmentation generator). Recall Section\
    \ 11.2 where we converted the fer2013.csv file to HDF5 dataset. We stored these\
    \ images as raw, unnormalized RGB images, meaning that pixel values are allowed\
    \ to exist in the range [0, 255). However, it is common practice to either (1)\
    \ perform mean normalization or (2) scale the pixel intensities to a more constrained\
    \ scale. Luckily for us, the ImageDataGenerator class can automatically perform\
    \ this for us. We need to provide a rescale value of 1/255—every image will be\
    \ multiplied by this, thus scaling the pixels to [0, 1].\n\nLet's initialize our\
    \ training and validation HDF5Dataset generators:\n\n```\n# initialize the training\
    \ and validation dataset generators\ntrainGen = HDF5DatasetGenerator(config.TRAIN_HDF5,\
