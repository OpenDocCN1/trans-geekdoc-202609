    On Layer 11 we initialize the shortcut branch as the input data to the module.
    This shortcut

    later be added to the output of our bottleneck.


    From there, Lines 14-19 define the BN -> RELU -> Conv pattern of the first 1 x
    1 block in

    the bottleneck. We call this "pre-activation" version of ResNet since we are applying
    the batch

    normalization and activation before the convolution. We also leave out the bias
    from the convolution

    (no_bias=True) as the biases are included in the bottleneck [29].

    Let''s move on to the second CNN which is responsible for learning 3 x 3 filters:


    ```

    # the second block of the ResNet module is 3x3 CNNs

    bn2 = mx.sym.BatchNorm(data=conv1, fix_gamma=False,

    eps=bneps, momentum=bnMom)

    act2 = mx.sym.Activation(data=act2, act_type="relu")

    conv2 = mx.sym.Convolution(data=act2, pad=(1, 1),

    kernel=(3, 3), stride=stride, num_filter=int(K * 0.25),

    no_bias=True

    ```


    The final CNN in the bottleneck module consists of K, 1 x1 filters:


    ```

    # the third block of the ResNet module is another set of i1

    # CONV

    b3 = mx.sym.BatchNorm(data=conv2, fix_gamma=False,

    eps=bneps, momentum=bnMom

    act3 = mx.sym.Activation(data=bn3, act_type="relu"

    conv3 = mx.sym.Convolution(data=act3, pad=(0, 0),

    kernel=(1, 1), stride=(1, 1), num_filter=K, no_bias=True

    ```


    In the case that we need to reduce the spatial dimensions of the volume, such
    as when we are in

    stages (red=true), we apply a final Conv layer with stride > 1:


    ```

    # if we are to reduce the spatial size, apply a CNN layer

    # to the shortcut

    if red:

    shortcut = mx.sym.Convolution(data=act1, pad=(0, 0),

    kernel=(1, 1), stride=stride, num_filter=K,

    no_bias=True


    # add the shortcut and the final CONV

    add = conv3 + shortcut


    # return the addition as the output of the ResNet module

    return add

    ```


    This allows us to use the insights from Springenberg al. [25] where we use

    convolutions with larger strides (rather than max pooling) to reduce volume. Notice
    how this

    case we apply the CONV to the output of act1, the first activation in the network.
    The reason we

    perform the CONV on the act rather than the raw shortcut is because (1) the data
    has not been

    batch normalized and (2) the input data is the output of an addition operation.
