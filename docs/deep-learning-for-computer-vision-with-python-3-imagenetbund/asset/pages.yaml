  md: '# Chapter 11. Case Study: Emotion Recognition


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_155_0.png)


    Figure 11.2: Training plot for EmotionVGGNet on FER2013 in Experiment #1. Past
    epoch has learning staggered.


    At epoch 30 I started to notice sharp divergence between the training loss and
    validation loss developing (Figure 11.3, left), so I stopped training and reduced
    the learning rate from $1e-3 to $1e-4$ and then allowed the network to train for
    another 15 epochs:


    ```

    $ python train_recognizer.py --checkpoints checkpoints \

    --model checkpoints/epoch_30.hdf5 --start-epoch 30

    ```


    However, the result was not good (Figure 11.3, right). As we can see, there is
    clear overfitting training loss continues to drop only when stagnates but continues
    to rise. All that said, the network was still holding 66.34% accuracy at the end
    of the 45th epoch, certainly better than SGD. If I could find a way to curb the
    overfitting, the Adam optimizer would perform very well in this situation.


    # EmotionVGGNet: Experiment #3


    A common issue is to gather more training data that is representative of your
    validation and testing set. However, since the FER2013 dataset is pre-compiled
    and we want our results to be relevant in terms of the Keras classifier, gathering
    additional data is out of the question. Instead, we can apply data augmentation
    to help reduce overfitting.


    In my third experiment, I kept my Adam optimizer, but also added in a random rotation
    range of 10 degrees along with a zoom range of 0.1 (the other augmentation parameters
    Keras provides not seem appropriate here). With the new data augmentation scheme
    in place, I repeated my second experiment:'
