    ```

    kernel=(3, 3), stride=(2, 2)

    do3 = mx.sym.Dropout(data=pool2, p=0.25)

    ```


    Next come our first set of fully-connected layers:


    ```

    # Block 4: first set of FC => RELU layers

    flatten = mx.sym.Flatten(data=do3)

    fc1 = mx.sym.FullyConnected(data=flatten, num_hidden=512)

    act4_1 = mx.sym.Activation(data=fc1, act_type="relu")

    bn4_1 = mx.sym.BatchNorm(data=act4_1)

    do4 = mx.sym.Dropout(data=bn4_1, p=0.5)

    ```


    Unlike the AlexNet architecture where 4096 hidden nodes are used, we only learn
    512 nodes here. We also use an activation followed by a batch normalization in
    this layer as well. The first set of fully connected layers is then applied:


    ```

    # Block 5: second set of FC => RELU layers

    fc2 = mx.sym.FullyConnected(data=do4, num_hidden=512)

    act5_1 = mx.sym.Activation(data=fc2, act_type="relu")

    bn5_1 = mx.sym.BatchNorm(data=act5_1)

    do5 = mx.sym.Dropout(data=bn5_1, p=0.5)

    ```


    Our final code is simply an FC to learn the desired number of classes, along with
    a softmax:


    ```

    # softmax classifier

    fc3 = mx.sym.FullyConnected(data=do5, num_hidden=classes)

    model = mx.sym.SoftOutput(data=fc3, name="softmax")


    # return the network architecture

    return model

    ```


    In terms of networks, MxAgeGeneratorNet is arguably the simplest architecture
    we have designed during the entirety of the ImageNet Bundle. However, as our results
    demonstrate, this sequential network architecture is not only able to replicate
    the results of Levi et al., but *improve* on their work as well.


    # 14.4 Measuring "One-off" Accuracy


    As mentioned in Section 14.2.1 above, when training and evaluating MxAgeGeneratorNet
    on the dataset, we want to count "one-off" accuracy. Unlike rank-5 accuracy, this
    metric gives a prediction as "correct" if the predicted label is either (1) the
    ground-truth label or (2) adjacent to the ground-truth label.


    In practice, this evaluation metric makes practical sense, and discriminating
    age is often highly subjective and correlated with genetics, appearance, and environmental
    factors. For example, an 18 year old man who smokes a carton of cigarettes for
    20 years will likely look much older than the biologically correct 38 year old
    man.


    To create our special one-off metric, let''s create a new sub-module inside pymagesagesarch
    named mxcallbacks, and inside this sub-module, we''ll place a new file - mxmetrics.py:'
