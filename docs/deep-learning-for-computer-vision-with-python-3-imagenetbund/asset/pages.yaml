    # 14.3 Implementing Our Network Architecture


    The network architecture used by Levi et al. is similar to AlexNet (Chapter 6),
    only:


    +   1. More shallow with multiple CNN => RELU layers stacked on top of each other.

    2. Fewer nodes in the fully-connected layers.


    We will replicate their exact architecture, with two exceptions. First, we will
    utilize batch normalization than the now deprecated Local Response Normalization
    (LRN) used in earlier CNN architectures. Secondly, we will introduce a small amount
    of dropout after every pooling layer to help reduce overfitting.


    Let''s go ahead and implement the Levi et al. architecture, which we will call
    MxAgegenderNet. Create a new file mxagegender.py inside the nr mxconv sub-module
    of pimagesearch:


    ```

    --- pimagesearch

    |--- __init__.py

    |--- callbacks

    |   --- nn

    |   |--- __init__.py

    |   |--- conv

    |     ||--- __init__.py

    |     ||--- mxagegender.py

    |     ||--- mxalexnet.py

    |     ||--- mxgooglen.py

    |     ||--- mxresnet.py

    |     ||--- msqueenet.py

    |     ||--- mxvggnet.py

    |--- preprocessing

    |--- utils

    ```'
