    Chapter 15. Faster R-CNNs


    The next step in the pipeline is to propagate the ROI and deltas to the Region
    of Interest

    (ROI) Pooling module (Section 15.2.5), but let''s first discuss how we might train
    the RPN.


    # Training the RPN


    During training, we take our anchors and put them into two different buckets:


    +   * **Bucket #1 — Foreground:** All anchors that have a 0.5 IoU with a ground-truth
    object

    bounding box.

    * **Bucket #2 — Background:** All anchors that have < 0.1 IoU with a ground-truth
    object.

    Based on these buckets we randomly sample between the two to maintain an equal
    ratio between

    background and foreground.


    From there, we need to consider our loss functions. In particular, the RPN module
    has two

    functions associated with it. The first loss is for classification which measures
    the accuracy

    of RPN predicting regression vs. background (binary cross-entropy works nicely).


    The second loss is for bounding box regression. This loss function operates on

    t foreground anchors as backgrounds which would have no sense of a bounding box
    (and we

    should already detected "background" and discarded it).

    For the bounding regression loss function, Girshick et al. utilized a variant
    or L1 loss

    coordinates of a bounding box (addressed in Section 15.1.1), Smooth L1 loss loses
    bounding

    box that are \u201cssufficient close” to their corresponding ground-truth boxes
    to be essentially correct

    and thereby diminish the impact of the loss.


    # 15.2.5 Region of Interest (ROI) Pooling


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_259_0.png)


    Figure 15.9: The goal of the Region of Interest ROI Pooling module is to take
    all N proposal

    locations and extract the corresponding ROI features from the convolutional feature
    map.

    The ROI Pooling module resizes the dimensions of the extracted features for the
    ROI down to

    7 x D x D (where D is the depth of the feature map). This fixed size prepares
    the features for the two

    upcoming FC layers in the next module.


    The goal of ROI Pooling module is to accept all N proposal locations from the
    RPN module

    and crop output features from the convolutional feature map in Section 15.2.2
    (Figure 15.9).

    Cropping features is accomplished by:


    +   * Using slicing to extract the corresponding patch from the feature map

    * Resizing to 14 x 14 x D where D is the depth of the feature map

    * Applying a max pooling operation with 2 x 2 strides, yielding a 7 x 7 x D feature
    vector.'
