- pgno: 300
  md: '# 18. Training a SSD From Scratch


    In our last chapter we discussed the inner workings of the Single Shot Detector
    (SSD) from Liu et al. Now that we have an understanding of the SSD framework we
    can use the TensorFlow Object Detection API (TFOD API) to train a SSD on dataset,
    similar to Chapter 16 where we trained a Faster-CNN using the TFOD API.


    We''ll be continuing the theme of deep learning for self-driving cars by training
    a SSD to recognize both the front and rear views of vehicles using a vehicle dataset
    curated and labeled by David King''s dib [40]. Not only will this process give
    us increased exposure to working with the TFOD API and toolkit, but it will also
    give us additional insight into the limitations of the TFOD API and what types
    of datasets can be more challenging to train than others due to hard-negative
    mining.


    # 18.1 The Vehicle Dataset


    The dataset we are using for this example comes from Davis King''s dib library
    [40] and was hand annotated by King using usage of a max-margin object detection
    algorithm [64, 65].


    Each image in this dataset was captured from a camera to a car''s dashboard. For
    each image, visible front and rear views of vehicles are labeled as such. An example
    of such vehicle annotations in the dataset can be found in 18.1.


    +   1. Areas where a large number of cars are in a compact area where it is not
    clear where one car begins and the other ends


    +   2. Vehicles at a distance that are too small to be 100% visually recognizable,
    but the CNN still "see" them and learn patterns from them'
  merge: -1
  img_proc: true
