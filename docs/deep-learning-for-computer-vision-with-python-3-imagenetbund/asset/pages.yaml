    # 10.4 SqueezeNet Experiments


    In 2016, Iandola al claim that SqueezeNet could achieve AlexNet-level accuracy
    with 50x fewer parameters. I would define AlexNet accuracy in the range of 55-58%
    rank-1 accuracy. Thus, if our version of SqueezeNet can fall inside this range
    of rank-1 accuracy, I will call our reproduction of the experiment a success.


    Like in previous chapters, I will explain my baseline experiments, discuss what
    I modified parameters before the next experiment, and what I didn''t. In total,
    I required four experiments to replicate the results of Iandola al. You can find
    the results of my experiments below – use these results to help you when performing
    your experiments of yours.


    It''s not just the result that matters, it''s the scientific method of designing
    an experiment, running it, getting the results, and tuning the parameters that
    are critical. To make a true deep learning experience, you need to study the path
    that leads to an optimal CNN, not the end result. Reading case studies as they
    will help you understand this.


    # 10.4.1 SqueezeNet: Experiment #1


    In my first SqueezeNet experiment I attempted to replicate the work of Iandola
    al. by using their architecture and optimizer parameters. Instead of using ELUs
    as reported in the implementation section above, I used ReLUs. I used an initial
    learning rate of 4e-2, as recommended by the original paper. To start the training
    process, I executed the following command:


    ```

    $python train_squeezenet.py --checkpoints checkpoints --prefix squeezezenet

    ```


    I monitored my training process, but was not noticing significant volatility in
    the training process, especially during epoch 15 and epochs in the early 20s (Figure
    10.3, top-left). In the latter case, accuracy plummeted all the way down to 0.9%,
    but was able to recover. After epoch 25 I decided to lower the learning rate from
    4e-2 to 4e-3 to see if this lower learning rate helped stabilize the network:'
