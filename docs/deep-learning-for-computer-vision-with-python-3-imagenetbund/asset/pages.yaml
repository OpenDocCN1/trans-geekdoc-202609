    # 16.3 A Critical Pre-Training Step


    At this point we can proceed to training our Faster R-CNN; however, I want to
    end with a word of warning:

    **One of the biggest mistakes I see deep learning developers, students, and researchers
    make is rusting and not double-checking their work when building a dataset.**

    Your school project is due tonight at midnight, your boss is breathing down your
    neck for the latest and greatest model, or you''re simply tinkering with deep
    learning as a hobby, be warned: rushing will only cause you problems, **especially
    in the context of object detection**.

    Keep in mind that when working with more **the bounding box coordinates themselves**.
    Often I see people their code is correct, and if the script executes and completes
    without error, then everything may be ok. Don''t fall into this trap.


    Before you even think about training your network, double-check your code. In
    particular, through Lines **98-111** we build the bounding box and class label
    for a given image. You should *visually validate* your code is doing via OpenCV
    as you think it should:


    +   1. Loading the image from bbox

    2. Drawing the box coordinates on the image by scaling xMin, xMax, yMin, and yMax
    back to standard integer coordinates

    3. Drawing the class label on the image well


    Below I have a code segment on how I perform this process:


    ```

    # over the bounding boxes + labels associated with

    # the image

    # for (label,startX, startY, endX, endY) in D[:

    # TensorFlow assumes all bounding boxes are in the

    # range [0, i] so we need to scale them

    xMin = startX / w

    Max = endX / w

    yMin = startY / h

    yMax = endY / h


    # load the input image from disk and denormalize

    # bounding box coordinates

    cv2.imread(k)

    startX = int(xMin * w)

    startY = int(yMin * h)

    endX = int(xMax * w)

    endy = int(yMax * h)


    # draw the bounding box on the image

    cv2.rectangle(image, startX, startY, endX, endY),

    (0, 255, 0), 2)

    ```'
