  md: '# 14.5 Training Our Age and Gender Predictor


    The --checkpoints switch controls the path to where we will store the serialized
    weights for MxAgeGenet after every epoch. The --prefix switch controls the name
    of the CNN. And, if we are restarting training from a previous epoch, we can specify
    exactly which epoch via --start-epoch.


    We''ll also need to set our batchSize based on the BATCH_SIZE and NUM_DEVICES
    in the config module:


    ```

    # determine the batch and load the mean pixel values

    batchSize = config.BATCH_SIZE * config.NUM_DEVICES

    means = json.loads(config.DATASET_MEAN).read())

    ```


    We load our RGB means for either the age or gender dataset, respectively. Let''s
    go ahead and create our training data:


    ```

    # construct the training image iterator

    trainiter = mx.ImageRecordIter(

    path_imgrec=config.TRAIN_MX_REC,

    data_shape=(3, 227, 227),

    batch_size=batchSize,

    rand_crop=True,

    rand_mirror=True,

    mean_r=means["R],

    mean_g=means["G],

    mean_b=means["B],

    preprocess_threads=2)

    ```


    Since our images are pre-aligned in the Advice dataset, we don''t want to allow
    much rotation, so a rotate of +-7 seems appropriate here. We''ll also randomly
    crop 227 x 227 regions from the 256 x 256 image by specifying the rand_crop flag.
    We''ll also need a validation data iterator:


    ```

    # construct the validation image iterator

    valIter = mx.ImageRecordIter(

    path_imgrec=config.VAL_MX_REC,

    data_shape=(3, 227, 227),

    batch_size=batchSize,

    mean_r=means["R],

    mean_g=means["G],

    mean_b=means["B"]

    ```


    Levi et al. used the SGD optimizer to train our network - we''ll do the same with
    a base learning rate of 1e-4, momentum of 0.9, and L2 weight decay of 0.0005:


    ```

    # initialize the optimizer

    opt = mx.optimizer.SGD(learning_rate=1e-3, momentum=0.9, ud=0.0005,

    rescale_grad=1.0 / batchSize)

    ```


