- pgno: 281
  md: '# Chapter 16. Training a Faster R-CNN From Scratch


    # 16.3.7 Training the Faster R-CNN


    We are now ready to train our Faster R-CNN + ResNet-101 architecture in the LISA
    Traffic Signs dataset! It may seem like it has a lot of steps to get to this,
    but keep in two key aspects:


    +   1. The TFOD API is meant to be extensible, readable, and configurable so that
    there will be more configuration files. Using these configuration files is actually
    a benefit to you, which enables us to write clean code and focus on the actual
    model parameters.

    2. The process becomes significantly easier the more and more you run these experiments.
    Since we are using the TFOD API, we do not have to write any code to launch the
    training process—the only custom code required on part is to build the record
    dataset, as we have done in the previous sections. From there, the scripts provided
    in the models/research/object_detection directory of the TFOD API can be used
    to train and evaluate our networks.


    Training can be started using the following command (make you source the setup.sh
    script to export your PYTHONPATH then run this command):


    ```

    $ python object_detection/train.py --logostderr \

    --pipeline sds_and_rcnn/lisa/experiments/training/faster_cnn_lisa.config \

    --train_dir sds_and_rcnn/lisa/experiments/training

    INFO:Starting Session.

    INFO:Starting Gauss.

    INFO:global_step/sec: 0

    INFO:Recording summary at step 0.

    INFO:global step 1: loss = 2.3321 (5.715 sec/step)

    INFO:global step 2: loss = 2.1641 (0.660 sec/step)

    ```


    Notice how the --pipeline switch points to our faster_cnn_lisa.config file. The
    --train-dir switch points to our training subdirectory inside data.


    The paths to the input files and directories can be quite long, so for convenience,
    I have created a sym-link for the sds_and_rcnn directory to the models/research
    directory, enabling me to save less time typing and debugging log files. You may
    wish to use this tactic as well.


    While the above command will start the network, we need a second command to evaluate.
    Use one second terminal and execute the following command:


    ```

    $ python object_detection/eval.py --logostderr \

    --pipeline_config_path sds_and_rcnn/lisa/experiments/training/faster_cnn_lisa.config
    \

    --checkpoint_dir sds_and_rcnn/lisa/experiments/training \

    --eval_dir sds_and_rcnn/lisa/experiments/evaluation

    ```


    Here we use:


    +   --pipeline_config_path which points to our faster_cnn_lisa.config file

    -- --checkpoint_dir which is the path to the training subdirectory and where all
    checkpoints will be saved during training

    -- --eval_dir, which is the path to the evaluation subdirectory where the evaluation
    logs will be stored'
  merge: -1
