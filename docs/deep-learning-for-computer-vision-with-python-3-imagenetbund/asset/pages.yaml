    Our first residual_module (Lines 74 and 75) is designed to reduce the spatial
    dimensions of our input volume by 50% (stride=(2, 2)). However, this is our first
    stage of residual modules, we will set the stride=(1, 1) to ensure the spatial
    dimension is not reduced. From, Lines 78-81 handle stacking residuals.


    Keep in mind that stacking is simple as list. When we implement our train_resnet.py
    script, stages will be set to (3, 4, 6, 3), which implies that the first stage
    of ResNet will consist of three residual modules stacked on top of each other.
    These three residual modules will be backed, we go to Lines 73-75 where we reduce
