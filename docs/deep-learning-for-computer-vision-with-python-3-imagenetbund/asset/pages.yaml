    bnEps=bnEps, bnMom=bnMom

    act2_1 = mx.sym.Activation(data=bn2_1, type="relu")

    pool = mx.sym.Pool(data=act2_1, pool_type="avg")

    global_pool=True, kernel=(7, 7))

    ```


    Keep in mind that after our final set of residual modules, our output volume has
    the spatial dimensions 7 x 7 classes. If we apply average pooling over the 7 x
    7 region, we will be left with an output volume of size 1 x 1 x classes – reducing
    the output volume in such a way is also called global pooling.


    The last step is to simply construct a single FC layer with our number of classes
