  md: '# 50


    # Chapter 5. Preparing the ImageNet Dataset


    # 5.2.4 Building the Compact Record Files


    Now that we have the .lst files, building a .rec file for each of the individual,
    testing, and validation files is a breeze. Below you can find my example command
    to generate the train.rec file using im2rec binary:


    ```

    $ /mxnet/bin/im2rec /raid/datasets/imagenet/lists/train.lst "\ /raid/datasets/imagenet/train.rec
    \ resize=256 --.jpg \ quality=100

    ```


    On my system, I compiled the mxnet library in my home directory; therefore, the
    path to im2rec is /mxnet/im2rec. You may need to adjust this path if you compiled
    mxnet. Another alternative is to place the im2rec binary on your PATH.


    The first argument to im2rec is the path to our train.list file – this path must
    match the TRAIN_MX_LIST variable in image_alexnet_config.py. The second argument
    is blank empty string. If you have already defined the full path to the images
    on disk include . we can simply simplify this parameter blank. Then we have the
    final parameter to im2rec – this is the path to our output record database, where
    our images and class labels will be stored. Your path should match the TRAIN_MX_REC
    variable in image_alexnet_config.py.


    Next, we supply three options to im2rec:


    +   1. resize: Here we indicate that our image should be resized to 256 pixels
    during resizing. Resizing not only reduces the resolution of the image (reducing
    size) but also lets us perform either JPEG or PNG encoding. We''ll use JPEG encoding
    to save disk space as it''s a lossy format. The PNG is a lossless, but will result
    in much larger .rec files. Furthermore, we should be worried about a small amount
    of JPEG artifacts exist in real-world images and can be viewed as type of data
    augmentation.

    2. quality: This value is the image quality of either the JPEG or PNG image. For
    JPEG images, this value ranges from 1-100 (the larger the value, the less compression/artifacts
    introduced, but resulting in a larger file size). For PNG images, this value will
    range from 1-9. In this, we''ll supply a JPEG value of 100 to not further introduce
    artifacts.


    As the output below, converting the .lst files into record files is time consuming
    each of the ≈ 1.2million images needs to be loaded from disk, resized, and stored
    in the dataset:


