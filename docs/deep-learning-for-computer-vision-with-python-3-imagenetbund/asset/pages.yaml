- pgno: 283
  md: '# Chapter 16. Training a Faster R-CNN From Scratch


    listed suggestions for training your networks to help you (1) avoid errors entirely
    and (2) resolve

    when they appear.


    # 16.3.8 Suggestions When Working with the TFOD API


    This section includes a number of recommendations and best practices I personally
    utilize whenever

    working with the TFOD API. Take time to carefully read this section as it will
    help you diagnose

    errors and better train your object detection networks.


    # Accept there is a Learning Curve


    The first thing you need to accept is that there is a learning curve when using
    the TFOD API — and

    there is no way around it. When you utilize the TFOD API, do not expect all scripts
    to work

    outof-the-box.


    To be frank, it''s unrealistic. My suggestion would be to set aside at least one
    to two days (de-

    pending on your experience level with Python, Unix systems, and diagnosing errors)
    to familiarize

    yours with the API.


    If you expect your entire pipeline to be up and running under an hour, especially
    if this is the

    first time you''ve used the TFOD API, your expectations are not aligned with reality
    — that''s not

    how state-of-the-art deep learning works.


    Don''t become annoyed. Don''t assume any confusion or frustration,

    Don''t leave your work immediately to your colleague, coworker, or fellow student

    for help. Errors with these tasks will be expected.


    Starting by taking a deep breath and take the time to diagnose the error, and
    accept, except

    for a learning curve — the trace stacks produced by TensorFlow are typically helpful
    and include

    what the error is (although you may need to scroll through the output to find
    exactly what the

    error can be a bit verbose)


    In many situations the errors you run into will likely be due to not updating
    your

    Python path or your files paths. Always double-check your files paths!


    # Replicate Known Results First


    My recommendation is to train your first R-CNN on the LISA Traffic Sign dataset

    dwe in this chapter. Whether or not you train the network over 50,000 steps is
    up to you, but I

    would for at least 2,500 steps so you can validate your training and evaluation
    pipeline

    properly — accuracy will still be point but you''ll be able to determine

    if the network is actually learning.


    Too often I see deep learning students, engineers, researchers, and practitioners
    try to immedi-

    ately:


    +   1. Swap out the eigene datasets

    2. Plug in their own data

    3. Attempt to train the network

    4. And become confused when there are errors or poor results


    Don''t do this. There are too many moving parts to implement in your own dataset.

    Need to learn how to use the TFOD API before you train a network on your own dataset.

    Regardless if you are facing a project deadline, trying to complete your graduation/capstone

    requirement, or simply trying with a hobby project, the simple fact is this:


    There is no excuse for first replicating the results discussed here before you

    y work with your own data. The rationale behind this thought goes back to the
    scientific method —

    don''t change too many variables at one time.


    Right now your goal is to get to top of the TFOD API learning curve. The best
    way to get

    to the top of the learning curve is to work with a dataset and example where you
    can clearly see the

    expected results — replicate these results before you move on to other experiments.'
  merge: -1
  img_proc: true
