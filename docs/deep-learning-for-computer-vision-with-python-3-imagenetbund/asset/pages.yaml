    Lines 31-42 define the ImageRecordIterator for reading our batches of images from
    our training record. We indicate that each output image from the iterator should
    be resized to 227 × 227 pixels while applying data augmentation, including random
    cropping, random marking, random rotation, and shearing. Mean subtraction is also
    applied inside the iterator as well.

    to speed up input (and ensure we are not waiting on new samples from the data
    iterator), we can provide a value for preprocess_threads generates N threads that
    pool image batches for the iterator and apply augmentation. I''ve found a good
    rule of thumb is to set the number of preprocess_threads to be double the number
    of devices we are using to train the network.

    Just as we use our validation data, we also need to access our validation:


    ```

