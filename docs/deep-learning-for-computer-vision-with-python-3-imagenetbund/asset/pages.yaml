  md: "# 16.3 Training Your Faster R-CNN\n\n# Export Your PYTHONPATH\n\nAnother common\
    \ error I see is failing to update your PYTHONPATH when executing either (1) the\
    \ scripts include the models/research directory of the TFOD API or (2) trying\
    \ to import files from the TFOD API. If you forget to update your PYTHONPATH your\
    \ error will look similar to:\n\n```\n$ python build_lisa_records.py\nTraceback\
    \ (most recent call last):\n  File \"build_lisa_records.py\", line 6, in <module>\n\
    \    from ymagesearch.utils.tfannotation import TFAnnotation\n  File \"/home/admin/virtualenv/lib/python3.4/site-packages/ymagesearch/utils/tfannotation.py\"\
    , line 2, in <module>\n    from object_detection.utils.dataset_util import bytes_list,list_feature\n\
    ImportError: No module named 'object_detection'\n```\n\nHere we are trying to\
    \ execute build_lisa_records.py which is to import functions from the object_detection\
    \ sub-module of the TFOD API however, since our PYTHONPATH is not properly set,\
    \ the import fails.\n\nIn this case verify your PYTHONPATH using the setup.sh\
    \ script or manually via your shell:\n\n```\n$ setup.sh\n$ python build_lisa_records.py\n\
    [INFO] processing 'train'...\n[INFO] processing 'test'...\n```\n\nFrom there you\
    \ will be able to find the TFOD API libraries.\n\n# Cleanup Your “training” Directory\n\
    \nWhen training my networks I encountered a strange bug where my network training\
    \ would dramatically slow down if I didn't accidentally delete all files in my\
    \ training directory besides my faster_rnn_resnet101_coco_2018_01_28.tar.gz and\
    \ faster_rnn_resnet101_coco.config files.\n'm not entirely sure why this is, but\
    \ if your networks are training slower or your results don't seem right, stop\
    \ training and clean up the training directory:\n\n```\n$ cd libs/experiments/training/\n\
    $ rm checkpoint graph.pbxt pipeline.config\n$ rm events.*\\n$ rm -rf faster_rnn_resnet101_coco_2018_01_28\n\
    $ tar -xvf faster_rnn_resnet101_coco_2018_01_28.tar.gz\n$ ls -1\n```\n\n```\n\
    faster_rnn_lisa.config\nfaster_rnn_resnet101_coco_2018_01_28\nfaster_rnn_resnet101_coco_2018_01_28.tar.gz\n\
    ```\n\nHere you can see that I deleted checkpoints (including the original Faster\
    \ R-CNN model pre-trained on COCO) and all events. From there, restart training.\
    \ Again, this bug/behavior might be specific to my machine or my particular setup,\
    \ but I wanted to share it with you."
