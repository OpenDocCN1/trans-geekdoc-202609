  md: '# 126 Chapter 10. Training SqueezeNet on ImageNet


    +   2. numSqueezeFilter: The number of squeeze filters to learn.

    3. numExpandFilter: The number of expand filters to learn. As perandola al. implementation,
    we will be using the same number of expand filters for both the 1 x 1 and 3 x
    3 convolutions, respectively.


    Line 20 makes a call to the squeeze function, reducing our input spatial dimensions.
    Based off squeeze_x1, we can compute the 1 x 1 expand on Lines 21 and 22. Here
    indicate that the input to the CBW layer should be the squeeze_x1 output and that
    we wish to learn numExpandFilter, each of size 1 x 1. An ELU is applied to the
    output of the convolution on Lines 23 and 24.


    We perform a similar operation for the 3x3 expand


    ```

    # construct the 3x3 expand

    expand_3x3 = mx.sym.Convolution(data=squeeze_x1, pad=(1, 1),

    kernel=(3, 3), stride=(1, 1), num_filter=numExpandFilter)

    relu_expand_3x3 = mx.sym.LeakyReLU(data=expand_3x3)

    act_type=(\elu")

    ```


    ```

    # the output of the FIRE module is the concatenation of the

    # activation for the 1x1 and 3x3 expands along the channel

    # dimension

    output = mx.sym.Concat(relu_expand_x1, relu_expand_3x3,

    dim=1)

    ```


    ```

    # return the output of the FIRE module

    return output

    ```


    We thus learn numExpandFilter, each of which are 3x3 using squeeze_x1 as an input.
    We use 1x1 padding to ensure the spatial dimensions are not reduced so we can
    concatenate along the channel dimension later in function. An ELU is then applied
    to the output of expand_3x3. Once we have the activations for the 1x1 and 3x3
    expands, we can concatenate them along the channel on Lines 35 and 36. This concatenation
    is returned to the calling method on Line 39.

    To visualize the FIRE module, please refer to Figure 10.1. Here we can see that
    it takes an input layer and applies a squeeze, which then branches into two forks.
    In one fork we compute the 1 x expand, while the second fork computes the 3 x
    expand. The two meet and are concatenated along the channel dimension to serve
    as the final output of the channel module.

    Let''s continue our discussion on implementing SqueezeNet as we have reached all
    the important method:


    ```

    @staticmethod

    def build(classes):

    # data input

    data = mx.sym.Variable("data")

    ## Block 1: CONV -> RELU -> POOL

