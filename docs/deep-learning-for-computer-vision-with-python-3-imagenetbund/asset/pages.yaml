  md: "256 Chapter 15. Faster R-CNNs\n\nGirchick et al., called anchors, is a clever\
    \ and novel one.\n\n![](img/7db52e410ee84ec5a30b3190e73b61d3_257_0.png)\n\n**Figure\
    \ 15.7: Left:** Creating anchors starts with the process of sampling the coordinates\
    \ of an image every $r$ pixels ($r = 16$ in the original Faster R-CNN implementation).\
    \ **Right:** We create a total of nine anchors centered around each sampled $(x,\
    \ y)$-coordinate. In this visualization, $x = 300$, $y = 200$ (center blue coordinate).\
    \ The nine total anchors come from every combination of scale: $64 \times 64$\
    \ (red), $128 \times 128$ (green), $256 \times 256$ (blue); and aspect ratio:\
    \ $1 : 1$, $2 : 1$, $1 : 2$.\n\nInstead of trying to predict the raw $(x,y)$-coordinates\
    \ of the bounding boxes, we can learn to predict their offsets from the reference\
    \ boxes, namely: $\\Delta_{center}$, $\\Delta_{center}$, $\\Delta_{width}$, and\
    \ $\\Delta_{height}$. These delta values allow us to obtain a better fit to our\
    \ reference box without having to predict the actual $(x,y)$-coordinates, enabling\
    \ us to bypass the potentially impossible problem of encoding bounding box 'rules'\
    \ into the network.\n\nSo where do these reference boxes come from? We need to\
    \ generate the anchors ourselves using a Selective Search algorithm. To accomplish\
    \ this, we first need to uniformly sample points across an input image (Figure\
    \ 15.7, left). Here we can see an image that is $600 \times 400$ pixels — we have\
    \ labeled each point at a regularly sampled integer (at an interval of sixteen\
    \ pixels) with a blue circle.\n\nThe next step is to create a set of anchors at\
    \ each of the sampled points. In the original Faster R-CNN publication, we would\
    \ generate nine anchors (which are fixed bounding boxes) with varying sizes and\
    \ aspect ratios surrounding a given sampled point.\n\nThe colors of the boxes\
    \ are scale/sizes, namely: $64 \times 64$, $128 \times 128$, and $256 \times 256$.\
    \ For each scale we also have the aspect ratio: $1 : 1$, $1 : 2$, and $2 : 1$.\
    \ Each combination of scale and aspect ratio yields nine anchors. This combination\
    \ of scale and aspect ratio yields considerable coverage over possible object\
    \ sizes and scales in the input image (Figure 15.7, right).\n\nHowever, there\
    \ is a problem here when we break down the total number of anchors generated:\n\
    \n+   * If we use 16 pixels (the default for Faster R-CNN) on a $600 \times 800$\
    \ image, we will get a total of 1,989 total positions.\n\n+   * With nine anchors\
    \ each of the 1,989 positions, we now have a total of $1,989 \times 9=17,901$\
    \ bounding positions for our CNN to evaluate.\n\nIf our CNN classified each of\
    \ the 17,901 bounding boxes our network would be only slightly faster than exhaustively\
    \ looping every combination of sliding window and image pyramid. Luckily, with\
    \ the Region Proposal Network (RPN) we can dramatically reduce the number of candidate\
    \ proposal windows, leaving us with a much more manageable size."
  merge: -1
  img_proc: true
- pgno: 258
  md: "# 15.2 The (Faster) R-CNN Architecture\n\n# 15.2.4 Region Proposal Network\
    \ (RPN)\n\nIf the goal of generating anchors is to obtain good coverage over all\
    \ possible scales and sizes of objects in an image, the goal of the Region Proposal\
    \ Network (RPN) is to prune the generated bounding boxes to a more manageable\
    \ size.\n\n![](img/7db52e410ee84ec5a30b3190e73b61d3_258_0.png)\n\nFigure 15.8:\
    \ The goal of the Region Proposal Module is to accept a set of anchors and quickly\
    \ determine the “objectness” of a region in image. Namely, this involves labeling\
    \ the ROI as either foreground or background. Background anchor regions are discarded\
    \ while foreground objects are propagated to the ROI Pooling module.\n\nThe RPN\
    \ module is itself powerful, consisting of two outputs. The top of the RPN module\
    \ accepts an input, which is our convolutional feature map from Section 15.2.2.2:\
    \ We then apply a $3 \times 3$ CONV, learning 512 filters.\n\nThese filters are\
    \ fed into two paths in parallel. The first output (left) of the RPN is a score\
    \ that indicates whether the ROI is foreground (worth examining further) or background\
    \ (discard). Figure 15.8 provides a visualization of labeling the “objectness”\
    \ of an input\n\nAgain, the RPN is not actually labeling the ROI — it’s just trying\
    \ to determine if the ROI is either foreground or background. The actual labeling\
    \ of the ROI is architecture (Section 15.2.6). The dimensionality of this output\
    \ is $2 \times K$ where $K$ is the total number of anchors, one output for the\
    \ foreground probability and the second output for the background probability.\n\
    \nThe second output (right) is our bounding box regression unit to adjust the\
    \ anchors to better fit the object that it is searching. Adjusting the anchors\
    \ is achieved via $1 \times K$ convolution, but this time output is $4 \times\
    \ K$ as we are predicting the four delta (i.e., offset) values: $\\Delta_x, \\\
    Delta_y, \\Delta_w, \\Delta_h$.\n\nProvided that the foreground probability is\
    \ sufficiently large, we then apply:\n\n+   - Non-maximum suppression to suppress\
    \ overlapping\n- Proposal selection\n\nThere will be many overlapping anchor locations\
    \ as per Section 15.2.3 above — non-maximum suppression reduces the number of\
    \ locations to pass on to the ROI Pooling module. We further reduce the number\
    \ of locations to pass into the ROI pooling module via proposal selection. We\
    \ take only the $N$ proposals and discard the rest.\n\nIn the original Faster\
    \ R-CNN publication, Girshick et al. set $N = 2000$, but we can get away with\
    \ much smaller $N$, such as $N = 10, 50, 100, 200$ and still obtain good predictions."
  merge: -1
  img_proc: true
