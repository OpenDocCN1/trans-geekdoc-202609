    \ rank-1 and 81.55% rank-5 accuracy on the validation set. While this isn't a\
    \ bad start, it's a far cry from what I expected: somewhere between AlexNet and\
    \ VGGNet-level accuracies.\n\n# 8.3.2 GoogleNet: Experiment #2\n\nGiven the extreme\
    \ volatility of the $le-2$ learning rate, I decided to restart training completely,\
