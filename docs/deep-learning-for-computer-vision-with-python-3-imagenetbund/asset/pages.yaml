    $ python train_googlenet.py --checkpoints checkpoints --prefix googlenet \\\n\
    \  --start-epoch 25\n```\n\nAs my plot demonstrates, there is a tiny bump in accuracy\
    \ in SGD is able to navigate to an area of lower loss, but training has plateau\
    \ (Figure 8.3, bottom). After I stopped 20 iteration and took a closer look at\
