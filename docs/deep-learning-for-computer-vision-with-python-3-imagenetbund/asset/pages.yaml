    ![](img/7db52e410ee84ec5a30b3190e73b61d3_107_2.png)


    Figure 9.1: **Left:** The original residual module block. **Center:** The residual
    module with a bottleneck. The bottleneck adds in extra CONV layer. This module
    also helps reduce the dimensionality of spatial volumes. **Right:** The updated
    pre-activation module that changes the order of RELU, CONV, and BN.


    We will be using the bottleneck + pre-activation version of the residual module
    when implementing ResNet in this chapter; Section 9.5.1 will provide results from
    ResNet trained without pre-activation to empirically demonstrate that pre-activations
    boost accuracy when applied to the challenging ImageNet dataset. For more detailed
    information on the residual module, bottlenecks, and pre-activations, please refer
    to Chapter 13 of the *Practitioner Bundle* where these concepts are discussed
    in more detail.


    # 9.2 Implementing ResNet


    The version of ResNet we will be implementing in this chapter is ResNet50 from
    the He et al. 2015 (Figure 9.2). We call this ResNet50 because there are fifty
    weight layers (i.e., CONV or FC) inside the network architecture. Given that each
    architecture contains three CONV layers, we can compute the total number of CONV
    layers inside the network:


    $$(3 \times 3) + (4 \times 3) + (6 \times 3) + (3 \times 3) = 48$$


    Finally, we add one CONV layer before the residual modules by the FC layer prior
    to the softmax classifier, and we have a total of 50 layers—hence the name ResNet50.

    Following Figure 9.2, our first CONV layer will apply a $7 \times 7$ convolution
    with a stride of $2 \times 2$. We''ll use a max pooling layer (the only pooling
    layer in the entire network) with a size of $3 \times 3$ and $2 \times 2$. Doing
    so will enable us to reduce the spatial dimensions of the input volume from $224
    \times 224$ down to $56 \times 56$ quickly.'
