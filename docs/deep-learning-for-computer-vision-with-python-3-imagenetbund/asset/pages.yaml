- pgno: 166
  md: 'In this case study, we are going to learn how to apply transfer learning (specifically
    feature extraction) to automatically detect and correct the orientation of an
    image. The reason we are using feature extraction extraction from a pre-trained
    Convolutional Neural Network is two-fold:


    +   1. To demonstrate that the filters learned by a CNN trained on ImageNet are
    not rotation invariant across a full 360-degree spectrum (otherwise, the features
    could not be used to discriminate between image rotation).


    +   2. Transfer learning via feature extraction obtains the highest accuracy when
    predicting image orientation.


    As mentioned in Chapter 11 of the Starter Bundle, it''s a common misconception
    that the individual filters learned by a CNN are invariant to rotation – the filters
    themselves are not. Instead, the CNN is able to learn some of filters that activate
    when they see a particular object under a given rotation. Therefore, the filters
    are not invariant due to the number of filters it has, with ideally some of these
    filters activating under various rotations. We will see in this chapter, CNNs
    are not fully rotation invariant, otherwise it would be impossible for us to determine
    the orientation of an image strictly from the features extracted during the fine-tuning
    phase.


    # 12.1 The Indoor CVPR Dataset


    The dataset we will be using for this case study is the Indoor Scene Recognition
    (also known CVPR) dataset [36] released by MIT. This database contains 67 indoor
    room/scene categories, including homes, offices, public spaces, stores, and many
    more. A sample of this dataset can be seen in Figure 12.1.


    The reason we are using this dataset is because it is very easy for a human to
    determine if a natural scene image is incorrectly oriented – our goal is to replicate
    this level of performance using a Convolutional Neural Network. However, all images
    in Indoor CVPR are correctly oriented; therefore, we need to build our own dataset
    from Indoor CVPR with labeled images under various rotations.


    To download the Indoor CVPR dataset use this link:'
