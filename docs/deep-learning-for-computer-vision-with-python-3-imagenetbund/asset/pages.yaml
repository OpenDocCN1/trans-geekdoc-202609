    # 13.2 Fine-tuning VGG on the Stanford Cars Dataset


    We are now ready to fine-tune VGG16 on the Stanford Cars dataset. But before we
    can write the code for `fine_tune_.py`, we first need to download the pre-trained
    weights for VGG16. You can download these weights using this link:


    http://data.dmlc.org/models/imagen/vgg/


    Be sure to download both vgg-0000.params and vgg16.json files. Again, keep in
    mind that the weights for VGG16 are $\approx$ 550MB, so be patient with the file
    downloads. The .params file are the actual weights while the .json file is the
    architecture. We''ll learn how to load these two files and fine-tune VGG16 in
    `fine_tune_.py`. Go ahead and follow the next part and we''ll get it done!


    ```

    # import the necessary packages

    from config import car_config as config

    import mxnet as mx

    import argparse

    import logging

    import os


    # construct the argument parser and parse the arguments

    parse = argparse.ArgumentParser()

    p.add_argument(''-v'', ''--vgg'', required=True)

    p.add_argument(''--path-to-pretrained VGGNet for-fine-tuning'')

    p.add_argument(''-c'', ''--checkpoints'', required=True)

    p.add_argument(''--path-to-output checkpoint directory'')

    p.add_argument(''-p'', ''--prefix'', required=True)

    p.add_argument(''--name'', ''--name-of-prefix'')

    p.add_argument(''--s'', ''--start-epoch'', type=int, default=0)

    p.add_argument(''--restart start-training'')

    args = parse.parse_args()

    ```


    Lines 2-6 import our Python packages – we import the car_config so we can have
    access to our configurations. We then parse three command line arguments, followed
    by a fourth option:


    +   - vgg: this is the path to the pre-trained VGG weights we will be fine-tuning.

    - checkpoints: during the fine-tuning process, we''ll serialize the weights after
    every epoch. This switch controls which serialized files will be stored.

    - prefix: just like all other mxnet examples, we need to to supply a name for
    our network.'
