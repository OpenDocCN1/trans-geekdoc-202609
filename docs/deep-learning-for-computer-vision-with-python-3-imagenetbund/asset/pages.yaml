  md: "# 15.2 The (Faster) R-CNN Architecture\n\nThe final feature vector obtained\
    \ from the ROI Pooling module can now be fed into the Region-based Convolutional\
    \ Neural network (covered in the next section) which we will use to obtain the\
    \ final bounding box coordinates for each object along with the corresponding\
    \ class label.\n\nFor information on how ROI is implemented, please see the Girshick\
    \ et al. publication [44] as well as the excellent tutorial, Faster R-CNN: Down\
    \ the Rabbit Hole of Modern Object Detection [54].\n\n# 15.2.6 Region-based Convolutional\
    \ Neural Network\n\nThe final stage in the pipeline is the Region-based Convolutional\
    \ Neural Network, or as we know it, R-CNN. This serves two purposes:\n\n+   1.\
    \ Obtain the class label predictions for each bounding box based on location the\
    \ cropped feature map from the ROI Pooling module\n2. Refine the bounding box\
    \ $(x,y)$-coordinates for better prediction accuracy\n\nIn practice, the R-CNN\
    \ component is implemented via two fully-connected layers, as Figure 15.10 demonstrates.\
    \ On the far left we have the input to R-CNN, which are the features obtained\
    \ from the ROI Pooling module. These features pass through two fully-connected\
    \ layers (each 4096-d) before being passed into the two FC layers which will yield\
    \ our label (or background) class along the bounding box values.\n\n![](img/7db52e410ee84ec5a30b3190e73b61d3_260_0.png)\n\
    \nFigure 15.10: The final module in the Faster R-CNN architecture takes out of\
    \ the ROI Pooling component and passes it through two FC layers (each 4096-d),\
    \ similar to the layers of classification networks trained on ImageNet. The output\
    \ of these FC layers feeds into the two layers in the network. One layer is $N+1-d$,\
    \ for each of class classes plus an additional label for the background. The second\
    \ FC layer is $4 \times N$ which represents the deltas for the final bounding\
    \ boxes.\n\nOne layer has $N+1$ nodes, where $N$ is the total number of class\
    \ labels. The addition of the extra dimension is used to indicate the background\
    \ class, just in case our RPN module let a background region through.\n\nThe second\
    \ FC layer is $4 \times N$. The $N$ here again our total number of class labels.\
    \ The four values are our corresponding deltas for $\\Delta_{x-center}$, $\\Delta_{y-center}$,\
    \ $\\Delta_{width}$, $\\Delta_{height}$ which will be transformed to our bounding\
    \ boxes.\n\nThese two outputs imply that we have two loss functions:\n\n+   1.\
    \ Categorical cross-entropy for classification\n2. Smooth L1 loss for bounding\
    \ regression\n\nWe use *categorical* cross-entropy rather as binary cross-entropy\
    \ here as we are computing probabilities for each of N classes versus the binary\
    \ case (background vs. foreground) in the RPN module. The final step is to apply\
    \ non-maxima suppression class-wise to our set of bounding"
