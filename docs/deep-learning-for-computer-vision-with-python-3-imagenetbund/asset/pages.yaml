    ![](img/7db52e410ee84ec5a30b3190e73b61d3_282_0.png)


    Figure 14: An example screenshot of my TensorBoard after 24 hours of training.


    When the machine port will still be 6006 the hostname (i.e., annalee) will be
    either the IP address of your machine or the name of the machine itself.


    Additionally, it may take a few minutes for the TensorBoard dashboard to populate
    both train and parse. train.py and eval.py need to run in order to generate the
    logs for TensorBoard to parse and display. Furthermore, values such as mAP, may
    be invisible until the eval.py script has run. Depending on the speed of your
    machine and evaluation process, it may take upwards of 15-30 minutes for the mAP
    to display.


    Figure 16 contains a screenshot of my TensorBoard dashboard. You can here see
    loss decreasing while my mAP grows, as our network is learning.


