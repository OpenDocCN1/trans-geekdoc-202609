- pgno: 30
  md: '# 5. Preparing the ImageNet Dataset


    Once you’ve downloaded the ImageNet dataset, it might be a bit overwhelmed. You
    now have over 1.2 million images residing on disk, none of them have “human readable”
    file names, there isn’t an obvious way to extract the class labels from them,
    and it’s totally unclear how you are supposed to train a custom Convolutional
    Neural Network on these images – \*what have you gotten yourself into*?


    No worries, I’ve got you covered. In this chapter, we will create the ImageNet
    file structure, including both the raw images along with the development kit (i.e.,
    “DevKit”). From class labels, we’ll write a Python utility script that will enable
    us to parse the ImageNet filenames, creating a nice output file that maps a given
    input filename to its corresponding label (one filename and label per line).


    Finally, we’ll use these files along with the mxnet inrec tool, which will take
    our mapping and create **efficiently packed record** (.rec) files that can be
    used when training deep learning models on datasets too large to fit into memory.
    As we find out, this *.rec format is not only more *compact* than HDF5, but it’s
    also more I/O efficient as well, enabling us to train our networks faster.


    The techniques and tools used in this chapter will allow us to train our own CNNs
    from scratch on the ImageNet dataset in subsequent chapters. In later chapters,
    such as those on vehicle make and model identification with age and gender prediction,
    we will again use these tools to help create our image datasets.


    Be sure to pay attention to this dataset and time when you are working through
    it. The code we will be writing is not necessarily “deep learning code”, but rather
    utility scripts that *facilitate* our ability to train networks further down the
    road.


    # 5. Understanding the ImageNet File Structure


    Let’s go ahead and get started by understanding the ImageNet file structure. I’ll
    assume that you have finished downloading the ILSVRC2015_CLS-LOC.tar.gz file,
    likely having to restart the download at least two to three times (when I personally
    downloaded the massive 166GB archive, it'
  merge: -1
  img_proc: true
