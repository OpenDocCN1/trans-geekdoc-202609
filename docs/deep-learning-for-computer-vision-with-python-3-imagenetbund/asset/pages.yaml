- pgno: 76
  md: '# 7. Training VGGNet on ImageNet


    In this chapter, we will learn how to train the VGG16 network architecture on
    the ImageNet dataset from scratch. The VGG family of Convolutional Neural Networks
    was first introduced by Simonyan and Zisserman in their 2014 paper, Very Deep
    Convolutional Networks for Large Scale Image Recognition [17].


    This network is characterized by its simplicity, using only $3\times3$ convolutional
    layers stacked on top of each other in increasing depth. Reducing the spatial
    dimensions of volumes is accomplished through the use of max pooling. Two fully-connected
    layers, each with 4,096 nodes (and dropout in between), are followed by a softmax
    classifier.


    VGG is often used today for transfer learning as the network demonstrates an average
    ability to generalize to datasets it was not trained on (as compared to other
    network types such as GoogLeet and ResNet). More times than not, if you are reading
    a publication or journal that applies transfer learning, it uses VGG as the base
    model.


    Unfortunately, training VGG from scratch is to say, the network is slow to train,
    and the architecture weights are quite large (over 500MB). This is the only network
    inside the ImageNet Bundle that I would recommend that you not train if you do
    not have access to at least four GPUs. Due to the depth of the network along with
    the fully-connected layers, the training proceeds slowly.


    In my case, training VGG on eight $\approx10$ layers with less than four GPUs,
    training VGG from scratch will likely become prohibitive (unless you can be very
    patient). That''s important to be a deep learning practitioner to understand the
    history of deep learning, especially the concept of pre-training and how we learned
    to avoid this expensive operation by optimizing our initialization weight functions.


    Again, this chapter is included in the ImageNet Bundle as the VGG family of networks
    is a critical aspect of deep learning; however, please do not feel the need to
    train this network from scratch - I have included the weights file derived from
    my experiment in this chapter for you to use in your own applications. This chapter
    as an educational reference so you can learn from VGG when you apply it to your
    projects. In particular, chapter will highlight the proper usage of the ReLU activation
    function and MSRA initialization.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 7.1 Implementing VGGNet


    When implementing VGG, Simonyan and Zisserman tried variants of VGG that increased
    in depth. Table 1 of their publication is included in Figure 7.1 below to highlight
    their experiments. In particular we are interested in configurations A, B, D,
    and E. You have already used both configuration D and E earlier in this book –
    these are the VGG16 and VGG19 architectures.


    Looking at these architectures, you''ull notice two patterns:


    +   The first is that the network uses 3 x 3 filters. The second is that the number
    of filters increases as well – to be exact, the number of filters doubles each
    time max pooling is applied to reduce volume size. The output of doubling the
    filters each time you create is of historical importance in the deep learning
    literature and a pattern you will see often.


    | A | B | C | D | E |

    |---|---|---|---|---|n| 11 weight layers | 11 weight layers | 13 weight layers
    | 16 weight layers | 19 weight layers |

    | input (224 x 224 x 3 RGB image) | | | | |

    | conv-64 | conv-64 | conv-64 | conv-64 | conv-64 |

    | LRN | | | | |

    | maxpool | | | | | |

    | conv-128 | conv-128 | conv-128 | conv-128 | conv-128 |

    | maxpool | | | | | |

    | conv-256 | conv-256 | conv-256 | conv-256 | conv-256 |

    | conv-256 | conv-256 | conv-256 | conv-256 | conv-256 |

    | maxpool | | | | | |

    | conv-512 | conv-512 | conv-512 | conv-512 | conv-512 |

    | conv-512 | conv-512 | conv-512 | conv-512 | conv-512 |

    | maxpool | | | | | |

    | conv-512 | conv-512 | conv-512 | conv-512 | conv-512 |

    | conv-512 | conv-512 | conv-512 | conv-512 | conv-512 |

    | maxpool | | | | | |

    | FC-4096 | | | | |

    | FC-4096 | | | | |

    | FC-1000 | | | | |

    | soft-max | | | | |


    Figure 7.1: A replication of Table 1 from Simonyan and Zisserman [17]. We''ll
    implement configuration D in this chapter, commonly called VGG16.


    The reason we perform this doubling of filters is to ensure no single layer is
    more biased than the others. Layers earlier in the network have fewer filters,
    but their spatial volumes are also much larger, implying there is "more (spatial)
    data" to learn from.


    However, know that applying a max pooling operation will reduce our spatial input
    volumes. If we reduce the spatial volumes without increasing the number of filters,
    then our layers become unbalanced and potentially biased, implying that layers
    earlier in the network may influence our output classification much more than
    deeper layers. To combat this imbalance, we keep in mind the ratio of volume size
    to number of filters. If we reduce the input volume size by 50-75%, then we should
    double the number of filters...


    The issue with training such deep architectures is that Simonyan and Zisserman
    found VGG16 and VGG19 to be extremely challenging due to their depth. If these
    architectures were'
  merge: -1
