  img_proc: true
- pgno: 306
  md: "# 18.2 Training Your SSD\n\nROIs as “ignore”, like in dlib, instructing our\
    \ network not to trained on certain areas of the image. Unfortunately, this process\
    \ of “ignoring” regions of the image is not possible with the TFOD API.\n\nLines\
    \ 77-81 extract the bounding box and class label information from the box element.\
    \ The bounding coordinates in our respective XML files can be negative or larger\
    \ than the width and height of the image — we take precautions to ensure we clip\
    \ these values using the max and min functions, respectively.\n\nSo why exactly\
    \ does our dataset bounding box coordinates that are outside the dimensions of\
    \ the image? The reason lies in how the dlib library and iatlab tool work.\n\n\
    The dlib library requires objects to have similar bounding aspect ratios during\
    \ training — if boxes do not have similar aspect ratios, the algorithm will error\
    \ out. Since vehicles appear at the borders of an image, in order to maintain\
    \ similar aspect ratios, the bounding boxes can extend outside the boundaries\
    \ of the image. The aspect ratio issue is not problem with the TFOD API so we\
    \ simply clip those values.\n\nNext, we can scale the bounding boxes to the range\
    \ [0,1], which is TensorFlow expects:\n\n```\n# TensorFlow assumes all boxes are\
    \ in the\n# range [0, 1] so we need to scale them\nxmin = startX / w\nxmax = maxX\
    \ / w\nyymin = startY / h\nymax = endY / h\n```\n\nOur next code block makes a\
    \ check to ensure that maximum x and y are always larger than their corresponding\
    \ minimum (and vice versa):\n\n```\n# due to errors in annotation, it may be possible\n\
    # that the minimum values are larger than the maximum\n# values - in this case,\
    \ treat it as an error during training\n# annotation and ignore the bounding box\n\
    if xmin > maxX or ymin > ymax:\n    continue\n# similarly, we could run into the\
    \ opposite case\n# where the max are smaller than the minimum\n# values\nelif\
    \ maxX < xmin or ymax < ymin:\n    continue\n```\n\nIf these checks fail, we ignore\
    \ the bounding box and preserve it to be an error during the annotation process.\n\
    \nWhen I first trained on the vehicles dataset using the TFOD API, I spent over\
    \ a day trying to diagnose why my network erro out during the training process.\
    \ It turns out the problem was related to bounding boxes having invalid coordinates\
    \ where the x or y value was actually smaller than the corresponding minimum (and\
    \ vice versa). Applying these checks on Lines 90-101 discarded the invalid bounding\
    \ boxes (two of them) and allowed the network to be trained.\n\nFrom there we\
    \ can continue building our tf. object and add it to our output record file:"
  merge: -1
  img_proc: true
