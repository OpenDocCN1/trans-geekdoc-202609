    # 6.2.2 Implementing the Training Script


    Now that we have the AlexNet architecture, we need to create a Python script to
    actually train the network on the ImageNet dataset. To start, open a new file,
    named train_alexnet.py, and insert the following code:


    ```

    # the necessary packages

    from config import imagen_alexnet_config as config

    from pymagesearch.nn.mxconv MxAlexNet

    import mxnet as mx

    import argparse

    import logging

    import json

    import os

    ```


    Lines 2-8 import our required Python packages. Notice how we''re importing the
    imagen_alexnet_config, aliased as config, so we can access ImageNet-specific configurations.
    We''ll then implement our implementation of the AlexNet architecture in mxnet
    on Line 3. As I mentioned earlier in this chapter, mxnet logs progress to; therefore,
    we need the logging package on Line 6 to capture the output of mxnet and save
    it directly to a file that we can later parse.


    From here, let''s parse our command line arguments:


    ```

    # construct the argparse and parse the arguments

    parse = argparse.ArgumentParser()

    parse.add_argument("--checkpoints"

    ```


    train_alexnet.py script requires two switches, followed by an optional one. The
    --checkpoints switch controls the path to output directory where our model weights
    will be serialized after each epoch. Unlike Keras we need to explicitly define
    when a model will be serialized to disk, mxnet does not automatically after every
    epoch.


    The --prefix command line argument the name of the architecture. In our case,
    we''ll be using a prefix of alexnet. The prefix name will be included in the filename
    of every serialized weights file.


    Finally, we can also supply a --start-epoch. When training AlexNet on ImageNet,
    we''ll inevitably notice signs of training stagnation or overfitting. In this
    case we will want to ctrl +'
