  md: '# 12.3 Training an Orientation Correction Classifier


    # 12.3 Training an Orientation Correction Classifier


    A classifier to predict image orientation will be accomplished using the train-model.py
    script from the Practitioner Bundle as well we simply need to add the path to
    our input HDF5 dataset and will take care of tuning the Logistic Regression hyperparameters
    and writing the output disk. Again, as a matter of completeness, I will review
    train-model.py but, you''ll want to refer to Chapter 3 of the Practitioner Bundle
    for more detailed information on this script.


    ```

    # import the necessary packages

    from sklearn.linear_model import LogisticRegression

    from sklearn.model_selection import GridSearchCV

    from sklearn.metrics import classification_report

    import argparse

    import pickle

    import h5py


    # construct the argument parser and parse the arguments

    parse = argparse.ArgumentParser()

    .add_argument("-db", "--db", required=True)

    p.add_argument("", help="path to HDF5 database")

    p.add_argument("-m", "--model", required=True)

    p.add_argument("", help="path to output output model")

    p.add_argument("-j", "--jobs", type=int, default=-1, help="number of jobs to run
    when tuning hyperparameters")

    vars = parse.parse_args()

    ```


    Lines 2-7 import our Python packages while Lines 9-17 parse our command line arguments.
    We only need to supply two command line arguments, --db, which is the path to
    our input HDF5 dataset, and --model, the path to our output serialized Regression
    classifier once it has been trained.


    We construct a training and testing split based on the number of entries in the
    database, using 75% for training and 25% for testing:


    ```

    # open the HDF5 dataset for reading then determine the index of

    # the training and testing split, provided that this data was

    db = h5py.File(args["db"], "r")

    i = int(db["labels"].shape[0] * 0.75)

    ```


    To tune the parameters of our Logistic Regression classifier we will perform a
    grid search:


    ```

    # define the set of parameters that we want to tune then a start

    # grid search where we evaluate our model for each value of C

    print("[INFO] tuning hyperparameters...")

    params = {"C": [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]}

    model = GridSearchCV(LogisticRegression(), params, cv=3,

    j_jobs=args["jobs"]

    model.fit(db["features"][:i], db["labels"][:i])

    print("[INFO] best hyperparameters: {}".format(model.best_params_))

    ```


    nBased on the best hyperparameters we''ll evaluate the model on the testing data:'
