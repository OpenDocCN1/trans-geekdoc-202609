- pgno: 125
  md: '124


    # Chapter 10. Training Squeeze on ImageNet


    After an input is fed into the network, 96 filters are learned, each of size $7
    \times 7$. A stride of $2 \times 2$ is used to reduce the spatial dimensions from
    $227 \times 227$ down to $111 \times 111$. To further reduce spatial dimensions,
    max pooling is applied with a pool size of $3 \times 3$ and a stride of $2 \times
    2$, yielding an output volume of $55 \times 55 \times 96$.


    Next, we have three filter modules. The first two modules apply 16 squeeze filters,
    reducing the input volume size from $55 \times 55 \times 96$ down to $55 \times
    55 \times 16$. The then applies $64 \times 1$ filters and $64 \times 3$ filters—these
    128 filters are concatenated along the channel dimension where the output size
    is $55 \times 55 \times 128$. The third module increases the number of $1 \times
    1$ squeeze filters to 32, making the number of $1 \times 1$ and $3 \times 3$ expands
    to 64. Prior to the max pooling operation, our spatial operation is $55 \times
    55 \times 256$. A max pooling layer with a $3 \times 3$ pool size and $2 \times
    2$ reduces the spatial dimensions down to $27 \times 27 \times 256$.


    From there we apply four filter models. The first module uses $32, 1 \times 1$
    squeeze filters and 128 filters for $1 \times 1$ and $3 \times 3$ respectively.


    The second filter module increases the number of $1 \times 1$ squeezes to 64,
    as well as the $1 \times 1$ and $3 \times 3$ expands to 192, resulting in an output
    volume of $27 \times 27 \times 384$. The final filter module increases the number
    to $64, 1 \times 1$ filters. The $1 \times 1$ and $3 \times 3$ expands to 256.
    After concatenating these expand filters, our volume size is now $27 \times 27
    \times 512$. Another max pooling operation is then applied to reduce our spatial
    dimensions to $13 \times 13 \times 256$.


    A final module is applied, increasing the $1 \times 1$ squeeze filters to 64.
    The expand filters then to 256 for $1 \times 1$ and $3 \times 3$, respectively.
    Concatenating the channel dimension, we arrive at an output volume of $13 \times
    13 \times 512$.


    One last filter module is applied again


    We perform global averaging across the entire $13 \times 13 \times 13$ volume
    to reduce the $13 \times 13 \times 1000$ down to a $1 \times 1 \times 1000$. We
    take these activations and then pass them through a softmax layer to obtain output
    probabilities for each of the $N$ class labels.


    As you can see, fully-connected layers are applied in this network architecture.
    Similar to GoogleNet and ResNet, using global averaging pooling can help (and
    often eliminate entirely) the need for FC layers. Reducing the FC layers has the
    added benefit of reducing the number of parameters required. Keep in mind that
    all nodes in a fully-connected layer are densely connected (every node in the
    current layer codes with every other node in the subsequent layer). However, convolutional
    layers are by definition sparse and require less memory. We replace a set of fully-connected
    layers with convolution and average pooling can dramatically reduce the number
    of parameters required by our network.


    # 10.13 Implementing SqueezeNet


    Now that we have the SqueezeNet architecture, let''s go ahead and implement it.
    Create a new file named mxsqueezenet.py using the mxconv sub-module of pymagisenearch.nn.conv:


    ```

    pymagisenearch

    |   __init__.py

    |   |   callbacks

    |   |   nn

    |   |       |__init__.py

    |   |       |   conv

    |   |       |   mxconv

    |   |           |       |__init__.py

    ```'
  merge: -1
  img_proc: true
