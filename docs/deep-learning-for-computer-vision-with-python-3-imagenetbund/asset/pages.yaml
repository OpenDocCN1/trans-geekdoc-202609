  md: '# 7.4 VGGNet Experiments


    Because I followed these guides, I only needed to perform one experiment with
    VGG16 to replicate the results of Simony and Zisserman – this single experiment
    replicated their results identically. In this experiment, I used the SGD optimizer
    to train VGG16 with an initial learning rate of le–2, a momentum of 0.9, and a
    L2 regularization of 0.0005. To speed up training, I used an Amazon EC2 instance
    with 8 GPUs. I would not recommend trying to train VGG on a machine with less
    than four GPUs unless you are very patient.

    I kicked off the VGG training process using the following command:


    ```

    $ python train_vggnet.py --checkpoints --prefix vgnet

    ```


    I allowed the network to train until epoch 50 where both training and validation
    accuracy seemed to stagnate (Figure 7.2, top-left). I ctrl c out the train_vggnet.py
    script and lowered the learning rate from le–2 to le–3:


    ```

    # initialize the optimizer

    opt = mx.optimizer.SGD(learning_rate=1e-3, momentum=0.9, wd=0.0005,

    rescale_grad=1.0 / batchSize)

    ```


    Training was then resumed using the following command:


    ```

    $ python train_vggnet.py --checkpoints --prefix vgnet \

    --start-epoch 50

    ```


    In the 7.2 (top-right) you can see the results of lowering the learning rate over
    the course of 20 epochs. Immediately you can see the massive jump in both training
    and validation accuracy. Training and validation loss also fall with the learning
    rate update, as when performing order of magnitude shifts when accuracy/loss saturates
    on deep Convolutional Neural Networks trained on large datasets, such as ImageNet.


    Post epoch 70 I again noted validation loss/accuracy while training continued
    to drop – this indicates overfitting to happen. In fact, we can see the divergence
    start after epoch 60 in the accuracy plot: training accuracy continues to climb
    while validation accuracy remains the same.


    In order to milk every bit of performance out of V that I (without overfitting
    terribly), I again dropped the learning rate from le–3 to le–4 and restarted training
    on epoch 70:


    ```

    $ python train_vggnet.py --checkpoints --prefix vgnet \

    --start-epoch 70

    ```


    I allowed the network to continue training for another 10 epochs until epoch 80
    where I applied early stopping (Figure 7.2, bottom). At this point, validation
    accuracy/loss had stagnated while the gap between training loss started to diverge
    heavily, indicating that we are slightly overfitting and further training would
    only hurt the ability of the model to generalize. At the end of the 80th epoch,
    VGG16 was obtaining 68.77% rank-1 and 88.78% rank-5 validation accuracy. I evaluated
    the 80th epoch on the test set using the following command:'
