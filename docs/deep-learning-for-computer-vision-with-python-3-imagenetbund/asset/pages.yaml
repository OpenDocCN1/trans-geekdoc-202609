- pgno: 154
  md: '# 11.3 Training Our Facial Expression Recognizer


    | Epoch | Learning Rate |

    | 1–20 | 1e–2 |

    | 21–40 | 1e–3 |

    | 41–60 | 1e–4 |


    Table 11.2: Learning rate schedule when training EmotionVGGNet on FER2013 in Experiment
    #1.


    The exact number of epochs we''ll need to train the network is dependent on the
    network performance and how we stop training, update the learning rate, and restart
    training.

    In the next section, we review four experiments I performed to incrementally improve
    the classification performance of EmotionVGGNet for facial expression recognition.
    Use this case study to help you in your own projects – the same techniques I used
    to set baselines, run experiments, investigate the results, and update parameters
    can be leveraged when you apply deep learning to projects of this scale.


    # 11.3.1 EmotionVGGNet: Experiment #1


    As I always do with my experiment, I aim to establish a baseline that I can incrementally
    improve upon – your experiment is rarely your best performing model. Keep in mind
    that obtaining a neural network with high classification is an iterative process.
    You need to run experiments, gather the results, adjust your parameters, and run
    the experiment again. One more time, this is a science, so you need to apply the
    scientific method – there are no shortcuts.

    In this experiment I started with the SGD optimizer with a base learning rate
    of 1e–2, a momentum term of 0.9, and Nesterov acceleration. (the default) Xavier/Glorot
    initialization method used to initialize the weights in the COW and FC layers.
    Furthermore, the only data augmentation I applied was horizontal flipping – no
    other data augmentation (such as rotation, zoom, etc.) was applied.

    I started training using the following command:


    ```

    $ python train_recognizer.py --checkpoints checkpoints

    ```


    And then used the learning rate schedule in Table 11.2 to train the rest of the
    network:

    The loss/accuracy plot for the first 60 epochs can be seen in Figure 11.2. It''s
    interesting to note that as I observed reducing the learning rate from 1e–2 to
    1e–3, the network effectively stopped learning. The switch from 1e–3 to 1e–4 is
    practically unnoticed – with these order of magnitude we would see at least some
    rise in accuracy and a corresponding drop in loss.

    At the end of the 60th epoch, I examined the validation accuracy and noted that
    the network was 62.91%. If this was the testing set, we would already be in the
    top #10 for the Kaggle facial recognition leaderboard.


    # 11.3.2 EmotionVGGNet: Experiment #2


    Given that SGD led to stagnation when decreasing the learning rate, I decided
    to swap SGD for Adam, using a base learning rate of 1e–3. In addition to the optimizer,
    this experiment is identical to the first one. I started training using the following
    command:


    ```

    $ python train_recognizer.py --checkpoints checkpoints

    ```'
