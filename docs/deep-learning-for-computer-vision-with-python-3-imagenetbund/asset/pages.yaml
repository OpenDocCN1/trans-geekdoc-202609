    it:


    ```

    $ mkdir lisa

    $ cd lisa

    $ mv signDatabasePublicFramesOnly.zip ./

    $ unzip signDatabasePublicFramesOnly.zip

    ```


    # 16.2 Installing the TensorFlow Object Detection API


    When putting this to work I evaluated many deep learning-based object detection
    implementations, including Keras-based libraries, mxnet-based packages, Caffe
    implementations, and even Torch libraries.


    Object detection is not only much harder to train a network on, but significantly
    more challenging to implement as there are many components, some of which require
    custom layers and loss functions. After reading Chapter ?? on the fundamentals
    of Faster R-CNNs, it should be clear that there are many modules that need to
    be implemented by hand.


    Implementing the entire R-CNN architecture is not something that can be covered
    in this book, for a number of reasons, including:


    +   1. Implementing and explaining the Faster R-CNN architecture by the same style
    used throughout the rest of the book (code blocks and detailed explanations) would
    take hundreds (if not) of pages.

    2. Object detection libraries and packages tend to be fragile in their nature
    as custom layers and loss methods are used. When a new version of their associated
    backend library is released, the risk of breaking such a custom module is high.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 16.3 Training Faster R-CNN


    The goal here is to discuss a library that is fragile as possible, giving you
    the best of both worlds: knowledge of the Faster R-CNN architecture and ability
    to train the network from scratch.


    Because of the fragility of custom, ground-up implementations, we are going to
    use the TensorFlow Object Detection API (TFOD API) in this chapter and Chapter
    8 on Single Shot Detectors. Not only is TensorFlow one of the most used deep learning
    libraries, but the TFOD API is supported by Google itself — there is a large community
    of both open source, and corporate developers working on the project, help reduce
    the fragile nature of the library.


    If you''re interested in learning more about the TFOD API, be sure to take a look
    at their official GitHub page [45] as well as their 2017 CVPR paper, Speed/accuracy
    trade-offs for modern convolution object detectors.


    To install and configure the TensorFlow Object Detection API, please refer to
    the following page of the companion website for this: http://pyimg.com/7b77m


    If you do not have access to the companion website, please refer to the first
    pages of the book for the website registration link.


    Using the companion for the TFOD API installs ensures that they can be kept up
    to date, something that a printed book cannot guarantee. Follow the instructions
    using the link above to configure your machine and then we can train your first
    Faster R-CNN!


    # 16.3 Your Faster R-CNN


    The first part of this section will detail and review project structure. It''s
    important that you understand how to structure your project, or you may run into
    hard to diagnose errors during training or evaluation.


    The TensorFlow API requires our images and annotations in a particular record
    format — we''ll discuss how to take an image dataset plus annotations and put
    them in the required format. From there we can train our Faster R-CNN architecture,
    evaluate its performance, and apply it to sample testing methods.


    # 16.3.1 Project Directory Structure


    Between the TFOD API and our custom scripts to build our input dataset, train
    a network, evaluate performance, and apply our models to custom images, there
    are a number of moving parts. Furthermore, some of these scripts live inside the
    TFOD API directory structure while other scripts will need to be implemented by
    us.


    Let''s start by listing the TFOD Python scripts we''ll be using. My TFOD API was
    cloned into my home directory, so your root path to the TFOD API is /home/adrian/models/research:


    ```

    $ cd ~/models/research/

    $ pwd

    /home/adrian/models/research

    $ ls -1

    adversarial_crypto

    adversarial_text

    adversarial_imagenet_models

    object_detection

    ```


    Your TFOD root path may be different depending on where you cloned it.

    There are quite a number of subdirectories, but the one we are most interested
    in object_detection:'
