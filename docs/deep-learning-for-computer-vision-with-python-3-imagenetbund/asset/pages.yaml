  md: "# 18.2 Training Your SSD\n\nLine 2 imports our configuration file so we can\
    \ access it throughout the Python script. Our TFAnnotation class (Line 3) will\
    \ enable us to efficiently build TensorFlow data points that will be written to\
    \ our output record file. We will also import BeautifulSoup so we can parse our\
