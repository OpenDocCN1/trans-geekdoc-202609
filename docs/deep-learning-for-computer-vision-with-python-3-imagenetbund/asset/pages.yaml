  md: '# Chapter 13. Case Study: Vehicle Identification


    # 13.2.3 VGG Fine-tuning: Experiment #3


    In my final VGG16 fine-tuning experiment, I decided to split the difference between
    the $1e-4$ and $1e-5$ learning rate and start training with a $5e-4$ learning
    rate. The same SGD optimizer, momentum, and regularization terms were kept as
    the first two experiments. I once again started the fine-tuning process using
    the following command:


    ```

    $python fine_tune_cars.py --vgg vgg16/vgg16 --checkpoints checkpoints \

    --prefix vggnet

    ```


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_195_0.png)


    **Figure 13.4: Left:** The first 50 epochs using a $5e-4$ learning rate. **Right:**
    Reducing the learning rate to $5e-5$ and training for another 5 epochs. We obtain
    slightly lower accuracy than Experiment #1; however, we are much less overall.


    The first 50 epochs are plotted in Figure 13.4 (left). Here we can see the training
    loss/accuracy keeping with the validation, and eventually overtaking the validation
    loss/accuracy. However, what''s important to note here is that the training loss/accuracy
    is *not saturating as as did in our first experiments.


    I allowed the network to continue training until epoch 50 where I stopped training,
    reduced the learning rate from $5e-4$ to $5e-5$ and training for another five
    epochs:


    ```

    $python fine_tune_cars.py --vgg vgg16/vgg16 --checkpoints checkpoints \

    --prefix vggnet --start-epoch 50

    ```


    The final loss/accuracy plot can be seen in Figure 13.4 (right). While there is
    certainly a gap between the training and validation loss the validation is not
    increasing. Looking at the output of the final epoch, our network was reaching
    81.25% rank-1 and 95.88% rank-5 accuracy on the validation set. These accuracies
    are certainly better than our second experiment. I would also argue that these
    accuracies are *more desirable* than the first experiment as we did not overfit
    our network and risk the ability of the model to generalize. At this point, I
    felt comfortable stopping the experiment altogether and moving on to the evaluation
    stage.'
