- pgno: 14
  md: '# 1. Introduction


    Welcome to the Practitioner Bundle of Deep Learning for Computer Vision with Python!
    This volume is meant to be the next logical step in your deep learning for computer
    vision education after completing the Starter Bundle.


    At this point, you should have a strong understanding of the fundamentals of parameterized
    learning, neural networks, and Convolutional Neural Networks (CNNs). You should
    feel relatively comfortable using the Keras library and the Python programming
    language to train your own custom deep learning networks.


    The purpose of the Practitioner Bundle is to build on your gained from the Starter
    Bundle and introduce more advanced algorithms, concepts, and tricks of the trade
    — these techniques will be covered in three distinct parts of the bundle.


    The first part focuses on methods that are used to boost your classification accuracy
    in one way or another. One way to increase your classification accuracy is to
    apply transfer learning methods such as fine-tuning or using a network as a feature
    extractor.


    We''ll explore ensemble methods (i.e., training multiple networks and combining
    the results) and how these methods can give you a nice classification boost with
    little extra effort. Regularization methods such as data augmentation are used
    to generate additional training data — in all situations, as well as improve your
    model''s ability to generalize. More advanced optimization methods such as Adam,
    RMSProp, and others can also be used on datasets to help obtain lower loss. After
    we review these techniques, we''ll look at the optimal path to apply these methods
    to ensure you obtain the maximum amount of benefit with the least amount of effort.


    We move on to the second part of the Practitioner Bundle which focuses on larger
    datasets and exotic network architectures. Thus far we have only worked with datasets
    that fit into the main memory of our system - but what if our dataset is too large
    to fit into RAM? What do we then? We''ll address this question in Chapter ?? when
    we work with HDF5.


    Given that we''ll be working with larger datasets, we''ll also be able to discuss
    more advanced network architectures like AlexNet, GoogLeNet, ResNet, and deeper
    variants of VGGNet. These network architectures will be applied to more challenging
    datasets and competitions, including the'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Kaggle: Dogs vs. Cats recognition challenge [3] as well as the cs231n Tiny
    ImageNet challenge [4], the exact same Stanford CNN students compete in. We''ll
    find out, we''ll be able to obtain a top-25 position on the Kaggle Dogs vs. Cats
    leaderboard and top the cs231n challenge for our technique type.


    The final part of this book covers applications of deep learning for computer
    vision outside of image classification, including basic object detection, deep
    dreaming and neural style, Generative Adversarial Networks (GANs), and Image Super
    Resolution. Again, the techniques covered in this volume are meant to be much
    more advanced than the Starter Bundle – this is where you''ll start to separate
    yourself from a deep learning novice and transform into a true deep learning practitioner.
    To start your transformation to deep learning expert, just flip the page.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 2. Introduction


    Welcome to the ImageNet Bundle of Deep Learning for Computer Vision with Python,
    the final volume in the series. This volume is meant to be the most advanced in
    terms of content, covering techniques that will enable you to reproduce results
    of state-of-the-art publications, papers, and talks. To keep this work organized,
    I structured the ImageNet Bundle in two parts.


    In the first part, we''ll explore the ImageNet dataset in detail and learn how
    to train state-of-the-art deep networks including AlexNet, VGGNet, GoogLeNet,
    ResNet, and SqueezeNet from scratch, obtaining similar accuracies as possible
    as their respective original works. In order to accomplish this goal, we''ll need
    to call on all of our skills from the Starter Bundle and Practitioner Bundle.


    We''ll need to ensure we understand the fundamentals of Convolutional Neural Networks,
    especially layer types and regularization, as we implement some of these more
    "exotic" architectures. Likewise, we will see many shallow implementations of
    these deeper architectures inside the Practitioner Bundle so implementing networks
    as VGGNet, GoogLeNet, and ResNet will feel somewhat familiar.


    We''ll also need to ensure we are comfortable with babysitting the training process
    as we can easily overfit our network on the ImageNet dataset, especially during
    the later epochs. Learning how to monitor loss and accuracy plots to determine
    if/when parameter updates be updated is an acquired skill, so to help you develop
    this skill fast and train deep networks on large, challenging datasets, I''ve
    written each of these as "experiment journals" that apply the scientific method.


    Inside each chapter for a given network you''ll find:


    +   1. The exact process I used when training the network.

    2. The particular results.

    3. The changes I decided to make in the next experiment.


    Thus, each chapter reads like a "story": you''ll find out what worked for me,
    what didn''t, and ultimately obtained the best results and enabled me to replicate
    the work of a given publication. After reading this book, you''ll be able to use
    this knowledge to train your own network architectures from scratch on ImageNet
    without spinning your wheels and wasting weeks (or even months) of time to tune
    your parameters.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Chapter 2. Introduction


    The second part of this book focuses on case studies – real-world applications
    of applying deep learning and computer vision to solve a particular problem. We''ll
    first start off by training a CNN from scratch to recognition emotions/facial
    expressions of people in real-time video streams. From there we''ll use transfer
    learning via feature extraction to automatically detect and correct image orientation.
    A second case study on transfer learning (this time fine-tuning) will enable us
    to create an "intelligent" highway billboard system that displays targeted information
    or advertising to the driver based on the make and model of 164 vehicles and the
    type of vehicle they are driving. Our final case study will demonstrate how to
    train a CNN to recognize the age and gender of a person in images.


    Finally, I want to remind you that the techniques covered in this volume are much
    more advanced than both the Starter Bundle and the Practitioner Bundle. Both of
    the previous volumes gave you the required knowledge you need to be successful
    when reading this book – but this point is where you''ll separate yourself from
    a deep learning practitioner and a true deep learning master. To start your final
    transformation into a deep learning expert, just flip the page.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 3. Training Networks Using Multiple GPUs


    Deep neural networks on large scale datasets can take a long time, even single
    experiments can take days to finish. In order to speed up the training process,
    we can use multiple GPUs. While backends such as Theano and TensorFlow (and therefore
    Keras) do support multiple GPU training, the process to set up a multiple GPU
    experiment is arduous and non-trivial. I expect this process to change in the
    future and become substantially easier.


    Therefore, for deep neural networks and large datasets, I highly recommend using
    the Keras library [5] which we will be using for the majority of experiments in
    the remainder of this book. The mxnet deep learning library (written in C++) provides
    bindings to the Python programming language and specializes in distributed, multi-machine
    learning — the ability to parallelize training across GPUs/devices/nodes is critical
    when training state-of-the-art deep neural architectures on massive datasets (such
    as ImageNet).


    The mxnet library is also very easy to work with — given your background as Keras
    from previous chapters in this book, you will find working with mxnet to be straightforward,
    and even quite natural.


    It''s important to note that all neural networks in the ImageNet Bundle can be
    trained using a single GPU — the only caveat is that. Some networks, such as AlexNet
    and SqueezeNet, require only a few days to be trained on a single GPU. Other architectures,
    such as VGNet and ResNet, may over a month to train on a single GPU.


    In the first part of this chapter, I''ll highlight the network architectures we''ll
    be discussing that can easily be trained on a single GPU and which architectures
    would use multiple GPUs if all possible. Then, in the second half of this chapter,
    we will examine some of the performance gains we can expect when training Convolutional
    Neural Networks using multiple GPUs.


    # 3.1 How Many GPUs Do I Need?


    If you were to ask any seasoned deep learning practitioner how many GPUs you need
    to train a reasonably deep neural network on a large dataset, their answer would
    almost always be “The more, the better”. The benefit of using multiple GPUs is
    obvious — parallelization. The more GPUs we'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Chapter 3. Training Networks Using Multiple GPUs


    can throw at the problem, the faster we can train a network. However, some of
    us only have one GPU when working through this book. That raises the questions:


    +   - Is just using one GPU fruitless exercise?

    - Is reading through this a waste of time?

    - Was purchasing the ImageNet Bundle a poor investment?


    The answer to all of these questions is a resounding no – you are in good hands,
    and the knowledge you learn here will be applicable to deep learning projects.
    However, you need to manage your expectations and realize you are crossing a threshold,
    one that separates deep learning from amateurs, real-world applications. You are
    now entering the world of state-of-the-art deep learning where experiments can
    take days, weeks, or even in some cases, months to complete – this timeline is
    totally completely normal.


    Regardless whether you have one or eight GPUs, you''ll be able to replicate the
    performance of the networks detailed in this book, but again, the more GPUs you
    have, the better the training will be. If you have a single GPU, don''t be frustrated
    – simply be patient and understand that this is part of the process. The primary
    goal of the ImageNet Bundle is to provide you with actual case studies and detailed
    information on how to train state-of-the-art deep neural networks on the challenging
    ImageNet dataset with a few additional applications as well. No matter if you
    have one or GPUs, you''ll be able to learn from these case studies and use this
    knowledge in your projects.


    For readers using a single GPU I highly recommend spending most of your time AlexNet
    and SqueezeNet on the ImageNet dataset. These networks are narrower and can be
    trained faster on a single GPU system (in the order of 3-6 days for AlexNet and
    7-10 days for SqueezeNet, on your machine). Convolutional Neural Networks such
    as GoogLeNet also be trained on a single GPU but can take up to 7-14 days.


    Smaller variations of ResNet can also be trained on a single GPU, but for the
    better versioned in this book, I would recommend using multiple GPUs.

    The only network architecture I do not recommend training using one GPU is VGGNet
    – not only is it a pain to train the network hyperparameters (as we will see later
    in this book), but the network is extremely slow due to its depth and number of
    fully-connected nodes. If you decide to train VGGNet from scratch, keep in mind
    it can take up 14 days to train the network, using four GPUs.


    As I mentioned earlier in this chapter, you are now crossing the threshold from
    learning to deep learning expert. The datasets we are examining are large and
    challenging – the networks we will train on these datasets are deep. As depth
    increases, the computation required to perform the forward and backward pass.
    Take a second to set your expectations that these experiments are not ones you
    can leave overnight and get the results next morning – which experiments will
    take longer to run. This is a fact that every deep learning researcher must accept.


    But if you are training your state-of-the-art deep learning models on a single
    GPU, don''t fret. The techniques we use for multiple GPUs can also be applied
    to single GPUs. The sole purpose of the ImageNet Bundle is to give you the knowledge
    and experience you need to be successfully deep learning to your projects.


    # 3.2 Performance Gains Using Multiple GPUs


    In an ideal world, a single GPU for a given dataset and architecture takes N seconds
    to complete on a single GPU, we would expect the same epoch with two GPUs to complete
    in N/2 seconds. However, this expectation isn''t the actual case. Training performance
    is heavily dependent on the PCIe bus on your system, the specific architecture
    you are training, the number of layers in the network, and whether your network
    is bound via computation or communication.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 3.3 Summary


    In general, training with two GPUs improves speed by ≈1.8x. When using four GPUs,
    performance scales to ≈2.5–3.5x scaling depending on your system [6]. Thus, training
    does not decrease linearly with the number of GPUs on your system. Architectures
    that are bound by computation (larger batch sizes increasing with the number of
    GPUs) will scale better multiple GPUs as opposed to networks that rely on communication
    (i.e., smaller batch sizes) where latency starts to play a role degrading performance.


    # Caffe Performance on Multi-GPUs Per Node


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_20_0.png)


    Figure 3.1: On the x-axis we have the number of GPUs (1-4) and the y-axis describes
    the number of images trained per second. When increasing from one to two we can
    expect an increase of ≈1.8x performance. Jumping from one to four GPUs yields
    an increase of ≈2.7.


    To investigate GPU scaling, let''s look at the official benchmarks by NVIDIA in
    Figure 3.1. Here we see three types of GPUs (Tesla K80, Tesla M40, and Tesla P400)
    that are used to train GoogleLeNet on the ImageNet dataset using the Caffe [7]
    deep learning library. The x-axis plots the number of GPUs (one, two, and four,
    respectively) while the y-axis describes the number of images trained per second
    (forward and backward pass). On average, we see a performance increase of ≈1.8x
    when switching from one GPU to two GPUs. When comparing one GPU to four, performance
    increases to ≈2.7ix.


    Performance will continue to increase as more GPUs are added to the system, but
    keep in mind that training speed will not scale linearly with the number of GPUs–if
    you train a network using one GPU, then train again using four GPUs, don''t expect
    the amount of time it takes to train the network by a factor of four. That said,
    there are performance gains to be had by training deep learning models with more
    GPUs, so if you have them available, by all means, use them.


    # 3.3 Summary


    In this chapter we discussed the concept of training deep learning architectures
    using multiple GPUs. To perform most of the experiments in this book, we will
    use the mxnet library which is highly optimized for multi-GPU training. Given
    your experience using the Keras library throughout earlier chapters in this book,
    you will find mxnet to be natural with and class names very similar.


    From there we discussed basic expectations when training a deep network on a large
    dataset with a single GPU versus multiple GPUs. Yes, training a network with a
    single GPU will take longer,'
  merge: -1
