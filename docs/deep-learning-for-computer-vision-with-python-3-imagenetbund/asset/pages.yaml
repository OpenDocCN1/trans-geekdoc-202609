    # 13.5 Summary


    In this chapter, we learned how to fine-tune VGG16 architecture (pre-trained on
    ImageNet) to correctly recognize 164 vehicle make and model classes with over
    84.22% rank-1 and 96.54% rank-5 accuracy. To accomplish this, we sliced the final
    fully-connected layer in VGG16 (the FC2 layer that outputs the total number of
    classes, which is 1,000 in case of ImageNet) and replaced it with our own fully-connected
    layer of 164 classes, followed by a softmax classifier.


    A series of experiments were performed to determine the optimal learning rate
    when fine-tuning fine-tuning and evaluating our network, we wrote a simple Python
    script named vis_classification.py to help us visualize the vehicle make and model
    classifications for a given input image. This same script can be modified to make
    intelligent, highly targeted billboard advertisements of yours, strictly based
    on the type of car a given person is driving.'
