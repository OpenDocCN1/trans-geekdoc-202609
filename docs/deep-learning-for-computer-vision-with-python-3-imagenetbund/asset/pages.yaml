- pgno: 22
  md: '# 4. What Is ImageNet?


    In this chapter, we''ll discuss the ImageNet dataset and the associated ImageNet
    Large Scale Visual Recognition Challenge (ILSVRC) [9]. This challenge is the de
    facto benchmark for evaluating image classification algorithms. The leaderboard
    for ILSVRC has been dominated by Convolutional Neural Networks and deep learning
    techniques since 2012 when Krizhevsky et al. published their seminal AlexNet [8].


    Since then, deep learning methods have continued to widen the accuracy gap between
    CNNs and other traditional computer vision classification methods. There is no
    doubt that CNNs are powerful image classifiers and are now a permanent fixture
    in the computer vision and machine learning literature. In the second half of
    this chapter, we''ll explore how to obtain the ImageNet dataset, a requirement
    in order for you to replicate the results of state-of-the-art neural networks
    later in this chapter.


    # 4.1 The ImageNet Dataset


    Within the computer vision and deep learning communities, you might run into a
    context of confusion surrounding what ImageNet is or not. ImageNet is actually
    a project aimed at labeling and categorizing images into all 22,000 categories
    based on a defined set of words and phrases. At the time of writing, there are
    over 14 million images in the ImageNet project.


    So, how is ImageNet organized? To order such a massive amount of data, ImageNet
    actually follows the WordNet hierarchy [10]. Each meaningful word/phrase inside
    WordNet is called a "synonym set" or synset for short. Within the ImageNet project,
    images are categorized according these synsets; the goal of the project is to
    have 1,000+ images per synset.


    # 4.1.1 ILSVRC


    In the context of computer vision and deep learning, when you are people talking
    about image-net, they are likely referring to the ImageNet Large Scale Visual
    Recognition Challenge [9], or simply ILSVRC. The goal of the image classification
    task in this challenge is to train a model that can correctly classify an image
    into 1,000 separate object categories, which are some considered fine-grained
    classification and others which are not. Images inside the ImageNet dataset'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Chapter 4. What Is ImageNet?


    were gathered by compiling previous datasets and scraping popular online websites.
    These images were then manually labeled, annotated, and tagged.


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_23_0.png)


    Figure 4.1: Since the seminal AlexNet architecture was introduced in 2012, Convolutional
    Neural Network methods have dominated the ILSVRC challenge, both in terms of accuracy
    and number of entries. Image credit: NVIDIA [11])


    Since 2012, the leaderboard for the ILSVRC challenge has been dominated by deep
    learning based approaches with the rank-1 and rank-5 accuracies increasing every
    year (Figure 4.1). Models are trained on ≈1.2 million training images with another
    50,000 images for validation (50 images per synset) and 100,000 images for testing
    (100 images per synset).


    These 1000 category images represent object classes that we may encounter in our
    day-to-day lives, such as species of dogs, cats, various household objects, vehicle
    types, and much more. You can find the full list of object classes in the ILSVRC
    challenge on this official ImageNet documentation page (http://pyimg.com/10m).


    In Chapter 5 of the *Starter Bundle*, I include a feature demonstrating some of
    the classes associated with the ImageNet Large Scale Visual Recognition Challenge.
    Unlike having generic "bird", "cat", and "dog" classes, ImageNet includes 120
    fine-grained classes compared to previous image benchmark datasets like PASCAL
    VOC [12]. PASCAL VOC limits "dog" to a single category, ImageNet instead includes
    120 different breeds of dogs. This classification requirement implies that our
    deep learning networks are not only need to recognize images "dog", but also are
    discriminative to determine what species of dog.


    Furthermore, in ImageNet dramatically varies across object scale, number of instances,
    image cluster/occlusion, deformability, texture, color, and real-world size. This
    dataset is challenging, to the least, and it''s hard for even humans to correctly
    label. Because of the nature of this dataset, deep learning models that perform
    well on ImageNet are likely to generalize to images outside of the validation
    and testing—this is the exact reason why we apply transfer learning to these models
    as well.


    We''ll discuss more examples of images and specific classes in Chapter 5 when
    we start exploring the ImageNet dataset and write code to prepare our images for
    training. However, until that time, I would highly encourage you to take 10-20
    minutes and browse the synsets (http://pyimg.com/10m) in your web browser to get
    a feel for the scale and challenge of correctly classifying these images.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 4.2 Obtaining ImageNet


    The ImageNet classification dataset is quite large, weighing in 138GB for the
    training images, 6.3GB for the validation images, and 13GB for the testing images.
    Before you download ImageNet, you first need to access to the ILSVRC challenge
    and download the images and associated class labels. This section will help you
    obtain the ImageNet dataset.


    # 4.2.1 Requesting Access to the ILSVRC Challenge


    The ILSVRC challenge is a joint work between Princeton and Stanford universities,
    and, therefore, an academic project. ImageNet does not hold the copyrights to
    its images and only grants access to the raw image files for non-commercial research
    and educational purposes (although this point is up for debate — Section 4.2.5
    below). If you fall into this camp, you can register for access on the ILSVRC
    website (http://pyimg.com/fy84)


    However, please note that ImageNet does not accept free email addresses such as
    Gmail, Yahoo, etc.- instead, you will need to supply the email address of your
    university or government/research affiliation. As Figure 4.2 demonstrates, I simply
    need to provide my university email address, from I was able to verify my email
    address and then accept the Terms of Access.


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_24_0.png)


    Email: @umbc.edu Full Name: Dr. Adrian Rosebrock Organization: PaytmSearch Submit
    Request


    Figure 4.2: If you have a university or research organization associated email
    address, be sure to use it when registering with ImageNet and the associated ILSVRC
    competition.


    Once you''ve accepted the Terms of Access you''ll have access to the Download
    Original Images — click the ILSVRC 2015 image data link. Make sure you download
    the Development Kit, a zip file containing a README, information on the training/testing
    splits, blacklisted files that should not be used for training, etc. (Figure 4.3).


    You''ll want to download the SLS-LOC dataset which contains the 1.2 million images
    in the ImageNet dataset (Figure 4.3). Keep in mind that depending on your internet
    connection (and the stability of image-net.org), this may take a couple of days.
    My personal suggestion would be to use the wget command line to download the archive,
    enabling you to restart the download from where you left off, in case there are
    connectivity issues (which are likely to be a handful of). Explaining how to use
    wget is outside the scope of this book, so please refer to the following page
    for instructions on how to restart download with wget (http://pyimg.com/97u59).


    After the tar archive is downloaded, the next step is to unpack it, which is also
    a computationally expensive process as you need to unarchive = 1.2 million images
    — I would suggest leaving your system to tackle this overnight.


    # 4.2.2 Downloading Images Programmatically'
  merge: -1
  img_proc: true
