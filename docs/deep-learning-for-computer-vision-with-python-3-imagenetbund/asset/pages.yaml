    \ upper)\n        break\n\n# return the label\nreturn label\n```\n\nHere we pass\
    \ in a single parameter, the age string. Inside the Adience dataset, age labels\
    \ are represented as strings in the form (0, 2), (4, 6), etc. To determine the\
    \ correct label for this input, we first extract the lower and upper age boundaries\
    \ as (Lines 36 and 37).\n\nWe loop over our ageBins (Line 40) and determine the\
    \ bin which the supplied age falls into. Once we have the correct bin, we build\
    \ our label as a string with the lower and upper boundaries separated by an underscore.\
    \ For example, if an input age of (8, 13) was passed into this function, the would\
    \ be 8_13. Performing this encoding makes it easier for us to parse the labels,\
    \ when training and evaluating our network.\n\nNow that we can create age labels,\
    \ we need to construct gender labels:\n\n```\ndef getGenderLabel(self, gender):\n\
    \    # return 0 if the gender is male, 1 if the gender is female\n    return 0\
    \ if gender == \"m\" else 1\n```\n\nThis function is straightforward – if the\
    \ input gender is m (for \"male\") we return 0; otherwise, the gender is assumed\
    \ to be female, we return 1.\nWhen evaluating one-accuracy, we need an efficient\
    \ method, to determine if the predicted label is equal to adjacent to the ground-truth\
    \ label. The easiest way to accomplish this is to define a dictionary that maps\
    \ a ground-truth label to its corresponding adjacent labels. For example, if we\
    \ know the ground-truth label to a given point is 8_13, we could use this as a\
    \ key in our query. The value would be [\"4_6\", \"8_13\"] – the set of adjacent\
    \ labels. Simply checking if 8_13 exists in this list would allow us to quickly\
    \ evaluate one-accuracy.\nTo define this dictionary, we create a more complex\
    \ function, buildOneOffMappings:\n\nOur method will a single required argument,\
    \ le, which is an instantiation of the LabelEncoder used to encode age classes.\
    \ As we know earlier from the definition of this class, age labels will be encoded\
    \ in the form {lower}_{upper}. To determine adjacent age"
