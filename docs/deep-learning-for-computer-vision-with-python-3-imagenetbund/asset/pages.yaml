- pgno: 78
  md: '# 7.1 Implementing VGGNet


    randomly initialized and trained from scratch, they would often struggle to learn
    and gain initial "traction"– the networks were too deep for basic initialization.
    Therefore, to train deeper VGG, Simonyan and Zisserman came up with a clever concept
    called pre-training.


    Pre-training is the practice of training smaller versions of your network architecture
    with fewer weight layers and then using those converged weights as the initializations
    for larger, deeper networks. In the case of VGG, the authors first trained configuration
    A, VGG11. VGG11 was able to converge to the reasonably low loss, but not state-of-the-art
    accuracy.


    The weights from VGG11 were then used as initializations for configuration B,
    VGG13. The conv63 and conv-128 layers (highlighted in Figure 7) in VGG13 were
    randomly initialized while the remaining layers were copied from the pre-trained
    VGG11 network. Using the initializations, Simonyan and Zisserman were able to
    successfully train VGG13– but not obtain state-of-the-art accuracy.


    This pre-training pattern continued to configuration D, which we widely know as
    VGG16. This time three new layers were randomly initialized while the other layers
    were copied from VGG13. The network was then trained using these "warmed-up" layers,
    allowing the initialized layers to learn and discern discriminating patterns.
    Ultimately, VGG16 was able to perform well on the ImageNet classification challenge.


    As a final experiment, Simonyan and Zisserman once applied pre-training to configuration
    E, VGG19. This very deep architecture copied the weights from the pre-trained
    VGG16 architecture and added another convolutional layers. After training, it
    found VGG19 obtained the highest classification accuracy from their experiments;
    however, the size of the model (548MB) and the amount of time to train and evaluate
    the network, for all, made deep learning impractical.


    If pre-training sounds like a painful, tedious process, because that is. Training
    variations of your network architecture and using the converged weights as your
    deeper versions of the network is a clever trick; however, it requires training
    and tuning the hyperparameters to N networks, where N is your final architecture
    along with the previous (smaller) networks required to obtain the end model. Performing
    this process is extremely time-consuming, especially for networks with many fully
    connected layers as VGG.


    The good news is we no longer perform pre-training when training very deep Convolutional
    Neural Networks–instead of pure random initialization we now use XavierGlor [18]
    or MSRA (also known as He et al. initialization). Through the work of Mishkin
    and Tias in their 2015 paper, all you need is a good init [19] and He et al. in
    Deep Into Rectifiers: Scaling Human-Level Performance on ImageNet Classification
    [20], we find that we can skip the pre-training phase and easily jump to directly
    the variations of the network architecture.


    After these papers published, Simonyan and Zisserman re-evaluated their experiments
    and found that these "smarter" initialization schemes and activation functions
    were able to replicate their previous performance without the usage of tedious
    pre-training.


    Therefore, you train VGG16 or VGG19 make sure you:


    +   1. Swap all ReLUs for PReLU.

    2. Use MSRA (also called "He et al. initialization") to initialize the weight
    layers in your network.


    I additionally recommend using batch normalization after the activation functions
    in the network. Apply batch normalization was not discussed in the original Simonyan
    and Zisserman paper, but as other others have discussed, batch normalization can
    stabilize your training and reduce the total number of epochs to obtain a reasonably
    performing model.'
  merge: -1
  img_proc: true
