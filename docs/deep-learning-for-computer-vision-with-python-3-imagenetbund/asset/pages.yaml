- pgno: 53
  md: '# 5.3 Summary


    In this chapter, we learned how to prepare the ImageNet dataset. We started by
    exploring the directory structure of both the raw images in ImageNet, followed
    by the metabases in the DevKit. From there, we created our first ImageNet Python
    configuration file – all experiments performed on ImageNet will be derived from
    this original configuration file. We supplied paths to the raw input images, metabases,
    number of class labels, output RGB serializations, etc. Provided that we use the
    same machine for running all ImageNet experiments, this configuration file will
    rarely (if ever) need to be updated.


    After constructing our configuration file, we defined the ImageNetHelper class.
    This class includes four utilities that facilitate our ability to generate mxnet
    list (called .lst files). Each .lst file includes three unique integer ID of the:


    +   1. The unique ID of the image.

    2. The class label of the image.

    3. The full path to the image residing on disk.


    Given a .lst file for each of the training, testing, and validation splits, we
    applied the im2rec binary (provided by mxnet) to create efficiently backed record
    files for each split. These record files are super compact and highly efficient.
    As we''ll see in our next chapter when we train AlexNet from scratch on ImageNet,
    we''ll leverage these .rec files using a special ImageRecordIter. Similar to the
    HDFSDatasetGenerator, the ImageRecordIter class will enable us to:


    +   1. Iterate over all images in a .rec file in batches.

    2. Apply data augmentation to each image in every batch.


    To see how all the pieces fit together we can train a Convolutional Neural Network
    from scratch on ImageNet, proceed to the next chapter.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# # 6. Training AlexNet on ImageNet


    In our previous chapter we discussed the ImageNet dataset in detail; specifically,
    the directory structure of the dataset and the supporting meta files used provide
    class labels for each image. From there, we defined two sets of files:


    +   1. A configuration file to allow us to easily create new experiments when
    training Convolutional Neural Networks on ImageNet.

    2. A set of utility scripts prepare the dataset for the conversion from raw images
    residing on disk to an efficiently packed mxnet record file.


    Using the `mxrec` binary proved by mxnet, along with the .lst files we created
    using our utility scripts, we were able to generate record files for each of our
    training, testing, and validation sets. The beauty of this approach is that the
    `.rec` files only have to be generated *once* — we can reuse these record files
    for any ImageNet classification experiment we perform.


    Secondly, the configuration files themselves are also reusable. While we will
    build our first configuration with AlexNet in mind, the reality is that we will
    be using the same configuration file for VGGNet, GoogNet, ResNet, and SqueezeNet
    as well – the *only aspect* of the configuration file that needs to be changed
    when training a new network on ImageNet are:


    +   1. The name of the network architecture (which is embedded in the configuration
    file).

    2. The batch size.

    3. The number of GPUs to train the network (if applicable).


    In this chapter, we are first going to implement the AlexNet architecture using
    the mxnet library. We''ve already implemented AlexNet back in Chapter 10 of the
    *Practitioner Bundle*. As you''ll see, there are many parallels between mxnet
    and Keras, making it *extremely straightforward* to perform an implementation
    between the two libraries. From there, I demonstrate how to train AlexNet on the
    ImageNet dataset.


    This chapter, and all other chapters in this bundle demonstrate how to train a
    given network architecture on the ImageNet dataset, are treated as a cross between
    a *case study* and a *lab journal*. For each of the chapters in this book, I run
    tens to hundreds of experiments to gather the respective results. I want to share
    with you my thought when training deep, state-of-the-art neural networks on the
    challenging ImageNet dataset so you can gain experience by watching me'
