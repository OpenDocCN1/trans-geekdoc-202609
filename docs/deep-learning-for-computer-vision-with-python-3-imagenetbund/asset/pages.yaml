  md: "# Chapter 18. Training a SSD From Scratch\n\n```\n# loop over all image elements\n\
    for image in soup.find_all(\"image\\):\n    # load the input image from disk as\
    \ a TensorFlow object\np = os.path.join(config.BASE_PATH, image[\"file\"])\nencoded\
    \ = tf.GFile(p, \"rb\").read()\nencoded = bytes(encoded)\n```\n\n```\n# load the\
    \ image from disk again, this time as a PIL\npImage = Image.open(p)\n(w, h) =\
    \ pImage.size[:2]\n```\n\n```\n# parse the filename and encoding from the input\
    \ path\nfilename = image[\"file\"].split(os.path.sep[-1])\nencoding = filename.rfind(\"\
    .CM\") + 1:\n```\n\n```\n# initialize the annotation object to store\n# information\
    \ regarding the bounding box + labels\ntfAnnot = TFAnnotation(\ntfAnnot.image\
    \ = encoded\ntfAnnot.encoding = encoding\ntfAnnot.filename = filename\ntfAnnot.width\
    \ = w\ntfAnnot.height = h\n```\n\nFor each of image elements, extract the file\
    \ path attribute (Line 46). Lines 47 and 48 load the image from disk in the TensorFlow\
    \ flow. Lines 52 and 53 load the image from disk again, using PIL/Pillow format,\
    \ enabling us to extract the images.\n\nLines 56 and 57 extract the filename from\
    \ the image path and use the filename to derive the encoding (i.e., JPG, PNG,\
    \ etc.). From there we can initialize our tfAnnot object (Lines 61-66). For a\
    \ more detailed review of this code, see Section 16.3 in the Faster R-CNN chapter.\n\
    \nEach element in the XML tree also has a series of children bounding boxes -\
    \ let's loop over all box elements for a particular image:\n\n```\n# loop over\
    \ all bounding boxes associated with the image\nfor box in image.find_all(\"box\"\
    ):\n    # check to see if the bounding box should be ignored\n    if box.has_attr(\"\
    ignore\"):\n        continue\n    # extract the bounding box information + label,\n\
    \    # inside the image\n    startX = max(0, float(box[\"left\"]))\n    startY\
    \ = max(0, float(box[\"top\"]))\n    endX = min(w, float(box[\"width\"])) + startX\n\
    \    endY = min(h, float(box[\"height\"])) + startY\n    label = box.find(\"label\"\
    ).text\n```\n\nLine 71 makes a check to see if the ignore attribute of the box\
    \ is set, and if so, we do not further process the bounding box. In an ideal world,\
    \ the TFOD API would allow us to mark specific"
