    # 14.8.2 Understanding Face Alignment


    In order to understand face alignment, we first need to review the fundamentals
    of facial landmarks. Facial landmarks are used to localize and represent the salient
    regions of the face, such as:


    +   - Eyes

    - Eyebrows

    - Nose

    - Mouth

    - Jawline


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_239_0.png)


    An example of facial landmarks detected on an image can be seen in Figure 14.6.
    Detecting facial landmarks is a subset of the shape prediction problem. Given
    an input image (normally a ROI that specifies the object of interest), a shape
    detector attempts to localize key points of interest along the shape. In the context
    of facial landmarks, our goal is to detect important facial structures on the
    face using shape prediction models. Detecting facial landmarks is, therefore,
    a two-step process:


    +   - Step #1: Localize the face in the image.

    - Step #2: Detect the key facial structures on the face ROI.

    - To accomplish both of these steps, we will be using the dlib library [40]. For
    Step #1, dlib uses a pre-trained HOG + Linear SVM [41, 42] detector – detector
    can locate the bounding box (x,y)-coordinates of a face in an image. Then for
    Step #2, using the method proposed by Kazemi and Sullivan in their 2014 paper,
    One Millisecond Face Alignment with an Ensemble of Regression'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# 14.8 Visualizing Results


    Trees, the key facial structures are localized. The end result is a facial landmark
    detector that can be used to detect facial landmarks in real-time with high-quality
    results.


    Given the facial landmarks, we can then apply facial alignment, the process of:


    +   1. Identifying the geometric structure of faces in digital images.

    2. Attempting to a canonical alignment of the face based on scale, translation,
    and rotation.


    There are many forms of facial alignment. Some methods try to impose a (pre-defined)
    3D model and then apply a transformation to the input images that the facial landmarks
    match the faces on the 3D Model. Other, simplistic methods, rely on the facial
    landmarks themselves (in particular, the eye regions) to obtain a normalized rotation,
    translation, and scale representation of the face.


    Thus, face alignment can be seen as another form of data normalization. As we
    mean normalize images by passing them through a CNN, we can align faces to obtain
    better accuracy when (1) during our CNNs and (2) evaluating them. A full review
    of the facial alignment process is outside the scope of this book as it focuses
    heavily on computer vision and image processing techniques outside the deep learning
    space; however, I readers interested in facial landmarks and face alignments to
    read my tutorials on these methods:


    +   * Facial landmarks: http://pyimg.com/skgwd

    * Face alignment: http://pyimg.com/tnbz


    In order to apply facial alignment to our input images, we will be using the FaceAlign
    class implemented in matlab library (http://pyimg.com/7/c2cj). I briefly describe
    the face alignment algorithm below.


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_240_0.png)


    Figure 14.7: **Top**: Localizing the eyes via facial landmarks (red) is followed
    by computing the angle between the eyes (green). **Bottom**: In order to align
    the face we also need to compute the center (x,y) midpoint between the eyes. **Right**:
    Results of applying facial alignment to the two faces. Notice how both faces are
    scaled approximately equally and rotated such as the eyes lie along horizontal
    line.


    First, the eyes are localized using facial landmarks (Figure 14.7, top). Given
    the (x,y)-coordinates of the eyes, we can then compute the angle between them.
    From there we also need the midpoint between the eyes (*bottom*). An affine transformation
    is then applied to warp the images into a new output coordinate space, such that
    the face is:


    +   1. Centered in the image.'
  merge: -1
