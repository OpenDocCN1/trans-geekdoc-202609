    # 9.5 ResNet Experiments


    In this section, I will be sharing experiments I performed when training ResNet
    on the ImageNet dataset. As we''ll find out, ResNet can be a bit challenging to
    train, due to the number of parameters in the network, it can overfit. On the
    positive side (and as we''ll find out), ResNet will require fewer epochs than
    previous experiments.


    # 9.5.1 ResNet: Experiment #1


    In the two experiments on ResNet, I wanted to demonstrate how:


    +   1. Using the residual module without pre-activations leads to sub-optimal
    performance.

    2. A smaller initial learning rate can reduce the accuracy of the network.


    Therefore, in this first experiment, I implemented the residual module without
    pre-activations. I used the SGD optimizer with an initial learning rate of 1e-2.
    I kept all other parameters identical to the implementation detailed in Section
