    \ of the network that is being trained.\n2. The network symbol (syn) which represents\
    \ the model weights after the current epoch.\n3. The argument parameters (arg)\
    \ to the network.\n4. The auxiliary parameters (aux).\n\nBased on these values,\
    \ we create a Module for the network parameters on Lines 9-12. We then call `compute_one_off`\
    \ (to be defined in the next section) on Lines 16 and 17 to compute the one-off\
    \ accuracies for both the training and validation sets. These one-off accuracies\
    \ are logged in our training history file (Lines 20-23). The outer `one_off_callback`\
    \ function returns the `callback` function to us, pass it in the network epoch,\
    \ model symbol, and relevant parameters after every epoch (Line 26).\n\nThe next\
    \ step is to define the `compute_one_off` function. As its name suggests, this\
    \ will be responsible for accepting the input model, a data iterator (detaiter),\
    \ and the oneOff dictionary mapping and computing the one-off accuracies:\n\n\
    ```\ndef compute_one_off(model, dataiter, oneoff):\n    # initialize the total\
    \ number of samples along with the\n    # number of correct (maximum of one off)\
    \ classifications\n    total = 0\n    correct = 0\n\n    # loop over the predictions\
    \ of batches\n    for (preds, batch) in model.iter_predict(dataIter):\n      \
    \  # convert the batch of predictions and labels to NumPy\n        arrays\n  \
    \      predictions = preds[0].numpy().argmax(axis=1)\n        labels = batch.label[0].numpy().astype(\"\
    int\")\n\n    # loop over the predicted labels and ground-truth labels\n    for\
    \ (pred, label) in zip(predictions, labels):\n        # if correct label is in\
    \ the set of \"one off\"\n        # predictions, update the correct counter\n\
    \        if label in oneOff[pred]:\n            correct += 1\n\n    # increment\
    \ the total number of samples\n    total += 1\n\n    # finishing computing the\
    \ one-off metric\n    return correct / float(total)\n```\n\nLine 31 initializes\
    \ the total number of samples in the dataIter. Line 32 initializes the number\
    \ of correct one-off predictions. To compute the number of correct one-off predictions,\
    \ we use the `iter_predict` method of the model to loop over samples in the dataIter,\
    \ as we did in Chapter 13 identifying which vehicles and models (Line 35).\n\n\
    Line 38 grabs the output predictions from our model for the given batch, then\
    \ finds the index of the label with the largest probability. Line 39 extract the\
    \ ground-truth labels so we can compare them to predictions. We loop over each\
    \ of the predicted and ground-truth labels on Line 43. If the ground-truth label\
