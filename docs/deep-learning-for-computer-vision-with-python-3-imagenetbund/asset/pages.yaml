    \ loaded into memory, we can loop over each of the rows:\n\n```\n# loop over the\
    \ labels\nfor row in rows:\n    # split the row into the WordNet ID, label integer,\
    \ and\n    # human readable label\n    (wordID, label, hrLabel) = row.split(\"\
    \ \")\n    # update the labels dictionary using the word ID\n    # as the key\
    \ and the value, subtracting '1'\n    # from the label since MATLAB is zero-indexed\
    \ while Python\n    # is zero-indexed\n    labelMappings[wordID] = int(label)\
    \ - 1\n    # return the labels mappings dictionary\nreturn labelMappings\n```\n\
    \nFor each row, we break it into a 3-tuple (each entry in the row is separated\
    \ by space), consisting of:\n\n+   1. The Word ID (wordID).\n2. The unique integer\
    \ class ID (label).\n3. The human readable name of the WordNet ID (hrLabel).\n\
    \nNow that we have these values we can update our labelMappings dictionary. The\
    \ key to the dictionary is the WordID, our value is the label with a value of\
    \ 1 subtracted from it. Why do we subtract one? Keep in mind that the ImageNet\
    \ tools provided by ILSVRC were built using MATLAB. The MATLAB programming language\
    \ is one-indexed (it means starts counting from 1) while Python programming is\
    \ zero-indexed (we start counting from 0). Therefore, to convert the MATLAB indexes\
    \ to Python, we subtract a value of 1 from the label.\n\nThe labelMappings dictionary\
    \ is returned to the calling function on Line 33. Next we build the blacklist\
    \ function:\n\n```\ndef buildBlacklist(self):\n    # load the list of blacklisted\
    \ image IDs and convert them to\n    # a set\n    rows = open(self.config.VAL_BLACKLIST).read()\n\
    \    rows = set(row.strip().split(\"\\n\") for row in rows)\n    # return the\
    \ blacklisted image IDs\n    return rows\n```\n\nThis function is fairly straightforward.\
    \ On Line 38, we read the contents of the VAL_BLACKLIST file. The VAL_BLACKLIST\
    \ file contains unique names of the validation files (one per line) that we should\
    \ exclude from the validation set due to ambiguous labels. We simply break the\
    \ string into a list (splitting on the newline \\n character) and convert rows\
    \ to a set object. A set object will allow us to determine if a validation image\
    \ is part of the blacklist in O(1) time.\n\nOur next function is responsible for\
    \ ingesting the TRAIN_LIST and IMAGES_PATH configuration to construct a set of\
    \ image paths and associated integer class labels for the training set:"
