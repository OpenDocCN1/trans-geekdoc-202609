- pgno: 313
  md: '# 312


    # Chapter 18. Training a SSD From Scratch


    Looking at the output of our results, you''ll see that small vehicles are missed
    by the detector. We could reduce this problem by increasing the resolution of
    our input images, but if we really want to detect small vehicles at a distance,
    we might want to consider using the Faster-RCNN framework. Of course, there is
    a tradeoff — if we use a Faster-RCNN we''ll sacrifice the speed of our object
    detection performance.


    In the context of vehicle detection and this project, recognizing small vehicles
    at a distance is unlikely to be a problem. Vehicles that are far away are not
    an immediate concern to us. As they approach, our SSD will be able to recognize
    their presence, and the self-driving vehicle to take correct action. Given that
    our SSD can run at 20 FPS, our concerns of recognizing small objects can be mitigated,
    but we still need to be concerned with vehicles far away operating at high speeds
    that can quickly close the gap.


    The second problem we can encounter is our SSD confusing “front” and “rear” views
    of vehicles, which semantically different, still share many similar characteristics,
    but largely due to the fact that the front and rear of vehicles, the larger problem
    is being unable to mark images as “ignore” with the TFOD API.


    Vehicles at a distance still contain vehicle-like characteristics that can confuse
    the TFOD during training. This problem is compounded by the hard-negative algorithm
    of SSD which tries to learn negative patterns from cells that contain vehicles.


    That is, issue is not specific to SSDs. I encourage you to back and train a Faster-RCNN
    on the dataset — you’ll notice the same behavior. If you find that you need to
    mark regions of images as “ignore”, and areas needs to be ignored the majority
    images of your dataset (such is the case with our dataset), then you may want
    to consider using a different object detection library than the TFOD toolkit.


    # 18.3 Summary


    In this chapter learned how to train a Single Shot Detector to recognize the front
    and rear views of vehicles using Davis King’s (65) dataset. Overall, we were able
    to obtain ~ 65.5% mAP on the dataset — visually inspecting the results confirmed
    that predictions were good and even capable of running in real-time.


    Real-time prediction is one of the major benefits in the SSD framework. The TensorFlow
    Object Detection Zoo shows that our SSD can run at approximately 24 FPS while
    our Faster-RCNN can only reach 9 FPS.


    However, training on the vehicle dataset highlighted some problems we can encounter
    when training our custom object detectors. The TFOD API does not have a concept
    of “ignore this region of the image, we cannot exclude potentially “confusing”
    parts of the image from the training process. Examples of such a “confusing” area
    can include:


    +   1. A large number of cars in a compact area where it’s not clear where one
    begins and the others


    +   2. Vehicles at a distance that are too small to be 100% visually recognizable,
    but the CNN can still “see” them and learn from them


    The hard-negative mining of SSD is especially sensitive in these situations and
    can actually hurt performance. In the future I hope that the TFOD API includes
    a method to mark bounding boxes as “ignored” as the dlib img1 tool does, but until
    that point, it’s important to be cognizant of these limitations.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# 19. Conclusions


    Congratulations on finishing the ImageNet Bundle of Deep Learning for Computer
    Vision with Python! It''s been the journey, and I feel privileged and honored
    to have taken this journey with you. You''ve learned a lot over the past 15 chapters,
    so let''s take a second and recap your newfound knowledge. Inside this bundle
    you''ve learned to:


    +   - Train networks in multi-GPU environments.

    - Obtain and download the ImageNet dataset (along with the associated licensing
    assumptions that accompany the dataset and replicating the trained models).

    - Prepare the ImageNet dataset by compressing the images and class labels into
    efficiently packed record files.

    - Train state-of-the-art network architectures on ImageNet, including AlexNet,
    VGGNet, GoogleLeNet, ResNet, and SqueezeNet – and in each case, replicating the
    results of the original respective authors.

    - Implement a “Learning as a Service” system that you can use to efficiently create
    learning API endpoints (and potentially use to start your own company).

    - Train a model that can recognize facial expressions and emotions in a real-time
    video stream.

    - Use transfer learning and feature extraction to automatically predict and correct
    the orientation of an image.

    - Apply fine-tuning to recognize over 164 makes and models of vehicles with over
    96.54% accuracy.

    - Train a deep learning model capable of predicting the age and gender of a person
    in a photograph.

    - Train a Faster R-CNN and Single Shot Detector (SSD) for self-driving cars, including
    road sign detection and front/rear vehicle detection.


    Each of these projects were challenging, and representative of the types of techniques
    you''ll need to apply when performing deep learning in the real world. Furthermore,
    these exact techniques, best practices, and rules of thumb are the exact ones
    used by deep learning researchers performing state-of-the-art work. Provided you''ve
    worked through all the examples in this book, I am confident that you can confer
    upon yourself the title deep learning practitioner if not deep'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Chapter 19. Conclusions


    learning expert. However, to maintain this status, you''ll want to continue your
    studies...


    # 19.1 Where to Now?


    Deep learning is a quickly evolving field with new techniques being published
    every day. It may feel like a daunting task to keep up with all the new research
    trends, and to help you out, I''ve created a set of resources that I personally
    use to keep myself updated. These resources can also be used to help you study
    deep learning. To start, I highly recommend Stanford University''s excellent cs231n,
    Convolutional Neural Networks for Visual Recognition:


    ```

    http://cs231n.stanford.edu/

    ```


    Every spring semester of the class is taught with slides and notes posted on the
    syllabus page:


    ```

    http://cs231n.stanford.edu/syllabus.html

    ```


    Links to previous semester subreddits can also be found there; For a more theoretical
    treatment of deep learning, Deep Learning by Goodfellow et al. is a must read:


    ```

    http://www.deeplearningbook.org/

    ```


    The book is free online and can be bought on Amazon:


    ```

    http://pyimg.co/v6bl1

    ```


    While not specific to computer vision, Deep Learning provides more theoretical
    information contained in this hands-on book. Furthermore, if you intend on applying
    deep learning to domains outside computer vision, you''ll find it worthwhile to
    read the work of Goodfellow et al. When it comes to staying on top of recent deep
    learning news, I recommend following the t/machinelearning and t/deeplearning
    subreddits:


    +   * https://www.reddit.com/r/MachineLearning/

    * https://www.reddit.com/r/deeplearning/


    I frequent these subreddits and tend to read them every 24–48 hours, bookmarking
    the most interesting threads for me to read later. The benefit of following these
    subreddits is that you will be part of an actual community with whom you can discuss
    various techniques, algorithms, and publications.


    Two other resources I recommend are LinkedIn Groups, Computer Vision Online and
    Computer Vision and Pattern Recognition, respectively:


    +   * http://pyimg.co/s1c3

    * http://pyimg.co/62p60


    While not specific to deep learning, these groups consistently contain interesting
    discussions and serves as a hlp for anyone interested in studying computer vision
    at the intersection of deep learning.


    When it comes to keeping up with deep learning publications, no further than Andre
    Karpathy''s Arxiv Sanity Preserver:


    ```

    http://www.arxiv-sanity.com/

    ```


    This website enables you to filter-print deep learning publications submitted
    to arXiv on a number of terms, including:


    +   * Most recent submission

    * Top most recent submissions

    * Recommend papers

    * Recently discussed papers


    This site is an invaluable tool for anyone who is intending on performing research
    in the deep learning field.


    When it comes to software, I would suggest following the GitHub repositories for
    both Keras and mxnet:'
  merge: -1
