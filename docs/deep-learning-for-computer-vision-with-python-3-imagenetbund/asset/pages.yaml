    # 9.3 Training ResNet


    Now we have implemented ResNet, we can train it on the ImageNet dataset. But first,
    let''s define our directory structure:


    ```

    --- mx_imagenet_resnet

    |--- config

    | |--- __init__.py

    | | |--- imagenet_resnet_config.py

    | |--- output/

    | |--- test_resnet.py

    | |--- train_resnet.py

    ```


    I copied this directory structure from our AlexNet implementation in Chapter 6
    and simply renamed all occurrences of "alexnet" to "resnet". The train_resnet.py
    will be responsible for our training. We can then use test_resnet.py to evaluate
    the performance of ResNet on the ImageNet testing set.


    Finally, the imagenet_resnet_config.py file contains our configurations for our
    upcoming experiments. This file is identical to imagenet_alexnet_config.py, only
    I updated the BATCH_SIZE and NUM_DEVICES:


    ```

    # define the batch size and number of devices used for training

    BATCH_SIZE = 32

    NUM_DEVICES = 8

    ```


    Given the depth of ResNet50, I needed to reduce the BATCH_SIZE to 32 to fit 32
    images on my Titan X 12GB GPU. On your own GPU, you may need to reduce NUM_DEVICES
    to 16 or 8 if the GPU runs out of memory.


    Again, I wouldn''t recommend training ResNet50 on a machine with 4-8 GPUs. If
    you use the 18 or 34 layer variant it will be much faster to train. Besides VGGNet,
    this is the only architecture I don''t recommend training without multiple GPUs
    - and even with that, ResNet10 can still be trained with one GPU if you are (and
    you''ll still outperform AlexNet from Chapter 6).


    Now that our configuration has been updated, the train_*.py script just as means
    to serve as a framework, requiring us to make as little changes as possible. I
    will quickly review this file as we have already reviewed many times in this book.
    For a more detailed review of the training scripts, please refer to Chapter 6.
    Now go ahead and run train_resnet.py and we''ll get to:


    ```

    # import the necessary packages

    from config imagenet_resnet_config as config

    from pymxagearch.mxnconv import mxResNet

    import mxnet as mx

    import argparse

    import logging

    ```'
