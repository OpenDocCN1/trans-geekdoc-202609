    # 6.4.3 AlexNet: Experiment #3


    Given that my experiment demonstrated placing batch normalization *after the activation*
    yielded better results, I decided to swap out the ReLU activations with ELU activations.
    In my experiment, replacing Res with ELUs added a 1-2% increase in my classification
    accuracy on the ImageNet dataset. Therefore, my CONV => RELU block becomes:


    ```

    # Block #1: first CONV => RELU => POOL layer set

    conv1_1 = mx.Convolution(data=data, kernel=(11, 11),

    stride=(4, 3), num_filter=96)

    act1_1 = mx.ReLU(data=conv1_1, act_type="elu")

    bn1_1 = mx.BatchNorm(data=act1_1)

    pool1_1 = mx.Pooling(data=bn1_1, pool_type="max",

    kernel=(3, 3), stride=(2, 2))

    doi1 = mx.Dropout(data=pool1, p=0.25)

    ```


    Notice how the batch normalization layer is placed after the activation with ELUs
    replacing ReL. In this experiment I used the exact SGD optimizer parameters over
    my two trials. I also followed the same learning rate schedule from the second
    experiment (Table 6.3).


