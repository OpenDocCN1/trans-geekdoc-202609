- pgno: 285
  md: "# Chapter 16. Training a Faster-RCNN From Scratch\n\n# Monitor Loss and mAP\n\
    \nWhen training your own object detectors be sure to measure your loss and mAP\
    \ values (the mAP will only be computed if you are running the eval.py script).\n\
    \nThe mAP should start off low, rise quickly over the first 10,000-50,000 steps\
    \ (depending on how long you are training) and then level off. Your loss should\
    \ decrease during this time as well. Your goal is to decrease the loss as much\
    \ as you can, ideally < 1.5. A loss < 1 is desirable when training your object\
    \ detectors.\n\n# Training and Evaluation with GPUs and CPUs\n\nA network with\
    \ the TFOD API can be done using multiple GPUs, but, at the time of writing, it\
    \ is advisable to use a single GPU until you are familiar with the TFOD API tools.\
    \ When running the evaluation script you should use a single GPU (if available)\
    \ as\n\nIf you have only a single GPU on your machine you should not try to train\
    \ and evaluate on the single GPU — you will likely run into a memory exhausted\
    \ and your scripts will exit.\nInstead, you should kickoff the training process\
    \ on your GPU and run your evaluation on your CPU. The catch is that evaluating\
    \ with your CPU will be incredibly slow; therefore, you should set num_examples\
    \ to a small number (such as 5-10) the eval_config of your pipeline configuration:\n\
    \n```\neval_config:\n  num_examples: 5\n  # Note: The below line limits the evaluation\
    \ process to 10 evaluations.\n  # Remove the below line to evaluate indefinitely.\n\
    \  max_evals: 10\n```\n\nThis update will ensure that a small fraction of your\
    \ evaluation dataset is used for evaluation (allowing you to compute the approximate\
    \ mAP) but not the entire testing set (which would take a long time on a single\
    \ CPU).\n\nTry to keep your CPU load as low as possible so you can use cycles\
    \ for moving data and off the CPU, thereby reducing the amount of time it takes\
    \ to train the network.\n\n# Getting Set with your CUDA Devices\n\nGoing in-in-hand\
    \ with Section 16.3 above, I've found that readers need to use a GPU for training\
    \ and a CPU (if no additional GPUs are available) for evaluation, but are not\
    \ sure how to approach this.\n\nReading the TensorFlow (or any document for deep\
    \ learning libraries) you'll come across the CUDA_VISIBLE_DEVICES environment.\
    \ By default, TensorFlow will allocate your model to GPUs when running a script,\
    \ but confusingly to readers new TensorFlow, the library will not the network\
    \ on all GPUs — it will allocate memory on each of the GPUs. This behavior is\
    \ problematic if you want to run on a single GPU or no GPU at all.\n\nOn my machine\
    \ I have four Titan X GPUs which, by default, TensorFlow will try to allocate\
    \ memory on all of these. To prevent this unwanted allocation from happening I\
    \ can set your CUDA_VISIBLE_DEVICES before executing the script:\n\n```\n$ CUDA_VISIBLE_DEVICES=\"\
    0\"\n$ python object_detection/train.py --logtestderr \\\n  --pipeline ssds_and-rcnn/lisa/experiments/faster_rcnn.lisa.config\
    \ \\\n  --train_dir ssds_and-rcnn/lisa/experiments/training\n```"
  merge: -1
  img_proc: true
- pgno: 286
  md: "# 16.3 Training Faster R-CNN\n\nHere you can see that I am instructing my current\
    \ session to only expose GPU 0 to\nTensorFlow. From there, GPU 0 will be allocated\
    \ when train.py.\nI can then open up a second terminal and set CUDA_VISIBLE_DEVICES\
    \ to expose GPU 1:\n\n```\n$ export CUDA_VISIBLE_DEVICES=\"1\"\n$ python object_detection/eval.py\
    \ --logtostderr \\\n    --pipeline_config_path sds_and_rcnn/lisa/experiments/training/faster_rcnn.lisa.config\
    \ \\\n    --checkpoint_dir dir sds_and_rcnn/lisa/experiments/training \\\n   \
    \ --eval_dir sds_and_rcnn/lisa/experiments/evaluation\n```\n\nHere only GPU 1\
    \ is visible to TensorFlow and therefore TensorFlow will only use GPU 1 for\n\
    eval.py in this manner I can isolate specific GPUs to scripts.\nOf course, if\
    \ you do not want TensorFlow use a GPU for a script, typical behavior when the\n\
    machine has only one GPU and this is utilized for training, you can set CUDA_VISIBLE_DEVICES\n\
    to be empty:\n\n```\n$ export CUDA_VISIBLE_DEVICES=\"\"\n$ python object_detection/eval.py\
    \ --logtostderr \\\n    --pipeline_config_path sds_and_rcnn/lisa/experiments/training/faster_rcnn.lisa.config\
    \ \\\n    --checkpoint_dir dir sds_and_rcnn/lisa/experiments/training \\\n   \
    \ --eval_dir sds_and_rcnn/lisa/experiments/evaluation\n```\n\nThe above command\
    \ will instruct TensorFlow there are no GPUs (by using the blank stringnin the\
    \ export command) and that the CPU should be used when executing eval.py.\n\n\
    # Optimizers Parameters\n\nLooking at our pipeline configuration you'll see that\
    \ we've not fiddled with the optimizer\nparameters. In case of Faster R-CNN +\
    \ ResNet-101, the default configuration uses a SGD +\nNesterov optimizer with\
    \ a learning rate of 0.0003 — you should keep these optimizer\nparameters as is\
    \ until you are comfortable with the toolkit and have replicated the results\n\
    of this task a a handful of times.\n\nAdditionally, be sure to read the contents\
    \ of the pipeline configuration from the\nTensorFlow community as they gave suggested\
    \ values for parameters. A full review\nof all possible optimizer parameters the\
    \ TFOD API is outside the scope of this book,\nbut provided you have read through\
    \ the Starter Bundle and Practitioner Guide, you'll find the\nparameters used\
    \ inside the TFOD API closely match Keras and mnist. Be sure to refer to the\n\
    TFOD API documentation for questions regarding parameters: http://pymig.com/pml2d\
    \ [45].\n\n# Respect the Toolkit!\n\nAfter going through this section you'll see\
    \ a number of recommendations and best practices\nI suggest, but none of them\
    \ are as important as Section 16.3.8 — there is a learning curve\nand you need\
    \ to dedicate the energy to climb it.\n\nThe TFOD API is an extremely powerful\
    \ tool and once you get to use it, you'll be able to\nquickly and train your own\
    \ deep-learning object detectors. But to get to point,\ny'll need to be patient.\n\
    \nInevitably, you'll run into error. Take the time to read through it, digest\
    \ it, and even spend\ns time Googling the error and reading the TensorFlow documentation.\
    \ Do not expect a \"quick\nfix\", that expectation is typically unrealistic.\n\
    That said, more than times, you'll find your error is due to either:"
