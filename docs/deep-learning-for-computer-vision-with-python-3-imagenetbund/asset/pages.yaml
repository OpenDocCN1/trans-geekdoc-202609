    \ This implies our output dataset will have the following directory structure:\n\
    \n```\n/output/{angle_name}/{image_filename}.jpg\n```\n\n**Lines 50 and 51** check\
    \ to see if the /output/{angle_name} directory exists, and if not, create the\
    \ required sub-directory. By using the output path, we can derive the path to\
    \ the actual image on **Lines 55-58** by extracting the:\n\n+   1. Original image\
    \ extension.\n2. The number of images currently selected by the given angle.\n\
    3. Finally, **Line 61** writes our output to disk in the the correct angle sub-directory,\
    \ ensuring we can easily determine the label of the image by simply examining\
    \ the file path. For example, /rotated_images/180/image_00000.jpg has been rotated\
    \ by 180 degrees because it resides in the 180 sub-directory.\nIn order to keep\
    \ track of the number of images per angle, we update the angles bookkeeping dictionary\
    \ in the following code:\n\n```\n# update the count for the angle\nc = angles.get(angle,\
    \ 0)\nangles[angle] = c + 1\nbar.update(i)\n```\n\nFinally, we display some statistics\
    \ on the number of images per angle in our dataset:\n\n```\n# finish the progress\
    \ bar\nbar.finish()\n\n# loop over the angles and display counts for each of them\n\
    for angle in sorted(angles.keys()):\n    print(\"[INFO] angle={}: {}\".format(angle,\
