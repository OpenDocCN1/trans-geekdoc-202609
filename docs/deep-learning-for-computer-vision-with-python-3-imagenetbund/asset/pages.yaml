    In ImageNet and model models, we have computed both rank-1 and rank-5 accuracy;
    however, in case of Adience, rank-5 accuracy does not seem intuitive. 100%. Therefore,
    by reporting the accuracy of the gender model, we''ll simply report if a given
    classification is correct or not.


    For the model we use what Levi et al. call "one-off" accuracy. One-off accuracy
    measures whether the ground-truth label matches the predicted label or if the
    ground-truth label exists in the two adjacent bins. For example, suppose our model
    predicted the age range 15–20; however, the ground-truth label is 25–32 – according
    to the one-off evaluation metric, this is still correct if 15–20 exists in the
    set {15–20,25–32,38–48}.


    Note that one-off accuracy is not the same as rank-2 accuracy. For example, if
    our model predicted with an image containing a person of age 48–53 (i.e., the
    ground-truth label) and our predicted:


    +   * 4–6 with probability 63.7%

    * 48–53 with probability 36.3%

    * 38–43 with probability 63.7%

    * 48–53 with probability 36.3%


    Then we would consider this incorrect classification since the first predicted
    label (4–0) is not adjacent to the 48–53 bin. If not our model predicted:


    This would be a correct one-off prediction if the 38–43 bin is directly adjacent
    to the 48–53 line in this chapter.


