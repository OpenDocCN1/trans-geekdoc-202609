- pgno: 316
  md: '# 19.1 Where to Now?


    +   - https://github.com/fchollet/keras

    - https://github.com/dmlc/mxnet


    By following above repositories, you to receive email notifications as the libraries
    (and functionality) are updated. Staying on top of these packages will enable
    you to quickly iterate your projects based on new features coming down the pipeline.
    While it alters interesting to discuss the theory behind deep learning, it''s
    no secret that I''m a proponent of actual implementing what we learn – both Keras
    and mxnet will enable you to improve your implementation skills.


    For more general purpose deep learning news delivered to you on a weekly basis,
    I recommend this Wild Week in AI, by Denny Breit:


    http://www.dmldl.com/newsletter/


    And I would recommend Deep Learning Weekly, put together by Jan Bass and Matthew
    Baumann:

    http://www.deeplearningweekly.com/


    Both of these newsletters serve content that is relevant to the larger deep learning
    community, but with the traction and interest of deep learning applied to computer
    vision, you''ll see content related to computer vision in nearly every issue.


    Finally, make sure you stay up to date on the PyImageSearch.com blog and follow
    along with new posts. Not every post may be related to deep learning, you''ll
    be able to use these tutorials to better understand computer vision and apply
    these techniques to actual, real-world projects.


    A little bit of computer vision knowledge can go a long way when studying deep
    learning, so if you haven''t already, be sure to take a look at both Practical
    Python and OpenCV [34]:


    http://pyimg.com/ppao


    And the more intensive PyImageSearch Guru course [35]:


    http://pyimg.com/gurus


    Both of these resources will enable you to level-up your general computer vision
    skills, and in turn, help you get on your deep learning career.


    Thank you for allowing me to accompany you on your journey to becoming deep learning
    expert. If you have any questions, please email me at adrian@pyimagesearch.com.
    And no matter what, keep practicing and keep implementing – deep learning is part
    science, part art. The more you practice, the better you''ll become.


    Cheers,


    -Adrian Rosebrock'
