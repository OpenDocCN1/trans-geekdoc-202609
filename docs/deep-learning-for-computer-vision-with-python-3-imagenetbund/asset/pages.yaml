  md: "# 6.2 TrainingAlexNet\n\nc out of the script, adjust your learning rate, and\
    \ continue training. By supplying a -start-epoch, we can resume training from\
    \ a specific previous epoch that has been serialized to disk.\n\nWhen training\
    \ our network from scratch we'll use the following command to kick off the training\
    \ process:\n\n```\n$ python train_alexnet.py --checkpoints checkpoints --prefix\
    \ alexnet\n```\n\nHowever, if we wanted to resume training from a specific epoch\
    \ (in this case, epoch 50), we would provide this command:\n\n```\n$ python train_alexnet.py\
    \ --checkpoints checkpoints --prefix alexnet \\\n--start-epoch 50\n```\n\nKeep\
    \ this in mind when you are training AlexNet on the ImageNet dataset. As I mentioned\
    \ before, mxnet uses logging to display training progress. Instead of displaying\
    \ the training log to stdout, we should capture the log and save it to disk so\
    \ we can parse it and review it:\n\n```\n# set the logging file and output file\n\
    logging.basicConfig(level=logging.DEBUG\n```\n\nLines 21 and 22 create a file\
    \ training_{epoch}.log based on the value of --start-epoch. Having a unique filename\
    \ for each starting epoch will make it easier to track accuracy and loss over\
    \ time, as discussed in the PySearch blog post above.\nNext, we can use our RGB\
    \ means from the batch to compute the batch:\n\n```\n# load the RGB means for\
    \ the training set, then determine the batch\n# size\nmeans = json.loads(open(config.DATASET_MEAN).read())\n\
    batchSize = config.BATCH_SIZE * config.NUM_DEVICES\n```\n\nPreviously, our batch\
    \ size was a fixed number since we were using only a single CPU/GPU device to\
    \ train networks. However, now that we are starting to explore the world of multiple\
    \ GPUs, our batch size is actually BATCH_SIZE * NUM_DEVICES. The reason why our\
    \ batch size increases by the total number of CPUs/GPUs we are training our network\
    \ with is because each device is parsing a separate batch of images in parallel.\
    \ After all devices have processed their batch, mxnet updates the weights in the\
    \ network. Therefore, our batch size actually increases with the number of devices\
    \ we use for true parallelization.\nOf course, we need to access our training\
    \ data in order to train AlexNet on ImageNet:\n\n```\n# construct the image iterator\n\
    trainIter = mx.io.RecordIterator(\n    path_imgrec=config.TRAIN_MX_REC,\n    data_shape=(3,\
    \ 227, 227),\n    batch_size=batchSize,\n    rand_crop=True,\n```"
