    \ 26-29 defines a datasets tuple consisting of the input training/testing XML\
    \ file and the output training/testing record file. In Chapter 16 we had to manually\
    \ build our training and testing split, but for the vertices dataset our is pre-split\
    \ - no additional work is required from us on this.\n\nNext, let's looping over\
    \ each of the training and testing splits,:\n\n```\n# loop over the datasets\n\
    for (dtype, inputPath, outputPath) in datasets:\n    # build the soup\n    print(\"\
    [INFO] processing {}\".format(dtype))\n    contents = open(inputPath).read()\n\
    \    soup = BeautifulSoup(contents, \"html.parser\")\n\n    # initialize the TensorFlow\
    \ writer and initialize the total\n    # number of examples written to file\n\
    \    writer = tf.python.io.TFRecordWriter(outputPath)\n    total = 0\n```\n\n\
    Line 35 loads the contents of the current inputPath while Line 36 builds the soup\
    \ by applying BeautifulSoup to parse the contents and build an XML tree that we\
    \ can traverse in memory. Line 40 creates a writer, an instantiation of TFRecordWriter,\
    \ that we can use to write images and bounding boxes to the output TensorFlow\
    \ record file.\n\nLet's traverse the XML document by looping over all image elements:"
