    pool5 = mx.sym.Pooling(in5b, pool_type=\"avg\",\n      kernel=(7, 7), stride=(1,\
    \ 1))\ndoo = mx.sym.Dropout(dropout=pool5, p=0.4)\n```\n\nExamining Lines 89 and\
    \ 90 you can see that a total of 384+384+128+128=1024 filters are outputted from\
    \ the concatenation operation during Inception module 5b. This result produces\
    \ an output volume of 7 x 7 x 1024. To alleviate the need for fully-connected\
    \ layers, we can average the 7 x 7 spatial dimensions to 1 x 1 x 1024, a common\
    \ technique used in GoogleNet, ResNet, and SqueezeNet. Doing allows us to reduce\
    \ the overall number of parameters in our network substantially.\n\nFinally, we\
