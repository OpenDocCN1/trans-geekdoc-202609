    modules. Each residual module and three residual modules, respectively. By using
    both the for on Line 70 and Line 78, we can reduce the amount of code we would
    have to write (unlike in previous architectures where each was `hardcoded`).


    It''s worth noting that this stacking of the filters is what makes it very easy
    for us to control the depth of a ResNet implementation. If you want to increase
    the number of residual modules stacked at each stage, in the case of ResNet152,
    we can set stages=(3, 8, 36, 3) to create a very deep network. If you would rather
    your ResNet to be shallower (in the case that you want to train a small number
    of GPUs), you would decrease the number of residual modules stacked at each stage.
    For ResNet18, we may set stages=(2, 2, 2, 2) to create a shallow, but faster to
    train network. After we are done residual modules we can use a batch normalization,
    activation, and then pooling:


    ```

