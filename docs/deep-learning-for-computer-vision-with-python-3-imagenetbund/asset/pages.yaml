    # 13.2 VGG Fine-tuning: Experiment #1


    In my experiment, fine-tuning the VGG16 architecture on the Stanford Cars dataset,
    I decided to use the SGD optimizer with an initial learning rate of 1e-4. A large
    learning rate is technically necessary for fine-tuning, but I decided to give
    it a try to obtain a baseline accuracy. A momentum of 0.9 and L2 weight decay
    of 0.005 were supplied. I started training using the following command:


    ```

    $ python fine_tune_cars.py --vgg vgg16/vgg16 --checkpoints checkpoints \

    --prefix vggnet

    ```


    During the first 10 epochs, we see that our fine-tuning looks quite good, with
    nearly 70%-rank-1 accuracy and over 90% rank-5 accuracy being obtained (Figure
    13.2, left). However, past epochs 15-30, we start to see VGG overfitting the training
    data.


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_193_0.png)


    **Figure 13.2: Left:** Fine-tuning VGG16 on the cars dataset. The first 10 epochs
    look good, but epoch 15 start to see overfitting. **Right:** Lower $\alpha$ to
    1e-5 saturates learning.


    I decided to stop training at this point and lower the learning rate from 1e-4
    to 1e-5 and then restart training command:


    ```

    $ python fine_tune_cars.py --vgg vgg16/vgg16 --checkpoints checkpoints \

    --prefix vggnet --start-epoch 30

    ```


    I then let training resume for 15 more epochs after epoch 45 (Figure 13.2, right).
    As we see, both loss and accuracy are nearly saturated, the rank-1 accuracy for
    the training data is actually higher than the rank-5 accuracy for the validation
    set. Furthermore, examining'
