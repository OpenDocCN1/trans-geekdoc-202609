  md: '# 10. Training SqueezeNet on ImageNet


    In our final chapter on training deep neural networks on the ImageNet Large Scale
    Visual Recognition Challenge (ILSVRC), we will be discussing arguably my favorite
    deep learning architecture to date – SqueezeNet – introduced by Iandola et al.
    in their 2016 paper, SqueezeNet: AlexNet-level accuracy with 50x fewer parameters
    and < 0.5MB model size [30].


    The title alone of this book should pique your interest. Most of the previous
    architectures we''ve discussed in this book have a model size between 100MB (ResNet)
    and 553MB (VGGNet). AlexNet sits in the middle of this range too much with a model
    weight of 249MB. The closest we''ve come to a “tiny” model size is Googlet at
    28MB – but we can go smaller and still maintain state-of-the-art accuracy.


    As the work of MobileNet demonstrates, the answer is yes, although decrease model
    size by applying a model weighing in 1x1 and 3x3 convolutions, with no fully-connected
    layers. The result is a model weighing of 4.9MB, which can be further reduced
    to 0.5MB by model compression, also called weight pruning and “sparsifying a model”
    (setting 50% of the smallest weight values across layers to zero). In this chapter,
    we''ll focus on the original implementation of SqueezeNet. The concept of model
    compression, including quantization, is outside the scope of this book but can
    be found in the relevant academic publication [30].


    # 10.1 Understanding SqueezeNet


    In this section we will:


    +   1. Review the Fire Module, the critical micro-architecture responsible for
    reducing model parameters and maintaining a high level of accuracy.

    2. Review the entire SqueezeNet architecture (i.e., the macro-architecture).

    3. Implement SqueezeNet by hand using mxnet.


    Let''s go ahead and start with a discussion on the Fire module.


    # 10.1.1 The Fire Module


    The work by Iandola et al. served two purposes. The first was to provide a case
    for more research into designing Convolutional Neural Networks that can be trained
    with a dramatic reduction in the'
