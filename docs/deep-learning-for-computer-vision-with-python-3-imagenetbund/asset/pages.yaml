- pgno: 160
  md: "# 11.5 Emotion Detection in Real-time\n\nAs my results demonstrate, we were\
    \ able to obtain 66.96% accuracy on the test set, enough for us to claim the 5th\
    \ position on the Kaggle Expression Recognition Challenge [31].\n\n> This 66.96%\
    \ classification result was obtained from the 6-class variant of FER2013, not\
    \ the 7-class original version in the Kaggle recognition challenge. That said,\
    \ we can easily re-train the network on the 7-class version and get a similar\
    \ accuracy. The reason we are ending with the 6-class network is so we can obtain\
    \ more meaningful results when applied to real-time emotion detection in the next\
    \ section.\n\n# 11.5 Emotion Detection in Real-time\n\nNow that CNN is trained\
    \ and evaluated, let's apply it to detect and face facial expressions in video\
    \ streams. Open a new file, name it emotion_detector.py, and insert the following\
    \ code:\n\n```\n# import the necessary packages\nfrom keras.preprocessing.image\
    \ import img_to_array\nfrom keras models import load_model\nimport numpy as np\n\
    import argparse\nimport imutils\nimport cv2\n\n# construct the argument parse\
    \ and parse the arguments\nparse = argparse.ArgumentParser()\nparse.add_argument(\"\
    -c\", \"--cascade\", required=True,\n                    help=\"path to where\
    \ the cascade resides\")\nparse.add_argument(\"-m\", \"--model\", required=True,\n\
    \                    help=\"path to the trained emotion detector CNN\")\nparse.add_argument(\"\
    -v\", \"--video\",\n                    help=\"path to the (optional) video file\"\
    )\nargs = vars(parse.parse_args())\n```\n\nLines 2-7 import required Python packages.\
    \ From there on, we parse command line arguments. Our script requires two switches,\
    \ followed by a detail. The --cascade switch is the path to our face Haar Cascade\
    \ (included in the downloads portion of this book). The --model is our pre-trained\
    \ CNN that we will use to detect emotion. Finally, if you want to apply emotion\
    \ detection to a video file rather than a video stream, you can supply the path\
    \ to the file via the --video switch.\n\nFrom there, let's define our detector\
    \ cascade, emotion detection CNN, as well initialize the list of emotions our\
    \ CNN can predict:\n\n```\n# load the face detector cascade, emotion detection\
    \ CNN, then define\n# the list of emotion labels\ndetector = cv2.CascadeClassifier(args[\"\
    cascade\"])\nmodel = load_model(args[\"model\"])\nEMOTIONS = [\"angry\", \"scared\"\
    , \"happy\", \"sad\", \"surprised\",\n\"neutral\"]\n```\n\nNotice how our EMOTIONS\
    \ list contains six entries, implying that we are using the 6-class version of\
    \ FER2013 for better accuracy."
