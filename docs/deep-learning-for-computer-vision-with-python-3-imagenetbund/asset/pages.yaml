  md: "# Chapter 11. Case Study: Emotion Recognition\n\nOur following code instantiates\
    \ a cv2.VideoCapture object based on whether we\n(1) accessing a webcam or (2)\
    \ reading from a video file:\n\n```\n# if a video path was not supplied, grab\
    \ the reference to the webcam\nif not args.get(\"video\", False):\n    camera\
    \ = cv2.VideoCapture(0)\n\n# otherwise, load the video\nelse:\n    camera = cv2.VideoCapture(args[\"\
    video\"])\n```\n\nWe are ready to start looping over frames from the video pointer:\n\
    \n```\n# keep looping\nwhile True:\n    # grab the current frame\n    (grabbed,\
    \ frame) = camera.read()\n\n    # if we are viewing a video and we did not grab\
    \ a\n    if not frame, we have reached the end of the video\n    if args.get(\"\
    video\") and not grabbed:\n        break\n```\n\nLine 37 reads the next frame\
    \ from the video stream. If the frame was not grabbed (i.c., set to\nFalse) and\
    \ we are reading frames from a video stream, we have reached the end of the file,\
    \ so we\nshould break from the loop (Lines 41 and 42).\n\nOtherwise, it is time\
    \ to pre-process the frame by resizing it to a height of 300 pixels and\nconverting\
    \ to grayscale:\n\n```\n# resize the frame and convert to grayscale\nframe = imutils.resize(frame,\
    \ width=300)\ngray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)\n```\n\n```\n# initializes\
    \ the canvas for the visualization, then clone\n# frame so we can draw on it\n\
    canvas = np.zeros((200, 300, 3), dtype=\"uint8\")\nframeClone = frame.copy()\n\
    ```\n\n```\n# detects faces in the input frame, then clone the canvas so that\n\
    we can draw on it\nrects = detector.detectMultiScale(gray, scaleFactor=1.1,\n\
    minNeighbors=6, minSize=(30, 30),\nflags=cv2.CASCADE_SCALE_IMAGE\n```\n\nWe initialize\
    \ an empty canvas (Line 50) which has a width of 300px and a height of\n200px.\
    \ We'll be using the canvas to draw the probability distribution detected by our\
    \ CNN,\nwe will use this to visualize the range and mixture of the emotions.\n\
    \nLines 55-57 then detects faces in the frame using OpenCV's Haar cascade. If\n\
    y are interested in learning more about object detection via Haar, please refer\
    \ to\nPractical Python and OpenCV [34] (http://pyimg.com/ppao) and the PyImageSearch\
    \ Gyrus course\n[35] (http://pyimg.com/gurus/).\n\nIn the next code, we prepare\
    \ the frame ROI via the CNN:"
