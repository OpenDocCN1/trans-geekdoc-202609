- pgno: 156
  md: '# 11.3 Training Our Facial Expression Recognizer


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_156_0.png)


    Figure 11.3: **Left:** The first 30 epochs for a $\alpha = 1e-3$ learning rate
    and the Adam optimizer. **Right:** Lowering the learning rate to $\alpha = 1e-4$
    clears overfitting.


    As the plot below, learning is much more stable with saturation to occur around
    epoch 40 (Figure 11.4, top-left). At this point, I stopped training, lowered the
    Adam learning rate from $1e-3$ to $1e-4$, and resumed training:


    ```

    $ python train_recognizer.py --checkpoints checkpoints \

    --model checkpoints/epoch_40.hdf5 --start-epoch 40

    ```


    This process led to a characteristic drop in loss/rise in accuracy which we expect
    when adjusting the learning rate in this manner (Figure 11.4, top-right). However,
    learning plateaus, so I again stopped training at epoch 60, lowered the learning
    rate from $1e-4$ to $1e-5$, and resumed training for another 15 epochs:


    ```

    $ python train_recognizer.py --checkpoints checkpoints \

    --model checkpoints/epoch_60.hdf5 --start-epoch 60

    ```


    The final plot of the network can be seen in Figure 11.4 (*bottom*). As we can
    see, we aren''t at risk of overfitting—the downside is that we aren''t seeing
    any dramatic gains in accuracy epoch 45. All that, by applying data augmentation
    we were able to stabilize learning, reduce overfitting, and allow to reach 67.53%
    classification accuracy on the validation set.


    # 11.3.4 EmotionVGGNet: Experiment #4


    +   In my final experiment with FER2013 and EmotionVGGNet I decided to make a
    few changes:

    1. I swapped out Xavier/Glorot initialization (the used by Keras) for MSRA/He
    et al. initialization. This is swap due to the fact that He et. initialization
    tends to work better for the VGG family of networks (as we''ve seen in earlier
    experiments in this book).'
