- pgno: 262
  md: '# 16. Training a Faster R-CNN From Scratch


    In our previous chapter we discussed the Faster R-CNN architecture and its many
    components, including the Region Proposal Network (RPN) and ROI Pooling module.
    While the previous chapter focused strictly on the inner-working parts, this chapter
    will switch implementation and how to actually train a Faster R-CNN on a custom
    dataset.


    We are going to be a "deep learning for self-driving cars" approach to both this
    chapter and Chapter 18 on Single Shot Detectors. By the end of this chapter you''ll
    be able to:


    +   1. Install and configure the TensorFlow Object Detection API on your system

    2. Build an image dataset + image annotations in the TensorFlow Object Detection
    API Form

    3. Train a Faster R-CNN on the LISA Traffic Signs dataset (or your own dataset)

    4. Evaluate the accuracy and apply the trained Faster R-CNN to input images and
    videos


    # 16.1 The LISA Traffic Signs Dataset


    The LISA Traffic Signs dataset was curated and put together by Mogelmose et al.
    and fully detailed in their 2012 paper, Vision-Based Traffic Sign Detection and
    Analysis for Intelligent Driver Assistance Systems: Perspectives and Survey [57].


    The dataset consists of 47 different United States sign types, including stop
    signs, pedestrian crossing signs. An example image from the LISA Traffic Signs
    dataset can be seen in Figure 16.1. The dataset was initially captured via video
    the individual faces and annotations are also included.


    There are a total of 7,855 annotations on 66,610 images. Road signs vary in resolution,
    from 6 x 6 to 167 x 168 pixels. Furthermore, some images were captured in a lower
    resolution 640 x 480 camera while others were captured on a higher resolution
    1024 x 522 pixels. Some images are grayscale while others are color. The variance
    in camera quality and color space makes this an interesting study to in terms
    of object detection.


    The full LISA Traffic Signs dataset is over 7GB, in order to train our network
    faster (and learn the fundamentals of object detection quicker), we will be sampling
    three traffic sign classes: stop sign, pedestrian crossing, and signal heads.
    We''ll be training our Faster R-CNN on this'
