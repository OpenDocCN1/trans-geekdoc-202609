  md: '# 11.6 Summary


    ![](img/7db52e410ee84ec5a30b3190e73b61d3_164_0.png)


    Figure 11.6: Examples of facial expression recognition using our Convolutional
    Neural Network. In each case we are able to correctly recognize the emotion. Furthermore,
    notice that the probability distribution represents facial expression as a mixture
    of emotions.


    there is a mixture of emotions. A few seconds later, my face turns to a resting,
    neutral position (bottom-left). Finally, in bottom-right, I clearly surprised.

    It''s important to note that this model was not trained on any example images
    of myself – the only dataset used was FER2013. Given that our model is able to
    correctly predict my facial expressions, we can say it has a very good ability
    to generalize.


    # 11.6 Summary


    In this chapter, we learned how to implement a Convolutional Neural Network capable
    of predicting emotion and facial expressions. To accomplish this, we trained a
    VGG-like CNN named EmotionVGGNet. This network consisted of two CO2W layers stacked
    on top of each other with the number of filters doubling in each block. It was
    important that our CNN be:


    +   1. Deep enough to achieve high accuracy.

    2. But not so deep that it would be impossible to run in real-time on the CPU.

    We trained our CNN on the FER2013 dataset, part of the Kaggle Emotion and Facial
    Expression Recognition challenge. We were able to obtain 66.96% accuracy, enough
    to catch the #5 position on the leaderboard. Further accuracy can be obtained
    by being more aggressive with our data augmentation, deepening the network, increasing
    the number of layers, and adding regularization.


    Finally, we experimented by creating a Python script that can (1) detect faces
    in a video stream and (2) apply our pre-trained CNN to recognize dominant facial
    expression in real-time. Furthermore, we also included the probability distribution
    for each emotion, enabling us to easily interpret the results of our network.


    Again, keep in mind that as humans, our emotions are fluid and are constantly
    changing. Furthermore, our emotions are often mixtures of each other – we are
    rarely, if ever, 100% happy or 100% sad – instead we are some blend of feelings.
    Because of this fact, it''s important that you examine the probability distribution
    returned by EmotionVGGNet when trying to label the facial expression of a given
    person.'
