    # 5.2 Building the ImageNet Dataset


    The overall goal of building the ImageNet dataset is so that we can train Convolutional
    Neural Networks from scratch on it. We will review building the ImageNet dataset
    in context of preparing it for a CNN. So, we''ll first define a configuration
    file that stores relevant image paths, plaintext paths, and any other settings
    we wish to.


    From there, we''ll define a Python class ImageNetHelper which will enable us to
    quickly and easily build:

    1. .txt files for the training, testing, and validation split. Each line in a
    .txt file contains the unique ID, class label, and the full path to the image.
    We will then be able to use .txt files in conjunction with the mxnet tool im2rec
    to convert our image files to an efficiently packed record file.

    2. Our mean Red, Green, and Blue averages for the training set which we''ll use
    later when performing mean normalization.


    # 5.2.1 Your First ImageNet Configuration File


    When training a CNN on ImageNet, we will create a project with the following directory
    structure:


    ```

    --- mx_imagenet_alexnet

    |--- config

    ```'
