    \ of size 3x3. A leaky ReLU variant, PReLU (covered in Chapter 10 of the Starter\
    \ Bundle) is used as activation function. After PReLU we then apply a batch normalization\
    \ layer (not included in the original paper, but useful when stabilizing the training\
    \ of VGG). At the end of the layer a pooling layer is used to reduce the spatial\
    \ dimensions of the volume using a 2x2 and a 2x3 stride, reducing the volume size.\
    \ We also dropout with a small percentage (25%) to help overfitting.\n\nThe second\
    \ layer set in VG16 (Conv -> RELU) * 2 -> POOL, 128 filters are learned (each,\
    \ of size 3x3). The number of filters has doubled since we reduced the spatial\
    \ volume through the pooling operation:\n\n```\n# Block #2: (Conv -> RELU) * 2\
