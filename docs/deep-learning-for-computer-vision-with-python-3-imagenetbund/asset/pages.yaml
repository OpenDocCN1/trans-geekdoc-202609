- pgno: 204
  md: '# 14. Case Study: Age and Gender Prediction


    In this final Case Study in Deep Learning for Computer Vision with Python, we''ll
    learn how to build a computer vision system capable of recognizing the age and
    gender of a person in a photograph. To accomplish this task, we''ll be using the
    Adience dataset, curated by Levi and Hassner and used in their 2015 publication,
    *Age and Gender Classification using Convolutional Neural Networks*


    This case study is more complex than the previous ones, requiring us to train
    two models, one for one recognition and another for gender identification. Furthermore,
    we''ll also have to rely on more advanced computer vision algorithms such as facial
    landmarks (http://pyimg.com/sgkwd) and face alignment (http://pyimg.com/hnzl)
    to help us pre-process our images for classification.


    We''ll start off with a discussion on the Adience dataset and review our project
    structure. From there, we''ll train two instances of BxGenderRet, an implementation
    of the network proposed by Levi et al., to recognize one ages and the other to
    recognize genders. Once we have these networks, we''ll apply them to images outside
    the Adience dataset and evaluate performance.


    Due to the length of this chapter, we''ll review the most important aspects of
    the case study, including the code used to train and evaluate the network. Further
    detail, especially regarding the utility functions and helper classes we define
    later in the chapter can be found in the supplementary material accompanying this
    book.


    # 14.1 The Ethics of Gender Identification in Machine Learning


    Before we get too far in this chapter I want to bring up the ethics of age and
    gender identification. While utilizing computer vision and deep learning to recognize
    the age and gender of a person in a photo is an interesting classification challenge,
    it is one wrought with moral implications. Just because someone visually looks,
    dresses, or appears a certain way does not imply they identify with that (or any)
    gender.


    Before considering building a piece of software that attempts to recognize the
    gender of a person, take the time to educate yourself on gender issues and gender
    equality.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Chapter 14. Case Study: Age and Gender Prediction


    Applications such as gender recognition are used for "demographic surveys", such
    as monitoring the number of people who stop and examine various kiosks at a department
    store. The types of surveys can help you optimize the layout of a store and in
    turn make more sales. Even when you need to take extreme care to ensure that smaller
    groups of people are not marginalized. Keep in mind the law of large numbers as
    individual data points will outweight in the population.


    You should never use gender to customize user experience (e.g., swapping gender-specific
    pronouns based on (1) photos of individual users utilizing your software and (2)
    the output of your model). Not only are machine learning models from perfect,
    you also have the moral responsibility to not assume a sense of gender.


    Age and gender classification is a very interesting task to examine from a computer
    vision perspective – not only is it challenging, but it’s also a great example
    of a fine-grained classification where subtle differences may make the difference
    in a correct or incorrect classification.


    But therein lines are not data points and gender is not binary. There are very
    few applications of gender recognition using artificial intelligence. Software
    that attempts to distill gender into binary classification only further chains
    to antiquated notions of what gender is. I would encourage you to not utilize
    gender recognition in your applications if at possible. If you must perform gender
    recognition, make sure you are holding yourself accountable and ensure you are
    not building applications that attempts to conform to other stereotypes.


    Use this chapter to help you understand computer vision and deep learning, but
    use your knowledge for good. Please be respectful of your fellow humans and educate
    yourself on gender issues and gender equality.


    My hope is that you learn Deep Learning for Computer Vision with Python, not because
    people use it for nefarious, egregious reasons, but that gender identification
    is so antiquated that no one thinks about gender, let alone try to identify it.


    # 14.2 The Audience Dataset


    The dataset [39] consists of 26,580 images of faces. A total of 2,284 subsets
    (people) were captured in this dataset. The dataset was split into two gender
    classes (male and female) along with age groups; specifically: 0-2, 4-6, 8-13,
    15-20, 25-32, 38-43, 48-53, and 60+. The goal of the dataset is to correctly predict
    the age and the gender of a person in a photo. A sample of the dataset is seen
    in Figure 14.1.


    The dataset is imbalanced with many samples present for people in the age brackets
    25 – 32 than any other age group by a factor of 2 (4,897). Samples in the age
    48 - 53 and 60+ are the most underrepresented (825 and 869, respectively). The
    number of male samples (8,192) is slightly lower than the number of female data
    points (9,411), which is still within reasonable limits of class distribution.


    When training a model on this dataset, we have two choices:


    +   1. Train a single classifier that is responsible for predicting the gender
    and age classes, for a total of 16 possible classes.

    2. Train two classifiers, one responsible for predicting gender (2 classes) and
    a separate model for age recognition (8 classes).


    Both methods are viable options; however, we are going to take the approach of
    Levi and train two separate CNNs – not only will enable us to produce their results
    (and even outperform their reported accuracies), but it will enable our classifier
    to be more robust. The facial features learned to discriminate a 60+ woman are
    extremely different than the features learned to recognize a man who is also 60+
    therefore, it makes sense to separate age and gender into two separate classifiers.'
  merge: -1
  img_proc: true
