    To evaluate ResNet, we will be using the test_resnet.py script mentioned in our
    project structure above. This script is identical to all other test-*. scripts
    used in ResNet experiments. Since these scripts are the same, I will not reviewing
    the program line-by-line. If you would like a detailed review of this evaluation
