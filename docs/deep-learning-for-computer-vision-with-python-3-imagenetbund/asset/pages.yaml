  md: '# Chapter 5. Preparing the ImageNet Dataset


    took two restarts and a total of 27.15 hours to download). I then unpacked the
    archive using the following command:


    ```

    $ tar -xvf ILSVRC2015_CLS-LOC.tar.gz

    ```


    I would suggest starting this command right before you go to bed to ensure it
    has been fully unpacked by the time you wake up in the morning. Keep in mind that
    there are over 1.2 million images in the training set alone, the unarchive process
    will take a bit of time.\ Once the tar has finished uncompressing, you''ll have
    a directory named ILSVRC2015:


    ```

    $ ls ILSVRC2015

    ```


    Let''s go ahead and change directory into ILSVRC2015 and list the contents, where
    you''ll find three sub-directories:


    ```

    $ cd ILSVRC2015

    $ ls

    Annotations Data ImageSets

    ```


    First, we have the Annotations directory. This directory is only used for the
    localization challenge (i.e., object detection), so we can ignore it.

    The Data directory is more important. Inside Data we''ll find a sub-directory
    named CLS-LOC:


    ```

    $ ls Data/

    CLS-LOC

    ```


    Here we can find the training, testing, and validation "splits":


    ```

    $ ls Data/CLS-LOC/

    test train

    ```


    I put the word "splits" in quotations as there is still work that needs to be
    done in order to get this in a format that we can train a Convolutional Neural
    Network on it and state-of-the-art classification results. Let''s go ahead and
    review each of these sub-directories individually.


    # 5.1. ImageNet "test" Directory


    The test directory (as the name implies) 100,000 images (100 data points for each
    of the 1,000 classes) for our testing split:


