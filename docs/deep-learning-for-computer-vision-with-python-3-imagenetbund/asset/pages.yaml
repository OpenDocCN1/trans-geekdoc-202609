    the channel axis in which to normalize the activations – the channel axis is determined
    by mxnet automatically.


    To reduce the spatial dimensions of the input we can apply the Pooling class on
    **Lines 15 and 16**. The Pooling class accepts the output of bn1_1 as its input,
    then applies max pooling with a kernel size of $3 \times 3$ and a stride of $2
    \times 2$. Dropout is applied on **Line 17** to reduce overfitting.


    Given this is first exposure to implementing a layer in mxnet, I would recommend
    going back and re-reading this once or twice. There are parallels between the
    naming conventions in mxnet and Keras, make sure you understand them now, *especially
    between the data argument and how we explicitly define the input of a current
    layer as the output of* a previous layer.


    The rest of the AlexNet implementation I have implemented in less detail below:


    +   1. You have implemented AlexNet once before in the *Practitioner Bundle*.

    2. The code itself is quite self-explanatory and each line of code ad naousum
    will become tedious.


    Our next layer consists of another block of CONV => RELU POOL layers:


    ```

    # Block #2: second conv -> RELU -> pool layer

    conv2_1 = mx.sym.Convolution(data=do1, kernel=(5, 5),

    pad=(2, 2), num_filter=256)

    act2_1 = mx.sym.ReLU(data=conv2_1, type="elu")

    b2_1 = mx.sym.BatchNorm(data=act2_1)

    pool2 = mx.sym.Pooling(data=bn2_1, pool_type="max",

    kernel=(3, 3), stride=(2, 2))

    doo2 = mx.sym.Dropout(data=pool2, p=0.25)

    ```


    Our conv layers have 256 filters, each of size $5 \times 5$. Unlike Keras which
    automatically handle the padding of required (i.e., padding="same"), we need to
    explicitly supply the padding value. Padding (2, 2) ensures that the input and
    output spatial dimensions are the same.


    After the conv layer, another ELU activation is applied, followed by a Max pooling.
    Max pooling is applied to the input of BatchNorm, reducing the spatial size to
    $13 \times 13$ pixels. Dropout is applied to reduce overfitting.


    To learn deeper, we''ll stack multiple CONV => RELU layers on top of each other:


    ```

    # Block #3: (CONV => RELU) * 3 => POOL

    conv3_1 = mx.sym.Convolution(data=do2, kernel=(3, 3),

    pad=(1, 1), num_filter=384)

    act3_1 = mx.sym.ReLU(data=conv3_1, type="elu")

    b3_1 = mx.sym.BatchNorm(data=act3_1)

    conv3_2 = mx.sym.Convolution(data=bn3_1, kernel=(3, 3),

    pad=(1, 1), num_filter=384)

    act3_2 = mx.sym.ReLU(data=conv3_2, type="elu")

    b3_2 = mx.sym.BatchNorm(data=act3_2)

    conv3_3 = mx.sym.Convolution(data=bn3_2, kernel=(3, 3),

    pad=(1, 1), num_filter=256)

    act3_3 = mx.sym.ReLU(data=conv3_3, type="elu")

    b3_3 = mx.sym.BatchNorm(data=act3_3)

    pool3 = mx.sym.Pooling(data=bn3_3, pool_type="max",

    kernel=(3, 3), stride=(2, 2))

    doo3 = mx.sym.Dropout(data=pool3, p=0.25)

    ```'
