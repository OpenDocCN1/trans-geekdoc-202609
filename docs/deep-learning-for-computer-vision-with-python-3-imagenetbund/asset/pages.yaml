- pgno: 140
  md: '# 10.5 Summary


    # 10.5 Summary


    In this chapter, we learned how to train the SqueezeNet architecture from scratch
    on the ImageNet dataset. Furthermore, we were able to successfully reproduce the
    results of Iandola et al., successfully AlexNet-level accuracy – 57.01% rank-1
    and 79.45% rank-5 on the testing set, respectively. To achieve this result, we
    needed to reduce the rate to 1e–2 rate originally suggested by Iandola et al.,
    and use a smaller learning rate of 1e–2. This smaller learning rate helped reduce
    volatility in the model and ultimately obtain higher classification.


    Secondly, swapping ReLUs for ELUs allowed us to train the network for longer without
    stagnation. Ultimately, it was the activation function that allowed us to obtain
    the AlexNet-level results.


    As I''ve mentioned in previous chapters, always start with ReLU activation function
    to (1) ensure your model can be trained properly and (2) a baseline. Then, go
    and back other hyperparameters to the network, including learning rate scheduling,
    regularization/weight decay, weight initialization, and even normalization. Once
    you have optimized your network as far as you can think, consider swapping ReLUs
    for ELUs (normally) to obtain a small boost in classification accuracy. The only
    exception to this rule is if you are training a very deep CNN and require the
    use of MSRA/He initialization – in this case, as soon as you make the swap to
    MSRA initialization, you should also consider swapping out ReLUs for PReLUs.


    This chapter concludes our discussion on training state-of-the-art Convolutional
    Neural Networks on the challenging ImageNet dataset. Be sure to practice and experiment
    with these networks as much as you can. Explore various hyperparameters and the
    effects they have on training a given network architecture.


    Throughout this book, I have consolidated my ImageNet experiments so they can
    be easily read and digits. In some cases, I needed to run 20+-experiments (AlexNet
    being a prime example) before obtaining my best results. I then listed the three
    most important experiments to include in this book to demonstrate the right (and
    wrong) turns I made.


    The same will be true for you as well. Don''t be discouraged if your experiments
    aren''t immediately obtaining excellent results, even if you are identifying identical
    architectures and parameters as the original authors – this trial and error are
    part of the process.


    Deep learning experimentation is iterative. Develop a hypothesis. Run the experiment.
    Evaluate the results. And another experiment.


    Keep in mind that your deep learning experiments perform tens to hundreds of experiments
    per project – the same will be true for you as you develop to train deep neural
    networks on challenging datasets. This hinges right on the coup of “science” and
    “art” – and the only way to obtain this-needed skill is practice.


    In the remaining chapters in the ImageNet Bundle, we''ll look at a variety of
    case studies, including emotion/facial expression recognition, predicting and
    correcting image orientation, classifying the model and vehicle of and, and predicting
    the age and gender of a person in a video. These case studies will help you further
    improve your skills as a deep learning practitioner.'
