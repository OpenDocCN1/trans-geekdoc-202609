    drwxr-xr-x 2 adrian 53248 Sep 2014 n01514668

    drwxr-xr-x 2 adrian 61440 Sep 2014 n01514859

    ```


    At first, these directory names may appear unreadable. However, recall from Chapter
    4 on ImageNet that the dataset is organized by WordNet IDs [10] called simply
    "syn sets". A syn maps to a particular object, such as goldfish, bald eagle, airplane,
    or acoustic guitar. Therefore, in each of these strangely sub-directories, you
    will find approximately 732-1300 images per class.


    For example, the WordNet ID n01440764 consists of 1300 images of "tench", a type
    of freshwater fish, closely related to the minnow family (Figure 5:1).


    ```

    $ ls -l Data/CLS-LOC/train/n01440764/*.JPEG | wc -l

