    The DevKit is a small download of 7.4MB and should complete within a few seconds.
    Once you''ve downloaded the DevKit, archive it, and take the time to familiarize
    yourself with the directory structure including the license (COPYING) and the
    readme.txt. We''ll be reviewing the DevKit in our following chapter when we build
    the ImageNet dataset and prepare it for training a CNN.


    # 4.2.5 ImageNet Copyright Concerns


    At first glance it may appear that the ImageNet dataset and associated ILSVRC
    challenge is a minefield of copyright claims — who owns what in the ImageNet dataset?
    To answer your question, let''s break the problem into three concrete asset classes:


    +   * **Asset #1**: The ILSVRC dataset.

    * **Asset #2**: The pre-compiled ILSVRC dataset.

    * **Asset #3**: The output model weights trained by a network on ILSVRC.


    To start, the raw images themselves belong to the person/entity who captured the
    image — they own the full copyright over those images. The ImageNet project operates
    under the same restrictions as search engines like Google, Bing, etc. — they are
    allowed to provide links to the original, provided the copyright is retained.
    This provision is why the ImageNet website is allowed to provide the URLs of images
    in the dataset without requiring you to register and create an account - it is
    your responsibility to actually download them.


    This seems fairly clearly-cut; however, the waters start to move once we reach
    the actual ILSVRC challenge. Since the end user is no longer responsible for downloading
    each image one-by-one (and instead download an entire archive of the dataset),
    we run into concerns — how can you use a pre-compiled archive of (potentially)
    copyrighted images? Doesn''t that violate the copyright of the person who took
    the original photograph? This is a point of debate between the arts and sciences
    communities, but as it currently stands, we are allowed to'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 26 Chapter 4. What Is ImageNet?


    download the ILSVRC archives due to the Terms of Access we accept when participating
    in ILSVRC:


    +   1. You are free to use the ImageNet dataset for academic and non-commercial
    purposes.

    2. You cannot distribute the ILSVRC data as part of your end product.


    The original copyright question is not answered directly but is somewhat pacified
    by the restrictions placed on the pre-compiled dataset archives. Furthermore,
    the ImageNet website provides DMCA takedown options for copyright holders who
    wish to have their images removed from the dataset.


    Finally, let''s examine asset #3, a model-serialized weights obtained after training
    a Convolutional Neural Network on the ImageNet dataset – are these weights under
    copyright as well?


    The answer is a bit unclear, but as far as our understanding of the law goes,
    there is no restriction on the open use of learned model weights [14]. Therefore,
    we are free to distribute our trained models as we see fit, provided we keep in
    the spirit of fair use and protect attribution.


    The reason we are able to distribute our (and even copyright with our restrictions)
    is due to parameterized learning (Starter Bundle, Chapter 8) – our CNN does not
    store "internal copies" of the raw images (such as the K-NN algorithm). Since
    the model does not store the original images (whether in whole or part), the model
    itself is not bound to the same copyright as the ImageNet dataset. We can distribute
    our model weights freely or place additional copyrights on them (for example,
    the end user is free to use our architecture, but must re-train the network from
    scratch on the original dataset before using it in a commercial application).


    # But what about models trained on ImageNet that are used in commercial applications?


    Models trained on the ImageNet dataset and used in commercial applications violate
    the Terms of Access? According to the Terms of Access wording, technically these
    commercial applications are at risk of breaking the contract.


    On the other hand, there has been no lawsuit against a deep learning company/startup
    who have trained their networks from scratch using the ImageNet dataset. Keep
    in mind that a copyright has no power unless it’s enforced – no such enforcement
    has ever been done regarding Images.


    In short: this is a gray area in the deep learning community. There are a large
    number of deep learning startups that rely on CNNs trained on the ImageNet dataset
    (company names omitted on purpose) – their revenue is based on the performance
    of these networks. In fact, ImageNet and ILSVRC, these companies do not have the
    dataset required to create their product (unless they invested millions of dollars
    and many years collecting and annotating the dataset).


    # My anecdotal opinion


    It is my anecdotal opinion that there is an unspoken set of rules that govern
    the fair use of the ImageNet dataset. I believe these rules to be as follows (although
    there are sure many who disagree with me):


    +   * Rule #1: You need to obtain the ILSVRC dataset by some means and accept
    (either explicitly or implicitly) the Terms of Access.

    * Rule #2: After obtaining the data associated with the ILSVRC challenge, you
    need to train your own Convolutional Neural Network on the dataset. You are free
    to use existing network architectures such as AlexNet, VGGNet, ResNet, etc. provided
    that you train the network from scratch on the ILSVRC dataset. You do not need
    to develop a new network architecture.

    * Rule #3: Once you have obtained your model weights, you can distribute them
    under your own restrictions, including open access, usage with attribution, and
    even limited com'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 4.3 Summary


    mercial usage.

    Rule number three will be hotly contested, and I''m positive I''ll receive a number
    of emails about it – while the rules are unclear, there have been no lawsuits
    brought to court it but the point is – how network weights derived from ILSVRC
    can be used, including commercial applications.

    Again, keep in mind that a copyright is only valid if it is actually enforced
    – simply holding a copyright does not serve as a form of protection.


    Furthermore, the usage of deep learning models trained on ILSVRC is both a legal
    issue and an economic issue – the computer science industry is experiencing a
    tremendous boom in deep learning applications. If sweeping legislation were to
    be passing the commercial usage of CNNs trained from scratch on copyrighted data
    due to parameterized learning, we would be killing part of an economy experiencing
    high growth and valuations in the billions of dollars. This style of restrictive,
    sweeping legislation could easily catalyze another winter (Starter Bundle, Chapter
    2).


    For further information on “who owns what” in the deep learning community (datasets,
    model weights, etc.), take a look Deep Learning vs. Big Data: Who owns what?,
    an excellent article by Tomasz Lawiewicz on the subject [15].


    # 4.3 Summary


    In this chapter, we reviewed the ImageNet dataset and associated ILSVRC challenge,
    the de facto benchmark used to evaluate classification algorithms. We then examined
    multiple methods to obtain the ImageNet dataset.


    In the remaining chapters in this book I will assume that you do not have access
    to the testing set and associated ImageNet evaluation server; therefore, we will
    derive our own testing set from the training data. Doing so will ensure we evaluate
    our models locally and obtain a reasonable proxy to the accuracy of our network.


    Take the time now to start downloading the ImageNet dataset on your machine. I
    would recommend using the official ILSVRC challenge to download the ImageNet data
    as this is the easiest and most reliable. If you do not have access to a university,
    government, or research affiliated email address, free to ask your colleagues
    for access – but again keep in mind that you are still bound by the Terms of Access,
    regardless of how you obtain the data (even if you download via AcademicTorrent).


    It is may anecdotal that models weights trained on the ILSVRC dataset can be used
    as you best fit; however, keep in mind that this is still a point of contention.
    Before deploying a commercial application that leverages a model trained on ImageNet,
    I would encourage you to consult proper legal counsel.


    In our next chapter, we''ll explore the ImageNet dataset, understand its file
    structure, and write Python helper utilities to facilitate our ability to load
    the images from disk and prepare them for training.'
