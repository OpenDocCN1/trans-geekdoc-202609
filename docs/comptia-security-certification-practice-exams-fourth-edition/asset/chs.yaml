  \ `PKI` 证书保护 浏览器等 HTTP 客户端与安全网站之间传输中的网络流量。\n\n### 35\n![Images](img/com.jpg)\n**D.**\
  \ 图 A-2 显示了网页强制门户，它在允许访问互联网之前，需要用户确认，有时还需要登录和支付。\n\n![Images](img/com-1.jpg)\n**A,\
  \ B,** 和 **C** 是错误的。`IPSec` 为网络传输提供数据机密性和完整性。`HTTPS` 使用 `PKI` 证书保护 浏览器等 HTTP 客户端与安全网站之间传输中的网络流量。身份联邦使用单一的中央身份提供程序来验证用户和设备，之后根据分配的权限允许访问文件服务器或网站等资源。身份联邦的好处之一是每个资源都不需要自己的认证机制。\n\
