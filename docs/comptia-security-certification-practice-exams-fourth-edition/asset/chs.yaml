  \ Web 服务器通信。\n\n### 23\n![Images](img/com.jpg) **D.** 网络访问控制（NAC）解决方案通过确保连接的用户和设备在获得网络访问之前满足各种条件来控制设备网络访问，例如使用的特定身份验证方法、设备类型、最新的软件补丁等。某些\
  \ NAC 解决方案要求在连接设备上安装代理（agent），而另一些则是无代理的。\n\n![Images](img/com-1.jpg) `A`、`B` 和\
  \ `C` 是错误的。分布式拒绝服务（DDoS）攻击源于恶意用户对受感染计算机（称为僵尸或机器人）的控制；机器人接收指令以执行操作，例如向受害者机器发送大量无用网络流量，试图阻止合法连接到该机器。防火墙访问控制列表（ACL）是规则集合，包含传输细节条件，如源\
  \ IP 地址、目的 IP 地址、端口号或应允许或阻止的协议类型。数据泄露防护（DLP）用于监控和防止敏感数据被外泄，或暴露在组织外部或给未经授权的用户，无论是有意还是无意的。\n\
  \n### 24\n![Images](img/com.jpg) **B.** 带外管理（Out-of-band management）是指使用替代连接（而非标准网络介质）管理网络设备和主机。由于网络隔离，这提供了一层安全和可靠性。\n\
  \n![Images](img/com-1.jpg) `A`、`C` 和 `D` 是错误的。数据泄露防护用于监控和防止敏感数据被外泄，或暴露在组织外部或给未经授权的用户，无论是有意还是无意的。桥接环路可能由于多个路径的网络交换机连接在一起引起，这可以通过确保在网络交换机上启用生成树协议（STP）来缓解。通过确保使用开放最短路径优先（OSPFv3）等路由协议交换的路由信息经过验证和加密来实现路由安全。\n\
  \n### 25\n![Images](img/com.jpg) **C.** 通过启用加密实现数据机密性。\n\n![Images](img/com-1.jpg)\
  \ `A`、`B` 和 `D` 是错误的。版本控制用于在文件修改时随时间保留文件的多个版本。服务器访问日志跟踪与请求云存储内容的所有活动。对象级日志跟踪特定项目的云存储请求。\n\
  \n### 26\n![Images](img/com.jpg) **C.** 安全哈希算法（SHA-256）是一种单向加密哈希算法，可产生一个代表原始数据的唯一值。这用于在\
  \ `/etc/shadow` 文件中存储标准 Unix 和 Linux 密码，并跟踪文件或网络传输的变化。\n\n三重数据标准（3DES）提供 168 位加密，并已被高级加密标准（AES）取代成为美国政府加密标准。里斯特-沙米尔-阿曼（RSA）是一种使用公钥和私钥对的加密系统；数据加密使用公钥进行，解密则使用数学相关的私钥进行。\n\
  \n\n\n\n\n# 27\n\n![Images](img/com.jpg) **D.** 当同一交换机上的端口相互连接时，可能会发生桥接环路（也称为交换环路）。如果在交换机上启用了生成树协议（STP），就可以防止这种情况发生。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。通过动态主机配置协议（DHCP），客户端与 DHCP 服务器之间会进行通信，使客户端从\
  \ DHCP 主机接收其 IP 配置。初始的 DHCP 通信以网络广播的形式进行，因此，如果有足够的 DHCP 客户端同时广播，网络可能会出现一段时间的拥塞。DNS\
  \ 陷洞技术（DNS sinkholing）是一种刻意的配置，它对针对特定主机或域的 DNS 客户端查询返回无效结果；这对于防止受感染的僵尸计算机与攻击者的命令与控制（C&C）服务器通信非常有用。\n\
  \n## 28\n\n![Images](img/com.jpg) **A.** Web 应用防火墙（WAFs）保护 Web 应用免受已知的 Web 应用特定攻击，例如数据库注入攻击。\n\
  \n![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。正向代理服务器接收内部客户端对互联网内容的请求，获取内容，可能对其进行后续请求的缓存，并将该内容返回给请求的内部客户端。反向代理服务器接受客户端请求并将其转发到相应的后端服务器，这些服务器通常位于私有的安全网络上。负载均衡器将传入的客户端请求分发到后端服务器，以提高应用程序的性能和可用性。分布式拒绝服务（DDoS）攻击源于恶意用户对受感染计算机（称为僵尸或机器人）的控制；机器人接收到执行操作的指令，例如通过向受害者机器注入大量无用网络流量，试图阻止对机器的合法连接。缓解\
  \ DDoS 攻击的一种方法是拦截异常过的网络流量。\n\n## 29\n\n![Images](img/com.jpg) **D.** 网络交换机内部可以使用端口镜像（port\
  \ spanning）或镜像来配置网络流量捕获，这将所有交换机端口的网络流量复制到指定的监控端口。接入监控端口的技术人员随后可以使用 `Wireshark` 等网络捕获软件来分析所有交换机网络流量。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。DHCP 监听（DHCP snooping）保护网络免受网络中可能存在的非法\
  \ DHCP 服务器可能向 DHCP 客户端提供错误的 IP 配置。在路由器或交换机中，连接到已知合法 DHCP 服务器的端口被标识为信任端口。任何不是源自信任端口的\
  \ DHCP 服务器消息都会被拦截。MAC 过滤可以根据分配给网络接口的唯一 48 位十六进制地址允许或阻止连接。桥协议数据单元（BPDU）保护是一种网络交换机功能，可以启用它以防止\
  \ BPDU 流量通过连接到用户工作站、服务器、网络打印机等终端设备的交换机端口传输。只有网络交换机传输 BPDU 流量。\n\n## 30\n\n![Images](img/com.jpg)\
