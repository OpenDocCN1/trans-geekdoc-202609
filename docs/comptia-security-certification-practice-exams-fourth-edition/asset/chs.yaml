  \ 60 天更改一次。你必须确保用户密码在 60 天的间隔内不能更改超过一次。你应该配置什么？\n\nA. 最小密码年龄\nB. 最大密码年龄\nC. 密码复杂度\n\
  D. 密码历史\n\n### 14. 你的公司决定采用公共云设备管理解决方案，所有设备都通过托管在数据中心服务器上的网站进行集中管理。管理层指示你确保该解决方案是可靠且始终可用的。你应该关注哪种文档？\n\
  \nA. 密码策略\nB. 服务水平协议\nC. 远程访问可接受使用策略\nD. 移动设备可接受使用策略\n\n### 15. 以下哪些选项最能描述 PII 的正确使用方法？（选择两个。）\n\
  \nA. 执法部门使用公 IP 地址跟踪互联网违规者\nB. 将电子邮件联系列表分发给营销公司\nC. 使用指纹扫描仪登录安全的笔记本电脑\nD. 实施尽职调查\
  \ (Due diligence)\n\n### 16. 你的公司限制防火墙管理员修改防火墙规则，除非他们与 IT 安全团队成员一起进行修改。这是什么的示例？\n\
  \nA. 尽责 (Due care)\nB. 职责分离 (Separation of duties)\nC. 最小权限原则\nD. 可接受使用 (Acceptable\
  \ use)\n\n### 17. 你是一家律师事务所的网络管理员。位于温哥华的用户必须能够查看专利提交的贸易机密。你共享了一个名为 `Trade Secrets`（贸易秘密）的网络文件夹，并允许以下\
  \ NTFS 权限：\n\n* `Vancouver_Staff`: 读取、列出文件夹内容\n* `Executives`: 写入\n* `IT_Admins`:\
  \ 完全控制\n\n关于温哥华员工，遵循了哪种原则？\n\nA. 岗位轮换\nB. 最小权限\nC. 强制休假\nD. 职责分离\n\n### 18. 应付账款部门注意到使用公司信用卡进行了大额跨国购买。在与信用卡持有人\
  \ Juan 讨论此事后（Juan 的名字在卡片上，翻译了原语逻辑），他们意识到有人非法获取了信用卡信息。你还了解到 Juan 最近收到一封似乎来自信用卡发公司的电子邮件，要求他登录其网站验证其账户，他确实这样做了。这如何可以避免？\n\
  \nA. 为信用卡持有人提供智能卡。\nB. 告诉用户增加在线密码的强度。\nC. 安装工作站防火墙。\nD. 为员工提供安全意识培训。\n\n### 19.\
  \ 以下哪些陈述是正确的？（选择两个。）\n\nA. 安全标签用于数据分类，例如受限和机密。\nB. PII 仅适用于生物识别认证设备。\nC. 强制用户更改密码被视为变更管理。\n\
  D. 人的签名被视为 PII。\n\n### 20. 实施强制休假的主要目的是什么？\n\nA. 为了遵守政府\nB. 为了确保员工\nC. 使其他角色能够胜任\n\
  D. 防止活动\n\n### 21. 以下哪项是 PHI（受健康信息）的示例？\n\nA. 教育记录\nB. 雇用记录\nC. 指纹\nD. 信用历史\n\n\
  ### 22. 作为 IT 官员，你建立了安全策略，要求保护所有文档，以免敏感客户、供应商或公司数据被盗。这是哪种策略？\n\nA. 隐私\nB. 可接受使用\n\
  C. 洁桌面\nD. 密码\n\n### 23. 以下哪项说明了与社交媒体相关的安全问题？\n\nA. 其他用户可以看到你的 IP 地址。\nB. 话多的员工可以暴露公司的知识产权。\n\
  C. 恶意用户可以使用你的图片进行隐写。\nD. 你的信用卡号很容易。\n\n### 24. 人事主管 Margaret 与离开的技术员 Irving 进行离职面谈。谈话涵盖了他对组织的看法，以及改进建议。以下哪些问题应该也在离职面谈中处理？（选择两个。）\n\
  \nA. 背景检查\nB. 岗位轮换\nC. 保密协议\nD. 财产归还表\n\n### 25. 你是一家医疗机构的文件服务器管理员。管理层要求你恰当地配置服务器，对包含独特制造工艺的文件进行分类。这类文件的合适数据分类是什么？\n\
  \nA. 专有 (Proprietary)\nB. PII\nC. PHI\nD. 公共\n\n### 26. 你的组织必须遵守云安全 ISO 标准。应该遵守哪个\
  \ ISO 标准？\n\nA. ISO 27001\nB. ISO 27017\nC. ISO 27002\nD. ISO 27701\n\n### 27. 以下哪些安全标准专注于评估和管理风险？\n\
  \nA. CIS\nB. SOC 2\nC. NIST CSF\nD. NIST RMF\n\n### 28. 你的组织托管一个面向 Web 的应用程序，其架构如图\
