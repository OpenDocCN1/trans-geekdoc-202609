  \ Linux Shell 脚本、Python 脚本或 Windows 批处理文件。\n\n# 第 21 章 事件响应与计算机取证\n\n## 目标\n- 21.01\
  \ 处理证据\n- 21.02 收集数字证据\n- 21.03 了解事件响应\n\n## 问题\n\n我们每天使用的所有电子设备，从汽车、手机手机到笔记本电脑和个人电脑，都会留下数字足迹。计算机取证是指对这些数字数据进行记录、获取和保护，以作为证据使用。确保采取适当步骤来响应事件并合法地进行数据获取对你来说是至关重要的。事件准备活动（如定期演练、事件模拟和桌面演练）可以确保团队成员熟悉必须采取的恰当响应措施。\n\
  \n**1.** 事件的第一响应人员必须确定什么？\nA. 事件的严重程度\nB. 必须叫哪些其他人员\nC. 与事件相关的金额\nD. 谁有错\n\n**2.**\
  \ 在收缴涉嫌参与犯罪的计算机设备后，将其放置在走廊无人看看十分钟，期间警察制服嫌疑人。被缴的设备不再作为何种违规的证据？\nA. 易失性顺序\nB. 损害控制\n\
  C. 证据留存\nD. 时间偏移\n\n**3.** 已签发搜查令调查一台被认为被组织犯罪用于交换信用卡信息的服务器。根据易失性顺序，你应该先收集哪种数据？\n\
  A. 电子内存 (RAM)\nB. 硬盘\nC. USB 闪盘\nD. CMOS\n\n**4.** 在捕获网络流量时，你注意到异常大量的 SMTP 包。为了判断这是否需要升级或报告，你还应该查看什么？\n\
  A. 收件箱内容\nB. 服务器日志\nC. 服务器文档\nD. Web 服务器日志\n\n**5.** 你决定在周六晚上更换服务器房的布线。到达时，你发现发生了闯入，服务器备份带似乎丢失了。执法人员到达时你应该做什么？\n\
  A. 清理服务器房。\nB. 在笔记本上画出现场图。\nC. 通知执法人员监控视频。\nD. 检查周围区域。\n\n**6.** 下列哪项最能形象展示被执法人员提取时的计算机状态？\n\
  A. 主板数字照片\nB. 屏幕数字照片\nC. Visio 网络拓扑\nD. 信息隐术\n\n**7.** 收集数字证据时，正确的易失性顺序是：\nA. 硬盘、DVD-R、RAM、交换文件\n\
  B. 交换文件、RAM、DVD-R、硬盘\nC. RAM、DVD-R、交换文件、硬盘\nD. RAM、交换文件、硬盘、DVD-R\n\n**8.** 取证分析师可以做什么来减少必须分析硬盘的文件数量？\n\
  A. 编写一个删除 30 天前文件的 Visual Basic 脚本。\nB. 删除认为是操作系统的文件。\nC. 确保原始磁盘完好无损并在副本上使用哈希表。\n\
  D. 修改原始磁盘上的元数据以标记文件。\n\n**9.** 在证据收集现场的专业人员可以被传唤出庭，或就其发现准备报告。此人被称为？\nA. 原告\nB. 被告\n\
  C. 审计师\nD. 取证专家证人\n\n**10.** 下列哪项最符合证据留存（chain of custody）？\nA. 将证据收集委托给上级\nB. 保护、保存和记录证据\n\
  C. 将系统镜像捕到另一个硬盘\nD. 在硬盘之前捕获内存内容\n\n**11.** 在处理内幕交易案件时，你被要求证明封邮件是真实的并发送给了另一位员工。你应该考虑哪些？（选择两项）\n\
  A. 邮件是否经过了加密？\nB. 邮件是否经过了数字签名？\nC. 用户公钥是否得到了良好保护？\nD. 用户私钥是否得到了良好保护？\n\n**12.**\
  \ 哪种类型的证据最难以被犯罪者伪造？\nA. IP 地址\nB. MAC 地址\nC. 手机 SIM 卡\nD. USB 闪盘上的文档\n\n\n\n\n\n\
  ### 13. 磁盘取证软件的目的是什么？（选题）\n\nA. 使用文件加密来确保复制的数据与原始数据一致\nB. 使用文件哈希值（hashes）确保复制的数据与原始数据一致\n\
  C. 保护原始磁盘上的数据\nD. 在原始磁盘上创建文件哈希值\n\n### 14. 你正准备从手机中收集证据。以下哪项是错误的？\n\nA. CDMA 设备不使用\
  \ SIM 卡。\nB. CDMA 手机将用户数据直接存储在移动设备上。\nC. GSM 设备不使用 SIM 卡。\nD. GSM 设备使用 SIM 卡。\n\n\
  ### 15. 你必须分析数字相机内部内存中的数据。你计划使用 `USB` 线将你的取证计算机连接到相机。你应该怎么做以确保不修改相机上的数据？\n\nA. 确保相机处于关闭状态。\n\
  B. 将相机上的所有文件标记为只读。\nC. 在取证计算机上使用非管理员账户登录。\nD. 使用 `USB` 写保护设备。\n\n### 16. 使用什么可以确保被没收的移动无线设备不与其他设备通信？\n\
  \nA. SIM 卡\nB. 法拉第袋（Faraday bag）\nC. 防静袋\nD. GPS 干扰器\n\n### 17. Robin 在一家经纪公司担任网络技术员。为了测试网络取证软件，她将笔记本电脑连接到\
  \ `Ethernet` 交换机并开始采集网络流量。在随后的分析中，她注意到一些广播包、组播包以及她自己计算机的网络流量。为什么她无法采集交换机上的所有网络流量？\n\
  \nA. 她必须在她的 `NIC` 上启用混杂模式。\nB. 她必须禁用她的 `NIC` 混杂模式。\nC. 每个交换机端口都是一个隔离的冲突域。\nD. 每个交换机端口都是一个隔离的广播域。\n\
  \n### 18. 网络入侵检测设备在犯罪期间记录了网络流量。你在捕获文件中注意到来自所有网络主机的 `NTP` 和 `TCP` 包。你必须找到一种方法将捕获的数据包与日期时间相关起来，以确保数据捕获可以作为证据被接受。你应该怎么做？（选题）\n\
  \nA. 什么都不用。`NTP` 保持网络时间的同步。\nB. 什么都不用。数据包捕获带有时间戳。\nC. 没有数字签名，日期和时间无法通过验证。\nD. 没有加密，日期和时间无法通过验证。\n\
  \n### 19. 你到达了一个必须没收计算机作为证据的现场。计算机处于关闭状态，并插着一个外部 `USB` 硬盘。你首先应该做什么？\n\nA. 开启计算机。\n\
  B. 拔掉外部 `USB` 硬盘。\nC. 详细记录设备的状态。\nD. 将计算机放在法拉第袋中。\n\n### 20. 你被要求检查硬盘，以寻找即时消息对话的碎片以及已删除的文件。你应该如何做？\n\
  \nA. 使用位流复制工具。\nB. 登录计算机并将原始硬盘的内容复制到外部 `USB` 硬盘中。\nC. 跨网络映射原始硬盘的驱动器，并将内容复制到外部 `USB`\
  \ 硬盘中。\nD. 查看日志文件。\n\n### 21. 取证分析师如何通过分析元数据获益？（选题）\n\nA. `JPEG` 元数据可以显示特定的相机设置。\n\
  B. `Microsoft Word` 元数据可以显示作者姓名。\nC. `Microsoft Excel` 元数据可以显示你的 `MAC` 地址。\nD. `PDF`\
  \ 元数据可以显示注册公司名称。\n\n### 22. 执行取证分析时必须遵循以下哪些规则？（选题）\n\nA. 仅使用原始、真实的数据进行工作。\nB. 仅使用数据的副本进行工作。\n\
  C. 寻求法律许可进行分析。\nD. 寻求你经理的许可进行分析。\n\n### 23. IT 总监正在制定明年的预算。你被要求为你的云安全事件响应团队（CSIRT）提交取证费用。你不*应该*提交哪一项？\n\
  \nA. 差旅费\nB. 人工费\nC. 培训费用\nD. `ALE` 金额\n\n### 24. 上午 9:30，用户报告自从 8 点工作开始以来，网络性能严重下降。在对网络进行分析并与\
  \ IT 安全团队进行简短讨论后，你得出蠕病毒感染了你的网络。你应该怎么做来控制损害？（选题）\n\nA. 确定安全泄露的严重性。\nB. 拔掉 `SAN` 设备。\n\
  C. 关闭服务器。\nD. 关闭 `Ethernet` 交换机。\n\n### 25. 嫌疑人删除了文件并清除了回收站。关于删除，以下哪些说法是正确的？（选题）\n\
  \nA. 文件无法恢复。\nB. 文件可以恢复。\nC. 已删除的文件包含其所有原始数据，直到硬盘被其他数据填满。\nD. 已删除的文件包含其所有原始数据，直到硬盘进行碎片整理。\n\
  \n### 26. 使用图 21-1，将左侧的事件响应定义与右侧的术语匹配。\n\n![FIGURE 21-1](img/fig21-1.jpg)\n\n###\
  \ 27. 哪种内置 Linux 系统工具可以用于创建取证分析的磁盘副本？\n\nA. `memdump`\nB. `dd`\nC. `WinHex`\nD.\
  \ `Autopsy`\n\n### 28. 你正在审查现有的网络安全控制，并需要熟悉恶意用户横向移动攻击。你应该咨询什么？\n\nA. `Diamond model`（钻石模型）\n\
  B. `Cyber kill chain`（网络杀伤链）\nC. `Mitre Attck`\nD. `OP`\n\n### 29. 以下哪项内容可以强制故障服务器的\
  \ `RTO`（恢复目标时间）？\n\nA. 灾难恢复计划\nB. 通信计划\nC. 相关者管理\nD. `OP`\n\n### 30. 你需要查看日志文件以确定是否发生了针对主机和\
  \ IP 地址的网络侦察。你最可能在哪里找到这些信息？\n\nA. `rsyslog` 配置\nB. `VoIP` 流量日志\nC. 目录服务器认证日志\nD.\
  \ `DNS 服务器日志`\n\n### 31. 哪条 Linux 命令专门用于查看 systemd 日志？\n\nA. `NXLog`\nB. `IPFIX`\n\
  C. `journalctl`\nD. `echo`\n\n### 32. 哪个 `SOAR` 组件用于自动化 IT 相关的事件响应？\n\nA. `Playbook`（剧本）\n\
  B. `Legal hold`（法律保留）\nC. `E-discovery`（电子取证）\nD. `Runbook`（运行手册）\n\n## 快速答案\n\n\
  13: A\n14: C\n15: D\n16: B\n17: C\n18: A, B\n19: C\n20: A\n21: A, B, D\n22: B, C\n\
  23: D\n24: A, D\n25: B, C\n\n\n\n\n\n26. 参阅“深度解析”。\n\n27. B\n28. C\n29. A\n30. D\n\
  31. C\n32. D\n\n## 深度解析\n\n1. ![Images](img/com.jpg) **A.** 第一响应人员对情况严重程度的快速评估，将根据事件响应策略决定需要联系谁或下一步应该做什么。\n\
  \n![Images](img/com-1.jpg) **B, C,** 和 **D** 都是错误的。在确定严重性之前，第一响应人员不知道该联系谁。计算经济损失不是首要任务；可以在局势得到控制后进行。指责他人也不属于首要响应措施，而且对事件调查没有帮助。\n\
  \n2. ![Images](img/com.jpg) **C.** 违反了监管链（Chain of custody）。监管链涉及彻底且合法地记录所收集的证据，同时确保证据不会被篡改。如果由于设备无人看管而没有维护监管链，可能会导致证据被法院判定为不可采用。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **D** 都是错误的。易失性（Order of volatility）决定了哪些类型的数据容易丢失——例如，电子内存（RAM）中的数据与存储在\
