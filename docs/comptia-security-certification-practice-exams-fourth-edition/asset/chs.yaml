  \ Web 门户。自动伸缩（Autoscaling）在云计算中很常见，它允许应用程序在需求增加时配置更多底层虚拟机（向外扩展），并在需求减少时移除虚拟机（向内收）。\n\
  \n### 19\n![Images](img/com.jpg)\nA. Open Web 安全项目（OWASP）是一个中中立的非营利组织，其重点是提供安全 Web\
  \ 应用程序的指南和免费工具。工具包括 Web 漏洞扫描器和模糊测试器，以及通过 OWASP 企业安全 API（ESAPI）支持的安全编程库。\n\n![Images](img/com.jpg)\n\
