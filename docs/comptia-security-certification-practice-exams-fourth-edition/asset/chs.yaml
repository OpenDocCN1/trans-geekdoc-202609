  \ 都与信息安全相关，但它们侧重于云计算安全。\n\n## [27]\n![Images](img/com.jpg) **D.** 美国标准与技术研究院（`NIST`）风险管理框架（`RMF`）提供了关于如何评估、构建、监控和响应的指南，包括如何应用安全控制来缓解风险。云安全联盟（`CSA`）参考架构也可用于评估风险，云控制矩阵（CCM）可用于组织风险缓解。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。互联网安全中心（`CIS`）是一个提供 IT 系统和数据安全的非营利实体。`SOC\
  \ 2` 是衡量服务提供商（如公有云提供商）提供的数据可用性和机密保护的标准。`NIST` 网络安全框架（`CSF`）由用于加强 IT 系统及相关数据的安全最佳实践和建议组成。\n\
  \n## [28]\n![Images](img/com.jpg) **A** 和 **C.** 跳板解决方案是一个具有两个网络接口的主机（物理或虚拟）：一个允许来自互联网的连接，另一个允许连接到内部私有网络。为了从互联网远程管理内部主机，连接首先到达跳板机，然后从那里对内部主机进行远程管理。另一种选择是使用虚拟专用网络（`VPN`）在两个端点之间建立安全隧道，例如\
  \ IT 技术员站和托管面向 Web Web 应用的网络设备。`VPN` 客户端从已知池分配 `IP` 地址，这使其能够访问内部主机（如 `DB1`）的私有 `IP`\
  \ 地址。\n\n![Images](img/com-1.jpg) **B** 和 **D** 是错误的。将网站数据库直接暴露在互联网上带来了不可接受的安全风险。虽然对\
  \ `DB1` 上的静态数据进行加密是一个好主意，但与该主机的安全远程管理无关。\n\n## [29]\n![Images](img/com.jpg) **A**\
  \ 和 **C.** 安全套层（`SSL`）是一种使用安全证书的网络安全协议。由于许多已知漏洞，`SSL` 自 2015 年起已被弃用，不应在客户端或服务器上使用。传输层安全（`TLS`）版本\
  \ `1.2` 或更高版本取代了 `SSL`，并提供了未被弃用的网络安全。就像不应在客户端和服务器上禁用 `SSL` 一样，`TLS` 必须在客户端和服务器上启用。部署一个跳板机以通过跳板机启用间接的\
