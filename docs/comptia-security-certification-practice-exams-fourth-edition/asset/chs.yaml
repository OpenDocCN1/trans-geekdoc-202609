  \n`A`、`B` 和 `C` 是错误的。始终开启的 VPN（Always On VPN）配置不需要用户手动调用 VPN 隧道；相反，它会在设备开启并连接到互联网或在用户设备上启动特定应用程序时发生。Wi-Fi\
  \ 网络可以使用 `PSK`，连接的两端必须知道该 `PSK` 才能确保网络传输的安全，但 `PSKs` 被 `WPA2` 使用。`WPA3` 使用 `SAE`\
  \ 密钥，必须在无线连接双方进行配置以启用 Wi-Fi 安全。Wi-Fi 网络可以使用 `RADIUS` 服务器进行集中身份验证，但 `RADIUS` 并不决定客户端到\
  \ WAP 的连接性。\n\n### 17\n![Images](img/com.jpg) `C.` Wi-Fi 保护访问（WPA），其当前版本为 3，取代了\
  \ `WEP` 和 `WPA2` 以提供 Wi-Fi 网络安全。\n\n![Images](img/com-1.jpg) `A`、`B` 和 `D` 是错误的。`IPSec`\
  \ 是一种网络安全协议，可以在不需要专门配置单个应用程序的情况下保护网络流量，与 `SSL/TLS` 不同。`IPSec` 也可以用于保护客户端到站点或站点点的\
  \ VPN。安全套接层（`SSL`）是一种使用 `PKI` 证书的网络安全协议，已被传输层安全（`TLS`）取代。\n\n### 18\n![Images](img/com.jpg)\
