  \ HTTPS 连接。SSL 已废弃，不应使用；请使用传输层安全协议（TLS）。\n\n![Images](img/com-1.jpg)\nA、B 和 C 是错误的。阶段环境（Staging）用于软件开发测试，提供一个测试或阶段区域，用于托管和测试应用程序而不影响其生产环境版本。规范化（Normalization）是一种数据组织过程，通过组织数据来减少重复数据的出现，如客户邮寄地址、电子邮件、电话号码等。将客户数据统一存储在客户表中，并在关联的交易表中仅写入唯一的客户代码，就是规范化的示例。\n\
