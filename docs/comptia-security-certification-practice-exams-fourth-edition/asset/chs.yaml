  \ `/etc/shadow` 等文件的密码变化。\n\n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。加密对于保护数据非常重要，但不适用于此场景。数据泄露防护用于监控并防止数据外泄。在计算机网络中，服务质量（QoS）管理网络流量以确保\
  \ VoIP 调用等时间敏感用途的可靠性。\n\n# 第 9 章：无线网络与安全\n\n## 认证目标\n\n9.01 无线通信技术\n- 9.02 无线安全协议\n\
  - 9.03 验证协议\n\n## 问题\n\n现代商业世界以各种形式使用无线技术，从门禁卡、嵌入式芯片到私有 Wi-Fi 热点和库存追踪。无线安全需要对各种技术的了解。\n\
  \n短距离无线技术包括蓝牙，它通常用于驾驶时的免提通话或连接无线扬声器听音乐。近场通信（NFC）常用于游乐园的无线票务和零售领域的触碰支付。Wi-Fi 在许多家庭和企业中常见，它能够实现无需网络布线烦恼的便捷访问。\n\
  \n网络安全的第一道线是控制网络访问，例如通过网络接入设备认证。边缘设备如无线接入点（WAP）或网络交换机可以配置将认证请求转发到中央认证服务器。妥善放置、配置和使用网络安全协议可以有效防止破解。\n\
  \n**1** 你发现了一个由用户插在办公室网口的未授权无线路由器。哪种术语最能描述这种场景？\n\nA. 恶性孪生\nB. 非法接入点\nC. 干扰\nD.\
  \ 蓝牙劫持\n\n**2** 在查看了设备安全日志后，你了解到机场航站休息区的一个恶意用户通过无线连接到了某旅行员工的手机并下载了她的联系列表。发生了哪种类型的攻击？\n\
  \nA. 蓝牙劫持\nB. 蓝牙窃取\nC. 取离攻击\nD. 社会工程\n\n\n\n\n\n### 3. 以下哪项代表加密等效隐私 (WEP) 协议的缺陷？\n\
  \nA. 128 位初始化向量\nB. 无法加密与 `HTTPS` 连接\nC. 无法加密 `IPSec` 连接\nD. 24 位初始化向量\n\n### 4.\
  \ 你需要实现一种网络安全解决方案，仅在用户通过身份验证和设备状态检查后才授予网络访问。你应该部署什么？\n\nA. PSK\nB. WPS\nC. EAP\n\
  D. `IEEE 802.1x`\n\n### 5. 你的任务是配置组织中的 WAP，使身份验证在私有网络的安全服务器上进行，而不是直接在 WAP 上进行。你应该实现什么种类型的服务器？\n\
  \nA. 正向代理服务器\nB. 反向代理服务器\nC. RADIUS 服务器\nD. VPN 集中器\n\n### 6. 哪种认证协议要求客户端和服务器都配置\
  \ PKI 证书？\n\nA. EAP-FAST\nB. `IEEE 802.1x`\nC. EAP-TTLS\nD. EAP-TLS\n\n### 7. 哪种认证协议仅要求服务器配置\
  \ PKI 证书？（选择二）\n\nA. EAP-TTLS\nB. EAP-TLS\nC. EAP-FAST\nD. PEAP\n\n### 8. 哪种认证协议不需要使用\
  \ PKI 证书？\n\nA. EAP-FAST\nB. PEAP\nC. EAP-TTLS\nD. EAP-TLS\n\n### 9. 在网络安全审计期间，在公司网络上发现了开放的\
  \ WAP。可以启用哪种安全协议为 WAP 的使用增加额外的安全层？（选择二）\n\nA. WPA2\nB. NFC\nC. IV\nD. WPA3\n\n###\
  \ 10. 连接到酒店 Wi-Fi 网络时，员工会看到一个网页，要求在提供 Internet 之前之前进一步身份验证。正在使用的是哪种认证方法？\n\nA. Wi-Fi\
  \ 安全设置\nB. 强制性门户 (Captive portal)\nC. PSK\nD. 开放\n\n### 11. 你的一位远程用户开始在家里工作。该用户住在一个一室一型公寓里。在家里安装无线路由器后，该用户抱怨无线网络间歇性中断。这个问题最可能的原因是什么？\n\
  \nA. 无线路由器的放置\nB. 故障的无线路由器\nC. 手机基站干扰\nD. Wi-Fi 信道重叠\n\n### 12. 使用哪种标准端口与 RADIUS\
  \ 服务器进行验证？\n\nA. `UDP 161`\nB. `UDP 1812`\nC. `TCP 80`\nD. `TCP 443`\n\n### 13.\
  \ 你正在配置无线路由器的 WPA2 企业设置。必须指定哪些项目？（选择二）\n\nA. PSK\nB. 无线信道\nC. 共享密钥\nD. RADIUS 服务器\
  \ IP 地址\n\n### 14. 你正在无线路由器上配置 MAC 过滤规则。哪种 Windows 命令将显示站无线接口的 MAC 地址？\n\nA. `ipconfig\
  \ /all`\nB. `ipconfig`\nC. `ipconfig /mac`\nD. `ipconfig /flushdns`\n\n### 15. 参考图\
  \ 9-1。无线路由器的日志必须通过电子邮件发送到你的收件箱。你需要确保网络允许无线路由器与内部邮件服务器之间的连接。防火墙必须允许哪个端口？\n\nA. `UDP\
  \ 25`\nB. `UDP 161`\nC. `TCP 80`\nD. `TCP 25`\n\n### 16. 你需要将一个带有二维码的 IoT 设备连接到无线网络。该无线网络使用\
