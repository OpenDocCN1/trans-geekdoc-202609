  ## 深度解析\n\n**1.**\n![Images](img/com.jpg)\nC. 高级持续威胁 (APT) 意味着网络或设备已被入侵，恶意攻击者（如竞争对手或黑客团体）在被发现之前会保持对受损系统的控制权。\n\
  \n**2.**\n![Images](img/com.jpg)\nA. 黑客主义 (Hacktivists) 利用漏洞是为了提高对社会、政治或意识形态观点的关注。\n\
  \n**3.**\n![Images](img/com.jpg)\nD. 内部威胁源于组织内部人员，他们了解外部用户未知的内部程序、配置或细节。内部用户培训和意识有助于保护数字资产免受无意的安全泄露。\n\
  \n**4.**\n![Images](img/com.jpg)\nB. 犯罪集团与有组织犯罪有关，他们可能通过非法手段获利，因此必须通过洗钱来处理收益。\n\n\
  \n\n\n\n![Images](img/com-1.jpg)\nA、C 和 D 是错误的。国家级攻击者是由国家支持的黑客团体，目的是收集情报或破坏其他国家的计算机系统。黑客行动者（Hacktivists）利用漏洞系统，旨在提高对社会、政治或意识形态观点的关注。脚本小子（Script\
  \ kiddies）的技术水平有限，他们不创建自己的漏洞工具，而是使用他人创建的漏洞工具。\n\n### 5\n![Images](img/com.jpg)\n\
  D. 授权的黑客是“好人”；他们受雇执行渗透测试，以识别可利用的安全漏洞。\n\n![Images](img/com-1.jpg)\nA、B 和 C 是错误的。未授权的黑客窃取敏感数据或入侵系统，通常受利润、报仇或其他邪恶动机的驱动。半授权黑客介于授权和未授权黑客之间；他们没有恶意意图，但可能会越法律或伦理边界，例如入侵机场的计算机系统，然后通知官员他们的系统存在漏洞。脚本小子的技术水平有限，他们不创建自己的漏洞工具，而是使用他人创建的漏洞工具。\n\
  \n### 6\n![Images](img/com.jpg)\nD. “影子 IT”（shadow IT）是指非 IT 员工在没有 IT 部门中央批准的情况下安装或配置网络设备；这包括在未经批准的情况下向网络添加\
  \ Wi-Fi 路由器。\n\n![Images](img/com-1.jpg)\nA、B 和 C 是错误的。授权的黑客是“好人”；他们受雇执行渗透测试，以识别可利用的安全漏洞。黑客行动者利用漏洞系统，旨在提高对社会、政治或意识形态观点的关注。加固（Hardening）是通过应用更新、移除不必要功能、更改默认设置等手段确保网络或设备安全的过程。\n\
  \n### 7\n![Images](img/com.jpg)\nC. 国家级攻击者可能有充足的资金进行活动。这些黑客团体由国家支持，目的是收集情报或破坏其他国家的计算机系统。\n\
  \n![Images](img/com-1.jpg)\nA、B 和 D 是错误的。黑客行动者利用漏洞系统，旨在提高对社会、政治或意识形态观点的关注。犯罪集团与有组织犯罪有关，通常通过非法手段产生利润，并拥有充足的资源和资金进行恶意活动。脚本小子的技术水平有限，通常是出于好玩而黑入系统的个人；他们不太可能获得资助。\n\
  \n### 8\n![Images](img/com.jpg)\nB 和 D。能够进入机房的运维人员可以直接访问物理服务器和存储阵列，且物理访问可以绕过防火墙规则。这被认为是一种潜在的内部威胁。\n\
