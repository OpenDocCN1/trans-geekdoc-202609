  \ VLAN 是广播域，类似于路由器端口。\n\n# 18\n![Images](img/com.jpg)\n**A** 和 **B.** 网络时间协议（NTP）使计算机与可靠源同步。捕获的网络流量带有时间戳，并包括开始采集的时间偏移。\n\
  \n![Images](img/com-1.jpg)\n**C** 和 **D** 是错误的。数字签名确保消息以及发送者的真实性，但不能保证其时间戳。加密保护数据，但与确保时间戳真实无关。\n\
  \n# 19\n![Images](img/com.jpg)\n**C.** 在扣押前详尽记录设备状态对于遵守监管链程序至关重要。未做到这一点将导致证据无效。\n\
  \n![Images](img/com-1.jpg)\n**A, B,** 和 **D** 是错误的。永远不要开启一台关闭的计算机。开启它可能会破坏宝贵的数据。不要拔掉\
  \ USB 硬盘。在对设备进行记录之前，不要扰动其状态。如果具有无线接口，将其放入法拉笼可能是合适的，但必须先记录现场。\n\n# 20\n![Images](img/com.jpg)\n\
  **A.** 位流取证复制工具在位级复制硬盘数据，而不是文件级。当文件被删除时，它可能会从文件系统中消失，但在硬盘被新数据填充之前，整个文件数据在硬盘上都是完好的。删除的文件无法通过文件级复制获取，但通过位流复制可以。\n\
