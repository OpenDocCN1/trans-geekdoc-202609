  C. 域名信誉 (Domain reputation)\nD. 稀缺性 (Scarcity)\nE. 恶意代码执行 (Malicious code execution)\n\
  \n### [41]\n你接到一个本该休假的网络管理员的电话。她告诉你财务系统进行了更新，她需要你临时将密码改为 `N3wSyst3m`，以便软件接收初始更新。这里使用的是哪种社会工程技术？\n\
  \nA. 冒充 (Impersonation)\nB. 诱取信息 (Eliciting information)\nC. 预置 (Prepending)\nD.\
  \ 发票诈骗 (Invoice scams)\n\n\n\n\n\n### 42. 以下哪种属于二层攻击，即攻击者通过向交换机发送大量帧，以欺骗交换机将所有新帧发送到交换机上的每个端口？\n\
  \nA. ARP 毒化\nB. MAC 克隆\nC. MAC 欺骗\nD. MAC 泛洪 (MAC flooding)\n\n### 43. 哪种类型的物理攻击涉及攻击者创建一个嵌入了无线控制器的组件，使得攻击者能够从附近的手机或\
  \ PC 向设备发送命令？\n\nA. 卡片克隆\nB. 喷射攻击\nC. 恶意 USB 线缆\nD. 捕大鱼攻击 (Whaling)\n\n### 44. 以下哪种攻击类型涉及攻击者操纵数据输入，以利用系统用算法的漏洞？\n\
  \nA. 对抗性 AI 攻击\nB. 供应链攻击\nC. 云端攻击\nD. 本地攻击\n\n### 45. 哪种类型的 DDoS 攻击涉及通过来自许多不同来源的流量消耗带宽，导致公司无法访问互联网？\n\
  \nA. 应用层\nB. 网络层\nC. 运营技术层\nD. 物理层\n\n### 46. 为了执行你创建的脚本，你首先运行 `set-executionpolicy\
  \ unrestricted` 命令。你正准备执行的是什么类型的脚本文件？\n\nA. Bash\nB. Python\nC. PowerShell\nD. 宏\n\
  E. VBA\n\n## 快速答案\n\n1. D\n2. B\n3. C\n4. B\n5. A\n6. C\n7. B\n8. D\n9. A, D\n10.\
  \ D\n11. C\n12. B\n13. A\n14. D\n15. A\n16. C\n17. B\n18. D\n19. A\n20. D\n21. C\n\
  22. B\n23. D\n24. B\n25. C\n26. B\n27. A\n28. D\n29. A, C\n30. B\n31. B\n32. A\n\
  33. D\n34. C\n35. A\n36. C\n37. D\n38. B\n39. C\n40. B, D\n41. A\n42. D\n43. C\n\
  44. A\n45. B\n46. C\n\n## 深度解析\n\n#### 1. D\nARP 毒化发生在攻击者修改 ARP 缓存，将通信重定向到特定 IP\
  \ 地址的错误 MAC 地址，而该 MAC 地址映射到攻击者的机器。这是一种无线网络中常见的攻击方式。\n\nA、B 和 C 是错误的。暴力破解攻击是一种密码攻击，涉及攻击者计算所有可能的密码直到找到匹配项。DNS\
  \ 毒化发生在攻击者对 DNS 缓存投毒时，导致 DNS 服务器给出错误的 IP 地址。缓冲区溢出发生在发送到目标系统的数据量超过了目标缓冲区分配的数据大小，从而导致相邻的内存区域被覆盖。由于缓冲区溢出，攻击者可以以被利用账户的权限级别访问系统，这有时是管理员级权限。\n\
  \n#### 2. B\n尾随攻击 (Tailgating) 发生在未经授权的人员在授权人员打开门后试图溜进安全门的情况。防范人员门道（Mantrap）可以帮助防止尾随攻击；它是两扇锁门之间的区域，只有当第一扇门关闭后，第二扇门才会打开。这让你能够观察谁与你一起进入建筑，或者可以防止两个人同时进入门口。\n\
  \nA、C 和 D 是错误的。刷卡器是用于解锁门的机制，但它们不能防止有人进行尾随。锁上的门不能防止有人在你打开门后通过门进行尾随。CMOS 设置是一种实现某种安全级别的方法，防止他人从可移动介质启动并绕过本地系统的安全性。\n\
  \n#### 3. C\n缓冲区溢出攻击发生在攻击者向应用程序或服务发送的数据超过其预期量时。发送的额外数据流出了分配分配的内存区域（缓冲区）。研究发现，如果攻击者能够向缓冲区之外写入信息，他们就可以运行任何想要的代码。攻击者通常会编写代码以获取具有管理能力的系统远程\
  \ shell 访问权限。\n\nA、B 和 D 是错误的。在网页中注入数据库代码是 SQL 注入攻击的示例。使用字典文件破解密码被称为字典攻击——这是密码攻击的一种。修改数据包的源地址被称为欺骗（Spoofing），在本例中具体指为\
  \ IP 欺骗。\n\n#### 4. B\nSQL 注入攻击发生在攻击者将数据库（SQL）语句插入应用程序（如网站）中，随后应用程序将这些 SQL 命令传递给后端数据库进行处理。结果可能导致攻击者绕过身份验证或操纵后端数据库中的数据。在本例中，攻击者试图在密码框中输入\
  \ `“pass’ or 1=1--\"` 来绕过登录。\n\nA、C 和 D 是错误的。XML 注入攻击旨在通过向 XML 消息中插入 XML 内容来攻击应用程序的逻辑。LDAP\
  \ 注入旨在通过 Web 应用程序将 LDAP 调用插入底层 LDAP 服务，以便执行该 LDAP 调用。拒绝服务发生在攻击者试图过载你的系统或网络，使其无法处理有效请求时。\n\
  \n#### 5. A\n钓鱼攻击发生在攻击者向受害者发送电子邮件，并希望其点击通向虚假网站（通常是银行）的链接。此时，攻击者希望用户在虚假网站上输入信息（如银行账户信息），以便其获取其真实账户的访问权限。\n\
  \nB、C 和 D 是错误的。垃圾邮件（Spam）是你收到的未经请求的电子邮件，试图鼓励你购买产品或服务。字典攻击是一种密码攻击，通过读取字典文件并将文本文件中所有的单词作为密码尝试。垃圾信息信息（Spim）是通过即时消息而非电子邮件发送的垃圾类型信息。\n\
  \n#### 6. C\n欺骗攻击发生在攻击者修改数据包源地址时。在 IP 欺骗中，修改的是源 IP 地址；在 MAC 欺骗中，修改的是源 MAC 地址；在电子邮件欺骗中，攻击者更改了消息的源电子邮件地址。\n\
  \n\n\n\n\n![Images](img/com-1.jpg) A、B 和 D 都是错误的。圣诞树攻击（Xmas attack）是一种端口扫描，其 TCP\
  \ 头部中设置了 `FIN`、`URG` 和 `PSH` 标志。鱼叉式网络钓鱼（Spear phishing）是针对公司内特定个人或群体的钓鱼邮件。钓网劫持（Pharming）发生在攻击者修改\
  \ `hosts` 文件或投毒 `DNS` 时，导致受害者进入虚假网站，并试图从用户处收集登录凭据或账户号码等个人信息。\n\n### 问题 7\n![Images](img/com.jpg)\
  \ B. 计算机本地硬盘上的 `hosts` 文件用于将完全限定域名（FQDN）解析为 IP 地址，并可能用于将毫无防备的人重定向到错误的网站。\n\n![Images](img/com-1.jpg)\
  \ A、C 和 D 是错误的。`/etc/passwd` 文件是 Linux 中存储密码的地方。`SAM` 文件是 Windows 用户密码存储的地方。`services`\
  \ 文件是将端口映射到服务实际友好名称的文件。\n\n### 问题 8\n![Images](img/com.jpg) D. 缓冲区溢发生在发送到目标系统的数据量超过了目标缓冲区分配的数据大小，从而导致相邻的内存区域被覆盖。如果缓冲区溢出成功，攻击者能够在被利用软件的安全上下文中执行代码，可能获得管理员级访问。\n\
  \n![Images](img/com-1.jpg) A、B 和 C 是错误的。生日日攻击（Birthday attack）是针对哈希函数的一种加密攻击类型示例，通过不同的数据输入生成相同的哈希值。域名攻击/URL\
  \ 劫持（Typosquatting/URL hijacking）发生在攻击者预见到常见 URL 的常见拼写错误，并在这些 URL 上运行虚假网站，希望受害者认为自己处于真实网站，而实际上是在攻击者的网站上。窃听攻击（Eavesdrop\
  \ attack）发生在攻击者监听对话或使用 `Wireshark` 等数据包分析器捕获网络流量时。\n\n### 问题 9\n![Images](img/com.jpg)\
  \ A 和 D。ARP 投毒可以通过向 `ARP` 缓存添加静态 ARP 条目以及实施物理安全来防止，这样未经授权的人无法访问网络并投毒所有人的 `ARP` 缓存。\n\
  \n![Images](img/com-1.jpg) B、C 和 E 是错误的。补补系统无法防止 ARP 投毒，因为系统补丁移除软件中的漏洞。杀毒软件无法防止\
  \ ARP 投毒，因为不涉及病毒。防火墙也不是解决方案，因为你需要确保 `ARP` 消息可以到达所有工作站，这将允许 ARP 投毒消息通过。\n\n### 问题\
  \ 10\n![Images](img/com.jpg) D. 应对缓冲区溢出攻击的最佳措施是确保及时更新系统和应用程序补丁。当厂商发现漏洞时，该厂商将通过补丁修复问题。\n\
  \n![Images](img/com-1.jpg) A、B 和 C 是错误的。静态 ARP 条目将帮助防止 ARP 投毒；杀毒软件只要你保持病毒定义更新，就能防止病毒和其他恶意软件；物理安全将帮助控制谁获得对服务器等资产的物理访问权限，但缓冲区溢出攻击通常是网络攻击，攻击者不需要对资产进行物理访问。\n\
  \n### 问题 11\n![Images](img/com.jpg) C. 域名钓鱼（Domain kiting）是域名系统中的一种漏洞，攻击者注册一个 `DNS`\
  \ 名称然后在五天的宽限期内取消它以避免支付域名费用。几天后，他删除该名称并重新创建以再次获得五天的宽限期。\n\n![Images](img/com-1.jpg)\
  \ A、B 和 D 是错误的。通过 DNS 重定向（DNS redirection），攻击者确保你的系统为某个 `DNS` 名称分配错误的 IP 地址。域名投毒（Domain\
  \ poisoning）是一种确保你的系统为特定域名分配错误 IP 地址的方法。传递访问（Transitive access）是一种基于信任模型的攻击：如果机器\
  \ A 信任机器 B，机器 B 信任机器 C，那么在某些环境中，机器 C 会默认信任机器 B，从而授予对不受欢迎源的潜在访问。\n\n### 问题 12\n![Images](img/com.jpg)\
  \ B. 你以高频率接收大量畸形请求，这表明有人正试图对你的系统进行拒绝服务（DoS）攻击。DoS 的结果可能是让你的系统忙于处理虚假请求，而无法处理客户的有效请求，或者攻击者可能会尝试崩溃你的系统。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 是错误的。窃听是一种被动型攻击，涉及攻击者捕获流量，而不是向你的系统发送流量。中间人攻击（Man-in-the-middle\
  \ attack）涉及攻击者让自己插入到对话中，使所有流量都通过攻击者。社会工程攻击（Social engineering attack）发生在有人试图通过社交接触（电子邮件或电话））欺骗你破坏安全时。\n\
  \n### 问题 13\n![Images](img/com.jpg) A. 烟雾攻击（Smurf attack）是一种分布式拒绝服务（DDoS）攻击，涉及多个系统的\
  \ DoS 攻击。烟雾攻击涉及攻击者 ping 多个系统但伪造 `ICMP` 数据包的地址，使这些系统都向受害者回复。受害者会因为过量的 `ICMP` 回复而过载，从而导致拒绝服务。\n\
  \n![Images](img/com-1.jpg) B、C 和 D 是错误的。拒绝服务（DoS）攻击仅涉及一个系统执行攻击，但烟雾攻击涉及多个系统执行攻击。权限提升（Privilege\
  \ escalation）发生在用户级访问权限能够利用系统内的漏洞获得更高权限时。恶意内部威胁（Malicious insider threat）发生在公司内部人员破坏或故意披露敏感数据时。\n\
  \n### 问题 14\n![Images](img/com.jpg) D. 翻垃圾（Dumpster diving）发生在攻击者翻找公司的垃圾，寻找帮助其执行攻击或访问公司资产的信息。\n\
  \n![Images](img/com-1.jpg) A、B 和 C 是错误的。尾随（Tailgating）发生在未经授权的人试图跟随授权人员后面溜进上锁的门时。拒绝服务发生在攻击者过载系统导致其无响应或崩溃，而社会工程学发生在攻击者试图通过社交接触（如电话或电子邮件）欺骗某人以破坏安全时。\n\
  \n### 问题 15\n![Images](img/com.jpg) A. 跨站脚本（XSS）是一种攻击，涉及攻击者向网页中插入脚本代码，然后这些代码由客户端系统处理并执行。\n\
  \n![Images](img/com-1.jpg) B、C 和 D 是错误的。水坑攻击（Watering hole attack）发生在攻击者在你可能经常访问的网站上放置恶意代码，以便当你访问该网站时，代码会从你信任的网站攻击你的系统。ARP\
  \ 投毒发生在攻击者操纵 ARP 缓存添加其 MAC 地址，从而将系统引导至攻击者的系统。SQL 注入是在应用程序中插入 SQL 代码以操纵底层数据库或系统。\n\
  \n\n\n\n\n### [16]\n![Images](img/com.jpg) **C.** SQL 注入攻击涉及攻击者将数据库代码插入到应用程序（如网站）中不应出现的地方。对此最好的应对措施是让你的程序员对传入应用程序的任何信息进行验证（检查其准确性）。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **D** 是错误的。虽然修补系统可以解决很多问题，但它无法保护你构建的应用程序免受\
  \ SQL 注入攻击。杀毒软件在这种情况下也无法为你提供帮助，因为这不是病毒问题——而是基于你自己的编码习惯的问题。包过滤防火墙也对你没有帮助，因为你需要允许人们访问应用程序，问题不在于到达系统的流量类型——问题在于插入到应用程序中的数据。\n\
  \n### [17]\n![Images](img/com.jpg) **B.** 当攻击者投毒每个人的 ARP 缓存，以便他们将任何发往互联网的数据通过攻击者的系统进行发送时，这就是中间人攻击，因为攻击者在流量发送到互联网之前接收了所有流量。攻击者这样做是为了查看你在互联网上做什么，并在理想情况下捕获敏感信息。\n\
  \n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。彩虹表是一个包含数学计算密码的哈希表示的文件，以便可以快速进行暴力破解。DNS\
  \ 投毒涉及攻击者修改 DNS 缓存以引导受害者进入错误的网站。泛指欺骗（Spoofing）修改源地址；IP 欺骗是修改源 IP 地址使数据包看起来像是来自不同的地方。\n\
  \n### [18]\n![Images](img/com.jpg) **D.** 零日攻击被认为是一种厂商尚未意识到、但黑客社区已经获知的新漏洞。\n\n![Images](img/com-1.jpg)\
