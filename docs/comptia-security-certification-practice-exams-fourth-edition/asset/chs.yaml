  \ MP3 文件（而非图像文件）中隐藏文本信息的程序，捕鲸攻击是一种针对公司高管的网络钓鱼。\n\n### [27]\n![Images](img/com.jpg)\
  \ **A.** 尾随（Tailgating）发生在未经授权的人试图跟在授权人员后面以溜进锁上的门时。\n\n\n\n\n\n![Images](img/com-1.jpg)\n\
  `B, C,` 和 `D` 是错误的。垃圾桶搜索（Dumpster diving）是指攻击者通过翻垃圾来寻找敏感信息。暴力破解（Brute force）是一种密码攻击，通过数学计算所有可能的密码来猜测正确的密码。大叉鱼攻击（Whaling）是一种针对公司高管的钓鱼攻击。\n\
  \n### 28\n![Images](img/com.jpg)\n`D.` 窥视屏幕攻击（Shoulder surfing）是一种社会工程攻击，涉及某人从你身后偷看你的通行码或其他敏感信息。\n\
  \n![Images](img/com-1.jpg)\n`A, B,` 和 `C` 是错误的。欺骗邮件（Hoaxes）是描述虚假故事并发送给用户要求其采取某种形式行动的邮件，例如将信息转发给他人。尾随攻击（Tailgating）发生在未经授权的人试图跟在授权人员后面，溜进锁上的门的情况下。垃圾桶搜索是指攻击者通过翻垃圾来寻找敏感信息。\n\
  \n### 29\n![Images](img/com.jpg)\n`A, C,` 和 `E.` 社会工程攻击之所以成功有很多原因，包括以下三个原因：受害者相信他收到了来自权威人士的通信。此外，攻击者说话带有紧迫感，这让受害者想要尽快提供帮助。信任（Trust）是正确的，因为社会工程是基于我们信任人的事实，特别是对需要帮助的人或权威人士。社会工程有效还有其他许多原因，例如恐吓、共识或社会证明、事件的稀缺性，以及对某人的熟悉程度或好感。大多数社会工程专家都精通如何表现得讨人喜欢，这会转化为信任。\n\
  \n![Images](img/com-1.jpg)\n`B` 和 `D` 是错误的。DNS 毒化（DNS poisoning）发生在攻击者更改 DNS 数据并将受害者重定向到恶意网站时。暴力破解是一种密码攻击，通过数学计算所有潜在密码来猜测正确的密码。在线暴力破解涉及对活动系统进行攻击，而离线暴力破解涉及获取密码数据库的副本，并在稍后在攻击者的系统上进行密码破解。\n\
  \n### 30\n![Images](img/com.jpg)\n`B.` 目录遍历（Directory traversal）发生在攻击者在 URL 中导航\
  \ Web 服务器的文件夹结构，以调用 Web 服务器操作系统中的命令时。\n\n![Images](img/com-1.jpg)\n`A, C,` 和 `D`\
  \ 是错误的。整数溢出（Integer overflow）是一种产生安全风险的攻击形式，因为在执行数学函数时程序产生了意料之外的响应，且用于存储结果的整数大于程序员分配的内存空间。在恶意插件攻击中，你的系统下载了一段浏览器使用的软件，并减慢系统或利用系统漏洞。报头操纵（Header\
  \ manipulation）发生在攻击者修改数据包中的报头数据，以操纵应用程序处理信息的方式。\n\n### 31\n![Images](img/com.jpg)\n\
  `B.` 恐吓（Intimidation）发生在攻击者使用欺凌策略或威胁受害者以使受害者采取行动时。\n\n![Images](img/com-1.jpg)\n\
  `A, C,` 和 `D` 是错误的。熟悉（Familiarity）涉及攻击者预先与受害者建立某种联系，或伪装成受害者经常打交道的人。共识（Consensus）是一种策略，涉及攻击者伪造证来说服受害者其他人使用过攻击者提供的软件或网页，使其看起来安全。稀缺性（Scarcity）是一种让攻击者提供的东西看起来非常稀有或可能在其他地方找不到的攻击。例如，攻击者可以通过说软件在任何地方都找不到，引导受害者点击链接。\n\
  \n### 32\n![Images](img/com.jpg)\n`A.` 跨站请求伪造（Cross-site request forgeries）发生在攻击者欺骗用户在其已验证身份的网站上执行意外的操作时。\n\
  \n![Images](img/com-1.jpg)\n`B, C,` 和 `D` 是错误的。跨站脚本攻击（Cross-site scripting）允许攻击者在其他用户看到的网页中插入客户端脚本。重放攻击（Replay\
  \ attack）发生在合法的网络流量被恶意延迟或重复时。哈希传递攻击（Pass the hash）是一种涉及拦截合法用户的哈希并使用其作为该用户身份访问其他资源的的攻击。\n\
  \n### 33\n![Images](img/com.jpg)\n`D.` 放大攻击（Amplification attack）涉及向一个不知情的第三方发送少量数据，由该第三方向目标发送大量数据。\n\
  \n![Images](img/com-1.jpg)\n`A, B,` 和 `C` 是错误的。缓冲区溢出攻击（Buffer overflow attack）用于通过数据溢出目标缓冲区来尝试在目标机器上执行任意代码。域名劫持（Domain\
  \ hijacking）是一种域名系统（`DNS`）攻击，发生在未经注册人许可的情况下更改域名注册信息时。浏览器中间人攻击（A man in the browser）发生在用户运行的浏览器被感染，并在用户或接收服务器不知的情况下操纵用户请求时。\n\
  \n### 34\n![Images](img/com.jpg)\n`C.` 点击劫持攻击（Click-jacking attack）涉及欺骗用户点击一个会导致某些恶性结果的对象。用户认为他们是为了合法目的点击链接，但实际上在不知情的情况下下载了恶意软件或执行了其他活动。\n\
  \n![Images](img/com-1.jpg)\n`A, B,` 和 `D` 是错误的。重放攻击涉及合法网络流量被恶意延迟或重复。驱动操纵中的垫片（Shimming）是一种攻击，某些软件充当驱动并拦截和修改进入硬件的命令。整数溢出发生在存储公式预期结果的整数消耗了分配给它的内存空间。\n\
  \n### 35\n![Images](img/com.jpg)\n`A.` 重构攻击（Refactoring attack）涉及在更改驱动内部代码的同时保持外部行为，使其看起来运行正常。\n\
  \n![Images](img/com-1.jpg)\n`B, C,` 和 `D` 是错误的。碰撞攻击（Collision attack）是一种密码攻击示例，攻击者尝试找到产生与不同源数据相同输出哈希值的额外输入。ARP\
  \ 毒化（ARP poisoning）更改 ARP 缓存并将与 IP 地址相关的通信重定向到攻击者的 MAC 地址。域名拼写攻击（Typosquatting）是一种涉及注册与合法网站拼写错误的域名的攻击，以引导受害者访问这些网站，他们误认为正在浏览合法网站。它还可能涉及使用这些域名发送钓鱼邮件，以欺骗受害者认为邮件源自合法域名。\n\
  \n### 36\n![Images](img/com.jpg)\n`C.` 降级攻击（Downgrade attack）涉及强制连接放弃高质量加密协议，转而使用低质量、更不安全的协议。\n\
  \n\n\n\n\n![Images](img/com-1.jpg)\n\n`A`、`B` 和 `D` 是错误的。弱实现指的是实现方式容易被破解的加密方法，例如\
  \ Wi-Fi 网络上的`Wired Equivalent Privacy (WEP)`。已知明文/密文攻击是指发生在攻击者可以访问明文和加密版本的情况下，或者在已知密文攻击的情况下，攻击者可以访问密文。在密码学中，重放攻击是指合法的网络流量被欺诈或恶意地延迟或重新发送。\n\
  \n**37.** ![Images](img/com.jpg) `D.` 手机钓鱼攻击（Smishing）是指攻击者使用 `SMS` 短信向用户的手机发送钓鱼式信息，企图欺骗用户破坏安全。\n\
  \n![Images](img/com-1.jpg) `A`、`B` 和 `C` 是错误的。撞库攻击（Spraying）是一种密码攻击类型，涉及使用单个常用密码尝试破解大量用户账户，以防止因对每个账户进行多次访问尝试导致账户锁定。侧读（Skimming），也称为信用卡盗刷，是指攻击者使用设备从信用卡（通常是银行卡）的磁条上提取信息。这些信息会被放置在新的空白卡上，以便攻击者尝试使用该卡访问您的账户。卡克隆是侧读的另一个术语，涉及从磁条上复制卡信息并放入空白卡中，以便攻击者可以使用该卡进行购物。\n\
  \n**38.** ![Images](img/com.jpg) `B.` 凭据收集（Credential harvesting）是指攻击者收集登录信息，然后使用这些信息在之后访问系统。\n\
  \n![Images](img/com-1.jpg) `A`、`C` 和 `D` 是错误的。侦察是攻击过程的一部分，涉及攻击者发现有关害者的信息以辅助攻击。冒充是社交工程攻击期间的技术之一，涉及攻击者假装成其他人欺骗你破坏安全。混合战争是指在冲突期间将传统的军事战术与非传统方法（如组织犯罪、恐怖主义以及利用民用人员执行不同类型的行动，包括宣传）相结合发生的。\n\
  \n**39.** ![Images](img/com.jpg) `C.` 社交媒体是一种可以在社交工程攻击期间用于影响战的工具。\n\n![Images](img/com-1.jpg)\
  \ `A`、`B` 和 `D` 是错误的。恐吓是社交工程攻击期间使用的战术，但不属于影响战。恶意 U 盘被用于物理攻击，其中攻击者通过欺骗用户将运行恶意软件的\
  \ U 盘插入系统来实现攻击。身份欺骗是指一个人的身份信息（如社会安全号码或信用卡信息）被攻击者盗取并使用。\n\n**40.** ![Images](img/com.jpg)\
  \ `B` 和 `D.` 社交工程之所以有效有很多原因，例如恐吓、共识或社会证明、事件的稀缺性以及对某人的熟悉或好感。\n\n![Images](img/com-1.jpg)\
  \ `A`、`C` 和 `E` 是错误的。URL 重定向是一种 DNS 攻击，涉及攻击者将您的域名发送请求到另一个位置（例如攻击者的网站）。域名信誉代表了您的电子邮件域在信息清洁方面的信誉。如果您的域名发送大量垃圾邮件，则域名信誉评级较低，而不发送垃圾邮件的域名则相反。恶意代码执行是指执行木马病毒或键盘记录器等恶意软件，用于破坏系统的安全。\n\
  \n**41.** ![Images](img/com.jpg) `A.` 冒充是指攻击者假装成另一个个体以欺骗他人破坏安全。攻击者冒充网络管理员以让用户做出更改很常见，但攻击者冒充沮丧的用户以让管理员帮助用户访问网络也很常见。\n\
  \n![Images](img/com-1.jpg) `B`、`C` 和 `D` 是错误的。套取信息（Eliciting information）是指攻击者使用社交工程技术从用户处获取可用于攻击的信息。前置（Preprocessing）是指攻击者在某些恶意数据的开头添加信息，以欺骗用户信任该数据。例如，`www.trustedsite.com@192.168.1.1`\
  \ 过去是一种常用方法，引导你点击一个你认为会进入可信网站的链接，但旧版浏览器会忽略 `@` 符号左侧的内容，并导航到 `@` 符号右侧显示的任何地址，这可能是攻击者设置的站点。发票诈骗是指攻击者发送邮件要求逾期发票，但实际上这些发票文件感染了某种恶意软件；或者受害者被点击\
  \ URL。\n\n**42.** ![Images](img/com.jpg) `D.` MAC 泛洪是指攻击者向交换机发送大量帧，导致其地址表中删除旧条目以为新条目留空间。这会导致已知\
  \ MAC 地址从表中移除，从而导致交换机泛洪（到所有端口）。\n\n![Images](img/com-1.jpg) `A`、`B` 和 `C` 是错误的。ARP\
  \ 污染是指攻击者更改系统的 ARP 缓存，以便将指向特定 IP 地址的通信重定向到攻击者的 MAC 地址。MAC 克隆是指攻击者复制网络上现有的 MAC 地址并使用该\
  \ MAC 地址发送网络通信。MAC 伪造（MAC spoofing）是指攻击者更改其源 MAC 地址，通常用于绕过无线路由器上的 MAC 访问列表。\n\n\
  **43.** ![Images](img/com.jpg) `C.` 恶意 USB 线被用作系统的物理攻击，因为 USB 线必须物理连接到攻击者想要利用的系统。一旦线连接，它就可以接收无线指令并在目标系统上执行负载。\n\
  \n![Images](img/com-1.jpg) `A`、`B` 和 `D` 是错误的。卡克隆是侧读的另一个术语，涉及从磁条上复制卡信息并放入空白卡中，以便攻击者可以使用该卡进行购物。撞库攻击是一种密码攻击类型，涉及使用单个常用密码尝试破解大量用户账户。捕鲸者攻击（Whaling）是一种针对公司高管（大鱼）的社交工程攻击。\n\
  \n**44.** ![Images](img/com.jpg) `A.` 人工智能（AI），也称为机器学习，可能受到对抗机器学习攻击，攻击者向学习系统发送恶意输入以破坏系统。这种攻击基于机器学习系统使用数据模型进行训练的事实，这些模型可能是污染的机器学习训练数据。学习系统在生产环境中对攻击期间的不同数据输入可能会有不同的响应。这种攻击类型旨在测试机器学习算法的安全性。\n\
  \n\n\n\n\n![Images](img/com-1.jpg) **B**、**C** 和 **D** 是错误的。当攻击者攻击企业的供应链时，就会发生供应链攻击。企业的供应链涉及为了将货物交付到客户手中所需的任何供应商和任何活动。现在，网络安全攻击针对组织的供应链已变得常见，这会对业务产生灾难性的影响。云端攻击影响云资源，如在云端运行的数据和服务。例如，攻击者可能会创建恶意软件，删除用户正在使用的云数据存储帐户中的数据。本地攻击发生在攻击影响了公司现场的系统或数据时。\n\
  \n**45.**\n![Images](img/com.jpg) **B.** 基于网络的分布式拒绝服务攻击涉及耗尽网络资源（如带宽或路由器、交换机等网络设备的处理能力），导致网络访问缓慢或崩溃。\n\
  \n![Images](img/com-1.jpg) **A**、**C** 和 **D** 是错误的。基于应用程序的 DDoS 是针对特定软件的攻击，会导致应用程序或服务停止运行。基于运营技术的\
  \ DDoS 是针对运行工业设备所需的硬件和软件的攻击。物理攻击不是基于 DDoS 的攻击，而是针对物理安全的攻击，例如通过攻击（或禁用）物理锁来进入设施。\n\
  \n**46.**\n![Images](img/com.jpg) **C.** 要要在 Windows 系统上执行 PowerShell 脚本，你必须先设置系统上的执行策略以允许脚本执行。你可以通过组策略同时配置多个系统上的执行策略，或者在\
  \ PowerShell 中使用 `set-executionpolicy` 命令。\n\n![Images](img/com-1.jpg) **A**、**B**、**D**\
  \ 和 **E** 是错误的，因为它们不需要运行 `set-executionpolicy` 命令。Bash Shell 脚本在 Linux 或 Unix 环境中创建，用于自动化这些操作系统内部的任务。Python\
  \ 脚本是运行在 Linux 或 Windows 等不同平台上的常用脚本，具有 `.py` 扩展名。宏脚本是在带有小型编程语言（称为宏语言）的软件中创建的。VBA\
  \ 代表 Visual Basic for Applications，是 Microsoft Office 应用程序中可用的一种宏脚本。\n\n# 第 5 章：漏洞与威胁\n\
  \n## 认证目标\n- 5.01 识别恶意软件类型\n- 5.02 网络与设备加固\n- 5.03 IoT 安全\n- 5.04 工业控制系统安全\n- 5.05\
  \ 管理嵌入式系统安全\n\n## 题目\n\nIT 安全威胁可以适用于软件或硬件。软件威胁包括漏洞的利用以及蠕虫和间谍软件等各种恶意软件。硬件威胁适用于恶意实体获得物理访问时，例如访问手持设备或服务器硬盘。\n\
  \nIoT 和专用嵌入式设备被广泛使用，可以通过互联网传输敏感数据，而工业控制系统通常未连接外部网络。识别这些威胁是正确应用安全策略的重要步骤。\n\n**1.**\
  \ 之前的云管理员部署了一个云托管的 Web 应用程序，该程序通过 SSL 网络协议在 TCP 端口 443 使用 HTTPS 通信。客户通过互联网访问该 Web\
  \ 应用程序。支持该应用程序的底层云 Linux 虚拟机默认采用用户名和密码验证。你被要求加固该 Web 应用程序。你应该建议什么？（选择两个。）\n\nA.\
  \ 使用 TLS 代替 SSL。\nB. 将默认的 HTTPS 端口 443 更改为其他值。\nC. 将 Web 应用程序托管在底层的 Windows 虚拟机上而不是\
  \ Linux。\nD. 配置 Linux 公钥认证代替用户名和密码验证。\n\n**2.** 下面哪些陈述是正确的？（选择两个。）\n\nA. 蠕虫将所有输入的字符记录到文本文件中。\n\
  B. 蠕虫将自身传播到其他系统。\nC. 蠕虫可以包含额外的恶意软件。\nD. 蠕虫会感染硬盘 MBR。\n\n**3.** 在对网络设备进行评估时，你发现了一些旧式和现代\
  \ IoT 设备不允许重置管理凭据，不支持 TLS，且不允许固件更新。你应该如何做来确保这些设备的持续使用？\n\nA. 在设备上启用 HTTPS。\nB. 修补\
  \ IoT 操作系统。\nC. 将发现的设备置于防火墙和隔离的网络中。\nD. 启用可疑设备活动的警报。\n\n**4.** 哪种描述*最准确地*定义无文件病毒？\n\
  \nA. 一个自我复制的计算机程序\nB. 一个具有 `.vbs` 扩展名的文件\nC. 一个收集用户信息的计算机程序\nD. 一个直接加载到计算机内存中的恶意计算机程序\n\
  \n**5.** 你正在为一个 Web 应用程序开发自定义软件组件，该组件将通过 HTTPS 在互联网上获取实时股票报价馈。你的解决方案将由自定义编程代码以及使用\
  \ C# 编程语言的现有代码库代码组成。数据馈源自云存储存储库。以下哪项为该场景带来了最大的潜在安全风险？\n\nA. 云存储\nB. 互联网上的数据传输\n\
  C. C# 中的漏洞\nD. 组件集成\n\n**6.** James 是一家高科技公司的软件开发人员。他创建了一个连接到聊天室的程序，并等待接收收集用户信息的命令。James\
  \ 将此程序嵌入到一个当前流行电影的 AVI 文件中，并在 P2P 文件共享网络上分享该文件。一旦人们下载并观看电影时 James 的程序被激活，将创建什么？\n\
  \nA. 僵尸网络\nB. DDoS\nC. 逻辑炸弹\nD. 蠕虫\n\n**7.** 用户报告了 USB 键盘问题。你检查了电脑背面以确保键盘连接良好，并注意到键盘与电脑\
