  \n### 37\n![Images](img/com.jpg)\n**A.** Tor 浏览器设计用于提供匿名访问互联网和暗网。\n\n![Images](img/com-1.jpg)\n\
  **B, C,** 和 **D** 是错误的。VPN 客户端在不可信的网络上与 VPN 端点建立安全连接。Google Chrome 是标准的网页浏览器，僵尸网络是受单个恶意用户控制的受感染计算机集合；这些中没有设计用于查看暗网网页的。\n\
