  \n### 22\n![Images](img/com.jpg)\n**A.** 可信平台模块（`TPM`）芯片可以存储用于加密解密驱动器内容的密钥或证书。如果驱动器移动到另一台计算机（即使有\
  \ `TPM`），驱动器仍保持加密状态。\n\n**B, C,** 和 **D** 是错误的。数据泄露防护（`DLP`）指的是确保数据安全的机制，例如防止敏感数据被复制。加密文件系统（`EFS`）纯属软件，不是固件芯片。NTFS（`NTFS`）使用访问控制列表（`ACL`）控制对数据的访问，但数据并未加密。\n\
  \n### 23\n![Images](img/com.jpg)\n**C.** 智能手机加固包括配置自动锁屏、设备加密、更新操作系统和必备应用、安装和更新反恶意软件，以及禁用不需要的功能和软件。\n\
  \n![Images](img/com-1.jpg)\n**A, B,** 和 **D** 是错误的。数据采集与监控系统（`SCADA`）是一种用于工业环境的特殊系统并在系统被篡改时提供报警。题目询问的是保护手机上的数据，而不是通过\
  \ VPN 连接网络。`HTTPS` 不保护手机上的数据，只保护 Web 浏览器与安全网站之间传输的数据。\n\n### 24\n![Images](img/com.jpg)\n\
  **C.** 静态数据（Data-at-rest）存储在介质上的数据。\n\n![Images](img/com-1.jpg)\n**A, B,** 和 **D**\
  \ 是错误的。处理中数据（Data-in-process）指的是正在使用的数据。传输中数据（Data-in-transit）指的是网络传输的数据，安全数据（data-at-security）是一个无效术语。\n\
  \n\n\n\n\n### 25\n![Images](img/com.jpg)\n**A.** 受保护健康信息 (PHI) 指以安全方式存储和访问的敏感医疗信息。\n\
  \n![Images](img/com-1.jpg)\n**B, C,** 和 **D** 是错误的。传输层安全 (TLS) 是一种保护网络流量的方法。个人身份信息\
  \ (PII) 比 PHI 更通用，且不侧重于医疗信息。高级加密标准 (AES) 是一种对称加密算法。\n\n### 26\n![Images](img/com.jpg)\n\
  **D.** 智能卡构成“你拥有的东西”，而智能卡的 PIN 码构成“你知道的东西”。当两者结合使用时，被视为多因素身份认证。\n\n![Images](img/com-1.jpg)\n\
  **A, B,** 和 **C** 是错误的。用户名、密码和安全问题都被视为“你所知的”。指纹和视网膜扫描被视为“你所是”。这些组合没有被视为多因素身份认证；它们是单因素身份认证。\n\
  \n### 27\n![Images](img/com.jpg)\n**D.** 安全断言标记语言 (SAML) 是一种 XML 标准，定义了如何在联邦身份环境中传输传输身份验证和授权数据。\n\
  \n![Images](img/com-1.jpg)\n**A, B,** 和 **C** 是错误的。轻量级目录访问协议 (LDAP) 是一种定义如何访问复制网络数据库的协议。安全套接层\
  \ (SSL) 提供了一种保护特定应用程序网络传输的方法。公钥基础设施 (PKI) 是数字安全证书的分层次结构，可以与计算设备配合提供数据机密性、认证和完整性服务。\n\
  \n### 28\n![Images](img/com.jpg)\n**D.** 证据链 (Chain of custody) 确保证据的所在地随时可以追溯，并记录谁访问了证据。\n\
  \n![Images](img/com-1.jpg)\n**A, B,** 和 **C** 是错误的。法律保留 (Legal hold) 是一项正式要求，用于在不对证据进行操作的情况下保持潜在证据可用可用。易失性\
  \ (Volatility) 指依赖电的电子系统（如内存内容），相对于磁盘存储。加密本身与取证数据没有直接关系。\n\n### 29\n![Images](img/com.jpg)\n\
  **A.** 招聘实践属于行政控制。\n\n![Images](img/com-1.jpg)\n**B, C,** 和 **D** 是错误的。这些中没有哪一个与招聘实践有关。最小权限原则仅授予用户完成任务所需的权限。技术控制包括防火墙规则集等保护措施。物理控制包括锁锁的门和边界围栏等保护措施。\n\
  \n### 30\n![Images](img/com.jpg)\n**B.** 通用访问卡 (CAC) 允许访问计算机和建筑等多个项目。\n\n![Images](img/com-1.jpg)\n\
  **A, C,** 和 **D** 是错误的。虽然列出的项目被用于启用资源访问，但通用访问卡是最佳答案。智能卡可用于系统认证，包括建筑认证。感应卡存储的信息比智能卡少，通常用于仅通过卡的\
  \ ID 进入建筑的房间或楼层，而不是使用嵌入智能卡的 `PKI` 证书等特定于用户的项目。硬件令牌显示周期性更改的 PIN 码，用户输入该码以访问系统（通常是\
  \ VPN）。\n\n### 31\n![Images](img/com.jpg)\n**C.** 椭圆曲线密码学 (ECC) 是基于椭圆曲线上的点的公钥加密。\n\
  \n![Images](img/com-1.jpg)\n**A, B,** 和 **D** 是错误的。RSA 是一种非对称加密标准。DES 是一种对称标准。`PKI`\
  \ 确实涉及公私和密钥对，但与椭圆曲线点没有特定的关系。\n\n### 32\n![Images](img/com.jpg)\n**A.** 证书吊销列表 (CRL)\
  \ 并不是立即发布的；它是手动或按计划发布的，因此可能存在一个很短的时间窗口，被吊销的证书在此期间仍可以使用。\n\n![Images](img/com-1.jpg)\n\
  **B, C,** 和 **D** 是错误的。`CRL` 在证书吊销时并不立即发布；它是按定期间隔发布的。一旦 `CRL` 发布，客户端就会引用它。网络带宽不影响\
  \ `CRL` 的发布时间。\n\n### 33\n![Images](img/com.jpg)\n**B.** 域名服务器查询工具 `nslookup` 用于测试\
