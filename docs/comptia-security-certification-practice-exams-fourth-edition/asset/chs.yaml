  \ sniffing)\n\n### [26]\n一名员工被怀疑与竞争对手分享公司秘密。在提取该员工的笔记本电脑后，取证分析人员注意到电脑上的许多个人照片已通过电子邮件发送给了第三方。当分析人员将硬盘上个人图像的哈希值与员工邮箱中找到的值进行比较时，哈希值并不匹配。该员工是如何分享公司机密的？\n\
  \nA. 数字签名 (Digital signatures)\nB. 隐写术 (Steganography)\nC. MP3Stego\nD. 捕鲸鱼攻击 (Whaling)\n\
  \n### [27]\n你今天上班时发现有人在建筑外翻她的提包。当你靠近门口时，那个人说：“我把通行证忘在家里了。我可以和你一起进去吗？”可能正在发生哪种攻击？\n\
  \nA. 尾随 (Tailgating)\nB. 翻垃圾桶 (Dumpster diving)\nC. 暴力破解 (Brute force)\nD. 捕鲸鱼攻击\
