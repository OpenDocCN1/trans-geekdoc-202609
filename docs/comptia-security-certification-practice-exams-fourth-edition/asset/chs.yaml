  \n#### 5. ![Images](img/com.jpg) **C.** 远程认证拨入用户服务（RADIUS）服务器是一个集中认证服务器，它代表用户设备等请求者，从\
  \ WAP 等 RADIUS 客户端以及网络交换机的 VPN 集中器接收认证请求。这防止了认证在网络交换机等边缘设备上发生，从而增加了安全性。RADIUS 认证流量通常通过\
  \ UDP 端口 1812 进行。\n\n#### 6. ![Images](img/com.jpg) **D.** 可扩展协议-传输层安全（EAP-TLS）是一种网络认证协议，它要求网络连接的双方（例如用户的智能手机和\
  \ WAP）都拥有 PKI 证书。\n\n\n\n\n\n![Images](img/com-1.jpg) `A`、`B` 和 `C` 是错误的。EAP – 通过安全隧道进行灵活认证（EAP-FAST）是一种网络身份验证协议，它使用共享密钥（不需要\
  \ PKI 证书）在两个端点之间建立安全的加密隧道，并在其中进行身份验证。IEEE `802.1x` 是基于端口的 NAC 标准。它要求设备在获得有线或无线网络访问权限之前进行身份验证。EAP\
  \ – 隧道传输层安全协议（EAP-TTLS）增强了 EAP-TLS，其身份验证是通过加密隧道进行的，而不是在没有安全隧道的情况下直接通过网络进行（EAP-TLS）。\n\
