  \n\n\n\n\n# 11\n![Images](img/com.jpg)\n**B** 和 **D.**。对电子邮件进行数字签名需要用户唯一的私钥，且只有他本人可以访问该私钥，这意味着他必须发送了消息，且无法否认这一事实（不可否认性）。得出这一结论的因素之一是用户私钥的保护程度。如果用户私钥只是简单地存储在硬盘上而没有密码，任何人都可以对消息进行数字签名，在这种情况下，可以使用用户访谈和视频监控来确定用户是否位于某处可以访问私钥的设备前。\n\
  \n![Images](img/com-1.jpg)\n**A** 和 **C** 是错误的。加密与验证消息发送者的身份是是分开的；加密通过扰乱数据来确保机密性。公钥不需要保护；这就是为什么它们被称为公钥。然而，与其数学上相关的对应的密钥（私钥）必须妥善保护。\n\
  \n# 12\n![Images](img/com.jpg)\n**C.** 手机用户识别模块（SIM）卡包含唯一数据，如序列号、用户的联系人、短信和其他相关的移动用户数据。这被用于全球移动通信系统（GSM）通信移动设备，并允许用户只要插入\
  \ SIM 卡，就可以使用任何 GSM 移动设备。\n\n![Images](img/com-1.jpg)\n**A, B,** 和 **D** 是错误的。IP\
  \ 地址和 MAC 地址，以及 USB 驱动器上的文档，都可以使用免费获取的工具轻易地伪造（欺骗）。\n\n# 13\n![Images](img/com.jpg)\n\
  **B** 和 **C.** 生成的文件哈希值（也称为校验和）对于其所基于的文件是唯一的。文件的任何更改都会使文件哈希值失效。这是在数字上确保分析的是文件正确版本的方法，并属于文档溯源的一部分，溯源旨在验证数据来源以及数据是如何被处理和存储的。被扣押硬盘上的数据必须保持完好。取证磁盘软件在单独设备上运行，或使用其自身的操作系统启动，并使用位流复制来复制整个硬盘的内容。绝不能在源硬盘上生成文件哈希；必须保持其不受扰动。\n\
