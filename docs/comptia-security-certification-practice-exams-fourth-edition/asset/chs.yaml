  \ 深度解析\n\n[1] ![Images](img/com.jpg)\n**B.** 基于网络的入侵防御系统（NIPS）分析网络流量模式，生成事件日志并向系统管理员发出告警，有时还会阻止潜在入侵。某些实现具有已知攻击模式的数据库，而另一些则可以注意到特定网络的异常流量。管理员随后可以采取措施停止攻击，例如丢弃攻击包。IPS\
  \ 和其他设备的日志和告警可以由 SIEM 系统进行集中收集、聚合、关联和报告。\n\n\n\n\n\n![Images](img/com-1.jpg)\n\n\
  A、C 和 D 都是错误的。基于网络的入侵检测系统（NIDS）可以检测网络异常，但它不能阻止它们；相反，它只是触发告警或通知管理员该问题。代理服务器代表用户检索互联网内容；它们完全不分析网络流量。包过滤防火墙只分析数据包头以确定是否应该允许或拒绝流量；它们的设计并不是为了停止正在进行的网络攻击，像网络入侵防御系统（NIPS）那样。\n\
  \n### 2 ![Images](img/com.jpg) D. 无线接入点以及无线路由器日志可以显示所有无线局域网活动。某些接入点可能需要你启用日志记录。在企业中，日志事件应该转发到中央日志主机，以便于检测可疑活动。\n\
  \n![Images](img/com-1.jpg) A、B 和 C 都是错误的。协议分析器捕获网络流量；问题是是否可以确定过去是否存在未经授权的 WLAN 使用。代理服务器与\
  \ WLAN 未经授权访问没有直接关系。性能监控衡量计算机系统的各种性能指标，与流量分析无关。\n\n### 3 ![Images](img/com.jpg)\
  \ B. 文件传输协议（FTP）访问日志列出了 FTP 服务器上的文件活动，包括文件的删除或重命名。\n\n![Images](img/com-1.jpg) A、C\
  \ 和 D 都是错误的。防火墙日志可以列出访问 FTP 站点的流量，但除非防火墙记录所有数据包负载（由于性能和空间原因，这非常罕见），否则它无法揭示是谁在 FTP\
  \ 站点删除或重命名了文件。FTP 下载和上传日志仅仅是：分别是谁从 FTP 服务器下载了文件，以及谁向 FTP 服务器上传了文件的记录。\n\n### 4 ![Images](img/com.jpg)\
  \ A. Windows 机器将审计数据写入事件查看器安全日志。集中式 SIEM 系统可以将许多设备的审计日志数据存储在单一存储库中，数据写入一次但可以被读取多次——写一次读多次（WORM）。监管合规性有时需要\
  \ WORM 功能。额外的优点是相似事件的去重，这会减少存储空间消耗并加快搜索速度。\n\n![Images](img/com-1.jpg) B、C 和 D 都是错误的。Windows\
  \ 机器没有审计或删除日志。应用程序日志列出与特定应用程序相关的事件，而不是审计数据。\n\n### 5 ![Images](img/com.jpg) C. 蜜罐主机未打补丁，因此容易受到攻击，因此将日志文件的唯一副本（默认设置）存储在蜜罐上，意味着攻击者可以删除日志内容以移除其所有恶意活动的痕迹。\n\
  \n![Images](img/com-1.jpg) A、B 和 D 都是错误的。蜜罐并不一定需要打补丁；缺乏应用补丁可以是很有用的，这样蜜罐就能成为恶意用户和恶意代码的攻击目标。如果你想跟踪恶意活动，蜜罐可以运行\
  \ Web 或 SMTP 服务。\n\n### 6 ![Images](img/com.jpg) A 和 C。基于行为的监控检测偏离常规的活动。需要一个基准来确定什么是正常。正如此，如果新攻击不符合正常使用情况，就可能被阻止。\n\
  \n![Images](img/com-1.jpg) B 和 D 都是错误的。通过基于行为的监控，可以检测偏离正常可接受活动。基于特征的监控使用已知攻击模式数据库与当前活动进行比较；基于行为的监控不这么这一点。\n\
  \n### 7 ![Images](img/com.jpg) B. 将已知攻击与当前活动进行比较被称为 `signature-based detection`（基于特征的检测）。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 都是错误的。通过基于行为的监控，可以检测偏离正常可接受活动。偏离正常被称为 `anomaly`（异常）；并没有所谓的基于异常的配置。基于\
  \ Web 的是一种虚构的检测方法。\n\n### 8 ![Images](img/com.jpg) D. Windows 机器包含 `Performance\
  \ Monitor`（性能监器），用于衡量软件或硬件哪个方面表现异常。\n\n![Images](img/com-1.jpg) A、B 和 C 都是错误的。题目说明病毒扫描程序已经是最新的，所以运行病毒扫描可能不是最优选择，因为现代病毒扫描程序会实时监控所有活动。系统还原点有时可以将计算机恢复到之前的（更快的）状态以解决此类类型的问题，但\
  \ Windows 服务器不支持系统还原。即使它们支持，那也不会是你采取的第一件事，因为它具有侵入性。\n\n### 9 ![Images](img/com.jpg)\
  \ B. 用户访问和权限审查会识别用户必须拥有的权利和权限与他们已获得的权限之间的对比。在这种情况下，审查将显示需要更改什么，以便用户仅拥有完成工作所需的权限。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 都是错误的。没有理由删除并重新创建账户；现有账户的权限和权利可以正确配置。服务器审计日志可以揭示用户何时以及如何获得这么多权限，但这无法帮助你解决问题；强密码也不行，因为密码与权限无关。\n\
  \n### 10 ![Images](img/com.jpg) B. 代理服务器可以跟踪详细的上网活动，包括访问站点、时间、用户账户名称等。这些数据的可靠性很大取决于所有网络设备的时间同步。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 都是错误的。虚拟专用网络（VPN）允许跨不可信网络连接私有局域网，但它们不跟踪上网活动。包过滤防火墙无法跟踪细节，尽管它们可以记录通过防火墙的通用流量。网络地址转换（NAT）网关允许只有私有\
  \ IP 地址的主机通过 NAT 网关公 IP 访问互联网资源；这消除了所有主机都需要公 IP 的需求。\n\n### 11 ![Images](img/com.jpg)\
  \ A 和 B。NIDS 监控并分析网络恶意包；如果发现，则触发告警或通知。\n\n![Images](img/com-1.jpg) C 和 D 都是错误的。NIPS\
  \ 具有丢弃恶意包的能力；NIDS 不具备。NIDS 对离开局域网的笔记本毫无保护作用；然而，HIDS 可以检测笔记本在受保护网络之外时的潜在攻击。\n\n###\
  \ 12 ![Images](img/com.jpg) C. HIDS 是基于主机的解决方案，因此必须安装在单个主机上。HIDS 的优点是针对性极强，并且始终监控每个主机。\n\
  \n![Images](img/com-1.jpg) A、B 和 D 都是错误的。HIDS 无法阻止可流量进入网络；这是 HIPS 的工作。因为 HIDS 驻留在主机上，当\
  \ HIDS 分析流量时（如果分析的话），加密的网络流量已不再是加密状态。HIDS 通常会分析各种主机日志文件。\n\n\n\n\n\n### 13\n![Images](img/com.jpg)\
  \ **B.** 防火墙可能配置为达到最大日志文件大小后覆盖最旧的日志条目。然而，在这种情况下，通常也有可配置的日志存档选项。\n\n![Images](img/com-1.jpg)\
  \ **A, **C,** 和 **D** 都是错误的。访问防火墙日志绝对需要管理员权限，如果你没有此特权，将无法看到任何条目。只要你配置了（日志归档），大多数防火墙都可以保留日志。未修补防火墙（软件或固件）不会导致无法访问归档日志。\n\
  \n### 14\n![Images](img/com.jpg) **D.** 与许多微软管理工具一样，性能监视器（Performance Monitor）可以在本地运行，但可以显示从远程主机添加的数据（性能计数器）。\n\
  \n![Images](img/com-1.jpg) **A, **B,** 和 **C** 都是错误的。在每个主机上运行性能监视器或使用远程桌面协议登录每个主机并不是高效的解决方案，因为监控可以在单个网络主机执行。你无法通过事件查看器日志数据监控系统性能指标，至少不容易这样做。\n\
  \n### 15\n![Images](img/com.jpg) **C.** 审计日志与普通活动日志不同，因为它们记录了管理配置活动，例如修改防火墙规则。\n\
  \n![Images](img/com-1.jpg) **A, **B,** 和 **D** 是错误的。在 Windows 机器上，安全日志显示安全事件，包括\
  \ Windows 审计事件。防火墙日志显示正常的防火墙使用活动，而不是管理配置活动。Windows 事件查看器日志不会显示任何与防火墙设备配置的内容。\n\n\
  ### 16\n![Images](img/com.jpg) **B.** 如果计算机在用户不知情的情况下访问网站并下载 EXE 文件，那么该机器极可能正受攻击者的控制。这种活动通常由于恶意软件尝试下载额外的恶意代码导致。\n\
  \n![Images](img/com-1.jpg) **A, **C,** 和 **D** 是错误的。Windows Update 不使用列出的 URL。密码破解程序尝试猜测密码；它们不会在未经同意的情况下下载\
  \ EXE 文件。由于防火墙通常阻止从互联网发起的连接，因此通过 RDP 控制是不可能的。\n\n### 17\n![Images](img/com.jpg)\
  \ **A.** 误报（False positives）报告存在问题但实际上并没有，例如在本例中，销售人员正在执行合法活动。仍然应该检查告报，以确保攻击与此新的网络活动同时发生。\n\
  \n![Images](img/com-1.jpg) **B, **C,** 和 **D** 是错误的。在存在问题时不报告问题被称为称为漏报（false negative）。真阳（true\
  \ positive）描述了恶意活动正确触发警报的情况，而真阴（true negative）描述了由于没有恶意活动而未触发警报的场景。\n\n### 18\n\
  ![Images](img/com.jpg) **A, **B,** 和 **D.** 日志文件应该加密并存储在安全的集中主机上，这样即使某台机器被破解，仍然有日志副本。文件哈值确保文件没有以任何方式被篡改；修改的文件会生成不同的哈值。\n\
  \n![Images](img/com-1.jpg) **C** 是错误的。Windows Update 不会防止日志文件的篡改。\n\n### 19\n![Images](img/com.jpg)\
  \ **D.** NIDS（网络入侵检测系统）监控网络流量中的可疑活动。\n\n![Images](img/com-1.jpg) **A, **B,** 和 **D**\
  \ 都是错误的。NIDS 没有安装在主机上；HIDS（主机入侵检测系统）安装在主机上。NIDS 监控网络上的流量。`192.168.1.1` 是私有 IP 地址。\n\
  \n### 20\n![Images](img/com.jpg) **D.** NIDS 没有安装在主机上；HIDS 安装在主机上。\n\n![Images](img/com-1.jpg)\
  \ **A, **B,** 和 **C** 都是错误的。查看所有的客户端浏览历史需要更长时间。\n\n### 21\n![Images](img/com.jpg)\
  \ **D.** 数据包嗅探器捕获但不采取行动。\n\n![Images](img/com-1.jpg) **A, **B,** 和 **C** 都是错误的。混杂模式（Promiscuous\
  \ mode）启用了网卡（NIC）。\n\n### 22\n![Images](img/com.jpg) **C.** NAT 路由器日志将包含这些信息。\n\n\
