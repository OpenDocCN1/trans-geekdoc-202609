  \ Java 语言中，静态 `int` 最大值可以是 `2³¹–1`。整数值检查不当会导致不可预料的应用程序行为。缓冲区溢出是由于向特定内存边界写入数据导致的，可能是输入验证不当的结果。\n\
  \n### [12] A. 允许应用程序是在公司计算机系统中运行的应用程序。这些程序列在适用于计算机的策略中，用于控制软件执行，防止潜在的恶意软件运行。\n\n\
  \n\n\n\n![Images](img/com-1.jpg)\nB、C 和 D 是错误的。被屏蔽的应用程序被明确列出不允许在公司计算机上运行。模糊测试（Fuzzing）通过向应用程序提供大量输入数据（甚至是无效数据）来观察其行为；其核心思想是确保应用程序在处理输入和错误时是稳定且安全的。混淆（Obfuscation）则用于增加阅读或理解编程代码或敏感数据等内容的难度。\n\
  \n### 13\n![Images](img/com.jpg)\nB. 目录遍历（也称为命令注入）发生在攻击者访问 Web 服务器目录时，这些目录本受到限制以防止执行在\
  \ Web 服务器操作系统中找到的命令。\n\n![Images](img/com-1.jpg)\nA、C 和 D 是错误的。整数溢出（Integer overflow）是一种攻击形式，因为程序在执行数学函数时产生了意料之外的响应，且结果大于程序员分配的内存空间，从而带来安全风险。在恶意插件中，你的系统会下载一个浏览器使用的软件，该软件会减慢系统或利用系统漏洞。头部操纵（Header\
  \ manipulation）发生在攻击者修改数据包中的头部数据，以操纵应用程序处理信息的方式。\n\n### 14\n![Images](img/com.jpg)\n\
  A. 重放攻击（Replay attacks）涉及攻击者首先捕感兴趣的数据包，可能对包中的内容进行修改，然后将其发送回网络。这种攻击可以用于重新发送授权的访问流量，以合法用户的身份访问敏感资源。\n\
  \n![Images](img/com-1.jpg)\nB、C 和 D 是错误的。在驱动程序操纵方面，垫片（Shimming）是一种攻击，其中某个软件充当驱动程序，拦截并修改进出硬件的命令。重构攻击（Refactoring\
  \ attack）涉及在保持外部行为的同时更改驱动程序的内部代码，使其看起来运行正常。哈希值传递攻击（Pass-the-hash attack）涉及拦截合法用户的密码哈希值，并使用它作为该用户对其他资源进行验证。\n\
  \n### 15\n![Images](img/com.jpg)\nA. 跨站请求伪造（Cross-site request forgeries）发生在攻击者欺骗用户在其当前已认证的网站上执行非想要的操作时。\n\
  \n![Images](img/com-1.jpg)\nB、C 和 D 是错误的。跨站脚本（Cross-site scripting）发生在攻击者将客户端脚本插入到其他用户将浏览的网页中时。重放攻击发生在合法的网络流量被恶意重复时。哈希值传递攻击涉及拦截合法用户的哈希值，并使用它作为该用户对其他资源进行验证。\n\
  \n### 16\n![Images](img/com.jpg)\nA 和 B。软件开发者必须使用输入验证作为一种安全编码方法，以确保用户提供的数据是预期且有效的。输入验证应在服务器端进行，以防验证代码在客户端被暴露或可能被篡改。为了缓解\
  \ API 攻击，可以使用 HTTPS 对到 API 的连接进行身份验证和加密。\n\n![Images](img/com-1.jpg)\nC 和 D 是错误的。弹性（Elasticity）是一种计算特性，能够快速配置和销毁计算资源，通常使用自服务\
  \ Web 门户。自动伸缩（Autoscaling）在云计算中很常见，它允许应用程序在需求增加时配置更多底层虚拟机（向外扩展），并在需求减少时移除虚拟机（向内收）。\n\
  \n### 17\n![Images](img/com.jpg)\nD. 代码签名证书用于脚本编写人员和软件开发者对脚本或软件文件进行数字签名。信任证书颁发者的设备将信任由颁发的代码签名证书签名的文件。软件开发者必须固化系统，以确保软件编译器和证书不被破坏。编译器用于将编程语言代码转换为机器可读的二进制语言。\n\
