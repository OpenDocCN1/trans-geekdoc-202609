  # 第 15 章\n\n## 应用程序攻击与安全\n\n## 认证目标\n\n- 15.01 常见的 Web 应用攻击\n- 15.02 安全编码\n- 15.03\
  \ 持续集成与交付\n\n## 题目\n\n应用程序（包括网站）在开发的所有阶段都必须考虑安全性。必须监控应用程序的使用情况，以识别性能和安全问题。\n\n安全编码是一种编程概念，强调在创建或修改代码时始终考虑安全性。这有助于缓解跨站脚本、注入攻击等常见攻击。开放\
  \ Web 应用程序安全项目（`OWASP`）为 Web 应用程序的安全提供了指导。\n\n应用程序代码测试可以自动化，以加速更新的安全软件解决方案的持续交付。代码测试还确保了遵循了安全编码准则。\n\
  \n**1.** 漏洞利用连接到特定的 `TCP` 端口并向攻击者提供管理员命令提示符。这是哪种攻击？\n\nA. 僵尸网络\nB. 木马\nC. 权限提升\n\
  D. 逻辑炸弹\n\n**2.** 下列哪项最能描述缓冲区溢出攻击？\n\nA. 通过网页注入数据库代码\nB. 使用字典文件破解密码\nC. 向应用程序发送过多的数据，允许攻击者运行任意代码\n\
  D. 修改数据包的源地址\n\n**3.** 你正在分析发往 Web 服务器的传输流量，注意到有人使用用户名 Bob 和密码 `‘pass’ or 1=1--`\
  \ 登录。下列哪项描述了正在发生的情况？\n\nA. XML 注入\nB. SQL 注入\nC. LDAP 注入\nD. 拒绝服务\n\n**4.** 下列哪项最可能缓解缓冲区溢出攻击？\n\
  \nA. 静态 `ARP` 条目\nB. 防病毒软件\nC. `ACL`\nD. 补丁\n\n**5.** 下列哪种攻击涉及向网页中插入客户端脚本？\n\nA.\
  \ XSS\nB. 注水\nC. ARP 污染\nD. SQL 注入\n\n**6.** 你的经理读了关于 SQL 注入的内容，并想对于内部开发的最好的保护措施是什么。你会建议？\n\
  \nA. 补丁\nB. 防病毒\nC. 输入验证\nD. 防火墙\n\n**7.** 硬盘上的哪种文件存储 Web 应用偏好和会话数据？\n\nA. Cookie\n\
  B. Hosts\nC. LMHOSTS\nD. /etc/shadow\n\n**8.** 哪种漏洞是由写入超出边界的数据引起的？\n\nA. 指针解引用\n\
  B. 整数溢出\nC. 缓冲区溢出\nD. 内存泄漏\n\n**9.** 哪种应用程序测试技术最可能发现不当处理？\n\nA. 模糊测试 (Fuzzing)\n\
  B. 负载\nC. 渗透测试\nD. 漏洞扫描\n\n**10.** 哪种编程问题源于线程没有按照可预测的顺序执行？\n\nA. 模糊测试\nB. 蓝屏\nC.\
  \ 多核 CPU 节流\nD. 竞态条件\n\n**11.** 恶意软件替换了控制程序按需要使用的库。什么名称描述了这种安全问题？\n\nA. DLL 注入\n\
  B. 指针解引用\nC. 整数溢出\nD. 缓冲区溢出\n\n**12.** 哪个术语描述允许在公司计算机运行的应用程序？\n\nA. 应用程序许可列表\nB.\
