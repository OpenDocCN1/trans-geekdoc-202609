  \ `CA` 发行。\n\n### 11 \n![Images](img/com.jpg) `A.` 过期证书已无法使用。必须为用户颁发新证书。\n\n###\
  \ 12 \n![Images](img/com.jpg) `D.` 如果用户的设备配置了内网服务器证书颁发机构的正确受信任证书，则用户设备将信任该机构颁发的证书。\n\
  \n\n\n\n\n![Images](img/com-1.jpg)\n`A`、`B` 和 `C` 是错误的。从 `HTTPS` 切换到 `HTTP` 并不会维持安全性；而是会降低安全性。服务器私钥必须仅由服务器持有。`HTTPS`\
  \ 已经使用了 `TCP` 端口 `443`，因此这解决不了问题。\n\n### 13\n![Images](img/com.jpg)\n`D.` 双向认证要求加密连接的双方相互对方进行身份验证。通常情况下，`HTTPS`\
  \ 网站为任何有权限访问该网站的用户提供加密连接。为了进一步增强安全性，可以要求连接设备安装并信任一个受信任的证书，这使得每一方都能验证对方的身份。\n\n![Images](img/com-1.jpg)\n\
  `A`、`B` 和 `C` 是错误的。所列选项并不如客户端侧 PKI 证书安全。`IP` 地址和 `MAC` 地址比证书更容易被伪造，而且要求是限制访问网站的工作站，而不是用户。\n\
  \n### 14\n![Images](img/com.jpg)\n`C.` 根据所使用的工具，为电子商务网站获取公公信任的服务器证书，首先是生成一对公钥/私钥，填写如公司名称和\
  \ Web 服务器 URL 等信息，并将公钥提供给 `CA`；这就是证书签名请求 (`CSR`)。\n\n![Images](img/com-1.jpg)\n\
  `A`、`B` 和 `D` 是错误的。如果该网站是新的，则 Web 服务器证书尚不存在。大多数 Web 服务器已经启用了 `TLS` 支持，但即使该 Web 服务器没有启用，如果在连接请求期间没有可用的证书，启用它也无法起到任何作用。在安装服务器证书之前，无法配置\
  \ Web 服务器使用端口 `443` 运行 `HTTPS` 服务。\n\n### 15\n![Images](img/com.jpg)\n`C.` `CSR`\
  \ 中的通用名称（Common Name）必须与组织的 URL 匹配，在本例中，即用于连接 `https://www.corp.com` 的 `HTTPS` 连接的\
  \ URL。如果证书中的通用名称与用户连接的 URL 不匹配，他们将收到证书与网站不匹配的警告。\n\n![Images](img/com-1.jpg)\n`A`、`B`\
  \ 和 `D` 是错误的。所列项目没有正确的，且任何一个都不会导致 `CSR` 或证书颁发或使用出现问题。\n\n### 16\n![Images](img/com.jpg)\n\
  `A.` 在大型企业中，可以为城市、部门、子公司等部署中间 `CA`。中间 `CA` 技术人员随后便拥有对 `PKI` 层次结构该部分的控制权。根 `CA` 应该离线以增强安全性；根\
  \ `CA` 被破解意味着层次结构中的所有证书都被破解。中间 `CA` 被破解意味着只有其颁发的证书被破解。\n\n![Images](img/com-1.jpg)\n\
  `B`、`C` 和 `D` 是错误的。在每个城市都拥有高级 `IT` 人员的大型应该为每个城市部署中间 `CA`。为每个城市使用多个根 `CA` 意味着用户设备必须信任多个\
  \ `CA`，这比实际需要了更多的配置工作。\n\n### 17\n![Images](img/com.jpg)\n`A.` 启用 `HTTPS` 的网站需要一个包含公钥和私钥对的\
  \ `PKI` 证书。简单来说，当客户端连接到服务器并协商会话细节时，服务器将其公钥发送给客户端。客户端生成一个唯一的会话密钥，用服务器的公钥加密并发送回服务器。服务器随后使用其私钥解密消息并显示会话密钥。会话密钥（或共享密钥）随后用于整个会话期间的传输。\n\
  \n![Images](img/com-1.jpg)\n`B`、`C` 和 `D` 是错误的。所列的用于 `HTTPS` 的密钥变体是不完整的。这是因为它们没有描述\
  \ `TLS` 握手期间使用的密钥的完整列表（握手使用了公钥、私钥和会话密钥）。\n\n### 18\n![Images](img/com.jpg)\n`A.`\
  \ 私钥用于创建数字签名。在这个示例中，`CA` 签名允许信任链，这意味着信任 `CA` 的客户端将信任由该 `CA` 颁发的任何证书。\n\n![Images](img/com-1.jpg)\n\
  `B`、`C` 和 `D` 是错误的。`CRL` 是一个已撤销（而非过期）的证书序列号列表，原因如用户离开组织，或丢失/被盗的包含证书的用户手机。在线证书状态协议\
  \ (`OCSP`) 允许验证单个证书的有效性，而不是整个过期证书列表。\n\n### 19\n![Images](img/com.jpg)\n`A` 和 `B`\
  \ 是错误的。`CA` 对证书进行数字签名以建立信任链；它们也可以撤销证书，使它们无法使用。\n\n![Images](img/com-1.jpg)\n`C`\
  \ 和 `D` 是错误的。`CA` 除了颁发证书外不涉及私钥。\n\n### 20\n![Images](img/com.jpg)\n`C` 和 `E` 是错误的。有多种方法存储\
  \ `PKI` 证书。个人信息交换格式 (`PFX`) 和 `P12` 文件（相同数据不同扩展）通常用于存储私钥。差异编码规则 (`DER`) 文件格式包含二进制形式的\
  \ `PKI` 证书，而隐私增强 (`PEM`) 文件格式包含 Base64 编码文本。\n\n![Images](img/com-1.jpg)\n`A`、`B`、`D`\
  \ 和 `F` 是错误的。有许多方法存储证书信息。`P7B` 格式是 `PEM` 的变体，用于存储中间证书数据；`P7B` 和 `PEM` 文件不包含私钥。\n\
  \n### 21\n![Images](img/com.jpg)\n`C.` 固定（Pinning）是一种用于将主机与其公钥关联的技术。这可以通过客户端应用程序（包括浏览器）保留主机公钥的副本或哈希值来实现。客户端在启动服务器连接时进行此检查。\n\
  \n![Images](img/com-1.jpg)\n`A`、`B` 和 `D` 是错误的。`CRL` 提供过期的证书序列号以确保过期证书不受信任。`OCSP`\
  \ 允许验证单个证书的有效性，而不是整个过期证书列表。完全限定域名 (`FQDNs`) 是友好的名称，如 `http://www.mducation.ca/`\
  \ (www.mducation.ca/)，它们映射到关联的 `IP` 地址。\n\n### 22\n![Images](img/com.jpg)\n`C.`\
  \ 主体备名称 (`SAN`) 证书允许你使用一个证书保护具有不同名称主机，例如 `www.corp.com` (https://www.corp.com) 和\
  \ `info.corp.com` (https://info.corp.com)。\n\n![Images](img/com-1.jpg)\n`A`、`B`\
  \ 和 `D` 是错误的。获取、安装和管理两个证书比使用单个需要更多精力。`CRL` 提供过期的证书序列号以确保过期证书不受信任，与保护网站的 DNS 名称无关。`IPsec`\
  \ 是一种网络安全协议，可以配置为对网络流量进行身份验证和加密，包括建立 `VPN` 隧道。`IPsec` 可以使用多种方法安全连接，包括 `PSKs` 和 `PKI`\
  \ 安全证书。\n\n\n\n\n\n-   **23.** ![Images](img/com.jpg) **A** 和 **B.** 证书颁发机构对 CSR\
  \ 执行不同程度的验证。域名验证证书很容易获取。`CAs` 仅要求你证明对 DNS 域名的所有权，例如通过在你的域名中创建带有 CA 指定值的值的 DNS 记录，或者通过接收发送给\
  \ DNS 域名所有者的电子邮件。在颁发扩展型验证证书之前，`CAs` 会执行更多任务以确保机构的真实性，例如验证组织详情、业务是否注册等。这两种类型的证书都提供\
  \ HTTPS 安全性。\n\n    ![Images](img/com-1.jpg) **C** 和 **D** 是错误的。`CRL` 提供已过期证书的序列号，以确保过期证书不被信任。`OCSP`\
  \ 允许验证单个证书的有效性，而不是验证整个所有过期证书列表。\n\n-   **24.** ![Images](img/com.jpg) **B.** 为了减少直接发送到\
  \ `CAs` 的查询数量，证书持有者向 `CA` 发起 `OCSP` 封送，并将响应进行缓存后提供给客户端查询。\n\n    ![Images](img/com-1.jpg)\
  \ **A, C,** 和 **D** 是错误的。`CSR` 由想要颁发证书的主体生成，它包含了有关请求者的信息，如公司名称、用户联系信息、网站 URL 和用户电子邮件地址，以及公钥。`CRL`\
  \ 提供已过期证书的序列号，以确保过期证书不被信任。`Pinning` 是一种用于将主机与其公钥关联的技术。这可以通过客户端应用程序实现，包括保留主机公钥副本（或哈希值）的\
  \ Web 浏览器。在建立服务器连接时，客户端应用会进行此检查。\n\n-   **25.** ![Images](img/com.jpg) **D.** `PKI`\
  \ 信任链（也称为证书链）基于根 CA 或中间 `CA` 写入已颁发证书的数字签名。例如，如果用户设备信任 `RootCA1`，那么该用户设备就信任由 `RootCA1`\
  \ 直接或间接颁发的所有证书。\n\n    ![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。`Key escrow`\
  \ 将私钥或密钥存放在信任的第三方手中以便保管。为了减少直接发送到 `CAs` 的查询数量，证书持有者向 `CA` 发起 `OCSP` 封送，并将响应进行缓存后提供给客户端查询。`Pinning`\
  \ 是一种用于将主机与其公钥关联的技术。\n\n-   **26.** ![Images](img/com.jpg) **D.** 通配符证书与 `SAN` 证书相似，因为一个证书可以用于保护多个\
  \ DNS 域名，例如 [www.corp.com](http://www.corp.com) 和 [info.corp.com](http://info.corp.com)。\n\
  \n    ![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。与使用单个通符证书相比，获取和管理多个证书需要更多的管理工作。`RAs`\
  \ 接收 `CSRs` 并可以颁发证书，或者在 `CA` 独立的情况下委托 `CA` 实际颁发证书。通配符证书与 `SAN` 证书的主要区别在于，通配符证书（例如针对\
  \ `*.corp.com`）允许 [corp.com](http://corp.com) 下未来的子域名受到保护。`SAN` 证书使用硬编码的 DNS 域名。\n\
  \n-   **27.** ![Images](img/com.jpg) **C.** 如果设备必须信任由 `RootCert` 颁发的 Web 服务器证书进行\
  \ HTTPS 连接，则设备必须安装 `RootCert` 的信任根证书。\n\n    ![Images](img/com-1.jpg) **A, B,**\
  \ 和 **D** 是错误的。数字签名或加密邮件消息需要用户证书。没有迹显示 `RootCert` `CA` 已过期。\n\n-   **28.** ![Images](img/com.jpg)\
  \ **A.** `RootCert` 旁边带有 X 的圆表示信任链已；此设备不信任 `RootCert`。在设备上安装 `RootCert` `CA` 的信任根证书将解决这个问题。\n\
  \n    ![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。带有 X 的圆位于 `RootCert` 旁边，而不是\
  \ `ClientCert`；不受信任的是 `RootCert`。带有 X 的圆并不表示 `CA` 离线，也不反映该 `CA` 是否启用了证书封送。\n\n-\
  \   **29.** ![Images](img/com.jpg) **A** 和 **D.** 因为证书中存在私钥，可以解密加密电子邮件。\n\n    ![Images](img/com-1.jpg)\
  \ **B** 和 **C** 是错误的。发送加密消息意味着发送者必须访问接收者的密钥。数字签名需要私钥。\n\n-   **30.** ![Images](img/com.jpg)\
  \ **B.** `CRL` 提供已过期证书的序列号，以确保过期证书不被信任。`OCSP` 允许验证单个证书的有效性，而不是验证整个所有过期证书列表。\n\n\
  \    ![Images](img/com-1.jpg) **A** 和 **C** 是错误的。为了减少直接发送到 `CAs` 的查询数量，证书持有者向 `CA`\
  \ 发起 `OCSP` 封送，并将响应进行缓存后提供给客户端查询。`RAs` 接收 `CSRs` 并可以颁发证书，或者在 `CA` 独立的情况下委托 `CA`\
  \ 实际颁发证书。\n\n-   **31.** ![Images](img/com.jpg) **A.** `CAs` 可以 `SHA 256` 位对其颁发的证书进行数字签名，从而建立信任链。\n\
  \n    ![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。列出的算法是加密或密钥交换算法，并非专门用于数字签名。`AES`\
  \ 是一种对称分组密码。分组密码加密整个数据块，而不是单个字节。旧的 `DES` 由于其密钥长度短（64 位）现在已少用；代之的是 `AES 128` 或 `256`。密钥交换是指两个端点通过网络通信以生成唯一的会话密钥。`Diffie-Hellman`\
  \ 是一种用于网络安全协议（如互联网密钥交换 `IKE`）的密钥交换算法。\n\n-   **32.** ![Images](img/com.jpg) **C.**\
  \ 证书中的通用名称属性标识主体，例如电子邮件地址或网站的完全限定域名（FQDN）。示例例如 `CN=user1@corp.com。\n\n    ![Images](img/com-1.jpg)\
  \ **A, B,** 和 **D** 是错误的。域组件（DC）用于进一步识别网络目录服务层次结构，例如 `DC=corp,DC=com`。`Component\
  \ name` 和 `DNS component` 不是有效的证书属性。\n\n\n\n\n\n安全违露可以通过跨网络远程实施，也可以在现场进行物理实施。物理安全措施（如屏障、锁和安保人员）的影响不应低估。\n\
  \n如今许多安全违露是由于物理安全不善导致的，包括存储在未加密存储介质上的敏感数据，以及对报废计算机设备的处置不当。\n\n### 1. 哪些措施可以保护交换机和路由器免受物理安全漏洞的影响？（选择两个）\n\
  A. 使用线锁。\nB. 使用 `SSH` 代替 `Telnet`。\nC. 设置强力控制端口密码。\nD. 禁用未使用的端口。\n\n### 2. 什么可以限制电磁射频的数据泄露？\n\
  A. 法拉第笼\nB. 静电手环\nC. ESD 静电垫\nD. ESD 静电鞋\n\n### 3. 物理安全团队最常用的哪些方法可以验证某人是否有权访问设施？（选择两个）\n\
  A. 员工 ID 卡\nB. 用户名和密码\nC. 访问列表\nD. 卡\n\n### 4. 在检查设施入口点时，你决定将现有门更换为在停电期间保持锁定的门。哪个术语最能描述这一特性？\n\
  A. 故障锁（Fail-secure）\nB. 容错（Fault-tolerant）\nC. 故障安全（Fail-safe）\nD. UPS\n\n### 5.\
  \ 数据中心 IT 主监需要能够在设施物理安全违露发生后对其进行分析。以下哪些方案提供了最佳解决方案？（选择两个）\nA. 运动传感器日志\nB. 激光安全系统\n\
  C. 访问控制门厅\nD. 软件视频监控系统\n\n### 6. 以下哪些物理访问控制方法通常不会识别谁进入了安全区域？（选择两个）\nA. 访问控制门厅\n\
  B. 硬件锁\nC. 指纹扫描\nD. 带有 PIN 码的智能卡\n\n### 7. 你的公司搬到了新地点，那里正在建造一间机房。机房目前有一套用于防火灾的水喷淋系统。关于灭火，你应该建议什么？\n\
  A. 保留现有的水喷淋系统。\nB. 购买烟雾检测、无水灭火系统。\nC. 保留现有的水喷淋系统并安装架空地板。\nD. 在机房内放置灭火器。\n\n### 8.\
  \ 数据中心管理员使用热成像来识别大型数据中心的热点。然后，她安排了机架式服务器列，使冷风引导服务器风扇进风口，并将热气排出建筑。以下哪个术语最能定义这种场景？\n\
  A. HVAC\nB. 形式因子\nC. 冷、热通道道\nD. 数据中心呼吸\n\n### 9. 哪种访问控制方法会电子记录进入设施的情况？\nA. 图片 ID\
  \ 卡\nB. 安保人员和记录本\nC. `IPSec`\nD. 接触卡\n\n### 10. 你正在就新设施向客户提供咨询。建筑的访问必须限制为知道访问代码的人。你可能会建议什么？\n\
  A. 密码锁\nB. 弹锁\nC. 将代码存储在保险箱中\nD. 生物识别认证\n\n### 11. 在过去一个月里，你在机房中添加了新的机架式服务器，服务器开始莫名其妙地自动关闭。服务器正常重启，但最终又会关闭。服务器已安装完整补丁，病毒扫描程序也已是最新。以下哪项是这些故障最可能的原因？\n\
  A. 机房温度太高。\nB. 机房温度太低。\nC. 服务器感染了病毒。\nD. 服务器操作系统存在缺陷。\n\n### 12. 停车场内应该做些什么以确保安全？\n\
  A. 安装屏障。\nB. 安装适当的照明。\nC. 安装出口指示牌。\nD. 安装急救箱。\n\n### 13. 哪种威胁可以通过粉碎文档来缓解？\nA. Rootkit（根内核程序）\n\
  B. 间谍软件\nC. 肩窥\nD. 物理\n\n### 14. 你正在为自定义移动设备编写代码，出于安全考虑，你想防止篡改以及他人读取代码。哪种技术可以实现这一点？\n\
  A. 混淆\nB. 加密\nC. 哈希\nD. 物理隔离\n\n### 15. 以下哪些项代表了有效的存储介质销毁方法？（选择两个）\nA. 物理隔离\nB.\
  \ 粉碎\nC. 燃烧\nD. 纸浆化\n\n### 16. 你负责为分支机构的员工采购新的笔记本电脑。你应该做什么来防止从旧笔记本电脑使用的废弃介质中检索敏感数据？（选择两个）\n\
