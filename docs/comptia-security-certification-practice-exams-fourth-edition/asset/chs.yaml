  \n### [8] C. 缓冲区溢出是由于向超出预期内存边界的数据写入数据导致的，这会导致程序崩溃或允许任意代码执行。\n\nA、B 和 D 都是错误的。攻击者可以使用解引用指针来触发开发者未预到的程序状况，例如呈现可能导致程序崩溃的错误状况。编程不当还可能导致指向空值的内存指针被操纵，从而引用本应不可访问的内存数据。整数数值有特定的接受值范围——例如，在\
  \ Java 语言中，静态 `int` 变量的最大值可以是 `2³¹–1`。整数值检查不当会导致不可预料的应用程序行为。内存泄漏由于应用程序未完全释放程序启动时分配的所有内存导致的。\n\
  \n### [9] A. 模糊测试 (Fuzzing) 向应用程序提供大量的输入数据（甚至是无效数据），用以观察其行为；其理念是确保应用程序的稳定安全。\n\n\
  B、C 和 D 都是错误的。“过载”（Overloading）不是描述输入处理测试的行业术语；模糊测试才是。渗透测试积极寻找漏洞；虽然这个答案在某种程度上正确，但模糊测试更具体。漏洞扫描被动地尝试识别弱点，而不主动尝试利用它们。虽然它们可能具有识别基础输入处理的能力，但它们没有模糊测试那样全面，模糊测试可以发现更多问题。\n\
  \n### [10] D. 在竞态条件中，当多个线程执行代码时，依赖性事件的时间顺序是不可预测的，结果导致不同的线程以非意图的方式运行。例如，一段代码可能会检查变量的值并在稍后采取行动，而该变量的值在此期间可能会发生变化。\n\
  \nA、B 和 C 都是错误的。模糊测试是一种应用程序测试技术，通过向应用程序提供大量的意外数据。蓝屏描述 Windows 停止错误，通常归因于硬件或驱动程序问题。CPU\
  \ 节流（节 throttling）用于减慢处理，从而减少功耗和发热；它与所述问题无关。\n\n### [11] A. 动态链接库 (DLL) 注入将代码插入\
