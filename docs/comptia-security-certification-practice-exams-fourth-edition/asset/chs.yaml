  A. 统一威胁管理\nB. 专有\nC. 开源\nD. 下一代\n\n**12.** 你需要一种快速、安全且可靠的多宿网络边界解决方案，用于防止特定类型的网络流量进入你的公司网络。你应该部署哪种解决方案？\n\
  A. 软件防火墙\nB. 虚拟防火墙\nC. 主机防火墙\nD. 硬件防火墙\n\n**13.** 由于网络基础设施的变化，你负责修改防火墙以允许和阻止网络流量。你将配置防火墙的哪个方面？\n\
  A. 文件完整性监控\nB. 端口镜像\nC. 服务质量\nD. 访问控制列表\n\n**14.** `SSL/TLS` 直接适用于以下哪些项？（选择两个。）\n\
  A. 静态数据\nB. 处理中数据\nC. 运动数据\nD. 传输中数据\n\n\n\n\n\n### [15] 目前在你的组织中，本地用户对应用程序的访问根据其安全许可和所使用的移动设备类型进行限制。你想将此配置扩展到云端。应该启用哪种安全服务？\n\
  \nA. 统一威胁管理\nB. 云访问安全代理 (CASB)\nC. DDoS 缓解\nD. Web 应用程序防火墙 (WAF)\n\n### [16] 哪种加密操作作为产生唯一值的单向函数？\n\
  \nA. 哈希处理 (Hashing)\nB. 加密\nC. 数据掩码\nD. 令牌化 (Tokenization)\n\n### [17] 为了吸引并监控恶意用户活动，你需要部署一个带有看似漏洞的虚假数据的服务器。你应该配置什么？\n\
