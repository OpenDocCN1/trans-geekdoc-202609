  \ B\n34. A\n35. D\n36. C\n37. A\n38. C\n39. A\n40. D\n\n## 深度解析\n\n**1.** ![Images](img/com.jpg)\
  \ **C 和 D.** 在发生勒索软件感染的情况下，可以使用系统镜像将系统恢复到运行状态。频繁的数据备份可以帮助恢复勒索软件爆发前的数据。\n\n\n\n\n\
  \n![Images](img/com-1.jpg) **A** 和 **B** 是错误的。它们都不是防勒索软件的技术。互联网控制消息协议（`ICMP`）拦截规则停止由\
  \ `ping` 和 `tracert` 等工具产生的流量。电子邮件通知有助于技术人员快速响应事件。\n\n### 2\n![Images](img/com.jpg)\
  \ **D.** 钓鱼诈骗试图说服受害者泄露敏感信息，例如网上银行凭据。\n\n![Images](img/com-1.jpg) **A, B,** 和 **C**\
  \ 是错误的。身份冒充（Impersonation）是指攻击者在电话或通信软件上假装成他人，试图访问系统。尾随（Tailgating）是指紧跟在他人身后，趁对方开门溜进去的行为。欺骗信息（Hoaxes）是旨在误骗人们相信其为真实的虚假场景。\n\
  \n### 3\n![Images](img/com.jpg) **C.** 跨站脚本攻击是由于受害者使用了被恶意用户注入了恶意代码的网站导致的。受害者的浏览器随后会执行该代码。这可能是由于\
  \ Web 表单字段输入验证无效导致的。\n\n![Images](img/com-1.jpg) **A, B,** 和 **D** 是错误的。缓冲区溢出是由于数据被写入预设内存边界之外导致的，可能导致系统崩溃或攻击者获得高权限。跨站请求伪造（CSRF）是由于攻击者破坏用户系统，导致攻击者在\
  \ Web 应用程序中通过身份验证，并在未经实际用户同意的情况下使用该 Web 应用身份验证。攻击者随后使用这些会话凭据执行恶意活动。拒绝服务（`DoS`）攻击使\
  \ IT 系统无法用于合法目的。例如，`DoS` 攻击可以故意导致服务器。\n\n### 4\n![Images](img/com.jpg) **C.** 恶性孪生（Evil\
  \ twin）是攻击者配置的额外 Wi-Fi 网络，伪装成现有的合法 Wi-Fi 网络，希望毫无防备的用户连接到它。\n\n![Images](img/com-1.jpg)\
  \ **A, B,** 和 **D** 是错误的。这些没有一个与 Wi-Fi 热点直接相关。MAC 欺骗伪造了数据包中的 48 位硬件地址，IP 欺骗伪造了 IP\
  \ 头部中的 IP 地址，而军事化区（`SCREENED SUBNET`）用于放置应该能从互联网直接访问的服务。\n\n### 5\n![Images](img/com.jpg)\
  \ **A.** 入侵防御系统（`IPS`）积极监控网络或系统活动以检测异常，并可以配置为采取措施停止或遏制异常活动。可以通过检查已知的攻击模式（基于特征的 `signature-based`）或超出正常活动的变异（基于异常的\
  \ `anomaly-based`）来检测异常活动。\n\n![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。像\
  \ IPS 一样，入侵检测系统（`IDS`）监控网络或系统活动，但不尝试停止它。`IPSec` 为传输提供机性和完整性。`SCREENED SUBNET`是一个段。\n\
  \n### 6\n![Images](img/com.jpg) **A.** 访问控制列表（`ACLs`）是允许或拒绝类型流量的路由器设置。\n\n![Images](img/com-1.jpg)\
  \ **B, C,** 和 **D** 是错误的。`NAT` 将私有 IP 地址映射到公有 IP 地址。`SCREENED SUBNET`是一个段。`router`\
  \ 是在本地网络和互联网之间路由流量的设备。`IPSec` 保护传输中的数据。\n\n### 7\n![Images](img/com.jpg) **A.**\
  \ 机密性确保数据只有授权方可以访问。加密数据可以在数据被盗取时对其进行保护。\n\n![Images](img/com-1.jpg) **B, C,** 和\
  \ **D** 是错误的。完整性确保数据没有被篡改。可用性（此处应为 Availability）确保数据在需要时是可用的。可追溯性（Accountability）通过审计确保人员对其行为负责。\n\
  \n### 8\n![Images](img/com.jpg) **B.** 最小权限原则规定，用户应仅被赋予执行职责所需的权利，而不能多给。\n\n![Images](img/com-1.jpg)\
  \ **A, C,** 和 **D** 是错误的。通过职责分离，组中的每个人都要求执行执行特定的工作。工作轮换是一种让员工接触各种任务的策略。\n\n### 9\n\
  ![Images](img/com.jpg) **B.** 技术安全控制措施（如复杂密码）保护计算资源。\n\n![Images](img/com-1.jpg)\
  \ **A, C,** 和 **D** 是错误的。管理控制是书面政策。物理控制（如门锁和围栏）保护组织资产。操作控制（如数据备份）确保业务连续性。\n\n###\
  \ 10\n![Images](img/com.jpg) **A.** 预期损失（`ALE`）是指与使用服务或业务过程相关的年度成本。`ALE` 用于定量风险分析方法，以优先排序并证明支出合理。\n\
  \n![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。投资回报率（`ROI`）计算投资随时间推移的效率。总拥有成本暴露了与产品或服务相关的所有直接和间接金额。\n\
  \n### 11\n![Images](img/com.jpg) **A** 和 **B.** 访问控制门厅（Access control vestibules）的设计目的是将入侵者困在受限区域。某些访问控制门厅的变体使用两道门。\n\
  \n![Images](img/com-1.jpg) 指纹通过生物识别认证识别用户。智能卡认证通过智能卡中的唯一 PIN 或 PKI 证书识别用户。\n\n\n\
  \n\n\n### 12\n![Images](img/com.jpg)\n**D.** 广告软件试图通过各种方式向用户展示广告，包括通过弹出窗口或更改网络浏览器主页。间谍软件通常会分析用户习惯，以便广告软件显示相关广告。某些杀毒软件也会扫描间谍软件，但在本例中并非如此。\n\
  \n![Images](img/com-1.jpg)\n**A, B,** 和 **C** 是错误的。Linux 上的 Firefox 不每两天更改一次主页。拒绝服务攻击阻止了对网络资源的合法访问；Juanita\
  \ 并没有被拒绝访问。间谍软件或广告软件的存在并不意味着用户账户已被破解。通常这类恶意软件是在用户访问网站或安装免费软件时静默安装的。\n\n### 13\n\
  ![Images](img/com.jpg)\n**B.** 蓝牙窃取（Bluesnarfing）是指通过蓝牙无线连接到设备并访问其数据行为。它被认为比数据包嗅探或端口扫描更具侵入性。\n\
  \n![Images](img/com-1.jpg)\n**A, C,** 和 **D** 是错误的。蓝牙劫持（Bluejacking）并不访问蓝牙设备的数据；相反，它是向另一个蓝牙设备发送未经请求的消息。数据包嗅探捕获网络流量；它并不访问无线设备的数据。端口扫描列出主机上运行的服务，但并不访问存储在主机上的数据。\n\
  \n### 14\n![Images](img/com.jpg)\n**C.** 加固包括禁用不需要的服务等操作，以使系统更安全。\n\n![Images](img/com-1.jpg)\n\
  **A, B,** 和 **D** 是错误的。补丁（Patches）修复软件问题。模糊测试（Fuzzing）是指对软件进行漏洞测试。调试（Debugging）是对软件进行系统方法的测试以识别缺陷产生。\n\
  \n### 15\n![Images](img/com.jpg)\n**A.** IEEE 802.1x 标准要求设备在获得网络访问之前必须经过验证。例如，它可以配置用于遵循该标准的\
  \ VPN 设备、网络交换机和无线访问点。\n\n![Images](img/com-1.jpg)\n**B, C,** 和 **D** 是错误的。强密码可以防止用户账户被破解，但不能防止恶意机器连接网络。IPv6\
  \ 不防止恶意机器的网络连接。IEEE 802.11 定义了 Wi-Fi 标准；这并防止恶意机器的网络连接。\n\n### 16\n![Images](img/com.jpg)\n\
  **B.** 蜜罐（Honeypot）是一个故意存在漏洞的主机，用于吸引和跟踪恶意活动。\n\n![Images](img/com-1.jpg)\n**A, C,**\
  \ 和 **D** 是错误的。蜜罐网络（Honeynet）将恶意活动吸引到主机网络中，但题目指出的是对单个主机的活动跟踪。不存在所谓的“过滤子网跟踪器”。Web\
  \ 服务器不是跟踪恶意活动的工具；Web 服务器向 Web 浏览器提供内容。\n\n### 17\n![Images](img/com.jpg)\n**A.**\
  \ 网络制图和漏洞扫描工具可以描绘网络布局，并使用操作系统指纹识别运行在主机上的操作系统。该技术通过分析进出主机的网络包来识别正在使用的操作系统。\n\n![Images](img/com-1.jpg)\n\
  **B, C,** 和 **D** 是错误的。协议分析器只捕获传输的网络流量；它们并非专门设计用于扫描网络主机或网络配置。端口扫描器识别监听端口。病毒扫描器保护主机免受恶意软件侵害；它们不扫描整个网络。\n\
  \n### 18\n![Images](img/com.jpg)\n**A.** 已知环境测试为测试人员提供了有关其测试的软件或网络的详细配置信息。\n\n![Images](img/com-1.jpg)\n\
  **B, C,** 和 **D** 是错误的。未知环境测试无法向系统测试人员提供任何信息。部分已知测试为测试人员提供一些但非详细的信息，从而允许获得更充分的测试环境。在此语境下不存在蓝盒测试（Blue-box\
  \ testing）。\n\n### 19\n![Images](img/com.jpg)\n**B.** 模糊测试（Fuzzing）是一种向应用程序中注入其未预期数据的手段，以确保应用程序中不存在缺陷。\n\
  \n![Images](img/com-1.jpg)\n**A, C,** 和 **D** 是错误的。跨站脚本（Cross-site scripts）并不能确保应用程序安全；它们是一种攻击类型。打补丁发生在发现缺陷之后。调试意味着软件缺陷已经已知。\n\
  \n### 20\n![Images](img/com.jpg)\n**B.** RADIUS 仅用于认证。\n\n![Images](img/com-1.jpg)\n\
  **A, C,** 和 **D** 是错误的。RADIUS 本身不发出请求。扩展认证协议（`EAP`）是一个框架，而不是一种协议。扩展认证协议——通过安全隧道进行灵活认证（`EAP-FAST`）不需要证书。扩展认证协议——隧道层安全协议（`EAP-TTLS`）不产生组织。\n\
  \n### 21\n![Images](img/com.jpg)\n**B.** 移动设备管理员可以配置自动锁屏、设备加密或远程擦除。\n\n![Images](img/com-1.jpg)\n\
