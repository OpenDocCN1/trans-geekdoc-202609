  \ 是一种保护网络流量的方法。高级加密标准 (AES) 是一种对称加密算法。`IPSec` 为网络传输提供数据机密性和完整性。\n\n### 34\n![Images](img/com.jpg)\n\
  **A.** 采用分流配置的 VPN 通过 VPN 隧道直接导向另一侧可用资源的流量。\n\n![Images](img/com-1.jpg)\n**B, C,**\
