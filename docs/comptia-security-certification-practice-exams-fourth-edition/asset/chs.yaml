  \n\n\n\n# 第 5 章：漏洞与威胁\n你将探索各种类型的恶意软件（如间谍软件和勒索软件）、系统配置漏洞，以及与 IoT 设备、工业控制系统和嵌入式设备相关的威胁。\n\
  \n# 第 6 章：缓解安全威胁\n你将探索如何使用磁盘加密和补丁管理等方法加固网络设备和主机，以减少攻击面。\n\n# 第 7 章：实现主机安全\n你将探索如何通过加固数据库、启用\
  \ `TPM`、防止数据丢失以及使用 `MDM` 工具远程擦和存储分段配置来保护端点设备。\n\n# 第 8 章：网络基础设施安全\n你将探索如何使用 `HSMs`、`TLS`、蜜罐程序（honeypots）和蜜罐网络（honeynets）来实现网络安全；数据主权如何影响数据隐私实践；以及如何使用\
  \ `NAC`、`VPNs` 和 `VLANs` 等网络安全解决方案来控制和保护网络访问。\n\n# 第 9 章：无线网络与安全\n你将探索如何使用 `EAP`、`WPA3`\
  \ 和 `IEEE 802.1x` 等解决方案安装并配置安全的无线网络，以缓解蓝牙盗窃（bluesnarfing）和射频干扰等无线网络威胁。\n\n# 第 10\
  \ 章：身份验证\n你将探索 `CHAP` 和 `802.1x` 等身份验证协议，包括一次性密码和令牌密钥身份验证方法，以及多因素认证如何增强用户登录安全性。\n\
  \n# 第 11 章：授权与访问控制\n你将探索各种类型的安全控制（如检测性控制和补偿性控制）、身份提供者在授权资源访问中的角色，以及如何授予资源权限和加固用户账户。\n\
  \n# 第 12 章：密码学简介\n你将探索与密钥、加密与哈希以及信息隐藏相关的加密概念，以及 `DNSSEC` 和 `HTTPS` 等网络安全协议是如何实现的。\n\
  \n# 第 13 章：管理公钥基础设施\n你将探索 `PKI` 概念（包括证书颁发机构和证书签名请求）、证书生命周期、各种类型的证书及其发放和使用方式。\n\n\
  # 第 14 章：物理安全\n你将探索各种类型的物理控制措施（如安保人员、线锁和 USB 数据屏蔽器），以及包括粉碎和消磁在内的安全数据销技术。\n\n# 第\
  \ 15 章：应用程序攻击与安全\n你将探索常见的应用程序攻击（如 `SQL injection` 和整数溢出）、用于高效质量保证的自动化代码测试，以及常见的应用程序威胁缓解技术（如黑名单和安全编码技术）。\n\
  \n# 第 16 章：虚拟化与云安全\n你将探索虚拟化与云计算之间的关系，如何使用安全组和复制等选项保护云服务的使用，以及如何保护虚拟机的使用。\n\n# 第\
  \ 17 章：风险分析\n你将探索风险管理策略（如风险接受和风险转移）、如何建立风险注册，以及如何计算已发生威胁的成本并与安全控制的成本进行比较。\n\n# 第\
  \ 18 章：灾难恢复与业务连续\n你将探索如何通过 `RAID` 和数据复制等冗余方案确保业务连续性；使用本地和云数据备份；以及通过业务影响分析确定负面事件如何影响组织。\n\
  \n# 第 19 章：理解监控与审计\n你将探索如何配置各种类型的设备和主机、如何使用 `SIEM` 进行集中监控，以及如何使用 `SOAR` 自动化事件响应。\n\
  \n# 第 20 章：安全评估与审计\n你将探索定期安全审计的重要性；侦察、漏洞扫描和渗透测试之间的区别。\n\n# 第 21 章：应急响应\n你将探索数字取证（包括监管链）；并考查应急响应规划和执行的重要性。\n\
  \n\n## 认证目标\n- 1.01 配置负载均衡器\n- 1.02 管理 IPv4\n- 1.03 管理 IPv6\n\n## 习题\n\n应用程序连接的中断对本地和云端应用都构成了风险。应用程序性能会影响解决业务需求所需的\
  \ IT 解决方案的有效性。负载均衡同时考虑了应用程序的可访问性和性能需求。负载均衡器接受客户端请求并将其路由到后端服务器池，由最空闲的服务器提供服务。由于有多个服务器在提供应用程序服务，后端服务器故障不会中断用户连接；相反，负载均衡器不会将客户端请求路由到无响应的主机。\n\
  \n互联网版本 4 (`IPv4`) 和较新的 `IPv6` 是提供网络服务的协议基础。`IPv6` 使用 128 位十六进制地址方案，以及与 `IPv4` 不同的设备发现和通信技术。\n\
  \n**[1.** 实现负载均衡器可以实现哪些益处？（选择两个。）\nA. 提高应用程序性能\nB. 提高应用程序安全性\nC. 提高应用程序监管合规性\nD.\
  \ 提高应用程序可用性\n\n**[2.** 一个繁忙的网站由于发送到 Web 服务器的 HTTP 请求过多响应不佳。哪种解决方案改进当前和未来的 Web 服务器性能最理想？\n\
  A. 为 Web 服务器添加更多内存。\nB. 使用两个托管相同内容的 Web 服务器。配置负载均衡器在两个 Web 服务器之间分配入站的 HTTP 连接。\n\
  C. 在 Web 服务器和互联网之间放置路由器，以限制入站的 HTTP 连接。\nD. 在 Web 服务器上启用 SSL。\n\n**[3.** 你希望防止客户端请求由托管用户会话的繁忙后端服务器处理。你应该配置哪种负载均衡器调度算法？\n\
  A. 轮询 (Round robin)\nB. 加权轮询 (Weighted round robin)\nC. 随机 (Random)\nD. 最少连接 (Least\
  \ connections)\n\n\n\n\n\n### [4]\n在一次 IT 会议上，你的同事 Trinity 建议，公司网站订单系统所使用的单一负载均衡器存在单点故障。她建议配置两个负载均衡器，但在任何时刻只有其中一个处于服务状态。Trinity\
  \ 描述的是哪种类型的负载均衡配置？\n\nA. 轮询算法 (Round robin)\nB. 主主模式 (Active-active)\nC. 主备模式 (Active-passive)\n\
  D. 最少连接数 (Least connections)\n\n### [5]\n你的网络上配置了主备模式负载均衡器解决方案。当备用负载均衡器确定主负载均衡器宕机时，它会接管哪个属性的控制权？\n\
  \nA. 负载均衡器 MAC 地址\nB. 负载均衡器 IP 地址\nC. 第一个后端服务器 MAC 地址\nD. 第一个后端服务器 IP 地址\n\n###\
