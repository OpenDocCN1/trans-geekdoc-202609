  \n![Images](img/com-1.jpg)\n**A, B,** 和 **C** 是错误的。快照磁盘空间占用与安全性没有直接关系。快照暴露敏感数据的程度不会比虚拟机上的当前文件系统暴露得更多。回滚到快照可能会导致虚拟机暂时不可用，但这不是最显著的潜在安全问题。\n\
  \n### 2\n![Images](img/com.jpg)\n**A** 和 **C.** 根据敏感数据法规，与其他客户共享相同的云计算服务可能是被禁止的，尽管云租户的数据无法被其他云租户访问。根据提供者的地理位置，不同的法律可能适用于由提供者托管的数据是否可以被合法披露。然而，这并不是许多组织愿意承担的风险。\n\
  \n![Images](img/com-1.jpg)\n**B** 和 **D** 是错误的。安全超文本传输协议（`HTTPS`）被认为是传输中数据的安全传输协议（而\
  \ HTTP 不是），所以这是一个优势而非问题。数据加密不会引起安全疑虑；它解决了这些疑虑。\n\n### 3\n![Images](img/com.jpg)\n\
  **A** 和 **C.** 每个虚拟机确实有一个或多个唯一的 MAC 地址，这些地址可以由虚拟机管理员配置。运行在同一台主机上的虚拟机可以连接到不同的 VLAN（物理或内部）；这是一个虚拟网络配置设置。\n\
  \n![Images](img/com-1.jpg)\n**B** 和 **D** 是错误的。虚拟化操作系统必须打补丁，以解决不打补丁可能存在的稳定安全问题。单个虚拟机被攻破并不意味着同一虚拟机程序上的所有其他虚拟机都被攻破；操作系统漏洞可能让攻击者获得对操作系统的完全访问，但无法使其能够“突破”虚拟机并进入宿主虚拟机程序的的操作系统。\n\
  \n### 4\n![Images](img/com.jpg)\n**A** 和 **B.** 云计算的可扩展性是可能的，因为第三方（云提供者）汇总并提供硬件、软件、软件许可等。按需配置额外资源（如更多存储空间）是云计算的一个特性。由于第三方托管了您的某些（或全部）IT\
  \ 服务，您将需要较少的本地硬件资源。\n\n![Images](img/com-1.jpg)\n**C, D,** 和 **E** 是错误的。云计算并不要求必须加密，并且并不一定提供比本地可能提供的更好的加密选项。在云计算中，数据存储通常由提供者托管，而不是在本地，除非本地数据被备份到云端。即使对于完全依赖云计算的企业，员工仍将使用计算设备连接到云服务，因此将需要防病毒软件。\n\
  \n### 5\n![Images](img/com.jpg)\n**D.** 你应该针对相关员工对预算文件的访问配置文件系统审核。这让你能够跟踪在任何给定时间访问预算文件的员。\n\
  \n![Images](img/com-1.jpg)\n**A, B,** 和 **C** 是错误的。文件哈希仅用于确定文件是否已更改，而不是确定特定人员是否访问了文件。加密用于数据机密性。基于主机的入侵检测系统（`HIDS`）查找并报告异常主机活动；具有适当权限访问文件的用户通常不被视为异常。\n\
  \n### 6\n![Images](img/com.jpg)\n**B.** 平台即服务（`PaaS`）主要针对软件开发者，通过网络提供数据库和编程 API\
  \ 等 IT 服务。\n\n![Images](img/com-1.jpg)\n**A, C,** 和 **D** 是错误的。软件即服务（`SaaS`）能够通过网络快速配置终端生产力软件。基础设施即服务（`IaaS`）指的是云端提供的计算、网络和存储服务。任何即服务（`XaaS`）都是描述通过网络交付\
  \ IT 服务的通用术语。\n\n### 7\n![Images](img/com.jpg)\n**C.** 混合云解决方案将本地 IT 服务与云端托管的 IT\
  \ 服务相结合。\n\n![Images](img/com-1.jpg)\n**A, B,** 和 **D** 是错误的。公共云服务完全托管在公共云提供者拥有并管理的计算资源上。私有云服务托管在单一组织完全拥有并管理的计算资源上。社区云汇总计算资源，为具有相似需求的组织（如政府机构）提供\
  \ IT 服务。\n\n### 8\n![Images](img/com.jpg)\n**B.** 2 型虚拟机程序运行在现有操作系统之上。\n\n![Images](img/com-1.jpg)\n\
  **A, C,** 和 **D** 是错误的。 1 型虚拟机程序直接运行在硬件上；它就是操作系统。不存在 3 型和 4 型虚拟机程序。\n\n### 9\n![Images](img/com.jpg)\n\
  **D.** 容器能够在虚拟化环境中部署每个应用，同时缩短启动时间，因为容器使用宿主操作系统。\n\n![Images](img/com-1.jpg)\n**A,\
  \ B,** 和 **C** 是错误的。在虚拟机中运行应用可以工作，但不会缩短启动时间，因为虚拟机操作系统必须启动。云访问安全器是执行点，能够在访问云资源时应用企业策略。虚拟机逃逸防护是一种防止虚拟机内部的应用程序访问宿主虚拟机程序的技术。\n\
  \n### 10\n![Images](img/com.jpg)\n**A.** 可扩展性是云计算的一种特性，允许资源响应负载变化，例如当应用程序变得繁忙时增加虚拟机（扩展扩展）。当需求下降时，收缩（删除虚拟机）也是一种选择，它可以降低云计算成本。\n\
  \n![Images](img/com-1.jpg)\n**B, C,** 和 **D** 是错误的。粉碎是一种数据破坏技术。模板是用于未来更改或创建项目的基础。在云中，模板被称为“基础设施即代码”，作为自动部署云资源的方法。在云计算中，计量使用是指根据云资源的使用付费，例如基于云虚拟机运行的时间。\n\
  \n### 11\n![Images](img/com.jpg)\n**B.** 在灾难恢复中，热备用站点镜像了主站的 IT 系统和数据副本。配置和数据通过复制保持同步。热站点可以是位于主站许多英里外的备用设施。公共云现在常用作热站点，这消除了维护独立设施的成本。\n\
  \n![Images](img/com-1.jpg)\n**A, C,** 和 **D** 是错误的。热备站点包含设备并也可以包含运行中的 IT 系统，但它们没有最新的数据。冷备站点代表在主站不可用时使用的物理位置，但不包含设备或数据。冰川站点不是一个有效的灾难恢复术语。\n\
  \n\n\n\n\n## 12\n![Images](img/com.jpg) **C.** 瘦客户端是一个处理能力和存储空间有限的终端设备，它连接到强大的远程服务器，以通过网络运行操作系统和应用程序。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **D** 是错误的。厚客户端是具有充足处理能力和存储空间的终端设备。虽然智能手机和平板电脑经常被用作瘦客户端，但此题中“瘦客户端”是最佳答案，因为它涵盖了任何类型的终端设备，而平板电脑和手机指的是特定类型的设备。\n\
  \n## 13\n![Images](img/com.jpg) **A.** 软件定义网络 (`SDN`) 在网络基础设施硬件之上添加了一个配置层，能够实现简化且一致的管理体验，例如通过\
  \ Web GUI 或命令行工具。`SDN` 消除了云客户需要对底层网络硬件配置具备详细技术知识的需求。\n\n![Images](img/com-1.jpg)\
  \ **B, C,** 和 **D** 是错误的。在云中，传输网关通过 `VPNs` 等网络链接机制实现了云虚拟网络与本地网络之间的互连性。连接到集中传输网关网络的虚拟网络不需要都通过\
  \ `VPN` 链路来与其他网络通信；相反，它们通过传输网关进行连接。软件定义可见性 (`SDV`) 提供了一种管理和监控网络的整体方法，并具有检测和响应实时安全警报的额外能力。无服务器架构仍然使用底层服务器，但部署虚拟机和安装代码托管或数据库软件由云服务提供商\
  \ (`CSP`) 处理；云租户仅需配置高层服务，例如创建自定义软件函数或数据库对象。\n\n## 14\n![Images](img/com.jpg) **C.**\
  \ 由于虚拟机在云中的部署非常方便且快速，随着时间的推移，可能会出现 `VM` 泛泛（VM sprawl）。在 `VM` 泛滥中，你可能不知道许多未未使用或被遗忘的虚拟机的存在，但它们仍然存在并可能保持运行，从而产生云计算费用。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **D** 是错误的。`VM` 脱逸发生在虚拟机内部运行的恶意代码尝试访问托管的虚拟机程序操作系统。策略在某些环境中（如\
  \ `Amazon Web Services` (`AWS`)）是相关权限的集合，可以授予用户或组以允许资源管理或访问。删除未使用的 `VMs` 与 `VM`\
  \ 资源策略或 `VM` 内部软件服务的集成无关。\n\n## 15\n![Images](img/com.jpg) **D.** 将云存储数据复制到备用物理位置或地理区域，可以在某一区域发生故障时提供数据冗余。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。列出的项目没有解决区域性故障期间无法访问云数据的问题；只有跨区域复制才能做到这一点。加密为静态数据提供机密性。设置云存储权限控制数据访问，而在单个数据中心内复制对于区域性停机没有帮助。\n\
  \n## 16\n![Images](img/com.jpg) **D.** 一个 `AWS` 安全组包含一组规则列表，允许流量进入或离开特定的虚拟机（在 `AWS`\
  \ 中称为 `EC2` 实例）。\n\n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。网络访问控制列表 (`ACL`)\
  \ 在 `AWS` 中用于允许或拒绝进出云子网，而不是单个虚拟机。`Amazon machine image` (`AMI`) 是在部署新 `EC2` 实例时选择的虚拟机模板。弹性\
  \ IP 地址 (`EIP`) 是 `AWS` 中一种静态不变的公共 IP 地址资源，可以根据需要可以在不同的虚拟机之间移动。\n\n## 17\n![Images](img/com.jpg)\
  \ **A.** 虚拟私有云 (`VPC`) 是 `AWS`、`Google Cloud` 或 `IBM Cloud` 中定义的虚拟网络。\n\n![Images](img/com-1.jpg)\
  \ **B, C,** 和 **D** 是错误的。在云中，传输网关通过 `VPNs` 等网络链接机制实现了云虚拟网络与本地网络之间的互连性。连接到集中传输网关网络的虚拟网络不需要都通过\
  \ `VPN` 链路来与其他网络通信；相反，它们通过传输网关进行连接。弹性 IP 地址 (`EIP`) 是 `AWS` 中一种静态不变的公共 IP 地址资源，可以根据需要可以在不同的虚拟机之间移动。一个\
  \ `AWS` 安全组包含一组规则列表，允许流量进入或离开特定的虚拟机（在 `AWS` 中称为 `EC2` 实例）。\n\n## 18\n![Images](img/com.jpg)\
  \ **D.** 托管安全提供商 (`MSSP`) 通过网络提供 IT 服务，例如 `DDoS` 攻击缓解。`MSSP` 服务可以是云原生的，也可以通过第三方提供商提供。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。列出的项目没有 `MSSP` 那么针对安全产品。微服务是一个专注于执行特定任务的小程序，可以作为应用程序接口\
  \ (`API`) 暴露给其他开发者。云访问安全备器 (`CASBs`) 是访问云资源时应用企业安全策略的执行点。托管服务提供商 (`MSP`) 通过网络提供\
  \ IT 服务，但不像 `MSSP` 那样限于安全服务。\n\n## 19\n![Images](img/com.jpg) **C.** 第四层是七层 OSI\
  \ 模型的传输层，专注于以可靠的方式 (`TCP`) 或不可靠但更快的方式 (`UDP`) 传输数据。\n\n![Images](img/com-1.jpg)\
  \ **A, B,** 和 **D** 是错误的。第二层是 OSI 数据链路层，关注传输如何放置在网络介质上。第三层关注 IP 地址和路由。第七层（应用层）涉及\
  \ `DNS` 和 `HTTP` 等高层协议，其中某些协议涉及用户交互。\n\n## 20\n![Images](img/com.jpg) **D.** OSI\
  \ 模型的第七层（应用层）涉及高层协议，这意味着可以检查所有数据包头和数据包有效负载，而四层包过滤防火墙只能根据数据包头中的字段做出决策。因此，第七层防火墙解决方案通常比四层防火墙解决方案更贵。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。第二层是 OSI 数据链路层，关注传输如何放置在网络介质上。第三层关注\
  \ IP 地址和路由，第四层负责数据包的传输和交付。\n\n\n\n\n\n## 21\n\n![Images](img/com.jpg) **B.** 雾计算（也称为边缘计算）将数据处理能力置数据源与公共云环境之间的网络边缘设备上，例如企业本地网络。其优势在于将处理去中心化并将其放置在最需要的地方，可以加速数据传输，从而缩短整体处理时间。\n\
  \n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。量子计算基于操纵量子比特（qbits），量子比特可以同时表现出多种状态，而当前的计算使用位（0\
  \ 和 1）来表示数据状态（只有两种可能性）。量子计算使得能够快速执行多次计算，从而提升了计算能力。混合云结合了不同的云模型，例如私有云和公有云结合，或者通过\
  \ `VPN` 连接将公有云与本地 IT 环境相结合。私有云具备了所有云计算的特性，但由单一组织拥有并使用该云基础设施。\n\n## 22\n\n![Images](img/com.jpg)\
  \ **D.** 容器化应用将应用程序或应用程序组件（微服务）与其他组件或其他操作系统依赖项解耦。容器是容器镜像的运行时版本，包含应用程序文件和配置设置，但不包含操作系统；相反，它使用已经在运行的宿主机操作系统。在私有存储库中托管镜像可以控制使用哪些镜像启动容器，从而增强安全性。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。列出的解决方案均未能增加容器的安全性。私有云提供的安全性并不比公有云提供的多。容器托管在物理机还是虚拟机上不会影响容器化应用的安全性。受感染或不稳定的镜像更有可能源自匿名公有存储库，而非私有存储库。\n\
  \n## 23\n\n![Images](img/com.jpg) **A.** 轮密钥是一项标准的安全实践。过去泄露的密钥将不再提供资源访问。必须为软件开发人员提供新轮的密钥以便持续访问云资源。\n\
  \n![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。对称加密使用同一密钥进行加密和解密，而非对称加密使用公钥和私钥对提供安全性；使用对称密钥不会增加安全性。缩短密钥长度不会强化安全密钥；通常情况下，密钥中的位数越多，可能的密钥组合越多，使其更难破解。通过\
  \ `SMTP` 发送密钥不认为是密钥强化的最佳实践，因为 `SMTP` 不对消息加密；`S/MIME` 是可以的，因为消息经过了加密，但这未包含在选项中。\n\
  \n## 24\n\n![Images](img/com.jpg) **C.** 私有云子网不允许来自互联网的入站连接，通常也不允许访问互联网。配置 `Internet\
  \ gateway`（互联网网关）将允许只有私有 IP 地址的云虚拟机与私有子网之外进行通信（例如本地资源）。出于安全考虑，云资源通常被隔离在分段网络中。\n\n\
  ![Images](img/com-1.jpg) **A, B,** 和 **D** 是错误的。公有子网允许来自互联网的入站连接，这违反了所述要求。因为私有网络存在于云中，所以必须存在\
  \ `Internet gateway` 以允许出站互联网流量。客户端到站 `VPNs` 允许单个客户端站安全地访问远程网络；它们无法按照所述要求让私有网络中的云资源通信。\n\
  \n## 25\n\n![Images](img/com.jpg) **D.** 审计云资源活动将提供操作日志，例如对云虚拟机进行配置更改的技术人员。大多数审计系统具有可配置的审计数据保留期和过滤选项。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。列出的项目不会跟踪虚拟机的配置更改。`API` 集成允许资源进行交互，例如运行在云虚拟机中的自定义代码向运行在本地或云端的数据库发出\
  \ `API` 调用。轮密钥是一项标准的安全实践。过去泄露的密钥将不再提供资源访问，但这并没有解决列出的跟踪需求。OSI 模型的第 7 层（应用层）涉及高层协议，这意味着第\
  \ 7 层防火墙可以检查所有数据包头部和数据包载荷。\n\n## 26\n\n![Images](img/com.jpg) **A** 和 **B.** 下一代安全\
  \ Web 网关（SWG）是一种本地或云端的统一 IT 安全解决方案，提供恶意软件检测与防护、网络威胁检测、正向和反向代理、内容过滤、数据泄漏防护和威胁报告等服务。\n\
  \n![Images](img/com-1.jpg) **C** 和 **D** 是错误的。在云中，模板被称为“基础设施即代码”，作为自动化云资源部署的方法。持续集成和持续部署（CI/CD）利用自动化加速软件向利益相关方的整体开发和交付。\n\
  \n## 27\n\n![Images](img/com.jpg) **D.** 虚拟机实例显示在图 16-1 中。在云中对虚拟机进行手动部署和管理被称为基础设施即服务（IaaS）。基础设施即服务（IaaS）是指计算、网络和存储服务。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。列出的云服务模型体现在图 16-1 中。平台即服务（PaaS）主要面向软件开发人员，提供数据库和编程\
  \ API 等网络服务。万即服务（XaaS）是描述通过网络交付的通用 IT 服务术语。软件即服务（SaaS）允许终端用户效率软件通过网络快速交付。\n\n##\
  \ 28\n\n![Images](img/com.jpg) **A.** 图 16-2 显示了云中的数据库创建选项。数据库适用于平台即服务（PaaS），它主要面向软件开发人员，提供数据库和编程\
  \ API 等网络服务。\n\n![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。列出的云服务模型不在图 16-2\
  \ 中。XaaS 是描述通过网络交付的通用 IT 服务术语。软件即服务（SaaS）允许终端用户效率软件通过网络快速交付。基础设施即服务（IaaS）是指计算、网络和存储服务。\n\
  \n## 29\n\n![Images](img/com.jpg) **C.** 混合云解决方案结合了云部署模型，例如将私有云与公有云连接，或者将传统的本地 IT\
  \ 服务与托管在公有上的 IT 服务连接。\n\n\n\n\n\n![Images](img/com-1.jpg) A、B 和 D 都是错误的。列出的云部署模型不适用于此场景。私有云服务托管在由单一组织所有并管理的计算资源上。社区云汇总计算资源，为具有相似需求（如政府机构）的组织提供\
  \ IT 服务。公有云服务托管在公共云提供商所有并管理的计算资源上。\n\n**30.** ![Images](img/com.jpg) C. 图 16-3 显示了用于创建虚拟机、Web\
  \ 应用程序或数据库等云资源的模板部署选项。模板可用于自动化云资源的重复部署，它们是包含完成此任务指令的文本文件，因此这被称为“基础设施即代码”。\n\n![Images](img/com-1.jpg)\
  \ A、B 和 D 都是错误的。列出的术语没有描述图 16-3 中发生的情况。软件定义网络 (SDN) 在网络基础设施硬件之上添加了一个配置层，能够通过 Web\
  \ GUI 或命令行工具实现简化且一致的管理体验。SDN 消除了云客户对底层网络硬件配置具备详细技术知识的需求。软件即服务 (SaaS) 允许终端用户生产力软件通过网络快速配置。雾计算（也称为边缘计算）将数据处理能力放置在数据源与公有云环境（如企业本地网络）之间的网络边缘设备上。其优势是去中心化处理并将其放置在最需要的地方，可以加速数据传输，从而缩短整体处理时间。\n\
  \n**31.** ![Images](img/com.jpg) B. 同步复制同时向主副本和副本写入数据。这通常用于关键任务型应用程序，需要足够的网络速度来支持跨远距离的副本。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 都是错误的。异步复制在将提交的更改同步到额外副本之前，先将数据写入主副本。对称（symmetric）和非对称（asymmetric）术语不用于复制语境中。\n\
  \n**32.** ![Images](img/com.jpg) B. 虚拟机逃逸（VM escape）发生在运行虚拟机内部的恶意代码尝试访问宿主机虚拟机程序操作系统时。针对此类威胁的缓解措施包括修补虚拟机程序和客户操作系统，以及限制虚拟机程序与虚拟机之间共享资源的工具（如文件共享）。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 都是错误的。虚拟机泛滥（VM sprawl）是指意识到大量未使用或被遗忘的虚拟机的存在，但它们仍然存在甚至可能仍在运行，从而产生云计算费用。云访问安全代理器\
  \ (CASBs) 是执行点，允许在访问云资源时应用企业安全策略。OSI 模型的第 7 层（应用层）涉及高层协议，这意味着所有数据包头和数据包载荷都可以被检查，而第\
  \ 4 层包过滤防火墙只能根据数据包头中的字段做出决策。因此，第 7 层防火墙解决方案比第 4 层防火墙解决方案贵。\n\n# 第 17 章：风险分析\n\n\
  ## 认证目标\n- 17.01 风险分析简介\n- 17.02 风险分析的类型\n- 17.03 风险缓解策略\n\n## 问题\n\n风险分析确定了企业可能面临的潜在威胁以及如何有效地减少其影响。定量风险分析产生一个按金额优先级排序的风险列表，而定性风险分析则使用相对优先级系统对风险进行相互比较和评分。\n\
  \n组织的风险应在风险注册表中进行集中列出并按严重程度排名。风险注册表还作为风险缓解安全控制措施的集中列表。\n\n未能正确执行风险分析可能导致违反法律、失去客户信任，甚至在威胁发生时遭受重大财务损失。\n\
  \n**1.** 你负责确保公司所有 IT 相关的设备和数据都已清点并赋值。哪个术语最能描述这一活动？\nA. 资产识别\nB. 风险评估\nC. 风险缓解\n\
  D. 风险注册表\n\n**2.** 你正在识别安全威胁以确定病毒感染的概率。识别潜在的感染源。（选择两项。）\nA. USB 闪盘\nB. USB 键盘\n\
  C. 卡\nD. 从合作伙伴网站下载的文档\n\n**3.** 在风险分析会议期间，你被要求指定正在考虑的内部威胁。哪项*不*被视为内部威胁？\nA. 贪污\n\
  B. 攻击者通过防火墙侵入\nC. 员工为了个人利益使用公司资产\nD. 用户插入个人 USB 闪盘\n\n**4.** 你是一名 IT 安全顾问。客户向你传达了对恶意互联网用户访问公司资源的担忧。你会进行何种类型的评估来确定这种概率？\n\
  A. 威胁评估\nB. 风险分析\nC. 资产识别\nD. 总体成本\n\n**5.** 你正在为一家海鲜公司进行风险分析的 IT 顾问。客户公司使用的特定烹饪和包装技术会被泄露给竞争对手。这是哪种安全关注点？\n\
  A. 完整性\nB. 机密性\nC. 可用性\nD. 授权\n\n**6.** 在识别内部和外部威胁后，你必须确定这些潜在风险将如何影响业务运营。以下哪最能描述这一点？\n\
  A. 风险分析\nB. 容错性\nC. 可用性\nD. 影响分析\n\n**7.** 在确定如何最好缓解风险时，你应该考虑哪些项目？（选择两项。）\nA. 保险覆盖\n\
  B. 服务器硬盘的数量\nC. 新电脑中 CPU 的速度会有多快\nD. 网络带宽\n\n**8.** 你正在为潜在风险列出预防措施。你会记录以下哪些内容？（选择三项。）\n\
  A. 更大的平屏显示器\nB. 数据备份\nC. 员工培训\nD. 比较网络均衡设备的可靠性\n\n**9.** 一家保险公司对你的业务场所自然灾害覆盖额外收取每月\
  \ 200 美元的保费。你必须与哪个数字进行比较以决定是否接受此额外覆盖？\nA. ALE\nB. ROI\nC. 总体成本\nD. 总月保费\n\n**10.**\
  \ 关于定性风险分析，以下哪项是正确的？\nA. 仅考虑数值数据。\nB. 必须计算 ALE。\nC. 必须识别威胁。\nD. 必须计算 ROI。\n\n**11.**\
  \ 为了得出年度损失预期，必须计算哪些值？（选择两项。）\nA. 单次损失预期\nB. 年发生率\nC. 每月损失预期\nD. 每季度损失预期\n\n\n\n\n\
  \n### 12. 你是一家云计算公司的服务器专家。管理层希望拨留资金以应对服务器宕机风险。根据历史数据，你确定服务器宕机的概率为 17%。过去数据表明，服务器平均宕机时间为一个小时，每小时可以获得\
  \ $3000 的收入。你必须计算 `ALE`。请选择正确的 `ALE`。\n\nA. $300\nB. $510\nC. $3000\nD. $36,000\n\
  \n### 13. 你的老板要求你计算当员工所需的关键服务器宕机一小时时，公司会损失多少钱。你已经确定这种情况发生的概率为 70%。公司有 25 名员工，每人每小时薪\
  \ $18.50。请选择正确的值。\n\nA. $12.95\nB. $18.50\nC. $323.75\nD. $3885\n\n### 14. 哪个术语最能描述为了减少威胁和不利条件对业务的影响而花费的资金？\n\
  \nA. 风险管理\nB. 安全审计\nC. 预算限制\nD. 影响分析\n\n### 15. 哪种风险分析方法使用了 `ALE`？\n\nA. 最优结果\n\
  B. 定量\nC. ROI\nD. 定性\n\n### 16. 你正在一个风险分析会议上演示数据。在演示期间，你展示了一份按金额排序的 `ALE` 值列表。会议参与者\
  \ Bob 想知道用于计算 `ALE` 的数字的可靠性如何。你能告诉 Bob 什么？\n\nA. 这些数字是 100% 可靠的。\nB. 这些数字是 50% 可靠的。\n\
  C. `ALE` 使用变化的概率值进行计算。\nD. `ALE` 是使用百分比计算的并且准确的。\n\n### 17. 在进行定性风险评估时，应该执行以下哪些操作？（选择两个。）\n\
  \nA. 资产估值\nB. ARO\nC. SLE\nD. 潜在威胁的排序\n\n### 18. 你是一家美食食品公司的 IT 安全分析师，该公司计划明年在阿鲁巴的奥兰哈斯塔德市（Oranjestad）开设一家工厂。你下周将与规划委员会会面，必须就新地点向委员会提问，以便你准备风险分析报告。以下哪些问题是最相关的提问？（选择两个。）\n\
  \nA. 夏天天气有多热？\nB. 当地电力的可靠性如何？\nC. 有了什么种物理场所安全措施？\nD. 最近的高公路有多远？\n\n### 19. 你的公司网站由云服务提供商托管。这如何适用于风险的概念？\n\
  \nA. 风险规避\nB. 风险转移\nC. 风险分析\nD. `ALE` 增加\n\n### 20. 关于风险管理，以下哪项描述是正确的？\n\nA. 投资于风险管理的资金如果花在其他地方，可能会获得更多的利润。\n\
  B. `ALE` 仅是估计值，可能会不准确。\nC. IT 安全风险都由公司防火墙处理。\nD. 定性风险分析的结果以美元金额表示。\n\n### 21. 你的竞争对手正在提供一种预测会畅销的新产品。经过仔细研究，由于市场的不确定性和巨大的投入，贵公司决定不推出竞争产品。哪个术语最能描述贵公司的决定？\n\
  \nA. 风险分析\nB. 风险转移\nC. 风险规避\nD. 产品规避\n\n### 22. 管理层如何确定哪些风险应该受到最多的关注？\n\nA. 威胁向量\n\
  B. 按可能性对风险进行排序\nC. 按可能的发生日期对风险进行排序\nD. 按 `SLE` 对风险进行排序\n\n### 23. 最近，你们的数据中心位于新墨西哥州的阿尔伯克基（Albuquerque）。由于公司缩减规模，数据中心设备被移到了圣塔菲（Santa\
  \ Fe）的一处现有办公室。圣塔菲的机房设计无法容纳所有从阿尔伯克基运来的新服务器，而且机房温度非常热。由于这是在建立新的数据中心设施之前的一个临时解决方案，管理层决定不支付更新空调系统的费用。哪个术语最能描述这种场景？\n\
  \nA. 风险转移\nB. 风险规避\nC. 风险接受\nD. 风险规避\n\n### 24. 你是一个 IT 团队的成员。该团队正在进行风险分析，并识别了数值以及威胁解决方案。下一步必须做什么？\n\
  \nA. 进行成本效益分析。\nB. 计算 `ALE`。\nC. 决定存在哪些漏洞。\nD. 无事可做。\n\n### 25. 为了减少欺诈的可能性，组织实施了政策以确保一项交易由超过一个人负责。以下哪项最能描述这一点？\n\
  \nA. 概率\nB. 缓解\nC. 影响\nD. 风险分析\n\n### 26. 风险评估和风险管理之间的区别是什么？\n\nA. 它们是相同的。\nB. 风险评估识别并优先排序风险；风险管理是减少影响。\n\
  C. 风险管理识别并优先排序风险；风险评估是减少影响。\nD. 风险评估识别威胁；风险管理控制它们。\n\n### 27. 与定性分析相比，定量分析有哪些缺点？（选择两个。）\n\
  \nA. 定量分析涉及复杂的计算。\nB. 风险不按金额排序。\nC. 定量分析更耗时。\nD. 很难确定分配多少资金给风险。\n\n### 28. 使用图 17-1，将左侧的术语与右侧正确的场景匹配。\n\
  \n![Images](img/fig17-1.jpg)\n**图 17-1 缓解策略**\n\n### 29. 在执行软件扫描扫描时，你在网络上发现了遗留主机以及\
  \ IoT 泵和阀传感器设备。主机运行接收 IoT 设备数据的关键软件。主机将更新新的硬件和软件。IoT 设备不会更换，但将继续使用。你应该做什么来最好保护该环境？（选择两个。）\n\
  \nA. 修改 IoT 设备默认设置。\nB. 在用户和遗留主机之间部署代理服务器。\nC. 将 IoT 设备放在限制的网络中。\nD. 修改端口号。\n\n\
  ### 30. 为公司的下一次 IT 安全会议做准备，你想提供各种风险的可视化表示。你应该准备什么？\n\nA. 风险注册\nB. 风险热图\nC. 风险评估\n\
  D. 风险矩阵\n\n### 31. 哪些活动与组织风险转移最相关？\n\nA. 要求新员工签署互联网可接受政策\nB.get 网络安全保险\nC. 在筛选子网和内部网络之间放置防火墙\n\
  D. 配置站点到点的 VPN 隧道\n\n### 32. 图 17-2 显示的是什么？\n\nA. 威胁注册\nB. 威胁热图\nC. 风险注册\nD. 风险热图\n\
  \n![Images](img/fig17-2.jpg)\n**图 17-2 威胁与可能性**\n\n\n\n\n\n1. A\n2. A, D\n3. B\n\
  4. A\n5. B\n6. D\n7. A, B\n8. B, C, D\n9. A\n10. C\n11. A, B\n12. B\n13. C\n14.\
  \ A\n15. B\n16. C\n17. A, D\n18. B, C\n19. B\n20. B\n21. C\n22. B\n23. C\n24. B\n\
  25. B\n26. B\n27. A, C\n28. A, C（参见`深度答案`)\n29. A, C\n30. B\n31. B\n32. C\n\n###\
  \ 深度答案\n\n1. **A.** 在识别威胁之前，需要进行资产识别。适当的风险管理涉及识别资产（包括数据）并为其赋予价值。这些信息随后可以证明保护这些资产的支出是合的。`B`、`C`\
  \ 和 `D` 是错误的。风险评估是对威胁的识别。风险缓解旨在尽量减少感知风险的影响；在首先识别组织内的资产之前，不应执行这些活动。风险清单是风险的中央列表，包含了它们的概率、严重程度评分和风险控制细节。\n\
  \n2. **D.** USB 闪盘可能包含从互联网下载的文件或从安全性较低的机器复制的文件，可能会感染你的网络。从互联网下载的合作伙伴文档也可能被感染。通过适当的管理，对现有网络及其设备进行彻底的漏洞评估，或进行更激进的渗透测试，可以发现这些安全漏洞。`B`\
  \ 和 `C` 是错误的。USB 键盘和智能卡不太可能是来源，也不需要屏蔽。\n\n3. **B.** 突破防火墙的攻击者被视为外部威胁。`A`、`C` 和 `D`\
  \ 是错误的。任何涉及员工和安全的因素都会被视为内部威胁，例如用户插入受感染的 USB 闪盘，随后感染内部网络上的一个或多个设备。\n\n4. **A.** 确定实体如何获取公司资源需要进行威胁评估。环境威胁评估考虑洪水和地震等自然因素，以及设施环境因素（如\
  \ `HVAC` 和物理安全）。威胁评估还必须考虑战争或恐怖主义等人为威胁。为了对威胁进行完全客观的评估应由外部实体进行。`B`、`C` 和 `D` 是错误的。风险分析是一个通用术语，包含了进行威胁评估，但威胁评估是一个更具体、更合适的答案。资产识别涉及确定哪些物品（有形和无形）具有价值并与这些物品关联价值。拥有成本使消费者能够确定产品或服务的真实成本。\n\
  \n5. **B.** 机密性意味着让数据对不应该看到它的人（如竞争对手）隐藏。`A`、`C` 和 `D` 是错误的。完整性验证数据的真实性；而不是隐藏它。可用性确保资源尽可能可用——例如对数据库服务器进行集群化。授权在通过身份验证确认实体身份后，授予对资源的访问权限。\n\
  \n6. **D.** 确定已发生风险对业务运营的影响被称为影响分析。它通常用于确定针对这些风险的支出是否合理。`A`、`B` 和 `C` 是错误的。在这种情况下，风险分析是一个过于通用的术语；影响分析是一个更具体的答案。容错能力可以在磁盘发生故障时减少影响，但它非常具体；问题指的是多个风险。可用性确保资源尽可能可用以减少风险，但它并不决定风险如何影响业务。\n\
  \n7. **A 和 B.** 风险评估包括确定各种类型的保险覆盖涵盖和不涵盖的内容，以及这些保险保费的成本是否合理，例如与恶意网络攻击或知识产权数据盗窃相关的网络安全保险。服务器硬盘的数量显然与风险相关。当正确配置多个硬盘（如\
  \ `RAID 1`）时，硬盘数据丢失的概率会降至最低。`C` 和 `D` 是错误的。CPU 速度和网络带宽与风险评估没有直接关系；它们与性能有关。\n\n8.\
