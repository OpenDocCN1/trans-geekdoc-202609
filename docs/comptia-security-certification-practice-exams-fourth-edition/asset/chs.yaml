  \n### [25]\n![Images](img/com.jpg) **D.** `expires` HTTP 头部中的 `-1` 值意味着立即过期，且不会对此响应进行缓存；因此，在重用时，必须从服务器请求数据。缓存有时有助于缩短加载\
  \ 页面内容的时间，并减少发送到 Web 服务器的网络流量。在服务器端，缓存减少了 Web 服务器必须处理的 HTTP 请求数量。\n\n![Images](img/com-1.jpg)\
