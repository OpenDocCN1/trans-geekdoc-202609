  \ D\n26. A\n27. C, D\n28. B\n29. B, C\n30. 见“深度解析”。\n31. A, D\n32. D\n\n## 深度解析\n\
  \n### [1] ![Images](img/com.jpg) **D.** 静态数据或网络传输的加密提供了机密性，因为只有拥有解密密钥才能将密文还原为原始明文形式。\n\
  \n![Images](img/com-1.jpg) **A、B 和 C 都是错误的。** 在 IT 安全中，可用性确保 IT 系统和数据尽可能保持可用状态。高可用性可以通过负载均衡、服务器集群和数据备份等机制实现。完整性用于确保数据未被篡改，通常通过生成文件哈希值来实现；如果当前文件哈希值与早期的文件哈希值不匹配，则说明文件已被修改。身份验证用于证明实体的身份，例如用户登录并提供正确的用户名和密码。\n\
  \n### [2] ![Images](img/com.jpg) **C.** 可信平台模块 (TPM) 安全固件嵌入在某些计算机系统中，支持启动过程完整性并存储该机器使用的加密密钥。\n\
  \n![Images](img/com-1.jpg) **A、B 和 D 都是错误的。** 硬件安全模块 (HSM) 是用于安全存储可供多个主机访问的加密密钥的设备。负载均衡器接收客户端请求并将请求路由到运行应用程序的后端服务器。密钥库可以在云计算环境中定义为集中的、安全的密钥存储。\n\
  \n\n\n\n\n### 3\n**A.** 硬件安全模块 (`HSM`) 是一种用于安全存储加密密钥的设备，多个主机可以访问这些密钥。在云云中，托管型 HSM\
  \ 解决方案被称为 HSM 即服务 (`HSMaaS`)。\n\n**B, C,** 和 **D** 是错误的。负载均衡器接受客户端应用程序请求，并将这些请求路由到运行该应用程序的后端服务器。可信平台模块\
  \ (`TPM`) 安全固件嵌入在某些计算机系统中，并支持启动过程的完整性以及该机器使用的加密密钥的存储。密钥库（Key vaults）可以在云计算环境中定义为中心化的、安全的密钥存储器。\n\
  \n### 4\n**C.** 许多磁盘加密解决方案允许通过可移动 USB 驱动器提供解密密钥，这通常用于替代可信平台模块 (`TPM`) 固件密钥存储。\n\n\
  **A, B,** 和 **D** 是错误的。硬件安全模块 (`HSM`) 是一种用于安全存储加密密钥的设备，多个主机可以访问这些密钥；这在此场景中并不适用，因为必须使用本地密钥。组策略可向\
  \ Windows 计算机部署设置，包括与 BitLocker 磁盘加密相关的设置，但答案并未指明 BitLocker 设置。IP 安全 (`IPSec`) 是一种网络安全协议，而不是磁盘加密解决方案。\n\
  \n### 5\n**D.** 开放系统模型 (`OSI`) 模型的第 4 层是传输层，它可以使用用户数据报协议 (`UDP`) 或传输控制协议 (`TCP`)\
  \ 端口号来识别运行在主机上的网络服务。端口号是第 4 地址。\n\n**A, B,** 和 **C** 是错误的。`OSI` 模型的第 3 层（网络层）关注于网络包的路由；这适用于网际协议\
  \ (`IP`) 等协议。IP 地址也称为第 3 地址。`OSI` 模型的第 5 层（会话层）涉及网络会话的创建、维护和最终终止。`OSI` 模型的第 2 层（数据链路层）关注于设备如何访问传输介质以传输数据。网络接口的\
  \ 48 位媒体访问控制 (`MAC`) 地址是第 2 地址。\n\n### 6\n**D.** 安全外壳 (`SSH`) 通常用于远程管理网络设备以及 Unix\
  \ 和 Linux 主机。标准的 SSH 端口号是 `TCP` 端口 22。\n\n**A, B,** 和 **C** 是错误的。用于连接到 Telnet 守护程序的\
  \ Telnet 协议（使用明文传输，应避免）使用 `TCP` 端口 23。轻量级目录访问协议 (`LDAP`) 使用 `TCP` 端口 389。`LDAP`\
  \ 用于查询网络配置数据库，该数据库可以分布在多个服务器上以允许用户登录等。安全超文本传输协议 (`HTTPS`) 是一种到 Web 服务器的加密 HTTP 连接，通常使用\
  \ `TCP` 端口 443。\n\n### 7\n**C.** 端口扫描器可以扫描单个主机或多个主机的开放端口。\n\n**A, B,** 和 **D** 是错误的。虽然漏洞扫描器也可以识别开放端口，但它们运行速度没有端口扫描器快，因为它们尝试识别每个主机上可能存在的多种漏洞。硬件安全模块\
  \ (`HSM`) 是一种用于安全存储加密密钥的设备，多个主机可以访问这些密钥。如 Wireshark 等数据包分析器可以捕获网络流量，然后对其进行分析；这类工具的设计并不是为了识别开放端口。\n\
  \n### 8\n**C.** `TCP` 端口 443 是标准的 HTTPS 端口。当 HTTP 和 HTTPS 使用标准端口号时，用户不需要在浏览器地址栏中输入端口号。\n\
  \n**A, B,** 和 **D** 是错误的。简单邮件传输协议 (`SMTP`) 使用 `TCP` 端口 25 将电子邮件传输到其他 `SMTP` 主机。超文本传输协议\
  \ (`HTTP`) 使用 `TCP` 端口 80 允许连接到 Web 服务器，而 HTTPS 是安全连接，意味着 Web 服务器已配置了 PKI 证书。`TCP`\
  \ 和 `UDP` 端口 3389 用于远程桌面协议 (`RDP`)，它允许对 Windows 主机进行远程 GUI 管理。\n\n### 9\n**A.**\
  \ 端口转发允许设备在配置的端口上监听，例如 `https://mydevice.local:2000`。如果您正在使用 HTTPS 连接设备，端口号将跟在 IP\
  \ 地址或主机名之后，并跟有一个完整的冒号（:`），例如 `https://mydevice.local:2000`。\n\n**B, C,** 和 **D**\
  \ 是错误的。传输层安全 (`TLS`) 是一种取代套接层 (`SSL`) 的网络安全协议，通常用于保护 HTTPS。负载均衡器接受客户端应用程序请求，并将这些请求路由到后端服务器。虚拟专用网络\
  \ (`VPNs`) 在端点之间提供加密隧道，流量可以通过该隧道在不可信的网络上安全地传输。\n\n### 10\n**B.** 简单邮件传输协议 (`SMTP`)\
  \ 邮件服务器默认使用 `TCP` 端口 25 进行通信。\n\n**A, C,** 和 **D** 是错误的。`SMTP` 服务器不监听 80 端口。起始文件和结束文件都必须包含\
  \ 25，尽管它是一个单一端口号而不是范围。\n\n### 11\n**A.** 超文本传输协议 (`HTTP`) 通常使用 `TCP` 端口 80，因此在这种情况下不应使用该端口。\n\
  \n**B, C,** 和 **D** 是错误的。`UDP` 端口 88 通常用于 Kerberos 网络身份验证协议；微软目录域服务使用 Kerberos 进行身份验证。安全套接协议\
  \ (`SOCKS`) 代理用户连接，通常是为了绕过防火墙过滤。这意味着端点之间的所有通信都通过 SOCKS 代理进行，源设备的 IP 地址将更改为 SOCKS\
  \ 代理的地址，以便连接远程网络上的其他设备。`SOCKS` 通常使用 `TCP` 端口 1080。显式 HTTP 代理服务器通常使用 `TCP` 端口 8080，用于客户端设备到\
  \ HTTP Web 服务器的 HTTP 连接；SOCKS 服务器不限于 HTTP 连接。另一方面，HTTP 代理可以缓存请求的内容以加快后续请求。透明 HTTP\
  \ 代理通常监听 `TCP` 端口 80 或 443，且不需要客户端配置代理服务器的名称或 IP 地址以及端口号。\n\n### 12\n**A.** `sudo`\
  \ 命令用于在未使用 root 账户登录时以提升权限运行其他命令（出于安全考虑，不建议使用 root 登录）。更改默认端口号（例如 `SSH` 的 `TCP`\
  \ 22）是加固网络服务的方法。对客户数据文件进行哈希处理可以判断数据是否被篡改，但加密可以确保只有授权人员才能读取客户数据。\n\n\n\n\n\n![Images](img/com-1.jpg)\
  \ **B, C,** 和 **D** 是错误的。应该使用 `sudo` 命令来运行需要高权限的命令，而不是一直以 root 用户身份登录。文件哈希提供数据完整性，但不像加密那样提供数据机密性。默认\
  \ SSH 端口号 (22) 正在使用，因此将端口 80 更改为其他端口并无效。\n\n### 13\n![Images](img/com.jpg) **C.**\
  \ Windows `regedit` 命令允许 Windows 管理员查看和修改注册表项、导入和导出注册表设置，并为注册表的不同部分设置权限。\n\n![Images](img/com-1.jpg)\
