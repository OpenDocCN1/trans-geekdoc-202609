  \ of agreement）是一个通用术语，通常适用于合同条款，例如分包商将如何提供材料和服务。在 IT 安全领域，公开披露涉及对已发现的产品漏洞报告，或对可能涉及数据泄露的网络安全事件报告。\n\
  \n## 第 4 章\n\n### 攻击类型\n\n## 认证目标\n\n- 4.01 社会工程学攻击\n- 4.02 网络攻击，如二层攻击、DDoS、DNS\
  \ 和中间人攻击（MiTM）攻击\n- 4.03 密码和加密攻击\n- 4.04 物理攻击和应用攻击\n\n## 问题\n\n对于职场中的任何安全专业人员来说，理解不同类型的攻击都非常重要，但对于\
  \ CompTIA Security+ 认证考试来说同样重要，因为你肯定会在考试中看到与不同类型攻击相关的问题。\n\n社会工程学攻击涉及攻击者通过电子邮件、电话或面对面与人员联系，并试图欺骗他人以破坏安全。你还需要熟悉不同类型的应用程序攻击，例如如今非常流行的缓冲区溢出攻击，以及\
  \ SQL 注入攻击（后者通常针对在开发时没有考虑编程最佳实践的网站进行攻击）。你还应该熟悉考试中涉及的各种密码攻击，例如字典攻击、混合攻击和暴力破解。本章旨在帮助你复习这些关键点。\n\
  \n**1.** 在某位用户抱怨互联网速度慢后，你正在检查她的系统。在分析系统后，你发现 `ARP` 缓存中的默认网关引用了一个未知的 MAC 地址。发生了哪种攻击？\n\
  \nA. 暴力破解\nB. DNS 投毒\nC. 缓冲区溢出\nD. ARP 投毒\n\n**2.** 你想实施一种安全控制措施来限制高安全环境中的尾随进入。你会使用以下哪种保护控制措施？\n\
  \nA. 刷卡\nB. 人员室（Mantrap）\nC. 锁上的门\nD. CMOS 设置\n\n**3.** 下列哪种描述最好了缓冲区溢出攻击？\n\nA.\
  \ 向网页中注入数据库代码\nB. 使用字典文件破解密码\nC. 向应用程序发送过多数据，导致攻击者能够运行任意代码\nD. 修改数据包源地址\n\n**4.**\
  \ 你正在分析传输到你的 Web 服务器的流量，你注意到有人正以用户名 Bob 和密码“'pass' or 1=1--”的身份登录。以下哪项描述了正在发生的情况？\n\
  \nA. XML 注入\nB. SQL 注入攻击\nC. LDAP 注入\nD. 拒绝服务\n\n**5.** 你网络上的一个用户收到来自银行的一封邮件，称银行发生了安全事件。邮件要求用户点击链接登录其银行账户并验证账户是否被篡改。这是哪种攻击？\n\
  \nA. 钓鱼\nB. 垃圾邮件\nC. 字典攻击\nD. Im\n\n**6.** 哪种攻击涉及数据包的源地址？\n\nA. XMAS 攻击\nB. 鱼叉式网络钓鱼\n\
  C. 欺骗（Spoof）\nD. 农场攻击（Farming）\n\n**7.** 攻击者在获得系统访问后可能会修改哪些文件以实现重定向？\n\nA. `/etc/passwd`\n\
  B. Hosts\nC. SAM\nD. Services\n\n**8.** 哪种攻击涉及攻击者向服务发送过多数据导致获得管理员权限？\n\nA. 生日攻击\n\
  B. 域名抢注（Typosquatting）\nC. 窃听\nD. 缓冲区\n\n**9.** 以下哪些方法可以防止网络上的 ARP 投毒？（多选）\n\nA.\
  \ 静态 ARP\nB. 补丁\nC. 防病毒软件\nD. 物理安全\nE. 防火墙\n\n**10.** 作为网络管理员，你应该做什么来帮助防止系统发生缓冲区溢出攻击？\n\
  \nA. 静态 ARP\nB. 防病毒软件\nC. 物理安全\nD. 补丁\n\n**11.** 下列哪个词是指反复注册并删除以避免支付费用的域名？\n\nA.\
  \ DNS 重定向\nB. 域名投毒\nC. 域名\nD. 传输\n\n**12.** 你收到许多客户电话，称网站响应缓慢。你分析了流量，发现该 Web 服务器接收到大量格式错误的请求。发生了哪种攻击？\n\
  \nA. 窃听\nB. 拒绝服务\nC. 中间人\nD. 社会\n\n**13.** 雪花攻击（smurf attack）属于哪种攻击？\n\nA. 分布式拒绝服务\
  \ (DDoS)\nB. 拒绝服务 (DoS)\nC. 权限提升\nD. 恶意内部威胁\n\n**14.** 你的经理确保实施了一项政策，要求所有员工粉碎敏感文件。你的经理希望防止哪种攻击？\n\
  \nA. 尾随进入\nB. 拒绝服务\nC. 社会工程学\nD. 翻垃圾找\n\n**15.** 哪种攻击涉及攻击者在网页中插入客户端脚本？\n\nA. XSS\n\
  B. 钓鱼场攻击\nC. ARP 投毒\nD. SQL 注入\n\n**16.** 你的经理读到了关于 SQL 注入攻击的内容并想对于内部开发的应用程序可以采取什么保护措施。你会建议什么？\n\
  \nA. 补丁\nB. 防病毒软件\nC. 输入验证\nD. 包过滤防火墙\n\n\n\n\n\n### [17]\n一名坐在互联网咖啡厅的攻击者通过 ARP\
  \ 投毒了连接到无线网络的所有设备，使得所有流量在由其路由到互联网之前都会通过攻击者的笔记本电脑。这是哪种类型的攻击？\n\nA. 彩虹表 (Rainbow tables)\n\
  B. 中间人攻击 (Man-in-the-middle)\nC. DNS 投毒 (DNS poison)\nD. 欺骗 (Spoofing)\n\n### [18]\n\
  以下哪项最能描述零日攻击（zero-day attack）？\n\nA. 修改数据包源地址的攻击\nB. 将计算机日期更改为 00/00/00 的攻击\nC.\
  \ 从不发生的攻击\nD. 使用产品厂商尚未察觉的漏洞的攻击\n\n### [19]\n你硬盘上哪种类型的文件存储了网站的偏好设置？\n\nA. Cookie\n\
  B. Hosts\nC. LMHOSTS\nD. 附件 (Attachment)\n\n### [20]\n哪种攻击涉及攻击者断开通信双方之一，并在冒充该系统的情况下继续通信？\n\
  \nA. 浏览器中间人 (Man in the browser)\nB. 拒绝服务 (DoS)\nC. SQL 注入 (SQL injection)\nD. 会话劫持\
  \ (Session hijacking)\n\n### [21]\n哪种密码攻击涉及使用字典文件并对字典文件中的单词进行修改？\n\nA. 字典攻击 (Dictionary\
  \ attack)\nB. 暴力破解攻击 (Brute-force attack)\nC. 混合攻击 (Hybrid attack)\nD. 修改攻击 (Modification\
  \ attack)\n\n### [22]\n以下哪种防御措施旨在防止暴力破解密码攻击？\n\nA. 补丁 (Patching)\nB. 账户锁定 (Account\
  \ lockout)\nC. 密码复杂度 (Password complexity)\nD. 强密码 (Strong passwords)\n\n### [23]\n\
  公司内的三名员工接到了个人电话，对方询问个人财务信息。正在发生哪种攻击？\n\nA. 钓鱼攻击 (Phishing)\nB. 捕鲸鱼攻击 (Whaling)\n\
  C. 尾随 (Tailgating)\nD. 语音钓鱼 (Vishing)\n\n### [24]\nTom 被告知下载一个免费的税收程序来完成今年的报税。下载并安装软件后，Tom\
  \ 注意到他的系统运行缓慢，并收到了防病毒软件的通知。他安装了哪种恶意软件？\n\nA. 键盘记录器 (Keylogger)\nB. 特木马 (Trojan)\n\
  C. 蠕虫 (Worm)\nD. 逻辑炸弹 (Logic bomb)\n\n### [25]\nJeff 最近报告说他的手机收到了大量的垃圾短信。正在发生哪种攻击？\n\
