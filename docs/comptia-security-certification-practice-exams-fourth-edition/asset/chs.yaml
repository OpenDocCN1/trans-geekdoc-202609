  \n4. ![Images](img/com.jpg) **B.** 邮件服务器日志将揭示 SMTP 活动，例如过量的出 SMTP 流量。对日志的实时活动监控和长期趋势分析可以立即提醒管理员；这是安全传感器（如入侵检测系统\
