  \n### 32\n在图 3-3 中，将左侧的术语与右侧的描述匹配。注意，右侧某些描述在左侧没有对应的术语。\n\n![Images](img/fig3-3.jpg)\n\
  \n**图 3-3**\n安全术语与描述\n\n### 33\n你指示 Web 应用开发人员为网站访问者包含一条消息，详细说明如何处理和他们的数据。Web 应用开发人员应该在网站上添加什么？\n\
