  你收到来自银行的短信，称你的银行账户已被封锁。信息要求你立即点击链接激活账户。这是哪种攻击？\n\nA. 扫射 (Spraying)\nB. 侧读 (Skimming)\n\
  C. 卡片复制 (Card cloning)\nD. 短信钓鱼 (Smishing)\n\n### [38]\n攻击者获取了你的 LAN 连接，然后使用 SETH\
