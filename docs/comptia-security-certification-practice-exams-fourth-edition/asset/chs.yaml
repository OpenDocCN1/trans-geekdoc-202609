  \ **C** 和 D。当计算机系统启动时，执行的第一条固件指令是基本输入输出系统 (BIOS) 或新的统一扩展固件接口 (UEFI) 标准，后者支持安全启动和更大的存储设备等安全功能。当启用安全启动时，只有未被篡改（例如未被恶意软件感染操作系统启动文件）的可信任操作系统\
  \ (OS) 可以在计算机上启动。可信平台模块 (TPM) 是计算设备内的固件芯片，确保设备启动完整性并存储用于加密存储设备的加密密钥。\n\n![Images](img/com-1.jpg)\
