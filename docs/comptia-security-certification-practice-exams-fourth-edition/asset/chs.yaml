  - 4: C\n- 5: D\n- 6: D\n- 7: D\n- 8: B\n- 9: 参见深度解析\n- 10: C\n- 11: B, C\n- 12:\
  \ A\n- 13: A\n- 14: B\n- 15: A, C\n- 16: B\n- 17: B\n- 18: D\n- 19: A, D\n- 20:\
  \ D\n- 21: C\n- 22: C\n- 23: B\n- 24: C, D\n- 25: A\n- 26: B\n- 27: D\n- 28: A,\
  \ C\n- 29: A, C\n- 30: D\n- 31: C\n- 32: 参见深度解析\n\n## 深度解析\n\n#### 1\n![Images](img/com.jpg)\n\
  **B.** 支付行业数据安全标准（`PCI DSS`）为处理信用卡信息的环境提供了安全指导。\n\n![Images](img/com-1.jpg)\n**A,\
  \ C, 和 D** 是错误的。欧盟（`EU`）通用数据保护条例（`GDPR`）旨在保护欧盟公民的敏感数据。在美国，《健康保险流动与责任法案》（`HIPAA`）旨在保护敏感的医疗患者信息。《个人信息保护和电子文件法》（`PIPEDA`）是加拿大的法律。\n\
  \n#### 2\n![Images](img/com.jpg)\n**A.** `GDPR` 旨在保护欧盟公民的数据。\n\n![Images](img/com-1.jpg)\n\
  **B, C, 和 D** 是错误的。`PCI DSS` 为处理信用卡信息的环境提供了安全指导。`HIPAA` 旨在保护敏感的医疗患者信息。`PIPEDA` 是保护隐私的法律。\n\
  \n#### 3\n![Images](img/com.jpg)\n**C.** `HIPAA` 旨在保护敏感的医疗患者信息。\n\n![Images](img/com-1.jpg)\n\
  **A, B, 和 D** 是错误的。`GDPR` 旨在保护欧盟公民的数据。`PCI DSS` 为处理信用卡信息的环境提供了安全指导。`PIPEDA` 是保护隐私的法律。\n\
  \n#### 4\n![Images](img/com.jpg)\n**C.** 输入验证用于防止意外字符或数据发送到服务器。这可以防止敏感数据泄露。\n\n\
  ![Images](img/com-1.jpg)\n**A, B, 和 D** 是错误的。`HTTPS` 增加了传输的安全性。更改设置可以加固服务器，应用更新也是。这些都不是\
  \ SQL 注入的防御措施。\n\n#### 5\n![Images](img/com.jpg)\n**D.** 专用接口连接到专用网络。由于不存在用户流量，这将保护设备免受远程桌面协议（`RDP`）和安全外（`SSH`）的攻击。\n\
  \n![Images](img/com-1.jpg)\n**A, B, 和 C** 是错误的。虽然 `HTTPS` 增加了传输的安全性，但它并没有专门针对 `RDP`\
  \ 和 `SSH` 攻击。定期的漏洞扫描很重要，但它专注于远程管理，因此无法防御攻击。`SSH` 公钥认证优于用户名和密码认证，结合专用接口可以提供安全的管理解决方案。\n\
  \n#### 6\n![Images](img/com.jpg)\n**D.** 跳板机是连接公共网络和私有网络的主机。在成功身份验证跳板机后，管理员可以远程连接到私有网络上的主机。这防止了主机暴露在公共网络。\n\
  \n![Images](img/com-1.jpg)\n**A, B, 和 C** 是错误的。没有任何列出的解决方案像跳板机那样安全，跳板机防止了从互联网直接访问。允许通过\
  \ `HTTPS`、`IPv6` 或 `PowerShell 远程` 从外部发起直接访问内部虚拟机，会带来比通过跳板机间接访问更大的安全风险。原因之一是跳板机可能只能通过非标准端口号或\
  \ `VPN` 访问。\n\n#### 7\n![Images](img/com.jpg)\n**D.** 数据掩码将敏感字符（如信用卡数字）替换为其他字符（例如星号\
  \ `*`）。通常只显示信用卡的最后四位。数据掩码是许多数据库解决方案中的可用选项。\n\n\n\n\n\n## 8\n![Images](img/com.jpg)\n\
  **B.** 管理支持对于成功实施企业安全策略至关重要。\n\n![Images](img/com-1.jpg)\n**A, C,** 和 **D** 是错误的。只有在获得管理层批准并制定了适当政策后，才发放智能手机。法律顾问可以是政策制定过程的重要组成部分，但在制定政策的草案之前，必须先获得管理层的批准。\n\
  \n## 9\n![Images](img/com.jpg)\n范围：**E**，概览：**A**，策略：**D**，定义：**C**，执行：**B**\n\n\
  ## 10\n![Images](img/com.jpg)\n**C.** 过程性策略为配置服务器提供了逐步的说明。\n\n![Images](img/com-1.jpg)\n\
  **A, B,** 和 **D** 是错误的。可接受使用策略通常是以用户为中心的项目文档，概述了适当计算使用的规则和规定，它们并不提供逐步的指令。\n\n##\
  \ 11\n![Images](img/com.jpg)\n**B** 和 **C.** 个人身份信息 (PII) 是能够唯一识别个人的数据，例如手机号码或数字证书。必须实施适当的安全控制措施以防止身份盗用，这包括使用伪匿名化来防止数据追溯到个人。\n\
  \n![Images](img/com-1.jpg)\n**A** 和 **D** 是错误的。NAT 设备的公共 IP 地址识别的是网络，而不是从该私有网络发起连接的特定主机。相同的私有\
  \ IP 地址可以在不同的私有网络中使用。性别是一种通用的分类，单凭无法唯一识别一个人。\n\n## 12\n![Images](img/com.jpg)\n\
  **A.** 因为 Tammy 将使用公司设备访问互联网，她应该阅读并签署互联网可接受使用策略。\n\n![Images](img/com-1.jpg)\n**B,\
  \ C,** 和 **D** 是错误的。密码策略规定了密码必须更改的频率等规则。服务水平协议是合同文件，保证了服务提供商与服务用户之间约定的特定质量、可用性和责任。远程访问可接受使用策略定义了如何安全地访问网络（例如通过\
  \ VPN）。\n\n## 13\n![Images](img/com.jpg)\n**A.** 最小密码年龄是指在更改密码之前必须经过的时间段。这防止了用户在短时间内多次更改密码以重用旧密码。\n\
  \n![Images](img/com-1.jpg)\n**B, C,** 和 **D** 是错误的。最大密码年龄定义了必须更改密码的间隔——在本例中为 60\
  \ 天。密码复杂度防止用户使用简单的密码（例如用户名的变体）。密码历史记录记录防止了重复使用密码。\n\n## 14\n![Images](img/com.jpg)\n\
  **B.** 服务水平协议是一份合同，规定了可以从第三方处期望的服务水平和可用性。\n\n![Images](img/com-1.jpg)\n**A, C,**\
  \ 和 **D** 是错误的。密码策略规定了如何实施用户密码行为。远程访问可接受使用策略规定了用户如何安全地远程访问公司网络——例如在旅行时从家里或酒店访问。移动设备可接受使用策略规定了如何使用移动设备开展业务。\n\
  \n## 15\n![Images](img/com.jpg)\n**A** 和 **C.** 正确使用 PII 意味着不向第三方透露个人或实体的信息。执法部门使用\
  \ IP 地址追踪罪犯以及使用指纹扫描仪登录都是 PII 的正当用途。\n\n![Images](img/com-1.jpg)\n**B** 和 **D** 是错误的。分发电子邮件联系列表是对\
  \ PII 的不当使用。尽职调查并不意味着 PII。\n\n## 16\n![Images](img/com.jpg)\n**B.** 职责分离需要多个人来完成某个过程，例如控制防火墙及其规则。\n\
  \n![Images](img/com-1.jpg)\n**A, C,** 和 **D** 是错误的。尽责意味着实施策略以纠正安全问题。最小权限原则要求用户仅拥有完成工作所需的权限；虽然这个答案适用于此情况，但职责分离是一个更有有力的答案。可接受使用指的是恰当的行为。\n\
  \n## 17\n![Images](img/com.jpg)\n**B.** 最小权限原则规定应授予人员完成工作所需的最小访问权限。\n\n![Images](img/com-1.jpg)\n\
  **A, C,** 和 **D** 是错误的。岗位轮换出于各种原因（如员工提升或接触更广泛范围）定期将人员从一个工作调到另一个工作的做法。与岗位轮换一样，强制假期用于检测潜在的欺诈。职责分离防止单个个人对业务流程进行端端的控制。\n\
  \n## 18\n![Images](img/com.jpg)\n**D.** 如果 Juan 通过网络钓鱼演练了解网络钓鱼，他就会忽略那封邮件。\n\n![Images](img/com-1.jpg)\n\
  **A, B,** 和 **C** 是错误的。根据适用法律，此类犯罪的犯罪者可能会被指控欺诈。即使是最强的密码，如果用户自愿泄露，也没有意义。工作站防火墙无法防止网络钓鱼。\n\
  \n## 19\n![Images](img/com.jpg)\n**A** 和 **D.** 受限制和机密是安全标记的示例。支票上的签名被认为是 PII，因为它是个人特征。\n\
  \n![Images](img/com-1.jpg)\n**B** 和 **C** 是错误的。PII 也适用于其他个人特征，如语音、笔迹等。变更管理确保在 IT\
  \ 配置的整个生命周期应用标准化程序。\n\n## 20\n![Images](img/com.jpg)\n**D.** 了解强制假期意味着员工不太可能从事不当业务行为，因为当休假员工不在办公室期间有人填补职位时，他们可能会发现任何异常。\n\
  \n![Images](img/com-1.jpg)\n**A, B,** 和 **C** 是错误的。遵守法规不是强制休假的主要目的，因为这属于安全策略。精神焕新的员工往往生产率更高，但这不是强制休假的主要原因。岗位轮换政策允许其他员工在额外的职位中获得经验；虽然这会发生在休假员工身上，但这不是最佳答案。\n\
  \n## 21\n![Images](img/com.jpg)\n**C.** 根据美国的 HIPAA 规则，指纹被认为是保护健康信息 (PHI)。\n\n![Images](img/com-1.jpg)\n\
  **A, B,** 和 **D** 是错误的。虽然教育和就业记录以及信用历史被认为是 PII，但它们不被认为是 PHI。\n\n\n\n\n\n## [22]\n\
  ![Images](img/com.jpg) **C.** 洁净桌面策略要求纸质文件必须安全存储（不能遗留在桌面上），以防止恶意用户获取。\n\n![Images](img/com-1.jpg)\
  \ **A, B,** 和 **D** 是错误的。虽然洁净桌面策略是保护敏感信息的若干隐私策略之一，但问题特指洁净桌面策略，因此这不是最佳答案。可接受使用策略规范了公司资产的正确使用。密码策略控制用于身份验证的密码的所有方面，而不是保护纸质文件。\n\
  \n## [23]\n![Images](img/com.jpg) **B.** 人们在社交网络网站上的言往往比在任何其他地方都更自由。暴露公司敏感信息可能会引发问题。\n\
  \n![Images](img/com-1.jpg) **A,** **C,** 和 **D** 是错误的。了解计算机的 `IP` 地址与社交网络风险无关。在图片中秘密嵌入信息并非专门与社交网络相钩的威胁。信用卡号通常不会通过社交网络被盗取。\n\
  \n## [24]\n![Images](img/com.jpg) **C** 和 **D.** 保密协议（`NDAs`）用于确保员工或承包商可能接触到的敏感数据不会泄露到组织之外。在员工入职时（以及签署其他合同时），会签署\
  \ `NDA`；提醒离开组织的员工他们有不违反 `NDAs` 的责任是非常重要的。当员工离开组织（员工离职）时，必须将任何设备、访问代码、通行证和钥匙交还给公司。这在财产归还单上进行了形式化和记录。\n\
