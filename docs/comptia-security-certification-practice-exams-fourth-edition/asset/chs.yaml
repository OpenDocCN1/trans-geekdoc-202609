  \n\n**图 1-7**\n\n负载均衡器配置设置\n\n31.** 为使用后端 SQL Server 数据库的 Web 应用程序配置了主主（active-active）负载均衡器。并发有多少个\
  \ SQL 数据库实例？\n\nA. 无\nB. 一个\nC. 两个\n\n32.** 你配置了两个负载器协同工作。第一个负载均衡器将所有客户端流量路由到后端服务器，而第二个负载器处于空闲状态。这是什么类型的配置？\n\
  \nA. 主主（Active-active）\nB. 主备（Active-passive）\nC. 主调度（Active-scheduled）\nD. 主持久（Active-persistent）\n\
  \n## 快速答案\n\n[1] A, D\n[2] B\n[3] D\n[4] C\n[5] B\n[6] C, D\n[7] C\n[8] B\n[9] D\n\
  [10] C\n[11] A\n[12] D\n[13] C\n[14] A\n[15] B\n[16] A, B\n[17] D\n[18] A\n[19]\
  \ A\n[20] D\n[21] A\n[22] C\n[23] A, B\n[24] B\n[25] D\n[26] D\n[27] A, B\n[28]\
  \ D\n[29] C\n[30] B\n[31] D\n[32] B\n\n## 深度解析\n\n1.** ![Images](img/com.jpg) A\
  \ 和 D。负载均衡器提高了应用程序性能，因为有一个后端服务器池可以处理请求，而不是单个服务器，这意味着这些服务器可以处理可能发生的额外负载。应用程序可用性提高了，因为有一个后端服务器池提供服务。后端服务器故障意味着客户端请求将由运行良好的后端服务器提供。\n\
  \n![Images](img/com-1.jpg) B 和 C 是错误的。负载均衡与增加应用程序安全性没有直接关系，即使使用了套接层/传输层安全（`SSL/TLS`）终止。部署负载均衡器并不一定能实现法规规定。\n\
  \n2.** ![Images](img/com.jpg) B。在负载均衡器后配置多个服务器允许在这些服务器之间分进入流量。这提高了繁忙 Web 应用程序的性能并增加了可用性，因为有多个服务器托管同一个应用程序。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 是错误的。增加内存有时可以提高计算设备的性能，但这里的问题是基于网络性能的。路由器在网络之间传输数据时确定使用的最佳路径。它们不是用于增加到\
  \ Web 服务器的网络性能的。`SSL` 安全网络传输，与提高 Web 服务器的网络性能无关。\n\n3.** ![Images](img/com.jpg)\
  \ D。最小连接算法确保流量发送到活动连接数最少的后端服务器。\n\n![Images](img/com-1.jpg) A、B 和 C 是错误的。轮询（round\
  \ robin）算法将流量发送到第一个后端节点，然后是第二个、第三个，回到第一个依此类推。加权轮询与轮询类似，不同在于它还考虑了整体计算能力，因此性能最好的服务器优先获得流量。随机算法正如其名，将客户端流量随机路由到后端服务器。\n\
  \n4.** ![Images](img/com.jpg) C。主备配置由两个负载均衡器组成，其中一个活动状态。当活动负载均衡器无响应时，第二个负载均衡器将接管。\n\
  \n![Images](img/com-1.jpg) A、B 和 D 是错误的。轮询和最小连接是负载均衡器的调度算法，与多个负载均衡器的容错性无关。主主意味着两个负载均衡器同时工作并协作分进入流量到后端节点。\n\
  \n5.** ![Images](img/com.jpg) B。虚拟 IP 地址（负载均衡器 IP 地址）被分配给活动负载均衡器。这是 DNS 名称必须解析的外部地址。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 是错误的。主备负载均衡器配置中不交换 MAC 地址，第一个后端服务器 IP 地址也是如此。\n\
  \n\n\n\n\n## 6\n**C** 和 **D.** 负载均衡器的入站 NAT 规则允许将进入负载均衡器的特定端口流量（例如用于 Linux 管理的 `SSH`）映射到仅配置了私有\
  \ IP 地址的内部主机。跳板机（jump box）带有至少两个网络接口的物理或虚拟服务器，且禁用了接口之间的路由。一个跳板机接口连接到公共网络，另一个接口连接到内部网络。通过跳板机验证后，管理员可以使用它作为连接内部主主机。\n\
  \n**A** 和 **B** 是错误的。出于安全考虑，每个后端 Linux 实例不应直接通过公共 `IPv4` 或 `IPv6` 地址直接暴露在互联网上。\n\
  \n## 7\n**C.** 在负载均衡器上配置 `SSL/TLS` 终止可以从每个后端服务器上卸载这种计算密集型操作。这意味着进出负载均衡器的网络连接将使用\
  \ `HTTPS` 保护。负载均衡器与后端服务器之间的流量不使用 `HTTPS` 保护。\n\n**A, B,** 和 **D** 是错误的。`SSL/TLS`\
  \ 透（pass-through）在每个后端服务器上使用 `HTTPS` 配置；在这种场景下需要禁用它以减少每个后端服务器的负载。`IPSec` 保护面向 Web\
  \ 应用的效果不如 `HTTPS`，因此不应为此负载均衡器上配置 `IPSec`。负载均衡器可以配置自定义 DNS 名称以匹配 PKI 证书中的现有 DNS 名称。需要更改\
  \ DNS 记录以将 DNS 名称解析到负载均衡器的 IP 地址。\n\n## 8\n**B.** `OSI` 模型的第 7 层（应用层）允许访问包括有效负载在内的所有数据包内容；因此，负载均衡器可以检查\
  \ `URLs` 以确定哪些后端服务器应该接收请求。\n\n**A, C,** 和 **D** 是错误的。`OSI` 第 7 层不适用于 `IP` 地址（第 3\
  \ 层）、`MAC` 地址（第 2 层）或端口号（第 4 层）。\n\n## 9\n**D.** 轮询负载均衡，到负载均衡器的每个客户端请求都会按顺序路由到下一个后端服务器，一个接一个地。\n\
  \n**A, B,** 和 **C** 是错误的。固定权重负载均衡使用分配的“权重”值，优先级权重值较高的服务器接收最多的请求。`Source IP hashing`（源\
  \ IP 哈希）根据请求的源目的 `IP` 地址生成哈希值，以确定由哪个后端服务器处理请求；它并不是如图所示的顺序执行。`最小连接负载均衡`确保将流量发送到活动连接数最少的后端服务器。\n\
  \n## 10\n**C.** 负载均衡器可以配置为使用健康探测定期在给定端口号上测试与后端服务器的连通性。无响应的后端服务器被标记为不健康且不接收客户端应用请求。\n\
  \n**A, B,** 和 **D** 是错误的。列出的项目均未定义配置负载均衡器健康探测的目的。健康探测用于确保负载均衡的后端服务器是有响应的，而不是检查互联网或负载均衡器的连通性，或比较性能指标。\n\
  \n## 11\n**A.** 负载均衡源 `IP` 亲性（也称为客户端 `IP` 亲性）确保客户端在应用程序会话期间连接到同一个后端主机。\n\n![Images](img/com-1.jpg)\n\
  \n**D.** `IPv6` 地址长度为 128 位，表示为八组 16 位的十六进制字符，每组之间用冒号隔开。\n\n**A, B,** 和 **C** 是错误的。列出的值均未正确表示\
  \ `IPv6` 地址的位数。\n\n## 13\n**C.** `ping` 命令可以用于测试 `IPv6` 功能；环回地址为 `0:0:0:0:0:0:1`。双冒号表示一系列零。\n\
  \n**A, B,** 和 **D** 是错误的。`ipconfig` 不用于测试 `IPv6`；`127.0.0.1` 是 `IPv4` 环回地址；`0:0:0:0:0:0:1`\
  \ 是 `IPv6` 环回地址。\n\n## 14\n**A.** 使用 `FE80` 前缀的 `IPv6` 地址自动分配并用于局域网连接，而非公共互联网连接。\n\
  \n**B, C,** 和 **D** 是错误的。IPv6 主机始终具有这种地址，无论是配置静态地址还是使用 `DHCP`。\n\n## 15\n**B.**\
  \ 控制消息协议（ICMP）负责 `IPv4` 和 `IPv6` 中的错误和状态信息。\n\n**A, C,** 和 **D** 是错误的。传输控制协议（TCP）负责建立和维护\
  \ `TCP` 会话以及确认传输接收。用户数据报协议（UDP）是一种尽力传输方法，不建立会话也不确认数据包接收。网协议（IP）负责将流量路由到目的地。\n\n\
  ## 16\n**A** 和 **B** 是错误的。使用 `FE80` 前缀的 `IPv6` 地址是链路本地地址。`IPv6` 中的双冒号表示一系列零，且在一个地址中只能使用一次。\n\
  \n**C** 和 **D** 是错误的。负载均衡器和后端服务器可以使用 `IPv4` 或 `IPv6` 地址。\n\n## 17\n**D.** 与池中的其他后端主机相比，为\
  \ `HOST 2` 分配更高的优先级权重意味着 `HOST 2` 将比池中的其他服务器处理更多的请求。\n\n**A, B,** 和 **C** 是错误的。较低的优先级权重会导致发送到\
  \ `HOST 2` 的请求减少。权重适用于后端主机，而不是负载均衡器本身。\n\n## 18\n**A.** 轮询将流量发送到第一个后端节点，然后是第二个、第三个，最后回到第一个，依此类推。在客户端处理能力方面，所有服务器被视为平等的。\n\
  \n\n\n\n\n\n**B**、**C** 和 **D** 是错误的。权重轮询算法与轮询算法相似，不同之处在于它还考虑了整体计算能力，因此性能最强的服务器会优先接收流量。随机算法（Random）如其名，将客户端流量随机路由到后端服务器。最少连接算法（Least\
  \ connections）确保流量发送到活动连接数最少的后端服务器。\n\n**19.** ![Images](img/com.jpg) **A.** 反向代理接受客户端请求并将其转发给内部主机或主机进行处理，从而隐藏了内部主机的真实身份。\n\
  \n\n**20.** ![Images](img/com.jpg) **D.** OSI 第 7 层（应用层）负载均衡器可以检查 URL 请求（例如可能包含媒体引用的请求），并将这些请求发送到配置为流媒体的特定后端主机。\n\
  \n![Images](img/com-1.jpg) **A**、**B** 和 **C** 是错误的。OSI 第 4 层（传输层）无法检查 URL，因此无法确定哪些请求与媒体相关。轮询算法（Round\
  \ robin）将流量发送到第一个后端节点，然后是第二个、第三个，最后回到第一个，依此类推。固定权重负载均衡使用分配的“权重”值，使得具有较高权重值的服务器接收最多的请求。\n\
  \n**21.** ![Images](img/com.jpg) **A.** `FTP` 通常正常使用 `TCP` 端口 `20` 和 `21`。\n\n\n\
  **22.** ![Images](img/com.jpg) **C.** 配置负载均衡器的持久性（persistence）设置可确保客户端会话流量继续到同一个后端服务器。当使用服务器端存储用户会话时，这尤为重要。\n\
  \n\n**23.** ![Images](img/com.jpg) **A** 和 **B.** 后端 Web 服务器可能配置为监听 `TCP` 端口 `400`，而负载均衡器\
  \ `VIP` 配置监听标准的 `HTTPS` 端口 `TCP` `443`。负载均衡器可以配置为 `SSL/TLS` 终止点，以从后端服务器卸载额外的加密/解密处理。\n\
  \n![Images](img/com-1.jpg) **C** 和 **D** 是错误的。后端服务器端口号不需要匹配负载均衡器 `VIP` 端口。`HTTPS`\
  \ 不需要多个负载均衡器。\n\n**24.** ![Images](img/com.jpg) **B.** 为了确保每个 Web 层都能优优运行，应在前端和服务器之间放置负载均衡器，在应用之间放置一个内部负载均衡器，并在数据库服务器之间放置另一个负载均衡器。\n\
  \n![Images](img/com-1.jpg) **A**、**C** 和 **D** 是错误的。冗余负载均衡器配置（如双主式或主备式）不能确保每个应用都优运行。\n\
  \n**25.** ![Images](img/com.jpg) **D.** 后端数据库应该具有复制功能，以便在一个前端服务器故障时可以使用。\n\n\n**26.**\
  \ ![Images](img/com.jpg) **D.** 邻居发现协议（`NDP`）被 `IPv6` 用于发现节点。\n\n\n**27.** ![Images](img/com.jpg)\
  \ **A** 和 **B.** `IPv4` 地址带有 `169.254` 前缀表示无法到达服务器。`IPv6` 使用 `FE80` 前缀用于本地。即使应用了静态配置，带有\
  \ `FE80` 前缀的 `IPv6` 地址也存在。由于没有默认网关，流量无法路由到远程网络。\n\n**28.** ![Images](img/com.jpg)\
  \ **D.** 当客户端需要连接到同一个后端服务器时，启用会话持久性。\n\n\n**29.** ![Images](img/com.jpg) **C.**\
  \ 健康探测定期测试后端服务器的可访问性，以判断它们是否健康。负载均衡器不会路由不健康的后端服务器。\n\n![Images](img/com-1.jpg) **A**、**B**\
  \ 和 **D** 是错误的。列出的项均未出现在图 1-6 中。“不健康阈值”字段表明这处是健康探测配置。\n\n**30.** ![Images](img/com.jpg)\
  \ **B.** 入站网络地址转换（`NAT`）规则允许负载均衡器外部的流量通过负载均衡器进入并映射到后端服务器用于管理目的。\n\n\n**31.** ![Images](img/com.jpg)\
  \ **D.** 每个后端服务器可能有一个复制的 SQL 数据库，或者每个后端服务器可能引用共享存储或托管 SQL 数据库的专用服务器。\n\n\n\n\n\n\
  \n**32.** ![Images](img/com.jpg) **B.** 主备式（active-passive）负载均衡配置将两个负载均衡连接在一起以实现高可用性，但在任何时候只有一个负载均衡处于激活状态。\n\
