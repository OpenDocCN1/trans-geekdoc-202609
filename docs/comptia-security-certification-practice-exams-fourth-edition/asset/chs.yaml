  \ **A** 和 **D.** 对于托管在本地和公共云上的 Web 应用程序存在相同的安全问题。传输层安全（`TLS`）取代了不安全且已弃用的安全套接层（`SSL`）网络安全协议，并应替代\
  \ `SSL`。公钥认证通过要求用户知道用户名，并拥有与存储在 Linux 主机上的公钥相关的私密钥，增强了 Linux 用户的登录安全性。Linux root\
  \ 账户应始终启用公钥认证。\n\n![Images](img/com-1.jpg) **B** 和 **C** 是错误的。由于 Web 应用程序是面向公众的，不应更改默认的\
  \ `HTTPS` 端口 `443`；否则用户在连接站点时需要在 URL 中输入端口号。更改默认设置并不总是恰当的。在 Windows 而不是 Linux 上托管\
  \ Web 应用程序本身并提高安全性。\n\n[2].![Images](img/com.jpg) **B** 和 **C.** 蠕虫是一种不需要人类交互即可进行繁殖并在网络上自我传播的恶意程序，它们有时会携带额外的恶意软件（蠕虫是传播机制）。\n\
  \n![Images](img/com-1.jpg) **A** 和 **D** 是错误的。键盘记录器在输入时捕捉数据。启动区病毒感染的是 `MBR`，而不是蠕虫。\n\
  \n[3].![Images](img/com.jpg) **C.** 安全配置选项有限的旧设备设备和物联网（IoT）设备应该放置在具有严格防火墙规则的隔离网络中，以限制到其他网络的流量。这样，受攻击的设备就不会与其他更敏感的系统处于同一网络中。IoT\
