  \ 是错误的。标准的 Linux 磁盘锁定不使用恢复代理。\n\n### 26\n![Images](img/com.jpg) **A.** 修改系统的 Linux\
  \ 命令需要高权限，这通过使用 `sudo` 命令前缀来实现。Linux 通防火墙 (`uwf`) 命令可以允许 TCP 端口 80 上的 HTTP 流量。\n\
  \n![Images](img/com-1.jpg) **B, C** 和 **D** 是错误的。如果没有以 root 用户身份登录或使用 `sudo` 命令前缀，管理防火墙将失败。HTTP\
  \ 使用 TCP 端口 80，而不是 443。\n\n\n\n\n\n## 27\n![Images](img/com.jpg) **C** 和 **D.**\
  \ 传输控制协议 (`TCP`) 在传输发生之前会在主机之间建立“会话”。会话建立后，传输的数据必须由接收者确认；否则，发送者将重新发送数据。许多网络服务使用\
  \ `TCP`，主机上的每个网络服务都通过端口号唯一标识。用户数据报协议 (`UDP`) 不使用会话；它只是简单地将数据传输到目标，没有接收确认。使用 `UDP`\
  \ 传输的网络服务也使用端口号。\n\n![Images](img/com-1.jpg) **A** 和 **B** 是错误的。网协议 (`IP`) 使用 IP\
  \ 地址进行路由，互联网控制消息协议 (`ICMP`) 用于测试和报告网络连接性问题；这两种协议都不使用端口号。\n\n## 28\n![Images](img/com.jpg)\
  \ **B.** 常见的 `UDP` 端口扫描形式使用 `ICMP`，它报告网络主机是否由于某些原因无法访问。这可能表明端口是关闭的。因为 `ICMP` 通常被大多数防火墙拦截，这种类型的扫描被认为不可靠。\n\
  \n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。`UDP` 端口扫描通常使用 `ICMP`，而不是特定的 `IP`、`HTTP`\
  \ 或 `SSH`。\n\n## 29\n![Images](img/com.jpg) **B** 和 **C.** 由于列出了 `TCP` 端口 22 `SSH`，设备设备可能是网络设备，例如网络交换机或\
  \ Unix/Linux 主机，因为这类设备通常默认启用了 `SSH`。\n\n![Images](img/com-1.jpg) **A** 和 **D** 是错误的。由于使用了\
  \ `TCP` 端口 22 用于 `SSH`，主机更有可能是网络设备或 Linux 主机，而不是 Windows。\n\n## 30\n![Images](img/com.jpg)\
  \ 使用默认端口号时，很容易识别正在运行的服务。`HTTPS` 使用 `TCP` 443，`RDP` 使用 `UDP` 和 `TCP` 3389，`WSUS`\
  \ 使用 `TCP` 8530 进行 HTTP 传输，而 `SSH` 使用 `TCP` 22。图 6-7 显示了正确答案。\n\n![Images](img/fig6-7.jpg)\n\
  \n**图 6-7**\n网络协议与端口号——答案\n\n## 31\n![Images](img/com.jpg) **A** 和 **D.** 默认安全外壳\
  \ (`SSH`) 端口是 `TCP` 22，而不是 2002。默认的 `ListenAddress ::` 意味着在这种情况下，主机上配置的所有 IPv6 地址都在\
  \ `TCP` 端口 2002 上监听。\n\n![Images](img/com-1.jpg) **B** 和 **C** 是错误的。2002 不是默认的 `SSH`\
  \ 端口号。双冒号 (`::`) 是一组 0 的 IPv6 简写，与 IPv4 无关。\n\n## 32\n![Images](img/com.jpg) **D.**\
  \ `HTTP` 连接使用标准的 `TCP` 80 端口号。内部段防火墙 (`ISFWs`) 用于允许或阻止内部网段之间的网络流量。\n\n![Images](img/com-1.jpg)\
  \ **A, B,** 和 **C** 是错误的。`HTTP` 通常使用 `TCP`，而不是 `UDP`。\n\n# 第 7 章：实现基于主机的安全\n\n##\
  \ 认证目标\n* 7.01 威胁检测\n* 7.02 移动无线网络安全\n* 7.03 设备加固\n\n## 问题\n\n虽然防火墙可以检查网络传输以允许或拒绝流量，但入侵检测和防御系统可以配置为检测并报告发生在网络或特定主机上的异常活动。入侵防御系统\
  \ (`IPSs`) 具有停止正在进行的攻击的能力。\n\n终端设备由用户直接使用，包括台式机、笔记本电脑、平板电脑、智能手机等。通过应用地理围栏、禁用 `Bluetooth`\
  \ 等不需要的功能以及上下文感知的认证等配置，可以实现终端设备配置和使用的加固。\n\n全设备加密以及使用自加密驱动器 (`SEDs`) 可以保护敏感数据免受未经授权的查看，而哈希可以用于判断是否发生了更改，例如对单个文件。可以部署数据丢失防护\
  \ (`DLP`) 软件以确保敏感数据不会泄露给组织内部外的未授权用户。\n\n#### 1\n你被要求部署一种安全解决方案，用于监控与特定应用程序服务器相关的活动。该解决方案能够检测并防止可疑活动。你应该部署什么？\n\
  \nA. `NIDS`\nB. `IPS`\nC. `HIDS`\nD. `HIPS`\n\n#### 2\n你需要实现一个可以配置为远程检测异常活动的工具。该解决方案必须向管理员发送警报。你应该部署什么？\n\
  \nA. `NIDS`\nB. `HSM`\nC. `HIDS`\nD. `TPM`\n\n#### 3\n你的软件开发团队正在创建一个可以接受付款的自定义应用程序。该程序调用现有\
  \ API 生成唯一值。正在进行哪种技术？\n\nA. `Tokenization`\nB. `Salting`\nC. `Encryption`\nD. `Hashing`\n\
  \n#### 4\n哪种支持“触碰”的近距离无线系统通常用于借记信用卡支付？\n\nA. `Wi-Fi`\nB. `Bluetooth`\nC. `NFC`\n\
  D. `Infrared`\n\n#### 5\n你计划在偏远地区度假时远程工作，那里没有有线服务。你的手机有数据连接但信号很弱。你应该考虑哪些连接选项？（选择两项）\n\
  \nA. `DSL`\nB. `Cable modem`\nC. `Cellular signal booster`\nD. `Satellite connectivity`\n\
  \n#### 6\n公司提供的智能手机配置为接受你的指纹作为一种认证形式。这是什么类型的认证？\n\nA. `Context-aware`\nB. `Multifactor`\n\
  C. `Biometric`\nD. `Gesture-based`\n\n#### 7\n你的一些精通技术的用户修改了公司提供的 Android 智能手机，提供完全设备访问权限以便安装需要此权限的应用程序。哪种术语最能描述这种场景？\n\
  \nA. Jailbreaking\nB. `sudo` \nC. `Rooting`\nD. `Hijacking`\n\n#### 8\n你正在配置移动设备管理\
  \ (`MDM`) 解决方案来加固员工的智能手机。设备必须配置为：\n* 无法在全球范围内跟踪设备位置。\n* 敏感数据无法被未经授权查看。\n* 设备丢失或被盗时，可以删除配置和数据。\n\
  * 公司应用和数据与个人应用和数据隔离。\n\n你需要做什么？\n\nA. 禁用 `GPS`，启用全设备哈希，启用远程擦除并在 Docker 容器中运行应用。\n\
  B. 禁用 `GPS`，启用全设备加密，启用远程擦除并配置容器化。\nC. 禁用 `Bluetooth`，启用全设备加密，启用远程访问并配置容器化。\nD. 禁用\
  \ `Bluetooth`，启用全设备哈希，启用远程擦除并配置容器化。\n\n\n\n\n\n### 9. 在敏感数据从组织内部泄露后，你决定在所有桌面电脑上实施安全解决方案，以确保敏感文档仅与授权方共享。桌面电脑还必须免受恶意代码的侵害，并阻止非由桌面电脑本身发起的网络流量。以下哪种解决方案最能解决这些问题？\n\
  \nA. 符合 `Opal` 标准的自加密驱动全盘加密、`DLP`、`firewall`\nB. `DLP`、全盘备份、`firewall`\nC. `Anti-malware`、使用\
  \ `TPM` 的磁盘加密、`firewall`\nD. `DLP`、`anti-malware`、`firewall`\n\n### 10. 公司的用户在平板电脑上使用浏览器远程访问云托管的\
  \ Windows 桌面和应用程序。哪个术语最能涵盖这一场景？\n\nA. `TPM`\nB. `VDI`\nC. `HSM`\nD. `IPS`\n\n###\
  \ 11. 用户抱怨在乘坐通勤火车上下班时，无法在笔记本电脑上访问电子邮件和云端文件。然而，他们可以在公司配发的智能手机上阅读电子邮件。云端文件只能使用安装在笔记本电脑上的专用软件进行编辑。火车不提供\
  \ Wi-Fi 网络连接。用户在通勤期间必须能够访问电子邮件和云端文件，同时尽可能地减少成本和不便。你应该怎么做？\n\nA. 教用户如何侧载（sideload）应用程序。\n\
  B. 教用户如何管理 `USB On-The-Go`。\nC. 教用户如何开启 `GPS` 标记。\nD. 教用户如何开启手机热点（tethering）。\n\n\
  ### 12. 你和一位同事一起乘坐巴士，你们都带着笔记本电脑。你们需要在旅途中相互共享文件，并使不便和成本降最低。巴士不提供 Wi-Fi 连接。你应该怎么做？\n\
  \nA. 将文件拷贝到外部 `USB` 存储介质。\nB. 将文件拷贝到 `MicroSD HSM`。\nC. 开启 `Wi-Fi Direct`。\nD. 开启卫星互联网连接。\n\
  \n### 13. 在测试未知软件时，应该采用哪种技术来确保它是无害的？\n\nA. `Sandboxing`\nB. `Push notifications`\n\
  C. `Firmware Over-The-Air` 更新\nD. `Carrier unlocking`\n\n### 14. 哪种无线技术常用于库存控制？\n\
  \nA. `Wi-Fi`\nB. `RFID`\nC. `NFC`\nD. `Cellular`\n\n### 15. 你的经理要求你评估并推荐一种单一 IT\
  \ 工具，用于管理桌面电脑、笔记本电脑以及 Android 平板电脑和智能手机。你应该寻找哪种工具？\n\nA. `Trusted platform module`\n\
  B. `Unified end-point management`\nC. `SEAndroid`\nD. `Hardware security module`\n\
  \n### 16. 你被赋予禁用用户智能手机上短信多媒体消息服务 (`MMS`) 的任务。这种配置直接缓解了哪种类型的短信攻击风险？\n\nA. `Injection\
  \ attack`\nB. `Identity theft`\nC. 由电子邮件附件触发的勒索软件\nD. 嵌入视频文件中的恶意代码\n\n### 17. 参考图\
