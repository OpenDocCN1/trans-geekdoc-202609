  \ point）是一种主动的未经授权的无线接入点（WAP）。不知情的用户为了工作方便，可能会使用未经授权的 WAP，而没有意识到这种配置可能会损害网络安全。如果该接入点连接到有线网络，恶意用户也可以部署它以获取网络的无线访问权限；或者他们的意图可能是诱骗用户连接到该接入点，因为它与合法的接入点具有相同的扩展服务集标识符（ESSID）或无线网络名称，从而能够捕获用户流量。\n\
  \n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。专门配置为伪装成已知合法接入点的异常访问点被称为“邪恶孪生”（evil\
