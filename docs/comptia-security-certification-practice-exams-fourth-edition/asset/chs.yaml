  B. `Carrier unlock`\nC. `Jailbreaking`\nD. `Rooting`\n\n### 30. 在线支付服务可以使用信用卡，但在交易过程中不会向商户发送真实的信用卡详情。哪种技术实现了这一功能？\n\
  \nA. `Encryption`\nB. `Hashing`\nC. `Salting`\nD. `Tokenization`\n\n### 31. 哪种技术在提供受保护数据之外，还带有随机数据的加密单向函数？\n\
  \nA. `Encryption`\nB. `Hashing`\nC. `Salting`\nD. `Tokenization`\n\n\n\n\n\n## 32.\
  \ 你在一个军事基地的 IT 部门工作。该 IT 部门发放了安全的智能手机，要求用户登录时不仅必须提供用户凭据，而且必须位于基地。哪个术语最能描述这一场景？\n\
  \nA. 单点登录\nB. 多因素身份验证\nC. 身份联邦\nD. 上下感知认证\n\n### 快速答案对照\n\n- [1]. D\n- [2]. A\n\
  - [3]. A\n- [4]. C\n- [5]. C, D\n- [6]. C\n- [7]. C\n- [8]. B\n- [9]. D\n- [10].\
  \ B\n- [11]. D\n- [12]. C\n- [13]. A\n- [14]. B\n- [15]. B\n- [16]. D\n- [17]. A\n\
  - [18]. A\n- [19]. 参见“深度答案”。\n- [20]. C\n- [21]. B\n- [22]. C\n- [23]. D\n- [24].\
  \ B\n- [25]. B\n- [26]. D\n- [27]. C\n- [28]. C, D\n- [29]. B\n- [30]. D\n- [31].\
  \ C\n- [32]. D\n\n### 深度答案\n\n#### 1. **D.** 主机入侵防御系统 (`HIPS`) 运行在特定的主机上，例如应用程序服务器。`HIPS`\
  \ 可以配置为检测与该特定主机相关的异常行为，并且不仅限于报告/警报/记录活动；还可以配置为采取行动以停止活动，例如阻止来自特定主机的特定类型流量。\n\nA、B\
  \ 和 C 是错误的。网络入侵检测系统 (`NIDS`) 不是针对特定主机，而是分析来自多个源的网络流量以检测潜在的恶意活动。网络入侵防御系统 (`NIPS`)\
  \ 具有停止潜在攻击额外能力，例如通过阻止或限制来自主机的网络流量类型和数量。主机入侵检测系统 (`HIDS`) 可以检测并报告/警报/记录任何特定主机的可疑活动，但不会采取措施停止或防止这些恶意活动。\n\
  \n#### 2. **A.** `NIDS` 不是针对特定主机，而是分析来自多个源的网络流量以检测潜在的恶意活动。\n\nB、C 和 D 是错误的。硬件安全模块\
  \ (`HSM`) 是一种专用的防篡设备，旨在安全地存储和管理加密密钥。`HIDS` 可以检测并报告/警报/记录任何特定主机的可疑活动，但不会采取措施停止或防止这些恶意活动。可信平台模块\
  \ (`TPM`) 是计算设备内部的固件芯片，确保设备启动完整性并存储用于加密存储设备的密钥。`TPM` 是整体计算安全策略的一部分，通常被称为“硬件信任根”的一部分。\n\
  \n#### 3. **A.** 令牌化（Tokenization）是一种安全技术，使用受信任的中心化服务来创建敏感数据的数字表示，例如信用卡信息。此“令牌”随后可以用于授权资源。\n\
  \nB、C 和 D 是错误的。加盐（Salting）是一种向密码中添加随机数据的技术。加密使用密钥将数据转换为密文。哈希（Hashing）是一种单向算法，产生唯一值；如果哈希值不同，你就知道数据已更改。哈希的一个示例是在\
  \ `/etc/shadow` 中存储密码。哈希是不可逆的。Linux 用户密码存储在 `/etc/shadow` 中。\n\n#### 4. **C.** 近场通信\
  \ (`NFC`) 是一种用于在距离不超过 10 厘米（3.9 英寸）的设备之间传输少量数据的无线技术。`NFC` 常用于“触碰”支付系统。\n\nA、B 和\
  \ D 是错误的。无线局 (`Wi-Fi`) 网络系统可以使用从一点传输并被许多设备接收的无线电。`Wi-Fi` 设备可以相互通信（自适应模式），也可以连接到中央连接设备（无线访问点或无线路由器）。\n\
  \n红外是一种较老的视距或点对点无线技术，用于电视遥控器等设备。现代计算设备不再使用红外进行本地连接或打印；而是使用 `Bluetooth`。`Bluetooth`\
  \ 是一种与 `Wi-Fi` 类似的无线技术，但范围较小；最常见的 `Bluetooth` 实现范围为 10 米（33 英尺）。常见用途包括驾驶时的免提手机使用、将电视和智能手机等设备连接到无线扬声器系统等。\n\
  \n#### 5. **C 和 D.** 手机信号放大器可以将微弱的手机信号放大许多，以便实现通话、短信和移动设备数据使用，否则这些在农村地区可能慢到无法接受或无法实现。请务必咨询最近的基站运营商以注册您的手机信号放大器。卫星连接需要安装卫星天线通过无线卫星系统传输和接收数据，适用于农村地区或海上船舶。\n\
  \nA 和 B 是错误的。数字用户线路 (`DSL`) 使用专用的收发设备通过传统的铜电话线传输数据，其频率与标准语音通话使用的频率不同。由于该地区没有电话线，`DSL`\
  \ 不是选择。电缆调制调器使用现有的同轴电电视网络提供互联网连接。由于没有电话线和电力，电缆网络将不存在，因此这无法提供解决方案。\n\n#### 6. **C.**\
  \ 生物识别认证使用人的物理特征进行唯一识别，例如通过指纹、视网膜扫描、语音和识别等。\n\n\n\n\n\n![Images](img/com-1.jpg)\
  \ A、B 和 D 都是错误的。上下文感知认证不仅使用用户名和密码等标准识别机制，还使用设备位置、设备类型配置、时间等因素。多因素身份认证 (MFA) 将多个身份类别结合使用，例如你所知道的（用户名和密码）、你所具有的特征（指纹）以及你所拥有的（智能卡、密钥令牌、从替代设备派生的唯一身份验证\
  \ 码）。基于手势的认证以动作或移动以及使用一或多个手指的触摸屏手势的形式出现；这两者都可以用于验证用户的身份。\n\n### 7\n![Images](img/com.jpg)\
  \ C. 对 Android 设备进行根启动（Rooting）意味着允许对设备及其操作系统进行完全特权访问，这是某些应用程序所要求的，并为用户提供完全的设备配置能力。手机根启动的一种常用方法是下载开发者工具包或专门的固件刷机应用；你可能还需要一台通过\
  \ `USB` 连接的计算机来完成此过程。“Rooting”一词的出现是因为 Android 操作系统基于 Linux 操作系统内核，该内核使用 `root`\
  \ 账户作为完全特权账户。用户应该意识到，根启动 Android 设备可能会引入安全风险（恶意软件获得设备的完全控制），并可能导致移动运营商保修失效。\n\n\
  ![Images](img/com-1.jpg) A、B 和 D 都是错误的。越狱（Jailbreaking）适用于 iPhone、iPad 和 iPod 等\
  \ Apple iOS 设备。与根启动 Android 设备类似，越狱可以通过设备上安装的应用程序来实现，也可以通过连接 `USB` 的外部计算机来移除设备限制，从而允许用户具有完全的配置灵活性，例如安装\
  \ Apple App Store 中未提供的应用程序。`sudo` 是一个 Linux 命令，允许某些用户运行特权命令；普通的 Linux 命令只需在前面加上\
  \ `sudo` 前缀。在 IT 安全中，会话劫持（session hijacking）可以指接管两个主机之间已建立的现有会话。\n\n### 8\n![Images](img/com.jpg)\
  \ B. 在移动设备上禁用全球定位系统 (GPS)，该系统通常用于设备跟踪、地理位置媒体标记以及限制基于位置的应用使用)，可以防止设备位置通过 GPS 被追踪，尽管在局部范围内仍然可以通过基站三角测量法进行设备追踪。通过全设备加密可以保护敏感数据免受未经授权的访问。远程擦除（Remote\
  \ wipe）允许移动设备管理员在设备丢失或被盗时通过网络远程擦除设备。移动设备容器化出于安全考虑将工作和个人应用、设置及数据分离，包括仅对企业容器（分区）进行远程擦除。移动设备管理员还可以通过启用超时锁屏设置，或禁用摄像头、麦克风、蓝牙连接等提供的不需要的功能来加固设备。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 都是错误的。设备哈希可以用于验证文件是否被修改过，但它不能保护文件免受未经授权的访问。蓝牙是一种本地无线解决方案；它不是全球性的，因此禁用它无法防止全球设备追踪。启用设备远程访问并不意味着远程擦除能力。\n\
  \n### 9\n![Images](img/com.jpg) D. 数据泄露防护 (DLP) 解决方案可以减少故意或无意敏感数据泄露的风险，例如防止将机密数据转发到组织外的电子邮件地址。防恶意软件如果保持更新，可以帮助保护设备免受恶意代码的影响。配置了基于主机的防火墙的桌面计算机可以允许或阻塞进出该计算机的网络流量。下一代防火墙则更进一步，通过检查传输中的所有细节。\n\
  \n![Images](img/com-1.jpg) A、B 和 C 都是错误的。列出的项目（如自加密驱动器 (SED) 使用 Opal 安全规范并未解决恶意代码问题。针对数据泄露、恶意软件缓解或通过防火墙控制网络流量的答案是错误的。\n\
  \n### 10\n![Images](img/com.jpg) B. 虚拟桌面基础 (VDI) 为任何类型的设备提供远程桌面和应用访问，即使仅使用浏览器。\n\
  \n![Images](img/com-1.jpg) A、C 和 D 都是错误的。可信平台模块 (TPM) 是计算设备内的固件芯片，用于确保 UEFI 固件启动的完整性以防止\
  \ rootkit 等安全威胁。TPM 还可以存储用于加密设备的密钥。硬件安全模块 (HSM) 是设计用于安全存储和管理密钥的专用防篡设备。入侵防御系统 (IPS)\
  \ 可以配置为检测特定主机相关的异常行为，且不仅限于报告/告警/日志；它还可以配置为采取行动停止活动。\n\n### 11\n![Images](img/com.jpg)\
  \ D. 手机热点（手机连接）允许你通过手机数据服务连接缺少蜂窝网络的设备（如笔记本电脑）。热点可以在手机和笔记本电脑之间无线完成，也可以通过 `USB` 线。\n\
  \n![Images](img/com-1.jpg) A、B 和 C 都是错误的。侧载（Sideloading）应用程序通常指在手机上手动安装应用而不是从应用商店安装。USB\
  \ 模式 (USB OTG) 允许 USB 设备同时担任 USB 主机和 USB 外围设备的角色。例如，USB OTG 通常用于通过 OTG 适配器将标准 USB\
  \ 存储设备插入手机充电口，以便手机能够访问 USB 存储设备。全球定位系统 (GPS) 标记用于为文件或社交媒体帖子添加位置信息。它在该场景下不会被使用。\n\
  \n### 12\n![Images](img/com.jpg) C. 桌面、笔记本和移动设备可以通过 Wi-Fi Direct 快速无线连接在一起传输文件，即使在没有互联网连接的情况下。\n\
  \n![Images](img/com-1.jpg) A、B 和 D 都是错误的。Wi-Fi Direct 比将设备和设备插入计算机共享文件更方便，包括使用卫星互联网连接。MicroSD\
  \ 硬件安全模块 (HSMs) 直接插入移动设备以提供加密认证和管理功能，并与此讨论无关。\n\n### 13\n![Images](img/com.jpg)\
  \ A. 沙箱技术使用隔离的网络、主机或应用环境来测试配置（包括未知的软件），而不会产生无意损坏其他系统或组件的风险。\n\n\n\n\n\n![Images](img/com-1.jpg)\
  \ `B`、`C,` 和 `D` 是错误的。推送通知通常用于移动设备发送用户通知，无论用户当前正在使用应用程序还是在访问网站。空中固件更新 (FOTA) 允许通过无线网络远程为设备添加固件更新。运营商解锁是指将智能手机从特定的移动运营商网络中移除。实现这一点的过程在不同设备和全球不同地区略有不同。例如，在加拿大，CRTC\
  \ 规定要求新智能手机在销售时必须已处于解锁状态。\n\n### 14\n![Images](img/com.jpg) `B.` 射频识别 (RFID) 使用无线射电频率来跟踪附有\
  \ RFID 标签的物品或动物，例如库存控制和动物位置追踪。\n\n![Images](img/com-1.jpg) `A`、`C,` 和 `D` 是错误的。列出的无线解决方案通常不用于库存控制。Wi-Fi\
  \ 通常用于将设备无线连接到网络，其最终目标通常是实现无线互联网连接。近场通信 (NFC) 是一种用于在距离不超过约 10 厘米（3.9 英）的设备之间传输少量数据的无线技术。NFC\
  \ 常用于智能手机或支付卡的“触碰式”无式支付系统。蜂窝无线技术使用发射塔来实现蜂窝网络订阅者的无线连接。蜂窝塔周围的每个径向覆盖区域被称为“小区”。在人口密集地区，小区通常会重叠，以便在小区用户移动时提供持续覆盖。\n\
  \n### 15\n![Images](img/com.jpg) `B.` 统一终端管理 (UEM) 解决方案对许多类型的设备进行集中管理，并包含了移动设备管理\
  \ (MDM) 和移动应用程序管理 (MAM) 功能。UEM 工具可以部署设备配置和应用、管理应用和安全设置并应用更新，从而消除了使用多个设备管理工具的需求。\n\
  \n![Images](img/com-1.jpg) `A`、`C` 和 `D` 是错误的。可信平台模块 (TPM) 是计算设备内部的固件芯片，用于确保 UEFI\
  \ 固件计算机的启动完整性，允许通过经过测量或完整性检查的启动来防止来自 rootkit 等安全威胁。TPM 还可以存储用于加密存储设备的加密密钥。安全增强 Android\
  \ (SEAndroid) 是基于 Linux 的 Android 操作系统的变体，侧重于使用策略和强制访问控制 (MAC) 来保护 Android 设备。MAC\
