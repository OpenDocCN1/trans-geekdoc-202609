  \nA. 物理（Physical）\nB. 补偿（Compensating）\nC. 威慑（Deterrent）\nD. 纠（Corrective）\n\n**21.**\
  \ 你是一个帮助零售客户实现应用地理围栏（geofencing）的顾问。你可以使用哪种跟踪机制为在手机上安装了零售应用程序的客户开启地理围栏？\n\nA. GPS,\
  \ Wi-Fi\nB. Wi-Fi, NFC\nC. GPS, NAC\nD. NAC, Bluetooth\n\n**22.** 你的身份联合配置为通过身份验证的用户创建了数字签名的令牌，这些令牌包含用户的出生日期和安全许可级别。用哪个术语来描述添加到令牌中的这些额外数据？\n\
  \nA. PKI 证书\nB. Cookie\nC. SAML\nD. 声明（Claim）\n\n**23.** 为什么会出现 图 11-1 中的 SSH 身份验证错误？\n\
  \nA. 使用了错误的公钥。\nB. 使用了错误的私钥。\nC. 用户名错误。\nD. 密码错误。\n\n![Images](img/fig11-1.jpg)\n\
  \n**图 11-1**\nSSH 身份验证错误\n\n**24.** 你正在查看 Linux `authorized_keys` 文件的内容。存储在这里的是哪种密钥？\n\
  \nA. 公钥（Public）\nB. 私钥（Private）\nC. 密钥（Secret）\nD. 对称密钥（Symmetric）\n\n**25.** 你需要评估筛选子网中的\
