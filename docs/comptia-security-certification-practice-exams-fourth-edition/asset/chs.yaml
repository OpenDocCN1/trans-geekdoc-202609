  \n\n\n\n### [14] 恶意用户部署了一个恶意的无线接入点，用户在不不知情的情况下连接了它。用户流量被捕获、修改并发送回网络，试图发送欺诈的用户会话数据。这是哪种类型的攻击？\n\
