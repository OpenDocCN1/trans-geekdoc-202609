  \ **C**。\n\n\n\n\n\n![Images](img/com-1.jpg) **C** 和 **D** 是错误的。指纹通过生物识别认证识别用户。门也可以配备生物识别锁。智能卡认证通过智能卡中包含的唯一代码或公钥基础设施（`PKI`）证书来识别用户。在这种情况下，任何持有智能卡的人都必须知道\
  \ PIN 码才能使用它。\n\n### 7\n![Images](img/com.jpg) **B.** 假设当地建筑规范允许使用无水灭火系统，你应该建议使用这些系统，因为它们不会像水那样损坏或腐蚀计算机系统或组件。\n\
  \n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。水喷淋系统会损坏或破坏计算机设备和数据，应尽可能避免使用。虽然这很重要，但在服务器房放置\
  \ `Class C` 灭火器来缓解电气火灾，并不是你唯一应该建议的事项；水毁会摧毁计算机系统。\n\n### 8\n![Images](img/com.jpg)\
  \ **C.** 在数据中心中，冷通道优化了指向设备进风扇的冷气流，而热通道通过将热空气引向设备外侧来优化设备排气流。冷空气通常通过带有通风孔的架空地板下方输送到设备。设备机架之间安装了面板以防止冷热空气混合，从而提高冷却效率。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **D** 是错误的。暖暖、通风和空调（`HVAC`）系统通常用于控制房间或建筑内的气流和环境控制。形式因子（Form\
  \ factoring）和数据中心呼吸（data center breathing）是虚构术语。\n\n### 9\n![Images](img/com.jpg)\
  \ **D.** 邻近卡必须放置在阅读器几厘米范围内以注册卡片并允许或拒绝对设施的访问。所有访问都以电子方式记录，不需要物理日志本或安保人员。\n\n![Images](img/com-1.jpg)\
  \ **A, B,** 和 **C** 是错误的。照片身份卡识别人物，但不与电子日志记录有关。安保人员也不以电子方式记录设施访问。IP 安全（`IPSec`）是一种对数据包进行认证和加密的机制；与物理现场安全没有关联。\n\
  \n### 10\n![Images](img/com.jpg) **A.** 密码锁是电子键盘，允许授权人员输入访问代码以进入房间或建筑。用户只需要知道访问代码即可，不需要物理卡片。\n\
  \n![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。列出的项目不满足用户需要知道访问代码的客户要求。弹锁需要持有钥匙。虽然建议将敏感纸质文件存储在保险箱中，但对于密码锁来说并不是强制要求的，密码锁需要的是访问代码。诸如唯一指纹等生物识别认证方法不需要知道访问代码。\n\
  \n### 11\n![Images](img/com.jpg) **A.** 服务器房过热可能是问题所在，因为添加了新设备，增加了房间温度。应该咨询 `HVAC`\
  \ 技术人员，必要时可能会实施冷热通道布局。\n\n![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。列出的项目不太可能是服务器关机的原因，因为服务器经过了补丁，且问题是在服务器房添加新设备后开始的。\n\
  \n### 12\n![Images](img/com.jpg) **B.** 停车场良好的照明可以减少针对员工的攻击或抢劫发生的概率。\n\n![Images](img/com-1.jpg)\
  \ **A, C,** 和 **D** 是错误的。在建筑前方或周围安装护柱等路障可以防止车辆损坏，但不能确保停车场员工的安全。标志牌（如出口标志）结合有效的逃生路线和定期的火演，有助于确保用户安全。除非是室内停车场，否则不需要出口标志。急救箱不是停车场安全的标准做法。\n\
  \n### 13\n![Images](img/com.jpg) **D.** 碎碎文件可以防止物理威胁，如盗取这些文件或从文件中获取信息。\n\n![Images](img/com-1.jpg)\
  \ **A, B,** 和 **C** 是错误的。根内核程序在 `OS` 中隐藏自己，同时允许恶意用户访问。间谍软件在用户不知情的情况下收集用户的计算习惯。这些信息对营销公司可能很有价值。直接观察他人访问敏感信息是“窥视”的一个例子。\n\
  \n### 14\n![Images](img/com.jpg) **A.** 代码混淆（通常称为伪装）是通过软件插件完成的。结果是原始文本的一种不可读变体。\n\
  \n![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。加密将数据和加密密钥输入密码算法，产生密文或加密数据。哈希将数据输入诸如\
  \ `SHA-256` 的单向加密算法，产生代表原始数据的唯一值。物理隔离（Air gapping）通过通过与其他网络断开连接来隔离敏感网络。\n\n### 15\n\
  ![Images](img/com.jpg) **B** 和 **C.** 碎碎用于将纸质文件切成碎片，以确保其中的数据无法被检索。在法律允许的情况下，焚毁对电气设备同样有效，并减少纸质文件，从而使无法检索。\n\
  \n![Images](img/com-1.jpg) **A** 和 **D** 是错误的。物理隔离通过与其他网络断开连接来隔离敏感网络。造纸通过添加液体化合物将纸质文件变成浓稠糊状；这很少作为文档销毁的方法。\n\
  \n### 16\n![Images](img/com.jpg) **A** 和 **B.** 粉碎用于将文档或电气组件制成细小碎片，使其对信息收集毫无用。去磁使用强磁铁从磁性存储介质（如传统的硬盘）中擦除数据。\n\
  \n![Images](img/com-1.jpg) **C** 和 **D** 是错误的。物理隔离通过与其他网络断开连接来隔离敏感网络。格式化磁盘会重置文件系统，但旧数据仍存在设备上，可以使用免费的工具轻松检索。\n\
  \n### 17\n![Images](img/com.jpg) **D.** 密码库为用户提供了集中安全的凭据存储解决方案，否则用户在访问多个应用程序或网站时需要记住多组凭据。通常需要密码或智能卡来解锁密码库，类似于输入代码来打开保险箱。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。安全超文本传输协议（`HTTPS`）使用 `PKI` 证书保护客户端与网络服务器之间的网络传输，它可以保护通过网络传输的凭据，但它没有解决安全保留多个用户名和密码的问题。`PKI`\
  \ 是一种安全证书层次结构，用于保护计算环境，例如通过磁盘加密和网络认证与加密。物理隔离通过与其他网络断开连接来隔离敏感网络。\n\n\n\n\n\n## 18\n\
  ![Images](img/com.jpg)\nC 和 D。物理围栏可以阻止未经授权的物业访问，还可以显示关于禁止侵入私人领地的告示牌。许多专门经营安全围栏的公司建议高度至少为\
  \ 2.1 米（7 英尺）。安全无人机也称为无人飞行器，是遥控飞行器，可以通过飞越大区域来监控区域。这种类型的无人机通常配备了夜视运动检测视频功能。\n\n![Images](img/com-1.jpg)\n\
  A 和 B 是错误的。过滤子网（Screened subnet）是存在于互联网等公共网络和内部安全网络之间的网络。企业 VPN 网关等公共可访问的服务应放置在过滤子网中。物理隔离（Air\
  \ gapping）通过切断与其他网络的连接来隔离敏感网络。\n\n## 19\n![Images](img/com.jpg)\n图 14-3 显示了术语与正确答案的匹配。物理隔离网络在物理上与所有其他网络隔离；没有外部网络连接。消磁是一个使用磁铁擦除存储在硬盘等磁性介质上数据的过程。法拉第笼是一个小型封闭装置，将无线设备放置其中以防止接收或传输无线信号。为了控制设施访问并防止尾随，访问控制门间（Access\
  \ control vestibule）是建筑入口处带有两扇门的小房间；只有在第一扇外部门关闭后，第二个内层门才会打开。未使用的答案是“过滤子网”，它是存在于互联网等公共网络和内部安全网络之间的网络。企业\
  \ VPN 端等公共可访问的服务应放置在过滤子网中。\n\n![Images](img/fig14-3.jpg)\n\n**图 14-3**\n物理安全术语与定义——答案\n\
  \n## 20\n![Images](img/com.jpg)\nD. 可信平台模块（TPM）是一种加密固件，设计用于存储磁盘加密的加密密钥，并确保机器启动过程未被篡改（包括操作系统启动文件受到恶意软件感染）。从加密了磁盘的系统中移除\
