  \ 和 Windows 主机都可以存储密钥。`IPSec` 隧道模式更多是 `VPN` 的功能而非 `HSM`。`HSMs` 不降低成本。\n\n#### 27\n\
  ![Images](img/com.jpg)\n`A` 和 `D.` `PKI` 证书可用于消息加密、数字签名。证书有有效期，过期后不再有效。\n\n![Images](img/com-1.jpg)\n\
  `B` 和 `C` 是错误的。密钥长度不是决定加密强唯一因素，2048 位密钥不被认为是弱的。证书可以颁发给基础设施设备（如交换机和路由器），用于客户端到网络的认证、设备到设备的认证或网络流量解密。\n\
  \n#### 28\n![Images](img/com.jpg)\n`D.` 你可以配置 `DHCP` 厂商选项来识别请求的设备类型（`IP 电话`），然后分配\
  \ IP 设置范围和默认网关。\n\n![Images](img/com-1.jpg)\n`A,` `B,` 和 `C` 是错误的。`IPSec` 是一种网络安全协议，可以配置用于认证和加密网络流量，包括建立\
  \ `VPN` 隧道。`SMTP` 邮件传输流量可以通过 `S/MIME` 协议进行加密和数字签名，这需要 `SMTP` 主机配置 `PKI` 证书。`SSH`\
  \ 是一种使用 TCP 端口 22 的加密远程管理协议。\n\n#### 29\n![Images](img/com.jpg)\n`D.` `HTTPS` 安全连接使用\
  \ TCP 端口 443。\n\n![Images](img/com-1.jpg)\n`A,` `B,` 和 `C` 是错误的。`LDAPS` 使用 TCP 端口\
  \ 636，安全 `POP` 使用端口 995，而 `IMAPS` 服务器使用端口 993。\n\n#### 30\n![Images](img/com.jpg)\n\
  `B.` `DNSSEC` 防止客户端 DNS 查询收到伪造的 DNS 答复。在 `DNSSEC` 中，DNS 区域记录经过了数字签名。DNS 客户端使用公钥验证\
  \ DNS 查询结果的签名，以确保响应有效。（DNS 客户端信任用于签名 DNS 区域的私钥。）\n\n\n\n\n\n![Images](img/com-1.jpg)\
  \ `A`、`C,` 和 `D` 是错误的。列出的项并非由 `DNSSEC` 提供。数据密性通过加密实现。`DHCP` 从中心配置为客户端提供 IP 配置设置。可用性确保在需要时可以访问\
  \ IT 系统和数据，并包括数据备份和高可用性服务器集群等项目。\n\n**31.** ![Images](img/com.jpg) `C.` `IPSec`\
  \ 可以被配置为使用单个配置来保护部分或全部网络流量，这与 `HTTPS` 等应用安全协议不同，`HTTPS` 仅适用于 Web 服务器，且每台服务器都需要一个\
  \ `PKI` 证书。\n\n![Images](img/com-1.jpg) `A`、`B,` 和 `D` 是错误的。`TLS` 取代了过时的 `SSL` 网络安全协议。`TLS`\
  \ 要求服务配置 `PKI` 证书，例如 Web 服务器或邮件服务器。使用 `TLS` 的 Web 服务器使用 `HTTPS` 与客户端交换消息。与 `IPsec`\
  \ 不同，列出的协议无法保护所有网络流量。\n\n**32.** ![Images](img/com.jpg) `D.` 隐写术用于将敏感数据隐藏在其他非敏感项目中的技术，例如在狗的照片中隐藏秘密信息，这需要特殊的软件来隐藏和显示信息。\n\
  \n![Images](img/com-1.jpg) `A`、`B` 和 `C` 都是错误的。在密码学中，熵提供了随机性，例如在生成密钥对时。量子计算基于操纵量子比特（`qbits`）的前提，量子比特可以同时显示多个状态，而现在的计算机使用位（`0’s`\
  \ 和 `1’s`）来表示数据状态（只有两种可能）。`Hashing` 用于验证文件或消息是否发生更改。将原始数据输入单向加密算法中，产生一个名为 `hash`\
  \ 的唯一值；不使用加密密钥。在给定输入的情况下，单向算法很容易计算，但要通过 `hash` 确定原始值非常困难。\n\n# 第 18 章：灾难恢复与业务连续性\n\
  \n## 认证目标\n\n- 18.01 灾难恢复与业务连续性简介\n- 18.02 备份与恢复数据\n- 18.03 实现容错性\n- 18.04 理解高可用性\n\
  \n## 问题\n\n不利的情况可能会从财务和声誉损害方面对企业造成临时或永久的瘫痪。灾难恢复计划试图尽量减少这些情况（无论是自然灾害还是人为因素）对企业的影响。计划应包含事件评估，并应指定在特定情况下由谁执行哪些任务。\n\
  \n**1.** 在服务器硬盘发生故障的情况下，你被要求按照图 18-1 所示配置服务器硬盘。这是哪种磁盘配置？\n\nA. `RAID 0`\nB. `RAID\
  \ 1`\nC. `RAID 5`\nD. `RAID 5+1`\n\n![Images](img/fig18-1.jpg)\n\n**图 18-1**\n硬盘配置\n\
  \n**2.** 团队负责人分配给服务器管理员一项任务，即确定如果电子邮件服务器宕机两小时会对业务和财务产生什么影响。服务器管理员必须执行何种类型的分析？\n\n\
  A. 关键系统和组件识别\nB. `Business impact analysis`（业务影响分析）\nC. `Security audit`（安全审计）\n\
  D. `Risk assessment`（风险评估）\n\n**3.** 一航空公司聘请你确保其客户预订系统始终在线。该软件在 `Linux` 操作系统本地运行并存储数据。你应该怎么办？\n\
  \nA. 在集群中安装两个 `Linux` 服务器。对航空公司软件进行集群化，将其数据写入共享存储。\nB. 安装一台新的 `Linux` 服务器。确保航空公司软件从第一台服务器运行。安排航空公司数据每天复制到新的\
  \ `Linux` 服务器。\nC. 使用 `RAID 5` 配置 `Linux` 服务器。\nD. 使用 `RAID 1` 配置 `Linux` 服务器。\n\
  \n**4.** 一个繁忙的集群网站经常遇到网络流量拥塞。你必须提高网站响应时间。你应该实施？\n\nA. `Ethernet switch`（以太网交换机）\n\
  B. `Network load balancing`（网络负载均衡）\nC. `Fibre Channel switch`（光纤通道机）\nD. `Proxy\
  \ server`（代理服务器）\n\n**5.** 你的主电子邮件服务器使用 `RAID 5` 配置的三块热插硬盘。当一个磁盘故障时，服务器机房中有其他可用磁盘，你可以在服务器运行时直接将其插入。哪种术语最能描述这种场景？\n\
  \nA. `Disk clustering`（磁盘集群）\nB. `Hardware fault tolerance`（硬件容错）\nC. `Disk striping`（磁盘分带）\n\
  D. `Disk mirroring`（磁盘镜像）\n\n**6.** 你的服务器磁带备份程序包括每周五晚上的全备份，以及每天对自周五备份以来更改的所有数据进行备份。这是哪种类型的备份计划？\n\
  \nA. `Full`（全备）\nB. `Full and incremental`（全备加增量）\nC. `Full and differential`（全备加差异）\n\
  D. `Disk snapshot`（磁盘快照）\n\n**7.** 你是旧金山一家律师事务所的网络工程师。1989 年地震后，对未来地震后持续业务运营的关注主导了旧金山的商界。哪种类型的计划重点于确保灾难发生后人员、客户和\
  \ IT 系统受到的影响最小？\n\nA. `Risk management`（风险管理）\nB. `Fault tolerant`（容错）\nC. `Disaster\
  \ recovery`（灾难恢复）\nD. `Business continuity`（业务连续性）\n\n**8.** 服务器配置了三块硬盘，如图 18-2\n\
  \n**图 18-2**\n硬盘配置\n\n**9.** `Windows` 服务器备份计划如下：周六凌晨 3 点全备，工作日晚上 9 点增量备。已启用验证。备份带存储在第三方的地点。应该做什么来确保备份的完整性和机密性？选择两项。\n\
  \nA. 由非备份人员分析每日日志。\nB. 确保执行备份的用户是 `Administrators` 组成员。\nC. 加密备份介。\nD. 使用 `SSL`\
  \ 加密备份介。\n\n**10.** 你是一名 IT 网络架构师。你的公司被聘请为一家公司进行网络审计。该公司的一个仓库有一个机房，其中有一台 `Windows`\
  \ 服务器两台 `Linux` 服务器。在采访服务器管理员后，你了解到如果 `Linux` 服务器停止运行，他们不知道该。这里需要什么？\n\nA. `Disaster\
  \ recovery plan`（灾难恢复计划）\nB. `Risk analysis`（风险分析）\nC. `Windows servers`（Windows\
  \ 服务器）\nD. `Server clustering`（服务器集群）\n\n**11.** 在确保电子商务网站的高可用性时，应该考虑哪些项目？选择两项。\n\
  \nA. 使用 `TPM` 加密服务器硬盘。\nB. 使用冗余的链路。\nC. 使用 `network load balancing`（网络负载均衡）。\nD.\
  \ 将服务器 `CMOS` 升级到最新版本。\n\n**12.** 以下与创建灾难恢复计划最相关？选择三项。\n\nA. 确定使用的 IP 类\nB. 风险排序\n\
  C. 禁用未交换交换端口\nD. 为人员分配恢复任务\nE. 建立替代地点以继续业务\n\n**13.** 应使用什么对你特定的灾难恢复计划做出明智决策？\n\n\
  A. 从网站免费下载的 `DRP` 模板\nB. `ROI analysis`（投资回报率分析）\nC. `TCO analysis`（总成本分析）\nD. `Business\
  \ impact analysis`（业务影响分析）\n\n**14.** 识别灾难恢复计划的错误。选择两项。\n\n\n\n\n\nA. 首先进行业务影响分析。\n\
  \nB. 基于未更改的下载模板创建你的灾难恢复计划（DRP）。\n\nC. 数据备份从不进行测试；这会让公司花费太多资金。\n\nD. 即使软件已经过时两个版本，也保留现有的备份解决方案。\n\
  \n**15.** 你正在为一家小型独立汽车经销商创建一个灾难恢复计划（DRP）。那里有四名员工，每人使用一台台式电脑；没有服务器。所有公司数据都存储在这四台电脑上。所有用户共享一条单一高速\
  \ DSL 链路。最好的 DRP 解决方案是什么？（选择两个。）\n\nA. 将数据存储在云端而不是本地。\nB. 确保员工在发生灾难时确切知道该做什么。\n\
  C. 购买更快速的桌面式电脑。\nD. 购买一台文件服务器。\n\n**16.** 你的高级网络管理员决定将你所在地的五台物理服务器虚拟化，并运行在单一物理主机上。这五个虚拟机是任务关键型的，并将使用该物理主机上的物理硬盘。物理主机的硬盘配置为\
  \ `RAID 1`。识别该计划中的缺陷。\n\nA. 物理服务器应该应该使用 `RAID 5`。\nB. 物理硬盘不能存放在物理主机中。\nC. 你不能在物理主机上同时运行五台虚拟机。\n\
  D. 物理主机是单点故障。\n\n**17.** 你的公司正在你的所在地将 DNS、DHCP、Web 和电子邮件服务器虚拟化。四台虚拟机中的每一台将分布在两台物理主机上。虚拟机使用虚拟硬盘，这些文件存在存储区域网络（SAN）上。选择能够实现最快粒度恢复的最佳虚拟机备份策略。\n\
  \nA. 在 SAN 级别备份虚拟机硬盘。\nB. 在每台虚拟机中安装备份代理并正常执行备份。\nC. 复制你的 SAN 磁盘阵列这样就不需要备份了。\nD.\
  \ 将所有四个虚拟机运行在同一台物理主机上进行备份。\n\n**18.** 为了确保机密，在将服务器备份磁盘存储在场外时你应该做什么？\n\nA. 加密备份数据。\n\
  B. 为每个备份文件生成文件哈希值。\nC. 将备份磁带放在静电屏蔽袋中。\nD. 永远不要将备份磁盘存在场外。\n\n**19.** 你是一个最近打过补丁的运行\
  \ `Active Directory Services` (`AD DS`) 的 `Windows Server` 的管理员。最近服务器一直在重启且无法启动。你应该怎么办？\n\
