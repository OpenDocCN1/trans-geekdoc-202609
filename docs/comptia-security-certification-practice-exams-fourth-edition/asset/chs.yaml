  \n### 19\n![Images](img/com.jpg) `A` 和 `C.` 密文块链消息认证码（`CBC-MAC`）使用如 `AES` 的对称块密码配合共享密钥来加密消息哈希值（而不是消息本身）以验证消息身份。\n\
  \n![Images](img/com-1.jpg) `B` 和 `D` 是错误的。Rivest-Shamir-Adleman（`RSA`）是一种使用公钥和私钥对的密码系统；数据使用公钥进行加密，使用数学相关的私钥进行解密。`AES`\
  \ 是美国政府加密标准，取代了 `DES` 和 `3DES`；它是一种用于加密数据的对称加密算法。椭圆曲线密码（`ECC`）是一种基于椭圆曲线数学理论生成公私钥对的技术，这使得确定私钥比使用\
  \ `RSA` 等其他算法相同位长度时确定私钥要困难得多。\n\n### 20\n![Images](img/com.jpg) `D.` `WPA3` 可以配置为使用连接两端配置的\
  \ `SAE` 密钥来提供 Wi-Fi 安全。由于两个连接设备在会话设置期间生成并同意组域参数的方式，`SAE` 密钥不受离线字典攻击。参数从未通过网络发送，因此使得\
  \ `SAE` 网络会话捕获对字典攻击无效。\n\n![Images](img/com-1.jpg) `A`、`B` 和 `C` 是错误的。`WPA2` 使用配置在连接两端的\
  \ `PSKs` 而不是 `SAE` 密钥来提供 Wi-Fi 安全。`WEP` 是 90 年代被废弃的 Wi-Fi 安全协议，已知可以使用免费工具轻易破解。`IPSec`\
  \ 是一种网络安全协议，可以在不需要专门配置单个应用程序的情况下保护网络流量，与 `SSL/TLS` 不同。`IPSec` 也可以用于保护客户端到站点或站点的\
  \ VPN。\n\n### 21\n![Images](img/com.jpg) `D.` 无线局域网（`WLAN`）控制器用于较大的网络环境，在这些环境中管理单个\
