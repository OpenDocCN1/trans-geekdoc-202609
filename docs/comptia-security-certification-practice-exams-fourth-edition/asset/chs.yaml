  \n### 24\n![Images](img/com.jpg) `B.` 漏洞扫描器（如 `Nessus`）通常使用针对各种操作系统和网络设备的已知漏洞数据库。该数据库与单个主机或网络扫描进行对比，以确定任何主机或设备是否存在漏洞。然后从扫描生成报告。网络扫描还可以揭露非法系统，包括发放错误\
