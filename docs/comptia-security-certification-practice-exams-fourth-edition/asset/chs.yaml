  \ VPN）配置，当 VPN 在客户端设备上激活时，所有网络连接都通过 VPN；这通常是为了安全考虑，因为所有流量都可以被集中监控和记录。IPSec 是一种网络安全协议，可以在无需专门配置应用程序的情况下保护网络流量，与\
