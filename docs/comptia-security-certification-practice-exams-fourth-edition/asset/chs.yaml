  \n3. ![Images](img/com.jpg) **A.** 易失性顺序决定了哪些数据最容易丢失。电子内存（RAM）数据在设备断电时会丢失，CPU 缓存也是如此；因此，必须在列出的其他项目之前妥善收集数据。\n\
