  \ overflow)\n\n### [35]\n下载的硬件驱动程序与制造商提供的校验和值不匹配，但它仍然安装并看起来运行正常。几个月后，你发现设备中的敏感信息已泄露到网上。哪种术语最能描述这种攻击？\n\
