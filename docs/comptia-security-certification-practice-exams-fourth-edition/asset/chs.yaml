  \ IT 活动，例如将特定类型的数据保留一段时间。服务账户为软件组件分配所需的权限。它们与用户账户相似，但被用于那些需要对资源有特殊权限的软件组件。安全泄露可能会导致敏感客户数据的暴露，从而造成声誉损害。这种泄露会对组织的声誉和股东的信心产生负面影响。在事件升级中，未解决的安全问题必须由其他方处理。事件响应计划必须包含当第一响应人员无法阻止泄露时如何升级事件的细节。影响评估是确定负面事件结果的工具。它们用于衡量已发生威胁的负面影响。这反过来可以用于确定威胁优先级，并最终分配资源和时间来缓解威胁。\n\
