  **C.** 权限提升发生在用户获得比其应有的更高的访问权限时，可能是因为他们获得了过多的权限，或者由于安全缺陷。\n\n![Images](img/com-1.jpg)\n\
  **A, B, 和 D** 是错误的。僵尸网络是指受恶意个人控制的一组计算机。木马是一种表面上无害的恶意软件，通常通过在前端执行合法的功能，同时在用户不知情的情况下在后台执行恶意操作。逻辑炸弹是由特定条件或日期触发的恶意软件。\n\
  \n### [2]\n![Images](img/com.jpg)\n**C.** 缓冲区溢出攻击发生在攻击者向应用程序或服务发送的数据超过其预期的时。发送的额外数据会流出分配给应用程序的内存区域（缓冲区），这可能导致代码区域被覆盖，并可能导致应用程序崩溃或允许在目标上执行任意命令。\n\
  \n![Images](img/com-1.jpg)\n**A, B, 和 D** 是错误的。通过 页面注入数据库代码是 SQL 注入攻击的示例。使用字典文件破解密码被称为字典攻击——一种密码攻击形式。修改数据包的源地址被称为欺骗。\n\
  \n\n\n\n\n### [3] B. SQL 注入攻击是指攻击者通过网站将数据库 (SQL) 语句插入后端数据库，从而操纵数据库存储数据的方式。在这个示例中，攻击者试图使用\
  \ `pass’ or 1=1--` 作为密码来绕过登录，从而尝试显示所有数据库记录。\n\nA、C 和 D 都是错误的。XML 注入发生在攻击者通过在应用程序消息中插入\
  \ XML 语句来操纵应用程序逻辑时。LDAP 注入发生在攻击者向应用程序中插入 LDAP 查询以执行搜索、添加或修改操作时。拒绝服务发生在攻击者试图使目标系统过载，使其无法处理来自合法客户端的有效请求时。\n\
  \n### [4] D. 缓冲区溢出攻击通常可以通过确保系统和应用程序补丁保持最新更新来缓解。当厂商发现漏洞时，该厂商将通过补丁修复这些问题。输入验证也是缓解缓冲区溢出攻击的常用缓解措施。\n\
  \nA、B 和 C 都是错误的。静态 ARP 条目将有助于防止 ARP 毒化。只要你保持病毒定义库更新，杀毒软件就能防止病毒和其他恶意软件。防火墙 ACL 规则可以允许/拒绝特定类型的网络流量，但这将不是缓解缓冲区溢出攻击的最有效方法。\n\
  \n### [5] A. 跨站脚本 (XSS) 是一种攻击，涉及攻击者向网页中插入脚本代码，以便当用户浏览该网页时，这些代码会被客户端系统处理并执行。\n\n\
  B、C 和 D 都是错误的。水坑攻击涉及攻击者在你信任的网站上植入恶意代码，这样当你导航到该网站时，这些代码会导致你的系统受到攻击。ARP 毒化发生在攻击者向目标系统的\
  \ ARP 缓存中插入错误的 MAC 地址时，从而导致流量被转发到攻击者的系统。在 SQL 注入中，SQL 代码通过 Web 应用程序插入后端数据库，以操纵底层数据库或系统。\n\
  \n### [6] C. SQL 注入攻击涉及攻击者通过 Web 应用程序在非预期的地方插入数据库代码。针对这种攻击的最佳防御措施是让程序员对传递到应用程序的任何信息进行验证（检查其准确性）。\n\
  \nA、B 和 D 都是错误的。虽然修补系统可以解决很多问题，但它无法解决你构建的应用程序的 SQL 注入攻击。在这种情况下杀毒软件也不会对你提供帮助，因为这不是病毒问题——而是基于你自己的编码流程和标准的问题。防火墙无法为你提供帮助，因为你需要允许人们访问应用程序，而问题不在于到达系统的流量类型——问题在于通过\
  \ Web 应用程序插入后端数据库的数据。\n\n### [7] A. Cookie 是网页浏览器用于存储 Web 应用程序偏好和会话信息的文本文件。安全的 Cookie\
  \ 可以防止攻击者利用 JavaScript 等脚本语言通过 XSS 攻击利用 cookie 冒充用户（设置 cookie `HTTPOnly` 标志），并允许通过\
  \ HTTPS 传输 cookie（设置 cookie `Secure` 标志）。\n\nB、C 和 D 都是错误的。hosts 文件存储 FQDN 和匹配的\
