  \ DNS 域名，例如 [www.acme.uk](http://www.acme.uk) 和 [www.acme.ca](http://www.acme.ca)。可以获取通配符证书（`*.acme.com`）来代替多个域名的独立证书，且不需要像\
  \ SAN 证书那样将域名硬编码到证书中。\n\n### 18\n![Images](img/com.jpg)\n持续集成和持续部署（CI/CD）利用自动化技术来加速向利益方交付软件的整体开发过程。这包括对代码提交的监控，以及通过自动化测试脚本验证代码更改的完整性。\n\
