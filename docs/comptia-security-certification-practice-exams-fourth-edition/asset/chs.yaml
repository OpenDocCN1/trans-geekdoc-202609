  \n# 第 16 章：虚拟化与云安全\n\n## 16.0 虚拟化安全\n- 云计算部署和服务模型\n- 云计算资源管理策略\n- 云安全解决方案\n\n##\
  \ 16. 练习\n\n云计算需要虚拟化。云计算允许组织根据业务需求快速配置和撤销 IT 服务。操作系统虚拟化的优势是在多个虚拟机之间最大化计算硬件资源的使用。应用程序容器将应用文件和设置限制在容器的逻辑边界内。应用程序由一个或多个容器组成，这些容器可以在主机之间轻松移动，并且由于它们使用已经在运行的主机操作系统，因此可以快速启动。\n\
  \n组织必须规划云服务的使用和管理，以在降低成本的同时，最大化效率、可用性和安全性。有助于实现此目标的选项包括使用模板、在地理区域之间复制数据以及防止运行不必要的云资源。\n\
  \n**`1`** 你是一名服务器虚拟化顾问。在与客户的规划会议期间，提到了虚拟机时间点快照的问题。由于安全影响，你建议谨慎使用快照。使用快照时最可能发生哪种安全问题？\n\
  \nA. 快照可能会消耗大量的磁盘空间。\nB. 可能会照可能会泄露敏感数据。\nC. 调用快照将意味着虚拟机暂时不可用。\nD. 调用快照的补丁更新将比当前运行的虚拟机更少。\n\
  \n**`2`** 一家私立医疗机构聘请你确定云计算的可行性，其中电子邮件、医疗应用程序以及患者信息的存储将由公云提供商托管。你被要求识别与敏感数据合规性相关的潜在问题。（选择两项。）\n\
  \nA. 数据存储在云提供商的设施上，该设施由其他云租户共享。\nB. 将使用 `HTTPS` 访问远程服务。\nC. 如果提供商收到传票，则存在完全披露数据的可能性。\n\
  D. 数据在传输和存储时将被加密。\n\n**`3`** 关于虚拟化，以下哪些是正确的？（选择两项。）\n\nA. 每个虚拟机都有一个或多个 `MAC` 地址。\n\
  B. 虚拟机操作系统不需要修补。\nC. 运行在同一物理主机上的虚拟机可以属于不同的 `VLAN`。\nD. 一个虚拟机的安全漏洞意味着所有虚拟机都被破解了。\n\
