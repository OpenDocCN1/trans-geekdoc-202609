  \nA. `DC1` 的私钥\nB. `DC1` 的管理员用户名\nC. `DC1` 的公钥\nD. `DC1` 的管理员密码\n\n**28.** 使用智能卡身份验证通常需要什么？（选择两项）\n\
  \nA. 智能卡阅读器\nB. PIN 码\nC. TPM\nD. HSM\n\n**29.** 虚拟智能卡存储在哪里？\n\nA. Windows 注册表\n\
  B. RADIUS 服务器\nC. 身份提供者\nD. TPM\n\n**30.** 你的组织计划向用户颁发智能卡用于数字签名和加密电子邮件。必须部署到智能卡的是？\n\
  \nA. 服务器公钥\nB. 用户公钥\nC. 服务器私钥\nD. 用户私钥\n\n**31.** 在 Windows 环境中使用虚拟智能卡的缺点是什么？\n\n\
  A. 一次只能在手机上可用。\nB. 无法远程管理。\nC. 需要虚拟智能卡阅读器。\nD. 只有带有 TPM 的主机可用。\n\n**32.** 用户账户锁定有助于缓解哪种类型的攻击？\n\
  \nA. 拒绝服务（Denial of service）\nB. 勒索软件（Ransomware）\nC. 钓鱼（Phishing）\nD. 暴力破解密码攻击（Brute-force\
  \ password attacks）\n\n### 参考答案\n\n[1] A\n[2] D\n[3] C\n[4] C\n[5] B, C\n[6] A,\
  \ C\n[7] C\n[8] A, B\n[9] D\n[10] C\n[11] D\n[12] C, D\n[13] D\n[14] B\n[15] B\n\
  [16] A\n[17] C\n[18] C\n[19] B\n[20] D\n[21] A\n[22] D\n[23] B\n[24] A\n[25] B,\
  \ C\n[26] A, C\n[27] C\n[28] A, B\n[29] D\n[30] D\n[31] D\n[32] D\n\n## 深度解析\n\n\
  **[1]** (A)\n**A.** 身份提供者（IdPs）包含用户账户并执行身份验证，结合联合身份环境，它们会生成包含用户断言（声明）的安全令牌，例如出生日期、部门等。然后，安全令牌由\
  \ IdP 使用其私钥进行数字签名。信任 IdP 签名的应用程序（使用 IdP 公钥）接受令牌并允许用户访问。\n\n**B, C, 和 D** 是错误的。资源提供者接受来自信任\
  \ IdP 的安全令牌并允许访问，例如访问 Web 。身份验证成功后，开放授权（OAuth）协议使用代表已身份验证的用户或设备的令牌（而非原始凭据）来授予资源访问，例如访问\
  \ Web 。安全断标记语言（SAML）标准用于在用户、IdP 以及信任 IdP 的资源提供者之间传输身份验证和授权消息。\n\n\n\n\n\n## 2. D.\n\
  `SAML` 标准用于在用户、IdP（身份提供者）和资源提供者之间传输身份验证和授权消息。IdP 对安全令牌进行数字签名，令牌包含关于用户或设备的声明（或断言），例如出生日期、成本中心、子网地址范围等。声明通常源于存储在用户或设备账户中的属性。\n\
  \nA、B 和 C 都是错误的。资源提供者接受来自信任 IdP 的安全令牌并允许访问（例如访问 Web 应用程序）。联邦身份配置中的 IdP 作为安全令牌服务\
  \ (STS) ，在用户或设备身份验证成功后对令牌进行数字签名；然后使用该令牌授予资源访问。公钥基础设施 (PKI) 证书是可以存储在文件、网络目录服务或智能卡中的安全证书。它唯一地标识设备或用户等主体。\n\
  \n## 3. C.\n用户账户包含许多属性（属性），例如经理名称、组成员身份、最后登录时间、城市等。这些属性可以与条件访问策略进行比较，以允许或阻止文件系统的访问。\n\
  \nA、B 和 D 都是错误的。基于角色的访问控制 (RBAC) 将权限分配给角色（例如“虚拟机管理器”），分配给该角色的用户继承该角色权限。自主访问控制 (DAC)\
  \ 将权限分配的控制权交给数据保管者（负责管理数据的人）。基于时间的访问控制使用策略根据日期和时间允许或拒绝资源访问。\n\n## 4. C.\n智能卡（你拥有的东西）的大小与信用卡相当，通常用于对\
  \ IT 系统进行身份验证。智能卡也可用于其他应用程序，如建筑访问或作为信用卡。现代信用卡包含一个嵌入式微处理器，可以执行加密操作。使用智能卡通常需要输入 PIN\
  \ 码（你知道的东西）。\n\nA、B 和 D 都是错误的。列出的项目是单因素认证的示例（你知道的东西、你拥有的东西）。多因素认证必须使用两种或更多类别，例如你拥有的东西（智能卡）和你知道的东西（PIN）。\n\
  \n## 5. B and C.\n`SSH` 公钥认证为每个要验证到 Linux 主机的用户使用一对公私钥。公钥存储在用户主目录下一名为 `.ssh` 的隐藏目录中（Linux\
  \ 中的点表示文件或目录是隐藏的）。私钥存储在用户管理设备上，并应用密码语保护。当用户验证登录 Linux 主机时，他们必须知道私钥的密码语。\n\nA 和 D\
  \ 都是错误的。公钥并不存储在用户本地；它存储在 Linux 主机上。私钥存储在用户将通过 `SSH` 远程管理 Linux 主机的设备上。\n\n## 6.\
  \ C.\n使用 `SSH` 公钥认证时，私钥存储在用户管理设备上。标准的安全实践规定私钥文件必须使用密码语保护。用户被提示输入私钥密码语，而不是用户账户密码。\n\
  \nA、B 和 D 都是错误的。`SSH` 在客户端或服务器上配置错误，因为用户被提示输入私钥密码语（而不是公钥密码语）。\n\n## 7. D.\n地理围栏使用设备位置跟踪，在移动设备用户位于特定地理边界时向其显示消息。\n\
  \nA、B 和 C 都是错误的。地理标记用于为照片等文件提供详细的位置信息。地理定位使用 `GPS` 或 IP 地址等方法来确定设备位置。全球定位系统 (`GPS`)\
  \ 使用环绕地球运行的卫星网络，通过经纬度坐标跟踪设备位置。\n\n## 8. A.\n地理标记用于为照片或社交媒体帖子等文件提供详细的位置元数据。\n\nB、C\
  \ 和 D 都是错误的。地理定位使用 `GPS` 或 IP 地址等方法来确定设备位置。`GPS` 使用环绕地球运行的卫星网络通过经纬度坐标跟踪设备位置。地理围栏使用设备位置跟踪，在移动设备用户位于特定地理边界时向其显示消息。\n\
  \n## 9. C.\n为用户账户配置密码历史可以防止用户重用密码；可以根据需要记住多少密码进行配置。\n\nA、B 和 D 都是错误的。这些选项不会防止使用旧密码。要求复杂密码使得恶意用户更难通过字典攻击等手段破解用户账户。配置用户账户锁定可以在特定时间范围内发生配置次数的连续失败登录尝试后，临时锁定（而非永久禁用）账户，并有助于缓解暴力破解密码攻击。基于时间的登录允许用户仅在指定的日期和时间登录，可以通过用户账户审计跟踪用户活动。\n\
  \n## 10. C.\n威慑性控制（如设备登录消息）旨在威慑或阻碍非法或恶意行为。\n\nA、B 和 D 都是错误的。检测性控制旨在识别安全事件，例如通过日志分析识别可疑活动。纠正性控制采取积极措施来包含或阻止可疑活动，例如安全设备拦截产生过多网络流量的\
  \ IP 地址。当首选的安全控制因不切实际或成本过高而无法实施时，使用补偿性控制；补偿性控制必须满足所述的安全要求。\n\n## 11. D.\n专门的安全操作系统（如安全增强\
  \ (SE) Linux）使用强制访问控制 (MAC) 来控制资源访问。通过 `MAC`，管理员对文件、网络端口或运行进程等项目进行标记，并创建分配给用户或远程网络设备的安全级别，以允许或阻止对标记项目的访问。操作系统强制\
  \ `MAC`。\n\n\n\n\n\n### 12\n![Images](img/com.jpg)\n**C** 和 **D.** 服务账户只能被分配软件正确运行所需的权限，然后配置软件使用该服务账户。通过在本地网络与公共云提供商之间建立对等\
  \ VPN，可以实现云端与本地虚拟机之间的安全连接。\n\n![Images](img/com-1.jpg)\n**A** 和 **B** 是错误的。HTTP\
  \ 不是一种安全的网络协议，尽管 HTTPS 可以满足上述要求。在此场景下，使用可多人共享的访客账户是不恰的；访客账户应对资源提供非常受限的访问。\n\n###\
  \ 13\n![Images](img/com.jpg)\n**D.** “不可能的旅行”安全功能监控来自不同位置的用户活动，以识别异常或高风险登录。例如，在纽约东部标准时间（EST）上午\
  \ 10 点从纽约登录，随后在上午 11 点从巴黎登录，这意味着在了一小时内于这两个地点之间进行了旅行，这是不可能的。如果使用了网络代理服务器或个人 VPN 匿名化软件，这种情况可能是合理的，在配置此类功能时必须考虑这一点。\n\
  \n![Images](img/com-1.jpg)\n**A, B,** 和 **C** 是错误的。PKI 层次结构中建立了信任链，其中设备将信任由受信任的证书颁机构颁发的证书。安全令牌由身份提供者（IdP）颁发，包含用户账户并执行身份验证；在联邦身份环境中，IdP\
