  \ 中的资源可以配置为“信任”来自组织 B 的成功认证令牌。这意味着组织 B 的用户身份不需要在组织 A 中重复，即可允许组织 B 用户账户访问组织 A 的资源。\n\
  \n# 第 8 章：确保网络基础设施的安全\n\n## 认证目标\n* 8.01 设计安全网络\n* 8.02 保护敏感数据\n* 8.03 网络端口安全\n\
  * 8.04 防火墙\n\n## 习题\n规划安全网络架构的设计是一项持续任务，因为网络需求会随时间推移而演变。网络交换机、防火墙、虚拟专用网络 (`VPNs`)\
  \ 和威胁缓解领域的新技术使得定期进行网络安全评估变得必要。\n\n网络边界安全可以通过硬件防火墙、代理服务器、网络访问控制配置和 `VPNs` 实现。`VPN`\
  \ 解决方案可能需要客户端 `VPN` 软件，也可以是无客户端的，这意味着可以使用现有的软件（如网络浏览器）通过加密隧道安全地访问资源。\n\n将当前的网络、主机和应用程序性能与已知的正常活动基准进行比较，可以帮你快速识别异常。你可以通过使用哈希、加密、数据泄露防护（DLP）、数据屏蔽和数据令牌化来保护敏感数据。\n\
  \n你还可以使用诱饵主机和网络（蜜罐主机和蜜罐网络）来监控恶意用户活动，这可以帮助缓解针对真实生产网络资产的威胁。所有这些网络管理和控制选项都可以从网络运营中心\
  \ (`NOC`) 远程应用。\n\n**1.** 你的经理要求你为异常的应用性能状况配置告警通知。你必须首先建立什么？\nA. IP 地址方案\nB. 基准\n\
  C. 网络拓图\nD. 命名规范\n\n**2.** 对你的呼叫中心的安全审计显示，当呼叫中心员工处理客户查询时，信用卡号码显示在他们的屏幕上。应该配置什么来隐藏客户的信用卡？\n\
  A. 加密\nB. 数据泄露防护\nC. 数据令牌化\nD. 数据屏蔽\n\n**3.** 你的组织在云端存储敏感医疗数据。由于法律原因，你必须确保数据不会复制到边界之外。哪个术语最能涵盖这一场景？\n\
  A. 权限管理\nB. `API` 策略\nC. 零信任\nD. 数据主权\n\n**4.** 你公司的用户使用 `VPN` 连接到公司网络。从网络部署的角度，`VPN`\
  \ 设备应该放在哪里？\nA. 默认 `VLAN`\nB. 内部网\nC. 屏幕保护子网\nD. 公有云\n\n**5.** 你需要对运行在组织私有 Microsoft\
  \ Active Directory (`AD`) 网络上的多个业务应用之间的网络流量进行加密。哪种解决方案可以在最小化技术人员工作的同时满足这一需求？\nA.\
  \ `SSL/TLS`\nB. `L2TP`\nC. 反向代理\nD. `IPSec`\n\n**6.** 你在云中运行虚拟机。出于安全考虑，你不希望每台虚拟机都有公网访问的\
  \ IP 地址。你应该配置什么来启用远程管理？（选择两个）\nA. 跳板机\nB. `VPN`\nC. 前向代理\nD. `HSM`\n\n**7.** 你需要限制接入网络端口时哪些设备可以激活。你应该配置什么？\n\
  A. 广播风暴防护\nB. MAC 过滤\nC. 桥接环路\nD. BPDU 保护\n\n**8.** 你的网络入侵检测系统 (`NIDS`) 配置为接收已知恶意攻击的自动更新。这种情况下使用的是哪种类型的入侵检测？\n\
  A. 异常检测\nB. 启发式\nC. 基于特征的\nD. 内联\n\n**9.** 你的防火墙配置为不考虑会话检查每个数据包。使用的是哪种类型？\nA. 有状态\n\
  B. Web 防墙\nC. 内容过滤（即 URL 过滤）\nD. 无状态\n\n**10.** 你公云中的虚拟机配置了私有 IP 地址。每台虚拟机只需要访问互联网。以下选项哪个最佳？\n\
