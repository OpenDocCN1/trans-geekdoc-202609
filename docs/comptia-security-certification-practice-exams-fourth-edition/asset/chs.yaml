  \ controller）角色决定数据如何被使用，例如将其提供其他方。数据分析师从多个源收集数据，以获得在其他情况下无法获得的意义见解。\n\n# 第 3 章：安全策略与标准\n\
  \n## 认证目标\n- 3.01 实施数据隐私\n- 3.02 理解数据类型和数据治理\n- 3.03 管理风险\n- 3.04 设计安全策略\n\n## 题目\n\
  安全策略提供了一个框架，所有类型的用户都可以该框架学习使用计算设备的正确程序。策略通常受到法律、法规和安全标准的影响。管理支持对于确保……至关重要\n\n####\
  \ 1\n你的在线零售业务接受 PayPal 和信用卡支付。你需要确保公司符合相关标准。你应该关注哪种安全标准？\nA. `GDPR`\nB. `PCI DSS`\n\
  C. `HIPAA`\nD. `PIPEDA`\n\n#### 2\n你的法律咨询公司总部位于柏林，在巴黎设有分公司。你正在确定如何遵守数据隐私法规。你的公司必须遵循哪些安全标准？\n\
  A. `GDPR`\nB. `PCI DSS`\nC. `HIPAA`\nD. `PIPEDA`\n\n#### 3\n你被聘请审查田纳西州一家医疗诊所的安全控制。该诊所必须符合哪些数据隐私框架？\n\
  A. `GDPR`\nB. `PCI DSS`\nC. `HIPAA`\nD. `PIPEDA`\n\n#### 4\n哪个操作对缓解 SQL 注入的影响最大？\n\
  A. 启用 `HTTPS`\nB. 更改 Web 服务器设置\nC. 启用输入验证\nD. 应用 Web 服务器操作系统更新\n\n#### 5\n你正在计划公司局域网上服务器和网络设备的安全管理。哪种设计能更好地保护这些设备免\
  \ `RDP` 和 `SSH` 攻击？\nA. 启用 `HTTPS`\nB. 定期漏洞扫描\nC. `SSH` 公钥认证\nD. 专用网络管理接口\n\n####\
  \ 6\n你需要从本地网络管理云端 Windows 虚拟机（VM）。哪种方案提供了最安全的远程管理解决方案？\nA. 为 `RDP` 启用 `HTTPS`\n\
  B. 为每个虚拟机配置公 IPv6 地址\nC. 使用 PowerShell 远程进行远程管理\nD. 通过跳板机（jump box）管理虚拟机\n\n####\
  \ 7\n在客户服务电话期间，客服代表定期在屏幕上调出客户详情，包括信用卡号。应该启用什么来防止信用卡号泄露？\nA. 令牌化（Tokenization）\n\
  B. 匿名化（Anonymization）\nC. 数据最小化（Data minimization）\nD. 数据掩码（Data masking）\n\n####\
  \ 8\n你被赋予制定一项关于业务目的使用智能手机的公司安全政策的任务。你首先应该做什么？\n\n\n\n\n\nA. 向所有员工发放智能手机。\n\nB. 从管理层获得支持。\n\
  \nC. 获取法律意见。\n\nD. 编写策略的草稿。\n\n### 9. 将安全策略术语与相应的定义匹配：\n\n| 安全策略术语 | 定义 |\n| ---\
  \ | --- |\n| 范围 (Scope) `____` | A. 描述安全策略如何提高安全性 |\n| 概述 (Overview) `____` | B.\
  \ 不遵守策略的后果 |\n| 策略 (Policy) `____` | C. 对整个安全策略中使用的术语进行解释 |\n| 定义 (Definitions)\
  \ `____` | D. 准与禁止清单的集合 |\n| 执行 (Enforcement) `____` | E. 定义安全策略适用于哪些用户 |\n\n###\
  \ 10. Christine 是你组织的服务器管理员。她的经理提供了分步骤的安全策略，概述了如何配置服务器以实现安全性最大。Christine 将实施哪种类型的安全策略？\n\
  \nA. 邮件服务器可接受使用策略\nB. VPN 服务器可接受使用策略\nC. 程序性策略 (Procedural policy)\nD. 文件服务器可接受使用策略\n\
  \n### 11. 以下哪些项是 PII（个人身份信息）的示例？（选择两个。）\n\nA. NAT 路由器的公 IP 地址\nB. 手机号码\nC. 数字证书\n\
  D. 性别\n\n### 12. 在经过长时间背景检查和面试过程后，你的公司聘用了一个名为 Tammy 的新工资结算员。Tammy 将在办公室的电脑上使用浏览器，通过互联网访问公共云提供商网站上的工资应用程序。Tammy\
