  \n# 16\n![Images](img/com.jpg)\n**B.**。法拉笼是一种可以屏蔽无线信号的设备，用于防止数据通过无线方式传输。在扣押移动设备时必须立即使用它以确保数据不被无线连接修改。\n\
  \n![Images](img/com-1.jpg)\n**A, C,** 和 **D** 是错误的。SIM 卡包含用户数据。静电袋（ESD）保护敏感电子元件免受静电放电。全球定位系统（GPS）干扰防止无线通信。\n\
  \n# 17\n![Images](img/com.jpg)\n**C.** 以太网交换机将端口隔离到自己的冲突域。在捕获网络流量时，这意味着你可以看到来自其他计算机的流量。某些交换机允许你监控端口，但题目没有提到这一点。\n\
