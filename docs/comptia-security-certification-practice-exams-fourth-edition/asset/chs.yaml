  \ PKI 证书。Regex 是“正则表达式”的通用术语，在某些命令行环境中用于数据模式匹配。\n\n### 14\n![Images](img/com.jpg)\
  \ **A.** 需要特定权限的软件可以配置使用服务账户，然后使用 `regedit.exe` 工具为注册表的某些部分授予权限。\n\n![Images](img/com-1.jpg)\
