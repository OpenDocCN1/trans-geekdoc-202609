  \ 欺骗行为 (Hoaxes)\nB. 尾随 (Tailgating)\nC. 翻垃圾桶 (Dumpster diving)\nD. 窥视 (Shoulder\
  \ surfing)\n\n### [29]\n你的经理听了很多关于社会工程攻击的内容，疑惑为什么攻击如此有效。以下哪项识别了攻击成功的原因？（选择三项。）\n\
