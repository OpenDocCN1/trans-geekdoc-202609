  \ SIM 卡，无需联系你的移动无线服务提供商。\n\n![Images](img/com-1.jpg)\n**A, B,** 和 **D** 是错误的。码分多址接入（CDMA）和\
  \ GSM 设备使用 SIM 卡，并可以在移动设备上存储用户数据。\n\n# 15\n![Images](img/com.jpg)\n**D.** USB 写保护设备确保在从存储介质（如数字相机的内部内存）收集数字证据时，数据只能单向传输。如果使用了此工具，必须记录这一事实以遵守监管链程序。\n\
