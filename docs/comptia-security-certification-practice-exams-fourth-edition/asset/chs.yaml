  \ McGraw Hill 内容的使用是可预见还是不可预见的。\n\n## TotalTester Online\n\nTotalTester Online 为您提供\
  \ CompTIA Security+ 考试的模拟。可以在练习模式（Practice Mode）或考试模式（Exam Mode）下考试。练习模式提供了一个辅助窗口，包含提示、书籍参考、正确和错误答案的解释，以及在测试时检查答案的选项。考试模式提供了实际考试的模拟。问题的数量、问题的类型和允许的时间旨在准确代表考试环境。自定义测验的选项允许您从选定的领域或章节创建自定义考试，并且可以进一步自定义问题的数量和允许的时间。\n\
  \n要参加测试，请按照上一节中提供的说明注册并激活您的 Total Seminars Training Hub 账户。注册后，您将进入 Total Seminars\
  \ Training Hub。从 Training Hub 首页，从页面顶部的 `Study` 下拉菜单选择 `CompTIA Security+ Practice\
  \ Exams (SY0-601) TotalTester`，或者从首页的 `Your Topics` 列表中选择。然后，您可以选择自定义测验的选项并在练习模式或考试模式下开始自测。所有考试都提供总分和按领域划分的分数。\n\
  \n### 预评估测试\n\n除了考试外，TotalTester 还包含 CompTIA Security+ 预评估测试，帮助您在阅读书籍之前评估对主题的理解。要启动预评估测试，点击\
  \ `Security+ Pre-Assessment`。CompTIA Security+ 预评估测试有 40 个问题。完成测试后，您可以通过点击 `I Would\
  \ Like To Review My Test.` 在详细结果（Detailed Results）屏幕上查看带有答案和详细解释的问题。完成预评估测试后，请参考\
  \ `Appendix A`, `Pre-Assessment Exam` 根据您的结果获取推荐的学习计划。书中打印的预评估问题与在线预评估中的问题相同，您可以选择使用书籍或\
  \ Total Tester 在线进行预评估。\n\n## 其他书籍资源\n\n以下章节详细介绍了书中书中提供的其他资源。您可以通过选择 `Resources`\
  \ 选项卡访问这些项目，或者从页面顶部的 `Study` 下拉菜单或首页的 `Your Topics` 列表中选择 `CompTIA Security+ Practice\
  \ Exams (SY0-601) Resources`。屏幕右侧的菜单列出了所有可用资源。\n\n### 性能型问题\n\n除了多选题外，CompTIA Security+\
  \ 考试还包括性能型问题（PBQs），根据 CompTIA 的说明，这些旨在测试您在模拟环境中解决问题的能力。有关 PBQ 的更多信息请访问 CompTIA 网站。您可以通过导航到\
  \ `Resources` 选项卡并选择 `Performance-Based Questions Quiz` 来访问本书包含的性能型问题。选择 PBQ 后，交互式测验将在您的浏览器中启动。\n\
