  \n![Images](img/com-1.jpg) A、B 和 D 都是错误的。僵尸网络是受单个恶意用户控制的受感染计算机集合。入侵防御系统 (IPS) 会积极监控网络或系统的异常活动，并可以配置为采取措施停止或遏制这些活动。与\
  \ IPS 类似，入侵检测系统 (IDS) 也会监控网络或系统的不规则活动，但它不会尝试停止这些活动。\n\n### 39\n![Images](img/com.jpg)\
  \ A. 基础设施即服务 (IaaS) 指云端提供的计算、网络和存储服务。\n\n![Images](img/com-1.jpg) B、C 和 D 是错误的。平台即服务\
  \ (PaaS) 主要是软件人员感兴趣，并通过网络提供数据库和编程 API 等 IT 服务。万物即服务 (XaaS) 是一个通用术语，用于描述通过网络交付的 IT\
  \ 服务。软件即服务 (SaaS) 允许通过网络快速部署终端用户生产力软件。\n\n### 40\n![Images](img/com.jpg) D. Linux\
  \ `journalctl` 命令用于查看 systemd 日志，并包含过滤功能，例如 `journalctl -b` 查看与最近启动相关的日志条目（这将显示自重启以来收集的日志条目）。\n\
  \n![Images](img/com-1.jpg) A、B 和 C 是错误的。内置的 Linux `dd` 命令可以将磁盘卷复制到镜像文件中进行分析，同时保持原始文件系统完整。Linux\
  \ `chmod` 命令用于设置文件系统权限，例如授予用户读写权限，`chmod u +rw file.txt`。`tcpdump` 命令用于捕获特定或所有网络接口上的流量，例如\
  \ `tcpdump -i any`。\n\n## 创建您的学习计划\n\n恭喜完成 Security+ 预评估！您现在应该花时间根据两个目标分析结果。\n\n\
