  \n**20.** 你是家小型 IT 公司的网络管理员。所有服务器位于位于站点。员工使用网络浏览器访问他们的电子邮件账户。在测试 `DRP` 并获得管理批准后，你将副本通过电子邮件给所有员工，以便他们在发生灾难时参考。识别问题所在。\n\
  \nA. 电子邮件应该经过加密。\nB. 电子邮件应该经过数字签名。\nC. 只有高管应该收到此消息。\nD. 邮件服务器在发生灾难时可能不可。\n\n**21.**\
  \ 你是家小型 IT 公司的网络管理员。所有服务器都托管在外部公有云中。在分析威胁、创建 `DRP` 并获得管理批准后，你将副本通过电子邮件给所有员工，以便他们在发生灾难时参考。识别最严重的问题。\n\
  \nA. 电子邮件应该经过加密。\nB. `DRP` 未经测试。\nC. 电子邮件应该经过数字签名。\nD. 只有高管应该收到此消息。\n\n**22.** 关于灾难恢复，以下哪些是正确的？（选择两个。）\n\
  \nA. 计划一旦完成，就不再需要重新审视。\nB. 计划一旦完成，必须获得管理批准。\nC. 计划必须随业务发展而演进。\nD. 计划应该只包含 IT 系统。\n\
  \n**23.** 使用 `Figure 18-3`，将左侧的描述与对应的术语匹配。\n\n```\n[Images/fig18-3.jpg]\n图 18-3\n\
  ```\n\n### 灾难恢复与业务连续性术语\n\n**24.** 你是一个网站管理员。发生灾难或安全侵害时，你需要尽可能减少网站停机时间。以下哪个术语描述硬盘的可靠性？\n\
  \nA. `MTBF`\nB. `MTTF`\nC. `MTTR`\nD. `RPO`\n\n**25.** 作为 IT 总监，你正在比较不同的公有云提供商。你的公司将不再本地托管电子邮件或应用程序服务器。为了确保电子邮件和应用程序对用户可用，你必须考虑你控制范围内的哪些因素？\n\
  \nA. 应用于云提供商虚拟程序的更新\nB. 冗余网络链路\nC. 云提供商服务器上使用的 `RAID` 级别\nD. 云提供商服务器硬盘的 `MTTF`\n\
  \n**26.** 使用 `Figure 18-4`，将左侧的定义与正确的术语匹配。\n\n```\n[Images/fig18-4.jpg]\n图 18-4\n\
  ```\n\n### 业务影响术语\n\n**27.** 你配置了企业云存储，使其持续复制到不同区域的云提供商数据中心。只有在数据写入主存储后，才会复制到备区域。哪个术语最能描述这种韧性配置？\n\
  \nA. 同步复制\nB. 地理服务分散\nC. 专用电路\nD. 负载均衡\n\n**28.** 哪种存储区域网络术语描述主机使用多个物理路径来访问共享网络存储？\n\
  \nA. 多路并发 (Multipathing)\nB. 负载均衡\nC. `RAID 0`\nD. `RAID 1`\n\n**29.** 哪种配置提供了负载均衡？\n\
  \nA. 多路并发\nB. `UPS`\nC. 网卡聚合 (NIC teaming)\n\n**30.** 你的 Windows 服务器无法启动操作系统。没有应用任何更新或配置更改。你应该如何解决问题？\n\
