  \ `A`、`B` 和 `D` 是错误的。`virus`（病毒）是在未经用户许可的情况下执行恶意操作的应用。`worm`（蠕虫）是可以自我复制的恶意软件。`keylogger`（键盘记录器）拦截并存储安装在机器上的每个击键。\n\
  \n31. ![Images](img/com.jpg) `A.` 远程访问木马（`RAT`）表现为合法软件，可以感染宿主并允许攻击者通过网络获得该主机的特权访问权限。\n\
  \n\n\n\n## 认证目标\n\n- 6.01 使用加密保护静态数据保护\n- 6.02 网络服务端口号\n- 6.03 安全配置 Windows 注册表\n\
  - 6.04 Windows 和 Linux 更新管理\n\n## 问题\n\n威胁缓解技术通过减少攻击面来帮助加固计算环境。威胁包括对敏感数据的未经授权访问，以及暴露在互联网上的标准网络服务端口。\n\
  \n磁盘加密通过提供机密性来保护静态敏感数据；只有拥有正确解密口令或密钥的所有者才能解密加密数据。禁用未使用的网络服务并更改默认监听端口号可以增加攻击者确定正在使用哪些网络服务的难度。\n\
  \nWindows 注册表包含数千个设置，其中某些与安全有关。了解管理注册表设置的方法有助于安全专业人员加固环境。企业还需要一种自动更新部署的集中机制，无论是在\
  \ Windows 还是 Linux 环境下。\n\n**[1]](#ch6.xhtml#ch6qug_1).** 你已为云虚拟机硬盘启用了加密。此配置适用于哪个术语？\n\
