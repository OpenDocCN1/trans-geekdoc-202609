  \ 注入涉及将 SQL 代码插入应用程序以操纵底层的数据库或系统。\n\n### [21]\n![Images](img/com.jpg) **C.** 在混合密码攻击中，攻击者使用字典文件和暴力破解攻击尝试猜测用户的密码；软件通过在每个单词末尾添加数字对字典单词进行修改，然后通过暴力破解尝试在每个密码生成时应用它。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **D** 是错误的。虽然字典攻击确实使用字典文件，但它只使用文件中找到的条目，而不尝试修改文件的单词。暴力破解是一种破解密码的试错法技术，是混合攻击的一个组成部分。不存在所谓的修改攻击。\n\
  \n### [22]\n![Images](img/com.jpg) **B.** 因为暴力破解在数学上的目标是计算所有可能的密码，如果你给攻击者足够的时间，攻击者将破解密码，包括复杂密码。这里的关键在于你需要剥夺攻击者的时间，你通过启用账户锁定来实现这一点——在一定次数的错误登录尝试后，账户将被锁定。注意，密码应以加密格式存储，这样如果有人访问了存储密码的数据库，他们看到的也不是明文密码。\n\
  \n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。修补无法防御任何类型的密码攻击，而强密码和密码复杂度（两者为一）构成了字典攻击的应对措施，而非暴力破解攻击。\n\
  \n### [23]\n![Images](img/com.jpg) **D.** 语音钓鱼（Vishing）是一种社会工程攻击，攻击者拨打用户电话试图骗人在电话或\
  \ IP 电话（VOIP）通话中透露安全信息。“Vishing”一词源于它类似于网络钓鱼（phishing），但攻击不是通过电子邮件发出的，而是使用电话（语音）。\n\
  \n![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。网络钓鱼发生在受害者收到一封通常要求用户点击链接访问网站的电子邮件时。捕鲸攻击（Whaling）是一种网络钓鱼攻击，但它旨在针对公司内部的高管（大鱼！）。尾随（Tailgating）发生在未经授权的人试图跟在授权人员后面以溜进锁上的门时。\n\
  \n### [24]\n![Images](img/com.jpg) **B.** Tom 安装了一个木马病毒，这种程序伪装成做某件事，实际上却做其他事情或额外的事情。\n\
  \n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。键盘记录器是一种记录击键并将其发送给攻击者的程序。蠕虫是自我复制的恶意软件，逻辑炸是由特定日期等事件触发的恶意代码。\n\
  \n### [25]\n![Images](img/com.jpg) **C.** 蓝牙钓鱼（Bluejacking）发生在攻击者向蓝牙设备（如手机）发送未经请求的短信时。\n\
