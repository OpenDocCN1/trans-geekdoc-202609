  \ 隧道激活时，分支机构之间的流量在通过 VPN 隧道时会被加密。每个分支机构的客户端终端设备不需要 VPN 客户端配置，就像它们使用远程访问 VPN 连接时那样。\n\
  \n![Images](img/com-1.jpg) `A`、`B` 和 `D` 是错误的。始终开启 VPN 配置不需要用户手动创建 VPN 隧道；相反，这会在设备启动并连接到互联网或在用户设备上启动特定应用程序时发生。可以为\
  \ VPN 配置分流隧道，使得到企业资源的连接通过 VPN，而互联网连接则通过用户的互联网连接。IPSec 是一种网络安全协议，可以在无需专门配置应用程序的情况下保护网络流量，与\
  \ SSL/TLS 不同。\n\n### 21\n![Images](img/com.jpg) **C.** HTML5 VPN 门户使用户能够仅使用 HTML5\
