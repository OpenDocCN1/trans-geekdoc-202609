  \n\n\n## 引言\n欢迎选用 `CompTIA Security+ Certification Practice Exams, Fourth Edition`！本书是准备\
  \ CompTIA Security+ 认证考试（`SY0-601`）以及你在 IT 安全领域开展工作的辅助工具。在彻底学习完 `CompTIA Security+\
  \ Certification Study Guide, Fourth Edition` 后，你可以使用本练习题集来测试你的知识。\n\n### CompTIA\
  \ Security+ 考试 (考试 SY0-601)\nCompTIA Security+ 认证考试是一项中立性考试，旨在验证你在风险识别与管理、设备和网络的物理及数字安全控制的应用、灾难恢复、对法律和监管机构制定规则的遵守以及云计算方面的技能。该认证针对具有至少两年\
  \ IT 管理经验且侧重于安全的人员。\n\nCompTIA Security+ 考试包含五个领域（类别）。CompTIA 代表了对于参加此考试的初级 IT 专业人员所需的知识体系而言，每个领域的相对重要性。\n\
  \n| 1.0 攻击、威胁与漏洞 | 24% |\n| --- --- |\n| 2.0 架构与设计 | 21% |\n| 3.0 实现 | 25% |\n|\
  \ 4.0 运营与事件响应 | 16% |\n| 5.0 治理、风险与合规 | 14% |\n\n你的 CompTIA Security+ 认证自认证之日起有效期为三年，期后你必须参加最新版本的考试以维持你的认证。关于\
  \ CompTIA Security+ 认证和考试的详细信息请访问 `www.comptia.org`。\n\n### 本书\n本书的目的是通过让你熟悉考试中测试的技术和知识体系，帮助你为\
  \ CompTIA Security+ 考试做准备。由于本书的主要重点是帮助你通过考试，因此我们并不总是涵盖相关技术的每个方面。对某些技术的涵盖仅限于帮助你理解通过考试所需的知识的必要范围，但我们希望本书在你参加完考试后，也能成为你宝贵的专业资源。\n\
  \n`CompTIA Security+ Certification Practice Exams, Fourth Edition (Exam SY0-601)`\
  \ 了一了一系列根据官方考试目标组织的练习测试题。21 个章节包含 600 多道题，涵盖了 `SY0-601` 考试的所有目标。此外，附带的媒体包含 300 道题，采用可自定义测试引擎，使你能够在模拟测试环境中进行三次完整的模拟考试，或者按章节或考试领域进行自定义考试。\n\
  \n本书由 Glen E. Clarke 会同 `CompTIA Security+ Certification Study Guide, Fourth Edition\
  \ (Exam SY0-601)` 共同开发和编写。目标的呈现顺序相同，章节标题也相同。这些书籍的设计旨在共同工作，成为一套全面的自学计划。\n\n#### 考前评估\n\
  本书在 `附录 A` 中包含了一份考前评估考试。考前评估将衡量你的优势和劣势领域，以便你根据需求定制学习计划。我们建议在开始回答`第 1 章`的问题之前进行考前评估测试。\n\
  \n#### 每一章节\n本书的组织方式旨在为丰富的安全专业人士和安全技术的新手提供 CompTIA Security+ 考试的深度复习。每个章节都涵盖了考试的一个主要方面，并有练习题来测试你对特定考试目标的掌握。`SY0-601`\
  \ 考试将向你展示一些基于性能的题目，测试你执行任务以解决问题的能力。这可能以输入命令、在网络地图上正确放置网络设备或将术语与定义进行匹配的形式出现。\n\n\
  每个章节都包含能够引导你注意重要项目并强化要点的组件。在每一章中，你会发现：\n\n- 每一章都以**认证目标**开始，即该章节涵盖的官方 CompTIA 考试目标列表。\n\
  - 每一章都包含与实际考试相似的**练习题**。通过回答这些问题，你可以在测试自己知识的同时，熟悉考试题的结构。\n\n\n\n\n\n![Images](img/square.jpg)\
  \ **快速答案对照**部分位于习题之后，方便你轻松检查答案。\n\n![Images](img/square.jpg) 每个章节末尾的**深度解析**包含了对正确和错误答案选项的解释，并提供了复习考试考点的机会。\n\
  \n### 练习考试\n\n除了书中包含的 600 多道题外，附带介质上的可自定义测试引擎中还包含了 300 道题。你可以按目标或按章节创建练习考试，也可以参加全长度的练习考试。与章节中的题目一样，这些练习考试也包含了对正确和错误答案选项的详细解释。有关有关附带介质的更多信息，请参阅附录\
  \ B。\n\n### 使用策略\n\n你可以通过多种方式使用本书，无论是与*CompTIA Security+ 认证学习指南（第四版）*同时使用，还是将其作为独立的备考工具。\n\
  \n![Images](img/square.jpg) **配合学习指南使用** 采用逐章节的方法，你可以选择阅读*学习指南*中的一个章节，然后通过相应*练习考试*章节中的题目来练习你所学的知识，在学习过程中交替使用两本书。\n\
  \n![Images](img/square.jpg) **仅使用练习考试书籍** 在阅读完学习指南后使用*练习考试*书籍，或将其作为独立的备考工具，你可以从头到尾学习整本书，并将三次练习考试作为准备工作的最后一步。\n\
  \n或者，通过下一节中的“考试准备就绪清单”，你可以评估自己的专业水平，确定需要重点关注哪些目标，然后按目标完成书中学习。清单注明了哪些问题属于哪些目标，使你能够定制自己的复习内容。\n\
