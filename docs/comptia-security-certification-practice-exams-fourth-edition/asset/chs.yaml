  \ 身份与资源提供者\n- 11.02 访问控制方法\n- 11.03 安全控制\n\n## 题目\n\n现代 Web 应用程序能够通过用户名和密码直接验证用户，或者通过信任\
  \ `Google` 和 `Facebook` 等提供者来验证用户，用户可能已经拥有登录凭据并可能设置了多因素认证。\n\n授予访问资源的权限可以使用许多方法，包括角色成员身份、条件规则访问或安全策略，并由专门、安全的操作系统强制执行。\n\
  \nIT 技术人员可以使用多种安全控制类型来保护资产。某些控制本质上是预防性的，例如`firewalls`，而另一些本质上是检测性的，例如日志文件分析。必须实施适当的安全控制并定期评估其效力，特别是当法律或法规要求安全控制时。\n\
  \n**1.** 哪个身份联邦组件负责验证用户？\n\nA. 身份提供者\nB. 资源提供者\nC. `OAuth`\nD. 令牌\n\n**2.** 哪个 `SAML`\
