  \ 标准定义了实体之间如何共享网络安全情报信息。`STIX` 标准定义了网络安全信息的交换格式。\n\n### 32\n![Images](img/com.jpg)\
  \ `B.` 数据保管者（data custodian）或数据管理员（data steward）角色根据数据所有者规定的政策管理数据资产。在这种情况下，设置文件系统权限是数据保管者的责任。列出的文件系统权限应用于本地机器，并在文件夹共享时通过服务器消息块（`SMB`）协议在网络上应用。\n\
