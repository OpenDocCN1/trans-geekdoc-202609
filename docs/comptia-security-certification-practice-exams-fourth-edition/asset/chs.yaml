  \ B\n16. D\n17. B\n18. A\n19. C\n20. D\n21. B\n22. B, C\n23. 参见“深度解析.”\n24. C\n\
  25. B\n26. 参见“深度解析.”\n27. B\n28. A\n29. C\n30. C\n31. B\n32. D\n\n## 深度解析\n\n1.\
  \ ![Images](img/com.jpg) **B.** 独立磁盘冗余阵列（RAID）1 级是指磁盘镜像。数据被写入一个磁盘并复制到第二个磁盘上。如果发生单磁盘故障，另一块磁盘可以接管。\n\
  \n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。`RAID 0` 涉及将数据跨多个磁盘条带化以提高性能，但没有容错能力，因为单个磁盘故障会导致所有数据丢失。`RAID\
  \ 5` 将数据跨磁盘进行条带化（至少三块磁盘），但将奇校验（恢复）数据分布在磁盘上，使得单磁盘故障意味着数据仍然可以重建。`RAID 5+1` 是镜像 `RAID\
  \ 5` 阵列。\n\n2. ![Images](img/com.jpg) **B.** 业务影响分析（`BIA`），也称为业务影响评估，用于识别意外事件对业务运营的影响。\n\
  \n![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。识别关键任务系统和组件（也称为任务必需的）是进行风险分析时确定资产及其价值的一部分。风险评估识别资产及其相关的威胁和潜在损失；这些可用于创建安全策略，并是\
  \ `BIA` 不可缺的一部分。\n\n3. ![Images](img/com.jpg) **A.** 两个服务器之间的集群软件允许客户系统在一个服务器故障的情况下运行，因为数据没有存储在单个服务器中，而是存在于两个集群节点都可以访问的共享存储上。当集群节点（服务器）故障时，应用程序将切换到正在运行的集群节点。\n\
  \n![Images](img/com-1.jpg) **B, C,** 和 **D** 是错误的。安排每日数据复制不能保证软件始终在线。大多数云提供商允许云存储数据在远距离的位置之间进行复制。这可以防止由于区域灾难导致的数据丢失或停机。如果服务器故障，`RAID\
  \ 1`（镜像）和 `RAID 5`（带分布式奇校验的条带化）将毫无用处。\n\n4. ![Images](img/com.jpg) **B.** 网络负载均衡（`NLB`）可以将网络流量分发到托管相同内容的多个服务器以提高性能。在云中，负载均衡器可以使用\
  \ `autoscaling` 根据应用程序需求添加或删除虚拟机。\n\n![Images](img/com-1.jpg) **A, C,** 和 **D**\
  \ 是错误的。大多数网络已经在使用以太网交换机，但这对网站的响应时间没有影响。光纤通道交换机用于存储区域网络（SAN`），而不是局域网（`LAN`）或广域网（`WAN`）。代理服务器为客户端检索互联网内容并可选缓存供后续请求；它不会提高性能。\n\
  \n5. ![Images](img/com.jpg) **B.** 有了硬件容错，硬件组件可以故障而不会完全阻塞数据访问。`RAID 5` 配置中的单磁盘故障意味着故障磁盘可以用可用磁盘进行热插。由于\
  \ `RAID 5` 将数据跨阵列中的磁盘条带化，且奇校验分布在磁盘上，用户对数据的请求可以在 `RAM` 中动态重建，直到数据在替换的磁盘上完成重建。\n\n\
  ![Images](img/com-1.jpg) **A, C,** 和 **D** 是错误的。磁盘集群是一个通用术语，没有详细描述场景。磁盘条带化（`RAID\
  \ 0`）不提供容错能力，仅通过在组磁盘上写入数据段来提高性能。磁盘镜像（`RAID 1`）不适用，因为题目指出正在使用 `RAID 5`。\n\n6. ![Images](img/com.jpg)\
  \ **C.** 差异备份将归档自上次全量备份以来更改的数据。恢复数据意味着首先恢复全量备份，然后是最新的差异备份。全量备份在不与差异备份配合使用时，也称为 `copy\
  \ backup`。\n\n![Images](img/com-1.jpg) **A, B,** 和 **D** 是错误的。增量备份归档自上次增量备份以来更改的数据。磁盘快照是磁盘内容的时间点副本，允许恢复整个磁盘或特定的文件或文件夹。某些磁盘快照解决方案将未更改数据的指针存储在父快照中，而将更改的数据完整地存储在的新快照中。在特定点存储整个磁盘的状态是通过创建磁盘映像实现的。\n\
  \n7. ![Images](img/com.jpg) **D.** 业务连续性被认为是灾难恢复发挥的关键目标。灾难恢复（`DR`）通常涉及实施使业务运行的步骤。业务连续性确保在\
  \ `DRP` 成功实施后业务继续运营。保持组织功能正常有时需要在主站点故障时使用备用站点，或者在人员短缺时使用招聘机构（违背正常业务惯）来雇佣工人。\n\n\
  ![Images](img/com-1.jpg) **A, B,** 和 **C** 是错误的。风险管理是指最小化潜在风险对业务流程连续性、业务资产以及人员安全和生命的影响。容错不是计划的类型；容错属于风险管理的范畴。灾难恢复涉及有计划地将业务恢复正常运行，是业务连续性计划的一部分。\n\
  \n8. ![Images](img/com.jpg) **C.** 将数据和奇校验信息分布在磁盘上被称为 `RAID` 5 级。\n\n![Images](img/com-1.jpg)\
  \ **A, B,** 和 **D** 是错误的。`RAID 0`（条带化）在磁盘间写入数据段但不带奇校验，因此有性能优势但没有容错能力。`RAID 1`（镜像）将写入第一个磁盘的数据复制到第二个磁盘以防磁盘故障。`RAID\
  \ 5+1` 镜像 `RAID 5` 配置以额外的容错。\n\n9. ![Images](img/com.jpg) **A** 和 **C.** 为了减少篡改的可能性，应由另一人审核备份日志。为了机密性，存储在外部磁带应加密。\n\
  \n![Images](img/com-1.jpg) **B** 和 **D** 是错误的。不需要是 `Administrators` 组的成员，但需要位于 `Backup\
  \ Operators` 组。`SSL` 加密网络流量而非存储的数据。\n\n10. ![Images](img/com.jpg) **A.** 灾难恢复计划概述了在发生不利事件时具体谁必须做什么。\n\
  \n\n\n\n\n![Images](img/com-1.jpg) `B`、`C` 和 `D` 是错误的。风险分析识别对资产的威胁并对这些威胁进行排序，但在灾难发生采取的措施包含在灾难恢复计划（DRP）中。这里不需要\
  \ Windows 服务器；需要的是灾难恢复计划。如果 Linux 服务器停止运行，集群只会让情况恶化，因为集群会引入更多的复杂性。管理员应该接受 Linux\
  \ 培训，并制定一个针对 Linux 服务器的灾难恢复计划。\n\n### 11\n![Images](img/com.jpg) `B` 和 `C.` 高可用性使资源尽可能保持可用。冗余的互联网链接允许在一条互联网链路故障时仍访问网站。网络负载均衡（可以使用冗余的互联网链接）将流量均匀地分布到服务器集群节点或通过冗余网络链路。\n\
  \n![Images](img/com-1.jpg) `A` 和 `D` 是错误的。可信平台模块（TPM）是一种用于验证机器启动完整性并存储用于加密硬盘的加密密钥的固件。虽然这解决了完整性和机密性，但它没有解决高可用性。CMOS\
  \ 升级可能会改进或为 Web 服务器提供新的硬件能力，但不直接解决高可用性。如果 CMOS 更新修复了 RAID 配置中的问题，那么它就能解决高可用性，但选项中没有列出此项。\n\
  \n### 12\n![Images](img/com.jpg) `B`、`D` 和 `E.` 对对风险进行排名，以确定哪些是最可能发生的。应该关注最可能发生的威胁。必须根据灾难恢复计划（DRP）为人员分配任务，以最大限地减少混乱和停机时间。DRP\
  \ 还提供了有关恢复顺序的细节，例如软件组件必须重新投入运行顺序。至少应该考虑备用站点（冷备、温备或热备）。较大的企业或机构可能认为维护备用站点的成本是。\n\n\
  ![Images](img/com-1.jpg) `A` 和 `C` 是错误的。IP 地址分类与网络规划相关，与 DRP 相关较小。虽然应该始终禁用未使用的交换机端口，但在制定\
  \ DRP 时不会考虑这一点。\n\n### 13\n![Images](img/com.jpg) `D.` 业务影响分析识别哪些风险对业务运营的影响大于其他。这对于决定如何从灾难中恢复非常有价值。\n\
  \n![Images](img/com-1.jpg) `A`、`B` 和 `C` 是错误的。免费下载的 DRP 模板是通用的，无法解决您的特定业务或 IT 配置。投资回报率（ROI）决定了投资的效率（成本是否合理？）。总拥有成本（TCO）识别产品或服务的真实成本。ROI\
  \ 和 TCO 都不像业务影响分析那样直接关联到 DRP。\n\n### 14\n![Images](img/com.jpg) `B` 和 `C.` 您的 DRP\
  \ 应该比下载模板提供的具体得多。DRP 必须进行初始和定期进行测试，以确保其效率和效力。\n\n![Images](img/com-1.jpg) `A` 和\
  \ `D` 是错误的。DRP 考虑了业务影响分析。旧两个版本的备份软件可能仍能正常运行；通常，立即使用最新软件存在风险。\n\n### 15\n![Images](img/com.jpg)\
  \ `A` 和 `B.` 云端在线数据存储是保护业务数据的负担得解决方案，但必须考虑从云端恢复所需的时间；它受到距离最近云提供商数据中心距离和可用网络带宽等因素的影响。用户必须知道在灾难发生时做什么，以确保业务及时恢复。\n\
  \n![Images](img/com-1.jpg) `C` 和 `D` 是错误的。更快的计算机对小企业的 DRP 不产生影响。考虑到员工人数少且只有一个场点，购买文件服务器是不合理的。\n\
  \n### 16\n![Images](img/com.jpg) `D.` 如果单个物理主机发生故障，所有五个虚拟机将无法使用。第二个服务器应与第一台服务器组成集群，虚拟机应使用共享磁盘存储而不是本地磁盘存储。\n\
  \n![Images](img/com-1.jpg) `A`、`B` 和 `C` 是错误的。RAID 5 无法解决磁盘位于单个服务器中的问题。即使使用了共享存储，物理服务器仍然是单点故障。在足够的硬件资源下，虚拟化服务器上同时运行的虚拟机远于五个。\n\
  \n### 17\n![Images](img/com.jpg) `B.` 如果需要细粒度恢复，使用安装在每个虚拟机中的备份代理来备份每台虚拟机是最佳选择。\n\
  \n![Images](img/com-1.jpg) `A`、`C` 和 `D` 是错误的。备份 SAN 意味着备份虚拟机使用的虚拟硬盘。如果你必须恢复特定的（细粒度的）文件，这将带来一些困难。无论如何，备份总是必须的。如果虚拟硬盘在\
  \ SAN 上，所有四个虚拟机并不需要运行在同一个物理主机上。\n\n### 18\n![Images](img/com.jpg) `A.` 存储在外的备份磁盘应该加密以确保数据机密性。没有正确的解密密钥，磁盘内容将无法访问。\n\
  \n![Images](img/com-1.jpg) `B`、`C` 和 `D` 是错误的。为每个备份文件生成哈希值用于检测文件变化（完整性）；这不提供机密性。静电袋保护电子组件免受静电释放；对磁盘上的数据没有任何保护。异地备份是灾难恢复中的关键部分，但与数据机密性无关。\n\
  \n### 19\n![Images](img/com.jpg) `C.` 灾难恢复计划（DRP）规定了在灾难发生时谁应该做什么，例如服务器无法启动的情况下。`A`、`B`\
  \ 和 `D` 是错误的。运行 Windows 更新可能无法解决问题，因为虚拟机已经是最新的。可能需要进行格式化、重新安装和磁带恢复，但最好的答案是参考您的 DRP。业务连续计划（BCP）努力减少已发生威胁对业务的影响。BCP\
  \ 不如 DRP 具体。DRP 是针对恢复特定系统的。\n\n### 20\n![Images](img/com.jpg) `D.` 灾难恢复计划的副本存在于邮件服务器上，当用户在最需要它时可能无法访问。必须考虑备用存储位置和物理副本。\n\
  \n![Images](img/com-1.jpg) `A`、`B` 和 `C` 是错误的。虽然加密和数字签名电子邮件是良好的做法，但这些答案在该场景下并不是问题。全面的\
  \ DRP 必须提供给相关的员工。\n\n### 21\n![Images](img/com.jpg) `B.` DRP 随业务变化，并且必须进行测试以确保其成功，而这一点在这里似乎没有这样做。\n\
  \n![Images](img/com-1.jpg) `A`、`C` 和 `D` 是错误的。所有员工都必须了解 IT DRP。\n\n\n\n\n\n### [22]\n\
  **B** 和 **C**。如果没有管理支持和批准，灾难恢复计划无法成功。必须定期重新审查该计划，以确保其与业务的变化保持一致。\n\n**A** 和 **D**\
  \ 是错误的。灾难恢复计划必须定期重新审查。除了 IT 系统外，灾难恢复还包括设施恢复和员工迁移系统。\n\n### [23]\n**图 18-5** 显示了术语与描述的正确匹配。为了提高性能，负载均衡将网络流量分配到服务器场（或集合）中，这些服务器提供相同的网络服务。最不忙且正在运行的服务器通常是处理当前请求的服务器。桌面演练有助于帮助灾难恢复（DR）委员会确保业务连续性计划（BCP）符合组织的灾难恢复目标，包括确定所有参与方的责任。`RAID`\
  \ 将物理磁盘组合成操作系统可见的逻辑磁盘。这样做是为了提高磁盘性能并/或在发生磁盘故障时提供冗余。\n\n![Images](img/fig18-5.jpg)\n\
  **图 18-5**\n灾难恢复与业务连续性术语——答案\n\n### [24]\n**C.** 平均故障恢复时间（MTTR）（有时也称为平均恢复时间）衡量的是设备、系统或网络恢复到正常功能所需的时间。\n\
  \n**A、B、** 和 **D** 是错误的。平均故障间隔时间（MTBF）是可修复设备每次连续故障之间的时间度量。平均无故障时间（MTTF）是应用于硬盘等不可修复物品的统计测量值。它表示在有特定数量的设备在使用的情况下，设备的平均使用寿命。恢复点目标（RPO）是指从故障发生后到系统和数据恢复正常运行之前可以流逝的时间；例如，六小时的\
  \ RPO 意味着数据备份的久旧程度永远不会超过六小时。恢复时间目标（RTO）的区别在于，它表示的是发生意外故障后，系统恢复到正常运行所需的时间。与 `RPO`\
  \ 不同，它没有规定数据可以有多久的历史。\n\n### [25]\n**B.** 通往互联网的冗余网络链接将确保如果一个互联网连接失败，可以使用另一个连接来访问云中的电子邮件和应用程序服务。\n\
  \n**A、C** 和 **D** 是错误的。更新虚拟机程序服务器、`RAID` 磁盘配置和 `MTTF` 不在你的控制范围内；它们是云提供者的责任。\n\n\
  ### [26]\n**图 18-6** 显示了术语与定义的正确匹配。恢复点目标（`RPO`）是故障发生与恢复正常业务运行之间的时间度量。隐私影响评估通常是遵守隐私法规的要求，用于确定哪些保护措施可以缓解针对敏感数据（如个人身份信息\
  \ PII）的威胁，以及如果此类数据遭到泄露，事件响应将如何进行。隐私阈值评估通常在隐私影响评估之前，因为必须首先识别处理敏感数据的系统。\n\n![Images](img/fig18-6.jpg)\n\
  **图 18-6**\n业务影响术语——答案\n\n### [27]\n**B.** 地理分散是指通过跨地理区域复制来扩展 IT 服务（如云存储或虚拟机），以增加对区域性停机、灾难或其他其他类型中断的韧性。通过\
  \ `SAN` 复制等技术，可以将相同的配置用于数据中心内部的本地冗余。\n\n**A、C** 和 **D** 是错误的。同步复制在将数据复制到次存储位置之前不会等待数据写入主存储位置，但异步复制则会。专用电路是不经过互联网的私有网络链路，可用于云客户的本地网络与公有云之间。为了提高应用程序性能并增加与应用程序服务器故障相关的韧性，负载均衡器接受客户端应用程序请求，并将这些请求路由到运行应用程序的后端服务器池中。\n\
  \n### [28]\n**A.** 为了提高应对故障的韧性，存储区域网络（`SAN`）管理员可以启用多路径，这为主机提供了通向共享存储的多条物理路径。\n\n\
  **B、C** 和 **D** 是错误的。列出的项目并非特定的冗余网络路径。为了提高应用程序性能并增加与应用程序服务器故障相关的韧性，负载均衡器接受客户端应用程序请求，并将这些请求路由到运行应用程序的后端服务器池中。`RAID\
  \ 0`（条带）在不带奇偶校验的情况下跨磁盘写入数据段，因此有性能优势，但没有容错能力。`RAID 1`（镜像）将写入第一个磁盘的数据复制一份到第二个磁盘上，以防磁盘故障。\n\
  \n### [29]\n**C.** 网卡组组将多个服务器接口网卡（`NICs`）组合在一起，以合并网络带宽，增加对网卡故障的韧性，并在组网卡之间进行网络流量负载均衡。\n\
  \n**A、B** 和 **D** 是错误的。列出的项目没有提供负载均衡。为了提高应对故障的韧性，存储区域网络（`SAN`）管理员可以启用多路径，这为主机提供了通向共享存储的多条物理路径。不间电源（`UPS`）为接入\
  \ `UPS` 的计算设备提供临时电池电源；这允许设备平稳关机。对于停电期间更长时间的电力需求，应使用发电机。电源分配单元（`PDU`）是带有多个插座的电源插板，用于数据中心机架中的设备。某些设备使用双电源以应对电源故障的韧性；两个电源应始终保持插好状态。\n\
  \n### [30]\n**C.** 从现场介质 CD、DVD 或 USB 操作系统介质盘启动将提供修复 Windows 安装的选项。由于这可以快速解决问题，应该首先尝试。\n\
  \n**A、B** 和 **D** 是错误的。Windows “上一次良好配置”选项只有在机器开始启动到 Windows 操作系统时才能通过按 F8 访问。可能需要重新安装或应用公司\
  \ OS 镜像，但不应首先尝试此选项。\n\n### [31]\n**B.** 恢复时间目标（`RTO`）规定了发生意外故障后系统恢复到正常运行所需的时间。换句话说，它表示应用程序处于非运行状态而不会对业务造成不可修复损害的时间。\n\
  \n\n\n\n\n![Images](img/com-1.jpg) `A`、`C` 和 `D` 是错误的。恢复点目标 (RPO) 是故障发生后系统和数据恢复正常运行之前可以允许的时间；例如，六小时的\
  \ RPO 意味着数据备份的年龄永远不会超过六小时。平均修复时间 (MTTR) 衡量将设备、系统或网络恢复正常功能所需的时间。平均故障间隔时间 (MTBF) 是可修复设备每次连续故障之间的时间测量。\n\
  \n32. ![Images](img/com.jpg) `D.` 每日增量备份仅包含自上晚晚增量备份以来更改的项，因此产生的每日备份数据最少。\n\n![Images](img/com-1.jpg)\
  \ `A`、`B` 和 `C` 是错误的。每天的全量备份消耗的存储空间将比每日增量备份多。差异备份包含自上次全量备份以来的新增和修改的项目，因此占用的存储空间比每日增量备份多。每周增量备份无法满足上述的每日备份需求。\n\
  \n# 第 13 章\n\n管理公密钥基础设施\n\n## 认证目标\n\n- 13.01 PKI 组件\n- 13.02 PKI 证书\n- 13.03 PKI\
  \ 证书文件格式\n\n## 问题\n\n任何网络上的敏感数据交换都受益于公密钥基础设施 (PKI)。PKI 使用数字证书提供安全性。证书颁发机构 (CA) 向有效实体发布证书，用于机密性（加密）、完整性（数字签名和哈希）、身份验证（用户或设备）以及不可否认性（实体执行的操作不可争议）。\n\
  \n每个证书由一对唯一的、数学相关的公私密钥组成，外还有证书过期日期等其他数据。受损的证书可以撤销，其序列号发布在证书吊销列表 (CRL) 中。\n\n1. 下列哪些存储在用户\
  \ PKI 证书中？（选择两个。）\n\nA. 公钥\nB. 中间 CA\nC. `CRL`\nD. 过期日期\n\n2. 哪个组件位于 PKI 层次结构的顶端？\n\
  \nA. 中间 CA\nB. 根 CA\nC. `CRL`\nD. 设备证书\n\n3. 当设备信任公 CA 根证书时，建立了什么？\n\nA. 证书撤销\n\
  B. 注册机构\nC. 证书颁发机构\nD. 信任链\n\n4. 用户抱怨在连接到启用 HTTPS 的 Web 服务器时浏览器中会收到不可信网站警告，但在通过\
  \ HTTP 连接时不会。发生最可能的原因是什么？\n\nA. 用户尚未对网站进行身份验证。\nB. 网站被内容过滤防火墙拦截。\nC. Web 服务器在使用自签名证书。\n\
  D. 用户设备没有客户端证书。\n\n5. 你是一个 Windows 管理员，使用 `PowerShell` 脚本通过网络管理 Windows 设备。主机上应仅运行信任的脚本。你应该配置什么？\n\
  \nA. 中间 CA\nB. 代码签名证书\nC. 证书签名请求\nD. 注册机构\n\n6. 你应该如何加固你的 PKI？（选择两个。）\n\nA. 确保公钥文件受密码保护。\n\
  B. 确保根 CA 在线。\nC. 确保根 CA 离线。\nD. 确保私钥文件受密码保护。\n\n7. 下列哪项永远不会与数字证书一起存储？\n\nA. 公钥\n\
  B. 私钥\nC. 颁发 CA 的数字签名\nD. CA 的 IP 地址\n\n8. 你正在为一家拥有 PKI 的律所提供咨询服务。该律希望启用文档工作流，将文档电子版发送给相应的员工。你被问是否有方法可以证明文档是从\
  \ `FROM` 字段列出的用户发送的。在以下选项中，你会推荐哪一个？\n\nA. 文件加密\nB. 数字签名\nC. 电子邮件加密\nD. 证书吊销列表\n\n\
  9. 下列哪项最准确地描述了 `密钥托管` (key escrow) 术语？\n\nA. 一个信任的第三方，拥有解密密钥，以防原始密钥过期\nB. 一个信任的第三方，除了原始密钥外，还有解密密钥的副本\n\
  C. 一个可以加密私钥的账户\nD. 一个可以加密任何用户数据的账户\n\n10. 哪个 PKI 组件在颁发证书之前验证证书请求者的身份？\n\nA. 公钥\n\
  B. `RA`\nC. 私钥\nD. `CRL`\n\n11. 一用户报告她在旅行期间无法对公司 VPN 进行身份验证。你已配置了 VPN 要求用户证书身份验证。在调查问题后，你发现用户证书已过期。以下哪项提供了最快速的安全解决方案？\n\
  \nA. 创建一个新的用户证书并在用户计算机上配置它。\nB. 禁用 VPN 的证书验证。\nC. 减少 CRL 的发布频率。\nD. 将 VPN 的时间回回到证书过期之前。\n\
  \n12. 当用户通过输入 `https://intranet.local` 连接到内网服务器时，其浏览器显示网站不受信任的警告。如何在保持安全的情况下消除此警告？\n\
  \nA. 配置服务器使用 HTTP 而不是 HTTPS。\nB. 在所有工作站上安装内网服务器私钥。\nC. 使用 TCP 端口 443 而不是 80。\nD.\
  \ 在客户端浏览器中安装发行者的根证书。\n\n13. HTTPS 安全网站限制某些工作站连接。哪种方案最安全？\n\nA. 配置网站仅允许有效工作站的 IP\
  \ 地址。\nB. 配置网站仅允许有效工作站的 MAC 地址。\nC. 配置网站使用用户身份验证。\nD. 配置网站要求客户端证书。\n\n14. 你负责为新安装的电子商务网站启用\
  \ TLS。你应该先做什么？（选择最佳答案。）\n\nA. 安装 Web 服务器数字证书。\nB. 在 Web 服务器上启用 TLS。\nC. 创建 CSR 并将其提交给\
  \ CA。\nD. 配置 Web 服务器使用 HTTPS 端口 443。\n\n15. 在为网站生成 CSR 时，你输入了此处的信息。用户通过输入 `https://www.corp.com`\
  \ 连接网站。识别配置错误。\n\n过期：2021 年 8 月 4 日 星期三 11:04:38 东部\n位长度：2048\n通用名称：10.10.10.10\n\
  组织：Corp Inc.\n部门：Sales\n国家：US\n州：TN\n城市：Memphis\n\nA. 过期日期还不到一年。\nB. 位长度应为 128。\n\
  C. 通用名称应为 `www.corp.com`。\nD. 州字段不能缩写。\n\n\n\n\n\n### 16. 一家总部位于德克萨斯州达拉斯的大型全国性公司正在为数千名用户实施\
  \ PKI。该公司在其他 12 个美国主要城市设有公司办事处。每个办事处都有一位高级网络管理员，他们应该保留对该地点用户群的 IT 控制权。所有地点的用户设备必须信任公司颁发的所有证书。哪种选项提供了反映最佳实践的\
  \ PKI 解决方案？\n\nA. 在达拉斯安装一个 `root CA`。为每个城市创建 `intermediate CAs`，并使用这些 CA 为每个城市的用户和计算机颁发证书。将\
  \ `root CA` 离线。\nB. 在达拉斯安装一个 `root CA`。为所有地点的用户和计算机颁发证书。\nC. 在达拉斯安装一个 `root CA`。为所有地点的用户和计算机颁发证书。将\
  \ `root CA` 离线。\nD. 在达拉斯和每个城市都安装一个 `root CA`。使用每个城市的 `root CA` 为用户和计算机颁发证书。将 `root\
  \ CAs` 离线。\n\n### 17. 通过 HTTPS 连接到电子商务网站时，通常需要哪些类型的密钥？\n\nA. 公钥、私钥和会话密钥\nB. 公钥和私钥\n\
  C. 仅公钥\nD. 仅私钥\n\n### 18. `CA` 使用哪个 PKI 组件对颁发的证书进行数字签名？\n\nA. 私钥\nB. 公钥\nC. `CRL`\n\
  D. `OCSP`\n\n### 19. 在 PKI 中，`CA` 扮演什么角色？（选择两个）\n\nA. 吊销证书\nB. 使用其 `private key`\
  \ 对证书进行数字签名\nC. 使用其 `public key` 对证书进行数字签名\nD. 使用证书控制网络访问\n\n### 20. 你正在开发 Microsoft\
  \ PowerShell 脚本以自动化网络管理任务。`.PS1` 脚本文件需要数字签名并被信任以便在你的环境中的计算机上运行。你已经获得了一个代码签名 PKI\
  \ 证书。你需要备份你的 `private key`。在导出时你应该选择哪种文件格式？（选择两个）\n\nA. `DER`\nB. `PEM`\nC. `PFX`\n\
  D. `CER`\nE. `P12`\nF. `P7B`\n\n### 21. 哪种安全技术将主机与其相关的公钥关联？\n\nA. `CRL`\nB. `OSCP`\n\
  C. `Certificate pinning`\nD. `FQDN`\n\n### 22. 你的 Web 服务器托管了 `www.corp.com` 和 `info.corp.com`\
  \ DNS 名称。两个站点都需要 HTTPS。哪种配置可以在满足要求的同时，所需的管理工作最少？\n\nA. 安装两个证书；每个 DNS 名称对应一个。\nB.\
  \ 在 Web 服务器主机上安装 `certificate revocation list`。\nC. 在 Web 服务器主机上安装 `subject alternative\
  \ name` 证书。\nD. 为 Web 服务器主机配置 `IPSec`。\n\n### 23. 哪种 PKI 验证过程能最好地缓解诈骗者创建钓鱼网站？（选择两个）\n\
  \nA. 扩展验证 (Extended validation)\nB. 域名验证 (Domain validation)\nC. `CRL`\nD. `OCSP`\n\
  \n### 24. 你需要减少 `OCSP` 客户端指向 `CAs` 的网络流量。你应该配置什么？\n\nA. `CSR`\nB. `Stapling`\nC.\
  \ `CRL`\nD. `Pinning`\n\n### 25. 设备如何信任 HTTPS Web 服务器使用的 TLS 证书？\n\nA. 密钥托管 (Key\
  \ escrow)\nB. `Stapling`\nC. `Pinning`\nD. `Certificate chaining`\n\n### 26. 你的公司注册了如\
  \ `corp.com` 和 `info.corp.com` 等 DNS 域名。你需要确保这些 DNS 域名的 Web 服务器使用安全的 HTTPS，并且必须确保\
  \ `corp.com` 未来的子域名也能支持 HTTPS，且管理工作最少。你应该部署什么？\n\nA. 为每个当前和未来的网站提供一个证书\nB. `RA`\n\
  C. `SAN certificate`\nD. 通配符证书 (Wildcard certificate)\n\n### 27. 参考图 13-1。在什么情况下，你可能会点击“是”按钮？\n\
  \nA. 你需要对电子邮件进行数字签名的能力。\nB. 你需要对电子邮件进行加密的能力。\nC. `RootCert CA` 已向内网 Web 服务器颁发了证书。\n\
  D. `RootCert CA` 证书即将过期。\n\n### 28. 识别图 13-2 中的问题。\n\nA. `RootCert CA` 证书不被信任。\n\
  B. `ClientCert` 证书不被信任。\nC. `RootCert CA` 离线状态。\nD. `RootCert CA` 未启用 `Certificate\
  \ stapling`。\n\n### 29. 关于图 13-3 的哪些陈述是正确的？（选择两个）\n\nA. 加密的电子邮件可以被解密。\nB. 加密的电子邮件可以发送。\n\
  C. 数字签名可以被验证。\nD. 数字签名可以被创建。\n\n### 30. 哪些 PKI 选项可以用于证书有效性？（选择两个）\n\nA. `Stapling`\n\
  B. `CRL`\nC. `RA`\nD. `OCSP`\n\n### 31. 下哪项是有效的 `CA` 签名算法？\n\nA. `SHA 256`\nB. `AES`\n\
  C. `DES`\nD. `IKE`\n\n### 32. 哪个前缀标识 PKI 证书主体名称？\n\nA. `Domain component`\nB. `Component\
  \ name`\nC. `Common name`\nD. `DNS component`\n\n### 33. 将证书文件导入电子邮件程序后，用户发现她无法对电子邮件进行数字签名。可能的原因有哪些？（选择两个）\n\
  \nA. 证书不是为电子邮件用途创建的。\nB. 证书中没有 `private key`。\nC. 证书中没有 `public key`。\nD. 证书中没有\
  \ `CA signature`。\n\n\n\n\n\n![Images](img/com-1.jpg) `B` 和 `C` 是错误的。中间证书颁发机构（`CAs`）发行证书，它们并不存储在已发的证书内部，但它们的签名是存储其中的。证书吊销列表（`CRL`）是一个已吊销（而非过期）的证书序列号列表，原因包括用户离开组织，或包含证书的用户智能手机丢失或被盗。\n\
  \n### 2 \n![Images](img/com.jpg) `B.` `root CA` 位于 `PKI` 层级结构的顶端，随后是已发的证书和注册机构（`RAs`），根据需要它们可以发行证书和下级注册机构。\n\
  \n![Images](img/com-1.jpg) `A, C,,` 和 `D` 是错误的。中间 `CAs` 存在于 `Root CA` 下并可以发行证书，在这种情况下，出于安全考虑，`root\
  \ CA` 应该保持离线状态；`root CA` 被破解意味着整个层级结构中的所有证书都被破解了。`CRL` 是一个已吊销（而非过期）的证书序列号列表，原因包括用户离开组织，或包含证书的用户智能手机丢失或被盗。设备证书颁发给智能手机等设备，可用于\
  \ `VPN` 验证等目的。\n\n### 3 \n![Images](img/com.jpg) `D.` `PKI` 信任链基于 `root` 或中间 `CA`\
  \ 写入已发证书的数字签名。例如，如果用户设备信任 `RootCA1`，则该用户设备信任由 `RootCA1` 直接或间接颁发的所有证书。\n\n![Images](img/com-1.jpg)\
  \ `A, B,` 和 `C` 是错误的。证书吊销会导致证书失效，原因包括用户离开组织，或包含证书的用户智能手机丢失或被盗。注册机构（`RAs`）通常被称为中间\
  \ `CAs`；它们有能力接受证书请求，并能够发行证书，或者验证该请求以由另一个 `CA` 发行。`CAs` 负责发行证书。如果你的 `PKI` 层级结构只包含\
  \ `Root CA`，那么它也充当了 `RA` 的角色。\n\n### 4 \n![Images](img/com.jpg) `C.` `HTTPS` 网站连接需要在服务器上安装\
  \ `PKI` 证书；`HTTP` 则不需要。如果证书是自签名的（即不是受信任的第三方颁发机构发行），则网络浏览器在尝试连接网站时将向用户显示安全警告。\n\n\
  ![Images](img/com-1.jpg) `A, B,` 和 `D` 是错误的。不可信网站警告与用户身份验证无关；这完全是 `PKI` 信任链的问题。如果用户可以通过\
  \ `HTTP` 连接网站但不能通过 `HTTPS`，这不太可能是防火墙问题。（尽管技术上防火墙可以阻止对 Web 服务器的 `HTTPS` 访问，但只有在存在配置错误的情况下才会发生，因为没有管理员会愿意阻止\
  \ `HTTPS` 而仅允许 `HTTP` 访问服务器。）虽然安全网站可能需要客户端证书，但警告信息并未指示此问题；它似乎与不可信网站有关（相比之下，这指向服务器证书问题而非客户端证书）。\n\
