  \n\n\n\n\n## 21\n**A, B, and D.** 元数据（Metadata）也称为标签（tags），是描述数据的信息。例如，用数字相机拍摄并存储在网络服务器上的\
  \ JPEG 图片可能包含隐藏数据，包括相机设置以及日期和时间戳。元数据也适用于电子邮件的传输路径详情以及移动设备细节（如操作系统版本）。Microsoft Word\
  \ 和便携式文档格式（PDF）文档包含如文档作者姓名、注册公司名称等元数据。\n\n**C** 是错误的。Excel 文档不会记录你计算机的网卡硬件地址（MAC\
  \ 地址）。\n\n## 22\n**B and C.** 你必须获得适当的法律许可来扣押和分析数据。对数据的取证副本（forensic copy）进行分析；永远不要在原始数据上工作，因为这将导致证据无法采信。\n\
  \n**A and D** 是错误的。你不应该处理原始数字数据。这会破坏数据的原始状态；仅对数据的取证副本进行工作。你的经理可能没有授权让你检查数据；请确保在开始调查之前已获得适当的法律许可。\n\
  \n## 23\n**D.** 均预期损失（ALE）用于计算资产在一年内故障的概率。它在执行风险评估时使用，与取证预算无关。\n\n**A, B, and C**\
  \ 是错误的。差旅、工时和培训费用是有效的 IT 取证预算项目。\n\n## 24\n**A and D.** 一旦确定了问题的严重性，控制蠕病毒扩散的最快方法是消除网络连接。\n\
  \n**B and C** 是错误的。拔掉存储区域网络（SAN）设备可能会保护 SAN 磁盘上的数据免受感染服务器的影响，但蠕病毒仍可能扩散到其他设备。为了彻底清除恶意软件爆发，可能需要从网络交换机上拔掉有线设备，以包含或隔离恶意软件。包含措施（包括隔离感染设备、清除和系统恢复任务）应由事件响应团队成员根据事件响应计划（IRP）执行。关闭所有服务器所需的时间比简单关闭交换机电源要长。\n\
  \n## 25\n**B and C.** 清空 Windows 回收桶会让 Windows 用户无法访问已删除的文件；然而在磁盘被其他数据填充之前，整个文件内容仍然留在磁盘上。在这种情况下，必须使用第三方工具来恢复被删除的项目。\n\
  \n**A and D** 是错误的。即使回收桶被清空，也可以使用免费可用工具恢复文件。硬盘碎片整理与文件恢复无关。\n\n## 26\n[图 21-2] 显示了术语与定义的正确对应。在问题发生之前准备事件响应团队，意味着可以高效地处理问题，因为团队成员对自己的角色和职责非常清楚。缓解步骤减少了问题事件的影响。记录事件类型、类别及其解决方案可以在未来发生类似事件时提供帮助。\n\
  \n### 图 21-2\n事件响应定义和术语——答案\n\n## 27\n**B.** Linux 内置的 `dd` 命令可用于将磁盘卷复制到镜像文件中，以备日后分析，同时保持原始文件系统完好无损。类似的商业工具是\
  \ FTK Imager。\n\n**A, C, and D** 是错误的。`memdump` 命令在某些 Linux 发行版（如 Ubuntu Linux）中可用，用于将电子内存的内容转储到文件中以便进行进一步分析。与转储文件相关的活动可以被记录，以确保转储文件的完整性。商业十六进制编辑工具\
  \ WinHex 可用于从磁盘恢复已删除或损坏的数据，Autopsy 是一种商业取证工具，可用于对许多类型的存储媒体和移动设备进行取证分析，但这些工具并非内置于\
  \ Linux。\n\n## 28\n**C.** Mitre Att&ck 知识库将提供有关当前用于从受损主机进行横向移动的恶意用户技术的详细信息。\n\n\
  **A, B, and D** 是错误的。列出的项目不是最新攻击者技术的来源。钻石模型（Diamond model）是一种入侵分析框架，其中每个恶意事件（或菱形）被用于映射恶意活动；每个菱形都与基础设施组件、执行恶意活动的攻击者及其能力，以及预定目标或目的定义了关系。网络杀伤链（cyber\
  \ kill chain）是一个用于跟踪从初始侦察到预期的系统攻破或恶意软件感染以及目标行动的整个恶意活动框架。业务连续性计划（COOP）与业务连续性计划（BCP）类似，是为了应对流程中断（特别是与\
  \ BCP 相关的业务流程中断）的准备，以尽可能减少该中断的影响。COOP 更关注公共和政府机构的准备工作。\n\n## 29\n**A.** 灾难恢复计划（DRP）概述了从破坏性事件中恢复所需采取的步骤。服务器\
  \ DRP 可以强制执行给定服务器的恢复目标（RTO），该目标指定了最大可接受的停机时间。应进行 DRP 演练作为概念验证（PoC）活动，以确保 DRP 的有效性。\n\
  \n**B, C, and D** 是错误的。通信计划可以作为事件响应计划的一部分，它可以指定事件联系信息，如经理、升级到其他方、法律、公共关系等。在 IT 安全和业务连续性方面，管理利益相关者的预期可以影响网络安全时间和资源的关注重点。COOP\
  \ 与 BCP 类似，是为了应对流程中断的准备。COOP 更关注公共和政府机构的准备工作。\n\n## 30\n**D.** DNS 服务器包含详细说明如主机名和相应\
  \ IP 地址等项的资源记录；通过查询这些记录将友好名称解析为 IP 地址。因此，尝试枚举 DNS 服务器的侦察扫描将显示在 DNS 服务器日志中。作为针对攻击者的反情报措施，可以安装带有错误信息的虚假蜜罐（honeypot）DNS\
  \ 服务器来误导攻击者。\n\n\n\n\n\n![Images](img/com-1.jpg)\n\nA、B 和 C 都是错误的。较新版本的 UNIX 和 Linux\
  \ 系统使用 `rsyslog` 或 `syslog-ng` 守护进程来控制本地主机的日志记录以及将日志消息转发到其他网络主机。这些日志选项取代了旧的 UNIX\
  \ 和 Linux `syslog` 守护进程，并包含了额外的功能，例如不仅可以根据元数据还可以根据实际日志消息内容过滤日志项。IP 电话（VoIP）设备和相关路由器将记录语音流量活动以及许多\
  \ VoIP 实现使用的会话发起协议（SIP）流量。目录服务器身份验证日志分别捕获用户、软件和设备验证流量。这些日志类型都不会捕获主机名和 IP 地址扫描，但\
  \ DNS 服务器日志可以。\n\n**31.** ![Images](img/com.jpg) **C.** Linux 的 `journalctl` 命令用于查看\
  \ systemd 日志，并包含过滤功能，例如 `journalctl –b` 可仅查看与最近系统启动相关的日志条目（因为这将显示自上次重新启动以来收集的日志条目）。\n\
  \n![Images](img/com-1.jpg) **A、B 和 D 都是错误的。** NXLog 是一种支持集中式日志转发的日志实用。NXLog 可以在\
  \ UNIX、Linux 和 Windows 主机上运行。IP 流量信息导出（IPFIX）是一种多平台解决方案，旨在收集网络流量信息以进行带宽监控，通常用于识别网络性能问题，这些问题可能指示恶意活动。思科专有的\
  \ IPFIX 等效协议 `NetFlow` 运行在路由器和交换机等设备上以收集网络流量。另一种协议 `sFlow` 用于对网络流量进行采样，并适用于许多不同类型的厂商设备和主机上。\n\
  \n**32.** ![Images](img/com.jpg) **D.** 安全编排、自动化和响应（SOAR）是一种软件解决方案，旨在通过自动化减少响应时间，从而使事件响应更高效。运行账书（Runbooks）包含了根据条件执行的一系列操作——例如针对公司网络发生的\
  \ DDoS 攻击。\n\n![Images](img/com-1.jpg) **A、B 和 C 都是错误的。** SOAR 剧本（Playbooks）是必须采取的顺序事件响应步骤，通常受法规影响。剧本通常比运行账书涉及更多的人工干预。作为调查电子数据发现（e-discovery）阶段的一部分，可以实施法律保全（legal\
  \ hold），例如对于存储在云端的数据，以确保现有数据不会为了法庭证据认可性目的而被修改。\n\n# 附录 A\n\n## 评估考试\n\n## 题目\n\n\
