  \ 2.04 理解数据角色\n\n## 问题\n\n威胁主体是实施恶意活动的实体。识别威胁主体的类型及其动机是规划威胁防御措施的第一步。\n\n信息就是力量。共享网络安全情报有助于组织制定有意义的安全策略，并增强安全监控和报告工具的效能。这包括识别威胁向量，例如电子邮件系统、可移动介质或云服务。数据资产的保护由多种角色承担，例如数据保管员、数据控制者、数据处理器和数据所有者。\n\
