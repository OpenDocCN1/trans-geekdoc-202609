  \ **D.** HTTP 严格传输安全（HSTS）响应头部要求使用 HTTPS 保护的 Web 服务器连接；它防止了可能尝试使用 HTTP 的降级攻击。\n\n\
  ![Images](img/com-1.jpg) **A、B 和 C** 是错误的。`X-Frames-Options` 头部有助于缓解点击劫持（clickjacking）攻击，因为它定义了\
