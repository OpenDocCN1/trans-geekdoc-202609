  29. D\n30. D\n31. D\n32. B\n\n## 深度解析\n\n### [1]\n![Images](img/com.jpg)\n\n**B.**\
  \ 性能基线是在应用程序正常运行期间建立的。通过将基线与当前性能状况进行比较，可以识别性能问题，这些可能是恶意活动的指示，例如由于比特币挖矿恶意软件或其他恶意程序导致\
  \ CPU 利用率过高。\n\n![Images](img/com-1.jpg)\n\n**A、C 和 D** 错误。这些选项与应用程序性能无关。建立 IP 地址方案是网络基础设施设计的一部分，用于为特定网络分配特定的\
  \ IP 地址范围，并为此类设备（如网络打印机或路由器）分配特定的 IP 地址（例如以 200 结尾的）。网络图有助于设计、安全和排排除网络环境。命名规范为命名端点、服务器和网络设备等网络项目提供了一致性。\n\
  \n### [2]\n![Images](img/com.jpg)\n\n**D.** 数据掩码用于隐藏或“掩码”敏感数据的部分或全部，例如隐藏信用卡账号以外的最后几位数字。这使得呼叫中心工作人员能够在不暴露客户完整信用卡号的情况下验证客户详情。\n\
  \n\n\n\n\n![Images](img/com-1.jpg) **A**、**B** 和 **C** 是错误的。加密对于保护敏感数据免受未经授权的用户访问非常重要，但它不适用于此场景。数据泄露防护（DLP）用于监控并防止敏感数据外泄，或暴露在组织外部或给未经授权的用户，无论是有意还是无意的。数据令牌化（Data\
  \ tokenization）将敏感数据替换为无法追溯到该敏感数据的内容（`token`）。然后可以将 `token` 提供给应用程序而不是原始敏感数据（例如，信用卡详情）。\n\
  \n### 3\n![Images](img/com.jpg) **D.** 数据主权是指管理受存储地法律约束的敏感数据。\n\n![Images](img/com-1.jpg)\
  \ **A**、**B** 和 **C** 是错误的。权限管理（通常称为信息权限管理 `IRM`）努力确保只对特定类型的数据授予授权访问，例如确保只有具有适当安全密密的人员才能访问机密信息。安全的\
  \ `API` 策略包括确保在加密连接上进行授权的 `API` 访问，并实施诸如 `API throttling` 这样的控制措施，以限制短时间内过量的 `API`\
  \ 调用。零信任安全框架不假设内部用户和设备是安全的；相反，零信任依赖于成功的身份验证详情，如用户凭据、使用的设备、位置等。零信任还确保端到端加密，并在遵循最小权限原则的同时控制系统和数据访问，该原则规定仅应授予执行任务所需的权限，而不应给予任何多余权限。\n\
  \n### 4\n![Images](img/com.jpg) **C.** 过滤子网（Screened subnet）是介于互联网等公共网络和内部安全网络之间的网络。公共可访问的服务（如企业\
  \ `VPN` 端点）应放置在过滤子网中。防火墙规则仍用于控制进入和流出过滤子网的流量。\n\n![Images](img/com-1.jpg) **A**、**B**\
  \ 和 **D** 是错误的。网络交换机中的所有端口都配置在同一个默认 `VLAN` 中，但对此可以更改。如果 `VPN` 设备端口被配置为 `DMZ` 端口，那么对于\
  \ `VPN` 设备来说就是合理的。内网是组织员工使用的私有网络。内网使用 `HTTPS` 等网络协议用于内部 Web 应用程序，而外网（Extranet）则允许组织外的用户进行有限访问。虽然公共云提供商支持\
  \ `VPN` 配置，但与 `DMZ` 相比，在公共云中部署 `VPN` 设备是一种通用部署，而后者可以在本地或云端存在。\n\n### 5\n![Images](img/com.jpg)\
  \ **D.** `IPSec` 需要的行政工作最少，因为它可以使用 `Group Policy` 为 `Active Directory` 集中配置，并且它可以保护网络流量而无需像\
  \ `SSL/TLS` 那样专门配置单个应用程序。\n\n![Images](img/com-1.jpg) **A**、**B** 和 **C** 是错误的。传输层安全（`TLS`）是一种网络协议，取代过时的安全套接层（`SSL`）。使用\
  \ `TLS` 保护应用程序需要一个或多个 `PKI` 证书，并为每个应用程序配置 `HTTPS` 绑定。数据链路隧道协议（`L2TP`）允许 OSI 模型第\
  \ 2 层（数据链路层）流量通过 OSI 模型第 3 层（网络层）隧道。虽然 `L2TP` 本身不保护流量，但它通常与 `IPSec` 等安全协议一起使用以创建加密的\
  \ `VPN` 隧道。反向代理服务器接收客户端并将并将请求转发到相应的后端服务器（通常位于私有安全网络）。\n\n### 6\n![Images](img/com.jpg)\
  \ **A** 和 **B.** 跳板机（Jump box）是一个同时连接到互联网等公共网络和内部网络的主。通过对跳板机进行身份验证，可以在那里启动到内部设备和主机的远程管理话。使用\
  \ `VPN` 连接到私有网络也可以对设备和主机进行远程管理。\n\n![Images](img/com-1.jpg) **C** 和 **D** 是错误的。正向代理服务器接收客户端请求，获取内容并返回给请求客户端。硬件安全模块（`HSM`）是一种设备，用于安全地存储多个主机可以访问的密钥。\n\
  \n### 7\n![Images](img/com.jpg) **B.** 网络接口卡通过 48 位的十六进制介质控制（`MAC`）地址唯一标识。网络交换机端口可以配置为仅允许特定的\
  \ `MAC` 地址接入网络。\n\n![Images](img/com-1.jpg) **A**、**C** 和 **D** 是错误的。广播网络传输发送给网络上的所有设备。过量的广播可能是由网络设备故障引起的。现代网络设备（如交换机）允许交换端口在达到配置阈值后阻塞广播流量。防止桥接环的方法只需确保网络交换机之间存在单一链路，或者在网络上启用生成树协议（`STP`），这通常是默认设置。桥接协议数据单元（`BPDU`）保护是一种网络交换机功能，可以启用以防止连接到终端设备（如用户工作站、服务器）的交换机端口产生\
  \ `BPDU` 流量。只有网络交换机传输 `BPDU` 流量。\n\n### 8\n![Images](img/com.jpg) **C.** 将已知恶意软件和攻击模式的更新签名数据库与当前活动进行比较，可以确定是否发生了可疑事件。网络入侵系统（`IPS`）和网络入侵检测系统（`IDS`）传感器均可用于收集和监控网络活动。主要区别在于\
  \ `IPS` 可以采取响应和恢复措施来阻止可疑活动，而 `IDS` 更侧重于报告和警报。\n\n![Images](img/com-1.jpg) **A**、**B**\
  \ 和 **D** 是错误的。基于异常的 `IDS` 和 `IPS` 解决方案（称为启发式的）将当前活动与已正常活动基准进行比较以检测异常。Inline 网络设备被仔细放置，使得相关的网络流量在继续到达目标地之前被查看、分析并可能以某种方式修改（包括丢弃流量），而被动网络设备主要用于监控且不修改网络流量。\n\
  \n### 9\n![Images](img/com.jpg) **D.** 为了确定是否允许或阻止网络流量，无状态防火墙检查每个数据包，并将其与其他数据包相互独立对待，而不考虑网络会话中数据包之间的关系。\n\
  \n![Images](img/com-1.jpg) **A**、**B** 和 **C** 是错误的。状态防火墙感知唯一网络会话的多个相关数据包，并根据会话特征（如特定数据包类型在会话中出现的顺序）允许或阻止流量。Web\
  \ 应用防火墙（`WAF`）保护 Web 应用免受特定的 Web 应用攻击，例如 Web 服务器目录遍历或数据库注入攻击。内容过滤可以允许或阻止访问特定项目（如特定的\
  \ `URL`）；解决方案可以使用网站允许和阻止/拒绝列表来限制用户对互联网内容的访问。\n\n\n\n\n\n### 10\n![Images](img/com.jpg)\n\
  **B.** 网络地址翻译 (NAT) 网关允许仅私有 IP 地址的主机通过 NAT 网关公 IP 地址访问互联网资源；这消除了所有主机都拥有公 IP 地址的需求。\n\
  \n![Images](img/com-1.jpg) **A、C、** 和 **D** 是错误的。Web 应用防火墙 (WAF) 保护 Web 应用免受已知的\
  \ Web 特定攻击，例如 Web 服务器目录遍历或数据库注入攻击。统一威胁管理 (UTM) 解决方案结合了入侵检测与防御、防火墙和反病毒软件等 IT 安全技术。虽然\
  \ UTM 可以允许访问互联网，但 NAT 网关是专为此目的设计的。入侵防御系统 (IPS) 可以采取响应和恢复措施来阻止可疑活动。\n\n### 11\n![Images](img/com.jpg)\n\
  **C.** 与专有软件解决方案相比，开源软件（如防火墙软件）通常廉便宜（通常免费）。\n\n![Images](img/com-1.jpg) **A、B、**\
  \ 和 **D** 是错误的。统一威胁管理 (UTM) 解决方案结合了入侵检测与防御、防火墙和反病毒软件等 IT 安全技术，适用于具有复杂安全需求的大型组织。专有防火墙解决方案是源，意味着源代码不对所有人开放，这通常导致成本比开源同类更高。下一代防火墙\
  \ (NGFW) 超越了标准的状态数据包头检查，通常被称为“深度数据包检测”防火墙，因为它们可以检查数据包载荷并检测、阻止可疑活动或恶意软件等其他功能。\n\n\
  ### 12\n![Images](img/com.jpg)\n**D.** 由于硬件防火墙设备使用专为安全目的设计的固件，它们被认为比运行在多功能操作系统中的大多数软件防火墙更可靠、更快。\n\
  \n![Images](img/com-1.jpg) **A、B、** 和 **C** 是错误的。软件防火墙运行在多功能操作系统中，通常不认为像硬件防火墙那样稳健。虚拟防火墙设备是一种软件解决方案，通常以运行在虚拟机程序上的虚拟机客户的形式存在。主机防火墙是通常内置在多功能操作系统中的端点防火墙，例如\
  \ `Microsoft Defender Firewall`，它是被内置在 `Windows 10` 操作系统中的。\n\n### 13\n![Images](img/com.jpg)\n\
  **D.** 防火墙访问控制列表 (ACL) 是规则集合，包含传输细节条件，如源 IP 地址、目标 URL、端口号或协议类型，这些条件应当被允许或阻止。\n\n\
  ![Images](img/com-1.jpg) **A、B、** 和 **C** 是错误的。文件完整性监控 (FIM) 用于检测、通知和报告主机或整个网络（包括数据库和日志文件）上文件未经授权的更改。端口分路（也称为网络分路）是被动捕获网络流量的设备。也可以在网络交换机中使用端口镜像或镜像来捕获网络流量，将所有交换端口的网络流量复制到指定的监控端口。在计算机网络中，服务质量\
  \ (QoS) 解决方案管理网络流量以减少网络拥塞，或确保时间敏感型网络使用的可靠性，例如 IP 电话 (VoIP) 调用。\n\n### 14\n![Images](img/com.jpg)\n\
  **C** 和 **D.** 运动中数据和传输中数据是同一件事：在网络上传输的数据。安全套层协议 (SSL) 和传输层安全协议 (TLS) 是可以加密网络通信的网络安全协议。`SSL`\
  \ 已弃用，转而使用更新版本的 `TLS`（如 1.3）。`SSL` 和 `TLS` 需要 PKI 证书来安全连接。\n\n![Images](img/com-1.jpg)\
  \ **A** 和 **B** 是错误的。静态数据指的是存储的数据，可以进行磁盘或文件加密。处理中数据指的是从存储设备或跨网络可用的数据，都可以进行网络加密。\n\
  \n### 15\n![Images](img/com.jpg)\n**B.** 云访问安全器 (CASB) 提供集中管理本地和云策略的服务，包括数据泄露防护、认证和授权。CASB\
  \ 解决方案可以极大增强组织遵守法规的能力。\n\n![Images](img/com-1.jpg) **A、C、** 和 **D** 是错误的。统一威胁管理\
  \ (UTM) 解决方案结合了入侵检测与防御、防火墙和反病毒软件等技术。分布式拒绝服务 (DDoS) 攻击源于对感染计算机（僵尸或机器人）的恶意控制；机器人接收指令向受害者机器发送大量无效流量。Web\
  \ 应用防火墙 (WAF) 保护 Web 应用免受已知的 Web 特定攻击，例如 Web 服务器遍历或数据库注入。\n\n### 16\n![Images](img/com.jpg)\n\
  **A.** 哈希通过单向加密算法（如 `SHA-256`）生成原始数据的唯一值。这用于在 `/etc/shadow` 中存储标准的 Unix 和 Linux\
  \ 密码并跟踪文件或网络传输的变化。\n\n![Images](img/com-1.jpg) **B、C** 和 **D** 是错误的。加密将数据和密钥输入加密算法，产生密文或加密数据。数据脱敏用于隐藏或“掩码”敏感数据的部分或全部，例如在屏幕或打印收据上隐藏信用卡账号除最后几位以外的所有数字。数据令牌化用敏感数据替换为无法追溯到该敏感数据的项（令牌）。然后可以将令牌呈现给应用程序而不是原始敏感数据（例如信用卡信息）。\n\
  \n### 17\n![Images](img/com.jpg)\n**B.** 蜜罐是一个诱饵系统，配置为可能包含敏感数据的合法主机。该主机特意这样配置是为了跟踪恶意用户活动。产生的遥测数据可以为组织的态态提供见解，并指示必须对环境进行哪些加固。\n\
  \n![Images](img/com-1.jpg) **A、C** 和 **D** 是错误的。蜜罐网络是一个具有一个或故意漏洞的蜜罐系统集合，用于吸引和监控恶意用户活动。蜜文件可能包含看似含有敏感信息的生产数据文件，实际上这些文件是伪数据。DNS\
  \ 洞穴是一种故意配置，对特定主机或域名的 DNS 客户端返回无效结果；这对于防止感染的机器人计算机与攻击者的命令与控制 (C&C) 服务器通信非常有用。\n\n\
  ### 18\n![Images](img/com.jpg)\n**A.** 东西向流量指的是发生在网络边界内部的网络传输，例如单个数据中心内物理和虚拟设备及主机之间的传输。\n\
  \n\n\n\n\n![Images](img/com-1.jpg) `B`、`C` 和 `D` 是错误的。南北向流量指的是发生在单一网络之外的网络传输，例如在数据中心主机与数据中心外部主机之间的传输。蜜罐网流量（Honeynet\
  \ traffic）指的是蜜罐网上的网络传输，蜜罐网是由一组诱骗系统组成的，这些系统具有一个或多个故意漏洞，用于吸引和监控恶意用户活动。蜜罐是一个伪装成合法主机的诱骗系统，可能包含合法的敏感数据，但该主机被刻意配置成这样，以跟踪针对主机的恶意用户活动。\n\
