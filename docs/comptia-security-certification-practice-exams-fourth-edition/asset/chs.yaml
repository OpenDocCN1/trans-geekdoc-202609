  **图 20-7**\n安全需求与解决方案——答案\n\n### 30\n![Images](img/com.jpg)\n`A` 和 `B.` 防火墙不仅要检查入的网络流量，还要检查离开网络的流量。这可以防止\
  \ SMTP 中继、垃圾邮件、DDoS 攻击以及许多从你的网络发往受害者主机或网络的其他攻击。攻击者使用 `theHarvester` 等工具在互联网上搜寻可以发送垃圾邮件或网络钓鱼邮件的有效电子邮件地址。DNS\
  \ 服务器必须仅与其他已知的 DNS 服务器进行同步，以防止将 DNS 记录同步到恶意的 DNS 主机。\n\n![Images](img/com-1.jpg)\n\
  `C` 和 `D` 是错误的。只要有适当防火墙规则，DNS 服务器就可以放置在 DMZ 中，只要内部网络 DNS 记录不会同步到 DMZ DNS 主机。HTTPS\
  \ 使用 `TCP 443`，在大多数情况下，应允许此类流量离开私有网络，以便用户连接到安全的网站。\n\n### 31\n![Images](img/com.jpg)\n\
  `D.` 基准（Baseline）确定了系统性能在正常情况下的状态。这可以与当前状况进行比较，以确定是否存在任何异常。\n\n![Images](img/com-1.jpg)\n\
  `A`、`B` 和 `C` 是错误的。渗透测试涉及安全人员首先通过侦察技术收集信息，然后对网络和主机发起常见攻击以识别威胁。渗透测试的任务规则（Rules of\
  \ engagement）通常要求在攻击主机后进行系统清理，这可能涉及重新配置或重新映像设备或主机。为了模拟恶意用户的技术，安全顾问经常会使用如 `The Browser\
  \ Exploitation Framework` 等利用框架工具来测试系统安全。在利用初始漏洞（如获取网络访问）后，技术人员可以进一步利用额外的漏洞，如不受防火墙保护的主机。这种技术被称为\
  \ `pivoting`（枢移动）。主机加固与基准报告无关。\n\n### 32\n![Images](img/com.jpg)\n`B.` 渗透测试可能存在风险。它涉及许多技术，但降低网络性能或导致主机崩溃是有可能的。\n\
