    The proposed system provides a platform that can handle real-time healthcare data
    with the historical EHR data for clinicians and healthcare providers to predict
    heart diseases, Spark spots real-time stream analytics over healthcare data. The
    goal of the Biggest Platform in this paper is to acquire and analyze Enterprise-level
    clinical usage. The proposed system provides a big data system that handles EHR
    data based on streaming data from wearable devices and user medical profile. The
    proposed system depends on a dataset as an input with some defined parameters
    to filter the features of the heart dataset. This is achieved by Microsoft Azure
    as a cloud platform with sql node.


