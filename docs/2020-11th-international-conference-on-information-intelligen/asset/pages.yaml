    The paper presents an effective solution for the prediction of diseases using
    knowledge discovery that processes on the EHR database and user social profile.
    The proposed platform also provides an effective solution to connect streaming
    data from wearable devices based on Spark and Microsoft Azure to predict. The
    future work is to implement this proposed system with deep learning techniques
    on its data. The next step of our proposed work to provide a platform on the cloud
