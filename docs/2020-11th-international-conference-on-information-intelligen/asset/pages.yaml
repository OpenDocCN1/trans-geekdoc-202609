    # VI. Results & Discussions


    The proposed system has been implemented and tested using Microsoft Azure and
    the system is trained on the cloud platform on Microsoft Azure machine learning
    to use the efficiency of the cloud platform capabilities. The proposed system
    was tested using Coronary Heart Disease (CHD) for heart disease prediction using
    binary classification. The dataset collected from Boston University as shown in
    4.


    Spark can run on Azure via multiple tools such as Azure HDInsight, Data bricks,
    and Azure Distributed Engineering Toolkit (AZK). Data bricks is a platform to
    manage Spark, it provides useful features for team collaboration and version control.
    Azure supports a fully managed cloud service called HDInsight with Spark. The
    AZK is an application for provisioning-demand Spark clusters in Azure. The Spark
    clusters run in Docker containers. AZK is a very flexible option that can support
    all VM types including GPUs, which is especially helpful for deep learning methodologies.


    The proposed system used Machine Learning for Apache Spark which uses a lot of
    tools for Apache Spark including integration with the deep learning frameworks.
    The system architecture is based on data sources from the laboratory test results,
    streaming data from wearable devices, and EHR data which represents


