    Electronic medical data is a collection of medical data to be analyzed and give
    valuable information. NoSQL databases provide some valuable features like better
    performance, high availability, and auto-scaling that help to manage distributed
    healthcare solutions rather than relational databases [66]. Hadoop Distributed
    File System (HDFS) is a strategy that splits data into different chunks and stores
    them in HDFS in multiple cluster nodes. HDFS is a reliable technique to access
    data quickly [7].


    Apache Spark is a powerful framework that supports data processing and batch processing
    [8]. It can work with different data sources such as Cassandra and Mlib library.
    It can apply machine learning techniques with high speed and efficiency. Apache
    Spark also supports analytics for data using Hive.


    # C. Data Analysis


    The big medical data always needs to be analyzed after they are collected and
    get valuable information out of the data. The data analysis process is comprised
    of four categories. The first category is a descriptive analysis that describes
    what happened based on the data. Then diagnostic analysis tries to figure out
    the causes of the events. The third category is a predictive analysis which is
    a forecast or prediction for the future. Prescriptive analytics is to react to
    different situations using probabilities algorithms like decision trees [10].


    Medical data analysis can be done using parallel computation to validate and develop
    medical applications. MapReduce [11] and Dryad [12] provide frameworks that can
    manage parallel complexity. Spark is a framework that processes the streaming
