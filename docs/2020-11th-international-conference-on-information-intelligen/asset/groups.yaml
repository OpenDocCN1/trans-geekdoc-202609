    ABSTRACT The healthcare big data including medical history, Physician reports,
    prescription, and family historical databases, laboratories, and scan reports
    can help in disease detection and prediction. The article presents an overview
    of the current technologies and methods in the medical area to get the benefits
    of cloud systems, data science and analytics. The paper presents how current technologies
    can be used to stream data for healthcare applications. Medical big data analysis
    is an area of research and the article shows some impact on patient outcomes.
    The proposed system employed an optimized Support Vector Machine classifier with
    the parameter tuning to achieve high accuracy of classification, and efficiency.
    The system gets the data of heart rate, diabetes, and blood pressure to analyze
    and predict diseases with the help of the healthcare platform on cloud.


    Keywords—mobile device; healthcare; healthcare data status; prediction.


    # I. INTRODUCTION


    Cardiovascular diseases are one of the biggest reasons for the death of millions
    of people around the world only second to cancer[1]. A heart attack occurs when
    a clot blocks the blood flow to a part of the heart this blood clot causes the
    part of the heart muscle to die as result. By the statistics, a heart problem
    can gradually start with the age of 40-50 for people with an unhealthy diet and
    lifestyle choices[2]. So, an early prognosis can make huge difference in their
    lives by motivating them towards a healthy lifestyle and diet this risk can be
    reduced. This research aims to show the most risk factors of heart disease prediction
    machine learning. Machine learning models predict the likelihood of patients getting
    a heart disease trained on a dataset of individuals. As the probability of getting
    a heart disease based on the current lifestyle and diet is calculated. The model
    was trained with a Framingham heart study dataset.


    There are lot of researchers who developed machine learning methods to diagnose
    chronic diseases at early stages. The wearable devices are providing compact,
    accurate, cheap, and light health monitoring systems of the body changes using
    smart sensors make a lifestyle benefit for a lot of medical affairs. The most
    of health awareness programs call for the disease''s prevention and early alerts
    of diseases[1]. Big data analysis is very helpful and useful to use the data to
    generate medical data with spark and machine learning algorithms to predict outcomes.
    This can provide information about health risks and to get alerts about health
    issues. This can help physicians to monitor the patients in real-time by using
    wearable devices. It support diagnosis of diseases by using machine learning recommendation
    systems.


    The paper provides some information about the big data in healthcare. In Sect
    2 we give a brief overview of the needed steps to analyze healthcare data. Section
    5, it discusses the proposed system and its future work.


    Many researchers develop new methods and technologies to employ machine learning
    algorithms on big data to predict diseases before they occur. Spark is very fast
    in processing a vast amount of data it can do computations in minutes. This is
    very useful for data processing in runtime and makes decisions. Spark provides
    lambda architecture to perform real-time processing and both batch[3].


    # A. Data Integration


    The proposed system is based on streaming data using Spark. Spark is very useful
    in processing data that comes from the Internet of Things (IoT) as it uses fog
    computing. It gathers data from multiple sources of wearable devices, Electronic
    Health Record (EHR) data, user medical data[4]. Spark can be integrated with Hadoop
    to work on streaming data from different resources[5] as shown in fig 1.'
