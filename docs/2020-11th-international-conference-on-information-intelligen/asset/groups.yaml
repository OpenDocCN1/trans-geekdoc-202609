    # # Applying Cloud Machine Learning on Biosensors Streaming Data for Health Status
    Prediction


    Ahmed Ismail Ebaida Information systems dept. Faculty of computers and information
    Mansoura University Munich, Germany, a.ebada@outlook.com Samir Abdelrafek Mansoura
    University Mansoura, Egypt, samir.abdelrafek@mansoura.edu Ibrahim Elhenawy Computer
