    支持Python、Java、Scala和R。该平台的主要优势是它可以在运行时在内存中为MapReduce处理数据，不需要浪费时间在磁盘上读写数据。可以通过分析数据，从心理和生理数据中生成特征来预测疾病。


    # C. 数据分析


    医疗数据总是需要被分析。数据分析过程包含四类。第一类是描述发生了什么的描述性分析。然后诊断性分析试图找出事件的原因。第三类是针对未来的预测性分析。规范性分析是针对不同情况做出反应[10]。


    医疗数据分析可以使用并行计算完成。MapReduce[11]和Dryad[12]提供了可以管理复杂性的框架。Spark是一个强大的框架，支持不同的编程语言，如


    ![](img/a874a62cd4d1159451d7a4603aeb81e1_1_1.png)


    图2：来自传感器的流式数据。


    # III. 相关工作


    使用支持向量机（SVM）[15]在常见分类中应用广泛。SVM也可以高率地分类数据集。当具有大量输入数据时，会增加分类的复杂性并导致过拟合问题[16]。移除冗余和无关特征可以提高分类准确性并增强机器学习模型的性能。


    在[25]中，作者提出了一种基于遗传算法特征选择的疾病诊断系统。所提系统使用了三种分类方法SVM、KMN和反向传播进行测试。该工具的准确率为99.5%。


    特征选择与提取的区别在于，前者是选择合适的特征，而后者是构造特征[17]。还有研究人员使用SVM开发系统[18]。


    # IV. 所提健康预测系统


    实时处理定义为对无界数据流的处理，例如JSON或半结构化数据，这些通常在毫秒级到达。实时处理解决方案的挑战之一是实时存储大量数据。处理必须以不阻塞摄取管道的方式进行。另一个挑战是快速对数据采取行动，例如在实时仪表板中生成和展示数据。


    Ismail等人提出了一种基于SVM的系统，用于心脏病预测。他们通过特征减少了数据集。所提系统以90.5%的高成功率实现。


    本文提出的解决方案提供了一种适用于基于医疗设备的物联网可穿戴设备的方法。如图3所示，该架构基于医疗设备、智能手表和其他智能可穿戴设备的流源。该系统还基于云结构来处理和存储来自不同来源的医疗数据。所提系统使用Apache
    Spark在内存中处理随时间流的流式数据。


    ![](img/a874a62cd4d1159451d7a4603aeb81e1_2_0.png)


    图3：流式数据架构。


