    # 将云机器学习应用于生物传感器流式数据进行健康状态预测


    Ahmed Ismail Ebaida，曼苏拉大学计算机与信息学院信息系统系，德国慕尼黑，a.ebada@outlook.com；Samir Abdelrafek，曼苏拉大学，埃及曼苏拉，samir.abdelrafek@mansoura.edu；Ibrahim
    Elhenawy，格加齐格大学计算机与信息学院计算机科学系，埃及格加齐格，henawy2009@yahoo.com


    摘要 医疗健康大数据（包括医疗病史、医生报告、处方和家族史数据库、实验室数据以及扫描报告）可以帮助疾病的检测和预测。本文概述了医疗领域中当前的技术和方法，以获取云系统、数据科学和分析的优势。论文介绍了如何利用现有技术用于医疗应用的的流式数据传输。医疗大数据分析是一个研究领域，文章展示了其对患者结果的一些影响。所提系统采用了经过调优的优化支持向量机分类器，以实现高分类准确性和效率。该系统获取心率、糖尿病和血压数据，在云端医疗平台的帮助下分析并预测疾病。


    关键词——移动设备；医疗健康；健康数据状态；预测。


    # I. 引言


    心血管疾病是全球数百万人死亡的最主要原因之一，仅次于癌症[1]。当血块阻塞流向心脏某部分的血液时，就会发生心脏发病，这种血块会导致心脏肌肉死亡。根据统计，对于饮食和生活方式选择不健康的人，心脏问题可能在40-50岁时逐渐开始[2]。因此，早期预后可以通过激励他们采取健康的生活方式和饮食为他们的生活带来巨大改变，从而降低这种风险。本研究旨在展示心脏病预测机器学习中最大的风险因素。机器学习模型通过在个体数据集上训练，预测患者患心脏病的概率。并根据当前的生活方式和饮食计算出患心脏病的概率。该模型使用弗雷明汉心脏研究数据集进行训练。


    许多研究人员开发了机器学习方法来在早期诊断慢性疾病。可穿戴设备通过智能传感器为人体变化提供紧凑、准确、廉价且轻量的健康监测系统，为许多医疗事务提供了生活方式上的便利。大多数健康意识计划都要求对疾病进行预防和早期警示[1]。大数据分析对于使用Spark和机器学习算法利用数据生成医疗数据以预测结果非常有有用且高效。这可以提供有关健康风险的信息，并获取健康问题的警报。这可以帮助医生通过可穿戴设备实时监测患者。它支持通过机器学习推荐系统对疾病进行诊断。


    本文提供了关于医疗健康数据的一些信息。在第2节中，我们简述了分析健康数据所需的步骤。第5节讨论了所提系统及其未来工作。


    许多研究人员开发了新方法和技术，将机器学习算法应用于大数据以便在疾病发生前进行预测。Spark在处理海数据方面非常快，可以在几分钟内完成计算。这对于运行时的数据处理和决策非常有用。Spark提供了Lambda架构来执行实时处理和批处理[3]。


    # A. 数据集成


    所提系统基于使用Spark的流式数据。Spark在处理来自物联网（IoT）的数据方面非常有用，因为它使用了边缘计算。它收集来自多个源的可穿戴设备、电子健康记录（EHR）数据、用户医疗数据[4]。Spark可以与Hadoop集成，以处理来自不同来源的流式数据[5]，如图1所示。


