    ## VI. Conclusion and Future work


    ![](img/a874a62cd4d1159451d7a4603aeb81e1_6_2.png)


    The proposed system provides a platform that can handle real-time healthcare data
    with the historical EHR data for clinicians and healthcare providers to predict
    heart diseases, Spark spots real-time stream analytics over healthcare data. The
    goal of the Biggest Platform in this paper is to acquire and analyze Enterprise-level
    clinical usage. The proposed system provides a big data system that handles EHR
    data based on streaming data from wearable devices and user medical profile. The
    proposed system depends on a dataset as an input with some defined parameters
    to filter the features of the heart dataset. This is achieved by Microsoft Azure
    as a cloud platform with sql node.


    Fig. 7: AUC of the proposed system.


    The age of participants in the dataset is presented in figure 11, it shows most
    of the participants are between 32 and 70 years old. In fig 8, the distribution
    of max heart rates frequency and the age of the participants.


    The paper presents an effective solution for the prediction of diseases using
    knowledge discovery that processes on the EHR database and user social profile.
    The proposed platform also provides an effective solution to connect streaming
    data from wearable devices based on Spark and Microsoft Azure to predict. The
    future work is to implement this proposed system with deep learning techniques
    on its data. The next step of our proposed work is to provide a platform on the
    cloud which supports any kind of disease''s dataset with some predefined factors
    for the disease''s classification process.


