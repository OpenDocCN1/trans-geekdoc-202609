    # III. Related Work


    Using the Support Vector Machine (SVM) [15] is widely in common classification.
    SVM diagnoses can also classify the datasets with high rates of success When a
    dataset with many data inputs, it increases the complexity of classification and
    causes over-fitting problem [16]. Removing redundant and irrelevant features increases
    the accuracy of disease classification and can enhance the machine learning model
    performance.


    In [25], the authors proposed a diagnosis system for diseases based on genetic
    algorithm with feature selection. The proposed system used three classification
    SVM, KMN, and back-propagation for testing. The tool had a accuracy of 99.5%.


    The difference between feature selection and extraction is, first can select suitable
    features but the second can construct them. There is an extraction method called
    Principal Component Analysis (PCA), it can capture the ''principal components''
    eigenvectors representing variability in the dataset [17]. A feature selection
    example Relief, which can work with noisy element, data and it is very useful
    for many classifications [18]. There are also researchers using SVM to develop
    diagnosis systems, with some of them here.


    IV. The proposed healthcare prediction system

    Real-time processing is defined as the processing of unbounded stream of data,
    with very short requirements for processing measured in milliseconds or unstructured
    or semi-structured data, such as JSON, and this incoming data typically arrives
    in the same processing requirements as batch processing. One of the challenges
    of real-time processing solutions is to process, store in real-time, at high volumes.
    Processing must be done in a way that does not block the ingestion pipeline. Another
    challenge is to act on the data quickly, such as generating and presenting the
    data in real-time-related dashboards.


    A.Ismail et al proposed a system based on SVM which was used for heart disease
    prediction. They reduced the dataset diversity with feature reduction methods.
    The proposed system of achieved high success with 90.5% from a heart disease dataset.


    The proposed solution in this paper is to provide an approach that applies to
    medical device based on IoT wearable devices. As shown in fig 3, the architecture
    is based on streaming sources such as medical devices, smartwatches, and other
    smart wearable devices. The system is also based on cloud structure to handle
    and store the medical data from different sources. The proposed system used Apache
    Spark to handle the streaming data over time in the memory processing The proposed
    system SVM with parameters to predict diseases based on the streaming data and
    historical chronicles from the patient''s family.


    In [20], J. Zhang et al applied the SVM classification using standardized tongue
    images for diabetes diseases. By optimization on kernel parameters to improve
    the SVM classification. A Phan al used SVM parameters optimization and applied
    for features to improve SVM performance. We proposed a system using genetic algorithms
    and SVM as a hybrid system. We implemented the SVM classification.


    In [22], the authors used a combination of Grid Search and the k Cross-Validation
    with multiple kernel functions for recognizing the optimal parameters of the SVM
    classification. We proved that the polynomial function performance was the best
    compared to other methods.


    In [23], Y. Xiao adopted an objective function to select SVM parameters. They
    proved the effectiveness of the proposed system based on results.


    In [24], the adaptive SVM classification system was proposed to diagnose breast
    cancer and diabetes. The system used ''if-then'' rules to make decisions. The
    results of the proposed system produced 100% classification accuracy for breast
    cancer and diabetes datasets.


