    图 6：所提系统的评估。


    在图 7 中，使用曲线下面积（AUC）图来衡量机器学习模型的性能。AUC 显示了在所提系统中，基于训练模型对数据集进行评分的正性率的增加情况。


    ![](img/a874a62cd4d1159451d7a4603aeb81e1_6_1.png)


    图 8：心率与相关性。


    所提系统证明了基于用户的个人数据、抑郁情况、传感器和用户特征参数，其准确率达到了 85.2%，非常有前景。


    ## VI. 结论与未来工作


    ![](img/a874a62cd4d1159451d7a4603aeb81e1_6_2.png)


    所提系统提供了一个平台，能够处理实时医疗数据与历史电子健康记录（EHR）数据，供临床医生和医疗保健提供者预测心脏疾病，Spark 实现了对医疗数据的实时流分析。本文中“最大平台”的目标是获取和分析企业级的临床使用。所提系统提供了一个大数据系统，根据来自可穿戴设备和用户医疗档案的流数据处理
    EHR 数据。所提系统依赖于数据集作为输入，并带有某些定义参数来过滤心脏数据集的特征。这是通过作为带有 sql 节点的 Microsoft Azure 云平台实现的。


    图 7：所提系统的 AUC。


    数据集中参与者的年龄如图 11 所示，它显示大多数参与者的年龄在 32 到 70 岁之间。图 8 中展示了最大心率频率的分布和参与者的年龄。


    本文提出了一种利用知识发现进行疾病预测的有效解决方案，该方案处理 EHR 数据库和用户社交档案信息。所提平台还提供了一种有效的解决方案，基于 Spark 和
    Microsoft Azure 连接来自可穿戴设备的流数据进行预测。未来的工作是利用深度学习技术对该数据实施此所提系统。我们所提工作的下一步是提供一个云平台，支持任何种类的疾病数据集，并为疾病的分类过程提供一些预定义的因素。


