    \ 提供了分布式数据库，实现了可扩展应用程序。它支持 NoSQL，并在一个系统中支持键值、图和文档数据。Azure Data Lake 是一种存储技术，无限制地存储不同结构（结构化和半结构化）的数据，用于大数据分析，并与云端的\
    \ HDFS 和 Spark 使用。Azure Data Lake 可以存储数万亿个文件，单个文件的大小可以超过一个拍字节（petabyte）。\n\n关于患者的医疗数据。Azure\
    \ Functions 服务允许开发者执行代码而无需准备接口。该函数的主要目标是它可以按计划运行或由另一个 Azure 服务的事件触发。每当有新的实验室测试结果上传到\
