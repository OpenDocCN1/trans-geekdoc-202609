    # 3. Methodology


    The overall process of creating and applying ML models for multiple variables
    from VIIRS TOA observations is schematically shown in Fig. 3. An optimization
    approach was used to generate the training dataset from VIIRS TOA reflectance
    data. Then, multiple models were developed using the training data using the training
    dataset and to choose the best ML model. The ISR, PAR, and TOA albedo were also
    developed using the all-inputs, while the land surface variables, including LAI,
    FAPAR, shortwave albedo, and reflectance were developed using the VIIRS cloud
    mask product. Afterward, the best RF model was used to estimate time-series variables
    at 50 sites where measurements were field for validation, over a range of 375
    km by 375 km. The comparison with retrieved results. Finally, the RF model was
    used to produce 8-day global products in 2013.


