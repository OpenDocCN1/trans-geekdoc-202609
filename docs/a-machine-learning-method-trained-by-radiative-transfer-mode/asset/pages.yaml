    # 5.2. Representation of training samples


    In the application of the ML model, the model should perform well on new and independent
    data. To simulate this, all available data can be divided into two parts, also
    training-segmentation (Hohburg and McCabe, 2018). For a total of 5300 samples
    for training GLASS LAI (V6) were used for the training sites (Mai and Liang, 2022),
    and satellite observations and coupled RTM simulations. The selected training
    samples were globally distributed and include almost all surface types, as shown
    in Fig. 1. The value range model estimated by the representative of the training
    samples (Zhang et al., 2023) selected almost all the land cover types, and are
    distributed around the earth. The final model also showed extrapolation in spatial
    and temporal cross validation. For surface reflectance, snow-free, snow falling
    and melting pixels were all combined to form the training samples. All samples
    under both clear and cloudy sky conditions were used for


    training ISR, PAR, and TO albedo models owing to the effect of the cloud on them.


    # 5.3. Errors due to the cloud and cloud detection


    In the optimization scheme, an essential step is to determine the TO reflectance
    (Mai et al., 2020; Zhang et al., 2021). As VIIRS provide a cloud mask, the multi-angular
    TO datasets extracted based on cloud indices. However, this dataset does not cover
    effective cloud detection results, especially in regions shown in Fig. 2, where
    cloud shadows are veiled by clear sky, the ML-estimated albedo and surface reflectance
    values at these points are significantly higher than those calculated by the coupled
    RTMs. Slightly higher RMSE values can be observed in cloudy regions, which is
    because that the VNP43MA3 albedo still holds some uncertainties, such as cloud
    contamination, which lead to inaccurate albedo values. In addition, the retrieved
