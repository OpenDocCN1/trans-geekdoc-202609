    There are three main strategies for improving the efficiency of RTM computation.
    The first practical method is to use LUTs to map input variables into output equations,
    and RTMs generating spectrum output for variable value in meantime. However, the
    RTM inversion is reduced to the call to the simulation which is calculated by
    interpolation. Although LUTs can capture important properties, each LUT maps to
    a large number of RTMs after final sampling of the space. From our previous study,
    we used a method to estimate the spectral albedo over 400–2300 nm using an atmospheric
    RTM in Libradat (Ma et al., 2020), and thus the simulated atmospheric variables
    were stored in 3 LUTs. Although retrieving parameters from the LUT was highly
    efficient, it can significantly improve the accuracy of inversion.


    The second strategy is to improve the RTM computation by using machine learning.
    RTMs can be emulated (Veris et al., 2021; Verret et al., 2017). Emulating the
    function of RTMs through statistical learning methods, can enable many new applications
    for computational efficiency and accuracy. These methods include machine learning
    (ML) models that can simulate the atmospheric variables of the RTM computation,
    but the limitation is they use only the output of the RTM.


    Recently


    The third strategy is to integrate the RTM with multiple satellite observation
    and model output products. This method is used to reduce the computational burden
    of RTM inversion.


