    # 5 Discussion


    # 5.1. Variances of the algorithm


    Compared with traditional single-variable approaches, our new efficient RF inversion
    algorithm has four advantages. It can simultaneously estimate seven physically
    consistent surface and atmosphere variables from TOA reflectance data. Second,
    our algorithm does not require complex atmospheric correction or data fusion chain.


    The high computational efficiency of the RF model is another advantage over deep
    learning-based methods developed recently. Fourth, simultaneous estimation of
    all seven variables is more accurate and efficient than estimating individual
    variables sequentially.


    Compared with the coupled RTM methods developed by Ma et al., 2021, the retrieval
    of multiple variables with the new efficient RF inversion algorithm were comparable
    to the previous study. More importantly, the method was used for large-area estimation
    of multiple variables with VIIRS observation, and improved the efficiency of the
    retrieval with a 11,000-fold speed-up compared to the coupled RTM methods.


