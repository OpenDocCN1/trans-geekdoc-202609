    # A machine learning method trained by radiative transfer inversion for generating
    severe global land and atmospheric estimates from VIIRS top-of-atmospheric estimates


    ![](img/c22dd96a7c6e3a0f35b3766bbbf993ef_0_2.png)


    Guodang Zhang a, Han Ma b,c*, Shulin Lin b,c*, Aolin Jia b, Tao He b, Dongdong
    Wang b


    +   a School of Remote Sensing and Information Engineering, Wuhan University,
    Wuhan 430006, China

    b Department of Geographical Sciences, University of Maryland, College Park, MD
    20742, USA

    c Department of Geography, University of Hong Kong, Hong Kong 990077, China


    # ARTICLE INFO ABSTRACT


    Edited by Jing M. Chen


    +   Keywords

    Machine learning

    Random forest regression

    Radiative transfer models (RTMs)

    VIIRS product


    The Visible Infrared Radiometer (VIIRS) has observed the Earth since 2011 and
    will continue for several decades. Unfortunately, high-level land surface products
    are produced and widely released. The numerical inversion of radiative transfer
    model (RTM) has been used traditionally for the retrieval of land and atmospheric
    variables from satellite sensors (e.g., MODIS, using up ASTER) but are effective
    for estimating useful atmospheric variables. Various machine learning (ML) models
    have been developed, primarily through ground measurements that may not be appropriate
    under different conditions, or RTM simulations that may not be realistic due to
    uncertainty and lack of calibration. We developed the ML algorithm that was trained
    using VIIRS inversion for estimating atmospheric variables simultaneously. Using
    this dataset, two multi-output algorithms were explored: backpropagation neural
    networks and random forest (RF) regression. The best-performing RF model was then
    applied to estimate seven land and atmospheric variables from VIIRS data: Fraction
    of absorbed photosynthetically active radiation (PAR), infrared shortwave radiation
    (SWIR), land albedo, land surface reflectance, and TOA albedo. The results were
    evaluated using ground measurements at four sites and extended to test the method
    on a much larger region for evaluation. Finally, seven global estimates in 2013
    were produced. Inter-comparison with the satellite products showed that the VIIRS
    estimates had high similarity with the LAI and FAPAR products of Global Land Surface.
    However, for VINP4MA3 albedo and VINP9A1 surface reflectance, the retrieved estimates
    matched well. It also showed that the estimation of all variables was more accurate
    and efficient than estimating individual variable quantitatively.


    # 1. Introduction


    Remote sensing provides real-time and systematic observations of the Earth''s
    surface and has remarkably contributed to land surface process and environmental
    monitoring at a large scale (Wolanin et al., 2019). With the flourishing hyperspectral
    missions and high-resolution imaging spectrometers,


    unparalleled remote sensing provides data streams which are in a new era of optical
    remote sensing (Evitez et al., 2020). However, retrieving terrestrial and atmospheric
    variables that are due to Earth''s atmospheric composition from such a large data
    stream requires accurate, robust, and efficient methods (Ali et al., 2021). Methods
    based on physical radiative transfer model (RTM) simulations are the first consideration
    out to their rationality and generic


