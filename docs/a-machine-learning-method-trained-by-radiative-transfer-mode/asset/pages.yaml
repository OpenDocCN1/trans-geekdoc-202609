    ML models model the relationship between the input and output by fitting a flexible
    model within the data (Wolanin et al., 2019). Unlike parametric models that define
    an input-output mapping, ML models learn the mapping through automatic feature
    extraction on complex data and express the features as “vectors” in a process
    generally called “embedding”. Then the network performs operations on these vectors
    and compresses them to produce outputs. We evaluated two different multi-output
    ML models using the training data of 85% retrieved from the optimization approach
    and RTM, including RTP.


    In the BP network, input variables are followed along the network structure, where
    the error between the value of each layer is reversed along the network structure.
    This backpropagation is repeated until the error value is stable or until the
    learning rate of learning reaches a preset threshold (Bishop, 1995). Then, the
    BP network model can be used to predict the output. The performance of the BP
    network is much better than that of one hidden layer (Ma et al., 2021). To ensure
    the accuracy and speed, we chose the two-layer architecture. Determination of
    the number of neurons in each layer is important for the overall performance of
    the network. At present, many methods are applied to determine the number of neurons
    in each layer and one of them is as follows (Tian et al., 2020b):


    ```

    n = m + 1

    ```


    where m is the number of neurons in the input layer. In this study, we use VIIRS
    reflectance, zza, raa, elevation, GLI, LAIR and MERRA2 as output data. For the
    training, we used the model: A, BP, RTM, and surface albedo. Since the TOA albedo
    has 13 layers, the number of neurons in each layer is 13, and we set 1, 3 and
    10 for different tests. Therefore, the number of neurons in the hidden layer is
    a constant, and the value ranges from 1 to 10. By setting the number of hidden
    layer nodes when beginning the training process, the number of neurons in the
    input layer was 11 for model A, and 10 for model B based on the RTM.


    The random forest algorithm is used to estimate the variables of interest (Breiman,
    2001) and generate bootstrap samples for the training datasets. Each regression
    tree is built for each bootstrap sample. The average of each individual regression
    prediction is taken as the result. The RF improves the prediction accuracy without
    a significant increase in the number of calculations, it is insensitive to collinearity
    and missing and unbalanced data (Iverson et al., 2008). So, RF model can capture
    complex interactions between input variables and has been successfully applied
    in remote sensing variable (Filgueiras et al., 2022).


    2020 Sprint; Zhou et al., 2023). Individual-output RF is designed for predicting
    one numeric variable, while some regression problems require the prediction of
    two or more variables. In this study, the joint-output RF was used to estimate
    variables simultaneously using seven of RTM results. In the joint-output RF, variables
    are generated together in each bootstrap sample upon each ever (Xu et al., 2023).
    All variables are included in this study, which meets the requirements of the
    joint-output RF. Compared with the BP network, the joint-output RF has more hyperparameters,
    such as the number of trees (tree), the maximum number of features used in a single
    decision tree (tree), and the maximum depth of the regression tree model. In this
    study, we set 100 trees and 30 to to the depth of the regression tree for the
    RF model.


    # 3.3. Data processing and regression model


    This section details how to estimate region and global surface atmospheric variables
    from VIIRS reflectance data using the best models. Land surface variables can
    only be retrieved from clear-sky observation data. Although VIIRS data is affected
    by cloud cover, their shadows reduce the retrieval accuracy in multiple variable
    estimation. To estimate these, we used a spatial-temporal cloud removal method
    (PSTRC) to solve data registration problem. The cloud fusion method was applied.
    First, the clouds and shadows were detected by the data mask. Then we used the
    VIIRS cloud mask to construct a multi-patch method to detect clouds. Secondly,
    random sampling and temporal cross-validation were used to evaluate model performance.
    Furthermore, the data was randomly divided into 8 groups, 12. In each iteration,
    7 groups were used for training data for the model, and the remaining one of groups
    were used for independent validation. For the temporal-cross-validation, we divided
    the data into 2 groups. In each iteration, one group was used for training and
    the other was used for validation. The training and validation process were repeated
    24 times for the data of each spatial and temporal group were validated.


