    ## 5.2. Representation of training samples


    In the application of the ML model, the model should perform well on new and independent
    data. To simulate this, all available data can be divided into two parts, also
    training-segmentation (Hohburg and McCabe, 2018). For a total of 5300 samples
    for training GLASS LAI (V6) were used for the training sites (Mai and Liang, 2022),
    and satellite observations and coupled RTM simulations. The selected training
    samples were globally distributed and include almost all surface types, as shown
    in Fig. 1. The value range model estimated by the representative of the training
    samples (Zhang et al., 2023) selected almost all the land cover types, and are
    distributed around the earth. The final model also showed extrapolation in spatial
    and temporal cross validation. For surface reflectance, snow-free, snow falling
    and melting pixels were all combined to form the training samples. All samples
    under both clear and cloudy sky conditions were used for training ISR, PAR, and
    TO albedo models owing to the effect of the cloud on them.


    ## 5.3. Errors due to the cloud and cloud detection


    In the optimization scheme, an essential step is to determine the TO reflectance
    (Mai et al., 2020; Zhang et al., 2021). As VIIRS provide a cloud mask, the multi-angular
    TO datasets extracted based on cloud indices. However, this dataset does not cover
    effective cloud detection results, especially in regions shown in Fig. 2, where
    cloud shadows are veiled by clear sky, the ML-estimated albedo and surface reflectance
    values at these points are significantly higher than those calculated by the coupled
    RTMs. Slightly higher RMSE values can be observed in cloudy regions, which is
    because that the VNP43MA3 albedo still holds some uncertainties, such as cloud
    contamination, which lead to inaccurate albedo values. In addition, the retrieved
    albedo values were used for consistent with the field measurements (''90), although
    we retrieved the model with a high error. This was caused by the weighting factor
    of snow (Ma et al., 2020); the similar reflection characteristics between snow
    and cloud made it difficult to determine the contribution of snow under cloudy
    and snowy conditions.


    ![](img/c22dd96a7c6e3a0f35b3766bbbf993ef_23_0.png)

    ![](img/c22dd96a7c6e3a0f35b3766bbbf993ef_23_1.png)

    Fig. 22. Comparison between estimates of the GLASS and VIIRS products under different
    conditions (a) level, (b) slope).


    ![](img/c22dd96a7c6e3a0f35b3766bbbf993ef_23_2.png)


    ## 5. Problems to be addressed


    This paper uses a joint-RF model to replace the complex optical and RT models
    to retrieve surface estimates from VIIRS top-of-atmosphere observations. Some
    problems remain to be addressed. The first problem is that the RF model is not
    coupled with the RT model, while model cannot consider the factors such as geometry.
    A more advanced model could be incorporated in the future, such as 4SLA2 which
    allows for coupling (Benlof and Bach, 2016). Index is a key structural parameter
    of can cover, so we use a leaf canopy index from VIIRS. In contrast, the VIIRS
    canopy index varies with the seasons, the yearly average canopy index may have
    affected the accuracy of the inventory results. The second problem concerns the
    sensitivity of leaf angle to distribution. The leaf angle distribution is not
    considered in the RF model (Negato et al., 2019; Verdsagt et al., 2015; Verselt
    et al., 2016). The third problem is that the RF model was set to a fixed value
    alone, which may lead to inaccurate results in our research predictions (Saiti
    et al., 2021). The leaf angle distribution may need to be adjusted dynamically
    in the RF model to achieve better results. The third problem concerns the soil
    RF in the model. It has only one parameter (Ref3) which may not be enough to characterize
    the accuracy of surface albedo. This is the main factor affecting the accuracy
    of surface albedo. Therefore, further studies are needed to improve the soil RF
    model. The model could be improved by considering more factors that changes (Happe,
    1981; Lieber et al., 2019; Townsend, 1996). However, many factors make the inversion
    ill-posed if this model is coupled with the canopy and atmosphere (Dicke et al.,
    2022) and will incorporate this into inversion scheme in the future. The last
    problem deals with topography. Terrain affect spatial optical angles and bidirectional
    reflectance function. However, for this study, the information obtained from satellite
    images used to estimate the land surfaces may have affected the accuracy of the
    inventory results.


    ## 6. Conclusion


    VIIRS data have been available since 2011; but high-frequency products have been
    produced. This study developed a hybrid approach to estimate the seasonal land
    surface and atmospheric variables from VIIRS observations through a coupled radiative
    transfer model. The results of different ML methods were compared to simulated
    dataset, and the best ML model was used to retrieve LA, FAPAR, ISR, surface albedo,
    surface reflectance. The evaluation results demonstrate that the RF model achieved
    the highest accuracy for LA, FAPAR, surface albedo, ISR, PAR, and TOA. The evaluation
    of atmospheric correction showed R² values of 0.672, 0.786, 0.835, 0.629, 0.727,
    and 0.845 show that our proposed approach effectively captured the seasonal dynamics
    of vegetation across land types and seasons. A set of global maps were produced
    and showed that the retrieved VIIRS estimates have high consistency with GLASS,
    FPAR, VNP43MA albedo, and VNP9OA surface reflectance. The excellence in VIIRS
    data makes the multi-variable retrieval model promising. Future work will further
    the retrieval model and consider the specific differences, architectures for the
    purpose of estimating global-scale remote sensing variables and spatial variability
    of ecosystem-scale carbon cycle, water vapor, and water fluxes.


