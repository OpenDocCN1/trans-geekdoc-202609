    # 文章信息 摘要


    编辑者：Jing M. Chen


    + 关键词

    机器学习

    随机森林回归

    辐射传输模型 (RTMs)

    VIIRS 产品


    可见光红外辐射计 (VIIRS) 自 2011 年以来一直在观测地球，并将持续几十年。遗憾的是，高层地表产品尚未被生产并广泛发布。辐射传输模型 (RTM)
    的数值反演传统上用于从卫星传感器（例如，使用 ASTER 的 MODIS）中反演陆地和大气变量，但对于估计有用气变量非常有效。已经开发了多种机器学习 (ML)
    模型，主要通过地面测量（这在不同条件下可能不适用）或由于不确定性和缺乏校准而可能不真实的 RTM 模拟。我们开发了使用 VIIRS 反演训练的机器学习算法，用于同时估计大气变量。利用该数据集，探索了两种多输出算法：反向传播神经网络和随机森林
    (RF) 回归。随后将表现最好的 RF 模型用于从 VIIRS 数据中估计七个陆地和大气变量：光合有效辐射吸收 (PAR)、红外短波辐射 (SWIR)、陆地反照率、地表反射率和大气顶
    (TOA) 反照率。使用四个地点的地面测量对结果进行了评估，并扩展到更大的区域以测试该方法。最后产生了 2013 年的七个全球估计。与卫星产品的比较显示，VIIRS
    估计与全球陆表的 LAI 和 FAPAR 产品具有高度相似性。然而，对于 VINP4MA3 反照率和 VINP9A1 反射率，反演估计匹配良好。它还表明，所有变量的估计比定量估计单个变量更准确、高效。


    # 1. 引言


    遥感提供了对地球表面的实时和系统观测，对大规模陆表过程和环境监测做出了显著贡献（Wolanin et al., 2019）。随着高光谱任务的繁荣和分辨率成像光谱仪的发展，无与伦比的遥感提供了光学遥感新时代的数据流（Evitez
    et al., 2020）。然而，从如此巨大的数据流中提取由于地球大气成分引起的地表和大气变量，需要准确、稳健且高效的方法（Ali et al., 2021）。基于物理辐射传输模型
    (RTM) 模拟的方法因其合理性和通用性成为首选（Auberger and Richter, 2012; Jacquemaud et al., 2009;
    Liang, 2004）。


    * 通讯作者

    邮箱：mahans@whu.edu.cn (H. Ma), liang@umd.edu (S. Liang)。


    https://doi.org/10.1016/j.rse.2022.113132

    接收：2021年6月28日；采纳：2022年6月10日；在线发表：2022年6月28日

    © 2022 Elsevier Inc. 保留所有权利。物理辐射传输模型 (RTM) 捕获传输过程、介质中的能量特性。RTM——例如土壤 RTM 和大气 SMP——能够被捕获，并在遥感再分析和卫星数据应用中很有帮助。一些遥感产品也使用这些方法生成。Verger
    et al. (2023) 集成了高度复杂的模型，如 CO2 线和叶面积指数 (LAI)，从大气影响 (FPAR) 生成反射率值。Ma et al. (2022)
    使用深度学习 LSTM 模型产生了全球陆表（版本 6），真实的 LAI 被定义为绿地叶片的总面积。


    提高 RTM 计算效率有三种主要策略。第一种实用方法是使用查找表 (LUTs) 将输入变量映射到输出方程，同时生成变量的光谱输出。虽然 LUTs 可以捕获重要属性，并在空间最终采样后映射到大量的
    RTM，但从我们之前的研究来看，我们使用 RTM 估计 400–2300 nm 的光谱反照率（Ma et al., 2020），因此大气变量被存储在 LUT
    中。虽然从 LUT 获取参数非常高效，但可以显著提高反演精度。


    第二种策略是通过使用机器学习提高 RTM 计算。通过统计学习方法模拟 RTM 函数可以实现许多新应用的计算效率和精度（Verret et al., 2021）。这些新开发的方法包括机器学习
    (ML) 模型，可以模拟 RTM 的大气变量，但局限性是它们只使用了 RTM 的输出。


    第三种策略是将 RTM 与多个卫星观测和模型相结合。这种方法用于减少 RTM 反演的计算负担。方位角是由卫星轨道几何引起的（Barclay et al.,
    1994），在模拟中考虑这些角度，使用估计数据训练 ML 模型可以避免这些问题。


    最近，第三种策略是：NASA 极轨道伙伴 (SPO)卫星上的可见光红外辐射计 (VIIRS) 将用于详细观测。然而，由 NOAA（https://viirs.noaa.gov）生产的高层数据很少。我们的目标是开发高分辨率产品。有一种更直接的方法是在卫星观测和模型输出之间建立
