    3, we first describe the RTMS used for processing the data. In Section 4, we report
    the results of the estimated data and satellite products. In Analysis, we evaluate
    the performance of three ML methods and find the best model. Then, we compare
    multiple variables with the best model. In Section 5, we discuss the representativeness
    of training samples, the potential errors caused by the cloud, and the complexity
    of multiple variables. In Section 6, we provide our findings and propose future
    work.


