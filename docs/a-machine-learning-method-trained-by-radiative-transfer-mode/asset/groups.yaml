    20% 的像素值大于 0.02。ISR、PAR 和 TOA 的实例已用于对比，这三个变量的准确性见 4.3 节。


    ## 4 结果


    ### 4.1. 训练数据的准确性


    已使用实地测量和卫星产品进行了广泛验证，以往研究表明通过优化方法和 RTM 的检索准确性良好（Ma et al., 2017a; Ma et al., 2017b;
    Shi et al., 2017）。这三个变量的准确性见 4.3 节。


