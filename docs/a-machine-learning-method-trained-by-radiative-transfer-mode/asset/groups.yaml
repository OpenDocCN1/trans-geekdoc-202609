    ### 4.2. 双输出 ML 模型的性能


    深度学习改进了云像素的准确性，但降低了计算效率，使得难以应用 PSTCR 方法生成全球产品（Zhang et al., 2020）。我们使用全空 TOFA
    参考数据估计全球尺下的地表。然后，使用 VIIRS 云模型确定检索。LAI 和 PAR 产品在 8 天周期内产生，所选值用于地表。可见光反照率也于 8 天周期内产生。与
    MODIS 模型（基于 BRDF 参数反演）不同，中间图像中的清晰值被用于替换相同方法生成的中间图像中的缺失值。ISR、PAR 和 TOA 虽然未经过处理，但直接用于全球
    VIIRS 大气产品。


