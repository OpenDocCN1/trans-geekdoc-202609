    可光反射率，(e) 顶层 (TO) 反照率。


    ## 5.2. 训练样本的表示


    在机器学习模型的应用中，模型应在新的独立数据上表现良好。为了模拟这一点，所有可用数据可分为两个部分，也称为训练分段（Hohburg 和 McCabe, 2018）。总共
    5300 个样本用于训练 GLASS LAI (V6) 的训练位点（Mai 和 Liang, 2022），以及卫星观测和耦合辐射传输模型 (RTM) 模拟。所选训练样本在全球范围内分布，涵盖了几乎所有的地表类型，如图
    1 所示。由训练样本代表性模型估算的值范围（Zhang 等，2023）涵盖了几乎所有的陆地覆盖类型，并分布在全球地球。最终模型在空间和时间交叉验证中也表现出外推性。对于地表反射率，无雪、降雪和融雪像素均被结合形成训练样本。由于云对它们的影响，晴天和多云条件下的所有样本均被用于
    ISR、PAR 和顶层反照率模型的训练。


    ## 5.3. 云和云检测引起的误差


    在优化方案中，一个关键步骤是确定顶层 (TO) 反射率（Mai 等，2020；Zhang 等，2021）。由于 VIIRS 提供云掩码，基于云指数提取多角度顶层数据集。然而，该数据集并未覆盖有效的云检测结果，特别是在图
    2 所示的区域，那里的云影被晴天所遮挡，这些点的机器学习估算反照率和地表反射率值显著高于耦合 RTM 计算出的值。在多云区域可以观察到略高的均方根误差 (RMSE)
    值，这是因为 VNP43MA3 反照率仍存在某些不确定性，例如云污染，导致反照率值不准确。此外，所检索到的反照率值被用于与实地测量（''90''）保持一致，尽管我们检索到的模型误差很大。这是由雪的权重因子引起的（Ma
    等，2020）；雪与云之间相似的反射特性使得难以确定多云和雪天条件下雪的贡献。


    ![](img/c22dd96a7c6e3a0f35b3766bbbf993ef_23_0.png)

    ![](img/c22dd96a7c6e3a0f35b3766bbbf993ef_23_1.png)

    图 22. 不同条件下 GLASS 和 VIIRS 产品估算值之间的对比（a) 水平，(b) 坡度）。


    ![](img/c22dd96a7c6e3a0f35b3766bbbf993ef_23_2.png)


    ## 5. 待解决的问题


    本文使用联合 RF 模型代替复杂的辐射传输 (RT) 模型来从 VIIRS 顶层观测检索地表估算值。仍有一些待解决的问题。第一个问题是 RF 模型未与 RT
    模型耦合，模型无法考虑几何等因素。未来可以引入更先进的模型，例如允许耦合的 LA2（Benlof 和 Bach, 2016），LA2 是被覆盖的关键结构参数。相反，VIIRS
    冠指数随季节变化，年度平均冠指数可能影响结果的准确性。第二个问题涉及叶角分布的敏感性。叶角分布在 RF 模型中未被考虑（Negato 等，2019；Verselt
    等，2015）。第三个问题是 RF 模型被设定为固定值，这可能导致预测结果不准确（Saiti 等，2021）。叶角分布可能需要在 RF 模型中进行动态调整以获得更好的结果。第三个问题是
    RF 模型中只有一个参数（Ref3）。因此，需要考虑更多变化的因素来改进 RF 模型（Happe, 1981；Lieber 等，2019；Townsend,
    1996）。许多因素使得反演与冠层和大气耦合变得病态（Dicke 等，2022），未来将将其纳入反演方案。最后一个问题涉及地形。然而，本研究从卫星图像获取的信息可能影响结果的结果。


    ## 6. 结论


    VIIRS 数据自 2011 年以来可用，产生了高频产品。本研究开发了一种混合方法，通过 VIIRS 观测估计季节性地表和大气变量。将不同的机器学习方法与模拟数据集进行比较，结果表明
    RF 模型在 LA、FAPAR、反照率、ISR、PAR 和 TOA 方面达到了最高精度。大气校正的评估显示 $R^2$ 值为 0.672、0.786、0.835、0.629、0.727
    和 0.845，表明我们的方法有效地捕捉了跨陆地类型和季节的植被动态。产生了一系列全球地图，表明检索到的 VIIRS 估算与 GLASS、FPAR、VNP43MA
    反照率和 VNP9OA 地表反射率具有高度一致性。VIIRS数据的卓越使得多变量检索模型具有前景。未来的工作将进一步完善检索模型，并考虑全球尺度遥感变量以及生态系统尺度碳循环、水汽和水量的空间变化。


