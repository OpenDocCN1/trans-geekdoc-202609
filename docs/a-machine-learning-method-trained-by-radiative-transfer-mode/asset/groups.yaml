    # 一种通过辐射传输反演训练的机器学习方法，用于从 VIIRS 大气顶估值生成全球严重陆地和大气估计


    ![](img/c22dd96a7c6e3a0f35b3766bbbf993ef_0_2.png)


    Guodang Zhang a, Han Ma b,c*, Shulin Lin b,c*, Aolin Jia b, Tao He b, Dongdong
    Wang b


    + a 中国武汉大学遥感与信息工程学院，武汉 430006

    b 美国马里兰大学地理科学系，College Park, MD 20742, USA

