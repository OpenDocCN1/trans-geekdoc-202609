    # 5. Problems to be addressed


    This paper uses a joint-RF model to replace the complex optical and RT models
    to retrieve surface estimates from VIIRS top-of-atmosphere observations. Some
    problems remain to be addressed. The first problem is that the RF model is not
    coupled with the RT model, while model cannot consider the factors such as geometry.
    A more advanced model could be incorporated in the future, such as 4SLA2 which
    allows for coupling (Bencof and Bach, 2016). Index is a key structural parameter
    of can cover, so we use a leaf canopy index from VIIRS. In contrast, the VIIRS
    canopy index varies with the seasons, the yearly average canopy index may have
    affected the accuracy of the inventory results. The second problem concerns the
    sensitivity of leaf angle to distribution. The leaf angle distribution is not
    considered in the RF model (Negato et al., 2019; Verdsagt et al., 2015; Verselt
    et al., 2016). The third problem is that the RF model was set to a fixed value
    alone, which may lead to inaccurate results in our research predictions (Saiti
    et al., 2021). The leaf angle distribution may need to be adjusted dynamically
    in the RF model to achieve better results. The third problem concerns the soil
    RF in the model. It has only one parameter (Ref3) which may not be enough to characterize
    the accuracy of surface albedo. This is the main factor affecting the accuracy
    of surface albedo. Therefore, further studies are needed to improve the soil RF
    model. The model could be improved by considering more factors that changes (Happe,
    1981; Lieber et al., 2019; Liang and Townsend, 1996). However, many factors make
    the inversion ill-posed if this model is coupled with the canopy and atmosphere.


    group has more space in this topic (Dicke et al., 2022) and will incorporate this
    into inversion scheme in the future. The last problem deals with topography. Terrain
    affect spatial optical angles which varies in the brightness and the bidirectional
    reflectance distribution function. However, for this study, the information obtained
    from satellite images used to estimate the land surfaces, which may have affected
    the accuracy of the inventory results. Future work will consist considering the
    coupling radiative transfer models suitable for rugged terrain with atmospheric
    radiative transfer models added to the topographic effects.


    # 6. Conclusion


    VIIRS data have been available since 2011; but high-frequency products have been
    produced. This study developed a hybrid approach to estimate the seasonal physically
    consistent land surface and atmospheric variables from VIIRS observations. The
    multivariable dataset was generated using an optimization method that estimates
    the land and canopy indices from VIIRS TOA data through a coupled radiative transfer
    model. The results of the different ML methods were compared to the simulated
    dataset, and the best ML model was determined. Lastly, the best-RF model was used
    to retrieve LA, RF, FAPAR, ISR, land surface albedo, surface reflectance from
    VIIRS data.


    The evaluation results demonstrate that the RF model achieved the highest accuracy
    for LA, FAPAR, surface albedo, land surface reflectance, ISR, PAR, and TOA. The
    evaluation of the atmospheric correction model showed R² values of 0.672, 0.786,
    0.835, 0.629, 0.088, 0.127, 0.122, and 0.845; R² values of -0.048 to 0.053 for
    larger region also show that our proposed approach effectively captured the seasonal
    dynamics of the vegetation variables and across areas of land types and seasons
    with no vegetation. A set of global 2013 maps were produced and showed that the
    retrieved VIIRS estimates


