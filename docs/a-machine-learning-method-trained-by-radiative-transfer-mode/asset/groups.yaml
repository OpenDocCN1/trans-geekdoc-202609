    # 5 讨论


    ## 5.1. 算法的变异


    与传统的单变量方法相比，我们的新型高效 RF 反演算法四个优势。它可以从 TOA 反射率数据同时估计七个物理一致的地空变量。其次，我们的算法不需要复杂的大气校正或数据融合链。RF
    模型的高计算效率是相对于开发的深度学习方法的另一个优势。第四，同时估计所有变量比逐顺序估计单个变量更准确更高效。


