    ## 3.2. 多变量模型的训练方法


    使用 VIIRS 云掩膜进行了站点选择。所有站点被随机分为两组：4500个站点（85%，727,600对数据）用于训练机器学习（ML）模型；795个站点（15%，126,744对数据）用于验证准确性。所有训练和验证数据都是完全独立的。


    ML 模型通过在数据中拟合一个灵活的模型来模拟输入与输出之间的关系（Wolanin et al., 2019）。与定义输入-输出映射的参数模型不同，ML 模型通过对复杂数据进行自动特征提取来学习映射，并在通常被称为“嵌入”的过程中将特征表示为“向量”。然后，网络对这些向量进行操作并将其压缩以产生输出。我们使用了从优化方法和
    RTM（包括 RTP）检索的 85% 训练数据，评估了两种不同的多输出 ML 模型。


    在 BP 网络中，输入变量沿着网络结构传递，每层值之间的误差沿着网络结构反向传播。这种反向传播重复进行，直到误差值稳定或学习率达到预设阈值（Bishop,
    1995）。然后，可以使用 BP 网络模型预测输出。BP 性能远优于单隐藏层（Ma et al., 2021）。为了确保准确性和速度，我们选择了双层架构。确定每层神经元的数量对网络的整体性能至关重要。目前，有许多方法被用于确定每层神经元的数量，其中一种如下（Tian
    et al., 2020b）：


    ```

    n = m + 1

    ```


    其中 m 是输入层神经元的数量。在本研究中，我们使用 VIIRS 反射率、zza、raa、海拔、GLI、LAIR 和 MERRA2 作为输出数据。在训练时，我们使用了模型：A、BP、RTM
    和地表反照率。由于 TOA 反照率有 13 层，每层的神经元数量为 13，我们在不同的测试中设置了 1、3 和 10。因此，隐藏层神经元的数量是一个常数，值范围从
    1 到 10。在开始训练过程时设置隐藏层节点数，模型 A 的输入层神经元数量为 11，基于 RTM 的模型 B 为 10。


    随机森林算法用于估计感兴趣的变量（Breiman, 2001）并为训练数据集生成自助样本。每个自助样本都会构建一个回归树。取每个单独回归预测的平均值作为结果。RF
    在不显著增加计算量的情况下提高了预测准确性，且它对共线性、缺失数据和不平衡数据不敏感（Iverson et al., 2008）。因此，RF 模型可以捕捉输入变量之间复杂的相互作用，并已成功应用于遥感变量（Filgueiras
    et al., 2022）。


    单输出 RF 设计用于预测一个数值变量，而某些回归问题需要预测两个或更多变量。在本研究中，使用了联合输出 RF，利用七个 RTM 结果同时估计变量。在联合输出
    RF 中，变量在每次迭代时在每个自助样本中共同生成（Xu et al., 2023）。本研究包含了所有变量，符合联合输出 RF 的要求。与 BP 网络相比，联合输出
    RF 具有更多的超参数，例如树的数量（tree）、单个决策树中使用的最大特征数（tree）以及回归树模型的最大深度。在本研究中，我们将树的数量设为 100，深度设为
    30。


    ## 3.3. 数据处理与回归模型


    本节详细说明了如何使用最佳模型从 VIIRS 反射率数据估计区域和全球表面变量。地表变量只能从晴空观测数据检索。尽管 VIIRS 数据受云覆盖影响变量估计的准确性，为了估计这些变量，我们使用了时空去云方法（PSTR）来解决数据配准问题。采用了云融合方法。首先，通过掩膜检测云和阴影。其次，使用随机采样和时间交叉验证进行评估。此外，将数据随机分为
    8 组。在每次迭代中，一组用于训练，另一组用于验证。对于时空交叉验证，我们将数据分为 2 组。在每次迭代中，一组用于训练，另一组用于验证。训练和验证过程重复了
    24 次，训练和估计多个变量的时间成本记录了 395 个站点。三种 ML 方法的效率见 4.1 节。


