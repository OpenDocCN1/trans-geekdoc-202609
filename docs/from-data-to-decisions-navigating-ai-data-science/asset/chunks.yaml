    跨金融、医疗和自动系统这三个领域，得出了关键教训。在金融领域，欺诈检测的精确度节省了 4500 万美元；在医疗领域，提高的回回率使漏诊减少了 75%；在自动系统中，有效的奖励驱动了碰撞率降低
    80%。


