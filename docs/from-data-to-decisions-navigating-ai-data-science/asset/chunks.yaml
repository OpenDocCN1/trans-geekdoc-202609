    本章仅仅是我们探索的开始。在随后的章节中，我们将历经整个过程，从原始数据到可操作的决策。你将学习如何收集和清洗数据（第 3 和第 4 章）、获取洞察（第 6
    至 8 章）以及如何有效实施（第 9 和第 10 章）。无论你的经验水平如何，我的承诺是：到本书结束时，你不仅仅理解 AI 如何利用数据——你将学会如何自己驾驭它。


    ## 数据的必要性


    人们常说数据是新石油，但存在一个至关重要的区别：没有精炼，原油毫无价值。真正的挑战——也是机遇——在于将原始、混乱的信息转化为强大的东西。AI 革命并非机器夺取控制权，而是人类通过掌握数据来构建更智能的未来。在下一章中，我们将检查各种类型的数据和可用来源，邀请你共同探索。


    ## 深挖：旅程中的工具


    想象一条记录 AI 兴起的时间线——当 `ImageNet` 和 `AlphaGo` 等突破照亮前进道路时，基于规则的系统逐渐褪色。或者，想象一张插插旅程的流程图：`数据
    → 模型 → 决策`，沿途警告标志指示着潜在的陷阱。


    你知道吗？Google 搜索引擎曾爬取过 30 万亿网页——这种规模的数据着实令人叹为观止。


    数据焦点：认识 `MNIST`，这是一个手写数字数据集，它点燃了现代 AI 视觉时代。


    尝试：在网上寻找一个数据集——`Kaggle` 是一个很好的起点。你能从中汲取什么洞察？你可能会遇到哪些挑战？写下你的感悟。你已经为未来的旅程做好了准备。


    本章不仅仅是对事实的叙述；它是你进入 AI 和数据世界的跳板。我们将继续将宏大的想法与具体的步骤相结合，将原始矿石转化为钢铁。你准备好开启这段冒险了吗？


    # 人工智能背后的引擎


    ## 概述：数据如何驱动 AI 及其演变


    想象一种机器，它不是通过接收显式指令来学习，而是通过在海量示例中导航、识别模式并自主适应。人工智能（AI）的精髓，而它的核心是数据——让这一切成为可能的血液。AI
    从根本上围绕着教会机器复制人类智能展开，无论是识别停止标志、诊断医疗状况，还是预测明天的天气。与通过经验和直觉学习的人类不同，机器需要持续的数据供应——原始、混乱、有时甚至是美的数据——来为其算法提供燃料。它们消耗的数据越多，就变得越智能。这不仅仅是技术上的进步；它代表了一场发展了数十年的革命，改变了我们生活、工作和梦想的方式。


    那么，我们是如何到达这一点的呢？叙述始于 AI 基础的起源。20 世纪 50 代，艾伦·图灵（Alan Turing）等先驱设想了能够思考的机器。早期的 AI
    尝试很大程度上依赖逻辑和规则。例如，考虑一台通过遵守严格策略来国际象棋。这些“符号 AI”系统令人印象深刻但脆弱；它们可以计算并解决谜题，但在面对模糊性（如模糊的图像或讽刺的话）时却力不从心。它们的局限性源于无法从现实世界的混沌和不可预测性中学习。


    第一次重大突破随着机器学习的出现，这种转变在 20 世纪 80 年代和 90 年代开始成形。工程师不再硬编码每一个决策，而是开始向算法输入数据——提供正确和错误操作的示例。一个形象的例子是垃圾邮件过滤；系统并没有列出所有可能的垃圾邮件词，而是分析了成千万封电子邮件，学习识别垃圾邮件的共同特征。在这种情况下，数据变成了老师，而算法承担了学生的角色。然而，这仅仅是更大规模变革的前奏。


    真正的兴奋始于 21 世纪 10 年代深度学习的兴起——这是机器学习的一个子集，模仿人类大脑的神经网络。这些系统由层层数字“神经元”组成，它们共同工作并在大规模数据集和强大的计算能力下蓬勃发展。这种发展使
    AI 能够承担曾认为不可能的任务——例如实时语言翻译、在交通高峰期间导航，甚至创作出与人类创造力相媲的艺术。


    什么推动了这种进步？答案是丰富的数据。深度学习模型不仅仅是从溪中吸水，它们吞噬海量信息。例如，Google 的语言模型 `BERT` 使用源自书籍和网站的惊人
    33 亿词进行训练。同样，特斯拉的自动驾驶技术依赖于 PB 级的驾驶视频。

