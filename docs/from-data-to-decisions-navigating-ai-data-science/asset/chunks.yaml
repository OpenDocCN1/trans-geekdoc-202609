    df\[''has\_exclamation''\] = df\[''text''\].str.contains(''!'').astype(int)  #
    Flags excitement


    df\[''caps\_ratio''\] = df\[''text''\].str.count(r''\[A-Z\]'') / df\[''text\_length''\] 
    # Measures shouting


    These features provide insights into the emotional weight of the posts; for example,
    shorter texts might indicate lower engagement, while the presence of exclamations
