    ## Spotting Anomalies for Robustness


    Anomalies can disrupt model performance, so it is essential to identify and manage
    them effectively. EDA techniques help differentiate between valuable outliers
    and noise.


    ### Drop Junk


    By identifying extreme outliers through `histograms` and `z-scores`, you can remove
    data points that skew results. For instance, if the maximum sales value is `1millionwhilethemeanis1
    million while the mean is1millionwhilethemeanis100`, removing such anomalies can
    lead to a 15% increase in accuracy for a sales AI.


    ### Keep the Gold


    Conversely, certain anomalies may represent valuable insights, such as viral posts
    with z-scores greater than 5. By flagging these as `is_viral`, you can enhance
    sentiment analysis:


    ```

    df[''is_viral''] = (df[''retweets''] > df[''retweets''].quantile(0.99)).astype(int)

    ```


    Tesla’s crash AI maintained high-speed anomalies, which contributed to improved
    safety predictions.


    ### Adjust Models


    High variance in data suggests the need for robust algorithms. For instance, using
    the `Isolation Forest` method can help identify outliers and minimize their impact
    on the model:


    ```python

    from sklearn.ensemble import IsolationForest


    iso = IsolationForest()


    df[''anomaly''] = iso.fit_predict(df[[''likes'', ''retweets'']])

    ```


    ### Why It Works


    EDA’s focus on anomalies prepares your models for robust performance. By cleaning
    junk data and leveraging valuable edge cases, you enhance your model''s resilience.
    For example, a health AI that retained BMI outliers as high-risk indicators achieved
    a 90% accuracy in disease prediction.


    ## Scaling and Preprocessing Tweaks


    The insights gained from EDA regarding the spread and shape of your data inform
    necessary preprocessing steps, such as normalization, standardization, and encoding.


    ### Normalization


    If your data is skewed, normalization can help. For instance, if likes range from
    0 to 50,000, you can normalize them to a 0-1 scale:


    ```

    df[''likes_norm''] = (df[''likes''] - df[''likes''].min()) / (df[''likes''].max()
    - df[''likes''].min())

    ```


    This adjustment often enhances model performance, as seen in an X AI that experienced
    a 5% lift after normalization.


    ### Standardization


    For features that follow a bell curve, standardization is appropriate:


    ```

    df[''speed_std''] = (df[''speed''] - df[''speed''].mean()) / df[''speed''].std()

    ```


    This prepares the data for regression analyses, with a traffic AI reporting an
    8% gain from standardized speed data.


    ### Encoding


    For categorical variables, encoding is essential. By using one-hot encoding for
    sentiment categories, you ensure balanced representation:


    ```

    df = pd.get_dummies(df[''sentiment''])

    ```


    This technique can illuminate regional trends in sales data.


    ### Why It Works


    EDA’s visualizations and statistical analyses guide preprocessing choices. By
    normalizing skewed data, standardizing bell-shaped distributions, and encoding
    categorical variables, you align your data with the requirements of different
    models, enhancing model performance across the board.


