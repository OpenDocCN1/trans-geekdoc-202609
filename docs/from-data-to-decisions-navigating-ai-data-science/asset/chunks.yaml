    \nimport pandas as pd\n\nimport re\n\nfrom datetime import datetime\n\n\\# Load\
    \ raw data\n\ndf = pd.read\\_csv('social\\_media\\_raw.csv')\n\ndef clean\\_social\\\
    _media\\_data(df):\n\n\"\"\"Clean raw social media posts for NLP analysis.\"\"\
    \"\n\n\\# 1. Handle missing values\n\ndf = df.dropna(subset=\\['text'\\])  # Remove\
    \ empty posts\n\ndf\\['likes'\\] = df\\['likes'\\].fillna(0).astype(int)  # Fill\
    \ missing likes\n\n\\# 2. Clean text\n\ndf\\['text\\_clean'\\] = df\\['text'\\\
    ].apply(lambda x:\n\nre.sub(r'http\\\\S+|#\\\\w+|\\[^a-zA-Z\\\\s\\]', '', x)  #\
    \ Remove URLs, hashtags, emojis\n\n.strip()  # Remove whitespace\n\n.lower()  #\
    \ Lowercase\n\n)\n\n\\# 3. Fix timestamp format\n\ndf\\['timestamp'\\] = pd.to\\\
    _datetime(\n\ndf\\['timestamp'\\],\n\nerrors='coerce',\n\nformat='%Y-%m-%d %H:%M:%S'\n\
    \n).dt.date  # Extract date\n\n\\# 4. Remove duplicate posts\n\ndf = df.drop\\\
    _duplicates(subset=\\['text\\_clean'\\])\n\n\\# 5. Validate and return\n\nreturn\
    \ df\\[df\\['text\\_clean'\\].str.len() > 5\\]  # Remove trivial text\n\n\\# Execute\
    \ and save\n\nclean\\_df = clean\\_social\\_media\\_data(df)\n\nclean\\_df.to\\\
    _csv('social\\_media\\_clean.csv', index=False)\n\nCleaned Output (\\`social\\\
    _media\\_clean.csv\\`)\n\n\\`\\`\\`csv\n\npost\\_id,text,author,likes,timestamp,text\\\
    _clean\n\n1,\"Just saw #AvengersEndgame... BEST MOVIE EVER!!! \U0001F60D\",user123,2550,2023-04-15,\"\
    just saw best movie ever\"\n\n2,\"Ugh, traffic today is THE WORST. #MondayBlues\"\
    ,user456,0,2023-04-17,\"ugh traffic today is the worst\"\n\n3,\"Python vs R –\
    \ FIGHT! \U0001F94A #DataScience\",user789,1200,2023-04-17,\"python vs r fight\"\
    \n\n4,\"Missing my vacation... \U0001F334 https://beachphotos.com\",user101,780,2023-04-18,\"\
    missing my vacation\"\n\nKey Learning Points\n\n1\\. \\*\\*Missing Data Handling\\\
    *\\*: Removal of empty posts and imputation for missing likes \n\n2\\. \\*\\*Text\
    \ Normalization\\*\\*: Removal of URLs, hashtags, emojis, and case standardization \n\
    \n3\\. \\*\\*Timestamp Parsing\\*\\*: Consistent date formatting for temporal\
    \ analysis \n\n4\\. \\*\\*Duplicate Detection\\*\\*: Eliminating redundant posts\
    \ based on cleaned text \n\n5\\. \\*\\*Validation\\*\\*: Ensuring minimum text\
    \ length for meaningful analysis \n\nVariations for Book Exercises\n\n\\- \\*\\\
    *Advanced\\*\\*: Add sentiment scoring using TextBlob \n\n\\- \\*\\*Big Data\\\
    *\\*: Rewrite using PySpark for scalability \n\n\\- \\*\\*Ethics\\*\\*: Add anonymization\
    \ of usernames \n\n\\- \\*\\*Error Handling\\*\\*: Test edge cases (non-English\
