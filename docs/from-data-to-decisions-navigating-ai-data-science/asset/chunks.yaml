    ## 第一步：原始混乱状态——评估这头巨兽


    团队首先将爬取的数据加载到 CSV 文件中，包含 `post_id`、`text`、`likes`、`retweets`、`timestamp` 和 `sentiment`
    等列（其中一些已由众包人员预标记为“正面”、“负面”或“中性”）。使用 `Pandas` 初步揭示了几个问题：


    *   数据集包含 10,000 行，但 `likes` 列只有 9,200 个非空条目，表明有约 8% 的数据缺失。

    *   虽然 `text` 列看起来是完整的，但某些条目是垃圾信息，例如爬取失败产生的“404 error”。

    *   `retweets` 列显示的值范围从 0 到 50,000 不等，表明存在显著的异常值。

    *   总总数为 10,050，表明数据集中混入了重复项。

    *   `sentiment` 列包含了如“pos”、“Positive”和空格等变体，表明缺乏一致性。


    使用 `df.head()` 对数据集进行初步检查揭示了社交媒体文本的混乱本质，例如“Gr8 gadget!!”与“gadget sux”并列。显然，这个数据集需要进行大量的清理。


    ## 第二步：处理缺失值——填补漏洞


    首要任务是处理 `likes` 和 `retweets` 列中的缺失值，这些可能是由于 API 故障或私有帖子导致的。`sentiment` 列也有一些缺失条目。


    ### 点赞与转发


    删除 8% 的数据可能看起来很极端，特别是考虑到数据的价值。使用平均值填充这些漏洞可能会偏偏结果，特别是当几条病毒式帖子显著推高了平均值时。相反，位数是一个更安全的选择：


    ```

    df[''likes''].fillna(df[''likes''].median(), inplace=True)

    ```


    `likes` 的位数结果约为 12 左右。同样的方法应用于 `retweets`，其中位数为 5。通过 `df[''likes''].describe()`
    快速检查确保数据中没有极端的跳跃。


    ### 情感


    对于具有约 5% 缺失值的 `sentiment` 列，用“Unknown”填充这些漏洞可以保留数据集以备未来训练：


    ```

    df[''sentiment''].fillna(''Unknown'', inplace=True)

    ```


    这种方法允许模型保持可训练状态而不丢失贵的标签文本。


    ### 文本


    如“404 error”之类的条目不属于数据集，因此可以删除：


    ```

    df = df[df[''text''] != ''404 error'']

    ```


    在这些调整之后，团队仅丢失了 50 行，但保留了数据集的 99.5%，导致准确率从 60% 提高到 62%。


    ## 第三步：异常值——约束病毒式高峰


    数据集在 `retweets` 和 `likes` 列中存在极端值，例如 50,000 次转发或 20,000 个点赞。这些异常值可能会使情感模型偏向最大的用户。


    ### 发现异常值


    使用四分位距（IQR）方法，团队识别了异常值：


    ```

    Q1 = df[''retweets''].quantile(0.25)

    Q3 = df[''retweets''].quantile(0.75)

    IQR = Q3 - Q1

    outliers = df[(df[''retweets''] < Q1 - 1.5 * IQR) | (df[''retweets''] > Q3 + 1.5
    * IQR)]

    ```


    此分析标记了约 200 行（或 2%）为异常值。使用 `Seaborn` 创建的箱图证实了这些极端值的存在。


    ### 封顶异常值


    团队决定不是删除这些病毒式帖子，而是对其进行封顶。他们确定 `retweets` 的第 99 百位数约为 800，因此：


    ```

    df[''retweets''] = df[''retweets''].clip(upper=800)

    ```


    同样，`likes` 被封顶在 1,000。这种策略保留了病毒式帖子的信息，同时防止它们扭曲整体分析。


    ### 保留部分


    保留病毒式帖子至关重要，因为它们的情绪与其范围有关。在管理了异常值后，模型可以更好地关注大众情绪，将准确率从 62% 提高到 65%。


    ## 第四步：重复项——一字多声


    数据集增长到了 10,050 行，这存在重复项。相同的帖子会人为推高热度。


    ### 寻找重复项


    团队利用 `Pandas` 识别重复项：


    ```

    df.duplicated(subset=[''post_id''])

    ```


    这标记了 50 个重复项，然后将其删除：


    ```

    df.drop_duplicates(subset=[''post_id''], inplace=True)

    ```


    ### 文本副本


    有些帖子具有不同的 ID 但文本相同，由于转发出现了“Gr8 gadget!!”。团队使用：


    ```

    df.drop_duplicates(subset=[''text''], inplace=True)

    ```


    消除了另外 200 条。然而，团队必须确保没有删除合理的条目。


    ## 第五步：归一化与标准化——调整数字


    `likes` 和 `retweets` 列包含数值但尺度不同。团队必须决定是对这些值进行归一化还是标准化。


    ### 归一化


    为了将 `likes` 和 `retweets` 引入 0-1 范围，团队采用了归一化：


    ```

    df[''likes_norm''] = (df[''likes''] - df[''likes''].min()) / (df[''likes''].max()
    - df[''likes''].min())

    ```


    同样的方法应用于 `retweets`。这种调整确保了用于情感分析的神经网络能够平等地处理数据。


    ### 标准化


    或者，团队考虑标准化，这将数据移动到均值为 0、标准差为 1：


    ```

    df[''retweets_std''] = (df[''retweets''] - df[''retweets''].mean()) / df[''retweets''].std()

    ```


    这种方法对逻辑回归模型有益，因为它符合统计假设。


    ### 选择最佳方法


    最终，在运行模型测试后，他们发现归一化最适合这种特定的神经网络。然后他们删除了原始的 `likes` 和标准的 `retweets` 列，只保留归一化的版本。通过这些调整，尺度同步了，允许更有意义的见解。准确率从
    65% 提高到 68%。


    ## 第六步：类别编码——情感数字化


    `sentiment` 列包含各种标签，如“正面”、“负面”和“未知”。为了为 AI 准备数据，必须将其转换为数值。


    ### 修复混乱


    首先，团队标准化了 `sentiment` 标签：


    ```

    df[''sentiment''] = df[''sentiment''].str.lower().replace({''pos'': ''positive'',
    ''neg'': ''negative''})

    ```


    ### 热编码


    为了确保不暗示虚假的排名，他们选择了独热编码：


    ```

    df_encoded = pd.get_dummies(df[''sentiment''], prefix=''sent'')

    ```

    '
- fmt: '

    The one-hot encoded columns are then merged back into the original dataframe,
    and the old sentiment column is dropped:


    ```

    df = pd.concat([df, df_encoded], axis=1)

    df.drop(''sentiment'', axis=1, inplace=True)

    ```


    This method avoids the pitfalls of label encoding, which could incorrectly suggest
    a ranking among sentiments.


    ## Step 7: The Polished Product


    After all the cleaning and refinement, the team checks the dataset with `df.info()`
    and finds 9,800 rows with no null values. The text remains raw for future natural
    language processing (NLP) tasks, while `likes_norm` and `retweets_norm` fall within
    the 0-1 range, and `sentiment` is now one-hot encoded. A quick call to `df.describe()`
    reveals tight ranges without wild swings. The team runs their first model—a basic
    logistic regression—and sees an impressive jump in accuracy from 60% to 85% with
    the cleaned data.


    ## Lessons from the Trenches


    This case study highlights several important lessons in data cleaning:


    1. **Iterate**: Cleaning is not a one-time task; it requires testing fills, adjusting
    caps, and verifying duplicates repeatedly.

    2. **Balance**: Dropping only 2% of the data, rather than 20%, allows for retaining
    more valuable information while removing junk.

    3. **Fit the Model**: Understand the requirements of your AI model to choose between
    normalization and standardization, or between one-hot encoding and label encoding.

    4. **Tools**: Utilize libraries like `Pandas` and `Seaborn` to streamline the
    cleaning process.


