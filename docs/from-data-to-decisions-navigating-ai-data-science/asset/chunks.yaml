- fmt: '

    While dimensionality reduction compresses the dataset, feature selection allows
    you to retain the original columns while identifying the most valuable features.
    This process is akin to scouting a sports team, where the goal is to find the
    MVPs that drive your target outcome and discard the benchwarmers. By doing so,
    you preserve meaning, avoid unnecessary complexity, and lighten the load on your
    model.


    ### Filter Methods


    Filter methods assess features based on statistical measures, independent of the
    model being used. For instance, using the following code:


    ```python

    from sklearn.feature_selection import SelectKBest, f_classif


    selector = SelectKBest(score_func=f_classif, k=3)


    df_selected = selector.fit_transform(df, y)

    ```


    This method evaluates features against the target variable, allowing you to keep
    those with high scores. A sales AI might retain features like `price` and `quantity`
    while discarding `store_color` due to its low signal. Mutual information can also
    be employed to uncover nonlinear relationships, such as between text length and
    sentiment.


    ### Wrapper Methods


    Wrapper methods, on the other hand, are model-driven approaches that evaluate
    feature combinations. For instance:


    ```python

    from sklearn.feature_selection import RFE

    from sklearn.linear_model import LogisticRegression


    rfe = RFE(LogisticRegression(), n_features_to_select=5)


    df_rfe = rfe.fit_transform(df, y)

    ```


    This method iteratively tests combinations of features, ensuring that only the
    most impactful variables are retained. A health AI might reduce 20 metrics down
    to key variables like `BMI` and `age` while maintaining high accuracy.


    ### Embedded Methods


    Embedded methods integrate feature selection within the model training process.
    Lasso regression, for example, can shrink less important coefficients to zero:


    ```python

    from sklearn.linear_model import Lasso


    lasso = Lasso(alpha=0.01)


    lasso.fit(df, y)

    ```


    This method is elegant and automatic, allowing a retail AI to trim 15 features
    down to just seven, enhancing prediction accuracy by 8%.


    ### When to Use


    *   Filter Methods: Best for large datasets where speed is essential.

    *   Wrapper Methods: Ideal for smaller, critical datasets requiring precision.

    *   Embedded Methods: Suitable for regression tasks where feature selection can
    be seamlessly integrated.


    ### Real-World Example


    For instance, a traffic AI successfully filtered down to essential features such
    as `speed`, `hour`, and `weather` from a pool of ten columns, resulting in a 5%
    boost in accuracy without any slowdown.


    ### Try It


    To identify standout features, check:


    `selector.scores_`


    If the top three features stand out, keep them and discard the rest.


    ## Feature Creation: Forging New Gold


    Feature creation is where you can truly innovate, transforming raw data into new
    predictors that raw columns alone cannot provide. This process involves adding
    intelligence through mathematical operations, logical reasoning, and creative
    thinking. Here lies your opportunity to uncover hidden patterns by crafting new
    features.


    ### Ratios and Aggregates


    Combining existing features can yield powerful new insights. For example:


    ```python

    df[''likes_per_retweet''] = df[''likes''] / (df[''retweets''] + 1)  # Avoid divide-by-zero

    ```


    This feature gauges engagement depth beyond raw counts. Additionally, you can
    calculate daily averages to spot trends:


    ```python

    df[''daily_avg_likes''] = df.groupby(''date'')[''likes''].mean()

    ```


    An X AI discovered that likes per retweet revealed deep engagement patterns.

