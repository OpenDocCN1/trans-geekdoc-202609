    ```


    ### 正则化


    实施正则化技术有助于管理复杂度。例如，使用岭回归（Ridge regression）可以对过度复杂的模型进行惩罚：


    ```python

    from sklearn.linear_model import Ridge

    ridge = Ridge(alpha=1.0)

    ```


    ### 更多数据


    对抗过拟合的一种有效方法是增加数据集的大小。如果你当前的数据集仅包含 100 条帖子，考虑将其扩展到 10,000 条：


    ```python

    df = pd.concat([df, new_data])

    ```


    ### 交叉验证


    使用交叉验证有助于评估模型对新数据的泛化能力。这种技术提供了模型性能更可靠的估计：


    ```python

    from sklearn.model_selection import cross_val_score

    scores = cross_val_score(rf, X, y, cv=5)  # 折叠间的平均性能

    ```


    ## 数据清洗：平衡的基石


    在前章节中讨论的清洗技术——如删除空值、消除重复项和裁剪离群值——是你防止过拟合和欠拟合的第一道防线。


    ### 缺失值


    填充数据中的空白可以防止欠拟合。例如，如果点赞缺失，使用中位数有助于维持整体分布：


    ```python

    df.fillna(df.median())

    ```


    ### 异常值


    识别并限制异常值可以防止过拟合。例如，如果你有的推文超过了合理限制，裁剪这些值可以稳定你的模型：


    ```python

    df[''retweets''] = df[''retweets''].clip(upper=df[''retweets''].quantile(0.99))

    ```


    ### 重复项


    消除重复项确保模型从不同的示例而非冗余数据中学习，后者会偏差结果。


    ### 归一化


    归一化特征也可以提高模型性能。例如，你可以对点赞进行归一化，以提高神经网络的拟合度：


    ```python

    df[''likes_norm''] = (df[''likes''] - df[''likes''].min()) / (df[''likes''].max()
