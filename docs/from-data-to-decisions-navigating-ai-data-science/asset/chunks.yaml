  trans: '

    离群值是显著偏离数据集其他部分的数据点。例如，在一个平均销售额为 100 万的数据集中某笔交易，或者在平均销售额为 100 的数据中的某笔交易可能意味着重大事件或错误。虽然离群值有时能揭示关键洞察（如欺诈信号），但它们也会扭曲
    AI 的预测。以下是管理离群值的方法：


    1. **识别（Spot Them）**：使用统计指标识别离群值，例如超出三个标准差或超出四分位范围（`IQR`）的数值。在 `Pandas` 中，你可以计算
    `Q1` 和 `Q3` 来确定 `IQR`，并标记出落在此范围之外的点。箱线图等可视化工具也能帮助突出这些异常。


    2. **封顶（Cap Them）**：与其删除离群值，不如考虑对其数值进行封顶。例如，在第 99 百位数处设置上限。如果记录的车速为 300 英里小时（这不符合实际），你可以将其限制在
    120 英里小时。


    3. **删除（Drop Them）**：如果离群值明显是错误的——例如拼写错误或传感器故障——则应将其完全删除。例如，健康数据集中一个 7 英尺高的幼儿是不合逻辑的，应该被剔除。


    4. **保留（Keep Them）**：某些离群值对分析至关重要，特别是在欺诈检测或安全分析等领域。在这种情况下，对这些离群值进行单独标记以便进一步调查可能会有所益。


    例如，特斯拉的 AI 保留了关于避让坑洼的离群数据——尽管罕见，但这些事件对安全至关重要——并将传感器噪声限制在合理范围内。


    ## 重复：一个就够了


    重复数据会像双重订票一样扰乱你的数据集。例如，用户的 X 帖子被多次抓取，或者一个客户在两个不同的 ID 下记录，都会偏偏结果并困扰 AI 模型。以下是处理重复数据的方法：


    1. **查找（Find Them）**：`Pandas` 库提供了如 `df.duplicated()` 来识别重复项，以及 `df.drop_duplicates()`
    来删除重复项。你可以指定检查整行还是仅检查关键列，例如 `subset=[''user_id'']`。


    2. **检查上下文（Check Context）**：在删除重复项之前，确保它们确实是重复的。例如，如果销售额记录了两次，请验证时间戳或 ID 以确定其有效性。研究表明，约
    5% 的电子商务数据可能由合法的重复组成，因此要不要删除有效条目。


    3. **智能合并（Merge Smart）**：如果重复项的条略有不同（例如，“Jon”与“John”），考虑通过累加销售额或取平均评分来对它们进行聚合。使用
    `df.groupby(''name'').mean()` 可以帮助整合相似的条目。


    例如，一个电影推荐 AI 对同一用户对同一电影的 1,000 条 Netflix 评分进行了去重，在增强其推荐效果的同时，避免了基于重复评分者产生的结果偏差。


    ## 归一化与标准化：达成共识


    数据往往像巴别塔一样混乱，不同尺度的数字会导致困惑。例如，从 1 到 100 万的价格范围会复杂 AI 的计算。归一化和标准化有助于建立秩序：


    1. **归一化（Normalization）**：该技术将数据缩放到 0 到 1 的范围。在 `Pandas` 中，你可以使用公式 `(df - df.min())
    / (df.max() - df.min())` 实现此点。归一化对神经网络特别有利，因为它防止了较大的值主导学习过程。例如，一个对数值进行归一化的房价 AI
    允许在不同特征之间进行更好的比较。


    2. **标准化（Standardization）**：这种方法将数据平移至均值为 0、标准差为 1，公式为 `(df - df.mean()) / df.std()`。这种方法适用于假设正态分布的算法，如回归或支持向量机。例如，天气
    AI 可以标准化温度和风速数据，以确保对所有变量公平对待。


    3. **明智选择（Pick Wisely）**：考虑数据的上下文。对于图像，归一化（将像素值从 0-255 缩放到 0-1）通常是优的，而混合单位可能需要标准化。测试两种方法可以帮助你针对特定的特定数据集确定最佳方法。


    例如，一个对传感器流流（温度、压力和速度）进行标准化的 IoT AI，能够发现此前被原始数据尺度掩盖的模式。


    ## 类别数据编码：从文字到数字


    AI 系统对数字比对文本更熟悉。因此，类别数据——如颜色、城市或标签——必须进行编码：


    1. **标签编码（Label Encoding）**：这种技术将类别映射到整数（例如，`red=0`, `blue=1`）。虽然这种方法很快，但它暗示了一种可能并不顺序，因此适用于有序数据（例如如“低”、“中”、“高”等评分）。


    2. **独热编码（One-Hot Encoding）**：这种方法为每个类别创建二进制列（例如，`red=[1,0]`, `blue=[0,1]`）。在
    `Pandas` 中使用 `pd.get_dummies()` 可以在假设任何顺序的情况下进行有效编码。然而，如果类别很多，这种方法会导致列数大幅增加。


    3. **嵌入（Embeddings）**：一种高级的技术涉及使用 `Word2Vec` 等预训练模型将文本转换为稠密数值向量。这种方法允许情感分析 AI
    识别语义相似性，例如将“happy”和“joy”放在向量空间中接近的位置。


    例如，一个销售 AI 对其“区域”变量——北、南、东——进行独热编码，避免了暗示地区之间存在虚假排名，这有助于它更好地捕捉区域趋势。


    ## 收益


    预处理不是可选的；它是让 AI 有效运行的基石工作。例如，一个来自 X 的混乱数据集具有 20% 的缺失值、5% 的离群值和大量重复项，最初的准确率仅为 60%。在清洗和完善数据后，准确率跃升至
    85%。`Pandas`、`NumPy` 和 `scikit-learn` 工具是这一过程中不可或缺的伙伴（使用 `pip install pandas numpy
    scikit-learn` 安装它们）。


    在我们之后，我们将探索如何从这些数据中构建特征。现在，请花时间感谢治理混沌所付出的努力。尝试这个练习：获取一个 CSV 文件，应用 `df.dropna()`，并使用
    `df.describe()` 查看它是如何在你眼面前缩小的。

