    ## 延伸阅读


    ### Andrew Park 著《初学者数据科学》(Data Science for Beginners)

    推荐理由：这本书为初学者深入浅地介绍了数据清洗、探索性数据分析 (EDA) 和基础建模，是学习数据清洗和探索章节中涵盖概念的绝佳伴侣。

    重点：它强调了实现数据清洗基础知识的实际步骤，目标是在基础部分达到 88% 的 F1 分数。

    获取途径：可在亚马逊购买，价格 25 美元。


    ### Alice Zheng 和 Amanda Casari 著《机器学习特征工程》(Feature Engineering for Machine Learning)

    推荐理由：该资源通过真实案例，扩展了涵盖编码和缩放方法章节中讨论的特征构建技术。

    重点：它侧重于将原始数据转换为有价值的见解，提升你有效清洗和分析数据的能力。

    获取途径：可在 O’Reilly 购买，价格 40 美元。


    ### Andreas C. Müller 和 Sarah Guido 著《Python 机器学习入门》(Introduction to Machine Learning
    with Python)

    推荐理由：这本书在前面章节介绍的建模概念基础上，深入探讨了 `Scikit-Learn` 的使用，包括评估技术。

    重点：它为模型选择和数据清洗提供了实操指导，强化了实践技能。

    获取途径：可在 O’Reilly 购买，价格 50 美元。


    ### Martin Kleppmann 著《数据密集型应用设计》(Designing Data-Intensive Applications)

    推荐理由：这本书深入讨论了扩展性，重点关注数据流水线和部署策略。

    重点：它强调构建能够处理大型数据集（例如 1000 万行数据）的可靠系统。

    获取途径：可在 O’Reilly 购买，价格 60 美元。


    ### Michael Negnevitsky 著《人工智能：智能系统指南》(Artificial Intelligence: A Guide to Intelligent
    Systems)

    推荐理由：该资源探索了 AI 的新兴趋势，包括合成数据和联邦学习。

    重点：它关注 AI 的未来以及理解高级技术所需的基础概念。

    获取途径：可在 Pearson 购买，价格 70 美元。


    ### Solon Baracas, Moritz Hardt 和 Arvind Narayanan 著《公平性与机器学习》(Fairness and Machine
    Learning)

    推荐理由：这本书讨论了偏见缓解和可解释性，这与最后几个章节的讨论密切相关。

    重点：它深入探讨了机器学习的伦理以及 AI 系统中公平性的重要性。

    获取途径：可在 Pearson 购买，价格 70 美元。


