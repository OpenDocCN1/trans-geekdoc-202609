    医疗健康领域的极高，而数据的作用至关重要。发表在《柳叶刀》上的一项研究表明，与纯人工评估相比，`AI` 将假性阴性（漏诊）减少了 9% 以上。然而，重要的不仅仅是数据量；多样性也同样与。。来自各种机器的扫描结果，结合不同年龄和种族背景患者的数据，确保了
    `AI` 不会在狭窄的人口中过度专门。例如，当斯坦福大学训练一个 `AI` 检测皮肤癌时，它利用了涵盖 13 万张不同肤色的图像。如果没有这种广度，`AI`
    在评估数据集范围之外的患者时可能会失效。数据质量——以清晰的图像和准确的标注为特征——将 `AI` 变为救生命的工具，证明了在医学领域，良好的数据与技术丰富的医务人员一样关重要。


    ## Netflix 推荐引擎：猜猜你的下一个追剧


    你是否曾想过，Netflix 似乎能准确地知道你接下来想看什么？这不是魔法，而是一个数据驱动的过程。Netflix 的推荐引擎影响了观众 80% 以上观看选择，它依赖于其
    2.5 亿用户的丰富的用户数据，捕捉每一次点击、暂停、回放和评分。通过将元数据（如类型、演员和片长）与数百万账户的观看模式相结合，Netflix 可以做出极其准确的预测。


    2009 年，Netflix 甚至举办了一项 100 万美元的竞赛来改进其推荐算法，强调了数据在推进这些系统中的重要性。然而，真正的赢者不仅是代码，而是提供给参赛者的
    1 亿条评分的海量池。魔法在于数据如何封装人类口味的复杂细微差别。一个用户对浪漫喜剧的冷淡可能意味着另一个观众的必看之作。微妙的行为线索——如重看某个场景或在几分钟后放弃节目——告知
    `AI` 什么是能引起观众共鸣的。在这种背景下，质量同样至重要；对用户行为的持续跟踪和新鲜数据（最近的观看模式比去年的更重要）确保了推荐的关联性。如果没有持续的优质筛选信息流，即使是最复杂的算法也难以提供满意的结果。


    ## 天气预报：用数据驯服天空


    现在，让我们扩大视野到大气层。现代天气预报的准确性归功于 `AI` 对十年数据的处理，包括温度日志、风速、卫星图像和洋流。欧洲中期天气预报中心 (`ECMWF`)
    采用 `AI` 来完善其模型，利用数 PB 的历史天气数据，结合来自浮标、飞机和雷达的实时输入。2022 年，一个 `AI` 增强的系统与传统方法相比，预测误差减少了
    20%，实现了对风暴路径的早期检测。


    是什么导致了这种改进？数据的深度——跨越大陆和年份——使 `AI` 识别模式（例如厄尔尼诺的影响），而其及时性确保了它能跟上变化的气候状况。在这里，多样性是关键；将卫星图像与地面传感器数据相结合，提供了比依赖单一来源更全面的视角。数据质量——没有间隙的准确测量——确保了
    `AI` 不产生错误预测。这与 1950 年代形成了鲜明对比，当时天气预报是基于稀疏的读数和直觉。现在的数据流使 `AI` 能够充当预测水晶水晶，在每一次预报中拯救生命并保护作物。


    ## 共同的线索


    连接这些不同故事的是什么？数据不仅仅是配角；它是戏的主角。特斯拉的驾驶数据、医疗保健的诊断扫描、Netflix 的用户交互和天气日志都说明，当 `AI` 丰富、多样和高质量信息的滋养时，就会蓬勃发展。这些成功凸显了
    `AI` 的有效性并不取决于谁写了最令人深刻的代码，而是取决于谁收集了最好的原材料并将其精炼为非凡的东西。


    当你思考这些例子时，考虑一下你生活中的 `AI` 工具——也许 `Siri` 或 `Google Maps`。你认为什么数据驱动了这些系统？花点时间记录下想法；你已经开始揭开周围数据驱动世界的面纱了。


    # 第二章


    # 理解数据：类型、来源与挑战


    数据是人工智能 (`AI`) 的心跳，但它远非一个单一的实体。相反，它代表了一个多样且复杂的生态系统——混乱、活力且充满惊喜。如果上一章说明了数据为何驱动
    `AI` 革命，那么这一章将探索表面之下的东西。将自己想象成一个进入茂密丛林的探险家，那里的每一棵树、每条河流和每个生物都拥有自己独特的特征和怪癖。为了有效利用数据，必须理解它的各种形式——结构化、非结构化、时间序列和文本——以及它们的起源和可能出现的陷阱。让我们开启这段旅程，绘制数据地图，为你为你自己的
    `AI` 冒险做准备。


    ## 结构化 vs. 非结构化：有序与野性


    数据可以大致分为两大类：结构化数据和非结构化数据。结构化数据像一个严谨的学生，手里拿着一个装满彩色标签页、组织良好的文件夹。它存在于表格中——行和列——就像跟踪销售额的电子表格，详细列出了日期、产品、价格和数量等信息。数据库依赖这种数据而生存；其可预测性和组织性使其易于查询和分析。示例包括零售商的库存清单或银行的交易日志。`AI`
    在处理结构化数据执行预测库存水平或检测欺诈等任务时表现出色，因为清晰的界限能够识别出模式。


    相比之下，非结构化数据类似于一个拒绝遵守规则的叛逆兄弟。它涵盖我们每天遇到的各种形式的信息——照片、电子邮件和视频——这些信息无一个能整齐地放入表格。世界上大约
    80% 的数据属于这一类，代表了 `AI` 应用的金矿。例如，你手机的人脸识别系统依赖于非结构化图像数据，而解释你消息的聊天机器人处理非结构化文本。挑战在于管理非结构化数据的困难；由于没有固定结构，`AI`
    必须从内在的混乱中提取意义。


    结构化和非结构化数据之间的区别并不总是一目了然。例如，一条推特看起来是非结构化的——包含 280 个情感或幽默字符——但其附带的元数据（如时间戳和用户 ID）是结构化的。这种混合性质很常见，复杂的
    `AI` 系统通常整合两种类型的数据以获得全面的理解。


    ## 数据类型画廊


    除了结构化与非结构化的简单分类外，数据以各种形式出现，塑造了 `AI` 解析世界的方式。让我们探索一些关键数据类型：


    ### 时间序列：变化的脉动


