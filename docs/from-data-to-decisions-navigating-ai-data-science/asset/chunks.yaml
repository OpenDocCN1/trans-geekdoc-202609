  trans: '


    当您准备扩大规模时，请专注于如何根据模型提供的洞察来做出明智的决策。下一章将探索如何有效地实施这些决策，确保可靠的洞察转化为切实的成果。


    # 案例研究：AI 在金融、医疗和自动系统中的应用


    当您的 AI 模型生成了令人惊叹的预测时——例如情感分析的 88% F1 分数、销售预测的 $20 平均绝对误差 (MAE)以及以及交通碰撞风险的 95%
    回回率——关键问题仍然是：它是否在现实世界中带来了切实的结果？将这些模型输出转化为可操作的决策不仅仅是一项学术练习；它影响着现实生活的结果，例如财务节省、改善患者护理以及增强道路安全。本次探索重点关注三个关键领域——金融、医疗和自动系统，AI
    在这些领域有效地将数据转化为有意义的行动。每个案例研究都说明了从混乱数据到精炼模型的历程，展示了可以实现的巨大收益。


    ## 案例研究 1：金融领域的 AI——欺诈检测


    ### 场景

    一家银行每年处理 100 亿笔交易，但面临 5000 万美元的欺诈损失。主要目标是识别欺诈交易并减少浪费，从而将欺诈 (1) 的预测转化为审计，并将安全 (0)
    的预测转化为无缝运营。


    ### 数据

    原始数据包含 1000 万笔交易，结构如下：


    ```python

    df = pd.DataFrame({''amount'': [100, 50, ...], ''time'': [...], ''merchant'':
    [...], ''card_id'': [...]})

    ```


    这些数据面临挑战，包括金额字段中 5% 的缺失值、异常值和重复项。清洗过程涉及：

    * 删除缺失金额

    * 截断以上的异常值

    * 消除重复


    清洗后，数据集包含 980 万行，准备好分析。


    ### 特征与 EDA

    特征工程引入了价值变量，例如：


    ```python

    df[''amount_per_hour''] = df[''amount''] / (df[''time''].dt.hour + 1)

    is_night = df[''time''].dt.hour > 18

    ```


    探索性数据分析 (EDA) 揭示了关键洞察，例如金额与是否在夜间发生交易之间的 0.6 相关性，这指示了更高的欺诈可能性。


    ### 模型

    采用随机森林分类器分析数据：


    ```python

    from sklearn.ensemble import RandomForestClassifier

    rf = RandomForestClassifier(max_depth=10)

    rf.fit(X, y)

    ```


    该模型实现了 95% 的 F1 分数，跨折验证平均分值为 94%。


    ### 转化

    模型的输出概率指导运营决策：


    ```python

    proba = rf.predict_proba(X)[:, 1]

    ```


    如果概率超过 0.9，则触发审计，而较低的概率则导致约 10,000 笔标记交易。


    ### 收益

    在实施 AI 解决方案之前，该银行遭受了 5000 万美元的损失。实施后，这一数字下降到 500 万美元，损失减少了 90%，每年节省 4500 万美元。


    ### 教训

    此案例强调了欺诈检测中精确度的重要性，因为误报的代价是昂贵的。


    ## 案例研究 2：医疗领域的 AI——疾病诊断


    ### 场景

    一家拥有 10 万名患者基础的医院旨在识别糖尿病的早期迹象，将疾病 (1) 的预测转化为必要的检测，并将健康 (0) 的预测转化为持续监测。


    ### 数据

    数据集包括：


    ```python

    df = pd.DataFrame({''age'': [30, 65, ...], ''bmi'': [25, 35, ...], ''glucose'':
    [...], ''bp'': [...]})

    ```


    挑战包括 10% 的 BMI 缺失值和 500 个血糖水平异常值。清洗过程涉及填充缺失值和截断异常值。


    ### 特征与 EDA

    特征工程创建了有用的分类：


    ```python

    df[''bmi_bin''] = pd.cut(df[''bmi''], bins=[0, 25, 30, float(''inf'')], labels=[''normal'',
    ''over'', ''obese''])

    df[''risk_score''] = df[''glucose''] + df[''bp'']

    ```


    EDA 显示了显著模式，例如血糖水平与糖尿病之间的 0.7 相关性。


    ### 模型

    训练逻辑回归模型：


    ```python

    from sklearn.linear_model import LogisticRegression

    lr = LogisticRegression()

    lr.fit(X, y)

    ```


    该模型实现了 90% 的回回率和 89% 的平均交叉得分。


    ### 转化

    模型的概率输出指导临床行动：


    ```python

    proba = lr.predict_proba(X)[:, 1]

    ```


    如果概率超过 0.8，则为患者安排检查，而较低的概率提示监测。


    ### 收益

    实施 AI 之前，该医院漏掉了 20% 的糖尿病病例。实施后，这一数字下降到 5%，导致了 5000 例早期诊断并显著改善了患者结果。


    ### 教训

    此案例强调了医疗领域回回率的重要性，因为漏诊可能会导致严重后果。EDA 揭示了指导诊断过程的关键洞察。


    ## 案例研究 3：自动系统中的 AI——碰撞避免


    ### 场景

    Tesla 旨在通过 AI 将动作转化为安全操作，降低碰撞率以提高安全性。


    ### 数据

    数据集包含百万英里的传感器数据，包括：


    ```python

    df = pd.DataFrame({''speed'': [30, 60, ...], ''distance'': [...], ''angle'': [...],
    ''time'': [...]})

    ```


    数据清洗解决了距离中 1% 的缺口和速度中的异常值。


    ### 特征与 EDA

    特征工程结果为：


    ```python

    df[''speed_change''] = df[''speed''].diff()

    df[''distance_to_obstacle''] = df[''distance''] / (df[''speed''] + 1)

    ```


    EDA 识别了风险信号，展示了指导驾驶策略的相关性。


    ### 模型

    采用强化学习 (RL) 来训练模型：


    ```python

    from tensorflow.keras import Sequential

    from rl.agents import DQNAgent

    ```


    模型通过奖励进行学习，随着时间的推移实现了 95% 的安全率。


    ### 转化

    实时输出指导车辆动作：


