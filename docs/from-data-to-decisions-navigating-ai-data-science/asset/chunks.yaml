    ### 非线性关联


    对于缺乏直接线性连接的关系（例如文本长度与情感之间的 Spearman 相关系数为 0.6），更灵活的模型（如决策树或神经网络）会更合适。例如，一个 X 情感
    AI 从线性模型转变为决策树方法，将准确率从 75% 提高到 88%。


    ### 簇


    当 EDA 揭示出簇的存在时（如对矩阵图所示），可以使用 `K-means` 等聚类算法对相似的观测值进行分组。例如，一个交通 AI 使用聚类来识别速度区域，导致了基于碰撞风险的安全区域开发。


    ### 时间序列数据


