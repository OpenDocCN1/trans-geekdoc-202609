    \ K 折交叉验证：平衡天平\n\n虽然 K 折有效，但在处理类别分布不均匀的不平衡数据集时可能会力不从心。分层 K 折通过确保每一折都保持与整体数据集相同的类别比例来解决这个问题。\n\
    \n### 工作原理\n\n要实现分层 K 折交叉，你可以执行以下操作：\n\n```python\nfrom sklearn.model_selection\
