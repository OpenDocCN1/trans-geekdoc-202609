- fmt: '

    1. **Drop the Dead Weight**: If a row in your dataset is largely empty, it may
    be best to remove it entirely. In `pandas`, you can use the command `df.dropna()`
    to eliminate any rows with missing values. However, this approach should be used
    cautiously; dropping too many rows can starve your model of essential information.
    For instance, a retailer that eliminated 10% of its sparse sales logs found its
    predictive capabilities diminished.


    2. **Fill with Basics**: For numerical data, simple statistics can serve as effective
    fillers. The mean or median can be computed to replace missing values (e.g., `df.fillna(df.mean())`
    or `df.fillna(df.median())`). For categorical data, using “Unknown” or the mode
    (the most frequently occurring value) can help maintain dataset integrity. A weather
    prediction AI, for example, filled in missing rainfall data with daily medians,
    which worked well for trend analysis.


    3. **Interpolate for Flow**: Interpolation is particularly useful for time-series
    data. If a timestamped entry is missing, you can estimate its value by connecting
    the surrounding data points. For instance, if a stock price is missing for 2 p.m.,
    you can use `df.interpolate(method=''linear'')` to bridge the gap. This technique
    is most effective for ordered data rather than random gaps.


    4. **Predict the Missing**: For more complex scenarios, you can train a small
    AI model to predict missing values based on existing data. For example, the `KNNImputer`
    from `sklearn` can estimate missing prices in a housing dataset by analyzing nearby
    properties'' attributes. While this method is computationally intensive, it can
    yield significant benefits for critical gaps. A healthcare AI, for instance, used
    this approach to predict missing blood pressure readings, leading to improved
    accuracy.


    In a real-world example, an X sentiment dataset faced 15% missing values in its
    “retweets” field. Instead of dropping these entries, the team filled in the gaps
    with median values, preserving the dataset''s overall integrity without distorting
    the sentiment analysis.


    ## Outliers: Reining in the Rebels


    Outliers are the data points that stand apart from the rest, often indicating
    anomalies or exceptional cases. For instance, a 10,000 sale in a dataset where
    the average transaction is 10, or a recorded temperature of minus 20°C in July
    are clear outliers. While some outliers may represent genuine occurrences (such
    as a jackpot sale), others may signal errors (like a typographical mistake). AI
    systems can be sensitive to outliers, which can distort models and inflate error
    rates. Here’s how to manage outliers effectively:


    1. **Spot the Oddballs**: Statistical techniques can help identify outliers. Data
    points that fall beyond three standard deviations from the mean may be flagged
    as suspicious (e.g., `df[df > df.mean() + 3*df.std()]`). Alternatively, you can
    use the interquartile range (IQR) method to determine outliers by calculating
    `Q1` and `Q3` and identifying values that fall outside the range of `Q1 - 1.5IQR`
    to `Q3 + 1.5IQR`.


    2. **Cap the Craze**: Instead of completely removing outliers, consider capping
    their values to maintain dataset integrity. For example, you might set a ceiling
    at the 99th percentile (e.g., `df[''price''].clip(upper=0.99)`).


    3. **Drop the Junk**: If an outlier is clearly erroneous, it may be better to
    remove it. In `pandas`, you can filter the dataframe using a condition (e.g.,
    `df[df < threshold]`).


    4. **Embrace the Edge**: Sometimes outliers are valid and important. In these
    cases, removing them could lead to a loss of critical information.


    ## Duplicates: One Enough


    Duplicates clutter your dataset and can inflate counts. To manage them effectively:


    1. **Hunt the Clones**: Statistical techniques can help identify duplicates. You
    can use `df.duplicated()` to flag duplicates and `df.drop_duplicates()` to remove
    them.


    2. **Double-Check Reality**: Not all duplicates are errors. Before removing, verify
    if they represent legitimate entries (e.g., `df.drop_duplicates(subset=[''user_id''])`).


    3. **Merge the Mess**: When dealing with near-duplicates, you might aggregate
    data. You can group the data and compute totals or averages (e.g., `df.groupby(''name'').sum()`).

