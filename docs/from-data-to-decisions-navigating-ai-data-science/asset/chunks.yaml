    # GLOSSARY: From Data to Decisions: Navigating AI Data Science


    ## A


    Accuracy: The percentage of correct predictions made by a model. Calculated using
    `accuracy_score(y_test, y_pred)`, it is particularly high for balanced data but
    can be misleading in imbalanced datasets.


    AI (Artificial Intelligence): Systems that mimic human intelligence, utilized
    in various applications including sentiment analysis and predictions.


    Anomaly Detection: The process of identifying outliers in data, often implemented
    via methods like `IsolationForest()`.


    ## B


    Bias Mitigation: Techniques aimed at reducing unfairness in predictions, such
    as using `smote.fit_resample()` to balance datasets.


    Binary Encoding: A method for encoding categorical variables into binary format,
    reducing dataset bloat.


    ## C


    Classification: The task of predicting categorical labels, exemplified by functions
    like `rf.predict(X)`.


    Cross-Validation (CV): A technique used to assess the robustness of a model by
    splitting the data, typically implemented using `cross_val_score()`.


    Clustering: The method of grouping data points without pre-defined labels, often
    using algorithms like `KMeans(n_clusters=3)`.


    ## D


    Data Cleaning: The process of preparing raw data for analysis, commonly involving
    methods like `df.dropna()` to remove missing values.


    Data Pipeline: The workflow involving Extract, Transform, Load (ETL) processes
    to manage data flow effectively.


    Deployment: The act of launching machine learning models into production, often
    using containerization tools like `Docker`.


    ## E


    ETL (Extract, Transform, Load): A data workflow process that involves extracting
    data from sources, transforming it into a desired format, and loading it into
    a destination database.


    Evaluation Metrics: Quantitative measures used to assess the performance of a
    model, including metrics like `f1_score()`.


    Explainability: The ability to understand and interpret model predictions, often
    enhanced through techniques like `SHAP values`.


    ## F


    Feature Engineering: The process of creating new input features from raw data
    to improve model performance.


    Federated Learning: A decentralized approach to training models across multiple
    devices while keeping data localized.


    F1 Score: A metric that combines precision and recall into a single measure, calculated
    using `f1_score(y_test, y_pred)`.


    ## G


    GAN (Generative Adversarial Network): A type of neural network used to generate
    synthetic data through a competitive process between two networks.


    ## H


    Hyperparameters: Configuration settings used to control the training process of
    machine learning algorithms.


    ## I


    Iteration: The process of refining models through repetitive training and testing
    to achieve better performance.


    ## K


    Kubernetes (K8s): An open-source platform for automating the deployment, scaling,
    and management of containerized applications.


    ## L


    Label Encoding: A method of converting categorical labels into integer format
    for use in machine learning models.


    ## M


    MAE (Mean Absolute Error): The average of absolute differences between predicted
    and actual values, commonly used in regression analysis.


    Model: An algorithm or mathematical representation used to make predictions based
    on input data.


    ## N


    Normalization: The process of scaling data to a specific range, typically `[0,
    1]`, to ensure that features contribute equally to the analysis.


    ## O


    One-Hot Encoding: A technique for converting categorical variables into a format
    that can be provided to machine learning algorithms.


    Overfitting: A modeling error that occurs when a model learns noise in the training
    data to the detriment of its performance on unseen data.


    ## P


    Precision: The ratio of true positive predictions to the total number of positive
    predictions, measured using `precision_score()`.


    ## Q


    Quantum Computing: A revolutionary computing paradigm that leverages quantum mechanics
    to process information more efficiently than classical computers.


    ## R


    Recall: The measure of a model''s ability to capture all relevant instances, calculated
    using `recall_score()`.


    Regression: A type of predictive modeling technique that estimates relationships
    among variables, typically used for continuous outcomes.


    ## S


    Scaling: The process of adjusting the size of a model or dataset to ensure efficient
    processing and deployment.


    SHAP: A method for interpreting predictions by providing insights into the contribution
    of each feature, calculated via `shap.TreeExplainer()`.


    Synthetic Data: Data generated artificially rather than obtained from real-world
    events, often created using models like `GANs`.


    ## T


    Time-Series Split: A cross-validation method specifically designed for time-series
    data, ensuring that past data is used to predict future data.


    ## U


    Underfitting: A modeling issue that occurs when a model is too simple to capture
    the underlying structure of the data.


