    # A Concise Guide to Pandas (Python)


    ## Getting Started


    Installation: Begin by installing the necessary package with the command:


    ```bash

    pip install pandas

    ```


    This step is crucial for setting up your data analysis environment.


    Importing the Library: Import the library into your script:


    ```python

    import pandas as pd

    ```


    This will serve as the foundation for your data manipulation tasks.


    Loading Data:


    *   From CSV: Load data from a CSV file using:


    ```python

    df = pd.read_csv(''x_posts.csv'')

    ```


    This allows you to explore the dataset with commands like `sns.histplot(df[''likes''])`.


    *   From SQL: If your data resides in a database, use:


    ```python

    df = pd.read_sql(''SELECT * FROM sales'', conn)

    ```


    This approach is useful for accessing structured data directly from SQL databases.


    ## Core Data Structures


    *   DataFrame: A two-dimensional table structure in pandas. Create one with:


    ```python

    df = pd.DataFrame({''likes'': [10, 20], ''text'': [''hi'', ''wow'']})

    ```


    Use `df.head()` to view the first few entries.


    *   Series: A one-dimensional labeled array. Access it like this:


    ```python

    s = df[''likes'']

    ```


    Calculate the mean with `s.mean()` and clean it using `s.dropna()`.


    ## Data Cleaning


    *   Drop NaN Values: Remove rows containing NaN values:


    ```python

    df.dropna()

    ```


    For specific columns, use:


    ```python

    df.dropna(subset=[''likes''])

    ```


    *   Fill NaN Values: Replace NaN values with the median:


    ```python

    df[''retweets''].fillna(df[''retweets''].median())

    ```


    For sales data, you can fill missing prices with zero:


    ```python

    df[''price''].fillna(0)

    ```


    *   Remove Duplicates: Eliminate duplicate rows from the DataFrame:


    ```python

    df.drop_duplicates()

    ```


    For specific keys, use:


    ```python

    df.drop_duplicates(subset=[''id''])

    ```


    *   Clip Outliers: Cap extreme values to reduce their impact:


    ```python

    df[''likes''].clip(upper=df[''likes''].quantile(0.99))

    ```


    *   Replace Values: Substitute specific values in a column:


    ```python

    df[''sentiment''].replace({''pos'': ''positive''})

    ```


    ## Feature Engineering


    *   Creating a New Column: Calculate net sentiment:


    ```python

    df[''net_sentiment''] = df[''text''].str.count(''love'') - df[''text''].str.count(''hate'')

    ```


