    ## Techniques to Avoid Overfitting


    Overfitting can occur when a model is too complex for the size of your dataset,
    leading to a focus on noise rather than meaningful patterns. Here’s how to mitigate
    this risk:


    ### Simplify the Model


    If you notice that a complex model (e.g., a random forest with 500 trees) achieves
    a training accuracy of 99% but only 60% on the test set, it’s time to simplify:


    ```

    rf = RandomForestClassifier(n_estimators=100, max_depth=10)

    ```


    ### Regularization


    Implementing regularization techniques can help manage complexity. For example,
    using Ridge regression can penalize overly complex models:


    ```python

    from sklearn.linear_model import Ridge

    ridge = Ridge(alpha=1.0)

    ```


    ### More Data


    One effective way to combat overfitting is by increasing the dataset size. If
    your current dataset comprises only 100 posts, consider augmenting it to 10,000:


    ```python

    df = pd.concat([df, new_data])

    ```


    ### Cross-Validation


    Using cross-validation helps assess how well your model generalizes to new data.
    This technique provides a more reliable estimate of model performance:


    ```python

    from sklearn.model_selection import cross_val_score

    scores = cross_val_score(rf, X, y, cv=5)  # Average performance across folds

    ```


    ## Clean Data: The Bedrock of Balance


    The cleaning techniques discussed in previous chapters—like removing null values,
    eliminating duplicates, and clipping outliers—are your first line of defense against
    both overfitting and underfitting.


    ### Missing Values


    Filling gaps in your data can prevent underfitting. For instance, if likes are
    missing, using the median can help maintain the overall distribution:


    ```python

    df.fillna(df.median())

    ```


    ### Outliers


    Identifying and capping outliers can prevent overfitting. For example, if you
    have retweets that exceed reasonable limits, clipping those values can stabilize
    your model:


    ```python

    df[''retweets''] = df[''retweets''].clip(upper=df[''retweets''].quantile(0.99))

    ```


    ### Duplicates


    Eliminating duplicates ensures the model learns from distinct examples rather
    than redundant data, which can skew results.


    ### Normalization


    Normalizing features can also enhance model performance. For example, you can
    normalize likes to improve the fit for neural networks:


    ```python

    df[''likes_norm''] = (df[''likes''] - df[''likes''].min()) / (df[''likes''].max()
    - df[''likes''].min())

    ```


