    # Case Study: Cleaning a Messy Dataset—Social Media Sentiment Data


    In the world of data science, having the right tools to handle gaps, tame outliers,
    and fine-tune scales is essential, but understanding how these techniques apply
    in real-world scenarios is equally crucial. Let’s dive into a practical case study
    involving a dataset of X posts used for sentiment analysis. Imagine an AI startup
    aiming to gauge public sentiment regarding a new gadget launch. To accomplish
    this, they scraped 10,000 posts tagged with `#GadgetX` from X’s API and web searches.
    However, the raw dataset is chaotic, filled with typos, missing values, duplicates,
    and a confusing mix of numbers and text. If left unprocessed, their sentiment
    model might achieve a dismal accuracy of just 60%. In this essay, we will clean
    the dataset step-by-step, transforming it into a refined version that achieves
    over 85% accuracy.


    ## Step 1: The Raw Mess—Sizing Up the Beast


    The team begins by loading their scraped data into a CSV file, which includes
    columns such as `post_id`, `text`, `likes`, `retweets`, `timestamp`, and `sentiment`
    (some of which have been pre-labeled as “positive,” “negative,” or “neutral” by
    crowd workers). A preliminary examination using `Pandas` reveals several issues:


    *   The dataset contains 10,000 rows, but the `likes` column has only 9,200 non-null
    entries, indicating about 8% missing data.

    *   While the `text` column appears full, some entries are junk, such as “404
    error” from failed scrapes.

    *   The `retweets` column shows values ranging from 0 to 50,000, indicating significant
    outliers.

    *   The total count of rows is 10,050, suggesting that duplicates have crept into
    the dataset.

    *   The `sentiment` column includes variations such as “pos,” “Positive,” and
    blanks, indicating a lack of consistency.


    The initial inspection of the dataset using `df.head()` reveals the chaotic nature
    of social media text, with entries like “Gr8 gadget!!” placed next to “gadget
    sux.” Clearly, this dataset needs significant cleaning.


    ## Step 2: Handling Missing Values—Plugging the Gaps


    The first order of business is to address the missing values in the `likes` and
    `retweets` columns, which could result from API hiccups or private posts. The
    `sentiment` column also has some missing entries.


    ### Likes and Retweets


    Dropping 8% of the data may seem extreme, especially considering the value of
    the data. Using the mean to fill these gaps could skew the results, particularly
    if a few viral posts significantly inflate the average. Instead, the median serves
    as a safer option:


    ```

    df[''likes''].fillna(df[''likes''].median(), inplace=True)

    ```


    The median for `likes` turns out to be around 12. The same approach is applied
    to `retweets`, which have a median of 5. A quick check with `df[''likes''].describe()`
    ensures that there are no extreme jumps in the data.


    ### Sentiment


    For the `sentiment` column, which has around 5% missing values, filling these
    gaps with “Unknown” preserves the dataset for future training:


    ```

    df[''sentiment''].fillna(''Unknown'', inplace=True)

    ```


    This approach allows the model to remain trainable without losing valuable labeled
    text.


    ### Text


    Entries like “404 error” do not belong in the dataset, so these can be removed:


    ```

    df = df[df[''text''] != ''404 error'']

    ```


    After these adjustments, the team loses only 50 rows but retains 99.5% of the
    dataset, leading to a slight increase in accuracy from 60% to 62%.


    ## Step 3: Outliers—Reining in the Viral Spikes


    The dataset features extreme values in the `retweets` and `likes` columns, such
    as 50,000 retweets or 20,000 likes. These outliers can skew the sentiment model
    toward the most vocal users.


    ### Spotting Outliers


    Using the interquartile range (IQR) method, the team identifies outliers:


    ```

    Q1 = df[''retweets''].quantile(0.25)

    Q3 = df[''retweets''].quantile(0.75)

    IQR = Q3 - Q1

    outliers = df[(df[''retweets''] < Q1 - 1.5 * IQR) | (df[''retweets''] > Q3 + 1.5
    * IQR)]

    ```


    This analysis flags about 200 rows, or 2%, as outliers. A box plot created with
    `Seaborn` confirms the presence of these extreme values.


    ### Capping Outliers


    Rather than dropping these viral posts, the team decides to cap their values.
    They determine that the 99th percentile for `retweets` is around 800, thus:


    ```

    df[''retweets''] = df[''retweets''].clip(upper=800)

    ```


    Likewise, `likes` are capped at 1,000. This strategy preserves the information
    from viral posts while preventing them from distorting the overall analysis.


    ### Keeping Some


    It’s crucial to retain the viral posts since their sentiment is tied to their
    reach. With the outliers managed, the model can better focus on the general crowd
    sentiment, increasing accuracy from 62% to 65%.


    ## Step 4: Duplicates—One Post, One Voice


    The dataset has grown to 10,050 rows, which suggests that duplicates exist. Having
    the same post repeated can artificially inflate popularity.


    ### Hunting Duplicates


    The team employs `Pandas` to identify duplicates:


    ```

    df.duplicated(subset=[''post_id''])

    ```


    This flags 50 duplicates, which are then removed:


    ```

    df.drop_duplicates(subset=[''post_id''], inplace=True)

    ```


    ### Text Twins


    Some posts have different IDs but identical text, such as “Gr8 gadget!!” appearing
    twice due to retweets. The team uses:


    ```

    df.drop_duplicates(subset=[''text''], inplace=True)

    ```


    to eliminate another 200 entries. However, the team must ensure they are not removing
    legitimate entries.


    ## Step 5: Normalization and Standardization—Tuning Numbers


    The `likes` and `retweets` columns contain numeric data but are on different scales.
    The team must decide whether to normalize or standardize these values.


    ### Normalization


    To bring `likes` and `retweets` into a 0-1 range, the team applies normalization:


    ```

    df[''likes_norm''] = (df[''likes''] - df[''likes''].min()) / (df[''likes''].max()
    - df[''likes''].min())

    ```


    The same method is applied to `retweets`. This adjustment ensures that the neural
    network for sentiment analysis can process the data on equal footing.


    ### Standardization


    Alternatively, the team considers standardization, which would shift the data
    to have a mean of 0 and a standard deviation of 1:


    ```

    df[''retweets_std''] = (df[''retweets''] - df[''retweets''].mean()) / df[''retweets''].std()

    ```


    This method is beneficial for logistic regression models, as it aligns statistical
    assumptions.


    ### Picking the Best Approach


    Ultimately, after running model trials, they find that normalization fits best
    for this particular neural network. They then drop the original `likes` and standardized
    `retweets` columns, keeping only the normalized versions. With these adjustments,
    the scales sync, allowing for more meaningful insights. The accuracy improves
    from 65% to 68%.


    ## Step 6: Encoding Categorical Data—Sentiment Speaks Numbers


    The `sentiment` column contains various labels, such as “positive,” “negative,”
    and “Unknown.” To prepare this data for AI, it must be converted to numeric values.


    ### Fixing the Mess


    First, the team standardizes the `sentiment` labels:


    ```

    df[''sentiment''] = df[''sentiment''].str.lower().replace({''pos'': ''positive'',
    ''neg'': ''negative''})

    ```


    ### One-Hot Encoding


    To ensure no false rankings are implied, they opt for one-hot encoding:


    ```

    df_encoded = pd.get_dummies(df[''sentiment''], prefix=''sent'')

    ```

