    # 揭示模式和异常的统计方法


    虽然 Matplotlib 散点图和 Seaborn 热图等视觉效果说明了数据趋势，但底层的数字揭示了更深层的故事。数据就像拼图，而统计方法则是放大镜，帮助发现趋势、关系和离群值。在对数据集进行清洗和工程处理后，是时候深入数据以识别其节奏和异常。在本节中，我们将利用各种统计度量——中心趋势、离散度、相关性和异常检测——来发现模式并突出任何不规则之处。这不仅仅是枯燥的数学；它是你数据的跳动，为你的
    AI 应对挑战做好准备。让我们研究统计分析的复杂性。


    ## 中心趋势：寻找心跳


    理解你的数据“住在”何处至关重要，中心趋势度量——平均值、中位数和众数——帮助确定这一中心，为解释提供基准。


    ### 平均值


    平均值提供了平均数值，通过对所有点赞求和并除以总数来计算：


    ```python

    mean_likes = df[''likes''].mean()

    ```


    虽然它提供了一个快速快照——例如 X 帖子平均有 50 个赞——但它可能会受到极端值的影响，例如一个获得 50,000 个赞的病毒帖子可能会将平均值推高到
    200。这种敏感性可能会误导解释，特别是在具有显著离群值的数据集中。


    ### 中位数


    中位数代表中间值，有效地将数据集分成两个等份：


    ```python

    median_likes = df[''likes''].median()

    ```


    例如，如果中位数是 12 个赞，它将不受极端离群值的影响，提供了一个更可靠的中心趋势度量。在流量数据中，中位数速度 30 mph 比平均速度 45 mph
    揭示了更多情况，后者可能会被高速异常值偏偏。


    ### 众数


    众数识别出现频率最高的值，这对于分类数据特别有用：


    ```python

    mode_sentiment = df[''sentiment''].mode()

    ```


    例如，如果“积极”是情感分析中的众数，它表明积极情绪是数据集中常见的类型。


    ### 为什么它很重要


    理解这些度量允许你捕捉数据的本质。例如，在健康 AI 中，28 的平均体质量指数（BMI）可能会掩盖由中位数 25 和众数 24 所示的更健康群体。


    ### 尝试一下


    要探索这些概念，请运行以下代码：


    ```python

    print(df[''likes''].mean(), df[''likes''].median())

    ```


    这将帮助你确定哪种度量讲述了更准确的故事。


    ## 离散度：衡量分布范围


    中心趋势提供了一个单点，而离散度度量帮助你理解数据围绕该点的分散程度。


    ### 极差


    极差通过最大值减去最小值计算得出：


    ```python

    range_retweets = df[''retweets''].max() - df[''retweets''].min()

    ```


    例如，如果转发范围从 0 到 50,000，它突出了某些帖子的广泛覆盖范围。在销售数据中，5 到 10,000 的价格范围可以指示奢侈品与预算产品之间的区别。


    ### 方差


    方差量化了离平均值的平均平方偏差：


    ```python

    variance_likes = df[''likes''].var()

    ```


    高方差表示数据点分布广泛，而低方差表明它们紧密聚集在平均值周围。


    ### 标准差


    标准差是方差的平方根，提供了一个更具解释性的分布度量：


    ```python

    std_likes = df[''likes''].std()

    ```


    例如，如果点赞的标准差为 100，则表明大多数帖子通常接收 20 到 40 个赞。


    ### 四分位数和 IQR


    四分位距（IQR）提供了对数据中间 50% 的洞察：


    ```python

    Q1 = df[''retweets''].quantile(0.25)

    Q3 = df[''retweets''].quantile(0.75)

    IQR = Q3 - Q1

    ```


    使用 `IQR`，你可以识别超出 1.5 倍 `IQR` 的异常值。


    ### 为什么它很重要


    理解分布有助于识别预测性与混沌。例如，价格低标准差可能会忽略高价商品，而转发的高标准差可以指示病毒式增长。


    ### 尝试一下


    要衡量数据的分布，你可能会运行：


    ```python

    df[''speed''].std(), df[''speed''].quantile([0.25, 0.75])

    ```


    这将揭示数据有多多样。


    ## 相关性：发现关系


    相关性衡量变量之间的关系，帮助你判断它们是否同步。


    ### 皮逊相关性


    皮逊相关系数评估两个连续变量之间的线性关系：


    ```python

    pearson_corr = df[''likes''].corr(df[''retweets''])

    ```


    接近 1 表示强正相关，接近 -1 表示强负相关。例如，点赞和转发之间 0.9 的相关性表明它们紧密相关。


    ### 斯尔曼相关性


    斯尔曼相关性衡量两个变量之间的关系在多大程度上可以用单调函数描述：


    ```python

    spearman_corr = df[''likes''].corr(df[''retweets''], method=''spearman'')

    ```


    这种方法对于识别非线性关系非常有用，可以捕捉更复杂的模式。


    ### 互信息


    互信息量化通过另一个变量获得变量的信息，对于分类数据特别有用：


    ```python

    from sklearn.feature_selection import mutual_info_classif

    mutual_info = mutual_info_classif(df[''likes''], df[''sentiment''])

    ```


    这种方法可以发现其他方法可能会忽略的非线性关系。


    ### 为什么它很重要


    高相关性可能意味着冗余，而低相关性意味着独立。例如，如果销售 AI 观察到价格与销量之间存在负相关，表明折扣驱动了销量。


    ### 尝试一下


    要检查数据中的关系，运行：


    ```python

    df.corr().loc[''likes'', ''retweets'']

    ```


    这将帮助你确定这些变量是朋友还是陌生人。


    ## 异常检测：标记异类


    异常是数据集中的反叛者——离群值可能预示着宝贵的洞察，也可能是隐藏的陷阱。


    '
