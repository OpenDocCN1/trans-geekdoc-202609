    \ = np.zeros(5)`  # 输出：`[0, 0, 0, 0, 0]`\n\n## 核心数组操作\n\n*   形状（Shape）：检查数组的维度：\n\
    \n*   `arr.shape`  # 输出: (3,)\n\n*   数据类型（Data Type）：确定数据类型：\n\n*   `arr.dtype`\
    \  # 输出: int32\n\n*   索引（Indexing）：访问数组中的元素：\n\n*   `arr[0]`  # 输出: 10\n\n## 数据操作\n\
    \n*   数值截断（Clip Values）：将值限制在指定范围内：\n\n*   `np.clip(arr, 0, 100)`\n\n*   替换 NaN（Replace\
    \ NaN）：用指定的数字替换 NaN 值：\n\n*   `np.nan_to_num(arr, nan=0)`\n\n*   条件选择（Where）：条件筛选：\n\
    \n*   `np.where(arr > 20, 1, 0)`  # 输出：`[0, 0, 1]`\n\n*   唯一值（Unique）：获取数组中的唯一值：\n\
    \n*   `np.unique(arr)`\n\n*   拼接（Concatenate）：合并数组：\n\n*   `np.concatenate([arr1,\
    \ arr2])`\n\n## 特征工程\n\n*   算术运算（Arithmetic Operations）：执行逐元素算术运算：\n\n*   `arr\
    \ + 10`  # 输出：`[20, 30, 40]`\n\n*   对数变换（Log Transform）：应用对数变换：\n\n*   `np.log(arr\
    \ + 1)`\n\n*   差分（Difference）：计算相邻元素之间的差：\n\n*   `np.diff(arr)`\n\n*   随机采样（Random\
    \ Sampling）：生成随机样本：\n\n*   `np.random.normal(50, 10, 1000)`\n\n*   累加和（Cumulative\
    \ Sum）：计算累加和：\n\n*   `np.cumsum(arr)`\n\n## 建模数学与统计\n\n*   平均值（Mean）：计算平均数：\n\n\
    *   `np.mean(arr)`\n\n*   标准差（Standard Deviation）：衡量变异性：\n\n*   `np.std(arr)`\n\
    \n*   最小/最大（Min/Max）：找到最小值和最大值：\n\n*   `np.min(arr), np.max(arr)`\n\n*   点积（Dot\
    \ Product）：计算两个数组的点积：\n\n*   `np.dot(arr1, arr2)`\n\n*   相关性（Correlation）：分析两个数组之间的线性关系：\n\
    \n*   `np.corrcoef(arr1, arr2)`\n\n## 数组创建与重塑\n\n*   范围数组（Arange）：按范围创建数组：\n\n\
    *   `np.arange(0, 10, 2)`\n\n*   等间距（Linspace）：生成均匀分布的值：\n\n*   `np.linspace(0,\
    \ 1, 5)`\n\n*   重塑（Reshape）：改变数组的形状：\n\n*   `arr.reshape(2, 5)`\n\n*   广播（Broadcasting）：在不同形状的数组之间执行操作：\n\
    \n*   `arr + 10`\n\n"
