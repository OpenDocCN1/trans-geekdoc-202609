    # 清混沌：数据预处理技术


    原始数据通常是一个混乱且不受控的实体，充满了不一致性、间隙和冲突的格式。从网页、API、传感器或电子表格等各种来源收集数据后，它们很少能直接用于 AI 应用。相反，它们更像一块粘土——虽然有价值，但在被正确成型之前基本上毫无用处。这就是数据预处理步骤作为数据科学中无名英雄发挥作用，将混乱转化为清晰。在本章中，我们将正面对这些混乱，检查处理缺失值、离群值、重复值等方面的技术。到最后，你将拥有一个工具箱，将数据精炼为
    AI 可以有效学习的格式，因为俗话说：“垃圾进，垃圾出。”


    ## 为什么预处理很重要


    在深入方法之前，理解预处理背后的原理至关重要。AI 模型（无论是设计用于检测肿瘤还是预测股价）都是从数据中固有的模式中学习的。如果你给它们提供噪音、不完整或混乱的数据，这些模式就会模糊。研究表明，未清洗的数据集会导致模型准确性降低多达
    25%。例如，一个简单的拼写错误如“1,00”而不是“100”就会破坏销售预测。虽然预处理看起来并不华丽——它通常涉及大量体力活——但它是 AI 卓越还是失败的关键。我们将涵盖几种关键技术：处理缺失值、处理离群值、去重、数据归一化以及类别编码。


    ## 处理缺失值：填补空白


    数据很少是完整的；它经常包含调查中的空白单元格、IoT 设备丢失的信号或销售日志中的“N/A”条目。缺失值在你的数据集中产生了漏洞，AI 系统通常在这些情况下难以准确预测。以下是处理缺失值的一些策略：


    1.  **删除它们**：如果一行大部分是空的（例如缺少姓名、地址或购买历史的用户记录），最好将其删除。`Pandas` 库通过 `dropna()` 命令简化了这一过程。然而，需要谨慎；丢失过多行（例如数据集的
    30%）会使模型缺乏关键信息。一家零售商曾这样丢弃了 40% 的数据，严重影响了预测准确性。

    2.  **用默认值填充**：对于数值，你可以使用简单的统计数据来填充空白。应用平均值或位数（例如 `df.fillna(df.mean())` 是有效的。对于类别数据，考虑使用“未知”或最常见的类别（众）。例如，天气预测
    AI 使用每日平均值填充缺失的温度以保持趋势准确性。

    3.  **插值**：这种方法适用于时间序列数据。如果传感器在某个时间丢失了读取值，但在前后都有值，你可以使用插值创建估计。例如，如果传感器在 10:01
    和 10:03 记录了数据但漏掉了 10:02，`df.interpolate()` 命令可以提供平滑的估计。

    4.  **建模**：更高级的方法涉及训练一个微型 AI 模型（如 K 近邻算法），根据其他可用数据预测缺失值。例如，如果房屋数据集中的价格缺失，你可以根据尺寸和邮政编码等特征进行推断。虽然这种方法可能很慢，但对于关键数据集特别有用。


    例如，一个分析 X 情感的 AI 在其“点赞”数据中面临 10% 的缺口；用中位数填充这些空白有助于保持整体情感而不产生偏离。


    ## 离群值：驯服野马


