- fmt: "\n# Overview: Tips for Using Cloud Platforms (AWS, Google Cloud, Azure) for\
    \ Data Processing\n\nCloud platforms like `AWS`, `Google Cloud`, and `Azure` are\
    \ essential for efficient data processing. They facilitate the transition from\
    \ raw data—such as `df['text']`—to informed decisions.\n\n## Why Cloud Platforms\
    \ Matter\n\nLocal processing can be limiting—handling 10K rows effectively with\
    \ `df['likes']` is manageable, but what about 10M? Cloud platforms scale effortlessly.\
    \ `AWS S3`, `Google BigQuery`, and `Azure Blob` enable efficient data handling\
    \ and analysis, leading to significant cost reductions.\n\n## Key Tips for Data\
    \ Processing\n\n1. **Choose the Right Storage**\n   Why: Fast access to large\
    \ datasets is crucial.\n\n   * `AWS`: Use `S3` for scalable storage.\n     ```python\n\
    \     import boto3\n     s3 = boto3.client('s3')\n     s3.upload_file('data.csv',\
    \ 'my-bucket', 'data.csv')\n     ```\n   * `Google Cloud`: Utilize `Cloud Storage`.\n\
    \     ```python\n     from google.cloud import storage\n     client = storage.Client()\n\
    \     client.bucket('my-bucket').blob('data.csv').upload_from_filename('data.csv')\n\
    \     ```\n   * `Azure`: Leverage `Blob Storage`.\n     ```python\n     from azure.storage.blob\
    \ import BlobServiceClient\n     blob_service_client.upload_blob('data.csv', 'data.csv')\n\
    \     ```\n   * Tip: Use `Parquet` for fast, compressed storage:\n     ```python\n\
    \     df.to_parquet('s3://my-bucket/data.parquet')\n     ```\n\n2. **Leverage\
    \ Scalable Compute**\n   Why: Powerful computation beyond local limits is essential.\n\
    \n   * `AWS`: Use `EC2` instances.\n     ```bash\n     aws ec2 run-instances --image-id\
    \ ami-xyz\n     ```\n   * `Google Cloud`: Utilize `Compute Engine`.\n     ```bash\n\
    \     gcloud compute instances create my-vm\n     ```\n   * `Azure`: Create `Virtual\
    \ Machines`.\n     ```bash\n     az vm create --name my-vm\n     ```\n     * Tip:\
    \ Start small with a `t2.micro` instance and scale as needed.\n\n3. **Use Managed\
    \ Data Services**\n   Why: Efficient querying for large datasets is key.\n\n \
    \  * `AWS`: Query with `Athena`.\n     ```sql\n     SELECT * FROM my_table WHERE\
    \ likes > 100;\n     ```\n   * `Google Cloud`: Use `BigQuery`.\n     ```bash\n\
    \     bq query \"SELECT AVG(sales) FROM my_dataset\";\n     ```\n   * `Azure`:\
    \ Leverage `Data Lake Analytics`.\n     ```sql\n     SELECT * FROM my_lake WHERE\
    \ speed > 50;\n     ```\n     * Tip: Use partitioning for improved performance.\n\
    \n4. **Optimize Costs**\n   Why: Cost management is vital for profitability.\n\
    \n   * `AWS`: Utilize `Spot Instances` for cost savings.\n     ```bash\n     aws\
    \ ec2 request-spot-instances\n     ```\n   * `Google Cloud`: Use `Preemptible\
    \ VMs`.\n     ```bash\n     gcloud compute instances create --preemptible\n  \
    \   ```\n   * `Azure`: Deploy `Low-Priority VMs`.\n     ```bash\n     az vm create\
    \ --priority Low\n     ```\n     * Tip: Monitor costs using `AWS Cost Explorer`.\n\
    \n5. **Automate Workflows**\n   Why: Streamlining ETL processes saves time.\n\n\
    \   * `AWS`: Use `Glue` for ETL tasks.\n     ```python\n     glueContext.create_dynamic_frame.from_catalog()\n\
    \     ```\n   * `Google Cloud`: Implement `Dataflow`.\n     ```python\n     beam.Pipeline()\
    \ | beam.ReadFromText('gs://my-bucket/data.csv')\n     ```\n   * `Azure`: Utilize\
    \ `Data Factory` for workflows.\n     ```bash\n     az datafactory pipeline create\n\
    \     ```\n     * Tip: Schedule automated tasks using `cron`.\n\n6. **Secure Your\
    \ Data**\n   Why: Compliance and security are paramount.\n\n   * `AWS`: Use `IAM`\
    \ for access control.\n     ```bash\n     aws iam create-role\n     ```\n   *\
    \ `Google Cloud`: Manage `IAM` policies.\n     ```bash\n     gcloud projects add-iam-policy-binding\n\
    \     ```\n   * `Azure`: Implement `RBAC`.\n     ```bash\n     az role assignment\
    \ create\n     ```\n     * Tip: Encrypt sensitive data for added security.\n\n\
    ## Real-World Snapshots\n\n* `X Sentiment`: Upload data to `AWS S3`, process with\
    \ `Glue`, and analyze with `Spark SQL`.\n  ```python\n  s3.upload_file('x_posts.csv',\
    \ 'bucket', 'data.csv')\n  ```\n* `Sales Forecast`: Query data from `Google BigQuery`\
    \ and use `Dataflow` for analysis.\n  ```bash\n  bq query \"SELECT * FROM sales\"\
    ;\n  ```\n* `Tesla Crash`: Use `Azure Blob` for data storage and `Data Factory`\
    \ for model predictions.\n  ```python\n  blob_client.upload_blob('sensors.csv')\n\
    \  ```\n\nBy implementing these strategies, you can effectively harness the power\
    \ of cloud platforms for your data processing needs, ensuring efficiency and scalability\
    \ in your projects.\n\n# Exercise: Clean a Sample Dataset of Social Media Posts\n\
    \nHere’s a practical, hands-on coding exercise designed for a book on AI/data\
    \ science workflows. This example focuses on **cleaning and preprocessing social\
    \ media data** – a common task in NLP projects:\n\nObjective: Prepare raw social\
    \ media text data for sentiment analysis.\n\n### Dataset (`social_media_raw.csv`)\n\
    \n```csv\npost_id,text,author,likes,timestamp\n1,\"Just saw #AvengersEndgame...\
    \ BEST MOVIE EVER!!! \U0001F60D\",user123,2550,2023-04-15 20:30:00 \n2,\"Ugh,\
    \ traffic today is THE WORST. #MondayBlues\",user456,,2023-04-17 08:15:00 \n3,\"\
    Python vs R – FIGHT! \U0001F94A #DataScience\",user789,1200,2023-04-17 12:00:00\
    \ \n4,\"Missing my vacation... \U0001F334 https://beachphotos.com\",user101,780,2023-04-18\
    \ 15:00:00 \n5,\"\",user999,,2023-04-19 10:00:00\n```\n\n### Solution\n\n```python\n\
    import pandas as pd\nimport re\nfrom datetime import datetime\n\n# Load raw data\n\
    df = pd.read_csv('social_media_raw.csv')\n\ndef clean_social_media_data(df):\n\
    \    \"\"\"Clean social media posts for NLP analysis.\"\"\"\n    # 1. Handle missing\
    \ values\n    df = df.dropna(subset=['text'])\n    df['likes'] = df['likes'].fillna(0).astype(int)\n\
    \    \n    # 2. Clean text\n    df['text_clean'] = df['text'].apply(lambda x:\n\
    \        re.sub(r'http\\S+|#\\w+|[^a-zA-Z]', '', x)\n        .strip()\n      \
    \  .lower()\n    )\n    \n    # 3. Fix timestamp\n    df['timestamp'] = pd.to_datetime(\n\
    \        df['timestamp'], \n        errors='coerce',\n        format='%Y-%m-%d\
    \ %H:%M:%S'\n    ).dt.date\n    \n    # 4. Remove duplicate posts\n    df = df.drop_duplicates(subset=['text_clean'])\n\
    \    \n    # 5. Validate and return\n    return df[df['text_clean'].str.len()\
    \ > 5]\n\n# Execute and save\nclean_df = clean_social_media_data(df)\nclean_df.to_csv('social_media_clean.csv',\
    \ index=False)\n```\n\n### Cleaned Output (`social_media_clean.csv`)\n\n```csv\n\
    post_id,text,author,likes,timestamp,text_clean\n1,\"Just saw #AvengersEndgame...\
    \ BEST MOVIE EVER!!! \U0001F60D\",user123,2550,2023-04-15,just saw best movie\
    \ ever\n2,\"Ugh, traffic today is THE WORST. #MondayBlues\",user456,0,2023-04-17,ugh\
    \ traffic today is the worst\n3,\"Python vs R – FIGHT! \U0001F94A #DataScience\"\
    ,user789,1200,2023-04-17,python vs r fight\n4,\"Missing my vacation... \U0001F334\
    \ https://beachphotos.com\",user101,780,2023-04-18,missing my vacation\n```\n"
