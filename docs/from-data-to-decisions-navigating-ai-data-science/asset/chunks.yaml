    ## 识别异常以增强鲁棒性


    异常会破坏模型性能，因此有效地识别和管理它们至关重要。EDA 技术有助于区分有价值离群值和噪声。


    ### 剔除垃圾数据


    通过 `histograms` 和 `z-scores` 识别极端离群值，你可以移除偏斜结果的数据点。例如，如果最大销售额为 `1millionwhilethemeanis1
    million while the meanis1millionwhilethemeanis100`，移除此类异常可以将销售 AI 的准确率提高 15%。


    ### 保留黄金


    相反，某些异常可能代表有价值的洞察，例如 zscore 大于 5 的热门帖子。通过将这些标记为 `is_viral`，你可以增强情感分析：


    ```

    df[''is_viral''] = (df[''retweets''] > df[''retweets''].quantile(0.99)).astype(int)

    ```


    特斯拉的碰撞 AI 保留了高速异常数据，这有助于改进安全预测。


    ### 调整模型


    数据中的高方差表明需要鲁棒算法。例如，使用 `Isolation Forest` 方法可以帮助识别离群值并最小化它们对模型的影响：


    ```python

    from sklearn.ensemble import IsolationForest


    iso = IsolationForest()


    df[''anomaly''] = iso.fit_predict(df[[''likes'', ''retweets'']])

    ```


    ### 为什么其有效


    EDA 对异常的关注为你的模型实现鲁棒性能做好了准备。通过清理垃圾数据和利用有价值的边缘情况，你增强了模型的韧性。例如，一个保留 BMI 离群值作为高风险指标的健康
    AI 在疾病预测中达到了 90% 的准确率。


    ## 扩展与预处理微调


    从 EDA 获取的关于数据分布和形状的洞察为必要的预处理步骤提供了依据，如归一化、标准化编码。


    ### 归一化


    如果你的数据是偏斜的，归一化会有帮助。例如，如果点赞范围从 0 到 50,000，你可以将其归一化到 0-1 标度：


    ```

    df[''likes_norm''] = (df[''likes''] - df[''likes''].min()) / (df[''likes''].max()
    - df[''likes''].min())

    ```


    这种调整通常会增强模型性能，如一个 X AI 在归一化后经历了 5% 的提升所示。


    ### 标准化


    对于符合正态分布的特征，标准化是合适的：


    ```

    df[''speed_std''] = (df[''speed''] - df[''speed''].mean()) / df[''speed''].std()

    ```


    这为回归分析准备了数据，一个交通 AI 报告称标准化速度数据带来了 8% 的收益。


    ### 编码


    对于类别变量，编码是必须的。通过对情感类别使用独热编码，你确保了平衡的表示：


    ```

