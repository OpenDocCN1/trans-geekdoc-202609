    ## 数据清洗


    *   Drop NaN Values：删除包含空值的行：


    ```python

    df.dropna()

    ```


    对于特定列，使用：


    ```python

    df.dropna(subset=[''likes''])

    ```


    *   Fill NaN Values：用中位数填充空值：


    ```python

    df[''retweets''].fillna(df[''retweets''].median())

    ```


