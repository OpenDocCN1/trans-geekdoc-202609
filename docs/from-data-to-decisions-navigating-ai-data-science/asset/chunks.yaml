    # 术语表：从数据到决策：导航 AI 数据科学


    ## A


    Accuracy（准确率）：模型做出正确预测的百分比。使用 `accuracy_score(y_test, y_pred)` 计算，对于平衡数据该准确率通常很高，但在不平衡的数据集中可能会具有误导性。


    AI (Artificial Intelligence，人工智能）：模拟人类的系统，应用于情感分析和预测等各种应用中。


    Anomaly Detection（异常检测）：识别数据中离群值的过程，通常通过 `IsolationForest()` 等方法实现。


    ## B


    Bias Mitigation（偏差缓解）：减少预测中不公平性的技术，例如使用 `smote.fit_resample()` 来平衡数据集。


    Binary Encoding（二值编码）：将类别变量编码为二进制格式的方法，可减少数据集膨胀。


    ## C


    Classification（分类）：预测类别标签的任务，如 `rf.predict(X)` 等函数所示示例。


    Cross-Validation (CV，交叉验证)：一种通过分割数据来评估模型稳健性的技术，通常使用 `cross_val_score()` 实现。


    Clustering（聚类）：在没有预定义标签的情况下对数据点进行分组的方法，通常使用 `KMeans(n_clusters=3)` 等算法。


    ## D


    Data Cleaning（数据清洗）：为分析准备原始数据的过程，通常涉及如 `df.dropna()` 等删除缺失值的方法。


    Data Pipeline（数据流水线）：涉及提取、转换、加载（ETL）过程以有效管理数据流的工作流。


    Deployment（部署）：将机器学习模型发布到生产环境的行为，通常使用 `Docker` 等容器化工具。


    ## E


    ETL (Extract, Transform, Load)：一种数据工作流过程，涉及从源提取数据、将其转换为所需的格式并将其加载到目标数据库。


    Evaluation Metrics（评估指标）：用于评估模型性能的量化标准，包括 `f1_score()` 等指标。


    Explainability（可解释性）：理解和解释模型预测的能力，通常通过 `SHAP values` 等技术进行增强。


    ## F


    Feature Engineering（特征工程）：从原始数据创建新输入特征以提高模型性能的过程。


    Federated Learning（联邦学习）：一种在保持数据本地化的同时在多个设备上训练模型的去中心化方法。


    F1 Score（F1 分数）：将精确率和召回率结合为单一标准的指标，使用 `f1_score(y_test, y_pred)` 计算。


    ## G


    GAN (Generative Adversarial Network，生成对抗网络)：一种神经网络，通过两个网络之间的竞争过程生成合成数据。


    ## H


    Hyperparameters（超参数）：用于控制机器学习算法训练过程的配置设置。


    ## I


    Iteration（迭代）：通过反复训练和测试来完善模型以获得更好性能的过程。


    ## K


    Kubernetes (K8s)：一个用于自动化容器化应用部署、扩展和管理的开源平台。


    ## L


    Label Encoding（标签编码）：将类别标签转换为整数格式以供机器学习模型使用的方法。


    ## M


    MAE (Mean Absolute Error，平均绝对误差)：预测值与实际值之间绝对差的平均值，通常用于回归分析。


    Model（模型）：用于根据输入数据进行预测的算法或数学表示。


    ## N


    Normalization（归一化）：将数据缩放到特定范围（通常为 `[0, 1]`）的过程，以确保每个特征对分析的贡献相等。


    ## O


    One-Hot Encoding（独热编码）：将类别变量转换为可提供给机器学习算法格式的技术。


    Overfitting（过拟合）：一种建模错误，发生在模型学习了训练数据中的噪声从而损害其在未见数据上的性能时。


    ## P


    Precision（精确率）：正预测数占正预测总数的比例，使用 `precision_score()` 测量。


    ## Q


    Quantum Computing（量子计算）：一种革命性的计算范式，利用量子力学比经典计算机更高效地处理信息。


    ## R


    Recall（召回率）：模型捕捉所有相关实例的能力，使用 `recall_score()` 计算。


    Regression（回归）：一种预测建模技术，用于估计变量之间的关系，通常用于连续性结果。


    ## S


    Scaling（缩放）：调整模型或数据集大小以确保高效处理和部署的过程。


    SHAP：一种通过提供每个特征贡献的见解来解释预测的方法，通过 `shap.TreeExplainer()` 计算。


    Synthetic Data（合成数据）：人工生成而非从真实世界事件获取的数据，通常使用 `GANs` 等模型创建。


    ## T


    Time-Series Split（时间序列拆分）：一种专门为时间序列数据设计的交叉验证方法，确保使用过去的数据来预测未来数据。


    ## U


    Underfitting（欠拟合）：一种建模问题，当模型太简单而无法捕捉数据的底层结构时发生。


