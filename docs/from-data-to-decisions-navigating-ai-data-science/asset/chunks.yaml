    1. **舍弃冗余数据**：如果数据集中的某行大部分是空的，那么最好的方法可能是将其完全删除。在 `pandas` 中，你可以使用 `df.dropna()`
    命令来消除任何包含缺失值的行。然而，使用这种方法时应谨慎；删除过多的行可能会导致模型缺乏关键信息。例如，某零售商在删除了 10% 的稀疏销售日志后，发现其预测能力有所下降。


    2. **用基础数据填充**：对于数值型数据，简单的统计数据可以作为有效的填充手段。可以计算平均值或中位数来替换缺失值（例如，`df.fillna(df.mean())`
    或 `df.fillna(df.median())`）。对于分类数据，使用“未知”或众数（出现频率最高的值）有助于维护数据集的完整性。例如，一个天气预测 AI
    使用每日中位数来填充了缺失的降雨数据，这对于趋势分析效果良好。


    3. **插值以保持连续性**：插值对于时间序列数据特别有用。如果缺少时间戳的条目，可以通过连接周围的数据点来估算其值。例如，如果下午 2 点的股票价格缺失，你可以使用
    `df.interpolate(method=''linear'')` 来填补空白。这种技术对于有序数据比随机间隙更有效。


    4. **预测缺失值**：对于更复杂的场景，你可以训练一个小型 AI 模型，根据现有数据来预测缺失值。例如，来自 `sklearn` 的 `KNNImputer`
    可以通过分析附近房产的属性来估计房屋数据集中的缺失价格。虽然这种方法计算量很大，但对于关键的空白可以产生显著益处。例如，一个医疗 AI 使用这种方法来预测缺失的血压读数，从而提高了准确性。


    在一个真实世界的示例中，一个 X 情感数据集的“转推”字段面临着 15% 的缺失值。团队没有删除这些条目，而是用中位数填充了空白，在不扭曲情感分析的情况下保持了数据集的整体完整性。


    ## 离群值：约束这些反叛者


    离群值是与其他数据点不同的数据点，通常表示异常或特殊情况。例如，在一个平均交易额为 10 的数据集中出现了一笔 10,000 的销售记录，或者在 7 月记录的温度为零下
    20°C，这些都是明显的离群值。虽然某些离群值可能代表真实发生（如大奖销售），但另一些可能意味着错误（如打印错误）。AI 系统对离群值敏感，这可能会扭曲模型并推高错误率。以下是有效管理离群值的方法：


    1. **发现异类**：统计技术可以帮助识别离群值。超出平均值三个标准差的数据点可能被标记为可疑（例如，`df[df > df.mean() + 3*df.std()]`）。或者，你也可以使用四分位距（IQR）方法，通过计算
    `Q1` 和 `Q3` 并识别落在 `Q1 - 1.5IQR` 到 `Q3 + 1.5IQR` 范围之外的值来确定离群值。


    2. **限制极端值**：与其完全删除离群值，不如考虑对它们的值进行封顶以维护数据集的完整性。例如，你可能会在第 99 百位数设置上限（例如，`df[''price''].clip(upper=0.99)`）。


    3. **丢弃垃圾**：如果离群值显然是错误的，那么将其删除可能更好。在 `pandas` 中，你可以使用条件过滤 dataframe（例如，`df[df
    < threshold]`）。


    4. **接纳边缘情况**：有时离群值是有效且重要的。在这种情况下，删除它们可能会导致丢失丢失。


    ## 重复值：一个足够


    重复值会弄乱你的数据集并膨胀计数。要有效管理它们：


    1. **寻找克隆**：统计技术可以帮助识别重复项。你可以使用 `df.duplicated()` 标记重复，并使用 `df.drop_duplicates()`
    删除它们。


    2. **双重检查事实**：并非所有重复都是错误。在删除之前，请验证它们是否代表合法的条目（例如，`df.drop_duplicates(subset=[''user_id''])`）。


    3. **合并混乱**：在处理近似重复项时，你可能需要聚合数据。你可以对数据进行分组并计算总和或平均值（例如，`df.groupby(''name'').sum()`）。


