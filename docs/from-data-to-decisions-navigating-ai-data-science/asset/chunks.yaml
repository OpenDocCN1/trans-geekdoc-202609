    # Statistical Methods to Uncover Patterns and Anomalies


    While visuals like Matplotlib scatter plots and Seaborn heatmaps illustrate data
    trends, it is the underlying numbers that reveal the deeper story. Data functions
    as a puzzle, and statistical methods serve as the magnifying glass that helps
    uncover trends, relationships, and outliers. After cleaning and engineering your
    dataset, it is time to delve into the data to identify its rhythms and anomalies.
    In this section, we will utilize various statistical measures—central tendency,
    dispersion, correlation, and anomaly detection—to uncover patterns and highlight
    any irregularities. This is not merely dry mathematics; it is the heartbeat of
    your data, preparing your AI for the challenges ahead. Let’s investigate the intricacies
    of statistical analysis.


    ## Central Tendency: Finding the Heartbeat


    Understanding where your data “lives” is crucial, and measures of central tendency—mean,
    median, and mode—help pinpoint this center, offering a baseline for interpretation.


    ### Mean


    The mean provides the average value, calculated by summing all likes and dividing
    by the total count:


    ```python

    mean_likes = df[''likes''].mean()

    ```


    While it offers a quick snapshot—like an average of 50 likes for X posts—it can
    be skewed by extreme values, such as a viral post with 50,000 likes that could
    inflate the mean to 200. This sensitivity can mislead interpretations, particularly
    in datasets with significant outliers.


    ### Median


    The median represents the middle value, effectively dividing the dataset into
    two equal halves:


    ```python

    median_likes = df[''likes''].median()

    ```


    For example, if the median is 12 likes, it remains unaffected by extreme outliers,
    providing a more reliable measure of central tendency. In traffic data, a median
    speed of 30 mph reveals more about typical conditions than a mean of 45 mph, which
    can be skewed by high-speed anomalies.


    ### Mode


    The mode identifies the most frequently occurring value, which can be particularly
    useful for categorical data:


    ```python

    mode_sentiment = df[''sentiment''].mode()

    ```


    For example, if "positive" is the mode in a sentiment analysis, it indicates that
    positive sentiments are the most common among the dataset.


    ### Why It Matters


    Understanding these measures allows you to capture the essence of your data. For
    example, in a health AI, a mean BMI of 28 might mask the presence of a healthier
    population indicated by a median of 25 and a mode of 24.


    ### Try It


    To explore these concepts, run the following code:


    ```python

    print(df[''likes''].mean(), df[''likes''].median())

    ```


    This will help you determine which measure tells the more accurate story.


    ## Dispersion: Measuring the Spread


    While central tendency provides a single point, measures of dispersion help you
    understand how spread out the data is around that point.


    ### Range


    The range is calculated by subtracting the minimum value from the maximum value:


    ```python

    range_retweets = df[''retweets''].max() - df[''retweets''].min()

    ```


    For example, if retweets range from 0 to 50,000, it highlights the broad reach
    of some posts. In sales data, a price range of 5 to 10,000 can indicate the distinction
    between luxury and budget products.


    ### Variance


    Variance quantifies the average squared deviation from the mean:


    ```python

    variance_likes = df[''likes''].var()

    ```


    A high variance indicates that the data points are widely spread out, while a
    low variance suggests they are clustered closely around the mean.


    ### Standard Deviation


    The standard deviation is the square root of variance, offering a more interpretable
    measure of spread:


    ```python

    std_likes = df[''likes''].std()

    ```


    For instance, if the standard deviation of likes is 100, it indicates that most
    posts typically receive between 20 and 40 likes.


    ### Quartiles and IQR


    The interquartile range (IQR) provides insights into the middle 50% of data:


    ```python

    Q1 = df[''retweets''].quantile(0.25)

    Q3 = df[''retweets''].quantile(0.75)

    IQR = Q3 - Q1

    ```


    Using `IQR`, you can identify outliers that fall outside of 1.5 times the `IQR`.


    ### Why It Matters


    Understanding the spread helps identify predictability versus chaos. For example,
    a low standard deviation in prices might overlook high-ticket items, while a high
    standard deviation in retweets can indicate viral spikes.


    ### Try It


    To measure the spread of your data, you might run:


    ```python

    df[''speed''].std(), df[''speed''].quantile([0.25, 0.75])

    ```


    This will reveal how varied the data is.


    ## Correlation: Spotting Relationships


    Correlation measures the relationship between variables, helping you determine
    if they move in sync.


    ### Pearson Correlation


    The Pearson correlation coefficient assesses the linear relationship between two
    continuous variables:


    ```python

    pearson_corr = df[''likes''].corr(df[''retweets''])

    ```


    A value close to 1 indicates a strong positive relationship, while a value near
    -1 indicates a strong negative relationship. For example, a correlation of 0.9
    between likes and retweets suggests they are tightly linked.


    ### Spearman Correlation


    The Spearman correlation measures how well the relationship between two variables
    can be described using a monotonic function:


    ```python

    spearman_corr = df[''likes''].corr(df[''retweets''], method=''spearman'')

    ```


    This method is useful for identifying relationships that may not be linear, capturing
    more complex patterns.


    ### Mutual Information


    Mutual information quantifies the amount of information gained about one variable
    through another, especially useful for categorical data:


    ```python

    from sklearn.feature_selection import mutual_info_classif

    mutual_info = mutual_info_classif(df[''likes''], df[''sentiment''])

    ```


    This method can reveal non-linear relationships that others might miss.


    ### Why It Matters


    High correlation can indicate redundancy, while low correlation suggests independence.
    For instance, if a sales AI observes a negative correlation between price and
    quantity sold, it may indicate that discounts drive volume.


    ### Try It


    To check for relationships in your data, run:


    ```python

    df.corr().loc[''likes'', ''retweets'']

    ```


    This will help you determine whether these variables are friends or strangers.


    ## Anomaly Detection: Flagging the Freaks


    Anomalies are the rebels in your dataset—outliers that could signal valuable insights
    or hidden traps.

