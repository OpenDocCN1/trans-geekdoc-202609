  \ 指出网络犯罪分子之间存在分工。网络犯罪领域几乎没有“通才型”。相反，正如 Lusthaus 所发现的，投资于某项“手艺”并依靠他人执行专门职能具有更大的经济效益。有些人更擅长技术，因此他们设计了这些网络祸源；另一些人天生擅长销售，他们进入地下商业市场推广价值主张；还有人擅长执行，他们为需要帮助将武器送达预期目标的买家提供售后支持。\n\
  \n推动世界上最复杂公司的分工模式也服务于暗网（Dark Web）的需求。具有此类专业化的网络犯罪分子如何在提供服务后相互信任并按时付款？这就像在线购物者学会了信任寻求其业务支持的正规在线公司一样。他们依靠其他网络犯罪分子对自身经验的数字评分量表。他们使用反馈论坛来交换关于他们内部坏蛋的信息（显然，盗贼之间确实有道义）。\n\
  \n这些反馈机制扩大了网络犯罪业务的规模。每个犯罪分子都可以花费更少的时间来验证链中潜在伙伴的专业知识和可靠性，而花费更多的时间执行他们的技艺来实施犯罪。\n\n\
  除了模仿在线交易所的服务，网络犯罪市场还模仿了合规治理的规则。Lusthaus 发现网络犯罪分子使用托管服务，将第三方委托第三方持有付款（即使不是货物），直到所有内容通过验证。甚至还有仲裁机制，双方都可以在受命做出裁决的社区资深成员面前辩论争议。在某些情况下，“法官”可能会将违规方封在市场之外。\n\
  \nMcAfee 对潜伏在网络表面下的庞大网络犯罪市场进行了我们自己的研究^(2)。由于执法部门捣毁了一些著名的暗网市场，网络犯罪分子正在发挥他们的创业才华。一些个人卖家正将成熟的市场（这些市场往往是执法人员的目标）交易为自己的网站，以便在暗网上兜售他们的商品和/或服务。不屈的网站设计师是这一追求过程的帮凶，为有抱的供应商设计隐藏的市场。是的，即使暗网也有层级，允许其参与者在雷达下潜行得更深。\n\
  \n无论坏意行为者的意图建立自己的“点击即实体店”等同业务，都有许多有用的针对网络犯罪主题的地下论坛，帮助这些犯罪分子精进他们的技艺。更热门的讨论涉及泄露的用户凭据、常见的漏洞和暴露（CVE），以及提供大量可供取的被盗信用卡卡的“倾倒站”。\n\
  \n这就是网络犯罪的真面。这个由服务、买家、卖家和“监管者”交织而成的复杂迷宫正是你们公司所面临的对手。而且你们公司处于劣势地位。这不是一场公平的对决。暗网上没有萨班斯-奥克斯利法（SOX）的要求。没有监管隐私和数据使用的\
  \ GDPR。没有由众多治理机构规定的合规标准。黑客可以在凌晨 2:00 写代码，并在凌晨 4:00 利用他们的受害者。不需要复杂的测试窗口来确保符合质量控制。\n\
  \n与受你们公司相同的规则、法规和通用商业理想约束的竞争对手不同，对手不遵守任何法律（除了他们既定社区的法律）。你可能非常熟悉正在面对一个高度协调的敌人。但请考虑财务部门通常如何向组织分配预算，以理解网络安全的症结。预算可能是根据基准数据分配的。虽然你可以找到网络安全支出的基准，但它们有些误导性。因为网络安全的真实基准必须来自对手。如果你不知道对手在研发他们的“产品”上花费了多少资金，又如何准确评估与之匹配的网络安全预算？\n\
  \n如果不是基准数据，预算就是根据投资回报率（ROI）分配。同样，对于网络安全专家来说，这是一个很难证明的衡量标准。因为首席信息安全官（CISO）如何证明一个否定事实？即使他们尝试，聪明的首席财务官（CFO）难道不会从面上挑战这一论点吗？想象一下\
  \ CFO 和 CISO 之间的对话如下：\n\n**CFO：**\n我们为什么需要买这个新的安全小组件？\n\n**CISO：**\n因为我们看到公司在该领域遭受的攻击数量历史新高。\n\
  \n**CFO：**\n但这笔支出的投资回报率是多少？\n\n**CISO：**\n嗯，如果我们不做些什么，我们可能会被入侵。\n\n**CFO：**\n所以你是想向我保证，如果我们买了这项技术，就不会发生泄露吗？\n\
  \n**CISO：**\n不完全是。情况比这复杂。\n\n**CFO：**\n让我们把它简单化。这笔支出的投资回报率是多少？\n\n你可以看到这种循环论证可以持续多久。除非尝试用复杂的指标让财务人员感到震慑，否则\
  \ CISO 没有高明的办法来回答“投资回报率是多少？”这个问题。\n\n并不是说 CISO 在逃避这个问题——或者说他们不理解 ROI 的概念。为了理解为什么这是一个无法回答的问题，让我们看看几个能进一步说明这一点的攻击。\n\
  \n## 变与不变的是……\n\n2017 年 5 月，网络安全进入了几乎每个媒体网站的首页和全球几乎每个新闻节目的第一部分。以前不知道勒索软件的人将通过一个名字记住它：WannaCry。这种攻击在规模和速度上都是前所未有的，在最初几天内全球范围内感染了超过\
  \ 20 万台计算机——关闭了医院、大学和银行.^(3)WannaCry 对每个受害者的计算机文件索要赎金，金额高达 300 美元比特币。WannaCry 愤怒造成的估计损失？在全球范围内高达数十亿美元。\n\
  \n但把 WannaCry 称为勒索软件是不公平的。当然，勒索软件是威胁到不可恢复的文件丢失的可见利用漏洞。但让 WannaCry 如此隐蔽的是它传播的方式，它利用蠕虫的特性来污染新系统。在这里不进入复杂的技术细节，“传统”勒索软件与\
  \ WannaCry 的关键区别在于后者不需要人工干预即可扩散。这就是它扩散如此迅速的原因。\n\n\n\n\n\nMcAfee 对 `WannaCry` 的自身分析显示，它几乎算不上是勒索软件。其作者留下的变现能力相当粗浅。他们没有将受害者的唯一标识符与其的比特币支付关联起来，这导致文件解密极其困难。那么\
  \ `WannaCry` 到底是什么？勒索软件？还是蠕虫？两者皆是。\n\n2018 年，黑客的创意随着 `Zyklon` 的发布再次展现无遗。`Zyklon`\
  \ 是一个功能齐全的威胁包，供企业犯罪分子利用——它可以窃取密码、发起 DDoS 攻击、挖掘加密货币等。`Zyklon` 到底是什么？加密货币挖矿？DDoS？键盘记录？以上皆是。\n\
  \n正如 `WannaCry` 和 `Zyklon` 所示，黑客不仅在专业领域上合作，还共同创造出融合威胁的新型混合物。他们正在将旧品种（如蠕虫）与新品种（如勒索软件）混合在一起。在\
  \ McAfee 对地下论坛的分析中，我们看到网络犯罪分子正在讨论新旧漏洞。结果是复杂的威胁，其传播速度比以往任何时候都要快。\n\n回到首席财务官（CFO）和首席信息安全官（CISO）之间的对话。当\
  \ CISO 向 CFO 请求更多资金时，通常是因为这种现实。即使在周期中期，在预算分配完成很久之后，CISO 可能仍需要更多资金。`WannaCry` 并没有等到方便的财政年度结束来大肆破坏。恶性分子不在乎你的预算周期。\n\
  \n如果 `ROI` 不是网络安全的正确指标，那么是什么呢？风险管理。网络安全专业人员从事的是风险管理业务。诚然，他们拥有技术专长，并使用大量产品来防御公司免受高度组织化的犯罪集团的侵害。但脱离了这些领域的术语，它实际上最终归结为一个清晰的业务目标——降低公司的风险。\n\
  \n正如 CFO 们所知，风险管理及其相关指标与传统的财务指标 `ROI` 有着根本上的不同。我住在德克萨斯州北部，该地区在美国赢得了“龙卷风走廊”这一不幸的俗称。直到今天，我对龙卷风保持着健康的恐惧。怪归于每个月第一个星期三中午测试的龙卷风警报，那令人毛骨悚然的声音简直让人不寒而栗。\n\
  \n## . . . 它们越是保持不变\n\n它们在白天躲避，晚上觅食。它们寻找血餐以生存，在受害者睡觉时偷食受害者，因为它们厌恶移动。它们是快速的移动者，通常每分钟移动三到四英尺——换算比例的话，等同于平均成年人的冲刺速度。是的，床虫正在全球范围内卷抬头。\n\
  \n\n\n\n以下是床虫如此难以根除的原因。你可以拥有世界上最干净的房子。你可以虔诚地消毒你的床上用品。你可以对睡衣或任何应该接触你睡眠地点的衣物采取同样的措施。但如果你恰好入住了一家有床虫的酒店或乘坐了一架被虫害的飞机，只需要一只讨厌的床虫就能搭上你的便车（在这种情况下是你的行李或包裹其中的物品），并一路来到你的住所。\n\
  \n如果你恰好住在公寓楼或其他多户单元，情况会更糟糕。现在，只需要与你共用一堵墙的邻居在卫生标准上比你稍微松懈，你可能就会发现家里出现了不速之宾之客（是的，这些坚定的寄生虫可以通过墙体空隙移动，并利用水管和电线通道作为它们的路线）。\n\
  \n如果这还不够糟糕的话，由于床虫带有极大的负面声誉，大多数人都不愿意承认自己与这些吸血鬼共处。等到他们承认存在问题并寻求帮助时，可能已经面临着全面的虫害。如果你恰好过夜（比如在酒店里）或共用墙壁（比如是邻居）——你明白我的意思……。\n\
  \n床虫是一个不幸的提醒，提醒我们我们之间是多么相互依赖的。这并不是一个依靠邻居帮助的问题，而是关于信任他们了解自己的环境（在一项研究中，近 50%患有床虫的人甚至不知道自己有床虫^(5)），并寻求专业帮助来消除它们。\n\
  \n## 网络安全寓喻\n\n这是一个非常迷的网络安全寓喻。公司并非孤立地运行在岛上，而是在高度复杂、互联的生态系统中运行。虽然一家公司可能执行良好的网络安全卫生，但它必须依靠它的邻居——任何与它有业务往且与其系统有连接的第三方——也这样做。否则，它就会让自己暴露在利用侧门和后门渗透的阴险捕食者面前。（顺便说一下，在这种情况下连接的“系统”并不一定需要通过广泛的网络。回想第\
  \ 3 章涵盖的网络安全卫生实践。只需一个粗心的合作伙伴留下一个无人看管且未加密的带有公司敏感文件的`USB`或`笔记本电脑`，你的公司就会暴露。）\n\n在我们享受了数十年相对无床虫的生活之后，我们被提醒，旧的依然可以常新。事物变化得越多，保持得也越多。尽管在对抗床虫方面取得了种种进步，我们再次在为床虫哀叹。\n\
  \n## CFO 和 CISO 的角色\n\n虽然变化是业务中唯一的永恒，但许多`CFOs`仍然可以拥有一项确定性：他们管理着公司的采购。由于这在很大程度上仍然属于财务职能，`CFO`与`CISO`之间的关系将变得更加紧密。\n\
  \n正如床虫提醒我们彼此之间是多么依赖来警惕入侵者一样，第三方关系也充当了额外的暴露点，对手可以利用这些点对我们的公司造成伤害。考虑来自 Ponemon 研究^(6)的以下几点，它们反映了严酷的现实：\n\
  \n*   59%的组织确认他们曾由于其中一个第三方导致了数据泄露。\n*   仅 29%的人表示，他们会从第三方本身获知此类泄露。\n*   76%的人说涉及供应商的网络安全事件正在增加，但只有\
  \ 46%的人认为管理外包关系风险是优先要事项。\n*   57%的人不知道其组织的供应商保护措施是否足以防止泄露。\n\n在积极方面，这些指标有很大的改进空间。第三方安全管理对许多组织来说是比较新的。正如上面的数字所示，它至关重要。`CFOs`代表组织冲锋，确保采购流程能够充分对第三方的网络安全状况进行审查。这是你的`CISO`将帮助你提出正确问题的地方。\n\
  \n## 外包趋势\n\n当然，最终的可信第三方关系是公司完全外包某项功能或其部分。72%的组织外包了该功能的至少一部分，31%的计划增加外包比例^(7)\n\n\
  曾经考虑外包自己的网络安全环境是荒谬的。但网络安全似乎正在追随其`IT`祖先的脚步，因为让第三方保护组织最珍贵的数字资产正变得越来越可。当然，全球网络安全人才的短缺只是火上浇油。公司不再激烈争夺市场上并不存在的网络安全人才，而是选择雇佣具有这些专业知识的第三方，以至少增强内部的人员能力。\n\
  \n特别是安全运营中心（`SOC`）最可能外包的领域包括`渗透测试`（75%的组织外包）、`威胁情报收集和馈`（54%）以及`数字和恶意软件取证`（51%）^(8)\n\
  \n外包网络安全的一个或多个领域有几个优点。正如大多数外包一样，公司通过雇佣具有相当网络安全基础设施的第三方可以节省资金并减少初始资本支出。公司还可以通过与这些托管安全服务提供商（`MSSPs`）谈判服务水平协议来缓解过时的风险。最后，`MSSPs`专门负责网络安全。他们可以专注于核心能力，让客户有更多时间专注于自己的业务。\n\
  \n## 完全外包的风险\n\n正如书中的大多数主题一样，这个问题包含了许多灰色地带。虽然外包网络安全计划对于许多公司来说是完全（特别是对于人员限制严格的公司），但网络安全类似于慈善——始于内部。将网络安全状况的完全责任交给第三方是一项风险业务。`MSSP`在网络安全经验上的优势无法弥补其对你公司独特环境的理解。因此，它可能会忽略掉内部团队可以轻易察觉的环境异常。由于`MSSP`支持多个客户（一方面，这是一个积极因素，因为它拥有更广泛的市场视角），你可能会发现投入到公司需求的时间减少了——如果公司完全交出钥匙，这一切都可能导致网络安全状况欠佳。\n\
  \n这是`CFOs`及其团队应该产生重大影响的另一个领域。\n\n财务专业建议\n\n作为组织资源和预算的关键分配者，财务专业人士对网络安全文化有很多贡献，特别是帮助`CISOs`及其团队使用业务语言。这需要放弃不适用于网络安全的语言——特别是“投资回报率”。一旦`CFOs`减轻`CISOs`回答不可能问题的负担，团队就可以认真合作定义网络安全投资对业务的价值。\n\
  \n\n\n目标是尽可能高效地降低风险。有很多问题可以引导首席信息安全官（CISO）和首席财务官（CFO）在不同的层面上进行沟通，例如：\n\n*   哪些资产正面临风险？\n\
  *   这些资产的战略价值是什么？\n*   这些资产目前的漏洞水平如何？\n*   一旦发生泄露，后果是什么（财务损失、知识产权泄露、声誉风险）？\n\n为了确保网络安全不是事后才考虑的补救之举，CFO\
  \ 在审查其他领导者提交的业务案例时，应该询问以下问题：\n\n*   新的[市场、内部技术、客户产品等]如何改变公司的攻击面？\n*   它如何改变公司最具战略性的资产的风险概况？\n\
  *   [假设风险有所增加] 需要额外的投资（一次性和经常性的）才能将风险概况降至可接受的基准线？这笔投资是否包含在投资回报率（ROI）分析中？\n\n在`确保资源得到最高效利用的情况下，在以下领域要求\
  \ CISO 提供指标是非常公平的`：\n\n*   对于仍放在架上（闲置软件）的产品，投入了多少网络安全资金？\n*   部署这些产品的计划是什么？\n* \
  \  上一次确保安全产品配置妥的审计是什么时候做的？结果如何？\n*   上一次进行渗透测试是什么时候做的？结果如何？\n*   上一次对所有员工进行网络安全培训是什么时候做的？结果如何？\n\
  \n接下来，作为采购领导者，`财务专业人员引导组织通过降低第三方风险来缓解关联性泄露`。从对所有第三方进行全面盘点开始（根据 Ponemon 的研究，只有 34%\
  \ 的组织表示他们拥有此类清单 9）。从那时，对网络安全防御和实践进行审计。坏消息是，这可能花费大量的精力和时间。好消息是同样的审计问题可以用于筛选任何想要成为供应商的新第三方。\n\
  \n问题将集中在多个领域，以评估合作伙伴的网络安全状况，包括：\n\n*   查看第三方如何评估和更新访问权限和权利。\n*   了解他们的业务连续性流程以及测试频率。\n\
  *   检查其变更控制指南，查看其系统的新用户和/或新软件。\n*   明确贵公司与他们之间传输的任何数据将如何被使用、保护以及在适当何时处置（在合同终止时和/或根据合规标准）。\n\
  *   了解他们如何在各种状态下加密数据（静态、使用中和传输中数据）。\n*   评估他们如何对员工进行网络安全意识和卫生守则的培训。\n\n`对于你最具战略性的供应商，考虑每年聘请第三方审计一次他们的安全实践。`\
  \ 筛选供应商是一个极好的第一步。但要确保他们在成为你的客户后，其安全实践不会变得松懈，这需要更加谨慎对待。\n\n最后，要小心你允许第三方宣传关于你公司的任何信息。合作伙伴发布新闻稿宣布他们的业务安排是常见做法。看到公司在自己的网站上到处展示所有客户、供应商和/或合作伙伴的\
  \ Logo 也是正常现象。我是一个营销人员，所以我理解这一点。利用生态系统的力量为所有方增加品牌价值通常是一件好事。\n\n但要保持谨慎。任何想要宣传其与贵公司关系的第三方，都会向黑客揭露他们可能渗透贵公司的侧门和后门。这会向这些网络王国的寄生虫展示如何渗透你的公司，只要他们知道了与你共用一面墙的邻居。如果稍微担心某个想要宣传其与贵公司关系的第三方没有达到你要求的网络安全标准，`不要允许他们宣传`。\n\
  \n这只是一个详尽清单的子集，旨在确保你的第三方在保护组织免受威胁方面像你一样遵守纪律。如果他们真心想赢得你的业务，他们难道不应该同样倾向于保护这笔业务吗？\n\
  \n***\n\n财务和网络安全的领域在表面上似乎并不契合。但深入观察会发现，它们的共同点比最初看起来的要多。从核心上说，网络犯罪是一门大生意——这是 CFO\
  \ 能够理解的。反之，网络安全关乎风险管理——这是另一个财务人员非常熟悉的概念。CFO 可以帮助 CISO 更流利地使用董事会语言（风险管理）。反之，CISO\
  \ 可以帮助采购部门的人在筛选第三方时使用网络安全语言。当这两个职能部门汇合，赞赏彼此的相似性并搁弃差异时，双方都能在合作中变得更强大。毕竟，坏分子已经知道协作的价值了。难道不是是\
  \ CFO 和 CISO 意识到同样的时候了吗？\n\n## 注释\n\n1.  ^(1) McAfee，“网络犯罪的经济影响——并未放缓。”\n2.  ^(2)\
