  \n# 第 3 章 早上，这是你的警示\n\n> 我认为从未故意违反过公司的政策。然而，我认为更大的问题在于政策的沟通并不透明。这些事情经常被管理层忽略，因为他们自己对规则也不精通。我认为由于大多数人并不理解他们的行为在网络安全和信息保护方面的影响。而且公司内部许多人在尝试安全使用技术方面已经尽了全力。但这是几乎每家公司的\
  \ IT 部门都在进行的持续战斗。\n> 受访者，McAfee 在线研究\n\n我从小对权威保持着健康的尊重。我的父母比较严格，他们要求我遵守合理的规则：完成作业；准时回家；整理房间；尊重长辈。这些都是培养一个负责且对社会有贡献的人的基础。\n\
  \n所以当我在周末清晨收到妈妈的语音，说执法人员正在寻找我时，我顾不得抓起电话。\n\n* “艾莉，纳什尔的一位警长刚打来电话在找你。他说你缺席了戴维尔森县的庭审。”\n\
  \n听着妈妈匆忙地提供警长的信息，我的心跳开始加速。\n\n* “妈，这没道理。我离开纳什尔已经 20 年了！我从来没被告诉过要去上庭。”\n\n* “宝贝，我是这么告诉他的。我告诉他你会回电话的。”\n\
  \n我比我丈夫起得早。我打算在他醒来之前快速处理掉这个电话。\n\n我拨打了带有 `(615)` 纳什尔市区的号码。\n\n* “我是约翰警长。”\n\n\n\n\
  \n\n你是否曾经在拨通电话的人接听时感到措手不及？这是一种很奇怪的感觉。你预料会有个回应，但结果并没有。这就是我听到他的声音时的那种感觉。我发现自己在拼命地寻找措辞。\n\
  \n*   “呃，你好，约翰警长。我是艾莉森·塞拉（Allison Cerra）。我听说你今天早上和我妈妈通过了电话。”\n\n他并没有同样无言。\n\n* \
  \  “是的，塞拉小姐。我联系你母亲是因为我们一直在试图联系你。我这里有一张未执行的逮捕令，要求你因 8 月份缺席出庭，需在田纳西州戴维森县（Davidson\
  \ County）的[姓名隐藏]法官面前庭。”\n\n*   “我显示你过去曾居住在纳什尔，是吗？”\n\n权威是一股强大的力量，特别是对于那些终生都尊重权威的人来说。我从小就学到，当权威人士向你提问时，你不要用问题来回答。你只需要直接回答即可。\n\
  \n*   “是的，没错。”\n*   “嗯，我们显示你在 8 月 15 日缺席出庭，有一张逮捕令。”\n\n权威还会强迫你纠正事实记录。这家伙不可能是对的。但我并没有触发“战斗或逃跑”的反应，也没有引起怀疑的警报（以及疑问），相反，我对权威压倒性的服从让我开始解释。\n\
  \n*   “先生，我很抱歉。这听起来不对。我只在 1995 年早些在纳什尔住过几个月。8 月份我甚至不在纳什尔。”\n*   “塞拉小姐，我不知道该对你说什么。逮捕令是法官签发的。你得和她处理。”\n\
  \n现在故事开始发生了意想不到的转折。因为你本以为，如果这家伙是个骗子，他会立刻开始他那套“但如果你把信用卡号码给我，我一定能帮你解决这个问题”的推销，那无疑会让我的警报瞬间大作响。\n\
  \n但他完全没那么做。他只是不断向我提问以验证我的背景。\n\n而我一直在回答。\n\n*   “我显示你住过这个地址，对吗？”\n*   “是的，先生。没错。”\n\
  *   “我显示你现在住在丹顿县（Denton County）。对吗？”\n*   “是的，和我丈夫在一起。”\n\n注意看我如何完全处于权威的掌控之下，回答问题的提供的甚至比要求的还要多。这家伙拿捏了我。\n\
  \n大约这时，我丈夫从卧室出来，揉着眼睛上的睡意，但他足够敏锐，意识到我在打一个严肃电话——而且听起来不像工作电话。\n\n*   “怎么了？”\n\n警长还在和我确认信息。我匆忙把他静音，好让我丈夫了解一下早上发生的事情。\n\
  \n*   “妈妈来电话了。她接到一个纳什尔警长的电话，说我因为缺席出庭被发了逮捕令。我现在正和他通话，试图解决这件事。”\n*   “这怎么可能？你没在那儿住很久了。”\n\
  \n（现在我开始对我丈夫感到不耐烦，因为他说了显而易见的事。）\n\n*   [咬牙切齿地] “我知道。这就是为什么我正试图解决这件事。”\n\n然后，我半睡醒的丈夫问了一个我在拨那个号码之前本应该问问自己的问题：\n\
  \n*   “你确定这家伙没在骗你吗？”\n\n你知道吗，当念头如此飞快地涌入脑海，你甚至能在几纳秒内回放生命中的最后几分钟？在我情况下，那是从我第一次接到妈妈的信息以来的\
  \ 30 分钟，而此刻我正在脑海中重演。在那 30 分钟里的第一次，我有了前所未有的清醒。\n\n我的大脑一片空白，心脏现在由于完全不同的原因而狂跳。“某某警长”还在喋喋不停，而我的“战斗或逃跑”反应终于启动了。我试图整理思绪，重新启动那个失灵了的大脑。\n\
  \n*   “警长，我确定这是个误会。感谢你提醒我。我会回电话给你解决这件事。”\n\n我想挂掉电话。他表现得出奇地配合。没有拼死要我的信用卡号。没有威胁说警察会在几分钟内就上门抓我。\n\
  \n*   “没问题，塞拉小姐。我理解。你可以拨这个号码回给我。”\n\n嘟。\n\n我还没挂掉电话，我丈夫已经拿着手机拨通了戴维森县警局。\n\n你可能已经猜到故事的结局了。那里并没有什么约翰警长。正如我并没有什么缺席出庭的逮捕令——或者说任何什么一样。显然，我丈夫电话那头的真实警察证实，这种诈骗非常流行。\n\
  \n*   “我们每周至少会接到一个这样的电话。这是骗局。告诉你你妻子，如果发逮捕令，我们是不会那样打电话的。我们会直接出现在你家门口。”（废话。我觉得自己像个傻瓜。）\n\
  \n但，为了保险起见，我去了我当地的派出所，确认这个负责任且对社会有贡献的成员记录中没有任何污点。我带着那份深植于心的、经过权衡的权威权威，询问柜台后的警察是否计划逮捕我。当他看着我的眼神，就像我刚从火星降落一样，但他给了我唯一想听到的回答：“不。”\n\
  \n***\n\n你可能会怀疑自己的判断，买一本关于保护公司免受网络威胁的书，而作者竟然刚刚承认自己犯过如此愚蠢的错误。你的想法并不错。毕竟，我已经告诉过你，在事情发生后我觉得自己像个傻瓜。\n\
  \n在我们过度严厉地评判我的行为之前，请考虑一下，我的故事只是一个例子，每天都有成千上万个像我这样毫无防备的受害者经历类似的事情。网络安全行业将此类诈骗称为“社会工程学”。\n\
  \n你知道其中一种形式是“网络钓鱼”（phishing），即网络罪分子发送恶意邮件，伪装成受害者圈内受信任的权威人士，要求他们提供敏感信息或点击链接。我们已经在某种程度上低估了网络钓鱼或其创造者的巧妙性。网络钓鱼早已不同于“救命，我是一个尼日利亚王子，我需要钱”的时代。光是\
  \ McAfee 在 2018 年就检测到了一百万个新的网络钓鱼 URL。(1) 这些就是附在那些恶意邮件中、为了让你上钩的 URL。\n\n正如我的经历证明的，社会工程学已经超越了数字领域。我在这个行业工作，所以我学会了寻找那些网络钓鱼邮件。但我没预料会有这种通过电话的老派尝试。\n\
  \n犯罪分子不需要很高明就能奏效。他们知道信任是我们社会中不可或缺的成分。他们还知道我在成长过程中并不孤单。我们许多人都是负责任、对社会有贡献的成员。我们通过尊重和信任这些传统价值观学会了成为现在这样。\n\
  \n我最希望我们我们任何一个人屈服于在这个世界上已变得司空见惯的恐吓手段。信任对于进步至关重要。然而，在不过度信任的前提下，我们也可以避免过度恐惧。这是一条微妙的界线，就像我们在揭开网络安全这一复杂课题时所发现的许多其他界线一样。\n\
  \n不必急急冲撞地陷入某种所谓的黑客会夺走我们所有东西的末日预言，有一个清醒的现实是我无法再夸张了，那就是：对于任何读这本书的个人贡献者来说，你都是公司对抗网络犯罪战斗中最坚强或最薄弱的环节之一。\n\
  \n考虑一下这句话的力量。行业分析机构 Gartner 预测，2018 年全球公司在网络安全产品和服务务上的支出超过了 1,140 亿美元。(2)\n\n\n\n\
  \n然而，这种投资并不能替代员工做正确的事以及把事情做对。\n\n## 最好的防御\n\n数千年来的军事史记录表明，最好的防御是良好的进攻。这解释了为什么乔治·华盛顿在退休后仍然将这一经受时间考验的军事建议写在他的著作中，而当时他领导这个稚生的国家在独立战争中取得胜利已经过去了近四分之一。在与对手竞争时，这是一条可靠的指示。先取血血，你的对手在防御自己上的精力将超过攻击你的。在体育运动中，球队努力在比分牌上得分，以赢得比赛的初始势头。在商业领域，公司寻求在推出新产品或服务时获得先发优势，以占据早期市场份额。\n\
  \n在网络安全领域，公司其实并没有所谓的“良好的进攻”。这是因为根据定义，公司并不是率先发起攻击的一方。那是对手的工作。对手 `always` 拥有先发优势。他们应用了这条对声誉良好的类别非常适用的公理：我们的公司注定要永远进行防御。在网络安全领域，最好的防御是良好的（即使不是卓越的）`defense.`\n\
  \n我之前提到过，我相信大多数员工都想帮助保护自己的组织。他们只是不知道如何有效地发挥自己的作用。\n\n但假设我是错的吧。假设一下，你对公司没有任何利他主义动机。这并不是说你希望公司遭受损害。例如，你不会故意把你的雇主推到公交车下。但也许你也是那种不会为了公司而挡在行驶车辆前的人。\n\
  \n这会使你属于一个冷漠的旁观者群体。你认为你的公司在网络安全上花了足够的钱。他们雇了人来做防御工作。如果你渴望从事那个领域，你本会去寻求相关的学位和工作来完成它。但你没有。你在公司的另一个领域工作，你认为网络安全工作是由（也应该由）其他部门处理的。如果公司确实遭受了数据泄露，假设你最终不是被发现负责这件事的人，那么这真的不是你的问题。他们会支付罚款，可能会失去一些客户。但生活和工作仍会继续。\n\
  \n如果你发现自己处于这一类，你并不孤单。事实上，在麦菲（McAfee）对像你这样的员工进行的在线民族志研究中，当我们提出以下问题时，我们听到了类似的感触：\n\
  \n*   `一线员工在维护组织网络安全中起着什么作用？你认为你扮演的是关键角色还是背景角色？`\n*   访问者 1：`我认为我在公司的网络安全中起的作用非常微小。我觉得对我来说，意识到我能如何帮助保护公司信息很重要，但整体的高层安全应该由公司里更高级别的员工来解决。`\n\
  *   访问者 2：`更多是背景角色，因为我们的 IT 部门处理了所有的幕后网络安全工作。`\n*   访问者 3：`我认为我扮演的是背景角色。第一道线是我们\
  \ IT 团队的技术，然后是我们的 IT 团队本身，然后是普通员工。`\n\n似乎至少有一些员工认为，网络安全应该留给 IT 内部的工具或团队，或者上交给公司的高层。这两种观点都存在一个这里的问题。\n\
  \n首先，没有足够的网络安全人员来应对这一问题（回到我在上一章中提到的网络安全人才短缺问题）。网络安全需要全员投入。\n\n其次，如果你认为你公司的那些权贵人物最适合解决这个问题，请不要那么确定。是的，CEO\
  \ 和董事会有责任从上而下设定一个涵盖网络安全的基调。但 60% 的 C 级领导和 IT 高管表示，直接负责信息安全的人并不是董事会成员.^(3)\n\n组织中网络安全这种推卸责任的心态如此盛延是可以理解的。网络安全行业定义了一种被称为“泄露疲劳”（breach\
  \ fatigue）的状态。当我们允许环境中的泄露噪音麻痹我们的紧迫感时，就会发生这种情况。我们要么相信别人最终会代我们付出代价（尽管消费者最终通过更高的价格承担了泄露的后果），要么因为假设我们个人对防止泄露已经无能为力，从而放弃了我们对自身命运的真正控制权。\n\
  \n这本书试图通过提供你可以采取的实际步骤来帮助你的公司防止泄露，从而解决后一种观点。那是关于给你你可以 `do` 的 `what`。如果你发现自己处于前一个阵营，请让我花点时间告诉你\
  \ `why` 你应该 `care.`。\n\n几周前，我收到了来自人力资源部门某人的封邮件。她转发了一封发到她个人邮箱的邮件。那封看起来是我发的。邮件要求她回复如何更改我自动工资存款的指令。发件人的邮箱地址来自个人邮箱，推测是我的。\n\
  \n幸运的是，她的蜘蛛直觉起了作用，她将邮件转发到了我的工作邮箱，并附带了一个简单的问题：\n\n*   `Allison，我今天收到了这封邮件。你能确认是你发出的吗？`\n\
  \n我很快就回复了一个断肯的“不是”。我们向安全运营中心 (SOC) 报告了这一事件。他们追踪了那封邮件，发现一个黑客入侵了她的个人邮箱账户。\n\n我很确定，如果我去查看那位\
  \ HR 员工的职位描述，它不会提到将“网络安全”作为一项要求或预期。我敢打赌，它不会包含要求她警惕员工身份的网络威胁作为核心职责的语言。直接联系我以确认她收到的邮件是否真实，并不在这个个人的“职位描述”范围内。然而，这正是她所做的，她的明智判断和关注让我受益浅。她的培训阻止了从我们内网网站上复制并粘贴指令，那些指令解释了更改直接存款是多么容易。我惊叹自己的幸运，由于她的直觉让那个黑客的工作变得困难得多。而且她让我节省了在试图扭转糟糕结果时所花费的无法估量的挫败时间。对我来说，危机化解了。\n\
  \n有时，黑客的目标不仅仅是我们的公司。有时，他们针对的是我们。我们的雇主拥有关于我们每个人的信息，包括社会安全号码、银行账户详情（正如我的直接存款示例所示的那样）以及其他。近期历史上针对员工记录最著名的泄露发生在美国政府，当时其人事管理局\
  \ (OPM) 遭到入侵，泄露了超过 2150 万条记录。在对手收集的战利品中？包含了可能不是现任或前任员工的广泛背景信息.^(4)\n\n\n\n\n\n如果这仍然不足以说服你关注，那么看看这个：数据泄露对贵公司而言的风险从未如今日这般高。这归功于监管机构的不断施压，以激励公司保护客户数据。《通用数据保护条例》（`GDPR`）适用于所有在欧盟（EU）开展业务或监控其境内数据主体活动的所有公司。如果被发现不符合\
  \ `GDPR` 关于收集和保护客户数据的标准，公司可能会损失全球年收入的达 4%。2018 年，Ponemon 报告显示数据泄露的平均成本为 386 万美元——而这很大程度上是在\
  \ `GDPR` 实施之前得出的结果。(5) 任何在欧盟开展业务且全球年收入超过 1 亿美元的公司，已经可以预见到，为违反 `GDPR` 的泄露事件将支付更多费用——取决于其收入情况，可能会要多得多。\n\
  \n数据泄露的风险是巨大的。数据泄露的成本甚至更高。不要因为贵公司过去可能幸免于之前的泄露，就假设它能从下一次泄露中幸存。即使它生存了下来，财务压力也可能导致其他后果，甚至可导致裁员。如果你倾向于保留现有工作并看到公司持续经营，你必须假设将网络安全视为你工作描述的一部分。敌人最喜欢看到你表现出极度的冷漠。\n\
  \n## 员工的 W.I.S.D.O.M. 指南\n\n根据威信电信的《2018 年数据泄露调查报告》（`DBIR`），员工直接或间接负责了所有泄露的四分之一以上。在超过\
  \ 60% 的案例中，责任源于一名疏忽的员工。这意味着近 20% 的泄露都是源于疏职员工之手。(6) 这就是员工一直是公司网络安全防御中最强或最薄弱的环节之一。\n\
  \n幸运的是，员工可以采取许多步骤成为网络安全解决方案的一部分，而不是问题所在。首先，要对社交工程诈骗保持警惕。网络犯罪知道如何利用员工的信任。而且他们的方法正变得更好。鱼叉式钓鱼（Spear\
  \ phishing）是一种通过恶意通信（如电子邮件）专门针对某些个人或公司的战术。与传统的钓鱼（网络犯罪分子使用的更多是“撒网式”策略，换句话说，几乎或完全没有针对性）相比，鱼叉式钓鱼活动有效得多，因为犯罪分子会极力对信息进行个性化。\n\
  \n大鲸钓鱼（Whaling）是鱼叉式钓鱼的一种类型，对手伪装成公司的高层高管（如 `CEO` 或 `CFO`），并要求毫无防备的员工采取行动。例如，伪装成 `CFO`\
  \ 的犯罪分子可能针对财务部门的基层员工，要求其将公司资金转入某个账户。\n\n社交工程是敌人针对天真员工最有效的武器之一。根据威信电信的 `DBIR`，4%\
  \ 的人会点击任何特定的钓鱼活动。可能最令人惊讶的是，这些受害者并不倾向于从错误中吸教训。某人点击的钓鱼邮件越多，他再次点击的可能性就越大。(7)\n\n社交工程在组织的多个层面都非常有效。2018\
  \ 年，《福布斯》（`Forbes`）报告称，虽然 `CEO` 和 `CFO` 经常成为目标，但许多钓鱼攻击是针对普通员工设计的。网络世界日益变成一场变装舞会，充满了互联网所承诺的所有魔力和光彩。但随着时间的推移，这场派对变得越来越拥挤，充斥着伪装日益复杂的钓鱼等威胁。你对这种威胁的警惕性也必须随着时间的推移而增加。\n\
  \n\n\n\n最后，在网络安全防御方面，良好的卫生习惯是不可替代的。有时，最有效的措施也是最容易采取的。可能没有比医疗行业中的例子更能说明这一点了。在 19\
  \ 世纪，匈牙利医生伊格纳斯·塞梅尔尔维斯（Ignaz Semmelweis）试图解决一个谜团。他想知道为什么产房里这么多女性在分娩后死于发热。特别是，他注意到，由全男性医生照料的病房死亡率明显高于由全女性助产士照顾的病房。在经历了大量的实验后，包括改变妇女分娩时的姿势，甚至要求司祭在吊奠最近去世的母亲时避开病房内的幸存者（以防这些司祭的出现会让其他母亲受惊而导致致命的发热！），塞梅尔维斯得得了答案。\n\
  \n事实证明，男医生进行了尸剖，而女性助产士没有。在进行尸剖后，同一位男医生可能负责分娩，在此过程中将他解剖过的尸体上的颗粒传染给母亲。塞梅尔维斯坚持要求这些男医生用氯溶液（而不仅仅是肥皂和水）清洗手和器械，以完全清除手上的任何尸体颗粒。他当时对氯作为消毒剂并无所知，他只是这能非常有效地消除医生手和器上与尸体残留物相关的难闻气味。尽管距离发现细菌还有几十年的时间差，但塞梅尔维斯的新方案仍然是高明的医疗手段。结果，男医生护理病房中产产热的女性死亡率随之下降。对我们来说幸运的是，他的偶然发现为医学死亡率的降低铺平了道路。\n\
  \n直到今天，洗手仍然是公共卫生领域最强大的工具之一——从预防手术感染到避免流感都是如此。这确实需要自律。但对于洗手间的使用者来说只需要几秒钟（对于手术专业人员来说只需要几分钟），就能有效地保护自己免受环境中大量细菌和病毒敌人的侵害。\n\
  \n效仿医疗专业人员的做法，员工可以采取常识性的卫生措施保护公司免受各种敌对威胁。是否曾经允许网站自动保存密码，或使用你的手机或笔记本电脑来存储密码？不要这样做。在我能提供的一个案例中，一名员工使用她的移动设备存储她所有的密码，包括她\
  \ `O365` 邮箱账户的密码。网络犯罪分子破解了她的移动设备并盗取了 `O365` 凭据。这些被破解的凭据被用于访问她的 O365` 账户，黑客发送了伪装成该员工合法邮件的钓鱼邮件给\
  \ `O365` 通讯录中的许多高管和其他员工。凭据窃对于组织来说特别难以检测。毕竟，从所有角度来看，对员工 `O365` 账户的访问看起来都是合法的。直到勤奋的员工（攻击者邮件营销的接收者）发出警报，威胁才被发现并遏制。\n\
  \n我理解密码管理很困难。我们的大脑并不是为了记住跨设备、网站和应用程序的数百个密码而构造的。糟糕的是，良好的网络安全卫生要求定期更改这些密码，这使得记忆变得更加困难。\n\
  \n市场上有很多如密码管理器之类的工具可以帮助你生成和检索复杂密码。如果某个工具不可取，你需要使用助记法来帮助记忆。例如寻找一个好记的短语（`Jack and\
  \ Jill went up the hill to fetch a pail of water`），使用每个词的首字母（`JaJwuthtfapow`），使用大写和小写字母及符号的组合（`J@Jwuthtf@pow`）并为了保险加上一个数字（`J@Jwuth2f@pow`）。根据网站\
  \ `HowSecureIsMyPassword.net`，我刚刚创建的密码计算机大约*三百万年*才能破解。\n\n密码管理对于良好的网络安全卫生至关重要。遗憾的是，这种做法远没有达到应水平。直到\
  \ 2018 年，在某州，使用 `Password123` 作为密码的政府官员接近 1500 人。这简直是让黑客的工作变得更容易了！\n\n其次，对物理安全的关注要像对在线安全的关注一样。正如我在上一章中提到的，物理安全和网络安全的世界正日益融合。网络犯罪分子在攻击中不仅针对物理基础设施（包括电网和制造设施），被攻破的员工设备也是网络犯罪分子进入公司系统的快速通道。\n\
  \n历史上最著名的国家级攻击之一 `Stuxnet` 是通过一个被攻破的 USB 设备发生的。一个 USB 设备让美国政府通过访问伊朗核离心机，推迟了伊朗的核化。正如我一直所说的，网络攻击并不一定依赖下一代技术才能生效。\n\
  \n所以你不是那种在核设施工作的人吗？很有可能你至少拥有一台用于办公的电脑。如果你和美国 25%的员工一样，你会在一天结束回家时让那台电脑处于开启且未锁定状态。这等同于用完厕所后不洗手！\n\
  \n最后，但同样重要的是，在访问或传输敏感数据时，请使用公司的虚拟专用网络 (`VPN`）。公共 `WiFi` 网络是心机勃勃的犯罪分聚集地。这一领域的网络安全卫生非常薄弱——即使在网络安全专业人员中也是如此！在行业最大的年度活动\
  \ `RSA`（每年吸引超过 4 万名网络安全专业人士）上，自称是黑客的 `@Grifter801` 推文说，他在活动开始后约 26 小时内就收集了超过 33,500\
  \ 个非加密密码。\n\n\n\n\n\n## 参考文献\n\n2. ^(2) Gartner 新闻稿，“Gartner 预测 2019 年全球信息安全支出将超过\
