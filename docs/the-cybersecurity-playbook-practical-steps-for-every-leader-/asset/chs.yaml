  8.  ^(8) EY 全球信息安全报告 2018–19, [`www.ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf`](https://www.ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf)\n\
  9.  ^(9) Ponemon Institute, “第三方生态系统中的数据风险——年度报告”, 2018 年 11 月。\n\n\n\n\n> 对于任何公司来说，一个非常大的问题是，他们的用户（即那些业务人员）可以随心所欲地购买东西。他们不知道自己在做什么，也不真正在乎。他们看着一个软件软件包说：“哦，我想要那个。它能帮我完成工作。”他们根本不在乎——他们甚至没有考虑过安全方面的因素。在很多情况下，他们甚至可以直接加载并使用它。从网络安全的角度来看，这是一个巨大的风险。然而，阻止他们是不可能的。\n\
  > — 某制造型公司首席技术官\n\n幸运的阿莫斯。他可能嫁给了一个骗人的杀人犯，但至少那个女人得到了她应得的报应，在监狱里度过了余生的后半。至于阿莫斯呢？他快乐地再婚了。他们共同拥有了一个美丽的家庭。他在事业中找到了幸福和成就感。尽管在道路途中仍然遇到生活中典型的挑战，但他每次在克服挑战后都能使自己变得更强大、更聪明。对自己的价值更加确定。对自己的身份更有安全感。不再满足于社会看穿他、从他身边走过，却完全不知道他的存在。\n\
  \n***\n\n对于我音乐剧《芝加哥》的粉丝们，你们知道我为阿莫斯虚构了那个童话般的结局。在音乐剧中，他能期待的最好结果也就是在离开舞台之前，得到他妻子那个卑鄙律师瞬间即逝的认可——故事就此结束。\n\
  \n但他不必离开我的想象。在我为阿莫斯写的结局中，我正在重写他的未来。为什么他不能过上美好的生活呢？在我的脑海中，阿莫斯将悲剧化为胜利，夺回了自己的命运。他意识到自己的价值比别人所认为的要高得多。他迫使他人承认他的价值，拒绝安静地退缩到阴影中。\n\
  \n同样，我希望首席安全官（CISO）们也能重写他们的未来。这将要求他们学会董事会的语言。这将意味着他们放宽对员工的束缚，以获得对环境*更多*的控制。并且强制要求他们作为公司所需的文化领袖，拿起武器。\n\
  \n## 一图胜于千言\n\n在《大脑法则》（*Brain Rules*）书中，约翰·麦迪纳（John Medina）指出：“我们不是用眼睛看世界。我们是用大脑看世界。”^(1)他提到了一项迷人的研究，葡萄酒专家被给了混合了红色的、无味无臭染料的白葡萄酒。当然，受试者并不知道研究人员以这种方式处理白葡萄酒。后者想衡量视觉在影响所有其他感官方面的力量。爱好者会依靠其他感官（包括味觉和嗅觉）的结合，来识破近在鼻子底下的伪品吗？\n\
  \n事实并非如此。当品酒师遇到伪造的红酒时，他们使用与正品红酒相关的词汇来描述他们的体验。正如麦迪纳在书中所述的：“视觉处理不仅是*辅助*我们对世界的感知。它*主导了*我们对世界的感知”^(2)\
  \ [作者强调]。\n\n也许这就是为什么我们的商业世界充斥着视觉线索。我们有反映绩效的评分卡，有用于分享信息的华丽演示，还有提供对跨职能领域众多指标即时反馈的实时仪表板。\n\
  \n当麦菲（McAfee）2017 年从英特尔剥离成为独立公司时，我们的首席执行官杨力（Chris Young）迅速动员收集并分析了跨公司的关键指标，以便他对业务业务有全面的视野。我非常激动能展示营销和传播团队代表麦菲交付的成果。我坚信我们至少有一个有趣的故事可以分享——我们在生成可行销售管道方面正积累势头，我们的品牌建设工作也开始结硕成果。\n\
  \n我如职地周周复复提交提交团队的仪表板。克里斯是一个非常投入的领导者，对细节有着严谨的观察。因此，我会经常收到他关于团队表现的问题。这些问题指导了我们在下周的提交中应包含哪些额外信息。这种良性循环就这样持续下去。\n\
  \n直到有一天，我意识到我的团队仪表板中缺少了某些东西。在我们的情况下，那并不是一个数据点或指标。而是*信号*。仪表板由于提供过多细节而导致噪声淹没信息，这并不令人感到意外。但在我们的案例中，情况并非如此。我们审慎地修剪了指标，以确保我们不会因为过多的干扰而与自己竞争。\n\
  \n相反，由于没有通过仪表板中包含的视觉图表来服务最核心感官——视觉，我们制造了太多的噪声。\n\n这个启示是通过克里斯本人传给我的。事实证明，克里斯讨厌我们时代最流行的图表之一（在我团队仪表板上）——饼图。起初，我以为他只是在挑剔。然后我意识到，他的这种蔑视并不孤单。\n\
  \n通过简单的 Google 搜索就能发现许多人对饼图的蔑视。有些人认为它是数据可视化界的“Nickelback 乐队”^(3)（向任何读到此处的硬核 Nickelback\
  \ 粉丝道歉！）。如果那种音乐不是你的菜，而你更青睐漫画英雄，批评者则说它是图表中的“海卫王”。正如他们所论的：当超人可以完成他所做的一切并做得更多时，你真的需要海卫王吗？^(4)\n\
  \n克里斯的说法更委婉一些。饼图通常包含过多的信息，挤在微小的切片中，没有任何数据随时间变化的视角。饼图只做一件事——且仅一件事——将某物作为整体的一部分来表示。其他图表，如堆叠柱状图，也同样如此——*而且*它们展示了随时间变化的趋势视角。\n\
  \n我使用这个例子是为了强调 CISO 必须精通另一种语言的需求——即 CEO 和董事会的语言。我并不是在说 CISO 是美国企业界中所谓的“海卫王”，只是说他们负担不起仅留在自己领域的专家。为了成为公司的超级人和超级女，他们可以从饼图中中学一些教训：\n\
  \n*   如果视觉是关键感官，那么董事会就是一个 3-D IMAX® 影院。视觉效果必须经得起推敲。这不是一本关于演示风格的书。尽管如此，研究信息的传递如何影响其影响可以追溯到亚里士多德时代。如果传递一个不迷失在图形和/或非语言干扰杂声中的吸引人的信息并不是你的强项，请利用资源在这个领域磨练你的斧头。^^(5)\n\
  \n*   接下来，CISO 是董事会里比喻性的游客。学会董事会成员的母语是来访客 CISO 的责任。\n\n*   除了精通典型的财务指标（收入、利润、现金流等）之外，董事会说的是风险语言。CISO\
  \ 通常说的是攻击语言。虽然两者相关，但存在明显的区别，这需要由 CISO 来建立联系。\n\n    让我解释一下。CISO 有多种框架来检查环境中的威胁。这些模型剖析了攻击的构造——这是\
  \ CISO 评估对手如何以及何时移动的至关重要且具有挑战性的工作。如果 CISO 理解敌人在攻击生命周期中的方式，他就可以用相应的战术、技术和程序来防御组织，并通过将几种攻击框架应用于公司的网络安全防御来发现环境中的漏洞。\n\
  \n    相比之下，董事会处理的是风险管理（例如：可能会发生什么错误）。他们这样做是更大对话的一部分，包括公司战略（我们将创造价值？）、业务模式（战略如何转化为价值？）以及关键绩效指标（我们如何衡量绩效？）。^(6)\n\
  \n\n\n\n当然，对公司发动网络攻击意味着风险，有时甚至是是巨大的。但请注意，首席信息安全官（CISO）必须建立至少两种关联，才能将他们的语言转化为董事会的语言。首先，他们必须将从“风险”到“策略”的珍珠串起来。一个脱离了战略重要性、价值创造或公司衡量标准的风险，等同于给董事会展示了一张你们结果的饼图——它只显示了全景中的一小部分。\n\
  \n其次，CISO 必须将“威胁”转化为“风险”。这需要理解董事会对优先级资产的风险容忍度、潜在攻击如何挑战这种容忍度，以及可能导致的后果（财务或其他）。\n\n\
  如果这看起来像是一个高标准，那确实如此。斯坦福大学报告称，大多数公司没有将风险管理与策略相结合。此外，50% 的公司没有建立企业风险管理制度。对 CISO 来说好消息是什么？当你用董事会的语言有效沟通公司的网络安全状况时，你将成为这些规则中令人惊喜的例外。\n\
  \n正如我在第二章中所证的那样，CISO 应该获得进入董事会的机会。但一旦 CISO 门入门，他构建和传达信息的方式可能会决定他是否会被再次邀请参加会议。学习董事会的语言和风格，以避免和那些单维的饼图一起被抛弃。\n\
  \n## 舍小取大\n\n2014 年，企业正在失去控制。它们正被一场全员参与的战斗运动所吞噬；IT 部门被其愤怒所消耗；安全部门则深陷其准准星之中。这种疯狂的核心是什么？嗯，心存良好的员工要求在工作场所获得与他们在家里所期待的一样的全天候、按需云技术访问权限。到\
  \ 2014 年，裁决已经做出。“IT 消费化”趋势绝非过之风。它将长期存在。\n\n同年，IDG Enterprise 研究了这一现象对组织的影响。当时，40%\
  \ 的公司预测，工作场所中对消费化技术的痴迷会带来负面的安全后果。他们的担忧是有根据的。考虑这个滑坡效应：2014 年，90% 的组织报告称，员工在工作时使用消费者或个人服务——其中\
  \ 41% 未经 IT 部门的批准。\n\n意所当然的是，相关组织致力于采取行动。超过半数的公司制定了在移动设备上和或通过云服务访问和共享公司数据的政策。约三分之一的公司投资了安全文件共享服务。另一些公司则实施了经过许可的企业协作工具。\n\
  \n快进几年，看看 McAfee 的《2019 年云采用与风险报告》。McAfee 并没有询问受访者对云消费的意见或计划（云是 IT 消费化趋势的一个巨大组成部分），而是检查了云端实际上到底有多少文件是安全的。（我们通过查看每个文件设置的企业级策略来实现这一点。例如，企业确定文件的敏感性，我们使用匿名、聚合后的数据来判断使用情况是否符合策略。）\n\
  \n结果表明，这列失控的消费化 IT 火车在前段时间就偏离了轨道：\n\n*   云端所有文件中有 21% 包含敏感数据。这一数字正在上升——在过去两年中增加了\
  \ 17%。\n*   在云端共享的敏感数据文件数量也在增加——短短一年内增长了 53%。\n*   92% 的组织拥有被盗取的云凭据在暗网上出售。\n\n除了\
  \ 2014 年发生的爆发式 IT 消费化运动外，还有另一场竞赛正在进行。开发者越来越多地使用公有云环境为公司创建应用程序。\n\n这就是确保云安全变得更加棘手的地方。正如\
  \ CISO 所知，随着他们从软件即服务 (SaaS) 转向平台即服务 (PaaS) 再到基础设施即服务 (IaaS) 云变体，其承担的风险更多。虽然这三者的数据保护是一致的，但随着公司从一种模式转向另一种模式，CISO\
  \ 在确保云底层基础设施组件安全方面承担了更大的责任。\n\n例如，同样的 2019 年 McAfee 云报告显示，平均每个企业都存在 `IaaS` 或 `PaaS`\
  \ 配置错误。这些错误导致必须为了保护数据而保护的公有云基础设施处于开放状态。\n\n需要明确的是，这些安全漏洞不应归咎于云提供商。这些错误源于在使用这些服务却不知如何保护安全的公司。我已为每个组织利益相关者提供了指导性建议，说明他们如何为公司的整体安全出力。但你不会发现我建议员工停止使用他们喜爱的云服务。因为我知道这种建议将充之于耳。在企业\
  \ IT 服务追赶上普通用户所拥有的体验之前，员工将继续使用后者。他们只是在没有 IT 知情、更不用许可的情况下这样做，这使得挑战变得更加巨大。\n\n## 承担职责\n\
  \n几个月前，我的办公室里非常热闹。有人在到处张贴传单，上面写着这样一条信息：“我们需要更大的船。”《大鲨》爱好者立即看出了对电影的引用。但除此之外，对于我们在陆地上工作的\
  \ McAfee 员工来说，这可能意味着什么完全没有任何解释。\n\n流言风语充满了疯狂的猜测。我们要搬到更大的办公室了吗？我们要合并或收购某家公司了吗？停车场要扩建了吗？（是的，办公室停车有时确实很有挑战性。）\n\
  \n当我们发现信息背后的幕后手手时，非常惊讶——竟然是我们的 CISO 组织。这次预热活动启动了 McAfee 全公司范围的网络安全意识刷新计划。具体来说，“更大的船”的引用是对“钓鱼”（phishing）的双关语（真巧妙！）。当\
  \ CISO 组织向员工发送钓鱼邮件时，确实有人上了鱼钩。当他们上钩时，他们会被提醒错误，并被鼓励向安全团队报告所有可疑邮件（通过我们电子邮件应用程序中一个方便的“报告钓鱼”插件来实现，该插件也与活动的同步发布）。\n\
  \n我们的 CISO 走得更远。每位执行团队成员每月都会收到关于其团队表现的报告。他的团队有多少百分比的人钓了鱼？在没有钓的人中，有多少百分比的人采取了额外的主动行动，将那封可疑的种子邮件报告给安全团队？\n\
  \n\n\n随着活动的持续，校园内的告示牌转变为关于如何识别和报告钓鱼攻击的提醒信息。全公司的意识得到了提高。领导者们（包括我）利用这些报告对我们的团队提供了建设性的反馈，告诉我们应该如何改进，或者在哪些方面继续保持良好表现。\n\
  \n我甚至发现自己处于更加高度警觉的状态，等待发现来自安全团队的“钓鱼”邮件并准备好立即报告。某天早晨我出门上班时，检查了手机看是否有需要立即处理的邮件。我看到一封来自我们首席执行官\
  \ Chris 的邮件。但我一眼看出太不对劲。它要求我通过邮件回复他，因为他无法电话联系上我。\n\n当我抓起钥匙冲出门门时，我心里想：*公司那次钓鱼活动开始得非常巧妙。但这封来自\
  \ Chris 的伪造钓鱼邮件真的很糟糕。太容易识别了。*\n\n我一到办公室，就尽职地报告了那封钓鱼邮件。令我惊讶的是，我并没有收到安全团队通常的祝贺弹出消息，说我通过了测试。*真奇怪。我需要告诉他们他们的响应速度有问题。下次我见到我们的\
  \ CISO 时，我会提一下的……*\n\n但我没有那个机会。因为在不到 10 分钟内，我收到了来自安全团队的一封邮件。但并不是我预想中的那封“做得好，发现了伪造钓鱼邮件”的邮件。事实证明我报告的是一封真实的钓鱼邮件。我们的网络安全团队在几分钟内对其进行了调查，并给出了立即采取的步骤，以防我*真的*回复了邮件（但我并没有回复）。\n\
  \n你可能会预期营销或人力资源部门会开展这样的多维度活动活动。你可能不会立即以同样的眼光看待安全团队。但如果我们的 CISO 及其团队不承担起传播文化的责任，他们又怎么指望业务伙伴在网络安全方面做到同样的事情呢？为了让网络安全文化生根，CISO\
  \ 必须比他们多走出一步。\n\n## 给网络安全专业人士的 W.I.S.D.O.M.\n\nCISO 在其行业的最佳实践方面拥有丰富的资源。这套 `W.I.S.D.O.M.`\
  \ 并不是为那些寻求深度技术建议的人准备的。但这并不降低它的重要性。这份处方是关于将你的价值与业务价值联系起来。它要求 CISO 既要涵盖基础工作，又要跨越部门的边界。\n\
  \n**良好的网络安全卫生是不可妥协的。** CISO 必须确保基础工作到位，并将网络安全卫生置于“待办事项”列表的首位。这是一个常识并不总是那么普及的案例。在迄今为止最大的泄露事件之一，失败是因为一个未修补的已知漏洞。关于这次攻击的后分析更有趣的一点是：用于通知安全管理员漏洞的邮件名单忽略了那些“需要知道”的人。因此，未修补的漏洞导致了泄露。而过时的安全管理员邮件分发组导致了未修补的漏洞。这只是说明对于网络安全专业人士来说，细节决定败的一个显著例子。\n\
  \n由于你的基础设施在物理和虚拟方面都在不断扩大，合理的补丁管理需要对所有在使用或未使用的服务器进行清点。僵尸服务器（即至少六个月未使用的服务器）数量为 `9`。\n\
  \n\n\n这场长期的争论揭示了 `CISOs` 和 `CIOs` 必须在精神上一致，而不仅仅是法律的字面上。这要求 `CISOs` 在指标和目标上与 `CIOs`\
  \ 合作，无论前者是否汇报给后者，还是两人坐在同一张桌子上的同级人员。特别是，适当的网络安全卫生——包括补丁、备份、多因素身份验证等——必须在每个规划周期的开始建立并达成一致。如果这两个职能共享预算，领导者必须识别并分配哪些部分用于\
  \ `IT`，哪些用于网络安全。除了为每个部门划分运营预算外，或许任何新的 `IT` 项目都应被赋予网络安全税，以资助和保护新技术。正如其他职能讨论的那样，`CISOs`\
  \ 和 `CIOs` 应就关键性能指标 (`KPIs`) 和服务水平协议 (`SLAs`) 达成一致，以便优先优先解决争议。\n\n最后，单管理这个列表是一项挑战性工作（这也是网络安全卫生难以执行的原因之一）。对你的环境进行定期渗透测试，最好使用第三方。这些公司将帮助你在坏人行动之前发现未知的漏洞（是在你的网络安全卫生中，还是在其他缺乏防御的地方）。\n\
  \n接下来，投资于提升你的业务价值并降低对手价值的技术。具体来说，企业正在向云端迁移。更重要的是，员工正在向云端迁移。因此，除非你的组织受到完全限制（某些机构，如大型政府机构确实如此），否则你可能无法阻止员工在工作场所访问潜在危险的应用程序和服务。\n\
  \n如果你无法击败他们，就加入他们。与其抵制云端迁移，不如拥抱它。将云访问安全代理 (`CASB`) 视为一种潜在的解决方案。本质上，`CASB` 技术让安全组织对其使用的云服务（授权的或未授权的）具有可见性和控制力。它们可以检测云控制中的安全配置错误（例如公开可读和/或可写入的存储桶）。它们可能允许组织在任何云环境中设置一致的安全策略。简而言之，它们允许组织保护员工正在使用的流行云服务。它们还允许\
  \ `CISOs` 在支持公司转型议程的同时，确保安全处于核心位置。\n\n现在，谈谈如何负面地影响对手的价值。我之前提到过，网络安全中没有所谓的“进攻”。事实如此。根据定义，防御者不会先动手。但他们仍然可以迷惑敌人。\n\
  \n战争中的欺骗艺术可以追溯到孙子。在网络安全中，植入你基础设施中的、伪装成宝库的精心诱饵可以起到几点作用。首先，它们为你提供了额外的数据点，通过它们追踪敌人的模式。其次，它们让你的敌人偏离你感兴趣保护的真正财富。最后，它们让敌人的时间和资源浪费在徒劳的搜索上。最后这一点真的是网络安全团队能接近“进攻”的极限了。\n\
  \n利用人工智能 (`AI`) 能力来识别最先进的威胁并解决人才短缺——但要了解其局限性。`AI` 是网络安全领域最新的热门词汇技术。诚实地说，它承诺帮助网络防御者快速发现其环境中最复杂的威胁，将机器的规模与人类的解决问题能力相结合。但要警惕那些披着羊皮的网络安全营销人员。虽然\
  \ `AI` 承诺帮助资金拮据的 `CISOs` 以更少的资源做更多的事，但这是有代价的——误报。\n\n相反，机器学习模型的好坏取决于其输入。如果输入是错误的（或被篡改的），模型的准确性就会受损。在最近的一个贸易展会上，McAfee\
  \ 展示了图像中微小的像素变化（肉眼无法察觉）如何让机器学习模型产生困惑，将一张企鹅的照片分类为……煎锅！煎锅和企鹅在现实世界中可能是无害的。但想象一下，数字停止标志上发生了同样的像素投毒，自动汽车现在将其识别为速度限制标志，你就可以想象这个领域的用例会变得多么黑暗了。\n\
  \n敌人可能会给恶意软件分类引擎带来同样的困惑。通过对高度敏感的机器学习模型引入细微变体，对手可以使网络安全专业人员迷失方向。他们可以让这些第一响应者面对大量的误报，可能在此过程中麻痹他们响应的紧迫感。然后，对手确信受害者的盾牌已经放下，便发动真正的攻击。\n\
  \n增加这一主题复杂性的是一种被称为对抗性机器学习 (`AML`) 的新威胁类别。坏人再次采取行动，通过创新手段为受害者制造混乱。通过 `AML`，对手操纵了原本正常的机器学习模型的输入。“垃圾进，垃圾出”的假设在网络安全领域与任何其他\
  \ `IT` 领域同样适用。\n\n\n\n最后，要在公司内**高扬网络安全旗帜**。这需要两方面的努力。首先，首席信息安全官（CISO）必须能够听懂董事会的语言。董事会室说的是风险语言——而这始终与公司战略相关联。与业务部门负责人、CFO\
  \ 和 CEO 合作，识别并优先考虑公司最具战略性的资产。对于每种资产，识别泄露后的后果。最后，提供其当前的漏洞情况。立即优先处理高优先级/高漏洞资产并制定修复计划。当被邀请参加董事会时，使用此框架作为指南，定义你的网络安全战略如何映射到公司的整体战略中。\n\
  \n除了在垂直方向传播安全文化外，还要通过组织内的员工进行水平传播。与人力资源（HR）部门的伙伴合作，提供有效的培训，以提高员工在其岗位上的安全意识（就像麦菲的\
  \ CISO 在其钓鱼攻击活动中所做的那样）。找到一种方法，让网络安全不仅仅是一年度的培训活动，或是员工入职时回答的问题清单。在你的团队中聘请一名沟通专家，并与营销部门合作，定义该职位的角色和技能\
  \ set。让你的沟通大使与市场部和 HR 合作，开展有效的内部活动，使网络安全成为每个人日常工作的一部分。\n\n***\n\n是时候让 CISO 在高管层会议上接受自己的角色了。是时候他们培养一种远超\
  \ IT 领域的网络安全文化了。是时候与关键利益相关者（特别是 HR 和市场部）建立新的伙伴关系，以提升网络安全意识并降低安全漏洞。是时候改写 CISO 故事的结局了。得益于许多已经在前行的进取型\
  \ CISO，其他成员无需想象他们的故事书式结局。这正在变成现实。\n\n## Notes\n\n1. ^(1) John Medina, *Brain Rules:\
  \ 12 Principles for Surviving and Thriving at Work, Home and School* (Seattle, WA:\
  \ Pear Press, 2014).\n\n2. ^(2) 同上。\n\n3. ^(3) [`twitter.com/WaltHickey/status/345646754089291777`](https://twitter.com/WaltHickey/status/345646754089291777)。\n\
  \n4. ^(4) Walt Hickey, “The Worst Chart in the World,” *Business Insider*, 2013\
  \ 年 6 月 17 日, [`www.businessinsider.com/pie-charts-are-the -worst-2013-6`](https://www.businessinsider.com/pie-charts-are-the-worst-2013-6).\n\
  \n5. ^(5) 我喜欢的演示书籍是 Jerry Weissman 的 *Presenting to Win: The Art of Telling Your\
  \ Story*。如果你没有时间或预算进行专业教练，这本书在提供讲述有效故事的技巧方面是无价的资源。\n\n6. ^(6) David F. Larcker and\
  \ Brian Tayan, Corporate Governance Research Initiative, “Strategy & Risk Oversight,”\
  \ Stanford Business Corporate Governance Research Initiative, [`www.gsb.stanford.edu\
  \ /sites/gsb/files/publication-pdf/cgri-quick-guide-06-strategy-risk -oversight.pdf`](https://www.gsb.stanford.edu/sites/gsb/files/publication-pdf/cgri-quick-guide-06-strategy-risk-oversight.pdf).\n\
  \n7. ^(7) 同上。\n\n8. ^(8) IDG Enterprise, “2014 Consumerization of IT in the Enterprise,”\
  \ [`www.scribd.com/presentation/212942014/IDGE-CITE -2014`](https://www.scribd.com/presentation/212942014/IDGE-CITE-2014).\n\
  \n9. ^(9) Patrick Thibodeau, “A Third of Virtual Servers Are Zombies,” *Computerworld*,\
  \ 2017 年 5 月 12 日, [`www.computerworld.com/article/3196355/a-third-of-virtual-servers-are-zombies.html`](https://www.computerworld.com/article/3196355/a-third-of-virtual-servers-are-zombies.html).\n\
  \n10. ^(10) Jody R. Westby, “Governance of Cybersecurity: 2015 Report,” Georgia\
  \ Tech Information Security Center, 2015 年 10 月 2 日, [`globalcyberrisk.com/wp-content/uploads/2012/08/GTISC\
  \ -GOVERNANCE-RPT-2015-v1`](https://globalcyberrisk.com/wp-content/uploads/2012/08/GTISC-GOVERNANCE-RPT-2015-v1).\n\
  \n\n\n\n从我的第一次飞行到现在，我已经走了多远。那时我是一个 20 岁的 `INROADS` 实习生，那是一个为开启我美国职场生涯的非营利组织。当时我正和朋友以及实习生们一起从坦帕前往亚特兰大，参加一次特殊的\
  \ `INROADS` 训练营。我登上飞机，坐在`way`靠后的位置——就在洗手间旁边，我觉得这运气非常好，因为如果上厕所的话，我离厕所格外近。多么方便啊！\n\
  \n当空乘员进行我耳朵第一次听到的安全演示时，我很尽职地开始扣安全带。但安全带没有扣上。在几次尝试失败并向旁边的乘客寻求帮助后，结果显而易见：我的安全带坏了。我记得当时心里想：“噢，好吧。安全带算是可选的，就像校车上的安全带一样。”我没有多想就提这件事。空乘员也没有多看一眼来确认我是否已经系好。\n\
  \n当然，在空中飞行了数百万英里后，我知道断掉的安全带是件多么严重的问题。今天，如果没有一条合适且牢固系在腰间的安全带，我甚至不会考虑在跑道上滑行，更不用离开地面了。（顺带一句，我首航乘坐的那家航空公司最终倒闭了。其最终终结的核心原因？严重的安全问题。）\n\
  \n现在我知道飞机上和机场里的安全是什么样子、什么感觉了。我非常清楚那些确保我作为乘客一项首要权利——安全体验的庞大基础设施。这并不是说飞机不会坠毁。但同时，我不必接受任何低于航空旅行中严格执行的安全标准的待遇——是的，一条有效的安全带完全列入此清单。\n\
  \n航空旅行之所以仍然是最安全的交通方式，是有原因的——它比汽车安全 100 倍以上。(2) 一种安全文化渗透了航空业的每一个方面。\n\n这句话听起来可能让你觉得并不寻常。你可能认为安全应该是航空旅行的核心。毕竟，这个行业存在的目的是将宝贵的货物——在这种情况下，是人命——从一个地方运到另一个地方。你只对了一部分。事实上，安全感已深植于航空旅行肌理中的常态化，掩盖了它在行业初创几乎不存在的起点。\n\
  \n当我们回想起过去美好的飞行时光时，脑海中会浮现出这样的画面：穿着时尚的乘客，受到服务意识强的空乘的侍奉，在腿部空间宽敞的豪华轮上，在友好的天空中享用高级烹饪。这种怀旧的画面缺乏了对当时飞行危险性的任何现实。由于当时完全没有所谓的“安全文化”，乘客的死亡率几乎是今天的平均水平四倍^(3)。请看看乘客在商业航空运输历史上曾某个时刻面临的安全问题“检查清单”：\n\
  \n1.  由于在恶劣天气下飞行或降落飞机的技术不尽如人意，空中碰撞和致命性着陆要常见得多。\n2.  发动机掉落的情况非常频繁，以至于只要另一台发动机能让飞机及时着陆，这些事件甚至不会被记录为事故。\n\
  3.  劣质的安全带设计和较低的客舱天花板意味着，剧烈的气流不仅会让午餐飞出去——它可能导致颈骨折断。\n4.  谈到气流。在过去那些缺乏加压客舱（无法在更高、更安全、更舒适的高度飞行）的飞机上，气流要常见得多。\n\
  5.  对于脚不稳的乘客来说，去飞机洗手间是危险的。稍一绊倒，你可能会发现自己落在椅子或桌子的尖锐边缘上，这是环境中另一个导致受伤或死亡的危险因素。\n6. \
  \ 隔头等舱和经济舱乘客的玻璃隔板很美观。但在事故或气流中，它们也会破碎并将碎片溅到顾客身上。\n7.  你可以在飞机上点烟。二手烟增加了机上的氛围。\n8.\
  \  如果由于香烟、线路故障或未经批准的货物（如化学氧气发生器——是的，这真的发生过）导致火灾，机上既没有烟雾探测器也没有灭火器来提供警告或解决办法。\n9.\
  \  把身份证忘在家里了？不用担心。登机不需要身份证。\n10. 即使当身份证成为要求时，票上的名字和身份证明也不需要一致。\n11. 携带武器上飞机？空乘甚至可能帮你把它存放在行李架架内以妥善保存。^(4)\n\
  12. 国内航班对托运行李没有安检检查。\n13. 国际航班——`有时`。\n14. 盒刀、编织针、剪刀和棒球棒？飞机上广受欢迎的配件。\n15. 越多越好。\n\
  16. 参观驾驶舱对幸运的乘客来说是一种享受。你甚至可能在过程中获得“机翼”勋章。\n17. 在参观驾驶舱时，你会遇到一位飞行经验仅为如今执勤人员要求的六分之一的飞行员^(5)\n\
  18. 那位飞行员还可能感到疲劳，这归功于对强制休息要求的更宽松规定。\n19. 我们现在认为理所当然的安全演示？在早期要少得多。诸如在起飞和降落时调暗客舱灯光和拉上窗帘是乘客福利中较新的增加，因为这两者都能让旅行者适应坠机时可能遭遇的环境。\n\
  20. 每天筛选超过 200 万名乘客和机组人员的 `运输安全管理局 (TSA)`？它在 2001 年之前不存在。\n\n这些只是几十年来航空旅行安全进步巨大程度的\
  \ 20 个例子。我甚至还没有触及 9/11 之后世界所做出的所有变化的冰。\n\n这些变化并非一夜之间发生的。它们是一个受到敌手（包括环境和人类）围困的行业，被迫随着时间的推移不断提高安全标准的结果。虽然我们可能怀念那个机场安全几乎不存在的简单时代，但我们中的许多人也将永远无法体会那种曾威胁飞行自由的恐怖。如果你像我一样，你无法想象带着永久的恐惧登上飞机——担心它可能被改道或毁灭，不是因为气流或恶劣天气，而是因为一个为了个人或政治利益的劫机分子。\n\
  \n然而，那个画面——已成为大制作动作电影的常常————曾是被称为“劫机黄金时代”期间旅行者面临的严酷现实。在 1968 年至 1972 年间，劫机分子在美国领空劫持了\
  \ 130 多架飞机，频率通常为每周一次或多次。(6) 劫机“病毒”是一场肆虐的流行病。媒体以同样的热情报道航空旅行的黑暗现实。当精神科医生采访劫机分子时，他们发现了一种争胜心理。潜在的劫机分子对最新飞机劫持事件的广泛报道深感着迷，他们会想：“我可以做得更好；我可以改进它。”^(7)\
  \ 于是，传染蔓延了。\n\n\n\n\n\n这很难相信，但在那几年里，劫机变得如此常见，以至于乘客们仅仅将其视为航空旅行体验的一部分。1968 年，《时代》杂志用一篇标题恰当为《当劫机来临时该怎么办》的文章，对劫机之潮进行了些许调侃。在文中，记者报道了在过去的十个月里，有超过`1,000`美国人被改往古巴。虽然“飞行员为了防万一携带了哈瓦那何塞·马蒂机场的地图，空乘员被指示不要与潜在的劫机分子争论——只需服从他们的命令……还没有人想过给可怜的乘客进行简报。”\n\
  \n作者慷慨地提供了一些做法和禁忌，以防有人发现自己成了被劫机飞机上的意外乘客——比如不要具有攻击性、不要恐慌、不要按呼叫按钮（免得叮的一声惊动劫机分子导致其意外射击），以及不要大声呼叫“空乘员”。当航班到达古巴时，记者建议了两个件要做：保持冷静并享受这次逗留（文章甚至提供了关于当地舒适过夜住宿的一些有用细节）。\n\
  \n### 航空公司如何应对持续的威胁？\n\n他们顺从了劫机分子。如果劫机分子想降落在古巴（或任何其他地方），飞行员就会改变航线。考虑到当时古巴作为劫机目的地的受欢迎，无论航班的预期目的地，所有驾驶舱都配备了加勒比海的地图。此外，飞行员还拿了西班牙语常用短语卡，以帮助他们与前往古巴的劫机分子交流（例如学习如何说“我必须打开飞行包拿地图”或“飞机有机械故障——无法到达古巴”）。如果犯罪者想要钱，航空公司会支付赎金，并希望在嫌疑人被捕后回来。航空公司坚定地保护他们现有的松散安全控制，坚决拒绝如金属探测器等能阻碍劫机子的威慑手段，因为他们不想让付费的客户接受同样的审查。\n\
  \n令人难以信的是，航空公司如此拒绝实施安全限制，以至于他们甚至考虑在佛罗里达南部建造一个类似于古巴机场的假机场，作为金属探测器等设备的替代方案。根据这项提议，飞行员将降落在伪机场，联邦探员将在那里等待嫌疑人的抵达。\n\
  \n由于成本原因，假机场的想法被抛弃，取而代之的是行为画像。票务代理会对潜在的伪装劫机分子的约`20`种可能的行为警示标志进行快速检查。为了将乘客便利置于安全之上，这种画像仅适用于所有旅客的`1%`以下，让超过`99%`的人员不受限制。\n\
  \n航空公司并没有轻易拥抱我今天所归功于他们的安全文化。事实上，他们接受了环境中的这些人类对手，并开发了与他们合作的实践。现在随处可见的安全控制最初并不符合航空行业最佳客户体验的范式。在当时，顺从恐怖分子而不是保护航线的理由似乎是合理的。这是航空旅行首次从精英阶层转向大众市场旅行者。安全延迟仅让乘客多花上`15\
  \ 分钟`时间，就足以刺激他们选择其他交通工具。对于这个相对新兴的行业来说，这是一个承担不起的风险。\n\n### 国家威胁的转变\n\n直到`1972 年 11\
  \ 月 10 日`，劫机从轻微的不便演变成了国家威胁。三名劫机分子威胁要将飞机撞入田纳西州奥克里奇国家实验室的原子反应堆。联邦航空管理局（`FAA`）采取了航空公司曾放弃的措施。次年\
  \ 1 月，所有乘客将接受物理检查，包括通过金属探测器和行李检查。\n\n对手如果不坚决且具有创新精神将一无一物。当劫机由于实施机场筛查而变得更加困难时，犯罪者将注意力转向飞机炸弹。当`1990\
  \ 年代`加强了安全措施以防御那种威胁因素时，恐怖分子在`2001 年 9 月 11 日`创了自己的新高，他们携带允许携带的小盒刀劫持并利用民用飞机作为自导导弹（这让人想起`1972\
  \ 年`那次威胁同一目标的失败劫机案）。\n\n在每一个时刻，航空行业都通过额外的安全措施做出回应。\n\n*   `2001 年 12 月 22 日`：机上理查德·里德试图在鞋里引爆爆炸物。五年后，`TSA`要求在安全检查站脱鞋。\n\
  *   `2006 年 8 月 9 日`：官员破获了一个利用液体爆炸物击落飞机的阴谋。同年`9 月 26 日`，`TSA`禁止每个乘客携带超过`3.4 盎司`且能装进`1\
  \ 夸脱透明塑料袋`的液体（现在被称为`3-1-1 规则`）。\n*   `2009 年 12 月 25 日`：机上乘客奥马尔·法鲁克·阿卜杜穆塔拉布将爆炸物塞进了最私密的区域——他的内裤里。不久，乘客们在机场接受了由于“散射”机器而的争议性虚拟搜身。\n\
  \n这场猫鼠游戏将持续下去。当下一个威胁出现时，航空行业将用旨在产生免疫的安全控制做出回应。虽然乘客可能会对不便表示抱怨，但也会接受一种新常态，这种常态的核心是以安全为设计的。\n\
  \n这就是为什么我把航空公司视为执行安全文化的典范。这并不是说航空公司愿意遵守今天所有让我们变得更安全（尽管有些不便）的控制。在早期，当行业及其乘客将劫机视为一种麻烦而非威胁时，曾存在许多阻力。\n\
  \n### 起前安全要求\n\n但请考虑以下列表，它是今天飞机起飞前必须发生的事情的子集。如果缺少其中任何项目，乘客可以预见到航班延迟，甚至取消：\n\n1.\
  \  起前检查包括外部绕行和对关键部件的目视检查，包括传感器、探头以及暴露的电机和电缆，例如位于起落架上的那些部件。\n2.  起前检查还包括关键系统的内部测试，如火灾探测器、天气雷达和警示灯。\n\
  3.  维护人员根据飞机计划执行任何必要的维护。这些检查中侵入性最小且频率最高的是每隔`500 飞行小时`进行一次。最全面的检查大约每`六年`发生一次，费用昂贵，以至于在许多情况下，航空公司直接退役该飞机。\n\
  4.  维护人员对机上所有物品的运行状态进行详细记录。如果有任何疑虑，维护团队将决定修复还是推迟问题。这取决于飞机保持适航状态必须具备的最小设备清单。如果飞机不符合要求，它就留在原地。\n\
  5.  飞行员审查最小设备清单和推迟项目，以便在起飞前了解飞机的维护状况。\n6.  地面工作人员检查飞机损坏，并检查跑道上可能阻碍其滑出的碎片或障碍物。\n\
  7.  飞行员和空乘人员进行起飞前会议，讨论飞行计划、天气报告、预计气流等内容，以为所有人提供顺畅且安全的体验。\n8.  空中交通管制员根据天气模式和机场限制等因素准备好飞行计划。\n\
  \n\n\n\n\n## 9. 乘客及时到达机场接受安检。这些清理工作（包括核实乘客不在监控名单上）在航班当天之前很久就开始了。\n\n## 10. 旅客提供政府颁发的带照片身份证，姓名需与票面信息一致。\n\
  \n## 11. 托运行李始终接受检查——无例外。\n\n## 12. 未加入特殊计划（如 `TSA Pre-Check`）的乘客需要从随身行李中取出笔记本电脑、鞋子、外套以及符合\
  \ 3–1–1 标准的液体。\n\n## 13. 所有手提行李都会经过 X 射线检查，否则经过物理搜索。\n\n# 14. 每位乘客都将接受金属探测、毫米波人体成像和/或肢拍检查，以发现违禁品。\n\
  \n这些安全检查（包括安全筛查）对于抵达美国的国际航班来说，可能会更加严格。\n\n批评者会迅速指出这些安全评估在保护乘客方面的不足。他们会强调 `TSA` 在自身渗透测试中的失败率，在\
  \ 2017 年，至少有 70% 的非法违禁品漏过了他们的漏洞。事实上，没有任何安全态势是完美的，航空业也不例外。\n\n与其进行批评，让我们看看其实绩。更具体地说，让我们看看许多人可能认同的最重要的关键结果——乘客的安全运输。在这一指标上，航空业的表现确实非常出色。\n\
  \n2018 年，`Aviation Safety Network` 报告显示，大型商业航班的致命事故率为每百万次航班 0.36 次。这相当于每三百万次航班发生一次致命事故。\n\
  \n一些国家（如美国）的死亡率更低。从 2009 年到 2018 年，美国运营的运送了数十亿人次，飞行了近 1 亿次，没有死亡记录。\n\n这些结果不言自明。作为一名频繁旅行者，这让我很有：比起在飞机上丧生，我更有可能死于心血管疾病、车祸、雷击，甚至被蜂蜇。我可能在担心带错了物品或把证件忘在家里，但我并不担心我的安全。这是因为我知道航空业深陷于安全防护之中。公营和私营部门已为了同一个目标团结在一起：确保旅客安全。\n\
  \n也许你的公司从事的不是保护生命的业务。又也许你的行业还没有见过相应意义的“劫持黄金时代”。也许你的公司还没有经历过比喻上的“9/11 事件”。我希望你们不需要经历这些，就能让你以及其他所有员工和董事会成员将安全置于其应的位置。\n\
  \n*   将安全从后台办公室转移到董事会。\n*   让每位员工都具备在维护公司安全方面发挥作用的能力。\n*   在缺乏安全保障时停止产品开发流程。\n*\
  \   弥补网络安全人才短缺的缺口。\n*   在发生泄露时做出立即且透明的响应。\n*   将安全贯穿于庞大的第三方生态系统中。\n*   在每个工作场所建立安全文化。\n\
  \n这些处方能让你的公司永远不再遭受泄露吗？显然不能。但它们是否能带来积极成果，让你的公司更有效地降低风险并从攻击中恢复？答案是定的。\n\n尽管我对航空业的事绩赞誉有加，但它也无法免于威胁——无论是人为还是其他。在我短暂回到家乡坦帕的前几天，收到了那则关于埃塞俄比亚航空飞机坠毁的毁灭性消息，导致机上\
  \ 157 人全部遇难。我妈妈不是经常旅行的人。然而，她是有线新闻频目的长期观众。在我出发前的几天，她给我打了电话。\n\n“Allie，我很担心你来这里的旅行。你坐的是哪种飞机？”\n\
  \n“妈妈，我不知道。你在看什么？为什么要问这个？”\n\n“有报道说埃塞俄比亚航空的坠机事故与几个月前的另一起事故相似。它们都是在 `737 MAX` 上。那是你的飞机吗？”\n\
  \n“妈妈，请别看新闻了。我很好的。我死于车祸概率比死在飞机上大得多。”（后面是关于航空安全记录的唠叨，其中大部分并没有突破我妈妈对于听取任何缓解她恐惧的信息的非凡防御。）\n\
  \n“宝贝，我只需要知道你坐的是不是那种飞机之一。如果是，我们重新安排行程。”\n\n事实证明我不需要重新安排行程。我不需要检查我所乘坐航班的机型。在我计划出发的前一天，`FAA`\
  \ 停飞了所有 `波音 737 MAX 8` 飞机。那种笼罩在我经常使用的航空业各个领域的安全文化，再次将我的安全放在首位。\n\n虽然我可能没有怀疑潜在的危险，但\
  \ `FAA` 的行动并没有被我妈妈忽略。起飞前晚上，她打电话给我确认了到达细节。\n\n“Allie，我很庆幸我们不需要重新安排航班。感谢天谢他们停飞了那些飞机。”\n\
  \n“是的，妈妈。确实感谢天谢。”\n\n感谢航空业向我们展示了安全可以有的样子。\n\n\n\n\n\n8. “当劫持者来临时该怎么办，”*Time*杂志，1968\
  \ 年 12 月 6 日，[http://content.time.com/time/subscriber/article/0],33009,844656,00\
  \ .html。\n9. Koerner，“劫持者是如何控制 130 多架飞机的”。\n10. Summer Meza，“TSA 在超过半的时间里未能发现武器，”*Newsweek*\
  \ 杂志，2017 年 11 月 9 日，[https://www.newsweek.com/tsa-fails-half-time-706568]。\n11.\
  \ David Shepardson，“2018 年商业客运飞机死亡人数上升，”路透社，2019 年 1 月 1 日，[https://www.reuters.com/article/us-airlines-safety-worldwide/fatalities-on-commercial-passenger-aircraft-rise-in-2018-idUSKCN1OW007]。\n\
  12. Lea Lane，“西南航空死亡事故后的现实检查：关于飞行、健康与安全的惊人统计，”*Forbes*杂志，2018 年 4 月 18 日，[https://www.forbes.com/sites/lealane/2018/04/18/reality-check-after-the-southwest-airlines-fatality-shocking-stats-on-flying-health-and-safety/#1205e3117a46]。\n\
  \n# 第 10 章：全员安全文化\n\n> 治理、风险和合规运动的一部分是“从高层定调”。执行管理层应该指出不同类型的网络安全威胁以及如何识别这些威胁。随后，应该明确\
  \ IT 部门在防止网络攻击中扮演什么角色，以及其他人又扮演着什么角色。目前，我不知道这道界限在哪里。在网络安全领域，我应该担心什么，而什么是 IT 任务负责预防的？\n\
  > —— 受访者，麦菲（McA）在线民族志研究\n\n那篇短文的标题几乎没有被注意到，被埋在页面底部，与关于即将举行的高中橄榄球赛专题在一起。那些仔细看的人可能会直接将其斥为歇斯底里式的末日预言：“世界系列赛地震要来了吗？”四天后，6.9\
  \ 级罗马-普里埃塔（Loma Prieta）地震发生，导致 63 人死亡，造成了数十亿美元的损失，并中断了在烛石公园（Candlestick Park）进行的世界系列赛第三场比赛。\n\
  \n地震是大自然可怕的幽灵。全球每天发生数百次地震，尽管我们大多数人甚至没有注意到它们。它们在性质上相对较小——震级 2 级或以下。7 级以上的地震每月发生多次。至少\
  \ 8 级的大地震每年发生一次。与那些较小的兄弟姐妹不同，我们会注意到这些大地震和大地震。即使我们足够幸运，避开了大自然的愤怒，媒体也会通过在屏幕上填满倒塌建筑和毁灭路径上受害者的图像，确保我们意识到她的破坏力。\n\
  \n让地震变得可怕的是它们的确定性。地震的发生不可避免。地球是活跃的。它的板块正在移动。这种现象是无法逃避的。\n\n然而，尽管具有这种确定性，地震又是完全不可预测的。没有办法可以预测地震。这一点唯一的区别将地震与其他自然灾害（如飓风、龙卷风和洪水）区分开来，在后者，科学模型可以帮助人们避开致命打击。\n\
  \n地震并非如此。它们在毫无预警的情况下袭击。美国地质调查局（USGS）在其网站上明确指出：“美国地质调查局或任何其他科学家从未预测过大地震。我们不知道如何预测，而且我们不指在预见的未来任何时候做到。”\n\
  \n所以，当县地质学家吉姆·伯克兰（Jim Berkland）对 1989 年震摇罗马-普里埃塔的 6.9 级地震给出了难以置信的准确（或极其幸运）的预测时，那些几天前错过那个晦涩标题的人，在尘埃落定后无疑注意到了它。\n\
  \n伯克兰利用科学指标（如大潮的存在和月球的位置）来进行预测，罗马-普里埃塔地震是他过去 15 年中做出的 300 次预测之一。此外，伯克兰在黑箱中用于计算地震概率的另一个数据点，是事件发生前当地宠物分类广告中报告的丢失动物数量。他包含这一非常规指标的理论是？宠物在感知到即将发生的地震时会逃跑。\n\
  \n这种假设并不新鲜。几个世纪以来，预言者们一直认为动物拥有真正的六感，能够感知震动，或探测空气或气体中人类无法察觉的电变化。\n\n科学尚未能证明任何这种六感的存在——至少目前如此。有大量的研究在寻找奇异动物观察结果与随后的地震之间的联系。确实，有大量的轶事数据记录了动物的退缩、行为失常或表现出异常行为，尽管这些“证据”本身缺乏受控科学实验的严谨性，无法清楚地建立因果关系。\n\
  \n但在这些研究中，似乎确实证据表明动物实际上可以在地震发生前感知到。这并不是说它们能预测地震，但它们似乎能探测到前震——即在剧烈摇动之前的轻微震动，这些震动是人类无法识别的。\n\
  \n虽然关于动物行为是否能帮助人类预测地震尚无定论，但至少有一些证据表明，动物对微妙异常的敏锐度高于人类——即使仅仅是因为在灾难来临前处于高度警觉状态。然而，那几个转瞬即逝的时刻，可能决定了动物的生死。\n\
  \n我相信，对于那些集结群众力量——即所谓的羊群本能的组织来说也是如此，以获得对网络威胁的六感，而这种感在他们的同类中通常是缺失的。当每位员工都为了练习良好的防御而提高能力时，这种情况就会发生。更重要的是，当网络安全的角色与每位员工的日常工作变得密不可分时，组织的集体六感会在不可修复的损害发生之前放大对威胁的检测。\n\
  \n让我们在整个组织中建立安全文化。\n\n有一些每位员工都可以做、每个职能领导都可以采用的方法，可以将网络安全嵌入到工作场所的日常织理中，将“第 12 人”的力量引入网络安全领域，并将集体羊群的六感带入数字领域的第一线战斗。\n\
  \n为此，本章总结了每位员工、经理、高管和董事会成员的关键问题和行动。\n\n你现在被招用了。\n\n## 给 CEO/董事成员的智慧\n\n*   在即将到来的董事议程中分配至少\
  \ 90 分钟，让你的首席安全官（CISO）对你目前的网络安全状况提供有意义的见解。\n*   立即将预算重新分配给具有高度战略性又高度脆弱的资产。\n*  \
  \ 在每次董事会议上至少花 30 分钟讨论网络安全话题。\n*   让你的 CISO 报告红队演习（也称为渗透测试）的状态。坚持这些演习作为一种纪律。\n* \
  \  考虑任命一位具有网络安全知识的董事成员。\n\n## 给员工的智慧\n\n\n\n\n\n- 不要落入社交工程攻击的陷阱。留意恶意邮件的迹象，例如发件人的电子邮件地址。不要点击来自未知来源的链接。\n\
  - 要积极主动，立即将任何可疑邮件报告给您的网络安全团队。\n- 确保笔记本电脑、移动设备和其他个人技术的安全补丁保持最新状态。当您的安全组织推送安全更新时，不要推迟。\n\
  - 养成良好的网络安全习惯——使用强密码，不要重复使用密码，避免使用未加密的 USB 设备。\n\n## 产品开发人员的 W.I.S.D.O.M.\n\n- 在需求发现阶段询问客户关于他们的网络安全需求。\n\
  - 将安全性作为任何最小可行性产品（MVP）需求的一部分。\n- 在设计任何新产品或服务时，清晰且有意识地定义您的数据需求。\n- 将安全所有权融入产品生命周期的每个阶段。\n\
  - 如果产品发布过程中的任何一点缺乏或缺失安全性，应立即停止发布。奖励并公开表扬公司其他采取同样做法的员工。\n\n## 人力资源专业人士的 W.I.S.D.O.M.\n\
  \n- 扩大网络安全人才的范围——男性和女性、少数民族和非少数民族、艺术与科学（STEAM）。审查目前的网络安全职位招聘公告，以寻找多样化的技能。寻找包含无意识偏见的面试问题，包括常见的类型，如“请告诉我你曾何时……”或“请谈谈网络安全领域最新热门的创新”。在每个面试小组中至少安排一名多元背景的领导者。\n\
  - 搜索贵公司的价值观，看看可以在哪里加入 `securely`（安全地）或其派生词，以在不改变其目的的情况下改变其适用范围。\n- 奖励并认可有助于公司网络安全防御的行为。\n\
  - 与您的 `CISO` 合作，识别并控制组织最宝贵资产的访问权限。寻找一种机密且无威胁的方式，让尽职业业的员工看到类似于恶意内部威胁的情况时能够吹哨或提出警报。当他们这样做时，给予适当的奖励。\n\
  - 确保执行团队的每位成员都至少有一个网络安全关键绩效指标（`KPI`）。\n\n## 营销/传播人员的 W.I.S.D.O.M.\n\n- 构建一个具有明确高层支持的多维度沟通计划。该计划应包含对以下问题的回答：\n\
  \    - 即使法律没有要求，你们会通知吗？\n    - 如果公司不对攻击负责会怎样？这将如何改变你们信息的信息的语气？（以关联性泄露和数据武器化用例为例。）\n\
  \    - 你们会在什么时候通知？\n    - 你们会通知谁？\n    - 如果没有立即获得所有信息，你会说什么？\n    - 你愿意向客户提供什么补偿或作为以受害者为中心的同情表现（例如，免费的身份保护或提议承担信用卡泄露导致的客户损失）？\n\
  - 为计划中识别的每种场景创建沟通模板。在模板中留出占符以回答以下问题：\n    - 谁受到了影响？\n    - 哪些数据和/或系统丢失、被盗或以其他方式遭到破坏？\n\
  \    - 泄露发生在什么时间段？\n    - 利益者需要采取哪些预防措施？\n    - 贵公司正在采取什么行动来纠问题并降低再次发生的风险？\n- 为每种攻击场景设计节奏表（tick-tock\
  \ schedule）。\n- 确保您的计划包含员工，无论员工记录是否被泄露。\n- 每年至少对您的计划进行一次沟通演练。\n\n## 财务专业人士的 W.I.S.D.O.M.\n\
  \n- 通过提出以下问题，帮助 `CISOs` 及其团队使用业务语言——风险管理：\n    - 哪些资产面临风险？\n    - 资产的战略价值是什么？\n\
  \    - 资产目前的漏洞水平如何？\n    - 如果发生泄露，后果是什么（财务损失、知识产权泄露风险、声誉风险）？\n- 为了确保网络安全不是事后才想起来的亡足之炊，`CFOs`\
  \ 应该对其他领导提交的业务案例提问以下问题：\n    - 新的 [市场、内部技术、客户产品等] 如何改变公司的受攻击面？\n    - 它是如何改变公司最具战略资产的风险概况的？\n\
  \    - [假设风险增加] 需要多少额外投资（一次性和复性性的）才能将风险概况带到可接受的基准？此项投资是否包含在 `ROI` 分析中？\n- 通过向 `CISOs`\
  \ 提问尽可能有效地降低风险，例如：\n    - 对于仍放在架子上的产品（闲置软件），网络安全方面投入了多少？\n    - 部署这些产品的计划是什么？\n\
  \    - 上次确保安全产品配置当的审计是什么时候进行的？结果如何？\n    - 上次渗透测试是什么时候进行的？结果如何？（渗透测试在第二章中涵盖，指的是测试组织网络安全态的有效性，通常通过付费第三方尝试突破公司的防御。）\n\
  \    - 上一次对员工进行网络安全培训是什么时候？结果如何？\n- 通过对供应商的安全态势进行评估来降低第三方风险，包括：\n    - 查看第三方如何评估和更新访问权限和权利。\n\
  \        - 你们是否定期审查访问权限，以确保访问权限基于其角色的最小权限需求？\n        - 在员工、承包商、客户、业务伙伴或参与第三方的状态发生变化时，是否及时对组织的系统、信息资产和数据的访问进行了撤销或修改？\n\
  - 理解他们的业务连续性流程以及测试频率。\n    - 你们是否有针对计划和计划外停机的业务连续性和灾难恢复计划，并且每年至少测试一次？如果是，请描述执行的测试类型。\n\
  \    - 你们是否定期备份，以便任何数据损坏都能通过备份恢复，从而仅产生可接受的数据丢失？是否定期测试从备份中恢复？\n- 搜索针对新用户和/新软件的变更控制指南。\n\
  \    - 你们的所有系统是否都更改了默认用户名和密码？\n    - 你们是否建立了控制措施来监控和限制在系统上安装未经授权的软件（例如上传的恶意软件、禁用自动运行、过高的管理员权限）？\n\
  - 明确你们与他们之间传递的任何数据如何被使用、保护并在适当的时间处置（在合同终止时或根据合规标准）。\n    - 你们是否有相关程序来确保生产数据不会在非生产环境中被复制或使用？\n\
  \    - 当硬盘或数据不再需要时，是否从存储器中安全地删除？在处置或退货前是否销毁了故障的硬盘？\n    - 你们是否确保在合同终止后 30 天内删除所有机密数据？\n\
  - 了解他们在各种状态下（静态、使用中和传输中）对数据进行加密的方式。\n\n\n\n\n\n## 安全评估与培训\n\n### 数据加密与意识\n\n* 数据在节点、模块、实例或虚拟服务器之间移动时是否进行了加密？如果没有，是否有添加此项能力的选项？请描述所使用的加密方法。\n\
  * 数据在静态状态下（例如存储在数据库中、存储在备份带上等）是否进行了加密？如果没有，是否有添加此项能力的选项？请描述所使用的加密方法。\n\n### 评估如何对员工进行网络安全意识和卫生协议的培训。\n\
  * 贵组织是否拥有安全意识和培训计划？\n* 组织是否确保人员每年接受组织安全政策的培训，并要求其了解这些政策的变更或更新？\n* 组织是否确保所有访问机密数据的人员都接受与其职责对应的信息安全培训？\n\
  * 组织是否确保所有访问个人身份信息（PII）的人员都完成了隐私培训课程，并了解所处理数据的任何特定隐私要求？\n\n* 对于您最具战略性的供应商，考虑每年聘请第三方对其安全实践进行审计。\n\
  * 如果您稍微担心某个希望与贵公司建立合作关系的第三方不符合您所要求的网络安全标准，请不要允许他们推进这种关系。\n\n## 网络安全专业人士的 W.I.S.D.O.M.\n\
  \n* 良好的网络安全卫生是不可妥协的。保持补丁更新——涵盖物理和虚拟基础设施。审查您的内部通信计划，以通知管理员漏洞情况，包括定期审查分发列表以确认其准确性。安装“闲置软件”（shelfware）。确保安全防护的正确配置。备份数据（并测试备份系统）。定期进行渗透测试，并向执行层和董事会提供进度报告。\n\
  * 首席安全官（CISO）和首席信息官（CIO）必须在指标和目标上达成一致。在每个计划周期初期，为适当的网络安全卫生建立角色和职责，包括补丁、备份、多因素身份验证等。\n\
  * 识别并分配预算用于 IT 与网络安全的比例。约定关键绩效指标（`KPIs`）和服务协议（`SLAs`），以优先考虑工作并在发生争议时解决问题。\n* 投资能够提升您的业务价值并降低竞争对手价值的技术。\n\
  \    * 云访问安全代理（`CASB`）技术有助于保护授权和未授权的云服务。\n    * 欺骗技术可以分散并混淆对手。\n* 使用人工智能（`AI`）能力识别最先进的威胁并解决人才短缺问题，但要了解其局限性。`AI`\
  \ 会产生更多的误报。传统的威胁情报有更多的漏报。两者结合可以产生高效能且误报率更低。\n* 在公司中竖扬网络安全的旗帜。\n    * 通过使用董事会及其高管的语言（风险管理）进行纵向传播。与财务部门合作，将网络安全术语转化为董事会最易理解和重视的指标和结果。\n\
  \    * 通过文化意识活动进行水平传播。聘请沟通专家与人力资源部门和营销部门合作，开发有效的活动，使网络安全成为每个人日常工作的一部分。向职能同仁交付可行的评分卡，衡量员工对网络安全原则的理解以及对公司政策的遵守情况。\n\
  \n## Notes\n\n1. D. Frances, “Ready for the Big One,” *Sonoma Index Tribune*, 2014\
  \ 年 1 月 30 日, `https://www.sonomanews.com/csp/mediapool/sites/SIT/News/story.csp?cid=3387701&sid=744&fid=181&sba=AAS`.\n\
  2. `https://www.usgs.gov/faqs/can-you-predict-earthquakes?qt-news_science_products=0#qt-news_science_products`,\
  \ 访问于 2019 年 3 月 20 日。\n3. “Quake Predictor Suspended from Job,” *San Marino Tribune*（以及\
  \ *San Marino News*），1989 年 11 月 23 日，星期四，第 10 页。\n\n# 致谢\n\n我了解到，生活中的几乎每件事都是团队运动，编写这本手册也不例外。感谢你，读者，选择了在网络安全领域投入自己的力量。我感谢以下个人，感谢他们为这本书的诞生所付出的无私贡献：\n\
