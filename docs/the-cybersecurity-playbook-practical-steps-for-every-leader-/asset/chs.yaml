- "# 网络安全攻略书：每位领导者与员工的实用步骤——让您的组织更安全\n\n\n\n\n\n\n“百胶片先生”（选自《芝加哥》）\n\n歌词：Fred Ebb\n\
  音乐：John Kander\n\n\n\n\n\n\n\n\n\n# 献辞\n\n*致 Frank，我生命中的挚爱，你还没有读过我写的任何东西，包括这一本。感谢你的爱并让我脚踏实地。*\n\
  \n\n13. 作者简介\n\n\n\n\n\n\n\n# 第一章：我毁掉复活节的经历\n\n我经历过比这更好的周日。\n\n那是 2017 年 4 月 16\
  \ 日，复活节。我刚和丈夫做完一顿家晚餐。现在是时候放松一下，利用 `Netflix` 上最近的一部热门剧享受几个小时的空闲时光了。我完全不知道，自己即将主演一场现实生活中的戏剧，而且程度比剧要尴尬得多。\n\
  \n我的手机亮了，我低了一眼屏幕。是来自 `Chatelle` 的短信，她是我们的首席人力资源官（`CHRO`）。Chatelle 和我关系很近。12 天前，我们刚刚联手帮助\
  \ `McAfee` 从 `Intel` 拆分，成为全球最大的网络安全公司之一。在复活节收到她的短信并不稀奇，假设那是那种朋友间节日的祝福之词。但这条短信不是那种类别的。\n\
  \n*   `你需要检查一下我们的社交媒体页面。情况糟透了。`\n\n当我从某个非常著名的社交媒体平台上打开 `McAfee` 的公司主页时（该平台的名称在这段真实故事中已被隐藏），我立刻感到血压飙升。我惊坏了。\n\
  \n有人刻意破坏了我们这家成立仅 12 天的公司的社交简介，上面使用了最猥秽、最具冒犯性的语言，针对了各行各业。这对于任何公司来说都是糟糕的。但让我试着描述一下这对我们来说有多么糟糕。\n\
  \n那些侮辱性的头衔与我们公司所代表的一切形成了鲜明对比。我们刚刚用新的口号 `Together is power` 重新发布了品牌，这反映了我们的信念：需要*各种类型*的力量来保护我们的世界免受网络威胁。在公司成立时，我们向所有员工发布了新的价值观，其中之一就是推崇*包容性的*坦诚与透明。而且我们还是*网络安全*领域的领导者。如果我们连自己在最大的社交媒体平台上的公司简介都无法保护，客户会对我们保护他们最珍贵数字资产的能力何何？更糟糕的是，我的团队——营销部门——负责管理我们在所有社交渠道上的公司简介，包括这个正对着我脸的臭页面。\n\
  \n我立即行动起来。我必须找到数字团队的负责人搞清楚发生了什么。我立刻联系了她，甚至不需要解释电话不是为了祝她复活节快乐。\n\n*   `我知道你为什么打过来。我们正在处理。我们的账号被黑了。我们正在和[社交媒体平台公司]沟通以解决这个问题。`\n\
  \n我开始往最坏处想。社交简介被黑是一回事。如果这是一个针对 `McAfee` 的协同攻击，背后有更大的目标呢？黑客正通过这场“火警演习”转移我们的注意力，同时悄悄渗透我们公司的系统？\n\
  \n\n\n\n她立即安慰我，我们的首席信息安全官（CISO）已经在处理此事了，并确认我们的系统是安全的。我的一时间松了一口气——直到我意识到我再打一个电话。我们的\
  \ CEO 需要知道发生了什么。而我希望他从我口中听到这个消息。我正准备毁掉他的复活节周日。他几乎瞬间接起了电话：\n\n*   “Chris，我们的一个社交媒体账号被黑了。”\n\
  *   他的反应很克制。“严重成什么？”\n*   “我们的公司服务器没问题，Chris。被黑的是我们在社交媒体网站上的公司主页。”\n\n我向他解释了发生了什么。我们的社交媒体经理加文（Gavin）是第一个发现攻击的人。加文当时在家里，做着社交媒体极客在假日做的事——他正在上网。下午\
  \ 5 点左右，他看到社交媒体平台上出现了一条状态更新，里面是一堆随机字母。他本以为是团队里的某人不小心手机触发了更新。加文删删了那条随机帖子。\n\n随后，他提醒了他的团队，看是谁可能不小心创建了那个帖子。没有人对此一无所知。很快，另一条毫无意义的帖子出现了。这现在不再是随机的。\n\
  \n加文登录社交媒体平台，进入账户设置区域。所有的名字都是拥有该账户管理权限的人员。尽管如此，为了稳妥起见，加文开始删除所有其他管理员。\n\n正当他操作时，页面刷新了，加文被锁在了账户之外。\n\
  \n现在毫无疑问，这是恶意的。在那一瞬间，加文意识到，他删除奇怪帖子的行为已经提醒了黑客，让 McAfee 察觉到了篡改。这就像科技犯罪剧剧中经典的竞速：手指在键盘上飞舞，图标在进程完成时旋转，信息不断闪烁，这种只有好莱坞才能呈现的画面。加文和我们的黑客正在在线进行同样的操作。即使没有跳动的背景音乐，那种紧张感同样充满戏剧性。加文说：“我正试图删除所有其他管理员，而黑客也在做同样的事。他赢了我。”\n\
  \n在和 CEO 挂电话之前，我还有最后一个令人失望的消息要分享：\n\n*   “哦，还有 Chris，当你查看我们的社交资料页时，你现在不仅会看到那些攻击性的帖子，还会看到我们的公司\
  \ Logo 被换了一张像鸟的图像。仔细看。那根本不是鸟。那是……嗯。那是身体部位。”\n\n在黑客社区中，用色秽画作篡改网站很常见，表示某人被“pwned”了——这是黑客俚语，意为以羞辱的方式击败——被“占有”。现在黑客知道我们被锁在外面，且他暂时掌握了控制权，他又添加了一张色秽图像来替换我们新的公司\
  \ Logo，以防万一。\n\n我的团队疯狂地与社交媒体平台公司联系以解决问题。但是……在假日期间事情进展并不快。而且由于现在是傍晚，我们只能与该公司的亚太地区（APAC）小组协作，这感觉就像时间本身必须物理性跨越我们与支持团队之间的海洋。分钟变得像爬行一样缓慢。\n\
  \n我们等待了似乎永恒那么久。因为被黑的不是我们的服务器，我无法指派 McAfee 的大团队来处理这个第三方问题。我们只能每隔几分钟与该公司的支持团队联系一次，得到的却是他们“正在处理”。\n\
  \n大约 30 分钟后，我们收到消息，社交媒体公司已经锁定了我们公司主页的*所有*管理员，现在只有他们有访问权限。那是好消息——至少不会再造成损害了。\n\n\
  坏消息是？他们没有办法简单地将页面回滚到 30 分钟前的状态。他们的程序是锁定页面以防止任何进一步的更改，然后遵循验证和分析程序：对于验证，他们想确保我们确实是我们所称的身份，而不是一个打电话来冒充\
  \ McAfee 的黑客（这真讽讽刺！）。然后进入分析阶段，他们想在采取任何进一步行动之前研究攻击的范围。\n\n但那张色秽图像呢？它仍然挂在我们的公司主页上。更糟糕的是，这家社交媒体提供商的运作方式是，所有在该平台上拥有个人页面且声称在\
  \ McAfee 任职的员工——他们的个人页面现在也用那张色秽图像替换了我们的 Logo！\n\n包括我的在内。\n\n在我收到的下一次更新中，支持团队说他们还没有完成“程序”。他们说回滚页面的唯一方法是先重新激活账户——解锁它——而在他们完成安全审查之前，他们不会那样做。\n\
  \n认真的吗？这到底是怎么发生的？在他们完成审查之前，我们的公司主页*什么*也做不了。我们完全听命于他们。我们的员工能做的最多就是从自己的个人页面上删除任何关于\
  \ McAfee 的提及，一些意识到该事件的人确实这样做了。\n\n但这还不够。我继续毁掉别人的复活节周日，同时向我们的执行团队通报了该事件。我们确保了公司的服务器是安全的，但这并不意味着\
  \ McAfee 没有通过其他社交渠道受到攻击。我们完全不知道自己的高管成员——以及他们的社交资料人设——是否是下一个目标。\n\n我通过电子邮件和群组短信发出警报，指示我们的执行团队立即在所有社交网络网站的个人资料上开启多因素身份验证（稍后将将详细介绍多因素身份验证）。\n\
  \n我遵循了自己的建议，开始在任何可以的个人页面上疯狂地开启该安全功能，直到我在一个非常流行的社交网络平台上陷入了无策。\n\n\n\n我告诉你们这个故事，不仅仅是因为它很有趣，也不仅仅是为了让你觉得“嘿，这比我好多了！”我从这个故事开始，是因为它是我们在书中剩余部分中将要讨论的内容的缩影。\n\
  \n为了让你觉得这书值票——在第一章中——我将现在说明这次黑客攻击是如何发生的，以及我们之后做了什么。最重要的是，我将列出你明天早上上班时可以采取的步骤，确保这种情况不会发生在你身上。\n\
  \n## 惨痛换来的教训\n\n当我们重新获得账户的控制权时，我们要求社交媒体公司告诉我们仪表板中哪个管理员账户负责了这些更改。\n\n结果证明，那是我们一家媒体投放代理机构的一名员工，她不再为我们工作了——我们叫她\
  \ Julie 吧。她的凭据被一个与大型网络犯罪团伙有关的青少年盗了。Julie 犯了许多人都会犯的错误：她没有养成良好的密码习惯。她使用同一个密码访问多个账户，包括她在该社交媒体平台上的个人资料。而且，由于她是该网站上\
  \ McAfee 公司页面的授权管理员，她的个人凭据让她不仅能够访问自己的个人资料，还能访问我们的。当她的其中一个账户被破解且凭据在暗网上被交易时，黑客简单地尝试在她的其他在线账户上使用该密码。当他们破解了\
  \ Julie 在社交媒体平台上对 McAfee 公司页面的管理员权限时，他们就获成功了。剩下的就是轻而云掌了。\n\n事后诸葛亮明，这个案例也不例外。一号漏洞：`Julie\
  \ 在访问`她的社交媒体账户（以及我们在同一社交媒体平台上作为授权管理员的访问页面）时，`使用了与其他账户相同的密码`。如果她使用了唯一的密码，那么坏人在暗网上购买的凭据将一文不值。更糟糕的是？当收到个人账户被黑的警报时，Julie\
  \ 迅速更改了密码。但她没有更改其他账户的密码，包括故事中提到的那个。这是她的责任。\n\n二号漏洞：`我们本应该要求该社交媒体网站上的所有管理员进行多因素身份验证`。这意味着你不仅需要有正确的密码才能访问系统，还必须输入生成并发送到（例如）你手机上的一次性代码。如果你在要求代码后的几秒钟或几分钟内没有提供代码，你就无法进入。这种类型的认证有几个版本，我在这里做了简化，但你明白其中的意思。这是我们的责任。\n\
  \n三号漏洞：`我们没有进行足够频繁的审查来查看谁不再需要访问`我们的账户。Julie 很久以前还帮助过我们，但在她的活动结束后，我们本应该将她从管理员列表中移除。即使在她活跃于我们我们合作期间，我们仍然可能被破解，但我们对访问管理的疏忽让情况变得糟糕。这绝对是我们的责任。\n\
  \n所有这些行动都会大大减少黑客攻击发生的概率。但假设由于某种疯狂的原因，一个拥有足够动力、技能和运气的黑客能够进入我们的社交媒体账户。让我们看看，如果我们事先实施了某些措施，在发现黑客攻击后，什么可以帮助到我们。\n\
  \n我们本应该有一套`程序，在不暴露我们已察觉攻击的情况下锁定所有管理员`。通过删除那些无意义的帖子，我们提醒了黑客。当黑客看到我们正在删除权限时，他的行动比我们更快。\n\
  \n幸运的是，Gavin 在复活节周日看到了被篡改的页面。否则我们可能不会那么快地发现篡改。现在我们有一个工具，它使用机器学习来检测社交媒体网站上的异常图像、脏话、诽谤和其他异常材料。一旦检测到此类异常活动，它会立即通知我们团队的几位成员。\n\
  \n*注：*我不会点出我们使用的工具，有两个原因：第一，工具更新换快，而且它们在不同时间的有效性也往往不同。换句话说，当一个工具刚发布时，它可能非常有效——直到黑客找到绕过它的办法。因为不知道你什么时候读到这本书，我不想赞美一个在你真正阅读这些文字时我可能已经不再使用的东西。\n\
  \n不提及该工具的第二个原因是， McAfee 本身就是一个巨大的靶子。回到关于惨痛教训的故事：\n\n当我们向社交媒体公司报告黑客攻击时，我们并不知道他们处理此类问题的程序。失误。直到那时我们发现，他们的政策是冻结账户几个小时。\n\
  \n我们从惨痛中学到金钱是说话的。我们现在提前询问这些程序，因为我们通过代理机构在该网站上花费了大量的广告费，我们看起来比实际规模的账户要小。今天，`我们直接向社交媒体平台付费`以减少这种威胁。\n\
  \n我们学到`与我们开展业务的第三方公司可能没有安全实践`。因为我们在工具上投入了资金，我们有助于准确反映我们的投资，并获得应得的服务。\n\n而且，我们学到`与你有关系的第三方公司可能没有[这些]`。对于那些有权访问你的系统或作为你组织延伸部分的公司来说，记住这一点尤为重要。特别是那些没有正式\
  \ IT 和安全团队的较小的第三方公司，更不用说严谨的网络安全措施了。\n\n最后，对那个复活节不幸事件的事后分析给了我们最后致命的一击。McAfee 在这次攻击中甚至不是一个被刻意的目标。黑客在破解她的凭据时并没有意识到\
  \ Julie 是一个管理员。他不知道（也不关心）Julie 是谁。他只是在寻找密码。他的奖励只有在确定密码解锁了什么之后才会出现——无论是银行账户、公司网络或其他。一旦他发现恰好解锁了\
  \ McAfee 在社交网络上页面的密钥，他就在那里发泄了他的攻击，得罪了每一个人并在过程中羞辱了我们。*即使对于黑客来说，有时运气比能力更重要。\n\n##\
  \ 给你的额外教训\n\n- **建立一个可以联系和升级处理的人员名单**。确保你和你的团队可以随时访问。此外，名单不仅要包含你团队的人员，还必须包括网站、社交媒体、云存储等供应商的人员。\n\
  - **在工作职责描述中加入定期审查谁有访问权限**，并清理列表以移除不再负责这些项目的人。\n- **使用多因素身份验证**。对于某些系统，我们可以自动检测我们的用户是否开启了它，如果用户关闭了它（例如切换到新电脑时的几分钟），系统会告诉我们。对于我们直接控制力较弱的系统（例如云服务），我们要求用户发送开启多因素身份验证的截图。\n\
  \n你可以想象，我们现在发布页面之前会严格审查社交媒体。除了我上面提到的措施之外，我们还会问：\n\n- 你们如何处理个人身份信息？\n\n\n\n\n*  \
  \ 你们正在使用什么技术？（我们将获取答案并进行漏洞评估。）\n*   你们的访问管理系统是如何工作的？\n*   允许哪些第三方工具连接到你们的平台，以便在攻击后自动执行必要的内容回滚？\n\
  *   如果账户被劫持，你们的升级流程是怎样的？\n*   你们应对黑客攻击以及帮助客户恢复到攻击前内容的服务水平协议（SLA）是什么样的？\n\n## 谁的错？\n\
  \n当然，社交媒体提供商可以辩称，我们没有做一些显而易见的事，比如通过经常审查将管理员人数减至最低、坚持使用唯一的强密码等等。但，他们那种僵化的政策也无济于事，即使网站遭受了显而易见、严重的攻击，也必须在“分析”完成之前一直保持现状。当然，该机构的人员也不应该在多个账户上重复同一个密码。\n\
  \n但请注意，我给这一章起的标题是“*我*毁了复活节”。不，我没有黑进 McAfee 的公司社交页面。我没有故意放开大门让坏分子做同样的事。在那个复活节周日，我最不希望面对的就是处理由于多个方面的喜剧性错误和种种巧合而导致的局面。尽管如此，我只能对事件的发生负责。因为归根结底，那个公司社交页面是在我团队的监督下的。我们未能采取合理措施来履行保护它的职责。\n\
  \n个人责任是一件令人不安的事物。我们中很少有人乐于思考我们本可以做些什么更好或不同的事情，以避免不幸事件的发生。推卸责任是更符合人性的反应。然而，正是我们这种推卸个人责任的倾向，仍然是黑客社区武器库中的一把关键武器。\n\
  \n长期以来，网络安全一直是“别人”的问题。对于太多人来说，网络安全是一个晦涩的话题，不值得他们投入时间，更不用说个人责任了。这本书试图改变这种叙事，即使只是通过迈出谦虚的一步，承认我们作为组织员工——以及最终的防御者——所共同承担的责任。如果我们的公司不能信任我们采取合理的预防措施来保护其最神圣的数字资产，它还能信任谁呢？\n\
  \n让我放下我的教条台，承认真正的问题。并不是说员工（普遍而言）并不*想*做正确的事。更多的情况是，他们根本不知道*该*怎么做。\n\n网络安全是一项团队运动，每个人在比赛的每一分钟都需要守好自己的位置。工具可以非常有帮助，但只有当人员、工具、程序、定期审查和其他因素共同作用时，它们才能形成有效的防御。\n\
  \n## 记住这个关键要素\n\n减少网络威胁的另一个关键要素是诚实。对于一本以我的名字命名的书，开头就描述一个在我监督下发生的尴尬安全失败，我显然超出了自己的舒适区。情况本可能更糟糕吗？绝对可能。它本不应该发生吗？绝对应该。\n\
  \n而且，那可能是你而不是我吗？同样，绝对可能。\n\n通过告诉你们这个故事，我想设定一种诚实的基调，这种基调在你们努力击败坏人的业务中也是需要的：你们需要建立一种安全文化，让人们不仅能够互相帮助，而且在看到不安全操作时彼此诚实。这是一种没有愤怒、指责或报复的诚实，它对于这种文化的运作至关重要。\n\
  \n描述我们社交媒体遭攻击的第二个原因是，让你能够汲取这些教训并立即应用到你看到自己安全盔甲存在漏洞的地方。\n\n## 为什么是我？\n\n市面上不乏由声誉良好、才华横溢且经验丰富的作者创作的的网络安全书籍。你会发现一些是记者写的，他们剖析了历史上一些最传奇的入侵事件。你还会发现另一些由名人物写的，他们以行业受尊敬的先驱身份进行权威发言。你还会发现更多由技术专家编写的，他们详尽地解读了网络安全复杂的元素。\n\
  \n但是，当我打出这些字时，你找不到许多由营销人员撰写的网络安全书籍。而在该行业只有几年的营销人员撰写的书籍可能更少。那么，为什么要信任这个作者处理如此严肃的话题呢？\n\
  \n把我想象成营销与技术之间的混合体吧。我的职业生涯一直致力于将技术概念翻译成日常语言。我研究工作与技术的交汇点，以理解企业文化是如何变化的。\n\n所以，如果你是一个通常的非技术人员，请放心，我努力向你提供足够的教育，让你理解这个棘手话题的细微差别，而不会让你被技术细节淹没。如果你比我更懂技术，虽然我不会淡化这个话题，但我会提供每个员工（无论技术背景与否）都可以练习以保护其组织的处方。最后，如果你是我网络安全领域的兄弟胞，我希望你阅读并享受这本书，将其作为窥视我们世界的窗口。然后，我想让你传给你的非网络安全同事，招募他们加入我们的战斗。\n\
  \n## 为什么是你？\n\n你可能认为自己是一个网络安全领域无法提供太多贡献的人。毕竟，那些不在网络安全走廊内的员工、经理、高管和董事会成员，如何能在一个他们可能都不理解的游戏中真正发挥有意义的作用呢？\n\
  \n这就是我转向职业体育世界寻求启发的地方，因为它经常揭示了许多我们都可以学习的关于团队合作的教训。虽然我不是一个运动狂，但我对美式橄榄球情有独钟。那是因为我小学低年级时美好的记忆：坐在家里的沙发上，坐在爸爸身边，看他最喜欢的比赛。\n\
  \n\n\n\n“12 人”（西雅鹰队球迷的称呼）真的有那么大吗？大多数情况下，是的。但事实证明，他们的体育场也经过了特殊设计以保留声音。与其他声音会自然消散在空气中的开放体育场不同，西雅鹰队的体育场拥有第二看台和顶篷，可以将声音向下反射，当“12\
  \ 人”怒吼时会产生震天的嘈杂声。(1) 西雅鹰组织付出了巨大努力将“12 人”招募为团队的一部分——确保这些球迷能将集体力量带入比赛，几乎与球场上的球员并肩作战。\n\
  \n“第 12 人”告诉我们，观众可以影响结果。但他们必须投入其中。他们必须被召唤。这就要你大显身手了。写这本书是为了让每个非专业人士意识到自己在永不停进行的网络安全战中的重要性。没有人可以责怪你没有尽早承担起责任。但在读完这本书之后，也没有人可以借口推卸你的责任。\n\
  \n本书试图通过从许多其他值得读的书籍结束的地方继续对话，来推进讨论：为商业非专业人士提供一份可以立即执行的行动计划，成为组织网络安全议程的一部分。如果你仍然质疑这个议程是否应该包含你，请意识到它已经包含了你。网络犯罪分子正指望员工的冷漠或缺乏投入来对目标大肆破坏。如果你不积极站在公司的一边战斗，你很可能在不经意间成为了敌人一方的棋子。如果你重视在线自由，如果你在乎用于决策的数据没有被篡改，如果你坚持认为你的连接设备被用于善意而非伤害，那么你已经与工作场所的网络安全专业人士共享同一个使命。你与我们网络安全领域人的共同点比你想象的要多。\n\
  \n## W.I.S.D.O.M.\n\n在 McAfee（麦菲），执行团队非常重视发展。我们每季度开一次会，将“工作”带回“团队合作”中。我们互相指导，分享职业历程中的亲密故事，并重新承诺对彼此和员工更加真实。在这些发展课程结束时，我们会练习从我们的领导力开发伙伴\
  \ AIP 小组那里学到的东西，被称为 `W.I.S.D.O.M.`。它代表 `W`hat `I`’ll `S`ay (and do) `D`ifferently\
  \ `O`n `M`Monday（我周一将如何不同的说法和做法）。我们每个人都做出了 `W.I.S.D.O.M.` 承诺，约束自己和彼此实践我们学到的一项关键发展领域。\n\
  \n同样，我想为这段旅程配备上 `W.I.S.D.O.M.`。这就是为什么在每一章之后，我都会给为你提供一份实用的处方，告诉你周一可以做些什么来提高组织的网络安全态势。有些建议表面上平庸，但对你的成功可能产生重大影响。另一些则需要更多努力，但登后的风景是值得的。在任何情况下，我都会将每章的处方限制在五项\
  \ `W.I.S.D.O.M.` 以内，因为我想专注于那产生 80% 结果的 20% 的努力。\n\n你将在这些页中看到的建议是：\n\n## Note\n\n\
  1. Louise Bien, “什么让西雅图的第 12 人如此特别?” SB Nation, 2015 年 1 月 22 日, [`www.sbation.com/nfl/2015/01/22/what-makes-seattles-12th-man-so-special/`](https://www.sbation.com/nfl/2015/01/22/what-makes-seattles-12th-man-so-special/).\n\
  \n## 第二章\n\n### 玻璃纸先生/女士\n\n> *即使不像母鸡那样咯咯叫，*\n> *每个人偶尔也会被注意到,*\n> *除非，当然，那个人应该是*\n\
  > *隐形、无道且无关紧要的我。*\n> *玻璃纸，玻璃纸先生*\n> *本该是我的名字，玻璃纸先生，*\n> *因为你可以直接看穿我,*\n> *从我身边走过，却永远不知道我在这里。*\n\
  \n我们许多人都能对阿莫斯（Amos）产生共鸣，有时感觉自己是隐形的。这通常不是一种很好的感觉，往往伴随着被低估或不被赞赏的感觉。被完全误解一点也不趣。\n\n\
  长期以来，首席信息安全官（CISO）一直是我们组织中隐喻的玻璃纸先生/女士，注定要在虚拟的匿名中辛勤工作，持续地专注于安全这项基础工作。他们生活在他们所保护的人的影子里。事实上，如果他们从隐形的斗篷中走出，各方都会出现麻烦。\n\
  \n作为员工，我们不希望被 CISO 或他们的部门打扰。我们只希望他们能保持我们的安全。我们希望他们在不干扰我们的情况下完成这一切。\n\n\n\n例如：麦卡菲（McAfee）报告，平均组织在任何时候都会使用约\
  \ 2000 个云服务。他们的 IT 团队*认为*自己有多少个？接近 30 个。这种认知与现实之间的鸿沟至少可以部分归咎于“影子 IT”——这是一种员工在 IT\
  \ 部门不知情、更不用其授权的情况下，擅自使用云服务的现象。\n\n比首席信息安全官（CISO）被员工看到更糟的情况是什么？是让董事会看到。从历史上看，董事会会对网络安全的兴趣和员工一样小。如果董事会传召一名\
  \ CISO 参加会议，通常不是为了对公司的网络安全状态提供战略性的更新，也不是为了对他的工作表示诚挚的“感谢”。更有可能是为了回答关于数据泄密的棘手问题。\n\
  \n全球专业服务网络德勤点（Deloitte）对董事会进行定期研究，调查了数百家上市公司。直到最近的 2014 年，仅有 5% 的巨型公司设有与“网络安全与 IT”相关相关的董事会设委员会。\n\
  \n因此，CISO 在很大程度上接受了我们在比喻性音乐剧中的阿莫斯（Amos）角色——致力于为那些不感激他的人保护，并注定留在阴影中。\n\n但意图破坏的坏分子正在改写这部音乐剧。几乎每天都有头条新闻（或公司）宣布下一次数据泄露。董事会的氛围正在发生。许多人意识到，将\
  \ CISO 边缘化到影子中意味着他们自身的风险。当德勤在 2016 年重复其董事会研究时，网络安全已成为董事会关注的首要风险，25% 的公司在过去两年内经历过数据泄露。拷贝先生和小姐（Mr.\
  \ and Ms. Cellophane）发现自己已经从后台办公室的角落被解放出来，甚至偶尔还会收到参加董事会议的邀请。\n\n然而，仅仅因为黑客将 CISO\
  \ 推向了灯光中心并不能解决网络安全挑战。董事会开始关注这个问题是令人欣慰的，但仅仅承认只是第一步。提高公司的网络安全态势需要这些双方——技术型的 CISO 和战略型的董事会执行——学习彼此的语言。\n\
  \n让我们从尝试理解我所认为的高管层中最被误解的角色——CISO 开始。这种启发不仅造福了董事会成员，也造福了所有员工。CISO 通过最终从阴影中走出而获益。\n\
  \n## 行业的新面\n\n公司以及组成它们的职能部门已经存在了数百年。银行和制造企业是最早的实体之一，因此，今天许多大型上市公司在财务或运营方面拥有深厚能力也并不令人意外——这些是作为我们企业祖先基础基础的最初学科。\n\
  \n事实上，根据德勤 2016 年的《董事会实践报告》，除了首席执行官（CEO）和总法律顾问外，最有可能定期参加董事会的管理层成员是首席财务官（CFO）（被高达\
  \ 99% 的调查公司引用）和业务部门负责人（被高达 47% 的公司引用）。那么 CISO 呢？相比之下，他仅在最多 11% 的公司董事会中定期亮相。\n\n\
  CISO 们仍在拼命挤入这些闭门会议，这并不令人意外。毕竟，其他职能部门跨越了几个世纪甚至几千年（律师可以声称他们的职能根源可以追溯到古埃及），而 CISO 的角色只追溯到几十年。那时，我们甚至不称之为“网络安全”。这些早期先驱将他们的职业称为“信息安全”，这与他们领域从“信息技术”开始的发展是一致的。\n\
  \n为了理解 CISO 这一相对新的角色，我们对网络安全的起源进行一次简短但重要的溯源至关重要。在过去，物理安全和信息安全在很大程度上是一回事。我记得，在不久前，如果我想访问公司的网络，我是通过一台固定的台式机，连接一根物理以太网线到局域网的。台式电脑和连接它的以太网技术位于我们公司的场所内。因此，访问公司网络的唯一方法是物理上进入公司——这需要实实在在的安全许可，比如我的员工证。在思维和实践中，我将物理安全和信息安全紧密地联系在一起。\n\
  \n我惊讶于仅仅在我的一生中，工作发生了如此大的变化。工作不再是我去的地方；它我所做的事情。我越来越多地在雇主安全的物理边界之外工作。我将职业生活和个人生活无缝融合——在移动设备上回复邮件，在任何可以找到\
  \ WiFi 的地方连接，并访问许多让生活更便利的云服务。\n\n我不是唯一一个接受无绳体验工作的人。让我们考虑一下我们较新的工作行为对必须保护我们和公司的 CISO\
  \ 造成了指数级增长的压力。在任何时候，我们的 CISO 都在平衡三种战略努力之一或多个：\n\n### 1. 转型\n\n技术的每采用，无论是移动性、云还是物联网（IoT），都会使公司面临更大的风险。这是因为在过程中，企业的安全边界不断被侵蚀。\n\
  \n例如：谁“拥有”互联网？这是一个像比庭迷宫一样复杂的问题，让我们中最具技术背景的人也感到头晕。\n\n谁“拥有”公共云基础设施（如亚马逊、谷歌和微软提供的设施）？这个问题至少更容易回答——这些公司负责那些云环境的物理安全。但这等同于说他们拥有对那些巨大数据中心的物理访问权，就像我们的公司拥有我们工作的建筑一样。云盗窃通常不是资源丰富的窃盗闯入大型网络公司物理数据中心的结果。它是网络犯罪分子找到黑入存储在或穿过此类数据中心的数据的结果。\n\
  \n谁最终“拥有”这些数据的责任？这是最简单、最清晰的答案：你的公司——只有你的公司——负责保护自身的数据，无论数据存储在何处——无论是在位于你雇主场所的服务器上，还是通过公共云市场租赁的服务器上。\n\
  \n云只是 CISO 对存储或传输其公司数据的基础设施控制力退缩的一个例子。自带设备（BYOD）运动将长期存在，这意味着公司配发的移动设备可能很快成为过去的遗迹。许多公司急于允许员工在他们选择的任何移动设备上工作是有理由的。根据\
  \ Frost & Sullivan 的数据，使用手机工作每天为员工节省了近小时的时间，同时提高了 34% 的生产力。\n\n\n\n\n为了让转型目标变得更加困难，旧技术具有非常长的生命周期。即使业务部门正忙于部署云服务（无论是否获得\
  \ IT 部门的正式许可），仍有长尾本地基础设施必须维护。以 USB 闪存盘为例：2017 年，本·古利恩大学的研究人员记录了 29 种破坏 USB 设备的已知攻击向量.^(7)\
  \ 此外，无软件硬件加密 USB 闪盘的制造商 Apricorn 在 2017 年报告说，虽然 90% 的员工使用 USB 闪盘，但只有 20% 的人在使用时加密.^(8)\n\
  \n由于长尾遗留技术基础设施很少消失，且绝不会消失得很快，这些转型追求意味着范围和责任的风险化扩张。\n\n我们的 CISO（首席信息安全官）该怎么办？如果轻率地支持一个全方位开放、随心所欲的环境，他会让自己的组织面临日益增加的风险。如果为了遏制潜在威胁而成为“拒绝”的部门，他可能会被那些他必须保护的员工所架空（还记得平均公司中有近\
  \ 2000 个 IT 专业人员并不情的情况下使用的云服务吗？）。\n\nCISO 处在一个不令人羡慕的境地。他必须在保护公司最宝贵的数字资产的同时，推进转型议程。遗憾的是，这些任务之间的冲突再不过了。\n\
  \n### 2. 风险管理\n\n网络犯罪是一门大生意——准确地说，2017 年是一项规模达 6000 亿美元的业务，比 2014 年增加了 1000 亿美元.^(9)\
  \ 从全球范围内，网络犯罪作为经济危害排名第三，仅次于政府腐败和毒品。\n\n我们是如何走到这一步的？曾经，网络安全相对“简单”。安全不仅局限于物理层面（如前所述），处理威胁也容易得多。2006\
  \ 年，McAfee 每天检测到 25 个新威胁。十年后，这个数字飙升到 50 万——意味着每秒超过 5 个新威胁！\n\n数量只是挑战的一部分。过去发现威胁是很直观的。威胁以恶意软件的形式出现——即由坏人设计、旨在给受害者造成破坏性影响的软件。网络安全行业谈论“传统”恶意软件，包括那些你熟之于详并深厌恶的病毒。恶意软件曾只带有一段静态代码字符串，让行业能够将其识别为恶意软件。你可以将其视为某种软件指纹——网络安全行业称之为\
  \ `signature`（签名）。就像执法部门依靠国家登记处根据指纹识别罪犯一样，网络安全行业寻找 `software signatures` 以将已知恶意软件加载到自己的数据库中。如果在文件中发现了\
  \ `signature`，该文件将被拦截，威胁将被遏制。\n\n### 威胁的演变：从恶意软件到无文件攻击\n\n时代已经变了。最阴险的威胁不再显眼地披着已知且易于识别的指纹。坏分子变得聪明得多了。当你读到这里时，最新的网络安全威胁几乎没有列在这里，但在我写这些文字时，我的行业正痴于“无文件”攻击。这些威胁秘密地利用你组织内部受信任的技术，例如经过批准的工具和应用程序。然后它们就开始造成破坏。\n\
  \n### 2.1 勒索软件与利用的兴起\n\n数量只是挑战的一部分。过去发现威胁是很直观的。…… `The industry is fixated on “fileless”\
  \ attacks. These threats surreptreptit exploit exploit trusted within within your\
  \ organization, like sanctioned and and.... the the the the ` ` ` ` the the the\
  \ the the the the the the to the.. `CISO 在缓解风险方面不断走钢丝。他们必须在高流量威胁和可能导致公司崩溃的小流量攻击之间取得正确的平衡。\n\
  \n### 2.. CISO 的挑战\n\n如何让 CISO 向董事会解释这一切？…… `但其核心也很直观。它从根本上说关于风险管理——这是董事成员自然通的语言。CISO\
  \ 在缓解风险方面不断走钢丝。他们必须在高流量威胁和可能导致公司崩溃的小流量攻击之间取得正确的平衡。我们所有人，无论是董事还是其他人，都能在风险管理上与 CISO\
  \ 产生共鸣，因为我们在生活中同样这样做。我们在浴室里脚垫防止跌倒风险（对于大多数年龄段的人来说，这是一个较小的风险）。我们在家里使用烟雾报警器并购买保险单来缓解更灾难性的风险，如火灾。虽然其他真正灾难性的风险（如被陨石击中）可能会发生（是的，这确实在\
  \ 1954 年某一个可怜的人身上发生过^(10)），但考虑到其极小的概率，我们安全地忽略了这些风险。CISO 必须以类似的方式对公司的风险进行分类。我们的 CISO\
  \ 面临的挑战是在简化网络安全主题的同时，不使其化。董事成员的责任是什么？参与讨论，意识到表面下复杂的泥潭很少、甚至永远无法产生明确的决策。战争无法带来清晰，网络安全也是如此。\n\
  \n### 3. 自动化与效率\n\n用更少的资源做更多是现代企业一个令人厌烦的陈词。这也是 CISO 不幸的使命。威胁的数量不仅没有减少的迹象，而且对网络安全专业人才的需求远超劳动力市场的人才供应。根据\
  \ `Cybersecurity Ventures` 的数据，到 2021 年将有超过 350 万个网络安全职位无人无人^(11) ——这足以填满 50 个橄榄球场！\n\
  \n而且问题只会变得恶化。2014 年，网络安全行业估计全球缺口 100 万专业人士。到 2015 年，缺口增加到 150 万。2016 年，预测者认为到 2019\
  \ 年网络安全人才缺口将达到 200 万专业人士.^(12) 正随着威胁不断增加，合格网络安全专业人才的缺口也在扩大。\n\n\n\n\n由于没有足够的人手应对问题，首席信息安全官（CISO）不得不求助于来自大量网络安全供应商的系列产品，他们竞争资金以填补这一空白。与劳动力市场的短缺形成鲜明对比的是，网络安全产品严重过剩，都在争夺\
  \ CISO 有限的预算。截至本文写作，已有 3,500 家网络安全供应商在招揽 CISO。每家供应商都提供一种或多种防御技术，其中许多承诺能够解决一小部分（如果不是大部分）网络安全挑战。\n\
  \n好东西可能也会太多。CISO 可选的丰富网络安全技术恰恰说明了这一公理。CISO 试图证明自己的价值并预测下一次威胁，在历史上他们总是急于采用最新的防御技术，作为其对抗敌者的武器库的一部分。\n\
  \n但在执行这一策略时，他们吃了亏头。这是因为，争夺每一分钱的碎片化供应商格局本身就是一个复杂的科技泥潭，这些技术在大多数情况下无法良好协同工作。很多时候，这些技术被推销、购买，然后放在架子上。预算被消耗了，“闲置软件”不断增加，而组织并没有因为这些创新、意图或投资而变得更加安全。即使技术最终离开了货架并投入部署，它们也很可能没有与组织的其余防御系统集成。\n\
  \n想象一下，在战争中你的库存里是一堆杂乱无章的火器。想象一下部署这些武器时缺乏一致，无法充分覆盖你对敌人的防线。现在，想象你的战斗员之间无法通信，无法分享他们遭遇的威胁信息，无法共同增强你的协同防御。\n\
  \n你可能不需要想象。如果你的公司有这种情况，只需访问其安全运营中心（`SOC`）即可，那是神经中心，你的网络安全同事在公司和无尽攻击之间担任第一响应者。这些前线网络安全专业人员通常继承了多年来的补丁式技术和工具，这些通常是公司几任\
  \ CISO 期间采用的。许多产品并不共享威胁情报，更不用说让网络安全专业人员的工作更容易。你会发现你的网络安全同事在为工具工作，而不是工具为他们工作。\n\n\
  研究网络安全市场的独立行业分析企业策略集团（ESG）报告称，40% 的组织部署了超过 25 种网络安全工具。大约相同比例的人承认手动收集情报馈送。27% 的人认为安全团队将*大部分*时间花在救火上，而不是战略项目上，导致了员工的倦怠和流失——对于面临全球人才短缺危机的\
  \ CISO 来说，这是灾难性的后果。\n\n这还不如此，网络安全行业还隐藏着一个肮脏且不可避免的秘密。事实是：没有任何一种产品可以击败网络犯罪。你可能不会觉得这奇怪。毕竟，这等同于在武器库中只有一种武器就进入了持续战争。你不会这样做并指望能坚持多久。\n\
  \n但现实情况不仅于此。不仅意味着不存在所谓的“银弹”式防御方案可以对所有威胁产生免疫，而是因为，*每种*防御技术在*首次*部署到市场时最有效。这与我们在 IT\
  \ 领域所学到的传统常识完全相反。\n\n想一想。当一种新的 IT 技术进入市场时，大多数公司都不愿做首批采用者。毕竟，为什么要为一个未经证明的技术充当小白鼠呢？让其他公司先走，修复漏洞，并让技术变得更好（更便宜）。然后，再快速跟进部署。对于部署你那些普通的\
  \ IT 技术来说，这似乎是一个明智得多的策略。\n\n但网络安全技术从根本上是不同的。当一个 IT 组织部署最新的填空型 IT 技术时，对面并没有对手在积极阻碍其成功。网络安全并非如此。当市场上有足够多的机构部署了针对某种威胁高度有效的防御技术时，对手就会回到自己的产品实验室，开发针对它的反制措施。他们最终会找到绕过该防御技术的方法，或者让其随着时间推移而失效。（正是在那时，像\
  \ `McAfee` 这样的网络安全供应商会回到我们的实验室，开发针对反制措施的反制措施，竞争继续。）\n\n时间在网络安全中至关重要。新防御技术尽早进入市场尤为重要。这是因为该技术将为最早的采用者提供最大的效能。\n\
  \n所以，让我们尝试像 CISO 一样思考，来解决这个难题：\n\n1.  没有一种单一的防御技术可以击败所有类型的网络攻击——攻击种类实在太多了，而且敌人每天都在创新。你需要部署来自多个供应商的大量产品，以建立起你最佳的统一防御。\n\
  2.  每种防御技术在首次部署到市场时最有效。简而言之，你想成为最新网络安全技术的早期采用者。这是因为对手还没有足够的动力或时间来开发针对它的反制措施。当他们这样做时，网络安全供应商与对手之间就会展开猫鼠游戏，双方都针对对方开发反制措施。\n\
  3.  所以，率先部署非常重要。但你（以及行业其他部分）正面临着人才短缺。你的团队中没有足够的人来快速实施防御技术。即使你可以做到，很可能你也没有以协调的方式部署这些防御措施，导致你环境中的所有技术无法协同工作、共享威胁情报并使用一致的工具运行。\n\
  4.  而且由于你的防御技术无法无缝共享威胁情报，你有限的网络安全人员不得不来填补漏洞。鉴于威胁的数量和复杂性呈指数级增长，你的团队必须在检测和修复环境中最隐蔽的威胁时，从噪音中识别出信号——在你的敌人占据上风之前。\n\
  \n谁想要这种挑战？并不多。这就是为什么网络安全专业人员真正是我们公司的无名英雄。他们为我们而战。他们处于阴影中，隐形无迹，他们的努力很大没有得到认可。\n\n\
  \n\n\n读这本书的每人要么是网络安全问题的一部分，要么是其公司解决方案解决方案的一部分。首席执行官和董事成员也不例外。有多种方法可以让你最终注意到我们中的那些“**透明人**”（`Mr./Ms.\
  \ Cellophanes`），并给予他们应得的认可和支持。\n\n## 将网络安全作为董事会议程\n\n首先，网络安全不应该是董事会议程中随机或零星出现的话题。更重要的是，它不是一个可以一直忽视直到不可避免的违规发生的话题。董事会必须将网络安全列为常规议题。我并不天真到认为网络安全能获得与财务表现同等的时间或关注。但如果董事会确实担心降低风险（我相信大多数董事都是如此），那么请在你的议程中为网络安全留出合理的时间。\n\
  \n### 你应该分配多少时间？\n\n这取决于你的董事会对会对这一主题的理解程度如何。如果你还没有让你的 `CISO` 对你目前的网络安全态势提供有意义的见解，`请为该主题分配至少\
  \ 90 分钟。` 在这段时间内，你的 `CISO` 应该涵盖对整个公司最关重要的资产。\n\n这需要与业务部门领导者进行大量的沟通。正确的答案可能并不显而易见。例如，客户数据可能不是你组织最宝贵的资产（尽管它在列表中可能排名非常靠前）。如果你经营的是大型制造设施业务，这些场所可能是你最具战略意义的资产（而且，随着连接设备渗透到业务的几乎每一个方面，有动机会的黑客往往会破坏[即使不是关停]这些设施）。\n\
  \n你的 `CISO` 应该根据资产战略价值的优先级次序，提供每项资产的当前漏洞状态。在不分分简化任务的情况下，你可以想象一个 2x2 的矩阵，漏洞状态和战略优先级分别绘制在两个轴上。`那些既具有高度战略性又高度脆弱的资产应该立即重新分配预算。`\n\
  \n在预算分配方面，虽然这看起来是这项练习的显而易见的成果，但大多数董事倾向于在发生违规时才松腰包——这也是一个很高的要求。2017 年，`EY` 的全球信息安全调查发现，76%\
  \ 的高管承认，只有在发生实际损害的违规时，才会触发额外的网络安全资源分配。没有损害的违规？近三分之二的人说这不会迫使额外支出.^(15)\n\n拥有足够的网络安全知识以对网络风险提供有效监督是关重要的。然而，少于\
  \ 40% 的董事会具备这些知识.^(16)\n\n一旦你的董事会和 `CISO` 达成一致，让你的 `CISO` 成为董事会的常驻参加者。网络安全的变化以令人眩晕的速度进行。你的对手非常有动力伤害你。他们不休息，你也不应该。\n\
  \n`在每次董事会议上至少花 30 分钟讨论网络安全话题。` 如果平均董事会每年开六次，每次四小时，我要求你在这个重要话题上花费少于总时间的 15%。`Deloitte`\
  \ 报告称，少于 20% 的董事会将网络安全列为常规董事会议程.^(17) 如果 `Deloitte` 的说法是正确的，且网络安全也是大多数董事面临的首要风险，那么每年定期讨论三个小时似乎是完全合理的的。\n\
  \n### 风险评估与测试纪律\n\n让 `CISO` 在这些会议中更新你的风险评估。他应该准备好讨论你的资产的漏洞格局发生了什么变化。`他将通过提供网络安全行业所谓的“红队演习”或“渗透测试”的结果来获取这些信息。坚持将这些练习作为一种纪律。`\
  \ 这些是你的 `CISO` 协调针对你公司进行的模拟攻击，以测试其防御能力。他将组织两个团队——红队（攻击者）和蓝队（防御者）。红队通常由外部实体的专家组成，试图突破蓝队（公司）。通过这项练习，公司将发现其此前未知的漏洞。\n\
  \n请记住：红队`总是`会获胜。而这是一件`好`事。你希望在黑客之前发现你公司的漏洞。补偿外部机构来发现你的网络安全弱点，比在发生实际违规时付给对手（以及监管机构）要具成本效益得多。\n\
  \n最后，`考虑任命一位具有网络安全专业知识的董事成员。`此人将为会议带来独特的视角。作为网络安全的管理者，他将确保你的董事会不会退回到将该功能推回阴影之中。Deloitte`\
  \ 报告称，超过 80% 的公司在过去两年内没有向董事会增加具有网络安全专业知识的人.^(18)\n\n## 让“透明人”可见\n\n`CISO` 是执行团队中不可或缺、且往往被低估的成员。虽然网络安全是每个人的责任，但董事会对\
  \ CEO 必须从组织高层设定正确的基调。你必须尽你的职责，将网络安全提升到它在你们桌上应有的地位。\n\n我最喜欢的电影台词之一来自《犯罪嫌疑人》：“魔鬼所施过的最大的诡计，就是让世界相信他不存在。”你的对手无无多求的就是让你把你的“透明人”整齐地藏在阴影中。他们希望如果你这样做，也会忽视他们——那些试图伤害你组织的日益增加的黑客。这些坏分子希望你将网络安全视为非战略性的投资。不要赋予他们这种权力。\n\
  \n如果你在这一点上失败了，你可能会失去执行团队最有价值的成员之一：`透明人`。而且我提到的那种网络安全人才短缺将证明你很快无法招聘到替代者。\n\n`CISOs`\
  \ 在公司的任期相对短，某些行业基准低至 24 个月。`ESG` 试图找出为什么 `CISO` 的寿命如此短暂。网络安全劳动力市场目前及可预见的未来都是卖方市场（多亏于那种人才短缺）。但\
  \ `ESG` 发现，当一个 `CISO` 辞职加入另一公司时，因素不仅仅是薪水：\n\n- 36% 的离开是因为雇主没有强调网络安全的企业文化（幸好你在读这本书！）；\n\
  - 34% 的离开是因为他们不是管理层和董事会的活跃参与者；\n- 30% 的是因为网络安全预算与组织的规模或行业不匹配而离开.^(19)\n\nCEO 和董事会可以做很多来成为网络安全解决方案的一部分，包括让你的\
  \ `CISO` 发出声音。除了让她参与对话之外，还要为她提供一个争取更多资源的平台（根据我向你分享的内容，她对更多资金的需求很可能是合法的）。尽管如此，要将她视为执行成员，并通过提问尖锐的问题来检查她的论点。为了做到这一点，你必须首先丰富对网络安全问题的理解——我希望本章对你有所帮助。\n\
  \n\n\n\n\n首席信息安全官（CISO）的真实内在并非脆弱的塑料薄膜。在转型转型的阵阵强风中，她拥有钢铁般的脊梁；拥有铁拳来击碎无止境的攻击攻势；还有混凝土般的下颌，以承受足以让其他较弱者瘫痪的指责冲击。当你最终意识到并欣赏了这些执行管理团队中最受误解成员所属的坚毅与决心时，你便将网络安全带出了阴影，同时也带走了那些最不愿留在阴影之中的敌手。\n\
  \n## 注释\n\n1. McAfee，“云采纳与风险报告”，2019。\n2. 我正在分享许多深耕网络安全挑战和成功企业最佳实践的人的明智见解。在此过程中我会分享\
