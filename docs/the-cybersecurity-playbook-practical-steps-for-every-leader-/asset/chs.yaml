  \ 年 8 月 22 日，[`www.washingtonpost.com/technology/2018/08/22/western-australian-government-officials-used-password-their-password-cool-cool/?utm_term=.d28180e988e7`](https://www.washingtonpost.com/technology/2018/08/22/western-australian-government-officials-used-password-their-password-cool-cool/?utm_term=.d28180e988e7)。\n\
