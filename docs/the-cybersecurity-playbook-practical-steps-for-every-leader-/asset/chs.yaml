  5.  ^(5) Korin Miller, “你可能患有蠕虫却不知道”, Self, 4 月 6 日, [`www.self.com/story/you-can-have-bed-bugs-and-not-know-it-heres-what-to-out/`](https://www.self.com/story/you-can-have-bed-bugs-and-not-know-it-heres-what-to-out/)\n\
