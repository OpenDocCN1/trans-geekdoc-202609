  \n# 第 5 章 弥合差距\n\n## 当过好的东西也会变成坏事\n\n像许多公司一样，麦咖啡菲也有愿景、使命和价值观。我们的愿景反映了我们对行业和世界的追求。我们的使命指导战略。我们的价值观表达了我们是谁。但与许多公司不同的是，我们还有一份承诺。虽然我们的愿景、使命和价值观分别反映了我们的抱负、思考和行为，但我们的承诺提醒着我们的使命：\n\
  \n> 我们致力于维护世界安全。\n\n> 威胁不再局限于计算机，而是渗透到世界的每一个角落。\n\n> 为了保护家庭、社区和国家安全，我们永不懈。\n\n你在全球任何麦咖啡菲所在地都能看到这些文字。除了承诺，我们的墙上还纪念了数千名员工履行该承诺的签名。对于其他远程办公员工（包括居家办公群体），他们可能在加入公司时就已经电子签署了这份承诺。\n\
  \n这份承诺是麦咖啡菲经营业务的核心。我们从事的是网络安全业务。因此，安全成为公司的生命线是理所当然的。尽管如此，我们无法不受那些想要伤害我们的对手的影响。没有公司可以例外。\n\
  \n但是，你的公司——一家可能不是网络安全核心业务的公司——如何培养出将安全嵌入到组织结构中的文化呢？虽然我无法预见到你们未来的墙上会挂满致力于维护世界安全的员工照片，但有很多领域是贵公司关注的，可以让网络安全成为你们文化中有意义的组成部分。\n\
  \n你的公司和文化很可能从大量的网络安全意识中获益。毫无疑问，当更多公司采用安全文化时，好人与坏人之间持续的网络安全战将将向好人倾斜。\n\n由于我们的人力资源专业人士是我们中致力于组织健康的专家，也是维持这种文化的推动者，因此我将本章献给他们。虽然他们并不是专门负责公司文化，但除了首席执行官之外，他们对文化的影响力比任何其他人都要大。他们通过创造吸引和留住卓越人才的环境来激励我们，这一点我在麦咖啡菲亲眼目睹过一位富有远见的首席人力资源官如何将影响力扩展到其触及之外。而且在参与网络安全解决方案方面，他们提供的贡献比他们想象的要多得多。\n\
  \n\n\n\n在我加入网络安全行业之前，我的职业生涯大部分时间是在电信行业度过的。我曾参与过 90 年代末互联网热潮那场狂野的浪潮。我记得当时，我认识的几乎每个人都忙着创立或加入下一家互联网初创公司。似乎所有人都注定会成功。我记得我们这些幸运在当时在该行业工作的人曾自豪于自己处于现代版的淘金热中。我当时在正确的时间处于正确的地方。向我奔之而来的录取机会多到数不胜手。生活曾是美好的。\n\
  \n直到美好不再。世纪交之初的泡沫破灭破碎了梦想和职业。失业率在一夜之间飙升。对于我的许多朋友来说，这种挣扎是非常真实的，他们用那些甚至连纸张都不值的股票，换取了一张价值更低的解雇通知书。\n\
  \n动荡的电信行业经历了数几年和多轮裁员，才最终实现了平衡。但这种平衡恢复得非常缓慢。千禧之初，电信行业几乎不存在失业率，这现在提醒着我们这些经历过那段旅程并留下满身伤痕的人：过得过头往往会非常糟糕。\n\
  \n快进到职业生涯近 15 年后，当我进入 McAfee 和网络安全行业时。当然，我知道 `McAfee` 经营的是安全业务。这正是我所认同的使命。我想利用每周投入到职业生涯中的\
  \ 60 多小时时间做些有意义的事。拯救生命似乎就是最好的选择了。\n\n事实上，是如此美好，以至于我很快发现我们招聘人才的速度赶不上需求。行业全球的人才短缺让我想回了那个消逝时代、几乎不存在失业率的日子。虽然网络安全岗位的候选人可能沉迷于永久职业保障的想法，但现实是，这个行业\
  \ 0% 失业率带来的后果比我多年前经历的还要糟糕得多。\n\n原因是现在关乎的要大得多。在过去，为最近的互联网热潮填补职位可能并不关乎生死。一些有进取的初创公司可能会发现，为他们的新项目吸引和留住人才更加困难，但让我们面对现实吧。真正关乎的是什么呢？\n\
  \n也许我们必须再等几年，互联网的潜力才能追上它的炒作；我们今天所熟知并喜爱的应用经济才能成型。那些早期的杂货或宠物用品配送服务会经历几次夭折。对我们来说幸运的是，有许多可行的选择可以购买此类商品，即使我们还在等待指尖上的电子商务在几天（甚至几小时）内为我们交付几乎任何东西。互联网热潮和随后的破灭对我们大多数人来说现在只是遥远的记忆。我们活了下来并讲述了这个故事。\n\
  \n网络安全是不同的。关乎的不仅仅是网络带宽或酷炫的应用。要多得多。我们需要考虑国家安全。公司有知识产权、财务、声誉等需要保护的东西。与此同时，我们仍在努力为那些保护我们的人填补职位。\n\
  \n与电信行业不同，这种人才短缺不太可能通过某些行业的破产来解决。我们不太可能看到大量才华的网络安全专业人士进入市场导致失业率飙升。那是因为我们的敌人不会坐视不管。对手会继续招募。只要网络安全人才仍然短缺，敌人就会赢。\n\
  \n对网络安全人才的需求远超供应。更糟糕的是，女性在劳动力市场中的比例偏低。对于少数裔，统计数据甚至糟糕。\n\n## 过去并非一直如此\n\n人们很容易认为这个问题大到无法解决。考虑到我们所面临的挑战，认为人才短缺是不可避免的：\n\
  \n*   在未来几年里，将有数百万网络安全职位无法填补。\n*   根据来源不同，女性占网络安全劳动力的比例在 11% 到 20% 之间。即使按较高的比例计算，也远低于普通劳动力市场。\n\
  *   对于少数裔，统计数据更为糟糕。他们仅占网络安全专业人员的 5%，而美国雇员中这一比例约为三分之一。\n\n也许问题是不可解决的？也许女性和少数裔根本不倾向于追求网络安全的工作？或者他们不擅任这项工作？难道网络安全行业注定缺乏多样性吗？\n\
  \n如果它的起源能预示它的命运，事实并非如此。最初的软件程序员是一个女性。艾达·洛夫莱斯（Ada Lovelace）被广泛认为编写了历史上第一个计算机程序——那是一种计算\
  \ `伯努利序列` 的算法，该算法还解释了飞机机翼为何能飞行。\n\n在 20 世纪 40 代开启的主机时代，再次是女性为机器编写程序。男性更有兴趣于建造这些巨型计算机，将细致的代码工作留给他们的女性同辈。\n\
  \n二世界大战期间，女性占了布莱切利园（Bletchley Park）破译行动的 75%，该行动帮助破解了德国人的恩尼玛（Enigma）密码。\n\n战后，女性一直是私营部门编码的基础。一位名叫格蕾丝·霍珀（Grace\
  \ Hopper）的女性创建了第一个编译器，它将便于英语的代码翻译成计算机可以理解的位和字节。\n\n随着编程工作在 20 世纪 50 年代和 60 年代的爆发，女性一直是劳动力市场的主力。该领域是一个优胜体系，基于天赋和成就。公司通常根据入学测试来选择程序员，这种测试通常涉及模式识别。男性和女性处于平等的竞争环境之中。\n\
  \n\n\n\n正如这堂历史课所揭示的，技术有时会阻碍一个领域的进展，以加速另一个领域的飞跃。具体来说，当第一批个人电脑在 1984 年进入家庭时，我们几乎无法想象几十年后它们产生的影响。一方面，个人计算让我们今天所处的数字时代成为可能；另一方面，它在无意中剥夺了女性和少数群体追求编程职岗位的机会，包括目前需求量极大的网络安全工作。\n\
  \n得是你，当个人电脑进入市场时，其价格点倾向于更富裕的家庭，许多许多新技术都是如此。这种现实让少数裔家庭处于不利地位，他们的平均收入低于非少数裔的群体。\n\n\
  在几年内，大学开始涌入大量想要从事编程职业的申请者——很大程度上归功于个人电脑的出现，这已成了一个前景广阔的火热市场。供需经济规律开始发挥作用。大学无法满足所有想从事计算机科学职业的候选人的需求，包括女性和少数裔。他们开始提高此类学位的门槛，特别是在关键的学习第一年，以筛选掉那些被认为对所需技能缺乏天赋的候选人（通常是通过加速本应在学生学习后期才出现的课程）。\n\
  \n这种快速通道的课程有利于那些此前有在敲击键盘、学习计算机内部运行机制经验的人。换句话说，来自电脑家庭的候选人——白人男性。\n\n但这些家庭中的白人女性呢？为什么当一个小女孩可以使用相同的技术时，她对电脑的兴趣会比她哥哥小呢？\n\
  \n回想 20 世纪 80 年代中后期横行于好莱坞大银幕的青少年文化。你可能记得像《极客妈妈复仇》、《奇异科学》和《电子游戏》这样的流行文化经典。这些票房大片中脱出的主角角是谁？好莱坞对“可爱的极客”的刻板印象——准确地说，是一个白人男性极客。\n\
  \n计算机以及控制它们的编程语言成了一门男人的行当。青少年女孩（比如当时的我）不再想象自己投身于这些职业，因为这些职业似乎是为男性量身定做的。有一句话让作为女性的我产生了共鸣：“如果她无法*看到*自己的影子，她就无法*成为*她。”而那些在编程领域表现出色的女性典型——那些类似于阿达·洛夫莱斯、格蕾丝·霍珀和布莱切利公园女性的形象——在当时几乎每一部美化计算的大片中都消失无踪了。\n\
  \n我给你们讲这堂简短的历史课，并不是为了给某个方向归责任。明确的是，我非常感激我拥有一台电脑来写这本书。我非常感激我们拥有才华横溢的程序员——无论男性还是女性——他们让我今天享受的许多创新成为可能。我恰好是那些将计算机带入流行文化的\
  \ 80 年代电影的粉丝。对于那些为我们所取得的未来铺平道路的无数创新者（男女都有），我深表谢意。\n\n我只是想扩大我们网络安全人才的可触市场，因为网络安全人才短缺是我们面临的又一个威胁。另一个对我们数字自由的威胁无疑是我们可以避免的。\n\
  \n不从历史中吸取教训的人注定重蹈覆辙。从这堂历史课中，我们可以汲取许多经验，以改变未来的轨迹，并使网络安全失业率高于零（我意识到，*想要*网络安全领域失业是一个奇怪的愿望，但我希望我已经传达了这一点：劳动力的某种过剩好过于我们正面临的看似无止尽的人才短缺）。作为公司的招聘人员，人力资源专业人士在帮助其公司以及网络安全行业弥补差距方面发挥着重要作用。\n\
  \n## 给 HR 专业人士的 W.I.S.D.O.M.\n\n我们必须接受两个现实。首先，我们现有网络安全人才储备极其匮乏，这个问题在短期内不会改变。其次，由于储备中的候选人不足以填充我们目前的网络安全职位，我们需要每位员工都加入战斗，尽自己的份加强公司的防御。\n\
  \n硬币的两面——招聘和征兵——变成了对人力资源专业人士的动员号召。在招聘方面，HR 可以帮助其组织扩大网络安全人才的窗口。这不是一个偏见可以获胜的情况。我们需要所有人才来帮助战斗——男性和女性、少数裔和非少数裔、艺术与科学。对于最后一点，我们的行业一直关注\
  \ STEM（科学、技术、工程和数学），以至于我们丢失了 STEAM（科学、技术、工程、艺术和数学）。网络安全既是一场心理战，也是一场技术战（战斗两者都适用）。它既涉及软技能也涉及硬技能。它对创造力的锻炼与对解决问题的锻炼同样重要。\n\
  \n审视你们的网络安全职位启事，寻找一种能够扩大申请人市场的技能平衡。这样做不会损害候选人的质量（这并不是为了降低标准）。回看该领域女性的历史，在那个复杂的数学是在人脑中而非机器中计算的时代，你会发现女性在履行这些角色方面与男性一样优秀。你可能只需要在公司自己的网络安全职位描述中，寻找与\
  \ 2 世纪 80 年代后期大学筛选多样化人才时相同的无意识偏见。当你发现它时，要无情地*剔除它*。\n\n但仍然还够。你需要在整个招聘过程中都这样做。这包括面试。不幸的是，许多面试中层司见常的问题也是无意识偏见的来源。例如，常见的行为面试面试问题（如“请告诉我一次关于……的经历”）自然地倾向于有更多资历背景的候选人。然而，这些背景可能可能也可能与今天的挑战无关。事实上，研究表明，此类问题对预测成功的概率仅比掷硬币高出\
  \ 12%。相反，给候选人一个问题，并询问她将如何解决。你可以要求候选人向你介绍她入职后适应你们文化和公司的计划。你可以向她展示当前流程的流程图，并请她提出改进建议。重点在于，你想看到候选人如何思考，而不仅仅是让她复述过去。\n\
  \n在面试过程中，使用面试官小组来识别最合格的候选人。这是另一个“过犹不及及”的案例。例如，Google 有其“四人规则”，他们成功地建立了一个模型，四次面试足以以\
  \ 86%的置信度预测新 Google 员工的成功率。多则多此，少则不足。\n\n无论你们公司的理想数字是多少，确保你的面试小组中至少有一位多元化的领导者。男性和女性回答问题的方式不同。在你的面试小组中同时拥有两者可以考虑到这些差异。\n\
  \n从 Google 身上得到的另一个教训，他们还有一个有趣的面试问题，他们对男性和女性的评分不同。问题是：“在 1 到 5 分范围内，为你自己的软件工程师水平打分。”\n\
  \n\n\n他们的证据表明，最成功的男性 Google 员工在回答这个面试问题时给出了“4”。Google 发现，男性倾向于夸大自己的经验或资历。那么最能预测女性候选人成功的得分是多少？一个完美的\
  \ 5 分，因为 Google 发现女性更可能保守和谦逊。（当然，既然秘密已经泄露，Google 现在不得不想出额外的面试问题来判断成功与否！）\n\n出于所有这些原因，McA\
  \ 对大多数职位都采用了小组面试法。而且我们在每个面试小组中至少都会安排一名女性或少数族裔，以代表我们渴望招募的这种多样性。\n\n最后，要消除那种可能让贵公司只寻求具有以往网络安全经验的人士的偏见。市场上的这类人才并不多。我们不能继续互相挖角，在此过程中推高薪资并导致人才流失。因此，请消除那些对不同背景候选人产生偏见的问题。例如，让候选人谈谈他感兴趣的网络安全领域的最新热门创新，这会让实践经验较少的人处于劣势（正如我们从\
  \ PC 的历史中中学到的那样）。在寻找合格候选人时，确保你的问题涵盖了 STEAM——这里是个双关语。\n\n当我进入 McAfee 时，我的背景中半点网络安全经验也没有。在六个月内，我就合著了一本关于该主题的书。我并不是在淡化行业的复杂性。但我认为技能是可迁移的。寻找在其他领域具有技术技能的候选人。你会发现，像电信这样的技术行业并没有处于同样的零失业率状态。技术在不同的劳动力市场中会有起伏。扩大你的视野，去寻找具有可迁移技能的合格人才，无论候选人之前是否具有网络安全经验。\n\
  \n在硬币的另一面，你可以通过多个杠杆来将网络安全嵌入到员工的日常工作中，而不会在此过程中让他们不堪应交。首先，`搜索你的公司价值观`——即你期望员工遵守的行为准则或指导原则——`看看你可以在哪里添加一个词，以一种深远的方式改变它们的含义：'security'（安全）。’`\n\
  \n例如，在探索我以前雇主 Verizon 的老地盘时，我发现公司在写作当时的网站上有一段令人印象深刻的信条。让我们来看看仅插入一个词如何在不损害意图的情况下扩大含义（斜体部分由我添加，表示建议增加的内容）：\n\
  \n> 我们工作是因为我们的客户重视我们高质量的通信服务。\n\n> 我们通过产品和行动提供卓越的客户体验。我们所做的一切都建立在强大的网络、系统和流程基础之上。我们交付的产品的质量、可靠性\
  \ `and security` 是至关重要的。客户付钱是为了让我们提供他们可以信赖的服务。\n\n一个词就可以在不改变目的的情况下改变范围。\n\n现在，这并不是一场“网络安全宾果游戏”。在某些价值观或指导原则中，安全并不适用。不要把方头推进圆孔。Verizon\
  \ 的例子就是一个很好的案例：\n\n> 我们知道团队合作使我们能够更好、更快地为客户提供服务。\n\n> 我们拥抱多样性和个人发展，不仅是因为这是正确的事，还因为这是明智的商业行为。驱动我们不是自尊，而是成就。我们履行对彼此和客户的承诺。我们言出必行。我们相互尊重和信任，保持开诚、坦率和直接的沟通，因为任何其他方式都是不公平且浪费时间的。我们发表意见并进行建设性的异议，然后全力支持已达成一致的行动。我们中的任何一个人都可以向其他人表达观点或想法，并无论头衔或级别如何，都倾听并重视他人的观点。想法的存亡取决于其本身的价值，而不是它们发明的地方。\n\
  \n我恰好喜欢 Verizon 信条中的那段摘录。但无论我如何尝试，无法在表述得如此优美的话中自然地插入“安全”。\n\n没关系。虽然你不会在不属于它的价值观中强行为安全找一个位置，但你可能会发现至少一个可以轻松容纳它的。假设你的价值观不仅仅是员工证背面的花哨文字，你将开始通过根除不安全的行为并植入安全的行为，将安全种子到公司的根基中。\n\
  \n接下来，让我们看看你的`奖励和认可计划`，为网络安全成就找到自然的归宿。第一点显而易见。给你的网络安全团队一些关爱。正如第 2 章提到的，他们被边缘化在公司的后台太久了。让他们从幕后走出来。\n\
  \n怎么做？让你的 `CISO` 在一些公司全体会议上发言。她不需要成为每个公司活动的常客。但你完全可以展示她和团队的成就，让广泛的员工理解攻击格局以及网络安全防御的重要性。除了招募更多战士加入战斗，一点点感谢会产生远大的影响，并可能帮助抑制网络安全部门高流失率（多亏于那不存在的失业率）。\n\
  \n接下来，扩展你的奖励和认可计划以包含网络安全。我在上一章提到，每当新产品或服务的发布由于安全性不达标时，停止生产是非常重要的。利用贵公司的认可平台公开表扬员工——无论他们是否来自网络安全部门——他们提出了有效的安全顾虑，从而阻止了此类产品或服务进入市场。\n\
  \n现在是时候处理这本书书中涉及的显而易见的问题了。此为止，我们一直把员工视为通常意图良好的主体，寻求通过网络安全的方式为公司做出贡献，但可能缺乏这方面的教育或处方。这在很大程度上是事实。\n\
  \n但有一部分员工完全不想为你的公司做贡献。他们不仅仅是网络安全斗争中冷漠的旁观者。这些是恶意内部人员，寻求给你的组织造成损害和/或以公司的利益为代价获取个人利润。根据\
  \ Verizon 的 DBIR 报告，恶意内部人员占所有公司破解事件的 10% 以上。\n\n恶意内部人员是公司应对的最为阴险的敌人。首先，公司不愿对员工实施“老大哥”式的监控——这是有道理的。尽管存在隐私担忧，但雇主可能不愿意将每个员工都视为潜在的坏分子，而是倾向于一种自由信任的场所文化，而不是通过长时间的苦努力赢得信任。\n\
  \n然而，为你的公司工作的坏分子是现实。组织应该如何做才能清除内部威胁？你的网络安全组织拥有可以部署的技术来识别异常行为。但技术本身的防御能力远弱于技术、工具和人的协同工作。这正是人力资源专业人士可以协助创建人员控制以识别恶意内部人员的地方。\n\
  \n\n\n首先，与 `CISO` 协作，识别对公司最有价值资产访问权限最大的员工。你的 `CISO` 应该已经针对组织最珍贵的资产建立了一套风险分类法并与其价值进行映射，无论是知识产权、制造设施、敏感数据库还是其他东西。定义对这些贵资产拥有特权访问权限的员工范围。与招聘经理和你的安全组织确定，这些员工为了有效完成工作需要什么级别的访问权限。定期审查员工列表，以确保没有因职位变动而需要调整权限。在进行绩效评估期间，列出一份可能存在离职风险的员工名单，并与拥有特权访问权限的员工进行对比，确保\
  \ `Legal` 部门正在处理尊重员工隐私问题的流程。通过定期建立和监控员工访问权限，你可以保护公司免受那些不再需要增强权限（或可能从就不需要）的人的侵害。\n\
  \n请注意，访问卫生不仅保护你的公司免受恶意内部人员的影响，还能防止恶意外部人员。如果 McAfee 执行了这一处方，我们会在一名代理员工停止为我们工作时，就取消她（本质上是我们团队的扩展内部人员）对我们社交媒体页面的管理员权限。这样做，我们就能避免我在第一章中描述的那个黑客攻击。\n\
  \n接下来，在你的奖励和认可计划中，为举报者留出一席之地。这超越了保护和激励这些人的政府计划。建立一个机密计划，让员工可以在其中报告可疑行为。显然，这是一条微妙的界限，因为你不想在员工之间营造一种不信任的公司文化。但如果你允许员工在看到不对劲的事情时发声，你就可以集结你最强大的武器之一——你自己的员工——来识别违规员工。\n\
  \n案例：不久前，McAfee 重新调整了投资领域，以更贴近客户需求和市场情况。对于公司来说，这些决策并不容易，特别是当它们影响到员工时，本例正是如此。\n\n\
  我收到团队一名经理发来的邮件，他转发了其中一名员工发给他的邮件。在邮件中，该员工向经理寻求帮助。我们听到其中一名受影响的员工在打一个似乎可疑的电话。在电话中，该员工表示，既然他们已经被“辞雇”了，他们就可以揭露\
  \ McAfee 最近几个月一直在忙什么。（我应该提到，该员工对即将发布的产品非常了解。）\n\n听到这段对话后，我们担心的员工决定最好给经理发一封邮件，准确陈述所说的话。因为这样，我们能够通过提醒离职员工保密要求来干预（同时在此过程中没有暴露举报者）。我们还能做出其他决策，加速或以其他方式更改相关产品的原始发布计划。\n\
  \n由于离职员工没有使用公司系统来传递或外泄信息，这种威胁将无法被 McAfee 的网络安全团队发现。只有一名员工偷听了电话，，并且没有义务报告它。但那个人报告了。我无法更好地表达我的感激之情，感谢我们自己的人为公司着想。**寻找一种机密、无威胁的方式，让尽职的员工在看到可疑情况时进行举报或举旗警告。当他们这样做时，给予适当的奖励。**\n\
  \n最后，检查你公司的关键绩效指标 (`KPIs`)，以找到与网络安全相关的指标。至少，`每个成员`都应该参与其中。这不仅仅是 IT 部门的任务，而是一项共同责任。每位员工在维护组织安全态方面都发挥着作用。\n\
  \n\n\n\n9. Verizon，“2018 年数据泄露调查报告，”[`enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf`](https://enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf)。\n\
  \n# 第 6 章：幸运青睐有有准备的人\n\n> 我们有一套团队流程，一旦发生网络攻击就会触发。因此，在完全确定发生了什么、源自哪里以及我们计划如何处理之前，我们不会直接向媒体泄露。我们目前还没有到那一步。这完全取决于数据流向何以及问题的严重程度。\n\
  > — 某酒店公司首席营销与销售官\n\n我的一位的朋友认识一个在拉斯维加斯出差的人。某天晚上，他去了一家酒吧，和一位友好的陌生人喝了几杯酒。第二天早上，他醒来时感到背部剧痛，整个人泡在冰水浴缸里。他注意到浴缸旁有一个手机，旁边有一张纸，上面写着类似“拨打\
  \ 911。你的肾脏被手术切除了。”他活下来讲述了这段经历，但因此少了一个肾脏。小心点——有一个地下市场专门收割毫无防备的商务旅行者和游客器官。\n\n我打赌你从朋友的朋友那里听过类似的故事。但也许受害者并不在拉斯维加斯。他可能在欧洲，或者南美。谁知道被盗器官的地下市场竟然如此巨大？\n\
  \n当然，事实并非。这个城市传说起源于 20 世纪 90 年代后期，虽然我们现在对它的荒谬相之以笑，但我记得第一次听到这个恐怖故事时，依然感到脊背发凉（直达肾脏！）我并不是唯一一个上当的人。\n\
  \n1997 年 1 月 30 日，在接到大量警惕的旅行者重新考虑他们的马尔迪节（Mardi Gras）狂欢计划的电话后，新奥尔良警方局发布了以下声明：\n\n\
  > 在过去的六个月里，新奥尔良警方局收到来自全美各公司和组织的咨询，警告旅行者新奥尔良有一个组织严密的犯罪团伙在活动。这些信息指称该团伙在向旅行者提供酒精直至其昏迷后偷取他们的肾脏。\n\
  \n> 在对这些指控进行调查后，新奥尔良警方局发现这些指控完全没有根据，毫无事实。通过互联网传播的警告是**虚构的**，并可能违反了有关发布错误和误导性信息的法律法规。\n\
  \n我对城市传说非常着迷。作为一名营销人员，我承担的身份之一是故事讲述者。城市传说的独特之处在于它们传播极快。事实证明，其中最传奇的具有某些共同特征。\n\n\
  它们倾向于有一个道德寓意，例如，“小心在酒吧里向你提供酒精的易接近陌生人”。它们利用了当时的社会恐惧心理。而且它们通常通过“朋友的朋友”的形式出现。换句话说，要追溯信息的来源或真实性是不可能的，这让人们在故事传播过程中不断脑补细节。\n\
  \n成功的城市传说与登上头条的新闻泄露事件之间存在的相似性令我震惊。就像城市传说一样，公共泄露事件的新闻往往传播得很快。泄露事件的细节（例如它是如何发生的以及谁该负责）通常来得很慢，导致个人用自己的假设来填补故事的空白，就像“朋友的朋友”在民间传说中所做的那样。\n\
  \n泄露事件和城市传说还有一个共同点：它们触及了一种强大的情感——恐惧。为什么恐惧如此强大？因为它深根于我们的生存本能。恐惧和愤怒被称为“热”情绪，是令我们强烈感受到的两种情绪。几千年来，我们的身体已经过过训练，当这些情感弦律被触发时能够迅速做出反应以保护生存。相比之下，我们感受“冷”情绪（如喜悦和爱）需要更长时间，因为我们的即时生存并不取决于这些情绪的强烈程度。\n\
  \n事实上，城市传说和泄露事件之间唯一的显著区别是后者是真实的。对于营销和传播专业人员来说，重新获得公司叙事的控制权，同时在整个过程中保持透明和真实，这充其量是一个艰巨的挑战。公关战场上，公司在泄露发生后沟通失误的反面教材多于正面教材。\n\
  \n作为品牌声誉的最终守护者，我的营销和传播同事必须准备在下一次泄露发生时做出应对——并迅速做出反应。\n\n## 泄露！\n\n2014 年，当弗兰克·布莱（Frank\
  \ Blake）宣布辞任宝宝（The Home Depot）首席执行官时，他留下了七年强劲业务表现和同情领导力的传奇。像许多首席执行官一样，布莱在任期内面临了许多挑战。当他\
  \ 2007 年首次掌管局面时，迫在眉睫的住房危机刚刚开始萌芽。除了股价之外，由于于一种自上而下、已让员工感到反感的管理风格，士气也在下降。\n\n布莱开始工作时专注于基础工作。他暂停了新店的开设，转而开始建立配送中心，将货物运送到更靠近现有网点的地方。他专注于盈利能力和商品组合。他关闭了不盈利的部门和市场。\n\
  \n与此同时，他为这家巨型零售商的文化中带回了南方魅力。在典型的周日，布莱会亲手为值得尊敬的员工撰写数百封个性化的感谢信——这是他从当时的副总裁（Vice President）乔治·H·W·布什（George\
  \ H. W. Bush）那里学到的礼数，当时布什曾担任他的副总法律顾问。\n\n几年坚持不懈的专注让百得家（The Home Depot）转翁为安。在布莱的任期内，股价从他\
  \ 2007 年就职到 2014 年 8 月宣布辞职意向期间翻了一番。\n\n因此，在任期的最后几个月里，布莱在劳动节周末（Labor Day weekend）休了应得的假，这就在他宣布辞任首席执行官的\
  \ 12 天后。作为一个典型的工作狂，布莱在那个周日的下午仍在给员工们手写感谢信。正如他常说的，“你衡量什么，就得到什么。你庆祝什么，就得到什么。”\n\n庆祝并没有持续多久。第二天早晨，布莱接到了公司总法律顾问的电话。他们的系统似乎被入侵了。\n\
  \n虽然布莱还没有获得所有细节，但他的公司财务状况和声誉正面临风险。在工作的最后几个月里，布莱正面对着一场危机，这不仅威胁到他的公司，还威胁到这位首席执行官完美无缺的记录。\n\
  \n我们知道这个故事的结局。百得有 5600 万张借记卡和信用卡泄露。但这个故事的独特之处不在于黑客本身，而在于公司的应对方式。在一个大型公司泄露频繁登上头条的时代，百得脱颖而出——是以一种*好的*方式。布莱没有躲避。他没有否认责任。他没有在获得所有细节之前隐瞒信息。他没有把责任推给他新任命的继任者，让那个新人自生自灭。（明确一下，任何意志力薄弱的人都会选择上述其他方案。）\n\
  \n\n\n\n相反，布莱克做了最不自然的一件事。在公司还没有明确确定发生了什么之前，他就公开报告了泄露事件。在还没有完全清楚谁该承担责任之前，他就对事件表示了歉。他让所有客户知道，他的公司将对任何欺诈费用负责，并在不知道损害全貌之前就提供了免费的信誉监控服务。\n\
  \n虽然公司并未免受集体诉讼，但它规避了潜在惩罚性赔偿的全部怒火，这很大程度上归于布莱克和执行团队的积极应对。正如法官在判决书中解释的那样：\n\n> 这其中真正的反派是偷取数据的计算机黑客。在发现数据泄露后，并没有任何掩盖行为，家得宝作为一个良好的企业公民做出了回应以弥补数据泄露。没有理由认为它需要或应该受到行为上的修正。家得宝自愿向客户提供的福利包优于通过集体诉讼所获得的福利包。^(4)\n\
  \n最终，尽管当时其他遭受重大数据泄露的公司因其沟通策略执行得拙劣而在公众舆论中遭到嘲笑，家得宝却因其正直而受到赞誉。\n\n布莱克卓越的传奇又如何？令人置信的是，这次黑客攻击可能让他的传奇更添光彩。毕竟，一家公司在泄露后获得公开赞扬的情况又有几何之多？\n\
  \n黑客也也没能偷走家得宝的声誉。在公司的“客户声音”调查中，在布莱克的领导下，强烈推荐向他人推荐家得宝的客户净百分比增加了 44%。^(5)\n\n家得宝避免了成为其泄露事件的笑话。他们控制了话信息的传递，几乎没有给“朋友的朋友”留下为他们填补细节的机会。他们利用的是赋能，而不是恐惧。多年以后，我们仍然赞叹如何不让一场危机白费。\n\
  \n## 准备战斗\n\n虽然家得宝在执行响应方面可能是传奇性的，但在遭受泄露这一点上，它绝非独无二。自从你开始阅读这一章以来，全球已有超过 30,000 条数据记录丢失或被盗。这是根据数据泄露指数（Breach\
  \ Level Index）报告的，该指数每秒有 72 条记录遭到破解。\n\n无论什么危机，时间永远不会站在响应者一边。但在泄露事件中，时间会以两种方式不利于你的公司。首先是发现泄露所需，即行业所谓的“潜伏时间”（dwell\
  \ time）。根据 Ponemon 的数据，2018 年平均潜伏时间为 197 天，^(6)这意味着在被发现之前，网络犯罪分子在被泄露的公司系统中搜寻了六六个月之久。（一旦被识别，公司平均还需要额外的\
  \ 69 天来遏制泄露。^(7)）\n\n然后，是通知相关人员泄露情况的时间。公司通常在这方面也面临挣扎，因为网络攻击的取证细节很少容易获得。国际隐私专业人员对\
  \ 2016-2017 年的 18 个网络安全事件进行了为期 18 个月的研究。他们发现，从发现泄露到通知的平均时间为 29 天。^(8) 相比之下，GDPR\
  \ 要求在 72 小时内通知。\n\n门槛无疑很高。但如果我们这些故事讲述者在职业生涯的经验和培训中只学了一点，那就是：幸运青睐有准备的人。\n\n几十年来，汇编了大量关于有效危机沟通的有价值的研究报告。归纳之，有效的公司采取了两种共同的方法。^(9)\n\
  \n1. **成功的公司会早且频繁地沟通**。当坏消息出现时，公司在公众舆论中面临审判。有效沟通的第一项准则源于那些研究了数十年的学者并不意外。“抢占先机”（Stealing\
  \ thunder）是指在他人之前揭露自己的错误（在法庭上，是被告这样做；在公众舆论中，是公司自己这样做）。这种方法被认为是有效的，因为你自己发布坏消息会增加你信息的公信度。对于这一点，观众会根据发布信息的人来判断违规行为的严重程度。^(10)\
  \ 透明度在法庭和公众舆论中备受推崇。\n\n   * 最后，采取积极是有回报的。经常让利益相关者知情比默默退缩希望问题消失要好。虽然积极的沟通方法最初导致组织的股价和声誉大跌，但比那些选择被动风格的公司反弹得更快。^(11)\n\
  \n2. **成功的公司关注受害者而不是他们自己**。这看起来很困难，因为需要公司对受害者表达同理心。由于法律考虑，公司往往不愿提供礼节（如公开道歉），它们可能无法通过以受害者为中心的测试。注意，在有效的危机沟通中，以受害者为中心是必要的，但不充分。如果受害者认为公司本可以更多地预防危机，或者对公司的声誉不利，可能还需要更多，如受补偿。^(12)\n\
  \n* 许多公司在沟通策略中抵制以受害者为中心，而是选择否认责任。关于这一点，研究结果是明确的。否认公司应承担的危机会导致双重打击。否认在最初效果较差，而且当事实随后暴露了公司的过错时，会引发另一场危机。只有在已知公司没有过错时，否认的方法才是有效的。^(13)\n\
  \n* 尽管否认是一种选择性方法，但沟通者明智地会将几种以此为核心策略融入其中。特别是，某些情况下公司对泄露并不承担直接责任。例如，你的客户可能在多个服务中重复使用相同的密码，其中一个就是你公司提供的服务。假设黑客破解了那些其他服务之一，你客户的密码在暗网上出售。即使你的公司并不负责，你将如何处理此类由他人或某事引发的通知？\n\
  \n* 关联泄露是一回事。数据武器化是另一回事。正如机构所意识到的，现在不再是网络犯罪分子可以夺取什么，而是他们可以伪造什么。也许坏分子最想要的是你的声誉。一种威胁向量可能是入侵你的公司电子邮件服务器，并泄露敏感或令人不悦的邮件发件人和收件人，而这些邮件从未打算给公众观众。\n\
  \n\n\n\n- 但为什么仅停于此？对手正开始操纵受害者的心理，就像他们历史上操纵受害者资金那样。也许在“泄露”被曝光时，他们会在其中掺杂一些假邮件。当这些伪造信息与真实的邮件混在一起时，它们很难被识别，解释起来更是困难。传播专家必须预见到，他们将如何对那些损害其品牌声誉的、公然伪造的邮件（或其他文件）有效地否认其有责任，以防发现自己的公司正沦为某场由敌手制造的、自身的“都市传说”的主角。\n\
  \n虽然网络安全攻击对于传播专家来说是一个相对较新的现象，但危机并非如此。我们可以将这一研究领域的智慧应用到我们自己的行动蓝图中。\n\n## 营销人员/传播者的\
  \ W.I.S.D.O.M. 指南\n\n如果运气青睐有准备的人，那么你需要在漏洞发生很久以前就做好计划。否则，时间不会站在你这边。当宝贵的几分钟流逝时，你最不希望你的执行团队被恐惧或愤怒等冲动情绪支配，因为这些情绪会蒙蔽理性思考。\n\
  \n### 构建一个具有明确高层支持的多维度传播计划。\n\n在这次练习中，要像 `CISO` 一样思考。`CISOs` 必须向董事会提供资产风险视图。在练习中，并非所有资产都是同等价值。你需要根据攻击的类型和严重程度，就公司应该做的事情进行同样的工作。并非所有攻击都是同等程度。\n\
  \n与你的 `CISO` 合作，识别公司面临的常见威胁，例如网站篡改、勒索软件、客户记录泄露、员工记录泄露等。从那开始，对每种情况下的通知原则要给出非常具规定性的建议。\n\
  \n- 即使法律没有要求，你会通知吗？\n- 如果你的公司对这次攻击不负责会怎样？这将如何改变你的信息的语气和内容？（考虑前面提到的“关联泄露”或“数据武器化”案例。）\n\
  - 你会在什么时候通知？要意识到，越早越有利于引导舆论。事实上，关于危机传播的研究表明，最佳时机是事故发生后的一小时内。\n- 你会通知谁？\n- 如果你没有获得所有信息（这在泄露事件中很可能发生），你会说什么？\n\
  - 你愿意向客户提供什么补偿或或什么样的以客户为中心的同理心（例如提供免费的身份保护，或提议承担因信用卡泄露导致的客户损失）？\n\n让你的 `CEO` 和执行领导团队参与这次练习，并根据攻击的严重程度，就沟通如何、何时以及沟通内容的指导原则达成共识。\n\
  \n这次练习可能需要几周甚至几个月才能充分完成。由于你的公司很可能已经遭受了攻击只是还不知道，因此制定一个基于共识的正式计划是你的首要任务。\n\n### 为计划中确定的每种场景创建传播模板。\n\
  \n与 `Legal`（法律部门）合作来构建每条信息。编写邮件、网页文案、博客、电话脚本、新闻稿、媒体声明和其他资产，并为细节留出占位符，以便在攻击发生时填充。准备好网站（内部和外部的），以便在泄露发生时可以快速上线并传达泄露细节。\n\
  \n信息必须在指令和语气之间取得正确的平衡。当危机发生时，客户希望知道你的公司考虑了他们的利益，并且局面在控制之中。遗憾的是，泄露事件很少能在这两点上都给你的公司提供灵活性。\n\
  \n在证明你的公司控制着局面方面，请让你的模板遵循以下蓝图：\n\n- 谁受到了影响？\n- 哪些数据和/或系统丢失、被盗或以其他方式破坏？\n- 泄露发生在什么期间？\n\
  - 利益者需要采取哪些预防措施？\n- 你的公司正在采取什么行动来纠正问题并降低再次发生的风险？\n\n即使你的公司尚未获得所有信息，尽早且准确地传达你已有的细节也能让你抢占先机（steal\
  \ thunder）。\n\n接下来，在语气方面，要在这些信息中表现出同理心的同时保护你的法律利益——这是在练习早期让 `Legal` 介入的关键。关于这一点，让\
  \ `Legal` 审核所有模板化信息，这样当泄露发生时，在你插入任何剩余细节后，就能更接近获得最终批准。\n\n我们讨论过同理心的重要性。这一经过考验的危机传播准则在数据泄露世界中是真实的。`Ponemon`\
  \ 调查了在 2014 年因数据泄露而终止与公司关系的消费者。当被问及这些公司可以做什么来维持关系时，更多的消费者想要一个诚挚的道歉（43%），而不是免费的身份盗用保护和信用监控服务（41%）。\n\
  \n使你的语言匹配语气。同理心不适用于技术术语或法律术语。消费者可以一眼看穿虚假的道歉。`Ponemon` 2012 年的另一项研究发现，大约三分之一的消费者对他们收到的泄露后通信内容的长度或法律术语表示不满。\n\
  \n### 为每种攻击场景设计倒计时时间表。\n\n网络安全的货币是时间。请据此设计你的计划。为每种攻击向量制定分钟级的计划。在发现公司遭受泄露的最初几分钟内，你可能无法获得所有信息。\n\
  \n幸运的是，你的传播计划将指导你的执行团队愿意发布什么以及何时发布。因为你是在没有时间压力的情况下建立此计划的，所以当你提交证据证明早期且频繁的沟通是有效的，你可以更有说服力（记住\
  \ Home Depot 是一个完美的例子）——即使在并非所有事实都可用的情况下。\n\n你的倒计时时间表应该识别在计划的每个阶段谁负责向关键利益者发布信息和/或资产。超过\
  \ 60% 的消费者表示，如果组织立即通知他们，他们对泄露公司回应的满意度将大大提高。\n\n确保你的计划包含员工，无论员工记录是否被泄露。在危机期间，员工（可能比客户更需要）需要确认雇主正在控制局面。员工是公司最好的品牌大使。如果你让他们对情况细节一所不知，他们就无法帮助你传播信息，使你再次成为“朋友之朋友”传言的潜在受害者。积极让员工参与以争取他们的支持并缓解任何焦虑。在策略方面，考虑在电子邮件和内网更新之外。至少召开一次全体会议来解释情况。此外，每天在固定的时间段内（例如\
  \ 30 分钟）开放会议热线，可以在那里向感兴趣的员工更新最新进展并回答任何问题。\n\n**练习、练习、再练习。** `CISOs` 进行红队演习，他们通过模拟对组织进行攻击来识别漏洞并加强防御。同样，`CMOs`\
  \ 也应该练习危机演习，以测试他们的团队根据计划做出反应的有效性。危机管理专家建议至少进行一次，以建立组织的肌肉记忆。\n\n\n\n\n\n作为练习演练的一部分，请与你指定的公司发言人模拟媒体采访。你需要培养多位经过培训的发言人，确保在数据泄露发生时他们准备好与媒体接触。确保他们已经准备好了口径要点和对棘手问题的回答，以保持对信息传导的控制。在这种情况下，熟能生巧接近完美。\n\
  \n将你的整体危机计划和演练结果提交给执行团队，以确认你的沟通指导原则没有发生变化。花时间回顾其他公司在自你上次演练以来这段时间内所做的，以学习最佳实践并在此过程中不断调整自己的计划。\n\
  \n***\n\n玛雅·安格鲁（Maya Angelou）曾说：“我学到，人们会忘记你说过什么，会忘记你做过什么，但他们永远忘记你带给他们什么样的感受。”我们之所以仍在讨论弗兰克·布莱克（Frank\
  \ Blake）在网络安全领域的持久遗产，是因为他迅速的行动和体贴的回应让我们所有人（无论是否是受害者）都觉得公司仍然在做正确的事。布莱克通过他的行动揭示了他的公司关心它的客户。这种感觉在布莱克辞去首席执行官职位后很久之后依然存在。\n\
  \n当泄露发生时，幸运往往青于有准备的人。你的公司无法阻止所有的泄露。坚定的网络罪犯只需要成功一次。当他们成功时，营销和传播团队需要通过一个协调的、编排过的沟通计划快速反击，用清晰的指令和真诚的同理心与所有相关利益者接触。你的客户和员工将根据你的反应来衡量你的公司。当烟消云散时，他们可能不记得你说过或做过的一切，但他们一定会记得你带给他们什么样的感受。\n\
  \n我的营销和传播战友们，你们正处于黑客和你们品牌声誉之间。幸运的是，你们有很多准备工作可以做让自己做好准备。\n\n## 注释\n\n1. ^(1) [`web.archive.org/web/19980506013419/`](https://web.archive.org/web/19980506013419/)[`mardigrasday\
