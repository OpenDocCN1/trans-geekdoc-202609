  \ 亿美元金融陷网”，*福布斯*，2018 年 12 月 6 日，[`www.forbes.com/sites/dantedisparte/2018/12/06/whaling-wars-a-12-billion-financial-dragnet-targeting-cfos/#59a7bc3b7e52`](https://www.forbes.com/sites/dantedisparte/2018/12/06/whaling-wars-a-12-billion-financial-dragnet-targeting-cfos/#59a7bc3b7e52)。\n\
