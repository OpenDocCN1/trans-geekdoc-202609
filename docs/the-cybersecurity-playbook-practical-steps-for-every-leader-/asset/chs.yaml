  \n## 弗利蒙特工厂案例\n\n如果你觉得这两个竞争对手之间的“合作伙伴关系”已经够奇怪了，那么他们选择的设立地点简直是荒诞。弗利蒙特的旧通用汽车（GM）工厂是一场彻彻底底的灾难。当时负责美国汽车工人会西部地区的布斯·李（Bruce\
  \ Lee）将弗利蒙特的员工称为“全美行业最糟糕的劳动力”。\n\n## 1984 年的转型\n\n他们的行为在行业内臭名昭著——从创纪录的缺勤率到工厂车间内的猥琐行为，再到为了获得修理它们的加班费而故意破坏汽车。如果以行为作为衡量标准，这些员工极度讨厌他们的工作和雇主。\n\
  \n你可能不会觉得通用汽车和丰田决定在一个具有糟糕历史的制造设施中建立新的合资运营业务不奇怪。毕竟，为什么要倒水连孩子倒倒呢？物理工厂本身可能是完全可以接受的。但劳动力需要改变——而且是迫切需要。\n\
  \n但通用汽车和丰田并没有更换员工。事实上，他们聘佣了原弗利蒙特劳动力的 85%（被他们自己的工会领袖描述为美国最差）来应对生产高利润、高质量的节油汽车的挑战——这是通用汽车在其最好的美国工厂中尚未实现的。\n\
  \n或许更令人惊讶的是，他们将其中一些原弗利蒙特员工飞往日本，学习如何按照日本的方式制造汽车。第一辆柠檬黄色的雪佛兰·诺瓦（Chevrolet Nova）于 1984\
  \ 年 12 月下线。几乎很快，弗利蒙特工厂生产汽车的速度就与日本工厂相当，且每百辆车的缺陷率也同样低。\n\n究竟是什么让丰田能够利用几乎同一批在通用汽车执政下如此糟糕的劳动力，为通用汽车生产第一款高质量的小型汽车？这并不是什么秘密配方，不如说是一种秘密秘诀：持续改进。\n\
  \n\n\n\n\n通用汽车（GM）的经营理念源自亨利·福特。工厂高度部门化，分工是是标准，而效率则是王道。如果我们必须用一句保险杠上的标语来总结通用汽车的文化，那可能就是“永不停止生产线”。事实上，这四个字是以前通用汽车工厂的一条铁律。无论发生什么，组装线绝不能停止。\n\
  \n这是一个有趣的指令，因为在某些早晨，由于人数太少，生产线甚至无法`start.`。在那些日子里，通用汽车会从街上招募人员填补空白。而当生产线终于启动时，它就没有停止过。\n\
  \n比利·哈格蒂在引擎盖和翼子板组装线工作。里克·马德里德为工厂制造雪佛兰卡车。他与李连一起接受了 NPR 的采访，让我们得以窥见那条黄金准则在以前的通用汽车弗蒙特工厂执行得有多么严格。\n\
  \n*   Haggerty: `生产线绝不能停止，永不停止生产线。`\n*   Madrid: `你根本看不到生产线停止。我曾看到一个人掉进了坑里，但他们没有停止生产线。`\n\
  *   Lee: `如果你发现问题并停下生产线，你就会被开除。`\n\n工人们会在事后处理缺陷。对于通用汽车来说，数量远重于质量。\n\n丰田则将其理念建立在持续改进的基础上。员工不仅`允许`停止生产线，丰田还`鼓励`他们这样做。“安灯拉绳”（andon\
  \ cord）位于生产线上每个工人头顶上方，触手可及。（Andon 源自日语中的“灯笼”一词。因此，工人可以通过视觉信号指示生产线上的情况是否正常——绿灯；生产质量是否面临风险——黄灯；或者质量下降是否意味着必须停止生产线——红灯。）\n\
  \n丰田不仅仅是在制造汽车，他们是在建立一种流程——一种欢迎公司任何层级好想法的流程。一种不懈地追求并消除每一个低效环节的流程。一种坚持将标准不断推高的流程。\n\
  \n这种“停止生产线”的理念赋予了每位员工成为某种工厂经理的权力，使质量成为每个人工作职责的固有组成部分。丰田将日本哲学引入了美国汽车工人。当白宫汽车特别小组在几十年后的\
  \ 2009 年对处于`Chapter 11 bankruptcy`期间的通用汽车进行评估时，他们公开承认通用汽车模仿丰田模式的全球生产和采购系统是世界级的，并且与它的日本老师一样高效。由于丰田曾是丰田进军弗蒙特工厂的领导者，通用汽车的许多教导都归功于这位已故的远见家本人。\n\
  \n但丰田的影响远超通用汽车，甚至超出了整个汽车行业。在 20 世纪 80 年弗蒙特工厂成功的同时，全面质量管理（TQM）运动在多个行业中兴起——在那里，持续改进成为管理的新面貌，而质量则是奖赏。\n\
  \nTQM 最终让位于 `ISO 9000`、`Six Sigma` 和精益制造等其他运动。虽然标准和名称可能发生了变化，但指导原则没有变。质量不再是“有有可无”的；它是公司长期成功的`essential`关键。\n\
  \n作为一项事业，安全性的与我们所有人陷入 TQM 热热之前的质量状况非常相似。在设计产品和流程时，我们倾向于将安全视为明天的问题。这是我们在产品下线后才会去处理的事情。我们会在事后修复。在许多方面，安全性是事后才考虑的附属品。如果我们想将安全嵌入到我们交付的一切中，就必须改变这种想法。\n\
  \n否则，结果可能是灾难性的。\n\n## 恐怖主义的互联网\n\n那是 2016 年。你可能没有意识到，但在那年的 10 月 21 日发生了一场战争。它只持续了一天，但它将在网络安全史上留下臭名。因为正是在那时，互联网的防御墙被攻破了。由于入侵者意图制造前所未有的混乱，那是互联网崩溃的一天。\n\
  \n2016 年 10 月 21 日的事件证明了事实比小说更奇异。异常的是黑客故意针对某家公司造成损害，这种新闻在数字世界中已变得屡见不鲜。攻击的独特之处在于目标公司：`Dyn`。\n\
  \n虽然你可能在 2016 年没有过 `Dyn`，但你无疑使用过他们提供的服务：如 `Twitter`、`Netflix`、`Spotify` 和 `Etsy`。此外，`Dyn`\
  \ 是一个域名系统（DNS）提供商。当你输入热门服务的网站地址时，`Dyn` 将其映射到相应的 IP 位置。\n\n在那个致命的一天，黑客通过分布式拒绝服务（DDoS）攻击瘫痪了\
  \ `Dyn`。`DDoS` 攻击是黑客心中长期的祸害。我们的互联网由多个路线和目的地组成，类似于一个复杂的公路系统。当敌人针对一个网站时，他们可以发起 `DDoS`\
  \ 攻击来有效地使其瘫痪。\n\n\n\n\n在这里，另一个进入词汇表的网络安全术语——`botnet`（僵尸网络）派上了用场。通俗来说，`botnet` 是一个由黑客奴役的设备网络。由此产生的僵尸军团受一个或多个恶意攻击者的指挥和控制，这些攻击者征用无人机执行各种操作，包括通过向网站发送请求来发起分布式拒绝服务攻击（DDoS）。这些僵尸网络是如何受到它们的邪恶主人的控制的？这是通过在用户访问感染网站或下载受污染信息时，在计算机上植入恶意软件实现的。很多情况下，用户甚至不知道自己的设备已被夺取。\n\
  \n你可能会想，针对 `Dyn` 的 DDoS 攻击究竟有何不同。所使用的 `botnet` 并不是计算机军队，甚至不是移动设备（正如你预期的那样，这些本是黑客僵尸军团的普通士兵）。相反，网络犯罪分子入侵了普通的连接家用设备。婴儿监视器、安全摄像头和数字视频录机（`DVRs`）都是攻宕\
  \ `Dyn` 的 `botnet` 中的招募成员。黑客利用这些连接设备中薄弱的出厂默认密码来夺取控制权。没有任何用户需要先无意中下载恶意软件。在这种情况下，消费者没有做任何事情来损害自己的设备。事实证明，“什么都不做”恰恰就是问题所在，因为用户也没有想过更改设备的默认密码，认为普通用户本就知道如何这样做。\n\
  \n在 `Dyn` 网络崩溃的瞬间，物联网（`IoT`）就变成了恐怖主义网络。而且，免得你认为 `Dyn` 攻击是一个偶然事件，请思考另一个更令人恐惧的现实：禁用\
  \ `Dyn` 的 `botnet` 在事件发生几个几个月后，仍在积极为它的下一次攻击招募参与者。在一个始终在线的世界里，黑客拥有数十亿连接设备可以随意摆布，只需等待它们新领袖的下一个指令。\n\
  \n`Dyn` DDoS 攻击让我们开眼，看到了一个新的现实：*目标已变成武器。* 我们过去要保护的东西，现在必须防范它们。正如数据可以被操纵来欺骗我们一样，那些在家里和工作中许多方面让我们生活便利的无害连接设备也可以被用来对付我们，破坏我们（以及它们）所依赖的数字基础设施。网络威胁现在已变得无处不在，它们潜伏在每一个连接设备、每一比特我们理所当然的数据中。\n\
  \n`Dyn` 攻击证明了，创新的黑客可以在下一次攻击中利用任何连接产品或服务。当网络犯罪分子通过普通的家用电器溜入时，网络安全进入了产品开发的主流。\n\n\
  以连接汽车为例。20017 年，`Toyota`、`Intel` 以及其他公司成立了汽车边缘计算联盟。该小组估计，到 2025 年，车辆与云之间的数据量将达到每月\
  \ 10 艾字节（exabytes）——比 2017 年的基准增加了 10,000 倍。这等同于自古以来人类说过的所有单词总量的两倍。\n\n将 `IoT` 武器化以攻击互联网是一回事，而将预计到\
  \ 2025 年出现在道路上的 800 万辆自动汽车武器化，会让恐怖主义网络更加可怕。这些连接车辆将依赖准确的实时数据来评估周围环境并进行导航。它们将依赖于它们与云之间每月流动的\
  \ 10 艾字节数据——这些数据对于那些动力并非利润而是恐怖的黑客来说，将是一个真正的宝库。\n\n如果你认为你的公司不需要担心这些问题，因为你们不从事互联网骨干网或连接汽车业务，那么对手欢迎你对这一话题的漠不关心。但\
  \ `Dyn` 表明，你的公司可能只是简单地卷入黑客的交火中。`Dyn` 并不是攻击的目标，它们支持的互联网服务才是。\n\n如果这仍然不能迫让你对我们所处的这个“奇妙新世界”产生不同的想法，请考虑一下：你有多少员工偶尔居家办公？现在根据\
  \ `Intel` 的数据，在 2016 年（即 `Dyn` 攻击发生的年份），平均家庭有 10 台连接设备。这家半导体巨头当时预测，到 2020 年，每个家庭的数字将增加到\
  \ 50 台连接设备。如果不加安全，这些设备可以作为黑客的潜在切入口，在你的员工居家办公时入侵他们。\n\n## 给产品开发者的 W.I.S.D.O.M. 建议\n\
  \n产品开发人员是将网络安全嵌入公司提供的每个产品或服务中的第一道防线。不需要在产品开发原则和清单上重新发明轮子（市场上的这类资源并不缺）。通过将网络安全概念整合到久经验证的设计方法中，开发人员在加强公司——以及用户——的网络安全防御方面发挥着至关重要的作用。\n\
  \n首先，在设计的初始阶段，客户的投入是至关重要的。许多公司通过定量研究、一对一访谈、客户顾问委员会和/或其他方法主动向客户征求反馈。确保网络安全不是事后补救的一种简单而深刻的方法，是在这个发现阶段直截了当地询问客户关于他们的网络安全需求。\n\
  \n假设你从事制造某种 [待填] 的连接家用设备业务（例如那些用于僵尸军团攻破 `Dyn` 的设备）。发现消费者何时可能采取行动更改出厂默认密码，将是设计阶段的一个重要元素。更好的办法是在这一阶段就消除消费者的拖延，例如，在安装连接设备时通过直观的应用程序更改密码，从而从源上消除一个关键的安全漏洞。\n\
  \n现在，假设你从事软件开发。并假设消费者并不是你的目标。你面向企业进行营销。同样的原则也适用。在这种情况下，准确了解客户将如何安全地使用你的应用程序，可以避免日后修复漏洞。你的客户会依赖云端，还是他们禁止你的应用程序所依赖的数据进入云端？反之，你是否设计了一个运行在防火墙内的产品，结果却发现客户更倾向于软件即服务（SaaS）消费模式？\n\
  \n\n\n\n既然谈到了软件开发人员，这里还有另一个建议供你参考。请确保安全是任何最小可行性产品（MVP）的一部分。当《精益创业》作者埃里克·里斯（Eric\
  \ Ries）推广 MVP 时，他捕捉到了任何初创公司努力目标的核心：发布一种新产品，使开发团队能够以最小努力收集有关客户使用和接受度的最大信息。这一过程非常适用于云应用程序，因为这类应用对前期资金的需求很低（因为许多应用利用了\
  \ `AWS`、`Azure` 和 `Google` 提供的公共云基础设施）。本质上，它实现了快速学习、产品开发中的快速迭代以及与客户的持续反馈循环。这些都是好事——特别是如果它能让初创公司（或任何公司）避免发布在市场上平平无奇软件产品的昂贵错误。\n\
  \n## 安全作为一项可行性需求\n\n问题在于：不要过分关注名称中的“最小（minimum）”一词，而忽略了紧随其后的那个词，“可行（viable）”。**安全性必须内置，而不是事后补救**，无论对于针对早期采用者的产品，还是面向大众市场。安全*必须*是你的最小可行性产品需求的一部分。\n\
  \n接下来，在设计产品时，要审慎考虑你的公司将如何、在何处以及使用多久客户数据。某些法规会迫使你的公司关注此类事项，假设你们需要额外的动力）。因此，我在这里讨论的不是监管机构发布的强制性要求。相反，我指的是你的公司对自己负责的伦理标准。明确的是，在这两个标准中——法律要求或你公司的伦理原则——较高的那一个就是这项测试的底线。\n\
  \n## 案例研究：迈菲的透明度\n\n例如，在第一章中，我讨论了黑客对热门社交媒体平台上 `McAfee` 公司页面进行的篡改行为。虽然我们的事件没有涉及客户数据，但它能帮助我描绘出这一观点的含义。由于没有数据被盗取或任何\
  \ `McAfee` 系统被入侵，`McAfee` 完全没有法律义务报告这次攻击，更不用通知媒体了。\n\n但 `McAfee` 对自己执行比法律要求更高的标准。在这种案例中，当黑客将我们的\
  \ Logo 替换为一张图片时，我们员工的社交媒体页面以及 `McAfee` 的公司简介页也遭到了篡改。这张图片在任何个人资料中列有 `McAfee` 的员工个人页上显示了几个小时。`McAfee`\
  \ 有一个与员工共同维护的公司价值观：*我们实践包容性的坦诚与透明。*虽然法律限制不需要我们进行任何报告，但我们自己的价值观要求更多。\n\n因此，在攻击发生的第二天，我们在内网首页发布了一篇故事，向所有员工承认了这件事。我们知道风险在于，一个没有受到任何真实媒体关注的故事（因为攻击发生在原本安静的复活节周日），只要*一个*员工将其发送给媒体，就会在周一早上引发轰动。坦率地说，这种情况没有发生。最终，如果我们想要维护超出法律要求的公司价值观，这就是我们必须承担的风险。\n\
  \n## 定义数据需求\n\n因此，**在任何新产品或服务的设计中明确且有意识地定义你的数据需求**——维护法律要求或伦理标准中较高的那一个。我再给你一个例子来强调这一点。迄为止，唯一对报告索索软件攻击发布明确指导的美国监管机构之一是`卫生与人类服务部`。\n\
  \n## 整个生命周期的所有权\n\n**接下来，将安全所有权构建到生命周期的每个阶段中。**你的产品将如何升级以应对下一个威胁？哪个部门负责持续维护？预算位于何处？\n\
  \n与维护产品所需的精力相比，引入产品的精力可能很简单。只有在第一批客户采用你的作品之后，支持、可扩展性以及是的，安全等避免的问题才会显现。在你的产品到达第一位客户之前，预先为这些确定事项建立明确的所有权将节省时间并降低风险。这与你在考虑其他问题时可能已经在实践的纪律没有区别。除了确认支持和可扩展性问题已纳入计划外，公司每个部门（如客户支持、工程或市场营销）的最高负责人还应明确审查并批准其职能的安全需求已充分内置到产品中。\n\
  \n## 停线\n\n最后，同样重要的是，如果产品发布过程的任何部分缺乏或缺失安全，你必须**停线**。更重要的是，你应该积极鼓励直接或间接参与开发过程的*任何*员工遵循这种停线哲学。这执行起来绝不利，因为在商业中时间就是金钱。但对于那些没有所有员工集中在一个物理位置的公司来说，这更加困难（例如弗雷蒙特的\
  \ `Toyota` 工厂，其环境中有实线提示，包括红、黄、绿通用颜色，可以立即且无误地向所有工厂员工传达当前的质量状态）。同样，许多公司没有员工可以激活以立即停止生产线的拉绳或按钮。\n\
  \n\n\n\n员工会注意到公司中的奖励与认可。这是文化中极具可见性的一部分，它清晰地传达了高管理层认为什么重要（以及什么不重要）。当一名员工停止生产线时，请找个方法奖励她。然后，通过贵公司最常用的任何传播媒介公开认可她（这正是你们的人力资源和营销同事可以帮到你的地方）。关键在于，你要让员工知道，公司对安全的重视程度不亚于质量。当他们亲眼看到你如何改变并认可这一点的奖励与认可体系时，你会发现会有更多勤奋的员工在安全出现问题时站出来说话。这将保护你的公司免受未来潜在的财务、声誉或知识产权损失。\n\
  \n***\n\n公司从过去对待产品质量那种傲慢、草率的心态转变已经走了很远的路。受过教育的买家在做出可能让自己后悔的决定之前，可以轻松检查公司的质量记录。如今，公司深知优质体验的价值。他们通过客户满意度、净推荐值（NPS）和留存率来衡量它。他们在客户奖中竞争它，并在财务业绩中看到它的价值。\n\
  \n网络安全是我们这一代的质量。就像此前的质量一样，它被低估、被忽视，或简单地没有衡量。我的一个老朋友经常说：“骨子里的东西终会体现在肉身上。”一家骨子里刻着强大网络安全基因的公司，将从更低的风险、更少的财务损失、更多的客户信任，以及是的，得益于产品在设计和制造时就兼顾了网络安全和质量，从而获得更高的质量。作为未来产品的梦想者和设计师，开发者在将网络安全嵌入我们消费的一切事物中，发挥着至关重要的作用。\n\
