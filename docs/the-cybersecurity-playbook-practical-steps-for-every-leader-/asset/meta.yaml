- - '##'
  - 9. 乘客及时到达机场接受安检。这些清理工作（包括核实乘客不在监控名单上）在航班当天之前很久就开始了。
- - '##'
  - 10. 旅客提供政府颁发的带照片身份证，姓名需与票面信息一致。
- - '##'
  - 11. 托运行李始终接受检查——无例外。
- - '##'
  - 12. 未加入特殊计划（如 `TSA Pre-Check`）的乘客需要从随身行李中取出笔记本电脑、鞋子、外套以及符合 3–1–1 标准的液体。
- - '##'
  - 13. 所有手提行李都会经过 X 射线检查，否则经过物理搜索。
- - '##'
  - 14. 每位乘客都将接受金属探测、毫米波人体成像和/或肢体检查，以发现违禁品。
