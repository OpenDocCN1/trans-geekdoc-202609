    这很难相信，但在那几年里，劫机变得如此常见，以至于乘客们仅仅将其视为航空旅行体验的一部分。1968 年，《时代》杂志用一篇标题恰当为《当劫机来临时该怎么办》的文章，对劫机之潮进行了些许调侃。在文中，记者报道了在过去的十个月里，有超过`1,000`美国人被改往古巴。虽然“飞行员为了防万一携带了哈瓦那何塞·马蒂机场的地图，空乘员被指示不要与潜在的劫机分子争论——只需服从他们的命令……还没有人想过给可怜的乘客进行简报。”


    作者慷慨地提供了一些做法和禁忌，以防有人发现自己成了被劫机飞机上的意外乘客——比如不要具有攻击性、不要恐慌、不要按呼叫按钮（免得叮的一声惊动劫机分子导致其意外射击），以及不要大声呼叫“空乘员”。当航班到达古巴时，记者建议了两个件要做：保持冷静并享受这次逗留（文章甚至提供了关于当地舒适过夜住宿的一些有用细节）。


    ### 航空公司如何应对持续的威胁？


    他们顺从了劫机分子。如果劫机分子想降落在古巴（或任何其他地方），飞行员就会改变航线。考虑到当时古巴作为劫机目的地的受欢迎，无论航班的预期目的地，所有驾驶舱都配备了加勒比海的地图。此外，飞行员还拿了西班牙语常用短语卡，以帮助他们与前往古巴的劫机分子交流（例如学习如何说“我必须打开飞行包拿地图”或“飞机有机械故障——无法到达古巴”）。如果犯罪者想要钱，航空公司会支付赎金，并希望在嫌疑人被捕后回来。航空公司坚定地保护他们现有的松散安全控制，坚决拒绝如金属探测器等能阻碍劫机子的威慑手段，因为他们不想让付费的客户接受同样的审查。


    令人难以信的是，航空公司如此拒绝实施安全限制，以至于他们甚至考虑在佛罗里达南部建造一个类似于古巴机场的假机场，作为金属探测器等设备的替代方案。根据这项提议，飞行员将降落在伪机场，联邦探员将在那里等待嫌疑人的抵达。


    由于成本原因，假机场的想法被抛弃，取而代之的是行为画像。票务代理会对潜在的伪装劫机分子的约`20`种可能的行为警示标志进行快速检查。为了将乘客便利置于安全之上，这种画像仅适用于所有旅客的`1%`以下，让超过`99%`的人员不受限制。


    航空公司并没有轻易拥抱我今天所归功于他们的安全文化。事实上，他们接受了环境中的这些人类对手，并开发了与他们合作的实践。现在随处可见的安全控制最初并不符合航空行业最佳客户体验的范式。在当时，顺从恐怖分子而不是保护航线的理由似乎是合理的。这是航空旅行首次从精英阶层转向大众市场旅行者。安全延迟仅让乘客多花上`15
    分钟`时间，就足以刺激他们选择其他交通工具。对于这个相对新兴的行业来说，这是一个承担不起的风险。


    ### 国家威胁的转变


    直到`1972 年 11 月 10 日`，劫机从轻微的不便演变成了国家威胁。三名劫机分子威胁要将飞机撞入田纳西州奥克里奇国家实验室的原子反应堆。联邦航空管理局（`FAA`）采取了航空公司曾放弃的措施。次年
    1 月，所有乘客将接受物理检查，包括通过金属探测器和行李检查。


    对手如果不坚决且具有创新精神将一无一物。当劫机由于实施机场筛查而变得更加困难时，犯罪者将注意力转向飞机炸弹。当`1990 年代`加强了安全措施以防御那种威胁因素时，恐怖分子在`2001
    年 9 月 11 日`创了自己的新高，他们携带允许携带的小盒刀劫持并利用民用飞机作为自导导弹（这让人想起`1972 年`那次威胁同一目标的失败劫机案）。


    在每一个时刻，航空行业都通过额外的安全措施做出回应。


    *   `2001 年 12 月 22 日`：机上理查德·里德试图在鞋里引爆爆炸物。五年后，`TSA`要求在安全检查站脱鞋。

    *   `2006 年 8 月 9 日`：官员破获了一个利用液体爆炸物击落飞机的阴谋。同年`9 月 26 日`，`TSA`禁止每个乘客携带超过`3.4 盎司`且能装进`1
    夸脱透明塑料袋`的液体（现在被称为`3-1-1 规则`）。

    *   `2009 年 12 月 25 日`：机上乘客奥马尔·法鲁克·阿卜杜穆塔拉布将爆炸物塞进了最私密的区域——他的内裤里。不久，乘客们在机场接受了由于“散射”机器而的争议性虚拟搜身。


    这场猫鼠游戏将持续下去。当下一个威胁出现时，航空行业将用旨在产生免疫的安全控制做出回应。虽然乘客可能会对不便表示抱怨，但也会接受一种新常态，这种常态的核心是以安全为设计的。


    这就是为什么我把航空公司视为执行安全文化的典范。这并不是说航空公司愿意遵守今天所有让我们变得更安全（尽管有些不便）的控制。在早期，当行业及其乘客将劫机视为一种麻烦而非威胁时，曾存在许多阻力。


    ### 起前安全要求


    但请考虑以下列表，它是今天飞机起飞前必须发生的事情的子集。如果缺少其中任何项目，乘客可以预见到航班延迟，甚至取消：


    1.  起前检查包括外部绕行和对关键部件的目视检查，包括传感器、探头以及暴露的电机和电缆，例如位于起落架上的那些部件。

    2.  起前检查还包括关键系统的内部测试，如火灾探测器、天气雷达和警示灯。

    3.  维护人员根据飞机计划执行任何必要的维护。这些检查中侵入性最小且频率最高的是每隔`500 飞行小时`进行一次。最全面的检查大约每`六年`发生一次，费用昂贵，以至于在许多情况下，航空公司直接退役该飞机。

    4.  维护人员对机上所有物品的运行状态进行详细记录。如果有任何疑虑，维护团队将决定修复还是推迟问题。这取决于飞机保持适航状态必须具备的最小设备清单。如果飞机不符合要求，它就留在原地。

    5.  飞行员审查最小设备清单和推迟项目，以便在起飞前了解飞机的维护状况。

    6.  地面工作人员检查飞机损坏，并检查跑道上可能阻碍其滑出的碎片或障碍物。

    7.  飞行员和空乘人员进行起飞前会议，讨论飞行计划、天气报告、预计气流等内容，以为所有人提供顺畅且安全的体验。

    8.  空中交通管制员根据天气模式和机场限制等因素准备好飞行计划。


    '
- fmt: '

    # 9. Passengers arrive at the airport in time for security checks. Those clearances,
    including verifying the passenger is not on a watch list, start long before the
    day of flight.


    # 10. Travelers provide a government-issued photo identification with the name
    matching that of the ticket.


    # 11. Checked baggage is screened—all the time.


    # 12. Passengers not enrolled in a special program (such as `TSA Pre-Check`) remove
    laptops, shoes, outer jackets, and 3–1–1 compliant liquids from carry-on luggage.


    # 13. All carry-on luggage undergoes an x-ray, if not physical, search.


    # 14. Metal detection, millimeter wave body imaging, and/or a physical pat-down
    check for contraband is conducted on each passenger.


    These safety checks, including security screenings, can be even more extensive
    for international flights arriving in the United States.


    Critics will be quick to point to the shortcomings of these security assessments
    in safeguarding passengers. They will highlight the `TSA`’s failure rate in its
    own penetration tests, where at least 70 percent of illegal contraband slipped
    through its cracks in 2017. Indeed, no security posture is perfect, and the airline
    industry is no exception to the rule.


    Instead of criticizing, let’s consider the track record. More specifically, let’s
    look at the critical outcome that many would likely agree is most important—the
    safe transport of passengers. On this metric, the airline industry has performed
    quite well indeed.


    In 2018, the `Aviation Safety Network` reported a fatal accident rate for large
    commercial flights at .36 per million flights. That equates to one fatal accident
    for every three million flights.


    Some countries, like the United States, saw an even lower fatality rate. From
    2009–2018, U.S.-operated airlines flew several billion people on almost 100 million
    flights, with no fatalities.


    These results speak for themselves. They give me confidence as a frequent traveler
    that I’m much more likely to die of cardiovascular disease, in a car accident,
    from a lightning strike, or even a bee sting, than I am to surrender my life on
    an airplane. I may have worries about packing the wrong items or leaving my identification
    at home, but I don’t fret about my safety. That’s because I know the airline industry
    is ensconced in security. The public and private sector have united with one goal
    in mind: keeping travelers safe.


    Perhaps your company isn’t in the business of preserving lives. Or perhaps your
    industry hasn’t yet seen its equivalent “Golden Age of Hijacking.” Maybe your
    company hasn’t yet experienced its metaphorical 9/11. I’m hoping that it doesn’t
    need to in order for you and every other employee and board member to put security
    in its proper place.


    *   To move security from the back office to the boardroom.

    *   To equip every employee to play a part in securing his company.

    *   To stop the line on product development when security is lacking.

    *   To bridge the gap of the cybersecurity talent shortage.

    *   To respond immediately and transparently when breaches occur.

    *   To thread security across a vast ecosystem of third parties.

    *   To place a culture of security in every workplace.


    Will these prescriptions spare your company from ever suffering a breach? Certainly
    not. But will they deliver positive outcomes that allow your company to mitigate
    risk and recover from attacks more effectively? Absolutely.


    For all my praise of the airline industry’s track record, even it is not immune
    from a threat-free existence—human or otherwise. Just days before my brief hometown
    visit to Tampa, there was devastating news of an Ethiopian Airlines crash that
    killed all 157 on board. My mom is not a frequent traveler. She is, however, a
    frequent watcher of cable news networks. She called me in the days leading up
    to my trip.


    “Allie, I’m worried about your trip out here. What type of aircraft are you on?”


    “Mom, I don’t know. What are you watching and why are you asking?”


    “There’s a report that the Ethiopian Airlines crash looks similar to another one
    from a few months ago. They were both on a `737 MAX` plane. Is that your plane?”


    “Mom, please stop watching the news. I’m fine. I’m much more likely to die in
    a car accident than an airplane.” (More blah, blah, blah on airline safety records,
    much of which didn’t penetrate my mother’s extraordinary defenses against hearing
    anything that would alleviate her fears.)


    “Babe, I just need to know if you’re on one of those jets. If so, let’s reschedule.”


    Turns out I didn’t need to reschedule. And I also didn’t need to check the aircraft
    of my flight. The day before my scheduled departure, the `FAA` grounded all `Boeing
    737 MAX 8` planes. That culture of security that envelops every facet of an airline
    industry I use regularly once again put my safety first.


    While I may not have second-guessed the potential danger, the `FAA`’s actions
    weren’t lost on my mom. The night before my flight, she called me to confirm my
    arrival details.


    “Allie, I’m so glad we didn’t need to reschedule your flight. Thank God they grounded
    all those airplanes.”


    “Yes, Mom. Thank God, indeed.”


    And, thank the airline industry for showing us what security can be.

    '
