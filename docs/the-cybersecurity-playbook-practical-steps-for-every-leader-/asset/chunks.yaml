    \ But notice that CISOs must make at least two connections to translate their\
    \ language into that of the board. First, they must string the beads from risk\
    \ to strategy. A risk out of context of strategic importance, value creation,\
    \ or corporate measurements is the equivalent of giving the board a pie chart\
    \ of your results—it only shows one small sliver of the total picture.\n\n   \
    \ Second, CISOs must translate the threat into risk. This requires understanding\
    \ the board’s risk tolerance for high-priority assets, how a potential attack\
    \ challenges this tolerance, and the consequences (financial or otherwise) that\
    \ may result.\n\n    If this seems like a high bar, it is. Stanford reports that\
    \ most companies do not integrate risk management and strategy. Further, 50 percent\
    \ have no enterprise risk management in place.^([7](#c08.xhtml#c8-note-0007))\
    \ The good news for CISOs? You’ll be a pleasant exception to these rules when\
    \ you effectively communicate the company’s cybersecurity posture in your board’s\
    \ language.\n\nCISOs deserve access to the boardroom, as I argued in Chapter 2.\
    \ But once a CISO gains entry, the way he crafts and delivers his message will\
    \ likely determine whether he is invited to the party again. Learn the language\
    \ and the style of the boardroom to avoid being cast aside, along with those one-dimensional\
    \ pie charts.\n\n## Letting Go to Hold On\n\nIn 2014, enterprises were losing\
