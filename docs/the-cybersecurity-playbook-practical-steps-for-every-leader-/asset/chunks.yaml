    public and private sector have united with one goal in mind: keeping travelers
    safe.


    Perhaps your company isn’t in the business of preserving lives. Or perhaps your
    industry hasn’t yet seen its equivalent “Golden Age of Hijacking.” Maybe your
    company hasn’t yet experienced its metaphorical 9/11. I’m hoping that it doesn’t
    need to in order for you and every other employee and board member to put security
    in its proper place.


    *   **To move security from the back office to the boardroom.**


    *   **To equip every employee to play a part in securing his company.**


    *   **To stop the line on product development when security is lacking.**


    *   **To bridge the gap of the cybersecurity talent shortage.**


    *   **To respond immediately and transparently when breaches occur.**


    *   **To thread security across a vast ecosystem of third parties.**


    *   **To place a culture of security in every workplace.**


    Will these prescriptions spare your company from ever suffering a breach? Certainly
    not. But will they deliver positive outcomes that allow your company to mitigate
    risk and recover from attacks more effectively? Absolutely.


    For all my praise of the airline industry’s track record, even it is not immune
    from a threat-free existence—human or otherwise. Just days before my brief hometown
    visit to Tampa, there was devastating news of an Ethiopian Airlines crash that
    killed all 157 on board. My mom is not a frequent traveler. She is, however, a
    frequent watcher of cable news networks. She called me in the days leading up
    to my trip.


    “Allie, I’m worried about your trip out here. What type of aircraft are you on?”


    “Mom, I don’t know. What are you watching and why are you asking?”


    “There’s a report that the Ethiopian Airlines crash looks similar to another one
    from a few months ago. They were both on a 737 MAX plane. Is that your plane?”


    “Mom, please stop watching the news. I’m fine. I’m much more likely to die in
    a car accident than an airplane.” (More blah, blah, blah on airline safety records,
    much of which didn’t penetrate my mother’s extraordinary defenses against hearing
    anything that would alleviate her fears.)


    “Babe, I just need to know if you’re on one of those jets. If so, let’s reschedule.”


    Turns out I didn’t need to reschedule. And I also didn’t need to check the aircraft
    of my flight. The day before my scheduled departure, the FAA grounded all Boeing
    737 MAX 8 planes. That culture of security that envelops every facet of an airline
    industry I use regularly once again put my safety first.


    While I may not have second-guessed the potential danger, the FAA’s actions weren’t
    lost on my mom. The night before my flight, she called me to confirm my arrival
    details.


    “Allie, I’m so glad we didn’t need to reschedule your flight. Thank God they grounded
    all those airplanes.”


    “Yes, Mom. Thank God, indeed.”


    And, thank the airline industry for showing us what a culture of security can
    be—definitely not perfect but certainly strong enough to deter formidable adversaries
    and allay the concerns of even the most paranoid among us. Including my loving
    mom.


