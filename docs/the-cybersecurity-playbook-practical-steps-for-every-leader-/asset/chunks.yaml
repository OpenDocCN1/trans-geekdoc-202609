    McAfee 对 `WannaCry` 的自身分析显示，它几乎算不上是勒索软件。其作者留下的变现能力相当粗浅。他们没有将受害者的唯一标识符与其的比特币支付关联起来，这导致文件解密极其困难。那么
    `WannaCry` 到底是什么？勒索软件？还是蠕虫？两者皆是。


    2018 年，黑客的创意随着 `Zyklon` 的发布再次展现无遗。`Zyklon` 是一个功能齐全的威胁包，供企业犯罪分子利用——它可以窃取密码、发起 DDoS
    攻击、挖掘加密货币等。`Zyklon` 到底是什么？加密货币挖矿？DDoS？键盘记录？以上皆是。


    正如 `WannaCry` 和 `Zyklon` 所示，黑客不仅在专业领域上合作，还共同创造出融合威胁的新型混合物。他们正在将旧品种（如蠕虫）与新品种（如勒索软件）混合在一起。在
    McAfee 对地下论坛的分析中，我们看到网络犯罪分子正在讨论新旧漏洞。结果是复杂的威胁，其传播速度比以往任何时候都要快。


    回到首席财务官（CFO）和首席信息安全官（CISO）之间的对话。当 CISO 向 CFO 请求更多资金时，通常是因为这种现实。即使在周期中期，在预算分配完成很久之后，CISO
    可能仍需要更多资金。`WannaCry` 并没有等到方便的财政年度结束来大肆破坏。恶性分子不在乎你的预算周期。


    如果 `ROI` 不是网络安全的正确指标，那么是什么呢？风险管理。网络安全专业人员从事的是风险管理业务。诚然，他们拥有技术专长，并使用大量产品来防御公司免受高度组织化的犯罪集团的侵害。但脱离了这些领域的术语，它实际上最终归结为一个清晰的业务目标——降低公司的风险。


    正如 CFO 们所知，风险管理及其相关指标与传统的财务指标 `ROI` 有着根本上的不同。我住在德克萨斯州北部，该地区在美国赢得了“龙卷风走廊”这一不幸的俗称。直到今天，我对龙卷风保持着健康的恐惧。怪归于每个月第一个星期三中午测试的龙卷风警报，那令人毛骨悚然的声音简直让人不寒而栗。


    ## . . . 它们越是保持不变


    它们在白天躲避，晚上觅食。它们寻找血餐以生存，在受害者睡觉时偷食受害者，因为它们厌恶移动。它们是快速的移动者，通常每分钟移动三到四英尺——换算比例的话，等同于平均成年人的冲刺速度。是的，床虫正在全球范围内卷抬头。


    '
- fmt: '

    Here’s what makes bed bugs so difficult to eradicate. You can have the cleanest
    house in the world. You could disinfect your bedding religiously. You could do
    the same for pajamas or any other clothing that should touch your place of slumber.
    But if you happen to travel to a hotel or in an airplane that is infested, it
    takes just one pesky bed bug to hitch its wagon to your star (in this case, your
    luggage or what’s packed inside) and make its way to your domicile.


    The problem is even worse if you happen to live in an apartment building or other
    multi-dwelling unit. Now, it just takes the neighbor with whom you happen to share
    a wall to be a bit laxer than you are in his standards, and you may find yourself
    with unwelcome inhabitants in your home (yes, these determined parasites can move
    along and through wall voids, using plumbing and electrical chaseways as their
    routes).


    If that isn’t bad enough, because there is such a stigma associated with bed bugs,
    most people are loath to admit they cohabitate with these bloodsuckers. By the
    time they concede they have a problem and seek help, they may be facing an all-out
    infestation. If you happen to spend the night (as in a hotel) or share a wall
    (as in neighbor)—you get the idea. . . .


    Bed bugs are an unfortunate reminder of how dependent we are on one another. It
    isn’t a matter of leaning on our neighbors for help. It’s about trusting them
    to know their environment (nearly 50 percent of people with bed bugs in one study
    didn’t even know they had them^([5](#c07.xhtml#c7-note-0005)) ) and to seek professional
    help to eliminate them.


    ## The Cybersecurity Allegory


    What a fascinating allegory to cybersecurity. Companies do not operate on islands
    unto themselves but do so in highly complex, interconnected ecosystems. While
    a company may practice sound cybersecurity hygiene, it must rely on its neighbors—any
    third party with whom it does business and has some connection to its systems—to
    do the same. Otherwise, it leaves itself open to insidious predators using side
    doors and back doors to infiltrate. (By the way, the “systems” connected in this
    case need not necessarily be through extensive networks. Think back to the cybersecurity
    hygiene practices covered in Chapter 3. All it takes is a careless partner leaving
    a `USB` or `laptop` with your company’s sensitive files unattended and unencrypted,
    and your company is exposed.)


    For all the decades we enjoyed living a relatively bed-bug-free existence, we’re
    reminded that what is old can be new again. And the more things change, the more
    they stay the same. We’re once again lamenting bed bugs in spite of all the progress
    once made against them.


    ## The Role of the CFO and CISO


    While change is the only constant in business, many `CFOs` can still rest in one
    certainty: They manage procurement for their companies. Since this largely remains
    a finance function, the `CFO`s kinship with the `CISO` is about to get a lot closer.


    Just as bed bugs remind us how reliant we are on one another to be vigilant against
    infiltrators, third-party relationships serve as additional points of exposure
    adversaries can exploit to inflict harm on our companies. Consider the following
    points from Ponemon^([6](#c07.xhtml#c7-note-0006)) that reflect the sobering reality:


    *   59 percent of organizations confirm they experienced a breach due to one of
    their third parties.

    *   Only 29 percent state they would learn of such a breach from the third party
    itself.

    *   76 percent say the number of cybersecurity incidents involving vendors is
    increasing, yet only 46 percent agree that managing outsourced relationship risks
    is a priority.

    *   57 percent don’t know whether their organizations’ vendor safeguards are sufficient
    to prevent a breach.


    On the positive side, there’s plenty of room for improvement in these metrics.
    Third-party security management is relatively new for many organizations. It’s
    also critically important, as the above numbers show. `CFOs` carry the flag for
    their organizations in ensuring the procurement process sufficiently vets third
    parties’ cybersecurity posture. Here’s an area where your `CISO` will help you
    ask the right questions.


    ## Trends in Outsourcing


    Of course, the ultimate trusted third-party relationship is one in which a company
    outsources a function, or part of it, entirely. `Deloitte` conducted a global
    study in 2016 examining the outsourcing lifecycle and key trends. The top function
    reported as outsourced? `IT`, with a whopping 72 percent of organizations outsourcing
    at least a part of the function and 31 percent planning to increase the same.^([7](#c07.xhtml#c7-note-0007))


    It was once absurd to consider outsourcing one’s cybersecurity environment. But
    it appears cybersecurity is following in the footsteps of its `IT` ancestors,
    as it’s becoming more acceptable to let third parties protect an organization’s
    most prized digital assets. Of course, the global cybersecurity talent shortage
    just adds more fuel to the fire. Rather than compete vociferously for cybersecurity
    talent that just isn’t in the market, companies are opting to hire third parties
    with this expertise to at least augment internal staffing capabilities.


    In particular, the areas of the security operations center (`SOC`) most likely
    to be outsourced include `penetration testing` (75 percent of organizations outsource),
    `threat intelligence collection and feeds` (54 percent), and `digital and malware
    forensics` (51 percent).^([8](#c07.xhtml#c7-note-0008))


    There are several pros to outsourcing one or more areas of the cybersecurity function.
    As is the case with most outsourcing, companies stand to save money and minimize
    upfront capital expenditures by hiring third parties with comparable cybersecurity
    infrastructure. Companies may also mitigate the risk of obsolescence by negotiating
    service level agreements with these managed security service providers (`MSSPs`)
    to dictate terms of technology refresh. Finally, `MSSPs` specialize in cybersecurity.
    They can focus on this core competency, leaving more time for their customers
    to focus on theirs.


    ## Risks of Total Outsourcing


    As with most topics in this book, this one is imbued with several shades of gray.
    While outsourcing a portion of one’s cybersecurity program is perfectly suitable
    for many companies (particularly those with harsher staffing constraints), cybersecurity
    is somewhat like charity—it starts at home. Abdicating complete responsibility
    of one’s cybersecurity posture to a third party is risky business. What an `MSSP`
    makes up for in cybersecurity experience, it lacks in understanding of your company’s
    unique environment. Because of this, it may miss anomalies in your environment
    that a dedicated internal team would readily spot. Because an `MSSP` supports
    multiple customers (on one hand, a positive benefit since it has perspective on
    trends across broader markets), you may find less time dedicated to your company’s
    needs—all of which can result in a sub-optimized cybersecurity posture should
    your company toss the keys over completely.


    This is yet another area in which `CFOs` and their teams should exert considerable
    influence.


    ## W.I.S.D.O.M. for the Finance Professional


    As the organization’s key allocators of resources and budget, finance professionals
    have much to offer a culture of cybersecurity, specifically, help `CISOs` and
    their teams speak the language of the business. This requires losing language
    that doesn’t fit cybersecurity—in particular, “return on investment.” Once `CFOs`
    relieve `CISOs` of the burden to answer an impossible question, the teams can
    work together in earnest to define the value of cybersecurity investments to the
    business.

    '
