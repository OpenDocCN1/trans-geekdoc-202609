    The true stuff of a CISO is made of anything but fragile cellophane. She has a
    backbone of steel in the stiff winds of transformation; iron fists to pound through
    an unending onslaught of attacks; and a jaw of concrete to take the blows of blame
    that would incapacitate otherwise weaker individuals. When you finally recognize
    and appreciate the grit and determination that make up the most misunderstood
    member of the executive team, you bring cybersecurity out of the shadows, along
    with adversaries who would love nothing more than to remain there.


    ## Notes


    1. McAfee, “Cloud Adoption and Risk Report,” 2019.

    2. I’m sharing the smart work insights of many others who are steeped in the cybersecurity
    challenge and in the best practices of successful enterprises. I’ll share McAfee’s
    proprietary insights along the way, but I’m proud to introduce you to a growing
    body of research and fresh thinking by organizations like Deloitte, Ernst &Young
    (EY), ESG, and others. You’re not alone in this fight. The number of savvy analysts
    and consultants focused on this space proves it.

    3. Deloitte, “2014 Board Practices Report—Perspectives from the Boardroom,” [https://www2.deloitte.com/content/dam/Deloitte/us/Documents/regulatory/us-2014-board-practices-report-final-9274051-12122014.pdf](https://www22.deloitte.com/content/dam/Deloitte/us/Documents/regulatory/us-2014-board-practices-report-final-9274051-12122014.pdf).

    4. Deloitte, “2016 Board Practices Report—a Transparent Look at the Work of the
    Board,” [https://www2.deloitte.com/content/dam/Deloitte/us/Documents/center-for-board-effectiveness/us-cbe-2016-board-practices-report-a-transparent-look-at-the-work-of-the-board.pdf](https://www22.deloitte.com/content/dam/Deloitte/us/Documents/center-for-board-effectiveness/us-cbe-2016-board-practices-report-a-transparent-look-at-the-work-of-the-board.pdf).

    5. Ibid.

    6. Melanie Turek, “Employees Say Smartphones Boost Productivity by 34 Percent:
    Frost & Sullivan Research,” Samsung Insights, August 3, 2016, [https://insights.samsung.com/2016/08/03/employees-say-smartphones-boost-productivity-by-34-percent-frost-sullivan-research/](https://insights.samsung.com/2016/08/03/employees-say-smartphones-boost-productivity-by-34-percent-frost-sullivan-research/).

    7. Nir Nissim, Ran Yahalom, and Yuval Elovici, “USB-Based Attacks,” *Computers
    & Security*, Elsevier, September 2017, [https://www.sciencedirect.com/science/article/pii/S0167404817301578](https://www.sciencedirect.com/science/article/pii/S0167404817301578).

    8. Apricorn press release, “Apricorn USB Data Protection Survey: Majority of Enterprise
    USB Security Is Outdated, Inadequate; Nine Out of 10 Employees Use USB Devices,
    But Only 20 Percent of Them Are Leveraging Encryption,” December 12, 2017, [https://markets.businessinsider.com/news/stocks/apricorn-usb-data-protection-survey-majority-of-enterprise-usb-security-is-outdated-inadequate-nine-out-of-10-employees-use-usb-devices-but-only-20-percent-of-them-are-leveraging-encryption-1011079268](https://markets.businessinsider.com/news/stocks/apricorn-usb-data-protection-survey-majority-of-enterprise-usb-security-is-outdated-inadequate-nine-out-of-10-employees-use-usb-devices-but-only-20-percent-of-them-are-leveraging-encryption-1011079268).

    9. McAfee, “The Economic Impact of Cybercrime—No Slowing Down,” [https://www.mcafee.com/enterprise/en-us/assets/executive-summaries/es-economic-impact-cybercrime.pdf](https://www.mcafee.com/enterprise/en-us/assets/executive-summaries/es-economic-impact-cybercrime.pdf).

    10. Justin Nobel, “The True Story of History’s Only Known Meteorite,” *National
    Geographic*, February 20, 2013, [https://news.nationalgeographic.com/news/2013/02/130220-russia-meteorite-ann-hodges-space-hit/](https://news.nationalgeographic.com/news/2013/02/130220-russia-meteorite-ann-hodges-space-hit/).

    11. Cybersecurity Ventures, “Cybersecurity Jobs Report 2018-2021,” May 31, 2017,
    [https://cybersecurityventures.com/jobs/](https://cybersecurityventures.com/jobs/).

    12. Ibid.

    13. Leslie Scism, “Insurers Creating a Consumer Ratings for Cybersecurity Industry,”
    *The Wall Street Journal*, March 26, 2019, [https://www.wsj.com/articles/insurers-creating-a-consumer-ratings-service-for-cybersecurity-industry-1153592600?mod=hp_lista_pos5](https://www.wsj.com/articles/insurers-creating-a-consumer-ratings-service-for-cybersecurity-industry-1153592600?mod=hp_lista_pos5).

    14. Jon Olstik and Jack Poller, “Automation and Analytics versus the Chaos of
    Cybersecurity Operations,” Enterprise Strategy Group, September 2017.

    15. EY, Global Information Security Survey 2017–18, [https://www.ey.com/gl/en/issues/governance-and-reporting/center-for-board-matters/the-cost-of-cybersecurity-on-the-board-agenda](https://www.ey.com/gl/en/issues/governance-and-reporting/center-for-board-matters/the-cost-of-cybersecurity-on-the-board-agenda).

    16. Ibid.

    17. Deloitte, “2016 Board Practices Report.”

    18. Ibid.

    19. Jon Oltsik, “Why Do CISOs Change Jobs Frequently?,” CSO, January 2, 2018,
    [https://www.csoonline.com/article/3245170/why-do-cisos-change-jobs-so-frequently.html](https://www.csoonline.com/article/3245170/why-do-cisos-change-jobs-so-frequently.html).


    # CHAPTER 3: Good Morning, This Is Your Wakeup Call.


    > I would say I have never knowingly violated my company’s cybersecurity policy.
    And yet, I feel that the larger problem overall is that there’s not always clear
    communication about what the policies are. These things tend to be glossed over
    by managers all the time because they themselves are not always savvy as to what
    all the rules are. I think the reason for this is the majority of people do not
    understand all the implications of their actions when it comes to cybersecurity
    and protecting company information. And many people within organizations do their
    best in terms of trying to be safe using technology. But that is a constant battle
    being waged by IT groups within almost every company.

    > Respondent, McAfee Online Ethnographic Study


    I grew up with a healthy respect for authority. My mom and dad were on the stricter
    side. They expected me to comply with reasonable rules. Do your homework. Be home
    by curfew. Clean your room. Respect your elders. The stuff of building a responsible
    and contributing member of society.


    So when I got a voicemail from my mom early one weekend morning telling me someone
    from law enforcement was looking for me, I couldn’t reach for my phone fast enough.


    * “Allie, there’s a sheriff in Nashville who just called here looking for you.
    He says there’s a warrant out for you for a missed court appearance in Davidson
    County.”


    My heart started racing as I listened to my mom frantically giving me this sheriff’s
    information.


    * “Mom, this doesn’t make sense. I haven’t lived in Nashville for 20 years! I
    never was told I needed to be in court.”


    * “Babe, I told him the same thing. I told him I’d have you call him.”


    I’m a much earlier riser than my husband. I figured I’d quickly take care of the
    phone call before he woke.


    I dialed the digits with the `(615)` Nashville area code.


    * “Sheriff Johnson speaking.”

