  trans: "\n相反，布莱克做了最不自然的一件事。在公司还没有明确确定发生了什么之前，他就公开报告了泄露事件。在还没有完全清楚谁该承担责任之前，他就对事件表示了歉。他让所有客户知道，他的公司将对任何欺诈费用负责，并在不知道损害全貌之前就提供了免费的信誉监控服务。\n\
    \n虽然公司并未免受集体诉讼，但它规避了潜在惩罚性赔偿的全部怒火，这很大程度上归于布莱克和执行团队的积极应对。正如法官在判决书中解释的那样：\n\n> 这其中真正的反派是偷取数据的计算机黑客。在发现数据泄露后，并没有任何掩盖行为，家得宝作为一个良好的企业公民做出了回应以弥补数据泄露。没有理由认为它需要或应该受到行为上的修正。家得宝自愿向客户提供的福利包优于通过集体诉讼所获得的福利包。^(4)\n\
    \n最终，尽管当时其他遭受重大数据泄露的公司因其沟通策略执行得拙劣而在公众舆论中遭到嘲笑，家得宝却因其正直而受到赞誉。\n\n布莱克卓越的传奇又如何？令人置信的是，这次黑客攻击可能让他的传奇更添光彩。毕竟，一家公司在泄露后获得公开赞扬的情况又有几何之多？\n\
    \n黑客也也没能偷走家得宝的声誉。在公司的“客户声音”调查中，在布莱克的领导下，强烈推荐向他人推荐家得宝的客户净百分比增加了 44%。^(5)\n\n家得宝避免了成为其泄露事件的笑话。他们控制了话信息的传递，几乎没有给“朋友的朋友”留下为他们填补细节的机会。他们利用的是赋能，而不是恐惧。多年以后，我们仍然赞叹如何不让一场危机白费。\n\
    \n## 准备战斗\n\n虽然家得宝在执行响应方面可能是传奇性的，但在遭受泄露这一点上，它绝非独无二。自从你开始阅读这一章以来，全球已有超过 30,000\
    \ 条数据记录丢失或被盗。这是根据数据泄露指数（Breach Level Index）报告的，该指数每秒有 72 条记录遭到破解。\n\n无论什么危机，时间永远不会站在响应者一边。但在泄露事件中，时间会以两种方式不利于你的公司。首先是发现泄露所需，即行业所谓的“潜伏时间”（dwell\
    \ time）。根据 Ponemon 的数据，2018 年平均潜伏时间为 197 天，^(6)这意味着在被发现之前，网络犯罪分子在被泄露的公司系统中搜寻了六六个月之久。（一旦被识别，公司平均还需要额外的\
    \ 69 天来遏制泄露。^(7)）\n\n然后，是通知相关人员泄露情况的时间。公司通常在这方面也面临挣扎，因为网络攻击的取证细节很少容易获得。国际隐私专业人员对\
    \ 2016-2017 年的 18 个网络安全事件进行了为期 18 个月的研究。他们发现，从发现泄露到通知的平均时间为 29 天。^(8) 相比之下，GDPR\
    \ 要求在 72 小时内通知。\n\n门槛无疑很高。但如果我们这些故事讲述者在职业生涯的经验和培训中只学了一点，那就是：幸运青睐有准备的人。\n\n几十年来，汇编了大量关于有效危机沟通的有价值的研究报告。归纳之，有效的公司采取了两种共同的方法。^(9)\n\
    \n1. **成功的公司会早且频繁地沟通**。当坏消息出现时，公司在公众舆论中面临审判。有效沟通的第一项准则源于那些研究了数十年的学者并不意外。“抢占先机”（Stealing\
    \ thunder）是指在他人之前揭露自己的错误（在法庭上，是被告这样做；在公众舆论中，是公司自己这样做）。这种方法被认为是有效的，因为你自己发布坏消息会增加你信息的公信度。对于这一点，观众会根据发布信息的人来判断违规行为的严重程度。^(10)\
    \ 透明度在法庭和公众舆论中备受推崇。\n\n   * 最后，采取积极是有回报的。经常让利益相关者知情比默默退缩希望问题消失要好。虽然积极的沟通方法最初导致组织的股价和声誉大跌，但比那些选择被动风格的公司反弹得更快。^(11)\n\
    \n2. **成功的公司关注受害者而不是他们自己**。这看起来很困难，因为需要公司对受害者表达同理心。由于法律考虑，公司往往不愿提供礼节（如公开道歉），它们可能无法通过以受害者为中心的测试。注意，在有效的危机沟通中，以受害者为中心是必要的，但不充分。如果受害者认为公司本可以更多地预防危机，或者对公司的声誉不利，可能还需要更多，如受补偿。^(12)\n\
    \n* 许多公司在沟通策略中抵制以受害者为中心，而是选择否认责任。关于这一点，研究结果是明确的。否认公司应承担的危机会导致双重打击。否认在最初效果较差，而且当事实随后暴露了公司的过错时，会引发另一场危机。只有在已知公司没有过错时，否认的方法才是有效的。^(13)\n\
    \n* 尽管否认是一种选择性方法，但沟通者明智地会将几种以此为核心策略融入其中。特别是，某些情况下公司对泄露并不承担直接责任。例如，你的客户可能在多个服务中重复使用相同的密码，其中一个就是你公司提供的服务。假设黑客破解了那些其他服务之一，你客户的密码在暗网上出售。即使你的公司并不负责，你将如何处理此类由他人或某事引发的通知？\n\
    \n* 关联泄露是一回事。数据武器化是另一回事。正如机构所意识到的，现在不再是网络犯罪分子可以夺取什么，而是他们可以伪造什么。也许坏分子最想要的是你的声誉。一种威胁向量可能是入侵你的公司电子邮件服务器，并泄露敏感或令人不悦的邮件发件人和收件人，而这些邮件从未打算给公众观众。\n"
