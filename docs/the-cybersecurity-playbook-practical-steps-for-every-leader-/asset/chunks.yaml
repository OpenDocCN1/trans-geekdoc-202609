    How far I’ve come from my very first flight. I was a 20-year-old intern with `INROADS`,
    a nonprofit organization that gave me my start in Corporate America. I was on
    my way from Tampa to Atlanta for a special `INROADS` retreat with my friends and
    fellow interns. I boarded the plane and took my seat `way` in the back—next to
    the lavatories, which I thought was great luck since I’d be extra close to the
    restroom should nature call. How convenient!


    As the flight attendants were giving safety instructions that my ears were hearing
    for the first time, I dutifully began to comply with buckling my seatbelt. Only
    it didn’t buckle. After a few failed attempts and asking the passenger next to
    me for assistance, it was clear: My seatbelt was broken. I remember thinking to
    myself, `Oh well. I guess seatbelts are sort of optional, kind of like they are
    on a school bus.` I didn’t think twice to mention it. And the flight attendants
    didn’t look twice to confirm I had securely fastened it.


    Of course, after logging millions of miles in the air, I know how egregious a
    broken seatbelt is. Today, I wouldn’t consider taxiing the runway, let alone leaving
    the ground, without a properly fitting belt secured firmly about my waist. (As
    an aside, that airline I took on my maiden voyage eventually went out of business.
    At the heart of its ultimate derailment? Serious safety concerns.)


    I now know what safety looks and feels like on a plane and in an airport. And
    I’m well aware of the behemoth infrastructure that assures me one primary right
    as a passenger: a safe experience. That’s not to say that airplanes don’t crash.
    But, at the same time, I needn’t settle for anything less than a safety standard
    rigorously upheld in air travel—and, yes, an effective seatbelt certainly qualifies
    on the list.


    There’s a reason that air travel remains the safest mode of transportation—more
    than 100 times safer than the automobile.([2](#c09.xhtml#c9-note-0002)) There’s
    a culture of security that permeates every facet of the airline industry.


    That statement may not strike you as extraordinary. You might think that safety
    should be at the heart of air travel. After all, the industry exists to transport
    precious cargo—in this case, human lives—from one place to another. You’d only
    be partially right. In fact, the commonplace nature of security that has become
    so threaded into the very fabric of air travel belies its virtually nonexistent
    beginnings in the industry.


    When we think of the good ol’ days of flight, our minds conjure up images of fashionably
    attired passengers, doted on by service-conscious flight attendants, on luxury
    liners with legroom to spare and haute cuisine served in the friendly skies. What
    that nostalgic image lacks is any reality to the dangers of flying back in those
    days. Passengers suffered a fatality rate nearly four times today’s average^([3](#c09.xhtml#c9-note-0003))
    given a “culture of security” that was anything but. Consider this punch list
    of safety concerns passengers faced at one time or another during the history
    of commercial airline travel:


    1. Mid-air collisions and deadly landings were far more common thanks to technology
    that left much to be desired for flying or landing an aircraft in inclement weather.

    2. Engines dropped out of planes so often that the incidents weren’t even recorded
    as accidents, provided the other engine could land the plane in a clutch.

    3. Inferior seatbelt designs and lower cabin ceilings meant a healthy dose of
    turbulence could result in more than a tossed lunch—it could lead to a snapped
    neck.

    4. About that turbulence. It was much more common on planes of yesteryear that
    lacked pressurized air cabins to allow flight at higher, safer, and more comfortable
    altitudes.

    5. Trips to the airplane lavatory were perilous for the less-than-sure-footed
    passenger. Stumble and you might find yourself landing on the sharp edge of a
    chair or table, yet another dangerous element in the environment contributing
    to injury or death.

    6. Glass dividers separating first-class and coach passengers were lovely to admire.
    They could also shatter and spray customers in an accident or turbulence.

    7. You could light up on a plane. Secondhand smoke added to the in-flight ambience.

    8. If cigarettes, faulty wiring, or unapproved cargo (such as chemical oxygen
    generators—yes, this really did happen) resulted in fire, no smoke detectors or
    fire extinguishers on board would give warning or resolution, respectively.

    9. Forgot your identification at home? No worries. It wasn’t needed to board a
    flight.

    10. Even when identification became a requirement, there was no need for the name
    on the ticket and identification to match.

    11. Carrying a weapon onboard? Flight attendants might have even helped you stow
    it away for safekeeping in an overhead bin.^([4](#c09.xhtml#c9-note-0004))

    12. There was no security check of checked bags on domestic flights.

    13. International flights—`sometimes`.

    14. Box cutters, knitting needles, scissors, and baseball bats? Welcomed accrements
    on a plane.

    15. The more, the merrier.

    16. Visiting the cockpit was a treat for the lucky passenger. You might have even
    earned “wings” in doing so.

    17. While visiting that cockpit, you would meet a pilot with one-sixth the flying
    experience^([5](#c09.xhtml#c9-note-0005)) required of those who inhabit it today.

    18. That pilot would also likely be fatigued, compliments of more lenient rules
    on mandatory rest requirements.

    19. Those safety instructions we now take for granted? Much less in the early
    days. Things like dimming the cabin and raising the window shades upon takeoff
    and landing are relatively recent additions to passenger welfare, given both allow
    travelers to adjust to the ambient conditions they may encounter in a crash.

    20. The `Transportation Security Administration (TSA)` that screens more than
    two million passengers and crew daily? It didn’t exist before 2001.


    Those are just 20 examples of how far the safety of air travel has come through
    the decades. And I haven’t even scratched the surface of all the changes made
    in a post-9/11 world.


    These changes didn’t happen overnight. They are the result of an industry, under
    siege by adversaries (environmental and human alike), pressured to steadily raise
    the bar on security over time. While we may be nostalgic for simpler times, when
    airport security was virtually nonexistent, many of us will also never know the
    terror that once threatened the freedom of flight. If youre like me, you can’t
    imagine boarding a flight with a perpetual fear that it could be diverted or doomed,
    not by turbulence or inclement weather, but by a hijacker bent on personal or
    political gain.


    Yet, that image—which has become the fare of big box-office action movies—was
    once a sobering reality for travelers during what has been dubbed the Golden Age
    of Hijacking. Skyjackers commandeered over 130 planes in American airspace between
    1968 and 1972, often at a pace of one or more per week.([6](#c09.xhtml#c9-note-0006))
    The hijacking “virus” was a raging epidemic. Media covered this dark reality of
    air travel with equal fervor. As psychiatrists interviewed hijackers, they discovered
    a mentality of one-upmanship. Would-be skyjackers, enamored with widespread news
    coverage of the latest airplane seizure, would think to themselves, “I can do
    better than that; I can improve upon that.”^([7](#c09.xhtml#c9-note-0007)) So
    the contagion spread.

    '
