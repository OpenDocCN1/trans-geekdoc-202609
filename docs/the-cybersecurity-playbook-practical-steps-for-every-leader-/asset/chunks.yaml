  trans: '

    正如这堂历史课所揭示的，技术有时会阻碍一个领域的进展，以加速另一个领域的飞跃。具体来说，当第一批个人电脑在 1984 年进入家庭时，我们几乎无法想象几十年后它们产生的影响。一方面，个人计算让我们今天所处的数字时代成为可能；另一方面，它在无意中剥夺了女性和少数群体追求编程职岗位的机会，包括目前需求量极大的网络安全工作。


    得是你，当个人电脑进入市场时，其价格点倾向于更富裕的家庭，许多许多新技术都是如此。这种现实让少数裔家庭处于不利地位，他们的平均收入低于非少数裔的群体。


    在几年内，大学开始涌入大量想要从事编程职业的申请者——很大程度上归功于个人电脑的出现，这已成了一个前景广阔的火热市场。供需经济规律开始发挥作用。大学无法满足所有想从事计算机科学职业的候选人的需求，包括女性和少数裔。他们开始提高此类学位的门槛，特别是在关键的学习第一年，以筛选掉那些被认为对所需技能缺乏天赋的候选人（通常是通过加速本应在学生学习后期才出现的课程）。


    这种快速通道的课程有利于那些此前有在敲击键盘、学习计算机内部运行机制经验的人。换句话说，来自电脑家庭的候选人——白人男性。


    但这些家庭中的白人女性呢？为什么当一个小女孩可以使用相同的技术时，她对电脑的兴趣会比她哥哥小呢？


    回想 20 世纪 80 年代中后期横行于好莱坞大银幕的青少年文化。你可能记得像《极客妈妈复仇》、《奇异科学》和《电子游戏》这样的流行文化经典。这些票房大片中脱出的主角角是谁？好莱坞对“可爱的极客”的刻板印象——准确地说，是一个白人男性极客。


    计算机以及控制它们的编程语言成了一门男人的行当。青少年女孩（比如当时的我）不再想象自己投身于这些职业，因为这些职业似乎是为男性量身定做的。有一句话让作为女性的我产生了共鸣：“如果她无法*看到*自己的影子，她就无法*成为*她。”而那些在编程领域表现出色的女性典型——那些类似于阿达·洛夫莱斯、格蕾丝·霍珀和布莱切利公园女性的形象——在当时几乎每一部美化计算的大片中都消失无踪了。


    我给你们讲这堂简短的历史课，并不是为了给某个方向归责任。明确的是，我非常感激我拥有一台电脑来写这本书。我非常感激我们拥有才华横溢的程序员——无论男性还是女性——他们让我今天享受的许多创新成为可能。我恰好是那些将计算机带入流行文化的
    80 年代电影的粉丝。对于那些为我们所取得的未来铺平道路的无数创新者（男女都有），我深表谢意。


    我只是想扩大我们网络安全人才的可触市场，因为网络安全人才短缺是我们面临的又一个威胁。另一个对我们数字自由的威胁无疑是我们可以避免的。


    不从历史中吸取教训的人注定重蹈覆辙。从这堂历史课中，我们可以汲取许多经验，以改变未来的轨迹，并使网络安全失业率高于零（我意识到，*想要*网络安全领域失业是一个奇怪的愿望，但我希望我已经传达了这一点：劳动力的某种过剩好过于我们正面临的看似无止尽的人才短缺）。作为公司的招聘人员，人力资源专业人士在帮助其公司以及网络安全行业弥补差距方面发挥着重要作用。


    ## 给 HR 专业人士的 W.I.S.D.O.M.


    我们必须接受两个现实。首先，我们现有网络安全人才储备极其匮乏，这个问题在短期内不会改变。其次，由于储备中的候选人不足以填充我们目前的网络安全职位，我们需要每位员工都加入战斗，尽自己的份加强公司的防御。


    硬币的两面——招聘和征兵——变成了对人力资源专业人士的动员号召。在招聘方面，HR 可以帮助其组织扩大网络安全人才的窗口。这不是一个偏见可以获胜的情况。我们需要所有人才来帮助战斗——男性和女性、少数裔和非少数裔、艺术与科学。对于最后一点，我们的行业一直关注
    STEM（科学、技术、工程和数学），以至于我们丢失了 STEAM（科学、技术、工程、艺术和数学）。网络安全既是一场心理战，也是一场技术战（战斗两者都适用）。它既涉及软技能也涉及硬技能。它对创造力的锻炼与对解决问题的锻炼同样重要。


    审视你们的网络安全职位启事，寻找一种能够扩大申请人市场的技能平衡。这样做不会损害候选人的质量（这并不是为了降低标准）。回看该领域女性的历史，在那个复杂的数学是在人脑中而非机器中计算的时代，你会发现女性在履行这些角色方面与男性一样优秀。你可能只需要在公司自己的网络安全职位描述中，寻找与
    2 世纪 80 年代后期大学筛选多样化人才时相同的无意识偏见。当你发现它时，要无情地*剔除它*。


    但仍然还够。你需要在整个招聘过程中都这样做。这包括面试。不幸的是，许多面试中层司见常的问题也是无意识偏见的来源。例如，常见的行为面试面试问题（如“请告诉我一次关于……的经历”）自然地倾向于有更多资历背景的候选人。然而，这些背景可能可能也可能与今天的挑战无关。事实上，研究表明，此类问题对预测成功的概率仅比掷硬币高出
    12%。相反，给候选人一个问题，并询问她将如何解决。你可以要求候选人向你介绍她入职后适应你们文化和公司的计划。你可以向她展示当前流程的流程图，并请她提出改进建议。重点在于，你想看到候选人如何思考，而不仅仅是让她复述过去。


    在面试过程中，使用面试官小组来识别最合格的候选人。这是另一个“过犹不及及”的案例。例如，Google 有其“四人规则”，他们成功地建立了一个模型，四次面试足以以
    86%的置信度预测新 Google 员工的成功率。多则多此，少则不足。


    无论你们公司的理想数字是多少，确保你的面试小组中至少有一位多元化的领导者。男性和女性回答问题的方式不同。在你的面试小组中同时拥有两者可以考虑到这些差异。


    从 Google 身上得到的另一个教训，他们还有一个有趣的面试问题，他们对男性和女性的评分不同。问题是：“在 1 到 5 分范围内，为你自己的软件工程师水平打分。”

    '
- fmt: '

    Their evidence suggests the most successful male Googlers answered “4” when asked
    this interview question. Google finds that men tend to inflate their experience
    or qualifications. The score most likely to predict success for female candidates?
    A perfect 5, as Google finds women are more likely to be reserved and humble.
    (Of course, Google will now have to come up with additional interview questions
    to determine success, given their secret is out!)


    For all these reasons, McAfee uses a panel interview approach for most positions.
    And we place at least one female or minority on every interview panel to represent
    the same diversity we aspire to recruit.


    Finally, eliminate the bias that may have your company seeking only professionals
    with prior cybersecurity experience. There aren’t enough of them in the market.
    We can’t keep poaching from one another, driving up wages, and churning talent
    in the process. So eliminate questions that bias your company against candidates
    with different backgrounds. For instance, asking a candidate to tell you about
    the latest hot innovation he finds interesting in cybersecurity disadvantages
    those with less hands-on experience (as we learned from the history lesson of
    the PC). Ensure your questions pick up STEAM—pun intended—when looking for qualified
    candidates.


    I walked into McAfee without having a lick of cybersecurity experience in my background.
    Within six months, I had co-authored a book on the topic. I’m not minimizing the
    complexity of the industry. But I am suggesting that skills are transferable.
    Look for candidates with technical skills in other fields. You’ll find technical
    industries, like telecom, that aren’t in the same zero-percent unemployment state.
    Technology lends itself to ebbs and flows in different labor markets. Expand your
    aperture for qualified talent with transferable skills, whether candidates have
    prior cybersecurity experience or not.


    On the enlistment side of the coin, you can pull multiple levers to embed cybersecurity
    in the day-to-day jobs of employees, without overwhelming them in the process.
    First, `search your company values`—those standards for conduct or guiding principles
    that you expect employees to uphold—`and see where you can add one word to change
    their meaning in a profound way: ''security''.`


    For example, in exploring my former stomping grounds at a prior employer, Verizon,
    I found the company has an impressive credo featured on their website at the time
    of this writing. Let’s take a look at how inserting just one word can expand meaning
    without compromising intent (italics mine, to suggest the addition):


    > We have work because our customers value our high-quality communications services.


    > We deliver superior customer experiences through our products and our actions.
    Everything we do we build on a strong network, systems and process foundation.
    The quality, reliability `and security` of the products we deliver are paramount.
    Customers pay us to provide them with services that they can rely on.


    One word can change scope without altering purpose.


    Now this isn’t a game of Cybersecurity Bingo. There are values or guiding principles
    where security just doesn’t fit. Don’t force a square peg in a round hole. Case
    in point from Verizon’s example:


    > We know teamwork enables us to serve our customers better and faster.


    > We embrace diversity and personal development not only because it’s the right
    thing to do, but also because it’s smart business. We are driven not by ego but
    by accomplishments. We keep our commitments to each other and our customers. Our
    word is our contract. We respect and trust one another, communicating openly,
    candidly and directly since any other way is unfair and a waste of time. We voice
    our opinion and exercise constructive dissent, and then rally around the agreed-upon
    action with our full support. Any one of us can deliver a view or idea to anyone
    else, and listen to and value another’s view regardless of title or level. Ideas
    live and die on their merits rather than where they were invented.


    I happen to love that excerpt from Verizon’s credo. But, try as I might, I couldn’t
    find a way to naturally insert “security” in what is already stated beautifully.


    That’s okay. While you won’t contrive a home for security in a company value where
    it doesn’t belong, you’ll likely find at least one where it easily does. Assuming
    your values are more than fancy copy on the back of an employee’s badge, you’ll
    begin to seed security into your company’s foundation by rooting out non-secure
    behaviors and implanting secure ones in their place.


    Next, let’s look at your `rewards and recognition programs` to find a natural
    home for cybersecurity achievements. The first is clear and easy. Show some love
    to your cybersecurity team. As mentioned in Chapter 2, they’ve been relegated
    to the backstage of your company for too long. Bring them out from behind the
    curtain.


    How? Give your `CISO` a voice in some company all-hands meetings. She doesn’t
    need to be a perennial fixture in every company event. But you can certainly expose
    her and her team’s accomplishments for the broader employee population to understand
    the attack landscape and the importance of cybersecurity defense. Beyond enlisting
    more recruits to the fight, a little appreciation goes a long way and may help
    stymie high turnover rates (thanks to that nonexistent unemployment rate) in your
    cybersecurity ranks.


    Next, expand your rewards and recognition programs to include cybersecurity. I
    mentioned in the last chapter about the importance of stopping the line for a
    new product or service release whenever security is subpar. Use your company’s
    recognition platform to publicly credit employees—whether in cybersecurity or
    not—for raising valid security concerns that stop any such product or service
    from ever reaching the market.


    Now it’s time to address the elephant in the room where this book is concerned.
    Up until this point, we’ve been talking about employees as generally well-intentioned
    subjects seeking to do right by their companies in the way of cybersecurity, but
    perhaps lacking the education or prescription to do so. That’s largely the reality.


    But there is a subset of employees who have no desire to do right by your company.
    These aren’t simply apathetic bystanders in the cybersecurity fight. These are
    malicious insiders seeking to do your organization harm and/or personally profit
    at your company’s expense. According to Verizon’s DBIR report, malicious insiders
    account for over 10 percent of all company breaches.


    Malicious insiders are the most insidious enemies for companies to address. For
    one, companies are reluctant to impose a Big Brother state of monitoring on employees—and
    for good reason. Privacy concerns notwithstanding, employers may be unwilling
    to treat every employee as a potential bad actor, favoring instead a workplace
    culture in which trust is freely offered, not arduously earned over time.


    Yet, bad actors who work for your company are a reality. What’s an organization
    to do to weed out the threat from within? Your cybersecurity organization has
    technologies it can deploy to identify anomalous behavior. But technology, on
    its own, is a much weaker defense than the combination of technology, tools, and
    people working together. This is where HR professionals can assist in creating
    people controls to identify malicious insiders.

