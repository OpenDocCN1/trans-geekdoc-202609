    为了让转型目标变得更加困难，旧技术具有非常长的生命周期。即使业务部门正忙于部署云服务（无论是否获得 IT 部门的正式许可），仍有长尾本地基础设施必须维护。以
    USB 闪存盘为例：2017 年，本·古利恩大学的研究人员记录了 29 种破坏 USB 设备的已知攻击向量.^(7) 此外，无软件硬件加密 USB 闪盘的制造商
    Apricorn 在 2017 年报告说，虽然 90% 的员工使用 USB 闪盘，但只有 20% 的人在使用时加密.^(8)


    由于长尾遗留技术基础设施很少消失，且绝不会消失得很快，这些转型追求意味着范围和责任的风险化扩张。


    我们的 CISO（首席信息安全官）该怎么办？如果轻率地支持一个全方位开放、随心所欲的环境，他会让自己的组织面临日益增加的风险。如果为了遏制潜在威胁而成为“拒绝”的部门，他可能会被那些他必须保护的员工所架空（还记得平均公司中有近
    2000 个 IT 专业人员并不情的情况下使用的云服务吗？）。


    CISO 处在一个不令人羡慕的境地。他必须在保护公司最宝贵的数字资产的同时，推进转型议程。遗憾的是，这些任务之间的冲突再不过了。


    ## 2. 风险管理


    网络犯罪是一门大生意——准确地说，2017 年是一项规模达 6000 亿美元的业务，比 2014 年增加了 1000 亿美元.^(9) 从全球范围内，网络犯罪作为经济危害排名第三，仅次于政府腐败和毒品。


    我们是如何走到这一步的？曾经，网络安全相对“简单”。安全不仅局限于物理层面（如前所述），处理威胁也容易得多。2006 年，McAfee 每天检测到 25 个新威胁。十年后，这个数字飙升到
    50 万——意味着每秒超过 5 个新威胁！


    数量只是挑战的一部分。过去发现威胁是很直观的。威胁以恶意软件的形式出现——即由坏人设计、旨在给受害者造成破坏性影响的软件。网络安全行业谈论“传统”恶意软件，包括那些你熟之于详并深厌恶的病毒。恶意软件曾只带有一段静态代码字符串，让行业能够将其识别为恶意软件。你可以将其视为某种软件指纹——网络安全行业称之为
    `signature`（签名）。就像执法部门依靠国家登记处根据指纹识别罪犯一样，网络安全行业寻找 `software signatures` 以将已知恶意软件加载到自己的数据库中。如果在文件中发现了
    `signature`，该文件将被拦截，威胁将被遏制。


    ### 威胁的演变：从恶意软件到无文件攻击


    时代已经变了。最阴险的威胁不再显眼地披着已知且易于识别的指纹。坏分子变得聪明得多了。当你读到这里时，最新的网络安全威胁几乎没有列在这里，但在我写这些文字时，我的行业正痴于“无文件”攻击。这些威胁秘密地利用你组织内部受信任的技术，例如经过批准的工具和应用程序。然后它们就开始造成破坏。


    ### 2.1 勒索软件与利用的兴起


    数量只是挑战的一部分。过去发现威胁是很直观的。…… `The industry is fixated on “fileless” attacks. These
    threats surreptreptit exploit exploit trusted within within your organization,
    like sanctioned and and.... the the the the ` ` ` ` the the the the the the the
    the the to the.. `CISO 在缓解风险方面不断走钢丝。他们必须在高流量威胁和可能导致公司崩溃的小流量攻击之间取得正确的平衡。


    ### 2.. CISO 的挑战


    如何让 CISO 向董事会解释这一切？…… `但其核心也很直观。它从根本上说关于风险管理——这是董事成员自然通的语言。CISO 在缓解风险方面不断走钢丝。他们必须在高流量威胁和可能导致公司崩溃的小流量攻击之间取得正确的平衡。我们所有人，无论是董事还是其他人，都能在风险管理上与
    CISO 产生共鸣，因为我们在生活中同样这样做。我们在浴室里脚垫防止跌倒风险（对于大多数年龄段的人来说，这是一个较小的风险）。我们在家里使用烟雾报警器并购买保险单来缓解更灾难性的风险，如火灾。虽然其他真正灾难性的风险（如被陨石击中）可能会发生（是的，这确实在
    1954 年某一个可怜的人身上发生过^(10)），但考虑到其极小的概率，我们安全地忽略了这些风险。CISO 必须以类似的方式对公司的风险进行分类。我们的 CISO
    面临的挑战是在简化网络安全主题的同时，不使其化。董事成员的责任是什么？参与讨论，意识到表面下复杂的泥潭很少、甚至永远无法产生明确的决策。战争无法带来清晰，网络安全也是如此。


    ## 3. 自动化与效率


    用更少的资源做更多是现代企业一个令人厌烦的陈词。这也是 CISO 不幸的使命。威胁的数量不仅没有减少的迹象，而且对网络安全专业人才的需求远超劳动力市场的人才供应。根据
    `Cybersecurity Ventures` 的数据，到 2021 年将有超过 350 万个网络安全职位无人无人^(11) ——这足以填满 50 个橄榄球场！


    而且问题只会变得恶化。2014 年，网络安全行业估计全球缺口 100 万专业人士。到 2015 年，缺口增加到 150 万。2016 年，预测者认为到 2019
    年网络安全人才缺口将达到 200 万专业人士.^(12) 正随着威胁不断增加，合格网络安全专业人才的缺口也在扩大。


