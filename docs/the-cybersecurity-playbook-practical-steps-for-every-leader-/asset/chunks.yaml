    asked that I reply to him via email since he couldn’t reach me via phone.


    As I grabbed my keys and ran out the door, I thought to myself, *That phishing
    campaign at work started out so cleverly. But this fake phish from Chris really
    wasn’t great. Too easy to spot.*


    As soon as I got to the office, I dutifully reported the phish. To my surprise,
    I didn’t get the usual congratulatory message popup from our security team saying
    I had passed the test. *That’s odd. I’ll need to let them know that their immediate
    response is off. Next time I see our CISO, I’ll mention it. . . .*


    But I wouldn’t have that opportunity. That’s because, in less than 10 minutes,
    I received an email from our security team. But it wasn’t the “good on you for
    spotting the fake phish” email I was expecting. Turns out, it was a real phish
    I reported. Our cybersecurity team investigated it in minutes and responded with
    immediate steps to take in case I *had* responded (which I hadn’t).


    You would expect such a multifaceted campaign from a marketing or HR team. You
    might not immediately think of your cybersecurity team in the same light. But
    if our CISOs and their teams don’t assume the mantle of evangelizing culture,
    how can they expect their business counterparts to do the same with cybersecurity?
    CISOs must meet them more than halfway if a culture of cybersecurity is to take
    root.


    ## W.I.S.D.O.M. for the Cybersecurity Professional


    CISOs have a wealth of resources on best-in-class practices in their trade. This
    `W.I.S.D.O.M.` isn’t for those looking for deep-dive technical advice. That makes
    it no less important. This prescription is about connecting your value to that
    of the business. It requires CISOs to both cover the basics and stretch beyond
    their departmental walls.


    **Sound cybersecurity hygiene is nonnegotiable.** CISOs must ensure the basics
    are covered and cybersecurity hygiene is at the top of that list of “things to
    do.” This is a case where common sense isn’t always so common. In one of the biggest
    breaches to date, the failure was due to a known vulnerability that was unpatched.
    Even more interesting about the postmortem on this attack: The email roster used
    to notify security administrators of the vulnerability neglected to include those
    who “needed to know.” So the unpatched vulnerability caused the breach. And an
    out-of-date email distribution group of security administrators led to the unpatched
    vulnerability. It’s just one notable example of how the devil truly is in the
    details for cybersecurity professionals.


    Because your infrastructure continues to expand both physically and virtually,
    sound patching requires an inventory of all possible servers in use or otherwise.
    Zombie servers, those that haven’t been used in at least six months, are `9`.
