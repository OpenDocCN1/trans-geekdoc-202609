    最后，要在公司内**高扬网络安全旗帜**。这需要两方面的努力。首先，首席信息安全官（CISO）必须能够听懂董事会的语言。董事会室说的是风险语言——而这始终与公司战略相关联。与业务部门负责人、CFO
    和 CEO 合作，识别并优先考虑公司最具战略性的资产。对于每种资产，识别泄露后的后果。最后，提供其当前的漏洞情况。立即优先处理高优先级/高漏洞资产并制定修复计划。当被邀请参加董事会时，使用此框架作为指南，定义你的网络安全战略如何映射到公司的整体战略中。


    除了在垂直方向传播安全文化外，还要通过组织内的员工进行水平传播。与人力资源（HR）部门的伙伴合作，提供有效的培训，以提高员工在其岗位上的安全意识（就像麦菲的
    CISO 在其钓鱼攻击活动中所做的那样）。找到一种方法，让网络安全不仅仅是一年度的培训活动，或是员工入职时回答的问题清单。在你的团队中聘请一名沟通专家，并与营销部门合作，定义该职位的角色和技能
    set。让你的沟通大使与市场部和 HR 合作，开展有效的内部活动，使网络安全成为每个人日常工作的一部分。


    ***


    是时候让 CISO 在高管层会议上接受自己的角色了。是时候他们培养一种远超 IT 领域的网络安全文化了。是时候与关键利益相关者（特别是 HR 和市场部）建立新的伙伴关系，以提升网络安全意识并降低安全漏洞。是时候改写
    CISO 故事的结局了。得益于许多已经在前行的进取型 CISO，其他成员无需想象他们的故事书式结局。这正在变成现实。


