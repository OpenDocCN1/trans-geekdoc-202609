    those imperatives couldn’t be at greater odds with one another.


    ### 2\. Risk Management


    Cybercrime is big business—to be exact, a $600 billion business in 2017, up $100
    billion from 2014.^([9](#c02.xhtml#c02-note-0009)) In terms of global impact,
    cybercrime ranks third as an economic scourge, behind government corruption and
    narcotics.


    How did we get here? There was a time when cybersecurity was relatively “simple.”
    Not only was security contained to the physical, as already mentioned, but addressing
    a threat was significantly easier. In 2006, McAfee detected 25 new threats per
    day. Ten years later, that figure had jumped to 500,000—more than five new threats
    per second!


    Volume is only part of the challenge. Spotting a threat used to be straightforward.
    Threats came in the form of malware—software designed by bad guys to wreak havoc
    on their victims. The cybersecurity industry talks of “traditional” malware, including
    those pesky viruses you’ve come to know and hate. Malware once only came with
    a static string of code that allowed the industry to identify it as such. Think
    of it as a software fingerprint of sorts—what the cybersecurity industry calls
    a signature. Much like law enforcement relies on a national registry to identify
    criminals based on fingerprints, the cybersecurity industry looks for software
    signatures to load known malware into its own database. If the signature is found
    on a file, the file is blocked and the threat contained.


    How times have changed. The most insidious threats no longer come conspicuously
    donning a known and readily identifiable fingerprint. Bad actors have grown much
    smarter. When you read this, the latest cybersecurity threat is almost certainly
    not listed here, but as I write this, my industry is fixated on “fileless” attacks.
    These threats surreptitiously exploit trusted technology within your organization,
    like sanctioned tools and applications. Then they do their damage, typically by
    gaining access to your company’s larger network and pilfering its data.


    I say “typically” because data exfiltration is no longer the only tactic online
    adversaries execute. Ransomware is another topic du jour of cybersecurity, where
    adversaries won’t bother exfiltrating data to sell it on the Dark Web. They’ll
    shortcut their path to profit by locking (or encrypting) their victim’s files
    and demanding ransom for the key (or decryption) before permanently destroying
    them.


    Or perhaps data and money aren’t the end pursuits at all. An adversary may be
    more inclined to wreak havoc by shutting down access to a victim’s critical systems,
    bringing the company to its knees in the process. Or hackers may practice information
    warfare, where data itself is weaponized to create chaos (just think of the volumes
    of data your company generates each day and how the tiniest manipulations to it
    could cause your employer considerable harm and confusion). Or perhaps it’s your
    company’s reputation the hacker is after, as McAfee learned the hard way with
    our social media exploit.


    You get the picture. Not only are threats exponentially greater, but they’re significantly
    more complex and insidious. And the volume, variety, and vigor of threats translate
    to more risk.


    How can CISOs be expected to explain this convoluted reality to their boards,
    many of which meet less than six times per year for four hours, on average, according
    to Deloitte? That’s 24 hours per year for the average board to cover topics ranging
    from company strategy to financial performance to sensitive M&A activities and
    everything in between. Is it any wonder that cybersecurity as a topic, with its
    highly technical and complex nature, gets short shrift by most boards?


    But it doesn’t have to be this way. Cybersecurity is indeed highly technical.
    But it’s also very straightforward at its core. It’s fundamentally about risk
    management—a language in which most board members are naturally fluent.


    CISOs are continually walking a tightrope in mitigating risk. They must strike
    the right balance between addressing high-volume threats that likely won’t cause
    catastrophic impact and low-volume, highly targeted attacks that can take a company
    down.


    All of us, board members or otherwise, can relate to the CISO on the challenge
    of risk management, since we walk the same fine line in our own lives. We have
    bathmats in our bathrooms to prevent the risk of falls (a relatively minor risk
    for most under a certain age). We use smoke alarms in our homes and purchase insurance
    policies to mitigate more catastrophic risks, like fire. And while other truly
    cataclysmic risks, such as being struck by a meteorite can happen (and, yes, this
    really *did* happen for one poor unfortunate soul in 1954^([10](#c02.xhtml#c02-note-0010))
    ), we safely ignore these risks given their infinitesimal probability.


    CISOs must categorize risks in much the same way for their companies. The challenge
    for our CISO is to simplify the topic of cybersecurity, without making it simplistic
    in the process. The onus for board members? Leaning in to the discussion, realizing
    the morass of complexity beneath the surface will rarely, if ever, yield a clear-cut
    decision. War doesn’t lend itself to clarity. Neither does cybersecurity.


    ### 3\. Automation and Efficacy


    “Doing more with less” is an annoying cliché of the modern enterprise. It’s also
    the CISO’s unfortunate mandate. Not only does the volume of threats show no sign
    of abating, but the demand for cybersecurity professionals far exceeds the supply
    of talent in the labor market. According to Cybersecurity Ventures, more than
    3.5 million cybersecurity jobs will be unfilled by 2021^([11](#c02.xhtml#c02-note-0011))
    —that’s enough to fill 50 NFL stadiums!


    And the problem is only growing worse. In 2014, the cybersecurity industry estimated
    it would be short one million professionals worldwide. By 2015, the gap had crept
    up to 1.5 million openings. In 2016, forecasters thought the cybersecurity talent
    shortage would be 2 million professionals in 2019.^([12](#c02.xhtml#c02-note-0012))
