    \n# CHAPTER 4  \n\nStop the Line\n\n> *Cybersecurity is viewed as a critical defensive\
    \ effort for our business. If you think about what we do and what we provide—water—in\
    \ the event of something compromising our systems and if our customers lose faith\
    \ in our ability to provide good, clean, safe drinking water, it’s catastrophic.*\n\
    \n> \n\n> CEO, Utilities Company\n\nThe year was 2017. We saw the beginnings of\
