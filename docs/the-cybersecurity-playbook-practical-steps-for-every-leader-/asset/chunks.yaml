    *   你们正在使用什么技术？（我们将获取答案并进行漏洞评估。）

    *   你们的访问管理系统是如何工作的？

    *   允许哪些第三方工具连接到你们的平台，以便在攻击后自动执行必要的内容回滚？

    *   如果账户被劫持，你们的升级流程是怎样的？

    *   你们应对黑客攻击以及帮助客户恢复到攻击前内容的服务水平协议（SLA）是什么样的？


    ## 谁的错？


    当然，社交媒体提供商可以辩称，我们没有做一些显而易见的事，比如通过经常审查将管理员人数减至最低、坚持使用唯一的强密码等等。但，他们那种僵化的政策也无济于事，即使网站遭受了显而易见、严重的攻击，也必须在“分析”完成之前一直保持现状。当然，该机构的人员也不应该在多个账户上重复同一个密码。


    但请注意，我给这一章起的标题是“*我*毁了复活节”。不，我没有黑进 McAfee 的公司社交页面。我没有故意放开大门让坏分子做同样的事。在那个复活节周日，我最不希望面对的就是处理由于多个方面的喜剧性错误和种种巧合而导致的局面。尽管如此，我只能对事件的发生负责。因为归根结底，那个公司社交页面是在我团队的监督下的。我们未能采取合理措施来履行保护它的职责。


    个人责任是一件令人不安的事物。我们中很少有人乐于思考我们本可以做些什么更好或不同的事情，以避免不幸事件的发生。推卸责任是更符合人性的反应。然而，正是我们这种推卸个人责任的倾向，仍然是黑客社区武器库中的一把关键武器。


    长期以来，网络安全一直是“别人”的问题。对于太多人来说，网络安全是一个晦涩的话题，不值得他们投入时间，更不用说个人责任了。这本书试图改变这种叙事，即使只是通过迈出谦虚的一步，承认我们作为组织员工——以及最终的防御者——所共同承担的责任。如果我们的公司不能信任我们采取合理的预防措施来保护其最神圣的数字资产，它还能信任谁呢？


    让我放下我的教条台，承认真正的问题。并不是说员工（普遍而言）并不*想*做正确的事。更多的情况是，他们根本不知道*该*怎么做。


    网络安全是一项团队运动，每个人在比赛的每一分钟都需要守好自己的位置。工具可以非常有帮助，但只有当人员、工具、程序、定期审查和其他因素共同作用时，它们才能形成有效的防御。


    ## 记住这个关键要素


    减少网络威胁的另一个关键要素是诚实。对于一本以我的名字命名的书，开头就描述一个在我监督下发生的尴尬安全失败，我显然超出了自己的舒适区。情况本可能更糟糕吗？绝对可能。它本不应该发生吗？绝对应该。


    而且，那可能是你而不是我吗？同样，绝对可能。


    通过告诉你们这个故事，我想设定一种诚实的基调，这种基调在你们努力击败坏人的业务中也是需要的：你们需要建立一种安全文化，让人们不仅能够互相帮助，而且在看到不安全操作时彼此诚实。这是一种没有愤怒、指责或报复的诚实，它对于这种文化的运作至关重要。


    描述我们社交媒体遭攻击的第二个原因是，让你能够汲取这些教训并立即应用到你看到自己安全盔甲存在漏洞的地方。


    ## 为什么是我？


    市面上不乏由声誉良好、才华横溢且经验丰富的作者创作的的网络安全书籍。你会发现一些是记者写的，他们剖析了历史上一些最传奇的入侵事件。你还会发现另一些由名人物写的，他们以行业受尊敬的先驱身份进行权威发言。你还会发现更多由技术专家编写的，他们详尽地解读了网络安全复杂的元素。


    但是，当我打出这些字时，你找不到许多由营销人员撰写的网络安全书籍。而在该行业只有几年的营销人员撰写的书籍可能更少。那么，为什么要信任这个作者处理如此严肃的话题呢？


    把我想象成营销与技术之间的混合体吧。我的职业生涯一直致力于将技术概念翻译成日常语言。我研究工作与技术的交汇点，以理解企业文化是如何变化的。


    所以，如果你是一个通常的非技术人员，请放心，我努力向你提供足够的教育，让你理解这个棘手话题的细微差别，而不会让你被技术细节淹没。如果你比我更懂技术，虽然我不会淡化这个话题，但我会提供每个员工（无论技术背景与否）都可以练习以保护其组织的处方。最后，如果你是我网络安全领域的兄弟胞，我希望你阅读并享受这本书，将其作为窥视我们世界的窗口。然后，我想让你传给你的非网络安全同事，招募他们加入我们的战斗。


    ## 为什么是你？


    你可能认为自己是一个网络安全领域无法提供太多贡献的人。毕竟，那些不在网络安全走廊内的员工、经理、高管和董事会成员，如何能在一个他们可能都不理解的游戏中真正发挥有意义的作用呢？


    这就是我转向职业体育世界寻求启发的地方，因为它经常揭示了许多我们都可以学习的关于团队合作的教训。虽然我不是一个运动狂，但我对美式橄榄球情有独钟。那是因为我小学低年级时美好的记忆：坐在家里的沙发上，坐在爸爸身边，看他最喜欢的比赛。


