    读这本书的每人要么是网络安全问题的一部分，要么是其公司解决方案解决方案的一部分。首席执行官和董事成员也不例外。有多种方法可以让你最终注意到我们中的那些“**透明人**”（`Mr./Ms.
    Cellophanes`），并给予他们应得的认可和支持。


    ## 将网络安全作为董事会议程


    首先，网络安全不应该是董事会议程中随机或零星出现的话题。更重要的是，它不是一个可以一直忽视直到不可避免的违规发生的话题。董事会必须将网络安全列为常规议题。我并不天真到认为网络安全能获得与财务表现同等的时间或关注。但如果董事会确实担心降低风险（我相信大多数董事都是如此），那么请在你的议程中为网络安全留出合理的时间。


    ### 你应该分配多少时间？


    这取决于你的董事会对会对这一主题的理解程度如何。如果你还没有让你的 `CISO` 对你目前的网络安全态势提供有意义的见解，`请为该主题分配至少 90 分钟。`
    在这段时间内，你的 `CISO` 应该涵盖对整个公司最关重要的资产。


    这需要与业务部门领导者进行大量的沟通。正确的答案可能并不显而易见。例如，客户数据可能不是你组织最宝贵的资产（尽管它在列表中可能排名非常靠前）。如果你经营的是大型制造设施业务，这些场所可能是你最具战略意义的资产（而且，随着连接设备渗透到业务的几乎每一个方面，有动机会的黑客往往会破坏[即使不是关停]这些设施）。


    你的 `CISO` 应该根据资产战略价值的优先级次序，提供每项资产的当前漏洞状态。在不分分简化任务的情况下，你可以想象一个 2x2 的矩阵，漏洞状态和战略优先级分别绘制在两个轴上。`那些既具有高度战略性又高度脆弱的资产应该立即重新分配预算。`


    在预算分配方面，虽然这看起来是这项练习的显而易见的成果，但大多数董事倾向于在发生违规时才松腰包——这也是一个很高的要求。2017 年，`EY` 的全球信息安全调查发现，76%
    的高管承认，只有在发生实际损害的违规时，才会触发额外的网络安全资源分配。没有损害的违规？近三分之二的人说这不会迫使额外支出.^(15)


    拥有足够的网络安全知识以对网络风险提供有效监督是关重要的。然而，少于 40% 的董事会具备这些知识.^(16)


    一旦你的董事会和 `CISO` 达成一致，让你的 `CISO` 成为董事会的常驻参加者。网络安全的变化以令人眩晕的速度进行。你的对手非常有动力伤害你。他们不休息，你也不应该。


    `在每次董事会议上至少花 30 分钟讨论网络安全话题。` 如果平均董事会每年开六次，每次四小时，我要求你在这个重要话题上花费少于总时间的 15%。`Deloitte`
    报告称，少于 20% 的董事会将网络安全列为常规董事会议程.^(17) 如果 `Deloitte` 的说法是正确的，且网络安全也是大多数董事面临的首要风险，那么每年定期讨论三个小时似乎是完全合理的的。


    ### 风险评估与测试纪律


    让 `CISO` 在这些会议中更新你的风险评估。他应该准备好讨论你的资产的漏洞格局发生了什么变化。`他将通过提供网络安全行业所谓的“红队演习”或“渗透测试”的结果来获取这些信息。坚持将这些练习作为一种纪律。`
    这些是你的 `CISO` 协调针对你公司进行的模拟攻击，以测试其防御能力。他将组织两个团队——红队（攻击者）和蓝队（防御者）。红队通常由外部实体的专家组成，试图突破蓝队（公司）。通过这项练习，公司将发现其此前未知的漏洞。


    请记住：红队`总是`会获胜。而这是一件`好`事。你希望在黑客之前发现你公司的漏洞。补偿外部机构来发现你的网络安全弱点，比在发生实际违规时付给对手（以及监管机构）要具成本效益得多。


    最后，`考虑任命一位具有网络安全专业知识的董事成员。`此人将为会议带来独特的视角。作为网络安全的管理者，他将确保你的董事会不会退回到将该功能推回阴影之中。Deloitte`
    报告称，超过 80% 的公司在过去两年内没有向董事会增加具有网络安全专业知识的人.^(18)


    ## 让“透明人”可见


    `CISO` 是执行团队中不可或缺、且往往被低估的成员。虽然网络安全是每个人的责任，但董事会对 CEO 必须从组织高层设定正确的基调。你必须尽你的职责，将网络安全提升到它在你们桌上应有的地位。


    我最喜欢的电影台词之一来自《犯罪嫌疑人》：“魔鬼所施过的最大的诡计，就是让世界相信他不存在。”你的对手无无多求的就是让你把你的“透明人”整齐地藏在阴影中。他们希望如果你这样做，也会忽视他们——那些试图伤害你组织的日益增加的黑客。这些坏分子希望你将网络安全视为非战略性的投资。不要赋予他们这种权力。


    如果你在这一点上失败了，你可能会失去执行团队最有价值的成员之一：`透明人`。而且我提到的那种网络安全人才短缺将证明你很快无法招聘到替代者。


    `CISOs` 在公司的任期相对短，某些行业基准低至 24 个月。`ESG` 试图找出为什么 `CISO` 的寿命如此短暂。网络安全劳动力市场目前及可预见的未来都是卖方市场（多亏于那种人才短缺）。但
    `ESG` 发现，当一个 `CISO` 辞职加入另一公司时，因素不仅仅是薪水：


    - 36% 的离开是因为雇主没有强调网络安全的企业文化（幸好你在读这本书！）；

    - 34% 的离开是因为他们不是管理层和董事会的活跃参与者；

    - 30% 的是因为网络安全预算与组织的规模或行业不匹配而离开.^(19)


    CEO 和董事会可以做很多来成为网络安全解决方案的一部分，包括让你的 `CISO` 发出声音。除了让她参与对话之外，还要为她提供一个争取更多资源的平台（根据我向你分享的内容，她对更多资金的需求很可能是合法的）。尽管如此，要将她视为执行成员，并通过提问尖锐的问题来检查她的论点。为了做到这一点，你必须首先丰富对网络安全问题的理解——我希望本章对你有所帮助。


