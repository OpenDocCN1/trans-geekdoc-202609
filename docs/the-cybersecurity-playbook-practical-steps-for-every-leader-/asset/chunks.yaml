  raw: 'If that’s still an insufficient argument to convince you to care, how about
    this: the stakes of a data breach for your company have never been higher. That’s
    thanks to regulators that are piling on to help motivate companies to protect
    customer data. The General Data Protection Regulation (GDPR) applies to all companies
    doing business or monitoring the activities of subjects in the European Union
    (EU). Companies can lose up to 4 percent of annualized global revenues if found
    to be noncompliant with GDPR’s standards for collecting and protecting customer
    data. In 2018, Ponemon reported the average cost of a data breach was $3.86 million—and
    that was largely before GDPR’s enactment.^([5](#c03.xhtml#c3-note-0005)) Any company
    with more than $100 million in annualized global revenues that does business in
    the EU can already expect to pay more—potentially considerably more, depending
    on its revenues—for a breach that violates GDPR.


    The risks of a data breach are significant. The costs for a data breach are higher
    still. Don’t assume your company will survive the next breach just because it
    may have done so in the past. Even if it does, the financial pressures may lead
    to other consequences, up to and including layoffs. If you’re inclined to retain
    your existing job and see your company continue as a going concern, you must assume
    cybersecurity as part of your job description. Enemies love abject apathy on your
    part.


    ## W.I.S.D.O.M. for the Employee


    According to Verizon’s 2018 Data Breach Investigations Report (DBIR), employees
    are directly or indirectly responsible for over a quarter of all breaches. In
    more than 60 percent of these cases, a careless employee is to blame. That means
    nearly 20 percent of all breaches are at the hands of negligent employees.^([6](#c03.xhtml#c3-note-0006))
    It’s the reason employees remain among the strongest or weakest links in their
    company’s cybersecurity defenses.


    Thankfully, employees can take many steps to be a part of cybersecurity’s solution,
    rather than its problem. First, be alert to social engineering scams. Cybercriminals
    know how to exploit the trust of employees. And their methods are getting better.
    Spear phishing is the tactic of specifically targeting certain individuals or
    companies through a malicious communication, such as an email. As opposed to traditional
    phishing, which is more of a spray-and-pray tactic used by cybercriminals (in
    other words, very little, if any, targeting is in play), spear-phishing campaigns
    are much more effective since the criminal goes to great lengths to personalize
    the message.


    Whaling is one such variety of spear phishing, where the adversary impersonates
    a high-profile executive of the company, such as the CEO or CFO, and requests
    action from an unsuspecting employee. For instance, a criminal masquerading as
    the CFO could target a rank-and-file employee in the finance department and request
    that he transfer company funds to an account.


    Social engineering is one of the adversary’s clearest weapons against naïve employees.
    According to Verizon’s DBIR, 4 percent of people will click on any given phishing
    campaign. Perhaps most surprisingly, these victims aren’t prone to learning from
    their mistakes. The more phishing emails someone has clicked, the more likely
    he is to do so again.^([7](#c03.xhtml#c3-note-0007))


    Social engineering is highly effective at multiple levels of the organization.
    Yes, even against executives. In 2018, *Forbes* reported that nearly 80,000 firms
    across the U.S., UK, and Europe sent more than $12 billion to adversaries launching
    a highly targeted, five-year whaling campaign. Who were the employees duped into
    helping the adversaries fleece their companies? The companies’ own CFOs. It turns
    out the adversaries had a targeted database of more than 50,000 CFOs to use as
    their “marks” in the scam.^([8](#c03.xhtml#c3-note-0008)) In this case, the cybercriminals
    used highly personalized emails, seemingly sent by the CEO, to compel the CFO
    to immediately complete a wire transfer. We all can learn from this expensive
    lesson. *Any one of us can be conned.*


    So the first piece of W.I.S.D.O.M. for employees is **do not fall for the phish**.
    Look for the telltale signs of a malicious email such as the sender’s email address.
    Don’t click on a link from an unknown source. Instead, search for the company
    or go to the domain directly. But beware. Pharming sites are also popular, where
    cybercriminals stand up malicious websites to lure victims, then harvest their
    bounty be it financial or other personally identifiable information. Even by typing
    the domain directly, you may still land on a site with malicious intent and/or
    content.


    Beyond not falling for the phish, **be proactive and report it to your IT or security
    team immediately**. According to Verizon’s report, companies have 16 minutes until
    someone takes the bait with the first click to a phishing campaign. When does
    the first report come in to the security team? After 28 minutes.^([9](#c03.xhtml#c3-note-0009))
    During those mere 12 minutes, time is on the side of the adversary, and in their
    hands, time becomes yet another weapon through which they can inflict significant
    harm.


    As my confession at the beginning of the chapter illustrates, social engineering
    doesn’t have to be high-tech to be effective. Phone scams and good old-fashioned
    theft of carelessly unattended laptops, USBs, and mobile devices can also do the
    trick.


    But, while old-school tactics could fit the bill, know that adversaries continue
    to get smarter and better through technology to make social engineering even more
    effective. Artificial intelligence (AI), the stuff that makes our lives easier
    in so many ways (such as by our favorite search engine completing our term or
    phrase before we’ve even finished typing it), is the latest weapon in the arsenals
    of adversaries and defenders alike. AI promises to give adversaries even more
    precision in executing their phishing campaigns. They can target unsuspecting
    victims with more accuracy. And they can use AI to craft very personalized messages
    in large volumes.


    The new breed of social engineering that results combines the targeted effectiveness
    of spear phishing with the scale of traditional phishing. In other words, phishes
    will be harder to spot in the future. The online world is increasingly a masquerade
    ball, with all the magic of wonder and dazzle the Internet promises. But the party
    is more crowded every hour with threats like phishing in ever craftier disguises.
    Your vigilance in being aware of this threat must increase over time as well.


    Since adversaries are becoming more sophisticated, companies are spending more
    on cybersecurity than ever before. But those defenses are only useful if consistently
    applied and updated. You may think that the responsibility largely falls in the
    lap of the CISO and his department. You’d be right—up to a point. **Employees
    are equally responsible in ensuring those patches to laptops, mobile devices,
    and other personal technologies remain current.**


    If your IT department pushes a patch during regular business hours that impacts
    your productivity for a few moments, please don’t complain. Remember, cybersecurity
    doesn’t follow the traditional rules of IT, where software patches can come and
    go at the leisure of the business. If an adversary is assaulting your organization
    with the latest online scourge, your cybersecurity team doesn’t have the luxury
    of sitting and waiting for a “convenient” time to push a security update to employees’
    devices. Time is the most coveted weapon in the adversary’s arsenal. Time is certainly
    not on the side of your company. A little understanding and a lot of compliance
    on your part in accepting these security updates are most welcomed by the cybersecurity
    team doing its job to protect you.'
