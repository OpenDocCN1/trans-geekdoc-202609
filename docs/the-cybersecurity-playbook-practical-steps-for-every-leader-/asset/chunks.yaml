    目标是尽可能高效地降低风险。有很多问题可以引导首席信息安全官（CISO）和首席财务官（CFO）在不同的层面上进行沟通，例如：


    *   哪些资产正面临风险？

    *   这些资产的战略价值是什么？

    *   这些资产目前的漏洞水平如何？

    *   一旦发生泄露，后果是什么（财务损失、知识产权泄露、声誉风险）？


    为了确保网络安全不是事后才考虑的补救之举，CFO 在审查其他领导者提交的业务案例时，应该询问以下问题：


    *   新的[市场、内部技术、客户产品等]如何改变公司的攻击面？

    *   它如何改变公司最具战略性的资产的风险概况？

    *   [假设风险有所增加] 需要额外的投资（一次性和经常性的）才能将风险概况降至可接受的基准线？这笔投资是否包含在投资回报率（ROI）分析中？


    在`确保资源得到最高效利用的情况下，在以下领域要求 CISO 提供指标是非常公平的`：


    *   对于仍放在架上（闲置软件）的产品，投入了多少网络安全资金？

    *   部署这些产品的计划是什么？

    *   上一次确保安全产品配置妥的审计是什么时候做的？结果如何？

    *   上一次进行渗透测试是什么时候做的？结果如何？

    *   上一次对所有员工进行网络安全培训是什么时候做的？结果如何？


    接下来，作为采购领导者，`财务专业人员引导组织通过降低第三方风险来缓解关联性泄露`。从对所有第三方进行全面盘点开始（根据 Ponemon 的研究，只有 34%
    的组织表示他们拥有此类清单 9）。从那时，对网络安全防御和实践进行审计。坏消息是，这可能花费大量的精力和时间。好消息是同样的审计问题可以用于筛选任何想要成为供应商的新第三方。


    问题将集中在多个领域，以评估合作伙伴的网络安全状况，包括：


    *   查看第三方如何评估和更新访问权限和权利。

    *   了解他们的业务连续性流程以及测试频率。

    *   检查其变更控制指南，查看其系统的新用户和/或新软件。

    *   明确贵公司与他们之间传输的任何数据将如何被使用、保护以及在适当何时处置（在合同终止时和/或根据合规标准）。

    *   了解他们如何在各种状态下加密数据（静态、使用中和传输中数据）。

    *   评估他们如何对员工进行网络安全意识和卫生守则的培训。


    `对于你最具战略性的供应商，考虑每年聘请第三方审计一次他们的安全实践。` 筛选供应商是一个极好的第一步。但要确保他们在成为你的客户后，其安全实践不会变得松懈，这需要更加谨慎对待。


    最后，要小心你允许第三方宣传关于你公司的任何信息。合作伙伴发布新闻稿宣布他们的业务安排是常见做法。看到公司在自己的网站上到处展示所有客户、供应商和/或合作伙伴的
    Logo 也是正常现象。我是一个营销人员，所以我理解这一点。利用生态系统的力量为所有方增加品牌价值通常是一件好事。


    但要保持谨慎。任何想要宣传其与贵公司关系的第三方，都会向黑客揭露他们可能渗透贵公司的侧门和后门。这会向这些网络王国的寄生虫展示如何渗透你的公司，只要他们知道了与你共用一面墙的邻居。如果稍微担心某个想要宣传其与贵公司关系的第三方没有达到你要求的网络安全标准，`不要允许他们宣传`。


    这只是一个详尽清单的子集，旨在确保你的第三方在保护组织免受威胁方面像你一样遵守纪律。如果他们真心想赢得你的业务，他们难道不应该同样倾向于保护这笔业务吗？


    ***


    财务和网络安全的领域在表面上似乎并不契合。但深入观察会发现，它们的共同点比最初看起来的要多。从核心上说，网络犯罪是一门大生意——这是 CFO 能够理解的。反之，网络安全关乎风险管理——这是另一个财务人员非常熟悉的概念。CFO
    可以帮助 CISO 更流利地使用董事会语言（风险管理）。反之，CISO 可以帮助采购部门的人在筛选第三方时使用网络安全语言。当这两个职能部门汇合，赞赏彼此的相似性并搁弃差异时，双方都能在合作中变得更强大。毕竟，坏分子已经知道协作的价值了。难道不是是
    CFO 和 CISO 意识到同样的时候了吗？


    ## 注释


    1.  ^(1) McAfee，“网络犯罪的经济影响——并未放缓。”

    2.  ^(2) McAfee Labs 威胁报告, 2018 年 12 月, [`www.mcafee.com/enterprise/en-us/assets/reports/rp-quarterly-threats-dec-2018.pdf`](https://www.mcafee.com/enterprise/en-us/assets/reports/rp-quarterly-threats-dec-2018.pdf)。

    3.  ^(3) Alfred Ng, “WannaCry 失去了开关，因此出局”, CNET, 5 月, [`www.cnet.com/news/wannacry-loses-its-switch-so-out/`](https://www.cnet.com/news/wannacry-loses-its-switch-so-out/)

    4.  ^(4) Sean Ross, “蠕虫消失了 40 年，现在卷土重来”, 美国日报, [`www.usoday.com/story/nation-now/2017/06/21/bed-bugs-disappeared-40-years/`](https://www.usoday.com/story/nation-now/2017/06/21/bed-bugs-disappeared-40-years/)

    5.  ^(5) Korin Miller, “你可能患有蠕虫却不知道”, Self, 4 月 6 日, [`www.self.com/story/you-can-have-bed-bugs-and-not-know-it-heres-what-to-out/`](https://www.self.com/story/you-can-have-bed-bugs-and-not-know-it-heres-what-to-out/)

    6.  ^(6) Ponemon Institute, “第三方生态系统中的数据风险——年度报告”, 2018 年 11 月。

    7.  ^(7) Deloitte, “德勤 2016 年全球外包调查”, 2016, [`www2.deloitte.com/content/dam/Deloitte/nl/Documents/operations/deloitte-nl-s&o-global-outsourcing-survey.pdf`](https://www2.deloitte.com/content/dam/Deloitte/nl/Documents/operations/deloitte-nl-s&o-global-outsourcing-survey.pdf)

    8.  ^(8) EY 全球信息安全报告 2018–19, [`www.ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf`](https://www.ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf)

    9.  ^(9) Ponemon Institute, “第三方生态系统中的数据风险——年度报告”, 2018 年 11 月。

