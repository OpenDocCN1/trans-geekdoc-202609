    ## The Case of the Fremont Plant


    If you find this “partnership” between two rivals weird enough, the location they
    chose to set up bordered on the bizarre. The former GM plant in Fremont was an
    unmitigated disaster. Bruce Lee, who ran the western region for the United Auto
    Workers union at the time, called the Fremont employees “the worst workforce in
    the industry in the United States.”


    ## The 1984 Shift


    Their behavior was infamous in the industry—from record absenteeism to lewd acts
    on the factory floor to sabotaging cars for the chance to earn overtime to fix
    them. If conduct was any indicator, these employees hated their jobs and their
    employer.


    You may not find GM and Toyota’s decision to establish their new joint operation
    in a manufacturing facility that had bad history unusual. After all, why throw
    a baby out with the bathwater? The physical plant may have been completely acceptable.
    But the labor force needed changing—badly.


    But GM and Toyota didn’t change the employees. In fact, they hired 85 percent
    of that former Fremont workforce (described as the worst in America by one of
    their own union leaders) to tackle the challenge of producing a profitable and
    high-quality fuel-efficient automobile—something GM hadn’t accomplished in the
    best of its U.S. plants.


    Perhaps even more surprising, they flew some of those former Fremont employees
    to Japan to learn how to build cars the Japanese way. The first car, a yellow
    Chevrolet Nova, rolled off the assembly line in December of 1984. Almost right
    away, the Fremont plant was producing cars at the same speed and with as few defects
    per 100 vehicles as those produced in Japan.


    What exactly was it that allowed Toyota to produce the first quality small car
    for GM using virtually the same workforce that was so subpar under the GM regime?
    It wasn’t a secret sauce as much as it was a secret ingredient: continuous improvement.

