    Yet, that investment is no substitute for employees doing the right things and
    doing things right.


    ## The Best Defense


    Military history across millennia records that the best defense is a good offense.
    Which explains why George Washington included this time-tested military advice
    in his writings even in retirement, nearly a quarter century after he led a fledgling
    nation to victory in its War of Independence. It serves as sound instruction when
    competing against an opponent. Draw first blood, and your rival will be more distracted
    defending himself than attacking you. In sports, teams try to put the first points
    on the scoreboard to earn initial momentum in a game. In business, companies seek
    first-mover advantage in launching a new product or service to capture early market
    share.


    In cybersecurity, there’s no such thing as a “good offense” for a company. That’s
    because, by definition, companies aren’t the ones striking first. That would be
    the job of the adversary. Adversaries `always` get first-mover advantage. They
    apply the axiom that has served reputable categories so well. Our companies are
    destined to playing defense forever. In cybersecurity, the best defense is a good
    (if not great) `defense.`


    I mentioned earlier that I believe most employees want to help defend their organizations.
    They just don’t know how to play their role effectively.


    But let’s just say I’m wrong. Let’s assume, for a moment, you don’t have any altruistic
    motives toward your company. That’s not to say you wish your company harm. You
    wouldn’t intentionally throw your employer under a bus, for example. But maybe
    you’re the type who wouldn’t stand in front of a moving vehicle for your company
    either.


    That would put you in a category of apathetic bystander. You figure your company
    spends enough money on cybersecurity. They hire people to do the job of defense.
    If you aspired to do that line of work, you would have sought the degree and the
    job to do so. You didn’t. You’re working in another area of your company and you
    expect that the work of cybersecurity is (and should be) handled elsewhere. If
    your company does suffer a breach, assuming you’re not ultimately the one found
    responsible for it, then it really isn’t your problem. They’ll pay the fines and
    maybe lose some customers. But life and work will go on.


    If you find yourself in this category, you’re not alone. In fact, in McAfee’s
    online ethnography study of employees just like you, we heard similar sentiments
    offered when we asked the question:


    *   `What role do front-line workers play in maintaining cybersecurity in your
    organization? Do you think you play a key role or a background role?`

    *   Respondent 1: `I think I play a very small role in the cybersecurity of my
    company. I think it’s important for me to be aware of how I can help protect the
    company’s information, but the overall high-level security should be addressed
    by the higher-level employees in the company.`

    *   Respondent 2: `More of a background role, as our IT department handles all
    the behind-the-scenes cybersecurity.`

    *   Respondent 3: `I think I play a background role. The first line being the
    technology from our IT team, then our IT team themselves, and then the average
    worker.`


    It seems that at least some employees think cybersecurity is better left to the
    tools or teams within IT, if not escalated to the higher-ups at the company. Here’s
    the problem with both points of view.


    First, there aren’t enough cybersecurity personnel to throw at the problem (back
    to the cybersecurity talent shortage I mentioned in the previous chapter). Cybersecurity
    demands all hands on deck.


    And second, if you think the muckety-mucks at your company are the best suited
    to tackle the problem, don’t be so sure. Yes, the CEO and board have a responsibility
    to set a tone from the top that encompasses cybersecurity. But 60 percent of C-suite
    leaders and IT executives say the person directly responsible for information
    security is not a board member.^([3](#c03.xhtml#c3-note-0003))


    It’s understandable that a pass-the-buck mentality for cybersecurity is so rampant
    in organizations. The cybersecurity industry has coined a condition known as “breach
    fatigue.” It’s what happens when we allow the noise of breaches in our environment
    to deaden our sense of urgency to respond. We either believe someone else will
    eventually pay the price on our behalf (even though consumers ultimately bear
    the brunt of breaches through higher prices) or we surrender the control we truly
    have over our own destiny by assuming there’s nothing we can personally do about
    breaches to prevent them.


    This book attempts to resolve the latter perspective by giving you practical steps
    you can take to help your company prevent a breach. That’s about giving you `what`
    you can `do.` But if you find yourself in the former camp, let me take a moment
    to offer `why` you should `care.`


    A few weeks ago, I received an email from someone in our HR department. She forwarded
    an email she had received sent to her personal email account. It appeared to come
    from me. It asked that she reply with instructions on how to change my automatic
    payroll deposit. The sender’s email address came from a personal email account,
    presumably mine.


    Luckily, her spider senses kicked in, and she forwarded the email to my work address
    with a simple question:


    *   `Allison, I got this email today. Can you confirm you sent it?`


    It didn’t take me long to respond with an emphatic no. We reported the incident
    to our Security Operations Center (SOC). They traced the email and found that
    a hacker had compromised her personal email account.


    I’m certain that, if I were to look up the job description of that HR employee,
    it wouldn’t mention “cybersecurity” as a requirement or expectation. I’m willing
    to bet it wouldn’t contain language that demanded she be vigilant against cyber
    threats to employee identity as a core responsibility. Reaching out to me directly
    to confirm the email she received was legit wouldn’t have been in this individual’s
    “job description.” Yet, that’s exactly what she did, and I’m better for her sound
    judgment and concern. Her training stopped her from responding with copy-and-paste
    instructions from our intranet site explaining just how easy it is to change one’s
    direct deposit. I marvel at my fortune that her instincts made the job of that
    hacker a lot harder. And she saved me indeterminate hours of frustration in attempting
    to reverse a bad outcome. Crisis, for me, averted.


    Sometimes hackers are after more than our companies. Sometimes, they’re after
    us. Our employers have a wealth of information about each of us, including our
    social security numbers, our bank account details (as my direct-deposit example
    proves), and more. The most notable breach in recent history that targeted employee
    records happened to the U.S. government, when its Office of Personnel Management
    (OPM) was compromised in a breach of more than 21.5 million records. Among the
    plunder collected by adversaries? Extensive background information of individuals
    who may not even have been current or former employees.^([4](#c03.xhtml#c3-note-0004))

