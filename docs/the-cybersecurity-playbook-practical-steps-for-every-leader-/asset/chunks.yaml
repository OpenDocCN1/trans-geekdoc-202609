    在这里，另一个进入词汇表的网络安全术语——`botnet`（僵尸网络）派上了用场。通俗来说，`botnet` 是一个由黑客奴役的设备网络。由此产生的僵尸军团受一个或多个恶意攻击者的指挥和控制，这些攻击者征用无人机执行各种操作，包括通过向网站发送请求来发起分布式拒绝服务攻击（DDoS）。这些僵尸网络是如何受到它们的邪恶主人的控制的？这是通过在用户访问感染网站或下载受污染信息时，在计算机上植入恶意软件实现的。很多情况下，用户甚至不知道自己的设备已被夺取。


    你可能会想，针对 `Dyn` 的 DDoS 攻击究竟有何不同。所使用的 `botnet` 并不是计算机军队，甚至不是移动设备（正如你预期的那样，这些本是黑客僵尸军团的普通士兵）。相反，网络犯罪分子入侵了普通的连接家用设备。婴儿监视器、安全摄像头和数字视频录机（`DVRs`）都是攻宕
    `Dyn` 的 `botnet` 中的招募成员。黑客利用这些连接设备中薄弱的出厂默认密码来夺取控制权。没有任何用户需要先无意中下载恶意软件。在这种情况下，消费者没有做任何事情来损害自己的设备。事实证明，“什么都不做”恰恰就是问题所在，因为用户也没有想过更改设备的默认密码，认为普通用户本就知道如何这样做。


    在 `Dyn` 网络崩溃的瞬间，物联网（`IoT`）就变成了恐怖主义网络。而且，免得你认为 `Dyn` 攻击是一个偶然事件，请思考另一个更令人恐惧的现实：禁用
    `Dyn` 的 `botnet` 在事件发生几个几个月后，仍在积极为它的下一次攻击招募参与者。在一个始终在线的世界里，黑客拥有数十亿连接设备可以随意摆布，只需等待它们新领袖的下一个指令。


    `Dyn` DDoS 攻击让我们开眼，看到了一个新的现实：*目标已变成武器。* 我们过去要保护的东西，现在必须防范它们。正如数据可以被操纵来欺骗我们一样，那些在家里和工作中许多方面让我们生活便利的无害连接设备也可以被用来对付我们，破坏我们（以及它们）所依赖的数字基础设施。网络威胁现在已变得无处不在，它们潜伏在每一个连接设备、每一比特我们理所当然的数据中。


    `Dyn` 攻击证明了，创新的黑客可以在下一次攻击中利用任何连接产品或服务。当网络犯罪分子通过普通的家用电器溜入时，网络安全进入了产品开发的主流。


    以连接汽车为例。20017 年，`Toyota`、`Intel` 以及其他公司成立了汽车边缘计算联盟。该小组估计，到 2025 年，车辆与云之间的数据量将达到每月
    10 艾字节（exabytes）——比 2017 年的基准增加了 10,000 倍。这等同于自古以来人类说过的所有单词总量的两倍。


    将 `IoT` 武器化以攻击互联网是一回事，而将预计到 2025 年出现在道路上的 800 万辆自动汽车武器化，会让恐怖主义网络更加可怕。这些连接车辆将依赖准确的实时数据来评估周围环境并进行导航。它们将依赖于它们与云之间每月流动的
    10 艾字节数据——这些数据对于那些动力并非利润而是恐怖的黑客来说，将是一个真正的宝库。


    如果你认为你的公司不需要担心这些问题，因为你们不从事互联网骨干网或连接汽车业务，那么对手欢迎你对这一话题的漠不关心。但 `Dyn` 表明，你的公司可能只是简单地卷入黑客的交火中。`Dyn`
    并不是攻击的目标，它们支持的互联网服务才是。


    如果这仍然不能迫让你对我们所处的这个“奇妙新世界”产生不同的想法，请考虑一下：你有多少员工偶尔居家办公？现在根据 `Intel` 的数据，在 2016 年（即
    `Dyn` 攻击发生的年份），平均家庭有 10 台连接设备。这家半导体巨头当时预测，到 2020 年，每个家庭的数字将增加到 50 台连接设备。如果不加安全，这些设备可以作为黑客的潜在切入口，在你的员工居家办公时入侵他们。


    ## 给产品开发者的 W.I.S.D.O.M. 建议


    产品开发人员是将网络安全嵌入公司提供的每个产品或服务中的第一道防线。不需要在产品开发原则和清单上重新发明轮子（市场上的这类资源并不缺）。通过将网络安全概念整合到久经验证的设计方法中，开发人员在加强公司——以及用户——的网络安全防御方面发挥着至关重要的作用。


    首先，在设计的初始阶段，客户的投入是至关重要的。许多公司通过定量研究、一对一访谈、客户顾问委员会和/或其他方法主动向客户征求反馈。确保网络安全不是事后补救的一种简单而深刻的方法，是在这个发现阶段直截了当地询问客户关于他们的网络安全需求。


    假设你从事制造某种 [待填] 的连接家用设备业务（例如那些用于僵尸军团攻破 `Dyn` 的设备）。发现消费者何时可能采取行动更改出厂默认密码，将是设计阶段的一个重要元素。更好的办法是在这一阶段就消除消费者的拖延，例如，在安装连接设备时通过直观的应用程序更改密码，从而从源上消除一个关键的安全漏洞。


    现在，假设你从事软件开发。并假设消费者并不是你的目标。你面向企业进行营销。同样的原则也适用。在这种情况下，准确了解客户将如何安全地使用你的应用程序，可以避免日后修复漏洞。你的客户会依赖云端，还是他们禁止你的应用程序所依赖的数据进入云端？反之，你是否设计了一个运行在防火墙内的产品，结果却发现客户更倾向于软件即服务（SaaS）消费模式？

