  raw: 'Since we’re on the topic of software developers, here’s another one for you.
    Make sure security is part of any minimum viable product (MVP). When Eric Ries,
    author of *The Lean Startup*, popularized MVP, he captured the essence of what
    any startup endeavors to do: launch a new product that allows a development team
    to collect the maximum information on customer usage and acceptance with the least
    amount of effort. The process lends itself well to cloud-based applications that
    have very few upfront capital requirements (since many leverage public cloud infrastructure
    offered by AWS, Azure, and Google). Essentially, it allows for quick learning,
    fast iterations in product development, and a continuous feedback loop with customers.
    All good stuff—especially if it lets a start-up (or any company) avoid the costly
    mistake of launching a software product that fizzles in the market.


    Here’s the thing: Do not focus your attention so much on the word “minimum” in
    the moniker that you ignore the one right after it, “viable.” **Security must
    be built in, not bolted on**, whether for a product intended only for the early
    adopter or for the mass market. Security *must* be part of your minimum viable
    product requirements.


    Next, when designing the product, be deliberate about how, where, and for what
    amount of time your company will use customer data. There are regulations that
    will force your company to care about such matters, assuming it needs the extra
    motivation. So what I’m talking about here are not the mandated requirements issued
    by regulatory authorities. Instead, I’m referring to the ethical standards to
    which your company will hold itself accountable. To be clear, the higher of the
    two bars—the legal requirement or your company’s ethical principle—is the waterline
    on this test.


    For example, in the first chapter, I discussed a hacker’s defacement to McAfee’s
    company page on a popular social media platform. While there was no customer data
    in play with our event, it will help me paint the picture of what I mean on this
    point. Since there was no data stolen or any McAfee system compromised, McAfee
    was under no legal obligation to report the hack at all, let alone alert the media.


    But McAfee holds itself to a higher standard than the legal requirement. In this
    case, the social media pages of our employees were also defaced, along with McAfee’s
    company profile page, when the hacker exchanged our logo for a graphic image.
    That image showed up for several hours on the personal page for any employee who
    had McAfee listed on his profile. McAfee has a company value we uphold with employees:
    *We practice inclusive candor and transparency.* While the legal limit did not
    require any reporting on our part, our own company value demanded more.


    So the day after the hack occurred, we published a front-page intranet story admitting
    the same to all employees. We knew the risk was that a story that had not received
    any real media attention (given the attack occurred on an otherwise quiet Easter
    Sunday) could ignite on a Monday morning should *just one* employee send it to
    the media. Thankfully, that didn’t happen. In the end, it was a risk we had to
    take if we were to uphold a company value that exceeded our legal requirement.


    So **define your data requirements clearly and consciously in the design of any
    new product or service**—upholding the higher of either legal requirement or ethical
    standard. I’ll give you one more example to put a finer point on it. To date,
    one of the only U.S. regulators to issue explicit guidance on reporting a ransomware
    attack is the Department of Health and Human Services (this instance of regulatory
    guidance is an important step forward, especially considering that healthcare
    is a frequent target of ransomware; but, given that it stands in exceptional company,
    it’s also representative of why ransomware is likely much worse than the actual
    reported industry figures would have you believe). If your company has a similar
    value of transparency with customers and would require disclosure of a ransomware
    attack, then you will likely have a different point of view on how much risk you
    want to take in storing customer data, even if the law may be more permissive
    in this regard (that is, until the U.S. and other countries take the EU’s lead
    and revisit guidance associated with customer privacy).


    **Next, build security ownership into each phase of the product lifecycle.** How
    will your product or service be upgraded to address the next threat vector? What
    department is accountable for ongoing maintenance and patching? Who is accountable
    for handling incidents after a breach occurs? Where will budgets sit? You get
    the idea. Be explicit about swim lanes across the company and where and when security
    decisions must be made and resources allocated.


    The effort required to introduce a product can be simple when compared against
    that needed to maintain it. It’s only after the first customers adopt your creation
    that the inevitable issues of support, scalability, and—yes—security rear their
    ugly heads. By then, the warm-and-fuzzy feelings of your triumphant launch will
    be distant memories. Having clear ownership for these certainties established
    upfront, before your product ever reaches its first customer or user, will save
    time and mitigate risk down the road.


    It’s no different from the discipline you likely already practice when contemplating
    other key issues in the product lifecycle. In addition to signing off that support
    and scalability concerns have been planned for, the highest functional leader
    in the company for each department (such as customer support, engineering, or
    marketing) should also explicitly review and approve that the security requirements
    for her function have been sufficiently built into the product before it is introduced
    to market.


    Last, but certainly not least, you must **stop the line** should security be lacking
    or missing at any part of the product launch process. More importantly, you should
    actively encourage this stop-the-line philosophy for *any* employee engaged directly
    or indirectly in the development process. This is never easy to execute since
    time is money in business. But it’s harder still for companies that don’t have
    all workers concentrated in one physical location (like that Toyota plant in Fremont,
    with tangible cues in its environment, including the universal colors of red,
    yellow, or green that immediately and unmistakably communicated the current state
    of quality to all plant employees). Likewise, many companies don’t have a pull
    cord or button that employees can activate to immediately stop a line. There’s
    no physical production line where software is concerned, for example.


    In fact, if you’re like me, you work for an employer with a hybrid and distributed
    environment of company locations and remote employees. So you’ll need to be resourceful
    in using the virtual tools at your disposal to communicate when an employee has
    stopped the line. Companies are accustomed to lots of fanfare upon a product’s
    successful launch. It’s only natural to applaud such a milestone. While not losing
    a celebratory culture upon a product’s release, consider practicing the same level
    of recognition when an employee stops the production line due to a security flaw.'
