    员工会注意到公司中的奖励与认可。这是文化中极具可见性的一部分，它清晰地传达了高管理层认为什么重要（以及什么不重要）。当一名员工停止生产线时，请找个方法奖励她。然后，通过贵公司最常用的任何传播媒介公开认可她（这正是你们的人力资源和营销同事可以帮到你的地方）。关键在于，你要让员工知道，公司对安全的重视程度不亚于质量。当他们亲眼看到你如何改变并认可这一点的奖励与认可体系时，你会发现会有更多勤奋的员工在安全出现问题时站出来说话。这将保护你的公司免受未来潜在的财务、声誉或知识产权损失。


    ***


    公司从过去对待产品质量那种傲慢、草率的心态转变已经走了很远的路。受过教育的买家在做出可能让自己后悔的决定之前，可以轻松检查公司的质量记录。如今，公司深知优质体验的价值。他们通过客户满意度、净推荐值（NPS）和留存率来衡量它。他们在客户奖中竞争它，并在财务业绩中看到它的价值。


    网络安全是我们这一代的质量。就像此前的质量一样，它被低估、被忽视，或简单地没有衡量。我的一个老朋友经常说：“骨子里的东西终会体现在肉身上。”一家骨子里刻着强大网络安全基因的公司，将从更低的风险、更少的财务损失、更多的客户信任，以及是的，得益于产品在设计和制造时就兼顾了网络安全和质量，从而获得更高的质量。作为未来产品的梦想者和设计师，开发者在将网络安全嵌入我们消费的一切事物中，发挥着至关重要的作用。


    ## Notes


    1. ^(1) NPR, “The End of the Line for GM-Toyota Joint Venture,” 2010 年 3 月 26
    日, [`www.npr.org/templates/transcript/transcript.php?storyId=125229157`](https://www.npr.org/templates/transcript/transcript.php?storyId=125229157).


    2. ^(2) 同上。


    3. ^(3) David Kiley, “Goodbye, NUMMI: How a Plant Changed the Culture of Car-Making,”
    *《流行机械》(Popular Mechanics)**, 2010 年 4 月 2 日, [`www.popularmechanics.com/cars/a5514/4350856/`](https://www.popularmechanics.com/cars/a5514/4350856/).


    4. ^(4) Verlyn Klinkenborg, “Editorial Observer; Trying to Measure the Amount
    of Information That Humans Create,” *《纽约时报》(The New York Times)**, 2003 年 11 月
    12 日, [`www.nytimes.com/2003/11/12/opinion/editorial-observer-trying-measure-amount-information-that-humans-create.html`](https://www.nytimes.com/2003/11/12/opinion/editorial-observer-trying-measure-amount-information-that-humans-create.html).


    5. ^(5) Bretwell, “This Is How Many Autonomous Cars Will Be on Road,” TheStreet,
    2018 年 4 月 23 日, [`www.thestreet.com/technology/this-many-autonomous-cars-will-be-on-road`](https://www.thestreet.com/technology/this-many-autonomous-cars-will-be-on-road).


    6. ^(6) Shiladnis, “Households Connected Devices Now Rise,” CIO, 2016 年 8 月 19
    日, [`cio.economimes.com/news-of-things/households-connected-devices-will-rise`](https://cio.economimes.com/news-of-things/households-connected-devices-will-rise).


    # 第 5 章 弥合差距


    ## 当过好的东西也会变成坏事


    像许多公司一样，麦咖啡菲也有愿景、使命和价值观。我们的愿景反映了我们对行业和世界的追求。我们的使命指导战略。我们的价值观表达了我们是谁。但与许多公司不同的是，我们还有一份承诺。虽然我们的愿景、使命和价值观分别反映了我们的抱负、思考和行为，但我们的承诺提醒着我们的使命：


    > 我们致力于维护世界安全。


    > 威胁不再局限于计算机，而是渗透到世界的每一个角落。


    > 为了保护家庭、社区和国家安全，我们永不懈。


    你在全球任何麦咖啡菲所在地都能看到这些文字。除了承诺，我们的墙上还纪念了数千名员工履行该承诺的签名。对于其他远程办公员工（包括居家办公群体），他们可能在加入公司时就已经电子签署了这份承诺。


    这份承诺是麦咖啡菲经营业务的核心。我们从事的是网络安全业务。因此，安全成为公司的生命线是理所当然的。尽管如此，我们无法不受那些想要伤害我们的对手的影响。没有公司可以例外。


    但是，你的公司——一家可能不是网络安全核心业务的公司——如何培养出将安全嵌入到组织结构中的文化呢？虽然我无法预见到你们未来的墙上会挂满致力于维护世界安全的员工照片，但有很多领域是贵公司关注的，可以让网络安全成为你们文化中有意义的组成部分。


    你的公司和文化很可能从大量的网络安全意识中获益。毫无疑问，当更多公司采用安全文化时，好人与坏人之间持续的网络安全战将将向好人倾斜。


    由于我们的人力资源专业人士是我们中致力于组织健康的专家，也是维持这种文化的推动者，因此我将本章献给他们。虽然他们并不是专门负责公司文化，但除了首席执行官之外，他们对文化的影响力比任何其他人都要大。他们通过创造吸引和留住卓越人才的环境来激励我们，这一点我在麦咖啡菲亲眼目睹过一位富有远见的首席人力资源官如何将影响力扩展到其触及之外。而且在参与网络安全解决方案方面，他们提供的贡献比他们想象的要多得多。

