- fmt: "\nI tell you this story not just because it’s interesting, and not just so\
    \ you feel “Hey, better her than me!” I began with this story because it’s a microcosm\
    \ of what we’re going to be talking about for the rest of the book.\n\nJust so\
    \ you get your money’s worth from this book—in the very first chapter—I’ll now\
    \ break down how the hack happened, and what we did afterward. Most importantly\
    \ I will lay out the steps that you can take tomorrow morning at work to see that\
    \ this does not happen to you.\n\n## Lessons Learned the Hard Way\n\nWhen we regained\
    \ control of the account, we asked the social media company to tell us whose admin\
    \ account in our dashboard had been responsible for the changes. \n\nTurns out\
    \ it was an employee with one of our media placement agencies, who was no longer\
    \ doing work for us—let’s call her Julie. Her credentials were stolen by a teenager\
    \ connected to a larger cybercrime syndicate. Julie made the mistake so many others\
    \ make: She didn’t practice good password hygiene. She used the same password\
    \ to access multiple accounts, including her profile on this social media platform.\
    \ And, since she was an authorized administrator for McAfee’s corporate page on\
    \ the same site, her personal credentials gave her access to not only her profile,\
    \ but ours as well. When one of her accounts was compromised and her credentials\
    \ traded on the Dark Web, hackers simply tried the password across her other online\
    \ accounts. That’s when they struck pay dirt in breaking Julie’s administrative\
    \ access to McAfee’s company profile on the social media platform. The rest was\
    \ child’s play.\n\nHindsight is 20/20 and this case was no exception. Vulnerability\
    \ number one: `Julie used the same password for access` to her social media account\
    \ (and our corporate page on the same social media platform as one of our authorized\
    \ administrators) as she used for other accounts. If she had used unique passwords,\
    \ then the credentials that bad actors bought on the Dark Web would have been\
    \ worthless. What’s worse? When alerted to the hack on her personal account, Julie\
    \ quickly changed her password. But she failed to change it across her other accounts,\
    \ including the one in this story. That’s on her.\n\nVulnerability number two:\
    \ `We should have required multifactor authentication for all admins` on that\
    \ social media site. What this means is you can gain access to a system not only\
    \ if you have the correct password, but you must also be able to enter a one-time\
    \ code that’s generated and sent to, say, your phone. If you don’t have the code\
    \ within a few seconds or minutes of being asked for it, you’re not getting in.\
    \ There are several versions of this type of authentication and I’m simplifying\
    \ it here, but you get the idea. That’s on us.\n\nVulnerability number three:\
    \ `We did not do a review frequently enough to see who no longer needed access`\
    \ to our account. Julie helped us a while ago, but we should have removed her\
    \ from being an admin after her activity had ended. We still could have been hacked\
    \ while she was actively working with us, but our lack of access hygiene just\
    \ made it worse. That’s definitely on us.\n\nAll of these actions would have vastly\
    \ reduced the chances of the hack occurring. But let’s say for some crazy reason\
    \ a hacker with enough motivation, skill, and luck was able to get into our social\
    \ media account. Let’s look at what could have helped us after a hack was discovered,\
    \ had we put certain things into place beforehand.\n\nWe should have had a `procedure\
    \ where we lock out all admins without letting on that we are aware of the attack`.\
    \ By our deleting the nonsense posts, we alerted the hacker. Then when the hacker\
    \ saw we were deleting permissions, he acted more quickly than we did.\n\nIt was\
    \ fortunate that Gavin was on the defaced page on Easter Sunday. Otherwise we\
    \ may not have known as quickly about the defacement. Now we have a tool that\
    \ uses machine learning to detect unusual images, profanity, slurs, and other\
    \ anomalous material on social media sites. It immediately alerts several members\
    \ of our team in the event it detects such unusual activity.\n\n*Note:* I’m not\
    \ going to name the tools we use for two reasons: First, tools come and go, and\
    \ they also tend to have different effectiveness at different times. In other\
    \ words, when a tool is first launched, it may be highly effective—until hackers\
    \ figure a way around it. Because I don’t know when you’re reading this book,\
    \ I don’t want to praise something that I may no longer be using when you’re actually\
    \ reading these words.\n\nThe second reason for not mentioning the tool is McAfee\
    \ already is a huge bullseye. Back to the story of lessons learned:\n\nAt the\
    \ time we alerted the social media company of the hack, we did not know their\
    \ procedures for dealing with it. Mistake. We found out only then that their policy\
    \ was to freeze the account for many hours.\n\nWe learned the hard way that money\
    \ talks. We now ask about these procedures in advance because we were spending\
    \ a decent amount of money on advertising on this site via agencies, we looked\
    \ like a smaller account than we were. Today, `we spend directly with social media\
    \ platforms` to lessen that threat.\n\nWe learned that `third-party companies\
    \ with which we do business may not have security practices`. Because we were\
    \ spending on tools, we help to accurately reflect our investment and receive\
    \ the commensurate service we deserve.\n\nAnd, we learned that `third-party companies\
    \ with which you have relationship may not have`. This is especially important\
    \ to remember for companies that have access to your systems or appear as an extension\
    \ of your organization. In particular, smaller third-party companies with which\
    \ you have not have formal IT and security teams, let alone rigorous cybersecurity.\n\
    \nFinally, the postmortem of that Easter’s unfortunate events delivered one final\
    \ punch in the gut. McAfee wasn’t even a deliberate target in the hack. The hacker\
    \ didn’t realize Julie was an administrator when he broke her credentials. He\
    \ didn’t know (or care) who Julie was. He was on the hunt for passwords. His reward\
    \ would come only after he determined what the password unlocked—be it a personal\
    \ banking account, a company’s network, or something else. Once he found one that\
    \ just happened to unlock the keys to McAfee’s company page on that social network,\
    \ he unleashed his rants of abuse on it, offending everyone he could and humiliating\
    \ us in the process. *Even for hackers, sometimes it’s better to be lucky than\
    \ good.*\n\n## Additional Lessons for You\n\n- **Have lists of people you can\
    \ call and people to whom you can escalate.** Have them where you and your team\
