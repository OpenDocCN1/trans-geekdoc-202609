    如果这仍然不足以说服你关注，那么看看这个：数据泄露对贵公司而言的风险从未如今日这般高。这归功于监管机构的不断施压，以激励公司保护客户数据。《通用数据保护条例》（`GDPR`）适用于所有在欧盟（EU）开展业务或监控其境内数据主体活动的所有公司。如果被发现不符合
    `GDPR` 关于收集和保护客户数据的标准，公司可能会损失全球年收入的达 4%。2018 年，Ponemon 报告显示数据泄露的平均成本为 386 万美元——而这很大程度上是在
    `GDPR` 实施之前得出的结果。(5) 任何在欧盟开展业务且全球年收入超过 1 亿美元的公司，已经可以预见到，为违反 `GDPR` 的泄露事件将支付更多费用——取决于其收入情况，可能会要多得多。


    数据泄露的风险是巨大的。数据泄露的成本甚至更高。不要因为贵公司过去可能幸免于之前的泄露，就假设它能从下一次泄露中幸存。即使它生存了下来，财务压力也可能导致其他后果，甚至可导致裁员。如果你倾向于保留现有工作并看到公司持续经营，你必须假设将网络安全视为你工作描述的一部分。敌人最喜欢看到你表现出极度的冷漠。


    ## 员工的 W.I.S.D.O.M. 指南


    根据威信电信的《2018 年数据泄露调查报告》（`DBIR`），员工直接或间接负责了所有泄露的四分之一以上。在超过 60% 的案例中，责任源于一名疏忽的员工。这意味着近
    20% 的泄露都是源于疏职员工之手。(6) 这就是员工一直是公司网络安全防御中最强或最薄弱的环节之一。


    幸运的是，员工可以采取许多步骤成为网络安全解决方案的一部分，而不是问题所在。首先，要对社交工程诈骗保持警惕。网络犯罪知道如何利用员工的信任。而且他们的方法正变得更好。鱼叉式钓鱼（Spear
    phishing）是一种通过恶意通信（如电子邮件）专门针对某些个人或公司的战术。与传统的钓鱼（网络犯罪分子使用的更多是“撒网式”策略，换句话说，几乎或完全没有针对性）相比，鱼叉式钓鱼活动有效得多，因为犯罪分子会极力对信息进行个性化。


    大鲸钓鱼（Whaling）是鱼叉式钓鱼的一种类型，对手伪装成公司的高层高管（如 `CEO` 或 `CFO`），并要求毫无防备的员工采取行动。例如，伪装成 `CFO`
    的犯罪分子可能针对财务部门的基层员工，要求其将公司资金转入某个账户。


    社交工程是敌人针对天真员工最有效的武器之一。根据威信电信的 `DBIR`，4% 的人会点击任何特定的钓鱼活动。可能最令人惊讶的是，这些受害者并不倾向于从错误中吸教训。某人点击的钓鱼邮件越多，他再次点击的可能性就越大。(7)


    社交工程在组织的多个层面都非常有效。2018 年，《福布斯》（`Forbes`）报告称，虽然 `CEO` 和 `CFO` 经常成为目标，但许多钓鱼攻击是针对普通员工设计的。网络世界日益变成一场变装舞会，充满了互联网所承诺的所有魔力和光彩。但随着时间的推移，这场派对变得越来越拥挤，充斥着伪装日益复杂的钓鱼等威胁。你对这种威胁的警惕性也必须随着时间的推移而增加。


