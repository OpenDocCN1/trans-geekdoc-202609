  raw: "McAfee’s own analysis of WannaCry revealed that it barely qualified as ransomware\
    \ at all. Its authors left it with rather crude monetization capabilities. They\
    \ didn’t connect a victim’s unique identification to his bitcoin payment, making\
    \ decryption of files extremely difficult. So what was WannaCry really? Ransomware?\
    \ Worm? Both.\n\nIn 2018, hacker ingenuity was again on full display with the\
    \ release of Zyklon. Zyklon was a fully featured package of threats for enterprising\
    \ criminals to exploit—it could steal passwords, launch DDoS attacks, mine cryptocurrency,\
    \ and more. What really was Zyklon? Cryptojacking? DDoS? Keylogging? All of the\
    \ above.\n\nAs WannaCry and Zyklon show, hackers not only cooperate in specialty,\
    \ but they collaborate to create new concoctions of converged threats. They’re\
    \ mixing old varieties (like worms) with new ones (like ransomware). In McAfee’s\
    \ analysis of underground forums, we see cybercriminals discussing vulnerabilities,\
    \ both old and new. The results are sophisticated threats capable of contagion\
    \ much faster than ever before.\n\nBack to our conversation between the CFO and\
    \ CISO. When the CISO approaches the CFO for more money, it’s usually because\
    \ of this reality. Even mid-cycle, long after budgets have been allocated, the\
    \ CISO may need more. WannaCry didn’t wait for a convenient fiscal period end\
    \ to wreak its havoc. Bad actors don’t care about your budget cycle.\n\nIf ROI\
    \ isn’t the right metric for cybersecurity, then what is? Risk management. Cybersecurity\
    \ professionals are in the risk management business. Sure, they have technical\
    \ expertise and scores of products in use to defend their companies against highly\
    \ organized crime syndicates. But take that technical jargon out of the field\
    \ and it really comes down to one clear business objective—mitigate the company’s\
    \ risk.\n\nAs CFOs know, risk management and its associated metrics fundamentally\
    \ differ from the more traditional finance measure of ROI. I live in North Texas,\
    \ part of a region of the country that has earned the unfortunate colloquialism\
    \ “Tornado Alley.” To this day, I have a healthy fear of tornadoes. Blame it on\
    \ the tornado sirens that are tested the first Wednesday of every month at noon.\
    \ The chilling sound is straight from a war movie. Or chalk it up to Dorothy and\
    \ her trip to Oz by conveyance of a tornado, the thought of which freaked me out\
    \ as a child. Either way, I fear tornadoes. But every spring in North Texas, they\
    \ are a persistent threat to me and my otherwise peaceful existence.\n\nUntil\
    \ I was educated on just how unfounded my fears are. McAfee’s chief technical\
    \ officer (CTO) relocated to the Dallas area last year. He immediately was schooled\
    \ on tornadoes by nervous colleagues and long-time Texans like me. However, unlike\
    \ me, he decided to do his own research rather than succumb to the hype. He discovered\
    \ that, in 69 years of tracking, there has been only *one* F3 or higher tornado\
    \ in my county (this is a tornado capable of causing severe to incredible damage).\n\
    \nNow, let’s go back to our risk management discussion. Does your finance team\
    \ inspect the ROI of tornado shelter signs posted clearly on your company’s campus,\
    \ particularly one like mine that happens to reside in “Tornado Alley”? Likely\
    \ not. Even if you examined the risk of losing these signs altogether, you might\
    \ find the data supports such reckless abandon (the tracking our CTO found for\
    \ my county would suggest a deadly tornado is a very unlikely event indeed).\n\
    \nEven if there is only one catastrophic tornado in 69 years, there’s still a\
    \ risk. Should that risk materialize, foregoing visible and sensible signage to\
    \ save a few dollars may prove to be a costly decision.\n\nCybersecurity is in\
    \ the same boat. While CISOs must address volumes of threats each day (which likely\
    \ won’t cause cataclysmic damage but may disrupt the business nonetheless), they\
    \ must also consider the catastrophic (albeit far less likely) risk inherent in\
    \ a major-scale attack that could incapacitate their company for some time. They’re\
    \ walking the risk tightrope every minute of every day.\n\nIf CFOs can begin the\
    \ discourse a bit differently with CISOs, they can help build the bridge from\
    \ cybersecurity to risk management. Imagine that earlier conversation a bit differently:\n\
    \n**CFO:**\n\n: Why do we need to buy this new security widget? What are we attempting\
    \ to secure? \n\n**CISO:**\n\n:  It secures our \\[fill-in-the-blank\\] asset,\
    \ which we’ve identified as a highly strategic resource for the company. \n\n\
    **CFO:**\n\n: But how do you know that asset is at risk? \n\n**CISO:**\n\n: We\
    \ know of a vulnerability that attackers could exploit. \n\n**CFO:**\n\n: What’s\
    \ our risk if we don’t do something? \n\n**CISO:**\n\n: Given that it’s a high-risk\
    \ asset, the consequences of a breach would mean \\[disruption to our business,\
    \ fines up to $x million, customer safety recalls, shutdown of critical systems\
    \ or sites, etc.\\]. \n\n**CFO:** \n\n: Let’s double-click on that consequence\
    \ a bit more. Tell me what our \\[financial, legal, intellectual property, and/or\
    \ reputational\\] exposure looks like. \n\nSimply by framing the conversation\
    \ differently, CFOs can assist their CISO partners in translating cybersecurity\
    \ investments into business outcomes—all while losing the technical jargon and\
    \ eye charts of cybersecurity metrics that most CFOs likely won’t miss. It starts\
    \ with asking the right questions.\n\nThose same questions prove fruitful for\
    \ other business decisions governed by Finance’s tried-and-true ROI metric. Most\
    \ profit-seeking companies are in the business of growth. Because of this, there\
    \ are pressures to enter new markets, expand with new products, enhance productivity\
    \ with new technologies, and the like. Many of these business cases hold up to\
    \ the ROI litmus test. But how often are they searched for their impact on the\
    \ company’s risk profile, particularly by expanding the attack surface for adversaries\
    \ to exploit?\n\nCFOs can help their organizations ask these risk-related questions\
    \ whenever a new business case crosses their desks:\n\n*   How does the new \\\
    [market, internal technology, customer product, etc.\\] change the attack surface\
    \ for the company?\n\n*   How does it alter the risk profile of the company’s\
    \ most strategic assets?\n\n*   \\[Assuming risk is increased\\] What additional\
    \ investment is required (one-time and recurring) to bring the risk profile to\
    \ its acceptable baseline? Is this investment included in the ROI analysis?\n\n\
    By asking these questions of their non-cybersecurity counterparts, CFOs and their\
    \ teams can ensure cybersecurity is not an aftermarket afterthought of the strategic\
    \ growth initiatives for their companies.\n\n## . . . the More They Stay the Same\n\
    \nThey hide during the day to feed at night. They look for a blood meal to survive,\
    \ snacking on their victim while he sleeps, since they abhor movement. They are\
    \ fast movers, generally covering three to four feet per minute–when scaled, the\
    \ equivalent to an average adult’s sprinting pace. Yes, bed bugs are having quite\
    \ the resurgence around the world.^([4](#c07.xhtml#c7-note-0004))\n\nThese miniscule\
    \ predators were all but vanquished following World War II, thanks to fastidious\
    \ household hygiene and aggressive pesticides that banished them into virtual\
    \ extinction. In recent years, they’ve been making a comeback. It turns out a\
    \ strain of bed bugs, highly resistant to those initial harsh pesticides, has\
    \ entered the insect kingdom. Couple that with an influx of global travelers who\
    \ serve as unwitting carriers for these repulsive hitchhikers and you have a bed-bug\
    \ epidemic once again sweeping the world."
