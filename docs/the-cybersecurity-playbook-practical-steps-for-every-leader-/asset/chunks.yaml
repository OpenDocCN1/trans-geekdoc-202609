    can disorient cybersecurity professionals. They can slam these first responders
    with a rash of false positives, perhaps deadening their sense of urgency to respond
    in the process (in much the same way nuisance fire alarms have been shown to do
    in multi-tenant buildings^([13](#c08.xhtml#c8-note-0013)) ). Then, when the adversary
    is confident her victim’s shields have been lowered, she wages her real assault.


    AI, like any technology, is a weapon in both your company’s cybersecurity arsenal
    and your enemies’ arsenals. It doesn’t mean we should avoid AI. Rather, we need
    to understand its potential and limitations.


    For example, there’s no avoiding the talent shortage. On one hand, AI allows cybersecurity
    defenders to address more threats by delegating to machines tasks that would otherwise
    require human intervention. That said, AI will also increase false positives and
    is subject to adversarial poisoning. If either of these possibilities is left
    unattended, AI will sap some of the productivity gains it created in the first
    place. Threats come in all varieties. Defenses must do the same. This problem
    requires teaming humans with machines. It also requires pairing various threat
    detection models—artificial intelligence and signature-based—to maximize efficacy
    and minimize the occurrence of false positives.'
