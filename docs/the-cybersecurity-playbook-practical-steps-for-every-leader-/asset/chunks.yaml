    首先，与 `CISO` 协作，识别对公司最有价值资产访问权限最大的员工。你的 `CISO` 应该已经针对组织最珍贵的资产建立了一套风险分类法并与其价值进行映射，无论是知识产权、制造设施、敏感数据库还是其他东西。定义对这些贵资产拥有特权访问权限的员工范围。与招聘经理和你的安全组织确定，这些员工为了有效完成工作需要什么级别的访问权限。定期审查员工列表，以确保没有因职位变动而需要调整权限。在进行绩效评估期间，列出一份可能存在离职风险的员工名单，并与拥有特权访问权限的员工进行对比，确保
    `Legal` 部门正在处理尊重员工隐私问题的流程。通过定期建立和监控员工访问权限，你可以保护公司免受那些不再需要增强权限（或可能从就不需要）的人的侵害。


    请注意，访问卫生不仅保护你的公司免受恶意内部人员的影响，还能防止恶意外部人员。如果 McAfee 执行了这一处方，我们会在一名代理员工停止为我们工作时，就取消她（本质上是我们团队的扩展内部人员）对我们社交媒体页面的管理员权限。这样做，我们就能避免我在第一章中描述的那个黑客攻击。


    接下来，在你的奖励和认可计划中，为举报者留出一席之地。这超越了保护和激励这些人的政府计划。建立一个机密计划，让员工可以在其中报告可疑行为。显然，这是一条微妙的界限，因为你不想在员工之间营造一种不信任的公司文化。但如果你允许员工在看到不对劲的事情时发声，你就可以集结你最强大的武器之一——你自己的员工——来识别违规员工。


    案例：不久前，McAfee 重新调整了投资领域，以更贴近客户需求和市场情况。对于公司来说，这些决策并不容易，特别是当它们影响到员工时，本例正是如此。


    我收到团队一名经理发来的邮件，他转发了其中一名员工发给他的邮件。在邮件中，该员工向经理寻求帮助。我们听到其中一名受影响的员工在打一个似乎可疑的电话。在电话中，该员工表示，既然他们已经被“辞雇”了，他们就可以揭露
    McAfee 最近几个月一直在忙什么。（我应该提到，该员工对即将发布的产品非常了解。）


    听到这段对话后，我们担心的员工决定最好给经理发一封邮件，准确陈述所说的话。因为这样，我们能够通过提醒离职员工保密要求来干预（同时在此过程中没有暴露举报者）。我们还能做出其他决策，加速或以其他方式更改相关产品的原始发布计划。


    由于离职员工没有使用公司系统来传递或外泄信息，这种威胁将无法被 McAfee 的网络安全团队发现。只有一名员工偷听了电话，，并且没有义务报告它。但那个人报告了。我无法更好地表达我的感激之情，感谢我们自己的人为公司着想。**寻找一种机密、无威胁的方式，让尽职的员工在看到可疑情况时进行举报或举旗警告。当他们这样做时，给予适当的奖励。**


    最后，检查你公司的关键绩效指标 (`KPIs`)，以找到与网络安全相关的指标。至少，`每个成员`都应该参与其中。这不仅仅是 IT 部门的任务，而是一项共同责任。每位员工在维护组织安全态方面都发挥着作用。

