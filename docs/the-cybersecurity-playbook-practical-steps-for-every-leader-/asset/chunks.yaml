- fmt: '

    Finally, there’s no substitute for strong hygiene when it comes to cybersecurity
    defense. Sometimes the most effective measures are also the easiest to take. There’s
    probably no better example of this than one from the healthcare industry. In the
    nineteenth century, Hungarian doctor Ignaz Semmelweis sought to solve a mystery.
    He wanted to know why so many women in maternity wards were dying of fever after
    childbirth. In particular, he noticed the death rate was significantly higher
    in wards tended by all-male doctors versus those served by all-female midwives.
    After lots of experimentation, including changing the position of the women during
    childbirth and even asking priests to avoid walking past survivors in the ward
    when paying respect to a recently deceased mother (lest these priests actually
    frighten the other mothers into a fatal fever with their very presence!), Semmelweis
    had his answer.


    It turns out that the male doctors performed autopsies. The female midwives did
    not. Following an autopsy, the same male doctor may deliver a baby, in the process
    infecting the mother with cadaverous particles from the corpse he had dissected.
    Semmelweis insisted these male doctors cleanse their hands and instruments with
    a chlorine solution, beyond simple soap-and-water, to completely remove any cadaver
    particles from their hands. He didn’t have any knowledge of chlorine as a disinfectant.
    He just knew it would be highly effective at removing the objectionable odor associated
    with remnants of cadavers on physicians’ hands and their instruments. While the
    discovery of germs was still several decades away, Semmelweis’s new protocol was
    smart medicine, nonetheless. The death rate from childbed fever among women in
    the male-attended ward subsided as a result. Lucky for us, his accidental discovery
    paved the way for decreased mortality rates in medicine.


    Even today, hand washing remains one of the most powerful tools in public health—from
    preventing infections in surgery to avoiding the flu. It requires discipline,
    for sure. But it takes only a few seconds (for the bathroom visitor) to a few
    minutes (for the surgical professional) to effectively inoculate ourselves from
    a host of bacterial and viral enemies in our environments.


    Taking a page from our healthcare professionals, employees can practice commonsense
    hygiene to protect their companies from a wide variety of adversarial threats.
    Ever allow a website to automatically save passwords or use your mobile or laptop
    device to store them? Don’t. In just one case I can give you, an employee was
    using her mobile device to store all her passwords, including the one for her
    `O365` email account. A cybercriminal hacked her mobile device and stole the `O365`
    credentials. The now-compromised credentials were used to access her `O365` account,
    with the hacker sending phishing emails, appearing to come as legitimate emails
    from this employee, to a host of executives and other employees in her `O365`
    address book. Credential theft is particularly difficult to detect by an organization.
    After all, the access to the employee’s `O365` account looked legitimate, for
    all intents and purposes. It wasn’t until diligent employees—the recipients of
    the attacker’s email campaign—sounded the alarm that the threat was detected and
    contained.


    I understand password management is difficult. Our brains weren’t wired to remember
    hundreds of passwords across various devices, sites, and applications. To make
    matters worse, proper cybersecurity hygiene requires that you change those passwords
    regularly, making retention of them all the more difficult.


    There are tools on the market such as password managers to help you generate and
    retrieve complex passwords. If a tool isn’t desirable, you’ll need to use mnemonic
    tricks to help your memory. Things like finding a memorable phrase (`Jack and
    Jill went up the hill to fetch a pail of water`), using the first letter of each
    (`JaJwuthtfapow`), using a combination of uppercase and lowercase letters and
    symbols (`J@Jwuthtf@pow`) and adding a number for good measure (`J@Jwuth2f@pow`).
    According to site `HowSecureIsMyPassword.net`, the password I just created would
    take a computer about *three million years* to crack.


    Password management is essential to sound cybersecurity hygiene. Unfortunately,
    it’s not practiced nearly as much as it should be. As recently as 2018 in one
    state, the number of government officials using `Password123` as their password
    was nearly 1,500. Talk about making the job of a hacker even easier!


    Next, be as mindful of your physical security as you are about online security.
    As I mentioned in the last chapter, the worlds of physical and cyber security
    are increasingly converging. Not only are cybercriminals targeting physical infrastructure
    in their attacks (including power grids and manufacturing facilities), but compromised
    employee devices are an on-ramp to company systems for cybercriminals.


    One of the most notable nation-state attacks in history, `Stuxnet`, occurred through
    a compromised USB device. A USB device allowed the U.S. government to stall the
    nuclearization of Iran by giving the former access to Iranian nuclear centrifuges.
    As I continue to say, a cyberattack doesn’t have to rely on next-generation technologies
    to be effective.


    So you’re not the type to work in a nuclear facility? Chances are you at least
    have a computer you use for work. If you’re like 25 percent of U.S. employees,
    you leave that computer on and unlocked when you go home at the end of the day.
    That’s tantamount to not washing your hands after using the restroom!


    Last, but not least, use your company’s virtual private network (`VPN`) whenever
    accessing or transmitting sensitive data. Public `WiFi` networks are cesspools
    for enterprising criminals. Cybersecurity hygiene in this area is weak—even among
    cybersecurity professionals! At the industry’s largest annual event, `RSA`, which
    draws more than 40,000 cybersecurity professionals each year, self-professed hacker
    `@Grifter801` tweeted that he had collected more than 33,500 non-encrypted passwords
    in roughly 26 hours of the show’s debut. The seductive siren song of public `WiFi`
    is a powerful force, irresistible to even the most trained cybersecurity professionals
    among us.

