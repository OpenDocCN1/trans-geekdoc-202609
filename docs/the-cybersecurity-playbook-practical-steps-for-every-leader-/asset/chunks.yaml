    从我的第一次飞行到现在，我已经走了多远。那时我是一个 20 岁的 `INROADS` 实习生，那是一个为开启我美国职场生涯的非营利组织。当时我正和朋友以及实习生们一起从坦帕前往亚特兰大，参加一次特殊的
    `INROADS` 训练营。我登上飞机，坐在`way`靠后的位置——就在洗手间旁边，我觉得这运气非常好，因为如果上厕所的话，我离厕所格外近。多么方便啊！


    当空乘员进行我耳朵第一次听到的安全演示时，我很尽职地开始扣安全带。但安全带没有扣上。在几次尝试失败并向旁边的乘客寻求帮助后，结果显而易见：我的安全带坏了。我记得当时心里想：“噢，好吧。安全带算是可选的，就像校车上的安全带一样。”我没有多想就提这件事。空乘员也没有多看一眼来确认我是否已经系好。


    当然，在空中飞行了数百万英里后，我知道断掉的安全带是件多么严重的问题。今天，如果没有一条合适且牢固系在腰间的安全带，我甚至不会考虑在跑道上滑行，更不用离开地面了。（顺带一句，我首航乘坐的那家航空公司最终倒闭了。其最终终结的核心原因？严重的安全问题。）


    现在我知道飞机上和机场里的安全是什么样子、什么感觉了。我非常清楚那些确保我作为乘客一项首要权利——安全体验的庞大基础设施。这并不是说飞机不会坠毁。但同时，我不必接受任何低于航空旅行中严格执行的安全标准的待遇——是的，一条有效的安全带完全列入此清单。


    航空旅行之所以仍然是最安全的交通方式，是有原因的——它比汽车安全 100 倍以上。(2) 一种安全文化渗透了航空业的每一个方面。


    这句话听起来可能让你觉得并不寻常。你可能认为安全应该是航空旅行的核心。毕竟，这个行业存在的目的是将宝贵的货物——在这种情况下，是人命——从一个地方运到另一个地方。你只对了一部分。事实上，安全感已深植于航空旅行肌理中的常态化，掩盖了它在行业初创几乎不存在的起点。


    当我们回想起过去美好的飞行时光时，脑海中会浮现出这样的画面：穿着时尚的乘客，受到服务意识强的空乘的侍奉，在腿部空间宽敞的豪华轮上，在友好的天空中享用高级烹饪。这种怀旧的画面缺乏了对当时飞行危险性的任何现实。由于当时完全没有所谓的“安全文化”，乘客的死亡率几乎是今天的平均水平四倍^(3)。请看看乘客在商业航空运输历史上曾某个时刻面临的安全问题“检查清单”：


    1.  由于在恶劣天气下飞行或降落飞机的技术不尽如人意，空中碰撞和致命性着陆要常见得多。

    2.  发动机掉落的情况非常频繁，以至于只要另一台发动机能让飞机及时着陆，这些事件甚至不会被记录为事故。

    3.  劣质的安全带设计和较低的客舱天花板意味着，剧烈的气流不仅会让午餐飞出去——它可能导致颈骨折断。

    4.  谈到气流。在过去那些缺乏加压客舱（无法在更高、更安全、更舒适的高度飞行）的飞机上，气流要常见得多。

    5.  对于脚不稳的乘客来说，去飞机洗手间是危险的。稍一绊倒，你可能会发现自己落在椅子或桌子的尖锐边缘上，这是环境中另一个导致受伤或死亡的危险因素。

    6.  隔头等舱和经济舱乘客的玻璃隔板很美观。但在事故或气流中，它们也会破碎并将碎片溅到顾客身上。

    7.  你可以在飞机上点烟。二手烟增加了机上的氛围。

    8.  如果由于香烟、线路故障或未经批准的货物（如化学氧气发生器——是的，这真的发生过）导致火灾，机上既没有烟雾探测器也没有灭火器来提供警告或解决办法。

    9.  把身份证忘在家里了？不用担心。登机不需要身份证。

    10. 即使当身份证成为要求时，票上的名字和身份证明也不需要一致。

    11. 携带武器上飞机？空乘甚至可能帮你把它存放在行李架架内以妥善保存。^(4)

    12. 国内航班对托运行李没有安检检查。

    13. 国际航班——`有时`。

    14. 盒刀、编织针、剪刀和棒球棒？飞机上广受欢迎的配件。

    15. 越多越好。

    16. 参观驾驶舱对幸运的乘客来说是一种享受。你甚至可能在过程中获得“机翼”勋章。

    17. 在参观驾驶舱时，你会遇到一位飞行经验仅为如今执勤人员要求的六分之一的飞行员^(5)

    18. 那位飞行员还可能感到疲劳，这归功于对强制休息要求的更宽松规定。

    19. 我们现在认为理所当然的安全演示？在早期要少得多。诸如在起飞和降落时调暗客舱灯光和拉上窗帘是乘客福利中较新的增加，因为这两者都能让旅行者适应坠机时可能遭遇的环境。

    20. 每天筛选超过 200 万名乘客和机组人员的 `运输安全管理局 (TSA)`？它在 2001 年之前不存在。


    这些只是几十年来航空旅行安全进步巨大程度的 20 个例子。我甚至还没有触及 9/11 之后世界所做出的所有变化的冰。


    这些变化并非一夜之间发生的。它们是一个受到敌手（包括环境和人类）围困的行业，被迫随着时间的推移不断提高安全标准的结果。虽然我们可能怀念那个机场安全几乎不存在的简单时代，但我们中的许多人也将永远无法体会那种曾威胁飞行自由的恐怖。如果你像我一样，你无法想象带着永久的恐惧登上飞机——担心它可能被改道或毁灭，不是因为气流或恶劣天气，而是因为一个为了个人或政治利益的劫机分子。


    然而，那个画面——已成为大制作动作电影的常常————曾是被称为“劫机黄金时代”期间旅行者面临的严酷现实。在 1968 年至 1972 年间，劫机分子在美国领空劫持了
    130 多架飞机，频率通常为每周一次或多次。(6) 劫机“病毒”是一场肆虐的流行病。媒体以同样的热情报道航空旅行的黑暗现实。当精神科医生采访劫机分子时，他们发现了一种争胜心理。潜在的劫机分子对最新飞机劫持事件的广泛报道深感着迷，他们会想：“我可以做得更好；我可以改进它。”^(7)
    于是，传染蔓延了。


    '
- fmt: '

    It’s hard to believe, but hijacking became such a common occurrence during those
    years that passengers simply accepted it as part of the air travel experience.
    In 1968, *Time* somewhat poked fun at the hijacking plague with an article aptly
    titled, “What to Do When the Hijacker Comes.” In it, the journalist reports of
    more than `1,000` Americans diverted to Cuba over the previous eleven months.
    While “pilots carry maps of Havana’s Jose Marti Airport just in case, and stewardesses
    are instructed not to argue with would-be hijackers—simply to obey their orders
    . . . nobody has yet thought to brief the poor passengers.”


    The author graciously obliges with some dos and don’ts should one find herself
    an unwitting passenger on a hijacked plane—like don’t be aggressive, don’t panic,
    don’t push the call button (lest the ding startle the hijacker causing him to
    unintentionally discharge his weapon), and don’t call aloud for the “stewardess.”
    When the flight arrives in Cuba, the journalist suggests two dos: Do stay calm
    and do enjoy the stay (the article even offers some helpful details on comfortable
    overnight accommodations in the area).


    ### How did airlines handle the persistent threat?


    They complied with the hijackers. If a skyjacker wanted to land in Cuba (or anywhere
    else), pilots would divert the flight. All cockpits were equipped with maps of
    the Caribbean Sea, regardless of a flight’s intended destination, given the popularity
    of Cuba as a hijacking destination at the time. Further, pilots were given popular
    phrase cards in Spanish to help them communicate with Cuba-bound skyjackers (such
    as learning how to say “I must open my flight bag for maps” or “Aircraft has mechanical
    problems—can’t make Cuba”). If the perpetrator wanted money, airlines would pay
    the ransom and hope for its return upon the subject’s arrest. Airlines fought
    tenaciously to protect their existing lax security controls, outright resisting
    deterrents like metal detectors that would thwart skyjackers since they didn’t
    want to subject their paying guests to the same scrutiny.


    Unbelievably, airlines so refused the concept of imposing security restrictions
    that they even considered building a fake airport in southern Florida resembling
    Cuba’s own as an alternative to metal detectors and the like. Under this proposal,
    pilots would land at the decoyed airport, where federal agents would await the
    suspect’s arrival.


    Due to cost, the fake airport idea was jettisoned in favor of behavioral profiling
    instead. Ticket agents would give passengers a once-over for any one of roughly
    `20` possible behavioral warning flags of a potential hijacker in disguise. To
    put passenger convenience above security, the profiling would apply to less than
    `1 percent` of all travelers, leaving more than `99 percent` unencumbered.


    Airl didn’t readily embrace the culture of security I credit them with today.
    In fact, they accepted these human adversaries in their environment and developed
    practices to work with them. The security controls now all too common did not
    initially conform to the airline industry’s paradigm of an optimal customer experience.
    At the time, the rationale for complying with terrorists rather than securing
    the airways seemed sound. It was the first time that air travel had moved from
    the elite upper crust to the mass-market traveler. Security delays that cost travelers
    as little as `15 minutes` in extra time could be sufficient incentive to stimulate
    alternate modes of transportation. It was a risk the relatively fledgling industry
    couldn’t afford to take.


    ### The shift to national threat


    Until November `10, 1972`, when hijacking moved from the realm of minor inconvenience
    to that of national threat. Three hijackers threatened to crash a plane into an
    atomic reactor at Oak Ridge National Laboratory in Tennessee. The Federal Aviation
    Administration (`FAA`) took the measure that airlines had abdicated. In January
    of the following year, all passengers would undergo physical screenings, including
    passing through metal detectors and having their bags searched.


    Adversaries are nothing if not determined and innovative. When hijacking proved
    more difficult thanks to the imposed airport screening, perpetrators turned their
    attention to aircraft bombs. When security measures were improved in the `1990s`
    to defend against that threat vector, terrorists topped themselves on September
    `11, 2001`, carrying on permissible box cutters to commandeer and use commercial
    airliners as self-guided missiles (reminiscent of that failed hijacking in `1972`
    threatening the same).


    At every turn, the airline industry has responded with additional security measures.


    *   `December 22, 2001`: Onboard passenger Richard Reid attempts to detonate an
    explosive in his shoes. Five years later, the `TSA` mandates removal of shoes
    at security checkpoints.

    *   `August 9, 2006`: Officials bust a conspiracy to bring down airplanes with
    liquid explosives. On September `26` of the same year, `TSA` bans carry-on liquids
    of more than `3.4 ounces` that can fit in a `quart-size clear plastic bag` per
    passenger (now known as the `3–1–1 requirement`).

    *   `December 25, 2009`: Onboard passenger Umar Farouk Abdulmutallab stuffs an
    explosive in the most intimate of areas—his underwear. Passengers are soon treated
    to controversial virtual strip searches at airports, courtesy of “backscatter”
    machines.


    This cat-and-mouse game will persist. When the next threat emerges, the airline
    industry will respond with security controls designed to inoculate it. While passengers
    may grumble at the inconvenience, they’ll also accept a new normal that is, at
    its heart, designed with security at its core.


    It’s the reason I point to the airline industry as the poster child for executing
    a culture of security. That’s not to say airlines willingly abided by all the
    controls that keep us safer, if not somewhat inconvenienced, today. There was
    plenty of resistance in the earliest days when the industry and its passengers
    viewed hijacking as a nuisance, not a threat.


    ### Preflight safety requirements


    But consider the following list as a subset of what must happen today before an
    airplane is cleared for takeoff. Should any of these items be lacking, passengers
    can expect a delay, if not cancellation of the flight:


    1.  A preflight check includes an exterior walkaround and visual inspection of
    critical components, including sensors, probes, and exposed motors and cables,
    such as those found in the landing gear.

    2.  The preflight check also encompasses an interior testing of critical systems,
    like fire detectors, weather radar, and warning lights.

    3.  The maintenance crew performs any required maintenance, based on a schedule
    for the aircraft. The least invasive, and most frequent, of these checks occurs
    every `500 flying hours`. The most extensive of these checks happens approximately
    every `six years` and is so expensive that, in many cases, the airline simply
    retires the aircraft instead.

    4.  The maintenance staff keeps a detailed inventory of the operational state
    for all inventory onboard. If there are any concerns, the maintenance team decides
    whether to fix or defer the problem. This depends on the minimum equipment list
    the airplane must have in working order to be airworthy. If the aircraft doesn’t
    meet the requirements, it stays put.

    5.  The pilot reviews the minimum equipment list and deferred items to be aware
    of the maintenance state of the aircraft before takeoff.

    6.  Ground handlers check the plane for damage and the runway for any debris or
    obstacles that could impede it as it taxis out.

    7.  Pilots and flight attendants huddle for a pre-departure check, where the flight
    plan, weather report, expected turbulence, and more are discussed to facilitate
    a smooth and safe experience for all.

    8.  Air traffic controllers ready the flight plan, considering weather patterns
    and airport constraints, among other factors.

