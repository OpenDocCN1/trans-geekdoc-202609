  trans: '


    纯属偶然，就在 Lusthaus 选择新主题的截止日期迫在眉睫之时，一位关于网络犯罪的知名作者在牛津进行该主题的演讲，给了他灵感。在对近 250 多名执法执法人员、安全专业人士和前网络犯罪分子进行采访后，Lusthaus
    已经成为了该领域的专家。在他的著作`Industry of Anonymity: Inside the Business of Cybercrime,` 中，他向我们揭露了这个价值
    6000 亿美元行业^(1)的真实面目。


    他发现地下市场与支撑健康且合法商业工业的金融市场有许多共同点。Lusthaus 指出网络犯罪分子之间存在分工。网络犯罪领域几乎没有“通才型”。相反，正如 Lusthaus
    所发现的，投资于某项“手艺”并依靠他人执行专门职能具有更大的经济效益。有些人更擅长技术，因此他们设计了这些网络祸源；另一些人天生擅长销售，他们进入地下商业市场推广价值主张；还有人擅长执行，他们为需要帮助将武器送达预期目标的买家提供售后支持。


    推动世界上最复杂公司的分工模式也服务于暗网（Dark Web）的需求。具有此类专业化的网络犯罪分子如何在提供服务后相互信任并按时付款？这就像在线购物者学会了信任寻求其业务支持的正规在线公司一样。他们依靠其他网络犯罪分子对自身经验的数字评分量表。他们使用反馈论坛来交换关于他们内部坏蛋的信息（显然，盗贼之间确实有道义）。


    这些反馈机制扩大了网络犯罪业务的规模。每个犯罪分子都可以花费更少的时间来验证链中潜在伙伴的专业知识和可靠性，而花费更多的时间执行他们的技艺来实施犯罪。


    除了模仿在线交易所的服务，网络犯罪市场还模仿了合规治理的规则。Lusthaus 发现网络犯罪分子使用托管服务，将第三方委托第三方持有付款（即使不是货物），直到所有内容通过验证。甚至还有仲裁机制，双方都可以在受命做出裁决的社区资深成员面前辩论争议。在某些情况下，“法官”可能会将违规方封在市场之外。


    McAfee 对潜伏在网络表面下的庞大网络犯罪市场进行了我们自己的研究^(2)。由于执法部门捣毁了一些著名的暗网市场，网络犯罪分子正在发挥他们的创业才华。一些个人卖家正将成熟的市场（这些市场往往是执法人员的目标）交易为自己的网站，以便在暗网上兜售他们的商品和/或服务。不屈的网站设计师是这一追求过程的帮凶，为有抱的供应商设计隐藏的市场。是的，即使暗网也有层级，允许其参与者在雷达下潜行得更深。


    无论坏意行为者的意图建立自己的“点击即实体店”等同业务，都有许多有用的针对网络犯罪主题的地下论坛，帮助这些犯罪分子精进他们的技艺。更热门的讨论涉及泄露的用户凭据、常见的漏洞和暴露（CVE），以及提供大量可供取的被盗信用卡卡的“倾倒站”。


    这就是网络犯罪的真面。这个由服务、买家、卖家和“监管者”交织而成的复杂迷宫正是你们公司所面临的对手。而且你们公司处于劣势地位。这不是一场公平的对决。暗网上没有萨班斯-奥克斯利法（SOX）的要求。没有监管隐私和数据使用的
    GDPR。没有由众多治理机构规定的合规标准。黑客可以在凌晨 2:00 写代码，并在凌晨 4:00 利用他们的受害者。不需要复杂的测试窗口来确保符合质量控制。


    与受你们公司相同的规则、法规和通用商业理想约束的竞争对手不同，对手不遵守任何法律（除了他们既定社区的法律）。你可能非常熟悉正在面对一个高度协调的敌人。但请考虑财务部门通常如何向组织分配预算，以理解网络安全的症结。预算可能是根据基准数据分配的。虽然你可以找到网络安全支出的基准，但它们有些误导性。因为网络安全的真实基准必须来自对手。如果你不知道对手在研发他们的“产品”上花费了多少资金，又如何准确评估与之匹配的网络安全预算？


    如果不是基准数据，预算就是根据投资回报率（ROI）分配。同样，对于网络安全专家来说，这是一个很难证明的衡量标准。因为首席信息安全官（CISO）如何证明一个否定事实？即使他们尝试，聪明的首席财务官（CFO）难道不会从面上挑战这一论点吗？想象一下
    CFO 和 CISO 之间的对话如下：


    **CFO：**

    我们为什么需要买这个新的安全小组件？


    **CISO：**

    因为我们看到公司在该领域遭受的攻击数量历史新高。


    **CFO：**

    但这笔支出的投资回报率是多少？


    **CISO：**

    嗯，如果我们不做些什么，我们可能会被入侵。


    **CFO：**

    所以你是想向我保证，如果我们买了这项技术，就不会发生泄露吗？


    **CISO：**

    不完全是。情况比这复杂。


    **CFO：**

    让我们把它简单化。这笔支出的投资回报率是多少？


    你可以看到这种循环论证可以持续多久。除非尝试用复杂的指标让财务人员感到震慑，否则 CISO 没有高明的办法来回答“投资回报率是多少？”这个问题。


    并不是说 CISO 在逃避这个问题——或者说他们不理解 ROI 的概念。为了理解为什么这是一个无法回答的问题，让我们看看几个能进一步说明这一点的攻击。


    ## 变与不变的是……


    2017 年 5 月，网络安全进入了几乎每个媒体网站的首页和全球几乎每个新闻节目的第一部分。以前不知道勒索软件的人将通过一个名字记住它：WannaCry。这种攻击在规模和速度上都是前所未有的，在最初几天内全球范围内感染了超过
    20 万台计算机——关闭了医院、大学和银行.^(3)WannaCry 对每个受害者的计算机文件索要赎金，金额高达 300 美元比特币。WannaCry 愤怒造成的估计损失？在全球范围内高达数十亿美元。


    但把 WannaCry 称为勒索软件是不公平的。当然，勒索软件是威胁到不可恢复的文件丢失的可见利用漏洞。但让 WannaCry 如此隐蔽的是它传播的方式，它利用蠕虫的特性来污染新系统。在这里不进入复杂的技术细节，“传统”勒索软件与
    WannaCry 的关键区别在于后者不需要人工干预即可扩散。这就是它扩散如此迅速的原因。


    '
- fmt: '

    McAfee’s own analysis of `WannaCry` revealed that it barely qualified as ransomware
    at all. Its authors left it with rather crude monetization capabilities. They
    didn’t connect a victim’s unique identification to his bitcoin payment, making
    decryption of files extremely difficult. So what was `WannaCry` really? Ransomware?
    Worm? Both.


    In 2018, hacker ingenuity was again on full display with the release of `Zyklon`.
    `Zyklon` was a fully featured package of threats for enterprising criminals to
    exploit—it could steal passwords, launch DDoS attacks, mine cryptocurrency, and
    more. What really was `Zyklon`? Cryptojacking? DDoS? Keylogging? All of the above.


    As `WannaCry` and `Zyklon` show, hackers not only cooperate in specialty, but
    they collaborate to create new concoctions of converged threats. They’re mixing
    old varieties (like worms) with new ones (like ransomware). In McAfee’s analysis
    of underground forums, we see cybercriminals discussing vulnerabilities, both
    old and new. The results are sophisticated threats capable of contagion much faster
    than ever before.


    Back to our conversation between the CFO and CISO. When the CISO approaches the
    CFO for more money, it’s usually because of this reality. Even mid-cycle, long
    after budgets have been allocated, the CISO may need more. `WannaCry` didn’t wait
    for a convenient fiscal period end to wreak its havoc. Bad actors don’t care about
    your budget cycle.


    If `ROI` isn’t the right metric for cybersecurity, then what is? Risk management.
    Cybersecurity professionals are in the risk management business. Sure, they have
    technical expertise and scores of products in use to defend their companies against
    highly organized crime syndicates. But take that technical jargon out of the field
    and it really comes down to one clear business objective—mitigate the company’s
    risk.


    As CFOs know, risk management and its associated metrics fundamentally differ
    from the more traditional finance measure of `ROI`. I live in North Texas, part
    of a region of the country that has earned the unfortunate colloquialism “Tornado
    Alley.” To this day, I have a healthy fear of tornadoes. Blame it on the tornado
    sirens that are tested the first Wednesday of every month at noon. The chilling
    sound is straight up de.


    ## . . . the More They Stay the Same


    They hide during the day to feed at night. They look for a blood meal to survive,
    snacking on their victim while he sleeps, since they abhor movement. They are
    fast movers, generally covering three to four feet per minute–when scaled, the
    equivalent to an average adult’s sprinting pace. Yes, bed bugs are having quite
    the resurgence around the world.

