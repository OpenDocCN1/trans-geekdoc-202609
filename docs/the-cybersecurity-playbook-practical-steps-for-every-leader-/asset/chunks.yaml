    既然谈到了软件开发人员，这里还有另一个建议供你参考。请确保安全是任何最小可行性产品（MVP）的一部分。当《精益创业》作者埃里克·里斯（Eric Ries）推广
    MVP 时，他捕捉到了任何初创公司努力目标的核心：发布一种新产品，使开发团队能够以最小努力收集有关客户使用和接受度的最大信息。这一过程非常适用于云应用程序，因为这类应用对前期资金的需求很低（因为许多应用利用了
    `AWS`、`Azure` 和 `Google` 提供的公共云基础设施）。本质上，它实现了快速学习、产品开发中的快速迭代以及与客户的持续反馈循环。这些都是好事——特别是如果它能让初创公司（或任何公司）避免发布在市场上平平无奇软件产品的昂贵错误。


    ## 安全作为一项可行性需求


    问题在于：不要过分关注名称中的“最小（minimum）”一词，而忽略了紧随其后的那个词，“可行（viable）”。**安全性必须内置，而不是事后补救**，无论对于针对早期采用者的产品，还是面向大众市场。安全*必须*是你的最小可行性产品需求的一部分。


    接下来，在设计产品时，要审慎考虑你的公司将如何、在何处以及使用多久客户数据。某些法规会迫使你的公司关注此类事项，假设你们需要额外的动力）。因此，我在这里讨论的不是监管机构发布的强制性要求。相反，我指的是你的公司对自己负责的伦理标准。明确的是，在这两个标准中——法律要求或你公司的伦理原则——较高的那一个就是这项测试的底线。


    ## 案例研究：迈菲的透明度


    例如，在第一章中，我讨论了黑客对热门社交媒体平台上 `McAfee` 公司页面进行的篡改行为。虽然我们的事件没有涉及客户数据，但它能帮助我描绘出这一观点的含义。由于没有数据被盗取或任何
    `McAfee` 系统被入侵，`McAfee` 完全没有法律义务报告这次攻击，更不用通知媒体了。


    但 `McAfee` 对自己执行比法律要求更高的标准。在这种案例中，当黑客将我们的 Logo 替换为一张图片时，我们员工的社交媒体页面以及 `McAfee`
    的公司简介页也遭到了篡改。这张图片在任何个人资料中列有 `McAfee` 的员工个人页上显示了几个小时。`McAfee` 有一个与员工共同维护的公司价值观：*我们实践包容性的坦诚与透明。*虽然法律限制不需要我们进行任何报告，但我们自己的价值观要求更多。


    因此，在攻击发生的第二天，我们在内网首页发布了一篇故事，向所有员工承认了这件事。我们知道风险在于，一个没有受到任何真实媒体关注的故事（因为攻击发生在原本安静的复活节周日），只要*一个*员工将其发送给媒体，就会在周一早上引发轰动。坦率地说，这种情况没有发生。最终，如果我们想要维护超出法律要求的公司价值观，这就是我们必须承担的风险。


    ## 定义数据需求


    因此，**在任何新产品或服务的设计中明确且有意识地定义你的数据需求**——维护法律要求或伦理标准中较高的那一个。我再给你一个例子来强调这一点。迄为止，唯一对报告索索软件攻击发布明确指导的美国监管机构之一是`卫生与人类服务部`。


    ## 整个生命周期的所有权


    **接下来，将安全所有权构建到生命周期的每个阶段中。**你的产品将如何升级以应对下一个威胁？哪个部门负责持续维护？预算位于何处？


    与维护产品所需的精力相比，引入产品的精力可能很简单。只有在第一批客户采用你的作品之后，支持、可扩展性以及是的，安全等避免的问题才会显现。在你的产品到达第一位客户之前，预先为这些确定事项建立明确的所有权将节省时间并降低风险。这与你在考虑其他问题时可能已经在实践的纪律没有区别。除了确认支持和可扩展性问题已纳入计划外，公司每个部门（如客户支持、工程或市场营销）的最高负责人还应明确审查并批准其职能的安全需求已充分内置到产品中。


    ## 停线


    最后，同样重要的是，如果产品发布过程的任何部分缺乏或缺失安全，你必须**停线**。更重要的是，你应该积极鼓励直接或间接参与开发过程的*任何*员工遵循这种停线哲学。这执行起来绝不利，因为在商业中时间就是金钱。但对于那些没有所有员工集中在一个物理位置的公司来说，这更加困难（例如弗雷蒙特的
    `Toyota` 工厂，其环境中有实线提示，包括红、黄、绿通用颜色，可以立即且无误地向所有工厂员工传达当前的质量状态）。同样，许多公司没有员工可以激活以立即停止生产线的拉绳或按钮。


