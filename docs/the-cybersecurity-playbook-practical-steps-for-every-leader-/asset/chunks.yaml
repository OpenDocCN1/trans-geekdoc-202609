    我告诉你们这个故事，不仅仅是因为它很有趣，也不仅仅是为了让你觉得“嘿，这比我好多了！”我从这个故事开始，是因为它是我们在书中剩余部分中将要讨论的内容的缩影。


    为了让你觉得这书值票——在第一章中——我将现在说明这次黑客攻击是如何发生的，以及我们之后做了什么。最重要的是，我将列出你明天早上上班时可以采取的步骤，确保这种情况不会发生在你身上。


    ## 惨痛换来的教训


    当我们重新获得账户的控制权时，我们要求社交媒体公司告诉我们仪表板中哪个管理员账户负责了这些更改。


    结果证明，那是我们一家媒体投放代理机构的一名员工，她不再为我们工作了——我们叫她 Julie 吧。她的凭据被一个与大型网络犯罪团伙有关的青少年盗了。Julie
    犯了许多人都会犯的错误：她没有养成良好的密码习惯。她使用同一个密码访问多个账户，包括她在该社交媒体平台上的个人资料。而且，由于她是该网站上 McAfee 公司页面的授权管理员，她的个人凭据让她不仅能够访问自己的个人资料，还能访问我们的。当她的其中一个账户被破解且凭据在暗网上被交易时，黑客简单地尝试在她的其他在线账户上使用该密码。当他们破解了
    Julie 在社交媒体平台上对 McAfee 公司页面的管理员权限时，他们就获成功了。剩下的就是轻而云掌了。


    事后诸葛亮明，这个案例也不例外。一号漏洞：`Julie 在访问`她的社交媒体账户（以及我们在同一社交媒体平台上作为授权管理员的访问页面）时，`使用了与其他账户相同的密码`。如果她使用了唯一的密码，那么坏人在暗网上购买的凭据将一文不值。更糟糕的是？当收到个人账户被黑的警报时，Julie
    迅速更改了密码。但她没有更改其他账户的密码，包括故事中提到的那个。这是她的责任。


    二号漏洞：`我们本应该要求该社交媒体网站上的所有管理员进行多因素身份验证`。这意味着你不仅需要有正确的密码才能访问系统，还必须输入生成并发送到（例如）你手机上的一次性代码。如果你在要求代码后的几秒钟或几分钟内没有提供代码，你就无法进入。这种类型的认证有几个版本，我在这里做了简化，但你明白其中的意思。这是我们的责任。


    三号漏洞：`我们没有进行足够频繁的审查来查看谁不再需要访问`我们的账户。Julie 很久以前还帮助过我们，但在她的活动结束后，我们本应该将她从管理员列表中移除。即使在她活跃于我们我们合作期间，我们仍然可能被破解，但我们对访问管理的疏忽让情况变得糟糕。这绝对是我们的责任。


    所有这些行动都会大大减少黑客攻击发生的概率。但假设由于某种疯狂的原因，一个拥有足够动力、技能和运气的黑客能够进入我们的社交媒体账户。让我们看看，如果我们事先实施了某些措施，在发现黑客攻击后，什么可以帮助到我们。


    我们本应该有一套`程序，在不暴露我们已察觉攻击的情况下锁定所有管理员`。通过删除那些无意义的帖子，我们提醒了黑客。当黑客看到我们正在删除权限时，他的行动比我们更快。


    幸运的是，Gavin 在复活节周日看到了被篡改的页面。否则我们可能不会那么快地发现篡改。现在我们有一个工具，它使用机器学习来检测社交媒体网站上的异常图像、脏话、诽谤和其他异常材料。一旦检测到此类异常活动，它会立即通知我们团队的几位成员。


    *注：*我不会点出我们使用的工具，有两个原因：第一，工具更新换快，而且它们在不同时间的有效性也往往不同。换句话说，当一个工具刚发布时，它可能非常有效——直到黑客找到绕过它的办法。因为不知道你什么时候读到这本书，我不想赞美一个在你真正阅读这些文字时我可能已经不再使用的东西。


    不提及该工具的第二个原因是， McAfee 本身就是一个巨大的靶子。回到关于惨痛教训的故事：


    当我们向社交媒体公司报告黑客攻击时，我们并不知道他们处理此类问题的程序。失误。直到那时我们发现，他们的政策是冻结账户几个小时。


    我们从惨痛中学到金钱是说话的。我们现在提前询问这些程序，因为我们通过代理机构在该网站上花费了大量的广告费，我们看起来比实际规模的账户要小。今天，`我们直接向社交媒体平台付费`以减少这种威胁。


    我们学到`与我们开展业务的第三方公司可能没有安全实践`。因为我们在工具上投入了资金，我们有助于准确反映我们的投资，并获得应得的服务。


    而且，我们学到`与你有关系的第三方公司可能没有[这些]`。对于那些有权访问你的系统或作为你组织延伸部分的公司来说，记住这一点尤为重要。特别是那些没有正式 IT
    和安全团队的较小的第三方公司，更不用说严谨的网络安全措施了。


    最后，对那个复活节不幸事件的事后分析给了我们最后致命的一击。McAfee 在这次攻击中甚至不是一个被刻意的目标。黑客在破解她的凭据时并没有意识到 Julie
    是一个管理员。他不知道（也不关心）Julie 是谁。他只是在寻找密码。他的奖励只有在确定密码解锁了什么之后才会出现——无论是银行账户、公司网络或其他。一旦他发现恰好解锁了
    McAfee 在社交网络上页面的密钥，他就在那里发泄了他的攻击，得罪了每一个人并在过程中羞辱了我们。*即使对于黑客来说，有时运气比能力更重要。


    ## 给你的额外教训


    - **建立一个可以联系和升级处理的人员名单**。确保你和你的团队可以随时访问。此外，名单不仅要包含你团队的人员，还必须包括网站、社交媒体、云存储等供应商的人员。

    - **在工作职责描述中加入定期审查谁有访问权限**，并清理列表以移除不再负责这些项目的人。

    - **使用多因素身份验证**。对于某些系统，我们可以自动检测我们的用户是否开启了它，如果用户关闭了它（例如切换到新电脑时的几分钟），系统会告诉我们。对于我们直接控制力较弱的系统（例如云服务），我们要求用户发送开启多因素身份验证的截图。


    你可以想象，我们现在发布页面之前会严格审查社交媒体。除了我上面提到的措施之外，我们还会问：


    - 你们如何处理个人身份信息？

    '
- fmt: '

    *   What technology are you using? (We take the answers and do a vulnerability
    assessment.)

    *   How does your access management system work?

    *   What third-party tools are allowed to connect to your platform to automate
    any rollback of content that is necessary after a hack?

    *   What is your escalation process if an account is taken over?

    *   What’s your service level agreement for responding to a hack and for getting
    a customer back to the pre-hack content?


    ## Who Was at Fault?


    Certainly, the social media provider can make the case that we didn’t do some
    obvious things like keeping admins to a minimum by reviewing them often, insisting
    upon unique, strong passwords, and so forth. But it didn’t help that they had
    such a rigid policy that even an obvious, egregious hack to a site had to remain
    in place until “analysis” was complete. And of course, the agency person should
    have not reused the same password across multiple accounts.


    But notice that I titled this chapter “The Time *I* Ruined Easter.” No, I didn’t
    hack McAfee’s corporate social page. I didn’t knowingly leave the door open for
    a bad actor to do the same. And there was nothing I wanted *less* on that Easter
    Sunday than to be dealing with a situation that resulted from a comedy and confluence
    of errors across multiple fronts. All that said, I can only take responsibility
    for its occurrence. Because, at the end of the day, that corporate social page
    was under my team’s watch. And we failed to take reasonable measures to uphold
    our duty in safeguarding it.


    Personal responsibility is an uncomfortable thing. Very few of us relish the thought
    of examining what we could have done better or differently to prevent an unfortunate
    event. Deflection is a much more human response. Yet, it’s our very tendency to
    abdicate personal responsibility that remains a key weapon in the hacker community’s
    arsenal.


    For too long, cybersecurity has been “someone else’s” problem. For too many, cybersecurity
    is an opaque topic undeserving of their time, let alone personal responsibility.
    This book seeks to change that narrative, even if only by taking a humbling step
    in acknowledging the responsibility we all share as employees—and ultimately defenders—of
    our organizations. If our company can’t trust us to take reasonable precautions
    in protecting its most sacred digital assets, whom can it trust?


    Let me step off my soapbox to acknowledge the real problem. It isn’t that employees,
    generally speaking, don’t *want* to do the right thing. It’s much more often the
    case that they simply don’t know *how* to do it.


    Cybersecurity is a team sport with everyone needing to play her or his position
    for every minute of the game. Tools can be tremendously helpful, but it’s only
    when people, tools, procedures, regular reviews, and other factors work together
    that they form an effective defense.


    ## Remember this Crucial Element


    There’s another crucial element to minimizing cyber threats, and that’s honesty.
    I’m certainly outside my comfort zone starting off a book with my name on it by
    describing an embarrassing security failure on my watch. Could it have been far
    worse? Absolutely. Should it never have happened? Absolutely.


    And could it have been you, instead of me? Again, absolutely.


    By telling you this story, I want to set a tone of honesty that’s also needed
    in your business when you work to repel the bad guys: you need to develop a culture
    of security that allows people not only to help each other, but also to be honest
    with each other when they see unsafe practices. It’s honesty without anger or
    blame or retribution, and it’s crucial to making the culture work.


    The second reason for describing our social media hack is so you can take these
    lessons and immediately apply them to where you see chinks in your own security
    armor.


    ## Why Me?


    There is no shortage of cybersecurity books available for your consumption from
    reputable, talented authors with a variety of experiences. You’ll find some from
    journalists, who have dissected some of the most legendary breaches in history.
    You’ll find others from luminaries, who speak with authority as being venerable
    forefathers of the industry. And you’ll find more still from technical experts,
    who decipher the intricate elements of cybersecurity in significant detail.


    But, as I type this, you won’t find many cybersecurity books authored by marketers.
    And probably fewer still from marketers with just a few years in the industry.
    So why trust this author with a topic of such gravity?


    Think of me as a hybrid between marketing and technology. I’ve spent my career
    translating technical concepts into everyday language. I’ve studied the intersection
    of work and technology to understand how corporate culture is shifting.


    So if you’re a generally nontechnical person, rest assured that I strive to give
    you sufficient education to understand the nuances of this thorny subject, without
    overwhelming you with technical details. If you’re more technical than I am, while
    I won’t dumb down this topic, I will provide prescriptions that every employee—technical
    or otherwise—can practice to protect her organization. Finally, if you are one
    of my cybersecurity brethren, I hope you read and enjoy this book as a glimpse
    into our world. Then, I want you to pass it along to your non-cybersecurity colleagues
    to recruit them in our fight.


    ## Why You?


    You may consider yourself someone who doesn’t have much to offer in the realm
    of cybersecurity. After all, how could employees, managers, executives, and board
    members who are not within cybersecurity’s corridors really play a meaningful
    role in a game they may not even understand?


    This is where I turn to the world of professional sports for inspiration, as it
    often reveals many lessons we can all learn about the power of teamwork. While
    I’m no sports junkie, I do have a soft spot in my heart for American football.
    That’s because I have fond memories from my earliest years in grade school of
    sitting on my family couch, next to my dad, watching his favorite team, the Dallas
    Cowboys, play.


    Like millions of us who tune in to watch our favorite teams, I’m a spectator in
    the world of professional sports. Watching the game is about as close as the majority
    of us will ever come to playing it. Spectators hardly influence the outcome of
    a game. That’s a role left to the far more athletes and coaches on the field or
    on the court who, by their talent, tenacity, and teamwork, ultimately determine
    whether a game is won or lost.


    I used to believe that. And then I was introduced to the Seattle Seahawks’ `12th
    Man`. The Seattle Seahawks are a professional football team. In football, there
    are 11 active players allowed on the field, per team, for any play. But the Seahawks
    recognize 12 active teammates—represented by 11 players and the equally important
    spectator crowd.


    I eventually came to realize that Dad and I did not want our Cowboys facing the
    Seahawks on the latter’s home turf. That’s because the Seahawks’ stadium is not
    one that favors opponents. Its noise level, created by the `12th Man`, has been
    measured at only a couple of decibels below that of an aircraft carrier flight
    deck. As it turns out, these spectators have played quite a meaningful role in
    influencing the outcome of more than a few games. In three seasons, the Seahawks
    scored 26 wins against two losses on their home field.


    Their revered football team knows just how important these “spectators” are. The
    Seahawks retired the number `12` jersey on December 15, 1984, in honor of their
    fans. You’ll find a giant flagpole with the number `12` blazoned across it flying
    proudly in their stadium. When the team took the field for one of their Super
    Bowl appearances, they were led by someone carrying the `12` flag.

