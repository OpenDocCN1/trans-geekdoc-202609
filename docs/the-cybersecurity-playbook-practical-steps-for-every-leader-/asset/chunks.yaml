    9. Verizon, “2018 Data Breach Investigations Report,” [https://enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf](https://enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf).


    # CHAPTER 6: Luck Favors the Prepared


    > We have a team process that gets triggered if a cyberattack happens and so we
    wouldn’t directly go out and let the press know until we figured out certainly
    what it was and where it came from and what we planned to do about it. We haven’t
    been that far yet. It all depends on what the data flow is and how severe of a
    problem it is.

    > — Chief Marketing and Sales Officer, Hospitality Company


    A friend of a friend of mine knows a guy who was traveling on business in Las
    Vegas. He went to a bar one night and had a few drinks with a friendly stranger.
    The next morning, he awoke to excruciating pain in his lower back, submerged in
    a bathtub of ice. He noticed a phone next to the tub with a note that said something
    to the effect of, “Call 911. Your kidney has been surgically removed.” He lived
    to tell the tale but has one less kidney to show for it. Be careful—there’s an
    underground market harvesting organs from unsuspecting business travelers and
    tourists.


    I bet you’ve heard a similar story from a friend of a friend. But perhaps the
    victim in question wasn’t in Las Vegas. He might have been in Europe. Or South
    America. Who knew the underground market for stolen organs was so vast?


    Of course, it isn’t. This urban legend started in the late 1990s and, while we
    can roll our eyes at its absurdity today, I remember it sending shivers down my
    spine (right down to my kidneys!) when I first heard of this horror. I wasn’t
    the only one who fell for it.


    On January 30, 1997, after being inundated with phone calls from wary travelers
    rethinking their plans to party at Mardi Gras, the New Orleans Police Department
    issued the following statement:


    > Over the past six months the New Orleans Police Department has received numerous
    inquiries from corporations and organizations around the United States warning
    travelers about a well-organized crime ring operating in New Orleans. This information
    alleges that this ring steals kidneys from travelers, after they have been provided
    alcohol to the point of unconsciousness.


    > After an investigation into these allegations, the New Orleans Police Department
    has found them to be COMPLETELY WITHOUT MERIT AND WITHOUT FOUNDATION. The warnings
    that are being disseminated through the Internet are FICTITIOUS and may be in
    violation of criminal statutes concerning the issuance of erroneous and misleading
    information.


    I’m fascinated by urban legends. As a marketer, one of the hats I wear is that
    of storyteller. Urban legends are unique stories in that they catch fire fast.
    Turns out the most legendary among them share certain characteristics.


    They tend to have a moral, such as, “Look out for approachable strangers offering
    you alcohol in a bar.” They prey on societal fears of the moment. And they usually
    come by way of “a friend of a friend.” In other words, tracking down the source
    or veracity of the information is impossible, leaving people to fill in details
    of the story as it spreads.


    I’m struck by the similarities between a successful urban legend and a breach
    that makes its way to the headlines. Like urban legends, the news of a public
    breach tends to spread quickly. The details of a breach, such as how it happened
    and who was to blame, are typically slow to come, leaving individuals to fill
    in the gaps of the story with their own assumptions, the way “friends of friends”
    do for folklore tales.


    Breaches and urban legends have one more thing in common: They tap into a powerful
    emotion—fear. Why is fear so powerful? It’s deeply rooted in our survival instinct.
    Fear and anger, known as “hot” emotions, are two emotions we feel intensely. Our
    bodies have been programmed through the millennia to respond quickly to preserve
    our existence when these emotional chords are triggered. In contrast, it takes
    us longer to feel “cool” emotions, like joy and love, since our immediate survival
    depends on feeling neither as intensely.


    In fact, the one notable difference between urban legends and breaches is that
    the latter are real. For marketers and communications professionals, regaining
    control of your company’s narrative, while remaining transparent and authentic
    throughout the process, is a daunting challenge at best. The public relations
    battleground is littered with more bad examples than good of companies that mis-stepped
    in a communications outreach following a breach.


    As the ultimate stewards of brand reputation, my marketing and communications
    colleagues must be ready to respond—and respond quickly—when the next breach occurs.


    ## BREACH!


    In 2014, when Frank Blake announced he was stepping down as CEO of The Home Depot,
    he was leaving behind a seven-year legacy of strong business performance and compassionate
    leadership. Like many CEOs, Blake saw his fair share of challenges over his tenure.
    When he first took the reins in 2007, the looming housing crisis was just starting
    to smolder. In addition to stock price, morale was also on the decline thanks
    to a top-down managerial style that had overstayed its welcome with employees.


    Blake went to work focusing on the basics. He paused on opening new stores and
    started opening fulfillment centers instead, moving merchandise closer to existing
    locations. He focused on profitability and merchandising mix. He closed unprofitable
    divisions and markets.


    At the same time, he brought southern charm back to the giant retailer’s culture.
    On a typical Sunday, Blake would handwrite hundreds of personalized thank-you
    notes to worthy employees—a courtesy he picked up from then–Vice President George
    H. W. Bush, when he served as his deputy general counsel.


    A few years of tenacious focus turned The Home Depot around. Under Blake’s tenure,
    the stock price had doubled from the time he took office in 2007 to when he announced
    his intent to step down in August of 2014.


    So in the final months of his tenure, Blake was taking some well-deserved time
    off on Labor Day weekend—just 12 days after announcing his departure as CEO. Ever
    the workaholic, Blake was writing his handwritten thank-you notes to employees
    that Sunday afternoon. As he would say, “You get what you measure. You get what
    you celebrate.”


    The weekend celebrating wouldn’t last. The next morning, Blake got a call from
    his company’s general counsel. It looked as though their computer systems had
    been infiltrated.


    While Blake didn’t have all the details yet, his company’s financial health and
    reputation were at risk. In his last few months on the job, Blake was staring
    down the barrel of a crisis that not only endangered his company but threatened
    to tarnish the CEO’s unblemished record as well.


    We know the end of this story. The Home Depot had 56 million debit and credit
    cards breached. But what makes this story unique is not the hack itself but the
    way the company responded. During a time when big-company hacks were making headlines
    regularly, The Home Depot stood out—in a *good* way. Blake didn’t run for cover.
    He didn’t deny responsibility. He didn’t withhold information until he had all
    the details. And he didn’t pass the buck to his recently named successor to let
    the new guy sink or swim. (And, to be clear, any of these options would have been
    taken by someone with a weaker constitution.)

