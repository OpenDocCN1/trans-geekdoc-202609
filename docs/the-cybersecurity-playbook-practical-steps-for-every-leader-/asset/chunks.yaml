    \ and Analytics versus the Chaos of Cybersecurity Operations,” Enterprise Strategy\
    \ Group, September 2017.\n\n15.  ^([15](#c02.xhtml#c02-note-0015-1)) EY, Global\
    \ Information Security Survey 2017–18, [https://www .ey.com/gl/en/issues/governance-and-reporting/center-for-board\
    \ -matters/the-cost-of-cybersecurity-on-the-board-agenda-ey](https://www.ey.com/gl/en/issues/governance-and-reporting/center-for-board-matters/the-cost-of-cybersecurity-on-the-board-agenda-ey).\n\
    \n16.  ^([16](#c02.xhtml#c02-note-0016-1)) Ibid.\n\n17.  ^([17](#c02.xhtml#c02-note-0017-1))\
    \ Deloitte, “2016 Board Practices Report.”\n\n18.  ^([18](#c02.xhtml#c02-note-0018-1))\
    \ Ibid.\n\n19.  ^([19](#c02.xhtml#c02-note-0019-1)) Jon Oltsik, “Why Do CISOs\
    \ Change Jobs So Frequently?,” CSO, January 2, 2018, [https://www.csoonline.com/article/3245170/why-do\
    \ -cisos-change-jobs-so-frequently.html](https://www.csoonline.com/article/3245170/why-do-cisos-change-jobs-so-frequently.html).\n\
    \n# CHAPTER 3  \n\n“Good Morning, This Is Your Wakeup Call.”\n\n> *I would say\
    \ I have never knowingly violated my company’s cybersecurity policy. And yet,\
    \ I feel that the larger problem overall is that there’s not always clear communication\
    \ about what the policies are. These things tend to be glossed over by managers\
    \ all the time because they themselves are not always savvy as to what all the\
    \ rules are. I think the reason for this is the majority of people do not understand\
    \ all the implications of their actions when it comes to cybersecurity and protecting\
    \ company information. And many people within organizations do their best in terms\
    \ of trying to be safe using technology. But that is a constant battle being waged\
    \ by IT groups within almost every company.*\n\n> \n\n> Respondent, McAfee Online\
    \ Ethnographic Study\n\nI grew up with a healthy respect for authority. My mom\
    \ and dad were on the stricter side. They expected me to comply with reasonable\
    \ rules. Do your homework. Be home by curfew. Clean your room. Respect your elders.\
    \ The stuff of building a responsible and contributing member of society.\n\n\
    So when I got a voicemail from my mom early one weekend morning telling me someone\
    \ from law enforcement was looking for me, I couldn’t reach for my phone fast\
    \ enough.\n\n*   “Allie, there’s a sheriff in Nashville who just called here looking\
    \ for you. He says there’s a warrant out for you for a missed court appearance\
    \ in Davidson County.”\n\nMy heart started racing as I listened to my mom frantically\
    \ giving me this sheriff’s information.\n\n*   “Mom, this doesn’t make sense.\
    \ I haven’t lived in Nashville for 20 years! I never was told I needed to be in\
    \ court.”\n\n*   “Babe, I told him the same thing. I told him I’d have you call\
    \ him.”\n\nI’m a much earlier riser than my husband. I figured I’d quickly take\
    \ care of the phone call before he woke.\n\nI dialed the digits with the (615)\
    \ Nashville area code.\n\n*   “Sheriff Johnson speaking.”"
