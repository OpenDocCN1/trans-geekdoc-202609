    # CHAPTER 7: Interesting Bedfellows


    > *As you move further and further—our secondary and tertiary relationships—you
    obviously have greater vulnerability. We have a very robust third-party service
    policy and network for monitoring and maintaining those relationships. In fact,
    that’s one of the areas that I’m responsible for myself. We have an entire department
    dedicated to that. We have questionnaires. We have different third parties that
    will then do audits and examinations of some of our more critical third-party
    service providers to make sure they are maintaining appropriate levels of security.
    We require certain third-party audits of their data security that must be done
    every year. It’s pretty robust.*


    C, Financial Services Company


    If you’re a CFO for an enterprise, chances are you have something in common with
    most hackers: You have a healthy profit motive. Many adversaries would agree with
    a philosophy you likely hold dear: Cash is king.


    Jonathan Lusthaus never envisioned a career studying cybercriminals. His passion
    was in researching religious violence. But when his dissertation topic didn’t
    conform to the research areas of the Oxford faculty, he needed to find a new interest.

