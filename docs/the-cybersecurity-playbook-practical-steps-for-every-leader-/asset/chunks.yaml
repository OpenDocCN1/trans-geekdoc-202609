    9. Verizon，“2018 年数据泄露调查报告，”[`enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf`](https://enterprise.verizon.com/resources/reports/DBIR_2018_Report_execsummary.pdf)。


    # 第 6 章：幸运青睐有有准备的人


    > 我们有一套团队流程，一旦发生网络攻击就会触发。因此，在完全确定发生了什么、源自哪里以及我们计划如何处理之前，我们不会直接向媒体泄露。我们目前还没有到那一步。这完全取决于数据流向何以及问题的严重程度。

    > — 某酒店公司首席营销与销售官


    我的一位的朋友认识一个在拉斯维加斯出差的人。某天晚上，他去了一家酒吧，和一位友好的陌生人喝了几杯酒。第二天早上，他醒来时感到背部剧痛，整个人泡在冰水浴缸里。他注意到浴缸旁有一个手机，旁边有一张纸，上面写着类似“拨打
    911。你的肾脏被手术切除了。”他活下来讲述了这段经历，但因此少了一个肾脏。小心点——有一个地下市场专门收割毫无防备的商务旅行者和游客器官。


    我打赌你从朋友的朋友那里听过类似的故事。但也许受害者并不在拉斯维加斯。他可能在欧洲，或者南美。谁知道被盗器官的地下市场竟然如此巨大？


    当然，事实并非。这个城市传说起源于 20 世纪 90 年代后期，虽然我们现在对它的荒谬相之以笑，但我记得第一次听到这个恐怖故事时，依然感到脊背发凉（直达肾脏！）我并不是唯一一个上当的人。


    1997 年 1 月 30 日，在接到大量警惕的旅行者重新考虑他们的马尔迪节（Mardi Gras）狂欢计划的电话后，新奥尔良警方局发布了以下声明：


    > 在过去的六个月里，新奥尔良警方局收到来自全美各公司和组织的咨询，警告旅行者新奥尔良有一个组织严密的犯罪团伙在活动。这些信息指称该团伙在向旅行者提供酒精直至其昏迷后偷取他们的肾脏。


    > 在对这些指控进行调查后，新奥尔良警方局发现这些指控完全没有根据，毫无事实。通过互联网传播的警告是**虚构的**，并可能违反了有关发布错误和误导性信息的法律法规。


    我对城市传说非常着迷。作为一名营销人员，我承担的身份之一是故事讲述者。城市传说的独特之处在于它们传播极快。事实证明，其中最传奇的具有某些共同特征。


    它们倾向于有一个道德寓意，例如，“小心在酒吧里向你提供酒精的易接近陌生人”。它们利用了当时的社会恐惧心理。而且它们通常通过“朋友的朋友”的形式出现。换句话说，要追溯信息的来源或真实性是不可能的，这让人们在故事传播过程中不断脑补细节。


    成功的城市传说与登上头条的新闻泄露事件之间存在的相似性令我震惊。就像城市传说一样，公共泄露事件的新闻往往传播得很快。泄露事件的细节（例如它是如何发生的以及谁该负责）通常来得很慢，导致个人用自己的假设来填补故事的空白，就像“朋友的朋友”在民间传说中所做的那样。


    泄露事件和城市传说还有一个共同点：它们触及了一种强大的情感——恐惧。为什么恐惧如此强大？因为它深根于我们的生存本能。恐惧和愤怒被称为“热”情绪，是令我们强烈感受到的两种情绪。几千年来，我们的身体已经过过训练，当这些情感弦律被触发时能够迅速做出反应以保护生存。相比之下，我们感受“冷”情绪（如喜悦和爱）需要更长时间，因为我们的即时生存并不取决于这些情绪的强烈程度。


    事实上，城市传说和泄露事件之间唯一的显著区别是后者是真实的。对于营销和传播专业人员来说，重新获得公司叙事的控制权，同时在整个过程中保持透明和真实，这充其量是一个艰巨的挑战。公关战场上，公司在泄露发生后沟通失误的反面教材多于正面教材。


    作为品牌声誉的最终守护者，我的营销和传播同事必须准备在下一次泄露发生时做出应对——并迅速做出反应。


    ## 泄露！


    2014 年，当弗兰克·布莱（Frank Blake）宣布辞任宝宝（The Home Depot）首席执行官时，他留下了七年强劲业务表现和同情领导力的传奇。像许多首席执行官一样，布莱在任期内面临了许多挑战。当他
    2007 年首次掌管局面时，迫在眉睫的住房危机刚刚开始萌芽。除了股价之外，由于于一种自上而下、已让员工感到反感的管理风格，士气也在下降。


    布莱开始工作时专注于基础工作。他暂停了新店的开设，转而开始建立配送中心，将货物运送到更靠近现有网点的地方。他专注于盈利能力和商品组合。他关闭了不盈利的部门和市场。


    与此同时，他为这家巨型零售商的文化中带回了南方魅力。在典型的周日，布莱会亲手为值得尊敬的员工撰写数百封个性化的感谢信——这是他从当时的副总裁（Vice President）乔治·H·W·布什（George
    H. W. Bush）那里学到的礼数，当时布什曾担任他的副总法律顾问。


    几年坚持不懈的专注让百得家（The Home Depot）转翁为安。在布莱的任期内，股价从他 2007 年就职到 2014 年 8 月宣布辞职意向期间翻了一番。


    因此，在任期的最后几个月里，布莱在劳动节周末（Labor Day weekend）休了应得的假，这就在他宣布辞任首席执行官的 12 天后。作为一个典型的工作狂，布莱在那个周日的下午仍在给员工们手写感谢信。正如他常说的，“你衡量什么，就得到什么。你庆祝什么，就得到什么。”


    庆祝并没有持续多久。第二天早晨，布莱接到了公司总法律顾问的电话。他们的系统似乎被入侵了。


    虽然布莱还没有获得所有细节，但他的公司财务状况和声誉正面临风险。在工作的最后几个月里，布莱正面对着一场危机，这不仅威胁到他的公司，还威胁到这位首席执行官完美无缺的记录。


    我们知道这个故事的结局。百得有 5600 万张借记卡和信用卡泄露。但这个故事的独特之处不在于黑客本身，而在于公司的应对方式。在一个大型公司泄露频繁登上头条的时代，百得脱颖而出——是以一种*好的*方式。布莱没有躲避。他没有否认责任。他没有在获得所有细节之前隐瞒信息。他没有把责任推给他新任命的继任者，让那个新人自生自灭。（明确一下，任何意志力薄弱的人都会选择上述其他方案。）


