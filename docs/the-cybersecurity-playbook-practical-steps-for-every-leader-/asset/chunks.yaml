    To make the goal of transformation even more difficult to accomplish, old technologies
    have a very long shelf life. Even with business units rushing to deploy cloud
    services (with or without the formalized consent of IT), there’s still a long
    tail of on-premises infrastructure that must be maintained. Consider USB thumb
    drives as one example. In 2017, researchers at Ben-Gurion University documented
    29 known attack vectors to compromise USBs.^([7](#c02.xhtml#c02-note-0007)) And
    Apricorn, a manufacturer of software-free, hardware-encrypted USB drives, reported
    in 2017 that while 90 percent of employees used USBs, only 20 percent did so with
    encryption.^([8](#c02.xhtml#c02-note-0008))


    Since long-tail legacy technology infrastructure rarely goes away and never does
    so quickly, these transformation pursuits entail risky expansions of scope and
    responsibility.


    What’s our CISO to do? Frivolously support an all-access, anything-goes environment
    and he leaves his organization open to increasing risk. Become the department
    of “no” to contain the potential threat and he’ll likely be disintermediated by
    the very employees he must protect (remember those nearly 2,000 cloud services
    in use unbeknownst to IT professionals in the average company?).


    The CISO is in an unenviable position. He must simultaneously protect his company’s
    most precious digital assets while advancing its transformation agenda. Unfortunately,
    those imperatives couldn’t be at greater odds with one another.


    ## 2. Risk Management


    Cybercrime is big business—to be exact, a $600 billion business in 2017, up $100
    billion from 2014.^([9](#c02.xhtml#c02-note-0009)) In terms of global impact,
    cybercrime ranks third as an economic scourge, behind government corruption and
    narcotics.


    How did we get here? There was a time when cybersecurity was relatively “simple.”
    Not only was security contained to the physical, as already mentioned, but addressing
    a threat was significantly easier. In 2006, McAfee detected 25 new threats per
    day. Ten years later, that figure had jumped to 500,000—more than five new threats
    per second!


    Volume is only part of the challenge. Spotting a threat used to be straightforward.
    Threats came in the form of malware—software designed by bad guys to wreak havoc
    on their victims. The cybersecurity industry talks of “traditional” malware, including
    those pesky viruses you’ve come to know and hate. Malware once only came with
    a static string of code that allowed the industry to identify it as such. Think
    of it as a software fingerprint of sorts—what the cybersecurity industry calls
    a `signature`. Much like law enforcement relies on a national registry to identify
    criminals based on fingerprints, the cybersecurity industry looks for `software
    signatures` to load known malware into its own database. If the `signature` is
    found on a file, the file is blocked and the threat contained.


    ### The Evolution of Threats: From Malware to Fileless Attacks


    How times have changed. The most insidious threats no longer come conspicuously
    donning a known and readily identifiable fingerprint. Bad actors have grown much
    smarter. When you read this, the latest cybersecurity threat is almost certainly
    not listed here, but as I write this, my industry is fixated on “fileless” attacks.
    These threats surreptitiously exploit trusted technology within your organization,
    like sanctioned tools and applications. Then they do their damage.


    ### 2.1 The Rise of Ransomware and Exploitation


    The volume is only part of the challenge. Spotting a threat used to be straightforward.
    ... `The industry is fixated on “fileless” attacks. These threats surreptreptit
    exploit exploit trusted within within your organization, like sanctioned and and....
    the the the the ` ` ` ` the the the the the the the the the to the.. `CISOs are
    continually walking a tightrope in mitigating risk. They must strike the right
    balance between high-volume threats and low-volume attacks that can take a company
    down.


    ###2.. The CISO''s Challenge


    How can CISOs be expected to explain this to boards? ... `But it’s also straightforward
    at its core. It’s fundamentally about risk management—a language in which board
    members are naturally fluent. CISOs are continually walking a tightrope in mitigating
    risk. They must strike the right balance between high-volume threats and low-volume
    attacks that can take a company down. All of us, board members or otherwise, can
    relate to the CISO on risk management, since we walk the same fine line in our
    own lives. We have bathmats in our bathrooms to prevent the risk of falls (a relatively
    minor risk for most under a age). We use smoke alarms in our homes and purchase
    insurance policies to mitigate more catastrophic risks, like fire. And while other
    truly cataclysmic risks, such as being struck by a meteorite can happen (and,
    yes, this really *did* happen for one poor soul in 1954^([10](#c02.xhtml#c02-note-0010))
    ), we safely ignore these risks given their infinitesimal probability. CISOs must
    categorize risks in much the same way for their companies. The challenge for our
    CISO is to simplify the topic of cybersecurity, without making it simplistic in
    the process. The onus for board members? Leaning in to the discussion, realizing
    the morass of complexity beneath the surface will rarely, if ever, yield a clear-cut
    decision. War doesn’t lend itself to clarity. Neither does cybersecurity.


    ## 3. Automation and Efficacy


    Doing more with less is an annoying cliché of the modern enterprise. It’s also
    the CISO’s unfortunate mandate. Not only does the volume of threats show no sign
    of abating, but the demand for cybersecurity professionals far exceeds the supply
    of talent in the labor market. According to `Cybersecurity Ventures`, more than
    3.5 million cybersecurity jobs will be unfilled by 2021^([11](#c02.xhtml#c02-note-0011))
    —that’s enough to fill 50 NFL stadiums!


    And the problem is only growing worse. In 2014, the cybersecurity industry estimated
    it would be short one million professionals worldwide. By 2015, the gap had crept
    up to 1.5 million openings. In 2016, forecasters thought the cybersecurity talent
    shortage would be 2 million professionals in 2019.^([12](#c02.xhtml#c02-note-0012))
    Just as threats continue to increase, so does the gap for qualified cybersecurity
    professionals.

