    \ Ethnographic Study\n\nAs I begin writing this chapter, I do so from the most\
    \ unnatural of places that has become strangely familiar to me—roughly 35,000\
    \ feet above the earth’s surface in a tube weighing more than 50 tons and traveling\
    \ nearly 450 miles per hour. I’m en route from Tampa to Dallas after a long weekend\
    \ of visiting family. Travel for me has become ordinary. I’m not one to consider\
    \ myself a road warrior by most definitions of the phrase, but I still easily\
    \ log more than 100,000 miles in a year—worthy enough to earn elite traveler status\
    \ from my preferred airline to make the routine a bit more bearable.\n\nEven though\
    \ I’m struck by just how mundane travel has become in my life, I still consider\
    \ myself a bit of a nervous traveler. For instance, leading up to a trip, I fixate\
    \ on what I’ll pack for the visit (whatever it is and for however long the trip,\
    \ it must fit in an airline-approved carry-on suitcase, since checking baggage\
    \ is simply out of the question). On the day of travel, I check for my identification,\
    \ wallet, and cell phone several times before I leave for the airport. (I have\
    \ a healthy dose of anxiety that I’ll arrive at the security checkpoint only to\
    \ find I’ve left one of these essentials behind.) I give myself plenty of time\
    \ to make it to the airport since sprinting through a terminal, breathlessly dragging\
    \ myself and my carry-on luggage through crowds of fellow passengers to make my\
    \ flight *just in time* is simply not my idea of a *good time.* Then, when I do\
    \ get to my gate, I wonder if the flight will be on schedule given I’m usually\
    \ rushing to a meeting as soon as I’m supposed to arrive.\n\nThese thoughts are\
    \ like a perennial playlist of worrisome possibilities I set to repeat in my brain\
    \ every time I travel. But notice what track isn’t on the list. For all my fretting,\
    \ there’s one concern conspicuous by its absence. That is, I don’t worry about\
    \ my safety. I don’t actively think about whether getting in a 50-plus ton tube\
    \ hurling itself roughly seven miles above the earth is a good idea. I assume\
    \ that it is. And I join the ranks of four billion passengers worldwide who do\
    \ the same each year.^([1](#c09.xhtml#c9-note-0001))"
