    \ find these words prominently displayed on pledge walls in every major McAfee\
    \ location around the world. In addition to the pledge, our walls commemorate\
    \ the signatures from thousands of McAfee employees volunteering themselves to\
    \ uphold that pledge. For the rest of employees in more remote facilities, including\
    \ our work-at-home population, chances are they electronically signed this pledge\
    \ upon joining our company.\n\nThe pledge is central to why McAfee does what we\
    \ do. We’re in the business of cybersecurity. So it’s only natural that security\
    \ is the lifeblood of our company. Even so, we’re not immune from adversaries\
    \ intent on doing us harm. No company is.\n\nBut how does your company, one that\
    \ is likely not in the core business of cybersecurity, develop a culture that\
    \ embeds security into the fabric of your organization? While I don’t envision\
    \ pledge walls featuring employees committed to keeping the world safe in your\
    \ future, there are plenty of areas where your company can focus to make cybersecurity\
    \ a meaningful component of your culture.\n\nChances are your company and culture\
    \ could benefit from a healthy dose of cybersecurity. There’s no doubt that the\
    \ ongoing cybersecurity battle between the good guys and bad guys can tilt in\
    \ favor of the former when more companies adopt cultures of security.\n\nSince\
    \ our HR professionals are the experts among us who have devoted their careers\
    \ to organizational health and are the champions behind the cultures sustaining\
    \ it, I’m dedicating this chapter to them. While they are not exclusively responsible\
    \ for company culture, they have more sway over it than just about any other party,\
    \ except for the CEO. They inspire the rest of us by creating environments that\
    \ attract and retain exceptional talent, something I’ve witnessed first-hand at\
    \ McAfee in how a visionary CHRO can spread influence and impact far beyond her\
    \ reach. And they have much more to offer in being part of the cybersecurity solution\
    \ than they might think.\n\n## When Too Much of a Good Thing Is Bad"
