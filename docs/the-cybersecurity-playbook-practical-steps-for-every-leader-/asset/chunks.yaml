    Employees notice reward and recognition in companies. It’s one part of the culture
    that is highly visible and clearly communicates what is (and is not) important
    to senior leadership. When an employee stops the line, find a way to reward her.
    Then publicly recognize her through any communication vehicle most leveraged by
    your company (here’s where your HR and marketing colleagues can help you). The
    point is that you want employees to know that your company takes security as seriously
    as it does quality. When they see for themselves how you’ve changed your reward-and-recognition
    system acknowledging that, you’ll find more diligent employees speaking up when
    security is falling down. And you’ll save your company from potential financial,
    reputational, or intellectual property losses down the road.


    ***


    Companies have come a long way from the cavalier, haphazard mentality once given
    to product quality. Educated buyers can easily check a company’s quality track
    record before making a commitment they may regret. Today, companies know the value
    of a quality experience. They measure it in customer satisfaction, net promoter
    scores, and retention. They compete for it in customer awards. And they see the
    value of it in their financial results.


    Cybersecurity is the quality of our generation. Like quality before it, it’s underestimated,
    underappreciated, or simply unmeasured. A good friend of mine often says, “What’s
    bred in the bones will come out in the flesh.” A company with strong cybersecurity
    marrow in its bones stands to benefit in less risk, fewer financial losses, more
    customer trust, and, yes, higher quality thanks to products inherently designed
    and built with both cybersecurity and quality in mind. As the dreamers and designers
    of tomorrow’s products, developers have an essential role to play in embedding
    cybersecurity in everything we consume.


    ## Notes


    1. ^([1](#c04.xhtml#c4-note-0001-1)) NPR, “The End of the Line for GM-Toyota Joint
    Venture,” March 26, 2010, [https://www.npr.org/templates/transcript/transcript.php?storyId=125229157](https://www.npr.org/templates/transcript/transcript.php?storyId=125229157).


    2. ^([2](#c04.xhtml#c4-note-0002-1)) Ibid.


    3. ^([3](#c04.xhtml#c4-note-0003-1)) David Kiley, “Goodbye, NUMMI: How a Plant
    Changed the Culture of Car-Making,” *Popular Mechanics*, April 2, 2010, [https://www.popularmechanics.com/cars/a5514/4350856/](https://www.popularmechanics.com/cars/a5514/4350856/).


    4. ^([4](#c04.xhtml#c4-note-0004-1)) Verlyn Klinkenborg, “Editorial Observer;
    Trying to Measure the Amount of Information That Humans Create,” *The New York
    Times*, November 12, 2003, [https://www.nytimes.com/2003/11/12/opinion/editorial-observer-trying-measure-amount-information-that-humans-create.html](https://www.nytimes.com/2003/11/12/opinion/editorial-observer-trying-measure-amount-information-that-humans-create.html).


    5. ^([5](#c04.xhtml#c4-note-0005-1)) Bretwell, “This Is How Many Autonomous Cars
    Will Be on Road,” TheStreet, April 23, 2018, [https://www.thestreet.com/technology/this-many-autonomous-cars-will-be-on-road](https://www.thestreet.com/technology/this-many-autonomous-cars-will-be-on-road).


    6. ^([6](#c04.xhtml#c4-note-0006-1)) Shiladnis, “Households Connected Devices
    Now Will Rise,” CIO, August 19, 2016, [https://cio.economimes.com/news-of-things/households-connected-devices-now-will-rise](https://cio.economimes.com/news-of-things/households-connected-devices-now-will-rise).


    # CHAPTER 5 Bridging the Gap


    ## When Too Much of a Good Thing Is Bad


    Like many companies, McAfee has a vision, mission, and values. Our vision reflects
    our aspiration for our industry and world. Our mission guides strategy. Our values
    express what we are. But what sets us apart from many companies is that we also
    have a pledge. While our vision, mission, and values reflect our ambition, thinking,
    and conduct, respectively, our pledge reminds us of our calling:


    > We dedicate ourselves to keeping the world safe.


    > Threats that are no longer limited to our computers, but are prevalent in every
    aspect of our world.


    > We will not rest in our quest to protect the safety of our families, our communities,
    and our nations.


    You’ll find these words prominently displayed in every McAfee location around
    the world. In addition to the pledge, our walls commemorate the signatures from
    thousands of McAfee employees volunteering to uphold that pledge. For the rest
    of employees in remote facilities, including our work-at-home population, chances
    are they electronically signed this pledge upon joining our company.


    The pledge is central to why McAfee does what we do. We’re in the business of
    cybersecurity. So it’s only natural that security is the lifeblood of our company.
    Even so, we’re not immune from adversaries intent on doing us harm. No company
    is.


    But how does your company, one that is likely not in the core business of cybersecurity,
    develop a culture that embeds security into the fabric of your organization? While
    I don’t envision walls featuring employees committed to keeping the world safe
    in your future, there are plenty of areas where your company can focus to make
    cybersecurity a meaningful component of your culture.


    Chances are your company and culture could benefit from a healthy dose of cybersecurity.
    There’s no doubt that the ongoing cybersecurity battle between the good guys and
    bad guys can tilt in favor of the former when more companies adopt cultures of
    security.


    Since our HR professionals are the experts among us who have devoted their careers
    to organizational health and are the champions behind the cultures sustaining
    it, I’m dedicating this chapter to them. While they are not exclusively responsible
    for company culture, they have more sway over it than just about any other party,
    except for the CEO. They inspire the rest of us by creating environments that
    attract and retain exceptional talent, something I’ve witnessed first-hand at
    McAfee in how a visionary CHRO can spread influence and impact far beyond her
    reach. And they have much more to offer in being part of the cybersecurity solution
    than they might think.

