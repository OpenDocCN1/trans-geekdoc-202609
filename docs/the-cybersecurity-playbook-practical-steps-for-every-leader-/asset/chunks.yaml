  trans: "\n\n## 安全评估与培训\n\n### 数据加密与意识\n\n* 数据在节点、模块、实例或虚拟服务器之间移动时是否进行了加密？如果没有，是否有添加此项能力的选项？请描述所使用的加密方法。\n\
    * 数据在静态状态下（例如存储在数据库中、存储在备份带上等）是否进行了加密？如果没有，是否有添加此项能力的选项？请描述所使用的加密方法。\n\n### 评估如何对员工进行网络安全意识和卫生协议的培训。\n\
    * 贵组织是否拥有安全意识和培训计划？\n* 组织是否确保人员每年接受组织安全政策的培训，并要求其了解这些政策的变更或更新？\n* 组织是否确保所有访问机密数据的人员都接受与其职责对应的信息安全培训？\n\
    * 组织是否确保所有访问个人身份信息（PII）的人员都完成了隐私培训课程，并了解所处理数据的任何特定隐私要求？\n\n* 对于您最具战略性的供应商，考虑每年聘请第三方对其安全实践进行审计。\n\
    * 如果您稍微担心某个希望与贵公司建立合作关系的第三方不符合您所要求的网络安全标准，请不要允许他们推进这种关系。\n\n## 网络安全专业人士的 W.I.S.D.O.M.\n\
    \n* 良好的网络安全卫生是不可妥协的。保持补丁更新——涵盖物理和虚拟基础设施。审查您的内部通信计划，以通知管理员漏洞情况，包括定期审查分发列表以确认其准确性。安装“闲置软件”（shelfware）。确保安全防护的正确配置。备份数据（并测试备份系统）。定期进行渗透测试，并向执行层和董事会提供进度报告。\n\
    * 首席安全官（CISO）和首席信息官（CIO）必须在指标和目标上达成一致。在每个计划周期初期，为适当的网络安全卫生建立角色和职责，包括补丁、备份、多因素身份验证等。\n\
    * 识别并分配预算用于 IT 与网络安全的比例。约定关键绩效指标（`KPIs`）和服务协议（`SLAs`），以优先考虑工作并在发生争议时解决问题。\n* 投资能够提升您的业务价值并降低竞争对手价值的技术。\n\
    \    * 云访问安全代理（`CASB`）技术有助于保护授权和未授权的云服务。\n    * 欺骗技术可以分散并混淆对手。\n* 使用人工智能（`AI`）能力识别最先进的威胁并解决人才短缺问题，但要了解其局限性。`AI`\
    \ 会产生更多的误报。传统的威胁情报有更多的漏报。两者结合可以产生高效能且误报率更低。\n* 在公司中竖扬网络安全的旗帜。\n    * 通过使用董事会及其高管的语言（风险管理）进行纵向传播。与财务部门合作，将网络安全术语转化为董事会最易理解和重视的指标和结果。\n\
    \    * 通过文化意识活动进行水平传播。聘请沟通专家与人力资源部门和营销部门合作，开发有效的活动，使网络安全成为每个人日常工作的一部分。向职能同仁交付可行的评分卡，衡量员工对网络安全原则的理解以及对公司政策的遵守情况。\n\
    \n## Notes\n\n1. D. Frances, “Ready for the Big One,” *Sonoma Index Tribune*,\
    \ 2014 年 1 月 30 日, `https://www.sonomanews.com/csp/mediapool/sites/SIT/News/story.csp?cid=3387701&sid=744&fid=181&sba=AAS`.\n\
    2. `https://www.usgs.gov/faqs/can-you-predict-earthquakes?qt-news_science_products=0#qt-news_science_products`,\
    \ 访问于 2019 年 3 月 20 日。\n3. “Quake Predictor Suspended from Job,” *San Marino Tribune*（以及\
    \ *San Marino News*），1989 年 11 月 23 日，星期四，第 10 页。\n\n# 致谢\n\n我了解到，生活中的几乎每件事都是团队运动，编写这本手册也不例外。感谢你，读者，选择了在网络安全领域投入自己的力量。我感谢以下个人，感谢他们为这本书的诞生所付出的无私贡献：\n\
    \n* **Steve Grobman**，感谢你将复杂概念转化为实用建议时展现出的卓越才华。你的技术天赋只有你敏捷的沟通能力可以与之媲。\n* **Chatelle\
    \ Lynch**，感谢你在该领域的远见卓识，并为世界级文化的繁荣营造了环境。你每天向我展示了什么是“为了赢而战”。\n* **Mark Murray**，感谢你精湛的叙事技巧。与你合作创造精彩且难忘的时刻是我的荣幸。\n\
    * **Chris Chaffin**，感谢你在整个写作过程中提供的宝贵反馈……而且还是在休假期间提供的！\n* **Giulia Mucciarelli**，感谢你在创作精美设计方面无与伦比的天赋，包括贡献了一个我自豪地展示在书架上的封面。\n\
    * **Morgan Bell**、**Gavin Donovan** 和 **Kevin Easterwood**，感谢他们仔细审读了每一章，确保了事实和技术上的准确性。\n\
    * **Jonathan Rozek**，感谢你在研究这一棘手话题的多个方面时表现出的坚定不移的韧性。\n* **Robert Green** 和 **Adam\
    \ Rosenblatt**，感谢他们设计并执行了一项出色的研究，触及了当今职场网络安全的文化脉搏。\n* **Michael Marto**，感谢你提供智慧和人脉，帮助我按照最初设想的方式让故事焕生命。\n\
    * 最后，但同样重要的，感谢 **Chris Young**，感谢你成为这样富有启发性的领导者。感谢你奉献职业生涯和数千名 McAfee 员工的工作来维护世界安全。你的热情无与伦比，你的天赋无法估量，你的原则毫不妥协。\n\
    \n# 关于作者\n\n**Allison Cerra** 在 18 岁时就发现了她生的使命，当时她偶然进入了营销复杂技术的终身职业。她以实用的方法解读重大技术趋势的融合（包括移动、云、大数据、安全和协作），并预示了这些力量未来将导向何方。无论是在分析宽带如何颠覆传统经济、技术如何影响并反映公司文化、虚拟与物理世界如何汇聚产生新的人类心理，还是坏分子如何挑战我们的数字自由，她已经在几本书中探索了技术、激励和行为之间的交汇。2015\
    \ 年，由于渴望站在这场至关重要的战斗正义的一方，Cerra 加入了 McAfee，目前她正将自己的营销志向与一项事业相结合：教育那些在被严重低估甚至忽视的虚拟战斗中的不知参与者。\n\
