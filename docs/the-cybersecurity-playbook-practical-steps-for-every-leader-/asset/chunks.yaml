    - 但为什么仅停于此？对手正开始操纵受害者的心理，就像他们历史上操纵受害者资金那样。也许在“泄露”被曝光时，他们会在其中掺杂一些假邮件。当这些伪造信息与真实的邮件混在一起时，它们很难被识别，解释起来更是困难。传播专家必须预见到，他们将如何对那些损害其品牌声誉的、公然伪造的邮件（或其他文件）有效地否认其有责任，以防发现自己的公司正沦为某场由敌手制造的、自身的“都市传说”的主角。


    虽然网络安全攻击对于传播专家来说是一个相对较新的现象，但危机并非如此。我们可以将这一研究领域的智慧应用到我们自己的行动蓝图中。


    ## 营销人员/传播者的 W.I.S.D.O.M. 指南


    如果运气青睐有准备的人，那么你需要在漏洞发生很久以前就做好计划。否则，时间不会站在你这边。当宝贵的几分钟流逝时，你最不希望你的执行团队被恐惧或愤怒等冲动情绪支配，因为这些情绪会蒙蔽理性思考。


    ### 构建一个具有明确高层支持的多维度传播计划。


    在这次练习中，要像 `CISO` 一样思考。`CISOs` 必须向董事会提供资产风险视图。在练习中，并非所有资产都是同等价值。你需要根据攻击的类型和严重程度，就公司应该做的事情进行同样的工作。并非所有攻击都是同等程度。


    与你的 `CISO` 合作，识别公司面临的常见威胁，例如网站篡改、勒索软件、客户记录泄露、员工记录泄露等。从那开始，对每种情况下的通知原则要给出非常具规定性的建议。


    - 即使法律没有要求，你会通知吗？

    - 如果你的公司对这次攻击不负责会怎样？这将如何改变你的信息的语气和内容？（考虑前面提到的“关联泄露”或“数据武器化”案例。）

    - 你会在什么时候通知？要意识到，越早越有利于引导舆论。事实上，关于危机传播的研究表明，最佳时机是事故发生后的一小时内。

    - 你会通知谁？

    - 如果你没有获得所有信息（这在泄露事件中很可能发生），你会说什么？

    - 你愿意向客户提供什么补偿或或什么样的以客户为中心的同理心（例如提供免费的身份保护，或提议承担因信用卡泄露导致的客户损失）？


    让你的 `CEO` 和执行领导团队参与这次练习，并根据攻击的严重程度，就沟通如何、何时以及沟通内容的指导原则达成共识。


    这次练习可能需要几周甚至几个月才能充分完成。由于你的公司很可能已经遭受了攻击只是还不知道，因此制定一个基于共识的正式计划是你的首要任务。


    ### 为计划中确定的每种场景创建传播模板。


    与 `Legal`（法律部门）合作来构建每条信息。编写邮件、网页文案、博客、电话脚本、新闻稿、媒体声明和其他资产，并为细节留出占位符，以便在攻击发生时填充。准备好网站（内部和外部的），以便在泄露发生时可以快速上线并传达泄露细节。


    信息必须在指令和语气之间取得正确的平衡。当危机发生时，客户希望知道你的公司考虑了他们的利益，并且局面在控制之中。遗憾的是，泄露事件很少能在这两点上都给你的公司提供灵活性。


    在证明你的公司控制着局面方面，请让你的模板遵循以下蓝图：


    - 谁受到了影响？

    - 哪些数据和/或系统丢失、被盗或以其他方式破坏？

    - 泄露发生在什么期间？

    - 利益者需要采取哪些预防措施？

    - 你的公司正在采取什么行动来纠正问题并降低再次发生的风险？


    即使你的公司尚未获得所有信息，尽早且准确地传达你已有的细节也能让你抢占先机（steal thunder）。


    接下来，在语气方面，要在这些信息中表现出同理心的同时保护你的法律利益——这是在练习早期让 `Legal` 介入的关键。关于这一点，让 `Legal` 审核所有模板化信息，这样当泄露发生时，在你插入任何剩余细节后，就能更接近获得最终批准。


    我们讨论过同理心的重要性。这一经过考验的危机传播准则在数据泄露世界中是真实的。`Ponemon` 调查了在 2014 年因数据泄露而终止与公司关系的消费者。当被问及这些公司可以做什么来维持关系时，更多的消费者想要一个诚挚的道歉（43%），而不是免费的身份盗用保护和信用监控服务（41%）。


    使你的语言匹配语气。同理心不适用于技术术语或法律术语。消费者可以一眼看穿虚假的道歉。`Ponemon` 2012 年的另一项研究发现，大约三分之一的消费者对他们收到的泄露后通信内容的长度或法律术语表示不满。


    ### 为每种攻击场景设计倒计时时间表。


    网络安全的货币是时间。请据此设计你的计划。为每种攻击向量制定分钟级的计划。在发现公司遭受泄露的最初几分钟内，你可能无法获得所有信息。


    幸运的是，你的传播计划将指导你的执行团队愿意发布什么以及何时发布。因为你是在没有时间压力的情况下建立此计划的，所以当你提交证据证明早期且频繁的沟通是有效的，你可以更有说服力（记住
    Home Depot 是一个完美的例子）——即使在并非所有事实都可用的情况下。


    你的倒计时时间表应该识别在计划的每个阶段谁负责向关键利益者发布信息和/或资产。超过 60% 的消费者表示，如果组织立即通知他们，他们对泄露公司回应的满意度将大大提高。


    确保你的计划包含员工，无论员工记录是否被泄露。在危机期间，员工（可能比客户更需要）需要确认雇主正在控制局面。员工是公司最好的品牌大使。如果你让他们对情况细节一所不知，他们就无法帮助你传播信息，使你再次成为“朋友之朋友”传言的潜在受害者。积极让员工参与以争取他们的支持并缓解任何焦虑。在策略方面，考虑在电子邮件和内网更新之外。至少召开一次全体会议来解释情况。此外，每天在固定的时间段内（例如
    30 分钟）开放会议热线，可以在那里向感兴趣的员工更新最新进展并回答任何问题。


    **练习、练习、再练习。** `CISOs` 进行红队演习，他们通过模拟对组织进行攻击来识别漏洞并加强防御。同样，`CMOs` 也应该练习危机演习，以测试他们的团队根据计划做出反应的有效性。危机管理专家建议至少进行一次，以建立组织的肌肉记忆。


