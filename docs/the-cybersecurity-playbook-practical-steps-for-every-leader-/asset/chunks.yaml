    \ has access** to an account and clean up the list to remove people who no longer\
    \ work on those projects.\n- **Use multifactor authentication.** For some systems\
    \ we can automatically detect if one of our users has it on, and the system will\
    \ tell us if a user turns it off, even for a few minutes as she switches to a\
    \ new computer, for example. With systems over which we have less direct control,\
