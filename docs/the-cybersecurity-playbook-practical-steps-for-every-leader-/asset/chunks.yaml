    “12 人”（西雅鹰队球迷的称呼）真的有那么大吗？大多数情况下，是的。但事实证明，他们的体育场也经过了特殊设计以保留声音。与其他声音会自然消散在空气中的开放体育场不同，西雅鹰队的体育场拥有第二看台和顶篷，可以将声音向下反射，当“12
    人”怒吼时会产生震天的嘈杂声。(1) 西雅鹰组织付出了巨大努力将“12 人”招募为团队的一部分——确保这些球迷能将集体力量带入比赛，几乎与球场上的球员并肩作战。


    “第 12 人”告诉我们，观众可以影响结果。但他们必须投入其中。他们必须被召唤。这就要你大显身手了。写这本书是为了让每个非专业人士意识到自己在永不停进行的网络安全战中的重要性。没有人可以责怪你没有尽早承担起责任。但在读完这本书之后，也没有人可以借口推卸你的责任。


    本书试图通过从许多其他值得读的书籍结束的地方继续对话，来推进讨论：为商业非专业人士提供一份可以立即执行的行动计划，成为组织网络安全议程的一部分。如果你仍然质疑这个议程是否应该包含你，请意识到它已经包含了你。网络犯罪分子正指望员工的冷漠或缺乏投入来对目标大肆破坏。如果你不积极站在公司的一边战斗，你很可能在不经意间成为了敌人一方的棋子。如果你重视在线自由，如果你在乎用于决策的数据没有被篡改，如果你坚持认为你的连接设备被用于善意而非伤害，那么你已经与工作场所的网络安全专业人士共享同一个使命。你与我们网络安全领域人的共同点比你想象的要多。


    ## W.I.S.D.O.M.


    在 McAfee（麦菲），执行团队非常重视发展。我们每季度开一次会，将“工作”带回“团队合作”中。我们互相指导，分享职业历程中的亲密故事，并重新承诺对彼此和员工更加真实。在这些发展课程结束时，我们会练习从我们的领导力开发伙伴
    AIP 小组那里学到的东西，被称为 `W.I.S.D.O.M.`。它代表 `W`hat `I`’ll `S`ay (and do) `D`ifferently
    `O`n `M`Monday（我周一将如何不同的说法和做法）。我们每个人都做出了 `W.I.S.D.O.M.` 承诺，约束自己和彼此实践我们学到的一项关键发展领域。


    同样，我想为这段旅程配备上 `W.I.S.D.O.M.`。这就是为什么在每一章之后，我都会给为你提供一份实用的处方，告诉你周一可以做些什么来提高组织的网络安全态势。有些建议表面上平庸，但对你的成功可能产生重大影响。另一些则需要更多努力，但登后的风景是值得的。在任何情况下，我都会将每章的处方限制在五项
    `W.I.S.D.O.M.` 以内，因为我想专注于那产生 80% 结果的 20% 的努力。


