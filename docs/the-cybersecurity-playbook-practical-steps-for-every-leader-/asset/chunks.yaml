    Finally, **carry the culture flag for cybersecurity** at your company. This requires
    two efforts. First, a CISO has to be able to speak the language of the board.
    Boardrooms speak the language of risk—and it’s always connected to company strategy.
    Work with business unit leaders, your CFO, and CEO to identify and prioritize
    the most strategic assets in the company. For each, identify the consequences
    of a breach. Finally, provide its current vulnerability. Immediately prioritize
    the high-priority/high-vulnerability assets for get-well plans. When invited to
    the boardroom, use this framework as your guide to define how your cybersecurity
    strategy maps to that of the broader company.


    In addition to spreading a culture of security vertically, do so horizontally
    through the organization’s employees. Take up arms with your HR counterparts in
    delivering effective training to raise employee awareness in their roles (just
    like McAfee’s CISO did with his phishing campaign). Find a way to make cybersecurity
    more than just an annual training event or a checklist of questions employees
    answer upon joining the company. Hire a communications expert on your team, working
    with your marketing department to define the role and skill set for the position.
    Have your communication ambassador work with Marketing and HR to develop effective
    internal campaigns that make cybersecurity part of everyone’s day job.


    ***


    It’s time for CISOs to embrace their role at the executive table. It’s time they
    nurture a cybersecurity culture that extends far beyond IT. It’s time for new
    partnerships with key stakeholders—namely HR and Marketing—to drive cybersecurity
    awareness up and security vulnerability down. It’s time to rewrite the end of
    the CISO’s story. Thanks to many progressive CISOs already leading the way, the
    rest of the cast need not imagine their storybook ending. It’s already becoming
    a reality.


    ## Notes


    1. ^([1](#c08.xhtml#c8-note-0001-1)) John Medina, *Brain Rules: 12 Principles
    for Surviving and Thriving at Work, Home and School* (Seattle, WA: Pear Press,
    2014).


    2. ^([2](#c08.xhtml#c8-note-0002-1)) Ibid.


    3. ^([3](#c08.xhtml#c8-note-0003-1)) [https://twitter.com/WaltHickey/status/345646754089291777](https://twitter.com/WaltHickey/status/345646754089291777).


    4. ^([4](#c08.xhtml#c8-note-0004-1)) Walt Hickey, “The Worst Chart in the World,”
    *Business Insider*, June 17, 2013, [https://www.businessinsider.com/pie-charts-are-the
    -worst-2013-6](https://www.businessinsider.com/pie-charts-are-the-worst-2013-6).


    5. ^([5](#c08.xhtml#c8-note-0005-1)) One of my favorite presentation books of
    all time is *Presenting to Win: The Art of Telling Your Story* by Jerry Weissman.
    If you don’t have time or budget for professional coaching, the book is an invaluable
    resource in providing tricks of the trade for telling an effective story.


    6. ^([6](#c08.xhtml#c8-note-0006-1)) David F. Larcker and Brian Tayan, Corporate
    Governance Research Initiative, “Strategy & Risk Oversight,” Stanford Business
    Corporate Governance Research Initiative, [https://www.gsb.stanford.edu /sites/gsb/files/publication-pdf/cgri-quick-guide-06-strategy-risk
    -oversight.pdf](https://www.gsb.stanford.edu/sites/gsb/files/publication-pdf/cgri-quick-guide-06-strategy-risk-oversight.pdf).


