    以下是床虫如此难以根除的原因。你可以拥有世界上最干净的房子。你可以虔诚地消毒你的床上用品。你可以对睡衣或任何应该接触你睡眠地点的衣物采取同样的措施。但如果你恰好入住了一家有床虫的酒店或乘坐了一架被虫害的飞机，只需要一只讨厌的床虫就能搭上你的便车（在这种情况下是你的行李或包裹其中的物品），并一路来到你的住所。


    如果你恰好住在公寓楼或其他多户单元，情况会更糟糕。现在，只需要与你共用一堵墙的邻居在卫生标准上比你稍微松懈，你可能就会发现家里出现了不速之宾之客（是的，这些坚定的寄生虫可以通过墙体空隙移动，并利用水管和电线通道作为它们的路线）。


    如果这还不够糟糕的话，由于床虫带有极大的负面声誉，大多数人都不愿意承认自己与这些吸血鬼共处。等到他们承认存在问题并寻求帮助时，可能已经面临着全面的虫害。如果你恰好过夜（比如在酒店里）或共用墙壁（比如是邻居）——你明白我的意思……。


    床虫是一个不幸的提醒，提醒我们我们之间是多么相互依赖的。这并不是一个依靠邻居帮助的问题，而是关于信任他们了解自己的环境（在一项研究中，近 50%患有床虫的人甚至不知道自己有床虫^(5)），并寻求专业帮助来消除它们。


    ## 网络安全寓喻


    这是一个非常迷的网络安全寓喻。公司并非孤立地运行在岛上，而是在高度复杂、互联的生态系统中运行。虽然一家公司可能执行良好的网络安全卫生，但它必须依靠它的邻居——任何与它有业务往且与其系统有连接的第三方——也这样做。否则，它就会让自己暴露在利用侧门和后门渗透的阴险捕食者面前。（顺便说一下，在这种情况下连接的“系统”并不一定需要通过广泛的网络。回想第
    3 章涵盖的网络安全卫生实践。只需一个粗心的合作伙伴留下一个无人看管且未加密的带有公司敏感文件的`USB`或`笔记本电脑`，你的公司就会暴露。）


    在我们享受了数十年相对无床虫的生活之后，我们被提醒，旧的依然可以常新。事物变化得越多，保持得也越多。尽管在对抗床虫方面取得了种种进步，我们再次在为床虫哀叹。


    ## CFO 和 CISO 的角色


    虽然变化是业务中唯一的永恒，但许多`CFOs`仍然可以拥有一项确定性：他们管理着公司的采购。由于这在很大程度上仍然属于财务职能，`CFO`与`CISO`之间的关系将变得更加紧密。


    正如床虫提醒我们彼此之间是多么依赖来警惕入侵者一样，第三方关系也充当了额外的暴露点，对手可以利用这些点对我们的公司造成伤害。考虑来自 Ponemon 研究^(6)的以下几点，它们反映了严酷的现实：


    *   59%的组织确认他们曾由于其中一个第三方导致了数据泄露。

    *   仅 29%的人表示，他们会从第三方本身获知此类泄露。

    *   76%的人说涉及供应商的网络安全事件正在增加，但只有 46%的人认为管理外包关系风险是优先要事项。

    *   57%的人不知道其组织的供应商保护措施是否足以防止泄露。


    在积极方面，这些指标有很大的改进空间。第三方安全管理对许多组织来说是比较新的。正如上面的数字所示，它至关重要。`CFOs`代表组织冲锋，确保采购流程能够充分对第三方的网络安全状况进行审查。这是你的`CISO`将帮助你提出正确问题的地方。


    ## 外包趋势


    当然，最终的可信第三方关系是公司完全外包某项功能或其部分。72%的组织外包了该功能的至少一部分，31%的计划增加外包比例^(7)


    曾经考虑外包自己的网络安全环境是荒谬的。但网络安全似乎正在追随其`IT`祖先的脚步，因为让第三方保护组织最珍贵的数字资产正变得越来越可。当然，全球网络安全人才的短缺只是火上浇油。公司不再激烈争夺市场上并不存在的网络安全人才，而是选择雇佣具有这些专业知识的第三方，以至少增强内部的人员能力。


    特别是安全运营中心（`SOC`）最可能外包的领域包括`渗透测试`（75%的组织外包）、`威胁情报收集和馈`（54%）以及`数字和恶意软件取证`（51%）^(8)


    外包网络安全的一个或多个领域有几个优点。正如大多数外包一样，公司通过雇佣具有相当网络安全基础设施的第三方可以节省资金并减少初始资本支出。公司还可以通过与这些托管安全服务提供商（`MSSPs`）谈判服务水平协议来缓解过时的风险。最后，`MSSPs`专门负责网络安全。他们可以专注于核心能力，让客户有更多时间专注于自己的业务。


    ## 完全外包的风险


    正如书中的大多数主题一样，这个问题包含了许多灰色地带。虽然外包网络安全计划对于许多公司来说是完全（特别是对于人员限制严格的公司），但网络安全类似于慈善——始于内部。将网络安全状况的完全责任交给第三方是一项风险业务。`MSSP`在网络安全经验上的优势无法弥补其对你公司独特环境的理解。因此，它可能会忽略掉内部团队可以轻易察觉的环境异常。由于`MSSP`支持多个客户（一方面，这是一个积极因素，因为它拥有更广泛的市场视角），你可能会发现投入到公司需求的时间减少了——如果公司完全交出钥匙，这一切都可能导致网络安全状况欠佳。


    这是`CFOs`及其团队应该产生重大影响的另一个领域。


    财务专业建议


    作为组织资源和预算的关键分配者，财务专业人士对网络安全文化有很多贡献，特别是帮助`CISOs`及其团队使用业务语言。这需要放弃不适用于网络安全的语言——特别是“投资回报率”。一旦`CFOs`减轻`CISOs`回答不可能问题的负担，团队就可以认真合作定义网络安全投资对业务的价值。

    '
- fmt: '

    The goal is mitigating risk as efficiently as possible. There are plenty of questions
    to get CISOs and CFOs communicating at a different level, such as:


    *   What asset(s) are at risk?

    *   What is the strategic value of the asset(s)?

    *   What is the current level of vulnerability for the asset(s)?

    *   What are the consequences (financial damages, intellectual property exposure,
    reputational risk) in the event of a breach?


    To ensure cybersecurity is not an aftermarket afterthought, CFOs should ask the
    following for business cases submitted by other leaders:


    *   How does the new [market, internal technology, customer product, etc.] change
    the attack surface for the company?

    *   How does it alter the risk profile of the company’s most strategic assets?

    *   [Assuming risk is increased] What additional investment is required (one-time
    and recurring) to bring the risk profile to its acceptable baseline? Is this investment
    included in the ROI analysis?


    In the way of `ensuring resources are spent as efficiently as possible, it’s very
    fair to ask the CISO for her metrics` in the following areas:


    *   How much investment in cybersecurity has been made in products still sitting
    on the shelf (shelfware)?

    *   What is the plan for deploying those products?

    *   When was the last audit performed to ensure security products are configured
    properly? What were the results?

    *   When was the last penetration test performed? What were the results?

    *   When was the last cybersecurity training conducted for all employees? What
    were the results?


    Next, as the leaders of procurement, `finance professionals lead their organizations
    in mitigating breach-by-association through third-party exposure`. Start with
    a comprehensive inventory of all third parties (something only 34 percent of organizations
    say they have, per Ponemon^([9](#c07.xhtml#c7-note-0009)) ). From there, conduct
    an audit of cybersecurity defenses and practices. The bad news is this could take
    significant time and effort. The good news is that the same auditing questions
    can be used to qualify any new third party interested in becoming a vendor.


    The questions will focus in multiple areas to assess the aspiring partner’s cybersecurity
    posture, including:


    *   Looking at how the third party assesses and updates access rights and privileges.

    *   Understanding their business continuity process and how often they test it.

    *   Searching their change-control guidelines for new users and/or new software
    for their systems.

    *   Clarifying how any data passed between your company and theirs will be used,
    protected, and disposed of at the appropriate time (upon contract termination
    and/or in accordance with compliance standards).

    *   Knowing how they encrypt data at various states (at rest, in use, and in motion).

    *   Assessing how they train their employees on cybersecurity awareness and hygiene
    protocol.


    `For your most strategic suppliers, consider hiring a third party to audit their
    security practices once a year.` Vetting suppliers is a great first step. But
    ensuring their security practices don’t become lax once they’ve landed you as
    their customer requires even greater diligence.


    Finally, be careful what you allow third parties to promote about your company.
    It’s common practice for partners to issue press releases announcing their business
    arrangements. It’s also normal to see companies splash the logos of all their
    customers, suppliers, and/or partners across their websites. I’m a marketer, so
    I get it. Using the power of the ecosystem to increase brand value for all parties
    is generally a good thing.


    But use caution. Any third party wanting to promote their relationship with your
    company alerts hackers to the side doors and back doors through which they may
    penetrate your company. It shows these parasites of the cyber kingdom how to infiltrate
    your company, once they know the neighbors that share one of your walls. If there
    is the slightest concern that one of your third parties wanting to promote their
    relationship with your company does not hold itself to the cybersecurity standards
    you require, `don’t allow them to promote it`.


    This is just a subset of an extensive checklist to ensure your third parties are
    as disciplined about securing your organization from threats as you are. If they’re
    serious about earning your business, shouldn’t they be just as inclined to protect
    it?


    ***


    The worlds of finance and cybersecurity may not seem to fit together on the surface.
    But a deeper look reveals there’s more in common than initially meets the eye.
    At its core, cybercrime is big business—something that a CFO can understand. In
    turn, cybersecurity is about risk management—another concept very familiar to
    finance types. CFOs can help CISOs speak the language of the boardroom (risk management)
    more fluently. In turn, CISOs can help those in procurement speak the language
    of cybersecurity when vetting third parties. When the two functions come together
    to admire their similarities and put aside their differences, both emerge stronger
    from the collaboration. After all, bad actors already know the value of collaborating.
    Isn’t it time CFOs and CISOs realized the same?


    ## Notes


    1.  ^([1](#c07.xhtml#c7-note-0001-1)) McAfee, “The Economic Impact of Cybercrime—No
    Slowing Down.”

    2.  ^([2](#c07.xhtml#c7-note-0002-1)) McAfee Labs Threat Report, December 2018,
    [https://www.mcafee.com/enterprise/en-us/assets/reports/rp-quarterly-threats-dec-2018.pdf](https://www.mcafee.com/enterprise/en-us/assets/reports/rp-quarterly-threats-dec-2018.pdf).

    3.  ^([3](#c07.xhtml#c7-note-0003-1)) Alfred Ng, “WannaCry Loses Its Switch, So
    Out,” CNET, May 15, [https://www.cnet.com/news/wannacry-loses-its-switch-so-out/](https://www.cnet.com/news/wannacry-loses-its-switch-so-out/).

    4.  ^([4](#c07.xhtml#c7-note-0004-1)) Sean Rossman, “Bed Bugs Disappeared for
    40 Years, Now They’re Back with a Vengeance,” USA Today, June 21, [https://www.usatoday.com/story/nation-now/2017/06/21/bed-bugs-disappeared-40-years-now-theyre-back-with-a-vengeance/39902501/](https://www.usatoday.com/story/nation-now/2017/06/21/bed-bugs-disappeared-40-years-now-theyre-back-with-a-vengeance/39902501/).

    5.  ^([5](#c07.xhtml#c7-note-0005-1)) Korin Miller, “You Can Have Bed Bugs and
    Not Know It—Here’s What to Look Out,” Self, April 6, 2016, [https://www.self.com/story/you-can-have-bed-bugs-and-not-know-it-heres-what-to-look-out/](https://www.self.com/story/you-can-have-bed-bugs-and-not-know-it-heres-what-to-look-out/).

    6.  ^([6](#c07.xhtml#c7-note-0006-1)) Ponemon Institute, “Data Risk in the Third-Party
    Ecosystem—Third Annual Report,” November 2018.

    7.  ^([7](#c07.xhtml#c7-note-0007-1)) Deloitte, “Deloitte’s 2016 Global Outsourcing
    Survey,” 2016, [https://www2.deloitte.com/content/dam/Deloitte/nl/Documents/operations/deloitte-nl-s&o-global-outsourcing-survey.pdf](https://www2.deloitte.com/content/dam/Deloitte/nl/Documents/operations/deloitte-nl-s&o-global-outsourcing-survey.pdf).

    8.  ^([8](#c07.xhtml#c7-note-0008-1)) EY Global Information Security Survey 2018–19,
    [https://www.ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf](https://www.ey.com/Publication/vwLUAssets/ey-global-information-security-survey-2018-19/$FILE/ey-global-information-security-survey-2018-19.pdf).

    9.  ^([9](#c07.xhtml#c7-note-0009-1)) Ponemon Institute, “Data Risk in the Third-Party
    Ecosystem—Third Annual Report,” November 2018.

