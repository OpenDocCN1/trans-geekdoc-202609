    I’m certainly outside my comfort zone starting off a book with my name on it by
    describing an embarrassing security failure on my watch. Could it have been far
    worse? Absolutely. Should it never have happened? Absolutely.


    And could it have been you, instead of me? Again, absolutely.


    By telling you this story, I want to set a tone of honesty that’s also needed
    in your business when you work to repel the bad guys: you need to develop a culture
    of security that allows people not only to help each other, but also to be honest
    with each other when they see unsafe practices. It’s honesty without anger or
    blame or retribution, and it’s crucial to making the culture work.


    The second reason for describing our social media hack is so you can take these
    lessons and immediately apply them to where you see chinks in your own security
    armor.


    ## Why Me?


    There is no shortage of cybersecurity books available for your consumption from
    reputable, talented authors with a variety of experiences. You’ll find some from
    journalists, who have dissected some of the most legendary breaches in history.
    You’ll find others from luminaries, who speak with authority as being venerable
    forefathers of the industry. And you’ll find more still from technical experts,
    who decipher the intricate elements of cybersecurity in significant detail.


    But, as I type this, you won’t find many cybersecurity books authored by marketers.
    And probably fewer still from marketers with just a few years in the industry.
    So why trust this author with a topic of such gravity?


    Think of me as a hybrid between marketing and technology. I’ve spent my career
    translating technical concepts into everyday language. I’ve studied the intersection
    of work and technology to understand how corporate culture is shifting.


    So if you’re a generally nontechnical person, rest assured that I strive to give
    you sufficient education to understand the nuances of this thorny subject, without
    overwhelming you with technical details. If you’re more technical than I am, while
    I won’t dumb down this topic, I will provide prescriptions that every employee—technical
    or otherwise—can practice to protect her organization. Finally, if you are one
    of my cybersecurity brethren, I hope you read and enjoy this book as a glimpse
    into our world. Then, I want you to pass it along to your non-cybersecurity colleagues
    to recruit them in our fight.


    ## Why You?


    You may consider yourself someone who doesn’t have much to offer in the realm
    of cybersecurity. After all, how could employees, managers, executives, and board
    members who are not within cybersecurity’s corridors really play a meaningful
    role in a game they may not even understand?


    This is where I turn to the world of professional sports for inspiration, as it
    often reveals many lessons we can all learn about the power of teamwork. While
    I’m no sports junkie, I do have a soft spot in my heart for American football.
    That’s because I have fond memories from my earliest years in grade school of
    sitting on my family room couch, next to my dad, watching his favorite team, the
    Dallas Cowboys, play.


    Like millions of us who tune in to watch our favorite teams, I’m a spectator in
    the world of professional sports. Watching the game is about as close as the majority
    of us will ever come to playing it. Spectators hardly influence the outcome of
    a game. That’s a role left to the far more important athletes and coaches on the
    field or on the court who, by their talent, tenacity, and teamwork, ultimately
    determine whether a game is won or lost.


    I used to believe that. And then I was introduced to the Seattle Seahawks’ 12th
    Man. The Seattle Seahawks are a professional U.S. football team. In football,
    there are 11 active players allowed on the field, per team, for any play. But
    the Seahawks recognize 12 active teammates—represented by 11 players and the equally
    important spectator crowd.


    I eventually came to realize that Dad and I did not want our Cowboys facing the
    Seahawks on the latter’s home turf. That’s because the Seahawks’ stadium is not
    one that favors opponents. Its noise level, created by the 12th Man, has been
    measured at only a couple of decibels below that of an aircraft carrier flight
    deck. As it turns out, these spectators have played quite a meaningful role in
    influencing the outcome of more than a few games. In three seasons, the Seahawks
    scored 26 wins against two losses on their home field. The 12th Man has twice
    set the world record for crowd noise and is even to blame for at least one minor
    earthquake.


    Their revered football team knows just how important these “spectators” are. The
    Seahawks retired the number 12 jersey on December 15, 1984, in honor of their
    fans. You’ll find a giant flagpole with the number 12 blazoned across it flying
    proudly in their stadium. When the team took the field for one of their Super
    Bowl appearances, they were led by someone carrying the 12 flag.'
