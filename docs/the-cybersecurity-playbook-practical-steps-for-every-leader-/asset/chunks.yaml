  trans: "\n\n- 不要落入社交工程攻击的陷阱。留意恶意邮件的迹象，例如发件人的电子邮件地址。不要点击来自未知来源的链接。\n- 要积极主动，立即将任何可疑邮件报告给您的网络安全团队。\n\
    - 确保笔记本电脑、移动设备和其他个人技术的安全补丁保持最新状态。当您的安全组织推送安全更新时，不要推迟。\n- 养成良好的网络安全习惯——使用强密码，不要重复使用密码，避免使用未加密的\
    \ USB 设备。\n\n## 产品开发人员的 W.I.S.D.O.M.\n\n- 在需求发现阶段询问客户关于他们的网络安全需求。\n- 将安全性作为任何最小可行性产品（MVP）需求的一部分。\n\
    - 在设计任何新产品或服务时，清晰且有意识地定义您的数据需求。\n- 将安全所有权融入产品生命周期的每个阶段。\n- 如果产品发布过程中的任何一点缺乏或缺失安全性，应立即停止发布。奖励并公开表扬公司其他采取同样做法的员工。\n\
    \n## 人力资源专业人士的 W.I.S.D.O.M.\n\n- 扩大网络安全人才的范围——男性和女性、少数民族和非少数民族、艺术与科学（STEAM）。审查目前的网络安全职位招聘公告，以寻找多样化的技能。寻找包含无意识偏见的面试问题，包括常见的类型，如“请告诉我你曾何时……”或“请谈谈网络安全领域最新热门的创新”。在每个面试小组中至少安排一名多元背景的领导者。\n\
    - 搜索贵公司的价值观，看看可以在哪里加入 `securely`（安全地）或其派生词，以在不改变其目的的情况下改变其适用范围。\n- 奖励并认可有助于公司网络安全防御的行为。\n\
    - 与您的 `CISO` 合作，识别并控制组织最宝贵资产的访问权限。寻找一种机密且无威胁的方式，让尽职业业的员工看到类似于恶意内部威胁的情况时能够吹哨或提出警报。当他们这样做时，给予适当的奖励。\n\
    - 确保执行团队的每位成员都至少有一个网络安全关键绩效指标（`KPI`）。\n\n## 营销/传播人员的 W.I.S.D.O.M.\n\n- 构建一个具有明确高层支持的多维度沟通计划。该计划应包含对以下问题的回答：\n\
    \    - 即使法律没有要求，你们会通知吗？\n    - 如果公司不对攻击负责会怎样？这将如何改变你们信息的信息的语气？（以关联性泄露和数据武器化用例为例。）\n\
    \    - 你们会在什么时候通知？\n    - 你们会通知谁？\n    - 如果没有立即获得所有信息，你会说什么？\n    - 你愿意向客户提供什么补偿或作为以受害者为中心的同情表现（例如，免费的身份保护或提议承担信用卡泄露导致的客户损失）？\n\
    - 为计划中识别的每种场景创建沟通模板。在模板中留出占符以回答以下问题：\n    - 谁受到了影响？\n    - 哪些数据和/或系统丢失、被盗或以其他方式遭到破坏？\n\
    \    - 泄露发生在什么时间段？\n    - 利益者需要采取哪些预防措施？\n    - 贵公司正在采取什么行动来纠问题并降低再次发生的风险？\n-\
    \ 为每种攻击场景设计节奏表（tick-tock schedule）。\n- 确保您的计划包含员工，无论员工记录是否被泄露。\n- 每年至少对您的计划进行一次沟通演练。\n\
    \n## 财务专业人士的 W.I.S.D.O.M.\n\n- 通过提出以下问题，帮助 `CISOs` 及其团队使用业务语言——风险管理：\n    - 哪些资产面临风险？\n\
    \    - 资产的战略价值是什么？\n    - 资产目前的漏洞水平如何？\n    - 如果发生泄露，后果是什么（财务损失、知识产权泄露风险、声誉风险）？\n\
    - 为了确保网络安全不是事后才想起来的亡足之炊，`CFOs` 应该对其他领导提交的业务案例提问以下问题：\n    - 新的 [市场、内部技术、客户产品等]\
    \ 如何改变公司的受攻击面？\n    - 它是如何改变公司最具战略资产的风险概况的？\n    - [假设风险增加] 需要多少额外投资（一次性和复性性的）才能将风险概况带到可接受的基准？此项投资是否包含在\
    \ `ROI` 分析中？\n- 通过向 `CISOs` 提问尽可能有效地降低风险，例如：\n    - 对于仍放在架子上的产品（闲置软件），网络安全方面投入了多少？\n\
    \    - 部署这些产品的计划是什么？\n    - 上次确保安全产品配置当的审计是什么时候进行的？结果如何？\n    - 上次渗透测试是什么时候进行的？结果如何？（渗透测试在第二章中涵盖，指的是测试组织网络安全态的有效性，通常通过付费第三方尝试突破公司的防御。）\n\
    \    - 上一次对员工进行网络安全培训是什么时候？结果如何？\n- 通过对供应商的安全态势进行评估来降低第三方风险，包括：\n    - 查看第三方如何评估和更新访问权限和权利。\n\
    \        - 你们是否定期审查访问权限，以确保访问权限基于其角色的最小权限需求？\n        - 在员工、承包商、客户、业务伙伴或参与第三方的状态发生变化时，是否及时对组织的系统、信息资产和数据的访问进行了撤销或修改？\n\
    - 理解他们的业务连续性流程以及测试频率。\n    - 你们是否有针对计划和计划外停机的业务连续性和灾难恢复计划，并且每年至少测试一次？如果是，请描述执行的测试类型。\n\
    \    - 你们是否定期备份，以便任何数据损坏都能通过备份恢复，从而仅产生可接受的数据丢失？是否定期测试从备份中恢复？\n- 搜索针对新用户和/新软件的变更控制指南。\n\
    \    - 你们的所有系统是否都更改了默认用户名和密码？\n    - 你们是否建立了控制措施来监控和限制在系统上安装未经授权的软件（例如上传的恶意软件、禁用自动运行、过高的管理员权限）？\n\
    - 明确你们与他们之间传递的任何数据如何被使用、保护并在适当的时间处置（在合同终止时或根据合规标准）。\n    - 你们是否有相关程序来确保生产数据不会在非生产环境中被复制或使用？\n\
    \    - 当硬盘或数据不再需要时，是否从存储器中安全地删除？在处置或退货前是否销毁了故障的硬盘？\n    - 你们是否确保在合同终止后 30 天内删除所有机密数据？\n\
    - 了解他们在各种状态下（静态、使用中和传输中）对数据进行加密的方式。\n\n"
- fmt: "\n## Security Assessment and Training\n\n### Data Encryption and Awareness\n\
    \n* Is data encrypted when it moves between nodes, modules, instances, or virtual\
    \ servers? If not, is there an option to add this capability? Describe the encryption\
    \ used.\n* Is data encrypted when it is at rest (e.g., stored in a database, stored\
    \ on a backup tape, etc.). If not, is there an option to add this capability?\
    \ Describe the encryption used.\n\n### Assessing how they train their employees\
    \ on cybersecurity awareness and hygiene protocol.\n* Does your organization have\
    \ a security awareness and training program?\n* Does the organization ensure that\
    \ personnel are annually trained in the organization’s security policies and required\
    \ to know changes or updates to these policies?\n* Does the organization ensure\
    \ that all personnel with access to confidential data have information security\
    \ training for their respective roles?\n* Does the organization ensure that all\
    \ personnel with access to personally identifiable information (PII) complete\
    \ a privacy training class and are knowledgeable of any specific privacy requirements\
    \ for the data being handled?\n\n* For your most strategic suppliers, consider\
    \ hiring a third party to audit their security practices once a year.\n* If there\
    \ is the slightest concern that one of your third parties looking to promote a\
    \ relationship with your company does not hold itself to the cybersecurity standards\
    \ you require, don’t allow them to promote it.\n\n## W.I.S.D.O.M. for the Cybersecurity\
    \ Professional\n\n* Sound cybersecurity hygiene is nonnegotiable. Keep patches\
    \ updated—on both physical and virtual infrastructure. Review your internal communications\
    \ plan for notifying administrators of a vulnerability, including a periodic review\
    \ of distribution lists to confirm accuracy. Install shelfware. Ensure proper\
    \ configurations of security defenses. Back up your data (and test the backup\
    \ system). Conduct regular penetration testing and provide regular readouts on\
    \ progress to executives and board members.\n* CISOs and CIOs must align on metrics\
    \ and goals. Establish roles and responsibilities for proper cybersecurity hygiene,\
    \ including patching, backups, multifactor authentication and the like, at the\
    \ beginning of each planning cycle.\n* Identify and allocate what portion of the\
    \ budget will serve IT versus cybersecurity. Agree to key performance indicators\
    \ (`KPIs`) and service level agreements (`SLAs`) to prioritize efforts and resolve\
    \ disputes when they arise.\n* Invest in technologies that drive your business\
    \ value up and that of your adversaries, down.\n    * Cloud access security broker\
    \ (`CASB`) technologies help secure sanctioned and unsanctioned cloud services.\n\
    \    * Deception technologies distract and confuse adversaries.\n* Use artificial\
    \ intelligence (`AI`) capabilities to identify the most advanced threats and address\
    \ the talent shortage, but know its limitations. `AI` creates more false positives.\
    \ Traditional threat intelligence has more false negatives. Both together yield\
    \ high efficacy with lower false positives.\n* Carry the culture flag for cybersecurity\
    \ at your company.\n    * Spread it vertically by speaking the language of the\
    \ boardroom and its executives (risk management). Partner with the finance organization\
    \ to translate cyber-speak into metrics and outcomes most understood and valued\
    \ by the board.\n    * Spread it horizontally through culture awareness campaigns.\
    \ Hire a communications expert to work with HR and Marketing to develop effective\
    \ campaigns that make cybersecurity part of everyone’s day job. Deliver actionable\
    \ scorecards to functional peers that measure employee understanding of cybersecurity\
    \ principles and adherence to company policies.\n\n## Notes\n\n1. D. Frances,\
    \ “Ready for the Big One,” *Sonoma Index Tribune*, January 30, 2014, `https://www.sonomanews.com/csp/mediapool/sites/SIT/News/story.csp?cid=3387701&sid=744&fid=181&sba=AAS`.\n\
    2. `https://www.usgs.gov/faqs/can-you-predict-earthquakes?qt-news_science_products=0#qt-news_science_products`,\
    \ Accessed March 20, 2019.\n3. “Quake Predictor Suspended from Job,” *San Marino\
    \ Tribune* (and *San Marino News*), Thursday, November 23, 1989, page 10.\n\n\
    # Acknowledgments\n\nI’ve learned that just about everything in life is a team\
    \ sport and writing this playbook is no exception. I am grateful to you, the reader,\
    \ for taking your position on the cybersecurity field. And I am indebted to the\
    \ following individuals for your selfless contributions in making this book possible:\n\
    \n* **Steve Grobman** for your brilliance in translating complex concepts into\
    \ practical prescriptions. Your technical genius is rivaled only by your deft\
    \ ability to communicate.\n* **Chatelle Lynch** for being a visionary in your\
    \ field and cultivating an environment for a world-class culture to thrive. You\
    \ show me every day what it means to play to win.\n* **Mark Murray** for your\
    \ masterful storytelling skills. It’s an honor to partner with you in creating\
    \ amazing and memorable moments.\n* **Chris Chaffin** for giving me invaluable\
    \ feedback throughout the writing process . . . and doing so while on vacation,\
    \ no less!\n* **Giulia Mucciarelli** for your incomparable talent in creating\
    \ beautiful designs, including contributing to a cover I’m proud to display on\
    \ my bookshelf.\n* **Morgan Bell**, **Gavin Donovan**, and **Kevin Easterwood**\
    \ for meticulously poring over each chapter with an eye for factual and technical\
    \ accuracy.\n* **Jonathan Rozek** for your unwavering tenacity in researching\
    \ multiple aspects of such a thorny topic.\n* **Robert Green** and **Adam Rosenblatt**\
    \ for designing and executing a brilliant research study that tapped into the\
    \ cultural pulse of cybersecurity in today’s workplace.\n* **Michael Marto** for\
    \ lending your wisdom and connections to help me bring a story to life in the\
    \ way I first imagined it to be.\n* And last, but certainly not least, **Chris\
    \ Young** for being the inspirational leader you are. Thank you for dedicating\
    \ your career and the work of thousands of McAfee employees to keeping the world\
    \ safe. Your passion is without equal, your talent is without measure, and your\
    \ principles are without compromise.\n\n# About the Author\n\n**Allison Cerra**\
    \ found her life’s calling at 18 years of age, when she fortuitously stumbled\
    \ into a lifelong career of marketing complex technologies. She brings a practical\
    \ approach to demystifying the confluence of significant technology trends—including\
    \ mobility, cloud, big data, security, and collaboration—and signaling where these\
    \ forces could lead cultures in the future. Whether in dissecting how broadband\
    \ upends traditional economies, how technology influences and reflects company\
    \ culture, how virtual and physical worlds converge to create a new human psyche,\
    \ or how bad actors are motivated to challenge our digital freedom, she has explored\
    \ the intersection of technology, incentives, and behaviors in several books.\
    \ In 2015, motivated by a desire to stand on the good side of a fight too important\
    \ to lose, Cerra joined McAfee, where she currently marries her calling for marketing\
    \ with a cause of educating unwitting participants in a virtual battle that is\
    \ underestimated, if not ignored, by far too many.\n\n# Index\n\n## A\n\n* Abdulmutallab,\
    \ Umar Farouk, 178\n* Administrators, locking out, 10\n* Adversaries, 47–68\n\
    \    * adversarial machine learning (`AML`), 164–165\n    * airline industry's\
    \ response to hijacking, 175–179\n    * botnets, 77\n    * cybersecurity hygiene\
    \ importance and, 63–66\n"
