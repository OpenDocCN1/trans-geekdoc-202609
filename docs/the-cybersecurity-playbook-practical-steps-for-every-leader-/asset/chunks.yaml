  trans: '

    由于没有足够的人手应对问题，首席信息安全官（CISO）不得不求助于来自大量网络安全供应商的系列产品，他们竞争资金以填补这一空白。与劳动力市场的短缺形成鲜明对比的是，网络安全产品严重过剩，都在争夺
    CISO 有限的预算。截至本文写作，已有 3,500 家网络安全供应商在招揽 CISO。每家供应商都提供一种或多种防御技术，其中许多承诺能够解决一小部分（如果不是大部分）网络安全挑战。


    好东西可能也会太多。CISO 可选的丰富网络安全技术恰恰说明了这一公理。CISO 试图证明自己的价值并预测下一次威胁，在历史上他们总是急于采用最新的防御技术，作为其对抗敌者的武器库的一部分。


    但在执行这一策略时，他们吃了亏头。这是因为，争夺每一分钱的碎片化供应商格局本身就是一个复杂的科技泥潭，这些技术在大多数情况下无法良好协同工作。很多时候，这些技术被推销、购买，然后放在架子上。预算被消耗了，“闲置软件”不断增加，而组织并没有因为这些创新、意图或投资而变得更加安全。即使技术最终离开了货架并投入部署，它们也很可能没有与组织的其余防御系统集成。


    想象一下，在战争中你的库存里是一堆杂乱无章的火器。想象一下部署这些武器时缺乏一致，无法充分覆盖你对敌人的防线。现在，想象你的战斗员之间无法通信，无法分享他们遭遇的威胁信息，无法共同增强你的协同防御。


    你可能不需要想象。如果你的公司有这种情况，只需访问其安全运营中心（`SOC`）即可，那是神经中心，你的网络安全同事在公司和无尽攻击之间担任第一响应者。这些前线网络安全专业人员通常继承了多年来的补丁式技术和工具，这些通常是公司几任
    CISO 期间采用的。许多产品并不共享威胁情报，更不用说让网络安全专业人员的工作更容易。你会发现你的网络安全同事在为工具工作，而不是工具为他们工作。


    研究网络安全市场的独立行业分析企业策略集团（ESG）报告称，40% 的组织部署了超过 25 种网络安全工具。大约相同比例的人承认手动收集情报馈送。27% 的人认为安全团队将*大部分*时间花在救火上，而不是战略项目上，导致了员工的倦怠和流失——对于面临全球人才短缺危机的
    CISO 来说，这是灾难性的后果。


    这还不如此，网络安全行业还隐藏着一个肮脏且不可避免的秘密。事实是：没有任何一种产品可以击败网络犯罪。你可能不会觉得这奇怪。毕竟，这等同于在武器库中只有一种武器就进入了持续战争。你不会这样做并指望能坚持多久。


    但现实情况不仅于此。不仅意味着不存在所谓的“银弹”式防御方案可以对所有威胁产生免疫，而是因为，*每种*防御技术在*首次*部署到市场时最有效。这与我们在 IT
    领域所学到的传统常识完全相反。


    想一想。当一种新的 IT 技术进入市场时，大多数公司都不愿做首批采用者。毕竟，为什么要为一个未经证明的技术充当小白鼠呢？让其他公司先走，修复漏洞，并让技术变得更好（更便宜）。然后，再快速跟进部署。对于部署你那些普通的
    IT 技术来说，这似乎是一个明智得多的策略。


    但网络安全技术从根本上是不同的。当一个 IT 组织部署最新的填空型 IT 技术时，对面并没有对手在积极阻碍其成功。网络安全并非如此。当市场上有足够多的机构部署了针对某种威胁高度有效的防御技术时，对手就会回到自己的产品实验室，开发针对它的反制措施。他们最终会找到绕过该防御技术的方法，或者让其随着时间推移而失效。（正是在那时，像
    `McAfee` 这样的网络安全供应商会回到我们的实验室，开发针对反制措施的反制措施，竞争继续。）


    时间在网络安全中至关重要。新防御技术尽早进入市场尤为重要。这是因为该技术将为最早的采用者提供最大的效能。


    所以，让我们尝试像 CISO 一样思考，来解决这个难题：


    1.  没有一种单一的防御技术可以击败所有类型的网络攻击——攻击种类实在太多了，而且敌人每天都在创新。你需要部署来自多个供应商的大量产品，以建立起你最佳的统一防御。

    2.  每种防御技术在首次部署到市场时最有效。简而言之，你想成为最新网络安全技术的早期采用者。这是因为对手还没有足够的动力或时间来开发针对它的反制措施。当他们这样做时，网络安全供应商与对手之间就会展开猫鼠游戏，双方都针对对方开发反制措施。

    3.  所以，率先部署非常重要。但你（以及行业其他部分）正面临着人才短缺。你的团队中没有足够的人来快速实施防御技术。即使你可以做到，很可能你也没有以协调的方式部署这些防御措施，导致你环境中的所有技术无法协同工作、共享威胁情报并使用一致的工具运行。

    4.  而且由于你的防御技术无法无缝共享威胁情报，你有限的网络安全人员不得不来填补漏洞。鉴于威胁的数量和复杂性呈指数级增长，你的团队必须在检测和修复环境中最隐蔽的威胁时，从噪音中识别出信号——在你的敌人占据上风之前。


    谁想要这种挑战？并不多。这就是为什么网络安全专业人员真正是我们公司的无名英雄。他们为我们而战。他们处于阴影中，隐形无迹，他们的努力很大没有得到认可。

    '
- fmt: '

    Everyone reading this book is either part of the cybersecurity problem or part
    of its solution for his company. The CEO and board member are no exceptions. There
    are multiple ways to finally notice the `Mr./Ms. Cellophanes` among us and give
    them the credit and support of which they are so rightfully deserving.


    ## Cybersecurity as a Board Agenda


    First, cybersecurity should not be a random or sporadic topic to board agendas.
    Even more, it’s not a topic that can be outright ignored until the inevitable
    breach occurs. Boards must make cybersecurity a regular topic. I’m not so naïve
    as to believe that cybersecurity will ever earn the same amount of time or attention
    as financial performance, for example. But if boards are at all concerned about
    mitigating risk (and I’m confident most are), then give cybersecurity reasonable
    time on your agenda.


    ### How much time should you allocate?


    It depends on how well your board already understands this topic. If you haven’t
    started by having your `CISO` give a meaningful view of your current cybersecurity
    posture, `allocate at least 90 minutes to the topic.` In that time, your `CISO`
    should cover the assets that are most critical to the overall company.


    This requires significant consultation with business unit leaders. The right answer
    may not be so obvious. Customer data, for example, may not be your organization’s
    most prized asset (although it will likely rank very high on the list). If you’re
    in the business of running major manufacturing facilities, these sites may be
    your most strategic asset (and, yes, with connected devices permeating just about
    every facet of business, motivated hackers can, more often than not, compromise
    [if not shut down] these facilities).


    Your `CISO` should provide the current vulnerability state for each asset, listed
    in priority order of the asset’s strategic value. Without oversimplifying the
    task, you can imagine a 2x2 quadrant, with vulnerability state and strategic priority
    plotted on each axis. `Those assets that are both highly strategic and highly
    vulnerable deserve immediate budget reallocation.`


    On the point of budget allocation, while that may seem like an obvious output
    of this exercise, most boards are inclined to loosen purse strings only in the
    event of a breach—and even that’s a tall ask. In 2017, `EY`’s Global Information
    Security Survey found 76 percent of executives admitting that the allocation of
    additional cybersecurity resources would only be triggered in the case of a breach
    that did actual damage. A breach with no damage? Nearly two-thirds said it would
    not compel additional spending.^([15](#c02.xhtml#c02-note-0015))


    Having sufficient cybersecurity knowledge to provide effective oversight of cyber
    risks is essential. And yet, less than 40 percent of boards have it.^([16](#c02.xhtml#c02-note-0016))


    Once your board and `CISO` have aligned, make your `CISO` a regular attendee at
    board meetings. Cybersecurity changes at a dizzying pace. Your adversaries are
    highly motivated to do you harm. They don’t take a day off. You shouldn’t either.


    `Spend at least 30 minutes in each board meeting discussing the topic of cybersecurity.`
    If the average board meets six times a year for four hours each time, I’m asking
    for less than 15 percent of your time on this important topic. `Deloitte` reports
    that less than 20 percent of boards feature cybersecurity as a regular board agenda.^([17](#c02.xhtml#c02-note-0017))
    If `Deloitte` has it right, and cybersecurity is also the top risk for most boards,
    spending three hours per year regularly discussing it seems more than reasonable.


    ### Risk Assessment and Testing Discipline


    Have the `CISO` update your risk assessment in these sessions. He should be prepared
    to discuss how the vulnerability landscape of your assets has shifted. `He will
    know this information based on giving you output from what the cybersecurity industry
    calls red-teaming exercises or penetration testing. Insist on these exercises
    as a discipline.` These are simulated attacks your `CISO` will coordinate against
    your company to test its defenses. He’ll organize two teams—a red team (the attackers)
    and a blue team (the defenders). The red team, typically comprised of experts
    from external entities, tries to breach the blue team (the company). Through this
    exercise, the company is finding where it had previously unknown vulnerabilities.


    Know this: the red team `always` wins. And that’s a `good` thing. You want to
    discover your company’s vulnerabilities before hackers do. Compensating external
    agencies to discover your cybersecurity weaknesses is a lot more cost-effective
    than paying off adversaries (and regulators) in the event of an actual breach.


    Finally, `consider appointing a board member with cybersecurity expertise.` This
    individual will bring a unique perspective to the table. As a steward for cybersecurity,
    he will ensure your board doesn’t regress in putting the function back in the
    shadows. `Deloitte` reports that more than 80 percent of companies have not added
    anyone to their boards with cybersecurity expertise in the past two years.^([18](#c02.xhtml#c02-note-0018))


    ## Making Mr./Ms. Cellophane Visible


    The `CISO` is an indispensable, often underestimated, member of the executive
    team. While cybersecurity is everyone’s responsibility, boards and the CEO must
    set the right tone from the top of the organization. You must play your part in
    elevating cybersecurity to the role it has earned at your table.


    One of my favorite movie quotes comes from *The Usual Suspects*: “The greatest
    trick the devil ever pulled was convincing the world he didn’t exist.” Your adversaries
    want nothing more than for you to keep your `Mr./Ms. Cellophane` neatly tucked
    away in the shadows. They’re hoping that, if you do, you’ll also ignore them—the
    increasing legion of hackers seeking to do your organization harm. These bad actors
    want you to deprioritize cybersecurity as a nonstrategic investment. Don’t give
    them that power.


    If you fail on this point, you risk losing one of the most valuable members of
    your executive team: `Mr./Ms. Cellophane`. And that cybersecurity talent shortage
    I mentioned will prove very difficult for you to hire a replacement anytime soon.


    `CISOs` have a relatively short tenure at their companies, as low as 24 months
    by some industry benchmarks. `ESG` sought to find out why the life expectancy
    of a `CISO` is so short. The cybersecurity labor market is a seller’s market for
    now and the foreseeable future (thanks to that talent shortage). But `ESG` found
    that there’s far more than compensation in play when a `CISO` hangs it up and
    joins another company:


    - 36 percent leave when their current employer doesn’t have a corporate culture
    that emphasizes cybersecurity (good thing you’re reading this book!);

    - 34 percent exit when they are not active participants with executive management
    and the board of directors; and

    - 30 percent bolt when cybersecurity budgets are not commensurate with the organization’s
    size or industry.^([19](#c02.xhtml#c02-note-0019))


    There’s a lot the CEO and board can do to be a part of the cybersecurity solution,
    including giving your `CISO` a voice. Beyond giving her access to the conversation,
    offer her a forum to argue her case for more resources (given what I’ve shared
    with you, her case for more dollars is likely more legitimate than not). All that
    said, treat her as an executive member and inspect her arguments by asking salient
    questions. To do this, you must first enrich your understanding of the cybersecurity
    problem—a pursuit I hope this chapter supported.

    '
