  trans: '

    当然，对公司发动网络攻击意味着风险，有时甚至是是巨大的。但请注意，首席信息安全官（CISO）必须建立至少两种关联，才能将他们的语言转化为董事会的语言。首先，他们必须将从“风险”到“策略”的珍珠串起来。一个脱离了战略重要性、价值创造或公司衡量标准的风险，等同于给董事会展示了一张你们结果的饼图——它只显示了全景中的一小部分。


    其次，CISO 必须将“威胁”转化为“风险”。这需要理解董事会对优先级资产的风险容忍度、潜在攻击如何挑战这种容忍度，以及可能导致的后果（财务或其他）。


    如果这看起来像是一个高标准，那确实如此。斯坦福大学报告称，大多数公司没有将风险管理与策略相结合。此外，50% 的公司没有建立企业风险管理制度。对 CISO
    来说好消息是什么？当你用董事会的语言有效沟通公司的网络安全状况时，你将成为这些规则中令人惊喜的例外。


    正如我在第二章中所证的那样，CISO 应该获得进入董事会的机会。但一旦 CISO 门入门，他构建和传达信息的方式可能会决定他是否会被再次邀请参加会议。学习董事会的语言和风格，以避免和那些单维的饼图一起被抛弃。


    ## 舍小取大


    2014 年，企业正在失去控制。它们正被一场全员参与的战斗运动所吞噬；IT 部门被其愤怒所消耗；安全部门则深陷其准准星之中。这种疯狂的核心是什么？嗯，心存良好的员工要求在工作场所获得与他们在家里所期待的一样的全天候、按需云技术访问权限。到
    2014 年，裁决已经做出。“IT 消费化”趋势绝非过之风。它将长期存在。


    同年，IDG Enterprise 研究了这一现象对组织的影响。当时，40% 的公司预测，工作场所中对消费化技术的痴迷会带来负面的安全后果。他们的担忧是有根据的。考虑这个滑坡效应：2014
    年，90% 的组织报告称，员工在工作时使用消费者或个人服务——其中 41% 未经 IT 部门的批准。


    意所当然的是，相关组织致力于采取行动。超过半数的公司制定了在移动设备上和或通过云服务访问和共享公司数据的政策。约三分之一的公司投资了安全文件共享服务。另一些公司则实施了经过许可的企业协作工具。


    快进几年，看看 McAfee 的《2019 年云采用与风险报告》。McAfee 并没有询问受访者对云消费的意见或计划（云是 IT 消费化趋势的一个巨大组成部分），而是检查了云端实际上到底有多少文件是安全的。（我们通过查看每个文件设置的企业级策略来实现这一点。例如，企业确定文件的敏感性，我们使用匿名、聚合后的数据来判断使用情况是否符合策略。）


    结果表明，这列失控的消费化 IT 火车在前段时间就偏离了轨道：


    *   云端所有文件中有 21% 包含敏感数据。这一数字正在上升——在过去两年中增加了 17%。

    *   在云端共享的敏感数据文件数量也在增加——短短一年内增长了 53%。

    *   92% 的组织拥有被盗取的云凭据在暗网上出售。


    除了 2014 年发生的爆发式 IT 消费化运动外，还有另一场竞赛正在进行。开发者越来越多地使用公有云环境为公司创建应用程序。


    这就是确保云安全变得更加棘手的地方。正如 CISO 所知，随着他们从软件即服务 (SaaS) 转向平台即服务 (PaaS) 再到基础设施即服务 (IaaS)
    云变体，其承担的风险更多。虽然这三者的数据保护是一致的，但随着公司从一种模式转向另一种模式，CISO 在确保云底层基础设施组件安全方面承担了更大的责任。


    例如，同样的 2019 年 McAfee 云报告显示，平均每个企业都存在 `IaaS` 或 `PaaS` 配置错误。这些错误导致必须为了保护数据而保护的公有云基础设施处于开放状态。


    需要明确的是，这些安全漏洞不应归咎于云提供商。这些错误源于在使用这些服务却不知如何保护安全的公司。我已为每个组织利益相关者提供了指导性建议，说明他们如何为公司的整体安全出力。但你不会发现我建议员工停止使用他们喜爱的云服务。因为我知道这种建议将充之于耳。在企业
    IT 服务追赶上普通用户所拥有的体验之前，员工将继续使用后者。他们只是在没有 IT 知情、更不用许可的情况下这样做，这使得挑战变得更加巨大。


    ## 承担职责


    几个月前，我的办公室里非常热闹。有人在到处张贴传单，上面写着这样一条信息：“我们需要更大的船。”《大鲨》爱好者立即看出了对电影的引用。但除此之外，对于我们在陆地上工作的
    McAfee 员工来说，这可能意味着什么完全没有任何解释。


    流言风语充满了疯狂的猜测。我们要搬到更大的办公室了吗？我们要合并或收购某家公司了吗？停车场要扩建了吗？（是的，办公室停车有时确实很有挑战性。）


    当我们发现信息背后的幕后手手时，非常惊讶——竟然是我们的 CISO 组织。这次预热活动启动了 McAfee 全公司范围的网络安全意识刷新计划。具体来说，“更大的船”的引用是对“钓鱼”（phishing）的双关语（真巧妙！）。当
    CISO 组织向员工发送钓鱼邮件时，确实有人上了鱼钩。当他们上钩时，他们会被提醒错误，并被鼓励向安全团队报告所有可疑邮件（通过我们电子邮件应用程序中一个方便的“报告钓鱼”插件来实现，该插件也与活动的同步发布）。


    我们的 CISO 走得更远。每位执行团队成员每月都会收到关于其团队表现的报告。他的团队有多少百分比的人钓了鱼？在没有钓的人中，有多少百分比的人采取了额外的主动行动，将那封可疑的种子邮件报告给安全团队？

