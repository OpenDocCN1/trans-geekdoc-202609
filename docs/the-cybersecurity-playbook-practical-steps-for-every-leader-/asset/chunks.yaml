    ## Note


    1. Louise Bien, “什么让西雅图的第 12 人如此特别?” SB Nation, 2015 年 1 月 22 日, [`www.sbation.com/nfl/2015/01/22/what-makes-seattles-12th-man-so-special/`](https://www.sbation.com/nfl/2015/01/22/what-makes-seattles-12th-man-so-special/).


    ## 第二章


    ### 玻璃纸先生/女士


    > *即使不像母鸡那样咯咯叫，*

    > *每个人偶尔也会被注意到,*

    > *除非，当然，那个人应该是*

    > *隐形、无道且无关紧要的我。*

    > *玻璃纸，玻璃纸先生*

    > *本该是我的名字，玻璃纸先生，*

    > *因为你可以直接看穿我,*

    > *从我身边走过，却永远不知道我在这里。*


    我们许多人都能对阿莫斯（Amos）产生共鸣，有时感觉自己是隐形的。这通常不是一种很好的感觉，往往伴随着被低估或不被赞赏的感觉。被完全误解一点也不趣。


    长期以来，首席信息安全官（CISO）一直是我们组织中隐喻的玻璃纸先生/女士，注定要在虚拟的匿名中辛勤工作，持续地专注于安全这项基础工作。他们生活在他们所保护的人的影子里。事实上，如果他们从隐形的斗篷中走出，各方都会出现麻烦。


    作为员工，我们不希望被 CISO 或他们的部门打扰。我们只希望他们能保持我们的安全。我们希望他们在不干扰我们的情况下完成这一切。

