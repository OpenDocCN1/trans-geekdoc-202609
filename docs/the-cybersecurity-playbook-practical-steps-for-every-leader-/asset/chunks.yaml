    # 第 10 章：全员安全文化


    > 治理、风险和合规运动的一部分是“从高层定调”。执行管理层应该指出不同类型的网络安全威胁以及如何识别这些威胁。随后，应该明确 IT 部门在防止网络攻击中扮演什么角色，以及其他人又扮演着什么角色。目前，我不知道这道界限在哪里。在网络安全领域，我应该担心什么，而什么是
    IT 任务负责预防的？

    > —— 受访者，麦菲（McA）在线民族志研究


    那篇短文的标题几乎没有被注意到，被埋在页面底部，与关于即将举行的高中橄榄球赛专题在一起。那些仔细看的人可能会直接将其斥为歇斯底里式的末日预言：“世界系列赛地震要来了吗？”四天后，6.9
    级罗马-普里埃塔（Loma Prieta）地震发生，导致 63 人死亡，造成了数十亿美元的损失，并中断了在烛石公园（Candlestick Park）进行的世界系列赛第三场比赛。


    地震是大自然可怕的幽灵。全球每天发生数百次地震，尽管我们大多数人甚至没有注意到它们。它们在性质上相对较小——震级 2 级或以下。7 级以上的地震每月发生多次。至少
    8 级的大地震每年发生一次。与那些较小的兄弟姐妹不同，我们会注意到这些大地震和大地震。即使我们足够幸运，避开了大自然的愤怒，媒体也会通过在屏幕上填满倒塌建筑和毁灭路径上受害者的图像，确保我们意识到她的破坏力。


    让地震变得可怕的是它们的确定性。地震的发生不可避免。地球是活跃的。它的板块正在移动。这种现象是无法逃避的。


    然而，尽管具有这种确定性，地震又是完全不可预测的。没有办法可以预测地震。这一点唯一的区别将地震与其他自然灾害（如飓风、龙卷风和洪水）区分开来，在后者，科学模型可以帮助人们避开致命打击。


    地震并非如此。它们在毫无预警的情况下袭击。美国地质调查局（USGS）在其网站上明确指出：“美国地质调查局或任何其他科学家从未预测过大地震。我们不知道如何预测，而且我们不指在预见的未来任何时候做到。”


    所以，当县地质学家吉姆·伯克兰（Jim Berkland）对 1989 年震摇罗马-普里埃塔的 6.9 级地震给出了难以置信的准确（或极其幸运）的预测时，那些几天前错过那个晦涩标题的人，在尘埃落定后无疑注意到了它。


    伯克兰利用科学指标（如大潮的存在和月球的位置）来进行预测，罗马-普里埃塔地震是他过去 15 年中做出的 300 次预测之一。此外，伯克兰在黑箱中用于计算地震概率的另一个数据点，是事件发生前当地宠物分类广告中报告的丢失动物数量。他包含这一非常规指标的理论是？宠物在感知到即将发生的地震时会逃跑。


    这种假设并不新鲜。几个世纪以来，预言者们一直认为动物拥有真正的六感，能够感知震动，或探测空气或气体中人类无法察觉的电变化。


    科学尚未能证明任何这种六感的存在——至少目前如此。有大量的研究在寻找奇异动物观察结果与随后的地震之间的联系。确实，有大量的轶事数据记录了动物的退缩、行为失常或表现出异常行为，尽管这些“证据”本身缺乏受控科学实验的严谨性，无法清楚地建立因果关系。


    但在这些研究中，似乎确实证据表明动物实际上可以在地震发生前感知到。这并不是说它们能预测地震，但它们似乎能探测到前震——即在剧烈摇动之前的轻微震动，这些震动是人类无法识别的。


    虽然关于动物行为是否能帮助人类预测地震尚无定论，但至少有一些证据表明，动物对微妙异常的敏锐度高于人类——即使仅仅是因为在灾难来临前处于高度警觉状态。然而，那几个转瞬即逝的时刻，可能决定了动物的生死。


    我相信，对于那些集结群众力量——即所谓的羊群本能的组织来说也是如此，以获得对网络威胁的六感，而这种感在他们的同类中通常是缺失的。当每位员工都为了练习良好的防御而提高能力时，这种情况就会发生。更重要的是，当网络安全的角色与每位员工的日常工作变得密不可分时，组织的集体六感会在不可修复的损害发生之前放大对威胁的检测。


    让我们在整个组织中建立安全文化。


    有一些每位员工都可以做、每个职能领导都可以采用的方法，可以将网络安全嵌入到工作场所的日常织理中，将“第 12 人”的力量引入网络安全领域，并将集体羊群的六感带入数字领域的第一线战斗。


    为此，本章总结了每位员工、经理、高管和董事会成员的关键问题和行动。


    你现在被招用了。


    ## 给 CEO/董事成员的智慧


    *   在即将到来的董事议程中分配至少 90 分钟，让你的首席安全官（CISO）对你目前的网络安全状况提供有意义的见解。

    *   立即将预算重新分配给具有高度战略性又高度脆弱的资产。

    *   在每次董事会议上至少花 30 分钟讨论网络安全话题。

    *   让你的 CISO 报告红队演习（也称为渗透测试）的状态。坚持这些演习作为一种纪律。

    *   考虑任命一位具有网络安全知识的董事成员。


    ## 给员工的智慧


