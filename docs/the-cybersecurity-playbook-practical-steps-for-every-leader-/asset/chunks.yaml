    作为练习演练的一部分，请与你指定的公司发言人模拟媒体采访。你需要培养多位经过培训的发言人，确保在数据泄露发生时他们准备好与媒体接触。确保他们已经准备好了口径要点和对棘手问题的回答，以保持对信息传导的控制。在这种情况下，熟能生巧接近完美。


    将你的整体危机计划和演练结果提交给执行团队，以确认你的沟通指导原则没有发生变化。花时间回顾其他公司在自你上次演练以来这段时间内所做的，以学习最佳实践并在此过程中不断调整自己的计划。


    ***


    玛雅·安格鲁（Maya Angelou）曾说：“我学到，人们会忘记你说过什么，会忘记你做过什么，但他们永远忘记你带给他们什么样的感受。”我们之所以仍在讨论弗兰克·布莱克（Frank
    Blake）在网络安全领域的持久遗产，是因为他迅速的行动和体贴的回应让我们所有人（无论是否是受害者）都觉得公司仍然在做正确的事。布莱克通过他的行动揭示了他的公司关心它的客户。这种感觉在布莱克辞去首席执行官职位后很久之后依然存在。


    当泄露发生时，幸运往往青于有准备的人。你的公司无法阻止所有的泄露。坚定的网络罪犯只需要成功一次。当他们成功时，营销和传播团队需要通过一个协调的、编排过的沟通计划快速反击，用清晰的指令和真诚的同理心与所有相关利益者接触。你的客户和员工将根据你的反应来衡量你的公司。当烟消云散时，他们可能不记得你说过或做过的一切，但他们一定会记得你带给他们什么样的感受。


    我的营销和传播战友们，你们正处于黑客和你们品牌声誉之间。幸运的是，你们有很多准备工作可以做让自己做好准备。


