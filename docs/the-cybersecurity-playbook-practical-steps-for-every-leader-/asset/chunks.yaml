    例如：麦卡菲（McAfee）报告，平均组织在任何时候都会使用约 2000 个云服务。他们的 IT 团队*认为*自己有多少个？接近 30 个。这种认知与现实之间的鸿沟至少可以部分归咎于“影子
    IT”——这是一种员工在 IT 部门不知情、更不用其授权的情况下，擅自使用云服务的现象。


    比首席信息安全官（CISO）被员工看到更糟的情况是什么？是让董事会看到。从历史上看，董事会会对网络安全的兴趣和员工一样小。如果董事会传召一名 CISO 参加会议，通常不是为了对公司的网络安全状态提供战略性的更新，也不是为了对他的工作表示诚挚的“感谢”。更有可能是为了回答关于数据泄密的棘手问题。


    全球专业服务网络德勤点（Deloitte）对董事会进行定期研究，调查了数百家上市公司。直到最近的 2014 年，仅有 5% 的巨型公司设有与“网络安全与 IT”相关相关的董事会设委员会。


    因此，CISO 在很大程度上接受了我们在比喻性音乐剧中的阿莫斯（Amos）角色——致力于为那些不感激他的人保护，并注定留在阴影中。


    但意图破坏的坏分子正在改写这部音乐剧。几乎每天都有头条新闻（或公司）宣布下一次数据泄露。董事会的氛围正在发生。许多人意识到，将 CISO 边缘化到影子中意味着他们自身的风险。当德勤在
    2016 年重复其董事会研究时，网络安全已成为董事会关注的首要风险，25% 的公司在过去两年内经历过数据泄露。拷贝先生和小姐（Mr. and Ms. Cellophane）发现自己已经从后台办公室的角落被解放出来，甚至偶尔还会收到参加董事会议的邀请。


    然而，仅仅因为黑客将 CISO 推向了灯光中心并不能解决网络安全挑战。董事会开始关注这个问题是令人欣慰的，但仅仅承认只是第一步。提高公司的网络安全态势需要这些双方——技术型的
    CISO 和战略型的董事会执行——学习彼此的语言。


    让我们从尝试理解我所认为的高管层中最被误解的角色——CISO 开始。这种启发不仅造福了董事会成员，也造福了所有员工。CISO 通过最终从阴影中走出而获益。


    ## 行业的新面


    公司以及组成它们的职能部门已经存在了数百年。银行和制造企业是最早的实体之一，因此，今天许多大型上市公司在财务或运营方面拥有深厚能力也并不令人意外——这些是作为我们企业祖先基础基础的最初学科。


    事实上，根据德勤 2016 年的《董事会实践报告》，除了首席执行官（CEO）和总法律顾问外，最有可能定期参加董事会的管理层成员是首席财务官（CFO）（被高达
    99% 的调查公司引用）和业务部门负责人（被高达 47% 的公司引用）。那么 CISO 呢？相比之下，他仅在最多 11% 的公司董事会中定期亮相。


    CISO 们仍在拼命挤入这些闭门会议，这并不令人意外。毕竟，其他职能部门跨越了几个世纪甚至几千年（律师可以声称他们的职能根源可以追溯到古埃及），而 CISO
    的角色只追溯到几十年。那时，我们甚至不称之为“网络安全”。这些早期先驱将他们的职业称为“信息安全”，这与他们领域从“信息技术”开始的发展是一致的。


    为了理解 CISO 这一相对新的角色，我们对网络安全的起源进行一次简短但重要的溯源至关重要。在过去，物理安全和信息安全在很大程度上是一回事。我记得，在不久前，如果我想访问公司的网络，我是通过一台固定的台式机，连接一根物理以太网线到局域网的。台式电脑和连接它的以太网技术位于我们公司的场所内。因此，访问公司网络的唯一方法是物理上进入公司——这需要实实在在的安全许可，比如我的员工证。在思维和实践中，我将物理安全和信息安全紧密地联系在一起。


    我惊讶于仅仅在我的一生中，工作发生了如此大的变化。工作不再是我去的地方；它我所做的事情。我越来越多地在雇主安全的物理边界之外工作。我将职业生活和个人生活无缝融合——在移动设备上回复邮件，在任何可以找到
    WiFi 的地方连接，并访问许多让生活更便利的云服务。


    我不是唯一一个接受无绳体验工作的人。让我们考虑一下我们较新的工作行为对必须保护我们和公司的 CISO 造成了指数级增长的压力。在任何时候，我们的 CISO
    都在平衡三种战略努力之一或多个：


    ### 1. 转型


    技术的每采用，无论是移动性、云还是物联网（IoT），都会使公司面临更大的风险。这是因为在过程中，企业的安全边界不断被侵蚀。


    例如：谁“拥有”互联网？这是一个像比庭迷宫一样复杂的问题，让我们中最具技术背景的人也感到头晕。


    谁“拥有”公共云基础设施（如亚马逊、谷歌和微软提供的设施）？这个问题至少更容易回答——这些公司负责那些云环境的物理安全。但这等同于说他们拥有对那些巨大数据中心的物理访问权，就像我们的公司拥有我们工作的建筑一样。云盗窃通常不是资源丰富的窃盗闯入大型网络公司物理数据中心的结果。它是网络犯罪分子找到黑入存储在或穿过此类数据中心的数据的结果。


    谁最终“拥有”这些数据的责任？这是最简单、最清晰的答案：你的公司——只有你的公司——负责保护自身的数据，无论数据存储在何处——无论是在位于你雇主场所的服务器上，还是通过公共云市场租赁的服务器上。


    云只是 CISO 对存储或传输其公司数据的基础设施控制力退缩的一个例子。自带设备（BYOD）运动将长期存在，这意味着公司配发的移动设备可能很快成为过去的遗迹。许多公司急于允许员工在他们选择的任何移动设备上工作是有理由的。根据
    Frost & Sullivan 的数据，使用手机工作每天为员工节省了近小时的时间，同时提高了 34% 的生产力。

