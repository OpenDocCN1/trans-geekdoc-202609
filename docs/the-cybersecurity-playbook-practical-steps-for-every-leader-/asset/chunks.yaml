  trans: '

    他们的证据表明，最成功的男性 Google 员工在回答这个面试问题时给出了“4”。Google 发现，男性倾向于夸大自己的经验或资历。那么最能预测女性候选人成功的得分是多少？一个完美的
    5 分，因为 Google 发现女性更可能保守和谦逊。（当然，既然秘密已经泄露，Google 现在不得不想出额外的面试问题来判断成功与否！）


    出于所有这些原因，McA 对大多数职位都采用了小组面试法。而且我们在每个面试小组中至少都会安排一名女性或少数族裔，以代表我们渴望招募的这种多样性。


    最后，要消除那种可能让贵公司只寻求具有以往网络安全经验的人士的偏见。市场上的这类人才并不多。我们不能继续互相挖角，在此过程中推高薪资并导致人才流失。因此，请消除那些对不同背景候选人产生偏见的问题。例如，让候选人谈谈他感兴趣的网络安全领域的最新热门创新，这会让实践经验较少的人处于劣势（正如我们从
    PC 的历史中中学到的那样）。在寻找合格候选人时，确保你的问题涵盖了 STEAM——这里是个双关语。


    当我进入 McAfee 时，我的背景中半点网络安全经验也没有。在六个月内，我就合著了一本关于该主题的书。我并不是在淡化行业的复杂性。但我认为技能是可迁移的。寻找在其他领域具有技术技能的候选人。你会发现，像电信这样的技术行业并没有处于同样的零失业率状态。技术在不同的劳动力市场中会有起伏。扩大你的视野，去寻找具有可迁移技能的合格人才，无论候选人之前是否具有网络安全经验。


    在硬币的另一面，你可以通过多个杠杆来将网络安全嵌入到员工的日常工作中，而不会在此过程中让他们不堪应交。首先，`搜索你的公司价值观`——即你期望员工遵守的行为准则或指导原则——`看看你可以在哪里添加一个词，以一种深远的方式改变它们的含义：''security''（安全）。’`


    例如，在探索我以前雇主 Verizon 的老地盘时，我发现公司在写作当时的网站上有一段令人印象深刻的信条。让我们来看看仅插入一个词如何在不损害意图的情况下扩大含义（斜体部分由我添加，表示建议增加的内容）：


    > 我们工作是因为我们的客户重视我们高质量的通信服务。


    > 我们通过产品和行动提供卓越的客户体验。我们所做的一切都建立在强大的网络、系统和流程基础之上。我们交付的产品的质量、可靠性 `and security`
    是至关重要的。客户付钱是为了让我们提供他们可以信赖的服务。


    一个词就可以在不改变目的的情况下改变范围。


    现在，这并不是一场“网络安全宾果游戏”。在某些价值观或指导原则中，安全并不适用。不要把方头推进圆孔。Verizon 的例子就是一个很好的案例：


    > 我们知道团队合作使我们能够更好、更快地为客户提供服务。


    > 我们拥抱多样性和个人发展，不仅是因为这是正确的事，还因为这是明智的商业行为。驱动我们不是自尊，而是成就。我们履行对彼此和客户的承诺。我们言出必行。我们相互尊重和信任，保持开诚、坦率和直接的沟通，因为任何其他方式都是不公平且浪费时间的。我们发表意见并进行建设性的异议，然后全力支持已达成一致的行动。我们中的任何一个人都可以向其他人表达观点或想法，并无论头衔或级别如何，都倾听并重视他人的观点。想法的存亡取决于其本身的价值，而不是它们发明的地方。


    我恰好喜欢 Verizon 信条中的那段摘录。但无论我如何尝试，无法在表述得如此优美的话中自然地插入“安全”。


    没关系。虽然你不会在不属于它的价值观中强行为安全找一个位置，但你可能会发现至少一个可以轻松容纳它的。假设你的价值观不仅仅是员工证背面的花哨文字，你将开始通过根除不安全的行为并植入安全的行为，将安全种子到公司的根基中。


    接下来，让我们看看你的`奖励和认可计划`，为网络安全成就找到自然的归宿。第一点显而易见。给你的网络安全团队一些关爱。正如第 2 章提到的，他们被边缘化在公司的后台太久了。让他们从幕后走出来。


    怎么做？让你的 `CISO` 在一些公司全体会议上发言。她不需要成为每个公司活动的常客。但你完全可以展示她和团队的成就，让广泛的员工理解攻击格局以及网络安全防御的重要性。除了招募更多战士加入战斗，一点点感谢会产生远大的影响，并可能帮助抑制网络安全部门高流失率（多亏于那不存在的失业率）。


    接下来，扩展你的奖励和认可计划以包含网络安全。我在上一章提到，每当新产品或服务的发布由于安全性不达标时，停止生产是非常重要的。利用贵公司的认可平台公开表扬员工——无论他们是否来自网络安全部门——他们提出了有效的安全顾虑，从而阻止了此类产品或服务进入市场。


    现在是时候处理这本书书中涉及的显而易见的问题了。此为止，我们一直把员工视为通常意图良好的主体，寻求通过网络安全的方式为公司做出贡献，但可能缺乏这方面的教育或处方。这在很大程度上是事实。


    但有一部分员工完全不想为你的公司做贡献。他们不仅仅是网络安全斗争中冷漠的旁观者。这些是恶意内部人员，寻求给你的组织造成损害和/或以公司的利益为代价获取个人利润。根据
    Verizon 的 DBIR 报告，恶意内部人员占所有公司破解事件的 10% 以上。


    恶意内部人员是公司应对的最为阴险的敌人。首先，公司不愿对员工实施“老大哥”式的监控——这是有道理的。尽管存在隐私担忧，但雇主可能不愿意将每个员工都视为潜在的坏分子，而是倾向于一种自由信任的场所文化，而不是通过长时间的苦努力赢得信任。


    然而，为你的公司工作的坏分子是现实。组织应该如何做才能清除内部威胁？你的网络安全组织拥有可以部署的技术来识别异常行为。但技术本身的防御能力远弱于技术、工具和人的协同工作。这正是人力资源专业人士可以协助创建人员控制以识别恶意内部人员的地方。

    '
- fmt: '

    First, work with the `CISO` to identify the employees with the greatest access
    to the company’s most valuable assets. Your `CISO` should already have a taxonomy
    of risk, mapped against value, for your organization’s most prized possessions,
    whether intellectual property, manufacturing facilities, sensitive databases,
    or something else entirely. Define the perimeter of employees with privileged
    access to these valuables. Establish with the hiring manager and your security
    organization what level of access is required for these employees to do their
    jobs effectively. Periodically review the list of employees to ensure no job changes
    warrant an adjustment to privileges. Come performance review time, create a list
    of employees who may pose a flight risk and compare it against those who have
    privileged access, ensuring `Legal` is in the process to respect employee privacy
    concerns. By establishing and monitoring employee access privileges regularly,
    you protect your company from those who no longer require enhanced privileges
    (or may never have required them in the first place).


    Note that access hygiene not only protects your company against malicious insiders
    but malevolent outsiders as well. Had McAfee applied this prescription, we would
    have removed an agency employee (essentially an extended insider to our team)
    from having administrative privileges to our social media page when she was no
    longer doing work for us. By doing so, we would have averted the hack I covered
    in the first chapter.


    Next, within your reward-and-recognition program, carve out a place for whistleblowers.
    This goes beyond government programs that protect and incentivize these people.
    Establish a confidential program whereby employees can report suspicious behavior.
    Clearly, this is a fine line to walk, as you don’t want to create a company culture
    of distrust among employees. But if you allow employees to speak up when they
    see something that doesn’t sit right with them, you can marshal one of your most
    powerful weapons—your own workforce—in identifying rogue employees.


    Case in point: A while back, McAfee reprioritized our investment areas to more
    closely align with our customers’ needs and the marketplace. These decisions never
    come easy for a company, especially when they impact employees, which was the
    case in this example.


    I received an email from a manager on my team, who forwarded one he had received
    from one of his employees. In it, the employee asked the manager for help. One
    of our impacted employees was overheard on what seemed to be a suspicious phone
    call. In it, the employee in question stated that, now that they had been “let
    go,” they could reveal exactly what McAfee had been working on in recent months.
    (I should mention that this employee had knowledge of an upcoming product rollout.)


    Upon hearing the conversation, our concerned employee decided it best to send
    an email to a manager reciting exactly what was said. Because of this, we were
    able to intervene with a reminder to the exiting employee of confidentiality requirements
    (without exposing the whistleblower in the process). And we were able to make
    other decisions to accelerate or otherwise alter the original rollout schedule
    for the product in question.


    Since the exiting employee wasn’t using company systems to relay or exfiltrate
    the information, this threat would have gone undetected by McAfee’s cybersecurity
    team. Only one employee overheard the phone conversation and was under no obligation
    to report it. But the person did. I couldn’t have expressed my gratitude more
    for one of our own looking out for the company. **Find a confidential, nonthreatening
    way for conscientious employees to blow a whistle or raise a flag when they see
    something dubious. When they do, reward them appropriately.**


    Finally, examine your company’s key performance indicators (`KPIs`) to find those
    related to cybersecurity. At a minimum, `every member` should be involved. This
    is not just a task for the IT department, but a collective responsibility. Every
    employee plays a role in maintaining the security posture of the organization.

    '
