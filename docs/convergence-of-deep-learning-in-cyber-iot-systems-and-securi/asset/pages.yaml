    # 20.1 Introduction


    Latest trend of cyber-physical systems (CPS) seeks the physical convergence and
    cyber areas in regular life. CPS scale system connects firmly with cyber level
    and physical systems. The cyber area is completely related to the digital area,
    which can compute, communicate, and order using automatic programs. Physically,
    the system is similar to multiple Internet of Things (IoT) sensors [1], where
    CPS is related to hardware (HW), software (SW), actuators, embedded systems (ES),
    sensors, and much more related to humans and machines. CPS system is firstly similar
    to future generations related to network systems in distributed systems and IoT
    by merging physical systems with sensors and actuators by controlling the computer
    elements these are useful in CPS systems to develop information and communication
    technology.


    A CPS is an intelligent computer-based system used to control or monitor the work
    of algorithms. The component used for fabricating smart networked systems includes
    processors, sensors or actuators, software systems, and communicating devices.
    These physical devices (for which IoT is used to create worldwide connectivity)
    are mapped with the virtual components (computational world) to create an abstract
    model for information flow with guaranteed performance in safety critical applications.
