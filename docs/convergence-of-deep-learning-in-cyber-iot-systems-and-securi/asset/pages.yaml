    true and false. Figure 7.1 shows the block diagram of fuzzy logic and boolean
    logic.


    The main aim of applying fuzzy logic is to fabricate the thinking of a computer
    like a human. With the help of fuzzy logic algorithm, we can allow the electronic
    devices to recognize and counter to human language such as very large, very small,
    hot, cold, etc. One of the advantages of fuzzy logic is that it can be simply
    carried out on an ordinary computer. There are various uses of fuzzy logic in
    the field of artificial intelligence, natural language processing as well as in
    modern control systems. There are many countries in the world like Japan are using
    fuzzy logic in micro oven, video camera, air conditioner, vacuum cleaner, etc.
