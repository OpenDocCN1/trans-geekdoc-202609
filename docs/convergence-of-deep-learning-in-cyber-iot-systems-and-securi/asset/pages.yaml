    developer. Typical programming models can be split into event-driven and multithreaded
    schemes for IoT operating systems. An external event like interrupt must trigger
    each job in an event-driven scheme as shown in Figure 15.24.


    A multi-threaded programming system offers the chance to interact between the
    functions using an interprocess communication (IPC) and to perform each job in
    its own thread context. The programming language should be developed in such a
    way that programmers can use the system efficiently. The selection of programming
    model is influenced by many variables as shown in Figure 15.25.'
