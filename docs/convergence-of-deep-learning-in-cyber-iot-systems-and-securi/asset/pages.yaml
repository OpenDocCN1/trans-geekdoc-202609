    In such a context, the novelty of the work is in designing an algorithm using
    various machine learning techniques in different phases and developing an end
    to solution for Bengali QA. Novelty lies in addressing all the sentences in natural
    language, in flat file system for the repository whereas QA systems are designed
    against relational database repository. Part of SQuAD [9] is translated into Bengali
    using Google transliterate and the performance of the proposed system is tested
    on that translated SQuAD dataset. But not the least the performance of our system
    has been compared with existing work in the state-of-the-art SQuAD dataset and
    also with the available result set of Bengali QA system.


    # 10.2 Related Work


    In this section, we have discussed the recent relevant and state-of-the-art work
    in QA system is discussed. The existing research toward Bengali QA system is discussed
    first.


    Statistical approach is used to develop factoid QA system in Bengali by Monisha
    and her group [1]. 90.6% accuracy is achieved in question classification. In case
    of answer retrieval, fine grain accuracy is 56.8% and coarse grain accuracy is
    66.2%.


    Banerjee and his group [2] have achieved 87.79% accuracy in Bengali question classification
    using supervised methods.


    A Das and his group [3] have used combination of statistical method to rank the
    answers in their developed Bengali QA system. The system has achieved 82.3% accuracy
    in predicting the actual answer as the 1st rank and 95.38% accuracy in predicting
    the actual answer with 1st to 15th rank.


    Stochastic Gradient Decent (SGD) classifier is used for word-based answer classification
    for retrieving answer in Islam et al. [6] Bengali QA system. Fine grain accuracy
    is 87.64% and coarse grain accuracy is 95.56% for answer retrieval in this system.


    Manna and Pal [7] have used keyword matching for domain selection. Domains are
    ranked in the descending order of match and answer of the question is searched
    in the top-ranked domain. The overall accuracy achieved is 80% in this work.


    Naïve Bayes, decision tree, support vector machine (SVM) classifiers are used
    to classify the questions in Bengali [8]. The result is improved with SGD optimizer.
    90.5% accuracy is achieved for five domains.'
