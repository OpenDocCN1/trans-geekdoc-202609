    # 5.1 Introduction


    Online assessment also referred to as e-assessment, enables examiners to conduct
    examinations through internet for remote candidates. The goal of these systems
    is to offer the candidates an easy way to write the examinations and to provide
    the results at the earliest with the help of answer processing modules, without
    any manual evaluation. There are two types of online assessment system: multiple-choice
    question-based examination system (as shown in Figure 5.1) and descriptive question-based
    examination system (as shown in Figure 5.2). Descriptive question-based examination
    systems have lots of complexities, which include different ways of answering the
    same question, some questions require more than a word and the length of the answers
    varies from individual to individual. Hence, evaluation of descriptive question-based
    answers is difficult. A manual question paper usually have several categories
    of question, such as describe, explain, define, and discuss.


    The current examination systems are painstaking. Hence, online assessment system
    with automatic evaluation module is the need of the day.


    ![](img/081dc7f102a3793cb08980a6e19b8f17_125_0.png)


    Figure 5.1 Multiple Choice Question based examination system.


    ![](img/081dc7f102a3793cb08980a6e19b8f17_125_1.png)


    Figure 5.2 Descriptive question based examination system.'
