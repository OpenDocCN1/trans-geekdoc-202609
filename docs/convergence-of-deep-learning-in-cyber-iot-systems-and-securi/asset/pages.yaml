    # 14.1 Introduction


    The 21st century has seen a lot of change in the society where women engaged in
    various activities alongside men where have been equally contributing to the wellbeing
    of the society [1]. Even after such great contribution to the society, women are
    not able to move freely to harassment and sexual abuse [2] which is one of the
    major incidents of women empowerment. According to the National Crime Records
    Bureau (NCRB) report, in the year 2019, there has been an average of 87 cases
    per day and around 400,000 cases of crime against women during the year. Apart
    from this Delhi reported the highest number of harassment against women, i.e.,
    over 430 cases [3]. This type of incident reported increased 7% from 2018 [4].
    In this paper, authors have developed women’s safety application named “Patron
    for Women” that ensures women’s safety from danger and accurately identifies the
    location of the person at the time of critical situation. The main purpose of
    this application is to provide safety to women during their critical safety situations.
    The application is operated in the following process. The user should keep the
    application turned on. The first page show two options—sign-up and sign-in. If
    the user is new to this app, she must register with her name, email id, and password.
    And if she is an existing user, she might continue with her existing email id
    and password for logging in. After sign up or log in there is three option which
    includes—Guardians’ Details, Check Location and Emergency button. Whenever the
    user faces any unavoidable situation, she can press the emergency button and send
    the emergency message along with the current location to the registered contact
    person. And all this works both offline and online. The objective of this system
    is to develop a cost-effective GPS based women tracking system.


    Section 14.2 states the background of the work. Section 14.3 focuses on the literature
    survey related to women safety application. Section 14.4 thoroughly explains our
    proposed methodology and its performance analysis. Section 14.5 discusses the
    results and analysis. Section 14.6 concludes our paper with a direction to future
    scope of this research work.


    # 14.2 Background Study


    In the past few years, numerous researches have been performed for the prevention
    of crime against women using various technologies. Many'
