    # 4.3 Proposed Work


    We have tried and tested many classification techniques like Logistic Regression,
    K-Nearest Neighbors, Naive Bayes and many more. Naive Bayes classifier stands
    out in the list in terms of accuracy and simplicity of the approach.


    Mathematical Explanation of Naive Bayes Classifier:

    We consider a given news report fake or not in the basis of calculating the conditional
    probability of report that contains some certain word in it.


    The formula is stated in equation 4.1.


    ```

    P(F|W) = \frac{P(W|F).P(F)}{P(W|F).P(F) + P(W|T).P(T)} (4.1)

    ```


    where :

    P(F|W): conditional probability of a report is fake given that the word W occurs
    in the report'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# DETECTION OF FAKE NEWS AND RUMORS IN SOCIAL MEDIA


    P(W|F): conditional probability of searching the W word in news reports which
    are fake

    P(F): probability of the news report is fake

    P(W|T): conditional probability of searching the W word in non-fake reports

    P(T): probability of the news report is non-fake

    (This expression is obtained from Bayes'' Theorem)


    First, we consider that P(F|W) values for all the words of the news report are
    available to us. Second, we combine the probability to get probability of the
    certainty that the news report is fake.

    The expressions are presented in equations 4.2, 4.3, and 4.4.


    ```

    a1 = P(F|W_1).P(F|W_2). . . . P(F|W_n)   (4.2)

    ```


    ```

    a2 = (1-P(F|W_1)). (1-P(F|W_2)). . . . (1-P(F|W_n))   (4.3)

    ```


    ```

    a = a_1/(a_1 + a_2)   (4.4)

    ```


    where:


    +   n: Count of words in the report

    a1: Product value of the probability that a news report is fake which contains
    a certain word for every word in the report

    a2: Same as it but using complement probability

    P (F|W_n): Conditional probability that a report is fake given the word W_n occurs
    in it

    a: The overall probability of the news report to be fake.


    Now assuming there is a train set which contains many reports marked as real or
    fake. so calculate the conditional probability of searching a certain word in
    training set. We can now describe the probability of searching a certain word
    in fake reports as a ratio of the fake article which consists of this to the total
    no. of articles. Similarly, we can describe the probability of searching certain
    words in true articles.


