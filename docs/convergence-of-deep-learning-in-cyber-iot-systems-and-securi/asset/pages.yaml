    is that they have the ability to use the power, which has been generated from
    different radio waves along inbuilt battery circuit [18]. The person who carries
    the RFID tag reader to enter the zone where nearby camera captures his face and
    the person information along with capture images are forwarded to a nearby server,
    which had already been connected with cloud servers when it able to detect that
    server the images tagged-to the authentication pictures and if there is proper
    verification done, the door is opened otherwise it raises an alarm and it will
    not give access to the smart home which identify as intruders or frauds person
    and which immediately send the notification to the authentication messages to
    authenticated users or authorized user [19].


