    # 1.5 Comparative Study


    There are several methods for detection of Oral Cancer starting from vital staining
    by the toluidine blue to brush biopsy, exfoliative cytology, liquid biopsy, CT
    Scan, MRI, PET CT, HPLC, different types of spectroscopy, and advanced diagnostic
    tools like molecular markers [30].


    Among these sophisticated methods incisional biopsy is the gold standard for detection
    and final diagnosis of oral cancer. Biopsy not only determines the disease but
    also grades the level of cancer (well-differentiated, moderately differentiated,
    or poorly differentiated squamous cell carcinoma), degree of malignancy, muscular
    or peritoneal invasion also be detected.


    A biopsy is an invasive procedure and needs experienced surgical hands, a good
    amount of armamentarium and infrastructural supports and biopsy also facilitate
    the distant metastasis procedure. The term biopsy still causes anxiety and apprehension
    to the patient. Here we discuss and formulate digital sensors using IoHT which
    can be easily used and detect oral cancer in a very early stage where we need
    less infrastructural support and in noninvasive way. And using advanced web-based
    API is a very effective way to identify the stage of oral cancer and it is the
    solution that is not so complicated to use and comprehend the result.'
