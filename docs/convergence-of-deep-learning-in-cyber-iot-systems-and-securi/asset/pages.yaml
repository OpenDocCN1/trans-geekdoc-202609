  md: '# 10.7 Analysis of Error


    From the confusion matrix, it is derived that classification is prevailing the
    worst-case complexity. Out of 322 questions which were classified rectify, the
    system was able to draw the correct answer or the sentence containing correct
    answer at some point of iterations.


    Difference between fine-grain and coarse-grain accuracy for answer retrieval is
    due largely on the fact that the answer is contained in one sentence or multiple
    sentences. If direct answer is available in one sentence system was able to return
    the exact answer. Otherwise the system returned the sentences containing the answer.


    In case of classifiers, it is analyzed that different classifiers predicted differently
    in case of the questions which may belong to two different categories like “Who
    is Navjot Sing Sidhu?” Both “politics” and “sports” are probable outcome classes
    as Navjot Sing Sidhu was a cricketer and is a politician now depending upon both
    the sentences reporting his multiple identities are contained in the different
    classes of the training set.


    # 10.8 Few Close Observations


    +   a) Word2Vec helps in improving the performance a lot.

    b) With Word2Vec the system learns and becomes able to give the correct answer
    of a question which was previously answered incorrectly.

    c) Classification is taking a longer time for the first time as it includes all
    kind of preprocessing and all. Once the model is built, reclassification is taking
    much less time. So, system returns the answer much quickly for repeated question;
    though neither the question nor the answer is saved in the system.

    d) The system performs ideally for factoid question. For the questions which demands
    descriptive answer the system performance degrades.

    e) For the questions in code-mixed language or having foreign words, the performance
    degrades graded. The reason is that neither Bengali Wikipedia trained Word2Vec
    nor Bengali WordNet contains the foreign word or code-mixed word. So, the system
    suffers.'
