    *Keywords:* QA system, Word2Vec, deep learning, chatbot, neural network, machine
    learning, NLP, natural language processing


    # 10.1 Introduction


    QA system is the backbone of chatbots, virtual assistants. With the increased
    use of service-based IT applications, the pressure is increasing on the customer
    care, and it is the demand of the industry to automate the answering of the customers''
    query. Robot for chatting or chatbot is being used by the industries, like banking,
    hospital, hospitality, auto-mobile where the authority needs to attend huge queries
    from a large number of customers. Banking industries like State Bank of India,
    City Bank, Standard Chartered Bank; food Delivery industries like Zomato, Swig;
    transportation industries like Uber, Ola, Indian Rail all are implementing their
    chatbot system or automatic query response system to reduce the pressure on the
    employees working in the customer department.


    Popular manufacturers of the operating systems have started using QA system in
    the form of virtual assistants to enhance the user satisfaction and user experience.
    Siri from Apple, Cortana from Microsoft, Google assistant by Google android, Alexa
    from Amazon are the most popular virtual assistants nowadays. QA system may be
    communicated either by voice or text. In case of voice-based QA system generally
    voice to text software is to convert the user''s query into text and is converted
    to audio by text software.


    QA system works with the principles—first processing the question and query and
    extract the content or meaning of the query then to return the answer by processing
    its backend repository. Generally, web or some special company database is used
    as repository. Researchers, scientists and engineers have worked to build QA systems
    for various purpose time to time. Most of them are in English or other popular
    languages. Amazon has started to train Alexa in Hindi in India. Unavailability
    of resources to make the system understand the language, is the main challenge
    to develop'
