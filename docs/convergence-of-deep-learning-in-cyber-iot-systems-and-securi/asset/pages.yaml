  md: '# ONLINE ASSESSMENT SYSTEM USING NLP TECHNIQUES 103


    Considering the various hurdles like resource availability, timing constraints,
    proctoring, evaluation of answers and development of effective assessment system
    as a competitor to physical mode of exams. Manual evaluating of answer sheet takes
    up a significant amount of time and effort. The main motive of this online assessment
    system is to reduce the effort and time spent by the faculty on setting up the
    physical question paper, conducting online examinations and evaluating the papers
    manually. The goal of the system is to train a system to understand the questions
    and the corresponding answers from the text so the system could conduct online
    examinations with the generated questions and evaluate the answers by learners
    with the generated answers. Considering the pandemic situation of COVID where
    the entire education process has been transmuted into online means, the task of
    faculty team has become an onerous one. Hence, the best supervised algorithm,
    which has the highest accuracy will be taken by this online assessment system
    and then it will be coded in a way to generate questions and answers from the
    dataset efficiently. This system is designed by focusing on educational institutions
    like schools, colleges and private institutes to conduct online assessment for
    their employees on regular basis. As this system also involves question generation
    and answer evaluation modules, it reduces the effort of faculty team. The faculty
    have to give the lecture topic, for which the test is conducted as input to this
    system. The system generates questions and its corresponding answers and then
    conduct the online assessment. Once the learner completes the test and submits,
    the system evaluates the questions and grades the learner.


    # 5.2 Literature Survey


    Das *et al.* [1] proposed an approach for descriptive online examination system.
    Multiple choice questions are easy to deal with, but this is not the case in descriptive
    questions. Natural language processing concept is adopted for evaluating the answers.
    The answers are usually in the form of words technically called as strings, which
    is taken for evaluation against the answers, technically called as keywords given
    by the examiner. A list of preposition and articles are usually preprocessed,
    as they are treated as stop words, from the strings before evaluating it. A sparse
    matrix is generated based on the occurrence of each keyword in the preprocessed
    string and evaluation based on NLP algorithms. Accuracy rate of the system was
    around 95%.


    *Tash et al.* [2] present a system for online exam, evaluation of the learner’s
    answers and its scoring. The proposed system automatically scores descriptive
    responses in a semantic way using a suitable pair-wise'
