    # 14.4.1 Motivation and Objective


    Women safety has a huge concern in today''s society. 10% of all the crimes in
    India are those of women abuse. According to a report, every 20 minutes, a woman
    is raped in India [21]. In this era of technology, almost every person has at
    least one smartphone.


    Most of the women carry their Smartphones with them, so it is important to have
    one safety application installed in their Smartphones [22–24]. Our team members
    are going to develop one mobile application. Our main intention is to provide
    safety in the simplest way possible. Our motivation is to contribute something
    good for women. There will be some features in our application, like offline mode,
    gesture control, location tracking, messaging, etc., which is useful for women
    safety [25–28].


    # 14.4.2 Proposed System


    In this paper, authors have designed a system different from the existing applications
    that have been designed till date. The following steps are performed using the
    proposed system: (i) The application named ''Patron for women'' is downloaded
    in Android phone. (ii) In the welcome screen, user''s email id needs to be confirmed
    after the registration opens. (iii) The registration screen gives two conditions,
    i.e., whether the user is registered or not. If registered, process will be filled
    if and not, the application exits and revisits the welcome screen. (iv) A warning/attention
    command appears for the permission to access Internet connection and current location
    of the device. (iv) A dashboard will open where operator''s current location,
    add emergency contact number and emergency button will be displayed on the application
    screen. In case of any situation, the user can activate the system by touching
    the emergency button or by operating the gesture control according to the operator''s
    requirement. The application sends notification to all the emergency contact list
    via SMS'
