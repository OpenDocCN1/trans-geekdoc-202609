    QA in regional languages but the QA system should be available in the mother tongue
    for major portions of citizens who can communicate in their tongue only.


    In this work, we have explored research-based solutions to build the QA system
    in one such low resource language Bengali. Bengali literature is considered to
    be one of the richest in the world. Collection of novels, dramas, from the ancient
    time to modern age written by the renowned authors are used as the repository.
    The same was digitized by the TDIL (Technology Development of Indian Languages)
    project by the IT ministry of Government of India. Broadly the repository has
    eighty-six categories of domains covering almost 11,300 A4 pages.


    The training set is formed with the sentences from this repository and the system
    is trained with the training set. Then, test set—a set of questions, is formed
    and tested with the system for determining category among eighty-six domains.
    Some examples of test set-are


