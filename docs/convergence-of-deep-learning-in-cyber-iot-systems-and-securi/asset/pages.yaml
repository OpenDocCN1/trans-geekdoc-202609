    Demand of industry boosted the research in QA system from 2004. Since then, QA
    system started to address multidomains. Question classifier was introduced and
    answering agent started to work in the specific domain determined by the classifier.
    Corporate giants became interested to employ QA system as per industry requirement.
    IBM came with a QA project "Watson" which is very successful now. Initially QA
    systems were built in English language. A group of scientists, academics, engineers,
    students devoted themselves to find algorithms to improve the performance of the
    automatic QA system. Stanford university built "Stanford Question Answering Dataset
    (SQUAD)\ with the help of volunteers. SQUAD [9] which is open dataset available
    online, contains millions of questions, answers and answer-repository to give
    the researchers a readily available experimental setup to test the performance
    of their algorithms in English QA. It would be very contextual to mention two
    of the earliest static QA system LUNAR [10] and BASEBALL [11] which were built
    in the decade of 1960s and 1970s and were dedicated to answer geological data
    of Apollo Moon and famous baseball league of USA respectively. SQUAD eased the
    work of creating and collecting dataset for the researchers who are working in
    English language and many of them have tested and published the performance of
    their QA system. Recently, Albert [12] achieved significant performance with 92.215
    F1 score. The retro-reader [13] built on top of Albert has achieved 92.978 F1.


