    is known as convolutional operation. The convolutional layers are used to detect
    the patterns. This layer combines two sets of information using convolution map
    and produces a feature map. In each convolutional layer the number of filters
    to be used must be mentioned. Convolution on each layer can be performed with
    different filters that produces a feature map. All the feature maps from all the
    convolution layer can be combined as the final feature map of the convolution
    layers. The filters are mainly used to detect the patterns. For nonlinearity purposes,
    the result is passed on to the activation function like Rectified Linear Units
    (ReLU).


    The ReLU activation function is given by: $f(x)=\max(0, x)$ ReLU helps to lessen
    fading and exploding gradient concerns. It is more competent with respect to time
    and cost for training huge data in contrast to traditional non-linear activation
    functions, such as Sigmoid or Tangent functions. Stridong on how to move the convolution
    filter is decided. In this paper, we have Stride to be the default value 1. Then
    padding can be performed to maintain the same dimensionality. Pooling reduces
    the dimensionality and in reduces the number of parameters. This reduces overfitting
    and running time of the algorithm. The most used pooling is max pooling. We insert
    fully connected layers to complete the CNN architecture. Training of the network
    is done like backpropagation with gradient descent. During training, Dropout parameter
    can be tuned to prevent overfitting. Figure 18.5 shows the diagram of CNN, which
