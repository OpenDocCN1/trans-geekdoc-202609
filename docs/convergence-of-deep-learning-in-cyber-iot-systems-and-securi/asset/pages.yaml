    # 11.1 Introduction


    Internet of Things had made everyone''s life easy and convenient with more flexibility.
    IoT had made billion of devices than every device has been connected to the World
    Wide Web easily. The invention of RFID before it made more users friendly and
    eliminated many problems like line-of-sight problems especially when it comes
    to business field it eliminated many problems where the stock updating to maintain
    had very easy. RFID was the technology which was widely used especially when it
    comes to smart home, smart buildings etc where they track the objects in every
    field with the help of barcode readers. When it comes to Smart home or smart building
    RFID was used for mostly for authentication process. When we consider IoT use
    this case of smart home there need to have IoT devices with RFID reader along
    sensor devices to continuously sense the objects and transmit the data through
    the server for authentication process. Some of the RFID cases are implemented
    practically but still lag when it comes to smart homes, smart buildings, smart
    city, smart transportation and smart healthcare systems. RFID tag readers however
    eliminate the line of sight still they are lacking behind privacy issues as they
    carry sensitive information such as identification information along with location
    of user.


    The network connected devices are more prone to a variety of attacks as they carry
    sensitive data especially when the information has been exchanged from tag to
    other parties so more research and study need to be done on this specially to
    eliminate the privacy issues. IoT-based application mainly have the problem of
    leakage of data especially with the location-based services which cause for privacy
    attacks where there is utmost need to protect it. Privacy concerns in RFID authentication
    is the major contribution of researcher as they have to take care of authentication
    process still as we have so many existing approach and methods also. When this
    problem is solved then there will be more usage of IoT applications improve in
    real world applications by which our task and applications can be done more easily.


    The motivation of our chapter is to discuss such privacy issues and to propose
    a framework that it can have many features like mutual authentication, availability,
    scalability and forward secrecy. RFID along biometric-based authentication will
    definitely aim it for high level of security. Prototype application platform has
    been used to implement where python for data science has been used for RFID authentication
    process. The rest of the book chapter has been divided into the following: section
