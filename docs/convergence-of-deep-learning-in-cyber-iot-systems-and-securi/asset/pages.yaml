    # 8.3 Mathematical Preliminaries


    This section provides the brief introduction of transform domain and classification
    technique used in this paper. The objective of this discussion is to make the
    paper self-explanatory. Section 8.3.1 briefly explains DCT and Section 8.3.2 the
    CS-based classification algorithm.


    # 8.3.1 Digital Curvelet Transform (DCT)


    Curvelet is a multidirectional transform that represents edges and other singularities
    concisely than the other transforms. For the implementation of digital curvelet
    transform (DCT), the first step is application of two-dimensional Fast Fourier
    transform (FFT) on face images and after that two-dimensional frequency plane
    is partitioned into parabolic segment. In the next step inverse FFT is taken on
    each wedge for each value of scale j'
