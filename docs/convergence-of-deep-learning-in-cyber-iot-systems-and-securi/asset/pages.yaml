    # 2.3.5.7 Feed Forward Neural Network


    Feed forward neural network is a supervised learning deep learning machine. In
    this type of network, the information travels only in forward direction, i.e.,
    from the input layer to the hidden layers, and then from the hidden layer to the
    output layer as shown in Figure 2.14.

    A pattern is displayed in the input layer of a feed forward neural network during
    the learning process, and it is transmitted through the network''s subsequent
    layers until it reaches the output layers. The output layer''s neuron count is
    equal to the number of class labels [52]. The model''s output is compared to the
    real output, and if there is a significant difference, the model is retrained
    by changing the weight of the neurons. During the classification phase the weights
    will be fixed and they are not adjusted, the output class is decided by the pattern
    mapping with the existing patterns.


