    # 12.1 Introduction


    A smart home system that is monitored and controlled remotely without the help
    of the Internet is not a new concept. By 2020, there are estimated to be 50 billion
    connected devices [1]. When it comes to home automation, a current example is
    the use of a web platform to control home appliances through an IoT-cloud-based
    structure [2]. The HTTP requests are used to control the status of the connected
    appliances. The ability to store and analyze the status of connected household
    appliances is a key feature of the IoT-Cloud technique. Smart Home Automated system
    uses actuators, various sensors, microcontrollers to extend safety, security for
    the better life of home residents. It can also give the flexibility to handle
    electronics appliances remotely and also securely with the help of security protocols.
    A smart home automation system is used to manage and maintain communication between
    smart devices. Due to the dramatic decline in the price of electronically controlled
    devices at the end of the twentieth century, microcontrollers have become increasingly
    important in building a smart home system. We have used remote controls for TVs,
    lights, fans, and air conditioners in our houses to control them. Using short-range
    communication channels on mobile devices, such as ZigBee, Bluetooth, as well as
    GSM modules and wireless LAN networks, users may now operate their home appliances
    from afar due to the expansion of technical media and networks. Figure 12.1 below
    represents a model of the smart home automation system.


    ![](img/081dc7f102a3793cb08980a6e19b8f17_273_0.png)


    Figure 12.1 IoT cloud-based smart home automation.'
