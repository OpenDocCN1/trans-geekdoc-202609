    # 1.2.1 Oral Cancer


    Oral cancer [OC] among various types of cancer is the imminent problem nowadays
    in the Indian population, it is the sixth cancer reported worldwide in population
    and is found in both sexes. 200,000 new cases are reported annually worldwide,
    two-thirds of which occur in developing countries including India with a high
    mortality rate [11]. OC is increasing rapidly in India due to lack of hygiene,
    alcohol consumption, tobacco chewing, betul smoking. OC can be defined as a malignant
    neoplasm in the oral cavity, most frequently occurring oral cancer in India with
    its premalignant conditions like oral squamous cell carcinoma (OSCC), subcutaneous
    fibrosis (OSF), erythrophelia (OE), leukopenia (OLK), lichen planus (OLP) [12].


    OC can be defined as uncontrolled cell growth along lesions in the oral cavity
    basically starts from any tissue of the mouth and invites any other neighboring
    areas in the mouth. The most common presenting features are prologed ulceration,
    which does not heal, referred to, the ear, difficulty with speaking, and opening
    the mouth or chewing and ultimately leads to death. Most people are diagnosed
    with premalignant lesions like OLK and OE white red patches covering the oral
    cavity [13]. These lesions are further subdivided according to their types, homogeneous
    (flat, thin), nonhomogenous (speckled). According to literature surveys, OLK and
    OE are the most common occurring lesions in patients with frequent duration of
    chewing betul, tobacco, and it contains arecadine, areoline, tanin, a harmful
    substance when it comes in contact with the oral cavity it leads to activation
    of T cells, macrophages, IL6, TNF-α and other metabolites under its fibroblast
    differentiate and leads to accumulation and formation of collagen in oral mucosaosa
