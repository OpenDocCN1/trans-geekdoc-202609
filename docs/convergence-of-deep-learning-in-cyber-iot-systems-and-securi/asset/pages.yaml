    (PID) controller-based home temperature control system [6], Intelligent air conditioner
    [7] by integrating temperature sensors, smartphones, motion sensor, fuzzy logic-based
    power consumption forecasting system for air conditioner [8], etc.


    In this paper, we have designed a plan for using fuzzy logic in air conditioning
