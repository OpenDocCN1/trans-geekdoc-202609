  md: '# MQTT-BASED IMPLEMENTATION OF HOME AUTOMATION SYSTEM 251


    An abundance of gadgets may be found in a smart home, all of which communicate
    with one another and share data over the Internet at intervals [3, 4]. Protocols,
    like constrained application protocol (CoAP), XMPP, and MQTT, were created to
    communicate between IoT devices and facilitate the transmission of messages in
    the IoT network. Because of MQTT''s lightweight qualities [5] and its ability
    to work efficiently in low-power, limited memory devices, it is the greatest contender
    for M2M communication. Specifically, the MQTT protocol is discussed in this work.
    Data can be exchanged in real-time using MQTT, which has a little impact on the
    communication network. There are no additional fees associated with using MQTT
    because it runs through TCP/IP, which is used by all tools and Internet-enabled
    devices.


    Any procedure for publishing and receiving data from the broker is a major factor.
    A broker is capable of managing a huge number of MQTT clients that are running
    at the same time; Home Automation System all depends on how it is implemented.
    Messages are delivered to clients who have already signed up, after which they
    are filtered by the broker and organized by topic for each subscriber. Including
    subscriptions and missed messages, all existing customers'' sessions are also
    saved in the database. Individual clients are also authenticated and authorized
    by the broker. Because of this, the broker should be simple to keep track of,
    and capable of coping with setbacks.


    Using the MQTT protocol and NodeMCU microcontroller [6, 13] ESP32, this research
    focuses on the development and implementation of a budget-friendly, secure, and
    dependable cloud-based home automation system. Secure Socket Layer (SSL) level
    security is provided via the MQTT protocol, which has built-in security. In order
    to control household appliances from afar, a user can transmit commands over the
    Internet via the cloud. Wi-Fi, cloud MQTT, ESP32 [7], relays, and a power supply
    unit make up this system.


    The rest of the document will look like this: In this instance, the home automation
    system is being used; Section 12.2 explains the basic architecture. Some of the
    security challenges in home automation and possible solutions using deep learning
    are discussed in Section 12.3. Section 12.4 explains how the proposed home automation
    system prototype is implemented. Those results can be seen in 12.5, and section
    12.6 closes with a brief exchange of views and a recommendation.'
