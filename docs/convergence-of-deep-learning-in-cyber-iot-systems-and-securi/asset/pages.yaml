    # 2.6 Suggestions


    The article will be helpful for the readers to understand about machine and deep
    learning algorithms, for the convenience of readers the same dataset is used for
    both the regression and classification task. However, we suggest the readers to
    use a dataset, which is prominent for classification to perform the classification
    task and regression for performing regression tasks. Also, in our dataset, there
    was no missing data and imbalance in the classes was not identified and the results
    might be different if we have a dataset with missing values or imbalanced classes.


    # 2.7 Conclusion


    Using a home price dataset, we attempted to evaluate the performance of machine
    learning and deep learning models. The primary objective of this work includes
    Evaluating the performances of the models using various performance metrics and
    hence the models were not optimized to get better results which might lead us
    to overfit or underfit and mislead the comparison studies. While evaluating the
    performance measures, such as MAE, MSE, RMSE, and R2 score, it was identified
    that Random forest algorithm performs better among Machine learning models and
    Tensorflow-Keras-based model performs better in Deep Learning Models. On the classification-based
    models, six performance parameters including Accuracy, Cohen Kappa Score, Matthews
    Correlation Coefficient, average precision and average recall were calculated
    and identified random classification and feed forward-based neural network was
    performing good among machine learning (ML) and deep learning (DL) models.'
