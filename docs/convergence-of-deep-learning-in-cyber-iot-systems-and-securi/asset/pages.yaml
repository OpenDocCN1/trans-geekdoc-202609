    # 4.1 Introduction


    What is fake news? "fake news" is a term that can, in a broader sense, classify
    news which are either false or click-bait or hate news. It is a kind of news consisting
    of disinformation and can spread via traditional newsprint media or digital media.
    With the advent of social networking sites, common people have become more susceptible
    to this kind of news and knowingly or unknowingly have become an agent to spread
    this news. Fake news is avoidable as it can refer to a diverse range of disinformation
    covering topics such as health, environment and economics across all platforms
    and genres. However, the term is new. Fake news started to roll out since 2016,
    and it was not named in Collins dictionary as official word of the year for 2017.
    Clickbait, misleading headlines, sloppy journalism, biased news targeted toward
    a person or a community are the causes of creating fake news around people.


    Nowadays, social media is playing an important role in spreading news whether
    it is real or fake and people are ready to imbibe it. News in social media uses
    interesting text, images and videos which attract the readers ever. It is easy
    to access and circulated quickly. News through social media has more popularity
    than the headlines of the newspaper. News reports made with purposely false information
    are easy to spread. It is considered harmful for the news ecosystem and changes
    people''s mind towards real news. In a nutshell, fake news and rumours create
    a negative effect on individuals and well as in society. To alleviate the effect
    of this, the detection of fake news or rumours now becomes an alluring topic to
    research.


    For the current research, three datasets have been used. Two of them were in England
    one dataset called Liar has small statements and the other dataset called fake
    news corpus has headlines as well as body parts. The Bengali dataset is called
    BanFakeNews has headlines and body parts too.


    Supervised Machine Learning methods have been used on the datasets. The objective
    of this work is to recognize fake or false news by considering different attributes
    of the news corpus in the classification process.


    This work is one of the first works on Fake News Detection in the Bengali Language.
    As this work achieved an accuracy of 93%, we can say it''s a very good first step
    towards the future.


    The contributions and novelties of this chapter are 1) Application of machine
    learning techniques to detect fake news and rumours, 2) Proposing an algorithm
