    # 8.4 Proposed Method


    In the work, a FR scheme has been proposed based on fusion of features in curvelet
    domain. The flow chart of the proposed method for FR is depicted in Figure 8.5.
    To increase the recognition rate of masked and unmasked faces, DCT, PCA, and CS
    technique has been exploited.


    The first step of this proposed face recognition technique is preprocessing as
    shown in Figure 8.6. The importance of this step is face mask recognition. Here
    PCA has been applied on resized images. Then, CS-based classifier [32] is used
    to detect mask. If the test image is with mask, then we extract the lower portion
    of face image, which is covered by mask and upper portion (uncovered region) of
    face image or cropped face is applied for next step. For unmasked faces, the whole
    resized face images are passed to next step.


    In the next step, DCT has been applied on cropped face image (for masked faces)
    to extract detail and coarse subbands. For DCT, we choose scale of 3 and angle
    8. After curvelet decomposition, we get coarse subband and eight detail subbands.
    Then PCA has been applied on all the detail subbands and coarse subband. For the
    reduction of feature dimension or to select the important feature, which has more
    discriminative power a fusion rule is applied. The detail of fused rule is described
    in Figure 8.7.


