  md: '# QA SYSTEM USING DL 225


    The specialty of this work is in handling the dynamic questions in natural language
    for the low resource language.

    The current trend (as discussed for SQuAD dataset) is employing deep learning
    (DL) method for this QA system. DL from scratch needs a high-end hardware facility
    and laboratory. So, our research, mixing ML (classification) and DL (Word2Vec),
    is prevalent in this time of pandemic due to COVID 19, when all the governments
    are going for cost-cutting. With reduced fund for academic, our work can show
    the way of achieving the same goal without any dedicated facility of DL. Though
    we need more human effort and time in the country like India such a system in
    large scale can generate the employment and reach the rural people in the remotest
    corner of the country.


