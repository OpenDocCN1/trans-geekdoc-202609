- pgno: 31
  md: '# 8 CONVERGENCE OF DL In Cyber-IoT SYSTEMS AND SECURITY


    saves it in a database. As a consequence of this method of communication, IoT
    devices are constrained by bandwidth, latency, and battery consumption. Consequently,
    the establishment of a new cloud connection and an HTTP request with various headers,
    and it is necessary to provide a payload for each identified location, which is
    usually in XML or JSON format. Using this method, which relies on conventional
    HTTP requests, entails a significant cost for delivering tiny and frequent payloads,
    as sensor readings, which are often only a few bytes. Firewire, cloud-based infrastructure
    for IoT platforms sponsored by the European Union and the European Commission,
    has this approach in several iterations [23, 24]. Other open and standard solutions
    will benefit greatly from this approach. Other options include Xively [25], ThinkSpeak
    [26], and Temboo [27], all of which being by providing just HTTP interfaces. MQTT
    [28] is an old telemetry system that enables a publish-subscribe-based messaging
    system that allows communication between servers and devices. HTTP-based solutions,
    as described in Yasumoto et al. [21], are considerably less efficient than they
    need more bandwidth and higher latency. AmazonWeb Services, for example, is using
    this protocol as the foundation for the Internet of Things offerings [21]. The
    aforementioned companies, as well as others like Kaa, Carriots, and Ubidots [29],
    have been integrating MQTT into their products in recent years.


    For a related strategy, ThinkSpeak suggests raw binary connecting networks instead
    of HTTP pattern overhead or publishing-subscription protocols. In addition to
    transparent HTTP compatibility, it also defines the payload encoding for better
    transmission efficiency, meaning MQTT does not supply (as opposed to MQTT). PSON
    (https://github.com/thinger-io/Protonos) is an effective encoding method that
    uses few resources. For strategies with limited resources, for instance, memory
    or computational efficiency, Protonos was built from the ground up for that. This
    approach makes it possible to encode unstructured data in a compact binary format,
    similar to JSON. To illustrate this point, Figure 1.1 shows the encoding sizes
    of numerous prominent formats, including BSON (Binary JSON), JSON, and MessagePack,
    as well as the recommended PSON and XML, which surpasses MessagePack in the IoT
    sector by a little margin. By using well-organized protocols and an encoding method,
    the proposed system decreases latency when data is directed to the cloud, conserves
    bandwidth, conserves battery power, and minimizes memory footprint.'
