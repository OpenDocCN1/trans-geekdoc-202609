    Cyber-Physical System (CPS) refers to a group of relevant systems that can monitor
    real-world objects and can even manipulate when needed. CPS systems have similarities
    with IoT, i.e., however; CPS give priority on the physical, networking, and computational
    processes which have mutual dependency. As result of their assimilation with IoT,
    a new CPS element came into existence. This new CPS element is accepted and recognized
    as “Internet of Cyber-Physical Things” (IoCP). Rapid emergence along evolutionary
    nature of the CPS has impact on many parts of people''s lives which allows for
    a greater array of services and electronics appliances, such as e-Health, e-Commerce,
    and smart homes. In one hand, it connects the cyber and physical worlds; on the
    other hand, it introduces new security threats. As a result, CPS security has
    been a discussion for both researchers and businesses. CPS, as well as the relevant
    applications, technology, and standards, threats and attacks and role of machine
    learning (ML) are covered in this chapter.


