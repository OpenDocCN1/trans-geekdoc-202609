    Stage III: Semantic Analysis—the third stage of natural language processing targets
    at extraction of meaning of the words. It is implemented by mapping of syntactic
    structures.

    Stage IV: Discourse Integration—the fourth stage of Natural Language processing
    focuses on integration of words based the meaning of their preceding words.

    Stage V: Pragmatic Analysis—the fourth stage of Natural Language processing enhances
    the necessity of real world knowledge.


