  md: '# # 10.3 Problem Statement


    Receiving a natural language question or query Q our system should


    +   a) Categorize into one or more sets of domains among 86 categories of text.
    The text of these selected domains would be processed in the next phase.

    b) Retrieve the answer A from the selected categories of text.

    A may be the exact answer (EA) or EA may be the part of A.


    # # 10.4 Proposed Approach


    Supervised learning methods are applied in the present approach to retrieve the
    answer of the question or query. Conventional preprocessing is required to mark
    the fonts similar, to mark and collect the punctuation marks, to remove the uneven
    spaces and to tokenize the words of the question sentence as well as sentences
    of the repository. Thereafter, each word of the question is tagged with the Parts
    of Speech (POS) using service of the parser developed by IIT Bombay and hosted
    by IIT Hyderabad. Applying grammatical rules, content words (CW), function words
    (FW), named entities, subjects, objects, and WH words are marked and their frequencies
    (tf) are calculated in the question or query sentence with the help of POS. Person,
    number, tense of the subject of the question are extracted from the surface level
    verb(s) of the sentence and also the form of the verb the surface level verb is
    determined by the algorithm deipcthed in Das et al. [5]. These two step preprocessing
    methods are applied to repository-sentences.


    Next, four classification methods namely Artificial Neural Network (ANN), Support
    Vector Machine (SVM), Decision Tree (DT), and Naive Bayes (NV) are used individually
    to categorize the question into one of the eighty-six categories like—novels,
    mass-media, physics, play and drama, political science, etc. If different categories
    are determined by different classifiers, all the categories are processed in the
    next phase of searching. Clearly, there can be minimum one class when all the
    four classifiers predict same and maximum four classes when four classifiers predict
    different about the class of the question. Use of classifier for the question
    is to reduce the search domain and processing time & cost. Reason to employ four
    classifiers is to remove any biasness from the'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 216 CONVERGENCE OF DL IN CYBER-IoT SYSTEMS AND SECURITY


    system. The detailed of the question classification is presented in Das et. al.
    [16].


    After getting the class(es) of the question, search operation is carried out in
    those specific class(es) only. The sentences of the repository are also classified
    taking the grammatical derived attributes like FW, CW, subject, object, number,
    gender, person, tense etc. All sentences with at least one match of the above-mentioned
    attributes, are collected in a file ANSWER_COLLECTION with sentence id, in the
    descending order of matches.


    A pretrained Word2Vec module is available for Bengali in Grave et al. [14, 15].
    Receiving any word, the module gives its vector with dimension of 300 using Skip
    and CBOW algorithm. The module is pretrained by the Bengali Wikipedia corpus.
    The words of the question sentence are passed and the vectors are collected in
    the matrix A. Out of vocabulary words are collected in a separate file and they
    are replaced by the synonyms from the WordNet (if available).


    The words of the sentences from the ANSWER_COLLECTION are passed by one to Word2Vec
    module and collected in the matrices B1, B2,...,Bn.


    Dot product (cosine multiplication) of the matrix A and Bi is done and the value
    is recorded in the ANSWER_COLLECTION.


    ```

    A.B1 = V1

    A.B2 = V2

    .

    nA.Bn = Vn

    ```


    The answers are arranged in the descending order of |V|. Rank is associated against
    the sentence id depending on the value of |V|. The sentence with the highest value
    of |V| gets the first rank and the sentence id with the smallest value of |V|
    gets the last rank.


    # 10.5 Algorithm


    Input: User''s question or query.

    Output: Answer returned to the user.'
