    # 12.5 Results and Discussions


    The cloud service eliminates the need for a local gateway, making the proposed
    system more secure than the current systems. Users and devices benefit from the
    broker cloud (Adafruit Server) in terms of processing speed. Cryptographic operations
    between different devices are also reduced by this method. SVC, a machine learning
    algorithm, learns from users'' usage history in order to predict what devices
    they will need in the future.


    To make our home more secure, we also implement a notification system during emergencies.
    Here we used SMTP server (IFTTT Maker). The DHT11 sensor continuously reads temperature
    from the environment and publishes that value in the Adafruit Dashboard. During
    that time, we also compare that value falls in the range we mentioned. If the
    room temperature is greater than the maximum range or less than the minimum range,
    then it will send a notification mail through IFTTT as an alert, so that we can
    take precautions. Figure 12.10 represents detailed results of the MQTT Broker
    Dashboard.


    We created different feeds for controlling our devices and publishing the data.


    +   1. The Light1 is used to control the light connected to NodeMCU ESP32. If
    we toggle the “Light” feed to “ON”, then the Light will be switch on and if we
    toggle the “Light1” feed to “OFF”, the Light will be switch off. And all the results
    of this feed are also stored in the Adafruit log in Figure 12.11.


