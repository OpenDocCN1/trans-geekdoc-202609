    # 9.4 Spreading Capability and Destructiveness of Virus


    One of the common phenomena of viruses is that they evolve at an extremely fast
    rate. The primary concern about it is that they do not only evolve faster but
    tend to evolve faster than the host. Two different kinds of viruses in a particular
    host can exchange genetic material and give birth to new viruses with unique characteristics.
    As a consequence, it can also increase its power of infectivity, multiplied the
    destructive capability of the viruses'' multiple times. This mandates the requirement
    of a trustworthy process for viral forecasting to conserve biosecurity and biosafety.


