    # 19.4 Security Issues in CPS


    Despite its many benefits, CPS systems are vulnerable to a variety of cyber and/or
    physical security risks, attacks, and obstacles because of its heterogeneous character.
    As a result, these systems may have disastrous consequences, necessitating the
    implementation of comprehensive security measures. This however, may result in
    unacceptably high network overhead, particularly in association with latency.
    Additionally, constant software, application, and operating system updates should
    be used to reduce zero-day vulnerabilities. Because cyber-physical systems are
    frequently used in critical contexts, the trustworthiness of software and hardware
    is a major concern. CPS security threats are classified into cyber threats and
    physical threats.


