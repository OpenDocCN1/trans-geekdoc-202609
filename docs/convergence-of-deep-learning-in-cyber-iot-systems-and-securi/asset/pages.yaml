- pgno: 18
  md: '# Preface


    Deep learning (also known as deep structured learning) is part of a broader family
    of machine learning methods based on artificial neural networks with representation
    learning. Learning can be supervised, semi-supervised or unsupervised. Deep-learning
    architectures such as deep neural networks, deep belief networks, deep reinforcement
    learning, recurrent neural networks and convolutional neural networks have been
    applied to fields including computer vision, speech recognition, natural language
    processing, bioinformatics, drug design, medical image analysis, material inspection
    and board game programs, where they have produced results comparable to and in
    some cases surpassing human expert performance. Artificial neural networks (ANNs)
    were inspired by information processing and distributed communication nodes in
    biological systems. Specifically, artificial neural networks tend to be static
    and symbolic, while the biological brain of most living organisms is dynamic (plastic)
    and analogue. The adjective ''deep'' in deep learning refers to the use of multiple
    layers in the network. Early work showed that a linear perceptron can be a universal
    classifier, but that a network with nonpolymomial activation function with one
    hidden layer of unbounded width. Deep learning is a modern variant which is concerned
    with an unbounded number of layers of bounded size, which permits practical application
    and optimized implementation, while retaining theoretical universality under mild
    conditions. and to deviate widely from biologically informed connectionist models,
    for the sake of efficiency, trainability and understandability, whence the ''structured''
    part.


    Deep learning approaches are now used in every aspect of cyber systems and IoT
    systems. The main goal of this book is to bring to the fore unconventional cryptographic
    methods to provide cyber security, including cyber-physical system security and
    IoT security through deep learning learning techniques and analytics with the
    study of all these systems.


    x'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# xviii PREFACE


    Thus, the book covers the evolution of deep learning from machine learning in
    the very first section. It also provides innovative projects and implementation
    on deep learning-based solutions in Cyber-IoT systems as well as detailed aspect
    on deep learning-based security issues in Cyber-IoT systems. Finally, this book
    also covers physical system concepts and security issues. Therefore, we feel the
    book is well suited for students (UG & PG), research scholars, and enthusiastic
    readers who want a good domain knowledge on deep learning.


    # Part I: Various Approaches from Machine Learning to Deep Learning


    Chapter 1 discuss a method using web-assisted non-invasive detection of oralmucous
    fibrosis using IoT. Oral cancer is another big threat and disease of human race.
    The early detection of oral cancer starts with a detailed literature on oral cancer
    then it gives all the primary concepts to understand the proposed system of the
    authors. The then chapter gives a proposed model to detect noninvasive oralmucous
    fibrosis which is web-assisted and for IoT.


    Chapter 2 provides a performance evaluation of machine learning and deep learning,
    the case study used in this is house price prediction. After the introduction,
    the chapter starts with a detailed literature review of machine learning and deep
    learning. The authors used a very standard research methodology to carry out this
    study, which is discussed next. Authors used Gradient Boosting Regression, Support
    Vector Regression (SVM), Support Vector Regression (SVM), Multi Output Regression,
