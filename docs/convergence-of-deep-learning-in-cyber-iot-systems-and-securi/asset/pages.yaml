    # 1.2 Literature Survey


    The authors have proposed a method by using HAN to detect fake news in Okano et
    al. [1]. This model has been evaluated in Brazilian and Portuguese fake news corpus,
    which is named as Fake.Br. Removing or keeping stop words and varying the word
    embeddings showed slightly less accuracy. The authors have proposed a modern approach
    to detect fake news, which achieves high accuracy in Zhang et al. [2]. To group
    news articles in clusters, it has a topic-based classification mechanism and extract
    events it event extraction mechanism. It compares their events with legitimate
    events to find the credibility of news. H. Karimi, P. Roy, S. Babe-Sadiya, and
    J. Tang have introduced a framework MMFD which combines extracted features, multisource
    fusion and degrees of the fakeness of articles into a standalone model in Karimi
    et al. [3] and in Wang et al. [4] The authors have proposed a new framework EANN.
    This framework is made of three elements, a feature extractor which extracts textual
    and visual features from posts, a detector which learns the differentiable representations
    and event discriminator to distinguish between fake and not fake news.


    In Yang et al. [5], the authors have proposed a network which is named TI-CNN.
    The method proposes the latent and explicit features to a single space. This model
    can be trained and tested with both the image and text data at the same time.
    H. Ahmed, I. Traore, and S. Saad have proposed a method which uses an analysis
    technique called N-Gram with some techniques of artificial intelligence in Ahmed
    et al. [6]. After experimenting with many of feature extraction techniques and
    classification techniques they found that TF-IDF feature extraction technique
    and LSVM classification technique gives the best performance. The authors have
    used an automated detector'
