    # 16.6.2 Infrared Motion Sensor


    PIR sensor, commercially known as passive infrared sensor (PIR sensor) is a type
    of electronic sensor that detects infrared (IR) light emitted by objects in its
    field of vision. They are most commonly found in motion detectors with a PIR sensor.
    PIR sensors are widely utilized in security alarm systems and automatic lighting
    systems. PIR sensors detect movement in general but do not reveal who or what
    moved. An imaging infrared sensor is required for this. PIR sensors are usually
    referred to as “PIR” or “PID,” which stands for “passive infrared detector.” The
    name “passive” refers to the fact that PIR devices do not emit energy for the
    purpose of detection. They only detect infrared radiation (radiant heat) released
    by objects. The whole work is entirely dependent on detection of infrared radiation
    or light reflected from objects.


    # 16.6.3 Thermographic Camera


    A thermographic camera (also known as an infrared camera, thermal imaging camera,
    or thermal imaging) is a device that uses infrared (IR) radiation to create an
    image, similar to how a regular camera uses visible light to make an image. Infrared
    cameras are sensitive to wavelengths ranging from about 1000 nm (1 micrometre
    or m) to about 14,000 nm (14 m) instead of the visible light camera’s 400–700
    nm range. Thermography is the process of acquiring and evaluating the data they
    offer.


