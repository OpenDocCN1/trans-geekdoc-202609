  md: '# 8.2 Related Works


    This section provides a brief review of FR for unmasked and masked face images.
    In section 8.2.1 FR techniques are reviewed, mainly based on CS, modified LBP,
    CNN, and deep learning for unmasked face images. Section 8.2.2 presents the literature
    review of FR techniques of last two years for masked faces.


    # 8.2.1 Review of Face Recognition for Unmasked Faces


    Recently compressive (CS)–based technique is used widely in different recognition
    problems. The CS theory–based sparse representation–based classification (SRC)
    technique for FR was first implemented in Wright et al. [3]. In Wright et al.
    [3], test images are represented as a sparse linear combination of the training
    images and feature extraction steps are based on eigenface and Laplacian images.
    Their experiment shows that for the large dimension of feature vectors this technique
    is insensitive to types of features. Nagesh et. [4] proposed an expression-invariant
    FR technique based on CS theory. Different images of same subjects are considered
    as an ensemble of correlated signals. The changes of face due to expression variations
    are sparse in respect to the whole face images. Here training images of any individual
    person is represented by only two type of feature images, first one is assumed
    the holistic features and another which captures the expressions of all training
    images. Fang et al. [5] presented an infrared FR method by integrating the CS
    theory and Principal Component Analysis [6]. Their experiment shows that this
    method is robust under the variation of illumination, shadow and facial expression,
    and provides higher recognition rate.


    In the last 5 years, FR-based automated attendance systems have been presented
    [7–12], and implemented successfully. In some cases, existing techniques have
    been modified or combined with another technique to improve the accuracy in presence
    of different challenges [13–16]. Different challenges for efficient FR systems
    are pose variation, illumination differences, occlusion, and expression variation
    [17, 18]. Krishna et al. [19] presented an automated FR system to cope with the
    illumination variation. To overcome the drawback of pose variation Yogesh et al.
    [20] proposed an efficient FR technique by integrating local binary pattern (LBP),
    dual cross pattern (DCP), and support vector machine (SVM).


    Deep learning network (DNN) is now widely used in different fields of pattern
    recognition. In 2014, Wolf et al. [21] proposed a DNN-based FR system. The DNN
    method gives a very high recognition rate. From'
