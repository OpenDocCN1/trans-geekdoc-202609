  md: '# Patron for Women: An Application for Womens Safety


    Riya Sil*, Snatam Kamila, Ayan Mondal, Sufal Paul, Santanu Sinha and Bishes Saha


    Adamas University, Kolkata, India


    # Abstract


    India—“The land of culture and diversity” is a given name to a nation that is
    home to several communities with distinct cultures and traditions. Despite of
    such rich background, the amount of violence against women has increased by many
    folds in the past decades. Women’s safety becomes one of the major concerns in
    Indian society. Some of the foremost reasons for these crimes involve societal
    pressure and police unable to let women report to police, slow pace of operations
    in courts, police unable to locate the crime location on time, and more. In this
    modern era, where the whole world is dependent on technology, an advanced system
    is required at the earliest as the cases involving women safety are decreasing
    drastically. In recent years, the use of smartphones has increased rapidly, making
    it an imperative part of our daily life. In this paper, authors have proposed
    an application named “Patron for Women” to reduce the crime rate while signing
    up. This information is used later in emergency situation with a preloaded message.
    Another feature includes minimum number of clicks while sending GPS location to
    the contacts. The unique feature of this application is “gesture control” that
    reduces the consumption time in operating the application.


    **Keywords:** Women safety, android application, GPS location, gesture control,
    privacy, location tracking, offline


    > *Corresponding author: riyasil1802@gmail.com

    Rajdeep Chakraborty, Anupam Ghosh, Jyotsna Kumar Mandal and S. Balamurugan (eds.)
    Convergence of Deep Learning In Cyber-IoT Systems and Security, (285–302) © 2023
    Scrivener Publishing LLC'
