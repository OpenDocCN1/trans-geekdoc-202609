  md: '# Online Assessment System Using Natural Language Processing Techniques


    S. Suriya1\*, K. Nagalakshmi2* and Nivetha S.1


    ¹Department of Computer Science and Engineering, PSG College of Technology, Coimbatore,
    India


    ²Department of Computer Science and Engineering, Sethu Institute of Technology,
    Tamil Nadu, India


    # Abstract


    Recently, online mode–based education is having more demand. Major reason behind
    this that the learners can easily gain insight of the concepts sitting at geographically
    location. This also has paved the way for conducting exams in online mode. The
    knowledge gained by the students during online study has to be assessed. Hence,
    online assessment system helps to assess knowledge gained by a learner and highlight
    the weaker portions of those concepts in the course of study. Need of the hour
    during any crisis is that education system of a country has improved, which can
    be enriched through online assessment kind of system. Conducting examination and
    answer evaluation are hectic. Testing tools for assessing performance, integration
    of ideas are highly required but might have challenges from the perspective of
    resource availability and time constraints in order to generate question and evaluate
    responses automatically. Hence, security concerns is one of the other important
    challenges to conquer. Hence, this chapter proposes an automated assessment system
    using supervised machine learning algorithm. The proposed system automatically
    generate questions with its respective answers and assess user responses. It corrects
    the responses given by the learner based on the answers generated and records
    the results.


    **Keywords:** Online assessment system, automation system, machine learning, supervised
    machine learning algorithm


