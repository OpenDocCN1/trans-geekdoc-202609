  md: '# CONCEPTS AND TECHNIQUES IN DEEP LEARNING APPLICATIONS 327


    application programs and the manner in which it provides services. Some familiar
    operating system architectures are monolithic, modular, microkernel and layered.
    Monolithic has a single huge process. It runs solely in a single address space
    of memory, and it does not have any specific structure. In this type of architecture,
    the services are applied separately, and each service provides an interface for
    others. The cost of monolithic OS module is low, therefore the system is difficult
    to understand and maintain. Another problem of monolithic kernel is that the code
    is too long and complex, therefore it is difficult to configure and understand.
    Because this type OS architecture is unreliable, it is not a good choice for IoT
    devices.


    The architecture of microkernel has a simple structure. Microkernel architecture
    has separate process which is known as server. Some servers operate in user-space
    while others operate in kernel space. A microkernel is the best choice for any
    embedded operating systems. It is due to the tiny size of kernel and small number
    of context switches. Due to minimum functionalities the kernel size is reduced
    significantly. Moreover, this type of architecture offers higher reliability,
    customization and ease of expansion since most of the OS features, such as time
    and memory server, are delivered via user-level servers.


    The modular architecture is, however, much better than monolithic, because a single
    module failure does not result in a complete system crash. The layered architecture
    method is less modular than the microkernel method. It is more stable and less
    complex than the monolithic kernel.


