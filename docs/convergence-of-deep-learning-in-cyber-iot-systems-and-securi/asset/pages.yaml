    # 4.3.3 Explanation of Approach


    We have used the News Headline and News Body attributes to train our current model.
    Those articles where the type of article was not mentioned clearly are ignored.
    Also, the articles, which are broken or not complete, are also ignored.


    At first, we have stemmed every word of the articles and ignored all the stop
    words. Stemming is a process to get the root form of the derived words. This technique
    is necessary to handle similar words (like ''sleep'' and ''sleeping'') as same
    words and this may increase accuracy. For finding the Gemma of the English words
    we have used the NLTK [15] stem methods and for Bangla words, we have used Bangla_stemmer
    [16] tool. Function words, like articles and prepositions, which do not contribute
    to the meaning of the sentences, are called Words. These words hardly affect the
    performance of the classifier have been removed. Then, we have prepared the global
    vector using the bag-of-words [17] method.


    The bag-of-words is a simple technique used in NLP and IR. In this technique,
    a text (sentence or document) is represented as the bag of its words ignoring
    the grammar and the word order. The bag-of-words technique is used mostly in document
    classification methods where the number of occurrences of each and every word
    is considered as a feature value to train a classifier. But here we are only concerned
    about whether a word is present or not in the article. So, every feature value
    must be in (0, 1). Suppose there are two sentences -


    +   1. Tanmay likes to play PUBG and Soumya likes FIFA too.

    2. Soumya also likes to watch PUBG games.


    So, the bag-of-words for these two sentences is given in Figure 4.2. Using this
    bag-of-words method, we have created the global feature vector which is a binary
    one-hot vector which is presented in Table 4.1.


    After that, we split the dataset into two parts as Train dataset and Test dataset.
    Then we have evaluated the accuracy of our proposed approach in the datasets.
    In most of the cases, 80% of train dataset has given us more accuracy. Training
    and testing percentages of three datasets is presented in Table 4.2.


