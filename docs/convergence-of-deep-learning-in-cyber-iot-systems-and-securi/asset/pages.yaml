    # 12.3.1 Distributed Denial of Service and Attack


    DoS attack are those carried out by a single person that prevents users and corporations
    that are legitimate from obtaining the services and resources they are entitled
    to. As a result of distributed denial of service (DDoS) attacks, authorized people
    and organizations are unable to access services. With respect to hardware, m2m,
    cloud and related devices, and the idea of the Internet of Things (IoT) security
    including that of embedded devices, is not a new, because the firmware and/or
    back-end mechanisms of a device are likely to be vulnerable to security threats.
    DDoS attacks at the application-level, committed by exploited IoT devices are
    extremely difficult to avoid. A denial-of-service attack on a large scale (DDoS)
    can be taken by intercepting the unique subscriber ID and sending to a “topic”
    of brokers, or by failing authentication or authorization. It is possible that
    the server will go down because of this or build a link to the attacker that is
    completely anonymous. It is important to note that MQTT brokers are the single
    point mechanism of any IoT architecture, as well as the primary target of DDOS
    attacks when open-source brokers are used.


    # 12.3.2 Deep Learning-Based Solution Aspects


    Devices that are continually linked to the Internet, using sensor data and interacting
    with external actuators, are referred to as the “Internet of Things” (IoT) [15].
    The Internet of Things (also known as IoT) is expected to have 4.5 billion connected
    devices by 2020 [17, 18]. They have some qualities, as for example, low ability
    to perform computations and the usage of protocols with a small footprint. As
    a result, Internet of Things devices are compact and efficient, it also reduces
    their ability to protect them from hackers. The abnormalities and new vulnerabilities
    posed by these diversified networked and computerized systems presented advanced
    problems in the field of cyber security [19, 20]. Assaults like the Mirai botnet,
    which infected IoT devices and launched distributed denial of service attacks
    with as many as 400,000 connected devices [21], exploited these weaknesses.


    Semisuvised learning and Fuzziness as a basis works about 84% of the time [22],
    while sequential extreme learning machines can identify network traffic with an
    accuracy of 95 [23]. Using machine learning to detect network breaches is a smart
    idea, based on these results. New criteria for signature-based IDS can be applied
    using machine learning approaches to improve the detection method, which provides
    good results'
