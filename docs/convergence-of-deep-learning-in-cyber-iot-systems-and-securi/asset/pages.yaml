    automation system that is safe, reliable, and easy to customize is the goal of
    this paper. We use NodeMCU, an open-source IoT device with low costs. Espressif
    Systems’ ESP32 Wi-Fi SoC was used to operate the first software and hardware components.
    ESP32 32-bit MCU support was introduced later. In terms of development boards
    for Espressif’s Wi-Fi Internet of Things chip, the ESP32, NodeMCU reigns supreme.
    In order to run programs on the ESP32 without having to recompile them, it employs
