    Matthew Correlation Coefficient (MCC)

    Matthew Correlation Coefficient is the measure of quality of classification system.
    MCC can be calculated Equation 2.13


    ```

    $MCC = \sqrt{PPV*TPR*TNR*NPV} - \sqrt{FDR*FNR*FPR*FOR}$

    (2.13)

    ```


    PPV: Positive Predictive Value, TPR: True Positive Rate, TNR: True Negative Rate,
    NPV: Negative Predictive Value, FDR: False Discovery Rate, FNR: False Negative
    Rate, FPR: False Positive, and FOR: False Omission Rate.


    Precision and Recall

    Precision is defined as the proportion of true positives to all positives, while
    recall is defined as the model''s ability to accurately identify true positives.
    As the model is multi classification the precision and recall are calculated for
    each class and averaged to get the precision and recall score.


    F1 Score

    F1 is the measure of test accuracy using precision and recall are calculated by
    applying those values in Equation 2.14


    ```

    $F1 score = 2 \frac{(Precision* Recall)}{(Precision + Recall)}$

    (2.14)

    ```


