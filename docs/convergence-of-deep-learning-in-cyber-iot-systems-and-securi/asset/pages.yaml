    # 12.2 Architecture of Implemented Home Automation


    MQTT [8] is a lightweight connection protocol that follows the publish-subscribe
    architecture (pub/sub) architecture shown in Figure 12.2. Messages are transferred
    (or published) from a client-side to a server-side in this system. As a result
    of this, another client receives the message. Senders must make sure clients are
    subscribed to topics they publish in order to ensure that their messages are delivered
    correctly [9].


    It is generally utilized in places where communication channels have limited throughput,
    such as smart cities, home automation, and monitoring [10]. To the MQTT server,
    the client posts a message that is relayed to other clients that are subscribed
    on the same subject as the client.


    A folder-like structure is used to represent the subject matter, it is also arranged
    how files are arranged in folders in a computer''s OS. MQTT is a low-overhead
    messaging protocol that can be used on unstable networks. A single packet''s error
    and flow control are delegated to lower tiers of the network''s protocol design
    because MQTT [8] sits above TCP. MQTT uses a publisher/subscriber-based approach,
    therefore, information is organized into hierarchical “topic” structures subscribing
    members will be able to follow lines and nodes. For the sake of message delivery,
    MQTT provides a QoS (quality of services) level that is adapted to the needs of
    customers [11]. The secure sockets layer (SSL) and transport layer


    ![](img/081dc7f102a3793cb08980a6e19b8f17_275_0.png)


    Figure 12.2 MQTT architecture.'
