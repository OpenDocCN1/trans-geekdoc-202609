    # 2.3.5.8 Recurrent Neural Networks


    Recurrent neural network (RNN) are network-based models used commonly for sequential
    data. It holds an input memory which helps us to save the previous outputs, which
    helps in classification of the sequential data [53]. In feed forward network,
    the information passes from input to output and never comes back, whereas in recurrent
    neural network the information cycles through a loop as in Figure 2.15.


    RNN varies from other networks in that it contains two inputs: as other networks,
    the current input and the recent variable''s output. This model uses backpropagation
    for optimising the output. It also uses gradient descent which reduces the function.


    # 2.3.5.9 LSTM Recurrent Neural Networks


    LSTM networks, are specialised network to solve pattern-based predictions. like
    the Feed forward model, has input, hidden, and output layers. LSTM layer consists
    of self-connected recurrent blocks, called as memory blocks. Each block consists
    of one or more recurrent networks connected to it as shown in Figure 2.16.


    The three gates of LSTM are input, forget and output gate, all these gates are
    fully dependent on the previous hidden layer. The output of the network is decided
    by the current cell state. These cell states are transferred from one cell to
    another by the tanh functions.'
