    # 1.3 Primary Concepts


    # 1.3.1 Transmission Efficiency


    Most current IoT systems send data to the cloud via hypertext protocol (HTTP)
    and use the message queuing telemetry protocol (MQTT) conventional transport protocols
    [21, 22]. A unique payload in the HTTP method is sent by every device that delivers
    data to the cloud. Like a normal web server, the IoT platform gets these data
    and'
