  md: "# QA SYSTEM USING DL 217\n\nStep 1: Input question or query is gone through\
    \ standard pre-\nprocessing technique, parsing and tokenization.\n\nStep 2: Words\
    \ of the question or query sentence are tagged\nPOS with the help of LTRC shallow\
    \ parser developed by IIT\nBombay and hosted by IIIT Hyderabad.\n\nStep 3: Applying\
    \ grammatical rules, Content Words (CW),\nFunction Words (FW), Named Entities,\
    \ subjects, objects and\nWH words are marked in the question or query sentence\
    \ with\nthe help of POS.\n\nStep 4: Person, number, tense of the subject of the\
    \ question\nextracted from the surface level verb(s) of the sen-\ntence and also\
    \ the root form of the verb of the surface\nlevel is determined using the algorithm\
    \ depicted in\nDas et al. [5].\n\nStep 5: Classification methods namely Artificial\
    \ Neural\nNetwork (ANN), Support Vector Machine (SVM), Decision\nTree (DT), and\
    \ Naive Bayes (NV) are used individually to\ncategorize the question into one\
    \ of the eighty-six cateo-\nries using feature vector containing tf of all the\
    \ grammati-\nal attributes extracted in Step 3 & 4 like FW, CW, subject,\nobject,\
    \ person, number, tense etc.\n\nStep 6: Step 1 to 5 is repeated for the sentences\
    \ in the repos-\n containing the class(es) of the question to collect the\nsentences\
    \ in the ANSWER_COLLECTION associated with\nsentence_id.\n\nStep 7: Collect the\
    \ vector in matrix A using Word2Vec algo-\nrith [14].\n\nStep 8: Collect the vector\
    \ in matrix Bi using Word2Vec algorithm\n[14] for all the sentence:i to n in ANSWER_COLLECTION.\n\
    \nStep 9: Perform A.Bi^T i to n and write the value |Vij| in the\nANSWER_COLLECTION\
    \ against the sentence_id i.\n\nStep 10: Rank the answers in the descending order\
    \ of [V].\n\nStep 11: Try to form the exact answer (EA) from the answer\nsentence\
    \ with rank (with the smallest rank) using rule-\nknowledge base or return the\
    \ selected sentence as A\n record the feedback.\n\nStep 12: For negative feedback\
    \ repeat step 11 with rank\ni=2 and so up unto n. (n = number of sentences in\
    \ the\nANSWER_COLLECTION)\n\nStep 13: END."
