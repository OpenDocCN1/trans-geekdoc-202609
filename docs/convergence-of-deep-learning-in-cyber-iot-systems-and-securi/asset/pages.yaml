  md: '# An Efficient Masked-Face Recognition Technique to Combat with COVID-19


    Suparna Biswas


    Faculty of Electronics & Communication Engineering Department, Guru Nanak Institute
    of Technology, Kolkata, India


    # Abstract


    Since the major COVID-19 pandemic hit the world, using face masks has become an
    important part of our daily lives. Not wearing masks for a moment outside can
    be a life-threatening mistake. But the mask covers the lower portion of the face
    region. So we were not able to extract important features from the lower region.
    That is why in this paper, an efficient face recognition scheme has been presented
    by integrating discrete wavelet transform (DCT), compressive sensing (CS), and
    principal component analysis (PCA) to improve the face recognition rate of masked
    faces. The use of discrete wavelet transform (DCT) provides an enhancement of
    edge information of face images by applying an image fusion technique. To extract
    the feature vector in lower dimensional feature space, PCA has been applied on
    the fused images. Finally, the performance of this proposed technique is tested
    by using compressive sensing-based classifier. Extensive experiments are simulated
    on masked and unmasked faces, and our method performs better than the conventional
    PCA.


    **Keywords:** Face mask, discrete wavelet transform, compressive sensing, principal
    component analysis, masked face recognition, coronavirus, COVID-19


    # 8.1 Introduction


    The coronavirus (COVID-19) has created a pandemic situation all over the world
    from the last 2 years. This virus can be transmitted through direct


    > *Corresponding author: suparna.biswas@gnit.in


    > Rajdeep Chakraborty, Anupam Ghosh, Jyotsna Kumar Mandal and S. Balamurugan (eds.)
    Convergence of Deep Learning In Cyber-IoT Systems and Security, (165–182) © 2023
    Scrivener Publishing LLC'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 166 CONVERGENCE OF DL IN CYBER-IoT SYSTEMS AND SECURITY


    contact. That is why we avoid conventional biometric systems like passwords and
    fingerprints. In this situation face recognition (FR) is one of the safer recognition
    techniques. To reduce the spreading of this virus, wearing a mask is mandatory
    for all. But it covers a large region of faces and reduces the recognition rate.
    It is a challenge for the FR researchers to deal with masked faces.


    FR is a technique of identification and verification of a person from digital
    face images or from videos. It is basically a challenging task in the research
    field of biometrics. Different researchers are dealing with different challenges
    of FR like pose variations, illumination variations, variations in facial expressions,
    blurring effect and occlusions etc. Sometimes preprocessing schemes are a very
    essential or important task to or reduce the different types of noise from the
    images and indirectly to increase the recognition rate. But the most important
    part of any recognition technique is extraction of important features and dimension
    of extracted features. Due to the very large dimension of input feature vectors
    most of the FR methods are expensive computationally or time.


    Feature dimension and feature types are other issues of FR [1]. It is also studied
    in Yan and Zhang [1] to solve the difficulties of high dimensionality and for
    the selection of feature types. To resolve the aforementioned problem, this paper
    explores a novel FR framework by integrating CS, digital wavelet transform (DCT)
    [2], and fusion-based PCA for masked faces. Here CS, DCT, and PCA are integrated
    for constructing a novel FR method, where the foremost aim is lower feature dimension
    and of course recognition accuracy of masked faces.


    The objective of this proposed method is to improve the FR rate in the presence
    of a mask. Here, DCT, PCA, and CS are integrated to increase the accuracy of masked
    face images. Here, DCT has been used to get the better edge information from the
    unmasked face region and a PCA-based feature level fusion technique has been used
    to extract important features of low dimension. At the last step, to improve the
    recognition rate CS-based classification technique has been utilized.


    This paper is structured as: Section 8.2 presents literature review of unmasked
    and masked face recognition technique, Section 8.3 provides the description of
    digital curvelet transform and compressive sensing-based classification. Section
    8.4 presents the concept of proposed FR method, Section 8.5 analyzes the result
    applied on ORL and AR database for masked and unmasked face images. Finally, the
    paper is concluded in Section 8.6 followed by future scope.'
