    Histogram: a graphical bar chart that shows data on the horizontal axis and counts
    on the vertical axis [17].


    Box Plot: also termed as whisker plot used to represent the spread and the center
    of the data, this helps us to identify the min, max, mean, median, and average
    of the data [18].


    Quantile Plot: Graphical method of identifying if two of the data are of the same
    distribution. It plots the again two data and explore the common distributions
    [19].


    Scatter Plot: a sort of chart that depicts the relationship between variables
    by using dots to represent each variable [20].


    Count Plot: a similar plot to histogram which could be used not only for numeric
    data, but also for categorical data [21].


    # 2.3.3 Data Preparation


    Data preparation is often referred as data preprocessing, it is the process of
    making modifications in the raw data before proceeding machine and deep learning
    techniques. It includes handling missing records, improperly formatted, anomalies,
    inconsistent values, and limited attributes [22].


    In our work the following data pre-processing steps are performed


    +   a. Merging the train and test csv files

    b. Identifying the missing null values available with the dataset and the features
    have more null values have to be identified and removed (using drop command)

    c. Separate the dataset into numeric and categorical data

    d. Identify the most prominent features in numeric data and could be converted
