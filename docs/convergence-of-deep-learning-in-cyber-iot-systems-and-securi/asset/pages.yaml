    transactions and needs production to the end users. Routh Srinivasa Rao and Alwyn
    Roshan Pais [1] proposed machine learning model in detecting phishing URL. The
    detection of the URL is carried out based on the heuristic features for the URL,
    third party service, and source code. Carolin Jeeva and Elijah Blessing Rajesh
    [2] proposed heuristic features and based on the relationship of phishing URLs
    and rules are generated. Neda et al. [3] proposed rule-based classification and
    features are generated based on human experience using data mining techniques.
    The proposed technique by Jain A.K and Gupta [4] uses automatic update of legitimate
    websites and warns the online user of sensitive keywords.


    The legitimacy of the webpage is accessed based on 1) IP address and domain matching
    module, 2) Hyperlinks features from source code. Few antiphologies by the combination
    of blacklist and whitelist-based approaches. These approaches are deployed as
    toolbars or browser extensions. The whitelist using astral and visual similarity
    of web pages is proposed by Sonowal et al. [5]. The drawbacks in similarity-based
    approach arise due to the dependency on source code and can be rectified by analyzing
    the features in captured images of legitimate and suspicious websites.


    A predictive black list-based approach is proposed to identify phishing websites
    [6]. The blacklist-based approach is effective, and it depends on the excellence
    of the list maintained. The advantage of using Black list-based approach is that
    it can be implemented easily. The downside of using a blacklist-based approach
    is that it cannot identify the sites not listed, which yields a low positive rate.
    After the phishing website is launched, the particular URL is updated in the blacklist,
    and is a major disadvantage. Frequent updates are done but still new phishing
    sites are not done timely. The shortcoming of the traditional black list method
    cannot recognize the non-blacklisted sites and thereby not deal with the new phishing
    sites. Like black, white list–based approach also needs to update its information
    on a large scale. Unfortunately, the white list not contain all the legitimate
    sites. Although the approach of using black list and white list is efficient,
    checking in black list alone is not an efficient method because the recent phishing
    URLs are not maintained in the black list. If the system having any technical
    issues in connecting with the black list database, the system cannot respond and
    this leads to incorrect results.


    An approach that uses search engine was proposed by Huh et al. [7] for phishing
    detection but in a lighter way. The full URL string is given to search engine
    thereby reducing the keyword extraction method followed'
