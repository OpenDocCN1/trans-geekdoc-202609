    # 4.4 Results and Analysis


    # 4.4.1 Datasets


    We have used a total of three datasets to extensively test our proposed model.


    +   - Liar Dataset [9]—Liar is a benchmark dataset which is publicly available
    to detect fake news. The makers created a collection of more than 10K manually
    classified short statements from the website POLITIFACT.COM. There are a total
    of six labels which are half-true, mostly-true, true, false, barely-true, pants-fire.
    Half-true, true and mostly-true labels have been considered as none and the other
    labels have been considered as fake. The size of the dataset is near about 3 MB.

    - Fake News Corpus [13]—Fake News Corpus is a dataset composed of more than million
    of news articles mostly taken from “www.opensource.com” and the dataset is open
    source. There are near 1L articles in the version that have used. There are many
    labels such as some corresponds to fake and some corresponds to not fake. The
    news articles have been labeled using these labels, fake news, satire, extreme
    bias, conspiracy theory, junk science, hate news, clickbait, fake news, satire,
    hate news and click-bait have been considered as fake and others have been considered
    as non-fake. The size of the dataset is near about 28 GB.'
