    # Abstract


    Reinforcement learning involves the learning by an agent, which is essentially
    a mathematical function in an interactive environment. It learns through trial
    and error in which it receives a positive or negative reward for each action taken
    against the environment. The agent takes actions via policies, which are the decisionmaking
    functions and maps the various states to actions. The goal of RL is to find a
    set of suitable actions that maximize the total cumulative reward of the agent.
    Q learning and its neural network, i.e., counterpart has been significant in solving
    reinforcement learning problems. For IoT-based solutions, usage of reinforcement
    learning helps in better decision making where the volume of known data is less
    used effectively in a supervised algorithm. It also helps in distinctive identification
    of states and experiment with the reward mechanism to simulate various real-world
    scenarios. One roadblock using deep reinforcement learning algorithm in IoT-based
    solutions is to frame an architecture that would support the learning, as well
    as scalable enough to support increasing workload and improve the agent performance.
    In this chapter, we would like to propose a public cloud-based IoT solution architecture
    that can host a deep reinforcement learning network, implement learning patterns
    for the same and use the network on IoT edge devices. This architecture will provide
    a reference to deploy Deep Q Learning based workloads on IoT edge devices with
    the help of containers. This will help in building solutions that spend less time
    to sync with cloud and rather focus to react quickly to localized changes and
    improve agent response to events.


