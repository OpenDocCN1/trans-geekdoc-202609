    Cyber-IoT Infrastructure and Deep Learning–Based Security Issues


    Arnab Chakraborty


    Department of CSE, Netaji Subhash Engineering College, Kolkata, India


    # Abstract


    Smart home automation is an absolute necessity in today’s world. The term “smart
    home automation” refers to a system of interconnected electronic devices that
    can be operated from a distance and regulate all of a household’s activity. By
    of technological developments and new innovations in the Internet of Things (IoT),
    home automation is becoming increasingly popular. Automation of home বাড়িতে,
    such as televisions, refrigerators, and air conditioners, fans, and lights, as
    well as motor pumps, can be accomplished through the use of local networking or
    mobile apps. Using artificial intelligence, we can make real-time decisions.


    In situations, denial-of-service attacks, unwanted network access, data leakage,
    and other vulnerabilities can be mitigated by IoT devices and protocols as safe
    as possible. The Internet of Things makes use of CAP and MQTT, two protocols for
    exchanging data over short distances. These protocols are the cause of the Dos
    attack. Dos attacks can be thwarted by employing the MQTT protocol. A Wi-Fi-based
    development board, the ESP32 is used in this paper to develop and implement MQTT
    using sensors and actuators attached to the microcontroller board and a Mosquitto
    MQTT broker to remotely monitor the system and to handle security threats and
    malicious activity using MQTT protocol, which is based on the protocol.


    **Keywords:** Home automation, MQTT protocol, ESP32, NodeMCU, cyber-IoT, lightweight
    protocol, DL-based security issues


