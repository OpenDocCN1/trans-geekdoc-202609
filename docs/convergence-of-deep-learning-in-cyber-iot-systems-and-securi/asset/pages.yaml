    # 14.3.1 A Mobile-Based Women Safety Application (I safe App)


    Mandapati et al. [11] have designed an application named "I safe App" that takes
    the name and contact number of the person as input with whom she wants to connect
    at the time of her emergency. Users are able to add multiple contacts in the emergency
    contact list. In case of any emergency, notification will be sent to the said
    contact list. As soon as the user press the SOS button, an emergency message will
    be sent to the respective contact person followed by the GPS location of the victim''s
    mobile device.'
