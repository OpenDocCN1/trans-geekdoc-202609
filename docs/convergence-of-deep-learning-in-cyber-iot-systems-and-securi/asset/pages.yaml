  md: '# 168 CONVERGENCE OF DL In Cyber-IoT Systems and SECURITY


    literature review, it has been noticed that deep learning-based convolutional
    neural network (CNN) is more fruitful for image classification. A detailed review
    of CNN-based FR approaches in Taigman et [21], Taskiran et [22], Tolba et [23].
    In Pranav et [24], the authors proposed a CNN-based FR technique to increase the
    recognition rate of the system. In 2018, Sun et [25] presented a CNN-based approach
    to cope with the occlusion variation.


    # 8.2.2 Review of Face Recognition for Masked Faces


    For the last 2 years, many researchers have been working with masked faces. Like
    in Ge et [26], they presented a LLE-CNN-based FR technique. In 2020, Walid Hariri
    proposed a deep CNN model to recognize the masked faces [27]. At first, they have
    removed the masked face region as shown in Figure 8.1 and then CNN has been applied
    on the unmasked region (cropped face as in Figure 8.1) to extract the important
    features as shown in Figure 8.2.


