  md: '# Fuzzy Logic-Based Air Conditioner System


    Suparna Biswas*, Sayan Roy Chaudhuri, Ayusha Biswas and Arpan Bhawal


    Faculty of Electronics & Communication Engineering Department, Guru Nanak Institute
    of Technology, Kolkata, India


    Abstract

    With the exponential increase in population, thus increasing the temperature of
    earth day by day air-conditioner has become an indispensable part of our life.
    In this situation, energy saving should be our key role. In this paper, we have
    presented a fuzzy control based mechanism for air-condition system. By considering
    the input variables and parameters we can lower the use of electricity by adjusting
    the function of ac. For better application we consider the climatic conditions
    of rural and urban area separately. This research paper will increase the scope
    of fuzzy logic control systems in large prospective with potential benefits. This
    Fuzzy logic based algorithm for Air Controlling system is simulated using MATLAB.


    Keywords: Transitional, prosaic, FIS, antecedent, Fuzzification, Defuzzification,
    mamdani, gradient


    # 7.1 Introduction


    In real world, sometimes, we face a situation when we cannot define whether the
    state is true or false, in this situation, fuzzy logic provides a very suitable
    flexibility for reasoning. This Fuzzy Logic is a logic that commenced in 1965
    [1]. Fuzzy logic is a logic that consists of many values that permits transitional
    values to be defined within prosaic as true or false, yes or no, high or low,
    etc [81]. Zadeh composed the idea of fuzzy control that allows small inset values
    to be used in order to command the functioning of electronic devices. We can consider
    the inaccuracies and


