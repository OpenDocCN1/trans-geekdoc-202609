  md: '# Secure Access to Smart Homes Using Biometric Authentication With RFID Reader
    for IoT Systems


    K.S. Niraja* and Sabbineni Srinivasa Rao


    Department of Computer Science and Engineering, Koneru Lakshmaiah Education Foundation,
    Vaddesawar, Guntur, Andhra Pradesh, India


    # Abstract


    Internet of Things (IoT) had brought us drastic change in every field where especially
    the drastic change from the invention of radiofrequency identification (RFID)
    tags, which eliminated line of sight problem. RFID usage has been used not only
    in smart home but also in other fields that are smart agriculture, smart health
    care, IoT device, machine to machine interaction has increased over human to machine.
    When machine to machine usage had started to develop, we need to protect the data
    in more secured where authentication is playing a vital role which has been taken
    more precisely especially machine-to-machine interaction. RFID tag readers though
    eliminate the line of sight, carries sensitive data as well, so we need to take
    efficient authentication methods. Artificial intelligence has been widely used
    in every field we can enhance a framework to provide more security to smart home
    applications with different machine learning algorithms to provide more privacy
    to user data. Hence, we need to prove more secure authentication mechanism for
    IoT applications. The framework, which we propose, performs better than the already
    existing approaches with the help of RFID reader along biometric authentication.


    **Keywords:** Smart health, machine to machine interaction, tag readers, biometric
    authentication, line of sight problem, framework, privacy'
  merge: -1
  img_proc: true
