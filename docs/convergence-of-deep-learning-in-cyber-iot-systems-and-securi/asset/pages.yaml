    # 6.2 Dynamic Programming


    Dynamic programming is an algorithmic technique to solve an optimization problem
    that supports to break the problem into different subproblems and utilizing the
    concept that the optimal solution to the total problem depends on the optimal
    solution to its subproblems. Individual subproblems are considered often as stages
    of decisions because this technique has been used to optimize the discrete time
    dynamic process which can be shown as a sequence of decisions in time. This is
    basically the reason of using the word “dynamic.” Firstly, any optimization problem
    has objectives. The objective function is a mathematical equation which explain
    the production result corresponds to maximize profits or minimize losses based
    on a set of alternative values or variables. The variables can be referred as
    resources, availability, capacity, technology, etc. and thus to reduce the restrictions
    of the environment in which the business works. Any optimization problem must
    have some objectives like minimizing travel time, minimizing cost, maximizing
    profits, maximizing utility.


    Bellman equation basically used to solve Markov decision process by helping us
    in finding the best policy and value function. As we know in deterministic environment,
    we are always aware about the present state and the next state after performing
    some actions. Bellman showed that a dynamic optimization problem in discrete time
    can be stated in a recursive which follow a step-by-step form known as backward
    induction by noticing relationships between the value function in a single time
    period and the value function in another time period. Basically, this relation
    is called “Bellman Equation.” In this technique, the optimal strategy in the last
    time period is described previously as a function of the given variable’s value
    at a particular time and the optimal value of the objective function is represented
    as the value of the state variable. Then, the intermediate period’s optimization
    includes maximizing the sum of the period’s specified objective function and the
    optimal value of the objective function in future, showing the particular period’s
    optimal policy depend upon the value of the mentioned variable as of the intermediate
    decision. Some important factors of Bellman Equation are –'
