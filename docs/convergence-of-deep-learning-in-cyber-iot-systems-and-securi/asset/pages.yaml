    # ## 6.5 Conclusion


    In this book chapter, we have taken the case of Q learning and its counterpart
    Q learning. These are two very popular algorithm of reinforcement learning algorithm.
    We have included a case study for optimizing path of an autonomous agent in a
    warehouse to collect goods so that the entire process of sales and delivery became
    optimized for the end customers. We have developed this case study using Q learning
    and have tried to show that Q learning can be used in a very efficient way to
    determine the shortest path and also determine the maximum rewards for a particular
    agent. We have shown a reference architecture to deploy a serializable machine
    learning algorithm in any of the edge devices. We have taken the case of Azure
    cloud computing platform to deploy the agent in Azure IoT edge which in turn provides
    reusability for the agent to be used in any of the autonomous device in a warehouse.
    In this particular chapter, we have also shown how this cloud computing module
    can be made available and durable along securing the same using various Azure
    cloud services. The deployment was containerized using docker.


