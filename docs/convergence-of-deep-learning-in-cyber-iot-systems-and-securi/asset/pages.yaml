    # 16.3 Properties of Insects


    Each bug has its own set of characteristics that distinguishes it from the others.
    Locusts are a type of short-horned grasshopper that has a swarming colony phase
    [29]. These insects are primarily migratory-based species that can fly in a disciplined
    manner when they develop. However, under some circumstances, they become more
    arbitrary and change their behavior, habitats, and activities in a mutant manner,
    which is damaging [30]. The basis for the recognition of locust and other grasshopper
    species creates swarms under under intermittently favorable conditions [31], but
    no taxonomic differentiation is recognized between them [32]. However, when drought
    is combined with rapid vegetation growth, serotonin in their brains initiates
    a dramatic sequence of changes: they begin to breed in large numbers, eventually
    becoming destructive and migratory once their populations grow enough [33]. They
