  md: '# 10.6.4 Calculation of TP, TN, FP, FN, Accuracy, Precision, Recall, and F1
    score


    TP = True Positive = The system predicts that the answer of the question is present
    in the repository and actually the repository has the answer (the answer is returned
    as part of output)


    TN = True Negative = The system predicts that the answer of the question is not
    present in the repository and actually the repository does not contain the answer


    FP = False Positive = The system predicts that the answer of the question is present
    in the repository but actually the repository does not contain the answer


    FN = False Negative = The system predicts that the answer of the question is not
    present in the repository and actually the repository contains the answer


    +   TP for TDIL dataset is TP_TDIL=322

    TN for TDIL dataset is TN_TDIL=9

    FP for TDIL dataset is FP_TDIL=3

    FN for TDIL dataset is FN_TDIL=6


    So, accuracy for TDIL dataset is Accuracy_TDIL = (TP+TN)/(TP+TN+FP+FN)

    = 97.35


    So, precision for TDIL dataset is Precision_TDIL=TP/(TP+FP)

    = 99.07


    So, recall for TDIL dataset is Recall_TDIL=TP/(TP+FN)

    = 98.17


    So, F1 score for TDIL dataset is F1 score= 2*(Recall*Precision)/ (Recall + Precision)

    = 1941.4/197.24 = 98.61


    TP for translated SQuAD dataset is TP_SQuAD=900

    TN for translated SQuAD dataset is TN_SQuAD=25

    FP for translated SQuAD dataset is FP_SQuAD=14

    FN for translated SQuAD dataset is FN_SQuAD=13


    So, accuracy for translated SQuAD dataset is Accuracy_SQuAD = (TP+TN)/(TP+TN+FP+FN)=
    97.16


    So, precision for translated SQuAD dataset is Precision_SQuAD = TP/(TP+FP)

    = 98.46


    So, recall for translated SQuAD dataset is Recall_SQuAD=TP/(TP+FN)

    = 98.57'
