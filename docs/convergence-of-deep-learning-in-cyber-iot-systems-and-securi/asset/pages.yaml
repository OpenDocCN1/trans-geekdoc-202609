- pgno: 247
  md: '# 224 CONVERGENCE OF DL IN CYBER-IoT SYSTEMS AND SECURITY


    # 10.9 Applications


    Applications of the QA system are already discussed. From virtual assistant to
    chatbot, QA is the backbone. With increased market presence service-based organizations,
    pressure on the customer care is increasing. Auto-mation in replying to the customer
    query or question is becoming the natural choice for the large entrepreneurs.


    Applications of the QA system in the low resource languages are seen both in government
    and private sector. Many remote users are proficient in their mother tongues only.
    Their questions or queries asked dynamically cannot be resolved with static translation
    of “Frequently Asked Questions” (FAQ) to the local languages. Even machine translation
    also cannot solve this if the answer is not available in the translated language
    of the question.


    Nowadays digital contents like text and audio are available in regional languages,
    QA system in local languages can only solve this challenge efficiently. This scenario
    is equally applicable for some Vojpuri buyer (who knows only Vojpuri language)
    over e-commerce platform like Flipkart as well as for some feedback collection
    program of Ministry of Micro Small and medium scale Enterprise (MSME), Govt. of
    India from rural entrepreneurs.


    # 10.10 Scope for Improvements


    The system is tested for Bengali language. The acceptance of our developed system
    will become universal if it is tested in some other languages; preferably in some
    South Asian low resource languages.


    # 10.11 Conclusions


    The present work has been carried out in the supervised learning method. First,
    the questions are classified using four classification techniques and those classes
    or domains are introspected for searching of answers. WordNet and Word2Vec are
    used for retrieving the best answers semantically. Here machine learning (ML)
    is applied diligently to give an end-to-end solution to build QA system in the
    low resource language Bengali.'
  merge: -1
  img_proc: true
