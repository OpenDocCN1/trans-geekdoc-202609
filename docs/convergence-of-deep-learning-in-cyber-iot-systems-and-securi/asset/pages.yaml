    # 9.3 Corona Virus Variants Tracing


    Tracking the corona virus-infected people and finding the different variants of
    viruses is an immense challenge for scientists and administrators globally. In
    this perspective, DL is also establishing itself as an eminent technique. Most
    of the recently proposed systems are successfully tracking the pandemic-affected
    global citizens globally with the aid of DL methods.


    Based on the respiratory pattern, a real-time system has been proposed by Wang
    et al. [10] to detect potential patients in public areas with the aid of a depth
    camera. The heterogeneous nature of respiratory pattern and unavailability of
    suitable data makes this application inappropriate for transfer learning. Thus,
    the researcher has proposed a simulation model for generating training data. In
    the proposed work, authors consider bidirectional recurrent neural and attentional
    network mechanisms with the GRU model to be trained by the simulated data which
    was later validated with actually acquired data. The manual selection of ROI does
    not fit with the real-time system as it necessitate the selection before each
    use and also does not guarantee to be figurative the effective areas when people
    move. And so, automatic selection of ROI has been considered with the help of
    Microsoft Azure Kinect API has been considered in the proposed work. In the proposed
    work, researchers have selected three ROI—chest, abdomen, and shoulder and extracted
    respiratory signals from selected ROIs by calculating average value of depth data.
    Figure 9.3, presented in Wang et al. [10], demonstrate measurement of Central-Ape
    waveforms of a specific subject to three ROIs.


    Medical laboratory test for COVID-19 detection is costly and timeconsuming, which
    is not suitable for detection of pandemic infectious disease where the larger
    mass of the population is at risk. In Maghdid et al. [11], a low-cost, Smartphone
    sensor-based, quick responsive, artificial intelligence-based framework has been
    proposed for preliminary COVID-19 diagnosis. The proposed framework comprises
    four layer—input/reading layer, measurement layer, sensor layer and computation
    layer. Consideration of multiple readings from multiple sensors provides the ground
    for the reliability of the framework. Further improvement of the proposed model
    is also possible with the aid of transfer learning and cloud.'
