    #  5.5 System Implementation


    The five basic stages of natural language processing, shown in Figure 5.8, are


    +   Stage I: Lexical Analysis—this first stage of natural language processing
    aims in analyzing the words once after identifying them. Lexicon is a terminology
    that refers to words or phrases of a language under consideration. Lexical analysis
    process of splitting input into words.

    Stage II: Syntactic Analysis—the second stage of natural language processing focuses
    on analysis of words. Later, the relationship between the words is analyzed and
    transformed into structural format.


    ![](img/081dc7f102a3793cb08980a6e19b8f17_138_0.png)


    **Figure 5.8** Stages in natural language processing.'
