    # 8.6 Conclusion


    In this paper, an efficient FR method is presented utilizing a new technique of
    feature level fusion approach which improves the recognition rate of masked and
    unmasked faces. This technique integrates the discrete curvelet transform, PCA,
    and compressive sensing. This method is also applicable for real time problems
    due to the low dimension of fused features. The simulated results on ORL and AR
    databases clearly show that the proposed technique is more preferable compared
    with other techniques and provide the maximum recognition rate 91.5% on ORL database
    and 94.95% on AR database for unmasked faces. For masked faces, this technique
    also performs well and 90.35% maximum recognition rate for ORL database and 91.70%
    maximum recognition rate for AR database. Results show that the proposed technique
    provides better recognition rate compared to conventional PCA for both the cases
    of masked and unmasked faces. The proposed technique can be extended in the future
    as:


    +   - Other fusion can be used for the selection of features to get better recognition
    rate under the different constraint of FR.

    - The importance of other features in the transform domain may be used to improve
    the recognition rate.

    - Deep learning technique can be applied to improve the recognition rate.


