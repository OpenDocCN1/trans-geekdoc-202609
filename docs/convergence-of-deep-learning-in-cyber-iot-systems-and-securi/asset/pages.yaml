    # 3.1 Introduction


    In the year 2006, cyber physical systems was coined by the then program manager
    Dr Helen Gill, of United States National Science Foundations. Cyber-physical systems
    is a prime example of integrating networking, computation systems, embedded computing
    systems etc. Here, it is worthy to note that embedded computers is monitor and
    control with the physical process with the feedback or similar loop. The cyber-physical
    systems has greater impact in economic and social development; directly and indirectly
    [1, 7]. Cyber-physical systems is associated with the traditional embedded systems,
    computers, software systems practically in systems in which principle mission
    is not computation. It is important and applicable in the cars, toys, medical
    devices, engineering systems, etc. The biggest advantage of cyber-physical systems
    is merges and combines with the physical communication with systems viz: software,
    network, modeling, designing, and analysis techniques. However, cyber-physical
    systems can be defined and marked its progress during the beginning of cybernetics.
    Machine learning in short called as ML, and it is part of artificial intelligence.
    The ML is applicable in allowing software to be more accurate with proper predicting
    outcomes without explicitly programming. Machine learning algorithms predict new
    output values based on previous data. Machine learning is important because it
    has many abilities viz. identification of the trends in customer behavior, identification
    of proper development of new products. Some of the companies, such as Facebook,
    Google, Uber, etc, are actively using machine learning in their operations and
    activities. Machine learning is the competitive differentiator in many organizations
    and fall under the AI or artificial intelligence it is required when machines
    typically depends on human intelligence [14, 30]. The machine learning system,
    the machines are able in learning by experience and that is without required or
    proper human involvement whereas the subset is deep learning; and here artificial
    neural networks, algorithms are basically inspired by the human brain. Deep learning
    can be called as deep structured learning, and deep learning can be three types,
    such as supervised, semisupervised, and unsupervised.'
