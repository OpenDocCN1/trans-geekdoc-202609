    # 12.4.2 DHT11


    An inexpensive digital sensor is the DHT11 for measuring temperature and relative
    humidity. Humidity and temperature readings may be taken instantly using this
    sensor, which can be used with any microcontroller. It has a sensor where humidity
    is conductive in nature for the measurement of temperature, as well as a thermistor.
    The humidity-sensing capacitance uses moisture-holding substrate as a dielectric
    between both electrodes. The capacitance value varies with variations in relative
    humidity. Analog resistance levels are measured and processed by the integrated
    circuit. Figures 12.5 depicts the basic diagram of DHT 11 sensor.


