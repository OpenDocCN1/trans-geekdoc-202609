  md: '# 2.3.6 Performance Metrics for Regression Models


    Performance metrics are used to identify how efficient our model is prediction.
    There are many performance measures in which we are using few of the metrics,
    namely mean absolute error (MAE), mean square error (MSE), root mean square error
    (RMSE), and R-Squared value (R2 score) are used in this work.


    Mean Absolute Error (MAE)

    It is used to calculate the average magnitude of prediction mistakes. The MAE
    is defined in Equation 2.8. A perfect model is it have MAE score of 0.0.


    > $MAE = \sum_{i=1}^{n} |y_i - x_i| \quad (2.8)$


    where $y_i$ are the predicted values, $x$ is the true value, $n$ is the data count


    Mean Square Error (MSE)

    The mean of the square difference between the real and forecasted values is calculated
    using MSE as shown in Equation 2.9. A good model will be holding a MSE value of
    0.0


    > $MSE = \frac{1}{n} \sum_{i=1}^{n} (y_i - \hat{y}_i)^2 \quad (2.9)$


    where $(y_i - \hat{y}_i)$ is the difference between the expected and real values,
    $n$ is the data count.


    ![](img/081dc7f102a3793cb08980a6e19b8f17_68_0.png)'
