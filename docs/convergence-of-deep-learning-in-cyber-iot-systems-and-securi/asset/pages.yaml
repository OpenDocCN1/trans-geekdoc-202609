    rules of fuzzy logic, database describes the membership functions of fuzzy sets,
    Decision-making unit, as per rules, it performs operations, fuzzification-interface
    unit transforms the crisp quantities into fuzzy quantities and defuzzification
    interface unit transforms the fuzzy quantities into crisp quantities.


