  md: '# CONVERGENCE OF DL IN CYBER-IoT SYSTEMS AND SECURITY


    # 5.3 Existing Algorithms


    Natural Language Processing (NLP). NLP is a divisional portion of artificial intelligence
    that enables computers to understand, interpret and manipulate human language.
    NLP combined with Machine Learning (ML), creates systems that learn to perform
    tasks on their own and get better by gaining experience. NLP takes its roots from
    many disciplines to bridge the gap between human communication and computer understanding.


    Kohonen Self Organizing Maps (Kohonen SOM). The objective of this algorithm is
    transformation of arbitrary dimensions of input patterns into a two-dimensional
    feature map. It is done using topological ordering. Architecture of SOM involves
    a feed-Forward structure with a single layer of neurons arranged in rows and columns.
    Initialization, Competition, Cooperation and Adaptation are the four basic processes
    required to build Kohonen maps.


    Vector Base Similarity. The similarity between two vectors is evaluated using
    a function called Vector similarity. Cosine similarity is the most popularly used
    similarity measure for Real-Valued vectors. It is helpful in retrieval of information
    to ensure the similarity of documents.


    K-Nearest Neighbor (KNN) classifier. KNN classifier is the simplest Machine learning
    algorithm that assumes the similarity between the input case and available cases.
    This algorithm stores all the available data and classifies a new data point based
    on similarity. This algorithm is mostly used for classification problem rather
    than regression.


    Naive Bayes classifiers. Naive Bayes classifiers are a collection of classification
    algorithms based on Bayes'' theorem with an assumption of independence among predictors.
    It assumes that the presence of a particular feature in a class is unrelated to
    the presence of any other feature.


    Convolutional Neural Network (CNN). Convolutional Neural Network is a multilayer
    neural network that can detect features in data. It is a deep learning algorithm
    which can take an input image, assign importance to various objects in the image
    and be able to differentiate from the other.


    Recurrent Neural Network (RNN). Recurrent Neural Network is a class of ANN where
    connections between nodes form a directed graph along a sequence. It is a sequence
    of neural network blocks that are linked to each other like a chain. It is trained
    to recognize patterns.


    Random Forest. Random forests are an ensemble learning method for classification,
    regression construction of decision tree.


    As conclusion to survey, the working of existing algorithms are shown in Figure
    5.3. The advantages and disadvantages of existing algorithms are shown in Table
    5.1.'
