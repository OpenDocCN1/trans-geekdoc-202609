  md: '# MQTT-BASED IMPLEMENTATION OF HOME AUTOMATION SYSTEM 253


    security (SSL) control the authenticity of MQTT brokers through the user names
    and passwords.


    A message can be reserved on the MQTT broker for an indefinite amount of time
    if desired. As soon as a subscriber signs up for a given topic, they get a message
    with links to the most recent article that contain useful information [12].


    If the broker and the clients are still connected or not, and when a single one
    of them is disconnected, a keep-alive system has been put into operation in MQTT
    to prevent partial operating status. Transmission times are excessively long or
    a lack of communication for an extended amount of time triggers this mechanism.
    The client or broker sends a request status message, which is returned with an
    appropriate acknowledgment of the request. There is a last will and testament
    (LWT) [9, 12] notification given to any broker or client who fails to respond
    within the allotted time period. MQTT does not require a client to be aware of
    its physical identification, in contrast to a traditional client-server architecture.
    Messages sent over MQTT can be in any format, which is a significant advantage.
    This implies that the data format must be agreed upon in advance by both the publisher
    and subscriber.


    # 12.3 Challenges in Home Automation


    The MQTT protocol is not completely safe, and it has various limits and drawbacks
    that must be considered. The primary drawback of MQTT is that it is heavily dependent
    on the broker. The whole system''s scalability can be affected by the broker.
    MQTT brokers can support many networks as they can handle, also it might be a
    source of failure in an automation system because they are powered by batteries.
    If the broker experiences a power outage and goes into offline mode, the data
    sent/received by the devices to it may be affected and may not be able to publish
    it.


    Most IoT devices are points of entry into the home or any corporate network, therefore,
    the present dangers are associated with information infringement, because private
    servers hold 80% of the world''s data [14]. As long as the attackers have access
    to such servers, huge damage can occur. In order to protect network security and
    IT systems from the ever-increasing dangers, a number of aggressive actions can
    be done. Data integrity, privacy, confidentiality, as well as accessibility of
    the MQTT messaging protocol should contain IoT security features becoming progressively
    serious both in terms of averting commercial and personal calamities [15].'
