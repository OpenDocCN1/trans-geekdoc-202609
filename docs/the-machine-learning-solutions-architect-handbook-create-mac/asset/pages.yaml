- pgno: 111
  md: '# 4 Data Management for Machine Learning


    As a practitioner of **machine learning (ML)** solutions architecture, I often
    get asked to help provide architecture advice on data management platforms for
    ML workloads. While data management platform architecture is mainly considered
    a separate technical discipline, it is an integral part of ML workloads. To design
    a comprehensive ML platform, ML architects need to be familiar with the key data
    architecture considerations for machine learning and know the technical detail
    of a data management platform to meet the needs of data scientists and the automated
    ML pipelines. In this chapter, we will look at where data management intercepts
    with ML. We will talk about key considerations for designing a data management
    platform for ML. We will then deepe into the core architecture components for
    a data management platform and the relevant **AWS** technologies and services
    for building a data management platform on AWS. Finally, you will get hands-on
    and create a **data lake** with support for **data catalog** management, **data
    discovery**, and **data processing** workflows on AWS.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Specifically, we will have the following main sections in the chapter:


    +   - Data management considerations for ML

    - Data management architecture for ML

    - Hands-on exercise - data management for ML


    # Technical requirements


    In this chapter, you will need access to an AWS account and AWS services such
    as Amazon S3, Amazon Lake Formation, AWS Glue, and AWS Lambda. If you do not have
    an AWS account, follow the official AWS website''s instructions to create an account.


    # Data management considerations for ML


    Data management is a broad and complex topic. Many organizations have dedicated
    data management teams and organizations to manage and govern the various aspects
    of a data platform. Traditionally, the main focus of data management has been
    meeting the needs of transactional systems or analytics systems. With the growing
    adoption of ML solutions, there are new business and technology considerations
    for data management platforms.


    To understand where data management intersects with the ML workflow, let''s bring
    back the ML life cycle, as shown in the following figure:


    ![](img/bd21298357d8484151447cff0b2f138b_112_0.png)


    Figure 4.1 – Intersection of data management and the ML life cycle'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Data management considerations intersects with the ML life cycle in three stages:
    data understanding and preparation, model training and evaluation, and model deployment.


    During the data understanding and preparation stage, data scientists will need
    to identify data sources that contain datasets for the tasks tasks perform exploratory
    data analyses, such as data statistics, the correlation between the different
    features, and distribution of data samples, to understand the dataset. You also
    need to prepare the data for model training and validation, which would normally
    include the following:


    +   - Data validation to detect errors and verify the data quality (for example,
    data range, data distribution, data types, or missing/null values)

    - Data cleaning to fix the data errors

    - Data enrichment to generate new signals through the joining of different datasets
    and data transformation


    The data management capabilities required during this stage mainly include the
    following:


    +   - The ability to search for curated data using various metadata such as dataset
    name, dataset description, field name, and data owner

    - The ability to access both raw and processed datasets for exploratory data analysis.

    - The ability to run queries against the selected dataset to get details, such
    as statistical details, data quality, and data samples

    - The ability to retrieve data from the data management platform to a data science
    experimentation or model building environment for further processing and engineering

    - The ability to run data processing against a large dataset


    During the model training and validation stage, data scientists will need to create
    a training and validation dataset for formal model training. The data management
    capabilities required for this stage include the following:


    +   - Data processing capabilities and an automated workflow to process raw/curated
    datasets into training/validation datasets of different formats for model training

    - A data repository for storing and managing the training/validation datasets
    and their versioning

    - The ability to serve the training/validation dataset to the model training infrastructure
    to train models'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'During the model deployment stage, the trained models will be used to serve
    predictions. The data management capabilities required for this stage include
    the following:


    +   - Serving data needed for the feature processing as part of the input data
    when invoking the deployed models


    +   - Serving pre-computed features as part of the inputs when invoking the deployed
    models


    Unlike traditional data access patterns for building transactional or business
    intelligence (BI) solutions where developers can work with non-production data
    in lower environments for development purposes, data scientists need access to
    production data for model developments.


    Now, we have discussed the considerations for ML data management. Next, let''s
    deep dive into the data management architecture for ML.


    # Data management architecture for ML


    Depending on the scope of your ML initiatives, you may want to consider different
    data management architecture patterns to support them.


    For small-scale ML projects with limited data scope, team size, and cross-functional
    dependencies, consider purpose-built data pipelines that meet the project''s specific
    needs. For example, suppose you only need to work with structured data from an
    existing data warehouse and a dataset from the public domain. In that case, you
    want to consider building a simple data pipeline that extracts the required data
    from the data warehouse and the public domain to a storage location owned by the
    project team as an-needed schedule for further analysis and processing. The following
    figure shows a simple data management flow to support a small-scope ML project:'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/bd21298357d8484151447cff0b2f138b_115_0.png)


    Figure 4.2 – Data architecture for an ML project with limited scope


    For large, enterprise-wide ML initiatives, the data management architecture for
    ML is very similar to the enterprise architecture for analytics. Both need to
    support data ingestion from many different sources and centrally manage the data
    for various processing and access needs. Analytics data management mostly works
    with structured data, where an enterprise data warehouse is usually the core architecture
    backend. ML data management would need to work with structured, semi-structured,
    and unstructured data for different ML tasks, where a data lake architecture is
    usually adopted. ML data management is usually an integral part of the broader
    enterprise data management for both analytics and ML initiatives.


    The following figure shows a logical enterprise data management architecture.
    It consists of several key components: data ingestion, data storage, data processing,
    data catalog, data security, and data access:


    ![](img/bd21298357d8484151447cff0b2f138b_115_1.png)


    Figure 4.3 – Enterprise data management'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'Next, let''s discuss each of the key components in detail and what a data management
    architecture looks like when built with AWS native services in the cloud.


    # Data storage and management


    ML workloads require data of different formats from many sources, and the size
    of the dataset can be very large, especially when dealing with unstructured data.
    Cloud object data storage, such as Amazon S3 or Hadoop Distributed File System
    (HDFs) on Hadoop cluster, is usually used as the storage medium for data. Functionally,
    you can think of cloud object storage as a file system where different formats
    can be stored. The files can also be organized by folder-like prefixes inside
    the object to help with the organization of objects. Also, note that prefixes
    are not physical folder structures. It is called object storage because each file
    is an independent object. Each object is bundled with metadata, and it is assigned
    with a unique identifier. Object storage is usually known for unlimited storage
    capacity, cloud object analytics from the object metadata, API-based access, and
    low cost.


    To effectively manage the large volumes of data in a cloud object storage medium,
    a data lake architecture backed by cloud object storage is the recommended way
    to centralize data management and data access. Depending on the scope, the data
    lake can be scoped for the entire enterprise or individual line of business. A
    data lake is meant to store unlimited amounts of data and manage them in different
    life cycle stages, such as raw data, transformed data, curated data, and ML features.
    The main purpose of the data lake is to bring different data silos into a single
    central repository for central data management and data access for both analytics
    needs and ML needs. A data lake can store different formats, including structured
    data from databases, unstructured data as documents, semi-structured data as JSON
    and XML, and binary formats such as image, video, and audio. This capacity is
    especially important for ML workloads since ML deals with different formats.


    The data lake should be organized by different zones. For example, a landing zone
    should be established for the initial data ingestion from different sources. Data
    pre-processing and data quality management processing, the data can be moved to
    the raw data zone. Data in the raw data zone can be further transformed and processed
    to meet different business and downstream consumption needs. To further ensure
    the reliability of the dataset for usage, the data can be curated and stored in
    the curate data zone. For ML tasks, ML features often need to be pre-computed
    and stored in an ML feature zone for reuse purposes.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# AWS Lake Formation


    AWS Lake Formation is an AWS data management service that simplifies the creation
    and management of a data lake on AWS. It provides four core functionalities:


    +   - A data source crawler to infer the data structure from data files

    - The creation and maintenance of a data catalog for the data in the data lake

    - Data transformation processing

    - Data security and access control


    The following figure shows the core function of AWS Lake Formation:


    ![](img/bd21298357d8484151447cff0b2f138b_117_0.png)


    Figure 4.4 – AWS Lake Formation


    Lake Formation integrates with AWS Glue, a serverless Extract, Transform, Load
    (ETL) and data catalog service, to provide data catalog management and ETL processing
    functionality. We will cover ETL and data catalog components separately in later
    sections.


    Lake Formation provides centralized data access management capability for managing
    data access permissions for the database, tables, or different registered S3 locations.
    For databases and tables, the permission can be granularly assigned to individual
    tables and columns and database functions, such as creating tables and inserting
    records.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Data ingestion


    The data ingestion component is responsible for taking data of different formats
    (for example, structured, semi-structured, and unstructured) from different sources
    (for example, databases, social media, file storage or IoT devices) and persisting
    data in storage, such as object data storage (for example, Amazon S3), data warehouses,
    or other data stores. The ingestion patterns should include both real-time streaming
    as well as batch ingestion to support different sources.


    There are different data ingestion technologies and tools for the different kinds
    of ingestion patterns. **Apache Kafka, Apache Spark Streaming, and Amazon Kinesis-Firehose**
    are some of the common tools for streaming ingestion. Tools such as **Secure File
    Transfer (SFTP)** and AWS Glue can be used for batch-ordered data ingestion. AWS
    Glue supports different sources and targets (for example, **Amazon RDS, MongoDB,
    Kafka, Amazon DocumentDB, S3**, and any databases that use JDBC connections.


    When deciding which tools to use for data ingestion, it is important to assess
    the tools and technologies based on practical needs. The following are some of
    the considerations when deciding on data ingestion:


    +   **Data format, size, and scalability:** Consider the needs for varying data
    formats, data size, and data velocity. ML projects could be using data from different
    sources and different formats (for example, tabular data such as **CSV** and **Parquet**,
    semi-structured data such as JSON/XML, and unstructured data such as documents
    or image/audio/video files). Do you need to scale the infrastructure to handle
    large data ingestion volume when needed, and do you need to scale it down to reduce
    costs when the volume is low?


    +   **Ingestion patterns:** Consider the different data ingestion patterns you
    need to support. The tool or combination of several tools needs to support batch
    ingestion patterns (in other words, moving bulk data at different time intervals)
    and real-time streaming (moving data as sensor data or clickstreams in real time).


    +   **Data preprocessing capability:** The ingested data might need to be preprocessed
    before it lands in the target store. So, consider tools with either built-in processing
    capability or those that integrate with external processing capability.


    +   **Security:** The tools need to provide security mechanisms for both authentication
    and authorization.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '+   Reliability: The tools need to provide failure recovery capability so critical
    data is not lost during the ingestion process. If there is no recovery capability,
    then make sure there is a capability for re-running ingestion jobs from the sources.


    +   Support for different data sources and targets: Ingestion tools need to support
    a wide range of data sources, such as databases, files, and streaming sources.
    The tool should also provide an API for data ingestion.


    +   Manageability: Manageability should be another consideration. Does the tool
    require self-management, or is it fully managed? Consider the trade-off before
    cost and operational complexity.


    There are are of AWS services for data ingestion into a data lake on AWS. Kinesis
    Data Streams, Kinesis Firehose, **AWS Managed Streaming for Kafka**, and AWS Glue
    for streaming data requirements. For batch ingestion, you can have AWS Glue, SFTP,
    and AWS **Data Migration Service (DMS)**. In the following section, we will discuss
    how Kinesis Firehose and AWS Glue can be used for data ingestion management.


    # Kinesis Firehose


    Kinesis Firehose is a fully managed service for loading streaming data into a
    data lake. By fully **managed**, we mean you don''t manage the underlying infrastructure;
    instead, you interact with the service API for the ingestion, processing, and
    delivery of the data.


    Kinesis Firehose supports the key requirements for scalable data ingestion:


    +   Support for different data sources such as websites, IoT devices, and video
    cameras using an ingestion agent or ingestion API.


    +   Support for different delivery targets, including Amazon S3, **Amazon Redshift**
    (an AWS data warehouse service), **Amazon ElasticSearch** (a managed search engine),
    and **Splunk** (a log aggregation and analysis product).'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   Data processing capabilities through integration with AWS Lambda and Kinesis
    Data Analytics. AWS Lambda is a serverless service that runs custom functions
    written in Python, Java, Node.js, Go, C#, and Ruby. Check the official AWS documentation
    for more detail on how Lambda works. The following figure shows the data flow
    with Kinesis Firehose:


    ![](img/bd21298357d8484151447cff0b2f138b_120_0.png)


    Figure 4.5 – Kinesis Firehose data flow


    Kinesis works by creating delivery streams – that is, the underlying entity in
    the Firehose architecture that can accept streaming data from data producers.
    The delivery stream can have different delivery targets, such as S3 and Redshift.
    Depending on the data volume from the producers, configure the throughput of the
    data stream by the number of shards (for example, each shard can ingest 1 MB/sec
    of data and can support 2 MB/sec for data read). Kinesis Firehose provides APIs
    for increasing and merging shards.


    # AWS Glue


    AWS Glue is a fully managed serverless ETL service that can be used for ingesting
    data in batches. It connects to data sources such as transactional databases,
    data warehouses, and NoSQL databases, and sources data movement to different targets,
    such as Amazon S3, based on schedule or event triggers. If needed, it can also
    process and transform data before it delivers the data to the target. It supports
    a number of processing capabilities such as the Python shell (for running Python
    scripts) and Apache Spark (for Spark-based data processing).'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# # AWS Lambda


    AWS Lambda is the serverless compute platform on AWS. It works natively with many
    other AWS services, such as Amazon S3. A Lambda function can be triggered to execute
    by different events, such as the S3 new event. Lambda functions can be developed
    to move data from different sources, such as a source S3 bucket to a target landing
    bucket in the data lake. AWS Lambda is not designed for large-scale data movement
    or processing; however, for simple data ingestion and processing jobs, it is a
    very effective tool.


    # # Data cataloging


    The data catalog is a critical component for data governance and for making the
    data in the central data storage discoverable by data analysts and data scientists.
    This is especially important for data understanding and exploration phase of the
    ML life cycle when data scientists need to search and understand what data is
    available for their ML projects. Some of the key considerations for a data catalog
    technology include the following:


    +   **Metadata catalog**: Support for a central data catalog for the data lake
    metadata management. Examples of metadata are database names, table schemas, and
    table tags. A popular standard for metadata catalogs is the **Hive metastore catalog**.


    +   **Automated data cataloging**: The capability to automatically discover and
    catalog datasets and infer data schemas from different sources, such as Amazon
    S3, relational databases, NoSQL databases, and logs. This is usually implemented
    as a crawler that draws data sources and automatically identifies metadata, such
    as data column names and data types.


    +   **Tagging flexibility**: The ability to tag metadata entities (for example,
    databases, tables, fields) with custom attributes to support data search and discovery.


    +   **Integration with other tools**: The data catalog can be used by a wide range
    of data processing tools to access the underlying data, as well as native integration
    with data lake management platforms.


    +   **Search**: Search capability across a wide range of metadata in the catalog,
    such as database/table/field name, custom tags/description, and data type.


    There are different technical options for building data catalogs. Here, we will
    discuss how AWS Glue can be used for data cataloging.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# AWS Glue Catalog


    In addition to the ETL functionality, AWS Glue also provides a built-in data catalog
    feature that integrates natively with AWS Lake Formation. The Glue catalog can
    be a drop-in replacement for the Hive metastore catalog, so any Hive metastore-compatible
    applications can work with the AWS Glue catalog.


    The AWS Glue catalog structures its metadata hierarchy in the form of databases
    and tables. Databases are containers for tables that represent the data store.
    And just like regular databases, you can have multiple tables in a single database,
    and the tables can come from different data stores. However, each table can only
    belong to a single database.


    The AWS Glue catalog has a built-in crawler that can automatically crawl data
    sources, discover schemas, and promote the central data catalog. The crawler supports
    the database and table creation for new data sources as well as incremental updates
    to the existing databases and tables. The crawler can run on-demand or be run
    by any trigger, such as the completion of an AWS Glue ETL job.


    When working together with AWS Lake Formation, the access permission to the databases
    and tables in the catalog can be managed through the Lake Formation entitlement
    layer.


    # Data processing


    The data processing capability of a data lake provides the data processing frameworks
    and the underlying resources to process data for different purposes, such as data
    error correction, data transformation, merging, data splitting, and ML feature
    engineering. Some of the common processing frameworks include Python scripts and
    Apache Spark. The key requirements for data processing technology include the
    following:


    +   **Integration and interoperability with the underlying storage technology:**
    The capability to work with the underlying storage natively. This simplifies data
    access and movement from the storage to the processing layers.


    +   **Integration with the data catalog:** The capability to work with the data
    metastore catalog for querying the databases and tables in the data catalog.


    +   **Scalability:** The capability to scale up and scale down the compute resources
    based on the data volumes and processing velocity requirements.


    +   **Language and framework support:** Support for common data processing libraries
    and frameworks, such as Python and Spark.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Now, let''s take a look at several available AWS services that can provide
    data processing capabilities in the data lake architecture.


    # AWS Glue ETL


    In addition to supporting data movement and data catalogs, the ETL features of
    AWS Glue can be used for fully managed general-purpose data processing. Glue ETL
    provides a number of built-in functions for data transformation, such as the drop
    of the NULL field and data filtering. It also provides general processing frameworks
    for Python and Spark to run Python scripts and Spark jobs. Glue ETL works natively
    with the Glue catalog for accessing the databases and tables in the catalog. Glue
    ETL can also access the Amazon S3 storage directly.


    # Amazon Elastic Map Reduce (EMR)


    Amazon EMR is a fully managed data processing platform on AWS. It is designed
    for large-scale data processing using the Spark framework and other Apache tools,
    such as Apache Hive, Apache Hudi, and Presto. It integrates with the Glue Data
    Catalog and Lake Formation natively for accessing databases and tables in Lake
    Formation.


    # AWS Lambda


    AWS Lambda can also be used for data processing for small data volumes and files.
    Lambda can be triggered by real-time events, so it is a good option for lightweight,
    real-time data processing.


    # Data versioning


    To establish the lineage for model training, we need to version-control the training/validation/testing
    dataset. Data versioning control is a hard problem as it requires both tools and
    following best practices for it to work. During the model building process, it
    is very common for a data scientist to get a copy of a dataset, and perform their
    own cleansing and transformation to the data, then save the updated data as a
    new version. This creates a huge challenge to data management in terms of duplication
    and linking the data to the different upstream and downstream tasks.


    Data versioning for the entire data lake is out of scope for this book. Instead,
    we will discuss a couple of architecture options for the versioning control of
    training datasets.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# S3 partitions


    For each newly created or updated dataset, save it in a new S3 partition with
    a prefix (for example, the unique S3 folder name) for each dataset. While this
    approach potentially creates data duplication, it is a clean and simple way to
    separate different datasets for model training. The datasets should be generated
    by a controlled pipeline to enforce the naming standards and should be made readonly
    for the downstream applications to ensure immutability. The following example
    shows an S3 partition structure with multiple versions of a training dataset:


    ```

    s3://project1/<date>/<unique version id 1>/train_1.txt

    s3://project1/<date>/<unique version id 1>/train_2.txt

    s3://project1/<date>/<unique version id 2>/train_1.txt

    s3://project1/<date>/<unique version id 2>/train_2.txt

    ```


    In this example, the two, the two versions of the dataset are separated by two
    different S3 prefixes.


    # Purpose-built data version tools


    There are a number of open source tools, such as DVC, for data versioning control.
    For example, DVC works with any Git-compliant code repo and can use S3 as the
    storage backend for the training dataset. Each dataset version is associated with
    a unique commit ID that can uniquely identify a version of data.


    # ML feature store


    For large enterprises, common reusable ML features such as curated customer profile
    data and standardized product sales data should be centrally managed to reduce
    the ML project life cycle, especially during the data understanding and data preparation
    stages. Depending on the scale, you can build feature stores that meet the basic
    requirements, such as insertion and lookup of organized features for ML model
    training. Or, you can implement commercial-grade feature products, such as Amazon
    SageMaker Feature Store (an AWS ML service that we will cover in later chapters).
    SageMaker Feature Store has online and offline capability for training and inference,
    metadata tagging, feature versioning, and advanced search.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Data serving for client consumption


    The central data management platform needs to provide different methods, such
    as APIs or Hive metastore-based methods, for online access of the data. Also,
    consider data transfer tools to support data movement from the central data management
    platform to other data-consuming environments for different data consumption patterns.
    Consider tools that have built-in data serving capabilities or that can be easily
    integrated with external data serving tools.


    There are several serving patterns for supplying data to data science environments.
    Let''s discuss the following two data access patterns.


    # Consumption via API


    With this pattern, the consumption environments/applications can pull data directly
    from the data lake using Hive metastore-compliant tools or through direct access
    to S3. Amazon services such as Amazon Athena (a big data query tool), Amazon EMR
    (a big data processing tool), and Amazon Athena Redshift Spectrum (a feature of
    Amazon Redshift are used for querying data lake data indexed in Glue catalogs).
    This pattern is good when you don''t need to make a copy of the data and only
    need to select a subset of the data as part of the downstream data processing
    tasks.


    # Consumption via data copy


    With this pattern, a subset of the data in the data lake is copied to the storage
    of the consumption environment for different processing and consumption needs.
    The more recent data can be loaded into Amazon Redshift in an analytics environment
    or delivered to S3 buckets owned by a data science environment.


    # Data pipeline


    Data pipelines automate the process of data movement and transformation. For example,
    you might need to build a data pipeline that ingests data from the source, performs
    validation and cleansing, enriches the dataset with new data and transformation,
    and then performs feature engineering and creates the training/validation/testing
    dataset for the ML model training and validation tasks. There are various workflow
    for building data pipelines, and many data management tools come with built-in
    data pipeline features.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# AWS Glue workflows


    AWS Glue workflows are built-in workflow management feature of AWS Glue that can
    be used to orchestrate different Glue jobs, such as data ingestion, data processing,
    and feature engineering. A Glue workflow is made of two types of components: a
    trigger component and a node. A trigger component can be a schedule trigger, an
    event trigger, or an on-demand trigger. A node can be either a crawler job or
    an ETL job. A schedule trigger or an on-demand trigger are used to kick off a
    workflow run, and an event trigger is a success/failure event emitted after the
    crawler job or ETL job. A workflow is a series of triggers and ETL or crawler
    jobs.


    # AWS Step Functions


    AWS Step Functions is a workflow orchestration tool. It integrates with other
    AWS processing services, such as AWS Glue and Amazon EMR. It can be used to build
    a workflow to run the different steps in a workflow, for example, data ingestion,
    data processing, or feature engineering.


    # Authentication and authorization


    Data lake access for administration and data consumption needs to be authenticated
    and authorized. Federated authentication, or AWS Identity and Access Management
    (IAM), authenticates users to verify user identities. For access to data catalog
    resources and the underlying data storage, AWS Lake Formation uses the built-in
    Lake Formation access control and AWS IAM. The built-in Lake Formation permission
    model uses the database/revoke commands to control permission to different resources
    (for example, database and tables) and database actions (for example, create table).
    When a requester makes a request to access a resource, both IAM policy and Lake
    Formation permissions are enforced and verified before access is granted.


    There are several personas involved in the administration of the data lake and
    consumption of the data resources:


    +   - Lake Formation administrator: A Lake Formation administrator has the permission
    to manage all aspects of a Lake Formation data lake in an AWS account. Examples
    include granting/revoking permissions to access data resources by other users,
    register data stores in S3, and creating/deleting databases. When you create Lake
    Formation, you will need to register an administrator. An administrator can be
    an AWS IAM user or IAM role. You can add more than one administrator to a Lake
    Formation data lake.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   - Lake Formation database creator: A Lake Formation database creator has
    been granted permission to create databases in Lake Formation. A database creator
    can be an IAM user or IAM role.


    +   - Lake Formation database user: A Lake Formation database user can be granted
    permission to perform different actions against a database. Example permissions
    include create table, drop table, describe table, and alter table. A database
    user can be an IAM user or IAM role.


    +   - Lake Formation data user: A Lake Formation data user can be granted permission
    to perform different actions against tables and columns. Example permissions include
    insert, select, describe, delete, alter, and drop. A data user can be an IAM user
    or an IAM role.


    Running queries against the Lake Formation database and table is done through
    supported AWS services such as Amazon Athena and Amazon EMR. When accessing Lake
    Formation to run the query through these services, the principals (IAM user, group,
    and role) associated with these services are verified for appropriate access permission
    to the database, tables, and S3 location of the data by Lake Formation. If access
    is allowed, then Lake Formation provides a temporary credential to run the query.


    # Data governance


    Data governance ensures the data assets are trusted, secured, cataloged, and their
    access is monitored and audited. Data can be trusted when data flows are identified
    and documented and data quality is measured and reported. To ensure data is protected
    and secured, data needs to be classified, and the appropriate access permissions
    should be applied. To have visibility into who has done what with data, some implement
    monitoring and audits


    When data is ingested and further processed from the landing zone to other zones,
    data lineage should be established and documented. For example, when running a
    data pipeline with data ingestion and processing tools, such as AWS Glue, AWS
    EMR, or AWS Lambda, the following data points can be captured to establish data
    lineage:


    +   - Data source name, location, and ownership details


    +   - Data processing job history and details (such as job name, ID, associated
    processing script, and owner of the job)


    +   - Artifacts generated by the data processing jobs (for example, S3 uri for
    the target data)


    +   - Data metrics at different stages (for example, number of records, size,
    schema, and feature statistics) as a result of the data processing'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Data Management for Machine Learning


    A central operational operational store should be created for storing all the
    data lineage and processing metrics. AWS DynamoDB, a fully managed NoSQL database,
    is a good technology option for storing this type of data, as it is designed for
    low latency and high transaction access:


    +   **Data quality:** Automated data quality checks should be implemented at different
    stages, and quality metrics should be reported. For example, after the source
    data is ingested into the landing zone, an AWS quality check job can run to check
    the data quality using tools such as the open source Deequ library. Data quality
    metrics (such as counts, schema validation, missing data type, or statistical
    deviations from the baseline) and reports can be generated for reviews. Optionally,
    manual or automated operational cleaning processes should be established to correct
    data quality issues.


    +   **Data cataloging:** Create a central data catalog and run Glue crawlers on
    datasets in the lake to automatically create an inventory of data and populate
    the central data catalog. Enrich the catalogs with additional metadata to track
    other information to support discovery and data audits, such as the business owner,
    data classification, and data refresh. For ML workloads, data science teams also
    generate new datasets (for example, new ML features) from the existing datasets
    in the data lake for model training purposes. These datasets should also be registered
    and tracked in a data catalog, and different versions of the data should be retained
    and archived for audit purposes.


    +   **Data access provisioning:** A formal process should be established for requesting
    and granting access to datasets and Lake Formation databases and tables. An external
    ticketing system can be used to manage the workflow for requesting access and
    granting access.


    +   **Monitoring and auditing:** Data access should be monitored, and access history
    should be maintained. Amazon S3 server access logging can be enabled to track
    access to all S3 objects directly. AWS Lake Formation also records all accesses
    to Lake Formation datasets in AWS CloudTrail (AWS CloudTrail provides event history
    in an AWS account to ensure governance, compliance, and operational auditing).
    With Lake Formation auditing, you can get details such as event source, event
    name, SQL queries, and data output location.


    Now, we have covered the core concepts and architecture patterns for building
    a data management platform for ML. Next, let''s get hands-on with the architecture
    and technologies we have covered and build a simple data lake and data processing
    pipeline.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# # Hands-on exercise – data management for ML


