- pgno: 320
  md: '# Technical requirements


    You will need access to your AWS environment for the hands-on portion of this
    chapter. All the code samples are located at https://github.com/PacktPublishing/The-Machine-Learning-Solutions-Architect-Handbook/blob/main/Chapter10.


    # Training large-scale models with distributed training


    As ML algorithms continue to become more complex and the data that is available
    for ML gets increasingly large, model training can become a big bottleneck in
    the ML life cycle. Training models with large datasets on a single machine/device
    can be too slow or simply not possible when the model is too large to fit into
    the memory of a single device. The following diagram shows how quickly language
    models have evolved in recent years and the growth in terms of model size:


    # Growth of language model size


    ![](img/bd21298357d8484151447cff0b2f138b_320_0.png)


    Figure 10.1 – The growth of language models'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'To solve the challenges of training large models with large data, we can turn
    to distributed training. Distributed training allows you to train models across
    multiple devices on a single node or multiple nodes so that you can split the
    data or model across these devices and nodes for model training. There are two
    main types of distributed training: **data parallelism** and **model parallelism**.
    Before we get into the details of distributed training, let''s quickly review
    how a neural network trains:


    ![](img/bd21298357d8484151447cff0b2f138b_321_0.png)


    Figure 10.2 – Deep neural network training


    The preceding diagram shows how an **artificial neural network** (ANN) trains.
    The training data is fed to the ANN in a forward pass. The loss (the difference
    between the predicted value and the true value) is calculated at the end of the
    forward pass, and the backward pass calculates the gradients for all the parameters.
    These parameters are updated with new values for the next step until the loss
    is minimized.


    In the next section, we''ll look at distributed model training using data parallelism.


    # Distributed model training using data parallelism


    Data parallel distributed training allows you to split a large training dataset
    into smaller subsets and train the smaller subsets in different devices and nodes
    in parallel. This allows you to run multiple training processes in parallel on
    the available devices to speed up training. To use data parallel distributed training,
    the underlying ML frameworks and/or algorithms will need to support it.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'As we discussed earlier, one key task in training deep learning (DL) models
    is to calculate the gradients concerning the loss function for every batch of
    the data, and then update the model parameters with gradient information to minimize
    the loss gradually. Instead of running the gradient calculations and parameter
    updates in a single device, the basic concept behind data distributed training
    is to run multiple training processes using the same algorithm in parallel, with
    each process using a different subset of the training dataset. The following diagram
    shows the main concept behind data parallelism training:


    ![](img/bd21298357d8484151447cff0b2f138b_322_0.png)


    Figure 10.3 – Data parallelism concept


    In the preceding diagram, there are three nodes in a cluster participating in
    a distributed data parallelism job, with each node having two devices. The partial
    gradients that are calculated by each device are represented by w0–w5 for each
    of the nodes, while W is the value for a global parameter for the model. Specifically,
    data parallel distributed training has the following steps:


    +   - Each device (CPU or GPU) in every node loads a copy of the same algorithm
    and a subset of the training data.

    - Each device runs a training loop to calculate the gradients (w0–w5) to optimize
    its loss function and exchange the gradients with other devices in the cluster
    at each training step.

    - The gradients from all the devices are aggregated and the common model parameters
    (W) are calculated using aggregated gradients.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '+   4. Each device pulls down the newly calculated common model parameters
    (W) and continues with the next step of model training.


    +   5. Steps 2 to 4 are repeated until the model training is completed.


    In a distributed training setting, efficiently exchanging gradients and parameters
    across processes is one of the most important aspects of ML system engineering
    design. Several distributed training topologies have been developed over the years
    to optimize communications across different training processes. In this chapter,
    we will discuss the most widely adopted topologies for data parallel distributed
    training.


    # Parameter server overview


    The parameter server (PS) is a topology built on the concept of server nodes and
    worker nodes. The worker nodes are responsible for running the training loops
    and calculating the gradients, while the server nodes are responsible for aggregating
    the gradients and calculating the globally shared parameters. The following diagram
    shows the architecture of a PS:


    ![](img/bd21298357d8484151447cff0b2f138b_323_0.png)


    Figure 10.4 – Parameter server architecture'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'Here, the server node is called the PS, and it is usually implemented as a
    key value or vector for storing gradients and parameters. As the number of model
    parameters to manage become very large, there could also be multiple server nodes
    for managing the global parameters and gradient aggregations. In a multi-parameter
    server configuration, there is also a server manager that manages and coordinates
    all the server nodes to ensure consistency.


    In this architecture, the worker nodes only communicate with the PS nodes to exchange
    gradients and parameters, and not with each other. In a multi-server node environment,
    each server node also communicates with every other server node to replicate parameters
    for reliability and scalability. The gradients and parameters are exchanged so
    that updates can be implemented synchronously and asynchronously. The synchronous
    gradient update strategy blocks the devices from processing the next mini-batch
    of data until the gradients from all the devices have synchronized. This means
    that each update has to wait for the device to complete. This can slow down training
    and make the training process less robust in terms of device failure. On the positive
    side, synchronous updates do not need to worry about side gradients, which can
    lead to higher model accuracy. Asynchronous updates do not need to wait for all
    the devices to be synchronized before processing the next mini-batch of data,
    though this might lead to reduced accuracy.


    # Implementing the PS in frameworks


    PS distributed training is natively supported by several DL frameworks, such as
    TensorFlow. Specifically, TensorFlow supports PS-based distributed training natively
    with its ParameterServerStrategy API. The following code sample shows how to instantiate
    the ParameterServerStrategy API for TensorFlow:


    ```

    strategy = tf.distribute.experimental.ParameterServerStrategy(cluster_resolver)

    ```


    In this code sample, the cluster_resolver parameter helps discover and resolve
    the IP addresses of workers.


    ParameterServerStrategy can be used directly with the model.fit() function of
    Keras or a custom training loop by wrapping the strategy.scope() syntax. See the
    following sample syntax on how to use scope() to wrap a model for distributed
    training:


    ```

    with strategy.scope():

    model = <model architecture definition>

    ```'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'In addition to PS implementation, which is natively supported within DL libraries,
    there are also general-purpose PS training frameworks, such as ByteDance and Herring
    from Amazon, which work with different DL frameworks. SageMaker uses under the
    hood for data parallel distributed training through its SageMaker Distributed
    Training library. One of the shortcomings of the parameter-server strategy is
    the inefficient use of network bandwidth. The Herring library addresses this shortcoming
    by combining AWS Elastic Fabric Adapter (EFA) and the parameter shading technique,
    which makes use of network bandwidth and their characteristics, such as multi-path
    backbones, to achieve faster distributed training. EFA helps improve network communication
    efficiency. You can find out more about Herring at https://www.amazon.science/publications/herring-rethinking-the-parameter-server-at-scale-for-the-cloud.


    # AllReduce overview


    While the PS architecture is easy to understand and set up, it does come with
    several challenges. For example, the PS architecture requires additional nodes
    for the parameter servers, and it is also hard to determine the right ratio between
    server nodes and worker nodes, and it is hard to ensure the server nodes do not
    become bottlenecks.


    The AllReduce topology tries to improve some of the limitations of parameter server
    updates by eliminating the server nodes and distributing all the gradient aggregation
    and global parameter updates to all the workers, hence why it''s called AllReduce.
    The following diagram shows the topology of AllReduce:


    ![](img/bd21298357d8484151447cff0b2f138b_325_0.png)


    Figure 10.5 – AllReduce architecture'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'In an AllReduce topology, each node sends gradients of parameters to all the
    other nodes at each training step. Then, each node aggregates the gradients and
    performs the reduce function (such as average, sum, or max) locally before calculating
    the new parameters using the next training step. Since every node needs to communicate
    with every other node, this results in a large number of networks communicating
    among the nodes, and duplicate count and storage being used as every node has
    a copy of all the gradients.


    A more efficient AllReduce architecture is Ring AllReduce. In this architecture,
    each node only sends gradients to its next neighboring node, and each node is
    responsible for aggregating the gradients for the global parameters that it is
    assigned to calculate. This architecture greatly reduces the amount of network
    communication in a cluster and compute overhead, so it is more efficient for model
    training. The following diagram shows the Ring AllReduce architecture:


    ![](img/bd21298357d8484151447cff0b2f138b_326_0.png)


    Figure 10.6 – Ring AllReduce


    # Implementing AllReduce and Ring AllReduce in frameworks


    The AllReduce and Ring AllReduce architectures are natively supported within multiple
    DL frameworks, including TensorFlow and PyTorch.


    TensorFlow supports AllReduce distributed training across multiple GPUs on one
    machine with its tf.distribute.MirroredStrategy API. With this strategy, each
    GPU has a copy of the model, and all the model parameters are mirrored across
    different devices. An efficient AllReduce mechanism is used to keep these parameters
    in sync. The following code sample shows how to instantiate the MirroredStrategy
    API:


    ```

    strategy = tf.distribute.MirroredStrategy()

    ```'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Training large-scale models with distributed training


    For multi-machine distributed training, TensorFlow uses the tf.distribute. MultiWorkerMirroredStrategy
    API. Similar to MirroredStrategy, MultiWorkerMirroredStrategy creates copies of
    all the parameters across all the devices on all the machines and synchronizes
    them with the AllReduce mechanism. The following code sample shows how to instantiate
    the MultiWorkerMirroredStrategy API:


    ```

    strategy = tf.distribute.MultiWorkerMirroredStrategy()

    ```


    Similar to ParameterServerStrategy, MirroredStrategy and MultiWorkerMirroredStrategy
    can work with the keras model.fit() or a custom training loop. To associate a
    model with a training strategy, you can use the strategy.scope() syntax.


    PyTorch provides native support for AllReduce-based distributed training via its
    torch.nn.DataParallel and torch.nn.parallelDistributedDataParallel APIs. The torch.nn.DataParallel
    API supports single-process multi-threading across GPUs on the same machine, while
    torch.nn.parallel.DistributedDataParallel supports multi-processing across GPUs
    and machines. The following code sample shows how to initiate a distributed training
    cluster and wrap a model for distributed training using the DistributedDataParallel
    API:


    ```

    torch.distributed.init_process_group...

    model = torch.nn.parallel.DistributedDataParallel(model, ...)

    ```


    Another implementation of the general-purpose Ring AllReduce architecture is Horovod,
    which was created by the engineers at Uber. Horovod works with multiple frameworks,
    including TensorFlow and PyTorch. You can find out about Horovod at https://github.com/horovod/horovod.


    # Distributed model training using model parallelism


    Model parallelism is still nascent in its adoption since most of the distributed
    training that happens involves data parallelism that deals with large datasets.
    However, the applications of state-of-the-art DL algorithms as BERT, GPT, and
    T5 are driving the increasing adoption of model parallelism. The qualities of
    these models are known to increase with the model''s size, and these large NLP
    models require a large amount of memory to store the model''s states (which includes
    the parameters, optimizer states, and gradients) and memory for other overheads.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'As such, these models can no longer fit into the memory of a single GPU. While
    large parallelism helps solve the large dataset challenge, it cannot help with
    training large models due to its large size requirements. Model parallelism allows
    you to split a single large model across multiple devices so that the total memory
    across multiple devices is enough to hold a copy of the model. Model parallelism
    also allows for a larger batch size for model training as a result of larger collective
    memory across multiple devices.


    There are many ways to split the model for model parallel distributed training:
    splitting by layers and splitting by tensors. Let''s take a closer look at these
    two approaches.


    # Naive model parallelism overview


    As an artificial neural network consists of many layers, one way to split the
    model is to distribute the layers across multiple devices. For example, if you
    have an 8-layer multi-layer perceptron network (MLP) and two GPUs (GPU0, GPU1),
    you can simply place the first four layers in GPU0 and the last four layers in
    GPU1. During training, the first four layers of the model are trained as you would
    normally train a model in a single device. When the first four layers are complete,
    the output from the fourth layer will be copied from GPU0 to GPU1, incurring communication
    overhead. After getting the output from GPU0, GPU1 continues training layers five
    to eight. The following diagram illustrates splitting a model by layers across
    multiple devices:


    ![](img/bd21298357d8484151447cff0b2f138b_328_0.png)


    Figure 10.7 – Naive model parallelism'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Implementing model parallelism by splitting requires knowledge about the training
    task. It is not a trivial task to design an efficient model parallelism strategy.
    Here are a few heuristics that could be helpful for the layer split:


    +   - Place neighboring layers on the same devices to minimize communication overhead.

    - Balance the workload between devices.

    - Different layers have different compute and memory utilization properties.


    Training an ANN model is inherently a sequential process, which means the network
    layers are processed sequentially, while the backward process will only start
    when the forward process is completed. When you''re splitting layers across multiple
    devices, only the device currently processing the layers on it will be busy; the
    other devices will be idle, wasting compute resources, which results in a waste
    of hardware resources. The following diagram shows processing the sequences for
    the forward and backward passes for one batch of data:


    | | | | | | |

    |---|---|---|---|---|---||

    | Device 2 | idle | F2 | B2 | idle | Parameter update |

    | Device 1 | idle | F1 | idle | B1 | idle | Parameter update |

    | Device 0 | | F0 | | idle | B0 | Parameter update |


    ![](img/bd21298357d8484151447cff0b2f138b_329_0.png)


    In the preceding diagram, F0, F1, and F2 are the forward passes on the neural
    network layers on each device. B2, B1, and B0 are the backward passes for the
    layers on each device. As you can see, when one of the devices is busy with either
    a forward pass or a backward pass, the other devices are idle. Next, let''s look
    at an approach (pipeline model parallelism) that can help increase resource utilization.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Pipeline model parallelism overview


    To resolve the resource idling issue, pipeline model parallelism can be implemented.
    This improves on naive model parallelism so that different devices can work in
    parallel on the different stages of the training pipeline on a smaller chunk of
    batch data, commonly known as a micro-batch. The following diagram shows how pipeline
    parallelism works:


    Device 2


    Device 1


    Device 0


    | F2.0 | F2.1 | F2.2 | F2.3 | B2.3 | B2.2 | B2.1 | B2.0 | Parameter update |

    |---|---|---|---|---|---|---|---|-|

    | F1.0 | F1.1 | F1.2 | F1.3 | | B1.3 | B1.2 | B1.1 | B1.0 | Parameter update |

    | F0.0 | F0.1 | F0.2 | F0.3 | | | | B0.3 | B0.2 | B0.1 | B0.0 | Parameter update
    |


    ![](img/bd21298357d8484151447cff0b2f138b_330_0.png)


    With pipeline model parallelism, instead of processing one batch of data with
    each full forward and backward pass, the one batch of data is broken into smaller
    mini-batches. In the preceding diagram, Device 0 completes the forward pass for
    the first mini-batch, Device 1 starts its forward pass on the output of the Device
    1 forward pass. Instead of waiting for Device 1 and Device 2 to complete their
    forward pass and backward passes, Device 0 starts to process the next mini-batch
    of data. This scheduled pipeline allows for higher utilization of the hardware
    resources, resulting in faster master training.


    There are other variations of pipeline parallelism. One example is interleaved
    parallelism, where a backward execution is prioritized whenever possible. This
    improves the utilization of devices for end-to-end model training. The following
    diagram shows how an interleaved pipeline works:


    Device 2


    Device 1


    Device 0


    | B2.0 | B2.0 | F2.1 | B2.1 | F2.2 | B2.2 | B2.3 | B2.3 | Parameter update |

    |---|---|---|---|---|---|---|---|-|

    | F1.0 | F1.1 | | B1.1 | F1.2 | B1.2 | B1.3 | B1.3 | | Parameter update |

    | F0.0 | F0.1 | F0.2 | F0.3 | | B0.0 | B0.1 | B0.2 | B0.3 | Parameter update |


    ![](img/bd21298357d8484151447cff0b2f138b_330_1.png)


    Next, let''s look at an overview of tensor parallelism, also known as tensor slicing.'
  merge: -1
  img_proc: true
- pgno: 331
  md: Figure 10.12 – Splitting the matrix calculation
  merge: -1
  img_proc: true
- pgno: 332
  md: 'As you see, you would get three separate values that are the same as the individual
    values in the output vector in the preceding diagram. If there are three separate
    devices for performing dot calculations, we can perform these three dot calculations
    in parallel and combine the values into a single vector at the end. This is the
    basic concept of why tensor parallelism works. With tensor parallelism, each device
    works independently without the need for any communication until the end, which
    is when the results need to be synchronized. This strategy allows for faster tensor
    processing as multiple devices work in parallel to reduce training time and increase
    the utilization of computing devices.


    # Implementing model parallelism training


    To implement model parallelism, you can manually design the parallelism strategy
    by deciding how to split the layers and tensors, as well as their placements,
    across different devices and nodes. However, it is not trivial to do this efficiently,
    especially for large clusters. To make the model parallelism easier, several parallelism
    library packages have been developed. In this section, we''ll take a closer look
    at some of these libraries. Note that the frameworks we will discuss can support
    both data parallelism, tensor parallelism, and pipeline model parallelism, and
    both techniques are often used to train large models with large training datasets.


    # Megatron-LM overview


    Megatron-LM is an open source distributed training framework developed by Nvidia.
    It supports data parallelism, tensor parallelism, and pipeline model parallelism,
    as well as a combination of all three for extreme-scale model training.


    Megatron-LM implements micro-batch-based pipeline model parallelism to improve
    device utilization. It also implements periodic pipeline flushes to ensure optimizer
    steps are synchronized across devices. Two different pipeline schedules are supported
    by Megatron-LM, as follows:


    +   * The default stage schedule works by completing the forward pass for all
    micro-batches first, before starting the backward pass for all the batches.

    * The interleaved stage schedule works by running multiple different subsets of
    layers on a single device, instead of running just a single continuous set of
    layers. This can further improve the utilization of devices and reduce idle time.'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'Megatron-LM implements a specific tensor parallelism strategy for transformer-based
    models. A transformer consists mostly of self-attention blocks, followed by a
    two-layer MLP. For the MLP portion, Megatron-LM splits the weight matrix by columns.
    The matrices for the attention heads are also partitioned by columns. The following
    diagram shows how the different parts of the transformer can be split:


    ![](img/bd21298357d8484151447cff0b2f138b_333_0.png)


    ![](img/bd21298357d8484151447cff0b2f138b_333_1.png)


    Using data parallelism, pipeline model parallelism, and tensor parallelism together,
    Megatron-LM can be used to train extremely large transformer-based models (with
    a trillion parameters) scaled across thousands of GPUs.


    Training using Megatron-LM involves the following key steps:


    +   - Initializing the Megatron library using the `initialize_megatron()` function.

    - Setting up the Megatron model optimizer using the `setup_model_and_optimizer()`
    function by wrapping the original model.

    - Training the model using the `train()` function, which takes the Megatron model
    and optimizer as input.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'Megatron-LM has been used for many large model training projects, such as BERT,
    GPT, and the Biomedical domain language model. Its scalable architecture can be
    used to train models with trillions of parameters.


    # DeepSpeed overview


    DeepSpeed is an open source training framework developed by Microsoft. Similar
    to Megatron-LM, DeepSpeed also supports tensor slicing (another name for splitting
    tensors) parallelism, pipeline parallelism, and data parallelism.


    DeepSpeed implements micro-batched pipeline model parallelism, when a batch is
    broken into micro-batches to be processed by different devices in parallel. Specifically,
    DeepSpeed implements interleaved pipeline parallelism to optimize resource efficiency
    and utilization.


    Similar to Megatron-LM, DeepSpeed can use data parallelism, pipeline model parallelism,
    and tensor parallelism to train extremely large deep neural networks. This is
    also known as DeepSpeed 3D parallelism.


    One capability of the DeepSpeed framework is its Zero Redundancy Optimizer (ZeRO).
    ZeRO is capable of managing memory efficiently by partitioning parameters, optimizer
    states, and gradients across devices instead of keeping a copy in all devices.
    The partitions are brought together at runtime when needed. This allows ZeRO to
    reduce the memory footprint by eight times compared to regular data parallelism
    techniques. ZeRO is also capable of using CPU and GPU memory together to train
    large models.


    The attention-based mechanism is widely adopted in DL models, such as the transformer
    model, to address text and image inputs. However, its ability to address long
    input sequences is limited due to its large memory and compute requirements. DeepSpeed
    helps alleviate this issue with its implementation of a sparse attention kernel
    – a technology that reduces the compute and memory requirements of attention computation
    by block-sparse computation.


    One major bottleneck in large-scale distributed training is the communication
    overhead due to gradients sharing and updates. Communication compression, such
    as 1-bit compression, has been adopted as an effective mechanism to reduce communication
    overhead. DeepSpeed has an implementation of a 1-bit Adam optimizer, which can
    reduce the communication overhead by up to five times to improve the training
    speed. 1-bit compression works by representing each number using 1 bit, combined
    with error compensation, which remembers the error during gradient compression
    and adds the error back to the next step to compensate for the error.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Training large-scale models with distributed training 317


    To use DeepSpeed, you need to modify your training script. The following steps
    explain the main changes you need to make to a training script to run distributed
    training:


    +   1. Use the deepspeed.initialize() function to wrap the model and return a
    DeepSpeed model engine. This model engine will be used to run a forward pass and
    a backward pass.


    +   2. Use the returned DeepSpeed model engine to run the forward pass, backward
    pass, and step function to update the model parameters.


    DeepSpeed primarily supports the PyTorch and requires minor code changes to adopt
    model training using PyTorch. DeepSpeed has been used for training models with
    hundreds of billions of parameters and has delivered some of the fastest model
    times. You can find out more about DeepSpeed at https://www.deepspeed.ai.


    # SageMaker Distributed Training library overview


    Amazon''s SageMaker Distributed Training (SMD) library is part of the Amazon SageMaker
    service offering. SMD supports parallelism (by using Herring under the hood) and
    interleaved pipeline parallelism. Unlike DeepSpeed and Megatron-LM, which need
    to manually decide on your model partitions, SageMaker Model Parallel (SMP)


    has a feature for automated model splitting.


    This automated model splitting feature balances SMP memory and communication constraints
    between devices to optimize performance. Automated model splitting takes place
    during the first step, where a version of a model is constructed in CPU memory.
    The graph is analyzed, a partition decision is made, and different model partitions
    are loaded into different GPUs. The partition software performs framework-analysis
    for TensorFlow and PyTorch to determine the partition decision. It considers graph
    structures such as variable/parameter sharing, parameter sizes, and constraints
    to balance the number of variables and the number of operations for each device
    to come up with split decisions.


    To use SageMaker Distributed Training, you need to make some changes to your existing
    training scripts and create SageMaker training jobs. There are different instructions
    for TensorFlow and PyTorch. The following are examples for the PyTorch framework:


    +   1. Modify the PyTorch training script:


    +   Call smp.init() to initialize the library.


    +   Wrap the model with smp.DistributedModel().'
  merge: -1
  img_proc: true
- pgno: 336
  md: '+   - Wrap the optimizer with smp.DistributedOptimizer().

    - Restrict each process to its own device through torch.cuda.set_device(smp.local_rank()).

    - Use the wrapped model to perform a forward pass and a backward pass.

    - Use the distributed optimizer to update parameters.


    Create a SageMaker training job using SageMaker PyTorch Estimator and enable SMP
    distributed training.


    In this section, we reviewed the different distributed training strategies and
    frameworks for running distributed training. Distributed model training allows
    us to train extremely large models, though running inferences on large models
    could result in high latency due to the size of the models and other technological
    constraints. Next, let''s discuss the various techniques we can use to achieve
    low latency inference.


    # Achieving low latency model inference


    As ML models continue to grow and get deployed to hardware devices, latency can
    become an issue for certain use cases that require low latency and high throughput
    inferences, such as real-time fraud detection. To reduce the overall model inference
    latency for a real-time application, there are different optimization considerations
    and techniques we can use, including model optimization, graph optimization, hardware
    acceleration, and inference engine optimization. In this section, we will focus
    on model optimization, graph optimization, and hardware optimization. By first,
    let''s try to understand how model inference works, specifically for DL models,
    since that''s what most of the inference optimization processes focus on.


    # How model inference works and opportunities for optimization


    As discussed earlier in this book, DL models are constructed as computational
    graphs with nodes and edges, where the nodes represent the different operations
    and edges represent the data flow. Examples of such operations include addition,
    matrix multiplication, activation (for example, Sigmoid and ReLU), and pooling.
    These operations perform computations on tensors as inputs and produce tensors
    as outputs. For example, the $c=matmul(a,b)$ operation takes $a$ and $b$ as input
    tensors and produces $c$ as the output tensor. Deep learning frameworks, such
    as TensorFlow and PyTorch, have built-in operators to support different operations.
    The implementation of an operator is also called a kernel.'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'During inference time for a trained model, the DL framework''s runtime will
    walk through the computational graph and invoke the appropriate kernels (such
    as add or Sigmoid) for each of the nodes in the graph. The kernel will take various
    inputs, such as the inference data samples, learned model parameters, and intermediate
    outputs, from the preceding operators and perform specific computations according
    to the data flow defined by the computational graph to produce the final predictions.
    The size of a trained model is mainly determined by the number of nodes in a graph,
    as well as the number of model parameters and their numerical precisions (for
    example, floating-point 32, floating-point 16, or integer 8).


    Different hardware providers such as Nvidia and Intel also provide hardware-specific
    implementations of kernels for common computational graph operations. DNN is the
    library from Nvidia for optimized kernel implementations for their GPU devices,
    while MKL-DNN is the library from Intel for optimized kernel implementations for
    Intel chips. These hardware-specific implementations take advantage of the unique
    capabilities of the underlying hardware architecture. They can perform better
    than the kernels that are implemented by the DL framework implementation since
    the framework implementations are hardware-agnostic.


    At this point, you should have a basic understanding of how inference works. Next,
    let''s discuss some of the common optimization techniques we can use to improve
    model latency.


    # Hardware acceleration


    Different hardware produces varying inference latency performance for different
    ML models. The list of common hardware for model inference includes the CPU, GPU,
    **application-specific integrated circuit (ASIC), field-programmable gate array
    (FPGA)**, and edge hardware (such as Nvidia Jetson Nano). In this section, we
    will review the core architecture characteristics for some of these pieces of
    hardware and how their designs help with model inference acceleration.


    # Central processing units (CPUs)


    A CPU is a general-purpose chip for running computer programs. It consists of
    four main building blocks:


    +   - The control unit is the brain of the CPU that directs the operations of
    the CPU; that is, it instructs other components such as memory.

    - The arithmetic logic unit (ALU) is the basic unit that performs arithmetic and
    logical operations, such as addition and subtraction, on the input data.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '+   - The address generation unit is used for calculating access memory. Memory
    management, which is used for all memory components such as main memory and the
    local cache. A CPU can also be made up of multiple cores, each core having a control
    unit and ALUs.


    The degree of parallel executions in a CPU mainly depends on how many cores it
    has. Each core normally runs a single thread at a time, for hyper-threading (a
    proprietary simultaneous multi-threading implementation from Intel). The more
    cores it has, the higher the degree of parallel executions. A CPU is designed
    to handle a large set of instructions and manage the operations of many other
    components; it usually has high performance and a complex core, they aren''t many
    of them. For example, the Intel Xeon processor can have up to 56 cores.


    CPUs are usually not suited for neural network based model inference if low latency
    is the main requirement. Neural network inference involves operations that can
    be parallelized at a large scale (for example, matrix multiplication). Since the
    total of cores for a CPU is usually small, it cannot be parallelized to meet the
    needs of a neural network inference. On the positive side, CPUs are more cost-effective
    and usually have good memory capacities for hosting larger.


    # Graphical processing units (GPUs)


    The design of a GPU is the opposite of the design of a CPU. Instead of having
    a few powerful cores, it has thousands of less powerful cores that are designed
    to perform a small set of instructions highly efficiently. The basic design of
    a GPU core is like that of CPU. It also contains a control unit, ALU, and a local
    memory cache. However, the GPU control unit handles a much simpler instruction,
    and the local memory is much smaller.


    When the GPU processes instructions, it schedules blocks of threads, and within
    each block of threads, the threads perform the same operations on different pieces
    of data - a parallelization scheme called Single Instruction Multiple Data (SIMD).
    This architecture fits nicely with how a DL model works, where many neurons perform
    the same operation (mainly matrix multiplication) on different pieces of data.


    The Nvidia GPU architecture contains two main components:


    +   - The global memory component - The streaming multiprocessor (SM) component'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'SM is analogous to a CPU and each SM has many Computer Unified Device Architecture
    (CUDA) cores, special functional units that perform different arithmetic operations.
    It also has a small, shared memory and cache, and many registers. CUDA core is
    responsible for functions such as floating-point/integer operations, logic calculation,
    and branching. The thread block mentioned previously is executed by the SM. The
    global memory is located on the same GPU board. When you''re training an ML model,
    both the model and the data need to be loaded into the global memory.


    In a multi-GPU configuration, low latency and high throughput communication channels
    are available, such as the Nvidia NVLink, which provides up to 600 GB/sec bandwidth,
    which is almost 10x the bandwidth of PCIe4.


    GPUs are well suited for low latency and high throughput neural network model
    inferences due to their massive number of CUDA cores for large-scale parallelism.


    # Application-specific integrated circuit


    An application-specific integrated circuit (ASIC) is a primary alternative to
    a GPU. ASIC chips are purpose-designed for particular DL architectures for computation
    and data flow, so are faster and require less power than the GPUs. For example,
    Google''s Tensor Processing Unit (TPU) has dedicated Matrix Units (MXUs) designed
    for efficient matrix computations, and AWI offers the Inferentia chip, an ASIC
    designed for model inference. To speed up model inference, the Amazon Inferentia
    chip and Google''s TPU both use the systolic array mechanism to speed up arithmetic
    calculations for deep neural networks. While the general-purpose chips such as
    CPUs and GPUs use local registers to transfer data and results, a systolic array
    allows you to chain multiple ALUs to reduce access to speed up processing. The
    following diagram shows how data flows within a systolic array architecture versus
    a regular architecture that is used in CPUs and GPUs:


    ![](img/bd21298357d8484151447cff0b2f138b_339_0.png)


    Figure 10.14 - Systolic array processing versus CPU/GPU processing'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'The Amazon Inferent chip can be used directly with Amazon SageMaker for inference
    with improved latency. You can do this by selecting one of the supported Inferent
    chips for model deployment.


    # Model optimization


    When you''re processing computational graphs for DL model inference, the size
    of the neural network (such as its number of layers, neurons, and so on), the
    number of model parameters, and the numerical precision of the model parameters
    directly impact the performance of model inference. The model optimization approach
    focuses on reducing the size of the neural network, the number of model parameters,
    and the numerical precision to reduce inference latency. In general, there are
    two main approaches to model optimization: quantization and pruning.


    # Quantization


    Traditionally, deep neural networks are trained with **floating-point 32 bit (FP32)**.
    However, for many neural networks, FP32 is not needed for the required precision.


    Quantization for DL is a network compression approach that uses lower precision
    numbers, such as **floating-point 16 bit (FP16)** or **integer 8 bit (INT8)**
    instead of FP32, to represent static model parameters and perform numerical computation
    with dynamic inputs/activation, while having minimal or no impact on model performance.
    For example, an INT8 representation takes up four times less space than the FP32
    representation, which significantly reduces the memory requirements and computational
    costs for neural networks, which means it can improve the overall latency for
    model inference.


    There are different types of quantization algorithms, including uniform and non-uniform
    quantization algorithms. Both approaches map in a continuous domain to discrete
    lower precision values in the quantized domain. In the uniform case, the quantized
    values in the quantized domains are evenly spaced, whereas the non-uniform case
    has varying quantized values. The following diagram shows the difference between
    a uniform and a non-uniform quantization:'
  merge: -1
  img_proc: true
- pgno: 341
  md: '![](img/bd21298357d8484151447cff0b2f138b_341_0.png)


    Figure 10.15 – Uniform and non-uniform quantization


    Quantization can be performed both post-training and during training (quantization-aware
    training). Post-training quantization takes a trained model, quantizes the weights,
    and regenerates a quantized model. Quantization-aware training involves fine-tuning
    a full precision model. During training, the higher precision real numbers are
    reduced to lower precision numbers.


    Quantization support is natively available in DL frameworks, such as PyTorch and
    TensorFlow. For example, PyTorch supports both forms of quantization via its torch.quantization
    package. TensorFlow supports quantization through the tf.lite package.


    # Pruning (also known as sparsity)


    Pruning is another network compression technique that eliminates some of the model
    weights and neurons that do not impact model performance to reduce the size of
    the model to make inference faster. For example, weights that are close to zero
    or redundant can usually be removed.


    Pruning techniques can be classified into static and dynamic pruning. Static pruning
    takes place offline before the model is deployed, while dynamic pruning is performed
    during runtime. Here, we will discuss some of the key concepts and approaches
    for static pruning.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Advanced ML Engineering


    Static pruning mainly consists of three steps:


    +   1. Parameter selection for pruning targeting.

    2. Pruning the neurons.

    3. Fine-tuning or retraining if needed. Retraining may improve the model performance
    of the pruned neural network.


    There are several approaches for selecting the parameters for static pruning,
    including the magnitude-based approach, the penalty-based approach, and dropout
    removal:


    +   * Magnitude-based approach: It is widely accepted that large model weights
    are more important than small model weights. So, one intuitive way to select weights
    for pruning is to look at zero-value weights or the weights within a absolute
    threshold. The magnitude of the neural network activation layer can also be used
    to determine if the associated neurons can be removed.

    * Penalty-based approach: In the penalty-based approach, the goal is to modify
    the loss function or add additional constraints so some weights are forced to
    become zeros or near zeros. The weights that are zeros or close to zeros can then
    be pruned. An example of the penalty-based approach is using LASSO to shrink the
    weights of features.

    * Dropout removal: Dropout layers are used in deep neural network training as
    regularizers to avoid overfitting. While dropout layers are useful in training,
    they are not useful for inference and can be removed to reduce the number of parameters
    without impacting the model''s performance.


    DL frameworks, as TensorFlow and PyTorch, provide APIs for pruning models. For
    example, you can use the tensorflow_model_optimization package and the prune_low_magnitude
    API for magnitude-based pruning. PyTorch provides pruning support via its torch.nn.utils
    API.


    # Graph and operator optimization


    In addition to hardware acceleration and model optimization, there are additional
    optimization techniques that focus on the execution optimization of the computational
    graph, as well as hardware-specific operator and tensor optimization.


    # Graph optimization


    Graph optimization focuses on reducing the number of operations that are performed
    in computational graphs to speed up inference. Multiple techniques are used for
    optimization, including operator fusion, dead code elimination, and constant folding.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'Operator fusion combines multiple operations in a subgraph into a single operation
    to improve latency. In a typical execution of a subgraph with multiple operations,
    system memory is accessed for read/write to transfer data between operations,
    which is an expensive task. Operator fusion reduces the number of memory accesses,
    as well as optimizes the overall computations since the computations are now happening
    in a single kernel without intermediate results being saved to memory. This approach
    also reduces the memory footprint by a smaller number of operations being performed.
    The following diagram shows the concept of operator fusion:


    ![](img/bd21298357d8484151447cff0b2f138b_343_0.png)


    Figure 10.16 - Graph operator fusion


    In the preceding diagram, the **matrix multiplication, add,** and **ReLU** operators
    are being fused into a single operator for execution in a single kernel to reduce
    memory access and the time needed to start multiple kernels.


    Constant folding is the process of evaluating constants at compile time instead
    of runtime to speed up processing during runtime. For example, the following expression,
    A can be assigned to a value of 300 at compile time instead of being dynamically
    calculated at runtime, which requires a more computational cycle: $A = 100 + 200$.
    Dead code elimination removes the code that does not affect the program''s results.
    This ensures that the program doesn''t waste computation on useless operations.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Operator optimization


    Operator optimization (also known as tensor optimization) focuses on hardware-specific
    optimization for a specific model. Different hardware devices have different memory
    layouts and computational units and as such, hardware-specific optimization is
    often required to take full advantage of the hardware architecture. Multiple techniques
    have been developed for operator optimization for different hardware devices,
    including the following:


    +   - Nested parallelism, which takes advantage of the GPU memory hierarchy and
    enables data reuse across threads through shared memory regions.

    - Memory latency hiding, which overlaps the memory operation with computation
    to maximize memory and compute resources.


    While graph optimization, operator optimization, and model optimization address
    different areas of optimizations, they are often combined to provide end-to-end
    optimization.


    # Model compilers


    Manually optimizing end-to-end performance is non-trivial. Adding the dimensions
    of multiple ML frameworks and a wide range of target hardware devices for optimization
    makes this a very challenging problem. To simplify the optimization process for
    different ML frameworks and different devices, several open source and commercial
    products have been developed. We will briefly talk about a few such packages in
    this section.


    # TensorFlow XLA


    TensorFlow Accelerated Linear Algebra (XLA) is a DL compiler for TensorFlow. It
    compiles a TensorFlow graph into a sequence of execution kernels specifically
    optimized the model. XLA transforms the original TensorFlow graph into an intermediate
    representation (IR) before performing several optimizations on the IR, such as
    operator fusion for faster computation. The output from the optimization step
    is used for generating hardware-specific code that optimizes the performance of
    the different target hardware devices, such as CPUs and GPUs. XLA is used at Google
    in production for many accelerators.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# PyTorch Glow


    PyTorch Glow is a DL compiler for multiple DL frameworks. Similar to XLA, it also
    uses an IR to represent the original computational graph to perform optimizations.
    Unlike XLA, PyTorch Glow uses two layers of IRs. The first layer is used for performing
    domain-specific optimizations such as quantization, while the second IR layer
    is used for memory-related optimization such as memory latency hiding. After the
    second IR optimization, target device-dependent code is generated for running
    the models on different devices.


    # Apache TVM


    Apache Tensor Vital Machine (TVM) is an open source compiler framework for model
    optimization. It optimizes and compiles models built with different frameworks,
    such as PyTorch and TensorFlow, for target CPUs, GPUs, and specialized hardware
    devices for accelerated performance. TVM supports optimization at different levels,
    including graph optimization and operator optimization targeting specific hardware.
    It also comes with a runtime for executing the compiled models.


    One key feature of TVM is AutoTVM, which uses ML to search for the optimal sequences
    of code execution for different hardware devices. This ML-based search algorithm
    can significantly outperform baseline benchmarks by using vendor-provided optimization
    libraries such cuDNN. This ML-based approach also enables efficient compilation
    scaling for a large number of hardware devices.


    # Amazon SageMaker Neo


    Amazon SageMaker Neo is the model compiling feature in SageMaker. It mainly uses
    Apache TVM as the underlying compiler library. With SageMaker Neo, you can take
    a model that''s trained in different ML/DL frameworks such as TensorFlow and PyTorch,
    choose the target processors such as Intel, Apple, ARM, and Nvidia, and then SageMaker
    Neo compiles an optimized model for the target hardware. Neo also provides a runtime
    library for each target platform to load and execute the compiled model. SageMaker
    Neo is a managed offering, so you don''t need to manage the underlying infrastructure
    and processes for model compilation and deployment.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# # Inference engine optimization


    One common model deployment pattern is to open source inference engines or commercial
    hosting platforms for model serving. So, inference engine optimization is another
    approach that reduces model latency and inference throughput. In this section,
    we will talk about a few considerations. Note that there are no universal rules
    for inference engine optimization as they could be engine- and model-specific.
    It is important to test and validate different configurations for the final deployment.


    # # Inference batching


    If you have a large number of inference requests and there is no strict latency
    requirement on a single prediction request, inference batching is a technique
    that can help reduce the total inference time for the requests. With batching,
    instead of running predictions one at a time multiple requests are batched and
    sent to the inference engine. This technique reduces the total number of round-trips,
    reducing the total inference time. Inference engines such as TensorFlow Serving
    and TorchServe provide built-in support for batching. You can find the configuration
    details for TorchServe and TensorFlow Serving batching at https://pytorch.org/serve/batch_inference_with_ts.html
    and https://www.tensorflow.org/tfx/serving/serving_config#batching_configuration,
    respectively.


    # # Enabling parallel serving sessions


    If your model hosting server has multiple compute cores, you can configure the
    number of parallel serving sessions to maximize the available cores. For example,
    you can configure the TENSORFLOW_INTRA_OP_PARALLELISM setting in TensorFlow based
    on the number of cores that can run multiple sessions in parallel to optimize
    throughput. TorchServe has settings for the number of workers per model and the
    number of threads for parallelization optimization.


    # # Picking a communication protocol


    Inference engines such as TensorFlow and TorchServe provide support for the gRPC
    protocol, which is a faster serialization format than the REST protocol. The gRPC
    protocol provides better overall performance but does performance benchmarks as
    different models could behave differently. The REST protocol may be your preferred
    option based on specific requirements.


    With that, you have learned about the technical approaches to large-scale training
    and low latency model inference. Next, let''s get some hands-on experience with
    distributed training using SageMaker and PyTorch.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Hands-on lab – running distributed model training with PyTorch


    In this hands-lab, you will use SageMaker Training Service to run data parallel
    distributed training. We will use PyTorch''s nn.parallel.DistributedDataParallel
    API as the distributed training framework and run the training job on a small
    cluster. We will reuse the dataset and training scripts from the hands-on lab
    in Chapter 8, Building a Data Science Environment Using AWS Services.


    All right, let''s get started!


    # Modifying the training script


    First, we need to add distributed training support to the training script. To
    start, create a copy of the train.py file, rename the file train-dis.py, and open
    the train-dis.py file. You will need to make changes to the following three functions.
    The functions are meant to highlight the key changes needed. To run the lab, you
    can download the modified train-dis.py file from https://github.com/PacktPublishing/The-Machine-Learning-Solutions-Architect-Handbook/tree/main/Chapter10


    # Modifying the train() function


    You need to make some changes to the train() function to enable distributed training.
    The following are the key changes that are required:


    +   **Process group initialization**: To enable distributed training, we need
    to initialize and register each training process on each device to be included
    in the training group. This can be achieved by calling the torch.distributed.init_process_group()
    function. This function will block until all the processes have been registered.
    There are a few concepts that we need to be familiar with during this initialization:


    +   **Word size**: This is the total number of processes in a distributed training
    group. Since we will run one process on each device (CPU or GPU), the world size
    is also the same as the total number of devices in a training cluster. For example,
    if you have two servers and each server has two GPUs, then the world size is four
    for this training group. The torch.distributed.init_process_group() function uses
    this information to understand how many processes to include in the distributed
    training job.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '+   Rank: This is the unique index assigned to each process in the training
    group. For example, the ranks for all the processes in a training group with a
    size of four would be [0,1,2,3]. This unique index helps uniquely identify each
    process within a training group for communication.


    +   Local rank: This uniquely identifies a device in a server node. For example,
    if there are two devices in a server node, the local rank for two devices would
    be [0,1]. Local rank allows you to select a specific device to load the model
    and data for model training.


    +   Backend: This is the low-level communication library for exchanging and aggregating
    data among the different processes. PyTorch distributed training supports several
    communication backends, including NCCL, MPI, and Gloo. You choose a different
    backend based on the device and networking configuration. It uses these backends
    to receive, broadcast, or reduce data during distributed training. We are not
    going to get into the technical details of these backends in this book. If you
    are interested in how these backends work, you can easily find internet sources
    cover these topics.


    +   Wrap the training algorithm with PyTorch distributed library: To use the algorithm
    with the PyTorch distributed training library, you need to wrap the algorithm
    with the PyTorch distributed training library. `nn.parallel.DistributedDataParallel()`
    API. This allows the algorithm to participate in distributed training to exchange
    gradients and update global parameters.


    +   Saving model using a single device: In a multi-device server node, you only
    need one device to save the final model to avoid I/O conflicts. You can achieve
    this by selecting a device with a specific local rank ID.


    Now let''s take a look at the next step.


    # Modifying the get_data_loader() function


    To ensure a different subset of training data is loaded into different devices
    on the server nodes, we need to configure the PyTorch DataLoader API to load data
    based on the rank of the training process. This can be done using the `torch.utils.data.DistributedSampler`
    API.'
  merge: -1
