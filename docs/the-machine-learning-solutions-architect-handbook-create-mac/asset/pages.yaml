  md: 'The following code joins the customer_data and churn_list tables into a single
    table using the customerid column as the key:


    ```

    # catalog: database and table names

    db_name = "customer_data"

    tbl_customer = "customer_data"

    tbl_churn_list = "churn_list"

    # Create dynamic frames from the source tables

    customer = glueContext.create_dynamic_frame.from_ncatalog(database=db_name, table_name=tbl_customer)

    churn = glueContext.create_dynamic_frame.from_catalog(database=db_name, table_name=tbl_churn_list)

    # Join the frames to create customer dataframe

    customer_churn = Join.apply(customer, churn, ''customerid'', ''customerid'')

    customer_churn.printSchema()

