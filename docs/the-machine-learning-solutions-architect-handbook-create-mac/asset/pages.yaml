- pgno: 71
  md: '# 3 Machine Learning Algorithms


    Machine learning (ML) algorithm design is usually not the main focus for a practitioner
    of ML solutions architecture. However, ML solutions architects still need to develop
    a solid understanding of the common real-world ML algorithms and how those algorithms
    solve real business problems. Without this understanding, you will find it difficult
    to identify the right data science solutions for the problem at hand and design
    the appropriate technology infrastructure to run these algorithms.


    In this chapter, you will develop a deeper understanding of how ML works first.
    We will cover some common ML and deep learning algorithms for the different ML
    tasks, such as classification, regression, object detection, recommendation, forecasting,
    and natural language generation. You will learn the concepts behind these algorithms,
    their advantages and disadvantages, and where to apply them in the real world.
    Specifically, we are going to cover the following topics:


    +   - How machines learn

    - Overview of ML algorithms

    - Hands-on exercise'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Technical requirements


    You need a personal computer (Mac or Windows) to complete the hands-on exercise
    portion of this chapter.


    You need to download the dataset from https://www.kaggle.com/mathchi/chunk-for-bank-customers.
    Additional instructions will be provided in the Hands-on exercise section.


    # How machines learn


    In Chapter 1, Machine Learning and Machine Learning Solutions Architecture, we
    briefly touch upon how ML algorithms can improve themselves by processing data
    and updating model parameters to generate models (analogous to traditional compiled
    binary from computer source code). So, how does an algorithm actually learn? In
    short, ML algorithms learn by optimizing (for example, minimizing or maximizing)
    an objective function (also known as a loss function). You can think of an objective
    function as a business metric, such as the difference between the projected sales
    of a product and the actual sales, and the goal of optimizing this objective would
    be to reduce the difference between the actual sales number and the projected
    sales. To optimize this objective, an ML algorithm would iterate and process large
    amounts of historical sales data (training data) and adjust its internal model
    parameters until it minimizes the differences between the projected and the actual
    values. This process of finding the optimal parameters is called optimization,
    and the mathematical routines for performing the optimization are called optimizers.


    To illustrate what optimization means, let''s use a simple example of training
    an ML model to predict the sales of a product using its price as the input variable.
    Here, we use a linear function for the ML algorithm, shown as follows:


    ```

    sales = W * price + B

    ```


    In this example, we want to minimize the difference between the actual sales and
    predicted sales, and we use the following mean square error (MSE) as the loss
    function to optimize. The specific optimization task is to find the optimal values
    for the W and B parameters that produce the minimal MSE. In this example, W and
    B are also known as weight and bias, respectively. The value of a weight indicates
    the relative importance of an input variable and the bias represents the mean
    value for the output:


    ```

    Error = 1/n Σ_{i=1}^n (predicted_i - actual_i)^2

    ```'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'There are many techniques for solving ML optimization problems. One of the
    preferred optimization techniques are gradient descent and its various variants,
    which are commonly used for the optimization of neural networks and many other
    ML algorithms. Gradient descent is iterative and works by calculating the rate
    of error change (gradient) contributed to the total error by each input variable
    and updating the model parameters (W and B in this example) accordingly at each
    step to reduce error gradually over many steps. Gradient descent also controls
    how much change to make to the model parameters at each step by using a parameter
    called learning rate. The learning rate is also known as a hyperparameter of the
    ML algorithm. The following figure shows how the W value can be optimized using
    gradient descent


    # Loss


    ![](img/bd21298357d8484151447cff0b2f138b_73_0.png)


    Figure 3.1 – Gradient descent


    The main steps in gradient descent optimization include:


    +   1. Assigning a random value to W initially.

    2. Calculating the error (loss) with the assigned W value.

    3. Calculating the gradient (rate of change) of the error for the loss function.
    The value of the gradient can be positive, zero, or negative.

    4. If the gradient is either positive or negative, updating the W value in the
    direction that will reduce the error in the next step. In this example, we move
    W to the right to make it bigger.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '5. Repeat Steps 2 to 4 until the gradient is 0, which indicates the optimal
    value of W is found as the loss is at minimal. Finding the optimal value is also
    called convergence.


    Besides gradient descent, there are other alternative optimization techniques,
    such as normal equation, for finding the optimal parameters for ML algorithms
    such as linear regression. Instead of the iterative approach used by gradient
    descent, normal equation uses a one-step analytical approach for computing the
    coefficients of linear regression models. Some other algorithms also have algorithm-specific
    solutions for model training optimization, which we will cover in the next section.


    Now, we have briefly talked about the fundamentals of how a machine learns. Next,
    let''s dive into the individual ML algorithms.


    # Overview of ML algorithms


    A large number of ML algorithms have been developed to date, and more are researched
    at an accelerated pace by academia and industry alike. This section will review
    some popular traditional and deep learning algorithms and how these algorithms
    can be applied to different kinds of ML problems. But first, let''s quickly review
    the considerations when choosing an ML algorithm for the task.


    # Consideration for choosing ML algorithms


    There are a number of considerations when it comes to choosing algorithms for
    different tasks:


    +   * Training data size: Some ML algorithms, such as deep learning algorithms,
    can work very well and produce highly accurate models, but they require large
    amounts of training data. Traditional ML algorithms, such as linear models, can
    work effectively when the dataset is small but cannot take advantage of large
    datasets effectively as deep learning neural network algorithms. Traditional ML
    algorithms require humans to extract and engineer useful input features from the
    training data to the model. When the size of the data becomes large, it becomes
    more difficult to extract and engineer features to improve model performance.
    This is one of the reasons that traditional ML algorithms cannot take advantage
    of large datasets. On the hand, deep learning algorithms can extract features
    automatically from the training data.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   **Accuracy and interpretability**: Some ML algorithms, such as deep learning
    algorithms, can produce highly accurate models, such as **computer vision** or
    **natural language processing (NLP)** models. However, these can be highly complex
    and harder to explain, such as **linear regression** (to be covered later), can
    be easily interpreted even though the accuracy might not be as high as deep learning
    models.


    +   **Training time**: Different algorithms have different training speeds against
    the same dataset. Simple models, such as linear models, are faster to train, but
    deep learning models would take longer to train.


    There are a couple of quantitative measures for algorithm complexity. **Time complexity**
    describes the compute time/operations needed to run an ML algorithm, and **space
    complexity** is the amount of computing needed to run the algorithm. **Big O**
    is a notation for describing time and space complexity, which defines the estimated
    upper bound of an algorithm. For example, the time complexity for linear search
    is $O(N)$, and the time complexity for binary search would be represented by $O(\log
    N)$, where $N$ is the number of data samples in the target list.


    +   **Data linearity**: For data with linear relationships between the input and
    output data, linear models can work quite well. However, for a dataset with non-linear
    relationships (that is, the input variable and output variable do not change proportionally),
    linear models may not always be able to capture deeper intrinsic relationships,
    and we normally need algorithms such as deep learning neural networks and decision
    trees to handle complex datasets.


    +   **Number of features**: A training dataset can contain a large number of features,
    and not all of them are relevant for model training. Some ML algorithms can handle
    irrelevant or noisy features well, and some may get negatively impacted in training
    speed or model performance. Different algorithms have different approaches for
    reducing the influence of noisy features or uninformative features through a technique
    called **regularization**. Some regularization techniques work by adding additional
    error terms to the training loss function to reduce the influences of noisy data.
    Other methods, use **dropout**, randomly remove nodes in neural networks to achieve
    regularization.


    Next, we have reviewed some key considerations for ML algorithms. Next, let''s
    deep into the different types of algorithms by the problems they solve.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Algorithms for classification and regression problems


    The vast majority of the ML problems the world currently solves are classification
    and regression problems. In the following section, we will take a look at some
    of the common classification and regression algorithms.


    # Linear regression algorithm


    Linear regression algorithms are designed for solving regression problems and
    predict a continuous value given a set of independent inputs. This kind of algorithm
    is used extensively in practical applications, such as estimating the product
    sales as a function of the product price or understanding the yield of a crop
    as a function of rainfall and fertilizer.


    Linear regression uses a linear function of a set of coefficients and input variables
    to predict a scalar output. The formula for the linear regression is written as
    follows:


    ```

    f(x) = W_1 * X_1 + W_2 * X_2 + ... + W_n * X_n + \varepsilon

    ```


    Here, Xs are the input variables, Ws are the coefficients, and $\varepsilon$ is
    the error term. The motivation behind linear regression is that for a dataset
    where the output has a linear relationship with its inputs, its output value can
    be estimated by the weighted sum of the inputs. The intuition behind linear regression
    is to find a line or hyperplane that can estimate efficiently with small datasets.
    It is also highly interpretable, meaning that you can use the coefficient to understand
    the strength of the relationship between the input variable and the output response.
    However, as it is a linear model, it does not work well when the dataset is complex,
    with non-linear relationships. Linear regression assumes input features to be
    mutually independent (no co-linearity), meaning the value of one feature does
    not influence the value of another feature. When there is co-linearity among the
    input features, it makes it hard to trust the significance of correlated features.


    # Logistic regression algorithm


    A logistic regression algorithm is often used for binary classification tasks.
    Real-world examples of using logistic regression include predicting the probability
    of someone clicking on an advertisement or whether someone could qualify for a
    loan.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Logistic regression models the probability of a set of input data belonging
    to a class or event, such as transaction fraud or passing/failing an exam. It
    is also a linear model as the linear regression and its output is a linear combination
    of various inputs. However, since linear regression does not always produce a
    number between 0 and 1 (as needed for probability), logistic regression is used
    to return a value between 0 and 1 to represent probability. The intuition behind
    logistic regression is to find a line or plane/hyperplane that can cleanly separate
    two sets of data points as much as possible. The following formula is the function
    for the logistic regression, where X is a linear combination of variables (B+WX).
    Here, the W is the regression coefficient:


    ```

    f(x) = \frac{1}{1 + e^{-x}}

    ```


    Similar to linear regression, logistic regression''s advantage is its fast training
    speed and its interpretability. Logistic regression is a linear model, so it cannot
    be used for solving problems with complex non-linear relationships.


    # Decision tree algorithm


    A decision tree is used extensively in many-world ML use cases, such as heart
    disease prediction, target marketing, and loan default prediction. They can be
    used for both classification and regression problems.


    The motivation behind a decision tree is that data can be split using rules in
    a hierarchical manner, so similar data points will follow a similar decision path.
    Specifically, it works by splitting the input data using different features at
    different branches of the tree. For example, if age is a feature for splitting
    at a branch, then use a conditional check (such as age > 50 ) to split the data
    at a branch. It makes decisions on which feature and where to split by various
    algorithms, such as the Gini purity index (the Gini index measures the probability
    of a variable being classified incorrectly) and information gain (information
    gain calculates the reduction in entropy before and after the split).'
  merge: -1
  img_proc: true
