- pgno: 53
  md: '# # Insurance


    The insurance industry consists of several sub-sectors based on the insurance
    product types offered by the different insurance companies, such as accident and
    health insurance, property and casualty insurance, and life insurance. In addition
    to the insurance companies that provide coverage through insurance policies, insurance
    technology providers are also key players in the insurance industry.


    There are two main business processes in most insurance companies: the insurance
    underwriting process and the insurance claim management process.


    # ## Insurance underwriting


    **Insurance underwriting** is the process of assessing the risk of providing insurance
    coverage for people and assets. Through this process, an insurance company establishes
    the premium for the risks that it is willing to take. Insurance companies normally
    use insurance software and actuarial data to assess the magnitude of the risk.
    The underwriting process varies, depending on the insurance products. For example,
    the steps for property insurance are normally as follows:


    +   1. The customer files an insurance application through an agent or insurance
    company directly.


    +   2. The underwriter at the insurance company assesses the application by considering
    different factors such as the applicant''s loss and insurance history, actuarial
    factors to determine whether the insurance company should take on the risk, and
    what the price and premium should be for the risk. Then, they make an additional
    adjustment to the policy, such as coverage amount and deductibles.


    +   3. If the application is accepted, then an insurance policy is issued.


    During the underwriting process, an underwriter has to collect and review a large
    amount of data, estimate the risk of a claim based on the data and underwriter''s
    personal experience, and come up with a premium that can be justified. Human underwriters
    would only be able to review a subset of data and introduce personal bias into
    the decision-making process. ML models would be able to act on a lot more data
    to make more accurate data-driven decisions on risk factors such as the probability
    of claims and the claim''s outcome, and it would make decisions much faster than
    a human underwriter can. To come up with the premium for the policy, an underwriter
    would spend a lot of time assessing the different risk factors. ML models can
    help generate recommended premiums by using large amounts of historical data and
    risk factors.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# # Insurance claim management


