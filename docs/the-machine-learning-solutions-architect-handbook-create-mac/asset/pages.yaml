    ![](img/bd21298357d8484151447cff0b2f138b_398_0.png)


    Figure 12.1 – The loan document verification and data extraction process


    In this architecture, we use a combination of Textract, Comprehend, and Amazon
    Augmented AI services to support loan document classification and loan data processing
    flow.


    # Loan document classification workflow


    First, we need to train a custom text classification model for classifying the
    text that appears in each type of document. Here, we will train a custom classification
    model using Comprehend. The training data for Comprehend’s custom classifier consists
    of the necessary input text and labels. Note that Comprehend has limits on the
    input text size and the maximum number of classes, and this limit can change.
    Check out the official documentation for the latest limitation details. Once the
    model has been trained, you get a private API endpoint for the classifier.


    Once the custom model has been trained and deployed, the main flow of the architecture
    is as follows:


    +   - Data extraction: Once the documents have been received and digitized as
    images or PDFs, Textract can be used to extract text, tabular data, and forms
    data from the documents. The output will be in JSON format and stored as files
    in S3.'
