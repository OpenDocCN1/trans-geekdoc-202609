- pgno: 277
  md: '# # 9

    # Building an Enterprise ML Architecture with AWS ML Services


    To support a large number of fast-moving machine learning (ML) initiatives, many
    organizations often decide to build enterprise ML platforms capable of supporting
    the full ML life cycle, as well as a wide range of usage patterns, automate also
    needs to be automated and scalable. As a practitioner, I have often been asked
    to provide architecture guidance on how to build enterprise ML platforms. In this
    chapter, we will discuss the core requirements for enterprise ML platform design
    and implementation. We will cover topics such as workflow automation, infrastructure
    scalability, and system monitoring. You will learn about architecture patterns
    for building technology solutions that automate the end-to-end ML workflow and
    deployment at scale. We will also dive deep into other core enterprise ML architecture
    components such as model training, model hosting, the feature store, and the model
    registry at enterprise scale.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Specifically, we will cover the following topics:


    +   * Key requirements for an ML platform

    * Enterprise ML architecture pattern

    * Adopting ML Operations (MLOps) for an ML workflow

    * Hands-on exercise – building an MLOps pipeline on AWS


    Governance and security is another important topic for enterprise ML, which we
    will cover in greater detail in Chapter 11, ML Governance, Bias, Explainability,
    and Privacy. To get started, let''s discuss the key requirements for an enterprise
    ML platform.


    # Technical requirements


    We will continue to use the AWS environment for the hands-on portion of this chapter.
    All the source code mentioned in this chapter can be found at https://github.com/PacktPublishing/The-Machine-Learning-Solutions-Architect-Handbook/tree/main/Chapter09.


    # Key requirements for an enterprise ML platform


    To deliver the business values for ML at scale, organizations need to be able
    to experiment quickly with different scientific approaches, ML technologies, and
    datasets at scale. Once the ML models have been trained and validated, they need
    to be deployed to production with minimal friction. While there are similarities
    between a traditional enterprise software system and an ML platform, such as scalability
    and security, an enterprise ML platform poses many unique challenges, such as
    integrating with the data and high-performance computing infrastructure for large-scale
    model training. Now, let''s talk about some specific ML life cycle requirements:


    +   * Support for the end-to-end ML life cycle: An enterprise ML platform needs
    to support both data science experimentation and production-grade operations/deployments.
    In Chapter 8, Building a Data Science Environment Using AWS ML Services, we learned
    about the key architecture components that are needed to build a data science
    experimentation environment. To enable production-grade operations and deployment,
    an enterprise ML platform also needs to have architecture components for large-scale
    model training, model management, feature management, and model hosting with high
    availability and scalability.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '+   * Support for continuous integration (CI), continuous training (CT), and
    continuous deployment (CD): An enterprise ML platform provides capabilities beyond
    testing and validating code and components – it also such capabilities for data
    and models. The CD capability for ML is also more than just deploying a single
    piece of software; it is the combination of ML models and inference engines. CT
    is unique to ML, whereby a model is monitored continuously, and automated model
    retraining can be triggered when data drift or model drift is detected, or training
    data is changed. **Data drift** is a change in data whereby the characteristics
    of the data in production are statistically different from the training data.
    **Model drift** is a change in model performance whereby the model performance
    degrades from the performance that was achieved during the model training.


    +   * MLOps support: An enterprise ML platform provides capabilities for monitoring
    the statuses, errors, and metrics of different pipeline workflows, processing/training
    jobs, and model serving engines. It also monitors infrastructure-level state and
    resource usage. The automated alert mechanism is also a key component of MLOps.
    Where possible, automated failure recovery mechanisms should be implemented.


    +   * Support for different languages and ML frameworks: An enterprise ML platform
    allows scientists and ML engineers to work on different ML problems using the
    programming language and ML libraries of their choice. It needs to support popular
    languages such as Python and R, as well as ML packages such as TensorFlow, PyTorch,
    and scikit-learn.


    +   * Computing hardware management: Depending on model training and inference
    needs and cost considerations, an enterprise ML platform needs to support different
    types of compute hardware, such as CPUs and GPUs. Where applicable, it should
    also support specialized ML hardware as AWS''s inferia chip.


    +   * Integration with other third-party systems and software: An enterprise ML
    platform seldom works in isolation. It needs to provide integration capabilities
    with other third-party software or platforms, as as workflow orchestration tools,
    container registries, and code repositories.


    +   * Authentication and authorization: An enterprise ML platform needs to provide
    different levels of authentication and authorization control to govern secure
    access to data, artifacts, and ML platform resources. This authentication and
    authorization can be a built-in capability of the ML platform or it can be provided
    by an external authentication and authorization service.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '+   Data encryption: For regulated industries, such as financial services and
    healthcare, data encryption is a key requirement. An enterprise ML platform needs
    capabilities for encrypting data at rest and in transit, often with customer-managed
    encryption keys.


    +   Artifacts management: An enterprise ML platform processes datasets and produces
    different artifacts at the different phases of the ML life cycle. To establish
    reproducibility and meet governance and compliance requirements, an enterprise
    ML platform needs to be able to track, manage, and version-control these artifacts.


    With that, we have talked about the key requirements of an enterprise ML platform.
    Next, let''s discuss how AWS and DevOps services, such as SageMaker, CodePipeline,
    and Step Functions, can be used to build an enterprise-grade ML platform.


    # Enterprise ML architecture pattern overview


    Building an enterprise ML platform on AWS starts with creating different environments
    to enable different data science and operations functions. The following diagram
    shows the core environments that normally make up an enterprise ML platform. From
    an isolation perspective, in the context of the AWS cloud, each environment in
    the following diagram is a separate AWS account:


    ![](img/bd21298357d8484151447cff0b2f138b_280_0.png)


    Figure 9.1 – Enterprise ML architecture environments'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'As we discussed in Chapter 8, Building a Data Science Environment Using AWS
    ML Services, data scientists use the data science environment for experimentation,
    model building, and tuning. Once these experiments are completed, the data scientists
    commit their work to the proper code and data repositories. The next step is to
    train and tune the ML models in a controlled and automated environment using the
    algorithms, data, and training scripts that were created by the data scientists.
    This controlled and automated model training process will help ensure consistency,
    reproducibility, and traceability for model building at scale. The following are
    the core functionalities and technology options provided by the training, hosting,
    and shared environments:


    +   - The model training environment manages the full life cycle of model training,
    from computing and infrastructure resource provisioning to training job monitoring
    and model persistence. From a technology option perspective, you can build out
    your training infrastructure using proprietary or open source technology, or you
    can choose a fully managed ML service, such as the SageMaker service.


    +   - The model hosting environment is used for serving the trained models both
    web service endpoints or in batch mode. Model hosting environments can have services
    such as the SageMaker hosting service, Kubernetes/Keflow container-based model
    serving, Lambda, or EC2-based model serving different model inference engines.
    Other supporting services such as the online feature store and API management
    service can also run in the model hosting environment.


    +   - The shared services environment hosts common services tooling as workflow
    orchestration tools, CI/CD tools, code repositories, Docker image repositories,
    and private library package tools. A central model registry can also run in the
    shared services environment for model registration and model life cycle management.
    Service provisioning capabilities, different environments through Infrastructure
    as Code (IaC) or APIs, are also run out of this environment. Any service ticketing
    tools, such as ServiceNow, and service provisioning tools, such as Service Catalog,
    can also be hosted in this environment.


    In addition to the core ML environments, there are other environments, such as
    security, governance, monitoring, and logging, that are required in the enterprise
    ML platform:


    +   - The security and governance environment centrally manages authentication
    services, user credentials, and data encryption keys. Security audit and reporting
    processes also run in this environment. Native AWS services, such as AWS IAM,
    AWS KMS, and AWS Config, can be used for various security and governance functions.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '+   The monitoring and logging environment centrally aggregates monitoring
    and logging data from other environments for further processing and reporting.
    Custom dashboarding and alerting mechanisms are normally developed to provide
    easy access to key metrics and alerts from the underlying monitoring and logging
    data.


    With that, you have an overview of the core building blocks of an enterprise ML
    platform. Next, let''s dive deep into several areas. Note that there are different
    patterns and services we can use to build an ML platform on AWS. In this chapter,
    we will cover one of the enterprise patterns.


    # Model training environment


    Within an enterprise, a model training environment is a controlled environment
    with well-defined processes and policies on how it is used and who can use them.
    Normally, it should be an automated environment that''s managed by an MLOps team,
    though it can be self-service enabled for direct data scientists.


    Automated model training and tuning are the core capabilities of the model training
    environment. To support a broad range of use cases, a model training environment
    needs to support different ML and **deep learning** frameworks, training patterns
    (such as single-node and distributed training), and hardware (different CPUs and
    GPUs).


    The model training environment manages the life cycle of the model training process.
    This can include authentication and authorization, infrastructure provisioning,
    data movement, data preprocessing, ML library deployment, training loop management
    and monitoring, model persistence and registry, training job management, and lineage
    tracking. From a security perspective, the training environment needs to provide
    security capabilities for different isolation requirements, such as network isolation,
    job isolation, and artifacts isolation. To assist with operational support, a
    model training environment also needs to be able to training status logging, metrics
    reporting, and training job monitoring and alerting.


    Next, let''s learn how the SageMaker training service can be used in a controlled
    model training environment in an enterprise setting.'
