- pgno: 153
  md: '+   Model saving: The Spark ML pipeline can be serialized into a serialization
    format called an MLeap bundle, which is an external library from Spark. A serialized
    MLeap bundle can be deserialized into Spark for batch scoring or a MLeap runtime
    for real-time APIs. You can find more details about MLeap at https://combust.github.io/mleap-docs/.
    The following code shows the syntax for serializing a Spark model into MLeap format:


    ```

    import mleap.pyspark

    from pyspark.ml import Pipeline, PipelineModel


    lr_model.serializeToBundle("saved_file_path", lr_model.transform(dataframe))

