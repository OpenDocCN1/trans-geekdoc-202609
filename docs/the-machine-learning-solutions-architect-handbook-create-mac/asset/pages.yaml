    \ create CRs and manage them just like the built-in resources, and you can use\
    \ the same tools (such as kubectl) to manage them. When you create the custom\
    \ resource (CR) in Kubernetes, creates a new API (for example, <custom resource\
    \ name>/<version>) for each version of the resource. This is also known as extending\
    \ the Kubernetes APIs. To create a CR, you create a custom resource definition\
    \ (CRD) YAML file. To register the CRD in Kubernetes, you simply run kubectl apply\
    \ -f <name of the CRD yaml file> to apply the file. And after that, you can use\
    \ it just like any other Kubernetes resource. For example, to manage a custom\
    \ training job on Kubernetes, you can define a CRD with specifications such as\
    \ algorithm name, data encryption setting, training image, input data sources,\
    \ number of job failure retries, number of replicas, and job liveness probe frequency."
