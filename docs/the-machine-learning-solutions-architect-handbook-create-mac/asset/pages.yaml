  md: '# # Amazon Textract


    Many business processes, such as loan application processing, expense processing,
    and medical claim processing, require extracting text and numbers from images
    and documents. Currently, many organizations largely handle these processes manually
    and the process can be highly time-consuming and slow.


    **Amazon Textract is an optical character recognition (OCR)** AI service that
    is primarily used for extracting printed text, handwritten text, and numbers from
    images and PDF documents. Textract is normally used as a processing step for downstream
    tasks such as document analysis and data entries. The core Textract functionalities
    are as follows:


    +   - OCR: OCR is a computer vision task that detects and extracts text from PDF
    documents and images. The OCR component in Textract extracts raw text from the
    input documents and provides additional structural information about the documents.
    For example, the Textract output contains hierarchical structural relationships
    for the different objects in a document as pages, paragraphs, sentences, and words.
    Textract also captures the positional information of the different objects in
    the input document. The hierarchical structural information and object positional
    data are useful when you are extracting specific information from different locations
    in the documents. The OCR APIs are DetectText for detecting text synchronously
    and StartDocumentText asynchronously.


    +   - Table extraction: Many documents contain tabular data structures and need
    to be processed as a table. For example, you might have an insurance claim document
    that contains a list of claim items and their details in different columns, and
    you may want to enter these claim items into a system. The table extraction component
    in Textract can extract tables and cells in the tables from a document. To use
    the table extraction feature, you can use the AnalyzeDocument API for synchronous
    operations and StartDocumentAnalysis for asynchronous operations.


    +   - Form extraction: Documents such as paysubs and loan application forms contain
    many name-value pairs whose relationships need to be preserved when they''re processed
    automatically. The form extraction component in Textract can detect these name-value
    pairs and their relationships for downstream processing, such as entering the
    names in these documents into a system. The form extraction component shares the
    same AnalyzeDocument and StartDocumentAnalysis APIs as the table extraction component.'
  merge: -1
  img_proc: true
