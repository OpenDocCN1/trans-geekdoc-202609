  md: "# Automation support\n\nThe SageMaker training service is exposed through a\
    \ set of APIs and can be automated by integrating external applications or workflow\
    \ tools, such as Airflow and AWS Step Functions. For example, it can be one of\
    \ the steps in an Airflow-based pipeline for end-to-end ML workflow. Some workflow\
    \ tools, such as Airflow and AWS Step Functions, provide SageMaker-specific connectors\
    \ to interact with the SageMaker training service more seamlessly. The SageMaker\
    \ training service also provides Kubernetes operators, so it can be integrated\
    \ and automated as part of the Kubernetes workflow. The sample code shows how\
    \ to kick off a training job using the low-level API via the AWS boto3 SDK:\n\n\
    ```\nimport boto3\nclient = boto3.client('sagemaker')\nresponse = client.create_training_job(\n\
    \    TrainingJobName='job name',\n    HyperParameters={list of parameters and\
