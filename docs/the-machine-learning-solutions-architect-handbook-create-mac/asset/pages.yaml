- pgno: 381
  md: '# 12

    Building ML Solutions with AWS AI Services


    You have come a long way and we are getting close to the finishing line. Up to
    this point, we have mainly focused on the skills and technologies required to
    build and deploy ML models using open source technologies and managed ML platforms.
    To solve business problems with machine learning, however, you don''t have to
    build, train, and deploy your ML models from scratch. An alternative option is
    to fully managed AI services. AI services are also fully managed APIs or applications
    with pre-trained models that perform specific ML tasks, such as object detection
    or sentiment analysis. Some AI services also allow you to train custom models
    with your data for a defined ML task, such as document classification. AI services
    promise to enable organizations to build ML-enabled solutions without requiring
    strong ML competencies.'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'In this final chapter, we are going to switch gears and talk about several
    AWS AI services and where they can be used in business applications. Please note
    that the focus of this chapter will not be to dive deep into individual AI services,
    as warrants dedicated books. Instead, we will focus on ML use cases that can be
    powered by AI services, and the architecture patterns that you can use to deploy
    these AI services. After reading this chapter, you should be able to identify
    some use cases where AI services can be a good fit and where to find the additional
    resources to get a deeper understanding of these services. Specifically, we are
    going to cover the following topics:


    +   - What are AI services?

    - Overview of the AWS AI Services

    - Building intelligent solutions using AI services

    - Designing an MLOps archtecture for AI services

    - Hands-on lab – running ML tasks for AI services


    # # Technical requirements


    You will continue to use our AWS environment for the hands-on portion of this
    book. The associated code samples can be found at https://github.com/PacktPublishing/The-Machine-Learning-Solutions-Architect-Handbook/tree/main/Chapter12.


    # # What are AI services?


    AI services are pre-built fully managed services that perform a particular set
    of ML tasks out of the box, such as facial analysis or text analysis. The primary
    target users for AI services are application developers who want to build AI applications
    without the need to build ML models from scratch. In contrast, the target audiences
    for ML platforms are data scientists and ML engineers, who need to go through
    the full ML life cycle to build and deploy ML models. For an organization, AI
    services mainly solve the following challenges:


    +   - Lack of high-quality training data for ML model development: To train high-quality
    models, you need a large amount of high-quality curated data. For many organizations,
    data poses many challenges in data sourcing, data engineering, and data labeling.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '+   - Lack of data science skills for building and deploying custom ML models:
    Data science and ML engineering skills are scarce in the market and expensive
    to acquire.


    +   - Slow product time-to-market: Building and deploying custom models and engineering
    infrastructure is time-consuming. This can be a hurdle for a quick time-to-market
    product delivery goal.


    +   - Undifferentiated capabilities: Many ML problems can be solved using commodity
    ML capabilities that do not provide unique competitive advantages. Spending resources
    on building undifferentiated ML capabilities can be a waste of scarce resources.


    +   - System scalability challenge: Managing scalable infrastructure to meet the
    dynamic market demands and growth is an engineering challenge.


    While AI services can provide a cost-effective way for building ML-enabled products
    quickly, they come with limitations. The main limitations are the lack of customization
    flexibility for specific functional and technical requirements. AI services usually
    focus on specific ML tasks with a predefined set of algorithms, so usually you
    don''t have the flexibility to alter the functionality of the AI services. With
    AI services, you normally do not access to the underlying models, thus limiting
    your ability to deploy the model elsewhere.


    The number of offerings in AI services has grown extensively in recent years,
    and we expect this trend to continue at an accelerated pace. Next, we will talk
    about several AWS AI services.


    # Overview of AWS AI services


    AWS provides AI services in multiple machine learning domains such as text and
    vision, as well as AI services for industrial use cases such as manufacturing
    anomaly detection and predictive maintenance. In this section, we will cover a
    subset of AWS AI services. The objective of this section will not be to deep dive
    into individual services, but rather make you aware of the fundamental capabilities
    offered by these AI services. This will let you know where and how these services
    can be integrated into your applications.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Amazon Comprehend


    NLP has gained significant interest across different industries in solving a range
    of business problems, such as automatic document processing, text summarization,
    document understanding, and document management and retrieval. Amazon Comprehend**
    is an AI service that can perform NLP analysis on unstructured text documents.
    At its core, Amazon Comprehend provides the following main capabilities:


    +   - **Entity recognition**: Entities are the who, what, where, and when of text
    analytics. Entities are the most important parts of a sentence as they identify
    the components in a sentence. Examples of entities are proper nouns such as a
    person, place, or product. Entities can be used to create document indexes and
    identify key information or relationships across documents.


    Comprehend provides APIs (for example, `DetectEntities`) for detecting entities
    with its built-in recognition models. It can detect entities such as people, places,
    organizations, and dates from the input text.


    You can also use Comprehend to train a custom entity recognizer for your custom
    entities if the built-in models do not meet your requirements. To train a custom
    entity recognizer, you can use the `CreateEntityRecognizer` API with your training
    data in the following formats:


    +   - **Annotation**: You provide the locations of entities (beginning and end
    offsets of target characters) in a large number of documents, along with the entity
    type for each pair of offsets. This helps Comprehend train on both the entities
    and the context they are in.


    +   - **Entity list**: You provide a list of entities and their entity types in
    plaintext and Comprehend will train to detect these specific entities.


    You can evaluate the custom model using the metrics emitted by a Comprehend custom
    model training job. Example evaluation metrics include precision, recall, and
