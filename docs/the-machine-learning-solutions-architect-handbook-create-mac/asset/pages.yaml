  md: 'Create an AWS access key pair and add the AWS access key pair info to the EC2
    server using the aws configure command. If you don''t know how to create an AWS
    access key pair, follow the instructions at https://docs.aws.amazon.com/powershell/latest/userguide/pstools-appendix-sign-up.html.
    Make sure your AWS credential have read/write permissions to S3, as the MLflow
    server will need to use S3 for store artifacts.


    +   Install the MLflow packages: After the instance is ready, connect to the EC2
    instance using the EC2 Instance Connect feature in the AWS console. MLflow can
    be easily installed as Python packages. Run the following commands in the EC2
    terminal to install the MLflow packages:


