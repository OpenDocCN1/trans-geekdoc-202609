    * Kubernetes security and access control

    * Hands-on lab – building a Kubernetes infrastructure on AWS


    # Technical requirements


    In this chapter, you will continue to use services in your AWS account for the
    hands-on

    portion of the chapter. We will be using several AWS services, including the AWS
    Kubernetes Service (EKS), AWS CloudShell, and AWS EC2. All code files used in
