- pgno: 215
  md: "# KFServing framework\n\nTensorFlow Serving and TorchServe are standalone serving\
    \ frameworks for a specific deep learning framework. In contrast, KFServing is\
    \ a general-purpose multi-framework model serving framework that supports different\
    \ ML models. KFServing uses standalone model serving frameworks such as TensorFlow\
    \ Serving and TorchServe as the backend model servers. It is part of the Kubeflow\
    \ project and provides pluggable architecture for different model formats:\n\n\
    ![](img/bd21298357d8484151447cff0b2f138b_215_0.png)\n\nFigure 7.6 – KFServing\
    \ components\n\nAs a general-purpose, multi-framework model serving solution,\
    \ KFServing provides several out-of-the-box model servers (also known as predictors)\
    \ for different model types, including TensorFlow, PyTorch XGBoost, scikit-learn,\
    \ and ONNX. With KFServing, you can serve models using REST and gRPC protocols.\
    \ To deploy a supported model type, you simply need to define a YAML specification\
    \ that points to the model artifact in a data store. You can also build your own\
    \ custom containers to serve models in KFServing. The container needs to provide\
    \ a model serving implementation as well as a web server. The following code shows\
    \ a sample YAML specification to deploy a tensorflow model using KFServing:\n\n\
    ```\napiVersion: \"serving.kubeflow.org/v1alpha2\"\nkind: \"InferenceService\"\
    \nmetadata:\n  name: \"model-name\"\nspec:\n  default:\n```"
  merge: -1
  img_proc: true
- pgno: 216
  md: "```\npredictor:\ntensorflow:\n  storageUri: <uri to model storage such as as\
    \ s3>\n```\n\nKFServing has a transformer that allows the custom processing of\
    \ the input payload it is sent to the predictors, and also allows the transforming\
    \ of the response from the predictor before it is sent back to the calling client.\
    \ Sometimes, you need to provide an explanation for the model prediction, which\
    \ as features have a stronger influence on the prediction. We will cover more\
    \ details on model explainability in a later chapter.\n\nKFServing is designed\
    \ for production deployment and provides a range of production deployment capabilities.\
    \ Its auto-scaling feature allows the model server to scale up/down based on the\
    \ amount of request traffic. With KFServing, you can deploy both the default model\
    \ serving endpoint and the canary endpoint and split the traffic between the two,\
    \ and specify model revisions behind the endpoint. For operational support, KFServing\
    \ also has built-in functionality for monitoring (for example, monitoring request\
    \ data and latency).\n\n# Seldon Core\n\nSeldon Core is another multi-framework\
    \ model serving framework for deploying models on Kubernetes. Compared to KFServing,\
    \ Seldon Core provides richer model serving features, for example, model serving\
    \ inference graphs for use cases such as A/B testing and model ensembles. The\
    \ following figure shows the core components of the Seldon Core framework:\n\n\
    ![](img/bd21298357d8484151447cff0b2f138b_216_0.png)\n\nFigure 7.7 – The Seldon\
    \ Core model serving framework architecture"
  merge: -1
  img_proc: true
- pgno: 217
  md: "Seldon Core provides packaged model servers for some of the ML libraries, including\
    \ the SKLearn server for scikit-learn models, the XGBoost models, TensorFlow Serving\
    \ for TensorFlow models, and MLflow server-based model serving. You can also build\
    \ your own custom serving container for specific model serving needs and host\
    \ it using Seldon Core.\n\nThe following template shows how to deploy a model\
    \ using the SKLearn server using Seldon Core. You simply need to change the modelUri\
    \ path to point to a saved model on a cloud object storage provider such as Google\
    \ Cloud Storage, Amazon S3 storage, or Azure Blob storage. To test with an example,\
    \ you can change the following modelUri value to an example provided by Seldon\
    \ Core - gs://seldon-models/sklearn/iris:\n\n```\napiVersion: machinelearning.seldon.io/v1alpha\n\
    kind: SeldonDeployment\nmetadata:\n  name: sklearn\nspec:\n  name: sklearn-model\n\
    \  predictors:\n    - graph:\n      children: []\n        implementation: SKLEARN\
    \ SERVER\n        modelUri: <uri to model artifacts on the cloud storage>\n  name:\
    \ classifier\n  name: default\n  replicas: 1\n```\n\nSeldon Core also supports\
    \ an advanced workflow (also known as an inference graph) for serving models.\
    \ The inference graph feature allows you to have a graph with different models\
    \ and other components in a single inference pipeline. An inference graph can\
    \ consist of several components:\n\n+   - One or more ML models for the different\
    \ prediction tasks\n- Traffic routing management for usage patterns, such as traffic\
    \ splitting to different models for A/B testing\n- A component for combining results\
    \ from multiple models, such as a model ensemble component"
  merge: -1
  img_proc: true
- pgno: 218
  md: "+   - Components for transforming the input requests (such as performing feature\n\
    engineering) or output responses (for example, returning an array format as\n\
    a JSON format\n\nTo build inference graph specifications in YAML, you need the\
    \ following key components\nin the seldondeployment YAML file:\n\n+   - A list\
    \ of predictors, with each predictor having its own componentSpecs section\nthat\
    \ specifies details such as container images\n\n+   - A graph that describes how\
    \ the components are linked together for each\ncomponentSpecs section\n\nThe following\
    \ sample template shows the inference graph for a custom deployment\nto split\
    \ the traffic into two different versions of a model:\n\n```\napiVersion: machinelearning.seldon.io/v1alpha\n\
    kind: SeldonDeployment\nmetadata:\n  name: canary-deployment\nspec:\n  name: canary-deployment\n\
    \  predictors:\n  - componentSpecs:\n      spec:\n        containers:\n      \
    \  - name: classifier\n          image: <container uri to model version 1>\ngraph:\n\
    \  children: []\n  endpoint:\n    type: REST\n    name: classifier\n    type:\
    \ MODEL\n  name: main\n    replicas: 1\n    traffic: 75\n  componentSpecs:\n \
    \ - spec:\n```"
  merge: -1
  img_proc: true
- pgno: 219
  md: "# Open source technologies for building ML platforms 201\n\n```\ncontainers:\n\
    \  name: classifier\n  image: <container uri to model version 2>\ngraph:\n  children:\
    \ []\n  endpoint:\n    type: REST\nname: classifier\n  type: MODEL\nname: canary\n\
    \  replicas: 1\ntraffic: 25\n```\n\nOnce a deployment manifest is applied, the\
    \ Seldon Core operator is responsible for creating all the resources needed to\
    \ serve an ML model. Specifically, the operator will create resources defined\
    \ in the manifest, add orchestrators to the Pods to manage the orchestration of\
    \ the inference graph, and configure the traffic using ingress gateways such as\
    \ Istio.\n\n# Automating ML pipeline workflows\n\nTo automate the core ML platform\
    \ components we have covered so far, we need to build pipelines that can orchestrate\
    \ different steps using these components. Automation not only increases efficiency\
    \ and productivity – it also helps enforce consistency, enable reproducibility,\
    \ and reduce human errors. There are several open source technologies that can\
    \ be used for automating ML workflows. In this section, we will take a look at\
    \ Apache Airflow and Keflow Pipelines.\n\n# Apache Airflow\n\nApache Airflow is\
    \ an open source software package for programmatically authoring, scheduling,\
    \ and monitoring multi-step workflows. It is a general-purpose workflow orchestration\
    \ that can be used to define workflows for a wide range of tasks, including ML\
    \ tasks. First, let's review some core Airflow concepts:\n\n+   - **Directed Acyclic\
    \ Graph (DAG):** A DAG defines independent tasks that are executed independently\
    \ in a pipeline. The sequences of the execution can be visualized as a graph.\n\
    - **Tasks:** Tasks are basic units of execution in Airflow. Tasks have dependencies\
    \ between them during executions."
  merge: -1
  img_proc: true
- pgno: 220
  md: "+   **Operators**: Operators are DAG components that describe a single task\
    \ in the pipeline. An operator implements the task execution logic. Airflow provides\
    \ a list of operators for common tasks, such as a Python operator for running\
    \ Python code, or an Amazon S3 operator to interact with the S3 service. Tasks\
    \ are created when operators are instantiated.\n\n+   **Scheduling**: A DAG can\
    \ run on demand or on a predetermined schedule.\n\nAirflow can run on a single\
    \ machine or in a cluster. It can also be deployed on the Kubernetes infrastructure.\
    \ The following figure shows a multi-node Airflow deployment:\n\n![](img/bd21298357d8484151447cff0b2f138b_220_0.png)\n\
    \nThe *master node mainly runs the web server and scheduler*. The scheduler is\
    \ responsible for scheduling the execution of the DAGs. It sends tasks to a queue,\
    \ and the worker nodes retrieve the tasks from the queue and run them. The metadata\
    \ store is used to store the metadata of the Airflow cluster and processes, such\
    \ as task instance details or user data.\n\nYou can author the Airflow DAGs using\
    \ Python. The following sample code shows how to author a basic Airflow DAG in\
    \ Python with two bash operators in a sequence:\n\n```\nfrom airflow import DAG\n\
    from airflow.operators.bash.bash_operator import BashOperator\nfrom datetime import\
    \ datetime, timedelta\n```\n\n```\ndefault_args = {\n    'owner': myname,\n}\n\
    ```"
  merge: -1
  img_proc: true
