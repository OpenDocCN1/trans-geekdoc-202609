    After the deployment, a Deployment controller monitors the deployed container
    instances. If an instance goes down, the controller will replace it with another
    instance on the worker node.


    +   **Kubernetes Job:** A Kubernetes Job is a controller that creates one or more
    Pods to run some tasks, and ensures the job is successfully completed. If a number
    of Pods fail due to node failure or other system issues, a Kubernetes Job will
    recreate the Pods to complete the task. A Kubernetes Job can be used to run batch-oriented
    tasks, as running batch data processing scripts, ML model training scripts, or
    ML batch inference scripts on a large number of inference requests. After a job
    is completed, the Pods are not terminated, so you can access the job logs and
    inspect the detailed status of the job. The following is an example template for
    running a training job:


    ```

    apiVersion: batch/v1

    kind: Job # indicate that his is is the Kubernetes Job

    ```'
