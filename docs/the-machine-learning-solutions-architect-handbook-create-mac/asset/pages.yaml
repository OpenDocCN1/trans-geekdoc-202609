  md: "6. Now, let's start the training process. We are going to run 15 epochs. Unlike\
    \ the TensorFlow Keras API, where you just call a fit () function to start the\
    \ training, PyTorch requires you to build a training loop and specifically run\
    \ the forward pass (model (images)), run the backward pass to learn (loss.backward()),\
    \ update the model weights (optimizer.step()), and then calculate the loss and\
    \ the average loss. For each training step, trainer returns one batch (a batch\
    \ size of 64) of training data samples. Each training sample is flattened into\
    \ a 784-long vector. The optimizer is reset with zeros for each training step:\n\
    \n```\nepochs = 15\nfor e in range(epochs):\n    running_loss = 0\n    for images,\
    \ labels in trainloader:\n        images = images.view(images.shape[0], -1)\n\
    \        optimizer.zero_grad()\n        output = model(images)\n        loss =\
    \ criterion(output, labels)\n        loss.backward()\n        optimizer.step()\n\
    \        running_loss += loss.item()\n    else:\n        print(\"Epoch {} - Training\
    \ loss: {}\".format(e, running_loss/len(trainloader)))\n```\n\nWhen the training\
    \ code runs, it should print out the average loss for each epoch."
