  md: '# Multi-layer perceptron (MLP) network


    As mentioned in the beginning, an artificial neural network (ANN) mimics how the
    human brain learns. The human brain has a huge number of neurons that are connected
    in a network to process information. Each neuron in a network processes inputs
    (electrical impulses) from another neuron, processes and transforms the inputs,
    and sends the output to neurons in the network. The following figure shows a picture
    of a human neuron:


    ![](img/bd21298357d8484151447cff0b2f138b_82_0.png)


    Figure 3.5 – Human brain neuron


    An artificial neuron works similarly. The following figure shows an artificial
    neuron, which is mathematically a linear function plus an action function. An
    activation function transforms the output of the linear function, such as compressing
    the value between 0 and 1 (sigmoid activation), -1 and 1 (tanh activation), or
    greater than 0 (ReLU). The idea for the activation function is to learn the non-linear
    relationship between input and output. You can also think of each neuron as a
    linear classifier, for example, logistic regression. The following figure shows
    the structure of an artificial neuron:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/bd21298357d8484151447cff0b2f138b_83_0.png)


    Figure 3.6 – Artificial neuron


    When you stack a large number of neurons into different layers (input layer, hidden
    layers, and output layers), and connect all of the neurons together between two
    adjacent layers, we have an ANN that can **multi-layer perceptron (MLP)**. Here,
    the term *perceptron means artificial neuron*, and it was originally invented
    by Frank Rosenblatt in 1957. The idea behind MLP is that each hidden layer will
    learn some higher-level representation (features) of the previous layer, and those
    higher-level features capture the more important information in the previous layer.
    When the output from the final hidden layer is used for prediction, the network
    has extracted the most important information from the raw inputs for training
    a classifier or regressor. The following figure shows the architecture of an MLP
    network:


    ![](img/bd21298357d8484151447cff0b2f138b_83_1.png)


    Input layer Hidden layer Hidden layer Output layer


    Figure 3.7 – Multi-layer perceptron'
