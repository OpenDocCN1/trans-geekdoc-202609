  md: '# # Hands-on exercise – training a TensorFlow model


    In this exercise, you will learn how to install the TensorFlow in your local Jupyter
    environment and build and train a simple neural network model. Launch a Jupyter
    notebook that you have previously installed on your machine. If you don''t remember
