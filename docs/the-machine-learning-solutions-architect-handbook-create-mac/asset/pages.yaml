- pgno: 304
  md: "CodeBuild, CodeCommit, and CodePipeline can emit all events to EventBridge\
    \ to report detailed status changes and trigger custom event processing, such\
    \ as notifications, or log the events to another data repository for event archiving.\
    \ All three services can send detailed logs to CloudWatch to support operations\
    \ such as troubleshooting or detailed error reporting.\n\nStep Functions provides\
    \ a list of monitoring metrics to CloudWatch, such as execution metrics (such\
    \ as execution failure, success, abort, and timeout) and activity metrics (such\
    \ as activity started, scheduled, and succeeded). You can view these metrics in\
    \ the management console and set a threshold to up alerts.\n\n# Service provisioning\
    \ management\n\nAnother key component of enterprise-scale ML platform management\
    \ is service provisioning management. For large-scale provisioning and deployment,\
    \ an automated and controlled process should be adopted. Here, we will focus on\
    \ provisioning the ML platform itself, not provisioning AWS accounts and networking,\
    \ which should be established as the base environment for ML platform provisioning\
    \ in advance. For ML platform provisioning, there are the two main provisioning\
    \ tasks:\n\n+   - Data science environment provisioning: Provisioning the data\
    \ science environment for data scientists mainly includes provisioning science\
    \ and data management tools, storage for experimentation, as well as access entitlement\
    \ for data sources and pre-built ML automation pipelines.\n- ML automation pipeline\
    \ provisioning: ML automation pipelines need to be provisioned in advance for\
    \ data scientists and MLOps engineers to use them to automate different tasks\
    \ such as container, model training, and model deployment.\n\nThere are multiple\
    \ technical approaches to automate service provisioning on AWS, such as using\
    \ provisioning scripts, CloudFormation scripts, and AWS Service Catalog. With\
    \ scripts, you can sequentially call the different AWS CLI commands in a script\
    \ to provision different components, such as creating a SageMaker notebook. CloudFormation\
    \ is the IaC service for infrastructure deployment on AWS. With CloudFormation,\
    \ you create templates that describe the desired resources and dependencies to\
    \ be launched as a single stack. When the template is executed, all the resources\
    \ and dependencies specified in the stack will be deployed automatically. The\
    \ following code shows the template for deploying a SageMaker Studio domain:\n\
    \n```\nType: AWS::SageMaker::Domain\nProperties:\n  AppNetworkAccessType: String\n\
    ```"
