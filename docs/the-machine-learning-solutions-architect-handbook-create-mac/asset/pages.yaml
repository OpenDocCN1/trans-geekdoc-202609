- pgno: 13
  md: '# Preface


    Artificial intelligence and machine learning (ML) become increasingly prevalent
    in many industries, there is an increasing demand for ML solutions architects
    who can translate business needs into ML solutions and design technology platforms.
    This book is designed to help people learn ML concepts, algorithms, system architecture
    patterns, and ML tools to solve business and technical challenges, with an emphasis
    on large-scale ML architecture and operations in an enterprise setting.


    The book first introduces ML and business fundamentals, as the types of ML, business
    cases, and ML algorithms. It then dives into data management for ML and the various
    AWS services for building a data management architecture for ML.


    After the data management dive deep, the book focuses on two technical approaches
    to building ML platforms: using open source technologies such as Kubernetes, Kubeflow,
    MLFlow, and Seldon Core, and the use of managed ML services such as Amazon SageMaker,
    Step Functions, and CodePipeline.


    The book then gets into advanced ML engineering techniques, including distributed
    model training and low-latency model serving to meet large-scale model training
    and high-performance model serving requirements.


    Governance and privacy are important considerations for running models in production.
    In this book, I also cover ML governance requirements and how an ML platform can
    support ML governance in areas such as documentation, model inventory, bias detection,
    model explainability, and model privacy.


    Building ML-powered solutions do not always require building ML models or infrastructure
    from scratch. In the book''s last chapter, I will introduce AI services and the
    problems that AI services can help solve. You will learn the core capabilities
    of some AI services and where you can use them for building ML-powered business
    applications.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'By the end of this book, you will understand the various business, data science,
    and technology domains of ML solutions and infrastructure. You will be able to
    articulate the architecture patterns and considerations for building enterprise
    ML platforms and develop hands-on skills with various open source and AWS technologies.
    This book can also help you prepare for ML architecture-related job interviews.


    # Who this book is for


    This book is designed for two primary audiences: developers and cloud architects
    who are looking for guidance and learning materials to become ML solutions architects,
    and experienced ML architecture practitioners and data scientists who are looking
    to develop a broader understanding of industry ML cases, enterprise data and ML
    architecture patterns, data management and ML tools, ML governance, and advanced
    ML engineering techniques.


    This book can also benefit data engineers and cloud system administrators looking
    to understand how data management and cloud system architecture fit into the overall
    ML architecture.


    This book assumes you have some Python programming knowledge and are familiar
    with AWS services. Some of the chapters are designed for ML beginners to learn
    the core ML fundamentals, and they might overlap with the knowledge already possessed
    by experienced ML practitioners.


    # What this book covers


    Chapter 1, Machine Learning and Machine Learning Solutions Architecture, introduces
    the core concepts of ML and the ML solutions architecture function.


    Chapter 2, Business Use Cases for Machine Learning, talks about the core business
    fundamentals, workflows, and common ML cases in financial services, media entertainment,
    health care, manufacturing, and retail.


    Chapter 3, Machine Learning Algorithms, introduces common ML and deep learning
    algorithms for classification, regression, clustering, time series, recommendations,
    computer vision, natural language processing, and data generation. You will get
    hands-on experience of setting up a Jupyter server and building ML models on your
    local machine.


    Chapter 4, Data Management for Machine Learning, covers platform capabilities,
    system architecture, and AWS tools for building data management capabilities for
    ML. You will develop hands-on skills with AWS services for building data management
    pipelines for ML..'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Chapter 5, Open Source Machine Learning Libraries, covers the core features
    of scikit-learn, Spark ML, and TensorFlow, and how to use these ML libraries for
    data preparation, model training, and model serving. You will practice building
    deep learning models using TensorFlow and PyTorch.


    Chapter 6, Kubernetes Container Orchestration Infrastructure Management, introduces
    containers, Kubernetes concepts, Kubernetes networking, and Kubernetes security.
    Kubernetes is a core source infrastructure for building open source ML solutions.
    You will also practice setting up the Kubernetes platform on AWS EKS and deploying
    an ML workload on Kubernetes.


    Chapter 7, Open Source Machine Learning Platform, talks about the core concepts
    and the technical details of open source ML platform technologies, such as Kubeflow,
    MLflow, Airflow, and Seldon Core. The chapter also covers how to use these technologies
    to build a data science environment and ML automation pipeline, and provides you
    with instructions to develop hands-on experience with these open source technologies.


    Chapter 8, Building a Data Science Environment Using AWS Services, introduces
    various AWS services for building data science environments, including Amazon
    SageMaker, Amazon ECR, and Amazon CodeCommit. You will also get hands-on experience
    with these services to configure a data science environment for experimentation
    and model training.


    Chapter 9, Building an Enterprise ML Architecture with AWS ML Services, talks
    about the core requirements for an enterprise ML platform, discusses the architecture
    patterns for building an enterprise ML platform on AWS, and dives deep into the
    various ML capabilities of SageMaker and other AWS services. You will also learn
    MLOps and monitoring architecture with a hands-on exercise using ML pipelines
    for model training and model deployment.


    Chapter 10, Advanced ML Engineering, covers core concepts and technologies for
    large-scale distributed model training, such as data parallel and model parallel
    training using DeepSpeed and PyTorch DistributedDataParallel. It also dives deep
    into the technical approaches for low-latency model inference, such as using hardware
    acceleration, model optimization, and graph and operator optimization. You will
    also get hands on distributed data models training using a SageMaker training
    cluster.


    Chapter 11, ML Governance, Bias, Explainability, and Privacy, discusses the ML
    governance, bias, explainability, and privacy requirements and capabilities for
    production model deployment. You will also learn techniques for bias detection,
    explainability, and ML privacy with hands-on exercises using SageMaker Clarify
    and PyTorch Opacity.'
  merge: -1
  img_proc: true
