- pgno: 296
  md: 'A code repository is one of the most essential components in an MLOps environment.
    It is not only used by data scientists/ML engineers and other engineers to persist
    code artifacts, but it also serves as a triggering mechanism for a CI/CD pipeline.
    This means when a data scientist/ML engineer commits a code change, it can automatically
    kick off a CI/CD pipeline. For example, if the data scientist makes a change to
    the model training script and wants to test the automated training pipeline in
    the development environment, he/she can commit the code to a development branch
    to kick off a model training pipeline in the development environment. When it
    is ready for production release deployment, the data scientist can commit/merge
    the code to a release branch to kick off the release pipelines.


    In this MLOps architecture, we use AWS Elastic Container Registry (ECR) as the
    central container registry service. ECR is used to store containers for data processing,
    model training, and model inference. You can tag the container images to indicate
    different life cycles, such as development or production.


    **The SageMaker model registry** is used as the central model repository. The
    central repository can reside in the shared services environment, so it can be
    accessed by different projects. All the models that go through the formal training
    and deployment cycles should be managed and tracked in the central model repository.


    **SageMaker Feature Store** provides a common feature repository for reusable
    features to be used by different projects. It can reside in part of the data platform.
    Features are normally pre-calculated in a data management environment and sent
    to SageMaker Feature Store for offline training in the model training environment,
    as well as online inferences by the different model hosting environments.


    **SageMaker Experiments** is used to track experiments and trials. The metadata
    and artifacts that are generated by the different components in a pipeline execution
    can be tracked in SageMaker Experiments. For example, the processing step in a
    pipeline can contain metadata such as the locations of input data and processed
    data, while the model training step can contain metadata such as the algorithm
    and hyperparameters for training, model metrics, and the location of the model
    artifact. This metadata can be used to compare the different runs of model training,
    and they can also be used to establish model lineage.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# # Monitoring and logging


    The ML platform presents some unique challenges in terms of monitoring. In addition
    to monitoring common software system-related metrics and statuses, such as infrastructure
    utilization and processing status, an ML platform also needs to monitor model
    and data-specific metrics and performances. Also, unlike fairly straightforward
    traditional system-level monitoring, the opaqueness of ML models makes it inherently
    difficult to understand the system. Now, let''s take a closer look at the three
    main areas of monitoring for an ML platform.


    # ## Model training monitoring


    Model training monitoring provides visibility into the training progress and helps
    identify bottlenecks and error conditions during the training process. It enables
    operational processes such as training job report and response, model training
    performance evaluation and response, training problem troubleshooting, and data
    and bias detection and model interpretability and response. Specifically, we want
    to monitor the following key metrics and conditions during model training:


    +   - **General system and resource utilization and error metrics**: These provide
    visibility into how the infrastructure resources (such as CPU, GPU, I/O, and memory)
    are utilized for model training. These can help with making decisions on provisioning
    infrastructure for the different model training needs.

    - **Training job events and status**: This provides visibility into the progress
    of a training job, such as job starting, running, completion, and failure details.

    - **Model training metrics**: These are model training metrics such as curve and
    accuracy reports to help you understand the model''s performance.

    - **Bias detection metrics and model explainability reporting**: These metrics
    help you understand if there is any bias in the training datasets or machine learning
    models. Model explainability can also be monitored and reported to help you understand
    high-importance features versus low-importance features.

    - **Model training bottlenecks and training issues**: These provide visibility
    into training issues such as vanishing gradients, poor weights initialization,
    and overfitting to help determine the required data, algorithmic, and training
    configuration changes. Metrics such as CPU and I/O bottlenecks, uneven load balancing,
    and low GPU utilization can help determine infrastructure changes for more efficient
    model training.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'There are multiple native AWS services for building out a model training architecture
    on AWS. The following diagram shows an example architecture for building a SageMaker-based
    model training environment:


    ![](img/bd21298357d8484151447cff0b2f138b_298_0.png)


    ### Figure 9.4 – Model training monitoring architecture


    This architecture lets you monitor training and system metrics and perform log
    capture and processing, training event capture and processing, and model training
    bias and explainability reporting. It enables operation processes, such as training
    progress and status reporting, model metric evaluation, system resource utilization
    reporting and response, training problem troubleshooting, bias detection, and
    model decision explainability.


    During model, SageMaker can emit model training metrics, such as training loss
    and accuracy, to AWS CloudWatch to help with model evaluation. AWS CloudWatch
    is the monitoring and observability service. It collects metrics and logs from
    other AWS services and provides dashboards for visualizing and analyzing these
    metrics and logs. System metrics (such as CPU/GPU/memory utilization) are also
    reported to CloudWatch for analysis to help you understand any infrastructure
    constraints or under-utilization. CloudWatch alarms can be created for a single
    metric or composite metrics to automate notifications or responses. For example,
    you can create alarms on low CPU/GPU utilization to help proactively identify
    sub-optimal hardware configuration for the training job. When an alarm is triggered,
    it can send automated notifications (such as SMS and emails) to support for review
    via AWS Simple Notification Service (SNS).'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'You can use CloudWatch Logs to collect, monitor, and analyze the logs that
    are emitted by your training jobs. You can use these captured logs to understand
    the progress of your training jobs and identify errors and patterns to help troubleshoot
    any model training problems. For example, the CloudWatch Logs might contain errors
    such as insufficient GPU memory to run model training or permission issues when
    accessing specific resources to help troubleshoot model training problems. By
    default, CloudWatch provides a UI tool CloudWatch Insights for interactively analyzing
    logs using a purpose-built query language. Alternatively, these logs can be forwarded
    to an Elasticsearch cluster for analysis and querying. These logs be aggregated
    in a designated logging and monitoring account to centrally manage log access
    and analysis.


    SageMaker training jobs can also send events, as a training job status changing
    from running to complete. You can create automated notification and response mechanisms
    based on these events. For example, you can send notifications to data scientists
    when a training job is either completed successfully or failed, along with a failure
    reason. You can also automate responses to these failures to the different statuses,
    such as model retraining on a particular failure condition.


    The SageMaker Clarify component can detect data and model bias reporting on the
    trained model. You can access bias and model explainability reports using the
    SageMaker Studio UI or SageMaker APIs.


    The SageMaker Debugger component can detect model training issues such as non-converging
    conditions, resource utilization bottlenecks, overfitting, vanishing gradients,
    or conditions where the gradients become too small for efficient parameter updates.
    Alerts can be sent when training anomalies are found.


    # Model endpoint monitoring


    Model endpoint monitoring provides visibility into the performance of the modeling
    serving infrastructure, as well as model-specific metrics as data drift, model
    drift, and inference explainability. The following are some of the key metrics
    for model endpoint monitoring:


    +   * **General system and resource utilization and error metrics**: These provide
    visibility into how the infrastructure resources (such as CPU, GPU, and memory)
    are utilized for model serving. These can help with making decisions on provisioning
    infrastructure for the different model serving needs.


    +   * **Data monitoring metrics**: The statistical nature of data could change
    over time, which can result in degraded ML model performance from the original
    benchmarks. These metrics can include basic statistics deviations as provide mean
    and standard changes, as well as data distribution changes.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '+   - Model quality monitoring metrics: These model quality metrics provide
    visibility into model performance deviation from the original benchmark. These
    metrics can include regression metrics (such as MAE and RMSE) and classification
    metrics (such as confusion matrix, F1, precision, recall, and accuracy).


    +   - Model inference explainability: This model provides explainability on a
    prediction basis to help you understand what features had the most influence on
    the decision that was made by the prediction.


    +   - Model bias monitoring metrics: Similar to bias detection for training, the
    bias metrics help us understand model bias at inference time.


    The model monitoring architecture relies on many of the same AWS services, including
    CloudWatch, EventBridge, and SNS. The following diagram shows an architecture
    pattern for a SageMaker-based model solution:


    ![](img/bd21298357d8484151447cff0b2f138b_300_0.png)'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'This architecture works similarly to the model training architecture. **CloudWatch
    metrics** capture endpoint metrics such as CPU/GPU utilization and invocation
    metrics (number of invocations and errors) and model latencies. These metrics
    help with operations such as hardware optimization and endpoint scaling.


    **CloudWatch Logs** captures logs that are emitted by the model serving endpoint
    to help us understand the status and troubleshoot technical problems.


    Similarly, endpoint events, such as the status changing from **Creating** to **InService**,
    can help you build automated notification pipelines to kick off corrective actions
    or provide status updates.


    In addition to system and status-related monitoring, this architecture also supports
    data and model-specific monitoring through a combination of SageMaker Model Monitor
    and SageMaker Clarify. Specifically, SageMaker Model Monitor can help you monitor
    data drift and model quality.


    For data drift, SageMaker Monitor can use the training dataset to create baseline
    statistics such as standard deviation, mean, max, min, and data distribution for
    the dataset features. It uses these metrics and other data characteristics, such
    as data types and completeness, to establish constraints. Then, it captures the
    input data in the production environment, calculates the metrics, compares them
    with the baseline metrics/constraints, and reports baseline drifts. Data quality
    issues such as incorrect data types and missing values. Data drift metrics can
    be sent to CloudWatch metrics for visualization and analysis, and CloudWatch Alarms
    can be configured to trigger a notification or automated response when a metric
    crosses a predefined threshold.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'For model quality monitoring, it creates baseline metrics (such as MAE for
    regression and accuracy for classification) using the dataset, which contains
    both predictions and true labels. Then, it captures the predictions in production,
    ingests truth labels, and merges the ground truth with the predictions to calculate
    various regression and classification metrics before comparing those with the
    baseline metrics. Similar to drift metrics, model quality metrics can be sent
    to CloudWatch Metrics for analysis and visualization, and CloudWatch Alarms can
    be configured for automated notifications and/or responses. The following diagram
    shows how SageMaker Model Monitor works:


    # Model Deployment and Monitoring for Drift


    ![](img/bd21298357d8484151447cff0b2f138b_302_0.png)


    Figure 9.6 – SageMaker Model Monitor process flow


    For bias detection, SageMaker Clarify can monitor bias metrics for deployed models
    continuously and raises alerts through CloudWatch when a metric crosses a threshold.
    We will cover bias detection detection in detail in Chapter 11, ML Governance,
    Bias, Explainability, and Privacy.'
  merge: -1
  img_proc: true
