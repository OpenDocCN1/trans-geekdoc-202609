    EKS cluster.


    # Part 1 – Installing Kubeflow


    You will continue to use the Amazon (EKS) infrastructure you created earlier and
    install Kubeflow on top of it. To start, complete the following steps:


    +   1. Launch AWS CloudShell: Log in to your AWS account, select the Oregon region,
    and launch AWS CloudShell again.

    2. Install the kfctl utility: The Kfctl utility is a command-line utility for
    installing and managing Kubeflow. Run the following commands one by one in the
    CloudShell environment to installkfctl!


    ```

    sudo yum search tar


    curl --silent --location "https://github.com/kubeflow/kfctl/releases/download/v1.2.0/kfctl_v1.2.0-0gbc38f9_linux.tar.gz"
    | tar xz -C /tmp


    chmod +x /tmp/kfctl

    \sudo mv /tmp/kfctl ./bin/kfctl

    ```'
