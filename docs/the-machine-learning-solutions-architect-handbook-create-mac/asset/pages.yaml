  md: 'In this architecture, an Amazon Bot is used to provide the text-based conversational
    interface for customer engagement. The customer uses the self-service chat portal
    to initiate the conversation and the chat portal integrates with the Lex bots
    via the Lex API.


    Lex bots support several different intents, such as looking up account info, update
    customer profile, and How do I return a purchase?


    Depending on the intent, the Lex bot will route the fulfillment requests to a
