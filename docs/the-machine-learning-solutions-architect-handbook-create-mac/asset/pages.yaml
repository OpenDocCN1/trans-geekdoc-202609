  md: '# # Post-trade settlement failure prediction


    After the front office executes a trade, several post-trade processes are involved
    to complete the trade, such as settlement and clearance. **Post-trade settlement**
    is the process where buyers and sellers compare trade details, approve the transaction,
    change records of ownership and arrange for cash to be transferred. Trade settlements
    are handled automatically using **straight-through processing**. However, some
    settlements fail due to various reasons, such as sellers failing to deliver securities,
    and brokers will need to use their reserves to complete the transaction. To ensure
    the so valuable capital can be used elsewhere, predicting settlement failure is
    critical.


    The following diagram shows the workflow for the trade where buyers and sellers
    buy their securities at exchange through their respective brokerage firms:


    ![](img/bd21298357d8484151447cff0b2f138b_48_0.png)


    Figure 2.5 - Trading workflow


    After the trade is executed, a clearing house such as DTCC would handle the clearance
    and settlement of the trades with the respective custodians for the buyer and
    sellers.


    To ensure the right amount of stockpile reserve is maintained to reduce capital
    expenditure cost and optimize the buyer and sellers'' transaction rates, brokerage
    houses have been using ML models to predict trade failure early in the process.
    This allows the broker to take preventive or corrective actions.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Risk management and fraud


    Risk management and fraud are part of the back office operations of financial
    services firms, including investment banks and commercial banks, and they are
    one of the top areas for ML adoption in financial services due to their large
    financial and regulatory impact.


    There are many kinds of fraud and risk management cases for ML, such as anti-money
    laundering, trade surveillance, credit card transaction fraud, and insurance claim
    fraud. Let''s take a look at few of them.


    # Anti-money laundering


    **Anti-money laundering (AML)** is a set of laws and regulations that have been
    established to prevent criminals from legitimizing illegally obtained funds through
    complex financial transactions. Under these laws and regulations, financial institutions
    are required to help detect activities that aid illegal money laundering. Financial
    services companies develop substantial amounts of financial, technical, and people
    resources to combat AML activities. Traditionally, companies have been using rule-based
    systems to detect AML activities. However, rule-based systems usually have a limited
    view as it is challenging to include a large number of features to be evaluated
    in a rule-based system. Also, it is hard to keep the rules up to date with new
    changes; a rule-based solution can only detect well-known frauds that have happened
    in the past.


    Machine learning-based solutions have been used in multiple areas of AML, such
    as the following:


    +   * Network link analysis to reveal the complex social and business relationships
    among different entities and jurisdictions.


    +   * Clustering analysis to find similar and dissimilar entities to spot trends
    in criminal activity patterns.


    +   * Deep learning-based predictive analytics to identify criminal activity.


    +   * NLP to gather as much information as possible for the vast number of entities
    from unstructured data sources.'
  merge: -1
  img_proc: true
- pgno: 50
