- pgno: 378
  md: '5. Next, we must wrap the privacy engine around the model and optimizer and
    kick off the training process:


    ```

    from opacus import PrivacyEngine

    net = get_CHURN_model()

    optimizer = optim.Adam(net.parameters(),

    weight_decay=0.0001, lr=0.003)

    privacy_engine = PrivacyEngine(

    net,

    max_grad_norm=max_per_sample_grad_norm,

    noise_multiplier = noise_multiplier,

    sample_rate = sample_rate,

    )

    privacy_engine.attach(optimizer)

    model = train(trainloader, net, optimizer, batch_size)

    ```


    If you compare the training loss with the losses you observed earlier without
    the privacy engine, you will notice some small degradations in the losses across
    all epochs.


    6. Now, let''s measure the potential privacy loss with this model:


    ```

    epsilon

    ```


    You will see values for ε and δ. As we discussed earlier, ε is the privacy loss
    budget, the probability that output can change by adding or removing one record
    from the training data. δ is the probability of failure that information is accidentally
    leaked.


    Congratulations! You have successfully used SageMaker to detect data and model
    bias, explain feature importance for a model, and trained a model using differential
    privacy. All these capabilities are highly relevant to ML governance.'
