    default-editor


    +   **Multi-tenancy:** Keflow allows multiple users to access the same Keflow
    environment with support for resource isolation by users (for example, resources
    such as notebook servers). It does this by creating a separate namespace for each
    user, and it uses Kubernetes RBAC and Istio RBAC to control access to the different
    namespaces and their resources. For team-based collaboration, the owner of a namespace
    can grant other users access to the namespace directly by using the **Manage Contributor**
    function inside the Keflow dashboard UI.


    To add a new Keflow user, you create a new user profile, in turn creates a new
    namespace for the profile. The following YAML file, once applied using `kubectl`,
    creates a new user profile called test-user with an email of test-user@kubeflow.org,
    and it also creates a new namespace called test-user:


    ```

    apiVersion: kubeflow.org/v1beta1

    metadata:

    name: test-user

    spec:

    owner:

    kind: User

    name: test-user@kubeflow.org

    ```


    You can run kubectl get profiles and kubectl get namespaces commands to verify
    that the profile and namespaces have been created.


    After a user is created and added to the Keflow Dex authentication service, the
    new user can log in to the Keflow dashboard and access the Kubeflow resources
    (such as a Jupyter notebook server) under the newly created namespace.


    Now we reviewed how Kubeflow can be used to provide a multi-user Jupyter notebook
