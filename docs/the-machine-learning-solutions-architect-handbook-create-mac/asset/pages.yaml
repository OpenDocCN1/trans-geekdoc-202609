- pgno: 178
  md: 'A Kubernetes operator is a controller that operates on a custom resource. The
    operator watches the CR types and takes specific actions to make the current state
    match the desired state, just like a built-in controller does. For example, if
    you want to create a training job for the training job CRD mentioned previously,
    you create an operator that monitors training job requests and performs application-specific
    actions to start up the Pods and run the training job throughout the life cycle.
    The following figure (Figure 6.5) shows the components involved with an operator
    deployment:


    ![](img/bd21298357d8484151447cff0b2f138b_178_0.png)


    Figure 6.5 – A Kubernetes custom resource and its interaction with the operator


    The most common way to deploy an operator is to deploy a CR definition and the
    associated controller. The controller runs outside of the Kubernetes control plane,
    similar to running a containerized application in a Pod.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Networking on Kubernetes


    Kubernetes operates a flat private network among all the resources in a Kubernetes
    cluster. Within a cluster, all Pods can communicate with each other cluster-wide
    without a network address translation (NAT). Kubernetes gives each Pod its own
    cluster private IP address, and the IP is the same seen by the Pod itself and
    what others see it. All containers inside a single Pod can reach each other''s
    port on the localhost. All nodes in a cluster have their individually assigned
    IPs and can communicate with all Pods without a NAT. The following figure (Figure
    6.6) shows the different IP assignments for Pods and nodes, and communication
    flows from different resources:


    # Cluster


    ![](img/bd21298357d8484151447cff0b2f138b_179_0.png)


    Figure 6.6 – IP assignments and communication flow'
  merge: -1
  img_proc: true
- pgno: 180
  md: "Sometimes you might need a set of Pods running the same application container\
    \ (for an Nginx application) for high availability and load balancing, for example.\
    \ Instead of calling each Pod by its IP address to access the application running\
    \ in a Pod, you want to create an abstraction layer for this set of Pods, and\
    \ this abstraction layer can dynamically send traffic to each Pod behind it. In\
    \ this case, you can create a Kubernetes Service as an abstraction layer for a\
    \ logical set of Pods. A Kubernetes Service can dynamically select the Pod behind\
    \ it by matching an app label for the Pod using a Kubernetes feature selector.\
    \ The following example shows the specification that would create a service called\
    \ nginx-service that sends traffic to Pods with the app nginx label on port 9376.\
    \ A service is also assigned with its own cluster IP address, so it is reachable\
    \ by other resources inside a cluster:\n\n```\napiVersion: v1\nkind: Service\n\
    metadata:\n  name: nginx-service\nspec:\n  selector:\n    app: nginx\n  ports:\n\
    \    - protocol: TCP\n      port: 80\n      targetPort: 9376\n```\n\nIn addition\
    \ to using selector to automatically detect Pods behind the service, you can also\
    \ manually create an Endpoint and map a fixed IP and port to a service, as shown\
    \ in the following example:\n\n```\napiVersion: v1\nkind: Endpoints\nmetadata:\n\
    \  name: nginx-service\nsubsets:\n  - addresses:\n    - ip: 192.0.2.42\n    ports:\n\
    \    - port: 9376\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: 'While nodes, Pods, and services are all assigned with cluster private IPs,
    these IPs are not routable from outside of a cluster. To access Pods or services
    from outside of a cluster, you have the following options:


    +   * Access from a node or Pod: You can connect to the shell of a running Pod
    using the `kubectl exec` command, and access other Pods, nodes, and services from
    the shell.

    * Kubernetes Proxy: You can access services by running the `kubectl proxy --port=<port
    number>` command on your local machine. Once the proxy is running, you can access
    nodes, Pods, or services. For example, you can access a service using the following
    scheme:


    ```

    http://localhost:<port number>/api/v1/proxy/

    namespaces/<NAMESPACE>/services/<SERVICE NAME>:<PORT

    NAME>

    ```


    +   * NodePort: NodePort opens a specific port on all the worker nodes, and any
    traffic sent to this port on the IP address of any of the nodes is forwarded to
    the service behind the port. The nodes'' IPs need to be routable from external
    sources. The following figure (Figure 6.7) shows the communication flow using
    NodePort:


    ![](img/bd21298357d8484151447cff0b2f138b_181_0.png)


    Figure 6.7 – Accessing Kubernetes Service via NodePort'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'NodePort is simple to use, but it has some limitations, such as one service
    per NodePort, a fixed port range to use (3000 to 32767), and you need to know
    the IPs of individual worker nodes.


    +   Load balancer: A load balancer is a standard way to expose services to the
    internet. With a load balancer, you get a public IP address that is accessible
    to the internet, and all traffic sent to the IP address will be forwarded to the
    service behind the load balancer. A load balancer is not part of Kubernetes and
    it is provided by whatever cloud infrastructure a Kubernetes cluster resides on
    (for example, AWS). The following figure (Figure 6.8) shows the communication
    flow from a load balancer to services and Pods:


    ![](img/bd21298357d8484151447cff0b2f138b_182_0.png)


    Figure 6.8 – Accessing a Kubernetes service via a load balancer'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'A load balancer allows you to choose the exact port to use and can support
    multiple ports per service. However, it does require a separate load balancer
    per service.


    +   - Ingress: An Ingress gateway is the entry point to a cluster. It acts as
    a load balancer and routes incoming traffic to the different services based on
    routing rules.


    ![](img/bd21298357d8484151447cff0b2f138b_183_0.png)


    Figure 6.9 – Accessing a Kubernetes service via Ingress


    An Ingress is different from a load balancer and NodePort in that it acts as a
    proxy to manage traffic to clusters. It works with the NodePort and load balancer
    and routes the traffic to the different services. The Ingress way is becoming
    more commonly used, especially in combination with a load balancer.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Service mesh


    In addition to network traffic management from outside of the cluster, another
    important aspect of Kubernetes network management is to control the traffic flow
    between different Pods and services within a cluster. For example, you might want
    to allow certain traffic to access a Pod or service while denying traffic from
    other sources. This is especially important for applications built on microservices
    architecture, as there could be many services or Pods that need to work together.
    Such a network of microservices is also called a service mesh. As the number of
    services grows large, it becomes challenging to understand and manage the networking
    requirements, such as service discovery, network metrics, and failure recovery.
    Istio is an open source mesh management software that makes it easy to manage
    a large service mesh on Kubernetes, and it provides the following core functions:


    +   - Istio provides an Ingress gateway that can be used to expose Pods and services
    a service mesh to the internet. It acts as a load balancer that manages the inbound
    and outbound traffic for the service mesh. A gateway only allows traffic to come
    in/out of a service mesh - it does not routing of the traffic. To route traffic
    from the gateway to service the service mesh, you create an object called Virtual
    Service to provide routing rules to route incoming traffic to different destinations
    inside a cluster, and you create a binding between virtual services and the gateway
    object to connect the two.


    +   - Network traffic management: Istio provides easy rule-based network routing
    to control the flow of traffic and API calls between different services. When
    Istio is installed, it automatically detects services and endpoints in a cluster.
    Istio uses an object called Virtual Service to provide routing rules to route
    incoming traffic to different destinations inside a cluster. Istio uses a load
    balancer to manage the inbound and outbound traffic for the network mesh. The
    gateway load balancer only allows traffic to come in/out of a mesh - it does not
    routing of the traffic. To route traffic from the gateway, you create a binding
    between virtual services and the gateway object.


    In order to manage the traffic in and out of a Pod, an Envoy proxy component (aka
    sidecar) is injected into a Pod, and it intercepts and decides how to route all
    traffic. The Istio component that manages the traffic configurations and service
    discovery is called the Pilot. The Citadel component manages authentication for
    service to and end user. The Gallery component is responsible for insulating for
    Istio components from the underlying Kubernetes infrastructure. The following
    figure shows the architecture of Istio on Kubernetes:'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Cluster


    Figure 6.10 - Istio architecture


    +   * **Security**: Istio provides authentication and authorization for inter-service
    communications.

    * **Observability**: Istio captures metrics, logs, and traces of all service communications
    within a cluster. Examples of metrics include network latency, errors, and saturation.
    Examples of traces include call flows and service dependencies within a mesh.


    Istio can handle a wide range of deployment needs, such as load balancing and
    service-to-service authentication. It can even extend to other clusters.


    # Security and access management


    Kubernetes has many built-in security features. These security features allow
    you to implement fine-grained network traffic control and access control to different
    Kubernetes APIs and services. In this section, we will discuss network security,
    authentication, and authorization.'
  merge: -1
  img_proc: true
- pgno: 186
  md: "# Network security\n\nBy default, Kubernetes allows all Pods in a cluster to\
    \ communicate with each other. To prevent unintended network traffic among different\
    \ Pods, **network policies** can be established to specify how Pods can communicate\
    \ with each other. You can think of a network policy as a network firewall that\
    \ contains a list of allowed connections. Each network policy has a `podSelector`\
    \ field, which selects a group of Pods enforced by the network policy and the\
    \ allowed traffic direction (ingress or egress). The following policy denies all\
    \ ingress to all Pods, as there are no specific ingress policies defined:\n\n\
    ```\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name:\
    \ default-deny-ingress\nspec:\n  podSelector: {}\n  policyTypes:\n  - Ingress\n\
    ```\n\nNetwork traffic is allowed if there is at least one policy that allows\
    \ it.\n\n# Authentication and authorization to APIs\n\nAccess to Kubernetes APIs\
    \ can be authenticated and authorized for both users and Kubernetes **service\
    \ accounts** (a service account provides an identity for processes running in\
    \ a Pod).\n\nUsers are handled outside of Kubernetes, and there are a number of\
    \ user authentication strategies for Kubernetes:\n\n+   - **X.509 client certificate**:\
    \ A signed certificate is sent to the API server for authentication. The API server\
    \ verifies this with the certificate authority to validate the user.\n- **Single\
    \ sign-on with OpenID Connect (OIDC)**: The users authenticate with the OIDC provider\
    \ and receive a bearer token (**JSON Web Token (JWT)**) that contains information\
    \ about the user. The user passes the bearer token to the API server, which verifies\
    \ the validity of the token by checking certificate in the token.\n- **HTTP basic\
    \ authentication**: HTTP basic authentication requires a user ID and password\
    \ to be sent as part of the API request, and it validates the user ID and password\
    \ against a password file associated with the API server."
  merge: -1
  img_proc: true
- pgno: 187
  md: "Service accounts are used to provide identity for processes running in a Pod.\
    \ They are created and managed by Kubernetes. Service accounts reside within a\
    \ namespace, by default. There is also a default service account in each namespace.\
    \ If a Pod is not assigned a service account, the default service account will\
    \ be assigned to the Pod. A service account has an associated authentication token,\
    \ saved as a Kubernetes Secret, and used for API authentication. A Kubernetes\
    \ Secret is used for storing sensitive information such as passwords, authentication\
    \ tokens, and SSH keys. We will cover secrets in more detail later in this chapter.\n\
    \nAfter a user service account is authenticated, the request needs to be authorized\
    \ to perform allowed operations. Kubernetes authorizes authenticated requests\
    \ using the API server in the control plane, and it has several modes for authorization:\n\
    \n+   - Attribute-based access control (ABAC): Access rights are granted to users\
    \ through policies. Note that every service account has a corresponding username.\
    \ The following sample policy allows the joe user access to all APIs in all namespaces.\n\
    \nThe following policy allows the system:serviceaccount:kube-system:default service\
    \ account access to all APIs in all namespaces:\n\n```\n{\n  \"apiVersion\": \"\
    abac.authorization.kubernetes.io/v1\",\n  \"kind\": \"Policy\",\n```"
  merge: -1
  img_proc: true
- pgno: 188
  md: "```\n\"spec\": {\n  \"user\": \"system:serviceaccount:kube-system:default\"\
    ,\n  \"namespace\": \"*\",\n  \"resource\": \"*\",\n  \"apiGroup\": \"*\"\n}\n\
    ```\n\n+   - **Role-based access control (RBAC):** Access rights are granted based\
    \ on the role\nof a user. RBAC utilizes using the rbac.authorization.k8s.io API\n\
    group. The RBAC API works with four Kubernetes objects: Role, ClusterRole,\nRoleBinding,\
    \ and ClusterRoleBinding.\n\nRole and ClusterRole contain a set of permissions.\
    \ The permissions are additive,\nmeaning there are no deny permissions, and you\
    \ need to explicitly add permission to\nresources. The Role object is namespaced\
    \ and is used to specify permissions within a\nnamespace. The ClusterRole object\
    \ is non-namespaced, but can be used for granting\npermission for a given namespace\
    \ or cluster-scoped permissions. The following yaml file\nprovides get, watch,\
    \ and list access to all Pods resources in the default namespace for the\ncore\
    \ API group:\n\n```\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n\
    \  namespace: default\n  name: pod-reader\nrules:\n  - apiGroups: [\"\"]\n   \
    \ resources: [\"pods\"]\n    verbs: [\"get\", \"watch\", \"list\"]\n```\n\nThe\
    \ following policy allows get, watch, and list access for all Kubernetes nodes\
    \ across the\ncluster.\n\n```\napiVersion: rbac.authorization.k8s.io/v1\nkind:\
    \ ClusterRole\nmetadata:\n  name: nodes-reader\nrules:\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "RoleBinding and ClusterRole grant permissions defined in a Role or ClusterRole\
    \ object to a user or set of users with reference to a Role or ClusterRole object.\
    \ The following policy binds the joe user to the pod-reader role:\n\n```\napiVersion:\
    \ rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: read-pods\n\
    \  namespace: default\nsubjects:\n  - kind: User\n  name: joe\n  apiGroup: rbac.authorization.k8s.io\n\
    roleRef:\n  kind: Role\n  name: pod-reader\n  apiGroup: rbac.authorization.k8s.io\n\
    ```\n\nThe following RoleBinding object binds a service account, SA-name, to the\
    \ ClusterRole nodes-reader:\n\n```\napiVersion: rbac.authorization.k8s.io/v1\n\
    kind: ClusterRoleBinding\nmetadata:\n  name: read-secrets-global\nsubjects:\n\
    \  - kind: ServiceAccount\n  name: SA-name\n  namespace: default\nroleRef:\n \
    \ kind: ClusterRole\n  name: secret-reader\n  apiGroup: rbac.authorization.k8s.io\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 190
  md: "Kubernetes has a built-in feature for storing and managing sensitive information\
    \ such as passwords. Instead of storing this sensitive information directly in\
    \ plain text in a Pod, you can store this information as Kubernetes Secrets, and\
    \ provide specific access to them using Kubernetes RBAC to create and/or read\
    \ secrets. By default, secrets are stored as unencrypted plain-text Base64-encoded\
    \ strings, and data encryption at rest can be enabled for the secrets. The following\
    \ policy shows how to create a secret for AWS access credentials.\n\n```\napiVersion:\
    \ v1\nkind: Secret\nmetadata:\n  name: aws-secret\ntype: Opaque\ndata:\n  AWS_ACCESS_KEY_ID:\
    \ XXXX\n  AWS_SECRET_ACCESS_KEY: XXXX\n```\n\n+   - As environment variables in\
    \ the Pod specification template:\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n\
    \  name: secret-env-pod\nspec:\n  containers:\n    - name: mycontainer\n     \
    \ image: redis\n      env:\n        - name: SECRET_AWS_ACCESS_KEY\n          valueFrom:\n\
    \            secretKeyRef:\n              name: aws-secret\n              key:\
    \ AWS_ACCESS_KEY_ID\n        - name: SECRET_AWS_SECRET_ACCESS_KEY\n```"
  merge: -1
  img_proc: true
- pgno: 191
  md: "```\nvalueFrom:\n  secretKeyRef:\n    name: aws-secret\n    key: AWS_SECRET_ACCESS_KEY\n\
    restartPolicy: Never\n```\n\nThe application code inside the container can access\
    \ the secrets just like other environment variables.\n\n+   As a file in a volume\
    \ mounted on a Pod:\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: pod-ml\n\
    spec:\n  containers:\n    - name: pod-ml\n      image: <Docker image uri>\n  \
    \  volumeMounts:\n      - name: vol-ml\n        mountPath: \"/etc/aws\"\n    \
    \    readOnly: true\nvolumes:\n  - name: vol-ml\n    secret:\n      secretName:\
    \ aws-secret\n```\n\nIn the previous examples, you will see files in the /etc/aws\
    \ folder for each corresponding secret name (such as SECRET_AWS_ACCESS_KEY) that\
    \ contains the values for the secrets.\n\n# Running ML workloads on Kubernetes\n\
    \nWe now know what containers are and how they can be deployed on a Kubernetes\
    \ cluster. We also know how to configure networking on Kubernetes to allow Pods\
    \ to communicate with each other and how to expose a Kubernetes container for\
    \ external access outside of the cluster using different networking options."
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Kubernetes can function as the foundational infrastructure for running ML workloads.
    For example, you can run a Jupyter Notebook as a containerized application on
    Kubernetes as your data science environment for experimentation and model building.
    You can also run a model job as a Kubernetes Job if you need additional resources,
    and then serve the model as a containerized web service application or run batch
    inferences on trained models as a Kubernetes Job. In the following hands-on exercise,
    you will learn how to use Kubernetes as the foundational infrastructure for running
    ML workloads.


    # Hands-on – creating a Kubernetes infrastructure on AWS


    In this section, you will create a Kubernetes environment using the Amazon EKS.
    Let’s first look at the problem statement in the following section.


    # Problem statement


    As a ML solutions architect, you have been tasked to evaluate Kubernetes as a
    potential infrastructure platform for building an ML platform for one business
    unit in your bank. You need to build a sandbox environment on AWS and demonstrate
    that you can deploy a Jupyter Notebook as a containerized application for your
    data scientists to use.


    # Lab instruction


    In this hands-on exercise, you are going to create a Kubernetes environment using
    the Amazon EKS. The EKS is a managed service for Kubernetes on AWS that creates
    and configures a Kubernetes cluster with both master and worker nodes automatically.
    The EKS provisions and scales the control plane, including the API server and
    backend persistent layer. The EKS runs the open source Kubernetes and is compatible
    with all Kubernetes-based applications.


    After the EKS cluster is created, you will explore the EKS environment to inspect
    some of its core components, and then you will learn to deploy a containerized
    Jupyter Notebook and make it accessible from the internet.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Let''s complete the following steps to get started:


    +   1. Launch the AWS CloudShell service.


    Log on to your AWS account, select the Oregon region, and launch the AWS CloudShell.
    CloudShell is an AWS service that provides a browser-based Linux terminal to interact
    with AWS resources. With CloudShell, you authenticate using your AWS console credential
    and can easily run AWS CLI, AWS SDK, and other tools.


    +   2. Install the kubectl utility.


    Run the following commands one by one in the CloudShell terminal. The kubectl
    utility is a command-line utility for managing the EKS cluster. We will use the
    kubectl utility to create a Kubernetes cluster on Amazon EKS in Step 4:


    ```

    curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname
    -s)_amd64.tar.gz"

    tar z -x -C /tmp

    ```


    ```

    chmod +x /tmp/kubectl

    ```


    ```

    sudo mv /tmp/kubectl /bin/kubectl

    ```


    ```

    export PATH=$PATH:/home/cloudshell-user/bin

    ```


    +   3. Install the AWS IAM Authenticator.


    Inside the CloudShell service, run the following commands one by one to download
    the AWS IAM Authenticator software. The AWS IAM Authenticator authenticates to
    the Kubernetes cluster running on Amazon EKS with your AWS credential:


    ```

    curl -o aws-iam-authenticator https://amazon-eks.s3.us-west-2.amazonaws.com/1.19.6/2021-01-05/bin/linux/amd64/aws-iam-authenticator

    ```


    ```

    chmod +x ./aws-iam-authenticator

    ```


    ```

    sudo mv aws-iam-authenticator /bin/aws-iam-authenticator

    ```'
  merge: -1
  img_proc: true
- pgno: 194
  md: '+   4. Build a new EKS cluster.


    Run the following command to start creating an EKS cluster in the Oregon region
    inside your AWS account. It will take about 15 minutes to complete running the
    setup.


    ```

    eksctl create cloudformation template

    ```


    The command will launch a cloudformation template and this will create the following
    resources:


    +   A. An Amazon EKS cluster with two worker nodes inside a new Amazon virtual
    private cloud (VPC). Amazon EKS provides fully managed Kubernetes master nodes,
    so you won''t see the master nodes inside your private VPC.


    +   B. An EKS cluster configuration file saved in the /home/cloudshell-user/.kube/config
    directory on CloudShell. The file contains details such as the API server url
    address name of the admin for managing the cluster, and the client certificate
    for authenticating to the Kubernetes cluster. kubectl uses information in the
    config file to connect and authenticate to the Kubernetes API server.


    +   C. EKS organizes worker nodes into logical groups named nodegroup. Run the
    following command to look up the nodegroup name. You can look up the name of the
    cluster in the EKS management console. The name of the node group should look
    something like ng-xxxxxxxxx.


    ```

    eksctl get nodegroup --cluster=<cluster name>

    ```


    +   5. Install the kubectl.


    Run the following commands to download the kubectl utility:


    ```

    curl -LO "https://storage.googleapis.com/kubernetes-release/release/$(curl -s
    https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl"

    chmod +x ./kubectl

    sudo mv ./kubectl /bin/kubectl

    ```


    +   6. Explore the cluster.'
  merge: -1
  img_proc: true
