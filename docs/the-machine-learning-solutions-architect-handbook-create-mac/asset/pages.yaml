- pgno: 306
  md: 'For large-scale and governed IT product management, Service Catalog is the
    recommended approach. Service Catalog supports multiple deployment options, including
    single AWS account deployments and hub-and-spoke cross-account deployments. A
    hub-and-spoke deployment allows you to centrally manage all the products and make
    them available in different accounts. In our enterprise ML reference architecture,
    we use the hub-and-spoke architecture to support the provisioning of data science
    environments and ML pipelines, as shown in the following diagram:


    ![](img/bd21298357d8484151447cff0b2f138b_306_0.png)


    Figure 9.9 – The hub-and-spoke Service Catalog architecture for enterprise ML
    product management. In the preceding architecture, we use the central portfolio
    in the shared services account. All the products, as creating New Studio domains,
    New Studio user profiles, CodePipeline definitions, and training pipeline definitions,
    are centrally managed in the central hub account. Some products are shared with
    the different data science accounts to create data science environments for scientists
    and teams. Some other products are shared with model training accounts for standing
    up ML training pipelines.


    With that, we have talked about the core components of an enterprise-grade ML
    platform. Next, let''s get hands-on and build a pipeline to automate model training
    and deployment.'
  merge: -1
  img_proc: true
