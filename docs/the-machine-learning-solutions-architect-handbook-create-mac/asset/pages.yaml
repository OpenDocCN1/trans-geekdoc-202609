- pgno: 161
  md: '# Understanding the PyTorch deep learning library


    PyTorch is an open source machine learning library that was designed for deep
    learning using GPUs and CPUs. It was released in 2016, and it is a highly popular
    machine learning framework with a large following and many adopts. Many technology
    companies, including tech giants such as Facebook, Microsoft, and Airbnb, use
    PyTorch heavily for a wide range of deep learning cases, such as computer vision
    and natural language processing.


    PyTorch strikes a good balance of performance (using a C++ backend) with ease
    of use with default support for dynamic computational graphs and interoperability
    with the rest of the Python ecosystem. For example, with PyTorch, you can easily
    convert between NumPy arrays and PyTorch tensors. To allow for easy back propagation,
    PyTorch has built-in support for automatically computing gradients, a vital requirement
    for gradient-based model optimization.


    The PyTorch library consists of several key modules, including tensors, Autograd,
    Optimizer, and Neural Network. Tensors are used to store and operate multidimensional
    arrays of numbers. You can perform various operations on tensors such as matrix
    multiplication, transpose, return max number, and dimensionality manipulation.
    PyTorch supports automatic gradient calculation with its Autograd module. When
    performing a forward pass, the Autograd module builds up a function that computes
    the gradient. The Optimizer module provides various algorithms such as SGD and
    Adam for updating model parameters. The Neural Network module provides modules
    that represent different layers of a neural network such as the linear layer,
    embedding layer, and dropout layer. It also provides a list of loss functions
    that are commonly used for training deep learning models.


    # Installing PyTorch


    PyTorch can run on different operating systems, including Linux, macOS, and Windows.
    You can follow the instructions at https://pytorch.org/ to install it in your
    environment. For example, you can use the pip install torch command to install
    it in a Python-based environment.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Core components of PyTorch


    Similar to TensorFlow, PyTorch also supports the end-to-end machine learning workflow,
    from data preparation to model serving. The following diagram shows what different
    PyTorch modules are used to train and serve a PyTorch model:


    ![](img/bd21298357d8484151447cff0b2f138b_162_0.png)


    Figure 5.6 – PyTorch modules for model training and serving


    The steps involved in training a deep learning model are very similar to that
    of TensorFlow model training. We''ll look at the PyTorch-specific details in the
    following steps:


    +   1. **Preparing the dataset**: PyTorch provides two primitives for dataset
    and data management: `torch.utils.data.Dataset` and `torch.utils.data.Dataloader`.
    Dataset stores data samples and their corresponding labels, while Dataloader wraps
    around the dataset and provides easy and efficient access to the data for model
    training. Dataloader provides functions such as shuffle, `batch_size`, and `prefetch_factor`
    to control how the data is loaded and fed to the training algorithm.


    +   2. **Defining the neural network**: PyTorch provides a high-level abstraction
    for building neural networks with its `torch.nn` class provides built-in support
    for neural network layers such as linear and convolutional layers, as well as
    activation functions as Sigmoid and ReLU. It also has container classes as `nn.Sequential`
    for packaging different layers into a complete network. Existing neural networks
    can also be loaded into PyTorch for training.


    +   3. **Defining the loss function**: PyTorch provides several built-in loss
    functions in `torch.nn` class, such as `nn.MSELoss` and `nn.CrossEntropyLoss`.


    As in the dataset might need to be transformed before training is performed, Dataset
    allows you to use a user-defined function to transform the data.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '+   4. **Selecting the optimizer**: PyTorch provides several optimizers with
    its nn.optim classes. Examples of optimizers include optim.SGD, optim.Adam, and
    optim.RMSProp. All the optimizers have a step() that updates model parameters
    with each forward pass. There''s also a backward pass that calculates the gradients.


    +   5. **Selecting the evaluation metrics**: The PyTorch ignite.metrics class
    provides several evaluation metrics such as Precision, Recall, and RootMeanSquaredError
    for evaluating model performances. You can learn more about precision and recall
    at https://en.wikipedia.org/wiki/Precision_and_recall. You can also use the scikit-learn
    libraries to help evaluate models.


    +   6. **Training the model**: Training a model in PyTorch involves three main
    steps in each training loop: forward pass the training data, backward pass the
    training data to calculate the gradient, and performing the optimizer step to
    update the gradient.


    +   7. **Saving/loading the model**: The torch.save() function saves a model in
    a serialized pickle format. The torch.load() function loads a serialized model
    into memory for inference. A common convention is to save the files with the .pth
    or .pt extension. You can also save multiple models into a single file.


    +   8. **Model serving**: PyTorch comes with a model serving library called TorchServe,
    which we will cover in more detail Chapter 7, Open Source Machine Learning Platforms.


    The PyTorch library supports large-scale distributed data processing and model
    training, which we will cover in more detail in Chapter 10, Advanced ML Engineering.


    Now that you have learned about the fundamentals of PyTorch, let''s get hands-on
    through a simple exercise.'
  merge: -1
  img_proc: true
