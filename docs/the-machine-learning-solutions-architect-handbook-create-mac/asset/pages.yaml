    the built-in fashion_mnist dataset that comes with the keras library to load so.
    Next, we will load the data into a tf.data.Dataset class and then call its batch()
    function to set up a batch size. Run the following code block in a new cell to
    load the data and configure the dataset:

    ```python

    import numpy as np

    import tensorflow as tf

    tf.enable_eager_execution()


