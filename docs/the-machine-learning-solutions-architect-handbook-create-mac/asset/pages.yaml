- pgno: 254
  md: '# # SageMaker Studio


    SageMaker Studio is the data science integrated development environment (IDE)
    for SageMaker. It provides core features such as hosted notebooks for running
    experiments, as well as access to different backend services such as data wrangling,
    model training, and model hosting services from a single user interface. It is
    the main interface for data scientists to interact with SageMaker''s functionality.
    It also provides a Python SDK for interacting with its backends programmatically
    from Python notebooks or scripts. The following diagram shows the key components
    of SageMaker Studio:


    ![](img/bd21298357d8484151447cff0b2f138b_254_0.png)


    Figure 8.2 – SageMaker Studio architecture'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'To access the Studio environment, a user can either authenticate via AWS Management
    Console first (that is IAM mode) and navigate to the SageMaker management console
    to access Studio, or they can authenticate via the Studio environment''s single
    sign-on (SSO) interface without the need for AWS Management Console access.


    SageMaker Studio uses a concept called domain to segregate different environments.
    A domain is a collection of user profiles, where each profile provides specifications
    such as AWS IAM roles to use for Jupyter Notebook, notebook sharing configuration,
    and network settings for connecting to AWS. Once a user has been authenticated,
    the user is mapped to a user profile to launch the actual Studio environment.
    Inside the Studio environment, the user can create new notebooks using different
    ML kernels, such as Python, TensorFlow, or PyTorch. From inside Studio, the user
    will also have access to other SageMaker functionality such as Data Wrangler for
    data tracking, SageMaker Experiments for experiment tracking, SageMaker AutoPilot
    for automated ML model training, SageMaker Feature Store for feature management,
    and SageMaker Endpoints for hosted trained models.


    For each SageMaker domain, an Amazon Elastic File System (EFS) volume is created
    and attached to the domain. This EFS volume is used as data storage for all the
    user data in the domain. Each user profile is mapped to a directory in the EFS
    volume.


    The notebooks that are created in Studio will be backed by EC2 servers. SageMaker
    provides a wide range of CPU and GPU instances for notebooks. Users have the option
    to choose different EC2 server types based on their needs.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# SageMaker Processing


    SageMaker Processing provides a separate infrastructure for large-scale data processing
    such as data cleaning and feature engineering for large datasets. It can be accessed
    directly from a notebook environment via the SageMaker Python SDK or Boto3 SDK.
    SageMaker Processing uses Docker containers to run data processing jobs. Several
    built-in containers, such as scikit-learn and Spark containers, are provided out
    of the box. You also have the option to use your custom containers for processing.
    The following diagram shows the SageMaker Processing architecture:


    ![](img/bd21298357d8484151447cff0b2f138b_256_0.png)


    Figure 8.3 – SageMaker Processing architecture


    When a SageMaker Processing job is initiated, the processing container is pulled
    from Amazon ECR and loaded into the EC2 compute cluster. The data in S3 is copied
    over to the storage attached to the compute nodes for the data processing scripts
    to access and process. Once the processing procedure is completed, the output
    data is copied back to the S3 output location.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# SageMaker Training Service


    SageMaker Training Service provides a separate infrastructure for model training.

    SageMaker provides three main methods for model training:


    +   - SageMaker provides a list of built-in containerized algorithms for model
    training.

    With the built-in algorithm, you only need to provide training data stored in
    S3 and infrastructure specifications.

    - SageMaker provides a list of managed framework containers as containers for
    scikit-learn, TensorFlow, and PyTorch. With a managed framework container, in
    addition to providing data sources and infrastructure specifications, you also
    need to provide a training script that runs the model loop.

    - SageMaker allows you to bring your own custom container for model training.
    This container needs to contain the model training scripts, as well as the dependencies
    required to run the training loop.


    The following diagram shows the architecture of SageMaker Training Service:


    ![](img/bd21298357d8484151447cff0b2f138b_257_0.png)


    Figure 8.4 – SageMaker Training Service architecture


    You can use the AWS Moto3 SDK or the SageMaker Python SDK to kick off a training
    job.

    to run the training job, you need to provide configuration details such as the
    training Docker image''s URL, training script location, framework version, training
    dataset, and model output location, as well as infrastructure details such as
    the compute''s instance type and number, as well as networking details.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'By default, SageMaker tracks all training jobs and their associated metadata,
    such as algorithms, input training dataset URLs, hyperparameters, and output locations.
    Training jobs also emit system metrics and algorithm metrics to AWS CloudWatch
    for monitoring. Training logs are also sent to CloudWatch logs for inspection
    and analysis needs.


    SageMaker training jobs also allow you to integrate with the SageMaker debugger
    service. The debugger service allows the training job to capture additional details,
    such as system metrics (for example, CPU/GPU memory, network, and I/O metrics),
    deep learning framework metrics (for example, model training metrics at different
    neural network layers), and model training tensors (for example, model parameters)
    and save them to S3. Real-time debugger evaluation rules can be configured to
    monitor these states and send out alerts when they meet a certain threshold. Some
    examples of the built-in evaluation rules are vanishing gradients and model overfitting.


    # SageMaker Tuning


    To optimize the model''s performance, you also need to try different hyperparameters,
    such as a learning rate for gradient descent and model training. An algorithm
    can contain a large number of hyperparameters, and tuning them manually would
    be a highly labor-intensive task. The SageMaker Tuning service works with SageMaker
    training jobs to tune model training hyperparameters automatically.


    The SageMaker Tuning service supports two types of hyperparameter tuning strategies:


    +   **Random search:** This is where a random combination of values for the hyperparameters
    is used to train a model.


    +   **Bayesian search:** This is where the hyperparameter search is treated like
    a regression problem, where the inputs for regression are the values of the hyperparameters
    and the output is the model performance metric once the model has been trained
    using the input values. The Tuning Tuning service uses the values that have been
    collected from the training jobs to predict the next set of values that would
    produce model improvement.


    The SageMaker Tuning service works with SageMaker training jobs to optimize the
    hyperparameters. It works by sending different input hyperparameter values to
    the training jobs and picking the hyperparameter values that return the best metrics.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# # SageMaker Experiments


    You can organize and track your experiments using SageMaker Experiments. SageMaker
    Experiments have two core concepts:


    +   - **Trial**: A trial is a collection of training steps involved in a trial
    run. This can include trial components such as processing, training, and evaluation.
    You can enrich trials and trial components with a set of metadata, such as dataset
    sources, hyperparameters, and model training metrics.


    +   - **Experiment**: An experiment is a collection of trials, so you can group
    all the trials related to an experiment to easily compare different runs.


    Now, let''s look at SageMaker Hosting.


    # # SageMaker Hosting


    As data scientist builds and experiments with different models, sometimes, there
    is a need to host the model behind an API so that it can be used by downstream
    applications for integration testing. SageMaker Hosting provides such capabilities.
    They are listed as follows:


    +   - **AWS CodeCommit**: AWS CodeCommit is a fully managed code repository for
    source code version control. It is similar to any Git-based repository and integrates
    with SageMaker Studio UI to allow data scientists to clone repositories in AWS
    CodeCommit, as well as pull and push files from and to the repository. For the
    data science environment, you can also use other repository services such as GitHub
    and Bitbucket.


    AWS CodeCommit provides three different ways for connections: HTTPS, which allows
    a Git client to connect to the repository via the HTTPS protocol; SSH, which allows
    a Git client to connect to the repository via the SSH protocol; and HTTPS, which
    is the protocol you should use with the **Git-remote-codecommit (GRC)** utility.
    This utility extends Git to pull and push code from AWS CodeCommit.


    +   - **Amazon ECR**: Amazon ECR is a fully-managed Docker container repository
    and registry service. SageMaker uses container images for data processing, model
    training, and model hosting. These images can be stored in Amazon ECR for management
    and access.'
  merge: -1
  img_proc: true
