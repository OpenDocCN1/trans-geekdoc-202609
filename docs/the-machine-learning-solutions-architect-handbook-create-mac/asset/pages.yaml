    # # Problem statement


    Before we start, let''s first review the business problem that we need to solve.
    A retail bank is experiencing a high customer churn rate for its retail banking
    business. To proactively implement preventive measures to reduce potential churn,
    the bank needs to know who the potential churners are, so the bank can target
    those customers with incentives directly to prevent them from leaving. From a
    business operating perspective, it is much more expensive to acquire a new customer
    than offering incentives to keep an existing customer.


    As an ML solutions architect, you have been tasked to run some experiments to
    validate the ML approach for this problem. There is no ML tooling available, so
    you have decided to set up a Jupyter environment on your local machine for this
    task.


    # # Dataset description


    You will use a dataset from the Kaggle for bank customers'' churn for modeling.
    You can access the dataset at `https://www.kaggle.com/mathchi/churn-bank-customers`.
    The dataset contains 14 columns for features such as credit score, gender, and
    balance, and a target variable, Exited, to indicate if a customer churned or not.
    We will review these features in more detail in later sections.


    # # Setting up a Jupyter Notebook environment


    Now, let''s set up a local data science environment for data analysis and experimentation.
    We will be using the popular Jupyter Notebook environment on your local computer.
    Setting up a Jupyter Notebook environment on a local machine consists of the following
    components:


    +   - Python: Python is a general-purpose programming language, and it is one
    of the most popular programming languages for data science work.

    - PIP: PIP is a Python package installer used for installing different Python
    library packages, such as ML algorithms, data manipulation libraries, or visualization.'
