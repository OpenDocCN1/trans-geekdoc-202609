  md: "The preceding figure (Figure 6.3) shows the relationship between namespaces,\
    \ Pods, and containers in a Kubernetes cluster. In this figure, each namespace\
    \ contains its set of Pods and each Pod can contain one or more containers running\
    \ in it.\n\n+   - Deployment: A deployment is used by Kubernetes to create or\
    \ modify Pods run8 applications. For example, to deploy a containerized application,\
    \ you create a configuration manifest (usually in a YAML file format) that specifies\
    \ details, such as the container deployment name, namespaces, container image\
    \ URI, number of Pod replicas, and the communication port for the application.\
    \ After the deployment is applied using a Kubernetes client utility (kubectl),\
    \ the corresponding Pods running the specified images will be created on the worker\
    \ nodes. The following example creates a deployment of Nginx with the desired\
    \ specification:\n\n```\napiVersion: apps/v1 # k8s API version used for creating\
    \ this deployment\nkind: Deployment # the type of object. In this case, it is\
    \ deployment\nmetadata:\n  name: nginx-deployment # name of the deployment\nspec:\n\
    \  selector:\n    matchLabels:\n      app: nginx # an app label for the deployment.\
    \ \n      This can be used to look up/select Pods\n  replicas: 2 # tells deployment\
    \ to run 2 Pods matching\ntemplate:\n    metadata:\n      labels:\n        app:\
    \ nginx\n    spec:\n      containers:\n        - name: nginx\n          image:\
    \ nginx:1.14.2 # Docker container image used for the deployment\n        ports:\n\
    \          - containerPort: 80 # the networking port to communicate with the containers\n\
    ```"
