    mkdir ${AWS_CLUSTER_NAME} && cd ${AWS_CLUSTER_NAME}

    ```


    +   4. Download the installation template: The kubectlctl_aws.yaml file contains
    specifications for setting up Kubeflow. Let''s download it and modify it with
    the cluster details using the following command:


    ```

    wget -O kfctl_aws.yaml $CONFIG_URI

    ```


    ```

    vim kfctl_aws.yaml

    ```


    After the Vim text editor is open, remove the # symbol in front of roles and replace
    role name with name of the role for the newly created EKS cluster. You can look
    up the role name in the AWS Identity Management (IAM) console. Search for a role
    that contains the name of the cluster as part of it.


    You will also find a username and password pair in the yaml file. The default
