- pgno: 84
  md: 'During model training, every neuron in every layer would have some influence
    on the final output, and their weights (W) are adjusted using a gradient descent
    to optimize the training objective. This process is called backpropagation, where
    the total error is propagated back into every neuron in every layer, and the weights
    for each neuron are adjusted for the portion of the total error associated with
    each neuron.


    MLP is a general-purpose neural network that can be used for classification and
    regression. It can be used to solve similar problems as random forest and XGBoost.
    It is mostly used for tabular datasets, but can work with other data formats,
    such as images and text. It can model complex nonlinear relationships in the dataset.
    It is also computationally efficient, as it is easily parallelizable. MLP normally
    requires more training data to train a performant model compared to traditional
    ML algorithms.


    # Algorithms for clustering


    Clustering is a data mining technique to group items together based on item attributes.
    An example of clustering is to create different customer segments based on demographics
    data and historical transaction or behavior data. There are many different clustering
    algorithms. In this section, we will talk about the K-means clustering algorithm.


    # K-means algorithm


    The K-means algorithm is used extensively in practical real-world applications,
    such as customer segmentation analysis, documentation classification based on
    document attributes, and insurance fraud detection.


    K-means is one of the most popular clustering algorithms. It is used to find clusters
    of data points where similar data points belong to the same cluster. It is an
    unsupervised algorithm, as it does not require labels. The way it works is to
    start with centroids (the center of clusters) for all K clusters and find the
    best centroids by iterating the assignment of data points to the nearest centroid
    and moving the centroid to the mean. Some of the main benefits of using K-means
    are as follows:


    +   - It guarantees convergence.

    - It scales with a large dataset.


    However, to use K-means, you will need to manually choose the K (the number of
    clusters) – not always easy to do. Also, its performance is sensitive to the initial
    choices of random values, so you might not always find the optimal centroids.
    The centroids can also be easily dragged by outlier data points.'
  merge: -1
