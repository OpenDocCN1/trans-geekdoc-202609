    # Trade surveillance


    Traders at financial firms are intermediaries who buy and sell securities and
    other financial instruments on behalf of their clients. They execute orders and
    advise clients on entering and existing financial positions. Trade surveillance
    is the process of identifying and investigating potential market abuse by traders
    or financial organizations. Examples of market abuse include market manipulation,
    such as the dissemination of false and misleading information, manipulating trading
    volumes through large amounts of wash trading, and insider trading through the
    disclosure of non-public information. Financial institutions are required to comply
    with market abuse regulations such as **Market Abuse Regulation (MAR)**, **Markets
    in Financial Instruments Directive II (MiFID II)**, and internal compliance to
    protect themselves, as as damage to their reputations and financial performance.
    The challenges in enforcing trade surveillance include the lack of a proactive
    approach to abuse detection such as large noise/signal ratios resulting in many
    false positives, which increases the cost of case processing and investigations.
    One typical approach to abuse detection is to build complex rule-based systems
    with different thresholds for decision making.'
  merge: -1
  img_proc: true
