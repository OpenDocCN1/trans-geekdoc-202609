    \n```\nimages = next(iter(trainloader))\npixels = images[0] [0]\nplt.imshow(pixels,\
    \ cmap='gray')\nplt.show()\n```\n\n5. Now, we must define a cross-entropy loss\
    \ function for the training process since we want to measure the error in the\
    \ probability distribution for all the labels. Internally, PyTorch’s CrossEntropyLoss\
    \ automatically applies a softmax to the network output to calculate the probability\
    \ distributions for the different classes. For the optimizer, we have chosen the\
    \ Adam optimizer with a learning rate of 0.003. The view () function flattens\
    \ the two-dimensional input array (28x28) into a one-dimensional vector which\
    \ our neural network takes one-dimensional vector input:\n\n```\ncriterion = nn.CrossEntropyLoss()\n\
    images = images.view(images.shape[0], -1)\noutput = model(images)\nloss = criterion(output,\
