  md: '# # Net Asset Value review


    Financial services companies that offer Mutual Funds and ETFs need to accurately
    reflect the values of the funds for trading and reporting purposes. They use a
    Net Asset Value (NAV) calculation, which is the value of an entity’s assets minus
    its liability, to represent the value of the fund. NAV is the price at which an
    investor can buy and sell the fund. Every day, after the market closes, fund administrators
    must calculate the NAV price with 100% accuracy, and the process consists of five
    core steps:


    +   1. Stock reconciliation

    2. Reflection of any corporate actions

    3. Pricing the instrument

    4. Booking, calculating, and reconciling fees and interest accruals, as well as
    cash reconciliation

    5. NAV/price validation


    The following diagram shows the core steps in the NAV review process:


    ![](img/bd21298357d8484151447cff0b2f138b_47_0.png)


    Figure 2.4 – Net Asset Value review process


    Step 5 is the most vital if it is done incorrectly, the fund administrator could
    be liable, which can result in monetary compensations to investors. Traditional
    methods use fixed thresholds to flag exceptions, such as incorrectly valued stock
    or corporation actions not being correctly processed for analysts, which could
    result in large volumes of false positives and wasted time. Large volumes of data
    need to be used for investigation and reviews such as prices of the instruments,
    fees and interest, assets (for example, equities, bonds, and futures), cash positions,
    and corporate actions data.


    The main objective of the NAV validation step is to identify pricing exceptions,
    which can be treated as an anomaly detection problem. ML-based anomaly detection
    solutions have been adopted to identify potential pricing irregularities and flag
    these irregularities for further human investigation. The ML approach has proven
    to significantly reduce false positives and save significant amounts of time for
    human reviewers.'
  merge: -1
  img_proc: true
