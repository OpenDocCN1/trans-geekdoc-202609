- pgno: 207
  md: "# # Building a training environment\n\nAs discussed earlier, an ML platform\
    \ usually provides a separate model training service and infrastructure to support\
    \ large-scale and automated model training in an ML pipeline. This dedicated training\
    \ service should be accessible from an experimentation environment (such as a\
    \ Jupyter notebook) so that data scientists can launch model training jobs as\
    \ part of their experiments, and it should also be accessible from an ML automation\
    \ pipeline.\n\nIn a Kubernetes-based environment, there are two main approaches\
    \ for model training:\n\n+   - Model training using Kubernetes Jobs\n- Model training\
    \ using Kubeflow training operators\n\nYou can choose which approach to use depending\
    \ on your training needs. Now, let's take a closer look at each of them in detail:\n\
    \n+   **Model training using Kubernetes Jobs:** As we discussed in Chapter 6,\
    \ Kubernetes Container Orchestration Infrastructure Management, a Kubernetes Job\
    \ creates one or more containers and runs them to completion. This pattern is\
    \ well suited for running certain types of ML model training jobs, as an ML job\
    \ runs a training loop to completion and does not run forever. For example, you\
    \ can pack a container with a Python training script and all the dependencies\
    \ that train a model and use the Kubernetes Job to load the container and kick\
    \ off the training script. When the script completes and exits, the Kubernetes\
    \ job also ends. The following sample YAML kicks off a model training job if submitted\
    \ with the `kubectlkubectl apply` command:\n\n```\napiVersion: batch/v1\nkind:\
    \ Job\nmetadata:\n  name: train-churn-job\nspec:\n  template:\n    spec:\n   \
    \   containers:\n      - name: train-container\n        imagePullPolicy: Always\n\
    \        image: <model training uri>\n```"
  merge: -1
  img_proc: true
- pgno: 208
  md: "| command: [\"python\", \"train.py\"] |\n restartPolicy: Never |\n backoffLimit:\
    \ 4 |\n\nYou can query the status of the job using the kubectl get jobs command\
    \ and see the detailed training logs using the kubectl logs <pod name> command.\n\
    \n+   * Model training using Kubeflow trainers: A Kubernetes Job can launch a\
    \ model training container and run a training script inside the container. Since\
    \ the controller for a Kubernetes Job does not have application-specific knowledge\
    \ about the training job, it can only handle generic Pod deployment and management\
    \ for the running jobs, such as running the container in a Pod, monitoring the\
    \ Pod, and handling generic Pod failure. However, some model training jobs, as\
    \ distributed training job in a cluster, require the specific deployment, monitoring,\
    \ and maintenance of stateful communications among various Pods. This is where\
    \ the Kubernetes training operator can be applied.\n\nKubeflow uses a set of pre-built\
    \ operators (such as the TensorFlow, PyTorch, and XGBoost operators) for complex\
    \ model training jobs. Each Kubeflow training operator has a custom resource (CR)\
    \ (for example, TFJob for TensorFlow jobs) that defines the training job's specific\
    \ configurations, such as the type of Pod in the training job (for example, master,\
    \ worker, or parameter server), or runs policies on how to clean up resources\
    \ and how long a job should run. The controller for the CR is responsible for\
    \ configuring the training environment, monitoring the training job's specific\
    \ state. For example, the controller can set environment variables to make the\
    \ training cluster specifications (for example, types of Pods and indices) available\
    \ to the training code inside the container. The controller can also inspect the\
    \ exit code of a training process and fail the training job if the exit code indicates\
    \ a permanent failure. The following YAML file template represents a specification\
    \ for running training jobs using the TensorFlow operator (tf-operator):\n\n```\n\
    apiVersion: \"kubeflow.org/v1\"\nkind: \"TFJob\"\nmetadata:\n  name: \"distributed-tensorflow-job\"\
    \nspec:\n  tfReplicaSpecs:\n    PS:\n      replicas: 1\n```"
  merge: -1
  img_proc: true
- pgno: 209
  md: "```\nrestartPolicy: Never\ntemplate:\n  spec:\n    containers:\n      - name:\
    \ tensorflow\n        image: <model training image uri>\nWorker:\n  replicas:\
    \ 2\n  restartPolicy: Never\n  template:\n    spec:\n    containers:\n      -\
    \ name: tensorflow\n        image: <model training image uri>\n```\n\nIn this\
    \ example, the specification will create one copy of the parameter servers (which\
    \ aggregate model parameters across different containers) and two copies of the\
    \ workers (which run model training loops and communicate with the parameter servers).\
    \ The operator will process the TFJob object according to the specification, keep\
    \ the TFJob object stored in the system with the actual running services and Pods,\
    \ and replace the actual state with the desired. You can submit the training job\
    \ using kubectl apply -f <TFJob specs template> and can get the status of the\
    \ TFJob with the kubectl get tfjob command.\n\nAs a data scientist, you can submit\
    \ Kubernetes training jobs or Kubeflow training jobs using the kubectl utility,\
    \ or from your Jupyter notebook environment using the Python (SDK). For example,\
    \ TFJob object has a Python SDK called kubeflow.tfjob, and Kubernetes has a client\
    \ SDK called kubernetes.client for interacting with the Kubernetes and Kubeflow\
    \ environments from your Python code. You can also invoke training jobs using\
    \ the Kubeflow Pipeline component, which we will cover later in the Kubeflow pipeline\
    \ section."
