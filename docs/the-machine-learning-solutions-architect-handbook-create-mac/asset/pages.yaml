    When a training job is started, SageMaker Training Service will perform the following
    tasks in sequence:


    +   1. Launch the EC2 instances needed for the training job.

    2. Download the data from S3 to the training host.

    3. Download the appropriate managed container from the SageMaker ECR registry
    and run the container.

    4. Copy the training script and dependencies to the training loop.

    5. Run the training script and pass the hyperparameters as command-line arguments
    to the training script. The training script will load the training/validation/testing
    data from specific directories in the container, the running loop, and save the
    model to a specific directory in the container. Several environment variables
    will be set in the container to provide configuration details, such as directories
    for the data and output, to the training script.

    6. Once the training script exits with success, SageMaker Training Service will
    copy the saved model artifacts from the container to the model output location
    in S3.


