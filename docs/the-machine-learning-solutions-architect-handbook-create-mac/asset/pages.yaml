- pgno: 292
  md: '# Monitoring and logging


    SageMaker provides out-the-box monitoring and logging capabilities to assist with
    support operations. It monitors both system resource metrics (for example, CPU/GPU
    utilization) and model invocation metrics (for example, the number of invocations,
    model latencies, and failures). These monitoring metrics and any model processing
    logs are captured by AWS CloudWatch metrics and CloudWatch Logs.


    # Adopting MLOps for ML workflows


    Similar to the DevOps practice, which has been widely adopted for the traditional
    software development and deployment process, the MLOps practice is intended to
    streamline the building and deployment processes of ML pipelines and improve the
    collaborations between data scientists/ML engineers, data engineering, and the
    operations team. Specifically, an MLOps practice is intended to deliver the following
    main benefits in an end-to-end ML life cycle:


    +   **Process consistency:** The MLOps practice aims to create consistency in
    the ML model building and deployment process. A consistent process improves the
    efficiency of the ML workflow and ensures a high degree of certainty in the input
    and output of the ML workflow.


    +   **Tooling and process usability:** One of the core objectives of the MLOps
    practice is to create reusable technology tooling and templates for faster adoption
    and deployment of new ML use cases. These can include common tools such as code
    and library repositories, package and image building tools, pipeline orchestration
    tools, the model registry, as well as common infrastructure for model training
    and model deployment. From a reusable template perspective, these can include
    common reusable scripts for Docker image builds, workflow orchestration definitions,
    and CloudFormation scripts for model building and model deployment.


    +   **Model reproducibility:** ML is highly iterative and can involve a large
    number of experiments and model training runs using different datasets, algorithms,
    and hyperparameters. An MLOps process needs to capture all the data inputs, source
    code, and artifacts that are used to build an ML model and establish model lineage
    from this input data, code, and artifacts for the final models. This is important
    for both experiment tracking as well as governance and control purposes.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '+   - **Delivery scalability:** An MLOps process and the associated tooling
    enable ML pipelines to run in parallel for high delivery throughputs. Different
    ML project teams can use the standard MLOps processes and common tools independently
    without creating conflicts for resource contention, environment isolation, and
    governance perspective.


    +   - **Process and operations auditability:** MLOps enables greater auditability
    into the process and the auditability of ML pipelines. This includes capturing
    the details of machine pipeline executions, dependencies, and lineage across different
    steps, job execution statuses, model training and deployment details, approval
    tracking, and actions that are performed by human operators.


    Now that we are familiar with the intended goals and benefits of the MLOps practice,
    let''s look at the specific operational process and concrete technology architecture
    of MLOps on AWS.


    # Components of the MLOps architecture


    One of the most important MLOps concepts is the automation pipeline, which executes
    a sequence of tasks, such as data processing, model training, and model deployment.
    This pipeline can be a linear sequence of steps or a more complex DAG with parallel
    execution for multiple tasks. An MLOps architecture also has several repositories
    for storing assets and metadata as part of pipeline executions. The following
    diagram shows the core components and tasks involved in an MLOps operation:


    ![](img/bd21298357d8484151447cff0b2f138b_293_0.png)


    Figure 9.2 – MLOps components'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'A code repository in MLOps architecture not only serves as a source control
    mechanism for data scientists and engineers – it is also the triggering mechanism
    to kick off pipeline executions. For example, when a data scientist checks an
    updated training script into the code repository, a model pipeline execution can
    be triggered.


    A feature repository stores reusable ML features and can be the target of data
    processing/feature engineering job. The features from the feature repository can
    be a part of the training datasets where applicable. The feature repository is
    also used as a part of the model inference request.


    A container repository stores the container images that are used for data processing
    tasks, model training jobs, and model inference engines. It is usually the target
    of the container building pipeline.


    A model registry keeps an inventory of trained models, along with all the metadata
    associated with the model, such as its algorithm, hyperparameters, model metrics,
    and training dataset location. It also maintains the status of the model life
    cycle, such as its deployment approval status.


    A pipeline repository maintains the definition of automation pipelines and the
    statuses of different pipeline job executions.


    In an enterprise setting, a task ticket also needs to be created when different
    tasks, such as model deployment, are performed, so that these actions can be tracked
    in a common enterprise ticketing management system. To support audit requirements,
    the lineage of different pipeline tasks and their associated artifacts need to
    be tracked.


    Another critical component of the MLOps architecture is monitoring. In general,
    you want to monitor items such as the pipeline''s execution status, model training
    status, and model endpoint status. Endpoint monitoring can also include system/resource
    performance monitoring, statistical metrics monitoring, drift and outlier monitoring,
    and model explainability monitoring. Alerts can be triggered on certain execution
    statuses to invoke human or automation actions that are needed.


    AWS provides multiple technology options for implementing an MLOps architecture.
    The following diagram shows where these technology services fit in an enterprise
    MLOps architecture:'
  merge: -1
  img_proc: true
