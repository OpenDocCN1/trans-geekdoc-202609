  md: '# Contributors


    # About the author


    David Ping is a senior technology leader with over 25 years of experience in the
    technology and financial services industry. His technology focus areas include
    cloud architecture, enterprise ML platform design, large-scale model training,
    intelligent document processing, intelligent media processing, intelligent search,
    and data platforms. He currently leads an AI/ML solutions architecture team at
    AWS, where he helps global companies design and build AI/ML solutions in the AWS
    cloud. Before joining AWS, David held various senior technology leadership roles
    at Credit Suisse and JPMorgan. He started his career as a software engineer at
    Intel. David has an engineering degree from Cornell University.'
