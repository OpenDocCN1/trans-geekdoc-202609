  md: '+   3. Add environment variables: Add environment variables to allow easier
    command executions. You will need to provide the Amazon EKS cluster name. You
    can look up the EKS cluster name in the AWS Management Console:


    ```

    export CONFIG_URI="https://raw.githubusercontent.com/kubeflow/manifests/v1.2-branch/kfdef/kfctl_aws.v1.2.0.yaml"

    ```


    ```

