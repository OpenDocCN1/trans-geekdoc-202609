    kind: SeldonDeployment\nmetadata:\n  name: bank-churn\nspec:\n  name: bank-churn\n\
    \  predictors:\n    graph:\n      children: []\n      implementation: SKLEARN\
    \ SERVER\n      modelUri: <<S3 uri of model file>>\n      envSecretRefName: aws-secret\n\
    \    name: classifier\n    name: default\n    replicas: 1\nEOF\n```\n\nAlright,\
    \ we are now ready to construct the pipeline by running the following code block.\
    \ Note that we will use AWS credentials in some of the steps. To securely manage\
    \ the AWS credentials and pass them to the component, we need to create a new\
