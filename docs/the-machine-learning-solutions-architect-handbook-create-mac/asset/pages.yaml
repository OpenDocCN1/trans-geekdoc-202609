    chapter are located at GitHub:


    ```

    https://github.com/PacktPublishing/The-Machine-Learning-Solutions-Architect-Handbook/tree/main/Chapter06.

    ```


    Let''s begin the chapter with a quick introduction to containers.


    # Introduction to containers


    A container is a form of operating system virtualization, and it has been a very
    popular

    computing platform for software deployment and running modern software based on

    micro-services architecture. A container allows you to package and run container
    software

    with isolated dependencies. Compared to server virtualization, as Amazon EC2 or

    VMware virtual machines, containers are more lightweight and portable, as they
    share

    t same operating system and do not contain operating system images in each container.

    Each container has its own filesystems, share of computing resources, and process
    space

    for the custom applications running inside it.


    While containers may seem like a relatively transformative technology, the concept

    of containerization technology was actually born in the 1970s with chroot system
    and

    Unix Version 7. However, container technology did not gain much attraction in
    the

    software development community for the next two decades and remained dormant.
    While

    it picked up some steam and made remarkable advances from 2000 to 2011, it was
    the

    introduction of Docker in 2013 that started a renaissance of container technology.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'You can run all kinds of applications inside containers, such as simple programs
    like data processing scripts or complex systems like databases. The following
    diagram shows how container deployment differs from other types of deployment.
    Note that a container runtime can also run in the guest operating system of a
    virtualized environment to host containerized applications:


    | Virtual machine | Virtual machine |

    | --- | --- |

    | app | app | app | app |

    | Guest operating system | Guest operating system |


    | Container |

