  md: '# 5 Open Source Machine Learning Libraries


    There are multiple technologies available for building machine learning (ML) and
    data science solutions, in both open source and commercial product spaces. To
    maintain greater flexibility and customization of their machine learning platforms,
    some organizations have chosen to invest in in-house data science and engineering
    teams to build data science platforms using open source technology stacks. Some
    organizations, however, have adopted commercial products to focus their effort
    on solving business and data challenges. Some organizations have chosen hybrid
    architecture to leverage both open source and commercial products for their machine
    learning platform. As an machine learning solution architecture practitioner,
    I often need to explain to others what open source machine learning technologies
    are available and how they can be used for building machine learning solutions.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'In the next several chapters, we will focus on various open source technologies
    for experimentation, modeling building, and building machine learning scikit-learn
    platforms. In this chapter, you will learn about machine learning libraries as
    scikit-learn, Spark, TensorFlow, and PyTorch. We will discuss these machine learning
    libraries'' core functionalities and how we can apply them to various steps in
    a machine learning life cycle, such as data processing, modeling building, and
    model evaluation. You will also get hands-on with a couple of machine learning
    libraries and learn to use them for model training.


    Specifically, we will be covering the following main topics:


    +   - Core features of open source machine learning libraries

    - Understanding the scikit-learn machine learning library

    - Understanding the Apache ML machine learning library

    - Understanding the TensorFlow machine learning library and hands-on lab

    - Understanding the PyTorch machine learning and hands-on lab


    # Technical requirements


    In this chapter, you will need access to your local machine where you installed
    the Jupyter environment from Chapter 3, Machine Learning Algorithms.


    You can find the code samples used in this chapter at https://github.com/PacktPublishing/The-Machine-Learning-Solutions-Architect-Handbook/tree/main/Chapter05.


    # Core features of open source machine learning libraries


    At their core, machine learning libraries are just software libraries written
    in different programming languages. What makes them different from other software
    libraries are the functions they support. In general, most ML libraries have support
    for the following key features via different library sub-packages:


    +   - Data manipulation and processing: This includes support for different data
    tasks such as loading data of different formats, data manipulation, data analysis,
    and data transformation.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   - Model building and training: This covers support for built-in machine
    learning algorithms as well as capabilities for building custom algorithms. Most
    ML libraries also have built-in support for the commonly used loss functions (such
    as mean squared error or cross-entropy) and a list of optimizers (such as gradient
    descent or adam) to choose from. Some libraries also provide advanced support
    for distributed model training across multiple CPU/GPU devices or compute nodes.


    +   - Model evaluation: This includes packages for evaluating the performance
    of models, such as model accuracy or error rates.


    +   - Model saving and loading: This includes support for saving the models to
    various formats for persistence, and support for loading saved models into memory
    for predictions.


    +   - Model serving: This includes model serving features to expose machine learning
    models behind an API, usually a RESTful API web service.


    A machine learning library usually supports one or more programming languages
    as Python, Java, or Scala to meet different needs. Python is one of the most popular
    languages for machine learning, and most of the machine learning libraries provide
    support for the Python interface. The backend and underlying algorithms for these
    libraries are, however, mainly written in compiled languages, such as C++ and
    Cython, to optimize performance. Next, we will take a closer look at some of the
    most common machine learning libraries.


    # Understanding the scikit-learn machine learning library


    scikit-learn (https://scikit-learn.org/) is an open source machine learning library
    for Python. Initially released in 2007, it is one of the most popular machine
    learning libraries for solving many machine learning tasks, such as classification,
    regression, clustering, and dimensionality reduction.


    scikit-learn is widely used by companies in different industries and academics
    for solving real-world business cases such as churn prediction, customer segmentation,
    recommendations, and fraud detection.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'scikit-learn is built mainly on top of three foundational libraries: NumPy,
    SciPy, and matplotlib. NumPy is a Python-based library for managing large, multidimensional
    arrays and matrices, with additional mathematical functions to operate on the
    arrays and matrices. SciPy provides scientific computing functionality, such as
    optimization, linear algebra, and Fourier Transform. Matplotlib is used for plotting
    data for data visualization. scikit-learn is a sufficient and effective tool for
    a range of common data processing and model-building tasks.


    # Installing scikit-learn


    You can easily install the scikit-learn package on different operating systems
    as Mac, Windows, and Linux. The scikit-learn library package is hosted on the
    Python Package index site (https://pypi.org/) and the Anaconda package repository
    (https://anaconda.org/anaconda/repo). To install it in your environment, you can
    use either the PIP package manager or the Conda package manager. A package manager
    allows you to install and manage the installation of library packages in your
    operating system.


    To install the scikit-learn library using the PIP or Conda package manager, you
    can simply run pip install -U scikit-learn to install it from the PyPI index or
    run conda install scikit-learn if you want to use a Conda environment. You can
    learn more about PIP at https://pip.pypa.io/ and Conda at http://docs.conda.io.


    # Core components of scikit-learn


    scikit-learn provides a full range of Python classes for machine learning, from
    data processing to building repeatable pipelines. The following diagram shows
    the main components in the scikit-learn library package:


    ![](img/bd21298357d8484151447cff0b2f138b_146_0.png)


    Figure 5.1 – scikit-learn components'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Understanding the scikit-learn machine learning library


    Now, let''s take a closer look at how these components support the various phases
    of the machine learning life cycle:


    +   **Preparing data:** For data manipulation and processing, the pandas library
    is commonly used. It provides core data loading and saving functions, as well
    as utilities for data manipulations such as data selection, data arrangement,
    and data statistical measures. pandas is built on top of NumPy. The pandas library
    also comes with some visualization features such as pie charts, scatter plots,
    and boxplots.


    scikit-learn provides a list of transformers for data processing and transformation,
    as imputing missing values, encoding categorical values, normalization, and feature
    extraction for text and images. You can find the full list of transformers at
    https://scikit-learn.org/stable/data_transforms.html. You also have the flexibility
    to create custom transformers.


    +   **Model training:** scikit-learn provides a long list of machine learning
    algorithms (also known as estimators) for classification and regression (for example,
    logistic regression, K nearest neighbors, and random forest), as well as clustering
    (for example, k-means). You can find the full list of algorithms at https://scikit-learn.org/stable/index.html.
    The following sample code shows the syntax for using the RandomForestClassifier
    algorithm to train a model using a labeled dataset:


    ```

    from sklearn.ensemble import RandomForestClassifier

    model = RandomForestClassifier(max_depth, max_features, n_estimators)

    model.fit(train_X, train_y)

    ```


    +   **Model evaluation:** scikit-learn has utilities for hyperparameter tuning
    and cross-validation, as well as metrics for model evaluations. You can find the
    full list of model selection and evaluation utilities at https://scikit-learn.org/stable/model_selection.html.
    The following sample code shows the accuracy_score class for evaluating the accuracy
    of classification models:


    ```

    from sklearn.metrics import accuracy_score

    acc = accuracy_score(true_label, predicted_label)

    ```'
  merge: -1
  img_proc: true
- pgno: 148
  md: '**Model saving:** scikit-learn can save model artifacts using Python object
    serialization (pickle or joblib). The serialized pickle file can be loaded into
    memory for predictions. The following sample code shows the syntax for saving
    a model using the joblib class:


    ```

    import joblib

    joblib.dump(model, "saved_model_name.joblib")

    ```


    **Pipeline:** scikit-learn also provides a pipeline utility for stringing together
    transformers and estimators as a single processing pipeline, and it can be reused
    as a single unit. This is especially useful when you need to preprocess data for
    model training and model prediction, as both the data to be processed in the same
    way:


    ```

    from sklearn.pipeline import Pipeline

    from sklearn.preprocessing import StandardScaler

    from sklearn.ensemble import RandomForestClassifier

    ```


    ```

    pipe = Pipeline([(''scaler'', StandardScaler()), (RF, RandomForestClassifier())])

    pipe.fit(X_train, y_train)

    ```


    As you can see, it is quite easy to get started with the scikit-learn machine
    learning package to experiment with and build machine learning models. scikit-learn
    is well suited for common regression, classification, and clustering machine learning
    tasks if you need to train machine learning on large datasets or multiple machines,
    scikit-learn normally would not be the right option, unless the algorithm (for
    example, SGDRegressor) supports incremental training. Next, we will look at some
    machine learning libraries that can handle machine learning at a large scale.


    # # Understanding the Apache Spark ML machine learning library


    Apache Spark is a distributed data processing framework for large-scale data processing.
    It allows Spark-based applications to load and process data across a cluster of
    distributed machines in memory to speed up the processing time.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'A Spark cluster consists of a master node and worker nodes for running different
    Spark applications. Each application that runs in a Spark cluster has a driver
    program and its own set of processes, which are coordinated by the SparkSession
    object in the driver program which connects to a cluster manager (for example,
    Mesos, YARN, Kubernetes, or Spark''s standalone cluster manager), which is responsible
    for allocating resources in the cluster for the Spark application. Specifically,
    the cluster manager acquires resources on worker nodes called executors for run
    computations and store data for the Spark application. Executors are configured
    with resources such as the number of CPU cores and memory to meet task processing
    needs. Once the executors have been allocated, the cluster manager sends the application
    code (Java JAR or Python files) to the executors. Finally, SparkContext sends
    the tasks to the executors to run. The following diagram shows how a driver program
    interacts with a cluster manager and executor to run a task:


    ![](img/bd21298357d8484151447cff0b2f138b_149_0.png)


    Figure 5.2 – Running a Spark application on a Spark cluster


    Each Spark application gets its own set of executors, which stay up for the duration
    of the application. The executors for different applications are isolated from
    each other, and they can only share data through external data storage.


    The machine learning package for Spark is called MLlib, which runs on top of the
    distributed Spark architecture. It is capable of processing and training models
    with a large dataset that does not fit into the memory of a single machine. It
    provides APIs in different programming languages, including Python, Java, Scala,
    and R. From a perspective, it is very similar to that of the scikit-learn library.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Spark is highly popular and adopted by companies of all sizes across different
    industries. Large companies such as Netflix, Uber, and Pinterest use Spark for
    large-scale data processing and transformation, as well as running machine learning
    models.


    # Installing Spark ML


    Spark ML libraries are included as part of the Spark installation. PySpark is
    the Python API for Spark, and it can be installed like a regular Python package
    using PIP (pip install pyspark). Note that PySpark requires Java and Python to
    be installed on the machine before it is installed. You can find Spark''s installation
    instructions at https://spark.apache.org/docs/latest/


    # Core components of the scikit-learn ML library


    Similar to the scikit-learn library, Spark and Spark ML provide a full range of
    functionality for building machine learning models, from data preparation to model
    evaluation and model persistence. The following diagram shows the core components
    that are available in Spark for building machine learning models:


    ![](img/bd21298357d8484151447cff0b2f138b_150_0.png)


    Figure 5.3 – Core components of Spark ML


    Now, let''s take a closer look at the functions supported by the Spark and Spark
    ML library packages:


    +   - **Preparing data**: Spark supports Spark DataFrame, a distributed collection
    of data that can be used for data join, aggregation, filtering, and other data
    manipulation needs. Conceptually, a Spark DataFrame is equivalent to a table in
    a relational database. A Spark DataFrame can be distributed (that is, partitioned)
    across many machines, which allows fast data processing in parallel. **Lazy execution**
    defines a model called the lazy execution set of transformations (for example,
    adding a column or filtering column) and the transformations are only executed
    when an action (such as calculating the min/max of a column) is needed. This allows
    an execution plan for the different transformations and actions to be generated
    to optimize the execution''s performance.'
