    Now we have an understanding of containers, next, let''s dive into Kubernetes.


    # Kubernetes overview and core concepts


    While it is feasible to deploy and manage the life cycle of a small number of
    containers and containerized applications directly in a compute environment, it
    can get very challenging when you have a large number of containers to manage
    and orchestrate across a large number of servers. This is where Kubernetes comes
    in. Initially released in 2014, **Kubernetes (K8s)** is an open source system
    for managing containers at scale on clusters of servers (the abbreviation K8s
    is derived by replacing *kubernetes* with the digit 8).


    Architecturally, Kubernetes operates a master node and one or more worker nodes
    in a cluster of servers. The master node, also known as the **control plane**,
    is responsible for the overall management of the cluster, and it has four key
    components:


    +   * API server

    * Scheduler

    * Controller

    * etcd'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'The master node exposes an API server layer that allows programmatic control
    of the cluster. An example of an API call could be the deployment of a web application
    on the cluster. The control plane also tracks and manages all configuration data
    in a key-value store called etcd and is responsible for storing all the cluster
    data, such as the desired number of container images to run, compute resource
    specification, and size of storage volume for a web application running on the
    cluster. Kubernetes uses object type controller to monitor the states of Kubernetes
    resources and take the necessary actions (for example, request the change via
    the API server) to move the current to the desired states (such as the difference
    in the number of the running containers) between the two states. The controller
    manager in the master node is responsible for managing all the Kubernetes controllers.
    Kubernetes comes with a set of built-in controllers such as scheduler, which is
    responsible for scheduling Pods (units of deployment that we will discuss in more
    detail later) to run on worker nodes when there is a change request. Other examples
    include Job controller, which is responsible for running and stopping one or more
    Pods for a task, and Deployment controller, is responsible for deploying Pods
    based on a deployment manifest, such as a deployment manifest for a web application.
    The following figure (Figure 6.2) shows the core architecture components of a
    Kubernetes cluster:


    ![](img/bd21298357d8484151447cff0b2f138b_173_0.png)


    Figure 6.2 – Kubernetes architecture


    To interact with a Kubernetes cluster control plane, you can use the kubectl command-line
    utility, the Kubernetes Python client (https://github.com/kubernetes-client/python),
    or access directly using the RESTful API. You can get a list of supported kubectl
    commands at https://kubernetes.io/docs/reference/kubectl/cheatsheet.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'There are a number of unique technical concepts that are core to the Kubernetes
    architecture. The following are some of the main concepts that Kubernetes operates
    around:


    +   * Namespaces: Namespaces organize clusters of worker machines into virtual
    sub-clusters. They are used to provide logical separation of resources owned by
    different teams and projects while still allowing ways for different namespaces
    to communicate. A namespace can span multiple worker nodes, and it can be used
    to group a list of permissions under a single name to allow authorized users to
    access resources in a namespace. Resource usage controls can be enforced to namespaces
    such as quotas for CPU and memory resources. Namespaces also make it possible
    to name resources with identical names if the resources reside in the different
    namespaces to avoid conflicts. By default, there is a default namespace in Kubernetes.
    You can create additional namespaces as needed. The default namespace is used
    if a namespace is not specified.


    +   * Pods: Kubernetes deploys computing in a logical unit called a Pod. All Pods
    belong to a Kubernetes namespace (either the default namespace or a specified
    namespace). One or more containers can be grouped into a Pod, and all containers
    in the Pod are deployed and scaled together as a single unit and share the same
    context, such as Linux namespaces and filesystems. Each Pod has a unique IP address
    that shared by all the containers in a Pod. A Pod is normally created as a workload
    resource, such as a Kubernetes Deployment or Kubernetes Job.


    ![](img/bd21298357d8484151447cff0b2f138b_174_0.png)


    Figure 6.3 - Namespaces, Pods, and containers'
  merge: -1
  img_proc: true
