- pgno: 156
  md: '# # Core components of TensorFlow


    The TensorFlow library provides a rich set of features for different machine learning
    steps, from data preparation to model serving. The following diagram shows the
    core building blocks of the TensorFlow library:


    ![](img/bd21298357d8484151447cff0b2f138b_156_0.png)


    Figure 5.5 – TensorFlow components


    Training a machine model using TensorFlow 2.x involves the following main steps:


    +   * **Preparing the dataset:** TensorFlow 2.x provides a `tf.data` for efficiently
    loading data from sources (such as files), transforming data (such as changing
    the values of the dataset), and setting up the dataset for training (such as configuring
    batch size or data prefetching). These data classes provide efficient ways to
    pass data to the training algorithms for optimized model training.The TensorFlow
    Keras** API also provides a list of built-in classes (MNIST, CIFAR, IMDB, MNIST
    Fashion, and Reuters News wires) for building simple deep learning models. You
    can also use a NumPy array or Python generator (a function that behaves like an
    iterator) to a model in **TensorFlow** for model training, but `tf.data` is the
    recommended approach.


    +   *Defining the neural network:** TensorFlow 2.x provides multiple ways to use
    or build a neural network for model training. You can use the premade estimators
    (`tf.estimator` class) as DNNRegressor and DNNClassifier to train models. Or create
    custom neural networks using the keras class, which provides a list of primitives
    as `tf.keras.layers` for constructing neural network layers and `tf.keras.activation`
    as ReLU, **Sigmoid**, and **Softmax** for building neural networks. Softmax is
    usually used as the last output of a neural network for a multiclass problem.
    It takes a vector of real numbers (positive and negative) as input and normalizes
    the vector as a probability distribution to represent the probabilities of different
    class labels, such as the different types of hand-written digits. For binary classification
    problems, Sigmoid is normally used and it returns a value between 0 and 1.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   **Defining the loss function:** TensorFlow 2.x provides a list of built-in
    loss functions such as mean squared error (MSE) and mean absolute error (MAE)
    for regression tasks and cross-entropy loss for classification tasks. You can
    find more about MSE and MAE at https://en.wikipedia.org/wiki/Mean_squared_error
    and https://en.wikipedia.org/wiki/Mean_absolute_error You can find a list of supported
    loss functions in the tf.keras.classes. You can find more about the different
    losses at https://keras.io/api/losses/. If the built-in loss functions do not
    meet your needs, you can define custom loss functions


    +   **Selecting the optimizer:** TensorFlow 2.x provides a list of built-in optimizers
    for model training, such as the Adam optimizer and the Stochastic Gradient Descent
    (SGD) optimizer for parameters optimization, with its tf.keras.optimizers You
    can find more details about the different supported optimizers at https://keras.io/api/optimizers/.
    Adam and SGD are two of the most commonly used optimizers


    +   **Selecting the evaluation metrics:** TensorFlow 2.x has a list of built-in
    evaluation metrics (for example, accuracy and cross-entropy) for model training
    evaluations with its tf.keras.metrics class. You can also define custom metrics
    for model evaluation during training.


    +   **Compiling the network into a model:** This step compiles the defined network,
    along with the defined loss function, optimizer, and evaluation metrics, into
    a computational graph that''s ready for model training.


    +   **Fitting the model:** This step kicks off the model training process by feeding
    the data to the computational graph through batches and multiple epochs to optimize
    the model parameters.


    +   **Evaluating the trained model:** Once the model has been trained, you can
    evaluate the model using the evaluate () function against the test data.


    +   **Saving the model:** The model can be saved in TensorFlow SavedModel serialization
    format or Hierarchical Data Format (HDF5) format.


    +   **Model serving:** TensorFlow comes with a model serving framework TensorFlow
    Serving, which we will cover in greater detail in Chapter 7, Open Source Machine
    Learning Platform.


    The TensorFlow library is designed for large-scale production-grade data processing
    and model training. As such, it provides capabilities for large-scale distributed
    data processing and model training on a cluster of servers against a large dataset.
    We will cover large-scale distributed data processing and model training in a
    Chapter 10, Advanced ML Engineering.'
  merge: -1
  img_proc: true
