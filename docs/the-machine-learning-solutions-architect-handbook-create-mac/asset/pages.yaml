- pgno: 21
  md: '# 1 Machine Learning and Machine Learning Solutions Architecture


    The field of **artificial intelligence (AI)** and **machine learning (ML)** has
    had a long history. Over the last 70+ years, ML has evolved from checker game-playing
    computer programs in the 1950s to advanced AI capable of beating the human world
    champion in the game of Go. Along the way, the technology infrastructure for ML
    has also evolved from a single machine/server for small experiments, managing,
    and deploying to highly complex end-to-end ML platforms capable of training, managing,
    and deploying thousands of ML models. The hyper-growth in the AI/ML field has
    resulted in the creation of many new professional roles, such as **MLOps engineering.
    ML product management, and ML software engineering** across a range of industries.


    **Machine learning solutions architecture (ML solutions architecture)** is another
    relatively new discipline that is playing an increasingly critical role in the
    full end-to-end ML life cycle as ML projects become increasingly complex in terms
    of *business impact, science sophistication*, and the technology landscape.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'This chapter talks about the basic concepts of ML and where ML solutions architecture
    fits in the full data science life cycle. You will learn the three main types
    of ML, including **supervised, unsupervised, and reinforcement** learning. We
    will discuss the different steps it takes to get an ML project from the ideas
    stage to production and the challenges faced by organizations when implementing
    an ML initiative. Finally, we will finish the chapter by briefly discussing the
    core areas of ML solutions architecture, including system architecture, workflow
    automation, and security compliance.


    Upon completing this chapter, you should be able to identify the three main ML
    types and what type of problems they are designed to solve. You will understand
    the role of an ML solutions architect and what business and technology areas you
    need to focus on to support end-to-end ML initiatives.


    In this chapter, we are going to cover the following main topics:


    +   - What is ML, and how does it work?

    - The ML life cycle and its key challenges

    - What is ML solutions architecture, and where does it fit in the overall life
    cycle?


    # What are AI and ML?


    AI can be defined as a machine demonstrating intelligence similar to that of human
    natural intelligence, such as distinguishing different types of flowers through
    vision, understanding languages, or driving cars. Having AI capability does not
    necessarily mean a system has to be powered only by ML. An AI system can also
    be powered by other techniques, such as rule-based engines. ML is a form of AI
    that learns how to perform a task using different learning techniques, such as
    learning from examples using historical data or learning by trial and error. An
    example of ML would be making credit decisions using an ML algorithm with access
    to historical credit decision data.


    **Deep learning (DL)** is a subset of ML that uses a large number of artificial
    neurons (known as an *artificial neural network*) to learn, which is similar to
    how a human brain learns. An example of a deep learning-based solution is the
    **Amazon Echo virtual assistant**. To better understand how ML works, let''s first
    talk about the different approaches taken by machines to learn. They are as follows:


    +   - Supervised ML

    - Unsupervised machine learning

    - Reinforcement learning


    Let''s have a look at each one of them in detail.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Supervised ML


    Supervised ML is a type of ML where training an ML model, an ML algorithm is provided
    with the input data features (for example, the size and zip code of houses) and
    the answers, also known as labels (for example, the prices of the houses). A dataset
    with labels is called a labeled dataset. You can think of supervised ML as learning
    by example. To understand what this means, let''s use an example of how humans
    learn to distinguish different objects. Say you are provided with a number of
    pictures of different flowers and their names. You are then told to study the
    characteristics of the flowers, such as the shape, size, and color for each provided
    flower name. After you have gone through a number of different pictures for each
    flower, and are then given flower pictures without the names and asked to distinguish
    them. Based on what you have learned previously, you should be able to tell the
    names of flowers if they have the characteristics of the known flowers.


    In general, the more training pictures with you have looked at during the learning
    time, the more accurate you will likely be when you try to name flowers in the
    new pictures. Conceptually, this is how supervised ML works. The following figure
    (Figure 1.1) shows a labeled dataset being fed into a computer vision algorithm
    to train an ML model:


    ![](img/bd21298357d8484151447cff0b2f138b_23_0.png)


    Figure 1.1 – Supervised ML'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Supervised ML is mainly used for classification tasks that assign a label from
    a discrete set of categories to an example (for example, telling the names of
    different objects) and regression tasks that predict a continuous value (for example,
    estimating the value of something giving supporting information). In the real
    world, the majority of ML solutions are based on supervised ML techniques. The
    following are some examples of ML solutions that use supervised ML:


    +   - Classifying documents into different document types automatically, as part
    of a document management workflow. The typical benefits of ML-based document processing
    are the reduction of manual effort, which reduces costs, faster processing time,
    and higher processing quality.

    - Assessing the sentiment of news articles to help understand the market perception
    of a brand or product or facilitate investment decisions.

    - Automating the objects or faces detection in part as a media image processing
    workflow. The business benefits this delivers are cost-saving from the reduction
    of human labor, faster processing, and higher accuracy.

    - Predicting the probability that someone will default on a bank loan. The business
    benefits this delivers are faster decision-making on loan application reviews
    and approvals, lower processing costs, and a reduced impact on a company''s financial
    statement due to loan defaults.


    # # Unsupervised ML


    Unsupervised ML is a type of ML where an ML algorithm is provided with input data
    features without labels. Let''s continue with the flower example, however in this
    case, you are now only provided with the pictures of the flowers and their names.
    In this scenario, you will not be able to figure out the names of the flowers,
    regardless of how much time you spend looking at the pictures. However, through
    visual inspection, you should be able to identify the common characteristics (for
    example, color, size, and shape) of different types of flowers across the pictures,
    and group flowers with common characteristics in the same group.


    This is similar to how unsupervised ML works. Specifically, in this particular
    case, you have performed the clustering task in unsupervised ML:'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/bd21298357d8484151447cff0b2f138b_25_0.png)


    Figure 1.2 – Unsupervised ML


    In addition to the clustering technique, there are many other techniques in unsupervised
    ML. Another common and useless unsupervised ML technique is **dimensionality reduction**,
    where a smaller number of transformed features represent the original set of features
    while maintaining the critical information from the original features so that
    they can be largely reproduced in the number of data dimensions and size. To understand
    this more intuitively, let''s take a look at Figure 1.3:


    ![](img/bd21298357d8484151447cff0b2f138b_25_1.png)


    Figure 1.3 – Reconstruction of an image from reduced features


    In this figure, the original picture on the left is transformed to the reduced
    representation in the middle. While the reduced representation does not look like
    the original picture at all, it still maintains the critical information about
    the original picture, so that when the picture on the right is reconstructed using
    the reduced representation, the reconstructed image looks almost the same as the
    original picture. The process that transforms the original picture to the reduced
    representation is called dimensionality reduction.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The main benefits of dimensionality reduction are reduction of the training
    dataset and that it speed up the model training. Dimensionality reduction also
    helps visualize high dimensional datasets in lower dimensions (for example, reducing
    the dataset to three dimensions to be plotted and visually inspected).


    Unsupervised ML is mainly used for recognizing patterns within a dataset. Since
    unsupervised learning is not provided with actual labels to learn from, its predictions
    have greater uncertainties than the predictions made using the unsupervised ML
    approach. The following are some real-life examples of unsupervised ML solutions:


    +   - **Customer segmentation for target marketing:** This is done by using customer
    attributes such as demographics and historical engagement data. The data-driven
    customer segmentation approach is usually more accurate than human judgment, which
    can be biased and subjective.


    +   - **Computer network intrusion detection:** This is done by detecting outlier
    patterns that are different from normal network traffic patterns. Detecting anomalies
    in network traffic manually and rule-based processing is extremely challenging
    due to the high volume and changing dynamics of traffic patterns.


    +   - **Reducing the dimensions of datasets:** This is done to visualize them
    in a 2D or 3D environment to help understand the data better and more easily.


    # # Reinforcement learning


    Reinforcement learning is a type of ML where an ML model learns by trying different
    actions and adjusts its behaviors sequentially based on the received response
    from the action. For example, suppose you are playing a space invader video game
    for the first time without knowing the game’s rules. In that case, you will initially
    try different actions randomly using the controls, as moving left and right or
    shooting the cannon. As different moves are made, you will see responses to your
    moves, such as getting killed or killing the invader, and you will also see your
    score increase or decrease. Through these responses, you will know what a good
    move is versus a bad move in order to stay alive and increase your score. After
    much trial and error, you will eventually be a very good player of the game. This
    is basically how reinforcement learning works.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'A very popular example of reinforcement learning is the AlphaGo computer program,
    which uses mainly reinforcement learning to learn how to play the game of Go.
    Figure 1.4 shows the flow of reinforcement learning where an agent (for example,
    the player of a space invader game) takes actions (for example, moving the left/right
    control) in the environment (for example, the current state of the game) and receives
    rewards or penalties (score increase/decrease). As a result, the agent will adjust
    its moves to maximize the rewards in the future states of the environment. This
    cycle continues for a very large number of rounds, and the agent will improve
    and become better over time:


    ![](img/bd21298357d8484151447cff0b2f138b_27_0.png)


    Figure 1.4 – Reinforcement learning


    There are many practical use cases for reinforcement learning in the real world.
    The following are some examples for reinforcement learning:


    +   * Robots or self-driving cars learn how to walk or navigate in unknown environments
    by trying out different moves and responding to the received results.

    * A recommendation engine optimizes product recommendations with adjustments based
    on the feedback of the customers to different product recommendations.

    * A truck delivery company optimizes the delivery route of its fleet to determine
    the delivery sequence required to achieve the best rewards, such as the lowest
    cost or shortest time.'
  merge: -1
