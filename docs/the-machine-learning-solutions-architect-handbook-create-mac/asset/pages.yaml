    # # Amazon Personalize


    Personalized recommendations can help you optimize user engagement and revenues
    for many businesses such as e-commerce, financial product recommendation, and
    media content delivery. **Amazon Personalize** allows you to build personalized
    recommendation models using your data. You can use Personalize as the recommendation
    engine to power product and content recommendations based on individual tastes
    and behaviors. At a high level, the Personalize service provides the following
    three core functionalities:


    +   **User personalization**: Predicts the items a user will interact with or
    explore

    - **Similar items**: Computes similar items based on the co-occurrence of items
    and item metadata

    - **Personalized re-ranking**: Re-ranks the input list of items for a given user


    Amazon Personalize does not provide pre-trained models for recommendations. Instead,
    you need to train custom models using your data with the built-in algorithms provided
    by Personalize. To train a personalized model, you need to provide three datasets:


    +   **Item dataset**: The item dataset contains the attributes of the items you
    want to recommend. This dataset helps Personalize learn about the contextual information
    about the items for better recommendations. This dataset is optional.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '+   - User dataset: The user dataset contains attributes about the users. This
    allows Personalize to have a better representation of each user to provide highly
    personalized recommendations. This dataset is also optional.


    +   - User-item interaction dataset: This is a required dataset, and it provides
    the historical interaction between users and items, such as viewing a movie or
    purchasing a product. Personalize uses this data to learn the behaviors of individual
    users towards different items to generate highly personalized recommendations.


    To help understand how Personalize works, let''s review some of the main Personalize
    concepts:


    +   - Dataset group: Dataset group contains the related datasets (item, user,
    and interaction dataset) for model training.


    +   - Recipe: A recipe is the ML algorithm that''s used for model training. Personalize
    provides multiple recipes for the three main functionalities.


    +   - Solution: A solution represents a trained Personalize model.


    +   - Campaign: A Personalize campaign is a hosted endpoint for a trained Personalize
    model to handle recommendation and ranking requests.


    To train and deploy a custom model using Personalize, you must follow these steps:


    +   1. **Prepare and ingest the dataset**: In this step, you prepare the dataset
    in the required format, store it in S3, and then load the dataset into Personalize.
    There are three API actions involved in this step – `CreateDatasetGroup`, `CreateDataset`,
    and `CreateDatasetJob`. `CreateDatasetGroup` creates an empty dataset group. `CreateDataset`
    adds datasets (for example, item dataset, and interaction dataset) to a dataset
    group, and `CreateDatasetJob` kicks a data ingestion job to load data from S3
    to the Personalize repository for subsequent model training.


    +   2. **Pick a recipe for model training**: In this step, you choose a recipe
    (ML algorithm) to use for the different model training processes. There are multiple
    recipe options available for user personalization, related items, and personalized
    ranking. You can use the `ListRecipes` API to get the full list of recipes.


    +   3. **Create a solution**: In this step, you configure a solution with the
    dataset group and recipe for the model training job using the `CreateSolution`
    API. Then, you use the `CreateSolutionVersion` API to kick off the training job.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '4. **Evaluate the model:** In this step, you evaluate the model metrics and
    determine if they meet the performance target. If they do not, consider retraining
    the model using higher-quality and/or more data. Personalize outputs several evaluation
    metrics for the trained models, such as coverage, mean reciprocal recall, precision,
    and normalized discounted cumulative gain. You can find more details about these
    metrics at https://docs.aws.amazon.com/personalize/latest/dg/working-with-training-metrics.html.
    The performance metrics are available in the Personalize management console. You
    can also get the metrics programmatically using the GetSolutionMetrics API.


    5. **Create a campaign:** In this final step, you deploy a solution (trained model)
    to the prediction endpoint so you can use it in your applications. To do this,
    you can use the CreateCampaign API. You can also provide additional configurations
    such as the **minimum provisioned transaction per second (minProvisionedTPS)**
    throughput, as well as item exploration configuration. Item exploration configuration
    allows Personalize to show a percentage of random items to users not on user personalization.
    The idea is to let users explore items they have not interacted with to gauge
    interest. The item exploration configuration is only applicable for user personalization.


    You can use the Personalize management console to build Personalize solutions
    and campaigns. Alternatively, you can use boto3 to access the Personalize API.
    The following code sample shows the Python syntax for creating a campaign. You
    can find the full list of boto3 APIs for Personalize at https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/personalize.html:


    ```

    import boto3

    client = boto3.client(''personalize'')

    response = client.create_campaign(

    name=''name of the campaign'',

    solutionArn=''AWS Arn to the solution'',

    minProvisionedTPS=<provisioned TPS>,

    campaignConfig={

    ''itemExplorationConfig'': {

    ''<name of configuration>'': ''<value of configuration>''

    }}))

    ```'
  merge: -1
  img_proc: true
