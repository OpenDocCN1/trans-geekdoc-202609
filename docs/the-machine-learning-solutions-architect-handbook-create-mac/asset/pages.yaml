- pgno: 210
  md: '# Registering models with a model registry


    A model registry is an important component in model management and governance,
    and it is a key link between the model training stage and the model deployment
    stage. There are several open source options for implementing a model registry
    in an ML platform, and in this section, we will take a look at the MLflow model
    registry for model management.


    # The MLflow model registry


    MLflow is an open source ML platform, and it is designed for managing the stages
    of the ML life cycle, including experiment management, model management, reproducibility,
    and model deployment. It has the following four main components:


    +   - Experiment tracking

    - ML project packaging

    - Model packaging

    - Model registry


    The model registry component of MLflow provides a central model repository for
    saved models. It captures model details such as model lineage, model version,
    annotation, and description, and also captures model stage transitions from staging
    to production (the status of the model state is clearly described).


    To use the MLflow model registry in a team environment, you need to set up an
    MLflow tracking server with a database as a backend and storage for the model
    artifacts. MLflow provides a UI and an API to interact with its core functionality,
    including its model registry. Once the model is registered in the model registry,
    you can add, modify, update, transition, or delete the model through the UI or
    the API. The following figure shows an architecture setup for MLflow tracking
    server and its associated model registry:


    ![](img/bd21298357d8484151447cff0b2f138b_210_0.png)


    Figure 7.2 – The MLflow tracking server and model registry'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'One of the main drawbacks of the MLflow model registry is that it does not
    support user permission management, so any user with access to the tracking server
    will be able to access and manage all the models in the registry. An external
    entitlement layer will be implemented to manage user-based access to different
    resources in the registry. The MLflow tracking server does not provide built-in
    authentication support either, so an external authentication server, such as Nginx,
    is needed to provide authentication support.


    # Serving models using model serving services


    After a model is trained and saved, you can use it for generating predictions
    by simply loading the saved model into an ML package and calling the model prediction
    function supported by the package. However, for large-scale and complex model
    serving requirements, you will need to consider implementing a dedicated serving
    infrastructure to meet those needs. Now, let''s take a look at several open source
    model serving frameworks.


    # The Gunicorn and Flask inference engine


    **Gunicorn** and **Flask** are often used for building custom model-serving web
    frameworks. The following figure (Figure 7.3) shows a typical architecture that
    uses Flask, Gunicorn, and Nginx as the building blocks for a model serving service.


    ![](img/bd21298357d8484151447cff0b2f138b_211_0.png)


    Figure 7.3 – A model serving architecture using Flask and Gunicorn'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Flask is a Python-based micro web framework for building web apps quickly.
    It is lightweight and has almost no dependencies on external libraries. With Flask,
    you can define different invocation routes and associate handler functions to
    handle different web calls (such as health checks and model invocation calls).
    To handle model prediction requests, the Flask app would load the model into memory
    and call the predict function. Flask comes with a built-in web server, but it
    does not scale well as it can only support one request at a time.


    This is where Gunicorn comes in. Gunicorn is a web server for hosting web apps
    (such as the Flask apps), and it can handle multiple requests in parallel and
    distribute the traffic to the hosted web apps efficiently. When it receives a
    web request, it will invoke the hosted Flask app to handle the request (such as
    invoking the function to generate model prediction).


    In addition to serving prediction requests as web requests, an enterprise inference
    engine also needs to handle traffic (such as SSL/TLS traffic), as well as load
    balancing when there are multiple servers. This is where Nginx can serve as a
    load balancer for multiple web servers and can handle termination for SSL/TLS
    traffic more efficiently, so servers do not have to handle it.


    A Flask/Gunicorn-based model serving architecture can be a good option for hosting
    simple serving patterns. But for more complicated patterns, as serving different
    versions of models, A/B testing, or large model serving, this architecture will
    have limitations. The Flask/Gunicorn architecture pattern also requires custom
    code (such as the Flask app) to work, as it does not provide built-in support
    for the different ML models.


    Next, let''s review some purpose-built model serving frameworks and see how they
    are different from the custom Flask-based inference engine.


    # The TensorFlow Serving framework


    TensorFlow Serving is a production-grade, open source model serving framework,
    and provides out-of-the-box support for serving TensorFlow models behind a RESTful
    endpoint. It manages the model life cycle for model serving and provides access
    to versioned and multiple models behind a single endpoint. There is also built-in
    support for canary deployments. A canary deployment allows you to deploy a model
    to support a subset of traffic. In addition to the real-time inference support,
    there is also a batch scheduler feature that can batch multiple prediction requests
    and perform a single joint execution. With TensorFlow Serving, there is no need
    to write custom code to serve the model. The following figure (Figure 7.4) shows
    the architecture of TensorFlow Serving:'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/bd21298357d8484151447cff0b2f138b_213_0.png)


    Figure 7.4 – TensorFlow Serving architecture


    The API handler provides APIs for TensorFlow Serving. It comes with a built-in,
    lightweight HTTP server to serve RESTful-based API requests. It also supports
    **gRPC (a remote procedure call)** traffic. gRPC is a common and fast networking
    protocol, but it is more complicated to use the REST protocol. TensorFlow Serving
    has a concept called a *servable*, which refers to the actual objects that handle
    a task, such as model inferences or lookup tables. For example, a trained model
    is represented as a *servable*, and it can contain one or more algorithms and
    lookup tables or embeddings tables. The API handler uses the servable to fulfill
    client requests.


    *The model manager* manages the life cycle of servables, including loading the
    servables, serving the servables, and unloading the servables. When a servable
    is needed to perform a task, the model manager provides the client with a handler
    to access the servable instances. The model manager can manage multiple versions
    of a servable. This allows gradual rollout of different versions of a model.


    *The model loader* is responsible for loading models from different sources, such
    as **Amazon S3**. When a new model is loaded, the model loader notifies the model
    manager about the availability of the new model, the model manager will decide
    what the next step should be (such as unloading the previous version and loading
    the new version).


    TensorFlow Serving can be extended to support non-TensorFlow models. For example,
    models trained in other frameworks can be converted to the ONNX format and served
    using TensorFlow Serving. ONNX is a common format for representing models to support
    interoperability across different ML frameworks.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# The TorchServe serving framework


    **TorchServe** is an open source framework for serving PyTorch models. Similar
    to TensorFlow Serving, TorchServe provides a REST API for serving models with
    its built-in web server. With core features such as multi-model serving, model
    versioning, server-side request batching, and built-in monitoring, TorchServe
    can serve production workloads at scale. There is also no need to write custom
    code to host PyTorch models with TorchServe. TorchServe comes with a built-in
    web server for hosting the model. The following figure (Figure 7.5) shows the
    architecture of the components of the TorchServe framework:


    ![](img/bd21298357d8484151447cff0b2f138b_214_0.png)


    Figure 7.5 – TorchServe architecture


    The inference API is responsible for handling prediction requests from client
    applications using loaded PyTorch models. It supports the REST protocol and provides
    a prediction API, as well as other supporting APIs such as health check and model
    explanation APIs. The inference API can handle prediction requests for multiple
    models.


    The model artifacts are packaged into a single archive file and stored in a model
    store within the TorchServe environment. You use a **command-line interface (CLI)**
    command called `torch-archive` to package the model.


    The TorchServe backend loads the archived models from the model store into different
    worker processes. These worker processes interact with the inference API to process
    requests and send back responses.


    The management API is responsible for handling management tasks such as registering
    and unregistering PyTorch models, checking the model status, and scaling worker
    process. The management API is normally used by system administrators.


    TorchServe also provides built-in support for logging and metrics. The logging
    component logs both access and processing logs. The TorchServe metrics collect
    a list of system metrics, such as CPU/GPU utilization and custom model metrics.'
  merge: -1
