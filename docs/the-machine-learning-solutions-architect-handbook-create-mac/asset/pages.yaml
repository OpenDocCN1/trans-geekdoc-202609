- pgno: 98
  md: '# Generative pre-trained transformer


    Unlike BERT, which requires fine-tuning using a large domain-specific dataset
    for the different downstream NLP tasks, the Generative Pre-trained Transformer
    (GPT), developed by OpenAI, can learn to perform a task with just seeing a few
    examples (or no example). This learning process is called few-shot learning or
    zero-shot learning. In a few-shot scenario, the GPT model is provided with a few
    examples, a task description, and a prompt, and the model will use these inputs
    and start to generate output tokens by one. For example, using GPT-3 for a translation
    task, an example of definition would be translate English to Chinese. The training
    data would be few examples of Chinese sentences translated from the English sentences.
    To use the model to translate a new English sentence, you provide the English
    sentence as a prompt, and the model will generate the translated text in Chinese.
    Note that, unlike the fine-tuning technique, few-shot or zero-shot learning does
    not update the model parameter weights.


    GPT also uses Transformer as its main building block, and it is trained using
    next word prediction – given a sequence of inputs, it predicts the word that should
    appear at the end of the sequence. Unlike BERT, which uses the Transformer encoder
    block, GPT uses the Transformer decoder block only. Similar to BERT, GPT also
    uses masked words to learn embeddings. However, it is different from BERT in that
    it does not randomly select masked words and predict the meanings. Instead, it
    does not allow the self-attention mechanism to have access to words the right
    of the target word to be calculated – this can be called masked self-attention.


    The latest version of GPT is GPT-3, and it has shown very impressive results in
    a number of traditional NLP tasks, such as language modeling, language translation,
    and question answering, as well as many novel use cases, such as generating programming
    code or ML code, writing websites, and plot charts.


    # Latent Dirichlet Allocation algorithm


    Topic modeling is the process of discovering common topics from a large number
    of documents and determining what topics a document contains. A topic is usually
    presented by the associated top words such as sport, player, coach, or NHL. Topic
    modeling is a very important natural language processing technique for document
    understanding, information retrieval, and document tagging and classification.
    A document can have one or more topics present in the content. The following figure
    shows the relationship between a document and various topics associated with the
    document:'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Document

    Topic


    ![](img/bd21298357d8484151447cff0b2f138b_99_0.png)


    Figure 3.15 – Topic modeling


    Latent Dirichlet Allocation (LDA) is one of the most popular ML algorithms for
    topic modeling. It works by calculating the probability of a word belonging to
    a topic and the probability of a topic belonging to a document. Let''s explain
    how this works conceptually with an example. Say you have a large number of documents,
    and documents, as you go through these documents, you want to identify words that
    frequently appear together in word clusters. Based on the count of word occurrences
    in a cluster, you can calculate the probabilities of different words belonging
    to a cluster (topic). The words with high probabilities would be considered top
    words that represent a topic. With a topic defined, you can then calculate the
    probability of a topic belonging to a document. With LDA, you specify the number
    of topics to be discovered as input, and the output of LDA is a list of topics
    weighted by their probability and a list of topics associated with each document.


    LDA has many practical uses in the real world, as summarizing a large number of
    documents to a list of top topics and document tagging and classification. LDA
    is an unsupervised algorithm, and it discovers topics automatically. Its disadvantage
    is that it is hard to measure the overall quality of the model (that is, it is
    difficult to know if the topics generated are informative or not). You also need
    to tune the number of topics and interpret the result with a human-readable name
    for each topic produced by the model.


    # Generative model


    A generative model is a type of ML model that can generate new data. For example,
    BERT and GPT are generative models, as they can generate new text. ML models like
    linear regression or MLP are called discriminative models in that they discriminate
    between different kinds of data instances, such as classifying something as one
    class or the other. Generative models model the joint probability, while a discriminative
    model models conditional probability.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Generative adversarial network


    The **generative adversarial network** (GAN) is a generative model that tries
    to generate realistic data instances, such as images. It works by having a discriminative
    network (**Discriminator**) learning to tell if the instances generated by a *Generator*
    network are real or fake:


    ![](img/bd21298357d8484151447cff0b2f138b_100_0.png)


    Figure 3.16 - Generative adversarial network


    During training, the Discriminator network is provided with two sources – one
    from a real source, used as positive examples, and one from the Generator source,
    the negative samples. The Discriminator will be trained to distinguish the real
    sample from the fake sample as a classifier, and it will optimize its loss to
    produce real/fake samples correctly from both sources. On the other hand, the
    Generator will be trained to produce fake data that the Discriminator cannot tell
    is real, and it will be penalized when when the Discriminator was able to tell
    its generated data is fake. Both networks learn using backpropagation. To generate
    data, the Generator is provided with random inputs. During training, the Generator
    and Discriminator are trained alternatively to allow both networks to train as
    single connected network.


    GAN has had a lot of success recently in generating realistic images that can
    fool humans. For example, it can be applied to many applications, such as translating
    sketches to realistic-looking images, converting text inputs and generating images
    corresponding to the text, and generating realistic human faces.


    Now you have completed an overview of the different ML algorithms and deep learning
    networks. Next, let''s practice with a hands-on exercise.'
