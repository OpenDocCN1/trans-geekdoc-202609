    need to make decisions on the next content based on factors such as estimated
    performance, revenue, and profitability. Filmmakers adopt ML-based predictive
    analytics to help predict the popularity and profitability of new ideas by analyzing
    factors such as casts, scripts, the past performance of different films, and target
    audience. This allows producers to quickly eliminate ideas with small market potential
    to focus their effort on developing more promising and profitable ideas.


    Support personalized content viewing needs, content producers often segment video
    content into smaller micro-segments around events, scenes, or actors, that they
    can be distributed individually or repackaged into something more personalized
    to individual preferences. This ML-based approach can be used for creating video
    clips by detecting elements as scenes, actors, and events for the different target
    audiences with different tastes and preferences.


    # Content management and discovery


    M&E companies with large digital content assets need to curate their content to
    create new content for new monetization opportunities. To do that, these companies
    need rich metadata for the digital assets to enable different content to be searched
    and discovered. Consumers also need to search for content easily and accurately
    for different usages, such as for personal entertainment or research. Without
    metadata tagging or the ability to understand the content, it is quite challenging
    to discover relevant content. Many companies hire humans to review and tag this
    content with meaningful metadata for discovery as part of the digital asset management
    workflow. Since manual tagging is very costly and time-consuming, most content
    is not tagged with sufficient metadata to support effective content management
    and discovery.


    Computer vision models can automatically tag image and video content for items
    such as objects, genres, people, places, or themes. ML models can also interpret
    the meaning of textual content such as topics, sentiment, entities, and sometimes
    video. Audio content also needs to be transcribed into text for additional text
    analysis, such as summarization. Machine learning-based text summarization can
    help you summarize long text as part of the content metadata generation. The following
    diagram shows where ML-based analysis solutions fit into the media asset management
    flow:'
