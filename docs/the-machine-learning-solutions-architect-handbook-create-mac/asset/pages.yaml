- pgno: 62
  md: '# ML use cases in manufacturing


    Manufacturing is an industry sector that produces tangible finished products.
    It includes many sub-sectors such as consumer goods, electronics goods, industrial
    equipment, automobiles, furniture, building materials, sports goods, clothing,
    and toys. There are multiple stages in a typical product manufacturing life cycle,
    including product design, prototyping, manufacturing and assembling, and post-manufacturing
    service and support. The following diagram shows the typical business functions
    and flow in the manufacturing sector.


    ![](img/bd21298357d8484151447cff0b2f138b_62_0.png)


    Figure 2.16 – Manufacturing business process flow


    AI and ML have played an essential role in the manufacturing process, such as
    sales forecasting, predictive machine maintenance, quality control and robotic
    automation for manufacturing quality and yield, and process and supply chain optimization
    to improve overall operational efficiency.


    # Engineering and product design


    Product design is the process where a product designer combines their creative
    power, the practical needs of market/consumers, and constraints to develop a product
    that will be successful once it has been launched. Designers often need to create
    many different variations of a new product concept during the design phase that
    will meet different needs and constraints. For example, in the apparel industry,
    fashion designers would analyze the needs and preferences of customers, such as
    color, texture, and styles, and develop these designs and generate the graphics
    for the apparel.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'The manufacturing industry has been leveraging generative design ML technology
    to assist with new product concept design. For example, ML techniques such as
    Generative Adversarial Networks (GANs) have been used to generate graphics for
    logo design and 3D industrial components such as machinery gears. The following
    diagram shows the basic concept of a GAN, where a generator model is trained to
    create fake images that fool a discriminator. After the generator becomes good
    enough to fool the discriminator, it can be used to generate new images for items
    such as clothing.


    ![](img/bd21298357d8484151447cff0b2f138b_63_0.png)


    Figure 2.17 – GAN concept for generating realistic fake images


    In addition to generative design, ML techniques have also been used to analyze
    market requirements and estimate new products'' market potentials.


    # # Manufacturing operations – product quality and yield


    Quality control is an important step in the manufacturing process to ensure a
    product''s quality before it is shipped. Many manufactures rely on humans to inspect
    the manufactured products, which is highly time-consuming and costly. For example,
    factory workers would visually inspect the products for surface scratches, missing
    parts, color differences, and deformations.


    Computer vision-based technology has been used to automate many aspects of the
    manufacturing lines'' quality control process. For example, a computer object
    detection model can be trained using labeled image data to help identify the objects
    to be inspected from the captured images, and then a computer vision-based defective
    model can be trained using images labeled with good parts and bad parts to help
    inspect detected objects and classify them as either defective or not defective.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Manufacturing operations – machine maintenance


    Industrial manufacturing equipment and machinery need regular maintenance to ensure
    smooth operations. Any unplanned outages due to equipment failures would not only
    result in high repair or replacement costs, but they would also disrupt production
    schedules, impacting delivering to downstream tasks or customers. While following
    a regular maintenance schedule would alleviate this problem to a certain extent,
    having the ability to forecast potential problems in advance would further reduce
    the risk of any unforeseen failures.


    Machine learning-based predictive maintenance analytics help reduce the risk of
    potential failures by predicting whether a piece of equipment will likely fail
    within a time window using a variety of data, such as telemetry data collected
    by **Internet of Things (IoT)** sensors. The maintenance crew can use the prediction
    results and take proactive maintenance actions to prevent disruptive failure.


    # ML use cases in retail


    Retail businesses sell consumer products directly to customers through retail
    stores or e-commerce channels. They get supplies through wholesale distributors
    or from manufacturers directly. The industry has been going through some significant
    transformations. While e-commerce is growing much faster than traditional retail
    brick-and-mortar stores are also transforming in-store shopping experiences to
    stay competitive. Retailers are looking for new ways to improve the overall shopping
    experience through both physical and digital channels. New trends such as social
    commerce, augmented reality, virtual assistant shopping, smart stores, and 1:1
    personalization are becoming some of the key differentiators among retail businesses.


    AI and ML are a driving force behind the retail industry''s transformation, from
    inventory optimization and demand forecasting to highly personalized and immersive
    shopping experiences such as personalized product recommendations, virtual reality
    shopping, and cashier-less store shopping. In addition, AI and ML are also helping
    retailers fight crimes such as fraud and uplifting.


    # Product search and discovery


    When consumers shop online and need to search for a particular product, they rely
    on search engines to find the product on various e-commerce websites. This greatly
    simplifies the shopping experience when you know the name or certain attributes
    of the products to search for. However, sometimes, you only have a picture of
    the product and do not know what correct terms to search for.'
