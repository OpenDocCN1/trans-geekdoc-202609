    Figure 12.6 – Monitoring architecture for Amazon Personalize


    With this monitoring architecture, CloudWatch collects metrics from Personalize
    service. A scheduled CloudWatch event triggers a lambda function, which pulls
    a set of CloudWatch metrics and sends events to the EventBridge service. EventBridge
    rules can be configured to trigger lambda functions to update Personalize configuration,
    such as update minProvisionedTPS configuration for Personalize when throttling
    is detected or send an email notification when certain errors occur.


    You can also add similar monitoring architecture patterns to other AI services,
    such as Comprehend and Rekognition.


