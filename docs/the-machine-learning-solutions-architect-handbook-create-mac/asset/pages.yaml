  img_proc: true
- pgno: 65
  md: 'Deep learning-powered visual search is a technology that can help you quickly
    identify and return similar-looking products from a picture of an item. Visual
    search technology works by creating a digital representation (also known as encoding/embedding)
    of the item’s pictures and stores them in a high-performance item index. When
    a shopper needs to find a similar-looking item using a picture, the new picture
    is encoded into a digital representation, and the digital representation is searched
    against the item index using efficient distance-based comparison. The items that
    are the closest to the target items are returned. The following diagram shows
    an architecture for building an ML-based image capability:


    ![](img/bd21298357d8484151447cff0b2f138b_65_0.png)


    Figure 2.18 – Image search architecture


    Visual search-based recommendations have been adopted by many large e-commerce
    sites such as Amazon.com to enhance the shopping experience.


    # Target marketing


    Retailers use different marketing campaigns and advertising techniques, such as
    direct marketing email or digital advertisements, to target prospective shoppers
    with incentives or discounts based on the shopper’s segments. These campaigns’
    effectiveness heavily depends on the right customer targeting to achieve a high
    conversion rate, all while reducing the campaign’s cost or advertising and generating
    less user disturbance.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Segmentation is one traditional way to understand the different customer segments
    to improve marketing campaigns'' effectiveness. There are different ways to do
    segmentations with machine learning, as unsupervised clustering of customers based
    on data such as basic demographic data. This allows you to group customers into
    several segments and create unique marketing campaigns for each segment.


    A more effective marketing approach is to use highly personalized user-centric
    marketing campaigns. We work by creating accurate individual profiles using large
    amounts of individual behavior data such as historical transaction data, responses
    data to historical campaigns, and alternative textual data such as social media
    data. Highly personalized campaigns with customized marketing messages can be
    generated using these profiles for a higher conversion rate. The ML approach to
    user-centric target marketing predicts the conversion rate, such as the click-through
    rate (CTR), for different users and sends ads to users with a high conversion
    rate. This can be a classification or regression problem by learning the relationship
    between the user features and the probability of conversion.


    Contextual advertising is another way to reach the target audience by placing
    advertisements such as display ads or video ads on web pages that match the advertisement''s
    content. An example of contextual advertising is to place product advertisements
    on cooking recipe sites. Because the ads are highly relevant to the content, they
    will likely resonate with the visitors'' readers and result in a much higher click-through
    rate. ML can help with detecting ads from a context so that the ads are placed
    correctly. For example, computer vision models can detect objects, people, and
    themes in video ads to extract contextual information and match them to the website''s
    content.


    # # Sentiment analysis


    Retail businesses often need to understand the perception of their brand from
    their consumers'' point of view. Positive and negative sentiments towards a retailer
    could greatly improve or damage a retail business. As more online platforms are
    becoming available, it is easier than ever for consumers to voice their feelings
    towards a product or business from their real-life experiences. Retail businesses
    are adopting different techniques to assess their customer''s feelings and emotions
    towards their product and by analyzing feedback solicited from their shoppers
    or analyzing their social media channels. Effective sentiment analysis can help
    identify areas for improvement, such as operational and product improvement, as
    well as for gathering intelligence in relation to potentially malicious brand
    reputation attacks.'
  merge: -1
  img_proc: true
