  md: '# Customer self-service automation with intelligent search


    Good customer service boosts customer satisfaction and builds long-term customer
    loyalty. However, customer support is labor-intensive and can result in poor customer
    satisfaction due to long waiting times and unknowable support agents. The customer
    self-service capability has been widely adopted by organizations in different
    industries to deflect customer support call volumes and improve customer satisfaction.


    In a customer self-service scenario, we can identify the following ML problems:


    +   - **Automatic speech recognition (ASR)**: This ML task recognizes human speech
    and converts it into text, and then uses NLU to understand the meaning of the
    text.

    - **Natural language understanding (NLU)**: NLU is a subfield of NLP, and it deals
    with intent understanding and reading comprehension. NLU focuses on the meaning
    and intent of the text. For example, if the text is *Can I get the cash balance?*,
    then the intent is *get account balance*. Another example of NLU is understanding
    the text and extracting specific information from based on the semantic meaning
    of the question and the text.

    - **Text to speech**: This ML task converts text into natural human voices.


    The following diagram shows a sample architecture for implementing a self-service
    chat functionality for customers to look up customer-related details, as well
    as general information and FAQs:


    ![](img/bd21298357d8484151447cff0b2f138b_403_0.png)


    Figure 12.4 – Self-service chat portal with an intelligent virtual assistant'
