  md: '# # Sales trading and research


    In sales trading, a firm''s sales staff monitors investment news as earnings reports
    or M&A activities and looks for investment opportunities to pitch to their institutional
    clients. The trading staff then executes the trades for their clients, also known
    as agency trading. Trading staff can also execute trades for the firm they work
    for, also known as prop trading. Trading staff often need to trade large quantities
    of securities. So, it is crucial to optimize the trading strategy to acquire the
    shares at favorable prices without driving up prices. Sales and trading staff
    are supported by research teams focus on researching and analyzing equities and
    fixed income assets and provide their recommendations to sales and trading staff.


    Another type of trading is algorithmic trading, where a computer is used for trading
    securities automatically based on predefined logic and market conditions. Some
    of the core challenges in sales trading and research are as follows:


    +   - A tight timeline is faced by research analysts to deliver a research report.

    - Gathering a large amount of market information to collect and analyze trading
    strategies and make an informed trading decision.

    - The markets need to be constantly monitored to adjust the trading strategy.

    - Achieving the optimal trading at the preferred price without driving the market
    up or down. The following diagram shows the business flow of a sales trading desk
    and how different players interact to complete a trading activity:


