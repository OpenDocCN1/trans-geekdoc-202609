- pgno: 201
  md: '# 7 Open Source Machine Learning Platforms


    In the previous chapter, we covered how Kubernetes can be used as the foundational
    infrastructure for running machine learning (ML) tasks, such as running model
    training jobs or building data science environments such as Jupyter servers. However,
    to perform these tasks at scale and more efficiently for large organizations,
    you will need to build ML platforms with the capabilities to support the full
    data science life cycle. These capabilities include scalable data science environments,
    model training services, registries, and model deployment capabilities.


    In this chapter, we will discuss the core components of an ML platform and additional
    open source technologies that can be used for building ML platforms. We will start
    with technologies for building a data science environment that can support a large
    number of users for experiments, and then discuss other technologies for model
    training, model registries, model deployment, and ML pipeline automation.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Specifically, we will cover the following topics:


    +   - The core components of an ML platform

    - Open source technologies for building ML platforms

    - Hands-on exercise – building an ML platform with an open source ML framework


    Let''s get started by taking a quick look at the technical requirements for this
    chapter and reviewing the core components of an ML platform.


    # Technical requirements


    For the hands-on exercise in this chapter, we will continue to use the AWS Kubernetes
    environment you created in Chapter 6, Kubernetes Container Orchestration Infrastructure
    Management.


    The sample code used in this chapter can be found at https://github.com/PacktPublish/The-Machine-Learning-Solutions-Architect-Handbook/tree/main/Chapter07.


    # Core components of an ML platform


    An ML platform is a complex system that consists of multiple environments for
    running different tasks and has complex workflow processes to orchestrate. In
    addition, an ML platform needs to support many roles, such as data scientists,
    ML engineers, infrastructure engineers, and operation team members. Following
    are the core components of an ML platform:


    +   - **Data science environment**: The data science environment provides data
    analysis tools, such as Jupyter notebooks, code repositories, and ML frameworks.
    Data scientists and ML engineers mainly use the data science environment to perform
    data analysis and data science experiments, and also to build and tune models.


    +   - **Model training environment**: The model training environment provides
    a separate infrastructure for model training requirements. While data scientists
    and ML engineers can run small-scale model training directly inside their local
    Jupyter environment, they need a separate dedicated infrastructure for large-scale
    model training. Running model training in a separate infrastructure allows for
    better control of the environments for more consistent model training process
    management and model lineage management. The model training environment is normally
    managed by infrastructure engineers and operations teams.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   **Model registry**: After models are trained, they need to be tracked and
    managed in a model registry for model inventory and lineage management, versioning
    control, model discovery, and model life cycle management (such as in the staging
    environment or in the production environment). The model registry is especially
    important when you have a large number of models to manage. Data scientists can
    register models directly in the registry as they perform experiments in their
    data science environment. Models can also be registered as part of automated model
    pipeline executions.


    +   **Model serving environment**: To generate predictions using trained ML models
    for client applications, you will need to host the models in a model serving infrastructure
    behind an API endpoint in real time. This infrastructure should also support batch
    capabilities. There are different types of model serving frameworks.


    +   **Continuous integration (CI)/continuous deployment (CD) and workflow automation**:
    Lastly, we need to establish CI/CD and workflow automation capabilities to streamline
    the data processing, model training, and deployment processes, which in turn will
    increase the ML deployment velocity, consistency, reproducibility, and observability.


    In addition to these core components, there are other platform architecture factors
    to consider, such as security and authentication, logging and monitoring, and
    governance and control. In the following sections, we will discuss open source
    technologies that can be used to build an end-to-end ML platform.


    # # Open source technologies for building ML platforms


    While it is possible to run different ML tasks by creating and deploying different
    standalone ML containers in a Kubernetes cluster, this can become complex to manage
    when you have to do at scale for a large number of users and ML workloads. This
    is where open source technologies such as Kubeflow, MLflow, Seldon Core, GitHub,
    and Airflow come in. Next, let''s take a closer look at how these open source
    technologies can be used for building data science environments, model training
    services, model inference services, and ML workflow automation.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Using Keflow for data science environments


    Keflow is a Kubernetes-based, open source ML platform that provides a number of
    ML-specific components. Keflow runs on top of Kubernetes and provides the following
    capabilities:


    +   * A central UI dashboard

    * A Jupypter notebook server for code authoring and model building

    * A Kubeflow pipeline for ML orchestration

    * KFServing for model serving

    * Training operators for model training


    The following figure (Figure 7.1) shows how Kubeflow can provide the various components
    needed for a data science environment. Here, we will focus on its science for
    Jupypter notebook servers.


    ![](img/bd21298357d8484151447cff0b2f138b_204_0.png)


    Figure 7.1 - A Kubeflow-based data science environment'
  merge: -1
  img_proc: true
- pgno: 205
  md: "Kubeflow provides a multi-tenant Jupyter notebook server environment with built-in\
    \ authentication and authorization support. Let's discuss each of these core components\
    \ in detail:\n\n+   **Jupyter notebook:** As a data scientist, you can use the\
    \ Kubeflow Jupyter notebook to explore data and build models inside the Jupyter\
    \ notebook. Kubeflow can spawn multiple notebook servers, with each belonging\
    \ to a Kubernetes namespace that corresponds to a team, project, or user. Each\
    \ notebook server runs a container inside a Kubernetes Pod. By default, a Kubeflow\
    \ notebook server provides a list of notebook container images hosted in public\
    \ image repositories to choose from. You can also create custom notebook container\
    \ images to run custom notebook servers. To enforce standards and consistency,\
    \ Kubeflow administrators can provide a list of standard images for users to use.\
    \ When creating a notebook server, you select the namespace to run the notebook\
    \ server in, specify the Universal Resource Identifier (URI) of the container\
    \ image for the notebook server, and specify the resource requirements, such as\
    \ the number of CPUs/GPUs and memory size.\n\n+   **Authentication and authorization:**\
    \ You access the notebook server through the Kubeflow UI dashboard, which provides\
    \ an authentication service through the Dex Open Connection (OIDC) provider. Dex\
    \ is an identity service that uses OIDC to provide authentication for other applications.\
    \ Dex can federate with other authentication services such as the Active Directory\
    \ service. Each notebook is associated with a default Kubernetes service account\
    \ (default-editor) to be used for purposes (such as granting the notebook permission\
    \ to access various resources in the Kubernetes cluster). Kubeflow uses Istio-based\
    \ access control (RBAC) to control in-cluster traffic. The following YAML file\
    \ grants the default-editor service account (which is associated with the Kubeflow\
    \ notebook) access to the Kubeflow pipeline service by attaching the ml-pipeline-services\
    \ role to:\n\n```\napiVersion: rbac.istio.io/v1alpha\nkind: ServiceRoleBinding\n\
    metadata:\n  name: bind-ml-pipeline-nb-admin\n  namespace: kubeflow\nspec:\n \
    \ roleRef:\n    kind: ServiceRole\n    name: ml-pipeline-services\nsubjects:\n\
    ```"
  merge: -1
