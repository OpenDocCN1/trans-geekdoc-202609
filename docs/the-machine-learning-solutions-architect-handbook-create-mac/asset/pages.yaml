  md: '# # Part 2 – tracking experiments and models, and deploying models


    To train an ML model, you will likely need to run the training many times with
    different algorithms, hyperparameters, and data features. Soon, you''ll realize
    that it''s becoming quite difficult to keep track of everything you have done.
    As we discussed earlier, MLflow and Kubeflow tracking can be implemented anywhere
    in the training scripts from different data science environments (such as Kubeflow
    notebooks or your local machine), while Kubeflow tracks everything in the context
    of Kubeflow Pipelines. In this part of the exercise, we''ll use MLflow for experiment
    tracking and model management. Specifically, we will build the experiment tracking
    and model management architecture in the following figure (Figure 7.12):


    ![](img/bd21298357d8484151447cff0b2f138b_229_0.png)


    To get started, let''s set up a central MLflow tracking server so different data
    science environments can use all it for tracking. Complete the following steps
    to start:


    +   1. Launch an EC2 instance: We will install the MLflow tracking server on an
    EC2 instance. You can also install an MLflow tracking server as a container running
    on EKS. Launch an EC2 instance in the same AWS region you have been using. If
    you don''t know how to start an EC2 instance, follow the instructions at `https://aws.amazon.com/ec2/getting-started/`'
