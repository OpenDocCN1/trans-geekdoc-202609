- pgno: 238
  md: "# Part 3 – Automating with an ML pipeline\n\nAn ML process involves multiple\
    \ steps, including data preparation, feature engineering, model training, and\
    \ model deployment. After a data scientist completes all the experiments and model-building\
    \ tasks, the whole process should be automated using an ML pipeline. There are\
    \ various architecture and technology options to consider when you design a pipeline.\
    \ In this exercise, we use the Kubeflow Pipelines platform to orchestrate the\
    \ steps. Before we start, we will need to add some configurations to allow the\
    \ Kubeflow notebook to access the Kubeflow Pipelines service.\n\n# Giving permission\
    \ to the namespace service account to access the Istio service\n\nThe admin Kubernetes\
    \ namespace is used by the Kubeflow notebook, and it comes with a number of service\
    \ accounts, as default, default-viewer, and default-editor. When a notebook runs,\
    \ it will assume the default-editor service account. The Kubernetes Istio is a\
    \ service mesh that controls how microservices in a Kubernetes cluster interact\
    \ with each other. For the service accounts in the admin namespace to access the\
    \ Kubeflow pipeline component to run an ML pipeline, a servicebinding object needs\
    \ to be created in the Kubeflow namespace between the default-editor service account\
    \ and ServiceRole (ml-pipeline-services) object. Run the following code in the\
    \ CloudShell terminal to create a .yaml definition file. Note that admin in the\
    \ code is the admin namespace for the notebook environment:\n\n```\ncat << EOF\
    \ > notebook_rbac.yaml\napiVersion: rbac.istio.io/v1alpha\nkind: ServiceRoleBinding\n\
    metadata:\n  name: bind-ml-pipeline-nb-admin\n  namespace: kubeflow\nspec:\n \
    \ roleRef:\n    kind: ServiceRole\n    name: ml-pipeline-services\nsubjects:\n\
    \  - properties:\n      source.principal: cluster.local/ns/admin/sa/default-editor\n\
    EOF\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: "Then, run the following command to apply the configuration to the Kubernetes\
    \ environment:\n\n```\nkubectl apply -f notebook_rbac.yaml\n```\n\nThe Envoy is\
    \ the Istio proxy that handles all the inbound and outbound traffic of the service\
    \ mesh. The notebook communicates with the ml-pipeline service through the service\
    \ mesh, the header information needs to be forwarded to the ml-pipeline service\
    \ to establish the user identity from the notebook. The following .yaml file enables\
    \ that. Run the following in the CloudShell environment to create the file:\n\n\
    ```\ncat << EOF > notebook_filter.yaml\napiVersion: networking.istio.io/valpha3\n\
    kind: EnvoyFilter\nmetadata:\n  name: add-header\n  namespace: admin\nspec:\n\
    \  configPatches:\n    - applyTo: VIRTUAL_HOST\n      match:\n        context:\
    \ SIDECAR_OUTBOUND\n      routeConfiguration:\n        host:\n          name:\
    \ ml-pipeline.kubeflow.svc.cluster.local:8888\n          route:\n            name:\
    \ default\n      patch:\n      operation: MERGE\n      value:\n        request_headers_to_add:\n\
    \          append: true\n          header:\n            key: kubeflow-userid\n\
    \            value: admin@kubeflow.org\nworkloadSelector:\n  labels:\n```"
  merge: -1
  img_proc: true
