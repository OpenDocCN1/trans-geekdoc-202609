  md: '# Credit risk


    When banks issue loans to businesses and individuals, there is the potential risk
    that the borrower might not be able to pay the required payment. As a result,
    banks suffer financial loss in both principal and interest from financial activities
    such as making loans for mortgages and credit cards. To minimize this default
    risk, banks go through credit risk modeling to assess the risk of making a loan
    by focusing on two main aspects:


    +   * The probability that the borrower will default on the loan

    * The impact on the lender''s financial situation


    Traditional human-based reviews of loan applications are slow and error-prone,
    resulting in high loan processing costs and lost opportunities due to incorrect
    and slow loan approval processing.


    The following diagram shows a typical business workflow for credit risk assessment
    and the various decision points within the process:


    | Collect and Review Data | Credit Review | Collateral and Risk Assessment | Documentation
    and Approval |

    | --- | --- | --- | --- |

    | * Request document * Completeness and plausibility review | * Review documents
    * Standard credit rating * Documentation of other credit-related factors | * Determine
    loan-to-value * Evaluate risk exposure | * Complete loan application * Prepare
    credit vote * Loan approval by decision maker


    Figure 2.8 – Credit risk approval workflow


    To reduce credit risk associated with loans, many banks have widely adopted ML
    techniques to predict loan default and associated risk more accurately and quickly.
    The credit risk management modeling process requires the collection of financial
    information from borrowers, such as income, cash flow, debt, assets and collaterals,
    the utilization of credits, and other information such as loan type and loan payment
    behaviors. Since this process involves large amounts of information being extracted
    from unstructured data sources (financial statements) and then analyzed, machine
    learning-based solutions such as Optical Character Recognition (OCR) and NLP information
    extraction and understanding have been widely adopted for automated intelligence
    document processing.'
  merge: -1
