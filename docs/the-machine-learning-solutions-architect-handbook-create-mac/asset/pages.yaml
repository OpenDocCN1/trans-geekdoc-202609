    # Designing an MLOps architecture for AI services


    Implementing custom AI service models requires a data engineering, model training,
    and model deployment pipeline. This process is similar to the process of building,
    training, and deploying models using an ML platform. As such, we can also adopt
    MLOps practice for AI services when running them at scale.


    Fundamentally, MLOps for AI services intends to deliver similar benefits as MLOps
    for the ML platform, including process consistency, tooling reusability, reproducibility,
    delivery scalability, and auditability. Architecturally, we can implement a similar
    MLOps pattern for AI services.


    # AWS account setup strategy for AI services and MLOps


    To isolate the different environments, we can adopt a multi-account strategy for
    configuring the MLOps environment for AI services. The following diagram illustrates
    a design pattern for a multi-account AWS environment. Depending on your organizational
    requirement for separation of duty and control, you may also consider consolidating
    these into fewer environments:'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Designing an MLOps architecture for AI services


    ![](img/bd21298357d8484151447cff0b2f138b_405_0.png)


    Figure 1.2 - MLOps architecture for AI services on AWS


    In this multi-account AWS environment, developers use the custom model development
    environment to build and test the pipelines for data engineering, model training,
    and model deployment. When ready, the pipelines are promoted for formal model
    building and testing using production training data in the model development environment.
    Since trained AI services models cannot normally be exported, we will need to
    replicate the model training workflow in the production environment for model
    deployment.


    The shared services environment hosts CI/CD tools such as AWS CodePipeline and
    AWS CodeBuild to build different pipelines for data engineering, model building,
    and model deployment running in different environments. For example, a pipeline
    for the UAT environment could have the following components and steps:


    +   - **CodePipeline definition:** This definition would have a CodeBuild step,
    a CloudFormation execution step, and a Step Functions workflow execution step.

    - **CodeBuild step:** The CodeBuild step enriches the CloudFormation template
    with additional inputs needed to create a Step Functions workflow that orchestrates
    data engineering, dataset creation, data ingestion, model training, and model
    deployment.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '+   - CloudFormation execution step: This step executes the CloudFormation
    template to create the Step Functions workflow.


    +   - Step Function workflow execution step: This step kicks off the Step Function
    workflow to run the various steps, such as data engineering and model training,
    for the workflow. For example, if we build a Step Functions workflow for Personalize
    model training and deployment, the workflow will consist of six steps: create
    dataset group, create dataset, import dataset, create solution, create solution
    version, and create campaign.


    In a multi-account environment, there could also be other purpose-built accounts
    for data management, monitoring, and security.


    # Code promotion across environments


    Similar to the pattern we use for the ML platform, we can use a code repository
    as the mechanism to promote code to different environments. For example, during
    code development, a developer creates code artifacts such as data engineering
    scripts for Glue jobs, CloudFormation template skeletons, and builds specifications
    for CodeBuild to run different commands. When it is ready to promote for formal
    model building and testing, the developer checks the code into a release branch
    in the code repository. The check-in event can trigger a CodePipeline job to run
    the CodeBuild step in the shared services and then run a Step Functions workflow
    step in the model development environment. When it is ready for production release,
    a deployment CodePipeline job can be triggered in the shared services environment
    to execute a CloudFormation template to deploy the model in the production environment.


