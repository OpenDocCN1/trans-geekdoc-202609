    options, and pick an option that provides the optimal value (for example, the
    highest information gain). When doing a prediction, the input data will traverse
    the tree based on the branching logic learned during the learning phase, and the
    terminal node (also known as the leaf node) will determine the final prediction.
    See the following figure (Figure 3.2) for the sample structure of a decision tree:


    ![](img/bd21298357d8484151447cff0b2f138b_78_0.png)


    Figure 3.2 – Decision tree


    The advantages that the decision tree has over linear regression and logistic
    regression are its ability to handle large datasets with complex non-linear relationships
    and co-linearity among the input features.


    A decision tree works well with data without preprocessing and can use categorical
    values and numerical values as it. It can also handle missing features and large-scale
    differences among different features in the dataset. A decision tree is also easily
    explainable since it uses conditions to split the data to make decisions, and
    the decision path for any individual prediction can be easily visualized and analyzed.
    It is also a high-speed algorithm. On the negative side, a decision tree can be
    prone to outliers and overfitting. Overfitting is a model training problem where
    the model memorizes the training data and does not generalize well on unseen data,
    especially with large numbers of features and noise in the data.


    Another drawback for decision trees and tree-based algorithms in general is that
    they can''t extrapolate outside of the inputs on which they were trained. For
    example, if you have a model predicting a housing price based on square footage
    and your training data contains ranges from 500 to 3,000 sq ft, a decision tree
    will not be able to extrapolate outside of the 3,000 sq ft, while a linear model
    would pick up the trend.'
