    # # Amazon Lex


    Conversational agents have been broadly adopted across many different industries
    to improve the user engagement experience, as self-service customer support and
    automating IT functions.


    **Amazon Lex (Lex)** is a service for building conversational interfaces using
    voice and text. You can use Lex to build a virtual conversational agent to handle
    customer inquiries, automate IT functions through voice or text commands, or provide
    general information.


    To understand how Lex works, let''s review some of the Lex concepts:


    +   - **Intent**: Intents are the desired actions, such as booking-a-hotel or
    getting-banking-information.

    - **Utterance**: Utterances are user inputs as *I want to order a small coffee*
    or *I like to book a flight from New York to Beijing.*

    - **Prompt**: A prompt is a mechanism to get users to provide the required information,
    such as can you tell me which size of coffee you would like?

    - **Slots**: Slots are required inputs to complete a fulfillment. For example,
    to fulfill a coffee order, we will need the coffee''s type and the size of the
    coffee.

    - **Fulfillment**: Fulfillment is the mechanism to complete the action, such as
    getting the banking information a customer requested.


    To use Amazon Lex, you must use the Lex management console or APIs to build a
    Lex bot. The building process involves the following main steps:


    +   1. **Create an intent for the action to take**: The intent represents the
    main functionality of the Lex bot.

    2. **Create several sample utterances for the intent**: The Lex bot will understand
    these utterances in spoken or text format to kick off an interactive session with
    the bot.

    3. **Create slots**: This specifies the required information to collect from the
    users before the action can be completed.

    4. **Provide a fulfillment hook**: This step connects an intent to a fulfillment
    function, such as a Lambda function, that performs custom logic or a built-in
    connector to an external service.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '+   5. **Build the bot**: Build and test if the bot is working as expected
    using voice and text inputs.


    +   6. **Deploy the bot**: Deploy the bot to a channel such as Slack or Facebook
    messenger. It also provides an API for programmatic integration.


    Lex APIs for building and running these bots. You can find the full list of APIs
    at https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/lexv2-models.html
    and https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/lexv2-runtime.html.


    Lex has a built-in monitoring functionality that you can use to monitor the status
    and health of the bot. Example monitoring metrics include latency, missed utterances,
    and request counts.


    # # Amazon Kendra


    **Amazon Kendra** is a fully managed intelligent search service. It uses machine
    learning to understand your natural language requests and perform **natural language
    understanding (NLU)** on the target data sources to return the relevant information.
    Instead of searching for answers using keywords as IT desk location and getting
    a list of documents containing these keywords, you can ask natural language questions
    such as *Where is the IT desk?* and get the location of the IT desk, such as *3rd
    floor, room 301.*


    You can use Amazon Kendra to solve several cases. For example, you can use it
    as part of a contact center where customer agents can quickly find the most relevant
    information for customer requests. You can also use it within an enterprise for
    information discovery across different data sources to improve productivity. At
    a high level, Kendra has the following functionalities:


    +   **Document reading understanding**: Kendra performs reading comprehension
    the source document and returns the specific information requested by the user
    in their questions.


    +   **Frequently asked question (FAQ) matching**: If you provide a list of FAQs,
    Kendra can automatically match the questions to the answers in the list.


    +   **Document ranking**: Kendra can return a list of documents that contain the
    relevant information for the questions asked. To return the list in the order
    of semantic relevancies, Kendra uses ML to understand the semantic meaning of
    the documents.'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'To understand Kendra works, let''s review some of the key technical Amazon
    Kendra concepts:


    +   **Index**: An index provides search results for the documents and FAQ lists
    that it has indexed. Kendra generates indexes and FAQ lists that allow them to
    be searched.


    +   **Documents**: Documents can be structured (FAQs) and unstructured (HTML,
    PDFs) and can be indexed by the Kendra index engine.


    +   **Data sources**: Data sources are locations where the documents are located.
    These can be S3 locations, Amazon RDS databases, and Google Workspaces drives,
    among others. Kendra has a list of built-in connectors for connecting to different
    data sources.


    +   **Queries**: Queries are used for getting results from indexes. Queries can
    be natural language containing criteria and filters.


    +   **Tags**: Tags are metadata that can be assigned to indexes, data sources,
    and FAQs.


    There are two main steps in setting up Kendra to perform an intelligent search
    against your documents:


    +   1. **Generate index**: The first step is to set up an index for your documents.


    +   2. **Add documents to index**: Once the index has been created, you can add
    document sources to the index to be indexed.


    Once the index has been created, you use the Kendra query() API to get responses
    for your index with queries. The following code snippet shows the Python syntax
    for querying index:


    ```

    kendra = boto3.client(''kendra'')

    query = ''${searchString}''

    index id = ''${indexID}''

    response=kendra.query(

    QueryText = query, IndexError = index_id)

    ```


    Kendra has built-in connectors for a range of data sources, so you don''t have
    to build custom code to extract data from those sources. It also has native application
    integration with Amazon Lex, which allows Lex to send user queries directly to
    a Kendra index for fulfillment.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Evaluating AWS AI services for ML use cases


    To determine if an AI service is a good fit for your use cases, you need to evaluate
    it across multiple dimensions:


    +   - Functional requirements: Identify the functional requirements for your ML
    use cases and test the target AI services provide the features you are looking
    for. For example, Rekognition is a computer vision service, but it does not support
    all computer vision tasks. If you have an instance segmentation computer vision
    use case, you will have to build a model using an algorithm that supports it,
    such as Mask-RCNN.

    - Model performance against your data: AWS AI services are trained with data sources
    to solve common cases. To ensure the models perform well against your data, use
    your test dataset to evaluate the model metrics for your specific needs. If the
    pre-built models do not meet your performance target, then try the custom building
    options if the services support. If neither option works, consider building custom
    models with your data.

    - API latency and throughput requirements: Determine your latency and throughput
    requirements for your application and test the AI service''s API against your
    requirement. In general, AWS AI services are designed for low latency and high
    throughput. However, you might have use cases that require extremely low latency;
    such as computer vision tasks at the edge. If the AI services cannot meet your
    requirements, consider building models and hosting them in the dedicated hosting
    infrastructure.

    - Security and integration requirements: Determine your security and integration
    requirements and validate whether the AI services meet your requirements. For
    example, you might have custom requirements around authentication and might need
    to develop a custom integration architecture to enable support.

    - Model reproducibility requirements: Since AI services manage the pre-trained
    models and machine learning algorithms for custom models, those models and algorithms
    can change over time. If you have strict reproducibility requirements, such as
    training a custom model using an old version of an algorithm for compliance reasons,
    then verify if the AI service provides such support before using it.

    - Cost: Understand your usage pattern requirements and evaluate the cost of using
    the AI services. If the cost of developing and hosting a custom model is more
    cost-effective, and the operational overhead does not outweigh the cost benefits
    of a custom model, then consider the build-your-own option.'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'There are other considerations when it comes to adopting AI services, such
    as monitoring metrics, versioning the control of APIs for audit requirements,
    and data types and volume requirements.


    # Building intelligent solutions with AI services


    AI services can be used for building different intelligent solutions. To determine
    if you can use an AI service for your use case, you must identify the business
    and ML requirements, then evaluate if an AI service offers the functional and
    non-functional capabilities you are looking for. In this section, we will present
    several business use cases and architecture patterns that incorporate AI services.


    # Automating loan document verification and data extraction


    When we apply for a loan from a bank, we need to provide the bank with physical
    copies of documentation such as tax returns, pay stubs, bank statements, and photo
    IDs. Upon receiving those documents, the bank need to verify these documents and
    enter the information from these documents into loan application systems for further
    processing. At the time of writing, many banks still perform this verification
    and data extraction process manually, which is time-consuming and error-prone.


    To determine if you can use any AI services to solve your problem, you need to
    identify the ML problems to be solved. In this particular business workflow, we
    can identify the following ML problems:


    +   - Data classification: Documentation classification is an ML task where the
    documents are classified into different types, such as driver''s license, pay
    stubs, and bank statements. This process identifies the document types and ensures
    the required documents are received and can be further processed based on their
    types.


    +   - Data extraction: Data extraction is the task of identifying the relevant
    information from the documents and extracting it. Examples of such information
    include customer names and addresses, income information, data of birth details,
    and bank balances.'
  merge: -1
  img_proc: true
