    \ hosting capabilities include concept drift detection and model performance detection.\
    \ Concept drift occurs when the statistical characteristics of the production\
    \ data deviate from the data's used for model training. An example of concept\
    \ drift is the mean and standard deviation of a feature changing significantly\
    \ in production from that of the training dataset.\n\nComponents in a model hosting\
