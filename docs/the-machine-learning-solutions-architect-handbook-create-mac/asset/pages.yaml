- pgno: 79
  md: '# Random forest algorithm


    **A random forest** algorithm is used extensively in real-world applications for
    e-commerce, healthcare, and finance for classification and regression tasks. Examples
    of these tasks include insurance underwriting decisions, disease prediction, loan
    payment default prediction, and target marketing.


    As we have learned in the preceding decision tree section, a decision tree uses
    a single tree to make its decisions, and the root of the tree (the first feature
    to split the tree) has the most influence on the final decision. The motivation
    behind the random forest algorithm is that multiple trees can make a better final
    decision. The way that a random forest works is to create smaller **subtrees**,
    all called **weaker learner trees**, where each subtree uses a random subset of
    all the features to come to a decision, and the final decision is made by either
    majority voting (for classification) or averaging (for regression). This process
    of combining the decision from multiple models is also referred to as **ensemble
    learning**. Random forest algorithms also allow you to introduce different degrees
    of randomness, such as **bootstrap sampling** (using the same sample multiple
    times in a single tree) to make the model more generalized and less prone to overfitting.
    The following figure shows how the random forest algorithm processes data instances
    using multiple subtrees and combines the outputs from the subtrees:


    Data instances


    ![](img/bd21298357d8484151447cff0b2f138b_79_0.png)


    Figure 3.3 - Random forest'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'There are several advantages in using a random forest over a regular decision
    tree, such as parallelizable processing across multiple machines and the ability
    to handle outliers and imbalanced datasets. It is also able to handle a higher
    dimension dataset because each tree uses a subset of the features. A random forest
    performs well with noisy datasets (datasets containing meaningless features or
    corrupted values). It is less prone to overfitting the data as a result of multiple
    trees making decisions independently. However, since it uses many trees to make
    a decision, the model interpretability suffers a bit compared to a regular decision
    tree that can be easily visualized. It also takes more memory since it creates
    more trees.


    # Gradient boosting and XGBoost algorithms


    Gradient boosting and XGBoost are also multi-tree based ML algorithms. They have
    been widely used for many cases such as credit scoring, fraud detection, and insurance
    claim prediction. While a random forest aggregates the result at the end by combining
    the results from weaker learner trees, gradient boosting aggregates the results
    from different trees sequentially.


    A random forest builds on the idea of parallel independent weaker learners. The
    motivation for gradient boosting is based on the concept of a sequential learner
    tree correcting the shortcoming (error) of the previous weaker tree. Gradient
    boosting has more hyperparameters to tune than a random forest and can achieve
    higher performance when it is tuned correctly. Gradient boosting also supports
    custom loss functions to give you the flexibility to model real-world applications.
    The following figure shows how the gradient boosting tree works:


    ![](img/bd21298357d8484151447cff0b2f138b_80_0.png)


    Figure 3.4 – Gradient boosting'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Gradient boosting works well with imbalanced datasets, and it is good for use
    cases as risk management and fraud detection where the dataset tends to be unbalanced.
    One major shortcoming of gradient boosting is that it does not parallelize as
    it creates trees sequentially. It is also prone to noise, as outliers in the data,
    and can revert easily as a result of this. Gradient boosting is less interpretable
    than a decision tree, but this can be easily overcome with tools as variable importance
    (feature importance).


    XGBoost is an implementation of gradient boosting. It has become very popular
    as a result of winning many Kaggle competitions. It uses the same underlying concept
    to build and tune the trees, but improves upon gradient boosting providing support
    for training a single tree across multiple cores and multiple CPUs for faster
    training, more powerful regularization techniques to reduce the complexity of
    the model, and combat overfitting. XGBoost is also better at handling sparse datasets.
    In addition to XGBoost, there are other variations of gradient boosting trees,
    such as LightGBM and CatBoost.


    # K-nearest neighbor algorithm


    K-nearest neighbor (K-NN) is a simple classification and regression algorithm.
    It is also a popular algorithm for implementing search systems and recommendation
    systems.


    The fundamental assumption that K-NN works under is similar things having proximity.
    The way to determine the proximity is to measure the distances between different
    data points. For classification tasks, K-NN first loads the data and their respective
    class labels. When we need to classify a new data point, we calculate its distances
    first, for example, the Euclidean distance to other loaded data points. We retrieve
    the labels for the top K (the K in K-NN) closest data points and use majority
    voting (the most frequent labels among the top K data points) to determine the
    class label for the new data point. The predicted scalar value will be the averaged
    values of the K closest data points for regression tasks.


    K-NN is simple to use and there is no need to train or tune the model with hyperparameters
    other than choosing of neighbors (K). The data points are simply loaded in the
    K-NN algorithm. Its results can be easily explainable, as each prediction can
    be explained by the properties of the nearest neighbors. In addition to classification
    and regression, it can also be used for search. However, the model grows in complexity
    as the number of data points increases, and it can become significantly slower
    with a large dataset for predictions. It also not work well when the dataset dimension
    is high, and it is sensitive to noisy data and missing data. Outliers will need
    to be removed, and missing data will be imputed.'
  merge: -1
  img_proc: true
