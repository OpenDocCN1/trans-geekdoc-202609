- pgno: 400
  md: 'In this particular business challenge, we can identify the following ML problems:


    +   * Speech-to-text transcription: The audio portion of videos and audio files
    need to be transcribed into text transcripts. The transcripts can then be further
    analyzed for additional information.

    * Text NLP analysis: NLP analysis such as entity extraction, sentiment analysis,
    and topic modeling can be performed on the transcripts.

    * Object/people/scene/activity detection: Compute vision tasks can be performed
    on video frames and images to extract objects, people, scenes, and activities.


    The following diagram shows an architecture that uses Elemental, Comprehend, and
    Rekognition to perform the identified ML tasks:


    ![](img/bd21298357d8484151447cff0b2f138b_400_0.png)


    Figure 12.2 – Media tagging and analysis architecture


    In this architecture, we build a pipeline for subtitle and text analysis of video
    content, video tagging and analysis, and image tagging and analysis.


    For live video sources such as broadcasting, the AWS Elemental services can take
    live broadcasting streams, process them, and store them in S3. You can find more
    details about the Elemental services at https://aws.amazon.com/elemental-live/.
    Images and video file data sources can be ingested into S3 using a variety of
    different capabilities, including S3 APIs or higher-level services such as AWS
    Transfer for Secure File Protocol (SFTP).'
  merge: -1
