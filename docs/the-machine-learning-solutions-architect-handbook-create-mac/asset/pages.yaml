    # What is ML governance and why is it needed?


    ML governance is a set of policies, processes, and activities by which an organization
    manages, controls, and monitors an ML model''s life cycle, dependencies, access,
    and performance to avoid or minimize financial risk, reputation risk, compliance
    risk, and legal risk.


    The stakes in model risk management are high. To put this into context, revisit
    the impact of the financial crises in 2007 and 2008 due to inadequate ML governance.
    Many of us probably vividly remember the aftermath of the great recession caused
    by the crisis, where millions of people were impacted in terms of their jobs,
    investments, or many of the largest financial institutions were brought to their
    knees and went out of business. The government had to step in to bail out many
    institutions such as Fannie Mae and Freddie Mac. This crisis was caused in large
    part by the flawed model risk management process and governance across financial
    organizations, where they failed to detect the risk from model failure in addressing
    complex derivative trading. As a result, the market was flooded with cheap credit.


    To prevent and mitigate future crises like this, many regulatory bodies have issued
    guidelines and established formal supervisory guidance on model risk management.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# # The regulatory landscape around model management


    To ensure organizations implement the proper risk management governance for model
    development and, various countries and jurisdictions have established policies
    and guidance for the regulated industries.


    In the United States, the Federal Reserve and the Office of Controller and Currency
    (OCC) have published the Supervisory Guidance on Model Risk Management (OCC 2011-2012
    / SR 11-7). SR 11-7 has become the key guidance for model risk management in the
    US. This guidance establishes the main principles for model risk management and
    covers governance, policies and controls, model development, implementation and,
    model validation processes. In the governance and policy area, there''s guidance
    on model inventory management, risk rating, roles and responsibilities. In the
    model development and implementation area, it covers topics such as design processes,
    data assessment, model testing, and documentation. Finally, in the validation
    area, there''s guidance on validation procedures, monitoring, and finding resolutions.


    In Europe, European Central Bank (ECB) Banking Supervision launched the Targeted
    Review of Internal Models (TRIM) guideline in 2016 to guide the model risk management
    framework (MRM). Specifically, the guideline states that an MRM needs to have
    a holistic view of the models and their applications, a guideline for identifying
    and mitigating known model deficiencies, definitions of roles and responsibilities,
    and definitions of policies, measurement procedures, and reporting.


    SR 11-7 and TRIM share several common topics and expectations, indicating that
    regulatory bodies in both the US and Europe have similar opinions on how MRM should
    be implemented. We are not going to list all the guidelines in this book. If you
    are interested, you can find more details on SR 11-7 and TRIMs at the following
    links:


    +   - SR 11-7: https://www.federalreserve.gov/supervisionreg/srletters/sr1107.htm

    - TRIM: https://www.bankingsupervision.europa.eu/banking/tasks/internal_models/html/index.en.html


    Most of the major banks in the US generally have well-established MRMs and operations,
    partly because of the focus placed by SR 11-7.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Common causes of ML model risks


    To understand how ML governance can help with model risk management, we need to
    understand the sources of model risks and the impact they might have. The following
    are some common causes that can result in potential model failures or misuse:


    +   **Lack of inventory and catalog:** Without a clear and accurate inventory
    of models running in production, an organization will not be able to explain why
    and how certain automated decisions are made by the underlying decision-making
    systems. An organization will also be unable to mitigate any erroneous decisions
    made by the system.


    +   **Lack of documentation:** Without clear lineage documentation regarding data
    and models, an organization will not be able to explain the behavior of a model
    or reproduce the model when required by auditors or regulators.


    +   **Defects and bias in training data:** ML models can make biased decisions
    as a result of training with biased datasets. This can subject an organization
    to potential reputational or legal risk.


    +   **Inconsistent data distributions:** When the distributions of training data
    and inference are different, the model can make incorrect predictions in production.
    These data distributions also change in production over time, which is known as
    data drift. Incorrect predictions made from out-of-distribution errors can result
    in potential financial, reputation, or legal risks.


    +   **Inadequate model testing and validation:** Before a model is put into production,
    it should be thoroughly tested and validated against established acceptance metrics.
    It should also be tested for robustness to identify failure points.


    +   **Lack of model interpretability:** For certain business applications, there
    are requirements for explaining how a decision is made by a model. The inability
    to explain the model when required can result in reputational and legal risk.


    +   **Inadequate change management process:** Without robust and model change
    management controls, models can be trained with incorrect data and defective models
    can be deployed or changed in production, resulting in model failure.


    With that, we are familiar with the regulatory landscape around model risk management
    and some of the common causes of model failure and misuse. Next, let''s discuss
    the ML governance framework.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Understanding the ML governance framework


    ML governance is complex as it deals with complex internal and regulatory policies.
    There are many stakeholders and technology systems involved in the full ML life
    cycle. Furthermore, the opaque nature of many ML models, data dependencies, ML
    privacy, and the stochastic behaviors of many algorithms make ML governance more
    challenging.


    The governance body in an organization is responsible for establishing policies
    and the ML governance framework. To operational ML risk management, many organizations
    set up three lines of defense for their organizational structure:


    +   - The first line of defense is owned by the business operations. This line
    of defense focuses on the development and use of ML models. The business operations
    are responsible for creating and retaining all data and model assumptions, model
    behavior, and model metrics in structured documents based on model classification
    and risk exposure. Models are tested and registered, the associated artifacts
    are persisted, and the results can be reproduced. Once the models have been deployed,
    system issues, model outputs, model bias, and data drift are monitored and addressed
    according to the established procedures and guidelines.


    +   - The second line of defense is owned by the risk management function, and
    it focuses on model validation. The risk management function is responsible for
    independently reviewing and validating the documents that are generated by the
    first line. This line of defense introduces standards on controls and documentation,
    makes sure that documents are self-contained, that results are reproducible, and
    that the limitations of models are well-understood by stakeholders.


    +   - The internal audit owns the third line of defense. The third line of defense
    mainly focuses on controls and less on ML models and theories. Specifically, this
    line of defense is responsible for auditing the first and second lines of defense
    to ensure all the established processes and guidelines are effectively followed
    and implemented. This line of defense provides independent validation of internal
    controls and reviews the documentation, timeliness, frequency, and completeness
    of the model risk management activities.


    As an ML SA, you are normally part of the first line of defense, designing solutions
    that are compliant with the ML governance framework. In the next section, we will
    talk about how ML technology fits in the overall governance framework.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# # Understanding ML bias and explainability


    One of the key areas for ML bias governance is bias detection and model explainability.
    Having models exhibiting biased behaviors not only subjects an organization to
    potential legal consequences could also result in a public relations nightmare.
    Specific laws and regulations, such as Equal Credit Opportunity Act, prohibit
    discrimination in business transactions, such as credit transactions based on
    race, color, religion, sex, nationality origin, marital status, and age. Some
    other examples of laws against discrimination include the Civil Rights Act of
    1964 and Discrimination in Employment Act of 1967.


    ML bias results from the underlying prejudice in data. Since ML models are trained
    using data, then the trained model will also exhibit biased behaviors. For example,
    if you build an ML model to predict a loan default rate as part of the loan application
    review, and use race as one of the features in the training data, the ML algorithm
    can potentially pick up biased patterns and favor certain ethnic groups over others.
    Bias can be introduced in different stages of the ML life. For example, there
    could be data bias as certain groups might have stronger representation in the
    data collection stage. There could be labeling bias where a human makes an intentional
    or unintentional mistake in assigning labels to a dataset. Data sources with disinformation
    can also be a source of bias that results in biased AI solutions.


    The ability to explain the decisions that are made by models helps an organization
    to satisfy the compliance and audit requirements of the governance bodies. Furthermore,
    model explainability helps an organization understand the cause-and-effect relationships
    between the inputs and the ML predictions to make better decisions. For example,
    if you can understand the reasons (such as rewards program) behind strong customer
    interest in a financial product, you can adjust your business strategy, such as
    doubling down on rewards programs, to increase revenues. Being able to explain
    model decisions also helps establish trust with domain experts in the ML models.
    If domain experts agree with how the predictions are made by the models, the models
    are more likely to adopt the models for decision making.


    There are various techniques we can use for bias detection and model explainability,
    and we will take a closer look at some of them in the next section.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Bias detection and mitigation


    To detect and mitigate bias, some guiding principles need to be established on
    what is considered fair. For example, a bank''s loan approval process should treat
    similar people similarly and the process may be considered fair when applicants
    with similar qualifications are assessed similarly. The bank also needs to ensure
    different demographic subgroups are treated equally for loan approval and measure
    metrics, as the rate for loan rejection to be approximately similar across different
    demographic subgroups.


    Depending on the definition of fairness, bias can be measured using different
    metrics. Some of these metrics may contradict each other. You need to choose the
    metrics that best support the definition of fairness in terms of the social and
    legal considerations and inputs from different demographic groups. The following
    is a list of some of the biases we must consider:


    +   * **Class imbalance**: This metric measures the imbalanced representations
    of different demographic groups, especially disadvantaged groups, in a dataset.

    * **The difference in the position of observed labels**: This metric measures
    the differences in positive labels across different demographic groups.

    * **Kullback and Leib (KL) divergence**: This metric compares the probability
    distribution in features and labels for the different groups, such as advantaged
    and disadvantaged groups.

    * **Conditional demographic disparity in labels**: This metric measures if a group
    has a bigger proportion of rejected outcomes than accepted outcomes in the same
    group.

    * **Recall difference**: This metric measures if the ML model is finding more
    true positives for one group (advantaged group) than other groups (disadvantaged
    groups).


    There are several ways we can mitigate bias once it has been detected. The following
    are some examples that can be applied:


    +   * **Remove features**: This approach helps mitigate bias by removing features
    that can contribute to the bias, such as gender and age.

    * **Rebalance the training data**: This approach corrects bias in different representations
    for the different groups in the training data.

    * **Adjust the labels in the training data**: This approach brings the proportions
    of labels closer together for the different subgroups.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'There are several open source libraries for fairness and bias management, such
    as the following:


    +   - Fairness (https://github.com/algofairness/fairness-comparison)

    - Aequitas (https://github.com/dss/aequitas)

    - Themis (https://github.com/LASER-UMASS/Themis)

    - Responsibly (https://github.com/ResponsiblyAI/responsibly)

    - IBM AI Fairness 360 (https://aif360.mybluemix.net/)


    There is also a component in SageMaker for bias detection, which we will cover
    in greater detail later in this chapter.


    # ML explainability techniques


    There are two concepts when it comes to explaining the behaviors of an ML model:


    +   - Global explainability: This is the overall behavior of a model across all
    data points and is used for model training and/or prediction. This helps us understand
    how different input features affect the outcome of model predictions. For example,
    after training an ML model for credit scoring, it is determined that income is
    the most important feature in predicting high credit scores across the data points
    for all loan applicants.

    - Local explainability: This is the behavior of a model for a single data point
    (instance) and specifies which features had the most influence on the prediction
    for a single data point. For example, when you try to explain which features influenced
    the decision for the single loan applicant, it might turn out that education was
    the most important feature, even though income was the most important feature
    at the global level.


    Some ML algorithms, as linear regression and decision trees, are considered explainable
    algorithms that have the built-in ability to explain the model. For example, the
    coefficients of linear regression models directly represent the relative importance
    of different input features, and the split points in a decision tree represent
    the rules that are used for decision making.'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'For black-box models such as neural networks, it is very hard to explain how
    the decisions are made in part due to non-linearity and model complexity. One
    technique for solving this is to use a white-box surrogate model to help explain
    the decisions of a black-box model. For example, you can train a linear regression
    model in parallel with a black-box neural network using the same input data. While
    the linear regression model might not have the same performance as the black-box
    model, it can be used to explain how the decision was made at a high level.


    There are various open source packages, such as local interpretable model-agnostic
    explanations (LIME) and Shapley Additive exPlanations (SHAP), for model explainability.
    Both LIME and SHAP adopt the surrogate model approach.


    # LIME


    As its name suggests, LIME supports local (instance) explainability. The main
    idea behind LIME is to perturb the original data points (tweak the data points),
    feed them into the black-box model, and see the corresponding outputs. The perturbed
    data points are small changes to the original data point and are weighted based
    on their proximities to the original data. Then, it fits a surrogate model, such
    as linear regression, using the perturbed data points and responses. Finally,
    the trained linear model is used to explain how the decision was made for the
    original data point.


    LIME can be installed as a regular Python package and can be used to explain text
    classifiers, image classifiers, tabular classifiers, and regression models. The
    following are the explainers that are available in LIME:


    +   * Table data explainer: lime_tabular.LimeTabularExplainer()

    * Image data explainer: lime_image.LimeImageExplainer()

    * Text data explainer: lime_text.LimeTextExplainer()


    LIME has some shortcomings, such as a lack of stability and consistency, since
    LIME uses random sampling to generate data points for approximation. Also, the
    linear surrogate might be inaccurate for local data points that cannot be approximated
    by a linear model.


    # SHAP


    SHAP is a more popular package and addresses some of the shortcomings of LIME.
    It computes the contribution of each feature regarding the prediction using the
    coalition game theory concept, where each feature value of each data instance
    is a player in the coalition.'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'The basic idea behind the coalition game theory is to form different permutations
    of coalitions of players when playing a game, then observe the game results from
    the different permutations, and finally calculate the contribution of each player.
    For example, if there are three features (A, B, and C) in the training dataset,
    then there will be distinct coalitions (2^3). We train one model for each distinct
    coalition for a total of eight models. We use all models to generate predictions
    in the dataset, figure out the marginal contribution of each feature, and assign
    a Shapley value to feature to indicate the feature importance. For example, if
    the model that uses a coalition with only features A and B generates an output
    of 50, and the model that uses features A, B, and C generates an output of 60,
    then feature C has a marginal contribution of 10. This is just a generalization
    of the concept; the actual calculation and assignments are more involved.


    SHAP can also be installed as a regular Python package. It can be used to explain
    tree ensemble models, natural language models (such as transformers), and deep
    learning models. It has the following explainers:


    +   * TreeExplainer: An implementation for computing SHAP values for trees and
    ensemble of trees algorithms

    * DeepExplainer: An implementation for computing SHAP values for deep learning
    models

    * GradientExplainer: An implementation of the expected gradients to approximate
    SHAP values for deep learning models

    * LinearExplainer: Used to explain linear models with independent features

    * KernelExplainer: A model-agnostic method for estimating SHAP values for any
    model because it doesn''t make assumptions about the model type


    SHAP is widely considered the state-of-the-art model explainability algorithm,
    and it has been implemented in commercial offerings as SageMaker. It can be used
    to compute both global feature importance and local explainability for a single
    instance. It does have some shortcomings as well, as slow computation associated
    with KernelExplainer.


    # Designing an ML platform for governance


    ML technology systems are critical in the overall operations of ML governance
    processes and activities. First, these technology systems need to be designed
    and built to meet the internal and external policies and guidelines themselves.
    Second, technology can help with simplifying and automating ML governance activities.
    The following diagram shows the various ML governance touchpoints in an enterprise
    ML platform:'
  merge: -1
  img_proc: true
- pgno: 361
  md: '![](img/bd21298357d8484151447cff0b2f138b_361_0.png)


    ![Figure 11.1 – ML platform and ML governance](link)


    When an ML platform is built with ML governance in mind, it can capture and supply
    information to help with the three lines of defense and let you streamline the
    ML risk management workflows. The types of tools used for ML governance include
    online data stores, workflow applications, document sharing systems, and model
    inventory databases. Now, let''s take a closer look at some of the core ML governance
    components and where an ML platform or technology can fit in.


    # # Data and model documentation


    One of the key components of ML governance is documentation. All the models that
    are used for decision-making should be properly documented. The scope of the documentation
    may include the following:


    +   - A data overview, including a data quality report on evaluating and assessing
    the input data

    - A model development document, including the methodology and assumptions, model
    usage instructions, performance and validation results, and other qualitative
    and quantitative analyses

    - A model validation strategy and report by the second and third lines of defense

    - Model performance monitoring results and data drift reports

    - Model implementation and user acceptance testing reports'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'The role of the ML platform in ML governance documentation is usually to provide
    data points that feed into the formal risk management documentations or generate
    some of the ready-to-use reports. Specifically, an ML platform must be able to
    track, store, and report the following data points:


    +   - Data quality metrics such as data descriptions, statistics, bias, and errors


    +   - Model metrics and validation results in development and testing


    +   - Model bias and explainability reports


    +   - Model performance monitoring results in production


    Amazon SageMaker can produce data and documentation to be included in model risk
    documentations. Specifically, SageMaker tracks and produces the following information
    that is relevant for ML governance documentation:


    +   - **Model metrics:** SageMaker Training Service Clarify tracks model metrics
    as training errors and validation errors.


    +   - **Data and model bias reports:** SageMaker Clarify is the bias detection
    component in SageMaker. If you enable SageMaker Clarify, you can get data and
    model bias reports for training data and trained model. The data and model bias
    reports provide details such as imbalances in training data and prediction behavior
    across different ages and genders.


    +   - **Model explainability reports:** SageMaker Clarify also provides a model
    explainability feature. It uses SHAP to explain the contribution of each input
    to the final decision. You can find out more about SHAP at `https://shap.readthe.io/en/latest/index.html`.


    There are various tools for generating data quality reports. For example, AWS
    DataBrew can be used to profile input data and generate data quality reports.
    It reports data statistics such as data distribution, correlation, and missing
    values.


    These data points are available via SageMaker and the DataBrew UI and API can
    be manually extracted to meet your needs. However, to operationalize the process,
    you should implement automated extraction jobs to extract data points from SageMaker
    and DataBrew and store them in a purpose-built data store for model risk management.
    Depending on the business requirements, data from the data science environment,
    testing environment, or production hosting environment can be extracted for documentation
    purposes.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# Model inventory


    The model registry is an essential component in the ML governance framework. It
    helps provide visibility into the available models and their uses, and it is a
    key tool for both business operations and risk management to govern the use of
    ML models. With a model registry, you can keep a catalog of models in different
    stages, version control them, and associate metadata, such as training metrics,
    with the models. You can also manage the approval process for deployment and use
    this as part of MLOps pipeline to track lineage and activities against the model
    training and deployment life cycle.


    There are both open source model registry platforms (such as MLFlow model registry)
    as well as managed model registry services available for model management. As
    we mentioned in Chapter 9, Building an Enterprise ML Architecture with AWS ML
    Services, SageMaker has a managed model registry offering provides the following
    capabilities to support ML governance activities and processes:


    +   - Model inventory: All the versions of the different models belong to a respective
    model group in the SageMaker registry. You can view all the model groups and different
    versions of a model in the registry: Metadata such as model metrics, training
    job details, hyperparameters used for training, and training data sources are
    important data points for the model review and model audit processes. Depending
    on specific business requirements, you can set up a central model registry for
    a single enterprise view, or even distributed model registries if that can meet
    your governance and audit requirements.


    +   - Model approval and life cycle tracking: You can track the approval of models
    and model stages directly inside the SageMaker model registry. This helps the
    business operations and audits ensure the proper processes are followed.


    SageMaker''s model registry can be part of an automated MLOps pipeline to help
    the consistency and repeatability of model management and model updates.


    # Model monitoring


    Post-deployment model monitoring helps detect model failures so that the appropriate
    remediation actions can be taken to limit risk exposure. Models need to be monitored
    for system availability and errors, as well as data drift and prediction failure.'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'As we mentioned in Chapter 9, Building an Enterprise ML Architecture with AWS
    ML Services, SageMaker provides a monitoring feature for both data drift and model
    drift. Specifically, SageMaker Model Monitor supports the following:


    +   - With SageMaker Model Monitor, you can monitor data quality issues and data
    distribution skews (also known as data drift) in production. To use this, you
    must create a baseline using a baseline dataset, such as a training dataset, to
    gather statistics, data types, and suggest constraints for monitoring. SageMaker
    Model Monitor can capture inference traffic, calculate data statistics, examine
    data types, and verify them against the constraints and trigger alerts. For example,
    if a feature''s mean and standard deviation changes significantly from the baseline,
    an alert can be triggered.


    +   - Model performance drift: When you use Model Monitor to detect model performance
    changes in production. To use this feature, you can create a model performance
    baseline job using a baseline dataset that contains both the inputs and labels.
    The baseline job will suggest constraints, which are the metrics thresholds that
    Model Monitor monitors against the metrics calculated with the ground truth data
    that was collected in production. These metrics can be optionally sent to CloudWatch
    for visualization.


    +   - Feature attribution drift: When enabled with SageMaker Clarify, SageMaker
    Model can report feature attribution drift. Feature attributions are indicators
    of feature importance for the prediction output. Similar to data and model drift,
    you can create a SHAP baseline job using baseline data to generate constraint
    suggestions. The separate monitoring job is then scheduled to model predictions
    in production against the baseline.


    SageMaker Model Monitoring can be integrated with automated alerting and response
    systems to streamline the remediation of model and data issues.


    # Change management control


    To ensure model deployment process consistency to reduce operational risk, as
    well as to support auditing, the appropriate change management control needs to
    be put in place. This might include documentation about the nature of the change
    and its impact, change review and approval, change ticketing, access and activity
    monitoring, and backout procedures.


    There are purpose-built change management tools for workflows and ticketing management.
    The underlying ML infrastructure needs to integrate with the change management
    workflow to ensure all the data points are collected and auditable.'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'SageMaker provides features that can support change management control, such
    as model approval status change tracking, model deployment logging, and fine-grained
    activity logging, such as for the IAM roles that were used for model deployment.


    # Lineage and reproducibility


    One of the key requirements in many ML governance frameworks is to establish lineage
    across data and models so that a model can be reproduced when required. The data''s
    needed to establish lineage includes training data sources, the algorithm that
    was used, hyperparameter configuration, and the model training script. SageMaker
    provides several features to establish lineage:


    +   - SageMaker training keeps clean lineage as training data sources, training
    job containers (contains algorithm and training script), hyperparameter configuration,
    and model artifact locations. Historical training job data is immutable in the
    SageMaker environment for retention purposes.


    +   - SageMaker Experiment and ML Lineage can contain additional component details,
    such as data processing, for more complete lineage tracking.


    +   - SageMaker Hosting provides information on the location of the original model
    artifact and the inference container to trace the lineage from model to endpoint.


    These data points are available by calling the SageMaker API. An external application
    can call the SageMaker API directly to extract this data for review purposes.
    Alternatively, a data extraction job can be developed to extract these data points
    and load them into a purpose-built risk management store for analysis.


    # Observability and auditing


    Auditing mostly focuses on process verification and artifact collection in support
    of audit activities. The underlying platform normally serves as an information
    source for collecting artifacts. For example, if there is a risk management policy
    that requires approval before a model is deployed into production, then the audit
    will need to access the system of of record to ensure such data is collected and
    retained.


    SageMaker and other related services can be data sources in support of the overall
    audit process. Specifically, it provides the following information that can be
    relevant for auditing purposes:


    +   - Activity and access audit trail: SageMaker sends all audit trail data to
    CloudWatch logs, which can be retained and analyzed for audit purposes.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '+   * Model approval tracking: Model deployment approvals are tracked in SageMaker
    model registry. This can be provided to an auditor as evidence that the required
    approval processes have been followed.


    +   * Lineage tracking: SageMaker Experiment and ML Lineage tracking components
    can track and retain model lineages such as data processing, model training, and
    model deployment. Lineage tracking information helps the auditor verify that the
    model can be reproduced using its original data and configuration dependencies.


    +   * Configuration changes: System configuration data is captured in AWS CloudTrail
    as change events. For example, when a SageMaker endpoint is deleted, there will
    be an entry in AWS CloudTrail indicating this change.


    Similarly, automated jobs can be implemented to extract this information and feed
    it into purpose-built data stores for risk management. An audit is a complex process
    that can involve many business functions and technology systems. To support the
    full audit process, you will need the support of multiple technology platforms
    and human processes to supply the required data.


    # Security and privacy-preserving ML


    ML privacy is becoming increasingly important in ML implementation. To ensure
    compliance with data privacy regulations or even internal data privacy controls,
    ML systems need to provide foundational infrastructure security features such
    as data encryption, network isolation, compute isolation, and private connectivity.
    With a SageMaker-based ML platform, you can enable the following security controls:


    +   * Private networking: As SageMaker is a fully managed service, it runs in
    AWS-owned account. By default, the resources in your AWS account communicate with
    SageMaker APIs via the public internet. To enable private connectivity to SageMaker
    components from your own AWS environment, you can attach them to a subnet in your
    virtual private cloud (VPC).


    +   * Storage encryption: Data-at-rest encryption can be enabled by providing
    an encryption key when you create a SageMaker notebook, a training job, a processing
    job, or a hosting endpoint.


    +   * Disabling internet access: By default, your SageMaker notebook, training
    job, and hosting service have access to the internet. This internet access can
    be disabled via configuration.'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'In addition to infrastructure security, you also need to think about data privacy
    and model privacy to protect sensitive information from adversarial attacks, as
    reverse engineering sensitive data from anonymized data. There are three main
    techniques for data privacy protection in ML:


    +   **Differential privacy**: Differential privacy allows you to share datasets
    withholding information about individuals within the dataset. This method works
    by adding random noise to the computation so that it is hard to reverse engineer
    the original data (if it is not impossible). For example, you can add noise to
    the training data or model gradients to obfuscate the sensitive data.


    +   **Homomorphic encryption (HE)**: HE is a form of encryption that allows users
    to perform computations on encrypted data without decrypting it first. This allows
    the computation output in an encrypted form that, when decrypted, is equivalent
    to the output as if the computation were performed on the unencrypted data. With
    this approach, the data can be encrypted before it is used for model training.
    The training algorithm will model with the encrypted data, and the output can
    only be decrypted by the data owner with the secret key.


    +   **Federated learning**: Federated learning allows model training to take place
    on edge devices while keeping data on the device, instead of sending the data
    to a central training cluster. This protects individual data as it is not shared
    in a central location, while the global model can still benefit from individual
    data.


    Each of these topics warrants a separate book, so we will not dive into the details
    of all three. We will only provide an introduction to differential privacy in
    this book to explain the main intuition and concept behind this method.


    # Differential privacy


    To understand the problem that differential privacy solves, let''s take a look
    at the real-world privacy breach that happened with Netflix. In 2006, Netflix
    provided 100 million movie ratings, submitted by 480K users, as data for the Netflix
    price competition. Netflix anonymized usernames with unique subscribers'' IDs
    in the dataset, thinking that this would protect subscribers'' identities. Just
    16 days later, two university researchers were able to identify some subscribers''
    true identities by matching their reviews with data from IMDb. This type of attack
    is called a linkage attack, and this exposes the fact that anonymization is not
    enough in protecting sensitive data. https://en.wikipedia.org/wiki/Netflix_Prize.'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'Differential privacy solves this problem by adding noise to the dataset that''s
    used to compute the dataset, so the original data cannot easily be reverse-engineered.
    In addition to protection against linkage attacks, differential privacy also helps
    quantify privacy loss as a result of someone processing against the data. To help
    understand what this means, let''s look at an example.


    Suppose your organization is a regional bank and your customer data repository
    contains sensitive data about your customers, including name, social security
    number, ZIP code, income, gender, and education. To ensure data privacy, this
    data cannot be freely shared by all departments, However, the aggregate analysis
    of the customer data, such as the number of customers with income over a certain
    threshold, can be shared. To enable access to the aggregated data, a data query
    tool was built to return only the aggregate data (such as count, sum, average,
    min, and max) to the marketing department. Separately, another database contains
    churn data with unique customer IDs, and a customer support database contains
    customer names and unique IDs. Both the churn database and customer support database
    are accessible to the marketing department. An ill-intentioned analyst wanted
    to find the names of customers whose incomes are above a certain threshold for
    some personal purpose. This analyst queried the database one day and found out
    that 4,000 customers whose incomes over $1 million in a particular ZIP code. A
    couple of days later, they queried the customer data again and found out there
    were only 29 customers with incomes over $1 million, out of a total of 3,999 customers.
    Since they had access to the churn database and customer support database, they
    were able to identify the name of the customer who churned and figured out that
    this customer had an income of over $1 million.


    To prevent this happening, the query tool was changed to add a little noise (such
    as adding or removing records) to the result without losing meaningful information
    about the original data. For example, instead of returning the actual result of
    30 customers out of 4,000 customers in the first query, the result of 31 customers
    out of 4,001 customers was returned. The second query returned 28 out of 3,997
    instead of the actual 29 out of 3,999 figures. This added noise does not significantly
    change the overall magnitude of the summary result, but it makes reverse-engineering
    the original data much difficult as you can''t pinpoint a specific record. This
    is the intuition behind how differential privacy works.'
  merge: -1
  img_proc: true
- pgno: 369
  md: 'The following diagram shows the concept of differential privacy, where computation
    is performed on two databases, and noise is added to one of the databases. The
    goal is to ensure that Result 1 and Result 2 are as close as possible as that''s
    where it becomes harder and harder to tell the difference in distribution between
    Result 1 and Result 2, even though the two databases are slightly different. Here,
    the Epsilon (ε) value is the privacy loss budget, which is the ceiling of how
    much an output distribution can change when adding/removing a record. The smaller
    the Epsilon value, the lower the privacy loss:


    ![](img/bd21298357d8484151447cff0b2f138b_369_0.png)


    Figure 11.2 – Differential privacy concept


    ML models are susceptible to privacy attacks. For example, it is possible to extract
    information from trained models that directly map to the original training data
    as deep learning models may have unintentionally memorized the training data.
    Also, overfitted models are more likely to memorize training data. Differential
    privacy is one of the techniques that can help minimize the effect of unintended
    memorization. Since differential privacy can make the computational outputs of
    two input datasets (with sensitive data, one with sensitive data removed) almost
    indistinguishable from a query perspective, the hacker cannot confidently infer
    whether a piece of sensitive data is in the original dataset or not.


    There are different ways to apply differential privacy to ML model training, such
    as adding noise to the underlying training data or adding noise to the model parameters.
    Also, it is important to know that differential privacy does not come for free.
    The higher the privacy protection (smaller epsilon), the lower the model accuracy.'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'Differential privacy is implemented in TensorFlow Privacy. TensorFlow Privacy
    provides a differentially private optimizer for model training and requires minimum
    code changes. The following code sample shows the syntax of using the DPKererasSGDOptimizer
    for differential privacy training. The main steps are as follows:


    +   Install the tensorflow_privacy library package.


    +   Import tensorflow_privacy. Select your differentially private optimizer:


    ```

    optimizer = tensorflow_privacy.DPKererasSGDOptimizer(

    12_norm_clip=12_norm_clip,

    noise_multiplier=noise_multiplier,

    num_microbatches=num_microbatches,

    learning_rate=learning_rate)

    ```


    +   Select your function:


    ```

    loss = tf.keras.losses.CategoricalCrossentropy(

    from_logits=True,

    reduction=tf.losses.Reduction.NONE)

    ```


    +   Compile your model:


    ```

    model.compile(optimizer=optimizer, loss=loss,

    metrics=[''accuracy''])

    ```


    PyTorch supports differential privacy with its opacus package. It is also fairly
    straightforward to use the opacus package to enable differential privacy training.
    The following code sample shows how to wrap an optimizer in the PrivacyEngine
    object, and just use the optimizer the same way in a PyTorch training loop:


    ```

    from opacus import PrivacyEngine

    optimizer= torch.opt.SGD(model.parameters(),

    lr=learning_rate

    private_engine = PrivacyEngine(

    model,

    sample_rate=sample_rate,

    max_grad_norm=max_per_sample_grad_norm,

    noise_multiplier = noise_multiplier

    )

    private_engine.attach(optimizer)

    ```'
  merge: -1
  img_proc: true
