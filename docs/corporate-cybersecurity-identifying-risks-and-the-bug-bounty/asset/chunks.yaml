- raw: 'Taking a closer look at the vsFTPd 2.3.4 example ([Figure 11.5](#c11.xhtml#c11-fig-0005)),
    it can be seen that Shodan has appeared to confirm that this asset is running
    the service. If a program manager were to find out that one of their assets were
    running this version of FTP, it could mean that threat actors may be able to easily
    see this information too and, knowing that many exploits exist, take advantage
    of the out-of-date service.


    ![Figure 11.5 Shodan Services Analysis.](images/c11f005.png)


    [**Figure 11.5**](#c11.xhtml#rc11-fig-0005) Shodan Services Analysis.


    5\. The risk identification process is essentially broken into several parts while
    using Shodan.


    *   Looking up assets by domain or IP address.


    *   Checking to see what information or additional mapping Shodan has on the assets.


    *   Identifying out-of-date versioning on services or infrastructure.


    *   Searching for exploitability.


    *   Confirming asset ownership.


    *   Attempting exploitation or relaying the vulnerability to the affected team.


    For example, in this instance a program manager may not know what, if any, exploits
    exist against the various services or exposed ports. A quick Google search for
    “vsFTPd 2.3.4” brings up multiple well-known and developed exploits ([Figure 11.6](#c11.xhtml#c11-fig-0006)):


    ![Figure 11.6 Google Search Results.](images/c11f006.png)


    [**Figure 11.6**](#c11.xhtml#rc11-fig-0006) Google Search Results.


    If the asset is indeed confirmed as belonging to the enterprise and it’s verified
    to be running that service, a program manager now must contact the affected team
    immediately for resolution as the exploit could lead to a threat actor achieving
    remote code execution on the server. Shodan can help assist program managers in
    quickly identifying easily exploitable services and out-of-date components or
    assets that may have not been known about prior.


    ### 11.3.2 Amass/crt.sh


    Common misconceptions presented by program managers are that “they know the extent
    of the subdomains controlled by the organization.” Bug bounty program managers
    would be surprised to find that infrastructure teams have abandoned subdomains
    that are actively hosting applications and exposing them to the Internet or creating
    unnecessary risk. Amass provides far more functionality than just subdomain enumeration.
    However, a quick technique exists to help program managers quickly identify subdomains
    passively in order to look for additional attack surfaces.


    Additionally, crt.sh is a tool that can be used to gather more subdomains and
    to possibly enumerate technology that the organization is using. crt.sh looks
    for all certificates containing variations of the root domain provided, which
    can be helpful (and even surprise a program manager). Domains not found before
    enumeration can be dumped into Amass (although it’s important to note that Amass
    also performs queries from crt.sh) or a preferred subdomain enumeration tool to
    discover even more assets to test on.


    **Special thanks to Donk for showing me crt.sh (Twitter: @donk\_enby).** <query
    id="Q2"> <p>Dear TS, Please set as Note text.</p> </query>


    #### 11.3.2.1 Amass


    As a standard, Amass comes standard with Kali Linux or most other penetration
    testing distributions. First and foremost, gather a list of domains that need
    to be tested. As a program manager, maintaining a list of all of the subdomains
    is a necessary evil, or in other words, no subdomain oversight equals no vulnerability
    oversight. If the enterprise is large enough, acquiring a list of all root domains
    may be difficult. If the organization is using Amazon Web Services (AWS), talk
    to infrastructure or networking teams to make a determination of all assets.


    1.  First, put all of the root domains in a file, such as [example.com](http://example.com),
    [example2.com](http://example2.com), etc. Once this is done, dumping subdomains
    into the file can be an additional method of testing as results may prove to be
    promising.


    2.  After the domains/subdomains are in a file, run the subdomain enumeration
    with Amass:


    amass enum -df test.txt > subdomains.txt ([Figure 11.7](#c11.xhtml#c11-fig-0007))


    ![Figure 11.7 Amass Scanning for Subdomains.](images/c11f007.png)


    [**Figure 11.7**](#c11.xhtml#rc11-fig-0007) Amass Scanning for Subdomains.


    The above command tells Amass to perform subdomain enumeration on the domain/subdomain
    file with the -df switch; it then writes the output into the subdomain file ([Figure
    11.8](#c11.xhtml#c11-fig-0008)).


    ![Figure 11.8 Subdomains in Nano.](images/c11f008.png)


    [**Figure 11.8**](#c11.xhtml#rc11-fig-0008) Subdomains in Nano.


    **Note: if having issues writing the output into the file, make sure that permissions
    are correct on the directory that is being written to. Additionally, if Amass
    appears to stall at a specific DNS queries per second rate after a few minutes,
    stop the tool.** <query id="Q3"> <p>Dear TS, Please set as Note text.</p> </query>


    **Once the tool is finished, subdomains will be output into the file specified.**


    #### 11.3.2.2 crt.sh


    Subdomain enumeration is an essential portion of testing. Even though Amass queries
    crt.sh, program managers may want to see a more comprehensive overview on the
    certificates and software utilized. Utilizing crt.sh is a fast alternative to
    using scans to discover domains that may have been overlooked ([Figure 11.9](#c11.xhtml#c11-fig-0009)).


    ![Figure 11.9 Subdomain Enumeration with crt.sh.](images/c11f009.png)


    [**Figure 11.9**](#c11.xhtml#rc11-fig-0009) Subdomain Enumeration with crt.sh.


    ## 11.4 Active Assessments


    An active assessment is one in which a hacker tests for vulnerabilities. The active
    stage can be considered disruptive to the enterprise if a program manager is not
    careful. Extreme caution should be exercised and no exploitation attempts should
    be made in the instance that a program manager is inexperienced. It is highly
    recommended to be comfortable with exploitation before moving into this phase
    as it can be detrimental to the production environment. Even when comfortable
    with exploits, a good practice is to inform the organization via a “Pentest” active
    board or post somewhere to let everyone know to contact you if any weird traffic
    comes their way. Doing so can prevent an “all hands on deck” emergency-type situation.
    Plenty of tooling exists for active testing. However, only several small aspects
    will be covered (more automated tooling for the busy professional).


    ### 11.4.1 nmapAutomator.sh


    Nearly any beginner hacker understands nmap, but how about nmapAutomator? The
    tool was designed by 21y4d and can be found on GitHub. It was created as an easier
    means of combining multiple toolsets for network and web application hacking,
    including full nmap port and service scans on tcp/udp, CVE scans, and following
    that, various suggested recon commands depending on the ports/services found.
    Additionally, nmapAutomator will utilize nikto, gobuster, sslscan, joomscan, wpscan,
    droopescan, smbmap, smbclient, enum4linux, snmp-check, snmpwalk, dnsrecon, ldapsearch,
    odat, etc. The tool can be used for a wide variety of scenarios, but is best used
    on backend servers.


    As can be seen in [Figure 11.10](#c11.xhtml#c11-fig-0010), there are many options
    to use in conjunction with nmapAutomator. Program managers can utilize the command
    **./nmapAutomator.sh 10.0.0.212 All** to perform a full scan on the asset. Once
    the command is executed, the tool will go through various stages including a quick
    scan, basic scan, and full scan ([Figure 11.11](#c11.xhtml#c11-fig-0011)), and
    then evaluate the given services to perform more refined tool usage and vulnerability
    scans thereafter. All of the results will be output into a folder to enable a
    neat and organized way to maintain findings ([Figure 11.12](#c11.xhtml#c11-fig-0012)).


    ![Figure 11.10 nmapAutomator Scanning Information.](images/c11f010.png)


    [**Figure 11.10**](#c11.xhtml#rc11-fig-0010) nmapAutomator Scanning Information.'
