- raw: "*   How well do the software engineers know how to patch bugs? It’s no surprise\
    \ that bugs are going to have to be fixed by these engineers. If they don’t understand\
    \ secure coding models, it’s impossible to provide adequate resolution timeframes.\n\
    \n*   Have statistics for the program been analyzed? As stated earlier in the\
    \ book, launching a public program from the jump typically isn’t an effective\
    \ way to evaluate the necessary adjustments and build a decent program. Although\
    \ it’s not impossible, it’s not recommended. If a program manager starts with\
    \ a private program, it’s easier to get accustomed to the workflow and determine\
    \ SLA estimates. Security has never been a race – it’s a marathon.\n\nAlthough\
    \ there are several ways to line up SLA agreements, here are some examples to\
    \ assist in the brainstorming process.\n\n### 5.3.1 Resolution Times\n\nMisconceptions\
    \ exist about bug bounty program resolution times. A lot of security researchers\
    \ believe that missing a resolution time represents a disastrous program, and\
    \ it’s up to program managers to fix these misconceptions. Defining adequate time\
    \ ranges that the program knows engineering teams can hold themselves accountable\
    \ to in regards to vulnerability resolution is an important part of program management.\
    \ By creating such resolution ranges, program managers have more flexibility to\
    \ be transparent with researchers.\n\nAs an additional note, most bug bounty platforms\
    \ auto-populate average resolution times, issues resolved, and so on. Most researchers\
    \ can deduce the level of effort and responsibility exercised by the program from\
    \ these statistics. However, providing a table helps a researcher compare averages\
    \ against SLA and, if done properly, it can inspire more participation in a program\
    \ (see [Table 5.1](#c05.xhtml#c5-tbl-0001)).\n\n[**Table 5.1**](#c05.xhtml#rc5-tbl-0001) Resolution\
    \ Times for Identified Vulnerabilities.\n\n| **Vulnerability Rating** || **Resolution\
    \ Time** |\n\n| --- | --- |\n\n| Critical || 2–7 days |\n\n| --- | --- |\n\n|\
    \ High || 7–14 days |\n\n| Medium || 14–30 days |\n\n| Low || Best effort |\n\n\
    | Informational || N/A |\n\nDefining an SLA directly in a program is best done\
    \ when the enterprise can properly establish it without guesswork. The possibility\
    \ of a bug falling out of the team’s purview could happen, and missing an SLA\
    \ can hurt a program’s reputation, but it shouldn’t be a discouraging factor for\
    \ program managers.\n\n### 5.3.2 Triage Times\n\nTriage times are different in\
    \ the sense that most bug bounty platforms can manage them on behalf of the researcher\
    \ if the program decides to go with a managed service model. Nonetheless, if a\
    \ standalone program is established or an enterprise has to establish its own\
    \ resolution criteria, an example of possible triage times is displayed in [Table\
    \ 5.2](#c05.xhtml#c5-tbl-0002). Triage doesn’t typically require a wide range,\
    \ unless the bug bounty program is exceedingly large. Validating vulnerabilities\
    \ doesn’t typically take that long. The most difficult portion of the process\
    \ is the resolution as it requires multitenant collaboration.\n\n[**Table 5.2**](#c05.xhtml#rc5-tbl-0002) Triage\
    \ Times for Identified Vulnerabilities.\n\n| **Vulnerability Rating** || **Resolution\
    \ Time** |\n\n| --- | --- |\n\n| Critical || 2 days |\n\n| --- | --- |\n\n| High\
    \ || 5 days |\n\n| Medium || 7 days |\n\n| Low || 14 days |\n\n| Informational\
    \ || N/A |\n\nThe time ranges of all these processes should be adjusted according\
    \ to program need.\n\n# 6   \n\nProgram Configuration\n\n## 6.1 Understanding\
    \ Options\n\nThe time has finally come to configure a program. This chapter focuses\
    \ on all of the various options available. Realistically, a step-by-step setup\
    \ process is less likely to be as useful as a chapter that describes all of the\
    \ available options. To best configure a program for the enterprise environment,\
    \ knowing all of the various techniques available will make the bug bounty program\
    \ far more successful. A lot of engineers setting up programs stray from the options\
    \ that are within easy reach. Specifically, the objective of this chapter is not\
    \ to focus on one crowdsourcing platform, but instead to evaluate the options\
    \ to adequately prepare program managers for a more successful setup. Nonetheless,\
    \ the various options between Bugcrowd and HackerOne will be presented.\n\n##\
    \ 6.2 Bugcrowd\n\n### 6.2.1 Creating the Program\n\nWhen first signing up on Bugcrowd’s\
    \ platform, the program manager has the option to choose the program or service\
    \ they want to use. For our example, we will be choosing between vulnerability\
    \ disclosure and bug bounty programs. First, the program manager will click on\
    \ the blue “Start now” button which pulls up the list of the given options.\n\n\
    1.  Click on “Start now” ([Figure 6.1](#c06.xhtml#c6-fig-0001))\n\n    ![Figure\
    \ 6.1 Bugcrowd “Start now” button.](images/c06f001.png)\n\n    [**Figure 6.1**](#c06.xhtml#rc6-fig-0001) Bugcrowd\
    \ “Start now” button.\n\n2.  Choose “Bug Bounty Program” by clicking the “Start\
    \ now” button ([Figure 6.2](#c06.xhtml#c6-fig-0002)).\n\n    ![Figure 6.2 Bugcrowd:\
    \ selection “Bug Bounty Program”.](images/c06f002.png)\n\n    [**Figure 6.2**](#c06.xhtml#rc6-fig-0002) Bugcrowd:\
    \ selection “Bug Bounty Program”.\n\n3.  Once the start button is clicked, a basic\
    \ program configuration wizard will populate. The details that are defined can\
    \ always be changed later, so do not worry too much about getting everything right.\n\
    \n4.  When the program wizard comes up, it will show all of the various steps.\
    \ In total, there are 9. Step 1 focuses on naming the program. The program name\
    \ should be the name of the company that the program manager will be in charge\
    \ of ([Figure 6.3](#c06.xhtml#c6-fig-0003)).\n\n    ![Figure 6.3 Selecting the\
    \ program name on Bugcrowd.](images/c06f003.png)\n\n    [**Figure 6.3**](#c06.xhtml#rc6-fig-0003) Selecting\
    \ the program name on Bugcrowd.\n\n5.  Next, targets, or “assets,” will be set\
    \ for testing. Again, it is OK if only limited assets are added. At this point,\
    \ it’s not necessary to add every asset ([Figure 6.4](#c06.xhtml#c6-fig-0004)).\n\
    \n    ![Figure 6.4 Adding targets to test on Bugcrowd.](images/c06f004.png)\n\n\
    \    [**Figure 6.4**](#c06.xhtml#rc6-fig-0004) Adding targets to test on Bugcrowd.\n\
    \n    Clicking the “Add target” button will bring up the dialog that allows a\
    \ wide array of asset selections.\n\n6.  Now, targets can be added and options\
    \ can be selected from the dropdown ([Figure 6.5](#c06.xhtml#c6-fig-0005)). The\
    \ name represents what you would like to call the asset, keeping in mind that\
    \ the researcher will see this. Tags can now be selected. Utilizing tagging is\
    \ essential because it gives the security researcher the best chance of having\
    \ the correct expertise for conducting research. Next, the URL/location defines\
    \ where you should expect the researcher to begin testing. Finally, the category\
    \ helps you define what type of asset it is. Many researchers will look at the\
    \ category right away and determine if it’s the right type of research for them.\
    \ Be sure to make an adequate effort to label all assets correctly; there’s no\
    \ use in rushing the assets. Click “Add,” which will then populate the target\
    \ on the list. Adding as many as necessary. Click the “Next step” button and proceed.\n\
    \n    ![Figure 6.5 Adding a target to Bugcrowd.](images/c06f005.png)\n\n    [**Figure\
    \ 6.5**](#c06.xhtml#rc6-fig-0005) Adding a target to Bugcrowd."
