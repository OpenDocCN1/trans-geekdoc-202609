- raw: "*   **Rating**: the severity or impact of a vulnerability that is exploited\
    \ by a threat actor. The rating scale can be realistic, in one of these categories:\
    \ non-applicable, informational, low, medium, high, critical.\n\nThe baseline\
    \ for evaluating vulnerabilities against complexity and rating doesn’t have to\
    \ use strict wording, nor does it have to be included in the bug bounty program’s\
    \ description, or even written down. It’s meant to be a mental note to keep in\
    \ mind while evaluating vulnerabilities for triage priority as well as helping\
    \ during the logical process of working through reported bugs when monetary ranges\
    \ need to be evaluated.\n\nTo understand how the complexity and rating scales\
    \ are used in conjunction with each other, note the following two separate examples\
    \ and compare them.\n\n1. Stack based buffer overflow on example.exe resulting\
    \ in remote code execution.\n\nA vulnerability was identified in which it were\
    \ possible to perform a buffer overflow exploit against the example.exe file offered\
    \ by [company.com](http://company.com).\n\n2. Local file inclusion (LFI) vulnerability\
    \ led to remote file inclusion (RFI) resulting in remote code execution.\n\nA\
    \ vulnerability was identified in which the foo.php?page = parameter suffered\
    \ from a local file inclusion vulnerability. When a payload of ../../../../../../../etc/passwd\
    \ was appended to the end of the parameter, the vulnerability was exploited. Additionally,\
    \ swapping out the LFI payload with a PHP input wrapper (php://input) and modifying\
    \ POST request data to include <? system(‘uname -a’);?> resulted in full remote\
    \ code execution on the system.\n\n### 7.3.3 Projected Ratings\n\n### 7.3.4 Ticketing\
    \ and Internal SLA\n\nThe process of creating tickets and managing internal service\
    \ level agreements that are defined within the enterprise is a unique, yet important,\
    \ aspect of information security. During the ticket creation process, engineers\
    \ managing the bug bounty program should use any integrations to ticket systems\
    \ that the bug bounty platform may offer. Or in the unique instance that the enterprise\
    \ is self-managing a program, engineers should define SLA management processes,\
    \ which is discussed further in [Chapter 9](#c09.xhtml).\n\n#### 7.3.4.1 **Creating\
    \ Tickets**\n\nThe vulnerability triage and validation process doesn’t necessarily\
    \ require program managers to make tickets internally. Managed services and triage\
    \ employees cannot partake in such incentives. Normally, after the process of\
    \ validating vulnerabilities and deeming them as reproducible and legitimate,\
    \ first things first: *pay the researcher* if the vulnerability is valid, and\
    \ due diligence has been performed to validate the issue. Obviously, ensure that\
    \ the possibility of accidentally paying for a vulnerability that isn’t valid\
    \ doesn’t exist before paying the researcher, as discussed previously.\n\nOnce\
    \ the researcher is paid, connectors that integrate into most ticketing platforms\
    \ will do the work of generating the report for the program internally. However,\
    \ in some instances, the ticketing integration may not support the inclusion of\
    \ the entire report. For example, as a bare minimum, a program will want to make\
    \ sure of the following.\n\n1.The ticket contains fully detailed steps.\n\nIf\
    \ triage or the security researcher writes steps that an application security\
    \ engineer can understand, it doesn’t necessarily mean that a software engineer\
    \ will understand the same steps. Translate any complex processes into easy-to-understand\
    \ replication examples, something that someone who has limited technical experience\
    \ may understand.\n\n(Software engineers are highly technical, but understanding\
    \ the exploitation process may require a different level of understanding.)\n\n\
    2.The ticket contains relevant files.\n\nIn instances of exploitation where the\
    \ security researcher uses an externally hosted file for a proof of concept, such\
    \ as an HTML file, include this in the ticket. An engineer’s time is valuable.\
    \ Internal teams should not have to create any exploitation processes from scratch.\
    \ If the researcher did not include the file, either ask for it or include the\
    \ file that was used for validating the vulnerability.\n\n3.The ticket contains\
    \ proofs.\n\nSecurity researchers tend to include screenshots/videos of exploitation.\
    \ If there’s reason to believe that the exploit may be too complex to detail in\
    \ several reproducible steps, be sure to include the material used to detail the\
    \ exploitation process.\n\n4.Additional information.\n\nProgram managers should\
    \ include any relevant information that wasn’t parsed via the ticket integration\
    \ functionality.\n\n# 8   \n\nVulnerability Disclosure Information\n\n## 8.1 Understanding\
    \ Public Disclosure\n\nProgram managers will typically have the ability to allow\
    \ security researchers to disclose their findings after the issues are fixed.\
    \ Allowing public disclosure of vulnerabilities isn’t necessarily a program requirement,\
    \ and program managers should be aware of any implications that may occur because\
    \ of disclosure. Public disclosure, as it pertains to bug bounty platforms, is\
    \ simply the act of allowing the report to populate via public feeds. It would\
    \ be safe to assume that a report disclosed on the feed could possibly leave the\
    \ platform in the form of writeups on the researcher’s website, social media posts\
    \ – or even journalists writing on the vulnerability.\n\n### 8.1.1 Making the\
    \ Decision\n\nUltimately, the decision to allow public disclosure depends on the\
    \ objective of the program. The control of vulnerability remediation transparency\
    \ (allow/deny) is up to the discretion of program managers. Still, it’s important\
    \ to understand that public programs have their own unique challenges in this\
    \ process.\n\n#### 8.1.1.1 Private Programs\n\nThere are two ways that private\
    \ programs can deal with vulnerability disclosure: one represents a standard built-in\
    \ configuration use case, while the other is more of a decided-upon courtesy in\
    \ support of the security researcher’s efforts. Ultimately, it will also depend\
    \ on the configuration allowances that a crowdsourcing platform determines. In\
    \ most cases, private programs will have the ability to allow disclosure, although\
    \ it’s slightly different than what a program manager would expect from a public\
    \ program.\n\n1\\. Allowing Disclosure\n\nThe option to allow disclosure has to\
    \ come from a place of understanding a security researcher’s mentality, but also\
    \ one of the potential enterprise impact. For example, consider the following.\n\
    \nA researcher works with the enterprise bug bounty program on a critical issue,\
    \ one in which they could have been able to acquire hundreds of thousands of pieces\
    \ of PII. Acting in good faith, the security researcher stopped when they had\
    \ access to the server, to avoid any accidental disclosure of PII.\n\nIf disclosure\
    \ is allowed, most crowdsourcing platforms have policies in place where the only\
    \ people that can view the disclosed (and patched) vulnerabilities are the other\
    \ security researchers who have been invited to and are participating in the program.\
    \ While most security researchers will have respect for the processes put in place\
    \ for preventing disclosure of the vulnerability outside of the organization,\
    \ that may not always be the case. A program manager shouldn’t be presumptuous,\
    \ but associated risk should be known."
