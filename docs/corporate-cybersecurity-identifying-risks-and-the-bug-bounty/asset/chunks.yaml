    ### 11.4.5 Dirsearch


    Fuzzing is an important aspect of internal assessments as well. Hackers love to
    jump to the meat and potatoes of exploitation, which leaves many to forget that,
    sometimes, more is less. The best attack is one in which the hacker knows everything
    there is to know about the target. Therefore, program managers should strive to
    know twice as much as the participating security researchers. The idea of fuzzing
    is to search for secret files or directories on a web application. Dirsearch simplifies
    the process. As most of the tools, starting requires downloading it from GitHub,
    unless it’s prepackaged with the penetration testing operating system of choice.
    Dirsearch was created by maurosoria. Once again, reading the manual is important
    as there are plenty of different switches to create and fine tune the involved
    processes.


    Several combined switches seem to be effective for quick testing: -x to include
    status codes to ignore false positives (or an overload of irrelevant true positives),
    -e to annotate which extensions need to be tested, and -f to force append extensions
    onto each word tested from the default wordlist. For example, if a URL were tested
    and the tool was looking for an admin directory, admin.php would also be tested
    if utilizing “-e php –f” as a switch option. If a more hasty test is utilized,
    removing the -e and -f switches will test directories and include file paths only.


    As an example, imagine the following command: python3 dirsearch.py -u [http://127.0.0.1:8000](http://127.0.0.1:8000)
    -e php,txt,bak,conf -f -x 300,301,302,303,304,400,401,402,403,404,500,501,502,503,504'
