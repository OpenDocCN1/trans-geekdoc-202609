    Bug bounty programs benefit greatly from the expertise that security researchers
    bring to the table with the vulnerability research that they conduct.


    ### 10.9.2 Bug Bounty Program Manager Interviews


    ## 10.10 Summary


    When it comes down to it, the bottom line is this: security researchers and program
    managers are similar. They all know that communication is an important aspect
    of program participation and management. Particularly, security researchers just
    want to be understood – they want their impact to be heard and assessed in a fair
    way. Program managers want the researchers to let them in and to let their guard
    down a bit more so that the situation can be assessed properly. In addition, they
    don’t want to have to tell researchers to respect them: they just want to deal
    with patient researchers who are polite.


    As both a security researcher and a bug bounty program manager, I have seen both
    sides of a wide array of issues. Ultimately, I know that I’ve been impatient as
    a researcher and that I’ve also been lax and not willing to hear a researcher
    out when operating as a program manager. When I catch myself doing these things,
    I readjust. There’s no harm in admitting fault and adjusting stance – or even
    just realigning silently. Program managers and security researchers will appreciate
    adjustments, and that’s what matters. Communication is a key component and driver.


    # Part 6: Assessments and Expansions


    # 11 Internal Assessments


    ## 11.1 Introduction to Internal Assessments


    Program managers, at a minimum, must understand why it’s necessary to have a working
    understanding of penetration testing and the associated vulnerability assessment
    phases. Unfortunately, in some cases, enterprise leadership may not understand
    that program managers should have a background in application security with penetration
    testing, if not at least a working knowledge of application vulnerability types
    and mitigation processes. When an employee is hired with no knowledge of common
    vulnerability types, it may make managing the program exceedingly difficult. This
    chapter introduces some useful crash-course assessment concepts and tooling but
    the intention of this chapter isn’t to replace formal penetration testing assessment
    resources. When reading through this chapter, please understand that penetration
    testing from both an application and network standpoint requires an extensive
    amount of training and practice. Some of the best penetration testers in the world
    still don’t know every aspect of hacking. Aspiring hackers that want to up their
    game should seek other resources.


    ## 11.2 Proactive Vs Reactive Testing


    The best bug bounty program managers don’t begin testing after the vulnerability
    reports start rolling in. As can be said about a ship, one does not embark on
    a journey across the seven seas without checking the ship for holes and ensuring
    that it’s sound and ready for smooth sailing. Program managers should perform
    full internal assessments before opening the program, even to a small group of
    security researchers. An amateur mistake would be assuming that one or even two
    security researchers would be an OK number of individuals to start with prior
    to testing. Enterprise assets need to be thoroughly hardened to prevent overpaying
    security researchers or forcing a pull-back of program launch. Regardless of all
    of the internal assessments performed, researchers will always find security issues,
    and program managers shouldn’t be immediately alarmed when reports are received
    – even on assets that they have tested.


    ## 11.3 Passive Assessments


    Arguably, one of the most important aspects of internal testing is to place oneself
    in the shoes of a threat actor. A malicious hacker does not automatically acquire
    a list of assets to attack. As does anyone else, a threat actor needs to perform
    reconnaissance to identify assets through various means. Program managers can
    benefit from understanding the different ways passive research is conducted, as
    it can open up a better understanding of security gaps, prior to performing any
    active testing at all.


    > **Note:** Passive assessments require little/no interaction with the target.
    All IP address ranges and domains in this section are accessible to the public.
    Please acquire written permission to perform on any targets past the passive assessment
    stage. In fact, the intent of this book is to give program managers some tips
    and tricks to test on their own assets. It is not intended for use on nonprogram-related
    assets.


    ### 11.3.1 Shodan


    The best way to describe Shodan is as a tool that turns active recon into passive
    recon. Shodan crawls the Internet continuously and attempts to identify open ports
    and services on those ports. It’s a search engine that includes any Internet-connected
    device that it can make contact with. Program managers need to use Shodan as a
    resource because the enterprise may have exposed assets that they were not even
    aware of.


    #### 11.3.1.1 Using Shodan


    1. First go to a browser and navigate to `shodan.io` (Figure 11.1).


    ![Figure 11.1 Shodan Browser Search.](images/c11f001.png)


    **Figure 11.1** Shodan Browser Search.


    Program managers will be greeted with a search bar and various functionality.
    Creating a free account is highly recommended, especially if this source will
    be used often.


    2. In the search bar, type the IP address of the specific asset that needs to
    be looked up to see if Shodan has any data on it. In any case, a good course of
    action for a program manager performing recon for the first time is to enter the
    name of a web application domain that is controlled by the enterprise, and click
    the magnifying glass to search (Figure 11.2):


    ![Figure 11.2 Shodan Search Bar.](images/c11f002.png)


    **Figure 11.2** Shodan Search Bar.


    3. The search will then bring up a list of many different results (Figure 11.3).
    The domain may show up as linked to various assets, filtering by country, services,
    organizations, and products. At this point, any of this information is considered
    open and exposed to the Internet. Viewing the information isn’t illegal in any
    sense. Program managers should be advised that it would be in their best interests
    to carefully check assets and ensure that they belong to the organization before
    proceeding with testing. Additionally, Shodan has a wide array of filters and
    logic that could be used. For example, a security researcher, threat actor, or
    program manager may want to obtain visibility on where a service is being used,
    or even a specific version of the service. In this scenario, we are using `vsftpd
    2.3.4` as a means of searching and generating results.


    ![Figure 11.3 Generating Results.](images/c11f003.png)


    **Figure 11.3** Generating Results.


    4. Next, if an asset meets the criteria defined, a program manager can click on
    it to understand the impact and analyze enterprise exposure. Imagine that the
    asset labeled `216.199.146.90` appears to belong to the enterprise. When a program
    manager clicks on it, a new page loads that highlights many additional pieces
    of information including all open ports that Shodan has identified – as well as
    services, and the best attempt of identifying vulnerabilities against the asset
    based on versioning (Figure 11.4). It’s important to note that some CVEs against
    services and versions may not be identified. Nonetheless, the level of insight
    that Shodan provides can prevent deadly situations.


    ![Figure 11.4 Shodan Asset Analysis.](images/c11f004.png)


    **Figure 11.4** Shodan Asset Analysis.

