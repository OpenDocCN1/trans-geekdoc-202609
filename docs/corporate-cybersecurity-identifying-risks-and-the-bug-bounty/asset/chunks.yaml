- raw: 'Enterprise bug bounty programs will typically have a vastly different setup,
    depending on the specific field that the company actively participates in. For
    example, a medical company may be concerned with protecting patient records, and
    may use a model that allows doctors or nurses to log in to a web portal that allows
    them to access patient records. What company in its right mind would allow such
    a critical asset to be exposed to the public? Well, the reality is, if it’s absolutely
    necessary to expose critical assets to the public, they need to be checked. Paying
    a couple thousand dollars to a security researcher is nowhere near the level of
    pain that will occur if vital information were to leak to the public.


    To a medical organization, protecting patient records is vital. Just ask Alberto
    Hill, who on a dark day performed security research, logging into a public facing
    web portal with the username “admin” and the password “admin.” All legal issues
    aside, Alberto had access to financial records, medical records, medication information,
    and so on. Alberto’s story can teach engineers that putting the most critical
    assets in scope for a bug bounty program isn’t optional: it’s a requirement. If
    the engineers managing the program are not ready to allow researchers to test
    these assets, the first part of the journey is understood: the engineers know
    that it’s important to assess these assets and should adequately do so, in some
    form.


    One size can never fit all for an organization identifying assets. As another
    example, consider an ecommerce website that focuses on selling digital assets.
    Some of the biggest risks that a digital sales website could face are account
    takeover opportunities, stealing assets through business logic, or insecure web
    application code, and so on. Depending on the model of the enterprise, there may
    be less of a risk for exposed customer data, and more of a risk of theft or manipulation.
    The best possible thing an engineer can do while setting up a program is to consider
    the logic of their critical company assets, test them, and put parts or entire
    domains, subdomains, etc. in scope.


    Web applications are just the tip of the iceberg for bug bounty programs. Crowdsourcing
    platforms have been known to allow enterprises to include mobile applications
    and public-facing network assets in their program testing scope. Some of the bigger
    companies have even made the news for coordinating with their top hackers and
    sending the latest hardware or tech for testing purposes, allowing researchers
    to keep the hardware when testing is complete.


    Overall, whoever is tasked with establishing the bug bounty program will have
    to consider what assets to put into scope. Only the engineers establishing the
    program can make this determination. The recommended release order would depend
    on whether the company manufactured physical goods. For example, if the company
    in question were an Internet service provider, it would make sense to allow security
    researchers to test their own home routers if the company produced those routers.
    Obviously, the stipulation would be that a researcher refrained from damaging
    the hardware, or less they will have to pay for it.


    An application security engineer running a program, for instance, can collaborate
    with network security, infrastructure, mobile teams, and so on, to determine important
    assets to test. The best way to view asset allocation is with the mindset that
    one can always expand, but it’s harder to retract. If an enterprise puts all wildcards
    for subdomains and every main domain in scope and has 100 vulnerabilities reported
    within the first 24 hours, these assets can be pulled out of scope. But the researcher’s
    findings will stand and have to be addressed according to the service level agreement
    (SLA) guidelines that are defined in the program. An SLA is a commitment between
    a service provider and a client. In this instance, the bug bounty program sets
    an SLA and the researchers agree to their promise to address or patch vulnerabilities
    in the appropriate timeframe.


    ## 4.6 Asset Risk


    Outside of determining what assets are appropriate for the scope of the program,
    it’s essential to understand production impact. While it’s typically a good idea
    to put critical assets in scope, bug bounty program managers must ask: “Why is
    this critical?” If it’s critical because of sensitive information, that’s one
    scenario. However, if it’s critical because testing can cause major impact or
    financial loss, it should not be put into the scope unless the program is certain
    that it will not cause major issues.


    While it’s difficult to evaluate every possible scenario in which there can be
    impact for production components, engineers must try to identify any conflicts
    where possible. In the event that impact does occur, communicate the notion quickly
    to software engineers and be transparent about the situation. Hiding facts will
    not help remediate any issues that may occur, and taking ownership is the best
    possible solution.


    ## 4.7 Understanding Out of Scope


    While it may seem ridiculous to describe the meaning of “out of scope,” there’s
    more to the equation than just defining assets that are not “in scope.” It can
    take a careful hand to appropriately decide what assets shouldn’t be tested on,
    and out of scope represents more than just what *shouldn’t* be tested on. Initiating
    the most thorough program requires knowing the type of attacks that are out there
    and creating a scope that prevents disruption.


    First and foremost, as a baseline, it’s important to assign testing environments
    and assets that you don’t want a research to test to the out-of-scope section.
    In most instances forgetting to include certain assets in your out-of-scope section
    isn’t detrimental. Security researchers should know to avoid testing on anything
    that isn’t defined as “in scope,” and they undoubtedly want to get paid. Don’t
    inadvertently assume that all security researchers will respect the rules of the
    bug bounty program. In many instances, security researchers will test on whatever
    they feel like in hopes they can abuse it to prove that it’s in scope. Additionally,
    researchers may ignore specific prohibited testing criteria by proxy-chaining
    (the act of changing IP address with each new request), and engineers managing
    the bug bounty program must keep this in mind.


    When considering what to prohibit, it’s recommended to put the majority of the
    most common disruptive techniques in the out-of-scope section; this is a formality.
    Prohibiting disruptive behavior is a formality because, as stated, it will not
    stop anyone from performing those actions. As the program manager, don’t punish
    security researchers for their testing methodologies. At the end of the day if
    there isn’t disruption it’s not problematic. It’s the old adage: don’t make mountains
    out of molehills.


    As a general rule of thumb, here’s a pocket guide to some of the major vulnerabilities
    and testing methodology that should be included in the out-of-scope section, along
    with the “why.”


    ## 4.8 Vulnerability Types


    ### 4.8.1 Denial of Service (DOS) or Distributed Denial of Service (DDoS) Attacks


    In short, DOS or DDoS attacks can cause production impact and take servers down
    that host major services. Even if the security researcher doesn’t test it, but
    presents possible DOS or DDoS attacks on “x” server or service, there are minimal
    cases in which this finding is worth anything.


    ### 4.8.2 Social Engineering Attacks


    Many subtechniques within the category of social engineering are exceedingly effective.
    However, save the testing of these techniques for hired penetration testers. It’s
    generally not a good idea to include social engineering attacks as in scope, because
    this could cause potential legal issues if an employee or customer ends up having
    any sensitive data leaked.'
