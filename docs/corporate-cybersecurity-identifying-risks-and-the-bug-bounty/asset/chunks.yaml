  toc: []
- raw: 'Another crowdsourcing option is HackerOne. Using HackerOne will feel different
    from Bugcrowd in the sense that there’s more going on, immediately from the login.
    Specifically, the login to Bugcrowd provides the program manager with a simple
    overview, whereas HackerOne merges a security researcher’s and program manager’s
    views. The merging of research and program views can feel daunting. A new program
    manager may have issues sorting through the options. Attempting to manage the
    program can even feel clunky for a more seasoned program manager. However, the
    intention is to describe most of the functionality available within HackerOne.
    Additionally, HackerOne has many more options for configuration. However, the
    expertise of the program manager will determine which crowdsourcing platform is
    best for them.


    Unfortunately, HackerOne does not have an easy-to-utilize demo program that is
    readily available to anyone. In order to mitigate this issue, an already established
    program will be utilized and the settings and configurations evaluated. The primary
    tabs that will be focused on are the program dashboard, program settings, and
    inbox tabs; anything else within HackerOne typically tends to relate to researchers
    specifically. Additionally, some of the configuration settings of the profile
    will be evaluated as well. The ability to understand the setup of a program from
    start to finish will ultimately result in an easier transition if a program manager
    ever works for a firm that utilizes a different crowdsourcing platform.


    ### 6.3.1 Program Settings


    The first aspect that will be focused on is the “Program settings” tab ([Figure
    6.54](#c06.xhtml#c6-fig-0054)). The program settings tab has two subtabs: General
    and Program. As a baseline, the general tab contains information, product addition,
    authentication, verified domains, credential management, user management, group
    management, and an audit log. Additionally, there is a small section dedicated
    to billing. The program tab has four subheaders with a wide range of options:
    customization, hacker management, rewards, and automation.


    ![Figure 6.54 Program settings option.](images/c06f054.png)


    [**Figure 6.54**](#c06.xhtml#rc6-fig-0054) Program settings option.


    #### 6.3.1.1 General


    The general tab can be considered the tab to use when program managers want to
    configure all of the miscellaneous options of the program ([Figure 6.55](#c06.xhtml#c6-fig-0055)).
    The utilization of the general tap will be essential, as billing information is
    contained within the general tab under the “billing” subheader.


    ![Figure 6.55 Miscellaneous program options.](images/c06f055.png)


    [**Figure 6.55**](#c06.xhtml#rc6-fig-0055) Miscellaneous program options.


    #### 6.3.1.2 Information


    The information tab contains the security page information for the bug bounty
    program ([Figure 6.56](#c06.xhtml#c6-fig-0056)). Within this tab, program managers
    can name the program, assign a program handle, define the main website for the
    program, and write a tagline under the “About me” tab. Additionally, program managers
    can provide a relevant Twitter account username or update the program’s logo.


    ![Figure 6.56 Security page function.](images/c06f056.png)


    [**Figure 6.56**](#c06.xhtml#rc6-fig-0056) Security page function.


    #### 6.3.1.3 Product Edition


    HackerOne has two different product editions, the first edition is “bounty professional”
    and the other option is “bounty enterprise” ([Figure 6.57](#c06.xhtml#c6-fig-0057)).
    Program managers have the option between the two, but should consult with management
    and with account managers to determine the major differences and price considerations.
    The given price point could be a general determinant, however professional the
    basic edition. This tab allows program managers to see product addition statistics,
    and contact support for a different product.


    ![Figure 6.57 HackerOne product editions.](images/c06f057.png)


    [**Figure 6.57**](#c06.xhtml#rc6-fig-0057) HackerOne product editions.


    #### 6.3.1.4 Authentication


    Similar to Bugcrowd, HackerOne has the option to enable SSO. Program managers
    can click on the “Enable SAML” button. However, this is not currently shown in
    the screenshot example ([Figure 6.58](#c06.xhtml#c6-fig-0058)). Program managers
    will have to go through the IdP management team to acquire the correct settings
    to configure SSO. In addition, HackerOne varies from Bugcrowd as HackerOne program
    managers can contact their account managers to enable the IP Allowlist feature.
    The IP Allowlist feature will ensure that only certain IP addresses can access
    program management.


    ![Figure 6.58 Single sign-on with SAML.](images/c06f058.png)


    [**Figure 6.58**](#c06.xhtml#rc6-fig-0058) Single sign-on with SAML.


    #### 6.3.1.5 Verified Domains


    The “Verify domains” tab allows a program manager to add domains, which is a requirement
    to enable SSO. The one difference between Bugcrowd’s verification and HackerOne’s
    verification, is that HackerOne also allows HTML meta tag verification and web
    file verification in addition to DNS txt records ([Figure 6.59](#c06.xhtml#c6-fig-0059)).


    ![Figure 6.59 Domain verification example.](images/c06f059.png)


    [**Figure 6.59**](#c06.xhtml#rc6-fig-0059) Domain verification example.


    #### 6.3.1.6 Credential Management


    The “Credential management” tab allows program managers to provide CSV files to
    hackers in order to authenticate the application ([Figure 6.60](#c06.xhtml#c6-fig-0060)).
    In some cases, having an authenticated account is useful for testing for certain
    vulnerabilities.


    ![Figure 6.60 Credential management tab.](images/c06f060.png)


    [**Figure 6.60**](#c06.xhtml#rc6-fig-0060) Credential management tab.


    #### 6.3.1.7 Group Management


    Even though user management comes before group management, setting up a group
    is a step that will be essential before setting up users to ensure that program
    managers are maintaining the best possible security practice for role-based access
    control, or in other words keeping their program in check. Program managers should
    make the best attempt to create appropriate role groups for need-to-know and essential
    roles. As a general rule of thumb, there should be one role that has full permissions,
    one role that has most permissions, and one role that has extremely limited permissions
    ([Figure 6.61](#c06.xhtml#c6-fig-0061)). Maintaining the full suite of roles will
    allow program managers to assign permissions quickly without impacting the program.


    ![Figure 6.61 Group management options.](images/c06f061.png)


    [**Figure 6.61**](#c06.xhtml#rc6-fig-0061) Group management options.


    To add a role group, program managers should click the “Add group” button in the
    top-right-hand corner of the group management pane. Once the button is clicked,
    the add group page will appear and program managers can name the group and assign
    appropriate permissions. The default level of permissions allows users to view
    reports and post internal comments. Outside of default permissions, program managers
    can assign the reporting role, the program role, the reward role, or the admin
    role. As a good example of a limited role, a program manager should name a group
    and maintain default permissions if not already set within the group management
    tab. Another group can be created that allows response to vulnerabilities without
    program management. In order to do so, program managers can assign the report
    role in conjunction with the reward role. Finally, program managers can click
    all of the checkboxes to enable others to have full admin permissions over the
    program ([Figure 6.62](#c06.xhtml#c6-fig-0062)).


    ![Figure 6.62 Group management options.](images/c06f062.png)


    [**Figure 6.62**](#c06.xhtml#rc6-fig-0062) Group management options.


    #### 6.3.1.8 User Management'
