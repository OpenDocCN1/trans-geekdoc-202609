    Given that `127.0.0.1` is the domain, such as [https://example.com](https://example.com)
    – and the semicolon is either the preferred port or service (unnecessary to append
    the port for ports 443 and 80) – the command will look for files and directories
    and output them along with the status response code when finished ([Figure 11.22](#c11.xhtml#c11-fig-0022)).


    ![Figure 11.22 Dirsearch Finding Folders.](images/c11f022.png)


    [**Figure 11.22**](#c11.xhtml#rc11-fig-0022) Dirsearch Finding Folders.


    ## 11.5 Passive/Active Summary


    There’s a wide range of tools available to program managers, and this portion
    of the book doesn’t even scratch the service of the amount of free tooling and
    resources available, including the manual reviews that can be done to support
    the health of the bug bounty program. Program managers don’t need to be expert
    hackers with impeccable wit and skill, but they do need to know how to identify
    low-hanging fruit, and a lot of the tooling discussed is good when utilized for
    the purposes of surface level penetration testing. Nonetheless, program managers
    should aspire to learn as much as possible to identify a wider range of bugs.


    ## 11.6 Additional Considerations: Professional Testing and Third-Party Risk


    For program managers that don’t have the experience to perform internal assessments
    themselves, they should outsource to a trusted penetration testing firm and ask
    for a black-box test (meaning no information is given). Even enterprises that
    have the expertise to carry out full penetration tests could benefit from further
    testing, especially if the engineers do not perform penetration testing as a full-time
    job. Third-party risk is yet another factor that needs to be considered throughout
    the assessment period. It’s easy to think about the impact of testing company-owned
    assets, but how about assets not owned by the enterprise running the bug bounty
    program?


    It would be unwise to open up a program to security researchers if the enterprise
    isn’t prepared to deal with remediating a lot of vulnerabilities. Third-party
    risk can be yet another factor, opening up the opportunity of exploitation or
    more bugs that a program will have to pay if not recognized in the first stage
    of partnership from company to company. Program managers should work with governance,
    risk, and compliance to evaluate acquisitions or partners consistently. Failure
    to do so can result in the exploitation of the organization.


    # 12 Expanding Scope


    Earlier in the book, the scope of a bug bounty program was discussed and a key
    principle was to ensure that the scope that is defined was not too wide to prevent
    overburdening of the program managers who are attempting to triage and remediate
    vulnerabilities. The idea behind scope expansions is to give researchers more
    surface to test on. After all, a threat actor may want something that the enterprise
    has: scope does not exist in the world of crime and illegal personal gain.


    Opening up additional assets for testing can prove painful if too many assets
    are added or if an enterprise decides to offer rewards on an untested asset. While
    there’s not necessarily a right or wrong time to expand scope, several steps can
    be taken to mitigate the potential of failure, nearly all within the realm of
    prior testing and level of effort.


    ## 12.1 Communicating with the Team


    The nonnegotiable aspect of scope expansion is adequately portraying intentions
    to the team. Standalone program managers should communicate with leadership to
    ensure that everyone is on the same page with the expansion. A program manager
    should never add an asset without talking to other engineers on the team. Bridging
    any gaps in communication is a fairly easy process, and with an adequate plan
    resistance won’t necessarily be met unless the budget isn’t flexible for the needs
    of the bug bounty program.


    Program managers should focus on a few aspects to enable a thorough conversation:


    *   **Intention**: during the process, the reason for scope expansion should be
    discussed with the program team or with leadership. The idea of the expansion
    is to allow more attack surface. Therefore, the reasoning should be communicated
    to the appropriate party.

    *   **Testing**: let the team know what the vulnerability analysis plan is prior
    to the expansion. An in-house penetration test may suffice, but weighing the pros
    and cons of an out-sourced penetration test may be necessary depending on the
    attack surface. For example, expanding to one single subdomain may be a small
    project, whereas adding an additional root domain for a subsidiary company could
    prove to open up quite a large attack surface.

    *   **Value**: highlight the value of an expansion. At the point of considering
    such expansions, leadership should already have seen an adequate vulnerability
    finding and resolution workflow. Therefore, value should speak for itself. If
    the workflow has been less than ideal, considering an interim solution, such as
    adding more hackers to the program or achieving a better security posture, may
    be a better option.

    *   **Target launch**: talk about ideal scope expansion data. Notification is
    essential: there’s nothing worse than surprised engineering teams. In addition,
    proper notification can assist in preparing the teams for the expansion, and in
    some cases development teams may be dedicated to monitoring and ensuring a smooth
    launch.

    *   **Follow through**: explain what the intention looks like for rolling back
    or putting a hard stop on the expansion if any issues occur.


    ## 12.2 Costs of Expansion


    Program managers should never expect that an expansion, even to a single asset,
    will yield minimal results or payouts. Before expanding, it’s absolutely essential
    to evaluate the current bounty pool and analyze the trends of payouts over the
    course of the period to attempt to get a rough estimate of what the expansion
    may do to the budget. Additionally, no expansions should occur if the budget is
    severely limited or if a program is close to hitting the maximum allotment for
    the fiscal year. If the enterprise is running a program that offers points instead
    of bounties, it’s still essential to ensure that a thorough analysis of vulnerability
    reports submitted occurs to prevent burdening teams.


    ## 12.3 When to Expand Scope


    Unfortunately, there’s never a correct way to actually define this. There are
    most certainly best practices, but an actual enterprise program may have a wide
    array of considerations to take into account before being able to make a decision
    on an expansion. Ideally, scope expansions are best approached when there is adequate
    reason to believe that the current scope is either too limited or exhausted in
    one way or another. Take, for instance, an enterprise program that is receiving
    an average of five or more reports a month. Depending on the payout table for
    the program, over five reports may end up being a little more than the enterprise
    had bargained for and an expansion of additional assets may not be appropriate.


    Expanding scope is about comparing the current reports received within a given
    period, and analyzing the enterprise’s ability to prepare and safely increase
    the effectiveness of the program without inadvertently damaging the program. Program
    managers can find great solace in expanding when ready and not rushing into it.


    ## 12.4 Alternatives to Scope Expansion


    Scope expansions aren’t the only way to encourage more program participation.
    Program managers can alternatively invite more security researchers, with automated
    approaches and by hand. For example, most bug bounty management platforms have
    an option to send automated invites out to researchers until a certain threshold
    of reports is met on a monthly basis. Automated invites may increase the amount
    of reports that a program receives. If the amount of hackers being invited is
    abnormally high, it’s best to remove the option and consider a scope expansion.

