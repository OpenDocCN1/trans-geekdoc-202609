    ### 3. Target Group Scope and Rewards


    The next portion underneath the description box is a checkbox that asks if the
    target group is in scope ([Figure 6.28](#c06.xhtml#c6-fig-0028)). Clicking on
    the checkbox reveals another checkbox that asks the program manager if the asset
    group “pays monetary rewards.” The checkbox for rewards is a useful component
    of target groups, because program managers can take assets that would normally
    be considered out of scope and offer a limited in-scope option. For example, if
    the enterprise maintains a domain that is highly vulnerable, leaving the “pays
    monetary rewards” option unchecked but adding the assets can allow researchers
    to test and report the vulnerabilities, and the enterprise will not have to pay
    for the asset. The official recommendation would be to eventually put the assets
    in scope when they are considered less vulnerable.


    ![Figure 6.28 Target groups.](images/c06f028.png)


    **Figure 6.28** Target groups.


    For this current example, the “Network Assets” group is being created. Therefore,
    the example that is going to be shown is the result of enabling monetary rewards
    to walk through the process of creating and modifying rewards.


    ### 4. Configuring Reward Tiers


    With the checkbox clicked for the rewards option, an overlay will pop up, showing
    various reward options for the group, such as tiers ranked at high, medium, low,
    and custom ([Figure 6.29](#c06.xhtml#c6-fig-0029)). These brackets have price
    ranges on each, and the custom tier can be used for defining rewards per vulnerability
    criticality classification. Groups are unique in the sense that multiple groups
    can be assigned different tiers, therefore making it worth a researcher’s time
    to hack mobile applications over web applications, etc.


    ![Figure 6.29 Target group rewards.](images/c06f029.png)


    **Figure 6.29** Target group rewards.


    ### 5. Adding Targets and Saving the Group


    After the reward is selected, a program manager must click on the “Add new target”
    button. The only option that is different with this interface is the ability to
    pick pre-existing targets and add them to the group. Adding each target to a specific
    group will have to be done completely individually. Once all of the targets are
    added, a program manager can click on the “Save group” button, which will bring
    program managers to the next web page.


    ### 6. Viewing Target Group Listings


    Finally, the groups will be populated on the “Target groups” page, with the name,
    rewards, and all of the details that were assigned previously ([Figure 6.30](#c06.xhtml#c6-fig-0030)).
    Program managers will have to utilize the “Add group” option in order to make
    any additional groups.


    ![Figure 6.30 Target group listings.](images/c06f030.png)


    **Figure 6.30** Target group listings.


    #### 6.2.3.3 Integrations


    The integrations tab of the settings option allows program managers to connect
    any relevant tools that their enterprise might have for managing reports ([Figure
    6.31](#c06.xhtml#c6-fig-0031)). For example, various configurations such as `Jira`,
    `Slack`, `ServiceNow`, etc., exist – allowing for an effective reporting and triage
    workflow. Program managers can opt to use none of these tools, or many of these
    tools. A standard integration flow may be a ticketing system tool such as `Jira`,
    `Slack` notifications to bring a program manager’s attention to the submission,
    or an embedded submission form on the website that gives the enterprise the ability
    to receive submissions from anyone if they don’t exclusively know about Bugcrowd’s
    services.


    ![Figure 6.31 Integrating various tools to help with report management.](images/c06f031.png)


    **Figure 6.31** Integrating various tools to help with report management.


    Rather than explain each integration, program managers are encouraged to review
    the Bugcrowd documentation. The integration process will vary based on the type
    of tool Bugcrowd is integrating with.


    #### 6.2.3.4 Announcements


    The “Announcements” tab is used for notifying researchers of major changes within
    the program ([Figure 6.32](#c06.xhtml#c6-fig-0032)). Examples of an adequate usage
    of announcements would be: Increasing Rewards, Expanding Scope, Asking researchers
    to test a specific asset, etc.


    ![Figure 6.32 Announcements option.](images/c06f032.png)


    **Figure 6.32** Announcements option.


    In addition, Bugcrowd maintains specific premade templates that can be used as
    a starting point for notifying researchers such as Email usage reminders, Scope
    updates, Reward delays, and more. As you can see in [Figure 6.33](#c06.xhtml#c6-fig-0033),
    the premade templates can be written and the publish announcement button can be
    pressed to announce the program’s message to all researchers.


    ![Figure 6.33 New announcement option.](images/c06f033.png)


    **Figure 6.33** New announcement option.


    #### 6.2.3.5 Manage Team


    In the manage team section, program managers can invite team members to assist
    in managing the program ([Figure 6.34](#c06.xhtml#c6-fig-0034)). Additionally,
    the settings allow for an auto assignment of triaged or critical tickets which
    can assist employees in responding to issues faster, especially if it’s necessary
    to do so quickly.


    ![Figure 6.34 Manage team option.](images/c06f034.png)


    **Figure 6.34** Manage team option.


    Beyond seeing the existing team members, program managers can invite team members
    by clicking on the “Invite a team member” button, and additionally assign the
    roles as discussed ([Figure 6.35](#c06.xhtml#c6-fig-0035)).


    ![Figure 6.35 Invite a team member option.](images/c06f035.png)


    **Figure 6.35** Invite a team member option.


    Three separate roles exist when the invite button is pressed: `Admin`, `Analyst`,
    and `Viewer`. The `Admin` role can do anything within the program. The `Analyst`
    can only manage submissions and basic settings, and the `Viewer` can only review
    submissions and options within the program.


    #### 6.2.3.6 Submissions


    The final program settings tab is the “Submissions” tab. One of the options that
    can be utilized is a data fields option. This allows program managers to create
    custom submission fields that can only be seen internally. The fields can be useful
    in the instance where vulnerabilities need to be easily identified and tagged
    with a message that the entire team has the ability to see. For example, data
    fields such as “No Impact” or “Special Exception” could be useful to internally
    relay that a ticket may be a false-positive or a vulnerability that was brought
    from out of scope to in scope ([Figure 6.36](#c06.xhtml#c6-fig-0036)). The options
    are limitless and program managers should experiment and brainstorm with team
    members to come up with useful data field options.


    ![Data fields option.](images/c06f036.png)


    **Data fields option.**


    Next, the CVSS v3 score option is the same as the initial configuration of the
    program ([Figure 6.37](#c06.xhtml#c6-fig-0037)). Enabling this option allows for
    Bugcrowd’s scoring and metric system for the various vulnerabilities.


    ![Figure 6.37 CVSS v3 option.](images/c06f037.png)


    **Figure 6.37** CVSS v3 option.


    The remediation advice option should be enabled. There’s no logical reason not
    to have it enabled as the researcher cannot see the advice and it is a useful
    feature ([Figure 6.38](#c06.xhtml#c6-fig-0038)). If the option becomes redundant,
    it can be turned off in the same way that it was turned on.


    ![Figure 6.38 Remediation advice option.](images/c06f038.png)


    **Figure 6.38** Remediation advice option.

