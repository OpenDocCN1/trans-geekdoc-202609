    即使分诊负责特定报告的初始接收和验证，但内部确定漏洞优先级并非其职责。项目管理中常见的一个误区是对分诊项目的分类。在大多数情况下，漏洞在报告流程中都能得到准确评级。尽管如此，项目经理应当小心，不要将漏洞分类视为一成不变的铁律。


    例如，请前往搜索引擎查找以下 CVE 以进行评估：`CVE-2020-14179`。就目前而言，该漏洞在通用漏洞评分系统（CVSS）3.x 版本评分标准中被评为中危。显而易见，截至目前已知情况，严重程度将决定赔付金额。问题是，项目中的
    CVE 评级与现实中的 CVE 评级相比如何？实事求是地讲，该漏洞可能被评为中危，但通过阅读当前描述可以发现，这是一个信息泄露漏洞，可能处于评分标准的低端。攻击者基本上可以查看
    Jira 工单上的字段名称和自定义服务级别协议（SLA）名称。回顾来看，该漏洞可能并不太严重。然而，CVSS 评分是漏洞赏金项目的典型评分机制。因此，中危漏洞很可能需要支付赔付（或至少建议支付）。建立赏金支付范围而非固定值的重要性在此体现得淋漓尽致，因为
    Jira 漏洞现在可以按中危严重程度的低端进行支付。按评分低端支付不应成为项目中的常态。项目经理必须始终坚守赔付准则，并对研究人员保持公平，尤其是当漏洞属于合法问题时。项目不应寻找少付研究人员报酬的方法，而应评估影响，以确定研究人员是否应获得更多报酬。


    现在，将 Jira 漏洞与标准的跨站脚本（XSS）漏洞进行比较。无论漏洞影响何种资产，只要不被视为自跨站脚本（Self-XSS），XSS 漏洞的利用场景将永远多于
    `CVE-2020-14179`。在几乎所有情况下，信息泄露漏洞的严重性都不如能够钓鱼用户并窃取凭证的漏洞（除非泄露的信息是敏感的，例如密码、PII 等）。


    请查看以下三个漏洞，并确定其修复优先顺序。在 1 到 3 的范围内进行评级，其中 1 为最高优先级，3 为最低优先级：


    ## 7.2.2 漏洞示例


    ### 7.2.2.1 登录门户上的反射型 XSS


    #### 报告与分诊


    一名研究人员通过滥用原生参数，在登录门户上发现了一个 XSS 漏洞。他们能够弹出警告框，验证手段使用了经典的 `<script>alert(1)</script>`
    技术。托管服务将该警报分诊为中危漏洞。


    #### 验证


    项目方能够验证该漏洞为合法的 XSS 漏洞。


    ### 7.2.2.2 开放重定向漏洞


    #### 报告与分诊


    同一研究人员发现了一个漏洞，允许他们将用户重定向到任意网站，且无任何限制。此外，研究人员指出，他们能够通过在路径后附加 `http://127.0.0.1:port`
    来检查后端特定端口是开放还是关闭。他们将其报告为开放重定向漏洞，因为他们很难判断端口实际上是开放还是关闭——这只是研究人员的猜测。由于托管服务无法验证任何服务端请求伪造漏洞，该警报被分诊为中危漏洞。


    #### 验证


    项目方能够验证开放重定向漏洞。此外，他们注意到通过测试，枚举内部端口甚至查看特定文件内容均成为可能。


    ### 7.2.2.3 内部结构化查询语言（SQL）服务器凭据泄露


    #### 报告与分诊


    最后，发现了一个漏洞：企业的公开 GitHub 仓库似乎泄露了通过 3306 端口连接的 My Structured Query Language (MYSQL)
    服务器凭据。由于凭据似乎仅可从内部子网访问，分诊团队无法验证其真实性。


    #### 验证


    项目方验证了凭据的存在性，并确定泄露的内部凭据属实。然而，项目方遵循最佳实践，认定该漏洞评级为中危。


    ## 7.3 答案


    在给定的三个场景中，结果按相关性从低到高排序，并附带了相应解释。


    ### 7.3.1 漏洞评级测试总结


    事实是，漏洞处理方式的认知有一定的灵活空间，无法制定严格的准则。分诊团队视为关键的漏洞，对企业可能仅是中危。如果泄露的内部 SQL 服务器凭据示例涉及存储信用卡或
    PII 等关键资产（如数据库），优先级会改变吗？理解漏洞分类和修复优先级可能会变化/不得不变化，是项目管理的重要组成部分。


    #### 7.3.1.1 登录门户上的反射型 XSS


    反射型 XSS 漏洞的优先级低于可升级为 SSRF 的开放重定向。实事求是地讲，利用的便利性和钓鱼窃取凭证的可能性会对业务造成极大干扰，并在企业的安全流程中引发大量纷争和影响。在大多数情况下，XSS
    最终会被定性为真正的中危，除非研究人员设法将漏洞升级为账户接管实例。


    #### 7.3.1.2 开放重定向漏洞


    虽然该漏洞最初只是一个低影响的基于重定向的场景，但研究人员通过尝试枚举端口，将其转变为服务端请求伪造漏洞。此外，项目经理能够读取其他文件，将一个低影响漏洞转变为高影响漏洞。在此实例中，建议将研究人员的漏洞评级从低升级为高，因为他们识别出了
    SSRF 攻击的可能性。然而，这不应被视为关键，因为研究人员未实现进一步升级。优先解决此问题将是防止关键利用或数据泄露的最佳建议。


    #### 7.3.1.3 内部 SQL 服务器凭据泄露


    虽然乍一看内部 SQL 服务器暴露似乎是最关键的漏洞，但如果非要比较，它要么与反射型 XSS 实例同等严重，要么危害更小。企业不应掉以轻心，忽视仅可在内部复现的漏洞。在合法内部凭据暴露的情况下，即使研究人员无法访问，也应立即通知受影响团队轮换凭据。关于内部凭据的一个常见误区是，认为因为安全研究人员无法进入网络就不成问题；这与事实完全相反。


    ### 7.3.2 复杂性与评级


    没有人能详尽定义企业应如何管理不同漏洞。通常存在一条基线。但正如我们所见，基线仅仅是基线：一种推荐方法的大纲。另一种解决各类问题的好方法是比较所有因素，从漏洞的复杂性和评级入手。


    *   **复杂性**：复现漏洞的难度，就非技术威胁行为者复现该漏洞的难度而言。设想评分范围从非常容易、容易、中等、困难到极其困难。


    '
