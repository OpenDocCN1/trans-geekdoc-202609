  trans: "\n\n# 深入剖析 vsFTPd 2.3.4 示例\n\n深入观察 vsFTPd 2.3.4 示例（图 11.5），可以看出 Shodan 似乎已确认该资产正在运行该服务。如果项目经理发现其资产之一正在运行此版本的\
    \ FTP，这可能意味着威胁行为者也能轻易看到此信息，并且在知晓存在多个漏洞利用代码的情况下，利用该过时服务进行攻击。\n\n![图 11.5 Shodan\
    \ 服务分析。](img/c11f005.png)\n\n**图 11.5 Shodan 服务分析。**\n\n## 风险识别流程\n\n在使用 Shodan\
    \ 时，风险识别流程实质上可分为几个部分：\n\n*   通过域名或 IP 地址查找资产。\n*   检查 Shodan 对资产拥有哪些信息或额外的测绘数据。\n\
    *   识别服务或基础设施上过时的版本。\n*   搜索可利用性。\n*   确认资产归属。\n*   尝试漏洞利用或将漏洞通报给受影响的团队。\n\n例如，在本例中，项目经理可能不知道针对各种服务或暴露端口是否存在任何漏洞利用代码。快速在\
    \ Google 搜索“vsFTPd 2.3.4”会弹出多个知名且成熟的漏洞利用代码（图 11.6）：\n\n![图 11.6 Google 搜索结果。](img/c11f006.png)\n\
    \n**图 11.6 Google 搜索结果。**\n\n如果资产确实被确认属于该企业，且经验证正在运行该服务，项目经理现在必须立即联系受影响的团队进行修复，因为该漏洞利用可能导致威胁行为者在服务器上实现远程代码执行。Shodan\
    \ 可以帮助项目经理快速识别易于利用的服务，以及此前可能未被知晓的过时组件或资产。\n\n## 11.3.2 Amass/crt.sh\n\n项目经理常见的误区是“他们了解组织所控制子域名的全貌”。漏洞赏金项目经理会惊讶地发现，基础设施团队遗弃了正在托管应用程序并将其暴露在互联网上的子域名，或造成了不必要的风险。`Amass`\
    \ 的功能远不止子域名枚举。然而，存在一种快速技术，可帮助项目经理被动快速识别子域名，以寻找额外的攻击面。\n\n此外，`crt.sh` 是一个可用于收集更多子域名并可能枚举组织正在使用的技术的工具。`crt.sh`\
    \ 会查找包含所提供根域名变体的所有证书，这很有帮助（甚至可能让项目经理大吃一惊）。枚举前未发现的域名可以导入 `Amass`（尽管重要的是要注意 `Amass`\
    \ 也会执行来自 `crt.sh` 的查询）或首选的子域名枚举工具，以发现更多待测试的资产。\n\n> **特别感谢 Donk 向我展示了 crt.sh（Twitter:\
    \ @donk_enby）。**\n\n### 11.3.2.1 Amass\n\n按照惯例，`Amass` 预装于 Kali Linux 或大多数其他渗透测试发行版中。首先，收集需要测试的域名列表。作为项目经理，维护所有子域名的列表是一项必要的工作，换句话说，没有子域名监管就等于没有漏洞监管。如果企业规模足够大，获取所有根域名的列表可能比较困难。如果组织使用\
    \ Amazon Web Services (AWS)，请与基础设施或网络团队沟通以确定所有资产。\n\n1.  首先，将所有根域名放入一个文件中，例如 `example.com`、`example2.com`\
    \ 等。完成后，将子域名转储到该文件中可以作为一种额外的测试方法，因为结果可能很有希望。\n\n2.  将域名/子域名放入文件后，使用 `Amass` 运行子域名枚举：\n\
    \n    ```\n    amass enum -df test.txt > subdomains.txt\n    ```\n\n    （图 11.7）\n\
    \n    ![图 11.7 Amass 扫描子域名。](img/c11f007.png)\n\n    **图 11.7 Amass 扫描子域名。**\n\
    \n    上述命令指示 `Amass` 使用 `-df` 开关对域名/子域名文件执行子域名枚举；随后将输出写入子域名文件（图 11.8）。\n\n   \
    \ ![图 11.8 Nano 中的子域名。](img/c11f008.png)\n\n    **图 11.8 Nano 中的子域名。**\n\n> **注意：如果在将输出写入文件时遇到问题，请确保被写入目录的权限正确。此外，如果\
    \ Amass 在运行几分钟后似乎在特定的每秒 DNS 查询速率处停滞，请停止该工具。**\n\n工具运行完成后，子域名将输出到指定的文件中。\n\n###\
    \ 11.3.2.2 crt.sh\n\n子域名枚举是测试的重要组成部分。尽管 `Amass` 会查询 `crt.sh`，但项目经理可能希望获得关于证书和所用软件的更全面概览。利用\
    \ `crt.sh` 是一种快速替代方案，可通过扫描发现可能被忽视的域名（图 11.9）。\n\n![图 11.9 使用 crt.sh 进行子域名枚举。](img/c11f009.png)\n\
    \n**图 11.9 使用 crt.sh 进行子域名枚举。**\n\n## 11.4 主动评估\n\n主动评估是指黑客测试漏洞的过程。如果项目经理不小心，主动阶段可能会对企业造成干扰。应极其谨慎行事，且在项目经理缺乏经验的情况下，不应尝试任何漏洞利用。强烈建议在进入此阶段前熟悉漏洞利用，因为这可能对生产环境造成损害。即使熟悉漏洞利用，一个好的做法是通过“渗透测试”主动看板或帖子通知组织，让大家知道如果发现任何异常流量请联系你。这样可以防止出现“全员出动”式的紧急情况。存在大量用于主动测试的工具。然而，这里将仅涵盖几个小方面（更多面向忙碌专业人士的自动化工具）。\n\
    \n### 11.4.1 nmapAutomator.sh\n\n几乎任何初学者黑客都了解 `nmap`，但 `nmapAutomator` 呢？该工具由\
    \ 21y4d 设计，可在 GitHub 上找到。它的创建旨在为网络和 Web 应用程序黑客攻击提供一种更简单的方式来组合多个工具集，包括对 tcp/udp\
    \ 进行完整的 `nmap` 端口和服务扫描、CVE 扫描，随后根据发现的端口/服务运行各种建议的侦察命令。此外，`nmapAutomator` 还将利用\
    \ `nikto`、`gobuster`、`sslscan`、`joomscan`、`wpscan`、`droopescan`、`smbmap`、`smbclient`、`enum4linux`、`snmp-check`、`snmpwalk`、`dnsrecon`、`ldapsearch`、`odat`\
    \ 等工具。该工具可用于各种场景，但最适合用于后端服务器。\n\n正如图 11.10 所示，有许多选项可结合 `nmapAutomator` 使用。项目经理可以使用命令\
    \ `./nmapAutomator.sh 10.0.0.212 All` 对资产执行全面扫描。命令执行后，工具将经历多个阶段，包括快速扫描、基础扫描和全面扫描（图\
    \ 11.11），然后评估给定服务以执行更精细的工具使用和漏洞扫描。所有结果将输出到一个文件夹中，以便以整洁有序的方式维护发现（图 11.12）。\n\n\
    ![图 11.10 nmapAutomator 扫描信息。](img/c11f010.png)\n\n**图 11.10 nmapAutomator 扫描信息。**\n\
    \n"
