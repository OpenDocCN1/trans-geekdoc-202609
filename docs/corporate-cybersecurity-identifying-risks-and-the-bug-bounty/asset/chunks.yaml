    \ Nonetheless, program managers should still research all of the options as, periodically,\
    \ functionality changes.\n\n# Part 4: Vulnerability Reports and Disclosure\n\n\
    # Chapter 7: Triage and Bug Management\n\n## 7.1 Understanding Triage\n\nTriage\
    \ is the act of reviewing vulnerabilities, and determining whether the report\
    \ warrants further action within the intake process.\n\n1.  **Determine if the\
    \ asset is in scope.**\n    If it’s not in scope, assess the criticality of the\
    \ vulnerability. If it isn’t a serious vulnerability, determine if the bug will\
    \ be triaged. In most cases, program managers will want to triage serious bugs,\
    \ even if the vulnerability is considered out of scope.\n\n2.  **Analyze the report.**\n\
    \    This includes attempting to see if the proof of concept that was submitted\
    \ is valid, determining criticality, and so on.\n\n3.  **Request additional information.**\n\
    \    Generally speaking, a program manager should not triage a vulnerability unless\
    \ it meets all of the criteria set out in the in-scope section of the program\
    \ description.\n    Ensure that any questionable information that’s provided is\
    \ clarified upon, generally, as it pertains to vulnerability validation. The criticality\
    \ of the bug can be changed later in the resolution process, as well as other\
    \ detail determinations.\n\n4.  **Triage the bug.**\n\n### 7.1.1 Validation\n\n\
    The vulnerability validation process should be handled diligently with respect\
    \ to the production environment, research authenticity, and program definitions.\
    \ While this sounds complex, it translates to making sure that bug handling occurs\
    \ in a way that isn’t detrimental to any sort of current production processes\
    \ and that adequate time and effort is dedicated to validating the bug.\n\nIn\
    \ addition to ensuring that a researcher’s report is handled swiftly in the validation\
    \ process, programs must be diligent about validation – for their own protection\
    \ in the communication processes and against financial manipulation.\n\n### 7.1.2\
    \ Lessons Learned\n\nFailure to validate and understand vulnerabilities can prove\
    \ deadly for an organization. The impact can be monetary loss, software engineering\
    \ distrust, and general reputational damage. It’s better to take a little time\
    \ to be valuable and assess the true impact of the vulnerability, and then to\
    \ quickly triage it. As a note, it never hurts to coordinate with peers if the\
    \ impact of the vulnerability is misunderstood or if there’s any sign of strange\
    \ validation anomalies. Additionally, the triage evaluation stage is a perfect\
    \ time to ask a researcher for more information. Bug bounty program managers must\
    \ make use of additional information gathering where necessary.\n\n### 7.1.3 Vulnerability\
    \ Mishaps\n\nWhen vulnerability mishaps occur, it’s the responsibility of the\
    \ program managers to accept the mistakes. Confrontation with the security researcher\
    \ over mishaps or any requests or threats made in an attempt to retrieve the money\
    \ are out of bounds. At the end of the day, it’s not the researcher’s fault when\
    \ a program does not validate the vulnerability. In fact, we are all human and\
    \ it’s not improbable that triage, the program manager, and the researcher could\
    \ have all made a mistake. Part of growth is accepting the issue and being transparent\
    \ with leadership if asked about the situation.\n\nThere’s a lot of room for improvement\
    \ in a program. Even the experts in the application security field know that there’s\
    \ no possible way they will know everything. Security is dynamic and a team effort.\
    \ One of the best ways to prevent mistakes from happening again is to ensure that\
    \ records of accidents have been maintained. Mishaps aren’t the end of the world,\
    \ but it’s difficult to know what to avoid in the future if accountability for\
    \ the mistakes isn’t accepted.\n\nOn top of self-accountability, there’s a possibility\
    \ a researcher might hold themselves accountable and message the program about\
    \ the mistake. Even though the probability of a researcher doing so is significantly\
    \ lower, don’t accept any sort of return and thank them for their honesty. No\
    \ one should be punished for a mistake that was made in good faith.\n\n### 7.1.4\
    \ Managed Services\n\nManaged services are discussed in [Chapter 3](#c03.xhtml).\
    \ It’s undeniable that using managed services is an essential component for a\
    \ wide range of programs. However, what does the vulnerability triage process\
    \ look like in the instance that an enterprise’s program managers allow a bug\
    \ bounty platform to do so? Having a team of professionals makes a world of a\
    \ difference when a program is bogged down with other cybersecurity incentives,\
    \ and the ability to have someone validate a bug and give the researcher peace\
    \ of mind is priceless.\n\nIn many cases, the program manager may wake up in the\
    \ morning, log in, and find that a vulnerability is nicely triaged, and the triage\
    \ team has exercised the liberty of cleaning up the researcher’s report so that\
    \ the program manager can adequately and quickly reproduce. Arguably, managed\
    \ services can even help reduce friction in the reporting process. Both small\
    \ and large enterprises can benefit in multiple ways. For example, a large program\
    \ may need a dedicated triage team through managed services because the alternative\
    \ might be having to hire employees to manage the program at a rate that is significantly\
    \ higher than using a bug bounty platform’s services. Alternatively, fewer employees\
    \ can be hired for the triage process, and the current program managers can expand\
    \ the program to focus on the validation portion of the reporting process. Smaller\
    \ programs can typically get away with avoiding managed services, but arguably,\
    \ the inexpensive nature and value of complex vulnerability validation can help\
    \ smaller enterprises expand their security teams without spending too much time\
    \ stuck in the triage loop.\n\nNonetheless, the same objective of validation must\
    \ occur, whether the program includes managed services or not. We are all prone\
    \ to error. If triage validates a bug, and assigns it to the program for resolution,\
    \ revalidate and ensure it meets scope criteria.\n\n### 7.1.5 Self-service\n\n\
    The process of managing one’s own process from report to end isn’t impossible\
    \ or improbable. When an enterprise chooses to do so, it’s safe to say that the\
    \ triage and validation portions of the report can nearly be combined. However,\
    \ program managers should be aware of the importance of separating triage or validation\
    \ and impact assessments. Vulnerabilities should not be automatically triaged\
    \ unless program managers are absolutely certain that it is a vulnerability and\
    \ that there’s no question about it. If the vulnerability can wait, triage should\
    \ always have a first look because a second opinion is a far safer option.\n\n\
    ## 7.2 Bug Management\n\nThe entire report management process can take quite a\
    \ bit of preparation and understanding to turn a clunky process into a smooth\
    \ workflow. Even though every aspect of the process is important, the overall\
    \ vulnerability management portion is the portion that the enterprise cares about\
    \ above all else – it is the reason why the program exists in the first place.\
    \ Try not to have a negative mentality or stress about the bug management process.\
    \ Application security engineers are typically equipped to deal with bug bounty\
