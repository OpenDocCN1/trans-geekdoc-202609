- raw: 'Once the role groups are made, users can be added to the groups based on appropriate
    roles to keep the program efficient and well managed. Adding users is a fairly
    simple task, the only thing program managers have to do is click on the user management
    tab, click on the “Invite User” button, and then enter an email address and pick
    the groups to assign to the user ([Figure 6.63](#c06.xhtml#c6-fig-0063)).


    ![Figure 6.63 Adding users option.](images/c06f063.png)


    [**Figure 6.63**](#c06.xhtml#rc6-fig-0063) Adding users option.


    #### 6.3.1.9 Audit Log


    The final section of the general subheader is the audit log. The audit log is
    for viewing all of the events that have occurred within the program ([Figure 6.64](#c06.xhtml#c6-fig-0064)).
    The events include actions that team members have taken as well as user agents
    and the date and region of occurrence. Maintaining accountability for actions
    within the program is important, especially if a lot of employees are participating
    in managing the program. In addition, HackerOne allows program managers to search
    by event, user, or date of the event occurrence. Audit log data can also be downloaded
    in CSV format.


    ![Figure 6.64 Audit log option.](images/c06f064.png)


    [**Figure 6.64**](#c06.xhtml#rc6-fig-0064) Audit log option.


    ### 6.3.2 Billing


    The billing subheader includes an overview, credit card setup, and prepayment
    for the bug bounty program pool. As stated in Section 6.3, it is essential to
    set up the billing section and fund the bounty pool as soon as possible. Delays
    in funding could result in a delay in the launch of the program.


    #### 6.3.2.1 Overview


    The overview section includes the current balance of bounties and fees that a
    program manager has paid to security researchers. In this section, an activity
    report is available which allows program managers to see all of the dates that
    they have awarded researchers as well as the fees and running balance ([Figure
    6.65](#c06.xhtml#c6-fig-0065)). Program managers can change the billing period,
    and view all of the month’s activity history. Additionally, program managers can
    export reports as PDF or CSV files.


    ![Figure 6.65 Overview of bounties and fees.](images/c06f065.png)


    [**Figure 6.65**](#c06.xhtml#rc6-fig-0065) Overview of bounties and fees.


    #### 6.3.2.2 Credit Card


    The credit card portion of the billing section is straightforward. A credit card
    can be saved within this section to be used for adding money to the bounty pool.


    #### 6.3.2.3 Prepayment


    Program managers should consult with the finance team responsible for organizational
    funding, or contact their account managers to seek guidance on requesting invoices
    and prepayments. Specific enterprises will have internal regulations for invoices.
    Therefore, it is pertinent to ensure that the correct procedure is followed.


    ### 6.3.3 Program


    The program subheader of the program’s setting tab, is used for the majority of
    the technical details that will be used for configuring the program and managing
    hacker interactions. Program managers can depend on this tab to set up nearly
    every aspect of the bug bounty program. Nonetheless, bug bounty crowdsourcing
    platforms typically have similar options. Even with option overlap, program managers
    should be aware of subtle differences in configurations between platforms.


    #### 6.3.3.1 Policy


    HackerOne’s policy tab is nearly identical to Bugcrowd’s policy configuration
    options. Owing to the nature of the policy being in use for a live, private bug
    bounty program, a screenshot will not be included. However, rest assured that
    the overlap makes the policy configuration within HackerOne easy to understand.


    #### 6.3.3.2 Scope


    The scope configurations within HackerOne are completely different from Bugcrowd’s
    scope and assets configuration. Program managers can click on the “Add asset”
    button, which will allow them to determine the rating and criticality of the assets
    as well as set labels, add instructions, and the live addition of the asset to
    the program. The “Add asset” page allows program managers to get fairly granular
    with considerations for researchers testing on the specific asset. In addition,
    program managers can scroll over most of the labels to determine what the labels
    mean ([Figure 6.66](#c06.xhtml#c6-fig-0066)).


    ![Figure 6.66 Adding assets.](images/c06f066.png)


    [**Figure 6.66**](#c06.xhtml#rc6-fig-0066) Adding assets.


    To determine the environmental score of an asset, program managers must understand
    the CIA Triad. The CIA Triad stands for confidentiality, integrity, and availability
    ([Figure 6.67](#c06.xhtml#c6-fig-0067)). Confidentiality impact can be determined
    by the exposure of sensitive data to a threat actor. Integrity typically pertains
    to the modification of data. For instance, a high integrity impact rating would
    mean that all of the files can be modified by a threat actor. Lastly, availability
    is the determination of the uptime of an asset. A program manager may think of
    availability as an environmental factor that is only impacted by a certain suite
    of vulnerabilities. However, program managers must consider how a specific type
    of attack affects all of the environmental factors. As an example, remote code
    execution could result in a total loss of confidentiality, integrity, and availability.
    If a threat actor were to gain complete root access to a server, for instance,
    they could shut the server down, steal data, or modify any of the data on the
    server giving the vulnerability the highest rating for environmental score. Other
    than the difference in criticality scoring, the scope is similar to most of the
    other program options utilized by other platforms.


    ![Figure 6.67 The CIA triad.](images/c06f067.png)


    [**Figure 6.67**](#c06.xhtml#rc6-fig-0067) The CIA triad.


    #### 6.3.3.3 Submit Report Form


    The “Submit Report Form” tab is where program managers can customize the introduction
    for submission templates ([Figure 6.68](#c06.xhtml#c6-fig-0068)). Program managers
    can customize the submit report form even allowing or hiding specific weakness
    configurations ([Figure 6.69](#c06.xhtml#c6-fig-0069)). However, it is highly
    recommended that program managers only hide weakness configurations that are blatantly
    regarded as out-of-scope attack vectors. Program managers should not attempt to
    hide legitimate weakness configurations just because they do not want to deal
    with the report. If the vulnerability is a legitimate issue, it would be better
    for the security posture of the enterprise if the program allows the submission
    and resolves appropriately.


    ![Figure 6.68 Submit report form option.](images/c06f068.png)


    [**Figure 6.68**](#c06.xhtml#rc6-fig-0068) Submit report form option.


    ![Figure 6.69 Customizing the report form.](images/c06f069.png)


    [**Figure 6.69**](#c06.xhtml#rc6-fig-0069) Customizing the report form.


    #### 6.3.3.4 Response Targets


    The “Response Targets” tab is where the program manager can set the time to “first
    response but time to triage” and the time to bounty as a baseline for the program
    ([Figure 6.70](#c06.xhtml#c6-fig-0070)). Additionally, the time to resolution
    projection can also be set for each vulnerability pending on the corresponding
    criticality. All of the days that the program manager sets as a target are just
    that: an anticipated date of action and not necessarily representative of the
    actual time it will take. Also, the target dates per action or in business days
    means that weekends do not count or identified the days the enterprise does not
    operate. An important aspect of evaluating the response targets is being honest
    as a program manager. While setting up the bug bounty program, the configuration
    should not be set to unrealistic response targets as it will dissuade researchers
    from future participation, especially if the targets are consistently missed.


    ![Figure 6.70 Response targets option.](images/c06f070.png)


    [**Figure 6.70**](#c06.xhtml#rc6-fig-0070) Response targets option.'
