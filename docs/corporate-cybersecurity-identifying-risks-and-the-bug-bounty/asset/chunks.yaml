- raw: 'Once the bug bounty program is created, it brings the program manager back
    to the dashboard in which they started. The dashboard allows the creation of additional
    programs but also allows program managers to click on a “Tasks” or the “Welcome
    center” tab ([Figure 6.10](#c06.xhtml#c6-fig-0010)). The tasks tab allows program
    managers to see a quick overview of all the to-do vulnerabilities within all of
    the programs, or even filter by specific programs.


    ![Figure 6.10 Vulnerability tasking tabs.](images/c06f010.png)


    [**Figure 6.10**](#c06.xhtml#rc6-fig-0010) Vulnerability tasking tabs.


    As seen, the program manager can see if there are any blockers or vulnerabilities
    that need to be dealt with or rewarded.


    The welcome center promotes all the various Bugcrowd documentation ([Figure 6.11](#c06.xhtml#c6-fig-0011)),
    including various videos to help program managers effectively run a bug bounty
    program. The welcome center can assist in leading a program in the right direction.
    If ever a program manager needs ideas to upgrade the program, fix common configuration
    issues, or understand the breadth of the vulnerability research space, the welcome
    center is the hub for knowledge. The welcome center contains hours of videos,
    manuals, questions, and studies highlighting best practices for managing effective
    programs. Program managers can benefit from taking the time to read through some
    of the documentation and to watch the included videos. While not necessary at
    first, it wouldn’t hurt to get a better understanding of the way Bugcrowd operates.


    ![Figure 6.11 Bugcrowd documentation.](images/c06f011.png)


    [**Figure 6.11**](#c06.xhtml#rc6-fig-0011) Bugcrowd documentation.


    Returning back to the main screen, there is a program dashboard the program manager
    can click on the dropdown menu to select the bug bounty program that they would
    like to manage ([Figure 6.12](#c06.xhtml#c6-fig-0012)).


    ![Figure 6.12 Program dropdown menu.](images/c06f012.png)


    [**Figure 6.12**](#c06.xhtml#rc6-fig-0012) Program dropdown menu.


    #### 6.2.2.2 The Crowd Control Navbar


    When a program manager clicks on their program in the dropdown menu, they will
    be directed to an interface that allows them to manage vulnerabilities and the
    more advanced configuration settings for the program.


    The top panel allows program managers to see a summary of the program, submissions,
    view and manage researchers, gain insights into the program, and view reports/modify
    settings ([Figure 6.13](#c06.xhtml#c6-fig-0013)).


    ![Figure 6.13 Crowd control navbar.](images/c06f013.png)


    [**Figure 6.13**](#c06.xhtml#rc6-fig-0013) Crowd control navbar.


    ##### Summary


    The summary page shows program managers all of the program’s recent activities
    as well as a quick snapshot of their assigned submissions and status of each submission
    that is currently within the program. Program managers can use this dashboard
    as a quick way to navigate to issues that need their attention and to get a general
    feel for the remediation processes and steps needed to push their program into
    an adequate state.


    ##### Submissions


    The submissions panel is a more extensive version of the summary page ([Figure
    6.14](#c06.xhtml#c6-fig-0014)). This page can be used for more advanced filtering
    of issues and allows program managers to have a much wider view of all of the
    submitted vulnerabilities and resolve them effectively. Program managers also
    have the option to download all of the submissions as a CSV file for tracking
    and sorting.


    ![Figure 6.14 Vulnerability submissions panel.](images/c06f014.png)


    [**Figure 6.14**](#c06.xhtml#rc6-fig-0014) Vulnerability submissions panel.


    ##### Researchers


    The researchers web page shows a total of all the researchers that have been invited,
    have submitted to the program, the total submissions, and the valid submissions.
    Underneath the totals, a program manager can see the participating researchers
    ([Figure 6.15](#c06.xhtml#c6-fig-0015)).


    ![Figure 6.15 Program participants tab.](images/c06f015.png)


    [**Figure 6.15**](#c06.xhtml#rc6-fig-0015) Program participants tab.


    Additionally, the “Invitations” tab allows program managers to invite researchers
    by email. Details of the researcher will not be revealed, to maintain a good privacy
    posture and allow the researcher to stay safe ([Figure 6.16](#c06.xhtml#c6-fig-0016)).


    ![Figure 6.16 Program invitations tab.](images/c06f016.png)


    [**Figure 6.16**](#c06.xhtml#rc6-fig-0016) Program invitations tab.


    ##### Rewards


    The rewards tab allows program managers to see the various metrics as they pertain
    to researcher rewards. A quick summary shows how many rewards were given out,
    the highest reward achieved, the average monetary amount given out, and the remaining
    reward pool. Program managers have the option to change the length of time that
    is evaluated in the upper-right-hand corner, and the “Reward History” will provide
    all of the researchers that were awarded in a given period ([Figure 6.17](#c06.xhtml#c6-fig-0017)).
    Program managers also have the option to download this as a CSV file. The rewards
    tab is useful as it allows higher-level management to analyze trends and project
    expansion and reward predictions.


    ![Figure 6.17 Program rewards dashboard.](images/c06f017.png)


    [**Figure 6.17**](#c06.xhtml#rc6-fig-0017) Program rewards dashboard.


    ##### Insights Dashboard


    The insights dashboard provides an overview of various trends and allows program
    managers to view valuable data and charts that help them understand the bug bounty
    program better ([Figure 6.18](#c06.xhtml#c6-fig-0018)). For example, the severity
    trend of reports and the volume of reports received can be viewed. Additionally,
    there are performance metrics, amounts paid to researchers by target, and an overall
    target breakdown ([Figures 6.19](#c06.xhtml#c6-fig-0019) and [6.20](#c06.xhtml#c6-fig-0020)).


    ![Figure 6.18 Insights dashboard: technical severity chart.](images/c06f018.png)


    [**Figure 6.18**](#c06.xhtml#rc6-fig-0018) Insights dashboard: technical severity
    chart.


    ![Figure 6.19 Insights dashboard: target breakdown.](images/c06f019.png)


    [**Figure 6.19**](#c06.xhtml#rc6-fig-0019) Insights dashboard: target breakdown.


    ![Figure 6.20 Insights dashboard: performance.](images/c06f020.png)


    [**Figure 6.20**](#c06.xhtml#rc6-fig-0020) Insights dashboard: performance.


    ##### Reports


    In the reports tab, program managers can generate reports on their program summary,
    program health and spend, and security posture reports. Program managers should
    occasionally generate and review these reports as it will assist in establishing
    a great deal of information on every aspect of their program.


    Review the Bugcrowd link for a more granular overview on reporting and instructions
    for doing so: [https://docs.bugcrowd.com/customers/program-management/generating-reports/#program-summary-report](https://docs.bugcrowd.com/customers/program-management/generating-reports/#program-summary-report).


    ### 6.2.3 Advanced Program Configuration and Modification


    All of the program settings from the initial setup can be modified. While the
    “Settings” tab is part of the crowd control navbar, there are many aspects to
    cover that warrant this tab having its own section in this chapter.


    #### 6.2.3.1 Program Brief


    The program brief web page is the first visual that a program manager will see
    when clicking on the “Settings” tab. Essentially, the program brief contains the
    basic settings of the bug bounty program ([Figure 6.21](#c06.xhtml#c6-fig-0021)).
    These settings were established when the program was first made, such as the program’s
    name, tagline, disclosure policy, safe harbor, etc. If any updates to the general
    program need to be made, this is the section that will be utilized.


    ![Figure 6.21 Program brief settings.](images/c06f021.png)


    [**Figure 6.21**](#c06.xhtml#rc6-fig-0021) Program brief settings.


    #### 6.2.3.2 Scope and Rewards'
