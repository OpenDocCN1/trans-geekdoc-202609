  trans: "\n\n# 范围与奖励\n\n范围与奖励部分是项目范围细节的更直观呈现。在本部分中，项目经理有特定能力深入了解重点领域的更多细节、哪些资产属于范围外，并根据自身判断修改安全港条款。此外，还可以在此讨论范围内和范围外资产的奖励细节。范围与奖励部分看似冗余，但其目的是表达企业的立场，以确保研究人员知晓所有可能性。例如，在初始配置期间，范围与奖励已设定完毕。然而，这将是一个很好的部分，可用作向研究人员解释范围细节的场所，因为企业可能心中有特定的想法。请查看以下屏幕截图（**图\
    \ 6.22**）：\n\n![图 6.22 范围详情。](img/c06f022.png)\n\n**图 6.22** 范围详情。\n\n正如在**图 6.22**的目标信息部分所见，已提供一组定义的凭据供测试使用。此外，同一图表还以示例形式突出了企业关注的领域。最后，本部分以自定义的“范围外”备注部分结束。范围详情部分不容小觑，因为未能谨慎处理此部分可能导致事故，例如研究人员尝试发起可能危害员工安全或企业环境的攻击。项目经理应努力仔细审查**第\
    \ 4 章**中理想的范围外攻击，并查看其他一些公开漏洞赏金计划的各种范围外部分，以很好地了解企业应努力避免的内容。在大多数情况下，分流团队将协助向研究人员解释围绕低级漏洞或缺乏影响力漏洞的问题。然而，问题在于企业漏洞赏金计划可能不愿接受的有效漏洞。请想象以下场景。\n\
    \n项目经理知道企业充斥着跨站脚本（XSS）漏洞。所有软件工程师都知道该域名上的几乎每个参数都存在 XSS 问题。企业仍希望利用私有漏洞赏金计划，但关注重点是那些不为人熟知的漏洞，例如本地文件包含、远程代码执行、HTML\
    \ 注入等。如果项目经理未考虑到受邀黑客的聪明才智，最终可能会收到大量 XSS 报告——因为该漏洞类型未被标记为范围外，可能导致漏洞赏金计划不得不向研究人员支付大量资金。项目管理最重要的方面之一是意识到说“啊，我们本该把这列入范围外部分”绝不是可接受的回应，企业将为此承担责任。\n\
    \n在大多数情况下，预设的安全港部分尚可，应予以保留。尽管如此，项目经理应与管理层沟通，确保所有人达成共识，且安全港充分反映企业需求。尽管如此，项目经理不应让高层管理或法务团队完全控制安全港条款或对此类条款的补充，因为结果可能过于苛刻，从而阻碍想要参与的安全研究人员。\n\
    \n## 目标组\n\n“目标组”部分也存在于本部分中。这是一种组织相似资产的有用方式，可防止研究人员疯狂敲击键盘，试图查看所有标签以寻找他们希望测试的内容。合乎逻辑的是，项目经理在创建组之前会想要添加所有相关资产。遗憾的是，要做到这一点，必须使用应用程序的另一个部分。请遵循以下说明：\n\
    \n1.  点击右上角的个人资料图片，然后在漏洞赏金计划名称下点击“目标”选项卡（**图 6.23**）：\n\n    ![图 6.23 个人资料下拉菜单。](img/c06f023.png)\n\
    \n    **图 6.23** 个人资料下拉菜单。\n\n2.  点击“目标”选项会弹出一个网页，其功能类似于项目初始设置时讨论的初始目标页面（**图 6.24**）。这将是添加和标记研究人员应测试的任何额外资产的好时机。\n\
    \n    ![图 6.24 目标选项卡。](img/c06f024.png)\n\n    **图 6.24** 目标选项卡。\n\n    > **注意：**\
    \ 请记住，并非每个资产都需要一次性添加。如果项目经理最初只有少数目标，或没有许多可以类似分组的资产——这没关系！随着项目扩展，可以利用分组。事实上，按现状建立分组（仅包含极少资产）以便为未来保持一切井井有条，无害无妨。\n\
    \n3.  添加所有相关资产后（如上所示），通过点击“选择项目”下拉菜单并选择该项目，返回范围与奖励部分（**图 6.25**）。\n\n    ![图 6.25 项目下拉菜单。](img/c06f025.png)\n\
    \n    **图 6.25** 项目下拉菜单。\n\n4.  再次点击众包控制导航栏上的“设置”选项卡（如前所述）。然后点击“范围与奖励”选项卡，最后点击“目标组”选项卡。\n\
    \n如果项目经理准备不足，添加分组可能简单却令人生畏，并演变成一团糟。实际上，分组利用选项对于调整奖励级别很有用，可用于将范围外报告转变为带有奖励的范围内报告。要添加分组，请执行以下操作。\n\
    \n1.  首先，点击“添加分组”按钮（**图 6.26**）。\n\n    ![图 6.26 “添加分组”按钮。](img/c06f026.png)\n\
    \n    **图 6.26** “添加分组”按钮。\n\n2.  目标组网页将弹出。对于标题，建议使用较宽泛的名称，以防止创建过多的分组。例如，拥有“Web\
    \ 应用程序测试”、“网络测试”、“移动应用程序测试”、“API 测试”等通用类别，将使安全研究人员更清楚要测试什么。然而，这并非必需，项目经理可根据具体情况使用更细粒度的名称。添加标题后，资产组的描述对安全研究人员很有用（**图\
    \ 6.27**）。\n\n    ![图 6.27 资产组的描述。](img/c06f027.png)\n\n    **图 6.27** 资产组的描述。\n\
    \n"
