    ## 7. Step 3: Bug Bounty Program Participation Guidelines


    Step 3 focuses on the bug bounty program participation guidelines.


    - The first slider allows a program manager to enable or disable Bugcrowd’s rating
    taxonomy. The specific guide outlining all of Bugcrowd’s ratings can be seen under
    the block of text. It’s highly recommended that a program manager use this taxonomy
    rating. Bugcrowd has been managing security research since 2011 and the VRT (vulnerability
    rating taxonomy) that they use is well maintained, frequently updated as new vulnerabilities
    are discovered, and reassessed. Alternatively, this can be turned off and self-maintained,
    but this is not recommended.

    - The next slider allows the program to accept reported issues that are adjacent
    to nontarget issues. In other words, imagine a researcher finds an `API` (application
    programming interface; a component that defines interactions between multiple
    software applications or mixed hardware/software intermediaries) key on `www.example.com`
    that allows them to interact with `login.example.com`. If the login subdomain
    is not in scope, and this slider is disabled, a researcher will not have the opportunity
    to report the vulnerability. It is recommended to allow researchers to report
    out of scope, even though it is noted that they will not be rewarded for the vulnerability.

    - The third slider enables or disables safe harbor. Program managers also have
    the option to select a partial or full safe harbor if the slider is enabled. The
    entire point of setting up a bug bounty program is giving security researchers
    a safe haven to hack while improving the effectiveness of the enterprise security
    posture. Program managers should enable the safe harbor option.

    - Last, the fourth and final slider of this section is the coordinated disclosure
    option. Enabling this slider gives the researcher the ability to request that
    their findings be published to the public. This option should be turned on. Security
    researchers that hack on a program put in their hard work to disclose to get paid
    and disclose to the public. If a program manager feels as if they are not ready
    to have patched vulnerabilities disclosed to the world, running a bug bounty program
    will prove futile. Silence is the exact opposite of what is needed to encourage
    the growth of an already fragile relationship between hackers and enterprises.


    ## 8. Step 4: Define Reward Ranges


    In step 4, reward ranges are defined ([Figure 6.6](#c06.xhtml#c6-fig-0006)). Choose
    the “Basic” radio button, especially if this is the first time managing a bug
    bounty program. Additionally, using the maximum advertised reward feature is unnecessary
    for a program starting out. Tweaking the reward amounts will come with time as
    vulnerabilities harden the enterprise security posture. Once the radio button
    is selected, click on the “Next step” button.


    ![Figure 6.6 Adding reward ranges by severity on Bugcrowd.](images/c06f006.png)


    [**Figure 6.6**](#c06.xhtml#rc6-fig-0006) Adding reward ranges by severity on
    Bugcrowd.


    ## 9. Step 5: Describe Ideal Research Concerns


    In step 5, program managers should describe what ideal research concerns look
    like. Describing areas of focus will help security researchers get a better understanding
    of what the enterprise is trying to accomplish. For example, imagine if a retail
    company runs a bounty program. They may write something like this ([Figure 6.7](#c06.xhtml#c6-fig-0007)):


    ![Figure 6.7 Identify goals and concerns on Bugcrowd.](images/c06f007.png)


    [**Figure 6.7**](#c06.xhtml#rc6-fig-0007) Identify goals and concerns on Bugcrowd.


    ## 10. Research Focus Considerations


    As a small example, some considerations focus on cash registers, exposure of sensitive
    customer data, and any vulnerabilities that can result in the theft of sensitive
    information. It’s highly important to tell researchers what the program is looking
    for. However, note that researchers will still attempt to research whatever they
    want if not explicitly stated as out of scope (and sometimes even still, if it
    is). Additionally, feel free to focus on specific classes of attacks instead of
    vectors of attack such as telling researchers that the program is highly interested
    in “local file inclusion” or “remote code execution,” and so on. This is a great
    space for the program manager to describe all of the important versus unimportant
    aspects.


    ## 11. Step 6: Technical Tagging


    Step 6 is the technical tagging follow-through after defining the vulnerabilities
    that the bug bounty program is concerned with. There are four sections of the
    tagging process: researcher activities, asset environments, languages and frameworks,
    and hosted and third-party applications ([Figure 6.8](#c06.xhtml#c6-fig-0008)).
    Defining these tags can be important as it can help the correct researchers participate.
    For example, if a researcher sees that a program is mostly concerned with mobile
    and `API` testing, they may decide that it is not for them, saving them a great
    deal of wasted time and encouraging the right research demographics to participate.
    Ensuring that asset tagging, research desires, and various frameworks and desired
    activities are defined is an essential process to help ensure that the program
    is adequately defined. Programs are free to limit the amount of information that
    is provided, but it does tend to hurt the general security stance and waste a
    researcher’s time.


    ![Figure 6.8 Select researcher activities, environments, languages, frameworks,
    and applications/services.](images/c06f008.png)


    [**Figure 6.8**](#c06.xhtml#rc6-fig-0008) Select researcher activities, environments,
    languages, frameworks, and applications/services.


    ## 12. Step 7: Adding the Look and Feel


    Next is “Adding the look and feel” – in short, uploading a logo, generating a
    tagline that will go under the program, and welcoming researchers to the program
    with a short description ([Figure 6.9](#c06.xhtml#c6-fig-0009)).


    ![Figure 6.9 Upload your company’s logo and create a tagline and introduction.](images/c06f009.png)


    [**Figure 6.9**](#c06.xhtml#rc6-fig-0009) Upload your company’s logo and create
    a tagline and introduction.


    ## 13. Logo and Introduction Details


    Additionally, a background color can be chosen for the logo, so give it the best
    attempt at a decent contrast to make it pop to a security researcher. The introduction
    space is nothing more than explaining who the program is and why they are hiring
    security researchers. The space can also be used to explain what the company does
    and their mission. Inspiring researchers to participate is the ultimate goal.


    ## 14. Step 8: Define Launch Timeline


    Step 8 focuses on defining a timeline for both a private and a public launch.
    If the program manager has already reached the phase of setting up the program,
    it typically indicates a certain level of readiness and a commitment to setting
    up a program. For the “Preferred private launch timeline” it is recommended to
    prepare to launch “Within a month.” As program managers tend to learn, a public
    program launch is a far bigger commitment. Program managers should select the
    “More than a month after private launch” option as there will be plenty of work
    to accomplish to enable a public launch.


    ## 15. Final Submission


    Finally, when the next button is clicked in step 8, a page will populate that
    highlights all of the incentives. Review all of the submitted information and
    click “Submit” when ready to move on to the next phase.


    ## 6.2.2 Program Overview


    Now that the program is fully set up, getting a feel for the various options and
    functionality is the next step in understanding how to manage a bug bounty program.
    Program managers should get familiar with all of the various pages and each of
    the ways to modify existing program settings to prevent any issues when the program
    goes live.


    ### 6.2.2.1 The Program Dashboard

