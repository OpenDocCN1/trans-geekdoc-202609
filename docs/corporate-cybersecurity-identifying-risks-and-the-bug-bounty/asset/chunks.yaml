    \ The suggestion to consider full-time bounty hunters’ need for money isn’t affirmation\
    \ to pay for invalid bugs, simply something to remember when realizing the amount\
    \ of power that program managers amass. There’s nothing wrong with a security\
    \ researcher being financially motivated. A program manager should not be fearful\
    \ of a researcher who approaches and immediately asks about financial reward.\
