- raw: "To elaborate, imagine that the enterprise has 120 security researchers. If\
    \ after a few weeks, it’s getting close to 200 and no reports have come in, it\
    \ may be time to expand scope. Exhausted scopes can discourage security researchers.\
    \ Overly restrictive scopes tend to have the same effect. Therefore, dynamic adaptations\
    \ within program management need to be used when the program becomes stagnant.\n\
    \n## 12.5 Managing Expansion\n\nThe same processes that have been applied to the\
    \ pre-considerations of setting up a program should be applied to scope expansions.\
    \ Testing, communicating with teams and developing expectations with leadership\
    \ are essential parts of this process. A program manager should not attempt to\
    \ form any expansion processes until a baseline level of security is considered.\n\
    \n# 13   \n\nPublic Release\n\n## 13.1 Understanding the Public Program\n\nUltimately,\
    \ the public program is the end state. Most legitimate bug bounty programs aspire\
    \ to finally opening up their doors to everyone. As is any other expansion incentive,\
    \ the biggest consideration is a matter of being prepared for this undertaking.\
    \ A lack of preparedness or a premature launch can result in the complete obliteration\
    \ of enterprise reputation. The public program is meant to be a way of giving\
    \ anyone and everyone a chance to research. Many enterprises may never reach this\
    \ state depending on the size of their program, but it’s undoubtedly the final\
    \ incentive that most will want to reach.\n\n## 13.2 The “Right” Time\n\nRegardless\
    \ of the desired launch, there isn’t exactly a right time to launch. The key principle\
    \ is to not launch too early, to avoid issues with the team being overwhelmed.\
    \ Thinking about whether an enterprise should open a program is more than just\
    \ a standard yes or no. A public program means full transparency at all times,\
    \ and even with a limited scope researchers typically manage to find a ton of\
    \ vulnerabilities. Considering the various aspects of a public program launch\
    \ is an absolute necessity:\n\n1.  Employees: does the enterprise have enough\
    \ employees to manage the incentives if it gets busy? For example, if an application\
    \ security team has three employees overseeing dozens of high-priority projects,\
    \ it may become necessary to set up a separate dedicated bug bounty program team\
    \ alongside them.\n\n2.  Analysis: has the entire program been through rigorous\
    \ testing? In a scope expansion, only the added assets have to be tested, but\
    \ prior to public launch, testing is needed to prevent paying out for a lot of\
    \ easily identifiable vulnerabilities.\n\n3.  Team: is the entire team on board\
    \ for the expansion? Does everyone realize their roles in their process and the\
    \ level of effort and coordination needed?\n\n4.  Finances: does the enterprise\
    \ have a flexible enough bounty pool in the event that a lot of high-impact vulnerabilities\
    \ are reported quickly?\n\n5.  Statistics: how many hackers are currently within\
    \ the program and how often are vulnerability reports received? Has scope been\
    \ expanded multiple times prior to the public program being initiated?\n\nWhile\
    \ there are many more aspects that can be evaluated, the above highlights some\
    \ pertinent questions that should be asked prior to such a big expansion. Program\
    \ managers should take the time to be honest about their assessment to ensure\
    \ that they do not sink the program by launching before the enterprise and the\
    \ employees are ready to deal with the work.\n\n## 13.3 Recommended Release\n\n\
    Managed services and account managers exist for a reason – utilize them. One thing\
    \ is known for certain: an enterprise should not take a bug bounty program public\
    \ until it can handle managing over 100 hackers and is prepared for a giant spike\
    \ in reports. Managing the public release of a program requires diligent planning\
    \ and careful execution, especially if the program belongs to a big-name company.\
    \ The official recommendation is to release **when ready** and not based on a\
    \ specific guideline. While having over 100 hackers seems to be a decent milestone,\
    \ it may not equate to a prepared enterprise bug bounty program.\n\n### 13.3.1 Requirements\n\
    \nTo play it safe, program managers should aspire to check off all of these tasks:\n\
    \n*   Have 100 active hackers participating in the bug bounty program.\n\n*  \
    \ Receive multiple vulnerability reports weekly.\n\n*   Analyze the budget to\
    \ ensure that the enterprise can ingest new costs and associated risks.\n\n* \
    \  Present an adequate plan of expansion to management.\n\n*   Explain any new\
    \ workflow predictions to fellow colleagues or managed employees.\n\n*   Prep\
    \ the software engineers for the release and inform the organization with a mass\
    \ notice.\n\nEnsure that, as a baseline, all of the above bullet points are met.\
    \ In actuality, a program manager may have to adapt and should analyze **each\
    \ and every** possibility.\n\n## 13.4 Rolling Backwards\n\nThe reason it’s important\
    \ to express all of the necessary precautions is because a rollback of the launch\
    \ of a public program isn’t a great start. It can be detrimental to the security\
    \ team because it’s embarrassing, as well as the software engineers (depending\
    \ on the issues that occur). For example, if a public program is launched and\
    \ the reports are overwhelming, a program manager may end up rolling back the\
    \ program as it may be the only way to catch up with all the reports, especially\
    \ if underprepared or understaffed. Doing so can hurt security researchers and\
    \ cause a lot of mistrust and paranoia about the status of their report. It’s\
    \ best to gather in all of the reports that were submitted prior to the closure\
    \ of the public program to prevent unnecessary refute. Still, rolling a program\
    \ back into private mode may be the only way to handle a situation in which a\
    \ program manager wasn’t prepared. Always have a backup plan.\n\n## 13.5 Summary\n\
    \nTo be frank, not every program manager will receive the opportunity to take\
    \ their program public – especially if consistently underfunded and overworked.\
    \ While the goal should always be to launch a public program, it may simply not\
    \ be on the cards for a smaller asset with no capacity to manage such incentives.\
    \ It’s not necessarily a cut-and-dry requirement to have to push a program into\
    \ a public state. Feel out the idea of taking the program public and maintain\
    \ an effective private program for a while before deciding to do so.\n\n# Index\n\
    \n*   accountability, [91](#c06.xhtml#page_91) \n\n    *   continuous, [141](#c09.xhtml#page_141)\n\
