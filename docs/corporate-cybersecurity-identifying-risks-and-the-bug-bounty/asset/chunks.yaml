    模糊测试也是内部评估的一个重要方面。黑客喜欢直接跳到利用的核心部分，这导致许多人忘记了，有时少即是多。最好的攻击是黑客了解关于目标的一切。因此，项目经理应努力比参与的安全研究人员多了解两倍的信息。模糊测试的理念是在
    Web 应用程序上搜索隐藏文件或目录。Dirsearch 简化了这一过程。与大多数工具一样，开始使用需要从 GitHub 下载，除非它已预装在所选的渗透测试操作系统中。Dirsearch
