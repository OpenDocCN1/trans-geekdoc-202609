- raw: "3.  *Scenario: Disrespect* On a Friday, a security researcher identifies a\
    \ critical remote code execution vulnerability. Shanice gathers all of the information,\
    \ and immediately reports it to her manager, who also informs the chief information\
    \ security officer. The affected team, the API development team, only has two\
    \ employees (a manager and Jaycee, the principal software engineer). Shanice reaches\
    \ out to Jaycee about the vulnerability and is ignored for several hours. After\
    \ finally touching base with the engineer, Jaycee responds and states she doesn’t\
    \ believe the vulnerability really matters, and that she has higher priorities.\
    \ Shanice explains why it matters, in a professional manner, and Jaycee escalates\
    \ – stating that she has better things to do than deal with this and she can wait\
    \ until Monday morning. Quickly, Shanice tries to refute this, but Jaycee stops\
    \ responding. Jaycee’s manager catches wind of the situation and tries to work\
    \ it out with Shanice, but ultimately agrees that the team doesn’t believe it\
    \ matters and that the team’s workflow is already heavy.  \n\n     **Analysis:**\
    \ in this situation, Shanice approached the scenario correctly from a professional\
    \ perspective, but could use a bit of guidance on proper escalation procedures.\
    \ Explaining the criticality and why a vulnerability matters to software engineers\
    \ is an essential skill that all program managers must acquire. However, this\
    \ scenario seems particularly heated, at least from Shanice’s perspective. When\
    \ a scenario becomes negative enough that a software engineer believes they can\
    \ say no and ignore the security team, a program manager should immediately escalate\
    \ to leadership. When a vulnerability is critical enough, program managers should\
    \ put reservations of escalation aside and think about the security of the enterprise.\
    \ Failure to remediate quickly could be enough for an organization to fail to\
    \ protect user data, infrastructure or other key components of the organization.\n\
    \n### 9.5.3 Summary\n\nThe scenarios described in the examples are not the only\
    \ issues that can happen in the bug bounty resolution lifecycle. The key takeaway\
    \ is understanding that program managers must appropriately use critical thinking\
    \ to adequately think on their feet and resolve issues in a logical manner. It’s\
    \ not appropriate to unnecessarily escalate issues that can be resolved or ignore\
    \ issues that should clearly be escalated. Maintaining a kind but fair approach\
    \ is the best way a program manager can operate the bug bounty program successfully,\
    \ throughout the entire lifecycle.\n\n## 9.6 Continuous Accountability\n\nProgram\
    \ managers have an obligation to follow up in the vulnerability remediation process.\
    \ Assigning vulnerability tickets to affected teams with no due date, or not actually\
    \ following up with the teams for remediation, is a simple way to burn money and\
    \ tank a bug bounty program. Security researchers will want their issues to be\
    \ resolved, but this cannot happen when teams are not being held accountable.\
    \ Although a close relative of the category of escalation, continuous accountability\
    \ is the full responsibility of the program manager.\n\n### 9.6.1 Tracking\n\n\
    Proper accountability is more or less a matter of ensuring that all of the vulnerabilities\
    \ that have been communicated are tracked from start to finish. It’s highly recommended\
    \ to use the ticketing processes described in [Chapter 7](#c07.xhtml). Technically,\
    \ a program manager can maintain vulnerabilities however they want, but ticketing\
    \ systems such as Jira are the preferred methodologies to maintain full oversight\
    \ of any blockers in the vulnerability resolution process.\n\n### 9.6.2 Missed\
    \ Deadlines\n\nIn reality, it would be extremely unfair to assume that a bug bounty\
    \ program will maintain the SLA in every scenario. Even the best program managers\
    \ can possibly miss a deadline, and the same can be said about the top software\
    \ engineers. Life happens, and the vital takeaway piece of information is to remember\
    \ to stay calm in the instance of a missed deadline. A few key steps will prevent\
    \ a missed deadline from turning into a disaster:\n\n1.  First and foremost, notify\
    \ leadership. Bug bounty programs cannot be effective if transparency isn’t maintained.\
    \ However, don’t notify leadership without a plan, and there’s no need to escalate\
    \ if there’s a fairly good reason for why the deadline was missed. For example,\
    \ if a software engineer did not meet the deadline by a day because of something\
    \ else that went wrong in the production environment, generally speaking a program\
    \ manager would notify leadership of the deadline. However, if, for instance,\
    \ the program manager forgot about a vulnerability and then it was two months\
    \ overdue, transparency with leadership is essential. Being honest is of paramount\
    \ importance.\n\n2.  Communicate about the issue. Maintain communication with\
    \ the appropriate team to resolve the issue. Inform them that it’s overdue and\
    \ explain the importance of fixing the vulnerability.\n\n3.  Notify the researcher.\
    \ Obviously, letting the researcher know that the resolution is in progress is\
    \ important. However, this is not nearly as important as actually fixing the issue\
    \ or notifying leadership of any blockers in the resolution process.\n\n# 10 \
    \  \n\nHacker and Program Interaction Essentials\n\n## 10.1 Understanding the\
    \ Hacker\n\nA program manager should never automatically assume that the hacker\
    \ holds “x” intention. Security research is delicate, but the common misconception\
    \ is that hackers are motivated by money. Many program managers don’t understand\
    \ the value of security research until they’ve been managing a bug bounty program\
    \ for a while. Understanding why a hacker participates isn’t always as simple\
    \ as it seems.\n\n### 10.1.1 Money, Ethics, or Both?\n\nHackers’ motivations vary.\
    \ Some hackers are from countries where the value of the US dollar scales exceedingly\
    \ well with their local currency. Therefore, even smaller payouts can work wonders.\
    \ Researchers that are motivated to work for money aren’t necessarily unethical,\
    \ and shouldn’t be viewed as such – after all, bug bounty hunting is a day job\
    \ for many across the world. Bug bounty program managers should consider the possibility\
    \ that the security researcher reporting the vulnerability could rely on it as\
