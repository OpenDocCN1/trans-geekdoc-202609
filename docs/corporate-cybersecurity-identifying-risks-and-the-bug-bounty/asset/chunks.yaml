    在审查报告流程时，这看似无害，对吧？研究人员提交了他们自认为是漏洞的内容，而企业确认相关凭证已不再使用。但如果这些凭证*正在*使用呢？分流员或安全研究人员能分辨出区别吗？不幸的答案很简单：*不能*。除非研究人员有充分证据证明他们能够与服务器进行交互，否则此时无法做太多事情。没有任何事情能阻止应用安全团队向维护凭证的团队进行询问，后者随后决定轮换凭证，并假装该漏洞从未存在过。


    安全研究人员的漏洞发现被项目窃取的情况并非虚构。事实上，许多安全研究人员都能证明此类研究被窃取的存在。漏洞赏金项目与安全研究人员之间的问题在于金钱和法律约束。大型企业通常配备律师，可在发生法律后果时提供支持。此外，项目使用统一的保密协议（NDA）将研究人员束缚在沉默之中。虽然大多数项目的初衷并非利用
    NDA 将研究人员困在法律纠纷中并窃取研究成果，但*这种事确实发生过*。确定过错是另一个棘手的情况。响应事件的项目经理可能没有检查凭证是否有效，或者可能因企业限制而无法检查。在这种情况下，沟通对于缓解进一步的问题至关重要。


    ## 4.13 认知与声誉损害


    强调部分安全研究人员将面临的问题，并非为了羞辱项目。作为在项目上工作或运营项目的工程师或经理，关键在于认识到技术无能或不道德行为是不可原谅的。专业人士需要尽自己的责任为更大的利益做贡献，而在漏洞研究被窃取、或报酬被公然拒绝的场景中，这会直接影响企业。


    社交媒体已成为新常态。大多数企业都维护着社交媒体页面，高层管理人员频繁使用流行社交媒体网站的情况并不少见。漏洞赏金项目运营不善的一个意外后果是，安全研究人员会在社交媒体网站上升级事态。当研究人员感觉未被倾听，或认定他们的研究成果被窃取时，不要惊讶于他们会在社交媒体上发声表达担忧。通过参与漏洞赏金平台签署的
    NDA 似乎是一个有效的对策。然而，对研究人员来说，这很少是终极手段。如果这意味着他们有能力追究项目经理的责任，许多人毫不介意甚至不假思索地让自己的漏洞猎人资料被封禁。


    漏洞赏金猎捕是一个小众行当。并没有数百万靠研究获利的漏洞赏金猎人。话虽如此，这个圈子足够小，能够形成一份内部“烧毁名单”，列出那些在沟通或解决方面表现明显可疑的项目。问问任何资深漏洞赏金猎人该避开哪些项目，他们极有可能会列出一份像避瘟神一样避之不及的项目清单。研究人员并不总是受害者。不幸的真相在于，有时船长会随船沉没——换句话说，即使安全研究人员有错，他们也可能对抗项目，并造成巨大的声誉损害。


    ## 4.14 统筹全局


    故事的寓意是：运营项目需要耐心和诚实。有时，所需的诚实程度令人震耳欲聋，甚至让人感到自我挫败。没有任何一个项目经理或在项目上工作的工程师拥有所有答案。假设可能出现这样一种情况：漏洞难以理解，或似乎根本无法掌握，这并不无理。在缺乏对漏洞理解的情况下，应联系应用安全领域的其他人士寻求指导。


    对报告寻求第二意见无伤大雅，从事网络安全领域工作的人员需要知道何时这样做是合适的。每个人都想成为超级巨星，但成为应用安全专家要求知道何时寻求帮助、何时独自解决问题。研究人员没有义务与企业合作。通过漏洞赏金项目发现的许多漏洞，其被用于金融剥削的潜在价值远超公司为该漏洞支付的任何金额。


    ## 4.15 漏洞赏金支付


    虽然有多种方法来确定合理的支付金额，但现实取决于项目类型、企业预算和项目知名度。支付永远不可能是“一刀切”的场景，因此在确定合适的支付表时，务必牢记这一点。有几个问题和步骤可以协助确定过程，并让项目和安全研究人员都感到愉快。


    ### 4.15.1 确定支付金额


    首先，在创建任何与支付相关的内容之前，请了解这一点：能否为漏洞缓解的价值分配一个货币金额？运营漏洞赏金项目意味着*必须*分配货币价值，或至少提供某种形式的补偿。然而，请记住，安全漏洞造成的损失可能比给安全研究人员的任何形式的支付都要痛苦和昂贵得多。在项目为关键漏洞支付
    10,000 美元的情况下，与威胁行为者利用漏洞可能导致的数百万美元损失相比，这可能只是九牛一毛。


    考虑到支付金额，有两种选择：设定固定值或设定范围。虽然设定具体的奖励值似乎是个不错的选择，但它限制了范围和确定粒度的能力，特别是在漏洞处于高危和严重评级之间、或中危和低危评级之间的微妙界限时。按漏洞严重程度设定项目奖励范围是应对棘手情况的一个非常有用的选项。


    一位安全研究人员发现了一个存储型 XSS 漏洞。不幸的是，该载荷只能存储在应用程序中一个范围极其有限的部分。也许它需要一份昂贵的订阅，导致针对其他用户复现攻击的现实性相当低。尽管如此，这种攻击仍有潜力被视为“低报酬”，甚至完全不符合支付资格。现在，想象一下研究人员上报了它，而在报告过程中，负责分流漏洞的工程师触发了该存储型
    XSS 漏洞，结果获取了一个独立内部用户管理平台的认证令牌。所描述的这种场景并非不可能，过去已在其他公司发生过。


    漏洞赏金项目经理现已成功评估了该漏洞，它看起来像是一个自存型 XSS 漏洞。管理项目的工程师将此漏洞标记为超出范围。在报告被标记为不合格后，研究人员注意到其
    XSS 载荷所用域名附带的日志记录机制，并发现了该令牌。研究人员现已成功获得对企业用户管理门户的访问权限。在公司门户内，有数千条个人身份信息（PII），且拥有对其他用户执行账户操作的无限权限。

    '
