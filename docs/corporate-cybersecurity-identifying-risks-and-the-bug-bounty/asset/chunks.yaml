- raw: 'When reviewing the reporting process, it’s seemingly harmless, right? The
    researcher submits what they believe to be a vulnerability, and the enterprise
    confirms that the credentials are no longer in use. What if they *were* in use?
    Would the triagers or security researcher know the difference? The unfortunate
    answer is a simple, *no*. Unless the researcher has adequate proof that they were
    able to interact with the server, not much can be done at this point. Nothing
    is stopping the application security team from inquiring with the team maintaining
    the credentials, who then decide to rotate the credentials and pretend that the
    vulnerability never existed.


    The situation in which a program steals vulnerability findings from a security
    researcher isn’t unrealistic. In fact, many security researchers can attest to
    the theft of such research. The issue with a bug bounty program versus a security
    researcher is that of monetary and legal binding. A large enterprise typically
    has lawyers on hand who can contribute toward the cause in the event of legal
    fallout. In addition, programs use blanket nondisclosure agreements (NDAs) to
    bind researchers into silence. While the intention of most programs isn’t to use
    an NDA as a means of trapping researchers into legal battles and stealing research,
    *it has happened*. Determining fault is yet another tricky situation. The program
    manager responding to the incident may not have checked to see if the credentials
    were working, or may not have been able to because of enterprise restrictions.
    Communication is essential to the mitigation of further issues during these circumstances.


    ## 4.13 Awareness and Reputational Damage


    The intent of highlighting the issues that some security researchers will face
    isn’t to shame programs. As an engineer or manager working on or running a program
    the takeaway is to realize that technical ineptitude or immoral behavior isn’t
    excusable. Professionals need to do their part to contribute to the greater good,
    and in the scenarios in which vulnerability research is stolen, or payment is
    blatantly refused, it can directly impact the enterprise.


    Social media is the new norm. Most businesses maintain social media pages, and
    it’s not uncommon to witness upper management frequently using popular social
    media websites. An unintended consequence of running a bug bounty program poorly
    is escalation from security researchers on social media websites. When a researcher
    does not feel heard, or they determine that their research is being stolen, don’t
    be surprised to see them take to social media with their concerns. An NDA via
    participating in a bug bounty platform seems like an effective countermeasure.
    However, it’s rarely the be all and end all from a researcher. Many people have
    no issue or second thought about getting their bug hunting profile banned if it
    means that they have the ability to possibly hold program managers to account.


    Bug bounty hunting is a niche trade. There are not millions of bug bounty hunters
    getting paid for their research. With that being said, the community is small
    enough to develop an internal burn list of programs that have been notably sketchy
    in their communications or resolution. Ask any seasoned bug bounty hunter which
    programs should be avoided and they will more than likely have a list of programs
    to avoid like the plague. Researchers aren’t always being wronged. The unfortunate
    truth resides in the fact that sometimes the captain goes down with the ship –
    or in other words, even if a security researcher is in the wrong, they may possibly
    fight the program, and cause great reputational harm.


    ## 4.14 Putting It All Together


    The moral of the story: running a program requires patience, and honesty. At times,
    the level of truthfulness that is required is deafening, and can feel self-defeating.
    No one program manager or engineer working on a program has all of the answers.
    It’s not unreasonable to assume that a situation may occur in which a vulnerability
    is difficult to understand, or seems downright impossible to grasp. In situations
    where comprehension of a vulnerability is lacking, reach out to other individuals
    in the application security space and ask for guidance.


    It does not hurt to get a second opinion on a report, and individuals working
    in the cybersecurity space need to know when it’s appropriate to do so. Everyone
    wants to be a superstar, but being an application security expert requires knowing
    when to ask for help and when to work through the issue alone. Researchers are
    not obligated to work with enterprises. A lot of the vulnerabilities identified
    through bug bounty programs can be abused for financial exploitation far past
    any monetary amount that the company would have paid for the vulnerability.


    ## 4.15 Bug Bounty Payments


    While there are many ways to determine responsible payout amounts, the realism
    lies with the program type, enterprise budget, and visibility of the program.
    Payments can never be a one-size-fits-all scenario, so it’s important to keep
    that in mind when determining the right payment table. There are several questions
    and steps that can be taken to assist in the determination process and make it
    enjoyable for both the program and security researcher.


    ### 4.15.1 Determining Payments


    First and foremost, before anything pertaining to payments is created, know this:
    can a monetary amount be assigned to the value of vulnerability mitigation? Running
    a bug bounty program means that a monetary value *has* to be assigned, or at least
    some form of compensation. However, remember that a breach can be far more painful
    and costly than any form of payment that would be given to a security researcher.
    In the instance where a program pays $10,000 for a critical vulnerability, that
    could be a drop in the bucket compared to millions of dollars that could be paid
    in the instance of threat actor exploitation.


    With payment amounts in mind, there are two options: set values or set ranges.
    While setting specific reward values may seem like a great option, it limits the
    scope and ability to determine granularity, especially in the instance that a
    vulnerability is riding a fine line between a high and a critical rating, or a
    medium and a low rating. Program reward ranges per vulnerability criticality is
    an incredibly useful option for tricky situations.


    A security researcher discovers a stored XSS vulnerability. Unfortunately, it’s
    a payload that can only be stored in a part of the application that is exceedingly
    limited in scope. Maybe it requires an expensive subscription in which the realism
    of replicating the attack against another user becomes fairly unlikely. Nonetheless,
    there’s a potential in which this attack may be considered “low paying,” or not
    qualified for payment at all. Now, imagine that the researcher reports it, and
    during the reporting process the engineer triaging the vulnerability triggers
    the stored-XSS vulnerability, and it results in an authentication token for a
    separate internal user management platform being acquired. A scenario described
    as such isn’t unlikely, and has happened to other companies in the past.


    Bug bounty program managers have now successfully evaluated the bug, and it appears
    to be a self-XSS vulnerability. The engineer managing the program marks this vulnerability
    as out of scope. After the report is marked as disqualifying, the researcher takes
    note of the logging mechanism attached to the domain that was used in their XSS
    payload, and notices the token. The researcher has now successfully obtained access
    to the enterprise user management portal. Inside of the company portal, there
    are thousands of pieces of personally identifiable information and unlimited access
    to perform account actions on other users.'
