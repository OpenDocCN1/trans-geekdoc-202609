- raw: "In a scenario described as the one above, the security researcher has taken\
    \ an action that may have been considered out of scope or a low-payable action,\
    \ and has completely escalated it to a critical vulnerability. As a program manager,\
    \ it has to be decided how to pay the researcher – if at all. However, the situation\
    \ has escalated into a bit of a predicament. Should the program pay the researcher?\n\
    \nEarlier in the chapter, it is stated that critical research is valuable. However,\
    \ the actions were resultant of a specific scenario that may be considered out\
    \ of scope from several different angles (social engineering, nearly self-XSS).\
    \ When a situation occurs in which you want to pay a researcher, but maybe not\
    \ as much, a rewards range can make the difference.\n\nThe difference between\
    \ the values and the range make quite the impact (see [Table 4.1](#c04.xhtml#c4-tbl-0001)).\
    \ In the described situation in which a researcher performs the stored XSS abuse\
    \ (which may be considered somewhat out of scope), a program that wants to compensate\
    \ the researcher fairly might struggle. They most certainly don’t want to pay\
    \ them $5000 but, on the other hand, paying $3000 isn’t quite on the cards, based\
    \ on the out-of-scope effort and the level of complexity required in exploitation.\n\
    \n[**Table 4.1**](#c04.xhtml#rc4-tbl-0001) Setting Bug Bounty Reward Values and\
    \ Ranges.\n\n| **Set Reward Values**  |\n\n| --- |\n\n| Critical || High || Medium\
    \ || Low |\n\n| $5000 || $3000 || $1000 || $200 |\n\n| **Set Reward Values** |\n\
    \n| Critical || High || Medium || Low |\n\n| $3500–$5000 || $1500–$3000 || $400–$1000\
    \ || $50–$200 |\n\nA reward range makes more sense. The program knows that they\
    \ don’t want to pay the researcher between $3500 and $5000, and $3000 was undoubtedly\
    \ a little too steep for the specific scenario. Luckily, the range varies between\
    \ $1500 and $3000. The program then decides to pay the researcher $1500 dollars.\
    \ Reward ranges give an enterprise breathing room when more complicated vulnerability\
    \ submission events occur. Instead of paying a hefty $3000 for an event that was\
    \ out of scope, a program can now choose to pay $1500 – rewarding the researcher\
    \ for their efforts (without discounting the research) and maintaining a positive\
    \ affirmation for researchers that stay in scope by giving them the potential\
    \ to earn $3000.\n\n### 4.15.2 Bonus Payments\n\nThe burning question: “When should\
    \ a bonus payment be used?”\n\nA bonus payment should be used in instances where\
    \ there’s a unique circumstance. For example, if a researcher were to find a duplicate\
    \ vulnerability but write a highly extensive report detailing the vulnerability\
    \ in length and provide new evidence, consider a bonus payment. Bonus payments\
    \ don’t have to be excessive or used frequently, but they can be a way to say\
    \ thanks to an awesome researcher.\n\nAn alternate use case for bonus payments\
    \ is when exploitation bypasses the normal means of criticality, and the bug bounty\
    \ program wants to be fair. Imagine a program in which the top reward (critical)\
    \ was set at $4500. In an instance where a researcher was able to pivot from the\
    \ web application to the backend, and from the backend server to the domain controller\
    \ and obtain sensitive information, would $4500 be a fair reward? Bonus payments\
    \ can help extend enterprise reward capacity without requiring an extremely large\
    \ reward range to be set by the program manager. There’s not a set answer when\
    \ it comes to awarding researchers bonus payments. Use the best possible discretion\
    \ and be willing to reward researchers for creative instances of vulnerability\
    \ exploitation.\n\n### 4.15.3 Nonmonetary Rewards\n\nAn aspect that’s frequently\
    \ overlooked in the payment process is “swag.” A lot of programs can benefit by\
    \ using swag as a motivating incentive. It shouldn’t come as a surprise that many\
    \ security researchers like to hack because it’s fun. In fact, most CVEs (common\
    \ vulnerabilities and exposures) are a result of security researchers putting\
    \ in their hard-earned time to submit research for free. Swag as it applies to\
    \ bug bounty programs should be something unique that cannot be bought from the\
    \ enterprise apparel shop with money – think “feat of strength” or “unique.”\n\
    \nThere are many instances in which swag can be used as a way to bolster program\
    \ strength, or to encourage security researchers to participate. Some of the more\
    \ commonly used methods are:\n\n1.  Researcher finds an exceedingly critical bug.\n\
    \n2.  Researchers who frequently participate in or have contributed a lot of research\
    \ to a program.\n\n3.  As an alternate payment for vulnerabilities that are rated\
    \ as “low.”\n\n4.  As an alternate payment for vulnerabilities that are rated\
    \ as “informational” but provide important perspectives that may not have been\
    \ known otherwise.\n\n5.  Used as an incentive to hack during a certain timeframe\
    \ or for a specific vulnerability type (“Find a way to buy items from our store\
    \ for free and we will reward researchers with payment + special swag”).\n\nAt\
    \ times, swag is avoided because enterprises worry about budgetary restrictions.\
    \ After all, many program managers may not want to have to buy 50 or more t-shirts\
    \ or hoodies as a minimum print requirement. Therefore, a program manager should\
    \ consider a print-on-demand service. A quick search will bring up many options\
    \ for print on demand. It’s a service that boasts flexibility to be able to fully\
    \ customize products with a design provided by the user, and there’s typically\
    \ no minimum order fulfillment requirements. Creativity integrated in a modest\
    \ way with bug bounty programs can help the program stand out. Security researchers\
    \ will likely post about the uniqueness and creativity of the program online (plus\
    \ it’s free marketing).\n\nThe one disclaimer with swag is to minimize using it\
    \ in instances where the program being managed is in the private stage, or has\
    \ no intentions of being in the public space. Security researchers are relentless\
    \ in their desires. They may hack the company solely for obtaining a piece of\
    \ apparel or an item, and this could be problematic if the program is private,\
    \ causing resentment. As ridiculous as that sounds, considering all of the possibilities\
    \ of a researcher’s mindset contributes directly to the success of a program.\
    \ Ideally, if a program manager runs a private program and wants to give out swag,\
    \ kindly instruct the researcher not to post pictures of the swag on social media.\
    \ (But please consider if the researcher decides to ignore the request to perform\
    \ automated scans anyway, as this may occur.)\n\n# 5   \n\nUnderstanding Safe\
    \ Harbor and Service Level Agreements\n\n## 5.1 What Is “Safe Harbor”?\n\nSafe\
    \ harbor is the means of a bug bounty program providing affirmation to a researcher\
    \ whom they will not seek legal action against the researcher if the researcher\
    \ is acting in good faith within the constraints of the program scope and rules.\n\
    \n### 5.1.1 The Reality of Safe Harbor\n\nProgram managers may feel a bit out\
    \ of place while writing a safe harbor agreement. Safe harbors contain legal jargon\
    \ and can seem intimidating, especially when it’s the program’s responsibility\
    \ to at least work up a simple safe harbor clause. It’s important to note that\
    \ this isn’t always the case. Most modern-day bug bounty platforms allow a program\
    \ manager to use a templated safe harbor agreement, and in all actuality that’s\
    \ all a safe harbor is: a templated nonaction clause.\n\n### 5.1.2 Fear and Reluctance\n\
    \nMost security researchers are willing to poke around an enterprise’s assets,\
    \ regardless of whether the asset is in scope or not (or if they even have a program).\
    \ Nonetheless, that cannot be said of every researcher. Security researchers have\
    \ different flavors of hacking, and for some that means acting only in the most\
    \ legitimate sense of ethics. Program managers need to heed the safe harbor recommendation.\
    \ Not every bug bounty program has a full safe harbor plan, and in many cases\
    \ there isn’t one at all."
  fmt: '

    在上述场景中，安全研究人员采取的行动可能被视为超出范围或低报酬行为，但他们将其完全升级为关键漏洞。作为项目经理，必须决定如何支付研究人员报酬——如果有的话。然而，情况已演变成一种进退维谷的局面。项目方应该支付研究人员报酬吗？


    本章前面提到，关键研究是有价值的。然而，该行为源于一个特定场景，从多个角度（社会工程学、近乎自助型 XSS）来看可能被视为超出范围。当出现想要支付研究人员报酬但可能不想支付全额的情况时，奖励范围就能发挥作用。


    具体数值与范围设定的差异影响巨大（见[表 4.1](#c04.xhtml#c4-tbl-0001)）。在所述场景中，研究人员实施了存储型 XSS 滥用（可能被视为某种程度上超出范围），想要公平补偿研究人员的项目方可能会陷入困境。他们肯定不想支付
    5000 美元，但基于超出范围的工作量和利用所需的复杂度，支付 3000 美元也不太合适。


    [表 4.1](#c04.xhtml#rc4-tbl-0001) 设置漏洞赏金奖励数值与范围。


    | **设置固定奖励数值** |

    | :--- |

    | **Critical** | **High** | **Medium** | **Low** |

    | $5000 | $3000 | $1000 | $200 |


    | **设置奖励范围** |

    | :--- |

    | **Critical** | **High** | **Medium** | **Low** |

    | $3500–$5000 | $1500–$3000 | $400–$1000 | $50–$200 |


    奖励范围更合理。项目方知道不想支付 3500 美元到 5000 美元之间的金额，而对于该特定场景，3000 美元无疑略高。幸运的是，范围在 1500 美元到
    3000 美元之间变化。项目方最终决定支付研究人员 1500 美元。奖励范围为企业在更复杂的漏洞提交事件发生时提供了缓冲空间。项目方无需为超出范围的事件支付高达
    3000 美元的费用，而是可以选择支付 1500 美元——既奖励了研究人员的努力（不打折扣研究价值），又通过给予遵守范围的研究人员获得 3000 美元的潜力，维持了对他们的正向激励。


    ### 4.15.2 奖金支付


    核心问题：“何时应使用奖金支付？”


    奖金支付应用于存在特殊情况的实例。例如，如果研究人员发现重复漏洞，但撰写了高度详尽的报告，详细描述漏洞并提供新证据，可考虑奖金支付。奖金支付无需过高或频繁使用，但可以作为向优秀研究人员致谢的一种方式。


    奖金支付的另一用例是：当利用方式绕过正常的关键性判定标准，而漏洞赏金项目希望保持公平时。设想一个项目，其最高奖励（Critical）设定为 4500 美元。如果研究人员能从
    Web 应用跳转到后端，再从后端服务器跳转到域控制器并获取敏感信息，4500 美元算公平奖励吗？奖金支付可以帮助扩大企业奖励能力，而无需项目经理设定极大的奖励范围。对于授予研究人员奖金支付，没有固定答案。请运用最佳判断力，并愿意奖励研究人员在漏洞利用中展现的创造性。


    ### 4.15.3 非货币奖励


    支付流程中常被忽视的一个方面是“周边商品”。许多项目可通过将周边商品作为激励措施而受益。许多安全研究人员喜欢黑客技术是因为有趣，这不足为奇。事实上，大多数
    CVE（通用漏洞披露）都是安全研究人员投入辛苦时间免费提交研究的结果。漏洞赏金项目中的周边商品应是独特的、无法用金钱在企业服装店购买的东西——想想“力量壮举”或“独一无二”。


    周边商品可用于增强项目实力或鼓励安全研究人员参与的实例有很多。较常用的方法包括：


    1.  研究人员发现极其关键的漏洞。

    2.  经常参与或向项目贡献大量研究的研究人员。

    3.  作为评级为“低危”漏洞的替代支付方式。

    4.  作为评级为“信息类”但提供原本未知重要视角漏洞的替代支付方式。

    5.  作为在特定时间范围内或针对特定漏洞类型进行黑客测试的激励（“找到从我们商店免费购买商品的方法，我们将奖励研究人员报酬 + 特别周边商品”）。


    有时会避免使用周边商品，因为企业担心预算限制。毕竟，许多项目经理可能不想购买 50 件或更多 T 恤或连帽衫作为最低印刷量要求。因此，项目经理应考虑按需印刷服务。快速搜索会显示许多按需印刷选项。这是一种提供灵活性的服务，能完全根据用户提供的设计定制产品，且通常无最低订单履行要求。以适度方式将创意融入漏洞赏金项目，有助于项目脱颖而出。安全研究人员可能会在网上发布项目的独特性和创意（这还是免费营销）。


    关于周边商品的一个免责声明：尽量避免在所管理项目处于私有阶段、或无意进入公共领域时使用。安全研究人员的欲望是持续不断的。他们可能仅为获取一件服装或物品而攻击公司，若项目是私有的，这可能引发怨恨。听起来虽荒谬，但考虑研究人员心态的所有可能性，直接关系到项目成败。理想情况下，如果项目经理运营私有项目并想发放周边商品，请礼貌告知研究人员勿在社交媒体发布周边商品图片。（但也请考虑：如果研究人员决定无视请求并执行自动化扫描，这种情况也可能发生。）


    # 5 理解安全港与服务级别协议


    ## 5.1 什么是“安全港”？


    安全港是漏洞赏金项目向研究人员提供的一种保证：如果研究人员在项目范围和规则约束内善意行事，项目方不会对其采取法律行动。


    ### 5.1.1 安全港的现实


    项目经理在编写安全港协议时可能感到无从下手。安全港包含法律术语，显得令人生畏，尤其是项目方至少有责任起草一个简单的安全港条款。重要的是要注意，情况并非总是如此。大多数现代漏洞赏金平台允许项目经理使用模板化的安全港协议，实际上安全港就是一个模板化的不行动条款。


    ### 5.1.2 恐惧与犹豫


    大多数安全研究人员愿意探测企业资产，无论资产是否在范围内（甚至无论是否有项目）。但并非所有研究人员皆如此。安全研究人员有不同的黑客风格，对某些人而言，这意味着仅以最合乎道德的合法意义行事。项目经理需重视安全港建议。并非每个漏洞赏金项目都有完整的安全港计划，许多情况下甚至完全没有。

