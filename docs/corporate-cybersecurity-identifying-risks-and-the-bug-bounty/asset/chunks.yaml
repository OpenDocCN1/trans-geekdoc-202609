- raw: 'After the remediation advice option is the ability to enable retesting. To
    be honest, the option is up to the discretion of the program manager. When engineers
    gain more experience, it’s unlikely that they will need assistance with retesting.
    Nonetheless, it could be a useful option for new program managers. However, it
    should not be relied upon. One of the best ways to learn the ins and outs of a
    program is to be on top of testing the vulnerabilities submitted by the researcher.
    If the program manager constantly tests the vulnerabilities, it’s unlikely that
    they will need to pay researchers for retesting ([Figure 6.39](#c06.xhtml#c6-fig-0039)).


    ![Figure 6.39 Retesting option.](images/c06f039.png)


    [**Figure 6.39**](#c06.xhtml#rc6-fig-0039) Retesting option.


    Last is the “Markdown Embedded Attachments” option ([Figure 6.40](#c06.xhtml#c6-fig-0040)).
    If this option is enabled, it will require the application to utilize authentication
    to view embedded images. Leaving this on is important if a program manager values
    the security of their enterprise.


    ![Figure 6.40 Markdown embedded attachments option.](images/c06f040.png)


    [**Figure 6.40**](#c06.xhtml#rc6-fig-0040) Markdown embedded attachments option.


    ### 6.2.4 Profile Settings


    The final part of the Bugcrowd platform (loosely stated, as there’s much to learn)
    is the “Profile and Enterprise” sidebar which also includes some payment and good
    housekeeping functionality ([Figure 6.41](#c06.xhtml#c6-fig-0041)). Among the
    settings is the ability to refine account security, utilize API credentials, and
    manage the program’s accounting capabilities. Program managers should immediately
    tune their profile settings to adequately secure their program login. Maintaining
    best security practice for the bug bounty program login itself is arguably just
    as important as resolving the vulnerabilities. If a threat actor were to get access
    to the bug bounty program login, they would be able to see all of the pre-existing
    bugs. Therefore, securing any associated accounts registered to the program is
    not to be taken lightly.


    ![Figure 6.41 Profile and enterprise sidebar.](images/c06f041.png)


    [**Figure 6.41**](#c06.xhtml#rc6-fig-0041) Profile and enterprise sidebar.


    The first aspect, “Profile”, includes the settings that are under the email address
    of the user that is logged into the program. Here, the program manager has the
    ability to modify profile and account settings, security settings, notification
    settings, and generate API credentials that can interact with Bugcrowd’s API ([Figure
    6.42](#c06.xhtml#c6-fig-0042)).


    ![Figure 6.42 Profile option.](images/c06f042.png)


    [**Figure 6.42**](#c06.xhtml#rc6-fig-0042) Profile option.


    #### 6.2.4.1 The Profile and Account


    This tab is the default view, and to be frank there’s not much that needs to be
    explained about this tab. Program managers can expect all of the basic functionality
    such as modifying profile settings, such as name and display name, and changing
    their passwords or uploading profile pictures.


    #### 6.2.4.2 Security


    Modifying the profile security settings is the first aspect of profile management
    that a program manager should do. The “Security” tab allows for a review of individual
    sessions, or in other words the ability to see where the account is logged in
    ([Figure 6.43](#c06.xhtml#c6-fig-0043)).


    ![Figure 6.43 Security option.](images/c06f043.png)


    [**Figure 6.43**](#c06.xhtml#rc6-fig-0043) Security option.


    The next tab is “Events,” which can be used as a method of additional telemetry
    into sessions which could allude to suspicious activity ([Figure 6.44](#c06.xhtml#c6-fig-0044)).


    ![Figure 6.44 Events option.](images/c06f044.png)


    [**Figure 6.44**](#c06.xhtml#rc6-fig-0044) Events option.


    Last, but not least, two-factor authentication is the actual security configuration
    setting that can be utilized ([Figure 6.45](#c06.xhtml#c6-fig-0045)). Setting
    up two-factor authentication is fairly simple. A program manager will install
    a two-factor authentication app, such as Google Authenticator, on their mobile
    device and scan the corresponding QR code or manually enter the code into the
    app. The final part to enable is to type in a generated six-digit OTP code and
    click on the “Enable 2FA button.” While using two-factor authentication can seem
    pesky, it’s important to do so to protect enterprise bug reports, which, if exposed,
    could lead to compromised assets.


    ![Figure 6.45 Two-factor authentication option.](images/c06f045.png)


    [**Figure 6.45**](#c06.xhtml#rc6-fig-0045) Two-factor authentication option.


    #### 6.2.4.3 Notification Settings


    A program manager has full transparency and control over the notifications that
    they will receive from the bug bounty program. Tuning the notifications panel
    should be an important priority to program managers. Otherwise, “alert fatigue”
    may occur, or in other words an overwhelming feeling of having too much to look
    at ([Figure 6.46](#c06.xhtml#c6-fig-0046)). Preventing alert fatigue through managing
    notifications is an aspect of engineering that is frequently overlooked. Imagine
    a home alarm system that also has cameras and alerts based on a ruleset. If the
    homeowner gets an alert twenty times a day, it may feel burdensome and could result
    in their ignoring an actual event that needs to be reviewed. The same considerations
    go for alert management.


    ![Figure 6.46 Notifications settings option.](images/c06f046.png)


    [**Figure 6.46**](#c06.xhtml#rc6-fig-0046) Notifications settings option.


    As can be seen in [Figure 6.46](#c06.xhtml#c6-fig-0046), there’s quite a bit to
    unpack, but it’s actually less than one would imagine. For example, the email
    notification options are straightforward, allowing a program manager to receive
    emails during activity on subscribed submissions, when team members @mention them,
    or when a submission is assigned to their program management account username.
    Leaving the “Activity on subscribed submissions” turned off is up to the preference
    of the program manager. If the company isn’t exceedingly large, or an engineer’s
    near-full-time role is to manage a bug bounty program, having all of the notifications
    turned on is likely the best possible decision. As an in-between consideration,
    “Activity on subscribed submissions” can be set to “on” in conjunction with the
    “Subscribe me when a submission reaches a given state” to “Triaged.” Enabling
    the in-between consideration as described will allow program managers to be alerted
    in the instance of receiving important updates on a ticket that is triaged. However,
    please note that at times there may be overbearing security researchers, so experimenting
    with the notifications and tuning until it’s right will be a program manager’s
    best bet. Not every program manager has the same preferences. Advice for notifications
    should be taken in one’s stride.


    #### 6.2.4.4 API Credentials


    Program managers may want to develop workflows that utilize API calls through
    scripting, or various external tooling. Bugcrowd allows this type of flexibility
    to occur as engineers, both security and software alike, may want to utilize this
    feature. Generating an API key is simple. To generate a key, the program manager
    just has to type the name of the application in the “Application name” field and
    click on the “Create credentials” button. The credentials will then be generated
    and will not be accessible after navigating away from the page ([Figure 6.47](#c06.xhtml#c6-fig-0047)).


    ![Figure 6.47 API credentials option.](images/c06f047.png)


    [**Figure 6.47**](#c06.xhtml#rc6-fig-0047) API credentials option.


    ### 6.2.5 Enterprise “Profile” Settings


    #### 6.2.5.1 Management and Configuration'
  fmt: '

    After the remediation advice option is the ability to enable retesting. To be
    honest, the option is up to the discretion of the program manager. When engineers
    gain more experience, it’s unlikely that they will need assistance with retesting.
    Nonetheless, it could be a useful option for new program managers. However, it
    should not be relied upon. One of the best ways to learn the ins and outs of a
    program is to be on top of testing the vulnerabilities submitted by the researcher.
    If the program manager constantly tests the vulnerabilities, it’s unlikely that
    they will need to pay researchers for retesting ([Figure 6.39](#c06.xhtml#c6-fig-0039)).


    ![Figure 6.39 Retesting option.](images/c06f039.png)


    [**Figure 6.39**](#c06.xhtml#rc6-fig-0039) Retesting option.


    Last is the “Markdown Embedded Attachments” option ([Figure 6.40](#c06.xhtml#c6-fig-0040)).
    If this option is enabled, it will require the application to utilize authentication
    to view embedded images. Leaving this on is important if a program manager values
    the security of their enterprise.


    ![Figure 6.40 Markdown embedded attachments option.](images/c06f040.png)


    [**Figure 6.40**](#c06.xhtml#rc6-fig-0040) Markdown embedded attachments option.


    ### 6.2.4 Profile Settings


    The final part of the Bugcrowd platform (loosely stated, as there’s much to learn)
    is the “Profile and Enterprise” sidebar which also includes some payment and good
    housekeeping functionality ([Figure 6.41](#c06.xhtml#c6-fig-0041)). Among the
    settings is the ability to refine account security, utilize API credentials, and
    manage the program’s accounting capabilities. Program managers should immediately
    tune their profile settings to adequately secure their program login. Maintaining
    best security practice for the bug bounty program login itself is arguably just
    as important as resolving the vulnerabilities. If a threat actor were to get access
    to the bug bounty program login, they would be able to see all of the pre-existing
    bugs. Therefore, securing any associated accounts registered to the program is
    not to be taken lightly.


    ![Figure 6.41 Profile and enterprise sidebar.](images/c06f041.png)


    [**Figure 6.41**](#c06.xhtml#rc6-fig-0041) Profile and enterprise sidebar.


    The first aspect, “Profile”, includes the settings that are under the email address
    of the user that is logged into the program. Here, the program manager has the
    ability to modify profile and account settings, security settings, notification
    settings, and generate API credentials that can interact with Bugcrowd’s API ([Figure
    6.42](#c06.xhtml#c6-fig-0042)).


    ![Figure 6.42 Profile option.](images/c06f042.png)


    [**Figure 6.42**](#c06.xhtml#rc6-fig-0042) Profile option.


    #### 6.2.4.1 The Profile and Account


    This tab is the default view, and to be frank there’s not much that needs to be
    explained about this tab. Program managers can expect all of the basic functionality
    such as modifying profile settings, such as name and display name, and changing
    their passwords or uploading profile pictures.


    #### 6.2.4.2 Security


    Modifying the profile security settings is the first aspect of profile management
    that a program manager should do. The “Security” tab allows for a review of individual
    sessions, or in other words the ability to see where the account is logged in
    ([Figure 6.43](#c06.xhtml#c6-fig-0043)).


    ![Figure 6.43 Security option.](images/c06f043.png)


    [**Figure 6.43**](#c06.xhtml#rc6-fig-0043) Security option.


    The next tab is “Events,” which can be used as a method of additional telemetry
    into sessions which could allude to suspicious activity ([Figure 6.44](#c06.xhtml#c6-fig-0044)).


    ![Figure 6.44 Events option.](images/c06f044.png)


    [**Figure 6.44**](#c06.xhtml#rc6-fig-0044) Events option.


    Last, but not least, two-factor authentication is the actual security configuration
    setting that can be utilized ([Figure 6.45](#c06.xhtml#c6-fig-0045)). Setting
    up two-factor authentication is fairly simple. A program manager will install
    a two-factor authentication app, such as Google Authenticator, on their mobile
    device and scan the corresponding QR code or manually enter the code into the
    app. The final part to enable is to type in a generated six-digit OTP code and
    click on the “Enable 2FA button.” While using two-factor authentication can seem
    pesky, it’s important to do so to protect enterprise bug reports, which, if exposed,
    could lead to compromised assets.


    ![Figure 6.45 Two-factor authentication option.](images/c06f045.png)


    [**Figure 6.45**](#c06.xhtml#rc6-fig-0045) Two-factor authentication option.


    #### 6.2.4.3 Notification Settings


    A program manager has full transparency and control over the notifications that
    they will receive from the bug bounty program. Tuning the notifications panel
    should be an important priority to program managers. Otherwise, “alert fatigue”
    may occur, or in other words an overwhelming feeling of having too much to look
    at ([Figure 6.46](#c06.xhtml#c6-fig-0046)). Preventing alert fatigue through managing
    notifications is an aspect of engineering that is frequently overlooked. Imagine
    a home alarm system that also has cameras and alerts based on a ruleset. If the
    homeowner gets an alert twenty times a day, it may feel burdensome and could result
    in their ignoring an actual event that needs to be reviewed. The same considerations
    go for alert management.


    ![Figure 6.46 Notifications settings option.](images/c06f046.png)


    [**Figure 6.46**](#c06.xhtml#rc6-fig-0046) Notifications settings option.


    As can be seen in [Figure 6.46](#c06.xhtml#c6-fig-0046), there’s quite a bit to
    unpack, but it’s actually less than one would imagine. For example, the email
    notification options are straightforward, allowing a program manager to receive
    emails during activity on subscribed submissions, when team members @mention them,
    or when a submission is assigned to their program management account username.
    Leaving the “Activity on subscribed submissions” turned off is up to the preference
    of the program manager. If the company isn’t exceedingly large, or an engineer’s
    near-full-time role is to manage a bug bounty program, having all of the notifications
    turned on is likely the best possible decision. As an in-between consideration,
    “Activity on subscribed submissions” can be set to “on” in conjunction with the
    “Subscribe me when a submission reaches a given state” to “Triaged.” Enabling
    the in-between consideration as described will allow program managers to be alerted
    in the instance of receiving important updates on a ticket that is triaged. However,
    please note that at times there may be overbearing security researchers, so experimenting
    with the notifications and tuning until it’s right will be a program manager’s
    best bet. Not every program manager has the same preferences. Advice for notifications
    should be taken in one’s stride.


    #### 6.2.4.4 API Credentials


    Program managers may want to develop workflows that utilize API calls through
    scripting, or various external tooling. Bugcrowd allows this type of flexibility
    to occur as engineers, both security and software alike, may want to utilize this
    feature. Generating an API key is simple. To generate a key, the program manager
    just has to type the name of the application in the “Application name” field and
    click on the “Create credentials” button. The credentials will then be generated
    and will not be accessible after navigating away from the page ([Figure 6.47](#c06.xhtml#c6-fig-0047)).


    ![Figure 6.47 API credentials option.](images/c06f047.png)


    [**Figure 6.47**](#c06.xhtml#rc6-fig-0047) API credentials option.


    ### 6.2.5 Enterprise “Profile” Settings


    #### 6.2.5.1 Management and Configuration

