- raw: "3.  The next portion underneath the description box is a checkbox that asks\
    \ if the target group is in scope ([Figure 6.28](#c06.xhtml#c6-fig-0028)). Clicking\
    \ on the checkbox reveals another checkbox that asks the program manager if the\
    \ asset group “pays monetary rewards.” The checkbox for rewards is a useful component\
    \ of target groups, because program managers can take assets that would normally\
    \ be considered out of scope and offer a limited in-scope option. For example,\
    \ if the enterprise maintains a domain that is highly vulnerable, leaving the\
    \ “pays monetary rewards” option unchecked but adding the assets can allow researchers\
    \ to test and report the vulnerabilities, and the enterprise will not have to\
    \ pay for the asset. The official recommendation would be to eventually put the\
    \ assets in scope when they are considered less vulnerable.\n\n    ![Figure 6.28 Target\
    \ groups.](images/c06f028.png)\n\n    [**Figure 6.28**](#c06.xhtml#rc6-fig-0028) Target\
    \ groups.\n\n    For this current example, the “Network Assets” group is being\
    \ created. Therefore, the example that is going to be shown is the result of enabling\
    \ monetary rewards to walk through the process of creating and modifying rewards.\n\
    \n4.  With the checkbox clicked for the rewards option, an overlay will pop up,\
    \ showing various reward options for the group, such as tiers ranked at high,\
    \ medium, low, and custom ([Figure 6.29](#c06.xhtml#c6-fig-0029)). These brackets\
    \ have price ranges on each, and the custom tier can be used for defining rewards\
    \ per vulnerability criticality classification. Groups are unique in the sense\
    \ that multiple groups can be assigned different tiers, therefore making it worth\
    \ a researcher’s time to hack mobile applications over web applications, etc.\n\
    \n    ![Figure 6.29 Target group rewards.](images/c06f029.png)\n\n    [**Figure\
    \ 6.29**](#c06.xhtml#rc6-fig-0029) Target group rewards.\n\n5.  After the reward\
    \ is selected, a program manager must click on the “Add new target” button. The\
    \ only option that is different with this interface is the ability to pick pre-existing\
    \ targets and add them to the group. Adding each target to a specific group will\
    \ have to be completely individually. Once all of the targets are added, a program\
    \ manager can click on the “Save group” button, which will bring program managers\
    \ to the next web page.\n\n6.  Finally, the groups will be populated on the “Target\
    \ groups” page, with the name, rewards, and all of the details that were assigned\
    \ previously ([Figure 6.30](#c06.xhtml#c6-fig-0030)). Program managers will have\
    \ to utilize the “Add group” option in order to make any additional groups.\n\n\
    \    ![Figure 6.30 Target group listings.](images/c06f030.png)\n\n    [**Figure\
    \ 6.30**](#c06.xhtml#rc6-fig-0030) Target group listings.\n\n#### 6.2.3.3 Integrations\n\
    \nThe integrations tab of the settings option allows program managers to connect\
    \ any relevant tools that their enterprise might have for managing reports ([Figure\
    \ 6.31](#c06.xhtml#c6-fig-0031)). For example, various configurations such as\
    \ Jira, Slack, ServiceNow, etc., exist – allowing for an effective reporting and\
    \ triage workflow. Program managers can opt to use none of these tools, or many\
    \ of these tools. A standard integration flow may be a ticketing system tool such\
    \ as Jira, Slack notifications to bring a program manager’s attention to the submission,\
    \ or an embedded submission form on the website that gives the enterprise the\
    \ ability to receive submissions from anyone if they don’t exclusively know about\
    \ Bugcrowd’s services.\n\n![Figure 6.31 Integrating various tools to help with\
    \ report management.](images/c06f031.png)\n\n[**Figure 6.31**](#c06.xhtml#rc6-fig-0031) Integrating\
    \ various tools to help with report management.\n\nRather than explain each integration,\
    \ program managers are encouraged to review the Bugcrowd documentation. The integration\
    \ process will vary based on the type of tool Bugcrowd is integrating with.\n\n\
    #### 6.2.3.4 Announcements\n\nThe “Announcements” tab is used for notifying researchers\
    \ of major changes within the program ([Figure 6.32](#c06.xhtml#c6-fig-0032)).\
    \ Examples of an adequate usage of announcements would be: Increasing Rewards,\
    \ Expanding Scope, Asking researchers to test a specific asset, etc.\n\n![Figure\
