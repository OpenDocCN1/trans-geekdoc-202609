    \ is one of the most talented application security experts I know, and his humility\
    \ keeps him out of the information security limelight. Through me, your excellent\
    \ advice and mentoring lives. If it weren’t for you, I wouldn’t know even a quarter\
    \ of what I do about bug bounty programs. Thank you for being a positive role\
    \ model in my life. It’s exceedingly difficult to find people who are not only\
