    '
  trans: '

    另一个众包选项是 HackerOne。使用 HackerOne 的体验会与 Bugcrowd 不同，因为登录后即刻呈现的内容更多。具体而言，Bugcrowd
    的登录页面为项目经理提供了一个简单的概览，而 HackerOne 则将安全研究人员和项目经理的视图合并在一起。研究视图与项目视图的合并可能会让人感到望而生畏。新任项目经理可能难以理清这些选项。即使对于经验丰富的项目经理，尝试管理项目也可能感觉笨重。然而，本意是描述
    HackerOne 中可用的大部分功能。此外，HackerOne 拥有更多的配置选项。不过，项目经理的专业水平将决定哪个众源平台最适合他们。


    遗憾的是，HackerOne 没有一个随时可供任何人使用的、易于上手的演示项目。为缓解这一问题，将利用一个已建立的项目来评估其设置和配置。重点关注的主要标签页是项目仪表盘、项目设置和收件箱标签页；HackerOne
    中的其他内容通常专门与研究人员相关。此外，还将评估个人资料的一些配置设置。从头到尾了解项目设置的能力，最终将使项目经理在为使用不同众包平台的公司工作时，能更轻松地完成过渡。


    ## 6.3.1 项目设置


    首先关注的是“项目设置”标签页（**图 6.54**）。项目设置标签页有两个子标签页：常规和项目。作为基准，常规标签页包含信息、产品添加、身份验证、已验证域、凭据管理、用户管理、群组管理和审计日志。此外，还有一个专门用于账单的小节。项目标签页有四个子标题，包含广泛的选项：自定义、黑客管理、奖励和自动化。


    ![图 6.54 项目设置选项。](img/c06f054.png)


    **图 6.54** 项目设置选项。


    ### 6.3.1.1 常规


    常规标签页可被视为项目经理想要配置项目所有杂项选项时使用的标签页（**图 6.55**）。常规标签页的使用至关重要，因为账单信息包含在常规标签页下的“账单”子标题中。


    ![图 6.55 杂项项目选项。](img/c06f055.png)


    **图 6.55** 杂项项目选项。


    ### 6.3.1.2 信息


    信息标签页包含漏洞赏金项目的安全页面信息（**图 6.56**）。在此标签页中，项目经理可以为项目命名、分配项目句柄、定义项目的主网站，并在“关于我”标签页下撰写标语。此外，项目经理可以提供相关的
    Twitter 账户用户名或更新项目的徽标。


    ![图 6.56 安全页面功能。](img/c06f056.png)


    **图 6.56** 安全页面功能。


    ### 6.3.1.3 产品版本


    HackerOne 有两个不同的产品版本，第一个版本是“赏金专业版”，另一个选项是“赏金企业版”（**图 6.57**）。项目经理可以在两者之间选择，但应咨询管理层和客户经理以确定主要差异和价格考量。给定的价格点可能是一个通用的决定因素，但专业版是基础版本。此标签页允许项目经理查看产品添加统计数据，并联系支持部门以获取不同的产品。


    ![图 6.57 HackerOne 产品版本。](img/c06f057.png)


    **图 6.57** HackerOne 产品版本。


    ### 6.3.1.4 身份验证


    与 Bugcrowd 类似，HackerOne 也提供启用 SSO 的选项。项目经理可以点击“启用 SAML”按钮。不过，这在截图示例中目前未显示（**图
    6.58**）。项目经理需要通过 IdP 管理团队获取正确的设置来配置 SSO。此外，HackerOne 与 Bugcrowd 不同之处在于，HackerOne
    项目经理可以联系他们的客户经理以启用 IP 允许列表功能。IP 允许列表功能将确保只有特定的 IP 地址可以访问项目管理。


    ![图 6.58 使用 SAML 进行单点登录。](img/c06f058.png)


    **图 6.58** 使用 SAML 进行单点登录。


    ### 6.3.1.5 已验证域


    “验证域”标签页允许项目经理添加域，这是启用 SSO 的要求。Bugcrowd 的验证与 HackerOne 的验证之间的一个区别在于，除了 DNS TXT
    记录外，HackerOne 还允许 HTML 元标签验证和 Web 文件验证（**图 6.59**）。


    ![图 6.59 域验证示例。](img/c06f059.png)


    **图 6.59** 域验证示例。


    ### 6.3.1.6 凭据管理


    “凭据管理”标签页允许项目经理向黑客提供 CSV 文件，以便对应用程序进行身份验证（**图 6.60**）。在某些情况下，拥有经过身份验证的账户对于测试特定漏洞很有用。


    ![图 6.60 凭据管理标签页。](img/c06f060.png)


    **图 6.60** 凭据管理标签页。


    ### 6.3.1.7 群组管理


    尽管用户管理在群组管理之前，但设置群组是在设置用户之前必不可少的步骤，以确保项目经理遵循基于角色的访问控制的最佳安全实践，换句话说就是管好他们的项目。项目经理应尽力为“需知”原则和关键角色创建适当的角色群组。作为一个通用的经验法则，应该有一个拥有完全权限的角色、一个拥有大部分权限的角色和一个权限极其有限的角色（**图
    6.61**）。维护完整的角色套件将允许项目经理快速分配权限，而不会影响项目。


    ![图 6.61 群组管理选项。](img/c06f061.png)


    **图 6.61** 群组管理选项。


    要添加角色群组，项目经理应点击群组管理面板右上角的“添加群组”按钮。点击按钮后，将出现添加群组页面，项目经理可以为群组命名并分配适当的权限。默认权限级别允许用户查看报告和发布内部评论。除了默认权限外，项目经理还可以分配报告角色、项目角色、奖励角色或管理员角色。作为一个有限角色的好例子，如果群组管理标签页中尚未设置，项目经理应为群组命名并保留默认权限。可以创建另一个群组，允许响应漏洞但不进行项目管理。为此，项目经理可以分配报告角色并结合奖励角色。最后，项目经理可以勾选所有复选框，以授予其他人对项目的完全管理员权限（**图
    6.62**）。


    ![图 6.62 群组管理选项。](img/c06f062.png)


    **图 6.62** 群组管理选项。


    ### 6.3.1.8 用户管理

