    Even though triage is responsible for the initial intake and validation of specific
    reports, it’s not their job to prioritize the vulnerabilities internally. A common
    misconception within program management is the taxonomy of triaged items. For
    the most part, vulnerabilities are accurately rated within the reporting processes.
    Nonetheless, a program manager should be careful not to use vulnerability taxonomy
    as something set in stone.


    For example, please go to a search engine and look up the following CVE to evaluate:
    `CVE-2020-14179`. As it stands, this is rated as medium on the common vulnerability
    scoring system (CVSS) version 3.x scale. Obviously, as is known up to this point
    the criticality will determine the payout. The question is, what is the comparison
    of the CVE in the program versus the CVE in reality? Realistically, the vulnerability
    may be rated medium, but by reading the current description, it can be seen that
    it’s an information disclosure vulnerability and may be on the lower end of the
    scale. An attacker can essentially view field names and custom service level agreement
    (SLA) names on Jira tickets. The vulnerability may not be too serious in retrospect.
    However, the CVSS score is the typical scoring mechanism for bug bounty programs.
    Therefore, a medium would likely have to be paid (or at least recommended). The
    importance of establishing bounty pay ranges instead of set values shines in this
    regard because the Jira vulnerability can now be paid at the lower end of the
    medium scale in severity. Paying on the lower end of the scale shouldn’t be commonplace
    within a program. Program managers must always remember to stick to payout guidelines,
    and be fair to the researcher, especially if the vulnerability is a legitimate
    issue. Programs should not look for ways to pay a researcher less, but instead
    evaluate impact to see if a researcher should be getting paid more.


    Now, compare the Jira vulnerability to a standard cross-site scripting (XSS) vulnerability.
    Regardless of what asset the vulnerability affects, an XSS vulnerability will
    always have more exploitation use cases than `CVE-2020-14179`, as long as it’s
    not considered self-XSS. An information disclosure bug isn’t as serious as being
    able to phish users and steal credentials, in nearly every circumstance (unless
    the information disclosure is sensitive, such as passwords, PII, etc.).


    Take a look at three vulnerabilities and determine the order in which these should
    be resolved. Rate them on a scale between 1 and 3, where 1 is the highest priority
    and three is the lowest:


    ## 7.2.2 Vulnerability Examples


    ### 7.2.2.1 Reflected XSS on a login portal


    #### Report and Triage


    A researcher found a XSS vulnerability on the login portal by abusing a native
    parameter. They are able to pop-up alerts, and the proof used the classic `<script>alert(1)</script>`
    technique. The alert is triaged by managed services as a medium rated vulnerability.


    #### Validation


    The program is able to validate the vulnerability as a legitimate XSS vulnerability.


    ### 7.2.2.2 Open redirect vulnerability


    #### Report and Triage


    The same researcher finds a vulnerability that allows them to redirect users to
    any website, with no restrictions. Additionally, the researcher notes that they
    are able to check if specific ports are open and are closed on the backend with
    the URL `http://127.0.0.1:port` appended to the path. They reported it as an open
    redirection vulnerability because they are having a difficult time telling if
    the ports are actually opened or closed – it’s just the researcher’s guess. The
    alert is triaged by managed services as a medium rated vulnerability, as they
    could not validate any sort of service-side request forgery vulnerability.


    #### Validation


    The program is able to validate the open redirection vulnerability. Additionally,
    they’ve noted that the ability to enumerate internal ports and even see contents
    of specific files is possible through testing.


    ### 7.2.2.3 Leaked internal Structured Query Language (SQL) server credentials


    #### Report and Triage


    Lastly, a vulnerability was found in which the enterprise’s public GitHub repository
    appears to be leaking credentials for a My Structured Query Language (MYSQL) server
    over port 3306. Triage is unable to validate the authenticity, as the credentials
    appear to be accessible from the internal subnet only.


    #### Validation


    The program validates the existence of the credentials, and has determined that
    the exposed internal credentials are legitimate. However, the program, in keeping
    with best practice, determines that this vulnerability is rated at a medium rated
    vulnerability.


    ## 7.3 Answers


    In the three given scenarios, the results are ranked from least to most pertinent,
    along with an explanation of why.


    ### 7.3.1 Vulnerability Rating-test Summary


    The truth is, the perception of how vulnerabilities are handled has some room
    for flexibility, and it’s impossible to set strict guidelines. What triage considers
    critical may only be a medium for the enterprise. If the leaked internal SQL server
    credentials example were for a critical asset such as a database that held credit
    cards, or PII, would the priority change? Understanding that the taxonomy and
    priority of vulnerability remediation may change/have to change is an essential
    part of program management.


    #### 7.3.1.1 Reflected XSS in a login portal


    The reflected XSS vulnerability ranks below the open redirect that escalates into
    an SSRF. Realistically, the ease of exploitation and possibility of phishing credentials
    can be highly disruptive to the business and causes a lot of strife and impact
    in the enterprise’s security process. An XSS, in most cases, ends up as a true
    medium unless the researcher manages to escalate the vulnerability to an instance
    of account takeover.


    #### 7.3.1.2 Open redirect vulnerability


    While this vulnerability starts out as a low-impact, redirect based-scenario,
    the researcher was able to turn it into a server-side request forgery vulnerability
    by attempting to enumerate ports. Additionally, the program manager was able to
    read other files, turning a low-impact vulnerability into a high-impact vulnerability.
    In this instance, it would be recommended to escalate the researcher’s vulnerability
    from a low to a high since they identified the possibility of the SSRF attack.
    However, this would not be considered critical, because no further escalation
    had occurred from the researcher’s part. Resolving this issue first would be the
    best recommendation to prevent critical exploitation or data leakage.


    #### 7.3.1.3 Leaked internal SQL server credentials


    While at first glance the internal SQL server exposure may appear to be the most
    critical vulnerability, if anything, it’s either equally as vulnerable or less
    than the instance of the reflected XSS. An enterprise shouldn’t sleep on a vulnerability
    that’s considered internally reproducible only, though. In the instance legitimate
    internal credentials are exposed, even if the researcher cannot access them, tell
    the affected team to rotate the credentials immediately. A common misconception
    about internal credentials is that it’s not problematic because a security researcher
    cannot get onto the network; this couldn’t be further from the truth.


    ### 7.3.2 Complexity vs Rating


    No one can thoroughly define how the enterprise should manage different vulnerabilities.
    Generally, there’s a baseline. But as we’ve seen, a baseline is just that: an
    outline of a recommended approach. Alternatively, a good way to address various
    issues is to compare all of the factors, starting with the complexity of the vulnerability
    and the rating.


    *   **Complexity**: how difficult replicating a vulnerability is, with respect
    to how difficult the vulnerability would be to replicate by an unskilled threat
    actor. Imagine that the rating scale ranges from very easy, to easy, medium, hard,
    extremely hard.

