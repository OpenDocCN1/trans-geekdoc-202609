    on. In order to determine readiness, the program should be actively receiving
    bugs for at least a year and have had some major vulnerabilities reported. It
    wouldn’t be recommended to start this testing until the program is major enough
    to timely resolve any reported bugs. If a junior program uses a penetration testing
    service as described, it could end up being a waste of money – especially if the
    software development lifecycle isn’t using the best possible application security
    processes. As described previously, if the objective is to establish a thorough
    and respectable program, it wouldn’t make much sense to throw an enterprise into
    an arena that the program isn’t currently prepared for.


    # Part 3: Program Setup


    # 4: Defining Program Scope and Bounties


    ## 4.1 What Is a Bounty?


    Simply put, a bounty is a reward paid to a security researcher. Bounty programs
    establish a way for a researcher to disclose bugs of impact to organizations.
    The enterprise has the ability to define various reward tiers to encourage participation.


    Bounties should never be viewed as paying for exploitation, but for adequate and
    detailed vulnerability research.


    ## 4.2 Understanding Scope


    Scope can be a confusing topic for some engineers. Historically, scope has been
    a means of defining what researchers are allowed to target. Scope can be tricky
    in the sense that anything not defined as “out of scope” can be fair game to a
    researcher. When engineers imagine “fair game,” they may envision assets, yet,
    realistically it can also pertain to methodology used by security researchers.
    Imagine this: a researcher finds a program, and there’s nothing in the out-of-scope
    definitions that state brute force attacks (i.e. attempts to submit many passwords
    or passphrases in the hope of eventually guessing the correct combination) as
    being out of scope. A researcher now has unlimited time to run through enumerated
    usernames and test for account takeover. As a secondary consideration, they may
    negatively impact the application. The researcher spends a couple of days attempting
    “credential stuffing” against an application login portal and now gains unauthenticated
    access to an account. The enterprise must now pay this attacker for a high or
    critical payout depending on the program definitions. It’s qualified as a full
    account takeover.


    A scenario such as the one provided above could have been completely avoided if
    the engineer setting up the program understood the applications, attack methodologies,
    and so on.


    ## 4.3 How to Create Scope


    Many engineers approach scope with the idea of limiting the attack surface for
    a researcher. Limiting the attack surface for a researcher is absurd, and the
    complete reverse methodology that should be used for increasing the security of
    enterprise application development. Instead, a better approach is to start with
    a smaller amount of assets and work up to a larger attack surface when reports
    start to dwindle.


    For example, compare two models of scope and notice subtle changes to the web
    testing portion of the scope.


    ### 4.3.1 Models


    **Model A (1st Month of Program Setup):**


    *In-Scope*


    Web:


    1.  `https://example.com/login`

    2.  `https://example.com/policies`

    3.  `https://example.com/legal`

    4.  `https://dev.example.com/about-us`

    5.  `https://dev.example.com/login`

    6.  `https://dev.example.com/profile`

    7.  `https://dev.example.com/customer/support-services`


    **Model B (6th Month of Program Setup):**


    *In-Scope*


    Web:


    1.  `https://example.com*`

    2.  `https://dev.example.com*`

    3.  `https://staging.example.com/join`

    4.  `https://staging.example.com/about-us`

    5.  `https://testing.example.com`


    While comparing both models A and B, it’s easy to see that staging and testing
    were added to the web scope (subdomains), but why are fewer assets listed overall?
    Both the `example.com` and the `dev.example.com` subdomains now have wildcards.
    It’s standard to eventually use wildcards where possible.


    ## 4.4 Understanding Wildcards


    Wildcards are fairly simple to understand. They are a means of allowing for a
    wider attacker surface. A wildcard can help a program identify more vulnerabilities,
    and give a security researcher more flexibility to stick to an enterprise’s program
    and get to know it and want to test on the program. One of the biggest complaints
    that researchers will touch on is the lack of wildcards in a program. Some researchers
    will not participate in any programs that don’t use wildcards because they don’t
    have the breadth that a researcher is looking for.


    When thinking about wildcards, there are several methodologies:


    *   Subdomain: `*.example.com`

    *   Domain: `example.com/*`

    *   Specific Domain Path: `example.com/login/*`

    *   Subdomain Path: `dev.example.com/*`


    ### 4.4.1 Subdomain


    Simply, a program that sets a wildcard domain is using the most permissive scenario
    possible. Imagine, for instance, that `example.com` has subdomains such as `mail.example.com`,
    `app.example.com`, `dev.example.com`, etc.; a security researcher can test any
    of these subdomains, on any URL path. An important consideration to be made before
    allowing a wildcard in the subdomain slot of a domain is whether the engineers
    who are managing the program have done their due diligence and evaluated all of
    the subdomains or not. It would be a poor decision to allow a subdomain wildcard
    if the full attack surface weren’t evaluated.


    Does this example seem unrealistic? It can and has happened. An engineer has to
    ensure that the subdomains in scope are being evaluated just as the main domain
    of the web application is. There are a plethora of attacks that can impact subdomain
    and turn critical if unchecked.


    ### 4.4.2 Domain


    Wildcard use on domains is typically the in-between scope option for bug bounty
    programs. A researcher who tests against a basic domain wildcard can perform research
    on the entire domain, but any identified subdomains would not be in scope unless
    otherwise stated. As explained earlier, it would not be advisable to use a domain
    or subdomain wildcard without knowing all paths or assets that could be tested.


    ### 4.4.3 Specific Domain Path or Specific Subdomain Path


    Unless there’s a wide range of URLs involved, a specific path asset set as in
    scope typically maintains the least permissive testing posture. Programs that
    are just being established can get the feel for bug bounty programs by using this
    model and setting certain domain paths as in scope. The more critical paths, such
    as `/login` or `/checkout`, are a necessity to test against because malicious
    hackers will attempt to exploit any low-hanging fruit that may be exposed on these
    paths.


    ## 4.5 Determining Asset Allocation

