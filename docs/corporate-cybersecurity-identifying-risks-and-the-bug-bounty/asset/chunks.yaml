    企业资产的部署将永远是攻击面的决定性因素；然而，现代应用程序比以往任何时候都更加互联。很容易将“服务器”视为具有广泛攻击面的资产，在许多情况下这确实如此，且攻击向量将始终各不相同。尽管如此，企业不应将漏洞赏金计划的价值视为微不足道且无效的。此外，有缺陷的应用程序逻辑可能导致网络被利用，而企业可能未曾考虑到这一点。例如，SQL（Structured
    Query Language，结构化查询语言）注入可能导致完整的服务器数据库转储或网络上的远程代码执行。服务端请求伪造可能导致敏感信息泄露，进而导致未经授权的服务器访问或向网络的其他部分进行横向移动。应用程序安全是一项庞大的工程，忽视它可能导致企业的全面沦陷。


    ## 1.6 巨大的预算需求


    漏洞赏金计划具有可扩展性。漏洞赏金计划的规模和运营由企业自行决定。此外，如果公司规模不大，假设企业必须支付一大笔钱才能启动计划是不切实际的。随着漏洞赏金众包成为常态，Bugcrowd
    和 HackerOne 等公司愿意与领导层进行范围界定通话，以确定公平的计划管理定价模型。计划管理的价格远低于识别可能导致数十万甚至数百万美元资产损失或合规违规（如
    GDPR《通用数据保护条例》或《加州隐私法案》）的漏洞的成本。应用程序安全像安全的任何其他子分支一样，是一项投资——而安全通常看不到丰厚的投资回报。信息安全不会为公司赚钱：它保护公司免受资金损失，从而使公司能够获取资金。


    ## 1.7 将其他安全工具作为优先事项


    在建立计划的所有其他潜在顾虑中，安全工具是一个合理的关注点。平衡预算需要与各级领导协调并对整体安全态势进行评估。例如，如果企业没有 Web 应用程序防火墙，或没有像样的端点保护和响应解决方案，建立漏洞赏金计划可能不是一个好主意。必须与安全团队进行协调，但如果所有其他基础工作都已到位，就没有理由不能建立一个基本的漏洞赏金计划。


    ## 1.8 漏洞披露计划与漏洞赏金计划的区别


    即使对于最专业的技术人员，理解漏洞披露计划（VDP）和漏洞赏金计划（BBP）之间的区别也可能令人费解。即便如此，运行漏洞赏金计划的工程师也可能犯错，将漏洞赏金计划称为漏洞披露计划，反之亦然。理解两者的区别对于清晰地传达期望以及教育公众了解日常流程至关重要。


    ### 1.8.1 漏洞披露计划


    漏洞披露计划是企业希望促进漏洞披露但不提供任何付费激励时采用的方法。漏洞披露计划可被视为一种善意型的漏洞管理流程。漏洞披露计划分为托管型和非托管型两种。非托管计划是指企业内部提供的漏洞披露计划，基于善意努力。相比之下，托管漏洞披露计划可能是指计划管理员由漏洞赏金众包平台（如
    Bugcrowd 或 HackerOne）的分流团队协助的计划。作为对研究人员的激励，他们将获得积分作为回报，这是升级并受邀参加私有计划的关键部分，私有计划通常竞争较少，研究人员发现漏洞的机会更大。


    众包平台也允许私有漏洞披露计划，通过奖励积分而非赏金来降低成本。


    ### 1.8.2 漏洞赏金计划


    漏洞赏金计划通常是更成熟的漏洞披露计划，提供奖金而非积分。当计划管理员希望将漏洞披露计划转换为漏洞赏金计划时，过程通常只需启动针对安全研究的经济激励即可。漏洞赏金计划分量更重，能吸引更多专业黑客。例如，一些最优秀的安全研究人员可能永远不会参与漏洞披露计划，因为他们花在评估漏洞赏金计划上的时间很容易转化为现金流。企业的最终目标应始终是渴望达到付费计划参与的阶段。安全研究消耗大量时间，企业应愿意为研究人员花费的时间付费。如果感到困惑，可以这样想：有多少人愿意免费做全职工作，而不是拿薪水？爱好者永远存在，但只有通过经济激励才能获得一些最优秀安全研究人员的参与。


    ## 1.9 计划管理员


    全书中将频繁出现“计划管理员”一词。计划管理员不应被视为协调员工活动的传统管理者。相反，计划管理员是指任何负责企业漏洞赏金计划配置或管理的员工。例如，员工的头衔无关紧要：应用安全工程师或首席信息安全官都可以是计划管理员。唯一的考量是该员工必须对计划拥有监督权并有能力做出更改。毕竟，即使是修复漏洞的员工，也在管理计划的日常工作流。


    ## 1.10 法律层面


    历史上，法律对安全研究人员并不总是友善。即使在今天，黑客行为在非技术人员眼中仍被视为危险或有争议。社会上很大一部分人不认为黑客技术是一门艺术，而是在任何情况下都将其视为犯罪行为。当大多数人将黑客行为视为压倒性的犯罪活动时，合法研究人员经常发现自己处于敌对环境中，并面临受到惩罚的威胁，这并不令人意外。有许多记录在案的安全研究人员受到法律诉讼威胁的案例。在互联网上快速搜索“security
    researcher threatened”（安全研究人员受威胁）一词，会出现大量新闻。


    重新定义安全研究的期望始于教育社区——而漏洞赏金计划在帮助社会理解黑客行为可以是合乎道德的方面发挥了巨大作用。漏洞披露计划是一个很好的开始，但最终目标是过渡到允许黑客因其努力获得公平补偿的漏洞赏金计划。尽管如此，不利用漏洞赏金计划进行安全研究可能极其危险，并可能危及进行研究的个人的生计。漏洞赏金计划及其包含的安全港条款有助于保障研究人员的安全。漏洞研究改变了黑客所属类别的格局，并允许相当大的灵活性和免受法律惩罚的保护。


    ## 1.11 重新定义安全研究

