    \ employees cannot partake in such incentives. Normally, after the process of\
    \ validating vulnerabilities and deeming them as reproducible and legitimate,\
    \ first things first: *pay the researcher* if the vulnerability is valid, and\
    \ due diligence has been performed to validate the issue. Obviously, ensure that\
    \ the possibility of accidentally paying for a vulnerability that isn’t valid\
    \ doesn’t exist before paying the researcher, as discussed previously.\n\nOnce\
    \ the researcher is paid, connectors that integrate into most ticketing platforms\
    \ will do the work of generating the report for the program internally. However,\
    \ in some instances, the ticketing integration may not support the inclusion of\
    \ the entire report. For example, as a bare minimum, a program will want to make\
    \ sure of the following.\n\n1.  **The ticket contains fully detailed steps.**\n\
    \n    If triage or the security researcher writes steps that an application security\
    \ engineer can understand, it doesn’t necessarily mean that a software engineer\
    \ will understand the same steps. Translate any complex processes into easy-to-understand\
    \ replication examples, something that someone who has limited technical experience\
    \ may understand.\n\n    (Software engineers are highly technical, but understanding\
    \ the exploitation process may require a different level of understanding.)\n\n\
    2.  **The ticket contains relevant files.**\n\n    In instances of exploitation\
    \ where the security researcher uses an externally hosted file for a proof of\
    \ concept, such as an HTML file, include this in the ticket. An engineer’s time\
    \ is valuable. Internal teams should not have to create any exploitation processes\
    \ from scratch. If the researcher did not include the file, either ask for it\
    \ or include the file that was used for validating the vulnerability.\n\n3.  **The\
    \ ticket contains proofs.**\n\n    Security researchers tend to include screenshots/videos\
    \ of exploitation. If there’s reason to believe that the exploit may be too complex\
    \ to detail in several reproducible steps, be sure to include the material used\
    \ to detail the exploitation process.\n\n4.  **Additional information.**\n\n \
    \   Program managers should include any relevant information that wasn’t parsed\
    \ via the ticket integration functionality.\n\n# 8 Vulnerability Disclosure Information\n\
    \n## 8.1 Understanding Public Disclosure\n\nProgram managers will typically have\
    \ the ability to allow security researchers to disclose their findings after the\
    \ issues are fixed. Allowing public disclosure of vulnerabilities isn’t necessarily\
    \ a program requirement, and program managers should be aware of any implications\
    \ that may occur because of disclosure. Public disclosure, as it pertains to bug\
    \ bounty platforms, is simply the act of allowing the report to populate via public\
    \ feeds. It would be safe to assume that a report disclosed on the feed could\
    \ possibly leave the platform in the form of writeups on the researcher’s website,\
    \ social media posts – or even journalists writing on the vulnerability.\n\n###\
    \ 8.1.1 Making the Decision\n\nUltimately, the decision to allow public disclosure\
    \ depends on the objective of the program. The control of vulnerability remediation\
    \ transparency (allow/deny) is up to the discretion of program managers. Still,\
    \ it’s important to understand that public programs have their own unique challenges\
    \ in this process.\n\n#### 8.1.1.1 Private Programs\n\nThere are two ways that\
    \ private programs can deal with vulnerability disclosure: one represents a standard\
    \ built-in configuration use case, while the other is more of a decided-upon courtesy\
    \ in support of the security researcher’s efforts. Ultimately, it will also depend\
    \ on the configuration allowances that a crowdsourcing platform determines. In\
    \ most cases, private programs will have the ability to allow disclosure, although\
    \ it’s slightly different than what a program manager would expect from a public\
    \ program.\n\n##### Allowing Disclosure\n\nThe option to allow disclosure has\
    \ to come from a place of understanding a security researcher’s mentality, but\
    \ also one of the potential enterprise impact. For example, consider the following.\n\
    \nA researcher works with the enterprise bug bounty program on a critical issue,\
    \ one in which they could have been able to acquire hundreds of thousands of pieces\
    \ of PII. Acting in good faith, the security researcher stopped when they had\
    \ access to the server, to avoid any accidental disclosure of PII.\n\nIf disclosure\
    \ is allowed, most crowdsourcing platforms have policies in place where the only\
    \ people that can view the disclosed (and patched) vulnerabilities are the other\
    \ security researchers who have been invited to and are participating in the program.\
    \ While most security researchers will have respect for the processes put in place\
    \ for preventing disclosure of the vulnerability outside of the organization,\
    \ that may not always be the case. A program manager shouldn’t be presumptuous,\
    \ but associated risk should be known.\n"
  trans: "\n\n## 评级\n\n**评级**：威胁行为者利用漏洞的严重程度或影响。评级标准可以是现实的，分为以下类别之一：不适用、信息、低、中、高、严重。\n\
    \n评估漏洞复杂度和评级的基准不必使用严格的措辞，也不必包含在漏洞赏金计划的描述中，甚至不必写下来。它旨在作为一个心理备忘，在评估漏洞以确定分类优先级时牢记在心，同时在需要评估金额范围时，帮助梳理处理报告漏洞的逻辑过程。\n\
    \n要理解复杂度和评级标准如何结合使用，请注意以下两个独立示例并进行比较。\n\n### 示例 1：example.exe 上的基于栈的缓冲区溢出导致远程代码执行\n\
    \n发现一个漏洞，可对 [company.com](http://company.com) 提供的 `example.exe` 文件执行缓冲区溢出利用。\n\
    \n### 示例 2：本地文件包含 (LFI) 漏洞导致远程文件包含 (RFI)，进而导致远程代码执行\n\n发现一个漏洞，`foo.php?page =`\
    \ 参数存在本地文件包含漏洞。当将载荷 `../../../../../../../etc/passwd` 追加到参数末尾时，漏洞被利用。此外，将 LFI\
    \ 载荷替换为 PHP 输入包装器 (`php://input`) 并修改 POST 请求数据以包含 `<? system(‘uname -a’);?>`，导致系统上发生完全的远程代码执行。\n\
    \n## 7.3.3 预估评级\n\n## 7.3.4 工单与内部 SLA\n\n在企业内部定义的创建工单和管理内部服务级别协议的过程，是信息安全中一个独特且重要的方面。在工单创建过程中，管理漏洞赏金计划的工程师应使用漏洞赏金平台可能提供的任何工单系统集成。或者，在企业自行管理计划的特殊情况下，工程师应定义\
    \ SLA 管理流程，这将在 第 9 章 中进一步讨论。\n\n### 7.3.4.1 创建工单\n\n漏洞分类和验证过程不一定要求计划管理者在内部创建工单。托管服务和分类员工无法参与此类激励。通常，在验证漏洞并认定其可复现且合法后，首要任务是：*支付研究人员报酬*（如果漏洞有效，且已执行尽职调查以验证该问题）。显然，在支付研究人员报酬前，要确保不存在意外为无效漏洞付款的可能性，如前所述。\n\
    \n研究人员获得报酬后，集成到大多数工单平台的连接器将负责在内部为计划生成报告。然而，在某些情况下，工单集成可能不支持包含完整报告。例如，至少计划需要确保以下几点。\n\
    \n1.  **工单包含完全详细的步骤。**\n\n    如果分类人员或安全研究人员编写的步骤应用安全工程师能理解，并不一定意味着软件工程师也能理解相同的步骤。将任何复杂流程转化为易于理解的复现示例，使技术经验有限的人也能理解。\n\
    \n    （软件工程师技术水平很高，但理解利用过程可能需要不同层面的理解。）\n\n2.  **工单包含相关文件。**\n\n    在安全研究人员使用外部托管文件进行概念验证的利用实例中（例如\
    \ HTML 文件），请将其包含在工单中。工程师的时间很宝贵。内部团队不应从头创建任何利用流程。如果研究人员未包含该文件，请索要该文件，或包含用于验证漏洞的文件。\n\
    \n3.  **工单包含证明材料。**\n\n    安全研究人员倾向于包含利用过程的截图/视频。如果有理由认为利用过程过于复杂，无法通过几个可复现的步骤详述，请务必包含用于详述利用过程的材料。\n\
    \n4.  **附加信息。**\n\n    计划管理者应包含任何未通过工单集成功能解析的相关信息。\n\n# 8 漏洞披露信息\n\n## 8.1 理解公开披露\n\
    \n计划管理者通常有权允许安全研究人员在问题修复后披露其发现。允许漏洞公开披露不一定是计划要求，计划管理者应了解因披露而可能产生的任何影响。就漏洞赏金平台而言，公开披露仅仅是允许报告通过公共源填充的行为。可以假设，在源上披露的报告可能会以研究人员网站上的文章、社交媒体帖子，甚至记者撰写的漏洞报道等形式离开平台。\n\
    \n### 8.1.1 做出决定\n\n最终，是否允许公开披露取决于计划的目标。漏洞修复透明度的控制（允许/拒绝）由计划管理者酌情决定。尽管如此，重要的是要理解公开计划在此过程中有其独特的挑战。\n\
    \n#### 8.1.1.1 私有计划\n\n私有计划处理漏洞披露有两种方式：一种代表标准的内置配置用例，另一种更多是出于对安全研究人员努力的支持而决定的礼节。最终，这也将取决于众包平台确定的配置允许范围。在大多数情况下，私有计划将有能力允许披露，尽管这与计划管理者从公开计划中预期的略有不同。\n\
    \n##### 允许披露\n\n允许披露的选项必须源于对安全研究人员心理的理解，也必须源于对潜在企业影响的理解。例如，考虑以下情况。\n\n一名研究人员与企业漏洞赏金计划合作处理一个严重问题，他们本可以获取数十万条\
    \ PII（个人身份信息）。出于善意，该安全研究人员在获得服务器访问权限时停止了操作，以避免任何 PII 意外泄露。\n\n如果允许披露，大多数众包平台都有政策规定，只有受邀并参与该计划的其他安全研究人员才能查看已披露（且已修补）的漏洞。虽然大多数安全研究人员会尊重为防止漏洞在组织外部披露而设立的流程，但情况并不总是如此。计划管理者不应盲目乐观，但应知晓相关风险。\n\
    \n"
