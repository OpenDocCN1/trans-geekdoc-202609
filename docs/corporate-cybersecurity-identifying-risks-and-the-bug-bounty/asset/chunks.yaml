- raw: '1.  *Security researcher discloses unpatched vulnerability*: it’s possible
    that a researcher may get overzealous and post about a vulnerability immediately
    upon reporting it or before it’s patched. While the act alone does not constitute
    toxicity, asking the researcher to remove the vulnerability may result in toxic
    backlash. Program managers may attempt to reach out to the researcher directly
    if they feel comfortable. Legal should not need to be involved. Step up as the
    program manager and tell the legal department that you will deal with it. Communicate
    with the researcher and ask them if they would be willing to take the writeup
    down until the vulnerability is patched. If they refuse, don’t seek to punish
    them but, instead, escalate the criticality of patching that vulnerability internally.
    The most important part isn’t that the hacker disclosed but that the vulnerability
    exists. Get it fixed.


    2.  *Threat actor blackmails or discloses vulnerability*: if the attention of
    a program manager is brought to a vulnerability that is released to the public
    without regard for the enterprise, inform social media managers not to respond,
    and consult with legal on the next move. Document any evidence of the exploitation
    and review logs of the affected asset(s). Validating the vulnerability is also
    a nonnegotiable portion of this exercise. However, if the enterprise has an incident
    response team, they should be notified first and foremost, before exploring the
    data. However, *before* engaging with legal, or even the incident response team,
    please ensure that it’s a legitimate blackmail attempt and not just a researcher
    angry about a lack of contact. Nearly all situations in which a vulnerability
    is being disclosed can be worked out, and most threats are a result of a frustrated
    hacker who has gone unheard.


    3.  *Security researcher threatens to disclose on* *Open Bug Bounty*: program
    managers may find that a security researcher attempted to contact them multiple
    times and there may have been an oversight. They may report the vulnerability
    through a website such as Open Bug Bounty which forcibly discloses the vulnerability
    after 90 days (industry standard). Program managers should attempt to contact
    the researcher using any information on file under their Open Bug Bounty account.
    If a response isn’t received, the program manager should investigate the asset
    and vulnerability type in question and set an alert for the disclosure date reveal
    to see the exploitation methodology and resolve as soon as possible if it’s serious
    enough. If possible, getting the researcher into the bug bounty program and getting
    them paid is a priority. Encouraging research is the mission of bug bounty program
    managers. Typically, when an event such as a report through Open Bug Bounty occurs,
    it’s the result of a bug bounty program that’s too inaccessible to hackers. Program
    managers may observe this occurrence if they run private programs.


    4.  *Security researcher threatens to disclose on social media*: typically, the
    disclosure that is threatened by security researchers on social media is far more
    mild than one of a threat actor. A situation as described would usually start
    as the researcher asking if someone has a contract for the enterprise and tagging
    them on Twitter, Facebook, or LinkedIn. If they don’t receive a response, the
    urgency increases, and depending on the tolerance of the researcher, they may
    threaten to drop it publicly or switch to a more threat-actor-like release mode.
    Program managers are usually free to respond with a little less caution, and just
    as the email intake process is done, invite the researcher to the bug bounty program.
    If they don’t want to disclose the vulnerability to the enterprise, realize that
    there’s probably a good reason for it. Is the program paying researchers well?
    Does the program force a nondisclosure agreement upon a researcher after reporting?
    On average, researchers want money and public disclosure. Offer both and you’ll
    typically note a better response. If the researcher refuses, do not pursue them
    with a legal team – rather, aim to fix the vulnerabilities that are revealed.
    Some researchers can’t be reasoned with, but one must communicate with them appropriately
    and not in a threatening manner.


    ## 10.7 Program Warning Messages


    Security researchers are hackers, and curiosity can be their saving grace and
    their downfall at the same time. Security researchers typically practice anonymity,
    and this may include using a virtual private network (VPN). For example, the enterprise
    program scope may say, “Don’t use automated scans.” A good enterprise security
    program will use a web application firewall or other rate limiting and blocking
    options, and a security researcher who decides to use their real IP can get blocked
    quickly during testing, especially if scanning. In a perfect program management
    world, a security researcher will respect the scope and not use automated solutions.
    In all reality, it’s not usually an issue. However, circumstances may occur during
    heavy production times or development cycles and software engineers may report
    a lot of errors. Program managers will have to come up with creative ways to block
    the traffic if they are not utilizing tooling that can prevent this type of behavior
    automatically. Even if the enterprise does have tooling, messaging may be necessary
    to get the point across.


    ## 10.8 Threat Actor or Security Researcher?


    To be frank, the “Is it a threat actor or security researcher?” game is awful
    to play and mentally exhausting for the program managers and any other involved
    teams. Over time, bug bounty programs have attempted to innovate unique ways to
    deal with this situation, such as requiring a specific VPN connection pack to
    begin research or instructing the researcher to use a specific user agent or header.
    Unfortunately, that may work in some instances, but the more that is required
    of a researcher to begin, the more friction it creates and participation may dwindle,
    or these requirements may be ignored altogether. Creating a playbook in these
    circumstances can help address the issues quickly, whether it’s a mental note
    or physical documentation.


    First, ask the following questions:


    1.  Where are the issues occurring and are they contained?


    2.  Is there production impact and, if yes, how severe is it?


    3.  Does incident response need to get involved?


    4.  Do the requests follow any basic pattern (IP addresses, headers, requests,
    URL paths, etc.)?


    As a general basis, some of the above questions can be used to start sifting through
    data and analyzing the differences. Here are two different examples and their
    suggested resolutions.


    Situation #1 seems like a security researcher. In this instance, patterns appear
    to match behavior observed in the past. Situation #2 is more of a nefarious situation
    in which reaching out to security researchers will be unnecessary. The questions
    above are not to be treated as an incident response plan but as a means of understanding
    some of the various information that program managers should attempt to acquire
    to assist in making the process easier.


    ## 10.9 Messaging Researchers


    At this point, when there’s a pattern of disruption, it doesn’t hurt to send out
    a program message to remind participating researchers not to perform disruptive
    testing. The reason it’s a good idea to send a message to all of the researchers
    is to avoid singling out the particular researcher. Program managers should avoid
    the possibility of causing further issues or demotivating the security researchers.
    In addition, there’s always a chance that the analysis is incorrect and baseless
    or incorrect accusations could damage enterprise reputation. If using an in-house
    bug bounty program solution, you may have to send a mass email with BCC depending
    on the setup. Most managed bug bounty platform solutions have messaging functionality
    built in.


    ### 10.9.1 Security Researcher Interviews'
