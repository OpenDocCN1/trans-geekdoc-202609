  trans: '


    # 漏洞赏金计划管理的一个难点是时刻警惕 CVE 的存在


    当企业产品涉及其中时，如果需要修补公司外部使用的特定组件，则该产品中存在 CVE 的可能性可能更加明显。然而，存在多种可能被忽视 CVE 的情况，这通常是由于对安全研究领域缺乏了解所致。安全研究人员和项目经理都可能最终忽略已识别漏洞的广泛影响。


    ## 8.2.3 硬件 CVE


    企业可能提供种类繁多的硬件，例如 ISP 的产品可能是机顶盒或路由器等。如果路由器测试在范围内，研究人员在路由器中发现漏洞很可能已成功识别出一个 CVE，但如前所述，他们可能不知道该漏洞是一个影响范围更广的
    CVE。保持警惕对于确保企业降低影响和可利用性非常重要。


    在大多数情况下，CNA 并非大多数项目经理能够利用的资源。相反，请遵循第 8.3.2 节中概述的指南。


    ## 8.2.4 软件和产品 CVE


    同一家 ISP 可能拥有一项高级视频流媒体服务，通过用户可能作为月账单附加项购买的应用程序提供。该应用程序通过在互联网上建立的外部连接提供服务，并非基于 Web
    的资产。事实上，它作为可执行文件（`.exe`）下载，并有单独的 MAC 版本（`.dmg`）。此外，该应用程序允许用户创建账户、与其他用户共享视频列表，并在其个人资料页面查看近期活动。


    ## 8.2.5 第三方 CVE


    在前两个场景中，公开漏洞披露和修补的要求直接提交给了组织，但如果情况不明确会怎样？在 ISP 的示例场景中，人们现在可以想象他们的 Web 应用程序正在使用大量第三方软件集成和代码。针对这一特定场景，让我们创建两个虚构的公司名称——ISP
    服务商 Ryudar 和其用于链接锚点和重定向的供应商 AppAncors。


    ## 8.3 提交选项


    项目经理是否负责提交漏洞，完全取决于提交的漏洞类型以及发生的协调情况。报告漏洞有多种选项，且可能会发生变化。项目经理应了解报告过程中可能发生的各种场景，并认识到
    CVE 管理是动态的。一如既往，应始终将企业漏洞赏金计划和研究人员的最佳利益放在心上。


    ### 8.3.1 内部提交


    标准内部提交通常最简单，因为它们遵循已建立的内部流程（即 CNA）。如果项目经理不确定其企业是否为 CNA，应参考 CNA 综合名单 (<https://cve.mitre.org/cve/request_id.html#cna_participants>)，并记住企业在安全团队不知情的情况下拥有
    CNA 的可能性相当小。如果企业确实拥有 CNA，最佳实践是修补漏洞，并通过 CNA 有权访问的报告系统提交 CVE (<https://cve.mitre.org/cve/cna/Requesting_Blocks_of_CVE_IDs-for_CNAs_only.pdf>)。如果运行计划的企业有足够大的用例成为
    CNA，请使用以下表格：


    <https://cve.mitre.org/cve/cna.html#become_a_cna>


    ### 8.3.2 项目管理提交和放手提交


    如果研究人员愿意，企业应允许其自行提交 CVE。然而，应询问研究人员是否允许项目代表其披露。实事求是地讲，由于漏洞赏金计划的保密协议，项目保留代表披露的权利，但不应完全依赖这一点。


    #### 8.3.2.1 项目管理提交


    如果识别出的易受攻击组件可能影响不止一个用户并需要 CVE 披露，请遵循一组提交步骤。


    **提交步骤**


    1.  首先，告知研究人员该漏洞已被识别为 CVE（如果计划中未包含此信息）。

    2.  告知研究人员您希望企业经历提交流程，但询问研究人员是否同意。

    3.  如果研究人员未设定最后期限，提交前为修补流程提供 90 天。如果漏洞很可能更早修复，请务必表达这一点。研究人员很可能会在完整的 90 天期限之前披露，特别是当问题严重时。

    4.  项目经理应首先与相应的内部团队协调，要求他们修复问题。接下来，项目应前往 MITRE 网站提交官方 CVE ID 请求表格。

    5.  当 MITRE 处理请求后，将分配一个 CVE ID，并等待参考资料，即受影响方确认修复的概念验证或通告。

    6.  项目经理可通过回复 CVE 分配邮件提交参考资料，随后 MITRE 将公开发布 CVE。如果时机允许且研究人员采取了负责任的措施，实际的漏洞赏金报告可被披露并用作主要参考。


    > **注意：** 社交媒体账号或社交媒体上的临时帖子均不构成充分的参考资料。为保护企业，至少应提交一份来自企业的参考资料，如漏洞赏金报告、补丁通告或 GitHub
    拉取请求等。


    #### 8.3.2.2 放手提交


    如果协作后，项目和研究人员同意采用自我提交方式，安全研究人员即同意管理交互。这会在多种情况下发生。例如，在第三方上识别出的漏洞将构成放手方式，这对研究人员而言很可能是不可协商的，因为披露其不拥有的产品漏洞并非企业的责任。项目经理应让研究人员知道他们将不得不联系受影响方。此外，也存在研究人员希望自行向
    MITRE 披露 CVE 的可能性。在这种情况下，讨论如何安全地进行，并礼貌地要求研究人员提供拟提交给 MITRE 的内容。验证提交将使企业漏洞赏金计划能够充分确保安全研究人员有效地描述并捕捉漏洞、受影响版本或严重程度级别。


    > **注意：** **不要** 试图激怒安全研究人员或威胁采取法律行动。应尝试理解披露的理由等。缓解负面互动是激发积极研究的重要组成部分，因为存在研究人员可以出售
    CVE 的市场。研究人员选择妥善报告一个原本可能价值连城的问题。


