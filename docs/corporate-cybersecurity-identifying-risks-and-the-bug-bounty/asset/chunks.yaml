- raw: 'A difficult aspect of bug bounty program management is to be on the lookout
    for CVEs, always. When the enterprise’s product is involved, it could be more
    obvious that a CVE exists within the product if it requires patching a specific
    component that is used outside of the company. However, there are multiple instances
    that exist in which a CVE may be overlooked, and it’s usually due to a lack of
    knowledge of the security research space. Both a security researcher and a program
    manager could end up overlooking the widespread impact of an identified vulnerability.


    ### 8.2.3 Hardware CVEs


    An enterprise may offer a wide range of hardware, for instance in the case of
    the ISP their product could be a cable box or a router, and so on. If testing
    on routers were in scope, a researcher who finds a vulnerability within the router
    has likely successfully identified a CVE, but as stated, they may not know that
    the bug is a CVE which has a wider range of impact. Maintaining vigilance is important
    to ensure that the enterprise reduces impact and exploitability.


    In most instances, CNAs aren’t a resource that the majority of program managers
    will be able to utilize. Instead, follow the guidelines outlined in Section 8.3.2.


    ### 8.2.4 Software and Product CVEs


    The same ISP may have a premium video streaming service that’s served via an application
    that users may purchase as an addition to their monthly bill. The application
    is served via a connection that is made externally over the Internet, and isn’t
    a web-based asset. In fact, it’s downloaded as an executable (.exe) file, with
    a separate version for MAC (.dmg). Additionally, the application allows users
    to create accounts and share their video lists with other users, and view recent
    activity on their profile page.


    ### 8.2.5 Third-party CVEs


    In the previous two scenarios, the requirement for public vulnerability disclosure
    and patching was presented directly to the organizations, but what happens in
    the circumstance that it’s not clear? In the example scenario with the ISP, one
    could now imagine that their web application is using a wide array of third-party
    software integrations and code. For this specific scenario, let’s create two fictional
    company names – Ryudar the ISP and AppAncors, a vendor they use for link anchors
    and redirects.


    ## 8.3 Submission Options


    Whether it’s the responsibility of a program manager to submit the vulnerability
    or not completely depends on the vulnerability submitted and the coordination
    that takes place. There are several options for reporting the vulnerability, and
    it’s subject to change. Program managers should understand the various scenarios
    that can occur during the reporting process and realize that CVE management is
    dynamic. As always, the best interests of both the enterprise bug bounty program
    and the researcher should be kept in mind at all times.


    ### 8.3.1 In-house Submissions


    The standard in-house submissions are usually the easiest because they defer to
    internal processes that have already been established (i.e. CNA). If a program
    manager is confused about whether their enterprise is a CNA, they should refer
    to the comprehensive list of CNAs ([https://cve.mitre.org/cve/request\_id.html#cna\_participants](https://cve.mitre.org/cve/request-id.html#cna-participants)),
    and keep in mind that the probability of an enterprise having a CNA without the
    security team knowing about it is fairly unlikely. If the enterprise does indeed
    have a CNA, best practice would be to patch the vulnerability, and submit the
    CVE via the reporting system that the CNA has access to ([https://cve.mitre.org/cve/cna/Requesting\_Blocks\_of\_CVE\_IDs-for\_CNAs\_only.pdf](https://cve.mitre.org/cve/cna/Requesting-Blocks-of-CVE-IDs-for-CNAs-only.pdf))
    if the enterprise running a program has a large enough use case to become a CNA,
    please use the following form:


    ([https://cve.mitre.org/cve/cna.html#become\_a\_cna](https://cve.mitre.org/cve/cna.html#become-a-cna))


    ### 8.3.2 Program Managed Submissions and Hands-off Submissions


    An enterprise should allow the researcher the opportunity to submit the CVE themselves
    if they so wish. However, ask the researcher if they would allow the program to
    disclose on their behalf. Realistically speaking, the program reserves the right
    to do so because of the bug bounty program nondisclosure agreements, but they
    should not be depended on exclusively.


    #### 8.3.2.1 Program Managed Submissions


    If a vulnerable component is identified that may affect more than just one user
    and requires a CVE disclosure, follow a set of submission steps.


    Steps to Submit<query id="Q5"> <p>Dear TS, This is a list heading for the following
    numbered list. I do not know the tag for that.</p> </query>


    1.  First, tell the researcher that the vulnerability has been identified as a
    CVE (if this wasn’t in the program).


    2.  Tell the researcher that you would prefer that the enterprise goes through
    the submission process, but ask if the researcher is okay with that.


    3.  If the researcher does not establish a deadline, offer 90 days for the patching
    process before submitting. If the vulnerability will likely be much sooner, be
    sure to express that. It’s probable that the researcher will disclose far sooner
    than the full 90-day period, especially if the issue is critical.


    4.  The program manager should first coordinate with the appropriate internal
    team to ask them to fix the issue. Next, the program should go to MITRE’s website
    and submit the official CVE ID request form.


    5.  When MITRE processes the request, a CVE ID will be assigned and they will
    wait for references, or in other words, a proof of concept or advisory from the
    affected party, confirming a fix.


    6.  Program managers can submit the references via replying to the CVE assignment
    email, and then MITRE will publicly publish the CVE. If timing permits and the
    researcher has taken responsible measures, the actual bug bounty report can be
    disclosed and used as the primary reference.


    **Note: social media handles or temporary posts on social media are insufficient
    references. In order to protect the enterprise, at a minimum, submit one reference
    from the enterprise such as a bug bounty report, patch notice, or GitHub pull
    request, and so on.** <query id="Q6"> <p>Dear Typesetter, Please set as Note text.</p>
    </query>


    #### 8.3.2.2 Hands-off Submissions


    If after collaboration, the program and researcher agree to a self-submission
    approach, the security researcher is agreeing to manage interactions. There are
    several instances in which this would occur. For example, a vulnerability identified
    on a third party would constitute a hands-off approach, and this would likely
    be non-negotiable on behalf of the researcher as it’s not the responsibility of
    the enterprise to disclose vulnerabilities for products they don’t own. Program
    managers should let the researcher know that they will have to contact the affected
    party. Additionally, there’s the possibility of a researcher wanting to disclose
    the CVE to MITRE themselves. In this instance, discuss how it can be done safely,
    and kindly ask the researcher to provide the proposed submission to MITRE. Validating
    the submission will adequately enable the enterprise bug bounty program to ensure
    that the security researcher is effectively describing and capturing the vulnerability,
    affected version, or severity levels.


    **Note: do *not* attempt to provoke the security researcher or threaten legal
    action. Attempt to understand the case for disclosure, and so on. Mitigating negative
    interactions is an essential part of provoking positive research, as markets where
    researchers can sell CVEs exist. The researcher chose to adequately report an
    issue that may have been worth a lot of money otherwise.** <query id="Q7"> <p>Dear
    TS, Please set as Note text.</p> </query>'
