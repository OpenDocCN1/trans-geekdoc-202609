    When the "Deposit funds" button is clicked, there will be a textbox that asks
    for the destination, and that is where the program manager will select the program
    they would want to assign money to. The program manager can then type the amount
    of money into the textbox, click on the "I agree to terms and conditions for the
    transaction" checkbox, and click on the submit deposit request ([Figure 6.51](#c06.xhtml#c6-fig-0051)).
    The account manager will then send an invoice to the program manager to run through
    to the finance team. Program managers will have to ensure that management is tracking
    expenditures and get it approved through the correct processes. Once Bugcrowd
    approves the pending deposits, the bug bounty pool will be assigned money that
    can be used to reward researchers.


    ![Figure 6.51 Submit deposit request option.](images/c06f051.png)


    [**Figure 6.51**](#c06.xhtml#rc6-fig-0051) Submit deposit request option.


    > **Note:** Program managers should never assume that they have enough money in
    the pool. It is an essential responsibility to ensure that the program manager
    is keeping track of the reward pool at all times.


    As shown in [Figure 6.52](#c06.xhtml#c6-fig-0052), a program manager can also
    utilize the "Transfer funds" button. Transferring funds allows program managers
    to deposit money from one pool to another when they run multiple programs. The
    transfer funds option is nearly identical to the deposit funds option. The final
    option within the accounting tab is the "Program balances" tab. The program balances
    tab allows program managers to see the bug bounty pool for a multitude of programs.
    For example, some enterprises own multiple companies and may want to segment bug
    bounty programs by company to avoid confusion. When a program manager runs multiple
    bug bounty programs, they should periodically check the program balances tab to
    ensure that all of the programs are funded ([Figure 6.53](#c06.xhtml#c6-fig-0053)).


    ![Figure 6.52 Transfer funds option.](images/c06f052.png)


    [**Figure 6.52**](#c06.xhtml#rc6-fig-0052) Transfer funds option.


    ![Figure 6.53 Program balances option.](images/c06f053.png)


    [**Figure 6.53**](#c06.xhtml#rc6-fig-0053) Program balances option.


    ## 6.3 HackerOne

    '
  trans: '

    Bugcrowd 的最后一个方面是重新配置、设置项目认证或通过会计设置为项目注资的能力。项目经理将不得不审查并处理其中的几项内容，因为漏洞赏金项目提供奖励和一笔用于提取奖励的资金池，这将需要进行分配。


    ### 6.2.5.2 组织详情


    组织详情网页与初始设置几乎没有区别。此页面允许项目经理为组织上传新徽标、更改背景颜色或为项目添加联系电话。


    ### 6.2.5.3 团队成员


    团队成员页面存在于项目配置的其他部分。因此，项目经理唯一需要知道的是这是另一条访问路径。


    ### 6.2.5.4 目标


    设置首个项目的项目经理已经使用过此页面，因为添加目标是为漏洞赏金项目创建分组的先决条件。


    ### 6.2.5.5 认证


    最初较难就认证方面提供建议，因为这将取决于企业构建其 `IdP`（身份提供商）管理的方式。然而，项目经理应尽可能争取使用 `SSO`（单点登录），因为这对整个企业来说要安全得多。几乎所有现代
    `SSO` 解决方案都要求用户启用 `TFA`（双因素认证）才能登录，因此使项目经理的体验更加安全。例如，`Okta` 是一款为各种应用程序启用 `SSO`
    使用的应用程序。项目经理应联系其 IT 支持团队，以了解组织内哪个团队负责身份管理配置。`SSO` 集成有两个方面：特定站点配置和 `SAML`（安全断言标记语言）设置。`SSO`
    配置需要提供给相应团队，以填写启用该解决方案所需的字段。此外，同一团队将不得不向项目经理提供身份管理提供商的所有 `SAML` 设置，以填写相应字段。完成后，即可保存认证设置。


    如图 6.48 所示，需要完成各个字段。如果企业不维护 `SSO` 解决方案，Bugcrowd 默认将使用标准企业电子邮件地址结合密码的方式。


    ![图 6.48 单点登录选项。](img/c06f048.png)


    **图 6.48** 单点登录选项。


    > **注意：** 需要域验证才能在项目中建立 `SSO`，因此应仔细遵循以下“域”选项卡的设置。


    ### 6.2.5.6 域


    验证添加到项目的任何域都是启用 `SSO` 所必需的。要完成验证过程，可以在文本框中输入所有域并按下“添加域”按钮。添加域后，它将填充到“未验证的域”部分下，项目经理将不得不与负责管理公司
    `DNS`（域名服务器）的企业团队进行沟通。项目经理应让负责团队（可能是网络工程团队或类似团队）知道，他们需要验证所有域以设置 `SSO`。未验证的域旁边将有一个验证代码，该代码需要添加到
    `TXT`（文本记录，即域名系统 [`DNS`] 中的一种资源记录，用于提供将任意文本与主机或其他名称关联的能力）记录中，并托管在根域上（图 6.49）。可能需要
    24 小时才能生效。


    ![图 6.49 未验证的域选项。](img/c06f049.png)


    **图 6.49** 未验证的域选项。


    ### 6.2.5.7 会计


    项目经理将利用会计页面作为分配漏洞赏金池的一种手段。漏洞赏金项目经理可以转移资金、存入资金，或查看总体活动或项目余额。如果没有分配赏金池，研究人员就无法获得奖励。项目经理应确保在继续之前设置好此功能。


    如图 6.50 所示，提供了活动摘要，包括组织资金池、待存款、项目分配和总支出金额。项目经理可以点击“存入资金”按钮，将资金分配给其赏金池。


    ![图 6.50 活动摘要。](img/c06f050.png)


    **图 6.50** 活动摘要。


    点击“存入资金”按钮时，将出现一个询问目的地的文本框，项目经理将在其中选择要分配资金的项目。然后，项目经理可以在文本框中输入金额，勾选“我同意交易的条款和条件”复选框，并点击提交存款请求（图
    6.51）。客户经理将随后向项目经理发送发票，以便通过财务团队处理。项目经理将不得不确保管理层正在跟踪支出，并通过正确的流程获得批准。一旦 Bugcrowd
    批准待存款，漏洞赏金池将被分配可用于奖励研究人员的资金。


    ![图 6.51 提交存款请求选项。](img/c06f051.png)


    **图 6.51** 提交存款请求选项。


    > **注意：** 项目经理永远不应假设资金池里有足够的钱。确保项目经理始终跟踪奖励池是一项基本职责。


    如图 6.52 所示，项目经理还可以使用“转移资金”按钮。转移资金允许项目经理在运行多个项目时，将资金从一个资金池存入另一个。转移资金选项与存入资金选项几乎相同。会计选项卡中的最后一个选项是“项目余额”选项卡。项目余额选项卡允许项目经理查看多个项目的漏洞赏金池。例如，一些企业拥有多家公司，可能希望按公司划分漏洞赏金项目以避免混淆。当项目经理运行多个漏洞赏金项目时，他们应定期检查项目余额选项卡，以确保所有项目都有资金（图
    6.53）。


    ![图 6.52 转移资金选项。](img/c06f052.png)


    **图 6.52** 转移资金选项。


    ![图 6.53 项目余额选项。](img/c06f053.png)


    **图 6.53** 项目余额选项。


    ## 6.3 HackerOne

