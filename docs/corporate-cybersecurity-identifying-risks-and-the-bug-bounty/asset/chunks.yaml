  trans: '


    ## 7. 步骤 3：漏洞赏金计划参与指南


    步骤 3 侧重于漏洞赏金计划参与指南。


    - 第一个滑块允许计划管理员启用或禁用 Bugcrowd 的评级分类法。概述所有 Bugcrowd 评级的具体指南可在文本块下方看到。强烈建议计划管理员使用此分类法评级。Bugcrowd
    自 2011 年起一直在管理安全研究，他们使用的 VRT（漏洞评级分类法）维护良好，随着新漏洞的发现会频繁更新并重新评估。或者，也可以将其关闭并自行维护，但不建议这样做。

    - 下一个滑块允许计划接受与非目标问题相邻的报告问题。换句话说，设想一位研究人员在 `www.example.com` 上发现了一个 `API`（应用程序编程接口；一种定义多个软件应用程序或混合软硬件中介之间交互的组件）密钥，该密钥允许他们与
    `login.example.com` 进行交互。如果登录子域不在范围内，且此滑块被禁用，研究人员将没有机会报告该漏洞。建议允许研究人员报告超出范围的问题，尽管已注明他们不会因该漏洞获得奖励。

    - 第三个滑块用于启用或禁用安全港。如果滑块已启用，计划管理员还可以选择部分或完全安全港。建立漏洞赏金计划的全部意义在于给安全研究人员提供一个安全的避风港进行黑客测试，同时提高企业安全态势的有效性。计划管理员应启用安全港选项。

    - 最后，本节的第四个也是最后一个滑块是协调披露选项。启用此滑块赋予研究人员请求将其发现结果公开发布的能力。此选项应开启。在计划上进行黑客测试的安全研究人员付出辛勤工作进行披露是为了获得报酬并向公众披露。如果计划管理员觉得自己尚未准备好让已修补的漏洞向世界披露，那么运行漏洞赏金计划将徒劳无功。沉默恰恰与鼓励黑客与企业之间本就脆弱的关系增长背道而驰。


    ## 8. 步骤 4：定义奖励范围


    在步骤 4 中，定义奖励范围（图 6.6）。选择“Basic”（基础）单选按钮，特别是如果这是首次管理漏洞赏金计划。此外，对于刚起步的计划，使用最大广告奖励功能是不必要的。随着漏洞巩固企业安全态势，调整奖励金额将随时间而来。选择单选按钮后，点击“Next
    step”（下一步）按钮。


    ![图 6.6 在 Bugcrowd 上按严重程度添加奖励范围。](img/c06f006.png)


    **图 6.6** 在 Bugcrowd 上按严重程度添加奖励范围。


    ## 9. 步骤 5：描述理想研究关注点


    在步骤 5 中，计划管理员应描述理想研究关注点的样子。描述关注领域将有助于安全研究人员更好地了解企业试图实现的目标。例如，设想一家零售公司运行一个赏金计划。他们可能会写如下内容（图
    6.7）：


    ![图 6.7 在 Bugcrowd 上确定目标和关注点。](img/c06f007.png)


    **图 6.7** 在 Bugcrowd 上确定目标和关注点。


    ## 10. 研究关注点考量


    作为一个小例子，一些考量关注收银机、敏感客户数据泄露，以及任何可能导致敏感信息被盗的漏洞。告诉研究人员计划在寻找什么至关重要。但请注意，如果未明确声明为超出范围，研究人员仍会尝试研究他们想研究的任何内容（有时即使声明了也是如此）。此外，可以随意关注特定攻击类别，而不是攻击向量，例如告诉研究人员计划对“本地文件包含”或“远程代码执行”等高度感兴趣，等等。这是计划管理员描述所有重要与不重要方面的绝佳空间。


    ## 11. 步骤 6：技术标记


    步骤 6 是在定义漏洞赏金计划关注的漏洞后进行的技术标记跟进。标记过程分为四个部分：研究人员活动、资产环境、语言和框架，以及托管和第三方应用程序（图 6.8）。定义这些标记很重要，因为它有助于正确的研究人员参与。例如，如果研究人员看到计划主要关注移动端和
    `API` 测试，他们可能会决定这不适合自己，从而节省大量浪费的时间，并鼓励合适的研究人员群体参与。确保定义资产标记、研究需求以及各种框架和期望活动，是有助于确保计划得到充分定义的必要过程。计划可以自由限制提供的信息量，但这往往会损害整体安全态势并浪费研究人员的时间。


    ![图 6.8 选择研究人员活动、环境、语言、框架和应用程序/服务。](img/c06f008.png)


    **图 6.8** 选择研究人员活动、环境、语言、框架和应用程序/服务。


    ## 12. 步骤 7：添加外观与风格


    接下来是“添加外观与风格”——简而言之，上传徽标、生成将显示在计划下方的标语，并用简短描述欢迎研究人员加入计划（图 6.9）。


    ![图 6.9 上传公司徽标并创建标语和简介。](img/c06f009.png)


    **图 6.9** 上传公司徽标并创建标语和简介。


    ## 13. 徽标和简介详情


    此外，可以为徽标选择背景颜色，因此请尽力选择适当的对比度，使其在安全研究人员眼中醒目。简介空间无非是解释计划是谁以及为什么雇佣安全研究人员。该空间也可用于解释公司的业务及其使命。激励研究人员参与是终极目标。


    ## 14. 步骤 8：定义启动时间线


    步骤 8 侧重于为私有和公开启动定义时间线。如果计划管理员已达到设置计划的阶段，通常表明具备一定程度的准备度并致力于建立计划。对于“Preferred private
    launch timeline”（首选私有启动时间线），建议准备“Within a month”（一个月内）启动。正如计划管理员往往会了解到的，公开计划启动是一项大得多的承诺。计划管理员应选择“More
    than a month after private launch”（私有启动一个月以上）选项，因为要实现公开启动还有大量工作要做。


    ## 15. 最终提交


    最后，当在步骤 8 中点击下一步按钮时，将出现一个突出显示所有激励措施的页面。查看所有提交的信息，准备好后点击“Submit”（提交）以进入下一阶段。


    ## 6.2.2 计划概览


    现在计划已完全设置，了解各种选项和功能是理解如何管理漏洞赏金计划的下一步。计划管理员应熟悉所有不同的页面以及修改现有计划设置的各种方式，以防止计划上线时出现任何问题。


    ### 6.2.2.1 计划仪表板


