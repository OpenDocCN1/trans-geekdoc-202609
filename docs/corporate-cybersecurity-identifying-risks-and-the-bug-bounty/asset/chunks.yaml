    \ of scope, and modify the safe harbor as they see fit. Additionally, the ability\
    \ to discuss the specifics of rewards for in- and out-of-scope assets can be discussed\
    \ here. The scope and rewards sections may seem redundant, but the purpose is\
    \ to express the enterprise’s stance to ensure that the researcher is aware of\
    \ all of the possibilities. For example, earlier during the initial configuration\
    \ the scope and rewards were set. However, this would be a good section to use\
    \ as a venue to explain to the researcher specifics of the scope as the enterprise\
    \ may have specific ideas in mind. Take a look at the following screenshot ([Figure\
    \ 6.22](#c06.xhtml#c6-fig-0022)):\n\n![Figure 6.22 Scope details.](images/c06f022.png)\n\
    \n[**Figure 6.22**](#c06.xhtml#rc6-fig-0022) Scope details.\n\nAs seen in [Figure\
    \ 6.22](#c06.xhtml#c6-fig-0022) under the target information section, a defined\
    \ credential pair has been provided for testing purposes. In addition, the same\
    \ figure highlights areas that the enterprise is also concerned with, as an example.\
    \ Finally, this section is closed out with a custom “Out-of-Scope” notes section.\
    \ The scope details section is not to be taken lightly, because a failure to handle\
    \ this section carefully can result in mishaps such as a researcher attempting\
    \ an attack that can be detrimental to employee safety or the enterprise environment.\
    \ A program manager should strive to carefully review the ideal out-of-scope attacks\
    \ in [Chapter 4](#c04.xhtml) and also review the various out-of-scope sections\
    \ of some of the other public bug bounty programs that are out there to get a\
    \ good idea of what the enterprise should strive to avoid. For the most part,\
    \ triage will assist in explaining to a researcher the issues that surround low-level\
    \ vulnerabilities or those that lack impact. However, the problem lies with valid\
    \ vulnerabilities that the enterprise bug bounty program may not want to accept.\
    \ Imagine the following.\n\nThe program manager knows that the enterprise is riddled\
    \ with cross-site scripting (XSS) vulnerabilities. All of the software engineers\
    \ are aware that nearly every parameter on the domain has issues with XSS. The\
    \ enterprise still wants to utilize a private bug bounty program but areas of\
    \ focus are on vulnerabilities that are not well known as issues, such as local\
    \ file inclusion, remote code execution, html injection, etc. If the program manager\
    \ did not consider the cleverness of the hackers that will be invited to the program,\
    \ they may end up with a massive amount of XSS reports – and because it wasn’t\
    \ marked as an out-of-scope vulnerability type, it could result in the bug bounty\
    \ program having to pay a lot of money to researchers. One of the most important\
    \ aspects of program management is realizing that saying, “Ah, we should have\
    \ had this in our out-of-scope section,” is not an acceptable response by any\
    \ means and the enterprise will be on the hook for it.\n\nFor the most part, the\
    \ premade safe harbor section is decent and should be kept. Nonetheless, program\
    \ managers should talk to management to ensure that everyone is on the same page\
    \ and that the safe harbor adequately reflects the needs of the enterprise. Still,\
    \ program managers should not let upper-level management or legal teams fully\
    \ control the safe harbor clause or additions to such clauses, as the result may\
    \ be overbearing and dissuasive to security researchers who may want to participate.\n\
    \nA “Target Groups” section also exists in this section. It can be a useful way\
    \ to organize similar assets to prevent researchers from smashing their keyboard\
    \ attempting to look at all of the tags for what they are hoping to test. Logically,\
    \ a program manager will want to add all relevant assets before making the group.\
    \ Unfortunately, to do so, a different section of the application must be utilized.\
    \ Follow these instructions:\n\n1.  Click on the profile image in the top-right-hand\
    \ corner and then click on the “Targets” tab under the bug bounty program name\
    \ ([Figure 6.23](#c06.xhtml#c6-fig-0023)):\n\n    ![Figure 6.23 Profile dropdown\
    \ menu.](images/c06f023.png)\n\n    [**Figure 6.23**](#c06.xhtml#rc6-fig-0023) Profile\
    \ dropdown menu.\n\n2.  Clicking on the “Targets” option brings up a web page\
    \ that acts similar to the initial targets page as discussed when the program\
    \ was initially set up ([Figure 6.24](#c06.xhtml#c6-fig-0024)). This would be\
    \ a good time to add and tag any additional assets that researchers should test.\n\
    \n    ![Figure 6.24 Targets tab.](images/c06f024.png)\n\n    [**Figure 6.24**](#c06.xhtml#rc6-fig-0024) Targets\
    \ tab.\n\n    **Note: remember that not every asset needs to be added at once.\
    \ If the program manager only has a couple of targets at first, or does not have\
    \ a lot of assets that can be similarly grouped – that’s fine! As the program\
    \ expands, groups can be utilized. In fact, there’s no harm in establishing the\
    \ groups as is with minimal assets just to keep everything organized for the future.**\
    \ <query id=\"Q1\"> <p>Dear TS, Set as either all bold or highlighted/indented\
    \ in some way. Please do not first line indent. Set as Note paragraph.</p> </query>\n\
    \n3.  After adding all of the relevant assets, as seen above, return to the scope\
    \ and rewards section by clicking on the “Select a program” dropdown menu and\
    \ selecting the program ([Figure 6.25](#c06.xhtml#c6-fig-0025)).\n\n    ![Figure\
    \ 6.25 Program dropdown menu.](images/c06f025.png)\n\n    [**Figure 6.25**](#c06.xhtml#rc6-fig-0025) Program\
    \ dropdown menu.\n\n4.  Again, click on the “Settings’’ tab on the crowd control\
    \ navbar, as done previously. Then click on the “Scope and Rewards” tab and, lastly,\
    \ the “Target Groups” tab.\n\nAdding the groups can be simple but daunting and\
    \ turn into a mess if the program manager isn’t ready to do so. In reality, the\
    \ option of group utilization is useful for adjusting reward levels, and can be\
    \ used to turn out-of-scope reporting into in-scope reporting with benefits. To\
    \ add a group, perform the following.\n\n1.  First, click on the “Add group” button\
    \ ([Figure 6.26](#c06.xhtml#c6-fig-0026)).\n\n    ![Figure 6.26 “Add group” button.](images/c06f026.png)\n\
    \n    [**Figure 6.26**](#c06.xhtml#rc6-fig-0026) “Add group” button.\n\n2.  A\
    \ target group web page will populate. For the title, it is recommended to use\
    \ something broad to prevent an overwhelming amount of groups from being created.\
    \ As an example, having general categories such as “Web Application Testing,”\
    \ “Network Testing,” “Mobile Application Testing,” “API Testing,” etc., will give\
    \ security researchers a better sense of what to test. However, it isn’t a necessity,\
    \ and program managers can use more granular names depending on the specific case.\
    \ After the title is added, a description of the asset group can be useful for\
    \ security researchers ([Figure 6.27](#c06.xhtml#c6-fig-0027)).\n\n    ![Figure\
    \ 6.27 Description of an asset group.](images/c06f027.png)\n\n    [**Figure 6.27**](#c06.xhtml#rc6-fig-0027) Description\
    \ of an asset group."
