- raw: "Given that 127.0.0.1 is the domain, such as [https://example.com](https://example.com)\
    \ – and the semicolon is either the preferred port or service (unnecessary to\
    \ append the port for ports 443 and 80) – the command will look for files and\
    \ directories and output them along with the status response code when finished\
    \ ([Figure 11.22](#c11.xhtml#c11-fig-0022) ).\n\n![Figure 11.22 Dirsearch Finding\
    \ Folders.](images/c11f022.png)\n\n[**Figure 11.22**](#c11.xhtml#rc11-fig-0022) Dirsearch\
    \ Finding Folders.\n\n## 11.5 Passive/Active Summary\n\nThere’s a wide range of\
    \ tools available to program managers, and this portion of the book doesn’t even\
    \ scratch the service of the amount of free tooling and resources available, including\
    \ the manual reviews that can be done to support the health of the bug bounty\
    \ program. Program managers don’t need to be expert hackers with impeccable wit\
    \ and skill, but they do need to know how to identify low-hanging fruit, and a\
    \ lot of the tooling discussed is good when utilized for the purposes of surface\
    \ level penetration testing. Nonetheless, program managers should aspire to learn\
    \ as much as possible to identify a wider range of bugs.\n\n## 11.6 Additional\
    \ Considerations: Professional Testing and Third-Party Risk\n\nFor program managers\
    \ that don’t have the experience to perform internal assessments themselves, they\
    \ should outsource to a trusted penetration testing firm and ask for a black-box\
    \ test (meaning no information is given). Even enterprises that have the expertise\
    \ to carry out full penetration tests could benefit from further testing, especially\
    \ if the engineers do not perform penetration testing as a full-time job. Third-party\
    \ risk is yet another factor that needs to be considered throughout the assessment\
    \ period. It’s easy to think about the impact of testing company-owned assets,\
    \ but how about assets not owned by the enterprise running the bug bounty program?\n\
    \nIt would be unwise to open up a program to security researchers if the enterprise\
    \ isn’t prepared to deal with remediating a lot of vulnerabilities. Third-party\
    \ risk can be yet another factor, opening up the opportunity of exploitation or\
    \ more bugs that a program will have to pay if not recognized in the first stage\
    \ of partnership from company to company. Program managers should work with governance,\
    \ risk, and compliance to evaluate acquisitions or partners consistently. Failure\
    \ to do so can result in the exploitation of the organization.\n\n# 12   \n\n\
    Expanding Scope\n\nEarlier in the book, the scope of a bug bounty program was\
    \ discussed and a key principle was to ensure that the scope that is defined was\
    \ not too wide to prevent overburdening of the program managers who are attempting\
    \ to triage and remediate vulnerabilities. The idea behind scope expansions is\
    \ to give researchers more surface to test on. After all, a threat actor may want\
    \ something that the enterprise has: scope does not exist in the world of crime\
    \ and illegal personal gain.\n\nOpening up additional assets for testing can prove\
    \ painful if too many assets are added or if an enterprise decides to offer rewards\
    \ on an untested asset. While there’s not necessarily a right or wrong time to\
    \ expand scope, several steps can be taken to mitigate the potential of failure,\
    \ nearly all within the realm of prior testing and level of effort.\n\n## 12.1 Communicating\
    \ with the Team\n\nThe nonnegotiable aspect of scope expansion is adequately portraying\
    \ intentions to the team. Standalone program managers should communicate with\
    \ leadership to ensure that everyone is on the same page with the expansion. A\
    \ program manager should never add an asset without talking to other engineers\
    \ on the team. Bridging any gaps in communication is a fairly easy process, and\
    \ with an adequate plan resistance won’t necessarily be met unless the budget\
    \ isn’t flexible for the needs of the bug bounty program.\n\nProgram managers\
    \ should focus on a few aspects to enable a thorough conversation:\n\n*   Intention:\
    \ during the process, the reason for scope expansion should be discussed with\
    \ the program team or with leadership. The idea of the expansion is to allow more\
    \ attack surface. Therefore, the reasoning should be communicated to the appropriate\
    \ party.\n\n*   Testing: let the team know what the vulnerability analysis plan\
    \ is prior to the expansion. An in-house penetration test may suffice, but weighing\
    \ the pros and cons of an out-sourced penetration test may be necessary depending\
