- raw: 'In addition to legal liability, social engineering attacks can be disruptive
    to enterprise workflow. A constant barrage of phishing emails via contact forms,
    emails, phone calls (or whatever the means may be) can result in employee complaints
    or cause monetary loss depending on the specific instance. It’s important to be
    adamant about excluding social engineering attacks due to the possibility of disruption.


    ### 4.8.3 Brute Force or Rate Limiting


    Attacks that include attempting to break into user accounts (brute force) can
    possibly cause issues as well. Brute force attacks can disrupt the application
    security workflow and also cause legal issues if user accounts are taken over
    and abused in the security research “proof of concept” process. In addition to
    legal issues, brute force attacks can negatively affect production environments,
    and in the instance it goes down, the application security team may be responsible
    for not annotating this as out of scope.


    Rate limiting should also be included as out of scope for the same reasons. Security
    researchers may disrupt production environments and cause impact or other related
    security issues. In addition, it’s considerably low impact.


    ### 4.8.4 Account and Email Enumeration


    Building a list of usernames or emails that exist on the application typically
    has no impact on the enterprise. In this day and age of technology, it’s become
    exceedingly easy to gather wordlists of usernames and emails to use for brute
    force attacks.


    ### 4.8.5 Self-XSS


    Being able to produce an XSS (cross-site scripting) alert that can only be seen
    by the user themselves and not anyone else, including staff, is not generally
    considered a vulnerability. Self-XSS has no considerable impact. However, program
    managers must understand the difference between all of the various XSS types to
    ensure that they understand the security researcher.


    ### 4.8.6 Clickjacking


    Clickjacking is the practice of manipulating a user’s activity by concealing hyperlinks
    beneath legitimate clickable content, thereby causing the user to perform actions
    of which they are unaware. Clickjacking is also known as a “UI redress attack”.
    The vulnerability of clickjacking is usually out of scope because it relies on
    social engineering heavily. It can be used to exploit users, but generally not
    in the scope of vulnerabilities that a program should/would accept.


    ### 4.8.7 Miscellaneous


    Realistically, there are far too many attacks that can be considered nonpayable.
    Program managers should take the time to review all of the various attack methods
    and look at other attacks that are out of scope in similar bug bounty programs
    to determine why allowing that type of attack may end up being problematic. Keep
    in mind that expansions are continuous. Program managers will find that certain
    types of attacks may be too disruptive to their workflow or considerably low impact
    and not worth evaluating. Assess the out-of-scope attack vector portion of programs
    as needed, and be sure to inform hackers of any major modifications.


    ## 4.9 When Is an Asset Really Out of Scope?


    Overall, the objective of out-of-scope reporting is never to discourage a security
    researcher from reporting, but to ensure that baseline restrictions are placed
    to prevent legal or financial impact. With that being considered, ideally program
    managers should be fair in the evaluation of vulnerabilities that are in and out
    of scope.


    A security researcher pulls up a list subdomains for the enterprise and finds
    a lot of assets, some of which are explicitly stated as out of scope. Researchers
    are curious, be it by nature or acquired in their lives. They want to know how
    components work. In this specific scenario, assume that it’s well known that this
    asset is out of scope (defined in the out-of-scope section of the enterprise bug
    bounty program): should it be tested on?


    If the answer that came to mind was *no*, it can be simultaneously the right and
    wrong answer. To demonstrate scenarios that bug bounty program managers may run
    into, consider an example of a (P1) – critical vulnerability – and a (P4) – low
    vulnerability.


    Now, review the next scenario, keeping the P1 example in mind.


    ## 4.10 The House Wins – Or Does It?


    The ultimate decision of many bug bounty programs that currently operate typically
    resides with not paying the security researcher if it’s out of scope. Some that
    have been overheard reside within the school of thought of “We don’t want to encourage
    our researchers to hack out-of-scope assets just to get a bounty” or “If we pay
    a researcher for one out-of-scope bounty, we will have to pay them for every out-of-scope
    bounty.”


    A major issue with adverse thinking toward out-of-scope research is that it can
    lead to key research being overlooked. When determining whether paying for a reported
    vulnerability appears to be the right move, ask the following questions:


    1.  What is the level of impact of this vulnerability? Could it lead to extremely
    sensitive information leakage?


    2.  If no sensitive information is leaked, could the vulnerability severely damage
    company reputation?


    3.  Do we value the researcher and want to reward them?


    One size does not fit all in terms of paying a security researcher. Remember,
    when managing a program, the rules are made by the program manager. While transparency
    with leadership must always be exercised, caring is the key to developing a strong
    and loyal research platform and building brand reputation among the cybersecurity
    community. Let’s take our earlier examples of the critical and low vulnerabilities
    and perform a dry run of answering the above questions.


    In this admin takeover example, it’s easily determined that a lot of damage could
    occur. Company information could be sold, or there could be direct impact to business
    continuity, creating a loss in revenue. With that being said, the right thing
    to do would be to pay the security researcher. In a circumstance such as the one
    described, there would be far more loss in a breach scenario than there would
    ever be if the researcher were adequately paid. Programs should consider setting
    a moral example and paying for the vulnerability findings.


    When a lower-end vulnerability is reported out of scope, it’s not technically
    immoral to refuse to reward hackers for their findings. Expectations that were
    set out early in the process are fair game. However, consider paying researchers
    a mild bonus or sending a t-shirt. A little bit of gratitude, especially for someone
    who went out of their way to help, goes a long way.


    ## 4.11 Fair Judgment on Bounties


    It’s easy to stray from the moral path as a program manager. At times, it can
    seem enticing to claim plausible deniability for an issue. If using a managed
    program, the triagers only know your environment as well as they possibly can
    from an external perspective. Bug bounty programs are only as efficient as the
    engineers and managers that run the program. Similarly, programs can only be as
    honest as the parties responsible for validating vulnerabilities.


    There are many blind exploitation paths that can easily be denied, or are questionable
    from the perspective of an attacker, and it takes adequate communication between
    the researcher and engineer to confirm the existence of some vulnerabilities.


    If a researcher were to stumble across a GitHub repository for an organization
    and find SQL credentials, it would be an extremely valuable finding, especially
    if they could log in. In the instance that the login is restricted to the internal
    network, they may not have a way to immediately control the server. At times,
    it may take internal verification. Verification may fall out of the line of sight
    of the triage team and the researcher.


    Observe the following interaction between a triage team, program, and hacker.


    ## 4.12 Post-mortem'
