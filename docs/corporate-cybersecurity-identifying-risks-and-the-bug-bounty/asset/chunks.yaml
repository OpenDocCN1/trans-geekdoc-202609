    correctly. However, program managers should aspire to uphold the timelines they
    set out between response, triage, bounty, and resolution. If a program manager
    runs a bug bounty program for a long time. They are likely to eventually miss
    a target. Nonetheless, program managers should not take this too hard, but rather
    should learn from their mistakes.


    #### 6.3.3.5 Metrics Display


    The metrics display tab shows various statistics that could potentially attract
    security researchers to the bug bounty program ([Figure 6.71](#c06.xhtml#c6-fig-0071)).
    However, the metrics that are displayed are completely up to the program manager.
    There isn’t necessarily a “wrong” way to display metrics.


    ![Figure 6.71 Metrics display option.](images/c06f071.png)


    [**Figure 6.71**](#c06.xhtml#rc6-fig-0071) Metrics display option.


    #### 6.3.3.6 Email Notifications


    The email notifications tab is self-explanatory. Program managers have the ability
    to choose from three options. The options given are “No content,” “Minimal content,”
    and “Full content” ([Figure 6.72](#c06.xhtml#c6-fig-0072)).


    ![Figure 6.72 Setting email notifications.](images/c06f072.png)


    [**Figure 6.72**](#c06.xhtml#rc6-fig-0072) Setting email notifications.


    #### 6.3.3.7 Inbox Views


    In short, these are quick views that can execute filters applied to reports in
    the inbox tab. Program managers can come to this tab to enable or disable saved
    views ([Figure 6.73](#c06.xhtml#c6-fig-0073)).


    ![Figure 6.73 Inbox views option.](images/c06f073.png)


    [**Figure 6.73**](#c06.xhtml#rc6-fig-0073) Inbox views option.


    #### 6.3.3.8 Disclosure


    Enabling this function allows hackers to disclose reports in the program ([Figure
    6.74](#c06.xhtml#c6-fig-0074)).


    ![Figure 6.74 Disclosure option.](images/c06f074.png)


    [**Figure 6.74**](#c06.xhtml#rc6-fig-0074) Disclosure option.


    #### 6.3.3.9 Custom Fields


    The “Custom Fields” tab allows a program manager to tag reports with key value
    data. Unfortunately, this feature is only available to enterprise edition users.
    Bugcrowd, on the other hand, includes this functionality by default.


    #### 6.3.3.10 Invitations


    Hacker invitations are just that: a functionality that is utilized to invite hackers
    to the program. This tab allows the invitation by email, username, or reputation.
    In addition, a report volume can be set; the report volume allows program managers
    to set a minimum report desire ([Figure 6.75](#c06.xhtml#c6-fig-0075)). If the
    minimum is not met, the program will automatically invite hackers until the number
    of monthly reports is met.


    ![Figure 6.75 Invitations option.](images/c06f075.png)


    [**Figure 6.75**](#c06.xhtml#rc6-fig-0075) Invitations option.


    When program managers are ready for a public launch, this is where they can go
    to launch the incentive ([Figure 6.76](#c06.xhtml#c6-fig-0076)). HackerOne recommends
    that the program contains at least 100 hackers before launching to the public.
    Additionally, HackerOne warns that a bug bounty program can receive up to 200
    reports in the first week of going public and that reverting back to private can
    affect the program and hackers negatively.


    ![Figure 6.76 Public launch option.](images/c06f076.png)


    [**Figure 6.76**](#c06.xhtml#rc6-fig-0076) Public launch option.


    #### 6.3.3.11 Submission


    The submission tab utilizes the ability to limit who has access to the program
    by creating signal restrictions that affect how many reports can be submitted
    ([Figure 6.77](#c06.xhtml#c6-fig-0077)). Four different settings allow security
    researchers to submit more or fewer reports. For example, a strict signal setting
    would be the best option for a new bug bounty program, especially if the program
    manager doesn’t have much experience with bug bounty programs. However, conversely,
    turning off signal requirements are for the most seasoned of bug bounty programs.
    Usually, choosing the standard signal option is best practice.


    ![Figure 6.77 Submission requirements option.](images/c06f077.png)


    [**Figure 6.77**](#c06.xhtml#rc6-fig-0077) Submission requirements option.


    Additionally, enabling “Human-augmented Signal” will allow HackerOne permission
    to allow analysts from HackerOne to classify all incoming reports. This human
    review could be a good feature to enable as it can assist in preventing spam or
    bad reports. However, the feature should be used with caution. If the report is
    rejected, it will be marked as “Not Applicable” but will not generate a notification
    for the bug bounty program. A lack of a generated notification could potentially
    be bad for a program manager new to bug bounty programs, especially if mistakes
    are made in the flagging process.


    The last part of the submission section allows a forced requirement of two-factor
    authentication and bounty splitting. While there may be legitimate concern for
    some programs, it’s not an absolute necessity to force hackers to have two-factor
    authentication and may actually discourage program participation. Bounty splitting
    is an essential feature if the enterprise can afford to set up prepayment for
    programs. Encouraging hacker collaboration and participation can lead to more
    unique, critical exploits that are presented to the organization.


    #### 6.3.3.12 Message Hackers


    The ability to message hackers is yet another standard feature offered by most
    bug bounty program platforms. HackerOne’s functionality specifically allows program
    managers to select specific groups of security researchers to message ([Figure
    6.78](#c06.xhtml#c6-fig-0078)).


    ![Figure 6.78 Messaging hackers option.](images/c06f078.png)


    [**Figure 6.78**](#c06.xhtml#rc6-fig-0078) Messaging hackers option.


    #### 6.3.3.13 Email Forwarding


    The ability to set up an email address and enable email forwarding allows program
    managers to receive relevant vulnerability reports ([Figure 6.79](#c06.xhtml#c6-fig-0079)).
    Enabling this functionality is helpful in the event that an enterprise wants to
    keep its bug bounty program somewhat private. Providing a good forwarding email
    on a security page or security.txt could prove useful. Programs will receive these
    emails in the HackerOne inbox. However, one should note that this could create
    spam too. Therefore, a dedicated email for the HackerOne program is recommended.


    ![Figure 6.79 Email forwarding function.](images/c06f079.png)


    [**Figure 6.79**](#c06.xhtml#rc6-fig-0079) Email forwarding function.


    #### 6.3.3.14 Embedded Submission Form


    First and foremost, the embedded submission form option is only available to enterprises
    that have the Enterprise edition of HackerOne. Unfortunately, this could not be
    tested, because of my product model. However, the form appears to have the same
    functionality that comes with Bugcrowd’s program natively ([Figure 6.80](#c06.xhtml#c6-fig-0080)).
    A program manager can set up and embed the form on a web page for hackers who
    may stumble upon vulnerabilities.


    ![Figure 6.80 Embedded submission configuration.](images/c06f080.png)


    [**Figure 6.80**](#c06.xhtml#rc6-fig-0080) Embedded submission configuration.


    #### 6.3.3.15 Bounties


    Rewarding researchers is the bread and butter of a bug bounty program. Within
    HackerOne’s “Bounties” tab, there are several things that can be done ([Figure
    6.81](#c06.xhtml#c6-fig-0081)). For one, specific monetary reward values can be
    assigned per asset. In addition, custom bounty headings can be made or other rows
    can be inserted. It’s *not* recommended to make up custom criticality ratings,
    as this can be confusing to hackers who have previously utilized the standard
    low/medium/high/critical ratings. The optional description field allows program
    managers to discuss the specifics of rewards and, underneath, a history of bounties
    that were paid out can be seen.


    ![Figure 6.81 Bounties option.](images/c06f081.png)


    [**Figure 6.81**](#c06.xhtml#rc6-fig-0081) Bounties option.


