  trans: "\n详细来说，假设企业有 120 名安全研究人员。如果几周后，人数接近 200 但仍未收到任何报告，可能就是扩大范围的时候了。范围耗尽会让安全研究人员望而却步。过度限制的范围往往也有同样的效果。因此，当项目陷入停滞时，需要在项目管理中运用动态调整。\n\
    \n## 12.5 管理扩范围\n\n适用于建立项目前期考量的那些流程，同样应适用于范围扩展。测试、与团队沟通以及与领导层建立预期，是这一过程的关键环节。在达到基准安全水平之前，项目经理不应尝试制定任何扩展流程。\n\
    \n# 13 公开发布\n\n## 13.1 理解公开项目\n\n归根结底，公开项目是最终状态。大多数正规的漏洞赏金项目都渴望最终向所有人敞开大门。与任何其他扩展激励一样，最大的考量在于做好迎接这一任务的准备。准备不足或过早发布可能导致企业声誉彻底毁灭。公开项目旨在让任何人都有机会进行研究。许多企业可能永远无法达到这一状态，这取决于其项目的规模，但这无疑是大多数人想要达到的最终目标。\n\
    \n## 13.2 “正确”的时机\n\n无论期望如何发布，并没有一个确切的“正确时机”来启动。关键原则是不要启动得太早，以免团队不堪重负。考虑企业是否应该开放项目，远不止是一个简单的“是”或“否”的问题。公开项目意味着始终保持完全透明，即使范围有限，研究人员通常也能发现大量漏洞。考虑公开项目发布的各个方面是绝对必要的：\n\
    \n1.  **员工**：企业是否有足够的员工来管理激励措施（如果变忙的话）？例如，如果应用安全团队有三名员工负责监管数十个高优先级项目，可能就有必要在他们之外建立一个专门的漏洞赏金项目团队。\n\
    \n2.  **分析**：整个项目是否经过了严格测试？在范围扩展中，只需测试新增资产，但在公开发布前，需要进行测试以防止为大量易于识别的漏洞支付赏金。\n\n\
    3.  **团队**：全体团队成员是否支持扩展？每个人是否都清楚自己在流程中的角色，以及所需的工作量和协调程度？\n\n4.  **财务**：企业是否拥有足够灵活的赏金池，以应对大量高影响力漏洞被快速报告的情况？\n\
    \n5.  **统计**：目前项目中有多少黑客？漏洞报告的接收频率如何？在启动公开项目之前，范围是否已扩展过多次？\n\n虽然还有更多方面可以评估，但上述内容强调了一些在如此大规模扩展前应当询问的相关问题。项目经理应花时间诚实地评估，以确保不会因在企业和员工准备好应对工作之前就启动而导致项目失败。\n\
    \n## 13.3 推荐发布方式\n\n托管服务和客户经理的存在自有其理由——要善用它们。有一点是确定的：企业不应公开漏洞赏金项目，直到它能够应对管理 100\
    \ 多名黑客，并为报告量的巨大激增做好准备。管理项目的公开发布需要周密的计划和谨慎的执行，特别是当项目属于知名大公司时。官方建议是**在准备就绪时**发布，而非基于特定指南。虽然拥有\
    \ 100 多名黑客似乎是一个不错的里程碑，但这可能不等同于一个准备就绪的企业漏洞赏金项目。\n\n### 13.3.1 要求\n\n为稳妥起见，项目经理应力求完成所有以下任务：\n\
    \n*   有 100 名活跃黑客参与漏洞赏金项目。\n*   每周收到多份漏洞报告。\n*   分析预算，确保企业能够承担新增成本和相关风险。\n*  \
    \ 向管理层提交充分的扩展计划。\n*   向同事或受管员工解释任何新的工作流预测。\n*   为软件工程师做好发布准备，并通过群发通知告知组织。\n\n\
    确保至少满足上述所有要点。实际上，项目经理可能需要适应变化，并应分析**每一种**可能性。\n\n## 13.4 回滚\n\n之所以要强调所有必要的预防措施，是因为公开项目发布后的回滚并非良好的开端。这会损害安全团队（因为这很尴尬），也会损害软件工程师（取决于发生的问题）。例如，如果公开项目发布后报告量令人应接不暇，项目经理可能最终不得不回滚项目，因为这可能是追赶所有报告进度的唯一途径，尤其是在准备不足或人手不足的情况下。这样做会伤害安全研究人员，并导致他们对报告状态产生大量的不信任和猜疑。最好在公开项目关闭前收集所有已提交的报告，以防止不必要的争议。尽管如此，将项目回滚为私有模式可能是项目经理未做好准备时处理局面的唯一途径。始终要有备选方案。\n\
    \n## 13.5 总结\n\n坦白说，并非每个项目经理都有机会将其项目公开——特别是在持续资金不足和工作过载的情况下。虽然目标始终应该是启动公开项目，但对于没有能力管理此类激励措施的小型资产来说，这可能根本不在计划之内。将项目推向公开状态并不一定是一个非黑即白的硬性要求。在决定之前，先试探一下将项目公开的想法，并维持一段时间有效的私有项目。\n\
