  trans: "\n创建漏洞赏金计划可能会让人感到复杂，虽然有许多计划管理平台可供选择，但它们大多提供相似的功能。总体而言，本文以 Bugcrowd 和 HackerOne\
    \ 为例，两者各有独特的管理风格和方法论。在我看来，Bugcrowd 在整体易用性、设置和计划管理分割方面表现更佳，而 HackerOne 则拥有更多自动化、过滤功能，以及针对超大型计划的特性。尽管如此，计划管理人员仍应研究所有选项，因为功能会定期发生变化。\n\
    \n# 第 4 部分：漏洞报告与披露\n\n# 第 7 章：分流与漏洞管理\n\n## 7.1 理解分流\n\n分流是审查漏洞并确定报告是否值得在接收流程中采取进一步行动的行为。\n\
    \n1.  **确定资产是否在范围内。**\n    如果不在范围内，请评估漏洞的严重性。如果不是严重漏洞，则确定该漏洞是否将被分流。在大多数情况下，即使漏洞被视为超出范围，计划管理人员也会希望对严重漏洞进行分流。\n\
    \n2.  **分析报告。**\n    这包括尝试查看提交的概念验证是否有效、确定严重性等。\n\n3.  **请求补充信息。**\n    一般来说，除非漏洞符合计划描述中范围内部分规定的所有标准，否则计划管理人员不应对其进行分流。\n\
    \    确保对提供的任何可疑信息进行澄清，通常涉及漏洞验证方面。漏洞的严重性以及其他细节认定，在后续的解决过程中也可以更改。\n\n4.  **对漏洞进行分流。**\n\
    \n### 7.1.1 验证\n\n漏洞验证过程应审慎处理，尊重生产环境、研究真实性和计划定义。虽然这听起来很复杂，但其含义是确保漏洞处理方式不会损害任何当前的生产流程，并投入足够的时间和精力来验证漏洞。\n\
    \n除了确保在验证过程中迅速处理研究人员的报告外，计划方还必须对验证保持审慎——这既是为了在沟通流程中保护自身，也是为了防范财务操纵。\n\n### 7.1.2\
    \ 经验教训\n\n未能验证和理解漏洞可能会给组织带来毁灭性打击。影响可能包括金钱损失、软件工程团队的不信任以及整体声誉受损。最好花一点时间进行有价值的评估，确定漏洞的真实影响，然后再迅速对其进行分流。值得注意的是，如果对漏洞影响存在误解，或出现任何奇怪的验证异常迹象，与同行协调从来都无妨。此外，分流评估阶段是向研究人员索要更多信息的绝佳时机。漏洞赏金计划管理人员必须在必要时善用补充信息收集。\n\
    \n### 7.1.3 漏洞失误\n\n当发生漏洞失误时，计划管理人员有责任承认错误。因失误与安全研究人员对质，或提出任何试图追回赏金的请求或威胁，均属越界行为。归根结底，计划未验证漏洞并非研究人员的过错。事实上，我们都是人，分流人员、计划管理人员和研究人员全都犯错并非不可能。成长的一部分在于接受问题，并在领导层询问时保持透明。\n\
    \n计划有很大的改进空间。即使是应用安全领域的专家也知道，不可能事事皆知。安全是动态的，也是团队协作的结果。防止错误再次发生的最佳方法之一，是确保保留了事故记录。失误不是世界末日，但如果不接受错误的责任，就很难知道未来该避免什么。\n\
    \n除了自我问责，研究人员也有可能自我反省并主动告知计划方错误。尽管这种概率显著较低，但切勿接受任何形式的退款，并感谢他们的诚实。任何人都不应因善意犯下的错误而受到惩罚。\n\
    \n### 7.1.4 托管服务\n\n托管服务在第 3 章中有所讨论。不可否认，对于广泛的计划而言，使用托管服务是必不可少的组成部分。然而，如果企业的计划管理人员允许漏洞赏金平台进行分流，漏洞分流流程将呈现何种面貌？当计划因其他网络安全激励措施而陷入泥沼时，拥有一支专业团队将产生天壤之别，让专人验证漏洞并给研究人员吃定心丸，其价值无法估量。\n\
    \n在许多情况下，计划管理人员早上醒来登录后，会发现漏洞已被妥善分流，分流团队已行使自由裁量权清理了研究人员的报告，以便计划管理人员能够充分且快速地复现。可以说，托管服务甚至有助于减少报告流程中的摩擦。大大小小的企业都能从中以多种方式受益。例如，大型计划可能需要通过托管服务获得专门的分流团队，因为替代方案可能是以高得多的费率雇佣员工来管理计划，而非使用漏洞赏金平台的服务。或者，可以减少分流流程的招聘人数，让现有计划管理人员扩展计划，专注于报告流程的验证部分。小型计划通常可以避免使用托管服务，但可以说，复杂漏洞验证的低成本和高价值可以帮助小型企业在不花费太多时间陷入分流循环的情况下扩充安全团队。\n\
    \n尽管如此，无论计划是否包含托管服务，都必须执行相同的验证目标。我们都难免犯错。如果分流验证了漏洞并将其分配给计划进行解决，请重新验证并确保其符合范围标准。\n\
    \n### 7.1.5 自助服务\n\n从报告到结束管理自己的流程并非不可能或不切实际。当企业选择这样做时，可以肯定地说，报告的分流和验证部分几乎可以合并。然而，计划管理人员应意识到区分分流/验证与影响评估的重要性。除非计划管理人员绝对确定这是一个漏洞且毫无疑问，否则不应自动对漏洞进行分流。如果漏洞可以等待，分流应始终优先审视，因为第二意见是更安全的选择。\n\
    \n## 7.2 漏洞管理\n\n整个报告管理流程需要相当多的准备和理解，才能将笨拙的流程转变为顺畅的工作流。尽管流程的每个方面都很重要，但整体漏洞管理部分是企业最关心的部分——这正是计划存在的根本原因。尽量不要对漏洞管理流程抱有消极心态或感到压力。应用安全工程师通常能更有效地处理漏洞赏金计划，因为他们拥有软件开发生命周期（SDLC）的经验，但实事求是地说，任何网络安全工程师只要具备正确的组织架构设置，都能管理这一流程。\n\
    \n### 7.2.1 漏洞优先级\n"
