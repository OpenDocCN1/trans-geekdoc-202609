    [**Figure 11.11**](#c11.xhtml#rc11-fig-0011) nmapAutomator Performing Full Scan
    of Asset.


    ![Figure 11.12 nmapAutomator Results.](images/c11f012.png)


    [**Figure 11.12**](#c11.xhtml#rc11-fig-0012) nmapAutomator Results.


    ### 11.4.2 Sn1per


    Created by 1N3, Sn1per is yet another automated vulnerability scanning tool. A
    free version of Sn1per can be downloaded from GitHub. However, a professional
    version that allows a graphical user interface (GUI) view and workspace management
    is available. The free version can be utilized efficiently. Once the tool is downloaded
    and configured per the instructions, a program manager can take a URL for a domain
    and begin testing against it. Sn1per has a lot of modes. However, a good start
    would be the utilization of the “normal” mode.


    Once downloaded, it’s as easy as utilizing the command: **sniper -t** [https://example.com](https://example.com).


    The tool will then attempt to utilize a wide variety of enumeration tools on the
    domain for both web application and network penetration testing. Be warned: if
    not specified, the tool may attempt various exploits which could be detrimental
    to the production environment; it’s essential to be prepared for this instance.
    (See ures [11.13](#c11.xhtml#c11-fig-0013) and [11.14](#c11.xhtml#c11-fig-0014).)


    ![Figure 11.13 Sn1per Running Metasploit Modules.](images/c11f013.png)


    [**Figure 11.13**](#c11.xhtml#rc11-fig-0013) Sn1per Running Metasploit Modules.


    ![Figure 11.14 Sn1per Running Nmap Scripts.](images/c11f014.png)


    [**Figure 11.14**](#c11.xhtml#rc11-fig-0014) Sn1per Running Nmap Scripts.


    ### 11.4.3 Owasp Zap


    In the suite of free DAST (dynamic application security tools) is OWASP ZAP. This
    tool focuses on the aspects of web application testing, and will evaluate URLs
    or parameters for a wide range of vulnerabilities. ZAP comes with most penetration
    testing toolkits, including Kali Linux and Parrot. Alternatively, the professional
    version of Burp Suite has a decent DAST scanner. However, not every program manager
    will have access to the funds to purchase a license.


    Scanning is fairly easy: once the tool is loaded a program manager can input a
    URL in the “URL to Attack” field. At this point, it’s as easy as pressing “Attack.”
    However, in more realistic scenarios or depending on an enterprise’s needs, the
    configurations may need to be modified. There are plenty of open-source guides
    that explain the many things that ZAP can perform when configured for advanced
    usage.


