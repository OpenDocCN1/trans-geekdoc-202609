- raw: 'Overall, any platform will have its advantages and disadvantages, but a good
    start will be to look for a crowdsourcing vendor that rewards security researchers
    and fairly mediates issues between programs and researchers. While it may seem
    advantageous to choose a platform that favors an enterprise’s decision on a vulnerability,
    it’s not. Be sure to be on the lookout for solutions that have a bad reputation
    with the bug bounty hunting community. If researchers avoid the platform, it will
    not be beneficial for you to use the platform. The last thing an enterprise should
    want is to receive a poor reputation among the information security community.
    Program mismanagement can start with a poor platform choice, and the best way
    to approach a vulnerability disclosure program is starting off with a leg up.


    ## 3.7 Platform Pricing and Services


    As discussed in Section 3.5, program establishment starts with paying fees for
    the platform itself. While it is impossible to discuss the granularity of platform
    pricing, the typical scenario is one in which an enterprise is charged based on
    its size. A crowdsourcing platform will bridge the gap between security research
    management and responsible disclosure. A typical deployment involves no infrastructure.
    Therefore, associated costs will typically be calculated on a standard basis.
    Comparably, managed services will initiate recurring fees, and on-demand penetration
    testing services will require fixed-cost fees, depending on services rendered,
    and so on.


    In addition to the recurring annual contracting fees, a program manager must consider
    the buffer room that must be allocated for a bounty pool. A bounty pool is an
    allocated amount of money that is committed to paying hackers. Think of it like
    a prepaid card. An engineer will validate a vulnerability and, if appropriate,
    triage and assess impact. If the program deems the submission valid, the engineer
    responsible for managing the vulnerabilities will award the security researcher
    money, which will be rewarded from the bounty pool.


    It’s important to note that even though the bounty pool seems simple it usually
    has associated fees. For example, a platform provider might require that the enterprise
    pay an “x” percent surcharge to the crowdsourcing platform on top of any bounty.
    When establishing a bug bounty program, it’s important to account for any fees
    that might occur on top of bounties and any additional services.


    ## 3.8 Managed Services


    Understanding the necessity for an initial period of managed services requires
    first knowing what managed services do. Every security research crowdsourcing
    platform is going to have a different model for the specifics of the services,
    but at a high level.


    Managed services typically include the initial triage of any vulnerabilities that
    are reported, inviting hackers to the enterprise’s program, communicating recommendations
    and evaluating program analytics, and helping assist in collaboration between
    the enterprise and the security researcher. Enterprises that are on a budget may
    opt to avoid purchasing any form of advanced managed services (depending on the
    platform provider) even from the start, but it’s in the best interests of the
    engineers, or management establishing the program, to use all managed services
    functionality, at least for a little while. Over time, program managers can downgrade
    to a model that uses hand-holding techniques less.


    Bug bounty programs are not overly complicated, yet many companies fail to effectively
    manage the workflow and processes that are involved in programs. Managed services
    can help warm a team up to the various program requirements and best practices
    before dumping engineers or management into the unknown. As another consideration,
    most managed service programs will validate vulnerabilities prior to passing them
    on to the enterprise, helping introduce engineers to new concepts and validation
    methodologies.


    During the establishment of a program, there may be a point in time in which the
    option to add-on managed services is discussed. There may be a preliminary warm-up
    period where the platform provider includes these services for free, or it might
    be an accrued cost from the start, but keep in mind that advanced managed services
    don’t have to be purchased at all or maintained past a given contract period unless
    otherwise stated.


    ## 3.9 Opting Out of Managed Services


    Based on experience, the best recommendation would be to never fully opt out of
    the advanced managed services, unless there’s a reason such as poor service or
    small value from additional managed services add-ons (and depending on the provider,
    it may not be possible). A reduction from fully managed services to something
    more partial such as baseline triaging services would be the wisest move with
    time.


    Advanced managed services is a best practice to ensure that the program receives
    analytics and feedback to progress, which isn’t usually provided in a standard
    baseline model. Noting that it’s a best practice and not a requirement is an important
    difference because the enterprise setting up a program may be able to completely
    validate, triage, and remediate vulnerabilities without any third-party involvement.
    If the organization setting up the program has the capacity to reduce the provided
    options and move to a baseline level of managed services without negatively impacting
    reputation or tarnishing a security researcher’s work, by all means, use best
    judgment.


    In addition, it’s not usually possible to fully opt out of managed services. If
    a program manager had the ability to do so, they could neglect a program.


    ## 3.10 On-demand Penetration Tests


    Many security research crowdsourcing platforms offer on-demand penetration tests.
    The penetration tests offered by these platforms are similar to traditional testing
    methodology in the sense that there are typically findings that are presented
    and remediation methodology. The best way to think of crowdsourced penetration
    testers are as expert bug bounty hunters. The researchers assigned to the penetration
    test will likely find a decent amount of client and server side exploits.


    There’s no question that one might wonder about the efficiency of purchasing an
    application penetration test. In terms of compliance, there isn’t adequate evidence
    to believe that purchasing a dedicated test is any more efficient than running
    a program. A bug bounty program is an ongoing incentive: the enterprise running
    this program is consistently being tested on. However, the program itself cannot
    fulfill the compliance requirements for penetration testing criteria as it’s impossible
    to have full oversight being tested by the researchers participating in your program.
    Instead, hire a third-party penetration testing company and put applications in
    scope for testing. An enterprise can bundle together the network and application
    assets to maximize the money spent on testing, especially if the budget is particularly
    tight.'
  fmt: '

    总体而言，任何平台都有其优缺点，但一个好的起点是寻找一个奖励安全研究人员、并在项目与研究人员之间公平调解问题的众包供应商。虽然选择一个有利于企业在漏洞判定上占优势的平台似乎有利，实则不然。务必留意在漏洞赏金猎人社区中声誉不佳的解决方案。如果研究人员避开该平台，对你使用该平台将毫无益处。企业最不希望的就是在信息安全社区中获得不良声誉。项目管理不善可能始于错误的平台选择，而开展漏洞披露项目的最佳方式是从一开始就占据优势。


    ## 3.7 平台定价与服务


    正如第 3.5 节所述，项目建立始于支付平台费用。虽然无法详细讨论平台定价的颗粒度，但典型场景是根据企业规模收费。众包平台将填补安全研究管理与负责任披露之间的空白。典型部署无需基础设施，因此相关成本通常按标准基础计算。相对而言，托管服务将产生经常性费用，按需渗透测试服务则根据提供的服务收取固定费用，依此类推。


    除了经常性的年度合同费用，项目经理还必须考虑为赏金池分配的缓冲资金。赏金池是承诺用于支付黑客的资金数额，可将其视为预付卡。工程师将验证漏洞，并在适当情况下进行分流和影响评估。如果项目认定提交有效，负责管理漏洞的工程师将奖励安全研究人员资金，该资金将从赏金池中支付。


    值得注意的是，尽管赏金池看似简单，但通常伴随相关费用。例如，平台提供商可能要求企业在赏金之外，向众包平台支付“x”百分比的附加费。建立漏洞赏金项目时，必须核算赏金之上可能产生的任何费用及任何额外服务费用。


    ## 3.8 托管服务


    理解初期托管服务必要性的前提是了解其职能。每个安全研究众包平台的服务细节模式各异，但从宏观层面来看：


    托管服务通常包括对报告漏洞的初步分流、邀请黑客参与企业项目、沟通建议与评估项目分析，以及协助企业与安全研究人员协作。预算有限的企业可能选择从一开始就不购买任何形式的高级托管服务（视平台提供商而定），但对于建立项目的工程师或管理层而言，至少初期使用所有托管服务功能符合其最佳利益。随着时间的推移，项目经理可降级为使用较少“手把手”指导技术的模式。


    漏洞赏金项目并不过于复杂，但许多公司未能有效管理其中涉及的工作流和流程。托管服务可帮助团队在正式投入未知领域前，预热适应各项项目要求和最佳实践。作为另一考量，大多数托管服务项目会在将漏洞传递给企业前先行验证，帮助工程师接触新概念和验证方法。


    项目建立期间，可能会讨论添加托管服务的选项。可能存在平台提供商免费包含这些服务的预热期，也可能从一开始就产生累积成本，但请记住，除非另有规定，否则高级托管服务无需完全购买，也不必在给定合同期后维持。


    ## 3.9 选择退出托管服务


    基于经验，最佳建议是除非有理由（如服务差劲或额外托管服务附加组件价值微小，且视提供商而定可能无法退出），否则切勿完全退出高级托管服务。随着时间的推移，从完全托管服务减少到基础分流服务等部分托管服务，将是最明智的举措。


    高级托管服务是确保项目获得分析与反馈以推进发展的最佳实践，而标准基础模型通常不提供这些。注意“最佳实践”与“强制要求”的区别很重要，因为建立项目的企业可能完全有能力在无第三方介入的情况下验证、分流和修复漏洞。如果建立项目的组织有能力在不损害声誉或玷污安全研究人员工作成果的前提下，减少提供选项并转向基础级托管服务，请务必运用最佳判断。


    此外，通常无法完全退出托管服务。如果项目经理有能力完全退出，他们可能会忽视项目。


    ## 3.10 按需渗透测试


    许多安全研究众包平台提供按需渗透测试。这些平台提供的渗透测试在通常呈现发现结果和修复方法方面，与传统测试方法相似。最好将众包渗透测试人员视为专家级漏洞赏金猎人。分配给渗透测试的研究人员很可能会发现相当数量的客户端和服务端漏洞利用。


    毫无疑问，有人会质疑购买应用渗透测试的效率。就合规性而言，没有充分证据表明购买专项测试比运行项目更高效。漏洞赏金项目是一项持续激励：运行该项目的企业将持续接受测试。然而，项目本身无法满足渗透测试合规标准，因为无法对参与你项目的研究人员进行全面监督测试。相反，应聘请第三方渗透测试公司，将应用纳入测试范围。企业可将网络和应用资产捆绑在一起，以最大化测试资金的使用效率，尤其是在预算特别紧张时。

    '
