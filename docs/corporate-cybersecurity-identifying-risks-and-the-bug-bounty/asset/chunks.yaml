- raw: "Overall, an application penetration test offered through a crowdsourcing program\
    \ isn’t necessarily required. As a note, if the enterprise has enough money to\
    \ perform a wide array of testing, it wouldn’t hurt to purchase the services.\
    \ Before the services are purchased, ensure that the bug bounty program is ready\
    \ to be tested on. In order to determine readiness, the program should be actively\
    \ receiving bugs for at least a year and have had some major vulnerabilities reported.\
    \ It wouldn’t be recommended to start this testing until the program is major\
    \ enough to timely resolve any reported bugs. If a junior program uses a penetration\
    \ testing service as described, it could end up being a waste of money – especially\
    \ if the software development lifecycle isn’t using the best possible application\
    \ security processes. As described previously, if the objective is to establish\
    \ a thorough and respectable program, it wouldn’t make much sense to throw an\
    \ enterprise into an arena that the program isn’t currently prepared for.\n\n\
    # Part 3   \n\nProgram Setup\n\n# 4   \n\nDefining Program Scope and Bounties\n\
    \n## 4.1 What Is a Bounty?\n\nSimply put, a bounty is a reward paid to a security\
    \ researcher. Bounty programs establish a way for a researcher to disclose bugs\
    \ of impact to organizations. The enterprise has the ability to define various\
    \ reward tiers to encourage participation.\n\nBounties should never be viewed\
    \ as paying for exploitation, but for adequate and detailed vulnerability research.\n\
    \n## 4.2 Understanding Scope\n\nScope can be a confusing topic for some engineers.\
    \ Historically, scope has been a means of defining what researchers are allowed\
    \ to target. Scope can be tricky in the sense that anything not defined as “out\
    \ of scope” can be fair game to a researcher. When engineers imagine “fair game,”\
    \ they may envision assets, yet, realistically it can also pertain to methodology\
    \ used by security researchers. Imagine this: a researcher finds a program, and\
    \ there’s nothing in the out-of-scope definitions that state brute force attacks\
    \ (i.e. attempts to submit many passwords or passphrases in the hope of eventually\
    \ guessing the correct combination) as being out of scope. A researcher now has\
    \ unlimited time to run through enumerated usernames and test for account takeover.\
    \ As a secondary consideration, they may negatively impact the application. The\
    \ researcher spends a couple of days attempting “credential stuffing” against\
    \ an application login portal and now gains unauthenticated access to an account.\
    \ The enterprise must now pay this attacker for a high or critical payout depending\
    \ on the program definitions. It’s qualified as a full account takeover.\n\nA\
    \ scenario such as the one provided above could have been completely avoided if\
    \ the engineer setting up the program understood the applications, attack methodologies,\
    \ and so on.\n\n## 4.3 How to Create Scope\n\nMany engineers approach scope with\
    \ the idea of limiting the attack surface for a researcher. Limiting the attack\
    \ surface for a researcher is absurd, and the complete reverse methodology that\
    \ should be used for increasing the security of enterprise application development.\
    \ Instead, a better approach is to start with a smaller amount of assets and work\
    \ up to a larger attack surface when reports start to dwindle.\n\nFor example,\
    \ compare two models of scope and notice subtle changes to the web testing portion\
    \ of the scope.\n\n### 4.3.1 Models\n\nModel A (1st Month of Program Setup):\n\
    \n*In-Scope*\n\nWeb:\n\n1.  [https://example.com/login](https://example.com/login)\n\
    \n2.  [https://example.com/policies](https://example.com/policies)\n\n3.  [https://example.com/legal](https://example.com/legal)\n\
    \n4.  [https://dev.example.com/about-us](https://dev.example.com/about-us)\n\n\
    5.  [https://dev.example.com/login](https://dev.example.com/login)\n\n6.  [https://dev.example.com/profile](https://dev.example.com/profile)\n\
    \n7.  [https://dev.example.com/customer/support-services](https://dev.example.com/customer/support-services)\n\
    \nModel B (6th Month of Program Setup):\n\n*In-Scope*\n\nWeb:\n\n1.  [https://example.com](https://example.com)\\\
    *\n\n2.  [https://dev.example.com](https://dev.example.com)\\*\n\n3.  [https://staging.example.com/join](https://staging.example.com/join)\n\
    \n4.  [https://staging.example.com/about-us](https://staging.example.com/about-us)\n\
    \n5.  [https://testing.example.com](https://testing.example.com)\n\nWhile comparing\
    \ both models A and B, it’s easy to see that staging and testing were added to\
    \ the web scope (subdomains), but why are fewer assets listed overall? Both the\
    \ [example.com](http://example.com) and the [dev.example.com](http://dev.example.com)\
    \ subdomains now have wildcards. It’s standard to eventually use wildcards where\
    \ possible.\n\n## 4.4 Understanding Wildcards\n\nWildcards are fairly simple to\
    \ understand. They are a means of allowing for a wider attacker surface. A wildcard\
    \ can help a program identify more vulnerabilities, and give a security researcher\
    \ more flexibility to stick to an enterprise’s program and get to know it and\
    \ want to test on the program. One of the biggest complaints that researchers\
    \ will touch on is the lack of wildcards in a program. Some researchers will not\
    \ participate in any programs that don’t use wildcards because they don’t have\
    \ the breadth that a researcher is looking for.\n\nWhen thinking about wildcards,\
    \ there are several methodologies:\n\n*   Subdomain: \\*.example.com\n\n*   Domain:\
    \ [example.com/](http://example.com)\\*\n\n*   Specific Domain Path: [example.com/login/](http://example.com/login/)\\\
    *\n\n*   Subdomain Path: [dev.example.com/](http://dev.example.com/)\\*\n\n###\
    \ 4.4.1 Subdomain\n\nSimply, a program that sets a wildcard domain is using the\
    \ most permissive scenario possible. Imagine, for instance, that [example.com](http://example.com)\
    \ has subdomains such as [mail.example.com](http://mail.example.com), [app.example.com](http://app.example.com),\
    \ [dev.example.com](http://dev.example.com), etc.; a security researcher can test\
    \ any of these subdomains, on any URL path. An important consideration to be made\
    \ before allowing a wildcard in the subdomain slot of a domain is whether the\
    \ engineers who are managing the program have done their due diligence and evaluated\
    \ all of the subdomains or not. It would be a poor decision to allow a subdomain\
    \ wildcard if the full attack surface weren’t evaluated.\n\nDoes this example\
    \ seem unrealistic? It can and has happened. An engineer has to ensure that the\
    \ subdomains in scope are being evaluated just as the main domain of the web application\
    \ is. There are a plethora of attacks that can impact subdomain and turn critical\
    \ if unchecked.\n\n### 4.4.2 Domain\n\nWildcard use on domains is typically the\
    \ in-between scope option for bug bounty programs. A researcher who tests against\
    \ a basic domain wildcard can perform research on the entire domain, but any identified\
    \ subdomains would not be in scope unless otherwise stated. As explained earlier,\
    \ it would not be advisable to use a domain or subdomain wildcard without knowing\
    \ all paths or assets that could be tested.\n\n### 4.4.3 Specific Domain Path\
    \ or Specific Subdomain Path\n\nUnless there’s a wide range of URLs involved,\
    \ a specific path asset set as in scope typically maintains the least permissive\
    \ testing posture. Programs that are just being established can get the feel for\
    \ bug bounty programs by using this model and setting certain domain paths as\
    \ in scope. The more critical paths, such as /login or/checkout, are a necessity\
    \ to test against because malicious hackers will attempt to exploit any low-hanging\
    \ fruit that may be exposed on these paths.\n\n## 4.5 Determining Asset Allocation"
