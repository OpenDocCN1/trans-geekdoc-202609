    ## 3. Scenario: Disrespect


    On a Friday, a security researcher identifies a critical remote code execution
    vulnerability. Shanice gathers all of the information, and immediately reports
    it to her manager, who also informs the chief information security officer. The
    affected team, the API development team, only has two employees (a manager and
    Jaycee, the principal software engineer). Shanice reaches out to Jaycee about
    the vulnerability and is ignored for several hours. After finally touching base
    with the engineer, Jaycee responds and states she doesn’t believe the vulnerability
    really matters, and that she has higher priorities. Shanice explains why it matters,
    in a professional manner, and Jaycee escalates – stating that she has better things
    to do than deal with this and she can wait until Monday morning. Quickly, Shanice
    tries to refute this, but Jaycee stops responding. Jaycee’s manager catches wind
    of the situation and tries to work it out with Shanice, but ultimately agrees
    that the team doesn’t believe it matters and that the team’s workflow is already
    heavy.


    **Analysis:** In this situation, Shanice approached the scenario correctly from
    a professional perspective, but could use a bit of guidance on proper escalation
    procedures. Explaining the criticality and why a vulnerability matters to software
    engineers is an essential skill that all program managers must acquire. However,
    this scenario seems particularly heated, at least from Shanice’s perspective.
    When a scenario becomes negative enough that a software engineer believes they
    can say no and ignore the security team, a program manager should immediately
    escalate to leadership. When a vulnerability is critical enough, program managers
    should put reservations of escalation aside and think about the security of the
    enterprise. Failure to remediate quickly could be enough for an organization to
    fail to protect user data, infrastructure or other key components of the organization.


    ### 9.5.3 Summary


    The scenarios described in the examples are not the only issues that can happen
    in the bug bounty resolution lifecycle. The key takeaway is understanding that
    program managers must appropriately use critical thinking to adequately think
    on their feet and resolve issues in a logical manner. It’s not appropriate to
    unnecessarily escalate issues that can be resolved or ignore issues that should
    clearly be escalated. Maintaining a kind but fair approach is the best way a program
    manager can operate the bug bounty program successfully, throughout the entire
    lifecycle.


    ## 9.6 Continuous Accountability


    Program managers have an obligation to follow up in the vulnerability remediation
    process. Assigning vulnerability tickets to affected teams with no due date, or
    not actually following up with the teams for remediation, is a simple way to burn
    money and tank a bug bounty program. Security researchers will want their issues
    to be resolved, but this cannot happen when teams are not being held accountable.
    Although a close relative of the category of escalation, continuous accountability
    is the full responsibility of the program manager.


    ### 9.6.1 Tracking


    Proper accountability is more or less a matter of ensuring that all of the vulnerabilities
    that have been communicated are tracked from start to finish. It’s highly recommended
    to use the ticketing processes described in [Chapter 7](#c07.xhtml). Technically,
    a program manager can maintain vulnerabilities however they want, but ticketing
    systems such as `Jira` are the preferred methodologies to maintain full oversight
    of any blockers in the vulnerability resolution process.


    ### 9.6.2 Missed Deadlines


    In reality, it would be extremely unfair to assume that a bug bounty program will
    maintain the SLA in every scenario. Even the best program managers can possibly
    miss a deadline, and the same can be said about the top software engineers. Life
    happens, and the vital takeaway piece of information is to remember to stay calm
    in the instance of a missed deadline. A few key steps will prevent a missed deadline
    from turning into a disaster:


    1.  **First and foremost, notify leadership.** Bug bounty programs cannot be effective
    if transparency isn’t maintained. However, don’t notify leadership without a plan,
    and there’s no need to escalate if there’s a fairly good reason for why the deadline
    was missed. For example, if a software engineer did not meet the deadline by a
    day because of something else that went wrong in the production environment, generally
    speaking a program manager would notify leadership of the deadline. However, if,
    for instance, the program manager forgot about a vulnerability and then it was
    two months overdue, transparency with leadership is essential. Being honest is
    of paramount importance.


    2.  **Communicate about the issue.** Maintain communication with the appropriate
    team to resolve the issue. Inform them that it’s overdue and explain the importance
    of fixing the vulnerability.


    3.  **Notify the researcher.** Obviously, letting the researcher know that the
    resolution is in progress is important. However, this is not nearly as important
    as actually fixing the issue or notifying leadership of any blockers in the resolution
    process.


    # 10 Hacker and Program Interaction Essentials


    ## 10.1 Understanding the Hacker


    A program manager should never automatically assume that the hacker holds “x”
    intention. Security research is delicate, but the common misconception is that
    hackers are motivated by money. Many program managers don’t understand the value
    of security research until they’ve been managing a bug bounty program for a while.
    Understanding why a hacker participates isn’t always as simple as it seems.


    ### 10.1.1 Money, Ethics, or Both?


    Hackers’ motivations vary. Some hackers are from countries where the value of
    the US dollar scales exceedingly well with their local currency. Therefore, even
    smaller payouts can work wonders. Researchers that are motivated to work for money
    aren’t necessarily unethical, and shouldn’t be viewed as such – after all, bug
    bounty hunting is a day job for many across the world. Bug bounty program managers
    should consider the possibility that the security researcher reporting the vulnerability
    could rely on it as their primary source of income, and treat all researchers
    as full-time professionals. The suggestion to consider full-time bounty hunters’
    need for money isn’t affirmation to pay for invalid bugs, simply something to
    remember when realizing the amount of power that program managers amass. There’s
    nothing wrong with a security researcher being financially motivated. A program
    manager should not be fearful of a researcher who approaches and immediately asks
    about financial reward. The researcher could mean well, and that most often appears
    to be the case. Always be wary of exploitation attempts, but presumptions of a
    researcher’s bad intentions can be detrimental. Always gather information first.

    '
  trans: '


    ## 3. 场景：不尊重


    周五，一名安全研究人员发现了一个关键的远程代码执行漏洞。Shanice 收集了所有信息，并立即向其经理报告，经理也通知了首席信息安全官。受影响的团队——API
    开发团队——只有两名员工（一名经理和首席软件工程师 Jaycee）。Shanice 就该漏洞联系 Jaycee，却在数小时内未得到回应。最终取得联系后，Jaycee
    回复称她不认为该漏洞真的很重要，且她有更高优先级的任务。Shanice 以专业的方式解释了其重要性，但 Jaycee 升级了矛盾——声称她有更好的事情要做，不愿处理此事，且可以等到周一早上。Shanice
    试图快速反驳，但 Jaycee 停止回复。Jaycee 的经理得知情况后，试图与 Shanice 协商解决，但最终同意该团队认为这不重要，且团队的工作流程已经很繁重。


    **分析：** 在这种情况下，Shanice 从专业角度切入场景的方式是正确的，但在适当的升级程序上仍需一些指导。向软件工程师解释漏洞的严重性及其重要性，是所有项目经理必须掌握的基本技能。然而，从
    Shanice 的角度来看，此场景似乎尤为激烈。当事态恶化到软件工程师认为自己可以拒绝并无视安全团队时，项目经理应立即向领导层升级。当漏洞足够关键时，项目经理应放下对升级的顾虑，转而考虑企业的安全。未能快速修复可能导致组织无法保护用户数据、基础设施或组织的其他关键组件。


    ### 9.5.3 总结


    示例中描述的场景并非漏洞赏金解决生命周期中可能发生的唯一问题。关键在于理解项目经理必须适当运用批判性思维，以便随机应变、合乎逻辑地解决问题。不必要地升级本可解决的问题，或忽视明显应升级的问题，都是不恰当的。在整个生命周期中，保持善意且公正的方法，是项目经理成功运营漏洞赏金计划的最佳途径。


    ## 9.6 持续问责


    项目经理有义务跟进漏洞修复流程。将漏洞工单分配给受影响团队却不设截止日期，或不实际跟进团队的修复情况，是浪费资金并导致漏洞赏金计划失败的捷径。安全研究人员希望他们的问题得到解决，但如果团队不被问责，这永远不会发生。尽管持续问责与升级类别密切相关，但它完全是项目经理的责任。


    ### 9.6.1 跟踪


    适当的问责或多或少关乎确保所有已沟通的漏洞从头到尾都被跟踪。强烈建议使用 第 7 章 中描述的工单流程。从技术上讲，项目经理可以按自己的意愿维护漏洞，但像
    `Jira` 这样的工单系统是保持对漏洞解决过程中任何阻碍因素全面监督的首选方法。


    ### 9.6.2 错过截止日期


    现实中，假设漏洞赏金计划在所有场景下都能遵守 SLA 是极不公平的。即使是最优秀的项目经理也可能错过截止日期，顶尖软件工程师亦然。意外总会发生，关键的启示是：在错过截止日期时，要保持冷静。以下几个关键步骤可防止错过截止日期演变成灾难：


    1.  **首先，通知领导层。** 如果缺乏透明度，漏洞赏金计划就无法有效运行。但是，不要在没有计划的情况下通知领导层；如果有充分理由导致错过截止日期，则无需升级。例如，如果软件工程师因生产环境中的其他故障而延期一天，通常项目经理只需通知领导层截止日期情况即可。但是，如果项目经理忘记了某个漏洞，导致其逾期两个月，则与领导层保持透明至关重要。诚实是重中之重。


    2.  **就问题进行沟通。** 与相关团队保持沟通以解决问题。告知他们已逾期，并解释修复漏洞的重要性。


    3.  **通知研究人员。** 显然，让研究人员知道解决工作正在进行中很重要。然而，这远不如实际修复问题，或向领导层通报解决过程中的任何阻碍因素重要。


    # 10 黑客与项目交互要点


    ## 10.1 了解黑客


    项目经理永远不应自动假设黑客怀有“x”意图。安全研究工作微妙敏感，但普遍的误解是黑客受金钱驱动。许多项目经理在管理漏洞赏金计划一段时间前，都不理解安全研究的价值。理解黑客参与的原因并不总是像表面看起来那么简单。


    ### 10.1.1 金钱、道德，还是两者兼有？


    黑客的动机各不相同。有些黑客来自美元兑其本地货币汇率极高的国家。因此，即使是较小的奖金也能发挥巨大作用。为金钱而工作的研究人员不一定缺乏道德，也不应被如此看待——毕竟，漏洞赏金猎捕是全球许多人的全职工作。漏洞赏金项目经理应考虑到：报告漏洞的安全研究人员可能将其作为主要收入来源，并应将所有研究人员视为全职专业人士。建议考虑全职赏金猎人的经济需求，并非肯定要为无效漏洞付费，只是在意识到项目经理掌握的权力大小时需要记住的一点。安全研究人员以经济利益为动机并没有错。项目经理不应害怕上来就询问经济奖励的研究人员。研究人员可能初衷良好，这似乎最常见。始终警惕利用尝试，但预设研究人员有坏心眼可能有害。始终先收集信息。


    '
