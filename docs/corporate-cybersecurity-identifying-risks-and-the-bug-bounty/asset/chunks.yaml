- raw: 'Future program managers need to understand how to work with what they have.
    When it comes to looking at the different options for programs, it’s important
    to remember that one size doesn’t fit all. One enterprise may run a successful
    public program, while another enterprise struggles to do so. The reason there
    seems to be such a wide variance in appropriate program types is because of the
    enterprise security model, configurations, and level of flexibility that a program
    may or may not have. In the application security space, there’s a lack of understanding
    when addressing program configuration, and a careful review during setup will
    give an enterprise the ability to gather relevant vulnerabilities and manage/resolve
    these issues effectively. Program managers must understand the key differences
    in the setup process for maximum success.


    An enterprise’s bug bounty program is only as good as its reputation. Hackers
    will consistently engage with the program if they feel that it’s representing
    their needs efficiently. As a starting point, program managers will want to review
    all aspects of an established program in place and expand or retract as needed.
    If the enterprise does not have a bug bounty program, the goal to achieve will
    undoubtedly be to create an effective program from the ground-up.


    ## 3.2 Realistic Program Scenarios


    In lieu of explaining program options with bullet points and graphs, read the
    following scenario of an ethical hacker who accidentally discovers a vulnerability,
    and what the approach would look like from their perspective. Then consider how
    to explain each option. By doing so, bug bounty program functionality can be better
    understood.


    A hacker is using their favorite website to buy electronics and other home goods.
    The checkout process appears to be standard. They type in their name, their address,
    email address, and so on. Now it’s time to pay. The hacker enters their card information
    and submits the request to the server. The standard “thank you for your purchase”
    message and confirmation number didn’t appear. Instead, they received an Internal
    Server Error (500).


    At this point, red flags are flying at full mast. What happened, why is the hacker
    receiving this message? A hacker’s curiosity burns with the power of a thousand
    suns. The ethical hacker backpedals, carefully reviewing the checkout process.
    One by one, they decide to test each input field, adding a single quote to the
    end of the information submitted. They’ve now managed to replicate a possible
    SQL (Structured Query Language)injection by adding this single quote to the last
    name field of the checkout form. They save the POST request in a file, feed it
    into SQLMap and test the last name parameter. Within seconds they can now dump
    the entire SQL database and get a reverse shell, accessing every single piece
    of PII (personally identifiable information) on the company’s server. The hacker
    knows that they can take this even further. The hacker’s thoughts are now racing
    at a million miles per second, and their heart is beating uncontrollably fast.
    They quietly contemplate and think to themselves, “I’m not a criminal. I need
    to report this. What if a threat actor decides to exploit this vulnerability with
    malicious intentions?”


    ## 3.3 Ad Hoc Program


    An ad hoc program is a program that may not necessarily be considered organized.
    Many enterprises have a security page where bugs can be reported, or instructions
    for reporting with a security.txt file hosted on the root domain, and others gamble
    on the probability of a hacker performing good faith reporting and contacting
    the company. If the perspective of a security researcher is considered, reporting
    the vulnerability might be difficult and various circumstances may deter a researcher
    from doing so. Primarily, even the most seasoned security researchers fear retaliation,
    and an ad hoc program leaves the floor open for guesswork. Researchers want to
    do the right thing, but hacking without permission is currently taboo and it leaves
    a lot to be desired.


    With a wide variety of unknown enterprise-to-hacker response possibilities, researchers
    might avoid reporting vulnerabilities altogether. Assuming that the researcher
    wants to do the right thing, they will likely first check the website to look
    for a point of contact for the enterprise’s security team. If they don’t find
    anything, they may reach out to the company or security professionals on social
    media websites, or use a contact form on the website. If an enterprise maintains
    a new or underdeveloped security posture, or doesn’t adequately highlight various
    ways to get in contact about security issues, vulnerabilities may never be reported.


    An enterprise may believe that utilizing a spontaneous reporting methodology seems
    useful, even foolproof. Unfortunately, it can be dangerous to assume that security
    researchers will reach the enterprise without any mention of a program. Security
    researchers come in all shapes and sizes, and from all walks of life. Language
    barriers and cultural differences may result in reported research that seems malicious
    or threatening. A company with security professionals that don’t understand proper
    vulnerability management or security research might end up threatening the researcher
    or reporting them out of fear. As a program manager, being aware of the potential
    threats that researchers face during disclosure could be a way to ease the pain
    of reporting.


    In addition to a limited ad hoc reporting configuration preventing adequate communication,
    there are a wide range of vulnerabilities that exist, further complicating the
    situation. For example, a client side misconfiguration versus a server side misconfiguration
    might be managed by two completely separate teams. Additionally, a dedicated team
    to address all client side or server side exploits might be unrealistic. A certain
    block of servers may end up being managed by one team, and another block of servers
    managed by another team, and so on and so forth. Standard enterprise models have
    a lot of applications, servers, components, etc. An enterprise without a dedicated
    bug bounty program may open up the possibility for a lot of communication issues
    and misinterpretation, or a lack of understanding can lead to the researcher disclosing
    to the media, damaging the company’s reputation.


    Company reputation aside, many bugs can be exploited in critical ways that could
    negatively impact revenue, customers, clients, and so on. One communication blunder
    in the research process can result in valuable and legitimate vulnerability findings
    being lost. Visibility through an established program, reluctance, or withdrawal
    of a researcher’s findings may have negative consequences – and ad hoc programs
    do not have adequate mediation because of existing biases, whereas a bug bounty
    platform allows researchers and enterprises to communicate with one another effectively.


    It’s important to note that, while an ad hoc program may not be for every company,
    it doesn’t mean it’s completely ineffective. A smaller company with fewer employees
    or assets may not warrant the need for an organized third-party program. However,
    security engineers should keep that in mind and even still quote the cost of creating
    a third-party bug bounty program. Nonetheless, even if a company decides not to
    establish a program, they should be prepared to respond to, validate, and reward
    ad hoc findings in a way that is concise and fair to researchers. After all, while
    a researcher may not have had permission to test, the vulnerability exists and
    could lead to full-scale exploitation, irrevocably damaging the enterprise’s reputation
    or resulting in great monetary losses. Having an open mind will utilizing an ad
    hoc program is an essential part of doing so.'
