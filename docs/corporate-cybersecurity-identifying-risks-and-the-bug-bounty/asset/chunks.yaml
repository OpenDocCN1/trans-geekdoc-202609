  trans: '


    # 1. 安全研究人员披露未修补的漏洞


    研究人员可能会过于热心，在报告漏洞后立即或在漏洞修补前就公开发布相关信息。虽然该行为本身不构成毒性行为，但要求研究人员删除漏洞信息可能会招致恶毒的反击。如果项目经理感到方便，可以尝试直接联系研究人员。无需涉及法务部门。项目经理应挺身而出，告知法务部门由你来处理此事。与研究人员沟通，询问他们是否愿意在漏洞修补前撰写的文章。如果他们拒绝，不要寻求惩罚他们，而是在内部提升修补该漏洞的优先级。最重要的不是黑客披露了漏洞，而是漏洞本身存在。将其修复。


    # 2. 威胁行为者勒索或披露漏洞


    如果项目经理得知某漏洞在未考虑企业利益的情况下被公开披露，应通知社交媒体经理不要回应，并咨询法务部门后续行动。记录任何利用漏洞的证据，并审查受影响资产的日志。验证漏洞也是此过程不可协商的一部分。然而，如果企业有应急响应团队，应首先且最重要地通知他们，然后再调查数据。不过，*在*联系法务部门，甚至应急响应团队*之前*，请务必确认这确实是一次合法的勒索尝试，而不仅仅是研究人员因缺乏联系而感到愤怒。几乎所有漏洞被披露的情况都可以通过协商解决，大多数威胁源于未被倾听的沮丧黑客。


    # 3. 安全研究人员威胁在 Open Bug Bounty 上披露


    项目经理可能会发现，安全研究人员曾多次尝试联系他们，但可能出现了疏忽。他们可能会通过 Open Bug Bounty 等网站报告漏洞，该网站会在 90 天后（行业标准）强制披露漏洞。项目经理应尝试利用其
    Open Bug Bounty 账户档案中的任何信息联系研究人员。如果未收到回复，项目经理应调查相关资产和漏洞类型，并为披露日期设置提醒，以便查看利用方法论，如果情况严重，尽快解决。如果可能，让研究人员加入漏洞赏金计划并获得报酬是当务之急。鼓励研究是漏洞赏金计划项目经理的使命。通常，通过
    Open Bug Bounty 报告此类事件的发生，是因为漏洞赏金计划对黑客来说过于难以接触。如果项目经理运行私有计划，可能会观察到这种情况。


    # 4. 安全研究人员威胁在社交媒体上披露


    通常，安全研究人员在社交媒体上威胁披露的漏洞，其严重程度远低于威胁行为者的披露。上述情况通常始于研究人员询问是否有人拥有该企业的合同，并在 Twitter、Facebook
    或 LinkedIn 上@他们。如果得不到回复，紧迫性会增加，视研究人员的容忍度而定，他们可能会威胁公开披露，或转向更像威胁行为者的发布模式。项目经理通常可以以较少的谨慎进行回复，就像电子邮件接收流程一样，邀请研究人员加入漏洞赏金计划。如果他们不愿向企业披露漏洞，请意识到这背后可能有正当理由。计划是否支付研究人员足够的报酬？计划是否在研究人员报告后强制其签署保密协议？平均而言，研究人员想要金钱和公开披露。两者都提供，通常会获得更好的回应。如果研究人员拒绝，不要动用法务团队追究他们——而是着力修复被披露的漏洞。有些研究人员无法讲理，但必须以适当的方式与他们沟通，而不是以威胁的方式。


    # 10.7 计划警告消息


    安全研究人员是黑客，好奇心既是他们的救星，也是他们的毁灭。安全研究人员通常坚持匿名，这可能包括使用虚拟专用网络 (VPN)。例如，企业计划范围可能规定：“请勿使用自动化扫描。”一个优秀的企业安全计划会使用
    Web 应用防火墙或其他速率限制和阻断选项，如果安全研究人员决定在测试期间使用真实 IP，尤其是进行扫描时，可能会被迅速封锁。在完美的项目管理世界里，安全研究人员会尊重范围，不使用自动化解决方案。但在现实中，这通常不是问题。然而，在高峰生产期或开发周期中，软件工程师可能会报告大量错误，这种情况可能会发生。如果项目经理没有使用能自动防止此类行为的工具，就必须想出创造性的方法来阻断流量。即使企业拥有工具，发送消息以传达要点也可能是必要的。


    # 10.8 威胁行为者还是安全研究人员？


    坦白说，“是威胁行为者还是安全研究人员？”这个猜谜游戏非常糟糕，让项目经理和任何其他相关团队在精神上精疲力竭。随着时间的推移，漏洞赏金计划尝试创新独特的方法来应对这种情况，例如要求建立特定的
    VPN 连接包才能开始研究，或指示研究人员使用特定的用户代理或标头。不幸的是，这在某些情况下可能有效，但对研究人员开始研究的要求越多，产生的摩擦就越大，参与度可能会下降，或者这些要求可能会被完全忽视。在这种情况下制定剧本（Playbook）有助于快速解决问题，无论是心理备忘还是实体文档。


    首先，询问以下问题：


    1. 问题发生在何处？是否已被遏制？

    2. 是否对生产环境造成影响？如果是，严重程度如何？

    3. 是否需要应急响应团队介入？

    4. 请求是否遵循任何基本模式（IP 地址、标头、请求、URL 路径等）？


    作为一般依据，上述一些问题可用于开始筛选数据并分析差异。以下是两个不同示例及其建议的解决方案。


    情况 #1 看起来像安全研究人员。在这种情况下，模式似乎与过去观察到的行为相符。情况 #2 更像是一个恶意情况，此时联系安全研究人员将是不必要的。上述问题不应被视为应急响应计划，而应作为一种了解项目经理应尝试获取的各类信息的手段，以协助简化流程。


    # 10.9 给研究人员发送消息


    此时，当出现破坏性模式时，发送一条计划消息提醒参与的研究人员不要进行破坏性测试，这无伤大雅。向所有研究人员发送消息的原因是为了避免单独点名特定研究人员。项目经理应避免可能导致进一步问题或打击安全研究人员积极性的可能性。此外，分析可能不正确，毫无根据或错误的指控可能会损害企业声誉。如果使用内部漏洞赏金计划解决方案，根据设置情况，您可能需要使用
    BCC 发送群发邮件。大多数托管漏洞赏金平台解决方案都内置了消息传递功能。


    ## 10.9.1 安全研究人员访谈


