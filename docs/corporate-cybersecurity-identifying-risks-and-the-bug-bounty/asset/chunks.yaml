- raw: 'It’s not recommended to operate a bug bounty program without a safe harbor
    plan.A safe harbor can actually work in the benefit of a program and researcher.
    When security researchers want to be protected, they will look for the safe harbor
    clause, and synonymously programs can use it to protect themselves in a court
    of law if research goes awry.


    ### 5.1.3 Writing Safe Harbor Agreements


    First and foremost, it may be unnecessary to write a handcrafted safe harbor clause.
    As stated previously, many bug bounty platforms give the program manager an option
    to fully integrate a templated safe harbor agreement that would hold up in a court
    of law. In the instance a safe harbor needs to be written, it’s likely because
    the enterprise is running its own program without using a bug bounty platform.


    Here are some tips for writing an effective safe harbor agreement:


    *   Let the researcher know they are expected to respect any hacking laws that
    may be relevant in their country or region.


    *   Ensure that they understand the research must be conducted in good faith and
    that, as long as it’s done in such manner, they are exempt from legal action and
    free to conduct research.


    *   Repeat that the enterprise will not take any negative legal action against
    them if assets that are considered in scope are exploited.


    *   Communicate that accidental violations of the policy which were not intended
    to be malicious are forgiven.


    *   Provide means of contact in the event that the researcher has any questions
    about the safe harbor agreement.


    Generally speaking, the above safe harbor agreement represents a good start –
    although, again, it’s recommended that the program managers use anything templated
    by bug bounty platforms or consult with lawyers when drawing up custom safe harbor
    agreements.


    ## 5.2 Retaliation against a Rogue Researcher (Cybercriminal or Threat/Bad Actor)


    It’s not always easy to make a determination of criminal activity versus criminal
    activity. In a sense, exploitation that may have sounded all of the alarms in
    the past can turn into a daily, weekly, or monthly occurrence. Before starting
    a program, knowing what your usual attack patterns look like is essential to be
    able to separate legitimate individuals from malicious ones. Typically, attack
    patterns can be analyzed via SIEM (security information and event management)
    logs or the web application security firewall, and hopefully at this point a program
    has not been established without these key tools. Identifying legitimate attacks
    versus pseudo-attacks becomes second nature after working on a program for a little
    bit of time – but deciding when to prosecute is a different story.


    The unfortunate part of working in the cybersecurity field is that we may not
    necessarily maintain the ability to prosecute anyone who’s deemed a threat actor.
    Getting legal assistance depends on the structure of the organization and the
    type of attack that has occurred. Every situation may vary, and it will be up
    to the program managers to attempt to figure out the behavior patterns of a threat
    actor.


    For example, a program manager may have had a negative communication with a researcher
    pertaining to a vulnerability that was considered social engineering, and therefore
    out of scope. If the researcher decides they are going to turn into a threat actor,
    all cards are up in the air. The beauty of a bug bounty program is that a situation
    like this provides a good paper trail of evidence in the event that this actor
    decides they want to go rogue. However, in a situation where the vulnerability
    was leaked on the dark web or it was sourced through someone else, it may be harder
    to determine the course of action.


    Generally speaking, one of the best things that can be done when the program is
    feeling threatened by the research is to gather logistical evidence that the researcher
    has gone rogue with their vulnerability. This may include logs, screenshots, the
    report from the bug bounty platform, and proof of exploitation. A transparent
    chain of custody may help expedite the legal process to legal and hopefully bring
    any threats to an actionable state. However, realize that, as a program manager,
    you should be vigilant but not looking to punish researchers. Exercise caution,
    but don’t look for ways to punish legitimate researchers. One wrong move in which
    a security researcher is confused as a threat actor could ruin company reputation.


    Another risk may be the possibility of the researcher leaking the vulnerability
    through social media or other public channels. In an instance like this, a program
    manager should proceed with caution to avoid a witch hunt. A researcher may not
    always be in the right, and even in an instance of a legitimate vulnerability,
    community retaliation can be deadly and attempts to mask the vulnerability can
    result in the Streisand effect. (The Streisand effect is a social phenomenon that
    occurs when an attempt to hide, remove, or censor information has the unintended
    consequence of further publicizing that information.) Nonetheless, use the tools
    that are adequately provided from the enterprise. Consultation with the legal
    team can help prevent a minor mishap from escalating into something that is much
    more serious. Initiating conversations with the legal team should always be used
    as an absolute last resort. Even if the vulnerability did leak on social media,
    a program manager must be willing to accept that these types of events happen.
    Program managers should not default to a thought process of assuming that the
    hacker is malicious, but always try to diffuse and understand the hacker. Is the
    hacker leaking the vulnerability on social media purely because they believe they
    are not getting a fair or swift response? Is the program’s communication good,
    but the hacker wants an absurd amount of money? Be fair. When a program manager
    puts themselves in a hacker’s shoes, it’s easier to have better interactions –
    even if they seem like a threat actor at first.


    It may not always be possible to prevent exploitation, and in a carefully planned
    scenario in which the researcher was not satisfied with the outcome, it can prove
    quite deadly. Therefore, it’s advisable to maintain good communication and keep
    adequate documentation of reported vulnerabilities and pertinent information.


    ## 5.3 Service Level Agreements (SLAs)


    A service level agreement, or SLA, is the enterprise’s promise to a researcher
    to respond to or to fix the reported vulnerability in an adequate amount of time.
    Private bug bounty programs can benefit from providing both report triage times
    and vulnerability patching times. When a program grows, times may need to be shifted,
    or in specific scenarios pulled out altogether. One solid affirmation that can
    be made about the triage or resolution process: no matter whether times are defined
    or not, it’s 100% safe to assume that at some given point a researcher is going
    to ask either when their vulnerability is going to be looked at or when a triaged
    vulnerability will be fixed.


    How does one accurately build a model for resolution or triage times? Most of
    the crowdsourcing platforms will have recommended best practices outlined for
    adequate triage process, especially if the platform is going to be providing managed
    services. However, in the event that the enterprise does not choose to go with
    a managed service model or avoids using a crowdsourced solution altogether, all
    of the possible scenarios should be known.


    It’s difficult to determine what model will be best for a given enterprise. Consider
    the following:


    *   Is the program private or public? If it’s public, set realistic expectations.
    Can every medium vulnerability be resolved by the enterprise in seven days or
    less?'
