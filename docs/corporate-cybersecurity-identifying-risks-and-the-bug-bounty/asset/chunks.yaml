    across all domains of security can use this book to quickly absorb the years of
    information acquired by real world experience to understand the subject and provide
    more value to their team.


    Robert (@rej_ex) Willis


    # Acknowledgments


    There are far too many influential people in my career to mention in this section.
    I’m thankful for all of the information security individuals who have let me learn
    alongside them, given me opportunities, and have put my skills to the test. I’ve
    learned many lessons along the way.

