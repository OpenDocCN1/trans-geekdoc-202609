- raw: 'The final aspect of Bugcrowd is the ability to reconfigure, set up program
    authentication, or fund the program with accounting settings. Program managers
    will have to review and action several of these items, as a bug bounty program
    offers rewards and a pool of money to pull rewards from, which will need to be
    allocated.


    #### 6.2.5.2 Organization Details


    The organization details web page hardly differs from the initial setup. This
    page allows a program manager to upload a new logo for the organization, changing
    the background color or adding a contact number for the program.


    #### 6.2.5.3 Team Members


    The team members page exists on other parts of the program configuration. Therefore,
    the only thing program managers need to know is that this is another route.


    #### 6.2.5.4 Targets


    Program managers setting up their first program have already utilized this page,
    as adding targets was a prerequisite to creating groups for the bug bounty program.


    #### 6.2.5.5 Authentication


    Aspects of authentication are harder to advise on initially, as it will depend
    on the way the enterprise structures their IdP (identity provider) management.
    However, program managers should strive to utilize SSO (single sign-on) where
    available as it is far safer for the enterprise as a whole. Nearly all of the
    modern-day SSO solutions require users to have (two-factor authentication)TFA
    enabled to log in, therefore making a program manager’s experience far safer.
    As an example, Okta is an application that enables the usage of SSO for various
    applications. Program managers should reach out to their IT support team to find
    out which team within the organization manages identity management provisioning.
    There are two aspects of the SSO integration: specific site configuration and
    SAML (Security Assertion Markup Language) settings. The SSO configuration needs
    to be provided to the appropriate team to fill in the required fields for the
    enablement of the solution. In addition, the same team will have to provide the
    program manager with all of the SAML settings for the identity management provider
    to fill in the corresponding fields. Once complete, the authentication settings
    can be saved.


    As seen in [Figure 6.48](#c06.xhtml#c6-fig-0048), the various fields need to be
    completed. If the enterprise does not maintain an SSO solution, the Bugcrowd default
    will be the utilization of a standard enterprise email address in conjunction
    with a password.


    ![Figure 6.48 Single sign-on option.](images/c06f048.png)


    [**Figure 6.48**](#c06.xhtml#rc6-fig-0048) Single sign-on option.


    **Note: domain verification is needed in order to establish SSO within the program,
    so the following “Domains” tab setup should be carefully followed.** <query id="Q2">
    <p>Dear TS, Set as either all bold or highlighted/indented in some way. Please
    do not first line indent. Set as Note paragraph.</p> </query>


    #### 6.2.5.6 Domains


    Verifying any of the domains added to the program is required to enable SSO. To
    complete the verification process, all of the domains can be entered in the textbox
    and the “Add domain” button can be pressed. Once the domain is added, it will
    populate under the “Unverified domains” section and a program manager will have
    to communicate with the enterprise team responsible for managing the DNS (domain
    name server) for the company. Program managers should let the responsible team
    (which may be the network engineering team or similar) know that they need to
    verify all of the domains in order to set up SSO. The unverified domains will
    have a verification code next to them, and the code needs to be added to a TXT
    (text record, which is a resource record in the domain name system \[DNS\] used
    to provide the ability to associate arbitrary text with a host or other name)
    record and hosted on the root domain ([Figure 6.49](#c06.xhtml#c6-fig-0049)).
    It may take 24 hours for it to populate.


    ![Figure 6.49 Unverified domains option.](images/c06f049.png)


    [**Figure 6.49**](#c06.xhtml#rc6-fig-0049) Unverified domains option.


    #### 6.2.5.7 Accounting


    Program managers will utilize the accounting page as a means of allocating a bug
    bounty pool. Bug bounty program managers can transfer funds, deposit funds, or
    see an overall activity or program balance. Without a bounty pool assigned, researchers
    cannot get awarded. Program managers should ensure that this feature is set up
    before continuing.


    As shown in [Figure 6.50](#c06.xhtml#c6-fig-0050), an activity summary is provided,
    including an organizational pool, pending deposits, program allocation, and total
    amount of money spent. Program managers can click on the “Deposit funds” button
    to assign money to their bounty pool.


    ![Figure 6.50 Activity summary.](images/c06f050.png)


    [**Figure 6.50**](#c06.xhtml#rc6-fig-0050) Activity summary.


    When the “Deposit funds” button is clicked, there will be a textbox that asks
    for the destination, and that is where the program manager will select the program
    they would want to assign money to. The program manager can then type the amount
    of money into the textbox, click on the “I agree to terms and conditions for the
    transaction” checkbox, and click on the submit deposit request ([Figure 6.51](#c06.xhtml#c6-fig-0051)).
    The account manager will then send an invoice to the program manager to run through
    to the finance team. Program managers will have to ensure that management is tracking
    expenditures and get it approved through the correct processes. Once Bugcrowd
    approves the pending deposits, the bug bounty pool will be assigned money that
    can be used to reward researchers.


    ![Figure 6.51 Submit deposit request option.](images/c06f051.png)


    [**Figure 6.51**](#c06.xhtml#rc6-fig-0051) Submit deposit request option.


    **Note: program managers should never assume that they have enough money in the
    pool. It is an essential responsibility to ensure that the program manager is
    keeping track of the reward pool at all times.** <query id="Q3"> <p>Dear TS, Set
    as either all bold or highlighted/indented in some way. Please do not first line
    indent. Set as Note paragraph.</p> </query>


    As shown in [Figure 6.52](#c06.xhtml#c6-fig-0052), a program manager can also
    utilize the “Transfer funds” button. Transferring funds allows program managers
    to deposit money from one pool to another when they run multiple programs. The
    transfer funds option is nearly identical to the deposit funds option. The final
    option within the accounting tab is the “Program balances” tab. The program balances
    tab allows program managers to see the bug bounty pool for a multitude of programs.
    For example, some enterprises own multiple companies and may want to segment bug
    bounty programs by company to avoid confusion. When a program manager runs multiple
    bug bounty programs, they should periodically check the program balances tab to
    ensure that all of the programs are funded ([Figure 6.53](#c06.xhtml#c6-fig-0053)).


    ![Figure 6.52 Transfer funds option.](images/c06f052.png)


    [**Figure 6.52**](#c06.xhtml#rc6-fig-0052) Transfer funds option.


    ![Figure 6.53 Program balances option.](images/c06f053.png)


    [**Figure 6.53**](#c06.xhtml#rc6-fig-0053) Program balances option.


    ## 6.3 HackerOne'
