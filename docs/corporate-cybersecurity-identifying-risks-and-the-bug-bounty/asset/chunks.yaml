- raw: 'I understand and I apologize. However, we had noted that there isn’t any sensitive
    information actually being displayed in this vulnerability. Even when logged into
    a user account and clicking on the CSRF that is externally hosted, no sensitive
    information, tokens, or anything that can be used for nefarious purposes was able
    to be retrieved.


    RESEARCHER:


    I think the information is sensitive and that I should be compensated for the
    vulnerability. This is clearly a CSRF vulnerability.


    NICK:


    Yes, this is a CSRF vulnerability but in our program out-of-scope section we highlight
    the following:


    RESEARCHER:


    OK, I took a look and this appears to be true. I’m sorry for reporting this.


    NICK:


    Don’t be sorry! We appreciate your participation, thank you.


    While this was a difficult conversation for Nick to have, it’s important to ensure
    that false positives are deemed as such. Paying for one could be the difference
    between negative interactions in the future, although program managers shouldn’t
    take it to heart in the event of an honest mistake. It may seem unlikely that
    both a triager and program manager fail and pay for a nonissue, but nothing is
    impossible. Keeping false positives in mind and being willing to tell a security
    researcher “no” is a nonnegotiable aspect of bug bounty program management.


    ### 10.2.2 Dealing with a Toxic Hacker


    The time will eventually come when a program manager has to deal with a security
    researcher who has now become toxic or exceedingly difficult to deal with. In
    some cases, the program manager may not have to deal with a negative security
    researcher immediately. The point they decide to cause issues can vary, such as
    before the ticket is addressed, during the vulnerability remediation process,
    or after. Each situation must be handled delicately as there’s a possibility it
    can end up completely working against the enterprise, or the researcher, and neither
    is ideal. How is a toxic interaction defined? Unfortunately, it’s difficult to
    define what “toxic” is, but generally it’s an exceedingly negative interaction
    in which the program manager has no choice but to implement drastic measures to
    resolve the behavior.


    ## 10.3 Managed Program Considerations


    As discussed in [Chapter 3](#c03.xhtml) (Section 3.7), managed programs are an
    excellent way to offset some of the inevitable grief that will be experienced
    from program management. If a security researcher reports a vulnerability and
    it’s not actually an issue, a triager can quickly resolve the issue. In the instance
    a security researcher decides to become toxic, it’s even easier for a bug bounty
    program manager to deal with because they now have the ability to moderate and
    participate at will and are not quite emotionally attached to the situation. Bug
    bounty platform solutions will typically have the means to resolve toxic interactions
    fairly quickly. Here are some general considerations when observing interactions
    between the bug bounty platform triage team and the security researcher:


    1.  Without having to ask, a program manager should be able to determine what
    the dispute is about via reading through the various communications.


    2.  If the dispute is about the legitimacy of a vulnerability, validate the triager’s
    response. For example, a triager may believe that it’s not a vulnerability. However,
    it’s possible that it’s a legitimate issue.


    3.  Determine the toxicity level and gauge the appropriateness of the responses.
    If the triager is too hostile or afraid to speak up, both scenarios have the potential
    to damage future interactions.


    4.  Provide commentary. Don’t be afraid to give the triager more information to
    help them or to correct the course of action the triager is planning on taking.
    Perception is subjective. Therefore, program managers should be willing to express
    an opinion on the matter.


    5.  Intervene where necessary. If the situation appears to be negative to the
    point of no return, if it hasn’t already occurred, inform the triager that it
    would probably be a good idea to remove the researcher from the program. Additionally,
    if misinformation about the state of the enterprise bug bounty program is being
    relayed from the triager, correct it. Starting with a private conversation is
    the best route to avoid any potential of accidentally embarrassing the triager.
    A simple, “I noticed that you said ‘x’ to the researcher and that’s not exactly
    what we do” can be a saving grace for the communications between triage, the enterprise,
    and researchers.


    6.  It’s possible that a triager can verify a vulnerability and then the interaction
    may turn sour with the program manager. In this instance, refer to: “Toxic Interaction
    #2” in Section 10.4 for guidance on resolution, keeping in mind that managed services
    should be brought into the loop before attempting to manage the disrespectful
    behavior with the researcher.


    ## 10.4 In-house Programs


    Toxic interactions can intensify when enterprise bug bounty programs are operated
    without any form of managed service on a dedicated platform. It’s no surprise
    that differences in opinion can occur between a program and a researcher, and
    program managers need to be aware of the various resolution options. With that
    being said, even though programs will ultimately have the final say, understanding
    where the researcher is coming from is part of the equation. However, a program
    should not allow themselves to be run over by a toxic security research who is
    displaying explicit or threatening behavior. As is the situation with false positives,
    dealing with a security researcher and addressing this situation can be difficult.
    In any case, two examples with explanations are provided to help spell out the
    importance of understanding and correctly addressing the situation.


    Overall, the scenarios presented should provide an adequate example of what a
    severely toxic interaction and a more mild one look like. Toxicity is about perception.
    Therefore, a program manager should always prioritize the safety of the enterprise
    and put all feelings aside when dealing with program communication affairs. If
    a program manager reacts adversely because of a negative interaction, it can further
    escalate the problem. Emotional intelligence is a difficult subject to approach
    in program management. Security researchers may not understand why their tone
    sounds threatening and bug bounty program managers must be prepared to deal with
    the possibility of such occurrences. In addition, many security researchers don’t
    operate in English as a native language and some translations may be perceived
    as more hostile than they actually are. Make an effort to understand the researcher’s
    point of view.


    ## 10.5 Blackmail or Possible Threat Actor


    Toxic interactions may be hard to decipher from actual threats and, in the instance
    of a threat actor trying to exploit the enterprise, may lead to a lot of confusion.
    As a general guideline, unsolicited emails that seem exceedingly threatening should
    be forwarded to the legal team immediately for the next course of action. Conversely,
    if the person is asking for money for a bug, cautiously respond and ask if they
    would like to be invited to the bug bounty program. If they respond with a lot
    of hostility in what seems like a possible exploitation attempt, forward to legal
    immediately for further review. All threats should be treated equally, just as
    all emails reporting vulnerabilities that seem legitimate should be reviewed.


    ## 10.6 Public Threats or Disclosure


    The most sensitive situation is when someone threatens the organization publicly.
    There are multiple scenarios that could potentially take place, and program managers
    should be prepared to deal with each one of them – or understand program management
    well enough to adjust to dynamic situations. Here are some of the possible ways
    a program can be at risk:'
