- raw: 'The most dangerous type of vulnerability disclosure program is a public program,
    and dangerous here means, “If risk is poorly assessed prior to launching the program.”
    That’s not to say going public is bad, it’s to understand that being public facing
    can be risky for an enterprise that isn’t ready to take on the inevitable financial
    and psychological burdens this would involve. It shouldn’t come as a surprise
    that a public program will cost the enterprise much more money than any other
    program. Visibility equates to greater hacker participation, which converts to
    vulnerabilities, and in turn the organization is now responsible for paying the
    security researchers for their work.


    An enterprise can easily destroy its reputation in the hacking community if the
    organization’s engineers are not ready to be responsible, or cannot be responsible,
    for managing too many vulnerabilities. Bug bounty program managers tend to look
    at programs through rose-tinted glasses. Unfortunately, a jaded perception of
    application and network strength can result in the destruction of a program that
    has just barely begun. It’s strongly recommended that an enterprise runs a private
    program for a decent amount of time before taking the leap into the public bug
    bounty space.


    There’s not a set requirement for public release, but it’s important to know that
    an organization should never start with a public program. Running a private program
    for a while gives engineers a chance to understand the bug bounty process, sharpen
    their skills, and understand the spectrum of vulnerabilities before plunging into
    a visible world. That’s where more participation increases the risk of scrutiny
    and reputational damage.


    ### 3.5.3 Applied Knowledge #3


    The hacker takes their SQL vulnerability and searches for a way to report it.
    Doing a quick search for a security point of contact, the hacker finds a public
    bug bounty program. Any communicative issues are mitigated and the researcher
    is able to easily report the vulnerability and be rewarded for their efforts.


    When a hacker finds a public program, it’s the best possible situation for the
    researcher to be in. A researcher who can adequately receive a response for their
    efforts is a researcher who is more likely to be cordial and ready to engage with
    the enterprise in a constructive manner.


    #### 3.5.3.1 Hybrid Models


    Mixing multiple models together can easily be the best solution to a complex situation
    in which a private program is considered too limited and a public program is considered
    too visible. The standard model is a program that is private in participation,
    but public-facing. Although private but public-facing sounds confusing, it simply
    means a program that lets security researchers know they have a program, but it’s
    not actively organized on the bug bounty program platform as a public program
    that can be participated in. An enterprise can benefit from utilizing a hybrid
    model as it can help combine the best aspects of bug bounty programs. Even if
    the program is private, program managers *should implement a security.txt file
    under the/.well-known/directory of root domains*.


    *What is a security.txt?* (Thanks to Duncan McAlynn @infosecwar for the reminder.)


    Simply, it is a means of informing security researchers that a bug bounty program
    exists. Imagine if a hacker were to poke around at the web application and accidentally
    stumble upon a vulnerability. They may try to find a security contact at the organization
    and struggle to do so, which can further complicate the situation. Hackers typically
    start with fuzzing web applications, and even if the hacker misses the/.well-known/directory
    while fuzzing, a seasoned researcher is certain to check for a security.txt file
    manually if they need to report a vulnerability. To understand the best implementation
    of a security.txt file, please visit: [https://securitytxt.org](https://securitytxt.org)
    .


    ## 3.6 Crowdsourced Platforms


    There are multiple bug bounty platform providers to choose from, but it would
    be a mistake to make a specific recommendation. The key companies that provided
    bug bounty platform setup and management are Bugcrowd, HackerOne, Integriti, and
    Synack. Program managers should decide for themselves based on pricing, configuration
    models, and the other range of functionality options. At the end of the day, application
    security engineers and their managers need to ensure that a consistent evaluation
    of their program provider is occurring. Engineers are hired to do a job: build,
    fix, configure, and innovate – and, as with any other engineering tool, crowdsourcing
    platforms should be evaluated regularly to enable effective management processes.


    The process of identifying an adequate crowdsourcing platform to use is simple:
    set aside a quarter (roughly three months) to evaluate options. Set aside another
    quarter in the year to proceed with all of the logistics, a quick proof of concept,
    and set a date for implementation. Researching and implementing the platform does
    not include the pre-risk assessments and vulnerability analysis that should occur
    prior to expanding the enterprise security model. Asking the right questions of
    platform providers requires a neutral mindset. An application security engineer
    or general cybersecurity engineer has typically dealt with vendor comparisons.
    With that being said, there are several suggestions for process improvement, especially
    when dealing with platform evaluation:


    *   **Ensure the platform is accredited by hackers as well as engineers:** avoid
    negative speculation from hackers who haven’t been rewarded for bugs to their
    satisfaction. Research can be conducted on most platforms and by gathering various
    opinions from engineers and hackers. Additionally, be open minded, as everyone
    is entitled to their own unique perspective.


    *   **Without prejudgment, schedule meetings with sales representatives from multiple
    companies:** if you’re working within a strict budget, inform them.


    *   **Pricing is nearly always an issue, keep in mind that every part of a platform
    and extended feature is going to accrue an additional cost:** while evaluating
    platforms, remember that managed triage services, on-demand penetration tests,
    and bug bounty payouts aren’t typically included in standard program deployment.


    *   **Ask difficult questions, be sure to interject:** remember, if sales representatives
    have the chance, they will attempt to get through their entire presentation uninterrupted,
    glossing over the finer details. It’s the enterprise’s responsibility to evaluate
    the features being promised and consider what’s realistic.


    *   **Don’t offload technical work on a sales representative:** it’s not their
    job to ensure that “x” feature will work with your enterprise model. Instead,
    formulate an exact question and ask to get in touch with a technical account manager
    to get a more granular understanding.


    On top of the major tips previously mentioned, remember that engineers and management
    should be in control of the evaluation. Transparency with pricing and features
    from day one will allow for a more thorough negotiation process. Don’t be afraid
    to tell the vendors you are working with other vendors and looking for the most
    efficient spending plan. When vendors are uncontested, you are likely to pay far
    higher than being transparent in your comparison process.'
