- raw: 'Believe it or not, there are security researchers out there that could care
    less about money. Several components exist that are worrisome in this regard.
    For one, it’s undeniable that researchers that could care less about money are
    fairly easygoing people. It takes a lot of spirit and commitment to hacking in
    order to be transparent and honest enough to disclose a vulnerability to a program,
    knowing right well that a payment for research may not be provided (for an out-of-scope
    or disqualifying vulnerability.) Easygoing researchers may lull some project managers
    into a belief that they don’t need to be too forthcoming with payments, and this
    can jeopardize the future of vulnerability research. Imagine that program managers
    become used to a handful of researchers who are easygoing and decide to report
    vulnerabilities, even if they are out of scope, and don’t express any interest
    in payment. Researchers can inadvertently lead to programs not expanding the scope
    or program managers opting out of bug bounty programs to offer proprietary programs
    where no rewards are offered. One could argue that it’s a fallacious line of thinking,
    possibly even a slippery slope. However, the point here is to ensure that security
    researchers receive their due. If a researcher reports a vulnerability that’s
    in scope but says, “You don’t have to pay me,” it is still always best to respond
    with “Are you sure? We would really like to pay you for your efforts.” Giving
    the researcher the opportunity to at least be rewarded for their work can help
    avoid corruption or unrealistic expectations creeping into a program based on
    past experiences with easygoing researchers.


    The in-between are researchers who represent both a desire for money and a willingness
    to ignore the monetary aspect if push comes to shove. The majority of researchers
    tend to fall into this category of hacking. Researchers that don’t hack for the
    money, or for the pure ethics of the craft, are known as in-between researchers.
    Money doesn’t usually come into the argument; however, the in-between researchers
    don’t necessarily say no to adequate payment.


    However, it’s not unusual to see this category of researchers first ask for money
    and disclose anyway if there isn’t a financial benefit.


    **Note: the following case studies are real, but the company names have been redacted
    to provide anonymity to the organizations.** <query id="Q1"> <p>Dear TS, Please
    set as Note text.</p> </query>


    ### 10.1.2 Case Study Analysis


    When reviewing all of the case studies, identifying major defining differences
    between all of the researchers is a simple task. The ethical and monetary approaches
    can have negative consequences for the future of researchers, and operating a
    fair program will ensure that researchers receive their due diligence. For example,
    in Case Study 1, the researcher was clearly interested in money from the get-go.
    An inexperienced program manager might be very wary of a researcher immediately
    discussing payment and refusing to disclose otherwise. However, it’s necessary
    to understand that taking all reports seriously is the responsibility of a program
    manager, and even if the researcher sounds threatening, enterprises have an obligation
    to respond to the researcher to a certain extent. Every situation should be managed
    diligently, and understanding the perspective of a researcher is important to
    understanding their intention for hacking and participating in programs.


    ## 10.2 Invalidating False Positives


    One of the most difficult aspects of managing bug bounty programs is the process
    of invalidating false positives. Most individuals don’t want the responsibility
    of having to tell a security researcher that the identified issue isn’t actually
    a problem at all. Unfortunately, this is the burden program managers have a responsibility
    to bear. Managing a false positive can feel embarrassing at first, but there are
    ways to manage the occurrence professionally.


    ### 10.2.1 Intake Process and Breaking the News


    As a program manager, the false positive rate should be relatively low if the
    enterprise has a bug bounty platform. The triage team for the platform will maintain
    the responsibility of validating to ensure that it’s a true positive, but in some
    instances false positives will accidentally get triaged. First and foremost, a
    program manager should never create a ticket and assign it to an engineering team
    without first validating that the vulnerability is legitimate. Avoiding the situation
    of going through the entire triage process will ensure that program managers and
    affected teams don’t bear the burden of having more steps than necessary if a
    vulnerability is invalid. Once the vulnerability is deemed invalid, program managers
    should calmly inform the security researcher that a mistake was made, without
    pointing their finger at the triage team. The following is a good example of a
    fictional scenario, and the appropriate way to manage the situation and address
    the security researcher:


    Nick is the program manager for Company X. The bug bounty program that he manages
    receives a report on a Friday evening about a cross-site request forgery (CSRF)
    vulnerability, resulting in the theft of sensitive data from a user. During the
    weekend, the triage team evaluates the vulnerability and notes that it’s a true
    positive. The triage team cleans up the report, produces a subreport with easy-to-follow
    vulnerability replication steps, and assigns the ticket to Nick’s team for further
    review. Nick doesn’t have a lot of experience with hacking, but is excellent in
    the code review process. After reviewing the researcher’s proof of concept, Nick
    is having issues understanding how this is a vulnerability. Typically, a standard
    CSRF vulnerability proof of concept would result in the security researcher being
    able to prove that sensitive data can be stolen. When a domain’s access control
    allow origin is too permissive and the access-control-allow-credentials is set
    to “true” it can result in someone being able to steal credentials.


    The issue that Nick is facing appears to be one in which sensitive information
    that is being returned is nonexistent. When Nick executes the researcher’s proof
    of concept script, he notices that the only information being returned to the
    page is source code for the page and a few other minor details, but nothing deemed
    a security risk. To ensure that he isn’t overlooking something important, Nick
    decides to host his own separate proof of concept and, again, notes that no sensitive
    data is being returned. Nick’s overall verdict is that the research is indeed
    able to exploit the overly permissive cross-origin resource sharing (CORS) policy.
    However, the exploitation occurs on a page that has no sensitive data at all and
    does not impact the confidentiality, integrity, or availability of any user or
    enterprise data. Additionally, the occurrence of this false positive has been
    identified a long time prior to the bug bounty program inviting hackers. In fact,
    Nick ensured that in the out-of-scope section there was a specific clause that
    stated exploitation on pages that had no provable impact was to be considered
    out of scope. Nick did not open a ticket, and began to prepare communications
    with the security researcher.


    Now that it has been established that a false positive exists, Nick has to break
    the news to the security researcher.


    NICK:


    After further validation, we’ve noted that the CSRF vulnerability you are reporting
    is actually a false positive. We are sorry for the mix-up, and hope you continue
    to participate in our program.


    RESEARCHER:


    I don’t understand. The program said this was a verified vulnerability and I was
    even able to pull sensitive information from the page.


    NICK:'
