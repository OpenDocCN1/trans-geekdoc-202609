- raw: "In addition, encourage software engineers to add comments to any vulnerability\
    \ tickets to update the application security team of progress. While not every\
    \ software engineer has a workflow that includes consistent communication via\
    \ comments, the idea in mind is to maintain an open dialogue in the resolution\
    \ process. No single software engineer is alike and program managers should strive\
    \ to make determinations of all of the effective communication processes and adjust\
    \ accordingly.\n\n## 9.5 Pushback, Escalations, and Exceptions\n\nThe responsibility\
    \ of professional accountability falls on the program manager. Whether discussing\
    \ timelines provided for software engineers or executive management, the one key\
    \ point of understanding is to know that, no matter what, the program managers\
    \ will be held responsible for the remediation of any vulnerabilities. Since program\
    \ managers are held accountable, understanding when to escalate on responsible\
    \ parties is a necessary truth, but it doesn’t have to be a toxic interaction.\
    \ For example, imagine that a software engineer was given two full weeks to remediate\
    \ a SSRF vulnerability. During the process, the program manager communicates expectations\
    \ and the software engineer immediately says, “I’m not going to have enough time\
    \ to fix this. This incentive needs to wait until the end of the month.” Realistically,\
    \ since the vulnerability is rated as a high severity with the potential of easily\
    \ turning into a critical, the remediation process cannot afford to wait too long.\
    \ While it may seem embarrassing to talk about how to talk, a bug bounty program\
    \ will fail if program managers don’t have the power to push back. The most effective\
    \ way to ensure the bug bounty program is taken seriously is to define steps and\
    \ methodologies internally and externally, that everyone can refer to.\n\n###\
    \ 9.5.1 Internal steps\n\n*   Develop a team board or way to track resolution\
    \ processes. It can be as simple as a list of tickets and due dates, or as extensive\
    \ as full story tracking, such as with the capabilities that agile methodologies\
    \ bring to the table.\n\n*   Create a playbook as a means of explaining processes.\
    \ Executive leadership may not be heavily involved in the application security\
    \ workflows. A playbook can be an excellent way to present key pieces of information,\
    \ such as company policy on vulnerability resolution expectations, managing issues\
    \ or exceptions, and so on. In addition, more information can always be worked\
    \ into the runbook to elaborate on any defined workflows to junior engineers who\
    \ may not have had to deal with security issues.\n\n*   Reiterate the processes\
    \ to responsible impacted teams, even if it’s believed that the team may know\
    \ what they are doing. For example, a simple: “Hello, we identified a vulnerability\
    \ with X component on X application. The expectation is to get this resolved within\
    \ (X weeks or months) as the criticality of the vulnerability is (low/medium/high/critical)\
    \ and might result in negative possibilities if exploited by a threat actor.”\
    \ Program managers will find far greater success if thorough yet useful expectations\
    \ and risk analyses are conducted and relayed in a meaningful way.\n\n### 9.5.2 External\
    \ steps\n\n*   Establish SLA times within the bug bounty program description to\
    \ hold internal teams accountable for resolution, ideally something that meets\
    \ or is close to internally defined times.\n\n*   Exclude security researchers\
    \ from internal communication processes. It’s important to prevent any advanced\
    \ oversight of the relationship between the program manager and different development\
    \ aspects of security. The program manager’s main priority is to validate, resolve,\
    \ and pay researchers for vulnerabilities. Therefore, it’s pertinent to prevent\
    \ speculation or demotivation.\n\n### 9.5.2 Escalations\n\nTo be completely transparent,\
    \ it may be difficult or even feel discouraging to have to deal with engineers\
    \ who are not apt to maintain a good vulnerability resolution track record. As\
    \ an information security professional, managing relationships with nonsecurity\
    \ personnel will always be difficult. Whether the issue at large is miscommunication,\
    \ demotivation, or disrespect, speculation can be harmful and permanently damage\
    \ relationships with colleagues who will inevitably have to assist if any vulnerabilities\
    \ are identified in their space. Evaluate the following scenarios of communications\
    \ between a senior application security engineer and a software engineer and read\
    \ the various analyses, noting which situations may need escalation depending\
    \ on the program manager’s leadership style, defined resolution times, and preferences.\n\
    \n1.  *Scenario: miscommunication* Shanice talks to Ricardo about an XSS vulnerability\
    \ that has been identified. She notices that the ticket hasn’t been updated with\
    \ any progress and the deadline indicates that the ticket is two days overdue.\
    \ In addition, a week prior to the deadline Shanice informed her manager that\
    \ she believed Ricardo might miss the deadline, and her manager is informed that\
    \ she will be looped in on Shanice’s follow-up emails. She has talked to Ricardo\
    \ and his manager on multiple occasions about the deadline via email, in which\
    \ Ricardo’s manager responded with a claim that it would be finished in time.\
    \  \n\n     **Analysis:** Shanice maintained the right principles throughout the\
    \ process but overall there’s still a level of disconnect between the application\
    \ security team and the engineering team. Shanice has followed up with the team\
    \ on multiple occasions to check on the progress of the work, and the responsible\
    \ team has reassured her that it would be taken care of. Even though assurance\
    \ was provided, the responsible team did not contact Shanice about the possibility\
    \ of missing the deadline, even with her manager involved in the interaction.\
    \ In this particular scenario, Shanice should make a recommendation to her manager\
    \ that escalation to the next level of leadership should occur. Typically, this\
    \ would have been best addressed several days prior to the missed deadline. However,\
    \ responsibility isn’t always claimed and program managers must maintain some\
    \ level of responsibility for failures of miscommunication as well.\n\n2.  *Scenario:\
    \ Demotivation* Shanice receives a message from James stating that he’s having\
    \ a lot of issues resolving the sensitive information disclosure vulnerability\
    \ that was assigned to him. James also seems to be stressed out about the 30-day\
    \ timeline resolution requirement, stating that it’s difficult to prioritize and\
    \ resolve this. Shanice doesn’t specifically know how to resolve the vulnerability,\
    \ but she knows that another software engineer, Rachel, has dealt with this issue.\
    \ Shanice offers to have a call and bring Rachel on to advise. Reluctantly, James\
    \ accepts the meeting and allows Rachel to talk him through the resolution process.\
    \ Shanice interjections about timelines and expectations where needed.  \n\n \
    \    **Analysis:** Shanice made the right call. Rather than scorn the engineer\
    \ for not knowing how to fix the vulnerability, she decided to kindly reach out\
    \ to another engineer and coordinate a meeting with James. In this specific scenario,\
    \ Shanice did not need to escalate, because there was plenty of time remaining\
    \ for the resolution process and a lack of any major issues."
  fmt: "\n此外，鼓励软件工程师在任何漏洞工单中添加评论，以便向应用安全团队更新进度。虽然并非每位软件工程师的工作流都包含通过评论进行持续沟通，但核心理念是在修复过程中保持开放的对话。没有两位软件工程师是完全相同的，项目经理应努力确定所有有效的沟通流程并做相应调整。\n\
    \n## 9.5 推回、升级与例外\n\n职业问责的责任落在项目经理身上。无论是在讨论给软件工程师的时间线，还是给高管管理层的时间线，关键的一点是要明白：无论发生什么，项目经理都将对任何漏洞的修复负责。既然项目经理需要担责，理解何时对责任方进行升级就是必要的真理，但这不一定要是一种有毒的互动。例如，假设给一位软件工程师两周时间来修复一个\
    \ `SSRF` 漏洞。在过程中，项目经理沟通了预期，该软件工程师立即表示：“我没有足够的时间来修复这个问题。这个激励措施需要等到月底。” 现实情况是，由于该漏洞被评为高严重级，且极易演变为严重级，修复过程无法承受过长的等待。虽然谈论如何沟通似乎令人尴尬，但如果项目经理没有推回的权力，漏洞赏金计划就会失败。确保漏洞赏金计划被严肃对待的最有效方法是，在内部和外部定义所有人都可以参考的步骤和方法论。\n\
    \n### 9.5.1 内部步骤\n\n*   开发团队看板或跟踪修复流程的方式。它可以像工单和截止日期列表那样简单，也可以像完整的故事跟踪那样广泛，例如敏捷方法论带来的能力。\n\
    *   创建剧本作为解释流程的手段。高管领导层可能不会深度参与应用安全工作流。剧本可以是展示关键信息的绝佳方式，例如公司关于漏洞修复预期的政策、管理问题或例外情况等。此外，还可以在运行手册中加入更多信息，以详细阐述任何已定义的工作流，供可能从未处理过安全问题的初级工程师参考。\n\
    *   向受影响的责任团队重申流程，即使认为该团队可能知道他们在做什么。例如，简单地说：“你好，我们在 X 应用的 X 组件中发现了一个漏洞。预期在（X 周或月）内解决，因为该漏洞的严重性为（低/中/高/严重），如果被威胁行为者利用，可能会导致负面后果。”\
    \ 如果进行彻底且有用的预期设定和风险分析，并以有意义的方式传达，项目经理将获得更大的成功。\n\n### 9.5.2 外部步骤\n\n*   在漏洞赏金计划描述中建立\
    \ `SLA` 时间，以让内部团队对修复负责，理想情况下应满足或接近内部定义的时间。\n*   将安全研究人员排除在内部沟通流程之外。防止项目经理与安全不同开发方面之间的关系受到任何高级监督非常重要。项目经理的主要优先事项是验证、解决并为研究人员的漏洞付费。因此，防止猜测或挫伤积极性至关重要。\n\
    \n### 9.5.3 升级\n\n坦白说，面对不善于维护良好漏洞修复记录的工程师，可能会感到困难甚至沮丧。作为信息安全专业人员，管理与非安全人员的关系将永远充满挑战。无论大问题是沟通不畅、缺乏动力还是不尊重，猜测都可能有害，并永久损害与同事的关系——这些同事在其领域发现漏洞时不可避免地需要提供协助。请评估以下高级应用安全工程师与软件工程师之间的沟通场景，并阅读各种分析，注意根据项目经理的领导风格、定义的修复时间和偏好，哪些情况可能需要升级。\n\
    \n1.  **场景：沟通不畅** `Shanice` 与 `Ricardo` 谈论一个已识别的 `XSS` 漏洞。她注意到工单未因任何进度而更新，且截止日期显示工单已逾期两天。此外，在截止日期前一周，`Shanice`\
    \ 告知其经理她认为 `Ricardo` 可能会错过截止日期，且其经理被告知将抄送在 `Shanice` 的跟进邮件中。她曾多次通过邮件与 `Ricardo`\
    \ 及其经理讨论截止日期，`Ricardo` 的经理回复称将按时完成。\n\n     **分析：** `Shanice` 在整个过程中坚持了正确的原则，但总体上应用安全团队与工程团队之间仍存在脱节。`Shanice`\
    \ 多次跟进团队以检查工作进度，责任团队向她保证会处理。尽管得到了保证，责任团队甚至在其经理参与互动的情况下，也未联系 `Shanice` 说明可能错过截止日期的可能性。在该特定场景中，`Shanice`\
    \ 应建议其经理升级至下一级领导。通常，这最好在错过截止日期前几天解决。然而，责任并不总是被认领，项目经理也必须对沟通不畅的失败保持一定程度的责任。\n\n\
    2.  **场景：缺乏动力** `Shanice` 收到 `James` 的消息，称他在解决分配给他的敏感信息泄露漏洞时遇到很多问题。`James` 似乎也因\
    \ 30 天的修复时间线要求而感到压力很大，表示难以确定优先级并解决此问题。`Shanice` 并不具体知道如何解决该漏洞，但她知道另一位软件工程师 `Rachel`\
    \ 处理过此问题。`Shanice` 提议召开电话会议并邀请 `Rachel` 提供建议。`James` 勉强接受会议，并允许 `Rachel` 指导他完成修复过程。`Shanice`\
    \ 在需要时插话谈论时间线和预期。\n\n     **分析：** `Shanice` 做出了正确的决定。她没有因工程师不知道如何修复漏洞而责备他，而是决定善意地联系另一位工程师并与\
    \ `James` 协调会议。在该特定场景中，`Shanice` 无需升级，因为修复过程中仍有充足时间，且不存在任何重大问题。\n"
