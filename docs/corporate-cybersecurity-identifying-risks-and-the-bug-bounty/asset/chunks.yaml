    Once the form is submitted, typically the organization will patch and then provide
    a patch notice or writeup (aka references) to MITRE and then MITRE will officially
    release the CVE to the public.


    # Part 5: Internal and External Communication


    ## 9 Development and Application Security Collaboration


    ### 9.1 Key Role Differences


    The application security and development roles are vastly different in both workflow
    and responsibility. Obviously, depending on the enterprise, the roles can vary
    dramatically and the enterprise program may be composed of information security
    practitioners, and not necessarily application security engineers acting as bug
    bounty program managers.


    #### 9.1.1 Application Security Engineer


    During the program process, application security engineers are responsible for
    the consistent evaluation of security programs as it pertains to the enterprises
    applications such as websites, mobile apps, and third-party reviews, especially
    if partners use any of the applications in a privileged manner. Typically, an
    application security engineer will be responsible for the security during the
    development of the applications and all of the processes involved.


    #### 9.1.2 Development


    Primarily, software engineers will acquire the brunt of the workload involved
    with remediating vulnerabilities that have been established. However, that’s not
    always the case. Depending on the identified issue, application security engineers
    will find that they may have to collaborate with other teams, such as cloud security
    or infrastructure teams, to resolve identified vulnerabilities. The resolution
    of vulnerabilities does not solely fall into the bracket of software engineering.


    > **Note:** Even though application security engineers are responsible for evaluating
    and remediating security issues, the various application creators and maintainers
    must exercise good secure coding practices.


    ### 9.2 Facing a Ticking Clock


    It shouldn’t come at a surprise that the responsible program managers will have
    quite a few hurdles to face when dealing with vulnerability remediation. Obviously,
    the expectation to resolve the identified vulnerabilities comes from both the
    security researcher and enterprise program perspective. For example, if multiple
    identified vulnerabilities are validated, ensuring that criticality is prioritized
    is an absolute necessity, and will help in the ticking clock also known as a service
    level agreement (SLA). Researchers are eager to resolve issues, and program managers
    will likely be facing anxious researchers constantly asking for updates. While
    a swift resolution isn’t guaranteed in all scenarios, the important part is ensuring
    that both researchers and management understand the level of effort required.


    Imagine a scenario in which a vulnerability was identified that has a recommended
    remediation timeline of two full weeks. Program managers should be proactive about
    the resolution and communicate any blockers to anyone involved. If a researcher
    expects updates throughout the period and receives zero updates, they will get
    discouraged. They will become even more discouraged if the expected service level
    agreement time isn’t met. Instead of apologies post-failed criteria, it doesn’t
    hurt to update the researcher before the missed deadline, explaining various blockers
    in the resolution process. The program manager responsible for facilitating communication
    doesn’t necessarily have to divulge too much information about the blockers, but
    an update is usually appreciated.


    In conjunction with keeping researchers updated, program managers must prioritize
    blockers to leadership. If leadership has to consistently ask for updates on vulnerabilities,
    it can impact the workflow and create an unnecessary sense of urgency for the
    teams responsible for patching the identified vulnerability. If leadership has
    to intervene during the remediation process too often, software engineers or other
    responsible development parties may feel as if vulnerabilities are being blown
    out of proportion when collaborating in the future.


    ### 9.3 Meaningful Vulnerability Reporting


    Often, engineers make the mistake of relaying reported vulnerabilities to software
    engineers in an overly technical way. Even though software engineers are highly
    technical individuals, exploitation is a different art and in some instances the
    vulnerability may be overlooked or misunderstood if reported incorrectly. As anything,
    program managers should learn how the different teams within the organization
    operate and adjust according. How does one define “overly technical”? First and
    foremost, it’s unlikely that a software engineer would ever admit to a report
    being outside of their range of understanding. There’s no specific threshold for
    a report being too technical. Therefore, program managers should strive to relay
    vulnerabilities in a way that everyone can understand. There’s no such thing as
    a report being “too easy to understand.”


    Compare two excerpts from the same report, translated with two separate summaries,
    and notice differences in the effectiveness of the following relayed report.


    Even though both of the summaries are true, Report 2’s summary is friendlier for
    presentation to a software engineer or other development team. Paired with easy-to-understand
    steps, Report 2 will surpass the presentation of Report 1. Communicating the information
    in a concise way that gets to the root of the vulnerability is essential to prevent
    mishaps or delays in any of the resolution processes. The replication steps should
    be written about in a similar sense. When attempting to summarize the replication
    steps, refrain from using highly technical terms if there’s an easier way of explaining
    things. Although there isn’t a set way to accomplish this, two ways a program
    manager can alleviate the stress of a software engineer or other responsible party
    from feeling bogged down are minimizing the number of steps it will take to replicate
    the vulnerability or, if all the steps are necessary, avoiding acronyms and providing
    the “why” a bug is a particular issue.


    For example, a software engineer may be familiar with the term “XSS” but when
    a program manager first starts, they should expand upon the abbreviation, (cross-site
    scripting). In addition, an engineer may not know what cross-site scripting is.
    Typically, a quick blurb, such as: “Cross-site scripting (aka XSS) is a method
    in which an attack can steal information from a user via social engineering,”
    is a good way to explain quick risk. Refer to the OWASP Top Ten guide to understand
    a little more about application vulnerabilities (<https://owasp.org/www-project-top-ten/>).


    ### 9.4 Communicating Expectations


    One of the ways program managers risk hurting the potential for success in an
    enterprise bug bounty program is with unrealistic expectations or being too lax
    in management processes. Program managers should maintain a balanced approach
    to achieve the best possible outcome, adjusting based on the severity of the vulnerability.
    It’s typically unwise to set high expectations on a low severity vulnerability,
    as it can potentially damage the relationship between the program manager and
    responsible remediating party. Similarly, setting low expectations can cause just
    as much harm to the program’s reputation, especially if engineers don’t believe
    they are being held accountable to fix the issues. Whatever timelines are agreed
    upon, both software development managers and security managers should have full
    oversight of the remediation process to prevent any unnecessary disagreements.

