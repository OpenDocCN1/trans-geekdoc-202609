    特别感谢我的朋友 Christian Bobadilla。Christian 是我认识的最有才华的应用安全专家之一，他的谦逊让他远离了信息安全的聚光灯。通过我，你优秀的建议和指导得以延续。如果不是你，我甚至不会知道我现在所知道的关于漏洞赏金计划的四分之一知识。感谢你成为我生命中积极的榜样。要找到不仅才智敏锐、谦逊，而且还是杰出领导者的人，是极其困难的。这本书献给你对我的能力所寄予的信任。


    最后一个献词：献给我的父亲，他鼓励我始终尽最大努力。安息吧。


    # 第一部分


    漏洞赏金计划概述


    # 1


    漏洞赏金计划的演变


    ## 1.1 创造历史


    理解漏洞赏金计划的演变，首先需要熟悉黑客领域的现状，或者正如信息安全领域的许多人所称，渗透测试。安全研究人员并非一直以来都受到尊重或获得展现才华的机会。纵观历史，“黑客”一词总是令公众恐惧，当“被黑”的传言传播时，也会在公司内部掀起恐慌浪潮。有记录以来，首次因“破解”某物而支付的赏金发生在
    1851 年。Charles Alfred Hobbs 因撬开一把物理锁，获得了约合 20,000 美元的报酬。（[`www.itspmagazine.com/itsp-chronicles/history-and-interesting-facts-about-bug-bounties-an-appsec-usa-2017-panel-recap`](https://www.itspmagazine.com/itsp-chronicles/history-and-interesting-facts-about-bug-bounties-an-appsec-usa-2017-panel-recap)）


    首个真正的赏金计划由 Netscape 运行，始于 1995 年。主要测试范围是其核心产品 Netscape Navigator 2.0 的应用测试。随后，其他企业慢慢开始采纳自己的漏洞赏金计划并提供奖励。漏洞赏金众包平台引入了新浪潮，将企业计划汇编成整齐的目录，安全研究人员可跳入各类计划并开始参与。Bugcrowd
    是漏洞赏金历史上首个众包平台，一直是企业漏洞赏金计划管理的关键参与者。先驱者们——Casey Ellis、Chris Raethke 和 Sergei Belokamen——坚信要将潜在能力与未被满足的需求连接起来，总体目标是让安全变得人人易行。此外，Ellis
    坚定地致力于协助安全研究人员保持记录清白。Casey Ellis 还表达了帮助教育青年树立道德黑客理念、而非走上犯罪道路的愿望，创立这样一家公司的部分灵感源于消除对安全研究污名化的理想。


    实际上，回顾漏洞赏金计划的现状与历史，能给读者带来宝贵的积极视角，但企业适应缓慢。即使自 1995 年以来，全球现存的漏洞赏金计划不足 400 个，漏洞披露计划也不足
    1600 个。现存计划数量之少令人惊讶，这代表了合法黑客领域（即安全研究）的抵触与保守。


    ## 1.2 保守的阻碍因素


    当信息安全专家了解漏洞赏金计划时，许多人都渴望参与其中。应用安全是一个不断发展的领域，现代 Web、移动和硬件资产都需要防护。面对保护应用这一必要需求，企业仍抵制将漏洞报告管理作为优先激励措施的绝对必要性。凡事皆无“放之四海而皆准”的答案来解释为何企业会忽视应用安全；然而，许多因素在至今仍普遍存在的抵制中发挥了作用。例如，以下是公司可能决定忽略漏洞赏金计划构想的一些原因：


    *   威胁行为者活动增加。

    *   安全研究人员欺诈。

    *   应用只是次要考量。

    *   巨大的预算需求。

    *   优先考虑其他安全工具。


    显然，企业认为漏洞赏金计划会带来不必要风险或负面影响的理由还有其他几个。揭穿上述五个明确观点，将有助于人们更好地理解：恐惧是自然的，但它可能损害良好应用安全计划的整体健康。


    ## 1.3 威胁行为者活动增加


    企业可能担心，建立漏洞赏金计划会导致恶意威胁行为者试图入侵或成功利用应用的活动增加。这种逻辑可以表述为：“如果企业建立了漏洞赏金计划，安全研究人员将被允许进行黑客攻击，则无法分辨谁是恶意的。”该陈述假设威胁行为者隐藏在安全研究人员之中，其问题在于一种常见的哲学逻辑谬误：滑坡谬误。


    滑坡谬误的最佳定义是：“一种行动过程，似乎必然导致从一个行动或结果推向另一个带有意外后果的结果。”用通俗的话讲，在安全研究场景中，滑坡谬误意为：“如果企业允许安全研究人员开展研究，我们就会被恶意利用。”最好设想一下另一种视角下的威胁行为者活动增加场景。没有漏洞赏金计划，缺陷可能永远不会被发现——这些漏洞可能会危及组织的敏感信息或知识产权。


    考虑运营漏洞赏金计划的企业应学习通过日志记录机制和 Web 应用防火墙进行有效的日志记录和防护，本书后面将讨论这些内容。


    ## 1.4 安全研究人员欺诈


    任何依赖另一方提供服务的业务都应时刻警惕欺诈。理解漏洞类型、严重性并评估赔付金额，始终是运行漏洞赏金计划的公司的最佳行动方案。尽管如此，欺诈的想法并非新鲜事。潜在的计划管理者必须学习最佳实践并理解漏洞管理的基础知识。尽管如此，计划保护措施已就绪。漏洞赏金众包平台（如
    Bugcrowd 和 HackerOne）提供的托管服务将成为有用工具。分流团队将协助验证漏洞的合法性，这有助于防止欺诈。计划管理者不应完全依赖验证，但欺诈发生的频率远低于观望中的企业所想象的。


    ## 1.5 应用只是次要考量


    因认为应用只是微小攻击面而避开漏洞赏金计划的企业，是在自找麻烦。当负责公司安全的员工评估漏洞潜力时，显而易见的首选是保护网络及相关资产。然而，Web 和移动应用特别是变得极其复杂。随着多种开发语言和服务器的使用，攻击面远比人们想象的要大。请看以下示例：


    > 服务器 → 托管 Web 应用的一个部分 → 一个分配的 IP 地址

    >

    > Web 应用 → 连接到多个服务器 → 多个 IP 地址


