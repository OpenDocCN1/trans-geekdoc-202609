  trans: '


    用户积极参与游戏并投身于虚拟环境。作为一个完整的世界，元宇宙拥有众多类别，每个类别都有其自身的一组应用程序。参与游戏并成为元宇宙一部分的参与者可以赚取金钱和
    NFT 代币（元宇宙运行所依赖的代币）。这些获得的代币在金融世界中具有价值，可以在任何元宇宙的市场上交易。此外，用户还可以选择将代币兑换为主要加密货币。


    用户可以在专注于主动投资风格的同时，被动地投资元宇宙。在整个元宇宙或元宇宙 NFT 中使用的 NFT 代币，在加密世界中具有货币价值。随着项目的增长，它可以在各种交易所和平台上市。此外，投资者可以在交易所或平台之间汇集资金以获取利润，因为它是多个
    IDO 和发行平台的一部分。这标志着投资者在元宇宙中被动参与的结束。


    另一种可能被认可的元宇宙投资策略是投资者通过购买元宇宙 ETF 获得风险敞口。交易所交易基金（ETF）是一组在股票市场上像股票一样交易的证券和安全资产。投资者可以通过元宇宙股票
    ETF 投资于在加密生态系统中已占据强势地位的公司。


    ## 元宇宙如何帮助你赚钱？


    成为游戏的一部分是用户提供的在元宇宙中赚钱的最易理解的解释之一。因为这些元宇宙使用“玩赚”方法，你只需玩游戏就能赚取大量金钱。


    从元宇宙中获利的另一种方法是通过被动投资。人们在投资前被敦促对项目进行充分调研。发现项目的突出用例和路线图，无疑可以在短时间内为你带来巨大收益。


    作为一种技术，元宇宙正在呈指数级发展。由于这些系统是无限的，能够在虚拟世界中执行广泛的功能，因此有很多内容可以展示。由于我们都同意元宇宙的范围是无限的，许多用例可以被实施。如果你想从元宇宙中获利，你应该发展你的概念理解。由于这一点，更多的概念和独特性最终将被纳入元宇宙。自行投资技术将帮助你使其变得极其盈利。


    虚拟世界和元宇宙已经提出了一种连接数字世界和物理世界的合理策略。区块链是到达以明确建立这种联系的最显著因素之一。此外，元宇宙为用户提供了众多替代方案，并从系统中过度受益。


    # 第 12 章


    # 元宇宙房地产购买分步指南


    通过增强现实（AR）、虚拟现实（VR）和视频的结合，元宇宙是数字化现实世界的一步。用户可以使用他们的数字化身在虚拟宇宙中工作、玩耍和与朋友交流。元宇宙中有很多事情可做，从组织会议到进行虚拟地球之旅。


    另一方面，房地产似乎正在吸引投资者的注意。由于每隔一周就有报道数百万美元的前所未有的购买，元宇宙中的房地产交易量一直在登上新闻头条。


    要购买虚拟房产，你必须首先在 Decentraland、The Sandbox 或 Axie Infinity 等元宇宙平台上注册。然后，要在元宇宙中进行交易，你只需要一个资金充足的数字钱包。然后，你可以通过将美元转换为以太币或你正在进行交易的元宇宙的原生代币（如
    MANA 或 Sandbox）来将美元存储在你的数字钱包中。


    在元宇宙近乎完整的生态系统的支持下，你可以在数字世界中购买、出租、翻转甚至出售房屋，所有权基于非同质化代币（NFTs）。


    以下是购买元宇宙房地产的分步指南。


    1. 访问元宇宙房地产市场之一，例如 Decentraland、Axie Infinity 或 Sandbox，并登录。


    2. 比较各种可用土地地块的价格。


    3. 在选择了想要购买的数字土地地块后，点击它以了解更多信息。请务必记住，特定的元宇宙房地产平台只有在你使用其批准的加密货币时才会允许你从他们那里购买。例如，Decentraland
    仅允许用户使用其加密货币 MANA 来购买和出售房屋。


    4. 下一步是将你的数字钱包连接到房地产网站上的账户。为此，你首先需要获得一个合适的数字钱包。Metamask 是目前市场上最流行的数字钱包。此外，它与几乎每个元宇宙房地产平台兼容。


    5. 使用与你选择的数字房地产平台兼容的加密货币为你的数字钱包充值至关重要。然后，你可以在各种交易所轻松购买它，并将加密货币安全地存储在你的数字钱包中。当你完成土地选择并为关联的数字钱包充值后，你只需按下“购买”按钮即可。


    6. 完成交易后，你购买的数字土地将作为 NFT 存储在你关联的数字钱包中。因此，在你的数字钱包中，前往“NFTs”页面以查看你新购买的土地。


    ## 购买元宇宙房地产前你应该知道的事项


    与投资房地产市场不同，在元宇宙中，如果你购买的平台失败并倒闭，你购买的数字土地将变得不复存在。另一个需要记住的是用于在元宇宙房地产市场进行交易的加密货币的显著波动性。由于数字货币的价值波动，你所持有的元宇宙房地产的价值也会相应波动。


    此外，由于数字房地产是一个相对较新的资产类别，许多方面尚未被探索。因此，投资元宇宙的数字房地产市场具有高度投机性；因此，在做出任何决定之前，建议彻底研究其优缺点。


    # 第 13 章


    # 元宇宙与网络


    三个主要的网络方面——带宽、延迟和可靠性——对于大多数读者来说将是最不引人入胜的元宇宙推动因素。但是，另一方面，它们的限制和增长影响着我们构建元宇宙产品和服务的方式、我们何时可以使用它们，以及我们能够（和不能）完成什么。


    ## 带宽


    带宽通常与速度混淆，尽管它指的是在给定时间内可以发送的数据量。元宇宙对大多数互联网应用程序和游戏以及许多当前连接的要求要严格得多。微软飞行模拟器是理解这一点的最佳方法。


    微软飞行模拟器是有史以来最逼真、最大的消费级模拟器。它包含了地球上几乎每条道路、山脉、城市和机场，以及 2 万亿棵单独渲染的树木、15 亿座建筑物，以及几乎每条道路、山脉、城市和机场……由于它们基于原始物体的高质量扫描，它们看起来都像真实的东西。然而，微软飞行模拟器需要超过
    2.5 拍字节的数据——即 2,500,000 千兆字节——才能实现这一点。消费设备（或大多数企业设备）无法存储如此大量的数据。


    '
