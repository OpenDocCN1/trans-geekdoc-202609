    # Web3 是什么？


    Web3 是一种可能的未来互联网版本，基于公共区块链，这是一种最著名于促进加密货币交易的记账系统。Web3 的吸引力在于它是去中心化的，这意味着消费者不再通过谷歌、苹果或
    Facebook 等公司中介的服务访问互联网，而是由个人拥有和管理互联网的部分。此外，Web3 不需要“许可”，这意味着中央机构无法决定谁可以访问哪些服务，也不需要“信任”，这指的是不需要中介来允许两个或多个方之间进行虚拟交易。最后，由于这些机构和中介正在进行大部分数据收集，Web3
    在技术上更好地保护了用户隐私。


    当然，虽然这是区块链工程师和支持者对 Web3 未来的乌托邦式愿景，但在实践中可能不那么公平。例如，去中心化金融（通常称为 DeFi）是 Web3 的一个组成部分，正在变得越来越流行。它涉及在没有银行或政府帮助的情况下，在区块链上执行现实世界的金融交易。


    与此同时，许多大公司和风险投资公司正在向 Web3 投入资金，很难想象他们的参与不会导致某种形式的集中权力。


    ## Web3 的前身是什么？


    Web1 和 Web2（有时称为 Web 2.0）是早期互联网时代的术语。Web1 涵盖 1990 年代和 2000 年代初期，当时互联网更加去中心化，开源协议更受欢迎。静态页面（即无法交互且不经常更新的网站）更为常见。Web2
    指的是从 2000 年代初期至今的时期，当时大型科技公司控制着最突出的在线枢纽。在 YouTube 视频或 Facebook 帖子等星系级平台上出现用户生成的内容，是这个时代的另一个标志。这就是驱动社交媒体的东西。互联网不再是被动消费的地方，而是变成了积极参与的地方。


    ## Web3 是加密货币的东西吗？


    NFT、数字货币和其他区块链实体将在 Web3 中被广泛使用。例如，Reddit 旨在通过创建一种使用加密货币代币来赋予用户对其在网站上参与的社区部分控制权的方法，来进入
    Web3 领域。根据这一概念，用户通过在特定子版块发帖来获得“社区积分”。然后用户根据有多少用户为特定帖子点赞或踩踏来获得积分。（这只是 Reddit Karma
    的区块链版本。）这些积分本质上可以用作投票股份，允许做出重大贡献的用户对影响社区的选择有更大的发言权。此外，由于这些积分存储在区块链上，其所有者对它们拥有更多控制权；它们不容易被拿走，并且可以被追踪。公平地说，这只是一个应用程序，是公司对
    Web3 去中心化自治组织（DAO）概念的采纳，DAO 使用代币来划分所有权和决策权。例如，去中心化自治组织（DAO）是 Augur，一个去中心化的博彩平台。NFT
    也是 Web3 的重要组成部分。它们本质上是独一无二的加密货币代币，通常用作虚拟物品（如艺术品或篮球录像）的所有权证书。（这与比特币形成对比，比特币可以与任何其他比特币交换。）根据
    Web3 支持者的说法，NFT 代表的数字稀缺性将使这种新互联网的用户能够交易从视频游戏皮肤到医疗记录的一切。


    ## 为什么 Web3 突然如此受到关注？


    大部分关注似乎来自比特币社区，该社区将从更依赖其技术的互联网中受益。然而，一些关注源自一些知名公司，例如 Reddit，正在采取措施在趋势之前建立 Web3
    服务和平台。例如，根据 CoinDesk 的报道，GameStop 正在寻找“Web3 游戏负责人”和针对未识别 NFT 平台的软件工程师。此外，关于 Web3
    如何通过让玩家更轻松地购买和交易游戏内物品或获得赋予他们对游戏治理更大控制权的代币来改进视频游戏，有很多讨论。然而，The Verge 推测 GameStop
    可能只是在其招聘启事中使用“Web3”和“区块链”等术语，以吸引其在 1 月份获得的同类另类投资者支持。10 月初，最近的发展是风险投资公司 Andreessen
    Horowitz 在华盛顿特区的 Web3 游说推动。Andreessen Horowitz 大力投资比特币和其他区块链技术，已派遣高管前往国会山和白宫，将
    Web3 推广为解决硅谷整合的方案，并为不断扩大的虚拟世界提出规则。


    ## 围绕 Web3 的兴奋是否完全合理且适度？


    10 月下旬，一位 28 岁的艺术家分享了一张名为“Web3 时代的爱情”的表情包，描绘了一对卡通情侣躺在床上盯着比特币和以太坊价格。这位艺术家能够将表情包转化为
    NFT，并在亿万富翁埃隆·马斯克在 Twitter 上发布并获得数十万个点赞后，以近 2 万美元的价格出售。在其他进展中，一个旨在成为“Web3 街头乐队”的团体推出了带有卡通猿的
    NFT。其中一只卡通猴最近在拍卖会上以 340 万美元的价格成交。因此，要回答这个问题，答案是否定的。


    ## Web3 在元宇宙中扮演什么角色？


    ### 技术领域非常流行


    我提到过我们的主人没有接种疫苗。结果，我的 Airbnb 评论被删除了。


    ### 为什么天文学家因即将发射的望远镜而“哭泣和呕吐”


    ### 导致每个婴儿潮一代都出现红眼的过时物体


    ### 从大气中抽取碳的有争议计划


    首先，元宇宙是由三维虚拟现实区域组成的未来互联网，用户可以在其中相互交流。正因如此，Facebook 最近将其名称更改为“Meta”。一些技术人员预计，Web3
    将推动基于区块链技术和开放标准的元宇宙的创建，由全球计算机网络管理，而不是由少数几家大公司管理。如果 NFT 被用于允许虚拟现实交易，传统的把关人将无法控制什么可以进入元宇宙，什么不能进入。在
    10 月发布的一份公开声明中，Facebook 首席执行官马克·扎克伯格诗意地描述了元宇宙不会“由一家公司制作”，并将建立“比当今平台和政策所限制的更广泛的创意经济”。这一切听起来很美好，但考虑到
    Facebook 为在社交媒体领域保持其主导地位所做的努力，它很可能会继续试图在 Web3 未来中保持一个突出的机构。


    # Web 3.0 将释放哪些新商业模式？


    Web 3.0 将产生远超加密货币初始用例的深远影响。Web 3.0 将使用高效的机器学习技术，以密码学方式连接来自企业、个人和机器的数据，从而产生根本性的新市场和相关商业模式，这要归功于现在可能的丰富交互以及可用的全球对手方范围。


    Web 3.0 的未来影响是显而易见的，但问题仍然在于哪些商业模式可以破解密码，并在当今经济中创造持久和可持续的价值。


    ## Web 1.0、2.0 和 3.0 时代的商业模式回顾

