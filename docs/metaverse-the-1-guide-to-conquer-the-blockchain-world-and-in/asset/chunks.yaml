    # Private Industry and the Metaverse


    Private industry is not only fully aware of the Metaverse''s potential, but it
    also has the most aggressive belief in its future, not to mention the most money
    (at least when it comes from a willingness to support Metaverse research and development),
    the best engineering skill, and the most conquest ambition. The major technology
    firms want to own and define the Metaverse rather than simply leading it. Although
    there are just a few possible leaders in the early Metaverse, open-source initiatives
    with a non-corporate approach will continue to play an important role. They will
    attract some of the most interesting creative talent. And you''ll be able to tell
    them apart.


    # Microsoft


    Microsoft is a great illustration of this. The company has hundreds of millions
    of federated user identities through `Office 365` and `LinkedIn`, is the world''s
    second largest cloud vendor, has an extensive suite of work-related software and
    services that span all systems/platforms/infrastructure, clear technical experience
    in massive shared online content/operations, and a set of potential gateway experiences
    through `Minecraft`, `Xbox + Xbox Live`, and `HoloLens`. To that end, the Metaverse
    gives Microsoft a chance to reclaim the `OS/hardware` leadership it lost during
    the PC to mobile shift. But, more importantly, Microsoft CEO Satya Nadella understands
    the importance of being present wherever work is done. Microsoft has successfully
    transitioned from business to consumer, PC to mobile, offline to online, while
    maintaining a strong role in the "work" economy. As a result, it''s difficult
    to picture Microsoft not being a significant driver in the virtualized future
    of labor and information processing.


    # Facebook


    Although Facebook CEO Mark Zuckerberg has not declared explicitly that he wants
    to create and control the Metaverse, his interest in it is clear. This is also
    ingenious. More than any other company, Facebook stands to lose the most from
    the Metaverse, as it will develop a new computing and interaction platform and
    an even larger and more capable social network. At the same time, the Metaverse
    allows Facebook to increase its reach both up and down the stack. Despite numerous
    attempts to design a smartphone operating system and deploy consumer hardware,
    Facebook is the only FAAMG company focused completely on the app/service layer.
    Thanks to the Metaverse, Facebook might become the next `Android` or `iOS/iPhone`
    (hence `Oculus`) and a virtual goods version of `Amazon`.


    Facebook''s Metaverse benefits are huge. It has the highest number of daily users,
    daily usage, and user-generated content of any platform in the planet, the second
    highest percentage of digital ad spend, billions in money, thousands of world-class
    engineers, and a founder with majority voting rights. Its Metaverse assets are
    also rapidly evolving, with semiconductor patents and brain-to-machine computing
    interfaces now among them. Unfortunately, Facebook''s track record as a platform
    allowing third-party developers/companies to construct long-term enterprises,
    as a ringleader in a consortium (e.g. `Libra`), and in managing user data/trust,
    on the other hand, is dismal.


    # Amazon


    Amazon is fascinating in a variety of ways. It will, of course, aspire to be the
    primary location where we purchase''stuff.'' It makes no difference if it''s bought
    through a game engine, a virtual environment, or a web browser (it already sells
    inside `Twitch`). Furthermore, the company already has hundreds of millions of
    credit cards, the world''s largest share of ecommerce (excluding China), is the
    world''s largest cloud vendor, operates a variety of consumer media experiences
    (video, music, ebooks, audiobooks, video game broadcasting, etc.) and third-party
    commerce platforms (e.g. `Fulfilled by Amazon`, `Amazon Channels`), and is working
    on what they hope will be the first major gaming/rendering engine purpose-built
    for the cloud.


    More importantly, the company''s founder and CEO, Jeff Bezos, is a big believer
    in infrastructure spending. `AWS`, for example, powers the internet (`Amazon Web
    Services`). Rather than buying and selling inventory directly, Amazon sells, packages,
    and distributes products offered by other companies, with "`Fulfilled by Amazon`"
    accounting for 80% of Amazon''s revenue (like most retailers). While Elon Musk''s
    private rocket business, `SpaceX`, aims to populate Mars, Bezos has indicated
    that his objective with `Blue Origin` is to "create giant chip factories in orbit
    and just send small pieces down," akin to early web protocols and his `AWS`. As
    a result, Amazon is more likely than any other FAAMG company to embrace a fully
    "open" Metaverse — it doesn''t need to control the UX or ID because it benefits
    from tremendous growth in back-end infrastructure usage and digital transactions.


    # Google


    The Internet is a gold mine for data, and the Metaverse will have more data and
    potentially higher yields than the existing web. And no one does a better job
    than Google at exploiting this data on a global basis. In addition, the company
    is not only the industry leader in indexing both the digital and physical worlds
    (nearly 10,000 employees contribute to mapping operations), but it is also the
    most successful digital software and services company outside of China. It also
    runs the most popular operating system on the planet (`Android`) and the most
    open of the major consumer computing platforms (`Windows`). Despite its failure,
    Google was the first to go all-in on wearable computing with `Google Glass`. It
    is now making a significant push into digitizing the house with `Google Assistant`,
    its `Nest` suite of products, and `FitBit`. As a result, the Metaverse is likely
    to be the only project capable of bringing all of Google''s various investments
    to date together, including `Stadia` edge computing, `Project Fi`, `Google Street
    View`, enormous dark fiber purchases, wearables, virtual assistants, and more.


    # Putting Our Heads Together


    It''s unlikely that it will control or drive the underlying Metaverse. True, it
    is home to the world''s second-largest computer platform (and by far the most
    valuable), as well as the world''s largest video game retailers (which also means
    it pays more to developers than anyone else on earth). In addition, the company
    is investing heavily in augmented reality devices and "connective tissue" that
    will aid the Metaverse (e.g. `beacons`, `Apple Watch`, `Apple AirPods`). But,
    on the other hand, Apple''s attitude and business model are incompatible with
    building an open platform for innovation where anybody can access the full range
    of user data and device APIs. Rather than the operator/driver, Apple is more likely
    to be the primary mode of communication between the Western world and the Metaverse.
    This, like the Internet, will almost certainly benefit everyone.


    # Unity


    If the Metaverse requires a broad interplay of assets, experiences, and shared
    APIs, `Unity` will be important. This engine is utilized in more than half of
    mobile games. It is even more popular than `Unreal` in real-world rendering/simulation
    use cases (architecture, design, and engineering). For example, while producing
    and filming the photo-realistic Lion King in `Unity`, filmmaker Jon Favreau was
    also producing and filming Disney''s The Mandalorian in `Unreal`. It also controls
    one of the world''s largest digital ad networks (a nice side effect of powering
    10B daily minutes of mobile entertainment).


    On the other hand, `unity`''s role in moving the Metaverse forward is unknown.
    There is no store, no login system, and no true direct-to-consumer experience.
    Most of its ancillary services (non-engine or advertising) are rarely used. Furthermore,
    rather being Metaverse gateways, most (but not all) `Unity`-powered games are
    simply mobile games. Given its inevitable influence on norms, playtime, and content
    production, it''s difficult to imagine it not being bought out and merged into
    a larger technology business with more assets and perks.

    '
  trans: '


    # 私营行业与元宇宙


    私营行业不仅充分意识到元宇宙的潜力，而且对其未来抱有最积极的信念，更不用说拥有最多的资金（至少在支持元宇宙研发方面），最好的工程技能，以及最强的征服野心。主要科技公司希望拥有并定义元宇宙，而不仅仅是引领它。尽管早期元宇宙可能只有少数几个领导者，但采用非企业方式的开源倡议将继续发挥重要作用。它们将吸引一些最有趣的创意人才。而且你将能够将它们区分开来。


    # 微软


    微软是这一现象的绝佳例证。该公司通过 `Office 365` 和 `LinkedIn` 拥有数亿个联合用户身份，是世界第二大云供应商，拥有跨越所有系统/平台/基础设施的广泛工作相关软件和服务套件，在大规模共享在线内容/运营方面拥有清晰的技术经验，并通过
    `Minecraft`、`Xbox + Xbox Live` 和 `HoloLens` 拥有一系列潜在的入口体验。为此，元宇宙为微软提供了一个机会，以重新夺回其在
    PC 向移动端转型过程中失去的 `OS/硬件` 领导地位。但更重要的是，微软 CEO Satya Nadella 理解在工作发生的任何地方都存在的重要性。微软已成功从业务向消费者、PC
    向移动端、离线向在线转型，同时在“工作”经济中保持了强大的角色。因此，很难想象微软不会成为劳动和信息处理虚拟化未来的重要推动者。


    # Facebook


    尽管 Facebook CEO Mark Zuckerberg 并未明确表示他想要创建和控制元宇宙，但他对元宇宙的兴趣显而易见。这也很巧妙。比任何其他公司都更甚，Facebook
    将因元宇宙而损失最多，因为它将发展出一个新的计算和交互平台以及一个更大、更强大的社交网络。同时，元宇宙使 Facebook 能够在技术栈的上下游扩大其影响力。尽管多次尝试设计智能手机操作系统并部署消费硬件，Facebook
    是唯一完全专注于应用/服务层的 FAAMG 公司。得益于元宇宙，Facebook 可能成为下一个 `Android` 或 `iOS/iPhone`（因此是
    `Oculus`）以及 `Amazon` 的虚拟商品版本。


    Facebook 的元宇宙收益巨大。它拥有地球上任何平台中最高的每日用户数、每日使用量和用户生成内容，第二高的数字广告支出百分比，数十亿资金，数千名世界一流的工程师，以及一位拥有多数投票权的创始人。其元宇宙资产也在迅速发展，现在包括半导体专利和脑机计算接口。不幸的是，Facebook
    作为允许第三方开发者/公司构建长期企业的平台，作为联盟的牵头者（例如 `Libra`），以及在管理用户数据/信任方面，其记录却是糟糕的。


    # 亚马逊


    亚马逊在多种方面都很迷人。它当然会渴望成为我们购买“东西”的主要地点。无论是通过游戏引擎、虚拟环境还是网页浏览器购买，都无关紧要（它已经在 `Twitch`
    内销售）。此外，该公司已经拥有数亿张信用卡，全球最大的电子商务份额（不包括中国），是世界最大的云供应商，运营着各种消费者媒体体验（视频、音乐、电子书、有声书、视频游戏直播等）和第三方商务平台（例如
    `Fulfilled by Amazon`、`Amazon Channels`），并且正在开发他们希望成为第一个专为云构建的主要游戏/渲染引擎的东西。


    更重要的是，该公司的创始人兼 CEO Jeff Bezos 是基础设施支出的坚定信徒。例如，`AWS` 为互联网提供动力（`Amazon Web Services`）。亚马逊不直接买卖库存，而是销售、打包和分销其他公司提供的产品，其中“`Fulfilled
    by Amazon`”占亚马逊收入的 80%（与大多数零售商类似）。虽然 Elon Musk 的私人火箭企业 `SpaceX` 旨在殖民火星，但 Bezos
    已表示他对 `Blue Origin` 的目标是“在轨道上创建巨型芯片工厂，然后只将小零件发送下来”，类似于早期的 Web 协议和他的 `AWS`。因此，亚马逊比任何其他
    FAAMG 公司都更有可能拥抱完全“开放”的元宇宙——它不需要控制 UX 或 ID，因为它从后端基础设施使用和数字交易的巨大增长中受益。


    # Google


    互联网是数据的金矿，元宇宙将拥有比现有网络更多的数据和潜在的更高产出。而且没有哪家公司能比 Google 更好地在全球范围内利用这些数据。此外，该公司不仅是索引数字世界和物理世界的行业领导者（近
    10,000 名员工参与地图操作），也是中国以外最成功的数字软件和服务公司。它还运行着地球上最流行的操作系统（`Android`）以及主要消费计算平台中最开放的平台（`Windows`）。尽管失败了，Google
    是第一个全力投入可穿戴计算的公司，推出了 `Google Glass`。它现在正通过 `Google Assistant`、其 `Nest` 产品套件和 `FitBit`
    大力推进房屋数字化。因此，元宇宙可能是唯一能够将 Google 迄今为止的各项投资整合在一起的项目，包括 `Stadia` 边缘计算、`Project Fi`、`Google
    Street View`、巨大的暗纤维采购、可穿戴设备、虚拟助手等。


    # 联合努力


    它不太可能控制或驱动底层元宇宙。诚然，它拥有世界第二大计算机平台（而且远为最有价值），以及世界最大的视频游戏零售商（这也意味着它支付给开发者的钱比地球上任何其他人都多）。此外，该公司正在大力投资增强现实设备和将有助于元宇宙的“连接组织”（例如
    `beacons`、`Apple Watch`、`Apple AirPods`）。但是，另一方面，Apple 的态度和商业模式与构建一个任何人都可以访问完整用户数据和设备
    API 范围的开放创新平台不兼容。Apple 更有可能成为西方世界与元宇宙之间的主要沟通方式，而不是操作者/驱动者。这，如同互联网一样，几乎肯定将惠及所有人。


    # Unity


    如果元宇宙需要资产、体验和共享 API 的广泛交互，那么 `Unity` 将至关重要。这个引擎被用于超过一半的移动游戏。它在现实世界渲染/模拟用例（建筑、设计和工程）中甚至比
    `Unreal` 更受欢迎。例如，在使用 `Unity` 制作和拍摄逼真的《狮子王》时，电影制作人 Jon Favreau 也在使用 `Unreal` 制作和拍摄迪士尼的《曼达洛人》。它还控制着世界上最大的数字广告网络之一（为
    100 亿每日分钟的移动娱乐提供动力的一个不错的副作用）。


    另一方面，`Unity` 在推动元宇宙发展中的作用尚不清楚。它没有商店，没有登录系统，也没有真正的面向消费者的体验。其大部分辅助服务（非引擎或广告）很少被使用。此外，大多数（但并非全部）基于
    `Unity` 的游戏仅仅是移动游戏，而不是元宇宙入口。考虑到它对规范、游戏时间和内容制作的不可避免的影响，很难想象它不会被收购并合并到一家拥有更多资产和优势的更大的科技企业中。


    '
