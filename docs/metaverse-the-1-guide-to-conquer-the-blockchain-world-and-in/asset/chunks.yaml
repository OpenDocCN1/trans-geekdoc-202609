    \ them in what appear to be their actual hands at other times.\n\nThis demonstration\
    \ raises far more questions than it responds to.\n\nOn some levels, this is acceptable.\
    \ Microsoft, Meta, and every other company that does bizarre demos like this is\
    \ seeking to convey an artistic sense of what the future might be like, rather\
