- raw: 'In 2021, businesses in the Metaverse are implementing decentralized notions
    to develop more efficient procedures. While the Metaverse is difficult to describe,
    William Herkelrath, head of business development at Chainlink Labs, a decentralized
    oracle network, told Cointelegraph that he believes it is a collection of ecosystems
    that are naturally arising out of decentralized finance or Defi:


    "Enterprises will be required to establish ecosystems in the Metaverse because
    they must interact with the outside world." Consumers, for example, want to use
    loyalty programs outside of single platforms, so they''ll choose brands that offer
    incentives that can be used across many ecosystems. In addition, data, physical
    assets, commercial, and financial assets can all be built up in a layer outside
    of a centralized system in the Metaverse."


    The Metaverse for enterprises


    While the notion may appear futuristic, a growing number of blockchain-based businesses
    are beginning to embrace the Metaverse. This topic was examined in depth during
    a panel titled "Building the Enterprise Multiverse" at the European Blockchain
    Convention''s virtual conference last Wednesday.


    During the conversation, David Palmer, the blockchain lead at Vodafone Business,
    stated that the Metaverse is much more than a virtual environment where digital
    experiences may be had through games or social media networks. Palmer claims that
    the Metaverse is now being used to apply blockchain technology to financial concepts
    such as central bank digital currencies, nonfungible tokens, NFTs, and Defi.


    However, Palmer pointed out that the Metaverse is missing a layer that allows
    virtual transactions to be transferred to the actual world. A cell phone, according
    to Palmer, can operate as a middleman between these two worlds. Vodafone Business
    is using blockchain to establish digital identities that can be used in both the
    Metaverse and real life, he added to Cointelegraph:


    "Digital identification will bridge the gap between the digital and physical worlds."
    A digital wallet, for example, will have a bank account, mortgage information,
    tokens, and NFTs, among other things. A decentralized identity, on the other hand,
    will have access to those credentials, allowing people to participate in both
    the Metaverse and the real world."


    Palmer revealed that Vodafone Business is developing virtual identity wallets
    for mobile devices. Additionally, in recent research titled "The Metaverse, Web
    3.0 Virtual Cloud Economies," Greyscale Research discussed the concept of self-sovereign
    identity in a multiverse. Self-sovereign identification is described as an "internet-native
    social reputation coin (creator coins)" in the study, mentioning that data from
    other platforms can be imported into the Metaverse and utilized for identity or
    credit score.


    During the discussion, Angel Garcia, Telefonica''s head of global supply chain
    strategy and transformation, described how a digital supply chain for the Metaverse
    might help telcos become more efficient. Telefonica, according to Garcia, has
    created a blockchain network that will be used within the Metaverse ecosystem.
    He went on to say that the organization is actively gathering data to optimize
    end-to-end operations. "The next stage will be to automate those business operations
    and centralize them for everyone," he said.


    Businesses can have a digital twin of their autonomous organization to govern,
    operate, and control analog processes, according to Rowan Fenn, co-founder of
    rising X, an enterprise solution for companies looking to build autonomous digital
    organizations: "These organizations will be able to interact and transact with
    each other in real-time in a Multiverse." This will also allow the autonomous
    digital groups to collaborate."


    Companies having a digital twin in a Multiverse ecosystem, according to Fenn,
    will be able to generate more goods and services while using fewer resources.
    As a result, he believes that the world will transition from a finite to an unlimited
    economy by using this business model.


    Businesses are already using blockchain in the Metaverse.


    While businesses are researching early use cases for implementing business models
    in the Metaverse, certain industries are already doing so. The use of blockchain
    networks in the insurance industry, for example, demonstrates a Metaverse business
    model, according to Herkelrath.


    Hundreds of thousands of insurance contracts are being sold to farmers around
    the world through virtual ecosystems, according to Herkelrath. He went on to say
    that smart contracts built on top of blockchain networks, as well as decentralized
    oracles like Chainlink, have made it possible to overcome the insurance industry''s
    transparency issues. Furthermore, the entire insurance procedure has been streamlined
    to make it internationally available to alienated clients.


    Although it may appear that blockchain alone has enabled this, Herkelrath points
    out that smart contracts created by insurance companies require data that couldn''t
    be acquired without the Metaverse:


    "You have a metaverse of companies with data flowing in that is confirmed by a
    larger network, which makes this viable." The fact that this can happen in the
    Metaverse shows that business-to-consumer transactions can become affordable and
    available to anyone anywhere."


    How likely is it that businesses will embrace the Metaverse?


    While some businesses are beginning to design and use Metaverse business models,
    a lack of understanding of the technology may slow adoption. During the panel
    discussion, Rodolfo Quijano, the head of a blockchain at Henkel, a German chemical
    and consumer goods company, stated that the main problem driving adoption now
    is recognizing the value that the Metaverse can give to businesses:


    "Technology isn''t an issue; nevertheless, people will need more time to understand
    what blockchain is and how it compares to traditional enterprise resource planning
    tools." Finding champions for blockchain adoption in the Metaverse can be difficult."


    "The largest aspect to address for a teleco is how to connect individuals in the
    Metaverse," Palmer said, adding that scalability within a Metaverse enterprise
    setting is also a concern, as is getting organizations to grasp how to transition
    and participate with this new technology. In addition, people will have two identities,
    one virtual and one real; thus, the concern is whether we will have enough communication
    bandwidth."


    Furthermore, Palmer believes that when it comes to Metaverse business models,
    firms would question the function of blockchain. He does, however, believe that
    technology is critical for these applications. "In a multiverse setting, blockchain
    is the trust and exchange layer. It''s a huge opportunity, but corporations will
    find it difficult to make the change."


    ## MARKETING IN THE METAVERSE


    Digital marketers must stay current with technological changes. Part of this entails
    comprehending the metaverse and its full potential. Marketers must recognize that
    the metaverse isn''t just a passing fad; it appears to be here to stay and poised
    to become the next big thing.


    What techniques may marketers employ as the metaverse expands?


    Marketers must remember the relevance of millennials and Gen Zers as a target
    audience first and foremost. These generations are also interested in metaverses,
    such as games like Roblox and technologies like virtual reality. With that in
    mind, let''s look at how marketing can be done in the metaverse.


    Within real-life marketing, there is parallel metaverse marketing.'
