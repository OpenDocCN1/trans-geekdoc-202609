    Not only is the demand for metaverse experiences growing, but so is the price
    of metaverse land, according to DappRadar. Last week, metaverse land plot NFTs
    in various virtual worlds accounted for five of the ten most expensive NFT transactions.


    According to the data, the top grosser was the Fashion Street Estate in Decentraland,
    which changed hands for 618.000 MANA, or $2.42 million. However, an Axie Genesis
    plot – the most valuable territory in yet another stand-alone metaverse game –
    sold for 550 Ethereum last month (ETH). According to a tweet from the creators,
    this purchase was "the greatest sale ever for a single piece of digital property,"
    with 550 ETH worth $2.48 million as of Dec. 3.


    Axie Infinity, Denctraland, and Metaverse Gaming are just a few of the games available.


    "Lunacia, the Axie motherland, is divided into tokenized parcels of land that
    operate as residences and bases of action for its Axies," according to the Axie
    Infinity whitepaper. Plots can be improved over time with a range of resources
    and crafting ingredients gathered throughout the game."


    According to the developer whitepaper, Lunacia comprises 90,601 plots of land
    that are represented as NFTs and can be freely sold by users. However, the Genesis
    property in question is highly valuable due to its scarcity: the game''s 90,601
    plots contain only 220 Genesis plots.


    This expansion of the "creative economy," also known as "play-to-earn," allows
    users to own their digital assets as NFTs, exchange them with others in the game,
    and occasionally transport them to other digital experiences, according to recent
    research from Grayscale Investments. As a result, projects like Decentraland are
    constructing an open-world metaverse in which users can log in to play games and
    earn MANA (Decentraland''s native currency), which can be used to buy NFTs like
    as LAND or collectibles), vote on economic governance, or build NFTs. In addition,
    this architecture provides users with significant interoperability between systems
    as a value proposition for their time spent in-game.


    Land in the metaverse, according to Matt Maximo, research analyst at Grayscale
    Investments and co-author of the report, is a fascinating concept because traditional
    real estate is valued largely based on proximity to shops, services, and other
    people – you''re limited by the time it takes to travel from your home.


    Players in several metaverses, such as Decentraland, can teleport worldwide, making
    travel quick and unrelated to valuation. Given the developing nature of the market,
    many of the higher-priced sales have come from LAND lots in desirable locations,
    such as proximity to prominent metaverse attractions.


    "Investing in LAND is exciting, but it carries the same risks as any other emerging
    market." LAND and MANA owners are motivated to keep the Decentraland map small
    and maintain the number of parcels low, but "there will come a time where enlarging
    the map and producing more LAND to sell will benefit them more than the dilution
    of their property," he explained.


    He went on to say that because LAND plots are non-fungible tokens, liquidity is
    considerably lower than with the underlying tokens like MANA.


    "If you''re in a hurry to sell, you can be compelled to sell below market value
    to the highest bidder, whereas if I have MANA, I can go to an exchange like Uniswap
    or Coinbase and make the sale instantaneously," he added.


    ## In the Metaverse, Is There an Infinite Land?


    While the metaverse''s rising options have greatly incentivized property purchase
    as a way for players to stake their claim in a virtual environment, one potential
    difficulty is that land may be in limitless supply.


    "As a result, it''s difficult to predict how much land will be worth in the future,
    and buying today could be considered a dangerous investment." If digital land,
    for example, becomes oversupplied, supply-demand economics kicks in, and the price
    drops. However, for investors who wish to be among the first to own land in the
    digital world, the sheer amount of possibilities that the metaverse may be able
    to offer may outweigh the danger." BLOCKv & SmartMedia Technologies co-founder
    Reeve Collins told GOBankingRates.


    According to Eduardo Erlo, marketing manager of blockchain-based encrypted messenger
    Status, the frenzy of buying digital real estate could lead to a temporary slump.
    Erlo went on to say that because land in the metaverse is eternally abundant,
    paying a lot of money for it now might be a waste of money.

