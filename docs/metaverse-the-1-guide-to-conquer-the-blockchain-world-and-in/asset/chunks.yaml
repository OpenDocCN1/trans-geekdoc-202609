  trans: '


    用户和企业现在可以将现实世界的资产和服务转移到元宇宙，这是一个去中心化的虚拟环境。使用具有互操作性的区块链游戏的新型游戏模式，是将更多现实世界资产带入元宇宙的一种方法。


    其中一种选择是“玩赚”游戏概念，它能吸引并赋能区块链游戏玩家。玩家可以参与元宇宙中的游戏内经济，并通过依赖 NFT 获得其提供价值的激励，基本上是边玩边赚。在元宇宙中，玩赚游戏也是公平的，因为参与者保留其资产的完全所有权，而不是像大多数传统游戏那样由单一游戏实体拥有。


    假设你有兴趣参与这些游戏内的金融经济，那么 Binance NFT 的 IGO 启动提供了来自游戏项目的游戏内资产选择，玩家可以收集这些资产并将其整合到各种游戏环境中。此类游戏内
    NFT 需求量很大，这一点从 IGO 首发中可见一斑，所有 NFT 都在首日售罄。《我的邻居爱丽丝》（Alice）、《Axie Infinite》（AXS）等都是成功的玩赚游戏的例子。


    玩赚游戏公会也将有助于提升玩赚游戏的受欢迎程度。公会作为中介运作，购买游戏内 NFT 资源（如土地和资产），然后将其出租给希望在其虚拟世界中使用这些资源来获取回报的玩家。收益随后在玩赚公会之间分配。


    这通过允许没有必要资金参与公会的玩家获得一个开端，来促进一个开放和公平的经济。此外，公会降低了所有玩家进入玩赚游戏的门槛，确保每个人都有公平的机会参与元宇宙经济。总之，公会通过使
    NFT 资源对所有人更加可及，帮助在元宇宙中启动虚拟经济。


    收益公会游戏（YGG）就是其中一个例子。他们创建了一个元宇宙参与者的全球社区，这些参与者通过交换游戏内奖励来为虚拟世界做出贡献，并通过出租或出售 YGG 拥有的资产来获利。


    由于用户可以在 Binance NFT 等 NFT 平台上交换他们的 NFT 资产（如游戏内资产和数字房地产），因此游戏内资产可以具有现实世界的价值。游戏中提供的
    NFT 的经济价值由其在各种元宇宙模块中的应用决定。这允许用户创建他们想要的任何形式的内容，例如吸引广泛受众的热门资产、原创数字艺术品，或在游戏中赋予特定技能和外观的专用
    NFT。


    元宇宙支持一个开放和公平的经济，由区块链的不可更改性和透明度支持。此外，价格由供需的基本法则决定，该法则基于稀缺性以及 NFT 根据其适用性的链上价值，从而消除了炒作和人为价值通胀的可能性。


    Binance，元宇宙经济的辅助运作方式，体现在 NFT 的游戏发布中。每周的 IGO 启动提供来自游戏项目的关键游戏内资产，让玩家在 NFT 游戏行业中抢占先机。此外，独一无二的神秘盒子也会随之发布，包含各种适用于玩赚游戏的有价值物品。


    Binance NFT 二级市场允许用户查找和交易游戏内 NFT 物品。此外，为了帮助 NFT 新手，Binance NFT 在主页和排行榜上策划了一套每日
    NFT 集合和创作者的建议，以推广顶级的 NFT 销售、集合和生产者。


    ## 身份、社区和社交体验的扩展


    NFT 也将在元宇宙的身份、社区和社交互动中发挥关键作用。例如，用户对某个项目的支持或对虚拟世界和现实世界的看法，可以通过持有特定的 NFT 资产来传达。这使得持有相似
    NFT 的人能够形成社区、分享经验并共同创作内容。流行的 NFT 头像就是此类 NFT 的一个例子。


    玩家的真实或想象中的自我由其 NFT 头像代表。NFT 头像可以用作访问令牌，以进入并在元宇宙的不同部分之间跳转。在这种情况下，NFT 头像作为我们现实生活身份的延伸，允许我们在元宇宙中完全控制和独立地策划和创建我们的虚拟身份。


    头像 NFT 提供了对各种独特元宇宙和现实世界活动的虚拟会员资格，促进社区和社交互动。通过内容创作和公司启动，NFT 头像已经在帮助定义元宇宙的体验和环境。


    例如，无聊猿游艇俱乐部和 CryptoPunks 系列为其持有者提供了独家权利和访问权限，分别进入受保护内容的富人封闭群体，甚至是线下独家活动。此外，通过带有
    NFT 相关入场费的独家派对，凸显了 NFT 作为连接数字世界和现实世界的价值载体的功能。


    要查找和获取 NFT 头像，请前往 Binance NFT 市场，那里有各种价格实惠的 NFT 头像选择。


    ## 虚拟房地产：房产所有权


    用户可以通过 NFT 在元宇宙中完全控制他们的虚拟土地和空间。此外，得益于底层区块链，用户可以证明物品的所有权，并按自己的意愿构建他们的虚拟房地产。


    元宇宙中虚拟房地产的一些用途包括：出售房产以获利、出租土地以获得被动收入、在现有土地上创建各种结构（如在线商店）以及举办社交聚会。


    Decentraland（最近与 Adidas 组织了一场虚拟时装展，作品作为 NFT 拍卖）就是元宇宙数字房地产场景的一个例子。音乐家尤其对虚拟房地产感兴趣，因为他们可以在线上演奏并出售
    NFT 门票和产品。


    ## 元宇宙的未来


    元宇宙虽然仍处于起步阶段，但通过使用 NFT，它提供了大量潜在的社会和财务机会，以及人们玩耍、互动、聚集、赚取和交易的新方式。


    元宇宙和 NFT 区块链游戏将成为 Web 3.0 的一个重要方面，这是一个时代，在这个时代中，现实世界的企业将扩展到数字领域，用户通过融合 VR、视频游戏、社交网络和加密货币的部分来发现此类环境的适应性。


    我们认为，NFT 所有权至关重要，并将在即将到来的元宇宙中打开一个充满可能性的世界。有兴趣探索元宇宙的用户可以使用 Binance NFT 市场来查找、积累和交换独特的
    NFT 资产。


    # CHAPTER 4


    # THE WEB 3.0


    如果你最近一直在阅读加密货币论坛或视频游戏新闻——或者看到从《纽约时报》招聘启事到疯狂的 Twitter 帖子等各种内容，声称常规的工作面试即将被基于区块链的“任务、冒险和课程来证明你的价值”所取代——你可能已经遇到了“Web3”这个术语。这个名称指的是互联网的第三代。然而，它仅仅是那些以数十万美元交易卡通猿
    NFT 并已经在元宇宙中规划虚拟豪宅的人们之间的行话吗？还是说，那些觉得我们仍然生活在 Web2 时代的人应该了解 Web3 及其所代表的这种不那么专注的互联网形式？这两个问题很可能都会得到肯定的回答。以下是对你后续问题的回答。


    ## Web3 究竟是什么？


