    It used to be tough to justify purchasing Unity. Despite the company''s high value,
    any possible acquirer must retain Unity entirely platform neutral to preserve
    market dominance, developer support, and influence (for example, Google couldn''t
    make Unity exclusive to or best on Android/Chrome without alienating a large number
    of developers). This implies that turning Unity into a proprietary engine isn''t
    a sound business decision. The value lost as a result of such a decision and the
    additional cost of purchasing Unity will very probably make such a move unaffordable.
    On the other hand, the goal of a Unity acquisition is to gain a key position on
    the new Internet, the buyer will be motivated to keep the engine open and available
    across platforms, and the price will become irrelevant quickly.


    If Epic does, Valve must have a viable way to the Metaverse. Valve''s Steam dominates
    the Epic Games Store regarding users, money, and playtime. In addition, it owns
    a handful of the most popular and long-running multiplayer games on the market
    (Counter-Strike, Team Fortress, DotA). Furthermore, the company has a strong track
    record of content and monetization innovation (it was the first to experiment
    at scale with AAA free-to-play games and with player-to-player marketplaces).
    Valve has also spent years creating and deploying virtual reality technology,
    is privately owned by a group of passionate programmers passionate about open-source
    technologies and despise closed settings, and produces billions in annual earnings.
    Valve''s Source engine, on the other hand, has seen little adoption. Unlike Epic,
    it does not appear to be focused on integrating its capabilities and assets to
    develop the Metaverse.


    # Why Do Holograms Play a Role in the Metaverse?


    When the internet was first introduced, it was accompanied by a slew of technological
    achievements, including the ability to connect computers across large distances
    and the ability to link one web page to another. These technical characteristics
    provided the foundation for the abstract structures we now associate with the
    internet, such as webpages, apps, social networks, and everything else that relies
    on them. That''s without considering the convergence of non-internet interface
    innovations such as displays, keyboards, mice, and touchscreens, which are still
    required to make the internet work.


    With the metaverse, there are some new building blocks in place, such as the ability
    to host hundreds of people in a single instance of a server (future versions of
    a metaverse should be able to handle thousands, if not millions) and motion-tracking
    tools that can distinguish where a person''s hands are. These new technologies
    have the potential to be extremely intriguing and futuristic.


    There are, however, some limitations that may prove impossible. Companies like
    Microsoft and Fa—Meta show off imaginary videos of future concepts, they frequently
    gloss over how people will interact with the metaverse. VR headsets are still
    awkward, and wearing them for long periods causes motion sickness or physical
    pain in most people. Aside from the not-insignificant barrier of figuring out
    how to wear augmented reality glasses in public without looking like huge dorks,
    augmented reality glasses have another issue.


    So, how do IT companies demonstrate the concept of their technology without displaying
    the reality of massive equipment and strange glasses? So far, it appears that
    their main choice is to develop technology from the ground up. Is it the holographic
    woman who appeared during Meta''s speech? I''m sorry to break the news, but it''s
    simply not possible, even with the most advanced versions of existing technology.


    Unlike motion-tracked digital avatars, which are a little janky right now but
    could be better tomorrow, there is no janky way of making a three-dimensional
    picture appear in midair without precisely regulated circumstances. Regardless
    of Iron Man''s assertions. Perhaps these are meant to be seen as images projected
    through glasses—after all, both women in the demo video are wearing glasses—but
    that assumes a lot about the physical capabilities of small glasses, which Snap
    can attest to being a difficult challenge to solve.


    This kind of deception of reality is widespread in film demonstrations of how
    the metaverse may work. Is this person wearing virtual reality goggles or simply
    sitting at a desk? Is this person fastened to an immersive aerial rig or simply
    sitting at a desk? Another of Meta''s demos showed individuals hovering in space—is
    this person strapped to an immersive aerial rig or just sitting at a desk? Is
    the hologram''s subject wearing a headset, and if so, how is their face scanned?
    A person may take virtual things but hold them in what appear to be their actual
    hands at other times.


    This demonstration raises far more questions than it responds to.


    On some levels, this is acceptable. Microsoft, Meta, and every other company that
    does bizarre demos like this is seeking to convey an artistic sense of what the
    future might be like, rather than addressing every technology challenge. It''s
    a long-standing tradition that extends back to AT&T''s display of a voice-controlled
    folding phone that could magically erase people from photos and create 3D models,
    all of which seemed impossible at the time.


    On the other hand, this form of wishful-thinking-as-tech-demo puts us in a position
    where it''s difficult to anticipate which aspects of diverse metaverse ideas will
    become reality one day. For example, the idea of a virtual poker game where your
    friends are robots and holograms floating in space could become a reality if virtual
    reality and augmented reality headsets become comfortable and affordable enough
    for people to wear daily—a big "if"—comes true. If not, you could always play
    Tabletop Simulator through a Discord video conference.


    The gloss and glam of VR and AR also obscures the metaverse''s more mundane aspects,
    which are more likely to manifest. For example, it would be trivially easy for
    software companies to create an open digital avatar standard, a form of file that
    contains features you would enter into a character creator—like eye color, hairstyle,
    or wardrobe options—and allows you to carry it around with you everywhere you
    go. There''s no need to make a more comfortable VR headset for that.


    # CHAPTER 2: UNDERSTANDING AUGMENTED REALITY AND HOW IT WORKS


    Today is the period of computer-mediated, tech-enhanced lives. People want more
    than just to live in the physical world; they want the deeper experiences that
    technological advancement allows them to have. One of these breakthroughs is augmented
    reality (AR), a technology that allows individuals to dance with celebrities,
    travel to faraway places, visit other planets, and even journey back in time –
    all from the comfort of their own homes. If you want to embrace technological
    change and understand more about augmented reality, keep reading to learn what
    it is and how it works.


    # What is Augmented Reality, and how does it work?


    So, what exactly is augmented reality? Because the human experience is fundamentally
    distinct from the technical notion it represents, it''s difficult to define "augmented
    reality." However, in its broadest definition, AR technology can be defined as
    a perspective of a physical environment enhanced by computer-generated visual
    and/or audio features.


    # Brief History of AR

