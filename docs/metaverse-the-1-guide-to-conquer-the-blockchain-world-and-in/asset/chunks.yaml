    社区、公司和使用代币产生收入的项目，并不总是会将收益直接分配给代币持有者。回购/代币销毁的想法引起了广泛关注，成为 Binance（BNB）和 MakerDAO（MKR）代币的一个方面。随着收入流入项目（通过
    Binance 交易费和 MakerDAO 稳定费），原生代币从公开市场回购并销毁，导致代币供应量减少，价格上涨。查看 Arjun Balaji（The Block）的分析很有意思。他声称，Binance
    的代币销毁机制并不真正等同于股权回购：因为没有支付股息，所以“每代币收入”仍为 $0。


    ## 工作代币


    工作代币是一个完全专注于网络收入生成供应方的概念，旨在消除用户的摩擦。加密网络的商业模式之一是我们看到的“持水”。Augur 的 `REP` 和 Keep
    Network 的 `KEEP` 代币是两个很好的例子。工作代币的工作方式与传统的出租车执照相似。它们要求服务提供者质押/锁定特定数量的原生代币，以换取为网络执行有利可图工作的权利。工作代币范式最重要的特性之一，是其能够用胡萝卜加大棒（劳动奖励）（可被削减的质押）来激励参与者。它们还可以根据对服务提供者集体的可预测未来支付流进行评估，并通过激励服务提供者从事诚实工作（因为他们以劳动代币计价锁定了本金）来提供网络安全。简而言之，此类代币应根据归因于所有网络服务提供者的未来预测现金流进行定价，这可以基于网络定价和使用假设进行建模。


    正在调查的各种不同模型值得一提：


    • 双代币模型，例如 `MKR/DAI` 和 `SPANK/BOOTY`，其中一种资产吸收消费的波动起伏，而另一种保持稳定以实现最佳交易。


    • 治理代币使有机会影响费用和开发优先级等标准，并可作为一种分叉保险来估值。


    • 代币化证券是现有资产（股份、商品、票据或房地产）的数字表示，可能因可分割性和无国界流动性而带来溢价。


    • 为什么 BloXroute 和 Aztec Protocol 模型等功能的交易费一直在尝试一个财库，它接受微小的交易成本以换取其改进（例如，分别针对可扩展性和隐私）。


    • Starkware 团队提出的 Tech 4 Tokens，希望以代币为交换提供其技术作为投资，从而创建其合作的所有项目的财库。


    • 为协议提供 UX/UI，例如为 Augur 提供的 Veil 和 Guesser，以及为 MakerDAO 生态系统提供的 Balance，以换取微小费用或推荐和佣金。


    • 网络特定服务，例如质押（如 Staked.us）、CDP 管理器（例如，在 MakerDAO CDP 变得抵押不足之前进行补充）或市场管理服务（例如，OpenBazaar
    上的 OB1），这些可以收取传统费用（订阅或收入百分比）。


    • 在非产生收入的应用中具有产生收入商业模式的流动性提供者。例如，Uniswap 是一个自动化做市商，其唯一的收入来源是提供流动性对。


    随着如此多新商业模式的涌现和探索，很明显，虽然传统风险投资有其位置，但投资者和资本本身的角色正在改变。资本转变为网络中的原生资产，具有特定的功能需要履行。投资者需要为这种新的组织模式重新定位自己，这种模式由信任最小化的去中心化网络驱动，从被动的网络参与转向在现金承诺后引导网络（例如，计算工作或流动性提供），再到直接向网络注入定性工作（例如，治理或
    CDP 风险评估）。


    回顾过去，我们可以看到 Web 1.0 和 Web 2.0 都需要大量的试错来开发出正确的商业模式，从而造就了今天的科技巨头。当然，我们并未忽视 Web 3.0
    也将不得不经历类似的迭代过程，但一旦我们找到正确的商业模式，它们将非常强大。在无需信任的环境中，个人和企业将能够在不依赖寻租中介的情况下，在全新的层面上进行互动。


    成千上万的优秀团队已经在努力执行其中一些概念，或发现全新的可行商业模式。当然，由于这些模式可能不符合传统框架，投资者可能需要通过承担新角色并提供工作和资本（我们在
    Fabric Ventures 已经开始了这一旅程）来适应，但只要我们能看到可预测且合理的价值累积，加大投入就是有意义的，因为执行风险每天都在降低。


