    \ preserve market dominance, developer support, and influence (for example, Google\
    \ couldn't make Unity exclusive to or best on Android/Chrome without alienating\
    \ a large number of developers). This implies that turning Unity into a proprietary\
    \ engine isn't a sound business decision. The value lost as a result of such a\
    \ decision and the additional cost of purchasing Unity will very probably make\
    \ such a move unaffordable. On the other hand, the goal of a Unity acquisition\
    \ is to gain a key position on the new Internet, the buyer will be motivated to\
    \ keep the engine open and available across platforms, and the price will become\
