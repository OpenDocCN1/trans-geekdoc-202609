  trans: '


    # 2021 年，元宇宙中的企业正在实施去中心化理念以开发更高效的流程


    2021 年，元宇宙中的企业正在实施去中心化理念以开发更高效的流程。虽然元宇宙难以描述，但去中心化预言机网络 Chainlink Labs 的业务发展负责人
    William Herkelrath 向 Cointelegraph 表示，他认为元宇宙是去中心化金融（Defi）自然产生的一系列生态系统的集合：


    “企业将被要求在元宇宙中建立生态系统，因为它们必须与外部世界进行交互。”例如，消费者希望在单一平台之外使用忠诚度计划，因此他们会选择提供可在多个生态系统中使用的激励措施的品牌。此外，数据、实物资产、商业资产和金融资产都可以在元宇宙中构建在去中心化系统之外的一层上。”


    ## 企业元宇宙


    虽然这一概念可能看起来很未来主义，但越来越多的基于区块链的企业开始拥抱元宇宙。这一话题在上周三举行的欧洲区块链大会虚拟会议的一个名为“构建企业多元宇宙”的小组讨论中得到了深入探讨。


    在谈话中，Vodafone Business 的区块链负责人 David Palmer 表示，元宇宙远不止是一个可以通过游戏或社交媒体网络进行数字体验的虚拟环境。Palmer
    声称，元宇宙目前正被用于将区块链技术应用于中央银行数字货币、非同质化代币（NFT）和 Defi 等金融概念。


    然而，Palmer 指出，元宇宙缺乏一个允许将虚拟交易转移到现实世界的层。根据 Palmer 的说法，手机可以在这两个世界之间充当中介。他补充说，Vodafone
    Business 正在使用区块链建立可以在元宇宙和现实生活中使用的数字身份：


    “数字身份将弥合数字世界和物理世界之间的差距。”例如，数字钱包将拥有银行账户、抵押信息、代币和 NFT 等。另一方面，去中心化身份将能够访问这些凭证，使人们能够同时参与元宇宙和现实世界。”


    Palmer 透露，Vodafone Business 正在为移动设备开发虚拟身份钱包。此外，在最近题为“元宇宙、Web 3.0 虚拟云经济”的研究中，Greyscale
    Research 讨论了多元宇宙中自主身份的概念。该研究将自主身份描述为一种“原生互联网社交声誉代币（创作者代币）”，并提到其他平台的数据可以导入元宇宙并用于身份或信用评分。


    在讨论中，Telefonica 的全球供应链战略与转型负责人 Angel Garcia 描述了元宇宙的数字供应链如何帮助电信公司提高效率。根据 Garcia
    的说法，Telefonica 已创建了一个将在元宇宙生态系统中使用的区块链网络。他还表示，该组织正在积极收集数据以优化端到端运营。“下一阶段将是自动化这些业务运营并将其集中化供所有人使用，”他说。


    根据 rising X（一家为希望构建自主数字组织的公司提供企业解决方案的公司）的联合创始人 Rowan Fenn 的说法，企业可以拥有其自主组织的数字孪生体来管理、运营和控制模拟流程：“这些组织将能够在多元宇宙中实时相互交互和交易。”这还将使自主数字群体能够协作。


    Fenn 表示，在多元宇宙生态系统中拥有数字孪生体的公司将能够在使用更少资源的同时生产更多商品和服务。因此，他认为世界将通过使用这种商业模式从有限经济过渡到无限经济。


    ## 企业已在元宇宙中使用区块链


    虽然企业正在研究在元宇宙中实施商业模式的早期用例，但某些行业已经在这样做。例如，Herkelrath 表示，保险行业使用区块链网络体现了元宇宙商业模式。


    根据 Herkelrath 的说法，数十万份保险合同正在通过虚拟生态系统向全球农民销售。他还表示，构建在区块链网络之上的智能合约以及像 Chainlink
    这样的去中心化预言机，使得克服保险行业的透明度问题成为可能。此外，整个保险流程已被简化，使其对边缘化客户在国际上可用。


    虽然可能看起来仅靠区块链就实现了这一点，但 Herkelrath 指出，保险公司创建的智能合约需要没有元宇宙就无法获取的数据：


    “你拥有一个公司元宇宙，数据在其中流动并由更大的网络确认，这使得这变得可行。”能够在元宇宙中发生此事表明，企业对消费者的交易可以变得负担得起，并为任何地方的任何人提供可用性。”


    ## 企业拥抱元宇宙的可能性有多大？


    虽然一些企业开始设计和使用元宇宙商业模式，但对技术缺乏了解可能会减缓采用。在小组讨论中，德国化工和消费品公司 Henkel 的区块链负责人 Rodolfo
    Quijano 表示，目前推动采用的主要问题是认识到元宇宙可以为企业带来的价值：


    “技术不是问题；不过，人们需要更多时间来了解什么是区块链以及它与传统企业资源规划工具相比如何。”在元宇宙中寻找区块链采用的倡导者可能会很困难。”


    “电信公司需要解决的最大方面是如何在元宇宙中连接个人，”Palmer 表示，并补充说，元宇宙企业环境中的可扩展性也是一个问题，还有让组织了解如何过渡并参与这项新技术。此外，人们将拥有两个身份，一个虚拟，一个现实；因此，问题是我们是否会有足够的通信带宽。”


    此外，Palmer 认为，在元宇宙商业模式方面，公司将质疑区块链的作用。不过，他确实认为技术对这些应用至关重要。“在多元宇宙环境中，区块链是信任和交换层。这是一个巨大的机会，但公司会发现很难做出改变。”


    # 元宇宙中的营销


    数字营销人员必须跟上技术变化的步伐。其中一部分包括了解元宇宙及其全部潜力。营销人员必须认识到，元宇宙不仅仅是一个短暂的潮流；它似乎会长期存在，并有望成为下一个大事件。


    ## 当元宇宙扩张时，营销人员可以采用哪些技术？


    首先，营销人员必须记住千禧一代和 Z 世代作为目标受众的重要性。这些世代也对元宇宙感兴趣，例如 Roblox 等游戏和虚拟现实等技术。考虑到这一点，让我们看看如何在元宇宙中进行营销。


    在现实世界营销中，存在平行的元宇宙营销。


    '
