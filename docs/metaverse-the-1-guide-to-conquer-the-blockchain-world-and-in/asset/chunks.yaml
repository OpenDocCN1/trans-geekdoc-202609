    # Low Latency in AAA Online Multiplayer Games


    Low latency is required for the most engaging AAA online multiplayer games. This
    is because latency dictates how quickly a player receives information (e.g., where
    they are, if a grenade has been thrown, or whether a soccer ball has been kicked)
    and how quickly their response is relayed to other players. In other words, latency
    decides whether you win or lose, kill or die. This is why most modern games run
    at 2–4 times the usual video framerate and why we''ve quickly accepted these increases,
    despite our resistance to greater frame rates for traditional video. It''s a requirement
    for success.


    In video gaming, the human latency threshold is extremely low, especially compared
    to other mediums. Consider the distinction between a regular video and a video
    game. The average person will not notice if audio and video are out of sync by
    more than 45 milliseconds or 125 milliseconds (170ms total). The acceptance levels
    are much greater at 90 milliseconds early and 185 milliseconds late (275ms). When
    we don''t get a response after 200–250ms with digital buttons, such as a YouTube
    stop button, we assume our clicks have failed. Even non-gamers become annoyed
    after 50 milliseconds in AAA games, while non-gamers feel handicapped around 110
    milliseconds. Games are unplayable at 150ms. According to Subspace, a 10ms increase
    or decrease in latency reduces or increases weekly playtime by 6%. That''s a once-in-a-lifetime
    opportunity that no other company has.


    View the full-size version


    Let''s look at worldwide average latency with the above ranges in mind. The typical
    roundtrip time for data transported from one city to another and back in the United
    States is 35 milliseconds. Many pairings exceed this, particularly in densely
    populated areas with high-demand peaks (e.g., San Francisco to New York during
    the evening). Then there''s the ''city-to-user'' transit time, which is especially
    susceptible to delays. Cities, communities, and condominiums in densely populated
    areas can quickly become congested. And if you''re playing on a mobile device,
    4G technology adds another 40 milliseconds. Finally, if you live outside a big
    metropolitan center, your data may have to travel an additional 100 miles across
    ancient, badly maintained wireline infrastructure. The global median delivery
    latency varies between cities and spans 100 to 200 milliseconds.


    View the full-size version


    The online gaming industry has devised several partial fixes and hacks to manage
    latency. None of them, however, scale well.


    Most high-fidelity multiplayer gaming, for example, is based on server regions.
    Game publishers can reduce geographical latency by limiting the player roster
    to those in the Northeast United States, Western Europe, or Southeast Asia. This
    clustering works well enough because gaming is a leisure activity that is often
    enjoyed with one to three buddies. After all, you''re unlikely to play with someone
    who lives in a different time zone. And, in any case, you don''t care where your
    unknown opponents (with whom you normally can''t even communicate) live. Nonetheless,
    according to Subspace, about three-quarters of all internet connections in the
    Middle East are outside of playable latency limits for dynamic multiplayer games,
    whereas just a quarter is in the United States and Europe. This is primarily due
    to broadband infrastructure limits rather than server placement.


