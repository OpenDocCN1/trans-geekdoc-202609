    # Web 2.0 与 Web 3.0 商业模式分析


    ## Web 2.0 商业模式的演进


    在探讨 Web 3.0 所能实现的原生商业模式之前，我们先简要回顾那些常被遗忘但充满艰辛的历程，这些历程造就了 Web 2.0 惊人且难以预测的商业成功。


    让我们不要忘记 Google 从 1998 年到 2002 年的历程，随后于 2004 年上市，这为 Web 2.0 商业模式的发现过程奠定了基础：


    • 尽管流量很高，但他们在 1999 年明显因商业计划而受挫。“我们真的无法弄清楚商业策略；有一段时间情况看起来非常糟糕，”Mike Moritz（红杉资本）说道，他是他们的领投人。


    • 2001 年，Google 营收 8500 万美元，而 Overture 营收 2.88 亿美元，因为在 dot-com 泡沫破裂后，基于 CPM 的网络广告逐渐式微。


    • 2002 年，Google 推出了 AdWords Select，这是其自有的按点击付费、拍卖式搜索广告产品，基于 Overture 的广告策略。


    • 两年后，即 2004 年，Google 达到了全球 84.7% 的互联网搜索份额并上市，估值达 232 亿美元，年化营收 27 亿美元。


    经过四年的挣扎，商业计划中一个微小的改变使 Google 腾飞，最终成为世界上最有价值的公司之一。


    ### Web 2.0 商业模式内容回顾


    #### 在线内容


    早期的在线内容仅仅是将现有报纸和电话号码簿数字化……尽管如此，Roma（Alfonso Cuarón）的电影通过 Netflix 的订阅流媒体服务发行，如今已获得十项奥斯卡奖提名。


    #### 市场（Marketplaces）


    Amazon 最初是一家无人预期能盈利的在线书店……尽管如此，它已成长为一个巨大的市场，销售从园艺工具到健康食品再到云基础设施的各种商品。


    #### 免费开源软件


    爱好者和将软件视为公共可用共同体的乌托邦观念发起了开源软件的开发……尽管如此，如今整个互联网都运行在开源软件上，每年产生 4000 亿美元的经济价值，Github
    被 Microsoft 以 75 亿美元收购。相比之下，Red Hat 从 Linux 服务中每年获得 34 亿美元的收入。


    #### SaaS


    在 Web 2.0 早期，商业软件能通过浏览器交付并在经济上可行，这似乎难以想象……尽管如此，SaaS 模式如今已被大多数 B2B 组织采用。


    #### 共享经济


    很难想象有人会自愿坐进别人的车，或将沙发借给陌生人……然而，尽管 Uber 和 AirBnB 不拥有任何汽车或房屋，它们已成为世界上最大的出租车和住宿公司。


    #### 广告


    虽然 Google 和 Facebook 在早期发展迅速，但在其存在的前半段缺乏明确的收入策略……尽管如此，广告模式似乎过于契合它们。因此，它们现在占全球数字广告收入的
    58%（2018 年为 1110 亿美元），成为主导的 Web 2.0 经济模式。


    ## Web 3.0 新兴商业模式


    如果你回顾过去十年的 Web 3.0，你会发现早期的商业模式并不总是可重复或可扩展的，而且它们常常试图重现 Web 2.0 的概念。尽管对其可行性存在一些怀疑，但我们相信，一些最聪明的建设者的持续实验将在未来几年创造出极具价值的模式。


    我们希望通过调查现有和实验性的 Web 3.0 商业模式，了解一些更成熟和实验性的 Web 3.0 商业模式将如何在未来几年积累价值。


    • 原生资产的创建


    • 维护原生资产并扩展网络：


    • 与投机相关的税费（交易所）


    • 用于支付的代币


    • 代币应被销毁


    • 用于工作的代币


    • 其他模式


    ### 发行原生资产


    发行原生资产包括以下步骤：


    Bitcoin 是第一种加密货币。第一个拜占庭容错且完全开放的点对点网络是通过 Proof of Work 和 Nakamoto Consensus 建立的。其核心商业理念基于
    BTC，这是一种可证明稀缺的数字币，作为区块奖励分发给矿工。Ethereum、Monero 和 ZCash 等其他项目也效仿了这一做法，分别发行了 ETH、XMR
    和 ZEC。


    这些原生资产的价值来自于它们提供的安全性：通过为诚实矿工提供足够高的哈希算力激励，恶意行为者发动攻击的成本会随着原生资产价格的上涨而同步增加，而增加的安全性又会推动对该货币的进一步需求，从而提升其价格和价值。这些原生资产的价值已被彻底研究和衡量。


    ### 维护原生资产并扩展网络


    一些早期的加密网络公司只有一个目标：使其网络更具盈利性和吸引力。由此产生的商业模式可以概括为“增加其原生资产国库；构建生态系统”。例如，Blockstream
    作为最大的 Bitcoin Core 维护者之一，依赖其 BTC 资产负债表来创造价值。同样，ConsenSys 已发展到一千名员工，通过为以太坊生态系统构建关键基础设施来提升其持有的
    ETH 价值。


    虽然这将公司与网络正确地联系起来，但这种方法在最初几家公司之后就难以复制：积累足够大的本地资产余额最终变得不切实际……如果没有足以带来指数级回报的重大投资，创立和维护一家公司所付出的血汗泪水就无法得到合理化。例如，除了中央银行（如美国汇款服务）之外，任何公司仅通过持有巨额
    USD 并致力于改善美国经济来建立业务，都是不合理的。


    ### 对原生资产投机价值征税


    下一代商业模式专注于为这些原生资产建立金融基础设施，包括交易所、托管机构和衍生品供应商。它们都是以一个目标创建的：为希望对这些高风险资产进行投机的用户提供服务。虽然
    Coinbase、Bitstamp 和 Bitmex 等组织已成长为数十亿美元的企业，但它们并非垄断性的，因为它们提供便利并增加了其底层网络的价值。公司无法通过提供“独家访问”来锁定垄断地位，因为底层网络是开放且无需许可的，但其流动性和品牌随着时间的推移提供了可防御的护城河。


    ### 支付代币


    随着代币销售的兴起，新一波区块链项目将其商业模式建立在网络内的支付代币之上，通常形成双边市场，并要求所有支付都使用原生代币。根据假设，随着网络经济的增长，对受限原生支付代币的需求会增加，从而导致代币价值上升。虽然这种代币范式的价值积累存在争议，但对客户的额外摩擦是显而易见的。原本可以用
    ETH 或 DAI 支付的东西，现在需要在交易双方进行额外的兑换。虽然这种范式在 2017 年代币热潮期间很流行，但其诱发摩擦的特性在过去九个月里将其推到了开发队列的后面。


    ### 销毁代币

    '
