    Communities, corporations, and initiatives that generate revenue using a token
    may not always pass earnings on to token holders directly. The idea of buybacks
    / token burns sparked a lot of interest as one of the aspects of the Binance (BNB)
    and MakerDAO (MKR) tokens. Native tokens are bought back from the public market
    and burned as revenue flows into the project (through Binance trading fees and
    MakerDAO stability fees), resulting in a decrease in the supply of tokens and
    a price increase. It''s interesting looking at Arjun Balaji''s analysis (The Block).
    He claims that the Binance token burning mechanism doesn''t truly result in an
    equity buyback: because no dividends are paid out, the "income per token" remains
    at $0.


    ## Work Tokens


    The work token is a concept that focuses completely on the revenue-generating
    supply side of a network to eliminate friction for users. One of the business
    models for crypto-networks is that we see ''hold water.'' Augur''s `REP` and Keep
    Network''s `KEEP` coins are two good examples. Work tokens work in a similar way
    to traditional taxi medallions. They demand service providers to stake/bond a
    particular quantity of native tokens in exchange for the right to perform profitable
    work to the network. One of the most significant properties of the work token
    paradigm is its ability to incentivize actors with a carrot and a stick (rewards
    for labor) (a stake that can be slashed). They can also be judged based on predictable
    future payment flows to the collective of service providers and provide network
    security by motivating service providers to do honest work (as they have locked
    skin in the game denominated in the labor token). In a nutshell, such tokens should
    be priced based on future predicted cash flows attributed to all network service
    providers, which may be modeled out based on network pricing and usage assumptions.


    A variety of different models are being investigated and are worth mentioning:


    • Dual token model, such as `MKR/DAI` and `SPANK/BOOTY`, in which one asset absorbs
    the volatile ups and downs of consumption while the other is kept stable for optimal
    transactions.


    • Governance tokens enable the opportunity to influence criteria such as fees
    and development priorities and can be valued as a form of fork insurance.


    • Tokenised securities are digital representations of existing assets (shares,
    commodities, bills, or real estate) with a possible premium for divisibility and
    borderless liquidity.


    • Why Transaction fees for features like the BloXroute and Aztec Protocol models
    have been experimenting with a treasury that accepts a tiny transaction cost in
    exchange for its improvements (e.g., scalability & privacy, respectively).


    • Tech 4 Tokens, as proposed by the Starkware team, wants to offer its technology
    as an investment in exchange for tokens, thereby creating a treasury of all the
    projects they work on.


    • Providing UX/UI for protocols, such as Veil and Guesser for Augur and Balance
    for the MakerDAO ecosystem, in exchange for minor fees or referrals and commissions.


    • Network-specific services, such as staking (e.g., Staked.us), CDP managers (e.g.,
    topping off MakerDAO CDPs before they become undercollateralized), or marketplace
    administration services (e.g., OB1 on OpenBazaar), which can charge traditional
    fees (subscription or as a percent of revenues)


    • Liquidity providers with revenue-generating business models in non-revenue-generating
    applications. Uniswap, for example, is an automated market maker whose sole source
    of revenue is the provision of liquidity pairs.


    With so many new business models emerging and being explored, it''s apparent that
    while traditional venture capital has a place, the role of the investor and capital
    itself is changing. The capital transforms into a native asset within the network
    with a specific function to fulfill. Investors will need to reposition themselves
    for this new organizational mode, which is driven by trust-minimized decentralized
    networks, moving from passive network participation to bootstrapping networks
    after cash commitment (e.g., computational work or liquidity provision) to direct
    injections of qualitative work into the networks (e.g., governance or CDP risk
    evaluation).


    Looking back, we can see that Web 1.0 and Web 2.0 required a lot of trial and
    error to develop the right business models that resulted in today''s tech titans.
    Of course, we''re not ignoring the fact that Web 3.0 will have to go through a
    similar iterative process, but once we find the right business models, they''ll
    be incredibly powerful. In trust-free environments, individuals and businesses
    will be able to interact on a whole new level without relying on rent-seeking
    intermediaries.


    Thousands of brilliant teams are already working to execute some of these concepts
    or uncover entirely new feasible business models. Of course, because the models
    may not fit traditional frameworks, investors may need to adapt by taking on new
    roles and providing work and capital (a journey we have already begun at Fabric
    Ventures), but as long as we can see predictable and rational value accrual, it
    makes sense to double down, as the execution risk diminishes every day.


