    V》。它是上个十年中最受欢迎的游戏之一，并且至今仍是该公司的主要收入来源。


    之所以能实现这一点，是因为 Take-Two Interactive 在《GTA V》发行的同时推出了《GTA Online》。《GTA Online》是一个设定在虚构的南加州大都市圣安德烈亚斯的虚拟环境。自推出以来，Take-Two
    一直为《GTA Online》社区发布升级和扩展内容，这些内容推动了虚拟商品和服务的消费。《GTA Online》可能是目前运行中最好的“活元宇宙”示例，尽管其沉浸感不如虚拟现实头显（至少目前还不如）。


    《GTA Online》将于 2022 年 3 月作为独立游戏发布，以增加能够在虚拟世界中互动的人数。《GTA VI》的最终发布（无论何时）几乎肯定会导致《GTA
    Online》宇宙中更多的重复互动。随着未来十年虚拟世界变得更加沉浸，《GTA Online》无疑也会变得更加沉浸，这将惠及任何 Take-Two Interactive
    的所有者。


    ## 3\. Roblox


    另一只元宇宙股票是 Roblox (`NYSE: RBLX`)，但它与 Match Group 和 Take-Two Interactive 相比“颠倒了剧本”。Roblox
    不是创建自己的类元宇宙体验，而是为其他开发者提供工具，以便他们为用户创建虚拟世界。你可以将其视为视频游戏和虚拟世界创建领域的 YouTube。


    Roblox 用户的大部分年龄在 18 岁以下；因此，该平台的体验大多面向儿童。然而，该公司相信，随着时间的推移，它将能够改进其图形制作工具，使其游戏更接近
    Take-Two 等专业工作室发布的游戏。第三季度后，Roblox 拥有 4730 万日活跃用户 (`DAUs`)，已经是一个庞大的在线社区。这些客户正在大量消费
    Robux，这是平台的游戏内货币，开发者可以利用它提供游戏内体验或物品。（Roblox 通过抽取每笔交易的一定比例来获利。）


    Roblox 的净预订量（其销售衡量指标）在第三季度达到 6.378 亿美元，产生了 1.706 亿美元的自由现金流。如前所述，该平台目前面向儿童，而 Roblox
    正在打造世界上最纯粹的元宇宙系统之一。因此，如果你相信未来几十年越来越沉浸和虚拟的世界的趋势将继续，Roblox 可能是你投资组合中一个极佳的长期复利增长股。


    ### 10 只我们比 Match Group 更看好的股票


