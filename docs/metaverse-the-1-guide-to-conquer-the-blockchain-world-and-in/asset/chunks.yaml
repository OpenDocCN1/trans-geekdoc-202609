  trans: '


    土地相邻性是 Decentraland 及其他元宇宙中一个基本的经济概念。在有限的地理范围内，所有元宇宙地块都在固定点上相连。由于房产供应有限，这就导致了稀缺性。而稀缺性使得房产价值能够遵循普遍的供需法则而上涨或下跌。


    根据 Decentraland 的宣言，因此构建了一个基于“由现有土地所有权和内容分发层驱动的社会体验”的基础。


    推动元宇宙运转的房产交易之所以成为可能，得益于 NFT。这些代币提供了比任何土地契据都更安全的不可否认的所有权证明。


    “你根本无法伪造元宇宙的房产权利，因为智能合约的定义方式和 NFT 的编程方式，”Anziani 解释道。“你知道你拥有一项资产，并可以建立完全的所有权。”然后你可以根据该虚拟环境的规则和条件来主张所有权权利。”


    伦敦、纽约或东京待售房产


    这场房地产革命的影响已经被强烈感受到。例如，数字房产投资基金 Republic Realm 在六月为 Decentraland 中的一块土地支付了近 90
    万美元。该地块正在被 Republic Realm（由投资基金 Republic 控制）改造成一个名为 Metajuku 的虚拟商场，模仿东京的原宿地区。


    很快，房地产投资信托（REITs）就会开始根据这些行为在元宇宙中寻找机会。房产价值会随着经济同步上涨和下跌，在 Decentraland 中不断扩张。当其开发者在
    2017 年推出虚拟世界时，他们心中想的正是这一点。


    根据元宇宙的宣言，“Decentraland 对应用程序开发者的价值主张在于，他们可以充分利用其程序与用户之间的经济互动。”此外，“平台必须促进三种事物的交易：货币、产品和服务”，以实现这些经济联系。


    时尚是最早认识到 NFT 和元宇宙财务潜力的行业之一。Burberry 为 Blankos Block Party 视频游戏设计了 NFT 配饰，而 Louis
    Vuitton 则发布了其自身的 NFT 视频游戏 LOUIS THE GAME。


    与此同时，元宇宙的定制鞋匠 RTFKT 创建了限量版 NFT 运动鞋，这些运动鞋可以在虚拟世界中穿着，并已售出数百万美元。


    在元宇宙铁器时代如此强劲的势头下，基于 NFT 技术的虚拟世界经济模型承诺带来巨大的规模经济。


    “五个月前，全球加密货币用户还只有 1 亿。”Anziani 说。“我们现在拥有超过 2 亿用户。”“我们坚信，元宇宙——虚拟世界与区块链技术的结合，特别是
    NFT——将是下一波达到十亿或二十亿用户的浪潮。”


    ## 2022 年值得投资的前 11 种元宇宙加密货币


    想象一个不受你生活中具体事实束缚的宇宙。在这个平行现实中，你可以工作、玩耍、放松，并与来自世界各地的人交流。你可以参加派对、创作精彩艺术，并积累财富。你可以实现任何你立志要做的事情。这不是科幻小说：这是元宇宙，而加密货币是进入它的钥匙。


    尽管元宇宙区块链技术仍在开发中，但数字宇宙的概念已非常成熟，拥有数十年的历史。元宇宙是由先驱者和科幻作家构想的一种概念，他们梦想找到一种方法，超越我们世界的物理限制，去探索新的边疆并创造新的可能性。元宇宙让你在数字成功中达到新的高度，前往新的世界，并以新颖的方式与朋友和家人互动。


    Mark Zuckerberg 是最近涉足元宇宙的人物，并且对此大肆宣传。然而，尽管 Facebook（现称为 Meta）是一个庞大而强大的组织，它既不是第一个也不是最后一个对元宇宙概念着迷的公司。毕竟，元宇宙是互联网的下一次演进，单一公司既无法控制互联网，也无法控制元宇宙。然而，每个参与的公司都将影响元宇宙的架构，以及它未来的样子。


    ### 什么是元宇宙，它是如何工作的？


    元宇宙首次在 Neal Stephenson 1992 年的赛博朋克小说《雪崩》中被详细描述，当时他创造了一个“元宇宙”。Stephenson 使用虚拟现实眼镜和共享光纤网络来定义一个共享的数字宇宙。他的元宇宙包含日常普通场景的虚拟复制品，从公园和建筑物到异国情调且极其有趣的领域，在那里只有个人想象力的规则和限制适用。


    自从 Zuckerberg 将其定义为“互联网的下一章”以来，公众对元宇宙的兴趣已经爆发。这个元宇宙拓宽了你的视野，为你提供了做任何你选择的事情的自由，无论是社交、工作、玩耍、购买、创作，还是了解新地方和新想法。元宇宙不仅将整个物理宇宙置于你指尖，还将你思想的力量掌握在你手中。


    你将在元宇宙中拥有自己的虚拟家园，并通过一个在线化身与他人交流，该化身让你可以自由移动、说话和行动。你将完全掌控自己的生活，包括拥有虚拟房产的机会，就像拥有真实房地产一样。你甚至可以开发一项房产，例如艺术品或建筑物，并将其出售给其他元宇宙用户，以换取非同质化代币（NFT）或其他形式的付款。


    NFT 是一种游戏内货币和收藏品。用户参与玩赚模式，用虚拟商品或房产交换代币，这些数字资产构成了其虚拟经济的基础。他们还可以将元宇宙加密货币出售给其他用户，或将其投资以赚取利息或其他收藏品。许多最著名的元宇宙游戏网站都有自己的代币，这些代币可用于各种目的，或在加密货币或法定货币中交换为真钱。自从
    Zuckerberg 宣布以来，许多 NFT 和代币的价值已经上涨，现在采用元宇宙加密货币可以帮助你尽早进入交易所交易基金（ETFs），并乘着浪潮驶向元宇宙的成功。


    ### 元宇宙的顶级加密货币


    你需要钱来在另一个世界中生活、工作和玩耍，你可以通过比特币来赚取。有大量的加密货币可供选择，就像有大量的元宇宙可供探索一样。了解每种选项的众多区别、优点和缺点，将帮助你为自己的情况做出最佳投资决策。


    ### Decentraland (MANA)


    #### Decentraland Mana


    Decentraland 是一个增强现实平台，允许你购买、交易和管理虚拟房产（称为 LAND）。因此，你可以完全控制如何修改和扩展你的宇宙，并且可以通过你的手机、电脑或虚拟现实（VR）头显来完成。要开始，你需要
    Decentraland MANA。MANA 是一种原生加密货币，使你能够使用交互式应用程序、支付商品和服务，以及投资房地产。


