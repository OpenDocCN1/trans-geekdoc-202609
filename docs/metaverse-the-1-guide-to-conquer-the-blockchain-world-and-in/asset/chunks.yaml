    Take-Two Interactive owners.


    ## 3\. Roblox


    Another metaverse stock is Roblox (`NYSE: RBLX`); however, it "flips the script"
    compared to Match Group and Take-Two Interactive. Rather than creating its own
    metaverse-like experiences, Roblox provides the tools for other developers to
    create their virtual worlds for users. Consider it the YouTube of video games
    and virtual world creation.


    The bulk of Roblox''s users are under 18; hence the platform''s experiences are
    mostly geared at children. However, the business believes that with time, it will
    be able to improve its graphics production tools to bring its games closer to
    those released by professional studios such as Take-Two. With 47.3 million daily
    active users (`DAUs`) after the third quarter, Roblox is already a massive online
    community. These customers are splurging on Robux, the platform''s in-game currency
    that developers can utilize to offer in-game experiences or things. (Roblox profits
    by taking a percentage of each transaction.)


    Roblox''s net bookings (their sales measure) reached $637.8 million in the third
    quarter, generating $170.6 million in free cash flow. As previously said, the
    platform is now geared at children, while Roblox is working on one of the most
