    \ extends back to AT&T's display of a voice-controlled folding phone that could\
    \ magically erase people from photos and create 3D models, all of which seemed\
    \ impossible at the time.\n\nOn the other hand, this form of wishful-thinking-as-tech-demo\
    \ puts us in a position where it's difficult to anticipate which aspects of diverse\
    \ metaverse ideas will become reality one day. For example, the idea of a virtual\
    \ poker game where your friends are robots and holograms floating in space could\
