    Bottom line: Buying and holding for the long term is probably the smartest strategy
    on the planet... until it isn''t. You should always have an exit strategy in place
    for investments. When a bull market ends, it''s usually a good idea to take profits
    or sell. If you''re looking for a long-term investment, though, buy and hold is
    a viable option, and any price is generally good enough. Nonetheless, this one
    runs the danger of jumping all in at the peak and `HODLing` the rest of the way
    down. That can be quite painful, so take a look at the alternative options.


    Make an average position before `HODLing`: This is a straightforward and conservative
    method that relieves you of the burden of daily price fluctuations. Either you
    buy at regular intervals regardless of price, or you buy incrementally as the
    price falls over time. Avoiding market mistiming by building a long position over
    months or even years is a good way to avoid it. In the meantime, as gains appear
    here and there, you can grab part or all of them (and then reinvest those later
    if and when you see more attractive prices). It''s also likely that one would
    desire to progressively depart roles. By gradually joining and quitting positions
    over time, you can reduce your risk while investing. This can be a terrific strategy
    for a volatile, high-risk, high-reward asset like Bitcoin. As an added plus, you
    may end up paying the long-term capital gains tax rather than the short-term capital
    gains tax (which is around half as much), and you''ll escape some of the problems
    that traders face when filing complex crypto taxes.


    Bottom line: For new investors, averaging in and `HODLing` is the best bet. Without
    a doubt. There is no contest. It''s akin to "go all-in and `HODL`," but it allows
    you a lot more breathing room and options for what to do if the market goes against
    you. Sure, starting this just before a spectacular run isn''t as much fun, but
    in those circumstances, simply be happy with the buys you made before the run.
    You''ll most likely get an opportunity to buy low shortly, and you''ll be prepared!
    In certain circumstances, conservative means exercising prudence in exchange for
    a reduced benefit in the short term. 9 times out of 10, it''s a good trade-off.


    You don''t need to know much more than purchasing and selling crypto to trade
    to buy low and sell high. Buy at what you think are low prices, such as whatever
    the price is after a few days of declining prices, then sell when prices are higher.
    If you make a mistake, you can either set stop losses or "hold bags" (basically
    reverting to a "build an average position and hold" method if you make a mistake).
    If you want to be a pro at this, you''ll need to learn technical analysis (`TA`).
    You can use `TA` to make buy and sell decisions based on support levels, moving
    averages, and other indicators. If you get it right, `TA` can help you boost the
    profitability of your trades, but if you get it wrong, it might psych you out.
    If you decide to trade, keep an eye on fees and portfolio erosion. In sideways
    markets, experienced traders can outperform `HODLers`, and in negative conditions,
    they may outperform them (due to a trader being more apt to sell and wait in cash).
    Traders (especially novice traders) are likely to miss out on some short and dramatic
    runs as they chase the last coin that did well into the ground while missing out
    on the next one in line. Consider trading only a portion of your total investable
    cash if you don''t have the time or attention to devote to the unpredictable crypto
    markets 24 hours a day, 7 days a week. Learning to be a decent crypto trader takes
    time and discipline (super fun, though).


    Bottom line: Trading is enjoyable, and it can be the most profitable method if
    you are skilled, disciplined, and knowledgeable about technical analysis. For
    various complex reasons, "noobs" are likely to get "rekt" trading. No one expects
    to outperform a `HODLer` by trading, yet the majority do (as far as my research
    suggests). It''s fine to incur a few bruises along the route to getting better,
    but don''t fool yourself into thinking you''ve arrived when you haven''t. Because
    you''re probably not, start with small buy-ins and don''t trade too often.


    TIP: You can trade crypto-to-crypto or crypto-to-crypto. Crypto-to-crypto offers
    the added benefit of keeping you in crypto as you try to increase your holdings
    in a particular coin. However, it is more difficult than it appears and can cause
    you to miss out on runs... so keep that in mind.


    Invest in a Trading Bot: Trading bots are computer programs that take care of
    your trading for you. The major advantage is that it can carry out your instructions
    while you sleep. It eliminates all of the anxiety associated with sleeping. If
    you''re going to trade, it''s probably worth the time, effort, and money to set
    up and manage a bot. You don''t have to do anything with it; simply let it place
    stop losses for you, or if you know some basic `TA`, let it trade death crosses
    and golden crosses on 2hr+ candles (this strategy is common enough that you should
    be aware of it on any timeframe; if everyone automates it with no additional parameters...
    every cross will be even more eventful than it already is).


    Bottom line: A trading bot may be too demanding for a novice trader who isn''t
    also an amateur coder with some basic knowledge of trading and `TA` (it''s not
    a high bar, but there are a few hurdles and learning curves). Once you''ve mastered
    the technique, it''ll take a lot of the stress out of your day. You might not
    be able to sell at 4 a.m. if the market is plummeting. You may not be sitting
    next to your computer, ready to buy the Golden Cross that appears while you''re
    at work... but your bot is... and it''s making decisions only based on facts.
    Allow your crypto-bot to make reasonable decisions for you by removing your emotions.


    ![](Image00001.jpg)


    NOTE: I mentioned `MACD` crossings above for a `TA` technique because short-term
    averages MUST cross over long-term averages when the price rises and vice versa
    when the price falls. Other technical indicators are more predictive and aid in
    the definition of probability. In contrast, `MACD` crosses are just a necessary
    occurrence (which makes them well suited on longer time frames bots focused on
    investing over day trading).


    You may get a fair idea of the market''s trend by following the `MACD` on Bitcoin.


    Invest with a Trading Bot: "`Trading bot`" is a misnomer. You don''t have to trade
    actively when you use a trading bot. It can be used to build a coin collection
    or control risk (to set stop losses and stop buys, or you can use it to exit positions
    only when charts are very bearish and then re-enter the second they turn around).
    You can use a bot to safeguard or grow your money by selecting conservative low-risk/low-reward
    techniques. You may know you want to invest in Bitcoin, but that doesn''t imply
    you want to ride it out during an 80% drop. Your emotions may interfere, but your
    bot does not, so tell it what you want and then walk away. Conclusion: If you''re
    going to utilize a bot, start with this strategy. It''s an excellent option for
    intermediate investors who want to get into crypto but don''t want to be a martyr
    and `HODL` every coin they own regardless of market conditions.


    Arbitrage: Did you know that you can acquire a coin at a lower price on one exchange
    and sell it for a higher price on another? Preforming arbitrage between exchanges
    (or simply "arbitrage") is what this is called. Arbitrage can be quite lucrative,
    but you must act swiftly. You can use a bot, but you''ll have to grant your bot
    withdrawal authority, which can be a little unpleasant.

