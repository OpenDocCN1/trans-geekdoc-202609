  fmt: '

    The procedure of creating an avatar differs depending on the company. In 2022,
    Microsoft Mesh will be integrated into Teams, adding something new to the metaverse.
    The user will construct a fully personalized avatar of himself using the application.
    Thanks to mixed reality technologies, the avatar will be a realistic representation
    of the user. This will include a wide range of face expressions, body language,
    and backgrounds in the future.


    In its next metaverse, Horizon Worlds, Meta has great ideas for avatar creation.
    Virtual reality will support the avatars, which will mirror the user''s activities
    in real-time. While this all sounds wonderful, these avatars do not have legs
    at the moment, maybe to make movement and travel more manageable. Meta is also
    working on photorealistic Codec Avatars, which are impressive-looking, ultrarealistic
    avatars rendered in real-time with their surroundings.


    The ideal metaverse, regardless of platform, will allow users to choose how they
    wish to appear while maintaining the realism of facial expressions and movements
    when supported by VR.


    ## How does the metaverse appear?


    To answer this topic, we must first distinguish between "the metaverse" and "a
    metaverse." No single metaverse joins all other universes into a unified whole,
    although they all use the internet to connect their users. As a result, each metaverse
    might have a distinct appearance.


    The appearance of a metaverse is determined by its creator. Some metaverses are
    sandbox-like, with plenty of development opportunities and few restrictions on
    what users can build. Imagine Minecraft, but much larger: everyone lives in the
    same universe instead of sharing a server with pals.


    A metaverse can take the form of a school, a street, a fantasy forest, or the
    ocean''s depths.


    Real-world regulations still apply in such a metaverse. You''ll most likely see
    the sky, buildings, and nature, as well as other people. Depending on the metaverse,
    the art style can be cartoony, realistic, or anything in between.


    On the other hand, the metaverse does not have the same limits as the real world,
    Zuckerberg pointed out during his Meta speech. So, for example, there''s no reason
    you couldn''t travel to space with your entire family in the metaverse if the
    makers of the metaverse allowed it.


    To summarize, a metaverse can resemble a school, a street, a dream forest, or
    the ocean''s depths. On the other hand, the most popular examples provide a mix
    of those things, thanks to the freedom they give its users.


    ## Is it feasible to create a metaverse?


    Let''s take a brief look at where we are right now. First, we have a virtual reality
    in which the creator is the only one who can limit it. We''ve created an avatar
    to represent ourselves. Then, of course, we have access to the internet, which
    allows us to participate in this global community.


    Where do we go from here? It depends.


    A metaverse vision with numerous figures pointing to a future world.


    In a perfect scenario, the metaverse would link every single person together.
    When you join a public server, you should be able to communicate with everyone
    else online at the time. The truth, on the other hand, is frequently different.


    Ascertain metaverses get more popular, the servers that host them become unable
    to handle the increased traffic. Some programmers design different layers that
    divide users, thereby shrinking the universe.


    This may be prevented in the future, but for now, the metaverse is often fractured
    — not to mention the fact that people use multiple platforms, effectively choosing
    their favorite realm.


    As previously said, each company has its perspective on the metaverse. For example,
    Facebook is developing horizon Worlds, Nvidia is developing omniverse, and much
    smaller fish in this very large pond are also participating. In addition, the
    Bitcoin industry has its metaverses.


    The idea of a single huge metaverse is now unfeasible because various metaverses
    are isolated from one another, function on distinct platforms, and have no shared
    uses or goals.


    All enterprises releasing their metaverses will have to join forces if the metaverse
    is one large, shared virtual environment. Not only would these businesses have
    to work together, but server technology would have to improve quickly as well.


    Unimaginable server loads would have to be handled by the host and the end-user
    to host all of these multiple iterations of the metaverse on one platform.


    The metaverse may remain fractured until this is achieved, requiring users to
    select their preferred universe before connecting to the common world.


    ## What is the metaverse''s purpose?


    The metaverse as a notion is difficult to define, if only because it appears infinite.
    However, this means that the organization or group of individuals who created
    it and each user can define its general-purpose on a case-by-case basis.


    The metaverse''s overall goal is to unite people through a virtual, shared universe.
    The metaverse exists to bridge the gap between reality and distance, uniting people
    from all over the world, whether for employment, self-improvement, or simply amusement.


    Allowing users to engage with the world at large through their avatars without
    assigning them any specific purpose provides for a lot of flexibility of choice.
    This is also the foundation of Meta''s great reveal: the notion that you can practically
    do whatever you want in the metaverse.


    Let''s look at some of the more popular activities in the metaverse.


    ### Own property


    Allowing people to purchase land plots is a recurrent motif in metaverses. When
    a user purchases a property, it is assigned to that user and is unavailable to
    other players as long as that avatar owns it. Just like in the real world, plots
    can be purchased or rented.


    When you own property, you frequently have the freedom to use it whatever you
    wish. For example, some people prefer to create a gallery to display their possessions,
    while others open stores or create shared public areas.


    The idea of allowing users to build anything they want in their environment isn''t
    new, and it''s a big part of why games like Minecraft and Roblox are so popular.
    The metaverse''s developers save a lot of work by allowing users to create their
    buildings, which would otherwise take up a lot of time.


    Of course, this is the internet, and too much liberty can lead to all kinds of
    mischief. Most metaverses continue to monitor user-generated content, and depending
    on the host, it may be removed. Even an ostensibly infinite universe has its bounds.


    ### Trade property


    Once you''ve acquired something in the metaverse, you can sell or trade it with
    other users. This provides a sense of riches and prestige to an otherwise cold
    world. Some lots are worth more than others, and some are rare while others are
    common – all of this contributes to establishing a metaverse-specific economy.


    Land plots in the metaverse typically vary in size and location. So it''s no wonder
    that the real estate market is alive and well in the metaverse, given that this
    is a virtual representation of actual life. Contested plots, which are closer
    to busy places or are simply more desirable due to some other luxury, can fetch
    far higher rates than a modest square of grass on the outskirts of town.


    Decentraland is a blockchain-based metaverse.


    Some metaverses are popular with businesses as well as regular users. Because
    so many people share the cosmos, it provides an opportunity to advertise. Purchasing
    land and displaying the company''s logo might be a good method to spark or renew
    interest.


    Companies can benefit from the metaverse in a variety of ways. For example, in
    a seemingly unlimited universe, organizing events, developing crossovers between
    properties, and communicating with the user community is made easier.


    ### Live and interact

    '
  trans: '


    创建头像的流程因公司而异。2022 年，Microsoft Mesh 将集成到 Teams 中，为元宇宙增添新内容。用户将使用该应用程序构建一个完全个性化的自己头像。得益于混合现实技术，头像将成为用户的逼真表现。未来，这将包括广泛的面部表情、肢体语言和背景。


    在其下一个元宇宙 Horizon Worlds 中，Meta 对头像创建有着宏大的构想。虚拟现实将支持头像，这些头像将实时镜像用户的活动。虽然这一切听起来很美妙，但这些头像目前没有腿，也许是为了让移动和旅行更易于管理。Meta
    还在开发逼真的 Codec Avatars，这些头像外观惊人，超逼真，能够与周围环境实时渲染。


    理想的元宇宙，无论平台如何，都将允许用户选择自己希望呈现的样子，同时在 VR 支持下保持面部表情和动作的真实感。


    ## 元宇宙长什么样？


    要回答这个问题，我们首先必须区分“元宇宙”和“一个元宇宙”。没有单一的元宇宙将所有其他宇宙合并为一个统一的整体，尽管它们都使用互联网来连接用户。因此，每个元宇宙可能有独特的外观。


    元宇宙的外观由其创建者决定。有些元宇宙类似沙盒，有大量的开发机会，并且对用户可以构建的内容几乎没有限制。想象一下《我的世界》，但规模大得多：每个人都生活在同一个宇宙中，而不是和朋友共享一个服务器。


    元宇宙可以采取学校、街道、奇幻森林或海洋深处的形式。


    在这样的元宇宙中，现实世界的规则仍然适用。你很可能会看到天空、建筑物和自然景观，以及其他人。根据元宇宙的不同，艺术风格可以是卡通风、写实风，或介于两者之间的任何风格。


    另一方面，元宇宙并不像现实世界那样有相同的限制，扎克伯格在 Meta 演讲中指出。因此，例如，如果元宇宙的创建者允许，你完全没有理由不能在元宇宙中带着全家去太空旅行。


    总结来说，元宇宙可以类似于学校、街道、梦幻森林或海洋深处。另一方面，最流行的示例提供了这些事物的混合，这要归功于它们赋予用户的自由。


    ## 创建元宇宙可行吗？


    让我们简要看看我们目前所处的位置。首先，我们有虚拟现实，其中创建者是唯一能够限制它的人。我们已经创建了头像来代表自己。然后，当然，我们可以访问互联网，这使我们能够参与这个全球社区。


    接下来我们该去哪里？这取决于情况。


    一个元宇宙愿景，有许多人物指向未来世界。


    在理想情况下，元宇宙将连接每一个人。当你加入公共服务器时，你应该能够与当时在线的其他所有人通信。然而，事实往往不同。


    随着某些元宇宙变得更加流行，托管它们的服务器变得无法处理增加的流量。一些程序员设计不同的层来划分用户，从而缩小宇宙。


    未来这可能会得到预防，但目前，元宇宙往往是分裂的——更不用说人们使用多个平台，实际上选择了他们喜欢的领域。


    如前所述，每家公司对元宇宙都有自己的看法。例如，Facebook 正在开发 Horizon Worlds，Nvidia 正在开发 Omniverse，这个非常大的池塘中更小的鱼也在参与。此外，比特币行业也有自己的元宇宙。


    单一巨大元宇宙的想法现在是不可行的，因为各个元宇宙相互隔离，在不同的平台上运行，并且没有共同的用途或目标。


    如果元宇宙是一个巨大的共享虚拟环境，所有发布元宇宙的企业都必须联合起来。这些企业不仅必须合作，服务器技术也必须迅速改进。


    主机和最终用户将不得不处理难以想象的服务器负载，才能将元宇宙的所有这些多个版本托管在一个平台上。


    在实现这一点之前，元宇宙可能会保持分裂状态，要求用户在连接到共享世界之前选择他们偏好的宇宙。


    ## 元宇宙的目的是什么？


    元宇宙作为一个概念很难定义，仅仅因为它看起来是无限的。然而，这意味着创建它的组织或个人群体以及每个用户都可以根据具体情况定义其总体目的。


    元宇宙的总体目标是通过一个虚拟的共享宇宙来团结人们。元宇宙的存在是为了弥合现实与距离之间的差距，团结来自世界各地的人们，无论是为了就业、自我提升，还是单纯的娱乐。


    允许用户通过他们的头像与外部世界互动，而不赋予他们任何特定目的，这提供了大量的选择灵活性。这也是 Meta 大揭秘的基础：即你几乎可以在元宇宙中做任何你想做的事情。


    让我们来看看元宇宙中一些更受欢迎的活动。


    ### 拥有房产


    允许人们购买土地地块是元宇宙中反复出现的主题。当用户购买房产时，它会分配给该用户，只要该头像拥有它，其他玩家就无法使用。就像在现实世界中一样，地块可以购买或出租。


    当你拥有房产时，你通常有自由随意使用它。例如，有些人喜欢创建画廊来展示他们的财物，而另一些人则开设商店或创建共享公共区域。


    允许用户在其环境中构建任何想要的东西的想法并不新鲜，这也是《我的世界》和 Roblox 等游戏如此受欢迎的很大一部分原因。元宇宙的开发者通过允许用户创建自己的建筑，节省了大量工作，否则这将花费大量时间。


    当然，这是互联网，过多的自由可能导致各种恶作剧。大多数元宇宙继续监控用户生成的内容，并且根据主机的不同，内容可能会被删除。即使是一个看似无限的宇宙也有其边界。


    ### 交易房产


    一旦你在元宇宙中获得了某样东西，你就可以将其出售或与其他用户交易。这为一个原本冷冰冰的世界提供了财富和声望感。有些地块比其他地块更有价值，有些是稀有的，而有些是常见的——所有这些都有助于建立特定于元宇宙的经济。


    元宇宙中的土地地块通常在大小和位置上有所不同。因此，考虑到这是现实生活的虚拟表现，房地产市场在元宇宙中蓬勃发展也就不足为奇了。有争议的地块，即靠近繁忙地点或仅仅因为其他奢侈品而更受欢迎的地块，可以获得远高于城外一小块草地的价格。


    Decentraland 是一个基于区块链的元宇宙。


    一些元宇宙既受企业欢迎，也受普通用户欢迎。因为有这么多人共享宇宙，它提供了广告机会。购买土地并展示公司的标志可能是激发或重新点燃兴趣的好方法。


    公司可以从元宇宙中以多种方式受益。例如，在一个看似无限的宇宙中，组织活动、在房产之间开发跨界合作以及与用户社区沟通变得更加容易。


    ### 生活与互动


