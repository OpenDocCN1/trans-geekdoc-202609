  trans: '


    它曾经很难证明购买 Unity 是合理的。尽管该公司价值很高，但任何潜在收购方都必须完全保持 Unity 的平台中立性，以维护市场主导地位、开发者支持和影响力（例如，Google
    不能让 Unity 独占或仅在 Android/Chrome 上表现最好，否则会疏远大量开发者）。这意味着将 Unity 转变为专有引擎不是一个明智的商业决策。此类决策导致的价值损失以及购买
    Unity 的额外成本，很可能使这一举措变得无法承受。另一方面，收购 Unity 的目标是在新互联网上占据关键位置，买方将有动力保持引擎开放并可跨平台使用，价格也将迅速变得无关紧要。


    如果 Epic 做到了，Valve 必须拥有通往元宇宙的可行途径。Valve 的 Steam 在用户、资金和游戏时长方面都占据着 Epic Games Store
    的主导地位。此外，它还拥有市场上一些最受欢迎且长期运行的多人游戏（Counter-Strike、Team Fortress、DotA）。而且，该公司在内容和货币化创新方面有着良好的记录（它是第一个大规模尝试
    AAA 免费游戏和玩家对玩家市场的公司）。Valve 还花了多年时间创建和部署虚拟现实技术，由一群热爱开源技术、厌恶封闭环境的热情程序员私人拥有，并且每年产生数十亿的收益。另一方面，Valve
    的 Source 引擎采用率很低。与 Epic 不同，它似乎并未专注于整合其能力和资产来开发元宇宙。


    # 为什么全息图在元宇宙中扮演角色？


    当互联网最初推出时，它伴随着一系列技术成就，包括在远距离连接计算机的能力以及将一个网页链接到另一个网页的能力。这些技术特征为我们现在与互联网联系在一起的抽象结构提供了基础，例如网页、应用程序、社交网络以及一切依赖于它们的东西。这还没有考虑非互联网界面创新的融合，例如显示器、键盘、鼠标和触摸屏，这些仍然是使互联网运行所必需的。


    在元宇宙中，有一些新的基础模块已经到位，例如能够在单个服务器实例中容纳数百人（元宇宙的未来版本应该能够处理数千甚至数百万人）以及能够区分一个人手部位置的运动跟踪工具。这些新技术有可能变得极其引人入胜和充满未来感。


    然而，也存在一些可能证明是不可能克服的限制。像 Microsoft 和 Fa—Meta 这样的公司展示了未来概念的虚构视频，他们经常掩盖人们将如何与元宇宙交互。VR
    头显仍然笨重，长时间佩戴会导致大多数人出现晕动症或身体疼痛。除了如何在公共场合佩戴增强现实眼镜而不显得像个十足的呆子这一不容小觑的障碍之外，增强现实眼镜还有另一个问题。


    那么，IT 公司如何在不展示庞大设备和奇怪眼镜现实的情况下演示其技术概念？到目前为止，他们的主要选择似乎是从零开始开发技术。是 Meta 演讲中出现的那个全息女性吗？很抱歉要打破这个幻想，但即使使用最先进的现有技术，这也根本不可能。


    与目前有点笨拙但未来可能会更好的运动跟踪数字化身不同，没有一种笨拙的方法可以在没有精确控制条件的情况下让三维图像出现在半空中。不管 Iron Man 如何宣称。也许这些是被视为通过眼镜投射的图像——毕竟，演示视频中的两个女人都戴着眼镜——但这对小型眼镜的物理能力做出了很多假设，而
    Snap 可以证明这是一个难以解决的挑战。


    这种对现实的欺骗在展示元宇宙可能如何运作的电影演示中很普遍。这个人是在戴虚拟现实护目镜，还是只是坐在办公桌前？这个人是被固定在沉浸式空中装置上，还是只是坐在办公桌前？Meta
    的另一个演示展示了人们在太空中悬浮——这个人是被固定在沉浸式空中装置上，还是只是坐在办公桌前？全息图的主体戴着头显吗，如果是，他们的脸是如何被扫描的？在其他时候，一个人可能会拿起虚拟物体，但看起来像是用他们真实的手拿着。


    这个演示引发的问题远多于它解答的问题。


    在某些层面上，这是可以接受的。Microsoft、Meta 以及每一家做这种奇怪演示的公司，都在试图传达一种关于未来可能是什么样子的艺术感，而不是解决每一个技术挑战。这是一个悠久的传统，可以追溯到
    AT&T 展示一款语音控制的折叠手机，它可以神奇地从照片中删除人物并创建 3D 模型，所有这些在当时都看似不可能。


    另一方面，这种将愿望思维作为技术演示的做法，让我们很难预测各种元宇宙理念的哪些方面有一天会成为现实。例如，一个虚拟扑克游戏的构想，你的朋友是机器人和漂浮在太空中的全息图，如果虚拟现实和增强现实头显变得足够舒适和实惠，让人们每天佩戴——这是一个巨大的“如果”——那么它可能成为现实。如果不是，你总是可以通过
    Discord 视频会议玩 Tabletop Simulator。


    VR 和 AR 的光鲜亮丽也掩盖了元宇宙更平凡的方面，这些方面更有可能实现。例如，软件公司创建一个开放的数字化身标准是微不足道的，这是一种包含你会在角色创建器中输入的功能的文件——比如眼睛颜色、发型或衣橱选项——并允许你随身携带它去任何地方。为此不需要制造更舒适的
    VR 头显。


    # CHAPTER 2: 理解增强现实及其工作原理


    今天是计算机中介、技术增强生活的时代。人们不仅想生活在物理世界中，还想拥有技术进步所能提供的更深层次的体验。这些突破之一是增强现实（AR），这是一种允许个人与名人共舞、前往遥远的地方、参观其他行星，甚至穿越回过去的技术——所有这些都可以在自己家的舒适环境中完成。如果你想拥抱技术变革并了解更多关于增强现实的信息，请继续阅读以了解它是什么以及它是如何工作的。


    # 什么是增强现实，它是如何工作的？


    那么，增强现实到底是什么？由于人类体验与其所代表的技术概念根本不同，因此很难定义“增强现实”。但是，在其最广泛的定义中，AR 技术可以定义为由计算机生成的视觉和/或音频特征增强的物理环境视角。


