- raw: 'We''ll dive into the native business models that Web 3.0 has enabled and will
    enable, after briefly touching on the oft-forgotten but often arduous journeys
    that led to Web 2.0''s surprising and unpredictable successful business models.


    Let us not forget Google''s journey from 1998 to 2002 before going public in 2004
    to set the stage for Web 2.0''s business model discovery process:


    •        Despite having high traffic, they visibly suffered from their business
    plan in 1999. "We really couldn''t figure out the business strategy; there was
    a moment where things were looking dismal," said Mike Moritz (Sequoia Capital),
    their lead investor.


    •        In 2001, Google made $85 million in revenue, whereas Overture made $288
    million, as CPM-based web advertising faded after the dot-com crash.


    •        In 2002, Google launched AdWords Select, its own pay-per-click, auction-based
    search-advertising product, based on Overture''s ad strategy.


    •        Two years later, in 2004, Google reached 84.7 percent of all internet
    searches and went public, valued at $23.2 billion with $2.7 billion in annualized
    revenues.


    After four years of struggle, a single tiny change to their business plan propelled
    Google into orbit, propelling it to become one of the world''s most valuable firms.


    Taking a look back at the Web 2.0 Business Models Content


    The early forms of online content consisted solely of digitizing existing newspapers
    and telephone directories... Despite this, Roma (Alfonso Cuarón) has now received
    ten Academy Award nominations for a film distributed through Netflix''s subscription
    streaming service.


    Marketplaces


    Amazon began as an online bookstore that no one expected to be lucrative... Despite
    this, it has grown into a giant marketplace that sells everything from gardening
    tools to healthful foods to cloud infrastructure.


    Software that is free and open-source


    Hobbyists and a utopian conception of software as a publicly available common
    good initiated open-source software development... Despite this, the whole internet
    runs on open-source software now, generating $400 billion in economic value per
    year, and Github was purchased by Microsoft for $7.5 billion. In comparison, Red
    Hat generates $3.4 billion in annual income from Linux services.


    SaaS


    It may have seemed unthinkable in the early days of Web 2.0 that business software
    could be delivered via browser and be economically viable... Despite this, SaaS
    models are now used by most B2B organizations.


    Sharing Economy


    It was difficult to think that someone would willingly get into someone else''s
    car or lend their couch to strangers... Yet, despite not owning any cars or houses,
    Uber and AirBnB have become the world''s largest taxi and accommodation companies.


    Advertising


    While Google and Facebook had rapid development in their early years, they lacked
    a clear income strategy for the first half of their existence... Nonetheless,
    the advertising model seemed to fit them almost too well. As a result, they now
    account for 58 percent of worldwide digital advertising revenues ($111 billion
    in 2018), making it the dominating Web 2.0 economic model.


    Web 3.0 Business Models on the Rise


    If you look at Web 3.0 over the last ten years, you''ll notice that the early
    business models aren''t always repeatable or scalable, and they often try to recreate
    Web 2.0 concepts. While there is some skepticism regarding their viability, we
    are confident that continued experimentation by some of the smartest builders
    will create extremely valuable models in the future years.


    We hope to learn how some of the more established and experimental Web 3.0 business
    models will accumulate value in the future years by investigating both existing
    and experimental Web 3.0 business models.


    •        The creation of a native asset


    •        Maintaining the native asset and expanding the network:


    •        Speculation-related taxes (exchanges)


    •        Tokens for payment


    •        Tokens should be burned


    •        Tokens for work


    •        Additional models


    Issuing a native asset entails the following steps:


    Bitcoin was the first cryptocurrency. The first Byzantine Fault Tolerant and the
    fully open peer-to-peer network was established using Proof of Work and Nakamoto
    Consensus. Its core business concept is based on BTC, a provably scarce digital
    coin distributed to miners as block rewards. Others, such as Ethereum, Monero,
    and ZCash, have followed suit, issuing ETH, XMR, and ZEC, respectively.


    The value of these native assets comes from the security they provide: by providing
    a high enough incentive for honest miners to provide hashing power, the cost for
    malicious actors to carry out an attack rises in lockstep with the price of the
    native asset, and the added security drives further demand for the currency, driving
    up its price and value. The worth of these native assets has been thoroughly examined
    and measured.


    Maintaining the native asset while expanding the network:


    Some of the first crypto network companies had a single goal: to make their networks
    more profitable and lucrative. The business model that resulted can be summarized
    as "grow their native asset treasury; build the ecosystem." For example, Blockstream,
    as one of the largest Bitcoin Core maintainers, relies on its BTC balance sheet
    to generate value. Similarly, ConsenSys has grown to a thousand workers to boost
    the value of the ETH it holds through constructing crucial infrastructure for
    the Ethereum ecosystem.


    While this properly links firms with networks, the approach is difficult to reproduce
    after the first few companies: accumulating a significant enough balance of local
    assets becomes impractical after a while... Without a significant, enough investment
    for exponential returns, the blood, toil, tears, and sweat of founding and maintaining
    a firm cannot be justified. For example, it would be illogical for any company
    other than a central bank — such as a US remittance service — to build a business
    solely on holding enormous sums of USD while working to improve the US economy.


    Taxing Native Assets for Their Speculative Value:


    The next generation of business models concentrated on establishing the financial
    infrastructure for these native assets, including exchanges, custodians, and derivatives
    suppliers. They were all created with a single goal in mind: to provide services
    to users who wanted to speculate on these risky assets. While organizations like
    Coinbase, Bitstamp, and Bitmex have grown to be billion-dollar businesses, they
    are not monopolistic in the sense that they provide convenience and increase the
    value of their underlying networks. Companies can''t lock in a monopolistic position
    by providing "exclusive access" because the underlying networks are open and permissionless,
    but their liquidity and branding provide defensible moats over time.


    Payment Tokens:


    With the rise of the token sale, a new wave of blockchain initiatives predicated
    their business models on payment tokens within networks, often forming two-sided
    marketplaces and requiring the usage of a native token for all payments. According
    to the assumptions, as the network''s economy grows, demand for the restricted
    native payment token grows, resulting in a rise in the token''s value. While the
    value accrual of such a token paradigm is debatable, the extra friction for the
    customer is obvious. What might have been paid in ETH or DAI now necessitates
    additional exchanges on both sides of the transaction. While this paradigm was
    popular during the 2017 token fever, its friction-inducing properties have pushed
    it to the back of the development queue in the last nine months.


    Burn Tokens:'
