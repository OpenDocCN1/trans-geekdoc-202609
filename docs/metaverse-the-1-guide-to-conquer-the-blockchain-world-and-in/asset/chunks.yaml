  trans: '


    用户可以使用 VR 和 AR 技术沉浸于虚拟环境中。在虚拟现实的情况下，我们被提供了完全不同的环境。VR 允许你与周围变化的世界互动，无论是通过游戏还是电影。另一方面，AR
    通过添加对象并允许你以各种方式与它们交互来增强你的现实世界环境。


    一个人正在戴着虚拟现实头显。


    区别在于目标。你可以随时不与他人连接地玩 VR 或 AR 游戏，然而，人类触感是 Meta 和其他公司所设想的元宇宙的基石。


    简而言之，元宇宙是上述两者的游乐场——一种让个人共享虚拟环境以进行商业、学习、健身或仅仅为了娱乐的方法。


    使用虚拟现实和增强现实工具将大大有助于扩展元宇宙，并使其感觉比添加了步骤的视频游戏更真实。另一方面，元宇宙应该以以前无法想象的方式让人们更加紧密地联系在一起，而不仅仅是通过
    VR 和 AR。因此，有很大的发展空间。


    ## 谁在构建元宇宙？


    由于扎克伯格最近的 Meta 演讲，数以百万计的新眼睛被吸引到了元宇宙，但在这场通往未来的竞赛中，有许多巨头。此外，这些企业中的每一个都对元宇宙有自己的诠释，这进一步扩大了这个词本身就已非常宽泛的定义。


    Facebook 进军元宇宙并不完全出乎意料。Facebook 于 2014 年 3 月以 23 亿美元收购了 Oculus。该公司继续发布 Oculus
    Quest 设备，这些设备是目前市面上最好的虚拟现实头显之一。


    考虑到 Meta 目前打算在很大程度上依赖 VR 和 AR 来为元宇宙增加真实感，七年前收购 Oculus 似乎并非随机决定。值得注意的是，Oculus Quest
    将很快停产。整个产品线将从 2022 年开始重新品牌化为 Meta Quest，从而结束这笔交易并移除旧品牌。


    除了 Meta Quest，Meta 的首席技术官 Andrew Bosworth 透露，一些 Oculus 产品将被称为 Meta Horizon。根据
    Bosworth 的说法，这将是整个虚拟现实元宇宙平台的品牌。


    一个人正在灰色背景前戴着 Oculus Quest 2 VR 头显。


    Oculus.com/Facebook


    Microsoft 很快在 Facebook 的重大公开宣布后加入了元宇宙的行列。从 2022 年开始，Microsoft 计划在 Microsoft Teams
    中创建一个元宇宙。


    Microsoft 打算部署 Mesh，以允许所有 Teams 用户通过用动画头像替换网络摄像头照片来参与视频会议。人工智能将监听用户的声音，然后为其头像添加匹配的嘴唇动作。此外，切换到
    3D 会议将导致更多的手部动作。


    虽然 Microsoft 的声明与 Meta 相比可能显得微不足道，但它是朝着元迈出的重要一步，展示了该公司的承诺。此外，与 Meta 一样，Microsoft
    可能打算将元宇宙整合到远程工作的未来中，正如 Teams 的这些更新所证明的那样。


    Nvidia Omniverse 是 Nvidia 进入元宇宙竞赛的另一匹马。该公司将其描述为“一个将 3D 环境整合到共享虚拟宇宙中的平台”。Nvidia
    的 Omniverse 是云原生的，这意味着它是一个共享的、持久的平台，在会话之间不会改变。此外，它可以远程流式传输到任何设备，并在基于 RTX 的平台上运行。


    ### Omniverse Replicator 的应用


    迄今为止，这家显卡巨头似乎对其元宇宙采取了略有不同的方法。虽然 Meta 和 Microsoft 强调元宇宙的社交方面，但 Nvidia 专注于协作和新技术探索。设计师、机器人工程师和其他专家使用
    Omniverse 在虚拟现实中模拟现实世界。例如，Ericsson 工程师使用 Omniverse 在都市环境中模拟 5G 波。


    就未来而言，另一位重量级玩家即将登场。Apple 正在开发全虚拟现实头显和增强现实眼镜，所有迹象都表明该公司正朝着元宇宙方向发展。这两款产品几乎肯定都需要连接到元宇宙才能工作；因此，Apple
    在元宇宙开发方面可能不会落后于 Meta 太远。


    ## 元宇宙仅仅是视频游戏的幌子吗？


    简短回答：不，我不这么认为。


    详细回答：取决于你的观点，也许有点像。


    包括 Fortnite、World of Warcraft 和 Minecraft 在内的所有在线游戏，本身都是元宇宙。它们构建了一个永久环境，玩家可以随意进出。此外，玩家的进度存储在外部服务器上并与其他用户共享，这意味着你在这些游戏中所做的任何事情以后都可以回顾。


    从技术上讲，每款游戏都可以被视为元宇宙，而各种科技巨头正在开发的元宇宙可能都会包含游戏特征。然而，元宇宙的概念远比视频游戏广泛。元宇宙旨在在虚拟环境中取代或增强现实世界的功能。用户日常做的事情，例如上课或上班，都可以在元宇宙中完成。


    视频游戏元宇宙和更广泛元宇宙的概念有一些相似之处。例如，你可以与他人交流、合作进行各种活动，甚至在一定程度上改变周围的世界。然而，所有这些都受到游戏限制的约束。


    例如，在 Minecraft 中，你可以建造一座巨大的堡垒；然而，在 World of Warcraft 中，你没有同样的自由。相反，玩家可以拥有一个要塞，这基本上是一块土地，尽管他们对其外观或位置几乎没有控制权。更重要的是，所有玩家共享同一块土地，只有在被邀请时才能互相访问。


    这个 Minecraft 项目中展示了建筑和地形。


    虽然上述标题目前很受欢迎，但元宇宙的概念可以在许多视频游戏中找到，并且已经存在相当长一段时间了。Second Life 是一款 2003 年的游戏，至今仍在运行，它是一个不像许多其他游戏那样有终极目标的元宇宙：它只是让你环游世界并与其他人交流。顺便说一句，你还可以飞行。


    在理想的元宇宙中，许多传统视频游戏的限制被消除，你构建自己的命运。然而，无论是在与游戏相关的元宇宙中还是不在，初始阶段总是相同的：你必须创建你的角色。


    ### 发展为头像


    元宇宙中的用户会获得一个代表自己的头像，他们可以根据喜好进行自定义。平台决定头像的外观。它可能非常基础，但也可以非常高质量，拥有许多自定义选项。例如，用户可以保持忠实，但也可能转变成完全不同的人。


    一旦构建完成，头像就是用户进入元宇宙的通行证，这是一个如果你有想象力暂时搁置现实，一切皆有可能的虚拟环境。头像可以行走、交流和探索环境，等等。当然，平台独自负责头像的限制。


    Meta Horizon Worlds 元宇宙中有四个头像。


    有些元宇宙实例类似于视频游戏，允许用户使用键盘和鼠标走动。更先进的版本使用虚拟现实头显和控制器，通过在元宇宙中模拟用户的现实动作来让用户沉浸于场景中。


    '
