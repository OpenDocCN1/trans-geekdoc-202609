    destroyed at any time. Contracts are disseminated to a network of users, and decentralization
    requires a majority vote. Unless most of the network decides to close it down,
    the metaverse should theoretically remain available to everyone.


    This is not the case in gaming metaverses like World of Warcraft, where your account
    remains The game''s creators'' property. Unfortunately, this means you don''t
    have complete control over your assets, such as your characters or equipment.
    NFTs (non-fungible tokens) is a solution to this issue.


    NFTs can range from 8-pixel avatars to amazing works of art (in my opinion, rather
    ugly). At their core, NFTs are a decentralized system for granting ownership to
    virtual objects. NFTs use bitcoin and contracts to give ownership to a specific
    user, whereas anyone can download a snapshot and claim it as their own.


    This gives the metaverse a whole new level of the economy, turning this fanciful
    concept into a way for people to make (or lose) real-world money. Users can buy
    virtual parcels of land, avatars, and even a hat for their metaverse avatar with
    cryptocurrency.


    non-fungible tokens concept, crypto art, NFT neon sign-picture on circuit board


    Non-fungible tokens are not metaverse-dependent, but they do play a role in the
    economies of some universes, such as Decentraland and The Sandbox, which are still
    under construction.


    The Sandbox sells NFTs, which grant the customer complete ownership of a piece
    of land. Users can then navigate to that visualization and interact with the data
    there. A brief look at The Sandbox''s map reveals that this form of NFT has grabbed
    the interest of dozens of firms interested in exploring a new advertising area,
    not just bitcoin fans.


    Several well-known companies and franchises have already made land purchases in
    The Sandbox ahead of its official opening. Massive swaths of land can be found
    in Atari, The Walking Dead, RollerCoaster Tycoon, Shaun the Sheep, and even South
    China Morning Post.


    Although no one would ever accuse this group of companies of being particularly
    interested in NFTs or the metaverse, the concept has value. Some companies are
    striving to capitalize on it.


    It''s difficult not to find connections between how the bitcoin market interacts
    with some of the most popular metaverses and how the real-world economy works.
    The overall result might be great or frightening, depending on which side of the
    fence you''re on.


    ## The future of the metaverse


    No one can deny that the metaverse notion has begun to extend to the previously
    undiscovered territory. From its humble origins in games like Second Life, Habbo
    Hotel, and even the long-gone, long-forgotten Club Penguin, we''ve come a long
    way.


    According to Zuckerberg, meta aims to hit the ground running with Horizon Worlds,
    though even he recognizes that we''re not quite there yet. It will take years
    for the metaverse to pervade our reality to the point where it is as well-known
    and accessible as Meta desires.


    The metaverse''s idea of a shared reality where individuals from different continents
    can play, study, exchange, and even work together is futuristic and utopian. In
    the metaverse, bustling streets with shops, parks, and people can all be reproduced,
    but the technology required to do so is still out of reach for the average individual.


    The reality of the metaverse experience is another step toward widespread acceptance.
    The addition of virtual reality and augmented reality to the metaverse will undoubtedly
    make the experience feel considerably more realistic than it does with a keyboard
    and mouse.


    A screenshot of Travis Scott''s concert in Fortnite.


    We''ve already seen some intriguing crossovers that pushed the metaverse''s boundaries.
    Travis Scott held a virtual concert in Fortnite, drawing over 12 million players.
    Justin Bieber just stated his intention to do the same. Snoop Dogg, an active
    supporter of NFTs, owns land in The Sandbox and allows visitors to buy VIP permits
    to see his home in the future, even if it isn''t open yet.


    Zuckerberg believes that the metaverse is the internet''s future, even referring
    to it as the "successor" to mobile internet. Whether or not this is correct needs
    to be seen.


    One thing is certain: the metaverse is no longer merely a fantastical concept
    plucked from a science fiction film. Instead, Facebook/Meta has simply poured
    fuel to a fire that has already been burning, and in a few years, we may see the
    metaverse used in ways we never imagined imaginable.


    ## WHO ELSE IS CAPABLE OF CREATING THE METAVERSE?


    Although the Metaverse can replace the Internet as a computing platform, it is
    unlikely to follow the same evolutionary path as its forerunner. The Internet
    was developed in the United States by public research universities and government
    programs. This was partly because few in private sector saw the World Wide Web''s
    commercial potential. Still, it was also because these organizations were virtually
    the only ones with the computational power, resources, and goals to build it.
    Unfortunately, none of this is true when it comes to the Metaverse.

    '
  trans: '


    与理想元宇宙相比，你之前看到的元宇宙实现示例不过是些技术细节——理想元宇宙是一个几乎可以取代现实的领域。我们还没有完全做到（而且未来几年可能也做不到），但
    Meta 和 VRChat 等企业正将我们推向前所未有的接近程度。


    在理想元宇宙中，你将与周围的每个人互动。这比我们在《Second Life》或《Habbo》等游戏中看到的基于文本的对话更为先进。然而，使用语音通信、VR
    头显和 AR 眼镜，互动可能会被提升到一个新的水平。


    无论是与朋友一起跳伞，还是在虚拟图书馆组织学习小组，元宇宙的核心前提始终是人际互动——只不过不是面对面的。


    ## 工作与学习


    从 Meta 到微软，许多公司都高度重视在元宇宙中协作、学习和共同工作的能力。


    微软打算使用 Mesh 为原本乏味的视频会议增添真实感。此外，Meta 还希望构建虚拟工作空间，让远程员工在白天能在虚拟现实中共度时光。


    在元宇宙中，工作可以以多种方式进行，包括先在虚拟现实中模拟现实世界的任务。例如，工程师、程序员、设计师以及各种其他专业人士可以使用 Nvidia 的 Omniverse
    等元宇宙来实现这一点。


    元宇宙、加密货币和 NFT 之间在某种程度上都有关联。


    很难在不提及比特币的情况下谈论元宇宙。毕竟，区块链——加密货币运行的去中心化基础——已被用于一些最著名的案例中。


    例如，Decentraland 是一种沙盒式元宇宙，用户可以在其中拥有土地地块、探索其他地块并进行交流。仅在 Decentraland 中使用的 MANA
    加密货币支撑着整个经济体系。


    这些元宇宙与商业拥有的虚拟宇宙不同之处在于，它们依赖于去中心化网络，你的资产属于你自己，不受元宇宙所有者的控制。


    加密货币几乎总是去中心化的，围绕它们构建的世界也是如此。这意味着没有单一实体控制货币、虚拟土地或整个元宇宙，因此它随时都不会被关闭、出售或以其他方式摧毁。合同会分发到用户网络中，去中心化需要多数票决。除非网络中的大多数决定将其关闭，否则元宇宙理论上应始终对所有人开放。


    在《魔兽世界》等游戏元宇宙中情况并非如此，你的账户仍然属于游戏创作者的财产。不幸的是，这意味着你无法完全控制自己的资产，例如角色或装备。NFT（非同质化代币）是解决这一问题的方案。


    NFT 可以从 8 像素头像到惊人的艺术作品（在我看来，相当丑陋）。从本质上讲，NFT 是一种用于授予虚拟对象所有权的去中心化系统。NFT 使用比特币和合同将所有权赋予特定用户，而任何人都可以下载快照并声称其为己有。


    这为元宇宙带来了全新的经济层面，将这个奇幻概念变成了人们赚取（或亏损）现实世界金钱的方式。用户可以用加密货币购买虚拟土地地块、头像，甚至为其元宇宙头像购买一顶帽子。


    non-fungible tokens concept, crypto art, NFT neon sign-picture on circuit board


    非同质化代币并不依赖元宇宙，但它们确实在某些宇宙的经济中发挥作用，例如 Decentraland 和 The Sandbox，后者仍在建设中。


    The Sandbox 销售 NFT，赋予客户对一块土地的完全所有权。用户随后可以导航到该可视化区域并与其中的数据进行交互。简要查看 The Sandbox
    的地图显示，这种形式的 NFT 已引起数十家有兴趣探索新广告领域的公司的关注，而不仅仅是比特币爱好者。


    几家知名公司和特许经营品牌已在 The Sandbox 正式开放前购买了土地。Atari、《行尸走肉》、《过山车大亨》、《咩咩启示录》甚至《南华早报》都拥有大片土地。


    尽管没有人会指责这群公司对 NFT 或元宇宙特别感兴趣，但这一概念具有价值。一些公司正努力从中获利。


    很难不发现比特币市场与一些最流行的元宇宙之间的互动方式，与现实世界经济运作方式之间的联系。总体结果可能是美好的，也可能是可怕的，这取决于你站在哪一边。


    ## 元宇宙的未来


    没有人能否认元宇宙概念已经开始扩展到此前未被发现的领域。从《Second Life》、《Habbo Hotel》甚至早已消失、早已被遗忘的《Club Penguin》等游戏中卑微的起源，我们已经走得很远了。


    据扎克伯格称，Meta 旨在通过 Horizon Worlds 快速起步，尽管他自己也承认我们还没有完全做到。元宇宙要渗透到我们的现实中，达到 Meta 所期望的普及和可及程度，还需要数年时间。


    元宇宙中共享现实的概念，即来自不同大洲的个人可以一起玩耍、学习、交流甚至工作，是未来主义和乌托邦式的。在元宇宙中，布满商店、公园和人群的繁华街道都可以被复制，但实现这一点所需的技术对普通个人来说仍然遥不可及。


    元宇宙体验的现实性是迈向广泛接受的又一步。将虚拟现实和增强现实添加到元宇宙中，无疑会让体验感觉比使用键盘和鼠标时更加真实。


    Travis Scott 在 Fortnite 中举办音乐会的截图。


    我们已经看到一些引人入胜的跨界合作，它们推动了元宇宙的边界。Travis Scott 在 Fortnite 中举办了一场虚拟音乐会，吸引了超过 1200 万名玩家。Justin
    Bieber 刚刚表示他也打算这样做。Snoop Dogg 是 NFT 的积极支持者，他在 The Sandbox 中拥有土地，并允许访客购买 VIP 通行证，未来可以参观他的家，即使目前尚未开放。


    扎克伯格认为元宇宙是互联网的未来，甚至将其称为移动互联网的“继任者”。这是否正确还有待观察。


    可以肯定的是：元宇宙不再仅仅是从科幻电影中摘取的奇幻概念。相反，Facebook/Meta 只是向一团已经燃烧的火焰浇了油，在未来几年里，我们可能会看到元宇宙被用于我们从未想象过的方式。


    ## 还有谁有能力创建元宇宙？


    尽管元宇宙可以取代互联网成为计算平台，但它不太可能遵循其前辈相同的演化路径。互联网是由美国的公立研究型大学和政府项目开发的。这部分是因为私营部门很少有人看到了万维网的商业潜力，但也部分是因为这些组织几乎是唯一拥有构建它所需的计算能力、资源和目标的机构。不幸的是，在谈到元宇宙时，这些都不成立。


    '
