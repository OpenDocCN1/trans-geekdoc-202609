    # 简介


    元宇宙的概念早在 Facebook 改名为 Meta，首席执行官马克·扎克伯格详细谈论“元宇宙”之前就已经存在并快速发展。无法回避：元宇宙已经到来，并且很可能会长期存在。


    那么，元宇宙究竟是什么？它是否像某些公司声称的那样重要，还是仅仅是一个短暂的时尚，几个月后就会消失？您是否需要了解关于元宇宙的一切，并且应该在它进一步爆炸之前参与进来？本书深入探讨了元宇宙的概念，讨论了它的过去、现在，最重要的是，未来。


    # 第 1 章：


    # 元宇宙的概念


    尽管新颖，元宇宙似乎已经无处不在。


    Facebook（呃，Meta）最近的重新品牌化和投资引发了对元宇宙的新一波兴趣。它无处不在，出现在新闻、表情包、游戏平台和社交媒体上。这个词日益增长的流行度正在产生一种即将来临的毁灭感，仿佛我们的物理生活随时都会被包裹，融入像素和付费墙交易。然而，像《堡垒之夜》和
    Roblox 这样的游戏多年来一直在宣传元宇宙，这个短语本身也有几十年的历史。


    那么，元宇宙究竟是什么？


    马克·扎克伯格的版本描绘了一个虚拟现实的愿景：你使用 Quest VR 头显以化身的身份参加商务会议，并使用手腕上的设备偷偷给朋友发短信。当你外出时，你会戴上智能眼镜，捕捉你看到和听到的内容并提供增强现实。元宇宙将通过手机、笔记本电脑、可穿戴技术和头显（或这些设备的组合）访问。它将是你工作、锻炼、购物、社交、看电影和玩电子游戏的地方。


    然而，这个词早于许多可能使其成为现实的技术。后缀 meta- 可以表示“背后或超越”、“更广泛”或甚至“变革性”等含义（如变态）。单词 -verse 来自单词“universe”，指特定的领域或区域（例如
    Twitterverse）或虚构的世界（例如 omegaverse（抱歉！），一种投机性的替代现实文学流派，其中角色被分为阿尔法、贝塔和欧米伽）。一个存在于现实世界之外、之上或之外的虚拟环境被称为“元宇宙”。


    这个术语首次使用是在尼尔·斯蒂芬森 1992 年出版的反乌托邦科幻小说《雪崩》中。根据小说，元宇宙是一个围绕超长“街道”的虚拟和增强现实的集合，个人可以作为化身在上面行走，并通过护目镜和计算机访问。公共终端的用户被描绘为模糊的黑白化身，而私人终端则以全彩色和细节描绘。从那以后，“元宇宙”一词已经来指代构建一个更持久的虚拟世界并渗透到我们日常生活中的广泛活动。


