    # CHAPTER 8


    # THE ALTCOIN


    ## 什么是替代加密货币（Altcoins）？


    替代比特币的加密货币被称为 altcoins (`BTCUSD`)。它们与比特币有一定相似之处，但在重要方面有所不同。例如，一些 altcoins 使用不同的共识技术来构建区块或验证交易。此外，它们可能通过提供智能合约或降低价格波动等新功能或改进功能，将自己与比特币区分开来。


    截至 2021 年 11 月，大约有 14,000 种加密货币。根据 CoinMarketCap 的数据，仅比特币和以太币就占了 2021 年 11 月总加密货币市场的约
    60%。1 其余部分由所谓的 altcoins 组成。Altcoin 的价格走势往往遵循比特币的路径，因为它们通常是衍生品。然而，分析师认为，随着加密货币投资生态系统的成熟和这些代币新市场的出现，altcoin
    的价格波动将变得独立于比特币的交易信号。


    ## 理解替代加密货币


    “altcoin”一词指所有比特币的替代品。它是“alternative”和“coin”的组合。比特币和 altcoins 的核心设计非常相似。因此，它们共享代码，并以点对点系统或能够同时处理大量数据和交易的大型计算机的方式运行。Altcoins
    试图在某些情况下成为下一个比特币，成为一种低成本的数字交易媒介。


    然而，比特币和 altcoins 之间存在重大差异。比特币是最早的加密货币之一，其哲学和设计为后续代币的开发提供了模型。然而，其实现中存在重大缺陷。例如，工作量证明
    (`PoW`) 是一种用于构建区块的耗能且耗时的共识技术。比特币的智能合约功能也同样有限。


    比特币在 2009 年推出后，成为第一个广泛使用的工作量证明应用。(`PoW`)。


    许多其他加密货币基于 2 `PoW`，它允许安全、去中心化的共识。


    为了获得竞争优势，altcoins 在被认为的比特币缺陷基础上进行构建。为了减少能源使用以及构建区块和处理新交易所需的时间，几个 altcoins 使用权益证明
    (`PoS`) 共识技术。


    以太币（Ether）是按市值计算的世界第二大加密货币，用作以太坊智能合约中的 gas（或交易费用支付）。Altcoins 通常解决之前对比特币的批评，例如可扩展性和可持续性，正如备受期待的以太坊
    2.0 推出所证明的那样。


    Altcoins 通过这种方式将自己与比特币区分开来，为自己建立了市场。因此，它们吸引了将其视为可行的比特币替代品的投资者。随着 altcoins 越来越受欢迎，用户和价格上涨，投资者期望获利。


    ## Altcoins 的类型


    Altcoins 根据其功能和共识程序存在于各种风格和类别中。以下是一些最重要的快速概述：


    基于挖矿的


