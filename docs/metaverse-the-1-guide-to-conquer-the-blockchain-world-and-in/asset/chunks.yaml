- raw: 'Any cable-based infrastructure update or relay is extremely expensive and
    complicated, especially if the purpose is to reduce geographic distance. It also
    necessitates extensive regulatory/government approval, usually at many levels.
    But, of course, wireless is easier to repair. And 5G undoubtedly helps, as it
    reduces 4G latency by 20–40ms on average (and promises as low as 1ms of latency).
    This, however, only assists with the final several hundred meters of data transfer.
    Then, you return to standard backbones after your data reaches the tower.


    Starlink, SpaceX''s satellite Internet constellation corporation, promises to
    bring high-bandwidth, low-latency internet to the United States and, eventually,
    the rest of the world. However, this does not account for extremely low latency,
    especially long distances. While Starlink achieves a trip time of 18–35 milliseconds
    from your home to the satellite and back, the data must travel from New York to
    Los Angeles and back. After all, relaying via numerous satellites is required.
    In some circumstances, Starlink makes travel lengths worse. For example, when
    traveling to a low-orbit satellite and back down, the distance from New York to
    Philadelphia is roughly 100 miles in a straight line and possibly 125 miles by
    cable, but over 700 miles when traveling to a low-orbit satellite back down.


    Furthermore, fiber-optic cable has a lower loss rate than light transmitted via
    the environment, particularly on gloomy days. Densely populated urban areas are
    also noisy, making them susceptible to interference. Elon Musk stated in 2020
    that Starlink is focused "on the hardest-to-serve clients who \[telecommunications
    firms\] would otherwise have difficulty reaching." This way, it welcomes additional
    people into the Metaverse rather than enhancing those already there.


    To meet the increased demand for real-time bandwidth applications, completely
    new technologies, business lines, and services are being developed. For example,
    Subspace (Disclosure: portfolio company) deploys hardware across hundreds of cities
    to create ''weather maps'' for low latency network pathfinding, runs a networking
    stack that includes the needs of a low latency application with the many third-parties
    that make up this path, and has also built an optical network that splices across
    various fiber networks to shorten the distance between servers and minimize the
    use of non-fiber c.


    On the other hand, Fastly provides a CDN that favors low-latency apps over delivery
    reliability and bandwidth. Using an "infrastructure-as-code" approach that allows
    clients to customize nearly every aspect of the company''s edge-computing clusters,
    the company claims that a software application can clear and replace all cached
    content across all of these clusters globally in 150ms and that it can cache and
    accelerate individual blockchain transactions in real-time.


    Reliability


    The concept of dependability is self-evident. Our ability to transition to virtual
    work and education relies on consistent service quality. This includes overall
    uptime and other factors like download/upload bandwidth and latency constancy.
    Much of what follows may appear alarming to many people who ''live online'' nowadays—most
    of the time, Netflix streams in 1080p or even 4K. But, on the other hand, Netflix
    uses reliability solutions that aren''t suitable for games or Metaverse-specific
    applications.


    Non-live video providers like Netflix hours receive all video files for months
    before being made available to audiences. This enables them to do in-depth analysis
    to reduce (or compress) file sizes by studying frame data to determine what information
    can be eliminated. For example, Netflix''s algorithms will ''watch'' a scene with
    blue skies and determine whether 500 various shades of blue can be simplified
    to 200, 50, or 25 if a viewer''s connection bandwidth dips. The streamer''s algorithms
    take this into account on a per-scene basis, understanding that moments with dialogue
    can withstand greater compression than scenes with fast-paced action. This is
    referred to as multipass encoding. Netflix, as previously said, uses extra bandwidth
    to transfer content to a user''s device before it''s needed, so the end-user is
    unaffected if there''s a momentary dip in connectivity or rise in latency.


    Furthermore, Netflix will pre-load content at local nodes, so the latest episode
    of Stranger Things is only a few blocks away when you ask for it. This isn''t
    viable for live video or data, which, as previously stated, must arrive faster.
    This is why cloud-streaming 1GB of Stadia is more difficult than cloud-streaming
    1GB of Netflix.


    So, while Metaverse''s goal isn''t inherently competitive, we should consider
    it as raising the bar for all aspects of networking — latency, reliability/resilience,
    and bandwidth — to that of AAA multiplayer games. It makes no difference how powerful
    your equipment is (see hardware and computing) if it can''t get all of the data
    it requires promptly.


    # CONCLUSION


    Without a doubt, the Metaverse will have far-reaching consequences for our society.
    It will change how we communicate, advertise ourselves, and brand ourselves. Furthermore,
    this cutting-edge technology will bring new opportunities as well as challenges.
    The metaverse has the ability to unleash massive amounts of creativity while also
    broadening our economic, entertainment, and cultural horizons.'
