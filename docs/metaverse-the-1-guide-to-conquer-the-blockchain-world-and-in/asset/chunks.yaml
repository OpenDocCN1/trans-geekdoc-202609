    mining-based. Premined altcoins are a popular alternative to mining-based altcoins
    and are commonly included in ICOs (ICO). These coins are distributed rather than
    manufactured via an algorithm before being placed on cryptocurrency exchanges.
    The XRP token from Ripple is an example of a pre-mined coin.


    # Stablecoins


