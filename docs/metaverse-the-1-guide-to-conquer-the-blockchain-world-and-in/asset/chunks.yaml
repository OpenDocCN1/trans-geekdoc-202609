- raw: "Communities, corporations, and initiatives that generate revenue using a token\
    \ may not always pass earnings on to token holders directly. The idea of buybacks\
    \ / token burns sparked a lot of interest as one of the aspects of the Binance\
    \ (BNB) and MakerDAO (MKR) tokens. Native tokens are bought back from the public\
    \ market and burned as revenue flows into the project (through Binance trading\
    \ fees and MakerDAO stability fees), resulting in a decrease in the supply of\
    \ tokens and a price increase. It's interesting looking at Arjun Balaji's analysis\
    \ (The Block). He claims that the Binance token burning mechanism doesn't truly\
    \ result in an equity buyback: because no dividends are paid out, the \"income\
    \ per token\" remains at $0.\n\nWork Tokens:\n\nThe work token is a concept that\
    \ focuses completely on the revenue-generating supply side of a network to eliminate\
    \ friction for users. One of the business models for crypto-networks is that we\
    \ see 'hold water.' Augur's REP and Keep Network's KEEP coins are two good examples.\
    \ Work tokens work in a similar way to traditional taxi medallions. They demand\
    \ service providers to stake/bond a particular quantity of native tokens in exchange\
    \ for the right to perform profitable work to the network. One of the most significant\
    \ properties of the work token paradigm is its ability to incentivize actors with\
    \ a carrot and a stick (rewards for labor) (a stake that can be slashed). They\
    \ can also be judged based on predictable future payment flows to the collective\
    \ of service providers and provide network security by motivating service providers\
    \ to do honest work (as they have locked skin in the game denominated in the labor\
    \ token). In a nutshell, such tokens should be priced based on future predicted\
    \ cash flows attributed to all network service providers, which may be modeled\
    \ out based on network pricing and usage assumptions.\n\nA variety of different\
    \ models are being investigated and are worth mentioning:\n\n•        Dual token\
    \ model, such as MKR/DAI and SPANK/BOOTY, in which one asset absorbs the volatile\
    \ ups and downs of consumption while the other is kept stable for optimal transactions.\n\
