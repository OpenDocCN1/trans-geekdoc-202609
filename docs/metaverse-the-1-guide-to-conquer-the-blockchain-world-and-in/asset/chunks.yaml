    元宇宙可以打开一个充满可能性的世界，但用户才是实际承诺的持有者。通过货币化你的数字工艺品，你可以从数字资产中获益。筹款活动、游戏和收藏品可能会被转化为数字资产，随后可以将其代币化为游戏内资产，或制作成玩赚游戏。用户可以投资并进行非同质化代币交易，无需实际游玩即可赚取真金白银。甚至可以构建一个与我们现实世界一模一样的虚拟现实，并改进其关键特性。然而，使用一个能够保护和认证其所含数据及支持资金的元宇宙区块链是至关重要的。最后，理想的加密货币将让你进入你所选择的世界。


    # CHAPTER 7


    # 2022 年最佳元宇宙游戏推荐


    “元宇宙”在过去几个月里人气飙升，但加入还不算太晚。以下是 2022 年值得游玩的顶级元宇宙游戏列表。


    NFT 游戏已经存在相当长一段时间了。在加密货币的早期，就有不少此类游戏。然而，这一切始于今年早些时候《Axie Infinity》的巨大成功。


    在《Axie Infinity》迅速崛起之后，其他加密游戏也纷纷效仿，投资者们正在寻找下一个“暴涨”的 NFT 游戏。许多人认为“元宇宙”将是下一个大趋势。


    元宇宙是一系列虚拟世界的集合，即使你没有积极游玩游戏，这些世界依然存在。这些虚拟环境大多与 VR 和 AR 相连以增强沉浸感，尽管它们并不局限于这些技术。


    大多数元宇宙游戏要求你拥有独一无二的、完全数字化的 NFT。元宇宙的目标是连接我们的物理世界与数字世界。它被认为是互联网的下一代。


    Facebook 刚刚将其名称改为“Meta”，并全身心投入到元宇宙的开发与推进中。因此，许多企业效仿 Facebook 的做法，开始更加关注元宇宙。


    这就是为什么许多人认为元宇宙在未来几年将是一个巨大的趋势，并开始在其中投入大量资金。这也是为什么，在 2022 年，我们着手发掘最佳元宇宙游戏。


    ## 2022 年前 15 名元宇宙游戏


    以下是我们对 2022 年最佳元宇宙游戏的一些推荐。这些是我们认为在 2022 年将保持相关性和稳定性的游戏。


    ### 1 Axie Infinity (AXS)


    Axie Infinity 是列表中的第一个名字。Axie Infinity 于 2018 年发布；然而，其人气近期有所上升。人们通过玩这款游戏赚了很多钱，它已成为
    NFT 游戏领域的支柱。


    《宝可梦》是 Axie Infinity 的灵感来源。它拥有被称为“Axies”的生物，你可以使用它们与其他 Axies 战斗。它目前的市值为 90 亿美元，使其成为最有价值的元宇宙游戏。它目前是最好的、最受欢迎的元宇宙游戏，其开发者对此有着宏大的计划。


    ### 2 The Sandbox Game (SAND)


    The Sandbox 是一个社区驱动的平台，允许你游玩、开发、拥有和管理一块虚拟土地。在 The Sandbox Game 中，你几乎可以随心所欲，就像在任何其他沙盒游戏中一样，只要你拥有那块
    LAND。


    你也可以简单地设计你的 NFT 头像，并游玩或探索他人的 LAND。由于其类似方块的图形，该游戏的风格和感觉与《我的世界》惊人地相似。


    Atari、Care Bears、The Smurfs、Snoop Dogg、The Walking Dead 和 Adidas 是在 alpha 测试阶段与其合作的企业之一。The
    Sandbox Game 与这些公司的合作帮助它成为未来值得游玩和关注的最佳元宇宙游戏之一。


    ### 3 Decentraland (MANA)


    另一种最近上涨并达到历史新高的加密货币是 MANA 代币。Decentraland 是第一个完全去中心化的世界。它很像 The Sandbox Game，你可以在其中游玩、创作、建造、探索，并做许多其他事情。


    开始使用 Decentraland 你只需要一个像 Metamask 这样的数字钱包和你喜欢的网页浏览器。之后，你就可以开始探索 Decentraland
    的数字世界，参与活动或与其他用户交流。


    ### 4 Illuvium (ILV)


    Illuvium 是一款基于区块链的开放世界角色扮演游戏。你可以探索游戏广阔的环境，并捕捉被称为“Illuvials”的强大怪物。尽管该游戏尚未发布，但它已经拥有
    10 亿美元的市值，是目前可用的顶级元宇宙游戏之一。


    开发者已经展示了 Illuvium 游戏体验的样本，到目前为止，它堪称壮观。它包括惊艳的图形、充满活力的环境和流畅的游戏体验。当然，只有时间才能证明 Illuvium
    是否真正伟大。即便如此，如果这些片段属实，它可能是最好的元宇宙游戏。


    ### 5 UFO Gaming (UFO)


    2022 年值得关注的另一个元宇宙项目是 UFO Gaming。它是一个完整的元宇宙生态系统，每个行星代表一个不同的游戏。玩赚模式将在其所有游戏中实施。


    他们的首款游戏名为 Super Galactic。这是一款拥有游戏内任务、锦标赛和 PVP 战争模式的游戏，你可以通过游玩来赚钱。还有一个育种和交易系统，以及用于物品、武器和角色的
    NFT 市场。UFO Gaming 未来应该会推出更多游戏。


    ### 6 Vulcan Forged (PYR)


    元宇宙还包括 Vulcan Forged，它是一系列游戏的集合。目前可用的四款游戏是 Vulcan Verse、Berserk、Forge Arena、Vulcan
    Chess 和 Blockbabies。然而，还有四款正在开发中：Block Babies、Coddle Pets、Geocats 和 Agora。


    每款游戏都有自己的游戏玩法和 NFT，这些 NFT 可以在市场中使用或交易。Vulcan Forged 是增长最快的区块链游戏和去中心化应用程序平台。它是元宇宙中最早建立的游戏工作室之一。它还可以创造元宇宙中可用的最佳游戏之一。


    ### 7 Mobox (MBOX)


    Mobox 是一款免费游玩的游戏，你只需通过游玩即可赢得奖励。它将 DeFi 和游戏相结合，创建了一个让每个人都能享受同一个宇宙的生态系统。


    “MOMOverse”正在与日俱增，现在拥有市场、NFT 农场和多款游戏等功能，未来还会有更多。MOMO Avatars、MOMO NFTs，甚至可以通过扫描附带的二维码转移到数字世界的实体盲盒，都在
    MOMOverse 中提供。


    ### 8 Star Atlas (ATLAS)


    Star Atlas 是一款独一无二的太空探索策略游戏，你可以在其中选择三个阵营之一。它是本列表中第一款建立在 Solana 区块链上的元宇宙游戏。尽管游戏仍在开发中，但它已经在
    Solana 区块链上确立了自己作为最受欢迎的元宇宙游戏之一的地位。


    由于游戏由虚幻引擎 5 驱动，你可以期待惊艳的视觉效果。探索星系的深处，控制各种领土。此外，Star Atlas 提供独特的多人游戏体验，让你可以与朋友一起探索星系。


    ### 9 Polkacity (POLC)


