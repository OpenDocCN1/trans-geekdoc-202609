  trans: '


    Bottom line: 买入并长期持有可能是地球上最明智的策略……直到它不再明智为止。你应该始终为投资制定退出策略。当牛市结束时，通常最好获利了结或卖出。不过，如果你寻求的是长期投资，买入并持有是一个可行的选择，任何价格通常都足够好。尽管如此，这种策略存在在高点全仓买入并`HODLing`一路下跌的风险。这可能会非常痛苦，所以请看看替代方案。


    在`HODLing`之前建立平均仓位：这是一种简单且保守的方法，可以让你免受日常价格波动的困扰。要么你定期买入，不顾价格，要么你随着价格随时间下跌而逐步买入。通过数月甚至数年建立长期仓位来避免择时错误是一个好方法。与此同时，当收益时有时无地出现时，你可以拿走部分或全部收益（如果以后看到更有吸引力的价格，可以再次再投资）。人们可能还希望逐步退出头寸。通过随时间逐步加入和退出头寸，你可以在投资时降低风险。这对于比特币这样波动大、高风险高回报的资产来说可能是一个绝佳的策略。作为额外的好处，你最终可能支付长期资本利得税而不是短期资本利得税（后者大约只有前的一半），并且你可以避免交易者在提交复杂加密税务时面临的一些问题。


    Bottom line: 对于新手投资者来说，分批建仓并`HODLing`是最佳选择。毫无疑问。没有竞争。这类似于“全仓买入并`HODL`”，但它给了你更多喘息空间，以及如果市场走势与你相反时可以采取的更多选择。当然，在一波精彩行情开始前就开始这样做没那么有趣，但在这种情况下，只需对行情开始前的买入感到高兴即可。你很可能很快就会有机会低位买入，并且你会做好准备！在某些情况下，保守意味着为了短期收益降低而换取谨慎。十有八九，这是一个很好的权衡。


    你不需要知道比买卖加密货币更多的东西来进行低买高卖交易。在你认为价格较低时买入，例如价格连续下跌几天后的价格，然后在价格较高时卖出。如果你犯了错误，你可以设置止损，或者“持有被套”（基本上如果你犯了错误就回到“建立平均仓位并持有”的方法）。如果你想成为这方面的专家，你需要学习技术分析（`TA`）。你可以使用`TA`根据支撑位、移动平均线和其他指标来做出买卖决策。如果你做对了，`TA`可以帮助你提高交易的盈利能力，但如果你做错了，它可能会让你心态崩溃。如果你决定交易，请留意手续费和投资组合侵蚀。在横盘市场中，经验丰富的交易者可以跑赢`HODLers`，在负面条件下，他们也可能跑赢他们（因为交易者更倾向于卖出并持有现金等待）。交易者（尤其是新手交易者）可能会错过一些短暂而剧烈的行情，因为他们追逐最后一枚一路下跌的表现良好的币种，而错过了排在下一位的币种。如果你没有时间或精力全天候（每天
    24 小时，每周 7 天）关注不可预测的加密货币市场，请考虑只交易你总可投资资金的一部分。学习成为一名不错的加密货币交易者需要时间和自律（不过非常有趣）。


    Bottom line: 交易很有趣，如果你技术娴熟、自律且了解技术分析，它可能是最盈利的方法。出于各种复杂的原因，“新手”在交易中很可能会被“割韭菜”。没有人指望通过交易跑赢`HODLer`，但大多数人确实如此（就我的研究而言）。在变得更好的过程中受一些挫伤是可以的，但不要在你还没有到达时就自欺欺人地认为你已经成功了。因为你可能没有，所以从小额买入开始，不要交易过于频繁。


    TIP: 你可以进行加密货币对加密货币的交易，或者加密货币对加密货币的交易。加密货币对加密货币交易的额外好处是，在你试图增加特定币种持仓的同时，始终保持在加密货币领域。然而，它比看起来更困难，可能会让你错过行情……所以请记住这一点。


    投资交易机器人：交易机器人是替你处理交易的计算机程序。主要优势是它可以在你睡觉时执行你的指令。它消除了与睡觉相关的所有焦虑。如果你要交易，花时间、精力和金钱来设置和管理机器人可能是值得的。你不需要对它做任何事情；只需让它为你设置止损，或者如果你懂一些基本的`TA`，就让它在
    2 小时以上的 K 线上交易死叉和金叉（这种策略足够常见，以至于你应该在任何时间框架上都了解它；如果每个人都用没有额外参数的自动化……每个叉点都会比已经更加引人注目）。


    Bottom line: 对于不是同时拥有基本交易和`TA`知识的业余程序员的新手交易者来说，交易机器人可能要求太高（门槛不高，但有一些障碍和学习曲线）。一旦你掌握了技术，它将大大减轻你一天的压力。如果市场在凌晨
    4 点暴跌，你可能无法卖出。你可能不坐在电脑旁，准备在你上班时出现的金叉买入……但你的机器人在……并且它只根据事实做出决策。让你的加密机器人为你做出合理的决策，去除你的情绪。


    ![](img/Image00001.jpg)


    NOTE: 我上面提到了`MACD`交叉作为一种`TA`技术，因为当价格上涨时，短期平均线必须交叉上穿长期平均线，当价格下跌时则反之。其他技术指标更具预测性，并有助于定义概率。相比之下，`MACD`交叉只是一个必然发生的现象（这使得它们非常适合专注于长期投资而非日内交易的长时间框架机器人）。


    你可以通过关注比特币的`MACD`来大致了解市场趋势。


    使用交易机器人投资：“交易机器人”是一个误称。当你使用交易机器人时，你不需要主动交易。它可以用来建立币种收藏或控制风险（设置止损和止买，或者你可以只在图表非常看跌时退出头寸，并在它们一转势时立即重新入场）。你可以使用机器人通过选择保守的低风险/低回报技术来保护或增长你的资金。你可能知道你想投资比特币，但这并不意味着你想在
    80%的下跌中硬扛。你的情绪可能会干扰，但你的机器人不会，所以告诉它你想要什么，然后走开。结论：如果你打算使用机器人，从这种策略开始。这是中级投资者想要进入加密货币但不想成为殉道者、不顾市场状况`HODL`他们拥有的每一枚币种的绝佳选择。


    套利：你知道吗，你可以在一个交易所以较低价格买入一种币种，并在另一个交易所以较高价格卖出？这被称为在交易所之间进行套利（或者简单地说“套利”）。套利可以非常有利可图，但你必须行动迅速。你可以使用机器人，但你必须授予你的机器人提币权限，这可能有点不愉快。


    '
