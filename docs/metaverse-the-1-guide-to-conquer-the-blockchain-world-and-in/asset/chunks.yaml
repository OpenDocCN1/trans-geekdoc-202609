    However, Tom Caudell and David Mizell were the first to document the augmented
    reality features in 1990. Julie Martin introduced the first completely working
    AR gadget in 1994. It was called "Dancing in Cyberspace" for a reason: it was
    an augmented reality theater that mixed virtual items with real-world settings.


    AR has progressed rapidly in the twenty-first century. For example, Hirokazu Kato
    launched ARToolKit, an open-source AR library, in 2000. It was a ground-breaking
    combination of virtual graphics and real-time video tracking for overlapping images.
    ARToolkit was effortlessly integrated into web browsers nine years later. In 2013,
    Google debuted the "Google Glass" project, and in 2016, the augmented reality
    game "Pokemon GO" dominated the world. The year 2017 was marked by the introduction
    of eye-tracking augmented reality technology. Since 2018, over 1,000 apps with
    a range of augmented reality capabilities have been released on the Google and
    Apple app stores.


    What''s the Difference Between Augmented Reality and Virtual Reality?


    Virtual reality (VR), a technology that immerses the user in a synthetic environment
    and disconnects him or her from the actual world, is commonly mistaken with augmented
    reality. The distinction between AR and VR is that the former enhances reality,
    while the latter replaces. AR posits the overlaying of digital, computer-generated
    information (e.g., video, sound, or animation) over the real-time environment
    to supplement it in this way.


    Consider numerous examples of VR and AR devices to better understand augmented
    reality technology.


    AR apps include:


    •        Customers can use Ikea''s augmented reality app to find the appropriate
    product for their space. They can look around the room using their smartphone''s
    camera. They can instantly see if a piece of Ikea furniture matches the design
    in their flat by swiping and clicking it.


    The Gap recently debuted AR-enhanced changing rooms, allowing customers to try
    on a range of goods without having to lug their belongings across the store.


    •        Bayern Monaco has released an augmented reality app that allows fans
    to take photos with their heroes without traveling to Munich and catching the
    stars.


    •        Thanks to Land Rover''s augmented reality software, drivers can see the
    car''s engine through the transparent bonnet.


    Examples of virtual reality include:


    •        Marriott''s virtual reality "Transporters" software allows guests to
    tour its properties worldwide. The software is realistic and may provide a true
    travel experience.


    •        SportX''s virtual reality simulator allows clients to try on the sportswear
    they sell in a range of simulated activities, such as jogging, swimming, or tennis.


    •        During an operation, the HoloTeach VR app allows surgeons to engage and
    consult in real-time, even if they are thousands of miles apart.


    AR is a interactive reality that incorporates computer-generated components such
    as video, sound, or graphics/animation into the actual world to provide a more
    immersive experience for the user.


    ![](Image00000.jpg)


    ## TYPES OF AUGMENTED REALITY


    Due to recent breakthroughs in the IT business, modern augmented technology comes
    in various forms. Here''s a quick rundown of the most common types of augmented
    reality used by businesses and consumers today.


    AR with markers


    A marker (a thick black square border) was employed as a reference item to measure
    the distance between a computer and the object at the start of AR development.
    To put it another way, a marker-based AR app relies on the reader (which is usually
    a camera) to interpret an image and generate 3D objects in the virtual environment.


    Markerless AR


    Despite the obvious benefits of marker-based AR, the thick black marker''s visual
    appearance was unappealing, reducing the market''s adoption of market-based solutions.
    The markerless AR was created primarily for business use to address the previous
    generation''s shortcomings. General images are used as markers in this AR type,
    provided via image extraction techniques such as SIFT, SURF, and FAST-SURF. Most
    recent markerless AR systems use the robust point matching approach to deal with
    the problem of robustness caused by outliers, massive occlusion, and other factors.
    You can use it to detect and map the real-world surroundings and place virtual
    items within it. Anything from a dancing animated creature on the table to an
    IKEA sofa placed in your home is an example of markerless AR.


    Projection-based AR


    The projection-based version of AR, as the name implies, uses a video projector
    to display pictures on a screen or a variety of physical surfaces. The utilization
    of real-world objects for the projection of virtual pictures is at the heart of
    this AR category. It''s often utilized in product visualization and industrial
    assembly. However, portable projection-based AR is limited to a degree in projection
    quality on diverse, weirdly shaped surfaces because of reflectance, color, and
    geometry variances.


    Superimposition-based AR


    This sort of augmented reality assumes that the graphical modifications to the
    real thing are superimposed directly on it (or its fully replicated picture),
    resulting in an augmented view of the real object. The ability of technology to
    recognize things is important in superimposition-based AR execution because the
    inability to identify an object prevents the original image from being replaced
    with an augmented view. The real-time medical evaluation of patients is a good
    example of this type of augmented reality. Some medical institutions, for example,
    provide a live feed from X-ray equipment so that the X-ray results can be superimposed
    on an actual image of the patient''s body.


    ## WHAT IS AUGMENTED REALITY AND HOW DOES IT WORK?


    AR applications aren''t just for amusement anymore. This technology has a wide
    range of business, science, and research applications. Here are some specifics
    on the processes and tools utilized to build immersive augmented reality experiences.


    Cameras and sensors


    The construction of any AR element necessitates the exact capture of real-world
    items to realistically augment them on your display. The AR program uses a range
    of sensors for these goals, including mechanical, biological, acoustic, optical,
    and environmental sensors.


    Mechanical sensors record the object''s position, shape, acceleration, mass, and
    displacement. One of the most common applications is determining the object''s
    position, weight, and movements.


    The heart rate, temperature, neural activity, and respiration rate of the object
    are all measured by biological sensors. They can identify moods and assess people''s
    mental and physical states.


    Acoustic sensors offer precise sound''s loudness, pitch, frequency, phase, and
    modulations, which is extremely useful for sound detection and speech recognition.


    The emissivity, refraction, lightwave frequency, brightness, and luminance of
    an object are all reported by optical sensors, useful for computer vision detection,
    presence detection, and IR motion analysis.


    Environmental sensors collect information about the temperature and humidity of
    the surrounding area.


    The depth-sensing camera — a camera that can collect 3D pictures – is one of the
    most important instruments for creating engaging AR experiences. Traditionally,
    AR devices feature at least one camera, with some having two for depth sensing.
    It''s also usual to include an infrared camera in the gadget to enable advanced
    depth-sensing and heat mapping.


