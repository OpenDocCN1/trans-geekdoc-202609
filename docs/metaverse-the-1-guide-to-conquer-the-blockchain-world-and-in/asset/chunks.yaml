    Altcoins, unlike standard equities, are far more than just financial instruments
    that may be traded. They have their own set of concrete objectives. Some assist
    in the mediation of currency prices, others in the acceleration of payment processes,
    and others in strengthening a platform''s transparency and accountability, such
