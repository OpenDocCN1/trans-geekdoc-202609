    to have an international karaoke KTV? These are not, just as Facebook, Google,
    and Amazon cannot represent the Internet independently; instead, they must link
    and interact with other platforms to build a true Metaverse.


    ## Blockchain enables enterprise business models in the Metaverse


    Since its start in 2017, enterprise blockchain has gone a long way. Initially,
    blockchain for business was a system based on private, permissioned networks and
    was largely utilized for the supply chain management. Enterprises began to use
    public, permissionless networks like Ethereum to do business as blockchain matured.

    '
  trans: '


    你必须在多元化游戏中玩得聪明，以对冲你的加密资产。那么，实现这一目标的最佳方式是什么？要构建跨市场的投资组合，要跳出思维定势，将你的资产从加密货币多元化到股票、黄金和其他传统工具中。一个同时包含股票和加密货币的投资组合可以帮助你克服加密市场的高度相关性。简单来说，比特币（占加密市场
    45%）的上涨趋势总会导致更广泛的加密市场出现类似趋势，反之亦然。因此，在市场崩盘时，没有任何“安全的加密资产”可供你依赖。所以，巨大的投资基金如今试图将两者结合起来，这并不奇怪。


    ## 7 从小开始，追求流动性。


    在全力投入加密市场之前，先进行一次试运行。从小额投资开始，随着时间的推移逐步建立你的投资组合。一旦你意识到自己走在正确的道路上，就再也没有回头路了。另一种让资金保持流动并增值的简单方法是定期交易。


    为了安全并保持加密投资的流动性，流动性至关重要。投资者经常选择交易量较小的山寨币。这个决定可能会变成一种劣势。虽然山寨币的价格可能会上涨很多倍，但你无法将它们卖出以获利。即使你能卖出大量代币，由于缺乏流动性，价格也可能暴跌。那么，如何保持安全？低交易量的加密货币应不惜一切代价避免！


    # CHAPTER 10


    # 元宇宙中的十种商业模式


    元宇宙有什么吸引人的地方？从技术角度来看，区块链为所有数字资产提供了可强制执行的产权。从互联网发展来看，3D 和多媒体长期以来一直是主流趋势。互联网已经朝着更生动的方向发展，从文本通信到照片、视频和直播。元宇宙结合了这两个观点：它建立在区块链技术之上，并遵循丰富内容的趋势。那么，未来的元宇宙会有哪些商业模式呢？


    ## NFT 销售


    画廊现在是元宇宙中最流行的商业模式，这可能源于 NFT 与艺术之间的内在联系。许多最初的元宇宙成员是画家或在艺术领域工作。在韩国社区中，CryptoVoxels
    的作品包括刘佳莹的“纯金画廊”、宋婷的“熊猫画廊”、BCA 画廊和 Doge Sound Club。这是元宇宙的第一种也是最流行的商业模式。


    ## Vox 销售


    与现实世界不同，元宇宙由不同的材料组成。例如，CryptoVoxels 中的所有结构和可穿戴设备都完全由体素（voxels，三维网格上的数字值）制成。因此，在
    CryptoVoxels 中需要使用 vox，它作为建筑装饰或个人展示。许多 vox 商店应运而生以满足这一需求，其中 voxWalk 是这一商业理念最突出的例子。


    ## 元宇宙中的十种商业模式


    未来，你的公司可能需要购买虚拟广告牌，在 Discord 等平台上与粉丝互动，并与 Jadu 或 The Fabricant 等公司合作制作虚拟资产。它们将作为实体企业与增强现实和虚拟现实之间的桥梁。元宇宙将创造复杂而创新的广告活动，模糊物理世界与虚拟世界之间的界限。


    ## 建筑


    一些土地所有者拥有许多地块，但缺乏时间和精力进行建设。其他土地所有者使用专家团队来构建他们的地块以发展自己的品牌。由于这种需求，元宇宙中出现了第三方建筑服务，例如
    MetaEstate 和 Voxel Architects。在 CryptoVoxels 的主岛 Origin City 上，累计访问量最多的前四个结构——SpaceAge、StoneAge、GlassAge
    和 Welcome——均由 Voxel Architects 创建。MetaEstate 还建造了著名且美丽的结构，例如 MetaChi 总部和 Creation
    Fashion Hub。


    ## 数字地块租赁


    数字地块，如同现实世界中的房地产，可以租赁和购买。根据 CV Analytics 的调查结果，许多土地所有者拥有多个地块。大多数土地所有者不打算建设他们的地块，而是选择长期投资。因此，一个自然的土地租赁市场应运而生，允许土地所有者将其未使用的房产租给需要进行开发或运营的其他人。


    ## 沉浸式体验


    那些过于专注于设计氛围而忘记现实的人是沉浸的。当哈利·波特举起移动的椅子，与变形金刚一起跳上塔顶，并在环球影城北京与小黄人 Fiddle 一起嬉闹时，这种看似触手可及的体验是一种精神上的沉浸。因此，元宇宙是一种基于专业建筑设计和沉浸式
    3D 体验的自然环境。


    ## 游戏


    由于游戏的虚拟性质，游戏很容易集成到元宇宙中。The Sandbox 是一个由社区驱动的区块链游戏平台，允许设计师将体素资产和游戏内小工具转换为 NFT。当然，游戏也可以集成到其他元宇宙平台中。玩家可以通过参与链上游戏，在投资
    NFT 的同时享受乐趣。


    ## 服装销售


    从某些方面来说，元宇宙永远无法取代现实世界。例如，衣食住行都是基本的物质需求。特别是，在线服装销售已经从过去引入 2D 图像发展到直播试穿，并正在向未来的
    3D 方向发展。事实上，看着别人试穿衣服与自己试穿的效果不同。例如，你可以使用 3D 扫描仪将你的 3D 虚拟形象穿上你的 3D 虚拟衣服。


    ## 在线 KTV


    KTV 是喜欢它的人的一种社交方式。对于住得远的人来说，在现实世界中在 KTV 相见很困难。然而，这些愿望在元宇宙中可能会实现。


    ## 数据服务


    数据无处不在，元宇宙也不例外。例如，平台需要每个地块的访客数据，潜在买家需要已售地块的历史数据，潜在卖家需要市场数据来计算他们的要价。上述每一项都需要数据支持，一家熟练的数据分析提供商可能会成为一项有利可图的业务。


    在元宇宙中，有十种不同的商业模式。


    不久的将来可能会出现许多新工作。元宇宙建筑师、元宇宙游戏策划师、建筑和运营专业人员等都是例子。除了上述列出的十种之外，无疑还有其他成功的商业理念。


    那么，元宇宙的未来会是什么样子？一个结合社交媒体和广告的三维“Twitter”？一个接一个的沉浸式项目体验？3D 试穿和试装的互联网市场？有可能拥有国际卡拉
    OK KTV 吗？这些都不是，正如 Facebook、Google 和 Amazon 无法独立代表互联网一样；相反，它们必须与其他平台链接和交互，才能构建真正的元宇宙。


    ## 区块链使元宇宙中的企业商业模式成为可能


    自 2017 年开始以来，企业区块链已经走得很远。最初，商业区块链是一个基于私有许可网络的系统，主要用于供应链管理。随着区块链的成熟，企业开始使用以太坊等公共无许可网络进行业务。


