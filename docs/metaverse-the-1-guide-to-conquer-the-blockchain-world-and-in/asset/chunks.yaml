  trans: '


    创建与现实生活事件相关联或与贵公司目前业务相似的营销体验。例如，在六月份，AB InBev 的 Stella Artois 与 Zed Run 合作，创建了一个主题为
    Tamagotchi 的肯塔基赛马体验。之所以这样做，是因为 AB InBev 的 Stella Artois 以支持体育活动（尤其是赛马）而闻名。因此，为他们创建一个可以出售、竞速和繁殖非同质化代币（NFT）马匹的在线平台，似乎是一个合乎逻辑的下一步。


    ## 沉浸式体验是关键


    你可以在元宇宙中销售虚拟广告。例如，Bidstack 是一家视频游戏广告技术公司，已从传统的户外广告转向虚拟广告牌广告。


    不过，虚拟广告牌并不是唯一的选择。由于元宇宙本身就非常迷人且具有沉浸感，因此最好利用这一点，为你的广告和营销活动提供可比拟的沉浸式体验。例如，提供品牌装置和活动，让用户可以与之互动，而不仅仅是展示广告。


    早期采用者已为消费者提供了沉浸式体验，例如 Roblox 上的 Lil Nas X 表演、Gucci Garden 体验之旅，以及 Warner Bros.
    通过重建华盛顿高地地区来推广《在高处》。此外，品牌最近通过与 Roblox 元宇宙及其他元宇宙合作，发现了新的收入来源。


    ## 收藏品应可供获取


    人们喜欢收集东西，而元宇宙为他们提供了另一个这样做的渠道。通过提供仅在元宇宙中才能获得的资产或限量版物品，你可以在元宇宙中复制这种体验。


    例如，在 Gucci Garden Roblox 体验中可以找到收藏家房间。它允许用户在元宇宙中收集限量版 Gucci 产品。该游戏最初的收藏品销售为 Gucci
    带来了总计 286,000,000 Robux 的收入。


    ## 参与现有社区


    总体而言，公众讨厌广告。因此，试图进入元宇宙的企业必须避免冒犯已经在那里的个人。因为你将向这些用户进行营销，你也需要他们的积极反馈。


    重要的是要记住，你不能简单地进入一个新平台而不考虑新的格式。例如，当企业与 Roblox 开发者社区的成员合作构建商品和体验时，就会获得关注。同样，当 O2
    举办 Fortnite 演出时，他们聘请了已经熟悉该游戏的程序员。


    这是影响者营销的一个例子。由于用户生成内容非常重要，社区成员对于你的营销活动的成功至关重要。


    ## 持续实验


    营销人员正处于一个令人兴奋的时期。虽然一些指南可以帮助营销人员确定应采用哪些方法和策略，但元宇宙仍然是一个相对较新的平台，有大量实验的空间。最佳实践仍在建立之中，整体范式也在不断发展。因此，营销人员有很大的自由去尝试新事物，并在策略上发挥创造力。


    ## 其他值得注意的元宇宙案例


    - Dimension Studio 为时尚公司进行的元宇宙实验带来了 650 万美元的收入。他们设计了一个虚拟制作设置，允许消费者走上平台，让 106 台摄像机扫描身体，然后被放置在虚拟世界中试穿服装和其他物品。他们因在
    Balenciaga 的 Autumn/Winter 2021 Afterworld 游戏中的工作而闻名。


    - 开放世界沙盒游戏《侠盗猎车手 V》提供了与香港示威者使用的服装选项相似的选项。许多艺术家已使用虚拟世界来表达政治观点，香港示威者可以将他们的斗争从现实世界转移到元宇宙中。


    - 用户可以在 Houzz（一个家居装饰网站）上创建家具和其他家居物品的数字照片集。每当有人使用 Houzz 购买东西时，他们就会赚钱。2017 年，他们创建了一个
    3D 查看器，允许客户直接通过相机以 3D 查看产品，并将其直观地集成到实际环境中。


    - 对于步行导航，Google Maps 展示了一个增强现实应用程序。用户可以使用此功能获取精确的视觉指示和箭头，帮助他们到达目的地。只需将用户的相机对准需要前往的方向，AR
    功能就会将他们引向正确的方向。


    # CHAPTER 11


    # 从元宇宙中获利


    长期以来，虚拟场所和世界一直很受欢迎。人们通过《模拟城市》和《侠盗猎车手》系列等游戏沉浸在虚拟环境中。由于这些游戏成为全球轰动，虚拟世界（也称为“元宇宙”）已成为未来技术的成功补充。


    随着时间的推移，元宇宙已经发展到人们开始将这项技术视为对地球有经济优势的地步。不幸的是，在融入这种世界观之前，元宇宙是没有基于现实参考的虚拟工具。


    另一个显著影响市场整体状况的领域是加密货币和区块链。由于区块链的广泛应用，市场得到了实际和基于工业的解决方案。因此，基于数字的技术预计将接管为世界其他地区提供基于货币解决方案的角色。


    作为现实，元宇宙建立在科幻小说之上。它由两个前缀组成：“meta”意为“超越”，“verse”意为“宇宙”。元宇宙是所有已构建的互联网支持虚拟世界的最终结果。使用增强现实和虚拟现实，已经生成了可以虚拟通信并拥有端到端区块链加密数字资产的虚拟形象。这是一个虚拟现实环境，人们在其中在自动生成的环境中相互交互。


    元宇宙已经存在了一段时间，但底层技术尚未将无需许可的身份、金融服务或高速交易带给大众市场。相反，加密货币和区块链开发了一种共享和存储数十亿人数据的系统，以在虚拟世界和现实世界之间创建基于现实的连接。


    随着元宇宙越来越专注于将区块链技术作为这些平台的“引擎”，元宇宙的整个运营概念发生了巨大变化。由于元宇宙是虚拟世界，它们一直拥有金融系统。在区块链成为虚拟世界的一部分之前，这些游戏内货币没有价值，因为它们缺乏实体形式。区块链融入元宇宙现象后，“去中心化”概念很快影响了这些平台。基于区块链技术的平台拥有自己的
    NFT 和加密货币，用于创建、拥有和货币化虚拟资产。该技术的一项突破是，通过元宇宙专用的 NFT 市场允许将 NFT 出售为真实现金，从而建立真正的价值。Axie
    Infinity、Decentraland 和 SecondLive 是已成为商业轰动的虚拟世界示例，允许用户通过成为其中一部分来赚取财富。


    ## 投资元宇宙的最佳方式是什么？


    随着元宇宙作为一种运行在区块链上的系统而常态化，人们接触到了各种类型的投资入口。因此，投资者可以根据其运行方式，以主动或被动的方式在虚拟世界中进行投资。


