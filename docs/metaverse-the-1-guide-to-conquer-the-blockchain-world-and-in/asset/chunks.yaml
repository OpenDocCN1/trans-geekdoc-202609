  trans: '


    投影是一种增强现实技术，允许用户在不佩戴或携带设备的情况下增强现实世界物品。这意味着使用可编程投影机-摄像头系统，增强现实功能将直接使用空间 AR 工具显示在物体上。投影
    AR 系统是尖端的增强现实技术，因为它们提供完全不受限制的 AR 体验，允许用户通过在环境中显示增强现实功能来随时随地享受投影。


    ## 处理


    处理 AR 的能力主要归功于先进的图像和声音处理技术。任何 AR 产品都依赖于图像处理来准确理解环境、估计光线，并确定基本特征点和平面。


    ## 反射


    AR 技术的主要目的是通过将虚拟物体集成到现实世界环境中来创建逼真的视觉效果。当开发人员使用先进的建模来集成虚拟环境和实际环境时，就可以实现逼真的视觉效果。例如，虚拟反射是一种
    AR 技术，它模拟现实世界物体在虚拟物体上的反射，从而增强现实场景。


    ## 增强现实支持哪些类型的设备？


    了解增强现实的工作原理后，您可能想了解更多用于创建增强现实的设备。


    ### 手机


    几十年前，AR 只能在配备大量专业技术的设备齐全的房间中体验，而如今的智能手机应用程序则能提供逼真的 AR 体验。iOS 和 Android 设备均可使用
    AR。世界著名的游戏《Pokemon Go》、BBC 的 Civilizations AR、Froggipedia 应用程序和 SketchAR 都是热门应用。流行的即时通讯工具和社交媒体平台也允许我们尝试
    AR 的潜力（例如，Hololens、Snapchat 滤镜等）。


    ### 基于 AR 的设备


    虽然移动技术正在迅速发展，为世界带来新发明，但更逼真、更先进、更具专业外观的 AR 仍然只能通过使用专用 AR 设备（例如可穿戴智能眼镜、头戴式设备、数字罗盘、陀螺仪、CPU、GPS
    和显示屏）来实现。用户佩戴以获得完全沉浸式 AR 体验的抬头显示器（HUD）是最常见的专用设备。


    ### AR 眼镜


    智能眼镜也越来越受欢迎，Google Glasses 和 Laster SeeThru 等制造商获得了广泛关注。AR 增强镜片也已集成到轻量级 AR 眼镜中，例如
    AV Walker，它可以用数字内容覆盖世界。


    ### AR 隐形眼镜


    将增强现实技术集成到隐形眼镜中是科技界的一个相对较新的趋势。


    华盛顿大学发起了一项名为“Twinkle in the Eye”的开创性项目，旨在开发可以显示文本、将语音翻译成字幕并实时提供导航系统视觉指示的 AR 镜片。


    ### 虚拟视网膜显示器（VRD）


    20 世纪 90 年代末，VRD 被引入作为创建视觉图像的尖端技术。


    人机交互技术实验室（HIT Lab）创建了第一个 VRD。VRD 的图像合成过程依赖于低功率激光光扫描以及直接在人眼视网膜上进行图像再现。因此，VRD 使创建高分辨率、高对比度的视觉效果成为可能，这些效果叠加在用户所见之上。


    ## 增强现实的控制方式是什么？


    目前，开发人员已构建可控制 AR 应用程序功能的特性和功能。例如，用户决定如何行动、遵循哪个场景以及游戏何时结束。另一方面，新的 AR 应用程序预计将由人类大脑控制。虽然现在可能难以想象，但这种控制在未来几年无疑是可行的。像
    Neurable 这样的初创公司正在迈出初步步骤，允许用户使用“脑鼠标”导航 VR 和 AR 应用程序。


    ## 增强现实在未来的重要性


    随着技术以前所未有的速度发展，我们应预期 AR 将迅速进步，为世界各地的用户带来全新体验。那么，对于使用增强现实的人来说，未来会如何呢？


    - 带有增强现实功能的隐形眼镜。虽然目前正在使用 AR 镜片原型，但主流市场采用仍需时日。然而，预计带有数百个 LED 的无线镜片将很快可用，这些 LED
    会在人眼前形成图像。这些视觉效果可能包括文字、图表、照片、主动指令和有趣的 AR 组件。

    - 仿生眼是一组仿生眼。随着仿生学和仿生技术的迅速发展，人类可以期待 AR 技术在此领域得到引入。例如，仿生眼可以帮助盲人或视力较弱的人恢复视力。


    由此可见，增强现实是一个充满希望的技术领域，它不仅能提供更好的视觉体验，还能改变人们学习、导航、接受医疗和沟通的方式。AR 设备正变得越来越复杂、更加适合消费者且更加轻便，将
    AR 体验带给普通消费者，让他们能够享受乐趣、学习新知识、前往遥远的地方，并在同一个房间里与来自世界各地的人见面。


    # CHAPTER 3


    # NFT 在元宇宙中的作用


    NFT 凭借其迅速扩展的应用场景，正在开启数字世界的新时代——元宇宙。Facebook 推出 Meta，标志着向元宇宙时代的转变，其中基于 NFT 的增强体验可能成为下一代社交网络的支柱，这最能体现元宇宙在世界舞台上的到来。


    NFT 和元宇宙已经紧密交织，尤其是在区块链游戏和其他可互操作的游戏中，它们作为大规模数字社交媒体的价值载体。尽管 NFT 游戏是一个相对较新的概念，但它很受欢迎，Binance
    NFT 的首次游戏发行（IGO）就是明证。这个新的游戏部门已获得游戏玩家和加密货币消费者的积极反馈，仅两周内交易量就已超过 1600 万美元，所有 IGO
    的 NFT 系列均已售罄。


    ## 什么是元宇宙以及它是如何运作的？


    元宇宙是一种基于区块链技术的数字生态系统。VR 和 AR 等技术提供视觉组件，而去中心化媒体则允许无限的社交互动和商业机会。这些环境具有可扩展性、互操作性和适应性，并在个人和组织层面将成员之间的新技术和交互模式相结合。


    通信、货币、游戏世界、个人档案、NFT 以及其他流程和元素都是元宇宙的一部分，元宇宙是数字 3D 宇宙。元宇宙的承诺归功于它提供的自由；元宇宙中的任何人都可以构建、购买和查看
    NFT，以积累虚拟土地、加入社交社区、构建虚拟身份并玩游戏等。这种多样化的应用场景为货币化现实世界和数字资产开辟了许多可能性，企业和个人都可以融入元宇宙框架。


    未来的元宇宙将汇聚不同的在线世界，NFT 将允许跨链交互。阅读此内容以了解更多关于元宇宙的信息。


    ## NFT 对元宇宙会产生什么影响？


    NFT 可以颠覆元宇宙中用户联系、社交和交易的传统社交网络范式。了解 NFT 如何在数字世界中造成混乱。


