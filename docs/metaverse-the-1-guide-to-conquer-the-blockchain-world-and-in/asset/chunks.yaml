  trans: '


    自 20 世纪 60 年代以来，人们一直在努力构建身临其境的虚拟世界，这一愿望受到电影和视频游戏行业努力的推动。Second Life 是一款另类现实电脑游戏，你可以在其中控制虚拟形象并做任何你想做的事情，例如买房或结婚，于
    2003 年发布，是元宇宙最著名的例子之一。它是一个如此逼真的环境，以至于甚至出现了蓬勃发展的变态文化——比这更逼真的也没什么了。尽管如此，到 2006 年，已有足够多的元宇宙专家聚集召开峰会。


    元宇宙路线图（The Metaverse Roadmap）项目源于该峰会，该项目绘制了完成元宇宙的路径。根据元宇宙路线图，元宇宙是“虚拟增强的物理现实与物理持久的虚拟领域的融合”。换句话说，它可能类似于通过增强现实叠加在我们世界之上的第二个世界，以及我们可以进入和退出的虚拟区域，类似于《间谍小子
    3》中的视频游戏。例如，可以考虑 Snapchat 滤镜或 Google 查看等比例 3D 动物模型的功能。根据元宇宙路线图，“元宇宙不会是整个互联网——但，如同网络一样，它将被许多人视为最重要的元素。”


    今天的许多布道者会宣称，我们拥有技术、协议和基础设施，可以踩下油门，第一次将其变为现实。据说这是移动互联网之后的下一个合乎逻辑的步骤。虚拟现实、Zoom 会议、增强现实、社交网络、加密货币、NFT、在线零售、可穿戴技术、人工智能、5G
    等都在元宇宙中被探讨。据说这是未来！因为未来是不可避免的，它必定是积极的，对吧？


    许多赞扬元宇宙优点并认为它是自然而然下一步的人，是硅谷的声音、未来学家（元宇宙路线图的 John Smart）以及在元宇宙实现中拥有财务利益的其他参与者。其中之一无疑是
    Mark Zuckerberg。


    ...一个庞大的 3D 环境和模拟网络，它们实时渲染。”


    根据 Ball 的说法，元宇宙是“一个庞大的、持久的、实时生成的 3D 环境和模拟网络。”Ball 的元宇宙应保留身份、对象、历史和支付的连续性。它应由无限数量的人同时体验，每个人都有自己的存在感。元宇宙是一个持久的虚拟世界，允许人们在场，并且是一个可能利用区块链技术支付我们可以跨各种体验携带的东西的地方：想象一下，你可以在
    Twitter 和 Instagram 个人资料照片中使用《动物森友会》的 Sandy Liang 绒毛外套。Ball 的元宇宙在不断增长和变化。


    Ball 的元宇宙对 Zuckerberg 的元宇宙有很大影响。Zuckerberg 的虚拟形象在他的 Facebook Connect 演示中从一个平台移动到另一个平台，穿着同样的黑色
    T 恤，以展示“身份和事物的连续性”。Zuckerberg 的元宇宙正在朝着容纳无限数量的人迈进，拥有近 30 亿 Facebook 用户。在整个演讲中，Zuckerberg
    强调元宇宙的每个方面都将创造“存在感”。


    如今，Roblox 和 Epic Games 的 Fortnite 经常在元宇宙讨论中被提及，有些人认为它们比 Zuckerberg 的 Meta 更接近实现元宇宙。这是因为这两款游戏都符合持久虚拟世界的标准：它们各自拥有数百万前来游玩和社交的人，事物（衣服和皮肤）具有一定的持久性，并且接受支付（Robux
    和 V-Bucks）。此外，数百万人观看了 Fortnite 的 Ariana Grande 表演，这些活动，连同可自定义的虚拟形象和表情动作，正在产生一种“存在感”。


    最重要的是，要明白元宇宙并不存在。Zuckerberg 已明确表示，元宇宙像许多其他投资者、工程师、科学家和未来学家一样，是他的长期目标。当然，人们厌恶 Zuckerberg
    的提议，并且对 Meta 的元宇宙能做出任何其他事情（除了无法估量的伤害）毫无信心，甚至将其标记为反乌托邦式的灾难。尽管如此，元宇宙是一个想法——对一些人来说令人兴奋，对另一些人来说则令人恐惧。


    Welcome to the Metaverse 是由 Rhizome 举办的一次会议，Rhizome 是一家非营利艺术组织，致力于存档数字艺术和文化。艺术家
    David Rudnick 表示，“元宇宙的概念是终极中心化”，这与我们曾经对互联网寄予的许多民主化希望背道而驰。“当人们谈论新兴的元宇宙梦想时，”Rudnick
    解释道，“他们谈论的是一个你可以在其中做一切事情的空间 \[在虚拟世界中\]”，一个商业公共空间，“可以从平台上发生的所有互动中提取价值或某种所有权。”


    对元宇宙的恐惧和担忧，本质上是对规模的担忧。虚拟世界负面方面的任何增加都可能加剧它们。如果少数几家营利性公司中介了如此多的关键互动，这意味着什么？如果 Meta
    目前的社交媒体统治地位是任何指标，那么没有多少理由乐观。


    政府有着对技术突破反应迟缓的历史，更不用说监管了。一个连 finsta 是什么都不了解的政府，能否被信任来保障元宇宙的安全、道德和可持续？如果追求这一点，人类和环境的成本与收益会是什么？


    目前，元宇宙主要是虚构、一种假设，以及一种幻想，其中有许多空间让未知的寒风吹拂。


    # 什么是元宇宙，它是如何工作的？对“互联网未来”的深入探讨。


    ## 元宇宙是一种虚拟现实


    ### 原创系列特色图片的未来


    虽然元宇宙是一个虚拟世界，但它与你在科幻电影中看到的并不相同。


    考虑像《黑客帝国》这样的系列，其中世界是一个数字模拟，每个人都连接到它，并且制作得如此精良，以至于几乎没有人意识到它不是真的。元宇宙还没有达到那个程度，但它有潜力变得极其身临其境。


    元宇宙的概念比 Meta 对它的构想存在的时间要长得多——事实上，它甚至早于 Facebook。“一个你身处其中的具身互联网，而不是仅仅凝视它，”Zuckerberg
    说。


    元宇宙的真正含义与 Zuckerberg 模糊的定义一样广泛。


    在最基本的层面上，元宇宙是一个虚拟环境，允许世界各地的人们相互交流并与元宇宙本身交互。用户通常可以收集他们在会话之间保留的物品，甚至在元宇宙中拥有土地。然而，这个概念可以以多种方式解释，并且随着时间的推移发生了显著的变化。


    我们不断地在互联网上与某些东西交互，无论是网站、游戏还是连接我们与朋友的聊天软件。元宇宙更进一步，让用户沉浸在行动中。这为更强大、更逼真的体验打开了大门，而这些体验很少，如果有的话，仅通过浏览网页或观看视频就能唤起。


    ## 虚拟现实与元宇宙有什么区别？


    虽然虚拟现实（VR）和增强现实（AR）都与元宇宙相关，但它们是不同的。因此，最好将它们视为相互补充的独立事物，而不是本质上同一实体的不同化身。


