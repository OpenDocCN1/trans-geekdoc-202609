    # 费用与可能的资金来源


    要计算支出和投资回报率，请将您的抵押贷款或现金数据输入投资房产计算器。水电费、保险费、物业管理费和业主协会（HOA）费均基于当地历史房产数据估算。因此，您可以立即看出某个待售投资房产是否适合您的房地产投资计划。


    这是一个租赁方案。租金收入、现金流、资本化率、现金回报率、月度支出和入住率均由 Mashvisor 报告。此外，您还将获得 Airbnb 与传统租赁的便捷并列对比，以帮助您决定哪种租赁计划最有利可图。


    ## Mashvisor 上的投资房产计算器


    调查竞争对手。Mashvisor 列出了社区中类似的租赁房屋，使外地房地产投资更加容易。此外，标准租赁和 Airbnb 租赁可比房源均可用。面积、入住率，以及针对
    Airbnb 的每晚房源价格，以及 Airbnb 评分和评论均可用。因此，您将能够设定合理的租金。


    ## Mashvisor 的租赁可比房源


    一旦您发现了理想的投资房产，在获得一些协助后即可远程完成交易。在大多数地区，您可以聘请房屋检验服务代表您访问房产，让您高枕无忧。然后，为了进行谈判和报价，联系当地房产中介将会有所帮助。这可以通过电话或电子邮件快速完成（Mashvisor
    上的房源提供所有中介的联系方式）。最后，需要数字签名。在交易完成前，必须签署许多文件，更不用说在您取得所有权后签署的租约了。大多数县现在接受数字签名的文件，这将为您节省大量文书工作。毕竟，虚拟房地产投资在技术上是先进的，不应该有太多文书工作。


    # 元宇宙虚拟房地产正在蓬勃发展


    The Sandbox 等虚拟世界之一，目前在交易者和销售方面名列前茅。上周，The Sandbox 的交易量最大，土地地块 NFT 交易额超过 8600
    万美元，而 Decentraland 以超过 1500 万美元的土地地块 NFT 交易额位居第二。


    那么，购买虚拟土地地块日益增长的吸引力是什么？


    根据加密社交交易平台 Alpha Impact 的首席执行官 Hayden Hughes 的说法，NFT 和玩赚游戏（例如由越南工作室 Sky Mavis
    开发的 Axie Infinity）已将整整一代人引入共享在线社区。Hughes 表示，当这些社区成长时，成员们有创造性的冲动，通过在元宇宙中拥有资产（例如土地）来表达自己。


    “真正想要表达自己的创意人士，以及希望获利的投机者，正在推动元宇宙土地购买的热潮。与 2017 年首次代币发行（ICO）泡沫不同，元宇宙拥有广泛的采用和充满活力（尽管尚处早期）的生态系统。”Hughes
    解释道，“Facebook / Meta 并非该领域的市场领导者，重新品牌化已为该生态系统引起了关注。”


    根据 DappRadar 的数据，不仅元宇宙体验的需求在增长，元宇宙土地的价格也在上涨。上周，各个虚拟世界中的元宇宙土地地块 NFT 占据了十笔最昂贵的 NFT
    交易中的五笔。


    根据数据，交易额最高的是 Decentraland 的 Fashion Street Estate，以 618.000 MANA（约合 242 万美元）易手。然而，一个
    Axie Genesis 地块——另一个独立元宇宙游戏中最有价值的领地——上个月以 550 个以太币（ETH）售出。根据创作者的一条推文，这次购买是“有史以来单件数字房产的最大销售”，截至
    12 月 3 日，550 ETH 价值 248 万美元。


    Axie Infinity、Decentraland 和 Metaverse Gaming 只是可用游戏中的几个例子。


    根据 Axie Infinity 白皮书，“Lunacia，即 Axie 的母国，被分为代币化的土地地块，这些地块作为其 Axies 的住所和行动基地。”地块可以通过在游戏中收集的各种资源和制作材料随时间改进。


    根据开发者白皮书，Lunacia 包含 90,601 块以 NFT 形式表示的土地，用户可以自由出售。然而，问题中的 Genesis 地产因其稀缺性而非常有价值：游戏中的
    90,601 块地块仅包含 220 块 Genesis 地块。


    根据 Grayscale Investments 的最新研究，这种“创意经济”（也称为“玩赚”）的扩张，允许用户将其数字资产作为 NFT 拥有，在游戏中与他人交换，并偶尔将其转移到其他数字体验。因此，Decentraland
    等项目正在构建一个开放世界的元宇宙，用户可以登录玩游戏并赚取 MANA（Decentraland 的原生货币），该货币可用于购买 LAND 或收藏品等 NFT、对经济治理进行投票或构建
    NFT。此外，这种架构为用户在系统间提供了显著的互操作性，作为他们在游戏中花费时间的价值主张。


    根据 Grayscale Investments 的研究分析师兼报告合著者 Matt Maximo 的说法，元宇宙中的土地是一个引人入胜的概念，因为传统房地产的价值很大程度上取决于其靠近商店、服务和其他人——您受限于从家中出行所需的时间。


    在多个元宇宙（例如 Decentraland）中，玩家可以瞬间传送到世界各地，使旅行迅速且与估值无关。鉴于市场的发展性质，许多高价销售来自理想位置的 LAND
    地块，例如靠近著名的元宇宙景点。


    “投资 LAND 令人兴奋，但它与任何其他新兴市场一样存在风险。”LAND 和 MANA 持有者有动力保持 Decentraland 地图较小并维持地块数量较低，但“将来会有一个时刻，扩大地图并生产更多
    LAND 出售，对他们来说将比稀释其财产更有利，”他解释道。


    他还表示，由于 LAND 地块是非同质化代币，其流动性远低于 MANA 等基础代币。


    “如果您急于出售，可能会被迫以低于市场价值的价格卖给出价最高者，而如果我持有 MANA，我可以去 Uniswap 或 Coinbase 等交易所并立即完成交易，”他补充道。


    ## 元宇宙中土地是否无限？


    虽然元宇宙日益增长的选择极大地激励玩家通过购买房产在虚拟环境中占据一席之地，但一个潜在的困难是土地供应可能是无限的。


    “因此，很难预测未来土地的价值，如今购买可能被视为一项危险的投资。”例如，如果数字土地供应过剩，供需经济学就会发挥作用，价格就会下跌。然而，对于希望成为数字世界中最早拥有土地的投资者来说，元宇宙可能提供的大量可能性可能会超过风险。”BLOCKv
    & SmartMedia Technologies 联合创始人 Reeve Collins 对 GOBankingRates 表示。


    根据基于区块链的加密通讯工具 Status 的市场经理 Eduardo Erlo 的说法，购买数字房地产的狂热可能会导致暂时的低迷。Erlo 还表示，由于元宇宙中的土地永远充足，现在为其支付大笔资金可能是一种浪费。


