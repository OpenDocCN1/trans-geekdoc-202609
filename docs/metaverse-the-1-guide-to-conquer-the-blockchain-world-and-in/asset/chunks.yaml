    \ company has a strong track record of content and monetization innovation (it\
    \ was the first to experiment at scale with AAA free-to-play games and with player-to-player\
    \ marketplaces). Valve has also spent years creating and deploying virtual reality\
    \ technology, is privately owned by a group of passionate programmers passionate\
    \ about open-source technologies and despise closed settings, and produces billions\
    \ in annual earnings. Valve's Source engine, on the other hand, has seen little\
