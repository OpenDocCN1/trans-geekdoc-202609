- raw: 'Private industry is not only fully aware of the Metaverse''s potential, but
    it also has the most aggressive belief in its future, not to mention the most
    money (at least when it comes from a willingness to support Metaverse research
    and development), the best engineering skill, and the most conquest ambition.
    The major technology firms want to own and define the Metaverse rather than simply
    leading it. Although there are just a few possible leaders in the early Metaverse,
    open-source initiatives with a non-corporate approach will continue to play an
    important role. They will attract some of the most interesting creative talent.
    And you''ll be able to tell them apart.


    Microsoft is a great illustration of this. The company has hundreds of millions
    of federated user identities through Office 365 and LinkedIn, is the world''s
    second largest cloud vendor, has an extensive suite of work-related software and
    services that span all systems/platforms/infrastructure, clear technical experience
    in massive shared online content/operations, and a set of potential gateway experiences
    through Minecraft, Xbox + Xbox Live, and HoloLens. To that end, the Metaverse
    gives Microsoft a chance to reclaim the OS/hardware leadership it lost during
    the PC to mobile shift. But, more importantly, Microsoft CEO Satya Nadella understands
    the importance of being present wherever work is done. Microsoft has successfully
    transitioned from business to consumer, PC to mobile, offline to online, while
    maintaining a strong role in the "work" economy. As a result, it''s difficult
    to picture Microsoft not being a significant driver in the virtualized future
    of labor and information processing.


    Although Facebook CEO Mark Zuckerberg has not declared explicitly that he wants
    to create and control the Metaverse, his interest in it is clear. This is also
    ingenious. More than any other company, Facebook stands to lose the most from
    the Metaverse, as it will develop a new computing and interaction platform and
    an even larger and more capable social network. At the same time, the Metaverse
    allows Facebook to increase its reach both up and down the stack. Despite numerous
    attempts to design a smartphone operating system and deploy consumer hardware,
    Facebook is the only FAAMG company focused completely on the app/service layer.
    Thanks to the Metaverse, Facebook might become the next Android or iOS/iPhone
    (hence Oculus) and a virtual goods version of Amazon.


    Facebook''s Metaverse benefits are huge. It has the highest number of daily users,
    daily usage, and user-generated content of any platform in the planet, the second
    highest percentage of digital ad spend, billions in money, thousands of world-class
    engineers, and a founder with majority voting rights. Its Metaverse assets are
    also rapidly evolving, with semiconductor patents and brain-to-machine computing
    interfaces now among them. Unfortunately, Facebook''s track record as a platform
    allowing third-party developers/companies to construct long-term enterprises,
    as a ringleader in a consortium (e.g. Libra), and in managing user data/trust,
    on the other hand, is dismal.


    Amazon is fascinating in a variety of ways. It will, of course, aspire to be the
    primary location where we purchase''stuff.'' It makes no difference if it''s bought
    through a game engine, a virtual environment, or a web browser (it already sells
    inside Twitch). Furthermore, the company already has hundreds of millions of credit
    cards, the world''s largest share of ecommerce (excluding China), is the world''s
    largest cloud vendor, operates a variety of consumer media experiences (video,
    music, ebooks, audiobooks, video game broadcasting, etc.) and third-party commerce
    platforms (e.g. Fulfilled by Amazon, Amazon Channels), and is working on what
    they hope will be the first major gaming/rendering engine purpose-built for the
    cloud.


    More importantly, the company''s founder and CEO, Jeff Bezos, is a big believer
    in infrastructure spending. AWS, for example, powers the internet (Amazon Web
    Services). Rather than buying and selling inventory directly, Amazon sells, packages,
    and distributes products offered by other companies, with "Fulfilled by Amazon"
    accounting for 80% of Amazon''s revenue (like most retailers). While Elon Musk''s
    private rocket business, SpaceX, aims to populate Mars, Bezos has indicated that
    his objective with Blue Origin is to "create giant chip factories in orbit and
    just send small pieces down," akin to early web protocols and his AWS. As a result,
    Amazon is more likely than any other FAAMG company to embrace a fully "open" Metaverse
    — it doesn''t need to control the UX or ID because it benefits from tremendous
    growth in back-end infrastructure usage and digital transactions.


    The Internet is a gold mine for data, and the Metaverse will have more data and
    potentially higher yields than the existing web. And no one does a better job
    than Google at exploiting this data on a global basis. In addition, the company
    is not only the industry leader in indexing both the digital and physical worlds
    (nearly 10,000 employees contribute to mapping operations), but it is also the
    most successful digital software and services company outside of China. It also
    runs the most popular operating system on the planet (Android) and the most open
    of the major consumer computing platforms (Windows). Despite its failure, Google
    was the first to go all-in on wearable computing with Google Glass. It is now
    making a significant push into digitizing the house with Google Assistant, its
    Nest suite of products, and FitBit. As a result, the Metaverse is likely to be
    the only project capable of bringing all of Google''s various investments to date
    together, including Stadia edge computing, Project Fi, Google Street View, enormous
    dark fiber purchases, wearables, virtual assistants, and more.


    Putting Our Heads Together


    It''s unlikely that it will control or drive the underlying Metaverse. True, it
    is home to the world''s second-largest computer platform (and by far the most
    valuable), as well as the world''s largest video game retailers (which also means
    it pays more to developers than anyone else on earth). In addition, the company
    is investing heavily in augmented reality devices and "connective tissue" that
    will aid the Metaverse (e.g. beacons, Apple Watch, Apple AirPods). But, on the
    other hand, Apple''s attitude and business model are incompatible with building
    an open platform for innovation where anybody can access the full range of user
    data and device APIs. Rather than the operator/driver, Apple is more likely to
    be the primary mode of communication between the Western world and the Metaverse.
    This, like the Internet, will almost certainly benefit everyone.


    If the Metaverse requires a broad interplay of assets, experiences, and shared
    APIs, Unity will be important. This engine is utilized in more than half of mobile
    games. It is even more popular than Unreal in real-world rendering/simulation
    use cases (architecture, design, and engineering). For example, while producing
    and filming the photo-realistic Lion King in Unity, filmmaker Jon Favreau was
    also producing and filming Disney''s The Mandalorian in Unreal. It also controls
    one of the world''s largest digital ad networks (a nice side effect of powering
    10B daily minutes of mobile entertainment).


    On the other hand, unity''s role in moving the Metaverse forward is unknown. There
    is no store, no login system, and no true direct-to-consumer experience. Most
    of its ancillary services (non-engine or advertising) are rarely used. Furthermore,
    rather being Metaverse gateways, most (but not all) Unity-powered games are simply
    mobile games. Given its inevitable influence on norms, playtime, and content production,
    it''s difficult to imagine it not being bought out and merged into a larger technology
    business with more assets and perks.'
