    # CHAPTER 6


    ## THE ROLE CRYPTO PLAYS IN THE METAVERSES


    Crypto metaverse creators have often endeavored to differentiate their worlds
    from previous iterations of metaverses in three crucial ways:


    ### Decentralization


    Unlike early virtual worlds, which were owned and controlled by businesses, crypto
    metaverses are frequently decentralized, with blockchain technology powering some
    or all metaverse game components. As a result, blockchain metaverses vary from
    the standard corporate structures and value extraction tactics used in the game
    industry today. The unique structure of blockchain games can provide participants
    with more equitable involvement options. It also implies that individuals in the
    metaverse share ownership of the metaverse. Even if the metaverse blockchain''s
    original designers abandoned the project, the game might continue to exist indefinitely.


    ### User governance


    Decentralized autonomous organizations (DAOs) and governance tokens are used by
    crypto metaverses like Decentraland to help put their users in charge of the game''s
    future, enabling them to vote on modifications and upgrades. In this way, metaverses
    can develop into whole communities with economies and democratic government, expanding
    beyond crypto games.


    Crypto tokens, such as non-fungible tokens, are employed in crypto metaverses
    to represent real-world objects (NFTs). In gaming contexts, achievements and purchases
    can be quite useful to players. NFTs, bring much-needed transparency and access
    to asset markets to in-game item standards. Because each NFT is unique, metaverse
    tokens and items may be designed to easily help authenticate the provenance of
    in-game user-generated content as well as NFT gaming assets.


    Because crypto metaverses use cryptocurrencies and blockchain infrastructure,
    their economies are inextricably linked to the larger crypto economy. Holders
    of metaverse currencies, avatar skins, and digital real estate can now trade them
    on DEXs and NFT marketplaces for real-world value.


    ### Metaverse Games Can Be Both Financially Beneficial and Social


    While crypto metaverses (and NFT games in general) are still in their early stages,
    these new worlds have tremendous social and economic promise. Users can benefit
    from crypto metaverses by having new ways to play, invest, collect, and socialize,
    as well as new ways to earn from it all. While work on the various metaverse platforms
    is noteworthy, the many metaverse games can communicate and interoperate with
    one another, potentially turning the nascent blockchain gaming ecosystem into
    a global economic pillar. Metaverse games, which combine the immersive surroundings
    of virtual reality, the addictive playability of the interactivity of social media,
    video games, and the value propositions of cryptocurrency, are poised to become
    a central feature of the internet''s next phase.


    ### NFTs: The Economy of the Metaverse


    #### How non-fungible tokens aid in the development of civilizations in virtual
    worlds


    A typical day in the metaverse – a shared immersive virtual reality – may soon
    resemble the world we know and love. Thanks to significant developments in virtual
    reality and 5G communications, we will visit retail malls, travel across town,
    meet friends in cafés, and exchange connections in ways that feel eerily real.


    Metaverses have existed in the form of multiplayer internet games for decades.
    However, we may soon enter an era of immersive experiences almost indistinguishable
    from reality, spawning new kinds of interaction for both gamers and non-gamers.


    Individuals settling the land, socializing socially, transferring goods, and asserting
    ownership rights are already visible in prototype next-generation metaverses like
    Decentraland and Somnium Space. However, a functioning economy is required in
    any society (physical or virtual). The economy is based on digital properties
    such as one''s metaverse home, automobile, farm, books, clothing, and furniture
    being authenticated in the metaverse. It also requires the capacity to freely
    travel and trade between realms with varying laws and rules to thrive.


    non-fungible tokens — blockchain-based records of digital ownership – will form
    the backbone of the metaverse economy, allowing for the authentication of belongings,
    property, and even identity. Moreover, because each NFT is protected by a cryptographic
    key that cannot be erased, copied, or destroyed, it allows for the reliable, decentralized
    verification of one''s virtual identity and digital possessions required for metaverse
    communities to succeed and communicate with one another.


    Beyond the hoopla of multi-million dollar digital art sales, the relevance of
    NFTs may lay in its ability to foster the emergence of something like genuine
    human society in the metaverse, based on free markets (for products, services,
    and ideas), autonomous ownership, and social contracts.


    "Initially, NFTs focused on the digital art side of things. But it''ll be a lot
    more powerful," adds Crypto.com''s COO, Eric Anziani. "In the future, it will
    be the tool that depicts any digital sort of asset in virtual environments." As
    a result, the possibilities are endless."


    ### Development of real estate in a brave new world


    People conversing by fountains, shoppers in fashion boutiques, joggers on beach
    promenades, and casino croupiers luring guests to high-stakes poker can all be
    found strolling through Decentraland.


    These encounters are the consequence of virtual real estate development by persons
    who have purchased land and created habitats that have piqued the interest of
    other Decentraland residents.


    The experience is far from hyper-realistic (the creators of Decentraland claim
    that the world is still in the "Iron Age"). Even in these early incarnations,
    however, the potential is obvious. People flock to intriguing areas in the metaverse,
    just as they do in actual societies. And, just like in Paris or Beverly Hills,
    fame automatically raises the value of the virtual estate.

