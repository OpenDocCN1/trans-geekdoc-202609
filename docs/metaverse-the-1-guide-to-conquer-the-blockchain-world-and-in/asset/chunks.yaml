  trans: '


    # 低延迟在 AAA 在线多人游戏中的应用


    低延迟是最具吸引力的 AAA 在线多人游戏所必需的。这是因为延迟决定了玩家接收信息的速度（例如，他们在哪里，手榴弹是否已被投掷，或者足球是否已被踢出），以及他们的响应被传递给其他玩家的速度。换句话说，延迟决定了你是赢是输，是杀是被杀。这就是为什么大多数现代游戏的运行帧率是通常视频帧率的
    2–4 倍，以及为什么我们迅速接受了这些提高，尽管我们对传统视频的更高帧率持抵制态度。这是成功的要求。


    在视频游戏中，人类的延迟阈值极低，尤其是与其他媒介相比。考虑普通视频和视频游戏之间的区别。平均而言，如果音频和视频不同步超过 45 毫秒或 125 毫秒（总共
    170 毫秒），大多数人不会注意到。接受水平在提前 90 毫秒和延迟 185 毫秒（总共 275 毫秒）时要高得多。当我们在数字按钮（例如 YouTube
    停止按钮）上 200–250 毫秒内没有收到响应时，我们会认为点击失败了。即使是非玩家在 AAA 游戏中 50 毫秒后也会感到恼火，而非玩家在大约 110
    毫秒时会感到无能为力。游戏在 150 毫秒时无法进行。根据 Subspace 的说法，延迟每增加或减少 10 毫秒，每周游戏时间就会减少或增加 6%。这是一个千载难逢的机会，没有其他公司拥有。


    查看全尺寸版本


    让我们以上述范围为背景，看看全球平均延迟。数据从一个城市传输到另一个城市再返回的典型往返时间在美国为 35 毫秒。许多配对超过了这个时间，尤其是在需求高峰期的人口稠密地区（例如，傍晚时分从旧金山到纽约）。还有“城市到用户”的传输时间，这尤其容易受到延迟的影响。人口稠密地区的城市、社区和公寓楼很快就会变得拥堵。如果你在移动设备上玩游戏，4G
    技术会再增加 40 毫秒。最后，如果你住在大都市中心之外，你的数据可能需要穿越额外 100 英里古老且维护不善的有线基础设施。全球中位交付延迟因城市而异，范围在
    100 到 200 毫秒之间。


    查看全尺寸版本


    在线游戏行业已经想出了几种部分修复方法和技巧来管理延迟。然而，其中没有一种能很好地扩展。


    例如，大多数高保真多人游戏基于服务器区域。游戏发行商可以通过将玩家名单限制在美国东北部、西欧或东南亚的玩家来减少地理延迟。这种聚类效果足够好，因为游戏是一种休闲活动，通常与一到三个朋友一起享受。毕竟，你不太可能与住在不同时区的人一起玩。而且，无论如何，你也不在乎你的未知对手（你通常甚至无法与他们沟通）住在哪里。尽管如此，根据
    Subspace 的说法，中东大约四分之三的互联网连接不在动态多人游戏的可玩延迟限制内，而美国和欧洲只有四分之一。这主要是由于宽带基础设施限制，而不是服务器位置。


    “网码”解决方案也用于多人在线游戏，以确保同步和一致性，并保持玩家参与度。基于延迟的网码指示玩家的设备（例如 PlayStation 5）延迟渲染所有者的输入，直到延迟更高的玩家（即他们的对手）的输入到达。这会让具有低延迟肌肉记忆的玩家感到不悦，但它有效。回滚网码更先进。如果对手的输入延迟，玩家的设备将按照其预期行动。如果发现对手做了不同的事情，设备将尝试撤销正在进行的动画，然后“正确地”重新播放它们。


    对于 1v1 游戏（例如，2D 格斗游戏）、微小延迟问题（例如，40 毫秒）以及具有高度可预测行为窄范围的游戏，这些解决方案效果良好（例如，驾驶游戏、2D
    格斗游戏，不幸的是，当我们扩展到更多以元宇宙为重点的体验，拥有更多玩家、更多延迟变化和更多动态场景时，这些解决方案会退化。很难预见十几个玩家能够连贯且准确地行动，然后“以非破坏性方式将它们回滚”。最好是直接断开缓慢玩家的连接。虽然视频会议可能有多个参与者，但任何给定时间只有一个是相关的，从而导致“核心”延迟。在游戏中，从所有参与者那里获得适当的信息至关重要，而延迟会加剧这个问题。


    对于大多数游戏来说，低延迟不是问题。《炉石传说》和《Words with Friends》都是回合制和异步游戏，但《王者荣耀》和《糖果粉碎传奇》不需要像素级完美或毫秒级精确的输入。低延迟仅对《堡垒之夜》、《使命召唤》和《Forza》等快节奏游戏是必需的。这些游戏很有利可图，但它们仅占总游戏市场中创建的游戏标题的一小部分——在总游戏时间方面则少得多。


    虽然元宇宙不是快节奏的 AAA 游戏，但由于其社交性质和期望的重要性，它确实需要最低延迟。轻微的面部动作在人类对话中至关重要，我们对微小的错误和同步问题非常敏感（因此
    CGI 中出现了诡异谷问题）。社交产品的普及也取决于此。想象一下，如果 FaceTime 或 Facebook 只有在你的朋友或家人在 500 英里以内时才能工作，那会是什么样子。或者，你可能只在家里才能使用它。而且，在虚拟世界中，如果我们想利用国际或长途劳动力，我们需要的不仅仅是额外的带宽。


    View full-size


    不幸的是，延迟是所有网络特性中最难、最耗时解决的问题。部分问题源于这样一个事实，如前所述，只有少数服务和应用程序需要超低延迟交付。这限制了任何网络运营商或延迟导向内容分发网络（CDN）的经济论据——而基本物理规则已经在挑战商业论据。


    从纽约市到东京或孟买的旅行距离为 11,000–12,500 公里，耗时 40–45 分钟。这满足了所有低延迟要求。然而，尽管光纤电缆构成了互联网骨干的大部分，但由于它很少处于真空中（+
    损耗通常为 3.5 dB/km），因此比光速慢 30%。铜缆和同轴电缆的距离延迟恶化和带宽限制更糟糕，导致拥堵和交付延迟增加。尽管如此，这些电缆仍然构成了住宅和商业建筑内部以及社区中发现的大部分电缆。


    此外，这些电缆都不是沿着直线铺设的。我们通常所说的“互联网骨干”是一个松散的私有网络联合体，没有哪个网络能够正确传输数据包（或者有动机将路段交给拥有更快段路的竞争对手）。因此，两台服务器之间，或服务器与客户端之间的网络距离，可能大于它们之间的地理距离。此外，网络拥堵可能导致数据被路由得更不直接，以确保持续和正在进行的交付，而不是降低延迟。这就是为什么纽约和东京之间的平均延迟是光在两座城市之间旅行时间的四倍多，而纽约和孟买之间是光在两座城市之间旅行时间的四到六倍。


    '
