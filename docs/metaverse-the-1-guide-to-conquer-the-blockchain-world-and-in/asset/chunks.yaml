  trans: '


    任何基于电缆的基础设施更新或中继都极其昂贵且复杂，尤其是当目的是缩短地理距离时。它还需要广泛的监管/政府批准，通常涉及多个层级。但当然，无线更容易维修。5G
    无疑有所帮助，因为它平均将 4G 延迟降低了 20–40 毫秒（并承诺低至 1 毫秒的延迟）。然而，这仅有助于最后几百米的数据传输。然后，当你的数据到达基站后，你将回到标准骨干网络。


    Starlink，SpaceX 的卫星互联网星座公司，承诺将高带宽、低延迟的互联网带到美国，并最终带到世界其他地区。然而，这并不考虑极低延迟，尤其是长距离情况下。虽然
    Starlink 从你的家到卫星再返回的往返时间为 18–35 毫秒，但数据必须从纽约传输到洛杉矶再返回。毕竟，需要通过众多卫星进行中继。在某些情况下，Starlink
    反而会使传输长度变得更糟。例如，当前往低轨道卫星再返回时，纽约到费城的直线距离大约为 100 英里，通过电缆可能为 125 英里，但通过低轨道卫星往返则超过
    700 英里。


    此外，光纤电缆的损耗率低于通过环境传输的光线，尤其是在阴天。人口稠密的城市区域也较为嘈杂，容易受到干扰。埃隆·马斯克在 2020 年表示，Starlink
    专注于“那些[电信公司]否则难以触达的最难服务的客户”。这样一来，它欢迎更多人进入元宇宙，而不是增强那些已经在那里的人。


    为了满足对实时带宽应用日益增长的需求，正在开发全新的技术、业务线和服务。例如，Subspace（披露：投资组合公司）在数百个城市部署硬件，为低延迟网络路径查找创建“天气图”，运行一个网络栈，该栈包括低延迟应用的需求以及构成该路径的众多第三方，并且还构建了一个光学网络，该网络跨越各种光纤网络进行拼接，以缩短服务器之间的距离并尽量减少非光纤电缆的使用。


    另一方面，Fastly 提供一个偏好低延迟应用而非交付可靠性和带宽的 CDN。使用一种“基础设施即代码”的方法，允许客户定制公司边缘计算集群的几乎每个方面，该公司声称软件应用程序可以在
    150 毫秒内清除并替换所有这些集群全球的所有缓存内容，并且可以实时缓存和加速单个区块链交易。


    ## 可靠性


    可靠性的概念不言而喻。我们向虚拟工作和教育过渡的能力依赖于一致的服务质量。这包括总体正常运行时间以及下载/上传带宽和延迟稳定性等其他因素。接下来的许多内容对如今“生活在线”的许多人来说可能显得令人震惊——大多数时候，Netflix
    以 1080p 甚至 4K 流媒体播放。但另一方面，Netflix 使用的可靠性解决方案不适合游戏或元宇宙特定的应用程序。


    像 Netflix 这样的非实时视频提供商在内容提供给观众前数月就会收到所有视频文件。这使他们能够通过研究帧数据来进行深入分析，以确定可以消除哪些信息，从而减小（或压缩）文件大小。例如，Netflix
    的算法会“观察”一个蓝天场景，并确定如果观众的连接带宽下降，500 种不同的蓝色是否可以简化为 200、50 或 25 种。流媒体的算法会按场景考虑这一点，理解对话场景可以承受比快节奏动作场景更大的压缩。这被称为多遍编码。如前所述，Netflix
    使用额外带宽在内容需要之前将其传输到用户的设备，因此如果连接出现短暂中断或延迟上升，最终用户不受影响。


    此外，Netflix 会在本地节点预加载内容，因此当你请求时，最新一集的《怪奇物语》仅在几个街区之遥。这对于实时视频或数据来说是不可行的，如前所述，它们必须更快地到达。这就是为什么云端流媒体传输
    1GB 的 Stadia 比云端流媒体传输 1GB 的 Netflix 更困难。


    因此，虽然元宇宙的目标本身并不具有竞争性，但我们应该将其视为将所有网络方面的标准——延迟、可靠性/韧性和带宽——提升到 AAA 多人游戏水平。你的设备多么强大（参见硬件和计算）无关紧要，如果它不能及时获取所需的所有数据。


    # 结论


    毫无疑问，元宇宙将对我们的社会产生深远影响。它将改变我们沟通、宣传自己和塑造品牌的方式。此外，这种尖端技术将带来新的机遇和挑战。元宇宙有能力释放大量创造力，同时拓宽我们的经济、娱乐和文化视野。


