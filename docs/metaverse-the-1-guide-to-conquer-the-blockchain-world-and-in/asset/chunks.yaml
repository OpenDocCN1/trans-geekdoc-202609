  trans: '


    # 即使他们能做到，Microsoft Flight Simulator 也是一项实时服务，会根据现实世界的天气和空中交通（包括精确的风速和风向、温度、湿度、降雨和照明）进行变化。因此，你可以飞入现实世界的飓风和风暴，同时遵循现实商业飞机的相同飞行路径。


    Microsoft Flight Simulator 的工作原理是将少量数据本地保存到你的计算机上（计算机同时运行游戏，就像任何主机游戏一样，不同于基于云的游戏流媒体服务，如
    `Stadia`）。然而，当用户在线时，Microsoft 会按需向本地玩家的设备提供海量数据。你可以将其视为现实世界飞行员的工作方式。当他们飞越山脉或绕过弯道时，新的光线信息会涌入他们的视网膜，首次显示并澄清那里有什么。之后，他们除了知道那里会有东西之外，一无所知。


    许多玩家认为所有在线多人视频游戏都是这样工作的。实际上，大多数游戏提供商只向单个玩家发送位置数据、玩家输入数据（例如，投掷炸弹、射击）和汇总级数据（例如，大逃杀中剩余的玩家）。由于所有资产和渲染数据已经在你的本地设备上，下载和安装时间相当长，硬盘占用也是如此。


    通过按需传输渲染数据，游戏可以拥有更广泛的事物、资产和环境种类。此外，它们可以在不需要游戏延迟的下载和安装、更新批处理或大量用户硬盘的情况下实现这一点。因此，许多游戏现在采用混合范式，结合本地存储的数据和数据流。另一方面，这种策略对于专注于元宇宙的系统至关重要。例如，`Roblox`
    需要（并从中受益）比 `Mario Kart` 或 `Call of Duty` 更广泛的资产、物品和环境种类。


    随着虚拟模拟的复杂性和重要性增加，需要广播的数据量也将增加。目前，`Roblox` 从各种已被广泛回收并轻微修改的基本预制件和资产中受益。因此，`Roblox`
    主要流式传输关于修改先前下载内容的信息。然而，虚拟平台最终将需要几乎无限数量的排列和构建（其中几乎所有都无法准确预测）。


    虚拟孪生系统（也称为镜像世界，例如 `Microsoft Flight Simulator`）已经必须模仿现实世界几乎无限（且可证明）的变异性。这意味着需要发送显著更多（即更重）的数据，而不是“这里有一片乌云”或“一片与乌云
    C-95 95% 相似的乌云”。相反，是一片看起来完全如此的乌云。最重要的是，这些数据是实时更新的。


    最后一点的重要性无论如何强调都不为过。如果我们希望在一个巨大的、实时的、共享的和持久的虚拟世界中进行交互，我们将需要大量的云流式数据。


    （其中一个是虚构的。）


    将现实世界与 `Fortnite` 中的地图进行比较。地球上的每个人都同时且在同一地点沉浸在同一个模拟中。如果我砍倒一棵树，那棵树对所有人来说都不可逆转地消失了。玩
    `Fortnite` 时，只能使用地图的固定时间点版本。而且你在地图上所做的任何事情都只会与少数其他人共享，并在有限的时间后重置，然后才会重置。砍倒一棵树合法吗？它将在
    1-25 分钟内重置，并且最多只消失了 99 个其他用户。地图仅在 `Epic Games` 发布新版本时更新。如果 `Epic Games` 决定将你的宇宙广播到世界其他地方，他们会选择你的宇宙，忽略他们的宇宙，并将你的宇宙设定在指定的时间段。这对于许多虚拟体验是可以接受的。它也将满足各种元宇宙特定体验的需求。但是，一些（但并非所有）体验将要求所有用户在任何时候都保持一致性。


    如果我们希望在不同虚拟世界之间流畅导航，也需要云数据流。例如，`Fortnite` 中的 Travis Scott 演唱会将玩家从游戏的主区域带到前所未见的海洋深处，然后是前所未见的星球，最后是遥远的太空。`Epic`
    通过在活动前几天或几小时通过典型的 `Fortnite` 补丁将所有这些游戏世界发送给玩家来实现这一点（当然，这意味着任何在活动前没有下载和安装更新的人都无法参与）。然后，在每个场景期间，下一个场景会在每个玩家的设备上后台加载。这种方法效果很好，但它需要发行商知道用户接下来会访问哪些世界以及他们会提前多久访问。如果你想从大量地点中进行选择，你要么下载所有可用替代方案的全部内容（这是不可能的），要么对它们进行云流传输。


    除了额外的环境数据，还有更多的玩家数据。当你今天在 `Fortnite` 中看到你的朋友时，`Fortnite` 服务器只需向你提供他们在哪里以及他们想要完成什么的信息；动画（例如重新装填突击步枪或坠落）已经加载到你的设备上，只需运行即可。然而，当实时动作捕捉被映射到朋友的头像时，这些详细信息也必须连同其他信息一起提供。如果你想在游戏中观看视频文件，就像
    `Fortnite` 偶尔做的那样，你需要通过虚拟世界来完成。听到人群的空间音频？也是一样。有没有过路人擦过你的触觉紧身衣的肩膀？也是一样。


    许多玩家已经面临着仅需要位置和输入数据的在线游戏的带宽和网络拥塞问题。元宇宙将放大这些要求。好消息是，全球的宽带普及率和带宽正在稳步增加。计算（将在第 #3
    节中详细讨论）也在改善，并可以通过预测将要发生的事情，直到真实数据可以被替代，来帮助替代受限的数据传输。


    ## 延迟


    网络中最困难的问题也是最被误解的问题：延迟。数据从一个位置到另一个位置再返回所需的时间就是延迟。与网络容量（上文）和可靠性（下文）相比，延迟通常被认为是最不相关的
    KPI。这是因为大多数互联网传输是单向或异步的。发送 `WhatsApp` 消息和收到已读回执之间的时间是 100ms、200ms 甚至两秒，都无关紧要。你在
    `YouTube` 上按下暂停按钮后，视频是在 20ms、150ms 还是 300ms 后结束，也无关紧要。观看 `Netflix` 时，流媒体继续播放比立即开始播放更重要。`Netflix`
    通过延迟视频流的开始来实现这一点，以便你的设备在观看时提前下载。这样，如果你的网络出现几秒钟的卡顿或拥塞，你就不会注意到。


    即使是像视频通话这样的同步和持久通信，对延迟也有相当高的容忍度。因为视频是通话中最不重要的方面，视频通话软件通常在网络拥塞时优先处理语音，即“最轻”的数据。如果你的延迟激增——即使达到秒级而非毫秒级——软件可以通过加快音频积压的播放并快速剪掉停顿来拯救你。此外，参与者可以通过简单地学会等待更长时间来轻松管理延迟。


    '
  toc: []
- raw: 'Low latency is required for the most engaging AAA online multiplayer games.
    This is because latency dictates how quickly a player receives information (e.g.,
    where they are, if a grenade has been thrown, or whether a soccer ball has been
    kicked) and how quickly their response is relayed to other players. In other words,
    latency decides whether you win or lose, kill or die. This is why most modern
    games run at 2–4 times the usual video framerate and why we''ve quickly accepted
    these increases, despite our resistance to greater frame rates for traditional
    video. It''s a requirement for success.


    In video gaming, the human latency threshold is extremely low, especially compared
    to other mediums. Consider the distinction between a regular video and a video
    game. The average person will not notice if audio and video are out of sync by
    more than 45 milliseconds or 125 milliseconds (170ms total). The acceptance levels
    are much greater at 90 milliseconds early and 185 milliseconds late (275ms). When
    we don''t get a response after 200–250ms with digital buttons, such as a YouTube
    stop button, we assume our clicks have failed. Even non-gamers become annoyed
    after 50 milliseconds in AAA games, while non-gamers feel handicapped around 110
    milliseconds. Games are unplayable at 150ms. According to Subspace, a 10ms increase
    or decrease in latency reduces or increases weekly playtime by 6%. That''s a once-in-a-lifetime
    opportunity that no other company has.


    View the full-size version


    Let''s look at worldwide average latency with the above ranges in mind. The typical
    roundtrip time for data transported from one city to another and back in the United
    States is 35 milliseconds. Many pairings exceed this, particularly in densely
    populated areas with high-demand peaks (e.g., San Francisco to New York during
    the evening). Then there''s the ''city-to-user'' transit time, which is especially
    susceptible to delays. Cities, communities, and condominiums in densely populated
    areas can quickly become congested. And if you''re playing on a mobile device,
    4G technology adds another 40 milliseconds. Finally, if you live outside a big
    metropolitan center, your data may have to travel an additional 100 miles across
    ancient, badly maintained wireline infrastructure. The global median delivery
    latency varies between cities and spans 100 to 200 milliseconds.


    View the full-size version


    The online gaming industry has devised several partial fixes and hacks to manage
    latency. None of them, however, scale well.


    Most high-fidelity multiplayer gaming, for example, is based on server regions.
    Game publishers can reduce geographical latency by limiting the player roster
    to those in the Northeast United States, Western Europe, or Southeast Asia. This
    clustering works well enough because gaming is a leisure activity that is often
    enjoyed with one to three buddies. After all, you''re unlikely to play with someone
    who lives in a different time zone. And, in any case, you don''t care where your
    unknown opponents (with whom you normally can''t even communicate) live. Nonetheless,
    according to Subspace, about three-quarters of all internet connections in the
    Middle East are outside of playable latency limits for dynamic multiplayer games,
    whereas just a quarter is in the United States and Europe. This is primarily due
    to broadband infrastructure limits rather than server placement.


    ''Netcode'' solutions are also used in multiplayer online games to assure synchronization
    and consistency, as well as to keep players engaged. Delay-based netcode instructs
    a player''s device (such as a PlayStation 5) to delay rendering the owner''s inputs
    until the more latent player''s (i.e., their opponent''s) inputs arrive. This
    will upset players with low-latency muscle memory, but it works. The netcode for
    rollback is more advanced. If an opponent''s inputs are delayed, a player''s device
    will act following its expectations. If it is discovered that the opponent performed
    something different, the device will attempt to unwind in-progress animations
    and then ''properly'' replay them.


    For 1v1 games (e.g., 2D fighters), tiny latency issues (e.g., 40ms), and titles
    with a narrow range of highly predictable behaviors, these solutions work effectively
    (e.g., a driving game, a 2D fighter unfortunately, these solutions degrade as
    we expand to more Metaverse-focused experiences with more players, more latency
    changes, and more dynamic scenarios. It''s tough to foresee a dozen players cohesively
    and accurately and then ''roll them back in a non-disruptive manner. It is preferable
    to simply unplug a sluggish player. While a video conference may have several
    participants, only one is relevant at any given time, resulting in ''core'' delay.
    Getting the appropriate information from all participants is critical in a game,
    and latency worsens the problem.


    For most games, low latency isn''t an issue. Hearthstone and Words with Friends
    are both turn-based and asynchronous games, but Honour of Kings and Candy Crush
    don''t require pixel-perfect or millisecond-precise inputs. Low latency is only
    required for fast-paced games like Fortnite, Call of Duty, and Forza. These games
    are profitable, but they only account for a small percentage of the total games
    market in terms of titles created – and much less in terms of total gaming time.


    While the Metaverse isn''t a fast-paced AAA game, it does require minimal latency
    due to its social nature and desired importance. Slight facial movements are critical
    in human conversation, and we''re acutely aware of minor errors and synchronization
    difficulties (hence the uncanny valley problem in CGI). The ubiquity of social
    products is also dependent on it. Consider what it would be like if FaceTime or
    Facebook only worked if your friends or family were within 500 miles of you. Alternatively,
    you might only do it while you are at home. And, in the virtual world, we''ll
    need a lot more than just extra bandwidth if we want to tap into international
    or long-distance labor.


    View full-size


    Unfortunately, latency is the most difficult and time-consuming to address of
    all network characteristics. Part of the problem derives from the fact that, as
    previously said, only a few services and applications require ultra-low latency
    delivery. This limits the economic case for any network operator or latency-focused
    content-delivery network (CDN) – and fundamental physics rules are already challenging
    the business case.


    Traveling from New York City to Tokyo or Mumbai takes 40–45 minutes at a distance
    of 11,000–12,500 kilometers. This satisfies all low-latency requirements. However,
    even though fiber optic cable makes up most of the internet backbone, it falls
    30 percent short of the speed of light since it is rarely in a vacuum (+ loss
    is normally 3.5 dB/km). Copper and coaxial cables have even worse distance latency
    deterioration and bandwidth limitations, resulting in increased congestion and
    delivery delays. Nevertheless, these cables continue to make up the majority of
    those found in residential and commercial building interiors, as well as in neighborhoods.


    Furthermore, none of these wires are laid in a crow''s flight path. What we commonly
    refer to as the "internet backbone" is a loose federation of private networks,
    none of which can properly deliver a data packet (or have the incentive to trade
    off stretches to a competitor with a faster segment or two). As a result, the
    networking distance between two servers, or between a server and a client, might
    be greater than the geographical distance between them. Furthermore, network congestion
    can cause data to be routed even less directly to ensure consistent and ongoing
    delivery, rather than decreasing latency. This is why the average latency between
    New York and Tokyo is over four times the time it takes light to travel between
    the two cities, and between New York and Mumbai is four to six times the time
    it takes light to travel between the two cities.'
