- raw: 'Even if they could, Microsoft Flight Simulator is a real-time service that
    changes to reflect real-world weather and air traffic (including precise wind
    speed and direction, temperature, humidity, rain, and lighting). As a result,
    you can fly into real-world hurricanes and storms while following the identical
    flight path of IRL commercial planes.


    Microsoft Flight Simulator works by saving a small amount of data locally on your
    computer (which also runs the game, like any console game and unlike cloud-based
    game-streaming services like Stadia). When users are online, however, Microsoft
    feeds massive amounts of data to the local player''s device on a need-to-know
    basis. Consider it in the same way that a real-world pilot would. New light information
    floods into their retinas as they pass over a mountain or around a bend, showing
    and then clarifying what''s there for the first time. After that, they have nothing
    but the knowledge that something will be there before then.


    Many gamers believe that this is how all online multiplayer video games work.
    In reality, most game providers send individual players only positional data,
    player input data (e.g., throw a bomb, shoot), and summary-level data (e.g., players
    remaining in a battle royale). Because all of the asset and rendering data is
    already on your local device, the download and installation times are quite long,
    as is the hard disk consumption.


    Games may have a far wider variety of things, assets, and environments by transmitting
    rendering data as needed. Moreover, they can do this without game-delaying downloads
    and installations, update batching, or massive user hard drives. As a result,
    many games now use a hybrid paradigm that combines locally stored data with data
    streaming. This strategy, on the other hand, is critical for Metaverse-focused
    systems. Roblox, for example, requires (and benefits from) a greater variety of
    assets, items, and environments than Mario Kart or Call of Duty.


    The amount of data that needs to be broadcast will increase as the complexity
    and importance of virtual simulation grows. For the time being, Roblox reaps the
    benefits of various basic prefabs and assets that have been widely recycled and
    lightly changed. As a result, Roblox is mostly streaming information on modifying
    previously downloaded things. However, the virtual platform will eventually require
    an almost limitless number of permutations and constructions (almost all of which
    it will be unable to accurately predict).


    Virtual twinning systems (also known as mirror worlds,'' like Microsoft Flight
    Simulator) already have to mimic the real world''s practically unlimited (and
    demonstrable) variability. This entails sending significantly more (i.e., heavier)
    data than ''dark cloud here'' or ''a dark cloud that is 95% similar to dark cloud
    C-95''. Rather, it''s a dark cloud that looks exactly like this. And, most importantly,
    this data is updated in real-time.


    The importance of the last point cannot be overstated. We''ll need a flood of
    cloud-streamed data if we wish to interact in a huge, real-time, shared, and persistent
    virtual world.


    (One of these is fictitious.)


    Compare the real world'' to the map in Fortnite. Everyone on the planet is immersed
    in the same simulation simultaneously and in the same place. If I cut down a tree,
    that tree is irreversibly lost to everyone. Only a fixed, point-in-time version
    of the map is available when playing Fortnite. And whatever you do on that map
    is only shared with a few others and for a limited time before it''s reset. Is
    it legal to cut down a tree? It will be reset in 1–25 minutes, and it was only
    ever gone for up to 99 other users. The map is only updated when Epic Games releases
    a new edition. And if Epic Games decided to broadcast your universe to the rest
    of the world, they''d pick your universe, ignore theirs, and set your universe
    in a specified period. This is acceptable for many virtual experiences. It will
    also suffice for a variety of Metaverse-specific experiences. However, some (though
    not all) experiences will require consistency across all users and at all times.


    Cloud data streaming is also required if we wish to navigate between different
    virtual worlds fluidly. For example, the Travis Scott concert in Fortnite sent
    players from the game''s main area to the depths of a never-before-seen ocean,
    then to a never-before-seen planet, and finally far into space. Epic pulled this
    out by sending all of these game worlds to players via typical Fortnite patch
    days or hours before the event (which, of course, meant that anyone who hadn''t
    downloaded and installed the update before the event couldn''t participate). Then,
    the following set piece was loaded in the background on each player''s device
    during each set piece. This approach works very well, but it necessitates a publisher''s
    knowledge of which worlds a user will visit next and how long in advance they
    will do so. You must either download the totality of all available alternatives
    (which isn''t possible) or cloud stream them if you want to choose from a large
    range of locations.


    There''s also more player data to go along with the additional environmental data.
    When you see your friend in Fortnite today, all the Fortnite server has to do
    is provide you information about where they are and what they''re trying to accomplish;
    the animations (such as reloading an assault rifle or falling) are already loaded
    onto your device and only need to run. When a real-time motion capture is being
    mapped to a friend''s avatar, however, this detailed information must also be
    supplied along with the rest of us. If you wish to watch a video file within the
    game, as Fortnite does occasionally, you''ll need to do it through a virtual world.
    Hear a crowd''s spatial audio? Same. Have you ever had a passerby brush your haptic
    bodysuit''s shoulder? Same.


    Many players already face bandwidth and network congestion for online games that
    merely demand positional and input data. The Metaverse will amplify these requirements.
    The good news is that broadband penetration and bandwidth worldwide are steadily
    increasing. Compute, which will be addressed in further detail in Section #3,
    is also improving and can help replace constrained data transfer by forecasting
    what will happen until the real data can be substituted.


    Latency


    The most difficult problem in networking is also the most misunderstood: latency.
    The time it takes for data to travel from one location to another and back is
    latency. Latency is often considered the least relevant KPI compared to network
    capacity (above) and dependability (below). Because most internet transmission
    is one-way or asynchronous, this is the case. It makes no difference if the time
    between sending a WhatsApp message and receiving a read receipt is 100ms, 200ms,
    or even two seconds. It also doesn''t matter if the video ends in 20ms, 150ms,
    or 300ms after you press the pause button on YouTube. When watching Netflix, it''s
    more crucial that the stream continues to play than that it starts playing straight
    away. Netflix accomplishes this by delaying the commencement of a video stream
    so that your device can download ahead of time while you''re watching. That way,
    if your network hiccups or crunches for a few seconds, you won''t notice.


    Even synchronous and persistent communications like video conversations have a
    pretty high tolerance for latency. Because video is the least critical aspect
    of the calls, video-calling software normally prioritizes voice, the ''lightest''
    data, if there is network congestion. And if your latency spikes — even to the
    point of seconds, not milliseconds — software can save you by speeding up your
    audio-backlog playback and quickly cutting away the pauses. Furthermore, participants
    can easily manage latency by simply learning to wait a little longer.'
