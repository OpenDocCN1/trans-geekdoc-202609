    # CHAPTER 8


    # THE ALTCOIN


    ## What Are Alternative Cryptocurrencies (Altcoins)?


    Alternative cryptocurrencies to Bitcoin are known as altcoins (`BTCUSD`). They
    have certain similarities to Bitcoin, but they differ in important ways. Some
    altcoins, for example, use a different consensus technique to build blocks or
    validate transactions. In addition, they might potentially differentiate themselves
    from Bitcoin by providing new or improved features like smart contracts or reduced
    price volatility.


    There are around 14,000 cryptocurrencies as of November 2021. Bitcoin and Ether
    alone accounted for approximately 60% of the total cryptocurrency market in November
    2021, according to CoinMarketCap. 1 The rest was made up of so-called altcoins.
    Altcoin price movements tend to follow Bitcoin''s path because they are often
    derived. However, analysts believe that as cryptocurrency investing ecosystems
    mature and new markets emerge for these coins, price fluctuations for altcoins
    will become independent of Bitcoin''s trading signals.


    ## UNDERSTANDING ALTERNATIVE CRYPTOCURRENCIES


    The phrase "altcoin" refers to all Bitcoin alternatives. It is a combination of
    "alternative" and "coin." The core design of Bitcoin and altcoins is very similar.
    As a result, they share code and function similarly to peer-to-peer systems or
    as a large computer capable of processing massive amounts of data and transactions
    simultaneously. Altcoins seek to be the next Bitcoin by becoming a low-cost digital
    transaction medium in some circumstances.


    However, there are major distinctions between Bitcoin and altcoins. Bitcoin was
    one of the earliest cryptocurrencies, and its philosophy and design served as
    a model for the development of subsequent coins. However, there are significant
    flaws in its implementation. Proof of work (`PoW`), for example, is an energy-intensive
    and time-consuming consensus technique used to build blocks. The smart contract
    capabilities of Bitcoin are likewise limited.


    Bitcoin became the first widely utilized proof of work application after its launch
    in 2009. (`PoW`).


    Many other cryptocurrencies are based on 2 `PoW`, which allows for secure, decentralized
    consensus.


    To gain a competitive edge, altcoins build on Bitcoin''s perceived shortcomings.
    To reduce energy usage and the time it takes to build blocks and process new transactions,
    several altcoins use the proof of stake (`PoS`) consensus technique.


    Ether, the world''s second-largest cryptocurrency by market capitalization, is
    utilized as gas (or payment for transaction expenses) in Ethereum smart contracts.
    Altcoins often address previous criticisms of Bitcoin, such as scalability and
    sustainability, as the much-anticipated introduction of Ethereum 2.0 has proved.


    Altcoins have built a market for themselves by separating themselves from Bitcoin
    in this way. As a result, they''ve attracted investors who perceive them as viable
    Bitcoin alternatives. As altcoins gain popularity and users and their prices rise,
    investors expect to profit.


    ## TYPES OF ALTCOINS


    Altcoins exist in various flavors and categories, depending on their functions
    and consensus procedures. Here''s a quick rundown of some of the most significant:


    Mining-based

