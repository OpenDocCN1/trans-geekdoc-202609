  trans: '


    比特币的替代加密货币被称为替代币（有时也指除以太币以外的币种）。这些币种通过增强自身功能并弥补比特币的缺陷来与其区分开来。


    # 什么是前 10 名替代加密货币？


    以太坊、币安币（BNB）、泰达币（USDT）、索拉纳、卡尔达诺、XRP、波卡、狗狗币、美元币和柴犬币是截至 2021 年 11 月的前十大替代币。


    # 替代币的价格是多少？


    替代币的价格各不相同，从几分钱到数百美元不等。例如，以太坊在 2021 年 11 月的交易价格约为 4,500 美元，而瑞波币的 XRP（第六大最有价值的加密货币）交易价格为
    1.10.87 美元。


    # 最适合投资的替代币是什么？


    以太币是按市值计算最大且最知名的替代币。


    # 它是以太坊的一部分，或许是近期最复杂的区块链平台之一，其智能合约功能已展示出应用场景。


    # 替代币值得投资吗？


    许多与比特币相同的投资风险也适用于替代币。此外，许多小型替代币流动性较差。然而，以太币和 XRP 等知名替代币与比特币竞争。


    # 最后的想法


    替代币是加密货币市场投资者多样化持仓的绝佳选择。尽管以太坊的以太币等一些替代币很有名，但超过 10,000 种可用替代币中的绝大多数尚未产生影响。替代币是加密货币如何颠覆当前金融的一个很好的例子。然而，在投资之前，投资者应该做好功课。投资替代币的风险与比特币相似，甚至更大。


    # 第 9 章


    # 投资比特币和替代币的策略


    帮助你开始加密货币投资的策略和技巧列表。


    我们将介绍几种投资比特币和其他加密货币的基本策略。下面列出的策略都是在波动的加密货币市场中投资的可行选择。


    提示：这些是完全合法且光明正大的白帽投资和交易策略。这不是投资建议，而是旨在理解基础知识的教学和信息内容。此外，这仅涉及直接比特币投资（无 GBTC 建议）。我们甚至不会讨论“进行
    ICO”或“尝试那个加密货币贷款计划”等模糊领域。


    # 投资加密货币前需要考虑的事项


    首先，以下是投资加密货币前需要考虑的一些事项：


    1\. 做好功课。使用你熟悉的交易所和钱包（我建议从 Coinbase/Coinbase Pro 开始；它可以说是交易所/钱包最适合初学者的解决方案）。专注于你相信且不介意“套牢持有”的币种（我只建议比特币和以太坊；替代币风险更高/潜在回报更高）。提示：我建议“多元化”，但对于新手投资者来说可能有风险。只有在你弄清楚自己在做什么时才进行多元化。从最安全的选择开始，例如比特币（以及在较小程度上以太坊），然后再转到顶级替代币，例如
    LTC 和 XRP，再考虑列表中更靠后的币种。


    2\. 花些时间了解市场的历史。加密货币市场每天 24 小时、每周 7 天开放。当交易量低时，清晨常会出现重大价格波动。加密货币有时会上涨 400%，有时会下跌
    80%，有时一种币种几个月都没有变动……你很难预测下一个会发生哪种情况。如果你在一切顺利的时期进入，可能会想象事情永远是这样，但事实从来不是这样。有时 BTC
    上涨而替代币下跌，有时替代币似乎占据主导地位，有时一切都在上下波动，等等。当然，事情不会一直上涨，但当上涨时，那个阶段不会持续很久（而且情绪可能在你睡觉或周六晚上出去玩时就发生变化）。只有研究和/或经验才能让你为许多可能的比特币世界做好准备。


    3\. 认识到市场是波动的，虽然投资加密货币是合法的，但你承担的许多风险都会相当大……有些甚至可能看起来像赌博（类似于投资小盘股；这是投资，但如果你 HODL，你必须愿意损失
    80% 到 100% 的投资）。


    4\. 谨慎和保守。通过保持投资在可承受范围内并随时间逐步进入市场，你可以减轻日常生活中的很多压力。一种合理的技巧是将加密货币投资限制在可投资现金的 1%–4%，买入金额不超过该比例的
    10%。如果你使用止损单来降低风险并使用技术分析来指导市场时机，那就更好了。


    5\. 对市场采取长期视角。除非你的策略要求，否则尽量不要过于关注当下。相反，选择一种策略和投资，坚持执行，并对市场保持长期视角。随着你获得更多知识，调整策略是可以的；只要确保你心中有一个计划和目标。你要么投资，要么交易，要么两者都做。如果你在投资，尽量将交易降到最低，避免过于关注当天的美元价值。如果你在交易，请关注你的美元价值，避免在高点
    HODL。


    6\. 注意你的情绪。几乎总是，你的情绪会让你损失钱。只有在你运气好的时候，你才会幸运地在底部 FOMO 买入或在高点恐慌抛售。始终依赖数据，永远不要依赖你的直觉、内心或仅基于数据的任何其他东西。FOMO（错失恐惧症）是绝对不行的。


    7\. 从小开始。先用少量资金开始，一旦确认一切正常，再逐渐增加。此指导适用于在交易所之间转账、测试机器人或 TA 方法、交易以及在同行之间转账等方面。


    8\. 了解税务影响和规则。有一些法规以及复杂的税务规则。如果你提前规划，没有什么是不可能的，但也没有什么可以忽视。作为一般规则，如果某事在正常生活中具有争议（网上赌博、在暗网购买东西、不纳税等），那么在加密货币领域至少是可疑的。


    9\. 认识当前趋势。如果你能分辨牛市和熊市，你会表现得好得多。


    # 投资加密货币：基础知识


    如果你牢记以上所有内容，并计划战略性地投资或交易你喜欢的加密货币，对市场的波动历史有良好认识，并知道使用哪些交易所……那么是时候选择一两种投资/交易策略来实施了（这比在没有明确计划退出市场的情况下一次性投入所有资金要好得多）。


    以下是一些可能引起你兴趣的一般投资方法。


    今天就全仓投入并“只是 HODL”（尽量避免这种方法）：最容易做的事情就是今天就全仓投入并“只是 HODL。”这种方法的问题相当于走到轮盘赌桌前，把所有钱都押在黑色上。虽然这是事实，但该策略缺乏复杂性。如果你未能把握市场的绝对底部，你可能会发现自己看着纸面财富消失，除了止损或等待之外别无选择。


