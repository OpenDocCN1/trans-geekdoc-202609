    Olaf Ronneberger et al [17] developed U-Net for medical imaging. The architecture
    for the same consists of two paths, the first is the encoder path or the decoder.
    The encoder consists of convolutional and max pooling layers. It is used to capture
    the spatial feature of the image the second path is the expanding path as the
    decoder. The decoder is used for precise localization which transposed convolutions.
    The highlighted feature of a U-Net is that it only contains layers and no deconvolution
    enables the networks to connect input of any size. Fig. 9 represents a typical
    U-Net architecture.


