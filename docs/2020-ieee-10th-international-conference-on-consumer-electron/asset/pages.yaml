    # II. RELATED WORK


    until now, we have seen that of work has been done to recognise hand signs with
    very little text in the context of Indian Sign Language. A database of 240 images
    was made for 24 students by Singh et al. [66]. They adopted the methodology in
    which they extracted the features from the images and performed clustering based
    on the Euclidean distance. Their achieved a classification accuracy of 97% but
    most gesture were invariant to the background conditions and hands were of static
    kind. As a Human Interaction framework was developed by Pei et al [67] achieved
    98% on 16 gestures. The involved processing of using filtering, gaussian blurring
    and morphological transformations. After processing, the images were submitted
    to a CNN to between different motions and a Kalman estimator was used to move
    the cursor in case it detected the signals. Real Time RGB-D sensor was developed
    by Liao et al [68] when submitted to a dual channel convolutional neural network
    which achieved a classification accuracy of 99.4% on 24 gestures from the Indian
    Sign Language. Again the paper discussed the outcomes of training Otmino et al.
    [9] recognized hands from the background Gradient Descriptor for the images and
    Scale Invariant Feature Transformcriptors for the RGB images. The combined information
    was then used by a Support Vector Machine which achieved a classification accuracy
    of 90.2% on the Indian Sign Language database. For,anov et al. [10] utilized a
    R3DCNN Recurrent Convolutional Neural Network with temporal constraints which
    recognized the dynamic gestures. RGB and depth-stereo sensors were used to collect
    the data. They have learned the model as that R3DCNN which achieved a classification
    accuracy of 83.8%. A hierarchical CNN based design was proposed by Ok et al. [12].
    This model utilized two convolutional neural networks, a lightweight one for detecting
    and a fully 3D CNN to predict the model managed to achieve a classification accuracy
    of 94.04 on EgoBenchmark and 83.82 on the NVIDIA benchmark. For dynamic gestures
    Xiao et al. [13] proposed using a Dense Image Network (DNN) which encodes the
    dynamic gesture to a conservative structure which splits its spatio-temporal advantage.
    We showed that the result of the CNN was 91 for a CNN feature where detection
    is done in a more effective way. Method was proposed by Kopuklu et al. [14] in
    which the


    flow data along with the RGB image was fed to a Deep Neural Network which achieved
    an accuracy of 84.7% on the NVIDIA camera. This model also accomplished a classification
    accuracy of 96.28% on Jester benchmark and 57.4% on CharIam benchmark. Mukesh
    [15] trained a CNN using a handheld dataset and achieved a classification accuracy
    of 85.51%. Again this model was not tested in real time.


    As far as is concerned this is the first attempt at creating real time LSTM gesture
    recognition without using the depth. The semantic augmentation approach eliminates
    the possibility of using a depth sensor. Our models perform well over all background
    conditions and hands of use.


    # III. Details of the Dataset


    We created our dataset for training and using Microsoft Kinect camera. The dataset
    was collected from 5 subjects having an average age of 25 and included both genders.
    We obtained data for the static and dynamic gestures. 45000 images and 45000 depth
    maps were obtained for static gestures. The segmentation method explained in section
    IV-A was for mapping the RGB pixels to the depth map. Fig. 1 shows of the RGB-D
    pairs for sets E, G, M and T captured during proper macam.


    ![](img/b00a05762311a26ba003512b16164439_1_0.png)


    Fig. 1. LSTM gestures for RGB images and depth maps.


    For dynamic gestures we captured 1080 records belonging to 10 dynamic gestures
    used in Indian Sign Language. The words chosen for the name are Airplane, Lock,
    Licence, Love, Mul, Maths, Wifi and Fin. We recorded the gestures used for digits
    0-9 and alphabets A-Z used in the Indian Sign Language System.


