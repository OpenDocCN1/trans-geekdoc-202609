    # I. INTRODUCTION


    Indian sign language is the language used in India that contains standard hand
    gestures which are used by impaired people for communication. The general people
    have no knowledge of the sign gestures as these gestures are extremely complex
    and which turn hampers the knowledge sharing between impaired people and the general
    people. In spite of surge in the research work in the fields of computer vision
    and deep learning, the recognition of ISL gestures has been very limited. Our
    paper focuses on establishing a benchmark for recognizing ISL gestures in real
    time. As we know that ISL uses but


    dynamic gestures with augmentation. For utilizing method CNNs were we used LSTMs
    with a convolutional kernel. A total of 10 dynamic gestures were trained and 1080
    videos were generated for the purpose of training. For semantic segmentation we
    have used U-Net with ResNet as the backbone. This method consists of multiple
    convolutional layers. We used the same data a priori for training the U-Net. This
    paper is an extension of work originally presented in Digital Image Communication:
    Techniques and Applications (DICTA), Perth, 2019 [1] This differs from the previous
    work as we have introduced a new method for Indian Sign Language Recognition which
    does not require a depth camera for inference. This paper is related to the previous
    related work. Section III explains the dataset and the methodology used to achieve
    generation. Section IV explains the performance of'
