    Fig. 6. CNN architecture for training RGB-D images simultaneously


    The depth and RGB images are passed through two different channels until you get
    20 sets of 30 feature maps matching depth and RGB 18. After these channels were
    fused into one after another they were followed with more convolutional layers,
    max-pooling layers and fully connected layers. Liao et al. [8] used similar strategy
    as us.


