    ## IV. METHODOLOGY


    The purpose of this section is to discuss the methodology adopted for mapping
    gesture to the depth map, and the architectures adopted for training the CNN models
    and the U-Net model.


    ![](img/b00a05762311a26ba003512b16164439_2_1.png)


    Fig. 4. Architecture for training depth or RGB CNN model


    ### A. Mapping depth and RGB pixels


    We used Computer Vision techniques to map depth and RGB information. In Fig. 3,
    we converted 2D depth map to 3D coordinate system by using extrinsic parameters
    such as distortion length, principal point and focal length. Using extrinsic parameters
    and translation vectors of the depth, 3D camera coordinate system is converted
    to the 3D world coordinate system. The map is further converted from 3D world
    coordinate system to 3D RGB frame coordinate system by using extrinsic parameters
    of the RGB and the intrinsic parameters of the RGB.


    ![](img/b00a05762311a26ba003512b16164439_2_2.png)


    Fig. 5. ISL recognition flow diagram


    The architecture was used while transfer learning the American Sign Language.
    The weights from the convolutional layer were the same as the depth and RGB layers
    were reinstated to arbitrary small numbers. Another model was trained using both
    the depth and RGB layers. Fig. 6 shows the architecture for us.


    ![](img/b00a05762311a26ba003512b16164439_2_3.png)


