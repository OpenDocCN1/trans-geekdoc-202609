    # 印度手语识别的深度学习方法


    **Pratik Likhar**, **Neel Kamal Bhagat**, **Dr. Ratha G N**

    印度班加罗尔，手语语言学院，电气工程系

    pratiklikhar@iiscac.in, neelbaghat@iiscac.in, ratha@iiscac.in


    **摘要**—印度手语是印度特殊人士使用的语言。通常人们对手语并不了解，这阻碍了他们与他人之间的交流。为了弥补这一差距，我们使用了两种方法来解决这个问题。一种是使用
    Microsoft Kinect 获取深度-RGB 数据实时预测手势。通过 3D 重建和仿射变换对手部分割，我们映射了深度和 RGB 信息。使用卷积神经网络分割印度手语中的
    36 个静态手势，训练出的分类准确率达到 98.31%。测试模型也表现出良好的性能，分类准确率为 97.71%。使用带有卷积核的 LSTM 训练了 10 种动态手势。


    **方法**—印度手语、U-Net、ResNet、语义分割、CNN、LSTM、Kinect


    ## I. 引言


    印度手语是印度使用的语言，包含残障人士用于交流的标准手势。普通人对这些手势几乎一无所知，因为这些手势极其复杂，阻碍了残障人士与普通人之间的知识共享。尽管计算机视觉和深度学习领域的研究激增，但印度手语（ISL）手势的识别非常有限。我们的论文专注于建立一个实时识别
    ISL 手势的基准。众所周知，ISL 使用带有增强的动态手势。为了利用 CNN 方法，我们使用了带有卷积核的 LSTM。总共训练了 10 种动态手势，并为了训练目的生成了
    1080 个视频。


    在印度手语（IS）中，识别手势的锁定问题是一项具有挑战性的任务。这在在使用 Hough 变换 [3] 和尺度不变特征变换 [4] 等特征时增加了复杂性。我们知道，背景的复杂性对预测的准确性也起着巨大的作用。我们还看到使用颜色分割和
    Otsu 技术 [5] 的技术可以采用，但它们在背景方面存在局限性。在本文中，我们使用了两种方法。首先是基于深度的分割（Kinect RGB-D），其次是语义分割（普通
    RGB 数据）。在 RGB 像素和深度信息之间建立联系提供了手部分割。这项任务在论文的第四节中处理。此外，在使用深度信息时语义分割可能会非常困难。这使我们能够放弃笨重的
    RGB-D 相机并使用普通的 RGB 相机。但在计算复杂度上存在权衡。为了利用 CNN 方法，我们使用了 CNN 来学习深度学习架构，因为我们已经在分割手部区域了。


    本文是最初在 2019 年珀斯数字图像通信：技术与应用（DICTA）会议 [1] 上提出的工作的扩展。它与之前的工作不同之处在于，我们引入了一种新的印度手语识别方法，该方法在推理时不需要深度相机。本文与之前的相关工作有关。第三节解释了数据集以及用于实现生成的方法。第四节解释了使用来自
    Kinect 相机的深度信息进行分割的性能表现，以及用于训练模型的不同架构，包括 CNN 和 U-Net。第五部分给出了我们获得的结果，第六部分总结了全文。


    ## II. 相关工作


    到为止，我们看到在印度手语背景下，针对手势识别的工作文本极少。Singh 等人 [66] 为 24 名学生制作了一个包含 240 张图像的数据库。他们采用了这种方法：从图像中提取特征并基于欧式距离进行聚类。他们实现了
    97% 的分类准确率，但大多数手势对背景条件不变，且手部是静态的。Pei 等人 [67] 开发的人机交互框架在 16 个手势上实现了 98% 的准确率，涉及使用滤波、高斯模糊和形态变换的处理。处理后，图像被提交到
    CNN 以区分不同的动作，并使用卡尔曼估计器进行移动。


    Liao 等人 [68] 开发了实时 RGB-D 传感器，使用卷积神经网络在 24 个手势上实现了 99% 的准确率。不仅如此，Otsu 等人 [9] 讨论了使用数据流的结果，在印度手语数据集上实现了
    90.2% 的准确率。这种方法 [10] 使用了 3D 传感器来识别动态手势。


    Ok 等人 [12] 提出了一种分层 CNN，在 Jester 基准上实现了 84.7% 的准确率，在 NVIDIA 基准上实现了 96.28% 的准确率。Xiao
    等人 [13] 提出了使用密集图像网络（DNN），在 NVIDIA 基准上实现了 83.82 的准确率。Kopuklu 等人 [14] 提出了一种空域结构，在印度手语基准上实现了
    91% 的准确率。Mukesh [15] 使用手持数据集训练 CNN，实现了 85.51% 的准确率。再次，该模型没有进行实时测试。


