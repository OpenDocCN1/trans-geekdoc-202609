    Olaf Ronneberger 等人 [17] 为医学图像开发了 U-Net。该架构由两条路径组成，第一条是编码器路径（或解码器）。编码器由卷积层和最大池化层组成，用于捕捉图像的空间特征。第二条路径是解码器。解码器由上采样和卷积层组成，通过跳跃连接将编码器的特征传递给解码器。这种架构在医学分割任务中表现出色。这种
