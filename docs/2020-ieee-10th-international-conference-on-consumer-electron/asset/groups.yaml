    # VI. CONCLUSION AND FUTURE WORK


    In this paper we have presented a method to implement real time Indian Sign Language
    recognition using multiple methods. Using a depth-RGB based camera and a normal
    RGB camera, we achieved high-accuracy semantic segmentation. The usage of semantic
    segmentation approach completes the necessity of using depth camera and segmentation.
    The U-Net model achieved an IOU score of 0.9920 and an F1 score of 0.9957. For
    the depth-RGB trained models challenges like different lighting conditions and
    data augmentation helped in case of static gestures. For dynamic gestures, the
    pretence of data was not at few values so that the model can learn the features.
    In cases of models based on dynamic gestures, we showed high variance for the
    model performance further research can be done to improve it. Some research needs
    to be done on improving the real time performance of the U-Net model on systems
    with lower hardware specifications. We can also take the opportunity to develop
    a real time sentence prediction model based on this paper.


