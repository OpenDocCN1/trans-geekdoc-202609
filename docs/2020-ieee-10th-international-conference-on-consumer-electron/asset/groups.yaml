    ## VI. 结论与未来工作


    在本文中我们提出了一种利用多种方法实现实时印度手语识别的方法。通过使用深度-RGB 相机和普通 RGB 相机，我们实现了高精度的语义分割。语义分割方法的使用完成了对深度相机和分割的必要需求。U-Net
    模型实现了 0.9920 的 IOU 分数和 0.9957 的 F1 分数。对于深度-RGB 训练的模型，不同光照条件和数据增强在静态手势情况下有所帮助。对于动态手势，数据在某些值上不足，导致模型无法学习特征。在基于动态手势的模型中，我们显示出模型性能具有高方差，可以进一步研究以改进它。在硬件规格较低的系统上提高
    U-Net 模型的实时性能还需要进行一些研究。我们还可以借此机会基于本文开发一种实时句子预测模型。


