    Abstract—Indian Sign Language is the language used by specially people in India.
    Generally people have no understanding of the sign language which hampers the
    communication between them and others. To bridge this gap we have used two approaches
    to solve this problem. One using the depth-RGB data captured using a Microsoft
    Kinect and predicting the gestures in real time. For segmenting the hand obtained
    through 3D reconstruction and affine transformation we map the depth and RGB information.
    Convolutional neural networks were used to segment the 36 static gestures from
    Indian Sign Language and trained a classification accuracy of 98.31%. The test
    model also showed a good performance with classification accuracy of 97.71%. LSTM
    with a convolutional kernel was used for training 10 dynamic gestures.


