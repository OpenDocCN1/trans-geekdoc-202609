    ### 3


    Most operations and relations encountered in real problems have special properties:
    commutativity, transitivity, and so on. If they are not used, what is actually
    essentially unified will turn out to be ununified. And when they are used at the
    logical level, the number of axioms increases many times. Of course, the consideration
    of things like transitivity and commutativity must be done at the level of unification
    of concepts and not at the level of logical axioms.


    ### 4.3. GET RESULT


    The resolution procedure forms the proof of the theorem. Answers (knowledge) of
    any kind can be extracted from the proof with the help of special techniques.
    Special techniques are required for the following reason. The solution method
    works only with sentences, but the user sets the actual task not in the form of
    sentences, but in the form in which it is convenient for him. Before applying
    the solution method, it is necessary to transform the problem in the form of proposals.
    Returning a mere proof as an answer is not very user-friendly; it is necessary
    to extract from the proof what the user expects as an answer.


    #### 4.3.1. Get result (yes/no)


    The strategies of the solution method considered so far have given an answer to
    the question whether the solution is derivable or not, i.e., a binary answer to
    the question is obtained: yes or no.


    **Example**


    Consider the following statements.


    1. All students of group 5057 know the solution method.

    2. Vlasenko is a student of group 5057.


    Does Vlasenko know the solution method?


    When translated into sentence form and resolved, we get the following output:


    ```

    1) ¬5057(x) ∨ P(x)

    2) 5057(Vlasenko)

    3) ¬P(Vlasenko)

    4) P(Vlasenko) (1, 2)

    5) ☐ (3, 4)

    ```


    The answer is **yes** since we received an empty set.


    **Example 2**


    1. All students of group 5057 know the solution procedure.

    2. Khalepsky does not know the method of resolutions.


    Is Khalepsky a student of Group 5057?


    ```

    1) ¬5057(x) ∨ P(x)

    2) ¬P(Khalepsky)

    3) ¬5057(Khalepsky)

    4) ¬5057(Khalepsky) (1, 2) - coincides with 3

    ```


    The answer is **no**, since there are no solvable sentences and no empty sentence.


    This is the extraction of the result. With the help of the chosen strategy, we
    were able to get an answer to the question asked.


    It may seem that the "yes-no" answer is an edge case, considered for educational
    purposes only. In fact, this is far from the case. Here are some examples of expert
    systems that give a simple "yes-no" answer while being both quite real and very
    complex.


    1. **Environmental monitoring.** Received such and such data from observations.
    Is there a threat that requires the evacuation of the population?

    2. **Missile defense system.** A moving object has been detected. Is this object
    an enemy missile?

    3. **Exploration system.** Collected indirect data about a specific area. Are
    there oil reserves in the area?


    #### 4.3.2. Extracting Results (Facts)


    And now let''s try to pose the question in such a way that we don''t get an answer
    in the form of yes or no, but in the form of a fact. To do this, you need to modify
    the resolution method by introducing a special predicate, traditionally called
    the `ANS` predicate. An `ANS` predicate is a predicate that accumulates the answer
    value. This predicate is considered equivalent to an empty clause. If there is
    a sentence containing only `ANS` predicates, then it is an empty sentence.


    **Example**


    All students of group 5057 know the resolution procedure.

    Vlasenko is a student of group 5057.

    Korolev is a student of group 5057.


    Who knows the solution method?


    The target sentence `P(x)` looks like this: if `P(x)`, then `ANS(x)`, i.e., if
    `x` knows the solution method, then `x` is the answer. In the formal notation
    in the form of sentences, the question has the form `¬P(x) ∨ ANS(x)`. We remind
    you that in terms of output control, `ANS = ☐`.


    We carry out a final conclusion and get 6 proposals, the last of which is `ANS(Vlasenko)`,
    that is, we get the answer:


    ```

    1) ¬5057(x) ∨ P(x)

    2) 5057(Vlasenko)

    3) 5057(Korolev)

    4) ¬P(x) ∨ ANS(x)

    5) ¬5057(x) ∨ ANS(x) (1, 4)

    6) ANS(Vlasenko) (5, 2)

    ```


    They can stop doing this or continue building new syllogisms, as can logical programming
    systems based on the `Prolog` language. Then all the answers that can be obtained
    from the conditions of the problem are obtained.


    ```

    7) ANS(Korolev) (5, 3)

    ```


    #### 4.3.3. Retrieving Results (Terms)


    With the `ANS` predicate technique, one can obtain not only facts but also results
    at the procedural level. Based on this, it is possible to synthesize an expression
    (term) that calculates a function.


    **Example**


    There is a relationship between father and grandfather. The axioms describing
    this situation are as follows: Every human being has a father, and the father''s
    father is the grandfather.


    ```

    O(x, y) = x father of y

    D(x, y) = x grandfather of y

    ∀x, y, z O(x, y) & O(y, z) → D(x, z)

    ∀y ∃x O(x, y)

    ```


    Then we ask the question: Who is the grandfather of `x`? `D(y, x) → ANS(y)`


    As a result of applying the resolution method, the following conclusion is drawn:


    ```

    1) ¬O(x, y) ∨ ¬O(y, z) ∨ D(x, z)

    2) O(f(y), y)

    3) ¬D(y, x) ∨ ANS(y)

    4) ¬O(y, z) ∨ D(f(y), z) (1, 2, f(y)//x)

    5) D(f(f(y)), y) (4, 2, f(y)//y, y//z)

    6) ANS(f(f(x))) (3, 5)

    ```


    Where `f` is the father computation function obtained by skolemizing (eliminating
    existence) the second axiom of this example.


    The answer is that the grandfather of `x` is `f(f(x))`.


    Thus, from the point of view of knowledge representation, the solution method
    is a thoroughly adequate means. It allows you to get meaningful answers to meaningful
    questions.


    ### 4.4. RULES-BASED DEDUCTION SYSTEMS


    Consider together the different types of knowledge representation that we have
    discussed in the previous chapters, namely knowledge representation based on the
    production system and knowledge representation based on the first-order predicate
    calculus. In fact, there is no insurmountable line between them. These are all
    reducible variations on the same theme, giving reason to believe that it is in
    fact a subject called Representation of Knowledge. If these were absolutely disparate
    things, then it would be completely incomprehensible why they should be combined
    in one course. We shall now easily ascertain that they are not disparate at all.


    First, we will analyze what motivates us to combine different systems of knowledge
    representation. Then look at the AND/OR form from a different perspective, which
    has already appeared twice in this textbook under different names: the first name
    was "decomposable production systems", the second "search on game trees". We will
    revisit this aspect of knowledge representation and try to show through three
    examples that there is a common content and deep inner relationships between the
    techniques used here. At the end of this chapter, three variants of a particular
    technique called the "rule-based deduction system" are demonstrated.


    #### 4.4.1. Loss of Implicitivity


    Let''s examine the shortcomings inherent in the solution method. This method has
    two main characteristics, which in some cases can be considered as disadvantages.

    '
  trans: '


    ### 3


    现实问题中遇到的大多数运算和关系都具有特殊性质：交换律、传递律等。如果不利用这些性质，实际上本质上统一的东西将变得不统一。而当它们在逻辑层面被使用时，公理的数量会增加许多倍。当然，对传递律和交换律等事物的考虑必须在概念统一的层面上进行，而不是在逻辑公理的层面上。


    ### 4.3. 获取结果


    归结过程构成了定理的证明。借助特殊技术，可以从证明中提取任何类型的答案（知识）。之所以需要特殊技术，原因如下。解法仅适用于句子，但用户设定实际任务的形式不是句子，而是对他方便的形式。在应用解法之前，有必要将问题转化为句子的形式。仅返回证明作为答案并不十分友好；有必要从证明中提取用户期望作为答案的内容。


    #### 4.3.1. 获取结果（是/否）


    迄今为止考虑的解法策略已经给出了关于是否可导出解的答案，即获得了对该问题的二元回答：是或否。


    **示例**


    考虑以下陈述。


    1. 5057 组的所有学生都知道解法。

    2. Vlasenko 是 5057 组的学生。


    Vlasenko 知道解法吗？


    翻译成句子形式并进行归结后，我们得到以下输出：


    ```

    1) ¬5057(x) ∨ P(x)

    2) 5057(Vlasenko)

    3) ¬P(Vlasenko)

    4) P(Vlasenko) (1, 2)

    5) ☐ (3, 4)

    ```


    答案是**是**，因为我们得到了一个空集。


    **示例 2**


    1. 5057 组的所有学生都知道归结过程。

    2. Khalepsky 不知道归结方法。


    Khalepsky 是 5057 组的学生吗？


    ```

    1) ¬5057(x) ∨ P(x)

    2) ¬P(Khalepsky)

    3) ¬5057(Khalepsky)

    4) ¬5057(Khalepsky) (1, 2) - 与 3 一致

    ```


    答案是**否**，因为没有可解句子且没有空句子。


    这就是结果的提取。借助所选策略，我们得以回答所提问题。


    可能看起来“是-否”回答只是一个为教学目的而考虑的边缘情况。实际上，远非如此。以下是一些给出简单“是-否”回答的专家系统示例，它们既非常真实又非常复杂。


    1. **环境监测。** 从观测中接收到此类数据。是否存在需要疏散人口的威胁？

    2. **导弹防御系统。** 检测到一个移动物体。该物体是敌方导弹吗？

    3. **勘探系统。** 收集了关于特定区域的间接数据。该区域有石油储备吗？


    #### 4.3.2. 提取结果（事实）


    现在让我们尝试以一种方式提出问题，使我们得到的答案不是是或否的形式，而是事实的形式。为此，你需要通过引入一个特殊谓词来修改归结方法，该谓词传统上称为`ANS`谓词。`ANS`谓词是一个累积答案值的谓词。该谓词被视为等价于空子句。如果存在一个仅包含`ANS`谓词的句子，那么它就是一个空句子。


    **示例**


    5057 组的所有学生都知道归结过程。

    Vlasenko 是 5057 组的学生。

    Korolev 是 5057 组的学生。


    谁知道解法？


    目标句子`P(x)`如下所示：如果`P(x)`，则`ANS(x)`，即如果`x`知道解法，则`x`是答案。用句子形式的形式化表示法，问题的形式为`¬P(x)
    ∨ ANS(x)`。我们提醒您，在输出控制方面，`ANS = ☐`。


    我们进行最终推理并得到 6 个句子，最后一个是`ANS(Vlasenko)`，即我们得到答案：


    ```

    1) ¬5057(x) ∨ P(x)

    2) 5057(Vlasenko)

    3) 5057(Korolev)

    4) ¬P(x) ∨ ANS(x)

    5) ¬5057(x) ∨ ANS(x) (1, 4)

    6) ANS(Vlasenko) (5, 2)

    ```


    他们可以停止这样做，也可以继续构建新的三段论，就像基于`Prolog`语言的逻辑编程系统那样。然后就能从问题条件中获得所有可能的答案。


    ```

    7) ANS(Korolev) (5, 3)

    ```


    #### 4.3.3. 检索结果（项）


    利用`ANS`谓词技术，不仅可以获得事实，还可以获得过程层面的结果。在此基础上，可以合成一个计算函数的表达式（项）。


    **示例**


    存在父子和祖孙的关系。描述这种情况的公理如下：每个人都有一个父亲，父亲的父亲是祖父。


    ```

    O(x, y) = x 是 y 的父亲

    D(x, y) = x 是 y 的祖父

    ∀x, y, z O(x, y) & O(y, z) → D(x, z)

    ∀y ∃x O(x, y)

    ```


    然后我们提问：谁是`x`的祖父？`D(y, x) → ANS(y)`


    应用归结法后，得出以下结论：


    ```

    1) ¬O(x, y) ∨ ¬O(y, z) ∨ D(x, z)

    2) O(f(y), y)

    3) ¬D(y, x) ∨ ANS(y)

    4) ¬O(y, z) ∨ D(f(y), z) (1, 2, f(y)//x)

    5) D(f(f(y)), y) (4, 2, f(y)//y, y//z)

    6) ANS(f(f(x))) (3, 5)

    ```


    其中`f`是通过斯科莱姆化（消除存在量词）本例第二条公理获得的父亲计算函数。


    答案是`x`的祖父是`f(f(x))`。


    因此，从知识表示的角度来看，归结法是一种彻底充分的手段。它允许对有意义的问题获得有意义的答案。


    ### 4.4. 基于规则的演绎系统


    将我们在前几章讨论的不同类型的知识表示放在一起考虑，即基于产生式系统的知识表示和基于一阶谓词演算的知识表示。事实上，它们之间没有不可逾越的界限。这些都是同一主题的可归约变体，有理由相信这实际上是一门称为知识表示的学科。如果这些是完全截然不同的东西，那么将它们结合在一门课程中将完全难以理解。我们现在将很容易确定它们并不截然不同。


    首先，我们将分析是什么促使我们结合不同的知识表示系统。然后从另一个角度审视 AND/OR 形式，它在本书中已经以不同的名称出现过两次：第一个名称是“可分解产生式系统”，第二个是“博弈树搜索”。我们将重新审视知识表示的这一方面，并试图通过三个例子表明，此处使用的技术之间存在共同内容和深层内在联系。在本章末尾，将演示一种称为“基于规则的演绎系统”的特定技术的三种变体。


    #### 4.4.1. 隐含性的丧失


    让我们审视归结法固有的缺点。该方法有两个主要特征，在某些情况下可被视为缺点。


    '
