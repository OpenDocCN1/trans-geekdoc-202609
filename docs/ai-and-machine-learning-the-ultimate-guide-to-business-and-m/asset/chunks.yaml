    \ of numbers [\\[23\\]](#part0005.xhtml#_ftn23).\n\n#### 1.4.5. Classification\
    \ according to the degree of universality\n\nFirst, each new idea of knowledge\
    \ representation tied to a specific subject area is born. The fact is that in\
