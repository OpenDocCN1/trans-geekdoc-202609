    ## 1.4.1. Lavrov''s classification of knowledge


    **Procedural (algorithmic) knowledge.** These include various skills, technologies,
    procedures, algorithms, their software implementations, and typical problem-solving
    approaches—that is, those forms of knowledge that are almost always used explicitly
    for the computational solution of any problem.


    **Factual knowledge.** These are the most diverse quantitative and qualitative
    characteristics of certain objects, that is, data. For example, various data in
    databases, constants in programs, etc.


    Of course, there is no impenetrable boundary between the types of knowledge (see
    also paragraph 0). In addition, it sometimes happens that knowledge is difficult
    to assign to a specific type. For example, algorithms for calculating mathematical
    functions (`sin`, `cos`, etc.) are represented as a set of expansion coefficients
    in special polynomials for the sake of efficiency. These coefficients are of course
    data, i.e. factual knowledge, but are used as algorithmic knowledge. Nevertheless,
    this knowledge classification is very useful and effective when it comes to applied
    artificial intelligence systems, because you can focus on the issues of conceptual
    knowledge representation important for AI, using the methods of representation
    of algorithmic and factographic knowledge as a ready-made foundation.


    **Lavrov Sviatoslav Sergeyevich** (1923–2004), Russian scientist, corresponding
    member of the Russian Academy of Sciences. Author of works on mechanics, automatic
    control, computer mathematics and programming. Winner of the Lenin Prize in 1957.
    Lavrov''s scientific biography is in a sense unique. At a very young age he became
    the founder of missile and space ballistics in the USSR and an undeniable authority
    on controlled flight dynamics and automatic piloting. The advent of digital computing
    technology caused a sharp turn in S.S. Lavrov''s activities and within a few years
    made him a programming classic in the USSR.


    Lavrov''s classification of knowledge is accepted as fundamental in this book.


    ### 1.4.2. Classification according to the degree of use of different types of
    knowledge


    Depending on what types of knowledge are used and how it is done, artificial intelligence
    systems can be classified in different ways.


    1.  **Database (DB).** If a software system uses only factual knowledge, then
    such a software system is called a database (DB) and is not usually considered
    artificial intelligence under modern conditions.[^22]

    2.  **Application software package.** If a software system mainly uses algorithmic
    knowledge, then such a software system is usually referred to as an application
    software package. The assignment of such a software package to an AI system is
    usually stated explicitly. If an application package is used simply as a library
    of procedures, it is not classified as an artificially intelligent system. For
    example, if it uses AI methods, if the program to solve a specific problem is
    created not by the user, but by an automatic planner, then such a package of application
    programs can be considered an artificial intelligence system.

    3.  **Artificially intelligent system.** If conceptual knowledge is used in some
    form in a software system, then such a system is said to be artificially intelligent.


    Note that advanced application packages usually include or actively use an external
    database, and AI application systems almost always use both software packages
    and databases (Fig. 11). For example, a developed chess program has a huge database
    of openings and endgames, a special software package for working with positions
    and moves during a game, and a set of strategic move-selection rules related to
    conceptual knowledge.


    ![Classification of applied systems with elements of artificial intelligence according
    to the type of knowledge used.](Images/image00334.jpeg)


    **Figure 11.** Classification of applied systems with elements of artificial intelligence
    according to the type of knowledge used.


    The subject of this book is precisely the applied systems of artificial intelligence.
    At the same time, we believe that the reader is sufficiently familiar with the
    concepts of software packages and databases that all attention is focused on the
    presentation of conceptual knowledge.


    ### 1.4.3. Classification according to the form of knowledge representation


    When the need is recognized and felt to share knowledge about all three types,
    a way must be chosen to represent them in a computer. The powerful mechanisms
    that a person uses to represent knowledge: natural languages, mathematics, visual
    images, are suitable for representing all types of knowledge, but are unsuitable
    for implementation in a computer. More precisely, on the contrary, modern computers
    are not adapted to use these mechanisms—computers are too primitive and unintelligent.


    There is therefore a need to invent such types of knowledge representation that,
    on the one hand, enable the representation of knowledge of all kinds and, on the
    other hand, would be feasible in modern computers.


    Mechanisms for representing factual and algorithmic knowledge in computers are
    well understood and established. For factual knowledge, these are database management
    systems (DBMS), in modern conditions mostly relational. For algorithmic knowledge,
    these are libraries of procedures, mostly object-oriented under modern conditions,
    i.e. libraries of types and classes.


    The classification according to the form of knowledge representation thus first
    considers the representation of conceptual knowledge.


    Many different mechanisms for representing conceptual knowledge are proposed.
    Currently, the following three are most commonly used (Fig. 12).


    *   **Rules or products (Production systems).** Rule-based artificial intelligence
    systems are currently the most widespread. From a mathematical point of view,
    such systems use computability models that approximate normal Markov algorithms.
    Production systems are covered in detail in Chapters 2 and 3 of this book.

    *   **Formulas of Logical Calculus.** Artificial intelligence systems based on
    logical formulas are currently the second most common. From a mathematical point
    of view, such systems use calculi close to the first-order predicate calculus
    and in some cases to Church''s `λ`-calculus. The representation of knowledge with
    formulas of logical calculus is considered in the fourth chapter.

    *   **Frames and Semantic Networks.** Now this mechanism is used relatively rarely,
    although in the recent past it was not. From a mathematical point of view, such
    systems use the apparatus of graph theory.


    All three common mechanisms are comparable in terms of expressiveness and other
    general mathematical properties.


    The preference for one or another knowledge representation mechanism is often
    given on the basis of considerations of familiarity, ease of programming, familiarity
    with the theory of developers of applied systems. It is particularly important
    how compact the representation of knowledge about a specific task is (see paragraph).


    ### 1.4.4. Classification by type of response when solving problems


    When solving a specific problem, the applied AI system receives knowledge in one
    form or another at the input and gives an answer at the output, which also has
    a certain form and represents (new) knowledge. According to the introduced classification
    of knowledge types, systems of artificial intelligence can be classified according
    to the level of the given answer.


    0.  **Logical answer** (yes or no); not very convenient to use, rarely used now.

    1.  **Factual answer** (answer-fact); If a question is answered specifically,
    such systems are often referred to as information systems. Currently the most
    common class of systems.


    [^22]: Reference footnote marker preserved from original text.

