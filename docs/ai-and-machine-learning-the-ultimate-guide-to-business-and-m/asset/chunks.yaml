  fmt: '

    As a result, a knowledge representation for the game of eight was created, in
    which there are only 4 rules instead of 32. This is a fundamental result, because
    the number of rules `n` (4 or 32) is the argument of the exponential search function
    for finding a solution. For `n = 4`, the power of an average computer is probably
    sufficient to quickly perform an exhaustive search and find a solution, but for
    `n = 32`, it may not be sufficient.


    #### 2.1.6. Farmer, wolf, goat and cabbage


    The second example is a known problem with a farmer who needs to transport a wolf,
    a goat, and a cabbage to the other side so they don''t eat each other (Fig. 2.15).


    ![](Images/image00338.jpeg)


    **Figure 2.15.** Farmer, wolf, goat and cabbage: problem statement


    Of course, this task can be simplified. The idea is that the farmer and the boat
    are indistinguishable and form a whole. You can also consider any coast-to-coast
    movement to be instantaneous. Let''s renumber the objects: 0 - farmer, 1 - wolf,
    2 - goat, 3 - cabbage. The presence of an object on the right (destination) bank
    is denoted by "1", on the left (source) by "0". In this case it is obvious that
    the database `D` should have the form:


    `D : array [0..3] of 0..1`


    At the same time, `D[0]` is the position of a farmer, `D[1]` a wolf, `D[2]` a
    goat, and `D[3]` a cabbage. We write the array `D` in the form of a four-digit
    bit scale. For example, `0101` means that a farmer with a goat is on the left
    bank and a wolf with cabbage is on the right bank. Then the initial state of the
    base is `d0 = 0000` and the goal state is `dk = 1111`.


    What should the rules look like? Approaching the solution of this problem directly,
    we can argue as follows. There are a total of 16 possible base states [[34]](#part0005.xhtml#_ftn34).
    Consider pairs of states of basis such that it is possible to go from the first
    state to the second in one go. For example `1011 → 0011` - a pawn swam from the
    right bank to the left. It is easy to see that there are `16*4=64` such pairs.
    Note that some basic states are valid, e.g. `0101`, while other states are invalid,
    e.g. `0011` - the goat eats the cabbage. It is easy to verify that there are 10
    valid states and 6 invalid states. Let''s discard those pairs of states where
    the target state is invalid. The remaining pairs, and there are 40 of them, are
    the rules of our system.


    It is easy to see that this is purely mechanical, formal work that can be entrusted
    to a computer. However, the result will not be very good (four dozen rules). Such
    a representation of knowledge cannot be called successful.


    Let''s try to be creative. Creativity, in this case, consists of attracting general
    knowledge that was not contained in the original problem statement.


    1.  If the initial state is valid and all rules remain valid, then every reachable
    state is valid (principle of complete induction).

    2.  In order to solve this problem, it suffices to consider only permissible states
    of the basis (invalid ones cannot be included in the solution even in intermediate
    stages).


    Note that the initial state is legal (as is the final state). It remains to single
    out the rules that will preserve admissibility. To do this, we note that there
    are essentially only four possible moves in the problem: moving a pawn without
    an object, moving a pawn with a wolf, with a goat, and with a cabbage. Now it
    remains to write down simple conditions for the admissibility of these moves and
    to obtain a set of rules `R`:


    | Condition | Action |

    | --- | --- |

    | `if D[1]<>D[2] & D[2]<>D[3]` | `then D[0]:= 1 - D[0]` |

    | `if D[2]<>D[3] & D[0]=D[1]` | `then D[0]:= 1 - D[0]; D[1]:= 1 - D[1]` |

    | `if D[0]=D[2]` | `then D[0]:= 1 - D[0]; D[2]:= 1 - D[2]` |

    | `if D[1]<>D[2] & D[0]=D[3]` | `then D[0]:= 1 - D[0]; D[3]:= 1 - D[3]` |


    So in this case, a creative approach to the problem improved the representation
    of knowledge tenfold.


    #### 2.1.7. Knight''s move


    In chess, a knight can move in an "L" pattern - two squares horizontally or vertically
    and one square in a perpendicular direction. At the same time, it should not go
    beyond the limits of the chessboard. Thus, in the most general case, there are
    at most eight possible moves of the knight from given positions (Fig. 2.16). When
    the knight is on the edge of the board, there are fewer possible moves.


    ![](Images/image00339.jpeg)


    **Figure 2.16.** Possible knight moves


    The traditional formulation of the problem is to find such a sequence of knight
    moves, starting from any square, that the knight enters each square of the board
    only once.


    Then the database `D` looks like this:


    `D : Array [1..8,1..8] of 1..0`, where `D[i,j] = 1` means that the knight was
    on square `(i,j)` and `0` was not.[[35]](#part0005.xhtml#_ftn35)


    Then the initial state of the base `D0` - all elements of the array `D` are zeros
    and the target state `Dk` - all elements of `D` are ones.


    Let''s calculate how many different knight moves there are in chess (on an empty
    board). There are 8 moves for each of the 16 squares in the middle of the board.
    For the squares of the adjacent layer - 6 moves each, except for squares b2, b7,
    g2, g7, in which there are only 4 moves.


    Furthermore, 4 moves are possible from the squares at the edge of the board, with
    the exception of the corner squares, of which there are only 2 moves, and squares
    a2, b1, a7, b8, g8, h7, h2, g1, from which the knight moves to 3 others can jump
    fields. In total we have: `16*8 + 16*6 + 4*4 + 16*4 + 8*3 + 4*2 = 336` knight
    moves.


    Obviously there is no point in numbering all possible moves and comparing rules
    with them: there are too many of them. Let''s replace real moves with a series
    of eight productions that produce legal moves of the knight led by Figure 2.16.
    At the same time, we can introduce directly into the rules a check of the condition
    of the problem that the knight can enter the given square only once. The current
    coordinates of the jumper are stored in the variables `i` and `j`.


    ```

    if i <= 6 & j <= 7 & D[i+2,j+1] = 0 then D[i+2,j+1] = 1 & i = i+2 & j = j+1

    if i <= 7 & j <= 6 & D[i+1,j+2] = 0 then D[i+1,j+2] = 1 & i = i+1 & j = j+2

    if i >= 1 & j <= 6 & D[i-1,j+2] = 0 then D[i-1,j+2] = 1 & i = i-1 & j = j+2

    if i >= 2 & j <= 7 & D[i-2,j+1] = 0 then D[i-2,j+1] = 1 & i = i-2 & j = j+1

    if i >= 2 & j >= 1 & D[i-2,j-1] = 0 then D[i-2,j-1] = 1 & i = i-2 & j = j-1

    if i >= 1 & j >= 2 & D[i-1,j-2] = 0 then D[i-1,j-2] = 1 & i = i-1 & j = j-2

    if i <= 7 & j >= 2 & D[i+1,j-2] = 0 then D[i+1,j-2] = 1 & i = i+1 & j = j - 2

    if i <= 6 & j >= 1 & D[i+2,j-1] = 0 then D[i+2,j-1] = 1 & i = i+2 & j = j-1

    ```


    Saving over the "frontal" approach: `336:8 = 42` times.


    ### 2.2. MANAGEMENT STRATEGIES


    A variety of control strategies can be proposed for production systems. The most
    important observation is that there is not and cannot be one best management strategy
    for all occasions. The same strategy can work well for one class of problems and
    be totally unsatisfactory for another.


    In anticipation of the main material of the section, we will make a number of
    comments. At first glance, these remarks may seem insignificant, but we consistently
    try to adhere to the principle of necessity (necessity, usefulness) of all the
    material contained in the book - this applies equally to annotations, additions
    and jokes in the text.

    '
  trans: '

    因此，为“8 数码”游戏创建了一种知识表示，其中只有 4 条规则，而不是 32 条。这是一个根本性的结果，因为规则数量 `n`（4 或 32）是寻找解决方案的指数搜索函数的参数。对于
    `n = 4`，普通计算机的算力很可能足以快速执行穷举搜索并找到解决方案，但对于 `n = 32`，则可能不够。


    #### 2.1.6. 农夫、狼、羊和白菜


    第二个例子是一个已知问题：一位农夫需要将一只狼、一只羊和一颗白菜运到河对岸，使它们互不相食（图 2.15）。


    ![](img/image00338.jpeg)


    **图 2.15.** 农夫、狼、羊和白菜：问题描述


    当然，这个任务可以简化。思路是农夫和船是不可区分的，构成一个整体。你也可以认为任何从岸到岸的移动都是瞬时的。让我们重新给物体编号：0 - 农夫，1 - 狼，2
    - 羊，3 - 白菜。物体在右岸（目标岸）的存在用 "1" 表示，在左岸（起始岸）用 "0" 表示。在这种情况下，显然数据库 `D` 应该具有以下形式：


    `D : array [0..3] of 0..1`


    同时，`D[0]` 是农夫的位置，`D[1]` 是狼，`D[2]` 是羊，`D[3]` 是白菜。我们以四位二制数的形式写出数组 `D`。例如，`0101`
    意味着农夫和羊在左岸，狼和白菜在右岸。那么数据库的初始状态是 `d0 = 0000`，目标状态是 `dk = 1111`。


    规则应该是什么样子？直接着手解决这个问题，我们可以按如下方式推理。总共有 16 种可能的基状态 [[34]](#part0005.xhtml#_ftn34)。考虑基状态对，使得可以一步从第一个状态转移到第二个状态。例如
    `1011 → 0011` - 棋子（注：原文 pawn 此处指农夫/船）从右岸游到了左岸。很容易看出，有 `16*4=64` 个这样的状态对。注意，一些基状态是合法的，例如
    `0101`，而其他状态是非法的，例如 `0011` - 羊吃白菜。很容易验证有 10 个合法状态和 6 个非法状态。让我们丢弃那些目标状态非法的状态对。剩下的状态对，共有
    40 个，就是我们系统的规则。


    很容易看出，这是纯粹机械的、形式化的工作，可以交给计算机。然而，结果不会很好（四十条规则）。这样的知识表示不能称为成功。


    让我们尝试发挥创造性。在这种情况下，创造性在于引入原始问题陈述中不包含的通用知识。


    1.  如果初始状态是合法的，且所有规则都保持合法性，那么每一个可达状态都是合法的（完全归纳原理）。

    2.  为了解决这个问题，只需考虑基的合法状态即可（非法状态甚至不能包含在解决方案的中间阶段中）。


    注意初始状态是合法的（最终状态也是）。剩下的就是挑选出能保持合法性的规则。为此，我们注意到问题中本质上只有四种可能的移动：农夫独自移动、农夫带狼移动、农夫带羊移动、农夫带白菜移动。现在只需写出这些移动合法性的简单条件，并获得规则集
    `R`：


    | 条件 | 动作 |

    | --- | --- |

    | `if D[1]<>D[2] & D[2]<>D[3]` | `then D[0]:= 1 - D[0]` |

    | `if D[2]<>D[3] & D[0]=D[1]` | `then D[0]:= 1 - D[0]; D[1]:= 1 - D[1]` |

    | `if D[0]=D[2]` | `then D[0]:= 1 - D[0]; D[2]:= 1 - D[2]` |

    | `if D[1]<>D[2] & D[0]=D[3]` | `then D[0]:= 1 - D[0]; D[3]:= 1 - D[3]` |


    因此，在这种情况下，对问题的创造性处理使知识表示效率提高了十倍。


    #### 2.1.7. 马的走法


    在国际象棋中，马可以按“日”字走法移动——水平或垂直走两格，然后垂直于该方向走一格。同时，它不应超出棋盘边界。因此，在最一般的情况下，从给定位置最多有八种可能的马的走法（图
    2.16）。当马在棋盘边缘时，可能的走法较少。


    ![](img/image00339.jpeg)


    **图 2.16.** 可能的马的走法


    该问题的传统表述是：找到这样一个马的走法序列，从任意格子开始，使得马仅进入棋盘上的每个格子一次。


    那么数据库 `D` 如下所示：


    `D : Array [1..8,1..8] of 1..0`，其中 `D[i,j] = 1` 表示马曾到达过格子 `(i,j)`，`0` 表示未到达。[[35]](#part0005.xhtml#_ftn35)


    那么数据库的初始状态 `D0` - 数组 `D` 的所有元素均为零，目标状态 `Dk` - 数组 `D` 的所有元素均为一。


    让我们计算一下国际象棋中（在空棋盘上）有多少种不同的马的走法。棋盘中央 16 个格子每个有 8 种走法。相邻层的格子每个有 6 种走法，除了 b2、b7、g2、g7
    这四个格子，只有 4 种走法。


    此外，棋盘边缘格子每个有 4 种走法，角落格子除外（角落格子只有 2 种走法），以及 a2、b1、a7、b8、g8、h7、h2、g1 这些格子，马可以跳到
    3 个其他格子。总共我们有：`16*8 + 16*6 + 4*4 + 16*4 + 8*3 + 4*2 = 336` 种马的走法。


    显然，给所有可能的走法编号并将规则与它们进行比较是没有意义的：数量太多了。让我们用一系列八个产生式来替代真实的走法，这些产生式根据图 2.16 产生合法的马的走法。同时，我们可以直接在规则中引入问题的条件检查，即马只能进入给定格子一次。跳棋子（马）的当前坐标存储在变量
    `i` 和 `j` 中。


    ```

    if i <= 6 & j <= 7 & D[i+2,j+1] = 0 then D[i+2,j+1] = 1 & i = i+2 & j = j+1

    if i <= 7 & j <= 6 & D[i+1,j+2] = 0 then D[i+1,j+2] = 1 & i = i+1 & j = j+2

    if i >= 1 & j <= 6 & D[i-1,j+2] = 0 then D[i-1,j+2] = 1 & i = i-1 & j = j+2

    if i >= 2 & j <= 7 & D[i-2,j+1] = 0 then D[i-2,j+1] = 1 & i = i-2 & j = j+1

    if i >= 2 & j >= 1 & D[i-2,j-1] = 0 then D[i-2,j-1] = 1 & i = i-2 & j = j-1

    if i >= 1 & j >= 2 & D[i-1,j-2] = 0 then D[i-1,j-2] = 1 & i = i-1 & j = j-2

    if i <= 7 & j >= 2 & D[i+1,j-2] = 0 then D[i+1,j-2] = 1 & i = i+1 & j = j - 2

    if i <= 6 & j >= 1 & D[i+2,j-1] = 0 then D[i+2,j-1] = 1 & i = i+2 & j = j-1

    ```


    与“正面”方法相比节省：`336:8 = 42` 倍。


    ### 2.2. 控制策略


    可以为产生式系统提出多种控制策略。最重要的观察是，不存在也不可能存在一种适用于所有场合的最佳控制策略。同一种策略对于一类问题可能效果很好，而对于另一类问题则完全不令人满意。


    在预期本节主要内容之前，我们将做一些评论。乍一看，这些评论可能似乎微不足道，但我们始终坚持书中所含所有材料的必要性（必要性、实用性）原则——这同样适用于文本中的注释、补充和玩笑。

