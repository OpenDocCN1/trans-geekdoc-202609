    current level of development of science and technology. The fact is that when
    walking, the center of gravity of our body is almost never above the support area.
    From the point of view of mechanics, we do not walk, but we fall continuously,
    but not quite, but successfully with our foot to the right place and move on.
    The 19th-century frontal approach—constructing a mechanical model with the required
    number of degrees of freedom and solving the appropriate system of differential
    equations at each step—does not work. Even the fastest modern computer does not
    have time to perform the necessary calculations in real time. It is quite clear
    that when we walk, we do not solve a system of equations in our heads. Completely
    different techniques are also used to make robots walk. Any new achievement in
    this field is considered a significant success, as can be seen from the list of
    exhibits at the International Exhibition presented above. In terms of fast running
    and jumping (at the level of professional athletes), a two-legged fast running
    and jumping robot is still an almost unrealistic task today [\[10\]](#part0005.xhtml#_ftn10).
    Fortunately, a Terminator robot that can move and shoot as adeptly as Schwarzenegger
    in the famous film is not yet possible.


    No adequate apparatus has yet been created that would allow the robot to “see”
    the world around it and respond to “visual” changes in it as well as a human.
    The way we see the world is the result of long learning based on intellectual
    activity. It is known that the child already has stereoscopic color vision in
    the third week of development. As a result of interacting with objects and accumulating
    observational experiences, a new ability based on stereoscopic color vision is
    formed in a child - object perception. It is important to emphasize that this
    ability is not explained by physiological but by intellectual reasons [\[11\]](#part0005.xhtml#_ftn11).
    On the other hand, the researchers found that when a person is placed in a completely
    unusual artificial environment (where the lighting is unusually arranged, familiar
    objects are unusually large, processes are unusually paced, etc.), the ability
    for adequate perception is present three-dimensional reality through a person
    is lost. Object perception is therefore an ability of the psyche and not of the
    eye. In fact, we see a model that the brain creates very quickly, in tenths of
    a second, from the information received by the eye. Sometimes this model can differ
