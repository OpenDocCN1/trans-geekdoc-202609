- raw: "List O is traditionally called the list of open nodes (from English Open),\
    \ and list C is traditionally called the list of closed nodes (from English Close).\
    \ However, these traditional names can be misleading. In fact, List O is a list\
    \ of nodes that we haven't opened yet but will open (to open) and List C is a\
    \ list of nodes that we already have opened and won't reopen (already opened).\
    \ .\n\nThere are two basic ways to search on a chart: breadth-first search and\
    \ depth-first search.\n\nIf the list O is a stack, i.e. the last placed node is\
    \ selected for expansion, then one speaks of a depth-first search in this case\
    \ .\n\na breadth-first search in this case .\n\nBreadth-first search and depth-first\
    \ search have their advantages and disadvantages.\n\nThe main advantage of breadth-first\
    \ search is that it always finds a solution if it exists . Breadth-first search\
    \ scans all nodes without exception and gradually moves away from the starting\
    \ node. On the other hand, if the search graph is infinite or very large, a depth-first\
    \ search may miss the solution, go deep, and not return.\n\nThe main advantage\
    \ of depth-first search is that it can sometimes be faster . For example, suppose\
    \ the desired node is a distance k from the starting node. In such a situation,\
    \ breadth-first search will necessarily first reveal all nodes that are at a distance\
    \ less than k , and only after that will it begin to reveal nodes at a distance\
    \ k , among which is the desired one. While depth-first search, if you're lucky,\
    \ can go to the desired node and uncover the minimum number of nodes on the direct\
    \ path to the goal (at best, it will uncover a total of k \\-1 nodes). In general,\
    \ it can be shown that a depth-first search finds a solution about twice as fast\
    \ on average as a breadth-first search. On fig error! The text of the specified\
    \ style does not exist in the document. .22 clearly illustrates the causes of\
    \ this phenomenon. In this image, the nodes that will be expanded are highlighted\
    \ in black, and the curly arrow indicates the order in which the nodes will be\
    \ expanded. It can be clearly seen that breadth-first search, moving in a spiral,\
    \ can get close to the solution and get to the \"penalty circle\", and depth-first\
    \ search, if lucky, can \"stumble\" on the solution almost immediately.\n\n![](Images/image00344.jpeg)\n\
    \n.22. Breadth-first search (left) and depth-first search (right)\n\nNotice the\
    \ innermost if statement in Algorithm 2.7. When solving a problem with the search\
    \ method in a diagram, there is always a dilemma - to check the duplication of\
    \ nodes or not? Duplication can occur as the same database state can result from\
    \ different sequences of rule application. Checking this will take extra time\
    \ looking for a match, but there will be no duplicate nodes and no extra work\
    \ to reopen them. If we don't check it, on the contrary we won't waste time checking,\
    \ but maybe we'll waste time reworking with the nodes we've already met.\n\nConsider\
    \ breadth-first search for the problem of a farmer, a wolf, a goat, and a cabbage\
    \ \n\n![](Images/image00345.jpeg)\n\n  .23. Search graph for the wolf, goat, and\
    \ cabbage problem with matching nodes\n\nLet us note an important fact. Contrary\
    \ to popular belief, breadth-first search can form fewer nodes than backward search\
    \ when searching for matches..20 and Fig. Error! Text of specified style is missing\
    \ from document..23 .in the first case 14 knots were built, in the second only\
    \ 10). In other words, breadth-first search on a graph (brute-force search) can\
    \ be more efficient than backtracking in some cases! \n\nHowever, if you do not\
    \ check the matches, many additional nodes can be created that repeat the existing\
    \ ones. On fig error! The text of the specified style does not exist in the document.\
    \ .24 shows a section of the corresponding search graph for this generally infinite\
    \ problem. Ellipses in this figure indicate extensions of the graph, not shown.\
    \ Breadth-first search will find a solution, although it takes a lot of unnecessary\
    \ work, and depth-first search may “miss” the solution.\n\n![](Images/image00346.jpeg)\n\
    \n  .24. Search graph for the wolf, goat, and cabbage problem with no matching\
    \ nodes\n\nIt is impossible to give a general mathematically rigorous recommendation\
    \ as to whether or not to search for matches. Informally, it can be assumed that\
    \ if there are few coincidences, it is better not to check them, and if there\
    \ are many, as in the farmer, the wolf, the goat, and the cabbage problem, then\
    \ it is better to check it.\n\nAnother important observation about the properties\
    \ of the search graph can be made using the example of the game of eight. As you\
    \ know, there are 8! = 40 320 possible permutations of eight chips and therefore\
    \ there are 8!9 = 9! = 362,880 database states (number of chippermutations multiplied\
    \ by number of empty cell positions). It can be proved that all DB states are\
    \ divided into two sets: with an even number of inversions and with an odd number\
    \ of inversions, and the moves necessarily preserve parity. Thus, the search graph\
    \ for the game of eight consists of two connected components, with each component\
    \ being strongly connected. If the initial and end states of the basis belong\
    \ to different connected components then the solution is impossible, and if they\
    \ belong to the same component then the solution necessarily exists.\n\nWe see\
    \ that in the general case a finite set of rules R implicitly defines a possibly\
    \ infinite search graph, and it can be either connected or disconnected, contain\
    \ or not contain cycles. No conclusions can be drawn about the properties of the\
    \ search graph based on the form of individual rules.\n\nIn terms of a search\
    \ graph, we can figuratively say that a backward search is a probe that we stick\
    \ into the search graph hoping to stumble upon d t . As a result, part of the\
    \ diagram is revealed and part of the diagram remains hidden. Graph search is\
    \ the systematic, incremental manifestation of the entire graph, leaving nothing\
    \ hidden.\n\n### 2.3. SPECIAL PRODUCT SYSTEMS\n\nHere we discuss various special\
    \ cases of production systems. Using special properties of special cases can and\
    \ usually does lead to unexpected benefits.\n\n### 2.3.1 Reverse Production Systems\n\
    \nThe production systems considered always started the search from the initial\
    \ state and worked until the target state was reached as a result. Such production\
    \ systems are usually (see beginning of section 2.2) called directly . It is logical\
    \ to do the opposite - apply the reverse rules and move from the target state\
    \ to the base state. Such systems are often referred to as inverse . There are\
    \ cases when the reverse system is more efficient, there are cases when the direct\
    \ (Fig. Error! The text of the specified style is missing from the document. .25\
    \ ). Figuratively speaking, it all comes down to where the target is bigger -\
    \ the bigger target is easier to hit!\n\n25\\. Direct and reverse production systems\n\
    \nTo compare direct and inverse production systems, consider the following number\
    \ theory model problem. In this problem you must determine whether a given number\
    \ can be broken down into given factors.\n\nThe target number is 60 and the factors\
    \ are 2, 3, 5. The direct system looks like this.\n\nd 0 := {2,3,5}, t (d) :=\
    \ 60  d\n\nR := if x  d & y  d & xy  d & xy<61 then d:= d  {xy}\n\nBreadth-first\
    \ search returns the following results (19 rule applications).\n\n2 3 5                \
    \ (original multipliers) \n\n4 6 9 10 15 25 (products in pairs) \n\n8 12 18 20\
    \ 30 50 (second line \\*2) \n\n27 45                  (second line \\*3 )\n\n\
                         (second line \\*5 - no new ones) \n\n16 24 36 40 60 (third\
    \ line \\*2 - goal reached) \n\nDepth-first search yields the following results\
    \ (4 rule applications).\n\n2 3 5\n\n15 45 30 60\n\nThe reverse system will be\
    \ like this.\n\nd 0 := {60}, t (d) := 1  d\n\nR := { if x  d & x:2 then d :=\
    \ d\\\\{x}  {x/2} if x  d & x:3 then d := d\\\\{x}  {x/3} if x  d & x:5 then\
    \ d := d\\\\{x}  {x/5} }\n\nDepth-first search yields the following results (4\
    \ rule applications).\n\n60\n\n30 15 5 1"
  fmt: "\n# 搜索策略与生产系统\n\n## 列表 O 与列表 C\n\n列表 O 传统上称为**开放节点列表**（源自英文 Open），列表 C 传统上称为**封闭节点列表**（源自英文\
    \ Close）。然而，这些传统名称可能具有误导性。实际上，列表 O 是**我们尚未打开但将要打开的节点列表**（to open），而列表 C 是**我们已经打开且不会重新打开的节点列表**（already\
    \ opened）。\n\n## 图搜索的两种基本方式\n\n在图上搜索有两种基本方式：**广度优先搜索**和**深度优先搜索**。\n\n- 若列表 O\
    \ 是**栈**（即最后放入的节点被选中扩展），则称为**深度优先搜索**。\n- 若列表 O 是**队列**（即最先放入的节点被选中扩展），则称为**广度优先搜索**。\n\
    \n## 广度优先与深度优先的优劣势\n\n### 广度优先搜索\n\n**主要优势**：若解存在，它**总能找到解**。广度优先搜索不加例外地扫描所有节点，并逐渐远离起始节点。\n\
    \n**劣势**：若搜索图无限或极大，深度优先搜索可能错过解，陷入深处而不返回。\n\n### 深度优先搜索\n\n**主要优势**：**有时更快**。例如，目标节点距起始节点距离为\
    \ `k`。此时广度优先搜索必然先揭示所有距离小于 `k` 的节点，随后才开始揭示距离为 `k` 的节点（目标在其中）。而深度优先搜索若运气好，可直接走到目标节点，仅揭示通往目标的直接路径上的最少节点（最优情况共揭示\
    \ `k - 1` 个节点）。总体可证明，深度优先搜索平均找到解的速度约为广度优先搜索的**两倍**。\n\n图 22 直观展示了这一现象。图中黑色高亮节点为将被扩展的节点，弯曲箭头指示扩展顺序。可见广度优先搜索呈螺旋式推进，虽能接近解却可能陷入“惩罚圈”；而深度优先搜索若幸运，几乎能立即“撞上”解。\n\
    \n```\n图 22. 广度优先搜索（左）与深度优先搜索（右）\n```\n\n![](Images/image00344.jpeg)\n\n## 重复节点检查的困境\n\
    \n请注意算法 2.7 中最内层的 `if` 语句。用图搜索法解题时，总面临一个两难选择：**是否检查节点重复？**\n\n- **检查重复**：不同规则应用序列可能导致相同数据库状态。检查需额外时间查找匹配，但可避免重复节点及重复展开的额外工作。\n\
    - **不检查重复**：虽节省检查时间，但可能在已遇到的节点上浪费时间重复工作。\n\n## 案例：农夫、狼、羊、白菜问题\n\n### 检查匹配节点的广度优先搜索\n\
    \n![](Images/image00345.jpeg)\n\n图 23. 狼、羊、白菜问题的搜索图（含匹配节点）\n\n**重要事实**：与普遍看法相反，广度优先搜索在搜索匹配时构建的节点数可能**少于**回溯搜索（图\
    \ 20 和图 23：前者构建 14 个节点，后者仅 10 个）。换言之，**图上的广度优先搜索（暴力搜索）在某些情况下比回溯更高效！**\n\n### 不检查匹配节点的情况\n\
    \n若不检查匹配，会创建许多重复现有节点的额外节点。图 24 展示了这一普遍无限问题的搜索图片段。图中省略号表示未展示的图扩展。广度优先搜索虽能找到解，但做了大量无用功；深度优先搜索可能“错过”解。\n\
    \n![](Images/image00346.jpeg)\n\n图 24. 狼、羊、白菜问题的搜索图（无匹配节点）\n\n**结论**：无法给出是否搜索匹配的通用数学严格建议。非正式地看：若重合少，最好不检查；若重合多（如本问题），最好检查。\n\
    \n## 八数码游戏的搜索图性质\n\n八数码游戏中，8 块芯片有 `8! = 40,320` 种排列，故数据库状态数为 `8! × 9 = 9! = 362,880`（排列数\
    \ × 空格位置数）。可证明所有数据库状态分为两集：**逆序数为偶数**与**逆序数为奇数**，移动必保持奇偶性。因此八数码搜索图由**两个连通分量**组成，每个分量内部强连通。\n\
    \n- 若初始态与目标态属于**不同**连通分量 → **无解**。\n- 若属于**同一**分量 → **解必然存在**。\n\n## 搜索图的一般性质\n\
    \n一般情况下，有限规则集 `R` 隐式定义了一个**可能无限**的搜索图，它可以是连通或非连通的，可以含环或不含环。**无法仅凭单条规则形式推断搜索图性质**。\n\
    \n形象地说：回溯搜索是我们刺入搜索图、希望撞上目标 `d t` 的探针，结果部分图被揭示、部分仍隐藏。而图搜索是整个图的**系统性、增量式、无遗漏**显现。\n\
    \n# 2.3 特殊生产系统\n\n本节讨论生产系统的各种特殊情形。利用特殊情形的特殊性质，往往能带来意想不到的收益。\n\n## 2.3.1 逆向生产系统\n\
    \n前文讨论的生产系统总是从**初始状态**出发，搜索至达到**目标状态**。此类系统通常称为**正向**系统（见 2.2 节开头）。反之——应用**逆向规则**，从**目标状态**回溯至**基础状态**——称为**逆向**系统。有时逆向系统更高效，有时正向更高效（图\
    \ 25）。形象地说，关键在于**目标在哪边更大——目标越大越容易命中！**\n\n```\n图 25. 正向与逆向生产系统\n```\n\n### 对比模型：数论分解因数问题\n\
    \n**问题**：判断给定数能否分解为给定因数。\n\n- **目标数**：`60`\n- **因数**：`2, 3, 5`\n\n#### 正向系统\n\n\
    ```\nd0 := {2, 3, 5}\nt(d) := 60 ∈ d\n\nR := if x ∈ d & y ∈ d & xy ∉ d & xy <\
    \ 61 then d := d ∪ {xy}\n```\n\n**广度优先搜索结果**（19 次规则应用）：\n\n```\n2 3 5        \
    \            (原始因数)\n4 6 9 10 15 25           (两两乘积)\n8 12 18 20 30 50       \
    \  (第二行 *2)\n27 45                    (第二行 *3)\n                         (第二行\
    \ *5 - 无新增)\n16 24 36 40 60           (第三行 *2 - 到达目标)\n```\n\n**深度优先搜索结果**（4 次规则应用）：\n\
    \n```\n2 3 5\n15 45 30 60\n```\n\n#### 逆向系统\n\n```\nd0 := {60}\nt(d) := 1 ∈ d\n\
    \nR := {\n  if x ∈ d & x%2==0 then d := d\\{x} ∪ {x/2}\n  if x ∈ d & x%3==0 then\
    \ d := d\\{x} ∪ {x/3}\n  if x ∈ d & x%5==0 then d := d\\{x} ∪ {x/5}\n}\n```\n\n\
    **深度优先搜索结果**（4 次规则应用）：\n\n```\n60\n30 15 5 1\n```\n"
