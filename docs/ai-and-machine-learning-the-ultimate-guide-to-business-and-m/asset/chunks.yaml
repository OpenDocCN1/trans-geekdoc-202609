- raw: "a theory that served as a model for two millennia, although from today's point\
    \ of view it was not constructed rigorously and formally enough. Many              \
    \ mathematicians tried to improve Euclid's constructions. Lobachevsky              \
    \ , for example, led to the discovery of non-Euclidean geometries. A little over\
    \ a hundred years ago, David Hilbert wrote the book Fundamentals of Geometry,\
    \ and this work has become a new quality standard in formal theory. Already at\
    \ the end of the 20th century, the domestic mathematician AV Pogorelov proposed\
    \ his axiomatics of geometry, which was very successful and modern, so even the\
    \ question of introducing this variant of the formal theory as the main variant\
    \ in secondary education was considered. All these formal theories are different,\
    \ but the subject matter - a set of meaningfully true statements about the properties\
    \ of geometric objects - is one!\n\n66 More often the notion of consistency is\
    \ not used, and completeness is interpreted as equivalence of provability and\
    \ follows: F 1 , …, F n  G  F 1 , …, F n R \\_ G. \\_ We found it useful to\
    \ name and consider separately the two implications that make up this equivalence.\n\
    \n#### 4.1.2. First order predicate calculus language\n\nThe main tools of knowledge\
    \ representation considered in this chapter are the formulas of applied first-order\
    \ predicate calculus. Even David Hilbert pointed out that \"the calculus of first-order\
    \ predicates is sufficient in all reasonable cases\". Here we consider the predicate\
    \ calculus as a language, as a notation system for writing logical statements.\
    \ Furthermore, we believe that this language is familiar to the reader at the\
    \ level of concepts such as logical operators (\"AND\", \"OR\", \"IF ... THEN\"\
    ) and quantifiers (\"for all\", \"exists\"). [\\[64\\]](#part0005.xhtml#_ftn64).\n\
    \nWe consider a language that includes logic operations, quantifiers, and atomic\
    \ formulas built on a set of function symbols, object variables, and constants.\
    \ Below is the formal grammar of the first-order predicate calculus language.\
    \ The following distinguishable sets of symbols are taken as given: the set of\
    \ constant symbols (notation const ), the set of variable symbols (notation vari\
    \ ), the set of function symbols (notation func ) and the set of predicate symbols\
    \ (notation predicate ).\n\n| Expression:  || const | Change | Radio (Term List)\
    \ |\n\n| --- | --- |\n\n| Term list: ||  Therme | term, list of terms |\n\n| Atom:\
    \  || predicate | predicate (term list) |\n\n| Literally:  || Atom |  Atom |\n\
    \n| Formula:  || Atom |  ( formula ) | |\n\n|      || (Formula-Bundle-Formula)\
    \ | |\n\n|      || Perem quantifier (formula) |\n\n| Bundle up:  ||  |  |  \
    \  |\n\n| Quantifier: ||   |   |\n\nThe concept of a literal (atom or the negation\
    \ of an atom) is generally grammatically redundant. We introduced it to keep that\
    \ term handy. A predicate with no arguments is also redundant. We introduced it\
    \ to make the propositional calculus syntactically a special case of the predicate\
    \ calculus.\n\nA few remarks are necessary on the grammar of this language.\n\n\
    1.               First, in this language we think of our function and predicate\
    \ symbols as having fixed names and a fixed number of arguments, just like in\
    \ traditional programming systems. This is a fairly strong assumption and, in\
    \ principle, it cannot be looked at in that way. In this case we would have to\
    \ deal with  -expressions and mixed calculations, which is beyond the scope of\
    \ this course.\n\n2.               Second, the language we use is classified as\
    \ a first-order language in the logical hierarchy. In other words, this means\
    \ that only object variables can be put under quantifiers, ie no function symbols\
    \ and no predicates. Otherwise, i.e. if it is assumed that the quantifier cannot\
    \ only bind subject variables, it is not a first-order calculus. Such calculi\
    \ are used in real modern AI systems. For example, the model checking trend is\
    \ based on temporal logics that look like first-order logics, but are actually\
    \ reduced to standard non-first-order logics.\n\n3.               Third, the above\
    \ grammar of the predicate calculus assumes the formal writing of statements in\
    \ a certain syntax, with all the necessary brackets, etc. Of course, when considering\
    \ examples, we will greatly simplify the formal syntax and write formulas more\
    \ conveniently, but in such a way that one can always guess , which syntactic\
    \ simplifications are used in individual cases . In particular , the usual precedence\
    \ of connectors and quantifiers is used, additional parentheses are systematically\
    \ omitted.\n\n4.               Fourth, it is known that the pure first-order predicate\
    \ calculus has a limited expressiveness. In other words, many meaningful theories\
    \ are inexpressible or difficult to express in pure first-order calculi, extralogical\
    \ assumptions are required. Of course we allow constants, function symbols and\
    \ predicates that are needed to describe the subject area. That being said, however,\
    \ it is believed that natural numbers and other well-known concepts can be used\
    \ in any formula without attempting to describe axiomatically what they really\
    \ are.\n\n5.               Fifth, there are enough closed formulas and open formulas\
    \ cannot be considered, because if there is an open formula then it is satisfiable\
    \ if and only if the corresponding closure is satisfiable. Therefore, formulas\
    \ are written in open form, assuming that all free variables are closed by the\
    \ universal quantifier.\n\n#### 4.1.3. Offers\n\nIn 1965, John Alan Robinson proposed\
    \ the resolution method to prove the validity of logical formulas . The idea for\
    \ this method is based on the work of Herbrand, but since he did not think of\
    \ applying his method to computers (which was not surprising in 1930), Herbrand's\
    \ method was not very suitable from a computational point of view. Robinson made\
    \ it suitable for real-world applications and developed a unification algorithm\
    \ that forms the basis of the method.\n\nThe solving procedure is applicable to\
    \ logical calculi using formulas of a special form called theorems.\n\nSentence\
    \ (clause) is a quantifier-free disjunction of literals.\n\nAny formula for the\
    \ first-order predicate calculus can be reduced to theorems by successively applying\
    \ the following steps:\n\n1.              removing the implication. The implication\
    \ is replaced by a disjunction with the negation of the first operand. A  B \\\
    =  A  B \n\n2.              Pull out the negative. Negatives are left only in\
    \ front of atoms. It follows de Morgan's rules using the property of quantifiers\
    \ and the involutivity of negation.  ( A & B ) = (  A  B ),  ( A  B ) =\
    \ (  A &  B ),  x (A) =  x (  A),\n\n x ( A ) =  x (  A ),   A = A\n\
    \n3.              Separation of Related Variables . Bound variables are renamed\
    \ so that they don't accidentally match different quantifiers.  x (…  x (… x\
    \ …)…)=\n\n\\=  x (…  y (… y …)…) and similarly for all other combinations of\
    \ quantifiers.\n\n4.              Reduction to the preform . Convert a formula\
    \ so that it begins with a quantifier prefix, followed by a non-quantifier matrix.\
    \ A  x ( B ) =  x ( A  B ) and similarly for all other combinations of quantifiers\
    \ and connectors.\n\n5.              skolemization . Elimination of existential\
    \ quantifiers by introducing new function symbols and constants.  x ( A (… x\
    \ …)) = A (… a …),  x (  y ( A (… y …)))=  x ( A (… f ( x )…)), where a — a\
    \ new constant and f a new function symbol.\n\n6.              Elimination of\
    \ universal quantifiers . Since only closed formulas are considered, the remaining\
    \ universal quantifiers are omitted as they are implied.  x ( A (… x …)) = A\
    \ (… x …).\n\n7.              Reduction to conjunctive normal form . The main\
    \ operation in the conjunctive normal form is the conjunction, it connects groups\
    \ of disjunctions.\n\nA  ( B & C ) = ( A  B )&( B  C ).\n\n8.             \
    \ Breakdown into Sentences . The formula is broken down into many sentences. A\
    \ & B = A , B "
  fmt: "\n# 一种作为两千年典范的理论\n\n尽管从今天的观点来看，它构建得不够严谨和形式化。许多数学家试图改进欧几里得的构造。例如，罗巴切夫斯基导致了非欧几何的发现。一百多年前，大卫·希尔伯特撰写了《几何基础》，这部作品已成为形式理论的新质量标准。早在\
    \ 20 世纪末，国内数学家 A.V. 波戈列洛夫提出了他的几何公理化体系，该体系非常成功且现代，甚至曾考虑将这一形式理论变体作为中等教育的主要变体引入。所有这些形式理论各不相同，但研究对象——关于几何对象性质的有意义真命题的集合——是同一个！\n\
    \n## 4.1.2. 一阶谓词演算语言\n\n本章考虑的主要知识表示工具是应用一阶谓词演算的公式。即使是大卫·希尔伯特也指出：“一阶谓词演算在所有合理情况下都已足够”。这里我们将谓词演算视为一种语言，一种书写逻辑陈述的符号系统。此外，我们认为读者熟悉诸如逻辑算子（“AND”、“OR”、“IF\
    \ ... THEN”）和量词（“for all”、“exists”）等概念的层面上熟悉这种语言。[\\[64\\]](#part0005.xhtml#_ftn64)。\n\
    \n我们考虑一种包含逻辑运算、量词以及建立在函数符号集、对象变量和常量之上的原子公式的语言。下面是一阶谓词演算语言的形式文法。给定以下可区分的符号集：常量符号集（记作\
    \ `const`）、变量符号集（记作 `vari`）、函数符号集（记作 `func`）和谓词符号集（记作 `predicate`）。\n\n| 表达式 |\
    \ | `const` | 变更 | 单选按钮（项列表） |\n| --- | --- | --- | --- | --- |\n| 项列表 | | `Therme`\
    \ | `term`，项列表 |\n| 原子 | | `predicate` | `predicate(term list)` |\n| 字面量 | | `Atom`\
    \ | `¬ Atom` |\n| 公式 | | `Atom` | `¬ ( formula )` | |\n| | | `(Formula-Bundle-Formula)`\
    \ | |\n| | | `Perem quantifier (formula)` | |\n| 连接词 | | `∧` | `∨` | `→` |\n|\
    \ 量词 | | `∀` | `∃` |\n\n字面量（原子或原子的否定）的概念在语法上通常是冗余的。我们引入它是为了方便使用该术语。无参数的谓词也是冗余的。我们引入它是为了使命题演算在语法上成为谓词演算的一个特例。\n\
    \n关于该语言的语法，有几点说明必要：\n\n1.  **首先**，在这种语言中，我们认为函数符号和谓词符号具有固定的名称和固定数量的参数，就像在传统编程系统中一样。这是一个相当强的假设，原则上不能那样看待。在这种情况下，我们将不得不处理\
    \ `λ` 表达式和混合演算，这超出了本课程的范围。\n2.  **其次**，我们使用的语言在逻辑层级中被归类为一阶语言。换句话说，这意味着只有对象变量可以放在量词下，即没有函数符号和谓词。否则，即如果假设量词不仅能约束主体变量，那就不是一阶演算。这类演算用于现代真实的\
    \ AI 系统。例如，模型检验趋势基于看起来像一阶逻辑的时序逻辑，但实际归约为标准的非一阶逻辑。\n3.  **第三**，上述谓词演算语法假设按特定语法正式书写陈述，包含所有必要的括号等。当然，在考虑示例时，我们将极大地简化形式语法，更方便地书写公式，但方式应使人总能猜出个别情况下使用了哪些语法简化。特别是，使用了连接词和量词的常规优先级，系统地省略额外的括号。\n\
    4.  **第四**，众所周知，纯一阶谓词演算表达能力有限。换句话说，许多有意义的理论在纯一阶演算中无法表达或难以表达，需要逻辑外假设。当然，我们允许描述主题领域所需的常量、函数符号和谓词。也就是说，然而，人们认为自然数和其他众所周知的概念可以在任何公式中使用，而无需试图以公理化方式描述它们到底是什么。\n\
    5.  **第五**，有足够的封闭公式，开放公式不必考虑，因为如果存在开放公式，当且仅当相应的闭包可满足时，它才是可满足的。因此，公式以开放形式书写，假设所有自由变量都由全称量词封闭。\n\
    \n## 4.1.3. 子句\n\n1965 年，John Alan Robinson 提出了归结法来证明逻辑公式的有效性。该方法的思想基于赫布兰的工作，但由于他在\
    \ 1930 年未想到将其方法应用于计算机（这并不奇怪），赫布兰的方法从计算角度来看不太合适。Robinson 使其适用于实际应用，并开发了构成该方法基础的合一算法。\n\
    \n求解过程适用于使用称为定理的特殊形式公式的逻辑演算。\n\n**子句** 是字面量的无量词析取。\n\n一阶谓词演算的任何公式均可通过依次应用以下步骤归约为定理：\n\
    \n1.  **消除蕴含**。蕴含被替换为第一个操作数的否定的析取。`A → B = ¬A ∨ B`\n2.  **向内移动否定**。否定仅保留在原子前面。这遵循德摩根定律，利用量词的性质和否定的自反性。\n\
    \    ```\n    ¬(A & B) = (¬A ∨ ¬B)\n    ¬(A ∨ B) = (¬A & ¬B)\n    ¬∀x(A) = ∃x(¬A)\n\
    \    ¬∃x(A) = ∀x(¬A)\n    ¬¬A = A\n    ```\n3.  **分离关联变量**。重命名约束变量，使其不意外匹配不同的量词。`∀x(…\
    \ ∃x(… x …)…) = ∀x(… ∃y(… y …)…)`，以及所有其他量词组合的类似情况。\n4.  **归约为前束范式**。将公式转换为以量词前缀开头，后跟非量词矩阵的形式。`A\
    \ ∨ ∀x(B) = ∀x(A ∨ B)`，以及所有其他量词和连接词组合的类似情况。\n5.  **斯科莱姆化**。通过引入新的函数符号和常量来消除存在量词。`∃x(A(…\
    \ x …)) = A(… a …)`，`∀x(∃y(A(… y …))) = ∀x(A(… f(x)…))`，其中 `a` 是新常量，`f` 是新函数符号。\n\
    6.  **消除全称量词**。由于仅考虑封闭公式，剩余的全称量词作为隐含条件被省略。`∀x(A(… x …)) = A(… x …)`。\n7.  **归约为合取范式**。合取范式中的主要操作是合取，它连接析取组。`A\
    \ ∨ (B & C) = (A ∨ B) & (B ∨ C)`。\n8.  **分解为子句**。公式被分解为多个子句。`A & B = A, B`\n"
