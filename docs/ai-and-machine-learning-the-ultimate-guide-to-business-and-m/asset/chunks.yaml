- raw: "Recently, considerable attention has been focused on what is characterized\
    \ in its most general form as the problem of constructing an optimal route . Examples\
    \ of relevant application areas can be logistics (minimizing the transport time\
    \ of goods between warehouses) and administration movement Robot (in an environment\
    \ with restrictions and obstacles), strategic games and more. Search graphs for\
    \ such tasks are \"pretty decent\" - oriented monopartite digraphs - the node\
    \ of the graph is usually just a name (or a point in space usually with metric\
    \ and small dimensions), the density is low (far from all nodes are directly connected\
    \ to each other), the degree of a node d is always estimated by a bounded constant\
    \ (deg( d ) < const << n , where n is the number of graph nodes), which determines\
    \ the weight on the arc only the cost of moving from one node to another, the\
    \ source and destination nodes are uniquely determined. At the same time, it is\
    \ considered that the constructed part of the search graph necessary to solve\
    \ the problem can be placed entirely in the computer's \"fast\" (operational)\
    \ memory. The main problem addressed in this chapter is to construct an optimal\
    \ (resource minimizing) route from the source node to the destination node.\n\n\
    The chapter covers five algorithms:\n\n\\-                     general algorithm\
    \ for heuristic solution search for systems of heterogeneous production (section\
    \ 0);\n\n\\-                     formal properties of the historically first and\
    \ most\n\nknown search algorithm on the graph (section 0);\n\n\\-                    \
    \ a nice way to increase the efficiency and practicality of the general algorithm\
    \ for finding a solution (section error! link source not found. )\n\n\\-                    \
    \ an algorithm for searching on AND/OR graphs, which is a specialization of the\
    \ general algorithm that occurs, for example, when using decomposable production\
    \ systems (Section 0);\n\n\\-                     Search algorithms on game trees,\
    \ which on the one hand represent a further specialization of general algorithms,\
    \ since game trees are a special case of AND/OR graphs, and on the other hand\
    \ the most developed practical algorithms for real programs are discussed with\
    \ previous AI elements at the beginning of the chapter of classes (Section 0).\n\
    \nSuch a set of well-thought-out algorithms forms a system sufficient for the\
    \ reader, after reading the chapter, to confidently navigate in a sea of various\
    \ specific search algorithms - we have named the main beacons.\n\n### 3.1. HEURISTIC\
    \ SEARCH\n\nHistorically, one of the first and most well-known algorithms in AI\
    \ for finding optimal (in terms of total weight or length) paths in a search space\
    \ graph is the A\\* algorithm (read as \"A-star\" or \"A-star\". ). This algorithm\
    \ was first described in 1968 by Peter Hart, Nils Nilsson and Bertram Raphael\
    \ \\[18\\]. In their work it is referred to as \"Algorithm A\". In the classical\
    \ version, the A\\* algorithm is applicable in a discrete search space represented\
    \ by a search graph with charged arcs. This heuristic search sorts the nodes of\
    \ a graph by the value of a function that evaluates the length of the shortest\
    \ path that passes through a given node and goes from the start node to one of\
    \ the destination nodes. Thus , this algorithm combines consideration of the lengths\
    \ of optimal paths from the already explored part of the search graph from Dijkstra's\
    \ algorithm with the steepest descent heuristic [\\[45\\]](#part0005.xhtml#_ftn45)for\
    \ the as yet unexplored part of the graph .\n\n#### 3.1.1. General Algorithm\n\
    \nFor clarity of further presentation we repeat the definition of the search graph,\
    \ make some important remarks and write the general form of the search algorithm\
    \ on the graph.\n\nThe search graph is a directed graph G (V, E) in which the\
    \ node set V = { d | d \\_ D } is the set of possible states of the fact base\
    \ (in the sense of the previous chapter), and the set of arcs E is defined as\
    \ follows:\n\nE. \\= { d 1  d 2 | d 1 , d 2  D &  r  R ( rp ( d 1 ) & d2 \\\
    _ \\= rf ( d 1 ) } }.\n\nIn the case where the search graph is essentially finite,\
    \ it can be explicitly specified using the usual ways of representing graphs in\
    \ a computer. In such cases, the search graph is often chosen as the mechanism\
    \ for representing knowledge - marks on spirals are products, there is no need\
    \ to indicate a set of productions separately.\n\nIn the case of an infinite (or\
    \ very large) graph, we cannot use these simple representations simply because\
    \ the entire graph does not fit in the computer's memory. Instead, starting from\
    \ the initial state of the database d 0 , we generate a part of the search graph\
    \ using a finite set of rules R until either the allocated resources are exhausted\
    \ or the generated part contains the target state of the database dt . \\_ Thus,\
    \ an implicit (implicit) representation of the graph in the computer is used.\
    \ A graph can be specified implicitly using the node expansion operation.\n\n\
    each rule has r costs associated with its application, denoted by r . w and named\
    \ the cost or weight ( weight ) of applying the rule. In this case, each arc in\
    \ the search chart has a weight. In other words, the arcs are loaded, and the\
    \ loading value can be taken as positive: r \\= ( p , f , w ), w \\> 0.\n\nThe\
    \ cost of a path in a graph is defined as the sum of the costs of its arcs. The\
    \ general graph search algorithm, which computes the cost of paths from the initial\
    \ node and (under certain conditions!) determines the minimum-cost path [\\[46\\\
    ]](#part0005.xhtml#_ftn46), is as follows.\n\nAlgorithm error ! The text of the\
    \ specified style does not exist in the document. .9. General search algorithm\
    \ in a diagram.\n\nGS (d0, R , t )\n\n O := {d0}; g(d0) := 0\n\n C :=  ; P(d0)\
    \ := zero  while Is correct do                  d := select (O)\n\n  when d =\
    \ zero then Return ( Fail ) end if                              if t(d) then return\
    \ ( OK ) end if \n\n Open (d) end while \n\nEnd perc  \n\n proc Open (d) for r\
    \  R do   if rp(d) then {rule holds}               d' := rf(d) c' := g(d)+rc\n\
    \n   if d'  O  d'  C then {old node}                               if c' <\
    \ g(d') then {better way}\n\n g(d') := c' P(d') := d end if \n\n   else {new node}\n\
    \nO := O+{d'} g(d') := c' P(d') := d end if   End if End for O := O - {d} C :=\
    \ C + {d} end perc where O is the list of \"open\" nodes, C is the list of \"\
    closed\" nodes (see Fig.\n\nParagraph 2.2.4).\n\nIn addition to the usual parameters\
    \ and the lists of open and closed nodes already discussed, the method uses two\
    \ other data structures. The first of these is g ( d ) - the length of the shortest\
    \ path from d 0 to d of those explored so far. Note that g ( d 0 ) = 0, for other\
    \ nodes at the beginning of the work g ( d ) is unknown, and as the algorithm\
    \ runs, the value of g ( d ) for a given node d can only decrease.\n\nP ( d )\
    \ deserves a special discussion - this structure stores for node d the previous\
    \ node on the found shortest path from d 0 to d . This technique allows to effectively\
    \ store the set of paths leading from node d 0 to all examined nodes at once.\n\
    \nThis graph search algorithm has two functions - Select and Open . Informally\
    \ speaking, the first of them is “search” and the second is “on the graph”.\n\n\
    The Select function somehow determines the next node to expand. If the Select\
    \ (O) function works according to the FIFO principle (First In First Out), that\
    \ is, if the list O is a queue, then a breadth-first search is performed. This\
    \ method ensures that a path to the destination node is found if such a path exists.\
    \ If the Select (O) function works according to the LIFO principle (Last In First\
    \ Out), that is, if the list O is a stack, then a depth-first search is performed;\
    \ this method is similar to a backtracking search, but not only the current path\
    \ is saved, but all paths visited."
  fmt: "\n# Heuristic Search and Optimal Route Construction\n\nRecently, considerable\
    \ attention has been focused on the problem of constructing an optimal route in\
    \ its most general form. Examples of relevant application areas include logistics\
    \ (minimizing the transport time of goods between warehouses), administration\
    \ movement robots (in environments with restrictions and obstacles), and strategic\
    \ games.\n\nSearch graphs for such tasks are \"pretty decent\"—oriented monopartite\
    \ digraphs where:\n- The node is usually just a name (or a point in space, usually\
    \ with metric and small dimensions)\n- The density is low (far from all nodes\
    \ are directly connected to each other)\n- The degree of a node `d` is always\
    \ estimated by a bounded constant (`deg(d) < const << n`, where `n` is the number\
    \ of graph nodes)\n- The weight on the arc is determined only by the cost of moving\
    \ from one node to another\n- The source and destination nodes are uniquely determined\n\
    \nIt is assumed that the constructed part of the search graph necessary to solve\
    \ the problem can be placed entirely in the computer's \"fast\" (operational)\
    \ memory. The main problem addressed in this chapter is to construct an optimal\
    \ (resource-minimizing) route from the source node to the destination node.\n\n\
    ## Chapter Coverage\n\nThe chapter covers five algorithms:\n\n1. General algorithm\
    \ for heuristic solution search for systems of heterogeneous production (Section\
    \ 3.1)\n2. Formal properties of the historically first and most known search algorithm\
    \ on the graph (Section 3.1.1)\n3. A method to increase the efficiency and practicality\
    \ of the general algorithm for finding a solution (Section 3.1.2)\n4. An algorithm\
    \ for searching on AND/OR graphs, a specialization of the general algorithm occurring\
    \ when using decomposable production systems (Section 3.2)\n5. Search algorithms\
    \ on game trees, a further specialization of general algorithms since game trees\
    \ are a special case of AND/OR graphs, covering the most developed practical algorithms\
    \ for real programs (Section 3.3)\n\nSuch a set of well-thought-out algorithms\
    \ forms a system sufficient for the reader to confidently navigate various specific\
    \ search algorithms—we have named the main beacons.\n\n## 3.1. HEURISTIC SEARCH\n\
    \nHistorically, one of the first and most well-known algorithms in AI for finding\
    \ optimal (in terms of total weight or length) paths in a search space graph is\
    \ the `A*` algorithm (read as \"A-star\"). This algorithm was first described\
    \ in 1968 by Peter Hart, Nils Nilsson, and Bertram Raphael [18]. In their work,\
    \ it is referred to as \"Algorithm A\". In the classical version, the `A*` algorithm\
    \ is applicable in a discrete search space represented by a search graph with\
    \ charged arcs. This heuristic search sorts the nodes of a graph by the value\
    \ of a function that evaluates the length of the shortest path passing through\
    \ a given node from the start node to one of the destination nodes. Thus, this\
    \ algorithm combines consideration of the lengths of optimal paths from the already\
    \ explored part of the search graph (from Dijkstra's algorithm) with the steepest\
    \ descent heuristic [45] for the as-yet-unexplored part of the graph.\n\n### 3.1.1.\
    \ General Algorithm\n\nFor clarity, we repeat the definition of the search graph,\
    \ make some important remarks, and write the general form of the search algorithm\
    \ on the graph.\n\nThe search graph is a directed graph `G(V, E)` in which the\
    \ node set `V = { d | d ∈ D }` is the set of possible states of the fact base\
    \ (in the sense of the previous chapter), and the set of arcs `E` is defined as\
    \ follows:\n\n```\nE = { d1 → d2 | d1, d2 ∈ D & ∃ r ∈ R ( rp(d1) & d2 = rf(d1)\
    \ ) }\n```\n\nIn the case where the search graph is essentially finite, it can\
    \ be explicitly specified using the usual ways of representing graphs in a computer.\
    \ In such cases, the search graph is often chosen as the mechanism for representing\
    \ knowledge—marks on spirals are products, there is no need to indicate a set\
    \ of productions separately.\n\nIn the case of an infinite (or very large) graph,\
    \ we cannot use these simple representations because the entire graph does not\
    \ fit in the computer's memory. Instead, starting from the initial state of the\
    \ database `d0`, we generate a part of the search graph using a finite set of\
    \ rules `R` until either the allocated resources are exhausted or the generated\
    \ part contains the target state of the database `dt`. Thus, an implicit representation\
    \ of the graph in the computer is used. A graph can be specified implicitly using\
    \ the node expansion operation.\n\nEach rule `r` has costs associated with its\
    \ application, denoted by `r.w` and named the cost or weight of applying the rule.\
    \ In this case, each arc in the search chart has a weight. In other words, the\
    \ arcs are loaded, and the loading value can be taken as positive: `r = (p, f,\
    \ w), w > 0`.\n\nThe cost of a path in a graph is defined as the sum of the costs\
    \ of its arcs. The general graph search algorithm, which computes the cost of\
    \ paths from the initial node and (under certain conditions!) determines the minimum-cost\
    \ path [46], is as follows.\n\n**Algorithm 3.9. General search algorithm in a\
    \ diagram.**\n\n```\nGS(d0, R, t)\n    O := {d0}; g(d0) := 0\n    C := ∅; P(d0)\
    \ := zero\n    while true do\n        d := select(O)\n        if d = zero then\
    \ return (Fail) end if\n        if t(d) then return (OK) end if\n        Open(d)\n\
    \    end while\n\nproc Open(d)\n    for r ∈ R do\n        if rp(d) then {rule\
    \ holds}\n            d' := rf(d)\n            c' := g(d) + r.w\n            if\
    \ d' ∈ O ∨ d' ∈ C then {old node}\n                if c' < g(d') then {better\
    \ way}\n                    g(d') := c'\n                    P(d') := d\n    \
    \            end if\n            else {new node}\n                O := O ∪ {d'}\n\
    \                g(d') := c'\n                P(d') := d\n            end if\n\
    \        end if\n    end for\n    O := O - {d}\n    C := C ∪ {d}\nend proc\n```\n\
    \nWhere `O` is the list of \"open\" nodes, `C` is the list of \"closed\" nodes\
    \ (see Figure 2.2.4).\n\nIn addition to the usual parameters and the lists of\
    \ open and closed nodes already discussed, the method uses two other data structures.\
    \ The first is `g(d)`—the length of the shortest path from `d0` to `d` of those\
    \ explored so far. Note that `g(d0) = 0`; for other nodes at the beginning of\
    \ the work `g(d)` is unknown, and as the algorithm runs, the value of `g(d)` for\
    \ a given node `d` can only decrease.\n\n`P(d)` deserves special discussion—this\
    \ structure stores for node `d` the previous node on the found shortest path from\
    \ `d0` to `d`. This technique allows effective storage of the set of paths leading\
    \ from node `d0` to all examined nodes at once.\n\nThis graph search algorithm\
    \ has two functions: `Select` and `Open`. Informally speaking, the first is \"\
    search\" and the second is \"on the graph\".\n\nThe `Select` function somehow\
    \ determines the next node to expand. If the `Select(O)` function works according\
    \ to the FIFO principle (First In First Out)—that is, if the list `O` is a queue—then\
    \ a breadth-first search is performed. This method ensures that a path to the\
    \ destination node is found if such a path exists. If the `Select(O)` function\
    \ works according to the LIFO principle (Last In First Out)—that is, if the list\
    \ `O` is a stack—then a depth-first search is performed; this method is similar\
    \ to a backtracking search, but not only the current path is saved, but all paths\
    \ visited.\n"
  trans: "\n# 启发式搜索与最优路径构建\n\n近来，人们将相当多的关注集中在以其最一般形式构建最优路径的问题上。相关应用领域的例子包括物流（最小化仓库间货物运输时间）、管理移动机器人（在有限制和障碍物的环境中）以及策略游戏。\n\
    \n此类任务的搜索图相当“体面”——有向单部有向图，其中：\n- 节点通常只是一个名称（或空间中的一个点，通常带有度量且维度较小）\n- 密度低（远非所有节点都直接相连）\n\
    - 节点 `d` 的度始终由一个有界常数估计（`deg(d) < const << n`，其中 `n` 是图的节点数）\n- 弧上的权重仅由从一个节点移动到另一个节点的成本决定\n\
    - 源节点和目标节点被唯一确定\n\n假设为解决问题所需的搜索图构建部分可以完全放入计算机的“快速”（运行）内存中。本章解决的主要问题是从源节点到目标节点构建一条最优（资源最小化）路径。\n\
    \n## 章节覆盖范围\n\n本章涵盖五种算法：\n\n1. 异构生产系统启发式解搜索的通用算法（第 3.1 节）\n2. 图上历史上第一个且最著名的搜索算法的形式化性质（第\
    \ 3.1.1 节）\n3. 提高寻找解的通用算法效率和实用性的方法（第 3.1.2 节）\n4. AND/OR 图上的搜索算法，即使用可分解生产系统时出现的通用算法的一个特化（第\
    \ 3.2 节）\n5. 游戏树上的搜索算法，即通用算法的进一步特化，因为游戏树是 AND/OR 图的一种特殊情况，涵盖了用于实际程序的最发达的实用算法（第\
    \ 3.3 节）\n\n这样一组经过深思熟虑的算法，构成了一个足以让读者自信驾驭各种具体搜索算法的体系——我们称之为主要信标。\n\n## 3.1. 启发式搜索\n\
    \n历史上，AI 中用于在搜索空间图中寻找最优（就总权重或长度而言）路径的第一个且最著名的算法之一是 `A*` 算法（读作“A-star”）。该算法最早由\
    \ Peter Hart、Nils Nilsson 和 Bertram Raphael 于 1968 年描述 [18]。在他们的著作中，它被称为“算法 A”。在经典版本中，`A*`\
    \ 算法适用于由带权弧的搜索图表示的离散搜索空间。这种启发式搜索按函数值对图的节点进行排序，该函数评估从起始节点经给定节点到达某个目标节点的最短路径长度。因此，该算法将已探索部分搜索图中的最优路径长度考量（来自\
    \ Dijkstra 算法）与针对尚未探索部分图的最速下降启发式 [45] 相结合。\n\n### 3.1.1. 通用算法\n\n为清晰起见，我们重述搜索图的定义，做一些重要备注，并写出图上搜索算法的通用形式。\n\
    \n搜索图是一个有向图 `G(V, E)`，其中节点集 `V = { d | d ∈ D }` 是事实库可能状态的集合（按前一章的含义），弧集 `E` 定义如下：\n\
    \n```\nE = { d1 → d2 | d1, d2 ∈ D & ∃ r ∈ R ( rp(d1) & d2 = rf(d1) ) }\n```\n\n\
    在搜索图本质上是有限的情况下，可以使用在计算机中表示图的常规方式显式指定它。在这种情况下，搜索图常被选作知识表示机制——螺旋上的标记是产物，无需单独指示产生式集合。\n\
    \n在无限（或非常大）图的情况下，我们不能使用这些简单表示，因为整个图无法放入计算机内存。取而代之的是，从数据库的初始状态 `d0` 开始，使用有限规则集\
    \ `R` 生成搜索图的一部分，直到耗尽分配的资源，或生成的部分包含数据库的目标状态 `dt`。因此，使用了图在计算机中的隐式表示。图可以使用节点扩展操作隐式指定。\n\
    \n每条规则 `r` 都有与其应用相关的成本，用 `r.w` 表示，称为应用规则的成本或权重。在这种情况下，搜索图中的每条弧都有权重。换句话说，弧被加载，且加载值可取为正：`r\
    \ = (p, f, w), w > 0`。\n\n图中路径的成本定义为其弧成本之和。计算从初始节点出发的路径成本，并在（特定条件下！）确定最小成本路径的通用图搜索算法如下。\n\
    \n**算法 3.9. 图中通用搜索算法。**\n\n```\nGS(d0, R, t)\n    O := {d0}; g(d0) := 0\n    C\
    \ := ∅; P(d0) := zero\n    while true do\n        d := select(O)\n        if d\
    \ = zero then return (Fail) end if\n        if t(d) then return (OK) end if\n\
    \        Open(d)\n    end while\n\nproc Open(d)\n    for r ∈ R do\n        if\
    \ rp(d) then {rule holds}\n            d' := rf(d)\n            c' := g(d) + r.w\n\
    \            if d' ∈ O ∨ d' ∈ C then {old node}\n                if c' < g(d')\
    \ then {better way}\n                    g(d') := c'\n                    P(d')\
    \ := d\n                end if\n            else {new node}\n                O\
    \ := O ∪ {d'}\n                g(d') := c'\n                P(d') := d\n     \
    \       end if\n        end if\n    end for\n    O := O - {d}\n    C := C ∪ {d}\n\
    end proc\n```\n\n其中 `O` 是“开放”节点列表，`C` 是“关闭”节点列表（见图 2.2.4）。\n\n除了已讨论的常用参数和开放/关闭节点列表外，该方法还使用两个其他数据结构。第一个是\
    \ `g(d)`——迄今探索到的从 `d0` 到 `d` 的最短路径长度。注意 `g(d0) = 0`；对其他节点，工作开始时 `g(d)` 未知，且随着算法运行，给定节点\
    \ `d` 的 `g(d)` 值只能减小。\n\n`P(d)` 值得专门讨论——该结构为节点 `d` 存储从 `d0` 到 `d` 的已找到最短路径上的前驱节点。此技术允许有效存储从节点\
    \ `d0` 通向所有已检查节点的路径集合。\n\n该图搜索算法有两个函数：`Select` 和 `Open`。非正式地说，前者是“搜索”，后者是“在图上”。\n\
    \n`Select` 函数以某种方式确定下一个要扩展的节点。如果 `Select(O)` 函数按 FIFO 原则（先进先出）工作——即列表 `O` 是一个队列——则执行广度优先搜索。如果存在到目标节点的路径，此方法保证能找到。如果\
    \ `Select(O)` 函数按 LIFO 原则（后进先出）工作——即列表 `O` 是一个栈——则执行深度优先搜索；此方法类似于回溯搜索，但不仅保存当前路径，还保存所有已访问路径。\n"
