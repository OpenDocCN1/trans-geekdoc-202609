  fmt: "\n# 经典合一算法\n\n我们介绍 Robinson 提出的经典合一算法（算法 4.1），采用了某种简化的表述形式。我们立即指出，该算法远非目前已知最高效的算法。算法的输入是两个以前缀（函数）形式书写的表达式\
    \ `A` 和 `B`，输出为 `false`（若表达式不可合一），或值为 `true` 且输出 `NOU σ`。\n\n**算法 4.1 两个公式的合一。**\n\
    \n```\nproc Unify ( in A, B; out σ ): boolean\n\n  σ := ∅\n  while doing A ≠ B\n\
    \    [A', B'] := FirstNeqTerms(A, B)\n    if ¬ IsSubst(A', B', t, v) then back\
    \ ( wrong ) End if\n    σ := σ° {t//v}\n    A := Subst(A, t, v)\n    B := Subst(B,\
    \ t, v)\n  end while\n  return ( true )\nend proc\n```\n\n该算法使用以下函数和操作。\n\n1.\
    \  **`FirstNeqTerms` 函数**：从左向右比较其参数，找出被比较公式中第一个不同的子公式。例如，比较公式 `P(x, f(a))` 和 `P(g(b),\
    \ y)` 时，`FirstNeqTerms` 函数返回对 `[x, g(b)]`。\n2.  **`IsSubst(A', B', t, v)` 函数**：检查第一个参数对\
    \ `A'` 和 `B'` 是否构成有效替换，即这两个参数中是否有一个是变量 `v`，而另一个是不包含该变量 `v` 的公式 `t`。例如，若函数的第一、二个参数分别为\
    \ `x` 和 `g(b)`，则函数返回 `true`，第三个参数 `t` 设为 `g(b)`，第四个参数 `v` 设为 `x`。\n3.  **`Subst(A,\
    \ t, v)` 函数**：在公式 `A` 中用公式 `t` 替换变量 `v` 的所有出现。例如，若函数参数为 `P(x, f(a))`、`g(b)`、`x`，则函数结果为公式\
    \ `P(g(b), f(a))`。\n4.  **运算 `°`**：替换的复合。其执行过程为：将右侧参数的所有替换应用于左侧参数的所有替换公式，随后合并替换集合，并移除匹配项与平凡替换。\n\
    \n让我们通过一个例子来考察——算法 4.1 对公式对 `P(a, x, f(g(y)))` 和 `P(z, f(z), f(u))` 的运行协议。在该例子中，每行写出变量\
    \ `A` 和 `B` 的当前值，`FirstNeqTerms` 函数找到的不匹配子公式以下划线标出。构造出的合一子写在右侧。\n\n```\nP(a, x,\
    \ f(g(y)))  P(z, f(z), f(u))        σ = { a // z }\nP(a, x, f(g(y)))  P(a, f(a),\
    \ f(u))        σ = { a // z, f(a) // x }\nP(a, f(a), f(g(y))) P(a, f(a), f(u))\
    \      σ = { a // z, f(a) // x, g(y) // u }\nP(a, f(a), f(g(y))) P(a, f(a), f(g(y)))\n\
    ```\n\n我们看到，算法仅在四步内就绪，并找到了最一般合一子。然而，不应因此认为合一任务是容易的。事实上，该算法中使用的所有“基本”操作——寻找不匹配子公式、检查替换的可采纳性、执行替换，甚至计算替换的复合——在实现上绝非基本操作，其实际复杂度在很大程度上取决于公式的选定表示方法。同时，算法\
    \ 4.1 的公式表示是未定义的。\n\n考虑另一种合一算法，其中公式结构被更显式地固定。关于所考虑的归结法，我们需要检查原子公式的合一，其句法在段落 0\
    \ 中描述。为不遮蔽算法思想，我们在语言中仅保留函数符号和变量 [[66]](#part0005.xhtml#_ftn66)。\n\n算法 4.2 假设 `op`\
    \ 函数分析公式并返回主运算符号（谓词名、函数符号或变量名），`var` 函数检查其参数是否为变量名，`args` 函数返回主运算的参数列表。替换集（合一子）表示为全局数组\
    \ `S`，其索引值为变量名，元素值为替换相应变量的公式。\n\n算法 4.2 基于以下思想。用公式替换变量的任何替换都保持公式的主运算（谓词或函数符号）不变。因此，若公式的主运算不同，则公式必定不可合一。否则，即主运算匹配时，公式可合一当且仅当作为主运算参数的所有子公式都可合一。当匹配达到变量时，该递归结束。变量可与任何不包含该变量的公式（特别地，与另一变量）合一，只需用该公式替换该变量即可。但变量所有出现处的替换必须一致。\n\
    \n**算法 4.2 两个公式的递归合一。**\n\n```\nproc Unify ( in A, B): bool\n\n  a := f(A); b\
    \ := f(B)\n\n  // 两个公式均为变量\n  if var(a) & var(b) then\n    if a = b then return\
    \ Is correct End if\n    if S[a] = ∅ & S[b] ≠ ∅ then S[a] := S[b]; return Is correct\
    \ End if\n    if S[b] = ∅ & S[a] ≠ ∅ then S[b] := S[a]; return true end if\n \
    \   if S[a] ≠ ∅ & S[b] ≠ ∅ then Unify(S[a], S[b]) end if\n    S[a] := b // 或 S[b]\
    \ := a\n  end if\n\n  // 一个公式是变量，另一个不是\n  if var(a) ∨ var(b) then\n    if var(a)\
    \ & a ∈ B then return NOT CORRECT different End if\n    if S[a] = ∅ then S[a]\
    \ := B; return Is correct End if\n    different return (S[a] = B)\n  End if\n\n\
    \  if var(b) & b ∈ A then return NOT CORRECT different End if\n  if S[b] = ∅ then\
    \ S[b] := A; return Is correct End if\n  else return (S[b] = A) End if\n  End\
    \ if\n\n  // 两个公式都不是变量\n  if a ≠ b then return false end if\n\n  // 主运算不同\n  for\
    \ a ∈ args(A) || b ∈ args(B) do\n    if ¬ Unify(a, b) then returns false tail\
    \ if\n  end for\n  return Is correct\nend process\n```\n\n在该算法中，循环头 `for a ∈ args(A)\
    \ || b ∈ args(B) do` 表示对参数列表的并行循环。\n\n## 4.1.6 归结法反驳\n\n根据归结法的证明过程实质上是一个反驳过程，即不证明公式的有效性，而是证明其否定在很大程度上是矛盾的，采用这种方法是出于“技术方便”的考虑。这是一个典型的反证法方案。让我们证明一个定理，证明该方案在命题演算情况下的正确性。\n\
    \n**定理**。若 `A, ¬G ⊢ F`，其中 `F` 是矛盾，则 `A ⊢ G`。\n\n**证明**。根据演绎定理 [[67]](#part0005.xhtml#_ftn67)，若\
    \ `A, ¬G ⊢ F`，则 `⊢ A ∧ ¬G → F`，即 `A ∧ ¬G → F` 是重言式。但 `A ∧ ¬G → F = ¬(A ∧ ¬G) ∨\
    \ F = ¬A ∨ G = A → G`。所以 `A → G` 是重言式且 `⊢ A → G`，再次使用演绎定理，得到 `A ⊢ G`。\n\nQ.E.D.\n\
    \n由于我们考虑的是析取范式，空析取必须视为恒假。因此，使用不包含任何析取项的空析取作为上述定理中提到的不可满足公式 `F` 是方便的。这在归结法中是传统做法，空析取传统上用\
    \ `ο` 表示。\n\n**推论**。若 `A, ¬G ⊢ ο`，其中 `ο` 为空公式，则 `A ⊢ G`。\n\n由此我们可以给出归结法的定义。\n"
