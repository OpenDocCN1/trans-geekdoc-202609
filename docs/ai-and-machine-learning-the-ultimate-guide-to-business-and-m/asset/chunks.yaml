    \n[CONCLUSION](#part0005.xhtml#_Toc106281025)\n\n## INTRODUCTION\n\nYou could\
    \ call this book \"Artificial Intelligence = Knowledge Representation + Solution\
    \ Search Methods\". The allusion to Niklaus Wirth's book Algorithms + Data Structures\
    \ = Programs \\[1\\] is intentional. Because of our upbringing, accumulated experience,\
    \ and innate preferences, we sincerely adhere to the ideology of pioneers and\
    \ founders like Wirth and others, we often quote them and retell them a lot.\n\
    \nThe choice of material for the handbook is quite traditional, one might say\
    \ classic, but the manner of presentation is entirely that of the author. First\
    \ of all, we put applied aspects first, i.e. solving meaningful problems on the\
    \ computer using methods of artificial intelligence, and as an answer to the question\
    \ \"can a machine think?\". dismiss with a laugh. Theory without practice strikes\
    \ us as boring scholasticism, and we avoid it. Second, we believe that studying\
    \ the ways of representing \"human\" knowledge in a computer is currently much\
    \ more relevant than improving \"machine\" algorithms for finding solutions, which\
    \ have been prioritized for the past half-century. That is why we pay the greatest\
    \ attention to the representation of knowledge. Third, we prefer explanations\
    \ through examples and short programs to the all-too-dominant scientific imagery\
    \ in this area. We believe that presenting the text of a program that solves a\
    \ problem is often more convincing than introducing numbered definitions and proving\
    \ \"mathematical\" theorems.\n\nThe material of the book focuses on the answer\
    \ to the question: how to express a person's knowledge and skills in the form\
    \ of a program for a computer. Before answering this technical question, it is\
    \ appropriate to answer the ideological question: Why? Why represent knowledge\
    \ in a computer? Our answer is simple: recently it has become inexpensive. Also,\
    \ it's quite difficult, so it's just extremely interesting.\n\nCurrent trends\
    \ in the use of computers are characterized by the increasing importance of artificial\
    \ intelligence (AI) methods in software. You could say it's a continuous process.\n\
    \n\"Intellectualization of Computers\" [\\[1\\]](#part0005.xhtml#_ftn1). We have\
    \ in mind the following undoubted trend: computers were \"big calculating machines\"\
    \ at the beginning of their development, and now the root calculator in the word\
    \ computer is already an anachronism. A modern computer is an information machine\
    \ that processes knowledge presented in the form of data. This trend is represented\
    \ by the histogram for Error! Source not found. , in which we showed the relationship\
    \ between the computational resources used for technical computation and for knowledge\
    \ processing today and half a century ago. Engineering computing is a collective\
    \ term for applications such as rocket flight calculations, payroll, etc., and\
    \ knowledge processing is Internet information retrieval, telecommunications,\
    \ etc. [\\[2\\]](#part0005.xhtml#_ftn2)Note that the numeric values of the percentages\
    \ and the scale in this figure are rather arbitrary. In fact, the computing power\
    \ available to mankind has increased more than 10 10 times in half a century,\
    \ rather than four times as in Number. The growth rate of computing resources\
    \ is beyond our imagination; mankind has never experienced anything like this\
    \ before. An ever-increasing portion of this rapidly growing power is being expended\
    \ on knowledge processing!\n\n![](Images/image00324.jpeg)\n\nRice. 0.1 Reallocation\
    \ of computing resources over time\n\nFrom the very beginning, the direction of\
    \ artificial intelligence in computer science has aroused great, even unhealthy\
    \ interest. Unscrupulous journalists, greedy for sensations, exaggerated the timid\
    \ offspring of new ideas and raised unreasonably high public expectations, and\
    \ when the first theoretical results did not justify inflated expectations, the\
    \ same journalists took part in booing the ideas of artificial intelligence. But\
    \ in the 21st century the situation has changed. Recently, the results obtained\
    \ in this direction have outgrown the framework of academic experimental developments\
    \ and have begun to be applied in practical applications. Artificial intelligence\
    \ systems have meaningful uses in real life, from medical diagnostics to spacecraft\
    \ control; this can be treated however you like, but it is impossible to deny.\
    \ For this reason, the courses \"Methods of Knowledge Processing\", \"Applied\
    \ Artificial Intelligence\" etc. have become practically obligatory in the curricula\
    \ for the training of computer scientists.\n\nApplied mathematics engineers and\
    \ computer scientists working in science-intensive application areas must master\
    \ the basic, well-established methods for solving enumeration problems developed\
    \ in artificial intelligence research.\n\nIt should be emphasized that the essential\
    \ formalisms of these methods for knowledge transfer in computers play a decisive\
    \ role for the practical applicability of methods for solving enumeration problems.\
    \ Methods of knowledge representation are therefore the core of the direction\
    \ of artificial intelligence. This core, indispensable for both novice and experienced\
    \ engineers, is the subject of the book.\n\nWe expect students taking this course\
    \ to achieve the following outcomes.\n\n1.               Knowledge of the most\
    \ important methods for solving algorithmically complex problems; knowledge of\
    \ the comparative advantages and disadvantages of these methods; Knowledge of\
    \ the basic principles of the most well-known methods of knowledge representation:\
    \ production rules, predicate calculus formulas, semantic networks.\n\n2.              \
    \ The ability to choose the appropriate way of representing knowledge for a given\
    \ task in simple cases; the ability to assess the appropriateness of applying\
    \ one or another method of finding a solution to a particular problem."
