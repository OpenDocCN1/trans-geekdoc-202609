    # 4.1. 决策方法


    本章材料主要基于数理逻辑，假设读者熟悉其基本概念。然而，所有必要的定义和一些定理在前几节中简要重述。不过，我们要提醒读者，本章绝非一本简明的数理逻辑教科书。形式数理逻辑中许多重要、有趣且技术复杂的定理和概念，要么被省略，要么未加证明，要么以简化形式给出。原因在于，在本章中，我们将数理逻辑及其主要对象——逻辑演算——根本不视为目的，而仅视为在计算机中表示知识的一种手段。我们在本章中对待数理逻辑这门精深学问的态度极其务实：我们只是直接使用现成的语言和工具，而不考虑人类为此付出的代价。当然，逻辑演算在
    AI 中的应用仅通过具体例子加以考虑。正文中的形式构造保持在最低限度。需要形式构造的读者请参考经典教科书 [19]。


    ## 4.1.1. 形式理论


    历史上，形式理论的概念是在数学基础研究的高峰期发展起来的，目的是将逻辑本身和证明理论形式化。杰出的德国数学家大卫·希尔伯特对形式理论工具的形成和发展做出了巨大的、或许是关键性的贡献。如今，这一工具被广泛用于创建特定演算，以解决
    AI 领域的具体应用问题。大卫·希尔伯特曾写道：“证明论……给我们一种崇高的信念，即至少数学思维是无界的，并能追寻其自身思想的规律……”。


    我们下面使用的谓词演算是形式理论的一个例子，因此我们从形式理论的一般概念简述入手。


    形式理论是一种具有以下四个必要组成部分的结构：


    - 符号集 `A`，构成形式理论的字母表；

    - 字母表 `A` 上的单词集 `F`，`F ⊆ A*`，称为该理论的公式；

    - 公式的子集 `B`，`B ⊆ F`，称为形式理论的公理；

    - 公式集上的关系集 `R`，`R ⊆ F^(n+1)`，称为形式理论的推理规则。


    符号集 `A` 可以是有限的，也可以是无限的（可数）。通常使用有限的字母集来形成符号，符号可以被赋予自然数作为索引。


    公式集 `F` 通常由归纳定义给出，例如使用生成形式文法。该集合通常是无限的。除了“公式”一词外，也可以使用“建议”一词。符合严格定义的句子有时称为合式公式，以区别于来自
    `A` 的任意字符组合（简单句子或字符串）。在某些形式理论中，合式句子的地位可能取决于上下文或外部环境。在下文中，除非另有说明，公式是指所考虑形式理论的合式公式。


    集合 `A` 和 `F` 共同定义了一种语言或形式理论签名，传统上表示为 `Σ = (A, F)`。


    公理集 `B` 可以是有限的，也可以是无限的（但可数）。当公理集是无限时，通常使用有限的公理模式集和从公理模式生成特定公理的规则来指定。从公理模式生成特定公理最常用的规则是代换规则。


    举一个解释性的例子。教科书 [19] 指出（我们引用时略有删节，并采用本书使用的符号）：“无论公式 `A`、`B` 和 `C` 为何，以下公式均为公理：


    (A1) `(A → (B → A))`


    (A2) `((A → (B → C)) → ((A → B) → (A → C)))`


    (A3) `((¬B → ¬A) → ((¬B → A) → B))`”


    其含义如下。设所考虑形式理论的字母表包含小写拉丁字母、连接词 `¬` 和 `→` 以及括号 `(` 和 `)`，而不包含大写拉丁字母。那么，用名称 (A1)、(A2)
    和 (A3) 表示的书写表达式，严格来说，并非形式理论的公式，因此不能成为公理。这些正是公理模式。可以用任意公式代换参数 `A`、`B` 和 `C`，同一参数的所有出现处必须代换同一公式，由此产生的表达式（注：这是命题演算）已是该形式理论的公式，即被宣布为公理。特别地，如果在模式
    A1 中用公式 `(b → a)` 代换参数 `A`，用公式 `a` 代换参数 `B`，（简记为：`{(b → a)//A, a//B}`），则得到公式 `((b
    → a) → (a → (b → a)))`，它是合式公式，也是命题演算的公理。如果对同一模式 A1 应用代换 `{(a → a)//A, a//B}`，则得到公式
    `((a → a) → (a → (a → a)))`，它也是命题演算的公理。命题演算的公理集是无限的，尽管它仅能由三个公理模式给出。


    对于应用理论，公理常分为两类：


    - **逻辑公理**，直接借用自基础形式理论（在我们的情况下是一阶谓词演算）；

    - **非逻辑公理**（也称为技术公理或专有公理），反映特定应用领域的应用细节和内容。


    再引入两个与公式和公理相关的概念。


    如果存在一个算法，根据所呈现的理论公式（理论字母表的字符串），能在有限时间内判断该字符串是否属于合式公式类，则该理论称为**可判定的**。


    如果此外，时间还受公式长度的多项式限制，则该理论称为**有效可识别的**。


    如果存在一个算法，根据所呈现的公式，能在有限时间内判断该公式是否属于公理集，则该形式理论称为**可公理化的**。


    如果此外，时间还受公式长度的多项式限制，则该理论称为**有效可公理化的**。


    推理规则集 `R` 通常是有限的。


    '
