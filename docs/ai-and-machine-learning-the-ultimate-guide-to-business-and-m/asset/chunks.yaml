  fmt: "\n# 2.2.3 Steepest Descent Method\n\nIt is known from computer mathematics\
    \ that methods of this type have a significant disadvantage: sometimes local minima\
    \ and plateaus can occur when searching for a solution, which are generally difficult\
    \ to recognize and require very complex calculations. Once in a local minimum,\
    \ the steepest descent method will stop there without finding a solution. Once\
    \ on a plateau, the method results in aimless random walks across the plateau.\n\
    \nThe method of steepest descent works well when the estimator is unimodal, i.e.,\
    \ when it has a single global minimum and no plateau. But in order to choose a\
    \ unimodal scoring function, one needs to know the properties of the search space\
    \ fully, and they are usually unknown.\n\nConsider an example. In a game of eight,\
    \ we take the evaluation function `F`—this is the number of stones that are not\
    \ in place. As a result, the search graph for this game looks like this (Fig.\
    \ 19).\n\n![](Images/image00341.jpeg)\n\n**Figure 19.** Scoring function `F`:\
    \ Number of stones out of place\n\nHere the nodes of the graph represent the states\
    \ of the database and the numbers in the nodes are the value of the evaluation\
    \ function in the given state.\n\nIn this case, the rating function proved to\
    \ be very successful—the fastest search method quickly found a solution. But there\
    \ is an element of luck here: from a node with a score of 3, the search went north\
    \ instead of west, simply because the north rule ended up before the west rule\
    \ in our rules list.\n\n# 2.2.4 Reverse Search (Backtracking)\n\nIrreversible\
    \ search implies that if an inappropriate rule is applied, the solution will either\
    \ become fundamentally impossible, or the search process will be significantly\
    \ slowed down. You can base the search algorithm on the following idea: If it\
    \ is clear from the current state of the database that if you continue with the\
    \ solution you have started, either no solution can be found or this search promises\
    \ to take too long, then you can try to go back and try another way.\n\nA search\
    \ strategy that involves backtracking and applying a different rule when applying\
    \ the rule is inappropriate is called backtracking [[41]](#part0005.xhtml#_ftn41).\n\
    \nConsider the backtracking procedure (Algorithm 5).\n\n**Algorithm 5.** Backtracking\
    \ search method for the product system.\n\n```\nproc Backtracking(d, R, t)\n \
    \   if t(d) then return (OK) end if\n    if Deadend(d) then return (fail) end\
    \ if\n    R' := SelectAll(d, R)\n    für r ∈ R' tun\n        if Backtracking(rf(d),\
    \ R, t) = OK then return (OK) end if\n    end for\n    return (error)\nend process\n\
    ```\n\nThe idea of the backtracking search method is very simple and consists\
    \ of the following. If any of the termination conditions are met, work must stop\
    \ and the result returned. Otherwise, you should determine the set of rules in\
    \ effect in that state (conflict set, see Section 0) using the `SelectAll` function.\
    \ Next, the same backtracked search procedure is recursively referred to in a\
    \ loop according to the applicable rules, but using the state obtained after applying\
    \ the selected rule as the database state.\n\nIt is advisable to include the `Deadend`\
    \ function in this process—breaking up \"dead\" paths (dead ends), otherwise the\
    \ program may loop.\n\nThe `Deadend` procedure can check a variety of conditions,\
    \ for example:\n\n- Correspondence of the current state of the database `D` with\
    \ that previously created;\n- Search depth limit, etc.\n\nAn example of a reverse\
    \ search for the wolf, goat, and cabbage problem is shown in Fig. 20. In this\
    \ figure, the nodes from which the return is made are marked in gray because they\
    \ are identical to the nodes already built. We should also mention node `0001`\
    \ separately; this is a dead end node—it is impossible to continue the search\
    \ from there. Fortunately, there is no need to continue, because at this point,\
    \ the algorithm finds the destination node `1111`.\n\n![](Images/image00342.jpeg)\n\
    \n**Figure 20.** Tracing for the wolf, goat and cabbage problem\n\nHere the `Deadend`\
    \ function is used to check if the new state of the database matches what was\
    \ previously created on this path.\n\nVarious modifications of reverse search\
    \ are known. For example, if not all are saved during the search, but only the\
    \ most important states of the database, and the return is not one step, but several\
    \ steps back to the last saved state.\n\nWhen searching with backtracking, the\
    \ tree is traversed and not the entire tree is saved, only the currently constructed\
    \ path in this tree. Moving down the tree corresponds to recursive calls. Upward\
    \ movements correspond to yields. On Fig. 21 shows a fragment of a search tree\
    \ with returns for the knight move problem.\n\n![](Images/image00343.jpeg)\n\n\
    **Figure 21.** Fragment of a backtracking search tree for the knight's move problem\n\
    \nWe place the knight on any square of the board. In this case the angular field\
    \ `a1` is taken as the first field. We alternately arrange the knight on different\
    \ squares, looking for one where the horse was not before. If there are no such\
    \ fields at all, we return to the previous field and so on.\n\nNote that the actual\
    \ structure of the rules involves storing information about the squares of the\
    \ board that the knight has already visited (see Section 0). Therefore, here in\
    \ the `Deadend` function there is no need to check whether the new state of the\
    \ database matches what was previously created along this path. At the expense\
    \ of storing some additional information in the database, the computational load\
    \ of the backtracking procedure can be reduced.\n\n# 2.2.5 Graph Search\n\nGraph\
    \ search belongs to the group of informed strategies that store all available\
    \ previously obtained information. A so-called search graph is created for this\
    \ purpose.\n\nThe search graph is a directed graph `G(V,E)` in which the set of\
    \ vertices `V` is the set [[42]](#part0005.xhtml#_ftn42) of database states and\
    \ the set of arcs `E` is the set of rule applications.\n\nThis graph has an initial\
    \ node `d0` and a set (possibly empty) of terminal nodes `T = { d ∈ D | t(d) }`.\
    \ The elements of the set of terminal nodes are denoted by `dt`, `dt ∈ T`. An\
    \ arc from node `d1` to node `d2` is executed if and only if there is a rule that\
    \ is applicable in state `d1` and, because of its application, transitions the\
    \ basis to state `d2`.\n\n```\nd1 → d2 ∈ E ⇔ ∃ r ∈ R ( rp(d1) & rf(d1) = d2 )\n\
    ```\n\nIn the general case, the search graph can contain cycles, loops, multiple\
    \ arcs. It may not be related etc.\n\nTo search in a graph, the following two\
    \ main methods are used, which are specified in the algorithms: Algorithm 6 and\
    \ Algorithm 7.\n\n**Algorithm 6.** The main search method in the graph.\n\n```\n\
    proc GraphSearch(d, R, t)\n    O := {d} { list of \"open\" nodes }\n    C := ∅\
    \ { list of \"closed\" nodes }\n    while ¬t(d) do\n        d := select(O)\n \
    \       if d = zero then return (fail) end if\n        Open(d, R)\n    end while\n\
    \    return (OK)\nend proc\n```\n\n**Algorithm 7.** Node Disclosure Procedures.\n\
    \n```\nproc Open(d, R)\n    for r ∈ R do\n        if rp(d) then\n            if\
    \ rf(d) ∉ O & rf(d) ∉ C then\n                O := O + rf(d)\n            end\
    \ if\n        end if\n    end for\n    O := O - {d}\n    C := C + {d}\nend proc\n\
    ```\n\nHere the `+` sign means adding an item to the list, and the `-` sign means\
    \ removing an item from the list.\n"
  trans: "\n\n# 2.2.3 最速下降法\n\n从计算机数学中可知，此类方法有一个显著缺点：在搜索解的过程中，有时会出现局部极小值和平台期，它们通常难以识别且需要非常复杂的计算。一旦陷入局部极小值，最速下降法就会停留在那里而无法找到解。一旦处于平台期，该方法会导致在平台上无目的的随机游走。\n\
    \n当评估函数是单峰时，即只有一个全局极小值且无平台期时，最速下降法效果良好。但要选择一个单峰评分函数，需要完全了解搜索空间的性质，而这通常是未知的。\n\n\
    请看一个例子。在八数码游戏中，我们采用评估函数 `F`——即不在正确位置上的数码个数。结果，该游戏的搜索图如下所示（图 19）。\n\n![](img/image00341.jpeg)\n\
    \n**图 19.** 评分函数 `F`：不在正确位置上的数码个数\n\n这里图的节点代表数据库的状态，节点中的数字是给定状态下评估函数的值。\n\n在这种情况下，评分函数被证明非常成功——最快搜索方法迅速找到了解。但这里包含运气成分：从得分为\
    \ 3 的节点出发，搜索向北进行而非向西，仅仅因为在我们的规则列表中北向规则排在西向规则之前。\n\n# 2.2.4 逆向搜索（回溯）\n\n不可逆搜索意味着如果应用了不合适的规则，解要么从根本上变得不可能，要么搜索过程将显著减慢。你可以基于以下思想构建搜索算法：如果从数据库的当前状态可以清楚地看出，继续已开始的解要么找不到解，要么该搜索有望耗费过长时间，那么你可以尝试回退并尝试另一条路。\n\
    \n一种搜索策略，当应用规则不合适时涉及回溯并应用不同的规则，称为回溯搜索 [[41]](#part0005.xhtml#_ftn41)。\n\n请看回溯过程（算法\
    \ 5）。\n\n**算法 5.** 产生式系统的回溯搜索方法。\n\n```\nproc Backtracking(d, R, t)\n    if t(d)\
    \ then return (OK) end if\n    if Deadend(d) then return (fail) end if\n    R'\
    \ := SelectAll(d, R)\n    für r ∈ R' tun\n        if Backtracking(rf(d), R, t)\
    \ = OK then return (OK) end if\n    end for\n    return (error)\nend process\n\
    ```\n\n回溯搜索方法的思想非常简单，包含以下内容。如果满足任何终止条件，必须停止工作并返回结果。否则，应使用 `SelectAll` 函数确定该状态下生效的规则集（冲突集，见第\
    \ 0 节）。接下来，根据适用规则，在循环中递归调用相同的回溯搜索过程，但使用应用所选规则后获得的状态作为数据库状态。\n\n建议在该过程中包含 `Deadend`\
    \ 函数——切断“死”路径（死胡同），否则程序可能会陷入循环。\n\n`Deadend` 过程可以检查各种条件，例如：\n\n- 当前数据库状态 `D` 与先前创建的状态的对应关系；\n\
    - 搜索深度限制等。\n\n图 20 展示了狼、羊、白菜问题的逆向搜索示例。在该图中，返回的节点标记为灰色，因为它们与已构建的节点相同。我们还应单独提及节点\
    \ `0001`；这是一个死胡同节点——无法从那里继续搜索。幸运的是，无需继续，因为此时算法找到了目标节点 `1111`。\n\n![](img/image00342.jpeg)\n\
    \n**图 20.** 狼、羊、白菜问题的回溯追踪\n\n这里 `Deadend` 函数用于检查数据库的新状态是否与该路径上先前创建的状态匹配。\n\n已知有各种逆向搜索的修改版本。例如，如果在搜索过程中不保存所有状态，而仅保存最重要的数据库状态，并且回退不是一步，而是回退数步到最后一个保存的状态。\n\
    \n在带回溯的搜索中，遍历的是树，并且不保存整棵树，仅保存该树中当前构建的路径。向下移动对应递归调用。向上移动对应返回。图 21 显示了骑士走位问题的带回溯搜索树的一个片段。\n\
    \n![](img/image00343.jpeg)\n\n**图 21.** 骑士走位问题回溯搜索树的片段\n\n我们将骑士放在棋盘的任意方格上。在这种情况下，角落格\
    \ `a1` 被作为第一个格子。我们轮流将骑士放在不同的格子上，寻找骑士之前未到过的格子。如果完全没有这样的格子，我们就返回到前一个格子，依此类推。\n\n\
    请注意，实际的规则结构涉及存储骑士已访问过的棋盘格子信息（见第 0 节）。因此，这里在 `Deadend` 函数中无需检查数据库的新状态是否与该路径上先前创建的状态匹配。以在数据库中存储一些额外信息为代价，可以减轻回溯过程的计算负载。\n\
    \n# 2.2.5 图搜索\n\n图搜索属于知情策略组，存储所有可用的先前获得的信息。为此创建了一个所谓的搜索图。\n\n搜索图是一个有向图 `G(V,E)`，其中顶点集\
    \ `V` 是数据库状态的集合 [[42]](#part0005.xhtml#_ftn42)，弧集 `E` 是规则应用的集合。\n\n该图有一个初始节点 `d0`\
    \ 和一个终端节点集合 `T = { d ∈ D | t(d) }`（可能为空）。终端节点集合的元素用 `dt`、 `dt ∈ T` 表示。当且仅当存在一条在状态\
    \ `d1` 下适用的规则，且因其应用使基础转移到状态 `d2` 时，从节点 `d1` 到节点 `d2` 的弧才存在。\n\n```\nd1 → d2 ∈\
    \ E ⇔ ∃ r ∈ R ( rp(d1) & rf(d1) = d2 )\n```\n\n在一般情况下，搜索图可以包含环、自环、多重弧。它可能是不连通的等。\n\
    \n为了在图中搜索，使用以下两种主要方法，它们在算法中指定：算法 6 和算法 7。\n\n**算法 6.** 图中的主要搜索方法。\n\n```\nproc\
    \ GraphSearch(d, R, t)\n    O := {d} { \"open\" nodes list }\n    C := ∅ { \"\
    closed\" nodes list }\n    while ¬t(d) do\n        d := select(O)\n        if\
    \ d = zero then return (fail) end if\n        Open(d, R)\n    end while\n    return\
    \ (OK)\nend proc\n```\n\n**算法 7.** 节点展开过程。\n\n```\nproc Open(d, R)\n    for r\
    \ ∈ R do\n        if rp(d) then\n            if rf(d) ∉ O & rf(d) ∉ C then\n \
    \               O := O + rf(d)\n            end if\n        end if\n    end for\n\
    \    O := O - {d}\n    C := C + {d}\nend proc\n```\n\n这里 `+` 号表示向列表添加项目，`-` 号表示从列表中移除项目。\n\
    \n"
