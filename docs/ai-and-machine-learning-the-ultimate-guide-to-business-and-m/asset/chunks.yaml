    Note that the AND/OR form can be obtained from any predicate calculus formula.


    Example:


    The formula is given (Fig. 49):


    `∃ u ∀ v (Q(v, u) ∧ ¬((R(v) ∨ P(v)) ∧ S(u, v)))`.


    In order to use the AND/OR form, it is proposed to represent the formula in the
    form of a hypergraph as follows. Where the main operation is `∧`, two separate
    1-arcs are placed; where the main operation is `∨`, a 2-arc is placed. The justification
    is very simple. If `A ∧ B` is known, you can take the argument one way by using
    what is given to `A`, and you can go the other way by using what is given to `B`.
    If given `A ∨ B`, we don''t know which direction to move concretely; we have to
    move in both directions at the same time.


    `∃ u ∀ v (Q(v, u) ∧ ¬((R(v) ∨ P(v)) ∧ S(u, v))) Q(w, A) ∧ ((¬R(v) ∧ ¬P(v)) ∨ ¬S(A,
    v))`


    ![Hypergraph representations in AND/OR form](Images/image00370.jpeg)


    **Figure 49. Hypergraph representations in AND/OR form**


    Obviously, the set of propositions into which the root formula is transformed
    can be read as the set of terminal vertices of all solution graphs lying on this
    hypergraph (Figure 49). There are three solution graphs on this hypergraph. One
    goes from the root to `Q`; the second goes from the root to the next level and
    then needs to be connected to `S` since there is a 2-arc. We are interested in
    terminal nodes. If the original form is reduced to sentences, there are three
    of them: `Q`, `¬R ∨ ¬S`, `¬P ∨ ¬P`.


    Note this circumstance: the AND/OR form stores the same information that we had
    in the solution method, as well as other information.


    Consider the following way of constructing a proof engine—the core of an intelligent
    inference system in the form of a rule-based deduction system.


    ### 4.4.5. Direct Trigger System


    As is usual in logic programming, we need to divide the entire set of formulas—all
    the information we have on a given topic—into three classes: facts, rules, and
    goals.


    This results in the following syntactic restrictions:


    *   What we consider facts is actually not limited by anything and can be presented
    in any form AND/OR;

    *   What we consider rules must necessarily be of the form `L → W`, where `L`
    is a literal and `W` is any formula represented in the form AND/OR;

    *   The target must be a disjunction of literals, that is, it must be a sentence.
    In other words, one can formulate a termination condition: the target formula
    is a sentence, the solution graph ends in the target literals.


    The meaning of the method of growing the AND/OR graph using rules is simple. Let''s
    take a fact (or set of facts) and represent it in AND/OR form to get a hypergraph.
    Let''s start by attaching rules to the leaf nodes of this diagram. Each leaf node
    of the constructed graph is unified with the left-hand side of the rule. If the
    unification is successful, we grow the graph (or tree) AND/OR around the right-hand
    side of the rule until a decision graph appears in this graph whose leaves fall
    in the goal nodes (i.e., unify with goal literals). If the left side of the rule
    is identified with a leaf node in the diagram, some substitutions may need to
    be made to unify. It is clear that when different rules are applied in different
    decision columns, they are applied independently. But in a solution graph, it
    is impossible to replace the same variable with different terms at the same time.
    Such cases should therefore be ruled out. In fact, the mechanism now described
    is a special case of the resolution method performed using graph rebuilding.


    Let''s look at this with an example.


    **Fact:** Vlasenko is smart and knows the solution method or he is not a student:

    `¬S(V) ∨ (R(V) ∧ U(V))`.


    **Rule 1:** All students in group 5057 are students: `¬C(x) → ¬5057(x)`.


    **Rule 2:** He who knows the method of dissolution is an excellent student:

    `P(y) → O(y)`.


    **Objective:** There is someone who is either not studying in group 5057 or is
    an excellent student:

    `∃z (¬5057(z) ∨ O(z))`.


    The example of Rule 1 shows the advantage of a direct rule-based system. The designer
    of the knowledge representation system for a specific department can write down
    this rule—"all students in group 5057 are students"—in a contrapositive form:
    "If he is not a student, then he is not studying in group 5057". Therefore, the
    designer of the knowledge representation system (human) gives the inference program
    a hint: in deductive systems it is more profitable to infer from the general to
    the particular, and not from the particular to the general. That is exactly what
    Rule 1 does. That is why staying implicit is so important and useful.


    We build direct deductive reasoning and do not use the method of proof by contradiction.
    Unlike the resolution method, negation should not be applied to the target. The
    goal should be used as it is in the problem statement. In this case, it is clear
    that after Skolemization the goal will be a quantifier-free disjunction of literals,
    which is required in the syntactic condition of the direct deduction system.


    The rationale is as follows (Figure 50).


    ![Extending a form AND/OR applying rules](Images/image00371.jpeg)


    **Figure 50. Extending a form AND/OR applying rules**


    Initially, the fact graph has the following list of leaf nodes: `¬C(B)`, `P(B)`,
    and `Y(B)`. We use our Rule 1 to grow the tree. The left-hand side of the rule
    is unified with the "B" substitution for `x`. The tree is incremented by the right
    side that is merged with the first target literal. This isn''t a solution yet
    because we haven''t created a decision graph that ends with target literals yet.
    So we continue to apply the rules. Rule 2 is triggered and the result is identified
    with the second target literal.


    A decision graph is created ending with goal literals (circled in the figure).
    In order to save information about the substitutions, we introduce suitable arcs
    (in the figure they are represented by thick unfilled arrows) connecting the literals
    to be replaced and the left parts of the rules.


    Let''s consider another example.


    Given a fact: `P(x) ∨ Q(x)`


    **Rule 1:** `P(A) → R(A)`


    **Rule 2:** `Q(B) → R(B)`, where `A` and `B` are concrete constants.


    **Target:** `R(A) ∨ R(B)`


    Note that the goal is not a logical consequence of the facts. This example explains
    the meaning of the condition that the substitutions on the matching arcs in the
    same decision graph must be consistent (Figure 51).


    ![Inconsistent substitutions on matching arcs](Images/image00372.jpeg)


    **Figure 51. Inconsistent substitutions on matching arcs**


    It can be seen that the replacements are incompatible: you have to replace `A`
    with `x` and `B` with `x` at the same time. As a result, the substitutions are
    not consistent; the decision graph is not constructed as it should be because
    the goal is not a logical consequence of facts and rules.


    The example discussed in the previous section was quite instructive. We have performed
    resolving inference in the technique of graphs, but the applicability of this
    technique is limited by the fact that we have syntactic restrictions on the form
    of facts, syntactic restrictions on the form of rules, and syntactic restrictions
    on the form of goals.


    ### 4.4.6. Reverse Trigger System


    Let''s recall some definitions and facts familiar to the reader from the study
    of discrete mathematics.


    If `f(x₁, …, xₙ)` is a boolean function, then the boolean function `f*(x₁, …,
    xₙ) = ¬f(¬x₁, …, ¬xₙ)` is called the dual Boolean function.

    '
  trans: '


    注意，AND/OR 形式可以从任何谓词演算公式中获得。


    示例：


    给定公式（图 49）：


    `∃ u ∀ v (Q(v, u) ∧ ¬((R(v) ∨ P(v)) ∧ S(u, v)))`。


    为了使用 AND/OR 形式，建议将公式表示为超图的形式，如下所示。当主运算是 `∧` 时，放置两条独立的 1-弧；当主运算是 `∨` 时，放置一条 2-弧。其理由非常简单。如果已知
    `A ∧ B`，你可以利用给 `A` 的条件朝一个方向推理，也可以利用给 `B` 的条件朝另一个方向推理。如果给定 `A ∨ B`，我们不知道具体朝哪个方向移动；我们必须同时朝两个方向移动。


    `∃ u ∀ v (Q(v, u) ∧ ¬((R(v) ∨ P(v)) ∧ S(u, v))) Q(w, A) ∧ ((¬R(v) ∧ ¬P(v)) ∨ ¬S(A,
    v))`


    ![AND/OR 形式的超图表示](img/image00370.jpeg)


    **图 49. AND/OR 形式的超图表示**


    显然，根公式转化而成的命题集合，可以读作位于该超图（图 49）上所有解图的终端顶点集合。该超图上有三个解图。一个从根节点通向 `Q`；第二个从根节点通向下一层，然后由于存在一条
    2-弧，需要连接到 `S`。我们关注的是终端节点。如果将原始形式归约为句子，共有三个：`Q`、`¬R ∨ ¬S`、`¬P ∨ ¬P`。


    请注意这种情况：AND/OR 形式存储了我们在解法中拥有的相同信息，以及其他信息。


    考虑以下构建证明引擎的方式——即基于规则的演绎系统形式的智能推理系统的核心。


    ### 4.4.5. 直接触发系统


    正如逻辑编程中的惯例，我们需要将整个公式集合——即我们在给定主题上拥有的所有信息——划分为三类：事实、规则和目标。


    这导致了以下语法限制：


    *   我们视为事实的内容实际上不受任何限制，可以用任何 AND/OR 形式呈现；

    *   我们视为规则的内容必须是 `L → W` 的形式，其中 `L` 是一个文字，`W` 是任何以 AND/OR 形式表示的公式；

    *   目标必须是文字的析取，即必须是一个句子。换句话说，可以制定一个终止条件：目标公式是一个句子，解图终止于目标文字。


    使用规则增长 AND/OR 图的方法含义很简单。让我们取一个事实（或一组事实）并将其表示为 AND/OR 形式以获得超图。让我们开始将规则附加到该图的叶节点上。构建图的每个叶节点与规则的左侧进行合一。如果合一成功，我们围绕规则的右侧增长
    AND/OR 图（或树)，直到该图中出现一个决策图，其叶子落在目标节点中（即与目标文字合一）。如果规则的左侧与图中的叶节点识别，可能需要进行一些替换以实现合一。显然，当不同规则在不同的决策列中应用时，它们是独立应用的。但在一个解图中，不可能同时用不同的项替换同一个变量。因此应排除这种情况。实际上，现在描述的机制是使用图重建执行的归结法的一个特例。


    让我们通过一个例子来看看这一点。


    **事实：** 弗拉先科既聪明又知道解法，或者他不是学生：

    `¬S(V) ∨ (R(V) ∧ U(V))`。


    **规则 1：** 5057 组的所有学生都是学生：`¬C(x) → ¬5057(x)`。


    **规则 2：** 知道溶解方法的人是优秀学生：

    `P(y) → O(y)`。


    **目标：** 存在某人，要么不在 5057 组学习，要么是优秀学生：

    `∃z (¬5057(z) ∨ O(z))`。


    规则 1 的例子展示了直接基于规则系统的优势。特定部门知识表示系统的设计者可以将这条规则——“5057 组的所有学生都是学生”——写成逆否形式：“如果他不是学生，那么他不在
    5057 组学习”。因此，知识表示系统的设计者（人类）给推理程序一个提示：在演绎系统中，从一般推导到特殊比从特殊推导到一般更有利。这正是规则 1 所做的。这就是为什么保持隐式如此重要且有用的原因。


    我们构建直接演绎推理，不使用反证法。与归结法不同，不应对目标应用否定。目标应按问题陈述中的原样使用。在这种情况下，显然经过斯科莱姆化后，目标将变成无量词的文字析取，这正是直接演绎系统语法条件所要求的。


    基本原理如下（图 50）。


    ![应用规则扩展 AND/OR 形式](img/image00371.jpeg)


    **图 50. 应用规则扩展 AND/OR 形式**


    最初，事实图具有以下叶节点列表：`¬C(B)`、`P(B)` 和 `Y(B)`。我们使用规则 1 来增长树。规则的左侧通过 `x` 替换为 `B` 进行合一。树通过与第一个目标文字合并的右侧进行增量。这还不是一个解，因为我们尚未创建一个以目标文字结尾的决策图。所以我们继续应用规则。规则
    2 被触发，结果与第二个目标文字识别。


    创建了一个以目标文字结尾的决策图（图中圈出）。为了保存关于替换的信息，我们引入合适的弧（在图中用粗空心箭头表示），连接要被替换的文字和规则的左侧。


    让我们考虑另一个例子。


    给定事实：`P(x) ∨ Q(x)`


    **规则 1：** `P(A) → R(A)`


    **规则 2：** `Q(B) → R(B)`，其中 `A` 和 `B` 是具体常量。


    **目标：** `R(A) ∨ R(B)`


    注意，目标不是事实的逻辑后果。这个例子解释了同一决策图中匹配弧上的替换必须一致这一条件的含义（图 51）。


    ![匹配弧上的不一致替换](img/image00372.jpeg)


    **图 51. 匹配弧上的不一致替换**


    可以看出，这些替换是不兼容的：必须同时将 `A` 替换为 `x` 并将 `B` 替换为 `x`。结果，替换不一致；决策图无法按预期构建，因为目标不是事实和规则的逻辑后果。


    上一节讨论的例子非常有启发性。我们用图的技术执行了归结推理，但该技术的适用性受到限制，因为我们对事实的形式、规则的形式和目标的形式都有语法限制。


    ### 4.4.6. 反向触发系统


    让我们回顾一些读者从离散数学学习中熟悉的定义和事实。


    如果 `f(x₁, …, xₙ)` 是一个布尔函数，那么布尔函数 `f*(x₁, …, xₙ) = ¬f(¬x₁, …, ¬xₙ)` 称为对偶布尔函数。


