  trans: "\n\n#### 1.2.3. 解搜索算法与知识表示\n\n假设我们希望计算机按升序对一组数字进行排序。我们人类当然知道如何做到这一点。请思考一下，我们能否将此教给计算机，即我们能否在计算机中表示必要的知识？预先告知有三个数字，它们分别等于\
    \ 3、5 和 7。你只需编写一条语句就能教会计算机解决这个问题：\n\n```\nWrite(3, 5, 7)\n```\n\n因此，我们为计算机提供了足够的知识来解决这一特定问题。知识以单个编程语言算子的形式呈现。\n\
    \n让我们使任务复杂化。再有三个数字，但它们的值是任意的。让我们编写一个过程，能够按升序对这些数字进行排序：\n\n```\nproc Sort3 (x,\
    \ y, z)\n    if x > y then x :=: y end if\n    if y > z then y :=: z end if\n\
    \    if x > y then x :=: y end if\n    Write (x,y,z)\nend perc\n```\n\n因此，我们教会了计算机解决大量与按升序对三个数字排序相关的任务，而无需使数据集过长。无论如何，该条目比所有可能的\
    \ `Write` 语句及其所有可能的参数组合要小得多 [\\[15\\]](#part0005.xhtml#_ftn15)。知识以带参数的过程形式呈现。换句话说，编程语言中的过程机制已经是一种知识表示方法。只是这是一种相当古老的方法，我们习惯了它，并不将其视为一种知识表示机制。\n\
    \n另一个问题出现了：`Sort3` 过程从何而来？\n\n我们可以说，像往常一样，它是由程序员发明的。但我们将给出一个不太熟悉的答案，并展示如何在程序中提供足够的知识，使计算机能够想出一个类似于\
    \ `Sort3` 的过程。\n\n`Sort3` 过程的代码片段彼此相似且不止两个，应应用特殊的重构（不改变程序执行功能的程序文本转换），称为过程化。过程化是一种重构，其中程序中重复或相似的片段被替换为对新引入过程的调用。通过重写过程\
    \ `Sort3`，引入过程 `Sort2`，我们得到过程 `Sort3'`。\n\n```\nproc Sort3' (x,y,z)\n    sort2(x,y)\n\
    \    Sort2(y,z)\n    sort2(x,y)\n    Write (x, y, z)\nend perc\n\nproc Sort2(u,v)\n\
    \    if u > v then u :=: v end if\nEnd perc\n```\n\n但 `Sort2` 过程在形式上很容易指定：\n\n\
    ```\nx, y { Sort2(x, y) } x < y\n```\n\n这里在过程标题前写出了前置条件（用花括号括起），在标题后写出了后置条件。`Sort2`\
    \ 方法非常简单，显然在许多情况下都很有用。可以假设该过程连同其规范（前置和后置条件）包含在编译器可用的现成过程库中。\n\n**前置条件** 是编程语言中关于片段输入参数（如过程）的形式化陈述，必须在片段执行前满足，以便片段能正确运行。\n\
    \n**后置条件** 是编程语言中关于片段输入和输出参数的形式化陈述，如果满足前置条件，则保证在片段执行完成后成立。\n\n然后，使用此规范，翻译器可以推导出\
    \ `Sort3'` 过程：\n\n```\nx, y, z\n{Sort2(x, y)} x < y, z\n{Sort2(y, z)} y < z, x\
    \ < z\n{Sort2(x, y)} x < y < z.\n```\n\n因此，我们使翻译机制稍微复杂化（允许在翻译过程中进行推理），并得到了一个自动程序综合系统。换句话说，我们不是紧凑地编写了一个\
    \ `Sort3` 过程，而是编写了一整类过程。在这种情况下，知识以一组过程和内置于翻译器中的推理算法的形式呈现。\n\n看来，“知识”和“过程”这两个术语是正交的。如果有过程，就不需要知识——按过程所说的做，问题就会解决。上述示例表明，“知识”和“过程”（或更确切地说算法）这两个术语不仅不是对立的，实际上是密不可分的。\n\
    \n任何算法必然包含知识，而所有知识最终都由算法表示。\n\nAI 发展的第一阶段与解决问题的方法开发相关——寻找解决方案和构建逻辑结论的算法。目前，这已经是一个研究充分且透彻的课题。最重要的经典结果在第\
    \ 3 章中呈现。\n\n然而，对于非平凡情况，寻找解决方案的复杂性非常高。寻找解决方案的复杂性是一个快速增长的函数（在大多数情况下呈指数级或更快增长），其自变量是知识库的总量。考虑到下面的具体算法，我们证明了准确的估计，但在这里我们非正式地说服读者这一观点的有效性。所寻求的解决方案是给定元素的有限组合，元素数量为\
    \ `n`。如果我们不重复取元素，则总共有 `2^n - 1` 个非空组合 [\\[16\\]](#part0005.xhtml#_ftn16)，如果我们允许重复取元素，则组合数甚至更多。我们事先不知道哪个组合是解决方案，这就是算法的搜索性质，这意味着在最坏情况下我们必须遍历所有组合！\n\
    \n降低寻找解决方案复杂性的方法之一是改进搜索算法以提高其内部效率，这种效率不依赖于待解决的问题。然而，对于许多典型的 AI 问题，它们的 NP 完全性已被证明。为它们创建一个高效（比指数级更高效）的算法绝对是不可想象的。如果为一个仍未探索的\
    \ AI 问题突然发现了一个高效（例如多项式）算法，该问题通常不再被归类为 AI 问题，而转移到常规编程领域。因此，目前不能指望通过提高搜索算法的内部效率来获得显著改进。\n\
    \n一种降低寻找解决方案复杂性的更有成效的方法是提高知识表示的效率。如果选择复杂的表示法能够减小知识库的规模，那么相同的标准搜索算法在效率上就会高得多，因为其适用性的边界得到了扩展。让我们用一个数学模型示例来解释这一点，该示例比较了两种假设的知识表示方式。设同一问题在第一种表示法中的规模为\
    \ `n`，在第二种中为 `n/2`。枚举算法相同，复杂度为 `2^k`，其中 `k` 是问题的规模。同时，更紧凑的表示并非白白得到：枚举的每一步耗时长十倍，且另有\
    \ 100 个时间单位不可挽回地损失在预处理上。实际上，我们在比较两个函数：`2^n` 和 `100 + 10 * 2^(n/2)`。对于较小的 `n`，第一个函数较小，但\
    \ `n = 8` 之后第二个函数变小，且其优势随 `n` 的增加而不断扩大（图 9）。指数函数自变量值的微小增益抵消了所有其他损失！\n\n![](img/image00333.jpeg)\n\
    \n**图 9.** 知识库紧凑度对搜索复杂度影响的比较\n\n"
