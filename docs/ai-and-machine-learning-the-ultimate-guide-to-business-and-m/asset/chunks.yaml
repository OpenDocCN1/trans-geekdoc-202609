- raw: "Breadth-first search and depth-first search are examples of uninformed search\
    \ methods. If nothing is known about the task, uninformed procedures must be employed,\
    \ but not much can be relied upon. In order to effectively find a solution, it\
    \ is necessary to use additional information about the problem. Such additional\
    \ information is often referred to as a heuristic. The meaning of this term is\
    \ explained in the next paragraph.\n\n#### 3.1.2. Heuristic Algorithms\n\nThe\
    \ ancient Greek word \"heuristics\" ( ευρίσκω \\- I seek, I discover) has many\
    \ similar but different meanings and uses in modern language. The following interpretations\
    \ of this term can be found in the literature.\n\nHeuristic methods are special\
    \ methods for solving problems, which are mostly in contrast to formal solution\
    \ methods, which are based on exact mathematical models. Using heuristic methods\
    \ does not guarantee that the resulting solutions will be the best, unsuccessful\
    \ heuristics can lead to the worst result! At the same time, there are many successful\
    \ heuristics (for solving specific problems) that provide [\\[47\\]](#part0005.xhtml#_ftn47)acceptable\
    \ solutions at an acceptable cost.\n\nHeuristic activity is the organization of\
    \ the process of productive creative thinking. In this sense, heuristics are understood\
    \ as a set of inherent human mechanisms for solving creative problems. These mechanisms\
    \ are universal in nature and do not depend on the specific problem to be solved.[\\\
    [48\\]](#part0005.xhtml#_ftn48) \n\nHeuristic programming is a way of writing\
    \ programs in which the programmer does not code a ready-made mathematical solution\
    \ method, but tries to formalize the intuitively understandable method of solving\
    \ a problem that he thinks a person uses when solving such problems. Like heuristic\
    \ methods, heuristic programs do not give an absolute guarantee for the achievement\
    \ of the set goal and the optimality of the result.\n\nHeuristic learning is a\
    \ special method of learning ( Socratic conversations ) or collective problem\
    \ solving that historically goes back to Socrates. The method consists of asking\
    \ the students a series of guiding questions and examples, which in a manner of\
    \ speaking make them search for a solution themselves.\n\nIn our case, we understand\
    \ the term \"heuristic\" in the narrower sense.\n\nA heuristic is a [\\[49\\]](#part0005.xhtml#_ftn49)rule\
    \ of thumb that simplifies or limits the enumerating of options when searching\
    \ for a solution in a specific domain.\n\nMoreover, since we are considering here\
    \ a very specific solution path in a given domain - a search in a graph for a\
    \ production system - we can make the definition even more specific.\n\nHeuristic\
    \ is a set of rules for choosing the next node to expand, which, according to\
    \ the author of the heuristic, should lead to a solution to the problem.\n\nUnfortunately,\
    \ heuristics rely on guesswork and intuition rather than exact knowledge; Heuristics\
    \ use available but limited information, such as a description of the set of currently\
    \ open nodes, and cannot guarantee that the choice is actually the best. A heuristic\
    \ is just a suggestion for choosing the next step based on experience and common\
    \ sense.\n\nAn algorithm that uses heuristics is called a heuristic algorithm\
    \ .\n\nHeuristics reduce the computational cost of applying the rules by reducing\
    \ the total number of times the rules are applied. But even the application of\
    \ the heuristics themselves requires some kind of calculation and has its own\
    \ costs. In addition, manipulating the search graph, especially when it is large,\
    \ is also costly (see Figure 2.5 again).\n\nIn fact, we are interested in the\
    \ sum total of the cost of applying the rules, the cost of checking and expanding\
