  trans: '

    The compactness of a knowledge base is a decisive factor in the performance of
    an AI system, and thus determines the boundaries of its applicability. This situation
    determines the structure of this book. Chapters are structured by knowledge representation
    methods, not by solution methods. When solving problems in intellectual domains,
    one should first select the knowledge representation, then choose a suitable solution
    algorithm. The fact is: if an unsuccessful knowledge representation is chosen,
    no algorithmic tricks will help. Conversely, if a particularly successful knowledge
    representation is invented, even the most common solution algorithms yield quite
    satisfactory results.


    ### 1.3 History of Artificial Intelligence


    A historical review is often absolutely necessary; otherwise, it is impossible
    to understand why modern regulations are appropriate. Due to historical and psychological
    reasons, the definitions and concepts of AI are largely subjective. AI standards
    differ markedly from the objective laws of physics or chemistry. We divide the
    history of AI development into several periods (Prehistory, when the term "Artificial
    Intelligence" had not yet become essential, but some work can be retrospectively
    attributed to this direction [[17]](#part0005.xhtml#_ftn17);


    - **Pioneering Era**, where computers and other technological advances of the
    20th century greatly broadened research horizons, and almost every proposed idea
    amazed with its novelty and opened new perspectives, with ideas emerging like
    fireworks;

    - **Academic Era**, where AI became an independent research field in academia,
    possessing its own terminology, institutions, research centers, and international
    community; research primarily served the development direction itself, while practical
    applications were of interest mainly through the most basic implementations, rather
    than technical-tactical features;

    - **Industrial Era**, continuing to the present, where enhanced technological
    capabilities have paved the way for the large-scale industrial deployment of AI
    systems.


    Of course, one should not assume these periods strictly follow one another like
    socialist five-year economic plans. Both the Pioneering and Academic eras had
    independent industrial designs shaping history, and even in our utilitarian age,
    scientific breakthroughs still occur (though rarely) and suddenly lead to "paradigm
    shifts".


    #### 1.3.1 Background of Artificial Intelligence


    The first reliably recorded attempt by Raymond Lull over 700 years ago aimed to
    create a machine simulating certain aspects of human thought. Lull believed that
    a special method or art could be discovered to derive various truths, especially
    the truths of Christian doctrine, from general concepts with logical necessity.
    Based on this idea, he built the first logic engine, in the form of several concentric
    paper circles divided into compartments containing general concepts and categories.
    By rotating the circles relative to each other, various simple or complex combinations
    of given concepts could be obtained. Lull believed this would uncover new truths.
    Naturally, no new truths were discovered, but the idea that "reasoning can be
    mechanized" was born!


    We now know that logical operations can be algebraized and performed arithmetically,
    but this was far from obvious before the work of G. Boole in the 19th century.
    Therefore, early designers of intelligent machines focused their attention on
    constructing calculating machines. Logical thinking seemed more challenging. Several
    such "calculators" were built in the 17th and 18th centuries, among which the
    Leibniz Calculator must be mentioned—it was the world''s first machine capable
    of efficiently performing all four arithmetic operations.


    G. Leibniz began developing this machine in 1670; two years later he drew a new
    sketch describing it, based on which a replica was demonstrated at a meeting of
    the Royal Society in London in February 1673. Leibniz acknowledged the instrument
    was still imperfect and promised to improve it as soon as he returned to Paris.
    Although significantly improved over the following years, it was not finalized
    until 1694. Consequently, Leibniz returned to the invention multiple times, offering
    new possibilities for improvement.


    The pinnacle of the prehistory of computing is the work of Charles Babbage. Babbage
    started from a mechanical device intended to automate calculation by approximating
    functions with polynomials and computing finite differences. The possibility of
    representing logarithmic and trigonometric functions via polynomial approximations
    made this machine a fairly universal computing device. This Difference Engine
    needed to compute values of sixth-degree polynomials with 18-digit precision.
    In the same year 1822, Babbage built a model of the Difference Engine consisting
    of rollers and gears, rotated manually by a special lever. The following year,
    the British government granted 1,500 pounds. During development, Babbage did not
    demonstrate all technical and mechanical difficulties; not only did he fail to
    meet the promised three-year deadline, but he was forced to stop work nine years
    later. However, parts of the machine had begun to operate, calculating with precision
    even exceeding expectations.


    In 1834, Babbage invented the **Analytical Engine**. It consisted of a "Store"
    (memory device) for holding numbers, a "Mill" (arithmetic device) for performing
    arithmetic operations on numbers, a "Barrel" (controller) for controlling machine
    operations in a specific sequence, and data input/output devices. The registers
    of Babbage''s machine could store at least 10 decimal numbers of 40 digits, theoretically
    expandable to 1,000 numbers of 50 digits. The arithmetic unit hardware supported
    four operations. Addition took 3 seconds; multiplication and division took 2 minutes.
    The machine accepted two streams of punched cards for input, which Babbage called
    "Operation Cards" and "Variable Cards": the former controlled the processing of
    data recorded by the latter. Information was recorded on punched cards via holes.
    Function libraries could be created from operation diagrams. Thus, all major elements
    of the architecture of Babbage''s first computer were fully anticipated. The **Analytical
    Engine** was never realized. The main reason for failure was technological. The
    technology of the time could not manufacture the required complex parts in sufficient
    quantity and precision. The inventor wrote in 1851: "All developments related
    to the Analytical Engine have been at my own expense. I have made many experiments
    and have reached the limit of my skill. In this respect, I feel compelled to decline
    further work."


    #### 1.3.2 Frontier Research


    The serious development of Artificial Intelligence as a scientific direction began
    after the advent of computers in the 1940s. In 1948, Norbert Wiener published
    "Cybernetics, or Control and Communication in the Animal Kingdom and the Machine,"
    thereby founding the new science—Cybernetics.

