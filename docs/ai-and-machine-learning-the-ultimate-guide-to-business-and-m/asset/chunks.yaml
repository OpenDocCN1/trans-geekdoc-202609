    # 知识表示在人工智能中的地位


    在所有智力游戏中，国际象棋历史上最吸引程序员研究者的关注。即使在今天，最好的计算机国际象棋程序也胜过世界知名的特级大师。我们可以说，在国际象棋领域，计算机已经战胜了人类。同时，必须强调的是，国际象棋程序中没有奇迹。它们使用众所周知且经过精心实现的算法，例如第
    3 章讨论的那些。然而，如果我们接受“在特级大师水平下下国际象棋需要智力”这一说法，那么我们就必须承认最好的国际象棋程序是智能的。同时，计算机国际象棋不仅仅是娱乐，也是教授新棋手、创建国际象棋数据库、分析残局和修改规则的一种方式
    [\[13\]](#part0005.xhtml#_ftn13)。但对我们来说最重要的是，这绝对是知识表示最有趣的案例之一。


    在智力游戏中表示知识的任务，是对程序员自然智力的挑战。事实是，从定量角度来看，某些游戏极其复杂。例如，国际象棋大约有 `10^40` 个可能的位置和大约 `10^120`
    个可能的对局。这些是巨大的数字，大于宇宙中的原子数量（根据不同估计，从 `10^67` 到 `10^80`）以及自宇宙诞生以来经过的秒数 [\[14\]](#part0005.xhtml#_ftn14)。没有任何信息设备能够也永远无法看到或记住所有位置并玩遍所有对局——这在物理上是不可能的。因此，智力游戏软件的开发者有大量工作要做！


    米哈伊尔·莫伊谢耶维奇·博特维尼克 (Mikhail Moiseevich Botvinnik, 1911-1995) —— 技术科学博士，第六届世界国际象棋冠军，总共保持此头衔
    13 年。他对国际象棋的算法理解做出了重大贡献。他是第一个特别关注棋手训练问题的人，创建了自己的备战比赛方法，其中重要地位给予了体育锻炼和增强心理稳定性。他为多重开局理论做出了宝贵贡献，开发了许多原创的开局体系，并用有价值的分析丰富了残局理论。“在我看来，我把一切可能给予国际象棋的都给了。现在我只是没有时间为大型锦标赛做准备。当我独自从事电气工程时，我设法将工作与国际象棋结合起来。但几年来，我一直在处理计算机下棋的问题，并深深沉浸其中，以至于无法将这三项活动结合起来。”


    1970 年完成其体育成就（苏联国家队与世界队之间的“世纪对抗赛”）后，博特维尼克致力于人工智能问题，并着手开发计算机国际象棋程序 `Pioneer`。早在
    1958 年，开发“电子棋手”的想法就出现在他脑海中。1968 年，博特维尼克的书出版了，他在书中基于局面评价制定了模拟国际象棋大师选择走法时思维的方法，该评价包含了所有方面，并将不必要的走法和变着排除在外。不幸的是，`Pioneer`
    程序从未实现，但博特维尼克宝贵的思想和解决方案保留在国际象棋理论中，并找到了进入国内 AI 专家后续发展的途径。


    几十年来，计算机国际象棋程序的世界锦标赛定期举行。目前，锦标赛由国际计算机游戏协会主办，对所有类型的计算机开放，核心数不超过八个（即不包括超级计算机和大型集群）。值得欣慰的是，国家程序
    `Kaissa` 是在 GM Adelson-Velsky 和 MV Donskoi 的指导下开发的。过去三年的冠军是 `Rybka` 程序，由捷克裔美国棋手
    Vasik Rajlich 开发。


    ## 1.2. 知识表示在人工智能中的地位


    在智力领域，不可能想出一个适合解决任何问题的通用算法。这就是智力任务与其他非智力任务的区别，后者存在“第一步做什么，第二步做什么，第三步做什么……”的算法。智力领域解决问题的方法总是寻找新方法、新途径，归根结底，如果无法发明新方法，就是平庸地枚举所有可能性以寻找解决方案。


    ### 1.2.1. 问题求解的迭代性质


    在计算机上解决问题的一般方案如图 1.8 所示。自上而下的箭头是确定性的，自下而上的箭头是非确定性的。一般来说，问题的解决总是非确定性的。这是一种试错法，一种搜索方法，通常要求你回到之前的步骤。


    如果此类过程中的反馈（自下而上的箭头）由人实现（这种情况经常发生），则该过程不能描述为计算机辅助知识处理。为了能具体谈论计算机辅助知识处理，所有或部分反馈回路必须由计算机闭合。


    **图 1.8. 在计算机上解决问题的过程方案**


    采用传统的过程式编程（自顶向下）时，解决方案完全取决于问题。每个问题都有其独特的解决方案，一个问题的解决方案不能直接用于解决另一个问题而无需额外工作。在人工智能中（非过程式编程），相同的搜索方法可以应用于一整类问题。


    我们的总结如下。如果任务没有直接的解决算法，通过枚举来解决，且回溯不是由程序员的大脑完成，而是由程序本身完成，那么它就是一个带有人工智能元素的应用系统。如果问题有直接的解决算法，由程序员找到（也许经过几次尝试），但不是由程序本身找到，那么就没有人工智能（也许存在程序员的自然智能）。但实际上，在这两种情况之间没有不可逾越的界限。程序的人工智能不是一种只取值
    0 或 1、全有或全无的离散属性。相反，人工智能是一个连续值，取区间 (0, 1) 上的任意值。图 1.8 中不经过程序员大脑而经过计算机的反馈回路越多，程序的智力水平就越高。


    ### 1.2.2. 知识与无知


    不可能在知道与不知道之间划出明确的界限。事实上，计算机中知识表示没有精确的界限——每个程序和数据都反映了某种知识。另一方面，最微妙的哲学思考可以用自然语言写入计算机，在那里它们由无意义的字节串表示。字节会在计算机中，但哲学知识呢？更具体地说，如果没有我们自己的解释，计算机中没有任何东西是知识；如果你足够努力，几乎可以从任何东西中提取知识。严格来说，在本书中（除非另有明确说明），我们指的是对“知识”一词的以下解释：


    **知识（计算机）** 是一组严格定义的信息结构，以及用于处理这些结构的定义良好的规则和策略（解释规则）。


    让我们通过一个模型示例来看看这一点。

    '
