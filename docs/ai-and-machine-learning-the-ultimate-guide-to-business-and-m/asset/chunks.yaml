  trans: '

    最重要的性质在于，尽管该算法具有启发式性质，但已知一个充分条件，在此条件下算法 `A*` 保证能找到最优解（如果存在的话）。这在本节第一段中得到了严格证明。第二段表明，打个比方，算法
    `A*` “记性很好”——提供给算法的评价函数越“知情”，算法的表现就越“好”。最后，在本节第三段中证明了，如果评价函数选择得当且与搜索空间的度量性质一致，`A*`
    算法不仅最终能找到最优解，而且所有中间状态都位于最优路径上。换句话说，在某些情况下 `A*` 算法的表现简直完美：以最佳可能方式运行。在最后一段中我们指出，理想行为并不总是有保证的：有时
    `A*` 算法的表现令人大失所望。


    ### 3.2.1. 一致性集


    让我们给出必要的定义并引入符号。从节点 `d1` 到节点 `d2` 的最短路径长度记为 `s(d1, d2)`。令 `F*(d) = g*(d) + h*(d)`
    为从节点 `d0` 到节点 `dt` 且经过节点 `d` 的最短路径的确切长度。此处 `g*(d)` 是从 `d0` 到 `d` 的最短路径长度，`h*(d)`
    是从 `d` 到 `dt` 的最短路径长度，即 `g*(d) = s(d0, d)`，`h*(d) = s(d, dt)`。


    利用这些定义可以很容易地证明 `∀ d F*(d) ≥ s(d0, dt)`。


    事实上，一条由经过给定节点 `d` 的两段最短路径组成的路径，不可能比最短路径本身更短。记 `M = F*(d0) = h*(d0) = s(d0, dt)`
    为最优值，即无限制条件下的最短路径长度。


    注意函数 `F*`、`g*`、`h*` 和数值 `M` 通常对我们是未知的。


    回顾一下，我们考虑的评价函数形式如下：


    `F(d) = g(d) + h(d)`，


    其中函数 `g` 已由我们在 `Open` 过程中定义。在 `A*` 算法运行期间，`g(d)` 具有如下估计：`g(d) ≥ g*(d)`，因为并非所有路径都已构建完毕，而在展开节点和构建新路径时，估计值
    `g(d)` 可能会减小，但不会小于 `g*(d)`。


    问题在于函数 `h(d)`——即从当前位置到解的启发式距离估计。显然，一般情况下我们无法在数学上精确指定此函数，只能在个别情况下或多或少成功地构造它。例如，第
    0 节中为玩 8-puzzle 选择的函数被证明非常成功。它使得能够快速找到解。


    这有多大的随意性？决定节点展开顺序的评价函数应具有什么性质，才能保证算法找到解？以下定理给出了这些问题的答案。


    搜索算法在找到最优路径时应具有一致性（或部分正确性），前提是存在这样的路径。


    **定理。** 当 `∀d h(d) ≤ h*(d)` 时，算法 `A*` 是一致的。


    定理的证明基于一组引理。所有引理均在 `h ≤ H*` 条件下证明。引理 1 和定理在 `∀ r ∈ R (r.w > 0)` 条件下证明，即规则应用的权重严格为正。据此，根据问题的含义，所有函数
    `F*`、`g*`、`h*`、`F`、`g`、`h` 和数值 `M` 均为非负。


    **引理 1。** 如果算法 `A*` 不结束工作，则被扩展节点的估计值无限增加。即 `∀ N ∃ k F(dk) > N`。


    *注。* 此处 `k` 为 `A*` 算法的步骤编号，`dk` 为该步骤中被扩展的节点。


    *证明。* 令 `e = min { r ∈ R | r.w } > 0` 为最小规则权重，`m = |R|` 为规则数量。令 `p` 为节点 `dk` 在树中的深度。注意，当所有先前打开的节点都在树的上一层且各层完全填满时，节点深度最小。极限情况下，`m`
    叉树的第 `p-1` 层包含 `1 + m + m² + ... + m^(p-1) = (m^p - 1)/(m - 1)` 个节点。因此 `k < (m^p
    - 1)/(m - 1) < m^p`（当 `m > 2` 时）。则 `p > log_m k`。现在取 `k > m^N / e`。我们有：`F(dk)
    > g(dk) > ep > e log_m k > e log_m (m^N / e) = N`。


    **引理 2。** 如果存在最优路径，则打开节点列表中始终包含一个属于该路径且估计值不超过 `M` 的节点。


    *证明。* 设 `A = <d0, …, dt>` 为最优路径。


    此外，对算法步骤进行归纳。


    归纳基础：`d0 ∈ A` 且 `F(d0) = h(d0) < h*(d0) = M`。


    归纳步骤。展开 `A` 的一个节点会在 `O` 中留下一个后继节点。这意味着列表 `O` 始终包含 `A` 的一个节点，至少有一个，但可以有更多。现在设 `d''
    ∈ O`，`d'' ∈ A`，且 `d''` 是这些节点中最左边的节点（见图 34），即路径上 `d''` 左侧的所有节点均已展开并位于列表 `C` 中。则
    `g(d'') = g*(d'')`，因为最优路径的一段也是最优的。我们有 `F(d) = g(d'') + h(d'') = g*(d'') + h(d'')
    ≤ g*(d'') + h*(d'') = F*(d'') = M`，因为 `∀d ∈ A F*(d) = M`。


    ![图 34. 证明引理 2。](img/image00354.jpeg)


    **引理 3。** 如果存在最优路径，则估计值不超过 `M` 的节点总会被展开。


    *证明。* 根据引理 2 `∃ d ∈ O F(d) ≤ M`，但 `Select` 函数总是选择最小值。


    **定理证明。** 采用三步反证法。


    第一步。设 `∃ A` 为最优路径且算法不结束工作。则由引理 1 `∃ k F(dk) > M`，这与引理 3 矛盾。算法随即结束工作。


    第二步。算法可能以 `fail` 或 `OK` 结束。只有当列表 `O` 为空时才可能出现 `error` 结果。但根据引理 2，列表 `O` 不为空，因此算法以
    `OK` 结果结束。


    第三步。设算法 `A*` 以 `OK` 结果结束，但找到的路径 `P` 不是最优路径。考虑算法结束前对 `Select` 函数的最后一次调用。假设选择器选中待扩展节点
    `dt`。但 `h*(dt) = 0`，所以 `h(dt) = 0`。因此 `F(dt) = g(dt) + h(dt) = g(dt) > g*(dt)
    = F*(dt) = M`，即选择了一个评分大于 `M` 的顶点，这与引理 3 矛盾。


    这证明了算法 `A*` 以 `OK` 结果终止并找到最优路径。


    **推论 1。** 对于每个满足 `F(d) < M` 的节点 `d ∈ O`，该节点都会被展开。


    *证明。* 评分为 `F(dt) = M` 的节点 `dt` 最后被选中扩展，而在每一步中，评分最小的节点都会被扩展。


    **推论 2。** 广度优先搜索是一致的。


    *证明。* 广度优先搜索：`h = 0`，`F = g`，`h` 的一致性条件为：`0 ≤ H*`。


    考虑第 0 节中给出的玩 8-puzzle 的例子。可以看出，所提出的启发式函数满足一致性条件。事实上，所提出的函数 `h`——不在正确位置的棋子数量——不可能超过将所有棋子放回正确位置所需的步数。毕竟，我们一步最多只能移动一颗棋子！


    ### 3.2.2. 评价函数的比较


    给定两个评价函数：


    `F1(d) = g1(d) + h1(d)`，`F2(d) = g2(d) + h2(d)`。


    此外，满足一致性定理的条件：`h1(d) ≤ h*(d)`，`h2(d) ≤ h*(d)`。

    '
