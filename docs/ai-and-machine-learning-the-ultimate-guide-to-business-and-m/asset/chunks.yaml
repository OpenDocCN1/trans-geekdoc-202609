  trans: "\n# 自动定理证明的解消法\n\n解消法是一种基于前提集合 `A` 的反驳以及目标定理 `G` 的否定，利用解消规则进行自动定理证明的方法。\n\
    \n考虑应用解消法的过程：假设需要寻找 `A ⊢ g` 的推导。\n\n1. 公式集合 `A` 的每个公式和公式 `¬G` 独立地转换为集合的集合（即子句集）。\n\
    2. 在生成的子句集合中寻找可解消的子句。\n3. 对它们应用解消规则，并将解消式加入集合，直到获得空子句。\n\n在这种情况下，可能出现以下结果：\n\n\
    1. 应用解消法的结果获得了一个空公式。定理得证。我们构造了从公式 `A` 推导出公式 `G` 的过程。\n2. 应用解消法的结果未获得空公式，且当前子句集合中没有可解消的子句。因此我们反驳了该定理，这意味着公式\
    \ `G` 不能从公式集合 `A` 中推导出来。\n3. 过程不终止。解消规则被反复应用，添加了许多子句，其中没有空子句，但仍有可解消的子句。这什么也说明不了。\n\
    \n换句话说，解消法是一个部分正确的过程。第三种结果不能称为循环，因为无法确定为什么解消过程产生新的解消式，却不产生空子句。这是否意味着定理为真，只是我们还没等到它结束？不知道。这是否意味着结果永远不会是空公式？这也不知道。这是一个逻辑上不可解的问题。原则上，无法说清必须等待多久才能得到这个问题的答案。\n\
    \n## 4.1.7. 解消法的软件实现\n\n所有这些都可以用算法 4.3 的术语来描述。\n\n**算法 4.16. 解消法。**\n\n```\nproc\
    \ R(S)\n  C := S during ∅ ∉ Do _\n    Choose (C, p1, p2, l1, l2, s) if p1, p2\
    \ = nil then return fail End if\n    p := Res(p1, p2, l1, l2, s)\n    C := C +\
    \ p\n  end while\n  return OK\nEnd proc\n\nproc Res(p1, p2, l1, l2, s)\n  p1 :=\
    \ p1{s}\n  p2 := p2{s}\n  p1 := p1 – l1\n  p2 := p2 – l2\n  return p1 ∨ p2\nend\
    \ proc\n\nproc Select(C, p1, p2, l1, l2, s)\n  From the set of sentences C choose\
    \ two sentences p1, p2,\n  which contain the counterliterals l1, l2, united by\
    \ the most common unifier\nend proc\n```\n\n编写这些过程时，我们采用了编译算法以解决枚举问题的标准实践——能固定的就固定。特别是定义了\
    \ `Res` 方法。浮动的过程是 `Select` 过程。控制策略已移至该函数，由它选择两个待解消的子句。\n\n### 示例\n\n每个程序员都知道解消法。\n\
    学生们不知道解消法。\n有些学生是聪明人。\n所以有些聪明人不是程序员。\n\n逻辑上，最后一个陈述为真。让我们用解消法机械地验证它。\n\n引入一组描述上述陈述中所用谓词的谓词：\n\
    \n- `P` - \"是程序员\"\n- `K` - \"知道解消法\"\n- `C` - \"是学生\"\n- `U` - \"是聪明人\"\n\n用一阶谓词演算的公式语言表示，初始陈述（前提）如下：\n\
    \n`∀x (P(x) → K(x))`, `∀x (C(x) → ¬K(x))`, `∃x (C(x) ∧ U(x))`。\n目标：`∃x (U(x) ∧\
    \ ¬K(x))`。\n\n目标公式的否定：`∀x (¬U(x) ∨ K(x))`。\n\n用解消法反驳它。\n\n1. 将原始公式归约为子句：\n   -\
    \ `∀x (P(x) → K(x))` 转换为 `¬P(x) ∨ K(x)`\n   - `∀x (C(x) → ¬K(x))` 转换为 `¬C(x) ∨\
    \ ¬K(x)`\n   - `∃x (C(x) ∧ U(x))` 转换为 `C(a)` 和 `U(a)`\n   - `∀x (¬U(x) ∨ K(x))`\
    \ 转换为 `¬U(x) ∨ K(x)`\n\n因此我们得到以下子句集合 `S`：\n\n`S = { ¬P(x) ∨ K(x), ¬C(x) ∨ ¬K(x),\
    \ C(a), U(a), ¬U(x) ∨ K(x) }`\n\n2. 对第 4 句和第 5 句应用解消规则并加入子句集：\n   `S = { ¬P(x)\
    \ ∨ K(x), ¬C(x) ∨ ¬K(x), C(a), U(a), ¬U(x) ∨ K(x), K(a) }`\n\n3. 对第 1 句和第 6 句应用解消规则并加入子句集：\n\
    \   `S = { ¬P(x) ∨ K(x), ¬C(x) ∨ ¬K(x), C(a), U(a), ¬U(x) ∨ K(x), K(a), P(a) }`\n\
    \n4. 对第 7 句和第 2 句应用解消规则并加入子句集：\n   `S = { ¬P(x) ∨ K(x), ¬C(x) ∨ ¬K(x), C(a), U(a),\
    \ ¬U(x) ∨ K(x), K(a), P(a), ¬C(a) }`\n\n5. 对第 8 句和第 3 句应用解消规则并加入子句集：\n   `S =\
    \ { ¬P(x) ∨ K(x), ¬C(x) ∨ ¬K(x), C(a), U(a), ¬U(x) ∨ K(x), K(a), P(a), ¬C(a),\
    \ ∅ }`\n\n我们得到了一个空子句，即目标公式否定的反驳，即目标公式得证。\n\n通常，解消过程的输出以简写形式书写：子句编号，子句写成添加的解消式序列，并给出每个解消式所解消的子句编号。例如，上述构造的输出简写形式如下：\n\
    \n1. `¬P(x) ∨ K(x)`\n2. `¬C(x) ∨ ¬K(x)`\n3. `C(a)`\n4. `U(a)`\n5. `¬U(x) ∨ K(x)`\n\
    6. `K(a)` (4, 5)\n7. `P(a)` (1, 6)\n8. `¬C(a)` (2, 7)\n9. `∅` (3, 8)\n\n在以下示例中，解消法的推导均以简写形式书写。\n\
    \n# 4.2. 通过解消法寻找反驳的策略\n\n关于解消法的主要问题之一是从哪里获得选择可解消子句对的 `Select` 函数。这是关键问题。选择得当的函数能快速达到目标。不成功的函数将生成越来越多的非空解消式而不给出解。\n\
    \n选择子句进行决策的方式称为**决策策略**（或**解消策略**）。\n\n## 4.2.1. 完全策略\n\n与策略相关的关键概念是完备性的思想。我们不断回到“完备性”这一概念——以其各种表现形式——并且是非常有意识地这么做。我们绝对确信，使用这种或那种工具（在人类活动的任何领域，包括编程）都应始终伴随对该工具固有的所有可能性和局限性的清晰理解。我们衷心希望，在仔细阅读本书后，读者能将知识处理领域的显著成果不仅作为“魔杖”来使用，而是理解工具的所有复杂性，并在必要时能够引入更多美妙的改进。\n\
    \n**完全策略**是这样一种寻找反驳的搜索策略：如果存在任何由解消法得到的反驳，则也存在由该策略得到的反驳。\n\n考虑两个著名的完全策略。\n\n###\
    \ 1. 广度搜索策略（暴力搜索）\n\n每一步的所有可能解消（该策略显然是完全的，因为每个推导都将包含在完全枚举中）。\n\n让我们以程序员和学生知道或不知道解消法的问题为例来考察穷尽搜索（见第\
    \ 0 节）。\n\n| `¬P(x) ∨ K(x)` | `¬C(x) ∨ ¬K(x)` | `C(a)` | `U(a)` | `¬U(x) ∨ K(x)`\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| `¬P(x) ∨ ¬C(x)` | `K(x) ∨ ¬U(x)`\
    \ | `¬K(a)` | `P(a)` |  |\n| `¬P(a)` | `¬C(x)` | `P(a) ∨ ¬U(x)` | `¬C(a) ∨ ¬K(a)`\
    \ | `¬U(a)` |\n| `¬C(a)` | `∅` |  |  |  |\n\n"
