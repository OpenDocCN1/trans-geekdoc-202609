- raw: "The first line consists of the original five sentences. Recall that these\
    \ are sentences obtained by converting the conditions of the problem into the\
    \ form of sentences and negating the goal sentence.\n\nThe second line contains\
    \ a full enumeration of all sets obtained by solving the first line (the original\
    \ sets). The third line contains any new sentences obtained by resolving the sentences\
    \ contained in the first two lines. An empty square appears in the fourth row\
    \ when solving Y( a ) from the first row and  Y( a ) from the third row.\n\n\
    As a result, after the third complement of the initial propositional sentence,\
    \ an empty proposition is constructed and the conclusion is completed, but before\
    \ that quite a lot of propositions are constructed that do not participate in\
    \ the output, they are certainly redundant. This is the exhaustive search strategy.\
    \ It's not efficient like most complete strategies, but it always ends in a positive\
    \ result for us - we get the answer if there is one.\n\n2. linear strategy. \n\
    \nIn the case of a linear strategy, at each step except the first, one of the\
    \ solvable sets is the last set received, the last solver. The very first set\
    \ is called the top one. The set obtained from the previous step (for the first\
    \ step this is the top set, for the subsequent steps it is the last resolution\
    \ obtained) is called the central . The second solvable set is called lateral\
    \ . Thus, the side set is either the original set or one of the previously received\
    \ central sets.\n\nLinear resolution seems to be more efficient than brute force\
    \ for the same problem. We choose the first sentence from the original set of\
    \ sentences as the top sentence\n\n P(x)  P(x)  S(x)  P(x) S(a) Y(a)  U(x)\
    \  P(x).\n\nWe choose the first matching clause for the subordinate clause and\
    \ write the output as a sequence of clause pairs: the central one on the left,\
    \ the lateral one on the right.\n\n|  P(x)  P(x)  S(x)  P(x) ||   |\n\n|\
    \ --- | --- |\n\n|  P(x)  S(x) S(a)  ||   |\n\n|  P(a)  P(x)  P(x)  P(a)\
    \ ||  U(x) oder P(x) |\n\n| P(a) → C(x) → P(x) Y(a) U(a) ||   |\n\n|  С(а)\
    \ С(a)   ||   |\n\nAll suggestions that are received in the course of the solution\
    \ are advertised here. There are slightly fewer of them (11) than the exhaustive\
    \ search (16). In this case, however, an empty supply only appears on the sixth\
    \ replenishment level. However, this means nothing. In another case, an exhaustive\
    \ search may be more efficient.\n\nOf course, there are other examples of complete\
    \ strategies that are widely reported in the literature \\[6\\].\n\n#### 4.2.2.\
    \ Incomplete Strategies\n\nAn incomplete strategy is a strategy that does not\
    \ have the completeness property.\n\nIf the algorithm of the resolution method\
    \ does not complete its work with an incomplete strategy, then this does not mean\
    \ that the proof does not exist, but that it cannot be found with the chosen strategy.\n\
    \nHowever, such strategies are often used because incomplete strategies are often\
    \ more efficient than complete strategies. In fact, incomplete strategies may\
    \ not get proof even if there is one, but when they do, they work faster.\n\n\
    Furthermore, a strategy that is incomplete in the general case can turn out to\
    \ be complete if we restrict the original class of theorems.\n\nLet's look at\
    \ three examples.\n\n1.               Single resolution ( search from data ).\n\
    \nThis is a strategy where one of the solvable sentences is a positive literal\
    \ (fact).\n\n2.               Negative resolution ( search from target ).\n\n\
    This is a strategy where one of the solvable sets is a negative literal (target).\n\
    \n3.               input resolution.\n\nThis is a strategy in which one of the\
    \ resolvable sentences is selected from those entered, i.e. first suggestions\
    \ are made.\n\nIn the general case, all these strategies are incomplete. In particular,\
    \ the input strategy, which is a special case of a complete linear strategy, is\
    \ not itself complete.\n\nAn example demonstrating the incompleteness of the input\
    \ strategy:\n\n1)              PQ \\_ \\_\n\n2)              P  Q\n\n3)             \
    \  P  Q\n\n4)              P  \\_ Q \\_\n\n5)              P (1, 2)\n\n6)             \
    \ Q (5, 3) 7)  P (6, 4)\n\n8)   (7, 5)\n\nNote that the derivation is constructed\
    \ but is not a derivation according to the input strategy - the clause P is not\
    \ an input. It is easy to see that for the set of sentences 1-4 there is no refutation\
    \ by the input strategy.\n\n#### 4.2.3. horn suggestions\n\nThere is a subclass\
    \ of proposals that is very important from the point of view of the practical\
    \ application of the decision-making process. Let's try to syntactically describe\
    \ the common properties of the following sentences:\n\nA                 Data\n\
    \nA 1 &…& A N  B  Rules\n\nB                 Goals\n\nWhen translated into sentence\
    \ form, these formulas look like this:\n\nA\n\n A 1  ...  A N  B \n\nB \\\
    _ \n\nHorn remarked at the time that these three formulas in the form of sentences\
    \ have the following syntactic feature: they contain no more than one positive\
    \ literal. The above are all three possible cases: a positive literal (fact),\
    \ a positive literal and several negative (rule), no positive literals (a negative\
    \ literal - goal).\n\nSentences containing at most one positive literal are called\
    \ hornian .\n\nIn addition, the set of such propositions (Horn formulas) is closed\
    \ according to the resolution rule. If we solve the Horn sets, we get another\
    \ Horn set because we delete one positive and one negative literal, for a total\
    \ of at most one positive literal in the solution.\n\nThe approach to applying\
    \ the resolution method to programming was not developed by Horn but later by\
    \ Robert Kowalski. It turned out that the search method from targets and the search\
    \ method from data, which are not complete in the general case, are complete in\
    \ the Horn case. If there is a derivation, then there is a derivation of goals\
    \ for the Horn case.\n\nBased on Horn's case, the Prolog language was developed\
    \ and is sometimes referred to as logic programming . However, the concepts of\
    \ prolog and logic programming should not be identified. The Prolog language is\
    \ a special case of logical programming, namely an implementation of the solution\
    \ method for the Horn case with the \"search for goals\" strategy. You can use\
    \ other approaches: either apply a different strategy, or take a different subclass\
    \ of formulas, or even consider non-first-order calculi - and all this will be\
    \ logic programming, but not Prolog.\n\n#### 4.2.4. Notes on implementation\n\n\
    It is easy enough to develop a simple logic programming system or an automatic\
    \ theorem proving system. However, all these naive implementations turn out to\
    \ be practically useless. This is because several important factors are not taken\
    \ into account:\n\n1.               The decisive factor is not the choice of resolution\
    \ strategy, but the quality of the settlement process. The unification procedure\
    \ tests whether two literals are unifiable and, if so, creates a substitution\
    \ that unifies them. More than 90% of the logic programming system's machine resources\
    \ are devoted to unification. The unification procedure specified in section 0\
    \ is not effective at all.\n\n2.               Most programmers try to write a\
    \ unification program that gives the answer as quickly as possible - a series\
    \ of replacements. And in this case (for unification) it is necessary to create\
    \ a program that would not get an answer as soon as possible, since most literals\
    \ are not unified. You have to fail as soon as possible , stop executing the procedure,\
    \ you don't have to calculate the answer. It probably doesn't need to be calculated.\
    \ This requires subtle programming tricks."
