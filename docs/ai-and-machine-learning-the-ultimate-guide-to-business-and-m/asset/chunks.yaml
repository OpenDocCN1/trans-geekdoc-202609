    \ ∉ Do _\n    Choose (C, p1, p2, l1, l2, s) if p1, p2 = nil then return fail End\
    \ if\n    p := Res(p1, p2, l1, l2, s)\n    C := C + p\n  end while\n  return OK\n\
    End proc\n\nproc Res(p1, p2, l1, l2, s)\n  p1 := p1{s}\n  p2 := p2{s}\n  p1 :=\
    \ p1 – l1\n  p2 := p2 – l2\n  return p1 ∨ p2\nend proc\n\nproc Select(C, p1, p2,\
    \ l1, l2, s)\n  From the set of sentences C choose two sentences p1, p2,\n  which\
    \ contain the counterliterals l1, l2, united by the most common unifier\nend proc\n\
    ```\n\nWriting these procedures, we use our standard practice of compiling algorithms\
