    # The first feature is that the resolution method works with applications - with
    quantifier-free disjunctions of literals


    These disjunctions have no direction. In fact, the order in which the letters
    appear in a sentence is very important because all algorithms linearly scan and
    analyze the information in the order in which the letters appear in the formulas.
    This order can be important.


    If we compare the solution method with the usual proof method based on the modus
    ponens rule, then this rule itself contains an explicit reasoning. The modus ponens
    rule looks like this:


    ```

    A , A → B

    ──────────

    B

    ```


    It is clear that in this case you must start with `A`, and then we come to `B`.
    There is an explicit reasoning given by the arrow itself. But if we eliminate
    the implication arrows when reducing formulas to propositions, this direction
    can be lost.


    **Example:**


    ```

    (¬A ∧ ¬B) → C    A ∨ B ∨ C

    (¬B ∧ ¬C) → A    A ∨ B ∨ C

    ```


    The above are two completely different implicative rules reflecting different
    semantics, and after converting them into sentences, this difference disappeared.
    The resolution method doesn''t know where to start and where to go. It has all
    the letters the same; it just sorts them mechanically, tries to deduce an empty
    sentence, but in which direction to move in order to output an empty sentence
    - this information is not available, it is lost, although it may have been present
    in the original formulation of the problem.


    Setting up a problem for an automatic proof system is the job of an expert filling
    the knowledge base. He knows which way to use the implication and could prompt
    the system. For example, an expert may know that instead of a direct rule `¬A
    → B` should use the contrapositive form `¬B → A`. But when they are reduced to
    sentences, clues are forgotten. The resolution method only sees Formula `A ∨ B`.
    This is the first disadvantage of the resolution method. This property is called
    **loss of implicitivity**.


    ## 4.4.3. Propagation of literals


    The second disadvantage of this method is the following. When converting into
    sentences, we use the subjunctive form, and at the same time the formula can be
    expanded, that is, the total number of occurrences of predicates in formulas can
    increase. In other words, what is known as **literal multiplication** can occur.
    With the resolution method it can turn out (and turns out in the worst case) that
    the coefficient of expansion observed here is exponential in nature.


    **Example:**


    > Vlasenko is a distinguished student in group 5057.

    >

    > All who study in this group are students, all students know the solving method.

    >

    > High performers are smart.

    >

    > Let''s try to show the following fact: There is a student who knows the solving
    method and is either a programmer or a smart guy.


    We introduce the corresponding predicates and write down the formulas.


    | # | Formula | Type |

    |---|---|---|

    | 0 | `∃x (D(x) ∧ (P(x) ∨ U(x)))` | Target |

    | 1 | `5057(Vlasenko)` | Fact |

    | 2 | `O(Vlasenko)` | Fact |

    | 3 | `∀x 5057(x) → C(x)` | Rule |

    | 4 | `∀x C(x) → P(x)` | Rule |

    | 5 | `∀x O(x) → U(x)` | Rule |


    Let''s turn formulas into sentences. According to the rule of the resolution method,
    a negation must be attributed to the target in front. In this assignment, the
    first statement is split in two, and the predicate `P`, which was present once
    in the original version, appears twice after the transformation. Now let''s start
    with the resolution.


    ```

    1) ¬P(x) ∨ ¬D(x)

    2) ¬P(x) ∨ ¬U(x)

    3) ¬O(x) ∨ D(x)

    4) ¬5057(x) ∨ C(x)

    5) 5057(Vlasenko)

    6) ¬O(x) ∨ U(x)

    7) O(Vlasenko)

    8) ¬P(x) ∨ ¬C(x)          (1, 3)

    9) ¬P(x) ∨ 5057(x)        (8, 4)

    10) ¬P(x)                 (9, 5)

    11) ¬U(x) ∨ ¬C(x)         (2, 3)

    12) ¬U(x) ∨ ¬5057(x)      (11, 4)

    13) ¬U(Vlasenko)          (12, 5)

    14) ¬O(Vlasenko)          (13, 6)

    15) ⊥                     (14, 7)

    ```


    Points 8, 9, and 10 are deductions, resolutions obtained in the simplest way.
    We take the first two matching sets and start solving; points 8, 9, and 10 in
    this example are the first matching, and it''s easy to figure out that we don''t
    need the resulting `¬P(x)` at all. This result is then not used anywhere. Programmers
    were not mentioned at all in the source data. This is a waste of machine time
    and memory running unneeded output. Step 11 (resolution of sentences 2 and 3)
    had to be started immediately; sentence 1 did not have to be taken into account.
    The atomic formula `¬P(x)` that appeared in Step 1 resulted from the multiplication
    of literals and of course proved detrimental to solving the problem.


    The conclusion is built, but along the way there was a false move caused by the
    multiplication of literals that follows from the conversion to conjunctive normal
    form taking place. As a result, the number of occurrences of literals in sentences
    increased and the output lengthened. In the worst case, such an increase can be
    exponential.


    ## 4.4.3. Natural withdrawal direction


    Let''s look at the same problem from the other side. We will not reduce the original
    formulas to propositions and apply the resolution rule, but we will apply the
    usual modus ponens rule. We omit the proof by contradiction, but instead use the
    direct deduction. This makes everything much better, easier, and faster:


    | # | Formula | Justification |

    |---|---|---|

    | 1 | `∃x D(x) ∧ (P(x) ∨ U(x))` | Target |

    | 2 | `5057(Vlasenko)` | Fact |

    | 3 | `O(Vlasenko)` | Fact |

    | 4 | `∀x 5057(x) → C(x)` | Rule |

    | 5 | `∀x C(x) → P(x)` | Rule |

    | 6 | `∀x O(x) → U(x)` | Rule |

    | 7 | `C(Vlasenko)` | Modus Ponens 2, 4 |

    | 8 | `P(Vlasenko)` | Modus Ponens 7, 5 |

    | 9 | `U(Vlasenko)` | Modus Ponens 3, 6 |

    | 10 | `P(Vlasenko) ∨ U(Vlasenko)` | Rule ∨+, 8 |

    | 11 | `D(Vlasenko) ∧ (P(Vlasenko) ∨ U(Vlasenko))` | Rule &+, 7, 9 (Note: Original
    text says 7.9, likely 7 & 9) |

    | 12 | `∃x D(x) ∧ (P(x) ∨ U(x))` | Rule ∃+, 11 |


    Steps 2 and 4 of modus ponens give `C(Vlasenko)`, 7 and 5 give `P(Vlasenko)`,
    3 and 6 give `U(Vlasenko)` and apply rules that have no analogue in the method
    of resolution, but which are apparently consistent; we get the goal. We see that
    the direct system (ordinary reasoning and not a method of proof by contradiction)
    is simple reasoning according to the modus ponens rule, and the introduction of
    additional connectors much faster than in the first case allows you to get the
    same answers.


    Here lies the main idea. We want to keep the advantages that the representation
    of knowledge by sentences offers us and eliminate the disadvantages that this
    representation gives us. We want to get rid of literal multiplication and keep
    the direction of implication so that we can make efficient and short derivations
    as in the second case compared to inefficient and long derivations in the first
    case.


    ## 4.4.4. AND/OR Form


    Let''s try to convert the original formulas with which our knowledge of the subject
    is written (arithmetic formulas of the first order) not into the form of sentences,
    but into the so-called **AND/OR form**, by simply carrying out fewer conversion
    steps. Just as when reducing to sentences in the resolution method we eliminate
    the implication, pull in the negation, eliminate the existential quantifier, construct
    the prenex form, eliminate the universal quantifier, and separate the variables
    in the main conjunctions (see paragraph 0).


    As you have noticed, the subjunctive phase has been skipped. Whatever form it
    was, that form has remained; we just got rid of quantifiers and separated the
    variables. It is easy to see that the number of literals is conserved as a result
    of eliminating the implication, drawing the negation, eliminating the existential
    quantifier, constructing the prenex form, eliminating universality, and renaming
    variables.

    '
  trans: '

    # 第一个特点是消解法适用于应用——适用于无量词的文字析取式


    这些析取式没有方向。事实上，字母在句子中出现的顺序非常重要，因为所有算法都按照字母在公式中出现的顺序线性扫描和分析信息。这种顺序可能很重要。


    如果将消解法与基于分离规则的常规证明方法进行比较，那么该规则本身就包含显式推理。分离规则如下所示：


    ```

    A , A → B

    ──────────

    B

    ```


    显然，在这种情况下必须从 `A` 开始，然后我们得到 `B`。箭头本身给出了显式推理。但如果在将公式归约为命题时消除了蕴含箭头，这种方向性可能会丢失。


    **示例：**


    ```

    (¬A ∧ ¬B) → C    A ∨ B ∨ C

    (¬B ∧ ¬C) → A    A ∨ B ∨ C

    ```


    上述是两条完全不同的蕴含规则，反映了不同的语义，但在将它们转换为句子后，这种差异消失了。消解法不知道从哪里开始，也不知道往哪里走。它拥有的所有字母都是一样的；它只是机械地对它们进行排序，试图推导出一个空句子，但朝哪个方向移动才能推导出空句子——这种信息不可用，它丢失了，尽管它可能存在于问题的原始表述中。


    为自动证明系统建立问题的任务落在填充知识库的专家身上。他知道如何使用蕴含，并可以提示系统。例如，专家可能知道应该使用逆否形式 `¬B → A` 而不是直接规则
    `¬A → B`。但当它们被归约为句子时，线索就被遗忘了。消解法只看到公式 `A ∨ B`。这是消解法的第一个缺点。这一性质称为**隐含性丢失**。


    ## 4.4.3. 文字的传播


    该方法的第二个缺点如下。在转换为句子时，我们使用了虚言形式，同时公式可能会展开，即公式中谓词出现的总次数可能增加。换句话说，可能会发生所谓的**文字乘法**。使用消解法时可能会出现（在最坏情况下确实会出现）此处观察到的展开系数呈指数性质。


    **示例：**


    > Vlasenko 是 5057 组的优秀学生。

    >

    > 凡在该组学习的都是学生，所有学生都知道解题方法。

    >

    > 优秀学生是聪明的。

    >

    > 试证明以下事实：存在一个学生，他知道解题方法，并且要么是程序员，要么是聪明人。


    我们引入相应的谓词并写出公式。


    | # | 公式 | 类型 |

    |---|---|---|

    | 0 | `∃x (D(x) ∧ (P(x) ∨ U(x)))` | 目标 |

    | 1 | `5057(Vlasenko)` | 事实 |

    | 2 | `O(Vlasenko)` | 事实 |

    | 3 | `∀x 5057(x) → C(x)` | 规则 |

    | 4 | `∀x C(x) → P(x)` | 规则 |

    | 5 | `∀x O(x) → U(x)` | 规则 |


    让我们将公式转换为句子。根据消解法的规则，目标前必须加上否定。在这个任务中，第一个陈述被拆分为两个，原本只出现一次的谓词 `P` 在转换后出现了两次。现在让我们开始消解。


    ```

    1) ¬P(x) ∨ ¬D(x)

    2) ¬P(x) ∨ ¬U(x)

    3) ¬O(x) ∨ D(x)

    4) ¬5057(x) ∨ C(x)

    5) 5057(Vlasenko)

    6) ¬O(x) ∨ U(x)

    7) O(Vlasenko)

    8) ¬P(x) ∨ ¬C(x)          (1, 3)

    9) ¬P(x) ∨ 5057(x)        (8, 4)

    10) ¬P(x)                 (9, 5)

    11) ¬U(x) ∨ ¬C(x)         (2, 3)

    12) ¬U(x) ∨ ¬5057(x)      (11, 4)

    13) ¬U(Vlasenko)          (12, 5)

    14) ¬O(Vlasenko)          (13, 6)

    15) ⊥                     (14, 7)

    ```


    第 8、9 和 10 步是推导出的消解式，以最简单的方式获得。我们取前两个匹配的集合开始求解；本例中第 8、9 和 10 步是第一个匹配，很容易发现我们根本不需要得到的
    `¬P(x)`。该结果随后未在任何地方使用。源数据中根本未提及程序员。这是在运行不需要的输出上浪费机器时间和内存。第 11 步（句子 2 和 3 的消解）本应立即开始；句子
    1 本不必考虑。第 1 步中出现的原子公式 `¬P(x)` 由文字乘法产生，当然不利于解决问题。


    结论建立了，但在此过程中由于转换为合取范式而导致的文字乘法，出现了一个错误的举动。结果，句子中文字出现的次数增加，推导变长。在最坏情况下，这种增长可能是指数级的。


    ## 4.4.3. 自然推导方向


    让我们从另一侧看同一个问题。我们不将原始公式归约为命题并应用消解规则，而是应用常规的分离规则。我们省略反证法，而是使用直接演绎。这使一切变得好得多、容易得多、快得多：


    | # | 公式 | 依据 |

    |---|---|---|

    | 1 | `∃x D(x) ∧ (P(x) ∨ U(x))` | 目标 |

    | 2 | `5057(Vlasenko)` | 事实 |

    | 3 | `O(Vlasenko)` | 事实 |

    | 4 | `∀x 5057(x) → C(x)` | 规则 |

    | 5 | `∀x C(x) → P(x)` | 规则 |

    | 6 | `∀x O(x) → U(x)` | 规则 |

    | 7 | `C(Vlasenko)` | 分离规则 2, 4 |

    | 8 | `P(Vlasenko)` | 分离规则 7, 5 |

    | 9 | `U(Vlasenko)` | 分离规则 3, 6 |

    | 10 | `P(Vlasenko) ∨ U(Vlasenko)` | 规则 ∨+, 8 |

    | 11 | `D(Vlasenko) ∧ (P(Vlasenko) ∨ U(Vlasenko))` | 规则 &+, 7, 9（注：原文写 7.9，应为
    7 和 9） |

    | 12 | `∃x D(x) ∧ (P(x) ∨ U(x))` | 规则 ∃+, 11 |


    分离规则的第 2 和 4 步给出 `C(Vlasenko)`，第 7 和 5 步给出 `P(Vlasenko)`，第 3 和 6 步给出 `U(Vlasenko)`，并应用了在消解法中没有对应规则、但显然是一致的规则；我们得到了目标。我们看到，直接系统（常规推理而非反证法）是基于分离规则的简单推理，并且引入额外连接词比第一种情况快得多，能得到相同的答案。


    这里蕴含着主要思想。我们希望保留句子表示知识给我们带来的优势，并消除这种表示给我们带来的劣势。我们想摆脱文字乘法，保留蕴含的方向性，以便像第二种情况那样进行高效且简短的推导，而不是像第一种情况那样进行低效且冗长的推导。


    ## 4.4.4. AND/OR 形式


    让我们尝试将记录我们对主题知识的原始公式（一阶算术公式）转换为所谓的**AND/OR 形式**，而非句子形式，只需执行更少的转换步骤。正如在消解法归约为句子时，我们消除蕴含、内移否定、消除存在量词、构造前束范式、消除全称量词、并在主合取中分离变量（见第
    0 段）一样。


    正如你所注意到的，虚言阶段被跳过了。无论它是什么形式，该形式都保留了下来；我们只是摆脱了量词并分离了变量。很容易看出，消除蕴含、内移否定、消除存在量词、构造前束范式、消除全称性以及重命名变量的结果是文字数量得以保留。


    '
