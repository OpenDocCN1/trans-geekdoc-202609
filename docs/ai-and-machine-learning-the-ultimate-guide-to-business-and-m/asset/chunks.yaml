- raw: 'After that, research in the field of AI was not only carried out in the USA
    on a broad front. The first publications began to appear, trying to generalize
    the collected material. Among the experts presenting such work were J. McCarthy,
    M. Minsky, E. Feigenbaum (E. Feigenbaum, USA), D. Michie (UK), AA Lyapunov and
    VM Glushkov (USSR). Of course, the results were not long in coming - many ideas
    were proposed, most of which are still used today.


    In the late 1950s a graph search model was proposed. In this approach, the task
    is represented as a search for a path in a graph whose vertices are the states
    of the task and the arcs are all possible feasible transformations. The solution
    to the problem is to find a way from the initial state to the target state. In
    the early 1960s heuristic programming became widespread (see Chapter 3). A heuristic
    is a rule, usually obtained empirically, that reduces the scope of the enumeration
    in the solution space. Heuristic programming is the development of strategies
    for finding a solution based on already known heuristics. In the late 1960s General
    methods for the automatic proof of theorems in first-order calculi were developed
    (notably the solution method by J. Robinson and the inverse method by S. Yu. Maslov,
    see Chapter 4) and based on them in the early 1970s . Numerous programming tools
    for solving intellectual problems have been proposed. Thus, in 1973, the Prolog
    language was created, which is still a popular tool for logic programming. Virtually
    the entire body of ideas and concepts currently used in AI have been proposed
    or identified during this period. It is impossible to list all ideas , nor is
    it necessary if the general development scheme is clear (see fig. Error! The text
    of the specified style is missing in the document. .10 ) .


    #### 1.3.4. Scientific deepening and industrial implementation


    In our view, the most important event for AI in the 80s. was the birth of the
    concept of knowledge engineering. This concept was presented in 1982 by E. Feigenbaum.


    Knowledge engineering is an area of artificial intelligence that studies the methods
    and means of extracting, representing, structuring, and using knowledge.


    The separation of knowledge representation methods from solution search methods
    , the construction of more and more effective specialized knowledge representation
    methods in certain subject areas made it possible to obtain sufficiently effective
    representations to solve practically significant problems using the available
    methods on real computers. At the same time, different approaches and directions
    within AI, having found a common methodological basis, began to interlock more
    closely, since there was no need to prove the "purity of the theory" or the "originality
    of the approach", but it was necessary to achieve a practical result in some way.


    During this time, computer systems appeared that were far from passing the Turing
    test, but positively answered such questions: Can a machine solve some intellectual
    problems cheaper than a human being? Faster than a human? More reliable than a
    human?


    The power of computing has increased significantly, and it has become clear that
    if we put aside the philosophical, ethical, and moral issues of "artificial intelligence,"
    it is not only possible, but useful, in many specific, narrowly specialized fields,
    them to replace a person with a machine. Applied artificial intelligence systems
    began to make profits. Investments in academic research immediately started to
    increase , which brought new results introduced to industry , which generated
    revenue partially invested in research ... There was a positive feedback and the
    time of the rise of AI is not over yet!


    The second significant event of this period, after a certain lull, was the revival
    of neurocybernetics with the concepts of neural networks and neurocomputers. The
    renewed interest was not caused by a sudden miraculous revelation from above with
    a popular explanation of exactly how the human brain is constructed and works.
    Of course, physiologists, psychologists, linguists, philosophers and other researchers
    didn''t sit idly by, but learned and found out a lot of new things about our human
    nature, but that wasn''t the reason. Even within neurocybernetics itself, no groundbreaking
    discoveries were made. Modern neural networks use mathematical models that are
    very close to the original ones, although of course they are far more developed
    and improved. The obvious reason for the resurgence of neurocybernetics lies in
    the amazing advances in microelectronics. In pioneering work such as Rosenblatt''s
    perceptron, quantitative differences between artificial and natural neural networks
    were measured many billions of times, and there was no question of a qualitative
    comparison. Now quantitative differences are being measured thousands of times,
    and designers of superneurocomputers have new possibilities never seen before.
    Qualitative changes are to be expected, which the ongoing quantitative changes
    should lead to.


    As a third notable event of the relatively recent past, we consider the introduction
    of the well-deserved philosophical notion of "ontology" into the fresh soil of
    computer science.


    An ontology is a formalization of a particular field of knowledge using a conceptual
    schema. Typically, such a schema consists of a data structure containing all relevant
    object classes, their relationships, and the constraints imposed on the objects
    and relationships.


    Ontologies are used in the programming process as a form of knowledge representation
    about the real world or its part, i.e. as a domain model . Although originally
    philosophical in nature, the term "ontology" [\[20\]](#part0005.xhtml#_ftn20)has
    taken on a meaning of its own in computer science. There are two main differences
    here:


    \-                     Ontology in computer science is a form of knowledge representation,
    a form that a computer can easily process;


    \-                     Information ontologies are always created with concrete
    goals to solve practical problems; They are judged more on applicability than
    completeness, completeness, and correctness.


    The author is firmly convinced that the analysis, construction, development and
    use of domain models is currently the most important and promising task in computer
    science, not only in AI but also in other information technologies.


    Examples include the concept of business process management systems (BPMS) in
    the field of information management systems, the concept of the semantic web (semantic
    web) on the Internet or the concept of domain-specific languages (domain-specific
    languages) in application programming. All of these promising concepts address
    the notion of ontology [\[21\]](#part0005.xhtml#_ftn21).


      .10 reflects our vision of the history of AI development and summarizes the
    section.


      .ten.


    Development history of artificial intelligence


    ### 1.4. CLASSIFICATIONS OF APPLIED ARTIFICIAL INTELLIGENCE SYSTEMS


    The applications and areas in which artificial intelligence is used are very diverse
    - Section 0 only offers a small selection of case studies, not an encyclopedic
    overview. In fact, thousands of applied AI systems are used in real practice,
    and each has its own characteristics and peculiarities. Such a heterogeneous collection
    of objects and methods must be classified, even multiple classifications, one
    is essential.


    #### 1.4.1. types of knowledge


    The knowledge that we are going to represent in a computer is very diverse.


    According to SS Lavrov \[4\], knowledge can be divided into three fundamentally
    different types:


    1.               Conceptual, conceptual knowledge . This group includes concepts
    and relationships between them, e.g. B. Rules, laws, immutable relationships,
    as well as heuristic knowledge \- informal reasoning rules that reflect practical
    experience in solving problems in the problem area.'
