    \n1.  **Single Resolution (Search from Data)**\n    This is a strategy where one\
    \ of the solvable sentences is a positive literal (fact).\n\n2.  **Negative Resolution\
    \ (Search from Target)**\n    This is a strategy where one of the solvable sets\
    \ is a negative literal (target).\n\n3.  **Input Resolution**\n    This is a strategy\
    \ in which one of the resolvable sentences is selected from those entered, i.e.,\
    \ first suggestions are made.\n\nIn the general case, all these strategies are\
    \ incomplete. In particular, the input strategy, which is a special case of a\
    \ complete linear strategy, is not itself complete.\n\nAn example demonstrating\
    \ the incompleteness of the input strategy:\n\n1.  `P ∨ Q`\n2.  `P ∨ ¬Q`\n3. \
    \ `¬P ∨ Q`\n4.  `¬P ∨ ¬Q`\n5.  `P` (1, 2)\n6.  `Q` (5, 3)\n7.  `¬P` (6, 4)\n8.\
    \  `☐` (7, 5)\n\nNote that the derivation is constructed but is not a derivation\
    \ according to the input strategy—the clause `P` is not an input. It is easy to\
    \ see that for the set of sentences 1–4 there is no refutation by the input strategy.\n\
    \n### 4.2.3. Horn Clauses\n\nThere is a subclass of proposals that is very important\
    \ from the point of view of the practical application of the decision-making process.\
    \ Let's try to syntactically describe the common properties of the following sentences:\n\
    \n```\nA                  Data\nA₁ & … & Aₙ → B    Rules\nB                  Goals\n\
    ```\n\nWhen translated into clause form, these formulas look like this:\n\n```\n\
    A\n¬A₁ ∨ ... ∨ ¬Aₙ ∨ B\n¬B\n```\n\nHorn remarked at the time that these three\
    \ formulas in the form of clauses have the following syntactic feature: they contain\
    \ no more than one positive literal. The above are all three possible cases: a\
    \ positive literal (fact), a positive literal and several negative (rule), no\
    \ positive literals (a negative literal - goal).\n\nClauses containing at most\
    \ one positive literal are called **Horn clauses**.\n\nIn addition, the set of\
    \ such propositions (Horn formulas) is closed under the resolution rule. If we\
    \ resolve Horn clauses, we get another Horn clause because we delete one positive\
    \ and one negative literal, for a total of at most one positive literal in the\
    \ resolvent.\n\nThe approach to applying the resolution method to programming\
    \ was not developed by Horn but later by Robert Kowalski. It turned out that the\
    \ search method from targets and the search method from data, which are not complete\
    \ in the general case, are complete in the Horn case. If there is a derivation,\
    \ then there is a derivation of goals for the Horn case.\n\nBased on the Horn\
    \ case, the Prolog language was developed and is sometimes referred to as **logic\
    \ programming**. However, the concepts of Prolog and logic programming should\
    \ not be identified. The Prolog language is a special case of logical programming,\
    \ namely an implementation of the solution method for the Horn case with the \"\
    search for goals\" strategy. You can use other approaches: either apply a different\
    \ strategy, or take a different subclass of formulas, or even consider non-first-order\
    \ calculi—and all this will be logic programming, but not Prolog.\n\n### 4.2.4.\
    \ Notes on Implementation\n\nIt is easy enough to develop a simple logic programming\
    \ system or an automatic theorem proving system. However, all these naive implementations\
    \ turn out to be practically useless. This is because several important factors\
    \ are not taken into account:\n\n1.  **Unification Quality**: The decisive factor\
    \ is not the choice of resolution strategy, but the quality of the unification\
    \ process. The unification procedure tests whether two literals are unifiable\
    \ and, if so, creates a substitution that unifies them. More than 90% of the logic\
    \ programming system's machine resources are devoted to unification. The unification\
    \ procedure specified in section 0 is not effective at all.\n\n2.  **Fail Fast**:\
    \ Most programmers try to write a unification program that gives the answer as\
    \ quickly as possible—a series of replacements. And in this case (for unification)\
    \ it is necessary to create a program that would *not* get an answer as soon as\
    \ possible, since most literals are not unified. You have to **fail as soon as\
    \ possible**, stop executing the procedure; you don't have to calculate the answer.\
