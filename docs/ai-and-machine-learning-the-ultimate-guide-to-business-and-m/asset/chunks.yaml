    \ tricks.\n"
  trans: "\n第一行由最初的五个句子组成。回想一下，这些句子是通过将问题的条件转换为句子形式并否定目标句子而获得的。\n\n第二行包含通过求解第一行（原始集合）获得的所有集合的完整枚举。第三行包含通过消解前两行中包含的句子而获得的任何新句子。当从第一行求解\
    \ `Y(a)` 和从第三行求解 `¬Y(a)` 时，第四行会出现一个空方框。\n\n结果，在初始命题句的第三次补集之后，构建了一个空命题并完成了结论，但在那之前构建了相当多不参与输出的命题；它们肯定是冗余的。这就是穷尽搜索策略。它不像大多数完备策略那样高效，但对我们来说总是以积极的结果告终——如果存在答案，我们就能得到它。\n\
    \n## 2. 线性策略\n\n在线性策略的情况下，除第一步外，每一步中可消解的集合之一是最后收到的集合，即最后的消解式。最开始的集合称为顶层集合。从上一步获得的集合（对于第一步，这是顶层集合；对于后续步骤，这是最后获得的消解式）称为中心集合。第二个可消解集合称为侧翼集合。因此，侧翼集合要么是原始集合，要么是之前收到的中心集合之一。\n\
    \n对于同一个问题，线性消解似乎比暴力搜索更高效。我们从原始句子集合中选择第一个句子作为顶层句子：\n\n```\n¬P(x) ∨ P(x) ¬S(x) ∨\
    \ ¬P(x) S(a) Y(a) ¬U(x) ∨ P(x)\n```\n\n我们为子句选择第一个匹配的子句，并将输出写为子句对的序列：左边是中心子句，右边是侧翼子句。\n\
    \n| 中心 | 侧翼 |\n| --- | --- |\n| `¬P(x) ∨ P(x)` `¬S(x) ∨ ¬P(x)` | |\n| `¬P(x) ∨\
    \ ¬S(x)` `S(a)` | |\n| `¬P(a)` `¬P(x) ∨ P(x)` `¬P(a)` | `¬U(x) ∨ P(x)` |\n| `P(a)\
    \ → C(x) → P(x)` `Y(a) ¬U(a)` | |\n| `¬C(a)` `C(a)` `☐` | |\n\n在求解过程中收到的所有建议都在此处列出。它们的数量（11\
    \ 个）比穷尽搜索（16 个）略少。然而，在这种情况下，空子句仅出现在第六个消解层级上。不过，这毫无意义。在另一种情况下，穷尽搜索可能更高效。\n\n当然，文献\
    \ [6] 中还广泛报道了其他完备策略的例子。\n\n### 4.2.2. 不完备策略\n\n不完备策略是指不具备完备性质的策略。\n\n如果消解法算法在不完备策略下未能完成工作，这并不意味着证明不存在，而只是意味着无法用所选策略找到它。\n\
    \n然而，此类策略经常被使用，因为不完备策略通常比完备策略更高效。事实上，即使存在证明，不完备策略也可能无法得到证明，但一旦得到，它们的工作速度更快。\n\n\
    此外，在一般情况下不完备的策略，如果我们限制原始定理类，可能会变得完备。\n\n让我们看三个例子。\n\n1.  **单侧消解（从数据搜索）**\n   \
    \ 这是一种策略，其中可消解句子之一是正文字（事实）。\n\n2.  **负消解（从目标搜索）**\n    这是一种策略，其中可消解集合之一是负文字（目标）。\n\
    \n3.  **输入消解**\n    这是一种策略，其中可消解句子从输入的句子中选择，即首先提出建议。\n\n在一般情况下，所有这些策略都是不完备的。特别是输入策略，它是完备线性策略的一个特例，本身并不完备。\n\
    \n演示输入策略不完备性的例子：\n\n1.  `P ∨ Q`\n2.  `P ∨ ¬Q`\n3.  `¬P ∨ Q`\n4.  `¬P ∨ ¬Q`\n5.\
    \  `P` (1, 2)\n6.  `Q` (5, 3)\n7.  `¬P` (6, 4)\n8.  `☐` (7, 5)\n\n请注意，虽然构建了推导，但它不是根据输入策略进行的推导——子句\
    \ `P` 不是输入子句。很容易看出，对于句子集合 1-4，不存在输入策略的反驳。\n\n### 4.2.3. 豪恩子句\n\n从决策过程实际应用的角度来看，存在一个非常重要的提议子类。让我们尝试从语法上描述以下句子的共同属性：\n\
    \n```\nA                  数据\nA₁ & … & Aₙ → B    规则\nB                  目标\n```\n\
    \n当转换为子句形式时，这些公式如下所示：\n\n```\nA\n¬A₁ ∨ ... ∨ ¬Aₙ ∨ B\n¬B\n```\n\n豪恩当时指出，这三个公式在子句形式中具有以下语法特征：它们包含不超过一个正文字。上述是所有三种可能的情况：一个正文字（事实）、一个正文字和若干负文字（规则）、无正文字（负文字——目标）。\n\
    \n包含至多一个正文字的子句称为**豪恩子句**。\n\n此外，此类命题集合（豪恩公式）在消解规则下是封闭的。如果我们消解豪恩子句，会得到另一个豪恩子句，因为我们删除了一个正文字和一个负文字，消解式中总共至多包含一个正文字。\n\
    \n将消解法应用于编程的方法不是由豪恩开发的，而是后来由罗伯特·科瓦尔斯基开发的。结果表明，在一般情况下不完备的从目标搜索法和从数据搜索法，在豪恩情况下是完备的。如果存在推导，那么在豪恩情况下就存在目标推导。\n\
    \n基于豪恩情况开发了 Prolog 语言，有时被称为**逻辑编程**。然而，不应将 Prolog 和逻辑编程的概念等同起来。Prolog 语言是逻辑编程的一个特例，即采用“目标搜索”策略实现的豪恩情况求解方法。你可以使用其他方法：要么应用不同的策略，要么采用不同的公式子类，甚至考虑非一阶演算——所有这些都将是逻辑编程，但不是\
    \ Prolog。\n\n### 4.2.4. 实现说明\n\n开发一个简单的逻辑编程系统或自动定理证明系统是相当容易的。然而，所有这些朴素实现都被证明实际上毫无用处。这是因为没有考虑到几个重要因素：\n\
    \n1.  **统一质量**：决定性因素不是消解策略的选择，而是统一过程的质量。统一过程检验两个文字是否可统一，如果可统一，则创建一个统一它们的替换。逻辑编程系统\
    \ 90% 以上的机器资源都用于统一。第 0 节中规定的统一过程完全无效。\n\n2.  **快速失败**：大多数程序员试图编写一个统一程序，以尽快给出答案——一系列替换。而在这种情况下（对于统一），有必要创建一个程序，使其*尽快得不到*答案，因为大多数文字是不可统一的。你必须**尽快失败**，停止执行过程；不必计算答案。它很可能不需要计算。这需要微妙的编程技巧。\n\
    \n"
