    \ need modifiability to try different ways to solve the problem. This is exactly\
    \ what can be achieved with production systems, since we can add and remove rules\
    \ in set `R` without affecting the other rules in any way! In addition, in the\
    \ limit one can dynamically modify the set `R`, directly in the process of solving\
    \ the problem.\n\nGlenford Myers recommends only the two highest strength classes\
    \ of modules for use in software development.\n\nA **functionally strong module**\
    \ is a module that only performs (implements) a specific function. Such a module\
    \ can use other modules when implementing this function.\n\nAn **information-persistent\
    \ module** is a module that performs (implements) multiple operations on the same\
    \ data structure (information object) that is considered unknown outside of that\
    \ module. For example, an information-safe module can implement an abstract data\
    \ type or class in object-oriented programming.\n\nA module's **cohesion** is\
    \ a measure of its data dependency on other modules.\n\nThe **coupling of modules**\
    \ is characterized by the type of data transmission. The weaker the coupling of\
    \ a module with other modules, the stronger its independence from other modules.\
    \ To assess the degree of linkage, Myers proposed an ordered set of different\
    \ types of module linkages. The worst type of module chaining is **content chaining**.\
    \ This is the concatenation of two modules when one of them has direct references\
    \ to the content of the other module (e.g. to a constant contained in the other\
    \ module). This type of module coupling is not recommended. **Shared area chaining**\
    \ is a concatenation of modules where multiple modules share the same memory area\
    \ [[30]](#part0005.xhtml#_ftn30). The best type of module chaining recommended\
    \ for use by modern programming technology is **parametric chaining**—this is\
    \ the case when data is passed to one module, either when accessed as argument\
    \ values, or as a result of calling another module to evaluate any function. This\
    \ type of module chaining is implemented in programming languages by calling procedures\
    \ and functions.\n\n### Algorithm of the system of heterogeneous products\n\n\
    Imagine a kind of AI application that returns the simplest result, namely only\
    \ a yes/no answer (level 0, see Section 1.3.5.) corresponding to whether the termination\
    \ condition `t(d)` is satisfied or not. At the same time, we believe that the\
    \ order in which the rules are applied is not of interest to us. The positive\
    \ answer \"yes\" is referred to as `OK` in the programs below, the negative answer\
    \ as \"no\" - `not passed`. In this case, the operation of the production system\
    \ is stopped by the algorithm **Error! The text of the specified style does not\
    \ exist in the document. .one. Interpreter for production systems.**\n\n```\n\
    proc production(d, R, t)\nduring ¬ t(d) do\n    r := selection(d, R)\n    when\
    \ r = zero then Return(Fail) end if\n    d := rf(d)\nend while\nreturn(OK)\nend\
    \ proc\n```\n\nThis algorithm takes as input the initial state of the base `d`,\
    \ the set of productions `R`, and the termination condition `t`. Furthermore,\
    \ until the termination condition is met, the applicable rule is selected with\
    \ the `Select` function and the status of the database is changed with its help\
    \ until the termination condition is met. If no applicable rule is found, the\
    \ process is aborted and a negative response is returned.\n\nThe `Select` function\
    \ is the heart of this system; it determines the choice of the applied rule, i.e.\
    \ the strategy of the production system `C`. Usually in an artificially intelligent\
    \ system there is not enough information to apply the best rule at each step.\
    \ Therefore, the process of selecting a rule is a search process.\n\nFor example,\
    \ the crudest search strategy is the \"first fit\" presented in the **Error! The\
    \ text of the specified style does not exist in the document. .2. Examples of\
    \ more elaborate strategies are given below.**\n\n#### First-Fit Rule Selection\
    \ Strategy\n\n```\nproc Select(d, R)\n    for r ∈ R do\n        if rp(d) then\
    \ return(r) end if\n    end for\n    return(null)\nend proc\n```\n\nThis is a\
    \ good example of a bad strategy. It's hard to expect intelligence from a machine\
    \ unless we put some of our own intelligence into it.\n\nLet's take a closer look\
    \ at the production system from an algorithmic point of view. In fact, the algorithm\
    \ **Error! The text of the specified style does not exist in the document. .1**\
    \ We have defined and documented a way of interpreting knowledge presented as\
    \ a series of productions. Algorithm **Error! The text of the specified style\
    \ does not exist in the document. .1** is purely mechanical in nature; it has\
    \ no signs of \"intelligence\", neither artificial nor natural. It simply executes\
    \ a set of rules `R` on the input data `d`, without any analysis of the base's\
    \ state change history, without evaluating whether we are moving towards or moving\
    \ away from a solution. Ordinary computers behave the same way: they mindlessly\
    \ run the embedded program and don't try to understand if what they're doing makes\
    \ sense at all. In other words: algorithm **Error! The text of the specified style\
    \ does not exist in the document. .1** is an emulator virtual machine, and the\
    \ set of `R` rules is a program for that machine. The `Select` function has a\
    \ special place. In this function lies the \"intelligence\", i.e. conceptual knowledge\
    \ in the terminology of section 1.3.2. This function is intended to direct the\
    \ calculation process (basic transformations) to a solution, while the algorithmic\
    \ knowledge concentrated in the set of rules `R` lives separately and is not responsible\
    \ for anything.\n\n## 2.1.4. Production system as a logical calculation\n\nThe\
    \ word \"production\" in artificial intelligence itself comes from logic and not\
    \ in the most direct way. The rule of production or inference is a logical rule\
    \ that says that if we have premises of a certain type, then a conclusion follows,\
    \ also of a certain type. For example, the **modus ponens** rule states that the\
    \ conclusion is true if two premises are true: the statement `A` and the implication\
    \ that says `B` follows from `A`.\n\n```\nA, A → B\n──────\nB\n```\n\nFrom the\
    \ point of view of mathematical logic, the production system can thus be viewed\
    \ as a formal theory (the concept of a formal theory is described in detail in\
    \ Section 4.1.1). In this formal theory:\n\n- The initial fact base is part of\
    \ a set of axioms (problem-oriented [[31]](#part0005.xhtml#_ftn31)) of a formal\
    \ theory of the form `A(c₁, ..., cₖ)`, where `A` is a predicate symbol (usually\
    \ associated with a property of objects of the subject under consideration) -\
    \ and all `cᵢ` are constant terms;\n- Productions is an addition to a number of\
    \ problem-oriented axioms in an implicit form of the form `d ∧ p(d) → M(f(d))`;\
    \ moreover, the predicate `p` over the fact set `d` is a kind of \"trigger\" of\
    \ production, and the notation `M(f(d))` sensibly means that the execution of\
    \ actions occurs on the fact basis `D` (base modification) is initiated, defined\
    \ by the function `f: D → D`, and successful execution of these actions sets the\
    \ predicate `M()` to true;\n- The only rule of inference is the rule **modus ponens**\
    \ already mentioned.\n"
  trans: "\n\n## 2.1.3. 异构产品系统的算法\n\n根据数据，规则之间没有直接联系。规则本身不包含任何信息；所有数据都在数据库 `D` 中。\n\
    \n由此得出一个重要结论：规则是功能性强且信息丰富的模块。\n\n在包含人工智能元素的应用系统中，模块化至关重要，因为在这类程序中，行动算法通常无法预先确定。因此，你需要可修改性来尝试解决问题的不同方法。这正是生产系统所能实现的，因为我们可以在集合\
    \ `R` 中添加和删除规则，而完全不影响其他规则！此外，在极限情况下，可以在解决问题的过程中动态修改集合 `R`。\n\nGlenford Myers 建议在软件开发中仅使用强度最高的两类模块。\n\
    \n**功能强模块**是指仅执行（实现）特定功能的模块。此类模块在实现该功能时可以使用其他模块。\n\n**信息持久模块**是指在同一数据结构（信息对象）上执行（实现）多种操作的模块，该数据结构在该模块外部被视为未知。例如，信息安全模块可以实现面向对象编程中的抽象数据类型或类。\n\
    \n模块的**内聚性**是衡量其对其他模块的数据依赖程度的指标。\n\n**模块耦合**由数据传输的类型来表征。模块与其他模块的耦合越弱，其相对于其他模块的独立性就越强。为了评估链接程度，Myers\
    \ 提出了一组有序的不同类型的模块链接。最差的模块链接类型是**内容链接**。这是指两个模块的连接，其中一个模块直接引用另一个模块的内容（例如引用另一个模块中包含的常量）。不推荐使用这种类型的模块耦合。**共享区链接**是指多个模块共享同一内存区域的模块连接\
    \ [[30]](#part0005.xhtml#_ftn30)。现代编程技术推荐使用的最佳模块链接类型是**参数链接**——即将数据作为参数值传递给一个模块，或作为调用另一个模块以计算任意函数的结果而传递。这种类型的模块链接通过在编程语言中调用过程和函数来实现。\n\
    \n### 异构产品系统的算法\n\n设想一种 AI 应用，它返回最简单的结果，即仅返回是/否答案（第 0 级，见 1.3.5 节），对应终止条件 `t(d)`\
    \ 是否满足。同时，我们认为规则的应用顺序对我们不感兴趣。肯定答案“是”在下面的程序中称为 `OK`，否定答案“否”称为 `not passed`。在这种情况下，生产系统的运行由算法\
    \ **Error! The text of the specified style does not exist in the document. .one.\
    \ 生产系统解释器** 停止。\n\n```\nproc production(d, R, t)\nduring ¬ t(d) do\n    r := selection(d,\
    \ R)\n    when r = zero then Return(Fail) end if\n    d := rf(d)\nend while\n\
    return(OK)\nend proc\n```\n\n该算法以初始数据库状态 `d`、生成式集合 `R` 和终止条件 `t` 作为输入。此外，直到满足终止条件，都会使用\
    \ `Select` 函数选择适用规则，并借助它更改数据库状态，直到满足终止条件。如果未找到适用规则，则中止过程并返回否定响应。\n\n`Select` 函数是该系统的核心；它决定应用规则的选择，即生产系统\
