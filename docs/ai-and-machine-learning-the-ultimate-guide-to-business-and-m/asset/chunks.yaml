    \n### 3.4. SEARCH ON PLAY TREES\n\nThe idea of searching on AND/OR graphs is used\
    \ particularly often when programming mind games. In this case, a special case\
    \ of an AND/OR graph called a game tree is commonly considered .\n\n#### 3.4.1.\
    \ play trees\n\nSuppose there is an antagonistic (there is one opponent) discrete\
    \ (the number of positions is at most countable) game with complete information\
    \ (all rules are known in advance and the position is open). It is played by two\
    \ players, Max and Min , who take turns moving, with Max moving first.\n\nLet's\
    \ try to come up with a winning strategy for Player Max . To do this, we construct\
    \ a search graph whose nodes are the allowed positions of the game. In this graph,\
    \ if B is obtained from A by applying a game rule to position A, an arc leads\
    \ from the node corresponding to position A to the node corresponding to position\
    \ B. The root of the tree corresponds to the starting position of the game, and\
    \ the leaves correspond to positions where the outcome of the game is uniquely\
    \ determined (i.e. the winner is determined or a tie is established). Then the\
    \ problem of determining player Max 's winning strategy is reduced to finding\
    \ a path in the game tree from the root to the leaf corresponding to Max 's winning\
    \ position . Also, from a position for a Max move it is enough to find at least\
    \ one solvable node (because we develop a strategy for player Max and we can choose\
    \ the move we want), while for a Min move all the descendants must be solvable\
    \ (because we cannot influence player Min 's move choice and must consider all\
    \ possible moves). Thus the game tree is an AND/OR graph with 1-arcs of nodes\
    \ for the first player Max (AND) and k- arcs of nodes for the second player Min\
    \ (OR).\n\nThe rules of the game determine the rating F \\* of all final positions:\
    \ F\\* \\= +  if Max won , F\\* \\= -  if Min won and F\\* \\= 0 if the game\
    \ ended in a draw.\n\nUsually the game is represented not only by an AND/OR diagram,\
    \ but by a hypertree, so that every position, except the starting position, contains\
    \ exactly one arc. In this case, of course, there may be some memory loss, as\
    \ the matching positions resulting from different move orders are stored in multiple\
    \ instances. Practical observations show, however, that such situations are relatively\
    \ rare in the most common mind games. On the other hand , several very efficient\
    \ algorithms for finding a solution for game trees have been proposed (see the\
    \ following sections) that are not applicable to general graphs. Therefore, when\
    \ programming intellectual games, memory is usually sacrificed in order to increase\
    \ the speed of algorithms."
  fmt: "\n## 算法伪代码\n\n```text\nfor q = (d → d₁, …, dₖ) ∈ Q(d) do\n    w' := w(q) +\
    \ Σ F(dᵢ)\n    if w' < m then\n        x(q(d)) := false\n        x(q) := true\n\
    \        s(d) := ∧ s(dᵢ)\n        m := w'\n    end if\nend for\n\nif s(d) ∨ F(d)\
    \ ≠ m then\n    F(d) := m\n    C := C + U(d)\nend if\nend while\nEnd perc\n```\n\
    \n## 符号说明\n\n此处使用以下符号：\n\n- `Q(d)` 是从 `d` 发出的弧的集合（在 `G` 中）\n- `P(d)` 是 `d` 在 `G`\
    \ 中的后代集合\n- `q(d)` 是 `d` 的带标签弧\n- `x(q)` 是弧的标签\n- `U(d)` 是沿标记弧的 `d` 在 `G` 中的祖先集合\n\
    - `s(d)` 是节点的标签，意味着它是从到目标的超路径构建的\n\n## 过程总结\n\n让我们重申一下关于这三个过程的主要结论。`GS` 和/或过程交替调用\
    \ `Select` 和 `Open` 过程，直到找不到要扩展的节点（`fail` 的结果）或原始节点 `d₀` 被解析。\n\n- `Select` 过程沿标记弧构建当前部分决策图的前沿，并选择该前沿中评分最低的节点。\n\
    - `Open` 过程首先打开选定的顶点，然后重新计算节点估值、标记弧和顶点。在这种情况下，此方法可能会高估整个图。\n- 在这些过程中，我们认为规则的概念既概括了规则的应用，也概括了与\
    \ `k`\\-弧共享数据库。\n\n### 3.3.3. 将搜索方法应用于 AND/OR 图的示例\n\n图 37 - 图 41 展示了搜索算法在 AND/OR\
    \ 图上的运行示例，针对图 36 所示的图。\n\n这些图中使用以下符号：\n\n- 基础状态，即 AND/OR 图的节点，用圆圈标记。如果圆圈是实心的，意味着该节点获得了条件\
    \ `s(d) = 1`，即找到了从给定节点到终端节点（本例中为节点 5 和 6）的解图。\n- 1-弧用普通箭头表示，`k`\\-弧（本例中 `k = 2`）用较密的箭头表示，并有一条小短线连接\
    \ `k`\\-弧的分支。\n- 节点旁边的数字是节点的当前评分。\n- 假设函数 `h` 对终端节点的值为 0，对所有其他节点为 1。这样的函数显然满足一致性条件。\n\
    - `k`\\-弧的长度等于 `k`。\n- 从给定节点发出的标记弧用粗杠标记。\n\n以下系列图示解释了 AND/OR 图上的搜索过程。\n\n####\
    \ 37. 步骤 1. 初始状态\n\n在初始状态下，决策图由单个节点 `d₀` 组成，同一节点形成决策前沿，它被 `Select` 函数选中，因为没有其他可选节点，然后\
    \ `Open` 过程打开该节点。\n\n![初始状态](Images/image00357.jpeg)\n\n#### 38. 步骤 2: 首次扩展节点\n\
    \n第一步之后，重新计算评分返回 `d₀` 节点如下：\n\n- **左侧** = 1（节点 `d₁` 计数）+ 1（弧 `d₀ → d₁` 成本）= 2\n\
    - **右侧** = 1（节点 `d₂` 估值）+ 1（节点 `d₃` 估值）+ 2（弧 `d₀ → (d₂, d₃)` 成本）= 4\n\n左侧估值更优，因此标记弧\
    \ `d₀ → d₁`，接下来打开节点 `d₁`。\n\n![扩展第一个节点](Images/image00358.jpeg)\n\n#### 39. 步骤\
    \ 3. 扩展第二个节点\n\n第二步之后，重新计算评分返回 `d₀` 节点如下：\n\n- **左侧** = 1（节点 `d₄` 估值）+ 1（节点 `d₂`\
    \ 估值）+ 2（弧 `d₁ → (d₄, d₂)` 成本）+ 1（弧 `d₀ → d₁` 成本）= 5 —— 估值增加\n- **右侧** = 1（节点\
    \ `d₂` 估值）+ 1（节点 `d₃` 估值）+ 2（弧 `d₀ → (d₂, d₃)` 成本）= 4 —— 估值不变\n\n现在右侧估值更优，因此标记弧\
