    #### 3.4.3.  \-  Cut off


    In Minimax, position generation and its evaluation are separate. Generation takes
    place first, and only then is this generation evaluated. It is possible to carry
    out the simultaneous evaluation already at the time of the generations in order
    not to generate anything superfluous. This process is referred to as  -  cutout
    .


    This mechanism was apparently so necessary and relevant in the mid-20th century
    that many scientists around the world took up its development. Now it is difficult
    to say who is the author of this procedure, apparently it was repeatedly invented.
    Samuel (A. Samuel), Richards (DJ Richards), Hart (TP Hart), and others independently
    proposed early versions of this algorithm. John McCarthy also put forward similar
    ideas at the 1956 Darmud seminar. Our compatriot Alexander Lvovich Brudno independently
    discovered the algorithm and published his results in 1963.'
