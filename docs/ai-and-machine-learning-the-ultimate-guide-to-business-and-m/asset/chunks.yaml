    # 1.3.3. 出现与发展


    1956 年，达特茅斯学院（美国最古老的大学之一）举办了为期两个月的研讨会，与会者为这一新方向的十位领军研究者：


    - 约翰·麦卡锡，达特茅斯学院；

    - 马文·明斯基，哈佛大学；

    - 克劳德·香农，贝尔实验室；

    - 纳撒尼尔·罗切斯特，IBM；

    - 阿瑟·塞缪尔，IBM；

    - 艾伦·纽厄尔，卡内基梅隆大学；

    - 赫伯特·西蒙，卡内基梅隆大学；

    - 特伦查德·摩尔，普林斯顿大学；

    - 雷·所罗门诺夫，麻省理工学院；

    - 奥利弗·塞尔弗里奇，麻省理工学院。


    该研讨会被视为人工智能作为独立学科方向的开端，术语 `artificial intelligence` 本身也是在此提出并确立的。达特茅斯研讨会并未产生特定的科学成果。但在那里发生了其他重要事件：人工智能被确认为科学的一个独立分支，展示了首批令人印象深刻的成果（类似于
    `Logic Theorist` 程序），并因领军人物的相互认识而形成了科学共同体。


    ---


    尽管维纳的书名未提及思维，但令人厌恶的问题“机器能思考吗？”[[18]](#part0005.xhtml#_ftn18)两年后首次出现在图灵的著名文章中。（特别是在这篇文章中，首次提出了机器拥有
    AI 的建设性判据，即所谓的图灵测试。）


    关于这一话题，不仅外部观察家、记者和大众众说纷纭，就连亲自投身 AI 领域的科学家们内部也意见不一。当然，一线研究者的总体反应是积极的。微妙之处在于可以提出两个相似的问题：


    1. 机器能像人类一样思考吗？

    2. 机器能理性地思考吗？


    对第一个问题寻求建设性答案，会导向对人类思维的建模，在此认为不仅获得智力问题的答案很重要，分析获得答案的手段也很重要。这一流派称为**神经控制论**。


    神经控制论的主要方法是对人脑进行数学建模。早在 1943 年，美国科学家沃伦·麦卡洛克和沃尔特·皮茨就提出了人脑神经元运作的数学模型——**人工神经元**——以及将人工神经元组合成**神经网络**的方法。


    随后是罗森布拉特、明斯基及其他研究者的开创性工作。然而，在 70 年代，由于当时计算机量化能力低下，该方向工作一度放缓。事实是，人脑中有 100 亿至 140
    亿（$10⁹$）个并行工作的神经元，每个神经元平均约有七千（$10³$）个与其他神经元的连接。早期网络中人工神经元的数量以百计，顶多以千计，但这种数百万倍的量级差异造成了质的鸿沟——无法在小模型上研究大系统。值得注意的是，神经网络中人脑的量化指标尚未达到[[19]](#part0005.xhtml#_ftn19)，但规模正逐渐变得适宜。


    回答第二个问题，我们进入了**“黑箱”控制论**的领域，此时仅观察输入与输出、刺激与反应，而“思维主体”的内部结构对观察保持隐藏。与神经控制论不同，**“黑箱”**控制论不关心“思维”装置如何工作。关键在于它对给定的输入动作做出的反应与人脑相同，即理性地反应。


    该领域的研究者立即从高度复杂的并行非确定性神经控制论网络转向相对简单的算法模型，这些模型操纵抽象符号而非现实世界的信号。因此我们更倾向于使用术语**符号 AI**（见图
    Error! Text of the specified style is missing in the document. .10）。


    该方向最著名的开创性工作是 A. 纽厄尔、G. 西蒙和 J. 肖于 1955–1956 年开发的 `Logic Theorist` 程序。该程序在自动定理证明领域工作，能够自动找到罗素和怀特海德奠基之作《数学原理》中给出的
    52 个命题演算定理中 38 个的推导。此外，在一种情况下，还找到了比原著更短的证明。


    文献中对这一毋庸置疑的成就发表了如此多不同且有时令人惊讶的观点和评价，以至于我们认为有必要以逻辑理论程序为例，给出我们关于自动证明定理的通用程序，进而关于通用心智程序的结论（另见第
    0 节）。


    1. **自动证明的定理不包含新的数学洞见：** 就 `Logic Theorist` 程序而言，这些是简单的命题演算技术定理。其有效性可通过建立真值表轻松核验。唯一的任务是在给定的公理系统和给定的推理规则中寻找形式推导（公式序列）。寻找推导不需要任何新思想或新方法，而是依赖相当常规的技术。在讨论的推导中，没有推理规则应用少于三步的推导，也没有超过两打应用步数的推导。`Logic
    Theorist` 程序的结果无实用意义。


    2. **作者对学习命题演算的学生的长期观察，** 他们在受教育过程中被迫寻找并找到类似的推导，这使我们能断言：没有受过专门训练的普通“大街上的人”找不到
    `Logic Theorist` 程序找到的任何形式证明。一个“大街上的人”根本不懂该做什么，因为显然他们从未做过类似的事。在这门技艺上，未受训练者逊于 `Logic
    Theorist` 程序。同时，经过三四次教师指导的练习后，勤奋的学生能找到这些推导中的任意一个，以及程序找不到的推导。应注意到，学生找到的推导可能不如罗素和怀特海德的优雅，发现速度可能也不快。尽管如此，可以断言：一个能通过大学入学考试的人，也能学会寻找形式推理，且不亚于
    `Logic Theorist` 程序。


    3. **从定性角度看，`Logic Theorist` 程序的结果在过去半个多世纪里没有显著改善。** 原因在于，在命题演算中自动搜索推导的问题具有穷举性质（见第
    0 节）。现代计算机比肖使用的计算机强大数百万甚至数十亿倍，但现代通用推理搜索程序只能推导出复杂度高出几十倍、顶多几百倍的结论，因此从定性层面看，本列表前两条评论至今仍然有效，不仅适用于
    `Logic Theorist` 程序，也适用于任何声称能自动证明足够丰富演算中任意定理的现代程序。

    '
