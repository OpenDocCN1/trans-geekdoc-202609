  fmt: "\n# Breadth-first search and depth-first search are examples of uninformed\
    \ search methods\n\nIf nothing is known about the task, uninformed procedures\
    \ must be employed, but not much can be relied upon. In order to effectively find\
    \ a solution, it is necessary to use additional information about the problem.\
    \ Such additional information is often referred to as a heuristic. The meaning\
    \ of this term is explained in the next paragraph.\n\n## 3.1.2. Heuristic Algorithms\n\
    \nThe ancient Greek word \"heuristics\" (ευρίσκω \\- I seek, I discover) has many\
    \ similar but different meanings and uses in modern language. The following interpretations\
    \ of this term can be found in the literature.\n\nHeuristic methods are special\
    \ methods for solving problems, which are mostly in contrast to formal solution\
    \ methods, which are based on exact mathematical models. Using heuristic methods\
    \ does not guarantee that the resulting solutions will be the best; unsuccessful\
    \ heuristics can lead to the worst result! At the same time, there are many successful\
    \ heuristics (for solving specific problems) that provide acceptable solutions\
    \ at an acceptable cost.\n\nHeuristic activity is the organization of the process\
    \ of productive creative thinking. In this sense, heuristics are understood as\
    \ a set of inherent human mechanisms for solving creative problems. These mechanisms\
    \ are universal in nature and do not depend on the specific problem to be solved.\n\
    \nHeuristic programming is a way of writing programs in which the programmer does\
    \ not code a ready-made mathematical solution method, but tries to formalize the\
    \ intuitively understandable method of solving a problem that he thinks a person\
    \ uses when solving such problems. Like heuristic methods, heuristic programs\
    \ do not give an absolute guarantee for the achievement of the set goal and the\
    \ optimality of the result.\n\nHeuristic learning is a special method of learning\
    \ (Socratic conversations) or collective problem solving that historically goes\
    \ back to Socrates. The method consists of asking the students a series of guiding\
    \ questions and examples, which in a manner of speaking make them search for a\
    \ solution themselves.\n\nIn our case, we understand the term \"heuristic\" in\
    \ the narrower sense.\n\nA heuristic is a rule of thumb that simplifies or limits\
    \ the enumerating of options when searching for a solution in a specific domain.\n\
    \nMoreover, since we are considering here a very specific solution path in a given\
    \ domain \\- a search in a graph for a production system \\- we can make the definition\
    \ even more specific.\n\nA heuristic is a set of rules for choosing the next node\
    \ to expand, which, according to the author of the heuristic, should lead to a\
    \ solution to the problem.\n\nUnfortunately, heuristics rely on guesswork and\
    \ intuition rather than exact knowledge; heuristics use available but limited\
    \ information, such as a description of the set of currently open nodes, and cannot\
    \ guarantee that the choice is actually the best. A heuristic is just a suggestion\
    \ for choosing the next step based on experience and common sense.\n\nAn algorithm\
    \ that uses heuristics is called a heuristic algorithm.\n\nHeuristics reduce the\
    \ computational cost of applying the rules by reducing the total number of times\
    \ the rules are applied. But even the application of the heuristics themselves\
    \ requires some kind of calculation and has its own costs. In addition, manipulating\
    \ the search graph, especially when it is large, is also costly (see Figure 2.5\
    \ again).\n\nIn fact, we are interested in the sum total of the cost of applying\
    \ the rules, the cost of checking and expanding nodes, and the cost of heuristics.\
    \ More specifically, we want to minimize the average of this sum over all cases\
    \ where the heuristic algorithm is applied.\n\nIn order to formulate the problem\
    \ accurately it is necessary to give definitions and introduce notations, which\
    \ we will do in the next section.\n\n## 3.1.3. Rating Function\n\nThe heuristic\
    \ information can take any form. It is common in AI to represent heuristic information\
    \ in the form of a scoring function `F(d)`.\n\nThe evaluation function `F` is\
    \ defined on the set of permissible environmental states (fact bases) and assumes\
    \ real numerical values `F : D → ℝ`. In addition, the evaluation function is usually\
    \ chosen in such a way that its value at the end nodes is minimal `F(d_t) = min\
    \ { d ∈ D | is F(d) }`. Given such an evaluation function, it is possible to write\
    \ the `Select` function with the idea of steepest descent (Algorithm 10).\n\n\
    ### Algorithm 10. The function to select a node to expand\n\n```\nProcess Selection(O)\n\
    \    m := ∞\n    d' := zero\n    for d in O do\n        if F(d) < m then\n   \
    \         d' := d\n            m := F(d)\n        End if\n    End for\n    return\
    \ (d')\nEnd Process\n```\n\nOr short:\n\n`Choose(O) := min F(d), d ∈ O`\n\nMany\
    \ different implementation ideas have been proposed for the evaluation function\
    \ `F`. The word \"estimated\" means that `F` (probably) is close to an important\
    \ search feature. The following is a list of some characteristic properties that\
    \ are often attempted to use when choosing an estimator:\n\n- The reciprocal of\
    \ the probability that `d` belongs to the optimal path;\n- Distance from node\
    \ `d` to the target set of node `T`;\n- The weight of the path from the source\
    \ node `d_0` to the destination node `d_t` via the current node `d`.\n\nIn this\
    \ section we consider the latter case.\n\nWe consider the evaluation function\
    \ in the following form:\n\n`F(d) = g(d) + h(d)`, where `g(d)` is the actual cost\
    \ of the path from the initial node `d_0` to `d` (already defined by us in the\
    \ `Open` procedure); `h(d)` is a heuristic estimate of the cost of the path from\
    \ `d` to the destination node `d_t`.\n\nConsider the process of choosing an evaluation\
    \ function using the example of the game in 8 (we already discussed it in section\
    \ 2.1.4). We introduce the evaluation function `F(d)` as the sum of the depth\
    \ in the tree (corresponds to the function `g(d)`) and the number of missing stones\
    \ (corresponds to the function `h(d)`). We see (Fig. 33) that with such an evaluation\
    \ function the search on the graph is very efficient and quickly leads to a solution.\n\
    \nLet's make some observations about this example:\n\n- `h(d_t) = 0`, since in\
    \ the target position, by definition, all stones are in place;\n- `h(d)` does\
    \ not exceed the minimum number of moves to go from `d` to `d_t`;\n- The value\
    \ of the function `F(d)` for expanded nodes does not decrease; if we take the\
    \ function `F` only as the depth in the tree, i.e., if we set `h = 0`, we only\
    \ get breadth-first search.\n\nIn the next section we summarize and interpret\
    \ these empirical observations.\n\n![Search graph for an 8-player game with an\
    \ evaluation function F](Images/image00353.jpeg)\n\n**Figure 33.** Search graph\
    \ for an 8-player game with an evaluation function `F`.\n\n## 3.2. Properties\
    \ of Algorithm A*\n\nAlgorithm A* has a number of remarkable and useful properties\
    \ that explain its wide applicability.\n"
  trans: "\n\n# 广度优先搜索和深度优先搜索是无信息搜索方法的示例\n\n如果对任务一无所知，则必须采用无信息过程，但无法依赖太多信息。为了有效地找到解决方案，有必要利用关于问题的额外信息。这种额外信息通常被称为启发式信息。该术语的含义将在下一段中解释。\n\
    \n## 3.1.2. 启发式算法\n\n古希腊语“heuristics”（ευρίσκω \\- 我寻找，我发现）在现代语言中有许多相似但不同的含义和用法。在文献中可以找到对该术语的以下解释。\n\
    \n启发式方法是解决问题的特殊方法，它们大多与基于精确数学模型的形式化解法形成对比。使用启发式方法不能保证得到的解是最优的；不成功的启发式可能导致最坏的结果！同时，存在许多成功的启发式方法（用于解决特定问题），它们能以可接受的代价提供可接受的解。\n\
    \n启发式活动是富有成效的创造性思维过程的组织。从这个意义上说，启发式被理解为人类解决创造性问题的一组内在机制。这些机制具有普遍性，不依赖于待解决的具体问题。\n\
    \n启发式编程是一种编写程序的方式，程序员不编写现成的数学解法，而是试图将他/她认为人们在解决此类问题时所使用的直观易懂的解法形式化。与启发式方法一样，启发式程序不能绝对保证达到既定目标和结果的最优性。\n\
    \n启发式教学是一种特殊的教学方法（苏格拉底式对话）或集体解决问题的方法，历史上可追溯至苏格拉底。该方法在于向学生提出一系列引导性问题和示例，从某种意义上说，这使他们自行寻找解决方案。\n\
    \n在我们的案例中，我们用更狭义的含义来理解“启发式”一词。\n\n启发式是在特定领域搜索解决方案时，简化或限制选项枚举的经验法则。\n\n此外，由于我们在此考虑的是给定领域中一条非常具体的解决路径——面向生产系统的图搜索——我们可以使定义更加具体。\n\
    \n启发式是一组用于选择下一个待扩展节点的规则，根据启发式作者的意图，这应能导向问题的解决方案。\n\n不幸的是，启发式依赖于猜测和直觉，而非确切知识；启发式利用可用但有限的信息（如当前开放节点集合的描述），无法保证选择实际上是最好的。启发式仅仅是基于经验和常识为选择下一步提供的建议。\n\
    \n使用启发式的算法称为启发式算法。\n\n启发式通过减少规则应用的总次数来降低应用规则的计算成本。但即使启发式本身的应用也需要某种计算，并有其自身的成本。此外，操作搜索图（尤其是当图很大时）也是昂贵的（再次参见图\
    \ 2.5）。\n\n实际上，我们关心的是应用规则的成本、检查和扩展节点的成本以及启发式成本的总和。更具体地说，我们希望最小化在启发式算法应用的所有情况下该总和的平均值。\n\
    \n为了准确表述问题，有必要给出定义并引入符号，我们将在下一节中进行。\n\n## 3.1.3. 评价函数\n\n启发式信息可以采取任何形式。在人工智能中，通常以评分函数\
    \ `F(d)` 的形式表示启发式信息。\n\n评价函数 `F` 定义在允许的环境状态集合（事实库）上，并取实数值 `F : D → ℝ`。此外，评价函数通常的选择方式使其在终止节点处的值最小\
    \ `F(d_t) = min { d ∈ D | is F(d) }`。给定这样一个评价函数，就可以编写基于最速下降思想的 `Select` 函数（算法\
    \ 10）。\n\n### 算法 10. 选择待扩展节点的函数\n\n```\nProcess Selection(O)\n    m := ∞\n   \
    \ d' := zero\n    for d in O do\n        if F(d) < m then\n            d' := d\n\
    \            m := F(d)\n        End if\n    End for\n    return (d')\nEnd Process\n\
    ```\n\n或简写为：\n\n`Choose(O) := min F(d), d ∈ O`\n\n对于评价函数 `F`，已提出许多不同的实现思路。“估计”一词意味着\
    \ `F` （很可能）接近于一个重要的搜索特征。以下列出了一些在选择估计器时常尝试利用的特征属性：\n\n- `d` 属于最优路径的概率的倒数；\n- 从节点\
    \ `d` 到目标节点集合 `T` 的距离；\n- 从源节点 `d_0` 经当前节点 `d` 到目标节点 `d_t` 的路径权重。\n\n在本节中，我们考虑后一种情况。\n\
    \n我们考虑如下形式的评价函数：\n\n`F(d) = g(d) + h(d)`，其中 `g(d)` 是从初始节点 `d_0` 到 `d` 的实际路径成本（已由我们在\
    \ `Open` 过程中定义）；`h(d)` 是从 `d` 到目标节点 `d_t` 的路径成本的启发式估计。\n\n以 8 数码游戏为例来考察选择评价函数的过程（我们已在\
    \ 2.1.4 节讨论过）。我们引入评价函数 `F(d)` 为树中深度（对应函数 `g(d)`）与缺失棋子数（对应函数 `h(d)`）之和。我们看到（图 33），使用这样的评价函数，图上的搜索非常高效并能快速找到解。\n\
    \n让我们对这个例子做一些观察：\n\n- `h(d_t) = 0`，因为根据定义，在目标位置所有棋子都已就位；\n- `h(d)` 不超过从 `d` 到\
    \ `d_t` 所需的最少移动步数；\n- 扩展节点的函数 `F(d)` 值不减小；如果我们仅将函数 `F` 取为树中的深度，即令 `h = 0`，我们仅得到广度优先搜索。\n\
    \n在下一节中，我们将总结并解释这些实验观察。\n\n![带有评价函数 F 的 8 数码游戏搜索图](img/image00353.jpeg)\n\n**图\
    \ 33.** 带有评价函数 `F` 的 8 数码游戏搜索图。\n\n## 3.2. A* 算法的性质\n\nA* 算法具有许多显著且有用的性质，这解释了其广泛的适用性。\n\
    \n"
