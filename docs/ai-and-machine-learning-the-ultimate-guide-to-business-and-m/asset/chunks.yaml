    ]](#part0005.xhtml#_ftn25)viewed from different angles. Ultimately, different\
    \ definitions lead to the same object, although they come from different angles\
    \ and differ in some details. We consider three definitions:\n\n\\-                    \
    \ product systems in their structure;\n\n\\-                     production systems\
    \ from an algorithmic point of view; - Production systems as a logical calculation."
