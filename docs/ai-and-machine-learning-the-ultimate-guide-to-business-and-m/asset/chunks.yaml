    It remains open whether the AND/OR form can be adapted in such a way that the
    resolution of facts and objectives is just as consistent and complete as the resolution
    of facts and rules and the resolution of rules and objectives.


    #### 4.4.8. Metaknowledge in deduction systems


    Rule-based inference systems are good at representing facts, rules, and goals,
    and leave almost complete freedom in deciding what to consider facts, what rules,
    and what goals.


    However, there is very important control knowledge (meta-knowledge) for PSII that
    is difficult to integrate into rule-based derivation systems. We give three typical
    examples of meta-knowledge. Some of them were implicitly applied in the previous
    examples.


    1. Consideration of the possible branching width.


    Suppose there is a set of classification rules in the deduction system. For example
    `dog(x) → animal(x)` `cat(x) → animal(x)`


    and so on, there can be many such rules. Formally, such rules can be applied in
    both forward and backward directions. Which direction is more suitable? It depends
    on the subject, on the type of tasks that the system solves. An expert building
    a deduction system has knowledge of the appropriate direction of application of
    the rules. For example, the examiner knows that the classification rules should
    not be applied as inverse rules. The fact is that applying such rules in the opposite
    direction gives a very large branch width as the target graph grows.


    Such rules should be applied directly.


    If the expert thinks that the classification rules in this deduction system still
    need to be applied in reverse, he should rewrite them in a contra-positive form:


    `¬ Animal (x) → ¬ Dog (x)`


    `¬ Animal (x) → ¬ Cat (x)` and so on.


    2. The order of application of the rules.


    Suppose the deduction system has direct rules of form


    `P → ( Q 1 ∨ … ∨ qk )`


    or reverse rules of the form


    `( Q 1 & … & Q k ) → P`


    Applying such rules enlarges the graph with k arcs. Of great importance is the
    order in which the nodes `Q 1 & ... & Q k` are considered further. For example,
    in a rule-based inverse deduction system for solving inequalities (see Section
    0, Fig. Error! Text of specified style is missing from document. .52 ), after
    applying rule 4, the expression `B > 0` should be considered first, and not the
    expression `A + C > D`. The fact is that this expression is already in the form
    of a fact. The expert understands that when we need a certain fact in order to
    prove it, two cases are possible: either this fact is given in the terms of the
    problem or not. You can''t take a fact out of thin air. When a fact is given (as
    in Example 0), other expressions should be considered in the hope of reducing
    them to given facts. If there isn''t a fact that isn''t confirmed, then you have
    to stop considering other expressions, because considering them yields nothing
    - that k-connection still doesn''t get included in the decision graph.


    This type of information is meta-knowledge that is introduced into deductive systems
    with the help of special techniques. For example with the help of evaluation functions,
    as in production systems.


    3. Conditional application of rules.


    Consider again the example with the solution of inequalities (cf.


    Paragraph 0, Fig. Error! The text of the specified style does not exist in the
    document. .52 ). For reasons of transitivity I want to say that the fact `C >
    O` is superfluous. One is tempted to insert the eighth rule: `x > y & y > z →
    x > z`. A very dangerous rule! The fact is that his right side is always applicable
    and is united with everything in this system. Here two simple variables are connected
    by the only predicate present in the system. Whatever node is in the AND/OR column,
    it can always be unified with the right-hand side of the transitivity rule. And
    this means that such a rule will be used all the time. It can be said that the
    transitivity rule is too applicable! Such rules should not be used directly. They
    can be hidden in the union (as they usually are), or (a very nice solution) we
    can add meta-knowledge to our algorithm by saying that there are rules that can
    be applied whenever applicable, and that there are rules that apply only under
    special circumstances. These are some conditions about the structure of the current
    knowledge base governing the application or non-application of rules. Meta-knowledge
    for transitivity is this: The rule of transitivity can be applied if and only
    if one of the conjunctions on the left is a fact. If this is not the case, goals
    are multiplied by applying the transitivity rule. When this is the case (when
    one of the conjunctions on the left-hand side of the transitivity rule is comparable
    to a fact), then the result is simply movement through the facts. In this case
    the decision tree remains linear. The tree does not branch, but simply winds along
    the transitivity chain, which is necessary for the application of the transitivity
    rule. If used just like that, it generates y which is not known what to do with.
    One can only agree to produce that y if one manages to get rid of x in return.


    The conclusion from the above examples of meta-knowledge is as follows: meta-knowledge
    is not knowledge about the subject for which the inference system is built, it
    is knowledge about knowledge, how to apply and use knowledge about the subject,
    what properties the knowledge has about that subject has, etc.


    The two-stage rule-based deduction system delivers very good results. Such a top-level
    system contains meta-knowledge that is also represented, for example, in the form
    of rules. Facts in a higher-level system are descriptions of the current state
    of the lower-level system. The aim is to build (synthesize) a control strategy
    for a subordinate system. At the second level is the usual reasoning system, whose
    rules, facts, and goals are adopted from the subject. The higher-level system
    determines for the lower-level system in which direction the rules are to be applied,
    in what order the nodes are to be considered, under what conditions the rules
    can be applied, and so on.


    ### CONCLUSIONS ON CHAPTER 4


    1. The first-order predicate calculus with extralogical functions and predicates
    suffices to represent knowledge in all reasonable cases


    2. Evidence-seeking procedures are semipermissive procedures whose effectiveness
    depends on the strategy used.


    3. AND/OR graphs and similar structures can be used to search for inference in
    the same way as in production systems.


    ## CONCLUSION


    In half a century of the development of artificial intelligence, a whole range
    of different approaches to the representation and processing of knowledge have
    been proposed and tested in practice. Among them, three groups, three clusters,
    naturally stand out, differing in the basis used - the formal apparatus used explicitly
    or implicitly in the implementation of specific applications [[71]](#part0005.xhtml#_ftn71).
    These three groups are:


    - production systems based on graph theory;

