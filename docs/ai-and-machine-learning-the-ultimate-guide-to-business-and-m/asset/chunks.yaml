- raw: "3.               Mastery of basic concepts from the field of artificial intelligence\
    \ and knowledge representation; the ability to study other methods of artificial\
    \ intelligence in the literature; the ability to evaluate and use a specific applied\
    \ artificial intelligence system.\n\nArtificial intelligence methods are developing\
    \ and changing very quickly today, and it is impossible to give ready-made recipes\
    \ for all cases of AI application. Instead, the book gives a general overview\
    \ of the basic principles of artificial intelligence, identifying the most common\
    \ ways of representing knowledge in a computer.\n\n# CHAPTER 1.\n\n#  APPLIED\
    \ ARTIFICIAL INTELLIGENCE SYSTEMS\n\nResearchers have long been concerned with\
    \ the problem of human intelligence, although attempts to structure this phenomenon\
    \ of the psyche, or at least to approximate more or less rigorous definitions\
    \ of phenomena and processes that implement human intelligence, are not always\
    \ productive. The authors are not experts in brain physiology or psychology, nor\
    \ will they \"play\" in the field of classical philosophy. Nevertheless (or rather\
    \ \"to support the position\") we allow ourselves a few digressions and quotations\
    \ that illustrate the situation in the areas mentioned.\n\nToday it is generally\
    \ recognized in psychology that there is a certain general intelligence as a universal\
    \ mental cognitive ability that can be based on a genetically determined property\
    \ of the nervous system to process information with a certain pragmatism, speed\
    \ and accuracy. It is believed that many types of human mental activities such\
    \ as programming, mathematics, lecturing or reading such books require intelligence.\n\
    \nUnfortunately, the understanding of what each of us carries on our skulls, by\
    \ and large, can hardly be considered complete enough. If we talk about the structure\
    \ of the brain as a carrier of intelligence, then it is known that the forming\
    \ elements are cells of a special type - neurons. It has been proven that at least\
    \ one of the forms of neuron interaction is realized electrochemically, but the\
    \ question of whether this form is the only one remains open. The current situation\
    \ is reminiscent of a hypothetical Cro-Magnon attempt to understand how a personal\
    \ computer works and what it can do. But what can one say about the brain if we\
    \ can't yet fully understand the mechanics of walking on two limbs.\n\nWe see\
    \ that the term \"intelligence\" for a person is defined indirectly, through the\
    \ specialty, according to some outcomes of the activity, and does not directly\
