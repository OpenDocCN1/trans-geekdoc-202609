- raw: "5.               Algorithm A\\* is unsuitable for the dynamic search case\
    \ . In fact, if the productions or the goal or the weights of the rules are allowed\
    \ to change dynamically during the search, [\\[56\\]](#part0005.xhtml#_ftn56)all\
    \ the arguments of the previous three paragraphs become invalid. The consistency\
    \ of the A\\* algorithm comes from the fact that choosing another path from a\
    \ given node does not depend on how we got to that node. This is not the case\
    \ with dynamic search: the length of the path from the current node to the target\
    \ node can also differ, depending on how we got to the current node.\n\nWhat has\
    \ been said in this section does not mean that algorithm A\\* is worthless and\
    \ should not be used. On the contrary, the A\\* algorithm is the best known solution\
    \ when there is no additional specific information about the properties of the\
    \ problem. If there is additional information, A\\* can and should be modified\
    \ considering a specific task. One of the most elegant modifications is discussed\
    \ in the next section.\n\n### 3.3. SEARCH IN GRAPHICS AND/OR\n\nWhen considering\
    \ decomposable production systems, the concept of AND/OR graphs was introduced.\
    \ In such a graph, the nodes are the states of the database or parts of it, which\
    \ are obtained in two ways: either by applying a rule or by decomposing the database\
    \ into components. This is exactly a graph and not necessarily just a search tree.\
    \ The same vertex d can also appear as a result of decomposing d 1 and applying\
    \ the rule to d 2 . AND/OR graphs are widely used in AI. Search algorithms like\
    \ A\\* are specialized and refined for use with AND/OR graphs. In addition, even\
    \ more efficient algorithms are known for certain special cases of hypergraphs.\n\
    \n#### 3.3.1. Count AND/OR\n\nLet's refine the definitions.\n\nThe AND/OR graph\
    \ is a hypergraph, i.e. a pair consisting of a set of vertices { d } and a set\
    \ of k-arcs, and the k-arc is a pair d  ( d 1 ,…,d k ) , where d is the starting\
    \ node of k -arcs and { d 1 ,…,d k } is the set of ending nodes.\n\nIn terms of\
    \ this definition, an ordinary directed graph is a hypergraph in which every arc\
    \ is a 1-arc. Just as in an ordinary digraph, one can define the notion of a path\
    \ (hyperpath) in a hypergraph.\n\nA hyperpath in a hypergraph is a sequence of\
    \ node sets, <S 1 , …, S n \\>, and for every node d  S i , 1  i  n–1 there\
    \ is exactly one k-arc d  (d 1 , …, d k ) such that  1  j  k\n\n( d j  S\
    \ i+ 1 ) .\n\nThe definition of a hyperpath is a direct generalization of the\
    \ definition of a path, but a hyperpath in a hypergraph looks more like a diagram\
    \ than a single alternating sequence of nodes and arcs. Exactly one k-arc is selected\
    \ from each vertex . Exactly one k -arc is again selected from each vertex obtained,\
    \ and so on.\n\nAmong the various hyperpaths, we are interested in those that\
    \ begin in the initial state of the database and end in final states.\n\nThe decision\
    \ graph G(d 0 , T) is a hyperpath from d 0 to the set of terminal nodes T.\n\n\
    One can give an equivalent recursive definition of the decision graph G ( d 0\
    \ , T ):\n\n1.               if d0 \\_  T , then G = d 0 .\n\n2.              \
    \ if d0 \\_  T , and k-arc d 0  ( d 1 ,…, dk ) starts from d 0 , and there are\
