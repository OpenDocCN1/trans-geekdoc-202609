- raw: "If the rule changes something, we apply it. With polynomials, the final result\
    \ does not depend on the order in which the rules are applied. In fact, the production\
    \ system here contained no conditions - this is an example of a term substitution\
    \ system or a system of paraphrasing rules (term paraphrasing rules) related to\
    \ homogeneous production systems.\n\nA term paraphrasing system is a finite set\
    \ of paraphrasing rules R that defines a binary relation → (reduction relation)\
    \ on the term set.\n\nThe system for rewriting rules R is said to have the Church-Rosser\
    \ property if, for arbitrary terms t 1 and t 2 , the equivalence t 1 \\= t 2 is\
    \ satisfied , and only if there is a unique term t 3 exists such that t 1 → t\
    \ 3 and t 2 → t 3 . In this case, the SPT is called complete or canonical , and\
    \ the result of applying the R-rules to the original formula is called the canonical\
    \ form .\n\nIn this case the system has the Church-Rosser property. This is a\
    \ very powerful, useful and rare property that allows you to automatically solve\
    \ many problems, e.g. Eg checking equality, solving equations, etc. However, not\
    \ all classes of algebraic expressions have canonical forms. There are canonical\
    \ forms for one-variable polynomials and for Boolean formulas that are likely\
    \ to be familiar to the reader. At the same time, for example, there is no normal\
    \ form for elementary functions of mathematical analysis (broken-rational functions,\
    \ logarithm, exponent and their superpositions) [\\[43\\]](#part0005.xhtml#_ftn43).\n\
    \nLet us show the essentiality of the Church-Rosser property by a, at first sight,\
    \ easy complication of the considered example of simplifying algebraic expressions.\
    \ Let's try to simplify the expression x (1+1/ x ), which should result in x +\
    \ 1, for this we need to add a division operation and two rules to our example:\n\
    \n4.               Reduce to a common denominator \n\n5.               Shorten\
    \ the numerator and denominator \n\nIt's easy to see that the result now depends\
    \ on the order in which the rules are applied! The production system is therefore\
    \ no longer commutative. In addition, deadlocks are possible in some cases during\
    \ the search. As a result, one of the paths is not reduced by rules 1-\n\n![](Images/image00349.jpeg)\n\
    \nRice. Mistake!               The text of the specified style in the document\n\
    \nabsence. .29. Dead ends in the search\n\nTo solve this problem related to the\
    \ formation of dead ends, let's add inverse operations:\n\n6.               Take\
    \ it out of the brackets \n\nIf only rule 6 (parentheses) is introduced, then\
    \ there are two mutually inverse rules: opening parentheses and parentheses, which\
    \ means that a loop is possible, ie the Church-Rosser property is not yet satisfied.\
    \ Into the dead end in Fig. error! The text of the specified style does not exist\
    \ in the document. .29 make reducible, rule 7 needs to be added:\n\n7.              \
    \ Expand a fraction \n\n( u \\+ v ) / w \\= u / w \\+ v / w \n\nBut then an endless\
    \ loop may appear, which cannot be detected during an irreversible search (in\
    \ fig. Error! The text of the specified style is missing in the document. .30\
    \ one of the possible loops is circled with an oval).\n\n![](Images/image00350.jpeg)\n\
    \nthirty. Loops when searching\n\nThe conclusion from this example is that the\
    \ commutativity of a production system is a very powerful and useful property\
    \ . One should try to construct commutative systems of production, and in the\
    \ cases where this is not possible, it is worth checking whether it is possible\
    \ to restrict the problem somewhat, but in such a way that it becomes possible\
    \ to construct a commutative system . \n\n#### 2.3.4. Degradable production systems\n\
    \nThe commutativity of the production system offers the freedom to choose the\
    \ rule applied. This is not the only quality that gives such freedom.\n\n(split)\
    \ into a sum of production systems that can be considered independently of one\
    \ another , this is referred to as a decomposable production system .\n\nA good\
    \ example of a decomposable production system are formal generative grammars.\
    \ Let's look at a simple example on this topic. Let there be rules\n\nA→BC\n\n\
    A→CT\n\nC→TT.\n\nto get a string containing only the symbol T from the word AC\
    \ ? Below are the search graphs for regular (Fig. Error! The text of the specified\
    \ style is missing from the document. .31 ) and composite (Fig. Error! The text\
    \ of the specified style is missing from the document. .32 ) production systems.\
    \ In the first case we make all possible transitions from the initial expression.\
    \ In the second case, we first split the original database (word AC ) into two\
    \ parts (word A and word C ) and then create search graphs for each part. Here\
    \ are the complete search graphs and from them it is clear that a solution can\
    \ be obtained. Indeed, in fig. error! The text of the specified style does not\
    \ exist in the document. .31 there are paths (there are three of them, leaf nodes\
    \ are highlighted in color) leading from the start node to the end node, and in\
    \ Fig. Fehler! The text of the specified style does not exist in the document.\
    \ .32 for each of the two parts of the decomposition there is a pair of paths\
    \ leading to the end nodes . The nodes contained in the solution are shown in\
    \ Fig. Fehler! The text of the specified style does not exist in the document.\
    \ .32 circled with an oval.\n\n![](Images/image00351.jpeg)\n\n31\\. Search graph\
    \ for a conventional production system\n\n![](Images/image00352.jpeg)\n\nRice.\
    \ Mistake!               The text of the specified style in the document\n\nabsence.\
    \ .32. Search graph for a decomposable production system\n\nLet's compare the\
    \ numbers in Fig. Error! The text of the specified style does not exist in the\
    \ document. .31 and Fig. Error ! The text of the specified style does not exist\
    \ in the document. .32 it is easy to see that in the first case a lot of unnecessary\
    \ work is done: the result of applying the rules in the left branch leads to a\
    \ dead end. Using the decomposition in this example halves the search graph!\n\
    \nThe basic procedure for a decomposable production system is shown in the Error!\
    \ algorithm. The text of the specified style does not exist in the document. .8\
    \ .\n\nAlgorithm error ! The text of the specified style does not exist in the\
    \ document. .eight. Interpreter of a decomposable production system.\n\nproc split\
    \ (d, R , t )\n\n  := disassemble (d) during Is correct do                             \
    \ for d  do \n\n   if t (d) then  :=  \\\\ {d} end if                             \
    \ end for\n\n  if  =  then return ( OK ) end if                d := SelectD\
    \ (  )\n\n   :=  \\\\ {d} r := choose (d, R )               when r = zero then\
    \ return ( fail ) end if \n\n   :=   Decompose (rf(d)) end while \n\nend process\n\
    \nProduction method , the very first and most general (see Section 0). The Decompose\
    \ procedure decomposes the database into multiple parts (or leaves them as is\
    \ if the database cannot be decomposed in this state). In a sense, this is similar\
    \ to the operation of opening a node, but still different, hence Error in Fig.!\
    \ The text of the specified style does not exist in the document. 0.32 arcs that\
    \ correspond to the extent, not the extent, are highlighted in gray. Also, the\
    \ SelectD function is similar to the Select function , it actually selects a node\
    \ for further work."
  fmt: "\n# 术语重述系统与可分解生成系统\n\n## 术语重述系统\n\n如果规则改变了某些内容，我们就应用它。对于多项式，最终结果不依赖于规则应用的顺序。事实上，这里的生成系统不包含条件——这是一个**项替换系统**或**同态生成系统**相关的**释义规则系统**（术语重述规则）的示例。\n\
    \n**术语重述系统**是一个有限的重述规则集合 `R`，它在项集上定义了一个二元关系 `→`（归约关系）。\n\n如果对于任意项 `t1` 和 `t2`，当且仅当存在唯一的项\
    \ `t3` 使得 `t1 → t3` 且 `t2 → t3` 时，等价 `t1 = t2` 成立，则重述规则系统 `R` 被称为具有 **Church-Rosser\
    \ 性质**。在这种情况下，SPT 被称为**完全**或**规范**的，将 `R` 规则应用于原始公式的结果称为**规范形式**。\n\n在本例中，系统具有\
    \ Church-Rosser 性质。这是一个非常强大、有用且罕见的性质，它允许自动解决许多问题，例如检查相等性、求解方程等。然而，并非所有代数表达式类都有规范形式。单变量多项式和布尔公式可能有读者熟悉的规范形式。同时，例如，数学分析的初等函数（有理函数、对数、指数及其超位）没有正规形式\
    \ [[43]](#part0005.xhtml#_ftn43)。\n\n让我们通过一个乍看之下简单的代数表达式化简示例的复杂化，来展示 Church-Rosser\
    \ 性质的重要性。让我们尝试化简表达式 `x (1 + 1/x)`，结果应为 `x + 1`，为此我们需要向示例中添加除法运算和两条规则：\n\n4. 通分\n\
    5. 约分分子和分母\n\n很容易看出，结果现在取决于规则应用的顺序！因此生成系统不再是可交换的。此外，在搜索过程中某些情况下可能出现死锁。结果，其中一条路径无法通过规则\
    \ 1-5 归约。\n\n![](Images/image00349.jpeg)\n\n**图 29. 搜索中的死胡同**\n\n为了解决与死胡同形成相关的问题，让我们添加逆运算：\n\
    \n6. 括号展开（提取公因式）\n\n如果仅引入规则 6（括号），则存在两条互为逆的规则：展开括号和提取括号，这意味着可能出现循环，即 Church-Rosser\
    \ 性质尚未满足。要使图 29 中的死胡同变得可归约，需要添加规则 7：\n\n7. 展开分数\n\n```\n(u + v) / w = u / w +\
    \ v / w\n```\n\n但随后可能出现无限循环，这在不可逆搜索期间无法检测到（在图 30 中，其中一个可能的循环用椭圆标出）。\n\n![](Images/image00350.jpeg)\n\
    \n**图 30. 搜索中的循环**\n\n从这个例子得出的结论是，生成系统的可交换性是一个非常强大且有用的性质。应当尝试构建可交换的生成系统，在无法做到的情况下，值得检查是否可以在一定程度上限制问题，但要使其能够构建可交换系统。\n\
    \n## 2.3.4. 可分解生成系统\n\n生成系统的可交换性提供了选择应用规则的自由。这不是提供这种自由的唯一品质。\n\n如果一个生成系统可以**分解**为多个可以相互独立考虑的生成系统之和，则称其为**可分解生成系统**。\n\
    \n形式生成文法是可分解生成系统的一个好例子。让我们通过一个简单的例子来看看这个主题。假设有规则：\n\n```\nA → BC\nA → CT\nC →\
    \ TT\n```\n\n如何从单词 `AC` 得到仅包含符号 `T` 的字符串？下面给出了常规（图 31）和复合（图 32）生成系统的搜索图。在第一种情况下，我们从初始表达式进行所有可能的转换。在第二种情况下，我们首先将原始数据库（单词\
    \ `AC`）分成两部分（单词 `A` 和单词 `C`），然后为每一部分创建搜索图。这里给出了完整的搜索图，从中可以清楚地看到可以获得解。确实，在图 31\
    \ 中有路径（共有三条，叶节点用颜色高亮）从起始节点通向终止节点，而在图 32 中，对于分解的两个部分，每个都有一对通向终止节点的路径。包含在解中的节点在图\
    \ 32 中用椭圆圈出。\n\n![](Images/image00351.jpeg)\n\n**图 31. 常规生成系统的搜索图**\n\n![](Images/image00352.jpeg)\n\
    \n**图 32. 可分解生成系统的搜索图**\n\n让我们比较图 31 和图 32 中的数字，很容易看出，在第一种情况下做了大量不必要的工作：左侧分支应用规则的结果导致了死胡同。在这个例子中，使用分解使搜索图减半！\n\
    \n可分解生成系统的基本过程如算法 8 所示。\n\n**算法 8. 可分解生成系统解释器。**\n\n```\nproc split (d, R, t)\n\
    \    Δ := disassemble(d)\n    while Is_correct do\n        for d ∈ Δ do\n    \
    \        if t(d) then Δ := Δ \\ {d} end if\n        end for\n        if Δ = ∅\
    \ then return (OK) end if\n        d := SelectD(Δ)\n        Δ := Δ \\ {d}\n  \
    \      r := choose(d, R)\n        if r = zero then return (fail) end if\n    \
    \    Δ := Δ ∪ Decompose(rf(d))\n    end while\nend process\n```\n\n生成方法，最最初始也最通用的方法（见第\
    \ 0 节）。`Decompose` 过程将数据库分解为多个部分（如果在当前状态下数据库无法分解，则保持原样）。从某种意义上说，这类似于打开节点的操作，但仍有不同，因此图\
    \ 32 中对应于分解而非展开的弧用灰色高亮显示。此外，`SelectD` 函数类似于 `Select` 函数，它实际上选择一个节点进行进一步工作。\n"
