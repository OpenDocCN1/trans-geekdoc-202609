- raw: "Let's say we want the computer to sort a set of numbers in ascending order.\
    \ We humans certainly know how to do this. Think about it, can we teach this to\
    \ a computer, that is, can we represent the necessary knowledge in a computer?\
    \ Let us know in advance that there are three of these numbers and they are equal\
    \ to 3, 5 and 7. You can teach the computer to solve this problem by just writing\
    \ a statement:\n\nWrite(3, 5, 7)\n\nSo we have provided the computer with enough\
    \ knowledge to solve this particular specific problem. Knowledge is presented\
    \ in the form of a single programming language operator.\n\nLet's complicate the\
    \ task. Let there be three more numbers, but their value is arbitrary. Let's write\
    \ a procedure that can sort these numbers in ascending order:\n\nproc Sort3 (x,\
    \ y, z) if x > y then x :=: y end if                if y > z then y :=: z end\
    \ if                if x > y then x :=: y end if \n\n Write (x,y,z) end perc \n\
    \nSo, we taught the computer to solve a fairly large number of tasks related to\
    \ sorting three numbers in ascending order, without making the data set too long.\
    \ In any case, this entry is much smaller than all possible Write statements with\
    \ all possible combinations of arguments [\\[15\\]](#part0005.xhtml#_ftn15). Knowledge\
    \ is presented in the form of a procedure with parameters. In other words, the\
    \ mechanism of procedures in programming languages is already a method of knowledge\
    \ representation. It's just that this is quite an old method, we're used to it,\
    \ and we don't perceive it as a mechanism for representing knowledge.\n\nAnother\
    \ question arises: Where did the Sort3 procedure come from ?\n\nWe can say that,\
    \ as usual, it was invented by a programmer. But we will give a not quite familiar\
    \ answer and show how it is possible to present in the program sufficient knowledge\
    \ for the computer to come up with a procedure similar to Sort3 .\n\nSort3 procedure\
    \ code fragments similar to each other and there are more than two of them, special\
    \ refactoring (transformation of the program text that does not change the function\
    \ performed by the program) should be applied, which is called proceduralization.\
    \ Proceduralization is a refactoring in which repeated or similar fragments of\
    \ a program are replaced by calling a newly introduced procedure. By rewriting\
    \ the procedure Sort3 , by entering the procedure Sort2 we get the procedure Sort3'\
    \ .\n\nproc Sort3' (x,y,z)\n\n sort2(x,y)\n\n Sort2(y,z)\n\n sort2(x,y)\n\n Write\
    \ (x, y, z) end perc proc Sort2(u,v)\n\n if u > v then u :=: v end if End perc\
    \ \n\nBut the Sort2 procedure is formally easy to specify:\n\nx, y { Sort2(x,\
    \ y) } x < y\n\nHere the precondition is written out before the title of the procedure\
    \ (enclosed in curly brackets) and the postcondition after the title. The Sort2\
    \ method is very simple and obviously useful in many cases. It can be assumed\
    \ that this procedure, together with the specification (pre- and post-condition),\
    \ is contained in a library of ready-made procedures available to the compiler.\n\
    \nA precondition is a formal statement about a fragment's input parameters in\
    \ a programming language (e.g., a procedure) that must be satisfied before the\
    \ fragment is executed in order for the fragment to function correctly.\n\nA postcondition\
    \ is a formal statement about the input and output parameters of a programming\
    \ language fragment that is guaranteed to be executed after fragment execution\
    \ is complete if the precondition is met.\n\nThen, using this specification, the\
    \ translator can derive the Sort3' procedure :\n\nx, y, z\n\n{Sort2(x, y)} x <\
    \ y, z\n\n{Sort2(y, z)} y < z, x < z {Sort2(x, y)} x < y < z.\n\nTherefore, we\
    \ made the translation mechanism a little more complicated (allowing for the possibility\
    \ of inferences during translation) and got a system of automatic program synthesis.\
    \ In other words, we didn't compactly write a Sort3 procedure , but a whole class\
    \ of procedures. In this case, knowledge is presented in the form of a set procedure\
    \ and an inference algorithm built into the translator.\n\nIt seems that the terms\
    \ \"knowledge\" and \"process\" are orthogonal. If there is a procedure, no knowledge\
    \ is required - do what the procedure says and the problem will be solved. The\
    \ above example shows that the terms \"knowledge\" and \"process\" (or rather\
    \ algorithm) are not only not opposites, but are in fact inextricably linked.\n\
    \nAny algorithm necessarily contains knowledge, and all knowledge is ultimately\
    \ represented by algorithms. \n\n#### 1.2.3. Solution search algorithms and knowledge\
    \ representation\n\nThe first stage in the development of AI was associated with\
    \ the development of methods for solving problems - algorithms for finding a solution\
    \ and constructing a logical conclusion. Currently, this is already a well-researched\
    \ and studied topic. The most important classical results are presented in the\
    \ third chapter.\n\nFor non-trivial cases, however, the complexity of finding\
    \ a solution is very high. The complexity of finding a solution is a fast-growing\
    \ function (in most cases exponentially or faster-growing) whose argument is the\
    \ total volume of the knowledge base. Considering specific algorithms below ,\
    \ we prove accurate estimates for , but here we informally convince the reader\
    \ of the validity of this remark . The solution sought is a combination of a finite\
    \ number of given elements, of which n . Then there are a total of 2 n \\-1 non-empty\
    \ combinations [\\[16\\]](#part0005.xhtml#_ftn16)if we take elements without repetitions,\
    \ and if we take elements with repetitions then even more. We don't know in advance\
    \ which combination is the solution, this is the search nature of the algorithm,\
    \ which means that in the worst case we have to go through all the combinations!\n\
    \nOne of the ways to reduce the complexity of finding a solution is to change\
    \ the search algorithms to increase their internal efficiency, which does not\
    \ depend on the problem to be solved. However, for many AI-typical problems, their\
    \ NP- completeness has been proven. Creating an efficient (more efficient than\
    \ exponential) algorithm is absolutely incredible to them. If an efficient (e.g.\
    \ polynomial) algorithm is suddenly discovered for a still unexplored AI problem,\
    \ the problem is often no longer qualified as an AI problem and is shifted to\
    \ the area of conventional programming. Therefore, no significant improvement\
    \ in increasing the internal efficiency of search algorithms can currently be\
    \ expected.\n\nA much more productive method to reduce the complexity of finding\
    \ a solution is to increase the efficiency of knowledge representation. If choosing\
    \ a sophisticated representation makes it possible to reduce the size of the knowledge\
    \ base, then the same standard search algorithm becomes much more efficient in\
    \ the sense that the limits of its applicability are expanded. Let's explain this\
    \ with a numerical model example that compares two hypothetical ways of representing\
    \ knowledge. Let the same problem be of size n in the first representation , and\
    \ - n /2 in the second. The enumeration algorithm is the same and has a complexity\
    \ of 2 k , where k is the size of the problem. At the same time, a more compact\
    \ representation is not given for nothing: each step of the enumeration takes\
    \ ten times longer and another 100 time units are irretrievably lost for preprocessing.\
    \ In fact, we are comparing two functions: 2 n and 100 + 10\\*2 n /2 . For small\
    \ n , the first function is smaller, but after n \\= 8 the second function becomes\
    \ smaller, and its benefit only increases with n (Fig. Error! The text of the\
    \ specified style is missing in the document. .9 ). Even a small gain in the value\
    \ of the exponential function's argument outweighs any other losses!\n\n![](Images/image00333.jpeg)\n\
    \n  .9. Comparison of search complexity depending on the compactness of the knowledge\
    \ base"
