- raw: "The solution method is a method for automatic theorem proving based on refuting\
    \ the set of premises A and negating the objective theorem G using the solution\
    \ rule.\n\nConsider the procedure for applying the solution method: Suppose it\
    \ is necessary to find the derivative of A  g\\_ \\_\n\n1.               Each\
    \ formula of formula set A and formula  G are independently converted into sets\
    \ of sets.\n\n2.               Resolvable sentences are found in the resulting\
    \ set of sentences.\n\n3.               The resolution rule is applied to them,\
    \ and the resolution is added to the set until an empty set is obtained .\n\n\
    In this case, the following results are possible:\n\n1.               As a result\
    \ of applying the solving method, an empty formula is obtained. The theorem is\
    \ proved. We constructed the derivation of formula G from formulas A.\n\n2.              \
    \ As a result of applying the solving method, no empty formula is obtained, and\
    \ there are no solvable ones among the current set of sets. We have thus disproved\
