  trans: "\n\n## 2. 过程式响应\n在解决问题时，系统可以创建并执行一个过程（程序综合系统、自动编程）。这是一个非常有趣且极具前景的方向，正吸引着大量研究人员的关注。\n\
    \n## 3. 概念式响应\n答案是一种规律，而非构建出的具体解，而是一类问题的求解方案，甚至可能无法在计算机上实现。目前尚不存在完整的实现。\n\n让我们以第\
    \ 0 段中的数字排序范式为例，给出不同层级的答案示例（请记住，问题如下：我们希望计算机将一组三个数字按升序排列）。\n\n**(0)** `2 5 7`\
    \ → `yes`  \n`5 2 7` → `no`\n\n**(1)** `5 2 7` → `2 5 7`\n\n**(2)** `{ x, y, z\
    \ }?{ x < y < z }` → `Sort3`\n\n### (3) `sort { x i }` → `∀ i, j ( i < j → x i\
    \ < xj )`\n\n在第 0 层级，我们呈现一个序列，系统仅检查其是否已排序。在第 1 层级，我们呈现一个序列，系统会顺从地对其进行排序。在第 2 层级，系统创建一个类似于第\
    \ 0 段所示的排序过程。最后，在第 3 层级，假设的系统会告诉我们对数字数组进行排序意味着什么 [[23]](#part0005.xhtml#_ftn23)。\n\
    \n### 1.4.5. 按普适性程度分类\n\n首先，每一个与特定主题领域相关的知识表示新思想诞生。事实是，在 AI 领域，通常会在发布新思想时至少附带一个具体的实际示例，以展示该创新的优势。如果思想优秀，它会在相关领域找到新的应用，并发展成为面向问题的方法。未来，人们会倾向于使知识表示系统尽可能通用，以解决各种各样的问题。然而，这个愿望在实践中毫无用处，因为随着通用性的增加，此类知识表示的适用性会急剧下降。\n\
    \n让我们更详细地解释一下我们使用的术语 [[24]](#part0005.xhtml#_ftn24)。\n\n**普适性**（给定主题中某知识表示系统的）是指该主题中可表示任务的比例。\n\
    \n因此，我们称在特定主题中允许我们表述所有任务的知识表示方式为**通用**的。\n\n**适用性**（给定领域中某知识表示系统的）是指该领域中可表示问题中能够被求解的比例。\n\
    \n因此，我们称在特定主题中允许我们在考虑实际定量约束的情况下求解所有问题的知识表示方式为**普遍适用**或**完全**的。显然，对于足够广泛的主题领域，既通用又完全的知识表示系统几乎是不可能存在的。此外，观察表明普适性与适用性之间存在反比关系。\n\
    \n用离散状态表示世界并寻找从初始状态到目标状态的变换序列这一概念，具有令人惊讶的广泛适用性。图搜索算法在所有情况下都适用。然而，这种通用性是以极低的搜索效率为代价的。\n\
    \n![普适性与适用性的关系](img/image00336.jpeg)\n\n*注：原文包含标题“Rice. Mistake! The text of the\
    \ specified style in the document absence. .13. Relationship between universality\
    \ and applicability”，这似乎是一个伪影。该图片作为图 13 引用。*\n\n请注意，在实践中，无论是在数据库、应用包还是应用人工智能系统中，通常都不会设定实现通用性的目标。通常的目标是提高适用性，即使以降低通用性为代价。原因非常简单。首先，操纵知识的可能性取决于主题，只有考虑到主题的特性，才能指望建立一个紧凑的知识表示，从而有效地解决问题并提高适用性。其次，通用系统中的元知识（管理策略）较弱；即关于应用某些规则的顺序、解决问题时什么重要什么可以忽略的知识。\n\
    \n### 1.4.6. 按架构和工具分类\n\n在分析带有人工智能元素的应用系统架构时，逻辑上可以将以下部分单独列出：\n\n*   **系统操纵的对象**（其他给定词汇）；\n\
    *   **动作**，由这些操纵产生（可以对这些数据做什么）；\n*   **控制策略**，决定何时执行何种操纵（按什么顺序、对什么对象、应用什么动作）。\n\
    \n这种人工智能系统架构的概念并非教条——它源于对典型现代人工智能系统的分析。高度专业化的系统有时具有不同的架构。这意味着是逻辑分析，而非机器码级别的分析，在机器码级别上架构结构已无法区分。\n\
    \n现在我们谈论这三个组件（特别是如果它们在软件实现中清晰分离）：**数据**（对象属性）、**算法**（面向对象编程意义上的对象方法）和**元知识**。\n\
    \nAI 领域的早期工作就已显示出开发应用系统需要专用工具。这是由人工智能系统软件实现的许多特性决定的，其中一些我们将在第三章讨论。无论如何，开发应用人工智能系统使用过并正在使用各种编程语言和工具，这些工具无法脱离给定系统而存在。AI\
    \ 系统开发中使用的工具是一个分类特征。\n\n## 第一章 结论\n\n1.  **人工智能**是一门具有明确主题的科学——利用计算机科学和数学的各种方法，对被理解为理性行为的思维进行建模。\n\
    2.  人工智能的发展历史表明，重新定向的时期已经结束，实践应用的时代现已来临。\n3.  对人工智能成果的分析表明，对于实际应用最重要的方法是知识表示方法。\n\
    \n# 第二章 通过产生式系统进行知识表示\n\n**产生式系统知识表示**（Production Rules Knowledge Representation）是智能系统中最常用的知识表示机制之一。这种机制在概念上简单，其思想自然易懂且易于在软件中实现。\n\
    \n事实上，人工智能应用与其他软件之间没有明确的界限。产生式系统只是计算机组织信息处理过程的另一种方式。这种方法从根本上区别于常规的过程式和面向对象编程，但并不缺乏特性。\n\
    \n## 2.1. 产生式系统\n\n针对**产生式系统**（或**产生式系统**或**基于规则的系统**），从不同角度提出了几种定义 [[25]](#part0005.xhtml#_ftn25)。归根结底，不同的定义指向同一个对象，尽管它们出发角度不同，在某些细节上也有差异。我们考虑三种定义：\n\
    \n*   **结构上的产生式系统**；\n*   **算法视角的产生式系统**；\n*   **作为逻辑演算的产生式系统**。\n\n"
