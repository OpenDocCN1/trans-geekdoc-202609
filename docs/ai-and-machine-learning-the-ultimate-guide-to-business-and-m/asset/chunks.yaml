  trans: "\n\n# AI AND MACHINE LEARNING: THE ULTIMATE GUIDE TO BUSINESS AND MARKETING\n\
    \n**知识表示 + 解决方案搜索方法**\n\n## 目录\n\n- AI AND MACHINE LEARNING: THE ULTIMATE GUIDE\
    \ TO BUSINESS AND MARKETING\n- 简介\n- 第 1 章. 应用人工智能系统\n  - 1.1. AI 应用一览\n  - 1.2.\
    \ 知识表示在人工智能中的地位\n  - 1.3. 人工智能史\n  - 1.4. 应用人工智能系统的分类\n  - (3) sort { x i } →\
    \ ∀ i , j ( i < j → x i < xj )\n- 第 1 章 结论\n- 第 2 章. 通过产生式系统进行知识表示\n  - 2.1. 产生式系统\n\
    \  - 2.2. 管理策略\n  - 2.3. 特殊产生式系统\n    - 2.3.1 逆向产生式系统\n- 第 2 章 结论\n- 第 3 章. 求解算法\n\
    \  - 3.1. 启发式搜索\n  - 3.2. A* 算法的性质\n  - 3.3. AND/OR 图中的搜索\n  - 3.4. 博弈树上的搜索\n\
    - 第 3 章 结论\n- 第 4 章\n  - 4.1. 归结原理\n  - 4.2. 通过归结原理寻求反驳的策略\n  - 4.3. 获取结果\n  -\
    \ 4.4. 基于规则的演绎系统\n- 第 4 章 结论\n- 结语\n\n## 简介\n\n您可以称本书为“人工智能 = 知识表示 + 解决方案搜索方法”。对\
    \ Niklaus Wirth 所著 *Algorithms + Data Structures = Programs* [1] 的借用是有意为之。由于我们的成长背景、积累的经验和与生俱来的偏好，我们真诚地坚持\
    \ Wirth 等先驱和奠基人的思想；我们经常引用他们，并大量复述他们的观点。\n\n手册素材的选择相当传统，甚至可以说是经典的，但呈现方式完全是作者风格的。首先，我们将应用方面放在首位，即利用人工智能方法在计算机上解决有意义的问题，并以此回答“机器能思考吗？”这一问题——一笑置之。理论脱离实践在我们看来是枯燥的经院哲学，我们予以避免。其次，我们认为，研究如何在计算机中表示“人类”知识，目前比改进过去半个世纪以来被优先考虑的用于寻找解决方案的“机器”算法要重要得多。这就是为什么我们最关注知识表示。第三，我们更倾向于通过示例和短程序进行解释，而非该领域过于盛行的科学形象化描述。我们认为，展示一段解决问题的程序代码，往往比引入编号定义和证明“数学”定理更具说服力。\n\
    \n本书的材料侧重于回答这样一个问题：如何将一个人的知识和技能以计算机程序的形式表达出来。在回答这个技术问题之前，先回答一个思想上的问题很合适：为什么？为什么要在计算机中表示知识？我们的回答很简单：最近这变得廉价了。此外，这相当困难，所以它只是极其有趣。\n\
    \n计算机使用的当前趋势的特点是人工智能 (AI) 方法在软件中的重要性日益增加。你可以称之为一个持续的过程：“计算机的智能化” [[1]](#part0005.xhtml#_ftn1)。我们心目中有以下无疑的趋势：计算机在发展初期是“大型计算机器”，而现在单词\
    \ computer 中的词根“计算器”已经是一个时代错误。现代计算机是一种以数据形式处理呈现知识的信息机器。这一趋势由 `Error! Source not\
    \ found.` 的直方图表示，其中我们展示了如今与半个世纪前用于技术计算和知识处理的计算资源之间的关系。工程计算是火箭飞行计算、工资单计算等应用的统称，知识处理是互联网信息检索、电信等\
    \ [[2]](#part0005.xhtml#_ftn2)。请注意，该图中的百分比数值和比例相当随意。事实上，人类可用的计算能力在半个世纪里增长了超过 `10¹⁰`\
    \ 倍，而不是图中显示的四倍。计算资源的增长率超出了我们的想象；人类从未经历过这样的事情。这股快速增长的算力中，越来越大的部分被用于知识处理！\n\n![图\
    \ 0.1 计算资源随时间的重新分配](img/image00324.jpeg)\n\n从一开始，计算机科学中的人工智能方向就引起了极大的、甚至是不健康的兴趣。不择手段的记者们渲染夸大新思想的胆怯雏形，并提出了不合理的公众期望，当最初的理论结果无法证明夸大的期望时，这些记者又参与嘲笑人工智能的思想。但在\
    \ 21 世纪，情况发生了变化。最近，该方向取得的结果已超出学术实验性开发的框架，并开始应用于实际应用中。人工智能系统在现实生活中有着有意义的用途，从医学诊断到航天器控制；对此可以有不同看法，但无法否认。因此，“知识处理方法”、“应用人工智能”等课程已成为计算机科学家培养课程中实际上的必修课。\n\
    \n从事科学密集型应用领域的应用数学工程师和计算机科学家，必须掌握人工智能研究中开发的用于解决枚举问题的基本、成熟方法。\n\n应当强调的是，这些用于计算机知识传递方法的基本形式化手段，对解决枚举问题的方法的实际适用性起着决定性作用。因此，知识表示方法是人工智能方向的核心。这一核心内容是初学者和经验丰富的工程师所不可或缺的，也是本书的主题。\n\
    \n我们期望修读本课程的学生达到以下成果：\n\n1.  **掌握** 解决算法复杂问题的最重要方法；了解这些方法的比较优缺点；了解最著名的知识表示方法的基本原理：产生式规则、谓词演算公式、语义网络。\n\
    2.  **具备** 在简单情况下为给定任务选择合适的知识表示方式的能力；具备评估将某种求解方法应用于特定问题的适当性的能力。\n\n"
