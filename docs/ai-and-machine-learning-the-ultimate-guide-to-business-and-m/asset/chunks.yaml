    # 让我们考虑一个简单的模型示例，解释 α - β 剪枝的基本思想


    假设有一个游戏，其搜索子树如图所示！未找到源。（左侧）。假设我们只展开并评估了相关节点的左子树（它只有一个位置，得分为 7）。由于 Max 玩家总是选择评估函数值最高的节点，因此无论右侧未展开的子树如何，根位置的估值都
    ≥ 7。现在考虑 Min 玩家的着法选择（图 错误！文档中缺少指定样式的文本 .46，右侧）。只揭示了两个可能位置中的一个（其得分为 4）。由于 Min 玩家选择函数值最小的节点，因此所选着法的得分
    ≤ 4。


    ![](img/image00365.jpeg)


    图. 错误！文档中缺少指定样式的文本 .46. 游戏的子树


    让我们继续这些思考，看看图 错误！文档中不存在指定样式的文本 .47。


    ![](img/image00366.jpeg)


    图. 错误！文档中缺少指定样式的文本 .47. 特定游戏子树剪枝示例


    在考虑了对应于 Min 着法的节点的右子树后，已知其得分不会超过 4。然而，查看左子树的一部分，发现其根节点的得分将 ≥ 7。这意味着左子树中节点的进一步展开毫无意义，因为
    Min 玩家已经有一个已知的最佳选择。因此，左子树的其余部分被截断。


    上述示例形式化如下。


    设 α 为给定节点分数值的下界，β 为该节点分数值的上界。


    请注意，随着节点的展开，Max 节点的 α 值不会减小，Min 节点的 β 值不会增大。因此，适用以下规则。


    1.  Min 节点，如果其上界 β 小于或等于其任意 Max 父节点的下界 α。

    2.  Max 节点，如果其下界 α 大于或等于其任意 Min 父节点的上界 β。


    请注意，用于测试的剪枝不等式公式在形式上是相同的：第一种情况 β ≤ α，第二种情况 α ≥ β，但这些公式含义不同。


    在第一种情况下，我们获取刚刚为 Min 节点得到的估值 β，并将其与上方 Max 节点的估值 α 进行比较。在第二种情况下，我们获取刚刚为 Max 节点得到的估值
    α，并将其与上方 Min 节点的估值 β 进行比较。但在两种情况下，不等式的满足都是截断的依据。


    图 错误！文档中不存在指定样式的文本 .48 显示了一个井字棋游戏示例。


    ![](img/image00367.jpeg)


    48. α - β 井字棋剪枝


    生成和评估过程如下。首先，生成第二层的三个节点。然后在左子树中创建五个第三层节点，并为第二层节点获得 -1 的得分。在这种情况下，第一层根节点的下界估值 α
    = -1 可以立即确定。接下来，开始生成中间子树中的第三层节点。第一个节点的估值为 -1，给出上界估值 β = -1 并满足剪枝不等式。我们看到第三层有四个节点无需生成——它们的生成不会改变其余节点的估值。右子树中没有发生剪枝——不等式未得到满足。


    ## 3.4.4. α - β 剪枝的效率


    α - β 剪枝的效率如何？让我们尝试回答这个问题。在分析的示例中，我们节省了 16 个节点中的 4 个，即 25% 的工作量。这个指标有限制吗？它总是能达到吗？


    让我们先回答第二个问题，这比较容易。答案：


    不，并非总是如此。事实上（在最坏情况下！），Min 节点的子节点按降序生成，Max 节点的子节点按升序生成。例如，如果在图 错误！文档中不存在指定样式的文本
    .48 中，中间子树的第三层节点按此顺序生成：0, 0, -1, -1, -2，则仅剪枝两个节点（节省 12.5%）；如果评估函数失效，估值为 0, 0,
    0, 0, 0，则完全不会发生剪枝。


    现在回答第一个问题：在最佳情况下 α - β 剪枝能产生什么效果？所讨论树的深度（不剪枝）为 h，每个节点恰好有 d 个子节点。那么底部恰好有 N = d^h
    个节点。假设（最佳情况！）为 Min 节点按评估函数值升序生成顶点，为 Max 节点按降序生成。


    可以证明，使用 α - β 剪枝生成的节点数相同：


    N = O ( d^(h/2) ) = { d^((h+1)/2) + d^((h-1)/2) - 1 如果 h 为奇数; 2 * d^(h/2) - 1
    如果 h 为偶数 }


    因此，我们问题的答案如下：在理想情况下，α - β 方法使搜索深度比极大极小算法增加一倍，且在任何情况下结果都不会更差。


    因此我们看到，生成位置的顺序和考虑着法的顺序是编程智力游戏的关键因素之一。不幸的是（或者也许是幸运的是？），没有通用的调度方法。所有游戏程序中的枚举方法大致相同，类似于上述描述的方法（很久以前就已发表并被充分研究），但每个游戏考虑着法顺序的启发式方法各不相同（构成了游戏程序作者的专有技术）。


    实践表明，游戏程序的强度与搜索深度成正比。例如，初学者棋手很少向前搜索超过三四步。这意味着初学者的搜索树深度约为 3。国际象棋大师在脑海中构建十几个半回合的树，如果计划着强制变着，则更多。特级大师和冠军看得更远，达二十几个半回合。因为他们处于中局，已经能预测残局。


    现代国际象棋程序利用计算机能力的巨大提升，构建并评估包含数百万个位置的巨大游戏树。为什么人类有时仍不输给计算机？[[59]](#part0005.xhtml#_ftn59)事实是，人类棋手在脑海中构建的树要窄得多。在复杂的国际象棋局面中，强手立刻能从二十几个可能的着法中看出
    2-3 个最佳着法，并只详细分析计算这些着法。而国际象棋程序即使使用像 α - β 剪枝这样最著名的技巧，平均也只能舍弃一半的可能着法。如果我们有条件地假设人类游戏树中的分支因子恒定等于
    2，程序恒定等于 10，那么使用极大极小算法搜索深度 10 时，人类必须查看 2¹¹ = 2048 个位置，而程序需查看 10¹¹ = 100,000,000,000
    个项目。


    ### 第 3 章 结论


    1.  存在多种寻找解决方案的算法，也适用于生成系统。每种算法都有其最有效和有用的应用领域。

    2.  在人工智能中，启发式算法用于寻找解决方案，算法的效率关键取决于评估函数的质量，评估函数实际上决定了启发式信息。

    3.  有向图和图（树）AND/OR 最常用于表示搜索空间。


    # 第 4 章

