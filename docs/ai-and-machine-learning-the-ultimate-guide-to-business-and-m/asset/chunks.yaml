    and forming a response to a perceived stimulus was Frank Rosenblatt ''s perceptron
    . Perceptron was not considered by its author as a specific technical computing
    device, but as a model of the brain. It should be noted that after several decades
    of research, modern work on artificial neural networks rarely pursues such a goal.


