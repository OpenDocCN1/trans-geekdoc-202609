- raw: "2.               According to the data, there is no direct link between the\
    \ rules . The rules don't say anything, all the data is in database D .\n\nAn\
    \ important conclusion follows from this – the rules are functional and information-rich\
    \ modules .\n\nIn an applied system with elements of artificial intelligence,\
    \ modularity is crucial, since in such programs the action algorithm is often\
    \ not clear in advance. So you need modifiability to try different ways to solve\
    \ the problem. This is exactly what can be achieved with production systems, since\
    \ we can add and remove rules in set R without affecting the other rules in any\
    \ way! In addition, in the limit one can dynamically modify the set R , directly\
    \ in the process of solving the problem.\n\nGlenford Myers recommends only the\
    \ two highest strength classes of modules for use in software development.\n\n\
    A functionally strong module is a module that only performs (implements) a specific\
    \ function.\n\nSuch a module can use other modules when implementing this function.\n\
    \nAn information-persistent module is a module that performs (implements) multiple\
    \ operations on the same data structure (information object) that is considered\
    \ unknown outside of that module.\n\nFor example, an information-safe module can\
    \ implement an abstract data type or class in object-oriented programming.\n\n\
    A module's cohesion is a measure of its data dependency on other modules.\n\n\
    The coupling of modules is characterized by the type of data transmission. The\
    \ weaker the coupling of a module with other modules, the stronger its independence\
    \ from other modules. To assess the degree of linkage, Myers proposed an ordered\
    \ set of different types of module linkages. The worst type of module chaining\
    \ is content chaining . This is the concatenation of two modules when one of them\
    \ has direct references to the content of the other module (e.g. to a constant\
    \ contained in the other module). This type of module coupling is not recommended.\
    \ Shared area chaining is a concatenation of modules where multiple modules share\
    \ the same memory area [\\[30\\]](#part0005.xhtml#_ftn30). The best type of module\
    \ chaining recommended for use by modern programming technology is parametric\
    \ chaining \\- this is the case when data is passed to one module, either when\
    \ accessed as argument values, or as a result of calling another module to evaluate\
    \ any function. This type of module chaining is implemented in programming languages\
    \ by calling procedures and functions.\n\n#### 2.1.3. Algorithm of the system\
    \ of heterogeneous products\n\nImagine a kind of AI application that returns the\
    \ simplest result, namely only a yes/no answer (level 0, see Section 1.3.5.) corresponding\
    \ to whether the termination condition t ( d ) is satisfied or not. At the same\
    \ time, we believe that the order in which the rules are applied is not of interest\
    \ to us. The positive answer \"yes\" is referred to as OK in the programs below\
    \ , the negative answer as \"no\" - not passed . In this case, the operation of\
    \ the production system is stopped by the algorithm error               !              \
    \ The text               of the specified style does not exist in the document.\
    \ .one.\n\nAlgorithm error ! The text of the specified style does not exist in\
    \ the document. .one. Interpreter for production systems.\n\nproc production(d,\
    \ R , t ) during  t (d) do  \n\nr := selection(d, R )\n\n  when r = zero then\
    \ Return ( Fail ) end if                d := rf (d)               end while               \
    \ return ( OK ) end perc \n\nThis algorithm takes as input the initial state of\
    \ the base d , the set of productions R , and the termination condition t . Furthermore,\
    \ until the termination condition is met, the applicable rule is selected with\
    \ the Select function and the status of the database is changed with its help\
    \ until the termination condition is met. If no applicable rule is found, the\
    \ process is aborted and a negative response is returned.\n\nThe Select function\
    \ is the heart of this system, it determines the choice of the applied rule, i.e.\
    \ the strategy of the production system C. Usually in an artificially intelligent\
    \ system there is not enough information to apply the best rule at each step.\
    \ Therefore, the process of selecting a rule is a search process .\n\nFor example,\
    \ the crudest search strategy is the \"first fit\" presented in the Error! algorithm.\
    \ The text of the specified style does not exist in the document. .2. Examples\
    \ of more elaborate strategies are given below.\n\nAlgorithm error ! The text\
    \ of the specified style does not exist in the document. .2. First-Fit Rule Selection\
    \ Strategy.\n\nprocSelect (d, R )\n\n for r  R do   if rp(D) then return (r)\
    \ end if                End to the                return ( null ) end perc \n\n\
    This is a good example of a bad strategy. It's hard to expect intelligence from\
    \ a machine unless we put some of our own intelligence into it . \n\nLet's take\
    \ a closer look at the production system from an algorithmic point of view. In\
    \ fact, the algorithm error! The text of the specified style does not exist in\
    \ the document. .1 We have defined and documented a way of interpreting knowledge\
    \ presented as a series of productions. Algorithm error! The text of the specified\
    \ style does not exist in the document. .1 is purely mechanical in nature, it\
    \ has no signs of \"intelligence\", neither artificial nor natural, it simply\
    \ executes a set of rules R on the input data d , without any analysis of the\
    \ base's state change history, without evaluating whether we are moving towards\
    \ or moving away from a solution. Ordinary computers behave the same way: they\
    \ mindlessly run the embedded program and don't try to understand if what they're\
    \ doing makes sense at all. In other words: algorithm error! The text of the specified\
    \ style does not exist in the document. .1 is an emulator virtual machine, and\
    \ the set of R rules is a program for that machine. The select function has a\
    \ special place . In this function lies the \"intelligence\", i.e. conceptual\
    \ knowledge in the terminology of section 1.3.2. This function is intended to\
    \ direct the calculation process (basic transformations) to a solution, while\
    \ the algorithmic knowledge concentrated in the set of rules R lives separately\
    \ and is not responsible for anything.\n\n#### 2.1.4. Production system as a logical\
    \ calculation\n\nThe word \"production\" in artificial intelligence itself comes\
    \ from logic and not in the most direct way. The rule of production or inference\
    \ is a logical rule that says that if we have premises of a certain type, then\
    \ a conclusion follows, also of a certain type. For example, the modes ponens\
    \ rule states that the conclusion is true if two premises are true: the statement\
    \ A and the implication that says B follows from A\n\nB. \\_ In formulaic notation,\
    \ such a rule is written as follows:\n\nA , A  B\n\nB\n\nFrom the point of view\
    \ of mathematical logic, the production system can thus be viewed as a formal\
    \ theory (the concept of a formal theory is described in detail in Section 4.1.1).\
    \ In this formal theory:\n\n\\-                     the initial fact base is part\
    \ of a set of axioms (problem-oriented [\\[31\\]](#part0005.xhtml#_ftn31)) of\
    \ a formal theory of the form  A ( c 1 ,..., c k ), where A is a predicate symbol\
    \ (usually associated with a property of objects of the subject under consideration)\
    \ - and all c i are constant terms;\n\n\\-                     Products is an\
    \ addition to a number of problematic\n\noriented axioms in an implicit form of\
    \ the form  d & p ( d )  \n\nM ( f ( d )), moreover, the predicate p over the\
    \ fact set d is a kind of “trigger” of production, and the notation M ( f ( d\
    \ )) sensibly means that the execution of actions occurs on the fact basis D (base\
    \ modification ) is initiated, defined by the function f : D  D , and successful\
    \ execution of these actions sets the predicate M () to true ;\n\n\\-                    \
    \ the only rule of inference is the rule Modes ponens already mentioned;"
