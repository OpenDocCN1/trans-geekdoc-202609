  fmt: "\n# 术语的自然性、定义的唯一性与解释的唯一性\n\n让我们从图开始谈起，更具体地说，是从一类对于理解本书主题至关重要的类——**有向树类**开始。让我们自问：树是向上生长还是向下生长？当然，脑海中浮现的第一个答案是“向上”，但这真的那么显而易见且正确吗？如果你倒立着（改变坐标系）呢？或者记住根（着眼大局）呢？最后，你可以轻易地重新定义“顶”和“底”的概念，互换它们的含义（例如基于表示先前未知大小对象的便利性）。\n\
    \n此类例子不胜枚举，它们只能证明一点——方向（及其命名）是非常相对的，每当上下文不明确时，就有必要固定参考系。\n\n## 2.2.1. 策略比较准则\n\
    \n既然策略不同，就需要比较它们的准则。这里有许多我们认为有吸引力的比较准则。\n\n图 2.17 展示了一些控制策略选项。这里使用了两个准则：\n\n-\
    \ 在寻找解的过程中已获得的信息中，有多大比例被存储以供后续使用；\n- 允许回溯的程度如何（数据库不是转移到新状态，而是转移到旧状态之一）。\n\n注意这些准则实际上并不完全独立。事实上，为了将数据库恢复到已通过的状态之一，至少有必要存储关于已通过状态的信息。\n\
    \n**图 2.17. 控制策略选项**\n\n显然，前面给出的“首次适配”策略（见第 0 节，算法 2.2）是最简单的，对应图 2.17 中策略层级的左下角。该策略属于**不可逆搜索策略**组。\n\
    \n除了不可逆搜索，本书还涵盖了另外两个流行的策略组：\n\n1. **图搜索**：存储所有可用信息，允许任意回溯，甚至回到初始状态。\n2. **回溯法**：一种折中方案，保留部分而非全部信息，使用回溯但非任意回溯。\n\
    \n任何策略都可以用两个标准来评估——**选择规则的成本**和**应用规则的成本**。在这种情况下，当然存在两种极端情况——愚蠢但快的策略，以及聪明但慢的策略。过快的策略不花太多时间挑选规则，而是立即运行并应用它们。但这可能是朝错误方向的奔跑，导致盲目应用规则的成本增加。过聪明的策略在截断并应用规则前反复衡量。也许这是一条直指要害的好规则，但在挑选它之前花费的时间成本又是多少？一如既往，存在一个使整个过程总复杂度最小的“黄金中间点”（图\
    \ 2.18）。关键在于，在这两种情况下，成本都不是线性增长，而是更快，即成本函数是向下凸的，如图 2.18 所示，因此这类函数之和必然存在最小值。成功策略的全部艺术就在于在每一种情况下都能找到那个最小值。\n\
    \n**图 2.18. 管理策略应用成本的组成部分**\n\n## 2.2.2. 不可逆搜索\n\n**不可逆搜索**顾名思义，是指我们不返回数据库之前状态的搜索算法，这意味着我们无法存储关于那些状态的任何信息。\n\
    \n不可逆搜索最简单的情况是上文第 0 节描述的“首次适配”策略。在这种情况下，搜索是盲目的、随机的，结果在很大程度上取决于规则在检查中被遍历（从而应用）的顺序。如果我们对问题和搜索空间一无所知，就不应指望“首次适配”策略能给出好结果。\n\
    \n正如在其他情况下一样，可以在不可逆搜索中引入评价函数 `F : D → ℝ⁺`，其中 `ℝ⁺` 是非负实数集。记录 `F(d)` 是数据库状态 `d`\
    \ 的**估计值**。函数 `F` 的选择方式使得该函数在终端节点（满足终止条件的那些数据库状态）处取最小值 `t(dk) = def F(dk) = min\
    \ { d ∈ D | F(d) }`。\n\n选择实现“首次适配-归约-估计”策略的函数，如算法 2.3 所示。显然，这种策略至少不比“首次适配”策略差，如果评价函数选择得当，这种策略会好得多。\n\
    \n**算法 2.3. “首次适配-归约-估计”规则选择策略**\n\n```\nproc Choose(d, R)\n  for r ∈ R do\n \
    \   if rp(d) & F(rf(d)) ≤ F(d) then\n      return (r)\n    end if\n  end for\n\
    \  return (nil)\nend proc\n```\n\n可以通过选择一条不仅减少估计值，而且减少幅度最大的规则来改进该方法。这种策略通常称为**最速下降法**或**梯度法**，属于**贪心搜索算法**类。算法\
    \ 2.4 展示了最速下降法的最简单实现。\n\n**算法 2.4. “最速下降”规则选择策略**\n\n```\nproc Select(d, R)\n\
    \  m := F(d)\n  r' := nil\n  for r ∈ R do\n    if rp(d) & F(rf(d)) < m then\n\
    \      r' := r\n      m := F(rf(d))\n    end if\n  end for\n  return (r')\nend\
    \ proc\n```\n"
