    \ `transfer`（转换）。转换规模大，使用海量信息资源和非常复杂的算法。最后，基于目标语言的转换结构在目标语言中合成文本（它们不一定与源语言的结构同构！）。当然，转换阶段是最复杂、最重要且知识密集度最高的。\n\
    \n**图 3 机器翻译系统的结构**\n\n但半个世纪前人类对机器翻译的梦想在很大程度上仍是梦想——对最多样化主题文本的高质量（“艺术性”）翻译仍然无法实现。然而，无可争议的是，使用机器翻译系统加快了翻译工作的速度并提高了质量。\n\
    \n随着越来越多旨在计算机翻译文本信息的新算法、技术和软件解决方案的出现，可靠的事实是：与传统人工翻译相比，此类系统具有许多优势：\n\n- **翻译速度高**（根据现代估计，使用机器翻译可以将翻译大量文本所需的时间减少\
    \ 50-70%）；\n- **降低翻译成本**（借助机器翻译，可以节省专业翻译人员的服务成本，翻译“简单”文本时甚至可以完全不用他们）；\n- **待翻译信息的保密性**（计算机参与机密文件处理，比翻译人员参与在更大程度上保证其内容不泄露）。\n\
