- raw: "This is not the only way to reduce predicate calculus formulas to theorems,\
    \ there are other equivalent ways. The reduction to propositions is not logically\
    \ equivalent, but the following assertion is true, which we give without proof.\n\
    \nset . Those formulas that are obtained by reducing the original formulas to\
    \ sets form an inconsistent set if and only if the original set of formulas does\
    \ not hold .\n\nLet's consider examples of reducing first-order predicate calculus\
    \ formulas to propositions using the sequence of actions given above.\n\nLet's\
    \ reduce the formula to sentences:  x (P(x)  y Q(x, y)).\n\n1)             \
    \  x (  P ( x )  y\\_ \\_ Q ( x , y ))\n\n2)              Formula unchanged\n\
    \n3)              Formula unchanged\n\n4)              x \\_  y (  P ( x ) \
    \ Q ( x , y ))\n\n5)               x (  P ( x )  Q ( x , f ( x )))\n\n6)             \
    \ P ( x )  \\_ Q ( x , f ( x ))\n\n7)              Formula unchanged\n\n8)             \
    \ Formula unchanged\n\nNow let's reduce the negation of the previous formula to\
    \ theorems:  x ( P ( x )  y Q ( x , y )).\n\n1)                x (  P (\
    \ x )  y\\_ \\_ Q ( x , y ))\n\n2)               x ( P ( x ) &  y (  Q (\
    \ x , y )))\n\n3)              Formula unchanged\n\n4)              x \\_  y\
    \ ( P ( x ) &  Q ( x , y ))\n\n5)               y ( P ( a ) &  Q ( a , y ))\n\
    \n6)              P ( a ) &  Q ( a , y )\n\n7)              Formula unchanged\n\
    \n8)              P ( a ),  Q ( a , y )\n\n#### 4.1.4. resolution rule\n\nThe\
    \ solving method uses not only a special kind of formulas, but also a special\
    \ inference rule.\n\nThe solution rule is the rule for deriving a new formula\
    \ (theorem) from two theorems. Resolution \\- A new proposal resulting from the\
    \ application of the resolution rule.\n\nThe resolution rule applies only to sentences\
    \ containing opposite -equal literals ( P and  P ) and is as follows. Given two\
    \ sentences (which contain counter-unifying literals), a new sentence can be derived\
    \ from that pair of sentences by combining the original sentences and eliminating\
    \ (eliminating) the counter-literals:\n\n![](Images/image00368.jpeg)P  Q 1 \
    \  Q n ,  P  R 1   R m .\n\nQ 1   Q n  R 1   R m\n\nRemember\
    \ that we really like to write the inference rules \"multi-story\", ie like this:\
    \ the premises ( antecedent ) of the rule are placed above the line, the conclusion\
    \ ( succedent ) is placed below the line.\n\nThe resolution is the union (more\
    \ precisely, the disjunctive union) of all literals except for a pair of opposites.\
    \ In this case, both the index n and the index m can have any value. In particular,\
    \ if sentences are resolved that contain only contraliterals, then the resolution\
    \ is an empty sentence . Note that by definition, an empty sentence is considered\
    \ identically false.\n\nThe resolution rule is a very powerful rule! Many rules\
    \ (such as modus ponens [\\[65\\]](#part0005.xhtml#_ftn65)) are particular manifestations\
    \ of the resolution rule. Table 4.1 below shows some well-known rules in the traditional\
    \ form and written in the constraints of the resolution method when premises and\
    \ conclusions are non-quantifier disjunctions of literals. These examples show\
    \ that the resolution rule is no weaker than the traditional ones, and anything\
    \ that can be derived in the traditional way using modus ponens can also be derived\
    \ using the resolution rule!\n\ntable error !               The text of the specified\
    \ style in the document\n\nabsence. .2. Traditional and resolving form of inference\
    \ rules\n\nRule Name Traditional Form Operational Form\n\nmethod setting AA ,\
    \ B A ,  AB \n\nB B\n\nA BB ,  C \\_ \\_  AB ,   BC \n\nA → C → AC\n\nMerger\
    \ ABA  ,  B AB  ,   AB \n\nB B\n\nThe settlement rule alone forms a complete\
    \ and consistent set of rules (see point 0). Let us prove this assertion for the\
    \ case of the propositional calculus by giving suitable simplified definitions.\n\
    \nAn inference rule is consistent if the conclusion is a logical consequence of\
    \ the premises.\n\nSentence. The resolution rule is consistent .\n\nprove. Let\
    \ I be any interpretation, C 1 and C 2 are sentences that are resolved according\
    \ to the resolution rule, P is the literal that is resolved. For clarity, assume\
