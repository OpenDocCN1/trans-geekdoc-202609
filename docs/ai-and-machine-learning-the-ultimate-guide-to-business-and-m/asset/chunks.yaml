- raw: "We present the classical unification algorithm proposed by Robinson (Algorithm\
    \ 4.1) in a somewhat simplified formulation. We immediately note that this algorithm\
    \ is far from the most efficient of them that is currently known. The input of\
    \ the algorithm are two expressions A and B written in prefix (functional) form,\
    \ the output is false if the expressions are not unified, or the value is true\
    \ and NOU  .\n\nAlgorithm error ! The text of the specified style does not exist\
    \ in the document. .fourteen. Union of two formulas.\n\nproc Unify ( in A, B;\
    \ out  ): boolean\n\n  :=   while doing A  B \n\n  \\[A',B'\\] := FirstNeqTerms(A,\
    \ B)               if  IsSubst(A',B',t,v) then back ( wrong )                           \
    \ End if\n\n   :=  {t//v}\n\n A := Subst(A, t, v) B := Subst(B, t, v) end while \
    \               return ( true ) end perc  \n\nThis algorithm uses the following\
    \ functions and operations.\n\n1.               The FisrtNeqTerms function compares\
    \ its arguments from left to right and finds the first subformulae in which the\
    \ compared formulas differ. For example, if you compare the formulas P ( x , f\
    \ ( a )) and P ( g ( b ), y )), the FisrtNeqTerms function returns the pair \\\
    [ x , g ( b )\\].\n\n2.               The IsSubst(A',B',t,v) function checks whether\
    \ the first argument pair A' and B' forms a valid substitution, ie whether one\
    \ of these arguments is a variable v and the second is a formula t using this\
    \ variable v does not contain . For example, if the first and second arguments\
    \ of the function are x and g ( b ), respectively, the function returns true with\
    \ the third argument t set to g ( b ) and the fourth argument v set to x .\n\n\
    3.               The Subst(A, t, v) function replaces the formula t in formula\
    \ A for all occurrences of the variable v . For example, if the function arguments\
    \ are P ( x , f ( a )), g ( b ), x , then the result of the function is the formula\
    \ P ( g ( b ), f ( a )).\n\n4.               The operation  is a composition\
    \ of substitutions. Its execution consists in applying all substitutions of the\
    \ right argument to all substitution formulas of the left argument, after which\
    \ the sets of substitutions are combined and the matching and trivial substitutions\
    \ are removed.\n\nLet's consider an example – protocol of Algorithm 4.1 for a\
    \ pair of formulas P ( a , x , f ( g ( y ))) and P ( z , f ( z ), f ( u )). In\
    \ this example, the current values of variables A and B are written on each row,\
    \ with mismatched subformulae found by the FirstNeqTerms function underlined.\
    \ The constructed unifier is written out on the right.\n\nP ( ein , x , f ( g\
    \ ( y ))) P ( z , f ( z ), f ( u ))                               = { ein //\
    \ z }\n\nP ( a , x , f ( g ( y ))) P ( a , f ( a ) , f ( u ))                           \
    \  = { a // z, f ( a )// x }\n\nP ( a , f ( a ), f ( g ( y ) )) P ( a , f ( a\
    \ ), f ( u ))                = { a // z, f ( a )// x, g ( y )// u } P ( a , f\
    \ ( a ), f ( g ( y ))) P ( a , f ( a ), f ( g ( y )))\n\nWe see that the algorithm\
    \ is ready in just four steps and finds the most common unifier. However, one\
    \ should not delude oneself into thinking that the task of unification is an easy\
    \ task. In fact, all the \"elementary\" operations used in this algorithm - finding\
    \ mismatched subformulae, checking the admissibility of a substitution, performing\
    \ a substitution, and even computing the composition of substitutions - are by\
    \ no means elementary in implementation, and their actual complexity depends substantially\
    \ on the selected representation of formulas. Meanwhile, the representation of\
    \ formulas for Algorithm 4.1 is undefined.\n\nConsider another unification algorithm\
    \ where the formula structure is more explicitly fixed. Regarding the considered\
    \ method of resolution, we need to check the unification of atomic formulas, the\
