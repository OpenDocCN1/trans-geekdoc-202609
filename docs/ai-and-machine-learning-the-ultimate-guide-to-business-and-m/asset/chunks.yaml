    **"black box"** cybernetics does not care how the "thinking" device works. The
    main thing is that it reacts to the given input actions in the same way as the
    human brain, i.e., rationally.


    Researchers in this field immediately switched from highly complex parallel nondeterministic
    neurocybernetic networks to relatively simple algorithmic models that manipulate
    abstract symbols rather than real-world signals. That''s why we prefer the term
    **symbolic AI** (see fig. Error! Text of the specified style is missing in the
    document. .10).


    The most notable pioneering work in this direction was the `Logic Theorist` program
    developed by A. Newell, G. Simon, and J. Shaw in 1955–1956. Working in the field
    of automatic theorem proving, the program was able to automatically find the derivation
    for 38 of the 52 propositional calculus theorems given in Russell and Whitehead''s
    seminal book *Principia Mathematica*. In addition, in one case a shorter proof
    was found compared to the original.


    So many different and sometimes surprising opinions and assessments have been
    expressed in the literature about this undoubted achievement that we consider
    it permissible to give our conclusions on universal programs for automatic proving
    of theorems, and therefore on universal mental programs, using the example of
    the logic-theoretical program in general (see also paragraph 0).


    1. **Automatically proven theorems contain no new mathematical insights:** in
    the case of the `Logic Theorist` program, these are simple technical theorems
    of propositional calculus. Their validity can easily be checked by creating truth
    tables. The only task is to find a formal derivation (sequence of formulas) in
    a given axiomatic system with given rules of inference. The search for a conclusion
    does not require any new ideas or methods but relies on fairly routine techniques.
    Among the derivations discussed, there are no derivations shorter than three applications
    of the inference rules, and no derivations longer than two dozen applications
    of the inference rules. The results of the `Logic Theorist` program have no practical
    meaning.


    2. **The author''s long-term observations on students studying propositional calculus,**
    who in the process of education are forced to seek and find similar conclusions,
    allow us to assert that the average person "off the street" without special training
    will not find any of the formal proofs found by the `Logic Theorist` program.
    A person "off the street" simply will not understand what to do, because obviously
    they have never done anything like this. In this art, then, the unprepared is
    inferior to the `Logic Theorist` program. At the same time, after three or four
    practice sessions with the teacher, diligent students can find any of these conclusions,
    as well as the conclusions that the program could not find. It should be noted
    that the conclusions found by the students may not be as elegant as those of Russell
    and Whitehead and may not be found very quickly. Still, it can be argued that
    a person who is able to pass the entrance exams to the university can also learn
    to look for formal inferences no worse than the `Logic Theorist` program.


    3. **From a qualitative point of view, the results of the `Logic Theorist` program
    have not improved significantly over the past half century.** The point is that
    the problem of automatically searching for a derivation in propositional calculus
    is exhaustive in character (see Section 0). Modern computers are millions and
    billions of times more powerful than the computer used by Shaw, but modern universal
    inference search programs can only draw tens, at most hundreds of times more complex
    conclusions, so on a qualitative level the first two remarks in this list remain
    valid even today and apply not only to the `Logic Theorist` program but to any
    modern program that claims to automatically prove any theorem in a sufficiently
    rich calculus.

    '
