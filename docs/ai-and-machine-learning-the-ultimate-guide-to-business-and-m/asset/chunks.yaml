    #### 3.4.2. mini max


    One of the algorithms for finding a solution for game trees is known as the MiniMax
    method, which was proposed by O. Morgenstern and J. von Neumann back in 1945.
    J. von Neumann is best known as the forefather of modern computer architecture
    (von Neumann architecture) and as the creator of game theory and the concept of
    cellular automata.


    If we had a complete game tree, we would start at the bottom, at the end nodes
    whose rating is given by the game rules (the F \* function for end positions),
    and everything would be quite simple - e.g. the max player''s move, we choose
    the child vertex with the maximum value evaluation function, and we shift this
    estimate up, and for the min move \- from the minimum. If the initial vertex as
    a result of the algorithm had a guess of +  then Max won, if - then Min . That
    would have decided the game.


    For example in Fig. error! The text of the specified style does not exist in the
    document. .42 Next to the nodes are written static estimates obtained in the indicated
    way. The illustration shows that Min can always win this simple game if he plays
    correctly.


    But the complete game tree is mostly too big. For example, there are 1040 positions
    for checkers and 10120 for chess (paragraph 1.1.8). It is physically impossible
    to build a complete game tree for practically interesting games . But you can
    apply this idea (starting from the bottom) to a subtree. To do this, you need
    to build a subtree, evaluate the nodes at the lower level with the scoring function,
    and go back up the tree, i.e. high.


    The minimax method is as follows. Suppose there is a static scoring function of
    position F , and if the position is considered favorable to Max , then F \> 0,
    if the position is considered favorable to Min , then F < 0. If Max is chosen
    among the terminal nodes has then he would choose the position with the highest
    guess, and if you chose Min then the lowest guess. Also in the minimax method.
    In the constructed subgame tree (when the full tree cannot be constructed), the
    leaf positions are evaluated by an invented evaluation function (since the game
    rules do not provide for evaluation of intermediate positions) and then estimates
    are propagated up the tree just as in a static evaluation of the whole tree. If
    the scoring function is well thought out and the tree is built deep enough, the
    minimax method often yields a truly optimal solution or a solution that is close
    to optimal.


