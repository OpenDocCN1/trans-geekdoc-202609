    ```\n\nWe choose the first matching clause for the subordinate clause and write\
    \ the output as a sequence of clause pairs: the central one on the left, the lateral\
    \ one on the right.\n\n| Central | Lateral |\n| --- | --- |\n| `¬P(x) ∨ P(x)`\
    \ `¬S(x) ∨ ¬P(x)` | |\n| `¬P(x) ∨ ¬S(x)` `S(a)` | |\n| `¬P(a)` `¬P(x) ∨ P(x)`\
    \ `¬P(a)` | `¬U(x) ∨ P(x)` |\n| `P(a) → C(x) → P(x)` `Y(a) ¬U(a)` | |\n| `¬C(a)`\
    \ `C(a)` `☐` | |\n\nAll suggestions that are received in the course of the solution\
    \ are advertised here. There are slightly fewer of them (11) than the exhaustive\
    \ search (16). In this case, however, an empty supply only appears on the sixth\
    \ replenishment level. However, this means nothing. In another case, an exhaustive\
    \ search may be more efficient.\n\nOf course, there are other examples of complete\
    \ strategies that are widely reported in the literature [6].\n\n### 4.2.2. Incomplete\
    \ Strategies\n\nAn incomplete strategy is a strategy that does not have the completeness\
    \ property.\n\nIf the algorithm of the resolution method does not complete its\
    \ work with an incomplete strategy, then this does not mean that the proof does\
    \ not exist, but that it cannot be found with the chosen strategy.\n\nHowever,\
    \ such strategies are often used because incomplete strategies are often more\
    \ efficient than complete strategies. In fact, incomplete strategies may not get\
    \ proof even if there is one, but when they do, they work faster.\n\nFurthermore,\
    \ a strategy that is incomplete in the general case can turn out to be complete\
