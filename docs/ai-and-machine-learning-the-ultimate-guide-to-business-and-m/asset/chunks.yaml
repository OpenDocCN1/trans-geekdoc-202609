    # 4.4.7. Combination of direct and reverse system


    We have considered a limited case (direct system) and another limited case (reverse
    system). A natural idea arises: to combine these two bounded cases in the hope
    of obtaining an unbounded one.


    Combining direct and inverse rule-based inference systems gives the following:
    There are facts represented in the form AND/OR, there are goals represented in
    the form AND/OR, and there are two types of rules: Direct rules in the Form `L
    → W`, backward rules in the form `W → L`. You will build solution graphs to each
    other until these graphs collide.


    In other words, we introduce three types of resolutions:


    1.  Resolution of facts and direct rules, which is a special case of Robinson''s
    method of resolution, which we discussed earlier;

    2.  Solving goals and inverse rules, which is a special case of the dual solving
    method;

    3.  Resolution of facts and goals.


    The latter is called the extinction rule.


    The deletion rule is: Two nodes delete each other when they either merge or the
    k-connections emanating from them are deleted.


    The termination condition in this case is as follows: the root of the facts deletes
    the root of the goals, and the substitutions on the matching arcs are consistent.


    Let''s look at a positive example to understand the advantages of the combined
    forward and reverse system (this example was already discussed in section 0):


    Fact: There are smart students


    Inverse rule: programmers know the solution method


    Direct rule: Students do not know the solution method


    Purpose: There are smart non-programmers


    We decide for ourselves which rule is direct and which rule is reversed. This
    places additional responsibilities on the expert who enters this information into
    the knowledge base, but on the other hand allows what the resolution method does
    not allow: to preserve implicativity, to show in which direction the reasoning
    should be applied.


    This makes the solution quite easy to find (Fig. 53). In this figure, quenching
    is indicated by thicker arrows.


    ![Figure 53](Images/image00374.jpeg)


    **Figure 53.** Combination of forward and reverse trigger systems.


    An application of the rule to building facts, an application of the reverse rule
    to building goals - and delete immediately. In other words, unlike the solve method,
    this system works in three steps and performs only three unions. At the same time,
    she did not have to think about which rules to apply, no strategy was required.
    All applicable rules have been applied and the result is a decision.


    Unfortunately, there is a complication with this rather spectacular example. The
    settlement rule is consistent and complete, and the rule applying direct rules
    as a special case of the settlement rule is consistent and complete, and the rule
    applying reverse rules as a special case of the dual settlement procedure is consistent
    and complete. However, the situation with the extinction rule is not so simple
    and good. It''s not universal; it is rich but not complete. There are such conclusions
    that cannot be reached using the suppression rule (Fig. 54).


    ![Figure 54a](Images/image00375.jpeg)


    but


    `A & (B ∨ C) & D`


    ![Figure 54b](Images/image00376.jpeg)


    `(A & B) ∨ (C & D)`


    **Figure 54.** Incomplete suppression rule


    The formula below is a logical consequence of the formula above:


    `(A & B) ∨ (C & D) ⇒ A & (B ∨ C) & D`

    '
