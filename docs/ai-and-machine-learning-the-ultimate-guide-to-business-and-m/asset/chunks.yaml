  trans: '

    此后，人工智能领域的研究不仅在美国全面展开。首批试图概括收集材料的出版物开始出现。提交此类工作的专家包括 J. McCarthy、M. Minsky、E.
    Feigenbaum（E. Feigenbaum，美国）、D. Michie（英国）、AA Lyapunov 和 VM Glushkov（苏联）。当然，成果很快显现——提出了许多思想，其中大多数至今仍在使用。


    20 世纪 50 年代末，提出了一种图搜索模型。在这种方法中，任务被表示为在图中寻找一条路径，该图的顶点是任务的状态，弧是所有可能的可行变换。问题的解决在于找到从初始状态到目标状态的路径。20
    世纪 60 年代初，启发式编程得到广泛应用（见第 3 章）。启发式是一种规则，通常通过经验获得，可减少解空间中的枚举范围。启发式编程是基于已知启发式规则开发寻找解决方案的策略。20
    世纪 60 年代末，开发了一阶演算中定理自动证明的通用方法（特别是 J. Robinson 的消解法和 S. Yu. Maslov 的逆向法，见第 4 章），并在
    20 世纪 70 年代初，基于这些方法提出了大量用于解决智力问题的编程工具。因此，1973 年创建了 Prolog 语言，它至今仍是逻辑编程的流行工具。目前
    AI 中使用的几乎所有思想和概念都是在这一时期提出或确立的。不可能列出所有思想，如果总体发展脉络清晰（见图. Error! The text of the
    specified style is missing in the document. .10），也没必要列出。


    ### 1.3.4. 科学深化与工业实施


    我们认为，80 年代对 AI 而言最重要的事件是知识工程概念的诞生。这一概念由 E. Feigenbaum 于 1982 年提出。


    知识工程是人工智能的一个领域，研究提取、表示、构建和使用知识的方法与手段。


    将知识表示方法与解搜索方法分离，在特定学科领域构建越来越有效的专用知识表示方法，使得能够获得足够有效的表示，从而在真实计算机上利用现有方法解决实际意义重大的问题。同时，AI
    内部的不同方法和方向找到了共同的方法论基础，开始更紧密地相互咬合，因为不再需要证明“理论的纯粹性”或“方法的独创性”，而是必须以某种方式取得实际结果。


    在此期间，出现了远未通过图灵测试的计算机系统，但对以下问题给出了肯定回答：机器能否比人类更廉价地解决某些智力问题？比人类更快？比人类更可靠？


    计算能力显著增强，人们清楚地认识到，如果抛开“人工智能”的哲学、伦理和道德问题，在许多具体、狭窄的专业领域，用机器取代人不仅是可能的，而且是有用的。应用人工智能系统开始盈利。对学术研究的投资立即开始增加，这带来了投入工业的新成果，产生的收益又部分投入研究……形成了正反馈，AI
    的崛起时期尚未结束！


    这一时期的第二个重大事件是在一段平静期后，神经控制论随神经网络和神经计算机概念复兴。重燃的兴趣并非源于上天突然的奇迹般启示，并附带通俗解释人脑究竟如何构造和运作。当然，生理学家、心理学家、语言学家、哲学家和其他研究者并未袖手旁观，而是对人类本性了解了许多新事物，但那不是原因。即使在神经控制论内部，也未取得突破性发现。现代神经网络使用的数学模型非常接近最初的模型，尽管当然更加发达和改进。神经控制论复兴的显而易见的原因在于微电子学的惊人进步。在
    Rosenblatt 感知机等开创性工作中，人工与自然神经网络的数量差异以数十亿倍计，根本无从谈起定性比较。现在数量差异以数千倍计，超级神经计算机的设计者拥有了前所未有的新可能性。预计将出现定性变化，而正在进行的量变应导致质变。


    作为相对近期过去的第三个显著事件，我们认为是将当之无愧的哲学概念“本体论”引入计算机科学这片新土壤。


    本体论是利用概念模式对特定知识领域进行形式化。通常，这种模式包含一个数据结构，含盖所有相关对象类、它们的关系，以及施加于对象和关系上的约束。


    本体论在编程过程中被用作关于现实世界或其某部分的知识表示形式，即作为领域模型。虽然最初具有哲学性质，但术语“本体论”[[20]](#part0005.xhtml#_ftn20)在计算机科学中已获得了自己的含义。此处有两个主要区别：


    - 计算机科学中的本体论是一种知识表示形式，一种计算机易于处理的形式；

    - 信息本体论总是为解决实际问题而以具体目标创建；它们更多地根据适用性而非完备性、完整性和正确性来评判。


    作者坚信，领域模型的分析、构建、开发和使用目前是计算机科学中最重要且最有前景的任务，不仅在 AI 领域，在其他信息技术中亦是如此。


    例如，信息管理系统领域的业务流程管理系统（BPMS）概念、互联网上的语义网概念，或应用编程中的领域专用语言概念。所有这些极具前景的概念都涉及本体论概念[[21]](#part0005.xhtml#_ftn21)。


    .10 反映了我们对 AI 发展历史的愿景，并总结了本节。


    .ten.


    人工智能发展史


    ### 1.4. 应用人工智能系统的分类


    人工智能应用的领域和范围非常多样——第 0 节仅提供少量案例研究，而非百科全书式的概述。事实上，成千上万的应用 AI 系统用于实际实践，每个系统都有其自身的特征和特性。如此异质的对象和方法集合必须进行分类，甚至需要多重分类，这是必不可少的。


    #### 1.4.1. 知识类型


    我们将要在计算机中表示的知识非常多样。


    根据 SS Lavrov [4] 的观点，知识可分为三种根本不同的类型：


    1. 概念性知识。此类包括概念及其相互关系，例如规则、法则、不变关系，以及启发式知识——反映在问题领域解决问题的实践经验的非形式推理规则。

