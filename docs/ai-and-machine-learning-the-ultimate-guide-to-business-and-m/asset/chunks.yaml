    结论往往是非绝对的（模糊的）——"病人活着的可能性大于死亡"（一个医学轶事，或者可能不是个玩笑）。两位不同的专家经常从相同的前提出发得出不同的（有时甚至是相互矛盾的）结论——参见关于保加利亚男子及其女友的"正交解释"示例（第
    1.1.1 节）。


    所有这些特征在一定程度上都内在于使用生产机制实现的现代计算机专家系统中。


    形式上，异构生产系统是几个独立数学学科装置的折衷联合：一阶逻辑、概率论、图论、可能还有测度论，以及其他……大多数生产系统的公理化（反映特定专业的部分——参见上面关于保加利亚人和海鸥的示例）可能是自相矛盾的，得出的结论可能不可靠，且得出结论的成本可能高得离谱。尽管如此（这有时令人钦佩！），现代专家系统不仅能让医生、地质学家、化学家及其他学科专家的生活更轻松，还能"给出"完全出人意料且极具成效的解决方案。


    还应注意到，目前正在进行密集研究，以改进生产系统中知识表示和处理的机制。特别是，提出将所谓的模态逻辑作为逻辑装置（以及与之相关的概率论），它显式地包含可能性、确定性和知识人称化量词，以及对结论非单调性属性和可能世界语义的识别（参见图
    [9, 10]）。


    生产系统（SP）由四元组确定：事实库、生产集、控制系统、专家意见准备完成的终止条件。


    在本书中，数据库系统地用字母 `D` 表示，生产集用 `R`，控制策略（系统）用 `C`，终止条件用 `t`。一旦建立了符号表示，上述定义可以用标准数学形式重写：


    `SP = < D , R , C , t >` （**）


    终止条件可以不指定，因此下面我们对四元组的最后一个元素给出一些解释性说明。


    因此我们看到，基于生产形式化的、带有人工智能元素的应用系统，具有上一章提到的清晰的三部分划分（参见第 1.3.4 节）：


    - 事实知识（事实库，通常以数据库形式实现）；

    - 算法知识（规则）；

    - 概念知识（管理策略）。


    这就是生产系统通常能很好地反映 AI 应用的原因。让我们更仔细地看看生产系统的元素。


    许多产品 `R`。该集合的元素通常称为生产规则或简称为生成式。


    异构生成式（Production）是一个"条件-动作"对，它确立了完成专家意见准备步骤所需的部分知识。生成式规则可以写为：


    ```

    r = def if p ( d ) then d := f ( d ) end if, (***)

    ```


    其中 `p` 是条件，`f` 是动作。


    则规则如下所示：


    `R = { r | r = ( p , f [, w ] ) }`。


    规则的条件部分 `p` 根据环境状态（事实库）决定何时可以应用此规则。`p` 的实现通常由在给定时间点可靠确立的事实集合上的谓词的真假决定。生成式部分 `f`
    定义映射 `f : D → D` 并定义对环境的影响 [[28]](#part0005.xhtml#_ftn28)。有时会使用一个实数 `w` 来表征规则应用的价格（或权重，`-weight`）。在这种情况下，可以设定的任务不仅是找到通向目标的生成式应用顺序，而且是找到总价格最小的顺序。


    事实库 `D` 包含思维过程中"世界"当前状态的描述。此描述是一个模板，将与生成式的条件部分进行比较，以选择解决问题的适当动作。如果数据库的当前内容满足某规则的条件，则可以采取该规则中指定的动作。在这种情况下，称该规则**适用**。但规则适用并不意味着必须应用它。是否实际应用适用规则由规则策略决定。


    如果规则适用且控制策略选择了它，则应用该规则。应用规则后，数据库改变其状态。


    管理策略 `C`。生产系统的控制结构很简单：事实库用初始任务描述初始化。问题求解的当前状态也反映在事实库中。将事实库的当前内容与生成式规则的条件进行匹配，生成适用规则的子集，有时称为冲突集
    [[29]](#part0005.xhtml#_ftn29)。接下来，从冲突集 `R` 中选择一个生成式 `r`（执行冲突消解），并执行该规则的动作 `f`。应用规则的结果不仅改变事实库的状态，还可能改变冲突集。事实是，数据库状态改变后，某些规则的条件可能不再满足，这些规则必须从冲突集中排除。另一方面，先前不适用规则的条件可能变为真并必须被纳入。同时，冲突消解策略（控制策略）可以非常简单，例如选择第一个适用规则，也可以非常复杂，例如使用复杂启发式。根据规则策略，应用规则，例如直到达到终止条件或不再有适用规则。


    终止条件 `t`。通常有一个求解过程的终止条件 `t : D → bool`，即一个其参数为数据库事实的谓词。如果满足条件 `t(d)`，则假定无需再应用生成式，数据库的当前状态
    `d` 即为答案。有时终止条件不是作为公式给出，而是直接作为满足终止条件的数据库状态集合给出。在这种情况下，该集合通常用 `T` 表示：


    `T = { d ∈ D | t(d) }`。


    也可能未指定终止条件，因为系统必须持续运行。例如，技术对象和连续过程的自动控制系统。在这里，有必要兑现上面关于公式（**）中四元组最后一个元素的承诺解释。最后一个元素，备受讨论的终止条件
    `t`，不能从数据集中移除（由于现有的数学"约束"），所以我们约定对于本段讨论的生产系统，常量 `Action` 成立，让我们假设 `t` 等于 `false`。


    在讨论了生产系统的组成部分后，我们转向生产系统作为一个整体的结构。以生产系统形式组织应用 AI 系统有一个非常重要的优势——知识的模块化或算法性质。生产系统与层次组织的程序的区别如下。


    1. 规则之间在控制方面没有直接关系。换句话说，规则不会相互调用。所有对规则的控制都放在控制策略 `C` 中。

    '
