    # 简化版尼姆游戏示例


    以简化版尼姆游戏为例。游戏开始时有 5 枚硬币。每回合可取 1、2 或 3 枚硬币。不允许跳过回合。取走最后一枚硬币者输。图 42 展示了完整的游戏树。终局位置下方标注了获胜方。


    ![](Images/image00361.jpeg)


    **图 42. 尼姆游戏树**


    ## 3.4.2. 极大极小算法


    求解游戏树的算法之一称为极大极小算法，由 O. Morgenstern 和 J. von Neumann 于 1945 年提出。J. von Neumann
    因现代计算机架构（冯·诺依曼架构）的奠基人、博弈论和细胞自动机概念的创立者而闻名。


    如果拥有完整的游戏树，我们将从底部（即由游戏规则给定评分的终端节点，即终局位置的 `F *` 函数）开始，一切都将变得非常简单——例如极大方回合，我们选择评估函数值最大的子顶点，并将该估值上传；对于极小方回合，则从最小值上传。若初始顶点经算法得出的估值为
    `+ ∞`，则极大方获胜；若为 `-∞`，则极小方获胜。这便决定了游戏的胜负。


    例如在图 42 中，节点旁标注了按上述方式获得的静态估值。图示表明，若极小方正确下棋，总能赢下这个简单游戏。


    但完整游戏树往往大得惊人。例如，跳棋有 10^40 个位置，国际象棋有 10^120 个（见 1.1.8 节）。为实际有趣的游戏构建完整游戏树在物理上是不可能的。但可将这一思路（自底向上）应用于子树。为此，需构建子树，用评分函数评估底层节点，再沿树向上回溯。


    极大极小算法如下。假设存在位置静态评分函数 `F`，若位置对极大方有利则 `F > 0`，对极小方有利则 `F < 0`。若由极大方在终端节点中选择，他会选估值最高的位置；若由极小方选择，则选最低的。极大极小算法亦同理。在构建的子游戏树中（无法构建完整树时），叶子位置由人为设计的评估函数评估（因游戏规则不提供中间位置评估），随后估值如同完整树的静态评估般向上传播。若评分函数设计得当且树构建得足够深，极大极小算法常能给出真正最优或接近最优的解。


    以 3×3 棋盘上的井字棋为例。玩家轮流在空格放置棋子。率先在同一横、竖或对角线连成三子者胜。


    图 43 展示了搜索深度为 2 的部分游戏树上应用极大极小算法的过程（“叉”用数字 1 表示，“圈”用 0 表示）。位置后“=”号后的数字为评分。


    ![](Images/image00362.jpeg)


    **图 43. 部分井字棋游戏树**


    可见，按深度 2 的极大极小算法评估，极大方的最佳走法是走中间格。确实，这是极大方的制胜策略。


    然而，极大极小算法并非总能选出真正最佳甚至良好的走法，一切取决于评估函数设计得有多好。以此前段落尼姆游戏的轻微变体为例。允许的走法和结束条件保持不变，初始硬币数不固定，设为
    `n`。我们需设计评分函数。这通常基于观察完成。参考图 42 进行观察。可见：`n=1` 时极大方输；`n=2,3,4` 时极大方赢；`n=5` 时极大方又输。即
    `n=1` 和 `n=5` 时评分函数须为负，`n=2,3,4` 时为正。人们倾向于选取尽可能简单、符合观测数据的公式，将其宣布为“自然定律”，即评估函数。当中学代数的残留知识从记忆深处浮现时，这种诱惑简直无法抗拒。实际上，该函数至少有两个根，一个在
    1 和 2 之间，另一个在 4 和 5 之间。按中学所学，考虑 `(n - 1.5)` 与 `(n - 4.5)` 的乘积，经取整后得到函数 `F(n) =
    -n^2 + 6n - 7`，其表现出期望行为，完全符合现有观测：`F(1) = -2`，`F(2) = +1`，`F(3) = +2`，`F(4) = +1`，`F(5)
    = -2`。我们在 `n=7`、搜索深度为 2 的尼姆游戏极大极小算法中使用此评估函数（图 44）。图中展示了所选函数的初始估值、极大极小算法计算出的估值，及算法选定走法的粗箭头。可见算法建议了正确步骤！


    ![](Images/image00363.jpeg)


    **图 44. 极大极小算法在尼姆游戏中的成功应用**


    然而，若试图外推估值器并超出原始观测基础，会得到完全无用的结果。图 45 以图 44 相同标注展示了 `n=10` 时的树。极大极小算法给出错误建议，实际制胜的走法反被其评为最差！


    ![](Images/image00364.jpeg)


    `F=-23 F=-14 F=-7 F=-14 F=-7 F=-2 F=-7 F=-2 F=+1`


    **图 45. 极大极小算法在尼姆游戏中的失败应用**


    ## 3.4.3. α-β 剪枝


    在极大极小算法中，位置生成与评估是分离的。先生成，后评估。可在生成过程中同步评估，以避免生成多余内容。此过程称为 α-β 剪枝。


    这一机制在 20 世纪中叶显得如此必要且切题，以至于全球众多科学家投入其发展。如今难以确定该程序作者，显然它被反复发明。Samuel (A. Samuel)、Richards
    (DJ Richards)、Hart (TP Hart) 等人独立提出了该算法的早期版本。John McCarthy 也在 1956 年达特茅斯研讨会上提出了类似想法。我国同胞
    Alexander Lvovich Brudno 独立发现该算法，并于 1963 年发表成果。

    '
