    \ (d₂, d₃)` 的标记保持不变\n\n接下来打开节点 `d₃`。\n\n![扩展第三个节点](img/image00360.jpeg)\n\n####\
    \ 41. 步骤 5. 创建决策图\n\n最后一步，打开节点 `d₃`。由于弧 `d₃ → d₂` 指向已允许的节点，节点 `d₃` 随后节点 `d₀` 获得标签\
    \ `s=1`。重新计算估值在节点 `d₀` 返回：2（节点 `d₄` 估值）+ 3（节点 `d₃` 估值）+ 2（弧 `d₀ → (d₂, d₃)` 成本）=\
    \ 7。算法完成。\n\n### 3.4. 游戏树搜索\n\n在编程智力游戏时，AND/OR 图搜索的思想被特别频繁地使用。此时，通常考虑一种称为游戏树的\
    \ AND/OR 图特殊情况。\n\n#### 3.4.1. 游戏树\n\n假设存在一个对抗性（有一个对手）、离散（位置数至多可数）、完全信息（所有规则预先已知且位置公开）的游戏。由两名玩家\
    \ `Max` 和 `Min` 轮流移动，`Max` 先移动。\n\n让我们尝试为玩家 `Max` 找出获胜策略。为此，我们构建一个搜索图，其节点为游戏的允许位置。在该图中，如果\
    \ `B` 通过对位置 `A` 应用游戏规则获得，则从对应位置 `A` 的节点引出一条弧指向对应位置 `B` 的节点。树的根对应游戏的初始位置，叶子对应游戏结果唯一确定的位置（即确定获胜者或确立平局）。那么，确定玩家\
    \ `Max` 获胜策略的问题归结为在游戏树中从根到对应 `Max` 获胜位置的叶子找到一条路径。此外，从 `Max` 移动的位置来看，只需找到至少一个可解节点（因为我们为\
    \ `Max` 制定策略，可以选择想要的移动），而对于 `Min` 的移动，所有后代都必须可解（因为我们无法影响 `Min` 的移动选择，必须考虑所有可能的移动）。因此，游戏树是一个\
    \ AND/OR 图，其中第一个玩家 `Max` 的节点为 1-弧（AND），第二个玩家 `Min` 的节点为 `k`\\-弧（OR）。\n\n游戏规则确定所有最终位置的评分\
    \ `F*`：`F* = +∞` 如果 `Max` 获胜，`F* = -∞` 如果 `Min` 获胜，`F* = 0` 如果游戏以平局结束。\n\n通常游戏不仅用\
    \ AND/OR 图表示，而是用超树表示，使得除初始位置外的每个位置恰好包含一条弧。在这种情况下，当然可能会有一些内存损失，因为由不同移动顺序产生的匹配位置以多个实例存储。然而，实际观察表明，在最常见的智力游戏中，这种情况相对罕见。另一方面，已经提出了几种用于寻找游戏树解的非常高效的算法（见以下章节），这些算法不适用于一般图。因此，在编程智力游戏时，通常牺牲内存以换取算法速度的提升。\n\
    \n"
