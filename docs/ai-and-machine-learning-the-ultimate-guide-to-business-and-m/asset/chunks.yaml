- raw: "Situations are axioms. We apply rules to them, we get new facts, and each\
    \ new fact is gained from previously gotten facts. In the end we reach (or not)\
    \ the objective fact, that is, in the language of logical theories, we get the\
    \ conclusion of the objective proposition. Thus, the core of any expert system\
    \ can be viewed as a system for automatically searching for conclusions in any\
    \ formal theory, ie proving theorems.\n\nThe proof of theorems certainly involves\
    \ intellectual effort that requires not only deductive skill but also largely\
    \ intuitive guessing (e.g. which lemmas are necessary for a given theorem). In\
    \ other words, proving theorems implies, among other things, searching for already\
    \ proven theorems and solved sub-problems that may be useful to reach the final\
    \ goal. So far, several programs with AI elements have been developed that can\
    \ work in this direction, i.e. programs for automatic theorem proving (Automatic\
    \ Theorem Proving).\n\nWhen we first look at the subject, we immediately notice\
    \ the circumstances known from the course of mathematical logic.\n\n1.              \
    \ The language of first-order predicate calculus, enriched with things like equality\
    \ and non-logical predicates and functions, is the accepted vehicle for axiomatization\
    \ in most disciplines (i.e. almost any statement can be formulated as a formula\
    \ for the applied predicate calculus).\n\n2.               Tarski's algorithm\
    \ for enumerating well-formed formulas allows hypotheses to be generated in an\
    \ exhaustive way (that is, all well-formed formulas can be enumerated).\n\n3.              \
    \ The solving method is partially correct (that is, for any provable formula,\
    \ the derivative can be found automatically, and for an unprovable formula, the\
    \ algorithm may not be able to complete its work).\n\nThe following idea emerges,\
    \ which impresses with its simplicity. Let us write down the axioms of the domain\
    \ in the language of the first order calculus. Let's run an algorithm like Tarski's\
    \ algorithm that generates new hypotheses one by one. We will try to prove each\
    \ hypothesis automatically by the solving method, and if it succeeds, the computer\
    \ itself will extract more and more new knowledge. The process can run in code\
    \ 24 hours a day, 7 days a week, 365 days, not on one machine, but on all currently\
    \ idle machines. By the way, PCs are now idle 90% of the time on average, and\
    \ their total idle computing power is quite large, so humanity has enough idle\
    \ resources.\n\nThus, an automatic theorem proof is possible and easy to program,\
    \ but such a simple approach turns out to be hopelessly inefficient. Complicated,\
    \ interesting theorems cannot be proved automatically in the frontal approach\
    \ because the enumeration space is so large that even the fastest computers are\
    \ unable to do anything in a reasonable amount of time.\n\nHowever, to tell the\
    \ truth, there are so far few examples of how, in a very narrow class of mathematical\
    \ theories, it has been possible with very specific methods to automatically find\
    \ and prove non-trivial meaningful theorems that were previously unknown. Such\
    \ an example is many, many years old \\[3\\]. Corresponding member of the Russian\
    \ Academy of Sciences VM Matrosov developed an amazing way of listing and proving\
    \ mathematical facts in a narrow field related to the theory of differential equations.\
    \ Co-programmers compiled a program that generated hypotheses and automatically\
    \ created proofs for them. In this way some really new non-trivial theorems were\
    \ found and proved. At the same time, the results (theorems and proofs) were published\
    \ in a renowned mathematical journal as new scientific results in mathematics.\
    \ The world community does not yet know how to deal with this fact, but there\
    \ is a precedent.\n\nIt should be emphasized that the automatic theorem proof\
    \ is the main tool of all applied systems with elements of artificial intelligence\
    \ that use logical calculation formulas to some extent to represent knowledge.\
    \ Predicate calculus formulas are almost always used - this is the main form for\
    \ formally writing all statements known to mankind. Therefore, we can safely say\
    \ that proving theorems automatically is a fundamental topic of AI . In the following\
    \ chapters it will be shown that all AI methods we consider, and possibly all\
    \ AI methods in general, directly or indirectly amount to automatic theorem proving.\n\
    \n#### 1.1.4. Automatic robot control and pattern recognition\n\nRobot (robot)\
    \ - an automatic or remote-controlled device that partially or completely replaces\
    \ a person in certain work.\n\nThe word \"robot\" was coined by Czech writer Karel\
    \ Capek and his brother Josef and first used in Capek's play RUR (\"Rossum's Universal\
    \ Robots\", 1920).\n\nRobots are most commonly used when performing work in life-threatening\
    \ conditions or when the facility is relatively inaccessible. Everyone has heard\
    \ of the success of unmanned lunar and mars rovers, military robots used for reconnaissance\
    \ and disposal of explosive objects. Recently (2009) another international exhibition\
    \ of robots was held in Japan, where most of the models presented household and\
    \ medical robots (Fig. Error! The text of the specified style is missing in the\
    \ document. .5 ). For example, a pain-sensitive “robot patient” for training dentists\
    \ was presented to the public. Another example is a \"robotcop\" who can memorize\
    \ the faces of people the police are looking for. Upon identification, the robot\
    \ immediately warns the security personnel via radio. Entertainment robots are\
    \ becoming increasingly popular . A \"robot dance partner\" was presented at the\
    \ same exhibition. This is a human-sized \"woman\" who, with the help of special\
    \ sensors, sensitively detects the direction in which the dancer is moving and\
    \ moves in time with him. She can also perform a short solo dance, move smoothly,\
    \ and move her arms, head, and body. It seems that the dreams of the future of\
    \ robots described by 20th century science fiction writers are about to come true.\n\
    \n![](Images/image00328.jpeg) ![](Images/image00329.jpeg) \n\n  .5. Examples of\
    \ robots: ping pong robot, dancer robot, patient robot\n\nIn fact, robot planning\
    \ is an extremely difficult task. It seems that there is nothing easier than getting\
    \ around on two legs. Everyone's development begins with the ability to see and\
    \ walk. Studying the timeline (Fig. Error! The text of the specified style is\
    \ missing from the document. .6 ) one gets the idea that these skills do not seem\
    \ to require any significant intellectual effort. At first glance, speaking, thinking\
    \ and programming seem much more difficult. However, if you look at the development\
    \ of robots and robotics, you can easily see the opposite. Robots first learned\
    \ to program and reason, then talk, then walk, and still haven't learned to see\
    \ properly.\n\n  .6. Comparing the skill development of a robot and a human"
