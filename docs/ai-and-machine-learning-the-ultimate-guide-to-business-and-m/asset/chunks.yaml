    ## Universalization of the translation process


    Even the most qualified translator, as a rule, specializes in certain areas of
    knowledge and subject areas, while MT systems are quite universal and their work
    depends only on the necessary settings - connection of the necessary electronic
    dictionaries, etc.


    There are currently many commercial machine translation projects: Systran, IBM,
    L&H (Lernout & Hauspie), Language Engineering Corporation, Atril, Trados, Caterpillar
    Co., LingoWare. In Russia, a group led by Prof. RG Piotrovsky (Russian State Pedagogical
    University named after Herzen, St. Petersburg). Now the automatic translator developed
    by PROMT (PROgrammer''s Machine Translation) has received the well-deserved recognition
    that meets the expectations of most users.


    ### 1.1.2. Intelligent databases and question-answer systems


    At the beginning of the use of computers, data storage formats and means of their
    manipulation were invented by programmers individually for each case. This is
    inconvenient and inefficient, and unified data storage methods (data models) were
    soon proposed and unified data access systems (database management systems - DBMS)
    were developed. Looking at the concept of a database (DB) from the most general
    point of view, it can be stated that the database supports three main groups of
    operations: entering data into the database, searching for data in the database
    and extracting data from the database, and the previously entered data is retrieved
    [\[8\]](#part0005.xhtml#_ftn8). Several ideas have been proposed and used that
    do not have this limitation. One of them is the idea of an intelligent database.


    An intelligent database provides an efficient way to store, search, and retrieve
    more facts than originally loaded into the database.


    Let''s consider a simple case. A relational database (see Table 1): A table whose
    rows correspond to objects and whose columns correspond to some attributes of
    objects. All objects are of the same type and differ only in the attribute values.
    This allows you to answer factual questions. For example, you can ask: “In which
    department does Davison work?” And get the answer: Department of Applied Mathematics.
    However, if you add information there that is not presented as a table, it can
    usually answer questions that are not answered in the database. The idea is that
    in addition to ordinary relational tables, some rules are also stored in the database,
    for example these:


    ```

    if (x.Position = "Head" & (x.Department = y.Department) then x boss y

    ```


    database equipped with such rules is intelligent.


    In fact, if you ask the question "Who is Davison''s boss?", a simple built-in
    inference engine will easily find the answer: "Claudius". This example allows
    you to find out the relationship at the boss-subordinate level. In this case,
    it is obvious that Klavdiev is the head not only of Davison, but also of every
    other employee of the Department of Applied Mathematics. Therefore, an intelligent
    database can return a fact that is not stored in it. In addition, such foundations
    make it possible to answer questions that require deductive reasoning, which consists
    not of one application of the rule but of many applications, so that the facts
    extracted may not be so obvious and very far removed from those originally introduced.


    An intelligent database in which questions can be asked and answered in (limited)
    natural language is called a question-answer system.


    The first question and answer systems appeared in the 1960s. Questions and answers
    in these systems were naturally formulated in a very limited subset of natural
    language, simplified both in terms of the dictionary and in terms of the grammatical
    forms used. The information source - the database from which the answers were
    extracted - each of these systems had its own local system tailored to a narrow
    subject area. The usefulness and scope of such systems was not great, although
    they enjoyed a certain popularity.


    At present, the idea of question-answer systems in the form of intelligent search
    engines on the Internet has been greatly developed. Relying on all of humanity''s
    global information resources and using fairly sophisticated new algorithms to
    analyze and synthesize text in a limited natural language, such search engines
    have proven more than useful. It is no exaggeration to say that these systems
    are vital to everyone today.


    ### 1.1.3. Expert systems and automated theorem proving


    The methods of intelligent databases have been further developed in the development
    of automatic advisory systems. Such expert systems (expert systems) are able to
    give the user a competent answer to a specific question. The first expert systems
    were created, for example, for applications in medicine (diagnosis of diseases)
    and in geology (assessment of deposits).


    One of the most important problems in this area is the representation and use
    of expert knowledge, which by its very nature is quite heterogeneous and contradictory
    data.


    Expert systems are artificial intelligence systems that contain knowledge about
    a specific weakly structured and narrow subject area that is difficult to formalize
    and are able to offer and explain reasonable solutions to the user.


    It is currently generally accepted that the structure of expert systems consists
    of five blocks (Fig. 4). The combination of three blocks - rules, situation model
    and conclusion - is indeed an intelligent database. Modules that allow you to
    extract knowledge and explain the conclusions turn an intelligent database into
    an expert system.


    ![](Images/image00327.jpeg)


    **Fig. 4. Expert system architecture**


    Nowadays the knowledge base for an expert system is mostly a set of rules. The
    simplest case is when the rules are deterministic [\[9\]](#part0005.xhtml#_ftn9)
    and allow new facts to be derived from existing facts, as in an intelligent database.
    This option is discussed in detail in the second chapter, where we talk about
    the representation of knowledge by production systems.


    The Output Explain block actually presents the machine output of the result in
    a human-readable form so that the user can understand what reasoning steps the
    expert system used to solve the problem. Thus, the user''s confidence in the answer
    increases.


    The most important and complex is the knowledge extraction block. The result of
    the work of this block is clear - this is the replenishment and modification of
    the knowledge base. But the source data can be different. Don''t expect a subject
    matter expert to formulate effective reasoning rules "from scratch" in the format
    required by the system. This is an amazing miracle. One of the most reliable is
    the method of gradually replenishing and changing the knowledge base, and the
    reason for the change is always when the system could not or incorrectly solve
    the problem. In this case, the expert analyzes the history of the machine reasoning
    using the explanation block, determines which rule failed or which rule is missing,
    and adds them to the knowledge base using the knowledge extraction block. We can
    say that an expert system, like a human, learns from mistakes.


    The inference block is at the center of the structure of expert systems. In this
    block, the rules are applied to the facts from the situation model, thereby new
    facts are obtained, to which the rules are also applied, and so on, until the
    goal, i.e. the required fact, is reached. This process is essentially the process
    of finding a derivation in formal theory. In fact, the first facts from the model


    Probability p. Most of the conclusions that the expert system makes according
    to probabilistic rules are of a probabilistic nature. The user receives several
    different answers to his question, each of which is assigned its own reliability
    probability.

