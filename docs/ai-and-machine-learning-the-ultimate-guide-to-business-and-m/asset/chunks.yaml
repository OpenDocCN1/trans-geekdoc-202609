    # 1.3.3. emergence and development


    In 1956, a two-month seminar was held at Dartmouth College (one of the oldest
    universities in the United States), attended by ten leading researchers in the
    new direction:


    - John McCarthy, Dartmouth College;

    - Marvin Minsky, Harvard University;

    - Claude Shannon, Bell Laboratories;

    - Nathaniel Rochester, IBM;

    - Arthur Samuel, IBM;

    - Allen Newell, Carnegie Mellon University;

    - Herbert Simon, Carnegie Mellon University;

    - Trenchard Moore, Princeton University;

    - Ray Solomonoff, Massachusetts Institute of Technology;

    - Oliver Selfridge, Massachusetts Institute of Technology.


    This seminar is considered the beginning of artificial intelligence as an independent
    direction, and the term `artificial intelligence` itself was proposed and adopted.
    No particular scientific results were produced by the Dartmouth seminar. Other
    important events took place there: artificial intelligence was recognized as a
    separate branch of science, the first impressive results were demonstrated (similar
    to the `Logic Theorist` program), and the scientific community was formed as a
    result of personal acquaintance of the leaders.


