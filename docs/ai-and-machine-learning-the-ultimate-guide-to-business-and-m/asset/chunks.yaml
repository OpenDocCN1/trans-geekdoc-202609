  fmt: "\n## 5. Algorithm A* is unsuitable for the dynamic search case\n\nIn fact,\
    \ if the productions or the goal or the weights of the rules are allowed to change\
    \ dynamically during the search, [[56]](#part0005.xhtml#_ftn56) all the arguments\
    \ of the previous three paragraphs become invalid. The consistency of the A* algorithm\
    \ comes from the fact that choosing another path from a given node does not depend\
    \ on how we got to that node. This is not the case with dynamic search: the length\
    \ of the path from the current node to the target node can also differ, depending\
    \ on how we got to the current node.\n\nWhat has been said in this section does\
    \ not mean that algorithm A* is worthless and should not be used. On the contrary,\
    \ the A* algorithm is the best known solution when there is no additional specific\
    \ information about the properties of the problem. If there is additional information,\
    \ A* can and should be modified considering a specific task. One of the most elegant\
    \ modifications is discussed in the next section.\n\n### 3.3. SEARCH IN GRAPHICS\
    \ AND/OR\n\nWhen considering decomposable production systems, the concept of AND/OR\
    \ graphs was introduced. In such a graph, the nodes are the states of the database\
    \ or parts of it, which are obtained in two ways: either by applying a rule or\
    \ by decomposing the database into components. This is exactly a graph and not\
    \ necessarily just a search tree. The same vertex `d` can also appear as a result\
    \ of decomposing `d1` and applying the rule to `d2`. AND/OR graphs are widely\
    \ used in AI. Search algorithms like A* are specialized and refined for use with\
    \ AND/OR graphs. In addition, even more efficient algorithms are known for certain\
    \ special cases of hypergraphs.\n\n#### 3.3.1. Count AND/OR\n\nLet's refine the\
    \ definitions.\n\nThe AND/OR graph is a hypergraph, i.e. a pair consisting of\
    \ a set of vertices `{ d }` and a set of k-arcs, and the k-arc is a pair `d →\
    \ ( d1 ,…,dk )`, where `d` is the starting node of k-arcs and `{ d1 ,…,dk }` is\
    \ the set of ending nodes.\n\nIn terms of this definition, an ordinary directed\
    \ graph is a hypergraph in which every arc is a 1-arc. Just as in an ordinary\
    \ digraph, one can define the notion of a path (hyperpath) in a hypergraph.\n\n\
    A hyperpath in a hypergraph is a sequence of node sets, `<S1 , …, Sn >`, and for\
    \ every node `d ∈ Si`, `1 ≤ i ≤ n–1` there is exactly one k-arc `d → (d1 , …,\
    \ dk)` such that `∀ 1 ≤ j ≤ k ( dj ∈ Si+1 )`.\n\nThe definition of a hyperpath\
    \ is a direct generalization of the definition of a path, but a hyperpath in a\
    \ hypergraph looks more like a diagram than a single alternating sequence of nodes\
    \ and arcs. Exactly one k-arc is selected from each vertex. Exactly one k-arc\
    \ is again selected from each vertex obtained, and so on.\n\nAmong the various\
    \ hyperpaths, we are interested in those that begin in the initial state of the\
    \ database and end in final states.\n\nThe decision graph `G(d0 , T)` is a hyperpath\
    \ from `d0` to the set of terminal nodes `T`.\n\nOne can give an equivalent recursive\
    \ definition of the decision graph `G ( d0 , T )`:\n\n1.  if `d0 ∈ T`, then `G\
    \ = d0`.\n2.  if `d0 ∉ T`, and k-arc `d0 → ( d1 ,…, dk )` starts from `d0`, and\
    \ there are solution graphs `G1 , G2 , … , Gk` for vertices `d1 , d2 , …, dk`,\
    \ then `G = d0 → ( d1 ,…, dk ) ∪ G1 ∪ G2 ∪ … ∪ Gk`.\n\nThe cost (weight) of the\
    \ decision graph (i.e. the length of the path in the hypergraph) is determined\
    \ using the inductive definition: `w ( G (d,T) ) = w ( d → ( d1 ,…,dk )) + Σ w\
    \ ( G ( di , T ) )`.\n\nThus the same k arc can be counted many times when calculating\
    \ the length.\n\nLet's consider an example (Fig. Error! The text of the specified\
    \ style is missing from the document. .36 ). Let's assume that nodes 5 and 6 are\
    \ terminal and node 0 is initial. We can claim that there are two decision graphs\
    \ here (they are circled in the figure).\n\n![36 . Decision hypergraphs and k-arcs](Images/image00356.jpeg)\n\
    \nIf we assume that the length of the k-arc is equal to `k`, then\n\n- length\
    \ of the first solution graph = `1+(2+(2)+(2)) = 7`,\n- length of the second solution\
    \ graph = `2+(2+(1+2)) = 7`,\n\nsince by inductive definition some k-arcs can\
    \ be counted multiple times.\n\n#### 3.3.2. Search algorithm on the AND/OR diagram\n\
    \nTo search for paths in a hypergraph, there are algorithms that generalize depth-\
    \ and breadth-traversals to ordinary graphs. The fundamental difference between\
    \ generalizing algorithms is that the search procedure does not stop when a separate\
    \ terminal node is reached. Not only do we need to reach a separate terminal node,\
    \ but we need to build a decision graph whose branches all end in terminal nodes.\n\
    \nIn general, AND/OR graph search algorithms can work without additional information.\
    \ However, in the presence of a scoring function, heuristic search algorithms\
    \ can be used.\n\nThe heuristic search algorithm for the AND/OR diagram is as\
    \ follows.\n\nThe graph is acyclic, there is an evaluation function `F`, and `h`\
    \ satisfies the monotony condition (monotonic constraint): `h ( d ) ≤ w ( d, (\
    \ d1 ,…,dk )) + Σ h ( di )` and the consistency condition (i.e. is the lower bound\
    \ for the exact solution): `h ( d ) ≤ h* ( d )`.\n\nSearch procedures on AND/OR\
    \ graphs are defined as follows.\n\n**Algorithm Error! The text of the specified\
    \ style does not exist in the document. .eleven. Basic search procedure on the\
    \ AND/OR graph.**\n\n```\nproc GS and/or (d0 , R, T)\n  G := d0 {partial solution\
    \ graph}\n  s(d0) := d0 ∈ T {node}\n  F(d0):= h(d0)\n  during ¬ s(d0) do\n   \
    \ d := select(G)\n    when D = zero then Return ( Fail ) end if\n    Open (d,\
    \ G)\n  end while\nEnd proc\n```\n\nHere `s(d): bool` is the label of the node,\
    \ indicating whether a hyperpath leading to the terminal nodes was found for this\
    \ node. If `s(d)= true`, the hyperpath is found, then the node is called resolved.\n\
    \nThe selection procedure, based on the constructed search graph, considers a\
    \ partial decision graph and selects an unexpanded minimum cost node for expansion\
    \ on that graph.\n\n**Algorithm Error! The text of the specified style does not\
    \ exist in the document. .12. The procedure for selecting a node to expand.**\n\
    \n```\nproc Choose (G)\n  O := {d0}\n  for d ∈ O do\n    for q = (d → d1 ,…,dk)\
    \ ∈ Q(d) do\n      if x(d → d1 ,…,dk) then {marked arc}\n        O:=O - {d} {delete\
    \ start}\n        O:=O + ({d1 ,…,dk} \\ T) { end }\n      End if\n    End for\n\
    \  End for\n  m := ∞\n  d' := zero\n  do for d ∈ O\n    if F(d)<m then\n     \
    \ d' := d\n      m := F(d)\n    end if\n  End for\n  return (d')\nend proc\n```\n\
    \nHere `O` are the end nodes of the subgraph of the solution, `Q(d)` is the arc\
    \ set of the node `d`, `x(q)` is the label of the arc `q`.\n\nIn fact, with this\
    \ method, the decision front is traversed again each time from `d0` to the end\
    \ nodes along the marked k-arcs.\n\nThe Open procedure is much more complicated.\
    \ It extends the selected vertex, recalculates the vertex values, marks the k-arcs,\
    \ and marks the allowed vertices, that is, the vertices for which a hyperpath\
    \ to the ending vertices is found. These changes can affect the entire graph.\n\
    \n**Algorithm Error! The text of the specified style does not exist in the document.\
    \ .13. open procedure.**\n\n```\nproc Open (d,G){node open}\n  for r ∈ R do\n\
    \    if rp(d) then\n      G := G + (d → d1 ,…,dk)\n      do for i from 1 to k\n\
    \        if di ∉ G then F(di):=h(di) end if\n        s(di) := di ∈ T\n      End\
    \ for\n    End if\n  End for\n  {recalculation of grades and grades}\n  C := {d}\n\
    \  while C ≠ ∅ do\n    {choice of vertices to recalculate}\n    for d' ∈ C do\n\
    \      if P(d') ∩ C = ∅ then d:=d' end if\n    End for\n    C := C - {d}\n   \
    \ m := ∞\n```\n"
  trans: "\n\n## 5. 算法 A* 不适用于动态搜索情况\n\n事实上，如果允许产生式、目标或规则权重在搜索过程中动态变化，[[56]](#part0005.xhtml#_ftn56)\
    \ 前三段的所有论点都将失效。A* 算法的一致性源于这样一个事实：从给定节点选择另一条路径不取决于我们是如何到达该节点的。而在动态搜索中情况并非如此：从当前节点到目标节点的路径长度也可能不同，这取决于我们是如何到达当前节点的。\n\
    \n本节所述并不意味着 A* 算法毫无价值、不应使用。相反，当没有关于问题性质的额外特定信息时，A* 算法是已知的最佳解决方案。如果存在额外信息，A* 算法可以且应该结合具体任务进行修改。其中最优雅的修改之一将在下一节讨论。\n\
    \n### 3.3. 图中的搜索：AND/OR\n\n在考虑可分解产生式系统时，引入了 AND/OR 图的概念。在这样的图中，节点是数据库的状态或其部分，它们通过两种方式获得：要么应用一条规则，要么将数据库分解为组件。这正是一个图，而不一定只是一棵搜索树。同一顶点\
    \ `d` 也可以作为分解 `d1` 的结果和将规则应用于 `d2` 的结果出现。AND/OR 图在 AI 中被广泛使用。像 A* 这样的搜索算法被专门化和改进以用于\
    \ AND/OR 图。此外，对于超图的某些特殊情况，已知甚至更高效的算法。\n\n#### 3.3.1. AND/OR 计数\n\n让我们细化定义。\n\n\
    AND/OR 图是一个超图，即由一组顶点 `{ d }` 和一组 k-弧组成的二元组，其中 k-弧是一个二元组 `d → ( d1 ,…,dk )`，`d`\
    \ 是 k-弧的起始节点，`{ d1 ,…,dk }` 是终止节点的集合。\n\n根据这个定义，普通有向图是每条弧都是 1-弧的超图。正如在普通有向图中一样，可以在超图中定义路径（超路径）的概念。\n\
    \n超图中的超路径是节点集合的序列 `<S1 , …, Sn >`，并且对于每个节点 `d ∈ Si`，`1 ≤ i ≤ n–1`，都恰好存在一条 k-弧\
    \ `d → (d1 , …, dk)` 使得 `∀ 1 ≤ j ≤ k ( dj ∈ Si+1 )`。\n\n超路径的定义是路径定义的直接推广，但超图中的超路径看起来更像是一个图表，而不是单一的交替节点和弧序列。从每个顶点恰好选择一条\
    \ k-弧。从获得的每个顶点再次恰好选择一条 k-弧，以此类推。\n\n在各种超路径中，我们感兴趣的是那些始于数据库初始状态、终于终止状态的路径。\n\n\
    决策图 `G(d0 , T)` 是从 `d0` 到终止节点集合 `T` 的超路径。\n\n可以给出决策图 `G ( d0 , T )` 的等价递归定义：\n\
    \n1.  若 `d0 ∈ T`，则 `G = d0`。\n2.  若 `d0 ∉ T`，且 k-弧 `d0 → ( d1 ,…, dk )` 从 `d0`\
    \ 出发，且存在顶点 `d1 , d2 , …, dk` 的解图 `G1 , G2 , … , Gk`，则 `G = d0 → ( d1 ,…, dk )\
    \ ∪ G1 ∪ G2 ∪ … ∪ Gk`。\n\n决策图的代价（权重）（即超图中路径的长度）使用归纳定义确定：`w ( G (d,T) ) = w ( d\
    \ → ( d1 ,…,dk )) + Σ w ( G ( di , T ) )`。\n\n因此，计算长度时同一 k-弧可能被多次计算。\n\n让我们看一个例子（图\
    \ Error! The text of the specified style is missing from the document. .36 ）。假设节点\
    \ 5 和 6 是终止节点，节点 0 是初始节点。我们可以断言这里有两个决策图（它们在图中用圆圈标出）。\n\n![36 . 决策超图和 k-弧](img/image00356.jpeg)\n\
    \n如果假设 k-弧的长度等于 `k`，则\n\n- 第一个解图的长度 = `1+(2+(2)+(2)) = 7`，\n- 第二个解图的长度 = `2+(2+(1+2))\
    \ = 7`，\n\n因为根据归纳定义，某些 k-弧可能被多次计算。\n\n#### 3.3.2. AND/OR 图上的搜索算法\n\n为了在超图中搜索路径，存在将普通图的深度和广度遍历推广的算法。推广算法的根本区别在于，搜索过程不会在到达单个终止节点时停止。我们不仅需要到达单个终止节点，还需要构建一个决策图，其所有分支都终于终止节点。\n\
    \n一般来说，AND/OR 图搜索算法可以在没有额外信息的情况下工作。然而，在存在评分函数的情况下，可以使用启发式搜索算法。\n\nAND/OR 图的启发式搜索算法如下。\n\
    \n图是无环的，存在评价函数 `F`，且 `h` 满足单调性条件（单调约束）：`h ( d ) ≤ w ( d, ( d1 ,…,dk )) + Σ h (\
    \ di )` 以及一致性条件（即为精确解的下界）：`h ( d ) ≤ h* ( d )`。\n\nAND/OR 图上的搜索过程定义如下。\n\n**算法\
    \ Error! The text of the specified style does not exist in the document. .eleven.\
    \ AND/OR 图上的基本搜索过程。**\n\n```\nproc GS and/or (d0 , R, T)\n  G := d0 {部分解图}\n \
    \ s(d0) := d0 ∈ T {节点}\n  F(d0):= h(d0)\n  during ¬ s(d0) do\n    d := select(G)\n\
    \    when D = zero then Return ( Fail ) end if\n    Open (d, G)\n  end while\n\
    End proc\n```\n\n此处 `s(d): bool` 是节点的标记，指示是否为此节点找到了通向终止节点的超路径。若 `s(d)= true`，即找到超路径，则该节点称为已解决。\n\
    \n基于构建的搜索图，选择过程考虑部分决策图，并选择该图上代价最小的未扩展节点进行扩展。\n\n**算法 Error! The text of the specified\
    \ style does not exist in the document. .12. 选择要扩展的节点的过程。**\n\n```\nproc Choose\
    \ (G)\n  O := {d0}\n  for d ∈ O do\n    for q = (d → d1 ,…,dk) ∈ Q(d) do\n   \
    \   if x(d → d1 ,…,dk) then {标记的弧}\n        O:=O - {d} {删除起点}\n        O:=O +\
    \ ({d1 ,…,dk} \\ T) { 终点 }\n      End if\n    End for\n  End for\n  m := ∞\n \
    \ d' := zero\n  do for d ∈ O\n    if F(d)<m then\n      d' := d\n      m := F(d)\n\
    \    end if\n  End for\n  return (d')\nend proc\n```\n\n此处 `O` 是解子图的终止节点，`Q(d)`\
    \ 是节点 `d` 的弧集合，`x(q)` 是弧 `q` 的标记。\n\n事实上，使用此方法，每次都会沿着标记的 k-弧从 `d0` 重新遍历决策前沿直到终止节点。\n\
    \nOpen 过程要复杂得多。它扩展选定的顶点，重新计算顶点值，标记 k-弧，并标记允许的顶点，即那些找到了通向终止顶点的超路径的顶点。这些变化可能影响整个图。\n\
    \n**算法 Error! The text of the specified style does not exist in the document.\
    \ .13. open 过程。**\n\n```\nproc Open (d,G){节点扩展}\n  for r ∈ R do\n    if rp(d)\
    \ then\n      G := G + (d → d1 ,…,dk)\n      do for i from 1 to k\n        if\
    \ di ∉ G then F(di):=h(di) end if\n        s(di) := di ∈ T\n      End for\n  \
    \  End if\n  End for\n  {重新计算等级和等级}\n  C := {d}\n  while C ≠ ∅ do\n    {选择要重新计算的顶点}\n\
    \    for d' ∈ C do\n      if P(d') ∩ C = ∅ then d:=d' end if\n    End for\n  \
    \  C := C - {d}\n    m := ∞\n```\n\n"
