- raw: "The material in this chapter is based primarily on mathematical logic, the\
    \ basic concepts of which are assumed to be familiar to the reader. However, all\
    \ necessary definitions and some theorems are briefly repeated in the first sections.\
    \ However, we would like to warn the reader that this chapter is by no means a\
    \ short textbook on mathematical logic. Many important, interesting, and technically\
    \ complex theorems and concepts of formal mathematical logic are either omitted\
    \ here, not proved, or given in a simplified formulation. The reason for this\
    \ is that in this chapter we consider mathematical logic and its main object -\
