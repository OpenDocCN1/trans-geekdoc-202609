    \ system in a given subject) is the proportion of representable tasks in the subject.\n\
    \nTherefore , we call universal (in a particular subject) a way of representing\
    \ knowledge that allows us to formulate all tasks .\n\nApplicability (of a given\
    \ knowledge representation system in a given domain) is the fraction of representable\
    \ problems in the domain that can be solved.\n\nTherefore , we call applicable\
    \ everywhere or total (in a certain subject) such a way of representing knowledge\
    \ that allows us to solve all problems considering real quantitative constraints\
    \ . It is clear that universal and at the same time total knowledge representation\
    \ systems are hardly possible for sufficiently broad subject areas. Furthermore,\
    \ observations show that there is an inverse relationship between universality\
    \ and applicability \n\nThe concept of representing the world in discrete states\
