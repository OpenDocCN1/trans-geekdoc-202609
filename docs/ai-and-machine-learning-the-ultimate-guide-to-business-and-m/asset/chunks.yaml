    ## 3. Mastery of Basic Concepts


    Mastery of basic concepts from the field of artificial intelligence and knowledge
    representation; the ability to study other methods of artificial intelligence
    in the literature; the ability to evaluate and use a specific applied artificial
    intelligence system.


    ---


    # CHAPTER 1: APPLIED ARTIFICIAL INTELLIGENCE SYSTEMS


    Researchers have long been concerned with the problem of human intelligence, although
    attempts to structure this phenomenon of the psyche, or at least to approximate
    more or less rigorous definitions of phenomena and processes that implement human
    intelligence, are not always productive. The authors are not experts in brain
    physiology or psychology, nor will they "play" in the field of classical philosophy.
    Nevertheless (or rather "to support the position") we allow ourselves a few digressions
    and quotations that illustrate the situation in the areas mentioned.


    Today it is generally recognized in psychology that there is a certain general
    intelligence as a universal mental cognitive ability that can be based on a genetically
    determined property of the nervous system to process information with a certain
    pragmatism, speed and accuracy. It is believed that many types of human mental
    activities such as programming, mathematics, lecturing or reading such books require
    intelligence.


    Unfortunately, the understanding of what each of us carries on our skulls, by
    and large, can hardly be considered complete enough. If we talk about the structure
    of the brain as a carrier of intelligence, then it is known that the forming elements
    are cells of a special type - neurons. It has been proven that at least one of
    the forms of neuron interaction is realized electrochemically, but the question
    of whether this form is the only one remains open. The current situation is reminiscent
    of a hypothetical Cro-Magnon attempt to understand how a personal computer works
    and what it can do. But what can one say about the brain if we can''t yet fully
    understand the mechanics of walking on two limbs.


    We see that the term "intelligence" for a person is defined indirectly, through
    the specialty, according to some outcomes of the activity, and does not directly
    indicate what this aspect of the psyche is and how it is implemented. Existing
    definitions found in encyclopedic publications usually give an interpretation
    using synonymy and recursion. For example, the encyclopedic dictionary gives the
    following brief definition:


    > **Intelligence** (from lat. *intellectus* - knowledge, understanding, reason)
    - the ability to think, rational knowledge.


    The explanatory psychological lexicon is close, but differs more precisely in
    the definition:


    > **Intelligence** (from lat. *intellectus* - understanding, cognition) - the
    ability to carry out the process of cognition and effectively solve problems,
    especially when coping with a new set of life problems.


    In other words, definitions do not define anything, but can sometimes stimulate
    the right associations, while the term "intelligence" is very vague and not sufficient
    enough. In particular, it is impossible to understand the nature of intuition,
    the mechanism of belief, the nature of other irrational relationships (love, dislike)
    and so on.


    The word "intelligence" itself didn''t quite legally find its way into the term
    "artificial intelligence". The fact is that the originally original term *artificial
    intelligence* (see paragraph 0) has a much softer meaning. The word *intelligence*
    still means a quick wit rather than a thoughtful mind, as a basic human quality.
    But it is difficult to offer another translation into Russian, and it is already
    too late, so let''s use the existing translation and give it the following meaning.


    The subject of this book is **applied artificial intelligence (AI)**, and here
    we are talking about practical and useful projects, avoiding the Plato-Diogenes
    “naked tail” style [\[3\]](#part0005.xhtml#_ftn3). The concept of AI is consistent
    with the concept of natural intelligence, but actually has little to do with the
    latter. It is important to understand that **AI is not a model of human thinking**
    [\[4\]](#part0005.xhtml#_ftn4), just as rubber, for example, is not a chemical
    model of rubber, even though it shares a number of similar physical properties.
    In fact, an artificial intelligence program uses some algorithms that are also
    inherent in human thinking (after all, every program is written by humans). But
    in real life, a person will solve the same problem differently than the program
    (performing different operations, using different algorithms, using the structures
    of the psyche, which have not yet been sufficiently studied and therefore cannot
    be translated into mathematical formulas and program code). The frontal approach
    - representing "human" algorithms in "machine" language is ineffective, as we
    shall see later. In other words, if we classify a task as intellectual, then every
    solution, by our definition, indicates some kind of intelligence. If the solution
    is obtained programmatically, then this program contains elements of intelligence.


    A program that can solve problems in a subject traditionally classified as intellectual
    is called **artificial intelligence**. Application system with elements


    Another definition: **An applied system with AI elements is a program whose algorithm
    cannot (yet!) be found in a university textbook.** For example, in the early days
    of programming, programs that could create other programs (the first compilers)
    were considered "intelligent". Modern compilers are not considered intelligent
    programs, although they "know" much more about programming and use very sophisticated
    algorithms to solve compilation and optimization problems. Other examples can
    be cited. In each individual case, a concretely applied AI system is the know-how
    of the creators of such software, but each new idea in a specific subject area
    significantly advances the development of artificial intelligence systems in general.
    At the same time, as development progresses, the traditions of assigning subject
    areas to the intellectual sphere and assessing the degree of “intelligence” of
    many tasks are also changing. For example, the calculation of the structure of
    the Eiffel Tower at the end of the 19th century required a lot of work, remarkable
    intelligence and ingenuity, and now such a calculation can be performed by an
    ordinary designer using a ready-made software package quickly, reliably and without
    much mental effort. Experience and intelligence of designers, extensive knowledge
    of mechanics, strength of materials and other engineering disciplines are largely
    accumulated in modern design packages. Such a package undoubtedly shows intelligent
    behavior, but we do not consider it an applied AI system, since all calculations
    in the design package are performed according to known, predefined, unique algorithms.


    In order to support the above theses and to clarify the main definition of an
    applied system with AI elements, we consider some of the topic areas typical of
    artificial intelligence applications.


    ### 1.1. AI Apps at a Glance


    Some typical applications with AI elements are:

