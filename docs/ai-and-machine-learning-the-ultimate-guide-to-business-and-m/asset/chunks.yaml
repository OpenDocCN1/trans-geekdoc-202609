- raw: "Importantly, as in other cases of AI, a number of categories of increasing\
    \ complexity stand out in the class of machine translation systems:\n\n\\-                    \
    \ electronic dictionary;\n\n\\-                     Interlinear of technical texts;\
    \ - literary translation of poems; - Simultaneous translation of speech.\n\nIt\
    \ is clear that these problems cannot be solved uniformly, which means that their\
    \ solutions appear at different times and rely on different technologies.\n\n\
    For each new area of AI application, the same characteristic pattern can be observed\
    \ (Fig. Error! The text of the specified style is missing in the document. .2\
    \ ), which we will illustrate using the example of the history of the development\
    \ of machine translation. After the emergence of a new idea, increased interest\
    \ in it appears, inflated expectations arise, users are waiting for a miracle.\
    \ But the miracle does not happen - AI methods are tedious, complex and their\
    \ development requires considerable natural intelligence. Disillusionment sets\
    \ in, the reorientation leaves the sphere of hectic interest and is sometimes\
    \ even unreasonably hindered. If the idea was fruitful, then despite the decline\
    \ in media interest, the underlying painstaking work in academic circles continues\
    \ and after a while (not immediately!) begins to yield practical results. Interest\
    \ reappears, but no longer idle, but factual and justified.\n\n![](Images/image00326.jpeg)\n\
    \n  .2. The history of the popularity of machine translation\n\nIn March 1947,\
    \ Warren Weaver (1894-1978), Director of Science at the Rockefeller Foundation,\
    \ in correspondence with Andrew D. Booth and Norbert Wiener, first formulated\
    \ the concept of machine translation, which was later (1949) further developed\
    \ in his memorandum addressed to the Fund .\n\nIn 1952 the first conference on\
    \ machine translation was held at the Massachusetts Institute of Technology and\
    \ in 1954 at the Massachusetts Institute of Technology\n\nfirst machine translation\
    \ system, IBM Mark II, developed by IBM in conjunction with Georgetown University,\
    \ was unveiled in New York (this event went down in history as the \"Georgetown\
    \ Experiment\").               A very limited program was presented (it had a\
    \ dictionary of 250 units and 6 rules of grammar), translated into English from\
    \ Russian. After that, such developments spread to Italy, France, England, Japan,\
    \ and an international professional journal was also created.\n\nIn 1959, the\
    \ philosopher Yohoshua Bar-Hillel argued that high-quality, fully automatic machine\
    \ translation was, in principle, impossible to achieve. This achievement had the\
    \ most unfavorable impact on the development of machine translation in the United\
    \ States. A sharp decline in 1966 was associated with a report by ALPAC (Automatic\
    \ Language Processing Advisory Committee) specially established by the US National\
    \ Academy of Sciences. The commission came to the conclusion that machine translation\
    \ is unprofitable: the ratio of the cost and quality of machine translation was\
    \ clearly not in favor of the latter, and there were enough human resources for\
    \ the translation of technical and scientific texts. Therefore, the Ministry of\
    \ Defense decided to stop funding such projects. The topic was no longer fashionable,\
    \ and only qualified enthusiasts and professionals continued the work.\n\nWith\
    \ the development of computer technology in the late 1970s (the advent of microcomputers,\
    \ the development of networks, the increase in storage resources), machine translation\
    \ entered the renaissance. At the same time, the focus has shifted somewhat: the\
    \ researchers have now set themselves the goal of developing \"realistic\" machine\
    \ translation systems in which humans are involved in various phases of the translation\
    \ process. As a result, the first industrial machine translation systems for mass\
    \ use came onto the market in the 1980s.\n\nIn 1990, when machine translation\
    \ systems again became one of the priority areas for the development of the computer\
    \ industry, reaching a new qualitative level after a difficult period of rethinking\
    \ and mutual integration, Larry Childs proposed their classification. He divided\
    \ all \"electronic translators\" into three groups:\n\n1.               FAMT (Fully\
    \ Automated Machine Translation) are tools for fully automated machine translation.\n\
    \nInput Text  Text Analysis / Synthesis  Output Text\n\n2.               HAMT\
    \ (Human-Assisted Machine Translation) is an application for automated machine\
    \ translation of texts, performed with the participation of a human. Input Text\
    \  Editor  Text Analysis / Synthesis  \n\nEditor  Output text\n\n3.              \
    \ MAHT (Machine-Assisted Human Translation) are tools for performing human translations\
    \ with the help of a computer.\n\nInput Text  Translator  Interlinear  Editor\
    \  \n\noutput text\n\nHowever, real-life practice shows that the functioning\
    \ of all machine translation systems that exist today more or less requires the\
    \ involvement of a human editor.\n\nConceptually, the machine translation system\
    \ is built as follows (Fig. Error! The text of the specified style is missing\
    \ from the document. .3 , left): First, the text in the source language is analyzed,\
    \ that is, the data is interpreted in order to “understand the meaning” , and\
    \ then the understood meaning is presented in the form of text in the target language.\
    \ Ideally, the analysis is performed \"to the point of complete comprehension\"\
    , when the entire meaning of the source text is expressed in a hypothetical universal\
    \ metalanguage. Traditionally, this universal metalanguage is called interlingua.\
    \ It should be noted that the ideal has not yet been reached. Modern machine translation\
    \ systems have a three-layer architecture (Fig.\n\nMistake! The text of the specified\
    \ style does not exist in the document. .3 , right). First, the input language\
    \ is analyzed until a certain level of understanding is reached, and this understanding\
    \ is expressed in the construction of various structures over the source text,\
    \ often specific to a particular language. Then, using heuristic algorithms, the\
    \ partially understood structures of one language are transformed into partially\
    \ understood structures of another language. The set of these algorithms is traditionally\
    \ called transfer (from English transfer). Transmission rules are large, using\
    \ huge information resources and very sophisticated algorithms. Finally, the text\
    \ is synthesized in the target language based on the transferred structures of\
    \ the target language (they are not necessarily isomorphic to the structures of\
    \ the source language!). Of course, the transfer phase is the most complex, important\
    \ and knowledge-intensive.\n\n  .3 Structure of the machine translation system\n\
    \nBut the dreams with which mankind embraced machine translation half a century\
    \ ago remain largely dreams - high-quality (\"artistic\") translation of texts\
    \ on the most diverse subjects is still unattainable. What is undisputed, however,\
    \ is the acceleration of the translator's work and the improvement in quality\
    \ when using machine translation systems.\n\nWith the advent of more and more\
    \ new algorithms, techniques and software solutions aimed at computer translation\
    \ of textual information, reliable facts are that such systems have a number of\
    \ advantages over traditional ones.\n\nhandmade translation:\n\n\\-                    \
    \ high speed of translation (the use of machine translation can significantly\
    \ reduce the time required to translate large amounts of text, by 50-70% according\
    \ to modern estimates);\n\n\\-                     Reduction of translation costs\
    \ (with the help of machine translation you can save on the costs of the services\
    \ of professional translators, and when translating “simple” texts you can refuse\
    \ them altogether);\n\n\\-                     Confidentiality of the information\
    \ to be translated (the involvement of a computer in the processing of confidential\
    \ documents guarantees the non-disclosure of their content to a much greater extent\
    \ than the involvement of a translator);"
  fmt: "\n# 机器翻译系统的复杂性与发展历史\n\n重要的是，与 AI 的其他情况一样，在机器翻译系统类别中，可以看出一些复杂度不断增加的类别：\n\n\
    - 电子词典；\n- 技术文本的行间翻译；\n- 诗歌的文学翻译；\n- 语音的同声传译。\n\n很明显，这些问题无法用统一的方法解决，这意味着它们的解决方案出现的时间不同，且依赖于不同的技术。\n\
    \n对于 AI 应用的每个新领域，都可以观察到相同的特征模式（图 2），我们将以机器翻译发展史为例进行说明。新思想出现后，人们对它的兴趣增加，产生过高的期望，用户期待奇迹。但奇迹并未发生——AI\
    \ 方法繁琐、复杂，其发展需要相当多的自然智能。随之而来的是幻灭感，研究方向离开热门关注领域，有时甚至受到无理阻碍。如果这个思想是富有成果的，那么尽管媒体兴趣下降，学术界的艰苦基础工作仍在继续，过一段时间（不是立刻！）开始产生实际成果。兴趣再次出现，但不再是盲目的，而是基于事实且合理的。\n\
    \n![](Images/image00326.jpeg)\n\n**图 2. 机器翻译流行度的历史**\n\n1947 年 3 月，洛克菲勒基金会科学总监\
    \ Warren Weaver（1894-1978）在与 Andrew D. Booth 和 Norbert Wiener 的通信中，首次提出了机器翻译的概念，该概念后来（1949\
    \ 年）在致基金会的备忘录中得到进一步发展。\n\n1952 年，麻省理工学院举办了第一届机器翻译会议；1954 年，由 IBM 与乔治城大学联合开发的首个机器翻译系统\
    \ `IBM Mark II` 在纽约发布（这一事件在历史上被称为“乔治城实验”）。展示了一个非常有限的程序（拥有 250 个词汇单位的词典和 6 条语法规则），可将俄语翻译成英语。此后，此类发展扩展到意大利、法国、英国、日本，并创建了一本国际专业期刊。\n\
    \n1959 年，哲学家 Yohoshua Bar-Hillel 论证了高质量、全自动的机器翻译在原则上是不可能实现的。这一论断对美国机器翻译的发展产生了最不利的影响。1966\
    \ 年的急剧下降与 ALPAC（自动语言处理咨询委员会）的一份报告有关，该委员会由美国国家科学院专门设立。委员会得出结论：机器翻译无利可图——机器翻译的成本与质量之比明显不利于后者，且人力资源足以翻译技术和科学文本。因此，国防部决定停止为此类项目提供资金。该话题不再时髦，只有合格的爱好者和专业人士继续工作。\n\
    \n随着 20 世纪 70 年代末计算机技术的发展（微型计算机的出现、网络的发展、存储资源的增加），机器翻译进入复兴期。同时，研究重点有所转移：研究人员现在的目标是开发“人类参与”的“现实的”机器翻译系统，即人类参与翻译过程的各个阶段。结果，20\
    \ 世纪 80 年代首批面向大众使用的工业机器翻译系统上市。\n\n1990 年，当机器翻译系统再次成为计算机工业发展的优先领域之一，在经历了艰难的反思和相互融合时期后达到新的质量水平时，Larry\
    \ Childs 提出了它们的分类。他将所有“电子翻译器”分为三组：\n\n1. **FAMT**（Fully Automated Machine Translation）——全自动机器翻译工具。\n\
    \n   ```\n   Input Text → Text Analysis / Synthesis → Output Text\n   ```\n\n\
    2. **HAMT**（Human-Assisted Machine Translation）——在人工参与下进行的自动机器文本翻译应用。\n\n   ```\n\
    \   Input Text → Editor → Text Analysis / Synthesis → Editor → Output text\n \
    \  ```\n\n3. **MAHT**（Machine-Assisted Human Translation）——借助计算机进行人工翻译的工具。\n\n\
    \   ```\n   Input Text → Translator → Interlinear → Editor → Output text\n   ```\n\
    \n然而，现实实践表明，目前存在的所有机器翻译系统的运作或多或少都需要人工编辑的介入。\n\n从概念上讲，机器翻译系统的构建如下（图 3，左）：首先分析源语言文本，即解释数据以“理解含义”，然后以目标语言文本的形式呈现理解的含义。理想情况下，分析达到“完全理解”的程度，此时源文本的全部含义用假设的通用中间语言表示。传统上，这种通用中间语言称为\
    \ `interlingua`。值得注意的是，这一理想尚未实现。现代机器翻译系统具有三层架构（图 3，右）。首先，分析输入语言直到达到一定的理解水平，并以在源文本上构建各种结构的形式来表达这种理解，这些结构通常特定于特定语言。然后，使用启发式算法，将一种语言的部分理解结构转换为另一种语言的部分理解结构。这组算法传统上称为\
    \ `transfer`（转换）。转换规模大，使用海量信息资源和非常复杂的算法。最后，基于目标语言的转换结构在目标语言中合成文本（它们不一定与源语言的结构同构！）。当然，转换阶段是最复杂、最重要且知识密集度最高的。\n\
    \n**图 3 机器翻译系统的结构**\n\n但半个世纪前人类对机器翻译的梦想在很大程度上仍是梦想——对最多样化主题文本的高质量（“艺术性”）翻译仍然无法实现。然而，无可争议的是，使用机器翻译系统加快了翻译工作的速度并提高了质量。\n\
    \n随着越来越多旨在计算机翻译文本信息的新算法、技术和软件解决方案的出现，可靠的事实是：与传统人工翻译相比，此类系统具有许多优势：\n\n- **翻译速度高**（根据现代估计，使用机器翻译可以将翻译大量文本所需的时间减少\
    \ 50-70%）；\n- **降低翻译成本**（借助机器翻译，可以节省专业翻译人员的服务成本，翻译“简单”文本时甚至可以完全不用他们）；\n- **待翻译信息的保密性**（计算机参与机密文件处理，比翻译人员参与在更大程度上保证其内容不泄露）。\n"
  trans: "\n\n# 机器翻译系统的复杂性与发展历史\n\n重要的是，与 AI 的其他情况一样，在机器翻译系统类别中，可以看出一些复杂度不断增加的类别：\n\
    \n- 电子词典；\n- 技术文本的行间翻译；\n- 诗歌的文学翻译；\n- 语音的同声传译。\n\n很明显，这些问题无法用统一的方法解决，这意味着它们的解决方案出现的时间不同，且依赖于不同的技术。\n\
    \n对于 AI 应用的每个新领域，都可以观察到相同的特征模式（图 2），我们将以机器翻译发展史为例进行说明。新思想出现后，人们对它的兴趣增加，产生过高的期望，用户期待奇迹。但奇迹并未发生——AI\
    \ 方法繁琐、复杂，其发展需要相当多的自然智能。随之而来的是幻灭感，研究方向离开热门关注领域，有时甚至受到无理阻碍。如果这个思想是富有成果的，那么尽管媒体兴趣下降，学术界的艰苦基础工作仍在继续，过一段时间（不是立刻！）开始产生实际成果。兴趣再次出现，但不再是盲目的，而是基于事实且合理的。\n\
    \n![](img/image00326.jpeg)\n\n**图 2. 机器翻译流行度的历史**\n\n1947 年 3 月，洛克菲勒基金会科学总监 Warren\
    \ Weaver（1894-1978）在与 Andrew D. Booth 和 Norbert Wiener 的通信中，首次提出了机器翻译的概念，该概念后来（1949\
    \ 年）在致基金会的备忘录中得到进一步发展。\n\n1952 年，麻省理工学院举办了第一届机器翻译会议；1954 年，由 IBM 与乔治城大学联合开发的首个机器翻译系统\
    \ `IBM Mark II` 在纽约发布（这一事件在历史上被称为“乔治城实验”）。展示了一个非常有限的程序（拥有 250 个词汇单位的词典和 6 条语法规则），可将俄语翻译成英语。此后，此类发展扩展到意大利、法国、英国、日本，并创建了一本国际专业期刊。\n\
    \n1959 年，哲学家 Yohoshua Bar-Hillel 论证了高质量、全自动的机器翻译在原则上是不可能实现的。这一论断对美国机器翻译的发展产生了最不利的影响。1966\
    \ 年的急剧下降与 ALPAC（自动语言处理咨询委员会）的一份报告有关，该委员会由美国国家科学院专门设立。委员会得出结论：机器翻译无利可图——机器翻译的成本与质量之比明显不利于后者，且人力资源足以翻译技术和科学文本。因此，国防部决定停止为此类项目提供资金。该话题不再时髦，只有合格的爱好者和专业人士继续工作。\n\
    \n随着 20 世纪 70 年代末计算机技术的发展（微型计算机的出现、网络的发展、存储资源的增加），机器翻译进入复兴期。同时，研究重点有所转移：研究人员现在的目标是开发“人类参与”的“现实的”机器翻译系统，即人类参与翻译过程的各个阶段。结果，20\
    \ 世纪 80 年代首批面向大众使用的工业机器翻译系统上市。\n\n1990 年，当机器翻译系统再次成为计算机工业发展的优先领域之一，在经历了艰难的反思和相互融合时期后达到新的质量水平时，Larry\
    \ Childs 提出了它们的分类。他将所有“电子翻译器”分为三组：\n\n1. **FAMT**（Fully Automated Machine Translation）——全自动机器翻译工具。\n\
    \n   ```\n   Input Text → Text Analysis / Synthesis → Output Text\n   ```\n\n\
    2. **HAMT**（Human-Assisted Machine Translation）——在人工参与下进行的自动机器文本翻译应用。\n\n   ```\n\
    \   Input Text → Editor → Text Analysis / Synthesis → Editor → Output text\n \
    \  ```\n\n3. **MAHT**（Machine-Assisted Human Translation）——借助计算机进行人工翻译的工具。\n\n\
    \   ```\n   Input Text → Translator → Interlinear → Editor → Output text\n   ```\n\
    \n然而，现实实践表明，目前存在的所有机器翻译系统的运作或多或少都需要人工编辑的介入。\n\n从概念上讲，机器翻译系统的构建如下（图 3，左）：首先分析源语言文本，即解释数据以“理解含义”，然后以目标语言文本的形式呈现理解的含义。理想情况下，分析达到“完全理解”的程度，此时源文本的全部含义用假设的通用中间语言表示。传统上，这种通用中间语言称为\
