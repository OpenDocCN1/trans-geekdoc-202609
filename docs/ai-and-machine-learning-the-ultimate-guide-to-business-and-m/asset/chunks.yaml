    \n目前尚不清楚 AND/OR 形式能否以这样一种方式进行调整：使得事实与目标的决议，就像事实与规则的决议、规则与目标的决议那样，同样一致且完备。\n\n\
    #### 4.4.8. 演绎系统中的元知识\n\n基于规则的推理系统擅长表示事实、规则和目标，并在决定什么视为事实、什么视为规则、什么视为目标方面留有几乎完全的自由度。\n\
    \n然而，存在对 PSII 非常重要的控制知识（元知识），难以整合到基于规则的演绎系统中。我们给出三个典型的元知识示例。其中一些在前面的示例中已隐式应用。\n\
    \n1.  考虑可能的分支宽度。\n\n    假设演绎系统中有一组分类规则。例如 `dog(x) → animal(x)` `cat(x) → animal(x)`\
    \ 等等，可以有许多此类规则。形式上，此类规则既可正向应用，也可逆向应用。哪个方向更合适？这取决于主题，取决于系统解决的任务类型。构建演绎系统的专家拥有关于规则适当应用方向的知识。例如，考官知道分类规则不应作为逆规则应用。事实是，在目标图增长时，以相反方向应用此类规则会产生非常大的分支宽度。\n\
    \n    此类规则应直接应用。\n\n    如果专家认为该演绎系统中的分类规则仍需逆向应用，他应将其重写为逆否形式：\n\n    `¬ Animal\
    \ (x) → ¬ Dog (x)`\n\n    `¬ Animal (x) → ¬ Cat (x)` 等等。\n\n2.  规则的应用顺序。\n\n \
    \   假设演绎系统具有以下形式的正向规则\n\n    `P → ( Q 1 ∨ … ∨ qk )`\n\n    或以下形式的逆向规则\n\n    `(\
    \ Q 1 & … & Q k ) → P`\n\n    应用此类规则会用 k 条弧扩展图。节点 `Q 1 & ... & Q k` 被进一步考虑的顺序至关重要。例如，在一个用于求解不等式的基于规则的逆向演绎系统中（见第\
    \ 0 节，图 Error! Text of specified style is missing from document. .52），应用规则 4 后，应首先考虑表达式\
    \ `B > 0`，而不是表达式 `A + C > D`。事实是该表达式已经是事实的形式。专家明白，当我们需要某个事实来证明它时，有两种可能情况：要么该事实在问题条件中给出，要么没有。你不能凭空捏造一个事实。当事实已给出时（如示例\
    \ 0 中），应考虑其他表达式，希望将它们归约为给定事实。如果没有未经证实的事实，则必须停止考虑其他表达式，因为考虑它们不会产生任何结果——那个 k-连接仍然不会被包含在决策图中。\n\
    \n    此类信息是借助特殊技术引入演绎系统的元知识。例如借助评价函数，如在产生式系统中那样。\n\n3.  规则的条件应用。\n\n    再次考虑求解不等式的例子（参阅\n\
    \n    第 0 节，图 Error! The text of the specified style does not exist in the document.\
    \ .52）。出于传递性原因，我想说事实 `C > O` 是多余的。有人想插入第八条规则：`x > y & y > z → x > z`。一条非常危险的规则！事实是其右侧总是适用的，并与此系统中的所有东西统一。这里两个简单变量由系统中唯一的谓词连接。无论\
    \ AND/OR 列中有什么节点，它总能与传递性规则的右侧统一。这意味着此类规则将一直被使用。可以说传递性规则**太**适用了！此类规则不应直接使用。它们可以隐藏在统一中（通常如此），或者（一个非常好的解决方案）我们可以向算法添加元知识，规定有些规则在适用时随时可用，而有些规则仅在特殊情况下适用。这些是关于支配规则应用或不应用的当前知识库结构的一些条件。传递性的元知识是：当且仅当左侧合取项之一是事实时，才可应用传递性规则。如果不是这种情况，应用传递性规则会导致目标成倍增加。当这种情况发生时（当传递性规则左侧的合取项之一可与事实比较时），结果只是简单地在事实间移动。此时决策树保持线性。树不分支，只是沿着传递链蜿蜒前进，这正是应用传递性规则所必需的。如果就这样使用，它会生成不知如何处理的\
    \ y。只有在设法以 x 为代价消除 y 的情况下，才能同意生成该 y。\n\n    从上述元知识示例得出的结论如下：元知识不是关于构建推理系统所针对主题的知识，它是关于知识的知识，即如何应用和使用关于该主题的知识，关于该主题的知识具有什么属性等。\n\
    \n两级基于规则的演绎系统取得了非常好的结果。此类顶层系统包含同样以规则形式表示的元知识。高层系统中的事实是对低层系统当前状态的描述。目标是为下属系统构建（综合）一种控制策略。第二层是常规推理系统，其规则、事实和目标源自主题领域。高层系统为低层系统确定规则的应用方向、节点的考虑顺序、规则的应用条件等。\n\
    \n### 第 4 章 结论\n\n1.  带有逻辑外函数和谓词的一阶谓词演算足以在所有合理情况下表示知识。\n\n2.  求证过程是半可判定过程，其有效性取决于所用的策略。\n\
    \n3.  AND/OR 图及类似结构可用于搜索推理，方式与产生式系统中相同。\n\n## 结论\n\n在人工智能发展的半个世纪里，一系列不同的知识表示与处理方法被提出并在实践中接受检验。其中，自然脱颖而出三类、三个簇群，它们的区别在于所用的基础——在具体应用实现中显式或隐式使用的形式化工具\
    \ [[71]](#part0005.xhtml#_ftn71)。这三类是：\n\n-   基于图论的产生式系统；\n"
