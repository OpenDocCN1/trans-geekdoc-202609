    Let''s make an important remark. From the point of view of graph theory, the arc
    that appears in the search graph as a result of applying the decomposition rule
    is a hyperarc – an arc that starts from the decomposable basis and leads simultaneously
    to several bases that are parts of the decomposition. To come to a solution you
    have to find a solution for the first part AND for the second part and so on.
    Therefore, such a hyper-arc is called an I-arc. If ordinary arcs arise from the
    knot, corresponding to the application of the rules, then they have the following
    meaning: to find a solution, you must apply the first rule OR, the second rule
    OR, etc. Therefore such arcs are called OR arcs. If only such arcs are used in
    a graph, it is called an AND/OR graph. In the next two chapters we will come back
    to these concepts and discuss them in more detail, see Sections 3.3 and 4.5.1.


    The theory of formal grammars developed by AN Khomsky is used successfully to
    describe programming languages and other artificial languages. In short, its essence
    is as follows. We consider a finite alphabet A (a set of symbols) and a language
    over this alphabet. Here, a language is simply a set of sequences of alphabetic
    characters (strings). In other words, among all possible chains (of which there
    are obviously infinitely many), one must be able to single out those and only
    those that are chains of language (they also say “include in language”, “belong
    to the language", "are expressions of language").


    To describe the (infinite) set of strings, Chomsky proposed using a formal generative
    grammar — a finite set of rules of the form `α → β` (where `α` and `β` are strings
    of terminal and non-terminal symbols, and `α` is called non-terminal). The left
    side of the rule (i.e. the string `α`) must contain at least one non-terminating
    character. Among all the nonterminal symbols, one stands out and is called the
    initial symbol (or axiom) of the grammar.


    In addition, everything is very simple. Taking the axiom of the grammar as a basis,
    it is legal to construct new chains by replacing each occurrence of the left-hand
    side of any rule in the already constructed chain with the right-hand side of
    that rule. And so on until only terminal symbols remain in the chain. Any chain
    of terminal symbols that can be constructed by such a process enters the language
    by definition, and if the chain cannot be constructed in this way then it does
    not enter the language.


    Of course, all of this is as simple as that, until various tricky questions are
    asked. Can any language be defined like this? Given a grammar and a specific ending
    string, how do you know if it belongs to the language or not? Is the chain generation
    process unique? Do the answers to the previous questions depend on the type (form)
    of the rules?


    But if the main idea is clear, then we can leave these (rather difficult) questions
    to the mathematicians and accept that the syntax of the vast majority of programming
    languages can be easily described by a subclass of formal grammars called context-free
    (the left-hand side of all rules consists of a single non-terminal symbol). For
    this subclass of grammars, all questions related to detecting the membership of
    a string in a language (this is called parsing or parsing) are reliably solved.


    ## CONCLUSIONS ON CHAPTER 2


    1. Production systems are historically the first and still frequently used form
    of representing knowledge.

    2. Production systems are effectively implemented programmatically and are the
    foundation of many practical software systems.

    3. The use of product systems can only make sense if the associated limitations
    and disadvantages are fully understood.


    # CHAPTER 3. SOLUTION ALGORITHMS


    Solution-seeking algorithms are so numerous and varied that the use of this term
    without proper comment can be misleading. In the general case, the search algorithm
    searches for a solution to the problem in a specific search space. The search
    space can be discrete or continuous; can be finite or potentially infinite; the
    metric properties of space may be given or unknown; the properties of the solution
    sought can be fixed or change during the search. In all these and many other cases,
    a wide variety of algorithms are used, some of which have little in common. In
    our opinion, an exhaustive test of all search algorithms is technically hardly
    possible and the value of such a hypothetical test would be questionable. Therefore,
    we limit ourselves to a special area – algorithms for finding solutions in applied
    systems with elements of artificial intelligence.


    Even with this limitation, a detailed analysis of all algorithms used seems too
    extensive. We allow ourselves to narrow the scope further by restricting ourselves
    to an analysis of the most popular and representative approaches to search for
    inference in systems based on productions, i.e. with as basic constructions of
    the form `p → q` introduced in the second chapter. In the agreements made, it
    is natural to represent the search space as a graph (or mesh) of a particular
    form, where the nodes represent the states of the fact base and the arcs correspond
    to the application of productions [[44]](#part0005.xhtml#_ftn44). The result of
    a search for a solution on a graph is always a route (chain, output) leading from
    the start node to the goal node. Of course, the new narrowing of the study area
    simplifies our task, but even now we cannot single out a best universal algorithm
    for finding a solution! The fact is that a very important (if not decisive) role
    in the search for a solution is played by the specific properties of the nodes
    and arcs of the search graph, which are determined by the purpose of the application
    and, consequently, by the nature of the productions themselves.


    Thus the problem of finding a solution in a system of productions can be reduced
    to the problem of finding a route on a graph. When choosing a suitable algorithm
    for solving a particular problem on a graph, we need to take into account many
    properties of the search graph (for example, to decipher the terms, we refer to
    the book [17]), namely: whether the graph is directed (digraph), whether cycles
    are allowed in it (and what are these cycles of nature), can two nodes be connected
    by more than one arc (multigraph), is the graph multipart (and to what extent),
    what do we know about the connectivity and degrees of the corners of the graph,
    what is the cardinality of the sets of nodes and arcs (is the graph finite), whether
    the graph is labeled, weighted (and what combination of these properties) and
    much more. It is important to understand that all of these properties are determined
    by the formulation of the problem, more specifically by the choice of representing
    the problem, and are not arbitrary. For example, if we have a good acyclic graph
    algorithm, but the search graph for a given problem contains cycles, then this
    algorithm is of little use.

