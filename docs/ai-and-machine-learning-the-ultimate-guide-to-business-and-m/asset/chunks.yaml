  fmt: "\n# The Solution Method for Automatic Theorem Proving\n\nThe solution method\
    \ is a method for automatic theorem proving based on refuting the set of premises\
    \ `A` and negating the objective theorem `G` using the solution rule.\n\nConsider\
    \ the procedure for applying the solution method: Suppose it is necessary to find\
    \ the derivative of `A ⊢ g`.\n\n1. Each formula of formula set `A` and formula\
    \ `¬G` are independently converted into sets of sets.\n2. Resolvable sentences\
    \ are found in the resulting set of sentences.\n3. The resolution rule is applied\
    \ to them, and the resolution is added to the set until an empty set is obtained.\n\
    \nIn this case, the following results are possible:\n\n1. As a result of applying\
    \ the solving method, an empty formula is obtained. The theorem is proved. We\
    \ constructed the derivation of formula `G` from formulas `A`.\n2. As a result\
    \ of applying the solving method, no empty formula is obtained, and there are\
    \ no solvable ones among the current set of sets. We have thus disproved the theorem,\
    \ which means that the formula `G` cannot be derived from the set of formulas\
    \ `A`.\n3. The process doesn't end. The resolution rule is applied, many proposals\
    \ are added, among them there are no empty ones, and there are solvable ones.\
    \ It means nothing.\n\nIn other words, the resolution method is a partially correct\
    \ procedure. The third result cannot be called a loop because there is no way\
    \ to determine why the resolution procedure produces new resolvents, but it does\
    \ not produce an empty set. Does this mean that the theorem is true, but we just\
    \ didn't wait for its completion? Not known. Does this mean that the result will\
    \ never be an empty formula? And we don't know that either. This is a logically\
    \ unsolvable problem. In principle, it is impossible to say how long you will\
    \ have to wait for an answer to this question.\n\n## 4.1.7. Software Implementation\
    \ of the Solution Method\n\nAll of this can be written in terms of Algorithm 4.3.\n\
