    \n#### 1.1.1. Natural language understanding and machine translation\n\nThe process\
    \ of understanding natural language is the process of transferring knowledge from\
    \ one native speaker to another.\n\nFor all its apparent simplicity and familiarity,\
    \ this process is extremely complex. This implies the existence of a common domain\
    \ of knowledge for both partners and agreed mechanisms for representing knowledge\
    \ in the form of data, as well as the existence of an inverse mechanism for extracting\
    \ knowledge from data.\n\nThe computer implementation of the natural language\
    \ understanding process requires powerful computational resources controlled by\
    \ non-trivial (intelligent) software systems. Let's see what's the problem here.\
    \ Suppose we have two intelligent agents, let them be human first. The first is\
    \ the source of knowledge, let's call it A, and the second is the receiver of\
    \ knowledge, let's call it B. Two mechanisms are involved in the process of understanding.\
    \ First, A has an algorithm that allows you to turn hypothetical knowledge into\
    \ data, a signal (text, speech, or other forms of natural language expression\
    \ [\\[5\\]](#part0005.xhtml#_ftn5)) —a knowledge representation mechanism . Second,\
    \ B has a mechanism that allows you to turn the received signal back into knowledge\
    \ - the extraction (knowledge) mechanism . If we accept that these mechanisms\
    \ are implemented by algorithms [\\[6\\]](#part0005.xhtml#_ftn6), then it is clear\
    \ that each of them has a domain and a range of values, an input and an output.\
    \ Understanding occurs when the output of the knowledge representation algorithm\
    \ and the input of the knowledge extraction algorithm overlap at least in a common\
    \ interpretation; and full understanding is achieved when these realms coincide.\n\
    \nLet's give some examples. Let us, the author, be Agent A and you, dear reader\
    \ , Agent B. The next sentence: \"ovelan avarps her ilasipaz otsorp ym\" will\
    \ most likely confuse and misunderstand you at first moment. Here Agent A uses\
    \ a non-standard method of representing knowledge, making it difficult for Agent\
    \ B to extract knowledge . Another example. If A uses a language that B doesn't\
    \ speak (let's say if the text of this paragraph was read to you in Chinese by\
    \ a Chinese who knows Russian, if you don't know Chinese), then this is what happens:\
    \ the knowledge representation mechanism works, the Mechanism extraction works,\
    \ but proper understanding does not occur.\n\nRussian-speaking agent B could evaluate\
    \ the musicality of the language, the unusualness of sound combinations ... and\
    \ in the end come to the conclusion that he, agent B , nothing (!) there is an\
    \ empty general interpretation. And here is an example of an \"orthogonal [\\\
    [7\\]](#part0005.xhtml#_ftn7)\" general interpretation. A Russian girl asks her\
    \ boyfriend (Bulgarian): Do you love me? - In response, he shakes his head (from\
    \ shoulder to shoulder). - The girl is crying with sorrow when she should be jumping\
    \ with happiness! – The fact is that among the Bulgarians, our affirmative nod\
    \ is a gesture of denial, and shaking our heads from side to side means affirmation.\n\
    \nIt is enough for a sage to say a word for another sage to understand. In other\
    \ words, for sages, the total amount of data transferred can be significantly\
    \ less than for average people, due to more powerful knowledge representation\
    \ and extraction mechanisms.\n\nA common interpretation is a set of semantic rules\
    \ that are interpreted equally by both sides and that connect linguistic constructions\
    \ with their semantic load.\n\nNow let's turn to computers. In computers, knowledge\
    \ representation mechanisms and knowledge retrieval are trivial, understanding\
    \ is reduced to data transfer. Thus, when computers are linked by a communication\
    \ channel and data formats are agreed upon, then understanding is easy to achieve,\
    \ otherwise understanding cannot be achieved in any way. The critical case that\
    \ is the focus of our attention is the mutual understanding of humans and computers.\
    \ There are two fundamentally different ways of human communication with a computer.\
    \ The first of these is when a person is able to understand a computer. This is\
    \ not the merit of a computer, but the ability of a person that everyone around\
    \ them calls a programmer. The second is when a computer can understand a person.\
    \ Such a computer must contain elements of AI. Since intelligence, even artificial\
    \ intelligence, is difficult to fit into the hardware of a conventional computer,\
    \ it is clear that understanding must be provided in software. And such programs\
    \ have been created for a relatively long time, although all of them, without\
    \ exception, are very, very limited in understanding natural language or even\
    \ a more or less broad fragment of language.\\\\\n\n![](Images/image00325.jpeg)\n\
    \n  .one. General context of understanding\n\nOne of the first applied AI systems\
    \ that understood natural language was the ELIZA program, developed by J. Weizenbaum\
    \ in 1966.\n\nMore recently, Terry Winograd wrote the book The Natural Language\
    \ Understanding Program describing the ELIZA program \\[2\\]. The structure of\
    \ the ELIZA program was extremely simple, containing only a few dozen heuristic\
    \ rules designed to recognize grammatical structures (by simple pattern matching)\
    \ and convert incoming questions into \"natural\" answers. As a result, this program\
    \ was able to conduct a completely plausible dialogue, often answering a question\
    \ with a question at the same time. An example of a dialogue with the ELIZA program:\n\
    \n— ELIZA, you are a computer program.\n\nWhy do you think I'm a computer program?\n\
    \n\"Because Weizenbaum put you together.\n\n“Tell me about Weizenbaum.\n\nDespite\
    \ its simplicity, this program has applications in psychotherapy. The psychotherapist's\
    \ conversation with the patient can take quite a long time before the therapeutic\
    \ effect occurs. ELIZA successfully simulated a dialogue with a Rogerian psychologist\
    \ for many hours (the essence of this method is that the therapist listens to\
    \ the patient and asks guiding questions, thereby improving the mental state of\
    \ the latter ... or not improving ). Many patients remarked that these sessions\
    \ were extremely useful to them and refused to believe that a computer program\
    \ was speaking to them and not a professional human psychologist.\n\nWeizenbaum\
    \ himself, shocked by the behavior of his descendants, soon came to the conclusion\
    \ that \"the main ideology of the development of artificial intelligence - artificial\
    \ intelligence - is immoral\". Joseph Weizenbaum (1923-2008) is a well-known figure\
    \ in the field of artificial intelligence, Professor Emeritus at MIT (Massachusetts\
    \ Institute of Technology). Founder of Computer Professionals for Social Responsibility.\
    \ He earned a reputation as a dissident and heretic among computer scientists\
    \ for his views on the responsibility of programmers to humanity. \"There are\
    \ tasks that shouldn't be left to computers, whether computers can be made for\
    \ them or not.\" \n\nMachine translation is a particular refinement of the problem\
    \ of understanding natural language. \"Special\" is primarily determined by the\
    \ type of information exchange - a monologue instead of a dialogue.\n\nSystems\
    \ for automatically translating texts from one natural language to another form\
    \ an important class of software systems with elements of artificial intelligence.\n\
    \nTranslating from one natural language to another is undoubtedly an intellectual\
    \ task. Automated machine translation has attracted the attention of researchers\
    \ almost earlier than other fields due to the obvious practical relevance of this\
    \ task."
