    — a knowledge representation mechanism. Second, B has a mechanism that allows
    you to turn the received signal back into knowledge - the extraction (knowledge)
    mechanism. If we accept that these mechanisms are implemented by algorithms [\[6\]](#part0005.xhtml#_ftn6),
    then it is clear that each of them has a domain and a range of values, an input
    and an output. Understanding occurs when the output of the knowledge representation
    algorithm and the input of the knowledge extraction algorithm overlap at least
    in a common interpretation; and full understanding is achieved when these realms
    coincide.


    Let''s give some examples. Let us, the author, be Agent A and you, dear reader,
    Agent B. The next sentence: "ovelan avarps her ilasipaz otsorp ym" will most likely
    confuse and misunderstand you at first moment. Here Agent A uses a non-standard
    method of representing knowledge, making it difficult for Agent B to extract knowledge.
    Another example. If A uses a language that B doesn''t speak (let''s say if the
    text of this paragraph was read to you in Chinese by a Chinese who knows Russian,
    if you don''t know Chinese), then this is what happens: the knowledge representation
    mechanism works, the Mechanism extraction works, but proper understanding does
    not occur.


    Russian-speaking agent B could evaluate the musicality of the language, the unusualness
    of sound combinations ... and in the end come to the conclusion that he, agent
    B, nothing (!) there is an empty general interpretation. And here is an example
    of an "orthogonal [\[7\]](#part0005.xhtml#_ftn7)" general interpretation. A Russian
    girl asks her boyfriend (Bulgarian): Do you love me? - In response, he shakes
    his head (from shoulder to shoulder). - The girl is crying with sorrow when she
    should be jumping with happiness! – The fact is that among the Bulgarians, our
    affirmative nod is a gesture of denial, and shaking our heads from side to side
    means affirmation.


    It is enough for a sage to say a word for another sage to understand. In other
    words, for sages, the total amount of data transferred can be significantly less
    than for average people, due to more powerful knowledge representation and extraction
    mechanisms.


    A common interpretation is a set of semantic rules that are interpreted equally
    by both sides and that connect linguistic constructions with their semantic load.


    Now let''s turn to computers. In computers, knowledge representation mechanisms
    and knowledge retrieval are trivial, understanding is reduced to data transfer.
    Thus, when computers are linked by a communication channel and data formats are
    agreed upon, then understanding is easy to achieve, otherwise understanding cannot
    be achieved in any way. The critical case that is the focus of our attention is
    the mutual understanding of humans and computers. There are two fundamentally
    different ways of human communication with a computer. The first of these is when
    a person is able to understand a computer. This is not the merit of a computer,
    but the ability of a person that everyone around them calls a programmer. The
    second is when a computer can understand a person. Such a computer must contain
    elements of AI. Since intelligence, even artificial intelligence, is difficult
    to fit into the hardware of a conventional computer, it is clear that understanding
    must be provided in software. And such programs have been created for a relatively
    long time, although all of them, without exception, are very, very limited in
    understanding natural language or even a more or less broad fragment of language.


    ![General context of understanding](Images/image00325.jpeg)


    One of the first applied AI systems that understood natural language was the ELIZA
    program, developed by J. Weizenbaum in 1966.


    More recently, Terry Winograd wrote the book *The Natural Language Understanding
    Program* describing the ELIZA program [2]. The structure of the ELIZA program
    was extremely simple, containing only a few dozen heuristic rules designed to
    recognize grammatical structures (by simple pattern matching) and convert incoming
    questions into "natural" answers. As a result, this program was able to conduct
    a completely plausible dialogue, often answering a question with a question at
    the same time. An example of a dialogue with the ELIZA program:


    — ELIZA, you are a computer program.


    Why do you think I''m a computer program?


    "Because Weizenbaum put you together.


    “Tell me about Weizenbaum.


    Despite its simplicity, this program has applications in psychotherapy. The psychotherapist''s
    conversation with the patient can take quite a long time before the therapeutic
    effect occurs. ELIZA successfully simulated a dialogue with a Rogerian psychologist
    for many hours (the essence of this method is that the therapist listens to the
    patient and asks guiding questions, thereby improving the mental state of the
    latter ... or not improving). Many patients remarked that these sessions were
    extremely useful to them and refused to believe that a computer program was speaking
    to them and not a professional human psychologist.


    Weizenbaum himself, shocked by the behavior of his descendants, soon came to the
    conclusion that "the main ideology of the development of artificial intelligence
    - artificial intelligence - is immoral". Joseph Weizenbaum (1923-2008) is a well-known
    figure in the field of artificial intelligence, Professor Emeritus at MIT (Massachusetts
    Institute of Technology). Founder of Computer Professionals for Social Responsibility.
    He earned a reputation as a dissident and heretic among computer scientists for
    his views on the responsibility of programmers to humanity. "There are tasks that
    shouldn''t be left to computers, whether computers can be made for them or not."


    Machine translation is a particular refinement of the problem of understanding
    natural language. "Special" is primarily determined by the type of information
    exchange - a monologue instead of a dialogue.


    Systems for automatically translating texts from one natural language to another
    form an important class of software systems with elements of artificial intelligence.


    Translating from one natural language to another is undoubtedly an intellectual
    task. Automated machine translation has attracted the attention of researchers
    almost earlier than other fields due to the obvious practical relevance of this
    task.

    '
  trans: '

    - 自然语言理解与机器翻译；

    - 智能数据库与问答系统；

    - 专家系统与自动定理证明；

    - 机器人动作规划与模式识别；

    - 智力游戏。


    此列表既不完整也不正交。这只是我们挑选的一些最喜爱的示例。


    ### 1.1.1. 自然语言理解与机器翻译


    理解自然语言的过程，就是将知识从一位母语使用者传递给另一位母语使用者的过程。


    尽管这一过程看似简单且熟悉，实则极其复杂。这意味着双方存在共同的知识领域，并就以数据形式表示知识的机制达成一致，同时也存在从数据中提取知识的逆机制。


    自然语言理解过程的计算机实现，需要由非平凡（智能）软件系统控制的强大计算资源。让我们看看这里的问题所在。假设我们有两个智能体，姑且设为人类。第一个是知识源，称之为
    A；第二个是知识接收者，称之为 B。理解过程涉及两个机制。首先，A 拥有一个算法，允许将假设性知识转化为数据、信号（文本、语音或其他形式的自然语言表达 [[5]](#part0005.xhtml#_ftn5)）——即知识表示机制。其次，B
    拥有一个机制，允许将接收到的信号转化回知识——即提取（知识）机制。如果我们接受这些机制由算法实现 [[6]](#part0005.xhtml#_ftn6)，那么显然，它们各自都有一个定义域和值域、一个输入和一个输出。当知识表示算法的输出与知识提取算法的输入至少在共同解释上重叠时，理解就发生了；而当这两个领域完全重合时，则达成了完全理解。


    举几个例子。让我们作者作为智能体 A，亲爱的读者您作为智能体 B。下一句话："ovelan avarps her ilasipaz otsorp ym" 很可能会在最初时刻让您困惑和误解。这里智能体
    A 使用了非标准的知识表示方法，导致智能体 B 难以提取知识。另一个例子。如果 A 使用 B 不懂的语言（假设这段文字由一位懂俄语的中国人用中文读给您听，而您不懂中文），那么会发生这种情况：知识表示机制在工作，提取机制也在工作，但真正的理解并未发生。


    讲俄语的智能体 B 可以评价语言的音乐性、音素组合的异常性……最终得出结论：他，智能体 B，什么也没懂（！），存在一个空的共同解释。还有一个“正交 [[7]](#part0005.xhtml#_ftn7)”共同解释的例子。一位俄罗斯女孩问她的男朋友（保加利亚人）：你爱我吗？——男朋友摇了摇头（左右晃动）。——女孩悲伤地哭泣，而按理说她应该高兴得跳起来！——事实是，在保加利亚人中，我们的肯定性点头是否定的手势，而左右摇动头部则表示肯定。


    对智者而言，说一个字足矣，另一智者便能理解。换句话说，由于拥有更强大的知识表示和提取机制，智者之间传递的数据总量可能显著少于普通人。


    共同解释是一组语义规则，双方对其解释一致，且将语言结构与其语义负载联系起来。


    现在让我们转向计算机。在计算机中，知识表示机制和知识检索是平凡的，理解简化为数据传输。因此，当计算机通过通信通道连接且数据格式商定一致时，理解易于实现；否则理解根本无法实现。我们关注的关键情况是人与计算机的相互理解。人与计算机交流有两种根本不同的方式。第一种是人能理解计算机。这不是计算机的功劳，而是人的能力，周围所有人都称这样的人为程序员。第二种是计算机能理解人。这样的计算机必须包含
    AI 元素。既然智能，即使是人工智能，也难以塞进常规计算机的硬件中，显然理解必须由软件提供。此类程序创建已有一段相对较长的时间，尽管它们无一例外都非常、非常有限地理解自然语言，甚至只是语言中一个或多或少宽泛的片段。


    ![理解的一般语境](img/image00325.jpeg)


    最早理解自然语言的应用 AI 系统之一是 ELIZA 程序，由 J. Weizenbaum 于 1966 年开发。


    稍晚些时候，Terry Winograd 撰写了《自然语言理解程序》一书来描述 ELIZA 程序 [2]。ELIZA 程序的结构极其简单，仅包含几十条启发式规则，旨在识别语法结构（通过简单的模式匹配）并将传入的问题转化为“自然”的回答。结果，该程序能够进行完全貌似合理的对话，常常以反问来回答问题。与
    ELIZA 程序对话的示例：


    — ELIZA，你是一个计算机程序。


    你为什么认为我是一个计算机程序？


    “因为 Weizenbaum 把你组装起来的。


    “告诉我关于 Weizenbaum 的事。


    尽管很简单，但该程序在心理治疗中有应用。心理治疗师与患者的交谈可能持续很长时间才会产生治疗效果。ELIZA 成功模拟了与罗杰斯学派心理学家的对话数小时（该方法的精髓在于治疗师倾听患者并提出引导性问题，从而改善后者的心理状态……或者不改善）。许多患者表示这些疗程对他们极其有用，并拒绝相信是计算机程序而非专业人类心理学家在与他们交谈。


    Weizenbaum 本人因其“后代”的行为而震惊，很快得出结论：“人工智能发展的主要意识形态——人工智能——是不道德的”。Joseph Weizenbaum
    (1923-2008) 是人工智能领域的知名人物，麻省理工学院 (MIT) 名誉教授。计算机专业人士社会责任组织的创始人。因其对程序员对人类责任的看法，他在计算机科学家中赢得了异见者和异端者的声誉。“有些任务不应交给计算机，无论是否能为它们制造出计算机。”


    机器翻译是自然语言理解问题的一个特定细化。“特定”主要由信息交换的类型决定——独白而非对话。


    将文本从一种自然语言自动翻译成另一种自然语言的系统，构成了一类包含人工智能元素的重要软件系统。


    从一种自然语言翻译成另一种自然语言无疑是一项智力任务。由于该任务显而易见的实际相关性，自动机器翻译比其他领域更早吸引了研究人员的关注。

    '
