    \ [\\[63\\]](#part0005.xhtml#_ftn63).\n\nThe semantic concept of interpretation\
    \ leads to the concept of logical consequence.\n\nfollow logically. One says that\
    \ the formula G follows logically from the formulas F 1 , …, F n (notation F 1\
    \ , …, F n  G) if the formula G is true in every interpretation in which the\
    \ formulas F 1 , …, F n are true :\n\nF1 | \\_ I &…&F n | I G | I. \\_\n\nLogical\
    \ consequence is a semantic concept. Derivability is a syntactic concept. They\
    \ may be related, and they are clearly related if the theory is appropriate, or\
    \ they may not be so directly related. It all depends on R 's inference rules\
    \ .\n\nOne says that the rules of inference R are consistent if the formal derivability\
    \ yields a logical consequence: F 1 , …, F n  R G  F 1 , …, F n  G.\n\nThe\
    \ inference rules R are said to be complete 66 if some logical consequence is\
    \ confirmed by formal deducibility: F 1 , …, F n  G  F 1 , …, F n R G \\_"
  fmt: "\n# 形式理论基础\n\n形式理论的签名、公理和推理规则通常可以任意选择，但需遵守定义中规定的限制。然而，仅为形式理论而构建形式理论是无益的。在本书语境下，我们关注那些描述真实对象及其相互关系的形式理论。现实世界对象的集合及其相互关系通常被称为**领域**。三个重要术语——**可导性**、**逻辑后果**和**解释**——构成了一个术语循环，通过它可以对非形式化事物进行形式化描述。\n\
    \n## 可导性\n\n如果推导规则中存在规则 `R` 使得 `(F₁, …, Fₙ, G) ∈ R`，则称公式 `G` 可直接从公式集 `F₁, …, Fₙ`\
    \ **导出**。\n\n公式 `F₁, ..., Fₙ` 称为**前提**，公式 `G` 称为推理规则 `R` 的**结论**。在本书中，我们通常通过水平线分隔前提和结论，并在适用时指定推理规则名称来表示直接可导性：\n\
    \n```\nF₁, …, Fₙ\n──────── R\n      G\n```\n\n如果存在公式序列 `<A₁, A₂, …, Aᵢ, …, Aₙ>`，其中\
    \ `Aₙ = G`，且每个公式 `Aᵢ` 要么是公理，要么是公式 `F₁, …, Fₙ` 之一，要么根据某个推理规则 `R` 直接从某些较早的公式导出，则称公式\
    \ `G` 在给定形式理论中**可从公式集 `F₁, …, Fₙ` 导出**。\n\n公式 `G` 可从公式 `F₁, ..., Fₙ` 导出记作：\n\n\
    ```\nF₁, …, Fₙ ⊢ G\n```\n\n公式 `F₁, …, Fₙ` 称为**结论假设**，序列本身 `<A₁, A₂, …, Aᵢ, …,\
    \ Aₙ>` 称为**形式推导**。\n\n如果公式 `G` 仅能从公理导出——不使用假设，则 `G` 称为**形式理论命题**。此事实用符号 `⊢ G`\
    \ 表示。\n\n## 可判定性与定理\n\n我们之前定义了（有效）可知性和（有效）公理化性。我们认为有必要对定理概念作类似说明，引用 E. Mendelssohn\
    \ [19] 的观点：\n\n> 如果存在一个算法，对于理论中的任意公式，都能在有限步骤内判定其在该理论中是否存在导出，则称该理论为**可判定**的；否则称为**不可判定**的。粗略地说，可判定理论是指可以发明一台机器来检验公式是否为该理论定理的理论；而在不可判定理论中，要完成相同任务需要越来越多独立的创造行为。\n\
    \n我们看到，**导出**、**推导**和**定理**这些术语纯粹是句法上的，不涉及真理的语义概念。当形式理论宣称定理可从公理导出时，这绝不意味着该定理在任何实质意义上是\"\
    真\"或\"正确\"的。这仅意味着我们找到了一个公式的形式序列，它以特定方式开始（公理），以特定方式结束（定理），且所有中间公式以特定方式相关（推理规则）。为了转向语义，必须引入**解释**概念。\n\
    \n## 解释\n\n形式理论到领域 `M` 的**解释 `I`** 是一组函数，将形式理论的构造映射到领域 `M` 的对象集合和关于对象的陈述。\n\n\
    需要多个函数而非单一函数，因为公式中使用的每种形式构造类型都需要自己的函数。例如，在解释谓词演算公式时（见下段），每个形式常量必须关联一个实际对象，形式函数符号关联具体映射，形式谓词关联具体关系。此后，公式成为有意义的陈述，我们可以从意义角度尝试检验该陈述是真还是假。\n\
    \n公式 `A` 在解释 `I` 中的真值记为 `A | I`，或若上下文清楚表明是解释 `I`，则简记为带解释特征的公式名自身：`A|`。公式的真值总是由常量\
    \ `true` 或 `false` 之一确定。为不受 `A | I = true` 类型数据记录束缚，我们写 `A | I`（`¬A | I`），意为公式为真（假），或简记为\
    \ `A|`（`¬A|`）——考虑到上述唯一性说明。\n\n- 若公式在**任意**解释中为真：`∀I (A | I)`，则称其为**有效**或**重言式**。\n\
    - 若至少存在**一种**解释 `I` 使其为真：`∃I (A | I)`，则称其为**可满足**的。\n- 若在**任意**解释中均为假：`∀I (¬A\
    \ | I)`，则称其为**不可满足**或**矛盾**。\n\n## 适当性、模型与完备性\n\n设有形式理论、特定主题及给定解释。设 `T` 为形式理论的定理集，`P`\
    \ 为主题的真陈述集。若在解释 `I` 下集合 `T` 和 `P` 发现一一对应，则再好不过：所有形式可导出的陈述在意义上为真，所有在意义上为真的陈述形式上可导出。此时称该形式理论**适合**该主题。适当性是强大而罕见的性质。实践中常需满足较弱性质。\n\
    \n若存在解释 `I` 使该解释下所有导出公式均为真：`∀G (⊢ G → (G | I))`，则称该领域为形式理论的**模型**。\n\n若存在解释 `I`\
    \ 使所有真公式均可导出：`∀G ((G | I) → ⊢G)`，则称形式理论对该主题是**完备**的。\n\n**充分理论**拥有模型且在其模型中完备。\n\
    \n必须清楚理解：形式理论不是神圣启示或人类心智固有的先天法则——形式理论是人类为形式化特定主题领域而发明的，这些发明的成败取决于发明者的独创性。同一主题领域可有不同形式化，这常发生：不同形式化相互竞争和演变。\n\
    \n## 逻辑后果\n\n语义解释概念引出**逻辑后果**概念。\n\n称公式 `G` 从公式 `F₁, …, Fₙ` **逻辑后随**（记作 `F₁, …,\
    \ Fₙ ⊨ G`），若在使公式 `F₁, …, Fₙ` 为真的**每一种**解释中，公式 `G` 均为真：\n\n```\nF₁ | I & … & Fₙ\
    \ | I → G | I\n```\n\n**逻辑后果**是语义概念。**可导性**是句法概念。二者可能相关，若理论适当则明显相关，也可能不那么直接相关。一切取决于\
    \ `R` 的推理规则。\n\n若形式可导性蕴含逻辑后果：`F₁, …, Fₙ ⊢R G → F₁, …, Fₙ ⊨ G`，则称推理规则 `R` 是**一致**的。\n\
    \n若某逻辑后果由形式可导性确证：`F₁, …, Fₙ ⊨ G → F₁, …, Fₙ ⊢R G`，则称推理规则 `R` 是**完备**的。\n"
