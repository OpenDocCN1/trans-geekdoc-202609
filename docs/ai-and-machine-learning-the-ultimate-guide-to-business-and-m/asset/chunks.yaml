    # 机器人行走与视觉感知的挑战


    成功让双足机器人行走，即便以当前的科技发展水平来看，也是一项极其困难的任务。事实是，行走时人体的重心几乎从未位于支撑区上方。从力学角度看，我们不是在“行走”，而是在持续“跌倒”，只是成功地将脚伸向正确的位置并继续前进。19
    世纪的正面方法——构建一个具有所需自由度的机械模型，并在每一步求解相应的微分方程组——行不通。即使是最快的现代计算机，也来不及实时执行必要的计算。显而易见，我们行走时大脑并未在求解方程组。让机器人行走采用的是完全不同的技术。该领域的任何新成就都被视为重大成功，从上文提到的国际展览展品列表便可见一斑。就快速奔跑和跳跃（达到专业运动员水平）而言，双足快速奔跑跳跃机器人至今仍是一个几乎不切实际的任务
    [\[10\]](#part0005.xhtml#_ftn10)。幸运的是，能像著名电影中施瓦辛格扮演的“终结者”那样灵活移动和射击的机器人尚不可能实现。


    ## 技术视觉的局限


    目前尚无合适的装置能让机器人像人类一样“看见”周围世界，并对“视觉”变化做出同等水平的反应。我们看世界的方式，是基于智力活动的长期学习结果。已知婴儿在发育的第三周就已具备立体色觉。通过与物体互动和积累观察经验，儿童在立体色觉基础上形成了一种新能力——物体感知。重要的是要强调，这种能力并非由生理原因解释，而是由智力原因解释
    [\[11\]](#part0005.xhtml#_ftn11)。另一方面，研究人员发现，当人被置于完全陌生的人工环境中（光线异常排布、熟悉物体异常巨大、过程节奏异常等），人通过眼睛对三维现实的适当感知能力会丧失。因此，物体感知是心理的能力，而非眼睛的能力。事实上，我们看到的是大脑在极短时间（几分之一秒）内，根据眼睛接收的信息快速构建的模型。有时该模型可能与现实略有出入（参见如图
    0.7 及第 0 段所示错误引用）。技术视觉的问题不在于相机的分辨率，也不在于数量，而在于从相机接收的平面图像中充分重建三维模型的算法复杂性。针对特定条件和专门任务存在良好的技术解决方案，例如安防系统中识别人脸的机器人，或识别钟表带上微小零件位置和方向的机器人，但这些系统不可互换、不兼容。与人类能力广度可比的通用技术视觉系统尚未设计出来
    [\[12\]](#part0005.xhtml#_ftn12)。


    计算机视觉是被称为模式识别的 AI 技术广泛应用的一个例子。


    ### 模式识别


    模式识别是控制论的一个分支，它开发方法对由有限属性和特征表征的对象、过程和信号进行分类和识别。


    该领域包括例如在红绿灯处过马路的问题。识别发光红绿灯的颜色并了解交通规则，将允许你做出是否直行过马路的正确决定。


    最早能够进行感知并对感知刺激形成响应的人工神经网络之一是 Frank Rosenblatt 的感知机。其作者并未将感知机视为具体的技术计算设备，而将其视为大脑模型。值得注意的是，经过几十年的研究，现代人工神经网络的研究很少再追求此类目标。


    以模式识别为例，我们再次观察到 AI 方向发展的特征曲线（参见图 0.2 及相关解释）。Rosenblatt 开创性工作发表后，该主题的兴趣急剧上升，随后
    M. Minsky 和 S. Papert 的一本书浇了一盆冷水，书中揭示了 Rosenblatt 感知机的根本局限性。似乎前景尽失，但如今对该主题的兴趣再次高涨。迄今为止，最初的想法已转化为神经网络和神经计算机，目前进展十分成功。


    模式识别领域最伟大的成就之一与 Logica 于 1982 年开发的指纹识别系统有关，该系统不仅在法医学中，还在各种安防系统（如笔记本电脑）中得到广泛应用。人工智能系统的其他应用示例包括：语音识别、扫描文本识别（OCR）、车牌识别或从航空照片进行环境监测。


    应该清楚，综合一个信息对象总是比分析同一对象容易得多。一个很好的例子是手写体。书写很容易，但有时阅读却极其困难。我们大概都遇到过这种情况：在互联网注册网站、发送消息等操作时，需要“解密”图形中的验证码。这被认为是一个相当可靠的测试，用于区分真实用户和机器人。现代识别程序无法分析字母数字轮廓不闭合、线条怪诞扭曲且含大量“噪声”的复杂图片，而人类几乎不费吹灰之力就能做到。到目前为止，模式识别是人类相对于机器人无可争议的竞争优势——还能持续多久？


    本节以图像示例结束（图 0.7），表明模式识别任务对人类而言绝非易事。


    ![驴头还是裸体人物？](Images/image00330.jpeg)


    ![老人还是一对恋人？](Images/image00331.jpeg) ![](Images/image00332.jpeg)


    ![一张脸还是两张？年轻女子还是老妇人？](Images/image00332.jpeg)


    图 0.7. 复杂模式识别图像示例


    ## 1.1.5 智力游戏


    带有人工智能元素的应用系统最著名、最流行的用途之一是各种智力游戏。几乎每个人都接触过用于此特定领域的人工智能。跳棋、国际象棋、西洋双陆棋既可在手机中找到，也可作为功能更强大的程序运行在性能足够的计算机上。

    '
