    Computer vision is an example of a broad application of AI techniques called pattern
    recognition.


    Pattern recognition is a branch of cybernetics that develops methods for classifying
    and identifying objects, processes, and signals that are characterized by a finite
    set of properties and features.


    This area includes, for example, the problem of crossing a street at traffic lights.
    Recognizing the color of a glowing traffic light and knowing the traffic rules
    will allow you to make the right decision about whether to cross the road straight
    or not.


