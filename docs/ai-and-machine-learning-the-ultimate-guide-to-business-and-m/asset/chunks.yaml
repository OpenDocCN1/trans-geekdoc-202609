    我们将说函数 `h2(d)` 比 `h1(d)` 更有信息量，如果 `∀ d ≠ dt h2(d) > h1(d)`。设 `h2(d)` 是比 `h1(d)`
    更有信息量的函数。那么使用 `F2` 时揭示的节点不会比使用 `F1` 时更多，即更有信息量的评价函数能更快地找到解。


    作为示例，考虑第 2.1.4 节和第 0 节中提出的八数码游戏。在我们的术语中，`g(d)` 是游戏树中的深度，`h(d)` 是错位棋子数量的估计函数。因此，八数码游戏中选择的函数
    `h(d)` 显然比广度优先搜索中的函数 `h(d)`（`h = 0`）更有信息量。


    **定理。** 如果存在一条最优路径，且函数 `F2` 比函数 `F1` 更有信息量，则在搜索结束时，`F2` 扩展的每个节点也会被 `F1` 扩展。


    **证明。** 对节点 `d` 在 `F2` 搜索树中的深度 `k` 进行数学归纳（图 35）。


    **归纳基础。** 深度为零（`d0`）。在这种情况下，要么两个算法都打开节点 `d0`，要么都不打开它（当 `d0 ≠ dt` 时）。


    **归纳步骤。** 设 `d` 为第 `k` 步中被选中进行 `F2` 扩展的节点。设 `S1` 和 `S2` 分别为 `F1` 和 `F2` 打开以到达
    `d` 的节点集合。根据归纳假设，`S1` 至少包含 `S2` 中的所有节点，这意味着 `S1` 可能比 `S2` 拥有更多可以到达 `d` 的节点（图 35）。所以
    `g1(d) ≤ g2(d)`。下面反证法。算法结束且 `d` 未被 `F1` 扩展。根据一致性定理的推论 1，`F1(d) ≥ M`。但在 `F2` 中节点
    `d` 是打开的，所以 `F2(d) ≤ M`。我们有 `g1(d) + h1(d) ≥ M ≥ g2(d) + h2(d) ≥ g1(d) + h2(d)`，因此
    `h1(d) ≥ h2(d)`，这与条件矛盾。证毕。


    ![图 35. 证明评价函数比较定理。](img/image00355.jpeg)


    再次考虑第 0 段中的八数码游戏示例。可以看出，提出的启发式函数非常好：它不仅满足上一段所示的一致性条件，而且是“极其有信息量”的。事实上，提出的函数 `h`——错位棋子的数量——无法显著改进，即不可能提供一个启发式
    `h''` 使得 `∀ d h''(d) > h(d)`。


    实际上从图 33 可以看出，存在节点 `d` 使得 `h(d) = h*(d)`，这意味着假设的上界 `h''` 违反了一致性条件。


    ### 3.2.3. 单调约束


    如果 `h(d) ≤ h(rf(d)) + rw 且 h(dt) = 0`，则称函数 `h` 满足单调约束（或三角不等式），其中 `r` 是从节点 `d`
    到节点 `rf(d)` 的规则。


    换句话说，启发式函数与弧（规则）的权重在局部上是一致的。


    **定理。** 如果满足一致性条件，评价函数满足单调约束，且存在最优路径，则算法 `A*` 进行扩展时总是选择一条最优路径已被找到的顶点，即 `g(d) =
    g*(d)`。


    **证明.** 对最优路径的长度进行数学归纳。归纳基础：`g(d0) = g*(d0) = 0`。


    **归纳步骤。** 设节点 `d ≠ d0`，且 `A = d0, d1, …, di, …, d` 为最优路径。根据单调约束，我们有 `∀i g*(di)
    + h(di) ≤ g*(di) + w(di, di+1) + h(di+1)`。接着 `di, di+1 ∈ A → g*(di) + w(di, di+1)
    = g*(di+1)`。


    我们得到 `∀i g*(di) + h(di) ≤ g*(di+1) + h(di+1)`，且由传递性 `∀i g*(di) + h(di) ≤ g*(d)
    + h(d)`。


    现在设 `dk` 为路径 `A` 上第一个打开的节点，即 `dk ∈ A, dk ∈ O 且 ∀j < k dj ∈ C`。这样的节点存在，因为 `d0 ∈
    C, d ∈ O`。路径 `A` 上 `dk` 左侧的所有节点，即 `dk` 之前路径 `A` 上所有已关闭的节点均已打开，所以 `g(dk) = g*(dk)`。


    由于算法 `A*` 在打开下一个节点时在节点 `d` 和 `dk` 中选择节点 `d`，则 `F(d) ≤ F(dk)`。所以我们有：


    `g(d) + h(d) = F(d) ≤ F(dk) = g(dk) + h(dk) = g*(dk) + h(dk) ≤ g*(d) + h(d)`。


    所以 `g(d) ≤ g*(d)`。但 `∀d g(d) ≥ g*(d)`，因此 `g(d) = g*(d)`。证毕。


    **推论。** 当评价函数满足单调约束时，所选节点的评价函数值序列不减。


    **证明。** 节点 `d1, d2` 依次打开。如果在打开节点 `d1` 时刻 `d2` 已在 `O` 中，则由 `A*` 的构造可知 `F(d1) ≤
    F(d2)`。否则，`d2` 必须在扩展 `d1` 时进入 `O`。我们有：`F(d2) = g(d2) + h(d2) = g*(d2) + h(d2)
    = g*(d1) + w(d1, d2) + h(d2) = g(d1) + w(d1, d2) + h(d2) ≥ g(d1) + h(d1) = F(d1)`。证毕。


    ### 3.2.4. 算法 A* 的适用范围


    尽管有诸多优点和长处，`A*` 算法仍有一些固有特性，在特定条件下可能表现为缺点。


    1.  **在最坏情况下，`A*` 算法具有指数级的时间和空间复杂度估计。** 假设我们没有满足一致性条件的有信息量评价函数。在这种情况下必须使用广度优先搜索，`h
    = 0`。假设（在最坏情况下！）每个状态下所有规则都成立并给出 `n` 条这样的规则。再设从 `d0` 到 `dt` 的最优路径上的弧数为 `s`。则很容易看出，搜索图构造的节点总数至少为
    `1 + n + n² … + n^(s-1) = (n^s - 1)/(n - 1)`。


    2.  **算法的效率关键取决于启发式函数 `F`。** 事实上，我们上面指出，没有启发式信息时，最坏情况下算法执行的步数呈最优路径弧数的指数级增长。如果我们同时拥有一个极其有信息量的估计器，使得
    `∀d (h(d) = h*(d))`，且额外满足单调约束，则 `A*` 算法在最坏情况下仅构造 `n*s + 1` 个节点，因为根据上一段的定理，在这种情况下节点沿最优路径依次打开。因此，在理想启发式的情况下，算法
    `A*` 的复杂度可以是最优路径弧数的线性函数。


    3.  **算法 `A*` 不考虑事实库的结构，且总是完整地使用它。** 这极其消耗内存，并使其对大量实际问题不可接受。例如，在解决带障碍物环境中的机器人运动问题时，事实库非常小——仅是机器人当前位置的坐标，`A*`
    算法表现良好。但当 `A*` 应用于专家系统中的大型关系数据库时，形式上图中的每个节点对应数据库的一个完整快照（转储），而相邻节点可能仅相差一条记录。


    4.  **算法 `A*` 不考虑规则中条件的结构，并重新评估在前几步中可能已被检查过的条件。** 这非常耗时。在上述示例中，检查机器人位置时，无法复用为前一位置所做的计算，因为坐标已改变。然而，如果在大型关系数据库中检查复杂条件，如果在较早状态下检查过该条件，则
    99% 的工作已经完成，因为大部分数据未发生变化。

