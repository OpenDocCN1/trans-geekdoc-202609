    情境即公理。我们对它们应用规则，获得新事实，而每个新事实都源于先前获得的事实。最终我们达到（或未达到）目标事实，即用逻辑理论的语言来说，我们得到了目标命题的结论。因此，任何专家系统的核心都可以看作是一个在任何形式理论中自动搜索结论的系统，即证明定理。


    定理的证明当然涉及智力劳动，这不仅需要演绎技巧，还很大程度上需要直觉性的猜测（例如，哪些引理对于给定的定理是必要的）。换句话说，证明定理意味着（除其他外）搜索已证明的定理和已解决的子问题，它们可能有助于达到最终目标。到目前为止，已经开发出几个带有
    AI 元素、能朝这个方向工作的程序，即自动定理证明程序。


    当我们初次审视这个主题时，会立即注意到数理逻辑课程中已知的情况。


    1.  一阶谓词演算语言，加上等式和非逻辑谓词及函数等内容，是大多数学科公理化公认的工具（即几乎任何陈述都可以表述为应用谓词演算的公式）。

    2.  Tarski 列举合式公式的算法允许以穷举方式生成假设（即可以列举所有合式公式）。

    3.  求解方法是部分正确的（即对于任何可证公式，都能自动找到推导；对于不可证公式，算法可能无法完成工作）。


    由此产生了一个想法，其简洁性令人印象深刻。让我们用一阶演算语言写下领域的公理。运行类似 Tarski 算法的程序，逐个生成新假设。我们将尝试用求解方法自动证明每个假设，如果成功，计算机本身将提取越来越多的新知识。该过程可在代码中全天候运行，每周
    7 天，每年 365 天，不仅在一台机器上，而是在所有当前空闲的机器上运行。顺便说一句，PC 平均 90% 的时间处于空闲状态，其总空闲算力相当可观，因此人类拥有足够的空闲资源。


    因此，自动定理证明是可能且易于编程的，但这种简单的方法被证明是无望的低效。由于枚举空间太大，即使是最快的计算机也无法在合理的时间内完成任何工作，因此复杂、有趣的定理无法通过正面进攻的方式自动证明。


    然而，实话实说，目前在非常狭窄的数学理论类别中，仅有极少数例子表明，利用非常特定的方法，已经能够自动发现并证明以前未知的、非平凡的有意义定理。这样的例子已有很多很多年历史
    [3]。俄罗斯科学院通讯院士 VM Matrosov 开发了一种惊人的方法，用于在与微分方程理论相关的狭窄领域中列举和证明数学事实。合作程序员编写了一个程序，该程序生成假设并自动为它们创建证明。通过这种方式，发现并证明了一些真正新的、非平凡的定理。同时，这些结果（定理和证明）作为数学领域的新科学成果发表在著名的数学期刊上。世界学术界尚不知如何面对这一事实，但先例已然存在。


    必须强调的是，自动定理证明是所有带有人工智能元素的应用系统的主要工具，这些系统或多或少地使用逻辑演算公式来表示知识。谓词演算公式几乎总是被使用——这是人类已知的所有陈述的主要正式书写形式。因此，我们可以放心地说，自动定理证明是
    AI 的一个基本主题。在后续章节中将表明，我们考虑的所有 AI 方法，以及可能所有 AI 方法，直接或间接都归结为自动定理证明。


    #### 1.1.4. 自动机器人控制与模式识别


    机器人——一种自动或遥控装置，部分或完全替代人从事某些工作。


    “Robot”（机器人）一词由捷克作家 Karel Capek 及其兄弟 Josef 创造，首次用于 Capek 的剧作《RUR》（"Rossum''s Universal
    Robots"，1920）。


    机器人最常用于在危及生命的条件下执行任务，或当设施相对难以接近时。人人皆知无人月球车和火星车的成功，以及用于侦察和排爆的军用机器人。最近（2009 年）日本举办了另一届国际机器人展览会，展出的大多是家用和医疗机器人（图
    .5）。例如，向公众展示了一种用于培训牙医的“痛觉敏感机器人病人”。另一个例子是能记住警方通缉犯面部的“机器人警察”。识别后，机器人立即通过无线电警告安保人员。娱乐机器人越来越受欢迎。同一展会上展示了“机器人舞伴”。这是一个真人大小的“女性”，借助特殊传感器，能敏锐地察觉舞者移动的方向并配合其动作。她还能表演短独舞，动作平滑，并能移动手臂、头部和身体。看来
    20 世纪科幻作家描述的机器人未来梦想即将成真。


    ![](Images/image00328.jpeg) ![](Images/image00329.jpeg)


    .5. 机器人示例：乒乓球机器人、舞者机器人、病人机器人


    实际上，机器人规划是一项极其困难的任务。似乎没有什么比用两条腿走路更容易的了。每个人的发育都始于看和走的能力。研究时间线（图 .6）会让人觉得这些技能似乎不需要任何显著的智力努力。乍一看，说话、思考和编程似乎难得多。然而，如果你看看机器人和机器人技术的发展，很容易发现情况恰恰相反。机器人先学会了编程和推理，然后学会说话，接着学会走路，至今仍未学会如何正确地“看”。


    .6. 机器人与人类技能发展的对比

