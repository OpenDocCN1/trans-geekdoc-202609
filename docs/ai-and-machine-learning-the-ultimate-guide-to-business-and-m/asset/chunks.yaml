  trans: '


    ## 3. 基本概念的掌握


    掌握人工智能和知识表示领域的基本概念；具备通过文献研究人工智能其他方法的能力；具备评估和使用特定应用人工智能系统的能力。


    ---


    # 第 1 章：应用人工智能系统


    研究人员长期以来一直关注人类智能问题，尽管试图构建这种心理现象，或者至少对实现人类智能的现象和过程给出或多或少严格的定义，并不总是富有成效的。作者既不是大脑生理学或心理学专家，也不会在古典哲学领域“玩弄概念”。尽管如此（更确切地说是“为了支持这一立场”），我们允许自己做一些离题的论述和引用，以说明上述领域的情况。


    如今，心理学界普遍认为存在一种作为通用心智认知能力的一般智力，它可以建立在神经系统以某种实用性、速度和准确性处理信息的遗传决定特性之上。人们认为，人类的许多类型的心智活动，如编程、数学、讲课或阅读此类书籍，都需要智力。


    不幸的是，我们对各自头颅中所装事物的理解，总体而言，几乎不能算作足够完整。如果我们谈论作为智力载体的大脑结构，那么已知其形成元素是一种特殊类型的细胞——神经元。已经证明，神经元相互作用的至少一种形式是通过电化学方式实现的，但这种形式是否为唯一形式仍是一个悬而未决的问题。目前的情况让人联想到假设的克罗马农人试图理解个人电脑如何工作及其能做什么。如果我们甚至还不能完全理解用两条腿行走的力学原理，又能对大脑说些什么呢。


    我们看到，“智力”一词对人而言是间接定义的，通过专业特长，根据活动的某些结果来界定，并不直接表明这种心理层面是什么以及它是如何实现的。百科全书类出版物中现有的定义通常使用同义词和递归来解释。例如，百科词典给出了如下简短定义：


    > **智力**（源自拉丁语 *intellectus* —— 知识、理解、理性）—— 思维的能力，理性的知识。


    解释性心理学词典的定义接近，但更为精确：


    > **智力**（源自拉丁语 *intellectus* —— 理解、认知）—— 执行认知过程并有效解决问题的能力，特别是在应对新的生活问题时。


    换句话说，定义并未定义出任何实质内容，但有时能激发正确的联想，而“智力”这一术语非常模糊且远远不够。特别是，无法理解直觉的本质、信念的机制、爱、厌恶等其他非理性关系的本质等。


    “智力”一词本身并非完全名正言顺地进入了“人工智能”这一术语。事实上，最初的原始术语 *artificial intelligence*（见第 0 节）含义要柔和得多。*Intelligence*
    一词仍更多地指敏捷的机智，而非深思熟虑的心智，作为一种基本人类素质。但很难为其提供另一个俄语翻译，且为时已晚，因此让我们沿用现有翻译，并赋予其以下含义。


    本书的主题是**应用人工智能（AI）**，我们在此讨论实用且有用的项目，避免柏拉图-第欧根尼式的“赤裸尾巴”风格 [\[3\]](#part0005.xhtml#_ftn3)。AI
    的概念与自然智能的概念一致，但实际与后者关系不大。重要的是要理解，**AI 不是人类思维的模型** [\[4\]](#part0005.xhtml#_ftn4)，正如橡胶不是天然橡胶的化学模型，尽管二者共享许多相似的物理特性。事实上，人工智能程序使用了一些也存在于人类思维中的算法（毕竟，每个程序都是由人类编写的）。但在现实生活中，人解决同一问题的方式会与程序不同（执行不同的操作，使用不同的算法，利用尚未得到充分研究、因此无法转化为数学公式和程序代码的心理结构）。正面进攻法——用“机器”语言表达“人类”算法——是无效的，稍后我们将看到。换句话说，如果我们将某任务归类为智力任务，那么根据我们的定义，每一种解决方案都表明存在某种智力。如果解决方案是通过程序获得的，那么该程序就包含智力元素。


    能够解决传统上被归类为智力范畴学科中问题的程序被称为**人工智能**。带有……元素的应用系统


    另一定义：**带有 AI 元素的应用系统是一种其算法（目前还！）找不到的大学教科书中的程序。** 例如，在编程早期，能够创建其他程序的程序（第一批编译器）被认为是“智能”的。现代编译器不被视为智能程序，尽管它们关于编程“懂”得多得多，并使用非常复杂的算法来解决编译和优化问题。还可以举出其他例子。在每个具体案例中，具体的应用
    AI 系统都是此类软件创作者的诀窍，但某一特定学科领域的每一个新想法都会显著推动人工智能系统的整体发展。同时，随着发展的推进，将学科领域归属于智力范畴的传统，以及对许多任务“智力程度”评估的传统也在发生变化。例如，19
    世纪末计算埃菲尔铁塔的结构需要大量工作、非凡的智慧和独创性，而现在普通设计师使用现成的软件包就能快速、可靠且无需太多脑力劳动地完成此类计算。设计师的经验和智慧、力学、材料强度及其他工程学科的广泛知识，很大程度上积累在现代设计包中。这种包无疑表现出智能行为，但我们不将其视为应用
    AI 系统，因为设计包中的所有计算都是按照已知的、预先定义的、唯一的算法执行的。


    为了支持上述论点并阐明带有 AI 元素的应用系统的主要定义，我们考虑一些人工智能应用的典型主题领域。


    ### 1.1. AI 应用概览


    一些带有 AI 元素的典型应用包括：


    '
