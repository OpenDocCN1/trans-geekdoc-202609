    \n**图 30. 搜索中的循环**\n\n从这个例子得出的结论是，生成系统的可交换性是一个非常强大且有用的性质。应当尝试构建可交换的生成系统，在无法做到的情况下，值得检查是否可以在一定程度上限制问题，但要使其能够构建可交换系统。\n\
    \n## 2.3.4. 可分解生成系统\n\n生成系统的可交换性提供了选择应用规则的自由。这不是提供这种自由的唯一品质。\n\n如果一个生成系统可以**分解**为多个可以相互独立考虑的生成系统之和，则称其为**可分解生成系统**。\n\
    \n形式生成文法是可分解生成系统的一个好例子。让我们通过一个简单的例子来看看这个主题。假设有规则：\n\n```\nA → BC\nA → CT\nC →\
    \ TT\n```\n\n如何从单词 `AC` 得到仅包含符号 `T` 的字符串？下面给出了常规（图 31）和复合（图 32）生成系统的搜索图。在第一种情况下，我们从初始表达式进行所有可能的转换。在第二种情况下，我们首先将原始数据库（单词\
    \ `AC`）分成两部分（单词 `A` 和单词 `C`），然后为每一部分创建搜索图。这里给出了完整的搜索图，从中可以清楚地看到可以获得解。确实，在图 31\
    \ 中有路径（共有三条，叶节点用颜色高亮）从起始节点通向终止节点，而在图 32 中，对于分解的两个部分，每个都有一对通向终止节点的路径。包含在解中的节点在图\
    \ 32 中用椭圆圈出。\n\n![](img/image00351.jpeg)\n\n**图 31. 常规生成系统的搜索图**\n\n![](img/image00352.jpeg)\n\
    \n**图 32. 可分解生成系统的搜索图**\n\n让我们比较图 31 和图 32 中的数字，很容易看出，在第一种情况下做了大量不必要的工作：左侧分支应用规则的结果导致了死胡同。在这个例子中，使用分解使搜索图减半！\n\
    \n可分解生成系统的基本过程如算法 8 所示。\n\n**算法 8. 可分解生成系统解释器。**\n\n```\nproc split (d, R, t)\n\
    \    Δ := disassemble(d)\n    while Is_correct do\n        for d ∈ Δ do\n    \
    \        if t(d) then Δ := Δ \\ {d} end if\n        end for\n        if Δ = ∅\
    \ then return (OK) end if\n        d := SelectD(Δ)\n        Δ := Δ \\ {d}\n  \
    \      r := choose(d, R)\n        if r = zero then return (fail) end if\n    \
    \    Δ := Δ ∪ Decompose(rf(d))\n    end while\nend process\n```\n\n生成方法，最最初始也最通用的方法（见第\
    \ 0 节）。`Decompose` 过程将数据库分解为多个部分（如果在当前状态下数据库无法分解，则保持原样）。从某种意义上说，这类似于打开节点的操作，但仍有不同，因此图\
    \ 32 中对应于分解而非展开的弧用灰色高亮显示。此外，`SelectD` 函数类似于 `Select` 函数，它实际上选择一个节点进行进一步工作。\n\n"
