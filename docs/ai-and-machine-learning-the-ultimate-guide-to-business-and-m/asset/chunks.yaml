    # 4.1. METHOD OF DECISIONS


    The material in this chapter is based primarily on mathematical logic, the basic
    concepts of which are assumed to be familiar to the reader. However, all necessary
    definitions and some theorems are briefly repeated in the first sections. However,
    we would like to warn the reader that this chapter is by no means a short textbook
    on mathematical logic. Many important, interesting, and technically complex theorems
    and concepts of formal mathematical logic are either omitted here, not proved,
    or given in a simplified formulation. The reason for this is that in this chapter
    we consider mathematical logic and its main object - the logical calculus - not
    at all as a goal, but only as a means to represent knowledge in a computer. Our
    approach to the fine art of mathematical logic in this chapter is extremely pragmatic:
    we simply use the ready-made language and apparatus without considering the cost
    to humanity. Of course, the use of logical calculus in AI is only considered on
    concrete examples. Formal constructions in the main text of the chapter are kept
    to a minimum. The reader who needs formal constructions is referred to the classic
    textbook [19].


    ## 4.1.1. Formal Theories


    Historically, the notion of a formal theory was developed during a period of intense
    research in the foundations of mathematics in order to formalize logic proper
    and proof theory. An outstanding German mathematician, David Hilbert, made an
    enormous, perhaps crucial, contribution to the formation and development of the
    apparatus of formal theories. Now this device is widely used to create special
    calculi for solving specific applied problems in the field of AI. David Hilbert
    wrote: "The theory of proof... gives us a high sense of conviction that at least
    the mathematical mind knows no bounds and is capable of pursuing the laws of its
    own thought...".


    The predicate calculus we use below is an example of a formal theory, so we start
    with a brief description of the general concept of a formal theory.


    A formal theory is a structure that has the following four necessary components:


    - the set `A` of symbols forming the alphabet of the formal theory;

    - the set `F` of words in the alphabet `A`, `F ⊆ A*`, which are called formulas
    of the theory;

    - a subset `B` of formulas, `B ⊆ F`, called the axioms of the formal theory;

    - the set of relations `R` on the set of formulas, `R ⊆ F^(n+1)`, which are called
    the inference rules of the formal theory.


    The symbol set `A` can be finite or infinite (countable). A finite set of letters
    is usually used to form symbols, which may be assigned natural numbers as indices.


    The set of formulas `F` is usually given by an inductive definition, for example
    using a generative formal grammar. This set is usually infinite. In addition to
    the term "formula", the term "suggestion" can also be used. Sentences conforming
    to the strict definition are sometimes called well-formed sentences, as opposed
    to arbitrary combinations of characters from `A` (simple sentences or character
    strings). In some formal theories, the status of a well-formed sentence may depend
    on context or external circumstances. In the following, a formula, unless otherwise
    specified, means a well-formed formula of the formal theory under consideration.


    The sets `A` and `F` together define a language or formal theory signature, traditionally
    denoted as `Σ = (A, F)`.


    The set of axioms `B` can be finite or infinite (but countable). When the set
    of axioms is infinite, it is usually specified using a finite set of axiom schemas
    and the rules for generating particular axioms from the axiom schema. The most
    common rule for generating specific axioms from an axiom schema is the substitution
    rule.


    Let''s give an explanatory example. The textbook [19] says (we quote with slight
    abbreviations and in the notation used in this book): "Whatever the formulas `A`,
    `B` and `C` are, the following formulas are axioms:


    (A1) `(A → (B → A))`


    (A2) `((A → (B → C)) → ((A → B) → (A → C)))`


    (A3) `((¬B → ¬A) → ((¬B → A) → B))`"


    This is to be understood in the following sense. Let lowercase Latin letters,
    connectors `¬` and `→`, and brackets `(` and `)` be included in the alphabet of
    the considered formal theory, and uppercase Latin letters are not included. Then
    the written expressions denoted by the names (A1), (A2) and (A3) are not, strictly
    speaking, formulas of a formal theory and therefore cannot be axioms. These are
    precisely the schemes of the axioms. Any formulas can be substituted for the parameters
    `A`, `B`, and `C`, and the same formula must be substituted for all occurrences
    of any parameter, and the resulting expression, which is already a formula of
    this formal theory (note in parentheses that this is the propositional calculus)
    is declared an axiom. In particular, if we substitute the formula `(b → a)` in
    Scheme A1 instead of the parameter `A`, and the formula `a` instead of the parameter
    `B`, (this is briefly denoted as: `{(b → a)//A, a//B}`), then the formula is `((b
    → a) → (a → (b → a)))`, which is a well-formed formula and an axiom of propositional
    calculus. If we apply the substitution `{(a → a)//A, a//B}` to the same circuit
    A1, then we get the formula `((a → a) → (a → (a → a)))` which is also an axiom
    of calculus statements. The set of axioms of the propositional calculus is infinite,
    although it can only be given by three schemata of axioms.


    For applied theories, axioms are often divided into two types:


    - **logical axioms**, borrowed directly from basic formal theory (in our case
    from first-order predicate calculus);

    - **non-logical axioms** (also called technical or proprietary axioms) that reflect
    the application specifics and content of a particular application area.


    Let''s introduce two more concepts related to formulas and axioms.


    If there is an algorithm that, according to the presented formula of the theory
    (a string of characters of the alphabet of the theory), allows us to conclude
    in finite time that this string belongs (or does not belong) to the class of well-formed
    formulas, then the theory is called **knowable**.


    If, in addition, the time is limited by a polynomial in the length of the formula,
    then the theory is considered **effectively recognizable**.


    If there is an algorithm which, according to the formula presented, allows us
    to conclude in finite time that this formula may or may not be related to the
    set of axioms, then the formal theory is called **axiomatizable**.


    If, in addition, the time is limited by a polynomial in the length of the formula,
    then the theory is considered **effectively axiomatizable**.


    The set of inference rules `R` is usually finite.

    '
