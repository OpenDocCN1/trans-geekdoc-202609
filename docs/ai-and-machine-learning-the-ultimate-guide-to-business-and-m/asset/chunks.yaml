- raw: 'The compactness of the knowledge base is a decisive factor for the performance
    of an artificially intelligent system and thus for the limits of its applicability.
    This circumstance determines the structure of this book. The chapters are structured
    according to methods of knowledge representation, not according to methods of
    finding solutions. When solving a problem in the intellectual domain, one should
    first choose a knowledge representation and then choose an appropriate solution-seeking
    algorithm. The fact is: If an unsuccessful representation of knowledge is chosen,
    then no tricks with algorithms will help. Most likely, if a particularly successful
    representation of knowledge is invented, the most common algorithm for finding
    a solution will give fairly satisfactory results.


    ### 1.3. HISTORY OF ARTIFICIAL INTELLIGENCE


    A digression into history is often absolutely necessary, otherwise it is incomprehensible
    why the modern regulations under consideration are exactly what they are. Finally,
    for historical and psychological reasons, the definitions and concepts of AI are
    largely subjective. The specifications of the AI differ noticeably from the objectively
    determined laws of physics or chemistry. We have divided the history of AI development
    into several periods (prehistoric , when even the term "artificial intelligence"
    is not yet a essence, but some works can be retrospectively and with some distance
    attributed to this direction [\[17\]](#part0005.xhtml#_ftn17);


    \-                    pioneering , when the advent of computers and other technological
    advances of the 20th century dramatically broadened the horizons of possible research,
    when almost every proposed idea stunned with its novelty and opened up new perspectives,
    and ideas popped up like fireworks, one after the other;


    \-                    academic , as the direction of AI emerged as a distinct
    research area in academia, with its own terminology, agencies, research centers,
    and the formation of the international community; when research was conducted
    primarily in the interest of developing direction itself, and practical applications
    were of interest primarily through the most basic way of implementation, and not
    through tactics


    technical characteristics;


    \-                    Industry , which continues and develops into our days, where
    the increased capabilities of technology have paved the way for the industrial
    mass deployment of artificial intelligence systems.


    Of course, one should not think that these periods followed and followed one another
    strictly sequentially, like five-year plans for the development of a socialist
    economy. Both the pioneering and academic eras had separate industrial designs
    that shaped history, and even in our mercantile era scientific breakthroughs occur,
    albeit not often, that abruptly lead to a ''paradigm shift''.


    #### 1.3.1. Artificial intelligence background


    Reliably recorded first attempts by Raymond Lull more than 700 years ago to create
    a machine simulating some aspects of the human mind. Lull believed that it was
    possible to discover a special method or art by which one could, with reasonable
    necessity, derive all sorts of truths from general concepts, and especially the
    truths of Christian dogma. Based on his ideas, he created the first logical engine
    in the form of several concentric circles of paper divided into compartments in
    which general concepts and categories were placed. By rotating the circles relative
    to each other, various more or less complex combinations of the given concepts
    could be obtained. Lull believed that in this way new true truths could be discovered.
    Of course, no new truths were discovered, but the idea that reasoning can be done
    mechanically sounded!


    We now know that logical operations can be treated algebraically and performed
    arithmetically, but this was not nearly so obvious until the work of G. Boole
    in the 19th century. Therefore, the first designers of intelligent machines focused
    their attention on the construction of computational machines. Logical thinking
    seemed to be more of a challenge. Several such "computers" were built in the 17th
    and 18th centuries, and here the Leibniz calculator must be mentioned, which was
    the first machine in the world that could efficiently perform all four arithmetic
    operations.


    G. Leibniz started work on this machine in 1670; two years later he made a new
    sketch description, on the basis of which the copy was apparently produced, which
    the scientist demonstrated at a meeting of the Royal Society of London in February
    1673. Leibniz admitted that his instrument was not yet perfect and promised to
    improve it as soon as he returned to Paris. Although he made significant improvements
    to the machine in the years that followed, it was not until 1694 that he came
    up with its final version. As a result, Leibniz came back to his invention several
    times and offered new, improved possibilities.


    The crowning prehistory of computers is the work of Charles Babbage. Babbage began
    with a mechanical contraption designed to automate computations by approximating
    functions with polynomials and computing finite differences. The possibility of
    an approximate representation of logarithms and trigonometric functions by polynomials
    allows us to consider this machine as a fairly universal computing device. This
    difference engine had to be able to compute the values of polynomials up to the
    sixth degree with an accuracy of up to the 18th digit. In the same year, 1822,
    Babbage built a model of a differential motor consisting of rollers and gears
    rotated manually with a special lever. The following year the British government
    gave him a subsidy of £1,500. In developing the machine, Babbage did not show
    all the technical and mechanical difficulties associated with its implementation,
    and not only did not fulfill the promised three years, but had to stop work nine
    years later. However, part of the machine still began to function, performing
    calculations with even greater accuracy than expected.


    In 1834 Babbage invented the Analytical Engine . It consisted of a "warehouse"
    for storing numbers (storage device), a "mill" for performing arithmetic operations
    with numbers (arithmetic device), a "drum" that controlled the operations of the
    machine in a certain order (controller), and data inputs and output devices. .
    The register memory of Babbage''s machine could store at least 10 decimal numbers
    of 40 characters each, but could theoretically be expanded to a thousand 50-bit
    numbers. The arithmetic unit had hardware support for all four arithmetic operations.
    The machine performed addition in 3 seconds, multiplication and division in 2
    minutes. The machine''s entrance was to receive two streams of punched cards,
    which Babbage called "operative cards" and "variable cards": the first controlled
    the processing of data recorded on the second. Information was recorded on punched
    cards by punching holes. It was possible to create a function library from operating
    maps. Thus, all the main elements of the architecture of Babbage''s first computers
    were fully anticipated. The Analytical Engine was never implemented. The main
    reason for failure is technological. The technologies of the time did not allow
    the necessary complex parts to be manufactured in sufficient quantities and with
    sufficient accuracy. The inventor wrote in 1851: " All developments in connection
    with the Analytical Engine have been carried out at my expense. I''ve done a number
    of experiments and gotten to the point where my skills are no longer sufficient.
    In this respect, I feel compelled to refuse further work .


    #### 1.3.2. frontier research \_


    The serious development of artificial intelligence as a scientific direction began
    in the 1940s, after the advent of computers. In 1948 Norbert Wiener published
    the book "Cybernetics, or Control and Communication in the Animal Kingdom and
    the Machine" and thus founded a new science - cybernetics .'
