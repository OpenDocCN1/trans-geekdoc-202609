    ## 2.1.5. Game at Eight


    The effectiveness of an artificially intelligent system is primarily determined
    by how well the knowledge representation is chosen for all components `D`, `R`,
    `C`. Here we look at some examples of simple puzzles, focusing on good and bad
    knowledge representation choices.


    Consider the game of eight (an example is taken from the book [13]), which is
    known to many in analogy to the well-known game of fifteen. The essence of the
    game is to move the chips numbered from 1 to 8 so that they are in ascending order
    in a clockwise direction. In this case, one of the squares of the 3 × 3 square
    is always free, and any adjacent chip can be moved to it. Chips cannot "jump"
    over each other—they can only be moved to an adjacent free space.


    Suppose we have the following source (left) and destination (right) positions
    shown in Fig. 14.


    | | 2 | | eight | 3 |

    |---|---|---|---|---|

    | one | | 6 | | four |

    | 7 | | | 5 |


    | one | 2 | 3 |

    |---|---|---|

    | eight | | four |

    | 7 | 6 | 5 |


    **Fourteen. Starting and finishing position of the eight game**


    Imagine knowledge of the game of eight based on production systems.


    The representation of the database offers itself from the physical sense. Let''s
    call an empty cell a chip number 0. As a result, `D` looks like this:


    ```

    D : Array [1..3,1..3] from 0..8

    ```


    `R` rules are also written as expected. For example, the rule "move chip 1 down"
    is:


    ```

    if D[i,j]=1 & i<3 & D[i+1,j]=0 then D[i+1,j]:=1;

    D[i,j]:=0

    ```


    Due to the fact that each of the eight parts can be moved in a maximum of four
    directions, there are a total of 32 rules. This is a natural but not the best
    representation of knowledge about the game.


    Let''s try to improve the original version. The basic idea is that every movement
    of a chip can be viewed as a movement of an empty cell. This is where we use a
    little of our intelligence.


    Add a few more numbers `{i,j}` to the database—the coordinates of empty space.
    Let''s determine the directions of movement according to the cardinal points—north,
    west, south, and east.


    ```

    if i > 1 then D[i,j] := D[i-1,j]; i := i-1 ( ↑ N to the north)

    if j < 3 then D[i, j] := D[i, j + 1]; j := j + 1 ( → E in the east)

    if i < 3 then D[i,j] := D[i+1,j]; i := i + 1 ( ↓ S on south)

    if j > 1 then D[i,j] := D[i,j-1]; j := j-1 ( ← W West)

    ```

    '
  trans: '

    ## 2.1.5. 八数码游戏


    人工智能系统的有效性主要取决于为所有组件 `D`、`R`、`C` 选择知识表示的优劣。这里我们通过一些简单谜题的例子，重点探讨好的和坏的知识表示选择。


    考虑八数码游戏（示例取自书籍 [13]），它类似于广为人知的十五数码游戏，许多人都熟悉。游戏的实质是移动编号为 1 到 8 的棋子，使它们按顺时针方向按升序排列。在这种情况下，3
    × 3 方格中的一个格子始终是空的，任何相邻的棋子都可以移动到该空格中。棋子不能“跳跃”过其他棋子——它们只能移动到相邻的空格中。


    假设我们有图 14 所示的以下初始位置（左）和目标位置（右）。


    | | 2 | | eight | 3 |

    |---|---|---|---|---|

    | one | | 6 | | four |

    | 7 | | | 5 |


    | one | 2 | 3 |

    |---|---|---|

    | eight | | four |

    | 7 | 6 | 5 |


    **图十四. 八数码游戏的初始和目标位置**


    想象一下基于产生式系统的八数码游戏知识。


    从物理意义上讲，数据库的表示显而易见。我们称空单元格为 0 号棋子。结果，`D` 如下所示：


    ```

    D : Array [1..3,1..3] from 0..8

    ```


    `R` 规则也按预期编写。例如，“将棋子 1 向下移动”规则为：


    ```

    if D[i,j]=1 & i<3 & D[i+1,j]=0 then D[i+1,j]:=1;

    D[i,j]:=0

    ```


    由于八个棋子中的每一个最多可以向四个方向移动，因此总共有 32 条规则。这是一种自然但并非最佳的游戏知识表示。


    让我们尝试改进原始版本。基本思想是每一次棋子的移动都可以看作是空单元格的移动。这就是我们利用一点智慧的地方。


    在数据库中添加几个数字 `{i,j}`——空单元格的坐标。让我们根据基本方位点——北、西、南、东来确定移动方向。


    ```

    if i > 1 then D[i,j] := D[i-1,j]; i := i-1 ( ↑ N 向北)

    if j < 3 then D[i, j] := D[i, j + 1]; j := j + 1 ( → E 向东)

    if i < 3 then D[i,j] := D[i+1,j]; i := i + 1 ( ↓ S 向南)

    if j > 1 then D[i,j] := D[i,j-1]; j := j-1 ( ← W 向西)

    ```

    '
