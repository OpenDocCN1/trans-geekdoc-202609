- raw: "Of all intellectual games, chess has historically attracted the most attention\
    \ from programmer-researchers. Even today, the best computer chess programs outperform\
    \ the well-known grandmasters of the world. We can say that in chess the computer\
    \ has outplayed the person. At the same time, it should be emphasized that there\
    \ are no miracles in chess programs. They use well-known and carefully implemented\
    \ algorithms, such as those discussed in Chapter 3. However, if we accept the\
    \ claim that playing chess at grandmaster level requires intelligence, then we\
    \ have to admit that the best chess programs are intelligent. At the same time,\
    \ computer chess is not just entertainment, but also a way to teach new chess\
    \ players, create chess databases, analyze endgames, and modify the rules [\\\
    [13\\]](#part0005.xhtml#_ftn13). But the most important thing for us is that this\
    \ is definitely one of the most interesting cases of knowledge representation.\n\
    \nThe task of representing knowledge in mind games is a challenge for the natural\
    \ intelligence of programmers. The fact is that some of the games are extremely\
    \ complex from a quantitative point of view. For example, chess has about 1040\
    \ possible positions and about 10120 possible games. These are huge numbers, larger\
    \ than the number of atoms in the universe (from 10 67 to 10 80 according to various\
    \ estimates ) and than the number of seconds that have passed since the universe\
    \ began to exist [\\[14\\]](#part0005.xhtml#_ftn14). No information devices can\
    \ and will never be able to see or remember all positions and play all games -\
    \ this is physically impossible. So the developers of intellectual gaming software\
    \ have a lot of work to do!\n\nMM Botvinnik made a major contribution to the algorithmic\
    \ understanding of chess. Mikhail Moiseevich Botvinnik (1911-1995) - Doctor of\
    \ Technical Sciences, the sixth world chess champion, holding this title for a\
    \ total of 13 years. He was the first to pay special attention to the issues of\
    \ training chess players, created his own method of preparing for competitions,\
    \ in which an important place was given to physical exercises and strengthening\
    \ mental stability. He made a valuable contribution to the theory of multiple\
    \ beginnings, developed a number of original opening systems and enriched endgame\
    \ theory with valuable analyses. “I gave the chess everything that was possible,\
    \ in my opinion. Now I just don't have time to prepare for big tournaments. When\
    \ I was alone in electrical engineering, I managed to combine work with chess.\
    \ But for several years I have also been dealing with the problem of playing chess\
    \ on a computer, and I have become so immersed in this problem that it has become\
    \ impossible to combine all three activities .\n\nAfter completing his sporting\
    \ achievements in 1970 (the “match of the century” between the USSR national team\
    \ and the world team), Botvinnik dealt with the problems of artificial intelligence\
    \ and worked on the computer chess program Pioneer. The idea of developing an\
    \ \"electronic chess player\" came to him as early as 1958. In 1968, Botvinnik's\
    \ book was published, in which he formulated a method to model a chess master's\
    \ thinking when choosing a move, based on a positional evaluation that included\
    \ all sides and unnecessary ones Sweeps moves and variations aside. Unfortunately,\
    \ the Pioneer program was never implemented, but Botvinnik's valuable ideas and\
    \ solutions remained in chess theory and found their way into the later developments\
    \ of domestic AI specialists.\n\nFor several decades, world championships have\
    \ been held regularly among the chess programs. The championship is currently\
    \ hosted by the International Computer Gaming Association and is open to all types\
    \ of computers with no more than eight cores (ie excluding supercomputers and\
    \ large clusters). It is gratifying to note that the national program Kaissa was\
    \ developed under the direction of\n\nGM Adelson-Velsky and MV Donskoi. The champion\
    \ of the last three years is the Rybka program, developed by the Czech-American\
    \ chess player Vasik Rajlich.\n\n### 1.2. PLACE OF REPRESENTATION OF KNOWLEDGE\
    \ IN ARTIFICIAL INTELLIGENCE\n\nIn the intellectual realm, it is impossible to\
    \ come up with a universal algorithm suitable for solving any problem. This is\
    \ how intellectual tasks differ from other, non-intellectual tasks, where there\
    \ are “do one, do two, do three…” algorithms. The method of solving a problem\
    \ in the intellectual sphere is always a search for new approaches, new ways,\
    \ in the end, if nothing can be invented, it's a banal enumeration of all possibilities\
    \ in search of a solution.  \n\n#### 1.2.1. Iterative nature of problem solving\n\
    \nThe general scheme for solving the problem with a computer is shown in fig.\
    \ Error! The text of the specified style does not exist in the document. .8 .\
    \ The top-down arrows are deterministic, the bottom-up arrows are non-deterministic.\
    \ In general, the solution to a problem is always non-deterministic. This is a\
    \ trial and error method, a search method that often requires you to go back to\
    \ previous steps.\n\nIf the feedback in such a process (arrows from bottom to\
    \ top) is realized by a person (and this happens quite often), then such a process\
    \ cannot be described as computer-aided knowledge processing. In order to be able\
    \ to speak specifically of computer-aided knowledge processing, all or some feedback\
    \ loops must be closed by the computer.\n\n  .eight. Scheme of the process of\
    \ solving a problem on a computer\n\nWith traditional procedural programming (top\
    \ down), the solution depends entirely on the problem. Each problem has its own\
    \ individual solution, and the solution to one problem cannot be used directly\
    \ to solve another without additional work. In artificial intelligence (non-procedural\
    \ programming), the same search method can be applied to a whole range of problems.\n\
    \nOur summary is this. If the task does not have a direct solution algorithm,\
    \ it is solved by enumeration, and the return is not made by the programmer's\
    \ head, but by the program itself, then it is an applied system with elements\
    \ of artificial intelligence. If the problem has a direct solution algorithm that\
    \ the programmer finds (perhaps in several attempts), but not the program itself,\
    \ then there is no artificial intelligence (perhaps the programmer's natural intelligence\
    \ is present). But in fact there is no insurmountable boundary between these cases.\
    \ The artificial intelligence of a program is not a discrete property that only\
    \ takes the values 0 or 1, all or nothing. In contrast, artificial intelligence\
    \ is a continuous value that takes on any value from the interval (0, 1). The\
    \ more feedback loops in Fig. Error! The text of the specified style does not\
    \ exist in the document. .8 does not go through the head of the programmer but\
    \ through the computer, the higher the level of intellectuality of the program.\n\
    \n#### 1.2.2. knowledge and ignorance\n\nIt is impossible to show an explicit\
    \ boundary between knowing and not knowing . In fact, there is no precise limit\
    \ to the representation of knowledge in a computer - every program and data reflects\
    \ some kind of knowledge. On the other hand, the most subtle philosophical considerations\
    \ can be written (in natural language) into a computer, and they are represented\
    \ there by a meaningless string of bytes. Bytes will be in the computer, but philosophical\
    \ knowledge? More specifically , nothing in computers is knowledge without our\
    \ own interpretation, and knowledge can be extracted from almost anything if you\
    \ try hard enough. Strictly speaking, in this book (unless expressly stated otherwise)\
    \ we mean the following interpretation of the term \"knowledge\":\n\nKnowledge\
    \ (computer) is a set of strictly defined information structures and well-defined\
    \ rules and strategies for processing these structures (interpretation rules)\
    \ .\n\nLet's look at it with a model example."
