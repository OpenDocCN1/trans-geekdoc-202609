  fmt: "\n#### 2.3.1. 单向生产系统\n\n广度优先搜索返回以下结果（11 次规则应用）。\n\n```\n60\n\n30 20 12\n\n\
    15 10 6 4\n\n5 3 2\n\none\n```\n\n此处只有一个目标和三个日期，因此逆向系统产生的结果比正向系统略好，但两者相当，符合预期。\n\
    \n但如果我们设定一个不同的、模糊的目标：哪些小于或等于 60 的数字可以从因子 2、3、5 得到？那么系统对比将呈现完全不同的图景。事实上，正向系统的特点是缺乏终止条件，必须继续运行，直到因缺乏可应用的规则而终止。数据库的累积状态将是问题答案。\n\
    \n```\nd0 := {2,3,5}\n\nR := if x ∈ d & y ∈ d & xy ∉ d & xy<61 then d:= d ∪ {xy}\n\
    ```\n\n广度优先搜索返回以下结果（22 次规则应用）。\n\n```\n2 3 5              (original multipliers)\n\
    \n4 6 9 10 15 25     (products in pairs)\n\n8 12 18 20 30 50   (second line *2)\n\
    \n27 45              (second line *3)\n\n                   (second line *5)\n\
    \n16 24 36 40 60     (third line *2)\n\n54                 (third line *3)\n\n\
    32 48              (sixth line *2)\n```\n\n深度优先搜索返回相同的结果，只是数字的发现顺序不同。这源于这样一个事实：在这种情况下，两种搜索类型都遍历同一个图，并且每个节点仅访问一次。请注意，我们问题的扩展表述的定量结果实际上与原始表述的结果一致——在第一种情况下，广度优先搜索算法仅未构建三个节点。也就是说，在广度优先搜索问题的原始表述中，正向系统并非以目标为导向，但生产系统解决了一个更普遍的问题，而非所要求的特定问题。\n\
    \n现在让我们尝试使用逆向生产系统来回答“哪些小于或等于 60 的数字可以从因子 2、3、5 得到”这个问题。显而易见，我们必须询问 60 次下一个数字是否可表示。在这种情况下，例如使用深度优先搜索，每个数字都能找到答案，规则应用次数最小\
    \ = 0（如果被检查的数字是质数），最大 = 5。平均每个被检查数字约需两次规则应用。这意味着在这种情况下逆向系统效率低一个数量级，没有必要用枯燥的描述和大量不必要的数字来充斥书籍。另一方面，如果你只是想分解数字\
    \ 60，逆向系统显然更高效。\n\n此例得出的结论如下：在智能系统中，考虑任务的细节非常重要。有时考虑细节比遵循一般原则更重要。\n\n#### 2.3.2.\
    \ 双向生产系统\n\n正向和逆向系统被称为单向系统，因为搜索严格朝一个方向移动——朝向目标或远离目标。然而，如果只有一个目标状态和一个源状态，则方向是等价的（例如在八数码游戏中）。在这种情况下，可以同时从数据到目标和从目标到数据进行搜索，并查看是否存在指示已找到解的公共状态。这就是双向生产系统的工作原理。\n\
    \n预期当使用无信息控制策略时，双向生产系统将比单向生产系统更高效，因为总体上将揭示更少的节点，例如在广度优先搜索中（图 2.26）。\n\n![](Images/image00347.jpeg)\n\
    \n图 2.26. 双向生产系统的优势\n\n然而，这并非总是如此。如果使用非常好的启发式方法，有目的地从数据引导至目标、从目标引导至数据，但方式不同，那么双向系统可能比任何单向系统都要差。\n\
    \n图 2.27. 具有定向启发式的双向系统\n\n#### 2.3.3. 可交换生产系统\n\n如果满足以下三个条件，则称具有规则集 `R` 的生产系统为可交换的：\n\
    \n```\n∀d∈D ( r1.p(d) & r2.p(d) → r2.p(r1.f(d)) )\n```\n- 如果两条规则均适用，则应用其中一条后，另一条仍保持适用；\n\
    \n```\n∀d∈D ( r.p(d) & t(d) → t(r.f(d)) )\n```\n- 如果目标已达成，则永远达成，规则的应用不会否定目标的达成；\n\
    \n```\n∀d∈D ( r1.p(d) & r2.p(d) → r2.f(r1.f(d)) = r1.f(r2.f(d)) )\n```\n- 当两条规则均适用时，它们可以按任意顺序应用。\n\
    \n第 0 节考虑的数字生成系统是可交换的。八数码游戏是另一个可交换生产系统的例子，但农夫、狼、羊、白菜问题是一个非可交换系统。\n\n请注意，第三个条件——可交换性条件——并不意味着规则的顺序（即语句）可以随意重排。\n\
    \n```\n∀d ( r2.f(r1.f(d)) = r1.f(r2.f(d)) ) 通常是错误的。\n```\n然而，当前规则可以按任意顺序应用。\n\n\
    可交换生产系统的一个重要优势是始终可以使用不可撤销模式，因为规则的应用不会破坏任何东西。\n\n**定理：** 每个生产系统都可以转换为可交换系统。\n\n\
    **证明：** 给定初始基础状态 `d0` 的生产系统 `S = < D, R, C >`。考虑其搜索图 `G`。我们构建一个新的生产系统 `S' = <\
    \ D', R', C' >`。系统 `S'` 的数据库变为系统 `S` 的搜索图。新系统的规则 `R'` 是在旧系统中利用策略 `C` 转换搜索图的不同方式（节点扩展）。新生产系统是可交换的。\n\
    \n实际上：\n- 在旧系统中，如果两个节点在列表 `O` 中，一个节点的扩展不会阻止第二个节点的扩展，因此满足第一个可交换条件；\n- 在旧系统中，如果终端节点被构建进搜索图，扩展其他节点不会将终端节点从图中排除，因此满足第二个可交换条件；\n\
    - 在旧系统中，如果列表 `O` 中有两个节点，它们可以按任意顺序扩展，得到相同的结果，因此满足第三个可交换条件。\n\n所证定理在实践中用处不大。虽然生成的新系统是可交换的，但转换极大地增加了其体积，与原始系统相比。利用不可逆搜索获得的收益小于转换过程中系统膨胀带来的损失。\n\
    \n我们将通过一个简化代数表达式的可交换系统示例来支持上述一般价值判断，该系统由以下部分构成：变量 `x`、自然系数、加法、乘法和幂运算（一元多项式）。存在若干变换规则：\n\
    \n1. 展开括号\n2. 合并同类项\n3. 按次数排序\n\n这些规则人人在学校都学过，因此我们未正式写出它们。让我们尝试简化表达式 `1 + x(1\
    \ + x(3 + x + x))`（图 2.28）。\n\n![](Images/image00348.jpeg)\n\n图 2.28. 表达式简化\n"
