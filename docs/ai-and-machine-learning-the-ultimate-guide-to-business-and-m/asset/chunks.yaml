    \ The text of the specified style does not exist in the document. .2. 更复杂的策略示例见下文**\
    \ 中介绍的“首次适配”。\n\n#### 首次适配规则选择策略\n\n```\nproc Select(d, R)\n    for r ∈ R do\n\
    \        if rp(d) then return(r) end if\n    end for\n    return(null)\nend proc\n\
    ```\n\n这是一个糟糕策略的典型例子。除非我们将自己的部分智能注入其中，否则很难指望机器表现出智能。\n\n让我们从算法角度更仔细地审视生产系统。事实上，算法\
    \ **Error! The text of the specified style does not exist in the document. .1**\
    \ 我们定义并记录了一种解释以一系列生成式形式呈现的知识的方法。算法 **Error! The text of the specified style does\
    \ not exist in the document. .1** 纯粹是机械性质的；它没有任何“智能”的迹象，无论是人工的还是自然的。它只是在输入数据 `d`\
    \ 上执行一组规则 `R`，而不对数据库状态的变化历史进行任何分析，也不评估我们是正在向解决方案靠近还是远离。普通计算机的行为方式相同：它们盲目地运行嵌入的程序，并不尝试理解自己正在做的事情是否有任何意义。换句话说：算法\
    \ **Error! The text of the specified style does not exist in the document. .1**\
    \ 是一个模拟虚拟机，而 `R` 规则集是该机器的程序。`Select` 函数占有特殊地位。智能就蕴藏在这个函数中，即用 1.3.2 节的术语来说是概念知识。该函数旨在将计算过程（基本变换）引导至解决方案，而集中在规则集\
    \ `R` 中的算法知识则独立存在，不负责任何控制职责。\n\n## 2.1.4. 生产系统作为逻辑演算\n\n人工智能中的“生产”一词本身源于逻辑，且并非最直接的方式。生成式规则或推理规则是一种逻辑规则，它表明如果我们拥有特定类型的前提，则会得出特定类型的结论。例如，**肯定前件式**\
    \ 规则规定，如果两个前提为真：陈述 `A` 以及表明 `B` 由 `A` 推出的蕴涵，则结论为真。\n\n```\nA, A → B\n──────\n\
    B\n```\n\n从数理逻辑的角度来看，生产系统因此可以被视为一种形式理论（形式理论的概念在 4.1.1 节中有详细描述）。在该形式理论中：\n\n- 初始事实库是形式理论\
    \ `A(c₁, ..., cₖ)` 形式的一组公理（面向问题的 [[31]](#part0005.xhtml#_ftn31)）的一部分，其中 `A` 是谓词符号（通常与研究对象的对象属性相关联）——且所有\
    \ `cᵢ` 均为常量项；\n- 生成式是若干面向问题公理的补充，以 `d ∧ p(d) → M(f(d))` 的隐式形式存在；此外，事实集 `d` 上的谓词\
    \ `p` 是生成式的一种“触发器”，而符号 `M(f(d))` 合理地意味着：在由函数 `f: D → D` 定义的事实基础 `D`（基础修改）上启动动作的执行，这些动作的成功执行将谓词\
    \ `M()` 设为真；\n- 唯一的推理规则是前面提到的 **肯定前件式** 规则。\n\n"
