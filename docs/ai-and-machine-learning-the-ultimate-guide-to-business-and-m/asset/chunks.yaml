- raw: "The conclusion is often non-categorical (ambiguous) - \"The patient is more\
    \ likely alive than dead\" (a medical anecdote, or perhaps not a joke). It often\
    \ happens that two different experts draw different (sometimes contradictory)\
    \ conclusions from the same premises – see the example of “orthogonal interpretation”\
    \ about a Bulgarian man and his girlfriend (Section 1.1.1).\n\nAll these features\
    \ are to some extent inherent in modern computer expert systems that use the production\
    \ mechanism in implementation.\n\nFormally, a system of heterogeneous productions\
    \ is an eclectic union of the apparatuses of several independent mathematical\
    \ disciplines: first-order logic, theory and probability, graph theory, possibly\
    \ measure theory, and something else ... The axiomatics of most systems of production\
    \ ( in the part reflecting a particular specialty - see Examples above about a\
    \ Bulgarian and seagulls) may be contradictory, the conclusions drawn may be unreliable,\
    \ and the cost of the conclusion may be unreasonably high. Nevertheless (and this\
    \ is sometimes admirable!) modern expert systems can not only make life easier\
    \ for doctors, geologists, chemists and specialists of other disciplines, but\
    \ also \"give out\" completely unexpected and extremely productive solutions.\n\
    \nIt should also be noted that intensive research is currently being carried out\
    \ to improve the mechanisms for representing and processing knowledge for production\
    \ systems. In particular, the so-called modal logic is proposed as a logical apparatus\
    \ (and the probability theory connected to it), which explicitly includes the\
    \ quantifiers possibility, certainty and personification of knowledge as well\
    \ as the recognition of the property of the non-monotony of the conclusion and\
    \ the semantics of possible worlds (see Fig.\n\n\\[9, 10\\]).\n\nThe production\
    \ system (SP) is determined by four: the fact base, the production quantity, the\
    \ control system, the condition for completing the preparation of an expert opinion.\n\
    \nIn this book, the database is systematically denoted by the letter D , the production\
    \ quantity by R , the control strategy (system) by C and the termination condition\
    \ by t . Once we have the notation established, the above definition can be rewritten\
    \ in standard mathematical form:\n\nSP = < D , R , C , t \\> .               (\\\
    *\\*)\n\nThe termination condition must not be specified, so below we give some\
    \ explanatory comments on the last element of the four.\n\nSo we see that application\
    \ systems with elements of artificial intelligence, based on the formalism of\
    \ productions, have a clear division into three parts mentioned in the previous\
    \ chapter (see section 1.3.4):\n\n\\-                     factual knowledge (a\
    \ fact base usually implemented in the form of a database);\n\n\\-                    \
    \ algorithmic knowledge (rules);\n\n\\-                     conceptual knowledge\
    \ (management strategy).\n\nThis is why product systems generally reflect AI applications\
    \ so well. Let's take a closer look at the elements of the production system.\
    \ \n\nMany products R. \\_ The elements of this set are usually called production\
    \ rules or production rules or simply productions .\n\nHeterogeneous Production\
    \ (Production) is a \"condition - action\" pair that establishes part of the knowledge\
    \ required to complete a step of preparing an expert opinion. The production rule\
    \ can be written as: r \\= def if p ( d ) then d := f ( d ) end if, (\\*\\*\\\
    *) \n\nwhere p is the condition and f is the action.\n\nThen the rules look like\
    \ this:\n\nR \\= { r | r \\= ( p , f \\[, w \\]) } .\n\nThe conditional part of\
    \ the rule p determines when this rule can be applied depending on the state of\
    \ the environment (fact base). The implementation of p is usually determined by\
    \ the truth or falsity of the predicate about the set of facts reliably established\
    \ at the given point in time. The production part f defines the mapping f : D\
    \  D and defines the effect on the environment [\\[28\\]](#part0005.xhtml#_ftn28).\
    \ Sometimes a real number w is used that characterizes the price (or weight, -weight\
    \ ) of the application of the rule. In this case, one can set oneself, for example,\
    \ the task of not only finding an order of application of products that leads\
    \ to the goal , but an order with a minimum total price.  \n\nfact base D contains\
    \ a description of the current state of the \"world\" in the process of thinking.\
    \ This description is a template that is compared to the condition part of the\
    \ product to select the appropriate actions to resolve the issue. If the current\
    \ content of the database meets the condition of a rule, the action specified\
    \ in that rule can be taken. In such a case, the rule applies . But the ability\
    \ to apply a rule does not mean that it must be applied. Whether the applicable\
    \ rule is actually applied is determined by the rule strategy.\n\nIf the rule\
    \ is applicable and the control strategy selects it, the rule is applied. After\
    \ applying the rule, the database changes its state.\n\nmanagement strategy C.\
    \ \\_ The control structure of a production system is simple: the fact base is\
    \ initialized with an initial task description. The current status of problem\
    \ solving is also reflected in the fact base. The current contents of the fact\
    \ base are matched against the conditions of the production rules, generating\
    \ a subset of applicable rules, sometimes called the conflict set [\\[29\\]](#part0005.xhtml#_ftn29).\
    \ Next, one of the productions r  R Conflict set (conflict resolution is performed)\
    \ and action f this rule is performed. As a result of applying the rule, not only\
    \ does the state of the fact base change, but possibly the conflict set as well.\
    \ The fact is that after changing the state of the database, the conditions of\
    \ some rules may no longer be met, and these rules will have to be excluded from\
    \ the conflict set. On the other hand, the conditions of previously unenclosed\
    \ rules can become true and must be enclosed. At the same time, conflict resolution\
    \ strategies (control strategies ) can be both quite simple, for example choosing\
    \ the first applicable rule, and quite complex, for example using complex heuristics.\
    \ According to the rule strategy, the rules are applied, for example, until either\
    \ the end condition is reached or there are no more applicable rules.\n\nend condition\
    \ t . There is usually a condition for the end of the solution process t : D \
    \ bool , ie a predicate whose argument is the facts from the database. If the\
    \ condition t ( d ) is met, then it is assumed that no more products need to be\
    \ applied and the current state of the database d is the answer. Sometimes the\
    \ end condition is not given as a formula, but directly as a set of database states\
    \ that satisfy the end condition. In such a case, this set is commonly denoted\
    \ by T :\n\nT \\= { d  D | t ( d ) } .\n\nIt is possible that no end condition\
    \ is specified because the system must run continuously. These are, for example,\
    \ automatic control systems for technological objects and continuous processes.\
    \ Here it makes sense to place the explanation promised above about the last element\
    \ of the quadruple in the formula (\\*\\*). The last element, the much-discussed\
    \ termination condition for t , cannot be removed from the dataset (because of\
    \ the mathematical \"constraints\" in place), so we agree that for the production\
    \ systems discussed in this paragraph, the constant holds Action, let's just assume\
    \ that t is equal to false .\n\nHaving discussed the components of production\
    \ systems, we turn to the structure of the production system as a whole. The organization\
    \ of an applied AI system in the form of a product system has a very important\
    \ advantage – the modularity or algorithmic nature of the knowledge. The difference\
    \ between a production system and hierarchically organized programs is as follows.\n\
    \n1.               There is no direct relationship between the rules in terms\
    \ of control . In other words, the rules don't call each other. All control of\
    \ the rules is placed in control strategy C."
