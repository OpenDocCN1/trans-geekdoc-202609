    知识库的紧凑性是人工智能系统性能的决定性因素，因此也决定了其适用性的边界。这一情况决定了本书的结构。章节按知识表示方法构建，而非按求解方法。在智力领域解决问题时，应先选择知识表示，再选择合适的求解算法。事实是：若选择了不成功的知识表示，则算法上的任何技巧都无济于事。反之，若发明了特别成功的知识表示，最常见的求解算法也能给出相当满意的结果。


    ### 1.3 人工智能史


    历史回顾往往绝对必要，否则无法理解为何现代法规恰如其分。由于历史和心理原因，AI 的定义和概念在很大程度上是主观的。AI 的规范与物理或化学的客观规律明显不同。我们将
    AI 发展史分为几个时期（史前期，此时“人工智能”一词尚未成为本质，但部分工作可回溯性地归因于此方向 [[17]](#part0005.xhtml#_ftn17)；


    - **开拓期**，计算机及 20 世纪其他技术进步极大拓宽了研究视野，几乎每个提议的想法都以其新颖性令人震惊并开辟新视角，想法如烟花般接连涌现；

    - **学术期**，AI 成为学术界独立研究领域，拥有自己的术语、机构、研究中心及国际社区；研究主要为发展方向本身服务，实际应用主要通过最基本的实现方式感兴趣，而非技术战术特征；

    - **工业期**，延续至今，技术能力的增强为 AI 系统的工业化大规模部署铺平了道路。


    当然，不应认为这些时期像社会主义经济五年计划那样严格依次跟随。开拓期和学术期均有独立的工业设计塑造历史，即便在我们这个功利时代，科学突破仍会发生（虽不常见），并突然导致“范式转移”。


    #### 1.3.1 人工智能背景


    雷蒙德·吕尔（Raymond Lull）在 700 多年前可靠记录的首次尝试，旨在创造模拟人类思维某些方面的机器。吕尔认为，可发现一种特殊方法或技艺，以合理的必然性从一般概念推导出各种真理，尤其是基督教教义的真理。基于此想法，他制造了第一台逻辑引擎，形式为几个同心圆纸圈，分隔成装有一般概念和范畴的格室。通过相对旋转圆圈，可获得给定概念的各种或简单或复杂的组合。吕尔相信借此能发现新的真理。当然，未发现新真理，但“推理可机械化”的思想由此诞生！


    我们现在知道逻辑运算可代数化并算术执行，但这在 19 世纪 G. 布尔（G. Boole）的工作前远非显而易见。因此，早期智能机器设计者将注意力集中在计算机器构造上。逻辑思维似乎更具挑战。17
    和 18 世纪建造了几台此类“计算机”，其中必须提及莱布尼茨计算器，它是世界上第一台能高效执行四则运算的机器。


    G. 莱布尼茨（G. Leibniz）于 1670 年着手研制此机；两年后绘制新草图描述，据此制作的复制品于 1673 年 2 月在伦敦皇家学会会议上演示。莱布尼茨承认仪器尚不完美，承诺回巴黎后尽快改进。虽随后几年显著改进，直到
    1694 年才定型。结果莱布尼茨多次回到发明，提供新的改进可能。


    计算机史前史的巅峰是查尔斯·巴贝奇（Charles Babbage）的工作。巴贝奇从一种机械装置入手，旨在通过多项式逼近函数并计算有限差分来自动化计算。用多项式近似表示对数和三角函数的可能性，使该机器成为相当通用的计算设备。这台差分机需能计算六次多项式值，精度达
    18 位。1822 年同期，巴贝奇制造了由滚筒和齿轮组成、用特殊杠杆手动旋转的差分机模型。次年英国政府资助 1500 英镑。研制中巴贝奇未展示所有技术和机械困难，不仅未兑现承诺的三年期限，九年后被迫停工。然而部分机器已开始运作，计算精度甚至超预期。


    1834 年巴贝奇发明了**分析机**（Analytical Engine）。它由存储数字的“仓库”（存储设备）、执行数字算术运算的“磨坊”（算术设备）、按特定顺序控制机器操作的“鼓”（控制器）、数据输入输出设备组成。巴贝奇机器的寄存器存储器可存至少
    10 个 40 位十进制数，理论上可扩展至 1000 个 50 位数。算术单元硬件支持四则运算。加法耗时 3 秒，乘除法 2 分钟。机器输入接收两流穿孔卡，巴贝奇称“运算卡”和“变量卡”：前者控制后者记录数据的处理。信息通过打孔记录在穿孔卡上。可从运算图创建函数库。因此，巴贝奇首台计算机架构的所有主要要素均已完全预见。**分析机**从未实现。失败主因是技术。当时技术无法按足够数量和精度制造所需复杂零件。发明家
    1851 年写道：“分析机相关所有开发均由我自费。我做过许多实验，已达技能不足之境。在这方面，我感到不得不拒绝进一步工作。”


    #### 1.3.2 前沿研究


    人工智能作为科学方向的严肃发展始于 1940 年代计算机出现后。1948 年诺伯特·维纳（Norbert Wiener）出版《控制论，或动物界与机器中的控制与通讯》（"Cybernetics,
    or Control and Communication in the Animal Kingdom and the Machine"），从而创立了新科学——控制论。

