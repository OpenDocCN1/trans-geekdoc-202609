    \ The text of the specified style in the document\n\nabsence. .13. Relationship\
    \ between universality and applicability\n\nNote that in practice, neither in\
    \ databases, nor in application packages, nor in applied artificial intelligence\
    \ systems, the goal of achieving universality is usually set. Typically, the goal\
    \ is to increase applicability, even at the cost of reducing versatility. The\
    \ reasons are very simple. First, the possibilities of manipulating knowledge\
    \ depend on the subject, and only by taking into account the characteristics of\
    \ the subject one can hope to build a compact representation of knowledge that\
    \ will provide effective solution to problems and increase applicability. Second,\
    \ meta-knowledge (management strategy) is weak in universal systems; Knowledge\
    \ of the order in which certain rules should be applied, what is important and\
    \ what can be neglected when solving a problem.\n\n#### 1.4.6. Classification\
    \ by architecture and tools\n\nWhen analyzing the architecture of applied systems\
    \ with elements of artificial intelligence, it is logical to single out:\n\n\\\
    -                     System manipulated objects ( other\n\ngiven words);\n\n\\\
    -                     Actions by these manipulations\n\nproduced (what can be\
    \ done with this data);\n\n\\-                     Control strategy that determines\
    \ when and what manipulations to perform (in what order, on what objects, what\
    \ actions to apply).\n\nSuch an idea of the architecture of an artificial intelligence\
    \ system is not a dogma - it arises from the analysis of typical modern artificial\
    \ intelligence systems. Highly specialized systems sometimes have a different\
    \ architecture. This means a logical analysis and not an analysis at the machine\
    \ code level, where the architectural structure is already indistinguishable.\n\
    \nNow we are talking about these three components (especially if they are clearly\
    \ separated in the software implementation): data (object properties), algorithms\
    \ (object methods in the sense of object-oriented programming) and meta-knowledge\
    \ .\n\nThe first work in the field of AI already showed the need for special tools\
