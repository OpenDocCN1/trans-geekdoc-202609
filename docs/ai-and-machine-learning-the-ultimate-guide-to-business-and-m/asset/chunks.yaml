    \ of applied artificial intelligence systems, various programming languages and\
    \ tools have been and are used, which cannot escape a given system. The tool used\
    \ in the development of the AI system is a classification feature.\n\n### CONCLUSIONS\
    \ ON CHAPTER 1\n\n1.               Artificial intelligence is a branch of science\
    \ that has a clearly defined theme – the modeling of thinking, understood as rational\
    \ behavior, using a range of methods from computer science and mathematics.\n\n\
    2.               The history of the development of artificial intelligence shows\
    \ that the time for reorientation is over and the time for practical application\
    \ is now upon us.\n\n3.               An analysis of the achievements of artificial\
    \ intelligence shows that the most important methods for practical application\
    \ are methods of knowledge representation.\n\n# CHAPTER 2. KNOWLEDGE REPRESENTATION\
    \ THROUGH PRODUCT SYSTEMS\n\nKnowledge representation by production systems (Production\
    \ Rules Knowledge Representation) is one of the most frequently used knowledge\
    \ representation mechanisms in intelligent systems. This mechanism is conceptually\
    \ simple, its idea is naturally perceived and easily implemented in software.\n\
    \nIn fact, there is no sharp boundary between artificial intelligence applications\
    \ and other software. Production systems are just another way for a computer to\
    \ organize a process of information processing. This method is fundamentally different\
    \ from the usual procedural and object-oriented programming, but has no fewer\
    \ features .\n\n### 2.1. PRODUCT SYSTEMS\n\nseveral definitions of production\
