    \n#### [1.1.3.2 Extended Euclidean algorithm](#contents.xhtml#rsec1_1_3_2)\n\n\
    Let *d* = *g**c**d*(*a*,*b*). Then there exists integers *u* and *v* such that\
    \ *d* = *u**a* + *v**b*, i.e. GCD of two numbers can be expressed as a linear\
