    ### 1.1.7.2 雅可比符号


    雅可比符号是勒让德符号的推广，其正式定义如下：


    设 $n$ 为正整数，其质因数分解为 $n = p_1^{t_1} p_2^{t_2} \dots p_m^{t_m}$，设 $a$ 为与 $n$ 互质的正整数。则雅可比符号
    $\left( \frac{a}{n} \right)$ 定义为：


    $$

    \left( \frac{a}{n} \right) = \left( \frac{a}{p_1^{t_1} p_2^{t_2} \dots p_m^{t_m}}
    \right) = \left( \frac{a}{p_1} \right)^{t_1} \left( \frac{a}{p_2} \right)^{t_2}
    \dots \left( \frac{a}{p_m} \right)^{t_m}

    $$


    (1.11)


    例如：$\left( \frac{2}{45} \right) = \left( \frac{2}{3² \cdot 5} \right) = \left(
    \frac{2}{3} \right)² \left( \frac{2}{5} \right) = (-1)² (-1) = -1$ 和 $\left( \frac{109}{385}
    \right) = \left( \frac{109}{5 \cdot 7 \cdot 11} \right) = \left( \frac{109}{5}
    \right) \left( \frac{109}{7} \right) \left( \frac{109}{11} \right) = \left( \frac{4}{5}
    \right) \left( \frac{4}{7} \right) \left( \frac{10}{11} \right) = \left( \frac{2}{5}
    \right)² \left( \frac{2}{7} \right)² \left( \frac{-1}{11} \right) = (-1)² (1)
    (-1) = -1$。


    上述关于数论概念的讨论是理解密码算法 [[4]](#01chap_01.xhtml#ref1_4)、[[5]](#01chap_01.xhtml#ref1_5)
    的必要前提。


    ## 1.2 抽象代数


    抽象代数 [[6]](#01chap_01.xhtml#ref1_6)、[[7]](#01chap_01.xhtml#ref1_7) 代表了一类强大的数学工具，应用于各个领域。它是经典代数的延伸，处理的是群、环、域等抽象结构，而非通常的数系。在本节中，我们将概述这些结构，这是理解密码体制核心的前提。


    代数结构由以下三个组成部分刻画：


    *   一个底层集合，通常称为代数结构的**载体集合**。

    *   定义在底层集合元素上的运算。

    *   集合中的特殊元素，称为代数结构的**常数**。


    例如：$(\mathbb{Z}, +, 0)$ 是一个代数结构，其中 $\mathbb{Z}$ = 整数集，$+$ = 二元运算（从 $\mathbb{Z}²
    \to \mathbb{Z}$ 的映射），$\mathbb{Z}²$ 表示该运算作用于集合 $\mathbb{Z}$ 的两个元素上，且结果元素也属于集合 $\mathbb{Z}$，$0$
    = $C$ 代数常数。


    一般来说，算子可以取 $m$ 个元素：$S^m \to S$，此处 $m$ 称为运算的**元数**。任意两个代数结构可能具有相同的签名、相同数量且元数相同的运算以及相同数量的常数。例如，$(\mathbb{Z},
    +, \cdot, -, 1, 0)$ 和 $(\mathbb{R}, +, \cdot, -, 1, 0)$，此处 $\mathbb{R}$ 为实数集。具有相同签名的两个代数未必具有相同的性质。$(\mathbb{Z},
    -, 0)$ 和 $(\mathbb{Q}, +, 0)$。此处，交换律对第二个结构成立，但对第一个不成立。


    **子代数结构**：设 $A = \langle S, \circ, \triangle, k \rangle$ 和 $A'' = (S'', \circ'',
    \triangle'', k'')$ 为两个代数，则若满足 i) $S'' \subseteq S$，ii) $a \circ'' b = a \circ
    b, \forall a, b \in S''$，iii) $\triangle'' a = \triangle a, \forall a \in S''$
    且 iv) $k'' = k$，则 $A''$ 为 $A$ 的子代数。若 $A''$ 是 $A$ 的子代数，则 $A''$ 具有与 $A$ 相同的签名并遵守相同的公理。


    **零元与一元**：设 $\circ$ 为 $S$ 上的二元运算。元素 $1 \in S$ 称为运算 $\circ$ 的**单位元**，若对每个 $x \in
    S$，有 $1_l \circ x = x \circ 1_r = x$。元素 $0 \in S$ 称为运算 $\circ$ 的**零元**，若对每个 $x
    \in S$，有 $0_l \circ x = x \circ 0_r = 0$。


    考虑以下代数结构：$S = \{a, b, c\}$，运算：$\circ$，运算表：

    $$

    \begin{matrix}

    \circ & a & b & c \\

    a & a & b & b \\

    b & a & b & c \\

    c & a & b & c

    \end{matrix}

    $$

    求零元和单位元。


    *解*：右零元 = $a, b$，无左零元，左单位元 = $b$，无右单位元。


    **定理**：设 $\circ$ 为 $S$ 上的二元运算，具有左单位元 $1_l$ 和右单位元 $1_r$。则 $1_l = 1_r$，这称为**双边单位元**。


    *证明*：由左单位元得：$1_l \circ x = x$。令 $x = 1_r$。由右单位元得：$x \circ 1_r = x$。令 $x = 1_l$，得
    $1_l \circ 1_r = 1_l$。因此 $1_r = 1_l$。


    ### 1.2.1 半群


    半群是具有签名 $\langle S, \circ \rangle$ 的代数结构。半群通常由具有单个二元运算且满足封闭性和结合律的代数结构组成。例如：$\langle
    \mathbb{Z}, + \rangle$、$\langle \mathbb{Z}, \cdot \rangle$、$\langle \mathbb{R},
    + \rangle$、$\langle \Sigma^*, \text{concatenation} \rangle$。


    ### 1.2.2 幺半群


    幺半群是具有签名 $\langle S, \circ, 1 \rangle$ 的代数结构，其中 $\circ$ 为二元结合运算，$1$ 为运算 $\circ$
    的双边单位元。它满足封闭性、结合律和单位元公理。幺半群的例子包括：$\langle \mathbb{Z}, +, 0 \rangle$、$\langle \mathbb{Z},
    \cdot, 1 \rangle$、$\langle \mathbb{R}, +, 0 \rangle$、$\langle \Sigma^*, \text{concatenation},
    \lambda \rangle$。


    ### 1.2.3 群


    群是具有签名 $\langle S, \circ, 1, - \rangle$ 的代数结构，其中 $\circ$ 为二元结合运算，常数 $1$ 为运算 $\circ$
    的双边单位元，$-$ 为定义在载体上的一元运算，使得 $\forall x \in S, \bar{x}$ 为 $x$ 关于 $\circ$ 的逆元。它满足封闭性、结合律、单位元和逆元公理。群的例子包括：$\langle
    \mathbb{Z}, +, 0, - \rangle$，此处 $-$ 表示一元取负运算。若 $\circ$ 运算满足交换律，则该群称为**阿贝尔群**（或交换群）。群是构造密码体制中最常用的代数结构。因此，我们将在篇幅限制内尽可能详细地介绍。


    **群具有唯一逆元**：设群元素 $a$ 有两个逆元 $b$ 和 $c$，$b \circ a = e$ 且 $c \circ a = e$，这蕴含 $b
    \circ a = c \circ a \Rightarrow b \circ a \circ b = c \circ a \circ b$。设 $a \circ
    b = d$，则 $b \circ d = c \circ d$。我们知道群中每个元素都有逆元，故 $b \circ d \circ d^{-1} = c
    \circ d \circ d^{-1} \Rightarrow b \circ e = c \circ e$。因此，$b = c$。


