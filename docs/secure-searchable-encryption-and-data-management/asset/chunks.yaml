    和 [[28]](#05chap_05.xhtml#ref5_28) 使计算成本不随属性数量变化。在 `Search` 算法中，[[26]](#05chap_05.xhtml#ref5_26)
    和 [[27]](#05chap_05.xhtml#ref5_27) 实现了恒定数量的配对操作，从而实现了快速搜索。


    ## 5.3 章节总结


    在多用户云环境中，公钥设置是开发可搜索加密方案的首选，因为对称密钥方案面临着秘密密钥共享的复杂过程。本章详细解释了公钥设置下可搜索加密的概念。它提供了非对称密钥设置下可搜索加密方案的通用结构。此外，本章主要讨论了基于
    IBE 和 ABE 开发的可搜索加密技术。二者之中，我们认为 ABE 是合适的选择，因为它提供了细粒度访问控制能力，使其成为能够真正以高效方式处理多用户的适当方案。此外，我们还在此设置下对文献中的现有方案进行了比较分析。


