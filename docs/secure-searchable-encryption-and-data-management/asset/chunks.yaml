    _{j}}} \\\\equiv {\\\\prod\\\\limits\\_{i = 1}^{\\\\text{φ}{(m)}}r\\_{i}}\\\\\
    left( {modm} \\\\right) = a^{\\\\text{φ}(m)} \\\\equiv 1modm$.\n\n### [1.1.5 Congruence\
    \ solutions](#contents.xhtml#rsec1_1_5)\n\nLet *m*[1], *m*[2], ……*m*[*r*] be pairwise\
    \ relatively prime positive integers. We want to find the solution of the following\
    \ system: *x* ≡ *a*[1]*m**o**d**m*[1], *x* ≡ *a*[2]*m**o**d**m*[2], …, *x* ≡ *a*[*r*]*m**o**d**m*[*r*]\
    \ One method to find the solution of such equations is by the Chinese remainder\
    \ theorem (CRT).\n\nThe CRT theorem states that the solution of such system exists\
    \ if (*m*[*i*],*m*[*j*]) = 1, ∀*i* ≠ *j*.\n\n*Proof*: Let *m* = *m*[1] ⋅ *m*[2] ⋅ … ⋅ *m*[*r*],\
    \ then $\\\\left( {\\\\frac{m}{m\\_{j}},m\\_{j}} \\\\right) = 1$. Let *R*(*m*[*j*])\
    \ represents the reduced residue modulo *m*, which contains set of all elements\
    \ relatively prime to *m*[*j*]. Therefore, ∀*a* ∈ *R*(*m*[*j*]), ∃*x* ∈ *R*(*m*[*j*]) : *a**x* ≡ 1*m**o**d**m*[*j*],\
    \ which implies, $\\\\exists b\\_{j} \\\\in R\\\\left( m\\_{j} \\\\right):\\\\\
    frac{m}{m\\_{j}}.b\\_{j} \\\\equiv 1modm\\_{j}$. Let *x*[0] be the one solution,\
    \ then $x\\_{0} = {\\\\sum\\_{j = 1}^{r}{\\\\left( \\\\frac{m}{m\\_{j}} \\\\right)\
    \ \\\\cdot b\\_{j} \\\\cdot a\\_{j}mod\\\\ m\\_{j}}}$ because $\\\\left( \\\\\
    frac{m}{m\\_{j}} \\\\right) \\\\cdot b\\_{j} \\\\cdot a\\_{j} \\\\equiv a\\_{j}modm\\\
    _{j}$.\n\n### [1.1.6 Quadratic residues](#contents.xhtml#rsec1_1_6)\n\nIf *p*\
    \ is an odd prime and *a* is an integer relatively prime to *p* then is “*a*”\
    \ a perfect square modulo *p*? Finding quadratic residues provides the answer\
    \ to this question. If *m* is a positive integer, we say integer “*a*” is a quadratic\
    \ residue of *m* if *g**c**d*(*a*,*m*) = 1 and the congruence *x*² ≡ *a**m**o**d**m*\
    \ has a solution. If *x*² ≡ *a**m**o**d**m* has no solution then “*a*” is a quadratic\
    \ non-residue of *m* \\[[2](#01chap_01.xhtml#ref1_2)\\], \\[[3](#01chap_01.xhtml#ref1_3)\\\
    ].\n\n*Example*: Determine which integers are quadratic residues of 11.\n\n* \
    \  Step 1: Since *m* = 11 is a prime number then {1,2,…10} are relatively prime\
    \ to *m*.\n\n*   Step 2: Compute the squares of integers {1,2,…10}: 1² ≡ 10² ≡ 1*m**o**d*11,\
    \ 2² ≡ 9² ≡ 4*m**o**d*11, 3² ≡ 8² ≡ 9*m**o**d*11, 4² ≡ 7² ≡ 5*m**o**d*11, 5² ≡ 6² ≡ 3*m**o**d*11.\n\
    \n*   Quadratic residues: 1, 3, 4, 5, 9, Quadratic non-residues: 2, 6, 7, 8, 10.\n\
    \n*Conclusion*: Given any fixed positive integer *m*, it is possible to determine\
    \ the quadratic residue by simply listing the positive integers less than and\
    \ prime to *m*, squaring them and reducing *m**o**d**m*.\n\n*Lemma*: If *p* is\
    \ an odd prime and *a* is an integer relatively prime to *p* then the congruence\
    \ *x*² ≡ *a**m**o**d**m* has either no solution or exactly two incongruent solutions\
    \ modulo *p*.\n\n*Proof*: If *x*² ≡ *a**m**o**d**p* has a solution, say *x* = *x*[0],\
    \ then we can easily demonstrate that *x* =  − *x*[0] is the second incongruent\
    \ solution because ( − *x*[0])² = *x*[0]²  ≡ *a**m**o**d**p*.\n\n*Note*: *x* [0]\
    \ ≢ *x*[0] ≢  − *x*[0]*m**o**d**p* ( 2*x*[0] ≡ 0*m**o**d**p*, which is impossible\
    \ because *p* |*x*[0]).\n\nNow we have to show that there are no more than two\
    \ incongruent solutions. Assume *x* = *x*[0] and *x* = *x*[1] are both solutions\
    \ of *x*² ≡ *a**m**o**d**p*. *x*[0]²  ≡ *a**m**o**d**p* and *x*[1]² ≡ *a**m**o**d**p*\
    \ then *x*[0]² − *x*[1]² ≡ 0*m**o**d**p*. (*x*[0]+*x*[1])(*x*[0]−*x*[1])≡0*m**o**d**p*  *i*.*e*. *p*|(*x*[0]+*x*[1])\
    \ or *p*|(*x*[0]−*x*[1]). *x*[1] ≡  − *x*[0]*m**o**d**p*    *o**r*    *x*[1] ≡ *x*[0]*m**o**d**p*.\n\
    \n*Theorem*: If *p* is an odd prime then there are exactly $\\\\frac{p - 1}{2}$\
    \ quadratic residues of *p* and $\\\\frac{p - 1}{2}$ quadratic non-residues of\
    \ *p*.\n\n*Proof*: Consider all the squares of integers {1,2,…*p*−1}. We know\
    \ *x*² ≡ (*p*−*x*)² ≡ *a**m**o**d**p*. Let 1 < *b* < *p* − 1. (*p*−*b*)² ≡ *b*²*m**o**d**p*.\n\
    \n$$1^{2},2^{2},\\\\ldots,\\\\left( \\\\frac{p - 1}{2} \\\\right)^{2} \\\\equiv\
    \ \\\\left( \\\\frac{p + 1}{2} \\\\right)^{2},\\\\ldots,\\\\left( {p - 2} \\\\\
    right)^{2},\\\\left( {p - 1} \\\\right)^{2}$$  \n\n(1.6)\n\nSince 1²  ≡ (*p*−1)²*m**o**d**p*\
    \ and similarly the same relation can be set among other elements of equation\
    \ (1.6). Therefore, $1^{2},2^{2},\\\\ldots,\\\\left( \\\\frac{p - 1}{2} \\\\right)^{2}$\
    \ are all distinct.\n\n#### [1.1.6.1 Euler's criterion](#contents.xhtml#rsec1_1_6_1)\n\
    \nEuler's criterion tells us precisely when an integer *a* is a quadratic residue\
    \ modulo an odd prime *p*. Let *p*  be odd prime and *g**c**d*(*a*,*p*) = 1. Then\
    \ *a* is a quadratic residue modulo *p* if and only if $a^{\\\\frac{p - 1}{2}}\
    \ \\\\equiv 1modp$\n\n*Proof*: Let *a* be the quadratic residue then *x*² ≡ *a**m**o**d**p*.\
    \ $\\\\left( x^{2} \\\\right)^{\\\\frac{p - 1}{2}} \\\\equiv a^{\\\\frac{p - 1}{2}}modp$.\
    \ $x^{p - 1} \\\\equiv a^{\\\\frac{p - 1}{2}}modp$. By Fermat's little theorem,\
    \ *x*^(*p* − 1) ≡ 1*m**o**d**p*, therefore, $a^{\\\\frac{p - 1}{2}}$  ≡ 1*m**o**d**p*.\n\
    \n*Conversely*: Given $a^{\\\\frac{p - 1}{2}}$  ≡ 1*m**o**d**p*. To prove: “*a*”\
    \ is a quadratic residue modulo an odd prime *p*.\n\n*Proof*: We know that there\
    \ exists a primitive root *g* *m**o**d**u**l**o* *p*, such that any integer in\
    \ ℤ[*p*] can be expressed as *g*^(*i*)*m**o**d**p*, 1 ≤ *i* ≤ *p* − 1 and *g*^(*m*) ≡ 1*m**o**d**p*\
    \ holds only when *p*−1|*m*    (*m*\\=0 *o**r* *p*−1). For some 1 ≤ *i* ≤ *p* − 1\
    \ we have *a* ≡ *g*^(*i*)*m**o**d**p*. ${g^{i{(\\\\frac{p - 1}{2})}} \\\\equiv\
    \ a}^{\\\\frac{p - 1}{2}} \\\\equiv 1modp$ (Given). By the property of primitive\
    \ root $\\\\left. p - 1\\\\ \\\\middle| \\\\ i\\\\left( \\\\frac{p - 1}{2} \\\\\
    right) \\\\right.$; therefore, *i* must be even say, *i* = 2*j* which implies\
    \ *a* ≡ *g*^(2*j*)*m**o**d**p*, *a* ≡ (*g*^(*j*))²*m**o**d**p*. Hence, *a* is\
    \ a quadratic residue modulo an odd prime *p*.\n\n### [1.1.7 Legendre symbol](#contents.xhtml#rsec1_1_7)\n\
    \nIt is a convenient notation to indicate whether an integer *a* is a quadratic\
    \ residue modulo an odd prime *p*. Legendre symbol of *a**m**o**d**p* is denoted\
    \ as $\\\\left( \\\\frac{a}{p} \\\\right)$. Formally, it is defined as:\n\n$$\\\
    \\left( \\\\frac{a}{p} \\\\right) = \\\\left\\\\{ \\\\begin{matrix} {1,\\\\ \\\
    \\ if\\\\ a\\\\ is\\\\ a\\\\ non - zero\\\\ \\\\text{q}\\\\text{u}\\\\text{a}\\\
    \\text{d}\\\\text{r}\\\\text{a}\\\\text{t}\\\\text{i}\\\\text{c}\\\\ \\\\text{r}\\\
    \\text{e}\\\\text{s}\\\\text{i}\\\\text{d}\\\\text{u}\\\\text{e}\\\\ \\\\text{m}\\\
    \\text{o}\\\\text{d}\\\\text{u}\\\\text{l}\\\\text{o}\\\\ \\\\text{p}} \\\\\\\\\
    \ {- 1,\\\\ \\\\ if\\\\ a\\\\ is\\\\ a\\\\ non - zero\\\\ \\\\text{q}\\\\text{u}\\\
    \\text{a}\\\\text{d}\\\\text{r}\\\\text{a}\\\\text{t}\\\\text{i}\\\\text{c}\\\\\
    \ \\\\text{n}\\\\text{o}\\\\text{n}\\\\text{-}\\\\text{r}\\\\text{e}\\\\text{s}\\\
    \\text{i}\\\\text{d}\\\\text{u}\\\\text{e}\\\\ \\\\text{m}\\\\text{o}\\\\text{d}\\\
    \\text{u}\\\\text{l}\\\\text{o}\\\\ \\\\text{p}} \\\\\\\\ \\\\left. {}0,\\\\ \\\
    \\ if\\\\ p \\\\middle| a \\\\right. \\\\\\\\ \\\\end{matrix} \\\\right.$$  \n\
    \n(1.7)\n\nExample: $\\\\left( \\\\frac{2}{7} \\\\right) = 1$, $\\\\left( \\\\\
    frac{2}{5} \\\\right) = - 1$, $\\\\left( \\\\frac{12}{5} \\\\right) = - 1,\\\\\
    left( \\\\frac{101}{97} \\\\right) = 1,~\\\\left( \\\\frac{97}{101} \\\\right)\
    \ = 1$.\n\nIf *p*  divide  *a*  with remainder, i.e. *a* = *q**p* + *r* then $\\\
    \\left( \\\\frac{a}{p} \\\\right) = \\\\left( \\\\frac{r}{p} \\\\right)$. By Euler's\
    \ criterion, $a^{\\\\frac{p - 1}{2}}$ $\\\\equiv \\\\left( \\\\frac{a}{p} \\\\\
    right)modp$.\n\n#### [1.1.7.1 Law of quadratic reciprocity](#contents.xhtml#rsec1_1_7_1)\n\
    \nThe law of quadratic reciprocity relates the two Legendre symbols $\\\\left(\
    \ \\\\frac{p}{q} \\\\right)$ and $\\\\left( \\\\frac{q}{p} \\\\right)$ where *p*\
    \ and *q* are odd primes:\n\n$$\\\\left( \\\\frac{p}{q} \\\\right)\\\\left( \\\
    \\frac{q}{p} \\\\right) = \\\\left( {- 1} \\\\right)^{{(\\\\frac{p - 1}{2})}{(\\\
    \\frac{q - 1}{2})}}$$  \n\n(1.8)"
  fmt: "\n**Proof**: Let `r[1]`, `r[2]`, …, `r[φ(m)]` be a reduced residue system\
    \ modulo `m`. Then `a*r[1]`, `a*r[2]`, …, `a*r[φ(m)]` is also a reduced residue\
    \ system modulo `m`, since `(a,m) = 1` and `(r[i],m) = 1`, which implies `(a*r[i],m)\
    \ = 1`. Therefore, corresponding to each `r[i]`, there is one and only one `a*r[j]`\
    \ such that `a*r[j] ≡ r[i] (mod m)`. Multiply all such `φ(m)` relations:\n\n```\n\
    ∏(j=1 to φ(m)) a*r[j] ≡ ∏(i=1 to φ(m)) r[i] (mod m) = a^φ(m) ≡ 1 (mod m)\n```\n\
    \n### 1.1.5 Congruence solutions\n\nLet `m[1]`, `m[2]`, … `m[r]` be pairwise relatively\
    \ prime positive integers. We want to find the solution of the following system:\
    \ `x ≡ a[1] (mod m[1])`, `x ≡ a[2] (mod m[2])`, …, `x ≡ a[r] (mod m[r])`. One\
    \ method to find the solution of such equations is by the Chinese remainder theorem\
    \ (CRT).\n\nThe CRT theorem states that the solution of such system exists if\
    \ `(m[i],m[j]) = 1, ∀ i ≠ j`.\n\n**Proof**: Let `m = m[1] ⋅ m[2] ⋅ … ⋅ m[r]`,\
    \ then `(m/m[j], m[j]) = 1`. Let `R(m[j])` represents the reduced residue modulo\
    \ `m`, which contains set of all elements relatively prime to `m[j]`. Therefore,\
    \ `∀ a ∈ R(m[j]), ∃ x ∈ R(m[j]) : a*x ≡ 1 (mod m[j])`, which implies, `∃ b[j]\
    \ ∈ R(m[j]) : (m/m[j]) * b[j] ≡ 1 (mod m[j])`. Let `x[0]` be the one solution,\
    \ then `x[0] = ∑(j=1 to r) ((m/m[j]) ⋅ b[j] ⋅ a[j] mod m[j])` because `((m/m[j])\
    \ ⋅ b[j] ⋅ a[j]) ≡ a[j] (mod m[j])`.\n\n### 1.1.6 Quadratic residues\n\nIf `p`\
    \ is an odd prime and `a` is an integer relatively prime to `p` then is \"a\"\
    \ a perfect square modulo `p`? Finding quadratic residues provides the answer\
    \ to this question. If `m` is a positive integer, we say integer \"a\" is a quadratic\
    \ residue of `m` if `gcd(a,m) = 1` and the congruence `x² ≡ a (mod m)` has a solution.\
    \ If `x² ≡ a (mod m)` has no solution then \"a\" is a quadratic non-residue of\
    \ `m` [[2]](#01chap_01.xhtml#ref1_2), [[3]](#01chap_01.xhtml#ref1_3).\n\n**Example**:\
    \ Determine which integers are quadratic residues of 11.\n\n*   **Step 1**: Since\
    \ `m = 11` is a prime number then `{1,2,…10}` are relatively prime to `m`.\n*\
    \   **Step 2**: Compute the squares of integers `{1,2,…10}`: `1² ≡ 10² ≡ 1 (mod\
    \ 11)`, `2² ≡ 9² ≡ 4 (mod 11)`, `3² ≡ 8² ≡ 9 (mod 11)`, `4² ≡ 7² ≡ 5 (mod 11)`,\
    \ `5² ≡ 6² ≡ 3 (mod 11)`.\n*   **Quadratic residues**: 1, 3, 4, 5, 9. **Quadratic\
    \ non-residues**: 2, 6, 7, 8, 10.\n\n**Conclusion**: Given any fixed positive\
    \ integer `m`, it is possible to determine the quadratic residue by simply listing\
    \ the positive integers less than and prime to `m`, squaring them and reducing\
    \ `mod m`.\n\n**Lemma**: If `p` is an odd prime and `a` is an integer relatively\
    \ prime to `p` then the congruence `x² ≡ a (mod m)` has either no solution or\
    \ exactly two incongruent solutions modulo `p`.\n\n**Proof**: If `x² ≡ a (mod\
    \ p)` has a solution, say `x = x[0]`, then we can easily demonstrate that `x =\
    \ -x[0]` is the second incongruent solution because `(-x[0])² = x[0]² ≡ a (mod\
    \ p)`.\n\n**Note**: `x[0] ≢ -x[0] (mod p)` ( `2*x[0] ≡ 0 (mod p)`, which is impossible\
    \ because `p | x[0]`).\n\nNow we have to show that there are no more than two\
    \ incongruent solutions. Assume `x = x[0]` and `x = x[1]` are both solutions of\
    \ `x² ≡ a (mod p)`. `x[0]² ≡ a (mod p)` and `x[1]² ≡ a (mod p)` then `x[0]² -\
    \ x[1]² ≡ 0 (mod p)`. `(x[0]+x[1])(x[0]-x[1]) ≡ 0 (mod p)` i.e. `p | (x[0]+x[1])`\
    \ or `p | (x[0]-x[1])`. `x[1] ≡ -x[0] (mod p)` or `x[1] ≡ x[0] (mod p)`.\n\n**Theorem**:\
    \ If `p` is an odd prime then there are exactly `(p - 1)/2` quadratic residues\
    \ of `p` and `(p - 1)/2` quadratic non-residues of `p`.\n\n**Proof**: Consider\
    \ all the squares of integers `{1,2,…p−1}`. We know `x² ≡ (p-x)² ≡ a (mod p)`.\
    \ Let `1 < b < p - 1`. `(p-b)² ≡ b² (mod p)`.\n\n```\n1², 2², …, ((p - 1)/2)²\
    \ ≡ ((p + 1)/2)², …, (p - 2)², (p - 1)²\n```\n\n(1.6)\n\nSince `1² ≡ (p-1)² (mod\
    \ p)` and similarly the same relation can be set among other elements of equation\
    \ (1.6). Therefore, `1², 2², …, ((p - 1)/2)²` are all distinct.\n\n#### 1.1.6.1\
    \ Euler's criterion\n\nEuler's criterion tells us precisely when an integer `a`\
    \ is a quadratic residue modulo an odd prime `p`. Let `p` be odd prime and `gcd(a,p)\
    \ = 1`. Then `a` is a quadratic residue modulo `p` if and only if `a^((p - 1)/2)\
    \ ≡ 1 (mod p)`.\n\n**Proof**: Let `a` be the quadratic residue then `x² ≡ a (mod\
    \ p)`. `(x²)^((p - 1)/2) ≡ a^((p - 1)/2) (mod p)`. `x^(p - 1) ≡ a^((p - 1)/2)\
    \ (mod p)`. By Fermat's little theorem, `x^(p-1) ≡ 1 (mod p)`, therefore, `a^((p\
    \ - 1)/2) ≡ 1 (mod p)`.\n\n**Conversely**: Given `a^((p - 1)/2) ≡ 1 (mod p)`.\
    \ To prove: \"a\" is a quadratic residue modulo an odd prime `p`.\n\n**Proof**:\
    \ We know that there exists a primitive root `g` modulo `p`, such that any integer\
    \ in `ℤ[p]` can be expressed as `g^(i) (mod p)`, `1 ≤ i ≤ p - 1` and `g^(m) ≡\
    \ 1 (mod p)` holds only when `p-1 | m` ( `m=0` or `p-1`). For some `1 ≤ i ≤ p\
    \ - 1` we have `a ≡ g^(i) (mod p)`. `g^(i((p - 1)/2)) ≡ a^((p - 1)/2) ≡ 1 (mod\
    \ p)` (Given). By the property of primitive root `p - 1 | i((p - 1)/2)`; therefore,\
    \ `i` must be even say, `i = 2j` which implies `a ≡ g^(2j) (mod p)`, `a ≡ (g^(j))²\
    \ (mod p)`. Hence, `a` is a quadratic residue modulo an odd prime `p`.\n\n###\
    \ 1.1.7 Legendre symbol\n\nIt is a convenient notation to indicate whether an\
    \ integer `a` is a quadratic residue modulo an odd prime `p`. Legendre symbol\
    \ of `a (mod p)` is denoted as `(a/p)`. Formally, it is defined as:\n\n```\n(\
    \ a/p ) = {  1,  if a is a non-zero quadratic residue modulo p\n           { -1,\
    \  if a is a non-zero quadratic non-residue modulo p\n           {  0,  if p |\
    \ a\n```\n\n(1.7)\n\nExample: `(2/7) = 1`, `(2/5) = -1`, `(12/5) = -1`, `(101/97)\
    \ = 1`, `(97/101) = 1`.\n\nIf `p` divide `a` with remainder, i.e. `a = q*p + r`\
    \ then `(a/p) = (r/p)`. By Euler's criterion, `a^((p - 1)/2) ≡ (a/p) (mod p)`.\n\
    \n#### 1.1.7.1 Law of quadratic reciprocity\n\nThe law of quadratic reciprocity\
    \ relates the two Legendre symbols `(p/q)` and `(q/p)` where `p` and `q` are odd\
    \ primes:\n\n```\n( p/q ) ( q/p ) = (-1)^(((p - 1)/2) * ((q - 1)/2))\n```\n\n\
    (1.8)\n"
  trans: "\n\n**证明**：设 `r[1]`、`r[2]`、…、`r[φ(m)]` 为模 `m` 的一个简化剩余系。那么 `a*r[1]`、`a*r[2]`、…、`a*r[φ(m)]`\
    \ 也是模 `m` 的一个简化剩余系，因为 `(a,m) = 1` 且 `(r[i],m) = 1`，这意味着 `(a*r[i],m) = 1`。因此，对应每个\
    \ `r[i]`，有且仅有一个 `a*r[j]` 使得 `a*r[j] ≡ r[i] (mod m)`。将所有这 `φ(m)` 个关系式相乘：\n\n```\n\
    ∏(j=1 to φ(m)) a*r[j] ≡ ∏(i=1 to φ(m)) r[i] (mod m) = a^φ(m) ≡ 1 (mod m)\n```\n\
    \n### 1.1.5 同余方程组的解\n\n设 `m[1]`、`m[2]`、… `m[r]` 为两两互素的正整数。我们要求解以下方程组的解：`x ≡ a[1]\
    \ (mod m[1])`、`x ≡ a[2] (mod m[2])`、…、`x ≡ a[r] (mod m[r])`。求解此类方程的一种方法是利用中国剩余定理\
    \ (CRT)。\n\n中国剩余定理指出，若 `(m[i],m[j]) = 1, ∀ i ≠ j`，则该方程组的解存在。\n\n**证明**：设 `m =\
    \ m[1] ⋅ m[2] ⋅ … ⋅ m[r]`，则 `(m/m[j], m[j]) = 1`。设 `R(m[j])` 表示模 `m` 的简化剩余系，它包含所有与\
    \ `m[j]` 互素的元素集合。因此，`∀ a ∈ R(m[j]), ∃ x ∈ R(m[j]) : a*x ≡ 1 (mod m[j])`，这意味着，`∃\
    \ b[j] ∈ R(m[j]) : (m/m[j]) * b[j] ≡ 1 (mod m[j])`。设 `x[0]` 为一个解，则 `x[0] = ∑(j=1\
    \ to r) ((m/m[j]) ⋅ b[j] ⋅ a[j] mod m[j])`，因为 `((m/m[j]) ⋅ b[j] ⋅ a[j]) ≡ a[j]\
    \ (mod m[j])`。\n\n### 1.1.6 二次剩余\n\n如果 `p` 是奇素数且 `a` 是与 `p` 互素的整数，那么 \"a\" 是否为模\
    \ `p` 的完全平方数？求二次剩余可以回答这个问题。如果 `m` 是正整数，我们称整数 \"a\" 为 `m` 的二次剩余，当且仅当 `gcd(a,m)\
    \ = 1` 且同余式 `x² ≡ a (mod m)` 有解。如果 `x² ≡ a (mod m)` 无解，则称 \"a\" 为 `m` 的二次非剩余 [[2]](#01chap_01.xhtml#ref1_2)，[[3]](#01chap_01.xhtml#ref1_3)。\n\
    \n**示例**：判定哪些整数是 11 的二次剩余。\n\n*   **步骤 1**：因为 `m = 11` 是素数，所以 `{1,2,…10}` 均与 `m`\
    \ 互素。\n*   **步骤 2**：计算整数 `{1,2,…10}` 的平方：`1² ≡ 10² ≡ 1 (mod 11)`，`2² ≡ 9² ≡ 4\
    \ (mod 11)`，`3² ≡ 8² ≡ 9 (mod 11)`，`4² ≡ 7² ≡ 5 (mod 11)`，`5² ≡ 6² ≡ 3 (mod 11)`。\n\
    *   **二次剩余**：1, 3, 4, 5, 9。**二次非剩余**：2, 6, 7, 8, 10。\n\n**结论**：给定任意固定的正整数 `m`，只需列出所有小于\
    \ `m` 且与 `m` 互素的正整数，将它们平方并对 `m` 取模，即可确定二次剩余。\n\n**引理**：如果 `p` 是奇素数且 `a` 是与 `p`\
    \ 互素的整数，则同余式 `x² ≡ a (mod m)` 要么无解，要么恰好有两个模 `p` 不合同的解。\n\n**证明**：如果 `x² ≡ a (mod\
    \ p)` 有解，设为 `x = x[0]`，则我们可以很容易地证明 `x = -x[0]` 是第二个不合同解，因为 `(-x[0])² = x[0]² ≡\
    \ a (mod p)`。\n\n**注**：`x[0] ≢ -x[0] (mod p)`（`2*x[0] ≡ 0 (mod p)`，这是不可能的，因为 `p\
    \ | x[0]`）。\n\n现在我们要证明不存在超过两个不合同的解。假设 `x = x[0]` 和 `x = x[1]` 都是 `x² ≡ a (mod\
    \ p)` 的解。`x[0]² ≡ a (mod p)` 且 `x[1]² ≡ a (mod p)`，则 `x[0]² - x[1]² ≡ 0 (mod p)`。`(x[0]+x[1])(x[0]-x[1])\
    \ ≡ 0 (mod p)`，即 `p | (x[0]+x[1])` 或 `p | (x[0]-x[1])`。`x[1] ≡ -x[0] (mod p)`\
    \ 或 `x[1] ≡ x[0] (mod p)`。\n\n**定理**：如果 `p` 是奇素数，则 `p` 恰有 `(p - 1)/2` 个二次剩余和 `(p\
    \ - 1)/2` 个二次非剩余。\n\n**证明**：考虑整数 `{1,2,…p−1}` 的所有平方。我们知道 `x² ≡ (p-x)² ≡ a (mod\
    \ p)`。设 `1 < b < p - 1`。`(p-b)² ≡ b² (mod p)`。\n\n```\n1², 2², …, ((p - 1)/2)²\
    \ ≡ ((p + 1)/2)², …, (p - 2)², (p - 1)²\n```\n\n(1.6)\n\n因为 `1² ≡ (p-1)² (mod\
    \ p)`，同理，式 (1.6) 中的其他元素之间也存在同样的关系。因此，`1², 2², …, ((p - 1)/2)²` 互不相同。\n\n#### 1.1.6.1\
    \ 欧拉判别法\n\n欧拉判别法精确地告诉我们整数 `a` 何时为模奇素数 `p` 的二次剩余。设 `p` 为奇素数且 `gcd(a,p) = 1`。当且仅当\
    \ `a^((p - 1)/2) ≡ 1 (mod p)` 时，`a` 是模 `p` 的二次剩余。\n\n**证明**：设 `a` 为二次剩余，则 `x²\
    \ ≡ a (mod p)`。`(x²)^((p - 1)/2) ≡ a^((p - 1)/2) (mod p)`。`x^(p - 1) ≡ a^((p -\
    \ 1)/2) (mod p)`。由费马小定理，`x^(p-1) ≡ 1 (mod p)`，因此，`a^((p - 1)/2) ≡ 1 (mod p)`。\n\
    \n**反之**：已知 `a^((p - 1)/2) ≡ 1 (mod p)`。证明：\"a\" 是模奇素数 `p` 的二次剩余。\n\n**证明**：我们知道存在模\
    \ `p` 的一个原根 `g`，使得 `ℤ[p]` 中的任意整数均可表示为 `g^(i) (mod p)`，`1 ≤ i ≤ p - 1`，且 `g^(m)\
    \ ≡ 1 (mod p)` 仅当 `p-1 | m`（`m=0` 或 `p-1`）时成立。对于某个 `1 ≤ i ≤ p - 1`，有 `a ≡ g^(i)\
    \ (mod p)`。`g^(i((p - 1)/2)) ≡ a^((p - 1)/2) ≡ 1 (mod p)`（已知）。由原根的性质 `p - 1 |\
    \ i((p - 1)/2)`；因此，`i` 必为偶数，设 `i = 2j`，这意味着 `a ≡ g^(2j) (mod p)`，`a ≡ (g^(j))²\
    \ (mod p)`。因此，`a` 是模奇素数 `p` 的二次剩余。\n\n### 1.1.7 勒让德符号\n\n这是一个方便的符号，用于指示整数 `a`\
    \ 是否为模奇素数 `p` 的二次剩余。`a (mod p)` 的勒让德符号记为 `(a/p)`。正式定义如下：\n\n```\n( a/p ) = { \
    \ 1,  若 a 是模 p 的非零二次剩余\n           { -1,  若 a 是模 p 的非零二次非剩余\n           {  0,\
    \  若 p | a\n```\n\n(1.7)\n\n示例：`(2/7) = 1`，`(2/5) = -1`，`(12/5) = -1`，`(101/97)\
    \ = 1`，`(97/101) = 1`。\n\n如果 `p` 除 `a` 有余数，即 `a = q*p + r`，则 `(a/p) = (r/p)`。由欧拉判别法，`a^((p\
    \ - 1)/2) ≡ (a/p) (mod p)`。\n\n#### 1.1.7.1 二次互反律\n\n二次互反律关联了两个勒让德符号 `(p/q)` 和\
    \ `(q/p)`，其中 `p` 和 `q` 为奇素数：\n\n```\n( p/q ) ( q/p ) = (-1)^(((p - 1)/2) * ((q\
    \ - 1)/2))\n```\n\n(1.8)\n\n"
