- raw: "To prove the security of the cryptosystems, we need a formal security model\
    \ which must specify the interaction mechanism followed by an adversary/attacker\
    \ to interact with the legitimate users of that cryptosystem. Further, it must\
    \ specify what the adversary should achieve to break the cryptosystem \\[[11](#02chap_02.xhtml#ref2_11)\\\
    ]. For example: In an encryption system the adversary may want to find the ciphertext\
    \ of the messages of her choice by using something called the encryption oracle;\
    \ this represents the interaction made by the adversary with the cryptosystem.\
    \ Secondly, in order to break the cryptosystem, the adversary must correctly identify\
    \ that the challenge ciphertext (for which the adversary has never queried before)\
    \ is the encryption of the plaintext message earlier chosen by the adversary.\n\
    \n#### [2.3.1.2 Security goals of a public-key cryptosystem](#contents.xhtml#rsec2_3_1_2)\n\
    \nFor any public-key encryption scheme, the following security goals must be kept\
    \ in mind while designing a cryptosystem:\n\n*   Indistinguishability of encryptions/ciphertexts:\
    \ This is also known as semantic security and it states that given the encryption\
    \ of two messages or two ciphertexts, the adversary should not be able to distinguish\
    \ between them. Simply, we can say that given a challenge ciphertext, the adversary\
    \ should not be able to get any information about the underlying plaintext.\n\n\
    *   Non-malleability: It requires that given the challenge ciphertext, the adversary\
    \ should not be able to convert it into another valid ciphertext such that the\
    \ plaintexts of these two ciphertexts are meaningfully related to each other.\n\
    \n#### [2.3.1.3 Security attacks on a public-key cryptosystem](#contents.xhtml#rsec2_3_1_3)\n\
    \nDepending upon the level of facilities provided to an adversary, the attacks\
    \ on public-key cryptosystems are divided into three main categories:\n\n*   Chosen-plaintext\
    \ attack (CPA): The facility given here is that the adversary knows the public\
    \ key. The public key can be used to just encrypt the messages of her choice and\
    \ the cryptography community says that the adversary has access to the encryption\
    \ oracle. Later, the adversary chooses two messages of her choice, called challenge\
    \ messages, which she sends to the challenger. The challenger then returns the\
    \ challenge ciphertext to the adversary. Now, we say that a public-key cryptosystem\
    \ is secure under CPA if it is hard for the adversary to relate the challenge\
    \ ciphertext with its underlying plaintext. The restriction on the adversary is\
    \ that she cannot generate the ciphertexts (have access to the encryption oracle)\
    \ for the challenge messages of her choice. Here, we have restricted the power\
    \ of adversary to the maximum extent. But in practice, the adversary can have\
    \ much more power and thus CPA secure schemes may not be secure in practical scenarios.\n\
    \n*   Non-adaptive chosen-ciphertext attack (CCA1): Here, the power of the adversary\
    \ is increased by providing her access to the decryption oracle in addition to\
    \ the facilities provided in CPA security. She can use it to get the decryption\
    \ of ciphertexts of her choice. However, a restriction has been placed on when\
    \ she can use the decryption oracle. Here, the adversary can use the decryption\
    \ oracle only before the challenge ciphertext is produced.\n\n*   Adaptive chosen-ciphertext\
    \ attack (CCA2): The restrictions of CCA1 security are completely relaxed and\
    \ now the adversary can have access to the decryption oracle even after she gets\
    \ the challenge ciphertext. But the obvious restriction remains that she cannot\
    \ query the decryption oracle for the challenge ciphertext.\n\nThe public-key\
    \ encryption schemes which are indistinguishable under CCA2 are assumed to be\
    \ most secure. The reason is obvious because here the adversary can operate with\
    \ full power and yet she cannot distinguish that the challenge ciphertext is the\
    \ encryption of which two challenge messages generated by her.\n\nMathematically,\
    \ this whole definition of IND-CCA2 (indistinguishability against CCA2) can be\
    \ modeled as a game between the challenger, \U0001D49E, and an adversary, \U0001D49C\
    \ as follows:\n\n*   Setup: \U0001D49E runs *K**G*(*λ*)→(*p**k*,*s**k*), keeps\
    \ *s**k* and gives *p**k* to \U0001D49C.\n\n*   Phase 1: \U0001D49C^(*D*)(*p**k*,*C*)→*m*\
    \ and outputs two messages {*m*[0],*m*[1],*s**t**a**t**e* } of her choice but\
    \ she had not queried decryption oracle for them. \U0001D49C^(*D*) denotes adversary's\
    \ access to decryption oracle.\n\n*   Challenge: \U0001D49E selects {0,1}→*b*,\
    \ and runs encryption algorithm to get challenge ciphertext, *E*(*p**k*,*m*[*b*])→*C*^(\\\
    *).\n\n*   Phase 2: \U0001D49C^(*D*)(*p**k*,*C*)→*m* but *C* ≠ *C*^(\\*).\n\n\
    *   Guess: \U0001D49C(*C*^(\\*),*m*[0],*m*[1],*s**t**a**t**e*)→*b*′.\n\nAdversary\
    \ wins the game if *b*^′ = *b*, i.e. when its guess is correct. Since there are\
    \ two messages, therefore with a probability of $\\\\frac{1}{2}$, anyone can guess.\
    \ Hence, we need to subtract this probability from the total probability of correctly\
    \ guessing *b* and this is known as the adversary's advantage, *A**d**v*[\U0001D49C\
    ]^(*I**N**D* − *C**C**A*2) against IND-CCA2.\n\n$${Adv}\\_{\\\\mathcal{A}}^{IND\
    \ - CCA2}\\\\left( \\\\lambda \\\\right) = \\\\left| {Pr\\\\left\\\\lbrack {b^{'}\
    \ = b} \\\\right\\\\rbrack - \\\\frac{1}{2}} \\\\right|$$  \n\n(2.1)\n\nThe cryptosystem\
    \ is said to be secure against CCA2 attack if the advantage of the adversary in\
    \ winning the game is negligible.\n\n#### [2.3.1.4 ElGamal cryptosystem](#contents.xhtml#rsec2_3_1_4)\n\
    \nThe ElGamal encryption was invented in 1985 by Taher ElGamal \\[[12](#02chap_02.xhtml#ref2_12)\\\
    ] and it is very similar to the Diffie–Hellman key-exchange algorithm with a slight\
    \ reordering of steps as shown in [Figure 2.3](#02chap_02.xhtml#fig2_3).\n\n![Figure\
    \ 2.3ElGamal cryptosystem.](images/fig2_3.jpg)\n\n*Figure 2.3*ElGamal cryptosystem.\n\
    \nHere, the key *K*[*E*] is called the ephemeral key and exists only for a short\
    \ duration, i.e. when Alice wants to send some new message then at that time a\
    \ different *i* value is selected which will result in a different ephemeral key.\
    \ The key *K*[*M*] is called the session key, which is just like the key *K*[*A**B*]\
    \ in the DH key-exchange algorithm. The ElGamal encryption scheme is a probabilistic\
    \ encryption scheme unlike the schoolbook RSA encryption scheme and this feature\
    \ comes into the picture by choosing a random *i* value every time the encryption\
    \ algorithm is called, whereas in RSA the encryption of the same message is always\
    \ fixed.\n\n*Correctness Proof*: Bob computes, *Y* ⋅ *K*[*M*]^( − 1)*m**o**d**p* = *X* ⋅ *K*[*M*] ⋅ (*K*[*E*]^(*d*))^( − 1)*m**o**d**p* = *X* ⋅ *β*^(*i*) ⋅ (*α*^(*i*))^( − *d*)*m**o**d**p* = *X**m**o**d**p*.\n\
    \nWe will present the detailed security analysis of this scheme in [Chapter 4](#04chap_04.xhtml)\
    \ where we will discuss provable security in detail.\n\n## [2.4 GENERALIZATIONS\
    \ IN PUBLIC-KEY CRYPTOGRAPHY](#contents.xhtml#rsec2_4)"
