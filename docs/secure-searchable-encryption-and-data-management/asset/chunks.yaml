     = 5 ⋅ 427 − 16 ⋅ 133\n\n = 5 ⋅ 427 − 16(560−427)\n\n = 21 ⋅ 427 − 16 ⋅ 560\n\n\
     = 21(1547−2⋅560) − 16 ⋅ 560\n\n = 21 ⋅ 1547 + (−58) ⋅ 560\n\nThe extended Euclid\
    \ algorithm has application in finding the multiplicative inverse.\n\n### [1.1.4\
    \ Congruence](#contents.xhtml#rsec1_1_4)\n\nIf an integer *m* divides the difference\
    \ *a* − *b*, then we say *a* is congruent to *b**m**o**d**m*, i.e. *a* ≡ *b* *m**o**d**m*  \
    \ iff  *m*|*a*−*b* \\[[2](#01chap_01.xhtml#ref1_2)\\], \\[[3](#01chap_01.xhtml#ref1_3)\\\
    ].\n\n#### [1.1.4.1 Congruence relation properties](#contents.xhtml#rsec1_1_4_1)\n\
    \nThe following are the key properties of congruence:\n\n*   If *a* ≡ *b*(*m**o**d**m*) \
    \ and   *c* ≡ *d*(*m**o**d**m*), then *a* ± *c* ≡ (*b*±*d*)*m**o**d**m*   and\
    \  *a**c* ≡ *b**d**m**o**d**m*.\n\n*   If *a* ≡ *b*(*m**o**d**m*)  and   *b* ≡ *c*(*m**o**d**m*),\
    \ then *a* ≡ *c*(*m**o**d**m*).\n\n*   If *a* ≡ *b*(*m**o**d**m*), *b* ≡ *a*(*m**o**d**m*)\
    \ and *a* − *b* ≡ 0(*m**o**d**m*) are equivalent.\n\n*   If *a* ≡ *b*(*m**o**d**m*)\
    \ and *d*|*m*, *d* > 0 then *a* ≡ *b*(*m**o**d**d*).\n\n*   If *a* ≡ *b*(*m**o**d**m*)\
    \ then *a**c* ≡ *b**c*(*m**o**d**m**c*) for *c* > 0.\n\n*   If *a* ≡ *b**m**o**d**m*,\
    \ *a* ≡ *b**m**o**d**n* and *m, n* are relatively prime then *a* ≡ *b**m**o**d**m**n*.\n\
    \n*   Congruence modulo *n* is an equivalence relation on Z.\n\n    *   Reflexive:\
    \ *a* ≡ *a**m**o**d**n* ∀*a* ∈ *Z*\n\n    *   Symmetry: If *a* ≡ *b**m**o**d**n* *t**h**e**n* *b* ≡ *a**m**o**d**n*\n\
    \n    *   Transitive: If *a* ≡ *b**m**o**d**n* *a**n**d* *b* ≡ *c**m**o**d**n* *t**h**e**n* *a* ≡ *c**m**o**d**n*\n\
    \nThe proof of these properties can be done with the help of the definition of\
