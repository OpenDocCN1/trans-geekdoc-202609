- raw: "A formalization of the transformation mechanism from anonymous IBE to PEKS\
    \ scheme was given by Abdalla et al. \\[[10](#05chap_05.xhtml#ref5_10)\\]. They\
    \ formally proved the consistency of the resulting scheme. Further, they proposed\
    \ the following extensions to the basic idea: *i*) added a HIBE (anonymous hierarchical\
    \ IBE) to the searchable encryption transformation, and *i**i*) added the concept\
    \ of temporary keyword search. The temporary keyword search prevents the server\
    \ from learning about the past and future keyword ciphertexts once the server\
    \ has received the trapdoor. Hence, even if the server memorizes the trapdoor\
    \ it cannot find the link between the trapdoor and the keyword ciphertext. This\
    \ was achieved by limiting the duration for which the trapdoor is valid.\n\n####\
    \ [5.2.1.2 PEFKS](#contents.xhtml#rsec5_2_1_2)\n\nAn instantiation of the transformation\
    \ mechanism was first given by Xu et al \\[[11](#05chap_05.xhtml#ref5_11)\\].\
    \ For demonstration purposes they have used an IBE scheme by Boneh and Franklin\
    \ \\[[12](#05chap_05.xhtml#ref5_12)\\]. Further, they have developed a method\
    \ to make their scheme immune to KGA. In their method, they divided the trapdoor\
    \ into fuzzy and exact trapdoors such that two or more keywords share the same\
    \ fuzzy trapdoor. When the receiver wanted to search something then he/she would\
    \ send the fuzzy trapdoor to the cloud server. The cloud server could not guess\
    \ the keyword even if had the fuzzy trapdoor for all the keywords, which resulted\
    \ in a scheme which was immune to KGA. To construct the fuzzy trapdoor, they used\
    \ a fuzzy function which returned the same fuzzy value for every two keywords\
    \ if the keyword space was even. If the keyword space was odd, then the last three\
    \ keywords had the same fuzzy value and for the rest of the keywords every two\
    \ keywords had the same fuzzy value. Therefore, with a probability of 1/2 or 1/3\
    \ the malicious cloud server could still guess the keyword associated with the\
    \ search trapdoor. Hence, to a make a scheme more secure against KGA there is\
    \ a need to further reduce this probability and this was achieved by designing\
    \ a fuzzy function which used the modulus operator and the concept of congruence\
    \ class \\[[13](#05chap_05.xhtml#ref5_13)\\]. They designed their fuzzy function\
    \ such that *k* keywords share the same fuzzy trapdoor, thus reduced the keyword\
    \ guessing probability to 1/*k* and hence improved the security against KGA.\n\
