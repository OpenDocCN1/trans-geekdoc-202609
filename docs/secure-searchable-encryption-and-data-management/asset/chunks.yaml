    | 编号 | 假设名称 | 描述 |

    | :--- | :--- | :--- |

    | 22 | `q-weak Bilinear Diffie–Hellman Inversion (q-wBDHI) Assumption` | Given
    `G`, `G[T]`, `e`, `{g[i]^(x), g[i]^(x²), …, g[i]^(x^(q)), g[j]^(y)}[i ∈ {1, 2}]`,
    it is hard to find `e(g[1], g[2])^(x^(q+1)y)` [[24]](#04chap_04.xhtml#ref4_24).
    |

    | 23 | `q-weak Bilinear Decision Diffie–Hellman Inversion (q-wDBDHI) Assumption`
    | Given `G`, `G[T]`, `e`, `{g[i]^(x), g[i]^(x²), …, g[i]^(x^(q)), g[j]^(y)}[i
    ∈ {1, 2}]`, `X ∈ G[T]`, it is hard to determine if `X = e(g[1], g[2])^(x^(q+1)y)`
    [[24]](#04chap_04.xhtml#ref4_24). |

    | 24 | `Multi-Sequence of Exponents Diffie–Hellman (MSEDH) Assumption` | Given
    `e: G[1]×G[2]→G[T]`, `g[0]`, `h[0]` be the generators of group `G[1]`, `G[2]`
    respectively, `l`, `m`, `t` be three integers and `f`, `g` be two co-prime polynomials
    of order `l`, `m` respectively and the following exponentiations: `g[0]`, `g[0]^(α)`,
    …, `g[0]^(α^(l+t−2))`, `g[0]^(kγf(α))`; `g[0]^(γ)`, `g[0]^(αγ)`, …, `g[0]^(γα^(l+t))`;
    `h[0]`, `h[0]^(α)`, …, `h[0]^(α^(m−2))`; `h[0]^(γ)`, `h[0]^(αγ)`, …, `h[0]^(γα^(2m−1))`;
    `h[0]^(kg(α))`, `T ∈ G[T]`. It is hard to decide if `T = e(g[0], h[0])^(kf(α))`
    [[25]](#04chap_04.xhtml#ref4_25). |

    | 25 | `Truncated decisional augmented Bilinear Diffie–Hellman (q-ABDHE) Assumption`
    | Given `g`, `g^(x)`, `g^(x²)`, ⋯, `g^(x^(q))`, `g^(zx)`, `g^(zx^(q+2)) ∈ G` and
    `e(g,g)^(zx^(q+1))`, `X ∈ G[T]` where `x`, `z ∈ Z[p]`, it is hard to determine
