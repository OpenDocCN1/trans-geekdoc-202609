    it is hard to determine if *h*[*j*] = *g*[*j*]^(*x**y*) \[[18](#04chap_04.xhtml#ref4_18)\].
    It signifies that DDH is hard in both the groups. |


    | 15. || *Knowledge of Exponents Assumption (KEA)* || If on input *g* and *g*^(*x*)
    𝒜 ouputs (*Z*,*C*) : *C* = *Z*^(*x*) then there exists an extractor which on same
    input returns *z* : *g*^(*z*) = *Z* \[[19](#04chap_04.xhtml#ref4_19)\]. |


    | 16. || *Bilinear Diffie–Hellman (BDH) Assumption* || Given *g*, *g*^(*x*), *g*^(*y*)
    and *g*^(*z*) ∈ *G*, it is hard to find *e*(*g*,*g*)^(*x**y**z*) \[[20](#04chap_04.xhtml#ref4_20)\].
    |


