    \ send the same message to multiple recipients, we need to encrypt the same message\
    \ multiple times with the public key of each recipient and this leads to a lot\
    \ of redundancy in the system. Since we want an efficient mechanism, there is\
    \ a need to explore other cryptographic primitives like attribute-based encryption\
    \ (ABE) which may possibly resolve this redundancy and we will discuss such schemes\
