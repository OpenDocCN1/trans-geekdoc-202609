- raw: 'WITH THE ADVENT OF THE IT REVOLUTION, the volume of data produced has increased
    exponentially and is still showing an upward trend. This data may be abundant
    and enormous but it''s a precious resource and should be managed properly. Cloud
    technology plays an important role in data management. Storing data in the cloud
    rather than on local storage has many benefits, but apart from these benefits
    there are privacy concerns in storing sensitive data over third-party servers;
    these concerns can be addressed by storing data in an encrypted form. However,
    while encryption solves the problem of privacy it engenders other serious issues,
    including the infeasibility of the fundamental search operation and a reduction
    in flexibility when sharing the data with other users, amongst others. The concept
    of searchable encryption addresses these issues. This book covers the origin and
    essential mathematical background required to understand and develop searchable
    encryption schemes. It includes chapters that provide an extensive classification
    of searchable encryption schemes in both symmetric-key and public-key settings.
    These chapters describe the searchable encryption schemes under each category
    based on their features, security and efficiency. Further, the authors have performed
    a comparative study of searchable encryption schemes under each category by computing
    the computational as well as the storage costs. Different tools, libraries and
    datasets used for the development of searchable encryption schemes are also covered.
    The book also discusses inter-domain applications of searchable encryption schemes.
    Finally, it casts light upon open research challenges and future research directions
    to guide researchers and practitioners for further evolution of this field.


    This book is designed for readers with an interest in the field of security, particularly
    those who want to work on ensuring confidentiality while performing operations
    on encrypted data. This includes researchers who are exploring the pros and cons
    associated with the technology and developers and security professionals who are
    focusing on developing secure searchable encryption schemes that can have applications
    in variety of areas.


    Specifically, this book contains seven chapters, a detailed overview of the topics
    covered by each chapter is summarized as follows:


    **[Chapter 1](#01chap_01.xhtml): Introduction to number theory and abstract algebra**
    – This chapter introduces the fundamentals of number theory and abstract algebra
    as preliminary knowledge required to understand any cryptographic algorithm.


    **[Chapter 2](#02chap_02.xhtml): Introduction to cryptography** – This chapter
    covers the basic concepts related to cryptography. It briefly discusses both traditional
    and the modern cryptography along with the journey from traditional to modern
    cryptography. It describes the cryptographic principles and the key terms in detail
    so as to build a strong background.


    **[Chapter 3](#03chap_03.xhtml): Searchable encryption and data management** –
    This chapter formally introduces the concept of searchable encryption as a data
    management technique. It explains the need of such a technique and how this technique
    can be used to solve the problem of confidentiality and efficient retrieval of
    desired information out of the encrypted data without breaching the confidentiality.
    This chapter discusses the broad categories of searchable encryption depending
    upon the underlying encryption technique. It also explains which underlying encryption
    technique can provide more benefits to its users in different scenarios.


    **[Chapter 4](#04chap_04.xhtml): Introduction to provable security and its application
    in searchable encryption** – This chapter introduces the concept of provable security
    and its application in developing a secure searchable encryption. This chapter
    gives the basic security definitions used in searchable encryption and also explains
    the different security models that can be employed to prove security for a searchable
    encryption scheme. Moreover, this chapter provides an introduction to cryptographic
    assumptions used in provable security and cites the commonly used assumptions
    in searchable encryption.


    **[Chapter 5](#05chap_05.xhtml): Searchable encryption in a public-key setting**
    – This chapter explains in detail the concept of searchable encryption in a public-key
    setting. It provides the general structure of the searchable encryption scheme
    in an asymmetric-key setting. Further, this chapter compares the existing schemes
    in literature in this setting and also discusses possible scope for improvement.


    **[Chapter 6](#06chap_06.xhtml): Design and development tools and inter-domain
    applications** – This chapter discusses different open-source tools for the design
    and development of secure searchable encryption schemes. Further, it discusses
    the inter-domain application of searchable encryption and how this technique plays
    an important role in different domains.


    **[Chapter 7](#07chap_07.xhtml): Searchable encryption applications, challenges
    and future research directions** – This chapter highlights the open challenges
    associated with searchable encryption and provides an insight of the future research
    directions in the field.


    # [Acknowledgements](#contents.xhtml#rack1)


    First of all, we would like to pay our gratitude to God by bowing our heads for
    lavishing us with continuous blessings and enthusiasm for completing this book.
    Writing a book is not a work of an individual, but it is the outcome of the incessant
    support of our loved ones. This book is the result of inestimable hard work, continuous
    efforts and the assistance of loved ones. Therefore, we would like to express
    our gratefulness to everyone linked to this book, either directly or indirectly,
    for their exquisite cooperation and creative ideas for ameliorating the quality
