    6.  P. Priyadarshinee, "Cloud computing adoption: Scale development, measurement
    and validation," Int. J. Cloud Appl. Comput, vol. 8, no. 1, pp. 97–116, 2018.

    7.  R. L. Krutz, and R. D. Vines, *Cloud Security: A Comprehensive Guide to Secure
