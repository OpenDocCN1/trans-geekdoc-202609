    ## [4.4 SECURITY/COMPLEXITY ASSUMPTIONS AND PROOF STRATEGIES](#contents.xhtml#rsec4_4)


    The security of searchable encryption schemes is generally proved by embedding
    the security assumptions into their construction. Security assumptions are well-known
    hard problems in cryptography. By the reduction approach we reduce our scheme
    to these hard problems and claim the security of the scheme by that fact that
    if we cannot break these hard problems then one cannot break our scheme. The security
    assumptions are broadly categorized into weak and strong assumptions \[[9](#04chap_04.xhtml#ref4_9)\].
    Weak assumptions ensure security as close as to discrete logarithm (DL) assumption
    and are also called the standard assumptions. The computational Diffie–Hellman
    (CDH) assumption is an example of a weak assumption. These are referred to as
    weak in terms of the time it takes to break these assumptions, which is significantly
    higher than the strong assumptions. Hence, weak assumptions are hard to break
    as compared to strong assumptions. Strong assumptions are those assumptions whose
    security levels are lower as compared to the DL assumption. Strong assumptions
    are relatively risky and unreliable \[[9](#04chap_04.xhtml#ref4_9)\]. The commonly
    used security assumptions in literature for developing searchable encryption schemes
    are given in [Table 4.1](#04chap_04.xhtml#tbl4_1).


    *Table 4.1* Commonly used security assumption in the construction of searchable
    encryption schemes


    | S.No. || Security assumption || Description |


    | --- | --- | --- |


    |  1. || *Discrete Logarithm (DL) Assumption* || Given *h* ∈ *G*, it is hard to
    find *x* : *h* = *g*^(*x*) \[[10](#04chap_04.xhtml#ref4_10)\]. |


    | --- | --- | --- |


    |  2. || *Computational Diffie–Hellman (CDH) Assumption* || Given *g*^(*x*) ∈ *G*
    and *g*^(*y*) ∈ *G*, it is hard to find *g*^(*x**y*) \[[11](#04chap_04.xhtml#ref4_11)\].
    |


    |  3. || *Decision Diffie–Hellman (DDH) Assumption* || Given *g*^(*x*) ∈ *G*,
    *g*^(*y*) ∈ *G* and *h* ∈ *G*, it is hard to determine if *h* = *g*^(*x**y*) or
    not. \[[12](#04chap_04.xhtml#ref4_12)\]. |


    |  4. || *Parallel Decisional Diffie–Hellman (pDDH) Assumption* || Given *g*^(*x*[1]), *g*^(*x*[2]),  ⋅  ⋅ ⋅,*g*^(*x*[*n*]), *h*[1], *h*[2],  ⋅  ⋅ ⋅,*h*[*n*] ∈ *G*,
    it is hard to determine if *h*[1] = *g*^(*x*[1]*x*[2]), *h*[2] = *g*^(*x*[2]*x*[3]),  ⋅  ⋅ ⋅,*h*[*n* − 1] = *g*^(*x*[*n* − 1]*x*[*n*]), *h*[*n*] = *g*^(*x*[*n*]*x*[1])
    or not \[[12](#04chap_04.xhtml#ref4_12)\]. |


    |  5. || *q-Diffie–Hellman Inversion (q-DHI) Assumption* || Given *g*^(*x*), *g*^(*x*²),  ⋅  ⋅ ⋅,*g*^(*x*^(*q*)) ∈ *G*,
    it is hard to compute $g^{\\frac{1}{x}}$ \[[13](#04chap_04.xhtml#ref4_13)\], \[[14](#04chap_04.xhtml#ref4_14)\].
    |


    |  6. || *q-Decision Diffie–Hellman Inversion (q-DDHI) Assumption* || Given *g*^(*x*), *g*^(*x*²),  ⋅  ⋅ ⋅,*g*^(*x*^(*q*)), *h* ∈ *G*,
    it is hard to determine if $h = g^{\\frac{1}{x}}$ \[[13](#04chap_04.xhtml#ref4_13)\].
    |


    |  7. || *Linear Assumption* || Given *g*^(*u*), *g*^(*v*), *g*^(*x**u*), *g*^(*y**v*) ∈ *G*;
    it is hard to find *g*^(*x* + *y*) ∈ *G* \[[15](#04chap_04.xhtml#ref4_15)\]. |


    |  8. || *q-Linear Assumption* || Let *g*[1], *g*[2],  ⋅  ⋅ ⋅,*g*[*q*], *g*[0]
    be the generators of group *G*. Given *g*[1], *g*[2],  ⋅  ⋅ ⋅,*g*[*q*], *g*[0], *g*[1]^(*x*[1]), *g*[2]^(*x*[2]),  ⋅  ⋅ ⋅,*g*[*q*]^(*x*[*q*]) ∈ *G*;
    it is hard to find *g*[0]^(*x*[0]) where $x\_{0} = {\\sum\\limits\_{i = 1}^{q}x\_{i}}$
    \[[15](#04chap_04.xhtml#ref4_15)\]. |


    |  9. || *Decision Linear (DLIN) Assumption* || Given *g*^(*u*), *g*^(*v*), *g*^(*x**u*), *g*^(*y**v*), *h* ∈ *G*;
    it is hard to determine if *h* = *g*^(*x* + *y*). This assumption is used in place
    of DDH particularly in Bilinear groups where DDH is no more a hard assumption
    \[[15](#04chap_04.xhtml#ref4_15)\]. |


    | 10. || *q-Decision Linear (q-DLIN) Assumption* || Let *g*[1], *g*[2],  ⋅  ⋅ ⋅,*g*[*q*], *g*[*q* + 1]
    be the generators of group *G*. Given *g*[1], *g*[2],  ⋅  ⋅ ⋅,*g*[*q*], *g*[*q* + 1], *g*[1]^(*x*[1]), *g*[2]^(*x*[2]),  ⋅  ⋅ ⋅,*g*[*q*]^(*x*[*q*]), *h* ∈ *G*;
    it is hard to determine if $h = g\_{q + 1}^{\\sum\\limits\_{i = 1}^{q}x\_{i}}$
    \[[15](#04chap_04.xhtml#ref4_15)\]. |


    | 11. || *q-Strong Diffie–Hellman (q-SDH) Assumption* || Given *g*^(*x*), *g*^(*x*²),  ⋅  ⋅ ⋅,*g*^(*x*^(*q*)) ∈ *G*,
    it is hard to find *u* ∈ *Z*[*p*] and $g^{\\frac{1}{x + u}}$ \[[13](#04chap_04.xhtml#ref4_13)\].
    |


    | 12. || *Diffie–Hellman Exponent (DHE) Assumption* || Given *g*[0], *g*[1], *g*[2],  ⋅  ⋅ ⋅,*g*[*q*], *g*[*q* + 2],  ⋅  ⋅ ⋅,*g*[2*q*] ∈ *G*,
    where *g*[*i*]|[1 ≤ *i* ≤ 2*q*, *i* ≠ *q* + 1] = *g*^(*x*^(*i*)), it is hard to
    find *g*[*q* + 1] = *g*^(*x*^(*i* + 1)) \[[16](#04chap_04.xhtml#ref4_16)\]. |


    | 13. || *Hash Diffie–Hellman (HDH) Assumption* || Let *H*:{0,1}^(\*)→{0,1}^(*l**e**n*)
    be a hash function which returns a binary string of length say *l**e**n*. Given
    *g*, *g*^(*x*), *g*^(*y*), *H*(*g*^(*x**y*)), *Z* = {0,1}^(*l**e**n*); it is hard
    to find if *Z*\= *H*(*g*^(*x**y*)) \[[17](#04chap_04.xhtml#ref4_17)\]. |


