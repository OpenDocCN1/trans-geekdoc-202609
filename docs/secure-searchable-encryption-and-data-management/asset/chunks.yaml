    ## FSG2^+


    A PEKS variant was proposed by Fang et al. [[36]](#03chap_03.xhtml#ref3_36) with
    the features that it did not need a secure channel and it also provided security
    against KGA. In earlier schemes the same goal was achieved but they needed a random
    oracle model to prove the security of their scheme. But this scheme was proved
    to be secure with a standard model. They used Gentry''s IBE scheme [[30]](#03chap_03.xhtml#ref3_30)
    as an underlying encryption technique for the construction.


    ## LLZ^+


    Recently Lu et al. [[37]](#03chap_03.xhtml#ref3_37) proposed a searchable public-key
    encryption using certificate-based cryptography and signcryption to provide security
    against KGA as well as to remove the need of a secure channel between receiver
    and server. This scheme does not need a secure channel and also provides security
    against KGA. The proposed scheme also proved to be secure in the standard model.


    The comparative analysis of the storage and computational cost of the above discussed
    schemes is given in [Table 3.3](#03chap_03.xhtml#tbl3_3).


    ### Table 3.3 Comparative analysis of the storage and computational cost of PEKS
    and its extensions


    | Scheme | Storage cost | Computational cost |

    | --- | --- | --- |

    | **PEKS: Boneh et al.** [[24]](#03chap_03.xhtml#ref3_24) | Encrypted Index: `1|G|
    + |{0,1}^(λ)|` | `1P + 2E + 2H` |

    |  | Trapdoor: `1|G|` | `1E + 1H` |

    |  | Search | `1P + 1H` |

    | **Secure channel-free (SCF) PEKS** |  |  |

    | **Baek et al.** [[27]](#03chap_03.xhtml#ref3_27) | Encrypted Index: `1|G| +
    |{0,1}^(λ)|` | `1P + 1E + 1E[T] + 2H` |

    |  | Trapdoor: `1|G|` | `1E + 1H` |

    |  | Search | `1P + 2E + 1H` |

    | **Gu et al.** [[28]](#03chap_03.xhtml#ref3_28) | Encrypted Index: `1|G| + |{0,1}^(λ)|`
    | `3E + 2H` |

    |  | Trapdoor: `1|G|` | `1E + 1H` |

    |  | Search | `1P + 1H` |

    | **Fang et al.** [[29]](#03chap_03.xhtml#ref3_29) | Encrypted Index: `2|G| +
    2|G[T]|` | `3P + 3E + 3E[T] + 1H` |

    |  | Trapdoor: `1|G| + 1|Z[p]|` | `2E` |

    |  | Search | `2P + 2E + 2E[T] + 1H` |

    | **Rhee et al.** [[31]](#03chap_03.xhtml#ref3_31) | Encrypted Index: `1|G| +
    |{0,1}^(λ)|` | `7P + 2E + 2H` |

    |  | Trapdoor: `1|G|` | `1E + 1H` |

    |  | Search | `1P + 1E + 1H` |

    | **PEKS secure against KGA** |  |  |

    | **Tang and Chen** [[34]](#03chap_03.xhtml#ref3_34) | Encrypted Index: `1|G|
    + 1|G[T]|` | `1P + 2E` |

    |  | Trapdoor: `1|G|` | `1E + 1H` |

    |  | Search | `1P` |

    | **SCF-PEKS with KGA security** |  |  |

    | **Rhee et al.** [[35]](#03chap_03.xhtml#ref3_35) | Encrypted Index: `1|G| +
    |{0,1}^(λ)|` | `1P + 2E + 2H` |

    |  | Trapdoor: `2|G|` | `3E + 2H` |

    |  | Search | `1P + 2E + 2H` |

    | **Fang et al.** [[36]](#03chap_03.xhtml#ref3_36) | Encrypted Index: `|VK| +
    1|G[1]| + 2|G[2]| + 2|G[T]| + |σ|` | `3P + 8E + 1H + 1𝒮` |

    |  | Trapdoor: `1|G[1]| + 1|Z[p]|` | `1E` |

    |  | Search | `4P + 2E + 1E[T] + 1H + 1V` |

    |  | Trapdoor: `1|G|` | `3E + 2H` |

    |  | Search | `1P + 1E[T] + 1H` |

    | **Lu et al.** [[37]](#03chap_03.xhtml#ref3_37) | Encrypted Index: `1|G| + |{0,1}^(λ)|`
    | `1P + 3E + 1E[T] + 3H` |

    |  | Trapdoor: `1|G|` | `3E + 2H` |

    |  | Search | `1P + 1E[T] + 1H` |


    Notations used in [Table 3.3](#03chap_03.xhtml#tbl3_3) are given in [Table 3.4](#03chap_03.xhtml#tbl3_4).


    ### Table 3.4 Notations used in comparative analysis along with their description


    | Notation | Description |

    | --- | --- |

    | `|G|`, `|G[T]|` | Length of source (`G`) and target group (`G[T]`) elements
    respectively in case of symmetric bilinear pairing |

    | `|G[1]|`, `|G[2]|`, `|G[T]|` | Length of source (`G[1]`,`G[2]`) and target group
    (`G[T]`) elements respectively in case of asymmetric bilinear pairing |

    | `|σ|` | Length of signature |

    | `|VK|` | Length of verification key |

    | `|{0,1}^(λ)|` | Binary string of length, `λ`, where `λ` is the security parameter
    of the particular scheme |

    | `|Z[p]|` | Length of an element of a group of integers of prime order, `p` |

    | `|F[p]|` | Length of an element of a field of prime order, `p` |

    | `P` | Bilinear pairing operation |

    | `E`, `E[T]` | Exponent operation in source and target group respectively |

    | `H` | Collision resistant one-way hash function |

    | `𝒮` | Sign operation |

    | `V` | Verification operation |

    | `Poly`, `k` | A polynomial of degree, `k` |


    The storage cost is computed in terms of size and the number of group elements.
    We consider the storage cost of only encryption and the trapdoor algorithm because
    in these algorithms we need to store their output, i.e. the ciphertext and the
    trapdoor at the cloud server and the user''s device respectively; in the search
    algorithm no such cost is computed. The computational cost is computed in terms
    of number of operations performed by an algorithm. It is computed for the search
    algorithm also. There may be different types of operations performed by an algorithm
    like the hash operation, exponent operation, pairing operation; among them pairing
    is the most expensive operation. Therefore, we should try to build schemes which
    takes a constant number of pairing operations. If in the search algorithm we are
    able to make the number of pairing operations constant, then we say that the searchable
    encryption scheme supports fast search.


    ## 3.4 CHAPTER SUMMARY


    This chapter formally introduced the concept of searchable encryption and clearly
    stated the need of such a technique and how this technique can be used to solve
    the problem of confidentiality and efficient retrieval of desired information
    out of the encrypted data without breaching confidentiality. We have also discussed
    the two broad categories of searchable encryption depending upon the underlying
    encryption technique and discussed the pioneering work under both the categories.
    Further, efforts have been made to clearly state which underlying encryption technique
    can provide more benefits to its users under what scenario.


