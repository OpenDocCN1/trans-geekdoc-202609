    | :--- | :--- | :--- | :--- | :--- |

    | Zheng et al. [[21]](#05chap_05.xhtml#ref5_21) | `3*N*E + N*H(2*ξ+1)*G` | `(ξ+4)*E
    + ξ*H` | `(2*N+2)*E` | `(2*ξ+2)*P + ξ*E[T]` |

