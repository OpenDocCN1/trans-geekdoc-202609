- raw: 'Further, to remove the secure channel Baek et al. \[[27](#03chap_03.xhtml#ref3_27)\]
    used a public-private key pair (PK,SK) for the server. In addition to the PEKS
    algorithms, SCF\_PEKS possesses an extra algorithm for generating the key pair
    for the server. To generate the keyword ciphertext they will use the public key
    of the receiver as well as the public key of the server. To generate the ciphertext
    the SCF\_PEKS scheme will use the secret key of the receiver like in the PEKS
    scheme. Finally, there is a slight difference in the search algorithm; in addition
    to the keyword ciphertext and trapdoor, it takes the secret key of the server
    to ensure security from an outside attacker.


    They ensured security from a malicious server as well as an outside attacker.
    The malicious server cannot distinguish between the ciphertext of two keywords
    until it has the trapdoor for that keyword. Similarly, the outside attacker cannot
    distinguish between ciphertext of two keywords even if he has the trapdoor of
    all the keywords because he does not have the server''s secret key.


    *GZP:* Gu et al. \[[28](#03chap_03.xhtml#ref3_28)\] proposed another PEKS scheme
    which is free from the requirement of secure channels. Like the SCF\_PEKS scheme
    proposed by Baek et al. \[[27](#03chap_03.xhtml#ref3_27)\], this scheme uses both
    the receiver''s public key as well as the server''s public key to generate the
    keyword ciphertext, the receiver''s secret key to generate the trapdoor and in
    the search algorithm it also uses the secret key of the cloud server. The authors
    have developed two searchable encryption schemes. In the first scheme, no pairing
    operation is used to generate the keyword ciphertext and the trapdoor. In the
    second scheme, no pairing operation is used to generate the trapdoor and also
    removes secure channel restriction, which makes it computationally efficient.


    ***FSG^+:*** Another secure channel-free PEKS scheme was proposed by Fang et al.
    \[[29](#03chap_03.xhtml#ref3_29)\]. Like SCF\_PEKS and SCF\_PEKS2, this scheme
    also generates separate public and private keys for the server. Their scheme is
    based Gentry''s IBE \[[30](#03chap_03.xhtml#ref3_30)\] which is a known secure
    scheme in the standard model with short public parameters. Because of the underlying
    Gentry''s IBE scheme they have proved that the resulting searchable encryption
    scheme is also secure in the standard model, thus added a milestone to SCF\_PEKS
    schemes.


    *RPS^+:* The PEKS scheme with designated tester proposed by Rhee et al. \[[31](#03chap_03.xhtml#ref3_31)\]
    adds another milestone to the secure channel-free PEKS. Here, the authors have
    improved the security model of the Baek et al. \[[27](#03chap_03.xhtml#ref3_27)\]
    scheme by considering a more powerful adversary. In the Baek et al. scheme, an
    attacker has access to trapdoors only and using those trapdoors the attacker can''t
    get the relationship between the ciphertext and the trapdoor. However, practically
    an attacker may get the trapdoor of any keyword and can obtain the ciphertext
    related to those trapdoors provided the ciphertext is not challenge ciphertext.
    Secondly, the Baek et al. security model limits the attacker''s capability by
    restricting her to share her secret key to the third party. The limitations mentioned
    above are addresses by Rhee et al. \[[31](#03chap_03.xhtml#ref3_31)\] in their
    scheme known as dPEKS where only a designated server chosen by the data owner
    is able to perform the search. The main focus is to enhance security by increasing
    the power of an adversary. The adversary can publish her public key without disclosing
    her secret key.


    ##### 3.3.2.2.3 PEKS security against KGA


    Searchable encryption schemes designed using public-key cryptography are likely
    to suffer from a KGA \[[32](#03chap_03.xhtml#ref3_32)\]. Because the keyword space
    is polynomial in size, i.e. generally a well-known set of keywords is used to
    perform the search, an adversary can guess the keyword corresponding to some valid
    captured trapdoor and generate the ciphertext for that keyword. The adversary
    then submits it to the cloud server to get the search result, if the search result
    is 1, then it signifies the guessed keyword is correct otherwise the same process
    is repeated again to get the information about the keyword ciphertext. In this
    process, the adversary gets the plaintext of the keyword, which is not expected.
    This process is known as the offline KGA and Byun et al. \[[26](#03chap_03.xhtml#ref3_26)\]
    launched the first successful KGA attack on the PEKS \[[24](#03chap_03.xhtml#ref3_24)\]
    scheme. After that, another attempt was made by Yau et al. \[[33](#03chap_03.xhtml#ref3_33)\]
    and they successfully launched KGA on several searchable encryption schemes based
    on the PKE of their time. In this section, we will discuss the efforts made in
    the direction to handle KGA.


    *Public-Key Encryption with Registered Keyword Search (PERKS):* Tang and Chen
    \[[34](#03chap_03.xhtml#ref3_34)\] proposed a PERKS scheme which can handle the
    KGA. PERKS requires keyword registration between data owner and data user before
    the data owner generates the ciphertext for that keyword. For this purpose, the
    data user first defines a set of keywords for which the data owner can generate
    the ciphertext. In the keyword registration phase, the receiver (data user) will
    use his/her private key and the keyword to generate the pre-tag for that keyword.
    Now, the sender (data owner) will use this pre-tag to generate the ciphertext
    for that keyword, which is called the tag in this scheme. The pre-tagging mechanism
    makes this scheme immune to KGA. It has applications in detecting junk emails.
    It has a feature of aggregating any number of keyword ciphertexts into a single
    ciphertext. The aggregated ciphertexts have the same size as the single ciphertext.
    Therefore, this scheme can test multiple keyword ciphertexts in batch mode. It
    is the first scheme in a public-key setting which requires interaction between
    data owner and data user. However, this is not considered practical because every
    time the data user has to communicate with the data owner to retrieve desired
    information. Further, the data owner cannot freely choose the keywords. It also
    requires secure channel between the data user and the server and between the data
    owner and the data user.


    ##### 3.3.2.2.4 SCF-PEKS with KGA security


    This section will cover all those schemes which do not require a secure channel
    to ensure trapdoor security and are also immune to KGA.


    *RPS2^+:* The PEKS scheme with a designated tester (dPEKS) \[[31](#03chap_03.xhtml#ref3_31)\]
    suffers from KGA. This scheme was revisited by Rhee et al. \[[35](#03chap_03.xhtml#ref3_35)\]
    to make it immune to KGA. They have identified that in the previous PEKS as well
    as in their own dPEKS schemes, it is impossible to ensure trapdoor privacy. By
    capturing a valid trapdoor nothing can ever stop an attacker from guessing a keyword
    and generating the ciphertext for that keyword using public parameters and obtaining
    a test result to check if the guessed keyword is correct or not. Therefore, to
    ensure trapdoor privacy it is necessary to modify the structure of the trapdoor.
    Here, the trapdoor is generated using the public key of the server in addition
    to the private key of the receiver. Therefore, the trapdoor cannot disclose any
    information about the keyword with or without the private key of the server. They
    deduced that the trapdoor security implies security against KGA.'
