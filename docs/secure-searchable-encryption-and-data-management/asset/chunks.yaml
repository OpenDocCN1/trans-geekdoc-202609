    # Overview


    With the advent of the IT revolution, data generation has grown exponentially
    and continues to rise. This data may be rich and voluminous, but it is a valuable
    resource that should be managed properly. Cloud technology plays a significant
    role in data management. There are many benefits to storing data in the cloud
    rather than in local storage, but there are privacy concerns regarding storing
    sensitive data on third-party servers; these concerns can be addressed by storing
    data in encrypted form. However, while encryption solves privacy issues, it raises
    other serious problems, including the infeasibility of basic search operations,
    reduced flexibility when sharing data with other users, and so on. The concept
    of Searchable Encryption addresses these issues.


    This book covers the origin and the necessary mathematical background required
    to understand and develop Searchable Encryption schemes. The book contains chapters
    that extensively categorize Searchable Encryption schemes in symmetric key and
    public key settings. These chapters describe Searchable Encryption schemes under
    each category based on features, security, and efficiency. Furthermore, the authors
    provide a comparative study of Searchable Encryption schemes in each category
    by computing computational and storage costs. The book also introduces different
    tools, libraries, and datasets used to develop Searchable Encryption schemes.
    Cross-domain applications of Searchable Encryption schemes are also discussed
    in the book. Finally, open research challenges and future research directions
    are elaborated to guide researchers and practitioners in advancing the field further.


    # Target Audience


    This book is designed for readers interested in the domain of security, specifically
    those who want to ensure confidentiality while performing operations on encrypted
    data. This includes researchers exploring the pros and cons of the technology,
    as well as developers and security professionals focused on developing secure
    Searchable Encryption schemes applicable to various domains.


    # Chapter Overview


    Specifically, this book comprises seven chapters, and a detailed overview of the
    topics covered in each chapter is summarized as follows:


    ## Chapter 1: Introduction to Number Theory and Abstract Algebra


    This chapter introduces the fundamentals of number theory and abstract algebra
    required to understand any cryptographic algorithm.


    ## Chapter 2: Introduction to Cryptography


    This chapter covers the basic concepts related to cryptography. Traditional and
    modern cryptography, along with the evolution from traditional to modern cryptography,
    are briefly discussed. Cryptographic principles and key terminology are described
    in detail to build a strong background.


    ## Chapter 3: Searchable Encryption and Data Management


    This chapter formally introduces the concept of Searchable Encryption as a data
    management technique. The necessity of such techniques is explained, along with
    how the technology can be leveraged to solve the problem of confidentiality protection
    and efficient retrieval of desired information from encrypted data without compromising
    confidentiality. The chapter discusses the broad categories of Searchable Encryption
    based on the underlying encryption technology and explains which underlying encryption
    technology provides more benefits to the user in different scenarios.


    ## Chapter 4: Introduction to Provable Security and Its Application in Searchable
    Encryption


    This chapter introduces the concept of provable security and its application in
    developing secure Searchable Encryption. Basic security definitions used in Searchable
    Encryption are provided, and the different security models that can be used to
    prove the security of Searchable Encryption schemes are explained. Furthermore,
    the chapter introduces the cryptographic assumptions used in provable security
    and lists the assumptions commonly used in Searchable Encryption.


    ## Chapter 5: Searchable Encryption in Public Key Settings


    This chapter explains the concept of Searchable Encryption in public key settings
    in detail. A generic structure of Searchable Encryption schemes in asymmetric
    key settings is provided. Furthermore, the chapter compares existing schemes in
    the literature under this setting and discusses possible scope for improvement.


    ## Chapter 6: Design Development Tools and Cross-Domain Applications


    This chapter discusses different open-source tools for the design and development
    of secure Searchable Encryption schemes. Additionally, cross-domain applications
    of Searchable Encryption are discussed, along with the significant role this technology
    plays in different domains.


    ## Chapter 7: Searchable Encryption Applications, Challenges, and Future Research
    Directions


    This chapter highlights the open challenges associated with Searchable Encryption
    and provides insights into future research directions in the field.


    # Acknowledgments


    First, we bow our heads in gratitude to the Almighty for His continuous blessings
    and enthusiasm that enabled us to complete this book. Writing a book is not a
    one-person job but the result of continuous support from loved ones. This book
    is the culmination of invaluable hard work, continuous effort, and assistance
    from loved ones. Therefore, we express our gratitude to everyone associated with
    this book, whether directly or indirectly, for their wonderful cooperation and
    creative ideas to improve the quality of the book. We also thank the CRC Press/Taylor
    & Francis Group team and staff for their assistance and continuous support. Heartfelt
    thanks to our families for their absolute love and countless prayers. This experience
    has been both an internal challenge and a reward. Therefore, a special thank you
    once again to everyone who helped us make this happen.


    # About the Authors


    **Brij B. Gupta** received his Ph.D. in Information and Cyber Security from the
    Indian Institute of Technology Roorkee, India, in 2012. He has published more
    than 250 research papers in internationally reputed journals and conferences.
    He has visited several countries, including Canada, Japan, the USA, the UK, Malaysia,
    Australia, Thailand, China, Hong Kong, Italy, Spain, etc., to present his research
    work. His biography was selected for the 30th Edition of *Marquis Who''s Who in
    the World* (2012). Dr. Gupta received the Young Faculty Research Fellowship from
    the Ministry of Electronics and Information Technology, Government of India, in
    2018. He has also served as Principal Investigator for several R&D projects. He
    serves/served as Associate Editor for journals such as `IEEE Access`, `IEEE TII`,
