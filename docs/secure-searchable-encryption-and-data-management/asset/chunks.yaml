    \ |\n\n|   || Search ||   || 1*P* + 1*H* |\n\n| Mamta et al. \\[[13](#05chap_05.xhtml#ref5_13)\\\
    ] || Encrypted Index || 2|*G*| + 4|*G*[*T*]| || 4*P* + 4*E* + 4*E*[*T*] |\n\n\
    |   || Trapdoor || 2|*F*[*p*]| + 2|*G*| || 4*E* + 2*H* |\n\n|   || Search ||  \
    \ || 1*P* + 1*E*[*T*] |\n\n### [5.2.2 ABE-based SE schemes](#contents.xhtml#rsec5_2_2)\n\
    \nAttribute-based searchable encryption (ABSE) is a technique that enables secure\
    \ search over encrypted data stored in the cloud \\[[14](#05chap_05.xhtml#ref5_14)\\\
    ]. In an ABSE scheme, the fine-grained access control is achieved with the help\
    \ of an access policy/structure which represents the relations among various attributes\
    \ a user may possess. This access policy is either associated with the ciphertext\
    \ or with the secret key of the user and thus results in two design frameworks\
    \ and either one of them can be used as ABE. If the access policy is embedded\
    \ in the ciphertext then it is called ciphertext-policy ABE (CP-ABE) \\[[15](#05chap_05.xhtml#ref5_15),\
    \ [16](#05chap_05.xhtml#ref5_16)\\] and if it is associated with the secret key,\
    \ then it is called key-policy ABE (KP-ABE) \\[[6](#05chap_05.xhtml#ref5_6), [17](#05chap_05.xhtml#ref5_17)\\\
    ].\n\nIn CP-ABE, the data owner has full control over his/her data because the\
    \ access policy is associated with the ciphertext through which the data owner\
    \ can define the users who can have access to his/her data. On the other hand,\
    \ KP-ABE is suitable for scenarios where the data owner wants to broadcast his/her\
    \ data. Here, only those users whose access policy agree with the attributes present\
    \ in the broadcasted data will be able to gain access to the data. In both the\
    \ frameworks, to provide fine-grained access control, there is a need of an extra\
    \ entity called “attribute” which will decide who will access what. An attribute\
    \ can be about anyone or anything. For example, *there is a Ph.D. scholar in the\
    \ department of computer engineering*. Here, Ph.D. and computer engineering are\
    \ the attributes of that user. If the institute has released marks of the computer\
    \ engineering department, then a user who possess this attribute will be able\
    \ to see his/her marks. Because of these attributes there will be an increase\
    \ in same number of components in the ciphertext and the secret key of the user.\
    \ Thus, there is an increase in complexity both in terms of storage cost and computational\
    \ cost. Hence, it is required to develop secure and efficient ABSE schemes where\
    \ this cost can be reduced by eliminating dependency on the attributes and making\
    \ the size of ciphertext and secret key etc. constant. Many ABSE schemes have\
    \ been proposed in the literature to support multi-user cloud storage environment\
    \ \\[[18](#05chap_05.xhtml#ref5_18), [19](#05chap_05.xhtml#ref5_19), [20](#05chap_05.xhtml#ref5_20)\\\
    ]. The combination of ABE and SE definitely provides fine-grained search capabilities\
    \ but it is achieved at the cost of increased complexity both in terms of storage\
    \ cost and computational cost \\[[21](#05chap_05.xhtml#ref5_21)\\], \\[[22](#05chap_05.xhtml#ref5_22)\\\
    ].\n\nConsidering the page limit, we will provide highlights of some of KP-ABE-\
    \ and CP-ABE based searchable encryption schemes.\n\n#### [5.2.2.1 VABKS](#contents.xhtml#rsec5_2_2_1)\n\
    \nZheng et al \\[[21](#05chap_05.xhtml#ref5_21)\\] developed the keyword search\
    \ scheme using both KP-ABE and CP-ABE as the underlying encryption technique.\
    \ They added the feature of verifiability of search results. Thus, Zheng et al.\
    \ relaxed the honest assumption about the cloud server because now one can verify\
    \ whether the cloud server has correctly executed the search algorithm or not.\
    \ Their construction is based on a symmetric bilinear map where source and target\
    \ groups are of prime order, *p*. They used a general access structure represented\
    \ by the tree data structure and a top-down approach is used to get the shares\
    \ of the secret value. Their scheme is secure against CKA in the selective security\
    \ model under the decision linear assumption.\n\n#### [5.2.2.2 Attribute-based\
    \ keyword search](#contents.xhtml#rsec5_2_2_2)\n\nSun et al \\[[23](#05chap_05.xhtml#ref5_23)\\\
    ] proposed an attribute-based keyword search scheme for a multi-user setting with\
    \ efficient user revocation. They used CP-ABE as the underlying encryption scheme.\
    \ They claimed scalability in terms of search complexity which does not vary with\
    \ the number of users. Their construction is based on a symmetric bilinear map\
    \ where source and target groups are of prime order, *p*, and access structure\
    \ consists of AND gate They have employed proxy re-encryption and lazy re-encryption\
    \ techniques for efficient user revocation. Their scheme supports conjunctive\
    \ keyword search, and is selectively secure against CKA under DBDH assumption.\n\
    \n#### [5.2.2.3 A key-policy attribute-based temporary keyword search](#contents.xhtml#rsec5_2_2_3)"
