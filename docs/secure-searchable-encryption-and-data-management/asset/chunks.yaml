    & Francis Group team and staff members for their assistance and persistent support.
    We are grateful, from the bottom of our hearts, to our family members for their
    absolute love and uncountable prayers. This experience is both internally challenging
    and rewarding. Therefore, again, special thanks to all who helped us in making
    this happen.


    # [Author bio](#contents.xhtml#rbio)


    **Brij B. Gupta** received his PhD degree from the Indian Institute of Technology
    in Roorkee, India, in the area of Information and Cyber Security. He has published
    more than 250 research papers in international journals and conferences of high
    repute. He has visited several countries, for example Canada, Japan, USA, UK,
    Malaysia, Australia, Thailand, China, Hong Kong, Italy, Spain, etc., to present
    his research work. His biography was selected and published in the 30th Edition
    of *Marquis Who''s Who in the World*, 2012. Dr. Gupta also received the Young
    Faculty Research Fellowship award from the Ministry of Electronics and Information
    Technology, Government of India, in 2018. He also works as a principal investigator
    of various R&D projects. He is serving/has served as associate editor of *IEEE
    Access*, IEEE TII, FGCS, IJICS, IJCSE, ACM TOIT, ASOC, etc. At present, Dr. Gupta
    works as an assistant professor in the Department of Computer Engineering at the
    National Institute of Technology, Kurukshetra, India. His research interests include
    information security, cyber security, mobile security, cloud computing, web security,
    intrusion detection and phishing.'
