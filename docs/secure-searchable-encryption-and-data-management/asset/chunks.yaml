    ## 2.4 公钥加密的推广


    如果我们回顾公钥加密技术类型，主要有三个核心算法：密钥生成、加密和解密。密钥生成算法接收安全参数，并生成一对公钥和私钥。该算法生成的公钥是完全随机的。1984
    年，Shamir 提出了一种想法：与其将公钥作为一个复杂的随机字符串，不如使用电子邮件地址、电话号码、IP 地址等用户唯一的标识符。这种对公钥加密的推广被称为**基于身份的加密（IBE）**
    [[13]](#02chap_02.xhtml#ref2_13), [[14]](#02chap_02.xhtml#ref2_14), [[15]](#02chap_02.xhtml#ref2_15),
    [[16]](#02chap_02.xhtml#ref2_16)。因此，现在当 Bob 为 Alice 加密消息时，他将使用 Alice 的电子邮件地址作为公钥，而
    Alice 可以使用私钥生成器提取与其 ID 相对应的私钥，即本例中的电子邮件地址。如同 IBE 一样，标准公钥加密（PKE）技术还有其他推广形式，如**基于属性的加密（ABE）**
    [[17]](#02chap_02.xhtml#ref2_17), [[18]](#02chap_02.xhtml#ref2_18), [[19]](#02chap_02.xhtml#ref2_19),
    [[20]](#02chap_02.xhtml#ref2_20), [[21]](#02chap_02.xhtml#ref2_21), [[22]](#02chap_02.xhtml#ref2_22)、**广播加密（BE）**
    [[23]](#02chap_02.xhtml#ref2_23), [[24]](#02chap_02.xhtml#ref2_24)、**同态加密（HE）**
    [[25]](#02chap_02.xhtml#ref2_25) 和**函数加密（FE）** [[26]](#02chap_02.xhtml#ref2_26),
    [[27]](#02chap_02.xhtml#ref2_27), [[28]](#02chap_02.xhtml#ref2_28), [[29]](#02chap_02.xhtml#ref2_29)，如图
    2.4 所示。其中，我们将重点讨论 IBE 和 ABE，因为我们在可搜索加密方案的构建中看到了这两种技术的大量应用。


    ![Figure 2.4 Generalization of PKE.](img/fig2_4.jpg)


    *图 2.4* PKE 的推广。


    ### 2.4.1 基于身份的加密（IBE）


    在 IBE 中共有四个算法，其中一个额外的算法称为建立算法，记为 `S`，其余三个与标准 PKE 相同。


    * `(PP, MSK) ← S(λ)`：建立算法接收安全参数，并输出公共参数 `PP` 和主密钥 `MSK`。该算法通常由受信任的第三方执行，通常称为密钥生成中心（KGC）。

    * `SK[ID] ← K(MSK, ID)`：密钥生成算法接收用户的 `MSK` 和 `ID`，并生成其对应 `ID` 的私钥，即 `SK[ID]`。

    * `C ← E(PP, ID, m)`：加密算法使用公钥 `ID` 和 `PP` 对消息 `m` 进行加密，并输出密文 `C`。

    * `m ← D(SK[ID], C)`：解密算法使用 `SK[ID]` 对密文进行解密。


    **正确性证明：** 如果对于从 `IBE_Setup(λ)` 生成的所有 `PP` 和 `SK[id]`，以下条件成立，则称该 IBE 方案是正确的：


    ```

    D(SK[ID], E(PP, ID, m)) = m

    ```

    (2.2)


    IBE 方案的图示表示可见图 2.5。


    ![Figure 2.5 A typical IBE scheme.](img/fig2_5.jpg)


    *图 2.5* 典型的 IBE 方案。


    使用单一主密钥和不同的 ID，IBE 方案可以生成不同的私钥。基本上，IBE 试图将指数级数量的公钥压缩成一个简短的公共参数字符串。第一个实用的 IBE 方案由
    Boneh 和 Franklin [[30]](#02chap_02.xhtml#ref2_30) 于 2001 年设计。


    ### 2.4.2 基于属性的加密（ABE）


    IBE 是 PKE 的一种非常自然的扩展，就像 PKE 一样，使用 IBE 我们可以将消息发送给单个预期用户。ABE 的开发是为了不同的场景：假设我们有大量数据（如加密数据库），以及一组多样化的用户，他们需要访问该数据的不同片段，而决定谁能访问什么的不一定是他们的身份。相反，用户的**属性**将决定其访问能力。例如：我们可能希望根据用户的工作类型等向授权用户提供访问权限。我们随处可见此类场景。基于属性的加密正是为了处理此类场景而设计的。它是最流行的
    PKE 技术之一，提供了细粒度的访问控制能力。在 ABE 出现之前，每个 PKE 方案都是一对一的，即加密消息仅面向单个用户。在 ABE 中，我们可以发送面向多个用户的相同加密消息，从而支持一对多场景。根据与用户或数据关联的属性，我们有两种变体：**密钥策略属性基加密（KP-ABE）**
    和 **密文策略属性基加密（CP-ABE）**。在 KP-ABE 中，访问策略与用户的私钥关联，属性与密文关联。在 CP-ABE 中，访问策略与密文关联，属性与用户的私钥关联。为了统一表述，设
    `I[K]` 表示密钥生成算法 `K` 的输入，`I[E]` 表示加密算法 `E` 的输入。在 KP-ABE 中，`I[K]` 和 `I[E]` 分别为访问策略和属性集合。在
    CP-ABE 中，`I[K]` 和 `I[E]` 分别为属性集合和访问策略。与 IBE 类似，ABE 方案也由四个多项式时间算法组成：


    * `(PP, MSK) ← S(λ, Att)`：建立算法除接收安全参数 `λ` 外（同 IBE 方案），还接收属性全集 `Att = {att[1],
    att[2], ..., att[|Att|]}`，并输出公共参数 `PP` 和主密钥 `MSK`。

    * `SK[u] ← K(PP, MSK, I[K])`：密钥生成算法接收 `MSK` 和用户的凭证 `I[K]`，并生成其对应凭证的私钥，即 `SK[u]`。

    * `C ← E(PP, m ∈ ℳ, I[E])`：加密算法使用 `I[E]` 和 `PP` 对消息 `m` 进行加密，并输出密文 `C`。

    * `m ← D(C, SK[u])`：当且仅当 `I[K]` 和 `I[E]` 之间满足可满足性条件时，解密算法使用 `SK[u]` 对密文进行解密。


    **正确性证明：** 如果 `I[K]` 和 `I[E]` 之间满足可满足性条件，则对于给定的 `PP` 和 `MSK`，必须满足以下条件：


    ```

    D(E(m, PP, I[E]), SK[u]) = m

    ```

    (2.3)


    KP-ABE 方案的图示表示可见图 2.6。在此，用户拥有一组属性，并从 KGC 获取相应的私钥。以一个教育机构为例，计算机工程系发布了博士和硕士研究生的成绩。成绩上传至其共享存储，系里希望成绩仅能被指定考生访问。因此，他们使用访问策略
    `W = CE ∧ (PhD ∨ MTech)` 对成绩进行加密，并上传至共享存储。当某学生凭借凭证 `L` 想要查看其成绩时，当且仅当 `L` 满足 `W`
    时，才能解密。正如我们在图 2.6 中所见，仅用户 `U[3]` 的凭证满足 `W`，因此只有他/她能够查看成绩。


    ![Figure 2.6 A typical CP-ABE scheme.](img/fig2_6.jpg)


    *图 2.6* 典型的 CP-ABE 方案。


