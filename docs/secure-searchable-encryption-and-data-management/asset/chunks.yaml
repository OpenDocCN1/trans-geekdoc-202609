    # [Chapter 7](#contents.xhtml#rchapter7)


    # [Searchable encryption applications, challenges and future research directions](#contents.xhtml#rchapter7)


    SEARCHABLE ENCRYPTION APPLICATIONS AND FUTURE RESEARCH DIRECTIONS are the main
    highlights of this chapter. In addition, we will discuss the critical research
    challenges encountered while designing searchable encryption schemes.


    ## [7.1 SEARCHABLE ENCRYPTION APPLICATIONS](#contents.xhtml#rsec7_1)


    Cloud-based storage allows multiple data owners to share their data with multiple
    users. Public-key setting is the suitable choice to support such a scenario. Therefore,
    to efficiently use cloud-based storage, we aim to utilize public-key cryptographic
    primitives to provide confidentiality of the data. Further, the number of users
    as well as the amount of data stored over cloud-based storage is increasing rapidly.
    Therefore, to retrieve valuable information, there is a need to develop an efficient
    searchable encryption scheme \[[1](#07chap_07.xhtml#ref7_1)\].


    *General application of searchable encryption:* Searchable encryption schemes
    have numerous applications in areas where we want both security of the data and
    accessibility to the data. For example, in a banking system, confidentiality of
    the customer''s data is important but at the same time the bank wants the data
    to be processed by designated employees to provide various services to its customers.
    The confidentiality part can be achieved by applying encryption. However, the
    data a banking system deals with may be huge, hence there is a need of an encryption
    technique through which one can perform search without actually downloading and
    decrypting the data. Similar to the banking system, there is a large class of
    applications where searchable encryption can make a difference. Further, searchable
    encryption has applications in multiple domains like secure auditing of network
    and financial logs, privacy of health monitoring systems, remote data storage
    which are untrusted in nature and so on.


    *Application of public-key encryption with keyword search (PEKS) and its extensions:*
    The application of PEKS in secure email retrieval proposed by Boneh et al. \[[2](#07chap_07.xhtml#ref7_2)\]
    has been seen in the literature. Later Tang and Chen \[[3](#07chap_07.xhtml#ref7_3)\]
    proposed an extension of PEKS that has application in the detection of junk emails.


    *Application of attribute-based searchable encryption:* Searchable encryption
    schemes developed using ABE provide fine-grained search capabilities to their
    users and have applications in the field of healthcare networks. The data owner
    (patient) can store his/her health data online in an encrypted form to provide
    differential access to different users like researchers, doctors or insurance
    agents. Since all the users belong to entirely different domains it is not possible
    for a single authority to manage such diverse domains. Hence, there is a need
    to devise a multi-authority approach such that each authority independently manages
    the attributes of their domain.


    ## [7.2 RESEARCH CHALLENGES](#contents.xhtml#rsec7_2)


    There are three main research challenges in developing a searchable encryption
    scheme: *i*) security, *i**i*) efficiency and *i**i**i*) query expressiveness
    \[[4](#07chap_07.xhtml#ref7_4)\]. The security of a searchable encryption scheme
    is measured in terms of how well the scheme hides both the data file and the associated
    keywords. It is assumed that the scheme is more secure if the adversary is more
    powerful. The power of an adversary is measured in terms of facilities provided
    to him/her, such as access to oracles and the type of queries he/she can ask.
    Moreover, if weaker security assumptions are used in the security proof of a searchable
    encryption scheme, the resulting technique is assumed to be more secure. The time
    cost of breaking the weak assumption is much greater than the strong assumption,
    thus making strong assumptions relatively risker. The weaker assumptions are also
    known as standard assumptions.'
