  fmt: '

    # Boneh et al. [24] developed the first searchable encryption in a public-key
    setting called public-key encryption with keyword search and is famous by name,
    PEKS.


    Among the available public-key cryptographic primitives, they used identity-based
    encryption (IBE) as an underlying scheme. They used the public key corresponding
    to the user''s identity to encrypt the data file and the keywords contained in
    the data file. The scheme was developed for the efficient retrieval of encrypted
    emails from the email server. The data owner or more appropriately the sender
    wants to send an email encrypted under the public key of the recipient along with
    the keywords encrypted under the same key. The sent email gets stored at the email
    server of the recipient and the recipient needs a mechanism to efficiently retrieve
    only the desired emails among them. This efficient mechanism is the technique
    of searchable encryption, without which the recipient first needs to download
    all the emails and then decrypt them locally using his/her private key. But with
    the searchable encryption technique, the recipient can extract the emails according
    to his current requirement and needs to decrypt only those selected emails. This
    whole mechanism is suitable in those scenarios where we have a single intended
    recipient; however, there is no restriction upon the number of senders. Now, if
    we want to send the same message to multiple recipients, can we apply the same
    mechanism as discussed above? The answer is, yes. However, it will not be an efficient
    mechanism. To send the same message to multiple recipients, we need to encrypt
    the same message multiple times with the public key of each recipient and this
    leads to a lot of redundancy in the system. Since we want an efficient mechanism,
    there is a need to explore other cryptographic primitives like attribute-based
    encryption (ABE) which may possibly resolve this redundancy and we will discuss
    such schemes in Chapter 5 which is dedicated to searchable encryption in public-key
    setting.


    ## 3.3.2.2.1 PEKS insights


    Consider the famous cryptographic example of Alice and Bob where Bob wants to
    send an email message, `m ∈ ℳ`, along with several keywords, `{w[1], w[2], …,
    w[l]} ∈ W` to Alice. These associated keywords are later used to search the corresponding
    email message. Bob generates the following ciphertext: `E[A[pub]](m) ∥ PEKS(A[pub],
    w[1]) ∥ … ∥ PEKS(A[pub], w[l])` where `E[A[pub]](m)` is any standard public-key
    encryption algorithm which uses public key of Alice, `A[pub]` to generate the
    encrypted email message and PEKS is an algorithm which supports keyword search.
    The generated ciphertext is stored at Alice''s email server. To perform search,
    Alice uses her secret key/private key to generate a secret for a particular keyword
    she wants to search and that secret is known as the search trapdoor/token. The
    email server will use this trapdoor and finds the message which contains this
    keyword using the search algorithm. The search algorithm returns a binary output
    1 if a matching keyword is found, otherwise it returns 0. The details of the algorithms
    involved in the PEKS scheme are given in Table 3.2.


    **Table 3.2** Public-key encryption with keyword search (PEKS) [24]


    ```

    PEKS Scheme

    The PEKS scheme uses two hash functions, H[1], H[2], and a symmetric bilinear
    map, e : G[1]×G[1]→G[T], where G[1] and G[T] are cyclic groups of prime order,
    p.


    1. Key Generation: Randomly choose α ∈ Z[p]^(*), and find g be the generator of
    G[1]. Compute, K[pub] = (g, h = g^(α)) and K[pri] = α.


    2. PEKS (K[pub], w): Randomly choose r ∈ Z[p]^(*), and compute, t = e(H[1](w),
    h^(r)). Output, C = [g^(r), H[2][t]].


    3. Trapdoor (K[pri], w): Output, T[w] = H[1](w)^(α) ∈ G[1].


    4. Search (C, T[w]): Test if H[2](e(T[w], g^(r))) = H[2](t), if yes, a match has
    been found and returns 1; otherwise; returns 0.

    ```


    As we stated, the PEKS is based on the IBE scheme. Now, let us examine how. The
    `K[pub]` plays the role of public parameters and the `K[pri]` acts just like the
    master secret key in a typical IBE scheme. The IBE ciphertext is generated using
    the public parameters, i.e. `K[pub]` and the keyword, `w`, here acts as an identity.
    In the trapdoor algorithm, shown in step 3, basically a secret key is generated
    for the ID, which is `w` in the present scheme. This step is just like getting
    the secret key for the ID in an IBE scheme. The search algorithm is like the decryption
    algorithm in an IBE scheme which takes the ciphertext and the secret key, i.e.
    the trapdoor in the present scheme.


    ### PEKS Highlights


    *   No interaction between sender and the receiver.

    *   Supports multiple data owner (sender) and single data user (recipient) popularly
    known as M/S setting [25].

    *   It has application in secure email retrieval.

    *   Suitable for polynomial size keyword space.

    *   PEKS is secure against adaptive chosen keyword attack under the Bilinear Diffie–Hellman
    (BDH) assumption in random oracle model.

    *   Email server is assumed to be honest and curious, i.e. it correctly executes
    all algorithms but it may try to learn some useful information.


    ### PEKS Limitations


    *   Requires secure channel to prevent eavesdropping.

    *   To support multiple data users, same message encrypted with the public key
    of each intended user is sent which leads to redundancy.

    *   Since the keyword space is small, the PEKS and all the public-key searchable
    encryption schemes suffers from keyword-guessing attack (KGA) [26] unless it is
    explicitly handled.

    *   PEKS was designed for one-time use. The server may memorize the trapdoor and
    use it to get information about future emails.

    *   Does not support multi-keyword search.


    The security-related definitions stated in the above points will be explained
    in detail in the next chapter. The two main drawbacks of PEKS, the secure channel
    requirement between server and data user and the KGA remained the focus of the
    work after PEKS which are discussed in the subsequent sections.


    ## 3.3.2.2.2 Secure channel-free PEKS


    Building a secure channel to send the trapdoor is quite expensive, therefore efforts
    have been made to remove this restriction and make the trapdoor secure enough
    to send on some public channel.


    ### BSS2: Baek et al. [27] proposed the first secure channel-free PEKS scheme.


    The authors resolved the flaw in the design of the PEKS scheme where the server
    may use the stored trapdoors and perform search by itself without the knowledge
    of the recipient. The trivial solution to this problem is to restrict the use
    of the keywords only once. However, this solution is not practical if the user
    wants to reuse the keywords. Baek et al. [27] suggested a solution where the keywords
    are periodically refreshed and this is done by attaching time-period information;
    the user appends the time period for which he wants to generate the trapdoor.
    They named this process as refreshing keywords. For example, if data user wants
    to generate a trapdoor for a keyword say, URGENT, then before generating its trapdoor
    the user will first append it with the time period as follows: `URGENT||01/08/2019`.

    '
