    a block length of 64 bits. In 1997, DES was broken by an exhaustive search where
    all the `2^(56)` combinations of keys were tried to find the challenge key. After
    DES was broken, the first thing that came to the mind of experts was to strengthen
    DES against an exhaustive key search attack by artificially expanding the key
    size. As a result, triple-DES (3DES) was invented. The idea was to iterate DES
    a couple of times. 3DES uses three independent keys, each of length 56 bits, which
    makes the key size equal to 168 bits (`56×3`), but it is three times slower than
