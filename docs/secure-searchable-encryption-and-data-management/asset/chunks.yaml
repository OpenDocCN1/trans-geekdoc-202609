- raw: "It states that we conduct an experiment where we have generated a secret key\
    \ and, using this secret key, we have properly encrypted a message to get its\
    \ ciphertext, and then this ciphertext is given to the decryption algorithm which\
    \ also takes the same key. If the probability of getting *m* = *m*′ is 1, then\
    \ we say our scheme is always correct. Now, we know where key and ciphertext came\
    \ from, but we have not said anything about the message, where does this *m* came\
    \ from? This *m* is chosen from the message space and the above defined probability\
    \ must hold for all messages in the message space. Hence, we say ∀*m* ∈ *M*, if\
    \ *P**r*\\[*k*←*G**e**n*\\[1^(*n*)\\];*c*←*E**n**c*\\[*k*,*m*\\];*m*^′←*D**e**c*\\\
    [*k*,*c*\\]:*m*\\=*m*′\\] = 1, then our scheme is always correct. Now we will\
    \ define what it means for an encryption scheme to be secure.\n\n### [4.1.1 Probabilistic\
    \ and game-based security definition](#contents.xhtml#rsec4_1_1)\n\nThere are\
    \ many flavors of security with respect to the encryption schemes based upon the\
    \ type of facilitation we have given to the adversary \\[[1](#04chap_04.xhtml#ref4_1)\\\
    ]-\\[[3](#04chap_04.xhtml#ref4_3)\\]. We define the security of the schemes against\
    \ various attacks like the ciphertext-only attack, known plaintext attack (KPA),\
    \ chosen plaintext attack (CPA), chosen ciphertext attack (CCA1) and adaptive\
    \ chosen ciphertext attack (CCA2). In the security against ciphertext-only attack,\
    \ the adversary just possesses a string of ciphertexts and tries to break the\
    \ scheme using this information. In KPA, the adversary has a string of plaintext\
    \ and their corresponding ciphertext. In CPA, the adversary is provided with access\
    \ to the encryption oracle, and she can convert any plaintext of her choice to\
    \ the ciphertext. In CCA1, in addition to the encryption oracle, the adversary\
    \ has access to the decryption oracle, through which she can get the plaintext\
    \ of any chosen ciphertext. In CCA2, the adversary has all the facilities that\
    \ are provided to it in CCA1, but here the adversary can modify her choice based\
    \ on the results of previous encryption.\n\nTo clearly understand the entire security\
    \ mechanism, we will start by the security ciphertext-only attack which is also\
    \ called the security against potential eavesdroppers. All further discussion\
    \ in this chapter will consider the eavesdropper security.\n\nFirst of all, we\
    \ will define the probabilistic security definition and then convert it into the\
    \ game-based definition.\n\nConsider an experiment where we generate a secret\
    \ key, *k*, using the *G**e**n* algorithm which takes security parameter, 1^(*n*).\
    \ Now, we will pass on the security parameter to the adversary and keep the key\
    \ to ourselves as it is a secret. The adversary now outputs two messages, *m*[0],\
    \ *m*[1] and we will allow the adversary to keep a state, which she needs later.\
    \ Given these messages, we will pick a random bit, *b*←{0,1}, and encrypt one\
    \ of the messages, *m*[*b*], to generate ciphertext, *c*, and give it back to\
    \ the adversary. The adversary can now continue from the state she left and she\
    \ now knows the ciphertext which we have given her. Using this information, the\
    \ adversary outputs her guess, *b*′, and wins if *b*^′ = *b*. Since *b* is just\
    \ a single bit which can always be guessed correctly with probability 1/2, the\
    \ adversary must do more than just 1/2, if she actually wants to break the scheme.\
    \ But we do not want her to do much more than a *n**e**g*(*n*) (negligible in\
    \ security parameter *n*) because we want our scheme to be secure. Formally, this\
    \ entire experiment can be stated mathematically by the following equation, given\
    \ ∀*P**P**T* (probabilistic-polynomial time) adversaries, *A*, ∃ a negligible\
    \ function in *n*, *n**e**g*(*n*), such that:\n\n$$Pr\\\\left\\\\lbrack Gen\\\\\
    left\\\\lbrack 1^{n} \\\\right\\\\rbrack\\\\rightarrow k;A\\\\left\\\\lbrack 1^{n}\
    \ \\\\right\\\\rbrack\\\\rightarrow\\\\left\\\\lbrack {m\\_{0},~m\\_{1},state}\
    \ \\\\right\\\\rbrack;b\\\\leftarrow\\\\left\\\\{ 0,1 \\\\right\\\\};Enc\\\\left\\\
    \\lbrack {k,m\\_{b}} \\\\right\\\\rbrack\\\\rightarrow c;A\\\\left\\\\lbrack {state,c}\
    \ \\\\right\\\\rbrack\\\\rightarrow b':~b' = b \\\\right\\\\rbrack = \\\\frac{1}{2}\
    \ + neg\\\\left( n \\\\right)$$  \n\n(4.2)\n\nIn most encryption schemes today\
    \ the length of the message is not hidden in the ciphertext, therefore, the chosen\
    \ message *m*[0], *m*[1] by the adversary must have equal length. Otherwise, they\
    \ can be easily distinguishable.\n\nThis probabilistic security definition can\
    \ also be described as a game between the challenger and the adversary as shown\
    \ in [Figure 4.1](#04chap_04.xhtml#fig4_1).\n\n![Figure 4.1Game-based security\
    \ definition.](images/fig4_1.jpg)\n\n*Figure 4.1*Game-based security definition.\n\
    \nIn this game between the challenger and the adversary, we say that adversary\
    \ wins if *b*^′ = *b* and we say that our scheme is secure if $\\\\forall PPT\\\
    \\ A,\\\\ \\\\exists neg\\\\left( n \\\\right):Pr\\\\left\\\\lbrack {A\\\\ wins\\\
    \\ the\\\\ game} \\\\right\\\\rbrack = \\\\frac{1}{2} + neg\\\\left( n \\\\right)$.\
    \ From this probability, if we subtract the trivial component, i.e. 1/2, then\
    \ what we get is technically called the advantage of adversary in winning the\
    \ game, and for a scheme to be secure this advantage should be negligible.\n\n\
    ## [4.2 REDUCTION PROOFS](#contents.xhtml#rsec4_2)\n\nIn reduction proofs we say\
    \ that a scheme X is secure as long as the assumption Y holds, where Y is a known\
    \ hard assumption for which there exists no polynomial time algorithm that can\
    \ break Y. We state this definition as a theorem and will provide the proof of\
    \ this theorem as follows:\n\n*Theorem*: If Y hold ⇒ X is secure.\n\n*Proof*:\
    \ The proof methodology employed here is just like the ordinary reduction proofs,\
    \ we will prove it using the contrapositive statement, which state that, if X\
    \ is not secure then this should imply assumption Y should not hold.\n\n$$\\\\\
    begin{array}{l} \\\\left. Original:~Y\\\\ hold\\\\ \\\\Rightarrow~X~secure, \\\
    \\right. \\\\\\\\ \\\\left. ~Contrapositive:~X~is~not~secure\\\\ \\\\Rightarrow~Y~does~not~hold\
    \ \\\\right. \\\\\\\\ \\\\end{array}$$  \n\nThese two statements are equivalent.\
    \ If we are able to prove the contrapositive, then original is automatically proved,\
    \ and hence we have proved the theorem.\n\n*Potential reasoning statements:* We\
    \ will start the proof by assuming that if there exists a probabilistic-polynomial\
    \ time (PPT) adversary, A, who can break X, then we can construct another probabilistic-polynomial\
    \ time adversary, B, who can break Y. Now, here breaking entirely depends upon\
    \ the security definition we have used for scheme X. For example: if eavesdropper\
    \ security definition is considered, then breaking there means the adversary can\
    \ distinguish between the two messages with non-negligible advantage.\n\nAn alternative\
    \ way of thinking about it is, since there is no known PPT algorithm, B, that\
    \ can break Y, this implies there can be no PPT algorithm, A, that can break X.\
    \ If there exists some algorithm A that breaks X, then through this proof, or\
    \ more appropriately reduction, we can immediately have an algorithm that breaks\
    \ Y; however, if Y is a known hard assumption and no algorithm exists which can\
    \ break it, then it is impossible that there can be an algorithm that can break\
    \ X and thus we can claim scheme X is secure.\n\nSince we are constructing another\
    \ adversary, B, we will define its interactions and pseudocode; therefore, such\
    \ a proof is also called constructive proof. All the reduction proofs work in\
    \ almost the same manner, we will construct B by writing its pseudocode. B can\
