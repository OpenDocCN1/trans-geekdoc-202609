    | --- | --- | --- |

    | **基于*k*-韧性IBE的PEKS** | | |

    | Khader \[[9](#05chap_05.xhtml#ref5_9)\] | 加密索引：2\|*G*\| + \|{0,1}^(*k*)\| |
    (3*k*+5)*E* + 2*H* |

    | | 陷门：6*`poly`* | 6*`poly`* |

    | | 搜索：— | 4*E* + 1*H* |

    | **使用模糊函数进行关键字搜索陷门的PEKS** | | |

    | Xu等人 \[[11](#05chap_05.xhtml#ref5_11)\] | 加密索引：2\|*G*\| + 2\|*G*[*T*]\| | 2*P*
    + 2*E* + 2*E*[*T*] + 2*H* |

    | | 陷门：2\|*G*\| | 2*H* + 2*E* |

    | | 搜索：— | 1*P* + 1*H* |

    | Mamta等人 \[[13](#05chap_05.xhtml#ref5_13)\] | 加密索引：2\|*G*\| + 4\|*G*[*T*]\| |
