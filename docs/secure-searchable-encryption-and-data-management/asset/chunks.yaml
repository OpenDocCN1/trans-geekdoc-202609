    a lightweight searchable encryption scheme for CWSN with a reduced cost of generating
    ciphertext and performing search. The owner of the sensor network generates public
    and secret key pairs and stores the public components at all the sensor nodes.
    The sensor nodes collect and store the encrypted data on the cloud server. To
    retrieve the data, the data owner generates a trapdoor for the keyword and sends
    it to the cloud server to perform the search.


    ## Cloud-based IoT


    IoT devices contribute the majority of data in today''s digital world and the
    collected data is stored in cloud servers. The collected data may be sensitive;
    therefore, searchable encryption can have applications for cloud-based IoT. Wu
    et al. [[17](#06chap_06.xhtml#ref6_17)] proposed a searchable encryption scheme
    for the same. The working of their system is the same as the standard searchable
    encryption in a public-key setting. Apart from the basic functionality, they focused
    on developing the KGA resistant scheme.


    ## Fog computing


    Miao et al. [[18](#06chap_06.xhtml#ref6_18)] applied fine-grained conjunctive
    keyword search to fog computing. It is basically an extension of cloud computing
    where fog nodes are placed between the end users and the cloud. Their scheme is
    lightweight in the sense that most of the computationally intensive tasks are
    delegated to the fog nodes. The end users only perform the partial computations;
    the final ciphertext and even the final trapdoor are generated by the fog nodes
    and sent to the cloud server. The fog nodes receive the search result returned
    by the cloud server and perform partial decryption to further reduce the burden
    on end users. The cloud server has the role of searching like always and instead
    of returning the search result to the end user, now it returns it to the intermediate
    fog nodes that perform all necessary computations. They also take into account
    the process of updating the attributes in the access policy, hence supporting
    dynamic policy. The data from end users are collected by the IoT devices (wearable
    or mobile devices) used by these users.


    ## Blockchain technology


    During this timeframe, when research was going on to test the applicability of
    searchable encryption in different scenarios as discussed above, there came a
    major milestone in the journey of searchable encryption schemes. This milestone
    was achieved by using the most innovative technology of the century: blockchain
    technology. We have seen a huge revolution initiated by this technology in different
    sectors such as finance, healthcare, voting and a lot more. Hu et al. [[19](#06chap_06.xhtml#ref6_19)]
    proposed an entirely new platform for the searchable encryption. They leveraged
    the power of smart contracts to develop a secure searchable encryption in a symmetric-key
    setting. The resulting scheme was quite robust as we now need not worry about
    situations like a malicious cloud server or whether the cloud server is dishonest.
    The inherent design of the blockchain technology take cares of these issues. Instead
    of using the cloud server, the data owner stores his/her data in an encrypted
    form over the public blockchain platform, Ethereum. The scheme was implemented
    and tested to check the applicability in practical scenarios. Most recently in
    June, 2020, the application of blockchain technology has been seen in developing
    searchable encryption in a public-key setting by Liu et al. [[17](#06chap_06.xhtml#ref6_17)].
    They have not replaced the cloud server with the blockchain, but have leveraged
    blockchain technology to reduce computational burden and to build more realistic
    SE schemes. They have used consortium blockchain to initialize the system, generate
    the final trapdoor and handle the event of user revocation. The cloud as usual
    stores the encrypted data and performs partial decryption on the behalf of users.
    The blockchain technology here makes the SE scheme decentralized by completely
    eliminating the need of a central authority and has also reduced the computational
    burden from data users.


