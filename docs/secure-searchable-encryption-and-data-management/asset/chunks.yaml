- raw: "**Mamta** is currently pursuing her PhD in Applied Cryptography under the\
    \ Supervision of Dr. Brij B. Gupta in the Department of Computer Engineering at\
    \ the National Institute of Technology (NIT), Kurukshetra, India. She has received\
    \ her M.Tech. from the Department of Computer Engineering at the National Institute\
    \ of Technology, Kurukshetra, India. She has received her B.Tech. degree in Computer\
    \ Engineering from the University Institute of Engineering and Technology, Kurukshetra\
    \ University. Her research interests include number theory and cryptography, searchable\
    \ encryption, information security and cloud computing. She has published various\
    \ research articles with various reputed publishers, like IEEE, Springer, Wiley,\
    \ and IGI Global.\n\n# [Chapter 1](#contents.xhtml#rchapter1)\n\n# [Introduction\
    \ to number theory and abstract algebra](#contents.xhtml#rchapter1)\n\nNUMBER\
    \ THEORY AND ABSTRACT ALGEBRA plays an important role in the development of cryptosystems.\
    \ Their basic knowledge acts as a key ingredient to the fields like cryptography\
    \ and coding theory. Therefore, in this chapter, we will give a detailed overview\
    \ of these basic concepts to build a strong foundation before diving deep into\
    \ the field of searchable encryption and data management. This chapter is divided\
    \ two parts, the first part covers the concepts related to number theory and the\
    \ second part covers the basic concepts of abstract algebra.\n\n## [1.1 NUMBER\
    \ THEORY](#contents.xhtml#rsec1_1)\n\nNumber theory is an interesting facet of\
    \ mathematics that has attracted everyone from professional mathematicians to\
    \ amateurs with its captivating concepts. Number theory concepts and theorems\
    \ are natural and make sense even to a layman. However, proving them essentially\
    \ requires both the basic knowledge and strong background we expect from a graduate\
    \ in Computer Engineering. In this section, we will cover all the necessary concepts\
    \ of number theory needed for the development of searchable encryption schemes\
    \ along with their detailed proofs \\[[1](#01chap_01.xhtml#ref1_1)\\].\n\n###\
    \ [1.1.1 Divisibility](#contents.xhtml#rsec1_1_1)\n\nDivisibility is the fundamental\
    \ concept of number theory. Consider a set of integers, *Z* = {…,−1,0,1,…}, we\
    \ say *b* divides *a*, (*b*|*a*), if *a* = *k* ⋅ *b*,  where *a*, *b*, *k* ∈ *Z*\
    \ \\[[2](#01chap_01.xhtml#ref1_2)\\]. Alternatively, one can also say that *a*\
    \ is divisible by *b*, or *a* is a multiple of *b*, or *b* is a factor/divisor\
    \ of *a*. The trivial cases include: *i*) ∀*b* ∈ *Z*, *b*|0, which denotes that\
    \ every number divides 0, and *i**i*) ∀*a*∈*Z*, 1|*a*, which denotes that 1 divides\
    \ every number.\n\n#### [1.1.1.1 Divisibility properties](#contents.xhtml#rsec1_1_1_1)\n\
    \nThe following are key properties of divisibility, which can be easily verified\
    \ with the definition of divisibility:\n\n*   If *a*|*b* and *b*|*c* then *a*|*c*\n\
    \n*   If *a*|*b* then *a*|*b**c*, ∀*c* ∈ *Z*\n\n*   If *a*|*b* and *c*|*d* then\
    \ *a**c*|*b**d*\n\n*   If *m*: non-zero integer, then *a*|*b*  iff  *m**a*|*m**b*\n\
    \n*   If *a*|*x* and *a*|*y* then *a*|*c**x*+*d**y*, where *c*, *d* ∈ *Z*\n\n\
    *   If *d*: non-zero integer such that *d*|*a* *a**n**d* *a*≠0  then |*d*| ≤ |*a*|\n\
    \n*   *a*|*b* and *b*|*a* iff *a* = ± *b*\n\n*   If *a*|*b* and *a*|*c* then *a*|*b*±*c*\n\
    \nIf *a*|*b*, *b* = *k*[1] ⋅ *a* and *b*|*c*, *c* = *k*[2] ⋅ *b* = *k*[2] ⋅ (*k*[1]⋅*a*) = *k* ⋅ *a*,\
    \ where *k* = *k*[1] ⋅ *k*[2] ∈ *Z*. Hence, by definition, *a*|*c*. Similarly,\
    \ other properties can also be proved using the basic algebraic properties and\
    \ the definition of divisibility and are left as an exercise due to constraints\
    \ on the book length.\n\nAn integer may not be completely divisible by another;\
    \ in that case there will be a quotient (*q*) and a remainder (*r*). The division\
    \ theorem states this fact as, for any integer *a* and a positive integer *n*,\
    \ ∃ a unique integer *q* and *r* : 0 ≤ *r* < *n* and *a* = *q* ⋅ *n* + *r*. If\
    \ a number is completely divisible then *r* = 0; otherwise, *r* ∈ \\[1,*n*−1\\\
    ].\n\n### [1.1.2 Prime numbers](#contents.xhtml#rsec1_1_2)\n\nFor any integer,\
    \ *x* > 1, there exists at least two positive divisors, *x* and 1, which are called\
    \ trivial divisors for that number. A number is said to be prime if there exists\
    \ no non-trivial divisor for it. If there exists at least one non-trivial divisor,\
    \ then that number is called a composite number \\[[2](#01chap_01.xhtml#ref1_2)\\\
    ].\n\n*Theorem 1*: There are infinite number of primes.\n\n*Proof*: The proof\
    \ is by contradiction. Let there are finite number of primes: (2,3,……,*p*[*k*]) *a**n**d* *p*[*k*]\
    \ is the largest prime. Construct another number *m*: product of all primes  + 1.\n\
    \n*Observation*: None of the primes can divide *m* (leaves remainder 1). So, *m*\
    \ is divisible by 1 and itself, hence *m* must be another prime number. In this\
    \ way one can construct an infinite number of primes.\n\n#### [1.1.2.1 Fundamental\
    \ theorem of arithmetic](#contents.xhtml#rsec1_1_2_1)\n\nThe fundamental theorem\
    \ of arithmetic states that every positive integer can be represented uniquely\
    \ as the product of primes, i.e. *n* = *p*[1]^(*e*[1]) ⋅ *p*[2]^(*e*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *p*[*m*]^(*e*[*m*]),\
    \ where  *p*[1] < *p*[2] <  ⋅  ⋅  ⋅  ⋅  ⋅  ⋅  < *p*[*m*] and all are distinct\
    \ \\[[3](#01chap_01.xhtml#ref1_3)\\]. For example: 100 = 2 ⋅ 2 ⋅ 5 ⋅ 5 = 2² ⋅ 5²;\
    \ 81 = 3⁴.\n\nThe proof is by contradiction. Let there are two different prime\
    \ factorizations of *n*:\n\n*   *n* = *p*[1]^(*e*[1]) ⋅ *p*[2]^(*e*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *p*[*m*]^(*e*[*m*])\n\
    \n*   *n* = *q*[1]^(*d*[1]) ⋅ *q*[2]^(*d*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *q*[*r*]^(*d*[*r*])\n\
    \nTherefore, *p*[1]^(*e*[1]) ⋅ *p*[2]^(*e*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *p*[*m*]^(*e*[*m*]) = *q*[1]^(*d*[1]) ⋅ *q*[2]^(*d*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *q*[*r*]^(*d*[*r*]).\
    \ Now, we have to prove *p*[1] = *q*[1] and *e*[1] = *d*[1] provided *p*[1] = *q*[1].\n\
    \n*   If *p*[1] ≠ *q*[1], then *p*[1] can't divide any of the primes *q*[1], ……*q*[*r*]\
    \ is relatively prime to all *q*[1], ……*q*[*r*],  *t**h**e**n* *p*[1] cannot divide\
    \ *n* (because *n* = *q*[1]^(*d*[1]) ⋅ *q*[2]^(*d*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *q*[*r*]^(*d*[*r*])).\
    \ But this is not true. Hence *p*[1] = *q*[1]\n\n*   Assume *e*[1] < *d*[1] then\
    \ *d*[1] = *e*[1] + *h*, *h* > 0\n\n    *   *p*[1]^(*e*[1]) ⋅ *p*[2]^(*e*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *p*[*m*]^(*e*[*m*]) = *q*[1]^(*d*[1]) ⋅ *q*[2]^(*d*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *q*[*r*]^(*d*[*r*])\n\
    \n    *   *p*[1]^(*e*[1]) ⋅ *p*[2]^(*e*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *p*[*m*]^(*e*[*m*]) = *q*[1]^(*e*[1] + *h*) ⋅ *q*[2]^(*d*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *q*[*r*]^(*d*[*r*])\n\
    \n    *   *p*[2]^(*e*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *p*[*m*]^(*e*[*m*]) = *q*[1]^(*h*) ⋅ *q*[2]^(*d*[2]) ⋅  ⋅  ⋅  ⋅  ⋅  ⋅ *q*[*r*]^(*d*[*r*])\n\
    \nFrom the above equation we can observe that RHS is divisible by *q*[1] while\
    \ the LHS is not, which is impossible. Hence *e*[1] = *d*[1]\n\n#### [1.1.2.2\
    \ Prime number properties](#contents.xhtml#rsec1_1_2_2)\n\nFollowing are the key\
    \ properties of the prime numbers:\n\n*   If a prime number *p* divides *a**b*\
    \ then either *p*|*a* *o**r* *p*|*b*.\n\n*   If *m*|*a* *a**n**d* *n*|*a*, and\
    \ if *m* and *n* has no divisor greater than 1 in common (i.e. *m* and *n* are\
    \ relatively prime) then *m**n*|*a*.\n\n*   If *p*^α||*n*, then *p*^β||*n* for\
    \ some 0 ≤ β ≤ *α*.\n\nLet *n* = *p*[1]^(*α*[1]) ⋅ *p*[2]^(*α*[2]) ⋅ … ⋅ *p*[*r*]^(*α*[*r*]),\
    \ the total number of divisors of *n* is the product of the number of possibilities\
    \ for each prime power, i.e. (*α*[1]+1)(*α*[2]+1)……(*α*[*r*]+1)\n\n### [1.1.3\
    \ Greatest common divisor (GCD)](#contents.xhtml#rsec1_1_3)\n\nThe greatest common\
    \ divisor of two numbers *a* and *b*, *g**c**d*(*a*,*b*), is the largest integer\
    \ *d* that divides both *a* and *b*.\n\n*g**c**d*(*a*,*b*) = *m**a**x*{*d*:*d*|*a* *a**n**d* *d*|*b*}\
    \  \n\nIf we have prime factorization of *a* and *b* then *g**c**d*(*a*,*b*) can\
    \ be easily written as follows:\n\n*   Given *a* = *p*[1]^(*α*[1]) ⋅ *p*[2]^(*α*[2]) ⋅ … ⋅ *p*[*k*]^(*α*[*k*])\
    \ and *b* = *p*[1]^(*β*[1]) ⋅ *p*[2]^(*β*[2]) ⋅ … ⋅ *p*[*k*]^(*β*[*k*]).\n\n*\
    \   Take all the primes which occur in both factorizations raised to the minimum\
    \ of two exponents."
