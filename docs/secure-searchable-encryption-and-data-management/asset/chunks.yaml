    # Boneh 等人 [24] 开发了公钥设置下的首个可搜索加密方案，称为带关键词搜索的公钥加密，简称 PEKS。


    在可用的公钥加密原语中，他们采用基于身份的加密（IBE）作为底层方案。他们利用与用户身份对应的公钥来加密数据文件及其中包含的关键词。该方案旨在实现从邮件服务器高效检索加密邮件。数据所有者，或更准确地说是发送者，希望发送一封使用接收者公钥加密的邮件，同时附带使用同一密钥加密的关键词。发送的邮件存储在接收者的邮件服务器上，接收者需要一种机制来从中高效地仅检索所需的邮件。这种高效机制即为可搜索加密技术；若无此技术，接收者首先需要下载所有邮件，然后在本地使用其私钥进行解密。但有了可搜索加密技术，接收者可根据当前需求提取邮件，仅需解密那些选定的邮件。这种完整机制适用于存在单一预期接收者的场景；然而，发送者的数量不受限制。现在，如果我们想将同一消息发送给多个接收者，能否应用上述相同机制？答案是肯定的。但这不会是一种高效机制。要向多个接收者发送同一消息，我们需要用每个接收者的公钥多次加密同一消息，这会导致系统中存在大量冗余。既然我们想要一种高效机制，就有必要探索其他加密原语，如基于属性的加密（ABE），它可能消除这种冗余，我们将在第
    5 章讨论此类方案，该章专门讨论公钥设置下的可搜索加密。


    ## 3.3.2.2.1 PEKS 洞察


    考虑著名的 Alice 和 Bob 加密示例，Bob 想要发送一条邮件消息 `m ∈ ℳ`，连同若干关键词 `{w[1], w[2], …, w[l]} ∈
    W` 给 Alice。这些关联关键词稍后将用于搜索对应的邮件消息。Bob 生成如下密文：`E[A[pub]](m) ∥ PEKS(A[pub], w[1])
    ∥ … ∥ PEKS(A[pub], w[l])`，其中 `E[A[pub]](m)` 是任意标准公钥加密算法，它使用 Alice 的公钥 `A[pub]`
    生成加密邮件消息，而 PEKS 是支持关键词搜索的算法。生成的密文存储在 Alice 的邮件服务器上。为执行搜索，Alice 使用其密钥/私钥为其想要搜索的特定关键词生成一个秘密值，该秘密值称为搜索陷门/令牌。邮件服务器将使用此陷门，通过搜索算法查找包含该关键词的消息。若找到匹配关键词，搜索算法返回二进制输出
    1，否则返回 0。PEKS 方案涉及的算法详情见表 3.2。


    **表 3.2** 带关键词搜索的公钥加密 (PEKS) [24]


    ```

    PEKS 方案

    PEKS 方案使用两个哈希函数 H[1]、H[2] 以及一个对称双线性映射 e : G[1]×G[1]→G[T]，其中 G[1] 和 G[T] 是素数阶 p
    的循环群。


    1. 密钥生成：随机选择 α ∈ Z[p]^(*)，并找到 G[1] 的生成元 g。计算 K[pub] = (g, h = g^(α)) 和 K[pri]
    = α。


    2. PEKS (K[pub], w)：随机选择 r ∈ Z[p]^(*)，并计算 t = e(H1, h^(r))。输出 C = [g^(r), H[2][t]]。


    3. 陷门 (K[pri], w)：输出 T[w] = H1^(α) ∈ G[1]。


    4. 搜索 (C, T[w])：检验 H2)) 是否等于 H2，若是，则找到匹配并返回 1；否则返回 0。

    ```


    如前所述，PEKS 基于 IBE 方案。现在让我们考察其原理。`K[pub]` 扮演公共参数的角色，而 `K[pri]` 的作用就像典型 IBE 方案中的主密钥。IBE
    密文是使用公共参数（即 `K[pub]`）和关键词 `w` 生成的，这里 `w` 充当身份标识。在陷门算法（步骤 3）中，本质上是为 ID 生成一个秘密密钥，在当前方案中该
    ID 即为 `w`。此步骤就像在 IBE 方案中获取 ID 的秘密密钥。搜索算法类似于 IBE 方案中的解密算法，它接收密文和秘密密钥（即当前方案中的陷门）。


    ### PEKS 亮点


    *   发送者与接收者之间无需交互。

    *   支持多数据所有者（发送者）和单一数据使用者（接收者），俗称 M/S 设置 [25]。

    *   应用于安全邮件检索。

    *   适用于多项式大小的关键词空间。

    *   PEKS 在随机预言机模型下，基于双线性 Diffie-Hellman (BDH) 假设，能抵抗自适应选择关键词攻击。

    *   假设邮件服务器是诚实但好奇的，即它正确执行所有算法，但可能试图获取一些有用信息。


    ### PEKS 局限


    *   需要安全信道以防止窃听。

    *   为支持多数据使用者，需用每个预期用户的公钥加密同一消息并发送，这会导致冗余。

    *   由于关键词空间较小，PEKS 及所有公钥可搜索加密方案均遭受关键词猜测攻击 (KGA) [26] 的威胁，除非显式处理。

    *   PEKS 设计为一次性使用。服务器可能记忆陷门并利用它获取未来邮件的信息。

    *   不支持多关键词搜索。


    上述要点中提到的安全相关定义将在下一章详细解释。PEKS 的两大主要缺陷——服务器与数据使用者之间需要安全信道以及 KGA——一直是 PEKS 后续研究的焦点，将在后续章节讨论。


    ## 3.3.2.2.2 无安全信道 PEKS


    构建安全信道以发送陷门成本高昂，因此人们致力于消除这一限制，使陷门足够安全以便在公共信道上发送。


    ### BSS2：Baek 等人 [27] 提出了首个无安全信道 PEKS 方案。


    作者解决了 PEKS 方案设计中的缺陷，即服务器可能利用存储的陷门自行执行搜索，而无需接收者知情。解决此问题的简单方法是限制关键词仅使用一次。然而，如果用户想要重复使用关键词，此方案并不切实际。Baek
    等人 [27] 建议了一种方案，即定期刷新关键词，这是通过附加时间段信息完成的；用户在生成陷门时追加其想要的时间段。他们将此过程称为刷新关键词。例如，如果数据使用者想为关键词（如
    URGENT）生成陷门，则在生成陷门前，用户会先按如下方式追加时间段：`URGENT||01/08/2019`。

    '
