    # 6.2 数据集


    有不同的数据集可用于进行模拟并评估可搜索加密方案中所涉及算法的时间复杂度。


    ## Enron 电子邮件数据集


    Enron 电子邮件数据集包含 Enron 组织员工生成的约 500,000 封电子邮件 [10]。联邦能源监管委员会在其对 Enron 倒闭的调查过程中获取了该数据集。该数据集是在“会学习和组织的认知助手”（CALO）项目下收集和整理的。它包含约
    150 位用户的统计数据，在大多数情况下为 Enron 的高级管理人员。数据被组织到文件夹中。联邦能源监管委员会在其研究过程中将这些记录公开并发布到了互联网上。后来，该数据集被麻省理工学院的
    Leslie Kaelbling 购买，她发现了一些完整性问题并进行了修正，随后将该数据集提供给研究项目使用。无效的电子邮件地址被转换为通用形式，如 `user@enron.com`（当指定了收件人时）或
    `no_address@enron.com`（当未指定收件人时）。


    ## 互联网征求意见稿（RFC）


    该数据集包含 6,870 个纯文本文件，总大小约为 349MB [11]。为了从每个 RFC 文件中提取关键词，通常使用密闭式词频计数器 [12]。


    # 6.3 跨域应用


    可搜索加密不仅限于密码学领域，还可以应用于不同平台并与之结合。除了在云平台上应用可搜索加密外，文献中还出现了其他应用场景。研究人员已将这一概念应用并测试于不同平台，如物联网、无线传感器网络（WSN）、雾计算及其组合
    [13, 14, 15]。最近，区块链技术被用于构建更稳健的可搜索加密方案。这方面的大多数进展见于 2017 年以后。


    ## 云辅助无线传感器网络（CWSN）


    可搜索加密应用出现的一个新领域是云辅助无线传感器网络（CWSN）。Xu [16] 为 CWSN 提出了一种轻量级可搜索加密方案，降低了生成密文和执行搜索的成本。传感器网络所有者生成公钥和私钥对，并将公共组件存储在所有传感器节点上。传感器节点收集并将加密数据存储在云服务器上。为了检索数据，数据所有者为关键词生成陷门并将其发送给云服务器以执行搜索。


    ## 基于云的物联网


    物联网设备贡献了当今数字世界中的大部分数据，收集的数据存储在云服务器中。收集的数据可能是敏感的；因此，可搜索加密可用于基于云的物联网。Wu 等人 [17]
    为此提出了一种可搜索加密方案。其系统的工作原理与公钥设置下的标准可搜索加密相同。除了基本功能外，他们专注于开发抗 KGA（关键词猜测攻击）的方案。


    ## 雾计算


    Miao 等人 [18] 将细粒度联合关键词搜索应用于雾计算。它基本上是云计算的一种扩展，其中雾节点被放置在终端用户和云之间。他们的方案是轻量级的，因为大多数计算密集型任务被委托给雾节点。终端用户仅执行部分计算；最终密文甚至最终陷门由雾节点生成并发送给云服务器。雾节点接收云服务器返回的搜索结果并执行部分解密，以进一步减轻终端用户的负担。云服务器像往常一样扮演搜索者的角色，但它不再将搜索结果返回给终端用户，而是返回给执行所有必要计算的中间雾节点。他们还考虑了访问策略中属性更新的过程，因此支持动态策略。来自终端用户的数据由这些用户使用的物联网设备（可穿戴或移动设备）收集。


    ## 区块链技术


    在此期间，当研究正在测试可搜索加密在上述不同场景中的适用性时，可搜索加密方案的发展历程中迎来了一个重要里程碑。这一里程碑是通过利用本世纪最具创新性的技术——区块链技术——实现的。我们已经看到这项技术在金融、医疗、投票等众多领域引发了巨大的革命。Hu
    等人 [19] 为可搜索加密提出了一个全新的平台。他们利用智能合约的力量，在对称密钥设置下开发了一种安全的可搜索加密。由此产生的方案相当稳健，因为我们现在无需担心恶意云服务器或云服务器是否不诚实等情况。区块链技术的固有设计解决了这些问题。数据所有者不再使用云服务器，而是将其数据以加密形式存储在公共区块链平台以太坊上。该方案已实现并测试，以检查其在实际场景中的适用性。最近在
    2020 年 6 月，Liu 等人 [17] 在公钥设置下利用区块链技术开发可搜索加密的应用已被看到。他们没有用区块链取代云服务器，而是利用区块链技术来减轻计算负担并构建更现实的
    SE 方案。他们使用联盟链来初始化系统、生成最终陷门并处理用户撤销事件。云服务器像往常一样存储加密数据并代表用户执行部分解密。这里的区块链技术通过完全消除对中心化权威的需求，使
    SE 方案去中心化，并减轻了数据用户的计算负担。


    # 6.4 章节总结


