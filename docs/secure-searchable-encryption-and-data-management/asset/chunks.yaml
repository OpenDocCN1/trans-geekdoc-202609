    time the data user has to communicate with the data owner to retrieve desired
    information. Further, the data owner cannot freely choose the keywords. It also
    requires secure channel between the data user and the server and between the data
    owner and the data user.


    ### 3.3.2.2.4 SCF-PEKS with KGA security


    This section will cover all those schemes which do not require a secure channel
    to ensure trapdoor security and are also immune to KGA.


    **RPS2+:** The PEKS scheme with a designated tester (`dPEKS`) [[31](#03chap_03.xhtml#ref3_31)]
    suffers from KGA. This scheme was revisited by Rhee et al. [[35](#03chap_03.xhtml#ref3_35)]
    to make it immune to KGA. They have identified that in the previous PEKS as well
    as in their own `dPEKS` schemes, it is impossible to ensure trapdoor privacy.
    By capturing a valid trapdoor nothing can ever stop an attacker from guessing
    a keyword and generating the ciphertext for that keyword using public parameters
    and obtaining a test result to check if the guessed keyword is correct or not.
    Therefore, to ensure trapdoor privacy it is necessary to modify the structure
