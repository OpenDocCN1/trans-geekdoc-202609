- raw: '*Cloud Server:* The cloud server (CU) is owned by a third party to provide
    services like storage. It stores the encrypted data and performs a search on this
    data using the search trapdoor supplied by the DU. If a standard SE is used, then
    the search algorithm takes only the ciphertext and the trapdoor for the keyword;
    otherwise, it may additionally requirethe *P**P*, if an ABE scheme is used, or
    *P**K*[*S**E*], if some transformation method is used. *P**K*[*S**E*] denotes
    the public key of the transformed searchable encryption scheme.


    ### [5.1.3 Flow of information between different parties involved in an SE system](#contents.xhtml#rsec5_1_3)


    The flow of information between different parties in an IBE-based SE system is
    explained in the following steps as shown in [Figure 5.2](#05chap_05.xhtml#fig5_2).
    *i*) The DO sends data along with the associated keywords in an encrypted form
    under the public key of recipient, *K*[*p**u**b*] using the *G**e**n**I**n**d**e**x*(*K*[*p**u**b*],*w*[*i*])
    algorithm. The resulting encrypted data along with its index is stored at the
    remote server for sharing it with other users. *i**i*) The DU generates the trapdoor
    for the keyword which is associated with that particular file using the *G**e**n**T**r**a**p*(*K*[*p**r**i*],*w*[*i*])
    algorithm. The generated trapdoor will enable the cloud server to perform search
    if it is generated by the user for whom the data is intended, i.e. the trapdoor
    is generated using the private key of the same user whose public key was used
    to generate the index. *i**i**i*) The CS performs the search over encrypted data,
    *C*[*i*], using the search trapdoor, *T*[*j*], sent by the DU. The search operation
    is done by the cloud server on the behalf of DU using the *S**e**a**r**c**h*(*C*[*i*],*T*[*j*])
    algorithm. If the keyword corresponding to the search trapdoor is found then the
    cloud server returns binary output 1; otherwise, it outputs 0.


    ![Figure 5.2Flow of information in an IBE-based SE system.](images/fig5_2.jpg)


    *Figure 5.2*Flow of information in an IBE-based SE system.


    The flow of information between different parties in an ABE-based SE system is
    explained in the following steps as shown in [Figure 5.3](#05chap_05.xhtml#fig5_3).:
    *i*) The TA initializes the system using the *S**e**t**u**p*(*λ*) algorithm which
    takes security parameter *λ* as input. Also, it issues the essential credentials
    to the cloud users using *K**e**y**G**e**n*(*M**S**K*) algorithm which takes the
    master secret key as input. *i**i*) A data owner is the one who would like to
    outsource their collection of data along with some keywords to the cloud server
    for the purpose of sharing. Owing to the confidential nature of the data, it is
    stored in an encrypted form. To upload the data over the cloud server, the data
    owner uses *G**e**n**I**n**d**e**x*(*P**P*,*w*[*i*]) which takes public parameters,
    *P**P*, and the metadata item, *w*[*i*], associated with the data file as input
    and generates the ciphertext, *C*[*i*] of *w*[*i*]. Once the data is uploaded
    to the cloud server, now it can be searched by the authorized users. *i**i**i*)
    A DU is the one who wants to retrieve the data stored by the data owner at the
    cloud server. If the user is authorized, then he/she can generate a trapdoor for
    the keyword associated with the data file and give it to the cloud server to perform
    search. Suppose a DU wants to retrieve a data file which contains a particular
    keyword, *w*[*j*]. The DU will first generate the search trapdoor/token using
    his secret credentials to run *G**e**n**T**r**a**p*(*S**K*[*u*],*w*[*j*]) and
    then send the trapdoor, *T*[*j*], to the cloud server. *i**v*) A cloud server
    stores the encrypted data and performs search operation on the behalf of the DU.
    The cloud server is assumed to be honest, i.e. it correctly executes the search
    algorithm. Upon reception of the search trapdoor/token the cloud server will perform
    search the encrypted data stored over it using *S**e**a**r**c**h*(*C*[*i*],*T*[*j*]).
    If the search trapdoor/token is generated by an authorized user having valid secret
    credentials, then the public component in the ciphertext and the corresponding
    secret components in the search trapdoor/token will get cancelled out as per the
    rule of an encryption system. Therefore, an equality condition will hold if the
    keyword in the ciphertext and the search trapdoor/token matches. In such a scenario,
    it is said that the keyword being searched is found and therefore a binary value
    1 is returned as output. Otherwise, 0 is returned which signifies that the keyword
    is not found. In another situation, if the search trapdoor/token is not generated
    by the authorized user then the search process will terminate and ⊥ (null) is
    returned to the user. It signifies that the user has no right to perform search
    over the encrypted data shared by data owner over common storage managed by some
    remote cloud server.


    ![Figure 5.3Flow of information in ABE-based SE system.](images/fig5_3.jpg)


    *Figure 5.3*Flow of information in ABE-based SE system.


    During the entire process in both the models, the cloud server is assumed to be
    honest and will correctly execute all the algorithms but it may be curious to
    find some relevant information. Therefore, while developing a searchable encryption
    scheme we must ensure that the cloud server will not get any information about
    the plaintext of the keyword being searched. This model is known as security against
    chosen keyword attack (CKA) which is formally introduced in the next section.


    ## [5.2 BROAD CATEGORIES OF SEARCHABLE ENCRYPTION IN A PUBLIC-KEY SETTING](#contents.xhtml#rsec5_2)


    In this section, we will discuss different categories of SE schemes based on the
    type of underlying encryption scheme used to develop the searchable encryption
    schemes \[[1](#05chap_05.xhtml#ref5_1)\]. In public-key setting there are some
    leading techniques like IBE \[[2](#05chap_05.xhtml#ref5_2), \[[3](#05chap_05.xhtml#ref5_3)\][4](#05chap_05.xhtml#ref5_4)\],
    ABE \[57\], hidden vector encryption (HVE) etc. which are frequently used for
    the construction of searchable encryption scheme. Among these, we will discuss
    the searchable encryption schemes using the first two primitives, i.e. IBE and
    ABE.


    ### [5.2.1 IBE-based SE schemes](#contents.xhtml#rsec5_2_1)


    The first IBE-based searchable encryption scheme was developed by Boneh et al
    \[[8](#05chap_05.xhtml#ref5_8)\]; a detailed description of this scheme and some
    of its variants has already been given in [Chapter 3](#03chap_03.xhtml). In this
    section, we will discuss the searchable encryption schemes developed using a transformation
    from the IBE scheme. The general transformation mechanism from an IBE to searchable
    encryption is shown below in [Figure 5.4](#05chap_05.xhtml#fig5_4).


    ![Figure 5.4Transformation mechanism from IBE to searchable encryption.](images/fig5_4.jpg)


    *Figure 5.4*Transformation mechanism from IBE to searchable encryption.


    The first searchable encryption using the transformation method was proposed by
    Khader \[[9](#05chap_05.xhtml#ref5_9)\]. A transformation method was applied on
    a k-resilient IBE \[[2](#05chap_05.xhtml#ref5_2)\] scheme to construct the PEKS
    scheme. They remarked on some facts about the transformation mechanism, such as
    the IBE scheme which we are planning to transform to IBE must be anonymous, otherwise
    it would expose the keywords. Another fact concerns the consistency of the resulting
    SE scheme; they stated that the underlying scheme must be secure in the appropriate
    security model, because only then would the resulting scheme be consistent and
    secure. The proposed scheme is consistent because the underlying IBE scheme is
    secure against chosen ciphertext attack. Further, they performed multi-keyword
    search and also eliminated the need for the secure channel.


