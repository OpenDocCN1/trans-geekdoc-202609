  trans: '

    此外，为了移除安全通道，Baek 等人 [27] 为服务器使用了一对公私钥（`PK`、`SK`）。除了 PEKS 算法外，`SCF_PEKS` 还拥有一个用于为服务器生成密钥对的额外算法。为了生成关键字密文，他们将使用接收者的公钥以及服务器的公钥。为了生成密文，`SCF_PEKS`
    方案将像 PEKS 方案一样使用接收者的私钥。最后，搜索算法存在细微差别；除了关键字密文和陷门外，它还需要服务器的私钥，以确保抵御外部攻击者的安全性。


    他们确保了抵御恶意服务器以及外部攻击者的安全性。恶意服务器在拥有该关键字的陷门之前，无法区分两个关键字的密文。同样，即使外部攻击者拥有所有关键字的陷门，也无法区分两个关键字的密文，因为他没有服务器的私钥。


    **GZP：** Gu 等人 [28] 提出了另一种无需安全通道要求的 PEKS 方案。与 Baek 等人 [27] 提出的 `SCF_PEKS` 方案类似，该方案同时使用接收者的公钥和服务器的公钥来生成关键字密文，使用接收者的私钥生成陷门，并在搜索算法中也使用云服务器的私钥。作者开发了两种可搜索加密方案。在第一种方案中，生成关键字密文和陷门时不使用配对运算。在第二种方案中，生成陷门时不使用配对运算，且移除了安全通道限制，这使其在计算上更高效。


    **FSG+：** Fang 等人 [29] 提出了另一种无安全通道的 PEKS 方案。与 `SCF_PEKS` 和 `SCF_PEKS2` 一样，该方案也为服务器生成单独的公钥和私钥。他们的方案基于
    Gentry 的 IBE [30]，后者是在具有短公共参数的标准模型中已知的安全方案。由于底层的 Gentry IBE 方案，他们证明了由此产生的可搜索加密方案在标准模型下也是安全的，从而为
    `SCF_PEKS` 方案增添了一个里程碑。


    **RPS+：** Rhee 等人 [31] 提出的带指定测试者的 PEKS 方案为无安全通道的 PEKS 增添了另一个里程碑。在这里，作者通过考虑更强大的对手，改进了
    Baek 等人 [27] 方案的安全模型。在 Baek 等人的方案中，攻击者只能访问陷门，利用这些陷门攻击者无法获得密文和陷门之间的关系。然而，实际上攻击者可能获得任意关键字的陷门，并能获得与这些陷门相关的密文（前提是该密文不是挑战密文）。其次，Baek
    等人的安全模型通过限制攻击者将其私钥共享给第三方来限制攻击者的能力。Rhee 等人 [31] 在其称为 `dPEKS` 的方案中解决了上述局限性，其中只有数据所有者选定的指定服务器才能执行搜索。主要重点是通过增强对手的能力来提高安全性。对手可以发布其公钥而不泄露其私钥。


    ### 3.3.2.2.3 抗 KGA 的 PEKS 安全性


    使用公钥密码学设计的可搜索加密方案很可能遭受 KGA [32]。因为关键字空间的大小是多项式的，即通常使用一组众所周知的关键字来执行搜索，对手可以猜测对应某个有效捕获陷门的关键字，并为该关键字生成密文。然后对手将其提交给云服务器以获取搜索结果，如果搜索结果为
    1，则表示猜测的关键字正确，否则重复相同过程以获取关于关键字密文的信息。在此过程中，对手获得了关键字的明文，这是不期望的。这个过程被称为离线 KGA，Byun
    等人 [26] 对 PEKS [24] 方案发起了首次成功的 KGA 攻击。之后，Yau 等人 [33] 又做了一次尝试，他们成功地对当时基于 PKE 的多种可搜索加密方案发起了
    KGA。在本节中，我们将讨论应对 KGA 所做的努力。


    **带注册关键字搜索的公钥加密：** Tang 和 Chen [34] 提出了一种能够抵御 KGA 的 `PERKS` 方案。`PERKS` 要求在数据所有者为该关键字生成密文之前，数据所有者和数据用户之间进行关键字注册。为此，数据用户首先定义一组关键字，数据所有者可以为这些关键字生成密文。在关键字注册阶段，接收者（数据用户）将使用其私钥和关键字为该关键字生成预标签。现在，发送者（数据所有者）将使用此预标签为该关键字生成密文，在该方案中称为标签。预标记机制使该方案免疫于
    KGA。它在垃圾邮件检测中有应用。它具有将任意数量的关键字密文聚合为单个密文的特性。聚合后的密文大小与单个密文相同。因此，该方案可以批量模式测试多个关键字密文。它是公钥设置中第一个要求数据所有者和数据用户之间交互的方案。然而，这不被认为是实用的，因为数据用户每次都必须与数据所有者通信以检索所需信息。此外，数据所有者不能自由选择关键字。它还要求数据用户与服务器之间、数据所有者与数据用户之间存在安全通道。


    ### 3.3.2.2.4 具有 KGA 安全性的 SCF-PEKS


    本节将涵盖所有那些不需要安全通道来确保陷门安全且也能免疫 KGA 的方案。


    **RPS2+：** 带指定测试者的 PEKS 方案（`dPEKS`）[31] 遭受 KGA。Rhee 等人 [35] 重新审视了该方案，使其免疫于 KGA。他们发现，在之前的
    PEKS 以及他们自己的 `dPEKS` 方案中，确保陷门隐私是不可能的。通过捕获一个有效的陷门，没有任何东西能阻止攻击者猜测关键字，并使用公共参数为该关键字生成密文，获得测试结果以检查猜测的关键字是否正确。因此，为了确保陷门隐私，有必要修改陷门的结构。在这里，陷门是使用服务器的公钥以及接收者的私钥生成的。因此，无论有没有服务器的私钥，陷门都不会泄露关于关键字的任何信息。他们推断出陷门安全性意味着抗
    KGA 安全性。

    '
