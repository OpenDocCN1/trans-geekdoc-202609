    \\ \\\\end{matrix} \\\\\\\\ \\\\end{matrix} \\\\\\\\ \\\\end{matrix}$. Find zeros\
    \ and ones.\n\n*Solution*: Right zero \\= *a*, *b*, No left zero, Left Identity\
    \ \\= *b*, No right identity.\n\n*Theorem*: Let ∘ be a binary operation on *S*\
    \ with left identity 1[*l*] and right identity 1[*r*].  Then 1[*l*] = 1[*r*] and\
    \ this is referred as a two-sided identity.\n\n*Proof*: From left identity: 1[*l*] ∘ *x* = *x*  *P**u**t*  *x* = 1[*r*].\
    \ From right identity: 1[*l*] ∘ 1[*r*] = 1[*r*]. *x* ∘ 1[*r*] = *x* *P**u**t* *x* = 1[*l*],\
    \ 1[*l*] ∘ 1[*r*] = 1[*l*]. Hence 1[*r*] = 1[*l*].\n\n### [1.2.1 Semigroup](#contents.xhtml#rsec1_2_1)\n\
    \nA semigroup is an algebraic structure with signature  < *S*,  ∘ >. Semigroups\
    \ usually consist of algebraic structures with single binary operation and satisfy\
    \ the closure and associative properties. For example:  < ℤ,   + >,  < ℤ,    ⋅ >,\
    \  < ℝ,   + >,  < ∑^(\\*), *c**o**n**c**a**t**e**n**a**t**i**o**n* >.\n\n### [1.2.2\
    \ Monoid](#contents.xhtml#rsec1_2_2)\n\nA monoid is an algebraic structure with\
    \ signature  < *S*, ∘,1> where ∘ is a binary associative operation and 1 is a\
    \ two-sided identity for operation ∘. It satisfies the closure, associative and\
