    ### 5.2.2 基于ABE的SE方案 {#contents.xhtml#rsec5_2_2}


    基于属性的可搜索加密（ABSE）是一种在云中对加密数据进行安全搜索的技术\[[14](#05chap_05.xhtml#ref5_14)\]。在ABSE方案中，借助访问策略/结构实现细粒度访问控制，该策略/结构表示用户可能拥有的各种属性之间的关系。该访问策略要么与密文关联，要么与用户的密钥关联，因此产生了两种设计框架，两者均可用作ABE。如果访问策略嵌入在密文中，则称为密文策略ABE（CP-ABE）\[[15](#05chap_05.xhtml#ref5_15),
    [16](#05chap_05.xhtml#ref5_16)\]；如果与密钥关联，则称为密钥策略ABE（KP-ABE）\[[6](#05chap_05.xhtml#ref5_6),
    [17](#05chap_05.xhtml#ref5_17)\]。


    在CP-ABE中，数据所有者完全控制其数据，因为访问策略与密文关联，数据所有者可通过它定义可访问其数据的用户。另一方面，KP-ABE适用于数据所有者想要广播其数据的场景。在这里，只有其访问策略与广播数据中存在的属性一致的用户才能访问数据。在这两种框架中，为了提供细粒度访问控制，都需要一个称为“属性”的额外实体来决定谁访问什么。属性可以关于任何人或任何事物。例如，*计算机工程系有一名博士研究生*。这里，博士和计算机工程是该用户的属性。如果学院发布了计算机工程系的成绩，则拥有此属性的用户将能够查看其成绩。由于这些属性，密文和用户密钥中的组件数量会相应增加。因此，在存储成本和计算成本方面复杂度都会增加。因此，需要开发安全高效的ABSE方案，通过消除对属性的依赖，使密文和密钥等的大小保持常数。文献中已提出许多ABSE方案以支持多用户云存储环境\[[18](#05chap_05.xhtml#ref5_18),
    [19](#05chap_05.xhtml#ref5_19), [20](#05chap_05.xhtml#ref5_20)\]。ABE与SE的结合确实提供了细粒度搜索能力，但这是以增加存储成本和计算成本的复杂度为代价的\[[21](#05chap_05.xhtml#ref5_21)\],
    \[[22](#05chap_05.xhtml#ref5_22)\]。


    考虑到篇幅限制，我们将重点介绍一些基于KP-ABE和CP-ABE的可搜索加密方案。


    #### 5.2.2.1 VABKS {#contents.xhtml#rsec5_2_2_1}


    Zheng等人\[[21](#05chap_05.xhtml#ref5_21)\]开发了一种同时使用KP-ABE和CP-ABE作为底层加密技术的关键字搜索方案。他们增加了搜索结果可验证性特性。因此，Zheng等人放宽了对云服务器的诚实假设，因为现在可以验证云服务器是否正确执行了搜索算法。他们的构造基于对称双线性映射，其中源群和目标群均为素数阶*p*。他们使用树数据结构表示的通用访问结构，并采用自顶向下的方法获取秘密值的份额。他们的方案在决策线性假设下，在选择性安全模型中对CKA安全。


    #### 5.2.2.2 基于属性的关键字搜索 {#contents.xhtml#rsec5_2_2_2}


    Sun等人\[[23](#05chap_05.xhtml#ref5_23)\]提出了一种适用于多用户设置且具有高效用户撤销功能的基于属性的关键字搜索方案。他们使用CP-ABE作为底层加密方案。他们声称在搜索复杂度方面具有可扩展性，搜索复杂度不随用户数量变化。他们的构造基于对称双线性映射，其中源群和目标群均为素数阶*p*，访问结构由AND门组成。他们采用了代理重加密和惰性重加密技术以实现高效的用户撤销。他们的方案支持联合关键字搜索，并在DBDH假设下对CKA具有选择性安全性。


    #### 5.2.2.3 一种基于密钥策略属性的临时关键字搜索 {#contents.xhtml#rsec5_2_2_3}

