    \n## 1.1 NUMBER THEORY\n\nNumber theory is an interesting facet of mathematics\
    \ that has attracted everyone from professional mathematicians to amateurs with\
    \ its captivating concepts. Number theory concepts and theorems are natural and\
    \ make sense even to a layman. However, proving them essentially requires both\
    \ the basic knowledge and strong background we expect from a graduate in Computer\
    \ Engineering. In this section, we will cover all the necessary concepts of number\
    \ theory needed for the development of searchable encryption schemes along with\
    \ their detailed proofs [[1]](#01chap_01.xhtml#ref1_1).\n\n### 1.1.1 Divisibility\n\
    \nDivisibility is the fundamental concept of number theory. Consider a set of\
    \ integers, `Z` = {…,−1,0,1,…}, we say `b` divides `a`, (`b`|`a`), if `a` = `k`\
    \ ⋅ `b`, where `a`, `b`, `k` ∈ `Z` [[2]](#01chap_01.xhtml#ref1_2). Alternatively,\
    \ one can also say that `a` is divisible by `b`, or `a` is a multiple of `b`,\
    \ or `b` is a factor/divisor of `a`. The trivial cases include: *i*) ∀`b` ∈ `Z`,\
    \ `b`|0, which denotes that every number divides 0, and *ii*) ∀`a`∈`Z`, 1|`a`,\
    \ which denotes that 1 divides every number.\n\n#### 1.1.1.1 Divisibility properties\n\
    \nThe following are key properties of divisibility, which can be easily verified\
    \ with the definition of divisibility:\n\n*   If `a`|`b` and `b`|`c` then `a`|`c`\n\
    *   If `a`|`b` then `a`|`b``c`, ∀`c` ∈ `Z`\n*   If `a`|`b` and `c`|`d` then `a``c`|`b``d`\n\
    *   If `m`: non-zero integer, then `a`|`b` iff `m``a`|`m``b`\n*   If `a`|`x` and\
    \ `a`|`y` then `a`|`c``x`+`d``y`, where `c`, `d` ∈ `Z`\n*   If `d`: non-zero integer\
    \ such that `d`|`a` `a``n``d` `a`≠0 then |`d`| ≤ |`a`|\n*   `a`|`b` and `b`|`a`\
    \ iff `a` = ± `b`\n*   If `a`|`b` and `a`|`c` then `a`|`b`±`c`\n\nIf `a`|`b`,\
    \ `b` = `k`[1] ⋅ `a` and `b`|`c`, `c` = `k`[2] ⋅ `b` = `k`[2] ⋅ (`k`[1]⋅`a`) =\
    \ `k` ⋅ `a`, where `k` = `k`[1] ⋅ `k`[2] ∈ `Z`. Hence, by definition, `a`|`c`.\
    \ Similarly, other properties can also be proved using the basic algebraic properties\
    \ and the definition of divisibility and are left as an exercise due to constraints\
    \ on the book length.\n\nAn integer may not be completely divisible by another;\
    \ in that case there will be a quotient (`q`) and a remainder (`r`). The division\
    \ theorem states this fact as, for any integer `a` and a positive integer `n`,\
    \ ∃ a unique integer `q` and `r`: 0 ≤ `r` < `n` and `a` = `q` ⋅ `n` + `r`. If\
    \ a number is completely divisible then `r` = 0; otherwise, `r` ∈ [1,`n`−1].\n\
    \n### 1.1.2 Prime numbers\n\nFor any integer, `x` > 1, there exists at least two\
    \ positive divisors, `x` and 1, which are called trivial divisors for that number.\
    \ A number is said to be prime if there exists no non-trivial divisor for it.\
    \ If there exists at least one non-trivial divisor, then that number is called\
    \ a composite number [[2]](#01chap_01.xhtml#ref1_2).\n\n**Theorem 1**: There are\
    \ infinite number of primes.\n\n**Proof**: The proof is by contradiction. Let\
    \ there are finite number of primes: (2,3,……,`p`[`k`]) `a``n``d` `p`[`k`] is the\
    \ largest prime. Construct another number `m`: product of all primes + 1.\n\n\
    **Observation**: None of the primes can divide `m` (leaves remainder 1). So, `m`\
    \ is divisible by 1 and itself, hence `m` must be another prime number. In this\
    \ way one can construct an infinite number of primes.\n\n#### 1.1.2.1 Fundamental\
    \ theorem of arithmetic\n\nThe fundamental theorem of arithmetic states that every\
    \ positive integer can be represented uniquely as the product of primes, i.e.\
    \ `n` = `p`[1]^(`e`[1]) ⋅ `p`[2]^(`e`[2]) ⋅ … ⋅ `p`[`m`]^(`e`[`m`]), where `p`[1]\
    \ < `p`[2] < … < `p`[`m`] and all are distinct [[3]](#01chap_01.xhtml#ref1_3).\
    \ For example: 100 = 2 ⋅ 2 ⋅ 5 ⋅ 5 = 2² ⋅ 5²; 81 = 3⁴.\n\nThe proof is by contradiction.\
    \ Let there are two different prime factorizations of `n`:\n\n*   `n` = `p`[1]^(`e`[1])\
    \ ⋅ `p`[2]^(`e`[2]) ⋅ … ⋅ `p`[`m`]^(`e`[`m`])\n*   `n` = `q`[1]^(`d`[1]) ⋅ `q`[2]^(`d`[2])\
    \ ⋅ … ⋅ `q`[`r`]^(`d`[`r`])\n\nTherefore, `p`[1]^(`e`[1]) ⋅ `p`[2]^(`e`[2]) ⋅\
    \ … ⋅ `p`[`m`]^(`e`[`m`]) = `q`[1]^(`d`[1]) ⋅ `q`[2]^(`d`[2]) ⋅ … ⋅ `q`[`r`]^(`d`[`r`]).\
    \ Now, we have to prove `p`[1] = `q`[1] and `e`[1] = `d`[1] provided `p`[1] =\
    \ `q`[1].\n\n*   If `p`[1] ≠ `q`[1], then `p`[1] can't divide any of the primes\
    \ `q`[1],……`q`[`r`] is relatively prime to all `q`[1],……`q`[`r`], `t``h``e``n`\
    \ `p`[1] cannot divide `n` (because `n` = `q`[1]^(`d`[1]) ⋅ `q`[2]^(`d`[2]) ⋅\
    \ … ⋅ `q`[`r`]^(`d`[`r`])). But this is not true. Hence `p`[1] = `q`[1]\n*   Assume\
    \ `e`[1] < `d`[1] then `d`[1] = `e`[1] + `h`, `h` > 0\n    *   `p`[1]^(`e`[1])\
    \ ⋅ `p`[2]^(`e`[2]) ⋅ … ⋅ `p`[`m`]^(`e`[`m`]) = `q`[1]^(`d`[1]) ⋅ `q`[2]^(`d`[2])\
    \ ⋅ … ⋅ `q`[`r`]^(`d`[`r`])\n    *   `p`[1]^(`e`[1]) ⋅ `p`[2]^(`e`[2]) ⋅ … ⋅ `p`[`m`]^(`e`[`m`])\
    \ = `q`[1]^(`e`[1] + `h`) ⋅ `q`[2]^(`d`[2]) ⋅ … ⋅ `q`[`r`]^(`d`[`r`])\n    * \
    \  `p`[2]^(`e`[2]) ⋅ … ⋅ `p`[`m`]^(`e`[`m`]) = `q`[1]^(`h`) ⋅ `q`[2]^(`d`[2])\
    \ ⋅ … ⋅ `q`[`r`]^(`d`[`r`])\n\nFrom the above equation we can observe that RHS\
    \ is divisible by `q`[1] while the LHS is not, which is impossible. Hence `e`[1]\
    \ = `d`[1]\n\n#### 1.1.2.2 Prime number properties\n\nFollowing are the key properties\
    \ of the prime numbers:\n\n*   If a prime number `p` divides `a``b` then either\
    \ `p`|`a` `o``r` `p`|`b`.\n*   If `m`|`a` `a``n``d` `n`|`a`, and if `m` and `n`\
    \ has no divisor greater than 1 in common (i.e. `m` and `n` are relatively prime)\
    \ then `m``n`|`a`.\n*   If `p`^α||`n`, then `p`^β||`n` for some 0 ≤ β ≤ `α`.\n\
    \nLet `n` = `p`[1]^(`α`[1]) ⋅ `p`[2]^(`α`[2]) ⋅ … ⋅ `p`[`r`]^(`α`[`r`]), the total\
    \ number of divisors of `n` is the product of the number of possibilities for\
    \ each prime power, i.e. (`α`[1]+1)(`α`[2]+1)……(`α`[`r`]+1)\n\n### 1.1.3 Greatest\
    \ common divisor (GCD)\n\nThe greatest common divisor of two numbers `a` and `b`,\
    \ `g``c``d`(`a`,`b`), is the largest integer `d` that divides both `a` and `b`.\n\
    \n`g``c``d`(`a`,`b`) = `m``a``x`{`d`:`d`|`a` `a``n``d` `d`|`b`}\n\nIf we have\
    \ prime factorization of `a` and `b` then `g``c``d`(`a`,`b`) can be easily written\
    \ as follows:\n\n*   Given `a` = `p`[1]^(`α`[1]) ⋅ `p`[2]^(`α`[2]) ⋅ … ⋅ `p`[`k`]^(`α`[`k`])\
    \ and `b` = `p`[1]^(`β`[1]) ⋅ `p`[2]^(`β`[2]) ⋅ … ⋅ `p`[`k`]^(`β`[`k`]).\n*  \
    \ Take all the primes which occur in both factorizations raised to the minimum\
    \ of two exponents.\n"
  trans: "\n**Mamta** 目前正在印度库鲁克舍特拉国家理工学院（NIT）计算机工程系，在 Brij B. Gupta 博士的指导下攻读应用密码学博士学位。她曾在印度库鲁克舍特拉国家理工学院计算机工程系获得\
    \ M.Tech. 学位。她拥有库鲁克舍特拉大学大学工程技术学院计算机工程专业的 B.Tech. 学位。她的研究兴趣包括数论与密码学、可搜索加密、信息安全和云计算。她已在\
    \ IEEE、Springer、Wiley 和 IGI Global 等多家知名出版商发表了多篇研究文章。\n\n# 第 1 章\n\n# 数论与抽象代数导论\n\
    \n数论与抽象代数在密码系统的发展中发挥着重要作用。它们的基础知识是密码学和编码理论等领域的关键要素。因此，在本章中，我们将详细概述这些基本概念，以建立坚实的基础，然后再深入探讨可搜索加密和数据管理领域。本章分为两部分，第一部分涵盖与数论相关的概念，第二部分涵盖抽象代数的基本概念。\n\
    \n## 1.1 数论\n\n数论是数学中一个有趣的侧面，其迷人的概念吸引了从专业数学家到业余爱好者的所有人。数论的概念和定理是自然的，即使外行也能理解。然而，证明它们本质上需要计算机工程研究生所具备的基础知识和深厚背景。在本节中，我们将介绍开发可搜索加密方案所需的所有必要数论概念及其详细证明\
    \ [[1]](#01chap_01.xhtml#ref1_1)。\n\n### 1.1.1 整除性\n\n整除性是数论的基本概念。考虑一个整数集合，`Z`\
    \ = {…,−1,0,1,…}，如果 `a` = `k` ⋅ `b`，其中 `a`、`b`、`k` ∈ `Z`，我们称 `b` 整除 `a`，记作（`b`|`a`）\
    \ [[2]](#01chap_01.xhtml#ref1_2)。或者也可以说 `a` 能被 `b` 整除，或 `a` 是 `b` 的倍数，或 `b` 是\
    \ `a` 的因数/约数。平凡情况包括：*i*）∀`b` ∈ `Z`，`b`|0，表示每个数都整除 0；*ii*）∀`a`∈`Z`，1|`a`，表示 1 整除每个数。\n\
    \n#### 1.1.1.1 整除性质\n\n以下是整除的关键性质，可以通过整除的定义轻松验证：\n\n*   若 `a`|`b` 且 `b`|`c`，则\
    \ `a`|`c`\n*   若 `a`|`b`，则 `a`|`b``c`，∀`c` ∈ `Z`\n*   若 `a`|`b` 且 `c`|`d`，则 `a``c`|`b``d`\n\
    *   若 `m`：非零整数，则 `a`|`b` 当且仅当 `m``a`|`m``b`\n*   若 `a`|`x` 且 `a`|`y`，则 `a`|`c``x`+`d``y`，其中\
    \ `c`、`d` ∈ `Z`\n*   若 `d`：非零整数，满足 `d`|`a` `a``n``d` `a`≠0，则 |`d`| ≤ |`a`|\n*\
    \   `a`|`b` 且 `b`|`a` 当且仅当 `a` = ± `b`\n*   若 `a`|`b` 且 `a`|`c`，则 `a`|`b`±`c`\n\
    \n若 `a`|`b`，`b` = `k`[1] ⋅ `a` 且 `b`|`c`，`c` = `k`[2] ⋅ `b` = `k`[2] ⋅ (`k`[1]⋅`a`)\
    \ = `k` ⋅ `a`，其中 `k` = `k`[1] ⋅ `k`[2] ∈ `Z`。因此，根据定义，`a`|`c`。类似地，其他性质也可以利用基本代数性质和整除的定义来证明，因书籍篇幅限制，留作练习。\n\
    \n一个整数可能无法被另一个整数完全整除；在这种情况下会有商（`q`）和余数（`r`）。除法定理陈述了这一事实：对于任意整数 `a` 和正整数 `n`，∃\
    \ 唯一整数 `q` 和 `r`：0 ≤ `r` < `n` 且 `a` = `q` ⋅ `n` + `r`。如果一个数能被完全整除，则 `r` = 0；否则，`r`\
    \ ∈ [1,`n`−1]。\n\n### 1.1.2 素数\n\n对于任意整数 `x` > 1，至少存在两个正约数，即 `x` 和 1，它们被称为该数的平凡约数。如果一个数不存在非平凡约数，则称该数为素数。如果至少存在一个非平凡约数，则该数称为合数\
    \ [[2]](#01chap_01.xhtml#ref1_2)。\n\n**定理 1**：素数有无限个。\n\n**证明**：采用反证法。假设素数只有有限个：(2,3,……,`p`[`k`])\
    \ `a``n``d` `p`[`k`] 是最大的素数。构造另一个数 `m`：所有素数的乘积 + 1。\n\n**观察**：没有任何素数能整除 `m`（余数均为\
    \ 1）。因此，`m` 只能被 1 和它本身整除，所以 `m` 必定是另一个素数。通过这种方式可以构造出无限多个素数。\n\n#### 1.1.2.1 算术基本定理\n\
    \n算术基本定理指出，每个正整数都可以唯一地表示为素数的乘积，即 `n` = `p`[1]^(`e`[1]) ⋅ `p`[2]^(`e`[2]) ⋅ … ⋅\
    \ `p`[`m`]^(`e`[`m`])，其中 `p`[1] < `p`[2] < … < `p`[`m`] 且均互不相同 [[3]](#01chap_01.xhtml#ref1_3)。例如：100\
    \ = 2 ⋅ 2 ⋅ 5 ⋅ 5 = 2² ⋅ 5²；81 = 3⁴。\n\n证明采用反证法。假设 `n` 有两种不同的素因子分解：\n\n*   `n`\
    \ = `p`[1]^(`e`[1]) ⋅ `p`[2]^(`e`[2]) ⋅ … ⋅ `p`[`m`]^(`e`[`m`])\n*   `n` = `q`[1]^(`d`[1])\
    \ ⋅ `q`[2]^(`d`[2]) ⋅ … ⋅ `q`[`r`]^(`d`[`r`])\n\n因此，`p`[1]^(`e`[1]) ⋅ `p`[2]^(`e`[2])\
    \ ⋅ … ⋅ `p`[`m`]^(`e`[`m`]) = `q`[1]^(`d`[1]) ⋅ `q`[2]^(`d`[2]) ⋅ … ⋅ `q`[`r`]^(`d`[`r`])。现在我们要证明\
    \ `p`[1] = `q`[1] 且 `e`[1] = `d`[1]（前提是 `p`[1] = `q`[1]）。\n\n*   若 `p`[1] ≠ `q`[1]，则\
    \ `p`[1] 不能整除任何素数 `q`[1],……`q`[`r`]，即与所有 `q`[1],……`q`[`r`] 互素，`t``h``e``n` `p`[1]\
    \ 不能整除 `n`（因为 `n` = `q`[1]^(`d`[1]) ⋅ `q`[2]^(`d`[2]) ⋅ … ⋅ `q`[`r`]^(`d`[`r`]))。但这不成立。因此\
    \ `p`[1] = `q`[1]\n*   假设 `e`[1] < `d`[1]，则 `d`[1] = `e`[1] + `h`，`h` > 0\n  \
    \  *   `p`[1]^(`e`[1]) ⋅ `p`[2]^(`e`[2]) ⋅ … ⋅ `p`[`m`]^(`e`[`m`]) = `q`[1]^(`d`[1])\
    \ ⋅ `q`[2]^(`d`[2]) ⋅ … ⋅ `q`[`r`]^(`d`[`r`])\n    *   `p`[1]^(`e`[1]) ⋅ `p`[2]^(`e`[2])\
    \ ⋅ … ⋅ `p`[`m`]^(`e`[`m`]) = `q`[1]^(`e`[1] + `h`) ⋅ `q`[2]^(`d`[2]) ⋅ … ⋅ `q`[`r`]^(`d`[`r`])\n\
    \    *   `p`[2]^(`e`[2]) ⋅ … ⋅ `p`[`m`]^(`e`[`m`]) = `q`[1]^(`h`) ⋅ `q`[2]^(`d`[2])\
    \ ⋅ … ⋅ `q`[`r`]^(`d`[`r`])\n\n从上式可观察到，右边能被 `q`[1] 整除，而左边不能，这是不可能的。因此 `e`[1] =\
    \ `d`[1]\n\n#### 1.1.2.2 素数性质\n\n以下是素数的关键性质：\n\n*   若素数 `p` 整除 `a``b`，则 `p`|`a`\
    \ `o``r` `p`|`b`。\n*   若 `m`|`a` `a``n``d` `n`|`a`，且 `m` 和 `n` 没有大于 1 的公共约数（即\
    \ `m` 和 `n` 互素），则 `m``n`|`a`。\n*   若 `p`^α||`n`，则对某些 0 ≤ β ≤ `α`，有 `p`^β||`n`。\n\
    \n设 `n` = `p`[1]^(`α`[1]) ⋅ `p`[2]^(`α`[2]) ⋅ … ⋅ `p`[`r`]^(`α`[`r`])，`n` 的约数总数是每个素数幂的可能性数量的乘积，即\
    \ (`α`[1]+1)(`α`[2]+1)……(`α`[`r`]+1)\n\n### 1.1.3 最大公约数 (GCD)\n\n两个数 `a` 和 `b`\
    \ 的最大公约数，`g``c``d`(`a`,`b`)，是同时整除 `a` 和 `b` 的最大整数 `d`。\n\n`g``c``d`(`a`,`b`) =\
    \ `m``a``x`{`d`:`d`|`a` `a``n``d` `d`|`b`}\n\n如果我们有 `a` 和 `b` 的素因子分解，则 `g``c``d`(`a`,`b`)\
    \ 可以容易地写成如下形式：\n\n*   已知 `a` = `p`[1]^(`α`[1]) ⋅ `p`[2]^(`α`[2]) ⋅ … ⋅ `p`[`k`]^(`α`[`k`])\
    \ 和 `b` = `p`[1]^(`β`[1]) ⋅ `p`[2]^(`β`[2]) ⋅ … ⋅ `p`[`k`]^(`β`[`k`])。\n*   取两个分解中都出现的所有素数，指数取两者指数的最小值。\n\
    \n"
