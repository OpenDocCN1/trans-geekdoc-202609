- raw: "This a comprehensive system definition that we have discussed; however, in\
    \ the literature there exist some variants of this definition depending upon the\
    \ type of method and underlying technique used for developing the searchable encryption\
    \ scheme. The searchable encryption schemes may either be designed using the core\
    \ of the underlying encryption scheme (like we have just discussed above) or may\
    \ use a transformation method that converts the underlying encryption scheme into\
    \ the searchable encryption. The system definition of a searchable encryption\
    \ scheme developed using the transformation method is stated as follows:\n\n*\
    \   \\[*P**K*[*S**E*],*S**K*[*S**E*]\\]←*G**e**n**K**e**y*(1^(*n*),\U0001D4B2\
    ): : This algorithm appears similar to the key-generation algorithm stated above.\
    \ But here an additional parameter, keyword space, is also taken as input. The\
    \ keyword space is used to map it to the identity space (if an identity-based\
    \ encryption (IBE) scheme is used as an underlying scheme) or to the attribute\
    \ space (if an attribute-based encryption (ABE) scheme is used as an underlying\
    \ scheme). This algorithm just runs the setup algorithm of the underlying encryption\
    \ scheme with suitable mapping. The public parameters, *P**P*, of the underlying\
    \ encryption schemes are used as the public key of the searchable encryption scheme,\
    \ *P**K*[*S**E*] (it may include some other parameters also in addition to public\
    \ parameters of the underlying encryption scheme, for example the hashes defined\
    \ for mapping purpose), and the master secret key, *M**S**K*, is used as the corresponding\
    \ secret key in the searchable encryption scheme,  *S**K*[*S**E*].\n\n*   *T*[*i*]←*G**e**n**T**r**a**p*(*S**K*[*S**E*],*w*[*i*]): :\
    \ This algorithm internally calls the key-generation algorithm of the underlying\
    \ encryption scheme; the keyword is taken as input after mapping through some\
    \ hash function. For example: if IBE is used as an underlying scheme, then a hash\
    \ function, *H*, is used which maps each keyword with a unique identity in the\
    \ identity space, *T*[*i*]←*G**e**n**K**e**y*(*M**S**K*[*I**B**E*],*H*(*w*[*i*])).\n\
    \n*    *C*[*i*]←*G**e**n**I**n**d**e**x*(*P**K*[*S**E*],*w*[*i*]): : This algorithm\
    \ internally calls the encryption algorithm of the underlying encryption scheme.\
    \ Taking the same example of an IBE scheme, this algorithms call *E**n**c*(*P**P*[*I**B**E*],*H*(*w*[*i*]),*m*[*i*])\
    \ the algorithm which takes the keyword after application of a hash function (maps\
    \ keyword to identity) and randomly selects a message, *m*[*i*], to encrypt.\n\
    \n*   0/1←*S**e**a**r**c**h*(*P**K*[*S**E*],*T*[*i*],*C*[*i*]): : This algorithm\
    \ internally calls the decryption algorithm of the underlying scheme. Taking the\
    \ same example of an IBE scheme, this algorithms calls *D**e**c*(*P**P*[*I**B**E*],*T*[*i*],*C*[*i*])\
    \ and outputs binary value 1 if the decryption algorithm correctly outputs the\
    \ encrypted message, *m*[*i*]; otherwise, it returns 0.\n\nThe above-stated steps\
    \ present the variation of the searchable encryption definition based on the type\
    \ of methodology used for developing a searchable encryption scheme. Next, we\
    \ will discuss another variation depending upon the type of underlying scheme\
    \ used. Here, we will consider that ABE is used as an underlying scheme and discuss\
    \ the definition of the corresponding searchable encryption scheme concerning\
    \ ABE. For joint presentation, let *I*[*K*] denote the input to the key-generation\
    \ algorithm, *G**e**n**K**e**y* and *I*[*E*] denotes the input to the generate\
    \ index algorithm, *G**e**n**I**n**d**e**x*. In KP-ABE, *I*[*K*] and *I*[*E*]\
    \ are the access policy and the set of attributes, respectively. In CP-ABE, *I*[*K*]\
    \ and *I*[*E*] are the set of attributes and the access policy, respectively.\n\
    \n(*P**P*,*M**S**K*)←*S**e**t**u**p*(1^(*n*),*W*,*A**t**t*): The setup algorithm\
    \ takes the attribute universe, *A**t**t* = {*a**t**t*[1],*a**t**t*[2],⋅⋅⋅⋅⋅,*a**t**t*[|*A**t**t*|]}\
    \ and keyword space, *W* = {*w*[1],*w*[2],⋅⋅⋅⋅⋅,*w*[|*W*|]}, in addition to the\
    \ security parameter, 1^(*n*), and outputs the public parameters, *P**P* , and\
    \ master secret key,  *M**S**K*.\n\n*S**K*[*u*]←*G**e**n**K**e**y*(*P**P*,*M**S**K*,*I*[*K*]):\
    \ This algorithm takes the *M**S**K* and the credentials of a user, *u*, *I*[*K*],\
    \ and generates his private key corresponding to his credentials, i.e. *S**K*[*u*].\n\
    \n*C*[*i*]←*G**e**n**I**n**d**e**x*(*P**P*,*w*[*i*]∈*W*,*I*[*E*]): This algorithm\
    \ encrypts the keyword, *w*[*i*], using *I*[*E*] and *P**P* and outputs the ciphertext,\
    \ *C*[*i*].\n\n*T*[*i*]←*G**e**n**T**r**a**p*(*S**K*[*u*],*w*[*i*]∈*W*): This\
    \ algorithm generates the trapdoor for the keyword, *w*[*i*], using the secret\
    \ key of the user *u*,  *S**K*[*u*].\n\n0/1←*S**e**a**r**c**h*(*P**P*,*C*[*i*],*T*[*i*]):\
    \ This algorithm will be executed only if the satisfiability condition holds between\
    \ *I*[*K*] and *I*[*E*]. If the satisfiability condition holds, this algorithm\
    \ searches for the keyword contained in the trapdoor by searching all the ciphertexts\
    \ one by one and returns 1 if a match is found, otherwise it returns 0\n\n###\
    \ [5.1.2 System model](#contents.xhtml#rsec5_1_2)\n\nIn a searchable encryption\
    \ system there are different entities involved, and each entity executes one of\
    \ the algorithms explained above in the system definition. The description of\
    \ these entities, along with their role, is generally called the system model,\
    \ and is shown below in [Figure 5.1](#05chap_05.xhtml#fig5_1).\n\n![Figure 5.1General\
    \ system model for SE in PKE setting.](images/fig5_1.jpg)\n\n*Figure 5.1*General\
    \ system model for SE in PKE setting.\n\nIf a standard searchable encryption scheme\
    \ is used, then we assume that each cloud user possesses a public and private\
    \ secret key pair, \\[*K*[*p**u**b*],*K*[*p**r**i*]\\], generated by the key-generation\
    \ center; these may be completely random keys with no relation to a person's identity\
    \ or the credentials of a user as in IBE- or ABE-based SE schemes. If an IBE or\
    \ ABE scheme is used as an underlying scheme, then in the key generation the information\
    \ related to one's identity or credentials (attributes/access policy) is taken\
    \ to generate the secret key of the user. In [Figure 5.1](#05chap_05.xhtml#fig5_1),\
    \ we have shown the system model for standard SE or SE based on ABE in a single\
    \ diagram, which is explained as follows:\n\n*Trusted Authority*: The trusted\
    \ authority (TA) is an entity that plays its role when ABE is used as an underlying\
    \ scheme to develop the searchable encryption scheme. When some new user reaches\
    \ the TA for registration, the TA will verify his/her credentials and generate\
    \ his/her secret key using the *G**e**n**K**e**y* algorithm. This algorithm embeds\
    \ either the access policy (KP-ABE) or the attributes (CP-ABE) associated with\
    \ that user. The TA also initializes the system by executing the *S**e**t**u**p*\
    \ algorithm, which generates the public parameters, *P**P*, and the master secret\
    \ key, *M**S**K*, out of which *P**P* are made available to every cloud user.\n\
    \n *Data Owner:* The data owner (DO) is an entity that wants to share his/her\
    \ data to multiple users. The DO first encrypts the data and the associated keywords\
    \ by invoking the *G**e**n**I**n**d**e**x* algorithm. This algorithm encrypts\
    \ the keyword, *w*[*i*], using *K*[*p**u**b*], if a standard SE is used; otherwise,\
    \ if say, ABE is used, this algorithm encrypts the keyword, *w*[*i*], using *P**P*\
    \ as well as the access policy (if CP-ABE is used) or the attributes (if KP-ABE\
    \ is used). The data owner then uploads the encrypted data to the cloud server.\n\
    \n*Data User:* The *Data User* (DU) is an entity that wants to retrieve the data\
    \ stored by the data owners at the cloud server. Since the data is in an encrypted\
    \ form and DU wants the cloud server to perform a search on the encrypted data,\
    \ so, the data owner must delegate his/her searching functionality to the cloud\
    \ server. The data owner generates the search trapdoor using his/her secret key\
    \ by executing the *G**e**n**T**r**a**p* algorithm."
  fmt: '

    # 系统定义变体


    这是我们讨论过的一个综合系统定义；然而，在文献中存在该定义的一些变体，具体取决于开发可搜索加密方案所使用的方法类型和底层技术。可搜索加密方案既可以使用底层加密方案的核心进行设计（如我们上面刚讨论的），也可以使用一种将底层加密方案转换为可搜索加密的变换方法。使用变换方法开发的可搜索加密方案的系统定义如下：


    *   `[PK[SE], SK[SE]] ← GenKey(1^n, W)`：该算法类似于上述的密钥生成算法。但这里还额外接受一个参数——关键词空间。关键词空间用于将其映射到身份空间（如果使用基于身份的加密（IBE）方案作为底层方案）或属性空间（如果使用基于属性的加密（ABE）方案作为底层方案）。该算法只是使用合适的映射运行底层加密方案的建立算法。底层加密方案的公共参数
    `PP` 被用作可搜索加密方案的公钥 `PK[SE]`（除了底层加密方案的公共参数外，它可能还包含一些其他参数，例如用于映射目的的哈希函数），而主密钥 `MSK`
    被用作可搜索加密方案中相应的私钥 `SK[SE]`。


    *   `T[i] ← GenTrap(SK[SE], w[i])`：该算法内部调用底层加密方案的密钥生成算法；关键词在通过某个哈希函数映射后作为输入。例如：如果使用
    IBE 作为底层方案，则使用哈希函数 `H`，它将每个关键词映射到身份空间中的唯一身份，`T[i] ← GenKey(MSK[IBE], H(w[i]))`。


    *   `C[i] ← GenIndex(PK[SE], w[i])`：该算法内部调用底层加密方案的加密算法。以 IBE 方案为例，该算法调用 `Enc(PP[IBE],
    H(w[i]), m[i])`，该算法接受应用哈希函数后的关键词（将关键词映射到身份）并随机选择一条消息 `m[i]` 进行加密。


    *   `0/1 ← Search(PK[SE], T[i], C[i])`：该算法内部调用底层方案的解密算法。以 IBE 方案为例，该算法调用 `Dec(PP[IBE],
    T[i], C[i])`，如果解密算法正确输出加密消息 `m[i]`，则输出二进制值 1；否则返回 0。


    上述步骤展示了基于开发可搜索加密方案所用方法论类型的可搜索加密定义变体。接下来，我们将讨论另一种基于所用底层方案类型的变体。这里，我们将考虑使用 ABE 作为底层方案，并讨论关于
    ABE 的相应可搜索加密方案的定义。为了联合表述，令 `I[K]` 表示密钥生成算法 `GenKey` 的输入，`I[E]` 表示生成索引算法 `GenIndex`
    的输入。在 KP-ABE 中，`I[K]` 和 `I[E]` 分别是访问策略和属性集合。在 CP-ABE 中，`I[K]` 和 `I[E]` 分别是属性集合和访问策略。


    *   `(PP, MSK) ← Setup(1^n, W, Att)`：建立算法接受属性全集 `Att = {att[1], att[2], ..., att[|Att|]}`
    和关键词空间 `W = {w[1], w[2], ..., w[|W|]}`，除了安全参数 `1^n` 外，输出公共参数 `PP` 和主密钥 `MSK`。


    *   `SK[u] ← GenKey(PP, MSK, I[K])`：该算法接受 `MSK` 和用户 `u` 的凭证 `I[K]`，并生成其对应凭证的私钥，即
    `SK[u]`。


    *   `C[i] ← GenIndex(PP, w[i] ∈ W, I[E])`：该算法使用 `I[E]` 和 `PP` 加密关键词 `w[i]`，并输出密文
    `C[i]`。


    *   `T[i] ← GenTrap(SK[u], w[i] ∈ W)`：该算法使用用户 `u` 的私钥 `SK[u]` 为关键词 `w[i]` 生成陷门。


    *   `0/1 ← Search(PP, C[i], T[i])`：只有当 `I[K]` 和 `I[E]` 之间满足可满足性条件时，才会执行该算法。如果可满足性条件成立，该算法通过逐个搜索所有密文来查找陷门中包含的关键词，如果找到匹配则返回
    1，否则返回 0。


    ## 5.1.2 系统模型


    在可搜索加密系统中，涉及不同的实体，每个实体执行系统定义中解释的算法之一。这些实体的描述及其角色通常称为系统模型，如下图 [图 5.1](#05chap_05.xhtml#fig5_1)
    所示。


    ![图 5.1 PKE 设置下 SE 的通用系统模型](images/fig5_1.jpg)


    **图 5.1** PKE 设置下 SE 的通用系统模型。


    如果使用标准可搜索加密方案，则假设每个云用户拥有一对公钥和私钥 `[K[pub], K[pri]]`，由密钥生成中心生成；这些可能是完全随机的密钥，与 IBE
    或 ABE 基础的 SE 方案中的人员身份或用户凭证无关。如果使用 IBE 或 ABE 方案作为底层方案，则在密钥生成中会采集与个人身份或凭证（属性/访问策略）相关的信息来生成用户的私钥。在
    [图 5.1](#05chap_05.xhtml#fig5_1) 中，我们在一个图中展示了标准 SE 或基于 ABE 的 SE 的系统模型，具体说明如下：


    *   **可信机构**：可信机构（TA）是在使用 ABE 作为底层方案开发可搜索加密方案时发挥作用的实体。当新用户向 TA 注册时，TA 将验证其凭证并使用
    `GenKey` 算法生成其私钥。该算法嵌入与该用户关联的访问策略（KP-ABE）或属性（CP-ABE）。TA 还通过执行 `Setup` 算法初始化系统，该算法生成公共参数
    `PP` 和主密钥 `MSK`，其中 `PP` 可供每个云用户使用。


    *   **数据拥有者**：数据拥有者（DO）是希望将其数据共享给多个用户的实体。DO 首先通过调用 `GenIndex` 算法加密数据和相关关键词。如果使用标准
    SE，该算法使用 `K[pub]` 加密关键词 `w[i]`；否则，如果使用 ABE，该算法使用 `PP` 以及访问策略（如果使用 CP-ABE）或属性（如果使用
    KP-ABE）加密关键词 `w[i]`。然后数据拥有者将加密数据上传到云服务器。


    *   **数据用户**：数据用户（DU）是希望检索数据拥有者存储在云服务器上的数据的实体。由于数据是加密形式，且 DU 希望云服务器在加密数据上执行搜索，因此数据拥有者必须将其搜索功能委托给云服务器。数据拥有者通过执行
    `GenTrap` 算法，使用其私钥生成搜索陷门。

    '
