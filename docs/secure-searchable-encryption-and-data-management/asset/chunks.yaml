    # 密码学


    密码学 [[1]](#02chap_02.xhtml#ref2_1)–[[5]](#02chap_02.xhtml#ref2_5) 是编写秘密以向非预期接收者隐藏信息的科学。密码学的作用远不止于为不同各方之间的安全通信建立一个秘密密钥。就像现实世界中的物理签名一样，密码学在数字世界中提供了类似的数字签名。数字签名的目的与物理签名相同：它将验证你的身份。但是，与物理签名不同，我们不能像在现实世界中那样，使用同一个数字签名来签署所有文件，因为在数字世界中，任何人都可以非常轻松地剪切并粘贴数字签名到我们可能不想签署的材料上。因此，密码学帮助我们开发一种数字签名，它在验证我们身份的同时，确保没有人能够复制粘贴它。它通过使数字签名成为我们要签名的数据内容的函数来实现这一点。最近，密码学的应用出现在本世纪最流行的区块链技术中，人们可以在网络上匿名通信。密码学由来已久；大约
    2078 年前，尤利乌斯·凯撒首次在其军事命令中使用了一种非常简单的替换密码，其中每个字母都被移位以使消息变得无意义。后来，这种密码以他的名字命名，称为凯撒密码。历史上密码学的另一个广泛应用是德国人在一战末期开发并在二战中大量用于安全传输消息的恩尼格玛密码机。在下一节中，我们将简要讨论并对著名的传统密码进行分类。


    ## 2.2 密码分类


    密码是将有意义的内容转换为乱序且难以理解内容的过程的结果。我们假设读者已经了解 `ciphertext`（密文）、`plaintext`（明文）、`encryption`（加密）、`decryption`（解密）等基本术语，将直接进入密码的不同类别，并按
    图 2.1 所示对其进行分类讨论。


    ![图 2.1 密码分类。](img/fig2_1.jpg)


    *图 2.1* 密码分类。


    ### 2.2.1 基于操作类型


    此类别下的密码称为经典密码，在理解现代密码方面发挥着重要作用。


    #### 2.2.1.1 替换密码


    在替换密码中，明文中的每个字符都被替换为一个密文字符。替换可以是单表的，即每个明文字符被替换为相同的密文字符；也可以是多表的，即每个明文字符被替换为不同的密文字符。我们将讨论的替换密码示例包括凯撒密码、维吉尼亚密码和一次性密码本。


    *   **凯撒密码**：这是一个位移值固定为三的移位密码示例。凯撒密码的一个更灵活的版本允许位移值为任意整数。即使允许任意位移值，对于任何给定的明文，也只有
    25 种不同的移位密码可能。由于每个明文字符总是被替换为相同的密文字符，这是一个单表密码的示例。


    *   **维吉尼亚密码**：这种密码基于多个基于关键字长度的交织移位密码。关键字重复直到其长度等于明文长度。它是一种多表密码。


    *   **一次性密码本 (OTP)**：这种密码由维尔纳姆于 1917 年设计。它是维吉尼亚密码的扩展，遵循以下规则：i) 关键字（密钥）的长度与明文长度相同，ii)
    关键字是随机生成的字母字符串，iii) 关键字仅使用一次。OTP 被认为具有完美保密性，即通过查看密文，绝对无法获得关于明文的任何信息。此外，它无法通过暴力破解法攻破。我们可以通过这个简单的例子了解破解
    OTP 的复杂性：考虑一个使用 OTP 加密的五字符消息。要通过暴力破解密文，我们需要尝试所有可能的密钥并进行 `26⁵` 次计算，即 11,881,376
    种组合，这仅针对五字符的消息。因此，对于更长的消息，计算量随每个新字母呈指数级增长。然而，由于密钥过长，OTP 在实践中很难使用。


    #### 2.2.1.2 置换密码


    在置换密码中，我们不是替换明文中的不同字符，而是改变元素的位置来生成密文。各种类型的置换密码包括栅栏密码、行置换密码和列置换密码。


    ### 2.2.2 基于数据处理


    根据加密算法获取多大数据块将明文转换为密文，密码分为两类：分组密码和流密码。分组密码通过获取固定大小的数据位生成，而流密码通过一次获取单个数据位生成。这些密码属于对称密钥加密家族。


    #### 2.2.2.1 流密码


    如前所述，流密码一次获取一位将明文转换为密文。它就像一次性密码本，是使 OTP 实用化的一种尝试。在流密码中，我们不使用完全随机的密钥，而是使用伪随机密钥。伪随机密钥由伪随机生成器
    (`PRG`) 生成。`PRG` 是一个函数，它获取一个很小的种子（例如可能 128 位长）并将其扩展为一个非常长的输出字符串，可能长达千兆字节。现在的问题是，流密码也能像
    OTP 一样拥有完美保密性吗？对于完美保密性，密钥长度应等于消息长度，但在流密码中，实际密钥长度短于消息。因此，它不能具有完美保密性。那么，如果流密码不具有完美保密性，是什么使它们安全呢？流密码的安全性取决于特定的
    `PRG`。`PRG` 必须具备一种称为不可预测性的属性，这样流密码才被宣称是安全的。不可预测性可以定义为：给定前 *i* 位，不存在任何高效算法能以非微不足道的优势预测第
    *i* + 1 位。最常见的流密码示例包括 RC4 和 CSS（旧式流密码），以及 eStream 和 Salsa20（现代流密码）。


    #### 2.2.2.2 分组密码


    加密算法获取的固定大小的数据位称为分组。流行加密算法中常用的分组大小有 64 位、128 位和 256 位。现在，如果我们要加密的明文小于算法采用的分组大小会怎样？在这种情况下，使用填充方案使明文大小等于分组大小。分组密码是通过迭代构建的。最常见的分组密码示例包括
    DES、3DES 和 AES。这些算法的工作细节可以在任何标准教材中找到；此处我们只想提及这些算法的关键亮点。


    '
