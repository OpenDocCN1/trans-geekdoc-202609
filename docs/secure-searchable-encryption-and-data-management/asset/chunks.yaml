    key-exchange algorithm is to demonstrate its significance in the development of
    public-key cryptosystems.


    The symmetric-key cryptographic techniques are much faster than public-key cryptographic
    techniques. On the other hand, symmetric-key techniques require the process of
    sharing the secret key, and this process becomes quite complicated when a large
    number of users want to communicate together. Take the example of cloud storage
    where a large number of users participate and want to share their data among themselves;
    in this scenario, public-key cryptography is the better choice. The searchable
    encryption schemes that we will discuss in the subsequent chapters are developed
    for cloud storage and multi-user environments. Therefore, to better understand,
    we need to build a strong base in the public-key cryptographic techniques.


    ### 2.3.1 Public-key Cryptography


    Public-key cryptography [[4]](#02chap_02.xhtml#ref2_4), also called asymmetric
    cryptography, contains a group of algorithms that use two different but related
    keys, one is used for encryption (which is called the public key) and the other
    is used for decryption (which is called the private key). Public-key cryptography
    contains the public-key encryption and signature scheme, but we will mainly focus
    only on the encryption schemes. In the encryption scheme, anyone who wants to
    communicate with someone can encrypt the message using the public key of the recipient
    and the recipient will use his/her corresponding private key to decrypt that message.
    Since the private key is only possessed by the recipient, no one else can decrypt
    that message. In the signature scheme, this process is inverted, to generate the
    signature the private key is used and to verify the signature the corresponding
    public key is used. The signature scheme is used to prove the authenticity and
    integrity of the message [[7]](#02chap_02.xhtml#ref2_7), [[8]](#02chap_02.xhtml#ref2_8),
    [[9]](#02chap_02.xhtml#ref2_9), and [[10]](#02chap_02.xhtml#ref2_10). The private
    key is used to generate the signature of the message, which guarantees that indeed
    the sender has sent the message. No one can change the contents because they do
    not possess the private key of the original sender and therefore cannot re-encrypt
    the modified content of the message without revealing it to the recipient.


    The public-key encryption algorithm is composed of three algorithms: the key-generation
    algorithm, `KG`, the encryption algorithm, `E`, and the decryption algorithm,
    `D`. The key-generation algorithm takes the security parameter, `λ`, and generates
    the public and private key pair, (`pk`, `sk`). The encryption algorithm takes
    the message, `m ∈ M` (message space) and encrypts it using the public key, `pk`,
    to generate the ciphertext, `C`. The decryption algorithm takes the ciphertext
    and the private/secret key, `sk`, corresponding to the public key and outputs
    the message, `m`. The decryption algorithm is obviously deterministic while the
    key-generation and the encryption algorithms are non-deterministic. The correctness
    of these algorithms can be defined as:


    ```

    ∀ m ∈ M & ∀(pk, sk) ←$ KG(λ), D(sk, E(pk, m)) → m

    ```


    #### 2.3.1.1 Security Models

