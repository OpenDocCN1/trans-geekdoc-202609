    # DES（数据加密标准）


    DES 由 Horst Feistel 于 1970 年代初在 IBM 设计，最初名为 Lucifer。1976 年，美国国家标准局（NBS）采用了 IBM
    提交的一个 Lucifer 变体作为联邦标准，称其为 DES，密钥长度为 56 位，分组长度为 64 位。1997 年，DES 被穷举搜索破解，即尝试了所有
    `2⁵⁶` 种密钥组合以找到挑战密钥。DES 被破解后，专家们想到的第一件事是通过人为扩大密钥规模来增强 DES 抵抗穷举密钥搜索攻击的能力。结果，三重 DES（3DES）被发明出来。其思路是对
    DES 进行几次迭代。3DES 使用三个独立的密钥，每个长度为 56 位，这使得密钥规模等于 168 位（`56×3`），但其速度比 DES 慢三倍。现在的问题是，为什么不使用双重
    DES？如果使用 2DES，则存在一种称为中间相遇攻击的攻击，它可以在大约等于对 DES 进行穷举搜索攻击的极短时间内尝试 `2¹¹²`。直到 2000 年
    AES 完全取代 DES 之前，DES 都是银行和商业领域广泛使用且流行的密码。


    # AES（高级加密标准）


    AES 是一种替换-置换网络（SPN），与 Feistel 网络中一半比特在每轮保持不变不同，在 SPN 中所有比特在每一轮都会发生改变。AES 提供三种密钥选项：128
    位、192 位和 256 位，分组大小固定为 128 位。密钥规模越大，生成的密码越安全；然而，轮数会随着密钥规模的增加而增加，从而使密码变慢。但它仍然比
    3DES 标准快六倍，因此完全取代了 DES，成为当今广泛使用的标准。


    ## 2.2.3 基于密钥类型


    根据加密和解密所用密钥的类型，密码可分为对称密码和非对称密码。在对称密码中，同一个密钥既用于加密也用于解密；而在非对称密码中，加密和解密使用不同的密钥。对称密码的例子有分组密码和流密码以及所有古典密码；在非对称类别中，最著名且首要的是由
    Rivest、Shamir 和 Adleman 开发的密码（RSA 算法）。我们将在讨论公钥加密技术的章节中讨论著名的非对称密码。


    ## 2.3 密码技术类型


    在本节中，我们将讨论对称和非对称（或公钥）密码技术。然而，主要关注点将放在公钥密码技术上，因为我们稍后将讨论基于公钥密码原语的可搜索加密方案。


    在一个典型的密码系统中，有三个主要组件：密钥生成算法、加密算法和解密算法。密钥生成算法的作用主要体现在公钥密码系统中。在对称密钥密码系统中，消息的发送方和接收方必须就用于加密和解密的共同秘密密钥达成一致。为此，必须存在某种密钥交换算法，其中获得广泛普及的一种是
    Diffie-Hellman 密钥交换算法 [[6]](#02chap_02.xhtml#ref2_6)。为了理解该算法，让我们假设著名的 Alice 和
    Bob 场景，即 Alice 想要与 Bob 安全通信。他们之间的密钥交换过程如图 2.2 所示。Alice 和 Bob 选择公共参数（`p`、`α`），这些参数为人尽皆知。


    ![图 2.2 Diffie-Hellman 密钥交换算法。](img/fig2_2.jpg)


    *图 2.2* Diffie-Hellman 密钥交换算法。


    Alice 和 Bob 确定的公共参数是循环群 `Z[p]` 的阶 `p`，以及该群的生成元 `α`。在图 2.2 所示的第二步中，Alice 和 Bob
    从循环群中随机选择一个元素并将其作为各自的秘密保存。


    Diffie-Hellman 密钥交换算法遭受中间人攻击，即第三方通过计算自己的共享密钥并将该共享密钥发送给 Alice 和 Bob，拦截所有秘密消息。该攻击的细节留给读者自行查阅，因为任何标准的密码学书籍中都可以找到。描述
    Diffie-Hellman 密钥交换算法的目的是展示其在公钥密码系统发展中的重要性。


    对称密钥密码技术比公钥密码技术快得多。另一方面，对称密钥技术需要共享秘密密钥的过程，当大量用户想要一起通信时，这个过程变得相当复杂。以云存储为例，大量用户参与并希望在彼此间共享数据；在这种情况下，公钥密码学是更好的选择。我们将在后续章节中讨论的可搜索加密方案是为云存储和多用户环境开发的。因此，为了更好地理解，我们需要在公钥密码技术方面打下坚实的基础。


    ### 2.3.1 公钥密码学


    公钥密码学 [[4]](#02chap_02.xhtml#ref2_4)，也称为非对称密码学，包含一组使用两个不同但相关密钥的算法，一个用于加密（称为公钥），另一个用于解密（称为私钥）。公钥密码学包含公钥加密和签名方案，但我们将主要关注加密方案。在加密方案中，任何想要与他人通信的人都可以使用接收方的公钥加密消息，接收方将使用其对应的私钥解密该消息。由于私钥仅由接收方持有，其他任何人都无法解密该消息。在签名方案中，此过程被反转：使用私钥生成签名，使用对应的公钥验证签名。签名方案用于证明消息的真实性和完整性
    [[7]](#02chap_02.xhtml#ref2_7)、[[8]](#02chap_02.xhtml#ref2_8)、[[9]](#02chap_02.xhtml#ref2_9)
    和 [[10]](#02chap_02.xhtml#ref2_10)。私钥用于生成消息的签名，这保证了确实是发送方发送了该消息。没有人可以篡改内容，因为他们不持有原始发送方的私钥，因此无法在不向接收方暴露的情况下重新加密修改后的消息内容。


    公钥加密算法由三个算法组成：密钥生成算法 `KG`、加密算法 `E` 和解密算法 `D`。密钥生成算法接受安全参数 `λ`，生成公钥和私钥对（`pk`、`sk`）。加密算法接受消息
    `m ∈ M`（消息空间），使用公钥 `pk` 对其加密以生成密文 `C`。解密算法接受密文和与公钥对应的私钥/秘密密钥 `sk`，输出消息 `m`。解密算法显然是确定性的，而密钥生成算法和加密算法是非确定性的。这些算法的正确性可以定义为：


    ```

    ∀ m ∈ M & ∀(pk, sk) ←$ KG(λ), D(sk, E(pk, m)) → m

    ```


    #### 2.3.1.1 安全模型


