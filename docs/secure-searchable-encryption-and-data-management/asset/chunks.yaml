    is expressed as `e(u·X, v·Y)` instead of `e(X^(u), Y^(v))`, where `X`, `Y` are
    the elements of the source groups. This case is seen when the groups are written
    additively, however the multiplicative notation is more popular.


    #### 3.3.2.1.2 How the source and target groups are chosen


    For the source groups, typically an elliptic curve over some finite field, `F_p`
    is used. There are different types of pairing, type A, A1, D, E, F and G [[19](#03chap_03.xhtml#ref3_19)]
    that result from choosing elliptic curves of different embedding degree. While
    the target group is generally a finite field.


