- raw: 'Cryptography \[[1](#02chap_02.xhtml#ref2_1)\]–\[[5](#02chap_02.xhtml#ref2_5)\]
    is the science of writing secrets to hide information from unintended recipients.
    Cryptography can do much more than establish a secret key for secure communication
    between different parties. Like physical signatures in our world, cryptography
    offers analogous, digital signatures in the digital world. The purpose of the
    digital signature is the same as the physical signature: it will authenticate
    your identity. But, unlike a physical signature, we cannot use the same digital
    signature to sign all the documents as we do in the physical world because in
    the digital world, anyone can quite easily cut and paste the digital signature
    to some material that we might not want to sign. Therefore, cryptography helps
    us to develop a digital signature which authenticates our identity while at the
    same time it ensures that no one can copy and paste it. It does this by making
    the digital signature a function of the contents of the data we want to sign.
    Recently, the application of cryptography has been seen in the most popular blockchain
    technology of the century, where one can anonymously communicate over the network.
    Cryptography is ancient; roughly 2078 years ago, Julius Caesar first used a very
    simple substitution cipher in his military commands where each letter was shifted
    to make the message meaningless. Later, this cipher was named after him and called
    the Caesar cipher. Another widespread use of cryptography in history is the Enigma
    machine developed by the Germans at the end of World War I and heavily used in
    World War II to transmit messages securely. In the next section, we will briefly
    discuss and categorize the famous traditional ciphers.


    ## [2.2 CLASSIFICATION OF CIPHERS](#contents.xhtml#rsec2_2)


    Cipher is the outcome of the conversion process from something meaningful to something
    scrambled and hard to understand. We expect from the reader that basic terminologies
    like ciphertext, plaintext, encryption, decryption, etc. are already known, and
    we will move directly to the different categories of ciphers and discuss them
    categorically as shown in [Figure 2.1](#02chap_02.xhtml#fig2_1).


    ![Figure 2.1Classification of ciphers.](images/fig2_1.jpg)


    *Figure 2.1*Classification of ciphers.


    ### [2.2.1 Based on the type of operations](#contents.xhtml#rsec2_2_1)


    The ciphers under this category care called the classical ciphers and play an
    important role in understanding modern ciphers.


    #### [2.2.1.1 Substitution cipher](#contents.xhtml#rsec2_2_1_1)


    In a substitution cipher each character in plaintext is substituted with a ciphertext
    character. The substitution can either be monoalphabetic, where each plaintext
    character is substituted with same ciphertext character, or polyalphabetic, where
    each plaintext character is substituted with different ciphertext characters.
    Examples of substitution ciphers which we will discuss include the Caesar cipher,
    Vigenère cipher and one-time pad.


    *   Caesar cipher: This is an example of a shift cipher with the shift value fixed
    to three. A more flexible version of the Caesar cipher permits the shift value
    to be any integer. Even though an arbitrary value is allowed for the shift, there
    are only 25 different shift ciphers possible for any given plaintext. Since each
    plaintext character is always substituted with the same ciphertext character,
    this is an example of a monoalphabetic cipher.


    *   Vigenère cipher: This cipher is based on multiple interwoven shift ciphers
    based on the length of a keyword. The keyword is repeated until it becomes equal
    to the length of the plaintext. It is a type of polyalphabetic cipher.


    *   One-time pad (OTP): This cipher was designed by Vernam in 1917. It is an extension
    of Vigenère cipher with the following rules: i) the length of the keyword (key)
    is the same as the length of the plaintext, ii) the keyword is a randomly generated
    string of alphabets, iii) the keyword is used only once. OTP is known to have
    perfect secrecy, i.e., by looking at the ciphertext, absolutely nothing is revealed
    about the plaintext. Further, it is impossible to break using the brute force
    method. We can get the idea of the complexity of breaking OTP by this simple example:
    consider a message with five characters encrypted using OTP. To break the ciphertext
    by brute force, we need to try all possibilities of keys and conduct computation
    for 26⁵, i.e., 11 881 376 combinations, and this is just for a message with five
    characters. Thus, for a longer message, the calculation grows exponentially with
    every new alphabet. However, OTP is hard to use in practice because of the long
    keys.


    #### [2.2.1.2 Transposition cipher](#contents.xhtml#rsec2_2_1_2)


    In the transposition cipher, instead of substituting different characters in plaintext,
    we change the location of elements to generate the ciphertext. Various types of
    transposition ciphers include the rail fence cipher, the row transposition cipher
    and the columnar transposition cipher.


    ### [2.2.2 Based on data processing](#contents.xhtml#rsec2_2_2)


    Depending upon the chunk of data the encryption algorithm takes to convert the
    plaintext to ciphertext, the ciphers fall under two categories: the block cipher
    and the stream cipher. The block cipher is generated by taking a fixed size of
    bits of data while the stream cipher is generated by taking a single bit of data
    at a time. These ciphers belong to the family of symmetric-key encryption.


    #### [2.2.2.1 Stream cipher](#contents.xhtml#rsec2_2_2_1)


    As we mentioned, stream ciphers take one bit at a time to covert the plaintext
    to the ciphertext. It is just like the one-time pad and is an attempt to make
    the OTP practical. In stream ciphers, instead of using a total random key, we
    use a pseudorandom key. The pseudorandom key is generated by the pseudorandom
    generator (PRG). PRG is a function that takes a small seed that may be 128 bits
    long (say) and expands it to a very long output string, which may be gigabytes
    long. Now, the question is, can stream ciphers also have perfect secrecy like
    the OTP? For perfect secrecy, the key length should be equal to the message length,
    but in the stream cipher, the actual key length is shorter than the message. Therefore,
    it cannot have perfect secrecy. Now, the question is, if the stream ciphers do
    not have perfect secrecy, then what makes them secure? The security of stream
    ciphers depends upon the specific PRG. The PRG must possess a property called
    unpredictability then the stream cipher is claimed to be secure. Unpredictability
    can be defined as, given the first *i* bits, there exists no efficient algorithm
    that can predict the *i* + 1 bits with non-negligible advantage. The most common
    examples of stream ciphers include RC4 and CSS, which are old stream ciphers,
    and eStream and Salsa20, which are modern stream ciphers.


    #### [2.2.2.2 Block cipher](#contents.xhtml#rsec2_2_2_2)


    The fixed size of bits of data taken by the encryption algorithm is called a block.
    The commonly used block sizes in popular encryption algorithms are 64 bits, 128
    bits and 256 bits. Now, what happens if the plaintext that we are encrypting is
    less than the block size taken by the algorithm? In this case, padding schemes
    are used to make the size of the plaintext equal to the block size. Block ciphers
    are built using the iterations. The most common examples of block ciphers include
    DES, 3DES and AES. The working details of these algorithms can be found in any
    standard book; here, we would like to mention the key highlights of these algorithms.'
