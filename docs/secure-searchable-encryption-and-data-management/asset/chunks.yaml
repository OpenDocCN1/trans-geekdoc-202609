    || (2*N*+*t*+1)*E* + (*t*+1)*H* || (2*ξ*+2)*P* + *ξ**E*[*T*] + *t**E* |


    | Mamta and Gupta \[[25](#05chap_05.xhtml#ref5_25)\] || 3*E* + 1*H* || (*ξ*+6)*E* + (*k*+1)*H*
    || 7*E* + 1*P* + 1*H* || (*ξ*+2)*E* + 6*P* |


    | Miao et al. \[[26](#05chap_05.xhtml#ref5_26)\] || (3*ξ*+8)*E* || (4*N*+3)*E* + 2*E*[*T*] + *P*
    || (2*ξ*+2)*E* || 2*P* |


    | Mamta and Gupta \[[27](#05chap_05.xhtml#ref5_27)\] || 2*E* || (2*N*+1)*E* + 2*E*[*T*] + 1*H* + 1*P*
    || (*ξ*+3)*E* + 1*H* || 4*P* + 1*E*[*T*] |


    | Mamta et al. \[[28](#05chap_05.xhtml#ref5_28)\] || 2*E* || (*T*+1)*E* + 1*H* + 2*E*[*T*]
    || 2*E* + 1*H* || (*T*+1)*P* + 1*E*[*T*] |


    From [Table 5.3](#05chap_05.xhtml#tbl5_3) and [Table 5.4](#05chap_05.xhtml#tbl5_4),
    it can be observed that the schemes \[[25](#05chap_05.xhtml#ref5_25)\], \[[27](#05chap_05.xhtml#ref5_27)\],
    and \[[28](#05chap_05.xhtml#ref5_28)\] have a constant storage cost and time complexity
    for the key-generation algorithm in terms of the number of attributes involved,
    as compared to the other schemes. For the encryption algorithm, each of the given
    schemes has variable storage as well as computational cost except in \[[27](#05chap_05.xhtml#ref5_27)\]
    where the storage cost is again constant. For the trapdoor-generation algorithms,
    again in \[[25](#05chap_05.xhtml#ref5_25)\], \[[27](#05chap_05.xhtml#ref5_27)\],
    and \[[28](#05chap_05.xhtml#ref5_28)\] the storage cost is constant while \[[25](#05chap_05.xhtml#ref5_25)\]
    and \[[28](#05chap_05.xhtml#ref5_28)\] were able to make the computational cost
    invariant to the number of attributes. In the *S**e**a**r**c**h* algorithm, it
    can be observed that \[[26](#05chap_05.xhtml#ref5_26)\] and \[[27](#05chap_05.xhtml#ref5_27)\]
    were able to make the constant number of pairing operations and thereby achieved
    fast search.


    ## [5.3 CHAPTER SUMMARY](#contents.xhtml#rsec5_3)


    In a multi-user cloud environment, public-key setting is a preferable choice to
    develop the searchable encryption scheme as the symmetric-key schemes suffer from
    the complicated process of secret key sharing. This chapter explained in detail
    the concept of searchable encryption in a public-key setting. It provided the
    general structure of the searchable encryption scheme in asymmetric key setting.
    Further, this chapter mainly discussed the searchable encryption techniques developed
    using IBE and ABE. Between them, we have identified ABE as a suitable choice because
    it provides fine-grained access control capabilities which makes it an appropriate
    scheme that can truly handle multiple users in an efficient manner. Further, we
    have performed a comparative analysis of existing schemes in literature in this
    setting.


