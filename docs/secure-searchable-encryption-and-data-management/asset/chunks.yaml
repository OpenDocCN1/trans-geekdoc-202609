- raw: 'The efficiency of a searchable encryption scheme is measured in terms of computational,
    storage and communication costs \[[5](#07chap_07.xhtml#ref7_5), [6](#07chap_07.xhtml#ref7_6),
    [7](#07chap_07.xhtml#ref7_7)\]. The computational cost is measured in terms of
    the number of operations and the type of operations required to generate the ciphertext,
    search trapdoor and finally to perform search. Similarly, the storage cost is
    measured in terms of memory space required to store the ciphertext, search trapdoor,
    public parameters and the secret key. The communication cost is measured in terms
    of the amount of time required to send the secret key, search trapdoor and the
    search result to the intended recipient. A searchable encryption scheme is assumed
    to be efficient if the associated costs are reduced to minimum. The query expressiveness
    of a searchable encryption scheme is measured in terms of the variety of search
    queries supported by the scheme. Expressiveness of queries may vary from the simplest
    equality query to multidimensional range queries.


    There exists a tradeoff between these three parameters; a more secure scheme may
    be less efficient and vice-versa. Similarly, a scheme which supports more expressive
    search queries may be less secure and may be less efficient.


    ## [7.3 DIRECTIONS FOR FUTURE WORK](#contents.xhtml#rsec7_3)


    Basically, searching is a very fundamental operation and we have seen how efficiently
    the search engines work on plain data. The research community wants the same flexibility
    and natural feeling while searching on encrypted data stored at shared cloud storage.
    Therefore, a lot of research is going specially in the field of public-key-based
    searchable encryption because the public-key setting is a preferable choice for
    the shared cloud storage environment. Some of the future research directions in
    this domain are highlighted in [Figure 7.1](#07chap_07.xhtml#fig7_1).


    ![Figure 7.1Directions for future work.](images/fig7_1.jpg)


    *Figure 7.1*Directions for future work.


    Searchable encryption be applied in any domain where confidentiality of the data
    is required and without compromising data privacy. We want a third party to retrieve
    the required data in such a way that the third party will not get any information
    about what is being searched. The existing public-key-based searchable encryption
    schemes try to accommodate the maximum possible features but there still exists
    some scope for improvement because none of them is complete in every sense. Therefore,
    depending upon the application one should decide the functionalities that should
    be present in the searchable encryption scheme under consideration. However, there
    are some useful functionalities which, if added, can significantly improve the
    usability of the searchable encryption scheme and these are as follows:


    *   To make the searchable encryption scheme more natural it should support expressive
    search queries that can be represented by any Boolean formula.


    *   Most of the searchable encryption schemes in the literature are proved secure
    in the random oracle model (ROM). ROM definitely makes the construction easy but
    it assumes idealistic conditions. Therefore, to prove the security one should
    consider the standard model which results in a scheme that can work well in real-life
    situations.


    *   More emphasis should be given towards developing fully secure searchable encryption
    systems. Most of the searchable encryption schemes in the literature offer selective
    security.


    *   In the practical scenario, when someone stores his/her data to the cloud server
    with the intention of sharing it with others then he/she should also take care
    that their data is always up to date. Therefore, the searchable encryption schemes
    should be developed with a provision to support dynamic data.


    *   The verifiability of search results returned by the cloud server is a key
    feature that can add more security to the searchable encryption schemes. Most
    of the existing schemes in the literature assume the cloud server to be honest
    in a sense that it correctly executes the search algorithm. However, there is
    a need to relax this assumption to make the scheme more secure.


    *   The current searchable encryption schemes perform search for the complete
    keyword given in the trapdoor. However, if our requirement is to search only a
    part of the keyword with the same trapdoor, there is a lot of scope to work in
    this domain.


    *   Attribute-based searchable encryption (ABSE) schemes are becoming popular
    due to their fine-grained searching feature. However, in most of the ABSE schemes
    the storage and computation cost varies linearly with the attributes. This significantly
    reduces performance and scalability. Therefore, efforts should be made to make
    the associated costs independent of the number of attributes involved.


    *   With ABSE one common assumption is made about the access structures. They
    are assumed to be monotonic and therefore do not support negative attributes.
    To make the access structure expressive, we should be able to represent it in
    the form of any Boolean formula. This has been completely neglected in the case
    of searchable encryption schemes and efforts are required to work in this direction.


    *   Searchable encryption has been integrated with recent technologies like blockchain
    technology to provide a more robust and realistic platform \[[8](#07chap_07.xhtml#ref7_8),
    [9](#07chap_07.xhtml#ref7_9), [10](#07chap_07.xhtml#ref7_10)\]. The evidence of
    this integration has been seen in the literature in case of symmetric-key setting.
    However, this integration is yet to be explored in the public-key setting.


    *   The application of searchable encryption in public-key and symmetric-key settings
    has been seen only on text data. However, in today''s digital world it is not
    only text that we want to securely store and share, it can be any multimedia data
    like an image, video etc. None of the existing schemes has been tested for such
    data. Therefore, this direction can also be explored to test the feasibility of
    existing schemes for different kinds of data.


    *   Finally, to resist the quantum attacks which are the potential threats to
    our current cryptographic algorithms, there is need to introduce the quantum cryptography
    while developing the searchable encryption schemes to ensure security in the future
    \[[11](#07chap_07.xhtml#ref7_11), [12](#07chap_07.xhtml#ref7_12)\].


    There have been tremendous developments in the area of searching over plain data.
    However, when the encrypted data is considered, the current search functionalities
    are very limited and do not provide the same seamless experience that we get in
    the case of plain data. Hence, there is a lot of scope in building such schemes
    which can efficiently perform search over encrypted data as well as support complex
    search queries.


    ## [7.4 CHAPTER SUMMARY](#contents.xhtml#rsec7_4)


    This chapter highlighted the open challenges associated with searchable encryption
    and provided insights into future research directions in the field. From our in-depth
    study of searchable encryption techniques, it can be remarked that searchable
    encryption is not just a concept related to cryptography, but it is a commodity
    that can have applicability in our real life in sectors such as banking, health
    care, auditing and many more where the aim is to ensure confidentiality and accessibility
    at the same time.


    # REFERENCES


    1.  1. R. Bharathi, and R. Selvarani, “Software reliability assessment of safety
    critical system using computational intelligence,” International Journal of Software
    Science and Computational Intelligence (IJSSCI), vol. 11, no. 3, p. 1–25, 2019.


    2.  2. D. Boneh, G. Di Crescenzo, R. Ostrovsky, and G. Persiano, “Public key encryption
    with keyword search,” in *International Conference on the Theory and Applications
    of Cryptographic Techniques*, 2004, pp. 506–522.'
