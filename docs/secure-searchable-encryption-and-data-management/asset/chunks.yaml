- raw: 'The reason here is that if *r* is pseudorandomly generated then what we are
    providing to A is what she is expecting, an encrypted message; then we say A breaks
    X with non-negligible advantage. If r was indeed random, then the given encryption
    scheme is an OTP, which we know is perfectly secure.


    *Possible reasoning*: The first and second rule of the reduction proof trivially
    holds as we have seen in the above discussion. For the third rule, we need to
    first define the distinguishing probability for which we have to consider the
    two possible cases: first, B outputs random (R) given that indeed *r* was random,
    i.e. *P**r*\[*B*→*R*|*r* *i**s* *R*\]; second, B outputs random (R) but now it
    is given a pseudorandom (PR), i.e. *P**r*\[*B*→*R*|*r* *i**s* *P**R*\]. B breaks
    G means the difference between these two probabilities is non-negligible.


    Alternatively, we may think: when does B output R, when *b*^′ ≠ *b*. So, *P**r*\[*B*→*R*|*r* *i**s* *R*\]
    is equivalent to *P**r*\[*b*^′≠*b*|*r* *i**s* *R*\]. When *r*  is  R, encryption
    is exactly a OTP. We know $Pr\\left\\lbrack {b^{''} \\neq b} \\right\\rbrack =
    ~Pr\\left\\lbrack {b^{''} = b} \\right\\rbrack = \\frac{1}{2}$. Also, *P**r*\[*B*→*P**R*|*r* *i**s* *P**R*\]
    is equivalent to *P**r*\[*b*^′≠*b*|*r* *i**s* *P**R*\] and *P**r*\[*b*^′≠*b*|*r* *i**s* *P**R*\]
    is the probability of A losing the security game X. We know the winning probability
    of A is $\\frac{1}{2} + non - neg\\left( n \\right)$. Hence, $Pr\\left\\lbrack
    b^{''} \\neq b \\middle| r\\ is\\ PR \\right\\rbrack = \\frac{1}{2} - non - neg\\left(
    n \\right)$. The distinguishing probability can now be easily calculated as $\\frac{1}{2}
    - \\left( {\\frac{1}{2} - non - neg\\left( n \\right)} \\right) = non - neg\\left(
    n \\right)$. Now, we will backtrack; we assumed that PRG is secure, so this distinguishing
    probability must be negligible and say it as *ε*(*n*). So, the probability of
    A winning security game X is $\\frac{1}{2} + \\varepsilon\\left( n \\right)$,
    where *ε*(*n*) is negligible. This proves if G is a secure PRG then X must be
    secure.


    The proof approach will remain in the case of searchable encryption schemes also;
    what varies is the security definition and the requirements, which we will state
    in the next section.


    ## [4.3 COMMON SECURITY DEFINITIONS IN SEARCHABLE ENCRYPTION](#contents.xhtml#rsec4_3)


    The first formal security definition for searchable encryption schemes was given
    by Goh \[[4](#04chap_04.xhtml#ref4_4)\]. They introduced security definition in
    symmetric key setting and defined the security of searchable index as the indistinguishability
    of keywords against adaptive chosen keyword attack (IND1-CKA). The definition
    states that the adversary cannot find any information about the data file by looking
    at its index provided the data file must be of equal length. This is similar to
    what we have seen in the general security definition where we assumed the messages
    must be equal length; otherwise, trivially they become distinguishable. Further,
    they specified that IND1-CKA does not require the trapdoor to be secure because
    they developed their scheme to be used as a secure data structure, which can have
    many other applications than just SSE, and most of the applications do not require
    the trapdoor to be secure. Chang and Mitzenmacher \[[5](#04chap_04.xhtml#ref4_5)\]
    introduced a stronger notion of security as compared to IND1-CKA security, in
    the sense that equal size restriction on the size of the documents is no longer
    needed and they also added the notion of trapdoor security in their definition.
    They assumed that the size of the documents may not be equal; however, they seem
    to contain the same number of keywords. Indeed, more factors were considered in
    the definition by \[[5](#04chap_04.xhtml#ref4_5)\], but their security definition
    has a flaw in it, which is pointed by Curtmola et al. \[[6](#04chap_04.xhtml#ref4_6)\]:
    the security conditions they mentioned for a SSE to be secure are satisfied by
    even an insecure SSE. Later Goh revisited their security definition and enhanced
    IND1-CKA by relaxing the equal-size document restriction like \[[5](#04chap_04.xhtml#ref4_5)\]
    and formally called in IND2-CKA. IND2-CKA indeed protects the document size, but
    does not consider the security of trapdoors. After, reviewing all the prevailing
    security definitions, Curtmola et al. \[[6](#04chap_04.xhtml#ref4_6)\] remarked
    that it is essential to consider the security of trapdoors because of their inherent
    association with the security of indexes. They introduced two security definitions
    for searchable encryption schemes, which became the standard definitions and are
    still used. Formally, they called them IND-CKA1 (indistinguishability against
    non-adaptive chosen keyword attack) and IND-CKA2 (indistinguishability against
    adaptive chosen keyword attack). Both of these definitions ensured that the index
    as well as the search trapdoor does not reveal any information about the data
    file and the keywords associated with the data file. The difference between IND-CKA1
    and IND-CKA2 lies in how and when the adversary can ask queries. IND-CKA1 ensures
    security if all the queries are asked once before the challenge phase and IND-CKA2
    allows the adversary to ask queries adaptively as a function of previous queries
    and search result. Therefore, IND-CKA2 is considered stronger than IND-CKA1.


    In the public-key setting, the first security definition for searchable encryption
    was given by Boneh et al. \[[7](#04chap_04.xhtml#ref4_7)\]. It is simply called
    IND-CKA, and it states that the adversary cannot get any information about the
    keywords until it has the trapdoor for that keyword. This security definition
    is similar to the eavesdropper''s security; here the adversary will choose two
    keywords ( *w*[0], *w*[1]) of her choice which are encrypted by the challenger
    and given back to the adversary. By looking at the keyword ciphertext, the adversary
    cannot tell whether it is the encryption of keyword *w*[0] or *w*[1], unless it
    has the trapdoor for that keyword. Another famous security definition for searchable
    encryption in a public-key setting was proposed by Canetti et al. \[[8](#04chap_04.xhtml#ref4_8)\]
    called selective security against CKA. It is the same as IND-CKA but here the
    adversary has to commit the keywords it intends to attack at the beginning of
    the security game. These two definitions are modeled as a security game between
    the challenger and the adversary (basics of which were covered in [Section 4.1.1](#04chap_04.xhtml#sec4_1_1)).
    The security game consists of the following phases as shown in [Figure 4.5](#04chap_04.xhtml#fig4_5):


    *   **Setup Phase**. The challenger runs *S**e**t**u**p*(1^(*n*)) algorithm. It
    outputs the master secret key, *M**S**K*, which is kept by him and the public
    parameters, *P**P*, which are sent to the adversary.


    ![Figure 4.5Game-based security definition for searchable encryption in public-key
    setting.](images/fig4_5.jpg)


    *Figure 4.5*Game-based security definition for searchable encryption in public-key
    setting.


    *   **Phase 1**. In this phase, adversary can issue secret key and trapdoor queries.
    The challenger runs a key generation algorithm using the *M**S**K* it possesses
    and generates a secret key, *S**K*. Given a keyword, *w*, challenger runs *T**r**a**p**d**o**o**r*(*S**K*,*w*
    which outputs a trapdoor, *T*[*w*]. The challenger then sends *T*[*w*] to adversary.
    The adversary can issue polynomial many queries in this phase.


    *   **Challenge Phase**. Here, the adversary picks a pair {𝓌[0],𝓌[1]} on which
    it wishes to be challenged and sends them to the challenger. Given {𝓌[0],𝓌[1]},
    the challenger selects a binary bit *b*←{0, 1}, and outputs *C*[*β*] using the
    generate index algorithm and sends it to the adversary.


    *   **Phase 2**. This phase is identical to Phase 1 with the condition that 𝒜
    cannot query for the trapdoor corresponding to challenge keyword {𝓌[0],𝓌[1]}.'
