    \  < ℝ,  +, 0>,  < ∑^(\\*), *c**o**n**c**a**t**e**n**a**t**i**o**n*, *λ*\\>.\n\
    \n### [1.2.3 Group](#contents.xhtml#rsec1_2_3)\n\nA group is an algebraic structure\
    \ with signature  < *S*, ∘,1,  − > where ∘ is a binary associative operation and\
    \ constant 1 is a two-sided identity for operation ∘ and − is a unary operation\
    \ defined over the carrier such that $\\\\forall x \\\\in S,~\\\\overset{-}{x}\\\
    \\ $ is an inverse of *x* w.r.t. ∘. It satisfies the closure, associative, identity\
    \ and inverse axioms. Examples of the group includes:  < ℤ, +,0,  − >, here, −\
    \ represents unary minus. If ∘  operation is commutative then the group is known\
    \ as an abelian group. Groups are the most commonly used algebraic structure in\
    \ the construction of cryptosystems. Therefore, we will try to cover as much detail\
    \ as possible keeping in mind the page limit.\n\n*The groups possess a unique\
    \ inverse:* Let element *a* of the group have two inverses *b* and *c*, *b* ∘ *a* = *e*\
    \ and *c* ∘ *a* = *e*, which implies *b*∘*a*\\=*c*∘*a*⇒*b*∘*a*∘*b*\\=*c*∘*a*∘*b*.\
    \ Let *a* ∘ *b* = *d*, *b* ∘ *d* = *c* ∘ *d*. Now, we know each element in the\
    \ group has an inverse, *b*∘*d*∘*d*^( − 1)\\=*c*∘*d*∘*d*^( − 1)⇒*b*∘*e*\\=*c*∘*e*.\
    \ Therefore, *b* = *c*."
