    # Chapter 2


    # Introduction to cryptography


    CRYPTOGRAPHY is not just an area of study but is a mandatory requirement in today''s
    digital world. It is an essential tool for keeping digital information safe both
    in the system and during its transmission. If we look carefully, cryptography
    can be seen everywhere, from secure communication over the Internet to user authentication
    and to encrypting files on our disks. Cryptography resides at the heart of every
    system or network that needs security and privacy. Cryptography existed for thousands
    of years and will continue to be the basis for developing security mechanisms.
    This chapter covers the basic concepts related to cryptography. It briefly discusses
    both traditional and modern cryptography as well as the journey from conventional
    to modern cryptography. It describes cryptographic principles and key terms in
    detail to build a strong foundation.


    ## 2.1 INTRODUCTION TO CRYPTOGRAPHY

