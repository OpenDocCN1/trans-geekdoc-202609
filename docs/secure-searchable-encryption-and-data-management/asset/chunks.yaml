- raw: 'The ABE scheme has a security threat of collusion. For example: A job posting
    has been encrypted under a policy such that only the users who have both a master''s
    degree and at least two-years of experience can decrypt. There may exists two
    users who individually possess only one of these attributes. So, the user with
    master degree but no experience should not be able to decrypt. Similarly, the
    user who has the experience but no degree should also not be able to decrypt.
    We want to prevent the scenario where somehow these users combine their keys and
    try to impersonate a user who has all the required attributes. Hence, the ABE
    scheme should be developed in a manner that prevents users from combining their
    keys and learning something that neither of them individually should be able to
    learn, otherwise the whole purpose of ABE is defeated.


    ## [2.5 CHAPTER SUMMARY](#contents.xhtml#rsec2_5)


    In this chapter, we have covered the cryptographic primitives from the beginning
    of their history to the latest techniques which are used today. We have described
    how the standard PKE technique is generalized and relaxed to get other public-key
    cryptographic techniques. We have mainly discussed aspects related to public-key
    cryptography because in later chapters our focus is on construction of searchable
    encryption schemes based on public-key cryptographic primitives. Among the PKE
    techniques, identity-based encryption and attribute-based encryption are discussed
    in detail because of their application in searchable encryption.


