- raw: 'Ameri et al. \[[24](#05chap_05.xhtml#ref5_24)\] proposed a temporary keyword
    search scheme to prevent information leakage from the search trapdoor. Their scheme
    is based on the key-policy design framework of the underlying ABE scheme. For
    the construction, they used a symmetric bilinear map, where source and target
    groups are of prime order, *p*. The access structure used in the scheme is of
    the general type represented by the tree data structure and a top-down approach
    is used to get the shares of the secret value. Their scheme is secure against
    CKA in a selective security model under a modified decisional Diffie–Hellman assumption.
    With respect to reducing computational cost, they made the number of pairing operations
    in the search algorithm independent of the number of time units specified in the
    search trapdoor.


    #### [5.2.2.4 Attribute-based searchable encryption for user level revocation](#contents.xhtml#rsec5_2_2_4)


    Mamta and Gupta \[[25](#05chap_05.xhtml#ref5_25)\] proposed an ABSE scheme with
    constant size user secret key and trapdoor. Further, the number of pairing operations
    in the search algorithm are constant. The constant term refers to the independence
    of these parameters from the number of attributes involved in the scheme. Thus,
    the resulting scheme reduces computational and storage cost and provides fast
    searching capabilities. Moreover, their scheme supports frequent changes in access
    policy. The access structure here is again of the general type and is represented
    by a tree data structure where internal represents AND, OR and threshold gate
    and the leaves represent the attributes. But unlike \[[24](#05chap_05.xhtml#ref5_24)\]
    they used a bottom-up approach to get the shares of a secret value. Their construction
    is based on a symmetric bilinear map where source and target groups are of prime
    order, *p*. Their scheme also handles the event of user revocation efficiently
    by delegating computationally intensive tasks to the cloud server. They proved
    security against CKA in the selective security model under the decision linear
    assumption.


    #### [5.2.2.5 Multi-authority attribute-based keyword search over encrypted cloud
    data](#contents.xhtml#rsec5_2_2_5)


    Miao et al \[[26](#05chap_05.xhtml#ref5_26)\] proposed a multi-authority attribute-based
    keyword search scheme, where independent attribute authorities can manage the
    attributes from a diverse domain very efficiently. They used the ciphertext-policy
    design framework of the ABE to build the keyword search scheme. The construction
    is based on a symmetric bilinear map where source and target groups are of prime
    order, *p*, and the access structure is represented by a monotone Boolean function.
    They used a linear secret sharing scheme (LSSS) to get the shares of a secret
    value. LSSS consists of a matrix of random elements and a mapping function which
    maps each row of the matrix with an attribute. Their scheme support attribute
    update and also provides tracing of malicious attribute authorities. Their scheme
    is selective secure under BDHE and DBDH assumption.


    #### [5.2.2.6 Searchable encryption for mobile healthcare networks](#contents.xhtml#rsec5_2_2_6)


    Mamta and Gupta \[[27](#05chap_05.xhtml#ref5_27)\] proposed a CP-ABE based searchable
    encryption scheme for the resource constrained mobile healthcare network. They
    made the size of both the ciphertext and the user secret key independent of the
    number of attributes involved in the scheme. Hence, their scheme is cost efficient.
    Moreover, their scheme results in fast search, as the number of pairing operations
    are also independent of the number of attributes. Their construction is based
    on an asymmetric bilinear map where source and target groups are of prime order,
    *p*, and the access structure is represented by AND gate. Their scheme is selective
    secure under augmented multi-sequence of exponents decisional Diffie–Hellman (aMSE-DDH)
    assumption.


    #### [5.2.2.7 Attribute-based searchable encryption for non-monotonic access structure](#contents.xhtml#rsec5_2_2_7)


    In an ABSE scheme, one assumption is made about the type of access structure supported
    by the scheme. Almost every ABSE scheme assumes a monotonic access structure.
    “Let 𝒫 = {*P*[1],*P*[2],…,*P*[*n*]} be a set of parties or attributes. The collection
    𝔸 ⊆ 2^({*P*[1], *P*[2], …, *P*[*n*]}) ∖ *Φ* (non-empty subsets of 𝒫) is monotonic
    if for any two arbitrary set of parties or attributes, i.e. *B* and *C* the following
    condition holds: *C* ∈ 𝔸 iff *B* ∈ 𝔸 and *B* ⊆ *C*,” i.e. a monotonic access structure
    is a collection 𝔸 of all non-empty subsets of 𝒫 such that if a subset *B* ∈ 𝔸
    then all its superset should also belong to 𝔸 \[[15](#05chap_05.xhtml#ref5_15)\].
    For example, let 𝒫 = {1,2,3} then the collection 𝔸 = {{1,2},{2,3},{1,2,3}} is
    monotonic while the collection 𝔸′ = {{1,2},{2,3}} is non-monotonic.


    For a better understanding, let''s take one example in the form of the following
    Boolean formula: *A* ∨ (*B*∧*C*) is a monotonic access structure since {*A*,*B*}
    as well as its superset {*A*,*B*,*C*} satisfies the given formula. *A* ∨ (*B*∧*C*′)
    is a non-monotonic access structure, since {*A*,*B*} satisfies it but its superset
    {*A*,*B*,*C*} does not satisfy the given formula. In other words, we can say that
    if a set and all its supersets satisfy the given access structure then that is
    known as monotonic access structure otherwise it is known as non-monotonic. From
    this example an important conclusion can be drawn that the presence of a NOT gate
    in an access structure makes it non-monotonic.


    For the non-monotonic access structure several ABE schemes have been developed
    in the literature but none has been developed for ABSE schemes nor in a KP design
    framework. Thus, there exists an opportunity to provide support for a non-monotonic
    access structure in the case of an ABSE scheme so that one can include complicated
    access structures which can truly be represented by the Boolean formula to determine
    the searching capabilities. Mamta et al. \[[28](#05chap_05.xhtml#ref5_28)\]. introduced
    a CP-ABSE scheme that can handle non-monotonic access structure. They made use
    of a reduced ordered binary decision diagram to represent the access structure
    and achieved the non-monotonic property.


