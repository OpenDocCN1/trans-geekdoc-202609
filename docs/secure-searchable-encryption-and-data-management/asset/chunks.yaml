    # 可搜索加密 (SE)


    可搜索加密 (SE) 是一种技术，它允许在加密域中执行搜索操作，而无需泄露任何关于搜索内容的信息。可搜索加密充当一种数据管理技术，允许数据所有者将其数据存储和管理在第三方、不可信的云服务器上，并允许数据用户将搜索功能委托给云服务器以检索该数据。因此，可搜索加密以优化成本实现了数据的安全存储和检索。可搜索加密适用于我们既需要保密性又需要可访问性的场景。除了直接用于搜索加密数据外，可搜索加密还改变了任何加密技术的工作方式。通常，加密技术要么解密完整数据，要么完全不解密，这使其不适用于仅需解密部分数据的情况。要设计这种灵活的系统，可以使用可搜索加密技术，在该技术中可以搜索加密数据的特定部分，从而实现部分解密。


    ## 3.1 对可搜索加密的需求


    近年来，我们见证了向云存储转变的显著趋势。云存储正成为本地存储的一个极具前景的替代方案。越来越多的公司选择云范式，因为存储维护的所有开销都委托给了云服务器
    [1][2]。此外，与本地存储不同，只要有互联网接入，存储在云中的数据就可以随时随地访问 [3][4]。除了云存储的这些优势外，还存在一些与云存储固有的担忧，其中隐私问题是最突出的
    [5][6]。数据存储在第三方服务器上，该服务器不能被信任以保障敏感数据的安全 [7][8]。理论上，通过以加密形式存储数据，可以轻松解决数据隐私问题 [4][5]。然而，虽然加密解决了隐私问题
    [9][10][11]，但也引发了其他一些严重问题，包括基本搜索操作的不可行性、与其他用户共享数据的灵活性降低等。为了解决这些问题，引入了可搜索加密的概念。可搜索加密允许第三方云服务器在加密数据上执行搜索，而无需泄露任何关于搜索内容的信息。安全可搜索加密是满足这一需求的答案
    [7][12]。


    ## 3.2 通用模型


    可搜索加密技术允许服务器代表客户端在加密数据中进行搜索，而无需泄露明文数据的信息。有少数方案通过使密文本身可搜索来实现可搜索加密 [1]；大多数方案生成一个可搜索的加密索引。可搜索加密索引可以通过从主数据文件中提取元数据项
    `W = (w[1], …, w[m])` 并使用一种支持在此索引上进行搜索操作的技术对其进行加密来生成。此操作通过执行可搜索加密方案中定义的加密算法 (`E[SE]`)
    来完成。在可搜索加密术语中，这些元数据项通常称为关键词。主数据文件也使用任意标准对称密钥加密 `E[Symm]` 进行加密，如图 3.1 所示。用于此目的的对称密钥可以使用我们生成索引时所用的相同加密技术进行加密。


    ![Figure 3.1 General model of a searchable encryption scheme.](img/fig3_1.jpg)


    *图 3.1* 可搜索加密方案的通用模型。


    然后，加密索引和加密数据文件被存储在云服务器上，该服务器通常被假定为诚实但好奇，即它可以被信任正确执行存储和查询协议，但它试图尽可能多地获取信息。整个任务由一个称为数据所有者的实体完成。现在，另一个称为数据用户的实体想要检索存储在云服务器上的加密信息。显然，他/她首先需要在数据文件中搜索以检索所需内容。数据用户通过生成一个搜索陷门（有时称为搜索令牌）来将此搜索操作委托给云服务器，该陷门/令牌针对其要查找的关键词，通过使用可搜索加密方案中定义的陷门算法
    (`Trapdoor[SE]`) 生成，并将其发送给云服务器。使用搜索陷门，云服务器现在能够在加密域中执行搜索，并返回包含查询关键词的文件引用，而无需实际解密任何内容。


    生成索引通常有两种方法，即正向方法和倒排方法，如图 3.2 所示。在正向方法中，索引是建立在数据文件 (`D[1], D[2], …, D[n]`) 上的，即将某些关键词与每个数据文件关联。在倒排方法中，索引是建立在关键词
    (`w[1], w[2], …, w[m]`) 上的，即为每个关键词索引其所属的数据文件。


    ![Figure 3.2 Approaches to generate index.](img/fig3_2.jpg)


    *图 3.2* 生成索引的方法。


    在正向索引方法中，搜索时间随数据文件的数量线性变化。在倒排索引方法中，搜索时间随包含特定关键词的文档数量变化，如果使用哈希树方法构建索引，则可以将其降低到亚线性。开发可搜索加密技术时会遵循其中一种方法，但通常在构造中不明确展示。可搜索加密方案的唯一重点是以高效方式加密与数据文件关联的元数据（关键词）。


    ## 3.3 可搜索加密方案的广泛分类


    可搜索加密方案可以使用对称密钥或公钥加密来开发。在云存储环境中，公钥设置是一个更优的选择，因为有多个用户可以访问共享存储，而对称密钥加密要求在这些用户之间分发密钥，这是一个非常复杂的过程，而在公钥设置中不需要这种密钥共享。因此，考虑到共享云存储环境，本书主要讨论使用公钥加密原语开发的可搜索加密方案。然而，在本章中，我们将提及对称密钥领域可搜索加密方面的一些开创性工作，并讨论公钥设置中的一些方案。


