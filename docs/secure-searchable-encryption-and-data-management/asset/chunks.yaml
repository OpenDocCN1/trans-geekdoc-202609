    由于逆元的存在，群中允许左消去和右消去。


    ### 1.2.3.1 对称有限群


    对称有限群定义在有限集合 *n* ∈ ℕ = {1,2,3,4,……,*n*} 上，通常表示为 *S*[*n*]。为了构造对称群，我们必须考虑 *n* 个元素的集合排列，并为每个排列指定一个名称。这些排列将成为群
    *S*[*n*] 的元素，然后我们必须定义合成律。例如：


    *S*[1] = {*i*} *S*[1] 的排列：


    ![](img/ufig1_1.jpg)


    *S*[1] 的合成律：


    ![](img/ufig1_2.jpg)


    *S*[2] = {*i*,*τ*} *S*[2] 的排列：


    ![](img/ufig1_3.jpg)


    *S*[2] 的合成律：


    ![](img/ufig1_4.jpg)


    *S*[*n*] 的阶是 *S*[*n*] 中元素的个数，即用 *n* 个元素可能的排列数，为 *n*!。从 *S*[3] 开始的对称群都是非阿贝尔群。


    ### 1.2.3.2 群同构


    为了理解群同构的概念，请考虑以下两个群：*G* : *S*[2] = {*i*,*τ*} *G*′ = {+1,−1}


    ```

    ∘  i  τ  ×  +1  -1

    i  i  τ  +1  +1  -1

    τ  τ  i  -1  -1  +1

    ```


    *G* 和 *G*′ 的合成表看起来很相似，通过重新标记符号，我们可以将 *G* 变为 *G*′，即 *i* → +1 和 *τ* → −1。我们已经看到
    *G* 和 *G*′ 具有完全相同的代数结构，我们只是使用了不同的符号。同构是一个保持群结构的重标记函数（φ），φ: *G* → *G*′（双射映射——满射且单射）。阶相同的群不一定同构。将所有彼此同构的群收集在一起形成同构类。如果两个群属于同一个同构类，这意味着它们彼此同构。


    *示例*：*G* = (ℝ,+)，其中 ℝ 是实数集合，*G* 是一个阿贝尔群。考虑另一个群 *G*′ = (ℝ⁺,×)，其中 ℝ⁺ 是正实数集合，*G*′
    也是一个阿贝尔群。现在，我们需要定义一个从 *G* 到 *G*′ 的双射映射，φ: *G* → *G*′ φ: *x* → *e*^(*x*)，∀*x* ∈
    *G* 且 *e*[*G*] 映射到 *e*[*G*′] (0 → 1)。因此 *G* 和 *G*′ 是同构的（*G* ≈ *G*′）。


    ### 1.2.3.3 子群


    群 *G* 的子集 *H* ⊂ *G* 如果在合成运算下封闭，则称为 *G* 的子群，记作 *H* ≺ *G*。并非 *G* 的所有子集都能构成群，因此我们必须巧妙地选择
    *H* 的元素。结合律公理显然成立。单位元必须包含在来自 *G* 的 *H* 中。*H* 中的每个元素都应有其逆元，即 ∀*h* ∈ *H*，∃*h*^(−1)
    ∈ *H*，使得 *h**h*^(−1) = *e* = *h*^(−1)*h*。


    *子群示例*：平凡情况包括 i) *G* = 整个群 *G*，ii) *H* = {*e*}。除平凡情况外：(ℤ, +) 是已知的阿贝尔群。考虑一个包含 *a*
    的整数倍的集合，*a*ℤ = {*a**z* | ∀*z* ∈ ℤ} = {0, *a*, −*a*, 2*a*, −2*a*, 3*a*, −3*a*,……}。显然，*a*ℤ
    ≺ ℤ。如果 *a* = 0，*a*ℤ = {0}；如果 *a* = 1，*a*ℤ = ℤ，这代表平凡子群。如果 *a* = 2，*a*ℤ = {0, 2,
    −2, 4, −4,……}；它代表一个真子群，仅包含偶数。事实上，*a*ℤ 是 *G* = (ℤ, +) 的唯一可能的子群。


    ### 1.2.3.4 子群的交


    子群的交也是子群，即如果 *H*[1], *H*[2] ≼ *G*，则 *H*[1] ⋂ *H*[2] ≼ *G*。两个子群的交总是非空的，因为它至少包含一个元素，即群的单位元。


    *封闭性*：∀ *g*, *ḡ* ∈ *H*₁ ⋂ *H*₂，我们需要证明：*gḡ* ∈ *H*₁ 且 *gḡ* ∈ *H*₂。我们知道 *g*, *ḡ*
    ∈ *H*₁，所以它们的合成 *gḡ* ∈ *H*₁。同理，*gḡ* ∈ *H*₂。因此，*gḡ* ∈ *H*₁ ⋂ *H*₂。*结合性*：继承自父群。*单位元*：显然成立。*逆元*：∀*g*
    ∈ *H*₁ ⋂ *H*₂，我们需要证明：*g*^(−1) ∈ *H*₁ ⋂ *H*₂。∀*g* ∈ *H*₁ ⋂ *H*₂ → *g* ∈ *H*₁ 且
    *g* ∈ *H*₂。*H*₁ 和 *H*₂ 是群，所以 *g*^(−1) ∈ *H*₁ 且 *g*^(−1) ∈ *H*₂。


    ### 1.2.3.5 循环群


    如果一个群中存在一个元素 *x* ∈ *G*（*x* 非单位元），称为该群的生成元，则该群称为循环群。顾名思义，生成元可以生成群的所有元素，即 ⟨*x*⟩
    = {*e*, *x*¹, *x*², *x*³, …… *x*^(−1), *x*^(−2), *x*^(−3), ……}。循环群的常见例子包括 (ℕ,+)
    和 (ℤ,+)。


    ## 1.2.4 环


    到目前为止，我们已经看到了具有一个二元运算的代数结构。环是一个具有两个二元运算的代数结构 (*A*, +, ⋅)，并满足以下条件：i) (*A*, +) 是一个阿贝尔群，ii)
    (*A*, ⋅) 是一个半群，iii) 运算 ⋅ 对运算 + 具有分配律。示例：(*Z*[*n*], ⊕, ⨀)。


    *除环*：每个非零元素都有乘法逆元，即如果 *a* ∈ *R* 且 *a* ≠ 0，则 ∃*a*^(−1) ∈ *R*： *a* ⋅ *a*^(−1) =
    1 = *a*^(−1) ⋅ *a*。


    *整环*：一个没有零因子的交换环，即 *a* ⋅ *b* = 0 ∀*a*, *b* ∈ *R* 当且仅当 *a* = 0 或 *b* = 0。


    ## 1.2.5 域


    具有两个二元运算的代数结构 (*A*, +, ⋅) 如果满足以下条件，则称为域：i) (*A*, +) 是一个阿贝尔群，ii) (*A*−{0}, ⋅) 是一个阿贝尔群，iii)
    运算 ⋅ 对运算 + 具有分配律。示例：(*R*, +, ⋅)，(*Z*[*p*], ⊕, ⨀)。


    ### 1.2.5.1 有限域


    有限域也称为伽罗瓦域，在密码学领域有广泛应用，就像群一样。有限域存在的条件是域有 *p*^(*m*) 个元素，其中 *p* 是素数，*m* 是任意正整数，即有限域的阶要么是素数，要么是素数的幂。*GF*(12)
    不存在。根据 *m* 的值，有限域分为两类：i) 如果 *m* = 1，称为素数域；ii) 如果 *m* > 1，称为扩域。


    ### 1.2.5.2 素数域及其运算


    素数域 *GF*(*p*) 的元素是整数 {0,1,2,…,*p*−1}。对于 *a*, *b* ∈ *GF*(*p*)，我们可以执行加法：(*a*+*b*)
    mod *p*；减法：(*a*−*b*) mod *p*；乘法：(*a**b*) mod *p*；除法：(*a**b*^(−1)) mod *p* 和求逆：*a*
    ∈ *GF*(*p*) 则 *a**a*^(−1) ≡ 1 mod *p*。*a*^(−1) 可用扩展欧几里得算法计算。


    ### 1.2.5.3 扩域及其运算


    在密码学中，我们主要关注 *p* = 2 的扩域。*GF*(2^(*m*)) 的元素是以下类型的多项式 *A*[*X*]：


    *a*[*m*−1]*x*^(*m*−1) + *a*[*m*−2]*x*^(*m*−2) + … + *a*[1]*x* + *a*[0]


    (1.12)


    其中 *a*[*i*] ∈ *GF*(2)（一般情况：*a*[*i*] ∈ *GF*(*p*) = {0,1,2,……,*p*−1}）。


    例如：*GF*(8) = *GF*(2³)。*A*[*X*] = *a*[2]*x*² + *a*[1]*x* + *a*[0]，其中 *a*[*i*] ∈
    *GF*(2)。该多项式可视为向量 (*a*[2], *a*[1], *a*[0])，可能的组合从 000 到 111。


    *GF*(2³) = {0, 1, *x*, *x*+1, *x*², *x*²+1, *x*²+*x*, *x*²+*x*+1}


    (1.13)


    设 *A*[*X*], *B*[*X*] ∈ *GF*(2^(*m*))。加法和减法运算执行如下：


    $$C[X] = A[X] + B[X] = \sum_{i=0}^{m-1} c_i x^i, \text{ where } c_i = (a_i + b_i)
    \mod 2$$


    (1.14)

