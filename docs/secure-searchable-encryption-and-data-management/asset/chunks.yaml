    ### [4.4.1 Random oracle model and standard model](#contents.xhtml#rsec4_4_1)


    Most of the encryption schemes including the searchable encryption are proved
    secure in either the random oracle model or the standard model. These are considered
    as both the design as well as the proof strategies. In the standard model, the
    only constraint on the adversary that it considers is of the computational resources
    i.e. the time and the computational power, and therefore it is also called the
    computational model. In the standard model only security/complexity assumptions
    are used to prove the security of a scheme. In the random oracle model, apart
    from the security assumptions, one more assumption is made about the cryptographic
    primitives. It considers them as ideal primitives; for example, the cryptographic
    hashes in the random oracle model are considered as a pure random function. It
    is efficient and relatively easy to prove the scheme in the random oracle model,
    but the practitioners focus more on developing the scheme using the standard model
    because when these idealized primitives are replaced with the actual ones, it
    may not guarantee the security of the scheme in the practical scenarios.


    ## [4.5 CHAPTER SUMMARY](#contents.xhtml#rsec4_5)


    This chapter introduced the concept of provable security and its application in
    developing a secure searchable encryption. This chapter provided the basic security
    definitions used in searchable encryption and also explains the different security
    models that can be employed to prove the security of a searchable encryption scheme.
    Moreover, this chapter provided an introduction to cryptographic assumptions used
    in provable security and cited the commonly used assumptions in searchable encryption.


