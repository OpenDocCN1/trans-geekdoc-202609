    ].\n\n## [1.2 ABSTRACT ALGEBRA](#contents.xhtml#rsec1_2)\n\nAbstract algebra \\\
    [[6](#01chap_01.xhtml#ref1_6)\\], \\[[7](#01chap_01.xhtml#ref1_7)\\] represents\
    \ a class of powerful mathematical tools which have application in diverse fields.\
    \ It is an extension of classical algebra which deals with abstract structures\
    \ like groups, rings and fields instead of the usual number system. In this section,\
    \ we will have an overview of these structures which is a prerequisite in understanding\
    \ the core of cryptosystems.\n\nAn algebraic structure is characterized by the\
    \ following three components:\n\n*   An underlying set, which is often called\
    \ the carrier set of the algebraic structure.\n\n*   Operations defined on the\
    \ elements of the underlying set.\n\n*   Distinguished elements of the set called\
    \ the constants of the algebraic structure.\n\nFor example: (ℤ, +, 0) is an algebraic\
    \ structure, where ℤ= Set of integers, + = Binary operation (Mapping from ℤ²→ℤ),\
    \ ℤ² means the operation is applied between the two elements of the set ℤ and\
    \ the resulting element also belongs to the set ℤ, 0 = *C* Constant of algebra.\n\
    \nIn general, the operator may take *m* elements: *S*^(*m*)→*S*, here, *m* is\
    \ called the arity of the operation. Any two algebraic structures may have the\
    \ same signature, same number of operations with the same arity and the same number\
    \ of constants. For example, ( ℤ, +,  ⋅,  −, 1, 0)   and  (ℝ, +,  ⋅,  −, 1, 0),\
    \ here ℝ is the set of real numbers. The two algebras having the same signature\
    \ may not have the same property. ( ℤ,−,0) and  (ℚ,+,0). Here, commutative law\
    \ holds for the second but not for the first.\n\n*Sub-Algebraic Structure*: Let\
    \ *A*\\=  < *S*, ∘, △,*k* > *a**n**d*  *A*^′ = (*S*^′, ∘^′, △^′*k*^′) be two algebras\
    \ then *A*^′ is a subalgebra of *A* if i) *S*^′ ⊆ *S*, ii) *a*∘^′*b* = *a* ∘ *b*,   ∀*a*, *b* ∈ *S*^′,\
    \ iii) △^′*a* =  △ *a*,  ∀*a* ∈ *S*^′ and iv) *k*^′ = *k*. If *A*^′ is subalgebra\
    \ of *A* then *A*^′ has the same signature as *A* and obeys the same axioms.\n\
    \n*Zero and One Element:* Let ∘ be a binary operation on *S*. An element 1 ∈ *S*\
    \ is an identity for operation ∘ if for every *x* ∈ *S*, 1[*l*] ∘ *x* = *x* ∘ 1[*r*] = *x*.\
    \ An element 0 ∈ *S* is a zero for operation ∘ if for every *x* ∈ *S*, 0[*l*] ∘ *x* = *x* ∘ 0[*r*] = 0.\n\
    \nConsider the following algebraic structure:  = {*a*, *b*, *c*}, operation: ∘,\
