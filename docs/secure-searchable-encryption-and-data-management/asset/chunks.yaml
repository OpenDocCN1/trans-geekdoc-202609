    ## 2.4 Generalization of Public-Key Encryption


    If we recall public-key encryption technique type, there are three main algorithms:
    key-generation, encryption and decryption. The key-generation algorithm takes
    the security parameter and generates a public and private key pair. The public
    key generated by this algorithm is completely random. In 1984 Shamir proposed
    an idea that instead of using the public key as a complicated random string, use
    something like an email address, phone number, IP address etc. which is unique
    for the users. This generalization of the public-key encryption is called the
    identity-based encryption (IBE) [[13]](#02chap_02.xhtml#ref2_13), [[14]](#02chap_02.xhtml#ref2_14),
    [[15]](#02chap_02.xhtml#ref2_15), [[16]](#02chap_02.xhtml#ref2_16). So now, when
    Bob encrypts a message for Alice, he will use Alice''s email address as the public
    key and Alice can use the private key generator to extract the private key corresponding
    to her ID, i.e. the email address in this case. Like IBE there are other generalizations
    to the standard public-key encryption (PKE) techniques like attribute-based encryption
    (ABE) [[17]](#02chap_02.xhtml#ref2_17), [[18]](#02chap_02.xhtml#ref2_18), [[19]](#02chap_02.xhtml#ref2_19),
    [[20]](#02chap_02.xhtml#ref2_20), [[21]](#02chap_02.xhtml#ref2_21), [[22]](#02chap_02.xhtml#ref2_22),
    broadcast encryption (BE) [[23]](#02chap_02.xhtml#ref2_23), [[24]](#02chap_02.xhtml#ref2_24),
    homomorphic encryption (HE) [[25]](#02chap_02.xhtml#ref2_25) and functional encryption
    (FE) [[26]](#02chap_02.xhtml#ref2_26), [[27]](#02chap_02.xhtml#ref2_27), [[28]](#02chap_02.xhtml#ref2_28),
    [[29]](#02chap_02.xhtml#ref2_29) as shown in [Figure 2.4](#02chap_02.xhtml#fig2_4).
    Among them we will discuss IBE and ABE as we have seen a lot of application of
    these two techniques in the construction of searchable encryption schemes.


    ![Figure 2.4 Generalization of PKE.](images/fig2_4.jpg)


    *Figure 2.4* Generalization of PKE.


    ### 2.4.1 Identity-based encryption (IBE)


    In IBE there are four algorithms, one additional algorithm is called the setup
    algorithm, `S`, and the other three are the same as the standard PKE.


    * `(PP, MSK) ← S(λ)`: The setup algorithm takes the security parameter and produces
    the public parameters, `PP`, and master secret key, `MSK`. This algorithm is generally
    executed by a trusted third party often called the key-generation center (KGC).

    * `SK[ID] ← K(MSK, ID)`: The key generator algorithm takes the `MSK` and `ID`
    of the user and generates his private key corresponding to his `ID`, i.e. `SK[ID]`.

    * `C ← E(PP, ID, m)`: The encryption algorithm encrypts the message, `m`, using
    the public-key `ID` and `PP` and outputs the ciphertext, `C`.

    * `m ← D(SK[ID], C)`: The decryption algorithm decrypts the ciphertext using `SK[ID]`.


    **Correctness Proof:** The IBE scheme is said to be correct if ∀ `PP` and `SK[id]`
    generated from `IBE_Setup(λ)`, the following condition holds:


    ```

    D(SK[ID], E(PP, ID, m)) = m

    ```

    (2.2)


    The pictorial representation of the IBE scheme can be seen in [Figure 2.5](#02chap_02.xhtml#fig2_5).


    ![Figure 2.5 A typical IBE scheme.](images/fig2_5.jpg)


    *Figure 2.5* A typical IBE scheme.


    With an IBE scheme using the single master key and the different IDs we can generate
    the different secret keys. Basically, in IBE an attempt has been made to compress
    the exponential number of public keys into one short public parameters string.
    The first practical IBE scheme was designed by Boneh and Franklin [[30]](#02chap_02.xhtml#ref2_30)
    in 2001.


    ### 2.4.2 Attribute-based encryption (ABE)


    IBE is a very natural extension of PKE, like PKE using IBE, we can send the message
    to a single intended user. ABE is developed for a different scenario; say we have
    a lot of data, like an encrypted database, and we have a diverse set of users
    who need access to different pieces of that data and it is not necessarily their
    identity which determines who would access what. Instead the attributes of the
    users will determine their access capability. For example: we may want to provide
    access to the authorized users based on their type of job etc. We see this type
    of scenario everywhere around us. Attribute-based encryption is devised to handle
    such scenarios. It is one of the most popular PKE techniques. It provides fine-grained
    access control capabilities. Before ABE every PKE scheme was one-to-one, i.e.
    the encrypted message is intended for just one user. In ABE we can send the same
    encrypted message intended for multiple users and thus it supports the one-to-many
    scenario. Based on attributes either associated with the users or the data, we
    have two variants called key-policy attribute-based encryption (KP-ABE) and ciphertext-policy
    attribute-based encryption (CP-ABE). In KP-ABE, the access policy is associated
    with the secret key of the user and attributes are associated with the ciphertext.
    In CP-ABE, the access policy is associated with the ciphertext and the attributes
    are associated with secret key of the user. For the purpose of common presentation,
    let `I[K]` denotes the input to the key-generation algorithm, `K` and `I[E]` denotes
    the input to the encryption algorithm, `E`. In KP-ABE, `I[K]` and `I[E]` are the
    access policy and the set of attributes respectively. In CP-ABE, `I[K]` and `I[E]`
    are the set of attributes and the access policy respectively. Like IBE, ABE schemes
    also consist of four polynomial time algorithms:


    * `(PP, MSK) ← S(λ, Att)`: The setup algorithm takes the attribute universe, `Att
    = {att[1], att[2], ..., att[|Att|]}` in addition to the security parameter, `λ`
    like in IBE scheme and outputs the public parameters `PP` and master secret key
    `MSK`.

    * `SK[u] ← K(PP, MSK, I[K])`: The key generator algorithm takes the `MSK` and
    the credentials of a user, `I[K]`, and generates his private key corresponding
    to his credentials, i.e. `SK[u]`.

    * `C ← E(PP, m ∈ ℳ, I[E])`: The encryption algorithm encrypts the message, `m`,
    using `I[E]` and `PP` and outputs the ciphertext, `C`.

    * `m ← D(C, SK[u])`: The decryption algorithm decrypts the ciphertext using `SK[u]`
    if and only if the satisfiability condition holds between `I[K]` and `I[E]`.


    **Correctness Proof:** if the satisfiability condition holds between `I[K]` and
    `I[E]`, then for the given `PP` and `MSK`, the following condition must hold:


    ```

    D(E(m, PP, I[E]), SK[u]) = m

    ```

    (2.3)


    The pictorial representation of KP-ABE scheme can be seen in [Figure 2.6](#02chap_02.xhtml#fig2_6).
    Here, the user possesses a set of attributes and gets the corresponding secret
    key from KGC. Consider an example of an educational institute, where the department
    of computer engineering has released the marks of Ph.D. and M.Tech. students.
    The marks are uploaded on their shared storage and the department wants the marks
    to only be accessed by the specified candidates. Hence, they encrypt them with
    an access policy, `W = CE ∧ (PhD ∨ MTech)` and upload them to their shared storage.
    When some student with credentials, `L`, wants to check his/her marks, he/she
    will be able to decrypt if and only if `L` satisfies `W`. As we can see in the
    [Figure 2.6](#02chap_02.xhtml#fig2_6), only user `U[3]`''s credentials satisfy
    `W` and hence he/she will be able to see the marks.


    ![Figure 2.6 A typical CP-ABE scheme.](images/fig2_6.jpg)


    *Figure 2.6* A typical CP-ABE scheme.

