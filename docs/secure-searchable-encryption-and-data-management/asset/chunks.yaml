    # 对称密钥原语


    对称密钥原语允许单个用户读取和写入数据，并且仅允许密钥持有者创建可搜索密文和陷门 [13]。对称可搜索加密（SSE）的直接应用可见于这样一种场景：某用户希望以加密形式将其数据存储在云存储中，随后他/她可以对其执行搜索以检索所需数据
    [14]。索引方法仅在 SSE 方案中被明确提及和解决。第一个 SSE 由 Song 等人 [15] 提出。该方案支持相等查询，并被开发用于仅处理单个关键词。为了加密数据，首先将其分割成称为“词”的固定大小块，然后通过以特定格式插入哈希值，独立地加密每个词。该过程产生的密文本身即是可搜索的。云服务器通过提取哈希并查找用户指示的特定格式来执行搜索。然而，该方案有一个限制，即它需要将数据分割成固定大小的词，这与现有的加密标准不兼容。此外，他们未为该方案提供任何正式的安全定义或安全证明。后来，在
    2003 年，Goh [16] 放宽了 Song 等人方案中的固定大小限制。他们采用直接索引方法，使用布隆过滤器为每个数据文件构建索引。2005 年，Chang
    和 Mitzenmacher [17] 开发了一种 SSE 方案，与 Goh 方案类似，他们采用直接索引方法，基于搜索关键词字典而非布隆过滤器构建索引，因为布隆过滤器固有极高的误报率。2006
    年，Curtmola 等人 [18] 首次使用倒排索引方法，实现了亚线性搜索时间。下表 表 3.1 给出了 SSE 领域这些开创性工作在计算复杂度和关键特性方面的比较分析。


    ## 表 3.1 SSE 领域开创性工作的比较分析


    | 方案 | 加密时间 | 陷门生成时间 | 搜索时间 | 特性 |

    | --- | --- | --- | --- | --- |

    | Song 等人 [15] | `D ⋅ K` | `k` | `D ⋅ K` | 顺序扫描 |

    | Chang & Mitzenmacher [17] | `D(K + K″)` | `2k` | `D` | 搜索关键词字典 |

    | E. J. Goh [16] | `D ⋅ K′` | `k` | `D ⋅ k` | 布隆过滤器索引 |

    | Curtmola 等人 [18] | `3K″ ⋅ D + D(w)` | `2k` | `D(w)` | 亚线性搜索时间 |


    **注：**


    *   `D` — 文档数量

    *   `K` — 每个文档的关键词数量

    *   `K′` — 每个文档的不同关键词数量

    *   `K″` — 数据库中的不同关键词数量

    *   `k` — 每个陷门的关键词数量


    我们之前提到过，我们考虑的是一种云存储环境，其中数据所有者可能希望共享其数据，而不仅仅是为自己存储。确实，对称密钥加密速度快，但在我们所考虑的场景中，由于向所有用户分发密钥，对称密钥加密变得相当复杂。因此，我们将在第
    5 章 Chapter 5 中详细讨论公钥设置下的可搜索加密，并在下一节中给出概述。


    ## 3.3.2 公钥设置下的可搜索加密


    基于身份的加密和基于属性的加密等公钥密码学原语是利用一种称为双线性映射的工具开发的，此类方案通常称为基于配对的密码学方案。公钥设置下的可搜索加密方案显然会使用该工具。因此，在开始讨论基于公钥的可搜索加密方案之前，让我们先讨论一些关于这一强大工具的有趣事实。


    ### 3.3.2.1 双线性映射


    双线性映射是一种函数，它将一个循环群中的元素映射到另一个循环群中的元素。双线性映射常被称为双线性配对，因为它们接受源群中一对两个元素，并将该对映射到目标群中的一个元素。


    设 `G₁`、`G₂` 为素数阶 `p` 的源循环群，`G_T` 为同阶素数 `p` 的目标循环群，`g`、`h` 分别为源群 `G₁` 和 `G₂` 的生成元。设
    `e` 为 `G₁` 和 `G₂` 之间的映射，`e: G₁ × G₂ → G_T`，若满足以下条件，则称其为双线性映射：


    *   `∀ X = g^(u) ∈ G₁ and Y = h^(v) ∈ G₂ : e(g^(u), h^(v)) = e(g, h)^(u·v)`，其中
    `u, v ∈ Z_p`。这称为双线性性质。

    *   若 `g`、`h` 分别为源群 `G₁` 和 `G₂` 的生成元，则 `e(g, h)` 为目标群 `G_T` 的生成元。此性质称为非退化性。

    *   `∀ X ∈ G₁ and Y ∈ G₂; e(l, m)` 可高效计算。


    若 `e` 将每一对映射到 `G_T` 中的单位元，则称该双线性映射为退化的，即若仅有第一个条件，则也允许退化映射。因此，添加第二个条件以使双线性映射有效。


    #### 3.3.2.1.1 `e` 中源群与目标群的关系


    在所有源群和目标群之间存在同构，因为它们都是循环群且具有相同的阶。然而，它们拥有不同的元素，元素间的运算也可能不同，这使它们彼此区别。若 `G₁ = G₂`，即两个源群完全相同，则相关映射称为对称双线性映射；若两者不同，则称为非对称双线性映射。此外，源群和目标群的阶也可能是合数，而非某个素数
    `p`。大多数构造考虑素数阶群，文献中也存在考虑合数阶群的例子。若源群和目标群全都相等，则相关映射称为自双线性映射。此类映射不存在，构造一个是一个开放问题。


    在一些现有工作中，曾见到另一种符号，其中双线性性质表示为 `e(u·X, v·Y)` 而非 `e(X^(u), Y^(v))`，其中 `X`、`Y` 为源群元素。当群以加法形式书写时会出现这种情况，然而乘法符号更为流行。


    #### 3.3.2.1.2 如何选择源群和目标群


    对于源群，通常使用有限域 `F_p` 上的椭圆曲线。根据选择不同嵌入度的椭圆曲线，会产生不同类型的配对，即类型 A、A1、D、E、F 和 G [19]。而目标群通常是一个有限域。


    Weil [20] 和 Tate [21, 22] 配对是已知的双线性配对的唯一例子。Weil 配对曾被 Boneh 和 Franklin [23] 实际用于构造基于身份的加密方案。


    ### 3.3.2.2 公钥设置下的第一个开创性 SE 方案


