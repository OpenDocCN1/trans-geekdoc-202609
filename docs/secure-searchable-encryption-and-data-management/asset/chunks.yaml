    The left and right cancellation is permitted in groups because of the existence
    of inverses.


    ### 1.2.3.1 Symmetric finite group


    The symmetric finite group is defined over the finite set *n* ∈ ℕ = {1,2,3,4,……,*n*}
    and is often represented as *S*[*n*]. For construction of symmetric groups, we
    have to consider the set permutation of *n* elements and give each permutation
    a name. These permutations will be the elements of group *S*[*n*] and then we
    have to define the composition law. For example:


    *S*[1] = {*i*} Permutation for *S*[1]:


    ![](images/ufig1_1.jpg)


    Composition law for *S*[1]:


    ![](images/ufig1_2.jpg)


    *S*[2] = {*i*,*τ*} Permutations for *S*[2]:


    ![](images/ufig1_3.jpg)


    Composition law for *S*[2]:


    ![](images/ufig1_4.jpg)


    The order of *S*[*n*] is the number of elements in *S*[*n*] and it is the number
    of permutations possible with *n* elements which is *n*!. The symmetric groups
    from *S*[3] onwards are not abelian.


    ### 1.2.3.2 Group isomorphism


    To understand the concept of group isomorphism, consider the following two groups:
    *G* : *S*[2] = {*i*,*τ*} *G*′ = {+1,−1}


    ```

    ∘  i  τ  ×  +1  -1

    i  i  τ  +1  +1  -1

    τ  τ  i  -1  -1  +1

    ```


    The composition table of *G* and *G*′ look similar and by relabeling of symbols
    we can turn *G* into *G*′, i.e. *i* → +1 and *τ* → −1. We have seen that *G* and
    *G*′ have exact same algebraic structure, we are only using different symbols.
    Isomorphism is a relabeling function (φ) which preserves the group structure,
    φ: *G* → *G*′ (bijective mapping – surjective and injective). It is not necessary
    that groups having the same order are isomorphic. Collecting all the groups that
    are isomorphic to one another together forms the isomorphism class. If two groups
    share the same isomorphism class, this means they are isomorphic to each other.


    *Example*: *G* = (ℝ,+), where ℝ is the set of real numbers and *G* is an abelian
    group. Consider another group *G*′ = (ℝ⁺,×), where ℝ⁺ is the set of positive real
    numbers and *G*′ is also an abelian group. Now, we need to define a bijective
    map, φ: *G* → *G*′ from *G* to *G*′ φ: *x* → *e*^(*x*), ∀*x* ∈ *G* and *e*[*G*]
    is mapped to *e*[*G*′] (0 → 1). Hence *G* and *G*′ are isomorphic (*G* ≈ *G*′).


    ### 1.2.3.3 Subgroup


    The subset *H* ⊂ *G* of a group *G* is called subgroup *H* ≺ *G* of *G* if it
    is closed under composition. It is not necessary that all subsets of *G* form
    a group, so we have to cleverly choose the elements of *H*. The associativity
    axiom is trivial to prove. The identity element must be included in *H* from *G*.
    Each element in *H* should have its inverse ∀*h* ∈ *H*, ∃*h*^(−1) ∈ *H*, such
    that *h**h*^(−1) = *e* = *h*^(−1)*h*.


    *Example of subgroups*: Trivial cases includes i) *G* = Entire group *G*, ii)
    *H* = {*e*}. Other than trivial cases: (ℤ, +) is a known abelian group. Consider
    a set containing integer multiples of *a*, *a*ℤ = {*a**z* | ∀*z* ∈ ℤ} = {0, *a*,
    −*a*, 2*a*, −2*a*, 3*a*, −3*a*,……}. Clearly, *a*ℤ ≺ ℤ. If *a* = 0, *a*ℤ = {0}
    and if *a* = 1, *a*ℤ = ℤ represents the trivial subgroups. If *a* = 2, *a*ℤ =
    {0, 2, −2, 4, −4,……}; it represents a proper subgroup which contains only even
    numbers. In fact, *a*ℤ are the only possible subgroups of *G* = (ℤ, +).


    ### 1.2.3.4 Intersection of subgroups


    The intersection of subgroups is also a subgroup, i.e. if *H*[1], *H*[2] ≼ *G*
    then *H*[1] ⋂ *H*[2] ≼ *G*. The intersection of two subgroups is always non-empty
    because it will contain at least one element, i.e. identity of group.


    *Closure*: ∀ *g*, *ḡ* ∈ *H*₁ ⋂ *H*₂, we have to show: *gḡ* ∈ *H*₁ and *gḡ* ∈ *H*₂.
    We know *g*, *ḡ* ∈ *H*₁, so their composition *gḡ* ∈ *H*₁. Similarly, *gḡ* ∈ *H*₂.
    Therefore, *gḡ* ∈ *H*₁ ⋂ *H*₂. Associativity: Inherited. Identity: Trivial. Inverse:
    ∀*g* ∈ *H*₁ ⋂ *H*₂, we need to show: *g*^(−1) ∈ *H*₁ ⋂ *H*₂. ∀*g* ∈ *H*₁ ⋂ *H*₂
    → *g* ∈ *H*₁ and *g* ∈ *H*₂. *H*₁ and *H*₂ are groups so *g*^(−1) ∈ *H*₁ and *g*^(−1)
    ∈ *H*₂.


    ### 1.2.3.5 Cyclic groups


    If in a group there exists an element *x* ∈ *G* (*x* is non-identity) called the
    generator of the group then that group is known as a cyclic group. As the name
    itself suggests, the generator element can generate all the elements of the group,
    i.e. ⟨*x*⟩ = {*e*, *x*¹, *x*², *x*³, …… *x*^(−1), *x*^(−2), *x*^(−3), ……}. The
    common examples of cyclic groups include, (ℕ,+) and (ℤ,+).


    ## 1.2.4 Ring


    So far we have seen algebraic structures with one binary operation. Ring is an
    algebraic structure (*A*, +, ⋅) with two binary operations and satisfies the following
    conditions: i) (*A*, +) is an abelian group, ii) (*A*, ⋅) is a semigroup and iii)
    the operation ⋅ is distributive over the operation +. Example: (*Z*[*n*], ⊕, ⨀).


    *Division ring*: Every non-zero element has a multiplicative inverse, i.e. if
    *a* ∈ *R* and *a* ≠ 0 then ∃*a*^(−1) ∈ *R*: *a* ⋅ *a*^(−1) = 1 = *a*^(−1) ⋅ *a*.


    *Integral domain*: A commutative ring that has no zero divisors, i.e. *a* ⋅ *b*
    = 0 ∀*a*, *b* ∈ *R* iff *a* = 0 or *b* = 0.


    ## 1.2.5 Field


    An algebraic structure (*A*, +, ⋅) with two binary operations is called a field
    if the following conditions are satisfied: i) (*A*, +) is an abelian group, ii)
    (*A*−{0}, ⋅) is an abelian group and iii) the operation ⋅ is distributive over
    the operation +. Example: (*R*, +, ⋅), (*Z*[*p*], ⊕, ⨀).


    ### 1.2.5.1 Finite fields


    Finite fields are also known as Galois fields and have great application in the
    cryptography domain like the groups. Finite fields exist if the fields have *p*^(*m*)
    elements where *p* is prime number and *m* is any positive integer, i.e. the order
    of the finite field is either a prime or a power of prime. *GF*(12) do not exist.
    There are two types of finite fields depending upon the value of *m*: i) if *m*
    = 1, these are known as the prime fields; ii) if *m* > 1, these are known as the
    extension fields.


    ### 1.2.5.2 Prime fields and their arithmetic


    The elements of a prime field *GF*(*p*) are integers {0,1,2,…,*p*−1}. For *a*,
    *b* ∈ *GF*(*p*), we can perform addition: (*a*+*b*) mod *p*; subtraction: (*a*−*b*)
    mod *p*; multiplication: (*a**b*) mod *p*; division: (*a**b*^(−1)) mod *p* and
    inversion: *a* ∈ *GF*(*p*) then *a**a*^(−1) ≡ 1 mod *p*. *a*^(−1) can be computed
    with the extended Euclidean algorithm.


    ### 1.2.5.3 Extension fields and their arithmetic


    In cryptography we are mainly interested in extension fields where *p* = 2. The
    elements of *GF*(2^(*m*)) are polynomials *A*[*X*] of the following type:


    *a*[*m*−1]*x*^(*m*−1) + *a*[*m*−2]*x*^(*m*−2) + … + *a*[1]*x* + *a*[0]


    (1.12)


    where *a*[*i*] ∈ *GF*(2) (In general: *a*[*i*] ∈ *GF*(*p*) = {0,1,2,……,*p*−1}).


    For example: *GF*(8) = *GF*(2³). *A*[*X*] = *a*[2]*x*² + *a*[1]*x* + *a*[0], where
    *a*[*i*] ∈ *GF*(2). This polynomial is considered as a vector (*a*[2], *a*[1],
    *a*[0]) with possible combinations from 000 to 111.


    *GF*(2³) = {0, 1, *x*, *x*+1, *x*², *x*²+1, *x*²+*x*, *x*²+*x*+1}


    (1.13)


    Let *A*[*X*], *B*[*X*] ∈ *GF*(2^(*m*)). The addition and subtraction operation
    is performed as follows:


    $$C[X] = A[X] + B[X] = \sum_{i=0}^{m-1} c_i x^i, \text{ where } c_i = (a_i + b_i)
    \mod 2$$


    (1.14)

