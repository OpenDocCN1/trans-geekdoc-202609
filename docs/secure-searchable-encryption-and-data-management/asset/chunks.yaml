- raw: "PPT algorithm B plays two key roles here, it is simulating a real challenger\
    \ as A is expecting its communication with a real challenger in the security game\
    \ of scheme X. On the other hand, B is acting as an adversary to the outside challenger\
    \ as per the security game of scheme Y. A will receive some input from B like\
    \ we have seen in the game-based security definition in [Figure 4.1](#04chap_04.xhtml#fig4_1),\
    \ but we have no idea how A works. The interesting part is to construct B and\
    \ write its pseudocode such that it will simulate the challenger for A, thus its\
    \ code should be similar to the challenger in X's security game. While writing\
    \ the code, remember that B has no idea of A's working, B just knows that A is\
    \ going to behave according to the security game of scheme X. If we are considering\
    \ the eavesdropper security, then B knows that A will output two messages and\
    \ finally it outputs a guess bit. For B, there is a different security game, the\
    \ game associated with the scheme Y. Now, as far as scheme Y is concerned, we\
    \ know B will behave as an adversary and will interact with some outside challenger\
    \ defined for scheme Y. This outside challenger will give something to B as per\
    \ the security game of scheme Y, and like A, B can also send to and receive back\
    \ something from the outside challenger. Finally, B also needs to output something\
    \ in order to win the security game Y. For the scheme Y, there exists a well-defined\
    \ code for the challenger (outside challenger).\n\nFor scheme X, we just know\
    \ the interaction between A and B and we have to write the code for B. However,\
    \ for scheme Y, we know both the interaction as well as the code. Hence, our goal\
    \ is to write down code for B such that the interaction with the outside challenger\
    \ is somehow tied to the interaction of B with A. At the end, if A wins the security\
    \ game of X, we hopefully want B to win the security game of Y.\n\nThere are three\
    \ rules in a reduction approach:\n\n*   The algorithm we construct, i.e. B, must\
    \ be a PPT algorithm. We have to consider three things to make sure B is a PPT\
    \ algorithm. First, the pseudocode that we will write for B must take polynomial\
    \ time (PT). Second, inside B, A is called as a sub-routine; we do not know the\
    \ working of A, but one thing we know is whatever is done by A is done in PT.\
    \ Therefore, overall, first and second together also results in PT. Third, the\
    \ interactions of B with the outside challenger must be polynomial number.\n\n\
    *   The second rule is about the simulation. B simulating the challenger for A.\
    \ The interactions between A and B, as far as A is concerned, must be indistinguishable,\
    \ i.e. B should do exactly the same as a real challenger would have done in the\
    \ security game of X. Alternatively, we can say B's behavior in terms of the interaction\
    \ with A should be like the behavior of a challenger in the security game of scheme\
    \ X.\n\n*   The third rule is about the probability of winning the security game.\
    \ A wins the security game X (this means correctly distinguishing the messages\
    \ and thus correctly guessing the bit, in the case of eavesdropper security) with\
    \ probability 1/2 + *n**o**n* − *n**e**g*(*n*). Now, let's says B's winning condition\
    \ is that it needs to find something with non-negligible advantage. Now, what\
    \ we need to show is that, if A wins the security game X, then B takes the output\
    \ of A and runs it through some code and outputs its response and B must also\
    \ win the security game Y with non-negligible advantage.\n\nFor every reduction\
    \ proof, while writing the code for B, we need to analyze these three rules.\n\
    \n*Reasoning in terms of the contrapositive:* The contrapositive of the third\
    \ rule as shown in [Figure 4.3](#04chap_04.xhtml#fig4_3) is the following: since\
    \ we do not know any such algorithm B that has non-negligible advantage, therefore,\
    \ all the algorithms that try to break Y have only negligible advantage, because\
    \ Y is a known hard problem. As for the contrapositive, this means that all the\
    \ algorithms, A, must also have the negligible advantage. Hence, the scheme X\
    \ is secure.\n\n![Figure 4.3Application of contrapositive to the third rule of\
    \ reduction approach.](images/fig4_3.jpg)\n\n*Figure 4.3*Application of contrapositive\
    \ to the third rule of reduction approach.\n\nTo see the application of the reduction\
    \ approach, we consider a simple pseudorandom generator (PRG)-based encryption\
    \ scheme. Here, we are basically developing a practical on-time pad. As mentioned\
    \ in [Chapter 2](#02chap_02.xhtml), one-time pad (OTP) has perfect secrecy but\
    \ it cannot be applied to messages of very long length because we have to take\
    \ the same length key in order to encrypt the message.\n\n### [4.2.1 Example of\
    \ reduction proof](#contents.xhtml#rsec4_2_1)\n\nPRG is a function, *G*, which\
    \ takes *n*\\-bit input and produces *n*′\\-bit output. It is a deterministic\
    \ algorithm which produces something that looks random, but itself is not a randomized\
    \ algorithm. A PRG is said to be secure if the attacker/distinguisher, *D*, cannot\
    \ distinguish whether the output is pure random (R) or pseudorandom (PR). PRG\
    \ is assumed to be secure as long as the seed, *s*, it initially takes is purely\
    \ random. Formally, PRG security is defined in terms of the distinguishing probability.\n\
