    ![Figure 2.2 Diffie–Hellman key-exchange algorithm.](images/fig2_2.jpg)


    *Figure 2.2* Diffie–Hellman key-exchange algorithm.


    The public parameters which Alice and Bob decided are the order, `p`, of the cyclic
