    # Chapter 4: Introduction to provable security and its application in searchable
    encryption


    **Provable security**, as the name suggests, is a type of security that can be
    proved. Generally, it employs mathematical proofs, and most of the security proofs
    are done using a reduction approach. The reduction approach used in encryption
    schemes is very similar to NP-completeness reductions, but more complicated. We
    will explain the reduction approach in a comprehensive manner and then present
    an example where we prove the security of an encryption scheme against a straightforward
    eavesdropper attack. With the help of examples and insights about the reductionist
    approach and how we can reason the security of a scheme, we can easily apply the
    explained approach to any system, including searchable encryption; after all,
    a searchable encryption scheme is also a type of encryption.


    ## 4.1 Security Definition


    An encryption scheme is said to be complete or fully defined when, in addition
    to the algorithms like key generation (`Gen`), encryption (`Enc`) and decryption
    (`Dec`), we define all the spaces like the keyword space, message space and ciphertext
    space that will be implicitly used in these algorithms. Let the following represent
    a symmetric encryption scheme, for which we will define correctness and security
    definitions:


    ```

    k ← Gen(1^n); c ← Enc(k, m); m'' ← Dec(k, c)

    ```


    The key generation algorithm takes security parameter in unary format because
    we want to run this algorithm in polynomial time with respect to `n`. The key
    generation algorithm implicitly uses the key space, which is a set of all the
    keys that can be generated by this algorithm. Similarly, the encryption and the
    decryption algorithms also use the ciphertext space and message space implicitly.


    The correctness of an encryption scheme is defined in terms of the following probability:


    ```

    Pr[k ← Gen(1^n); c ← Enc(k, m); m'' ← Dec(k, c): m = m''] = 1

    ```


    (4.1)

