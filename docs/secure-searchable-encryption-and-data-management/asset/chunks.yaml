  fmt: '

    It states that we conduct an experiment where we have generated a secret key and,
    using this secret key, we have properly encrypted a message to get its ciphertext,
    and then this ciphertext is given to the decryption algorithm which also takes
    the same key. If the probability of getting `m = m''` is 1, then we say our scheme
    is always correct. Now, we know where key and ciphertext came from, but we have
    not said anything about the message, where does this `m` came from? This `m` is
    chosen from the message space and the above defined probability must hold for
    all messages in the message space. Hence, we say `∀ m ∈ M`, if `Pr[k ← Gen[1^(n)];
    c ← Enc[k, m]; m'' ← Dec[k, c]: m = m''] = 1`, then our scheme is always correct.
    Now we will define what it means for an encryption scheme to be secure.


    ### 4.1.1 Probabilistic and game-based security definition


    There are many flavors of security with respect to the encryption schemes based
    upon the type of facilitation we have given to the adversary [[1]](#04chap_04.xhtml#ref4_1)-[[3]](#04chap_04.xhtml#ref4_3).
    We define the security of the schemes against various attacks like the ciphertext-only
    attack, known plaintext attack (KPA), chosen plaintext attack (CPA), chosen ciphertext
    attack (CCA1) and adaptive chosen ciphertext attack (CCA2). In the security against
    ciphertext-only attack, the adversary just possesses a string of ciphertexts and
    tries to break the scheme using this information. In KPA, the adversary has a
    string of plaintext and their corresponding ciphertext. In CPA, the adversary
    is provided with access to the encryption oracle, and she can convert any plaintext
    of her choice to the ciphertext. In CCA1, in addition to the encryption oracle,
    the adversary has access to the decryption oracle, through which she can get the
    plaintext of any chosen ciphertext. In CCA2, the adversary has all the facilities
    that are provided to it in CCA1, but here the adversary can modify her choice
    based on the results of previous encryption.


    To clearly understand the entire security mechanism, we will start by the security
    ciphertext-only attack which is also called the security against potential eavesdroppers.
    All further discussion in this chapter will consider the eavesdropper security.


    First of all, we will define the probabilistic security definition and then convert
    it into the game-based definition.


    Consider an experiment where we generate a secret key, `k`, using the `Gen` algorithm
    which takes security parameter, `1^(n)`. Now, we will pass on the security parameter
    to the adversary and keep the key to ourselves as it is a secret. The adversary
    now outputs two messages, `m[0], m[1]` and we will allow the adversary to keep
    a state, which she needs later. Given these messages, we will pick a random bit,
    `b ← {0,1}`, and encrypt one of the messages, `m[b]`, to generate ciphertext,
    `c`, and give it back to the adversary. The adversary can now continue from the
    state she left and she now knows the ciphertext which we have given her. Using
    this information, the adversary outputs her guess, `b''`, and wins if `b'' = b`.
    Since `b` is just a single bit which can always be guessed correctly with probability
    1/2, the adversary must do more than just 1/2, if she actually wants to break
    the scheme. But we do not want her to do much more than a `neg(n)` (negligible
    in security parameter `n`) because we want our scheme to be secure. Formally,
    this entire experiment can be stated mathematically by the following equation,
    given `∀ PPT` (probabilistic-polynomial time) adversaries, `A`, `∃` a negligible
    function in `n`, `neg(n)`, such that:


    ```

    Pr[Gen[1^n] → k; A[1^n] → [m_0, m_1, state]; b ← {0,1}; Enc[k, m_b] → c; A[state,
    c] → b'': b'' = b] = 1/2 + neg(n)

    ```


    (4.2)


    In most encryption schemes today the length of the message is not hidden in the
    ciphertext, therefore, the chosen message `m[0], m[1]` by the adversary must have
    equal length. Otherwise, they can be easily distinguishable.


    This probabilistic security definition can also be described as a game between
    the challenger and the adversary as shown in Figure 4.1.


    ![Figure 4.1 Game-based security definition.](images/fig4_1.jpg)


    *Figure 4.1* Game-based security definition.


    In this game between the challenger and the adversary, we say that adversary wins
    if `b'' = b` and we say that our scheme is secure if `∀ PPT A, ∃ neg(n): Pr[A
    wins the game] = 1/2 + neg(n)`. From this probability, if we subtract the trivial
    component, i.e. 1/2, then what we get is technically called the advantage of adversary
    in winning the game, and for a scheme to be secure this advantage should be negligible.


    ## 4.2 REDUCTION PROOFS


    In reduction proofs we say that a scheme X is secure as long as the assumption
    Y holds, where Y is a known hard assumption for which there exists no polynomial
    time algorithm that can break Y. We state this definition as a theorem and will
    provide the proof of this theorem as follows:


    **Theorem**: If Y hold ⇒ X is secure.


    **Proof**: The proof methodology employed here is just like the ordinary reduction
    proofs, we will prove it using the contrapositive statement, which state that,
    if X is not secure then this should imply assumption Y should not hold.


    ```

    Original: Y hold ⇒ X secure,

    Contrapositive: X is not secure ⇒ Y does not hold

    ```


    These two statements are equivalent. If we are able to prove the contrapositive,
    then original is automatically proved, and hence we have proved the theorem.


    *Potential reasoning statements:* We will start the proof by assuming that if
    there exists a probabilistic-polynomial time (PPT) adversary, `A`, who can break
    X, then we can construct another probabilistic-polynomial time adversary, `B`,
    who can break Y. Now, here breaking entirely depends upon the security definition
    we have used for scheme X. For example: if eavesdropper security definition is
    considered, then breaking there means the adversary can distinguish between the
    two messages with non-negligible advantage.


    An alternative way of thinking about it is, since there is no known PPT algorithm,
    `B`, that can break Y, this implies there can be no PPT algorithm, `A`, that can
    break X. If there exists some algorithm `A` that breaks X, then through this proof,
    or more appropriately reduction, we can immediately have an algorithm that breaks
    Y; however, if Y is a known hard assumption and no algorithm exists which can
    break it, then it is impossible that there can be an algorithm that can break
    X and thus we can claim scheme X is secure.


    Since we are constructing another adversary, `B`, we will define its interactions
    and pseudocode; therefore, such a proof is also called constructive proof. All
    the reduction proofs work in almost the same manner, we will construct `B` by
    writing its pseudocode. `B` can use `A` as a sub-routine and the interaction of
    `B` with `A` is defined exactly as per the scheme X. A box diagram shown in Figure
    4.2 may be useful to show the interactions clearly.


    ![Figure 4.2 Box representation of interaction among different adversaries and
    the challenger in the security proof.](images/fig4_2.jpg)


    *Figure 4.2* Box representation of interaction among different adversaries and
    the challenger in the security proof.

    '
  trans: '

    文中指出，我们进行了一个实验：生成了一个密钥，利用该密钥正确加密了一条消息以获得其密文，随后将该密文连同同一密钥一同提供给解密算法。如果得到 `m = m''`
    的概率为 1，则称我们的方案始终是正确的。现在，我们知道密钥和密文的来源，但尚未提及消息，这个 `m` 究竟来自何处？该 `m` 选自消息空间，且上述定义的概率必须对消息空间中的所有消息均成立。因此，我们称：`∀
    m ∈ M`，若 `Pr[k ← Gen[1^(n)]; c ← Enc[k, m]; m'' ← Dec[k, c]: m = m''] = 1`，则我们的方案始终是正确的。接下来，我们将定义加密方案安全的含义。


    ### 4.1.1 概率性与基于博弈的安全定义


    根据赋予对手的能力类型不同，针对加密方案的安全性有多种风味 [[1]](#04chap_04.xhtml#ref4_1)-[[3]](#04chap_04.xhtml#ref4_3)。我们定义了方案针对各类攻击的安全性，如仅密文攻击、已知明文攻击
    (KPA)、选择明文攻击 (CPA)、选择密文攻击 (CCA1) 和自适应选择密文攻击 (CCA2)。在仅密文攻击安全性中，对手仅持有一串密文，并试图利用该信息破解方案。在
    KPA 中，对手拥有一串明文及其对应的密文。在 CPA 中，对手获得加密预言机的访问权，可将其选择的任意明文转换为密文。在 CCA1 中，除加密预言机外，对手还拥有解密预言机的访问权，可通过它获取任意选定密文的明文。在
    CCA2 中，对手拥有 CCA1 中提供的所有设施，但此处对手可根据先前加密的结果修改其选择。


    为清晰理解整个安全机制，我们将从仅密文攻击的安全性（也称潜在窃听者安全性）入手。本章后续所有讨论均将考虑窃听者安全性。


    首先，我们将定义概率性安全定义，再将其转化为基于博弈的定义。


    考虑一个实验：我们使用 `Gen` 算法（接收安全参数 `1^(n)`）生成一个密钥 `k`。接着，我们将安全参数传递给对手，而将密钥自行保管（因其为机密）。对手随后输出两条消息
    `m[0], m[1]`，我们允许对手保留一个状态，以备后用。给定这些消息，我们随机选取一比特 `b ← {0,1}`，加密其中一条消息 `m[b]` 生成密文
    `c`，并将其返回给对手。对手可从其离开的状态继续，现已知我们给予的密文。利用该信息，对手输出其猜测 `b''`，若 `b'' = b` 则获胜。由于 `b`
    仅为单比特，随机猜测正确的概率恒为 1/2，若对手真想破解方案，其表现必须优于 1/2。但我们不希望其优势超过 `neg(n)`（在安全参数 `n` 下可忽略不计），因为我们要方案安全。形式上，给定
    `∀ PPT`（概率多项式时间）对手 `A`，`∃` 一个关于 `n` 的可忽略函数 `neg(n)`，使得整个实验可用以下数学等式表述：


    ```

    Pr[Gen[1^n] → k; A[1^n] → [m_0, m_1, state]; b ← {0,1}; Enc[k, m_b] → c; A[state,
    c] → b'': b'' = b] = 1/2 + neg(n)

    ```


    (4.2)


    当今大多数加密方案的密文中未隐藏消息长度，因此对手选择的消息 `m[0], m[1]` 必须等长。否则，它们极易被区分。


    此概率性安全定义亦可描述为挑战者与对手之间的博弈，如图 4.1 所示。


    ![Figure 4.1 Game-based security definition.](img/fig4_1.jpg)


    *图 4.1* 基于博弈的安全定义。


    在此博弈中，若 `b'' = b` 则称对手获胜；若 `∀ PPT A, ∃ neg(n): Pr[A wins the game] = 1/2 + neg(n)`，则称我们的方案安全。由此概率减去平凡分量（即
    1/2），所得即为对手获胜的优势（advantage），方案安全要求该优势可忽略不计。


    ## 4.2 归约证明


    在归约证明中，我们称：只要假设 Y 成立，方案 X 即安全，其中 Y 为已知的困难假设，不存在能在多项式时间内破解 Y 的算法。我们将此定义表述为定理，并按如下方式给出证明：


    **定理**：若 Y 成立 ⇒ X 安全。


    **证明**：此处采用的证明方法即普通归约证明，我们将利用逆否命题进行证明，即：若 X 不安全，则意味着假设 Y 不成立。


    ```

    原命题：Y 成立 ⇒ X 安全，

    逆否命题：X 不安全 ⇒ Y 不成立

    ```


    这两命题等价。若能证明逆否命题，则原命题自动得证，从而完成定理证明。


    *潜在推理陈述*：我们假设存在一个概率多项式时间 (PPT) 对手 `A` 能破解 X，由此可构造另一个 PPT 对手 `B` 能破解 Y。此处“破解”完全取决于方案
    X 所采用的安全定义。例如：若考虑窃听者安全定义，则破解意味着对手能以非可忽略优势区分两条消息。


    另一种思路是：因不存在已知的 PPT 算法 `B` 能破解 Y，这意味着不存在能破解 X 的 PPT 算法 `A`。若存在某算法 `A` 破解 X，则通过此证明（更准确说是归约），我们立即得到一个能破解
    Y 的算法；然而 Y 是已知困难假设，无算法能破解它，故不可能存在能破解 X 的算法，从而可宣称方案 X 安全。


    因我们在构造另一对手 `B`，将定义其交互与伪代码；故此类证明亦称构造性证明。几乎所有归约证明均按相似方式进行：我们通过编写伪代码来构造 `B`。`B` 可将
    `A` 作为子程序使用，`B` 与 `A` 的交互严格按方案 X 定义。图 4.2 所示的框图有助于清晰展示交互关系。


    ![Figure 4.2 Box representation of interaction among different adversaries and
    the challenger in the security proof.](img/fig4_2.jpg)


    *图 4.2* 安全性证明中不同对手与挑战者间交互的框图表示。

    '
