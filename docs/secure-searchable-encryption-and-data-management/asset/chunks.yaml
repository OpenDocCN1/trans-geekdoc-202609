    *云服务器：* 云服务器（`CU`）由第三方拥有，用于提供存储等服务。它存储加密数据，并使用 `DU` 提供的搜索陷门对这些数据执行搜索。如果使用标准 `SE`，则搜索算法仅接受密文和关键字的陷门；否则，如果使用
    `ABE` 方案，可能还需要 `PP`，或者如果使用某种转换方法，则需要 `PK[SE]`。`PK[SE]` 表示转换后的可搜索加密方案的公钥。


    ### 5.1.3 SE 系统中各参与方之间的信息流


    `IBE` 型 `SE` 系统中各参与方之间的信息流通过以下步骤进行解释，如 图 5.2 所示。


    *   **i)** `DO` 使用 `GenIndex(K[pub], w[i])` 算法，在接收者的公钥 `K[pub]` 下，发送数据及其关联的关键词的加密形式。生成的加密数据及其索引存储在远程服务器上，以便与其他用户共享。

    *   **ii)** `DU` 使用 `GenTrap(K[pri], w[i])` 算法生成与该特定文件关联的关键词的陷门。生成的陷门将使云服务器能够执行搜索，前提是它是由数据预期的用户生成的，即陷门是使用生成索引时所用公钥对应的同一用户的私钥生成的。

    *   **iii)** `CS` 使用 `DU` 发送的搜索陷门 `T[j]`，通过 `Search(C[i], T[j])` 算法对加密数据 `C[i]`
    执行搜索操作。云服务器代表 `DU` 执行搜索操作。如果找到与搜索陷门对应的关键词，则云服务器返回二进制输出 1；否则输出 0。


    ![Figure 5.2 Flow of information in an IBE-based SE system.](img/fig5_2.jpg)


    *图 5.2* 基于 IBE 的 SE 系统中的信息流。


    `ABE` 型 `SE` 系统中各参与方之间的信息流通过以下步骤进行解释，如 图 5.3 所示。


    *   **i)** `TA` 使用 `Setup(λ)` 算法初始化系统，该算法以安全参数 `λ` 作为输入。此外，它使用 `KeyGen(MSK)` 算法向云用户颁发必要的凭证，该算法以主密钥作为输入。

    *   **ii)** 数据所有者是指希望将其数据集合连同一些关键词外包给云服务器以实现共享的一方。考虑到数据的机密性，数据以加密形式存储。为了将数据上传到云服务器，数据所有者使用
    `GenIndex(PP, w[i])`，该算法以公共参数 `PP` 和与数据文件关联的元数据项 `w[i]` 作为输入，生成 `w[i]` 的密文 `C[i]`。一旦数据上传到云服务器，授权用户即可对其进行搜索。

    *   **iii)** `DU` 是指想要检索数据所有者存储在云服务器上的数据的一方。如果用户已获授权，则他/她可以生成与数据文件关联的关键词的陷门，并将其交给云服务器执行搜索。假设
    `DU` 想要检索包含特定关键词 `w[j]` 的数据文件。`DU` 将首先使用其秘密凭证运行 `GenTrap(SK[u], w[j])` 生成搜索陷门/令牌，然后将陷门
    `T[j]` 发送给云服务器。

    *   **iv)** 云服务器存储加密数据，并代表 `DU` 执行搜索操作。假设云服务器是诚实的，即它正确执行搜索算法。收到搜索陷门/令牌后，云服务器将使用
    `Search(C[i], T[j])` 对其存储的加密数据执行搜索。如果搜索陷门/令牌是由拥有有效秘密凭证的授权用户生成的，则密文中的公共组件和搜索陷门/令牌中的相应秘密组件将根据加密系统的规则相互抵消。因此，如果密文中的关键词与搜索陷门/令牌中的关键词匹配，则等式条件成立。在这种情况下，称找到被搜索的关键词，因此返回二进制值
    1 作为输出。否则，返回 0，表示未找到该关键词。在另一种情况下，如果搜索陷门/令牌不是由授权用户生成的，则搜索过程将终止，并向用户返回 `⊥`（空值）。这表明该用户无权在远程云服务器管理的公共存储上搜索数据所有者共享的加密数据。


    ![Figure 5.3 Flow of information in ABE-based SE system.](img/fig5_3.jpg)


    *图 5.3* 基于 ABE 的 SE 系统中的信息流。


    在两种模型的整个过程中，假设云服务器是诚实的，并将正确执行所有算法，但它可能会出于好奇试图寻找一些相关信息。因此，在开发可搜索加密方案时，我们必须确保云服务器无法获得关于被搜索关键词明文的任何信息。该模型称为抗选择关键词攻击安全性（`CKA`），将在下一节正式介绍。


    ## 5.2 公钥设置下可搜索加密的主要类别


    在本节中，我们将根据构建可搜索加密方案所用底层加密方案的类型，讨论 `SE` 方案的不同类别 [[1]](#05chap_05.xhtml#ref5_1)。在公钥设置中，有一些主要技术，如
    `IBE` [2, 3][4]、`ABE` [57]、隐藏向量加密（`HVE`）等，常用于构建可搜索加密方案。其中，我们将讨论使用前两种原语（即 `IBE`
    和 `ABE`）的可搜索加密方案。


    ### 5.2.1 基于 IBE 的 SE 方案


    第一个基于 `IBE` 的可搜索加密方案由 Boneh 等人 [8] 提出；该方案及其部分变体的详细描述已在 第 3 章 中给出。在本节中，我们将讨论使用从
    `IBE` 方案转换而开发的可搜索加密方案。从 `IBE` 到可搜索加密的通用转换机制如下所示，见 图 5.4。


    ![Figure 5.4 Transformation mechanism from IBE to searchable encryption.](img/fig5_4.jpg)


    *图 5.4* 从 IBE 到可搜索加密的转换机制。


    使用转换方法的第一个可搜索加密由 Khader [9] 提出。将一种转换方法应用于 k-韧性 `IBE` [2] 方案以构建 `PEKS` 方案。他们对转换机制指出了一些事实，例如：我们计划转换为
    `PEKS` 的 `IBE` 方案必须是匿名的，否则会泄露关键词。另一个事实涉及生成的 `SE` 方案的一致性；他们指出，底层方案必须在适当的安全模型下是安全的，因为只有这样生成的方案才会是一致且安全的。所提方案是一致的，因为底层
    `IBE` 方案能抵抗选择密文攻击。此外，他们还执行了多关键词搜索，并消除了对安全信道的需求。


