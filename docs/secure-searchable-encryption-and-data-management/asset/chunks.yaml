- raw: "Boneh et al. \\[[24](#03chap_03.xhtml#ref3_24)\\] developed the first searchable\
    \ encryption in a public-key setting called public-key encryption with keyword\
    \ search and is famous by name, PEKS. Among the available public-key cryptographic\
    \ primitives, they used identity-based encryption (IBE) as an underlying scheme.\
    \ They used the public key corresponding to the user's identity to encrypt the\
    \ data file and the keywords contained in the data file. The scheme was developed\
    \ for the efficient retrieval of encrypted emails from the email server. The data\
    \ owner or more appropriately the sender wants to send an email encrypted under\
    \ the public key of the recipient along with the keywords encrypted under the\
    \ same key. The sent email gets stored at the email server of the recipient and\
    \ the recipient needs a mechanism to efficiently retrieve only the desired emails\
    \ among them. This efficient mechanism is the technique of searchable encryption,\
    \ without which the recipient first needs to download all the emails and then\
    \ decrypt them locally using his/her private key. But with the searchable encryption\
    \ technique, the recipient can extract the emails according to his current requirement\
    \ and needs to decrypt only those selected emails. This whole mechanism is suitable\
    \ in those scenarios where we have a single intended recipient; however, there\
    \ is no restriction upon the number of senders. Now, if we want to send the same\
