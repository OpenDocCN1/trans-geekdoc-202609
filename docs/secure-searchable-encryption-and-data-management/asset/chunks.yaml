    # 第 6 章：设计与开发工具及跨域应用


    可搜索加密方案的**设计与开发**本质上需要数学知识，但一旦开发完成并证明安全，我们就需要实现它以检验其实用性。在本章中，我们将讨论实现这些方案的语言选择、可用的库，以及可用于测试的不同数据集。此外，我们还将讨论可搜索加密在密码学以外的其他几个领域的应用。


    ## 6.1 语言与库选项


    可搜索加密方案是一组协同工作以实现搜索加密数据这一共同目标的不同算法的集合。因此，用户熟悉的任何语言都可用于实现。在公钥设置中，需要执行配对运算，因此必须使用配对库。因此，建议使用与配对库相同的语言以获得更好的兼容性。


    ### 6.1.1 对称可搜索加密方案的工具包


    对于对称密钥设置下的可搜索加密方案，有以下工具包可用于评估可搜索加密。


    **OpenSSE 密码学工具包：** 该工具包拥有一个密码学层，提供伪随机函数、哈希函数和加密方案等特性的接口与实现，典型的可搜索加密方案依赖于这些特性。该工具包包含用
    C 和 C++ 实现的单关键词搜索方案。它提供了所需的抽象层级，可轻松实现可搜索加密方案。著名的密码学库（如 `OpenSSL`）不提供可搜索加密方案构建模块的接口。然而，它仍是一个研究项目，建议**不要**用于敏感信息。


    **Clusion 库：** 如果我们谈论对称可搜索加密（SSE），`Clusion` 是另一个值得一提的软件库。它不仅提供了近期 SSE 方案的模块化实现，而且在考虑最坏情况下，所有实现均具有亚线性渐近搜索复杂度。此外，它还提供支持多关键词搜索中析取、合取运算的构造，同时也支持简单的单关键词搜索。


    ### 6.1.2 公钥设置下可搜索加密的配对库


    公钥设置下的可搜索加密方案主要利用基于身份的加密、基于属性的加密和谓词加密等进行开发，这些高级加密方案通常在其构造中使用配对概念。有多种配对库可用，其中一些流行的库描述如下：


    **PBC（基于配对的密码学）库：** 这是一个用于执行配对运算的免费 C 库。它基于 `GMP` 库开发，后者执行数学运算。`PBC` 库是基于配对的密码系统的组成部分
    [[1]](#06chap_06.xhtml#ref6_1)。因为它在底层使用 `GMP` 库，尽管是用 C 编写的，但配对时间非常短。因此，速度和可移植性是其主要特性。此外，椭圆曲线算术和配对计算等基本功能可轻松执行。Boneh-Lynn-Shacham
    短签名 [[2]](#06chap_06.xhtml#ref6_2)、Hess 基于身份的签名 [[3]](#06chap_06.xhtml#ref6_3)
    和 Paterson 基于身份的签名 [[4]](#06chap_06.xhtml#ref6_4) 是一些使用该库测试的密码系统示例。


    **JPBC（Java 基于配对的密码学）库：** 顾名思义，Java 基于配对的密码学库基于 Java 语言 [[5]](#06chap_06.xhtml#ref6_5)。它是
    Lynn 提供的 `PBC` 库的扩展 [[1]](#06chap_06.xhtml#ref6_1)。基于 `JPBC` 的实现支持多线程，并采用内存映射文件来优化主内存使用。`JPBC`
    使用包装器将配对计算委托给 `PBC` 库。除了双线性映射，`JPBC` 还提供对多重线性映射的支持。多个函数加密方案和签名方案已成功使用 `JPBC` 库进行测试。


    **Charm：** `Charm` 是一个基于 Python 的库。利用 `Charm` 框架 [[6]](#06chap_06.xhtml#ref6_6)，高级密码系统的原型可快速且无缝地创建。代码复用、可读性和简洁性是
    `Charm` 的显著特点。它为各种数学设置提供支持，包括整数环/域、双线性和非双线性椭圆曲线群。它拥有一个基础加密库，包含对称加密方案、哈希函数和伪随机数生成器。


    此外，`Charm` 提供标准应用程序编程接口以构建数字签名和加密方案。而且，它提供了一个“协议引擎”以简化多方协议的实现过程。`Charm` 框架还提供了一个用于交互式和非交互式零知识证明的集成编译器。因此，就其提供的功能而言，它是最全面的框架。

    '
