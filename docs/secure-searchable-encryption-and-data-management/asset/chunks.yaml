    ABE 方案面临共谋攻击的安全威胁。例如：一份招聘启事已根据某策略加密，只有同时拥有硕士学位**且**至少两年工作经验的用户才能解密。可能存在两个用户，他们各自仅拥有其中一个属性。因此，拥有硕士学位但无经验的用户不应能解密。同理，有经验但无学位的用户也不应能解密。我们要防止这两个用户以某种方式结合他们的密钥，并试图冒充一个拥有所有必需属性的用户。因此，ABE
    方案的开发应防止用户结合他们的密钥并获知他们各自本不应获知的信息，否则 ABE 的初衷将落空。


    ## 2.5 章节小结


    在本章中，我们涵盖了从密码学原语的历史开端到当今使用的最新技术。我们描述了标准 PKE 技术是如何被推广和放宽以获得其他公钥密码技术的。我们主要讨论了与公钥密码学相关的方面，因为在后续章节中，我们的重点是基于公钥密码学原语构建可搜索加密方案。在
    PKE 技术中，详细讨论了基于身份的加密和基于属性的加密，因为它们在可搜索加密中有应用。


