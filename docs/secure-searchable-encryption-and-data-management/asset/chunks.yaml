    Ameri 等人 [[24]](#05chap_05.xhtml#ref5_24) 提出了一种临时关键词搜索方案，以防止信息从搜索陷门泄露。他们的方案基于底层
    ABE 方案的关键词策略设计框架。对于构造，他们使用了对称双线性映射，其中源群和目标群均为素数阶 `p`。该方案中使用的访问结构为树数据结构表示的一般类型，并采用自顶向下的方法获取秘密值的份额。他们的方案在修正的判定
    Diffie-Hellman 假设下，在选择性安全模型中对抗 CKA 是安全的。关于降低计算成本，他们使搜索算法中的配对运算次数与搜索陷门中指定的时间单元数量无关。


    ### 5.2.2.4 面向用户级撤销的基于属性的可搜索加密


    Mamta 和 Gupta [[25]](#05chap_05.xhtml#ref5_25) 提出了一种具有常数大小用户密钥和陷门的 ABSE 方案。此外，搜索算法中的配对运算次数也是常数。常数项是指这些参数与方案涉及的属性数量无关。因此，该方案降低了计算和存储成本，并提供了快速搜索能力。此外，他们的方案支持访问策略的频繁变更。此处的访问结构同样为一般类型，并由树数据结构表示，其中内部节点代表
    AND、OR 和阈值门，叶子节点代表属性。但与 [[24]](#05chap_05.xhtml#ref5_24) 不同，他们采用自底向上的方法获取秘密值的份额。他们的构造基于对称双线性映射，其中源群和目标群均为素数阶
    `p`。他们的方案还通过将计算密集型任务委托给云服务器，高效地处理用户撤销事件。他们在判定线性假设下，在选择性安全模型中证明了对抗 CKA 的安全性。


    ### 5.2.2.5 加密云数据上的多授权中心基于属性的关键词搜索


    Miao 等人 [[26]](#05chap_05.xhtml#ref5_26) 提出了一种多授权中心基于属性的关键词搜索方案，其中独立的属性授权中心可以非常高效地管理来自不同域的属性。他们利用
    ABE 的密文策略设计框架来构建关键词搜索方案。该构造基于对称双线性映射，其中源群和目标群均为素数阶 `p`，访问结构由单调布尔函数表示。他们使用线性秘密分享方案
    (LSSS) 来获取秘密值的份额。LSSS 由一个随机元素矩阵和一个映射函数组成，该函数将矩阵的每一行映射到一个属性。他们的方案支持属性更新，并提供对恶意属性授权中心的追踪。他们的方案在
    BDHE 和 DBDH 假设下是选择性安全的。


    ### 5.2.2.6 面向移动医疗网络的可搜索加密


    Mamta 和 Gupta [[27]](#05chap_05.xhtml#ref5_27) 为资源受限的移动医疗网络提出了一种基于 CP-ABE 的可搜索加密方案。他们使密文和用户密钥的大小均与方案涉及的属性数量无关。因此，他们的方案具有成本效益。此外，由于配对运算次数也与属性数量无关，他们的方案实现了快速搜索。他们的构造基于非对称双线性映射，其中源群和目标群均为素数阶
    `p`，访问结构由 AND 门表示。他们的方案在增强多指数序列判定 Diffie-Hellman (aMSE-DDH) 假设下是选择性安全的。


    ### 5.2.2.7 面向非单调访问结构的基于属性的可搜索加密


    在 ABSE 方案中，会对方案支持的访问结构类型做出一种假设。几乎所有的 ABSE 方案都假设单调访问结构。“设 `P` = {`P`[1], `P`[2],
    …, `P`[`n`]} 为一方或属性的集合。集合 `A` ⊆ 2^({`P`[1], `P`[2], …, `P`[`n`]}) ∖ `Φ`（`P` 的非空子集）是单调的，当且仅当对于任意两个一方或属性的集合，即
    `B` 和 `C`，满足以下条件：`C` ∈ `A` 当且仅当 `B` ∈ `A` 且 `B` ⊆ `C`”，即单调访问结构是 `P` 的所有非空子集的集合
    `A`，使得如果子集 `B` ∈ `A`，则其所有超集也应属于 `A` [[15]](#05chap_05.xhtml#ref5_15)。例如，设 `P`
    = {1,2,3}，则集合 `A` = {{1,2},{2,3},{1,2,3}} 是单调的，而集合 `A`′ = {{1,2},{2,3}} 是非单调的。


    为了更好地理解，让我们通过以下布尔公式的形式举一个例子：`A` ∨ (`B`∧`C`) 是单调访问结构，因为 {`A`,`B`} 及其超集 {`A`,`B`,`C`}
    满足给定公式。`A` ∨ (`B`∧`C`′) 是非单调访问结构，因为 {`A`,`B`} 满足它，但其超集 {`A`,`B`,`C`} 不满足给定公式。换句话说，我们可以说如果一个集合及其所有超集都满足给定的访问结构，则称为单调访问结构，否则称为非单调。从这个例子可以得出一个重要结论：访问结构中存在
    NOT 门会使其变为非单调。


    对于非单调访问结构，文献中已经开发了多种 ABE 方案，但尚未为 ABSE 方案开发，也没有在 KP 设计框架中开发。因此，存在一个机会为 ABSE 方案提供非单调访问结构的支持，以便包含可以真正由布尔公式表示的复杂访问结构，从而确定搜索能力。Mamta
    等人 [[28]](#05chap_05.xhtml#ref5_28) 引入了一种可以处理非单调访问结构的 CP-ABSE 方案。他们利用简化有序二元判定图来表示访问结构，并实现了非单调特性。


    用于比较分析的符号见 表 5.2。


    **表 5.2** 文献中类似基于 ABE 的可搜索加密方案分析所用符号的描述


    | 符号 | 描述 |

    | --- | --- |

    | `|G|`, `|G[T]|` | 对称双线性配对中源群 (`G`) 和目标群 (`G[T]`) 元素的长度 |

    | `|G[1]|`, `|G[2]|`, `|G[T]|` | 非对称双线性配对中源群 (`G[1]`,`G[2]`) 和目标群 (`G[T]`) 元素的长度
    |

    | `|Z[p]|` | 素数阶 `p` 的整数群中元素的长度 |

    | `P` | 双线性配对运算 |

    | `E`, `E[T]` | 源群和目标群中的指数运算 |

    | `H` | 抗碰撞单向哈希函数 |

    | `ξ` | 与用户关联的属性数量 |

    | `N` | 与访问策略关联的属性数量 |

    | `U` | 系统中授权用户的数量 |

    | `t` | 陷门有效的时间单元数量 |

    | `k` | 多关键词搜索方案中的关键词数量 |

    | `T` | 有效路径的数量 |


