    这里的原因是，如果 `r` 是伪随机生成的，那么我们提供给 A 的正是她所期望的——一条加密消息；此时我们称 A 以非微弱优势破解了 X。如果 `r` 确实是随机的，那么给定的加密方案就是一次性密码本（OTP），我们知道它是完全安全的。


    **可能的推理**：正如上述讨论所见，归约证明的第一和第二条规则显然成立。对于第三条规则，我们首先需要定义区分概率，为此必须考虑两种可能的情况：第一，B 在
    `r` 确实是随机的情况下输出随机（R），即 `Pr[B→R | r is R]`；第二，B 输出随机（R），但现在给定的是伪随机（PR），即 `Pr[B→R
    | r is PR]`。B 破解 G 意味着这两个概率之差是非微弱的。


    或者，我们可以这样思考：B 在何时输出 R？当 `b'' ≠ b` 时。因此，`Pr[B→R | r is R]` 等价于 `Pr[b''≠b | r is
    R]`。当 `r` 是 R 时，加密完全是一个 OTP。我们知道 $Pr[b'' \neq b] = Pr[b'' = b] = \frac{1}{2}$。此外，`Pr[B→PR
    | r is PR]` 等价于 `Pr[b''≠b | r is PR]`，而 `Pr[b''≠b | r is PR]` 是 A 在安全游戏 X 中失败的概率。我们知道
    A 的获胜概率是 $\frac{1}{2} + non-neg(n)$。因此，$Pr[b'' \neq b | r\ is\ PR] = \frac{1}{2}
    - non-neg(n)$。现在区分概率可以很容易地计算为 $\frac{1}{2} - (\frac{1}{2} - non-neg(n)) = non-neg(n)$。现在，我们将回溯；我们假设
    PRG 是安全的，所以这个区分概率必须是微弱的，记为 `ε(n)`。所以 A 在安全游戏 X 中获胜的概率是 $\frac{1}{2} + \varepsilon(n)$，其中
    `ε(n)` 是微弱的。这证明了如果 G 是一个安全的 PRG，那么 X 必定是安全的。


    在可搜索加密方案的情况下，证明方法将保持不变；变化的是安全定义和需求，我们将在下一节中说明。


    ## 4.3 可搜索加密中的常见安全定义


    可搜索加密方案的第一个正式安全定义由 Goh [[4]](#04chap_04.xhtml#ref4_4) 提出。他们在对称密钥设置中引入了安全定义，并将可搜索索引的安全性定义为针对自适应选择关键词攻击的关键词不可区分性（IND1-CKA）。该定义指出，只要数据文件长度相等，对手就无法通过查看其索引来获取关于数据文件的任何信息。这类似于我们在通用安全定义中看到的情况，即我们假设消息必须等长；否则，它们平凡地就变得可区分了。此外，他们规定
    IND1-CKA 不要求陷门是安全的，因为他们开发该方案是为了将其用作一种安全数据结构，这种结构除 SSE 之外还有许多其他应用，而大多数应用并不要求陷门安全。Chang
    和 Mitzenmacher [[5]](#04chap_04.xhtml#ref4_5) 引入了一种比 IND1-CKA 更强的安全概念，体现在不再需要文档大小相等的限制，并且他们在定义中也加入了陷门安全的概念。他们假设文档大小可能不相等；然而，它们似乎包含相同数量的关键词。确实，[[5]](#04chap_04.xhtml#ref4_5)
    的定义中考虑了更多因素，但他们的安全定义存在缺陷，这被 Curtmola 等人 [[6]](#04chap_04.xhtml#ref4_6) 指出：他们提到的
    SSE 安全条件甚至能被一个不安全的 SSE 满足。后来 Goh 重新审视了他们的安全定义，像 [[5]](#04chap_04.xhtml#ref4_5)
    一样放宽了文档等长限制，增强了 IND1-CKA，并正式称为 IND2-CKA。IND2-CKA 确实保护了文档大小，但不考虑陷门的安全性。在回顾了所有现有的安全定义后，Curtmola
    等人 [[6]](#04chap_04.xhtml#ref4_6) 指出，由于陷门与索引安全性的内在关联，考虑陷门的安全性至关重要。他们为可搜索加密方案引入了两个安全定义，这成为了标准定义且沿用至今。正式地，他们称之为
    IND-CKA1（针对非自适应选择关键词攻击的不可区分性）和 IND-CKA2（针对自适应选择关键词攻击的不可区分性）。这两个定义都确保了索引以及搜索陷门不泄露关于数据文件及其相关关键词的任何信息。IND-CKA1
    和 IND-CKA2 的区别在于对手如何以及何时可以发起查询。IND-CKA1 确保如果所有查询都在挑战阶段之前一次性发起，则安全性成立；而 IND-CKA2
    允许对手根据之前的查询和搜索结果自适应地发起查询。因此，IND-CKA2 被认为比 IND-CKA1 更强。


    在公钥设置中，可搜索加密的第一个安全定理由 Boneh 等人 [[7]](#04chap_04.xhtml#ref4_7) 提出。它简称为 IND-CKA，其内容是：在对手拥有该关键词的陷门之前，无法获取关于关键词的任何信息。这个安全定义类似于窃听者安全；这里对手会选择两个她选定的关键词（`w[0]`，`w[1]`），由挑战者加密后返回给对手。通过查看关键词密文，除非对手拥有该关键词的陷门，否则无法判断它是关键词
    `w[0]` 还是 `w[1]` 的加密。另一个著名的公钥设置下可搜索加密安全定理由 Canetti 等人 [[8]](#04chap_04.xhtml#ref4_8)
    提出，称为针对 CKA 的选择性安全。它与 IND-CKA 相同，但这里对手必须在安全游戏开始时就承诺其打算攻击的关键词。这两个定义都被建模为挑战者和对手之间的安全游戏（基础内容见
    Section 4.1.1）。安全游戏包含以下阶段，如 Figure 4.5 所示：


    *   **Setup Phase（初始化阶段）**。挑战者运行 `Setup(1^n)` 算法。它输出主密钥 `MSK`，由挑战者保管，以及公共参数 `PP`，发送给对手。


    ![Figure 4.5 Game-based security definition for searchable encryption in public-key
    setting.](img/fig4_5.jpg)


    *Figure 4.5* 公钥设置下基于游戏的可搜索加密安全定义。


    *   **Phase 1（阶段 1）**。在该阶段，对手可以发起密钥生成和陷门查询。挑战者利用其持有的 `MSK` 运行密钥生成算法，生成秘密密钥 `SK`。给定一个关键词
    `w`，挑战者运行 `Trapdoor(SK, w)`，输出一个陷门 `T[w]`。然后挑战者将 `T[w]` 发送给对手。对手可以在该阶段发起多项式次查询。


    *   **Challenge Phase（挑战阶段）**。在这里，对手选择一对 `{w[0], w[1]}` 作为其希望受到挑战的目标，并将它们发送给挑战者。给定
    `{w[0], w[1]}`，挑战者选择一个二进制比特 `b←{0, 1}`，并使用生成索引算法输出 `C[β]`，将其发送给对手。


    *   **Phase 2（阶段 2）**。该阶段与 Phase 1 相同，条件是 `A` 不能针对挑战关键词 `{w[0], w[1]}` 查询陷门。


