    为了证明密码系统的安全性，我们需要一个形式化的安全模型，该模型必须明确对手/攻击者与该密码系统合法用户交互时所遵循的交互机制。此外，它还必须规定对手必须达成何种条件才能攻破该密码系统
    [[11]](#02chap_02.xhtml#ref2_11)。例如：在加密系统中，对手可能想要通过使用所谓的加密预言机来找到其所选消息的密文；这代表了对手与密码系统进行的交互。其次，为了攻破密码系统，对手必须正确识别出挑战密文（即对手此前从未查询过的密文）是对手先前所选明文消息的加密。


    ### 2.3.1.2 公钥密码系统的安全目标


    对于任何公钥加密方案，在设计密码系统时必须牢记以下安全目标：


    *   **加密/密文的不可区分性**：这也称为语义安全，它指出给定两条消息的加密或两个密文，对手不应能够区分它们。简单来说，给定一个挑战密文，对手不应能获得关于底层明文的任何信息。

    *   **非可延展性**：它要求给定挑战密文，对手不应能将其转换为另一个有效密文，使得这两个密文的明文以有意义的方式相关联。


    ### 2.3.1.3 公钥密码系统的安全攻击


    根据提供给对手的便利程度，针对公钥密码系统的攻击分为三大类：


    *   **选择明文攻击 (CPA)**：此处提供的便利是对手知道公钥。公钥可用于加密其选择的消息，密码学界称对手拥有访问加密预言机的权限。随后，对手选择两条自己挑选的消息（称为挑战消息），发送给挑战者。挑战者随即返回挑战密文给对手。现在，如果对手难以将挑战密文与其底层明文关联起来，则称该公钥密码系统在
    CPA 下是安全的。对手的限制是：她无法为自己选择的挑战消息生成密文（即无法访问加密预言机）。在这里，我们将对手的能力限制到了最大程度。但在实践中，对手可能拥有更大的权力，因此
    CPA 安全的方案在实际场景中可能不安全。

    *   **非自适应选择密文攻击 (CCA1)**：在此，通过在 CPA 安全提供的便利基础上额外赋予对手访问解密预言机的权限，增强了对手的能力。她可以利用它获取其选择的密文的解密结果。但是，对何时可以使用解密预言机施加了限制。在此，对手只能在挑战密文产生*之前*使用解密预言机。

    *   **自适应选择密文攻击 (CCA2)**：CCA1 安全的限制被完全放宽，现在对手甚至在获得挑战密文*之后*也可以访问解密预言机。但显而易见的限制依然存在：她不能针对挑战密文查询解密预言机。


    在 CCA2 下具有不可区分性的公钥加密方案被认为是最安全的。原因显而易见：因为在这里对手可以全权操作，却仍然无法区分挑战密文究竟是其生成的两条挑战消息中的哪一条的加密。


    从数学上讲，IND-CCA2（针对 CCA2 的不可区分性）的完整定义可以建模为挑战者 $\mathcal{C}$ 和对手 $\mathcal{A}$ 之间的一个游戏，如下所示：


    *   **Setup（初始化）**：$\mathcal{C}$ 运行 `KG(λ)→(pk, sk)`，保留 `sk` 并将 `pk` 给 $\mathcal{A}$。

    *   **Phase 1（阶段 1）**：$\mathcal{A}^{(D)}(pk, C)→m$ 并输出两条其选择的消息 `{m[0], m[1], state}`，但此前未曾针对它们查询解密预言机。$\mathcal{A}^{(D)}$
    表示对手对解密预言机的访问权限。

    *   **Challenge（挑战）**：$\mathcal{C}$ 选择 `{0,1}→b`，并运行加密算法以获得挑战密文，`E(pk, m[b])→C*`。

    *   **Phase 2（阶段 2）**：$\mathcal{A}^{(D)}(pk, C)→m$ 但 `C ≠ C*`。

    *   **Guess（猜测）**：$\mathcal{A}(C*, m[0], m[1], state)→b''$。


    若 $b'' = b$，即对手猜测正确，则对手赢得游戏。因为有两条消息，所以任何人随机猜测的概率为 $\frac{1}{2}$。因此，我们需要从正确猜测 $b$
    的总概率中减去这个概率，这被称为对手针对 IND-CCA2 的优势，记为 $Adv_{\mathcal{A}}^{IND-CCA2}$。


    $$

    Adv_{\mathcal{A}}^{IND-CCA2}(\lambda) = \left| Pr[b'' = b] - \frac{1}{2} \right|

    $$


    (2.1)


    如果对手赢得游戏的优势可以忽略不计，则称该密码系统能抵御 CCA2 攻击。


    ### 2.3.1.4 ElGamal 密码系统


    ElGamal 加密由 Taher ElGamal 于 1985 年发明 [[12]](#02chap_02.xhtml#ref2_12)，它与 Diffie-Hellman
    密钥交换算法非常相似，仅步骤顺序略有调整，如 [图 2.3](#02chap_02.xhtml#fig2_3) 所示。


    ![图 2.3 ElGamal 密码系统。](images/fig2_3.jpg)


    *图 2.3* ElGamal 密码系统。


    此处，密钥 `K[E]` 称为临时密钥，仅存在很短的时间，即当 Alice 想要发送新消息时，此时会选择不同的 `i` 值，从而产生不同的临时密钥。密钥 `K[M]`
    称为会话密钥，就像 DH 密钥交换算法中的密钥 `K[AB]` 一样。ElGamal 加密方案是一种概率加密方案，这与教科书式的 RSA 加密方案不同，这一特性源于每次调用加密算法时都选择一个随机的
    `i` 值，而在 RSA 中，相同消息的加密结果始终是固定的。


    **正确性证明**：Bob 计算，$Y \cdot K[M]^{-1} \mod p = X \cdot K[M] \cdot (K[E]^{(d)})^{-1}
    \mod p = X \cdot \beta^{(i)} \cdot (\alpha^{(i)})^{-d} \mod p = X \mod p$。


    我们将在 [第 4 章](#04chap_04.xhtml) 中详细介绍该方案的安全性分析，届时将深入讨论可证明安全性。


    ## 2.4 公钥密码学中的推广

