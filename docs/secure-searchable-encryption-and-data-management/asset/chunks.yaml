    \ of inverses.\n\n#### [1.2.3.1 Symmetric finite group](#contents.xhtml#rsec1_2_3_1)\n\
    \nThe symmetric finite group is defined over the finite set *n* ∈ ℕ = {1,2,3,4,……,*n*}\
    \ and is often represented as *S*[*n*]. For construction of symmetric groups,\
    \ we have to consider the set permutation of *n* elements and give each permutation\
    \ a name. These permutations will be the elements of group *S*[*n*] and then we\
    \ have to define the composition law. For example:\n\n*S*[1]\\= {*i*} Permutation\
    \ for *S*[1]:\n\n![](images/ufig1_1.jpg)\n\nComposition law for *S*[1]:\n\n![](images/ufig1_2.jpg)\n\
    \n*S*[2]\\= {*i*,*τ*} Permutations for *S*[2]:\n\n![](images/ufig1_3.jpg)\n\n\
    Composition law for *S*[2]:\n\n![](images/ufig1_4.jpg)\n\nThe order of *S*[*n*]\
    \ is the number of elements in *S*[*n*] and it is the number of permutations possible\
    \ with *n* elements which is *n*!. The symmetric groups from *S*[3] onwards are\
    \ not abelian.\n\n#### [1.2.3.2 Group isomorphism](#contents.xhtml#rsec1_2_3_2)\n\
    \nTo understand the concept of group isomorphism, consider the following two groups:\
    \ *G* : *S*[2]\\= {*i*,*τ*} *G*′= {+1,−1}\n\n∘ *i* *τ* ×  + 1  − 1  \n\n*i* *i* *τ*  + 1  + 1  − 1\
    \  \n\n*τ* *τ* *i*  − 1  − 1  + 1  \n\nThe composition table of *G* and *G*^′\
    \ look similar and by relabeling of symbols we can turn *G* into *G*^′, i.e. *i*→+1\
    \ and *τ*→−1. We have seen that *G* and *G*^′ have exact same algebraic structure,\
    \ we are only using different symbols. Isomorphism is a relabeling function (φ)\
    \ which preserves the group structure, φ: *G* →*G*^′ (bijective mapping – surjective\
    \ and injective). It is not necessary that groups having the same order are isomorphic.\
    \ Collecting all the groups that are isomorphic to one another together forms\
    \ the isomorphism class. If two groups share the same isomorphism class, this\
    \ means they are isomorphic to each other.\n\n*Example*: *G* = (ℝ,+), where ℝ\
    \ is the set of real numbers and *G* is an abelian group. Consider another group\
    \ *G*^′ = (ℝ^+,×), where ℝ^+ is the set of positive real numbers and *G*′ is also\
    \ an abelian group. Now, we need to define a bijective map, φ: *G*→*G*^′ from\
    \ *G* to *G*′ φ:*x*→*e*^(*x*),  ∀*x* ∈ *G* and *e*[*G*] is mapped to *e*[*G*^′] (0→1).\
    \ Hence *G* and *G*^′ are isomorphic (*G*≈*G*^′).\n\n#### [1.2.3.3 Subgroup](#contents.xhtml#rsec1_2_3_3)\n\
    \nThe subset *H* ⊂ *G* of a group *G* is called subgroup *H* ≺ *G* of *G* if it\
    \ is closed under composition. It is not necessary that all subsets of *G*  form\
    \ a group, so we have to cleverly choose the elements of *H*. The associativity\
    \ axiom is trivial to prove. The identity element must be included in *H* from\
    \ *G*. Each element in *H* should have its inverse ∀*h* ∈ *H*,  ∃*h*^( − 1) ∈ *H*,\
    \ such that   *h**h*^( − 1) = *e* = *h*^( − 1)*h*.\n\n*Example of subgroups*:\
    \ Trivial cases includes i) *G*\\= Entire group *G*, ii) *H* = {*e*}. Other than\
    \ trivial cases: (ℤ, +) is a known abelian group. Consider a set containing integer\
    \ multiples of *a*, *a*ℤ = {*a**z*| ∀*z* ∈ ℤ} = {0, *a*, −*a*, 2*a*, −2*a*, 3*a*, −3*a*,……}.\
    \ Clearly, *a*ℤ ≺ ℤ. If *a* = 0, *a*ℤ = {0}  and if *a* = 1, *a*ℤ = ℤ  represents\
    \ the trivial subgroups. If *a* = 2,  *a*ℤ = {0, 2, −2, 4, −4,……}; it represents\
    \ a proper subgroup which contains only even numbers. In fact, *a*ℤ are the only\
    \ possible subgroups of *G* = (ℤ, +).\n\n#### [1.2.3.4 Intersection of subgroups](#contents.xhtml#rsec1_2_3_4)\n\
    \nThe intersection of subgroups is also a subgroup, i.e. if *H*[1], *H*[2] ≼ *G*\
    \ then H[1] ∩  *H*[1]⋂*H*[2] ≼ *G*. The intersection of two subgroups is always\
    \ non-empty because it will contain at least one element, i.e. identity of group.\n\
    \n*Closure*: $\\\\forall g,\\\\overset{-}{g} \\\\in {~H}\\_{1}\\\\bigcap H\\_{2}$\
    \ ∩ H[2], we have to show: $g\\\\overset{-}{g} \\\\in {~H}\\_{1}$ and $g\\\\overset{-}{g}\
    \ \\\\in {~H}\\_{2}$. We know $g,\\\\overset{-}{g} \\\\in {~H}\\_{1}$, so their\
    \ composition $g\\\\overset{-}{g} \\\\in {~H}\\_{1}$. Similarly, $g\\\\overset{-}{g}\
    \ \\\\in {~H}\\_{2}$. Therefore, $g\\\\overset{-}{g} \\\\in {~H}\\_{1}\\\\bigcap\
    \ H\\_{2}$ ∩ H[2]. Associativity: Inherited. Identity: Trivial. Inverse: ∀*g* ∈  *H*[1]⋂*H*[2]\
    \ ∩ H[2], we need to show: *g*^( − 1) ∈  *H*[1]⋂*H*[2] ∩ H[2]. ∩ H[2] ∀*g*∈ *H*[1]⋂*H*[2]→*g*∈ *H*[1]\
    \ and *g* ∈  *H*[2].  *H*[1]  and  *H*[2]  are groups so  *g*^( − 1) ∈  *H*[1]\
    \ and *g*^( − 1) ∈  *H*[2].\n\n#### [1.2.3.5 Cyclic groups](#contents.xhtml#rsec1_2_3_5)\n\
    \nIf in a group there exists an element *x* ∈ *G* ( *x* is non-identity) called\
    \ the generator of the group then that group is known as a cyclic group. As the\
    \ name itself suggests, the generator element can generate all the elements of\
    \ the group, i.e.  < *x*\\>  = {*e*, *x*¹,*x*²,*x*³,……*x*^( − 1),*x*^( − 2),*x*^( − 3),……}.\
    \ The common examples of cyclic groups include, (ℕ,+) and (ℤ,+).\n\n### [1.2.4\
    \ Ring](#contents.xhtml#rsec1_2_4)\n\nSo far we have seen algebraic structures\
    \ with one binary operation. Ring is an algebraic structure (*A*, +, ⋅) with two\
    \ binary operations and satisfies the following conditions: i) (*A*, +) is an\
    \ abelian group, ii) (*A*, ⋅) is a semigroup and iii) the operation ⋅ is distributive\
    \ over the operation +. Example: (*Z*[*n*],⊕,⨀).\n\n*Division ring*: Every non-zero\
    \ element has a multiplicative inverse, i.e. if *a* ∈ *R* and *a* ≠ 0 then ∃*a*^( − 1) ∈ *R*: *a* ⋅ *a*^( − 1) = 1 = *a*^( − 1) ⋅ *a*.\n\
    \n*Integral domain*: A commutative ring that has no zero divisors, i.e. *a* ⋅ *b* = 0  ∀*a*, *b* ∈ *R*\
    \ iff *a* = 0 or *b* = 0.\n\n### [1.2.5 Field](#contents.xhtml#rsec1_2_5)\n\n\
    An algebraic structure (*A*, +, ⋅) with two binary operations is called a field\
    \ if the following conditions are satisfied: i) (*A*, +) is an abelian group,\
    \ ii) (*A*−{0},  ⋅)  is an abelian group and iii) the operation ⋅ is distributive\
    \ over the operation +. Example: (*R*,+,⋅), (*Z*[*p*],⊕,⨀).\n\n#### [1.2.5.1 Finite\
    \ fields](#contents.xhtml#rsec1_2_5_1)\n\nFinite fields are also known as Galois\
    \ fields and have great application in the cryptography domain like the groups.\
    \ Finite fields exist if the fields have *p*^(*m*) elements where *p* is prime\
    \ number and *m* is any positive integer, i.e. the order of the finite field is\
    \ either a prime or a power of prime. *G**F*(12) do not exist. There are two types\
    \ of finite fields depending upon the value of *m*: i) if *m* = 1, these are known\
    \ as the prime fields; ii) if *m* > 1, these are known as the extension fields.\n\
    \n#### [1.2.5.2 Prime fields and their arithmetic](#contents.xhtml#rsec1_2_5_2)\n\
    \nThe elements of a prime field *G**F*(*p* are integers {0,1,2,…,*p*−1}. For *a*, *b* ∈ *G**F*(*p*),\
    \ we can perform addition: (*a*+*b*)*m**o**d**p*; subtraction: (*a*−*b*)*m**o**d**p*;\
    \ multiplication: (*a**b*)*m**o**d**p*; division:  (*a**b*^( − 1))*m**o**d**p*\
    \ and inversion: *a* ∈ *G**F*(*p*)  then  *a**a*^( − 1) ≡ 1*m**o**d**p*. *a*^( − 1)\
    \ can be computed with the extended Euclidean algorithm.\n\n#### [1.2.5.3 Extension\
    \ fields and their arithmetic](#contents.xhtml#rsec1_2_5_3)\n\nIn cryptography\
    \ we are mainly interested in extension fields where *p* = 2. The elements of\
    \ *G**F*(2^(*m*)) are polynomials *A*\\[*X*\\] of the following type:\n\n*a*[*m* − 1]*x*^(*m* − 1) + *a*[*m* − 2]*x*^(*m* − 2) + … + *a*[1]*x* + *a*[0]\
    \  \n\n(1.12)\n\nwhere *a*[*i*] ∈ *G**F*(2) (In general: *a*[*i*] ∈ *G**F*(*p*) = {0,1,2,……,*p*−1}).\n\
    \nFor example: *G**F*(8) = *G**F*(2³). *A*\\[*X*\\] = *a*[2]*x*² + *a*[1]*x* + *a*[0],\
    \ where *a*[*i*] ∈ *G**F*(2). This polynomial is considered as a vector (*a*[2], *a*[1],*a*[0])\
    \ with possible combinations from 000 to 111.\n\n*G**F*(2³) = {0, 1, *x*, *x*+1, *x*², *x*²+1, *x*²+*x*, *x*²+*x*+1 }\
    \  \n\n(1.13)\n\nLet *A*\\[*X*\\], *B*\\[*X*\\] ∈ *G**F*(2^(*m*)). The addition\
    \ and subtraction operation is performed as follows:\n\n$$C\\\\left\\\\lbrack\
    \ X \\\\right\\\\rbrack = A\\\\left\\\\lbrack X \\\\right\\\\rbrack + B\\\\left\\\
    \\lbrack X \\\\right\\\\rbrack = {\\\\sum\\\\limits\\_{i = 0}^{m - 1}{c\\_{i}x^{i}}},\\\
    \\ where~c\\_{i} = \\\\left( a\\_{i} + b\\_{i} \\\\right)mod2$$  \n\n(1.14)"
