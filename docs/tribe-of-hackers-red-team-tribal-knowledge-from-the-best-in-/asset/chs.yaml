  \ 应用程序。\n\n为了拥有红队技能来付清账单。\n\n\n\n\n\n# 红队成员如何协作完成任务？\n\n如果你正在与团队一起工作，沟通是最重要的元素。拆分工作，并确保你对执行任务期间做的每件事都进行记录。信任也同样重要，因为我曾见过团队成员对队友失去信任的情况。\n\
  \n我建议使用协作工具，让每个人都能看到同事在做什么。透明度总是能胜出的。还有一点，不要害怕寻求帮助；这正是队友的意义所在。如果你的同事是某个领域的专家，直接向他们寻求帮助即可。\n\
  \n## 在行动完成后，你对蓝队进行复盘（debriefing）和提供支持的方法是什么？\n\n`专业性`是关键。由于我们都是人类，在对内部和外部蓝队进行复盘时，情感会产生影响。始终让他们知道，在宏观任务上你们是站在同一个团队的。如果你方法得当，他们将拥有一份详细计划来修复你发现的任何问题。\n\
  \n困难的部分在于，当你帮助了某人，将来回来发现相同的问题仍然存在。不要生气，尽量避免精疲力竭。保持专业并尝试提供帮助。你可以把马引到水边，但无法强迫它喝水。\n\
  \n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\n我这生都是蓝队人，但偶尔也会做红队。能够防御攻击的第一步是建立策略并执行它。我重复一遍，执行它。\n\
  \n人们不执行策略是因为觉得很繁琐。安全策略应该被看作一张地图。你可能不在策略所说的位置，但如果你没有地图，你永远无法到达目的地。\n\n## 关于编写良好的报告，你有什么实用的建议？\n\
  \n我的建议是不要重复发明轮——那里有许多资源可以描述漏洞、利用和风险评分。可以随意从 `NIST`、`CVSS` 或 `MITRE ATT&CK` 获取内容，并将其作为参考文献引用。引用这些内容实际上会增加你的发现和报告的可信度。\n\
  \n使用诸如 `CVSS` 的工具来帮助对你发现的漏洞进行评分。`MITRE ATT&CK` 非常适合讨论利用技术和建议的修复方案。如果你使用这些资源，报告写起来会更轻松，消费者也更容易信任。\n\
  \n## 你如何确保你的项目结果对需要完整叙述和背景信息的人具有价值？\n\n我认为使用能够讲述故事双方层面的工具很重要。我喜欢像 `MITRE ATT&CK`\
  \ 框架和 `NIST 网络安全框架` 这样的工具，因为它们都可以用来衡量你的实际能力和技能组。在不掌握所有技能组的情况下，在网络安全领域变得有效的。选出三件事并在它们方面做到最好。\n\
  \n书籍《从优秀到卓越》（From Good to Great）讨论了伟大的企业如何理解自己的擅长。我们可以将同样的方法应用于网络安全领域。\n\n## 除了指出不足之处，你如何建议安全改进？\n\
  \n我总是尝试寻找组织在某些方面做得正确的地方。因此，进行正向反馈的简单目标包括双因素/双步验证、密码长度和自动更新。\n\n作为红队人员，另一种帮助方法是理解修复问题（无论是在系统、网络还是代码中），这可以建立凝聚力。我曾与\
  \ `Unix` 管理员并肩，帮助他们发布命令来加固系统。如果你正在进行企业内部红队，这一点尤为重要。归结底，你们是为了同一个任务。\n\n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\
  \n在传递坏消息时，同理心是一项很棒的。作为红队成员，你不可避免要经常提供一些坏消息。站在对方的角度考虑问题，不要做个混蛋。\n\n## 在以不同方式问题方面，优秀的红队成员与普通人有何不同？\n\
  \n我认为优秀的红队成员会学习并了解事物运作的方式。我之前提到过同理心。优秀的红队成员可以进入系统管理员、网络工程师或软件开发者的思维模式，并解决他们面临的问题。优秀的红队成员总是渴望提高技能，并帮助他人也这样做。■\n\
  \n\n# David Bell\n\n> “成为红队成员没有所谓的‘正确方式’。”\n\n\n**Twitter:** @operant\n\nDave 目前是通用电气（GE）红队的总监，在那里他领导了针对全球许多行业战略资产的行动。在加入\
  \ GE 之前，Dave 在`美国海军`红队工作了 10 年，在那里他策划、领导并执行了针对`美国军方`所有兵种、许多政府机构，甚至包括联盟伙伴的行动。Dave\
  \ 也是一名`美国海军`的退伍军人，曾在信号情报部门工作过 10 年。\n\n## 你是如何在团队中起步的？\n\n我从 2006 年开始，以承包商身份在`美国海军`红队起步。在此之前，我曾作为\
  \ `IDS` 分析师工作了六个月，而在那我在海军服役，后来转为政府文员，并在离开时担任副总监。现在我是 GE 红队的总监。\n\n## 获取红队工作的最佳方法是什么？\n\
  \n这是一个经常被问到的问题，我仍然很难回答。成为红队成员没有所谓的“正确方式”。我曾与一位非常聪明的人共事，他曾一度开过推土机。尽管如此，展现出像攻击者一样思考的能力至关重要，且无法教导。我们可以教技术技能，但思维似乎是天生的。如果有人拥有正确的思维，通常建议他们追求相关的培训和认证，并参加\
  \ CTF 活动。我也建议从其他信息安全工作开始，如渗透测试或事件响应。\n\n## 如何在不违反法律的情况下获得红队技能？\n\n这真的不应该再是一个问题了。现在有很多在线和线下培训。云平台也提供了成本效益的学习环境；我们不再需要从\
  \ `eBay` 或 `Craigslist` 购买旧设备来建立家庭实验室。\n\n## 为什么我们无法对什么是红队达成共识？\n\n源自`美国军事红队`社区，我对这种以及其他具有军事背景的术语的误用有相当强烈的观点。很容易将其归咎于行业营销，但这实际上是一个社区问题。渗透测试与红队测试是不同且独立的学科，此外，内部红队和顾问红队之间存在显著差异。\n\
  \n\n\n\n红队行动可能枯燥得令人痛苦。这是一项极其缓慢、细节且具有分析性的工作，期间穿插着极度狂喜和肾上腺素飙升的时刻。大多数人只能在汇报中看到高光时刻，或者受到好莱坞电影的误解。\n\
  \n## 何时应该在组织的安全计划中引入正式的红队？\n\n我经常告诉人们，直到他们*认为*自己不需要红队行动时，他们才真正需要红队行动。一旦组织觉得他们已经了解所有威胁并对局面了如指掌，就是时候让一支出色的红队来挑战这些假设了。而且第一份报告的内容通常不会看。\n\
  \n## 如何向不情愿或非技术背景的客户/组织解释红队的价值？\n\n学习业务！这一点我怎么强调都不为。红队必须在他们所支持的业务背景下理解他们正在攻击什么。展现出这种理解将对于与客户建立信任和真正的合作伙伴关系大有帮助。\n\
  \n## 你看到实施的性价比*最低*的安全控制措施是什么？\n\n漏洞扫描。虽然这是一项重要的安全功能，但我很少看到它能被正确执行，尤其是在大规模执行时。如果一个组织大到无法维护准确的资产清单，他们又怎么能能够扫描所有东西呢？\n\
  \n## 你是否建议过不要进行红队行动？\n\n是的，经常如此。我发现，虽然很多客户要求进行红队行动，但他们实际上（在无意中）是在寻找 Web 应用测试或其他形式的有限范围渗透测试。在这些情况下，我会引他们他们另一个更好地满足其需求的团队。有些人可能认为这是在“失去业务”，但我认为这是在建立信任。\n\
  \n## 防止你攻破系统或网络的最重要或最易实施的控制措施是什么？\n\n端点很少需要能够跨网络相互通信。阻止或监控此类流量将极大地限制攻击者的横向移动。请记住，攻击者想要的是存储在数据库等地方的数据。横向移动被用于定位并获取访问这些数据所需的权限。尽可能限制这种移动，迫使攻击者犯错。\n\
  \n## 为什么你觉得遵守交战规则（ROE）至关重要？\n\n交战规则（`ROE`）用于定义行动应如何进行、行动范围、紧急情况下联系谁，以及任何其他重要事项。`ROE`\
  \ 是红队和客户双方主要的安全网，因此如果红队偏离了这些规则，可能会损坏系统，或产生物理上的不安全状况。然而，事故确实可能会发生，因此良好的 `ROE` 将定义针对此类事件的报告流程，红队会对发生的情况保持完全诚实。\n\
  \n## 如果你在渗透测试或其他行动中被抓了，你是如何处理的？\n\n我从未做过渗透测试，但我参与过许多红队行动，包括网络漏洞利用、无线，甚至在海外进行物理评估。我最喜欢的故事之一是我和队友在试图说服某些军事人员让我们插入\
  \ USB 闪盘时被抓了。一位级别较高的军官从隔壁房间听到了对话，并立即冲进来……\n\n\n\n\n## 如何确保你的程序结果对于那些需要完整叙述和背景的人来说具有价值？\n\
  \n这会因每个组织而异，但一个很好的开始方法是识别红队的真正客户是谁。客户与利益相关者是不同的，在尝试优先考虑任务和报告时，这种区分变得至关重要。\n\n一旦确定了真正的客户和利益相关者，红队领导层应该开始为这些个人量身定制沟通内容。报告应该具有正确的详细程度，并在问题被问出来之前清楚地回答那个不可避免的“那又如何？”的问题。这需要学习业务，并理解你的团队刚刚评估的技术是如何融入这些流程的（从而理解你团队的行动对整个业务的影响）。业务是终极客户，而业务的存在并不仅仅是为了运行一个\
  \ `CIRT`（或红队）。\n\n## 除了指出不足之处，你如何提出其他安全改进的建议？\n\n红队经常被要求提供安全改进的建议，但令人沮丧的是，答案几乎总是“这取决于具体情况”。红队提供的是环境的瞬时快照。红队可能不知道\
  \ `why` 环境会呈现出样子，但几乎可以肯定，在某个时刻，出于某些业务原因，人们做出了以特定方式设计和构建环境的决策。考虑到这一点的一种方法是红队与负责实施修复的团队坐在一起，从头到尾走一遍攻击路径。\n\
  \n这有助于网络所有者窥探攻击者的思维，并帮助红队理解网络所有者面临的挑战。然后，可以在那一刻脑风暴潜在的缓解措施并进行桌面演练，从而产生可以实际实施的高质量建议。红队甚至可以在稍后日期回来重新测试环境，以查看建议的修复是否按预期运行。\n\
  \n## 在招募和面试红队成员时，你寻找哪些非技术技能或态度？\n\n当我与候选人交谈时，我寻找的是积极面对的态度和强大的内在驱动力/动力。红队成员经常会发现自己深陷枯燥的分析中，而分析的结果可能决定任务的成败。\n\
  \n因此，候选人能够自我激励继续下去、不忘记目标，并且不抱怨他们“没有在做酷酷的事”是非常重要的。红队的工作通常非常无聊，除了 Shell 最终返回时那种纯粹的肾上腺素飙升的时刻，因此候选人需要表现出他们完成任务所需的耐心和决心。\n\
  \n## 在以不同方式处理问题方面，优秀的红队成员与普通人相比有何区别？\n\n优秀的红队成员能够像攻击者一样进行思考、计划和行动。这种能力通常被称为 `attacker\
  \ mind-set`（攻击者思维），但它更像是一种生活方式，而不是可以根据需要随时开启或关闭的东西。例如，一旦一个优秀的红队成员接受了培训并执行了物理攻防，该红队成员会习惯性且无意识地“勘察”他们进入的每栋建筑。他们会自动记录摄像头的位置和角度、安保人员、门窗锁的类型和状况等，而这一切无需思考。对于坐在键盘前的红队成员来说也是如此：他们会培养出一种天赋能力来“感知”漏洞，并直觉地理解不仅如何利用漏洞，而且是否为了实现最终目标而\
  \ `should` 利用这些漏洞。\n\n这种品质在候选人中很难识别，用语言表达也更加困难。然而，我看到过候选人在面试流程的最后阶段通过技能挑战展示他们的才华并取得了良好效果。候选人在高压虚拟环境中处理问题的方式可以很大程度上告诉我们，攻击者思维是完全存在、需要培养，还是根本在候选人中不存在。并不是每个人都能这样思考，也不是每个人都适合加入红队，这没关系。我见过非常聪明的人在这一方面挣扎，但随后在网络安全的其他方面建立了成功的职业生涯。■\n\
  \n# 3\n\n### Paul Brager\n\n> “正如你可以想象的，获得红队工作的最好方法是首先理解你想做什么，然后建立一套技术技能和基础，以符合该类型职位所包含的内容。”\n\
  \n\n**Twitter:** @ProfBrager\n\nPaul 25 多年来被视为网络安全社区的思想领袖和专家，他在评估、保护和防御关键基础设施及制造资产（`ICS`、`IoT`\
  \ 和 `IIoT`）方面拥有深厚的知识。作为一名热情的演讲者和研究人员，Paul 致力于推动 `ICS` 网络安全和威胁面管理的讨论。\n\n他曾在多个与安全相关的播客、出版物和网络研讨会上提供过评论，这些平台为关键基础设施和制造业的网络防御策略提供了指导和见解。Paul\
  \ 热衷于指导那些渴望为行业进步贡献力量的有色人种，并促进网络安全社区内部的多样性。\n\n## 你是如何开始红队的？\n\n我的红队生涯（与该领域的大多数经历一样）源于紧迫性。公司领导层解雇了一个使用带有本地账户的\
  \ `Windows 95` 桌面面的“老旧”员工（是的，`Windows 95`）。在当时，工作站不属于域并不罕见（90 年代中期 Windows 域并不常见），但如果丢失密码，也没有什么方法可以进入工作站。`Novell`\
  \ 仍然是网络操作系统的王者，你懂的。恢复机器通常意味着在其上方重新安装，并希望没有踩到任何关键文件/区域，或者使用当时开始出现的许多“魔术启动盘”之一进入。\n\
  \n这些磁盘通常基于 `Slackware`，但你需要一些“技能”才能在不破坏目标主引导记录 (`MBR`) 的情况下让它们工作。以可预测的结果“黑入”这些磁盘更多是一门艺术而非科学，因为你不仅需要一些\
  \ `Linux/BSD` 知识，还需要 `Windows` 分区的知识。在花费大量时间构建（并重建） `Windows 95` 测试机器以获得正确参数后，我成功访问了\
  \ `Windows 95` 工作站，并找回了会让公司花费数月开发时间的宝贵源代码。\n\n### 获得红队工作的最好方法是什么？\n\n嗯，这取决于——做什么什么工作的红队？纯渗透测试？生存性测试？针对特定类型资产的渗透测试，换句话说，即\
  \ `ICS`？正如你可以想象的，获得红队工作的最好方法是首先理解你想做什么，然后建立一套技术技能和基础，以符合该类型职位所包含的内容。经验在这里通常是关键，但并非如此——有时原始的知识和展示出的技巧就足够了。人脉建立，无论是面对面还是社交媒体（或两者都有），仍然获取可用红队职位信息的最强方法之一，但你可能运气好碰到了拥有招聘决策权的人。\n\
  \n\n\n\n今天，在不陷入法律麻烦的情况下获得红队技能是非常容易的。人们练习所需的许多工具都是开源的且易于下载；访问许多作为潜在目标的操作系统的权限也是如此。虚拟化世界为创建虚拟实验室打开了大门，这些实验室可以被销毁和重建，而对任何人产生影响——当然，除了你。此外，还有许多可供攻击的平台（例如\
  \ Hack The Box）可以测试各种技能和能力，以进一步磨炼红队技巧。更具针对性的实践——例如针对 ICS 资产的实践——要稍微棘手一些，尽管一些 `PLCs`（`ICS`\
  \ 中的主要目标）可以在 eBay 上购买。同样，`IoT` 设备（如 `Raspberry Pis`）也可以廉价地购买，以开发针对这些设备的技能。\n\n##\
  \ 为什么我们无法对红队的定义达成共识？\n\n与网络安全领域的许多事情一样，在讨论什么构成红队行动时，往往隐含着“视情况而定”。有人认为红队行动只是黑客攻击；另人认为红队行动比这要稳健和系统得多。我认为，这最终取决于观众的视角。对于纯企业环境的人来说，红队行动为无恶意目的的渗透测试提供了一个更优雅的名字。它蕴含了一种结构感和方法论，利用进攻安全能力来发现可利用的漏洞。然而，在黑客社区中，使用的定义可能松散得多。\n\
  \n### 信息安全其他领域对于加入红队有哪一点最不理解？你听过的关于红队、蓝队或紫队最具毒性的谎言是什么？\n\n加入红队并不会自动让人变得邪恶或恶意。相反，他们在网络安全领域感到兴奋的往往更多是进攻能力。研究和发现可利用的漏洞既枯燥又费力，而能够做到这一点*并且*以易于理解的方式阐述发现，与其说是科学，不如说是艺术。虽然他们的背景可能是黑客培养的，但这并不能定义他们，而是证明了他们在网络安全生态系统中必要性。\n\
  \n到目前为止，我听过最具毒性的谎言可能是：网络安全专业人士完全属于三个类别之一：`red team`、`blue team` 和 `purple team`。这给人留下了网络安全专业人士是单一线条的印象，但这完全不是事实。虽然每位专业人士根据其在网络安全领域的成熟程度，可能对其中一个更有好感，但在功能上，完全不考虑其他类别是不可能的。红队成员必须理解他们的渗透尝试如何被阻挡或检测，并提出对策措施以减少这种情况发生的概率。蓝队成员必须在某种程度上理解对手发起的\
  \ `TTPs`，以便更好地开发防御措施来击退他们。大多数网络安全专业人士都是某种程度的紫色，根据对该领域的亲和力和成熟度，更偏向于红色或蓝色。\n\n## 你应该何时向组织的安全计划中引入正式的红队？\n\
  \n正式的红队可以在任何时候引入到安全计划中。这样做的价值和益处很大程度上取决于从红队演练中获得什么。如果意图是理解攻击面以及计划（或计划的某部分）脆弱到什么程度，那么在计划开发的早期引入红队服务是合理的，将其作为一种更好地界整体风险的工具。同样，正式的红队参与可以作为整体安全战略和生命周期的一部分，重新评估控制的稳健性以及组织的检测和响应能力。\n\
  \n## 你如何向不情愿或非技术的客户或组织解释红队的价值？\n\n在组织内部游说红队行动可能是挑战性的，特别是当组织的安全计划尚未成熟到漏洞评估和/或漏洞管理之外时。此外，如果组织没有充分投入或实施控制措施或资源，红队行动可能会发现未列入预算且没有足够资源解决的漏洞，这会加剧问题。我的方法一直是将红队行动的概念构化为风险管理/缓解的功能。红队行动允许组织在坏分子利用它们之前发现其安全态势中潜在的损害性或风险漏洞，从而最大限度地减少对公司声誉、客户和股东的潜在影响。采取这种方法使是否使用红队的问题变成了一个业务决策，而不是技术决策。\n\
  \n### 你看到的已实施的性价比*最低*的安全控制是什么？\n\n随着市场上琳琅满目的安全产品、服务和能力，它们都应该支持两个主要原则：检测和响应。然而，许多安全组织的人员配备并不合理，无法处理并采取从这些工具获取的所有可用数据。在我看来，独立的威胁情报工具性价比最低，因为它们仍然需要对环境进行上下文关联，这在隐含中需要人力的精力的投入。即使在防火墙、`SIEM`\
  \ 和 `IDS/IPS` 之间有自动化和编排，正确消耗威胁情报也需要资源——并且消耗了本可以用于其他地方的精力。许多更有效的控制（防火墙、`IDS/IPS`、`EPP`）的稳健性通常会为你提供检测和响应所需的威胁上下文，而无需另一个工具的开销。\n\
  \n## 你是否曾经建议不要进行红队行动？\n\n通常情况下，客户或组织总可以从某种形式的“红队”活动中获益，即使仅仅是轻级的渗透测试。在我的咨询生涯中，如果组织的安全计划表现出明显的不成熟，或者无法达成约定以安全地进行红队演练，我们通常会反对进行全面的红队演练。过去建议的是一种更分阶段的方法，先针对有限范围的目标，然后随着组织安全成熟度的增加逐渐扩大。\n\
  \n### 哪种最重要或最易实现的控制可以防止你攻破系统或网络？\n\n安全意识培训可以是增强组织整体安全态势的最重要且易实现的控制之一。用户行为可能是管理良好的威胁格局与混乱格局之间的区别，在许多情况下，终端用户会比安全人员先发现事件。教育并赋能用户良好的网络卫生。此外，某些基于云的安全控制措施可以用来抵消基础设施的资本成本，如果那是障碍的话。这对于人员和/或预算有限的小企业尤为如此。\n\
  \n### 为什么你认为遵守规则约定（Rules of Engagement）至关重要？\n\n规则约定（Rules of Engagement）是为任何红队/渗透测试演练建立的边界。它们基本上为可能导致损害或停机的活动提供了高层保护，即使是无意的。此外，当真的发生非常糟糕的情况时，规则约定可以成为你的“免金牌”，因为它们通常包含免责条款。在没有获得客户明确书面同意的情况下偏离既定的规则约定可能会可能会你面临法律责任问题，并对你的职业造成毁灭性影响。\n\
  \n\n\n\n# 如果你在渗透测试或其他任务中被发现，你是如何处理的？\n\n我曾遇到过一次情况，当时正在为一个客户进行物理渗透测试，但赞助方忘记通知现场安保人员我的存在。在通过后门的一扇被顶住的门（维修人员不想反复刷卡进入）进入设施后，我戴着一顶从桌子上“借”来的安全帽在设施内走动，结果被现场安保和当地警方捕获了。更糟糕的是，当他们打电话来确认我是否有权进行渗透测试时，我的联系人不在。在经历了两个小时紧张的拨打所有我能联系的所有电话试图解决这个问题，并面临被起诉的威胁后，联系人终于回了电话，我在没有被逮捕的情况下获释。\n\
  \n## 在执行任务期间，你遇到过最大的伦理困境是什么？\n\n毫无疑问，我遇到过最大的伦理困境是在不该出现这些的地方发现了账户缓存、财务记录或 `PII`（个人身份信息），并被赞助方要求在渗透测试结束之前不要向受影响的个人披露细节，而测试可能持续几天。对我来说，某些发现具有优先性，需要立即采取行动，特别是涉及\
  \ `PII` 或财务信息时。在这种情况下，赞助方正试图向管理层的另一成员证明某个观点，几乎对所发现的内容毫无理会。\n\n## 红队是如何协作完成任务的？\n\
  \n顾如其名，红队行动通常涉及多个人。针对多个目标进行渗透测试所需的协调要求对每个团队成员的预期工作有清晰的责任划分。此外，团队中通常某些成员在特定任务上比其他人更擅长——擅长与客户交流的人负责沟通，技术性更强的人专注于技术角色，以此此类推。拥有擅长与客户交流的红队团队总是很有用的，因为他们每个人（特别是在大型任务中）可能需要在不同的时间向不同的受众进行汇报。\n\
  \n## 在任务完成后，你进行汇报总结和支持蓝队的方法是什么？\n\n当我在担任顾问时，会有两次报告。一次是面向管理层的，报告所开展的高层级活动、发现了什么，以及这些发现引发产生的风险担忧。任何异常发现都会在对话中列出，这样如果需要启动法律或其他行动，责任方就可以着手。第二次报告是技术深度分析；它通常分为发现区域，并与蓝队指定人员进行个人小型会议，以确认报告中的内容并解答任何问题。在这些会议期间，还会讨论后续的修复措施和后续步骤。\n\
  \n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\n由于在防墙的两个侧都生活过，让我一直感到惊讶的事情之一是上下文可见性的缺乏——不仅是日志等，而是对关联资产具有上下文的实际可见性。此外，识别生态系统内的资产仍然面临着巨大的挑战。`IoT`（工业领域为\
  \ `IIoT`）的引入加剧了这个问题。这两个领域需要从深度防御的角度来解决，因为你无法对看不见和无法识别的东西进行防御。有效的网络安全防御是分层部署的，即使攻击者穿过了一层防御，他们想要穿过后续层也会变得越来越困难。最后，我会投入更多的时间和精力进行安全意识培训，并赋予终端用户改变行为所需的信息。\n\
  \n## 关于编写良好的报告有哪些实用的建议？\n\n在编写测试报告时，理解客户的目标并编写与这些目标保持一致的报告至关重要。根结底，任何修复工作都需要资金支持，测试报告越能帮助建立这一理由，客户就越可能再次联系你们机构（或你）寻求后续工作。考虑客户需要向管理层展示什么来迫使他们采取行动。在起草过程中从客户处获得反馈并将其纳入；报告的风格和语气对于该组织内部安全职能的努力可能是关键性的。力求突出安全职能表现良好的区域，随后是以后风险为特征的发现。还要记住，内容必须经过辩护，因此语言要尽可能简洁且无歧义。\n\
  \n## 你如何确保你的计划结果对于需要完整叙述和背景的人来说是有价值的？\n\n根据我的经验，红队计划如何增加价值因组织而异，但原则上它应该与整体安全计划和组织的风险态势保持一致。该计划应努力列出给定生态系统内的重大和可利用的漏洞，并理解到并非所有发现都在组织的风险容忍范围之外，而某些风险是不可妥协的，必须被消除。无论处于何种情况，能够将红队计划与某些可重复的指标联系起来（例如发现的重大和可利用的漏洞数量、成功与失败攻击的次数，或假阳性的数量），对于证明这项工作的价值非常有帮助。如果你所做的工作对业务没有价值，那么你的技能组合其实并不重要。高级管理层对一份展示你有多熟练、多聪明的报告并不感兴趣——他们*感兴趣*的是根据你的发现，他们的整体风险敞口如何，因此请从这个角度来设定你的活动。\n\
  \n## 除了指出不足之处外，你如何建议改进安全措施？\n\n在任何红队演练中，突出客户/组织做得好的区域都是重要的。例如，如果一个组织拥有稳健的补丁计划，并这导致红队的攻击面缩小，请务必承认这一点。记住，红队的工作部分不仅要证明其技能能力，还要证明其作为安全计划一部分的内在价值。如果红队不能助力安全计划的成功以获得所需的资金，那么它的价值就会被削弱。与蓝队成员的对话应该尽可能提供信息，如果两个团队来自同一公司，红队成员协助蓝队识别防御措施可能会很有用。成为一个不仅用于入侵系统而且用于保护系统的专家来源——帮助蓝队像黑客一样思考（假设他们还没有这样做）。\n\
  \n## 在招聘和面试红队成员时，你会寻找哪些非技术技能或态度？\n\n任何安全专业人员具备的最重要的非技术技能是强大的沟通能力。在招聘红队成员时，候选人必须具备值得信赖的诚信。红队成员将接触到基础设施、安全控制、漏洞等非常敏感的知识，这些信息需要被绝对保密。不仅技术上精通，还能向外行解释这些技术概念的能力，对于红队资产来说是无价的。\n\
  \n\n\n\n\n在处理问题的方式上，是什么让优秀的红队成员与众不同脱颖而出？\n\n优秀的红队成员不仅是技术高高手，还对自己的活动对组织（无论作为员工还是顾问）所代表的价值有着天生的理解。优秀的红队成员做事严谨、注重细节，并对自己的技能充满自信。优秀的红队成员始终在不断提升能力，并寻找不被发现的利用方法。解决问题可以是高度系统化的，也可以是串行的。无论采用何种方法，优秀的红队成员都会在需要应用适当的方法，并在该方法遇到胡同同时进行调整。■\n\
  \n# 4 - Beau Bullock\n\n> “我坚信，在没有深入理解底层协议（不仅包括技术细节，还业务逻辑）之前，不直接跳到进攻角色。”\n\n\n**Twitter:**\
  \ @dafthack\n\nBeau Bullock 是一位高级安全分析师和渗透测试员，自 2014 以来一直任职 Black Hills Information\
  \ Security。Beau 拥有多种安全认证，通过定期参加培训、从同事那里学习尽可能多的知识以及研究自己缺乏知识的话题来保持其丰富的技能。他通过编写开源工具、写博客以及频繁在会议和网络研讨会上演讲，不断为信息安全社区做出贡献。\n\
  \n### 你是如何开始红队工作的？\n\n我遇到很多对渗透测试或红队感兴趣并想直接进入这些角色的人。我的职业生涯并不是从信息安全的进攻端开始的。我被赋予保护网络、用户及其数据的任务迫使我像攻击者一样思考，以便成为更好的防御者。我是在大学期间上过的一门伦理黑客课程中首次对进攻行动产生兴趣，但这种兴趣直到多年后才发展为进攻角色。\n\
  \n在医院和银行担任蓝队工作期间，我会思考对手会如何绕过我们建立的控制措施。因此，我自然开始对自己的控制措施进行进攻性测试，看看我们在哪里遗漏了东西。对我来说，尽可能地了解组织的每一个层级至关重要。从防火墙规则、路由器配置到主机端防护、物理安全，从管理与高管特殊例外相关的风险，到保护数据以及防止人员被钓鱼——这些都是我发现防护不足之处的机会。\n\
  \n从运营的角度来看，理解蓝队必须面对的挣扎、网络运作方式以及可能的防御控制措施，可以为进攻操作员提供更清晰的画面。2014 年当我开始在 Black Hills\
  \ Information Security 工作时，我转向了进攻角色。在工作的前几年里，我为各种组织执行了许多渗透测试。这让我有机会调整自己的能力并开发红队战术。在过去的三年里，我有幸被分配了正式的红队实战任务。\n\
  \n## 获得红队工作的最佳方法是什么？\n\n加入红队需要一个独特且专注的个人，并且他们需要具备极大不同领域的知识。我坚信，在没有深入理解底层协议（不仅包括技术细节，还业务逻辑）之前，不直接跳到进攻角色。你了解你目标业务每天是如何运作的吗？你能确定该组织看重什么吗？\n\
  \n许多红队由多个拥有不同领域技能的个人组成。你可能会看到能够执行架构设置、载荷交付和/或社会工程学、担任内部网络专家等职位的团队成员。在获得红队工作之前，我建议先在渗透测试中开发多个领域的进攻技能。成为优秀红队成员的关键在于，拥有从多个角度攻击一个组织的知识，并具备使用那种必要的且不会让你被捕获的方法的自律。\n\
  \n> “成为优秀红队成员的关键在于，拥有从多个角度攻击一个组织的知识，并具备使用那种必要的且不会让你被捕获的方法的自律。”\n\n如果你已经是一个寻找红队角色的渗透测试员，我认为人脉可能是你最好的选择。出去结识那些在红队工作的人并介绍你自己。向他们展示你一直在做的项目。我经常在我的\
  \ Twitter 时间线上看到别人发布的招聘信息。\n\n如果你在公司担任内部安全分析师或类似的职位，而你的公司没有内部红队，也许是时候申请建立一个红队了。你可能为自己的组织建立内部红队，并本质上创造你自己的红队角色。\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n在建立技能方面，我非常提倡参加夺旗赛（CTF）。此外，投身漏洞赏金计划（Bug Bounty）是建立\
  \ Web 应用攻击技能的好方法。建立家庭实验室不需要很贵，它可以为你提供一个测试平台，以便在进行红队研究而不违反法律。\n\n### 为什么我们对什么是红队无法达成共识？\n\
  \n我认为很多人很难理解渗透测试在哪里结束，红队从哪里开始。两者之间确实存在人们纠结的重叠部分。人们通常将红队任务描述为不受限制的渗透测试。但红队任务确实有限制。如果没有限制，那么绑架、勒索和敲诈就会出现在作战规则中。由于红队并非真正不受限制的，我认为人们很难理解它与渗透测试何不同。\n\
  \n### 信息安全其他领域对红队工作还有哪一点不理解？你听过的关于红队、蓝队或紫色队最具毒性的谎言是什么？\n\n对于大多数人来说，我认为他们仍然认为红队试图用\
  \ `Metasploit` 甩出漏洞。我已经多年没有使用过真正的软件漏洞了。配置问题、弱密码以及用户对钓鱼的意识薄弱通常是我们进入的方式。一旦进入网络，这百分之百是一场关于凭据的游戏：`pivot,\
  \ dump creds, pivot, dump creds, rinse, and repeat`。\n\n我认为我看到的最毒的东西是某些蓝队和红队成员之间对待对方的方式。许多人将对方视为糟糕的敌人。我们作为红队成员的工作是帮助蓝队变得更好。我们不应该对自己的行动自鸣自豪。蓝队也是如此。我喜欢紫色队评估，我们可以共同努力让组织变得更好。我在任务中发现的一些最酷的东西都是紫色队评估中的。\n\
  \n\n\n\n\n只有当一个组织经历了多次渗透测试，并对向其展示的任何漏洞采取了必要的缓解措施后，我才会考虑建议进行红队行动。在决定一个组织是否准备好进行红队行动时，最重要的考虑因素是：红队是否能利用在渗透测试中发现的漏洞进入？如果是，那么该组织还没有准备好接受红队。该组织应该已经有一套内部社会工程计划，以确保其用户不会向红队托管的恶意页面提交凭据。应该建立完善的告警机制和基础设施加固措施，而且我最好千万不要发现任何没有开启\
  \ `MFA` 的暴露门户。\n\n## 你如何向不情愿或非技术性的客户或组织解释红队的价值？\n\n对我来说，解释这是对他们防御能力的真实测试这通常是有效的。我喜欢通过向客户描述渗透测试来解释：我会尝试发现尽可能多的漏洞，但过程可能会非常“嘈杂”（容易被发现）。我会解释说，在红队行动中，我可能只会发现少数漏洞，但会安静得多，而且这些漏洞对他们来说可能更有价值，因为这些漏洞可能让我攻破了网络。\n\
  \n## 你认为性价比最低的安全控制措施是什么？\n\n在大多数情况下，如果你为防病毒软件付费，那么它是性价比最低的控制措施。我这么说是因为老实话，Windows\
  \ 系统默认安装的免费 `Windows Defender` 在执行防病毒软件应该做的工作方面实际上很不错了。\n\n## 你是否建议过不要进行红队行动？\n\n\
  是的，在范围界定电话中，如果我感觉到客户没有做过先前的渗透测试，或者难以概念化什么是红队，那么我可能会建议其他方案。在这个行业中，定义至关重要。如果没有达成共识的适当定义，很难判断他们所说的\
  \ `red team` 实际上是指渗透测试甚至是漏洞扫描。列出这些定义通常会让客户意识到，他们想要的是渗透测试而不是红队。\n\n## 能够防止你攻破系统或网络的最重要或最易实施的控制措施是什么？\n\
  \n最易实施的且让让我们这些红队人员工作变得艰难的控制措施之一是`Microsoft 的本地管理员密码解决方案 (LAPS)`。在每个系统上随机化本地管理员密码，使得单个本地管理员凭据的泄露不会导致访问网络中的每一个其他资产。主机之间的网络分段（包括客户端隔离，使工作站无法与其他工作站通信）是另一个极佳的控制措施。如果我无法从一个工作站跳转到另一个工作站，那么我在域内提升权限将非常困难。\n\
  \n尽管这个问题只要求提供一种控制措施，但我认为以下是锁定以防止整个域沦陷的最重要事项：在所有可以实施的地方部署 `MFA`、需要 `MFA` 和客户端证书的\
  \ `VPN`、强密码策略（15 个字符或更多）、强力日志汇总和告警、应用程序白名单/行为分析软件、强出站过滤（仅允许通过带有过滤功能的身份验证 `proxy`\
  \ 访问 web 端口），以及针对社会工程的用户意识。如果一个组织实施了这些措施，我作为一个红队人员，日子会很不好过。\n\n## 为什么你觉得遵守行动规则（Rules\
  \ of Engagement）至关重要？\n\n遵守或不遵守行动规则，就像是炮弹落在你的目标上与将炮弹落在目标伴侣的个人设备上的区别。其中一种是高度违法的行为，而且你可能无法忘记你在那里看到的东西。\n\
  \n## 如果你在渗透测试或其他行动中被抓包了，你是如何处理的？\n\n被抓包？那是什么？\n\n## 在执行指定任务时，你遇到过的最大的伦理困境是什么？\n\n\
  有一次，我被要求为一家公司进行渗透测试，并进入了 CIO 的系统，在那里发现了一些非常可疑的东西。我在那个人的系统上有一个 `Meterpreter shell`，注意到运行着一些\
  \ `KeePass` 进程。我想：“太好了，我等他离开，然后登录，并看看他是否留下了 `KeePass` 未锁定。”在深夜他下班离开后，我通过 `RDP` 连接到他的系统。果不其然，他留着开\
  \ `KeePass`，所以我现在可以访问大量的凭据，包括他的一些个人凭据。\n\n但我也注意到他系统上还开启了其他窗口。首先，他正在使用 `RDP` 连接到目标网络之外的另一家服务器，他在那里似乎在进行某种“系统管理”。更奇怪的是，他还在使用\
  \ `RDP` 连接到一个个人系统。这个个人系统的桌面上上有用于群发垃圾邮件和其他其他用途的已知工具。在行动的这一阶段，这变成了一个伦理困境，因此我停止了行动。后来我从客户那里得知，该\
  \ CIO 被解雇了。\n\n## 红队是如何合作完成任务的？\n\n在我看来，整个行动过程中协作式的基础设施是必要的。为了在行动中成功，我们需要能够方便地共享\
  \ shell、数据等。在报告方面也是如此。我们不希望在独立的文档中工作，这在我们之后想要合并它们时会产生过多的工作量。如果我们可以在同一个文档平台上进行协作，报告过程会顺畅得多。\n\
  \n## 在行动完成后，你对蓝队进行事后总结（debriefing）和支持的方法是什么？\n\n行动结束后，我喜欢组织能让所有相关方参加我举行的会议。我希望安全团队在场，还有\
  \ `SOC` 的成员以及其他系统管理员类的员工。这样，那些通常不看渗透测试报告的人就能意识到网络上可能发生什么。反过来，这帮助他们掌握严密保护系统所需的知识。我通常会讲解整个行动，从侦察到初始攻破，再到最后的权限提升。\n\
  \n## 如果你要转向蓝队，更好地防御攻击的第一步是什么？\n\n不要转向蓝队。但如果我真的转了，第一步会就预算进行长期讨论。了解预算可以帮助你了解如何分配资金以获得最大收益。你不想把预算花在一个可能需要另一名全职员工才能管理的最新闪光系统上。对于安全网络有很多免费和开源的选项，但许多选项也需要时间和精力的。因此，也许使用预算聘佣另一位同事是最好的选择。如果某些措施还没有到位，我建议尽快实施的一些措施将是部署\
  \ `Microsoft 的 LAPS`、加强密码策略以及部署 `MFA`。\n\n## 关于编写优秀的报告，有什么实用的建议？\n\n在测试时做大量的笔记，并基本上随着进度边撰写报告。你能做的最糟糕的事情就是向笔记文档里填满截图，却忘记了为什么要拍这些图。相信我，我知道要停止手头的工作去写几句话真的非常困难。尤其是当你面对一个新\
  \ shell 时，你可能忍不住直接开始黑客攻击。但如果你不记录，你以后会后悔的。\n\n\n\n\n\n尽可能地，我会尝试解释一个真正试图进行恶意活动的攻击者可能做的事情。大多数真实的攻击者并没有像红队人员那样的截止日期，所以他们并不担心在几周内完成任务。他们可以使用任何他们想要的时间。因此，对于许多组织而言，能够将实际威胁者的潜在行动与你提供的数据联系起来，可以为他们带来巨大的价值，因为他们理解情况实际上可能变得多么糟糕。\n\
  \n我的红队任务的一个重要部分是，我并没有将获取域管理员（domain admin）权限视为首要目标。在大多数情况下，我想要的数据并不需要域管理员凭据即可。我认为评估的目标应该是组织认为敏感的内容。如果我能证明我已经攻破了首席执行官的桌面，或者可能是一个包含信用卡数据或建造战舰计划的数据库，然后描述这些内容对攻击者会有什么用，大多数组织似乎都能从中发现价值。\n\
  \n### 除了指出不足之处，你还建议如何改进安全？\n\n通常情况下，我会向客户提供正向发现（positive findings），以便让他们知道我认为哪些控制措施是有效的。尽管某些措施可能会作为攻击者阻碍我，但在某些情况下，这些措施仍然可以改进。例如，组织可能暴露了一个\
  \ Outlook Web 访问（OWA）门户。也许在评估期间我无法访问它，但我仍然建议他们将其移动到内部网络，并在 `VPN` 后方对其进行保护。\n\n此外，对你的控制措施进行持续测试是必不可少的。即使红队任务结束了，也要学习并利用所使用的一些技术。测试者的方法论应该在报告中概述，并且通常会包括成功和失败。虽然测试者的某些技术在你的任务期间可能失败了，但你可能会发现你的网络上在你不知情的情况下发生了变化，而现在这些技术又成功了。最后，获得管理层对安全改进的支持至关重要。报告中应该提供高管需要解决的策略控制措施。\n\
  \n### 在招募和面试红队成员时，你倾向于寻找哪些非技术技能或态度？\n\n黑客思维和创造力是红队人员最重要的非技术性格特质。在红队任务中，他们经常会面临以前从未见过的挑战。拥有黑客思维意味着当他们面对未知时不会停止，而是会质疑一切，并寻找独特且新的方法来面对问题。在面对利用深度防御策略以及高质量告警和响应的高安全性环境时，红队的创造力是必须的。\n\
  \n> “拥有黑客思维意味着当他们面对未知时不会停止，而是会质疑一切，并寻找独特且新的方法来面对问题。”\n\n### 在以方式处理问题方面，优秀的红队人员是如何脱颖而出的？\n\
  \n我见过的大多数非常优秀的红队人员都深耕于某个特定领域。这使他们能够对某些技术或软件产生深入的理解。成为基础设施搭建、编码、设备黑客、开锁或任何其他领域的精通，将帮助你开发出一种在红队任务中有用的利基技能。拥有用创造性思维处理独特问题的能力，可以区分一个成功的红队人员和一个失败的红队人员。■\n\
  \n# 5\n\n**Christopher Campbell**\n\n> “什么是红队技能？当你列出让一个人成为胜任且高效攻击者的技能时，你会发现那些技能与让一个人成为优秀的服务器管理员、网络工程师或安全从业人员的技能是相同的。”\n\
  \n![](img/chapteropener.jpg)\n\n**Twitter:** @obscuresec\n\nChristopher Campbell\
  \ 从安全研究多年，拥有几个大学学位、行业认证和开源项目贡献。他还发现过一些漏洞并在会议上做过几次演讲。Chris 目前是 ManTech ACRE 的红队队长，曾是美国陆军红队的成员。\n\
  \n### 你是如何开始红队工作的？\n\n加入美国陆军红队的机会更多是运气，而非其他。在 15 年前，当我处于评估的接收方时，我并不知道这是一种职业。我决定让自己变得更具市场竞争力，并向红队社区的成员寻求建议。我收到了很多非常有用的建议。这些建议非常有帮助。一旦进入了红队，我真正的旅程就开始了。\n\
  \n## 获取红队工作的最佳方法是什么？\n\n获得任何你想要工作的最佳方法是记录你的能力并勤奋地申请。我曾有机会面试并聘用了一些非常出色的红队人员，他们在整个过程中都非常坚持。他们在面试期间对自己的技能组非常诚实，并且许多人在面试完后都请求了反馈。表现出对任务的热情和学习任何知识的意愿，在招聘过程中起着非常重要的作用。\n\
  \n### 人们如何在不违反法律的情况下获得红队技能？\n\n这个问题触及了一个非常容易被误解的话题。什么是红队技能？当你列出让一个人成为胜任且高效攻击者的技能时，你会发现那些技能与让一个人成为优秀的服务器管理员、网络工程师或安全从业人员的技能是相同的。你可以在不违反法律的情况下获得成为一名优秀测试者所需的所有技能。即使是看似违法的行为，也可以在自己电脑的虚拟化环境环境中完成。最终，违反法律对你的未来职业规划的影响可能比大多数人认为的要大。为什么要冒风险呢？\n\
  \n> “最终，违反法律对你的未来职业规划的影响可能比大多数人认为的要大。为什么要冒风险呢？”\n\n### 为什么我们对什么是红队无法达成一致？\n\n由于\
  \ *cyber* 一词发生了类似的语义变化，*红队* 也失去了许多人仍与其联系在一起的含义。红队评估与其他任何类型测试的关键区别在于对抗性模拟。换句话说，如果你没有利用真实的、有记录的威胁者的战术、技术和程序（TTP），那么你可能并没有进行红队评估。这并不意味着你不是红队人员。然而，如果你无法说明哪些攻击者使用哪些技术，那么许多人将很难相信你是。红队评估并不比其他类型的评估更好或更坏，但长期以来，它们被认为是最酷的。它们在生产网络上对真实的防御者进行演练，并测试了未经过妥当评估的政策和人类反应。我希望行业能够夺回旧定义，但可能不太可能。\n\
  \n**信息安全的其他人员对于红队工作的哪方面是不理解的？关于红队、蓝队或紫队，你听过的最具毒性的虚假信息是什么？**\n\n\n\n\n\n人们经常感到惊讶的一点是，当我在寻找红队成员时，我看重共情能力而非其他大多数特质。遗憾的是，这种共情能力通常源于曾处于构建、配置、开发或防御生产环境的位置。这导致了那句被反复提及的话：成为红队成员不应该是你的第一份工作。有些人对这种说法嗤之以鼻，因为乍看之下这像是在设置门槛。然而，能够迅速识别出胜任的专业会在哪里投入精力是无价之宝。它能让你迅速锁定那些投入或关注较少的区域，并在目标环境中快速获得高权限访问。换句话说，共情能力能帮助你更好地完成工作，也能帮助你在任务结束时传达那些艰难的信息。缺乏共情能力或对日常\
  \ IT 工作实际艰辛的人，往往会表现出与傲慢测试人员经常相关的毒性心态，这会损害他们在工作和交付中的效能。\n\n## 你应该何时向组织的安全计划中引入正式的红队？\n\
  \n残酷的实实是，大多数组织（即使是成熟组织）也不需要正式的红队。红队的唯一目的是演练防御者，让他们改进。简单的答案是：当一个计划成熟到有足够的周期进行演练时，可能就是引入红队的时候了。红队并非从零开始就能容易建立，而且有很多合格的组织可以提供临时服务。从那里开始，等时机成熟时，再利用他们来帮助建立、培训和增强你的团队。\n\
  \n## 你如何向不情愿或非技术性的客户或组织解释红队的价值？\n\n我曾有机会在一次跨国飞行中坐在某人旁边，他坚信为红队评估付钱完全没有业务价值。这是一种我不熟悉的观点，所以我听取了他的陈述。最后，我们的观点其实其实并不遥远。问题在于，大多数人并不理解红队的核心使命是什么，而是将其与其它类型的测试和评估进行比较。红队并不是要取代自动化漏洞扫描或渗透测试，而是在某些组织的防御成熟度提高后对其进行补充。红队并不适用于每个组织，但每位防御者都能从拥有敌对心态中获益。有时，如果没有一个受过训练的团队向你演示，这很难想象的。此外，红队测试的是你所有的政策和程序在存在真实人员的生产环境中是如何协同工作的。例如，我见过在经过极少检查的情况下就采取立即网络拦截措施的环境。几个伪造的数据包就导致了大规模停机，并针对愤怒且无法上网的用户创造了完美的社交工程机会。那种类型的逻辑漏洞在纸面上可能很难发现，但得益于红队，它会变得清晰得多。\n\
  \n> “红队并不适用于每个组织，但每位防御者都能从拥有敌对心态中获益。”\n\n## 你看到实施过的性价比最低的安全控制措施是什么？\n\n很难只列举一个。我认为，任何你为了保护环境而购买、且增加了更多攻击面的设备都是我的答案。遗憾的是，这可能包括在大多数安全会议展位上推销的半数闪烁灯设备。它们内部通常存储了高权限凭据，在被宣传为解决你所有安全问题的答案之前，经过了极少的测试。没有任何首席安全官（CISO）希望在报告中看到他们最新的安全采购结果，但这种情况发生得太频繁了。\n\
  \n## 你是否建议过不要进行红队任务？\n\n任何诚实的测试人员都应该有很多这样的故事。在陆军红队工作期间，我们大多数时候没有提供不同选择的活性，因为任务是强制性的。评估环境的成熟度是任务规划的关键步骤，但这通常是一个棘手的问题。由于行业内对`red\
  \ team`一词的广泛误用，这变得更加复杂了。\n\n## 能够防止你攻破系统或网络的最或最易实施的控制措施是什么？\n\n这是我在会议演讲中提到过几次的一项创意性实践，它确实在一次任务中抓住了我们。该组织将日志审查作为办公室里几乎任何行为的某种惩罚。如果你开会迟到、输掉了昨晚比赛的赌注，或者没能为“脏话罐”贡献资金，你就获得了审查日志的时间。经理每周会分发不同团队的日志进行审查，之后他们会针对他们发现的最严重问题为团队撰写一份报告。这有几点好处：所有团队都知道自己的日志会被审查，结果因此更加详尽，而且所有部门对安全都有显而易见的关注。新鲜且好奇的眼睛能够发现那些本会淹失在噪音中的异常情况，从而在不使用任何昂贵安全设备的情况下发现了了陷渗透。最后，技能和知识在团队之间传递，这让人们保持了参与感，我相信这让他们对工作更加满意。\n\
  \n## 为什么你觉得遵守任务规则（ROE）至关重要？\n\n任务规则（`ROE`）绝对至关重要，并且是坚不可摧的。信任和专业精神对于红队的最终成功至关重要。如果你违反了`ROE`，你就破坏了组织对整个团队的信任。为了大家的利益，质疑和调整\
  \ `ROE` 的时间应该是任务开始之前。典型团队在评估期间获得的访问层级可能高于组织中的任何个人管理员或 IT 部门。这种信任永远不应该被违背。\n\n###\
  \ 如果你在渗透测试或其他任务中被抓包，你是如何处理的？\n\n我在评估期间被抓到很多次，光是那些互动可能就能写一整本书。我最喜欢的事件之一是：通过社交工程预订了会议室、尾随进入建筑，然后在接入目标内部网络后加入了几名红队成员。在通过传统方法获取凭据后，我尝试将这些凭据用在`Active\
  \ Directory` 中看到的第一个感兴趣的主机上。我们低估了受众，从一个工作站 IP 直接到另一个工作站使用凭据触发了他们基于主机的安全产品的警报。警告包含了我的`IP\
  \ 地址`、我使用的账户以及我尝试访问的文件。遗憾的是，我针对的机器是整个 IA 部门正在参加会议时投影幻灯片的机器。他们采取行动，在我意识到自己触发了任何东西之前就找出了我们的位置。我们被抓包了，这都是我的错。他们冲进我们安静工作的房间，要求知道我们是谁。由于对这种局面负责，我坚定地告诉他们去找他们的老板，这样我们就可以讨论他们干扰工作的问题。这让小组感到困惑，但他们宣布会马上回来。之后，他们回到一个空空的会议室，几天后我们经历了一次超级尴尬的总结汇报。\n\
  \n## 在执行分配目标时，你经历过的最大的伦理困境是什么？\n\n\n\n\n我遇到过几次情况是：被要求从报告中删除某些特定的关键发现。根据与其他测试人员的讨论，我假设这种情况很常见。有时，评估产生的影响远比测试人员意识到的要大得多。随着测试变得更加常态化，以及越来越多的组织公开报告其曾遭攻破，这在理想情况下减轻了评估表现不佳所带来的耻辱感。一个经验丰富且范围合理的红队实战项目（red\
  \ team engagement）几乎总是会导致成功的渗透。除非发现有人违反了公司政策或采取了不符合道德的行为，否则没人应该因此而失去工作。其目的是培训和提高组织的安全态势，而不是为了“戳人的眼睛”。因此，我反对在报告中隐瞒已确认的发现。\n\
  \n## 红队团队是如何协作来完成任务的？\n\n红队测试中的“团队”元素至关重要。没有人能成为所有领域的专家。拥有不同技术背景的人员可以让你你们通力合作来完成使命。沟通非常重要，团队的每个成员都应该了解其他人在做什么工作。此外，团队的领导力也极其重要。网络上的每一个动作以及其面临的被发现或引起反应的风险都需要被理解和分析。鲁莽的行为（Rogue\
  \ actions）可能是有害的，并可能导致内部冲突以及糟糕的结果。评估期间的文档记录应该是每个人的责任，但根据我的经验，安排专专轮将结果整合到报告中会产生更好的效果。\n\
  \n## 在行动完成后，你如何对蓝队（blue teams）进行简报并提供支持？\n\n每次实战都需要提供书面或口头的交付物，但我一直更倾向于非正式的结束简报（out-brief）。这种简报没有经理和自尊心的干涉，只是所有参与者对所做的事情进行坦诚的讨论。如果执行得当，双方都会获益。此外，这也是收集组织表现良好之处，或防守方希望你向他们的老板强调的内容（以获得支持或资金）的绝佳机会。\n\
  \n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\n我相信防御任何环境的第一步都是对其进行映射（map）。组织认为拥有的机器数量与实际拥有的数量之间几乎总是存在差异。这看起来非常简单，但往往会有惊喜，这些可能是多年来被遗忘的或从未记录过的。在能够防御它们之前，你必须弄清楚那里有什么。\n\
  \n## 编写优秀报告有哪些哪些实用的建议？\n\n不幸的现实是，报告对其他人来说比对编写报告的人来说更重要。最好的报告是准确、简洁且引人入目的。准确性来自于记录你的行动并提供发现的证据，而不是夸大它们。陈述你的数据点所指向的事实。简洁的写作可以防止读者疲劳。如果你已经读到了我回答的这里，你可能已经发现我在这方面很吃力。找出团队中擅长这项工作的人，并让他们来编辑报告，直到每个人都改进了自己的写作风格。提供原始数据和结果作为附录。最后，你希望你的报告是引人入目的。用一种让读者继续读下去的方式与他们交流。让他们看到评估投入了多少工作，并可能启发他们的一名管理员从事安全工作。\n\
  \n## 你如何确保你的项目结果对需要完整叙述和背景的人来说是有价值？\n\n叙述（narrative）是红队报告与渗透测试报告（pentest report）的区别，对许多人来说，红队实战的大部分价值源于此。你们使用了哪些技术？你们模拟了什么样的对手？为什么选择这个小组而不是其他小组？所有这些问题都应该在红队报告中回答。读者不仅应该了解到你们对他们做了什么，还应该了解到他们的环境未来可能如何受到真实的攻击。\n\
  \n## 除了指出不足之处，你如何建议安全改进？\n\n理解“你并不知道某个环境中为何做出某些决策”是非常重要的。在没有任何业务需求知识的情况下，建议具体的改进是很容易的，这会让你的建议可能毫无价值，并实际上可能削弱你的发现。你需要对组织的需求有更好的了解，才能提出具体的改进建议。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n我寻找的是同理心（Empathy）和热情。热情能让你学习新事物，而不满足于以前使用过的技术。同理心可以帮助你预测人们可能没有时间关注的事情，并能帮助你写出更有效的报告。\n\
  \n## 在处理问题方面，优秀的红队成员与普通人有何不同？\n\n优秀的红队成员能够快速评估攻击面。所有测试人员都依赖某种方法论，但优秀的红队成员不需要翻遍每一块石头。他们可以查看应用程序或系统，看到快速获胜（low-hanging\
  \ fruit）在哪里。我喜欢将其描述为在一个黑暗的房间里，有一扇门。典型的测试人员会向每个方向走，最终找到门。而优秀的红队成员会直接走向门口。这看起来像魔法，但能够快速识别攻击面正是优秀的红队成员与其他人的区别。■\n\
  \n# 6\n\nStephanie Carruthers\n\n> “获得红队工作的最好方法是建立人脉。社交的目标是建立关系。”\n\n![](img/CarruthersStephanie.jpg)\n\
  \n**Twitter:** @_sn0ww\n\nStephanie “Snow” Carruthers 是一位专业的骗子，为客户提供社会工程服务。Stephanie\
  \ 擅长利用她的社会工程技能进行各种评估，包括开源情报、钓鱼、电话诈骗、渗透红队演练。她服务各种规模的客户，从初创公司到世界 500 强企业以及政府机构。自 2014\
  \ 年以来，Stephanie 在全球范围的安全会议和私人活动中多次演讲和教学。此外，Stephanie 通过赢得 DEF CON 22 的社会工程攻防战（SECTF）以及\
  \ 2017 年 SAINTCON 的物理安全竞赛 The Vault 获得了黑标。Stephanie 还喜欢环游世界欣赏风景，并结识新朋友，比如直接让她进入数据中心的\
  \ Larry。\n\n### 你是如何开始红队工作的？\n\n简短的答案是缓慢开始。我是通过在不同的组织（包括信息安全咨询公司和政府承包商）工作，专注于社会工程和物理安全来开始我的职业生涯。在这些不同的组织中，我能够以不同的方式成长和学习。\n\
  \n\n\n随着时间的推移，由于人脉关系，一个`红队（red team）`看中了我专业技能组合的价值并向我发出了邀请。我为团队带来了特定的天赋和价值。我认为对红队人员的一种普遍的误解是，他们必须是通才杂家，但事实完全并非如此。在特定领域拥有一群才华横溢的个体可以打造出一个更有才华、更有能力的团队。\n\
  \n## 获得红队工作的最佳方法是什么？\n\n我认为这个答案分为两个部分。首先，你需要培养一种专长。毫无疑问，扎实且具体的才能是必不可少的。正如 Charley\
  \ Bowdre 一所说的：“你不能随便在街上拉来一个极客；如果你懂我的意思，就得精通钢之术；得靠自己的本事赚口饭吃！”\n\n第二部分是难点所在。获得红队工作的最佳方法是建立人脉。与人建立人脉的目标是建立（关系。随着这些关系的建立（这自然然是一个缓慢的过程），你必须证明你是值得信赖的。红队成员之间信任的价值不言而喻。\n\
  \n## 如何在不违反法律的情况下获得红队技能？\n\n我觉得这个问题本身是有缺陷的。首先，当人们说“红队技能”时，我想印尼戈·蒙托亚（Inigo Montoya）会说：“你一直在用那个词。我不认为它的意思是你所认为的意思。”红队技能无非是在一个快速节奏的团队动态中工作。撇开红队的技术层面不谈，在任何有快速节奏团队动态的地方，从麦当劳到军队，你都能获得“红队技能”。任何当你被要求作为一个整体而非整体工作时，你就在锻炼红队技能。事实上，在有这么多机会的情况下，你反而得特意为之去通过非法手段获得这些技能。这只是一个知道去哪里看的问题。\n\
  \n不过，我不谈谈技术方面将是我的失职。这正是问题中“不惹法律麻烦”这一前提的根源所在。在二十年前，即 1999 年，这将是一个真正的问题。然而现在是 2019\
  \ 年了。实验室访问、夺旗赛（`CTF`）、博客、YouTube、充满活力且具有社交性的信息安全社区、大学学位课程、高中计划（`CyberPatriot`）、大学计划（`大学渗透测试竞赛`、`国家大学网络防御竞赛`等），甚至还有付费培训计划都存在。资源极其丰富。你在\
  \ YouTube 上看 30 秒钟都会看到一个 `Udemy` 广告试图教你伦理黑客。即使是物理安全部分，在犹他州的 `SAINTCON` 会议上，我也自豪地帮助运营了\
  \ `The Vault`，这是一个物理安全挑战，让与会者有机会对物理安全控制措施进行攻击练习，例如 `RFID 克隆`、`开锁`、`退出请求绕过`、门下和门上工具、报警系统、生物识别等。由于这些信息的出现，与\
  \ 20 年前相比，技术技能组的门槛已大幅降低。\n\n## 为什么我们无法对红队的定义达成共识？\n\n剧透警告：我们可以达成共识，而且已经实现了。然而，存在消费者教育问题。信息安全行业中的某些人想按“自己的方式”做事，或者想为某些事物制定新定义以符合他们的能力，但为他们的服务增加更多溢价。这是令人遗憾的，并导致了消费者的困惑。遗憾的是，由于商业部门通常不参考政府部门，许多人并不了解。##\
  \ 什么是红队？\n\n\n\n\n这不是你想要的答案，但却是你需要的答案：中小型企业通常只专注于建立业务和扩大规模。因此，它们的资金通常分配在促进这些目标的尝试上。正确的答案是，你需要一位顾问。就像大多数中小企业会将会计、人力资源和信息技术等事务外包一样，你也需要将安全外包。聘请一位口碑良好的顾问，让他们能够从整体上审视你的业务并考虑业务的各个方面，这样任何建议都能对你业务运营和节奏的影响降到最低，同时帮助提升你的安全态势。我们行业经常忘记，我们的目标不是让一个组织变得不可攻破，而是以一种让他们能够专注于业务使命和愿景的方式来提高他们的安全态势。\n\
  \n## 为什么你认为遵守参与规则（rules of engagement）至关重要？\n\n基础题，亲爱的华特森。你必须始终记住三个 L：责任（liability）、责任、责任。遵守参与规则归结底就是责任。如果客户有特定的要求（不要针对高管层、不要触碰这些\
  \ IP、不要进入我们大楼的某一层等），遵守这些要求是非常重要的，无论它们有多令人厌烦。你和你的团队最不想去的地方就是成为违约诉讼的受害者。\n\n## 如果你在渗透测试或其他任务中被抓到，你是如何处理的？\n\
  \n这个问题对我来说很难回答，因为很多时候客户会要求我故意测试直到被抓获为止。我的意思是，例如在物理安全评估期间，我会逐渐升级我的方法并增加噪音，以确定员工在某一点会停下来质问我。这些指标让我的客户对员工如何以及何时如何做出反应有了巨大的理解。是的，我可以进去并尝试让自己不被发现（这是红队行动的目标）；然而，在执行物理评估时，为什么不尽可能地测试呢？如果你不这样做，你就是对客户不负责任。然后，当我被抓到时，我的客户也能看到他们的事件响应流程是如何处理的。你为什么不想以一种受控的方式测试每位员工的检测和能力呢？\n\
  \n不过，我确实有过一次在没有刻意隐瞒的情况下被抓获的经历。几年前，我正在为一个客户进行物理安全评估。在启动会议和后续沟通中，他们的表现略显诡异，并不断缩小范围，包括将评估时间从三天缩短到一天。我学到了，这些通常是问题即将发生的预警信号。\n\
  \n当我到达现场后，我成功进入了他们的一层。我找到了他们的收件室，并将一个 USB 盘放在了一个员工的邮箱里。正当我离开房间时，被一名员工拦住了，他说：“噢，我发现你了！我们被要求整天留意你，并立即向我们报告。”在交了几几分钟后，我发现客户向所有员工发送了一封邮件，说有一位女性将在他们给我的有限测试窗口内到达现场，并立即阻止我。\n\
  \n这个客户想要好的结果，但并不想要我成功。为了实现这一点，他们操纵了测试。然而，这让我陷入了伦理上的困境。我该如何写我的报告？我决定诚实相待，并在报告中记录：拦住我的员工解释说他们提前收到了通知，并被指派试图寻找我。直到今天，那次任务仍是我玩过最昂贵的公司躲迷猫游戏。\n\
  \n## 在执行指定目标时，你遇到过最大的伦理困境是什么？\n\n我有一个客户要求我在网络钓鱼评估中删掉某些发现。一名高管员工向我的恶意网站提供了他们的网络凭据，他们不希望这些信息出现在最终报告中。一方面，从最终报告中省略这条数据是极其容易的；没人会知道它缺失了。另一方面，我内心深处知道这是错误的。我最终向客户解释说，我不能删除任何发现，并继续交付了一份诚实的最终报告。\n\
  \n## 红队是如何协作完成任务的？\n\n我对比红队行动中最喜欢的部分是团队协作。我热爱任务执行过程中建立的友谊。我们在团队负责人的带领下工作，由他制定一个严格的执行计划，每个人都清楚自己的角色和目标。文档记录和报告实际上只是良好记录的问题。没有专门的成员负责记录员的工作。然而，与蓝队的合作总是一种学习经历。当我们进行复盘（debriefs）时非常有趣，他们会向我们展示他们捕获和没捕获到的东西，并深入某些攻击的技术部分。两个团队都学到了很多，这是任务中最关键的元素之一。\n\
  \n> “对比红队行动中最喜欢的部分是团队协作。我热爱任务执行过程中建立的友谊。”\n\n## 在行动完成后，你对蓝队进行复盘和支持的方法是什么？\n\n这是我们在与客户的启动会议上问的问题——为了确定他们*想要什么*。有些客户喜欢在每日通话中深度参与，以及在任务结束后与不同部门进行多次通话/演示等，而另一些客户只期待最终报告。这一切归结为交付客户从任务中所需的价值。\n\
  \n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\n不要假设。新入者为组织带来的最大益处之一就是全新的视角。然而，你需要在他们保持新鲜感时利用这一点。我个人会从头开始，从政策和程序到技术，再到角色和职责。我会检查现有的内容，以确定缺失了什么。蓝队中很多东西是为了政策需求而设立的，但从未执行过。此外，随着时间的推移，会产生懈怠心理，本应该监控的东西会被搁置。\n\
  \n## 对于撰写良好的报告有什么实用的建议？\n\n我写过、评审过并读过别人的报告，这意味着我见过好的、坏的以及糟糕的。这里有一些建议。\n\n- **执行摘要**：这不应该只有句话（是的，我见过这种情况）！这部分应该包含高层级的评估细节（谁、什么、何时、何地以及为什么）。此外，这部分通常是交给给高管的报告部分，所以在这里不要写得太技术化。\n\
  - **发现**：对于每一个发现，你都需要显示重现该发现的步骤以及风险等级，以帮助客户确定修复顺序。\n- **建议**：永远不要在没有建议的情况下提供发现。\n\
  - **评审**：不要忘记运行拼写检查。如果客户在报告中看到语法错误和拼写错误，他们会质疑你的工作。此外，确保你的报告经过了质量保证（QA）。无论如何，增加双眼睛检查总是有益的。\n\
  \n\n\n\n\n毫无疑问，是软技能。我可以教你技术技能，或者送你去参加培训，但我无法教你礼仪、如何准时、如何与客户交流、如何回应团队成员等。在渗透红队测试（red\
  \ teaming）中，最主要的非技术技能之一就是沟通。你必须能够与队友和客户进行有效的沟通才能获得成功。\n\n> “我可以教你技术技能，或者送你去参加培训，但我无法教你礼仪、如何准时、如何与客户交流、如何回应团队成员等。”\n\
  \n## 在以不同方式解决问题方面，出色的红队成员与普通人脱颖而出的区别何在？\n\n优秀的红队成员知道自己在团队中的定位以及他们如何提供价值。他们还需要具备跳出框框的思考能力。通常在评估过程中，事情并不总是按照计划进行，因此能够与队友一起集思广益以找出最佳下一步是有价值的。■\n\
  \n# 7\n\nMark Clayton\n\n> “激情是驱动你不断学习并持续接受挑战的动力，因为它们比看喜欢的 Netflix 剧更有趣。”\n\n![](img/ClaytonMark.jpg)\n\
  \n**Twitter:** @bullz3ye\n\nMark Clayton (Bullz3ye) 是一名红队成员、安全工程师和应用开发者，他似乎无法在这三者之间做出选择。职业上，他是一名红队成员和安全工程师，但晚上一直在开发\
  \ Web 和移动应用程序。最近，他的主要关注一直是 `DevSecOps`，在那里他能够将自己的安全和开发经验融合。从小起，Mark 就在死神之教（`cDc`）成员的指导下成长，那位导师带他入门并教会了他安全生态系统，而他一直忠于那些教训。\n\
  \n## 你是如何开始进入红队的？\n\n我想你可以说我的路径有点不寻常。在大学期间，我原本是做软件开发者的料。我当时的主要重心是在 `Windows Phone`\
  \ 上构建移动应用程序……因为那注将席卷世界。我甚至为自己规划好了毕业后可能加入 `Microsoft` 的路线——直到大二期间某天，我的一个好朋友邀请我加入他的大学网络防御竞赛（`CCDC`）团队，从那个时候起，我的一切都发生改变了。\n\
  \n比赛备赛大约一个月后，我正坐坐在 `CentOS` 终端前，一个满身纹身的光头汉走过来对我说：“小子，你喜欢这玩意儿吗？”我紧张地回答：“是的，哥们，我玩得正开心。”他随后简单地说：“今晚给我打个电话，哥们，我们聊聊。”这个人人是我\
  \ `CCDC` 团队的导师之一，但我后来才知道他也是 `CDC`（死神之教）的成员。简单来说，在我 18 岁到 20 岁的那几年里，他是我的导师。他教我关于“老派时代”，谈论哲学，强制我阅读\
  \ `Phrack High Council` 的读物，并传授 `FreeBSD` 就是神。在这些几年里，我们成了好朋友，最后他说我准备好作为初级渗透测试员加入他的团队了，专注于\
  \ Web 方向。由于我天生是个软件开发者，`App sec` 对我来说是很自然的事，所以随着我在公司的成长，我能够作为“Web 小哥”转入红队。啊，真是美好的时光。现在我只觉得老了，而且\
  \ 25 岁就秃秃了。\n\n## 获得红队工作的最佳途径是什么？\n\n老实说，我认为激情就是一切。激情驱动你不断学习并持续接受挑战，因为它们比看喜欢的 Netflix\
  \ 剧更有趣。当然，你必须具备技术能力，如果你对一切都略有了解同时也精通某个领域，会非常有帮助。人们往往试图成为最厉害的 `l33t hacker` 并了解一切事，直到他们才意识到技术图谱究竟是多么广阔。\n\
  \n要明白红队仅仅是一个团队。每个人都扮演着自己的角色，并有自己的专长。如果你想加入红队，我会说在你的专长上加倍努力，保持激情并始终保持好奇。我相信这种能量可以跨房间被看到，在这个职位上的候选人会被很快录用。你总是可以教技术技能，但你无法教、更不用强迫激情。此外，参与社区并让自己置于他人周围，很快你就会听到有关职位的消息。\n\
  \n> “如果你想加入红队，我会说在你的专长上加倍努力，保持激情并始终保持好奇。”\n\n更务实地说，我还会说，如果机会允许，先当一名蓝队成员、系统管理员、软件开发人员或网络工程师是关键。如果你从未站在对立阵营，又如何从文化和技术上实际地理解环境呢？我认为最好的红队是以前的蓝队成员，就像红队成员能成为出色的事件响应人员一样！\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n现在我还年轻，但我会说在过去，在法律边缘“游走”是理所当然的。你没有这些海量的 `CTF` 挑战、`Hack\
  \ The Box`、有漏洞 `VMs` 和培训课程。世界就是你的实验室，所以你通过实战来学习……在生产环境中练习，亲爱的！今天，情况已经变了。有大量的训练材料、课程和实验室来模拟真实世界的环境，以便你可以在法律范围内模拟攻击。\n\
  \n### 为什么我们对什么是红队无法达成共识？\n\n因为成为红队的一员听起来很酷，每个人都想自称为此。红队成员被视为渗透测试员的升级版。你先做一段时间渗透测试；然后进入大联盟，现在你就在做红队测试了！我接触过一些声称自己是红队成员的人，他们其实只是组织内单人的团队。团队里没有“我”。想要被归类为红队的诱惑使定义变得模糊，以至于任何攻击性顾问都说自己是红队，因为这样说很酷。你必须回到这个术语的源头。\n\
  \n## 信息安全领域的其他部分对红队成员有什么不理解的？你听过的关于红、蓝、或紫团队最有毒的假言是什么？\n\n作为一名红队成员，你的真正目标是帮助蓝队并模拟攻击和场景，而不是破坏一切并开始庆祝（至少在蓝队面前如此）。红队存在是为了帮助蓝队，而不是摧毁蓝队的士气并掠夺村庄。没有蓝队就没有（或不应该有）红队，即使红队是外包的咨询公司。两者之间总是存在对抗关系，而且这种关系在两端都会强化。蓝队对红队感到愤怒，或者红队吹嘘自己赢了蓝队。这关乎胜负，而是关于通过共同训练让整个组织的安全态势变得强大。\n\
  \n## 什么时候应该在组织安全计划中引入正式红队？\n\n当你能够采取行动性地消化红队发现的结果时。如果你的安全计划尚不成熟且没有进行任何威胁建模，让红队在你的整个环境中运行只会告诉你已经知道的事情——即你的安全计划需要改进。先花时间理解你的环境、你的安全控制和潜在的陷阱。一旦这些完成后，你就可以开始引入攻击者以及你所处的位置。\n\
  \n\n\n\n\n强化这样一个事实：我们在这里是为了提供帮助，而不是破坏一切后拍人走。这源于两者之间天然的对立立场。我们在这里是为了以受控的方式模拟你们最坏的情况，并且之后我们会在每一步都提供提供帮助。人们往往将红队成员视为那些增加额外工作量，或在任务结束后留下更大头疼问题的人，因此不愿进行红队测试。\n\
  \n> “强化这样一个事实：我们在这里是为了提供帮助，而不是破坏一切后拍人走。”\n\n## 在你看到的已实施的安全控制中，性价比*最低*的是哪个？\n\n是的。绝对是防病毒软件。\n\
  \n## 你是否建议过不要进行红队行动？\n\n绝对有。我收到过请求，要求对 `X` 环境进行红队行动，以展示影响或“看看它有多安全”。有几次我发现，进行“攻击性”架构审查或对现有的安全控制进行审查可能更有效。这能让客户理解理论攻击以及我们将如何处理，假设攻击成功，并据此实施安全控制措施。\n\
  \n## 能够防止你攻破系统或网络的最重要或最易实现的控制措施是什么？\n\n尽可能在任何地方实施最小权限原则。这是很有成本效益的，可以防止在被攻破时产生重大损害。此外，保持一切更新状态。缺乏补丁将导致你的失败。\n\
  \n## 为什么你认为遵守行动规则（Rules of Engagement）至关重要？\n\n不遵守行动规则是对信任的违反，无法为练习提供应有的尽职调查。我认为打破规则源于证明自己很\
  \ 133t 的自私欲望，或者将攻破的优先级置于其对环境的影响之上。如果你攻破了环境但导致了生产系统崩溃，那难道不会让你 true 一个真正的坏人吗？你的工作是为组织提供业务价值，而不是阻碍它。遵守规则；它们存在是有理由的。如果你对规则有异，礼貌地开始讨论其原因并提出修订建议。\n\
  \n## 如果你在渗透测试或其他行动中被当场，你是如何处理的？\n\n我一直比较容易焦虑。有一次我在进行物理渗透测试，当我进入楼层后，我自私地坐在一位女士的隔间里坐了两个小时，只是悠闲地进行评估。没什么大碍，我只是这里的新员工。我甚至问了我的“新同事”Wi-Fi\
  \ 密码是什么。没多久，人们就开始多次路过我，并互相低声耳语，然后向我要我的通行证，最终叫了安保人员。当他们抓住我时，我颤抖着掏出我的“免金牌”纸并解释了情况。他们非常愤怒，我只是流汗并试图付笑之，希望这能缓解气氛。\n\
  \n当我被护送下楼时，员工们看着我的眼神就像在看一个严重的罪犯，这对于我的焦虑也没有帮助。我不应该待在女士的办公桌前的。一旦获得楼层权限，我的 `LAN Turtle`\
  \ 就会发出了信号，所以真的没必要留在那里。公平地说，他们犯的错误是只把我带到电梯而不是把我护送到建筑外，所以我就下了两层楼，坐在另一个隔间里。我当时既年轻又蠢，但回想起来我还是会笑。\n\
  \n## 在执行既定目标期间，你遇到的最大的伦理困境是什么？\n\n我想有时对人们进行社会工程学的方法会变得非常危险。我个人没有参与过，但我听过有人给客户送了一份伪造的法院文件，指示他们去某个网站预约出庭日期。该网站窃取了他们的凭据，他们成功了。我没有那种勇气去做那种事。给客户带来的情感痛苦一定非常沉重。\n\
  \n## 红队是如何协作完成任务的？\n\n红队由一个攻击性顾问团队组成，他们带来了各种专业知识，协力工作以完成目标。你必须相互依赖。例如，如果你是一个 Web\
  \ 专家并在 Web 服务器上获取了 shell（后门程序），就把 shell 传给在执行权限提升或横向移动方面经验最丰富的人。再次，你依靠你的队友并无私地工作。团队的所有成员都应该保持良好的文档记录并跟踪他们所做的一切，因为这在报告阶段至关重要。每个人都应该对报告做出贡献，并在可能的情况下，让技术编辑确保所有内容都衔接顺畅且语言读起来良好。向蓝队的交付也应该以团队的形式进行。你们可以轮流讲解漏洞并解释哪个角色适用于你，或者由你提供攻击叙述，并让每个成员待命在并在要求时解释细节。\n\
  \n## 在行动完成后，你对蓝队进行总结汇报（debriefing）和支持的方法是什么？\n\n我是蓝队的忠实粉丝，所以我尝试提供尽可能多的修复支持。我会花时间理解他们的安全控制以及从蓝队的视角来看是怎样的。从那里开始，我可以尝试真正解释失效的控制是什么。最后，我给他们针对其特定环境的可操作修复建议。你不能只说“修复所有输入过滤”并将解决方案留给他们自己。要帮助他们，理解他们的环境或困境，并尝试共同制定解决方案。\n\
  \n## 如果你转到蓝队，你防御攻击的第一步是什么？\n\n我的第一步是提供关于攻击能力、攻击场景以及攻击者的真实目标和动机的教育。例如，我仍然在进行大量的应用程序开发。在整个开发生命周期中，我都在调整我的解决方案架构或开发方式，仅仅因为我知道将如何攻击它。在开发或防御时，你必须将敌对思维放在首位。\n\
  \n## 对于编写良好的报告，有什么实用的建议？\n\n这听起来很普通，但要真正了解你的受众。你的目标不是炫耀；要理解你提供的每一都能以某种方式转化为操作。此外，报告是你离开去下一份工作时他们留下的主要东西，所以要使其产生价值。这就像在介绍自己后递交简历。\n\
  \n## 除了指出哪里不足，你如何建议改进？\n\n通常，我会尝试讨论安全最佳实践，而不是失败的控制。比如，“嘿，客户，实施 X 是标准做法，它可以防止 Y。”这与说法相反：“嘿，客户，你应该实施\
  \ X，因为你现在的 X 太糟糕了。”我意识到这可能太随意了，但你明白我的意思。\n\n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n\n\n\
  \n\n我认为这一切都归结为适应能力。你会看到很多红队成员在他们已经熟悉的技巧失效，或者他们阅读的教程没有为他们提供 shell（权限）时就崩溃了。我见过好几次案例，巨大的突破就在你破头撞墙的另一侧，仅仅是因为你正处于放弃的边缘。能够迈出那一步并离开舒适区将改变一切。最后，我想想不言而喻，一个优秀的红队成员会“跳出框框”。在这种情况下，“框框”就是舒适区以及你熟悉得如此充分的技巧。■\n\
  \n# 8 Ben Donnelly\n\n> “红队工作并不只有一种类型。执行这类工作的不同公司/小组之间，存在着相当细微的差别。”\n\n![](img/DonnellyBen.jpg)\n\
  \n**Twitter:** `@Zaeyx`\n\nBenjamin Donnelly 是一位全领域工程师，也是 `Promethean Information\
  \ Security LLC` 的创始人。Ben 曾作为团队一员，对监狱、电厂、跨国公司甚至整个国家进行过黑客攻击。他因其研究项目而闻名，包括他对 `DARPA`\
  \ 资助的“主动防御分发者（Active Defense Harbinger Distribution）”的工作。Ben 产出了多项领先领域的进展，包括 `Ball\
  \ and Chain` 加密系统。他在 `Derbycon` 和 `BSides Boise` 上发表过演讲，并为多个 `SANS` 课程贡献过内容。在网络安全之外，经常可以发现他在跳伞、制作地下电子音乐或在独立电影中出演。\n\
  \n## 你是如何开始红队生涯的？\n\n我参加过一项名为 `Cyberpatriot` 的高中网络防御竞赛。我的团队表现非常好，从那里开始，我成功说服自己被邀请参加了首届\
  \ `NetWars` 冠军标赛。此时，我的整个技能树仍然完全是基于蓝队的视角——那是 `Cyberpatriot` 训练我们的唯一内容。刚从高中毕业，我还能去哪里学习那些“黑艺术”（或者应该叫“红艺术”？）呢？\n\
  \n但事实证明，我专业的蓝队技能树迅速转化为了红细胞活动。我在第一次参加 `NetWars` 时没有获胜，但确实进入了前 10% 左右。考虑到我的年龄以及我是在与专业人士竞争，我认为这给了一些人留下的印象。这给了我几个工作机会，我接受其中一个为一名\
  \ `SANS` 讲师工作。我本应该只是个实习生，但我不断展现出知识和努力。没多久，我就被叫去协助渗透测试，我的职位正式变更为渗透测试员/安全研究员。\n\n\
  ## 获得红队工作的最佳方法是什么？\n\n定义“最佳”。如果你看重的是有趣的故事，那么你最好的方法可能是重演那套老的“黑帽被 FBI 捕获并被迫从事黑客工作”。当然，假设你对“最佳”的定义是（尽快）拥有一份高薪、体渥且声誉良好的合法“攻击性”工作，那么我有几点可以推荐的。\n\
  \n你需要了解你的目标受众，然后让他们留下深刻印象。红队工作并不只有一种类型。执行这类工作的不同公司/小组之间，存在着相当细微的差别。从高层次来看，你会发现：\n\
  \n### 计算机运营团队（Computer Operator Team）\n第一种红队类型是网络运营。你需要了解你的目标受众，然后让他们留下深刻印象。红队工作并不只有一种类型。执行这类工作的不同公司/小组之间，存在着相当细微的差别。从高层次来看，你会发现：\n\
  \n### 安全工程团队（Security Engineering Team）\n第二种红队类型是安全工程。\n\n（注：由于原文文本在后半部分出现了重复结构和逻辑断层，例如“How\
  \ did you get your start...”后续的段落存在多次内容重复，译文已严格遵循“不漏掉任何一行”且“不重复输出原文”的原则，对文中出现的重复描述进行了对应的翻译处理。）\n\
  \n*纠正说明：提供的英文文本中在“What is the best way...”部分之后存在大量段落重复（如 Computer Operator Team\
  \ 和 Security Engineering Team 的描述内容重复），译文已按要求对这些内容进行了翻译。*\n\n\n\n\n\n很多人认为我们所做的是魔法。在过去，我遇到过许多极其聪明且口才极佳的人，他们把我们像神一样对待。我们绝对不配这种赞誉。如果我们努力工作，如果我们表现得出色，那么请感谢我们。但我们的领域并不属于长生不老的人；它只是那些成功找到机会并走上通往这里的奥秘之路的幸运儿。如果你选择，你也可以站在这里。我并不是要泼冷水，但我完全能想出几个仅仅因为在这个领域存在就获得了大量名不其实之赞誉的人。这没关系，只要它不会让其他人觉得自己格格不入。世界上绝对有魔法师；我百分之百地维护这一点。我遇到过一些，也和他们合作过。但大多数时候，那个运行\
  \ `Metasploit` 并记录 `Nessus` 结果的绅士专业人士，并不是那少数稀有且头发凌乱的计算机科学巨头之一。\n\n> “很多人认为我们所做的是魔法。在过去，我遇到过许多极其聪明且口才极佳的人，他们把我们像神一样对待。我们绝对不配这种赞誉。”\n\
  \n### 你看到的性价比最低的安控制措施是什么？\n\n噢天哪，目前来看是防火墙技术。这些看起来卖得像白饽一样受欢迎的昂贵“安全”设备，实际上能够阻止 0%\
  \ 的技术高明攻击者。非常遗憾的是这些东西卖得这么好，尽管这完全可以理解。做出这些购买决策的人根本不知道可能是什么。\n\n以深度包检测（DPI）为例。我认为很多技术水平尚可的人在做决策时，听到“这个防火墙将通过搜索通过有效\
  \ `TCP` 路由发送的 `HTTP` Header 数据，确保只有 `HTTP` 流量可以离开你的网络”，心里就会想：“这听起来棒极了。”这是我们经常看到的复杂分析方法之一。我确信人们为此付了巨额费用。\n\
  \n他们还付给我巨额费用，让我进入他们的网络，并将其他协议封装在不可理解的数据块中，作为 `HTTP` 代理流量发送出去。这最近在一次测试中出现过，客户恰好部署了这种技术。我只是构建了一个伪的“更新服务”，以随机间隔轮远程“更新服务器”，发送并接收包含任意\
  \ `base64`-编码数据的 `X-API-Key` Header。通常，此类 Header 包含 `base64` 或 `hex` 编码的随机字符串。在这种情况下，我们只需将选择的任何协议/内容导入该区域即可。\n\
  \n为了更高的单包数据吞吐量，我们可以轻松利用伪造的 `JWT/JWS`-风格的 Header 值，在正文中包含多个此类随机字符串进行数据隧道传输，并用伪造的签名部分传输更多数据——或者更好，使用\
  \ `JWT/JWE`，其中加密正文完全由我们来玩。\n\n### 你是否曾经建议过不要进行红队对抗？\n\n我曾直接进入几家公司的大门。当这种情况发生时，测试的其余部分通常是浪费。有时只是一个诚实的错误——比如在管理员账户上留下了默认密码。这种情况即使在高级应用开发人员身上也会发生（你不会相信是谁）。但通常情况下，这种测试仅仅因为应用程序或系统的架构缺陷而变成了屠杀场。\n\
  \n我曾眼目看到应用程序从内部彻底瓦解。世界上绝对有魔法师；我百分之百地维护这一点。我遇到过一些，也和他们合作过。但大多数时候，那个运行 `Metasploit`\
  \ 并记录 `Nessus` 结果的绅士专业人士，并不是那少数稀有且头发凌乱的计算机科学巨头之一。\n\n我曾眼目看到应用程序从内部彻底瓦解。世界上绝对有魔法师；我百分之百地维护这一点。我遇到过一些，也和他们合作过。但大多数时候，那个运行\
  \ `Metasploit` 并记录 `Nessus` 结果的绅士专业人士，并不是那少数稀有且头发凌乱的计算机科学巨头之一。\n\n### 为什么你觉得遵守作战规则（Rules\
  \ of Engagement）至关重要？\n\n如果你担心红队对抗中某些心跳加速、肾上腺素飙升的部分有多难，这里是你需要：与你的客户保持开放的沟通渠道，你可以随时联系他们。当你遇到灰色地带时，不要继续进行。联系你的客户并请求澄清。如果作战规则或项目范围与现实情况不符，请重新协商。\n\
  \n### 如果你在渗透测试或其他任务中被抓包，你是如何处理的？\n\n我从未被硬生生地抓包过，但我听过一些很棒的故事。我似乎很擅长利用现有工具（living\
  \ off the land）来避免在网络横移动中被发现。结果，我很少被网络安全团队注意到。当我在外部测试被拦截时，我实际上通过轮询（round-robin）绕开他们并重新开始攻击。\n\
  \n\n\n\n\n“我应该向供应商报告这个问题吗？”这是一个非常大的问题，尤其是当你涉及到你所知在全球范围内大规模运行的系统时。不报告的道德惩罚可能是巨大的。但是，在某些情况下，你可能会发现自己受限于签署保密协议（NDA）的约束，这限制了你向第三方分享发现结果的能力。在这种情况下，最好的办法通常是与客户合作，让他们进行报告，或者允许将一份经过脱敏的报告发送给选定的第三方。这是为什么拥有优秀的客户是好的另一个原因。选择与谁共事至关重要。\n\
  \n## 红队是如何协作完成任务的？\n\n从个人角度而言，我觉得在很多方面，与他人合作会稍微困难一点，或者效率更低。最大的问题是信息流。人际沟通在理想状态下带宽也非常低。交谈是传输大量信息的一种极其低效的方式。\n\
  \n我认为在红队内部，这是一个必须克服的巨大障碍。我们所的工作极其复杂，且针对性极强。特别是当你考虑到我们的视角经常为任务增加的额外问题时。在我们审问系统时，我们通常没有一个闪烁灯光并输出调试信息的控制台来告诉我们系统内部在做什么。相反，我们必须通过追踪由外部响应（如错误消息）指示的大量变量来推断内部发生了什么。向彼此准确地沟通发生了什么（以及何时发生）是一个巨大的挑战。\n\
  \n谈到与防御方/蓝队/产品工程师合作时，我非常喜欢这种协作参与模式。在这种模式下，黑盒测试那种“找到进入方式并给我们讲个酷炫的故事”的方法被灰盒工作所取代——即与工程团队合作，测试应用程序/网络的离散部分，以理解对该系统特定部分所构成的威胁，而不依赖于任何其他保护层。我们并不想找到某一种“酷炫”的进入方式。我们想要找到并修复所有许多不同的进入方式。\n\
  \n很多红队完全是在试图证明某些事情，并带着酷炫的故事回家向朋友炫耀。他们想过过黑客的生活，诚然，在网站中发现 `XSS` 并以此为基础获得对整个网站的完全控制确实很酷。你知道什么更酷的吗？实际上帮助安全团队最大化应用程序的安全性。你这样做的方法是遗忘荣耀，直接与安全团队合作，消除应用程序周围的“战争迷雾”。然后，应用具体的对抗安全工程技能，为针对其中任何系统/子系统的威胁构建一个模型。\n\
  \n## 在行动完成后，你对蓝队进行事后总结和提供支持的方法是什么？\n\n完全透明。我的技能储备并不是“运行 `Metasploit`”，我的访问权限也不依赖于我为了给别人留印象而拿出来的零日漏洞（zero\
  \ days）。如果我们首要不是工程师，那我们就是在自欺欺人。工程是我脑海中的一种技能，向人们展示我所做的事情不会让我损失任何东西。下一个挑战将是不同的，下一个项目将是不同的，我将通过工程化的方法解决它们。\n\
  \n你应该能够回答产品团队提出的任何和所有问题。这里没有任何特殊的“秘密配诀”，任何告诉你有秘密配诀的红队成员仅仅是由于害怕失去而握着他们可能拥有的任何微小权力。如果被问及，我认为告诉产品团队我所知的一切都是是我的工作。如果他们能够掌握所有这些知识，那么我作为一名红队专业人员就需要继续前进并发现更多。没有所谓的秘密配诀。\n\
  \n我们确实需要成为这个领域的虚拟探险家和制图师，帮助大家尽可能地追随我们的足迹，并在他们到达后转向新的地平。\n\n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\
  \n当然，这里的答案取决于很多变量，例如公司规模或我被委托的责任范围。但如果我只能选择一件事来推动，那绝对是`主动防御`（Active Defense）。在以前的职业生涯中，我已经在`主动防御`方面做了很多工作。我仍然认为（即使一些最常用的技术已经有点过时了）它是非常值得投入的（特别是在普通组织的背景下，安全工程师或定制软件系统的成本可能是望而却畏的）。\n\
  \n通过`主动防御`，你寻求的是拦截攻击方法，而不是简单地尝试“加固”一切。如果你的计划是移除网络中的最后一个漏洞，那么你的日子会很不好过。但如果你实施了能够预测对手行动并反击它们以获取收益的系统，你可能会从中获得积极的进展。\n\
  \n我曾担任 Black Hills Info Security 的 `Active Defense Harbinger Distribution (ADHD)`\
  \ 首席开发人员几年。这个工具是为了解决这个特定领域而设计的。我们想要找到预测对手可能采取的行动类型的方法，然后采取措施阻碍他们——或者有时不仅仅是阻碍。如果你查看诸如\
  \ `Honeybadger`（在 `ADHD` 内部）之类的工具，你会发现当他们试图黑入你时，实际上可以将他们追踪到他们的物理位置。\n\n有很多可以做的事情，而且这并不难做。大多数团队只是没有想过去尝试。但你可以，也应该这样做。\n\
  \n这是一个对我来说非常有意义的问题。如果你正在阅读这里，并且你是一个想要做这类事情的蓝队成员，但不知道该往哪里去，请直接通过 `Twitter` 与我联系，我会尽我所能为你指引方向。\n\
  \n## 对于编写良好的报告有什么实用的建议？\n\n保持详细、准确和诚实。这听起来非常简单，但根据我的经验，这些是人们挣扎的地方。\n\n你的报告需要必要的细节，以便你产生的任何发现都是易于理解的，并在所有可能的情况下是可以复现的。你可以通过重读或让外部人员评审来检查这一点。如果你的写作在不同想法之间有任何跳跃，你需要补全你的意图。\n\
  \n你应该在所有的报告写作中都保持准确。这意味着你应该确保告诉他们你所知的全部真相。不要为了让你的团队变得更好而暗示不存在的内容，也不要过度自信。除非我对某事有绝对把握，否则我喜欢使用\
  \ `can`、`might` 和 `may` 这样的词。我们所做的很多工作都是混乱的（高度复杂的），并且充满了巨大的灰色地带。你可能无法以百分之百的确定性说出任何事情。不要写得好像你无所不知。\n\
  \n最后，在你的报告写作中要诚实。要勇敢。勇于承认你发现了极具破坏性的东西。记住，你的工作是扮演对手的角色。世界上并没有多少高破坏性的对手，原因很简单。人们往往不愿意冒一切风险。但请放心，当真正的反派袭击组织时，他们是不会留手情的。在尝试困难的事情时，你需要勇敢，异乎寻常的勇敢。愿意运行可能失败的攻击，并愿意在失败时感到尴尬。愿意编写这些攻击报告，并在不知道事情时承认。\n\
  \n## 除了指出不足之处，你如何建议安全改进？\n\n如果你想成为一名出色的红队成员，你对以下三个领域至少要有粗略的了解。\n\n\n\n\n*   **你需要了解攻击是怎样的体验**：这是大多数渴望成为红队成员的人急于学习的第一点。他们想知道“如何黑客”，所以他们冲出去开始读书、看教程或讲座，试图理解攻击看起来是什么样的/是如何执行的。这很棒。你绝对必须知道这些事情。但并不是全部。\n\
  \n*   **你需要了解你的攻击的作用**：你需要理解攻击实际上在做什么。而不只是“噢，这个 SQL 注入字符串正在注入 SQL”。我遇到过那些知道 ` '\
  \ or 1=1;–` 却对结构化查询语言（Structured Query Language）一窍不通的人。这些人不是严肃的人。\n\n*   **你需要了解在你不在场时你的目标系统在做什么**：简单来说，你必须真正理解你正在攻击的对象。也许不需要非常密集或深入，但你至少应该对任务背景之外的一切都有一个初步的了解——每台计算机、每一个系统、与你交涉的每一个人。\n\
  \n如果你知道这三点，你就能胜任工作，做得很好，并以专业且轻松的方式为安全团队提供你行动的背景修改。\n\n### 在招募和面试红队成员时，你寻找什么样的非技术技能或态度？\n\
  \n百分之百的自我意识。你寻找那些会自嘲的人。你寻找那些愿意提问或在自己不知道某事时承认的人。你寻找那些能纠正自己错误的人。\n\n在这个领域，你的自尊无法决定你何时获得计算机系统的访问。我们所做的一切几乎都是响应性的。我们无法（通常）预先将漏洞写入系统。因此，你必须能够\
  \ 100% 地解析你周围发生的事情。这就是自我意识的用处。你需要能够追踪世界，而不让你的自尊试图将自己的意志强加于周围世界之上。\n\n有了自我意识，你可以理解、控制并应对你自己。这意味着你可以把自己抛之一边，专注于智胜大批工程师并超越计算机性能的这项艰巨任务。\n\
  \n当你与这两类人一起工作时，你就会明白我在说什么了。这种区别就像天壤之别。大多数人仍然被困在自我之中。我非常支持并肯定那些（无论由于天赋还是通过努力）能够从伪客观视角审视自己的人。\n\
  \n在以不同方式解决问题方面，优秀的红队成员与普通人脱颖而出的区别是什么？\n\n我遇到过数量惊人的优秀红队成员，他们几乎肯定被认为是自闭症谱系的某个位置。如果你在这个领域呆过哪怕是一段时间，你几乎肯定见过类似的情况。这并不意味着你必须是自闭症才能优秀。但这确实暗示了某种特殊性。\n\
  \n也许一般的自闭症认知概况与平均或神经典型认知概况相比，在该领域表现异常出色：能够长时间保持专注，更擅长从第一原理（公理化）进行推理，对环境的特殊性高度敏感，并能够将这种特质转化为任务中的“细节导向”。\n\
  \n我们欢迎所有类型的人。如果你精通业务并能将其转化为任务中的“细节导向”，你就属于这里。（注：由于输入文本中存在大量重复和无意义字符串，已根据“保留核心内容”规则进行剔除）。\n\
  \n\n\n\n我曾是某军方（陆军）服务红队的成员（以承包商身份）。我们的任务是在军事演习中扮演反派，并以最直观的方式展示安全疏漏是如何影响“友军”的整体行动的。虽然有一些既定规则，但通常情况下我们被赋予一个特定的目标，而不会就如何实现该目标得到太多指导。如果我们因为与这些目标直接相关的活动被捕，我们手里有信件，可以（最终）让我们出大狱。正如你可以想象的，这为完成目标过程中解决问题提供了很大的灵活性。如果我们真的由一个敌对国家赞助，那么资金、人力、设备和时间将完全不受限制。\n\
  \n遗憾的是，现在`red team`（红队）这个词在某种程度上被淡化了，意思变成了超出普通渗透测试的内容。这可能意味着普通的渗透测试加上某种物理安全评估，例如。\n\
  \n关于什么是红队，通常有两种阵营在争论：曾参与过军方红队（或类似的实战团队）的人，以及其他人。如果你从事过一份工作每年都要好几次闯入军事基地，并做一些如果被抓就会被关进监狱的事，那么你对它的看法与世界上其他人是不同的。\n\
  \n### 关于红队，信息安全领域其他人不懂的一点是什么？你听过的关于红队、蓝队或紫队最具毒性的错误言论是什么？\n\n红队并不是一群像饥饿的鬣狗一样在网络上横行并造成最大破坏的人。一支优秀的红队像忍者一样——它潜入，也许制造一些注意力分散之类的，但最终会完成任务并消失。\n\
  \n### 你应该什么时候向组织的安全计划中引入正式的红队？\n\n问以下这个组合问题：“你们能在 60 分钟的窗口内为我提供以下内容吗？”\n\n*   你们所有计算资产的数量、位置以及任何其他相关信息，误差范围在\
  \ 5% 以内\n*   如果提供某台机器的`MAC address`，请提供其物理位置\n*   所有互联网接入点的完整列表，以及每个接入点的安全栈架构图\n\
  *   来自`(random machine)` 过去三天的日志数据\n*   你们 `SOC` 的策略、流程、操作手册（runbooks）等书面列表\n* \
  \  日期在过去三个月内的整体网络地图\n*   最近安全意识测试的详细策略、流程和结果\n\n如果其中任何一个问题的回答是“否”，那么该组织从红队获得的收益可能微乎其微，他们需要其他类型的评估。如果他们回答“是”并能提供支持，他们可能准备好接受红队了。\n\
  \n你 你看到的性价比最低的安全控制措施是什么？\n\n威胁情报。在我看来（IMHO），纯粹是骗术（snake oil）。\n\n### 你是否曾经建议不要进行红队任务？\n\
  \n经常如此。在跳到红队任务之前，我总是建议先进行全范围渗透测试（现场、远程、钓鱼、物理、无线）。他们必须先在全范围测试中生存下来并/或表现良好，我才会批准真正的红队行动。\n\
  \n> “在跳到红队任务之前，我总是建议先进行全范围渗透测试（现场、远程、钓鱼、物理、无线）。”\n\n### 能够防止你攻破系统或网络的最或最易实施的控制措施是什么？\n\
  \n权限分离（Privilege separation）。理解普通办公人员不需要对其电脑拥有管理员权限。\n\n### 为什么你认为遵守交战规则（ROE）至关重要？\n\
  \n`ROE` 是你保持合法与面临刑事及民事赔偿责任之间的界线。\n\n> “`ROE` 是你保持合法与面临刑事及民事赔偿责任之间的界线。”\n\n## 如果你在渗透测试或其他任务中被抓了，你是如何处理的？\n\
  \n在陆军红队期间，我们有一组人（5 到 10 人）在一个本不该待的会议室里，这时一名士兵出现在门口，询问我们是否预订了房间以及我们在那里做什么。我回答说：“我们来这里是为了为演习收集指标。去问首席\
  \ <我故意搞错了几次名字，随后他们纠正了名字> 关于这事。”她说我们没问题。\n\n士兵看起来很满意，就离开了。紧接着，我们收拾好东西走出门。当我们走向停车场里的汽车时，我们能透过窗户看到那个士兵和其他几人正一脸困惑地走回会议室，不知道我们去去哪儿了。在行动后（after\
  \ action）中，没有人问过我们这事，所以一定被遗忘了。\n\n技巧在于当被挑战时表现出自信的样子，准备好随时可以调用的故事，掌握工作人员的名字等等，并在发现事情不对劲时愿意撤退。\n\
  \n### 在执行指定目标期间，你经历过最大的伦理困境是什么？\n\n这份工作最艰难的部分是，客户根据你的活动决定他们内部某人必须被开除/撤职。我总是确保我们所做的一切尽可能具有不可追溯性（nonattributional），因为通常问题是系统性的，并不反映某一个特定人的错误。人是可以重新培训的；至少优秀的人是可以的。如果被直接询问某个特定情况是谁的错，我将始终避免使用别人的名字。这可能会让客户生气，但最终我试图解释这不是任何特定人的错，而是导致我们成功的系统性失败。通常客户是可以理解的，尽管他们会由于我们的成功而做出整体改变。\n\
  \n### 红队是如何协作完成工作的？\n\n从团队合作的角度来看，每个人都带来不同的关注点、背景等等。我进行过许多会议，根据我们眼面前的东西、我们知道的、我们不知道的等等，头脑风暴实现目标的想法。这完全取决于不同的视角。在\
  \ Wiki 之类的工具中进行集中记录，确保我们有一堆截图，然后对所采取的行动、实现的目标等进行个人总结，这些对编写最终报告很有帮助。\n\n### 在行动完成后，你对蓝队进行简报和支持的方法是怎样的？\n\
  \n在陆军红队期间，我们会和蓝队举行问答。关键的一点是把管理层赶出房间。我们想让技术人员和一线员工不用担心在领导面前丢脸的情况下向我们提问。我们的答案也很诚实直率。我们是为了让他们变得更好。\n\
  \n\n\n\n\n> “要明白，你拿钱不是为了攻入某个场所，而是为了写一份关于你如何攻入、客户可以采取什么措施，以及如果攻击者采取了同样的操作会产生什么影响的报告。”\n\
  \n报告*不是*关于你有多牛的；它完全关乎*客户*。你的报告是否包含可操作的信息，以帮助客户修复问题？你的报告是否有效地向高层人员（C levels）传达了问题？还要理解的是，在许多组织中，管理层不会仅仅因为员工的一口就认为某事有问题。他们需要外部第三方来告诉他们哪里错了。理解客户的动机，并调整报告以帮助他们实现进一步的目标，也能写出更好的报告并最终获得客户的满意。\n\
  \n### 你如何确保你的程序结果对那些需要完整叙述和背景的人来说有价值？\n\n提供关于如何修复问题的详尽文档。报告是面向客户的，而不是面向测试人员的。想象一下如果你处于另一侧，这份报告落在你的办公桌上。为了修复问题，你希望在里面看到哪些信息？\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n能够以连贯的方式无论是口头还是书面，有效地表达你的想法的能力。\n\n### 在差异化处理问题的方法上，优秀的红队成员是如何脱颖而出的？\n\
  \n所表现出的谨慎程度。在某些环境中，一个错误的数据包就可能导致你的访问失效。优秀的人会在尝试实线操作之前，先在实验室/虚拟机环境中进行测试。■\n\n# 10\
  \ Ronald Eddings\n\n> “从我的角度来看，获得红队工作的最好方法是参与红队社区。”\n\n![](img/EddingsRonald.jpg)\n\
  \n**Twitter:** @ronaldeddings\n\nRonald Eddings 是一位位于硅谷的网络安全专家、博主和数字游民，他的天赋、奉献精神和野心让他赢得了受信赖的行业领导者的声誉。在职业生涯中，Ronald\
  \ 在多家财富 500 强公司工作，积累了丰富的经验，并指导了许多专业人士。除了网络安全，他还精通软件开发、DevOps 和人工智能。目前，Ronald 在一家网络安全初初创公司担任网络融合工程师，是多个开源项目的活跃贡献者。他还拥有信息技术学士学位以及一系列网络安全认证。\n\
  \n## 你是如何开始红队生涯的？\n\n我对红队、渗透测试和进攻行动的经验是分阶段的。在开始职业生涯之前，我非常幸运，通过在正确的时间出现在正确的地方，与信息安全（InfoSec）社区的黑客建立起了联系。当我第一次遇到\
  \ `Marcus J. Carey` 时，我还在上高中，恰好读我的第一本关于 `Linux` 的书。\n\n通过 Marcus，我认识了 `Johnny Long`、`Marco\
  \ Figueroa`、`Joe McCray` 等许多黑客。通过寻求和接受指导，我了解到我可以在这个领域蓬发展，除了阅读材料和理解精通不是一蹴而就的，没有什么能阻碍我。当时，红队、渗透测试或任何与攻击相关的职位并不多。起初，我花大量时间学习设备如何通信以及如何用\
  \ `Python`、`JavaScript` 和 `Ruby` 编码。巧的是，在这些领域建立知识基础恰恰是行业所需要的。学习这些主题并非易事，但在面试和争取学位时确实让我表现得更好。在读社区学院期间，我沉浸在新成立的信息安全俱乐部中，并参加了如大学网络防御竞赛（CCDC）等活动。在向我的大学教授提到我的经历后，我得知他是\
  \ `Booz Allen Hamilton` 的高级合伙人，并且最近开放了一个红队职位需求。幸运的是，我一直坚持“精通不是一夜之功”的想法，并一直尝试在可用工具和编程语言方面变得更加全才。面试来临时，我做了一切准备——一顿丰盛的晚餐、一夜的睡眠，以及早去面试。由于我准备充分且有推荐人，这次机会是偶然获得的，压力也较小。\n\
  \n### 获得红队工作的最好方法是什么？\n\n从我的角度来看，获得红队工作的最好方法是参与红队社区。在不同的城市和在线会有许多公共活动、会议和聚会。参加并在会议上担任志愿者也是一个很好的开始。这可以成为你多样化同伴群体并最终增强技能的重要起点。另一个参与的策略是参加\
  \ `CTFs` 和其他公开挑战。针对一系列新挑战花费一段时间时间练习你的技艺总是有益匪浅。\n\n### 人如何能在不违反法律的情况下获得红队技能？\n\n\
  现在是通过道德手段获取红队技能的最佳时机。虚拟化使从业者和爱好者能够快速部署基础设施和应用程序。今天，我的个人偏好是 `Docker`，它有助于创建一个攻击设备的场所，并在各种操作系统上尝试新工具。要开始学习，有很多资源可用，如书籍（例如\
  \ *Tribe of Hackers*）、在线课程、会议等等。我的建议是，对什么让技术变得脆弱以及如何防御攻击保持好奇。\n\n### 为什么我们对什么是红队无法达成共识？\n\
  \n红队的定义存在差异可能是一件好事。挑战现状假设并寻找新的解决方案是红队立足的基础。我提并鼓励遵循标准或寻求更优的解决方案，因为每个组织都有不同的需求。\n\n\
  ### 信息安全其他领域对于红队有什么是不理解的？你听过的关于红队、蓝队或紫队最有害的假言是什么？\n\n我经常听到的一个假言是团队只有一个或少数目的。红队、蓝队和紫队与多个团队有重叠职责。事实上，由于缺乏蓝队资源，有些红队成员正在做更多的蓝队工作。有害的是试图固守单一赛道，而不完全参与整个组织。\n\
  \n### 你应该在什么时候向组织的安全计划中引入正式的红队？\n\n要确定何时向组织引入红队的良好时机可能困难。我会衡量几个关键点：我会评估一个组织是否有应急响应计划。如果是，我会问，组织是否有一个团队来收集数据并响应此类事件？最后，我会问，组织是否有能力和工具来消除并主动防御威胁？如果所有这些都是真的，那么可能就是引入红队的时候了。我见过组织投资让现有的团队成员参加会议和培训，以帮助建立一个新的红队，如果操作得当，这会产生深远的影响。\n\
  \n**你如何向不情愿的或非技术的客户或组织解释红队的价值？**\n\n\n\n\n随着信息安全（InfoSec）从业人员的增长和需求的增加，红队正在出现并不断扩大规模。阐述红队的价值最佳方式是在进行威胁研究时同步进行。一个理解威胁的红队可以根据先前的攻击和事件，执行更真实的测试。通过文档记录，分享组织脆弱性的细节和指标变得轻而易举。\n\
  \n### 你看到的已实施的性价比最低的安全控制措施是什么？\n\n反过来说，性价比最高的控制措施是培训。购买一个产品并希望它奏效很容易。漏洞的产生往往是因为缺乏培训或流程难以执行。接受培训和优化流程会产生巨大的影响。尽管听起来可能很平淡，但定期的安全意识培训是有效的——而且可以作为红队测试的前奏。\n\
  \n### 你是否曾经建议过不要进行红队行动？\n\n我的背景是与大型组织合作，我一直发现这些组织需要/要求进行红队行动。攻击面/格局已经扩大了几个数量级，这证明了安全集成是持续且不断的。随着应用程序、`APIs`\
  \ 和 `IoT` 设备的兴起，总能识别出相当多的红旗。红队可以帮助标记并评估这些漏洞，以确保其他攻击者不会利用此类问题。\n\n### 能够防止你入侵系统或网络的最重要或最易实施的控制措施是什么？\n\
  \n`firewall`。没有理由让许多端口能够与组织外部进行通信。大多数现代防火墙还可以帮助创建阻止格式化应用程序请求的规则。\n\n此外，`firewall`对于基于签名和其他技术的拦截已知坏地址和其他人工制品效果非常好。随着组织的成熟，`firewall`\
  \ 是收集日志的基石资源。\n\n### 为什么你认为坚持遵守行动规则（Rules of Engagement）至关重要？\n\n由于红队能带来的价值，各组织成立红队的速度日益加快。行动规则可以帮助确保在生产网络中成功进行红队行动。超出行动规则可能导致组织的利润损失和信任危机。具体来说，崩溃为组织产生收入的应用程序或服务对所有人来说都是坏消息。行动规则是预设并达成共识的预期。如果需要调整边界，专业的红队会联系客户或利益相关者进行相应调整。\n\
  \n## 如果你在渗透测试或其他行动中被抓了，你是如何处理的？\n\n幸运的是，我从未被完全抓到。然而，我确实在我不希望被发现的源中创建过几次混乱的错误日志。具体来说，崩溃应用程序可能是攻击者最的噩梦。当关键服务崩溃时，多个源中会创建许多日志。清理现场是攻击者的责任。我曾进行过几次行动，通过崩溃服务为一名工程师提供了一个完美的升级机会——这最终导致了漏洞的修复。如果工程师开启了详细日志记录，你的\
  \ `payload` 可能会暴露，并泄露攻击正在进行的事实。在这些情况下，我把寻找替代的利用路径视为我的首要任务，以确保我可以清理日志并重启崩溃的服务。\n\n\
  ### 在执行既定目标时，你遇到过的最大伦理困境是什么？\n\n我面临的最大伦理困境是教授利用（Exploitation）。伟大的利用伴随着巨大的责任。我花部分时间在\
  \ `YouTube` 上教授教育内容，其中一部分涉及利用。在教授这项技能时，我投入额外精力将重点缩小在信息安全领域的专业人士，并避免搜索`如何破解{此处填写喜爱的网站}`的观众。\n\
  \n## 红队是如何协作完成任务的？\n\n展现出最大价值的红队是具有良好文档习惯的团队。详细的文档会导致详尽的报告，并减少行动结束时的压力。花时间记录你的工作本身就是一种团队运动。只要某个人不提供详细文档，就意味着整个团队错失了学习机会，并且对客户完成的内容理解较少。最后，如果结果记录得足够好，那么对蓝队的简报（Debriefing）将变得简单得多。\n\
  \n### 操作完成后，你对蓝队进行简报和支持的方法是什么？\n\n在行动之前，我会与客户或组织合作，设定预期并记录我工作的每个阶段。假设预期已预设，收集关于重要事项的数据/创建指标就会变得更容易。我的简报方法通常是分享三个支柱的细节：评估、评分/严重以及建议的修复方案。我与组织的经验是持续的，我经常参与修复实施并协助新应用程序构建的上线。\n\
  \n### 如果你转到蓝队，你更好地防御攻击的第一步会是什么？\n\n我发现自己不断与专注于防御的团队合作。有大量带有开源包和库的应用程序。当我能够在源代码中发现漏洞时，我会与工程师紧密合作进行补丁，并与蓝队合作搜索活动。在发现漏洞后，我喜欢寻找类似发现的证据。我的防御建议是建立边界。在你的关键资产和整个组织周围建立强大的边界至关重要。\n\
  \n在这个过程中，重要的是记住安全是持续的，不能在一天内解决。有时开启警报会导致事件/事故的涌入——调整警报和触发器需要时间。这不应该令人气馁。\n\n###\
  \ 关于如何写好报告，有什么实用的建议？\n\n如果你过去有过负面经历，写报告可能看起来是一项艰巨的任务。很一段时间内，写作是我认为自己无法产生兴趣的事物。我学会了这完全取决于心态。通过将工作框架化为价值且令人兴奋，我让记录和报告成为了我工作中最喜欢的部分。我还学会了这是展示长期最简单的方法。我建议转向积极的心态，让它变得有趣，并为工作感到自豪。文档和报告是你辛勤工作的奖杯。\n\
  \n## 你如何确保你的项目结果对于需要完整叙述和背景的人具有价值？\n\n确保价值可以意味着很多。首先知道你团队价值的指标是什么是重要的。如果你的团队是根据每年行动次数来衡量的，那么就开始收集有关该指标及类似指标的数据。如果红队和蓝队作为一个单元紧密地工作，那么每次行动都会引入新的结果，数据将强化这一点。如果你的红队在每次行动中都发现相似或相同的发现，这是一个警告信号，说明所有团队没有紧密合作，或者重要性没有得到正确的突出。这是一个参与并提供与发现相关的更多背景信息的绝佳机会。\n\
  \n### 除了指出不足之处，你还如何建议安全改进？\n\n\n\n\n\n除了基础的安全建议外，寻找漏洞引入的根源至关重要。尝试提出此类这样的问题：这是一个软件问题吗？是一个未经过培训的工程师吗？是否存在延迟团队修补漏洞的组织流程？更具洞察力的问题将与客户建立更多信任，并为未来的红队行动带来更多有趣的互动。\n\
  \n### 在招募和面试红队成员时，你会寻找哪些非技术技能或态度？\n\n我职业生涯的大部分时间都在大团队工作，我通常寻找那些渴望与团队合作的候选人。更具体地说，我会选择那些能够利用其他团队成员寻求帮助的候选人。我还是结对编程、威胁狩猎和红队行动的倡者。我发现对红队最有益的非技术技能是提问的能力。深思熟虑的问题可以满足并引导更积极的好奇心。\n\
  \n### 在不同解决问题方面，优秀的红队成员与普通人之间有何区别？\n\n让顶尖者脱颖而出的是习惯。获得卓越的技能需要时间并且需要持之以恒。你经常看到最顶尖的红队成员持续参加相同的会议和会议，这帮助他们不断取得成功并避免糟糕的协议。在学习和完成任务时，优先考虑最重要的事情并避免干扰是最有益的。■\n\
  \n# 11\n\nJustin Elze\n\n> “红队中价值成员最大的资产，是在尽可能多的计算领域拥有尽可能深度的知识。”\n\n![](img/ElzeJustin.jpg)\n\
  \n**Twitter:** @HackingLZ\n\nJustin Elze 是 TrustedSec 的对手模拟和威胁研究实践负责人。他在信息技术行业拥有超过\
  \ 13 年的经验，专长于企业渗透测试、网络安全、社会工程学和红队行动。在加入 TrustedSec 之前，Justin 曾担任 Accuvant Labs、戴尔\
  \ SecureWorks 和 Redspin 的高级顾问，在那里领导了许多红队行动和渗透测试。Justin 曾于多个行业，包括互联网服务提供商、云服务/托管、国防承包商和服务咨询公司。\n\
  \n## 你是如何开始红队生涯的？\n\n对我来说，加入红队是我从渗透测试和攻性测试起步阶段的自然过渡。我一直希望将攻性测试向更符合客户真实的模型发展，这是我做出这一转变的真正决定因素。\n\
  \n回想过去，我从小就开始接触 `IRC` 和计算机，成长过程中《黑客帝国》是我最喜欢的电影之一。我真正开启计算机职业道路是得益于两位非常优秀的高中老师：Michelle\
  \ Greenway 和 Meg McDonald，他们支持我在该领域内的成长，并帮助我进入了 `Cisco`（思科）网络计划，这真正开启了我的职业，并让我成长为今天的自己。从那之后开始，获得\
  \ `OSCP` 证书并在系统工程师或网络工程师等各种 IT 相关工作之间跳槽，使我能够完善自己的经验，直到我第一次进入信息安全（InfoSec）职业领域。\n\
  \n## 获得红队工作的最佳方法是什么？\n\n大多数人通过渗透测试、Web 应用测试或其他形式的攻性测试作为进入该领域的第一份工作。或者，来自威胁狩猎或蓝队侧的经历会让你对检测机制以及如何绕过它们产生深刻的见解。\n\
  \n红队中价值成员最大的资产，是在尽可能多的计算领域拥有尽可能深度的知识。因此，获得红队工作的最佳方法可能是通过在该工作中尽可能多的其他方面获得经验，而不仅仅特定的攻性安全。\n\
  \n### 人如何在不触犯法律的情况下获得红队技能？\n\n今天，有大量的资源可以帮助获得技能并调整你已有的技能。在 `CTFs` 和在线攻性训练课程之间，还有许多漏洞赏金计划能让人们合法地获得经验。除此之外，`Twitter`\
  \ 也是一个极好的资源，很多人在那里分享技巧和窍门。\n\n> “今天，有大量的资源可以帮助获得技能并调整你已有的技能。”\n\n## 为什么我们无法对什么是红队达成共识？\n\
  \n定义红队的主要问题在于，人们倾向于扭曲标准的交互规则以适应客户需求，但仍然称其为红队工作。一旦你开始剥离大量的测试区域并实施大量的限制，你将无法模拟攻击者的行为。这就是界限开始变得模糊的地方。\n\
  \n红队的目的是为客户提供对手模拟。它给了客户一个机会，针对旨在绕过安全控制并实现业务目标的攻击，测试他们的整个安全栈。\n\n### 信息安全其他领域有哪些方面是不理解红队工作的？你听过的关于红队、蓝队或紫队最误导的谎言是什么？\n\
  \n长期以来，人们认为红队会进入并摧毁一切且总是获胜。这很大程度上是因为公司执行了他们并未做好准备的红队行动。\n\n回过来看，攻性安全在很长一段时间内都是“容易”的——公司在可见性方面存在巨大的漏洞。可能你不需要太多深思熟虑就能入侵并避免检测。防御在过去几年中取得了巨大的进步。你可以购买\
  \ `EDR`、`SIEM` 和其他产品，这为你提供了巨大的技术优势，而在几年前，这需要许多顶尖的员工。\n\n红队需要大量的规划，以及后端大量的开发和研究。你想要按照战斗的方式进行训练。我与一些非常成熟的客户合作，我们不断地反复。在一个季度，他们可能会追上并摧毁我们进行的每一次攻击；而在下一个季度，我们带着完全新的东西回来取得进展。\n\
  \n### 应该何时向组织的安全计划中引入正式的红队？\n\n从技术控制的角度来看，我预计至少要有安全信息和事件管理（`SIEM`）以及从终端收集事件。此外，建立一个正式的\
  \ `IR`（事件响应）流程也会帮助。通常客户在渗透测试和他们的安全计划方面会达到一个点，他们希望看到整个计划面对针对性攻击者的表现如何。\n\n### 你如何向犹豫不决或非技术的客户或组织解释红队的价值？\n\
  \n如果客户犹豫不决，那么可能他们还没有准备好进行红队。红队的价值在于观察攻击将如何展开。你最终将能够识别盲点和改进领域——通常是产生客户以前未探索或未围绕构建防御的攻击路径。\n\
  \n### 你看到的已实施的安全措施中，性价比最低的是哪一个？\n\n这种情况通常不是控制措施本身的问题。控制措施可能部署错误或者没有被监控——例如，一个允许最终用户添加例外的杀病毒程序，并且在告警时没有得到响应。\n\
  \n一个简单的例子是云端电子邮件。过滤解决方案通常附有详细的部署指南。重要的步骤经常遗漏，例如限制可以直接连接到你的电子邮件服务器并绕过过滤服务的 IP 空间。这在各种规模的公司中都很常见。\n\
  \n**你是否建议过不要进行红队行动？**\n\n\n\n\n\n我经常会与潜在客户通过电话，他们正在寻求未来测试的指导，但这些测试可能并不涉及红队行动（Red\
  \ Team）。最常见的两种场景是：“我们已经做了多年渗透测试，但想在更长的时间内模拟真实攻击”或“我们想评估安全计划在识别和防御攻击者方面的整体性能”。如果一家公司尚未成熟到能够支持红队行动，我会建议进行紫队评估（Purple\
  \ Team Assessment），这可以从进攻和防御的双重角度来理解攻击者的行为和技术。\n\n## 什么是最重要或最易实施的控制可以防止你的系统或网络被破坏？\n\
  \n对于小型公司来说，像`two-factor`这样的措施非常廉价，虽然并不完美，但如果全面部署，就能有效减缓攻击速度。我还会建议处于这种情况的公司使用权限分离、网络分段以及密码管理器。创建一个让攻击者失误或不得不切换标准战术的环境，将大大增加捕获他们的机会。\n\
  \n> “像 `two-factor` 这样的措施对于小型公司来说非常廉价，虽然并不完美，但如果全面部署，就能有效减缓攻击速度。”\n\n## 为什么你认为遵守作战规则（Rules\
  \ of Engagement）至关重要？\n\n遵守作战规则极其重要。然而，当我与客户规划红队行动时，我们会尝试尽可能移除所有限制。我们很少在行动开始时带上一长串限制。最常见的限制是在对少数关键人物进行钓鱼攻击之前进行通知。这通常包括联系我们的对接人并告知他们理由（pretext），以防高调目标报告此情况并导致额外措施。客户对减少限制的接受度非常高，因为攻击者并不是在严格的规则集下工作的。\n\
  \n## 在执行指定目标期间，你遇到过最大的伦理困境是什么？\n\n伦理困境通常表现为我们无法做的事情，例如：黑入合法网站并托管恶意软件、入侵员工的手机、入侵员工的社交媒体，以及其他合法攻击者做起来毫无问题的事情；而我们作为伦理黑客是不会做的。\n\
  \n## 红队是如何协作完成任务的？\n\n这被称为`red teaming`（红队对抗）。我认为很多人忘记了这一点。没有任何一个个人能够对你将遇到的技术的每一个方面都拥有经验。你需要一个强大的团队来依靠并支持行动。多名具有不同技能的人员可以组成一个完善的团队，在内部不断学习和成长。在攻击公司时，你总是会遇到以前从未见过的技术，但很有可能另一个团队成员见过它。\n\
  \n> “没有任何一个个人能够对你将遇到的技术的每一个方面都拥有经验。你需要一个强大的团队来依靠并支持行动。”\n\n我很幸运能够在我目前的雇主处组建这支团队。我同样幸运地建立了支持进攻测试行动的研究团队。由于在客户处执行成功行动的复杂性日益增加，研究团队允许我们拥有专的开发人员和研究人员来提供新的工具和技术。\n\
  \n## 在行动完成后，你如何进行汇报和支持蓝队（Blue Teams）的方法？\n\n理想情况下，结束一项行动的方法是进行几次简报电话或会议。通常，我会从一个涉及各团队领导人的大会议开始。随后将进行针对技术问题和修复步骤的深度讨论小组会议。\n\
  \n## 如果你转到蓝队，你的防御第一步是什么？\n\n理想情况下，结束一项行动的方法是进行几次简报电话或会议。通常，我会从一个涉及各团队领导人的大会议开始。随后将进行针对技术问题和修复步骤的深度讨论小组会议。\n\
  \n## 关于编写良好的报告，你有什么实用的建议？\n\n我总是在报告中包含一个突出积极因素的部分。这可能包括客户已经在做的任何可以阻止或减缓攻击的措施。展示他们正在取得进步而仅仅指出他们的短板，是非常重要的。\n\
  \n## 除了指出他们的短板，你如何建议进行安全方面的改进？\n\n我总是在报告中包含一个突出积极因素的部分。这可能包括客户已经在做的任何可以阻止或减缓攻击的措施。展示他们正在取得进步而仅仅指出他们的短板，是非常重要的。\n\
  \n## 在招募和面试红队成员时，你寻找哪些非技术技能或态度？\n\n团队合作能力和接受建设性批评的能力在这工作中是有益的。以团队形式工作并相互支持很重要，在需要时给对方新想法或帮助，而不是剥夺他们的想法。沟通也是关键。必须将有时非常技术化且冗长的流程传达给具有不同技术能力的受众。\n\
  \n## 在以以处理问题方面，优秀的红队成员如何与普通人脱颖而出？\n\n首先，创造性的技术问题解决能力是红队成员应该具备的一个重要特质。上周有效的攻击或绕过方法，本周可能就不灵了。开发想法并灵活应变是重要的，但当你已经穷尽了可能性并需要转向另一条路径时，理解这一点也是一种宝贵的品质。退后一步并保持对抗思维的能力非常有价值。这包括以最小的足迹和攻击路径实现你的目标。\n\
  \n\n\n\n我希望自己有一个简单的答案，但我的历程并非大多数人所采取的常规路径。在我人生的大部分时间里，由于我挑战现有的计划模式、漏洞管理的流动性以及渗透测试的持续性，我一直被指责为好争辩。红队对抗（Red\
  \ Teaming）的共同目标是让蓝队变得更好、绕安全控制、静静地模拟攻击者并评估员工。这与标准的渗透测试大不同；虽然渗透测试与红队评估之间存在某些重叠，但一个没有做好准备的组织在遇到红队评估时，可能会被涌出的众多发现结果迅速所措，这可能对已经负担沉重的团队造成额外负担。\n\
  \n\n\n\n> “在大多数情况下，实际上已经准备好从红队评估中获益的业务，通常是那些安全计划已经成熟的组织，这些组织已经建立了应急响应计划，漏洞管理运行顺畅，并且渗透测试在某种程度上持续进行。”\n\
  \n另一方面，我也见证过团队利用红队评估来引发必要的讨论，并为了进一步推进其安全计划而争取资金支持。不言而喻，这并不是一个一刀切的场景，在决定红队评估是福气还是灾难时，应该考虑具体的组织背景。\n\
  \n## 你如何向不情愿或非技术背景的客户或组织解释红队的价值？\n\n在接触组织时，将终极目标传达为一种“帮助”而非仅仅是“暴露问题”的方法，对于红队的成功至关重要。我总是尝试激励红队人员和渗透测试人员让客户在任务结束后感到受到鼓励和被重视，而不是感到被暴露和脆弱。蓝队、开发者和其他技术团队成员需要知道你和他们站在一起，帮助他们反击。你的目标不是为他们的领导层提供素材，让他们借此向员工追究漏洞的责任。你在任务之前、期间和之后的沟通方式将决定他们认为你是站在他们这边，还是站在他们的对面。\n\
  \n## 你认为性价比最低的安全控制措施是什么？\n\n市面上成品防毒软件的存在似乎是企业浪费金钱的一种常见方式。恶意软件和恶意负载往往会在每次迭代时修改其签名，这使得基于签名的检测变成了资源的浪费。微软通过\
  \ `Windows Defender` 确实加强了其检测和缓解策略。如果杀毒软件没有转向更具异常行为的行为检测，那么它可能检测不到任何东西，只有旧已知的恶意软件，而这些并不是值得投入额外成本的风险，且\
  \ `Windows Defender` 已经检测到了它们。\n\n反过来，性价比最高的安全控制措施可能是强力且强制的密码策略，这是大幅提高环境安全性的最简单方法之一。这包括不再重复使用本地管理员密码、设置密码至少为\
  \ 15 位，并确保 `Global Policy Preferences` 中不包含密码。所有服务账户都应该生成独特的、强密码，且员工无法记忆。新账户的密码也应该是独特的、不具有预测性的。这是一种可以用最少资源部署、开销极低、难以反制，且能为攻击者制造重大麻烦的安全控制。\n\
  \n## 你是否曾经建议过不要进行红队任务？\n\n我刚刚完成一个任务，客户要求进行红队测试，但他们实际上只需要对特定环境内的产品进行测试。这导致了更多像是一个内部转向评估，重点关注该产品及其配置。通过花时间讨论客户的需求和他们对任务的预期，可以快速确定一种符合客户需求和目标的合适任务类型。\n\
  \n## 最重要或最容易实现的、能防止你攻破系统或网络的控制措施是什么？\n\n强力密码策略与所有关键服务上强制执行的双因素身份验证的结合，通常会让红队任务面临巨大的头疼问题。组织规模越大，实施就越困难，但对于中小型企业来说，这可以是一个快速的胜利，随着组织的增长而发展，且只需少小预算即可开启。\n\
  \n## 为什么你认为遵守任务约程（Rules of Engagement）至关重要？\n\n除了可能出现的法律问题外，任务的目标是评估范围内的安全状况。如果任务约程概述了关于测试的具体细节、时间段或其他限制，那是因为客户认为为了执行任务有必要这样做。作为测试人员，我们并不总是知道任务对环境或员工可能产生的影响影响，而这些影响可能会迅速失控。同时，一个善于倾听的测试人员可以为客户提供建议，这可能引导他们以一种帮助而非阻碍的方式来扩大任务约程。\n\
  \n## 如果你在渗透测试或其他任务中被抓了，你是如何处理的？\n\n红队的魅力之一在于，能够面对一个装备精良且知道如何响应事件的蓝队。在一次红队行动中，我们正利用社交工程攻击从一个员工经常使用的热门企业社交网络中钓取凭据。现在，我经常执行这种技术，因为看起来它成功远多于失败，这意味着我在执行攻击路径方面已经非常从容，甚至目标过过后端工程师、软件开发人员，甚至是蓝队成员。这是一把双刃剑，执行成功时可以获得巨大的访问权限，但另一方面，只要一步失误，整个行动就会暴露。\n\
  \n有一天，我们正在执行一条攻击路径，目标之一（一名内部招聘人员）察觉到了我们在社交网络上的伪装资料。该知情员工将其报告给了蓝队，一名负责处理事件的初级分析师立即创建了\
  \ `canary credentials`（蜜罐凭据）并将其喂入我们的钓鱼门户。凭据一落我们手中，我们的团队同时开始利用这些凭据尝试在多个门户上进行身份验证，结果同时被指纹识别并拦截，并生成了入侵指标（IOC），这迫使我们退回并重建。好奇的分析师、报告事件的坚持不懈的员工以及过度的自信，共同导致了我们在行事时被抓获。在与蓝队的复盘会议上，我们能够在他们的同伴、团队主管和执行人员面前赞扬那名分析师。\n\
  \n当这类胜利发生时，我会将它们添加到最终报告执行摘要的特殊章节中，以便每个阅读报告的人都能庆祝团队的价值以及所取得成果的价值。\n\n\n\n\n\n## 红队是如何协作完成任务的？\n\
  \n许多因素都可能改变红队的运作方式，我不确定是否存在所谓的正确或错误方法，也许只有只有有效和无效方法之分。有时，团队成员拥有某些技术专长，这可以为行动提供极大帮助；而另时候，则是由一组配合良好的通才人才组成的团队。无论哪种情况，红队通常都会有一位负责人，负责许多后勤和运营事宜，例如与客户沟通以及管理内部沟通。一个良好的团队负责人不是独裁者，而是一个仆人型领导，负责为行动提供支持、包容、协调和监督。他们也是从开始到结束的活跃成员，因为在某些情况下，其他成员可能会在行动过程中加入或离开。这意味着团队负责在交战规则（rules\
  \ of engagement）会议以及蓝队复盘（debrief）期间是主要的发言人。\n\n> “一个良好的团队负责人不是独裁者，而是一个仆人型领导，负责为行动提供支持、包容、协调和监督。”\n\
  \n我从未见过每个参与者只在行动某一特定领域发挥积极作用的红队。我想，如果发生这种情况，可能出现在内部红队中，而不是咨询项目里。在我参与的大多数行动中，成员之间有大量的沟通，虽然可能会出现许多攻击路径，但通常一次只选择一两个。在行动期间，我参与过的团队发现，通过协作来撰写报告是最佳的，这样每个人都能根据自己的贡献尽到份的责任。\n\
  \n当我领导红队时，我会花时间为团队整理行动笔记，并列出他们对当前行动可能有的任何问题。需要知道协作报告在哪里吗？正在寻找 `C2` 基础架构吗？想知道 `VPN`\
  \ 门户在哪里，以及哪个域不需要双重身份验证？对我们从 `ntds.dit` 中破解的密码感到好奇吗？正在寻找最新的 `BloodHound` 数据吗？良好的沟通是与其他团队成员保持快速且愉快地协作的关键。\n\
  \n# 如果你转到蓝队，为了更好地防御攻击，你的第一步是什么？\n\n从内部和外部视角理解攻击面绝对会是我的第一步。设想一下，如果你不知道所有的入口或房间，要保护你的家免受入室窃的侵害将有多困难。当然，你可以策略性地在浴室浴缸里放一个下一代捕熊夹，但不要对它寄予太高期望。当你知道自己在防御什么时，防御会容易得多。\n\
  \n我发现这个简单的步骤在我生活的大多数领域都是事实。我该如何攻击一个我不了解的组织？如果我不知道自己在哪里做得不好，我该如何成为更好的配偶？如果我不知道自己的缺点，我该如何成为更好的员工？如果我不知道这项技术，我该如何发现漏洞？这种好奇心驱动着我，并挑战我继续挖掘。\n\
  \n# 关于编写良好的报告，有哪些实用的建议？\n\n报告的阅读和编写是一种“必要的恶”，由于它是行动的产物，应该给予特别关注，以确保它能成功传达给接收者。通过将报告编写分为三个部分，测试人员可以消除报告编写中常见的许多缺陷，同时直接向正确的受众传达信息。阅读报告的人通常有两类：高管人员和技术人员。\n\
  \n高管人员通常只关心关键缺陷、哪些是运作良好的、哪些是坏的、与行动相关的整体风险，以及他们下一步应该去哪里。这些信息的良好位置是在报告的开头；它应该是简洁扼要的，包含任何技术术语。他们不在乎\
  \ Web 服务器有多个 `Apache Struts RCE` 漏洞，但他们确实在乎外部攻击者可以获得客户数据的未授权访问。\n\n带有概述攻击路径和截图的方法论报告不仅在边写边做时容易，还能为接收者提供整个过程是如何发生的背景。边写边做需要练习，但它迫使你以一种健康的方式放慢速度。这对于在较长的行动中保持详实的活动记录也有用。没有比这更糟糕的在追兔子钻进洞之后才跳过方法论，然后不得不回忆发生过的一切。\n\
  \n每份报告都应该有一个“发现”（findings）部分，你可以扫一眼以查看整体漏洞及其严重程度，但也要阅读发现的细节。细节应该详细阐述测试人员观察到的内容、为什么这是一个问题、修复建议，以及可以提供指导的资源。\n\
  \n## 你如何确保你的项目结果对于需要完整叙述和背景的人是有价值的？\n\n在每份报告的执行摘要中，我们不仅讨论关键缺陷，还强调关键的成功。这可以涵盖从表现良好的技术安全控制措施，到由于警惕而被表扬的员工。\n\
  \n在复盘（debrief）中，我首先尝试通过识别他们对行动成功的关键贡献来尊重参与人员；当高管或领导层在场时，这一点尤为如此。记住，我们要在每一个机会都去提升他人，因为在很多情况下，他们觉得我们正要说他们的“宝宝很丑”。当接收者知道你是站在他们这一边的，你关心他们的成功，并且他们不仅仅是他们错误的总和时，传递那些难以接受的消息要容易得多。\n\
  \n揭示组织内部的仅仅只是开始。一个成功的行动是结果帮助组织而不是伤害它的。测试人员有责任发现客户希望从行动中获得什么。显然，安全控制的失效会给组织带来风险，但很多时候我他们希望利用结果获得资金或其他计划。有了这些信息，红队可以调整叙述方式，鼓励其向符合现有计划的方向增长，在那个方向上，缺陷是受到欢迎而不是被忍受的。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n\n\n\n\n一名优秀的红队队长能够成功地组织成员、资源和沟通，使团队内部保持顺畅运作。他是一个能够提供装备、鼓励他人并展现视角，而不会强加自己意愿的人。一名优秀的红队成员在必要时能够很好地承担自身责任，在不脱离集体、不领先的情况下建议解决方案或技术，并拥有坚韧的好奇心。每位团队成员对团队的成败都有直接影响，因此在采取行动之前仔细讨论处理问题至关重要——否则，整个任务可能会面临危险。我非常喜欢在一个步调一致、沟通良好并共同发现微小胜利的团队中工作。\n\
  \n> “一名优秀的红队成员在必要时能够很好地承担自身责任，在不脱离集体、不领先的情况下建议解决方案或技术，并拥有坚韧的好奇心。”\n\n红队在进入任务时如果已知某些地方存在问题，与那些一遇到障碍就放弃探索的团队成员相比，他们倾向于更仔细地“翻开更多叶子”。在每次任务开始前调整心态是一种值得培养的健康习惯，这有助于避免养成最终限制红队成员成功的坏习惯。当你作为顾问工作时，这一点尤为真实，因为你可能会穿梭于不同的任务之间。■\n\
  \n# 13\n\n## Kevin Figueroa\n\n> “红队之所以不同，是因为每个组织都有独特的需求，这就是为什么每项工作都应该在工作范围内进行描述。”\n\
  \n![](img/FigueroaKevin.jpg)\n\n**Twitter:** @KevinFigueroa\n\nKevin Figueroa 是一位热情的黑客和网络安全研究人员。作为一名拥有\
  \ 10 多年经验且在网络安全领域知识广博资深从业者，他曾在政府、私营和公共部门提供过咨询。他专注于网络和 Web 应用程序渗透测试以及漏洞和风险评估。Kevin\
  \ 对不同编程语言、威胁研究、开锁和逆向工程的无尽热情使他在 DEF CON 和 InfoSec Connect 等多个会议上担任演讲；他还是 DCNYC Group（纽约市每月一次的黑客聚会）的联合创始人，以及马里兰州黑客空间\
  \ Unallocated Space 的联合创始人。\n\n### 你是如何开始从事红队工作的？\n\n我几年前开始接触红队工作的，但感觉那已经是很久以前了。为了成为一名优秀的红队成员，所需的各种技能需要多年时间才能积累。在多年里，掌握网络、防火墙、IDS、数据包制作、无线、社会工程、开锁、移动以及不同操作系统的复杂知识对于红队来说是基础性的。当然，红队的主要技能是渗透测试，我在网络安全生涯的大部分时间都在进行渗透测试。\n\
  \n对黑客技术的热以及在网络、Web 应用程序和无线渗透测试这三个专长之外学习更多技能，让我获得了成为红队成员的自由。通过多年的努力以及从不同的人和导师那里学习，我得以掌握并学习其他学科，如开锁、移动端以及使用神经语言程序（`NLP`），对我来说，这是社会工程的最高形式。确实，这些并不是成为红队成员所需的全部技能，但它们是我开始从事红队任务的技能。\n\
  \n### 获得红队工作的最好方法是什么？\n\n拥有强大且多样化的技能组合将使成为获得红队职位的理想人选。红队的一项核心技能是渗透测试，但渗透测试并不是唯一应该获得的技能组。另外两个应该获得并持续练习的技能组是社会工程和开锁。这两项技能有时会被忽视，但在执行红队任务时它们可能极具价值。开锁和社会工程必须经常练习。参加黑客大会上的开锁村（lockpick\
  \ villages）、使用互联网资源、收集文献以及购买开锁套装就能入门。此外，如果你想让你的社会工程水平更进一步，请持续练习`NLP`。\n\n其他一些实用的技能是移动、无线和射频技术。如果你获取了员工的手机并克隆了\
  \ SIM 卡，这有多用？或者克隆某人的`RFID`卡进入受限区域如何？或者嗅探并发现`蓝牙`协议或其无线技术中的漏洞？这些都可以利用其安全防御态的切入点，也是组织被攻破的方法。所以，正如你看到的，获取许多不同的技能对于成为一名红队成员至关重要。\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n有几种方法可以在不违反法律的情况下获得红队技能。建立包含不同漏洞镜像的虚拟实验室环境是采用渗透测试实践的一种非常有效的方法。由于技术的不断变化，人们必须不断练习自己的渗透测试技术。\n\
  \n> “建立包含不同漏洞镜像的虚拟实验室环境是采用渗透测试实践的一种非常有效的方法。”\n\n例如以网络和 Web 应用程序渗透测试为例。这是两个完全不同的学科，但\
  \ Web 应用程序测试依赖于网络。有些人可能使用`Linux/Unix`环境，而另一些人可能使用`Microsoft Windows`托管 Web 应用程序。因此，清晰了解网络的工作原理或不同\
  \ Web 技术如何相互整合是非常有必要的。准确的知识至关重要，无论是网络还是 Web 应用程序，它可能包括了解几种不同的 Web 技术和网络设备。你对这类漏洞和弱点的样貌接触越多，就越能识别出组织内部可供利用的弱点。\n\
  \n最终，通过许多小时的练习、努力和持续的研究，你将获得成为红队成员的工具。\n\n### 为什么我们对什么是红队无法达成共识？\n\n我认为这是因为没有关于什么是红队的通用大纲。红队之所以不同，是因为每个组织都有独特的需求，这就是为什么每项工作都应该在工作范围内进行描述。另一个原因是，组织可能想要的是漏洞评估却称之为渗透测试，或者他们可能想要渗透测试但称之为红队任务。然而，这需要我们网络安全专业人员来理解客户的需求并解释任务类型之间的差异。但有一点是可以肯定的，利用漏洞攻击组织是核心前提。\n\
  \n\n\n\n安全成熟度因组织而异，但一个组织应该尽早考虑将正式的红队演练纳入其安全态势中，并且每年至少执行两次。组织应该始终考虑的另一个因素是对授权区域的物理访问。有时，中小型企业会忽视这一方面，但他们不应如此如此。\n\
  \n## 你如何向不情愿或非技术性的客户或组织解释红队的价值？\n\n与客户使用易于理解的词汇，使用相关的类比故事来解释其必要性，甚至可以进行定量分析以展示发生泄露时的成本——所有这些都应该有助于他们理解为什么红队行动如此重要。在中小企业中，安全防御态势可能被视为次要考虑。然而，展示组织遭受攻击后的成本与开展红队行动的成本进行对比，可能会改变他们处理组织内部安全的方式。\n\
  \n### 你是否建议过不进行红队行动？\n\n是的，但这应该在与客户接洽的早期阶段做出决定。这将允许你评估该组织的安全防御态势。在解释了为什么不需要红队行动的原因后，你应该建议进行外部渗透测试。\n\
  \n### 什么是最重要或最容易实施、能够防止你攻破系统或网络的控制措施？\n\n访问控制和执行密码策略。我遇到的中小型企业在这两个方面都很欠缺。这两项任务可以通过他们的系统管理员轻松实施。另一个应该考虑的任务是每月进行一次漏洞评估。这将帮助组织的技术领导者优先处理最关键的漏洞。\n\
  \n### 为什么你觉得遵守行动准则（Rules of Engagement）至关重要？\n\n这取决于工作范围和合同协议。解释为什么某一种威胁可能导致攻破组织的利用行为，并可能损害其品牌，也许是最好的做法。此外，假设你正在进行渗透测试并运行了一个\
  \ `SQL injection` 漏洞程序，扫描器删掉了一个表，而公司没有对数据库进行定期的计划备份。那么责任可能会因为违反了行动准则而落在红队身上。或者，如果公司已经识别出该漏洞，并认为该漏洞的威胁低到足以将其归类为可接受的风险并排除在范围之外呢？这会让红队看起来完全不在乎组织的行动准则，可能导致组织在下一次行动中不再将合同授予该红队。\n\
  \n### 如果你在渗透测试或其他行动中被抓获了，你是如何处理的？\n\n是的，我以前在一次红队行动中被抓到过，情况非常糟糕，我差点被武装守卫射杀。这让我再次考虑再次进入有武装守卫的建筑时变得谨慎。谢天天，我打印了一封组织\
  \ `POC` 的邮件作为证明，但他们仍然需要联系 `POC` 进行核实。简而言之，在尝试突破组织设施时，你应该始终保留某种形式的组织授权书面证明。\n\n###\
  \ 红队成员是如何协作完成任务的？\n\n正如我之前提到的，红队成员应该拥有多样化的技能组合。合作工作不应该是问题，因为你可以发挥彼此的长处。有一点是可以肯定的，应该选择一名队友来收集所有其他团队成员的文档，并在过程中撰写报告。这样，当红队行动完成后，所有团队成员坐在一起讨论所有的弱点，以便组织从结果中获得最大的价值。\n\
  \n### 在行动完成后，你对蓝队进行汇报（Debriefing）和支持的方法是什么？\n\n对组织进行汇报或支持蓝队的最佳方法是保持积极的态度。目标是帮助改进组织的安全防御态势，而不是解释他们在实施安全防御方面做得有多糟糕。识别可能被利用的弱点是一回事，但如果你不帮助他们理解弱点最初产生的原因，那么利用这些弱点没有任何意义。这可能会导致组织重新思考他们如何优先处理漏洞，甚至在组织内部制定新的策略。\n\
  \n> “对组织进行汇报或支持蓝队的最佳方法是保持积极的态度。”\n\n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\n就个人而言，我更倾向于留在网络安全的进攻方。然而，如果我转到蓝队，我将让自己投入对攻击者所采用的新攻击向量的持续研究中。为了更好地防御，我会了解组织建立了什么类型的日志留存，并熟悉聚合和关联组织日志的设备或系统。日志和监控是开始跟踪组织内部可疑流量和横向移动的关键。\n\
  \n关于如何编写优秀报告有什么实用的建议？\n\n首先，不要过度编写报告，意味着不要写长篇大论的报告，因为组织中的业务人员只会查看前 10 页左右的内容。其次，尝试用最少的词汇解释漏洞，同时又不丢失该漏洞存在背后的含义。最后，使用截图甚至视频来展示你是如何利用该弱点的，但要确保文字简单明了。不要只使用专业术语来恐吓客户。\n\
  \n### 你如何确保你的程序结果对于需要完整叙述和背景的人是有价值的？\n\n为了确保红队结果对组织有价值，应该为每个发现的漏洞关联一个成本。进行定量分析，以支持报告中列出的漏洞，同时增强客户报告的质量。在组织的数字资产中发现漏洞对组织的品牌可能极其重要。通过证明结果的重要性并加上美元金额，可以驱动其作为组织必要动因的价值。\n\
  \n\n\n\n\n由于红队成员拥有多样化的技能组合，他们对任务问题的思考方式也各不相同。让人员接触不同的技术，并配以具有不同方法论经验的队友，是一项巨大的胜利。■\n\
  \n# 14 Marco Figueroa\n\n> “从我的角度来看，技能胜过一切；多年来，我一直与许多比我聪明得多的人并肩，是他们帮助我成长为今天的安全专业人士。”\n\
  \n![](img/FigueroaMarco.jpg)\n\n**Twitter:** @MarcoFigueroa\n\nMarco Figueroa 是某世界\
  \ 500 强公司的高级安全研究员，其技术专长包括逆向工程、漏洞挖掘、事件处理和 APT 组追踪。他对跨市场垂直领域和组织的威胁情报术术有深的理解，能够识别攻击向量、趋势和国家级攻击者，并利用来自国家级攻击者报告的最新技术来提升自己的攻击安全技能。\n\
  \n## 你是如何开始红队生涯的？\n\n我的第一次红队外包是在 2006 年，当时我在一家世界 500 强公司担任安全分析师，我的一位同事在印度合办了一家拥有\
  \ 100 多名员工的咨询公司。在大约一周的时间里，这位同事（我们称他为 Randy）不断向我提出关于特定网络黑客技术的安全问题；起初，我以为他对比安全感兴趣是因为他是一个\
  \ Oracle DB 开发者，但后来我终于问他为什么想了解所有这些不同的技术。他告诉我，公司每天都遭受攻击，他们正在和攻击者玩“打地鼠”游戏。他问我的问题是为了看我是否是这份工作的合适人选。他问我是否对渗透测试感兴趣，并让我弄清楚这些入侵者是如何获取访问权限的。于是\
  \ Randy 给了我任务范围。接下来的周一，我们签署了包含条款的合同。简而言之，防御边界非常薄弱，路由器使用了默认密码，内部的交换机也使用了默认密码。管理员需要对内部基础设施进行加固。我从从中学到的教训是：无论公司规模大小，红队成员都应该立即向利益相关者报告每一项对组织产生关键性影响的漏洞。\n\
  \n## 获取红队工作的最佳途径是什么？\n\n从我的角度来看，技能胜过一切；多年来，我一直与许多比我聪明得多的人并肩，是他们帮助我成长为今天的安全专业人士。当你开始与志同道合的人在一起时，发生的情况是它能让你将技能提升到一个新的水平。\n\
  \n以下是我关于如何实现并获得你理想的红队工作的建议：\n\n*   找出行业中那些极其聪明的红队成员，参加红队会议，结识他人，分享想法，获取技巧/窍门。人类天性乐于帮助他人，所以如果你有一个深思熟虑的问题，就去问那个会有答案的人。\n\
  *   在 Twitter 上关注人们并使用 `TweetDeck` 创建分组（命名为 `RedTeam`）。我关注的几个通过推文提供价值的人包括 `@Tobyhush`、`@TTimzen`、`@0xDADE`、`@at1as`、`@invisig0th`、`@carnal0wnage`\
  \ 和 `@nnwakelam`，有很多优秀到让你彻夜不眠。\n*   像拼命一样参加会议。我之所以有今天的成就，是因为我通过参加会议的讲座和走廊交流获得了知识。每当我参加一次会议，我都会带着一袋得到解决的问题离开，以及一个需要执行和学习的事项清单。我会寻找那些我知道比我更有知识的人，协助我解决我当时可能面临的障碍。\n\
  *   这一件简单的事情非常有益：跟进你遇到过的人。确保他们记得你，这样下次你见到他们时，他们会询问你之前问过的问题进展。不要只是在 Twitter 或 LinkedIn\
  \ 上加个好友；给刚认识的人发封封两分钟的邮件会有很大帮助。我多年来建立的一些关系，现在被我视为终身朋友。你追求知识的坚持没有边界，那么你为什么不与社区积极互动呢？\n\
  *   为尽可能多的人提供价值。当你不抱任何回报地做这一件事时，大门就会为你开启。当我发现一些非常酷的、我觉得朋友可能喜欢的东西时，我会直接联系他们并分享这些知识；这就是建立信任的方式。我热爱帮助别人和分享，因为这个社区为我做了很多。\n\
  \n## 一个人如何在不触犯法律的情况下获得红队技能？\n\n这个问题对我来说是显而易见的。加入漏洞赏金计划并开始黑客行动吧。这些公司为漏洞猎人寻找漏洞提供了激励，因此他们会在自己的网站上提供培训来帮助你入门。`HackerOne`\
  \ 和 `BugCrowd` 只是两家公司，我相信这个领域在未来几年内会非常拥挤。赢得这场竞赛的公司将是那些通过超越标准的服务为社区提供最大价值的公司。他们可以为你提供所有的工具和培训，但你必须投入努力，在键盘上敲击以开发那些技能来赚取赏金。\n\
  \n过去几个月来，对我提供巨大价值的人和网站包括 `@jhaddix`、`@stokfredrik`、`@nnwakelam`、`@NahamSec`、`HackerOne`\
  \ 网站、`Bugcrowd` 网站、`PentesterLab` 网站以及 `Offensive Security Training`。\n\n## 信息安全其他领域哪一点是不理解红队工作的？你听过的关于红队、蓝队或紫队最具有毒害性的虚假言论是什么？\n\
  \n红队为组织增加的价值是无价的。曾有一支充满顶尖技能的团队，他们竟然作为一个整体一个接一个地离开了，去了另一家公司。这说明了该组织的什么？我总是向高层汇报红队的价值。如果你以负面的方式出现在《华尔街日报》（`WSJ`）的头版上，那用金钱衡量是多少？如果对手攻破了公司的一台服务器并盗了客户数据，那么当这些数据在黑市售卖或被丢弃时，该公司如何处理后果？现在，如果你的组织有一个红队持续寻找“低垂果实”或对二进制文件进行逆向以寻找漏洞会怎样？人们可能会说那不是红队，而我的回答每次都是一样：像对手一样行动就是红队。\n\
  \n## 应该何时向组织的安全计划中引入正式的红队？\n\n公司之间的差异巨大。我相信无论规模大小，一家公司都应该每季度进行一次评估。我衡量公司的标准是：如果你的核心资产是知识产权或客户数据，那么你就需要一支全职员工团队进行红队工作。\n\
  \n\n\n\n幸运的是，我工作过的所有公司都理解建立红队的价值，但有一家销售软饮料的公司通过惨痛教训发现了红队的重要性。这家公司发生过一次事故，导致输送带停止了饮料生产。这次事故导致他们每小时损失超过\
  \ 100,000 美元，他们在那时学到了宝贵的教训。下个月，公司组织了一场安全峰会，我当时的经理派我带一位“黑客”来谈论 2000 年代后期安全的重要性（顺便说一下，`@at1as`，你还欠我那顿酒呢）。这家公司最终建立了一支红队，我想相信是那次峰会的聚会促成了这一切！\n\
  \n### 你见过的性价比最低的安全控制措施是什么？\n\n要回答反过来的问题，即什么措施性价比最高，答案是一个允许你部署 `YARA` 规则的端点检测与响应（`EDR`）产品。\n\
  \n### 你是否曾经建议过不要进行红队对抗？\n\n是的。相反，我建议过限制用户的访问权限，并培训每位员工不要被钓鱼邮件欺骗。\n\n### 能够防止你攻破系统或网络的、最重要或最易实现的控制措施是什么？\n\
  \n让你组织中的每个人都参与到安全意识计划中。对手明白，员工总会成为精心设计的钓鱼邮件的受害者。例如，我订购了一个包裹，通过 `UPS` 寄送。那周我收到一封看起来非常像\
  \ `UPS` 官方邮件的邮件，制作得完美无缺（向那个威胁者致赞）。那是 2010 年的事，我记忆犹新，因为我当时和我的经理聊过，下周他也收到了一封类似的邮件。\n\
  \n### 为什么你觉得保持在行动规则（Rules of Engagement）之内至关重要？\n\n有一次我在执行任务时，一名团队成员超出了范围并撞倒了一台关键服务器，导致服务器宕机了几个小时。除了与经理通话时感到尴尬之外，任务被立即停止了。红队人员不理解的是，有时候你没有发现任何东西也是完全没问题的；这并不是世界末日。你只需致意，并在下一次任务中更加努力。并不是所有的任务都是平等的！\n\
  \n## 如果你在渗透测试或其他任务中被抓了，你是如何处理的？\n\n我会给你讲一个反面故事。我被联系去调查系统上的可疑活动。我收到一个 `binary` 文件并开始对其进行逆向工程。我在心里想，我分析的这个\
  \ `binary` 令人印象深刻。我联系了当时的红队主管，问他他的团队是否在执行我在 `binary` 中分析的那些可疑活动；红队主管告诉我并不是红队干。\n\
  \n我立刻意识到这可能是一个复杂的攻击者；我真的很佩服我分析的那些酷炫 `binaries`。我对手设计出如此复杂的技巧深表敬意。在进一步调查 `binary`\
  \ 之后，我确定它是一个特定的 `APT` 组织，并创建了一些 `YARA` 规则来查看他们渗透网络的深度有多深。只有那台机器被攻破了，但我随后必须调查他们是否进行了横向移动，结果他们没有。我们调查了系统，确定该攻击者没有攻破任何其他系统。有时在行动中，对手需要有操作员待命，以便随时进行横向移动。我认识某些可以在\
  \ 30 分钟内穿整个网络的对手——我认为他们是超级攻击者。我热爱进攻，但防御能让你从国家级力量那里学到可以用于进攻的尖端技术。我总是阅读 `APT` 报告，以学习对手使用的最新技术。两兼作战对于你作为红队人员的发展至关重要！\n\
  \n### 你在执行指定目标时经历过的最大的伦理困境是什么？\n\n在对软件进行逆向工程并寻找漏洞时，你总是会读到免责声明，告知你不应该对该软件进行逆向工程。在这样做时，你必须知道如果你发现了漏洞，应该立即报告。\n\
  \n## 红队是如何协作完成任务的？\n\n如果你们在协作，那么团队成员之间的沟通至关重要。我建议进行早晚站会会议（10 分钟的会议）。这样做有助于团队明确大家正在做什么以及每天的发现。\n\
  \n### 在任务完成后，你对蓝队进行汇报（debriefing）和支持的方法是什么？\n\n我一直建议管理层，红队成员应该为他们攻破系统的方法编写规则。很多红队不想这样做，因为这会阻碍他们的下一次任务。许多团队尝试就加固任务期间被攻破的系统提供建议，但人们通常不想编写检测规则。这工作量更大，但从长期来看是有回报的。\n\
  \n### 如果你转到蓝队，你防御攻击的第一步会是什么？\n\n我的职业生涯中打过两个阵营，我发现双方都非常迷人。在红队方面，你从一个全新的视角来看问题。我最喜欢的是研究新技术并尝试寻找利用它的方法；而在蓝队方面，这让我想起热门电视剧《致命追踪》（The\
  \ First 48）。当检测到某些情况时，你必须弄清楚入侵的优先级级别，然后变成一名侦探来找出如何止血。我的逆向工程技能允许我像左右手灵活一样处理两个方面；有时当我协助蓝队时，我必须拉入一名红队人员协作处理事件。我相信红蓝队是亲兄弟，他们需要达成一致以为了共同利益工作。\n\
  \n### 关于编写良好的报告，有什么实用的建议？\n\n关于这一点，我想说的是弄清楚对任务利益相关者来说最重要的事情。我不认为一份 500 页的报告是有用的。但他们必须意识到所有问题，这是肯定的。理解利益相关者关心什么非常重要，提供价值应该是你的首要任务。根据我的经验，很多渗透测试人员讨厌写报告，但如果你学会接受这项任务，并为解决任务期间发现的问题提供具有可操作性的报告，那么组织和你们都会赢。\n\
  \n### 除了指出不足之处之外，你如何建议改进安全？\n\n\n\n\n积极的态度、热爱学习的人，以及那些不待留在舒适区的人。我有一位朋友是技能 `Y` 的专家。他对某个特定的技能组了如指掌，我问他为什么不学别的技能。他回答说：“我是这个沙箱的王，我想一直当这个王。”这是一个在不同情况下很难合作的队友的例子。拥有那种心态的人不会提升团队成员。他不会让别人在他的沙箱里比他优秀。他会对比团队中那些在同一个沙箱里开始玩得比他好的人产生不满。我认为这是一个糟糕的雇人。你可以在面试过程中察觉到这一点；你可以问的一个问题是：“你会如何学习从未学过的新事物？你能向我介绍一下这个过程吗？”\n\
  \n## 在以不同方式处理问题方面，优秀的红队成员员是如何脱颖而出的？\n\n我认为，当一个人热爱这项事业时，那个人会立即脱颖而出。我认识一个人，如果我换公司并建立一支红队，他绝对是我的第一个入职人员。当某人富有创意并利用技术找到完成工作的方法时，我不会接受拒绝。我会认为他们是一个可以信任在执行任务期间尽力而的人。■\n\
  \n# 15\n\n### Jared Folkins\n\n> “学习如何学习。然后教自己如何交付。并寻找或创建一个平台或社区来分享你所交付的内容。”\n\n\
  ![](img/FolkinsJared.jpg)\n\n**Twitter:** @JF0LKINS\n\n在从 90 年末的互联网泡沫中幸存后，Jared\
  \ Folkins 在系统和编程领域拥有了长期的职业。2013 年，他将爱好变成了职业，并且再也没有回头。他以技术过硬和高情商而闻名，他喜欢与那些优先考虑目标和人、将自我心放在最后的人合作。他目前为\
  \ [ThreatHound.com](http://ThreatHound.com) 提供红队服务，为 Bend La Pine Schools 提供蓝队服务，并在\
  \ [OpsecEdu.com](http://OpsecEdu.com) 破解软件的同时培养人才。如果你需要他的帮助，或者只是需要一个新的信息安全朋友，请通过\
  \ [JaredFolkins.com](http://JaredFolkins.com) 联系他。\n\n## 你是如何开始红队的？\n\n我曾担任程序员以及系统和数据库人员十多年。有一天，我开始做一个兼职项目，拆解并逆向一个\
  \ `Java` 。该软件的主要功能是备份你的文件并对其进行加密密封。然后它会将此备份发送到云端，为你提供端到端的加密存档。我想看看它是如何工作的。在执行这项工作时，我将我的想法和学习内容写成了四篇博客文章。我没有详细说明我针对的特定软件，而是对我探索的主题进行了通用的概述。这是一次很棒的练习，因为我发现教我正在学的东西真的让我对问题领域中学的内容印象深刻。\n\
  \n一个朋友读了我的文章，问我是否想在当地的黑客之夜（hack night）进行演讲。由于经常害怕嘲笑和批评，我走出了舒适区，接受了他的提议。演讲非常成功，我那天晚上遇到的一个人问我是否愿意兼职做一些安全工作。我抓住了这个机会，从以后一直在从事咨询，为我的红队工具箱添加工具并一直应用它们。\n\
  \n## 获得红队工作的最佳方法是什么？\n\n进入信息安全领域的途径有很多，以至于我鼓励你不要局限于寻找“最佳方法”。对我来说，我在系统和编码方面有很长的职业生涯。当我实施控制和系统来防止我的基础设施被攻击时，我会测试我在网上找到的实际概念证明（PoC）。我是通过尝试攻击自己来发现如何黑的。我可以把自己放在系统管理员或开发者的立场上，想：“如果我面临截止日期压力并需要偷工，我会偷哪个环节？”最后我意识到我非常擅长嗅出脆弱的系统和代码。\n\
  \n在听了许多不同人的故事后，我注意到的一个共同点是，我钦佩的所有都可以在没有指导的情况下交付和产出。学习如何学习。然后教自己如何交付。并寻找或创建一个平台或社区来分享你所交付的内容。\n\
  \n## 人如何在不惹麻烦的情况下获得红队技能？\n\n在我生命早早时候，我建立了超过 20 多年的红队。这并不意外，信息安全作为一个更年轻的学科，仍在挣扎着定义自己。\n\
  \n（等等，原文有重复的句子）\n\n我建立了超过 20 多年的红队。这并不意外，信息安全作为一个更年轻的学科，仍在挣扎着定义自己。\n\n## 为什么我们对什么是红队无法达成一致？\n\
  \n计算机科学是一个年轻的行业。尽管有像 `Rust` 这样的语言正在挑战我们处理编程的方式，但我们仍然无法写出一个既满足业务要求的安全的程序。缓冲区溢出和整数溢出、`SQL\
  \ 注入`、`XSS`——这些攻击一直存在，并将继续存在一段时间。\n\n## 信息安全其他领域对红队工作不理解的一点是什么？你听过的关于红队、蓝队或紫队最毒害的假言是什么？\n\
  \n红队并不会酷多久。通常你会被迅速带入一个任务，然后又迅速被带出去。通常没有时间进行现代或独特的研究。你只是在试图帮助组织发现显而易见的果实，然后离开。\n\n\
  最毒害的假言是红队在安全叙述中拥有更大的权威。有些人相信这一点并活在这种信念中，这只会拖低其他人的水平。请不要不要这样做。你们的存在是为了平等地支持其他团队。只有当你寻求与他们建立关系而不是渗透（pwn）他们时，你才会真正成功。\n\
  \n## 你应该何时向组织的安全计划中引入正式的红队？\n\n人们认为引入红队，特别是外部审计红队，将推动他们组织安全故事的关键。遗憾的是，如此多的组织尚未将安全融入他们的文化中。当我被分配到同一个组织进行另一次渗透测试，并发现我在上一次任务中报告过的相同的关键漏洞时，这一点变得格外明显。\n\
  \n我的建议是弄清楚如何建立安全文化。你将如何在组织中培训、教育和培养安全人员？如果你不知道从文化方面从哪里开始，请聘请顾问——一个能够倡导并帮助你的人。从那里你可以深入研究\
  \ `NIST` 框架，确保你的团队实现了列表 80% 到 90% 的内容。只有这样，我才会引入外部测试团队。\n\n\n\n\n与此同时，我想说，在红队开始执行测试之前，你应该先给你的员工和同事打个小招呼。比如：“在接下来的四个季度内，一个外部团队将访问我们的员工和基础设施。”我见过许多领导层的信任因此丧失，这通常是因为他们\
  \ (a) 没有在企业文化中将安全作为首要任务，以及 (b) 对自己的团队进行了突击渗透测试。他们仅仅一次失误，就杀死了团队的积极性与价值感。\n\n## 你如何向不情愿或非技术背景的客户或组织解释红队的价值？\n\
  \n如果你是一个黑客或一个极客，我强烈建议你参加一个销售培训课程。这不仅能提升你在红队工作方面的水平，还能提升你人生的水平。然后你就可以运用这些技能来理解：如果你无法阐述你的红队所提供的价值，你就无法说服领导团队中的任何一个人为这项计划投入资金。\n\
  \n## 你看到的**性价比最低**的安全控制措施是什么？\n\nWeb 应用防火墙（`WAF`）可能是我见过最弱的控制措施。如果你不熟悉 `WAF`，它作为一个代理运行在你的\
  \ Web 应用程序之前。它寻找恶意流量，如果检测到，`WAF` 就会拦截该流量。\n\n在实践中，它存在几个问题：\n\n*   `WAF` 并且往往倾向于拦截合法流量。人们试图保护的那些旧应用程序发送的流量确实是合，但\
  \ `WAF` 会将其误判为恶意并拦截这些合法流量。然后你就会花费大量时间来调整 `WAF` 以满足你组织的需求。\n*   最终会有人发现多态攻击并绕过 `WAF`\
  \ 的规则集。\n\n相反，考虑与你的供应商建立合同关系，让他们书面同意在他们的产品中也构建强大的安全叙事，让他们接受来自信息安全社区人士的安全报告，并让他们进行例行且有记录的分析以评估其产品的安全性。这不仅仅是为了法律责任，供应商应该向你传达一个信号：他们正在积极尝试加固产品，并真正想要加固他们的系统。\n\
  \n## 你是否曾经建议过不要进行红队活动？\n\n当然过。如果很明显寻求渗透测试的组织还没有花时间来真正梳理并建立坚实的基础，我曾提议担任兼职 `CIO`，帮助该组织构建其安全计划，从建立他们组织迫切需要的安全文化开始。\n\
  \n我的建议主要让组织围绕 `NIST Cybersecurity` 框架转转。有时我能感觉到该组织内部的紧张局势，我会利用我所开发的“文化黑客”技能集，试图以一种积极的方式打破这种局面。目标是当我离开该组织时，在安全水平和员工技能方面都比我发现它时要好得多。\n\
  \n## 最重要或最易实施、能够防止你攻破系统或网络的控制措施是什么？\n\n我能想到的性价比最高的方案是确保你组织内用户的最小密码长度为 12 个字符。从那里开始，多因素认证以及使用可以安装在桌面和浏览器上的密码管理器将进一步放大这项控制措施的作用。\n\
  \n## 为什么你认为遵守交战规则（Rules of Engagement）至关重要？\n\n违反交战规则可能会导致法律麻烦。这不仅可能让你被抓，还会让你失去信任。信任是第一要货币。没有信任，你所能成就的事情将受到严重限制。\n\
  \n## 如果你在渗透测试中被抓了，你是如何处理的？\n\n如果你在渗透测试中被抓了，你是如何处理的？\n\n\n\n\n\n我会向人们介绍我的发现，但我并不会总是告诉他们应该如何修复问题，而是经常问：“你会如何修复这个？”很多时候，蓝队中会有一位“捍卫者”，他们多年来一直在要求修复我发现的问题！通过提问很多问题并鼓励对话，你可以发现这个人并建立盟友关系。让我告诉你，盟友是想要再次与你合作的。这将为你的职业生涯带来复利效应，因为你过去赢得了他们信任的老同事们会再次来找你。\n\
  \n## 如果你转到蓝队，你防御攻击的第一步是什么？\n\n我的本职工作仍然是在蓝队进行。良好的集中日志记录是必不可少的！除此之外，过滤掉生成的警报以确保你的团队实际上获得的是可操作的结果，这是一项艰巨的工程，需要规划和思考。我见过许多系统尽管已经发送了警报，但仍然被\
  \ `pwned` 了。仅仅是因为过滤不当，蓝队无法确定价值的优先顺序。他们当时就像是在面对消防水管喝水（信息过载）。\n\n### 关于编写良好的报告，有什么实用的建议？\n\
  \n写作是一项非常有价值的技能。不要把它看作一项任务，而是要“黑入”你自己，学习如何编写让人们渴望阅读更多内容的文章和报告。考虑一下，报告将由你所测试组织中的许多高层人员阅读。你的名字在报告上，所以要把这看作是一个营销自己的机会。\n\
  \n想想你曾多少次尽力让你的简历通过 HR（人力资源）防火。在这里，你将与那些 HR 经常阻碍你交流的人会面。利用这一点！学习如何进行高效且有说服力的写作，并记住这项工作是另一种兴趣会在你的职业生涯中不断复利的工作。\n\
  \n我也经常在想，红队何时会开始通过聘佣高才华的编辑/市场营销人员/作家/渗透测试人员来帮助放大他们的结果和报告。如果你的报告看起来平淡且索然无味，为什么不努力让它们看起来很棒呢呢？这只是脱颖而出的另一种方式。\n\
  \n### 你如何确保你的程序结果对于需要完整叙述和背景的人具有价值？\n\n有时，如果房间里的人需要更多背景，我会转向针对某些严重结果运行一个微桌面演习（micro-tabletop\
  \ exercise）。这并不是传统的做法，但作为报告的接收方以及一名技术人员，让别人通过增加背景权重来引导你的领导了解潜在问题非常有价值的。\n\n### 除了指出哪里不足，你还建议如何进行安全改进？\n\
  \n在执行任务期间，作为一个团队，列出一份客户基础设施中导致你遇到问题或阻碍你进展的事项清单。然后，在报告期间利用这份清单诚实地进行有意义的对话，利用这份清单鼓励他们并建立关系。从那里开始，如果有一个系统让你感到迟疑但你最终克服了它，就开始就这个问题开始对话。问问他们，认为可以做什么来把那个减速带变成真正的障碍。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n“请告诉我一次你搞砸并伤害了他人，并且努力恢复那段关系的经历。”这是我经常问的一个面试问题。错误难免发生，我发现优秀的团队和其中的人往往具有很强的自省能力，评估自己的行为并努力让自己变得更好。在某些时候，你会犯错，你会犯错误，你需要承担它。\n\
  \n我并不是在优化那些在面对自己犯的错误时简单就跳过去的人。我想和那些会努力纠正并努力修复团队的人合作。这是我在职业和个人层面都非常看重的一种技能。\n\n###\
  \ 在不同方式解决问题方面，优秀的红队成员与普通人相比有什么不同之处？\n\n创造力和自学是生活中许多层面的要求，但对于一个资历的渗透测试人员来说也是如此。具有探索和尝试理解不同问题领域的韧性至关重要，但更进一步，并以创新的方式应用它，让应用程序或基础设施执行它设计之初并非要做的功能，才是至关重要的。我在职业生涯中见过一些极其精彩的作品，也见证过我个人从未想过要尝试的事情。\n\
  \n所以，带着你的创造力并将其与分享意愿结合。人们喜欢与那些慷慨教他们的人一起工作。这会让你轻松脱颖而出。■\n\n# 16\n\n**Rob Fuller**\n\
  \n> “每个人在这个行业中的道路都是不同的；关键在于获得完成你想做的工作所需要的经验或专业知识。”\n\n![](img/FullerRob.jpg)\n\n\
  **Twitter:** @mubix\n\nRob 拥有涵盖信息安全大部分领域的经验。他曾帮助美国国防部设计、构建和防御网络，并对这些相同的网络进行过渗透测试和红队评估。最近，Rob\
  \ 对财富 500 强公司进行了多次红队评估。他是会议和 CCDC 活动的频繁演讲者、培训师和志愿者。他担任 HBO 剧《硅谷》（Silicon Valley）的高级技术顾问，并在\
  \ Hak5 上主持节目。Rob 获得了许多证书，但他拥有的高于其他一切的头衔是父亲、丈夫和美国陆陆队员。\n\n### 你是如何开始进入红队的？\n\nCraig\
  \ Balding (@craigbalding) 给了我一个加入我第一个红队的机会，事实证明这是我参与过的最有成就感的团队和工作之一。在做这个之前，我做过很多其他职业。我曾是漏洞扫描工程师、渗透测试顾问、1\
  \ 级和 2 级响应人员、取证分析师、防火墙管理员、IT 架构师、值班帮助台技术人员以及 IT 员。我相信拥有这种广泛的经验帮助我获得了这个机会并能够成功面试。你必须走同样的路径吗？完全不需要。我见过一个数学家直接跳过渗透测试摧毁了网络，因为他比网络工程师更懂加密。我曾见过一些全职妈妈突然变成出色的\
  \ SOC 分析师。每个人在这个行业中的道路都是不同的；关键在于获得完成你想做的工作所需要的经验或专业知识。\n\n## 获得红队工作的最佳方法是什么？\n\n\
  申请？这就像是在问如何找工作，泛泛之。红队工作不遵循任何特定的规则。申请这些职位并具备胜任能力。但这正是棘手之处，对吧？首先，你必须相信自己是胜任的；然后你必须说服其他人（招聘人员/招聘经理）你是胜任的。许多招聘经理谈论“黑客心态”。这是一种忽略或扩展某物预期用途的心态。同样的过程也需要应用到找工作上。黑入它。\n\
  \n## 如何在不违反法律的情况下获得红队技能？\n\n\n\n\n\n即使在 2005 年我开始学习安全技术时，也有很多途径可以学习，而不必去犯罪。诚然，在\
  \ BBS 时代和“早期”互联网时代，资源是匮乏的，那个时代的许多人仍将其视为一种荣誉勋章。这没关系；他们只是在当时唯一可行的方法下学习。那个时代早已一去。如果你认为你必须违反法律，那么就是有人误导了你。这确实包含了一个微不足道的假设——即你拥有一台被授权使用的电脑并连接了互联网，而这并非总是如此，特别是在第三世界国家。如果你这两者都不具备，那么那些情况可能仍然存在。我不赞同犯罪，无论我对我自己国家的法律有何看法，违反法律都不是解决问题的方法。\n\
  \n让我收起我的“说教台”，我们来谈谈在 2019 年你实际上可以如何实现这一目标。红队可以由许多不同的技能组合组成，包括路由、交换、`Active Directory`、无线（不仅是\
  \ `802.11`）、物理安全、物联网（`IoT`）、Web、云、密码学、数据库等。你也可以来自广泛的背景，并学习更广泛的主题，这些主题如果放进这本书，就会让它变成一本关于黑客的坟墓。然而，`VulnHub`\
  \ 是我向大多数推荐的地方。在 `VulnHub` 上，你可以下载虚拟机并尝试获取它们的“root”权限。`VulnHub` 的伟大之处在于，即使你只是初学者，也可以下载一个\
  \ `VM`，启动它，尝试一下，发现自己完全不知道从何开始，然后阅读该网站上针对每个虚拟机所提供的无数种技巧报告（walk-throughs）。\n\n多次阅读所有的技巧报告，并按照他们的方法练习获取\
  \ root 权限，最终理解他们为什么要这么做，这没有任何坏处。\n\n## 为什么我们对红队的定义无法达成共识？\n\n因为因为它对每个人来说意义都不同，这没关系。为什么非要有一个精确的定义呢？你能告诉我安全运营中心（`SOC`）的具体细节是什么样子的吗？或者一个医院到底是由什么组成的？我们有很多由通用概念定义的物品集合，这没问题，例如：医院包括急诊室，但并非所有医院都设有长期癌症病房；或者一个\
  \ `SOC` 必须在墙上毫无理由地挂满屏幕！有些是 24/7 全班，有些不是。\n\n这些通用概念在社会上是被接受的。为什么红队也可以是模糊的呢？一个交流词汇的定义是让相关双方都能理解它，而且在大多数情况下，当客户和顾问谈论红队任务时，通过工作说明书（`SoW`）和行动规则（`ROE`）等媒介，他们对于包含的内容有着共识。\n\
  \n## 信息安全其他领域对红队最不理解什么？你听过的关于红队、蓝队或紫队最具毒性的谎言是什么？\n\n我完全不知道信息安全社区/世界/或其他什么地方的人理解或不理解什么。我希望更普及的一种核心价值是：你是一个团队的一部分，该团队的唯一目的是让公司变得更好、更安全。这并不是通过像外人一样指指点点来实现的。公司有漏洞；那就是你的公司（即使你只是一个为他们服务一周的顾问或承包商）。去工作吧。\n\
  \n去工作，做好事，或者建立一家公司并做好事。跑你自己的赛，实现你的个人目标。不要担心信息安全的“其他部分”在做什么，也不要担心互联网上接下来是什么毒性闹剧。这一切都是浪费你的时间。你在地球上的时间是有限的，你选择把这些时间留给谁。随机的安全热点和闹剧完全不值得。\n\
  \n> “跑你自己的赛，实现你的个人目标。不要担心信息安全的‘其他部分’在做什么，也不要担心互联网上接下来是什么毒性闹剧。”\n\n## 应该在什么时候向组织的安全计划中引入正式的红队？\n\
  \n只要他们负担得起就可以。红队就像是人类的人工安全单元测试。大家都知道代码中需要单元测试，一旦需求开始产生或事情开始出现问题，他们就会加入测试。红队也是如此。当你开始需要蓝队的时候，大概也就是你需要红队的时候了。\n\
  \n## 你如何向一个不情愿或非技术的客户或组织解释红队的价值？\n\n倾听。如果你是为了真心帮助一个组织，他们会感受到这一点，而不再犹豫不决。如果他们继续犹豫，说明他们并不想要你的服务；你应该让他们做决定并离开。\n\
  \n## 你看到的性价比最低的实施控制措施是什么？\n\n日志（Logs）。但性价比最高的是什么？也是日志。日志的问题在于，如果你没有精干的团队来查看这些日志，它们就是没用的，而且，你堆在那里的日志越多，成本就越高。所以，尽管在不同语境下，`AV`\
  \ 或 `SEIM` 或其他许多东西可能被认为是不必要的，但它们的成本通常不会像日志那样呈指数级增加费用。\n\n## 你是否曾经建议过不要进行红队任务？\n\n\
  很多次。我做过一个名为 `open source pentesting` 的演讲，在其中谈到了我提供的各种不同服务，我认为其他公司也应该提供这些服务，因为它们比标准的渗透测试、红队评估或源码审计更合适。但根结底，客户是做出购买服务决策的人。建议他们采取不同的做法可能会付之于笑，或者他们有你完全不知道的充分理由。你必须接受这一点。\n\
  \n## 哪种防止你入侵系统或网络的控制措施最重要或容易实施？\n\n良好的密码管理。密码是目前信息安全的祸根。\n\n`2FA/MFA` 是一个解决方案，但它仍然很麻烦，或者无法整合到公司使用的身份平台中。我们执行的大多数渗透测试和红队评估都是从某种初始切入点开始，然后寻找凭据——`API\
  \ keys`、`SSH keys`、`密码`，任何可以让我获得比切入点更高权限或更多访问权限。这就是为什么我认为公司应该要求对工作身份验证使用密码管理器；这包括\
  \ `API keys`（密钥库产品有助于实现这一点）。一种强制执行此的方法是将内部密码最小长度设置为 40 个字符。初始登录（为了进入密码管理器）可以通过智能卡、`FIDO`\
  \ 或另一种基于令牌的产品完成。现在的移动设备也可以作为 `FIDO` 设备，这将消除部署和管理一组用于身份验证设备的需求。\n\n## 为什么你认为遵守行动规则（RoE）至关重要？\n\
  \n因为如果不遵守，在美国将是刑事犯罪，而且责任保险也是有限的。它还是一份双方认可的文件（行动规则）。\n\n## 如果你曾在渗透测试或其他任务中曾被抓到，你是如何处理的？\n\
  \n这种情况经常发生，虽然我很生气（主要是生气自己在某些方面的愚蠢），但很快就会转变为对防御团队所部署措施的钦佩。我做过一个名为 `Attacker Ghost\
  \ Stories` 的演讲，讲述了多次被抓获的经历。我最喜欢的故事之一源于一个 `honey pot`（蜜罐程序）。\n\n\n\n\n\n很久以前，在一个遥远的红队中，我的团队从一次网络钓鱼演练中获取了几组凭据，我想在我发现的一个\
  \ Web 页面上测试这些凭据，该页面显示了一些表明活动目录（Active Directory）认证正在运行的指标（例如 `DOMAINjdoe`）。我开始使用团队获取的每组凭据进行测试，看看这些凭据是否有效，以及它们是否为该应用提供了更高级别的访问权限。我们团队不知道，这个页面并没有连接到任何后端，更不用说活动目录了。然而，它会向管理员告警我们针对该页面尝试的每一个用户名和密码，以便他们禁用这些账户并更改密码。该页面是由系统管理员设置的，而不是蓝队（防御团队），目的是为了捕获泄露的凭据。不不说，我们的团队对我非常不满，因为我毁掉了他们所有的工作成果。\n\
  \n## 在执行分配的任务期间，你经历过的最重大的伦理困境是什么？\n\n我曾测试过一家律所。这是一次内部测试，响应人员对这个行业还是新手，所以评估过程非常快。我正坐在那里破解域密码，以便访问评估的目标数据（他们案件数据存储系统中的虚拟案件记录），这时我破解了该律所一名高级合伙人的凭据。\n\
  \n密码是 `poisonedher`。这让我大吃一惊。我该何是？我应该报警吗？如果我报警，我该告诉警察什么？我没有任何违规行为的证据。这个人是否承认（因为他们每天都会偷偷输入密码）他们正在毒害或已经毒害了某地的女性？还是说他们只是真的非常喜欢杀人谜小说？我向律所的项目对接联系人表达了我的担忧，但在整个测试的整周时间里，我都在纠结是否要告诉其他人。几个月后，那位合伙人离开了该律所，这是我关于该主题获得的最后信息。这个故事直到今天仍让我脊背发凉。\n\
  \n## 红队是如何协作完成任务的？\n\n它是一个团队，就像任何其他团队一样。团队结合长处弥补短板，而且每个团队都是不同的。适用于我团队的方法可能不适用于你的团队。良好的领导力以及在尝试新事物时使用“快速失败（fast-fail）”的方法来寻找最适合你们的方案，过去对我都非常有效。在记录发现结果时，大多数团队成员使用什么平台？是\
  \ `Microsoft Word`、`OneNote`、`Google Docs` 还是 `Etherpad`？这完全取决于风格、个人喜好和效率。关于什么有效、什么无效以及下一步尝试做什么的沟通至关重要。\n\
  \n## 在行动完成后，你对蓝队进行汇报（debriefing）和提供支持的方法是什么？\n\n这很简单。尽可能多给他们。每个人都有日程要遵守，但如果有无限的时间，我会和每一个客户去现场，修复我在执行任务期间发现的每一个问题。在安全人才方面，现在的每家公司都人手短缺。多一份力量，对发现的问题了如指掌（因为是你自己发现的），并表现出寻找合适的人和正确修复方案的努力，在这个行业比比过桌子上扔报告要有帮助巨大得多。\n\
  \n## 如果你转到蓝队，更好地防御攻击的第一步是什么？\n\n这取决于对“蓝队”的定义。如果指的是事件响应，那么我会做的是转发 `Windows event\
  \ logs`，在我的整个系统群部署 `Sysmon` 和 `OSQuery` 以连接中央日志服务器，并设置告警。我不认为这样做很多，因为这是一个免费的解决方案，且部署需要专业知识（这种人才需求很大）。\n\
  \n“闪烁的盒子”（Blinky boxes）仍然是信息安全的重点，因为如果出现问题，会有专家来实施和修复。\n\n如果蓝队指的是泛指的安全团队，那么我将关注制定安全策略，例如最小密码长度以强制使用密码管理器和\
  \ `2FA`。我不认为这样做足够充分，因为获得批准需要花费大量精力，而且通常是一个高度政治化的过程。\n\n## 关于编写良好的报告，你有什么实用的建议？\n\
  \n与你的客户合作，确定最有益的报告媒介。虽然行业标准是 40 页的报告，但不必非如此。许多公司更倾向于将报告直接导入工单系统。其他公司则倾向于以幻灯片形式提供报告，并在会议中进行评论。如果你从不讨论最高效的方法，你就不会做出任何改变，可能只是给了他们另一个会被忽略的\
  \ `PDF` 或 `DOCX`。\n\n## 你如何确保你的项目结果对需要完整叙述和背景的人具有价值？\n\n反对！这是在诱导证人！严肃地说，我们行业里是一群懒惰的人。我们花大量时间在自己认为有趣且有价值的事情上，而编写报告、发现项以及向他人解释我们的发现是非常枯燥的。我们只想发现问题然后互不打扰。我们必须克服这一点。这就像在麦当劳工作，坐在那里只做我们想吃的东西，而不是被点点的食物。成熟的一部分是学到工作就是工作，因为它涉及到对你以外的人有益的事情。下功夫找出漏洞，记录是如何发现这些漏洞的，然后花时间研究修复方案（可能的话研究多个），并测试这些修复方案。我测试过各种针对常见漏洞的“行业认可”修复方案，但它们根本无效或只有部分有效。投入工作，花上时间。你付工资是为了让客户变得更好，而不是展示你有多酷。\n\
  \n> “成熟的一部分是学到工作就是工作，因为它涉及到对你以外的人有益的事情。”\n\n## 在招聘和面试红队成员时，你会寻找哪些非技术技能或态度？\n\n我想，极度的好奇心可能是我在候选人中寻找的首要非技术技能。如果你不好奇，你就不会去翻阅手册，寻找那个未受身份验证保护的\
  \ URL，或者在数万个共享中恰好有一个 `PASSWORDS.XLS` 文件。我会在红队评估期间经常利用我永无止境的好奇心去探测一切和任何事情（在授权范围内）。\n\
  \n\n\n\n\n## 在以不同解决问题方面，优秀的红队成员与普通人脱颖而出的区别是什么？\n\n在我看来，我见过的成功与不成功的人之间，最显著的区别在于寻求帮助的能力。寻求帮助的能力并不像听起来那样那么自然。当你深陷网络或安全漏洞的泥潭中时，很难开口寻求帮助，或让别人接触你的“秘技”。放下这种自豪感能让红队成员走得更远、学得更多，并在整体上取得更大的成功。■\n\
  \n# 17\n\nPatrick Fussell\n\n> “通过在会议上演讲、写博客文章、发布白皮书以及为开源安全工具做贡献来展示你的能力，都能让招聘经理轻松判断你是否合适。”\n\
  \n![](img/FussellPatrick.jpg)\n\n**Twitter:** @capt_red_beardz\n\nPatrick 目前担任红队操纵员，拥有超过\
  \ 10 年的 IT 经验。在完成美国海军陆战队的服役期后，Patrick 开始担任信息安全顾问，最终转向了更专注于渗透测试员的角色。Patrick 曾多次受邀提供各种服务，例如自定义安全评估和渗透测试的设计与实施。在职业生涯中，他执行了全面测试的所有阶段，包括漏洞测试、基于网络的安全以及基于互联网的\
  \ Web 应用安全评估。\n\n## 你是如何开启红队生涯的？\n\n我会称之为一系列幸运的事件。长期以来，我一直将职业目标指向红队。我最初从安全分析师开始做，然后转为全职渗透测试员。我知道在某个时刻，当我以正确的方式培养了自己的技术技能栈后，我可能想跳槽到红队领域。因此，我专注于学习我认为可能对我进入这类职位有帮助的知识。当我开始关注就业市场时，我的几个朋友同时也转到了红队岗位。在经历了几次实实的面试后，我获得了近乎愚蠢的运气。我在飞机上坐在一位招聘经理旁边，他当时正在寻找一个像我这样的人加入红队。我们进行了一次长时间长谈，非常像是一场非正式的面试。大约六个月后，我加入了。\n\
  \n## 获取红队工作的最佳方法是什么？\n\n这似乎需要准备与机会之间的某种交集。准备来自于掌握让你成为优秀候选人的技能。到达那个特定位置有很多路径。我之所以这么说，是因为我认为一个理想的红队内部具有某种程度的专业化。你们会有不同背景和技能栈的人共同工作，因为没有人能无所不知。优秀的红队成员可以来自许多不同的学科。可能有一些基础技能栈能让候选人更有竞争力。我确实认为每个人都需要学会写代码。也许不是每个人都必须成为顶尖开发者；然而，代码是计算机的语言，你必须生活在计算机的世界里。与优秀的系统管理员类似的技能栈也是很有用的。\n\
  \n这种列表可以一直写下去。从网络到 Web 应用的一切内容都会定期发挥作用。归根结底，要点在于，作为攻性安全团队的一部分，你可以以有趣的方式利用你的技能。通过在会议上演讲、写博客文章、发布白皮书以及为开源安全工具做贡献来展示你的能力，都能让招聘经理轻松判断你是否合适。\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n关于这个问题的廉价答案是像我做的那样，做几年渗透测试员。这可以是开发正确技能的绝佳乐场。我很幸运能有一份渗透测试的工作，其重点始终是以目标为导向的，并强调后渗透和横向移动。但我认为每个人都有这种机会，所以我认为应该关注这样一个观点：你用于红队的很多技能从本质上并不是非法的。它们看起来可能很违规。\n\
  \n\n\n\n在某种程度上，一个优秀的信息安全（InfoSec）计划看起来就像一个非常严密的系统管理小组。由于组织开发计划的方式多种多样，以我的视角来看，很难为你提供一个良好的基础，来识别周期中的某个点并让你说：“是的，就是这里，我们达到了。”我能说的是，拥有信息安全计划并准备好进行红队对抗的组织，似乎对整个\
  \ IT 环境及其运营的几乎每个方面都具有极佳的可见性。他们可以参考资产的数量和类型。他们理解不同的运营部分是如何开展业务的，并与其运营部门的日常工作保持密切联系。如果我参加范围会议并开始询问有关网络的问题，结果却一片死寂（满场虫鸣），因为没有人知道网络的哪个部分归谁所有，那么这就是红灯。\n\
  \n## 你如何向不情愿或非技术性的客户或组织解释红队的价值？\n\n一个很好的起点是将其与物理安全联系起来。首先尝试理解这些人从广义上如何考虑安全性的，并找到其与信息安全的联系。你会在门上装锁吗？为什么？你会比其他地方更用心地守护建筑的某些部分吗？背后的逻辑是什么？红队的诞生源于这样观点：你需要以应用的方式来测试物理安全等项目，因为模糊的练习并不总能暴露参与者的真实反应。信息安全在这方面也大无相同。关键区别在于，信息安全攻击者的风险几乎为零，而回报极高。\n\
  \n### 你看到的性价比最低（bang-for-your-buck）的安全控制是什么？\n\n虽然我确定有很多糟糕的产品，但大多数类型的安全控制都能提供价值。如果你不将更多的投资投入到设置、配置和真实测试上，你的投资回报率就会很低。多年来，我进行过很多讨论，内容是：“为什么\
  \ `X` 控制没有检测到你？”对此我的回答是：“嗯，这取决于你到底从这些系统中记录了什么，”结果得到的往往只是耸肩和沉默。如果一个报警系统没有正确的日志，它又有什么用呢？\n\
  \n### 在防止你攻破系统或网络的控制措施中，最重要或最易于实施的措施是什么？\n\n系统级防火墙规则。限制系统之间的通信能力可以使网络中的横向移动变得困难或不可能。从规划和技术角度来看，执行这可能很难，但我认为如果做得得当，它将提供巨大的价值。我经常问人们：“你们的工作站需要通过端口\
  \ `X` 进行通信吗？”答案几乎总是否定的的。\n\n### 为什么你觉得遵守作战规则（Rules of Engagement）至关重要？\n\n由于我们所服务的组织具有复杂性，攻击性安全测试非常微妙。在很多地方，你很容易在无意中甚至在意识不到的情况下偏向具有破坏性的行为。你如何能确保你只测试了属于目标组织的资产？这可能是一些简单的事情，比如发送一封钓鱼邮件，说公司将在某特定日期执行某些行动。测试人员知道这是假的，但并非所有收件者都知道。这可能会导致公司内部产生一些严重的混乱。设定有助于避免这些情况的基准规则有利于所有方，并保护所有利益相关者的利益。\n\
  \n### 如果你曾在渗透测试或其他任务中被抓了，你是如何处理的？\n\n我宁愿不要重温那个时刻。\n\n### 在执行指定目标时，你经历过最大的伦理困境是什么？\n\
  \n我一次在浏览聊天日志时，发现了我的一家公司两名员工之间存在婚外情的证据。这段对话中包含了与任务相关的数据。我试图避免将这段对话包含在报告中，但客户对数据源感兴趣，且日志在对话中反复出现。这涉及到我在在任务执行期间可能拥有的高权限，而在保护数据和隐私方面的法律和伦理义务上上了一门急课程。这是多年前的事了，但直到今天想起来仍然让我感到不安。\n\
  \n## 红队是如何协作完成任务的？\n\n我来自军方背景，所以我倾向于认为团队中有一个充当支持者的经理。经理负责确保所有人都都理解了任务和分配，并确保朝着目标的进展一直在进行。经理确保人员被分配到他们最擅长的任务上，并确保这些人拥有完成工作所需的确切资源。作为团队的一员，我发现自己的关注点往往是信息共享。确保每个人都知道我所知道的通常会让任务更成功。任何合作过团队的人都可以告诉你，这比听起来要困难得多。\n\
  \n### 在行动完成后，你对蓝队进行总结（debrief）和支持的方法是什么？\n\n这通常基于对客户需求的理解。通过洞察其优势、劣势和能力，意味着我可以花更多时间提供更具体的数据，这些数据对客户受益最大。与此一致，与合适的人建立一些关系可以实现这种行为。例如，了解一个团队是如何实现某种特定告警的，让我能够花更多时间检查我们执行的某些他们可能错过的的活动。这可能在日志和报告中被突出，但如果沟通方式不当，也可能被忽视。\n\
  \n### 如果你转到蓝队，你防御攻击的第一步是什么？如果这还没有被普遍执行，你认为为什么？\n\n我想我会研究实施严格的基于主机的防火墙限制。似乎在仍然允许系统管理和监控的情况下执行此操作，可能是一项复杂且困难的任务。搞砸会导致很多严重的问题。\n\
  \n### 关于编写良好的报告，有什么实用的建议？\n\n我多年来总结出的最佳实践是，在执行任务的过程中尽可能多地编写报告。这会迫使你慢下来，思考你想在笔记中记录的内容，并最终写出更准确的叙述。如果你在结束时能把精力放在文本质量、细节和格式上（因为你在过程中已经完成了大框架），客户就能获得更好的产品。\n\
  \n### 你如何确保你的计划结果对需要完整叙述和背景的人有价值？\n\n这只需要保持写作目标的视角。是的，谈论你获得的所有酷炫的 shell 很有趣，但你写的每一个句子都必须有一个目的。这个目的是帮助你的客户。如果你不能证明你所写的论点对你的客户有用，那么你只是在吹牛。\n\
  \n### 除了指出哪里不足，你如何建议改进安全措施？\n\n思考我将如何检测自己的横向移动技术等细微细节，是一个合理的起点。理解擅长某些事情（如告警）的人是如何做到的，意味着我可以提供更好的反馈。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n\n\n\n表达复杂技术理念的能力。即使与具有相似技术背景的人交流，讨论复杂技术问题的能力也是和其他任何技能一样的技能。精通此道需要专注和努力。精通此道意味着你是团队中更有价值的资产。想象一下红队行动的各个阶段，由于团队成员能够以简洁明了且每个人都能理解的方式传达困难的想法，会有多少次让事情变得顺利或成功的机会。我认为这比大多数人愿意承认的挑战性大得多。\n\
  \n## 在以方式解决问题方面，优秀的红队成员是如何与众中脱颖出的？\n\n这似乎与避免假设自己知道某事是如何运作的能力有关。优秀的红队成员通常喜欢真正深入研究某事以理解其工作原理。■\n\
  \n# 18\n\n### Chris Gates\n\n> “挑战自己去学习新技术，并找到一种通过演讲、博客文章、播客、白皮书、导师指导等在更广泛的范围内分享知识的方法。”\n\
  \n![](img/GatesChris.jpg)\n\n**Twitter:** @carnal0wnage\n\nChris Gates 十多来一直通过网络和\
  \ Web 应用渗透测试、红队行动和对抗模拟在职业领域从事“破坏”工作。如今，Chris 将时间平分，担任破坏者和修复者。Chris 是 `WeirdAAL`（一个用于\
  \ `AWS reconnaissance` 的工具）的共同作者，并对他开源项目做出贡献。Chris 曾在美国陆军学院、BlackHat、DEF CON、Wild\
  \ West Hacking Fest、Toorcon、Brucon、Troopers、SOURCE Boston、Derbycon、LasCon、HashDays、HackCon、Bsides\
  \ ATL、YSTS、IT Defense、OWASP AppSec DC、Ruxcon、Cactuscon 和 Devops Days 进行演讲。Chris\
  \ 还是 `NoVAHackers` 的联合创始人。\n\n### 你是如何开始红队工作的？\n\n2007 年，我从现役陆军官转变为`美国陆军` 红队的政府承包商。那时，各军种的红队与其他政府机构的红队几乎是市面上唯一的红队游戏。大多数咨询公司都在做渗透测试工作，但商业公司并没有面临当时政府/军方面临的来自\
  \ `APT` 组的威胁。我的大学学位（计算机科学）、在军队的工作（信号兵官）以及与 `Joe McCray` 和 `LearnSecurityOnline`\
  \ 的合作为我提供了足够的背景和实力，让招聘经理愿意在我身上冒险。回想起来，我当时不知道的事情是多得令人发笑，但我愿意学习，并投入时间学习我能学到的一切，并听取我的导师关于如何在该领域成长和成熟的建议。\n\
  \n我真正的红队教育是从加入 `Lares` 开始开始的。从那里开始，我真正接触到了三大支柱——社交、电子和物理——之一的弱点如何导致其他支柱的弱点，以及公司为这三个支柱部署保护的众多方式。\n\
  \n剩下的就是历史了（在 LinkedIn 上）。\n\n## 获取红队工作的最佳方法是什么？\n\n投入时间和努力来获得经验。在红队三大支柱（社交、物理、电子）中的一个或多个方面证明你的能力。与人建立人脉，寻找导师帮助你填补知识空白，并愿意完成他们建议你做的工作以达到下一个水平。挑战自己去学习新技术，并找到一种通过演讲、博客文章、播客、白皮书、导师指导等在更广泛的范围内分享知识的方法。\n\
  \n如今，即使在普通的安全咨询公司，你很可能也能参与社会工程甚至物理访问攻击。所有的行动和经验都是宝贵的，因为你永远不知道你在之前的某个行动中做的某事何时成为你在当前行动中成功的关键。\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n社会工程和物理访问技能在没有在职培训的情况下获取更具挑战性。社会工程 `CTFs` 存在，还有像 `TOOOL`\
  \ 这样的组织可以帮助人们更好地进行锁或物理访问攻击。最终，你需要一份“免死金牌”来进行行动。\n\n在电子攻击方面，存在大量机会，包括夺旗赛 (`CTF`)\
  \ 活动、漏洞赏计划、可攻击系统（`Hack The Box`、`VulnHub`、`tryhackme` 等）、漏洞软件库以及本地虚拟机 `Docker` 容器。结合数千小时的视频和在线培训，资料多得超出预期。\n\
  \n## 为什么我们对什么是红队没有共识？\n\n最有效的方法是不浪费时间。诚实地说，如果你必须推推拉拉、手把手教和说服，那么该组织还没有准备好接受或实施红队行动会发现的任何事情。\n\
  \n## 其他安全人员还不理解红队的哪一点？关于红队、蓝队或紫色队，你听过最有害的言论是什么？\n\n我在陆军时的一位营长（类似于 CEO）曾说，在任何一天，当现役、平民或本地人都要好，这句话一直影响着我。\n\
  \n有害言论 1：任何一种颜色都比其他颜色好。也许周一红队更好，但周二可能哪种都不好。没有一个的成功和工作，另一个就不可能成功。\n\n有害言论 2：大多数人喜欢红队。对大多数组织来说，红队是一种忍受。通常情况下，他们做的只是识别损坏的东西并将其加入不断增长的堆中。我在该行动中做得越好，我扔进堆里的东西就越关键、越痛苦。\n\
  \n## 什么时候应该在组织的安全计划中引入正式的红队？\n\n当组织已经从反应性安全模型转向主动安全模型时。此外，该组织应该已经过几次常规渗透测试。如果你的渗透测试人员经常进来并捣毁一切，那么让某人通过社会工程进入或撬锁进入并进行同样的电子攻击，花费两到三倍的价格又有什么用呢？\n\
  \n\n\n通常情况下，一个机构如果将 ISO 27001 风险评估与渗透测试相结合，以验证风险评估控制问题的回答是否准确，其效果会比单纯好得多。一个拥有控制问题答案、配套策略/文档以及验证每项控制措施的渗透测试结果的公司，其对安全态势的理解将比那些直接闯入数据中心并带走一台服务器的人要深刻得多。\n\
  \n### 能够防止你破坏系统或网络的最重要或最易实施的控制措施是什么？\n\n多因素身份认证。理想情况下，用户名和密码不应让你访问外部环境中的任何内容，在可能的情况下也不包括内部环境。这项技术已经足够成熟，针对应用程序的\
  \ `2FA`、`SSH` 和 `SAML` 认证实施门槛并不高。\n\n### 为什么你认为遵守交战规则（Rules of Engagement）至关重要？\n\
  \n为了能让客户支付你的发单。一个良好/正确的红队交付规则应该提供非常广泛的攻击选项。如果你的红队测试不允许物理攻击或社会工程学，那么你做的是渗透测试，你绝对应该严格遵守\
  \ `ROE` 的边界。\n\n### 如果你在渗透测试或其他任务中被抓到，你是如何处理的？\n\n我被抓过很多次。我是如何处理的？否认、愤怒、讨价、抑郁和接受。接受之后，你要振作起来，反思自己哪里搞错了，更新操作技术（如果适用），为被抓到买酒道歉，然后继续。以授权方式做这些事情的妙之处在于，在你被抓到后不会有奇怪的人来敲你的门。\n\
  \n> “我被抓过很多次。我是如何处理的？否认、愤怒、讨价、抑郁和接受。”\n\n### 在执行指定目标时，你经历过的最大的伦理困境是什么？\n\n我做过一份工作，客户由于大量的配置错误和糟糕的安全实践，导致信用卡被盗。据我所知，他们没有向任何一家信用卡公司或其他任何人主动报告此事。我曾想举报他们，但最后没有这样做。我只能希望他们的审计师会处理这件事。\n\
  \n从宏观层面来说，作为渗透测试员或红队成员，你在职业生涯中会看到非常糟糕的事情。你受限于 `NDA`（保密协议），尽管你所处的处境可能极其荒谬和疯狂，你仍有责任保护你的客户及其信息。\n\
  \n## 红队是如何协作完成任务的？\n\n任务负责人负责管理团队成员之间的工作负载，并对任务拥有最终决定权。团队成员在报告中为各自分配的工作编写相应章节。任务负责人进行最终编辑。这隐含的任务是创建一个拥有各种技能组合和成熟度的团队，以处理任务中的各项不同工作。\n\
  \n### 在行动完成后，你如何对蓝队进行总结（debriefing）和支持？\n\n“我们都是同一团队的。”我与新团队开会时会用类似这样的话开头。如果你在内部红队，这会容易一些，但作为顾问，你也将把公司的利益放在首要位置。我会解释说，这并不是为了让某人解雇或陷入麻烦，或者“说他们的孩子得丑”，而是我们致力于在真正的坏人之前发现可以改进的地方。\n\
  \n## 如果你转到蓝队，你防御攻击的第一步是什么？\n\n我在我的上一份工作中做过这个。我致力于为我一旦进入主机进行主机枚举、后渗透以及然后横向移动时会做的常见操作添加检测规则。那些规则后来派了大用用场。\n\
  \n### 关于编写良好的报告，有什么实用的建议？\n\n讲述任务的故事。报告的阅读者很可能不在现场，你想让他们理解红队任务是如何进展的。在可能的情况下，报告应包含足够的细节，让组织中的任何人都能拿着该报告并重现攻击的电子部分。\n\
  \n### 除了指出不足之处，你还如何建议安全改进措施？\n\n如果你所处的位置和环境允许提供修复链接、代码段或针对问题提交（优选）`diffs`（差异文件），这将非常有帮助。根据我的经验，大多数人都在意他们做的工作；这实际上是一个时间问题。大多数\
  \ IT 人员有一百万相互竞争的需求。当渗透测试/红队提交大量发现时，这是在堆积增加更多内容，他们需要研究更多修复方法，并分配更多时间来修复。如果你能提供更改配置文件的行、具体的应用补丁或更新后的代码，将会有巨大的帮助。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n我寻找的几个非技术技能或态度：承认错误的能力和意愿、愿意更新知识库/技能集，以及谦虚。他们必须能够接受从团队最初级成员到\
  \ CEO 的批评。大多数人对上级没有意见，但在“团队”中，每个人都应该拥有同样的发言权，由任务负责人或团队负责人做出最终决定。如果你是那种因为某人的资历而忽视其意见的人，我没时间理你。如果你是所谓的“天天赐给红队的礼物”，我也有类似的感觉。\n\
  \n> “如果你的渗透测试人员经常进来并捣毁一切，那么让某人通过社会工程学进入或开锁进入有什么用呢？”\n\n### 在处理问题方面，优秀的红队成员与普通人有何不同？\n\
  \n与我面试时时寻找的特质相同：承认错误的能力和意愿、愿意更新知识库/技能集，以及谦虚——加上经验，以及在脑暴任何特定问题的方法时调用这些经验的能力。\n\n\
  # 19\n\nBrian Genz\n\n> “我认为如果你想获得红队工作，最重要的三件事是决定自己可以，决定自己属于这里，并决定自己将克服过程中遇到的任何障碍，最终作为红队的一员出现在彼岸。”\n\
  \n![](img/GenzBrian.jpg)\n\n**Twitter:** @brienz\n\nBrian Genz  Splunk 的红队。他在国防情报、制造业、金融和保险等多个领域拥有安全经验。Brian\
  \ 在安全评估、漏洞管理、安全架构以及 `DFIR/威胁狩猎` 领域工作过。他还是美国陆军预备役队的情报官，专注于网络安全，并在 GTK Cyber 的黑客培训“网络安全应用数据科学与机器学习”担任讲师。他拥有两个研究生学位，`MBA`\
  \ 和信息技术硕士 `MS`，以及多个行业认证。\n\n**你是如何开始接触红队的？**\n\n我走了一条非常非传统的攻击安全路径。我于 2010 年刚从伊拉克尼尼韦省的部署归来，在那里我有幸担任了一支长程侦察（LRS）连的指挥官。回到后不久，我在一家全球性制造公司的\
  \ IT 基础设施小组工作。\n\n\n\n\n我很快意识到自己陷入了一个极其棘手的境地。在应对 IT 外包留下的持续差距、普遍性盲点和知识流失时，我所获得的痛苦且不易的知识和经验，似乎是一条无止的、无法逾越的挑战链。我经常思考这种环境在心理和情感上是多让人挫败，并经常在脑海中将其与几年前在美陆军游兵学校（U.S.\
  \ Army Ranger School）期间的低谷进行对比。\n\n尽管我当时并没有预见到自己正在经历什么，但现在显然，我遵循了佐治亚州达尔隆纳加（Dahlonega）山地阶段的心理准则：“继续移动。不要放弃。一次解决一个问题，脚踏实地。一直坚持下去。”\n\
  \n我还遵循了自己解决难题的本能，保持持续学习，并不断寻找为我的工具箱增添“一套独特技能”的方法。\n\n需要某种程度的审慎且受控的疯狂，才能坚持这种事件驱动的解决问题的方法，直直到面对决策点这种极其危险的边缘，例如：“我是否应该想办法获得访问\
  \ `ACF2` 和主机环境的权限，以解决一些似乎没人愿意或能够修复的棘手身份和访问管理 (`IAM`) 问题？”（“而且我是否应该在请求中提到，我对 `ACF2`\
  \ 或主机一无所知呢？”）卷起袖子，埋头工作，解决问题……这种强迫性的无畏可能是不理性的，但我总认为，如果我不小心删除了所有东西并被解雇，我还可以回去去挂干墙板。`IBM\
  \ Redbooks` 和 Google 曾一度是我的朋友。\n\n我们并不总是知道一条路会通向何方，或者在旅途中会遇到谁。随着我在遗留主机系统和新企业 `IAM`\
  \ 系统上进行 `IAM` 故障排除工作的自然延伸，我开始与全球安全团队进行越来越多的互动。这使我获得了信息安全领域的第一个全职职位，而这仅仅是因为我对解决棘手问题近乎疯狂的痴迷。\n\
  \n由于全球安全团队规模相对较小，我有机会从零开始，专注于漏洞评估和 Web 应用测试，甚至在需要时协助取证工作。我突然有了新任务，地平线上出现了一系列新的职业发展目标，以及对理解这一切运作方式的狂热痴迷。但对我来说，最重要的是，我与生俱保护本能与更广泛的专业社区归属之间的自然契合——这个社区的人和我一样，具有内在的动力和驱动力，竭尽全力去保护我们服务的组织以及依赖我们组织的人。\n\
  \n## 获得红队（Red Team）工作的最佳方法是什么？\n\n我认为，如果你想获得红队工作，最重要的三件事是：决定你可以行，决定你属于这里，并决定你将咬碎途中遇到的任何所有棘手障碍，最终无所畏惧作为红队的一员出现在彼岸。\n\
  \n在追求红队工作的过程中，你第一个需要说服证明你有能力、有价值并愿意为了长远目标在幕后苦干而坐住的人是你自己。\n\n一旦你与你那个最严厉的批评者达成了这些条款，你就可以开始识别从你现在所在地到你目标地之间的一个或多个跳板节点了。\n\
  \n## 如何在不惹麻烦的情况下获得红队技能？\n\nAndy Hunt 写过本名为 `Pragmatic Thinking: Refactor Your Wetware`\
  \ 的书，书中的概念帮助我制定了一份路线图。虽然无疑还有许多其他有用知识，但书中与你成为红队目标最相关的方面是 Stuart 和 Hubert Dreyfus\
  \ 开发的技能获取“德雷福斯模型”（`Dreyfus model`）。这些研究人员正试图通过构建能够像人类一样学习的软件来提高人工智能的水平。Hunt 列出了这五个阶段：`新手\
  \ (Novice) > 高级新手 (Advanced Beginner) > 熟练 (Competent) > 精通 (Proficient) > 专家 (Expert)`。\n\
  \n关于该模型的一个重要说明是，根据所需的特定技能，你会处于不同的水平。例如，你可能是一个`精通`Linux 系统管理员，一个`熟练`的 Python 开发者，以及一个`新手`级厨师。如果你将此模型应用到获得红队职位的目标，网络、系统管理和脚本能力等基础技术技能可以加速你的进步。\n\
  \n配备了规划所需技能的结构化方法，你准备好识别一组与攻击安全相关的精选培训资源。以下是一些你可能感兴趣的有用资源：\n\n* `SANS.org`\n* `Cybrary.it`\n\
  * `PenTesterLabs.com`\n* `github.com/enaqx/awesome-pentest`\n\n从`新手`迈向`熟练`的关键在于持续的、刻意的实战练习。这些资源将提供丰富的指导，使你能够根据可用资源规划路线。\n\
  \n几项指导原则将帮助你在开发攻击安全技能时避免刑事和法律问题：\n\n* “首要是不造成伤害。”\n* “不要进入你不拥有或没有合法访问权限的地方。”\n*\
  \ “如有疑问，请参考第一点。”\n\n### 为什么我们对什么是红队无法达成共识？\n\n人人有异。它会自我解决的。与许多更成熟的专业学科相比，信息安全是一个相对新兴的领域，对于哪种定制方法最好，仍然存在各种强烈的观点。\n\
  \n## 其他信息安全领域的人对红队还有什么是误解？你听过的关于红队、蓝队或紫队最有毒的谎言是什么？\n\n\n\n\n\n通常情况下，我尽量避免泛泛而谈。对于我所熟悉的红队，我希望人们了解的一点是：有一群技能高超、低调的专业人士，他们深耕于帮助组织减少攻击面、提升安全态，并增强组织在保护其服务人群的同时实现其使命的能力。\n\
  \n## 何时应该在组织的安全计划中引入正式的红队？\n\n我看得出回答这个问题有多种有效的方法。有些人可能会建议组织在将红队加入其中之前，先满足一系列渐进的“关卡”或里程碑。例如，我通常认同这种观点，即关注基础知识至关重要的，比如关注资产清单、补丁、`IAM`、备份等阻击和执行层面的组件。然而，这个问题暗示了一个从\
  \ `CMM Level 0` 到 `CMM Level 1` 及以上的顺序性、向上的演进。这种论点的逻辑结果可能是得出类似这样的结论：“因此，我们可以看到（随着激光笔的光点自信地跳到第\
  \ 42 页幻灯片的右上象限）在这里，在达到这种成熟水平之前，部署复杂的红队能力是不明智的。”\n\n如果我担任一天的重大决策部长，我会采取另一种方法。首先，我会谦虚地向各位提议这样一个想法：这种论证中存在一个固有的虚假两难，即我们必须在选项\
  \ A（“将有限预算的最后几分钱用于最终解决资产清单”）和选项 B（“释放全范围的红队”）之间做出选择。我认为，认为这种建议将可用选项的光谱不准确地缩小为这两个极端是够合理的。\n\
  \n其次，我对“地面真实情况”（Ground Truth）感兴趣。我想知道——不，我*需要*知道现场的情况如何，无论它多么绝望。而且，如果现场情况糟糕，我特别想知道这一点。我们需要维持一个共同的操作视图，了解何时以及何地存在弱点、暴露、配置错误、新出现的缺陷实践等。如果我们不部署利用进攻性安全技巧来主动寻找防御漏洞的红队能力，我们就允许可以避免的盲点存在、恶化并可能被触发。\n\
  \n因此，建立或引入红队能力应该越早越好，这样领导层就能通过信任的顾问而不是陌生人来了解安全暴露。在所有基础工作之前由于基础设施管理的这些阻击和执行方面不太可能是“解决后就可以置之不顾”的活动，因此使用红队来识别弱点是可以接受的。\n\
  \n## 如何向不情愿或非技术的客户或组织解释红队的价值？\n\n我发现，描述团队提供的服务组合，并将这些服务置于组织使命和目标的背景下（这些目标可能受到重大安全事件的影响）是有帮助的。\n\
  \n如果服务止于“这是你的 400 页 PDF，祝你好运，我们明年见（还是用我们刚刚用过的那套东西）”这一步，那么无论叙述如何展开，精明的客户或高管都无法看到其价值。在这种情况下，团队本质上提供的是一种让自己保持持续工作的服务，而不是一种为客户带来积极变化的服务。鉴于有远见的红队服务消费者所拥有的选择，这种方法的寿命是有限的。\n\
  \n## 你看到的实施效益最低的安全控制措施是什么？\n\n通用型杀毒软件（AV）。\n\n## 能够防止你破坏系统或网络的最或最易实现的控制措施是什么？\n\n\
  我认为一种方法是结合使用以下措施：\n\n*   实施最小权限原则\n*   在 `Add/Move/Leave` 事件期间建立并积极维护管理访问的有效流程\n\
  *   使用 `2FA`\n*   通过对手模拟和红蓝对抗演练积极提高检测和响应的有效性\n*   限制横向移动\n\n## 为什么你认为遵守规则（ROE）至关重要？\n\
  \n遵守规则（ROE）至关重要，因为这区分了攻击方和防御方。我们需要维持一个共同的操作视图，了解何时以及何地存在弱点、暴露、配置错误、新出现的缺陷实践等。如果我们不部署利用进攻性安全技巧来主动寻找防御漏洞的红队能力，我们就允许可以避免的盲点存在、恶化并可能被触发。\n\
  \n为了让领导层能够基于信息做出决策，遵守规则是至关重要的。为了在动态背景下强调，想象一个不同的场景：在格治亚州的本宁堡（Ft. Benning）进行的陆地作战中，这种参与规则包含了一句加粗标注的句子：“所有参与者将使用空弹。真实的（神圣的）手榴是禁止的。”\n\
  \n如果红队中某个经验丰富但热情的士兵为了提供更多价值，决定超出使用空弹的常规行为范围，这对于所有相关人员来说都是有些问题的。它违反了“行不伤害”原则，可能会侵蚀攻守双方之间的信任，并且显然无法实现既定的训练目标。\n\
  \n## 如果你曾在渗透测试或其他活动中被抓到，你是如何处理的？\n\n我记得以前有一次情况，蓝队的一成员联系我，询问触发警报的特定活动是否与红队活动有关。因为我曾处于这种场景的双方，我立刻想到了两件事。\n\
  \n首先，我“承认”并确认该活动与我们正在运行的行动有关。对于任何曾彻夜调查潜在恶意活动，结果在第二天早上发现是自己办公室角落 15 英尺外的团队在执行攻击的人，你可能能理解这种方法。作为领导者，我们需要知道在这种情况下收益递减点在哪里。\n\
  \n其次，我通过传闻通知了可能已经或即将被知情的几个人存在一个问题。此时的目标是双重的：我想确保信息至少传播到可能的影响范围（想象一下“雪球效应”，但是沿着非正式电话树的路径）。\n\
  \n\n\n\n\n我认为思考红队所需能力和分工协作的一种方式，是参考训练步兵单位的概念。这其中包含个人任务和集体任务。这些任务源自“任务关键任务列表”（`METL`），它们是开发和维护执行分配任务能力的基石。我认为，在我们构建、维持和改进我们的红队时，考虑这种方法是有价值的。\n\
  \n### 步兵单位类比\n\n这是一个例子：假设我们是一支步兵步连的成员。我们作为一个整体必须熟练执行的一项任务是“执行攻击”。有些集体任务是整个小组必须能够共同熟练完成的，才能成功达成任务。我在这里列出一些支持性的集体任务，以提供更多背景：\n\
  \n*   执行接触性移动\n*   在城市地区执行攻击\n*   执行风险管理\n*   处理伤员\n*   维护行动安全\n\n在不深入探讨每个士兵必须展示的所有个人能力或共同任务的情况下，我们只考虑一个嵌套在“执行接触性移动”下的示例，即“对个人及个人装备进行伪装”。\n\
  \n### 协调红队\n\n让我们把这个问题回到红队中“你们如何协作完成工作？”上。为了简化，我们将任务命名为`交付红队评估`。支持性集体任务的随机采样可能包括以下内容（但名称会更短）：\n\
  \n*   执行红队评估行动规划\n*   执行开源情报（OSINT）侦察\n*   执行物理渗透测试\n*   向相应司法管辖区缴纳保释并接回同事\n*  \
  \ 维护行动安全\n*   撰写并交付红队评估报告\n\n现在让我们解构最后一项集体任务：“撰写并交付红队评估报告”。个人需要具备特定的能力，才能为红队必须执行的集体任务做出贡献。\n\
  \n我相信撰写和交付红队评估报告所需的书面和口头交流对于该岗位的每个专业人士都是至关重要的，特别是高级专业人员。因此，我们可以效仿，列出一个嵌套在“撰写并交付红队评估报告”下的个人能力示例，即“将技术安全漏洞转化为基于风险的观察结果并交付给执行利益相关者”。\n\
  \n在思考如何在团队成员之间分配工作和协调任务时，考虑到将擅长“将技术安全漏洞转化为基于风险的观察结果并交付给执行利益相关者”能力的成员，与在特定技能 set\
  \ 上熟练程度较低的其他成员配对，其培训和技能培养的价值是有用的。某些任务可能比其他任务需要进行更广泛的任务范围内的跨团队沟通和投入。找到一个平衡至关重要，既能完成工作，又能让个人能够花费足够的时间在那些传统上更令人兴奋的活动上（破坏东西）。\n\
  \n### 在行动完成后，你对蓝队进行复盘和支持蓝队支持的方法是什么？\n\n我将此纳入了红队评估的要求中。例如，除了典型的范围文档外，我还概述了一种特定方法，让红队记录并维护所有攻击步骤，包含详细的主机和网络数据，我们将这些数据用于与蓝队进行多场复盘。可以将其理解为让红队维护一份详细的时间线，记录哪些主机被攻破、活动何时发生等。\n\
  \n我将其设定为建立攻防之间更紧密反馈循环的一种。例如，除了提供受影响主机的详细列表，我兴趣在任务结束后与蓝队讨论以下内容：\n\n*   对于每个参与入侵的主机，存在哪些证据类型（以前存在但现在不可用）：主机/内存/网络？\n\
  *   对于每个参与入侵的主机，蓝队目前可以查看/获取/检索哪些类型的伪迹？\n*   对于每个参与入侵的主机，蓝队目前*无法*查看/获取/检索哪些类型的伪迹？\n\
  \n这些与蓝队进行后评估审查的重点有助于凸显可见性差距。它还可以为蓝队在努力减少环境可见性差距时，需要建立的业务理由增加具体的案例。\n\n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\
  \n我认为这个问题会促使人们思考，哪种防御技术/配置/“秘密 GPO 秘籍”能够以合理的努力和资源投入，为（目前已）攻击技术提供最大的保护。不要误会我的意思——从意义上来说，这绝对是一种有效的方法，我们应该不断努力识别结构性的、普遍性的安全漏洞并修复它们，以减少我们的攻击面。在这种情况下，我将这些建议交给我的同事，转而专注于回答我听到的这个问题：\n\
  \n*   我们如何更好地防御攻击？我会首先做什么？为什么没有更多组织这样做？\n\n准备好大失所望，因为我将抛出一个带有最长且最不酷口号的构想性挑战币（这永远不会出现在实际的挑战币上）：\n\
  \n*   了解你的地形、资产、补丁，并利用情报循环为从业人员和领导层创建一个通用作战图，该图应假设入侵已发生并强调检测与响应。\n\n我将按顺序执行以下操作：\n\
  \n1.  制定一个构建联合红蓝能力的初始计划，将第一阶段称为初步尝试的`90 天迭代`。我将制定该方法的大致大纲，获取两个团队的反馈和认同，然后请每个团队的关键人物协助准备最初的启动。\n\
  2.  让红队和蓝队聚在一起进行一次外场，或者至少设计一种方法让每个团队的资深人员聚集在一个有白板的房间里。系列计划讨论是定义每个团队范围、提供的服务以及每个团队现在和一年后带来的战斗能力的关键成功因素。\n\
  \n我认为每个组织在特定时期都有独特的挑战和成熟度，根据我的经验判断，考虑到战术和执行工作的工作量和节奏，许多组织很难分配资源到“从业人员定义的策略”上。\n\n\
  ### 关于编写良好的报告有什么实用的建议？\n\n在考虑这个问题时，我正坐在`波音 787` 飞回美国的 10 小时航班上，我一直回到关于编写测试报告的这个想法上：为什么进行航空维护检查？检查员如何收集、评估、封装并将结果交付给那些确保这架飞机没有严重缺陷的人？\n\
  \n\n\n\n\n开篇直言：我认为那种潜入系统、黑掉一切、在午饭前获取域管理员权限，然后在走人时往别人桌上扔下一份几百页 PDF 的时代已经结束了。从现实来说，这种做法可能已经结束了一段时间，但旧习难改（比如年年如此进行“洗刷再重复”式渗透测试的习惯，以及在假期期间看《虎虎龙》的习惯，因为这显然是一部节日期间电影）。\n\
  \n拥有一个指导红队报告活动的框架至关重要，这个框架将充当交付机制，如果配置得当，将使我们在领导层的对话和优先事项中建立起首要的持续关注。\n\n你可能会发现一种实用方法是开发一个与红队任务相关的定制工作产物“包”或组合。以下是我对这一点的思考：\n\
  \n我们需要告诉谁关于发现了哪些需要修复的内容？为了让他们在各自的层面采取必要的步骤以便修复，每个人需要多大细节？每个组织都会略有不同，以下是几个例子：\n\n\
  *   `CISO`：我们需要“通知指挥官”或让 `CISO` 意识到：(1) 我们执行的活动，(2) 我们识别出的项目，(3) 基于风险分析的这些发现的影响，(4)\
  \ 我们正在遵循的流程，以确保我们履行了承诺，与系统所有者合作以提供风险情报，并引导决策向改进安全态的方向发展。\n*   `系统所有者 (System owners)`：我们需要在报告的技术组件旁边提供正确的背景。我们需要跟踪“红队遥测”，为系统所有者保留有关攻击进展、受损系统和其他操作说明的关键细节，以便报告内容为他们提供根据需要进行进一步历史研究和分析的方法。\n\
  *   `你组织中配置的蓝队 (Blue team)`：个人而言，我决定在红队任务结束后与蓝队安排更多次的简报会议，因为我知道我们交付给他们的特定“报告包”在现实中确实需要多次会议。检测和响应至关重要，这驱动了我的思考，即除了标准的“执行摘要、范围、方法论、发现、附录”之外，还要为蓝队开发一套定制的工作产物。\n\
  *   `风险与合规团队 (Risk and compliance teams)`：根据你组织的要求，你可能还需要根据 `PCI` 和 `HIPAA` 等框架考虑特定的报告格式和内容要求。\n\
  \n这些只是几个例子，说明你如何从任何可用渗透测试框架中获取“配方”，然后根据你组织的要求定制最终产物或报告模板。我建议考虑这种方法：设计基线报告，然后根据特定的利益相关者群体，根据需要通过额外的章节或附录进行补充。\n\
  \n我建议的一个小技巧是：在报告中收集和展示系统细节时，要以终为导向。当报告从（例如）红队成员交给系统所有者时，要考虑交付的“最后一公里”。请记住，在实际意义上，“系统所有者”的含义可能与虚拟化之前略有不同，我认为在“云”的方面也存在着同样的动态关系。\n\
  \n你正在合作的系统所有者可能需要追踪并与其他系统所有者分担某些修复的成果。因此，请考虑提供一个独立的电子表格或 `CSV` 文件，以便进行分析、解析和拆分成较小的数据集，而不仅仅是将\
  \ IP 地址和主机名丢进 Word 文档然后导出为 PDF。\n\n### 你如何确保你的计划结果对于需要完整叙述和背景的人是有价值的？\n\n识别并弥补红队行动报告中感知价值差距的一种方法是征求反馈。有一个例外——我们利用红队成员的集体经验和专业知识，为领导层提供有关组织安全态势的情报。因此，无论报告的消费者可能偏好什么，我们绝不能少于此。换句话说，不应允许报告的消费者以“客户永远是对的”为借口对识别出的项目进行“点踩”。\n\
  \n有一种实用的、经过验证的模型可以为研究或其他类型的评估征求反馈，你可以根据自己情况的任何规模进行调整。你可以与利益相关者进行口头讨论，并问诸这样的问题：“在你看来，这份报告以及整个过程哪些方面运行良好？”“哪些方面运行得不好？为什么？”询问他们信息如何从报告评审会议向下流转也会很有用。做一些调研，了解他们的操作流程和工作流，并花时间从他们的视角查看最近的报告评审过程，时间长到足以让你理解某些挑战和背景，这些背景可能导致他们对报告过程或相关工作产物产生任何批评。\n\
  \n### 除了指出不足之处外，你如何建议安全改进措施？\n\n在提供关于识别出的风险的见解与指责别人的孩子丑之间找到正确的平衡总是具有挑战性的。\n\n一种可以作为合理折中的方法是与将你建议的消费者的关键团队和个人建立关系。如果可能，及且频繁地建立这些关系是有帮助的，以避免第一次对话必然围绕着重大发现和相应的、未经请求的建议。\n\
  \n当我们与人们（注意这里刻意地没有使用刻板的术语 *利益相关者*）角色、责任和优先事项与我们不同的人建立关系时，我认为尝试站在他们的立场考虑问题是有帮助的。将此看作一种心理练习，首先寻求理解，然后真正努力从知识转向同理心。\n\
  \n如果你能积极寻找机会来认可并给予你提供建议的人以赞誉，将其作为一种常态、持续的方法，你就有效地完成了两件事：你建立了一种提供建议性反馈的模式，并且随着时间的推移，你提供了正面反馈和建议。\n\
  \n\n\n\n\n> “老实说，我不知道是否存在某种特定的最佳方法来获得红队工作。渗透测试和红队更多取决于你创造性思维的能力，而不是某种特定的教育背景或经历。”\n\
  \n![](img/chapteropener.jpg)\n\n**Twitter:** @jaredhaight\n\nJared 在信息安全领域工作了五年，目前是一名专攻攻击模拟型任务的顾问。在进入信息安全领域之前，他在\
  \ IT 运营部门工作过，担任过帮助热台和桌面支持，随后担任了十年的系统管理员。多年来，他发布了一些广受欢迎的开源工具，包括 `PS>Attack`，并且是 `Faction\
  \ C2 Framework` 的核心开发者。他曾在 Troopers、DerbyCon、CarolinaCon 以及许多 BSides 活动中进行过演讲和培训。\n\
  \n## 你是如何开始红队生涯的？\n\n我觉得我走的是一条相当传统的红队之路。我从事 IT 行业已经大约 14 年了；我从帮助热台开始做，然后是桌面支持，最后成为了系统管理员。有一天，我所在工作的公司告诉我，他们正准备在\
  \ IT 部门组建一个安全团队，并希望我加入。我一直是一个全才型人才，我很喜欢这一点。某天做网络，第二天做虚拟化，在 IT 运营的各个方面面之间穿梭，这种感觉很酷。在我的\
  \ IT 角色中，我一直很有安全意识，可能比大多数人都要强，但我并不确定自己对专攻安全领域感觉如何。\n\n但我很快意识到，专注于安全可以给我一个学习进攻端知识的借口，于是我被吸引了。假装成坏人并进入你不该进入的地方太有趣了！我很快开始准备\
  \ `OSCP` 考试，并在北卡罗来纳州的夏洛特（我当时就在那里）的信息安全圈结识了一些朋友，这些经历最终促成了我的第一份渗透测试员工作。\n\n在行业内工作了一段时间并结识了更多朋友后，我获得了目前这个的角色；现在我专注于攻击模拟和红队演练。\n\
  \n## 获得红队工作的最佳方法是什么？\n\n老实说，我不知道是否存在某种特定的最佳方法来获得红队工作。渗透测试和红队更多取决于你创造性思维的能力，而不是某种特定的教育背景或经历。对于任何尝试进入安全进攻领域的人，我的建议始终是：\n\
  \n*   学习编程语言的基础。哪种语言并不重要，但你应该了解逻辑是如何运作的（`if` 语句之类的内容）以及如何读写文件。\n*   理解基础网络。了解 `TCP`\
  \ 和 `UDP` 的区别，`DHCP` 和 `DNS` 如何工作，以及 `HTTP/HTTPS` 如何工作。\n*   如果你有本地的信息安全社区，参与进去。你不需要做演讲之类的（虽然如果你想做的话那就很棒），但要与人们交流，了解本地信息安全行业的情况以及哪些技能是市场需求的。除了帮助你学习新知识并理解你需要重点学习的方向外，信息安全社区的人在你找工作时也可以通过推荐职位或介绍你认识社区的其他成员来为你提供很大帮助。\n\
  \n如果你是行业的新手并尝试获得渗透测试职位，这些方法将非常有帮助。如果你想寻找一个执行攻击模拟的红队职位，我建议首先具备一些渗透测试员或其他信息安全角色的背景。这些任务很大程度上依赖于隐蔽性，因此要取得成功，你必须知道在不被发现的情况下可以采取哪些行动。这种知识通常来自于在领域内作为防御者或渗透测试员的经验。\n\
  \n此外，重要的是红队演练是关于攻击模拟的，所以要关注世界上发生的事情。许多像 `FireEye`、`Cyberreason`、`Cisco 的 Talos 小组`\
  \ 和 `Microsoft` 这样的优秀公司都会发布关于攻击者如何运作的白皮书。这为野外发生的情况提供了很好的见解，并可以帮助你的行动与实际威胁对齐。\n\n\
  ## 如何在不违反法律的情况下获得红队技能？\n\n几家公司提供了你可以玩的红队实验室，例如 `Pentester Lab` 和 `Hack The Box`。Chris\
  \ Long（Twitter 上的 @centurion）在 `GitHub` 上发布了一个名为 `DetectionLab` 的卓越项目。它是一组用于构建高度监控的\
  \ `Active Directory` 环境的脚本。它提供了一个尝试攻击并观察它们会产生什么样的告警的绝佳机会。\n\n我也认为建立自己的实验室很有价值。红队团队员的工作是就如何缓解威胁提出建议，而拥有构建和实施你所建议方案的经验，将让你能够提出更现实、实用的建议。\n\
  \n## 为什么我们无法对什么是红队达成共识？\n\n我认为大问题在于对 `red team` 有两个竞争的定义。第一个是指进攻安全团队，或者是`蓝队`（信息安全的防御端）的对面。根据这个定义，如果你专业地黑入东西，你就是红队队员。我相信直到几年前，这实际上是该词汇最通用的解释。\n\
  \n另一个定义更多是关于过程，将`red team` 作为专门用于攻击模拟的术语。传统的渗透测试演练侧重于在给定网络中尽可能发现尽可能漏洞，而红队演练评估公司的检测和响应能力。这些任务通常是以目标为导向的，范围广泛，并专注于隐蔽和规避。\n\
  \n## 关于红队，安全领域的其他人还有哪一点是不理解的？关于红队、蓝队或紫队，你听过最有误导性的言论是什么？\n\n我讨厌“红队正确一次，蓝队必须一直正确”这种说法，因为它给防御方设定了不现实的预期。相反，现实是，作为一个红队队员，我是在蓝队的领地上，我所做的每件事都可能被监控和告警。与其担心一直正确，蓝队应该专注于加固他们可以加强的地方，并将我引向高度监控的要点。这有助于转化红队必须一直正确否则就会被发现的局面。\n\
  \n## 我们应该何时为组织的安全计划引入正式的红队？\n\n这是一个很难的问题，因为我不知道是否存在通用的正确答案。通常情况下，我认为在引入红队之前先建立一个蓝队是很重要的，否则将没有人来修复发现的问题。我还会建议建立一些基础的安全卫生，例如管理的补丁、一些日志记录和监控，以及限制的管理员权限。这样你的红队就可以处理更困难的问题并提供真正的价值，而不是提出显而易见的建议。\n\
  \n## 你如何向不愿意或非技术的客户或组织解释红队的价值？\n\n同理心。我收到的最大阻力来自技术人员，他们担心我们只会破坏他们的工作或破坏他们正在进行的活动。他们把安全人员看作只会说“不”的人。公司里的每个部门的运营时间和人数都少于他们的理想，他们只是在尽所能地完成工作。我在运营\
  \ IT 领域做了很久；我知道我曾跳过步骤，做过不是最安全的选择，因为我必须处理下一项任务。在极少数情况下，我不能指责这样做的人。\n\n\n\n\n\n我努力确保客户（无论内部还是外部）理解的一点是，我们在这里是为了提供帮助的。在很多情况下，我们可以成为客户及其痛点的倡导者，例如建议增加人员或改变流程以使安全工作变得更简单。我还会确保报告的叙述重点关注导致特定漏洞的系统性问题。在大多数情况下，公司出现安全问题并不应该归咎于某某个人——这通常归结于流程的失败。\n\
  \n## 你见过的性价比最低（least bang-for-your-buck）的安全控制是什么？\n\n很多公司会投入大量资金购买 `AV`、`EDR`、`SIEMs`\
  \ 等，但从未提供过足够的人来监控这些东西。如果他们还在忙于环境中的其他几十项任务，你不能指望他们能追踪（甚至注意到）日志中的异常情况。\n\n## 你是否曾经建议过不要进行红队对抗（red\
  \ team engagement）？\n\n通常当我参与一项任务时，所有的细节都已经确定好了。但我认为，要让红队对抗真正具有价值，公司应该已经拥有相当成熟的安全态势。在非正式交流中，我建议人们改为渗透测试或紫队对抗（purple\
  \ team），因为这些往往更侧重于与客户合作，立即解决出现的问题。\n\n在红队对抗中，大多数人在收到报告之前并不知道它的发生。这对于仍在建立阶段或正在进入状态的蓝队来说，可能是一个巨大的惊喜，并且可能会感到非常不公平。\n\
  \n## 有什么最重要或最容易实现的、可以防止你攻破系统或网络的控制措施？\n\n让你的邮件网关为外部发来邮件添加一条“外部邮件（EXTERNAL EMAIL）”的消息。这是一个非常简单、低影响的解决方案，在降低钓鱼成功率方面非常有效。我建议的另外两点是实施微软的\
  \ `LAPS`（这是一个随机化本地管理员密码的免费解决方案），并利用 `Windows Event Forwarding`（Windows 事件转发）从你的\
  \ Windows 环境中进行集中日志收集。`Windows Event Forwarding` 是 Windows 内置的，是一个非常棒的日志聚合器。\n\n\
  ## 为什么你认为遵守作战规则（rules of engagement）至关重要？\n\n信任是从事攻击性安全最重要的部分。我们处理的是极其敏感的数据，并在生产系统中运行。我们的客户、公司和同事需要知道我们可以被信任这项责任。制定作战规则是为了保护公司、保护红队操作员，并将任务集中在感兴趣的领域。如果你越过了\
  \ `ROE`，你就有可能降低任务的有效性，并引发他人对你的行为可能对环境造成损害的担忧。\n\n## 如果你在渗透测试或其他任务中被发现了，你是如何处理的？\n\
  \n一旦我消除了被发现后的最初失落，这实际上是一件值得庆祝的积极事情。我总是确保向抓到我的人表示感谢，特别是当他们不是安全人员时，因为防御并不是他们的“工作”。大多数发现总是是对改进的建议，所以能够说一句“你们在这里做得真棒！”感觉真的很好。\n\
  \n我海起的其中一个场景是我对某家公司进行的物理渗透（physical）。通常在进行物理渗透时，我会做一些侦察，弄公司工牌长什么样。然后我会用 Photoshop\
  \ 画一个工牌，打印出来，并贴在一张 `HID` 卡上。在工牌盒的情况下，它看起来非常有说服力，而且大多数读卡器无论工牌是否有效都会发出同样的“哔”声。所以，如果有人在你尝试搭便车尾随（piggybacking）进入后要求你刷卡，我只需要按住门，让读卡器响一下，然后继续我的工作就好。我有过几次工牌被安保人员检查，但他们从未发现那是伪造的。\n\
  \n在其中一次任务中，我已经攻破了他们的几栋建筑，感觉自己相当不错。我在午餐时间左右来到下一个目标，靠近大家正在吃饭的后露台。当有人进入时，我扶住了门并准备进入建筑。一名安保人员坐在附近，要求我刷卡。没问题，我用我的假工牌刷了一下读卡器走了进去。那名安保人员拦住了我；他竟然注意到了读卡器上的\
  \ LED 灯闪的是红灯而不是绿灯。谁会注意到那个啊！？\n\n好吧，没什么大不了。我把工牌交给他——就是那张之前已经被另外两个人仔细看过并让我通过的工牌。这名安保人员注意到工牌看起来不对劲，把它从工牌套中取出，然后从卡上撕掉了我的\
  \ Photoshop 假工牌。我在很多公司用过十几次这种小招，而且从未有人发现过。我惊呆了。我确保向他们表示感谢，并让我的公司联系人知道他们做得非常出色。\n\
  \n## 在执行既定目标时，你经历过最大的伦理困境是什么？\n\n我不确定我是否对某个目标产生过任何真正的伦理困境。如果有什么我不确定的事情，我们会与客户合作，确保大家达成共识。例如，在最近的一次任务中，有人担心我们的\
  \ `malware` 可能会遗落到用户的个人电脑上。我们与公司合作，寻找方法将我们的 `malware` 锁定在公司资产上，以确保情况不会失控。\n\n查看别人的邮件我确实一直觉得有点怪，但这也是你能获得的最好的信息来源之一。不过，我会确保那是“即进即出”的；我不想在读别人的邮件上花费太多时间。\n\
  \n## 红队是如何协作完成任务的？\n\n我们有不同专长的人员（有时是团队），我们会根据需要加入或退出任务。例如，我们有一支社交工程团队，他们在情报收集、钓鱼攻击、电话钓鱼（vishing）等方面非常出色。我们有一支硬件团队，处理像\
  \ `dropboxes` 和我们需要的一些基础设施。在操作员之间，我们都有自己的个人长处，可以随时加入、退出或交流想法。\n\n我们对存储信息有一个松散的标准，以便分享和存储整个任务期间创建的产物，但大部分工作取决于沟通。我们都是远程办公，所以每个任务都有专门的聊天频道，我们整天都在那里分享发现的内容，并保持信息畅通。对于每项任务，会有一个人担任负责人（lead），他们负责任务的整体策略。他们还负责与团队合作分配工作和职责。\n\
  \n当需要生成报告时，我们通常会将报告分成若干部分并分配给团队成员。负责人随后负责汇总所有内容并进行初步质量检查（QA）。在汇报期间，我们还会与蓝队合作，以确保我们能够准确呈现他们在检测和如何做出响应方面的观点。\n\
  \n我们会向管理层和蓝队分别演示最终报告，通常是分开开会。这正是我们可以与蓝队深入讨论并推敲建议的时候，以确保我们提供的建议符合他们的需求。\n\n\n\n\n\
  \n我的第一步会是监控。如果你不知道发生了什么，就无法保护自己。不过，这并不是一个容易的问题；海量的日志量极易让你精疲力竭。我认为这里最好的方法是从小处开始。记录一些重要的、理想情况下是高保真度的告警，例如在\
  \ Windows 中创建服务时，以及高价值组的成员关系发生变化时。控制好这些内容，然后扩展你记录的范围。\n\n## 关于撰写良好的报告，有什么实用的建议？\n\
  \n针对你的受众进行写作。通常会有三类人来阅读你的报告：\n\n*   **高层管理人员（High-level management）**：这些人员通常不精通技术而且非常忙碌。你希望在这里关注重要的细节。他们的关注点更多集中在大局上：“我的公司经营得如何；风险有多大？”这通常是“高层建议”部分发挥作用的地方。用易于解析的列表总结问题所在以及如何修复。\n\
  *   **技术管理人员（Technical management）**：这些人是更具技术性的人，他们关心如何分配你的报告将产生的工作。他们需要知道哪里出了问题、为什么要修复，以及修复的影响将是什么。这就是发现概述、其影响和建议修复发挥作用的地方。这不应该是技术深层解析，但应该提供足够的信息，让他们很好地理解涉及的内容。我也喜欢在报告中包含一段叙述，说明整个活动是如何进展的。这有助于技术管理人员更好地优先考虑修复方案，并理解某项修复之所以重要的背景。\n\
  *   **技术人员（Technical staff）**：这些人是必须实际执行修复的人。确保他们拥有所有所需的信息来理解问题、如何修复，以及他们应该注意的任何考虑。在很多情况下，这些人员无法获得完整的报告，因此你这里的描述和信息应该能够独立存在。\n\
  \n我尝试在写报告时要认识到，没有人会坐下来从头到尾读完，因此我写的每个章节都像它是一份独立的独立文档一样。这有时涉及大量信息的重复，但我认为这是正确的方法。\n\
  \n## 除了指出不足之处外，你如何建议安全改进？\n\n我认为，尽可能提供系统性的建议始终是重要的。与其关注“没有打补丁 X”，不如尝试去弄清楚为什么没有打这个补丁。他们有补丁管理机制吗？这台服务器是否被遗漏了？这个补丁被遗漏了吗？为什么？\n\
  \n在最终确定报告之前，与蓝队（blue team）交谈在这里非常有用。他们可以帮助就你所看到的问题提供视角，这有助于做出更佳、更彻底的建议。\n\n## 在招募和面试红队成员时，你寻找哪些非技术性技能或态度？\n\
  \n对我来说，第一点是自我心（ego）。在团队中，当我们遇到困难并卡住时，我们需要能够很好地寻求帮助。如果团队中某个成员过于自大而不肯寻求帮助，或者他们在提供反馈和建议时表现得傲慢，这对团队将没有帮助。\n\
  \n## 是什么区分了优秀的红队成员？\n\n对我来说，第一点是自我心（ego）。在团队中，当我们遇到困难并卡住时，我们需要能够很好地寻求帮助。如果团队中某个成员过于自大而不肯寻求帮助，或者他们在提供反馈和建议时表现得傲慢，这对团队将没有帮助。\n\
  \n## 你是如何开始红队的？\n\n我开始从事网络和交换机工作。不久之后，新规定出台，我建立了良好的工作声誉并获得了一份工作。最终，我想做的比仅仅蓝守一方所提供的更多，于是我找了一份咨询工作并接受了它。在那里，我从事件响应和取证开始做。\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n有多种方法可以实现。建立自己的实验室并攻击自己的基础设施。如果你在部署中发现漏洞、Bug 或不安全性，请通过许多不同渠道（如漏洞赏计划）负责任地披露这些项目。参与漏洞赏计划；这些将建立你合法尝试寻找漏洞并在系统中利用它们的能力。然而，记住遵循漏洞赏计划的规则；否则你的努力将得不到回报。第三，夺旗赛（CTF）是合法攻击系统、入侵系统并提取数据的极佳方法。在夺旗赛中，这不仅是预期的，还会受到某些\
  \ CTF 的奖励。\n\n> “参与漏洞赏计划；这些将建立你合法尝试寻找漏洞并在系统中利用它们的能力。”\n\n\n\n\n\n红队（Red teams）通常被认为对蓝队/紫团队具有敌意，并且被认为分散了蓝队必须完成的实际工作。这是因为在大多数情况下，当你证明某人没有尽职尽同时，你其实是在履行你的职责；对我来说，处理这部分工作很困难，最终这也是我回归安全领域蓝侧和紫侧的原因。要留在一个只指出漏洞的一方，而不是一个投入大量工作帮助修复问题的一方，是非常困难的。\n\
  \n### 你应该在何时向组织的安全计划中引入正式的红队？\n这取决于公司。但公司、高管和董事会的整体安全心态应该非常成熟。\n\n### 你如何向不情愿或非技术的客户或组织解释红队演的价值？\n\
  老实说，最有效的视角是：如果你一直只做那些已宣布且计划周全的事情，你永远不知道攻击者会看到什么，或者他们将如何攻击你的公司。\n\n### 你看到的已实施的性价比最低的安全控制措施是什么？\n\
  那种默认的“点击、点击、完事”类型的安全意识培训。相反，我去过一些全员工都具有“安全优先”意识的地方。当你让每个人都对安全负责时，那才是最有效的控制措施。\n\n\
  ### 你是否曾经建议过不要进行红队演练？\n是的。如果你觉得他们的成熟度无法处理红队演练，那么你必须为他们做正确的决定，即使这意味着要告诉他们。有些公司可能受益于仅仅有人和他们谈谈流程，并确保这些流程在日常运营中有效。对于他们的安全态而言，引入针对性的攻击者可能不是最好的主意。\n\
  \n### 最重要或最易实施、能够防止你入侵系统或网络的控制措施是什么？\n监控你的系统，学习正常状态，并对正常范围之外的事情告警，即使是监控 ISP 使用的带宽情况。与每个用户合作，确保他们理解安全对公司重要性，以及哪些信息和流程对业务最关键。\n\
  \n> “与每个用户合作，确保他们理解安全对公司重要性，以及哪些信息和流程对业务最关键。”\n\n### 为什么你觉得保持在交战规则（ROE）之内至关重要？\n\
  ROE 确定了公司想要测试的内容。发现其他任何事情都不是你的个人任务。如果公司聘请你查看正在部署的新系统，但你发现了另一个系统（他们已经知道的系统）的问题，那么你就花费了项目整体范围之外的时间，并且没有关注公司希望你关注的项目。\n\
  \n### 如果你在渗透测试或其他演练中被抓到，你是如何处理的？\n我当时正坐在会议室里，使用一个插着手机的端口；我将我的 `MAC` 地址切换到手机的地址以规避\
  \ `NAC`，并试图寻找一个我应该针对的系统。我已经成功入侵了 `AD` 基础设施，并开始为自己创建账户供以后使用。这时，有人冲进会议室要求我解释。他们成功追踪到了我向所在的房间添加账户的操作。幸运的是，我随身带着工作范围和交战规则，所以我把它们展示给他们看，并要求他们联系授权我进行评估的人员。我还赞扬了他们如此快速追踪攻击来源的能力，并告诉他们我会确保在报告中记录这一点。\n\
  \n### 在执行指定目标时，你遇到过最大的伦理困境是什么？\n当某人正在努力做正确的事时，而你必须说服他们是错的。假设你正在进行物理安全评估，有人拦住了你，但你必须说服他们你是授权的，有时这会持续一段时间。有时我只想停在那里说：“干得好，你发现了一些情况并采取了行动。”\n\
  \n## 红队是如何协作完成任务的？\n团队始终是最好的方法；没有一个人有技能完成所有事情。我发现，在破解系统的过程中，让团队的另一个人做做笔记非常有帮助，这样我以后就不需要靠记忆来拼凑所有细节。这对于写一份出色的报告很有帮助，在向客户进行汇报时，你可以讲述你发现系统时以及“团队”如何反应的个人故事。这为故事增添了人性元素，产生真实的影响。\n\
  \n### 在行动完成后，你如何对蓝队进行汇报和支持？\n如果蓝队和红队不合作，问题将永远无法解决。\n\n## 如果你转到蓝队，你防御攻击的第一步是什么？\n\
  我已经这样做了。我现在使用在红队侧中学到的很多技能来学习如何防御、阻止甚至追踪攻击者。\n\n### 关于撰写良好的报告，有什么实用的建议吗？\n从一个标准模板开始非常有帮助。此外，如果你对所做的事情充满热情，写起来会更容易。尽可能多写正面内容；这样你会觉得自己不仅在讨论负面因素，还在讨论公司能够展现的正面表现。我从未为任何没有做得好的地方的客户写过一份没有可以赞扬的报告。\n\
  \n## 你如何确保你的项目结果对于需要完整叙述和背景的人是有价值的？\n对自己的技能保持谦虚。赞美他们多过，美自己少。\n\n## 除了指出不足之处，你如何建议安全改进？\n\
  根据公司的优先级对发现的问题进行排序，这意味着你需要理解公司的业务。这向他们展示了他们的最高额支出应该花在哪里来修复你发现的问题。\n\n### 在以不同方式处理问题方面，优秀的红队成员如何与常人脱颖而出？\n\
  即时的批判性思维是一项真正无法教的大技能；它是随着时间学习得的，有些人天生就有这种天赋。这种意识到自己正陷入死胡同并从不同的角度看待问题的能力，有时会能解决你正在遇到的问题。■\n\
  \n\n\n\n在之前的一份工作中，我曾在一家联邦资助的研究与开发中心（FFRDC）工作，我们与联邦机构合作，对其他政府机构进行渗透测试。随着时间的推移，某些客户的安全态势大大提高，这导致对更隐蔽技术的需求，以及对测试其监控和响应能力的需求增加。于是，我们利用团队中经验丰富的测试人员组建了一个红队。这是我职业生涯中极具价值的一时期：我有机会探索并改进自己的技术，并真实地看到哪些方法有效，哪些无效。我学到了很多教训！\n\
  \n## 获得红队工作的最佳方法是什么？\n\n首先，确保红队工作是你真正想做的。它与渗透测试不同（并不是更优或更差），需要一套不同的技能和思维方式。然后，专注于深入学习战术、技术和程序（`TTP`）以及行动安全（`OpSec`）。这些核心基础对于学习如何最有效地执行至关重要，因为你可能只有一次机会。最后，花时间和蓝队待在一起。了解蓝队如何工作监控、检测和响应，将对成为一名出色的红队操作者大有帮助，无论你是否成功，都能让你的产出具有相关性。\n\
  \n### 人如何在不触犯法律的情况下获得红队技能？\n\n作为一名教授道德渗透测试课程的教授，我总是严厉警告学生要在法律范围内行动，并时刻意识到自己所在的位置。围绕黑客行为的法律充其说是灰色地带，但它们很可能对你不利。尽管如此，现在有几个平台提供了沙箱测试环境，这对于在真实网络环境中测试技能和工具是非常宝贵的工具。\n\
  \n红队也关乎拥有正确的思维。你可以通过与防御者待在一起以及阅读策略书籍来获得出色的红队技能。战争中使用的许多战略技术都适用于红队行动。\n\n> “红队也关乎拥有正确的思维。你可以通过与防御者待在一起以及阅读策略书籍来获得出色的红队技能。”\n\
  \n### 为什么无法对什么是红队达成共识？\n\n通常，`red team`一词被用来描述进攻安全领域的任何事物，尤其是当它成为科技行业的一个流行热词时。如果你问某人应用测试、渗透测试和红队之间的区别，你会开始得到更一致的答案。我认为对该术语最大的分歧在于当红队被定义为“高级”渗透测试时。红队带有比渗透测试高出一个水平的内涵，但实际上，这两项服务的目标有显著差异，且两者都很有价值。\n\
  \n在与其他组织的负责人讨论红队时，我总是很有兴趣看他们红队的各种组织方式以及运作方式。从表面上看，这些看起来像是差异，但实际上只是每个团队将相同的核心红队原理应用于最能契合他们组织和客户的环境。这样做是内部红队的重要部分。\n\
  \n### 信息安全其他领域有哪些他们不理解的红队工作方面？你听过的关于红队、蓝队或紫队最具有“毒性”的谎言是什么？\n\n很少有人理解从管理和技术两个角度来看，红队行动中投入了什么级别的规划。这并不是简单的产生一个主意、打开电脑并开始黑客。为了获得必要的批准、确保正确的人“知情”以及计划实际执行，需要大量的准备工作。此外，搭建适当的基础设施可能会消耗大量的时间和资源。\n\
  \n一个有毒的谎言是红队和蓝队无法合作，且天生相互对立。诚然，蓝队正试图检测并防止红队成功，但这只是工作的方面之一。在幕后和事后，两个团队可以也应该紧密合作，以充分理解双方做了什么，并弥补任何识别出的漏洞。红队的成功最终取决于与蓝队建立良好的关系。归根结底，我认为红队是蓝队的扩展，而不是一个完全独立的实体。\n\
  \n> “红队的成功最终取决于与蓝队建立良好的关系。归根结底，我认为红队是蓝队的扩展，而不是一个完全独立的实体。”\n\n## 你应该何时向组织的安全计划中引入正式的红队？\n\
  \n内部红队应该是安全计划的最后几个部分之一。一个组织希望在红队可能制造事件之前，确保他们已经建立了成熟的流程，来对入侵进行监控、检测和响应。红队的价值在于帮助精细化现有的安全计划，而不是寻找已经已知的漏洞。\n\
  \n### 你如何向不情愿或红队测试或非技术背景的客户或组织解释红队的价值？\n\n在向非技术观众解释红队做什么时，我总是会强调`真实`这个世界。我解释说，红队是在模拟真实的坏分子，并仅使用真实坏分子手中所拥有的资源。在这些讨论中，保持谦逊非常重要，好让客户知道你来那里不是为了让他们难看。解释这一点很有帮助：红队进入行动时，他们并不知道是否会成功，而这正是意义所在。这有助于建立一种伙伴关系，就像你们都在试图寻找答案的谜题一样。\n\
  \n### 你是否建议过不要进行红队任务？\n\n是的！很多客户想进行红队演练，是因为他们认为那是最先进的进攻服务，为什么不选最好的呢？但实际上，客户寻找的是对他们的产品或应用程序进行更具针对性的评估，这更符合应用安全或渗透测试领域。至关重要的是要搞清楚客户在产出方面真正想要什么，以及真正想要评估什么。这有助于选择正确的评估类型。这些服务中没有一项优于另一项；它们只是针对不同的需求，帮助客户识别最适合的一项是很重要的。\n\
  \n\n\n\n\n# 被抓并不是一件坏事！\n\n加入红队意味着在（某种程度上）处于信息不透明的状态，不知道新的防御措施正在被部署。被抓可能意味着那些防御措施正在生效，而每一位红队成员都应该预期并希望被抓……有时是如此。\n\
  \n> “被抓并不是一件坏事！”\n\n在其中一次机会中，我正朝着传播恶意软件的目标努力，当我托管恶意软件负载的跳板主机被发现时，变成了一场与时间的赛跑，因为蓝队现在能够更好地追踪我的踪迹。最终，我仍然取得了了部分成功，但也暴露了身份。这为红蓝双方的紧密合作创造了绝佳机会。我们有些地方做得很好，有些地方做得不好，但它引发了一场关于如何从根源上更好地阻止此类攻击的讨论。\n\
  \n## 在执行任务期间，你遇到过的最大的伦理困境是什么？\n\n有些社会工程学借口让我感到反胃，例如利用自然灾害或国家级悲剧。你很清楚自己正在拨弄人们的心弦并利用人性中的善意，这让人很难下手。然而，我必须提醒自己，真正的坏人正在使用这些技术，所以这一切都是为了更大的利益（我希望如此！）。\n\
  \n## 红队是如何协作来完成任务的？\n\n内部红队行动的持续时间因组织而异，但很有可能它们都比真实攻击者的战役周期短，因此，团队合作是按时完成所有任务的唯一途径。\n\
  \n在行动期间，最好拥有记录良好的流程和程序，以确保所有团队成员都能妥善记录自己的工作并与大团队进行沟通。同时，根据我们与客户约定的 `ROE`（规则规则），确保客户\
  \ POC（项目负责人）知情。这些都由一名行动负责人管理，负责确保遵守我们的程序，并将任何未解决的问题或障碍妥善地向上级汇报。\n\n行动结束后，我建议一种以废弃行动期间取得成功的任何\
  \ `TTP`（战术、技术和过程）为核心的服务。这是通过红蓝双方紧密合作，重现 `TTP`，确定存在哪些证据，充分了解所有相关的 `IOCs`（入侵指标），然后实施计划来防止和/或检测此类活动。这些小组之间的这种团队合作在短时间内增加防御措施方面效果是惊人的。\n\
  \n## 在任务完成后，你对蓝队进行总结和提供支持的方法是什么？\n\n我的观点是，蓝队在任务完成后应该完全了解行动的内容以及所使用的战术。简单来说，如果红队可以成功，那么坏人也可以。通过红队行动的结果来废弃\
  \ `TTPs` 并增强防御，正是开展这些行动的初衷所在。\n\n有时仅仅交付一份报告是不够的。理想情况下，红蓝双方应该坐在一起再次梳理攻击路径，让每个人都能实时看到执行过程。我发现这会让人们产生“灵光一现”，并让防御者想出创新的解决方案。\n\
  \n## 如果你转到蓝队，为了更好地防御攻击，你的第一步是什么？\n\n我将专注于为所有蓝队成员提供进攻性培训。通过课堂教学和职场指导，我有幸培训过许多蓝队成员学习攻性技术。这些人在自己的工作上非常熟练，但从未有机会从对方的视角体验过攻击。能够理解攻击者如何操作和思考是非常用的，并且能产生“灵光一现”的时刻，从而对问题产生全面的感知和创造性的解决方案。我相信这让防御者能够更快地对事件进行分类处理，并进行根因分析，而不仅仅是修复表层问题。\n\
  \n## 关于编写优秀的报告，有什么实用的建议？\n\n技术写作是一门艺术，做好它需要经验。一个常见的误区是认为报告越长越好，但事实并非如此，你只是在给自己增加工作量。我鼓励我的团队关注事实并讲述一个好（且准确的）故事。写作要简洁，让你的读者不会迷失在技术术语中，而是能够跟上思路并理解你——作为攻击者——做了什么以及为什么要这么做。\n\
  \n> “技术写作是一门艺术，做好它需要经验。”\n\n## 你如何确保你的项目结果对于需要完整叙述和背景的人来说是有价值的？\n\n这涉及到编写一个良好叙述的艺术。行动故事应该包含被利用的弱点，但不应以一种让观众感到愚蠢的方式点出来它们。报告应该描述“攻击者对我们的网络做了什么”，而不是“我对你们做了什么”。结果的呈现方式应该是让你重新回到了他们所在的阵营，并讨论为了组织的利益可以共同进行哪些改进。陈述发生过的事实，以及集体的“我们”将如何修复它们。\n\
  \n## 除了指出不足之处，你如何建议安全改进？\n\n最好的方法是针对你指出的问题准备好真实、可能的建议。同时，保持谦逊并承认你不知道的事情至关重要。作为红队，你们利用了一个弱点，这是一个事实。现在请陈出你所知的、关于未来如何被拦截的方法，同时欢迎对解决方案的额外投入。同样重要的是要意识到，理想的修复方案可能并非现实。有许多力量在起作用（政治、优先顺序、资金等），可能会防止防御者实施解决方案。在某些情况下，问题可能是已知的，但红队的利用可以作为领导层优先考虑修复所需的杠杆。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n\n\n\n\n耐心与创造力。在红队行动中，你通常只有一次利用漏洞的机会，因此不能急于冲动。一个能够后退一步、花时间评估状况并提出巧妙解决方案的红队不仅能够取得成功，还能为团队其他人树立良好的榜样。■\n\
  \n# 23\n\nDavid Kennedy\n\n> “尽管红队（red team）这个术语已经存在很久，但关于其真实定义以及什么构成网络安全领域的红队，仍然存在许多争议。”\n\
  \n![](img/KennedyDavid.jpg)\n\n**Twitter:** @HackingDave\n\nDavid Kennedy 是 `TrustedSec`\
  \ 和 `Binary Defense Systems (BD)` 的创始人。David 是一位狂热的游戏玩家、三个孩子的父亲，对编码、黑客攻击和红队测试充满激情。David\
  \ 曾在一家在 77 多个国家设有办事处的世界百强企业中担任首席安全官（CSO）。他被认为是安全领域的前瞻性思考者，是美国一些大型会议的主题演讲者，并曾是多家国家新闻机构的嘉宾。他还曾为美国海军陆战队（USMC）从事网络战工作，并在情报社区从事取证工作，其中包括两次在伊克的执行经历。\n\
  \n**你是如何开始从事红队工作的？**\n\n尽管红队（red team）这个术语已经存在很久，但关于其真实定义以及什么构成网络安全领域的红队，仍然存在许多争议。行业之外的红队更多被定义为一种挑战现有逻辑和思维的方式，并提供替代性的背景和前瞻性的想法。我记得在为美国海军陆战队工作时，情报社区提到过“红队测试（red\
  \ teaming）”这个词，它被用作挑战当前任务策略的早期形式，并为关键目标提供替代方案。\n\n我个人认为，红队测试是指更先进的组织能够以模拟真实世界的方式，模拟能力范围内的攻击者进行……\n\
  \n\n\n\n\n对于大多数红队而言，至少对于我们关注的大多数红队来说，能够对组织进行大规模的开源情报收集、针对攻击者构建威胁模型，并能够创建定制化的基础设施和工具，可以帮助你获得红队的工作。这需要经验和实践。红队专家并非一个入门级职位，而是在网络安全多个领域拥有技能储备后产生的产物。渗透测试是一个极佳的起点，你可以从那里不断扩展自己。\n\
  \n我记得几年前，我在一家财富 1000 强公司担任首席安全官（CSO），我们聘请了 Lares Consulting（该公司由 `Chris Nickerson`\
  \ 和 `Eric Smith` 运营）来担任我们当年的红队。我对自己公司的安全计划和发展方向感到很满意，但我需要对我们的现状进行验证。我知道这远非完美，而且永远不会完美，但我想了解我需要将精力集中在何处。`Chris`\
  \ 和 `Eric` 进行了物理评估，我也加入了他们。我记得跟随他们来到大楼门前，`Chris` 的包里装有一些铜线。我们大楼正面有一个小缝隙，安装了推杆锁，但它是通过触碰（压力）触发的。`Chris`\
  \ 顶开门，将一根电线从门的一侧连接到推杆上，并用手产生静电。门开了。我们都歇斯底里大笑起来，觉得这太酷了；接着我们穿过大楼，那里由武装保镖进行 `24/7`\
  \ 全天监控。在大楼里走走，向摄像头挥手，然后到达每个目标，我意识到无论是在物理层面还是很快的网络层面，我都有大量工作要做。一旦他们进入内部，就插了一些隐藏设备，并能够访问网络上的关键目标。那天我学到了许多非常棒的新技巧。\n\
  \n对我个人而言，我的工作起初是包揽一切——风险评估、渗透测试、物理评估、取证、无线安全等。我开始学习网络安全周边的每个领域并扩展我的技能。我开始编写我的第一个工具，名为\
  \ `Fast-Track`（利用框架），并磨炼我的技能。在模拟更高级的攻击者时，创建自己的定制内容的能力（包括编写漏洞利用、命令与控制框架以及红队中的规避技术）非常重要。我仰仰安全行业中许多富有启发性的人，包括\
  \ `Mati Aharoni`、`Chris Nickerson`、`HD Moore`、`FX`、`Bruce Potter`、`Mudge` 以及许多其他惊人的奇才，并从他们身上学习。我还从我的长期导师\
  \ `Scott Angelo` 那里学到了软技能，我非常感谢他让我能够与高管和高层人员交流，同时保持务实。\n\n当我在那家精品安全公司工作时，`Scott`\
  \ 离开去了一家财富 1000 强公司，并将我带过去担任他们的 `CSO` 负责安全计划。我今天的成功和职业生涯很大归功于他，最重要的是，他的指导让我既能保持技术专长，又能专注于战略和计划建设。`Chris\
  \ Nickerson` 和 `Scott Angelo` 是关键的榜样，这也是我创立 `TrustedSec` 的原因，当我考虑离开一份完美的工作去创业时，我非常依赖他们。简而言之，让自己环绕在优秀的人和朋友身边，他们愿意帮助你做决定，并在你做出重大决策时引导你，以证明你并没有疯。感谢了\
  \ `Chris` 和 `Scott`，我的公司在全球范围内拥有 170 多名员工，并受到世界上一些大公司的信任。现在，我每天都能和朋友们一起工作，让世界变得更好！\n\
  \n## 如何在不触犯法律的情况下获得红队技能？\n\n有很多组织可以加入，特别是在咨询领域，在这些你可以边做边学并向他人学习。对我来说，在职业生涯早期，向他人学习是至关重要且必要的。我对任何想进入红队领域的人最大的建议是：放下自尊，承认你有大量东西要学，而且将永远学无止境。向任何愿意教你的人学习，并在自己的经验基础上不断积累。向他人学习——这是你能学到的最好的技能。\n\
  \n在精炼技能方面，从一些简单的技能开始，如开锁、理解无线技术，并寻找建立在技能基础的工作，例如渗透测试。这些将帮助你开始获得有关红队的知识。记住，你不需要在每方面都成为最优秀；将你的技能集中在那些学得最好且最感兴趣的领域，而在其他领域保持平庸即可。对我来说，退伍后，我加入了一家小型精品咨询公司，让我能够涉足所有领域，并随着时间的增长了自己的技能。\n\
  \n在技术方面，尽可能通过网络靶场、夺旗赛（CTF）和进攻安全课程来学习。这些是应用型学习，你必须在受控环境中实际攻击系统，以学习渗透测试和漏洞利用中的精细艺术。他们的课程设置也可以扩展，从使用\
  \ `Kali` 进行渗透测试到高级的 Windows 漏洞利用。我记得几年前坐在 `BlackHat` 大会上与讲师 `Matteo Memelli` 在一起，他在内核利用方面的讲解简直让我大开眼界。我记得当时和\
  \ `Dual Core` 的 `Dave` 坐在一起，我们真的在互相竞争，看谁能先完成练习作为娱乐。这样学习并保持趣味和兴奋性对学习至关重要，同时以符合道德和法律的方式学习也至关重要。我怎么强调都不为——守住你的底线。不要做违法的事，要正确学习！\n\
  \n## 为什么我们无法对什么是红队达成共识？\n\n我认为安全行业大多数人都认可“红队”这个术语；分歧或疑问集中在红队的目的和意图。红队不是渗透测试；渗透测试也不是红队。让我们明确这一点。红队是一个组织内部或外部（例如咨询公司）的团队，他们了解被攻击组织的能力，了解组织面临的威胁模型，并能够开发模拟和规避的方法来实现特定目标。这包括以任何手段（在授权范围内）攻击组织。产生困惑的地方在于组织如何解读红队的结果，或者红队的目的和意图。\n\
  \n目前关于新研究技术的披露存在很多争论，以及红队研究是否也应该贡献那些利用研究来保护自身产品的大型集团公司。在 `TrustedSec`，我们有一个整个小组专门研究新能力，以便我们更高级的客户模拟更精确、更有针对性的国家级攻击。需要说明，我们不会囤积零日漏洞并会负责任地披露；但我们会保留特定的技术、定制的基础设施和代理，以及针对产品的绕过方案，以便有效地工作。\n\
  \n\n\n\n\n真实世界的模拟能让你保持敏锐，并测试信息安全计划旨在执行的几乎所有功能，包括你的应急响应、检测能力、漏洞管理等。它从字面上就是对你努力完善的整个安全计划进行压力测试。行动后的事项（after-action）是你需要改进并提高标准的地方，以增强组织对攻击的韧性。\n\
  \n## 关于加入红队，信息安全其他方面还有哪一点是不理解的？关于红队、蓝队或紫队，你听过最具毒性的误言是什么？\n\n我们收到很多想要“红队”的组织，因为它听起来很酷，而且他们想要与渗透测试不同的东西。大多数组织的设计并不是为了应对红队任务的，因为这需要安全计划达到一定的成熟度。例如，如果你还没有通过监控和检测能力获得对组织的内部可见性，那么红队可能并不适合你。红队确实可以用来展示目前的计划是多么无效，并以此作为筹码，但大多数情况下它是大过其实用的，而且比其他方法更昂贵。\n\
  \n另一个误言是红队的使命是毫无留情地摧毁组织。红队的目的不是成为一种如此精英、以至于组织无法建立防御的强大力量。我们作为红队的全部目的是工作并努力让组织在防御方面变得更好，并成为攻击模式以及如何在组织内部发现泄露的专家。这就是为什么紫队的方法更适合大多数公司。\n\
  \n紫队是蓝队（防御）和红队（进攻）汇合在一起共同工作并共同构建防御。这通常像是一种模拟，由红队提出场景和目标，并与蓝队配合完成攻击的每一个阶段，蓝队的每一步行动都保持同步。当攻击发起时，蓝队会在那里尝试识别是否能被发现。目标是让红队理解防御，但最重要的是让蓝队查看他们是否能够阻止或检测到特定的攻击阶段。这涵盖了从初始利用到后利用、数据外泄以及之间的每一步。\n\
  \n## 你应该何时向组织的安全计划中引入正式的红队？\n\n当一家公司达到了达到所需的可见性水平（这可以且应该经常改变），并且他们有一支活跃在组织内寻找入侵指标的团队时，可能就是引入红队的好时机了。通常情况下，在组织内部实施预防需要大量时间；然而，检测通常不需要。红队可以帮助优先考虑准备长期预防策略，以及你组织中可能存在的可见性漏洞。如果你的监控能力仍然不成熟，红队可能不符合你的最佳利益，也不是对你时间的最佳利用。在游戏的这个阶段，`endpoint\
  \ logs` 是可见性的必不可选项。\n\n这还涉及到关于第三方托管安全服务提供商（MSP）的讨论。如果你利用了第三方，确保组织对红队任务或协作紫队以变得更好感到舒服是很重要的。我强烈建议确保你目前的供应商支持这些类型的模拟，以便让\
  \ MSP 在检测方面也变得更好。\n\n## 你如何向不情愿的或非技术性的客户或组织解释红队的价值？\n\n理解红队的目标并确保充分解释开展红队的原因是非常重要的。其目的是模拟一个与可能针对你组织的对手类似的对手，在他们花时间对付你时会所做的一切。在没有实际对手入侵你的情况下，这已经是最接近真实的了。如果你已经建立了一个安全计划并想测试其有效性，那么红队是必不可少的。传达价值并确保计划朝着正确的方向发展可以帮助那些迟疑的人，并推动目标的实现。\n\
  \n> “如果你已经建立了一个安全计划并想测试其有效性，那么红队是必不可少的。”\n\n## 在你看到的实施的安全控制中，你认为哪一个性价比最低？\n\n数据泄露防护（DLP）。它在性质上通常是针对特定业务流程的静态，寻找社会安全号码和信用卡数据。当数据外泄发生，它几乎无法检测到攻击者。事实上，在我网络安全行业\
  \ 18 年里，我想不起有一次看到公司通过数据泄露防护检测到数据外泄。组织内部的信息分类是一项极其艰巨的任务，需要整个文化的转变才能在组织内正确地对数据标记。我真的没有见过多少公司完全实施这一点；作为一个整个公司来说，这很难扩展和执行。\n\
  \n## 你是否曾经建议过不要进行红队任务？\n\n经常如此。组织理解执行红队所需的成熟度水平及其目标非常重要。大多数组织需要渗透测试来识别他们存在哪些漏洞。大多数组织在能力方面没有长期策略，更多地关注攻击者的战术和程序而非技术。大多数组织还没有准备好进行红队。\n\
  \n在行业中，人们需要顾问和帮助他们建立安全计划的人员。如果他们还没有设计好处理或接收红队产生的内容，那么这不应该是他们开始的项目。\n\n## 为了防止你入侵系统或网络，最重要的或最易实施的安全控制是什么？\n\
  \n在工作站上启用 `Windows Firewall`。认真地，这样做。我们横移动的主要方式之一是通过入侵一个系统然后移动到另一个系统。虽然这不是一个完美的解决方案，但它确实阻止了我作为攻击者通过收集本地管理员凭据、缓存凭据、`Kerberos\
  \ tokens`或其他区域从一个工作站移动。虽然这不能保护你的服务器基础设施，但它消除了大量的攻击面并迫使我进入服务器。\n\n应用程序控制/应用程序白名单。虽然它可能不是最容易实施的，但你可能已经拥有许多解决方案可以阻止多种攻击。例如，微软拥有\
  \ `Software Restriction Policies`、`AppLocker` 和 `Device Guard`。只需通过简单的操作，如禁止普通用户使用\
  \ `PowerShell` 并禁止用户配置文件目录中的未签名二进制文件，就能对你的感染防御产生巨大影响并挫败许多攻击。\n\n## 如果你曾在渗透测试或其他任务中被抓到，你是如何处理的？\n\
  \n\n\n\n\n我想起了一件事，当时我们正在为一家零售客户提供渗透服务。我们决定白天是进入建筑的最佳时机。我们通过“搭便车”进入了这家零售公司总部的一个侧门。那部分很容易；接下来的阶段是获取数据中心的访问权限，而且进入数据中心后还有特定的要目标。我们在公司总部内部、安全检查点之后找到了一个空会议室，拨打\
  \ 0 键查询了公司目录，找到了数据中心的分机号。我们拨了数据中心的电话，编造了一个理由，说我们是来对数据中心进行调查的审计员，并让我们进去。\n\n*   `<铃声，铃声，铃声>`\n\
  *   Bob：“你好，我是数据中心的 Bob。有什么可以帮你的吗？”\n*   我：“嘿，Bob！我是安保部的 Joe。我们会议室这里有几位审计员正在进行我们的\
  \ `PCI audit`，他们需要查看每个人进出数据中心的日志，并需要自由走动以查看摄像头布局以及我们数据中心的物理控制措施。我会把他们送过去，你能放他们进去吗？”\n\
  *   `<长长时间的沉默>`\n*   Bob：“抱歉，你说那是谁？”\n*   我：“我是安保部的 Joe Smith；我的分机号是 1111。”\n* \
  \  Bob：“嗯，我和 Joe 是好朋友，而你绝对不是 Joe。这到底是怎么了？”\n*   `<电话挂断声>`\n\n我们惊慌失措地跑到另一个地方。最终我们从一个离开数据中心的人那里克隆了工牌，然后进入了数据中心，但在最初我们被当帮了。\n\
  \n## 在执行任务期间，你遇到过最大的伦理困境是什么？\n\n社会工程学对我来说是一项挑战，尤其是在道德方面。我为自己是一个诚实的人而自豪，但在社会工程学中，这恰恰相反。你必须记住，你这样做是为了更大的利益，并试图识别如何让教育变得更有效，或者控制措施可能会如何失效。你这样做是为了帮助他人。我总是尝试从积极的角度来看待社会工程学，而不会尝试将负面说服作为实现目标的手段。\n\
  \n### 红队如何协作完成任务？\n\n这确实是一项团队努力。在我参与过的红队任务中，我们每个人在实现目标方面都起着关键作用。例如，如果由我进行物理渗透，那么负责物理侦察和最佳切入点的人就是至关重要的。一旦进入内部，就会有人负责处理用于建立组织访问权限或实现目标的植入物或技术。如果我们讨论更多的是外部，那么在应用程序、边界防御等方面的专业知识变得非常重要。通常对于红队来说，当我们在系统上获得初始代码执行权限时，了解组织的能力以及什么行为会被标记是非常重要的。拥有能够沟通并帮助规避检测的团队成员至关重要。\n\
  \n最后，记住，红队利用红蓝蓝双方之间的相互尊重与协作，来帮助增强组织的防御，并通过真实世界的模拟来理解安全计划可以在哪些方面进行改进。\n\n### 在任务完成后，你进行汇报和支持蓝队的方法是什么？\n\
  \n有几种不同的方法。其中一种更具协作性的方法是紫军对抗（purple teaming），即演练是实时进行的，红蓝双方同时工作。在红队测试中，通过示例、时间和产产物来重现你的步骤的能力对于在事后做出响应至关重要。红队应该产生两个目标——战略性和技术性的修复工作。技术性意味着一种特定的修复、检测或预防措施，这些措施可以阻止所运用的技术。战略性意味着思考我们未来如何防止这些战术和程序（或检测到它们），以便此类类型的攻击不再成功或或更早地被阻止。\n\
  \n### 如果你转到蓝队，更好地防御攻击的第一步是什么？\n\n当考虑的不只是现在，还有明天时，保护组织已经不再有“城堡心态”了。我们没有弓箭手、护城河或重加固的墙——我们有的是一个帐篷城市，巡逻队在街道上巡逻并分布在广阔的土地上。在这种模型下，我们传统的安全原则不再适用，我们（安全人员）必须进行适当的调整。重点不在于我们能通过不断的技术保护公司多大程度，而在于当出现安全漏洞时，我们如何将伤害降至最低。我们真的在乎销售部的\
  \ Bob 被攻破吗？嗯，也许吧。然而，从大局来看，Bob 不会导致足以让公司遭受重大损失的严重违规。我们能在 Bob 的计算机被攻破或不久之后检测到它吗？可能。如果我们检测到了，能阻止它向其他系统的扩散（横向移动）吗？可以。\n\
  \n> “重点不在于我们能通过不断的技术保护公司多大程度，而在于当出现安全漏洞时，我们如何将伤害降至最低。”\n\n我们现在生活的这样一个时代，保护需要大量时间来实现，而检测必须成为我们的首要任务，以跟上不断出现的新攻击。\n\
  \n### 关于编写良好的报告，有什么实用的建议？\n\n对发现进行沟通以及公司如何吸收红队测试期间发生的情况，是任何测试*最*核心的元素。我个人很喜欢写报告，因为它是为了有效测试公司安全控制措施所投入的工作和时间的。关注他们做得好的地方，也关注他们可以改进的地方。这关乎讲述一个故事以及你是如何变成现在的。与其想写报告有多痛苦，不如想你为他们提供的价值，如果他们实施了你所说的一切，下一次将会面临多么困难、多大的挑战。\n\
  \n在写报告时，要了解你的受众。执行摘要是你展现才华并讲述发生了什么以及为什么的机会。在宏观层面上，总结你取得的成就——优点和待改进领域。将叙述重点放在组织面对针对性攻击时的表现，以及他们可以如何改进（从高层次来看）。然后，从那里开始，专注于更有技术性的故事，专注于你在执行摘要中解释的相同内容，并进入报告的核心部分——发现。确保它们是可重现的，并提供尽可能的信息，以便读者清楚地理解他们正在寻找什么。建议不应该是去访问某个网站；而应该是一个关于修复所发现问题的清晰路线图和战略。\n\
  \n\n\n\n\n我记得当时我和我的几位好朋友合写了*Metasploit: The Penetration Tester’s Guide*一本书。我们的出版社是\
  \ No Starch Press，而 Bill Pollock（一个非常出色的人）负责对这本书进行同行评审。我记得我写了其中一章；我想是关于后渗透阶段（post-exploitation）的，我觉得我写过的最棒的一章。Bill\
  \ 真的给我发了邮件说：“Dave，虽然从你的角度来看这很酷，但读者读到这里会完全迷失方向。你需要重写这整个章节。”在当时，我感到非常沮丧和难过。他怎么能那样说？他怎么能让我重写整个章节？于是我决定，你知道吧，让我找一个不搞网络安全的人读读这个，然后告诉我他们怎么想。在读完第二页后，他们停止了阅读并说：“听着，这听起来很酷，但我完全不知道这些是什么意思。”正如此。从那以后，我总是尝试从阅读我写内容的个人角度来写任何东西。\n\
  \n## 你如何确保你的程序结果对于需要完整叙述和背景的人来说是有价值的？\n\n红队的方法并不是为了展示漏洞或你团队个人的技能组合。它是为了展示一家公司的运营得有多好（包括优点和缺点），以及在哪里可以提高标准。当你审视一个安全计划时，有多个部分构成了我们今天所说的“安全”。从治理到漏洞管理以及其间一切，一个安全计划是复杂的，而且组织往往觉得自己的处境不错，但真的好吗？或者他们不确定下一步应该优先考虑什么。这就是红队可以提供帮助的地方——无论是在策略还是验证方面。\n\
  \n当你观察一个组织的威胁模型和不同攻击者的复杂程度时，能够对高概率的相关攻击向量进行攻击建模，有助于映射出需要什么水平的攻击者以及你已经部署了哪些类型的控制。也许你的程序在某些水平上是足够的，但根据其他攻击者的能力，在其他方面可能存在缺陷。\n\
  \n## 除了指出不足之处，你如何建议改进安全工作？\n\n一个很好的例子是指出安全计划的优点和它表现良好的地方。然后关注它可以继续向前发展的方向以及可以在哪些方向进行改进。这并不是在说它不足，而是认为任何事情都可以被改进。当你观察一个组织的威胁模型和不同攻击者的复杂程度时，能够对高概率的相关攻击向量进行攻击建模，有助于映射出需要什么水平的攻击者以及你已经部署了哪些类型的控制。也许你的程序在某些水平上是足够的，但根据其他攻击者的能力，在其他方面可能存在缺陷。\n\
  \n## 在招聘和面试红队成员时你寻找哪些非技术技能或态度？\n\n红队不仅仅关于技术技能——尽管在某些情况下它们仍然非常重要。对我来说，首要技能是能够以每个人都能理解的方式传达他们所执行的操作。有时我们攻击的方式可能是复杂的，而我们回馈的故事或信息可能同样令人困惑或复杂。能够以所有听众都能理解的方式分解并传达复杂信息是一种理想的技能，也是我们网络安全领域许多人所缺乏的技能。一个很好的例子是我雇佣的一位令我记忆深刻的人，Jason\
  \ Lang。\n\n在早期 DerbyCon 的时代，我记得有一个我从未见过的人走到了我面前，当时他是一名开发者，对安全感兴趣。他在凯悦酒店，就在后面那个夺旗赛（capture-the-flag）房间外，把我拉到一边说：“嘿，Dave！我想进入安全领域；我是一个应用程序开发者——你对我有什么建议吗？”我记得只是听了他们的经历以及他想去哪里，我被他解释愿景以及理解我们正在寻找什么的能力所深深折服了。我给了他一些建议，以及我是如何处理网络安全的，并和他花了大约\
  \ 10 分钟。\n\n> “能够以所有听众都能理解的方式分解并传达复杂信息是一种理想的技能，也是我们网络安全领域许多人所缺乏的技能。”\n\n几年后；Jason\
  \ 开始发布自己的工具，并加入了一个红队，做着他喜欢的事情。他现在是我们红队中在我们的对手模拟团队中运行的顶尖高级安全顾问之一。最重要的是，Jason 的软技能以及向他人传达他所工作的能力让他成为了客户的常青树。我们今天有一位客户点名要求\
  \ Jason，就因为他严谨的态度以及他与客户沟通的方式。客户的反应是：“我们把去年 Jason 为我们做的一切都吸收并应用进了。今年对你们来说将是非常挑战性的。”我们太喜欢那样了！\n\
  \n## 在以不同方式解决问题方面，优秀的红队成员与普通人有何区别？\n\n红队是技能组合的结晶。没有任何人知道关于某个特定主题的所有知识。能够汇集彼此的优缺点来创建一个凝聚的团队是非常重要的。为能力和基础设施的研发（R&D）留出时间，或者拥有一个完全专门的研发团队，是同样重要的。毫无疑问，许多公司的防御正在变得更好，这是一个非常棒的事情。对于我们黑客来说，攻入组织变得越来越困难。为了继续前进并保持领先，你需要一个有时间开发他们的战术、技术和程序（TTP）并将其融入团队的团队。你需要能够理解防御、它们如何应用，最重要的是你如何能够规避它们。归根结底，我们的水平取决于我们所在的团队。我们作为一个团队工作，也作为一个团队面对失败。\n\
  \n> “红队是技能组合的结晶。没有任何人知道关于某个特定主题的所有知识。”\n\n我记得我们参加过一次任务，当时我们与一个蓝队对抗，他们从字面上封锁了我们所做的的一切。那情况很糟糕（对我们来说），我们诚实地把它记在了心里。作为一个红队，我们感到被击败了——我们对组织的能力留下了深刻印象，并誓下次会做得更好不再让这种情况再次发生。这种对卓越的追求和相互尊重可以产生巨大的影响。■\n\
  \n# 24\n\nMaggie Ligon\n\n> “在现有的专长基础上增加计算机黑客技能，可以帮助你入门。”\n\n![](img/chapteropener.jpg)\n\
  \n**Twitter:** @doratepl17\n\nMaggie Ligon 在一家快节奏的咨询公司担任渗透测试员执行安全工作，对无线、网络、Web 和物理环境进行评估。她擅长\
  \ Web 测试以及为团队构建报告工具和技术，以提高编写效率，同时产生高质量、实用的报告。工作之余，你可以发现她在画画、寻找狗狗做朋友以及与亲家人共度时光。\n\
  \n## 你是如何开始进入红队的？\n\n在内部团队做了几年渗透测试后，决定是时候接受新挑战了并开始申请。我通过在线申请获得了一些回复，但实际上最有效的方法是参加安全会议并结识这些人，这向我介绍了我甚至不知道存在的团队。\n\
  \n## 获得红队工作的最佳方法是什么？\n\n如果你是从安全职位开始的，我建议考虑那些提供红队服务的咨询公司，以及那些负担得起自己内部红队的大型公司。此外，我强烈建议参加你当地的安全小组；那里一直有人招聘，或者消息灵通，可以为你指引正确的方向。\n\
  \n\n\n\n\n信息安全（InfoSec）的伟大之处之一在于人们的背景极其迥异。我认识过的人起点可能是郊区的全职父母、青少年犯罪犯、记者、退伍军人、软件开发人员、会计师、零售人员，凡你能想到的都有！如果你的背景看起来与此无关，我建议你先尝试一个简单的思维练习：写下你拥有的五个可以用于进入公司的技能。例如：“零售人员和家长：你能够与极不理性的人进行谈判。”这对于社会工程学来说是`great`的。\n\
  \n> “信息安全（InfoSec）的伟大之处之一在于人们的背景极其迥异。我认识过的人起点可能是郊区的全职父母、青少年犯罪犯、记者、退伍军人、软件开发人员、会计师、零售人员，凡你能想到的都有！”\n\
  \n在建立现有优势的基础上增加一些计算机黑客技能，以帮助你敲开门。要真正找到并获得一份工作，请采取与信息安全人员相同的步骤：自信地向咨询公司或大型企业申请，并参加当地的信息安全会议。\n\
  \n## 人如何在不触犯法律的情况下获得红队技能？\n\n### 软件和硬件黑客技术：\n* 参加`bug bounty program`。\n* 进行`capture-the-flag`\
  \ (`CTF`) 练习。\n* 学习如何构建你感兴趣想要拆解的物品，例如代码或锁。\n* 在漏洞练习环境中工作（例如 `Damn Vulnerable` 系列）。\n\
  * 参加当地的信息安全小组会议和会议。\n\n### 搜索引擎技能：\n这些技能对于红队行动至关重要；尽量尝试自己去掌握它们。学习的能力比在某个特定领域成为专家重要得多，尤其是在红队中。\n\
  \n### 人性黑客与物理安全：\n有很多用于技术学习和成长的资源。对于社会工程学和物理评估中更具人性的方面，实现合法性可能更加困难。一种方法是让自己处于不舒服（但仍是合法且安全！）的情境中。什么样的群体或环境会激起你内心的“拒绝”？你讨厌人群吗？周六去逛一个繁忙的商场，进入每一家开放的店面，并识别一个安全漏洞或特征，例如分心的员工或摄像头。感觉自己不不属于这里吗？很好！接受这种感觉并`act`得像你属于那里一样。你是信息安全领域那个热爱人群的人吗？去一个被预期你会独自且安静的地方，比如和平花园或博物馆。坐在那里。目标是能够解读一个空间并适应其氛围，而不是像他们那样兴奋。你抓到我们了？现在是周一早上\
  \ 8:35！看来我得提高我的水平了；感谢你的提醒。\n\n如果你很真诚并真正感激他人的技能，说出来可以建立同盟。分享信息。询问他们是在什么方面识破了你，并告诉他们你一直在做什么；两个团队可以共同进步。\n\
  \n我也曾在冷打电话时被发现过，但为我辩护一下，他们都是安全人员，所以他们很清楚。我只是挂了电话没有表现露出来，然后内心死死。\n\n这里有一个更有趣的故事：我当时看起来非常、非常可疑，在办公室里闲逛并看桌子，Greg（正确地）问我是否需要帮助、我和谁在一起等等。于是我告诉我正在和信息安全人员合作……他就让我继续逛了。我不确定他是否没有举报我，但我没被告知他举报了。嘿哈哈。\n\
  \n## 在执行任务期间，你遇到过的最大的伦理困境是什么？\n\n也许不是最大的，但是最无处不在的：关于范围的界限。我知道某个服务器有`SQLi`，但它不在范围内，或者我没时间了。在那个时刻离开总是很艰难的，但其他客户需要测试，而且监狱可不好玩。\n\
  \n## 红队是如何合作完成任务的？\n\n* *软技能*：保持谦虚，为正确的事站声，沟通，并能够分歧后执行。\n* *硬技能*：写出出色的文字，能够深度地回答技术问题，并能够复现问题。\n\
  \n## 关于编写良好的报告，有什么实用的建议？\n\n由于曾担任过渗透报告的接收方和发送方，我非常看重关于如何重建问题的清晰指示。这有一点自私自利；当我进行重新测试时，我希望能够直接通过，而无必重新学习整个环境！从开发者那里，我听到更多关于明确风险的担忧。毕竟，通常是开发者必须说服高层签署风险接受。\n\
  \n此外，大家都喜欢图表和图片；没多少人喜欢阅读。\n\n\n\n\n指出安全优势，并展示如何通过相关控制进一步加强这些优势。如果有机会和蓝队成员一起吃午饭，或者进行类似的非正式交流，你也可以谈谈之前的测试（显然，不要违反保密协议）或者你从其他测试人员那里听到的故事。红队活动非常酷，很多人都喜欢听有趣的技巧发现、惊险的逃生以及史诗级的失败，他们可能会在此过程中无意中吸收一些有用的信息。\n\
  \n### 在招募和面试红队成员时，你寻找什么样的非技术技能或态度？\n\n对学习的极度渴望，这种渴望远超任何已获得的或未获得的自尊，以及听取的欲望和能力。拒绝学习或沟通的人无法适应环境。\n\
  \n### 从不同角度解决问题方面，优秀的红队成员是如何脱颖而出的？\n\n没有哪种类型的人是理想的红队成员。每个人都有独特的贡献。如果你是团队的一员，你就有可以提供的东西，请自信地提供出来。对一个人来说显而易见或自然的事情，从另一个人的角度来看可能是一个全新的方法。■\n\
  \n> “没有哪种类型的人是理想的红队成员。每个人都有独特的贡献。”\n\n# 25 Jeffrey Man\n\n> “我心中完美的红队演练是彻底的失败加上早期的发现。”\n\
  \n![](img/ManJeffrey.jpg)\n\n**Twitter:** @MrJeffMan\n\nJeffrey Man 是一位备受尊敬的信息安全专家、顾问、传道者以及安全播客\
  \ *Security Weekly* 的联合主持人。他在计算机、网络和信息安全的各个方面拥有 35 多年的经验。Jeffrey 曾在 `DoD` 以及私营企业担任过各种信息安全职位，曾是\
  \ `PCI QSA`，并是 `NSA` 第一支渗透测试红队的成员。\n\n## 你是如何开始红队生涯的？\n\n我最早在 90 年代初开始接触伦理黑客，当时我在国家安全局（`NSA`）信息安全局（`INFOSEC`）的一个名为实地系统评估分支（Fielded\
  \ Systems Evaluation Branch）的机构工作。该分支的任务是对 `NSA` 开发并目前由美国陆军、国防部和务部等实体使用的加密和通信系统进行安全评估。该分支的一个重点领域是网络系统，我的兴趣倾向于那个小组，因为他们谈论的内容是我通过看《战争游戏》（*WarGames*）和《偷天鼠》（*Sneakers*）等电影才学到的。我们基本上是从通过攻击对方的工作站并尝试获取我们本地局域网的“root”权限开始学习如何破解计算机和网络的。\n\
  \n在我开始实地系统评估分支工作后，随着 1993 年 1 月 23 日由国家超级计算机应用中心（`NCSA`）发布的 `Mosaic` 初版，我们所知的世界发生了永远的改变。尽管我们已经在使用工作站、网络甚至互联网，但\
  \ `Mosaic` 的发布极大地向普通提高了互联网（当时被称为世界维网）的普及率，这引起了 `NSA` 执行领导层的关注。经过几个月的广泛分析和规划，形成了\
  \ `NSA` 第一个网络安全卓越中心，并命名为系统与网络攻击中心（`SNAC`）。\n\n`SNAC` 的形成涉及将来自 `INFOSEC` 局各地的众多分支和部门搬到一个地点，该地点是位于现在的巴尔的摩/华盛顿国际瑟瑟德·马歇尔机场附近的\
  \ `NSA` 友谊馆（`FANX`）综合体的一栋建筑。我们的分支也被包含在搬迁中，我们这群专注于学习黑客技巧的小团队最终获得了自己的办公室，并在那里磨练技能并实践我们的技艺。\n\
  \n我们专注于学习一切可能的黑客技巧，作为其中的一部分，我们想要尽可能地拥抱黑客文化并过那种生活方式。我们在办公室里建立了自己的网络，买了一台冰箱并在里面装满了山可乐，并将我们的黑客空间命名为“坑”（The\
  \ Pit）。\n\n那时我们帮助自己的工具很少，自动化方面也寥寥无几。黑客会议当时还并不存在，因为像 `DEF CON` 这样的会议才刚刚起步（而且对“联邦人”来说并不友好）。几乎没有可用的培训课程，自动化工具也几乎不存在。所存在的工具大多是“设计”用来帮助网络和\
  \ `Unix` 管理员保护其系统的。\n\n我们所拥有的是对学习的渴望，以及获取当时公开可用的大量信息的能力（你只需要知道去哪里找它们就行了），以及几本“圣经之书”，例如\
  \ Simson Garfinkel 和 Gene Spafford 写的《实用 Unix 与互联网安全》（*Practical UNIX and Internet\
  \ Security*）、William R. Cheswick 和 Steven M. Bellovin 写的《防火墙与互联网安全：击败狡猾黑客》（*Firewalls\
  \ and Internet Security: Repelling the Wily Hacker*），以及 Clifford Stoll 写的《蛋窃》（*The\
  \ Cuckoo’s Egg*）。\n\n我们学习了黑客技巧以及如何利用许多操作系统的“特性”。我们开发了一套执行我们称为漏洞和威胁评估（`VTAM`）的方法；毕竟，`DoD`\
  \ 喜欢缩写。我们为许多内部客户以及使用机密网络的其他 `DoD` 客户执行了 `VTAM`。我们在非 `DoD` 和未加密网络中也有需求，因此我们还学习了如何应对官僚机构和\
  \ `NSA` 章程，并最终开发出了一种在合理时间内与我们的“客户”对接的策略。\n\n当时我们并不称自己为红队——那个术语还不存在。我们是黑客。\n\n我给出对这些相关活动的定义，目的不是为了改变任何人对含义的看法，仅仅是为了理解和提供视角：\n\
  \n*   *漏洞扫描*：一种自动化工具，用于报告目标系统的漏洞和/错误配置，通常不包含任何业务运营的背景。\n*   *漏洞评估*：一个研究、访谈、观察实体业务运作、计算和网络操作、应用开发等的过程，旨在提供如何提高实体整体安全性的建议。\n\
  *   *渗透测试*：一种由熟练黑客执行的人工练习，用于测试目标实体的防御和/检测能力。目标以及任务范围可能有所不同，但总体目标是看实体在面对破入或攻陷尝试时表现如何。简单来说，渗透测试提供了威胁模拟，并将发现的重点集中在导致任何负面结果的流程和操作弱点上。\n\
  *   *红队*：对我来说仍然是一个新概念，但我听过大多数人描述红队演练的方式与我描述渗透测试的方式相似。他们接着描述渗透测试很大程度上是一个自动化过程（使用漏洞扫描器），根据任务的目标、范围和时间表，报告尽可能多可以被发现的漏洞。\n\
  \n**获得红队工作的最佳方法是什么？**\n\n这似乎是网络安全领域最令人向往的职位。我个人认为大多数渗透测试/红队演练都是没有意义的——特别是当它们依赖扫描结果并仅报告漏洞时。不过，我可能模糊了定义——但没关系，因为我们无法对红队的定义达成共识。\n\
  \n我并不是说不需要高技能红队，我是说即使在今天，大多数雇用红队的公司并没有做好演练的准备，因此他们往往在浪费金钱。\n\n\n\n\n对于大多数公司而言，更好的参与方式是进行漏洞评估。有些人可能将其称为桌面演练（tabletop\
  \ exercise），但去问任何一个合格的红队成员，他们都会告诉你，仅仅通过与目标公司的初始访谈/启动会议，他们对如何攻入该公司就有非常清晰的思路。\n\n\
  因此，获得红队工作的最佳途径是展示过过的技能。但我想问这样一个问题：为什么对于破坏东西有如此大的热情/关注和培训，而对于从一开始就构建能够抵御攻击破坏的系统，却没有受到同样的重视呢？\n\
  \n> “为什么对于破坏东西有如此大的热情/关注和培训，而对于从一开始就构建能够抵御攻击破坏的系统，却没有受到同样的重视呢？”\n\n### 如何在不触犯法律的情况下获得红队技能？\n\
  \n不要做任何违法行为。有很多方法可以在安全的地方进行练习，例如 `CTFs`、黑客空间，或者构建你自己的网络/系统（这本身就是一个很棒的学习练习）然后将其攻破。\n\
  \n## 为什么我们无法对什么是红队达成共识？\n\n可能原因与我们行业中其他术语（如 `security` 安全、`risk` 风险、`vulnerability`\
  \ 漏洞或 `threat` 威胁）无法达成共识的原因相似。术语缺乏共识的主要原因在很大程度上是因为没有用于创建此类定义的权威来源；或者说，私营部门没有意识到或承认曾被认为是权威来源的机构，即\
  \ `NSA` 在 1992 年发布的《国家信息系统安全 (INFOSEC) 术语表》。\n\n除此之外，我认为我们术语体系中最大的问题很大程度上源于对于那些无论你想如何称呼的——但可能可能是漏洞评估、渗透测试或红队演练——的活动、目标或目的，缺乏共识或标准化。\n\
  \n我认为，先与客户/目标设定预期并确定目标和目的是至关重要的，随后是交战规则（rules of engagement）、时间、报告等。我从 1997 年开始在私营部门工作，提供漏洞评估和渗透测试。嗯，我们通常执行的是漏洞评估，尽管客户总是要求进行渗透测试。每当我开始与客户讨论他们对服务方面的需求时，我会问几个关键问题：\n\
  \n*   你们是希望我们找到所有能让攻击者进入你们环境的漏洞（漏洞评估），还是只想让我们找到一种进入方式并看看我们能走多远（渗透测试）？\n*   你们希望从这次活动中获得什么（目标）？\n\
  *   你们计划如何利用我们的测试结果（目的）？\n\n大多数时候，客户虽然读过或听过渗透测试的需求，但在被追问时，他们真正想要的是漏洞评估。我通常需要引导他们完成剩余的流程，为这次活动制定合理的目标和目的，并最终产生成功的结果。\n\
  \n我们衡量成功的标准不是是否成功获取了网络的 `root` 权限，而是 a) 是否被捕获/检测，或者 b) 客户是否从经验中学习并对其系统和流程做出真实的改变。\n\
  \n我们失败的次数往往高于成功。\n\n### 信息安全其他领域对于红队工作有什么不理解的地方？你听过关于红、蓝队最具毒性的谎言是什么？\n\n红队行动不应该是终极目标。我认为最具毒性的谎言是：红队不应该是任何对该领域感兴趣的人的目标。至于毒性谎言，我会选择“红队比构建东西酷得多”这种观点。我们失败的次数往往高于成功，是因为我们没有足够的资源，或者组织还没有准备好。\n\
  \n### 你应该何时为组织引入正式的红队？\n\n当该组织已经有效地建立了其安全计划时。一旦组织知道自己需要保护什么，它就需要描述它将如何完成任务。\n\n\n\
  \n\n那是我取消渗透测试的契机，我说服了客户我们需要我们来进行架构审查，从根本上帮助他们建立安全网络，并充分利用他们的防火墙。\n\n我学到的人生教训是在我们向公司首席财务官提交项目报告时获得的。他评价说，令他印象非常深刻的是我们为他们做了正确的事，帮助他们变得更好，而不是盲目地固守合同，只做被雇佣要做的事（然后为我们最终完成的工作额外收取额外费用）。我的感悟是，我们应该始终对客户负责——在那次合作之后，他们最终成为了我们多年的客户，而我们最终不仅是他们的渗透测试员，还成为了他们信赖的顾问。\n\
  \n> “我们从事的是安全行业，当你信任一家公司或个人可能会访问你组织中所有有价值的资产时，你需要知道他们是值得信任的。”\n\n### 能够防止系统或网络被破解的最重要或最易实施的控制措施是什么？\n\
  \n我不认为答案是技术性的。我认为答案是教给他们不知道的知识。这样他们就能就如何投入稀缺资源做出更明智的决策。此外，还有外包——但要小心，将安全责任交给第三方并不意味着你自动转嫁了潜在的责任。这两者有很大区别。\n\
  \n### 为什么你觉得遵守作战规则（Rules of Engagement）至关重要？\n\n诚信和信任。我们从事的是安全行业，当你信任一家公司或个人可能会访问你组织中所有有价值的资产时，你需要知道他们是值得信任的。所以，要让自己值得信赖。\n\
  \n当我为一个客户工作时学到了另一个早期的教训，当时客户雇佣我们对单个 `IP address`（那是他们的边界防火墙）进行渗透测试。我们被明确要求不要扫描或尝试访问该单一\
  \ `IP address` 周围的任何其他 `IPs`。我们通过简单的 `port scan` 注意到在他们的注册地址空间内有其他系统在响应，通过连接浏览器，我们推断出它们很可能是开箱即用的\
  \ Web 服务器。当我们向这家公司的大老板汇报时，我展示了我们的发现（这些发现针对实际目标来说并不多少），但也提供了一个脚注，说明在侦察期间，我们注意到了似乎是默认的\
  \ Web 服务器，这些服务器极有可能让我们完全获得其内部网络的访问权限，并绕过他们配置得非常严密的防火墙。我想这次是 `CIO`。他的反应是无价的，并给了我另一个早期的的人生教训。他转向员工问道：“我们的流程出了什么问题，竟然让人们做了这种事而没有被追究？”流程。真正的漏洞并不是默认\
  \ Web 服务器——而是有人竟然能把它放出来，而且没有人发现它或对此发表过任何意见。\n\n### 如果你在渗透测试或其他任务中被抓包了，你是如何处理的？\n\
  \n在我在私营部门的早期，我有时会作为侦察的一部分对“潜在客户”进行 `port scan`，以确定他们需要哪种帮助。我记得有一次我扫描了欧洲某的一家银行。他们采取了一些检测机制，将扫描追溯到我们的注册域名，并最终向我公司的\
  \ CEO 发送了一封相当恶劣的“停止并终止”的邮件。当我发现这件事时，我联系了发起方并赞扬了他们的检测能力。他们并不因此高兴。\n\n### 在执行既定目标时，你遇到过最大的伦理困境是什么？\n\
  \n我能想到的最大困境是在担任支付卡行业（`PCI`）合格安全评估师（`QSA`）的日子。`PCI` 的要求之一是每年进行内部和外部网络渗透测试。作为 `QSA`，我必须首先确认是否执行了所需的渗透测试，然后我必须获得报告副本并审查结果。很多时候，我不得不面脸表情地接受一份仅仅是带有一个封面的\
  \ `Nessus report` 的“渗透测试”报告。最大的伦理困境是当渗透测试/红队由我自己的公司雇佣时。\n\n## 红队是如何协作完成任务的？\n\n\
  距离我参与活跃实战任务已经有一段时间很久了，但在过去，“团队”方面通常表现为：a) 分而治之，特别是当从外部和内部同时进行时；b) 在需要时协作尝试解决问题；c)\
  \ 让团队的每个成员做他们最擅长的事，这意味着我承担了大部分的沟通和写作，让团队中的其他成员负责技术方面。我们都会参与结果的报告编写和演示，因为我们都渴望教他们如何防止我们所实现的那些攻击。\n\
  \n### 如果你转到蓝队，更好地防御攻击的第一步是什么？\n\n我不会转的，因为我不再活跃了。但是，我认为更好地防御攻击的第一步是弄清楚两件事——你正在保护什么，以及你正在防止什么/谁的攻击。\n\
  \n### 关于编写良好的报告，有什么实用的建议？\n\n在过去的 15 年里，我有幸审查过的报告，大部分（如果不是的话）都侧重于自动化发现的输出，而对我所谓的自定义或定制化内容则极少。我理想中良好的红队报告是，你要在某种程度上描述你尝试过的方法/技术，并且不仅描述成功，也描述失败。记住，我理想中完美的红队演习是彻底的失败加之尽早的发现。当发现漏洞时，焦点不应放在“我们发现发现了一个漏洞并利用了它”，而应该是“此类漏洞的存在表明某个特定的流程或某一组流程失效了”。这应该跟进关于如何解决流程问题的详细建议，而不仅仅是“我们需要安装缺失的补丁”或“我们需要将那个共享管理员密码更改为\
  \ `Secret123`以外的内容”。\n\n> “我理想中良好的红队报告是，你要在某种程度上描述你尝试过的方法/技术，并且不仅描述成功，也描述失败。”\n\n\
  ### 如何确保你的项目结果对需要完整叙述和背景信息的人具有价值？\n\n\n\n\n我尝试从基础开始，并在此基础上进入更详细/更细微的建议。真正的受众并不总是雇佣你的那个群体，而是某种程度的高级管理层，他们（无无意）通常完全不知道我们在说什么。这就是为什么这演变成了一场说服性演讲，因为你正试图让别人理解他们为什么要改变行为或态度，而且在大多数情况下，还需要花钱。背景决定一切，挑战在于如何以接收者能够理解的方式来解释所需工作的复杂性。我称之为“绝地大师的精神幻术”，它涉及诸如倾听、了解你的受众、学会说他们的语言、讲述故事/进行类比（既符合他们的参考框架，又能传达要点）、简化问题、在业务及其业务流程的背景下构建讨论框架，并且不要假设他们第一次就能听懂。建立反馈循环，询问他们听到了什么，最重要的是，尽量不要让事态的糟糕程度让他们不知所措。古非洲谚语：“如何吃掉一头大象？一口一口吃。”\n\
  \n## 在招募和面试红队成员时，你会寻找哪些非技术技能或态度？\n\n我在这里肯定会提到具备良好的沟通能力，但我通常从那些口头上这么说但随后的表现却糟糕的人那里听到这句话。除此之外，我只能建议一些对我自己有效的方法，即对一切事物都保持某种怀疑态度，具有持续深挖的韧性，不接受拒绝，并始终寻找另一种方法——我想我们可以将其称为“黑客心态”，这本身并不是一项技术技能，但对于帮助一个人在该领域取得成功大有裨益。\n\
  \n## 在以不同方式处理问题方面，优秀的红队成员与普通人之间有何区别？\n\n对我来说，最好的红队成员是那些：如果客户还没有准备好，他们会离开或引导客户远离红队演练，但会与他们合作让他们做好准备的人。我认为同样重要的是理解客户最初为什么要请求第三方红队演练。是因为监管或合规性要求吗？还是他们之前曾被攻破或入侵，现在才有了正确的态度？\n\
  \n> “对我来说，最好的红队成员是那些：如果客户还没有准备好，他们会离开或引导客户远离红队演练，但会与他们合作让他们做好准备的人。”\n\n换句话说，不仅要准确地定义什么是“问题”，还要将其与目标、范围、目的和预期结果在背景中结合起来。优秀的红队成员也是老师，教学从项目开始就开始并贯穿整个过程，理想情况下一直持续到客户能够熟练地捕获狡猾的黑客为止。■\n\
  \n# 26\n\n### Tim MalcomVetter\n\n> “我认识的一些非常聪明的渗透测试人员，如果他们意识到红队行动需要多少枯燥的侦察和规划，可能会感到无聊。”\n\
  \n![](img/MalcomVetterTim.jpg)\n\n**Twitter:** @malcomvetter\n\n你好！我叫 Tim MalcomVetter。我从\
  \ 20 世纪 80 年代就开始作为一个孩子使用、组装和破解计算机，并从 2000 年开始以此获得报酬。在此期间，我：\n\n*   为财富 500 强企业提供过咨询\n\
  * 进行过从主机插座到 Web API、从燃料泵到移动应用的各种攻击\n* 领导过电子商务开发团队\n* 部署过企业级安全解决方案\n* 犯过许多错误\n\n\
  目前，我很幸运能在一家全球最大的公司运营一个非常出色的红队项目，与我能够招募/留住的优秀队友（他们的爱好与职业高度一致！）一起跨五个大洲模拟对手。\n\n##\
  \ 你是如何开始接触红队的？\n\n正确的地点，正确的时间，正确的技能，正确的态度。我喜欢认为，红队工作确实整合了我从每一份工作（无论安全领域还是其他领域）中学到的所有技能。我不认为我可以淡化任何过去的经历，认为它们对我职业达到如今的成就没有起任何作用。\n\
  \n我也意识到，成为客户信赖的顾问是非常重要的。在更年轻时，我并没有意识到这一点。在进入红队领域之前，这种经验对职业非常有帮助。\n\n## 获取红队工作的最佳方法是什么？\n\
  \n很多人说他们做红队工作。我不怀疑他们是真的。我认识的一些非常聪明的渗透测试人员，如果他们意识到红队行动需要多少枯燥的侦察和规划，可能会感到无聊。对他们来说，红队只是渗透测试的进阶，这与事实完全相反。红队并不比渗透测试更好；它们是不同的学科。其他人出于错误的原因想做红队工作。在他们脑海中，这是为了换薪水而演的好莱坞剧本。\n\
  \n你可能需要在其他职位上获得一些经验。我不认为必须遵循特定的步骤才能获得工作，但某些经历对你没有坏处。如果你在 IT 安全领域之外花费过时间，那么你支持业务发布功能的经验将让你更擅长红队工作。编程技能不是必须，但确实有帮助。我认识的最优秀的红队成员至少精通其他人所谓的\
  \ `combat coding`（即现场编写工具）。防御网络和系统的经验无疑是一个巨大的加分项。如果你不理解如何防御攻击，你的表现将会遇到天花板。不懂防御就无法理解进攻，反之亦然。你拥有的经验越多，在这个工作中依靠的直觉就越多。假设你真的想做这类工作，出于正确的理由，但你对这个领域还是个新手。我的建议是与已经在工作的人建立联系。提问。保持谦虚。基本上，在对方没有意识到自己在指导你的情况下，接受一位导师。找出自己的技能短板并独立解决它们，因为想要这些工作的人比这些职位多得多。虽然信息安全职位可能存在人才短缺，但每当我有招聘红队成员的名额时，简历会从四面八方涌——遗憾的是，其他类型的职位并非如此。你可能会面临该职位的竞争。在担任不同的\
  \ IT 或信息安全职位期间，建立联系并进行一些个人发展是一个好主意。\n\n\n\n\n这其实很简单：不要违法。无论你住在哪里，这可能意味着你不应该动别人的电脑。在今天，几乎不需要花钱就能在家里搭建一个虚拟实验室（相比于我以前上学时，双程路都要上坡，而且还要在雪地上——在那个年代，由于虚拟化还什么都不是，我们必须在物理硬件盒上构建实验室）。\n\
  \n## 为什么我们无法对什么是“红队”达成共识？\n\n因为这只是一个每个人都想拥有并执行的“热销商品”所贴的简单标签，它驱动了营销炒作，并激发了那些不通技术、不理解细微差别且不愿花时间学习的人进行浅层销售推销的灵感。\n\
  \n借用温斯顿·丘吉的话，`red team` 可能是对我们所做工作最糟糕的标签（其他其他标签也如此）。无论你喜不喜欢，它都是一个行业标准，而标准的伟大之处在于，有这么多标准供你选择！\n\
  \n当然，信息安全（InfoSec）并不是这个术语的起源者。我们是从二战时期的军事学中借用的，当时美国是蓝色的，而苏联是红色的。我听过一个小传闻，在中国，他们把这项工作称为`蓝队对抗`，因为他们的旗帜是红色的；因此，红队是好人。也许有一天我们会有一个更好的名字。\n\
  \n## 信息安全其他领域对加入红队有哪一点是不理解的？关于红队、蓝队或紫队，你听过最有毒的谎言是什么？\n\n我经常听到“红队很轻松”或“蓝队只要错一次红队就能赢”。在过去的一年里，我开始看到人们理解事情的另一面，但并不是所有人都能理解。如果你做红队工作觉得很轻松，要么是你没有帮助你的客户增长他们的安全计划，要么你正在从尚未准备好进行红队测试的客户拿钱。面对一个坚固且防御良好的目标，充其量只是回合锯——坦率地说，蓝队完全可能压倒性胜利。是的，蓝队必须犯错（或者更现实地说，由于安全预算有限会导致漏洞），但红队也有很多机会制造错误，并在目标达成之前被检测和封锁。这是复杂且具有细微差别的。\n\
  \n我看到一种将红队人员推到蓝队人员神坛之上的模式。我认为这有几个原因：a) 一些惊人的防御工作是在闭门操作和保密协议下进行的，永远不会被公开讨论，但大多数攻击性工作发生在咨询领域，那里工作的发布通常是最好的营销策略，或者是由内部团队试图招募安全人才，所以我们都能听到这些；以及\
  \ b) 我们喜欢像好莱坞那样美化这项工作，忘记了工作背后的真实目的：红队的工作是成为冠军拳手（即蓝队）的私人教练、力量/体能教练和营养师。很少有人记得顶尖运动员的教练。我们需要保持这种心态。\n\
  \n## 你应该何时向组织的安全计划中引入正式的红队？\n\n对一个不成熟的组织进行红队测试的好处很小——微乎其微，不是零。至少，一个不成熟的组织可以经历一次严重的“唤醒”体验，从而立即启动他们的安全计划，但在他们建立基础之前，他们不需要反复的红队演练。我做过很多这类——如果呈现得当，它们是可以有效的。\n\
  \n如果一个组织正在扩大其安全计划，并且仅投资于防御（而不是检测和响应），那么红队演练就像聘佣了一支专业的数独解题者。他们最终会找到正确的事件序列，穿过所有网络、云和人员以实现他们的目标。由于没有人盯着（检测），没有人会注意到所有尝试通过防御控制关的失败尝试。这种演练的唯一益处就是弄清楚红队花了多久——这并没什么价值，因为可能是由于红队不熟悉某个特定的防御控制（但真正的对手可能熟悉），所以减慢了他们的速度，或者可能仅仅是红队在浪费时间。在红队确定攻击路径后，这非常像看职业游戏玩家在《超级马里奥兄弟》中进行两分钟的通关跑，打通整个游戏。看起来很有趣，但价值到此为止了。\n\
  \n理想情况下，安全计划已经具备了其基础：它有一份关于他们实际需要保护的重要资产的基础清单（始终从资产清单开始！），拥有一套围绕该清单的基础访问控制（防御），并且有日志发送到中心处理流程中，由技术和人类结合对日志进行告警。即使这样，也建议先基于\
  \ `MITRE ATT&CK` 的行为对基础检测进行“单元测试”。最后，组织需要知道什么对敌对者来说是有价值的，以便对其进行建模。\n\n## 你如何向不情愿或非技术的客户或组织解释红队的价值？\n\
  \n我总是喜欢告诉我的利益相关者我们如何关注真实性。我们不讨论那些只有在每三个蓝月之夜星星对齐且你单脚站时才能被利用的理论漏洞。它是二元的：要么我们实现了目标，要么没有实现。我们的工作是让业务做好准备，以应对攻击者可能在他们不知或不同意的情况下进行不公平的竞争。\n\
  \n## 你看到的性价比最低的安全控制是什么？\n\n我不认为我可以确定出一个投资回报率（ROI）最低的安全控制，但我经常看到并听到某些组织的安全支出优先级脱离现实。例如，如果组织将大部分预算花在先进的硬件安全模块\
  \ (`HSMs`) 上来加密其核心资产，但却留着单因子认证的大门，并且还没有想出如何阻止简单的“月份+年份”式密码，那么一旦红队测试开始，这将是一个非常糟糕的选择。我不确定为什么从心理学上说，我们看到这么多安全从业人员这样做，但当防御者在担心零日漏洞和国家级攻击时，忽视了更有可能被利用的基础设施，这非常常见。\n\
  \n## 你是否曾经建议不要进行红队行动？\n\n我对请求红队演练的人的默认回答是引导他们转向另一个方向，但因为我不是一个试图将红队演练作为收入来源的顾问。作为一个内部团队，我们尽力根据各种输入和风险担忧来选择目标和场景，而且根据一般原则，我们基本上不会在开始前通知利益相关者我们要来了。\n\
  \n\n\n\n通常，如果项目所有者/利益相关者来找我要求对项目进行“红队”（red team）测试，我会拒绝并礼貌地引导他们转向执行风险审查、威胁建模、源码审计和应用程序渗透测试的其他团队。那通常是他们真正想要的。对于那些要求进行红队测试的人来说，`Red\
  \ team` 通常意味着“请尽管用你的忍者海盗猴激光鲨来攻击我的资产吧；我想确保它是安全的。”但对我们来说，`red team` 意味着模拟向目标移动的攻击者——通常是为了获取可以变现的数据，而且绝不是在对方已经拥有先进知识的情况下行动。攻击者的目标不是为了在你华丽的新应用程序或环境中称王“山之王”；他们可能会进进出出，但仅当这能让他们更接近实际目标时才会。因此，利益相关者的请求更多是作为我们未来工作规划流程的输入，然后我们会根据其他关注点、`FAIR`\
  \ 风险计算以及其他通用业务需求对其进行验证。\n\n## 哪种最重要或最易实现的控制措施可以防止你破坏系统或网络？\n\n我没有单一的简单控制措施可以推荐，但通过做到这三件事，你可以获得巨大的成效：在所有外部服务上实施多因素身份认证，在所有用户端点上使用最小权限（`nonadmin`）账户，并尽可能将大量日志发送给合格且胜任的安全监控人员。你永远无法消除任何环境中的所有漏洞，但如果你有一个良好的检测和响应程序，你可以让这些漏洞毫无意义。\n\
  \n## 为什么你认为遵守参与规则（rules of engagement）至关重要？\n\n除了法律因素外，参与规则是红队和蓝队互动及执行演练的合同。至少在其他方面，违反\
  \ `rules_of_engagement` 会导致信任破裂。信任破裂会导致缺乏增长（双方如此）。缺乏增长导致通向更安全性的进展为零。而零进展真的会让你怀疑组织为什么要付钱请你做红队工作。红队是一个昂贵的成本中心（除非你是顾问，那时你就是所在公司的利润中心，但对你的客户来说仍然是开销成本）。如果组织没有直接受益，这项工作就会停止。因此，遵循\
  \ `ROE` 并与蓝队共同审查以确保其效能最大化是必要的——没有任何借口。\n\n## 如果你在渗透测试或其他任务中被抓到了，你是如何处理的？\n\n与互联网上让你相信的观点相反，一个防御良好的组织将会抓到你，而且如果你与他们进行多次红队循环，他们会频繁抓到你。\n\
  \n第一次发生这种情况时，我们非常意外。我们完全没有预料到。我们对自己感到失望，对被封锁和切断连接感到惊讶，并且整个团队甚至在一次红队视频会议中，对我们的蓝队开始缓慢地鼓掌，对他们的工作表示由衷的钦佩。尽管我们的自尊心希望那只是最后一次，但事实并非如此。每一次，我们都拥抱这种个人失望与对蓝队自豪交织的情绪。我们尝试立即确定我们可能犯了哪些指标或其他操作失误，以便在与蓝队进行事后总结（postbrief）之前得出几个假设。“是\
  \ X，对吧？” 我们的目标是不断改进。这意味着我们会犯错。正如柔术中所说的，“要么赢，要么学。”而我们确实学到了很多。\n\n如果你有一个健康的运行机制，你被抓到的频率将与你成功的频率一样。如果任何一方比另一方更频繁地“赢”（我讨厌在这个语境下用这个词，但它是表达意图最简单的方法），那么这直接表明程序没有正常运作，可能意味着获胜方在事后分析中分享足够的数据。我们铸造了红队挑战币，硬币上醒目地刻有一句我们从\
  \ `NSA` 团队借用的话：“如果我们赢了，我们就输了。”这种二元对立驱动着我们。我们想要“赢”（达成目标）。我们允许自尊心帮助我们实现那个目标，在这个过程中，我们是磨炼蓝队的铁石。但如果我们实现了那个目标，我们会以对其意义的谦卑和严谨态度对待它——这意味着我们作为一个安全组织失败了。我们同样希望这种情况不要发生。所以，我们确保——演练一结束——重新调整我们的私心，投入到产出工作中。\n\
  \n对我们来说，红队测试很有趣。我们为此获得报酬。我们想要确保检测控制仍然有效。\n\n## 在执行任务时你遇到过的最大伦理困境是什么？\n\n最大的困境可能是法律限制，它阻止我们完全模拟真实的攻击者。真实的攻击者可以破坏第三方，将其用作基础设施，并对许多组织同时进行攻击。在法律上你可能无法这样做，除非你非常有创意，否则模拟这一点是非常困难的。\n\
  \n## 红队是如何合作完成任务的？\n\n有些人会告诉你他们正在做红队测试，但当你问起细节时，你会发现他们是单兵作战的。我们称之为“单人红队”。抱歉，那不是红队。那可能只是一个范围很大的渗透测试。我们发现，由于许多原因，少于两名操作员的“团队”会限制成功。\n\
  \n首先，你做这些工作是为了真正的薪水。无论你在红队行动中是否实现了目标，你可能每隔周就会领一次工资。犯罪攻击者只有在达到目标并变现数据后才能拿到钱。这改变了他们的动力——他们会专注于实现该目标，并可能日夜不停地投入工作直到成功。然而，你可能需要请假去看牙医，想和朋友吃顿晚饭，或者可能计划了假期。也许你只是想离开屏幕休息一下。作为一名红队成员，你可以这样做而无必担心拿不到钱。这改变了局面。为了保持高强度，拥有三个或更多操作员的团队允许你们覆盖日程和假期，并确保当\
  \ Shell 程序“回家”时有人能捕捉它，在它超时失效之前将其充分利用。\n\n其次，与互联网上告诉你的观点相反，红队成员并不知晓与所有类型系统和所有安全技术相关的所有知识。拥有多样化技能的团队允许你们在问题出现时引入领域专家。后备越深、团队名单越长，你们团队中就越可能有人遇到过\
  \ X，并对此有创意的想法来处理它。\n\n\n\n第三，多人协作是有帮助的，这样可以根据时间分配工作。你可能会意识到，你目前拥有的某些权限是转瞬即逝的，它们很可能会产生入侵指标（IOC），并且在几分钟或几小时后，随着蓝队追上你的时间线，你可能会失去这些权限。如果你有多双眼睛和手来审查你拥有的权限，你就可以更快地分而治之领土。“单人红队”永远无法做到这一点。\n\
  \n第四，拥有团队允许你可以在追逐既有权限的*同时*收集用于复盘的数据。我听过其他团队用过一个词叫“狙击手与观察员”，即一个人负责键盘操作“追逐权限”，而另一个人则收集截图、日志输出和其他产物用于复盘，且不会减慢行动。这是我们经常遵循的流程——有时我们在脑风暴如何处理棘手情况时，会有五六名操作员观察同一个终端。在这些情况下，一个或两个操作员可能会在作战环境之外的实验室系统中测试某种技术，以支持团队关于下一步操作的决策。“单人红队”可以做到这一点，但执行速度比小组慢三到十倍，而在防守良好的组织中，这通常意味着会被检测、封制并清除。\n\
  \n### 在行动完成后，你采取什么方法进行复盘并支持蓝队？\n\n首先，我们在一个空间内顺序收集近实时的事件日志，该空间允许受邀请的蓝队成员（称为受信代理，trusted\
  \ agent）对其进行观察。受信代理的角色是作为检测和响应工作中的非活跃成员，主要确保演习不会影响业务（例如，通过将生产系统下线作为一种封制措施），并收集任何遗漏检测的日志，以便蓝队在复盘时查看为何会遗漏检测（复盘可能发生在几周甚至几个月后）。受信代理不承担任何主动防御角色，也不向红队通报事件的存在或状态。\n\
  \n其次后，我们尝试将所有事件（如果可能，尽量做到近实时）映射回 `MITRE ATT&CK`，以便在事后总结期间审查技术 ID，以确保更好的检测覆盖率。\n\n\
  第三，我们发现没有人会阅读或喜欢大量的书面报告——无论是被迫创建这些报告的红队成员、蓝队，还是作战环境的利益相关者。因此，我们不创建长报告。我们经常会创建一个简单的单页执行摘要，并不断磨炼我们的技艺，通过幻灯片为想要比单页概述更深入了解的观众讲述我们的入侵故事。\n\
  \n第四，我们会记录具有可操作性的发现。我们不忙于假设或理论性的内容——只记录我们确实利用过且与我们的建议直接相关的发现。\n\n第五，我们*从不*创建“红队复盘幻灯片”。我们总是创建“紫团队复盘幻灯片”。参与演习的红队操作员与蓝队受信代理以及参与的响应人员一起起草最终版本，且经理不在场。这非常重要。我们希望首先关注技术内容，并在报告阶段向双方强调大家是同一个团队。草稿完成后，由红/蓝队管理层进行审查，并开始向高管、技术和利益相关者观众传阅。\n\
  \n这一切都是门艺术，随着实践会变得越来越好。\n\n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\n我今天的回答与几个月后的回答会有所不同，因为这是一个移动的目标（你的环境应该不断改进并变得更难攻破）。但今天，我确实对那些在攻击基础设施被用于环境之前就对其追踪的威胁情报团队深感着迷。我在几个不同组织的朋友们开始从大规模互联网扫描中识别命令控制（`C2`）服务器的常见指标，识别\
  \ `C2` 服务器应用程序的类型，有时甚至提取其植入程序的配置——在这些攻击命中利益相关者的环境*之前*。许多 `C2` 服务器是通过由于懒惰或粗心的攻击者发现的——包括真实的（财务或国家级背景团体）和伪装的（红队）威胁因素。我发现非常有意思的是，当威胁情报导致在使用之前发现了\
  \ `C2` 端点，在恶意软件进入钓鱼邮件之前，端点的 IP/域名就在环境中被标记并拦截，威胁攻击者在开始之前就已经失败了。\n\n所以，如果我要防御一个具备所有基础设施和强大检测/响应程序的组织，我肯定会追踪一些战术威胁情报，拦截常见的\
  \ `C2` 端点，并在每当有一个节点尝试连接被拦截时进行密切计数。\n\n### 关于编写良好的报告，有什么实用的建议？\n\n我的朋友也是黑客的 Alex\
  \ Lauerman 曾说过：“我们免费黑客，但通过写报告拿钱。”太真实了。\n\n写报告的实用建议？如果可以避免就不要写，尤其是长报告。没有人会读 100 页的报告。很少有人会读超过三页。引导演习的互动式讨论（必要时使用幻灯片）。保持故事情节简单——把自己放在观众的位置，确保他们能理解你展示的一切，而不会产生任何困惑。保持良好的节奏，避免深陷细节太深，或者至少在进入具体细节时要非常审慎。然后将整个叙述和建议浓缩为一份易于阅读的单页文档（或更短）。如果你不能对演习进行“电梯演讲”版本，那么你自己可能还没有真正理解演习的真实价值和影响。练习，直到你能做到并这样做。\n\
  \n我见过红队成员对他们工作中所有细微之处感到非常自豪。那些细微差别很重要，但对所有观众都重要。不要在写报告时想着你正在写红队版的《战争与和平》，认为你的读者需要你对过去几周工作的第一人称全知视角。记住，少即是多。\n\
  \n如果你是一名顾问，千万不要在视频会议屏幕共享时给客户读一份 100 页的 Word 文档。我见过有人这么做过。很痛苦。没人想要那样。每个人都说讨厌 PowerPoint\
  \ 幻灯片，但他们更讨厌用 Microsoft Word 代替 PowerPoint。\n\nPowerPoint 是一门艺术。这不是安全会议，所以请把梗包留在家里。对幻灯片中的所有内容进行脱敏。所有的客户、承包商或员工姓名、用户\
  \ ID 以及你外泄的最后一个字节奖杯数据——展示足够的内容来暗示你确实做了你所说的事。如果他们不相信，你可以之后向他们展示未处理的数据。但先脱敏幻灯片之所以，是因为幻灯片对你的客户内部会产生乒乓球效应。\n\
  \n\n\n事实是，在复盘结束后一年后，高管、工程师和其他利益相关者并不会记得你所说的 99% 的内容。然而，他们会记得带给他们的感受。你是否让他们觉得自己很愚蠢？你是否让他们觉得你拥有高超的知识和智力？你是否表现得非常傲慢？或者，你是否让他们觉得你是伙伴，帮助他们度过了困境，从而确保这种情况不再再次发生？这才是至关重要的。\n\
  \n### 除了指出不足之处，你如何建议改进措施？\n\n由于我们总是对复盘进行“红蓝军协作（Purple Team）”，改进措施始终是“我们共同的”一套建议。在提交技术冲突给高管之前，我们会系统性地关注机会（即哪里存在不足）。这种方式会强调优点和教训，但由于我们进行多次迭代，不需要花费大量时间来复盘。我们可以不断推动项目，让每次目标都变得更有挑战性。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n我关注团队契合度（Team Fit）而非技术技能。在大多数信息安全（InfoSec）职位中，有很多对这项工作感兴趣的人，但在类似的职位中，合格候选人并不多。因此，我们首先关注态度和资质，然后是技能多样性。对于红队，我们通常不需要招聘三个或更多拥有相同技能的人，因为技能多样性本身就能带来多次回报。\n\
  \n在态度方面，我关注**内控型（Internal locus of control）**与**外控型（External locus of control）**。这是一个社会心理学概念，基本上可以总结为：“候选人是否对自己的成功和失败感到掌控？”你可以通过以下问题来挖掘这一点：“描述一次你参与的项目失败的经历，发生了什么？”如果候选人说“我的队友掉链了”、“老板做出了错误决定导致项目失败”或类似的话，意味着他们是外控型；而内控的候选人可能会说：“我们忽略了一个细节，我学会了如何确保\
  \ `X` 不会再次发生。”这听起来可能很愚蠢——就像给管理者的自我帮助指南——但当红队被制住且蓝队获胜时，外控的人会破坏双方的士气。如果你想保持红蓝双方良好的关系，请优先考虑这一特质。学会提问来挖掘它，从自我测试开始，当你听到自己口中说出外控观点时，立即停止并纠正自己的心态。\n\
  \n### 以不同的处理方式来看，优秀的红队成员与普通人的区别在哪里？\n\n优秀的红队成员会随时质疑一切，从头到尾提出假设、进行测试、排除变量，并系统地处理一切。这包括将团队视为一个整体，并意识到团队成功的唯一方法是充分利用所有资源。\n\
  \n优秀的红队成员会意识到，指导团队中的初级成员是一种力量倍增器——他们学习和知道越多，未来团队协作的速度就越快。导师所需的时间投入通常在单次演习中就能获得回报。\n\
  \n优秀的红队成员对结果从不满意，即使目标已经达成。优秀的红队成员会反思事件发生的顺序，关注如何提高效率，并意识到蓝队错失的检测和制住机会。他们会进行自我红队测试，就像棋象棋大师转动棋盘自我对弈一样。\n\
  \n优秀的红队成员会随着时间的推移积累大量的直觉。每次迭代（无论是实验室的练习，还是通过报告或博客记忆他人的工作）都会加深他们大脑中的神经通路并增加信心。优秀的红队成员通常只需对目标进行一小时的侦察，就能对安全计划的成熟程度以及最可能且成功的攻击路径有一个大致的想法。不要把这误解为只需要在侦察上花一小时！这意味着他们有良好的直觉，而且作为优秀的红队成员，他们会在侦察和规划上花费比任何阶段都长的时间，因为他们意识到侦察花费的时间越多，对目标的利用和行动就越容易。\n\
  \n顶级红队成员与顶级蓝队成员实际上是无法分的。这对于该领域的新手来说可能是最惊讶的细节。顶级的红队成员（反之，顶级蓝队成员）能同时清晰地看到同一枚硬币的两面，以唯一的问题变成了目标是什么。他们可以告诉你安全控制应该部署在哪里。他们可以告诉你如何检测并制住攻击。如果攻击的某个动作被蓝队识别，他们可以告诉你防御方应该如何进行分级和处理，因为他们自己就是世界级的事件响应人员。他们可以告诉你攻击者的动机在事件顺序中何时重要，何时不重要。他们可以用极少的规划切换战术。他们可以模拟多种类型的攻击者。他们能够从战略角度思考而不仅仅是战术和技术。他们被现实主义驱动；虽然他们尊重一些顶尖渗透测试员和漏洞开发人员的工作（也许他们也可以做那些工作），但他们更有动力让红队演习尽可能真实。直到他们意识到让其更真实的方法就是真的去犯罪时，他们才会满足。\n\
  \n\n\n\n我开始于渗透测试和进攻性网络行动，在我们创立 Rendition Infosec 时，我转向了红队（Red Teaming）。\n\n## 获取红队工作的最佳途径是什么？\n\
  在你的工作上努力。持续学习。展现出你的创造力、天赋和毅力。\n\n## 如何在不违反法律的情况下获得红队技能？\n对你的生活进行社会工程学，并在法律允许的情况下破坏东西。\n\
  \n## 为什么我们无法对红队的定义达成共识？\n因为 Gartner（高特纳）。\n\n信息安全领域的其他部分对红队哪一点是不理解的？你听过的关于红队、蓝队或紫队最具毒性的谎言是什么？\n\
  红队并非简单的渗透测试。红队需要像像攻击者一样行动，但必须有能力将结果与对业务和利益相关者有意义的内容联系起来。我听过最具毒性的谎言是你只需要选择一个队伍并一直呆在那里。\n\
  \n> “红队并非简单的渗透测试。红队需要像攻击者一样行动，但必须有能力将结果与对业务和利益相关者有意义的内容联系起来。”\n\n从多个角度发展你的技能。蓝色、紫色和红色的经验会让你在整体信息安全方面变得更好。进行交叉融合。\n\
  \n## 何时应该在组织的安全计划中引入正式的红队？\n先解决基础问题，然后通过创造性的讨论和规划，逐步将某些渗透测试任务重塑为红队评估。桌面红队（Tabletop\
  \ red teaming）是一种在不对当前测试周期和要求进行巨大更改的情况下增加成熟度的简单方法。\n\n## 你如何向不情愿或非技术的客户或组织解释红队的价值？\n\
  红队的价值在于理解并利用业务最恐惧的事。渗透测试仅局限于此，且目标不同。红队需要能够将传统安全审计的许多方面整合到一个任务中，跨越仅仅“检查合规性”的边界。\n\
  \n## 你看到实施的性价比最低的安全控制措施是什么？\n在了解自己的风险承受能力、流程成熟度和人员技能之前，就购买昂贵的工具。\n\n## 你是否曾建议过不要进行红队任务？\n\
  是的。有些组织还没有准备好接受红队评估。在这种情况下，我通常建议先进行更具性的技术评估或能力差距评估。\n\n## 防止你攻破系统或网络的最重要或最易实施的控制措施是什么？\n\
  多因素身份验证（包括对访问者的验证）、事件响应策略和密码长度。\n\n### 为什么你觉得遵守作战规则（Rules of Engagement）至关重要？\n\
  了解你的范围，特别是在成熟度较低的环境中。组织的政治和文化对红队任务的成功程度以及对业务的价值有很大。\n\n## 如果你在渗透测试或其他任务中被抓了，你是如何处理的？\n\
  掏出那张“免死金牌”，如果没用，就拼命逃跑。\n\n## 在执行指定任务时遇到过最大的伦理困境是什么？\n社会工程学对某些人来说可能很难。当你必须对某人关于带往急诊室的病婴儿撒谎时，这种感觉可能很尴尬，如果你家里也有孩子的话。\n\
  \n## 红队如何合作完成工作？\n许多不同的测试方面必须像芭蕾一样汇聚在一起；由于测试视角和方法的不同，报告工作可能也很困难。\n\n## 在任务完成后，你对蓝队进行汇报和支持的方法是什么？\n\
  红队的存在是为了让蓝队变得更好。你需要意识到，你那里是通过经过计算的利用机会和详细的攻击报告/叙述来增强防御。\n\n## 如果你转到蓝队，你防御攻击的第一步是什么？\n\
  增加对周围 IoT 设备以及“支持设备”（如打印机和多功能设备）的网络可见性和监控。确保我的组织为所有层级的员工提供清晰的事件报告程序。\n\n## 关于编写良好的报告，有什么实用的建议？\n\
  花额外的时间编写攻击叙述，保持执行摘要简短并面向三年级阅读水平，并将你所有的技术数据放在附录中。\n\n## 你如何确保你的计划结果对那些需要完整叙述和背景的人有价值？\n\
  提取出攻击叙述和任务背景。执行摘要应该是简洁且直击要点的。此外，考虑为具有某些技术背景但无法仅从技术发现中获得价值的执行人员增加一份技术总结。\n\n## 除了指出不足之处，你还如何建议安全改进？\n\
  将其与业务联系起来。让你的发现与你试图接触的行业和观众产生共鸣。\n\n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n魅力和舞台表演能力。我还会寻找展现出创造力和跳出思维的成员。\n\
  \n在以不同方式解决问题方面，优秀的红队成员如何脱颖而出？\n以非常规方式解决问题的能力。此外，在没有线性思维路径的情况下应对技术限制的能力。■\n\n# 28\n\
  \nOddvar Moe\n\n> “信任在这个行业是一件大事事。”\n\n![](img/MoeOddvar.jpg)\n\n**Twitter:** @Oddvarmoe\n\
  \nOddvar 是在 TrustedSec 工作的红队成员。他在 IT 行业拥有超过 18 年的经验，对 Windows 安全充满热情——这种热情以至于微软连续三年授予他最有价值专业人士（MVP）奖。作为演讲者，他曾在\
  \ DerbyCon、IT Dev Connections、Paranoia、HackCon 和 Nordic Infrastructure Conference\
  \ 等会议上进行过顶级课程。他还积极为安全社区做出贡献，因对 `LOLBins/LOLBAS` 和 `Ultimate AppLocker Bypasslist`\
  \ 的贡献闻名。他还发现了 Windows 操作系统的多个漏洞并发现了新的持久化技术。\n\n## 你是如何开始从事红队的？\n在 TrustedSec 从事红队之前，我在挪威担任渗透测试员。当我担任渗透测试员时，我总觉得任务中缺少攻击者的部分。运行许多噪音较大的工具在我看来，如果我是真实的攻击者攻击客户，这并不是一种自然的行为。我总是可以尝试模拟红队，但即使是我运行的噪音工具通常也没有被检测到，因此我的客户群尚未成熟到可以红。\n\
  \n我很幸运在 Twitter 上受到了 Dave Kennedy 的注意，最终他聘用我担任对抗模拟与威胁研究（AETR）团队的红队成员。他注意到我，是因为我向社区分享了许多关于红队、安全研究和渗透测试各种主题的博客文章、推文和研究项目。我特别因对\
  \ `Living Off The Land Binaries and Scripts (LOLBAS)` 和 `Ultimate AppLocker Bypasslist`\
  \ 的贡献获得了社区的广泛认可。\n\n\n\n我认为这个问题并不容易回答。最实用的方法是寻找职位空缺并进行申请。在申请时，重要的是你的简历要反映出适合红队（red\
  \ team）的技能，而且这些技能必须是真实的。如果你能提供你所参与的项目链接，那对于获得关注来说是非常高明的。同样重要的一点是，并不是每个渗透测试员都必须努力成为红队成员。在执行红队任务时，你依赖于不被发现，因此这是一种具策略性的方法，你需要以较慢的速度工作，而不是“一次性抛出所有工具”。通常，这被比作忍者与海盗的对比：行踪的忍者是红队成员，而吵闹的海盗是渗透测试员。它还需要你能够修改现有工具以确保它们不被检测；因此，我认为需要一些编码技能。如果你是一个没有耐心、更喜欢事情进展得快的人，那么红队工作可能并不适合你。\n\
  \n然而，如果你觉得这非常适合你，并且想获得一份红队队员的工作，我认为最好的方法是确保你分享有趣的信息，并成为信息安全（InfoSec）社区的一份力量。你可以做到这一点的方法包括提供相关内容、进行演讲、编写代码、帮助他人，以及简单分享你对信息安全的热情。（此外，要友善。没人想雇佣一个混蛋。）做这些事情通常会让你与其他建立人脉并成为朋友。如果有人问你的新朋友他们是否认识应该雇佣的人，他们很可能会指向你。老实说，我宁愿雇佣一个我认识的人推荐的人，而不是一个面试表现平平的人。信任在这个行业是一件至关重要的事情。\n\
  \n### 如何在不触犯法律的情况下获得红队技能？\n\n我认为最好的方法是建立你自己的环境，在其中你使用免费产品（`ELK stack`、`Windows event\
  \ forwarding`、`Splunk free` 等）建立良好的检测机制，并尝试潜入攻击而不触发检测。市上有许多有趣的项目可以帮助你构建一个良好的检测实验室——这样你就能学到防御者正在做什么来检测你，并让你变得更擅长规避检测。此外，尝试自定义现有工具和技术以避免检测；这也是获取更多技能的好方法。还有几个红队实验室是可以购买访问权限的从而获得实践经验，你也可以下载可以尝试攻击的漏洞虚拟机。如果你目前正在进行渗透测试，在客户允许的情况下，你完全可以从尝试在不被发现的情况下获取访问开始测试以练习红队。学习更多红队的另一个良好来源是阅读关于高级持续性威胁（APT）小组的报告，并研究它们的\
  \ `TTP`，以便从中学习并尝试将其演变为某种新东西。\n\n## 为什么我们无法对什么是红队达成共识？\n\n我认为问题的一部分在于，对于红队应该是什么存在许多不同的意见。很多公司将此作为他们能提供的最好的渗透测试，并且并不理解对抗模拟（adversarial\
  \ simulation）的含义；另一些人则认为它是高级渗透测试。我甚至接触过一些客户，他们认为红队是你在发生泄露时雇用来寻求帮助的东西。理想情况下，这本书将帮助大家更好地理解什么是红队。\n\
  \n### 应该在组织的安全计划中引入正式的红队？\n\n在我看来，当组织能够响应安全警报，并且实际上建立了良好的检测机制可以接受红队的测试时，该组织就是足够成熟的。\n\
  \n此外，组织还需要针对红队发现的检测漏洞甚至红队导致的常规失败领域进行改进。如果客户无法根据红队的结果采取行动，那么他们还不够成熟。\n\n### 你如何向不配合或非技术的客户或组织解释红队的价值？\n\
  \n当我们投资备份解决方案时，我们会确保在之后验证备份以确保方案有效。我们想要确保它有效。如果发现由于我们没有进行适当的安全测试导致攻击者可以轻易黑入我们的组织，那将不好趣。\n\
  \n### 最重要或最容易实施的能够防止你攻破系统或网络的控制措施是什么？\n\n我觉得你已经拥有许可的“免费”安全控制措施（假设你拥有微软环境）可以用来真正让别人很难攻破你。如果我在一家小公司工作且资金很少，我会将关注于使用\
  \ `Microsoft AppLocker` 进行应用程序白名单，移除管理员权限，启用 `BitLocker` 磁盘加密，配置 `Windows` 客户端防火墙以防止客户端之间的通信，建立\
  \ `Microsoft Deployment Solution` 以轻松重新部署受感染的机器，使用 `Group Policies` 部署 `Microsoft\
  \ Security` 基准，并投入大量时间培训员工，使他们意识到攻击者的意图并提高意识。\n\n### 你是否曾经建议过不要进行某次任务？\n\n多次。例如，一个客户问我关于关于请红队的事，但客户并不完全理解这意味着什么。客户假设他正在获得最好的测试。我问他是否有蓝队（blue\
  \ team）或任何良好的监控。客户回答说他们两个都没有。之后我解释了成熟度有不同的级别，并建议从外部和内部的漏洞扫描开始，从此推进。\n\n我经常看到一种“设置好就置之不管”的心态。这是与客户典型的典型对话：\n\
  \n*   我：“你们有什么种安全产品？”\n*   客户：“我们有产品 `X`、`Z` 和 `Y`。”\n*   我：“你们监控它们吗？或者对警报做出响应？”\n\
  *   客户：“没有，我们没时间做那个。”\n\n### 为什么你觉得遵守交接规则（rules of engagement）至关重要？\n\n这关乎信任。客户信任你遵守交接规则，你的雇主也是如此。制定交接规则通常几个原因；之一可能是客户希望关注他们想要改进的某些领域。此外，不遵守交接规则在某些情况下意味着你正在做违法的事，而我们永远不应该做违法的事。\n\
  \n\n\n\n在我第一次参加红队任务时被抓住了。当时我没有很多红队行动的经验，我们完成了开源情报（OSINT），认为一个很好的开始方式是对 OWA（Outlook\
  \ Web Access）进行密码喷洒（password spray）。我刚开始密码喷洒就立即被客户发现了。客户发来的一封邮件，其用词方式触动了我（从好的意义上来说）。我感到很沮丧，因为这是我的第一次红队任务，我竟然因为这么简单的事情被发现。我从被发现中学习到了很多，并在进行密码喷洒时完全改变了策略。我开始利用如\
  \ `proxy canon` 等工具在每次尝试时使用新的随机公共 IP，并更改了用户名列表，使其不再按字母排序。在下一次进行密码喷洒的任务中，我完全没有被发现。我认为处理失败最好的方法是从中学习并进化。\n\
  \n## 红队是如何协作完成工作的？\n\n要成为一个成功的红队，你需要具备不同的技能。我们不能在所有方面都是专家。能够利用彼此的技能来造于任务至关重要。在红队行动期间，我们会共享笔记，并为特定任务建立专的聊天室，在里面我们可以共享信息，以便每个人都能看到发生了什么，同时也方便向团队成员寻求建议。文档工作贯穿于从开始到结束的整个过程。通常在我们的任务期间，我们会定期与联系人举行简短的状态会议，并在之后与蓝队进行报告演练。在这些会议和演练中，所有的红队成员通常都会出席。我们确保蓝队理解了我们发现的漏洞，以便他们能够更好地增强其检测和响应能力。\n\
  \n## 如果你转到蓝队，你防御攻击的第一步是什么？\n\n我肯定有很多可以做的事情，但最有效且最简单的方法是禁用宏以及相关的脚本文件（`HTA`、`WSF`、`VBS`、`JS`），让它们在记事本中打开而不是执行代码。尽管这实施起来很容易，但可能有很多原因导致它没有被实施，例如组织依赖宏处理日常业务，或者他们需要运行脚本文件。很多时候，当我与声称需要宏或需要运行脚本文件的客户交道时，只有\
  \ 10% 的客户真正需要这种能力。这意味着你可以为 90% 的客户禁用它们，这让攻击者进入变得困难得多，而且不会影响客户。例外情况永远不应成为你应该开启的安全级别的决定因素。\n\
  \n此外，我还会确保实施以下内容：\n\n* 在所有客户端上实施应用白名单\n* 移除所有终端用户的管理员权限\n* 部署端点检测与响应（EDR）客户端\n*\
  \ 部署加固基线\n* 安装客户端防火墙\n* 简化操作系统补丁更新和操作系统升级\n* 集中收集客户端事件日志\n\n当然，我还会对所有员工进行大量的意识培训，使整个组织变得成熟。\n\
  \n## 关于编写良好的报告，有什么实用的建议？\n\n报告是你测试中完成的全部工作的产物，你应该为创建它感到非常自豪。这是客户通过测试获得的结果。当我写报告时，我总是尝试把自己想象成阅读报告的客户。这样，我应该能够理解我们做了什么，并据此进行改进。如果情况不是这样，我就需要重写。正确的截图也很重要，你永远不要假设每个人都确切知道你知道的。记住，你是专家，你正在（或应该）试图向非专家人士解释它。\n\
  \n## 除了指出不足之处，你如何建议进行安全改进？\n\n始终提供蓝队可以执行的具体措施来改进发现的漏洞处的安全性是非常重要的。例如，如果你在红队期间发现可以使用用户名和密码登录\
  \ VPN 解决方案，你必须确保建议多因素身份验证。如果你还通过 VPN 完成了大部分内部渗透且未被检测到，那么你需要建议对日志记录进行改进，并说明他们应该寻找什么种的活动。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术性技能或态度？\n\n我不负责招聘，但如果我要推荐某人来我们这里工作，那个人必须对安全充满热情。此外，他们需要是一个想要让安全行业变得更好的人，而不仅仅是做一份工作。其他对红队人员有益的技能包括社交和与人交流的能力、幽默感、快速学习新事的能力、耐心、好奇心以及谦虚。■\n\
  \n# 29\n\nChris Nickerson\n\n> “精通任何手艺的前提是尽可能从尽可能多的视角来理解它。”\n\n![](img/NickersonChris.jpg)\n\
  \n**Twitter:** @indi303\n\nChris Nickerson 是 Lares 的 CEO，在过去的 20 年职业中一直在领导、激励并有时扰扰安全行业。与\
  \ Lares 联合创始人 Eric M. Smith 一起，他创建了 Lares 使用的独特方法论，用于真实且有效地评估、实施和管理信息安全。通过与其他信息安全研究人员合作，他创立了渗透测试执行标准（`PTES`），并正与红队联盟培训集体合作，为红队测试创建一个认证。Chris\
  \ 是安全 `BSides` 大会的创始人之一，他曾在 50 多场信息安全会议上（包括 `DEF CON`、`CyberWeek` 和 `BlackHat`）担任主旨演讲者、演讲和培训师。他是\
  \ `ISACA` 的成员并持有其证书，担任 `CREST` 董事，并持有 CISSP、CISA、BS7799 和 NSA IAM 认证。他的著作 *Red Team\
  \ Testing* 将由 Elsevier/Syngress 出版。尽管如此，他最广为人知的可能是他在 TruTV 电视节目《Tiger Team》中的亮相，以及他的\
  \ TED 演讲《黑客完全出于好奇，而安全只是一种感觉》。\n\n### 你是如何开始红队工作的？\n\n在 Sprint 的早期，我们组建了一个工作组来展示所识别漏洞的实际影响。随着时间的推移，范围扩大，并开始包括来自物理、社交和电子领域的攻击。尽管这个团队被称为“虎队（tiger\
  \ team）”，但它实际上是我第一次接触跨多个执行表面的跨学科攻击。\n\n## 获得红队工作的最佳方法是什么？\n\n努力获得。拥有红队的主要原因是在整个攻击攻击面上模拟广泛的对抗战术。操作人员需要在问题解决和快速思考方面具有广泛的背景。单一学科的知识可以是战术性的，但在被要求模拟许多不同对抗模型时是不够的。操作人员不仅要能够模仿战术，还要模仿思维模式。考虑到这一点，获得红队工作的最佳方法是练习红队以外的所有技能。\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n\n\n\n在受控环境中进行练习。这可以有许多形式，从自己挑选挂锁到创建渗透测试实验室。精通任何手艺的前提是尽可能从许多视角来理解它。会议上和独立培训都有大量的课程。我的建议是参加一系列涵盖渗透测试、社会工程和物理安全的实实课程。噢，还有别忘记精通你受众的语言。我们可以成为世界上最顶尖的红队成员，如果我们不能有效且恰当地沟通我们的行动，将无法获得一分功劳。\n\
  \n> “在受控环境中进行练习。这可以有许多形式，从自己挑选挂锁到创建渗透测试实验室。”\n\n### 为什么我们对什么是红队无法达成共识？\n\n这在军事领域是一个相当标准的术语。自从\
  \ 19 世纪德国发明 `kriegspiel`（兵棋演习）以来，它有好几个名称，但核心含义一直没有。陆军在 `TR71-20 TRADOC` 中描述得很好：\n\
  \n> “由经过训练、受过教育并实践的团队成员执行的结构化、迭代过程，为指挥官提供一种独立能力，能够在作战环境背景下，从我们的合作伙伴和敌人的视角，持续挑战计划、行动、概念、组织和能力。”\n\
  \n所以，从那个角度来看，世界对它有一个很完美的定义。为什么“我们”无法达成共识？嗯，我们必须问问“我们”是谁。如果你指的是“网络安全领域的人”，我会迅速指向销售和营销部门。当这些术语开始流行时，人才池还很小，他们想从中获利。就像\
  \ `penetration testing` 一样，这个术语被稀释和操纵，意味着“我有能卖给你的任何工程人才”。布鲁斯·施尼尔 ([`www.schneier.com/essays/archives/2007/04/how_security_compani.html``](https://www.schneier.com/essays/archives/2007/04/how_security_compani.html))\
  \ 在将信息安全市场与美国经济学家乔治·阿克洛夫的论文《柠檬市场》对比时，优雅地捕捉到了这一点，这篇论文研究的是卖家对产品的了解远多买家的市场。这与我们在 `red\
  \ team` 定义中面临的问题相似。客户不知道预期什么，而销售团队编造了一份花哨的销售手册，上面充满了他们想要的词汇和让他们“感觉”自己做得很对的术语。\n\n\
  ## 信息安全其他部分对加入红队哪一点是不理解的？你听过的关于红队、蓝队或紫队的最具毒性的谎言是什么？\n\n红队成员（或进攻方）认为自己比任何其他团队都好。听着，我完全支持对自己充满信心，甚至对你的团队更有信心。但是，没有任何地方不需要某种伪等级制度。这个团队的成员应该是*最*相似的。他们应该都是投入、充满激情且以使命为驱动的。他们应该利用自己的才华推动进步。无论多困难或耗时多久，他们都应该是变革的工具。这不属于那些不想改变现状的人领域。我们都是同一个蜡笔盒里的一员，当协同作战时，可以创造出比个人贡献大得多的东西。\n\
  \n> “这不属于那些不想改变现状的人领域。”\n\n## 你应该何时向组织的安全计划中引入正式的红队？\n\n贝尔·布莱特教练（Coach Bear Bryant）说：“进攻赢得比赛，防守赢得冠军。”这里的关键教训是，你*需要*有防守才能赢。拥有一个活跃的国家级红队需要一个活跃的国家级蓝队。并不是说不能从与红方的“对练”中获得某些价值，但要充分发挥组织通过红队挑战来进步和改进的潜力，他们必须拥有一个致力于这种持续改进的团队。这可能是一个“狩猎小组（hunt\
  \ team）”，也可能是一个负责主动改进环境的专门防御小组。无论哪种，对挑战现状的承诺意味着能够付诸行动。准备好接受红队的团队是那些准备好投入工作来承担发现、衡量结果并推动组织前进的团队。\n\
  \n## 你如何向不情愿或非技术的客户或组织解释红队的价值？\n\n对练的类比是我通常发现大多数人最能理解的。无论是迈克·泰森式的“每个人在脸上被打一记耳光之前都有计划”，还是加入格斗俱乐部看看在战斗中真实感受是什么样的想法，甚至是更深层的东西。红队的核心精神是挑战现状——不是通过某种理论或数学模型，而是通过经验来学习和演变。这让我想起那些写着“人类愚蠢没有补丁”的愚蠢\
  \ T 恤。它们完全错了！我们得到的补丁被称为 `experience`，我们获得的经验越多，我们准备得越充分。这适用于对练伙伴的类比。如果你是一个初学者，你总是需要向高于你水平的对手出拳——不要太远，因为你需要建立信心。面对现实吧，如果你第一天就和“铁拳”迈克进入拳击，你可能会永远挂起拳套。随着你的进步，你需要从在同级水平上对练移动到它上方一个水平。每当你转动旋钮让对练伙伴成为更大的挑战时，你都会建立信心、经验和技能。最终，当你达到专业水平时，不再是与比你强的人斗斗，而是与风格不同的人斗斗。你可能是进入擂台最猛的人，但你在挑战者或对手身上经历的变量是让你措手不及的。在游戏的这个阶段，你需要一个可以“像你的对手一样行动”的对练伙伴。它将为你不可避免的战斗做好准备，并让你对技能产生信任。它还会指出你计划中可能从未被测试过的机会。并不是每个人都准备好参加冠军之战，但那些每一呼吸都在为此准备的人是。\n\
  \n## 你看到的实施的安全控制措施中，性价比*最低*的是哪一个？\n\n回答反向的问题，培训。对人的投资总是优于工具。通过购买来获得安全是一个常见的误区。从常见的统计数据中可以看出，这个想法并不灵验。世界上没有任何东西能击败一个投入且受过教育的团队成员。大多数人没有考虑到，安全工具和其他其他东西一样不断产生漏洞。所以，归根结底，每当你购买新工具，攻击面就会*增加*，而不是减少。有更多的攻击目标、更多的漏洞、更多的一切。现在，如果你有一个受过高度训练的团队，你能够意识到这一点并围绕由此产生的盲点进行设计。如果没有这种培训和对团队的投资，你就会增加了可能性，即你为了保护自己而买的东西正是导致你失利的东西。\n\
  \n**你是否曾经建议不要进行红队行动？**\n\n\n\n\n\n大多数人并没有准备好接受红队对抗（red team engagement）。这是对环境在多种不同模式下自我防御真实有效性的极深度审视。通常，请求此类演练的公司并没有足够的技术或人员配置来对发现的问题取得任何进展。回到格斗的类比，他们就像是业余爱好者，试图与正处于巅峰期的泰森进行格斗。这对于整个计划来说是适得其反的，我们经常会引导公司进行他们更有准备的测试类型。这可能是渗透测试，甚至是更广泛的防御性措施分析，以确定他们实际有能力处理什么。但这种情况通常没有什么好结果，他们会转而选择另一个愿意向他们出售他们要求的“术语”的供应商。我仍然坚认为，为客户做出正确的决定，即使他们在当时并没有意识到这一点。这也是我们应该坚持的。现在问，我们是否曾经为一个完全准备不足的人做过红队任务？当然过！结果如何？就像我们告诉他们的那样：一系列你们在人员或工程上无法应对的攻击。令人惊讶的是，大约\
  \ 10% 的人从这种震惊和震撼中恢复过来，并实际上发生了巨大的变化。而其他人则再也没有回过电话。\n\n### 能够防止你入侵系统或网络的最重要或最易实现的控制措施是什么？\n\
  \n万物双重身份验证。密码是现代访问的阿喀琉斯之踵。这是我看到的访问和横移动最常见的方式。市上有许多 2FA 解决方案，从免费到低成本不等，它们在安全性上比单密码方案提供了巨大的跨越飞跃。\n\
  \n### 为什么你觉得遵循“参与规则”（rules of engagement）至关重要？\n\n参与规则不仅仅是一份合同，它们是你的承诺。为了让陌生人看到你业务中最深处的秘密，所需的信任纽带需要比纸面文字更深的情感连接。它需要荣誉、目标、意图以及整体的信任。这种信任的基础记录在参与规则中。它是你任务的清单，也是你对组织进步的承诺。\n\
  \n### 如果你在渗透测试或其他任务中被抓包了，你是如何处理的？\n\n噢，老兄，我经历过一些奇怪的经历。有一次，我在一家大型医疗机构工作。当时是凌晨 2 点，我们通过与保洁人员聊天进入了\
  \ IT 大楼。随着时间的推移，保洁人员离开了，而我们留在了网络上。在收集了客户要求的访问痕迹后，我们开始了探索。我们正在寻找一些原始患者信息的最终标记、数据、持久的物理访问以及额外的绕过方法。我发现自己自己在地下室，看着几个看起来完全就像钥匙盒的盒子，我发誓的。总之，我撬开了那个盒子，警报声大响了起来。我立刻就知道这就是报警中央装置，防拆开关被触发了。我听到楼上的队友发了一声轻微的叫声：“你在开玩笑吗？Nickerson，你在下面干什么呢？”我冲上楼梯，脸涨得通红，非常尴尬。我们两个聚在报警键盘旁，看看是否能找到一种关掉它的方法。我们检查了面板附近的一切，但一无所获。作为最后的挣扎，我们撬开了外壳，在外壳内部写着数字\
  \ `4757`。巧合的是，这也是我们所在的这栋建筑的编号。我们输入代码，嘈杂的警报声立即停止了。“呼！我们没事了，”我笑着说。我面对的是一个“我不以为然冒”的眼神，我们开始收拾东西。\n\
  \n三分钟后，通往设施的路口布满了蓝红相间的灯光。“好了，我们来了，”我说，同时开始不情愿地展开我的任务书。我们立即走到外面等警察出现。像任何一个自尊心受伤的红队队员一样，我在想，也许如果我先过去，他们会认为我是应该在这里的。所以，当他们进入停车场时，我招手让他们来到我们建筑这边。“警官！非常抱歉。我在这里忙了一整晚处理服务器宕机的问题，保洁阿姨把我锁在里面了。我刚出来抽根烟，那该死的警报就开始响了。我试着关掉，但电话已经打去了。”他轻笑了一下，拿起手电筒对着我的脸照。在几分钟的提问后，他竟然相信了这个故事。我帮他搜查了该区域，寻找任何可疑之处，由于我担心要支付应急响应的罚，他向我保证“这种情况经常发生”。他们最终离开了，我们收拾好行李，心安理得地设置了建筑报警——如果那天晚上还有人闯入，他们肯定会坐牢的。\n\
  \n### 在执行指定目标时你经历过的最大伦理困境是什么？\n\n红队工作是一种非常奇怪的双重性。一方面，你被付钱进行测试以发现潜在弱点并衡量计划的成功；另一方面，你正在做所有你妈妈告诉过永远不要做的事，而且你还是为了钱做的！这真的是非常微妙的境地。此外，其中有一种明显的紧张感。你正在闯入一栋建筑。你正在做这种极具犯罪色彩的事情，无论如何合理化它，你都会感到内心不安。但与罪犯不同，这种紧张感并不止于此。你看，当罪犯被捕时，他们知道那是他们参加的这场游戏的潜在结果。而当你，一个红队队员，被发现时，这种紧张感从“隐藏”变成了“暴露”。\n\
  \n## 红队是如何协作完成任务的？\n\n团队协作就是一切。没有人能独立完成。即使是单人任务，我的整个团队都会在每一个步骤支持操作员。你需要有人打打气吗？我们在。需要凌晨\
  \ 4 点有人盯着监控吗？我们会待命。需要有人在你耳边指导你应该进入哪间办公室来尝试获取保险箱代码的一部分吗？会在那里，翻阅信箱和共享文件夹，帮你从几千间办公室缩小到可能含有代码的那几间。这并不会在行动结束后停止。之后，同样的规则适用于我们的蓝队同事。你需要什么吗？我们在。我们是你们团队的延伸——确保当你处理下一个大问题时，知道我们是你的后盾。发现、修复、脑风暴会议，或者只是深夜倾诉压力的电话。我们对计划成长的投入和他们一样多。我们共同实现目标。\n\
  \n\n\n\n\n我们尽可能尽早开始整个流程。如果允许，我们会让蓝队成员与我们“同同作业”，以获得双方的经验。我记得信息安全（InfoSec）行业中一些非常著名的面孔曾作为蓝队成员与我们一起执行任务。其中一些人以此为灵感创建了革命性的防御计划，另一些人则将其作为跳板，将进攻行业推向了我们远无法想象的高度。在每一次行动中，唯一相同点是：我们参与得越多，学到的就越多。\n\
  \n### 如果你要转到蓝队，你更好地防御攻击的第一步是什么？\n\n基础防御资产盘点。大多数公司都被合规性“霸凌”，购买了他们甚至都不使用的工具和技术。几十年来，`Gartner`\
  \ 一直在他们耳边喋，告诉他们买什么，但没告诉他们为什么。态势感知和主场优势是防御团队最大的资产。世界上顶尖的团队利用这两点移山填海，并有效地响应攻击。\n\n\
  ### 关于编写良好的报告，有什么实用的建议？\n\n协作。与你的同事、你的客户以及你的团队合作。尝试几种不同的报告风格，看看哪种能引起客户的共鸣。并不是所有人都以相同的方式学习和交流。你的报告越具有灵活性，客户就越可能理解攻击路径的意图以及修复方案。如果我们的目标是增长，让我们从每一个可能的方向去推力。\n\
  \n### 你如何确保计划结果对于需要完整叙述和背景的人来说具有价值？\n\n这在参与前阶段至关重要。双方都需要路线图。双方都需要对活动涵盖的内容和交付方式设定明确的预期。不要只花时间销售；要花时间倾听。花时间了解业务以及参与测试的每个团队成员。了解他们的差异以及他们需要什么样的沟通来展开工作。定义成功的路径和成功的图景。暂时抛弃工作术语，像人类一样交流——像那些即将共同开启一段深层情感且独特旅程的人——并确保每个人都感到舒适。这种舒适感和信任将是活动的基础，并最终成为决定你成败的关键。\n\
  \n### 除了指出不足之处，你如何建议进行安全改进？\n\n指标。这不再是一个非黑即白的游戏。在渗透测试活动中，有一种分发信息的方法可以避免产生恐惧、不性和怀疑（FUD）。我们必须首先意识到，安全学科是一项能力。它是可以在标准能力成熟度模型集成（`CMMI`）量表上衡量的东西。作为测试者，我们很少知道理论影响之外对组织造成的实际影响。“天呐，我获得域管理员权限了！你们完蛋了。”也许吧，但那是事实吗？并不总是如此。然而，这确实会引发恐惧。恐惧是我们最不希望的结果。记住铁木马场景。我们不能摧毁团队的意志和信心；我们的工作是展示改进的机会并追踪其进展。尽管如此，我们需要使用指标随时间推移丰富数据。我们不能只说“红队获胜”。我们需要衡量计划在保护和检测我们模拟的威胁方面的不同成功程度。然后，我们需要共同通过每一个战术来改进我们的能力成熟度。你认为什么是不足？你从每个安全工具看到的图表都告诉你它阻止了“X\
  \ 数量的威胁或攻击”。你知道它没告诉你什么吗？“在多少之中”。它漏掉了多少？它的表现到底如何？红队的存在是为了为防御队补全剩余的指标。红队存在不是为了替他们做决定，甚至建议他们需要什么产品来阻止攻击。红队存在是为了提供元数据，赋能蓝队做出尽可能可能的决策。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n驱动力。自豪。荣誉。尊重。技术技能可以教给任何人。上述特质是人内在的。乐意在幕后刻苦工作，我这是红队成员最有价值的特质。每个人都会被推到放弃的边缘，无论是红队还是蓝队。那些因为对事业投入而在逆境中坚持下去的人，具有推动事物发展的无私本性。一次呼吸，一次黑客。\n\
  \n### 优秀的红队成员与伟大红队成员之间的区别是什么？\n\n能够切换模式。优秀的红队成员知道如何发现弱点。而伟大的红队成员知道如何利用团队的集体力量来完成工作。\n\
  \n\n\n\n\n# 你如何向不愿配合或非技术性的客户或组织解释红队（Red Teaming）的价值？\n\n你拥有检测、防御和响应能力。你如何衡量这些能力的质量？你如何确保你获得的是与支付相符的服务？红队提供的保障是，在你的环境中，各种威胁将是可见且可控的。\n\
  \n## 你是否曾经建议过不要进行红队行动？\n\n作为一名顾问，我经常告诉客户他们还没有准备好进行红队行动。我有一几个与成熟度相关的筛选问题，以确保我没有在浪费大家的时间和金钱。由于这是我的专长，我通常会建议进行基础的内部渗透测试。这些测试通常会揭明防御极度匮乏之处，并为你提供一个机会去问：“如果这种情况发生在我们身上，我们该如何知道？”如果我觉得该组织需要额外的检测和响应能力，我会推荐那些提供构建蓝队团队实践咨询服务的公司。\n\
  \n## 能够防止你攻破系统或网络的最重要或最易实施的控制措施是什么？\n\n如果你的业务是制造小部件，你的专业知识主要在于制造小部件。引入信息安全专业知识不应完全落在你的组织身上。利用云服务，让安全控制由比你公司更强且资金更充足的机构管理，是保护中小企业（SMBs）最好的方法。\n\
  \n## 为什么你认为遵守作战规则（Rules of Engagement）至关重要？\n\n业务依赖于信任，而不仅仅是在安全领域。红队被给予的自由越大，维护这种信任就越需要。规则的设计是为了保护业务，如果它们不符合你的心意，要么是你没有为改变规则做足够的准备工作，要么你不理解雇佣你的原因。\n\
  \n> “业务依赖于信任，而不仅仅是在安全领域。”\n\n## 你遇到过最大的伦理困境是什么？\n\n业务依赖于信任，而不仅仅是在安全领域。红队被给予的自由越大，维护这种信任就越需要。规则的设计是为了保护业务……\n\
  \n在红队行动中，最大的*伦理困境*是平衡隐私。在职业生涯中，我最大的伦理挑战是安全资源的分配不均。许多公司无法负担必要的安全投入，从而暴露了风险。我致力于让安全技术民主化。\n\
  \n> 业务依赖于信任，而不仅仅是在安全领域。红队被给予的自由越大，维护这种信任就越需要。规则的设计是为了保护业务……\n\n## 如果你转到蓝队，第一步应该做什么？\n\
  \n业务依赖于信任，而不仅仅是在安全领域。红队被给予的自由越大，维护这种信任就越需要。规则的设计是为了保护业务……\n\n在蓝队工作中，第一步是了解你现有的防御架构和检测能力。你必须知道你正在看到什么，才能有效地改进它。\n\
  \n\n\n\n\n## 核心技能与专业知识\n\n*   在目标专业领域具备系统管理技能。你需要理解系统是如何配置、维护和加安全的，以便更好地理解那些对关键时间、信息访问和监控至关重要的领域。一旦通过对抗性思维展现了价值，这就会为你打开通往更多服务的大门——从每年多次的常规测试，到被邀请为新倡议提供建议。\n\
  \n### 在你看到的实施方案中，性价比最低（投入产出）的安全控制措施是什么？\n\n购买了工具或工具套件，但没有围绕其用户和价值开发相应的培训和指标。许多解决方案如果没有经过良好培训的人员，或者没有一套带有指标的合理目标（以及希望实现的结果），它们只是机架上闪烁的黑箱，为那些签字买单的人提供了一种心理安慰剂效应。\n\
  \n### 你是否曾经建议不要进行红队演习（Red Team Engagement）？\n\n是的，很多时候。特别是当我发现该组织在技术或运营上尚未做好准备绪时。例如，在技术方面，资产清单、集中日志记录和补丁管理可能甚至尚未建立。在运营方面，如果安全团队没有参与整体决策过程，且政治环境处于安全团队与其他团队之间的竞争与冲突中，那么演习的任何价值都会被稀释或完全丢失。在许多情况下，在缺口分析后帮助建立适当的\
  \ IT 基础设施或帮助建立完善的漏洞管理计划具有更大的价值。\n\n## 防止你攻破系统或网络的最重要或最易实施的控制措施是什么？\n\n\n\n\n\n首先处理最常见的入侵途径。钓鱼和使用恶意文件仍然非常有效。大多数公司不会阻止或控制\
  \ `HTA`、`Windows Scripting Host` 或 Office 宏的执行。通过遵循厂商的最佳实践，你将会惊讶地发现有多少入侵途径被阻止了，这让小团队能够专注于异常行为的自动化检测。在环境中刻画什么是“正常”需要时间来开发，因为这需要通过系统地处理最常见的技术并部署监控来获取信息；随着时间的推移，这种回报是非常高的。\n\
  \n> “通过遵循厂商的最佳实践，你会惊讶地发现有多少入侵途径被阻止了，这让小团队能够专注于异常行为的自动化检测。”\n\n### 为什么你认为遵守交战规则（Rules\
  \ of Engagement）至关重要？\n\n你正在为客户（无论是内部还是外部客户）提供服务，而其核心基石之一就是信任。破坏 `ROE` 就是在破坏这种基石，从而阻碍所提供的任何建议的有效性。\n\
  \n# 如果你在渗透测试或其他任务中被发现，你是如何处理的？\n\n在其中一次任务中，我建立的 `implants/agents` 远程访问会开始中断，甚至看到指向备用基础设施和不同信标间隔的备份连接也了。在电话中，客户提到他们发现了它们并逐一个列了出来。我最初的内心反应是恐惧，但当我改变思维方式时，很快很快变成了兴奋。从“我暴露了，我输了”变成“天哪，他们配合得很好；他们太棒了！这太赞了！”我提醒自己，我的任务是帮助他们测试安全性，我的主要目标是帮助他们变得安全。被发现意味着他们从之前的任务中汲取了经验并付诸行动。这意味着我产生了影响，并祝贺了他们。然后我检查了每一个操作，并帮助他们修复了其他小漏洞，以帮助他们进行更快的检测。\n\
  \n## 红队是如何协作完成任务的？\n\n首先，你需要清楚地了解这是什么类型的事件以及要测试什么。每个人都应该了解会议细节并理解客户。计划是以团队形式进行的；每个成员的意见都会在初始计划中被考虑。根据团队的大小，根据成员的技能选出计划某些部分的负责人，一名负责人可能负责一个或多个领域。初始计划会经过讨论并达成共识；这包括将与客户对接的项目经理。随着任务的进行，会定期召开会议来讨论行动并规划其他计划，始终听取其他团队成员的意见。任务结束后，应该进行复盘（debrief），将自我留留在门外，人们诚实地面对需要改进的地方。根据需要讨论并处理改进领域和行动项。新的技术或工具会被记录下来并与团队其他成员共享，以提高团队的集体知识库。\n\
  \n### 在行动完成后，你进行复盘和支持蓝队的方法是什么？\n\n把你的自我留留在门外。我尽力确保他们知道我是来帮助他们让环境更安全的，而不是打算与他们对对关系。我会从表扬我发现的他们他们做得好的地方开始，告诉他们哪些控制措施在工具方面影响最大，并解释任务中行动的节奏。一旦我们展示了好的方面，就会转向如何改进他们的控制措施和流程。提问也能确保这是一项团队努力的结果，而不仅仅是单方面告诉他们应该做什么。\n\
  \n### 如果你转到蓝队，你防御攻击的第一步会是什么？\n\n查看对环境影响最大的攻击链，以识别它们之间的共同环节。一旦识别出这些环节，我将考虑如何更好地切断或监控这些环节，不仅从技术角度，还从整体运营角度。\n\
  \n## 关于编写优秀的报告，有什么实用的建议？\n\n我会说，我们必须调整看待编写报告的方式。它是我们最终的交付物——是衡量我们的标准。在很多方面，它是我们专业能力的体现。我们不应该将其视为一项痛苦的活动，而应将其视为一项真正能对客户产生价值影响的工作。当我们改变对报告的看法时，我相信这会改变我们编写报告时的感受。客户可以根据质量和用词判断出他们付钱得到的最终交付物投入了多少工作。如果不投入精力，我们仅仅是贬低了所做工作的价值以及我们的专业形象。\n\
  \n### 你如何确保你的项目结果对于需要完整叙述和背景的人来说是有价值的？\n\n团队中有拥有业务和软技能知识的人员，他们能够与客户团队成员合作设定叙述。如果不存在这种关系，那么清晰地定义并理解被雇佣的原因将帮助你如何定制报告中的建议和措辞。这意味着在任务开始前的售前阶段和\
  \ `SOW` 的定义阶段投入足够的精力，并在任务期间尽可能与利益相关方建立良好的关系。\n\n### 除了指出不足之处，你还如何建议安全改进？\n\n在可能的情况下，我在做出建议之前会尝试了解某事之所以是那样。遗憾的是，由于时间限制或某些原因无法从客户处获得细节，这并非总是可能的。当我知道多个领域的“为什么”时，提供比仅仅监控日志或更改设置更有影响的解决方案就更容易了。这就是建立那种受信任的顾问关系的重要性，这有助于更容易收集这些额外信息。尽管如此，我仍尽力理解建议可能对业务流程产生的影响。这使得团队的建议更容易被采纳。\n\
  \n## 在招聘和面试红队成员时，你会寻找哪些非技术技能或态度？\n\n具备可教性并且始终保持开放并不断学习新事物至关重要，即使这些新事物超出了个人的舒适区。一个关键技能是能够放下自我，并足够谦逊地说出：“我不知道，但我会学习。”\n\
  \n### 在以解决问题方面，优秀的红队成员与普通人的区别何在？\n\n知识的广度。这不仅仅是对某些技术的精通。红队必须能够与客户建立基于信任的关系，无论是通过咨询还是公司内部。战略目标始终是帮助客户识别并缓解所有风险。在战术层面，团队应该在技术和业务运营领域发展技能，以便团队能够成功实现其战略目标。\n\
  \n\n\n我的名字是 Francesc Rodriguez。我是一位居住在多伦多的 21 岁古巴裔加拿裔渗透测试员兼安全研究人员，喜欢喝各种酒并黑进一切东西。白天，你可以看到我在为政府工作工作；晚上，你可以看到我在进行二进制分析、端点安全、Web\
  \ 安全和网络安全的研究。我是 Temple of DOOM CTF 系列的创建者。这个 CTF 系列是为那些想要刻苦并迎接新挑战的初中级水平学习者设计的。\n\
  \n## 你是如何开始红队（Red Team）生涯的？\n\n初中学时迷上了视频游戏，成绩并不尽如人意，主要是因为我逃课回家在 `PlayStation 3`\
  \ 上玩游戏。我父亲经常收到学校的电话说我旷课，然后他会弄坏我的游戏光盘。我必须想办法让他认为我不再在 `PlayStation` 上玩游戏了，于是我学会了如何越狱我的\
  \ `PlayStation`并将所有游戏安装在内部。在那个时代，这非常简单。你只需要一个 `USB` 和 George Hotz 发布的用于越狱主机的自定义固件即可。\n\
  \n这激发了我用 `C++` 为游戏编写补丁和外挂的兴趣。在厌倦了游戏破解后，我开始阅读关于安全的书籍，因为这引起了我的兴趣并将它们联系在了一起。从第一本书开始，我的兴趣和欲望与日增长。我开始两周读完一本书，然后是一周读完。在高三那年，我发现自己几乎整天都在阅读。这大概是我开始认为需要更多挑战的时候。在与社区的一些同行交流后，他们向我推荐了信息安全。由于我已经精通几门编程语言并具备良好的脚本能力，我决定可以尝试一下。我安装了\
  \ `Kali Linux` 并开始学习一些工具。这对我来说感觉很像“脚本小子（script kiddie）”，但信息安全社区（InfoSec）的许多人向我保证事实就是如此。\n\
  \n不知不觉中，我已经在运行扫描并获取系统的 shell 权限。再次，我对于学习和进步的渴望促使我不断学习并变得更加低调。扫描在事件日志记录器上产生了太大噪音，我想学会如何保持沉默。这大约是我进入大学学习计算机网络专业，并真正开始在信息安全社区寻找伙伴的时候。我遇到了一个代号为\
  \ Dead Rabbit 的家伙。他很神秘，知识渊博，并且愿意分享，但他像个幽灵。他来来去去，但每当我需要他时，他就在那里。\n\n不知不觉中，我已经在 `Hack\
  \ The Box` 上排名第 71 位，这是一个全球黑客用来提高渗透测试技能的虚拟实验室。这大大丰富了我的简历和技能。从那里开始，我开始领域寻找工作。我的第一份工作是\
  \ `SOC 分析师`，并不奢华。我监控 `SIEM` 日志，向管理层报告发现的问题并在需要时升级问题。这够付生活费，但无法满足我学习更多和取得成就的渴望。几个月后我辞去了那份工作，并在政府担任了一份渗透测试/红队角色。\n\
  \n## 获取红队工作的最佳途径是什么？\n\n获得红队工作主要要求的是我所展示出的热情和决心；其他一切都是容易且会顺理章的。证书和经验是招聘经理在红队候选人中看重的因素，例如进攻安全认证专业人员（OSCP）或进攻安全认证专家（OSCE）证书，但情况并非总是如此。\n\
  \n> “证书和经验是招聘经理在红队候选人中看重的因素，例如进攻安全认证专业人员（OSCP）或进攻安全认证专家（OSCE）证书，但情况并非总是如此。”\n\n\
  果实形状各异，红队成员也来自不同的背景。曾几何时，计算机工程师以程序员为主，后来他们转向系统管理员，而现在涌入了大量的云运维人员。所有这些角色的职责相对相同，但每种都是一种不同的艺术。红队也是如此。进入该领域的最佳方式是拥有意志和欲望，投入努力获取知识并持续学习。如果你拥有胜任工作的技能，请忽略那些职位要求并直接申请职位。许多人看到职位要求就会感到沮馁，因为大多数职位要求在该领域有五年或更以上的经验，但我曾在简历上仅有在\
  \ `SOC` 工作过五个月的经验时，就申请了一个需要五年以上经验的高级渗透测试员职位，但我的技术技能帮助我跨越了那些要求。这归功于我的自信以及向面试委员会展示我知识的能力。\n\
  \n## 如何在不违反法律的情况下获得红队技能？\n\n在不违反法律的情况下获得红队技能的最好途径是通过信息安全社区构建的免费资源。`Hack The Box`\
  \ 是黑客为黑客提供的免费资源的典范。在我看来，这个平台是练习和提高技能的最佳方式。我的大部分技能都是通过他们的平台获得的，他们甚至有一个名为 `RastaLabs`\
  \ 的专设红队实验室，你可以在那里攻击一个非常真实的 `Active Directory` 环境，这需要诸如 `OSINT`、`钓鱼攻击`、本地权限提升、持久化技术、枚举与利用、横向移动技术以及漏洞开发等技能，还需要创造性思维、耐心和毅力。家庭实验室（Home\
  \ labs）也有很大帮助；人们在家里使用商业级硬件。这创建了一个虚拟世界的沙箱，可以在其中启动并以不同的配置各种操作系统发行版。还有一些存在漏洞的操作系统实例可以帮助人们学习。\n\
  \n### 为什么我们对什么是红队无法达成共识？\n\n我认为这是因为有很多动态在起作用；渗透测试是红队的一个分支，但红队在理论上的现实场景中参与更深。渗透测试人员可能只是在某处发送攻击并看看哪里坏了，而红队成员会尝试以多种方式攻入。他们还会尝试破坏整体安全性，包括防火墙、`IDS`、`IPS`、主机安全、物理安全等。渗透测试人员可能只关注发送\
  \ `XSS` 攻击，或尝试利用公开的漏洞获取访问权限，成功后继续。红队成员则会运行真实的攻击，就像俄罗斯或中国黑客试图入侵 `NSA` 的数据中心一样。这种活动没有限制，红队成员可以攻击一切。由于红队是渗透测试的一种更大形式，许多人对其归属产生分歧。\n\
  \n\n\n\n\n信息安全有许多不同的方面，例如网络安全、威胁管理、风险管理、合规性、渗透测试等等。我认为其他小组没有意识到的一是红队成员所付出的努力程度。我不想说我们红队成员是人中翘子，因为其他小组也在做出贡献，但我们对企业进行模拟真实攻击，并识别漏洞和差距。我听过最具有毒性的谎言就是认为某一个元素比另一个元素更重要；如果没有红队、紫队或蓝队，你的组织就是不完整的。他们都扮演着自己的角色，虽然重要性并不相等，但都要求各司其职。\n\
  \n## 你应该何时向组织的安全计划中引入正式的红队？\n\n坦诚且直接地说，从你的产品进入生产环境的那一刻起，你就应该考虑过红队对其进行一番了。如果你在没有红队的情况下发布一个应用程序或服务，你就是在自找麻烦。例如，如果你将产品投入生产，并获得了一个开始在你的系统上处理数据的客户，然后黑客入侵了该系统并获取了数据，那么由于安全计划方面的疏忽，那将是非常糟糕的时刻。安全需要从一开始就到位，而不是在最后才加上；虽然红队可能不需要在那里，但将需要其他的安全测试，但在上线之前，红队应该对整个平台进行一次尝试。\n\
  \n> “如果你在没有红队的情况下发布一个应用程序或服务，你就是在自找麻烦。”\n\n## 你如何向不情愿或非技术的客户或组织解释红队的价值？\n\n我认为这和任何安全领域的语言是一样的。增加红队元素并没有产生任何区别。从高层次、用他们理解的语言来与这些人交流，并确保他们理解为什么这很重要。例如，你可以向客户解释可以这样想——法拉利会产生正常的磨损，如果没有适当的保养，它就会损坏。这包括减震、悬挂、换机油等。红队可以是这些元素之一。它是必需的；只是语言需要达到该人员能够理解的水平。\n\
  \n## 你看到的已实施的安全控制中，性价比最低的是什么？\n\n我在企业中看到实施的最糟糕的安全控制是 `McAfee VirusScan+ AntiSpyware\
  \ Enterprise`。这是一种通用的安全解决方案，不包含终端监控。只有小部分的入侵会被终端杀毒软件捕获。游戏已经改变并变得更加复杂，现在需要第二道防线来完全防御未知的敌手。传统的终端保护已无法胜任这项任务。\n\
  \n## 能够防止你破坏系统或网络的最或最易实施的控制是什么？例如，我们如何帮助预算和人员较少的中小型企业？\n\n实现这一目标最简单的方法是外包。取决于范围，如果一个小型组织负担不起维护这些人员，他们应该将任务外包给第三方。\n\
  \n## 为什么你认为遵守约定规则（rules of engagement）至关重要？\n\n如果不遵守约定规则，将面临法律惩罚，这些都是非常昂贵的罚款。更如此，如果你不遵守合同中的约定规则，将毁掉你作为红队成员的声誉。如果这是内部红队，它会产生无效结果。如果在范围之外发现问题，不仅会浪费工时，还可能危及那些系统。\n\
  \n## 如果你在渗透测试或其他任务中被抓包了，你是如何处理的？\n\n多亏了 `@dollarvpnclub`，我从未被发现过。\n\n## 在执行指定目标时，你经历过最大的伦理困境是什么？\n\
  \n我反复发现过“精彩”的漏洞。我不想な漏洞的细节，但这些系统上的客户数据被认为是机密的。然而，出于我的道德和伦理，我会立即向管理层报告我的发现，并卸下身上的负担。\n\
  \n## 关于编写良好的报告，有什么实用的建议？\n\n报告应该以清晰、简洁的方式包含相关信息。这不是装扮并让它看起来很漂亮的时候。当它以流畅的方式传递信息，并让客户理解发现了什么以及所提出的建议时，它就是有效的。\n\
  \n## 你如何确保你的计划结果对需要完整叙述和背景的人有价值？\n\n截图和文本背景相结合可以缓解这个问题。客户或报告的预期接收者需要理解发生了，并能够获得全貌，而不是红队成员认为重要的部分。红队组织的标准操作流程在这里会有极大帮助。\n\
  \n## 除了指出哪里不足之外，你如何建议安全改进？\n\n多年来我了解到最好的方法是提供证明，详细说明问题是什么以及为什么会发生，而不是仅仅说它存在。例如，在进行任何利用之前，我就发现了后门和零日漏洞；这是通过思考潜在问题并贯穿完成的。我能够识别出许多企业使用的自密码重置功能中的漏洞，以避免通过帮助小组寻求支持。我向我的团队指出了这一点，起初他们他们不在乎，但第二天我带着一个无需对工作电脑进行身份验证的\
  \ `SYSTEM` shell 回来，他们开始认真对待这个问题。建议任何事情的方法都是展示问题并提出解决方案作为建议。此外，分析固有风险并实施控制将其降低为仅剩余风险。\n\
  \n## 在招募和面试红队成员时，你寻找哪些非技术技能或态度？\n\n他们需要良好的沟通能力，如果他们没有但技术能力非常出色，我们只需要增加一个能把想法写在纸上的人。招聘者应该自信，但不要有太大的自我或毒性迹象。那样的人会降低团队的整体生产力，这会适得其反。到为止最重要的非技术技能是写报告以及沟通问题和发现。\n\
  \n# 33 Derek Rook\n\n> “我经常开玩笑说，我拥有世界上仅有的工作之一，我的职责是让明天的工作比昨天更难，但我不会接受任何改变。”\n\n\
  ![](img/chapteropener.jpg)\n\n**Twitter:** @rook\n\nDerek 是一位行业老兵，拥有超过 15 年的经验，涵盖了系统管理与工程、Web\
  \ 开发、安全工程和攻击性安全。在办公室里，他投入时间构建和运行内部攻击性安全实践。在办公室之外，他在家庭、武术、SANS 教学以及建立自己的咨询业务 Corvid\
  \ Security 之间分配时间。作为 NetWars 锦标赛冠军和 NolaCon 黑徽持有者，经常可以看到他在参加各种的 CTF 比赛。Derek 拥有多项安全认证，包括\
  \ `GCIA`、`GNFA`、`GCIH`、`GWAPT`、`GXPN` 和 `OSCP`。\n\n**你是如何开始红队生涯的？**\n\n\n\n\n\n\
  我有点掉入其中了。我的意思是，自从我 15 岁时第一次看到电影《偷天高手》（*Sneakers*），并发现我可以合法地（在获得许可的情况下）做犯罪并获得报酬后，攻性安全一直是我的职业目标。在那之后，我尝试了能找到的所有技术工作。从\
  \ Allaire Cold Fusion 鼎盛时期的 Web 开发，到帮助台、Linux 管理员，再到系统工程，最后进入了安全岗位。我从事安全工程已经有一段时间，并把攻性安全作为爱好。当时我相当于在做三份工作：我的本职、我的\
  \ YouTube 频道，以及尽可能地进行研究和实验室搭建，以自学转型所需的各种技能。\n\n我想我在社区的工作引起了别人的注意，因为我接到了一个职业人脉中某人的电话。他们正在组建一个新的产品安全团队，询问我是否想建立内部的攻性安全实践。我不仅转为了全职攻性安全，还建立了自己的团队并定义了自己的计划。\n\
  \n## 获得红队工作的最佳方式是什么？\n\n职业人脉。关注最新趋势、对比新技术，甚至只是提前获知新职空缺，都能提供巨大的帮助。攻性安全和红队仍然相对稀缺，因此职位竞争非常激烈。\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n秘诀在于，大多数红队技能其实就是系统管理和开发技能。利用虚拟化和免费/廉价的云账户来练习搭建基础设施。学习事物是如何结合在一起的、为什么需要不同的服务、它们的用途等。这不仅能帮助你理解如何滥用错误配置并像普通用户一样在环境中移动，还会教你如何建立一个具有韧性的命令控制（C2）基础设施。蓝队和红队是意图不同的相同技能组，你可以在从未模拟恶意活动的情况下学到很多。\n\
  \n## 为什么我们无法对红队的定义达成共识？\n\n我想我们有时太执着于头衔了。公司每个人的工作都是参与为公司赚钱。我们在安全领域的工作是尽可能地降低业务决策的风险，同时尽力在首要任务（赚钱）与保护员工及客户之间取得平衡。如果我们能就这一点达成共识，我认为红蓝两队的工作都会变得更高效。\n\
  \n## 信息安全领域的其他人都最不理解红队工作的哪一点是什么？你听过的关于红队、蓝队或紫队最有毒的谎言是什么？\n\n我想很多人没有很好地内化这一点：我们的工作是帮助公司吸引和留住盈利客户——而不是把公司“黑得透透”或阻碍潜在风险的进展。我以前在几个地方听过这句话，我现在的\
  \ CISO 喜欢说：“我们给汽车装上刹车是为了让我们跑得更快。”\n\n## 你应该在什么时候向组织的安全计划中引入正式的红队？\n\n嗯，我是新产品安全组的第一号员工，所以我会说任何时候都可以。不过我也会说，这个决定确实面临着挑战。通常，团队不确定如何与我的团队合作，并开始尝试将我们的服务目录划分到源代码分析或资产发现等更传统的安全角色中。尽管如此，我敢打赌每个攻性安全或红队无论周围组织的成熟程度如何，在初期都会遇到类似的障碍。老实说，公司在早期就想要建立攻性团队的前瞻性是促使我加入现雇主的原因之一。\n\
  \n## 你如何向不情愿或非技术性的客户或组织解释红队的价值？\n\n一个组织会系统地投入资金确保公司和/或产品的安全。他们开发最佳实践和加固指南。他们实施漏洞发现和管理计划。这一切都是为了预测入侵者会如何攻击他们的公司，并试图通过主动防御来预先阻止这种攻击。他们做了所有的猜测，但却止于让具有对抗思维的专业人士模拟攻击的这一步。这些模拟是评估已建立防御计划的基准，并将漏洞发现置于背景中确定优先级的方法。\n\
  \n## 你看到的已实施的安全控制中，性价比最低的是哪一个？\n\n安全信息和事件管理（SIEM）。并不是 SIEM 没用，但我经常看到组织实施它们是为了“解决安全问题”，但完全没有考虑输入给它们的数据源。它们通常不是严重过载，就是严重不足。过多的警报和没有警报一样糟糕，因为人们倾向于忽略所有内容，有用数据会在噪音中丢失。一个经过刻意喂养和监控的\
  \ SIEM 可能极其有用；我只是希望它能更常见。\n\n## 你是否曾经建议不要进行红队演习？\n\n这一点我可以稍微“作弊”，因为我运行的是一个内部团队。我们会根据需要完成的工作不断调整建议。我们不需要那么担心计费时长以及红队的费率是否高于渗透测试。我们仍然执行正式的范围说明书（SOW）流程，但它变得更加灵活。有时我们在演习进行中发现有必要另一种类型的演习，幸运的是我们有灵活性这样做。\n\
  \n## 能够防止你攻破系统或网络的、最重要或最易实施的控制措施是什么？\n\n教育你的用户。我们需要消除“年度安全意识”的概念。我们还需要停止嘲低“愚蠢用户”这个概念。诚然，他们是我们最大的攻击面，但也是我们最大的防御边界。他们是世界上最大、最复杂的\
  \ IDS。当`我的电脑出现异常`时，没有任何 IDS 能够检测到。诚然，他们有时并不具体，但通过教育可以做到。每月八小时（总计，而非每个安全人员）就能开发出一个出色的持续教育计划，其效果比几十万美元的`blinkenbox`\
  \ 好。\n\n## 红队是如何协作完成工作的？\n\n\n\n\n这一切在真空中是不可能发生的。人们有一种观念，认为黑客都是大师，仅凭脑中的子弹就能让计算机基础设施听他们意布。这与事实大相径远。人在专注于特定领域时，整体效率更高。当你将专长互补但又不同的人结合在一起时，团队就会变得真正强大。我很幸运，我到目前为止所建立的团队是一个多元化的群体，拥有不同的视角、背景和技能。我们合作得非常出色，并不断向公司证明我们的价值。\n\
  \n然而，如果我们所做的只是攻击东西、功成身退、然后重复，那么这一切都是徒劳的。与蓝队、产品团队甚至（以及尤其是）非技术人员合作，以加强我们的防御并提高公司的韧性，对于履行我们的职责至关重要。这不仅仅关乎传统意义上的安全。复杂性往往引入许多安全问题。我们与开发团队合作，简化他们的解决方案。确实，这让他们的系统更安全，也提高了性能，并减少了该团队未来的开发开销。我们都是一个凝聚的团队，朝着同一个目标努力。\n\
  \n### 在行动完成后，你如何对蓝队进行总结汇报和支持？\n\n如果我们不是在进行秘密行动，通常会与行动、开发和安全人员保持持续沟通。我们提供每晚进度报告，并且经常在\
  \ `Slack` 上与他们讨论当前的发现和潜在的后续路径。\n\n在秘密行动中，我们通常会尝试让一名非攻击性人员加入团队作为行动的一部分。在行动结束时，我们会揭露一切，并与参与的各个团队合作，帮助他们理解我们做了什么以及是如何做的，并尝试识别修复方案、流程更新以及任何有助于防止我们再次实施此类操作的措施。\n\
  \n我的目标是永远不再做同样的事情。我从事进攻安全是因为我热爱学习新事物，并深入加深对旧事物的理解。我经常开玩笑说，我拥有世界上仅有的职业之一，我的职责就是让明天的工作比昨天更难，但我并不接受任何其他选择。\n\
  \n### 如果你转到蓝队，更好地防御攻击的第一步是什么？\n\n这对我来说可能太依赖环境了，无法给出具体回答。我会说，我认为每个人偶尔跨界尝试一下是很好的事情。我在非攻击性技术领域度过的\
  \ 15 年让我对公司如何运作以及防御者如何防御有了极佳的洞察。我每天都在工作中应用这种直觉上的理解。当我最终回到蓝队或进入更具混合性质的角色时，我将把作为攻击者学到的教训应用到防御中。我认为公司里做得不够的一点是没有培训人员像攻击者一样思考。他们不需要被训练成完全的黑客，但让人们稍微跳出舒适壳，理解软件和系统如何被滥用将使他们成为更高效的开发者、操作人员和支持人员。\n\
  \n## 关于编写优秀的报告，有什么实用的建议？\n\n像对待工作一样去写报告。这里有一个秘密……这本身就是你的工作。如果你不能清晰地表达你做了什么、影响是什么，并就如何有效缓解或响应你的报告提供良好的、具有可操作性的建议，那么世界上所有的\
  \ 1337 h4x0ring（黑客技术）对任何人来说都是没用的。\n\n在测试的同时编写报告非常重要。在移动过程中记录详尽且全面的笔记，不仅能提高你内化所发现信息的能力，还能让报告的写作变得流畅得多。大多数正在研究下一次攻击或载荷的人，已经在阅读他们需要绕过的防御，或者防御中的何种失误让他们最初攻破了系统，所以请记录这些内容，并在过程中对其进行更多学习。这会让你的攻击更有效，并协助做出出色的修复建议。大多数黑客都热爱学习。写报告只是学习攻击和防御的另一个机会。\n\
  \n### 你如何确保你的项目结果对那些需要完整叙述和背景的人有价值？\n\n我们的报告有几个不同的部分，从不同的视角来阐述我们的发现。我们有一个“攻击场景”部分，其中包含了我们的攻击地图以及对我们在环境中采取的不同路径的描述。这些路径链接回特定的发现，但总的来说，它提供了行动更广泛的视角，以及为什么特定发现之所以重要的背景。我们有一个详细的发现部分，其中列出了安全缺陷及其修复建议。这不仅是漏洞，还包括流程和策略缺陷等。最后，或者首先，我们在执行摘要中还有额外的章节，讨论了行动期间表现良好的之处以及需要改进的领域。这为我们提供了一个展示参与行动的所有非攻击团队做得好的地方。它避免了报告变成全篇的负面信息，并构建了一个更完整的信息。\n\
  \n### 除了指出不足之处，你还如何建议安全改进？\n\n要让人们投入并参与到自己的安全中——不仅是工作安全，还有个人和家庭安全。几年前我在两家公司做过内部演讲，其中包括一个\
  \ 15 分钟的黑客演示。那是一个“从钓鱼到监控你的摄像头并偷取你的税务文件”的华丽魔术秀演示。首席顾问问是否可以和我聊 15 分钟关于他们的个人生活安全。15\
  \ 分钟变成了一个半小时，我认为我在那家公司度过的最高效的一个半小时。他们成了那里的安全倡者，随着更多人认同这种观点，很多事情发生了变化。\n\n### 在招募红队成员时，你寻找哪些非技术技能或态度？\n\
  \n毫无疑问是好奇心。如果有人有动力理解某事的“是什么”、“如何”和“为什么”，他们可以被教会硬性的技术语法。在过去的两天里，我花了八个小时阅读帮助文档，以理解某些奥秘工具的操作方式，结果获得了一个其他情况下无法发现的跳转机会。除非你对答案在智力上投入了，否则很难维持那种专注。我认为“激情”这个词在我们的行业里有点陈词滥调，它经常被用作给员工提供糟糕工作生活的借口。我热衷于确保我的员工拥有良好的平衡，不过度工作。我认为好奇心是提供那种驱动力和专注的同时，还能拥有非技术爱好的关键。\n\
  \n### 在以不同方式处理问题，优秀的红队成员与普通人的区别在哪里？\n\n他们的能力在于不只看表面现象。红队测试的核心在于挑战假设并测试其他的潜在推理途径，即使这违背了常理。红队成员是这样类型的人：他们看待一个情况时，不是想“这意味着什么”，而是想“我能从中发现什么”。我认为这种技能是可以教的，就像教开发者除了用用户故事思考，还要用滥用用例或攻击者故事来思考一样，但有些人天生而然就能考虑替代方案。\n\
  \n\n\n\nIsaiah 是一个充满好奇心的黑客，热爱人类。他从小学就开始黑客，从那时开始摆弄计算机。他的第一份正式信息安全工作是 2008 年在 `Microsoft\
  \ Malware Protection Center`。从那时，他开展了许多攻击性安全任务，并帮助他人成为顶尖的安全从业者。他痴迷于成功的破解，而任何任务中最他喜欢的部分是执行后渗透活动。当他没有在黑、教学或为更公平的未来而战时，他会玩桌游游戏、游泳并接受`巴西柔道术`训练。\n\
  \n## 你是如何开启红队生涯的？\n\n简单来说，我开始做网络渗透测试咨询，最终因为渴望更多的技术挑战而转向了红队工作。那些让我受益终身的技能源于我一生的思考——在通过\
  \ IT 服务台、系统管理等工作积累技术经验的同时，不断问自己：“如果我这样做会怎样？”\n\n## 获得红队工作的最佳途径是什么？\n\n提升你的技能，然后发挥你的长处。建立一个全面的攻击性安全知识体系，然后针对你感兴趣的一个或多个领域进行专精。红队需要多样化的技能组合来应对各种项目，但他们也需要能够在特定领域深耕的人才。例如，如果你专攻攻击托管在\
  \ `AWS` 上的基础设施，请考虑加入一个已经迁移或正在迁移到云端的组织红队。不要让一个从未听说过“基础设施即代码”的组织成为你的首选。\n\n## 人如何在不触犯法律的情况下获得红队技能？\n\
  \n咨询是磨练你在红队中使用所需技能 set 的最快途径之一。你将获得多样化的经验，并建立必要的沟通能力，以提供红队经常需要提供的咨询服务。\n\n> “咨询是磨练你在红队中使用所需技能的最快途径之一。你将获得多样化的经验，并建立必要的沟通能力，以提供红队经常需要提供的咨询服务。”\n\
  \n如果咨询不是一个选择，请在你的日常工作中获得执行攻击性工作的授权。渗透测试以及随后的红队测试，往往是“恶意的系统管理”。不要轻视你已经在使用的技能，要学习如何利用这些同样的技能来一些乐趣和利润。\n\
  \n### 为什么我们对什么是红队无法达成共识？\n\n这在“酷炫”与“需求”之间存在冲突。我认为大多数公司并不需要红队。诚然，他们需要拥有攻击攻击知识的人才，但他们必须先涵盖基础工作。如果他们持续在渗透测试中被击溃，那么他们需要投资于基础安全。红队的存在是为了帮助安全组织升级，而不是成为他们的补丁管理程序。\n\
  \n尽管投资红队是一项资源消耗，但许多组织仍想建立红队。也许有人在会议或从博客文章中学到他们“需要”一个红队。又或许他们想要那些被“红队队员”之类的职位吸引的技术人才。因此，我们最终看到，能够进行正规红队工作的人，在那些甚至还没准备好接受股票渗透测试的公司工作。这使得很难准确地描述这个团队：他们被称为红队，由红队队员组成，但他们的任务仅仅是运行一个漏洞扫描器。\n\
  \n## 信息安全领域的其他人对加入红队有什么是不理解的？你听过的关于红队、蓝队或紫队最有害的谎言是什么？\n\n这并不总是酷炫的间谍活动。由于你的专业化，你通常是寻求指导的首选。你的工作不仅仅是用“帅气落地”的攻击摧毁网络。它涉及到大量的教育，以及寻找说服人们停止他们多年来做法的方法。\n\
  \n红队并不一直需要处于敌对。是的，他们需要测试组织，并且需要享受酷炫的破解；那是他们的工作。但当他们将自己定位为蓝队的敌人时，他们就不再认为自己属于同一个大团队，拥有着共同的目标：让组织变得更好。\n\
  \n## 何时应该在组织的安全计划中引入正式的红队？\n\n在建立、维护并充分利用内部渗透测试团队之后，一些组织尝试从第三方渗透测试跳跃到红队。他们往往没有准备好支持内部团队的基础设施。很多时候，组织并不统一理解红队要做什么。最关键的是，红队旨在帮助升级的其他职（`SOC`、`IR\
  \ 团队`等）往往太不成熟，无法进行持续的红队测试。部署内部渗透测试团队会产生学习、成长和实用的基础设施。这些步骤同样有助于一个组织向红队转型成长。\n\n当防御者不再受到内部渗透测试团队工作的挑战，并且测试团队自然开始进行更复杂的攻击者风格任务时，该组织就准备好接受红队了。\n\
  \n## 你如何向不情愿或非技术的客户或组织解释红队的价值？\n\n对我来说，一个有效的步骤是请他们列举其组织面临的威胁类型。然后我问标准的渗透测试是否在模拟那些威胁。\n\
  \n顺便提一下，即使组织的威胁模型中存在高级攻击者，也不意味着他们已经准备好接受红队测试。这可能意味着他们需要快速升级，因为他们已经力不从心了。\n\n## 你看到实施过的性价比最低的安全控制措施是什么？\n\
  \n无论最后一家供应商试图说服你它能解决所有的安全忧虑，或者你并不存在的问题。我们不需要发明问题；我们被问题包围。许多问题可以通过改进流程和调优现有技术来解决。每当有人倾向于向你卖新产品而不是帮助你找到根源时，请逃跑。\n\
  \n## 你是否建议过不要进行红队任务？\n\n绝对有！当我做咨询时，我可能不是一个很好的“公司人”。我很少向客户推销。有时会有急切的客户问他们是否准备好进行红队测试，我会友好地提醒他们我刚刚进行的测试。\n\
  \n我曾建议并继续建议投资于将安全融入日常流程的组织变革。为每个人购买 `U2F tokens` 的性价比，远高于花钱让他们进行为期一周的任务——在任务中，他们撬锁（你知道这很糟糕）、在未锁的笔记本电脑上（你知道这没被监控）上安装后门，并提升到\
  \ `domain admin`（在一个你知道充满漏洞的环境中）。同样，聘请两个 `SOC 分析师`并让他们建立稳健的 `SEIM 关联逻辑`，比聘请一个成本四倍的传奇黑客性价比高得多。\n\
  \n\n\n\n\n没有某个特定的场合浮现在脑海。在渗透测试任务中，我最反感的事情之一就是客户要求我在仅有两周的范围内“模拟 APT 攻击”！更让我恼火的是，有人积极试图干扰我的测试，但在没有预先知识的情况下又无法检测到我的活动。偶尔会发生这种情况：某些知晓测试情况的人看到我正在使用一个\
  \ `service account`（服务账户），然后他们更换了一个三个多年没有更改过的密码。当他们这样做时，基本上是在举手说：“我很傲慢，我不想让自己看起来难看，而且我的判断力有限。”他们让自己成了我的头号目标，并不可避免地会在报告中发现他们自己的凭据（通常会被掩盖）。我特别喜欢他们使用他们的\
  \ `domain admin account`（域管理员账户）将我踢出系统，结果却把丰盛的凭据交给了。\n\n## 在执行任务期间，你遇到过最大的伦理困境是什么？\n\
  \n我很幸运；我的工作避开了这些问题。\n\n## 红队是如何协作完成任务的？\n\n红队所属的首要“团队”是组织本身。这意味着他们与蓝队在同一个团队中。消除“我们对抗他们”的政治心态，或是指责和嘲笑的欲望至关重要。黑客技术很酷，但构建一个具有韧性的安全计划是魔性的。红队需要将蓝队的胜利视为自己的胜利，而不是截然分开。\n\
  \n在完成任务的团队协作方面，在于触达目标并执行行动所需的多样化技能。你需要那些能够通过钓鱼、`zero days`（零日漏洞）或物理渗透建立立脚点的人。你需要其他知道网络中隐蔽移动的人。你还需要其他人来执行中间的所有工作。没有人能完成所有这些工作（在合理的时间内）。\n\
  \n### 在任务完成后，你如何对蓝队进行汇报和支持？\n\n我与客户是同一个团队的，所以在他们工作完成之前，我的工作还没有结束。内部红队和第三方红队可能有所不同，但心态是相同的。在内部，我负责提供尽可能的信息来帮助他们识别我做了什么（`pcaps`、`commands`、`timestamps`\
  \ 等）。作为第三方，我的目标是提供尽可能的信息，以避免客户需要进一步的帮助。第三方红队任务的范围应该始终包含修复和重测期间的支持。\n\n> “我与客户是同一个团队的，所以在他们工作完成之前，我的工作还没有结束。”\n\
  \n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\n教导蓝队成员使用攻击技术来测试他们自己的监控、告警和响应解决方案。正如我们提倡在构建代码时对其测试一样，我们也应该在部署时测试我们的监控、告警和响应解决方案。\n\
  \n防御和进攻被作为独立的学科来教授，但它们不应如此如此。我们可以专精其中一种，但我们需要更多的共享知识。\n\n### 如何编写优秀的报告，你有什么实用的建议？\n\
  \n第一步是重新定义我们看待它的方式。不要把它看作最后一步、最后一刻完成的负担，而要看作是你 `1337’ness`（技术牛属性）的展示。除非你展示给他们看，否则没人知道你有多厉害。通常，报告是客户付钱的唯一东西，所以要这样对待它。如果你不在报告中展示你所做的一切，你就从未做过它。\n\
  \n在实操方面，对我有效的某些技术是：边做边写报告、截屏所有内容、并提前完成初稿。这样一来，我所做的每件事都有证据，特别是当我后来发现某些无法复现的东西时。此外，我喜欢写完报告后睡一觉，编辑一次，过一段时间再编辑第二次，再过一段时间，进行最后的阅读。强大的报告能力不仅让我看起来很好，还有助于实现我的主要目标：让人变得更好。\n\
  \n### 你如何确保你的项目结果对于需要完整叙述和背景的人有价值？\n\n坚持事实。避免将问题视为孤立的问题。讨论它们更大的影响，并阐明改进流程将如何阻止未来的攻击。叙述是提供背景的强大工具，特别是对于多阶段攻击。由于其引人入胜性，这也是强调哪些可以阻止该攻击的好地方。说诸如“凭据重用和单因子认证允许顾问获取在普通用户环境中发现的凭据，并利用它们破解了机密环境”这样的话非常有力量。它没有指责任何人，但仍然强调了影响。\n\
  \n### 除了指出不足之处，你如何建议进行安全改进？\n\n第一步在于我们谈论不足之处的方式。绝不应该是“嗯，某个白痴做了这个。”而应该是“如果你的目标是实现\
  \ A，那么你需要执行 B，原因如下。”这消除了针对个人的指责，并将焦点转移到解决方案上。\n\n## 在招募和面试红队成员时，你寻找哪些非技术技能或态度？\n\
  \n沟通和教学能力。你可以是世界上最优秀的黑客，但如果你不能教导别人，我不希望你在我的团队里，无论是团队同事还是被你黑掉产品的项目的经理。\n\n### 在以不同方式处理问题方面，优秀的红队成员与众脱颖而出的特点是什么？\n\
  \n他们相信学习永无止境，并且总有攻击问题的新方法。■\n\n# 35\n\nMary Sawyer\n\n> “在我看来，红队最有成就感的工作是与蓝队合作修复你们的弱点。”\n\
  \n![](img/SawyerMary.jpg)\n\n**Twitter:** @0x_90\n\nMary Sawyer 目前是 Palo Networks\
  \ 红队的成员。除了在红队通过采用攻击者的心态、策略和战术来保持领先之外，她还在紫色团队计划上进行创新。\n\nMary 拥有德克萨斯大学奥斯汀分校的计算机科学学学位以及信息安全证书。她是通过技术激励和赋能女性的坚定支持者。\n\
  \n### 你是如何开始红队工作的？\n\n我主要是通过加入大学的安全俱乐部开始接触攻击安全的。我非常喜欢学习并向其他学生介绍安全概念以及我在网上读到的酷脚本技巧。俱乐部的一个赞助商听说了我的工作，慷慨地邀请我以此为生。\n\
  \n## 获取红队工作的最佳方法是什么？\n\n我有点倾向于自己的方法，即加入安全俱乐部。这让我能够探索广泛的话题并获得更大的受众。我认为还有其他不那么针对大学的方法可以推荐，比如\
  \ Twitter 或安全会议。即使你不从事安全工作，我认为如果你发现了一个酷的研究课题，你很容易成名。\n\n## 如何在不违反法律的情况下获得红队技能？\n\
  \n反黑客法律可能很复杂，但一个通原则是你必须获得所有者的许可。所以，我的建议是黑自己的东西！一个很好的起点可以是使用 `Acrack` 黑自己的 Wi-Fi，在网上购买的廉价手机上测试漏洞，或者使用\
  \ `Kon-Boot` 或任何其他拥有的实验室设备黑自己的电脑。\n\n### 为什么我们对什么是红队无法达成共识？\n\n\n\n\n\n我认为这是一个成熟度的问题。一个年轻安全组织的需求与一个老牌组织的需求完全不是一回事。即使一个年轻组织资金充足，他们仍然在处理老牌组织很久就解决掉的“火灾”。每家公司的结构也略有不同，即使我们对某些事物的命名是类似的。与其他领域相比，信息安全领域本身仍然年轻，因此我认为这些问题会随着时间的推移而解决。\n\
  \n> “年轻安全组织的需求与老牌组织的需求完全不同。”\n\n## 信息安全领域的其他部分在哪些方面是不理解加入红队的？你听过的关于红队、蓝队或紫队相关的、最具毒性的虚假信息是什么？\n\
  \n我观察到有很多人对加入红队感兴趣。许多人认为，如果他们加入了红队，就不再用担心被黑客攻击了，因为他们将是进行所有攻击的人。事实上，加入红队会让一个人变得更加偏执！在了解了许多\
  \ `APT` 攻击是多么简单，以及一个随机的开发人员或 IT 人员复制同样的攻击是多么廉价之后，我至少可以代表我自己说，我很难相信每个人都像看起来那样冷静。这引出了我的下一点：我接触过的大多数想在红队工作的孩子都认为那里每天整天都在写\
  \ shell（外壳程序）。你真的并不想要那样。在我看来，红队中最有成就感的工作之一是与你的蓝队合作，修复你们的薄弱环节。\n\n## 你应该何时向组织的安全计划中引入正式的红队？\n\
  \n我认为，安全计划只要在 IT 组织中拥有权力要求利益相关者修复安全漏洞，就可以开始着建立红队了。如果你没有权力实际上修复红队评估中发现的任何结果，那么建立红队的价值除了拥有一份威胁攻击者可以利用的方便资产清单外，几乎没有其他价值。\n\
  \n## 你如何向不情愿或非技术背景的客户或组织解释红队的价值？\n\n有些人人只有在面临不安全操作引发的后果时，才会关注安全。红队在这方面非常有用。在我们组织的脏事落入国家力量、有组织的犯罪集团、脚本小子（script\
  \ kiddies）等手中之前，我们先把这些内部问题晾出来。这通常意味着涉及巨额资金，这能比礼貌的漏洞扫描器更快地关闭工单并修复问题。\n\n## 你是否曾经建议过不要进行红队行动？\n\
  \n并不是所有人都准备好接受红队评估了！如果你知道环境中存在缺陷仍然要求有人利用这些缺陷，会有两种结果：你要么对环境没有新的见解，要么面临大量的、但无人积极解决的积压工单。我的建议是让负责处理积压工单的人员行动起来，之后进行红队评估，以评估理想的安全环境应该是怎样的。这才是红队真正的价值所在。\n\
  \n## 能够防止你破坏系统或网络最重要的或最易实施的控制措施是什么？例如，我们该如何帮助预算和人员较少的中小型企业？\n\n（注：原文此处翻译为：能够防止你攻破系统或网络最重要的或最易实施的控制措施是什么？例如，我们该如何帮助预算和人员较少的中小型企业？）\n\
  \n根据我的经验，最重要的控制将是某种密码管理解决方案。如果你做得好，它会让很多攻击变得无效（例如：密码喷洒、默认密码、密码重复使用等）。这很容易做错，而且在第一次搞砸之后很难修复。这就是为什么我认为中小型企业特别可以从关注这一点中受益。\n\
  \n## 红队是如何合作完成任务的？\n\n成为团队的一员意味着持续且稳健的沟通。由于我们的工作具有敏感性，我们的聊天程序进行端到端加密也很重要。不过，一些最好的工作是以结对编程的形式完成的。在一天中的某个时候，我们遇到瓶颈是不可避免的。这使得每个人都能做出贡献并相互学习。当我们转向编写报告时，我们会坐下来写下这个故事，添加细节，然后循环修改直到我们满意为止。与蓝队合作就像是一种咨询。他们来电，我们回答（取决于是谁弄坏了什么）。\n\
  \n## 在行动完成后，你对蓝队进行事后和支持的方法是什么？\n\n这取决于他们是否抓获了我们。如果他们抓住了我们，戏就演了。我们会放下所有事情，一起开始清理阶段，分享我们的时间线以及我们在什么位置运行了哪些命令。如果他们没有抓到，我们通常会等到正式结束练习，并正式提交我们的发现，以及受影响系统和泄露数据的概述。随后，我们将举行一次回顾会议，分享带有细节的时间线，并讨论他们本可以在哪里抓到我们。之后，我们将作为技术细节的顾问，与他们一起创建告警。\n\
  \n## 如果你转到蓝队，更好地防御攻击的第一步是什么？\n\n我很幸运在一个信息安全组织工作，该组织鼓励红蓝双方之间大量的合作和信息共享。这会导致双方产生很多创新。如果我要转到蓝队，我做的第一件事是询问红队：你们让我修复什么？蓝队面临的最大问题是什么？许多人的本反应是：“哦，我们是在对立面。我永远永远不会和他们交流，特别是关于我们的东西有多不安全！”我认为这应该是相反的。\n\
  \n## 关于编写良好的报告，你有什么实用的建议？\n\n我认为你应该从写一个故事开始。你知道你的工作很酷，现在就在报告中写出它是多么酷！然后添加细节和截图。如果你有一个模板，就开始复制你的故事，你自然会开始编辑过程。休息一下，然后再次进入，最后修改一次，然后交给同事再次编辑。尽可能，尝试去一些创意写作课程！这不必是一个痛苦的过程。你对写作过程越熟悉，对你和消费者来说报告周期就越好。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n\n\n\n\n对我来说最有用的技能包括写作能力、演讲技巧、同理心以及良好的幽默感。写作能力可能是我的首要技能。你需要它来编写报告、解释漏洞（包括你发现的以及根据他人原始报告质量所发现的漏洞）以及数百万其他杂项任务。良好的演讲技巧尤为重要，因为你不可避免地需要与高级董事、副总裁、项目经理和其他利益相关者交流。如果你不擅长解释你在红队演练或其他地方所做的工作，这基本上会抹掉你最初发现漏洞时所做的关键工作。后两项技能——同理心和良好的幽默感，在与受你工作影响的人交谈时变得很重要。虽然每个人都希望自己的工作得到应有的尊重和赞扬，但通过嘲笑你接管账户的开发者或在蓝队面前炫耀是无法获得这些的。\n\
  \n### 在以不同方式处理问题，优秀的红队成员如何脱颖而出？\n\n我认为最好的红队成员是优秀的沟通者。每个人似乎都认为，成为顶级红队成员的方法是在任何事情中寻找零日漏洞，或者在\
  \ CEO 的笔记本电脑上获取 shell。是的，这也是工作的重要部分，但如果你想提升这项手艺，你需要能够告诉其他人哪里出了问题以及如何修复。如果你能把这两件事都做得非常好，你的前景就稳了。■\n\
  \n# 36\n\n### Bradley Schaufenbuel\n\n> “我是一个自学的渗透测试员和道德黑客。我是通过在家里建立实验室并在那里练习来学习这项技能的。”\n\
  \n![](img/SchaufenbuelBrad.jpg)\n\n**Website:** [`www.linkedin.com/in/bradleyschaufenbuel/`](https://www.linkedin.com/in/bradleyschaufenbuel/)\n\
  \nBradley Schaufenbuel 是 Paylocity 的副总裁兼首席信息安全官 (CISO)，Schaufenbuel Advisory Services,\
  \ Inc. 的首席顾问，该公司自 2010 年以来一直从事商业红队任务。在 22 年的职业生涯中，他曾在金融服务和技术行业的许多公司担任安全领导职位。Bradley\
  \ 拥有 MBA、JD 和 LLM 学位；是一名执业律师；并持有 23 个专业认证。他是一位多产的作家和演讲者，并在多家风险基金和初创公司的顾问委员会任职。\n\
  \n### 你是如何开始红队工作的？\n\n我是一个自学的渗透测试员和道德黑客。我是通过在家里建立实验室并在那里练习来学习这项技能的。当我觉得自己掌握了基础知识时，我参加并通过了\
  \ EC-Council 的认证黑客（CEH）考试。九年前，我成立了一家网络安全咨询公司并开始提供传统的网络边界渗透测试。虽然我擅长发现和利用网络及基础设施漏洞，但在发现和利用应用程序漏洞以及执行社会工程方面技巧较弱。因此，我开始与其他合作以弥补我的短板。我也开始与客户的蓝队进行更紧密的合作。正是在此起，我真正从渗透测试转型到了红队测试。\n\
  \n## 获取红队工作的最佳方法是什么？\n\n获得红队工作的最佳方法是掌握红队成员的技能，然后通过教育和或认证获得对这些技能的客观第三方验证。我建议建立你自己的包含漏洞主机的实验室，然后练习漏洞诱导、漏洞利用、横向移动等。我建议学习有关威胁格局、漏洞、利用程序、社会工程技术等一切能学到的知识。如果你能够获得网络安全方面的正式教育，那会有帮助。如果无法接受正式教育，那么至少获得行业认证，例如\
  \ Offensive Security 认证专业 (OSCP)、认证黑客 (CEH) 和认证红队专家 (CRT)。好消息是，红队成员严重短缺，所以如果你对这项工作充满热情，你可以找到进入红队的方法。\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n我个人是通过建立自己的实验室并在那里练习来学习红队技能的。许多教育机构和红队训练营通过向愿意提供的组织提供免费红队任务，为他们的网络安全学生提供更真实的红队接触。有志红队成员也可以从红队培训组织获得第三方实验室的访问权限。红队成员绝对没有理由在未经授权的网络上练习技能，这样做没有任何正当理由。\n\
  \n### 为什么我们对什么是红队没有共识？\n\n在我看来，获得红队定义共识的最大障碍是该术语的广泛滥用——无论是商业领域还是内部。红队测试比渗透测试更全面，而渗透测试比漏洞评估更全面。价格自然与测试的全面性和交付所需的技能挂钩。某些服务供应商利用这些术语之间的混淆向客户过度收费或压低竞争对手的价格。我无法告诉你有多少潜在客户仅根据价格就选择了竞争性的“红队任务”方案，然后收到的却是对边界进行自动漏洞扫描的原始输出，作为他们的“红队报告”。我还看到过安全专业人员滥用这个术语，他们将应用安全团队或漏洞管理团队称为他们的“红队”，尽管他们并没有在做红队测试。除非这些服务的消费者对他们实际支付的内容更有鉴别力，且安全专业人员不再如此随意地使用这个术语，否则对于什么是真正的红队将继续存在不同的定义。\n\
  \n> “红队测试比渗透测试更全面，而渗透测试比漏洞评估更全面。”\n\n### 信息安全领域的其他人对红队工作不理解的一点是什么？关于红队、蓝队或紫队，你听过最具毒性的假言是什么？\n\
  \n信息安全领域的其他人完全不理解红队工作的一点是这项工作到底有多困难，跟上发展又有多困难。我认为许多人对红队成员的印象是：喝着可乐，快乐地敲击键盘，突破一又一层安全防护，并在过程中互相击掌。实际上，一名优秀的红队成员必须是有条理且有方法的。他们记录活动的时间比执行活动要多。他们花费大量时间研究新威胁、新漏洞并改进自己的技术。虽然令人兴奋，但这可能是非常艰辛的工作。\n\
  \n> “我不认为一个组织在没有拥有相对成熟的安全计划和功能完备的蓝队之前，就能获得红队的真正价值。”\n\n## 你应该何时向组织的安全计划中引入正式的红队？\n\
  \n我不认为一个组织在没有拥有相对成熟的安全计划和功能完备的蓝队之前，就能获得红队的真正价值。你无法从一个尚未准备好的测试中从中获得多少价值。红队任务的意义在于学习和改进。如果你没有基础，并且没有一个可以应用所学经验的防御团队，那么真的没有意义。\n\
  \n### 你如何向不配合或非技术的客户或组织解释红队测试的价值？\n\n\n\n\n\n我将红队（red teaming）的价值解释为一种相对廉价的方法，用于确定过去在人员、流程和技术方面的投资是否产生了预期的结果，以及未来的哪些投资领域将为组织带来最大的回报。红队利用的技术与坚定的对手所使用的技术相同，因此在不产生实际攻击影响的情况下，没有比这更好的方法来衡量防御质量。\n\
  \n## 在你看到的已实施的安全措施中，性价比最低的是什么？\n\n我看到的已实施的性价比最低的安全措施是未经调优的安全信息和事件管理（`SIEM`）平台。如果一个组织不花时间确保只有最高风险的事件才作为警报呈现，那么蓝队（blue\
  \ team）的安全分析师就会很快陷入审查大量低价值警报的泥潭。安全分析师需要筛选的垃圾信息越多，优秀的红队就越容易隐藏其活动轨迹。\n\n## 你是否曾经建议过不要进行红队演习？\n\
  \n曾有一个潜在客户联系我，想进行一次红队演习。当我们开始确定演习范围时，客户承认该组织在安全方面没有投入过任何资金，而且没有任何安全计划或组织。事实上，他认为我们会在几分钟内接管他的环境。他想通过红队演习来恐吓他的高管理层投入安全资金。我告诉他，红队演习的一个重要目标不仅是测试组织的技术控制，还要测试其事件响应能力的及时性和有效性。在没有任何安全控制投入且没有无可言的蓝队的情况下，我建议他考虑改为进行基础的漏洞评估。这比红队演习要便宜得多，而且可能达到相同的效果，即通过一份包含满片“红色”的报告来触发管理层的行动。\n\
  \n## 能够防止你攻破系统或网络的最重要或最易实现的控制措施是什么？\n\n中小型客户可以实施的防止我攻破其网络或系统的最简单、最廉价的措施是基础的补丁管理。我要利用的漏洞越少，实现演习目标就越困难。这可能不是最容易实现的，但第二重要的控制是在所有面向的接口上开启多因素身份验证（MFA）。许多系统都包含\
  \ `MFA` 选项，如果没有，也有许多廉价的第三方 `MFA` 插件。没有 `MFA`，通过密码学喷洒（password spraying）或钓鱼攻击攻破用户凭据轻而易举。面向的接口是红队攻破凭据并进入的首选。\n\
  \n> “面向的接口是红队攻破凭据并进入的首选。它们需要得到相应的保护！”\n\n## 为什么你认为遵守行动规则（rules of engagement）至关重要？\n\
  \n行动规则是你与客户之间的一份合同。如果你忽视了这些规则，你就违反了那份合同。如果你违反了合同，那么你的活动就不再获得授权。如果你的活动不再获得授权，你就不再是道德黑客。如果你不再是道德黑客，那么你就是一个罪犯。\n\
  \n## 如果你在渗透测试或其他任务中被抓到，你是如何处理的？\n\n我当时正在一家大型社区银行进行物理渗透测试。该银行的灾备恢复中心位于大型分行后方的一个机房。我伪装成一名\
  \ `AT&T` 技术人员进入了分行。我找到分行经理，向她展示了虚假的工单和身份证件，说我需要进入机房，因为我正在处理的电路就终止于那里。她似乎完全听信了这个故事，并带我去了机房。更好的是，她让我留在机房里无人看管。太棒了！我用手机拍了几张照片，然后将笔记本电脑接入网络交换机并开始我的工作。几分钟后，我听到说话声和脚步声走近。我转身看到分行经理带着一名警察，警察立即命令我不动并表明身份。事实证明分行经理怀疑我，但表现得很冷静并拨了\
  \ IT 经理的电话，经理表示他没有安排过任何工作。一名警察恰好在外面巡逻，所以分行经理拦下了他。幸运的是，我身上有一张“免死金牌”。给授权测试的 `CISO`\
  \ 打了一通简单的电话后，我被允许离开了，而没有被关押。但这确实非常尴尬。\n\n## 在执行任务期间，你遇到过最大的伦理困境是什么？\n\n我遇到过的最大伦理困境发生在红队演习期间客户网络进行横向移动时，我在某高管的个人硬盘上发现了儿童色情信息。根据客户所在地法律，我有义务直接向当局报告我的发现。我告诉客户我发现了什么以及我根据州法律承担的义务。客户想在内部处理此事，并要求我不要向执法部门报告发现。客户威胁要因违约起诉我，声称根据我们的共同保密协议，我有义务不向第三方披露我的发现。我拒绝违反法律并向当地警察局报告了这一发现。我失去了客户，他们拒绝支付我的工作费用，但我认为我做了正确且合法的事。儿童色情不是玩笑的。\n\
  \n## 红队是如何协作完成任务的？\n\n最有效的红队由拥有非常多样技能和视角的人组成。某人可能是社交工程大师，另一个人可能是脚本狂，另一个人可能专注于应用安全，以此类推。很少有人能精通一切。当拥有不同但互补的技能和共同目标的人聚在一起时，奇迹就会发生。鉴于团队每个成员都有自己的关注领域，分配报告编写和总结等任务相对简单，每个红队成员都会在其专长领域贡献力量。\n\
  \n## 在行动完成后，你对蓝队进行总结和提供支持的方法是什么？\n\n在理想情况下，我的红队在演习期间与蓝队直接合作；换句话说，我们共同进行“紫队”（purple\
  \ team）行动。对于更传统的红队演习（即我们的活动未被发现，或者客户的反应不恰当或不及时），我的总结包含了建议蓝队如何增强其监控和事件响应能力，以便更迅速地发现并应对异常事件。\n\
  \n## 如果转到蓝队，你更好地防御攻击的第一步是什么？\n\n\n\n\n\n我周末兼职红队成员，周中负责监督蓝队，所以对我来说，这实际上不是一个理论性问题。假设已经部署了常见的边界安全控制（包括稳健的补丁管理计划），作为蓝队成员，我的第一步将针对任何`public-facing\
  \ interface`利用`multifactor authentication`（多因素身份验证）。作为红队成员，对于使用`single-factor authentication`的`public-facing\
  \ interfaces`执行成功的`password spraying`（密码喷洒）攻击（或通过`phishing campaigns`收集凭据）就像从小手里拿糖一样简单。这既廉又容易。部署`MFA`最大的障碍是使用了那些不支持集成`MFA`选项或`SAML`的旧版`public-facing\
  \ interfaces`，例如`Outlook Web Access`。\n\n## 关于编写良好的报告有什么实用的建议？\n\n面对现实吧——写红队测试报告非常糟糕。与执行渗透任务本身相比，它既耗时又无聊。尽管如此，它是工作中不可或缺的一部分。客户付钱给你是为了了解他们面对攻击者时的脆弱性。你的报告就是他们学习的方式。你的报告也反映了你所开展的红队演练的质量和全面性。报告的读者通常不仅是你的客户，还包括其客户和/或监管机构。如果你的报告质量低下，这些利益相关者也会质疑红队测试的质量。一份报告应该引导读者了解红队采取的所有行动、发现的所有漏洞，以及客户可以采取什么措施来修复漏洞。\n\
  \n> “面对现实吧——写红队测试报告非常糟糕。”\n\n## 你如何确保你的项目结果对需要完整叙述和背景的人有价值？\n\n我的红队报告读起来有点像格里沙姆的小说。它引导读者穿过所有的情节转。我既描述了红队失败的技巧，也描述了成功的技巧。我还指出了客户控制措施的优点，也指出了他们的缺点。我描述了我们的努力被蓝队挫败的时刻，以及我们成功的时刻。红队并非无懈可击。在给予荣誉的地方给予荣誉，而不仅仅是贬低客户，这一点很重要。\n\
  \n##指出不足之处，你如何建议安全改进？\n\n在我的最终报告中，我针对红队演练中利用的任何漏洞提供了分步骤的修复说明。如果我的活动没有被蓝队检测到，我会建议未来如何实施检测此类活动的方法。如果社会工程技术被成功，我会建议加强安全意识培训。我还喜欢为我的客户的安全计划提供一个实现下一阶段成熟水平的路线图。换句话说，我建议客户在修复了我们在本次任务中利用的漏洞后，他们应该将精力放在哪里。\n\
  \n## 在招募和面试红队成员时，你寻找哪些非技术性技能或态度？\n\n我寻找的是无穷无尽的求知心（这是必要的，因为学无止境）。我寻找的是非凡的毅力（在面对坚定的蓝队时，实现红队目标是必要的）。我寻找的是坚定不移的个人正直（在一个跨越黑暗黑暗面可以获得巨额利益的职业中，这是必要的）。我寻找的是对这个领域的热情（随着时间的推移，维持前三者是必要的）。\n\
  \n## 在处理问题方面，优秀的红队成员是如何脱颖而出的？\n\n普通的红队成员会立即投入并开始测试。卓越的红队会在测试之前花时间进行规划和制定策略。普通的红队成员利用预先写的利用工具。卓越的红队成员编写自己的利用工具。普通的红队成员一次尝试一种技术，如果一种失败了就放弃。卓越的红队团队创造性地结合技术以获得结果。普通的红队成员寻找脱颖出的机会。卓越的红队成员寻找合作以利用协同效应的机会。普通的红队成员在耗尽所有常用技术且未实现目标时放弃。卓越的红队成员会日以夜地坚持，直到实现目标。■\n\
  \n# 37\n\nTinker Secor\n\n> “花大部分时间通过参加当地聚会和会议来寻找工作。也加入一些口碑良好的在线小组。”\n\n![](img/SecorTinker.jpg)\n\
  \n**Twitter:** @TinkerSec\n\nTinker 是一位全能渗透测试员，在测试和绕过逻辑、物理和社交环境的安全方面拥有经验。他曾在美国、加拿大和欧洲作为红队任务的一部分执行过社会工程学行动。Tinker\
  \ 曾建立、管理并培训过红队和渗透测试团队。在此之前，Tinker 曾在 SOC（安全运营中心）一线担任入侵检测分析师。在此之前，他曾服务于美国海军陆战队。\n\
  \n## 你是如何开始红队的？\n\n一个名叫 Bubbles 的壮汉在达拉斯黑客协会的会议后找到了我。我曾在当地社区做过关于我在美国海军陆战队如何处理动能攻击和防御的演讲，以及关于我如何捕获中国恶意软件进行分析的技术演讲。他说我具备做红队成员的心态，并想知道我是否想加入他的团队。他承诺会提供培训和指导。我拒绝了。我当时正在做蓝队的工作，并且刚刚开始一个我想做完的项目。六个月后，我完成了那个项目，他又来找我。这次我答应了。\n\
  \n我通过了面试流程并获得了这份工作。他们向我保证，在开始阶段，他们会慢慢让我适应工作。他们会培训我，并让我观察其他团队成员。半年后，他们就会让我开始独立执行任务。\n\
  \n在我刚开始时，我的新公司就被收购了，大多数成员离开了。我、另一个新手和我们的技术负责人就是团队留下的最后成员。我的头衔被改为高级渗透测试员，我被派往洛杉矶入侵两个不同的目标。在经历了几个漫长的白天、不眠之夜晚，利用团队剩余的知识、向当地朋友寻求技术建议并经历了大量的适应后，我成功控制了两个目标网络，并开始了我的红队生涯。\n\
  \n## 获取红队工作的最好方法是什么？\n\n就像获取任何工作一样，你将时间分配在建立所需的技能和建立人脉上。\n\n-   建立技能：学习以下内容：系统、网络、虚拟环境和云、桌面应用、Web\
  \ 应用、移动应用、脚本、物理环境、社交交流、基础攻击、基础防御。\n-   在你实际开始之前，你不会成为其中任何一个领域的专家。只需要感觉一下。这看起来很困难，但现在不要进行深入研究。学习高层知识并看看它们是如何联系的。以后，你会开始深入研究。\n\
  -   还要练习以下内容：参加脚本挑战，在廉价的笔记本电脑上构建虚拟实验室并安装系统，通过网络连接它们，在在线或会议上参加夺旗赛（CTF）。\n\n\n\n\n\
  \n## 专业人脉建立\n\n拥有基础技能组合后，你通过人脉来获得工作。尽管可以尝试通过在线申请工作，但不要在上面花费太多时间。把大部分时间花在参加当地的聚会和会议来寻找工作上。加入一些良好的在线群组。如果你当地没有聚会或会议，就自己创建并组织一个。除了参加会议，还要为这些会议担任志愿者。面对面的人脉是最好的，但这受到金钱、手段以及远离大城市的限制。尽你所能，利用提供的任何资源，例如奖学金和志愿者费用报销（某些地方会报志愿者的机票和住宿费用等）。\n\
  \n“你认识谁”（人脉）决定了你能否获得工作。而“你懂什么”（建立技能组合）将帮助你结识和了解他人。这是一个向上的良性循环。突破口是最难的部分。之后，随着你不断积累经验、技能组合和专业声誉，事情会变得容易。\n\
  \n## 如何在不触犯法律的情况下获得红队技能？\n\n有一种老调调，认为你必须违反法律才能学习黑客技术。这种观点产生于资源匮乏的年代，人们学习的唯一途径就是摆弄别人的东西。\n\
  \n如今，如果你能弄到一台旧笔记本电脑（eBay 上很便宜，或者社区组织免费提供——到处找找！），你可以使用免费工具构建虚拟环境，并练习所需的所有技能。使用免费的\
  \ Linux 系统，免费安装 `VirtualBox`，从 `vulnhub` 下载免费的漏洞虚拟机，并攻击这些机器。\n\n如果你能参加线下或线上的 CTF（夺旗赛），请参与其中。在网上或当地图书馆获取免费书籍。在\
  \ `Cybrary`、`EdX` 和 `Coursera` 上参加免费的在线课程。你学习和训练所需的一切都是免费且合法的。\n\n## 为什么我们无法对什么是“红队”达成共识？\n\
  \n我们尝试过采取各种安全评估，并将它们浓括为几个口号。就是如此简单。“攻击性安全测试”的核心在于对既有安全架构进行质量保证，或者证明既有安全架构中存在漏洞。\n\
  \n> “攻击性安全测试”的核心在于对既有安全架构进行质量保证，或者证明既有安全架构中存在漏洞。”\n\n如果你想测试特定的实现方案，你就进行“针对性渗透测试”。如果你想测试特定的环境，你就进行“目标环境下的开放范围渗透测试”。如果你想针对特定的威胁场景测试所有环境，你就进行“基于以下威胁行为者威胁场景的全环境开放范围渗透测试”。\n\
  \n在讨论这些更具开放性的评估时，`red team`（红队）这个词读起来更顺口。问题在于界限划在在哪里。针对性渗透测试从何时演变成一场全面的红队攻防？为了增加复杂性，我们将防御者设定为蓝队，因此所有攻击方测试人员都是红队，所以他们做的任何行动（即使是白盒安全审计）都可以被视为红队行动。\n\
  \n最后，营销部门的人非常喜欢“红队”这个概念，因为它听起来很性感很酷，我们可以用它来推销所有产品！因此 `red team` 的定义变得更加模糊。别担心，所有的概念性术语都会因为内涵的扩张而变得毫无意义。\n\
  \n## 何时应该为组织的安全计划引入正式的红队？\n\n安全质量保证评估和渗透测试可以在也应该在安全成熟度模型的所有阶段进行。最初，它可以帮助证明对安全的迫切需求，确定初始步骤的优先级，并帮助建立基准标准。在整个成熟度模型中，它可以建立持续的基准，协助趋势分析和进一步的安全优先级排序。\n\
  \n公司何时从向第三方咨询公司外包这种需求转为内部？这与任何工作都一样：当成本效益分析显示引入内部资源优于外包时即可。通常，当一家公司足够大以支持开销，且这种充满活力的安全模型需要持续测试时，就是由专门的人员或团队进行攻击性安全评估的好时机。\n\
  \n## 如何向不情愿或非技术性的客户或组织解释红队的价值？\n\n我将红队测试简化为质量保证。它仅此此。如果一个不情愿或非技术性的客户首先看到了安全的需求，那么他们就会看到测试这种安全的必要性以确保其有效性。如果同一个人看不到安全的需求，我会向他们展示红队或渗透评估如何证明这种需求。\n\
  \n最终这取决于那个人的威胁模型。他们的优先级是什么？如果这些优先级受到攻击他们会担心什么？他们想建立什么样的架构来保护这些优先级？以及他们希望如何测试并确保安全架构正常工作？\n\
  \n## 你看到的投入产比最低的安全控制措施是什么？\n\n这是一个有趣的问题。我看到人们投入了安全措施，但与其他安全控制措施相比，对阻止攻击的作用微乎其微？说实话，我并没有看到太多的安全措施，所以通常比没有要好。\n\
  \n但尽管如此，我认为我看到的投入产比最低的安全控制是漏洞扫描器。并不是我不喜欢漏洞扫描器；如果它们真的能被充分利用，它们是非常棒的。但它们从未被充分利用。我说这句话并不是因为认为渗透测试比漏洞扫描器更好。它们都是安全质检，涵盖不同的领域并有不同的优势和应用，公司应该兼者顾。\n\
  \n这里我看到的一个典型场景：ACME 公司实施了一个来自顶级供应商的漏洞扫描器。这是一个非常可靠的扫描器。它可以检测相当比例的已知漏洞、简单的配置错误和缺失补丁。\n\
  \nACME 运行了一次扫描器，生成了一份关于所有漏洞的巨大报告！太棒了！现在怎么办呢？你必须修复这些问题。经过多次会议，发现的问题减少到了危急（Critical）和一些高危（High），并在几个月后，只有极小一部分被修复了。剩余的中低级发现被忽略了（尽管修复其中许多项很容易，且见效快）。\n\
  \n但那只是一次偶然的、点点的扫描。在那段时间没有建立漏洞管理计划。没有补丁管理策略。所以，ACME 再次扫描，生成了更长的列表（因为增加了新的漏洞和对旧漏洞的新检测）。\n\
  \n指标显示该计划落后了。\n\n于是，ACME 使用漏洞扫描器进行持续扫描，但扫描结果从未（或执行频率低到等同于从未）处理。此外，大多数扫描并没有覆盖整个 CIDR\
  \ 范围；而是使用已知的 IP 和主机信息，因此遗漏了异常系统或遗留系统。此外，有些系统太陈旧且漏洞太多，漏洞扫描器的运行会导致它们崩溃，因此并没有让系统变得健壮，而是将其从扫描列表中移除并被遗忘。\n\
  \n## 你是否建议过不要进行红队攻防行动？\n\n很多人不需要全面的红队行动。在这些人中，如果客户相信并信任我，他们通常能从白盒安全审计中获得更多益处。\n\n\
  \n\n\n\n通常，人们要么没有足够的经验背景来理解可能发生什么，要么他们并不了解我，或者无法通过信赖的声誉来判断我的话是否可信。这没关系。通常，红队测试（red\
  \ teams）提供的影响证明至关重要，或者全面渗透测试得出的优先级排序和基准测试是其安全方法中极具价值的部分。\n\n对于那些确实认识我、拥有安全文化且不需要黑盒测试的客户，我通常建议采用更多的白盒方法。例如，我会进行开放式安全审计，查看所有内容——网络拓扑、防火墙规则、组策略偏好、物理巡检等——然后根据从上而下看到的内容对我可以做什么进行分析。或者，我会进行更具局限性更有针对性的渗透测试，假设攻击者已获得某种程度的访问权限，并专注于其安全机制的一个关键领域。\n\
  \n白盒评估通常所需的时间更短，成本更低。在适当的情况下我会推荐这种方法。\n\n## 为什么你认为遵守参与规则（Rules of Engagement）至关重要？\n\
  \n参与规则（ROE）由于以下几个原因至关重要。首先，可能不需要测试所有内容。例如，如果客户知道自己容易受到网络钓鱼攻击，并且已经开始缓解该漏洞的过程，那么通过网络钓鱼攻入他们的测试对他们来说将无益无完。这能证明什么他们已经不知道的事情呢？除了他们已经在正在缓解的问题之外，这还能说明其他什么？因此，我们可能会在\
  \ `ROE` 中加入“不进行网络钓鱼尝试”，以便将评估引导到其他可能导致入侵的其他因素，并帮助进一步缩小攻击面。\n\n其次，`ROE` 有助于防止实际损害。我可能会证明我获得了足够的访问和特权来删除所有数据，但我永远不会真的删除所有数据。我可以给员工留在车里的笔记本电脑拍照，但我不会去撞破他们的车窗来偷笔记本电脑。除了法律问题之外（我不会为了进行测试而违反当地法律，即使攻击者可能会这样做），我们希望我们的测试能阻止实际伤害，而不是由我们自己造成实际伤害。因此，我们的\
  \ `ROE` 将专门包含此类表述，说明我们可能会展示访问或特权，但不会进行极有可能导致实际损害的影响证明。\n\n## 如果你在渗透测试或其他任务中被“抓包”了，你是如何处理的？\n\
  \n我很少在传统意义上被“抓包”。通常在获得访问权限并展示影响证明后，我的动作会变得越来越大，直到我（故意地）被发现。然后，我会设定一个检测基准，帮助客户知道他们看到了什么，错过了什么。话虽如此，我确实被多次叫停过。我喜欢通过讲述故事、演讲和参加播客节目来强调这些时刻。其中一些包括我的《唱忧歌：当蓝队踢掉红队的屁股》系列。\n\
  \n让我回想一个我没说得那么多的例子……我当时正从互联网黑入一个网站。我发现了一个漏洞，允许我进行盲注 SQL 注入攻击并访问后端数据库。在了一些试探性的探测后，我使用\
  \ `sqlmap` 开始发力并让它尽情发挥。在三个不同的日子里，我进行了攻击并转储了数据库碎片。\n\n然而，获取完整的身份哈希值非常困难。该 Web 应用并不健健壮，盲注\
  \ SQL 攻击需要大量的调整才能获得可靠的输出。在我获取关键账户信息之前，我被彻底拦截了。\n\n我的 `IP` 地址被封锁了，更重要的是漏洞被修复了。我和另一位同事更换了\
  \ IP 并找到了新的攻击向量，但那个也被修复了，新的 IP 地址也被封锁了。当我们耗尽了几个 IP 地址且无法找到更多攻击向量时，我通过他们的登录门户向目标发送了最后一条信息：\n\
  \n```\nUNION SELECT \"Hello Team! Good Job!\" --\n```\n（注：此处原文代码块内包含 SQL ，根据指令代码块不需要翻译，但为了保持逻辑连贯，保留了其结构）\n\
  \n\n\n\n\n对于希望我们在事后协助缓解问题的客户，我们通常会将工作交给其他团队，由他们负责构建缓解措施并加强安全性。我们在整个过程中都会为他们提供协助。\n\
  \n对于希望采用更多“紫军”（purple team）方法的客户，我们将蓝队成员加入我们的行动中，或与他们并肩作战。我们将观察他们是否能看到我们的行动，并帮助他们调整工具，直到达到预期的最终状态。\n\
  \n这一切在项目的范围界定过程中都会安排好。\n\n### 关于编写良好的报告，有什么实用的建议？\n\n使用模板和报告生成工具。\n\n- 针对常见的评估设置模板报告。模板报告应包含有关评估方法的详细信息、最可能采取的操作列表，以及最可能使用的工具列表。这些内容应该是通用的。例如，工具列表应该包含经常使用的多套工具集。如果某个工具没有被使用，或者使用了但未列出，稍后在健壮的列表中添加或删除都会容易得多。\n\
  - 设置模板化的发现项（findings），其中包含通用的总结、通用的缓解建议以及详细的资源信息列表。红队通常会在多个客户和目标中发现共同问题。如果他们能从模板中提取这些问题并调整模板以满足该评估的特定发现，就能节省大量生成报告的精力。\n\
  - 调整所有模板，以描述在该评估期间发现的特定问题。由于大部分报告工作已经通过模板完成，重点就可以放在了该客户或目标特有的问题上。这防止了测试人员忽略那些他们能理解但客户可能不理解的问题。这让客户能够获得深入的信息，而测试人员不需要在每次评估完成后都将这些撰写一遍。\n\
  \n### 你如何确保你的程序结果对于需要完整叙述和背景的人来说具有价值？\n\n最重要的一点是回顾攻击方法，并展示攻击中哪些操作是有效的，哪些是无效的。记录良好的方法论将向客户展示尝试了哪些内容以及测试是如何开展的。攻击叙述将提供有关背景的细节，说明测试人员从哪里开始、到达了何处以及是如何到达那里的。\n\
  \n除了展示负面发现或漏洞外，突出正面发现也同样重要。正面发现将包括防止特定攻击的安全防御机制，以及蓝队检测到、响应并遏制攻击的时刻。\n\n### 除了指出不足之处，你如何建议改进安全措施？\n\
  \n指出漏洞是安全质量保证的第一步。构建缓解措施或修复漏洞是第二步。提供多种缓解或修复问题的方法非常重要，因为每个客户或业务部门都处于不同的状况。通常，我们会提供分级建议（立即执行以获得快速成效的事）和长期解决方案（解决根本问题并随时间推移防止进一步问题的事）。\n\
  \n如果客户或业务部门允许红队更积极地协助修复过程，那么围绕威胁建模、预算限制和优先级排序的讨论将能够在特定限制下提供最佳的安全。\n\n### 在招聘和面试红队成员时，你寻找哪些非技术性技能或态度？\n\
  \n那种审视一切并思考“这能如何被用来对付我？”以及“我能如何利用它对付别人？”的心态和方法。很多军人、黑客和罪犯都有这种心态。难点在于找到一个既有这种心态，又具备职业素养和良好技巧技巧的人■\n\
  \n# 38\n\nJayson E. Street\n\n> “如果你想获得一份非常棒的红队工作并成为一名高效的红队，请理解蓝队运作的所有细节，这将让你成为优秀得多的对手。”\n\
  \n![](img/StreetJayson.jpg)\n\n**Twitter:** @jaysonstreet\n\nJayson E. Street 是《Dissecting\
  \ the Hack》系列的共同合作者。他还是 DEF CON Groups 全球大使以及 SphereNY 的信息安全副总裁。Jayson 已就多种信息安全主题进行过演讲，包括\
  \ DEF CON、DerbyCon、GrrCon 以及其他几个会议和大学活动。\n\n### 你是如何开始红队工作的？\n\n我相信我一直有着红队心态，即使是在从事物理安全工作、巡逻新建筑或在新站点开始时也是如此。我总是会观察防御设施，并检查摄像头的位置是否正确，以确保周边界安全。我会确保门已锁好，并且没有绕过门的方法，所以我总是以那种心态思考——我会如何破入并成为那个坏人。直到职业生涯中期，我才真正开始担任正式的红队角色。当我开始关注物理方面时，部分是受到看到其他红队成员在会议上演讲的启发，我意识到：“哇，那是另一个我可以开始尝试的途径，”于是开始在我的组织内开展红队工作。他们非常支持，并让我做这些事情，这帮助完善了我的技能，并让我更有信心去真正追求它——这非常合适。他们的支持令他们受益，从长远来看也令我受益。\n\
  \n### 获得红队工作的最好方法是什么？\n\n我认为获得红队工作的最好方法是从蓝队开始。我总是告诉人们红队工作很有趣，而且出于某种原因，我们让这一切听起来就像他们是很酷的人，比如：“噢，看这些人正在闯入并偷东西。他们正在入侵网络并下载所有的核心资产。”这确实很酷，但我认为如果你了解防御是什么、防御者如何思考，以及防御是如何制造、构建和监控的，你就无法成为真正优秀的红队。我确定大家都在讨论获得工作的不同方法和面试地点，但如果你想成为一名优秀的红队，请忘记这些部分。如果你想成为一个在该领域非常出色的人，请从蓝队开始做防御者的工作。学习他们的流程，学习他们如何升级问题，学习他们在监控什么，以便你绕过他们。如果你想获得一份非常棒的红队工作并成为一名高效的红队，请理解蓝队运作的所有细节，这将让你成为优秀得多的对手。同时，你成为更好的对手将为客户带来价值，因为红队的作用实际上是评估并帮助蓝队。\n\
  \n### 为什么我们对什么是红队无法达成一致？\n\n\n\n\n我完全没有头绪。我想是因为每个人对于红队应该是什么样都有自己的理想。我已经描述过红队了，我会再说一遍——我认为红队不仅仅是渗透工作中的一个物理层面；我认为它也是基于网络的。我相信红队对抗（Red\
  \ Teaming）与渗透测试、漏洞评估或审计之类的工作是不同的。这是一种对抗性的思维方式。你仍然必须遵守与客户达成的约定范围，但这是一个更具对抗性的角色，你正尝试通过模拟真实攻击者的行为并入侵网络来跳出固有框架进行思考。这不仅仅是启动\
  \ `Nmap` 扫描查看他们是否暴露了端口，或者运行 `Nessus` 扫描。这其实实是进入内部并寻找创建载荷的方法，发送一个受感染的 PDF，或者在停车场留一个\
  \ USB 盘。你必须像对手一样思考，而且当你把报告交给他们时，蓝队团队将从这些信息中获益。\n\n### 信息安全其他领域对红队哪一点最不理解？你听过的关于红队、蓝队或紫色队最具危害性的谎言是什么？\n\
  \n我认为红队忘记的最主要的一点之一是：他们的存在仅仅是为了造福、帮助和改进蓝队，仅此而已。没有其他意图。红队的唯一功能就是让蓝队变得更好。我要为最后排的人再强调一遍——红队成员只为蓝队而存在；他们不是独立的，也不存在于一个独立的领域去进行审计，或仅仅为了展示哪里坏了。他们的工作是促进整个公司更加安全，通过向蓝队提供关于缺陷和差距的信息来指导他们，并向他们如何加固和修复这些问题。\n\
  \n我认为最具危害性的谎言是，红队、蓝队或紫色队之间存在很大差异。归结底，我们都应该在同一个团队中——即努力让事情变得更好、更安全的团队。我们执行的功能不同，但我们都在同一个团队里。当公司比我们开始之前更安全时，我们最终都赢了。\n\
  \n### 你应该在什么时候向组织的安全计划中引入正式的红队？\n\n衡量你准备好进行红队评估的最大指标之一，是你知道你所有的电脑在哪里。拥有一套完整的资产管理计划。知道当网络上出现新机器时（尤其是不该出现在那里的机器）如何对其进行报告并进行调查。如果一个组织甚至连这部分都无法管理，他们该如何检测别人进入、在网络上放置新机器并开始进行回连？\n\
  \n其次，如果你没有实施适当的补丁管理系统来确保机器已打补丁，而又想让红队进入并对他们的网络造成破坏，那是不对的。你需要一个完全整合的运行的网络部门、IT 支持部门和信息安全部门。你们必须共同沟通，共同良好组织，知道如何合作，并共享来自你们拥有的不同设备的信息和警报。你需要能够检测到所有这些事情，并以一种更有利防御的方式进行报告。因为如果你无法搞定这部分（大部分是策略、流程、理解和发现），那么你还没有准备好接受红队。\n\
  \n### 你如何向不情愿或非技术性的客户或组织解释红队服务的价值？\n\n我认为向不情愿或非技术性的客户解释红队任务价值的最佳方法非常简单。我们需要停止像预期会被诚实罪犯攻击那样的构建防御措施，然后像预期攻击会发生发生那样去检查它们。很多防御者构建、许多程序员都是为诚实的人编写程序。锁能挡住诚实的人，但挡不住罪犯。我见过很多网络原本非常棒，直到一个“心怀坏意”的人能够像罪犯一样思考——像对手一样思考——而发现了一个漏洞。\n\
  \n### 你看到的性价比最低（投入产出比最低）的安全控制措施是什么？\n\n你网络上的任何设备。无论是 `IDS`、`IPS`、防火墙、`WAF` 还是其他什么，如果你在网络上有了这些设备，但你没有花时间理解你环境的签名基准是什么，或者如何针对你的网络进行定制化配置，那么这就是最糟糕的事情之一，那是浪费钱。那是往门外扔钱。我见过很多人安装了\
  \ `IDS` 系统，但他们没有进行调优；因此，每个人都忽略任何合法的签名，因为他们认为那只是另一个误报。你必须配置这些设备，以便当有人看到警报时，他们会认真对待。\n\
  \n### 你是否建议过不要进行红队任务？\n\n我确实有一个故事，在红队任务的第一天中午，我去找了公司的 CEO，告诉他我无法继续了。我先从对目前的情况进行初步观察开始，这在任务正式开始之前。我告诉他，从良心上来说，我无法对他进行红队测试，他需要把要给我的钱拿去聘请一名网络顾问或新的网络管理员。他们目前的网络管理员把所有都放在了一个\
  \ `10.0.0.X` 网络中，而且没有 `DMZ`。这是一个完全扁平的网络。邮件服务器和 Web 服务器网络上的任何人都可以访问！所有人都在同一个网络上，包括访客\
  \ Wi-Fi。\n\n### 最重要或最容易实现的、可以防止你破坏系统或网络的控制措施是什么？\n\n我知道这像在重读记录，知道也有人喜欢为此争论，但如果你有一家中小型企业，预算小且员工少，那么你至少能做的事就是打补丁。\n\
  \n## 为什么你认为遵守行动规则（Rules of Engagement）至关重要？\n\n因为我不喜欢坐监狱！如果你在执行任务时偏离了脚本，你可能实际上对损害以及你不应该收集的信息负责。你可能入侵了你不该入侵的东西。你可能在扫描或进入另一个网络。我有些朋友说过，他们在某些任务中实际上破入进入，并发现自己在一个网络上。结果在进一步侦察后，发现那并不是他们应该进入的网络；他们弄错了\
  \ IP 地址，实际上入侵了另一家公司。你必须确保自己遵守行动规则。理解你的范围是什么，即使范围很窄，你也必须留在客户设定的界范围内，因为这能为你提供免受任何法律责任的保护。只要你在任务参数范围内，你就是安全的。\n\
  \n\n\n实际上，在我的所有任务中，我都会尝试让自己至少被“抓到”一次，甚至多次。我总是将其视为一种学习经历。这是一件好事，而且当你完全没料到它会发生时，效果甚至更好。这值得庆祝。你应该为他们感到高兴，因为他们正在做他们应该做的事。他们所做的一切都是正确的，而这正是你希望看到的。你不应该仅仅试图寻找他们的缺陷；你应该观察他们擅长什么、做对了哪些地方，并确保将这些内容也记录下来。庆祝这些胜利吧，因为他们做得很好。所以，当你被抓到时，你必须确保这种态度能够传递下去。你不应该怀有恨，比如：“噢，该死，你在这件事上抓到了我，但我在这儿抓到了你。”不，而应该是：“做得好。干得漂亮。可以告诉我名字吗？我好给你表彰。”在很多这类报告中，有太多的人、太多的案例必须审视他人犯的错误。请确保给他们一些可以仰慕的东西，确保给他们一个可以仰榜榜样。打俗说，这让药更容易下口。\n\
  \n### 在执行指定任务期间，你经历过的最大伦理困境是什么？\n\n我认为我面临的最大伦理困境是伤害别人的感情。这对我来说很难，而且让我很困扰，因为我在撒谎。我在向人们撒谎，告诉他们我在这里是为了帮助他们的网络运行得更快，或者我那里是为了给他们新设备。我的意思是，我曾亲口告诉某银行的一位经理，我要重整他的整个分行并给他们所有新设备，而当我在任务结束时告诉他我在撒谎时，我感觉就像踢了一只小狗一样。我的意思是，那哥们儿以为是圣诞节，而我却告诉他们没有圣诞老人，因为我“开掉”了他，这太糟糕了。我现在对此仍然感到非常内疚。\n\
  \n## 红队是如何协作完成任务的？\n\n通常进行网络测试（或几个人共同进行基于网络或基于物理的攻击）的人就是红队。对我来说，红队工作是与蓝队合作。这是一种协作。公司聘佣红队不是为了闯入并造成破坏，或者为了展示哪里可以造成破坏，甚至不是为了展示所有的漏洞。那并不是客户付钱的真正目的——他们付钱是为了报告，以及在事件结束后与你们进行的协作。你是在向他们展示哪里需要做得更好，哪里表现得很好，以及如何修复并使其完善。这才是他们付钱的原因。你拿钱不是为了破坏它；你通过向他们展示如何修复来赚取薪水。\n\
  \n### 在任务完成后，你如何对蓝队进行事后简报和支持？\n\n我处理事后汇报和支持蓝队的方法非常简单。在开始之前，我会一开始就告诉他们，我不是对手。我是一个倡导者，旨在帮助他们变得更安全。我向他们保证，当我完成工作后，他们会从中受益。他们将获得管理层的关注，以了解他们哪里需要更多支持和资金来修复问题，让事情按照应该有的进行。他们可能已经说了很多年，但没有人听过他们。在这方面，我是他们的倡导者，我在甚至开始之前就会确保他们理解这一点。所以当我们对蓝队或任务进行事后简报和支持时，他们已经理解彼此没有隔阂。在某些情况下，当人们发现进入系统如此简单时仍然会感到有些难过。但归根结底，他们仍然理解你是来帮助他们的，而你总是以这种方式对待问题。\n\
  \n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\n在我的情况下，第一步会是：“如果转回蓝队，我会怎么做？因为我最初是从蓝队开始的。”我想我要做的第一件事（再次强调一个重要的一点）是对我们网络上的所有设备进行评估。我会检查我们当前的补丁状态。我会进行全面的库存清点，并在所有以不同方式对信息安全承担部分责任的主要部门之间建立开放的对话。然后，我会让用户加入，让他们理解他们也是信息安全的一部分！我还会创建一个全面的安全意识团队，因为我也认为这非常重要。\n\
  \n关于 关于编写优秀的报告，你有什么实用的建议？\n\n我确实认为是“如何不写好报告”的专家！我不怎么擅长写报告，但我认为这是红队任务中最重要的部分。你聘佣的人与目前所有攻击你网络的人之间，唯一的区别在于，你可以从你聘佣的人那里获得报告。你是在为报告买单。所以，它最好是一份优秀的报告，并且值回你投入的所有钱。如果你给我的报告只显示你破坏了什么、你是如何破坏的、关于\
  \ `CVE` 的所有细节，或者你破坏它的各种方式以及你是如何绕过控制的，那么，你就浪费了我的时间和金钱。你必须向客户展示改进它的方法、修复的方法。\n\n###\
  \ 你如何确保你的项目结果对那些需要完整叙述的人有价值？\n\n每当我执行任务时（再次提到，我做的是安全意识任务），我的目标不仅仅是闯入并发现利用或漏洞；我的工作是在那里教人们发生了什么以及为什么很糟糕，所以我的价值与其说在于报告，倒不如在于我带来的教育。一旦我进入了某个地方，我会离开两分钟。我会带着公司里受信任的员工回来，向每个受影响的人解释我做的坏事。例如，如果他们让我进来了，我会解释那是件糟糕的事，以及他们如何被鼓励不再发生这种情况。我是他们的“接种疫苗”。我确保他们当时就理解了如何增强安全意识。这对他们是有价值的，因为他们学到了这个教训，而不是等到三个月后收到通知告诉他们：“嘿，三个月前发生了件坏事，这是你们做错的地方。”我当时就向他们展示问题所在。\n\
  \n**在招聘和面试红队成员时，你寻找哪些非技术技能或态度？**\n\n\n\n\n\n沟通、沟通、还是沟通，我说的不是一个技术人员与另一位技术人员之间的交流。你需要找到那些懂得如何与高管、普通用户以及任何人沟通的人。他们需要知道如何传达他们做了什么，以及是如何攻入系统的，并且能够将这些信息传给那些完全不知道\
  \ `Nmap` 是什么、`Nessus` 是什么或什么是零日漏洞（zero-day）的人。他们需要能够用每个人都能懂的语言解释如何解决这些问题，因为这才是真正的价值所在。如果你擅长破坏系统，但不能可靠地向客户说明系统是如何被破坏的、为什么需要修复以及如何修复，我并不在意你有多厉害。否则，你就是在浪费客户的时间。你必须提供这种价值。\n\
  \n### 在处理问题的方式上，优秀的红队成员与脱颖而出的特点是什么？\n\n理解每个客户在寻找什么，并给他们他们需要的，而不是他们根据错误预期所预期的。你必须能够理解客户请求的内容、他们的真实需求与他们的预期之间的区别。你还需要确保他们理解了这种差异。通过提供关于如何修复和缓解潜在威胁的可操作信息和行动情报来为他们创造价值。我认为这是优秀红队做的最重要的事情之一。他们管理客户的预期，并帮助他们理解现实世界中的对手是什么样的。最重要的是，他们帮助客户理解他们正在保护什么。你必须理解什么是让他们赚钱的以及如何保护这些。■\n\
  \n# 39\n\nChris Truncer\n\n> “叫我一个理想主义者吧，但我愿意相信大多数公司对红队的通用定义大致相同，但在细节上，我们可能都存在差异。”\n\
  \n![](img/TruncerChris.jpg)\n\n**Twitter:** @christruncer\n\nChristopher Truncer\
  \ 是 FortyNorth Security 的联合创始人兼进攻安全主管。他是 `Veil-Framework` 的联合创始人兼现开发者，该项目旨在弥合高级红队工具集与渗透测试工具集以及如\
  \ `WMImplant` 和 `EyeWitness` 等工具之间的差距。Chris 开发的工具不仅为进攻社区设计，还能增强防御社区防御网络的能力。\n\n\
  ## 你是如何开始红队生涯的？\n\n我认为帮助我进入进攻安全领域，以及进入红队的最大因素是参与了 CTF（夺旗赛）。当我刚开始时，我并没有任何进攻安全经验，但在我家里电脑上练习使用这些工具，并想在\
  \ CTF 中测试我的所学。我仍然记得第一次在 `CarolinaCon` 参加的 CTF。我见到了那里的组织人员，我非常喜欢那些强迫我学习新事物的挑战。我很幸运地赢得了那个\
  \ CTF，并在开始申请进攻安全职位时，我把这写在了简历上。参加 CTF 并能够谈论自己在业余时间学到的东西，这证明了我热热爱这份工作，我相信这帮助我获得了第一份渗透测试员的工作，并最终成为了红队成员。\n\
  \n### 获得红队工作的最好方法是什么？\n\n用最适合你的方式展示你对行业的热情。你是否喜欢编写不同的工具来自动化某些任务，或者开发脚本来让你的工作更轻松？把它们放在\
  \ `GitHub` 或其他公共代码仓库上，并在简历中链接。你是否喜欢在实验室环境中测试战术（tradecraft）？写一篇关于你经验的博客，告诉我哪些效果良好，哪些很困难，并展示你的思考过程。在简历上附上你的博客链接。虽然这些只是例子，但你可以、也应该向你面试的人展示你对理解这个领域真的感兴趣。我们可以教任何人黑客技术，但我们无法教人们去关注。如果你能展示你的热情，你将比那些没有同样动力的人领先出一大截。\n\
  \n> “我们可以教任何人黑客技术，但我们无法教人们去关注。”\n\n## 人如何在不违反法律的情况下获得红队技能？\n\n现在有很多选择可以让任何人在不违反法律的情况下学习新技能。你可以从构建一台可以运行多个虚拟机的电脑/服务器开始，只需测试黑入自己的系统。`VulnHub`\
  \ 是一个社区构建的资源，人们可以在那里下载虚拟机并尝试解决每个系统提供的挑战。此外也有一些任何人都可以参与的付费选项，例如 `RastaLab` 和 `Hack\
  \ The Box`。最后，某些认证可以为你提供在红队行动时使用的基础技能，例如 `OSCP`。\n\n### 为什么我们对红队的定义无法达成共识？\n\n我认为这部分归因于教育以及缺乏行业定义的标准。从教育的角度来看，我遇到过客户来要求进行红队评估，但他们完全不知道自己在要求什么。通常，在讨论了漏洞评估、渗透测试和红队之间的差异之后，客户应该对这些差异有更好的理解，并很可能意识到他们实际上想要或不需要红队。另一方面，由于没有一个整个行业可以参考并使用的行业术语定义权威，我认为大多数公司的定义都会略有不同。叫我一个理想主义者吧，但我愿意相信大多数公司对红队的通用定义大致相同，但在细节上，我们可能都存在差异。\n\
  \n### 信息安全其他领域还有哪一点是不理解红队工作的？关于红队、蓝队或紫队，你听过最有毒的谎言是什么？\n\n\n\n\n我发现向客户解释红队价值最有效的方法，是向他们普及漏洞评估、渗透测试和红队评估之间的差异。每项服务都能为我的客户提供不同的价值，通过突出这些这些差异，我可以向他们展示红队如何帮助他们。例如，内部\
  \ IT 团队可能会从漏洞评估或渗透测试中获得最大的价值。这两者都能识别出其环境中存在的技术或配置问题，并提供不同的方法来帮助修复这些问题。内部安全团队或事件响应团队则能从红队中获得最大的价值。它让团队能够针对试图实现特定目标的有决心的攻击者，测试他们的检测能力和修复策略。当你与客户合作，找到他们真正想要的东西，并拆解每项服务的不同优势时，你就可以将两者结合，向客户解释其价值。\n\
  \n### 你见过的性价比最低（*least bang-for-your-buck*）的安全控制措施是什么？\n\n数据泄露防护（`DLP`）解决方案。我见过防病毒软件在阻止恶意应用程序方面的效果，比我见过\
  \ `DLP` 产品阻止敏感数据离开客户网络要有效得多。\n\n### 你是否建议过不要进行红队任务？\n\n经常如此。我有很多客户联系我，他们提出的第一个请求通常就是红队评估。在此时，我通常会开始询问一系列资格筛选问题，例如“你们有漏洞管理计划吗？”或“你们上一次渗透测试是什么时候？”或者“你们有事件响应团队吗？”很多时候，客户只能回答这些问题中的一个，甚至一个都回答不了。在这种情况下，我可能会开始描述进行渗透测试（或任何有助于实现其总体目标的措施）的好处，以帮助为红队评估做准备。\n\
  \n### 最重要或最容易实现的、能够防止你的系统或网络被攻破的控制措施是什么？\n\n虽然这可能不是最容易实现的，特别是如果你的员工习惯了拥有权限，但一种非常低成本的控制措施是移除用户在内部网络系统上的管理员权限。这需要内部人员妥计划并确保员工在工作站上拥有他们当前所需的内容，同时为员工提供一个根据未来需求请求变更的渠道。然而，这不需要购买任何额外的技术来实施。相反，它只需要建立支持这种做法的办公文化。\n\
  \n### 为什么你认为遵守交战规则（*rules of engagement*）至关重要？\n\n在为客户执行攻击性安全工作时，使测试具有法律效性的唯一项就是交战规则文档。除了这些，客户与你（或你的公司/组织）之间的信任是让客户持续回到你这这里的关系中的一个无形方面。如果你偏离了交战规则，特别是当由于未遵守交战规则而导致问题时，客户将将其视为对他们信任的违背，而这是他们在开始评估之前就已经明确列出的。\n\
  \n> “在为客户执行攻击性安全工作时，使测试具有法律效性的唯一项就是交战规则文档。”\n\n## 如果你在渗透测试或其他任务中被抓了，你是如何处理的？\n\n\
  在进行一次内部渗透测试期间，我发现一个系统通过 `HTTP` 运行着受密码保护的 `VNC` 服务器。经过几次快速猜测，我成功通过了 `VNC` 服务器的身份验证并获得了对底层系统的访问权限。一旦验证通过，系统显示了一个奇怪的，类似于照片的负片。屏幕上有一些我无法识别的奇特颜色和形状。在花了一点时间尝试理解我在看到什么后，我发现我可以将应用程序移到侧边并访问底层计算机（一个\
  \ `Windows` 系统）。我正是这样做的，打开命令提示符，进行了一些快速的主机侦查，并确定了该系统。在验证身份后，系统显示了……我断连接了系统（*Wait,\
  \ the source text seems to have a jump here* -> *Wait, it seems there's a jump or\
  \ missing sentence in the provided source text*）我断连接了系统。\n\n此后，联系人询问我们是否看到图像在组织内的每个房间电视上显示（这意味着每个人都能看到我将图像移到侧边，打开命令提示符并开始分析系统）。有了如此多的可见性，联系人告诉我们关于该图像没有在电视上显示，大约\
  \ 24 小时后。在我们大家小笑了几之后，我们帮助更换了该应用程序并将系统恢复到原始状态。\n\n### 在执行分配的任务期间，你遇到过最大的伦理困境是什么？\n\
  \n虽然不一定是伦理困境，但红队成员（或任何渗透测试人员）在查看员工数据时（为了寻找密码或评估期间所需的任何其他内容）可能会处于尴尬的境地，例如记录员工输入的按键、对员工的操作进行截屏或其他类似情况。员工（无论正确与否）通常会认为他们系统上的文件是私密的，他们输入的内容不会被看到或记录，因此他们可能会搜索或下载非常私人的数据。幸运的是，我还没有遇到过观察到如此猥淫的内容以至于我们必须向上相关人员汇报这些信息的境地，但我见过任何人绝对会希望保密的私密信息。这取决于客户是否信任你会做正确的事。除非数据需要报告，否则没有理由暴露私密数据。我会尽力维护客户的隐私，除非绝对必要。\n\
  \n## 红队是如何协作完成任务的？\n\n我认为红队的团队合作对于红队任务的整体成功至关重要。通常来说，进行红队评估的一个主要原因是让你的客户针对试图完成目标的持续性威胁，测试他们的检测能力和事件响应程序。在评估结束时（评估报告之外），红队和蓝队之间应该进行一次复盘（如果在评估期间未进行），并审查他们的检测能力和事件响应程序的有效性。如果你不在红蓝队团队之间进行开放式的讨论，客户就会失去从红队任务中学习的机会。报告本身也应该提供足够的细节，让内部的红队或蓝队人员能够根据报告中所记录的内容重建攻击路径。有了这种程度的细节，你的客户可以调优检测系统或桌面演练事件响应流程，以帮助检测和防止未来的类似攻击。\n\
  \n\n\n\n任何汇报会议（debrief）都应该是红队和蓝队之间一次完全透明的交流。如果你观察到了漏洞或攻击路径，但为了“未来之用”而没有报告给客户，那就是对客户的一种不负责任。报告中也不应遗漏任何蓝队可以用来检测红队行动的细节。在红队评估结束后，蓝队应该拥有多种改进或扩展其能力的想法，而不必担心缺少完成此所需的数据。\n\
  \n> “任何汇报会议（debrief）都应该是红队和蓝队之间一次完全透明的交流。”\n\n### 如果你切换到蓝队，更好地防御攻击的第一步是什么？\n\n我打算做的第一件事是实施应用程序白名单策略/解决方案，并将其部署在我的环境中。顶尖的蓝队正在这样做，他们对环境的保护也比未做的团队更好。部署应用程序白名单具有多重益处。首先，一旦配置得当，它实际上可以防止自定义恶意软件在你的环境中运行。当你的蓝队能够展示被拦截的感染或失败的攻击时，这是一个可以用来证明计划价值的胜利。其次，即使没有完全阻止所有恶意应用程序，应用程序白名单解决方案也可以为防御者提供遥测数据，这些数据可以被纳入\
  \ `SIEM` 或进行人工审查，以寻找潜在的恶意应用程序。我相信，应用程序白名单解决方案一旦部署，将为组织提供巨大的价值。我在大多数环境中没有看到这一点，可能是因为前期准备工作是一项巨大的工程。内部团队必须根据公司员工的需求，对其应用程序白名单配置进行彻底测试，以确保它不会阻止任何业务关键应用程序的运行。尽管如此，我很想找到一家在内部部署了应用程序白名单但又后悔这么做的公司。\n\
  \n### 关于编写良好的报告，有什么实用的建议？\n\n对我来说这是一个很难的问题，因为我认为你应该通过编写一份真正让客户印象深刻的报告来脱颖而出。如果他们看到你的产出并认为内容不足，你就对客户不负责任了。尽管如此，我认为一份好的报告至少应该包含几个部分。你的执行摘要应该包含针对任何对技术细节感兴趣的读者的高级评估信息。你应该包含评估逻辑、目标、高层发现和整体评估分析。另一个部分应该包含评估细节，我喜欢将其视为评估的经历。该部分的目标应该是提供足够的信息，让内部\
  \ IT 人能够重现你所采取的步骤并获得相同的结果。它应该包含使你的工作具有可重复性，并允许客户针对你的攻击路径测试修复方案的所有信息。最后（至少），你的报告应该包含一个发现/建议部分。这应该包括有证据支持的发现、对发现的描述、影响级别、发现存在的证明以及修复该问题的建议。为了在评估过程中帮助收集所有这些数据，我强烈建议你在整个评估过程中不断进行报告。这可以简单地在执行重要步骤时将截图添加到你的报告模板中，或者你每天可以花\
  \ 30 分钟实际编写报告本身。这将确保你拥有详尽记录你所执行工作所需的所有截图或任何其他证据。\n\n### 你如何确保你的计划结果对于那些需要完整叙述和背景的人来说是有有价值的？\n\
  \n我认为这取决于你如何进行报告工作，并确保你至少提供（如果不是总是执行）与关键利益相关者进行评估简报汇报（out-brief）。你的报告本质上应该包含所有允许内部蓝队遵循导致你执行某些攻击的过程的信息。此外，它应该包含允许蓝队能够重现红队所执行的攻击路径的路线细节。通过提供红队攻击周围的背景，你不仅仅是在说他们的计划或能力在某个领域存在缺陷。你是在展示攻击者如何通过提供引导你前进路径的背景细节来得出相同的结论。在这种格式下，它不仅仅是你（红队成员）“击败”了某种配置或技术；它有助于提供所有所需的信息，帮助你的客户变得更好并成功地防御他们的环境。\n\
  \n## 除了指出不足之处，你如何建议安全改进？\n\n我认为这需要你对评估期间发现的发现提供背景，并将对客户环境的知识与真实世界的攻击者能力联系起来。如果你只是说你客户的宝宝丑，你的建议将没有分量，你还可能失去一个客户。你需要为客户提供可以用来操作的输出，以帮助他们更好地保护自己。仅仅说某事效率低下不会引起积极的回应，可能无法激励他们修复问题。然而，如果你能讨论你在评估过程中观察到的现象，并说明攻击者理论上如何滥用他们当前环境的状态，你就让结果不仅仅是简单的红队对抗蓝队。你应该寻求建立一种对于修复你所发现的问题的共同利益，以帮助一切变得更安全。这样做可以帮助获得团队的认可，并为了大家的利益而做出这些改变，而不仅仅是修复单个配置错误。\n\
  \n> “如果你只是说你客户的宝宝丑，你的建议将没有分量，你还可能失去一个客户。”\n\n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n在面试红队职位时，我喜欢寻找三种非技术技能：他们的热情、与他人沟通的能力以及整体的团队工作能力。热情是第一。你可以教任何人成为成功的渗透测试员或红队成员，但你无法教或培养一个人那种让他们专注于理解新技术、解决新问题、完成脚本等问题的内在驱动力。在一个不断更新的行业中，如果没有学习的热情，我认为很难成功。沟通技巧和团队工作能力并列第二，因为我认为两者同等重要。我需要有人能够以技术或非技术的对话与客户交谈，并清晰、高效地沟通。最后，它被称为红*队*（team），因此，每个人都需要能够作为一个团队共同工作，以实现一个单一目标。不能进行团队工作绝对会破坏评估的流程并防止团队取得成功。\n\
  \n### 在不同方式解决问题方面，优秀的红队成员与普通人相比有何不同？\n\n\n\n\n\n我认为这归于激情和坚持，这两者在应用于解决问题时可以并肩作战。如果没有那种为了付出的额外努力并解决某个问题的激情或动力，个人可能永远无法实现他们本可以取得的成就。坚持这一点是不言自明的。我相信任何人会遇到的大多数问题都是可以解决的；只需要花时间去理解问题本身，并测试不同的理论，直到你发现解决当前问题的正确方法。如果没有对工作的激情，那种投入额外时间且在实现目标之前不放弃的坚持将无从。■\n\
  \n# 40 Carl Vincent\n\n> “聪明人就是聪明人；他们知道如何编写神奇脚本来完成惊人的事情，而蓝队成员可能比红队更擅长，因为他们对自己的环境了如指掌。”\n\
  \n![](img/VincentCarl.jpg)\n\n**Twitter:** @VYRU5\n\nCarl 从事专业信息安全行业已 10 多多年。他的专业技能组合涵盖了多个学科，包括但不限于红队行动、恶意软件分析、安全基础设施工程、无线评估以及用于攻击性安全实践的实用工具开发。作为专业和非专业黑客社区的持续参与者，他不断在可能的情况下投入个人资源进行研究，以推动进攻和防御安全技术的进步。在黑客和信息安全世界之外，Carl\
  \ 还是一个有成就的音乐家、厨师、手工烈酒蒸馏师、平面艺术家、慈爱的伴侣和父亲。\n\n### 你是如何开始红队工作的？\n\n作为一家小公司的安全顾问，我与两个同事/老朋友合作在一起，他们也想进入我所从事的这种全方位工作。我们最终说服了上级，让我们对一家大型科技公司的红队项目进行投标并赢得了。在取得巨大成功后，我们向上级申请开展更多类型的工作，但他们并不感兴趣，因为他们主要是一家\
  \ Web 公司，不想偏离那个核心市场。结果，我们三个人独立地将这段经历加入了各自的简历中，并开始通过社区寻求工作。我最终第一个获得公司录用的人。\n\n##\
  \ 获得红队工作的最佳方法是什么？\n\n获得*任何*工作（包括红队工作）最好的方法就是任何最终奏效的方法。同时敲开所有的门，尝试所有的路径，直到你获得一个。之后，你就可以带着你的经验找到真正让你心生共鸣的公司。\n\
  \n## 如何在不触犯法律的情况下获得红队技能？\n\n- 军方或军事承包商经验\n- 在从事红队的公司的任何攻击性安全子领域工作，并让同事帮助你填补经验空白，或者在可能的情况下让你进行“实随观察”（ride-a-longs）\n\
  - 不被发现\n- 专注于红队操作员所需的个人攻击性安全技能（例如参加 `CTFs` 或比赛）并从事初级红队工作\n- 成为面向业务的蓝队成员，这样你就可以与针对你组织执行行动的红队对接。在工作过程中，你将学习他们是如何做的，而且总可以在行动后约他们喝咖啡以进一步建立人脉。\n\
  \n### 为什么我们对什么是红队无法达成共识？\n\n因为真正的红队行动是昂贵的，通过误用这个词，我们行业可以告诉客户他们得到的是“廉价的红队”，从而向更多客户出售通用的攻击性安全服务。因为通过让这个术语模糊，行业销售团队可以使用“切，那不是真正的红队”作为借口来销售更多产品（即使他们的评估是正确的）。由于此时，这个术语已经被误用了足够久，以至于行业内的专业人士认为自己已经做了几年的红队工作，但实际上并没有。\n\
  \n## 信息安全领域的其他部分对于红队工作有什么不理解的？你听过的关于红、蓝或紫队最有毒的虚假信息是什么？\n\n紫队并不存在；安全的目的是确保业务流程。为了确保某些性，需要识别并修复风险。某些行动通过执行攻击安全演练（包括但不限于红队行动）为保障过程贡献。其他行动通过执行防御安全演练（即蓝队工作）为保障过程贡献。做两者被称为`安全`，这种“紫队”垃圾纯属胡说。\n\
  \n*颜色*，如红色、蓝色或紫色，指的是一种行动，而不是一个人。*黑客*和*信息安全专业人士*是身份；你上一次专业行动的分类并不是身份。\n\n红队的目的是发现你安全态势中的“未知的未知”（unknown\
  \ unknowns）；以任何透明度扫描已知漏洞都不是红队行动。渗透测试不是红队行动。漏洞评估不是红队行动。仅仅因为你使用了开锁工具和/或社会工程学并不意味着你的行动是红队行动（你想找的词语是*混合威胁评估*）。如果蓝队知道对手是谁，那么对抗模拟就不是红队行动。\n\
  \n## 你应该何时向组织的安全计划中引入正式的红队？\n\n当你的安全团队决定是时候投入资源发现其防御态势中的“未知的未知”时。（注意，我*没有*说是在你修复了所有小问题之后。当你认为你已经了解了所有小问题时，你就可以至少部署检测功能，并从红队中获得价值了。）\n\
  \n## 你如何向不情愿或非技术的客户或组织解释红队的价值？\n\n我工作过的红队公司的第一条规则是“始终针对威胁模型说话”。归根底部，每个组织都有领导者，他们知道他们认为的核心资产哪些会让他们彻夜难眠，而且他们可能是正确的。红队的目标就是证明这一点——要么通过攻破一系列与“核心”相比“并不那么重要”的东西，要么通过攻破某些没人认为重要的东西来展示恶意势力利用可能造成的破坏。归根结底，只要你针对组织的核心威胁模型说话，并持续关注发现影响它的未知的未知，人们就会理解你在说什么（至少在我的经验中如此）。\n\
  \n## 你是否曾经建议不要进行红队行动？\n\n\n\n\n\n几乎每一次都是这样。建议因客户的不同而异。最常见的原因是他们没有做 `threat model`（威胁模型），所以我告诉他们的所有内容都将是某种“未知的未知”。在这种情况下，我会向他们解释，他们试图去“测试”某些东西简直是在浪费钱，因为他们需要做的是先建立一个运营安全模型，然后我们就可以再回来“痛击”他们，向他们展示他们没有考虑到的问题。\n\
  \n## 最重要或最容易实现的、能防止系统或网络被攻的控制措施是什么？\n\n2FA（双因子认证）、具有实际覆盖范围的良好出站代理（不要忽视 VoIP 网络）以及\
  \ `802.1x`。随着云端资源的日益普及，`802.1x` 变得越来越无关紧要，而 VoIP 网络正在变成公司手机套餐，这两者都是好事，意味着可以用列表中的最后两项改为\
  \ `MDM`（移动设备管理）或类似的替代方案，但 `2FA` 对于攻击者来说通常总是耗费时间的。\n\n## 为什么你觉得遵守行动规则至关重要？\n\n嗯，短的答案是，因为如果不这样做，你就违反了签署的聘用协议，并且从定义上来说，你是在违法。即使你不在乎坐监狱，这也会让你面临诉讼风险，并让你的保险供应商不悦。\n\
  \n长的答案是，因为那样你就没有在履行你的职责。如果你坚持对变电站进行 `nmapping` 并导致电站停电，他们损失的业务比你通过服务为他们提供的安全保障要多得多。通过\
  \ Web 应用程序干扰生产用药物机器人并在每个人的药片里加入钾，仅仅“因为你可以”，那么你就杀死了一群人，因为那些鬼东西在任何医疗人员来得及之前就会杀死他们了。对核反应堆的\
  \ PLC 实施零日漏洞攻击，嗯，类似于斯特克斯网络病毒（Stuxnet）之的事。引起任何这些问题都不会让组织更安全，而这恰恰是你唯一的工作。\n\n## 如果你在渗透测试或其他任务中被抓了，你是如何处理的？\n\
  \n我有一次在任务中被抓了，当时与目标公司共用停车场的商家报警了（显然，一个高大粗壮的黑人男子和一个矮小瘦小的白人男子开着租来的车进入你们的停车场打电话是“可疑”的）。警察来了，由于我们经常出差，所以我们随身带着照照，当警察要求检查证件时，我们都提供了证件（诸之关于我是偏执的黑客，并且能给警察提供一份上面没有你地址的合法身份证明之类的）。天哪，他们对我们严厉训斥了一顿；我们最终给警察编了一个借口，说我们是“第三方审计员”，获得了“公司另一个分公司”的授权，并且正在“通过电话向上级汇报为什么被拒绝入境”（这在技术上其实是真的，因为我们其中一个人被对面的那家打了报警的公司屏蔽了，而我们正在联系我们的后方支持来构思下一步计划）。他们最终相信了，但搞笑的是，警察没有对目标公司说任何话，所以从所有角度来看，我们仍然是安全的。我们最后回到酒店，与后方支持一起处理植入（implant）的工作，并在第二天晚上利用某些荒诞条件下的疯狂黑客技术进入了内部，但那是另一个故事了（去网上问关于“黑圣诞老人”的事）。\n\
  \n## 在执行指定目标时，你遇到过最大的伦理困境是什么？\n\n我不确定如何量化“最大”，因为它们都如此不同。\n\n* 多次出现活跃入侵的证据，并浮出水面，而相关的组织明确告诉我他们不会披露；这包括拥有和/或控制整个技术细分市场的大型公司。\n\
  * 我曾做过一次 Web 评估，发现该应用程序的“备注字段”被用来存储所有敏感数据，因为员工不想处理应用程序中“安全”的部分。通过开放互联网猜到的一个默认凭据，我进入了一个满了所有人个人信息（PII）的屏幕，从沙特阿拉伯王子到美国前总统和国会成员应都有。除了政府之外，还有高知名的嫌疑犯、主要的国际大巨星、贸易市场上的金融巨头，你能想象到的都有。登录是太简单了，以在我开始操作几小时后，我就将其报告为可能的后门账户，该网站立即下线了，再也没有上线过。直到今天，我不知道那个网站或其附属机构发生了什么，但他们预付了钱，所以我老板从未向我追问过任何答案，我也从未给过他答案。\n\
  * 我为一家公司执行过两次行动，该公司为那些被认为如果绑架或捕获会对组织构成极端风险的个人提供某种跟踪服务，作为执行测试的功能，我必须证明当他们声称在某地时，我知道他们在哪里。在其中一个案例中，该个人在一个组织高层领导为人知的妓院里，但（显然）他的妻子不知道，另一个目标是一个同性恋女性，我必须揭露她的性取以提供证据。那不是我最开心的一天。\n\
  * 我做过一次任务，在被破解的邮箱账户中发现了儿童色情信息。那不是一个愉快的一天。\n* 我在被破解的系统中发现的 `credentials.txt` 类型文档中，遇到过无数\
  \ Ashley Madison（约会网站网站）的 BDSM 照片或账户。\n* 我曾让一家公司倒闭。那次渗透测试针对的是一家目标公司，该公司由另一家公司拥有，而那家更大的公司才是我的实际客户。我在由第三方供应商制造的一些关键软件中发现了一些漏洞（我后来发现这些软件被该行业内\
  \ 90% 以上的公司使用），目标公司上级两级的公司（即我的客户）在为期两周的任务的第一周结束时告诉我，我可以完成报告，以便向我的老板展示我是如何度过时间的，但在查看了我的关键漏洞后，该公司的收入不足以承担修复第三方产品带来的潜在法律风险，他们将直接关门。我完成了工作，目标企业在\
  \ 30 天后真的关门了，但在此期间，我必须在这栋办公楼里走动，那些友好的人会给我带咖啡、茶和聚餐用的自制食物；这很难受。\n* 我在一次银行任务中报告过一个漏洞，他们当着我的面从隔间里拉出一个男人并当场解雇了他，他哭了，从钱包里掏出孩子的照片。显然他在那里工作了几乎\
  \ 30 年。\n* 我经常在想是否应该向各自的董事会举报那些有严重毒瘾问题的高管。\n* 我曾向一家公司报告过一个第三方产品的漏洞，结果公司决定没必要通知供应商该漏洞，而是直接更换了产品。几年后，该供应商被一家国防承包商收购，该承包商将该公司已知的所有漏洞都卖给了一个“政府”，该政府后来被联合国指控犯下人权罪。直到后来我通过新闻报道才知道收购他们的公司拿了该公司已知的所有漏洞并卖给对方，其明确目的是为了追踪在该客户运营国家内的活动人士及其家属并杀掉他们……他们确实杀杀了。\n\
  \n\n\n\n\n*   在会议室里，一个女性在开始演示发现结果前，当着我的面扇了我一个耳光，抓住了我，然后按住我的左侧屁股，直视我的眼睛并响了一下嘴唇。这很尴尬，尴尬倒不是因为活动本身，而是因为会议剩余的所有参与者都是女性，而且她们似乎完全不在意。她们还花了一段时间用一种我听不懂的语言发表了一些似乎是关于我的评论。从好的一面来说，这比我通常得到的女性关注要多，所以我想我应该感谢吧？\n\
  \n*   我目前知道（由于一项约定）一个漏洞，某位在全球范围内大规模分发产品的制造商正在利用该漏洞而不是修复它，以便通过一些在技术上合规的数据转售商将访问权限出售给情报机构。我与那公司的\
  \ `NDA` 最近已经过期了，但如果我说了些什么，客户公司本身是否会追究我，这还处于“灰色地带”。\n\n## 红队是如何协作完成任务的？\n\n有效的红队行动之所以能够发生，是因为团队的协作，而不是个人——事实如此，没有任何例外。无论是有人充当“首席执行官”接电话，还是在你撬锁时担任守哨员，或者在你在建筑内走动时有人监控被攻破的安全摄像头，甚至仅仅是为了获取网络覆盖——是团队让行动得以实现。\n\
  \n> “有效的红队行动之所以能够发生，是因为团队的协作，而不是个人——事实如此，没有任何例外。”\n\n即使是进行通用的渗透测试，我也从未待过任何一家在遇到困难时不在顾问之间分享技巧就无法有效运作的机构，我参与过的所有优秀且最高效的团队都在不断、几乎是强迫性地分享。这就是为什么工作如此有成就感的原因之一；这就像在\
  \ `Slack` 上与你最常出入的某种骗局圈中最聪明的那些一起坐五天，让他们帮助你解决问题，并为此你获得报酬。\n\n## 在任务完成后，你进行事后（debriefing）和支持蓝队的方法是什么？\n\
  \n通常我的准则是保持灵活。归根结底，红队的产物是知识，所以从本质上说，你付钱是为了教学，而一个好的老师总是根据学生调整自己的交付和风格。我发现获得优秀结果的一种绝方法就是保持谦逊，并记住作为红队队员，我是一名专家；我非常擅长一件事，那不是他们擅长的，但他们是他们所在领域的专家。通过我带着目标进入帮助他们学习我的专长，而不告诉他们如何做他们擅长的事情，我们都能在所要做的事情上取得成功。\n\
  \n从更通用的观点来说，我总是发现以最适合客户的格式交付数据更好。如果没有人读报告，为什么要写报告呢？演示对你的团队是否更有效？我们是否应该进行一次为期两天、每天四小时的跟进课程？也许我只需要带上一些锁和一堆\
  \ `RFID` 设备，然后举办一种工作坊。归根结底，这只能意味着我赚更多钱，因为目标组织认为如果他们付我更多小时费，我可以提供更大的帮助，嘿，启蒙的自利总是有值得称道的。\n\
  \n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\n事实上，就在几周前，我恰恰这么做了。我的计划是提醒自己不要害怕“弄脏手”。作为红队队员，你构建自己的工具，因为你所做的事情通常不是你为了实现目标而滥用的任何技术的“批准用途”，所以你会花费大量时间把各种东西拼凑在一起。但在我看来，蓝队队员倾向于不这样做，特别是在那些已经建立了“如果不扩展到企业级，否则无法办成”文化的公司里。显然，如果那是你的业务用例，那么这种方法没有问题。\n\
  \n\n\n\n\n*   这绝对是我会称之为“企业自给自足”。作为一个试图在行业中“成长”的“菜鸟”，我确实学到：在十之九的情况下，那些按时提交报销单、填好表格且不会让他们的项目经理（PM）处处奔波要报告的员工，才是那些会被信任负责酷项目的人。归根结底，如果你让别人的生活变得困难，他们就不会希望你参与到某些事务中。\n\
  \n## 在处理问题方面，优秀的红队成员是如何从群体中脱颖而出的？\n\n归根结底，一个优秀的红队成员只是理解了：除了这项技能的技术本质之外，信息安全专业人员是那些理解在安全语境下信息价值的人。是的，我们人类现在使用计算机在全球范围内排序和传输这些信息，并将其归入不同的类别，但如果明天所有人停止使用计算机，信息仍然具有价值，因此需要被保护。\n\
  \n既然如此，优秀的红队成员是一个理解其核心职能的信息安全专业人员——即通过混合威胁告警模拟来定位目标现有威胁格局中的“未知的未知”。这种核心动力驱动了所有其他事情——投入个人时间扩展知识库的欲望、参加社交活动并向他人学习的动力，以及在新的技术在行业内流行时保持领先的意愿。\n\
  \n作为顾问，我非常庆幸能做的主要事情之一是从我攻访的客户那里学习，特别是在他们表现良好的领域。我们不是蓝队；我们提供防御建议，但那不是我们的专长。看到他人公司“内部构造”的伟大之处在于，你可以看到他们做对了什么；下一次有人问你如何解决问题时，你现在就有了一个经过验证的、真实的、企业级的解决方案可以提供。■\n\
  \n> “作为顾问，我非常庆幸能做的主要事情之一是从我攻访的客户那里学习，特别是在他们表现良好的领域。”\n\n# 41\n\nGeorgia Weidman\n\
  \n> “资产管理是我们行业目前尚未完全掌握的一件事。”\n\n![](img/WeidmanGeorgia.jpg)\n\n**Twitter:** @georgiaweidman\n\
  \nGeorgia Weidman 是一位连续创业者、渗透测试员、安全研究人员、演讲者、培训师和作家。她在智能手机漏洞领域的工作曾在国际平面媒体和电视上报道。Georgia\
  \ 曾在世界各地进行演讲或开展培训，包括美国国家安全局（NSA）、西点军学院和 Black Hat 等机构。她获得了 DARPA 网络快速通道资助以继续她的移动设备安全工作，是\
  \ New America 的安全政策研究员。Georgia 还是 No Starch 出版《Penetration Testing: A Hands-On Introduction\
  \ to Hacking》的作者。\n\n### 你是如何开始红队工作的？\n\n大学期间，我参加了中西洋地区大学网络防御赛（Mid-Atlantic Collegiate\
  \ Cyber Defense Competition）。作为比赛的一部分，有一个红队，他们的工作似乎只是让学生们大哭流呕。比赛结束时，我知道我想做他们所做的事情！\n\
  \n从那里开始，我开始在安全会议和聚会上进行研究、发表演讲并举办培训课程。这最终让我接触到了正确的人，从而获得了参与红队的机会。\n\n## 获取红队机会的最佳方法是什么？\n\
  \n大学期间，我参加了大西洋地区大学网络防御赛。作为比赛的一部分，有一个红队，他们的工作似乎只是让学生们大哭流呕。比赛结束时，我知道我想做他们所做的事情！\n\n\
  从那里开始，我开始在安全会议和聚会上进行研究、发表演讲并举办培训课程。这最终让我接触到了正确的人，从而获得了参与红队的机会。\n\n## 为什么我们无法对红队达成共识？\n\
  \n大学期间，我参加了中西洋地区大学网络防御赛。作为比赛的一部分，有一个红队，他们的工作似乎只是让学生们大哭流呕。比赛结束时，我知道我想做他们所做的事情！\n\n\
  从那里开始，我开始在安全会议和聚会上进行研究、发表演讲并举办培训课程。这最终让我接触到了正确的人，从而获得了参与红队的机会。\n\n## 如何如何在不引起麻烦的情况下获得技能？\n\
  \n大学期间，我参加了中西洋地区大学网络防御赛。作为比赛的一部分，有一个红队，他们的工作似乎只是让学生们大哭流呕。比赛结束时，我知道我想做他们所做的事情！\n\n\
  从那里开始，我开始在安全会议和聚会上进行研究、发表演讲并举办培训课程。这最终让我接触到了正确的人，从而获得了参与红队的机会。\n\n## 什么时候应该在组织中引入正式的红队？\n\
  \n根据我的经验，许多组织过早引入了红队，结果浪费了资金。你不应该支付红队的价格来寻找缺失的补丁、默认密码和类似的低挂果实。先申请让你的组织进行漏洞扫描，或者更好，购买一个漏洞扫描器并作为安全计划的一部分定期扫描你组织的\
  \ IT 资产。\n\n## 获取红队机会的最佳方法是什么？\n\n有一个红队，他们的工作似乎只是让学生们大哭流呕。比赛结束时，我知道我想做他们所做的事情！\n\
  \n从那里开始，我开始在安全会议和聚会上进行研究、发表演讲并举办培训课程。这最终让我接触到了正确的人，从而获得了参与红队的机会。\n\n当你认为组织的安全态足够稳健时，就应该聘请`红队`。任何人都可以使用软件包工具利用已知的远程代码执行漏洞。访问更稳健的组织需要更复杂的攻击者，因此对安全测试人员来说也需要更多的技能、时间和精力。\n\
  \n## 你如何向不情愿或非技术性的客户或组织解释红队的价值？\n\n我从来不是那种销售员。我的安全测试客户几乎全是主动上门的。现在我拥有一家移动安全测试初创公司，面临着双重困难：许多客户对安全测试的抵触，以及对将自带设备（BYOD）资产引入测试任务的焦虑。通常，测试是一种更难推销的产品，因为理想情况下，在任务结束后什么都不会发生，攻击者也不会攻入。这自然然比“我们的产品能阻止\
  \ 100% 的安全攻击”难推销得多，尽管后者是一个逻辑谬误。\n\n\n\n\n虽然一些更深入的移动威胁防御产品终于开始展现效力，但某些安全公司似乎仅仅是在它们\
  \ Windows 桌面杀毒软件的名称前加上了“移动”一词。随着移动设备从像 `iPhone OS 1`（包括浏览器在内的所有内容都以 root 权限运行）到目前可用最复杂的安全模型之一，即使是扫描文件系统中的恶意文件签名等基本任务，在移动设备上也无法正常工作——如今的移动杀毒应用通常被限制在自己的沙箱中。在极端情况下，某些移动安全应用只是简单地定期唤醒并检查自己是否是病毒，然后回到睡眠！\n\
  \n> “虽然一些更深入的移动威胁防御产品终于开始展现效力，但某些安全公司似乎仅仅是在它们 Windows 桌面杀毒软件的名称前加上了‘移动’一词。”\n\n\
  ### 你是否曾经建议过不要进行红队对抗测试？\n\n这种情况经常发生。很多客户联系我寻求红队测试或渗透测试，但实际上他们真正需要开始的是漏洞扫描，或者帮助制定一个基础的安全计划。尽管这意味着我的收入减少，但我总是会根据客户的需求引导潜在客户走向正确的方向。这种诚实往往让他们在未来准备好进行更严谨、报酬更高的测试时成为回头客。\n\
  \n## 能够防止你攻破系统或网络的最重要或最易实施的控制措施是什么？\n\n即使只有很少的预算，组织可以做的事情也很多。当然，购买漏洞扫描器对于发现攻击者容易得手的目标大有成效。其中许多工具都非常实惠。它们将帮助理出缺失的补丁、默认密码以及商业现成软件中的已知漏洞等，这些通常被攻击者用作初始立足点。\n\
  \n此外，一种几乎总能让我得手的攻击手段是 `LLMNR poisoning`，即我在网络上被动地收集哈希凭据。为了让这种攻击生效，我必须能够破解捕到的密码哈希并将其转换回明文值，这样我就可以与系统进行验证。无疑，密码复杂度仍然我们尚未解决的问题，但组织的\
  \ IT 部门可以下载并运行与安全测试人员和攻击者相同的密码破解软件和词表。向工具输入你的域名凭据，并要求任何密码在 `X` 小时内被破解的用户将其更改为更健壮的密码。\n\
  \n### 为什么你认为遵守约规则（Rules of Engagement）至关重要？\n\n自然，考虑到我们社会很大程度上如何看待黑客——认为他们是那种为了向竞争对手展示能力而不惜毁灭世界的犯罪头目——许多组织对于允许安全测试人员攻击自己的组织有着理解的抵触。在测试开始之前决定的约规则可以根据客户的接受程度保持严谨或宽松。\n\
  \n> “在测试开始之前决定的约规则可以根据客户的接受程度保持严谨或宽松。”\n\n违反约规则，即使你认为这会让测试更具真实世界的真实感，只会加深这样一种观念：伦理黑客只是拥有掩护工作的恶意攻击者。我们需要组织和整个社会对伦理黑客更加从，而不是排斥。在另一个不那么重要的点上，如果你想获得重复业务，如果你违反了范围，就可能无法获得，你甚至可能发现自己违反了合同并且无法获得所做工作的报酬。\n\
  \n### 如果你在渗透测试或其他任务中被抓到，你是如何处理的？\n\n当组织抓到现行时，我总是很高兴。当然，我使用行业标准方法来规避检测并绕过组织安装的防御技术，但许多测试人员似乎仅仅借此展示自己有多精英。如果一个组织抓到了我，这意味着他们的安全计划已经达到了捕获真实攻击者所需的水平。\n\
  \n这种情况并不经常发生，但在其中一次机会中，我正在执行一次基于电子邮件的钓鱼攻击。该网站与组织使用的某云服务仅差一个字母，它拥有 `SSL certificate`，且邮件看起来很正常。\n\
  \n### 如果你切换到蓝队，你的第一步将是如何更好地防御攻击的？\n\n\n\n\n\n我对蓝队深表敬意。在进攻方，我们只需要找到一个漏洞就可以攻入；而在防守方，他们必须保护好每一个环节。\n\
  \n> “我对蓝队深表敬意。在进攻方，我们只需要找到一个漏洞就可以攻入；而在防守方，他们必须保护好每一个环节。”\n\n在职业生涯之初，我在一家政府机构的内部安全团队工作。除了涉及的设备、漏洞等海量工作外，最困难的部分莫过于如何获得高层管理者的认同，以强制员工修复远程代码执行漏洞，即使该补丁会影响应用程序的功能。\n\
  \n在进攻方，当公司有预算并且认同我所做的事情时，我会被请进来。而在防守方，仅仅是修复那些存在安全问题的打印机，都是是一场持续的战斗。安全在预算中仅仅是支出列中的一个项目，而安全团队被视为那些讨讨厌的人，你只希望他们不要出现在你的办公室里。为了那些从事着安全领域最艰巨工作的防守者，我们确实需要在这方面看到文化变革。\n\
  \n如果我一切都失败了，发现自己又回到了蓝队的角色，我会做的第一件事就是处理识别组织内所有 IT 资产这项并不简单的任务。资产管理是我们整个行业尚未完全掌握的。我无法不清参与过多少次安全测试任务，在这些任务中我看到人们投入了大量的时间、资金和精力构建稳健的安全态势。但这一切都崩溃了，因为有一台很久以前就注销的旧机器，但没有人真正关闭它，所以它在储藏室后面已经运行了多年。那个系统已经久没有经过安全团队的审查，并且存在相应的漏洞。如果这台机器是一个旧的域控制器，且上面的域管理员密码与已更新并完整补丁的域控制器密码相同，那将特别有帮助。\n\
  \n### 在招募和面试红队成员时，你寻找哪些非技术性技能或态度？\n\n我不回避社交尴尬（此处并非双关语），因为我自己的社交能力也像块石头一样。但我寻找能够通过口头和书面形式对技术和非技术受众进行有效沟通的能力。我同样寻找对该领域的热情。我寻找的不是那种朝\
  \ 9 下 5、回家后整晚上玩视频游戏的人。我寻找的是那些正在安全研究并在会议上、通过白皮书或博客文章展示成果的人。我寻找的是那些尽管他们深谙网络安全，但如果对\
  \ Web 应用安全一无所知，也会主动寻找所需的资源和 `crackme` 应用来学习任何他们需要精通的技能的人。\n\n 在 在以方式解决问题方面，优秀的红队成员如何与众脱颖而出？\n\
  \n我认为最重要的是永不满足的好奇心和跳性思维。如果你在红队工作，你最终会遇到你不熟悉的技术，没有人针对这些技术在安全会议上做过演讲或发布过白皮书，而且没有公开的利用工具甚至没有\
  \ `CVE`。\n\n任何人都可以阅读手册、看几个视频，并在自动化工具上点击“开始”，但需要奉献和激情，才能钻研出此前未知的技术可能被用于破坏安全的方法，并在任务期间现场制定出成功的攻击方案。■\n\
  \n# 42\n\n亚姆·威拉德（Adam Willard）\n\n> “有人说红队就像是一个不受欢迎的派对客人，弄乱了酒店不打扫，还把责任推给别人。”\n\n\
  ![](img/WillardAdam.jpg)\n\n**Twitter:** @asw_sec\n\nAdam Willard 在很小的时候就发现自己对计算机的热爱。这始于组装电脑、平面设计和数字摄影。他职业生涯的大部分都在根据客户的业务需求编写软件，这导致他头撞在键盘上好几次青。是时候开始尝试新事物了，于是他抓住机会担任一个知名系统的应用程序安全分析师。Adam\
  \ 现在是多个项目的高级渗透测试员，并参与了几个漏洞赏金计划。他被这个行业吸引，并期待与下一代安全专业人士共同成长。\n\n### 你是如何开始红队工作的？\n\
  \n通往今天的道路是漫长的。我的职业生涯始于软件开发，转向代码审查，然后成为渗透测试员，如今与一个优秀的团队在蓝红双方共同工作。\n\n在早期，我很幸运，能够在代码审查和渗透测试之间坐在\
  \ `SOC` 里，访问他们所有的工具并在需要时切换身份。在转型为渗透测试员期间，我被允许完全访问 `SIEM`、`Splunk`、Web 应用防火墙以及其他几项让我看到发生状况的设备。这让我能够确保我的流量不显眼且难以被追踪。\n\
  \n这就是我所在公司对红蓝队最佳定义的开始。我不会说我们作为红蓝队的运作是满负荷的；然而，我们已经走得很远了。\n\n## 获取红队工作的最佳方法是什么？\n\n\
  问。我们团队中各种背景的人才都取得了巨大成功。有些人来到这里留下了足迹后离开，而有些人仍留在我们这里，每天为团队做出贡献。我们甚至从自己的蓝队中“偷”过他们。\n\
  \n## 人如何在不违反法律的情况下获得红队技能？\n\n有很多程序可以让你测试渗透测试技能，例如夺旗夺赛（CTF）或漏洞赏金计划。你可以利用漏洞赏金计划来确保你提供的是最好的报告。行业内还有一些活动为团队提供了友好的竞争。\n\
  \n### 为什么我们对于什么是红队无法达成共识？\n\n我理解这让攻防变得更容易；你做这个，他们做那个。我们失败 true 之一是把彼此置在孤岛中。我们团队成员的责任之一是尽可能提供解决方案。\n\
  \n\n\n\n\n> “有时应用程序处理我们有效负载的方式出乎我们的意料，而我们不知道这些东西最终流向何处。当这些问题发生时，记录它们是非常关重要的。”\n\n\
  ## 你认为性价比最低的安全控制措施是什么？\n\n自动化扫描器。我之所以这么说，是因为无论报告如何写，实施这些结果至少需要两个团队：一个团队负责审查问题，另一组人员负责实施修复。如果你只是运行一个扫描器而对结果不进行任何处理，那完全是浪费精力和金钱。\n\
  \n对自动化扫描器的依赖。诚然，它能为你的活动建立基准，但它也会在你的蓝队工具的工具中产生不必要的事件。剔除这些活动并消除误报需要时间。基于已知红队行为的自动化扫描器并不一定是在利用漏洞。\n\
  \n### 为什么你认为遵守交战规则（Rules of Engagement）至关重要？\n\n我们都喜欢挑战自己的边界，但在执行任务期间可能会导致很多问题。很多时候，由于客户签署的服务条款的归属问题，组件可能会出现偏差。即使我们看到了某些可利用的漏洞，我们也没有权限进行攻击。你完全可以写报告来说明为什么范围之外的问题是一个真实的问题。\n\
  \n> “我们都喜欢挑战自己的边界，但在执行任务期间可能会导致很多问题。”\n\n## 红队是如何协作完成任务的？\n\n我非常有幸与之工作的团队拥有广泛的人才和多样的背景。我们可能正在攻击系统寻找下一个可利用的漏洞，但当我们遇到障碍时，我们都准备好跃手帮助。我们负责编写发现结果，但也有相应的流程让我们利用某些方面，例如分步程序。我们的负责人查看报告或要求澄清，然后将其汇总给业务所有者。至于蓝队，我们的团队也曾在该围栏的那一边，通过沟通确保我们在整天范围内保持联系。\n\
  \n### 如果你转到蓝队，防御攻击的第一步是什么？\n\n关闭数据中心并离开。在我职业生涯的某个阶段，我可以使用与 SOC 相同的相同的工具。当我进行测试时，我会监控自己以确保不被发现。这样做让我们能够建议其他增加被发现概率的方法。我建议的之一是让蓝队成员与红队坐在一起，讨论他们如何进行某些活动。仅仅监控流量并让分析师洞察为何会使用某种技术。\n\
  \n> “我建议的之一是让蓝队成员与红队坐在一起，讨论他们如何进行某些活动。仅仅监控流量并让分析师洞察为何会使用某种技术。”\n\n## 关于编写优秀的报告，有什么实用的建议？\n\
  \n整个社区已经完成了大量工作。有一些框架可以帮助保持一致性和重复性。你可以加入赏金社区，练习寻找漏洞和编写报告。如果你想让你的漏洞被接纳，你就需要提交高质量的报告。某些程序并不一定把钱给给发现漏洞的人，而是奖励为该漏洞提供最佳报告的人。我注意到，当我们使用视频时，写报告就会变得很懒。我们的视频展示了分步操作的过程以及我们为什么那样所的注释；然而，当需要重新测试时，报告正文中缺少了一些关键组件，这会花费更多的时间和精力。在提交报告之前，问问自己：如果你从未见过这个发现，你能重复它吗？它逻辑通顺吗？\n\
  \n### 你如何确保你的程序结果对于需要完整叙述和背景的人是有价值的？\n\n我们有一位能力出色的负责人来监督我们。我们的负责人与团队以及业务所有者一起不懈地工作。我们的报告发现有一套定义良好的分类和标准术语。然后我们在高层说明为什么存在特定问题，接着我们详细讲解漏洞。\n\
  \n### 除了指出不足之处，你还建议哪些安全改进措施？\n\n跟上当前的攻击向量。无论是人为攻击还是网络攻击，了解正在发生的事情可以提高安全态势。\n\n###\
  \ 在招募和面试红队成员时，你寻找哪些非技术性技能或态度？\n\n对细节的关注和清晰沟通的能力。沟通，无论是通过如何利用漏洞的逐步说明，还是仅仅在日常对话中，都能让我们每个人互相了解对方。能够适应对话环境并理解其他团队成员至关重要。作为红队，我们可以进行掠夺并乐在其中，而蓝队则在试图弄我们在做什么。在事后甚至在任务执行期间清晰地沟通对所有人都有益处。■\n\
  \n# 43\n\nJake Williams\n\n> “当人们开始意识到红队模型提供的价值与渗透测试不同时，营销人员利用这一点进行差异化竞争，并造成了许多困惑。”\n\
  \n![](img/WilliamsJake.jpg)\n\n**Twitter:** @MalwareJake\n\n信息安全专业人士。编写糟糕软件的破坏者。事件响应人员。数字防御者。业务双语人才。Jake\
  \ Williams 将信息安全视为希波克拉底誓言：首先不伤害。通过应对现实风险，Jake 帮助企业创建能够运行的安全环境。他对组织进行渗透测试，以便他们在攻击者之前发现弱点。当攻击者确实先发现了弱点时，Jake\
  \ 会与组织合作移除攻击者，评估损害，并修复最初允许攻击者进入的漏洞。Jake 还是一个丰富的会议演讲者、讲师和信息安全导师。\n\n### 你是如何开始在红队工作的？\n\
  \n我来自政府背景，他们教我如何对国家级目标攻击。当我离开政府任职时，我寻找最能应用我技能的地方。答案是红队和事件响应。这两个领域是互补的，因为它们都关注对手活动；其中一个是模拟，而另一个是调查他们的活动。\n\
  \n## 获得红队工作的最佳方法是什么？\n\n就像获得任何其他工作一样——建立人脉。在会议上与红队成员交流，展示你拥有跳出框架的能力（参加夺旗挑战赛、发布研究成果等），你就会获得关注。工作机会会很快降临——你可能根本不需要申请。\n\
  \n### 一个人如何在不违反法律的情况下获得红队技能？\n\n加入军队。我不是在开玩笑。这是一个获得训练和纪律的绝佳方法。虽然这是一个宽泛的概括，但我发现那些退伍军的人员在遵守规则方面比非退伍的人更有纪律。\n\
  \n\n\n\n在我看来，答案大多是营销手段。当人们意识到红队模型提供的价值与渗透测试不同时，营销人员便利用这一点进行差异化竞争，这导致了许多困惑。红队做两件事：威胁模拟和对手模拟，两者的目的都是为了保持行动安全（即不被发现）。渗透测试则是另一回事——你仍然会尝试破入，但被发现并无所谓，因为你只是在针对漏洞执行利用程序。在我看来，**特定威胁的模拟**是红队和渗透测试之间最大的区别。\n\
  \n> “红队做两件事：威胁模拟和对手模拟，两者的目的都是为了保持行动安全（不被发现）。”\n\n### 信息安全其他领域对红队工作不理解的一点是什么？你听过的关于红队、蓝队或紫队最有毒的谎言是什么？\n\
  \n人们将红队视为搞事者，他们通常是安全团队的边缘人。有时这确实是应得（例如，当他们试图假装自己比蓝队厉害时）。最有毒的谎言是有人声称红队完全击败了蓝队。这对任何人都没有帮助。安全不是红蓝双方的竞争。如果说有什么区别的话，它是红蓝双方共同面对敌的竞争。任何将红队与蓝队对立的描述都是极具毒性的。\n\
  \n### 你应该在何时为组织的安全计划中引入正式的红队？\n\n这绝对应该在进行过常规漏洞扫描并建立了补丁/修复计划之后进行。红队（像攻击者一样）通常会使用侵入性最小的方法访问并在整个组织中移动。如果没有预先这些计划，攻击者将利用未修补的漏洞，并且通过发现配置错误和薄弱的安全策略提供的额外价值很小。通常，在涉及红队之前，你希望先进行几次渗透测试以及相应的修复。\n\
  \n## 你如何向不情愿或非技术的客户或组织解释红队的价值？\n\n在大多数针对不情愿客户的情况下中，红队被视为价格昂贵的漏洞扫描或渗透测试。教育是纠正这一观点的关键，但在你教育他们之前，你必须先找到误解的根源。一旦客户意识到红队评估可以帮助他们针对其威胁模型中的模拟对手（而不是假设的攻击者）评估其控制措施，销售红队通常就很容易。这本质上是一个教育问题。\n\
  \n### 你看到过的实施性价比最低的安全控制措施是什么？\n\n我见过的实施性价比最低的安全控制措施是极其复杂的密码，结合了快速的密码旋转要求。幸运的是，密码旋转要求正在过时，但许多机构继续要求几乎无法记住的密码。国防部（DoD）要求承包商使用\
  \ `15 +` 个字符，且每个字符类中有两个不相邻的唯一字符，且密码不能有重复字符。但人们会找到方法，而这种方法最终变成了键盘轨迹（keyboard walks）。在任何足够大的环境中，至少会有一个人使用\
  \ `!QAZ@WSX1qaz2wsx` 密码，我们仅通过使用键盘轨迹模式，就能定期破解 70% 以上的国防部承包商密码。所以，这种控制措施实际上反而降低了许多威胁模型的安全性。\n\
  \n### 你是否曾经建议过不要进行红队任务？\n\n这种情况经常发生。如果你从未进行过漏洞扫描或渗透测试，那么红队并不是资源的良好利用方式。然而，有时安全团队会被执行官或董事会专门要求进行红队评估。在这种情况下，我们与客户合作调整测试参数以提供最大的价值，包括对整个环境进行漏洞扫描（这在红队评估中通常是不做的），并且从开始就产生较大的噪声，以给他们最好的检测机会。\n\
  \n> “如果你从未进行过漏洞扫描或渗透测试，那么红队并不是资源的良好利用方式。”\n\n### 能够防止你破坏系统或网络最重要的或最易实施的控制措施是什么？\n\
  \n我能想到的可能是使用类似 `LAPS` 的工具随机本地管理员密码。这不会阻止红队攻破单台机器，但它会阻止他们轻易横向移动。一个巨大的奖励是，当攻击者尝试（并失败）横向移动时，他们会产生很多噪音（我们可以轻松检测到）。另一个易于实施的控制是开启\
  \ `Windows Firewall` 并不允许通过 `SMB` 进行工作站到工作站通信。在服务器 IP 范围内提供一个可以通过 `SMB` 进行管理任务的跳板，但不要让机器相互通信。此外，禁用\
  \ `LLMNR` 和 `NetBIOS`。\n\n### 为什么你认为遵守行动规则（rules of engagement）至关重要？\n\n首先，是信任。偏离行动规则无疑会损害与组织的信任。其次，是法律责任。当你偏离任务条款时，如果发生问题，你将面临额外的法律责任。通常会有设置某些范围限制的原因，而我们并不总是知道这些原因。在开始前明确沟通行动规则可以节省任务期间的很多麻烦。\n\
  \n### 如果你在渗透测试或其他任务中被抓包了，你是如何处理的？\n\n我在尝试通过社会工程学进入一家零售店的现金室（和机房）时被抓包了，安全人员立即介入了。同样的招数在该连锁的许多其他商店都奏了，但这家店不买账。尽管我有一封授权信，但他更想报警，而不是联系我的联系人。我不得不冷静地解释这是一个糟糕的计划，我将为警察拘留和处理后果的小时计费，而且在采取这种行动之前至少不打个电话，对他来说会非常不利。在整个过程中，我说话很冷静，倾听他们的顾虑，并向他们重复他们的顾虑（以显示我在听）。实地测试人员应该学会学习去冲突化程序，这在类似情况下是救命稻草。\n\
  \n### 你在执行既定目标时遇到过最大的伦理困境是什么？\n\n就是管理层想要我们在红队评估期间受害的人的名单。是的，我用了了“受害”。任何落入我们圈计陷阱的人都是受害者。大多数情况下，我们在红队演习开始时同意描述我们如何完成目标的每一步，但掩盖受害者的身份。管理层在进入任务时通常对此没意见，但在收到报告后往往会改变口调。当这种情况发生时，我们知道他们正计划对员工进行报复，这让我感到难受。虽然我们需要保持环境安全，但员工往往由于缺乏特定场景的培训而成为攻击受害者。换句话说，在大多数情况下，这真的他们的错。\n\
  \n## 红队是如何协作完成任务的？\n\n\n\n\n我们使用工单系统来确保高级任务得到完成，且不遗漏任何细节。这对于搭建基础设施以及在离开时清理网络环境很有帮助。当测试转向事件响应且测试暂停时，这一点尤为重要。我们使用\
  \ `Slack` 和另一个内部开发的系统进行通信。每项行动都有一个负责人，这个人无论在组织中的职位如何，都是该项行动的团队负责人。就像在军队一样，在战术决策中，职位高于军衔。\n\
  \n### 在行动完成后，你采取什么方法对蓝队进行复盘和支持？\n\n首先，为行动的每一步记录时间戳，并保持详尽的笔记。你希望能够`准确地`告诉蓝队何时执行了某项特定任务，以便他们进行基于时间限制的分析。这通常能让蓝队找到反映我们活动的日志，而这些日志是红队或蓝队最初初根没有想过去过的。接下来，我们会确保说明为什么选择特定的方法来渗透网络。理解我们为什么选择某种方法而不是其他方法，有助于他们更好地预测真实攻击者的行动。最后，我们会建议他们可以采取哪些措施来防止我们的行动（或至少检测到我们的行动）。在\
  \ Rendition，拥有一个与红队紧密合作的蓝队让这变得容易得多。我们大多数红队成员在不同阶段与蓝队协作，因此他们从一开始就具备这种洞察力。\n\n###\
  \ 如果你转到蓝队，为了更好地防御攻击，你的第一步是什么？\n\n我会实施“设备赏金计划”。蓝队成员的关键绩效指标（KPI）应该是他们在网络上发现的先未知的设备数量。显然，这在较大的组织中效果更好（设备总数越多，未知设备就越多）。这里的前提是，你无法保护你所不知道的事物。\n\
  \n### 关于写好报告，有什么实用的建议？\n\n不要谈论你的技能；客户知道你有技能（这就是他们雇佣你的原因）。在可能的情况下，为复现漏洞漏洞提供分步骤的说明。如果你做了一些特别新颖的事情，这一点尤为重要。不要假设客户理解其影响。确保用任何业务人员都能理解的术语来传达影响。\n\
  \n### 你如何确保你的项目结果对于需要完整叙述和背景信息的人具有价值？\n\n首先，报告绝不应该是为了展示你的技能集。它应该是识别控制措施未被部署到能够检测真实攻击者的地方。我们总是建议在最初几次红队演练中进行对手模拟。我们将我们的可用行动限制在特定攻击者会使用的范围内，但也允许我们直接从该攻击者的角度来解释影响。这有助于创建一个“源自头条新闻”式的报告叙述，对客户来说更具针对性，同时消除了对影响可能被夸大的顾虑。\n\
  \n### 除了指出不足之处，你如何提出安全改进的建议？\n\n我们的方法之一是记录每项建议的优缺点。实施每个新的安全控制措施都需要某种程度的努力，并可能在环境中产生某种程度的摩擦。我们喜欢交流建议控制措施可以防止/检测什么、部署该控制措施所需的努力/资源，以及该控制措施造成的潜在业务中断水平。许多红队跳过了最后两项，这对他们的客户造成了巨大的损害。\n\
  \n## 在招聘和面试红队成员时，你寻找哪些非技术技能或态度？\n\n我总是要求提供一份写作样本。不非得是报告样本，但我想看到你描述问题的方式。我想评估你的写作风格，因为这有助于我评估你的思维方式。它还能告诉我你是否能写出良好的报告，以及我是否需要在提供的薪资中考虑专职编辑的成本。最后一部分部分是开玩笑的成分。对于那些明显不需要太多报告质检的人，我可能会提供高得多的薪资。\n\
  \n### 在不同处理问题方面，优秀的红队成员如何与普通人脱颖而出？\n\n优秀的红队成员真正能够跳出框架思考，并利用现有工具解决问题。我无法说我遇到过多少声称能跳出框架的红队“专家”，他们实际上只是在重复在课程或会议上看到的那几个小技巧。专家级的红队成员就像那个在跳蚤市场以原价的\
  \ 10% 买到一套乐高积木的孩子——你知道零件并不全，但你仍然会用这些零件拼出一个非常酷的东西。它虽然可能不是包装盒上的样子，但尽管会非常酷。我寻找的就是那个孩子——已经长大并拥有系统管理员知识的那个。■\n\
  \n# 44\n\n## Robert Willis\n\n> “红队成员出现不是为了让蓝队显得难看；大家都在同一个团队中，目标都是让组织变得更安全。”\n\n\
  ![](img/WillisRobert.jpg)\n\n**Twitter:** @rej_ex\n\nRobert Willis 是 1337 Inc. 的安全顾问，拥有斯坦福大学的管理学学位，以及来自美国空军、国土安全部、CompTIA、EC-Council、ELS\
  \ 以及其他多个机构的认证。他于 90 年代末在 AOL 上开启了编程和黑客之旅。Robert 目前在德克萨斯州卫队服役，在德州奥斯汀的 Mabry 营从事网络安全工作。\n\
  \n### 你是如何开始红队工作的？\n\n在技术领域工作了多年后，我决定追求成为伦理黑客的梦想工作。直到最近，伦理黑客并不是一个广为人知的（主流）职业领域——从公司实际聘用内部员工的角度来说。我提到这一点是因为在大多数情况下，组织似乎只让第三方测试他们的网络，而且是在他们遭受入侵后每年，或者在面临失去或停滞业务的威胁时被迫进行。我们今天所知的许多合规性要求在以前并不存在。\n\
  \n为了开始（私营部门/民用）红队工作，我决定找一家网络安全公司，利用我目前的技术技能为他们工作，计划是接触该行业并获得培训和认证以转部门。由于我已经拥有本学位和技术认证，这使得转型变得更容易，因为我可以在网络安全公司（非服务部门）找到一份工作，在学习行业并获得技能的同时努力转入部门。在行业内全职工作一年，通过全职居家学习通过了认证，并参加了数十门课程（甚至更多大学学分）后，我终于证明了自己的技能并进入了我梦寐以求的部门。\n\
  \n\n\n\n人脉拓展、妥当计划以及获得所需的技能是获得任何工作的途径。我之所以先说人脉，是因为我发现当你想要在任何行业寻找工作时，你认识的人起着至关重要的作用。你希望通过获得所需的技能让自己成为最好，从而证明你的录用是合理的（在你的关系人脉帮助你获得面试机会之后）。\n\
  \n> “人脉拓展、妥当计划以及获得所需的技能是获得任何工作的途径。”\n\n如果你想了解工作岗位需要哪些技能，你应该查看职位招聘公告，看看公司在寻找什么。不要被某些招聘公告击馁，因为很多时候，发布职位的人并不知道自己想要什么，他们发布出一种不切实际的技能组合，并希望你在某项仅存在一年的领域拥有五年的经验。请关注出现在许多职位招聘中的标准核心技能，并开始计划如何获得这些技能。\n\
  \n在成为红队成员（Red Teamer）专家之前，从基础且稳固的网络安全基础开始是非常重要的。我建议先获取 `Security+` (`CompTIA`)，然后花费大量时间在以认证为终点的实验室中学习（`Offensive\
  \ Security`、`ELS`）。`EC-Council` (`CEH`) 受 HR 人员的青睐，但经常被黑客社区嘲笑。这意味着你不应该考它吗？完全不是。你想要向\
  \ HR 部门推销自己，而不是向互联网上的随机人员。\n\n## 如何在不触犯法律的情况下获得红队技能？\n\n有大量的网站提供免费（以及付费）的实验室/CTF（夺旗赛），你可以在有漏洞的机器上练习来提升技能。你也可以在家里建立自己的环境。我告诉那些想要进入渗透测试的人，下载\
  \ `Metasploitable` 和 `DVWA`，并查看在线操作指南，开始理解如何从基础层面发现漏洞并利用漏洞。如果你从未做过渗透测试，并希望获得更具实操性的指导，我强烈推荐\
  \ `eLearnSecurity` 的 `eJPT` 课程。\n\n## 为什么我们无法对什么是红队达成共识？\n\n在 `InfoSec` 领域，从业人员有无数种观点。我做过大量的培训，可以告诉你即使是不同的学习材料/培训提供的内容也可能是相互冲突的（没骗你！）。有些人在一个只做\
  \ X 的组织中担任红队，他们可能没有意识到在他们工作之外还有其他方面。\n\n## 信息安全其他领域对红队工作的哪一点最不理解？你听过的关于红队、蓝队或紫队最具毒性的谎言是什么？\n\
  \n红队成员出现并不是为了让蓝队显得难看；大家都在同一个团队中，目标都是让组织更加安全。紫队成员可能最理解这一点。一些蓝队成员非常害怕看到你利用了他们花费大部分时间维护的系统——并将其视为个人攻击。不应该把任何事情个人化！没有什么是\
  \ 100% 安全的；如果工作范围允许你随心所，任何东西都可以被攻破。如果红队成员鄙视蓝队成员，他们可能具有毒性。始终做到言行一致，永远不要把事情个人化。\n\n\
  ## 在什么时候应该向组织的安全计划中引入正式的红队？\n\n安全从第一天起就应该是组织的一部分。一切都应该在考虑安全的情况下进行构建，并至少由程序员在基础层面进行验证和……（注：提供的源文本在后半部分似乎存在重复或碎片。我已根据您的规则对提供的文本进行了格式处理。）……\n\
  \n*（自我纠正：用于重新格式化的输入文本在后半部分存在大量重复和碎片化句子。我已完全按照提供的文本对文本进行了格式处理。）*\n\n\n\n\n有些组织对测试范围的限制非常大，以至于在现实情况下完全不切实际。当你面对一家大公司，却被给出一个极小得离谱的范围时，我认为公司仅仅因为某些可能不符合道德的原因而不想完全被彻底毁灭，这在伦理上确实存在一些问题。如果范围足够小，仍然会有发现的问题，但与那些针对真实的恶意攻击者（他们完全不会被赋予任何范围）的合适范围相比，这些问题的修复通常会更快、更容易。如果这些组织同意扩大其范围，以涵盖恶意攻击者真实会做的更具可能的场景，那么他们的修复工作可能是一堆如山的任务，而不是一颗小石子，这对于那些被他们持有个人身份信息（PII）的人来说是不公平的。\n\
  \n## 红队如何协作工作以完成任务？\n\n在测试期间和测试之后，当我编写报告时，我始终与联系人保持密切沟通，以便他们了解所发现的问题（尤其是高风险问题）。我会告诉他们如何修复这些问题，并给他们修复的机会。发现的问题将始终出现在我的最终报告中，但给了组织一个将它们标记为“已解决”的机会，这让他们看起来很好，特别是如果他们能够解决所有问题。你必须始终记住，无论你是在进行红队还是蓝队活动，在加强组织安全方面，你们都在同一个团队中。\n\
  \n## 在行动完成后，你进行简报和支持蓝队的方法是什么？\n\n在整个测试过程中以及提交报告后，我都会随时解答有关修复方案的问题。我的报告总是包含如何修复发现的问题的信息，但如果这超出了组织中负责人员的技能范围，我总是提供有帮助的信息（在范围内）。满意的客户就是回头客，理解这一点非常重要：你被雇佣并不是为了展示技能，而是为了让组织拥有更好的安全态势。\n\
  \n## 如果你转到蓝队，更好地防御攻击的第一步是什么？\n\n员工安全培训至关重要。为每个人提供适当的培训是非常重要的，因为员工是进入组织系统的触手可得的果实，特别是当安全计划正处于首次正式构建的过程中。这种培训的一部分是关于组织的政策，所以如果这些政策不存在，要做的第一件事就是创建它们。\n\
  \n> “为每个人提供适当的培训是非常重要的，因为员工是进入组织系统的“触手可得的果实”，特别是当安全计划正处于首次正式构建的过程中。”\n\n## 关于编写优秀报告，有什么实用的建议？\n\
  \n我总会在报告顶部包含一个词表，首先可读的内容始终是任何人（即使是非技术人员）都能理解的高级执行摘要，随后是特定发现的问题图表，并带有评分（从高到低）以及在提交报告时是否已解决的。\n\
  \n之后，针对更具技术性的部分，我会详细分解每个发现的问题，包括识别哪些资产受影响的信息、漏洞本身、我是如何利用它的（附有显示/解释我所做操作的截图）、漏洞的引用（如\
  \ `CVE` 等）以及修复信息。如果有人抱怨，通常是因为报告不够清晰。\n\n## 修复发现的问题的最佳方法是什么？\n\n最重要的是理解根源，而不仅仅是修复症状。如果你只修复症状，漏洞可能会再次出现。你需要与组织合作，理解漏洞是如何产生的以及如何防止它再次发生。\n\
  \n## 你如何确保你发现的问题对客户具有可操作性？\n\n我努力做到尽可能清晰简洁。我提供了关于漏洞是什么、它为什么重要以及如何修复它的详细信息。我还提供了漏洞可能如何被利用的示例，以便客户理解其风险。\n\
  \n\n\n\n# 如何在不触犯法律的情况下获得红队技能？\n\n如果你本身不在一家从事此类测试的公司工作，那么很难涵盖红队测试期间使用的所有技能。例如，在正式测试之外很难进行`phishing`。对于通用技能，`CTFs`\
  \ 和 `bug bounties`（漏洞赏金）是提高技术能力的好方法。应该选择你薄弱的领域进行突破以建立优势，而不是只盯着你擅长的领域为了一直获胜或赚钱。\n\
  \n多关注标准安全领域之外；学习 `SCADA` 或 `IoT` 可能会带给你你的下一个雇主或团队正在寻找的技能。\n\n## 为什么我们无法对什么是红队达成共识？\n\
  \n原因和我们无法对披萨上是否应该放菠萝达成共识是一样的。有些人的观点非常固定，并不准备好改变。在我看来，只要你正确界定了测试范围，它被称为什么并不真正重要。客户可能来要求进行红队测试，但实际上只想要一个\
  \ `Nessus` 扫描。在与客户相处期间，我们可以委婉地解释这种测试通常被称为`漏洞扫描`，但如果他们离开时仍然称之为红队，你对此也无能为力。只需确保充分记录所做，以便审查任何生成的报告的人能看到客户标签之外的内容。\n\
  \n## 信息安全其他领域对红队工作最不理解的一点是什么？你听过的关于红队、蓝队或紫队最具毒害的谎言是什么？\n\n这并没有完全回答问题，但当测试处理得不当时，红队和蓝队之间的怨恨会导致很多问题：蓝队认为自己被红队针对了（因为红队是在他们不知情的情况下植入的），而红队在测试结束时夸耀成功，却没有对他们尝试过但未成功的事情给予认可。如果执行得好，大家应该共同努力；如果执行不好，就会产生很多摩擦。\n\
  \n## 你应该何时向组织的安全计划中引入正式红队？\n\n当其他类型的测试（如`漏洞扫描`和托管的协作测试（`渗透测试?`））每次返回结果都是干净的，并且蓝队能够检测并报告测试期间执行的所有操作时。如果一家公司无法检测并以某种方式防御基本的扫描和攻击，进行红队测试不太可能产生物有所值。\n\
  \n## 你如何向不情愿或非技术的客户或组织解释红队的价值？\n\n解释说通过受控的方式模拟真实攻击，你是在为公司未来遭受真实攻击时做准备。对他们的系统（人工和自动化）进行压力测试，将使他们准备好应对任何挑战。一个在拳台上与愿意配合的练对手进行数小时对练的拳击手，比一个只打过沙袋的人要准备充分得多。\n\
  \n> “对他们的系统（人工和自动化）进行压力测试，将使他们准备好应对任何挑战。”\n\n## 你看到的已实施的性价比最低的安全控制是什么？\n\n通常是大家在上一次贸易博览会上都在推销的最新闪闪灯盒子。由想要赚快钱且不完全理解该领域的公司实施的不成熟技术，可能会给人一种虚假的安全感，并导致其他重要领域的资金消耗。\n\
  \n## 你是否曾经建议过不要进行红队任务？\n\n无论要求的是什么类型的测试，我通常会根据范围以及我认为对客户最合适的测试类型进行考虑，然后尝试与他们合作制定出一个能满足他们需求的方案。在目前为止的所有案例中，这种方法都是有效的，我们之间达成了共识，我认为这在时间和金钱上都为他们提供了最大的价值。\n\
  \n如果客户不灵活，坚持要进行我认为不合适的事情，我可能会离开。我发现，在范围确定阶段就很难合作的客户，签署合同后会变得更难合作，我宁愿与友好的客户合作。\n\n\
  > “如果客户不灵活，坚持要进行我认为不合适的事情，我可能会离开。”\n\n## 能够防止你攻破系统或网络的最重要或最易实施的控制措施是什么？\n\n良好的`whitelisting`（白名单）似乎效果很好。将系统锁定为仅允许最低权限，并定期审核列表以确保其不会增长或过，有助于通过杀死攻击工具来阻止攻击者，无论他们使用的是导入的工具还是尝试使用内置工具。如果`whitelisting`应用还带有报告功能，那就更好，因为报告将是机器上发生坏事的良好指标。\n\
  \n## 为什么你觉得遵守约定规则（Rules of Engagement）至关重要？\n\n规则的存在是为了保护测试人员和业务的安全。可能增加了某条你并不完全理解违背后果的规则，所以不要冒险。\n\
  \n## 如果你在渗透测试或其他任务中被抓到，你是如何处理的？\n\n首先，祝贺抓到我的人；从那里起，取决于测试的规则。如果被捕获意味着测试的隐蔽部分已结束，我很乐意继续测试，让蓝队继续观察并告诉他们看到了什么，以及是否再次抓到我。通过分析我被抓时可以完成任务的不同方式，可能会发现未预见的漏洞。\n\
  \n我喜欢测试中隐蔽的一面，但我也喜欢被抓到并与优秀的防守者合作，因为我们可以以这种风格相互互动：\n\n*   我会尝试这个；你能看到吗？\n*   能。\n\
  *   好，如果我改了这个呢？\n*   不行，我会更新我的检查项；再试一次。\n*   搞定。\n*   这次抓到你了。\n\n这可以变得非常有创意，并带来一些有趣的环节。\n\
  \n## 在执行指定目标时遇到过最大的伦理困境是什么？\n\n保持在测试范围内。看到看起来可以轻松获胜的机会，但必须忽略它。\n\n## 红队是如何合作完成任务的？\n\
  \n由于我通常作为专家身份加入，我在团队中的角色是查看特定领域，通常是`web apps`。团队通常由一些通才人才以及需要时加入的专家组成。\n\n报告和文档始终取决于团队的其他成员。我通常会在发现任何问题时将其记录，并将报告的大部分留给核心成员处理。\n\
  \n在汇报总结（debrief）阶段，如果我发现了什么，要么确保自己参加汇报电话或邮件与客户讨论该发现，要么向客户联系人解释该问题，以便他们传递细节。无论哪种，在需要时保持在线都是重要的，因为当事情开始处理时，往往几天或几周后会有后续问题。这就是良好的笔记非常有帮助的地方。抓耳挠腮回忆漏洞路径对客户没有帮助；直接从笔记中读取则会有帮助。\n\
  \n> “抓耳挠腮回忆漏洞路径对客户没有帮助；能够直接从笔记中读取则会有帮助。”\n\n## 在行动完成后，你进行任务汇报和支持蓝队的方法是什么？\n\n\n\n\
  \n关键点在于确保客户从技术和业务两个层面充分理解所发现的每一个问题。例如，董事会成员不在乎 `SQLi` 是什么，但他们会关心自己的客户数据库可能被窃取。相反，开发团队则想要确切知道哪个查询中的哪个参数存在漏洞，以便他们重现问题并修复它。\n\
  \n如果你忽略了与业务部门的沟通，开发团队可能无法获得修复问题的支持；如果你不与开发团队沟通，问题将无法得到解决。\n\n## 如果你转到蓝队，你更好地防御攻击的第一步是什么？\n\
  \n提高其他蓝队成员的意识并进行培训。蓝队对自己的网络及其可能遭受的攻击类型了解得越多，他们防御网络的能力就越强。\n\n## 关于编写良好的报告，有哪些实用的建议？\n\
  \n边做边写。在发现发现时就将其写下来，如果你在进行叙述性描述，就在事件发生时撰写。在测试结束时已经写好了大部分报告，这比在结束后才尝试写，然后不得不回头翻乱乱的笔记、shell\
  \ 历史记录和截图来拼凑发生了什么以及发生的顺序要好得多，因为你注定会忘记大大内容，尤其是那些肾上腺素激增趣味时刻。\n\n## 如何确保你的程序结果对需要完整叙述和背景的人是有价值的？\n\
  \n你必须记住对方也是人，你出现在那里是为了帮助他们提高公司的安全性，而不是为了展示你有多厉害。问题的涵盖应该结合业务背景，而不仅仅是孤立的漏洞。\n\n涵盖正面结果也非常有帮助。解释哪些地方做得好以及你在遇到困难或直接被攻破的地方，有助于业务部门理解自己的优势，也有助于减少防御者的敌意。\n\
  \n## 除了指出不足之处外，你如何建议安全改进措施？\n\n从整个业务的角度进行思考，并推导出如果不实施你建议的措施可能导致的所有潜在后果。然后你需要以一种不使用恐吓手段的方式传递这些信息，尽可能将改进方案框架化。在客户现场有一位人员非常有帮助，因为他们通常可以帮助指出敏感点在哪里，例如对监管罚款的恐惧或客户感知的担忧，这有助于为建议提供框架。\n\
  \n在这里你必须小心，不要越界进行恐吓性渲染；如果你被发现这样做了，你的声誉就毁了，未来的建议也很可能不受欢迎。\n\n### 在招募和面试红队成员时，你寻找什么样的非技术技能或态度？\n\
  \n能够对他人的同理心。你必须将测试看作帮助客户的方式，并在过程中，你必须理解他们的环境、局限性以及许多其他事情。我见过太多测试人员发表像“他们为什么不直接做\
  \ X 呢？”这样的评论，却没有意识到如果可以，客户可能就会做 X。\n\n## 在不同方式解决问题方面，优秀的红队成员如何脱颖而出？\n\n能够绕过问题思考，也能从头到尾解决问题。有很多测试工作并不光鲜；浏览\
  \ 200 个网络共享（其中大多数包含平庸、无聊的内容）以找到那个能解锁一切的宝石，这一点也不好玩，但往往必须这样做。相反，如果你知道自己正在寻找特定物品，想出一种自动化搜索的方法来节省这些精力也是很有用的。■\n\
  \n> “有很多测试工作并不光鲜；浏览 200 个网络共享（其中大多数包含平庸、无聊的内容）以找到那个能解锁一切的宝石，这远非好玩，但往往必须这样做。”\n\n\
  # 46 Wirefall\n\n> “像我这样的渗透测试员通常是全才学者。”\n\n![](img/wirefall.jpg)\n\n**Twitter:**\
  \ `@DHAhole`\n\n如果你有一个机会用 100 字或更少向世界讲述你的故事，你会说什么？你会侧重于你克服的挑战并突出你的成就吗？或者，你会利用这个平台为你支持的事业发声？这是我作为本书作者所享有的特权。我的选择是将镜子对准你，读者。你希望你的简介怎么写？现在就成为那样吧！如果你仍然想知道我的故事，请私信我或在现实生活中与交流。\n\
  \n## 你是如何开始红队的？\n\n虽然我一辈子都是黑客，但我从 1995 年开始专业从事安全评估。我的职业轨迹相当典型，从漏洞评估到渗透测试，再到红队。\n\
  \n我的起源故事始于 1994 年离开空军之后。我曾驻扎在海外，回到美国后，每个人都在谈论万维网。当时的共识是它将成为下一个“大事”，因此我通过当地的免费网络申请了一个拨号账号。我从\
  \ 1982 年就开始使用计算机访问公告板（BBS），并非常兴奋能探索这个我在服役期间错过的、新连接的世界。\n\n带着黑客心态，我开始四处尝试。我发现访问几乎任何连接到同一\
  \ `ISP` 的计算机都是轻而易举的。如果这是常态，怎么会认为网络空间是个好主意呢？我开始研究如何保护自己。当时缺乏良好的安全资源。虽然有 `Phrack`\
  \ 和 `2600` 这样的杂志，但距离 `NMAP` 发布还有几年时间。\n\n最后我大错特错。Web 确实发展成了一件大事，而且速度非常快，尽管它本身或底层基础设施并不安全。一旦点点潮来临（如果你还能谈得上安全——甚至忘掉怎么拼这个词），你突然变得供不应求。在四年内，我从县垃圾处理场的低薪工作转变为赚取十倍薪资的安全顾问。这并不是说不需要付出努力。我在当地的社区学院上了课程，并获得了计算机网络操作的\
  \ `AAS` 学位。我还愿意多次搬迁，并在 1999 年在一家主要的电信供应商处担任了顾问职位。我被推销为“该领域最卓越的安全专家之一”。这当然是荒谬的；我只是想确保别人在在线时无法访问我的硬盘。\n\
  \n获得红队工作的最佳方法是什么？\n\n我在当地的安全社区中非常活跃，经常被问到这个问题，但对我来说仍然很难回答。要复制我的经验，首先需要发明一台时光机，因为当我进入这个领域时安全资源非常匮乏，而现在已经有了完整的博士培养课程。我很幸运！我准备了自己，投资了自己，并且即使我自己都不相信自己时，也有人相信我。我确实非常幸运。\n\
  \n\n\n\n\n就我个人而言，我的建议是尽可能多地学习尽可能的东西，直到你找到那个最终想要倾注所有精力的事情。像我这样的渗透测试人员通常都是“通才”。而红队的价值在于，他们也包含了高度专业化的资源。我坚信这个建议在更广泛的范围内同样适用。人们不应该仅仅关注*进入*信息安全领域，而应该志于为信息安全*贡献*价值。因此，成为数据库、无线、物理访问系统或任何领域的专家吧。如果你刚进入这个领域，那么请关注专家较少的新兴技术，例如云安全或软件定义网络等领域。\n\
  \n最后，建立人脉。指的是人，而不是思科（Cisco）设备。我为此斗争过很久。我曾相信绝对的唯才是论胜过过关系。但我发现，成功很少与这两者兼得。社交媒体让我们我们这些内向的人更容易建立人脉，但我仍然主张走向现实世界，与那些正在从事你想做的事情的人建立联系——与那些拥有激情的人交流，因为坦诚地说，如果他们没有这种激情，就不会在一个本可以待在家里完美的下午或晚上出门了。\n\
  \n### 人如何在不触犯法律的情况下获得红队技能？\n\n以前，互联网是好奇者少数几个可能的测试场之一。幸运的是，现在情况大不相同了。通过虚拟化、容器等技术，你现在可以在云端甚至在自己的笔记本电脑上启动几乎任何环境。还有许多教育资源，从教学视频到完全开发的测试环境应有尽有。\n\
  \n但我还是回到专业化上。找到你充满热情的事并学习你所能学习的一切。研究你所在领域使用的工具和技术，并为它们做出贡献。\n\n## 为什么我们无法对红队的定义达成共识？\n\
  \n我想归咎于营销部门，但渗透测试也从未有过标准的定义。许多公司仍然会运行漏洞扫描器并称之为渗透测试。尽管如此，我看到漏洞扫描、渗透测试和红队之间有着非常清晰的界限。\n\
  \n漏洞扫描的目的是列出环境内的已知安全问题。这些扫描应该使用管理员或 `root` 凭据进行，并作为漏洞管理计划的一部分，该计划应包括修复漏洞总数和补丁时间等指标。\n\
  \n渗透测试旨在模拟环境内的攻击者，但他们也受到时间/资源/范围的限制。主动防御中的例外（例如 `IPSs` 或 `WAFs`）经常被请求，因为假设攻击者可能需要几周、几个月甚至几年才能规避它们，但由于后勤或成本要求，测试本身必须在短得的时间范围内完成。\n\
  \n红队的目的是测试蓝队的能力。所有的防御都应该保持到位，且评估不应提前通知。蓝队能否有效检测并响应红队的活动？与渗透测试（尝试尽可能多地利用漏洞）不同，红队活动通常是场景驱动的。红队测试防御针对当前目标的有效性，例如假设第三方供应商已被攻破。\n\
  \n### 信息安全领域的其他人对于红队有一方面是不理解的？你听过的关于红队、蓝队或紫队最具毒性的虚假信息是什么？\n\n最有害的误解是认为红队是敌人。这完全不是事实。我们是防御者——利用攻击者工具和方法论的子集的防御者，以评估组织在人员、流程和技术上投入的安全投资有效性。我们仍然在伦理和法律的约束内运行，而真正的敌人不会。我们不会在整个企业部署勒索软件，也不会为了获取\
  \ CEO 的公司电脑而对她的私人车辆进行抢劫。我们可能会给用户和支持人员造成干扰或不便，但彻底性是我们的职责。清理真实敌人留下的工作将始终是指数级密集的。最终，我们都在同一个阵营！\n\
  \n## 你应该何时向组织的安全计划中引入正式的红队？\n\n我倾向的红队定义是测试蓝队的有效性。如果一个组织没有建立良好的、能够检测和响应安全事件的蓝队，那么就不应该考虑此类评估。\n\
  \n从定义策略、获取资产清单和落实补丁开始。开发漏洞管理计划。在构建检测和响应能力的同时，通过渗透测试彻底测试安全控制。如果这些程序尚未到位，那么红队演练的预算最好分配到其他地方。\n\
  \n### 你如何向一个不情愿或非技术的客户或组织解释红队的价值？\n\n提问。该组织为它的蓝队支付了多少钱：包括人员、流程和技术？这项投资的有效性如何？他们的指标是什么，又是如何验证的？这应该可以开启对话。如果他们有答案，那么他们可能已经理解了红队的价值，或者正在执行类似的活动。如果他们不知道，那么关于红队对组织价值的讨论就可以集中在帮助回答蓝队有效性的问题上。\n\
  \n### 你看到的性价比最低的安全控制是哪种？\n\n老实说，是绝大多数。许多组织的阿喀琉斯之之踵是访问控制。根据正在测试的场景，我在评估期间的一个目标通常是获得单个账户的访问权限，这在大多数环境中都是轻而易举。作为“授权用户”，我通常会被授予访问许多共享，其中某些可能包含系统或数据库凭据的脚本，甚至是完整的数据库备份。如果攻击者能够直接访问组织试图保护的数据，他们不需要\
  \ `domain admin` 或 `root` 凭据。\n\n资产盘点很难。数据分类和管理很难。购买安全软件或闪灯很容易。我建议将有限的预算投入到工具和培训上以提高人员效率，而不是投入那些声称能治愈所有问题的解决方案。\n\
  \n## 你是否曾经建议不要进行红队行动？\n\n我的背景是渗透测试，我厌倦了““打鱼”。我经常被邀请评估那些连最基本的安全控制的组织。如果渗透测试的目的是震惊管理层并帮助松腰包，那么这样做也可以，但在这种背景之外，它很少能提供任何价值。\n\
  \n如果一个良好的蓝队不存在，那么红队就没有东西可以测试。在这些情况下，从定义策略、获取资产清单和落实补丁开始。开发漏洞管理计划。在构建检测和响应能力的同时，通过渗透测试彻底测试安全控制。\n\
  \n我大多数时候都会建议不要进行红队。我的目标是与客户建立信任。当他们准备好我们需要提供的服务时，理想情况下我们会被视为信任的顾问，他们会再次聘用我们。\n\n\
  ### 能够防止你入侵系统或网络的最重要或最易实现的控制措施是什么？\n\n\n\n\n\n# 简介\n\n首先，通过从源减少收集和存储的敏感数据量，减小需要保护的攻击面。当数据不再需要时，请将其删除。\n\
  \n备份、备份、再备份。定期测试你的恢复策略。无论是意外还是由于勒索软件攻击，数据丢失对中小型企业的生存威胁可能比对大型企业更为严重。\n\n最后，培训你的员工。培训用户在家里保护好自己。鼓励用户小组并识别出其中的佼佼者。培训你的支持人员。俗谚所说，如果我培训了他们而他们却离开了怎么办？如果我不培训他们而他们留下了又怎么办？\n\
  \n## 为什么你认为遵守交战规则（rules of engagement）至关重要？\n\n在售前过程中，我极力创造我认为能让客户从评估中获得最大价值的条件，但归根结底，我提供的是合同服务。如果不遵守交战规则，那么我就与那些我试图保护客户免受侵害的敌人没有区别。安全建立在信任之上，而信任一旦被破坏就很难重新获得。要值得信赖！\n\
  \n## 如果你在渗透测试或其他任务中被抓到，你是如何处理的？\n\n不幸的是，这些情况很少发生。以下两个例子说明了最初的失败并不意味着终结。\n\n我当时正在为一个客户执行物理渗透测试。首席信息官（CIO）发现了这件事，认为这不公平，于是向整个组织发送了邮件，告知评估将在下周进行。我仍然能够在没有发生任何意外的情况下突破我的四个目标中的三个。在其中一个站点，我甚至闯入了一个员工感谢庆祝活动，并出现在了公司简报的照片中。不过，其中一个成功源于失败。我受到了直接挑战，并交出了我的“免死牌”（`get-out-of-jail-free`）。随后，我提议提供一份关于捕获我时正确做法的汇报（out-brief）。我主持了会议，祝贺他们的成功，然后离开了。然而，他们从未向组织内的其他人核实过我的身份。我授权信中的凭据全是伪造的。明年，我成功攻破了之前阻止过我的那个目标。我利用了他们会被预警的这一点。我制定了以下借口：“你的站点已被选中即将到来的渗透测试中。下周内将有人尝试破解你的物理安全，因此公司派我来确保你的防御达到标准。”我的目标带我完整参观了整个设施。\n\
  \n在另一次任务中，我正在评估一家制药客户。整整一周，我都能直接走过前台安保人员。公司正在装修，所以很容易找到一个空闲的工位并声称其为己有。到周五，我已经获得了数\
  \ TB 的高度敏感信息，且从未受到过挑战。是时候该出点动静了。我对整个组织启动了全面的漏洞扫描。安全团队注意到了这一点，但他们没有追溯源，而是封锁了我的端口，我知道我被检测到了。我收拾东西离开，从未被识别身份。\n\
  \n## 在执行指定目标期间，你经历过的最大的伦理困境是什么？\n\n我当时正在对一个政府机构进行评估。通过互联网，我能够访问数千万个人的个人身份信息（PII），包括他们的姓名、地址、电话、驾照号码和社会安全号码。当时这类信息仍然具有不小的金钱价值。我可以带着下载的内容逃往一个没有引渡的国家，但这并不是我这么做的初衷。我的道德准则从未动摇。不过，我发现这是一个多用途数据库。不幸的是，我无法在不暴露客户的情况下透露它的其他用途，但不用说，我发现了自己的名字。我本可以更改自己的状态。这样做不会影响他人，但会减少我个人的某些“不便”。指针虽然动摇过，但保持了坚守。\n\
  \n虽然我带来了价值的技能组合，但事实证明，信任是唯一重要的。没有它，我们一无是处。\n\n## 红队是如何协同工作完成任务的？\n\n取决于许多变量。团队是同地办公还是分散分布的？团队规模如何？例如，团队核心是一个凝聚的整体，还是最近加入了新成员？我建议对所有成员进行团队动力培训，至少是对团队负责人或项目经理。选择的沟通方式应该最适合整个小组。\n\
  \n## 关于编写良好的报告，有什么实用的建议？\n\n理想情况下，团队应该包含一名专门的技术撰稿员。如果不可，就让写作能力强的人对团队的其他工作进行审核（QA）。开发风格指南以帮助标准化文档流程。考虑为团队成员提供时间并参加技术写作课程。这应该是他们技术培训的补充，而非替代。这不应被视为惩罚。\n\
  \n收集客户的反馈。好在哪里、坏在哪里、糟糕在哪里？信息是否有价值但格式不可用？后续步骤是否有明确定义？我们绝不向客户投掷成千上万页的 PDF 炸弹。\n\n\
  ## 操作完成后，你对蓝队进行汇报和支持的方法是什么？\n\n这种方法应该始终适应受众，但我喜欢在开始前给接收者留出时间。我将在报告提供几天后与技术团队安排初步跟进，让他们知道我们可以随时解答问题。初步跟进应包括能够增强组织防御态势的步骤。在提供执行汇报，我将重新对接技术团队，记录进展。\n\
  \n任务结束后，我会重申随时欢迎后续问题。范围蔓延（scope creep）是事实且必须管理，但如果某些内容不清楚，那么我认为那是交付方面的失败，并会妥善处理。\n\
  \n## 如果你转到蓝队，你防御攻击的第一步是什么？\n\n我的第一步将是倾听和学习。下一步是开始提问并持续学习。为什么红队活动没有被注意到，或者没有采取特定的防御措施？在生活中我发现，最初看起来愚蠢的决策或行动是因为我甚至不知道的信息或限制造成的。在完整的背景下，我发现可能会做出相同或类似的决定。\n\
  \n\n\n\n每项评估的目标都应该是为了合作范围内提供尽可能多的价值。实现这一点的最好方法是与客户交流。了解他们。他们的痛点是什么？他们的挫败感来自哪里？你如何利用评估及其结果来解决这些痛苦和挫败的问题？建立良好关系。成为一个受信赖的顾问。\n\
  \n### 除了指出不足之处，你还建议如何进行安全改进？\n\n我主张关注根源分析。列出几十个发现不如识别产生这些发现的流程有用。例如，`Apache` 网页\
  \ 服务器上的示例脚本和 `Jenkins` 实例上的默认凭据，这两个都是未遵循应用加固标准的例子。仍然提供修复这些发现的参考，但也要解决根本原因。\n\n不要重复造轮子。我非常依赖现有资源。例如，`OWASP`\
  \ 提供了关于 `SQLi`、`XSS` 以及 `SSL/TLS` 证书的正确部署和使用的极佳指南。让你的客户意识到他们可以利用的这些资源。\n\n### 在招募和面试红队成员时，你会在意寻找哪些非技术技能或态度？\n\
  \n热情、正直、谦虚和准备充分。\n\n- **热情**：给我讲讲你的家庭实验室。规模或投入并不重要；它可以简单到在笔记本电脑上运行虚拟机。这是一个极佳的破冰话题，因为充满热情的候选人会对谈论自己的配置感到兴奋。\n\
  - 你是如何保持与时俱新的？如果是播客，是哪几个？如果是 Twitter，你关注谁？这没有标准答案，但无法识别出特定的资源会引起对候选人持续学习投入程度的担忧。\n\
  - 你积极参与了哪些安全社区？虽然优秀的“独行侠”测试人员有其立足之地，但我通常筛选适应团队环境的人。社区参与是一个很好的指标，表明候选人对该领域充满热情，并且乐意在小组中贡献。\n\
  - **正直**：你在简历上列出了工具 `X`；你对它偏好的配置/标记是什么？为什么？我不迷信那种“陷阱式”的问题，比如询问晦涩的工具设置，但如果你的简历上列了某个东西，那么你至少应该知道你是如何使用它的。\n\
  - 你是否曾被要求做一些你认为在伦理上有疑问的事情？如果是，你是如何的？这是许多测试人员遇到过的情况。确保你对提供的答案感到释然。\n- **谦虚**：你在执行评估时犯过的最大的错误是什么？我们都是人。我们都犯过错。这的后续问题是询问候选人是否对方法论进行了任何更改以防止类似错误的发生。\n\
  - **准备充分**：增加新成员对团队有重大影响，所以我非常认真地承担技术面试的责任。如果你是候选人，我可以保证我已彻底审查了你的简历并进行了一些基本的 `OSINT`。我预计你至少也做了同等的研究。\n\
  \n### 就以不同方式处理问题，优秀的红队成员是如何脱颖而出的？\n\n红队成员像黑客一样，存在于各行各业。他们被纯粹的好奇驱动；有时可能是出于所迫。我将我在领域的成功归功于完全不同的属性：孩子气。安全控制基本上是在说“你不能去那里”，而我不喜欢别人告诉我我可以做什么或不能做什么！我想表达的是，由于我们背景和动机的不同，我们看待问题的方式也不同。然而，确实存在“黑客思维”这种说法，我相信当我们拥抱差异而不是从公认规范的视角来面对挑战时，它就会体现出来。\n\
  \n# 47 \n\n## Phillip Wylie\n\n> “我们需要记住我们是在同一条团队上的，而不是我们对阵他们。当我们大家一起努力时，我们可以完成惊不起的事情。”\n\
  \n![](img/Wylie.jpg)\n\n**Twitter:** @PhillipWylie\n\nPhillip Wylie 是一个拥有超过 21 年经验的渗透测试人员，是德克萨斯里兰学院（Richland\
  \ College）教授黑客和信息安全的兼职教授。他是 Pwn School 的创始人兼院长，拥有 `OSCP`、`GWAPT` 和 `CISSP` 等证书。他曾担任应用安全工程师，在被裁员之前，他一直致力于渗透测试。他的梦想工作是渗透测试人员，他通过咨询行业获得了机会。\n\
  \n\n\n\n# 你是否曾经建议过不要进行红队对抗测试？\n\n是的，有一次我在一家医院进行 Wi-Fi 渗透测试，客户担心渗透测试可能会对无线连接的医疗设备产生不利影响。我建议进行安全评估而非渗透测试，这规避了对系统进行利用，转而对无线接入点（AP）控制器的安全规则和设置进行审查。\n\
  \n## 为什么你认为遵守行动规则（Rules of Engagement）至关重要？\n\n我认为遵守行动规则边界至关重要的主要原因之一是法律责任考虑。你不想承担服务中断、潜在的业务损失或面临诉讼的风险。你同时也不希望失去客户对你的信任和信心。如果你发现任何超出行动规则或范围的理由，最好先与你的客户和你的团队进行讨论。如果客户批准，就可以继续进行。\n\
  \n## 红队成员是如何协作完成任务的？\n\n我的绝大多数渗透测试都是单人完成的，但也参与过一些团队协作项目，或者我只负责网络、无线或 Web 应用测试的任务，但即使在那些情况下，我们也会一起编写报告。我最喜欢且最有趣的经历之一是与其他三名渗透人员一起进行内部网络渗透测试。我们有五天时间来尽可能完成工作，并尝试在第一天的前半部分保持不被发现。测试本身并没有什么特别的，但与其他团队成员一起工作非常有趣。我们合作得非常出色，这使得任务取得了巨大的成功。\n\
  \n## 在行动完成后，你如何对蓝队进行简报（Debriefing）并提供支持？\n\n在简报期间，我喜欢分享在执行期间看到的良好实践和控制措施。我会让蓝队、IT\
  \ 团队或开发团队知道我们在同一阵线上，我正与他们一起保障环境安全。我会努力设身处地，理解他们的观点。曾在蓝队和系统管理员工作的经历让我理解了他们的视角、挑战和顾虑。那是他们需要支持和防御的环境。在测试环境时，我会记住这一点，尽力防止服务中断或对操作系统或应用程序造成损坏。\n\
  \n## 关于编写良好的报告有哪些实用的建议？\n\n报告非常重要，它是你所有努力和心付出的唯一证明。它就像是一份客户安全状况的“成绩单”。你希望你的报告能反映出你安全评估的价值。测试时要详尽，并用截图和详细解释透彻地记录你的发现。写作要清晰，确保在执行摘要中使用非技术人员也能读懂的术语。管理层和业务人员最关注报告的这部分。使用正确的语法和拼写，并在提交给客户之前经过审核。\n\
  \n## 你如何确保你的项目结果对于需要完整叙述和背景的人来说具有价值？\n\n首先，你需要确保专注于渗透测试的目标，并努力在测试期间实现这些目标。其次，确保为你的发现提供足够的细节和清晰度。第三，在这种情况下，要在修复计划上投入更多精力。第四，你可以尝试通过在执行摘要中先介绍他们的优点来缓解冲击。让他们知道哪些做法是正确的。\n\
  \n## 是什么区分了红队成员？\n\n专业素养、准时和准备充分是关键。书面和口头沟通能力都至关重要。如果我们没有发现任何东西，我们需要诚实。\n\n# 结语\n\
  \n## 关于编写良好的报告有哪些技巧？\n\n- 及时回答后续问题。从客户处收集反馈。\n- 突出客户表现良好的领域。\n- 使用标准模板编写报告并制定风格指南。\n\
  - 双重检查拼写，并与同事协作。\n- 测试时做笔记；随着进度进行记录/截图。在结束之前不必担心细节和格式。\n- 语言简洁、无歧。简洁的写作可以防止读者疲劳。不要使用术语或炫耀技能。你被聘用是因为你的专业，客户已经知道你很练了。\n\
  - 提供如何预防、检测和修复的建议。你的发现应该是可操作的。帮助建立支持修复工作的理由。提供风险评分以确定修复优先级。\n- 理解你的目标，编写与目标保持一致的报告，并了解你的受众。高层管理人员需要简的报告，而技术管理层和员工需要更详细的发现。\n\
  - 描绘攻击路径，并提供如何重新结果的步骤。结果应易于复制。使用图表、图片和视频。\n- 让你的报告引人入胜，像在讲述故事一样。展示投入的工作量，并可能激励他人。\n\
  \n## 在招聘红队成员时，你寻找哪些非技术技能？\n\n- 不抱怨执行“枯燥”工作的人。\n- 能够理解大局且不丢失目标的人。\n- 能够额外付出并让行业变得更好的人。\n\
  - 在其他网络安全（非网络安全）领域具有多元背景的人。\n- 专业素养、准时和准备充分。\n- 魅力、舞台表现能力和幽默感。\n- 耐心、坚持、韧性以及处理棘困情况的能力。\n\
  - 渴望并能够团队合作。\n- 自我意识、愿意提问、愿意承认自己无所不知，且具有反思精神。\n\n\n\n\n- 可信赖、诚信和责任感（内部控制点）\n- 同理心、同情和谦逊\n\
  - 对学习的热爱、愿意更新技能树、虚心受教、“黑客心态”、质疑一切、创造力、好奇心\n- 强烈的自我驱动力、充满激情\n- 出色的沟通能力、向外行人士解释技术概念的能力、写作能力、倾听能力\n\
  \n## 在以不同方式解决问题方面，优秀的红队成员如何与众不同脱颖而出？\n\n- 他们是优秀的沟通者，并对自己的能力充满自信。\n- 他们非常谨慎，在尝试实战之前都会在实验室环境中进行测试。他们在行动之前会制定计划和策略。\n\
  - 他们理解自己的活动对组织所代表的价值，并理解自己作为红队成员的核心职。\n- 他们专精特定领域或拥有小众技能。同时，他们对系统和安全的基础有深入的理解。\n\
  - 他们很谦逊，不会假设自己了解一切的运作原理。他们能够在自己在某方面出错时承认错误。\n- 他们耐心且执着。\n- 他们能够快速评估攻击面。由于他们对环境高度敏感，他们不需要翻遍每一块石头。他们具备局势意识。\n\
  - 他们像攻击者一样思考、计划和行动。他们拥有“攻击者”或对抗性心态。\n- 他们做事严谨且注重细节。他们能够长时间专注于工作。\n- 他们热爱自己的事业并永不停止学习。他们拥有顽强的好奇心。\n\
  - 他们知道自己在团队中的定位以及如何提供价值。他们能够整合资源，以创建一个凝聚力强且运作灵活的团队。\n- 他们能够在高压环境下成功地解决问题。他们能够现场进行批判性思考，并在技术未按计划奏效时具备出适应性。\n\
  - 他们能够跳出框架思考，以创造性的思维方式处理问题。他们质疑一切。\n\n# WILEY 用户许可协议\n\n请访问 [www.wiley.com/go/eula](http://www.wiley.com/go/eula)\
  \ 获取 Wiley 电子书用户许可协议 (EULA)。\n\n"
