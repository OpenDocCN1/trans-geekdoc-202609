  \n[content]\n\n\n# 致谢\n\n红队测试如果没有优秀的社区和贡献者，就无法存在。\n\n特别感谢每一位对本书提供支持、反馈和测试的人员。\n\n\
  感谢所有读者的支持。\n\n\n\n\n\n## 17. 关于编写优秀的报告，有哪些实用的建议？\n\n## 18. 你如何确保你的程序结果对于需要完整叙述和背景的人来说具有价值？\n\
  \n\n## 19. 除了指出不足之处外，你如何建议安全改进的措施？\n\n\n## 20. 在招聘和面试红队成员时，你寻找哪些非技术性技能或态度？\n\n\n\
  ## 21. 从不同角度解决问题来看，优秀的红队成员与众众何何之处？\n\n\n所以，这些就是我们向 47 位专家（包括我自己）提出的 21 个问题。在介绍其他\
  \ 46 个人之前，我想先分享一下我的观点来开个场。希望大家喜欢！\n\n**Marcus J. Carey**\n\n**2019 年 4 月 12 日**\n\
  \n# 1 Marcus J. Carey\n\n> “如今，开源工具主导了红队领域，让更多的人能够熟悉并练习。”\n\n\n**Twitter:** @marcusjcarey\
  \ • **网站:** [`www.linkedin.com/in/marcuscarey/`](https://www.linkedin.com/in/marcuscarey/)\n\
  \nMarcus J. Carey 是一位网络安全社区倡者和创业创始人，拥有超过 25 年保护政府和商业敏感数据的经验。他在美国海军密码学部开启了他的网络安全职业，随后在国家安全局（NSA）任职。\n\
  \n## 你是如何开始红队的？\n\n我的红队旅程有趣的地方在于，直到我被解雇并不得不维持生计之前，我在技术上并不是一名带薪的红队成员。我在东海岸的一家咨询公司从事渗透测试和产品开发。\n\
  \n通过在国防网络犯罪中心（DC3）工作，我获得了红队技能。在那里我从事了研究、教学和课程开发。令人惊讶的是，可以使用你可以想象的所有红队工具，以及地球上所有的数字取证工具。我有幸与一位名叫\
  \ Johnny Long 的人一起工作，他本身就是一个非常厉害的黑客和红队专家。\n\n我非常幸运能处于这些职位，为担任红队角色做好准备。如今，开源工具主导了红队领域，让更多的人能够熟悉并练习。\n\
  \n他们说运气是准备遇上了机会。虽然被解雇很糟糕，但拥有红队技能来付清账单也是一种幸运。\n\n## 获得红队工作的最佳方法是什么？\n\n人们直接进入红队工作并不常见。最好的方法是拥有或获得诸如网络互、系统管理或软件工程等技能，并从蓝队角色开始。进入蓝队角色将使你获得网络安全经验，并与你理想职位中的人建立人脉。\n\
  \n你可以在当地活动和区域网络安全会议上，从你组织的内部和外部建立人脉。有几种专门为红队测试设计的认证可以让你被那些想要增加人力资源的红队关注。\n\n## 一个人如何在不触犯法律的情况下获得红队技能？\n\
