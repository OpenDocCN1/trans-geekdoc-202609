  trans: "\n`Illuminate\\Contracts\\Auth\\UserProvider` 的实现负责从持久化存储系统（如 MySQL、MongoDB\
    \ 等）中检索 `Illuminate\\Contracts\\Auth\\Authenticatable` 的实现类。这两个接口使得 Laravel 的身份验证程序能够不受独立于用户数据的存储方式或用于表示授权用户的类类型而独立运行：\n\
    \n让我们检查一下 `Illuminate\\Contracts\\Auth\\UserProvider` 契约：\n\n```php\n<?php\n\n\
    namespace Illuminate\\Contracts\\Auth;\ninterface UserProvider\n{\n    public\
    \ function retrieveById($identifier);\n    public function retrieveByToken($identifier,\
    \ $token);\n    public function updateRememberToken(Authenticatable $user, $token);\n\
    \    public function retrieveByCredentials(array $credentials);\n    public function\
    \ validateCredentials(Authenticatable $user, array $credentials);\n}\n```\n\n\
    `retrieveById` 方法通常从 MySQL 数据库中获取描述用户的键，例如自增 ID。该方法应该检索并返回与 ID 匹配的 `Authenticatable`\
    \ 实现类。\n\n`retrieveByToken` 方法根据用户唯一的 `$identifier` 和“记住我” `$token` 返回用户，该 `$token`\
    \ 通常保存在名为 `remember_token` 的数据库列中。此方法与上一个一样，应该返回具有匹配令牌标记的 `Authenticatable` 实现类。\n\
    \n`updateRememberToken` 函数用更新后的 `$token` 替换 `$user` 对象的 `remember_token`。在“记住我”验证尝试成功或用户注销时，会为用户分配一个新的令牌。\n\
    \n在尝试对应用程序进行验证时，`retrieveByCredentials` 函数接受传递给 `Auth::attempt` 方法的凭据数组。随后程序应该“查询”底层持久化存储，寻找与提供的凭据匹配的用户。此函数通常会执行一个带有“where”条件的查询，寻找“username”与\
    \ `$credentials['username']` 值匹配的用户记录。该方法应返回一个 `Authenticatable` 实现类。此方法不应尝试验证或身份验证密码。\n\
    \n为了验证用户，`validateCredentials` 函数应该将提供的 `$user` 与 `$credentials` 进行匹配。例如，为了比较\
    \ `$user->getAuthPassword()` 的值与 `$credentials['password']` 的值，此函数通常会利用 `Hash::check`\
    \ 方法。该方法根据是否有效返回 `true` 或 `false`。\n\n# Authenticatable 契约\n\n现在我们已经检查了 `UserProvider`\
    \ 上的每个函数，让我们来看 `Authenticatable` 契约。\n\n![](img/Figure-6.2.jpg)\n\n**图 6.2:**\
    \ Authenticatable 契约返回值\n\n记住，用户提供程序应该从 `retrieveById`、`retrieveByToken` 和 `retrieveByCredentials`\
    \ 方法返回这些接口实现。\n\n```php\n<?php\n\nnamespace Illuminate\\Contracts\\Auth;\ninterface\
    \ Authenticatable\n{\n    public function getAuthIdentifierName();\n    public\
    \ function getAuthIdentifier();\n    public function getAuthPassword();\n    public\
    \ function getRememberToken();\n    public function setRememberToken($value);\n\
    \    public function getRememberTokenName();\n}\n```\n\n此接口非常直观。`getAuthIdentifierName`\
    \ 函数应该返回用户的`primary key`字段的名称，`getAuthIdentifier` 方法应该返回用户的`primary key`。在使用 MySQL\
    \ 后端时，这很可能是用户记录的自增主键。`getAuthPassword` 函数应该返回用户的哈希密码。\n\n此接口使身份验证系统能够与任何用户类交互，而不受所使用的\
    \ ORM 或存储抽象层的影响。Laravel 默认在 `app/Models` 目录下提供了一个 `App\\Models\\User` 类，它实现了此接口。\n\
    \n# 实现授权策略与门（Gates）\n\n在结合身份验证和授权引入安全性时，一个关键方面是跟踪当前允许进入系统的用户。经过身份验证和授权的用户也应该被跟踪。\n\
    \n在对应用程序进行身份验证时，你可能需要跟踪已登录用户的会话。你可以使用 `Auth` 门面的 `logout` 函数来手动注销用户。\n\n建议在调用\
    \ `logout` 函数的同时，让会话失效并刷新会话令牌。\n\n```php\nuse Illuminate\\Http\\Request;\nuse\
    \ Illuminate\\Http\\RedirectResponse;\nuse Illuminate\\Support\\Facades\\Auth;\n\
    \n/**\n * 注销用户。\n */\npublic function logout(Request $request): RedirectResponse\n\
    {\n    Auth::logout();\n    $request->session()->invalidate();\n    return redirect('/home');\n\
    }\n"
- fmt: "\nFollowing that, we’ll construct a route to handle the form request from\
    \ the “confirm password” page. This route will be in charge of confirming the\
    \ user’s password and forwarding them to their desired destination:\n\n```php\n\
    use Illuminate\\Http\\Request;\nuse Illuminate\\Support\\Facades\\Hash;\nuse Illuminate\\\
    Support\\Facades\\Redirect;\n\nRoute::post(‘confirmPassword’, function (Request\
    \ $request) {\n    if (! Hash::check($request->password, $request->user()->password))\
    \ {\n        return back()->withErrors([\n            ‘password’ => [‘Incorrect\
    \ Password’]\n        ]);\n    }\n    $request->session()->passwordConfirmed();\n\
    \    return redirect()->intended();\n})->middleware([‘auth’, ‘throttle:6,1’]);\n\
    ```\n\nLet’s take a closer look at this path before going on. First, the request’s\
    \ `password` field is checked to see if it matches the password of the authorized\
    \ user. If the password is correct, we must notify Laravel’s session that the\
    \ user has validated their password. The `passwordConfirmed` method adds a timestamp\
    \ to the user’s session, which Laravel may use to detect when the user last verified\
    \ their password. Finally, we may guide the user to their desired location.\n\n\
    # Authentication Custom Guards\n\nUsing the `extend` method on the `Auth` facade,\
    \ you may create your own authentication guards. You should make a call to a service\
    \ provider’s `extend` method. Because Laravel already has an `AuthServiceProvider`,\
    \ we can paste the following code into it:\n\n```php\n<?php\nnamespace App\\Providers;\n\
    use App\\Services\\Auth\\JwtGuard;\nuse Illuminate\\Contracts\\Foundation\\Application;\n\
    use Illuminate\\Foundation\\Support\\Providers\\AuthServiceProvider as ServiceProvider;\n\
    use Illuminate\\Support\\Facades\\Auth;\n\nclass AuthServiceProvider extends ServiceProvider\n\
    {\n    /**\n     * Register any application authentication / authorization services.\n\
    \     */\n    public function boot(): void\n    {\n        Auth::extend(‘jwt’,\
    \ function (Application $app, string $name, array $config) {\n            // Return\
    \ an instance of Illuminate\\Contracts\\Auth\\Guard\n            return new JwtGuard(Auth::createUserProvider($config[‘provider’]));\n\
    \        });\n    }\n}\n```\n\nAs seen in the preceding example, the callback\
    \ supplied to the `extend` method should return an `Illuminate\\Contracts\\Auth\\\
    Guard` implementation. This interface provides a few methods that must be implemented\
    \ to define a custom guard. Once you’ve defined your own guard, you can use it\
    \ in the `guards` configuration of your `auth.php` configuration file:\n\n```php\n\
    ‘guards’ => [\n    ‘api’ => [\n        ‘driver’ => ‘jwt’,\n        ‘provider’\
    \ => ‘users’,\n    ],\n],\n```\n\n# Closure Request Guards\n\nUsing the `Auth::viaRequest`\
    \ function is the simplest approach to construct a bespoke HTTP request-based\
    \ authentication system. Using a single closure, you can easily create your authentication\
    \ procedure.\n\nTo begin, invoke the `Auth::viaRequest` function from your `AuthServiceProvider`’s\
    \ startup method. The first argument to the `viaRequest` method is the name of\
    \ an authentication driver. Any string that describes your custom guard can be\
    \ used as this name. The method’s second parameter should be a closure that receives\
    \ the incoming HTTP request and returns a user instance or `null` if authentication\
    \ fails:\n\n```php\nuse App\\Models\\User;\nuse Illuminate\\Http\\Request;\nuse\
    \ Illuminate\\Support\\Facades\\Auth;\n\n/**\n * Register any application authentication\
    \ / authorization service\n */\npublic function boot(): void\n{\n    Auth::viaRequest(‘customToken’,\
    \ function (Request $request) {\n        return Employee::where(‘token’, (string)\
    \ $request->token)->first();\n    });\n}\n```\n\nOnce your custom authentication\
    \ driver has been developed, you can add it as a driver to your `auth.php` configuration\
    \ file’s guards configuration:\n\n```php\n‘guards’ => [\n    ‘api’ => [\n    \
    \    ‘driver’ => ‘customToken’,\n    ],\n],\n```\n\nFinally, when adding the authentication\
    \ middleware to a route, you may refer to the guard:\n\n```php\nRoute::middleware(‘auth:api’)->group(function\
    \ () {\n    // Code Logic\n})\n```\n\n# Invalidate Sessions across Multiple Devices\n\
    \nLaravel also has a technique for invalidating and “logging out” a user’s sessions\
    \ that are active on other devices without invalidating their current session.\
    \ When a user changes or updates their password, you may use this functionality\
    \ to invalidate sessions on other devices while keeping the current device authorized.\n\
    \nBefore you begin, ensure that the `Illuminate\\Session\\Middleware\\AuthenticateSession`\
    \ middleware is present on the routes that should receive session authentication.\
    \ This middleware should typically be placed on a route group definition so that\
    \ it may be applied to the bulk of your application’s routes. The `AuthenticateSession`\
    \ middleware is associated with a route by default through the `auth.session`\
    \ route middleware alias set in your application’s HTTP kernel:\n\n```php\nRoute::middleware([‘auth’,\
    \ ‘auth.session’])->group(function () {\n    Route::get(‘/’, function () {\n \
    \       // Code Logic\n    });\n});\n```\n\nThen, you may utilize the `Auth` facade’s\
    \ `logoutOtherDevices` function. This technique needs the user to validate their\
    \ password.\n\n```php\nuse Illuminate\\Support\\Facades\\Auth;\nAuth::logoutOtherDevices($currentPassword);\n\
    ```\n\n# User Session\n\nOn their login form, many apps have a `remember me` checkbox.\
    \ You may include `remember me` functionality in your application by passing a\
    \ boolean value as the second parameter to the `try` method. When this value is\
    \ set to `true`, Laravel will keep the user authorized indefinitely until they\
    \ log out manually. The `remember_token` column in your `users` table must be\
    \ present since it will be used to hold the “remember me” token.\n\n```php\nuse\
    \ Illuminate\\Support\\Facades\\Auth;\nif (Auth::attempt([‘email’ => $email, ‘password’\
    \ => $password], $remember)) {\n    // The user is saved\n}\n```\n\nIf your application\
    \ supports remember me, you may use the `viaRemember` method to see if the currently\
    \ authorized user was authenticated using the “remember me” cookie:\n\n```php\n\
    use Illuminate\\Support\\Facades\\Auth;\nif (Auth::viaRemember()) {\n    // Code\
    \ Logic\n}\n```\n\n# Additional Authentication Methods\n\nIn order to authenticate\
    \ a user, in addition to the ways mentioned, there are a number of additional\
    \ methods available while developing the Laravel Application.\n\n![Additional\
    \ Authentication Methods]\n**Figure 6.3:** Additional Authentication Methods\n\
    \n# Authenticate a User Instance\n\nIf you need to make an existing user instance,\
    \ the currently authenticated user, you can utilize the `Auth` facade’s `login`\
    \ function. The provided user instance must be an `Illuminate\\Contracts\\Auth\\\
    Authenticatable` implementation. This interface is already implemented in the\
    \ Laravel `App\\Models\\User` model. This authentication technique is handy when\
    \ you already have a valid user instance, such as when a user registers with your\
    \ application:\n\n```php\nuse Illuminate\\Support\\Facades\\Auth;\nAuth::login($user);\n\
    ```\n\nAs the second argument to the `login` function, you can send a boolean\
    \ value. This value determines whether the “remember me” capability for the authorized\
    \ session is desired. Remember that the session will be authenticated continuously\
    \ until the user logs out of the application manually:\n\n```php\nAuth::login($user,\
    \ $remember = true);\n```\n\nIf needed, you may specify an authentication guard\
    \ before calling the login method:\n\n```php\nAuth::guard(‘admin’)->login($user);\n\
    ```\n\n# Authenticate a User By ID\n\nYou may use the `loginUsingId` function\
    \ to authenticate a user by utilizing the main key of their database record. This\
    \ approach requires the main key of the user to be authenticated.\n"
