    \ function () {\n    return UserResource::collection(User::all());\n});\n```\n\
    \n# 数据包装 (Data Wrapping)\n\n当资源响应转换为 JSON 时，外层资源会自动包装在 `data` 键中。例如，以下是典型的资源响应：\n\
    \n```json\n{\n  \"data\": [\n    {\n      \"id\": 1,\n      \"name\": \"Eladio\
    \ Schroeder.\",\n      \"city\": \"NYC\"\n    },\n    {\n      \"id\": 2,\n  \
    \    \"name\": \"Liliana Mayert\",\n      \"city\": \"PUNE\"\n    }\n  ]\n}\n\
    ```\n\n一个 Laravel 分页对象可以发送到自定义资源集合或资源集合的集合函数。\n\n"
- fmt: "\n```php\nuse App\\Http\\Resources\\UserCollection;\n\nuse App\\Models\\User;\n\
    \nRoute::get('/users', function () {\n    return new UserCollection(User::paginate());\n\
    });\n```\n\nMetadata and link keys containing details about the paginator’s status\
    \ are always present in paginated responses:\n\n```json\n{\n  \"data\": [\n  \
    \  {\n      \"id\": 1,\n      \"name\": \"ABC\",\n      \"city\": \"PUNE\"\n \
    \   },\n    {\n      \"id\": 2,\n      \"name\": \"PQR\",\n      \"email\": \"\
    SEATTLE\"\n    }\n  ],\n  \"links\": {\n    \"first\": \"http://example.com/users?page=1\"\
    ,\n    \"last\": \"http://example.com/users?page=1\",\n    \"prev\": null,\n \
    \   \"next\": null\n  },\n  \"meta\": {\n    \"current_page\": 1,\n    \"from\"\
    : 1,\n    \"last_page\": 1,\n    \"path\": \"http://example.com/users\",\n   \
    \ \"per_page\": 12,\n    \"to\": 10,\n    \"total\": 10\n  }\n}\n```\n\nYou may\
    \ define a `paginationInformation` method on the resource if you would like to\
    \ alter the data that appears in the `links` or `meta` keys of the pagination\
    \ response. The `$paginated` data and the array of `$default` information, which\
    \ is an array with the `links` and `meta` keys, will be sent to this method:\n\
    \n```php\npublic function paginationInformation($request, $paginated, $default)\n\
    {\n    $default['links']['custom'] = 'https://example.com';\n    return $default;\n\
    }\n```\n\n# Conditional Relationships\n\nYou may conditionally include relationships\
    \ on your resource answers in addition to loading attributes based on whether\
    \ the connection has previously been loaded on the model. This lets your controller\
    \ choose which relationships to put into the model, and your resource may conveniently\
    \ include those relationships only after they have been loaded. In the end, this\
    \ facilitates avoiding N+1 query issues with your resources.\n\nA relationship\
    \ can be conditionally loaded using the `whenLoaded` method. This approach accepts\
    \ the relationship name rather than the connection itself to prevent needlessly\
    \ loading relationships:\n\n```php\nuse App\\Http\\Resources\\PostResource;\n\n\
    public function toArray(Request $request): array\n{\n    return [\n        'id'\
    \ => $this->id,\n        'name' => $this->name,\n        'city' => $this->city,\n\
    \        'posts' => PostResource::collection($this->whenLoaded('posts')),\n  \
    \      'created_at' => $this->created_at,\n        'updated_at' => $this->updated_at,\n\
    \    ];\n}\n```\n\nIn this case, the resource response will not be delivered to\
    \ the client until the posts key has been deleted in the event that the relationship\
    \ has not loaded.\n\nYou may conditionally include relationship counts on your\
    \ resource answers in addition to conditionally include relationships, depending\
    \ on whether the relationship’s count has been loaded into the model:\n\n```php\n\
    new UserResource($user->loadCount('posts'));\n```\n\nYou may conditionally include\
    \ the count of a relationship in your resource response by using the `whenCounted`\
    \ method. By using this approach, the attribute is not included needlessly if\
    \ the relationships’ count is missing:\n\n```php\npublic function toArray(Request\
    \ $request): array\n{\n    return [\n        'id' => $this->id,\n        'name'\
    \ => $this->name,\n        'city' => $this->city,\n        'posts_count' => $this->whenCounted('posts'),\n\
    \        'created_at' => $this->created_at,\n        'updated_at' => $this->updated_at,\n\
    \    ];\n}\n```\n\n# Resource Response\n\nRoutes and controllers have the option\
    \ of immediately returning resources:\n\n```php\nuse App\\Http\\Resources\\UserResource;\n\
    \nuse App\\Models\\User;\n\nRoute::get('/user/{id}', function (string $id) {\n\
    \    return new UserResource(User::findOrFail($id));\n});\n```\n\nOn occasion,\
    \ though, you might need to alter the outgoing HTTP response before sending it\
    \ to the client. To do this, there are two approaches. The `response` method can\
    \ be chained onto the resource first. An `Illuminate\\Http\\JsonResponse` object\
    \ will be returned by this function, allowing you complete control over the response’s\
    \ headers:\n\n```php\nuse App\\Http\\Resources\\UserResource;\n\nuse App\\Models\\\
    User;\n\nRoute::get('/user', function () {\n    return (new UserResource(User::find(1)))\n\
    \        ->response()\n        ->header('X-Value', 'True');\n});\n```\n\nAs an\
    \ alternative, the resource itself may specify a `withResponse` method. When the\
    \ resource is returned in a response as the outermost resource, this procedure\
    \ will be called:\n\n```php\n<?php\n\nnamespace App\\Http\\Resources;\n\nuse Illuminate\\\
    Http\\JsonResponse;\nuse Illuminate\\Http\\Request;\nuse Illuminate\\Http\\Resources\\\
    Json\\JsonResource;\n\nclass UserResource extends JsonResource\n{\n    public\
    \ function toArray(Request $request)\n    {\n        return [\n            'id'\
    \ => $this->id,\n            'name' => $this->name,\n            'city' => $this->city,\n\
    \        ];\n    }\n\n    public function withResponse(Request $request, JsonResponse\
    \ $response)\n    {\n        return $response->header('X-Value', 'True');\n  \
    \  }\n}\n```\n\n# Laravel Passport\n\nLaravel Passport provides a full OAuth2\
    \ server implementation for your Laravel application. It provides all the features\
    \ you need to implement OAuth2 authentication out of the box.\n\n# Installing\
    \ and Setup\n\nUsing the Composer package manager, install Passport:\n\n```bash\n\
    composer require laravel/passport\n```\n\nAfter installing the package, you should\
    \ migrate your database:\n\n```bash\nphp artisan migrate\n```\n\nThe `passport:install`\
    \ command should then be run to generate the encryption keys and create the necessary\
    \ tables:\n\n```bash\nphp artisan passport:install\n```\n\nAdd the `Laravel\\\
    Passport\\HasApiTokens` trait to your `User` model (or whichever model you use\
    \ for authentication):\n\n```php\nuse Laravel\\Passport\\HasApiTokens;\n\nclass\
    \ User extends Authenticatable\n{\n    use HasApiTokens, ...;\n}\n```\n\n# Configuration\n\
    \nLong-lived access tokens that expire after a year are automatically issued by\
    \ Passport. Use the `tokensExpireIn`, `refreshTokensExpireIn`, and `personalAccessTokensExpireIn`\
    \ methods to set a longer or shorter token lifespan.\n\nThe `App\\Providers\\\
    AuthServiceProvider` class in your application’s boot procedure is where these\
    \ methods should be called:\n\n```php\npublic function boot(): void\n{\n    Passport::tokensExpireIn(now()->addDays(15));\n\
    \    Passport::refreshTokensExpireIn(now()->addDays(30));\n    Passport::personalAccessTokensExpireIn(now()->addMonths(6));\n\
    }\n```\n\nTo ensure that the secrets of your clients are hashed before being saved\
    \ in your database, you should invoke the `Passport::hashClientSecrets` function\
    \ within your `App\\Providers\\AuthServiceProvider` class startup method:\n\n\
    ```php\nuse Laravel\\Passport\\Passport;\n\nPassport::hashClientSecrets();\n```\n\
    \nAll of your client secrets will only be visible to the user as soon as they\
    \ are created, after they are enabled. If the plain-text client secret value is\
    \ lost, it cannot be recovered because it is never kept in the database.\n"
