    ## 开发

    ## 领域

    ## 故障排除


    # 云端部署基础


    云服务对于 Laravel 应用程序高效且可扩展的运行至关重要。使用云基础设施具有多种优势，包括更高的性能、增强安全性以及更容易的管理。理解云端部署的基础知识对于开发者和公司确保部署过程成功至关重要。


    在将 Laravel 应用迁移到云端时，考虑的最重要因素之一是选择正确的云服务提供商。主要的云计算公司，如 `Amazon Web Services (AWS)`、`Microsoft
    Azure` 和 `Google Cloud Platform (GCP)`，提供了适用于特定应用程序需求的各种化服务。定价、可扩展性、安全特性和地理覆盖范围均可用于特定的
    Laravel 应用选择最佳的云提供商。


    为应用程序搭建基础设施是云端部署的一个关键阶段。配置虚拟机、存储资源、网络组件和安全标准都是其中的一部分。根据应用程序的范围和需求，部署 Laravel 应用通常涉及创建虚拟服务器或使用无服务器（serverless）计算替代方案。使用
    `AWS Elastic Beanstalk`、`Azure App Service` 或 `Google App Engine` 等解决方案可以加速部署过程，让开发者专注于应用程序开发而非基础设施维护。


    容器化已成为在云端部署 Laravel 应用的流行方法。`Docker` 和 `Kubernetes` 等技术有助于将应用程序及其依赖项封装到可迁移容器中，实现跨云环境的无缝部署。像
    `Kubernetes` 这样的容器编排工具有助于管理容器化应用程序的部署、扩展和监控，确保高可用性和可靠性。


    在将 Laravel 应用交付到云端时，包含强大的安全措施至关重要。这包括保护传输中和存储的敏感数据、执行访问控制规定以及使用加密机制。使用如 `AWS Identity
    and Access Management (IAM)` 或 `Azure Active Directory` 等云原生安全服务有助于通过更好的用户管理和身份验证来提高应用程序的整体安全态势。


    持续集成和持续部署（CI/CD）流水线可以加速开发工作流，并确保 Laravel 应用快速、无误地部署。开发者可以使用 `Jenkins`、`GitLab
    CI/CD` 和 `GitHub Actions` 等集成技术来自动化测试、构建过程和部署操作，从而带来更敏捷、高效的开发周期。通过将 CI/CD 流水线纳入自动化测试和质量保证方法，开发者可以在开发周期的早期检测并修复问题，从而使
    Laravel 应用的云端部署更加稳定可靠。


    监控和管理云端 Laravel 应用的性能对于确保最佳功能和用户体验至关重要。实施 `AWS CloudWatch`、`Azure Monitor` 或 `Google
    Cloud Monitoring` 等监控工具可以实时跟踪应用程序指标、资源利用率和系统健康状况。主动监控有助于检测和解决性能问题、瓶颈和潜在故障，确保 Laravel
    应用在云环境中的无缝运行。


    # 云提供商概述


    在考虑 Laravel 应用的云端部署时，了解各种云提供商的基础知识至关重要。在这里，我们将提供三个热门云提供商——`Heroku`、`Amazon Web
    Services (AWS)` 和 `Google Cloud` 的概述，以突出它们的独特功能和优势。


    # Amazon Web Services


    Amazon Web Services (AWS) 是云计算领域的主要参与者，提供针对开发者和组织不同需求的完整服务组合。通过如用于虚拟服务器部署的 `Amazon
    Elastic Compute Cloud (EC2)` 和用于托管数据库服务的 `Amazon RDS` 等服务，`AWS` 为托管 Laravel 应用提供了一个可扩展且安全的平台。


    `AWS` 还提供了大量用于应用程序监控、安全和可扩展性的工具和服务，让开发者能够创建强大且高用的 Laravel 应用程序。


    虽然 `AWS` 海量的服务可能会让初学者感到畏惧，但它为复杂的应用程序安装提供了无与伦比的灵活性和扩展性。


    # Heroku


    Heroku 以其易用性和友好的界面而闻名，对于寻求快速部署且不想处理复杂设置烦恼的开发者来说是一个极佳的选择。`Heroku` 通过与 `Git` 集成简化了部署过程，让开发者专注于应用程序开发。


    它支持多种编程语言，包括 `PHP`，是交付 Laravel 应用的理想选择。然而，与其他云提供商相比，`Heroku` 的灵活性可能受限。


    # Google Cloud


    Google Cloud 是另一个以性能、可靠性和可扩展性闻名的云平台。凭借其全球数据中心网络和强大的网络能力，在速度和可访问性方面具有竞争优势，特别是对于全球用户群的应用。


    Google Cloud 包括用于虚拟机部署的 `Google Compute Engine` 和用于托管服务的 `Google Cloud SQL`，为开发者提供了一个安全且可扩展的环境。


    对数据分析和机器学习能力的强调增加了其对希望集成现代技术的开发者的吸引力。


    根据 Laravel 应用的需求，这些云提供商中的每一个都有独特的特性。


    考虑易用性、可扩展性、性和成本等变量有助于开发者和公司为其部署需求选择最佳云提供商。


    通过使用 `Heroku`、`AWS` 或 `Google Cloud` 的功能，开发者可以确保 Laravel 应用的轻松部署和高效运行，提供理想的用户体验并推动业务成功。


    # 使用 Vapor 部署 Laravel


    Laravel Vapor 是一个由 `AWS Lambda` 驱动的自动扩展无服务器 Laravel 部署工具。使用 `Vapor` 管理您的 Laravel
    基础设施，享受扩展性和简单性。


    `Vapor` 封装了在 AWS Lambda 上运行 Laravel 应用的复杂性，以及与 `SQS` 队列、数据库、`Redis` 集群、网络、`CloudFront
    CDN` 以及其他服务的交互。


    ```

    ![](img/Figure-10.1.jpg)

    ```

    **图 10.1:** Vapor 特性


    Vapor 的前提条件 – `PHP 7.3+` 和 `Laravel 6.0+`


    # 安装


    通过 Laravel Vapor 进行部署需要使用 `Vapor CLI`。运行以下命令进行全局安装或项目级安装：


    全局：


    ```bash

    composer global require laravel/vapor-cli --update-with-dependencies

    ```


    每个项目：


    ```bash

    composer require laravel/vapor-cli --update-with-dependencies

    ```


