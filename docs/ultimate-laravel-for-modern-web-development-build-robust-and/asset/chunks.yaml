    # [Latest Version Release Changes](#toc.xhtml#s13a)\n\nLaravel 10 is the current\
    \ Laravel version in use. If you already have a previous version of Laravel, you\
    \ can continue to upgrade it. Alternatively, if you are new, follow the next section\
    \ of the chapter on how to install Laravel.\n\n# [How to Upgrade](#toc.xhtml#s14a)\n\
    \nIn order to upgrade any existing Laravel projects to Laravel 10, updating the\
    \ dependencies is the most crucial step. The documentation for the upgrade is\
    \ available at [https://laravel.com/docs/10.x/upgrade](https://laravel.com/docs/10.x/upgrade)\n\
    \nLet’s explore how to upgrade to Laravel 10 to get the latest features and make\
    \ the necessary changes to upgrade our existing Laravel applications.\n\n# [Dependencies](#toc.xhtml#s15a)\n\
    \nLaravel requires PHP 8.1.0 or higher and Composer version 2.20 or higher.\n\n\
    The following dependencies need to be upgraded in the Laravel applications `composer.json`\
    \ file:\n\n| **Dependency** || **Version** |\n\n| --- | --- |\n\n| laravel/framework\
    \ || ^10.0 |\n\n| laravel/sanctum || ^3.2 |\n\n| doctrine/dbal || ^3.0 |\n\n|\
    \ spatie/laravel-ignition || ^2.0 |\n\n| laravel/passport || ^11.0 |\n\n**Table\
    \ 1.1:** `composer.json` dependencies for Laravel 10\n\nAdditionally, if you wish\
    \ to use PHPUnit 10, then delete the `processUncoveredFiles` attribute from the\
    \ `<coverage>` section of `phpunit.xml`, and update the following in the `composer.json`\
    \ file:\n\n| **Dependency** || **Version** |\n\n| --- | --- |\n\n| nunomaduro/collision\
    \ || ^7.0 |\n\n| phpunit/phpunit || ^10.0 |\n\n**Table 1.2:** `composer.json`\
    \ dependencies for Laravel 10 if using PHPUnit 10\n\nFurthermore, verify support\
    \ for any other third-party packages used in your application with Laravel 10.\n\
    \n# [Minimum Stability](#toc.xhtml#s16a)\n\nThe `minimum-stability` setting in\
    \ the `composer.json` needs to be set to the value `stable:`\n\n`“minimum-stability”:\
    \ “stable”,`\n\nThe default value of `minimum-stability` is now stable; so you\
    \ may also choose to remove this completely.\n\n# [Public Path Binding](#toc.xhtml#s17a)\n\
    \nUpdate your code in your Laravel application to invoke the `usePublicPath` method\
    \ of the `Illuminate\\Foundation\\Application` object. This should be done instead\
    \ of customizing its `public path` binding to `path.public` into the container:\n\
    \n`app()->usePublicPath(__DIR__.’/public’);`\n\n# [Redis Cache Tags](#toc.xhtml#s18a)\n\
    \nThe Redis cache tag has been rewritten in the Laravel version update for better\
    \ performance and efficient storage capabilities. Laravel has a new `cache:prune-stale-tags`\
    \ Artisan command that needs to be scheduled in the application’s `App\\Console\\\
    Kernel` class:\n\n`$schedule->command(‘cache:prune-stale-tags’)->hourly();`\n\n\
    `Adding the above scheduled job will corporate the latest update.`\n\n# [Database\
    \ Expressions](#toc.xhtml#s19a)\n\nThe database expressions have been rewritten\
    \ in Laravel 10 to make it possible to add functionalities in the future.\n\n\
    The following method and the manual casting need to be replaced with the `getValue`\
    \ method:\n\n*   Manual casting using (`string)`\n\n*   `_ _toString` method\n\
    \nCasting expression using the **(string)** is not supported in this version.\n\
    \n# [Eloquent](#toc.xhtml#s20a)\n\nThe `$dates` property of the Eloquent model\
    \ is deprecated. The application should update the instances with the `$casts`\
    \ property.\n\nFor example:\n\n`protected $casts = [`\n\n`‘deployed_at’ => ‘datetime’,`\n\
    \n`];`\n\n# [Testing](#toc.xhtml#s21a)\n\nThe `MocksApplicationServices` trait\
    \ is removed and deprecated.\n\nThe trait provided the following methods:\n\n\
    *   `expectsEvents`\n\n*   `expectsJobs`\n\n*   `expectsNotifications`\n\nThese\
    \ have to be replaced with the following methods (in order):\n\n*   `Event::fake`\n\
    \n*   `Bus::fake`\n\n*   `Notification::fake`\n\n**The Language Directory**\n\n\
    The Laravel application skeleton does not support the `lang` directory. Any new\
    \ Laravel applications can be published using the `lang:publish` command as follows:\n\
    \n`php artisan lang:publish`\n\n# [Installation and Setup of Laravel Development\
    \ Environment](#toc.xhtml#s22a)\n\nIn this section, we will look at the setup\
    \ of the Laravel development based on the operating system of the machine. For\
    \ the three commonly used operating systems – Windows, Mac, and Linux – the requirement\
    \ is to have PHP and Composer installed on the machine.\n\n# [Installing PHP](#toc.xhtml#s23a)\n\
    \nWe will guide you through the process of installing PHP on both Mac and Windows\
    \ systems.\n\n# [Mac](#toc.xhtml#s24a)\n\nTo install PHP on a Mac machine, Homebrew\
    \ provides a direct and easy way to install PHP.\n\nTo install Homebrew on the\
    \ machine, visit [www.brew.sh](http://www.brew.sh) and follow the instructions.\n\
    \nAlternatively, you can run the following command on the terminal to install\
    \ Homebrew:\n\n`/bin/bash -c`\n\n`“$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)”`\n\
    \nNext, run the following command to install PHP:\n\n`brew install php`\n\nThis\
    \ will install the latest PHP version on the machine and also take care of any\
    \ environment variable settings, and setting the PATH on the machine.\n\n# [Windows](#toc.xhtml#s25a)\n\
    \nThe following steps will enable you to install PHP on a Windows machine:\n\n\
    1.  Visit the `Downloads` section on [www.php.net](http://www.php.net)\n\n   \
    \ ![](images/Figure-1.2.jpg)\n\n    **Figure 1.2:** Downloads Section on [www.php.net](http://www.php.net)\n\
    \n2.  Select `Windows Downloads`.\n\n    ![](images/Figure-1.3.jpg)\n\n    **Figure\
    \ 1.3:** Windows Download Section on [www.php.net](http://www.php.net)\n\n3. \
    \ Download the thread-safe version**:**\n\n    It is imperative to select the\
    \ thread-safe version. The thread-safe version for PHP 8.2 is highlighted with\
    \ the blue box in *[Figure 1.4](#c01.xhtml#fig1_4)*:\n\n    ![](images/Figure-1.4.jpg)\n\
    \n    **Figure 1.4:** Thread-safe PHP version\n\n4.  Extract the downloaded file.\n\
    \n5.  Copy the extracted folder to the `Program Files` folder on your machine.\n\
    \n6.  Allow Windows the permission to paste the extracted folder.\n\n**Setting\
    \ the environment variable:**\n\n1.  Copy the address of the folder in the `Program\
    \ Files` of the folder above.\n\n2.  Click the `Start` Menu and open `Edit the\
    \ system environment variables`.\n\n3.  Click `Environment Variables`.\n\n4. \
    \ Navigate to `System Variables` and `Edit` the PATH variable.\n\n5.  Add the\
    \ copied address from above by selecting `New` and pasting the address of the\
    \ extracted folder in `Program Files`.\n\n6.  Click `OK` to add, and then click\
    \ `OK` to save changes.\n\nPHP is now successfully installed on your Windows machine.\n\
    \nTo verify the installation of PHP, open the command prompt and check the version\
    \ of PHP installed by running the following command:\n\n`php -v`\n\nThe command\
    \ prompt should now display the version of PHP installed, indicating a successful\
    \ installation.\n\n# [Installing Composer](#toc.xhtml#s26a)\n\nThe dependency\
    \ required to be installed after PHP is Composer. Based on the operating system\
    \ you are using, follow the steps to install Composer.\n\n# [Mac](#toc.xhtml#s27a)\n\
    \nTo install Composer on Mac, there are two methods – via Installer and via Homebrew.\
