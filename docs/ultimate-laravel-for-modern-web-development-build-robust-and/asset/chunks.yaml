  trans: "\n\n为了分配中间件组，其语法与将中间件链接到路由和控制器的方法相似。这有助于在 Laravel 应用程序代码中启用逻辑，并将中间件附加到路由上。\n\
    \n```php\nRoute::get('/', function () {\n    // Code Logic\n})->middleware('web');\n\
    \nRoute::middleware(['web'])->group(function () {\n    // Code Logic\n});\n```\n\
    \n`App\\Providers\\RouteServiceProvider` 会开箱自动将 `web` 和 `api` 中间件组应用到应用程序中相应的\
    \ `routes/web.php` 和 `routes/api.php` 文件。\n\n# 中间件排序\n\n极情况下，你可能要求中间件按照精确的顺序运行，但你无法控制它们在分配到路由时的出现顺序。在这种情况下，可以使用\
    \ `app/Http/Kernel.php` 文件中的 `$middlewarePriority` 属性来指定中间件的优先级。\n\n你的 HTTP 内核默认可能没有此属性。如果它不存在，你可以复制它的默认定义：\n\
    \n```php\n/**\n * 优先级排序的中间件列表。\n *\n * 这强制非全局中间件始终按照给定的顺序执行。\n *\n * @var string[]\n\
    \ */\nprotected $middlewarePriority = [\n    \\Illuminate\\Foundation\\Http\\\
    Middleware\\HandlePrecognitiveRequests::class,\n    \\Illuminate\\Cookie\\Middleware\\\
    EncryptCookies::class,\n    \\Illuminate\\Session\\Middleware\\StartSession::class,\n\
    \    \\Illuminate\\View\\Middleware\\ShareErrorsFromSession::class,\n    \\Illuminate\\\
    Contracts\\Auth\\Middleware\\AuthenticatesRequests::class,\n    \\Illuminate\\\
    Routing\\Middleware\\ThrottleRequests::class,\n    \\Illuminate\\Routing\\Middleware\\\
    ThrottleRequestsWithRedis::class,\n    \\Illuminate\\Contracts\\Session\\Middleware\\\
    AuthenticatesSessions::class,\n    \\Illuminate\\Routing\\Middleware\\SubstituteBindings::class,\n\
    \    \\Illuminate\\Auth\\Middleware\\Authorize::class,\n];\n```\n\n来源：[`laravel.com/docs/`](https://laravel.com/docs/)\n\
    \n# 中间件参数\n\n此外，中间件可以接收更多的参数。例如，如果你的应用程序在执行特定操作之前需要确认已身份的用户具有特定的“角色”，你可以设计一个 `EnsureUserHasRole`\
    \ 中间件，并将角色名称作为第二个参数接受。\n\n在 `$next` 参数之后，中间件将接收额外的参数：\n\n```php\n<?php\n\nnamespace\
    \ App\\Http\\Middleware;\n\nuse Closure;\nuse Illuminate\\Http\\Request;\nuse\
    \ Symfony\\Component\\HttpFoundation\\Response;\n\nclass EnsureEmployeeHasRole\n\
    {\n    /**\n     * 处理传入的请求。\n     *\n     * @param \\Closure(\\Illuminate\\Http\\\
    Request): (\\Symfony\\Component\\HttpFoundation\\Response) $next\n     */\n  \
    \  public function handle(Request $request, Closure $next, string $role): Response\n\
    \    {\n        if (! $request->employee()->hasRole($role)) {\n            //\
    \ Redirect Logic\n        }\n        return $next($request);\n    }\n}\n```\n\n\
    在指定路由时，可以通过使用 `:` 分隔中间件名称和参数来提供中间件参数。应该使用逗号分隔的参数列表：\n\n```php\nRoute::put('/post/{emp_id}',\
    \ function (string $emp_id) {\n    // Code Logic\n})->middleware('role:editor')\n\
    ```\n\n# 可终止中间件\n\n在 HTTP 响应发送到浏览器之后，中间件偶尔需要执行某些任务。如果你的中间件包含 `terminate` 方法并且你的\
    \ Web 服务器使用了 FastCGI，则在响应传输到浏览器之后，`terminate` 方法将被自动调用：\n\n```php\n<?php\n\nnamespace\
    \ Illuminate\\Session\\Middleware;\n\nuse Closure;\nuse Illuminate\\Http\\Request;\n\
    use Symfony\\Component\\HttpFoundation\\Response;\n\nclass TerminatingMiddleware\n\
    {\n    /**\n     * 处理传入的请求。\n     *\n     * @param \\Closure(\\Illuminate\\Http\\\
    Request): (\\Symfony\\Component\\HttpFoundation\\Response) $next\n     */\n  \
    \  public function handle(Request $request, Closure $next): Response\n    {\n\
    \        return $next($request);\n    }\n\n    /**\n     * 在响应发送到浏览器后处理任务。\n \
    \    */\n    public function terminate(Request $request, Response $response):\
    \ void\n    {\n        // Code Logic for termination\n    }\n}\n```\n\n请求和响应都应该被发送到\
    \ `terminate` 方法。一旦定义了可终止中间件，就应该将其添加到 `app/Http/Kernel.php` 文件的路由列表或全局中间件列表中。\n\
    \n当你使用中间件的 `terminate` 函数时，Laravel 会从服务容器解析出该中间件的新实例。如果你希望在调用 `handle` 和 `terminate`\
    \ 方法时使用相同的中间件实例，请使用容器的单例方法注册该中间件。通常，这应该在 `AppServiceProvider` 的 `register` 方法中执行：\n\
    \n```php\nuse App\\Http\\Middleware\\TerminatingMiddleware;\n\n/**\n * 注册任何应用服务\n\
    \ */\npublic function register(): void\n{\n    $this->app->singleton(TerminatingMiddleware::class);\n\
    }\n```\n\n# 总结\n\n本章深入探讨了 Laravel 强大的认证系统，重点关注守护（guards）、提供者（providers）和若干认证技术。Laravel\
    \ 的认证系统构建在守护和提供者的基本概念之上。\n\n在开发任何软件应用程序时，身份验证和授权都是关重要的。在开发 Laravel 应用程序的情况下，安全性、用户会话管理、授权访问和密码管理成为实现安全的关键方法。\n\
    \n在整个章节中，我们通过可以跟的示例研究了如何实现这些目标，这些功能对于你的 Laravel 应用程序是至关重要的，特别是当你将构建多用户应用程序时。\n\
    \n# 注意事项\n\n- 事实上，本章深入探讨了 Laravel 强大的认证系统，重点关注守护、提供者和若干认证技术。Laravel 的认证系统构建在守护和提供者的基本概念之上。\n\
    - 守护指定了每个请求的认证机制，而提供者从持久化存储中检索用户。Laravel 拥有会话守护（session guards），它们使用 cookie 和会话数据来验证用户。\n\
    - 本章涵盖了 Laravel API 认证服务的概念，包含了如 Passport 和 Sanctum 等用于处理 API 令牌和认证请求的包。强调了这些包如何与内置的基于\
    \ cookie 的认证方案协同工作。\n- 展示了认证和注册逻辑的自定义，突出了 HTTP 身份验证作为一种不需要单独登录页面即可快速验证用户的方法。通过无状态\
    \ HTTP 身份验证说明了 API 令牌认证。\n- 本章还讨论了针对非标准关系型数据库的自定义用户提供者，引导读者完成创建和部署这些提供者的过程。Laravel\
    \ 的合约（如 `UserProvider` 和 `Authenticatable`）定义良好。\n- 此外，本章演示了如何失效不同设备上的会话以确保用户安全。\n\
    \n"
- fmt: "\nThis chapter will cover the API development with Laravel. It will teach\
    \ the user right from introduction on REST APIs to additional complex topics on\
    \ APIs. The chapter will also focus on Laravel Passport API, its features, and\
    \ much more.\n\n# Structure\n\nIn this chapter, we will cover the following topics:\n\
    \n* Understanding APIs, REST\n* Resources, Collections and Nesting Relationships\n\
    \    * Writing Resources\n        * Relationships\n        * Data Wrapping\n \
    \       * Pagination\n        * Conditional Relationships\n    * Resource Response\n\
    * Laravel Passport\n    * Installation and Setup\n    * Configuration\n    * Access\
    \ Tokens\n    * Protecting Routes\n    * Token Scopes\n\n# Understanding APIs,\
    \ REST\n\nAPI stands for Application Programming Interface. APIs can be paralleled\
    \ to a set of protocols between different software programs to communicate with\
    \ each other, that is, to share data and/or functionality with each other.\n\n\
    There are two types of APIs widely used:\n\n![](images/Figure-7.1.jpg)\n\n**Figure\
    \ 7.1:** Types of API\n\n# REST\n\nREST API stands for Representational State\
    \ Transfer.\n\nIt is a single resource for multiple actions in the API layer and\
    \ uses CRUD (Create, Read, Update, Delete) operations to manipulate and transform\
    \ data.\n\n# SOAP\n\nSOAP API stands for Simple Object Access Protocol.\n\nIt\
    \ can be both stateful and stateless. It makes its calls using POST and also exposes\
    \ the method calls that are done for communication and transfer of data packets.\n\
    \n# Resources, Collections and Nesting Relationships\n\nWhen establishing the\
    \ resource instance in your route or controller, you should use the `collection`\
    \ method offered by your resource class if you are delivering a paginated response\
    \ or a collection of resources:\n\n```php\nuse App\\Http\\Resources\\UserResource;\n\
    use App\\Models\\User;\nRoute::get('/users', function () {\n    return UserResource::collection(User::all());\n\
    });\n```\n\nPlease take note that custom metadata additions are not permitted\
    \ and must be returned with your collection. You may make a specific resource\
    \ to represent the collection if you would like to alter the resource collection\
    \ response:\n\n```bash\nphp artisan make:resource UserCollection\n```\n\nAny metadata\
    \ that has to be included with the response can be readily defined after the resource\
    \ collection class has been generated:\n\n```php\n<?php\nnamespace App\\Http\\\
    Resources;\nuse Illuminate\\Http\\Request;\nuse Illuminate\\Http\\Resources\\\
    Json\\ResourceCollection;\n\nclass UserCollection extends ResourceCollection\n\
    {\n    /**\n     * Transform the resource collection into an array.\n     *\n\
    \     * @return array<int|string, mixed>\n     */\n    public function toArray(Request\
    \ $request): array\n    {\n        return [\n            'data' => $this->collection,\n\
    \            'links' => [\n                'self' => 'link-value',\n         \
    \   ],\n        ];\n    }\n}\n```\n*Source: www.laravel.com*\n\nIt might be returned\
    \ by a route or controller once you have defined your resource collection:\n\n\
    ```php\nuse App\\Http\\Resources\\UserCollection;\nuse App\\Models\\User;\nRoute::get('/users',\
    \ function () {\n    return new UserCollection(User::all());\n});\n```\n\nLaravel\
    \ restores the resource collection’s keys to their numerical order upon returning\
    \ them from a route. Nonetheless, you may provide `preserveKeys` attribute in\
    \ your resource class that indicates if the original keys of a collection need\
    \ to kept:\n\n```php\n<?php\nnamespace App\\Http\\Resources;\nuse Illuminate\\\
    Http\\Resources\\Json\\JsonResource;\n\nclass UserResource extends JsonResource\n\
    {\n    /**\n     * Indicates if the resource’s keys should be preserved.\n   \
    \  *\n     * @var bool\n     */\n    public $preserveKeys = true;\n}\n```\n\n\
    Collection keys will be kept when the collection is returned from a route or controller\
    \ if the `preserveKeys` attribute is set to `true`:\n\n```php\nuse App\\Http\\\
    Resources\\UserResource;\nuse App\\Models\\User;\nRoute::get('/users', function\
    \ () {\n    return UserResource::collection(User::all());\n});\n```\n\nA resource\
    \ collection’s `$this->collection` attribute is immediately supplied with the\
    \ outcome of mapping each item to its unique class. Without the trailing `Collection`\
    \ part in the name, the single resource class is taken to be the collection’s\
    \ name. Furthermore, `Resource` may or not be suffixed to the solitary class,\
    \ based on your desire. `UserCollection`, for instance, will try to map the supplied\
    \ user instances to the `UserResource` resource. You may modify this behavior\
    \ by overriding your collection’s `$collects` property:\n\n```php\n<?php\nnamespace\
    \ App\\Http\\Resources;\nuse Illuminate\\Http\\Resources\\Json\\ResourceCollection;\n\
    \nclass UserCollection extends ResourceCollection\n{\n    public $collects = User::class;\n\
    }\n```\n\n# Writing Resource\n\nAll that is required are resources to convert\
    \ a given model into an array. Therefore, every resource has a `toArray` function\
    \ that converts the characteristics of your model into an array that is compatible\
    \ with APIs and can be obtained by your application’s routes or controllers:\n\
    \n```php\n<?php\nnamespace App\\Http\\Resources;\nuse Illuminate\\Http\\Request;\n\
    use Illuminate\\Http\\Resources\\Json\\JsonResource;\n\nclass UserResource extends\
    \ JsonResource\n{\n    public function toArray(Request $request): array\n    {\n\
    \        return [\n            'id' => $this->id,\n            'name' => $this->name,\n\
    \            'city' => $this->city,\n            'created_at' => $this->created_at,\n\
    \            'updated_at' => $this->updated_at,\n        ];\n    }\n}\n```\n\n\
    A resource can be returned straight from a route or controller after it has been\
    \ defined:\n\n```php\nuse App\\Http\\Resources\\UserResource;\nuse App\\Models\\\
    User;\nRoute::get('/user/{id}', function (string $id) {\n    return new UserResource(User::findOrFail($id));\n\
    });\n```\n\n# Relationships\n\nYou can add related resources to the array that\
    \ your resource’s `toArray` function returns if you would like to include them\
    \ in your answer. In this example, we will add the user’s blog posts to the resource\
    \ response using the `collection` function of the `PostResource` resource:\n\n\
    ```php\nuse App\\Http\\Resources\\PostResource;\nuse Illuminate\\Http\\Request;\n\
    \npublic function toArray(Request $request): array\n{\n    return [\n        'id'\
    \ => $this->id,\n        'name' => $this->name,\n        'city' => $this->city,\n\
    \        'posts' => PostResource::collection($this->posts),\n        'created_at'\
    \ => $this->created_at,\n        'updated_at' => $this->updated_at,\n    ];\n\
    }\n```\n\n# Data Wrapping\n\nWhen the resource response is translated to JSON,\
    \ your outermost resource is automatically wrapped in a data key. Thus, for instance,\
    \ the following is a typical resource collection response:\n\n```json\n{\n  \"\
    data\": [\n    {\n      \"id\": 1,\n      \"name\": \"Eladio Schroeder Sr.\",\n\
