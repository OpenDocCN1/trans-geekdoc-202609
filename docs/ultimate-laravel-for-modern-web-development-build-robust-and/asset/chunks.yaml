    # 关于作者


    `Drishti Jain` 拥有佐治亚理工学院的计算机科学硕士学位，以及印度浦拉纳库明斯工程学院的计算机工程学士学位。她曾荣获毕业届计算机工程专业“最优秀毕业生”称号，并被列入学院的获奖者名单。她曾在顶尖的产品型公司和金融科技机构工作，同时通过其发起的计划
    `SkillUp with Drishti` 和她的非营利组织 `Samyak Drishti Foundation` 致力于机会和知识的民主化。


    她是一位享誉的国际技术演讲者，曾在全球 100 多场技术会议上发表演讲，包括在美国、英国、欧洲、新加坡、哥伦比亚、泰国、巴西和印度的技术会议。她活跃于 Laravel
    生态系统，受邀在 `LARACON` 演讲，与 Laravel 核心团队、Laravel 创作者以及 Laravel India 播客共享平台。她在 PHP
    生态系统的贡献非常丰富，包括在美国 `PHP UK`、`Scotland PHP` 和 `PHPTEK` 等会议上演讲，以及参加在新加坡的 `PHPConf.Asia`。


    她活跃于技术社区，经常通过各种博客、教程、研讨会、演讲和社交媒体上的帖子分享她的知识。你可以在这里找到她...


