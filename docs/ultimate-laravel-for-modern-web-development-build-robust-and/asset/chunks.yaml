    `public function restored(User $employee): void`\n\n`{`\n\n`// Code Logic`\n\n\
    `}`\n\n`/**`\n\n`* Handle the Employee “forceDeleted” event.`\n\n`*/`\n\n`public\
    \ function forceDeleted(User $employee): void`\n\n`{`\n\n`// Code Logic`\n\n`}`\n\
    \n`}`\n\nAt times, you might need to **mute** a model’s whole firing of events.\
    \ This can be achieved by utilizing the `withoutEvents` technique. The only input\
    \ for the `withoutEvents` function is a closure. The `withoutEvents` function\
    \ will return any result returned by the closure, and any code performed within\
    \ this closure won’t dispatch model events.\n\n# [Conclusion](#toc.xhtml#s157a)\n\
    \nIn this chapter, *Working with Eloquent ORM and Query Builder*, the focus was\
    \ on exploring the fundamental concepts of Eloquent ORM and Query Builder in the\
    \ context of Laravel, a popular PHP framework for web development. The chapter\
    \ began by introducing the importance of Eloquent and Query Builder in database\
    \ operations within web development projects.\n\nThe chapter’s goal was to provide\
    \ readers with a thorough grasp of Laravel’s Eloquent ORM and Query Builder while\
    \ highlighting their significance and illuminating how to use them through real-world\
    \ scenarios. It discussed key ideas and methods that programmers may use to create\
    \ effective and dependable database-driven Laravel applications.\n\nIn the next\
    \ chapter, we will look at the security aspects of the Laravel application, including\
    \ how to incorporate authentication and authorization in Laravel.\n\n# [Points\
    \ to Remember](#toc.xhtml#s158a)\n\n*   Eloquent ORM simplifies database operations\
    \ in Laravel by providing an object-oriented interface to interact with database\
    \ tables.\n\n*   Each database table in Eloquent corresponds to a **Model** class\
    \ that communicates with the table.\n\n*   Models can perform insert, update,\
    \ delete, and fetch operations on records.\n\n*   Use the `make:model` Artisan\
    \ command to create a new model.\n\n*   Models follow naming conventions for table\
    \ names and primary keys. You can customize these using properties like `$table`\
    \ and `$primaryKey`.\n\n*   You can retrieve data using methods like `get()`,\
    \ `first()`, and `pluck()`.\n\n*   Joins merge rows from different tables based\
    \ on shared columns.\n\n*   Aggregates like count, max, min, average, and sum\
    \ can be used to perform calculations on columns.\n\n*   Collections are extended\
    \ arrays that allow various manipulation methods.\n\n*   Chunking results and\
    \ using cursors help manage memory consumption when dealing with large datasets.\n\
    \n*   CRUD operations involve creating, updating, and deleting records using the\
    \ model’s instance.\n\n*   Eloquent models emit events during their lifecycle,\
    \ such as creating, updating, and deleting.\n\n*   Event classes can be created\
    \ to handle specific model events.\n\n*   The `$dispatchesEvents` property associates\
    \ event classes with model events.\n\n*   Eloquent events provide hooks for executing\
    \ custom logic during various phases of a model’s lifecycle.\n\n# [CHAPTER 6](#toc.xhtml#c06)\n\
    \n# [Implementing Authentication and Authorization in Laravel](#toc.xhtml#c06)\n\
    \n# [Introduction](#toc.xhtml#s159a)\n\nThis chapter will focus on how to handle\
    \ user authentication, set up registration and login pages, and create a password\
    \ reset flow. You will also learn how to implement user authorization, define\
    \ roles and permissions, and create policies and gates to manage access to resources.\
    \ This chapter will also cover best practices for storing passwords and securing\
    \ user data.\n\n# [Structure](#toc.xhtml#s160a)\n\nIn this chapter, the following\
    \ topics will be covered:\n\n*   Laravel’s built-in authentication system \n\n\
    \    *   Laravel API authentication services\n\n    *   Passport\n\n    *   Sanctum\n\
    \n*   Customizing authentication and registration logic \n\n    *   HTTP authentication\n\
    \n    *   Stateless HTTP authentication\n\n    *   Custom user providers\n\n*\
    \   Implementing authorization policies and gates \n\n    *   Invalidating user\
    \ sessions\n\n    *   Password management\n\n    *   Authentication custom guards\n\
    \n    *   Authenticatable contract\n\n    *   Invalidate sessions across multiple\
    \ devices\n\n    *   User session knowledge\n\n    *   Additional authentication\
    \ methods\n\n*   Securing routes and actions with middleware \n\n    *   Middleware\n\
    \n    *   Assigning middleware to routes\n\n    *   Middleware groups"
