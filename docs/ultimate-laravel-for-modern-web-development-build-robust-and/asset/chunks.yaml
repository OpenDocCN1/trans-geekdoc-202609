  trans: "\n通过创建你自己的模型并扩展匹配的 Passport 模型，你可以扩展 Passport 使用的内部模型：\n\n```php\nuse Laravel\\\
    Passport\\Client as PassportClient;\n\nclass Client extends PassportClient\n{\n\
    \    // Code Logic\n}\n```\n\n一旦定义了模型，你就可以使用 `Laravel\\Passport\\Passport` 类来告诉\
    \ Passport 使用你的自定义模型。通常情况下，你应该在应用程序的 `App\\Providers\\AuthServiceProvider` 类的\
    \ `boot` 函数中向 Passport 声明你的自定义模型：\n\n```php\nuse App\\Models\\Passport\\AuthCode;\n\
    use App\\Models\\Passport\\Client;\nuse App\\Models\\Passport\\PersonalAccessClient;\n\
    use App\\Models\\Passport\\RefreshToken;\nuse App\\Models\\Passport\\Token;\n\n\
    public function boot(): void\n{\n    Passport::useTokenModel(Token::class);\n\
    \    Passport::useRefreshTokenModel(RefreshToken::class);\n    Passport::useAuthCodeModel(AuthCode::class);\n\
    \    Passport::useClientModel(Client::class);\n    Passport::usePersonalAccessClientModel(PersonalAccessClient::class);\n\
    }\n```\n\n# 覆盖路由\n\n在某些情况下，你可能想要更改 Passport 定义的路由。为了实现这一点，你必须先在应用程序的 `AppServiceProvider`\
    \ 的 `register` 函数中添加 `Passport::ignoreRoutes`，以忽略 Passport 注册的路由：\n\n```php\n\
    use Laravel\\Passport\\Passport;\n\npublic function register(): void\n{\n    Passport::ignoreRoutes();\n\
    }\n```\n\n接下来，你可以将 Passport 在其路由文件中定义的路由复制并编辑到应用程序的 `routes/web.php` 文件中：\n\n\
    ```php\nRoute::group([\n    ‘as’ => ‘passport.',\n    ‘prefix’ => config(‘passport.path’,\
    \ ‘oauth’),\n    ‘namespace’ => ‘\\Laravel\\Passport\\Http\\Controllers’,\n],\
    \ function () {\n    // Route Logic\n});\n```\n\n# 访问令牌 (Access Tokens)\n\n开发者通常通过其权限码（permission\
    \ codes）的使用来了解 OAuth2。当客户端应用程序使用授权码时，它会将用户重定向到你的服务器，用户可以在那里接受或拒绝向客户端提供访问令牌请求。\n\
    \n# 客户端 (Client)\n\n为了与你的 Laravel 应用程序建立通信，需要创建一个能够能够通过应用程序 API 与你的 Laravel 应用程序进行通信和交互的客户端。在创建客户端时，需要应用程序的名称和应用程序的\
    \ URL。该 URL 是经过验证的用户将被重定向指向的应用程序 URL。\n\n### Passport::client 命令\n\n使用 `passport:client`\
    \ Artisan 命令是创建客户端最直接的方法。你可以使用此命令创建你自己的客户端，以便测试 OAuth2 的功能。当你执行 `client` 命令时，Passport\
    \ 会向你询问有关客户端的更多详细信息，并为你提供客户端 ID 和密钥（secret）：\n\n```bash\nphp artisan passport:client\n\
    ```\n\n当 `passport:client` 命令询问 URL 时，你可以通过提供逗号分隔的列表，为你的客户端输入任意数量的重定向 URL。每个包含逗号的\
    \ URL 都必须进行 URL 编码：\n\n```\nhttp://example1.com/callback\nhttp://example2.com/callback\n\
    ```\n\n# JSON API\n\nPassport 拥有一个 JSON API，你可以用它创建客户端，因为你的应用程序用户将无法使用 `client`\
    \ 命令。通过这种方式，你可以避免手动编写用于客户端创建、更新和删除控制器的麻烦。\n\n为了给你的用户提供一个管理客户的仪表板，你必须将 Passport\
    \ 的 JSON API 与你自己的前端集成。我们将在下面介绍客户端管理的每个 API 端点。为了方便使用，我们将展示如何如何使用 Axios 对端点进行\
    \ HTTP 查询。\n\n`web` 和 `auth` 中间件保护着 JSON API，因此你只能在自己的应用程序内部调用它。它不能被外部源调用。\n\n\
    # GET\n\n`GET /oauth/clients`\n\n对于验证了身份的用户，此路由返回所有客户端。主要的用途是提供用户所有客户端的列表，允许他们进行编辑或删除：\n\
    \n```javascript\naxios.get('/oauth/clients')\n  .then(response => {\n    console.log(response.data);\n\
    \  });\n```\n\n# POST\n\n`POST /oauth/clients`\n\n此路由的目标是吸引新客户。`redirect` URL\
    \ 和客户的 `name`（名称）是所需的两个信息。当在授予或拒绝权限请求时，用户将被重定向到 `redirect` URL。\n\n在创建时，将为其分配客户端\
    \ ID 和客户端密钥。当从你的应用程序获取访问令牌时，这些值将被利用。客户端创建路由将返回新的客户端实例：\n\n```javascript\nconst\
    \ data = {\n    name: ‘ABC’,\n    redirect: ‘http://example1.com/callback’\n};\n\
    axios.post('/oauth/clients’, data)\n  .then(response => {\n    console.log(response.data);\n\
    \  })\n  .catch (response => {\n    // Error Handling Logic\n  });\n```\n\n# PUT\n\
    \n`PUT /oauth/clients`\n\n客户端更新通过此路由发送。`redirect` URL 和客户的 `name`（名称）是所需的两个信息。当在授予或拒绝权限请求时，用户将被重定向到\
    \ `redirect` URL。客户端创建路由将返回新的客户端实例：\n\n```javascript\nconst data = {\n    name:\
    \ ‘ABC’,\n    redirect: ‘http://example1.com/callback’\n};\naxios.put('/oauth/clients',\
    \ data)\n  .then(response => {\n    console.log(response.data);\n  })\n  .catch\
    \ (response => {\n    // Error Handling Logic\n  });\n```\n\n# DELETE\n\n`DELETE\
    \ /oauth/clients`\n\n为了删除客户端。\n\n```javascript\naxios.delete('/oauth/clients'\
    \ + clientId)\n  .then(response => {\n    // Code Logic\n  });\n```\n\n# 保护路由\n\
    \n保护路由有几种处理方式。我们将深入介绍每一种。\n\n### 中间件\n\n包含 Passport 的身份 guard 将验证传入请求的访问令牌。你只需要在设置了\
    \ `api` guard 的所有路由上包含 `auth:api` 中间件：\n\n```php\n// 在设置了 api guard 之后，\n// 在对应的路由上添加中间件\n\
    ```\n\n对于你的应用程序验证的每种用户提供者类型（可能涉及不同的模型），你可能需要指定 guard 配置。通过这样做，你可以保护针对特定用户提供者的请求。例如，`config/auth.php`\
    \ 配置文件如下：\n\n```php\n'api' => [\n    'driver' => 'passport',\n    'provider' =>\
    \ 'users',\n],\n'api-customers' => [\n    'driver' => 'passport',\n    'provider'\
    \ => 'customers',\n],\n```\n\n`api-customers` guard 使用 `customers` 用户提供者验证传入的请求，并将后续路由：\n\
    \n```php\nRoute::get('/customer', function () {\n    // Code Logic\n})->middleware('auth:api-customers');\n\
    ```\n\n# 访问令牌 (Access Token)\n\n在访问受 Passport 保护的路由时，你的应用程序 API 用户应该在请求的 `Authorization`\
    \ Header 中将他们的访问令牌作为 `Bearer` 令牌。例如，使用 Guzzle HTTP 库：\n\n```php\nuse Illuminate\\\
    Support\\Facades\\Http;\n\n$response = Http::withHeaders([\n    'Accept' => 'application/json',\n\
    \    'Authorization' => 'Bearer '.$accessToken,\n])->get('https://passport-app.test/api/user');\n\
    \nreturn $response->json();\n```\n\n# 令牌范围 (Token Scopes)\n\n通过范围，你的 API 客户在访问账户时可能会请求一组特定的权限。例如，如果你正在开发电子商务服务，并不是每个\
    \ API 客户都希望具有下单的能力。或者，你也可以通过只请求授权来允许客户查看订单状态。换句话说，范围允许用户限制第三方程序代表他们所做的操作。\n"
- fmt: "\n# Defining a scope (#toc.xhtml#s222a)\n\nUsing the `Passport::tokensCan`\
    \ function in the boot method of your application’s `App\\Providers\\AuthServiceProvider`\
    \ class, you may specify the scopes of your API. An array containing scope names\
    \ and scope descriptions can be used with the `tokensCan` method. Users will see\
    \ the scope description on the permission approval screen, which may be anything\
    \ you like to write:\n\n```php\npublic function boot(): void\n{\n    Passport::tokensCan([\n\
    \        ‘place-alarm’ => ‘Place alarm’,\n        ‘check-weather’ => ‘Check weather’,\n\
    \    ]);\n}\n```\n\n# Default Scope (#toc.xhtml#s223a)\n\nYou may use the `setDefaultScope`\
    \ function to configure your Passport server to attach default scope(s) to the\
    \ token in the event that a client does not request any particular scopes. Usually,\
    \ you should invoke this function from the `App\\Providers\\AuthServiceProvider`\
    \ class’s `boot` method in your application:\n\n```php\nuse Laravel\\Passport\\\
    Passport;\n\nPassport::tokensCan([\n    ‘place-alarm’ => ‘Place alarm’,\n    ‘check-weather’\
    \ => ‘Check weather’,\n]);\n\nPassport::setDefaultScope([\n    ‘check-weather’,\n\
    \    ‘place-alarm’,\n]);\n```\n\n### Assign to Tokens\n\nCustomers should use\
    \ the `scope` query string option to indicate the scopes they would want to use\
    \ when seeking an access token through the authorization code grant. A list of\
    \ scopes separated by spaces should be the `scope` parameter:\n\n```php\nRoute::get(‘/redirect’,\
    \ function () {\n    $query = http_build_query([\n        ‘client_id’ => ‘client-id’,\n\
    \        ‘redirect_uri’ => ‘http://example1.com/callback’,\n        ‘response_type’\
    \ => ‘code’,\n        ‘scope’ => ‘place-alarm check-weather’,\n    ]);\n    return\
    \ redirect(‘http://passport-app.test/oauth/authorize?’.$query);\n});\n```\n\n\
    The array of desired scopes may be used as the second argument to the `createToken`\
    \ function of the `App\\Models\\User` model when providing personal access tokens:\n\
    \n```php\n$token = $user->createToken(‘My Token’, [‘place-alarm’])->accessToken;\n\
    ```\n\n# Check Scope (#toc.xhtml#s224a)\n\nTo confirm that an incoming request\
    \ is authenticated using a token that has been granted a certain scope, Passport\
    \ comes with two middleware components. Start by adding the following middleware\
    \ to your `app/Http/Kernel.php` file’s `$middlewareAliases` variable.\n\n```php\n\
    ‘scopes’ => \\Laravel\\Passport\\Http\\Middleware\\CheckScopes::class,\n‘scope’\
    \ => \\Laravel\\Passport\\Http\\Middleware\\CheckForAnyScope::class,\n```\n\n\
    To ensure that the incoming request’s access token has each of the specified scopes,\
    \ the scopes middleware may be attached to a route:\n\n```php\nRoute::get(‘/weather’,\
    \ function () {\n    //Code Logic\n})->middleware([‘auth:api’, ‘scopes:check-weather,place-alarm’]);\n\
    ```\n\nIn order to confirm that the incoming request’s access token has at least\
    \ one of the specified scopes, the scope middleware may be attached to a route:\n\
    \n```php\nRoute::get(‘/orders’, function () {\n    //Code Logic\n})->middleware([‘auth:api’,\
    \ ‘scope:check-weather,place-alarm’]);\n```\n\nYou can still use the `tokenCan`\
    \ method on the authenticated `App\\Models\\User` instance to see whether the\
    \ token has a specified scope after an access token authenticated request has\
    \ reached your application:\n\n```php\nuse Illuminate\\Http\\Request;\n\nRoute::get(‘/alarms’,\
    \ function (Request $request) {\n    if ($request->user()->tokenCan(‘place-alarm’))\
    \ {\n        // Code Logic\n    }\n});\n```\n\n# Conclusion (#toc.xhtml#s225a)\n\
    \nAn introduction to REST and APIs at the beginning of the chapter emphasizes\
    \ their importance in the building of contemporary applications. The explanation\
    \ of resources, collections, and nested connections follows, along with an example\
    \ of how to use Laravel to put them into practice. Writing resources and maintaining\
    \ relationships within resource replies are also emphasized in this chapter.\n\
    \nThe thorough explanation of Laravel Passport, a comprehensive OAuth2 server\
    \ solution for Laravel apps, is one of the main features of this chapter. Configuration\
    \ options for access tokens and token lives are provided, along with a detailed\
    \ explanation of the installation and setup procedure. Important topics like managing\
    \ token scopes and safeguarding routes for improved security and access control\
    \ are also covered in this chapter.\n\nIn the next chapter we will look into Testing\
    \ and Debugging your Laravel Application.\n\n# Points to Remember (#toc.xhtml#s226a)\n\
    \n*   Recognize the basics of REST APIs and their importance in the construction\
    \ of contemporary applications. Use Laravel’s hierarchical relationships, collections,\
    \ and resources to handle data effectively.\n*   Model data is transformed into\
    \ an array that is consistent with API replies using Laravel resources.\n*   It\
    \ is possible to efficiently maintain relationships between resources in resource\
    \ answers, which makes it possible to include related resources in the API result.\
    \ The resource answer is automatically wrapped in a ‘data’ key in Laravel, but\
    \ the resource class’s `$wrap` parameter allows you to provide a custom key.\n\
    *   For a safe and effective OAuth2 server solution, use Laravel Passport. For\
    \ Laravel apps, Laravel Passport offers a reliable OAuth2 server solution that\
    \ guarantees safe access to APIs.\n*   Token scopes are important for giving API\
    \ users unique privileges.\n*   The client and server may communicate seamlessly\
    \ by using Laravel Passport.\n*   The client and server may communicate seamlessly\
    \ by using Axios.\n*   To improve security and control over access, set up access\
    \ tokens and token lives.\n"
