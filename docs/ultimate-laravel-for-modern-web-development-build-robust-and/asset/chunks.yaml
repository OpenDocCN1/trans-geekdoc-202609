    Docker image runtime rather than the default Vapor runtime.


    `vapor env my-environment --docker`


    This command will establish a new environment called `my-environment.Dockerfile`
    file at the root directory of your application.


    The `open` command in the Vapor CLI may be used to open environments in your default
    browser:


    `vapor open my-environment`


    Vapor CLI utilizes the staging environment by default when performing a command:


    `vapor open` // Opens the `staging` environment in default browser


    `vapor open production` // Opens the `production` environment in default browser


    However, you may alter the default environment for your project by defining a
    default-environment option in your application’s `vapor.yml` file:


    `id: 3`


    `name: vapor-laravel-app`


    `default-environment: production`


    `environments:`


    `production:`


    `build:`


    `- ‘composer install --no-dev’`


    `my-environment:`


    `build:`


    `- ‘composer install --no-dev’`


    **Environment Variables**


    Each environment comprises a collection of environment variables that, like the
    variables in your application’s local `.env` file, offer critical information
    to your program during execution.


    All of the environment variables that are injected by Vapor, along with their
    `env()` values, are listed in the following table:


    | `.env` **Value** || `env()` **Value** |


    | --- | --- |


    | `APP_ENV` || Environment name |


    | `APP_DEBUG` || FALSE |


    | `APP_LOG_LEVEL` || Debug |


    | `APP_URL` || Vanity domain, or custom domain if exists |


    | `ASSET_URL` || CloudFront |


    | `AWS_BUCKET` || Storage resource if exists |


    | `BROADCAST_DRIVER` || Pusher |


    | `CACHE_DRIVER` || DynamoDB, or cache (Redis) resource if exists |


    | `DB_*` || Database (MySQL, Postgresql, etc) resource if exists |


    | `DYNAMODB_CACHE_TABLE` || **vapor\_cache** |


    | `FILESYSTEM_DISK` || S3 |


    | `FILESYSTEM_DRIVER` || S3 |


    | `FILESYSTEM_CLOUD` || S3 |


    | `LOG_CHANNEL` || Stderr |


    | `MAIL_DRIVER` || LOG, but SES for environments with the name **production**
    |


    | `MAIL_MAILER` || LOG, but SES for environments with the name **production**
    |


    | `MAIL_FROM_ADDRESS` || **hello@example.com** or **hello@custom-domain.com**
    if exists |


    | `MAIL_FROM_NAME` || **your\_project\_name** |


    | `MIX_URL` || CloudFront |


    | `QUEUE_CONNECTION` || SQS |


    | `SCHEDULE_CACHE_DRIVER` || DynamoDB |


    | `SESSION_DRIVER` || Cookie |


    **Table 10.1:** Environment Variables injected by Vapor on the environment


    When you manage your environment with Vapor CLI or Vapor UI, you will not see
    these environment variables, and any variables you explicitly set will override
    Vapor’s automatically injected variables.


    # [Deployment](#toc.xhtml#s280a)


    Deployments can only be started via the Vapor CLI. Vapor will perform the build
    steps of your `vapor.yml` file on the local computer that the deployment is executing
    on during deployment. This might be your own computer or a continuous integration
    platform.


    To begin a deployment, use the `deploy` CLI command from your application’s root
    directory.


    `vapor deploy production`


    # [Hooks](#toc.xhtml#s281a)


    You may specify build hooks for an environment in your `vapor.yml` file by utilizing
    the `build` keyword. These instructions are run on the local system where the
    deployment is taking place and may be used to prepare your application for deployment.
    During deployment, your application is constructed under a temporary `.vapor`
    directory established by the CLI, and all of your `build` instructions are executed
    within that directory:


    `id: 4`


    `name: vapor-app`


    `environments:`


    `production:`


    `memory: 1024`


    `database: vapor-app`


    `cache: vapor-cache`


    `build:`


    `- ‘composer install --no-dev’`


    `- ‘php artisan event:cache’`


    `deploy:`


    `- ‘php artisan migrate --force’`


    You may specify deployment hooks for an environment in your `vapor.yml` file by
    using the deploy key. These commands are run on the deployed environment before
    it is made available to the public. The deployment will not be activated if any
    of these instructions fail:


    `id: 4`


    `name: vapor-app`


    `environments:`


    `production:`


    `memory: 1024`


    `database: vapor-app`


    `cache: vapor-cache`


    `build:`


    `- ‘composer install --no-dev’`


    `- ‘php artisan event:cache’`


    `deploy:`


    `- ‘php artisan migrate --force’`


    When a deployment hook fails, you may see the output / logs via the deployment
    detail tab in the Vapor UI.


    Also, if you use the `vapor deploy` command to deploy your application, the CLI
    output will include the unsuccessful hook output. Of course, you may inspect the
    output at any moment by utilizing the `hook:output` for output:


    `vapor hook:output {DEPLOYMENT_HOOK_ID}`


    Using the `hook:log` command, you may examine the logs connected with the unsuccessful:


    `vapor hook:log {DEPLOYMENT_HOOK_ID}`


    # [Development](#toc.xhtml#s282a)


    To return binary replies from your Vapor application, such as PDF downloads, your
    HTTP response should contain the `X-Vapor-Base64-Encode` header:


    `return $response->withHeaders([`


    `‘X-Vapor-Base64-Encode’ => ‘True’,`


    `]);`


