    *   **SSL/TLS Protocols**: OpenSSL lends support to various SSL (Secure Sockets
    Layer) and TLS (Transport Layer Security) protocols, vital for securing communication
    between a web server and a client (such as a web browser). These protocols guarantee
    that the data exchanged between the client and the server remains encrypted, shielding
    it from unauthorized access.


    *   **Digital Signatures**: Offering functions for creating and verifying digital
    signatures, OpenSSL plays a key role in ensuring the integrity and authenticity
    of data. In Laravel, digital signatures can be employed to authenticate data received
    from clients or other servers.


    *   **Certificate Handling**: SSL/TLS certificates constitute a critical component
    of secure web communication. OpenSSL simplifies the generation, management, and
    verification of SSL/TLS certificates. Laravel applications frequently leverage
    OpenSSL for SSL certificate management, establishing secure connections.


    *   **Hashing and Message Digests**: OpenSSL incorporates cryptographic hash functions
    that Laravel can utilize for tasks such as hashing passwords or generating message
    digests. Hashing is pivotal for securely storing passwords and ensuring data integrity.


    OpenSSL equips developers with indispensable tools for encryption, decryption,
    digital signatures, and certificate management, bolstering the overall security
    of the application and its interactions with users and other services.


    To utilize OpenSSL functions like `openssl_pkey_new`, you must first build an
    `openssl.cnf` configuration file and tell Vapor to load it using the `OPENSSL_CONF`
    environment variable. For example, this environment variable instructs Vapor to
    import an `openssl.cnf` file from your project’s root:


    `OPENSSL_CONF=”/var/task/openssl.cnf”`


    Let’s look at the sample `openssl.cnf` file:


    `dir = certificates`


    `[ ca ]`


    `default_ca = CA_default`


    `[ CA_default ]`


    `serial = $dir/serial`


    `database = $dir/index.txt`


    `new_certs_dir = $dir/newcerts`


    `certificate = $dir/cacert.pem`


    `private_key = $dir/private/cakey.pem`


    `default_days = 36500`


    `default_md = sha256`


    `preserve = no`


    `email_in_dn = no`


    `nameopt = default_ca`


    `certopt = default_ca`


    `policy = policy_match`


    `[ policy_match ]`


    `commonName = supplied`


    `countryName = optional`


    `stateOrProvinceName = optional`


    `organizationName = optional`


    `organizationalUnitName = optional`


    `emailAddress = optional`


    `[ req ]`


    `default_bits = 2048`


    `default_keyfile = priv.pem`


    `default_md = sha256`


    `distinguished_name = req_distinguished_name`


    `req_extensions = v3_req`


    `encyrpt_key = no`


    `[ req_distinguished_name ]`


    `[ v3_ca ]`


    `basicConstraints = CA:TRUE`


    `subjectKeyIdentifier = hash`


    `authorityKeyIdentifier = keyid:always,issuer:always`


    `[ v3_req ]`


    `basicConstraints = CA:FALSE`


    `subjectKeyIdentifier = hash`


    `Source : docs.vapor.build`


    You can dispatch tasks in typical Laravel apps that will be run when the HTTP
    response is given to the browser:


    `Route::get(‘/’, function () {`


    `dispatch(function () {`


    `Mail::to(abc@example.com’)->send(new WelcomeMessage);`


    `})->afterResponse();`


    `return view(‘home’);`


    `});`


    When utilizing Vapor, we always recommend dispatching jobs to your queue workers.
    Because Vapor cannot run a task after receiving a response from the browser, attempting
    to do so will make your application look slower to the end user.


    # [Domains](#toc.xhtml#s284a)


    When you use Vapor, each environment is assigned a unique vanity domain that you
    may use to access the environment once it has been deployed. However, bear in
    mind that vanity domains are exclusively for development purposes, and Vapor automatically
    inserts *no-index* headers to replies from these URLs to prevent search engines
    from indexing them.


    Furthermore, even while an application is in maintenance mode, these vanity domains
    will continue to work, allowing you to test your environment before disabling
    maintenance mode and restoring general access.


    While vanity domains might be beneficial during the development phase, they should
    not be used in a production setting or shared with the public. Instead, it is
    recommended to utilize your own custom code.


    You may add a domain that you own to Vapor via the domain screen or the domain
    CLI command. Even if you intend to serve your application via a subdomain, always
    add the root domain when adding a domain to Vapor:


    `vapor domain example.com`


    To inspect the specifics of your Vapor domains using the Vapor UI or the `domain:list`
    CLI command:


    `vapor domain:list`


    # [DNS Records](#toc.xhtml#s285a)


    When you add a domain to Vapor, you’ll be given nameservers to enter into your
    domain registrar’s nameserver settings page. This will make Vapor the entity in
    charge of the domain’s DNS records. Vapor may also automatically add and remove
    DNS records from the domain as required.


    If you wish to handle your DNS records independently, acquiring a certificate
    or connecting the domain to an environment will require manually creating DNS
    records through your domain registrar.


    # [Custom Records](#toc.xhtml#s286a)


    If you’ve elected to let Vapor maintain your DNS records, you may add, edit, or
    delete DNS records whenever you want. Vapor allows you to manage your DNS records
    in two ways: through the Vapor UI’s domain information panel or using the Vapor
    CLI. You may use the record command to generate a DNS record using the Vapor CLI:


    `vapor record example.com A www 192.168.1.1`


    `vapor record example.com A @ 192.168.1.1`


    `vapor record example.com CNAME foo another-example.com`


    `vapor record example.com MX foo “10 example.com,20 example2.com”`


    Source : docs.vapor.build


    You may use the `record:delete` command to remove a record using the Vapor CLI
    command to delete:


    `vapor record:delete example.com A www`


    # [SSL Certificates](#toc.xhtml#s287a)


    A valid SSL certificate is required before adding a domain to an existing Vapor
    environment. Vapor provides free, automated SSL certificate renewals for your
    Vapor environment using AWS Certificate Manager.


    Users often select the *us-east-1* area for their certificate, which is the necessary
    certificate region for all API Gateway 1.0 setups. Environments employing API
    Gateway 2.0 or Application Load Balancers, on the other hand, require a certificate
    in the same area as the project.


    You may generate a certificate using the domain screen in the Vapor UI or the
    `cert` CLI command:


    `vapor cert example.com`


    The validity status of your certificates may be seen using the Vapor UI or by
    using the `cert:list` command CLI command list:


    `vapor cert:list example.com`


    If you wish to destroy an old certificate that is no longer associated with an
    environment, use the domain information page in the Vapor UI or the `cert:delete`
    CLI command. Vapor will offer you to pick the individual certificate you wish
    to destroy for the provided domain when you execute the command:


    `vapor cert:delete example.com`


