  trans: "\n配置回退语言（fallback language）也是一种良好的做法。这应该在 `config/app.php` 文件中进行配置。\n\n\
    设置回退语言的语法如下：\n\n```\n‘falback_locale’ => ‘<language>’\n```\n\n例如，将回退语言设置为英语：\n\
    \n```\n‘falback_locale’ => ‘en’\n```\n\n要确定当前的语言区域（locale），可以使用 `currentLocale`\
    \ 和 `isLocale` 方法，如下：\n\n```php\nuse Illuminate\\Support\\Facades\\App;\n\n$locale\
    \ = App::currentLocale();\n\nif (App::isLocale(‘es’)) {\n    // …\n}\n```\n\n\
    # 最新版本发布变更\n\n#latest-version-release-changes\n\nLaravel 10 是目前使用的 Laravel 版本。如果你已经有了旧版本的\
    \ Laravel，可以继续对其进行升级。或者，如果你是新用户，请参考本章节的下一节了解如何安装 Laravel。\n\n# 如何升级\n\n为了将任何现有\
    \ Laravel 项目升级到 Laravel 10，更新依赖项是最关键的一步。升级文档可以在 [`laravel.com/docs/10.x/upgrade`](https://laravel.com/docs/10.x/upgrade)\
    \ 获取。\n\n让我们探索如何升级到 Laravel 10 以获取最新功能，并对我们现有的 Laravel 应用进行必要的更改。\n\n# 依赖项\n\n\
    Laravel 需要 PHP `8.1.0` 或更高版本以及 Composer `2.20` 或更高版本。\n\n在 Laravel 应用的 `composer.json`\
    \ 文件中升级以下依赖项：\n\n| 依赖项 | 版本 |\n| --- | --- |\n| laravel/framework | ¹⁰.0 |\n|\
    \ laravel/sanctum | ³.2 |\n| doctrine/dbal | ³.0 |\n| spatie/laravel-ignition\
    \ | ².0 |\n| laravel/passport | ¹¹.0 |\n\n**表 1.1：** Laravel 10 的 `composer.json`\
    \ 依赖项\n\n此外，如果你想使用 PHPUnit 10，请删除 `phpunit.xml` 中 `<coverage>` 部分的 `processUncoveredFiles`\
    \ 属性，并在 `composer.json` 文件中更新以下内容：\n\n| 依赖项 | 版本 |\n| --- | --- |\n| nunomaduro/collision\
    \ | ⁷.0 |\n| phpunit/phpunit | ¹⁰.0 |\n\n**表 1.2：** 如果使用 PHPUnit 10，Laravel 10\
    \ 的 `composer.json` 依赖项\n\n此外，请验证应用程序使用的任何其他第三方包是否支持 Laravel 10。\n\n# 最小稳定性\n\n\
    `composer.json` 中的 `minimum-stability` 设置需要设置为 `stable:`：\n\n```\n“minimum-stability”:\
    \ “stable”,\n```\n\n`minimum-stability` 的默认值现在是 `stable`；因此你也可以选择完全删除它。\n\n# 公共路径绑定\n\
    \n更新你 Laravel 应用中的代码，调用 `Illuminate\\Foundation\\Application` 对象的 `usePublicPath`\
    \ 方法。这应该取代将其 `public path` 绑定到容器中的 `path.public` 的做法：\n\n```php\napp()->usePublicPath(__DIR__.’/public’);\n\
    ```\n\n# Redis 缓存标签\n\nRedis 缓存标签在 Laravel 版本更新中已重写，以获得更好的性能和高效的存储能力。Laravel 有了一个新的\
    \ `cache:prune-stale-tags` Artisan 命令，它需要在应用程序的 `App\\Console\\Kernel` 类中调度：\n\
    \n```php\n$schedule->command(‘cache:prune-stale-tags’)->hourly();\n```\n\n`添加上述调度任务将配合最新的更新。`\n\
    \n# 数据库表达式\n\n数据库表达式在 Laravel 10 中已重写，以便将来能够添加功能。\n\n以下方法和手动转换需要由 `getValue` 方法替换：\n\
    \n*   使用 `(string)` 的手动转换\n*   `__toString` 方法\n\n此版本不再支持使用 `(string)` 的转换表达式。\n\
    \n# Eloquent\n\nEloquent 模型中的 `$dates` 属性已废弃。应用程序应使用 `$casts` 属性更新实例。\n\n例如：\n\
    \n```php\nprotected $casts = [\n    ‘deployed_at’ => ‘datetime’,\n];\n```\n\n\
    # 测试\n\n`MocksApplicationServices` trait 已被移除并废弃。\n\n该 trait 提供了以下方法：\n\n*   `expectsEvents`\n\
    *   `expectsJobs`\n*   `expectsNotifications`\n\n这些需要被以下方法替换（顺序如下）：\n\n*   `Event::fake`\n\
    *   `Bus::fake`\n*   `Notification::fake`\n\n# 语言目录\n\nLaravel 骨架不支持 `lang` 目录。任何新的\
    \ Laravel 应用都可以通过 `lang:publish` 命令发布目录：\n\n```bash\nphp artisan lang:publish\n\
    ```\n\n# Laravel 开发环境的安装与设置\n\n在本节中，我们将根据机器的操作系统查看 Laravel 开发环境的设置。对于三种常用的操作系统\
    \ – Windows、Mac 和 Linux，要求如下。\n\n"
- fmt: "\n```bash\nbrew install composer\n```\n\nThis will install the latest composer\
    \ version on the machine and also take care of any environment variable settings,\
    \ and setting the PATH on the machine.\n\nTo install a specific version of Composer,\
    \ run the following command:\n\n```bash\nbrew install composer@<versionNumber>\n\
    ```\n\nReplace `versionNumber` with the desired Composer Version number.\n\n###\
    \ Via Installer\n\nPerform the following steps to install Composer via the installer\
    \ on Mac:\n\n1. **Download the installer.** \n   Run the following command on\
    \ the terminal to download the latest version of Composer on Mac:\n   ```bash\n\
    \   sudo php -r “copy(‘https://getcomposer.org/installer’,’composer-setup.php’);”\n\
    \   ```\n\n2. **Verify installer via Hash**\n   Run the following command to verify\
    \ the authenticity of the installer:\n   ```bash\n   php -r «if (hash_file(‘sha384’,\
    \ ‘composersetup.php’) === ‘756890a4488ce9024fc62c56153228907f1545c228516cbf63f885e036d37e9a59d27d63f46af1d4d07ee0f76181c7d3’){echo\
    \ ‘Installer verified’;}else{echo ‘Installer corrupt’;unlink(‘composer-setup.php’);)}”\
    \ \n   ```\n\n3. **Run the setup.**\n   Run the setup file of Composer via the\
    \ terminal using the following command:\n   ```bash\n   php composer-setup.php\n\
    \   ```\n\n4. **Move the Phar file to `/usr/bin/composer`:**\n   ```bash\n   sudo\
    \ mv composer.phar /usr/local/bin/composer\n   ```\n\n5. **Run Composer.**\n \
    \  Type the following on the terminal to run Composer:\n   ```bash\n   composer\n\
    \   ```\n\nThe Composer version and help menu will be displayed, indicating Composer\
    \ is now successfully installed.\n\n# Windows\n\nPerform the following steps to\
    \ install Composer on Windows:\n\n1. Go to [www.getcomposer.org](http://www.getcomposer.org)\n\
    2. Click `Download` on the Composer website.\n3. Download `Composer-Setup.exe\
    \ file`.\n4. Select `Install for all users`.\n5. Let the default settings be selected\
    \ or choose the options as prompted.\n6. Wait for the installation to complete\
    \ and click `Finish`.\n\nComposer is now successfully installed on your Windows\
    \ machine. To verify the installation of Composer, open the command prompt and\
    \ run the following command:\n\n```bash\ncomposer\n```\n\nThe output will display\
    \ the version of the Composer installed, and you will be able to verify the successful\
    \ installation of the Composer.\n\n# Installing Laravel\n\nOnce PHP and Composer\
    \ are installed on the system, the steps to install Laravel are straightforward\
    \ for both platforms.\n\n### Via Installer\n\nTo install Laravel using the installer,\
    \ we make use of Composer.\n\nRun the following command on the terminal to download\
    \ the Laravel installer:\n```bash\ncomposer global require laravel/installer\n\
    ```\n\nOnce the installation is complete, the `new` command is used to create\
    \ a fresh installation of Laravel in the desired directory. The command for the\
    \ same is as follows:\n\n```bash\nlaravel new directoryName\n```\n\nIt is important\
    \ to make sure that the composer’s system-wide vendor bin is added as a part of\
    \ the `PATH` variable on your system. The directory location can be found using\
    \ the following command:\n\n```bash\ncomposer global about\n```\n\nGenerally,\
    \ the common locations based on the operating systems are as follows:\n\n**Mac**\n\
    `$HOME/.composer/vendor/bin`\n\n**Windows**\n`%USERPROFILE%\\AppData\\Roaming\\\
    Composer\\vendor\\bin`\n\n**Linux**\n`$HOME/.config/composer/vendor/bin`\nOr\n\
    `$HOME/.composer/vendor/bin`\n\n### Via Composer Create-Project\n\nThe Laravel\
    \ installation can also be done with the `create-project` command of Composer.\n\
    \nRun the following command on your terminal:\n```bash\ncomposer create-project\
    \ --prefer-dist laravel/laravel:^10.0 blog\n```\n\n### Via PHP serve\n\nLaravel\
    \ can also be run with PHP’s built-in development server. The `serve Artisan`\
    \ command is used for the same.\n\nRun the following command on your terminal:\n\
    ```bash\nphp artisan serve\n```\n\n# Laravel Artisan\n\nLaravel can also be run\
    \ with PHP’s built-in development server. The `serve Artisan` command is used\
    \ for the same.\n\nRun the following command on your terminal:\n```bash\nphp artisan\
    \ serve\n```\n\n### Scheduling Commands\n\nThe `schedule` is defined in the `Kernel.php`\
    \ file. To invoke the scheduler every minute, add the following to the `app/Console`\
    \ directory of your project.\n\n### Frequent Repeating Jobs\n\nTo schedule a job\
    \ every five minutes or every ten minutes, the schedule job code will look like\
    \ the following:\n\n**Job Every Five Minutes:**\n`$schedule->command('test’)->everyFiveMinutes();`\n\
    \n**Job Every Ten Minutes:**\n`$schedule->command('test’)->everyTenMinutes();`\n\
    \n**Daily Repeating Jobs:**\n`$schedule->command('test’)->daily();`\n\n**At a\
    \ Specific Time Daily:**\n`$schedule->command('test’)->dailyAt(‘10:00’);`\n\n\
    ### Specific Day Jobs\n\nThe following methods enable scheduling on specific days:\n\
    `mondays()`\n`tuesdays()`\n`wednesdays()`\n`thursdays()`\n`fridays()`\n`saturdays()`\n\
    `sundays()`\n\nBased on the frequency required of the scheduled jobs on specific\
    \ days of the week, the corresponding method can be used to schedule the job.\n\
    \n### Weekly Repeating Jobs\n\n`$schedule->command('test’)->weekly();`\n\n**At\
    \ a Specific Time Weekly:**\n`$schedule->command('test’)->weeklyOn(1,‘10:00’);`\n"
  raw: "`brew install composer`\n\nThis will install the latest composer version on\
    \ the machine and also take care of any environment variable settings, and setting\
    \ the PATH on the machine.\n\nTo install a specific version of Composer, run the\
    \ following command:\n\n`brew install composer@<versionNumber>`\n\nReplace `versionNumber`\
    \ with the desired Composer Version number.\n\n**Via Installer**\n\nPerform the\
    \ following steps to install Composer via the installer on Mac:\n\n1.  Download\
    \ the installer.\n\n    Run the following command on the terminal to download\
    \ the latest version of Composer on Mac:\n\n    `sudo php -r “copy(‘https://getcomposer.org/installer’,’composer-setup.php’);”`\n\
    \n2.  Verify installer via Hash\n\n    Run the following command to verify the\
    \ authenticity of the installer:\n\n    `php -r «if (hash_file(‘sha384’, ‘composer`\n\
    \n    `setup.php’) === ‘756890a4488ce9024fc62c56153228907f1545c228516cbf63f885e036d37e9a59d27d63f46af1d4d07ee0f76181c7d3’)`\n\
    \n    `{`\n\n    `echo ‘Installer verified’;`\n\n    `}`\n\n    `else`\n\n   \
    \ `{`\n\n    `echo ‘Installer corrupt’;`\n\n    `unlink(‘composer-setup.php’);`\n\
    \n    `}”`\n\n3.  Run the setup.\n\n    Run the setup file of Composer via the\
    \ terminal using the following command:\n\n    `php composer-setup.php`\n\n4.\
    \  Move the Phar file to `/usr/bin/composer`:\n\n    `sudo mv composer.phar /usr/local/bin/composer`\n\
    \n5.  Run Composer.\n\n    Type the following on the terminal to run Composer:\n\
    \n    `composer`\n\nThe Composer version and help menu will be displayed, indicating\
    \ Composer is now successfully installed.\n\n# [Windows](#toc.xhtml#s28a)\n\n\
    Perform the following steps to install Composer on Windows:\n\n1.  Go to [www.getcomposer.org](http://www.getcomposer.org)\n\
    \n2.  Click `Download` on the Composer website.\n\n3.  Download `Composer-Setup.exe\
    \ file`.\n\n4.  Select `Install for all users`.\n\n5.  Let the default settings\
    \ be selected or choose the options as prompted.\n\n6.  Wait for the installation\
    \ to complete and click `Finish`.\n\nComposer is now successfully installed on\
    \ your Windows machine. To verify the installation of Composer, open the command\
    \ prompt and run the following command:\n\n`composer`\n\nThe output will display\
    \ the version of the Composer installed, and you will be able to verify the successful\
    \ installation of the Composer.\n\n# [Installing Laravel](#toc.xhtml#s29a)\n\n\
    Once PHP and Composer are installed on the system, the steps to install Laravel\
    \ are straightforward for both platforms.\n\n**Via Installer**\n\nTo install Laravel\
    \ using the installer, we make use of Composer.\n\nRun the following command on\
    \ the terminal to download the Laravel installer:\n\n`composer global require\
    \ laravel/installer`\n\nOnce the installation is complete, the `new` command is\
    \ used to create a fresh installation of Laravel in the desired directory. The\
    \ command for the same is as follows:\n\n`laravel new directoryName`\n\nIt is\
    \ important to make sure that the composer’s system-wide vendor bin is added as\
    \ a part of the PATH variable on your system. The directory location can be found\
    \ using the following command:\n\n`composer global about`\n\nGenerally, the common\
    \ locations based on the operating systems are as follows:\n\n**Mac**\n\n`$HOME/.composer/vendor/bin`\n\
    \n**Windows**\n\n`%USERPROFILE%\\AppData\\Roaming\\Composer\\vendor\\bin`\n\n\
    **Linux**\n\n`$HOME/.config/composer/vendor/bin`\n\nOr\n\n`$HOME/.composer/vendor/bin`\n\
    \n**Via Composer Create-Project**\n\nThe Laravel installation can also be done\
    \ with the `create-project` command of Composer.\n\nRun the following command\
    \ on your terminal:\n\n`composer create-project --prefer-dist laravel/laravel:^10.0\
    \ blog`\n\n**Via PHP serve**\n\nLaravel can also be run with PHP’s built-in development\
    \ server. The `serve Artisan` command is used for the same.\n\nRun the following\
    \ command on your terminal:\n\n`php artisan serve`\n\n# [Laravel Artisan](#toc.xhtml#s30a)\n\
    \nLaravel’s command-line interface is `Artisan.` It enables the use of capabilities\
    \ both on the command line as well as outside CLI.\n\n**A Brief History of Artisan**\n\
    \nArtisan is the powerful Command-Line Interface (CLI) included with Laravel.\
    \ It provides powerful and robust capabilities for developers to develop Laravel\
    \ applications.\n\nThe Symphony Console Component is the backbone of Artisan and\
    \ helps power the capabilities of strong command-line features to easy developer\
    \ workflow.\n\n**Commands**\n\nArtisan is included with Laravel and does not require\
    \ any additional installation. Let’s look at some of the commands.\n\n*   **Version**\n\
    \n    To check the current Laravel version, run the following command on the terminal:\n\
    \n    `php artisan –version`\n\n*   **List**\n\n    The `list` command enables\
    \ you to view all the available Artisan commands. Use this to your advantage to\
    \ get the command list on the go. It serves as a dictionary of the Artisan commands\
    \ and can be accessed anytime on the terminal with the following command:\n\n\
    \    `php artisan list`\n\n    This will give you a list of all commands.\n\n\
    *   **Help**\n\n    The `help` command enables you to get more information about\
    \ the command it is used with. Let’s look at an example – to understand what the\
    \ `migrate` command does, use the following:\n\n    `php artisan help migrate`\n\
    \n    Whenever you want to understand what a command does, the arguments available\
    \ with the command, and the functionality of the command, use the `help` command.\n\
    \n*   **Scheduling Commands**\n\n    Laravel provides developers the capability\
    \ to schedule commands within Laravel itself, requiring only a single CRON entry\
    \ on the server.\n\n    *   CRON stands for Command Run On\n\n    The command\
    \ schedule is stored in the `Kernel.php` file located under the `app/Console`\
    \ directory. The schedule method in this class is used to define as many scheduled\
    \ jobs as desired with the `schedule` object.\n\n    To invoke the Laravel command\
    \ scheduler every minute, add the following code to the server:\n\n    `* * *\
    \ * * php /path/to/artisan schedule:run 1>> /dev/null 2>&1`\n\n    This will ensure\
    \ that the scheduler is called every minute, and then Laravel can take care of\
    \ the scheduled jobs and run them as per the defined schedule.\n\n*   **Frequent\
    \ Repeating Jobs**\n\n    To schedule a job every five minutes or every ten minutes,\
    \ the schedule job code will look like the following examples:\n\n    **Job Every\
    \ Five Minutes:**\n\n    `$schedule->command(‘test’)->everyFiveMinutes();`\n\n\
    \    **Job Every Ten Minutes:**\n\n    `$schedule->command(‘test’)->everyTenMinutes();`\n\
    \n    **Daily Repeating Jobs:**\n\n    `$schedule->command(‘test’)->daily();`\n\
    \n    **At a Specific Time Daily:**\n\n    `$schedule->command(‘test’)->dailyAt(‘10:00’);`\n\
    \n    The preceding command will run the job named `test` at 10 am every day.\
    \ The time at which the job needs to be triggered every day can be modified by\
    \ changing the time argument in the `dailyAt()` function.\n\n    This enables\
    \ load-balance on the server; the schedule of multiple jobs should be non-overlapping\
    \ so that the server does not become sluggish, and dependent jobs should be scheduled\
    \ before any dependent jobs are scheduled.\n\n    **Specific Day Jobs:**\n\n \
    \   The following methods enable to schedule jobs on specific days:\n\n    `mondays()`\n\
    \n    `tuesdays()`\n\n    `wednesdays()`\n\n    `thursdays()`\n\n    `fridays()`\n\
    \n    `saturdays()`\n\n    `sundays()`\n\n    Based on the frequency required\
    \ of the scheduled jobs on specific days of the week, the corresponding method\
    \ can be used to schedule the job.\n\n    Jobs can be scheduled to run every weekday\
    \ as well using the following method:\n\n    `weekdays()`\n\n    **Weekly Repeating\
    \ Jobs:**\n\n    `$schedule->command(‘test’)->weekly();`\n\n    **At a Specific\
    \ Time Weekly:**\n\n    `$schedule->command(‘test’)->weeklyOn(1,‘10:00’);`\n\n\
    \    The first argument of the `weeklyOn()` method is the day of the week the\
    \ developer wants the scheduled job to run. The second argument of the `weeklyOn()`\
    \ method is the time of the selected weekday (specified in the first parameter)\
    \ at which the job should run."
