  trans: "\n\n```\nAuth::loginUsingId(5);\n```\n\n作为 `loginUsingId` 函数的第二个参数，你可以发送一个布尔值。该值决定了是否需要授权会话的“记住我”功能。请记住，会话将持续验证身份，直到用户手动退出应用程序：\n\
    \n```php\nAuth::loginUsingId(5, $remember = true);\n```\n\n# 次性验证用户\n\n若要对单次请求对用户进行身份验证，请使用\
    \ `once` 方法。调用此方法时，不会使用任何会话或 Cookie：\n\n```php\nif (Auth::once($credentials))\
    \ {\n    // 代码逻辑\n}\n```\n\n# 使用中间件保护路由和操作\n\n虽然检查函数可能用于确定用户是否已通过验证，但你通常会使用中间件在授予访问特定路由或控制器之前确认用户已获得授权。\n\
    \n可以通过使用路由中间件将特定路由的访问限制为已授权的用户。Laravel 自带的认证中间件使用了 `Illuminate\\Auth\\Middleware\\\
    Authenticate` 类。你只需要将中间件附加到路由定义中，因为它已经在你应用程序的 HTTP 内核中注册了：\n\n```php\nRoute::get('/offices',\
    \ function () {\n    // 仅已验证用户的逻辑\n})->middleware('auth');\n```\n\n# 中间件\n\n中间件提供了一种简单的方法来分析和过滤进入应用程序的\
    \ HTTP 请求。例如，Laravel 自带了用于确认应用程序用户已通过验证的中间件。如果用户未获得授权，中间件会将用户引导至应用程序的登录界面。然而，如果用户已获得授权，中间件将允许请求在应用程序内部继续进行。\n\
    \n除了认证之外，还可以创建其他中间件来执行一系列活动。例如，日志中间件可以记录通过你应用程序的每个请求。Laravel 框架自带多种中间件，例如用于 CSRF\
    \ 保护和认证的中间件。`app/Http/Middleware` 目录包含了所有这些中间件。\n\n使用 `make:middleware` 命令创建新的中间件。执行命令如下：\n\
    \n```bash\nphp artisan make:middleware EnsureTokenIsValid\n```\n\n此操作将在 `app/Http/Middleware`\
    \ 目录中创建一个 `EnsureTokenIsValid` 类的新实例。在此中间件中，只有当提供的 `token` 输入满足预定义值时，我们才允许访问该路由。否则，我们将用户重定向回\
    \ `home` URL。\n\n```php\n<?php\n\nnamespace App\\Http\\Middleware;\n\nuse Closure;\n\
    use Illuminate\\Http\\Request;\nuse Symfony\\Component\\HttpFoundation\\Response;\n\
    \nclass EnsureTokenIsValid\n{\n    /**\n     * 处理传入的请求。\n     *\n     * @param\
    \ \\Closure(\\Illuminate\\Http\\Request): (\\Symfony\\Component\\HttpFoundation\\\
    Response) $next\n     */\n    public function handle(Request $request, Closure\
    \ $next): Response\n    {\n        if ($request->input('token') !== 'secret-token')\
    \ {\n            return redirect('home');\n        }\n        return $next($request);\n\
    \    }\n}\n```\n\n如你所示，如果提供的 token 与我们的密钥 `token` 不匹配，中间件将向客户端发送 HTTP 重定向；否则，请求将发送到应用程序。带有\
    \ `$request` 的 `$next` 回调会将请求进一步传递到应用程序，让中间件“通过”。\n\n理解中间件简单的方法是将其视为 HTTP 请求在访问你的应用程序之前必须经过的一系列层。每一层都有检查请求甚至完全拒绝请求的选择。\n\
    \n在将请求进一步转发到应用程序之前或之后，中间件可能会执行我们的任务。例如，此处显示的中间件将在应用程序处理请求之前执行任务：\n\n```php\n<?php\n\
    \nnamespace App\\Http\\Middleware;\n\nuse Closure;\nuse Illuminate\\Http\\Request;\n\
    use Symfony\\Component\\HttpFoundation\\Response;\n\nclass BeforeMiddleware\n\
    {\n    public function handle(Request $request, Closure $next)\n    {\n      \
    \  // 执行任务\n        return $next($request);\n    }\n}\n```\n\n在将请求进一步转发到应用程序之前或之后，中间件可能会执行我们的任务。例如，以下中间件将在应用程序处理请求后执行其功能：\n\
    \n```php\n<?php\n\nnamespace App\\Http\\Middleware;\n\nuse Closure;\nuse Illuminate\\\
    Http\\Request;\nuse Symfony\\Component\\HttpFoundation\\Response;\n\nclass AfterMiddleware\n\
    {\n    public function handle(Request $request, Closure $next): Response\n   \
    \ {\n        $response = $next($request);\n        // 执行任务\n        return $response;\n\
    \    }\n}\n```\n*来源：laravel.com/docs/ [`laravel.com/docs/`](https://laravel.com/docs/)*\n\
    \n# 为路由分配中间件\n\n如果你想对特定路由应用中间件，可以使用 `middleware` 方法：\n\n```php\nuse App\\Http\\\
    Middleware\\Authenticate;\n\nRoute::get('/EmployeeProfile', function () {\n  \
    \  // 代码逻辑\n})->middleware(Authenticate::class);\n```\n\n通过向 `middleware` 方法传递中间件数组，你可以为路由添加多个中间件：\n\
    \n```php\nRoute::get('/', function () {\n    // 逻辑\n})->middleware([First::class,\
    \ Second::class]);\n```\n\n你可以在应用程序的 `Kernel` 中提供中间件别名。Laravel 自带的中间件默认列在 `$middlewareAliases`\
    \ 字段中。你可以自由添加自己的中间件到该列表中：\n\n```php\n// 在 App\\Http\\Kernel 类中\nprotected $middlewareAliases\
    \ = [\n    'auth' => \\App\\Http\\Middleware\\Authenticate::class,\n    'auth.basic'\
    \ => \\Illuminate\\Auth\\Middleware\\AuthenticateWithBasic::class,\n    'bindings'\
    \ => \\Illuminate\\Routing\\Middleware\\SubstituteBindings::class,\n    'cache.headers'\
    \ => \\Illuminate\\Http\\Middleware\\SetCacheHeaders::class,\n    'allowed' =>\
    \ \\Illuminate\\Auth\\Middleware\\Authorize::class,\n    'guest' => \\App\\Http\\\
    Middleware\\RedirectIfAuthenticated::class,\n    'signed' => \\Illuminate\\Routing\\\
    Middleware\\ValidateSignature::class,\n    'throttle' => \\Illuminate\\Routing\\\
    Middleware\\ThrottleRequests::class,\n    'verified' => \\Illuminate\\Auth\\Middleware\\\
    EnsureEmailIsVerified::class,\n];\n```\n\n在向路由添加中间件时，你可以利用 HTTP 内核中指定的中间件别名：\n\
    \n```php\nRoute::get('/EmployeeProfile', function () {\n    // 代码逻辑\n})->middleware('auth');\n\
    ```\n\n# 中间件组\n\n为了方便向路由附加中间件，你可能希望将多个中间件聚合到一个键下。可以使用 HTTP 内核的 `$middlewareGroups`\
    \ 属性来实现。\n\nLaravel 预定义的 web 和 API 中间件包含了你可能希望在 `web` 和 `API` 路由使用的常用中间件。请记住，以下中间件组由应用程序的\
    \ `App\\Providers\\RouteServiceProvider` 服务程序自动应用到相关的 `web` 和 `api` 路由文件中：\n\n\
    ```php\n/**\n * 应用程序的路由中间件组。\n *\n * @var array\n */\nprotected $middlewareGroups\
    \ = [\n    'web' => [\n        \\App\\Http\\Middleware\\EncryptCookies::class,\n\
    \        \\Illuminate\\Cookie\\Middleware\\AddQueuedCookiesToResponse::class,\n\
    \        \\Illuminate\\Session\\Middleware\\StartSession::class,\n        \\Illuminate\\\
    View\\Middleware\\ShareErrorsFromSession::class,\n        \\App\\Http\\Middleware\\\
    VerifyCsrfToken::class,\n        \\Illuminate\\Routing\\Middleware\\SubstituteBindings::class,\n\
    \    ],\n    'api' => [\n        \\Illuminate\\Routing\\Middleware\\ThrottleRequests::class.':api',\n\
    \        \\Illuminate\\Routing\\Middleware\\SubstituteBindings::class,\n    ],\n\
    ];\n```\n\n"
- fmt: "\nIn order to assign the middleware groups, the syntax remains similar to\
    \ that of linking middleware to the routes and controllers. This helps in enabling\
    \ the logic in our Laravel application code and also attaching the middleware\
    \ to a route.\n\n```php\nRoute::get('/', function () {\n    // Code Logic\n})->middleware('web');\n\
    \nRoute::middleware(['web'])->group(function () {\n    // Code Logic\n});\n```\n\
    \nThe `App\\Providers\\RouteServiceProvider` automatically applies the `web` and\
    \ `api` middleware groups to the respective `routes/web.php` and `routes/api.php`\
    \ files in your application right out of the box.\n\n# Sorting Middleware\n\n\
    Rarely, you could require your middleware to run in a precise sequence, but you\
    \ wouldn’t have control over the order in which they appear when they are assigned\
    \ to the route. In this situation, the `$middlewarePriority` property of your\
    \ `app/Http/Kernel.php` file may be used to indicate your middleware priority.\n\
    \nYour HTTP kernel may not, by default, have this attribute. You can duplicate\
    \ its default definition if it doesn’t already exist:\n\n```php\n/**\n * The priority-sorted\
    \ list of middleware.\n *\n * This forces non-global middleware to always be in\
    \ the given order.\n *\n * @var string[]\n */\nprotected $middlewarePriority =\
    \ [\n    \\Illuminate\\Foundation\\Http\\Middleware\\HandlePrecognitiveRequests::class,\n\
    \    \\Illuminate\\Cookie\\Middleware\\EncryptCookies::class,\n    \\Illuminate\\\
    Session\\Middleware\\StartSession::class,\n    \\Illuminate\\View\\Middleware\\\
    ShareErrorsFromSession::class,\n    \\Illuminate\\Contracts\\Auth\\Middleware\\\
    AuthenticatesRequests::class,\n    \\Illuminate\\Routing\\Middleware\\ThrottleRequests::class,\n\
    \    \\Illuminate\\Routing\\Middleware\\ThrottleRequestsWithRedis::class,\n  \
    \  \\Illuminate\\Contracts\\Session\\Middleware\\AuthenticatesSessions::class,\n\
    \    \\Illuminate\\Routing\\Middleware\\SubstituteBindings::class,\n    \\Illuminate\\\
    Auth\\Middleware\\Authorize::class,\n];\n```\n\nSource: [https://laravel.com/docs/](https://laravel.com/docs/)\n\
    \n# Middleware Parameters\n\nAdditionally, middleware can be given more arguments.\
    \ For instance, you might design an `EnsureUserHasRole` middleware that accepts\
    \ a role name as a second parameter if your application has to confirm that the\
    \ authenticated user has a specific “role” before carrying out a specific operation.\n\
    \nAfter the `$next` argument, the middleware will receive additional parameters:\n\
    \n```php\n<?php\n\nnamespace App\\Http\\Middleware;\n\nuse Closure;\nuse Illuminate\\\
    Http\\Request;\nuse Symfony\\Component\\HttpFoundation\\Response;\n\nclass EnsureEmployeeHasRole\n\
    {\n    /**\n     * Handle an incoming request.\n     *\n     * @param \\Closure(\\\
    Illuminate\\Http\\Request): (\\Symfony\\Component\\HttpFoundation\\Response) $next\n\
    \     */\n    public function handle(Request $request, Closure $next, string $role):\
    \ Response\n    {\n        if (! $request->employee()->hasRole($role)) {\n   \
    \         // Redirect Logic\n        }\n        return $next($request);\n    }\n\
    }\n```\n\nWhen specifying the route, middleware parameters may be supplied by\
    \ separating the middleware name and parameters with a `: . Comma-separated lists\
    \ of arguments should be used:\n\n```php\nRoute::put('/post/{emp_id}', function\
    \ (string $emp_id) {\n    // Code Logic\n})->middleware('role:editor')\n```\n\n\
    # Terminable Middleware\n\nAfter the HTTP response has been sent to the browser,\
    \ a middleware may occasionally need to do some tasks. If your middleware contains\
    \ a `terminate` method and your web server employs FastCGI, the `terminate` method\
    \ will be automatically invoked following the transmission of the response to\
    \ the browser:\n\n```php\n<?php\n\nnamespace Illuminate\\Session\\Middleware;\n\
    \nuse Closure;\nuse Illuminate\\Http\\Request;\nuse Symfony\\Component\\HttpFoundation\\\
    Response;\n\nclass TerminatingMiddleware\n{\n    /**\n     * Handle an incoming\
    \ request.\n     *\n     * @param \\Closure(\\Illuminate\\Http\\Request): (\\\
    Symfony\\Component\\HttpFoundation\\Response) $next\n     */\n    public function\
    \ handle(Request $request, Closure $next): Response\n    {\n        return $next($request);\n\
    \    }\n\n    /**\n     * Handle tasks after the response has been sent to the\
    \ browser.\n     */\n    public function terminate(Request $request, Response\
    \ $response): void\n    {\n        // Code Logic for termination\n    }\n}\n```\n\
    \nBoth the request and the response should be sent to the `terminate` method.\
    \ Once a terminable middleware has been defined, it should be added to the `app/Http/Kernel.php`\
    \ file’s list of routes or global middleware.\n\nLaravel will resolve a new instance\
    \ of your middleware from the service container when you use the middleware’s\
    \ `terminate` function. utilize the singleton method of the container to register\
    \ the middleware if you want to utilize the same instance of the middleware when\
    \ the `handle` and `terminate` methods are invoked. Normally, this should be carried\
    \ out in your `AppServiceProvider`’s `register` method:\n\n```php\nuse App\\Http\\\
    Middleware\\TerminatingMiddleware;\n\n/**\n * Register any application services\n\
    \ */\npublic function register(): void\n{\n    $this->app->singleton(TerminatingMiddleware::class);\n\
    }\n```\n\n# Conclusion\n\nThis chapter digs into Laravel’s robust authentication\
    \ system, concentrating on guards, providers, and several authentication techniques.\
    \ Laravel’s authentication system is built on the basic notion of guards and providers.\n\
    \nAuthentication and authorization are critical when developing any software application.\
    \ In the scenario of developing a Laravel application, security, user session\
    \ management, authorized access, and password management become the critical methods\
    \ to achieve security.\n\nThroughout the chapter, we looked into how the same\
    \ can be achieved with hands-on examples to follow along and it is imperative\
    \ to have these features in your Laravel application, especially when you will\
    \ build a multi-user application.\n\n# Points to Remember\n\n- In-de facto, this\
    \ chapter digs into Laravel’s robust authentication system, concentrating on guards,\
    \ providers, and several authentication techniques. Laravel’s authentication system\
    \ is built on the basic notion of guards and providers.\n- Guards specify each\
    \ request’s authentication mechanism, while providers retrieve users from persistent\
    \ storage. Laravel has guards such as session guards, which employ cookies and\
    \ session data to authenticate users.\n- The chapter covers the notion of Laravel\
    \ API Authentication Services, featuring packages such as Passport and Sanctum\
    \ for handling API tokens and authentication requests. It stresses how these packages\
    \ work in conjunction with the built-in cookie-based authentication scheme.\n\
    - Customization of authentication and registration logic is shown, highlighting\
    \ HTTP Authentication as a way to quickly authenticate users without requiring\
    \ a separate login page. API token authentication is illustrated using stateless\
    \ HTTP Authentication.\n- The chapter also goes into bespoke user providers for\
    \ non-standard relational databases, walking readers through the process of creating\
    \ and deploying these providers. Laravel’s contracts, such as UserProvider and\
    \ Authenticatable, are well-defined.\n- Furthermore, the chapter demonstrates\
    \ how to invalidate sessions across various devices to ensure user security.\n"
  raw: 'In order to assign the middleware groups, the syntax remains similar to that
    of linking middleware to the routes and controllers. This helps in enabling the
    logic in our Laravel application code and also attaching the middleware to a route.


    `Route::get(‘/’, function () {`


    `// Code Logic`


    `})->middleware(‘web’);`


    `Route::middleware([‘web’])->group(function () {`


    `// Code Logic`


    `});`


    The `App\Providers\RouteServiceProvider` automatically applies the `web` and `api`
    middleware groups to the respective `routes/web.php` and `routes/api.php` files
    in your application right out of the box.


    # [Sorting Middleware](#toc.xhtml#s188a)


    Rarely, you could require your middleware to run in a precise sequence, but you
    wouldn’t have control over the order in which they appear when they are assigned
    to the route. In this situation, the `$middlewarePriority` property of your `app/Http/Kernel.php`
    file may be used to indicate your middleware priority.


    Your HTTP kernel may not, by default, have this attribute. You can duplicate its
    default definition if it doesn’t already exist:


    `/**`


    `* The priority-sorted list of middleware.`


    `*`


    `* This forces non-global middleware to always be in the given order.`


    `*`


    `* @var string[]`


    `*/`


    `protected $middlewarePriority = [`


    `\Illuminate\Foundation\Http\Middleware\HandlePrecognitiveRequests::class,`


    `\Illuminate\Cookie\Middleware\EncryptCookies::class,`


    `\Illuminate\Session\Middleware\StartSession::class,`


    `\Illuminate\View\Middleware\ShareErrorsFromSession::class,`


    `\Illuminate\Contracts\Auth\Middleware\AuthenticatesRequests::class,`


    `\Illuminate\Routing\Middleware\ThrottleRequests::class,`


    `\Illuminate\Routing\Middleware\ThrottleRequestsWithRedis::class,`


    `\Illuminate\Contracts\Session\Middleware\AuthenticatesSessions::class,`


    `\Illuminate\Routing\Middleware\SubstituteBindings::class,`


    `\Illuminate\Auth\Middleware\Authorize::class,`


    `];`


    *Source: [https://laravel.com/docs/](https://laravel.com/docs/)*


    # [Middleware Parameters](#toc.xhtml#s189a)


    Additionally, middleware can be given more arguments. For instance, you might
    design an `EnsureUserHasRole` middleware that accepts a role name as a second
    parameter if your application has to confirm that the authenticated user has a
    specific “role” before carrying out a specific operation.


    After the `$next` argument, the middleware will receive additional parameters:


    `<?php`


    `namespace App\Http\Middleware;`


    `use Closure;`


    `use Illuminate\Http\Request;`


    `use Symfony\Component\HttpFoundation\Response;`


    `class EnsureEmployeeHasRole`


    `{`


    `/**`


    `* Handle an incoming request.`


    `*`


    `* @param \Closure(\Illuminate\Http\Request): (\Symfony\Component\HttpFoundation\Response)
    $next`


    `*/`


    `public function handle(Request $request, Closure $next, string $role): Response`


    `{`


    `if (! $request->employee()->hasRole($role)) {`


    `// Redirect Logic`


    `}`


    `return $next($request);`


    `}`


    `}`


    When specifying the route, middleware parameters may be supplied by separating
    the middleware name and parameters with a `:` . Comma-separated lists of arguments
    should be used:


    `Route::put(‘/post/{emp_id}’, function (string $emp_id) {`


    `// Code Logic`


    `})->middleware(‘role:editor’)`


    # [Terminable Middleware](#toc.xhtml#s190a)


    After the HTTP response has been sent to the browser, a middleware may occasionally
    need to do some tasks. If your middleware contains a `terminate` method and your
    web server employs FastCGI, the `terminate` method will be automatically invoked
    following the transmission of the response to the browser:


    `<?php`


    `namespace Illuminate\Session\Middleware;`


    `use Closure;`


    `use Illuminate\Http\Request;`


    `use Symfony\Component\HttpFoundation\Response;`


    `class TerminatingMiddleware`


    `{`


    `/**`


    `* Handle an incoming request.`


    `*`


    `* @param \Closure(\Illuminate\Http\Request): (\Symfony\Component\HttpFoundation\Response)
    $next`


    `*/`


    `public function handle(Request $request, Closure $next): Response`


    `{`


    `return $next($request);`


    `}`


    `/**`


    `* Handle tasks after the response has been sent to the browser.`


    `*/`


    `public function terminate(Request $request, Response $response): void`


    `{`


    `// Code Logic for termination`


    `}`


    `}`


    Both the request and the response should be sent to the `terminate` method. Once
    a terminable middleware has been defined, it should be added to the `app/Http/Kernel.php`
    file’s list of routes or global middleware.


    Laravel will resolve a new instance of your middleware from the service container
    when you use the middleware’s `terminate` function. utilize the singleton method
    of the container to register the middleware if you want to utilize the same instance
    of the middleware when the `handle` and `terminate` methods are invoked. Normally,
    this should be carried out in your `AppServiceProvider`’s register method:


    `use App\Http\Middleware\TerminatingMiddleware;`


    `/**`


    `* Register any application services of the application Logic`


    `*/`


    `public function register(): void`


    `{`


    `$this->app->singleton(TerminatingMiddleware::class);`


    `}`


    # [Conclusion](#toc.xhtml#s191a)


    This chapter digs into Laravel’s robust authentication system, concentrating on
    guards, providers, and several authentication techniques. Laravel’s authentication
    system is built on the basic notion of guards and providers.


    Authentication and authorization are critical when developing any software application.
    In the scenario of developing a Laravel application, security, user session management,
    authorized access, and password management become the critical methods to achieve
    security in our Laravel application.


    Throughout the chapter, we looked into how the same can be achieved with hands-on
    examples to follow along and it is imperative to have these features in your Laravel
    application, especially when you will build a multi-user application in Laravel.


    In the next chapter, we will look into API development in Laravel, and look into
    the RSET APIs, the Laravel Passport API, and much more.


    # [Points to Remember](#toc.xhtml#s192a)


    *   This chapter digs into Laravel’s robust authentication system, concentrating
    on guards, providers, and several authentication techniques. Laravel’s authentication
    system is built on the basic notion of guards and providers.


    *   Guards specify each request’s authentication mechanism, while providers retrieve
    users from persistent storage. Laravel has guards such as session guards, which
    employ cookies and session data to authenticate users.


    *   The chapter covers the notion of Laravel API Authentication Services, featuring
    packages such as Passport and Sanctum for handling API tokens and authentication
    requests. It stresses how these packages work in conjunction with the built-in
    cookie-based authentication scheme.


    *   Customization of authentication and registration logic is shown, highlighting
    HTTP Authentication as a way to quickly authenticate users without requiring a
    separate login page. API token authentication is illustrated using stateless HTTP
    Authentication.


    *   The chapter also goes into bespoke user providers for non-standard relational
    databases, walking readers through the process of creating and deploying these
    providers. Laravel’s contracts, such as UserProvider and Authenticatable, are
    well-defined.


    *   Furthermore, the chapter demonstrates how to invalidate sessions across various
    devices to ensure user security.


    *   Remember the functionality, middleware, and authentication routing are all
    addressed, as well as the construction and use of custom guards. The notion of
    middleware is investigated, both for route security and for doing activities before
    or after request processing.


    # [CHAPTER 7](#toc.xhtml#c07)


    # [Developing APIs with Laravel](#toc.xhtml#c07)


