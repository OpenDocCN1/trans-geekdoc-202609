  trans: "\n\n让我们先从一个简单的例子开始。我们将先查看页面布局。将此样式指定为单个 Blade 视图是非常简单的，因为大多数 Web 应用在许多页面中保持相同的整体布局：\n\
    \n```html\n<!-- resources/views/layouts/app.blade.php -->\n<html>\n<head>\n  \
    \  <title>App Name - @yield('title')</title>\n</head>\n<body>\n    @section('sidebar')\n\
    \    这是主侧边栏。\n    @show\n    <div class=\"container\">\n        @yield('content')\n\
    \    </div>\n</body>\n</html>\n```\n\n正如你所所的，该文件包含普通的 HTML 标记。但是，请注意 `@section`\
    \ 和 `@yield` 指令。`@yield` 指令用于显示特定区域的内容，而 `@section` 指令如其名所示，定义了一个内容区域。\n\n## 渲染\
    \ Blade 模板\n\n有时可能需要将原始 Blade 模板字符串转换为适当的 HTML。可以通过利用 `Blade` 门面（facade）的 `render`\
    \ 方法来实现。`render` 方法接受 Blade 模板字符串和一个用于填充模板的可选数据数组：\n\n```php\nuse Illuminate\\\
    Support\\Facades\\Blade;\nreturn Blade::render('Welcome, {{ $name }}', ['name'\
    \ => 'ABC']);\n```\n\n通过将内联 Blade 模板写入到 `storage/framework/views` 目录，Laravel 会渲染它们。如果你想让\
    \ Laravel 在渲染 Blade 模板后删除这些临时文件，可以为函数提供 `deleteCachedView` 参数：\n\n```php\nreturn\
    \ Blade::render(\n    'Welcome, {{ $name }}',\n    ['name' => 'ABC'],\n    deleteCachedView:\
    \ true\n);\n```\n\n## 渲染 Blade 片段\n\n在利用 Turbo 和 htmx 等前端框架时，有时可能只需要在 HTTP 响应中仅返回\
    \ Blade 模板的一部分。你可以通过使用 Blade 片段（fragments）来实现。。将你的 Blade 模板的一个部分放在 `@fragment`\
    \ 和 `@endfragment` 指令中即可开始：\n\n```html\n@fragment('employee-list')\n<ul>\n   \
    \ @foreach ($employees as $employee)\n        <li>{{ $employee->name }}</li>\n\
    \    @endforeach\n</ul>\n@endfragment\n```\n\n然后，你可以使用 `fragment` 方法指定在显示使用此模板的视图时，仅在传出的\
    \ HTTP 响应中包含给定的片段：\n\n```php\nreturn view('homepage', ['employee' => $employees])->fragment('employee-list');\n\
    ```\n\n通过使用 `fragmentIf` 方法，你可以根据指定条件条件返回视图片段。在这种情况下，将返回整个视图：\n\n```php\nreturn\
    \ view('homepage', ['employees' => $employees])\n    ->fragmentIf($request->hasHeader('HX-Request'),\
    \ 'employee-list');\n```\n\n这两个方法——`fragments` 和 `fragmentIf` 允许在响应中返回多个视图片段。例如：\n\
    \n```php\nview('homepage', ['employees' => $employee])\n    ->fragments(['employee-list',\
    \ 'task-list']);\n\nview('homepage', ['employees' => $employees])\n    ->fragmentsIf(\n\
    \        $request->hasHeader('HX-Request'),\n        ['employee-list', 'task-list']\n\
    \    );\n```\n\n## 总结\n\n在本章中，我们探索了 Laravel Web 开发的核心组件——控制器（Controllers）和 Blade\
    \ 模板。控制器在 MVC 架构中非常重要，因为它们分组了路由的功能。我们讨论了如何使用 Artisan 命令创建控制器，以及如何管理特定资源的动作。\n\n\
    在下一章中，我们将深入研究 Laravel 中的 Eloquent 和查询构造器（Query Builder），它们对于数据库操作至关重要。后续章节还将涵盖如何使用查询构造器对数据库执行常用的\
    \ Eloquent 操作。\n\n## 注意事项\n\n- 资源控制器（Resource Controllers）提供了一种处理应用程序中多个资源 CRUD\
    \ 操作的方便方法，它是使用 `make:controller` 命令生成的。为资源控制器定义了路由。\n- 构造函数注入和方法注入可以将依赖项自动解析并注入到控制器实例中，提供了整洁且组织的代码。\n\
    - Laravel 中的重定向（Redirects）是将用户发送到不同 URL 的响应。创建重定向有多种方法，包括重定向助手、命名路由和控制器动作。此外，闪存\
    \ Session 数据（flashing session data）用于在重定向期间显示成功消息或保留输入数据。\n- Blade 模板中的指令是在视图中执行特定逻辑或操作的指令。有多种类型，包括条件指令、switch\
    \ 指令以及如 `@auth` 和 `@guest` 等身份验证指令，有助于在视图中管理用户身份验证。\n- Blade 中的循环指令包括 `@for`、`@foreach`、`@forelse`\
    \ 和 `@while`，能够高效地处理重复任务和数据显示。`@continue` 和 `@break` 用于在满足某些条件时跳过迭代或退出循环。\n- `@once`\
    \ 指令允许模板的一个部分在渲染期间只求值一次，这对于将 JavaScript 脚本等特定内容推送到头部非常有用。\n- Blade 作为 Laravel\
    \ 的模板引擎提供了一种整洁且表达的方式来创建混合了 PHP 和 HTML 的视图。组件和布局有助于在应用程序中保持设计一致，使代码更加模块化可重用。\n\n\
    # 第 5 章：使用 Eloquent ORM 和查询构造器\n\n### 引言\n\n本章涵盖了用于数据库操作 Laravel Eloquent 和查询构造器。它解释了\
    \ Eloquent 和查询构造器在构建健壮高效应用程序中的重要性。\n\n### 结构\n\n在本章将涵盖以下主题：\n\n- Laravel 中的 Eloquent\n\
    \    - 约定\n    - Eloquent 事件\n- Laravel 中的查询构造器\n    - 查询 (Selects)\n    - 遍历\
    \ (Joins)\n    - 高级 Where 查询\n    - 聚合函数 (Aggregates)\n    - 原始表达式 (Raw Expressions)\n\
    \    - 悲观锁 (Pessimistic Locking)\n    - 缓存查询 (Caching Queries)\n- Eloquent 操作\n\
    \    - 模型类\n    - 模型约定\n    - 获取模型\n    - 模型的 CRUD 操作\n\n### Laravel 中的 Eloquent\n\
    \nEloquent 是一种对象关系映射（ORM），它使与应用程序数据库的交互变得简单易用，它是 Laravel 的一个组件。Eloquent 中的每个数据库表都有对应的模型，用于与表通信。Eloquent\
    \ 模型除了获取记录外，具有插入、编辑和删除数据库表记录的操作。\n\n`Illuminate\\Database\\Eloquent\\Model` 类通常会被模型扩展，模型通常位于\
    \ `app\\Models` 目录。使用 `make:model` Artisan 命令可以创建新模型：\n\n```bash\nphp artisan\
    \ make:model Car\n```\n\n在创建模型并需要生成数据库迁移时，使用 `--migration` 或 `-m` 选项。\n\n创建模型时，你还可以创建不同的类，如工厂（factory）、填充器（seed）、策略（policy）、控制器和表单请求（form\
    \ requests）。此外，通过组合这些选项可以一次创建多个类：\n\n#### 生成模型和 CarFactory 类\n\n```bash\nphp artisan\
    \ make:model Car --factory\nphp artisan make:model Car -f\n```\n*工厂是定义用于测试和数据库填充的数据结构和属性的一种方法。\n\
    \n#### 生成模型和 CarSeeder 类\n\n```bash\nphp artisan make:model Car --seed\nphp artisan\
    \ make:model Car -s\n```\n\n#### 生成模型和 CarController 类\n\n```bash\nphp artisan\
    \ make:model Car --controller\nphp artisan make:model Car -c\n```\n\n"
- fmt: "\n# Generate a model, CarController resource class, and form request classes\n\
    \n```bash\nphp artisan make:model Car --controller --resource --requests\n```\n\
    \n```bash\nphp artisan make:model Car -crR\n```\n\n# Generate a model and a CarPolicy\
    \ class\n\n```bash\nphp artisan make:model Car --policy\n```\n\n# Generate a model\
    \ and a migration, factory, seeder, and controller\n\n```bash\nphp artisan make:model\
    \ Car -mfsc\n```\n\n# Shortcut to generate a model, migration, factory, seeder,\
    \ policy, controller, and form requests\n\n```bash\nphp artisan make:model Car\
    \ --all\n```\n\n# Generate a pivot model\n\n```bash\nphp artisan make:model Member\
    \ --pivot\n```\n\n```bash\nphp artisan make:model Member -p\n```\n\n# Database\
    \ Migrations\n\nDatabase migrations play a crucial role in managing version control\
    \ for databases, allowing your team to formulate and distribute the schema definition\
    \ for the application’s database. If you’ve ever encountered the challenge of\
    \ instructing a team member to manually integrate a new column into their local\
    \ database schema after pulling your changes from source control, you’ve likely\
    \ grappled with the problem that database migrations aim to solve.\n\nThe Laravel\
    \ Schema facade offers a versatile solution for creating and manipulating tables\
    \ in a manner that is independent of the underlying database system. This facade\
    \ is commonly employed in migrations to facilitate the creation and modification\
    \ of database tables and columns across all of Laravel’s supported database systems.\n\
    \nTo create a database migration, use the `make:migration` Artisan command. The\
    \ newly created migration will be saved in your `database/migrations` directory.\
    \ Each migration filename has a date, which helps Laravel to identify the migrations’\
    \ order:\n\n```bash\nphp artisan make:migration create_cars_table\n```\n\nLaravel\
    \ endeavors to predict the table name and determine whether a migration will generate\
    \ a new table by analyzing the migration’s name. If Laravel can deduce the table\
    \ name from the migration name, it automatically populates the created migration\
    \ file with the identified table. However, if the table name cannot be inferred,\
    \ you have the option to explicitly specify the table within the migration file.\n\
    \nWhen employing the `make:migration` command, you have the flexibility to utilize\
    \ the `--path` option to designate a particular path for the resultant migration.\
    \ The specified path should be relative to your application’s base path.\n\n#\
    \ Primary Key\n\nEloquent will additionally presume that the associated database\
    \ table for each model contains an `id` primary key field. If required, you may\
    \ designate a different column as your model’s main key by creating a protected\
    \ `$primaryKey` property on your model:\n\n```php\n<?php\n\nnamespace App\\Models;\n\
    use Illuminate\\Database\\Eloquent\\Model;\nclass Car extends Model\n{\n    /*\n\
    \     * The primary key associated with the table.\n     *\n     * @var string\n\
    \     */\n    protected $primaryKey = ‘car_id’;\n}\n```\n\nEach model must have\
    \ at least one ID that may act as its primary key according to Eloquent. Eloquent\
    \ models do not allow composite main keys. However, in addition to the main key\
    \ that uniquely identifies the table, you are allowed to add other multi-column,\
    \ unique indexes to your database tables.\n\n# Timestamps\n\nBy default, Eloquent\
    \ anticipates the associated database table for your model to have the fields\
    \ `created_at` and `updated_at`. When models are made or changed, Eloquent will\
    \ automatically set the values for these columns. You should set the `$timestamps`\
    \ property on your model to `false` if you do not want Eloquent to manage these\
    \ columns automatically:\n\n```php\n<?php\n\nnamespace App\\Models;\nuse Illuminate\\\
    Database\\Eloquent\\Model;\nclass Car extends Model\n{\n    /*\n     * Indicates\
    \ if the model should be timestamped.\n     *\n     * @var bool\n     */\n   \
    \ public $timestamps = false;\n}\n```\n\nYou can work on the model within a closure\
    \ provided by the `withoutTimestamps` function if you don’t want the model’s `updated_at`\
    \ timestamp to be changed while you’re working on it.\n\n# Eloquent Events\n\n\
    The different events in the lifecycle of an Eloquent can be used in any logical\
    \ order and are as follows:\n\n![](images/Figure-5.1.jpg)\n\n**Figure 5.1:** Eloquent\
    \ Events\n\nWhen a current model is obtained from the database, the retrieved\
    \ event will be sent. The creating and created events will be dispatched when\
    \ a new model is stored for the first time. When an existing model is changed\
    \ and the `save` method is invoked, the updating/updated events will be dispatched.\
    \ When a model is created or modified, even if its characteristics have not changed,\
    \ the saving/saved events will be dispatched.\n\nEvents with names that end in\
    \ `-ing` are sent out before any model changes are saved, whereas events with\
    \ names that end in `-ed` are sent out once the changes to the model have been\
    \ saved.\n\nFor instance, create a `$dispatchesEvents` property on your Eloquent\
    \ model to begin receiving model events. This property associates your own event\
    \ classes with various phases of the Eloquent model’s lifecycle. Each model event\
    \ class should anticipate receiving a constructor call from the impacted model’s\
    \ instance:\n\n```php\n<?php\n\nnamespace App\\Models;\nuse Illuminate\\Events\\\
    UserDeleted;\nuse Illuminate\\Events\\UserSaved;\nuse Illuminate\\Foundation\\\
    Auth\\User as Authenticatable;\nuse Illuminate\\Notifications\\Notifiable;\nclass\
    \ User extends Authenticatable\n{\n    use Notifiable;\n    /*\n     * The event\
    \ map for the model.\n     *\n     * @var array\n     */\n    protected $dispatchesEvents\
    \ = [\n        'saved' => UserSaved::class,\n        'deleted' => UserDeleted::class,\n\
    \    ];\n}\n```\n\n**Source**: Laravel.com/docs\n\n# Query Builder in Laravel\n\
    \nQuery Builder is one of the Laravel’s most crucial features. The query builder\
    \ provided by Laravel provides a simple and intuitive interface for developing\
    \ queries. The majority of database activities use this method. To safeguard the\
    \ application from any injection threats, it uses PDO binding.\n\n# Selects\n\n\
    Selects are used to retrieve data in Laravel. In understanding Query Builder,\
    \ we will look into the Employee scenario.\n\nTo fetch all rows:\n\n```php\n$employees\
    \ = DB::table('employees')->get();\nforeach ($employees as $employee)\n{\n   \
    \ var_dump($employee->name);\n}\n```\n\nTo fetch a single row:\n\n```php\n$employee\
    \ = DB::table('employees')->where('name', 'ABC')->first();\nvar_dump($employee->name);\n\
    ```\n\nTo fetch a single column:\n\n```php\n$employee = DB::table('employees')->where('name',\
    \ 'ABC')->pluck('name');\n```\n\nSelect Clause:\n\n```php\n$employees = DB::table('employees')->select('name',\
    \ 'email')->get();\n$employees = DB::table('employees')->distinct()->get();\n\
    $employees = DB::table('employees')->select('name as employeeName')->get();\n\
    ```\n\nOR Statements:\n\n```php\n$employees = DB::table('employees')\n->where('employedDays',\
    \ '>', 180)\n->orWhere('name', 'ABC')\n->get();\n```\n\nOrderBy, GroupBy, and\
    \ having:\n\n```php\n$employees = DB::table('employees')\n->orderBy('name', 'desc')\n\
    ->groupBy('count')\n->having('count', '>', 180)\n->get();\n```\n\n# Joins\n\n\
    Based on a shared column between two or more columns, a JOIN clause is used to\
    \ merge rows from those tables.\n\nSyntax with an example:\n\n```php\nDB::table('employees')\n\
    ->join('contacts', 'employees.id', '=', 'contacts. employee _id')\n->join('orders',\
    \ 'employees.id', '=', 'orders. employee _id')\n->select('employees.id', 'contacts.phone',\
    \ 'orders.price')\n->get();\n```\n\n# Left Join\n\n![](images/Figure-5.2.jpg)\n\
    \n**Figure 5.2:** Left Join\n\nTo implement a join in code, refer to the following\
    \ code example:\n\n```php\nDB::table('employees')\n```\n"
