  raw: 'Once your domain has a valid SSL certificate, you may use the `domain` configuration
    option in your application’s `vapor.yml` file to connect it to your environment.
    You do not need to add the www subdomain when linking a domain to an environment:


    `id: 3`


    `name: vapor-laravel-app`


    `environments:`


    `production:`


    `domain: example.com`


    `build:`


    `- ‘composer install --no-dev’`


    Vapor will automatically set up the environment to handle requests from this domain
    upon deployment. However, because of the nature of AWS CloudFront, custom domains
    sometimes take 30-45 minutes to completely activate. So, don’t be concerned if
    your custom domain isn’t instantly available after deployment.


    Vapor lets you associate many domains with a single project. Make sure you have
    a valid certificate for each of the domains before proceeding. Then, change the
    `vapor.yml` file in your application to add each domain:


    `id: 3`


    `name: vapor-laravel-app`


    `environments:`


    `production:`


    `domain:`


    `- example1.com`


    `- example2.com`


    `build:`


    `- ‘composer install --no-dev’`


    As long as you have a valid certificate for the parent domain, you can specify
    that a domain should enable wildcard subdomains. To associate a wildcard domain
    with an environment, use `*` as the subdomain:


    `id: 3`


    `name: vapor-laravel-app`


    `environments:`


    `production:`


    `domain: ‘*.example.com’`


    `build:`


    `- ‘composer install --no-dev’`


    **Multi-Level Subdomains**


    Vapor supports multiple-level subdomains, such as `v1.api.example.com`. To use
    this capability, a certificate that specifically covers the whole multi-level
    subdomain must be obtained.


    The certificate may be obtained by using the Vapor CLI:


    `vapor cert v1.api.example.com`


    A certificate for a multi-level subdomain may also be obtained via the Vapor domains
    dashboard by specifying the multi-level subdomain as either the `Domain Name`
    or any of the `Alternative Names` in the `Advanced Settings` when requesting a
    certificate.


    When the certificate is granted, you may access your application from your multi-level
    subdomain by adding it to the `domain` section of your `vapor.yml` configuration
    file and doing a complete deployment via the Vapor CLI:


    `id: 3`


    `name: vapor-laravel-app`


    `environments:`


    `production:`


    `domain: ‘v1.api.example.com’`


    `build:`


    `- ‘composer install --no-dev’`


    # [Troubleshooting](#toc.xhtml#s289a)


    While leveraging Vapor to drive your Laravel applications can significantly enhance
    load speeds, it’s important to address potential performance issues stemming from
    misconfigured infrastructure.


    This section delves into a series of key techniques for optimizing Vapor infrastructure,
    with the aim of bolstering the speed of your Laravel applications. Before we delve
    into these techniques, it’s crucial to consider the following points:


    *   **Prioritize application optimization:** Boosting your application’s speed
    might eliminate the need for any modifications to the infrastructure. Identify
    and address performance bottlenecks within the application by implementing fundamental
    strategies such as caching, queuing, or optimizing database queries.


    Be mindful of the potential impact on your AWS expenses: Implementing changes
    to your Vapor environment by adding or adjusting resources could lead to an increase
    in your AWS bill.


    *   **Utilizing fixed-capacity databases:**


    Serverless databases are designed to scale automatically, without a predefined
    limit on RAM or disk space. However, AWS’s method of *auto-scaling* can lead to
    brief delays known as cold starts whenever additional database resources are needed
    within your environment.


    To mitigate this challenge, consider implementing *fixed-capacity* databases that
    come with pre-allocated resources. You can easily create these databases using
    either the Vapor UI or the dedicated database CLI command.


    *   **Opting API Gateway v2 over API Gateway v1 for improved performance:**


    Transitioning from API Gateway v1 to API Gateway v2 can lead to a significant
    50% decrease in query latency for your application. However, it’s important to
    note that API Gateway v2 operates on a regional basis, potentially impacting clients
    located in distant regions. Furthermore, certain functionalities like Vapor’s
    controlled Firewall may not be accessible with this switch.


    To integrate API Gateway 2.0, simply include gateway-version: 2 in the settings
    of your environment’s `vapor.yml` file.


    # [Conclusion](#toc.xhtml#s290a)


    The chapter, *Deploying Laravel: A Comprehensive Guide*, delves into the crucial
    process of deploying a Laravel application to the cloud. It begins by discussing
    the fundamentals of cloud deployment, emphasizing the importance of choosing the
    right cloud service provider, setting up infrastructure, and prioritizing security.
    The chapter highlights the significance of containerization, continuous integration,
    and continuous deployment (CI/CD) pipelines, as well as monitoring and managing
    performance in the cloud.


    Furthermore, the chapter provides an insightful overview of three major cloud
    providers: Heroku, Amazon Web Services (AWS), and Google Cloud, analyzing their
    unique features and benefits for hosting Laravel applications. The discussion
    sheds light on the distinctive offerings and considerations involved in selecting
    a cloud provider.


    The focal point of the chapter is the deployment of Laravel applications with
    Laravel Vapor, an auto-scaling, serverless Laravel deployment tool powered by
    AWS Lambda. The chapter walks through the prerequisites, installation, and configuration
    process, including setting up environments, handling environment variables, deploying
    applications, and managing domains. It also provides detailed instructions and
    code snippets to facilitate a smooth deployment process.


    Notably, the chapter covers essential topics such as hooks, development considerations,
    customizing OpenSSL, configuring domains, managing DNS records, and handling SSL
    certificates. It concludes with a comprehensive section on troubleshooting common
    performance issues and optimizing the infrastructure for enhanced application
    speed, all while being mindful of potential impacts on AWS expenses.


    Throughout the chapter, emphasis is placed on practical implementation, with step-by-step
    instructions and real-world scenarios to guide readers through the complexities
    of deploying Laravel applications to the cloud. The provided insights and best
    practices serve as valuable resources for developers and organizations seeking
    efficient and reliable deployment solutions for their Laravel applications.


    # [Points to Remember](#toc.xhtml#s291a)


    *   Understand the significance of cloud deployment, including choosing the right
    cloud service provider, setting up infrastructure, prioritizing security, and
    implementing containerization for seamless deployment across different cloud environments.


    *   Evaluate the unique features and benefits of major cloud providers such as
    Heroku, AWS, and Google Cloud, considering factors like ease of use, scalability,
    security, and geographical reach, to ensure the best fit for your Laravel application
    deployment needs.


    *   Explore the capabilities of Laravel Vapor, an auto-scaling, serverless Laravel
    deployment tool powered by AWS Lambda, to simplify the deployment process. Pay
    attention to the prerequisites, installation steps, and configurations required
    for a successful deployment.


    *   Learn how to set up and manage environments, handle environment variables,
    and utilize the Vapor CLI tool effectively for streamlined deployment operations.
    Understand the significance of defining and managing multiple environments, including
    production and staging, to ensure smooth testing and development processes.'
