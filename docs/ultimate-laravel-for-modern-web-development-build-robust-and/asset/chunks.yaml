    ```\n\n## Controllers\n\nIf a group of routes all use the same controller, you\
    \ can define the shared controller for the group’s routes using the `controller`\
    \ method. The controller method that they call can therefore be provided when\
    \ defining the routes:\n\n```\nuse App\\Http\\Controllers\\CityController;\nRoute::controller(CityController::class)->group(function\
    \ () {\n    Route::get(‘/city/{id}’, ‘show’);\n    Route::post(‘/city’, ‘location’);\n\
