    In the early years of the adoption of the MVC pattern, it was used in desktop
    applications. Towards the late 1990s, it became popular with web applications
    and led to becoming a common industry favorite for developing web applications.
    The boom of the internet and business going digital fueled the wide adoption of
    the MVC architectural pattern in applications.


    # Separation of Components


    The MVC architectural pattern separates the three major responsibilities into
    three components as shown in [Figure 2.1](#c02.xhtml#fig2_1):


    ![](images/Figure-2.1.jpg)


    **Figure 2.1:** MVC Separation of Components


    # MVC Architecture Pattern in the Context of Laravel


    The MVC architecture pattern enables Laravel to use the powerful capabilities
    of the pattern. With the MVC architecture pattern, the key distinction is the
    division of the logical components, which makes the application code base modular
    and efficient for making changes – adding or removing features.


    There are several design principles that our Laravel application adheres to as
    it uses the MVC architecture pattern.


    Consider the `Model` in Laravel to be the brains behind your data. It employs
    `Eloquent ORM`, which is similar to the language used for communicating with the
    database. So, when you wish to deal with your database in a more structured manner,
    `Eloquent` can assist you by employing syntax that is similar to talking to the
    database in a human-friendly manner.


    Consider the `View` to be the front face of your application. We employ `Blade
    Templates` in Laravel, which are blueprints for how your web pages should look.
    They maintain the HTML structure and ensure that everything is properly shown
    to the user.


    `Controllers` are in charge of the entire process. They act as intermediaries
    between the `Model` and the `View`. The `Controllers` intervene when a user performs
    an action on the website, such as clicking a button or completing a form. They
    communicate with the `Model` to get or modify data and then transfer that data
    to the `View` to display to the user what they want.


    Finally, `Resources` and `Collections` in Laravel are data management wizards.
    Consider `RESTful resource controllers` to be your assistants while doing `CRUD`
    activities such as adding, viewing, updating, or removing data. They offer unique
    methods for each of these responsibilities, making data handling in your application
    simple. As a result, it’s similar to having a set of tools to handle various parts
    of your data in a systematic manner.


    # Design Principles


    The core feature of Laravel lies in optimally using the Design Principles. Let
    us explore the Design Principles and how they power Laravel.


    ## Reusability


    The MVC architecture makes the code into separate logical components. The distinction
    in capabilities and components allows for the creation of components that can
    be reused directly.


    The `controller` and `view` extensively make use of the reusability principle,
    and the components created in both the `view` and `controller` are majorly reused
    for user interface components.


    ## Flexibility


    The MVC architecture focuses on designing the application with a focus on flexibility.
    With the distinction in the logical components of `model`, `view`, and `controller`,
    it is relatively easy to make changes and incorporate new behaviors and workflows
    into the existing application.


    It gives the developer the freedom to change the `view` or the `controller` or
    both easily without having drastic changes in the `model` and sometimes with no
    changes needed in the `model`. This makes Laravel application development flexible.


    ## Cohesion


    The components of the `model`, `view`, and `controller` in the architecture pattern
    have a strong layer cohesion. In comparison to when there is no logical separation
    of the component’s responsibilities, having the MVC architecture enforces cohesion
    between the three components.


    ## Coupling


    The three components of the MVC architecture pattern have a logical separation,
    and it may seem that inter-component communication might be impacted by this pattern.
    However, the opposite is true.


    The communication channels between these channels are efficient and very minimal,
    leading to a quick transfer of data and information between the components. This
    leads to smooth and easy transfer of data between the components and also reduces
    coupling, resulting in increased performance of the application system.


    ## Design Independence in Components


    The components are separated with the MVC architecture pattern, making the designing
    of each component to be separate and independent. This helps to use different
    and varied design strategies for each of the components very well.


    The logical separation of the components also gives the developer the ability
    to incorporate best design practices in each component, making it optimal for
    the task each component performs.


    ![](images/Figure-2.2.jpg)


    **Figure 2.2:** Design Principles


    # MVC in Laravel


    The MVC architecture design pattern in Laravel has many advantages to application
    developers, architects, as well as the end users of the application.


    # Key Features


    The following are the key features of MVC in Laravel:


    *   SEO Friendly

    *   Test Driven Development

    *   Maintainability and Extensibility

    *   Simultaneous Development


    ## SEO Friendly


    The MVC architecture pattern, along with caching, page loading, server-side rendering,
    and HTML metadata, makes the application optimized for SEO. SEO, which stands
    for Search Engine Optimization, makes the site optimized for search engines and
    improves the website traffic.


    ## Importance of SEO


    In developing a website, the driving factor to make a profit is directly proportional
    to the number of visitors on the website. Search Engine Optimization (SEO) is
    critical to the success of a web application/website as SEO makes it more visible
    to a greater number of users. This means that more traffic will be directed to
    the website, leading to higher potential profits.


    Having the MVC architecture pattern in the application gives the advantage of
    SEO capabilities. This serves as a major advantage to the clients whose applications
    are built using the Laravel framework.


    # Principles


    SEO is based on five principles, which are as follows (see [Figure 2.3](#c02.xhtml#fig2_3)):


    ![](images/Figure-2.3.jpg)


    **Figure 2.3:** SEO Principles


    *   **Indexing:** The fetched results are indexed and stored in the database.
    The index helps uniquely identify the result fetched.

    *   **Crawling:** The crawler (software) scrapes the web to fetch all the results.
    This process is called crawling. In the case of Google, it is called `Googlebot`.

    *   **Relevancy:** The is a possibility of correlation between the different fetched
    results. The search engine measures the relevancy of the fetched web page to the
    index.

    *   **Retrieving Results:** The crucial step in SEO is to retrieve the results,
    that is, retrieving the best-matched results.

    *   **Processing:** Processing is a core SEO principle. It refers to the comparison
    between the search query and the result string. This comparison is performed with
    the indexes of data in the database.


    ## Test Driven Development


    The MVC architecture pattern supports Test Driven Development (TDD).


    Having the TDD helps bring a more traditional innovation to building Laravel applications
    and reduces the time required to develop applications with testing.


    ## Simultaneous Development

