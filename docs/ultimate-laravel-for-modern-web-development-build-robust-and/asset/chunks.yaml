  trans: "\n\n你可能决定使用 UUID 作为 Eloquent 模型的主键，而不是自增整数。UUID 是长度为 36 字符的全局唯一的字母数字标识符。\n\
    \n如果你希望模型使用 UUID 键而不是自增整数键，请在模型上使用 `Illuminate\\Database\\Eloquent\\Concerns\\\
    HasUuids` 特性。当然，你需要确保模型拥有一个与 UUID 效效的主键列：\n\n```php\nuse Illuminate\\Database\\\
    Eloquent\\Concerns\\HasUuids;\nuse Illuminate\\Database\\Eloquent\\Model;\nclass\
    \ Chapter extends Model\n{\n    use HasUuids;\n    // Code logic\n}\n```\n\n```php\n\
    $chapter = Chapter::create([‘title’ => ‘Chapter 1’]);\n$chapter->id;\n```\n\n\
    `HasUuids` 特性默认为你的模型创建 `ordered`（有序）UUID。这些 UUID 可以按字典顺序排序，使得它们在数据库索引存储中更加高效：\n\
    \n通过在模型中添加 `newUniqueId` 函数，你可以修改该特定模型生成 UUID 的方式。此外，你可以在模型上定义 `uniqueIds` 函数来指示哪些列应该获得\
    \ UUID：\n\n```php\nuse Ramsey\\Uuid\\Uuid;\n/**\n * 为模型生成一个新的 UUID。\n */\npublic\
    \ function newUniqueId(): string\n{\n    return (string) Uuid::uuid4();\n}\n\n\
    /**\n * 获取应该接收唯一标识符的列。\n *\n * @return array<int, string>\n *\n */\npublic function\
    \ uniqueIds(): array\n{\n    return [‘id’, ‘offer_code’];\n}\n```\n\n你可以根据需要自由使用\
    \ `ULIDs` 代替 UUID。ULID 与 UUID 相同；但它们只有 26 个字符。与有序 UUID 一样，ULID 可以按字典顺序排序以实现有效的数据库索引。\n\
    \n在模型上使用 `Illuminate\\Database\\Eloquent\\Concerns\\HasUlids` 特性来使用 ULID。此外，确保模型包含一个与\
    \ ULID 等效的主键列。\n\n# 数据库连接\n\n所有的 Eloquent 模型将自动使用为应用程序设置的默认数据库连接。如果你希望在与特定模型交互时指定不同的连接，则应该在模型上定义\
    \ `$connection` 属性：\n\n```php\n<?php\nnamespace App\\Models;\nuse Illuminate\\\
    Database\\Eloquent\\Model;\nclass Office extends Model\n{\n    /**\n     * 模型应该使用的数据库连接。\n\
    \     *\n     * @var string\n     *\n     * Code Logic\n     */\n    protected\
    \ $connection = ‘sqlite’;\n}\n```\n\n# 获取模型\n\n一旦你生成了模型和相应的数据库表，就可以准备好从数据库中检索数据了。每个\
    \ Eloquent 模型都可以被视为一个强大的查询构建器，允许你流畅地查询与该模型连接的数据库表。模型的 `all` 方法将从它关联的数据库表中获取每一个条目：\n\
    \n```php\nuse App\\Models\\Office;\nforeach (Office::all() as $office) {\n   \
    \ echo $office->name;\n}\n```\n\n![](img/Figure-5.4.jpg)\n\n**图 5.4:** 获取模型\n\n\
    # 集合 (Collections)\n\n Laravel 的基础 `Illuminate\\Support\\Collection` 类提供了许多与数据集合交互的有用方法，它被\
    \ `Eloquent` 集合类进行了扩展。例如，根据调用的闭包的结果，可以使用 `reject` 方法从集合中删除模型：\n\n```php\n$offices\
    \ = Office::where(‘location’, ‘NYC’)->get();\n$offices = $offices->reject(function\
    \ (Office $office) {\n    return $office->cancelled;\n});\n```\n\nEloquent 集合类除了\
    \ Laravel 标准集合类提供的方法外，还有几个专门为处理 Eloquent 模型集合设计的方法。\n\n你可以像遍历数组一样遍历集合，因为 Laravel\
    \ 的： \n\n# 结果分片 (Chunking Results)\n\n如果你尝试使用 `all` 或 `get` 方法处理数千条 Eloquent 记录，你的应用程序可能会耗尽内存。这是因为\
    \ PHP 的 PDO 驱动会将所有原始查询结果存储在它的内部缓冲区中。在迭代数千个 Eloquent 模型时，`chunk` 方法可以大幅减少你应用程序的内存消耗，类似于\
    \ `lazy` 方法。`chunk` 方法分批处理记录：\n\n```php\nOffice::where(‘closed’, true)->chunk(100,\
    \ function (Collection $offices) {\n    foreach ($offices as $office) {\n    \
    \    // Code Logic\n    }\n});\n```\n\n# 使用懒加载集合 (Lazy Collections)\n\n`lazy`\
    \ 方法的功能与 `chunk` 方法相似，但它返回的是一个 `LazyCollection` 实例。这允许你利用标准 Laravel 集合提供的许多集合方法。例如：\n\
    \n```php\nuse App\\Models\\Office;\nuse Illuminate\\Database\\Eloquent\\Collection;\n\
    Office::where(‘closed’, true)->chunk(100, function (Collection $offices) {\n \
    \   foreach ($offices as $office) {\n        // Code Logic\n    }\n});\n```\n\n\
    `lazyById` 方法允许你根据 `id` 列过滤结果。`lazyByIdDesc` 方法按 `id` 降序顺序执行此操作：\n\n```php\nOffice::where(‘closed’,\
    \ true)->lazyById(100, function (Collection $offices) {\n    foreach ($offices\
    \ as $office) {\n        // Code Logic\n    }\n});\n```\n\n# 游标 (Cursors)\n\n\
    `cursor` 方法在迭代数千条 Eloquent 记录时，可以大幅减少你应用程序的内存消耗。单个 Eloquent 模型在迭代到它们时才会被水水化；`cursor`\
    \ 技术只会运行一次数据库查询。因此，在迭代游标时，内存中任何时候都只保留一个 Eloquent 模型：\n\n```php\nuse App\\Models\\\
    Office;\nforeach (Office::where(‘location, ‘NYC’)->cursor() as $office) {\n  \
    \  // Code Logic\n}\n```\n\n"
- fmt: "\nWe can select all of the `locations` and the name of the office at each\
    \ location using a single query by leveraging the subquery functionality offered\
    \ by the query builder’s `select` and `addSelect` methods:\n\n```php\nuse App\\\
    Models\\Location;\nuse App\\Models\\Office;\n\nreturn Location::addSelect([‘last_office’\
    \ => Office::select(‘name’)\n->whereColumn(‘Location_id’, ‘locations.id’)\n->orderByDesc(‘Location_id’)\n\
    ->limit(1)])->get();\n```\n\nAdditionally, subqueries are supported by the `orderBy`\
    \ function of the query builder. Using our office as an example, we can utilize\
    \ this functionality to arrange all locations by the time the most recent office\
    \ was added/constructed there.\n\n# CRUD Operations on Models\n\nWhile using Eloquent,\
    \ it is important not only to fetch models from the database but also to add new\
    \ records. Fortunately, Eloquent makes it easy. You just need to create a new\
    \ model instance, specify its characteristics, and then insert a new record into\
    \ the database using the model instance’s `save` method:\n\n```php\n<?php\nnamespace\
    \ App\\Http\\Controllers;\nuse App\\Http\\Controllers\\Controller;\nuse App\\\
    Models\\Office;\nuse Illuminate\\Http\\RedirectResponse;\nuse Illuminate\\Http\\\
    Request;\n\nclass OfficeController extends Controller\n{\n    /**\n     * Store\
    \ a new Office in the database.\n     */\n    public function store(Request $request):\
    \ RedirectResponse\n    {\n        // Validate the request…\n        $office =\
    \ new Office;\n        $office->name = $request->name;\n        $office->save();\n\
    \        return redirect(‘/offices’);\n    }\n}\n```\n\nModels that already exist\
    \ in the database can be updated using the `save` technique. A model should be\
    \ retrieved in order to be updated, then any desired characteristics should be\
    \ set. The `save` method for the model should then be called. Again, there is\
    \ no need to explicitly specify the value of the `updated_at` timestamp because\
    \ it will be updated automatically:\n\n```php\nuse App\\Models\\Office;\n$office\
    \ = Office::find(1);\n$office ->name = ‘SFO’;\n$office ->save();\n```\n\nYou may\
    \ use the model instance’s `delete` function to remove a model:\n\n```php\nuse\
    \ App\\Models\\Office;\n$office = Office::find(1);\n$office->delete();\n```\n\n\
    # Events\n\nEloquent models send out various events, allowing you to hook into\
    \ the following lifecycle events:\n\n1. retrieved\n2. creating\n3. created\n4.\
    \ updating\n5. updated\n6. saving\n7. saved\n8. deleting\n9. deleted\n10. trashed\n\
    11. forceDeleting\n12. forceDeleted\n13. restoring\n14. restored\n15. replicating\n\
    \nUse observers to categorize all of your listeners into a single class if you\
    \ are listening for a lot of events on a certain model. The Eloquent events you\
    \ want to listen for are reflected in the method names of the observer classes.\
    \ The impacted model is the sole argument for each of these methods. The simplest\
    \ method to build a new observer class is to use the `make:observer` Artisan command:\n\
    \n```bash\nphp artisan make:observer UserObserver --model=Employee\n```\n\nThe\
    \ new observer will be added to the `app/Observers` directory by this command.\
    \ Artisan will create this directory for you if it does not already exist. Your\
    \ impartial observer will look as follows:\n\n```php\n<?php\nnamespace App\\Observers;\n\
    use App\\Models\\Employee;\n\nclass EmployeeObserver\n{\n    /**\n     * Handle\
    \ the Employee “created” event.\n     */\n    public function created(Employee\
    \ $employee): void\n    {\n        // Code Logic\n    }\n    /**\n     * Handle\
    \ the Employee “updated” event.\n     */\n    public function updated(User $employee):\
    \ void\n    {\n        // Code Logic\n    }\n    /**\n     * Handle the User “deleted”\
    \ event.\n     */\n    public function deleted(User $user): void\n    {\n    \
    \    // …\n    }\n    /**\n     * Handle the Employee “restored” event.\n    \
    \ */\n    public function restored(User $employee): void\n    {\n        // Code\
    \ Logic\n    }\n    /**\n     * Handle the Employee “forceDeleted” event.\n  \
    \   */\n    public function forceDeleted(User $employee): void\n    {\n      \
    \  // Code Logic\n    }\n}\n```\n\nAt times, you might need to `mute` a model’s\
    \ whole firing of events. This can be achieved by utilizing the `withoutEvents`\
    \ technique. The only input for the `withoutEvents` function is a closure. The\
    \ `withoutEvents` function will return any result returned by the closure, and\
    \ any code performed within this closure won’t dispatch model events.\n\n# Conclusion\n\
    \nIn this chapter, *Working with Eloquent ORM and Query Builder*, the focus was\
    \ on exploring the fundamental concepts of Eloquent ORM and Query Builder in the\
    \ context of Laravel, a popular PHP framework for web development. The chapter\
    \ began by introducing the importance of Eloquent ORM and Query Builder in the\
    \ context of Laravel. The chapter’s goal was to provide readers with a thorough\
    \ grasp of Eloquent ORM and Query Builder while highlighting their significance\
    \ in database operations. In the next chapter, we will look at security aspects\
    \ of Laravel, including authentication and authorization.\n\n# Points to Remember\n\
    \n* Eloquent ORM simplifies database operations by providing an object-oriented\
    \ interface.\n* Each `Model` class communicates with a table.\n* Use `make:model`\
    \ Artisan command to create a new model.\n* Models follow naming conventions for\
    \ table names and primary keys. You can customize these using properties like\
    \ `$table` and `$primaryKey`.\n* You can retrieve data using methods like `get()`,\
    \ `first()`, and `pluck()`.\n* Joins merge rows from different tables based on\
    \ shared columns.\n* Aggregates like `count`, `max`, `min`, `average`, and `sum`\
    \ can be used to perform calculations on columns.\n* Collections are extended\
    \ arrays that allow manipulation methods.\n* Chunking results and using cursors\
    \ help manage memory consumption when dealing with large datasets.\n* CRUD operations\
    \ involve creating, updating, and deleting records using the model’s instance.\n\
    * Eloquent models emit events during their lifecycle, such as creating, updating,\
    \ and deleting.\n* Event classes can be created to handle specific model events.\n\
    * The `$dispatchesEvents` property associates event classes with model events.\n\
    * Eloquent events provide hooks for executing custom logic during various phases\
    \ of a model’s lifecycle.\n"
