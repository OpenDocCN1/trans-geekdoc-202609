    \ 允许使用手动的 CRON 表达式来实现相同功能：\n\n```php\n$schedule->command(‘test’)->cron(‘* * *\
    \ * *’);\n```\n\n### 避免任务重叠\n\n在调度多个任务时，确保上一个任务在相同任务被重新触发之前完成至关重要。为了处理这些任务的重叠，Laravel\
    \ 提供了一个可以在调度中使用的方法：\n\n```php\n$schedule->command(‘test’)->withoutOverlapping();\n\
    ```\n\n`withoutOverlapping()` 方法确保了 `test` 命令在当前没有运行时将每分钟运行一次。这确保了运行任务之间不会发生重叠。\n\
    \n### 可隔离命令 (Isolatable Commands)\n\n在开发 Laravel 应用时，作为开发者，可能会运行多个命令。在某些情况下，你希望在给定时间内只有一个命令实例在运行。在这种情况下，可隔离命令（Isolatable\
    \ Commands）的概念就出现了。\n\n`Isolatable` 接口包含了执行可隔离命令所需的所有核心逻辑。需要在命令类中实现该接口以使用该功能。\n\
    \n该接口位于：\n\n`Illuminate\\Contracts\\Console\\Isolatable`\n\n该 `Isolatable` 接口由使用\
    \ `implements` 关键字实现该接口的类使用。\n\n让我们通过以下示例深入理解这个概念。\n\n考虑一种场景：一个名为 `SendNotifications`\
    \ 的类被实现如下方式，使得在应用程序的任何给定时间都会调用该类的实例。这使得它需要 `Isolatable` 接口的功能。\n\n![](img/Fig-1.5.jpg)\n\
    \n**图 1.5：** 类 `SendNotifications` 实现了 `Isolatable` 接口\n\nPHP 类中的代码如下：\n\n```php\n\
    namespace App\\Console\\Commands;\n\nuse Illuminate\\Console\\Command;\n\nuse\
    \ Illuminate\\Contracts\\Console\\Isolatable;\n\nclass SendNotifications extends\
    \ Command implements Isolatable\n{\n    // …\n}\n```\n\n由于命令被标记为 `Isolatable`，Laravel\
    \ 会自动为命令添加 `–-isolate` 选项，减少了程序员添加选项的负担。\n\n这确保了命令在带有该选项调用时只有一个实例。\n\n# 核心概念\n\
    \nLaravel 能够实现命令的可隔离功能并确保命令只有一个实例（而没有多个实例），其核心概念是使用应用程序底层的默认缓存驱动程序。\n\n通过使用应用程序的默认缓存驱动程序获取原子锁（atomic\
    \ lock），该命令被标记为可隔离的。\n\n在其他命令实例正在运行的场景下，标记为 `isolatable` 的命令将不会执行，并默认以成功的退出状态码退出。在这种情况下，可以通过命令中的\
    \ `isolate` 选项指定所需的状态码，来指定命令在这种情况下应退出的退出码。\n\n当命令的另一个实例已经在运行时，要指定退出码为 12，请如下所示指定：\n\
    \n`--isolated=12`\n\n### 锁管理\n\n该架构允许以下操作：\n\n*   应用程序的架构，即：\n*   应用程序的架构，即：\n\
    \n```php\nuse DateTimeInterface;\n\nuse DateInterval;\n\npublic function isolationLocksAt():\
    \ DateTimeInterface\n{\n    return now()->add(new DateInterval('PT1M'));\n}\n\
    ```\n"
