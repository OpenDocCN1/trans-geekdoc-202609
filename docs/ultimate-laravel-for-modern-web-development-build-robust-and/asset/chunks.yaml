    \n**图 3.4:** 路由组\n\n## 中间件\n\n你可以在声明组之前使用 `middleware` 方法为组内的每个路由分配中间件。中间件将按照数组中的顺序顺序执行：\n\
    \n```\nRoute::middleware([‘m1’, ‘m2’])->group(function () {\n    Route::get(‘/’,\
    \ function () {\n        // 使用 m1 & m2 中间件\n        // Code Logic\n    });\n \
    \   Route::get(‘/city/pollution’, function () {\n        // 使用 m1 & m2 中间件\n \
    \       // Code Logic\n    });\n    Route::get(‘/city/waterSupply’, function ()\
    \ {\n        // 使用 m1 & m2 中间件\n        // Code Logic\n    });\n});\n```\n\n##\
    \ 控制器\n\n如果一组路由都使用同一个控制器，可以使用 `controller` 方法为组路由定义共享控制器。因此，在定义路由时可以提供它们所调用的控制器：\n\
    \n```\nuse App\\Http\\Controllers\\CityController;\nRoute::controller(CityController::class)->group(function\
    \ () {\n    Route::get(‘/city/{id}’, ‘show’);\n    Route::post(‘/city’, ‘location’);\n\
    });\n```\n\n### 定义路由的其他方式\n\n在控制器只有一个单个可调用方法（invokable method）的情况下，请使用以下方法：\n\n\
    ```\nRoute::post(‘/file’, FileHandler::class)\n```\n\n此外，资源控制器可以指向为：\n\n```\n\
    Route::resource(‘users’, UserController::class)\n```\n\n## 子域名路由\n\n当你需要捕获子域名的一部分并在路由或控制器中使用时，Laravel\
    \ 的子域名路由功能非常有用。子域名路由可以通过“路由组”进行管理。子域名路由可以使用与路由参数相同的参数，并允许使用该功能通过子域名路由实现结果。在定义组之前，可以调用\
    \ `domain` 方法来指定子域名：\n\n```\nRoute::domain(‘{city}.example.com’)->group(function\
    \ () {\n    Route::get(‘city/{id}’, function (string $name, string $id) {\n  \
    \      // Code Logic\n    });\n});\n```\n\n## 路由前缀\n\n组中的每个路由都可以使用 `prefix` 方法带有特定的\
    \ URI 前缀。例如，你可能希望在组中每个路由 URI 的开头添加 `admin:`。\n\n```\nRoute::prefix(‘hr’)->group(function\
    \ () {\n    Route::get(‘/employees’, function () {\n        // 匹配 “/hr/employees”\
    \ URL\n    });\n});\n```\n\n为了给组中的每个具有有效 URL 的路由添加前缀，可以使用 Laravel 的内置方法。`prefix`\
    \ 方法有助于实现此功能。一种良好的实践是使用 `admin` 并为组添加相同的的前缀。\n\n我们将确保包含尾部字符，因为给定的字符串将完全按照其指定的方式追加到路由名称上。前缀的一个元素：\n\
    \n```\nRoute::name(‘admin.’)->group(function () {\n    Route::get(‘/city’, function\
    \ () {\n        // 路由被分配名称 “admin.city”\n    })->name(‘city’);\n});\n```\n\n##\
    \ 跨域资源共享 (CORS)\n\n根据你指定的值，Laravel 可能会自动响应 CORS `OPTIONS` HTTP 请求。你可以在应用程序的 `config/cors.php`\
    \ 文件中配置每个 CORS 设置。\n\n预装在你的全局中间件栈中的 `HandleCors` 中间件会自动处理 `OPTIONS` 请求。你应用程序的\
    \ HTTP 内核 (`App\\Http\\Kernel`) 包含了整个全局中间件栈。\n\n## 缓存\n\n在将应用程序发布到生产环境时，请使用 Laravel\
    \ 的路由缓存。如果你使用路由缓存，注册应用程序所有路由所需的时间将少得多。\n\n"
- fmt: "\n`->with('name', 'ABC')`\n\n`->with('organization', 'ORGNAME');`\n\n# Sharing\
    \ Data\n\nOn rare occasions, you might need to share data with every view your\
    \ application renders. Use the `share` method of the `View` facade to accomplish\
    \ this. The `share` method should typically be called from a service provider’s\
    \ `boot` method. You can construct a different service provider to house them\
    \ or add them to the `App\\Providers\\AppServiceProvider` class. And it is mandatory\
    \ to register it in the `config/app.php` in order for it to work.\n\n```php\n\
    <?php\n\nnamespace App\\Providers;\nuse Illuminate\\Support\\Facades\\View;\n\n\
    class AppServiceProvider extends ServiceProvider\n{\n    /**\n     * Register\
    \ any application services.\n     */\n    public function register(): void\n \
    \   {\n        // Code Logic\n    }\n    /**\n     * Bootstrap any application\
    \ services.\n     */\n    public function boot(): void\n    {\n        View::share('key',\
    \ 'value');\n    }\n}\n```\n\n# View Composers and Creators\n\nThe View composers\
    \ and creators have fundamental differences in the way it enables robustness to\
    \ code.\n\n![](images/Figure-3.6.jpg)\n\n**Figure 3.6:** View Composers and Creators\n\
    \n# View Composers\n\nWhen a view is rendered, callbacks or class methods called\
    \ view composers are invoked. A view composer can assist you in centralizing your\
    \ logic if you have data that needs to be tied to a view each time it is rendered.\
    \ If the same view is returned by many routes or controllers in your application\
    \ and requires the same set of data, view composers may prove to be especially\
    \ helpful.\n\nView composers will often be registered with one of the service\
    \ providers for your application. For this example, we’ll suppose that a new `App\\\
    Providers\\ViewServiceProvider` has been built to contain this functionality.\n\
    \nTo register the view composer, we’ll use the `composer` method of the `View`\
    \ facade. You are free to arrange class-based view composers in any way you see\
    \ fit since Laravel does not provide a default directory for them.\n\nTo store\
    \ all of your application’s view composers, for instance, you may make an `app/View/Composers`\
    \ directory:\n\n```php\n<?php\n\nnamespace App\\Providers;\nuse App\\View\\Composers\\\
    ProfileComposer;\nuse Illuminate\\Support\\Facades;\nuse Illuminate\\Support\\\
    ServiceProvider;\nuse Illuminate\\View\\View;\n\nclass ViewServiceProvider extends\
    \ ServiceProvider\n{\n    /**\n     * Register any application services.\n   \
    \  */\n    public function register(): void\n    {\n        // Code Logic\n  \
    \  }\n    /**\n     * Bootstrap any application services.\n     */\n    public\
    \ function boot(): void\n    {\n        // Using class based composers\n     \
    \   Facades\\View::composer('profile', ProfileComposer::class);\n        // Using\
    \ closure based composers\n        Facades\\View::composer('cityPollution', function\
    \ (View $view) {\n            // Code Logic\n        });\n        Facades\\View::composer('introduction',\
    \ function (View $view) {\n            // Code Logic\n        });\n    }\n}\n\
    ```\n\nThe `compose` method of the `App\\View\\Composers\\ProfileComposer` class\
    \ now that the composer has been registered will be called.\n\n```php\n<?php\n\
    \nnamespace App\\View\\Composers;\nuse App\\Repositories\\UserRepository;\nuse\
    \ Illuminate\\View\\View;\n\nclass ProfileComposer\n{\n    /**\n     * Create\
    \ a new profile composer.\n     */\n    public function __construct(\n       \
    \ protected CityRepository $city,\n    ) {}\n    /**\n     * Bind data to the\
    \ view.\n     */\n    public function compose(View $view): void\n    {\n     \
    \   $view->with('count', $this->city->count());\n    }\n}\n```\n\nAs you can see,\
    \ the *service container* resolves all view composers, allowing you to type-hint\
    \ any dependencies you require inside a composer’s constructor.\n\n# Multiple\
    \ Views with Composer\n\nBy giving the composer method an array of views as the\
    \ first argument, you can attach a view composer to several views at once:\n\n\
    ```php\nuse App\\Views\\Composers\\MultiComposer;\nuse Illuminate\\Support\\Facades\\\
    View;\nView::composer(\n    ['welcome', 'dashboard'],\n    MultiComposer::class\n\
    );\n```\n\nThe `*` character is also accepted by the composer method as a wildcard,\
    \ enabling you to add a composer to all views:\n\n```php\nuse Illuminate\\Support\\\
    Facades;\nuse Illuminate\\View\\View;\nFacades\\View::composer('*', function (View\
    \ $view) {\n    // Code Logic\n});\n```\n\n# View Creators\n\nSimilar to view\
    \ composers, view creators are executed as soon as the view is instantiated rather\
    \ than waiting until the view is about to render. Use the `creator` method to\
    \ register a view creator:\n\n```php\nuse App\\View\\Creators\\ProfileCreator;\n\
    use Illuminate\\Support\\Facades\\View;\nView::creator('profile', ProfileCreator::class);\n\
    ```\n\n# View Optimization\n\nBlade template views are by default compiled as\
    \ needed. If a view is present, Laravel will ascertain whether the file has undergone\
    \ changes. Due to a potential performance hit from compiling views during the\
    \ request, Laravel offers the `view:cache` task. You might want to execute this\
    \ command as part of your deployment for improved performance:\n\n`php artisan\
    \ view:cache`\n\nTo clear the view:\n\n`php artisan view:clear`\n\n![](images/Figure-3.7.jpg)\n\
    \n**Figure 3.7:** View Optimization\n\n# Conclusion\n\nRouters and views, two\
    \ crucial components of web development, are the focus of this chapter of the\
    \ book. At the beginning of the chapter, we covered the importance of routers\
    \ and views as well as how Laravel makes use of both. There are several topics\
    \ covered, including routers and views and their various types, strategies, and\
    \ configurations.\n\nAn overview of Laravel routers, the URLs that users use to\
    \ access web application capabilities, is provided at the beginning of the chapter.\
    \ Then, we saw the basic syntax example for routing and explored how routers are\
    \ used to fetch and transmit data into and out of the application.\n\nThe next\
    \ chapter will focus on building Controllers and Blade templates in Laravel. It\
    \ will explain the importance of controllers and Blade in web development and\
    \ how they are used.\n\n# Points to Remember\n\n- The chapter explores the route\
    \ files that define all Laravel routes, which are located in the routes directory.\
    \ It describes the function of the `RouteServiceProvider` and how the route files\
    \ are loaded. It emphasizes that web interface routes, which offer features like\
    \ CSRF protection and session state, are created in the `routes/web.php` file\
    \ and belong to the web middleware group. The `routes/api.php` file defines stateless\
    \ routes for the API, which are a part of the `api` middleware group.\n- Then,\
    \ the chapter explores router methods, which let programmers register routes that\
    \ react to different HTTP verbs. When creating several routes with the same URI,\
    \ it lists a number of common router methods and stresses the order in which they\
    \ should be declared.\n- The View section opens with an introduction to Laravel\
    \ views and a discussion of how they help to render a web page’s HTML representation.\
    \ It highlights how views enable developers to segregate the display logic from\
    \ the business logic of the application, resulting in simpler and more readable\
    \ code.\n- The first subject discussed in this part is creating views. Views in\
    \ Laravel are, by default, kept in the resources/views directory. It covers how\
    \ to reference views in routes and controllers and goes through the process of\
    \ generating a view file.\n"
