  trans: "\n* 中间件排序\n* 中间件参数\n* 可终止的中间件\n\n# Laravel 内置身份验证系统\n\n许多在线应用程序都包含让用户 `login`\
    \ 并与程序进行身份验证的方法。在 Web 应用中实现此功能可能是项具有挑战性甚至可能危险的任务。Laravel 致力于为你提供所需的资源，以便快速、安全且简单地创建身份验证。\n\
    \nLaravel 身份验证基础设施的核心 `guards` 和 `providers` 构成了系统。`guards` 指定了每个请求的用户身份验证过程。例如，Laravel\
    \ 有一个 `session` 守，它使用 cookie 和会话存储来保持状态。\n\n用户通过 `providers` 从你的持久化存储中获取。Laravel\
    \ 包含了 `Eloquent` 和数据库查询构建器功能，用于获取用户。不过，你可以根据需要为应用程序建立更多的 `providers`。\n\n应用程序的身份验证配置文件位于\
    \ `config/auth.php`。该文件包含了许多文档完备的选项，用于修改 Laravel 身份验证服务的行为。\n\n# Laravel API 身份验证服务\n\
    \nPassport 和 Sanctum 是 Laravel 提供的两个可选包，帮助你管理 API 令牌并对通过 API 令牌执行的请求进行身份验证。请记住，这些库与\
    \ Laravel 内置的基于 cookie 的身份验证库并不是互斥的。这些库主要关注 API 令牌身份验证，而内置的身份验证服务关注基于 cookie 的浏览器身份验证。许多应用程序将同时使用\
    \ Laravel 内置的基于 cookie 的身份验证和 Laravel 的 API 身份验证包之一。\n\n![](img/Figure-6.1.jpg)\n\
    \n**图 6.1:** Laravel 身份验证包\n\n除了 Passport 和 Sanctum，Laravel 还有一个用于身份验证的 Laravel\
    \ Fortify。Laravel Fortify 是一个 Laravel 身份验证后端实现，不依赖于前端。Fortify 注册了实现所有 Laravel\
    \ 身份验证功能所需的路由和控制器，包括登录、注册、重置密码和电子邮件验证。\n\n# Passport\n\nPassport 是一个 OAuth2 身份验证提供者，提供了多种\
    \ OAuth2 “授权类型”，允许你发行不同类型的令牌。通常情况下，这是一个全面且复杂的 API 身份验证包。\n\n大多数应用程序并不需要 OAuth2\
    \ 规范提供的广泛功能，这对于用户和开发者来说都可能令人困惑。此外，开发者以前一直困惑如何对使用 OAuth2 身份验证提供者（如 Passport）的 SPA\
    \ 应用或移动应用进行身份验证。\n\n# Sanctum\n\nLaravel Sanctum 是一个身份验证包，解决了开发 Laravel 应用程序面临的许多问题。该包是一个更精简的包，能够处理第一方\
    \ Web 请求以及通过令牌进行的 API 调用。这有助于消除 OAuth2 的复杂性。\n\n除了作为一个 API 之外，它还提供了一个第一方 Web UI，这意味着\
    \ SPA（单页应用）独立于后端的 Laravel 应用程序，也独立于移动客户端。\n\nLaravel Sanctum 是一个混合 Web/API 身份验证模块，可以处理你应用程序的完整身份验证过程。这是可能的，因为当基于\
    \ Sanctum 的应用收到请求时，Sanctum 首先确定请求是否有引用已验证会话的会 cookie。\n\nSanctum 通过利用 Laravel\
    \ 内置的身份验证服务来实现。\n\n# 自定义身份验证\n\n要实现自定义身份验证逻辑，你需要通过自己的用户提供者来扩展 Laravel。要定义自定义用户提供者，我们将利用\
    \ `Auth` Facade 上的 `provider` 方法。用户提供者解析器应该返回一个 `Illuminate\\Contracts\\Auth\\\
    UserProvider` 的实现：\n\n```php\n<?php\n\nnamespace App\\Providers;\n\nuse App\\\
    Extensions\\TestEmployeeProvider;\nuse Illuminate\\Contracts\\Foundation\\Application;\n\
    use Illuminate\\Foundation\\Providers\\AuthServiceProvider as ServiceProvider;\n\
    use Illuminate\\Support\\Facades\\Auth;\n\nclass AuthServiceProvider extends ServiceProvider\n\
    {\n    /**\n     * 任何应用程序身份验证 / 授权服务。\n     */\n    public function boot(): void\n\
    \    {\n        Auth::provider('test', function (Application $app, array $config)\
    \ {\n            // 返回 Illuminate\\Contracts\\Auth\\UserProvider 实例\n        \
    \    return new TestEmployeeProvider($app->make('test.connection'));\n       \
    \ });\n    }\n}\n```\n\n在使用 provider 方法注册提供者后，你可以更改 `auth.php` 配置以使用新的用户提供者。首先，识别一个使用你新驱动程序的提供者：\n\
    \n```php\n'providers' => [\n    'employees' => [\n        'driver' => 'test',\n\
    \    ],\n],\n```\n\n最后，你可以在 `guards` 配置中使用以下提供者：\n\n```php\n'guards' => [\n  \
    \  'web' => [\n        'driver' => 'session',\n        'provider' => 'employees',\n\
    \    ],\n],\n```\n\n# 无状态身份验证\n\n要处理无状态身份验证，你可以创建一个中间件：\n\n```php\n<?php\n\nnamespace\
    \ App\\Middleware;\n\nuse Closure;\nuse Illuminate\\Http\\Request;\nuse Illuminate\\\
    Support\\Facades\\Auth;\nuse Symfony\\Component\\HttpFoundation\\Response;\n\n\
    class AuthenticateBasic\n{\n    /**\n     * 处理传入的请求。\n     *\n     * @param  \\\
    Illuminate\\Http\\Request  $request\n     * @param  \\Closure  $next\n     * @return\
    \ \\Symfony\\Component\\HttpFoundation\\Response\n     */\n    public function\
    \ handle(Request $request, Closure $next): Response\n    {\n        return Auth::once()\
    \ ?: $next($request);\n    }\n}\n```\n\n此外，将中间件附加到路由：\n\n```php\nRoute::get('/api/user',\
    \ function () {\n    // 只有经过身份验证的用户可以访问此路由\n})->middleware(AuthenticateBasic::class);\n\
    ```\n\n"
- fmt: "\nImplementations of `Illuminate\\Contracts\\Auth\\UserProvider` are in charge\
    \ of retrieving an `Illuminate\\Contracts\\Auth\\Authenticatable` implementation\
    \ from a persistent storage system, such as MySQL, MongoDB, and so on. These two\
    \ interfaces enable the Laravel authentication procedures to perform independently\
    \ of how the user data is stored or what type of class is used to represent the\
    \ authorized user:\n\nLet us examine the `Illuminate\\Contracts\\Auth\\UserProvider`\
    \ contract:\n\n```php\n<?php\n\nnamespace Illuminate\\Contracts\\Auth;\ninterface\
    \ UserProvider\n{\n    public function retrieveById($identifier);\n    public\
    \ function retrieveByToken($identifier, $token);\n    public function updateRememberToken(Authenticatable\
    \ $user, $token);\n    public function retrieveByCredentials(array $credentials);\n\
    \    public function validateCredentials(Authenticatable $user, array $credentials);\n\
    }\n```\n\nThe `retrieveById` method normally gets a key describing the user from\
    \ a MySQL database, such as an auto-incrementing ID. The method should retrieve\
    \ and return the `Authenticatable` implementation that matches the ID.\n\nThe\
    \ `retrieveByToken` method returns a user based on their unique `$identifier`\
    \ and “remember me” `$token`, which is normally kept in a database column called\
    \ `remember_token`. This method, like the last one, should return the `Authenticatable`\
    \ implementation with a matched token value.\n\nThe `updateRememberToken` function\
    \ replaces the `remember_token` of the `$user` object with the updated `$token`.\
    \ After a successful “remember me” authentication attempt or when the user logs\
    \ out, a new token is assigned to the user.\n\nWhen attempting to authenticate\
    \ with an application, the `retrieveByCredentials` function accepts the array\
    \ of credentials supplied to the `Auth::attempt` method. The procedure should\
    \ then “query” the underlying persistent storage for the user whose credentials\
    \ match those provided. This function will often execute a query with a “where”\
    \ condition that looks for a user record with a “username” that matches the value\
    \ of `$credentials['username']`. The method should return an `Authenticatable`\
    \ implementation. This method should not attempt to validate or authenticate passwords.\n\
    \nTo authenticate the user, the `validateCredentials` function should match the\
    \ provided `$user` to the `$credentials`. For example, to compare the value of\
    \ `$user->getAuthPassword()` to the value of `$credentials['password']`, this\
    \ function will often utilize the `Hash::check` method. This method should return\
    \ `true` or `false` depending on whether it is valid.\n\n# Authenticatable Contract\n\
    \nNow that we’ve gone over each function on the `UserProvider`, let’s look at\
    \ the `Authenticatable` contract.\n\n![](images/Figure-6.2.jpg)\n\n**Figure 6.2:**\
    \ Authenticable Contract Return Values\n\nRemember that user providers should\
    \ return these interface implementations from the `retrieveById`, `retrieveByToken`,\
    \ and `retrieveByCredentials` methods.\n\n```php\n<?php\n\nnamespace Illuminate\\\
    Contracts\\Auth;\ninterface Authenticatable\n{\n    public function getAuthIdentifierName();\n\
    \    public function getAuthIdentifier();\n    public function getAuthPassword();\n\
    \    public function getRememberToken();\n    public function setRememberToken($value);\n\
    \    public function getRememberTokenName();\n}\n```\n\nThis interface is straightforward.\
    \ The `getAuthIdentifierName` function should return the name of the user’s `primary\
    \ key` field, and the `getAuthIdentifier` method should return the user’s `primary\
    \ key`. When utilizing a MySQL backend, this is most likely the user record’s\
    \ auto-incrementing primary key. The `getAuthPassword` function should return\
    \ the hashed password of the user.\n\nThis interface enables the authentication\
    \ system to interact with any user class, independent of the ORM or storage abstraction\
    \ layer used. Laravel provides an `App\\Models\\User` class in the `app/Models`\
    \ directory by default, which implements this interface.\n\n# Implementing Authorization\
    \ Policies and Gates\n\nWhile incorporating security with authentication and authorization,\
    \ a key aspect is to keep track of the users currently allowed into the system.\
    \ The users who are authenticated and authorized should also be kept in check\
    \ and have a policy defined to auto-logout and keep track of the session data.\n\
    \nYou may use the `Auth` facade’s `logout` function to manually log users out\
    \ of your application. This removes the authentication information from the user’s\
    \ session, preventing future requests from being authenticated.\n\nIt is suggested\
    \ that, in addition to invoking the logout function, you invalidate the session\
    \ and renew the session token.\n\n```php\nuse Illuminate\\Http\\Request;\nuse\
    \ Illuminate\\Http\\RedirectResponse;\nuse Illuminate\\Support\\Facades\\Auth;\n\
    \n/**\n * Log the user out.\n */\npublic function logout(Request $request): RedirectResponse\n\
    {\n    Auth::logout();\n    $request->session()->invalidate();\n    $request->session()->regenerate();\n\
    \    return redirect('/home');\n}\n```\n\n# Invalidating User Sessions\n\nLaravel\
    \ also has a technique for invalidating sessions on other devices while keeping\
    \ the current device. Before you begin, ensure that the `Illuminate\\Session\\\
    Middleware\\AuthenticateSession` middleware is present on the routes that should\
    \ receive it. This middleware is typically placed on a route group:\n\n```php\n\
    Route::middleware(['auth', 'auth.session'])->group(function () {\n    Route::get('/',\
    \ function () {\n        // Code Logic\n    });\n});\n```\n\nThen, you may utilize\
    \ the `Auth` facade’s `logoutDevices` function. This technique needs the user\
    \ to validate their current password:\n\n```php\nuse Illuminate\\Support\\Facades\\\
    Auth;\nAuth::logoutDevices($currentPassword);\n```\n\nWhen the `logoutDevices`\
    \ method is called, all the user’s prior sessions are invalidated, which means\
    \ they are logged out of any guards they were authenticated by.\n\n# Password\
    \ Management\n\nYou may have actions in your application that need the user to\
    \ confirm their password before the action is done or before the user is routed\
    \ to a sensitive region of the application. Laravel contains built-in middleware\
    \ to make this procedure as simple as possible.\n\nYou will need to design two\
    \ routes to implement this feature:\n\n- Display a view requesting the user to\
    \ confirm their password\n- Ensure that the password is genuine and redirect the\
    \ user to their desired destination\n\n# Configuration\n\nAfter verifying their\
    \ password, a user will not be prompted to do so again for three hours. You may,\
    \ however, change the value of the `password_timeout` setting variable within\
    \ your application’s `config/auth.php` configuration file to customize the amount\
    \ of time before the user is requested for their password.\n\n# Routing\n\nFirst,\
    \ we’ll construct a route that will display a view asking the user to confirm\
    \ their password:\n\n```php\nRoute::get('/confirmPassword', function () {\n  \
    \  return view('auth.confirm-password');\n})->middleware('auth')->name('password.confirm');\n\
    ```\n\nAs you may anticipate, the view provided by this route should have a form\
    \ with a password field. In addition, feel free to put text within the view that\
    \ informs the user that they are entering a secured part of the program and must\
    \ confirm their password.\n"
  raw: 'Implementations of `Illuminate\Contracts\Auth\UserProvider` are in charge
    of retrieving an `Illuminate\Contracts\Auth\Authenticatable` implementation from
    a persistent storage system, such as MySQL, MongoDB, and so on. These two interfaces
    enable the Laravel authentication procedures to perform independently of how the
    user data is stored or what type of class is used to represent the authorized
    user:


    Let us examine the `Illuminate\Contracts\Auth\UserProvider` contract:


    `<?php`


    `namespace Illuminate\Contracts\Auth;`


    `interface UserProvider`


    `{`


    `public function retrieveById($identifier);`


    `public function retrieveByToken($identifier, $token);`


    `public function updateRememberToken(Authenticatable $user, $token);`


    `public function retrieveByCredentials(array $credentials);`


    `public function validateCredentials(Authenticatable $user, array $credentials);`


    `}`


    The `retrieveById` method normally gets a key describing the user from a MySQL
    database, such as an auto-incrementing ID. The method should retrieve and return
    the `Authenticatable` implementation that matches the ID.


    The `retrieveByToken` method returns a user based on their unique `$identifier`
    and “remember me” `$token`, which is normally kept in a database column called
    `remember_token`. This method, like the last one, should return the `Authenticatable`
    implementation with a matched token value.


    The `updateRememberToken` function replaces the `remember_token` of the `$user`
    object with the updated `$token`. After a successful “remember me” authentication
    attempt or when the user logs out, a new token is assigned to the user.


    When attempting to authenticate with an application, the `retrieveByCredentials`
    function accepts the array of credentials supplied to the `Auth::attempt` method.
    The procedure should then “query” the underlying persistent storage for the user
    whose credentials match those provided. This function will often execute a query
    with a “where” condition that looks for a user record with a “username” that matches
    the value of `$credentials[‘username’]`. The method should return an `Authenticatable`
    implementation. This method should not attempt to validate or authenticate passwords.


    To authenticate the user, the `validateCredentials` function should match the
    provided `$user` to the `$credentials`. For example, to compare the value of `$user->getAuthPassword()`
    to the value of `$credentials[‘password’]`, this function will often utilize the
    `Hash::check` method. This method should return `true` or `false` depending on
    whether it is valid.


    # [Authenticatable Contract](#toc.xhtml#s170a)


    Now that we’ve gone over each function on the `UserProvider`, let’s look at the
    `Authenticatable` contract.


    ![](images/Figure-6.2.jpg)


    **Figure 6.2:** Authenticable Contract Return Values


    Remember that user providers should return these interface implementations from
    the `retrieveById`, `retrieveByToken`, and `retrieveByCredentials` methods.


    `<?php`


    `namespace Illuminate\Contracts\Auth;`


    `interface Authenticatable`


    `{`


    `public function getAuthIdentifierName();`


    `public function getAuthIdentifier();`


    `public function getAuthPassword();`


    `public function getRememberToken();`


    `public function setRememberToken($value);`


    `public function getRememberTokenName();`


    `}`


    This interface is straightforward. The `getAuthIdentifierName` function should
    return the name of the user’s `primary key` field, and the `getAuthIdentifier`
    method should return the user’s `primary key`**.** When utilizing a MySQL backend,
    this is most likely the user record’s auto-incrementing primary key. The `getAuthPassword`
    function should return the hashed password of the user.


    This interface enables the authentication system to interact with any **user**
    class, independent of the ORM or storage abstraction layer used. Laravel provides
    an `App\Models\User` class in the `app/Models` directory by default, which implements
    this interface.


    # [Implementing Authorization Policies and Gates](#toc.xhtml#s171a)


    While incorporating security with authentication and authorization, a key aspect
    is to keep track of the users currently allowed into the system. The users who
    are authenticated and authorized should also be kept in check and have a policy
    defined to auto-logout and keep track of the session data.


    You may use the Auth facade’s logout function to manually log users out of your
    application. This removes the authentication information from the user’s session,
    preventing future requests from being authenticated.


    It is suggested that, in addition to invoking the logout function, you invalidate
    the user’s session and renew their CSRF token. After logging the user out, you
    should normally redirect the user to the application’s root:


    `use Illuminate\Http\Request;`


    `use Illuminate\Http\RedirectResponse;`


    `use Illuminate\Support\Facades\Auth;`


    `/**`


    `* Log the user out of the application.`


    `*/`


    `public function logout(Request $request): RedirectResponse`


    `{`


    `Auth::logout();`


    `$request->session()->invalidate();`


    `$request->session()->regenerateToken();`


    `return redirect(‘/home’);`


    `}`


    # [Invalidating User Sessions](#toc.xhtml#s172a)


    Laravel also has a technique for invalidating and **logging** out a user’s sessions
    that are active on other devices without invalidating their current session. When
    a user changes or updates their password, you may use this functionality to invalidate
    sessions on other devices while keeping the current device authorized.


    Before you begin, ensure that the `Illuminate\Session\Middleware\AuthenticateSession`
    middleware is present on the routes that should receive session authentication.
    This middleware should typically be placed on a route group definition so that
    it may be applied to the bulk of the application’s routes. The `AuthenticateSession`
    middleware is associated with a route by default through the `auth.session` route
    middleware alias set in your application’s HTTP kernel:


    `Route::middleware([‘auth’, ‘auth.session’])->group(function () {`


    `Route::get(‘/’, function () {`


    `// Code Logic`


    `});`


    `});`


    Then, you may utilize the Auth facade’s `logoutOtherDevices` function. This technique
    needs the user to validate their current password, which should be accepted by
    your application via an input form:


    `use Illuminate\Support\Facades\Auth;`


    `Auth::logoutOtherDevices($currentPassword);`


    When the `logoutOtherDevices` method is called, all the user’s prior sessions
    are invalidated, which means they are **logged out** of any guards they were previously
    authenticated by.


    # [Password Management](#toc.xhtml#s173a)


    You may have actions in your application that need the user to confirm their password
    before the action is done or before the user is routed to a sensitive region of
    the application. Laravel contains built-in middleware to make this procedure as
    simple as possible.


    You will need to design two routes to implement this feature:


    *   Display a view requesting the user to confirm their password


    *   Ensure that the password is genuine and redirect the user to their desired
    destination


    # [Configuration](#toc.xhtml#s174a)


    After verifying their password, a user will not be prompted to do so again for
    three hours. You may, however, change the value of the `password_timeout` setting
    variable within your application’s `config/auth.php` configuration file to customize
    the amount of time before the user is requested for their password.


    # [Routing](#toc.xhtml#s175a)


    First, we’ll construct a route that will display a view asking the user to confirm
    their password:


    `Route::get(‘/confirmPassword’, function () {`


    `return view(‘auth.confirm-password’);`


    `})->middleware(‘auth’)->name(‘password.confirm’);`


    As you may anticipate, the view provided by this route should have a form with
    a password field. In addition, feel free to put text within the view that informs
    the user that they are entering a secured part of the program and must confirm
    their password.'
