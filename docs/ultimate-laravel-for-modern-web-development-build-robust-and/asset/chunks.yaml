  trans: "\n\n通知传递可能会很慢，特别是当通道需要使用外部 API 来提供消息时。通过在类中包含 `ShouldQueue` 接口和 `Queueable`\
    \ 特性，允许你的通知进入队列，以提高应用程序的响应速度。你可以立即向通知类中添加该接口和特性，因为对于使用 `make:notification` 命令创建的所有通知，它们已经默认导入：\n\
    \n```php\n<?php\nnamespace App\\Notifications;\nuse Illuminate\\Bus\\Queueable;\n\
    use Illuminate\\Contracts\\Queue\\ShouldQueue;\nuse Illuminate\\Notifications\\\
    Notification;\n\nclass orderRecieved extends Notification implements ShouldQueue\n\
    {\n    use Queueable;\n    // Logic\n}\n```\n\n在你的通知更新了 `ShouldQueue` 接口后，你就可以正常地发送它。当一个类拥有\
    \ `ShouldQueue` 接口时，Laravel 会识别它并自动队列通知传递：\n\n```php\n$user->notify(new orderRecieved($invoice));\n\
    ```\n\n在队列化通知时，每个接收者和通道的组合都会创建一个队列作业。例如，如果你的通知包含两个通道和三个接收者，将向队列中添加六个作业。\n\n# 延迟通知\n\
    \n你可以在实例化通知时链式调用 `delay` 方法来推迟通知的传递：\n\n```php\n$delay = now()->addMinutes(10);\n\
    $user->notify((new orderRecieved($invoice))->delay($delay));\n```\n\n`delay` 函数允许你提供一个数组来设置每个通道的延迟时间：\n\
    \n```php\n$user->notify((new orderRecieved($invoice))->delay([\n    'mail' =>\
    \ now()->addMinutes(2),\n    'sms' => now()->addMinutes(5),\n]));\n```\n\n作为替代方案，通知类本身可以定义一个\
    \ `withDelay` 方法。`withDelay` 方法应该以数组的形式返回通道名称和延迟值：\n\n```php\npublic function\
    \ withDelay(object $notifiable): array\n{\n    return [\n        'mail' => now()->addMinutes(2),\n\
    \        'sms' => now()->addMinutes(5),\n    ];\n}\n```\n\n# 自定义通知队列\n\n队列告警将通过你应用程序的默认队列连接自动队列化。如果你想为特定的通知选择不同的连接，可以在通知的构造函数中调用\
    \ `onConnection` 函数：\n\n```php\n<?php\nnamespace App\\Notifications;\nuse Illuminate\\\
    Bus\\Queueable;\nuse Illuminate\\Contracts\\Queue\\ShouldQueue;\nuse Illuminate\\\
    Notifications\\Notification;\n\nclass orderRecieved extends Notification implements\
    \ ShouldQueue\n{\n    use Queueable;\n    public function __construct()\n    {\n\
    \        $this->onConnection('redis');\n    }\n}\n```\n\n或者，你可以在通知上定义一个 `viaConnections`\
    \ 函数，以指示通知支持的每个通知通道应该使用哪个队列连接。该方法的结果应该是通道名称 / 队列连接名称对的数组：\n\n```php\npublic function\
    \ viaConnections(): array\n{\n    return [\n        'mail' => 'redis',\n     \
    \   'database' => 'sync',\n    ];\n}\n```\n\n# 自定义通知通道队列\n\n你可以在通知上定义一个 `viaQueues`\
    \ 方法，以指示通知支持的每个通知通道应该使用哪种队列。该方法的结果应该是通道名称 / 队列名称对的数组：\n\n```php\npublic function\
    \ viaQueues(): array\n{\n    return [\n        'mail' => 'mail-queue',\n     \
    \   'slack' => 'slack-queue',\n    ];\n}\n```\n\n当队列告警在数据库事务中发送时，队列可能会在数据库事务提交之前处理它们。如果发生这种情况，你在数据库事务期间对模型或数据库记录所做的任何调整可能尚未反映在数据库中。此外，在事务期间产生的任何模型或数据库条目可能不再存在于数据库中。如果你的通知是基于这些模型的，那么在处理发送队列通知的任务期间可能会出现意料之外的问题。\n\
    \n如果你的队列连接的 `after_commit` 配置选项设置为 `false`，你仍然可以在传递通知时通过使用 `afterCommit` 方法，指定特定的队列通知在所有打开的数据库事务提交后分发：\n\
    \n```php\nuse App\\Notifications\\orderRecieved;\n$user->notify((new orderRecieved($order))->afterCommit());\n\
    ```\n\n或者从通知的构造函数中调用 `afterCommit` 方法。\n\n```php\n<?php\nnamespace App\\Notifications;\n\
    use Illuminate\\Bus\\Queueable;\nuse Illuminate\\Contracts\\Queue\\ShouldQueue;\n\
    use Illuminate\\Notifications\\Notification;\n\nclass orderRecieved extends Notification\
    \ implements ShouldQueue\n{\n    use Queueable;\n    public function __construct()\n\
    \    {\n        $this->afterCommit();\n    }\n}\n```\n\n队列通知在分发进行后台处理后，通常会由队列工作进程接收并传递给其指定的接收者。\n\
    \n如果你想在队列通知被队列工作进程处理后对是否发送该通知做出最终决定，你可以在通知类上指定一个 `shouldSend` 方法。如果此方法返回 `false`，则通知将不会传递：\n\
    \n```php\npublic function shouldSend(object $notifiable, string $channel): bool\n\
    {\n    return true; // example logic\n}\n```\n\n# 按需发送通知\n\n你可能需要向一个没有注册为用户的人发送通知。在传递消息之前，你可以使用\
    \ Facade 的 `route` 方法提供即时路由信息：\n\n```php\nuse Illuminate\\Broadcasting\\Channel;\n\
    use Illuminate\\Support\\Facades\\Notification;\n\nNotification::route('mail',\
    \ 'abc@example.com')\n    ->notify(new OrderShipped($order));\n```\n\n如果你在发送按需通知时包含接收者的姓名，请使用数组，以电子邮件地址为键，名为值：\n\
    \n```php\nNotification::route('mail', [\n    'qwerty@example.com' => 'Sample Name',\n\
    ])->notify(new OrderShipped($order));\n```\n\n# 邮件通知\n\n如果通知作为电子邮件发送，通知类应该包含一个\
    \ `toMail` 函数。该函数在接收 `$notifiable` 实体后应返回一个 `MailMessage` 实例。\n\n`MailMessage`\
    \ 类有一些简单的方法用于创建事务性电子邮件。文本行和操作可以包含在电子邮件通信中。让我们看看 `toMail` 方法的示例：\n\n```php\npublic\
    \ function toMail(object $notifiable): MailMessage\n{\n    $url = url('/order/'.$this->invoice->id);\n\
    \    return (new MailMessage)\n        ->greeting('Hello!')\n        ->line('We\
    \ have received your order')\n        ->lineIf($this->amount > 0, \"Amount paid:\
    \ {$this->amount}\")\n        ->action('查看账单', $url)\n        ->line('感谢使用我们的应用程序!');\n\
    }\n```\n\n在这个示例中，我们有一个欢迎语、几行文本、一个操作和另一行文本。`MailMessage` 对象的方法使得准备小型事务性电子邮件变得简单快速。消息组件随后会被邮件通道翻译成具有纯文本等效的响应式\
    \ HTML 电子邮件设计。\n\n与其在通知类中设置文本行，还如使用 `view` 函数为渲染通知电子邮件定义自定义模板：\n\n```php\npublic\
    \ function toMail(object $notifiable): MailMessage\n{\n    return (new MailMessage)->view(\n\
    \        'emails.name', ['order' => $this->order]\n    );\n}\n```\n\n你可以通过将视图名称作为第二个成员传递给\
    \ `view` 方法为邮件消息定义一个纯文本视图：\n\n```php\npublic function toMail(object $notifiable):\
    \ MailMessage\n{\n    return (new MailMessage)->view(\n        'emails.name',\
    \ ['order' => $this->order], 'text'\n    );\n}\n```\n\n"
- fmt: "\n```php\n[`‘emails.name.html’, ‘emails.name.plain’],`\n[`‘order’ => $this->order]`\n\
    `);\n}\n```\n\n# Customizing Email Components\n\nThe sender `from` address of\
    \ emails is set by default in the `config/mail.php` configuration file. However,\
    \ you may use the `from` method to provide the from address for a single notification:\n\
    \n```php\npublic function toMail(object $notifiable): MailMessage\n{\n    return\
    \ (new MailMessage)\n        ->from(‘abc@example.com’, ‘Sample Name’)\n      \
    \  ->line(‘…’);\n}\n```\n\nThe notification system will automatically check for\
    \ an `email` attribute on your notifiable object when sending alerts over the\
    \ `mail` channel. By establishing a `routeNotificationForMail` method on the notifiable\
    \ entity, you may specify which email address is used to deliver the notification:\n\
    \n```php\n<?php\n\nnamespace App\\Models;\nuse Illuminate\\Foundation\\Auth\\\
    User as Authenticatable;\nuse Illuminate\\Notifications\\Notifiable;\nuse Illuminate\\\
    Notifications\\Notification;\n\nclass User extends Authenticatable\n{\n    use\
    \ Notifiable;\n\n    public function routeNotificationForMail(Notification $notification):\
    \ array|string\n    {\n        // Return email address\n        return $this->email_address;\n\
    \        // Return email address and name\n        return [$this->email_address\
    \ => $this->name];\n    }\n}\n```\n\nThe topic of the email is the class name\
    \ of the notice formatted to `Title Case` by default. So, if your notification\
    \ class is called `orderComplete`, the topic of the email will be `orderComplete`.\
    \ If you want to specify a different `subject` for the message, use the `subject`\
    \ method when creating the message:\n\n```php\npublic function toMail(object $notifiable):\
    \ MailMessage\n{\n    return (new MailMessage)\n        ->subject(‘Notification\
    \ Subject’)\n        ->line(‘…’);\n}\n```\n\nThe email notice is delivered by\
    \ default using the default mailer set in the `config/mail.php` configuration\
    \ file. However, you may change the mailer at runtime by invoking the `mailer`\
    \ function when creating your message:\n\n```php\npublic function toMail(object\
    \ $notifiable): MailMessage\n{\n    return (new MailMessage)\n        ->mailer(‘postmark’)\n\
    \        ->line(‘…’);\n}\n```\n\n# Custom templates\n\nBy exposing the notification\
    \ package’s resources, you may edit the HTML and plain-text templates used by\
    \ mail notifications. The mail notification templates will be located in the `resources/views/vendor/notifications`\
    \ directory once you execute this command:\n\n```bash\nphp artisan vendor:publish\
    \ --tag=laravel-notifications\n```\n\nWhen creating an email notice, utilize the\
    \ `attach` method to include attachments. As its first parameter, the `attach`\
    \ method accepts the absolute path to the file:\n\n```php\npublic function toMail(object\
    \ $notifiable): MailMessage\n{\n    return (new MailMessage)\n        ->greeting(Welcome!)\n\
    \        ->attach(‘/path/to/file’);\n}\n```\n\nYou may define the display name\
    \ and/or MIME type when adding files to a message by giving an `array` as the\
    \ second argument to the `attach` method:\n\n```php\npublic function toMail(object\
    \ $notifiable): MailMessage\n{\n    return (new MailMessage)\n        ->greeting(‘Welcome!’)\n\
    \        ->attach(‘/path/to/file’, [\n            ‘as’ => ‘name.pdf’,\n      \
    \      ‘mime’ => ‘application/pdf’,\n        ]);\n}\n```\n\nUnlike attaching files\
    \ in mailable objects, `attachFromStorage` does not allow you to `attach` a file\
    \ straight from a storage drive. Use the `attach` method with an absolute path\
    \ to the file on the storage drive instead. Alternatively, you might use the `toMail`\
    \ function to return a mailable:\n\n```php\nuse App\\Mail\\InvoicePaid as OrderRecievedMailable;\n\
    \npublic function toMail(object $notifiable): Mailable\n{\n    return (new OrderRecievedMailable($this->order))\n\
    \        ->to($notifiable->email)\n        ->attachFromStorage(‘/path/to/file’);\n\
    }\n```\n\nMultiple files can be handled by the `toMail` function to return a mailable:\n"
