    `}`


    Unlike attaching files in mailable objects, `attachFromStorage` does not allow
    you to `attach` a file straight from a storage drive. Use the attach method with
    an absolute path to the file on the storage drive instead. Alternatively, you
    might use the `toMail` function to return a mailable:


    `use App\Mail\InvoicePaid as OrderRecievedMailable;`


    `public function toMail(object $notifiable): Mailable`


    `{`


    `return (new OrderRecievedMailable($this->order))`


    `->to($notifiable->email)`


    `->attachFromStorage(‘/path/to/file’);`


    `}`


    Multiple files can be connected to a message using the `attachMany` function when
    necessary:


    `public function toMail(object $notifiable): MailMessage`


    `{`


    `return (new MailMessage)`


    `->greeting(‘Welcome!’)`


    `->attachMany([`


    `‘/path/to/forge.svg’,`


    `‘/path/to/vapor.svg’ => [`


    `‘as’ => ‘Logo1.svg’,`


    `‘mime’ => ‘image/svg+xml’,`


    `],`


    `]);`


    `}`


    # [Handling Raw Data](#toc.xhtml#s260a)


    Attach a raw string of bytes as an attachment using the `attachData` function.
    When invoking the `attachData` function, give the filename to be allocated to
    the attachment:


    `public function toMail(object $notifiable): MailMessage`


    `{`


    `return (new MailMessage)`


    `->greeting(‘Welcome!’)`


    `->attachData($this->pdf, ‘name.pdf’, [`


    `‘mime’ => ‘application/pdf’,`


    `]);`


    `}`


    # [Tags and Metadata](#toc.xhtml#s261a)


    Message *tags* and *metadata* are supported by certain third-party email providers,
    such as Mailgun and Postmark, and may be used to organize and monitor emails sent
    by your application. Tags and metadata can be added to an email message using
    the `tag` and `metadata` methods:


    `public function toMail(object $notifiable): MailMessage`


    `{`


    `return (new MailMessage)`


    `->greeting(‘Upvoted!’)`


    `->tag(‘upvote’)`


    `->metadata(‘comment_id’, $this->comment->id);`


    `}`


    If your application is utilizing the Mailgun driver, you may find additional information
    about tags and metadata in Mailgun’s documentation. Similarly, the Postmark documentation
    may be reviewed for further information on their tag and metadata capabilities.


    If your application sends emails over Amazon SES, you should utilize the `metadata`
    approach to attach SES tags to the message.


    # [Custom Symfony Message](#toc.xhtml#s262a)


    The `MailMessage` class’s `withSymfonyMessage` function allows you to register
    a closure that will be executed with the Symfony Message instance before sending
    the message. This allows you to fully tweak the message before it is delivered:


    `use Symfony\Component\Mime\Email;`


    `public function toMail(object $notifiable): MailMessage`


    `{`


    `return (new MailMessage)`


    `->withSymfonyMessage(function (Email $message) {`


    `$message->getHeaders()->addTextHeader(`


    `‘Custom-Header’, ‘Header Value’`


    `);`


    `});`


    `}`


    # [Broadcast Notifications](#toc.xhtml#s263a)


    The `broadcast` channel uses Laravel’s event broadcasting services to send alerts,
    allowing your JavaScript-powered frontend to receive them in real-time. If a notification
    allows broadcasting, a `toBroadcast` function on the notification class can be
    defined. This function takes a `$notifiable` entity and returns a `BroadcastMessage`
    instance. If the `toBroadcast` method does not exist, the data that should be
    broadcast will be gathered using the `toArray` method. The data received will
    be encoded as JSON and sent to your JavaScript-powered frontend. Let’s look at
    an example of the Broadcast method:


    `use Illuminate\Notifications\Messages\BroadcastMessage;`


    `public function toBroadcast(object $notifiable): BroadcastMessage`


    `{`


    `return new BroadcastMessage([`


    `‘order_id’ => $this->order->id,`


    `‘amount’ => $this->order->amount,`


    `]);`


    `}`


    All broadcast alerts have been queued for transmission. You may utilize the `onConnection`
    and `onQueue` methods of the `BroadcastMessage` to configure the queue connection
    or queue name that is used to queue the broadcast operation:


    `return (new BroadcastMessage($data))`


    `->onConnection(‘sqs’)`


    `->onQueue(‘broadcasts’);`


    In addition to the data you supply, all broadcast notifications feature a `type`
    field that contains the notification’s complete class name. If you want to change
    the notification `type`, add a `broadcastType` function on the notification class:


    `public function broadcastType(): string`


    `{`


    `return ‘broadcast.message’;`


    `}`


    Notifications will be broadcast on a private channel using the `notifiable.id`
    convention. As a result, if you send a notice to an `App\Models\User` instance
    with an ID of 1, it will be broadcast on the `App.Models.User`. There is just
    one private channel. You can simply listen for alerts on a channel while using
    Laravel Echo by utilizing the `notification` method:


    `Echo.private(‘App.Models.User.’ + userId)`


    `.notification((notification) => {`


    `console.log(notification.type);`


    `});`'
