  trans: "\n\n`->with('name', 'ABC')`\n\n`->with('organization', 'ORGNAME');`\n\n\
    # 共享数据\n\n在少数情况下，你可能需要与应用程序渲染的每一个视图共享数据。可以使用 `View`  Fac 类的 `share` 方法来实现这一点。`share`\
    \ 方法通常会在服务提供者（service provider）的 `boot` 方法中调用。你可以构建不同的服务提供者来存放这些逻辑，或者将它们添加到 `App\\\
    Providers\\AppServiceProvider` 类中。并且必须在 `config/app.php` 中注册它才能生效。\n\n```php\n\
    <?php\n\nnamespace App\\Providers;\nuse Illuminate\\Support\\Facades\\View;\n\n\
    class AppServiceProvider extends ServiceProvider\n{\n    /**\n     * 注册任何应用服务。\n\
    \     */\n    public function register(): void\n    {\n        // Code Logic\n\
    \    }\n    /**\n     * 引导任何应用服务。\n     */\n    public function boot(): void\n\
    \    {\n        View::share('key', 'value');\n    }\n}\n```\n\n# 视图组合器与创建器 (View\
    \ Composers and Creators)\n\n视图组合器和创建器在增强代码健壮性方面有着本质的区别。\n\n![](img/Figure-3.6.jpg)\n\
    \n**图 3.6：** 视图组合器与创建器\n\n# 视图组合器\n\n当视图被渲染时，调用视图组合器的回调函数或类方法就会被触发。如果你有数据需要在每次渲染视图时绑定到该视图，视图组合器可以帮助你集中管理逻辑。如果应用程序中的许多路由或控制器都返回同一个视图，并且需要相同的数据集，那么视图组合器可能变得特别有用。\n\
    \n视图组合器通常会注册在应用程序的某个服务提供者中。在这个示例中，我们假设已经构建了一个新的 `App\\Providers\\ViewServiceProvider`\
    \ 来包含此功能。\n\n要注册视图组合器，我们将使用 `View` Fac 类的的 `composer` 方法。你可以根据需要自由安排基于类的视图组合器，因为\
    \ Laravel 并没有为它们提供默认目录。\n\n例如，为了存储应用程序中所有的视图组合器，你可以创建一个 `app/View/Composers` 目录：\n\
    \n```php\n<?php\n\nnamespace App\\Providers;\nuse App\\View\\Composers\\ProfileComposer;\n\
    use Illuminate\\Support\\Facades;\nuse Illuminate\\Support\\ServiceProvider;\n\
    use Illuminate\\View\\View;\n\nclass ViewServiceProvider extends ServiceProvider\n\
    {\n    /**\n     * 注册任何应用服务。\n     */\n    public function register(): void\n\
    \    {\n        // Code Logic\n    }\n    /**\n     * 引导任何应用服务。\n     */\n   \
    \ public function boot(): void\n    {\n        // 使用基于类的组合器\n        Facades\\\
    View::composer('profile', ProfileComposer::class);\n        // 使用基于闭的组合器\n   \
    \     Facades\\View::composer('cityPollution', function (View $view) {\n     \
    \       // Code Logic\n        });\n        Facades\\View::composer('introduction',\
    \ function (View $view) {\n            // Code Logic\n        });\n    }\n}\n\
    ```\n\n现在组合器已经注册，`App\\View\\Composers\\ProfileComposer` 类的 `compose` 方法将会被调用。\n\
    \n```php\n<?php\n\nnamespace App\\View\\Composers;\nuse App\\Repositories\\UserRepository;\n\
    use Illuminate\\View\\View;\n\nclass ProfileComposer\n{\n    /**\n     * 创建一个新的个人资料组合器。\n\
    \     */\n    public function __construct(\n        protected CityRepository $city,\n\
    \    ) {}\n    /**\n     * 将数据绑定到视图。\n     */\n    public function compose(View\
    \ $view): void\n    {\n        $view->with('count', $this->city->count());\n \
    \   }\n}\n```\n\n你可以看到，*服务容器 (service container)* 会解析所有的视图组合器，允许你在组合器的构造函数中类型提示所需的任何依赖项。\n\
    \n# 使用组合器处理多个视图\n\n通过将视图数组作为第一个参数传递给组合方法，你可以同时将视图组合器附加到多个视图上：\n\n```php\nuse App\\\
    Views\\Composers\\MultiComposer;\nuse Illuminate\\Support\\Facades\\View;\nView::composer(\n\
    \    ['welcome', 'dashboard'],\n    MultiComposer::class\n);\n```\n\n`*` 字符也被组合器方法作为通配符接受，允许你将组合器添加到所有视图中：\n\
    \n```php\nuse Illuminate\\Support\\Facades;\nuse Illuminate\\View\\View;\nFacades\\\
    View::composer('*', function (View $view) {\n    // Code Logic\n});\n```\n\n#\
    \ 视图创建器 (View Creators)\n\n与视图组合器类似，视图创建器在视图实例化后就会立即执行，而不是等到视图准备渲染时。使用 `creator`\
    \ 方法注册视图创建器：\n\n```php\nuse App\\View\\Creators\\ProfileCreator;\nuse Illuminate\\\
    Support\\Facades\\View;\nView::creator('profile', ProfileCreator::class);\n```\n\
    \n# 视图优化\n\nBlade 模板视图默认按需进行编译。如果视图存在，Laravel 将确定该文件是否发生了更改。由于在请求期间编译视图可能会对性能产生影响，Laravel\
    \ 提供了 `view:cache` 任务。你可能想在部署时执行此命令以提高性能：\n\n`php artisan view:cache`\n\n清除视图：\n\
    \n`php artisan view:clear`\n\n![](img/Figure-3.7.jpg)\n\n**图 3.7：** 视图优化\n\n#\
    \ 总结\n\n路由器和视图是 Web 开发中的两个关键组件，是本书这一章节的重点。在章节开头，我们涵盖了路由器和视图的重要性。本章涵盖了多个主题，包括路由器和视图的各种类型、策略和配置。\n\
    \n我们在章节开头介绍了 Laravel 路由器的概述，然后我们了路由的基本语法示例，并探讨了如何使用路由器在程序内部传输数据。\n\n下一章将关注构建 Laravel\
    \ 中的控制器和 Blade 模板。它将解释控制器和 Blade 在开发中的重要性以及如何使用它们。\n\n# 重点\n\n- 章节探讨了定义 Laravel\
    \ 所有路由的路由文件，它们位于 routes 目录。描述了 `RouteServiceProvider` 的功能以及路由文件是如何加载的。强调了界面路由（具有\
    \ CSRF 保护和会话状态）创建在 `routes/web.php` 中并属于 web 中间件组。`routes/api.php` 文件定义了 API 无状态路由，它是\
    \ api 中间件组的一部分。\n- 随后，章节探讨了路由器方法，允许程序员注册响应不同 HTTP 动词路由。在创建相同 URI 的多个路由时，列出了许多常用的路由器方法，并强调了它们的声明顺序。\n\
    - 视图部分从介绍 Laravel 视图开始，讨论了它们如何帮助渲染网页的 HTML 表示。强调了视图如何允许将显示逻辑与应用程序的业务逻辑分离，从而使代码更简单易读。\n\
    - 这部分讨论的首要主题是创建视图。Laravel 视图默认位于 resources/views 目录下。涵盖了如何在路由和控制器中引用视图，并介绍了生成视图文件的过程。\n\
    \n"
- fmt: "\n*   The chapter then examines the various view types that Laravel offers.\
    \ The default templating engine in Laravel, `Blade Views`, is discussed. It offers\
    \ capabilities like conditional statements and loops, and includes reusable code\
    \ snippets.\n\n*   For developers who favor working with plain PHP code, the chapter\
    \ also highlights the availability of plain PHP views. How to send data from controllers\
    \ to views is covered in the section on data and views. It explains how to provide\
    \ data to views using the method and the `compact` function, enabling developers\
    \ to display dynamic content based on the supplied data.\n\n*   Then, as a means\
    \ of transferring data across different views or carrying out operations on them,\
    \ view composers and creators are provided. View composers are callbacks that\
    \ are executed when particular views are produced, allowing data to be shared\
    \ with those views. View creators, on the other hand, let programmers take action\
    \ before a view is produced.\n\n# [Chapter 4](#toc.xhtml#c04)\n\n# [Building Controllers\
    \ and Blade Templates](#toc.xhtml#c04)\n\n# [Introduction](#toc.xhtml#s94a)\n\n\
    This chapter covers Controllers and Blade in Laravel, which are crucial components\
    \ in web development. It will explain the importance of Controllers and Blade\
    \ in web development and how they are used in Laravel. The chapter will also discuss\
    \ how to use Controllers with views, redirects, directives, and Blade as template\
    \ engines.\n\n# [Structure](#toc.xhtml#s95a)\n\nIn this chapter, we will discuss\
    \ the following topics:\n\n*   Controllers with Views in Laravel\n    *   Controllers\n\
    \    *   Resource Controllers\n    *   Constructor Injection\n    *   Method Injection\n\
    *   Redirects in Laravel\n    *   Redirect Helper\n    *   Redirecting to Named\
    \ Routes\n    *   Redirecting to Controller Actions\n*   Directives in Laravel\n\
    \    *   Conditional Directive\n    *   Switch Directive\n    *   Auth Directive\n\
    \    *   Loops\n    *   Once Directive\n*   Blade as Template Engines in Laravel\n\
    \    *   Data in Blade\n    *   HTML Entity Encoding\n    *   Components\n   \
    \     *   Rendering Components\n        *   Passing Data\n    *   Layouts\n  \
    \  *   Rendering Blade Templates\n    *   Rendering Blade Fragments\n\n# [Controllers\
    \ with Views in Laravel](#toc.xhtml#s96a)\n\nControllers in the MVC architecture\
    \ are simply classes that group the functionality of one or more routes together.\
    \ Particularly, if your application is organized in a traditionally CRUD-like\
    \ fashion, controllers prefer to group related routes together.\n\nA good coding\
    \ and application development practice is to separate the application logic as\
    \ per the Model-View-Controller (MVC) logic. It may feel easier to have all logic\
    \ in the controller, but that will drive away from the purpose and the intention\
    \ of the MVC architecture.\n\nA controller may manage all the actions that can\
    \ be performed on a specific resource, such as:\n\nCRUD – Create, Read, Update,\
    \ Delete\n\n# [Controllers](#toc.xhtml#s97a)\n\nThe `make:controller` Artisan\
    \ command is used to rapidly create a new controller, and the `app/Http/Controllers`\
    \ directory is where the Laravel application’s controllers are kept by default.\n\
    \nFor example:\n\n```bash\nphp artisan make:controller UserController\n```\n\n\
    Using the controller syntax, let’s look at the following example to create a controller\
    \ in Laravel:\n\n```php\n<?php\n\nnamespace App\\Http\\Controllers;\n\nuse App\\\
    Models\\User;\nuse Illuminate\\View\\View;\n\nclass UserController extends Controller\n\
    {\n    /**\n     * Display the specified resource.\n     */\n    public function\
    \ show(string $id): View\n    {\n        return view('user.show', [\n        \
    \    'user' => User::findOrFail($id),\n        ]);\n    }\n}\n```\n\n# [Resource\
    \ Controllers](#toc.xhtml#s98a)\n\nIt is common to use the `resource` method to\
    \ define all CRUD routes for a controller in a single line. To do this quickly,\
    \ use the `make:controller` command with the `--resource` flag:\n\n```bash\nphp\
    \ artisan make:controller UserController --resource\n```\n\nThe created controller\
    \ will be located in `app/Http/Controllers/UserController.php`. For each resource,\
    \ the methods will be stubbed in the controller:\n\n```php\n<?php\n\nnamespace\
    \ App\\Http\\Controllers;\n\nuse App\\Models\\User;\nuse Illuminate\\View\\View;\n\
    \nclass UserController extends Controller\n{\n    /**\n     * Display a listing\
    \ of the resource.\n     */\n    public function index()\n    {\n        // TODO:\
    \ implementation\n    }\n\n    /**\n     * Show the form for creating a new resource.\n\
    \     */\n    public function create()\n    {\n        // TODO: implementation\n\
    \    }\n\n    /**\n     * Store a newly created resource.\n     */\n    public\
    \ function store(Request $request)\n    {\n        // TODO: implementation\n \
    \   }\n\n    /**\n     * Display the specified resource.\n     */\n    public\
    \ function show(string $id): View\n    {\n        // TODO: implementation\n  \
    \  }\n\n    /**\n     * Show the form for editing the specified resource.\n  \
    \   */\n    public function edit(string $id)\n    {\n        // TODO: implementation\n\
    \    }\n\n    /**\n     * Update the specified resource.\n     */\n    public\
    \ function update(Request $request, string $id)\n    {\n        // TODO: implementation\n\
    \    }\n\n    /**\n     * Remove the specified resource.\n     */\n    public\
    \ function destroy(string $id)\n    {\n        // TODO: implementation\n    }\n\
    }\n```\n\nYou can also register these routes in the `routes/web.php` file like\
    \ this:\n\n```php\nuse App\\Http\\Controllers\\UserController;\nuse Illuminate\\\
    Support\\Facades\\Route;\n\nRoute::resource('users', UserController::class);\n\
    ```\n\nThis will generate the following routes:\n\n| Verb | URI | Action | Name\
    \ |\n| :--- | :--- | :--- | :--- |\n| GET | `/users` | `index` | `users.index`\
    \ |\n| GET | `/users/create` | `create` | `users.create` |\n| POST | `/users`\
    \ | `store` | `users.store` |\n| GET | `/users/{user}` | `show` | `users.show`\
    \ |\n| GET | `/users/{user}/edit` | `edit` | `users.edit` |\n| PUT/PATCH | `/users/{user}`\
    \ | `update` | `users.update` |\n| DELETE | `/users/{user}` | `destroy` | `users.destroy`\
    \ |\n\n# [Constructor Injection](#toc.xhtml#s99a)\n\nAll Laravel controllers are\
    \ resolved using the Laravel service container. You may type-hint any dependencies\
    \ your controller might require in its constructor as a consequence. Automatic\
    \ resolution and injection of the given dependencies into the controller instance\
    \ will take place:\n\n```php\n<?php\n\nnamespace App\\Http\\Controllers;\n\nuse\
    \ App\\Repositories\\EmployeeRepository;\n\nclass UserController extends Controller\n\
    {\n    /**\n     * Create a new controller instance.\n     */\n    public function\
    \ __construct(\n        protected EmployeeRepository $employees\n    ) {}\n}\n\
    ```\n\n# [Method Injection](#toc.xhtml#s100a)\n\nYou may type-hint dependencies\
    \ on the methods of your controller in addition to injecting requirements in constructors.\
    \ Injecting the `Illuminate\\Http\\Request` object into your controller functions\
    \ is a typical application of method injection:\n\n```php\n<?php\n\nnamespace\
    \ App\\Http\\Controllers;\n\nuse Illuminate\\Http\\RedirectResponse;\nuse Illuminate\\\
    Http\\Request;\n\nclass UserController extends Controller\n{\n    /**\n     *\
    \ Store a new employee.\n     */\n    public function store(Request $request):\
    \ RedirectResponse\n    {\n        $name = $request->name;\n        // Store the\
    \ employee…\n\n        return redirect('/employees');\n    }\n}\n```\n\n# [Redirects\
    \ in Laravel](#toc.xhtml#s101a)\n"
