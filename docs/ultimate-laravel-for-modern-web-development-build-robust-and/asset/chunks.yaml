    `return redirect()->intended();`


    `})->middleware([‘auth’, ‘throttle:6,1’]);`


    Let’s take a closer look at this path before going on. First, the request’s `password`
    field is checked to see if it matches the password of the authorized user. If
    the password is correct, we must notify Laravel’s session that the user has validated
    their password. The `passwordConfirmed` method adds a timestamp to the user’s
    session, which Laravel may use to detect when the user last verified their password.
    Finally, we may guide the user to their desired location.


    # [Authentication Custom Guards](#toc.xhtml#s176a)


    Using the `extend` method on the Auth facade, you may create your own authentication
    guards. You should make a call to a service provider’s `extend` method. Because
    Laravel already has an `AuthServiceProvider`, we can paste the following code
    into it:


    `<?php`


    `namespace App\Providers;`


    `use App\Services\Auth\JwtGuard;`


    `use Illuminate\Contracts\Foundation\Application;`


    `use Illuminate\Foundation\Support\Providers\AuthServiceProvider as ServiceProvider;`


    `use Illuminate\Support\Facades\Auth;`


    `class AuthServiceProvider extends ServiceProvider`


    `{`


    `/**`


    `* Register any application authentication / authorization services.`


    `*/`


    `public function boot(): void`


    `{`


    `Auth::extend(‘jwt’, function (Application $app, string $name, array $config)
    {`


    `// Return an instance of Illuminate\Contracts\Auth\Guard`


    `return new JwtGuard(Auth::createUserProvider($config[‘provider’]));`


    `});`


    `}`


    `}`


    As seen in the preceding example, the callback supplied to the `extend` method
    should return an `Illuminate\Contracts\Auth\Guard` implementation. This interface
    provides a few methods that must be implemented to define a custom guard. Once
    you’ve defined your own guard, you can use it in the `guards` configuration of
    your `auth.php` configuration file:


    `‘guards’ => [`


    `‘api’ => [`


    `‘driver’ => ‘jwt’,`


    `‘provider’ => ‘users’,`


    `],`


    `],`


    # [Closure Request Guards](#toc.xhtml#s177a)


    Using the `Auth::viaRequest` function is the simplest approach to construct a
    bespoke HTTP request-based authentication system. Using a single closure, you
    can easily create your authentication procedure.


    To begin, invoke the `Auth::viaRequest` function from your `AuthServiceProvider`’s
    startup method. The first argument to the `viaRequest` method is the name of an
    authentication driver. Any string that describes your custom guard can be used
    as this name. The method’s second parameter should be a closure that receives
    the incoming HTTP request and returns a user instance or `null` if authentication
    fails:


    `use App\Models\User;`


    `use Illuminate\Http\Request;`


    `use Illuminate\Support\Facades\Auth;`


    `/**`


    `* Register any application authentication / authorization service`


    `*/`


    `public function boot(): void`


    `{`


    `Auth::viaRequest(‘customToken’, function (Request $request) {`


    `return Employee::where(‘token’, (string) $request->token)->first();`


    `});`


    `}`


    Once your custom authentication driver has been developed, you can add it as a
    driver to your auth.php configuration file’s guards configuration:


    `‘guards’ => [`


    `‘api’ => [`


    `‘driver’ => ‘customToken’,`


    `],`


    `],`


    Finally, when adding the authentication middleware to a route, you may refer to
    the guard:


    `Route::middleware(‘auth:api’)->group(function () {`


    `// Code Logic`


    `}`


    # [Invalidate Sessions across Multiple Devices](#toc.xhtml#s178a)


    Laravel also has a technique for invalidating and “logging out” a user’s sessions
    that are active on other devices without invalidating their current session. When
    a user changes or updates their password, you may use this functionality to invalidate
    sessions on other devices while keeping the current device authorized.


    Before you begin, ensure that the `Illuminate\Session\Middleware\AuthenticateSession`
    middleware is present on the routes that should receive session authentication.
    This middleware should typically be placed on a route group definition so that
    it may be applied to the bulk of your application’s routes. The `AuthenticateSession`
    middleware is associated with a route by default through the `auth.session` route
    middleware alias set in your application’s HTTP kernel:


    `Route::middleware([‘auth’, ‘auth.session’])->group(function () {`


    `Route::get(‘/’, function () {`


    `// Code Logic`


    `});`


    `});`


    Then, you may utilize the `Auth` facade’s `logoutOtherDevices` function. This
    technique needs the user to validate their current password, which should be accepted
    by your application via an input form:


    `use Illuminate\Support\Facades\Auth;`


    `Auth::logoutOtherDevices($currentPassword);`


    When the `logoutOtherDevices` method is called, all the user’s prior sessions
    are invalidated, which means they are “logged out” of any guards they were previously
    authenticated by.


    # [User Session Knowledge](#toc.xhtml#s179a)


    On their login form, many web apps have a `remember me` checkbox. You may include
    `remember me` functionality in your application by passing a boolean value as
    the second parameter to the try method.


    When this value is set to `true`, Laravel will keep the user authorized indefinitely
    or until they log out manually. The string `remember_token` column in your `users`
    table must be present since it will be used to hold the “remember me” token. This
    field is already included in the user table migration bundled with new Laravel
    applications:


    `use Illuminate\Support\Facades\Auth;`


    `if (Auth::attempt([‘email’ => $email, ‘password’ => $password], $remember)) {`


    `// The user is saved`


    `}`


    If your application supports remember me, you may use the `viaRemember` method
    to see if the currently authorized user was authenticated using the “remember
    me” cookie:


    `use Illuminate\Support\Facades\Auth;`


    `if (Auth::viaRemember()) {`


    `// Code Logic`


    `}`


    # [Additional Authentication Methods](#toc.xhtml#s180a)


    In order to authenticate a user, in addition to the ways mentioned, there are
    a number of additional methods are available while developing the Laravel Application.


    ![](images/Figure-6.3.jpg)


    **Figure 6.3:** Additional Authentication Methods


    # [Authenticate a User Instance](#toc.xhtml#s181a)


    If you need to make an existing user instance, the currently authenticated user,
    you can utilize the Auth facade’s login function. The provided user instance must
    be an `Illuminate\Contracts\Auth\Authenticatable` implementation. This interface
    is already implemented in the Laravel `App\Models\User` model. This authentication
    technique is handy when you already have a valid user instance, such as when a
    user registers with your application:


    `use Illuminate\Support\Facades\Auth;`


    `Auth::login($user);`


    As the second argument to the login function, you can send a boolean value. This
    value determines whether the “remember me” capability for the authorized session
    is desired. Remember that the session will be authenticated continuously or until
    the user logs out of the application manually:


    `Auth::login($user, $remember = true);`


    If needed, you may specify an authentication guard before calling the login method:


    `Auth::guard(‘admin’)->login($user);`


    # [Authenticate a User By ID](#toc.xhtml#s182a)


    You may use the `loginUsingId` function to authenticate a user by utilizing the
    main key of their database record. This approach requires the main key of the
    user to be authenticated:'
