    can construct a different service provider to house them or add them to the `App\Providers\AppServiceProvider`
    class. And it is mandatory to register it in the `config/app.php` in order for
    it to work.


    `<?php`


    `namespace App\Providers;`


    `use Illuminate\Support\Facades\View;`


    `class AppServiceProvider extends ServiceProvider`


    `{`


    `/**`


    ` * Register any application services.`


    ` */`


    `public function register(): void`


    `{`


    `// Code Logic`


    `}`


    `/**`


    ` * Bootstrap any application services.`


    ` */`


    `public function boot(): void`


    `{`


    `View::share(‘key’, ‘value’);`


    `}`


    `}`


    # [View Composers and Creators](#toc.xhtml#s87a)


    The View composers and creators have fundamental differences in the way it enables
    robustness to code.


    ![](images/Figure-3.6.jpg)


    **Figure 3.6:** View Composers and Creators


    # [View Composers](#toc.xhtml#s88a)


    When a view is rendered, callbacks or class methods called view composers are
    invoked. A view composer can assist you in centralizing your logic if you have
    data that needs to be tied to a view each time it is rendered. If the same view
    is returned by many routes or controllers in your application and requires the
    same set of data, view composers may prove to be especially helpful.


    View composers will often be registered with one of the service providers for
    your application. For this example, we’ll suppose that a new `App\Providers\ViewServiceProvider`
    has been built to contain this functionality.


    To register the view composer, we’ll use the `composer` method of the `View` facade.
    You are free to arrange class-based view composers in any way you see fit since
    Laravel does not provide a default directory for them.


    To store all of your application’s view composers, for instance, you may make
    an `app/View/Composers` directory:


    `<?php`


    `namespace App\Providers;`


    `use App\View\Composers\ProfileComposer;`


    `use Illuminate\Support\Facades;`


    `use Illuminate\Support\ServiceProvider;`


    `use Illuminate\View\View;`


    `class ViewServiceProvider extends ServiceProvider`


    `{`


    `/**`


    ` * Register any application services.`


    ` */`


    `public function register(): void`


    `{`


    `// Code Logic`


    `}`


    `/**`


    ` * Bootstrap any application services.`


    ` */`


    `public function boot(): void`


    `{`


    `// Using class based composers`


    `Facades\View::composer(‘profile’, ProfileComposer::class);`


    `// Using closure based composers`


    `Facades\View::composer(‘cityPollution’, function (View $view) {`


    `// Code Logic`


    `});`


    `Facades\View::composer(‘introduction’, function (View $view) {`


    `// Code Logic`


    `});`


    `}`


    `}`


    The `compose` method of the `App\View\Composers\ProfileComposer` class now that
    the composer has been registered will be called.


    `<?php`


    `namespace App\View\Composers;`


    `use App\Repositories\UserRepository;`


    `use Illuminate\View\View;`


    `class ProfileComposer`


    `{`


    `/**`


    ` * Create a new profile composer.`


    ` */`


    `public function __construct(`


    `protected CityRepository $city,`


    `) {}`


    `/**`


    ` * Bind data to the view.`


    ` */`


    `public function compose(View $view): void`


    `{`


    `$view->with(‘count’, $this->city->count());`


    `}`


    `}`


    As you can see, the *service container* resolves all view composers, allowing
    you to type-hint any dependencies you require inside a composer’s constructor.


    # [Multiple Views with Composer](#toc.xhtml#s89a)


    By giving the composer method an array of views as the first argument, you can
    attach a view composer to several views at once:


    `use App\Views\Composers\MultiComposer;`


    `use Illuminate\Support\Facades\View;`


    `View::composer(`


    `[‘welcome’, ‘dashboard’],`


    `MultiComposer::class`


    `);`


    The \* character is also accepted by the composer method as a wildcard, enabling
    you to add a composer to all views:


    `use Illuminate\Support\Facades;`


    `use Illuminate\View\View;`


    `Facades\View::composer(‘*’, function (View $view) {`


    `// Code Logic`


    `});`


    # [View Creators](#toc.xhtml#s90a)


    Similar to view composers, view creators are executed as soon as the view is instantiated
    rather than waiting until the view is about to render. Use the `creator` method
    to register a view creator:


    `use App\View\Creators\ProfileCreator;`


    `use Illuminate\Support\Facades\View;`


    `View::creator(‘profile’, ProfileCreator::class);`


    The preceding code makes use of the `creator` method and registers a view creator.


    # [View Optimization](#toc.xhtml#s91a)


    Blade template views are by default compiled as needed. If a view is rendered
    by a request, Laravel will check to see if a compiled version of the view is available.


    In the event that the file is present, Laravel will ascertain whether the uncompiled
    view has undergone more recent changes than the compiled view. Laravel will recompile
    the view if the compiled view is either missing or the uncompiled view has been
    altered.


    Due to a potential slight performance hit from compiling views during the request,
    Laravel offers the `view:cache` Precompile all the views that your application
    uses with an artisan task.


    You might want to execute this command as part of your deployment procedure for
    improved performance:


    `php artisan view:cache`


    To clear the view cache:


    `php artisan view:clear`


    ![](images/Figure-3.7.jpg)


    **Figure 3.7:** View Optimization


    # [Conclusion](#toc.xhtml#s92a)


    Routers and views, two crucial components of web development, are the focus of
    this chapter of the book. At the beginning of the chapter, we covered the importance
    of routers and views in online applications as well as how Laravel makes use of
    both. There are several topics covered, including routers and views and their
    various types, strategies, and configurations.


    An overview of Laravel routers, the URLs that users used to access various web
    application capabilities, is provided at the beginning of the chapter. Then, we
    saw the basic syntax example for routing and explored how routers are used to
    fetch and transmit data into and out of the application.


    The next chapter will focus on building Controllers and Blade templates in Laravel.
    It will explain the importance of controllers and Blade in web development and
    how they are used in Laravel.


    # [Points to Remember](#toc.xhtml#s93a)


    *   The chapter explores the route files that define all Laravel routes, which
    are located in the routes directory. It describes the function of the `App\Providers\RouteServiceProvider`
    and how the route files are loaded automatically. It emphasizes that web interface
    routes, which offer features like CSRF protection and session state, are created
    in the `routes/web.php` file and belong to the web middleware group. The `routes/api.php`
    file defines stateless routes for the API, which are a part of the `api` middleware
    group.


    *   Then, the chapter explores router methods, which let programmers register
    routes that react to different HTTP verbs. When creating several routes with the
    same URI, it lists a number of common router methods and stresses the order in
    which they should be declared.


    *   The View section opens with an introduction to Laravel views and a discussion
    of how they help to render a web page’s HTML representation. It highlights how
    views enable developers to segregate the display logic from the business logic
    of the application, resulting in simpler and more readable code.


    *   The first subject discussed in this part is creating views. Views in Laravel
    are, by default, kept in the resources/views directory. It covers how to reference
    views in routes and controllers and goes through the process of generating a view
    file.'
