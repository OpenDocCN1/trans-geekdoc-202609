- fmt: "\n# CHAPTER 10\n\n# Deploying your Laravel App to Cloud\n\n## Introduction\n\
    In this chapter, we will learn how to deploy our Laravel application to the cloud\
    \ using cloud platform. We will cover the necessary steps and configurations to\
    \ deploy our app on cloud infrastructure, including cloud server setup, setting\
    \ up environment variables, uploading files, and creating databases. This chapter\
    \ covers Laravel Vapor in depth and uses references from the documentation at\
    \ `docs.vapor.build.`\n\n## Structure\nWe will cover the following topics in this\
    \ chapter:\n\n*   Cloud Deployment Fundamentals\n*   Cloud Providers Overview\n\
    \    *   Heroku\n    *   AWS\n    *   Google Cloud\n*   Laravel Application Deployment\
    \ with Vapor\n    *   Installation\n    *   Environment\n    *   Deployment\n"
