    \ FileHandler::class)\n```\n\nAdditionally, the resource controller can be pointed\
    \ to as:\n\n```\nRoute::resource(‘users’, UserController::class)\n```\n\n## Subdomain\
    \ Routing\n\nFor instances when you need to capture a part of the subdomain to\
