  trans: "\n让我们来看一个例子。要访问以下路由，你可以在浏览器中导航到 `[`example.com/ep1`](http://example.com/ep1)`。\n\
    \n```\nuse App\\Http\\Controllers\\UserController;\n```\n\n```php\nRoute::get(‘/ep1,\
    \ [UserController::class, ‘index’]);\n```\n\n# 路由器方法\n\n路由器允许程序员注册响应任何 HTTP 动词的路由。\n\
    \n![](img/Figure-3.2.jpg)\n\n**图 3.2:** 路由器方法\n\n在构建多个共享相同 URI 的路由时，`get`、`post`、`put`、`patch`、`delete`\
    \ 和 `options` 方法应该定义在 `any`、`match` 和 `redirect` 方法之前。这意味着适当路由将匹配到传入的请求。\n\n#\
    \ 路由器类型\n\nLaravel 中广泛使用了四种主要类型的路由器：\n\n*   重定向路由\n*   视图路由\n*   路由列表\n*   回退路由\n\
    \n![](img/Figure-3.3.jpg)\n\n**图 3.3:** 路由器类型\n\n# 重定向路由\n\n`Route::redirect`\
    \ 方法可用于定义重定向到另一个 URI 的路由。通过这种方法，你可以快速执行简单的重定向，而无需构建整个路由或控制器：\n\n```php\nRoute::redirect(‘/ep1’,\
    \ ‘/ep2’);\n```\n\n该路由也可以对状态码进行自定义定制：\n\n```php\nRoute::redirect(‘/ep1’, ‘/ep2’,\
    \ 301);\n```\n\n或者，可以使用 `Route::permanentRedirect` 方法来获取 301 状态码：\n\n```php\n\
    Route::permanentRedirect(‘/ep1’, ‘/ep2’);\n```\n\n# 视图路由\n\n如果你的路由只需要返回一个 `view`（视图），请使用\
    \ `Route::view` 方法。这种技术提供了一种快捷方式，使你不需要定义整个路由或控制器，类似于重定向方法。\n\n该视图方法接受两个参数：\n\n\
    1.  第一个是 URI\n2.  第二个是视图名称。\n\n作为可选的第三个参数，你还可以向视图提供一个数据数组：\n\n```php\nRoute::view(‘/about’,\
    \ ‘about’);\nRoute::view(‘/about’, ‘about’, [‘state’ => ‘Reader’]);\n```\n\n#\
    \ 路由列表\n\n`route:list` artisan 命令可以快速为你提供应用程序创建的所有路由的摘要。\n\n你可以通过向命令添加 `-v` 选项来告诉\
    \ Laravel 显示路由中间件：默认情况下，分配给每个路由的路由中间件不会显示在 `route:list` 的输出中。\n\n```bash\nphp\
    \ artisan route:list -v\n```\n\n在运行 `route:list` 时添加 `--except-vendor` 选项，你还可以指示\
    \ Laravel 隐藏任何路由。\n\n```bash\nphp artisan route:list --except-vendor\n```\n\n\
    同样，在执行路由时指定 `--only-vendor` 选项，你可以告诉 Laravel 只显示由第三方包创建的路由。\n\n```bash\nphp artisan\
    \ route:list --only-vendor\n```\n\n# 回退路由\n\n你可以使用 `Route::fallback` 函数提供一个在没有其他路由匹配传入请求时将会被遵循的路由。未处理的请求通常会导致你的应用程序的异常处理器渲染一个“404”页面。然而，`web`\
    \ 中间件组中的所有中间件都将应用到该路由，因为 `fallback` 路由通常定义在你的 `routes/web.php` 文件中。你可以根据需要用其他中间件来补充此路由：\n\
    \n```php\nRoute::fallback(function () {\n    // 代码逻辑\n});\n```\n\n# 路由参数\n\n路由参数必须包含在大括号中，并且应该只包含字母。在路由参数的名称中，也允许下划线（`_`）。\n\
    \n路由回调和控制器参数传递的顺序决定了路由参数注入的方式；参数的名称无关。\n\n如果你想让 Laravel 服务容器自动处理，请在依赖项之后列出你的路由参数：\n\
    \n```php\nuse Illuminate\\Http\\Request;\n\nRoute::get(‘/user/{num}’, function\
    \ (Request $request, string $num) {\n    return ‘User ‘.$num;\n});\n```\n\n# 可选参数\n\
    \n当没有其他路由匹配传入请求时，可以使用 `Route::fallback` 函数提供一个回退路由。通过在参数名后添加问号 `?`，你可以定义可选参数：\n\
    \n```php\nRoute::get(‘user/{name}’, function (string $name = 'Guest') {\n    return\
    \ $name;\n});\n\nRoute::get(‘/user/{name}’, function (string $name) {\n    return\
    \ $name;\n});\n```\n\n# 正则表达式\n\n通过 `where` 方法，你可以对路由进行限制：\n\n```php\nRoute::get(‘user/{id}’,\
    \ function (string $id) {\n    return $id;\n})->where('id', '[0-9]+');\n```\n"
