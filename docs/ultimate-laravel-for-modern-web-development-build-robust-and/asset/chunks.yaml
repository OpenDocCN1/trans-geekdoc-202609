    \ entity to control which channel an entity’s broadcast notifications are broadcast\
    \ on:\n\n`<?php`\n\n`namespace App\\Models;`\n\n`use Illuminate\\Broadcasting\\\
    PrivateChannel;`\n\n`use Illuminate\\Foundation\\Auth\\User as Authenticatable;`\n\
    \n`use Illuminate\\Notifications\\Notifiable;`\n\n`class User extends Authenticatable`\n\
    \n`{`\n\n`use Notifiable;`\n\n`public function receivesBroadcastNotificationsOn():\
    \ string`\n\n`{`\n\n`return ‘users.’.$this->id;`\n\n`}`\n\n`}`\n\n# [Notification\
    \ Events](#toc.xhtml#s264a)\n\nThe notification system dispatches the `Illuminate\\\
    Notifications\\Events\\NotificationSending` event when a notification is sent.\
    \ This holds the *notifiable* object as well as the notification instance. Listeners\
    \ for this event can be registered in your application’s `EventServiceProvider`:\n\
    \n`use App\\Listeners\\CheckNotificationStatus;`\n\n`use Illuminate\\Notifications\\\
    Events\\NotificationSending;`\n\n`protected $listen = [`\n\n`NotificationSending::class\
    \ => [`\n\n`CheckNotificationStatus::class,`\n\n` ],`\n\n`];`\n\nIf an event listener\
    \ for the `NotificationSending` event returns `false` from its `handle` function,\
    \ the notice will not be sent:\n\n`use Illuminate\\Notifications\\Events\\NotificationSending;`\n\
    \n`public function handle(NotificationSending $event): bool`\n\n`{`\n\n`return\
    \ false;`\n\n`}`\n\nYou may discover more about the notification recipient or\
    \ the notification itself by accessing the event’s notifiable, notification, and\
    \ channel attributes from inside an event listener:\n\n`public function handle(NotificationSending\
    \ $event): void`\n\n`{`\n\n`// $event->channel`\n\n`// $event->notifiable`\n\n\
    `// $event->notification`\n\n`}`\n\nWhen a notice is sent, the `IlluminateNotificationsEventsNotification`\
    \ object is created. The notification system sends out the sent event. This holds\
    \ the *notifiable* object as well as the notification instance. Listeners for\
    \ this event can be registered in your `EventServiceProvider`:\n\n`use App\\Listeners\\\
    LogNotification;`\n\n`use Illuminate\\Notifications\\Events\\NotificationSent;`\n\
    \n`protected $listen = [`\n\n`NotificationSent::class => [`\n\n`LogNotification::class,`\n\
    \n`],`\n\n`];`\n\nTo discover more about the notification recipient or the notification\
    \ itself, you may use an event listener to obtain the event’s notifiable, notification,\
    \ channel, and response properties:\n\n`public function handle(NotificationSent\
    \ $event): void`\n\n`{`\n\n`// $event->channel`\n\n`// $event->notifiable`\n\n\
    `// $event->notification`\n\n`// $event->response`\n\n`}`\n\n# [Conclusion](#toc.xhtml#s265a)\n\
    \nIn this chapter, we delved into the crucial aspects of leveraging e-mail and\
    \ notifications in Laravel, highlighting its usefulness in tracking application\
    \ performance and enabling effective communication with users. The chapter outlines\
    \ the key functionalities and processes involved in incorporating this feature\
    \ within the Laravel framework.\n\nThe chapter is structured into distinct sections,\
    \ covering the generation and dispatching of notifications, various delivery channels,\
    \ queuing and delaying notifications, as well as customizing the notification\
    \ queue and channel. Additionally, it addresses the utilization of on-demand notifications,\
    \ mail notifications, and the customization of email components through custom\
    \ templates, handling raw data, and incorporating tags and metadata. The chapter\
    \ also discusses broadcast notifications and the essential considerations associated\
    \ with notification events, providing valuable insights into their integration\
    \ within the Laravel ecosystem.\n\nBy offering a comprehensive overview of the\
    \ nuances and intricacies involved in implementing e-mail and notification functionalities,\
    \ this chapter equips developers with a deeper understanding of how to effectively\
    \ utilize these features within their Laravel applications. The practical insights\
    \ provided throughout the chapter empower developers to create robust and efficient\
    \ notification systems that enhance user engagement and interaction.\n\nIn the\
    \ next chapter, we will learn how to deploy our Laravel application to the cloud\
    \ using cloud platform.\n\n# [Points to Remember](#toc.xhtml#s266a)\n\n*   Notifications\
    \ in Laravel are represented by a single class, with each notification having\
    \ various methods like `toMail` or toDatabase to transform the notification into\
    \ specific message formats for different channels.\n\n*   Notifications can be\
    \ sent using the Notification facade or the notify method of the Notifiable trait.\
    \ You can send notifications to multiple notifiable entities using the send function.\n\
    \n*   Laravel supports various delivery channels, such as mail, database, broadcast,\
    \ Vonage, and Slack. You can determine the channels a notification should be sent\
    \ through by using the $notifiable instance.\n\n*   By implementing the `ShouldQueue`\
    \ interface and Queueable trait, notifications can be queued for improved application\
    \ response time. The `sendNow` method sends notifications immediately, even if\
    \ they implement the `ShouldQueue` interface.\n\n*   Notifications can be delayed\
    \ using the delay method, allowing you to set specific times for notification\
    \ delivery. You can set different delay times for different channels as well.\n\
    \n*   You can choose a specific queue connection for notifications by using the\
    \ `onConnection` function. Additionally, you can define the queue connection for\
    \ each notification channel using the `viaConnections` method.\n\n*   You can\
    \ specify the queue for each notification channel using the `viaQueues` method.\
    \ Be aware of potential conflicts between database transactions and queued notifications.\n\
    \n*   Using the route method from the message facade, you can send notifications\
    \ to recipients not registered as users in your application, providing ad-hoc\
    \ notification routing information.\n\n*   Customize the email components using\
    \ the `toMail` function, allowing you to define the structure of the email content.\
    \ You can also customize the sender’s address and utilize custom email templates\
    \ for rendering notifications.\n\n*   Leverage the view method to define custom\
    \ templates for rendering notification emails, enabling the creation of personalized\
    \ and visually appealing email notifications.\n\n*   Use the `attachData` and\
    \ attach methods to include attachments or raw data in email notifications, enhancing\
    \ the informational value and interactivity of the emails.\n\n*   Implement tags\
    \ and metadata in the email message to organize and monitor the emails sent by\
    \ the application, providing additional context and information for tracking and\
    \ management purposes.\n\n*   Use the `withSymfonyMessage` function to fully customize\
    \ the message before sending it, allowing for more granular control over the content\
    \ and structure of the email message.\n\n*   Implement the `toBroadcast` function\
    \ to send notifications over Laravel’s event broadcasting services, enabling real-time\
    \ communication with JavaScript-powered frontends.\n\n*   Utilize the `NotificationSending`\
    \ and `NotificationSent` events to monitor and manage notification activities,\
    \ providing an opportunity to intervene or gather additional information during\
    \ the notification sending process.\n\n# [CHAPTER 10](#toc.xhtml#c10)\n\n# [Deploying\
    \ your Laravel App to Cloud](#toc.xhtml#c10)\n\n# [Introduction](#toc.xhtml#s267a)\n\
    \nIn this chapter, we will learn how to deploy our Laravel application to the\
    \ cloud using cloud platform. We will cover the necessary steps and configurations\
    \ to deploy our app on cloud infrastructure, including cloud server setup, setting\
    \ up environment variables, uploading files, and creating databases. This chapter\
    \ covers Laravel Vapor in depth and uses references from the documentation at\
    \ `docs.vapor.build.`\n\n# [Structure](#toc.xhtml#s268a)\n\nWe will cover the\
    \ following topics in this chapter:\n\n*   Cloud Deployment Fundamentals\n\n*\
    \   Cloud Providers Overview \n\n    *   Heroku\n\n    *   AWS\n\n    *   Google\
    \ Cloud\n\n*   Laravel Application Deployment with Vapor \n\n    *   Installation\n\
    \n    *   Environment\n\n    *   Deployment"
