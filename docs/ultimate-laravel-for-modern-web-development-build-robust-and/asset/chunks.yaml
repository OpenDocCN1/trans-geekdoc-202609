  trans: "\n\n# 定义范围 (#toc.xhtml#s222a)\n\n在应用程序的 `App\\Providers\\AuthServiceProvider`\
    \ 类的 `boot` 方法中使用 `Passport::tokensCan` 函数，你可以指定 API 的范围（scopes）。`tokensCan` 方法可以使用一个包含范围名称和范围描述的数组。用户将在权限审批屏幕上看到范围的描述，你可以编写任何你喜欢的的内容：\n\
    \n```php\npublic function boot(): void\n{\n    Passport::tokensCan([\n       \
    \ ‘place-alarm’ => ‘Place alarm’,\n        ‘check-weather’ => ‘Check weather’,\n\
    \    ]);\n}\n```\n\n# 默认范围 (#toc.xhtml#s223a)\n\n你可以使用 `setDefaultScope` 函数来配置你的\
    \ Passport 服务器，以便在客户端未请求特定范围的情况下，为令牌附加默认范围。通常情况下，你应该在应用程序中 `App\\Providers\\AuthServiceProvider`\
    \ 类的 `boot` 方法中调用此函数：\n\n```php\nuse Laravel\\Passport\\Passport;\n\nPassport::tokensCan([\n\
    \    ‘place-alarm’ => ‘Place alarm’,\n    ‘check-weather’ => ‘Check weather’,\n\
    ]);\n\nPassport::setDefaultScope([\n    ‘check-weather’,\n    ‘place-alarm’,\n\
    ]);\n```\n\n### 分配给令牌\n\n客户应该使用 `scope` 查询字符串选项来指示它们在通过授权码模式寻求访问令牌时想要使用的范围。由空格分隔的范围列表应作为\
    \ `scope` 参数：\n\n```php\nRoute::get(‘/redirect’, function () {\n    $query = http_build_query([\n\
    \        ‘client_id’ => ‘client-id’,\n        ‘redirect_uri’ => ‘http://example1.com/callback’,\n\
    \        ‘response_type’ => ‘code’,\n        ‘scope’ => ‘place-alarm check-weather’,\n\
    \    ]);\n    return redirect(‘http://passport-app.test/oauth/authorize?’.$query);\n\
    });\n```\n\n在提供个人访问令牌时，所需的范围数组可以被作为 `App\\Models\\User` 模型的 `createToken` 函数的第二个参数：\n\
    \n```php\n$token = $user->createToken(‘My Token’, [‘place-alarm’])->accessToken;\n\
    ```\n\n# 检查范围 (#toc.xhtml#s224a)\n\n为了确认传入的请求是使用已授予特定范围的令牌进行身份验证的，Passport 提供了两个中间件组件。首先将以下中间件添加到你的\
    \ `app/Http/Kernel.php` 文件的 `$middlewareAliases` 中。\n\n```php\n‘scopes’ => \\\
    Laravel\\Passport\\Http\\Middleware\\CheckScopes::class,\n‘scope’ => \\Laravel\\\
    Passport\\Http\\Middleware\\CheckForAnyScope::class,\n```\n\n为了确保传入请求的访问令牌具有每一个指定的范围，可以将\
    \ `scopes` 中间件附加到路由上：\n\n```php\nRoute::get(‘/weather’, function () {\n    //Code\
    \ Logic\n})->middleware([‘auth:api’, ‘scopes:check-weather,place-alarm’]);\n```\n\
    \n为了确认传入请求的访问令牌至少包含指定范围中的一个，可以将 `scope` 中间件附加到路由上：\n\n```php\nRoute::get(‘/orders’,\
    \ function () {\n    //Code Logic\n})->middleware([‘auth:api’, ‘scope:check-weather,place-alarm’]);\n\
    ```\n\n在访问令牌认证的请求到达你的应用程序后，你仍然可以在已认证的 `App\\Models\\User` 实例上使用 `tokenCan` 方法来查看令牌是否具有指定的范围：\n\
    \n```php\nuse Illuminate\\Http\\Request;\n\nRoute::get(‘/alarms’, function (Request\
    \ $request) {\n    if ($request->user()->tokenCan(‘place-alarm’)) {\n        //\
    \ Code Logic\n    }\n});\n```\n\n# 结论 (#toc.xhtml#s225a)\n\n章节开头对 REST 和 API 的介绍强调了它们在构建现代应用程序中的重要性。随后是对资源、集合和嵌套连接的解释，以及如何使用\
    \ Laravel 将其付诸的示例。本章还强调了编写资源以及在资源响应中维护关系。\n\n对 Laravel Passport（一个用于 Laravel 应用程序的全面\
    \ OAuth2 服务器解决方案）的详尽解释是本章的主要内容之一。提供了访问令牌和令牌生存期的配置选项，并对安装和设置过程进行了详细说明。本章还涵盖了管理令牌范围和保护路由以提高安全性和访问控制等重要主题。\n\
    \n在下一章节中，我们将探讨 Laravel 应用程序的测试与调试。\n\n# 重点回顾 (#toc.xhtml#s226a)\n\n*   识别 REST\
    \ API 的基础及其在构建现代应用程序中的重要性。使用 Laravel 的层级关系、集合和资源来有效地处理数据。\n*   使用 Laravel 资源将模型数据转换为与\
    \ API 响应一致的数组。\n*   可以在资源响应中高效地维护资源之间的关系，使得在 API 结果中包含相关资源成为可能。在 Laravel 中，资源响应会自动封装在\
    \ ‘data’ 键中，但资源类的 `$wrap` 参数允许你提供自定义键。\n*   为了获得安全且有效的 OAuth2 服务器解决方案，请使用 Laravel\
    \ Passport。对于 Laravel 应用程序，Laravel Passport 提供了一个可靠的 OAuth2 服务器解决方案，保证了对 API 的安全访问。\n\
    *   令牌范围对于为 API 用户提供独特的权限至关重要。\n*   通过使用 Laravel Passport，客户端和服务器可以无缝通信。\n*  \
    \ 通过使用 Axios，客户端和服务器可以无缝通信。\n*   为了提高安全性和访问控制，请设置访问令牌和令牌生存期。\n\n"
- fmt: "\nLaravel autonomously switches the configuration environment to `testing`\
    \ when tests are executed due to the environment parameters specified within the\
    \ `phpunit.xml` file. Moreover, during the testing phase, Laravel configures the\
    \ session and cache to the `array` driver by default, ensuring no persistence\
    \ of session or cache data.\n\nIf you find the need for additional configuration\
    \ parameters within the `testing` environment, you have the option to create them.\
    \ You can establish these testing environment variables within your application’s\
    \ `phpunit.xml` file. However, before running your tests, it’s crucial to execute\
    \ the `config:clear` Artisan command in order to clear the configuration cache.\n\
    \n### `.env.testing` Environment File\n\nA `.env.testing` file can also be created\
    \ and placed in the project root. When running PHPUnit tests or using the `--env=testing`\
    \ option when executing Artisan commands, this file will be utilized in place\
    \ of the `.env` file.\n\n### `CreatesApplication` Trait\n\nThe base `TestCase`\
    \ class in your application is given the `CreatesApplication` trait that comes\
    \ with Laravel. The `createApplication` function in this trait bootstraps the\
    \ Laravel application prior to executing your tests. Certain features, like Laravel’s\
    \ parallel testing functionality, depend on this property, thus it’s crucial that\
    \ you keep it where it was.\n\n# Testing Lifecycle\n\nThe Testing lifecycle consists\
    \ of the various steps that should be performed when testing your Laravel Application.\
    \ The following diagram displays the stages in the Testing Lifecyle for Laravel\
    \ Applications.\n\n![](images/Figure-8.1.jpg)\n\n**Figure 8.1:** Laravel Application\
    \ Testing Lifecycle\n\n# Creating Tests\n\nUse the `make:test` Artisan command\
    \ to generate a new test case. Tests will by default be stored in the `tests/Feature`\
    \ directory:\n\n```bash\nphp artisan make:test SampleTest\n```\n\nTo create a\
    \ test within the `tests/Unit` folder directory, use the `–unit` option when executing\
    \ the `make:test` command:\n\n```bash\nphp artisan make:test SampleTest –unit\n\
    ```\n\nYou may provide the make command the `--pest` option if you want to construct\
    \ a PHP test called `make:test` command:\n\n```bash\nphp artisan make:test SampleTest\
    \ --pest\nphp artisan make:test SampleTest --unit --pest\n```\n\nAfter the test\
    \ has been produced, you may use PHPUnit to define test methods as usual. Use\
    \ the `vendor/bin/phpunit` or `php artisan test` command from your terminal to\
    \ begin running your tests:\n\n```php\n<?php\n\nnamespace Tests\\Unit;\n\nuse\
    \ PHPUnit\\Framework\\TestCase;\n\nclass Sampletest extends TestCase\n{\n    public\
    \ function test_basic_test(): void\n    {\n        $this->assertTrue(true);\n\
    \        //Logic of the test case\n    }\n}\n```\n\n# Running Tests\n\nIn order\
    \ to run a test, use the `phpunit` command:\n\n```bash\n./vendor/bin/phpunit\n\
    ```\n\nTo run your tests, you can also use the `test` Artisan command in addition\
    \ to the `phpunit` command. Verbose test results are provided by the Artisan test\
    \ runner to facilitate development and debugging:\n\n```bash\nphp artisan test\n\
    ```\n\nAny arguments that can be passed to the `phpunit` command may also be passed\
    \ to the `Artisan test` command:\n\n```bash\nphp artisan test --testsuite=Feature\
    \ --stop-on-failure\n```\n\n# Parallel Execution of Tests\n\nTypically, PHPUnit\
    \ and Laravel execute tests sequentially within a single process. Yet, opting\
    \ for concurrent test execution across multiple processes can substantially reduce\
    \ the overall testing time. To initiate this process, the initial step involves\
    \ installing the `brianium/paratest` Composer package as a `dev` dependency. Subsequently,\
    \ you can utilize the test Artisan command with the `--parallel` option enabled\
    \ to implement this approach.\n\n```bash\ncomposer require brianium/paratest --dev\n\
    php artisan test –-parallel\n```\n\nLaravel will by default start as many processes\
    \ as your computer’s available CPU cores. However, you may use the `--processes`\
    \ option to change the number of processes:\n\n```bash\nphp artisan test --parallel\
    \ --processes=2\n```\n\nLaravel handles the generation and migration of a test\
    \ database for each parallel test process, provided a primary database connection\
    \ has been configured. Each process is assigned a unique process token appended\
    \ to the test databases. For example, if there are two concurrent test processes,\
    \ Laravel will create and utilize test databases, including `your_db_test_1` and\
    \ `your_db_test_2`.\n\nBy default, the test databases remain persistent, potentially\
    \ carrying over data from previous test runs when invoking the `test` Artisan\
    \ command. However, you can use the `--recreate-databases` option to recreate\
    \ these databases as needed.\n\n```bash\nphp artisan test --parallel --recreate-databases\n\
    ```\n\nIn certain cases, it becomes necessary to configure specific resources\
    \ for your application’s tests, ensuring smooth accessibility for multiple test\
    \ processes.\n\nUsing the `ParallelTesting` facade, you can define code to be\
    \ executed during the `setUp` and `tearDown` of a process or test case. The specified\
    \ closures receive the `$token` and `$testCase` variables, which respectively\
    \ hold the process token and the active test case.\n\n```php\n<?php\n\nnamespace\
    \ App\\Providers;\n\nuse Illuminate\\Support\\Facades\\Artisan;\nuse Illuminate\\\
    Support\\Facades\\ParallelTesting;\nuse Illuminate\\Support\\ServiceProvider;\n\
    use PHPUnit\\Framework\\TestCase;\n\nclass AppServiceProvider extends ServiceProvider\n\
    {\n    public function boot(): void\n    {\n        ParallelTesting::setUpProcess(function\
    \ (int $token) {\n            // Set Up Logic\n        });\n\n        ParallelTesting::setUpTestCase(function\
    \ (int $token, TestCase $testCase) {\n            // Set Up Logic\n        });\n\
    \n        ParallelTesting::setUpDatabase(function (string $database, int $token)\
    \ {\n            Artisan::call('db:seed');\n            // Logic\n        });\n\
    \n        ParallelTesting::tearDownTestCase(function (int $token, TestCase $testCase)\
    \ {\n            // Tear Down Logic\n        });\n\n        ParallelTesting::tearDownProcess(function\
    \ (int $token) {\n            // Tear Down Logic\n        });\n    }\n}\n```\n\
    \nUse the `token` method to retrieve the current process token from different\
    \ places in the test code. The allocation of resources across concurrent test\
    \ processes is made possible by this different string that is exclusive to each\
    \ process. Laravel, for instance, automatically appends this token to the end\
    \ of the test databases that are produced by testing process.\n\n```php\n$token\
    \ = ParallelTesting::token();\n```\n\n# Reporting\n\nYou might wish to check how\
    \ much application code is utilized in your tests and whether your test cases\
    \ truly cover the application code when you run your application tests. You may\
    \ use the `--coverage` option in conjunction with the `test` command to achieve\
    \ this:\n\n```bash\nphp artisan test --coverage\n```\n\nTo provide a minimal test\
    \ coverage criterion for your application, use the `--min` option. If this threshold\
    \ is not reached, the test suite will fail:\n\n```bash\nphp artisan test --coverage\
    \ --min=80.3\n```\n\n**Profiling**\n\nOne handy feature of the Artisan test runner\
    \ is a way to get a list of the tests that take the longest in your application.\
    \ To get a list of your 10 slowest tests, run the `test` command with the `--profile`\
    \ option. This can help you quickly determine which tests need to be modified\
    \ in order to speed up your test suite:\n\n```bash\nphp artisan test --profile\n\
    ```\n\n# HTTP Tests\n\nA very smooth API is offered by Laravel for sending HTTP\
    \ queries to your application and receiving the results. Consider the feature\
    \ test described here, for instance:\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\
    \nuse Tests\\TestCase;\n\nclass ExampleTest extends TestCase\n{\n    public function\
    \ test_the_application_returns_a_successful_response(): void\n    {\n        $response\
    \ = $this->get('/');\n        $response->assertStatus(200);\n    }\n}\n```\n"
  raw: 'Laravel autonomously switches the configuration environment to `testing` when
    tests are executed due to the environment parameters specified within the `phpunit.xml`
    file. Moreover, during the testing phase, Laravel configures the session and cache
    to the `array` driver by default, ensuring no persistence of session or cache
    data.


    If you find the need for additional configuration parameters within the `testing`
    environment, you have the option to create them. You can establish these testing
    environment variables within your application’s `phpunit.xml` file. However, before
    running your tests, it’s crucial to execute the `config:clear` Artisan command
    in order to clear the configuration cache.


    `.env.testing` Environment File


    A `.env.testing` file can also be created and placed in the project root. When
    running PHPUnit tests or using the `--env=testing` option when executing Artisan
    commands, this file will be utilized in place of the `.env` file.


    `CreatesApplication` Trait


    The base `TestCase` class in your application is given the `CreatesApplication`
    trait that comes with Laravel. The `createApplication` function in this trait
    bootstraps the Laravel application prior to executing your tests. Certain features,
    like Laravel’s parallel testing functionality, depend on this property, thus it’s
    crucial that you keep it where it was.


    # [Testing Lifecycle](#toc.xhtml#s231a)


    The Testing lifecycle consists of the various steps that should be performed when
    testing your Laravel Application. The following diagram displays the stages in
    the Testing Lifecyle for Laravel Applications.


    ![](images/Figure-8.1.jpg)


    **Figure 8.1:** Laravel Application Testing Lifecycle


    # [Creating Tests](#toc.xhtml#s232a)


    Use the `make:test` Artisan command to generate a new test case. Tests will by
    default be stored in the `tests/Feature` directory:


    `php artisan make:test SampleTest`


    To create a test within the `tests/Unit` folder directory, use the `–unit` option
    when executing the `make:test` command:


    `php artisan make:test SampleTest –unit`


    You may provide the make command the `--pest` option if you want to construct
    a PHP test called `make:test` command:


    `php artisan make:test SampleTest --pest`


    `php artisan make:test SampleTest --unit --pest`


    After the test has been produced, you may use PHPUnit to define test methods as
    usual. Use the `vendor/bin/phpunit` or `php artisan test` command from your terminal
    to begin running your tests:


    `<?php`


    `namespace Tests\Unit;`


    `use PHPUnit\Framework\TestCase;`


    `class Sampletest extends TestCase`


    `{`


    `public function test_basic_test(): void`


    `{`


    `$this->assertTrue(true);`


    `//Logic of the test case`


    `}`


    `}`


    # [Running Tests](#toc.xhtml#s233a)


    In order to run a test, use the `phpunit command:`


    `./vendor/bin/phpunit`


    To run your tests, you can also use the `test Artisan` command in addition to
    the `phpunit` command. Verbose test results are provided by the Artisan test runner
    to facilitate development and debugging:


    `php artisan test`


    Any arguments that can be passed to the `phpunit` command may also be passed to
    the `Artisan test` command:


    `php artisan test --testsuite=Feature --stop-on-failure`


    # [Parallel Execution of Tests](#toc.xhtml#s234a)


    Typically, PHPUnit and Laravel execute tests sequentially within a single process.
    Yet, opting for concurrent test execution across multiple processes can substantially
    reduce the overall testing time. To initiate this process, the initial step involves
    installing the brianium/paratest Composer package as a `dev` dependency. Subsequently,
    you can utilize the test Artisan command with the` --parallel` option enabled
    to implement this approach.


    `composer require brianium/paratest --dev`


    `php artisan test –-parallel`


    Laravel will by default start as many processes as your computer’s available CPU
    cores. However, you may use the `--processes` option to change the number of processes:


    `php artisan test --parallel --processes=2`


    Laravel handles the generation and migration of a test database for each parallel
    test process, provided a primary database connection has been configured. Each
    process is assigned a unique process token appended to the test databases. For
    example, if there are two concurrent test processes, Laravel will create and utilize
    test databases, including `your_db_test_1` and `your_db_test_2`.


    By default, the test databases remain persistent, potentially carrying over data
    from previous test runs when invoking the `test` Artisan command. However, you
    can use the `--recreate-databases` option to recreate these databases as needed.


    `php artisan test --parallel --recreate-databases`


    In certain cases, it becomes necessary to configure specific resources for your
    application’s tests, ensuring smooth accessibility for multiple test processes.


    Using the `ParallelTesting` facade, you can define code to be executed during
    the `setUp` and `tearDown` of a process or test case. The specified closures receive
    the `$token` and `$testCase` variables, which respectively hold the process token
    and the active test case.


    `<?php`


    `namespace App\Providers;`


    `use Illuminate\Support\Facades\Artisan;`


    `use Illuminate\Support\Facades\ParallelTesting;`


    `use Illuminate\Support\ServiceProvider;`


    `use PHPUnit\Framework\TestCase;`


    `class AppServiceProvider extends ServiceProvider`


    `{`


    `public function boot(): void`


    `{`


    `ParallelTesting::setUpProcess(function (int $token) {`


    `// Set Up Logic`


    `});`


    `ParallelTesting::setUpTestCase(function (int $token, TestCase $testCase) {`


    `// Set Up Case Logic`


    `});`


    `ParallelTesting::setUpTestDatabase(function (string $database, int $token) {`


    `Artisan::call(‘db:seed’);`


    `// Logic`


    `});`


    `ParallelTesting::tearDownTestCase(function (int $token, TestCase $testCase) {`


    `// Tear Down Logic`


    `});`


    `ParallelTesting::tearDownProcess(function (int $token) {`


    `// Tear Down Process Logic`


    `});`


    `}`


    `}`


    Use the token method to retrieve the current parallel process token from different
    places in the test code of your application. The allocation of resources across
    concurrent test processes is made possible by this different string identification
    that is exclusive to each test process. Laravel, for instance, automatically appends
    this token to the end of the test databases that are produced by each testing
    process running in parallel.


    `$token = ParallelTesting::token();`


    # [Reporting](#toc.xhtml#s235a)


    You might wish to check how much application code is utilized in your tests and
    whether your test cases truly cover the application code when you run your application
    tests. You may use the `--coverage` option in conjunction with the `test` command
    to achieve this:


    `php artisan test --coverage`


    To provide a minimal test coverage criterion for your application, use the `--min`
    option. If this threshold is not reached, the test suite will fail:


    `php artisan test --coverage --min=80.3`


    **Profiling**


    One handy feature of the Artisan test runner is a way to get a list of the tests
    that take the longest in your application. To get a list of your 10 slowest tests,
    run the `test` command with the `--profile` option. This can help you quickly
    determine which tests need to be modified in order to speed up your test suite:


    `php artisan test -–profile`


    # [HTTP Tests](#toc.xhtml#s236a)


    A very smooth API is offered by Laravel for sending HTTP queries to your application
    and receiving the results. Consider the feature test described here, for instance:


    `<?php`


    `namespace Tests\Feature;`


    `use Tests\TestCase;`


    `class ExampleTest extends TestCase`


    `{`


    `public function test_the_application_returns_a_successful_response(): void`


    `{`


    `$response = $this->get(‘/’);`


    `$response->assertStatus(200);`


    `}`


    `}`'
