  trans: "\n\n# Once 指令 (#toc.xhtml#s112a)\n\n你可以使用 `@once` 指令提供一段在每个渲染周期中仅评估一次的模板部分。这可能有助于利用栈（stacks）将特定的\
    \ JavaScript 代码推送到页面的头部（header）。\n\n![](img/Figure-4.6.jpg)\n\n**图 4.6:** Laravel\
    \ 中的 Once 指令和辅助指令\n\n例如，如果你在反复渲染某个组件，你可能只想在第一次时将 JavaScript 推送到头部：\n\n```php\n\
    @once\n@push(‘scripts’)\n<script>\n// 自定义 JavaScript 脚本\n</script>\n@endpush\n\
    \n@endonce\n```\n\n为了方便起见，我们包含了 `@pushOnce` 和 `@prependOnce` 指令，因为 `@once` 指令经常与\
    \ `@push` 或 `@prepend` 指令配合使用：\n\n```php\n@pushOnce(‘scripts’)\n<script>\n// 自定义\
    \ JavaScript 脚本\n</script>\n@endPushOnce\n```\n\n# Blade 作为 Laravel 的模板引擎 (#toc.xhtml#s113a)\n\
    \nLaravel 自带了一个简单且高效的模板引擎称为 Blade。与几种 PHP 模板引擎不同，Blade 不会阻止你在模板中使用原始 PHP 代码。实际上，Blade\
    \ 几乎没有为你的应用增加成本，因为所有模板都会被转换为普通的 PHP 代码并缓存，直到它们更新。Blade 模板文件通常位于 `resources/views`\
    \ 目录，并具有 `.blade.php` 文件扩展名。\n\n使用全局 `view` 辅助函数，可以从路由（routes）或控制器（controllers）获取\
    \ Blade 视图。此外，可以通过视图辅助函数的第二个参数向 Blade 视图传递数据，如视图文档中所解释的：\n\n```php\nRoute::get(‘/’,\
    \ function () {\n    return view(‘welcome’, [‘name’ => ‘ABC’]);\n});\n```\n\n\
    # Blade 中的数据 (#toc.xhtml#s114a)\n\n通过将变量放在大括号中，可以显示提供给 Blade 视图的数据。例如，考虑以下路由：\n\
    \n```php\nRoute::get(‘/’, function () {\n    return view(‘welcome’, [‘name’ =>\
    \ ‘ABC’]);\n});\n```\n\n为了内联显示变量的内容，请使用双大括号：`{{variable_name}}`\n\n对于前面的示例，它将是：\n\
    \n```text\nWelcome, {{name}}\n```\n\n# HTML 实体编码 (#toc.xhtml#s115a)\n\nBlade 和\
    \ Laravel 辅助函数默认会对 HTML 实体进行双重编码。从 `AppServiceProvider` 的 `boot` 方法中调用 `Blade::withoutDoubleEncoding`\
    \ 函数来停止双重编码：\n\n```php\n<?php\n\nnamespace App\\Providers;\n\nuse Illuminate\\\
    Support\\Facades\\Blade;\nuse Illuminate\\Support\\ServiceProvider;\n\nclass AppServiceProvider\
    \ extends ServiceProvider\n{\n    /*\n    * 引导任何应用服务。\n    */\n    public function\
    \ boot(): void\n    {\n        Blade::withoutDoubleEncoding();\n    }\n}\n```\n\
    \n# 组件 (#toc.xhtml#s116a)\n\n区块、布局和包含都具有类似的优势；尽管如此，有些人可能觉得认为组件和插槽（slots）的模型更容易理解。基于类的组件和匿名组件是编写组件的两种方法。\n\
    \n你可以使用 `make:component` Artisan 命令来构建基于类的组件。我们将创建一个 `Alert` 组件来演示如何使用组件。该组件将使用\
    \ `make:component` 命令放在 `app/View/Components` 目录：\n\n```bash\nphp artisan make:component\
    \ Alert\n```\n\n使用 `make:component` 命令也会为组件生成一个视图模板。`resources/views/components`\
    \ 目录将存放该视图。为自己的应用创建组件时，通常不需要额外注册组件，因为它们会立即被 `resources/views/components` 目录和 `app/View/Components`\
    \ 目录：\n\n```bash\nphp artisan make:component Forms/Input\n```\n\n上述命令将视图放在 `resources/views/components/forms`\
    \ 目录，并将 `Input` 组件放在 `app/View/Components/Forms` 目录。\n\n如果你在使用 `make:controller`\
    \ 时使用 `--view` 选项来构建一个匿名组件（即仅带有 Blade 模板而没有类的组件）：\n\n```bash\nphp artisan make:component\
    \ forms.input --view\n```\n\n该命令将在 `resources/views/components/forms` 目录下创建一个\
    \ `input.blade.php` 文件，该文件可以通过 `<x-forms.input />` 作为组件渲染。\n\n# 渲染组件 (#toc.xhtml#s117a)\n\
    \n你可以在一个 Blade 模板内部使用 Blade 组件标签来显示组件。Blade 组件标签以字母 `x-` 和组件类的短横线命名法（kebab case）名称开头：\n\
    \n例如：\n\n```html\n<x-alert/>\n<x-user-profile/>\n```\n\n如果组件类进一步嵌套在 `app/View/Components`\
    \ 目录中，使用字符 `.` 表示目录嵌套。例如，如果我们认为一个组件位于 `app/View/Components/Inputs/Button.php`，我们可以这样渲染它：\n\
    \n```html\n<x-inputs.button/>\n```\n\n你可以向你的组件类添加一个 `shouldRender` 函数来条件地渲染你的组件。如果\
    \ `shouldRender` 函数返回 `false`，则组件不会被渲染：\n\n```php\nuse Illuminate\\Support\\Str;\n\
    \n/*\n* 组件是否应该被渲染\n*/\npublic function shouldRender(): bool\n{\n    return Str::length($this->message)\
    \ > 0;\n}\n```\n\n# 传递数据 (#toc.xhtml#s18a)\n\n通过 HTML 属性，你可以向组件提供数据。简单的 HTML 字符串可以用于组件：\n\
    \n`<x-alert type=\"error\" :message=\"$message\"/>`\n\n组件的构造函数应包含：\n\n```php\n\
    <?php\n\nnamespace App\\View\\Components;\n\nuse Illuminate\\View\\Component;\n\
    use Illuminate\\View\\View;\n\nclass Alert extends Component\n{\n    /*\n    *\
    \ 组件实例。\n    */\n    public function __construct(\n        public string $type,\n\
    \        public string $message\n    ) {}\n\n    /*\n    * 获取表示组件的视图。\n    */\n\
    \    public function render(): View\n    {\n        return view('components.alert');\n\
    \    }\n}\n```\n\n显示组件的内容，显示值如下：\n\n```html\n<div class=\"alert-{{ $type }}\"\
    >\n    {{ $message }}\n</div>\n```\n\n# 布局 (#toc.xhtml#s19a)\n\n大多数 Web 应用具有相同的整体布局。如果在创建每个视图时复制完整的布局\
    \ HTML，将非常耗时且难以维护程序。我们可以将此布局指定为单个 Blade 组件并在应用程序的其他部分使用：\n\n```html\n<!-- resources/views/components/layout.blade.php\
    \ -->\n<html>\n<head>\n    <title>{{ $title ?? 'Grocery List' }}</title>\n</head>\n\
    <body>\n    <h1>Things to Buy</h1>\n    <hr/>\n    {{ $item }}\n</body>\n</html>\n\
    ```\n\n在我们定义 `layout` 组件后，可以创建一个使用该组件的 Blade 视图。\n\n例如，在示例中，我们将创建一个显示任务列表的简单视图：\n\
    \n```html\n<!-- resources/views/product.blade.php -->\n<x-layout>\n    @foreach\
    \ ($products as $product)\n        {{ $product }}\n    @endforeach\n</x-layout>\n\
    ```\n\n# 模板继承 (#toc.xhtml#s120a)\n\n此外，**模板继承**也可用于布局。在组件出现之前，这是应用开发的主要方法。\n\n"
- fmt: "\nLet’s start by looking at a straightforward example. We’ll look at a page\
    \ layout first. It is simple to specify this style as a single Blade view because\
    \ the majority of web applications keep the same overall layout across many pages:\n\
    \n```html\n<!-- resources/views/layouts/app.blade.php -->\n<html>\n<head>\n  \
    \  <title>App Name - @yield('title')</title>\n</head>\n<body>\n    @section('sidebar')\n\
    \    This is the master sidebar.\n    @show\n    <div class=\"container\">\n \
    \       @yield('content')\n    </div>\n</body>\n</html>\n```\n\nThis file has\
    \ normal HTML markup, as you can see. However, pay attention to the `@section`\
    \ and `@yield` directives. The `@yield` directive is used to show the contents\
    \ of a specific section, whereas the `@section` directive, as its name suggests,\
    \ defines a section of material.\n\n## Rendering Blade Templates\n\nIt may occasionally\
    \ be necessary to convert a raw Blade template string into proper HTML. This may\
    \ be done by utilizing the `Blade` facade’s `render` method. The Blade template\
    \ string and an optional array of data to feed the template are both accepted\
    \ by the `render` method:\n\n```php\nuse Illuminate\\Support\\Facades\\Blade;\n\
    return Blade::render('Welcome, {{ $name }}', ['name' => 'ABC']);\n```\n\nBy writing\
    \ the inline Blade templates to the `storage/framework/views` directory, Laravel\
    \ renders them. You may provide the function the `deleteCachedView` argument if\
    \ you want Laravel to delete these temporary files after rendering the Blade template:\n\
    \n```php\nreturn Blade::render(\n    'Welcome, {{ $name }}',\n    ['name' => 'ABC'],\n\
    \    deleteCachedView: true\n);\n```\n\n## Rendering Blade Fragments\n\nIt may\
    \ occasionally be necessary to just return a piece of a Blade template within\
    \ your HTTP response when utilizing frontend frameworks like Turbo and htmx. You\
    \ may achieve it by using blade fragments. Place a section of your Blade template\
    \ inside the `@fragment` and `@endfragment` directives to get started:\n\n```html\n\
    @fragment('employee-list')\n<ul>\n    @foreach ($employees as $employee)\n   \
    \     <li>{{ $employee->name }}</li>\n    @endforeach\n</ul>\n@endfragment\n```\n\
    \nThen, you can use the `fragment` method to specify that just the given fragment\
    \ should be included in the outgoing HTTP response when displaying the view that\
    \ makes use of this template:\n\n```php\nreturn view('homepage', ['employee' =>\
    \ $employees])->fragment('employee-list');\n```\n\nBy using the `fragmentIf` method,\
    \ you may conditionally return a view fragment based on a specified condition.\
    \ In such a case, the whole view will be returned:\n\n```php\nreturn view('homepage',\
    \ ['employees' => $employees])\n    ->fragmentIf($request->hasHeader('HX-Request'),\
    \ 'employee-list');\n```\n\nThe two methods – `fragments` and `fragmentIf` – enable\
    \ to return multiple view fragments in the response. For example:\n\n```php\n\
    view('homepage', ['employees' => $employee])\n    ->fragments(['employee-list',\
    \ 'task-list']);\n\nview('homepage', ['employees' => $employees])\n    ->fragmentsIf(\n\
    \        $request->hasHeader('HX-Request'),\n        ['employee-list', 'task-list']\n\
    \    );\n```\n\n## Conclusion\n\nIn this chapter, we explored the essential components\
    \ of Laravel web development - Controllers and Blade templates. Controllers are\
    \ important in the MVC architecture as they group the functionality of routes.\
    \ We discussed how to create controllers using the Artisan command and how to\
    \ manage actions for specific resources.\n\nIn the next chapter, we will delve\
    \ into Eloquent and Query Builder in Laravel, which are essential for database\
    \ operations. The upcoming chapter will also cover how to perform common Eloquent\
    \ operations applied to the database using query builders.\n\n## Points to Remember\n\
    \n- Resource Controllers provide a convenient way to handle CRUD operations for\
    \ multiple resources in an application, which is generated using the `make:controller`\
    \ command. Routes are defined for resource controllers.\n- Constructor injection\
    \ and method injection, where dependencies are automatically resolved and injected\
    \ into controller instances, providing clean and organized code.\n- Redirects\
    \ in Laravel are responses that send the user to a different URL. There are various\
    \ ways to create redirects, including the Redirect Helper, named routes, and controller\
    \ actions. Additionally, flashing session data is utilized for displaying success\
    \ messages or preserving input data during redirects.\n- Directives in Blade templates\
    \ are instructions that execute specific logic or actions in the view. There are\
    \ various types, including conditional directives, switch directives, and authentication\
    \ directives like `@auth` and `@guest`, which help in managing user authentication\
    \ in views.\n- Loop directives in Blade, including `@for`, `@foreach`, `@forelse`,\
    \ and `@while`, enable efficient handling of repetitive tasks and data display.\
    \ The `@continue` and `@break` are used to skip iterations or exit loops when\
    \ certain conditions are met.\n- The `@once` directive allows a section of the\
    \ template to be evaluated only once during rendering, which is useful for pushing\
    \ specific content like JavaScript scripts to the header.\n- Blade as a template\
    \ engine in Laravel provides a clean and expressive way to create views with its\
    \ mix of PHP and HTML. Components and layouts help in maintaining consistent designs\
    \ across the application, making the code more modular and reusable.\n\n# CHAPTER\
    \ 5: Working with Eloquent ORM and Query Builder\n\n### Introduction\n\nThis chapter\
    \ covers Eloquent and Query Builder in Laravel, which are essential for database\
    \ operations. It explains the importance of Eloquent and Query Builder in web\
    \ development building robust and efficient applications.\n\n### Structure\n\n\
    In this chapter, the following topics will be covered:\n\n- Eloquent in Laravel\n\
    \    - Conventions\n    - Eloquent Events\n- Query Builder in Laravel\n    - Selects\n\
    \    - Joins\n    - Advanced Where\n    - Aggregates\n    - Raw Expressions\n\
    \    - Pessimistic Locking\n    - Caching Queries\n- Eloquent Operations\n   \
    \ - Model Classes\n    - Model Conventions\n    - Retrieving Models\n    - CRUD\
    \ Operations on Models\n    - Events\n\n### Eloquent in Laravel\n\nEloquent, an\
    \ object-relational mapper (ORM) that makes it simple and accessible to interface\
    \ with the application database, is a component of Laravel. Each database table\
    \ in Eloquent has a matching Model that is used to communicate with the table.\
    \ Eloquent models have the operations of inserting, editing, and removing records\
    \ from the database table in addition to fetching them.\n\nThe `Illuminate\\Database\\\
    Eloquent\\Model` class is generally extended with models, which are normally located\
    \ in the `app\\Models` directory. To create a new model, use the `make:model`\
    \ Artisan command:\n\n```bash\nphp artisan make:model Car\n```\n\nWhen creating\
    \ a new model and there is a requirement to generate a database migration, use\
    \ the `--migration` or `-m` option.\n\nWhen creating a model, you can also create\
    \ different classes such as factories, seeders, policies, controllers, and form\
    \ requests. Additionally, by combining these choices, it is possible to create\
    \ numerous classes at once:\n\n#### Generate a model and a CarFactory class\n\n\
    ```bash\nphp artisan make:model Car --factory\nphp artisan make:model Car -f\n\
    ```\n*A factory is a way to define the structure and attributes of data that can\
    \ be used for testing and database seeding.*\n\n#### Generate a model and a CarSeeder\
    \ class\n\n```bash\nphp artisan make:model Car --seed\nphp artisan make:model\
    \ Car -s\n```\n\n#### Generate a model and a CarController class\n\n```bash\n\
    php artisan make:model Car --controller\nphp artisan make:model Car -c\n```\n"
  raw: "Let’s start by looking at a straightforward example. We’ll look at a page\
    \ layout first. It is simple to specify this style as a single Blade view because\
    \ the majority of web applications keep the same overall layout across many pages:\n\
    \n`<!-- resources/views/layouts/app.blade.php -->`\n\n`<html>`\n\n`<head>`\n\n\
    `<title>App Name - @yield(‘title’)</title>`\n\n`</head>`\n\n`<body>`\n\n`@section(‘sidebar’)`\n\
    \n`This is the master sidebar.`\n\n`@show`\n\n`<div class=”container”>`\n\n`@yield(‘content’)`\n\
    \n`</div>`\n\n`</body>`\n\n`</html>`\n\nThis file has normal HTML markup, as you\
    \ can see. However, pay attention to the `@section` and `@yield` directives. The\
    \ `@yield` directive is used to show the contents of a specific section, whereas\
    \ the `@section` directive, as its name suggests, defines a section of material.\n\
    \n# [Rendering Blade Templates](#toc.xhtml#s121a)\n\nIt may occasionally be necessary\
    \ to convert a raw Blade template string into proper HTML. This may be done by\
    \ utilizing the `Blade` facade’s `render` method. The Blade template string and\
    \ an optional array of data to feed the template are both accepted by the `render`\
    \ method:\n\n`use Illuminate\\Support\\Facades\\Blade;`\n\n`return Blade::render(‘Welcome,\
    \ {{ $name }}’, [‘name’ => ‘ABC’]);`\n\nBy writing the inline Blade templates\
    \ to the `storage/framework/views` directory, Laravel renders them. You may provide\
    \ the function the `deleteCachedView` argument if you want Laravel to delete these\
    \ temporary files after rendering the Blade template:\n\n`return Blade::render(`\n\
    \n`‘Welcome, {{ $name }}’,`\n\n`[‘name’ => ‘ABC’],`\n\n`deleteCachedView: true`\n\
    \n`);`\n\n# [Rendering Blade Fragments](#toc.xhtml#s122a)\n\nIt may occasionally\
    \ be necessary to just return a piece of a Blade template within your HTTP response\
    \ when utilizing frontend frameworks like Turbo and htmx. You may achieve it by\
    \ using blade **fragments**. Place a section of your Blade template inside the\
    \ `@fragment` and `@endfragment` directives to get started:\n\n`@fragment(‘employee-list’)`\n\
    \n`<ul>`\n\n`@foreach ($employees as $employee)`\n\n`<li>{{ $employee->name }}</li>`\n\
    \n`@endforeach`\n\n`</ul>`\n\n`@endfragment`\n\nThen, you can use the `fragment`\
    \ method to specify that just the given fragment should be included in the outgoing\
    \ HTTP response when displaying the view that makes use of this template:\n\n\
    `return view(‘homepage’, [‘employee’ => $employees])->fragment(‘employee-list’);`\n\
    \nBy using the `fragmentIf` method, you may conditionally return a view fragment\
    \ based on a specified condition. In such a case, the whole view will be returned:\n\
    \n`return view(‘homepage’, [‘employees’ => $employees])`\n\n`->fragmentIf($request->hasHeader(‘HX-Request’),\
    \ ‘employee-list’);`\n\nThe two methods – `fragments` and `fragmentIf` – enable\
    \ to return multiple view fragments in the response. For example:\n\n`view(‘homepage’,\
    \ [‘employees’ => $employee])`\n\n`->fragments([‘employee-list’, ‘task-list’]);`\n\
    \n`view(‘homepage’ [‘employees’ => $employees])`\n\n`->fragmentsIf(`\n\n`$request->hasHeader(‘HX-Request’),`\n\
    \n`[‘employee-list’, ‘task-list’]`\n\n`);`\n\n# [Conclusion](#toc.xhtml#s123a)\n\
    \nIn this chapter, we explored the essential components of Laravel web development\
    \ - Controllers and Blade templates. Controllers are important in the MVC architecture\
    \ as they group the functionality of routes. We discussed how to create controllers\
    \ using the Artisan command and how to manage actions for specific resources.\n\
    \nIn the next chapter, we will delve into Eloquent and Query Builder in Laravel,\
    \ which are essential for database operations. The upcoming chapter will also\
    \ cover how to perform common Eloquent operations applied to the database using\
    \ query builders.\n\n# [Points to Remember](#toc.xhtml#s124a)\n\n*   Resource\
    \ Controllers provide a convenient way to handle CRUD operations for multiple\
    \ resources in an application, which is generated using the `make:controller`\
    \ command. Routes are defined for resource controllers.\n\n*   Constructor injection\
    \ and method injection, where dependencies are automatically resolved and injected\
    \ into controller instances, providing clean and organized code.\n\n*   Redirects\
    \ in Laravel are responses that send the user to a different URL. There are various\
    \ ways to create redirects, including the Redirect Helper, named routes, and controller\
    \ actions. Additionally, flashing session data is utilized for displaying success\
    \ messages or preserving input data during redirects.\n\n*   Directives in Blade\
    \ templates are instructions that execute specific logic or actions in the view.\
    \ There are various types, including conditional directives, switch directives,\
    \ and authentication directives like `@auth` and `@guest`, which help in managing\
    \ user authentication in views.\n\n*   Loop directives in Blade, including `@for`,\
    \ `@foreach`, `@forelse`, and `@while`, enable efficient handling of repetitive\
    \ tasks and data display. The `@continue` and `@break` are used to skip iterations\
    \ or exit loops when certain conditions are met.\n\n*   The `@once` directive\
    \ allows a section of the template to be evaluated only once during rendering,\
    \ which is useful for pushing specific content like JavaScript scripts to the\
    \ header.\n\n*   Blade as a template engine in Laravel provides a clean and expressive\
    \ way to create views with its mix of PHP and HTML. Components and layouts help\
    \ in maintaining consistent designs across the application, making the code more\
    \ modular and reusable.\n\n*   A comprehensive understanding of controllers and\
    \ Blade templates in Laravel, equipping with essential tools fosr building robust\
    \ and efficient web applications.\n\n# [CHAPTER 5](#toc.xhtml#c05)\n\n# [Working\
    \ with Eloquent ORM and Query Builder](#toc.xhtml#c05)\n\n# [Introduction](#toc.xhtml#s125a)\n\
    \nThis chapter covers Eloquent and Query Builder in Laravel, which are essential\
    \ for database operations. It explains the importance of Eloquent and Query Builder\
    \ in web development and how they are used in Laravel. The chapter also discusses\
    \ how to perform common Eloquent operations applied to the database using query\
    \ builders.\n\n# [Structure](#toc.xhtml#s126a)\n\nIn this chapter, the following\
    \ topics will be covered:\n\n*   Eloquent in Laravel \n\n    *   Conventions\n\
    \n*   Eloquent Events\n\n*   Query Builder in Laravel \n\n    *   Selects\n\n\
    \    *   Joins\n\n    *   Advanced Where\n\n    *   Aggregates\n\n    *   Raw\
    \ Expressions\n\n    *   Pessimistic Locking\n\n    *   Caching Queries\n\n* \
    \  Eloquent Operations \n\n    *   Model Classes\n\n    *   Model Conventions\n\
    \n    *   Retrieving Models\n\n    *   CRUD Operations on Models\n\n    *   Events\n\
    \n# [Eloquent in Laravel](#toc.xhtml#s127a)\n\nEloquent, an object-relational\
    \ mapper (ORM) that makes it simple and accessible to interface with the application\
    \ database, is a component of Laravel. Each database table in Eloquent has a matching\
    \ **Model** that is used to communicate with the table. Eloquent models have the\
    \ operations of inserting, editing, and removing records from the database table\
    \ in addition to fetching them.\n\nThe `Illuminate\\Database\\Eloquent\\Model`\
    \ class is generally extended with models, which are normally located in the `app\\\
    Models` directory. To create a new model, use the `make:model` Artisan command:\n\
    \n`php artisan make:model Car`\n\nWhen creating a new model and there is a requirement\
    \ to generate a database migration, use the `--migration` or `-m` option.\n\n\
    When creating a model, you can also create different classes such as factories,\
    \ seeders, policies, controllers, and form requests. Additionally, by combining\
    \ these choices, it is possible to create numerous classes at once:\n\n`# Generate\
    \ a model and a CarFactory class`\n\n`php artisan make:model Car --factory`\n\n\
    `php artisan make:model Car -f`\n\n*A factory is a way to define the structure\
    \ and attributes of data that can be used for testing and database seeding.*\n\
    \n`# Generate a model and a CarSeeder class`\n\n`php artisan make:model Car --seed`\n\
    \n`php artisan make:model Car -s`\n\n`# Generate a model and a CarController class`\n\
    \n`php artisan make:model Car --controller`\n\n`php artisan make:model Car -c`"
