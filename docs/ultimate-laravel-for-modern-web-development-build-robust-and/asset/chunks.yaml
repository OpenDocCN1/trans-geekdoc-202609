  trans: "\n\n*   本章节将检查 Laravel 提供的各种视图类型。文中讨论了 Laravel 的默认模板引擎 `Blade Views`。它提供了条件语句和循环等功能，并包含了可重用的代码段。\n\
    \n*   对于偏好使用原生 PHP 代码编写的开发者，本章节还强调了原生 PHP 视图的可用性。“数据与视图”部分将涵盖如何从控制器向视图传递数据。该部分将解释如何使用该方法和\
    \ `compact` 函数向视图提供数据，使用户能够根据提供的数据显示动态内容。\n\n*   随后，作为一种在不同视图之间传输数据或对视图执行操作的手段，文中提供了视图组合器（view\
    \ composers）和视图创建器（view creators）。视图组合器是在特定视图生成时执行的回调函数，允许与视图共享数据。另一方面，视图创建器允许编程人员在视图生成之前采取操作。\n\
    \n# 第 4 章\n\n# 构建控制器和 Blade 模板\n\n# 引言\n\n本章介绍了 Laravel 中的控制器和 Blade，它们是 Web 开发中的关键组件。它将解释控制器和\
    \ Blade 在 Web 开发中的重要性以及它们在 Laravel 中如何使用。本章还将讨论如何将控制器与视图、重定向、指令以及将 Blade 作为模板引擎使用。\n\
    \n# 结构\n\n在本章中，我们将讨论以下主题：\n\n*   Laravel 中的控制器与视图\n    *   控制器\n    *   资源控制器\n\
    \    *   构造函数注入\n    *   方法注入\n*   Laravel 中的重定向\n    *   重定向辅助函数\n    *   重定向到具名路由\n\
    \    *   重定向到控制器动作\n*   Laravel 中的指令\n    *   条件指令\n    *   Switch 指令\n    * \
    \  Auth 指令\n    *   循环\n    *   Once 指令\n*   Laravel 作为模板引擎的 Blade\n    *   Blade\
    \ 中的数据\n    *   HTML 实体编码\n    *   组件\n        *   渲染组件\n        *   传递数据\n  \
    \  *   布局\n    *   渲染 Blade 模板\n    *   渲染 Blade 片段\n\n# Laravel 中的控制器与视图\n\n\
    MVC 架构中的控制器仅仅是将一个或多个路由的功能组合在一起的类。特别是，如果你的应用程序是按照传统的 CRUD 方式组织的，控制器更倾向于将相关的路由组合在一起。\n\
    \n一种良好的编码和应用程序开发实践是根据模型-视图-控制器（MVC）逻辑来分离应用程序逻辑。将所有逻辑都放在控制器中可能会感觉更容易，但这将偏离 MVC\
    \ 架构的初衷和意图。\n\n控制器可以管理在特定资源上可以执行的所有操作，例如：\n\nCRUD – 创建、读取、更新、删除\n\n# 控制器\n\nArtisan\
    \ 命令 `make:controller` 用于快速创建新的控制器，`app/Http/Controllers` 目录是存放 Laravel 应用控制器的默认位置。\n\
    \n例如：\n\n```bash\nphp artisan make:controller UserController\n```\n\n使用控制器语法，让我们来看下面的示例，如何在\
    \ Laravel 中创建一个控制器：\n\n```php\n<?php\n\nnamespace App\\Http\\Controllers;\n\n\
    use App\\Models\\User;\nuse Illuminate\\View\\View;\n\nclass UserController extends\
    \ Controller\n{\n    /**\n     * 显示指定的资源。\n     */\n    public function show(string\
    \ $id): View\n    {\n        return view('user.show', [\n            'user' =>\
    \ User::findOrFail($id),\n        ]);\n    }\n}\n```\n\n# 资源控制器\n\n使用 `resource`\
    \ 方法在一行中定义控制器的所有 CRUD 路由是常见的。为了快速完成此操作，请配合 `--resource` 标记使用 `make:controller`\
    \ 命令：\n\n```bash\nphp artisan make:controller UserController --resource\n```\n\
    \n生成的控制器位于 `app/Http/Controllers/UserController.php`。对于每个资源，方法将在控制器中生成存根代码（stub）：\n\
    \n```php\n<?php\n\nnamespace App\\Http\\Controllers;\n\nuse App\\Models\\User;\n\
    use Illuminate\\View\\View;\n\nclass UserController extends Controller\n{\n  \
    \  /**\n     * 显示资源列表。\n     */\n    public function index()\n    {\n        //\
    \ TODO: implementation\n    }\n\n    /**\n     * 显示创建新资源的表单。\n     */\n    public\
    \ function create()\n    {\n        // TODO: implementation\n    }\n\n    /**\n\
    \     * 存储新创建的资源。\n     */\n    public function store(Request $request)\n    {\n\
    \        // TODO: implementation\n    }\n\n    /**\n     * 显示指定的资源。\n     */\n\
    \    public function show(string $id): View\n    {\n        // TODO: implementation\n\
    \    }\n\n    /**\n     * 显示编辑指定资源的表单。\n     */\n    public function edit(string\
    \ $id)\n    {\n        // TODO: implementation\n    }\n\n    /**\n     * 更新指定的资源。\n\
    \     */\n    public function update(Request $request, string $id)\n    {\n  \
    \      // TODO: implementation\n    }\n\n    /**\n     * 删除指定的资源。\n     */\n \
    \   public function destroy(string $id)\n    {\n        // TODO: implementation\n\
    \    }\n}\n```\n\n你也可以像这样在 `routes/web.php` 文件中注册这些路由：\n\n```php\nuse App\\Http\\\
    Controllers\\UserController;\nuse Illuminate\\Support\\Facades\\Route;\n\nRoute::resource('users',\
    \ UserController::class);\n```\n\n这将生成以下路由：\n\n| 动词 | URI | 动作 | 命名 |\n| :---\
    \ | :--- | :--- | :--- |\n| GET | `/users` | `index` | `users.index` |\n| GET\
    \ | `/users/create` | `create` | `users.create` |\n| POST | `/users` | `store`\
    \ | `users.store` |\n| GET | `/users/{user}` | `show` | `users.show` |\n| GET\
    \ | `/users/{user}/edit` | `edit` | `users.edit` |\n| PUT/PATCH | `/users/{user}`\
    \ | `update` | `users.update` |\n| DELETE | `/users/{user}` | `destroy` | `users.destroy`\
    \ |\n\n# 构造函数注入\n\n所有的 Laravel 控制器都使用 Laravel 服务容器进行解析。因此，你可以在构造函数中对控制器可能需要的任何依赖进行类型提示。系统将自动解析并将给定的依赖注入到控制器实例：\n\
    \n```php\n<?php\n\nnamespace App\\Http\\Controllers;\n\nuse App\\Repositories\\\
    EmployeeRepository;\n\nclass UserController extends Controller\n{\n    /**\n \
    \    * 创建新的控制器实例。\n     */\n    public function __construct(\n        protected\
    \ EmployeeRepository $employees\n    ) {}\n}\n```\n\n# 方法注入\n\n除了在构造函数中注入需求外，你还控制器的方法上对依赖进行类型提示。将\
    \ `Illuminate\\Http\\Request` 对象注入你的控制器函数是方法注入的典型应用：\n\n```php\n<?php\n\nnamespace\
    \ App\\Http\\Controllers;\n\nuse Illuminate\\Http\\RedirectResponse;\nuse Illuminate\\\
    Http\\Request;\n\nclass UserController extends Controller\n{\n    /**\n     *\
    \ 存储新员工。\n     */\n    public function store(Request $request): RedirectResponse\n\
    \    {\n        $name = $request->name;\n        // 存储员工…\n\n        return redirect('/employees');\n\
    \    }\n}\n```\n\n# Laravel 中的重定向\n\n"
- fmt: "\nRedirect responses are derived from the `Illuminate\\Http\\RedirectResponse`\
    \ class and include the appropriate headers for sending the user to a different\
    \ URL.\n\n## Redirect Helper\n\nThe easiest way to create a redirect in Laravel\
    \ is using the Redirect Helper. Let’s look at an example of creating a redirect\
    \ in Laravel:\n\n```php\nRoute::get(/aboutMe, function () {\n    return redirect(/home/aboutMe);\n\
    });\n```\n\nIn some circumstances, such as when incorrect or incomplete information\
    \ is submitted, you might want to send the user back to the previous webpage.\
    \ Use the global `back` helper function to do this. Make sure the route using\
    \ the `back` function is using the web middleware group or has all of the session\
    \ middleware applied because this functionality uses the session:\n\n```php\n\
    Route::post(/user/aboutMe, function () {\n    // Validate the request\n    return\
    \ back()->withInput();\n});\n```\n\n## Redirecting to Named Routes\n\nAn instance\
    \ of `Illuminate\\Routing\\Redirector` is returned when the `redirect` helper\
    \ in a Laravel application is used without any arguments, enabling you to call\
    \ any method on the `Redirector` instance. For instance, you can use the `route`\
    \ method to create a `RedirectResponse` to a specific route:\n\n```php\nreturn\
    \ redirect()->route(register);\n```\n\nTo add parameters to pass it as a second\
    \ argument to the `route` method:\n\n```php\n// For a route with URI: dashboard/{id}\n\
    return redirect()->route(dashboard, ['id' => 1]);\n```\n\nLaravel also offers\
    \ a global `to_route` function that can be used to redirect and route.\n\n## Redirecting\
    \ to Controller Actions\n\nIn Laravel, redirects to controller operations are\
    \ also possible. To achieve this, provide the `action` method with the controller\
    \ and action name:\n\n```php\nuse App\\Http\\Controllers\\EmployeeController;\n\
    return redirect()->action([EmployeeController::class, 'taxID']);\n```\n\nYou can\
    \ add arguments as the second argument to the `action` method if your controller\
    \ route calls for them:\n\n```php\nreturn redirect()->action(\n    [EmployeeController::class,\
    \ 'dashboard'], ['id' => 1]\n);\n```\n\n## Redirecting - Flashed Session Data\n\
    \nNormally, flashing data to the session and redirecting to a new URL happen simultaneously.\
    \ Usually, you flash a success message to the session after completing an activity\
    \ successfully. In a single, fluid method chain, you may build a `RedirectResponse`\
    \ object and flash data to the session for convenience:\n\n```php\nRoute::post(/employee/profile,\
    \ function () {\n    // Update the employee’s profile\n    return redirect(/dashboard)->with('status',\
    \ 'Employee Profile Data updated!');\n});\n```\n\nBefore sending the user to a\
    \ different page, you may flash the input data from the current request to the\
    \ session using the `withInput` method offered by the `RedirectResponse` class.\
    \ Whenever you make the following request, you may quickly recover the input after\
    \ it has been flashed to the session:\n\n```php\nreturn back()->withInput();\n\
    ```\n\nYou can show the session’s flashing message when the user is redirected.\
    \ As an illustration, using Blade syntax:\n\n```blade\n@if (session('status'))\n\
    \    <div class=\"alert alert-success\">\n        {{ session('status') }}\n  \
    \  </div>\n@endif\n```\n\n## Directives in Laravel\n\nDirectives are explicit\
    \ instructions that may be used within Blade templates in Laravel to carry out\
    \ certain logic or actions. The Templating Engine for Laravel, known as Blade,\
    \ enables you to create expressive, tidy, and readable views for your application.\n\
    \nIn Laravel, directives are identified by the symbol `@` and the directive name.\
    \ They offer a quick and stylish method of running PHP code inside of your Blade\
    \ templates without clogging the display with PHP tags.\n\n![](images/Figure-4.1.jpg)\n\
    \n**Figure 4.1:** Type of Directives in Laravel\n\n## Conditional Directives\n\
    \nThe if directives are used to specify conditions in the logic building of the\
    \ Laravel application. The following are the different directives, as shown in\
    \ [Figure 4.2](#c04.xhtml#fig4_2):\n\n![](images/Figure-4.2.jpg)\n\n**Figure 4.2:**\
    \ Conditional Directives in Laravel\n\nThe directives `@if`, `@elseif`, `@else`,\
    \ and `@endif` can be used to create if statements. These directives perform the\
    \ same tasks as their PHP equivalents:\n\n```blade\n@if (count($fruits) === 1)\n\
    \    There is one fruit!\n@elseif (count($records) > 1)\n    There are multiple\
    \ fruits.\n@else\n    There are no fruits.\n@endif\n```\n\nThe `@isset` and `@empty`\
    \ directives can be used as practical substitutes for their respective PHP functions\
    \ in addition to the conditional directives already covered:\n\n```blade\n@isset($fruits)\n\
    \    // $fruits is defined and is not null\n@endisset\n\n@empty($fruits)\n   \
    \ // $fruits is “empty”\n@endempty\n```\n\n## Custom if Statements\n\nWhen creating\
    \ basic, custom conditional statements, programming a custom directive might often\
    \ be more difficult than necessary. In order to easily build unique conditional\
    \ directives using closures, Blade offers the `Blade::if` function.\n\n## Switch\
    \ Directive\n\nThe switch directive is an essential component in writing the logic\
    \ and handling of different scenarios in Laravel.\n\n![](images/Figure-4.3.jpg)\n\
    \n**Figure 4.3:** Switch Directive in Laravel\n\nLet’s look at using the switch\
    \ directive in the code:\n\n```blade\n@switch($i)\n    @case(1)\n        Case\
    \ 1\n        @break\n    @case(2)\n        Case 2\n        @break\n    @default\n\
    \        Default case\n@endswitch\n```\n\n## Auth Directive\n\nThe auth directive\
    \ is useful to maintain authentication and security in application code.\n\n![](images/Figure-4.4.jpg)\n\
    \n**Figure 4.4:** Auth Directives in Laravel\n\nTo easily detect whether the current\
    \ user is authenticated or a guest, use the `@auth` and `@guest` directives:\n\
    \n```blade\n@auth\n    // The user is authenticated\n@endauth\n\n@guest\n    //\
    \ The user is not authenticated\n@endguest\n```\n\nThe `@auth` and `@guest` directives\
    \ allow you to define the authentication guard that should be verified:\n\n```blade\n\
    @auth(admin)\n    // The user is authenticated\n@endauth\n\n@guest(admin)\n  \
    \  // The user is not authenticated\n@endguest\n```\n\nSecurity, code structure,\
    \ and maintainability all depend on the use of directives for authentication in\
    \ Laravel apps. It encourages best practices and supports developers’ effective\
    \ management of the frontend views’ authentication-related code through separation\
    \ of concerns.\n\n## Loops\n\nBlade offers straightforward directives in addition\
    \ to conditional statements for interacting with PHP’s loop structures.\n\n![](images/Figure-4.5.jpg)\n\
    \n**Figure 4.5:** Loop Directives in Laravel\n\nAgain, each of these directives\
    \ does the same tasks as their PHP equivalents:\n\n```blade\n@for ($i = 0; $i\
    \ < 10; $i++)\n    The current value of i is {{ $i }}\n@endfor\n\n@foreach ($employees\
    \ as $employee)\n    <p>This is employee {{ $employee->id }}</p>\n@endforeach\n\
    \n@forelse ($employees as $employee)\n    <li>{{ $employee->name }}</li>\n@empty\n\
    \    <p>No employees</p>\n@endforelse\n\n@while (true)\n    <p>Forever Loop</p>\n\
    @endwhile\n```\n\nUsing the `@continue` and `@break` directives, you can also\
    \ use loops to skip the current iteration or break the loop:\n\n```blade\n@foreach\
    \ ($employees as $employee)\n    @if ($employee->type == 1)\n        @continue\n\
    \    @endif\n    <li>{{ $employee->name }}</li>\n    @if ($employee->number ==\
    \ 5)\n        @break\n    @endif\n@endforeach\n```\n\nThe continuation or break\
    \ condition may also be included in the directive declaration:\n\n```blade\n@foreach\
    \ ($employees as $employee)\n    @continue($employee->type == 1)\n    <li>{{ $employee->name\
    \ }}</li>\n    @break($employee->number == 5)\n@endforeach\n```\n"
