    \n# Advanced Joins\n\nUse the `where` and `orWhere` methods on a join if you want\
    \ to employ a `where` style clause on your joins. These techniques test the column\
    \ against a value rather than two columns:\n\n```php\nDB::table('employees')\n\
    ->join('contacts', function($join)\n{\n    $join->on('employees.id', '=', 'contacts.employee_id')\n\
    \    ->where('contacts.employee_id', '>', 10);\n})\n->get();\n```\n\n# Advanced\
    \ Where\n\nMore complex `where` clauses, such as `where exists` or nested parameter\
    \ groupings, could occasionally be required. These can also be handled by the\
    \ Laravel query builder:\n\n```php\nDB::table('employees')\n->where('name', '=',\
    \ 'ABC')\n->orWhere(function($query)\n{\n    $query->where('votes', '>', 100)\n\
    \    ->where('title', '<>', 'Admin');\n})\n->get();\n```\n\nThe aforementioned\
    \ query will return the following SQL:\n\n`select * from employees where name\
    \ = ‘ABC’ or (votes > 100 and title <> ‘Admin’)`\n\n# Aggregates\n\nA wide range\
    \ of aggregate techniques, including `count`, `max`, `min`, `average`, and `total`,\
    \ are now available in the query builder.\n\nCount:\n\n`$employees = DB::table('employees')->count();`\n\
    \nMax:\n\n`$cost = DB::table('orders')->max('cost');`\n\nMin:\n\n`$cost = DB::table('orders')->min('cost');`\n\
    \nAverage:\n\n`$cost = DB::table('orders')->avg('cost');`\n\nSum:\n\n`$total =\
    \ DB::table('employees')->sum('votes');`\n\n# Raw Expressions\n\nA query may occasionally\
    \ need the usage of a raw expression. Take caution not to construct any SQL injection\
    \ points because these expressions will be injected into the query as strings!\
    \ You can use the `DB::raw` command to produce a raw expression:\n\n```php\n$employees\
    \ = DB::table('employees')\n->select(DB::raw('count(*) as employee_count, status'))\n\
    ->where('status', '<>', 1)\n->groupBy('status')\n->get();\n```\n\n# Pessimistic\
    \ Locking\n\nThere are a few functions in the query builder that will assist you\
    \ with `pessimistic locking` for your `SELECT` statements.\n\nUse the `sharedLock`\
    \ method on a query to execute the `SELECT` statement with a `shared lock`:\n\n\
    ```php\nDB::table('employees')->where('votes', '>', 140)->sharedLock()->get();\n\
    ```\n\nYou can use the `lockForUpdate` method on a query to `lock for update`\
    \ on a `SELECT` statement:\n\n```php\nDB::table('employees')->where('votes', '>',\
    \ 140)->lockForUpdate()->get();\n```\n\n# Caching Queries\n\nUsing `remember`\
    \ or `rememberForever` technique, you can conveniently cache a query’s results:\n\
    \n```php\n$value = Cache::rememberForever('employees', function () {\n    return\
    \ DB::table('employees')->get();\n});\n```\n\nThis will retrieve it from the cache\
    \ or store it forever if it does not.\n\n# Eloquent Operations\n\nEloquent, an\
    \ object-relational mapper (ORM) that makes working with your database fun, is\
    \ a component of Laravel. Each database table in Eloquent has a corresponding\
    \ `Model` that is used to communicate with the table. Eloquent models allow you\
    \ to insert, edit, and delete records from the database.\n\n# Model Classes\n\n\
    Let’s start by building an Eloquent model. The `Illuminate\\Database\\Eloquent\\\
    Model` class is generally extended with models, which are typically located in\
    \ `app\\Models` directory. You could use the model command `make:model` to create\
    \ a new model:\n\n```bash\nphp artisan make:model Office\n```\n\nUse the `--migration`\
    \ or `-m` option to generate a database model:\n\n```bash\nphp artisan make:model\
    \ Office -m\n```\n\nWhen creating a model, you may also create different classes\
    \ such as factories, seeders, controllers, and form requests. Additionally, by\
    \ combining these choices, it is possible to create numerous classes at once:\n\
    \n- Generate a model and `OfficeFactory` class:\n```bash\nphp artisan make:model\
    \ Office --factory -f\n```\n- Generate a model and `OfficeSeeder` class:\n```bash\n\
    php artisan make:model Office --seed -s\n```\n\n- Generate a model and `OfficeController`\
    \ class:\n```bash\nphp artisan make:model Office --controller -c\n```\n\n- Generate\
    \ a model, `OfficeController` resource class, and form request classes:\n```bash\n\
    php artisan make:model Office --controller --resource -r\n```\n\n- Generate a\
    \ model and `OfficePolicy` class:\n```bash\nphp artisan make:model Office --policy\n\
    ```\n\n- Generate a model and a migration, factory, seeder, and controller:\n\
    ```bash\nphp artisan make:model Office -mfsc\n```\n\n- Shortcut to generate a\
    \ model, migration, factory, seeder, policy, controller, and form requests:\n\
    ```bash\nphp artisan make:model Office --all\n```\n\n- Generate a pivot model:\n\
    ```bash\nphp artisan make:model Member --pivot -p\n```\n\n# Model Conventions\n\
    \nThe `app/Models` directory will house any models created by the `make:model`\
    \ command. Let’s look at a fundamental model and talk about some of Eloquent’s\
    \ fundamental conventions:\n\n```php\n<?php\nnamespace App\\Models;\n\nuse Illuminate\\\
    Database\\Eloquent\\Model;\n\nclass Office extends Model\n{\n    // Code Logic\n\
    }\n```\n\n# Table Name\n\nYou might have noted from the preceding example that\
    \ we did not specify to Eloquent which database table corresponds to our `Office`\
    \ model. Conventionally, unless another name is specifically supplied, the table\
    \ name will be the class’s `snake case`, plural name. Since an `OfficeCapacityController`\
    \ model would store entries in a table called `office_capacity_controllers`, Eloquent\
    \ will presume that the `Office` model stores records in the `office` table.\n\
    \nIf the database table that corresponds to your model does not follow this norm,\
    \ you can define a `table` attribute on the model to manually specify the table\
    \ name:\n\n```php\n<?php\nnamespace App\\Models;\n\nuse Illuminate\\Database\\\
    Eloquent\\Model;\n\nclass Office extends Model\n{\n    /**\n     * The table associated\
    \ with the model. And the logic.\n     *\n     * @var string\n     *\n     */\n\
    \    protected $table = 'my_offices';\n}\n```\n\n# Primary Key\n\nEloquent will\
    \ additionally presume that the associated database table for each model contains\
    \ an `id` primary key column.\n\n![](images/Figure-5.3.jpg)\n\n**Figure 5.3:**\
    \ Primary Key Types\n\n**Homogeneous Primary Key**\n\nEloquent will additionally\
    \ presume that the associated database table for each model contains an `id` primary\
    \ key column - `$primaryKey`:\n\n```php\n<?php\nnamespace App\\Models;\n\nuse\
    \ Illuminate\\Database\\Eloquent\\Model;\n\nclass Office extends Model\n{\n  \
    \  /**\n     * The primary key associated with the table.\n     *\n     * @var\
    \ string\n     *\n     */\n    protected $primaryKey = 'office_id';\n}\n```\n\n\
    Moreover, Eloquent will automatically convert the primary key to an integer because\
    \ it expects that the primary key is an incrementing integer value. You must declare\
    \ a public `$incrementing` property on your model with the value set to `false`\
    \ if you want to utilize a non-incrementing or non-numeric primary key:\n\n```php\n\
    class Office extends Model\n{\n    /**\n     * Indicates if the model’s ID is\
    \ auto-incrementing.\n     *\n     * @var bool\n     *\n     */\n    public $incrementing\
    \ = false;\n}\n```\n\nYou should add a protected `$keyType` property to your model\
    \ if the primary key is not an integer. The `String` should be the value for this\
    \ property:\n\n```php\nclass Office extends Model\n{\n    /**\n     * The data\
    \ type of the auto-incrementing ID.\n     *\n     * @var string\n     *\n    \
    \ */\n    protected $keyType = 'string';\n}\n```\n\n**Composite Primary Key**\n\
    \nEach model must have at least one **ID** that can act as its primary key according\
    \ to Eloquent. Eloquent models do not support **composite** main keys.\n\nHowever,\
    \ in addition to the main key that uniquely identifies the table, you are allowed\
    \ to add other multi-column, unique indexes to your database tables.\n\n# [UUID\
    \ and ULID Keys](#toc.xhtml#s147a)\n"
