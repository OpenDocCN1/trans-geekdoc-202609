    \ middleware\n\n# [Laravel’s built-in Authentication System](#toc.xhtml#s161a)\n\
    \nMany online apps include a method for users to **login** and authenticate with\
    \ the program. This feature’s implementation in web applications can be a challenging\
    \ and perhaps dangerous task. Laravel makes an effort to provide you with the\
    \ resources you need to create authentication quickly, safely, and simply.\n\n\
    The **guards** and **providers** at the center of Laravel’s authentication infrastructure\
    \ make up the system. Guards specify the user authentication process for each\
    \ request. For instance, Laravel has a `session` guard that uses cookies and session\
    \ storage to retain state.\n\nUsers are fetched from your persistent storage via\
    \ providers. Laravel includes Eloquent and the database query builder functionality\
    \ for fetching users. You may, however, establish more providers as needed for\
    \ your application.\n\nThe authentication configuration file for your application\
    \ is located at `config/auth.php`. This file includes a number of well-documented\
    \ options for modifying the behavior of Laravel’s authentication services.\n\n\
    # [Laravel API Authentication Services](#toc.xhtml#s162a)\n\nPassport and Sanctum\
    \ are two optional packages provided by Laravel to help you manage API tokens\
    \ and authenticate requests performed with API tokens. Please keep in mind that\
    \ these libraries and the built-in cookie-based authentication libraries in Laravel\
    \ are not mutually exclusive. These libraries are primarily concerned with API\
    \ token authentication, whereas the built-in authentication services are concerned\
    \ with cookie-based browser authentication. Many applications will make use of\
    \ both Laravel’s built-in cookie-based authentication and one of Laravel’s API\
    \ authentication packages.\n\n![](images/Figure-6.1.jpg)\n\n**Figure 6.1:** Laravel\
    \ Auth Packages\n\nIn addition to Passport and Sanctum, Laravel also has Laravel\
    \ Fortify that can be used for authentication. Laravel Fortify is a Laravel authentication\
    \ backend implementation that is not dependent on the front end. Fortify registers\
    \ the routes and controllers required to implement all of Laravel’s authentication\
    \ capabilities, including login, registration, password reset, and email verification.\n\
    \n# [Passport](#toc.xhtml#s163a)\n\nPassport is an OAuth2 authentication provider\
    \ that provides a number of OAuth2 “grant types” that allow you to issue different\
    \ sorts of tokens. In general, this is a comprehensive and complicated API authentication\
    \ package.\n\nMost apps, however, do not require the extensive functionalities\
    \ provided by the OAuth2 spec, which can be perplexing for both users and developers.\
    \ Furthermore, developers have previously been perplexed as to how to authenticate\
    \ SPA apps or mobile applications utilizing OAuth2 authentication providers, such\
    \ as Passport.\n\n# [Sanctum](#toc.xhtml#s164a)\n\nLaravel Sanctum is an authentication\
    \ package that solves a number of problems faced in developing Laravel applications.\
    \ The package is a more streamlined package that is capable of handling first-party\
    \ web requests as well as API calls made through tokens. This also helps remove\
    \ the complexity of OAuth2.\n\nIn addition to being an API, it offers a first-party\
    \ web UI, which means that SPA (single-page applications) exists independent of\
    \ the backend Laravel application and independent of the mobile client.\n\nLaravel\
    \ Sanctum is a hybrid web/API authentication module that can handle the complete\
    \ authentication process for your application. This is feasible because when Sanctum-based\
    \ apps get a request, Sanctum first determines if the request has a session cookie\
    \ referencing an authenticated session.\n\nSanctum achieves this by utilizing\
    \ Laravel’s built-in authentication services, as previously explained. Sanctum\
    \ will check the request for an API token if it is not authenticated through a\
    \ session cookie. If an API token is present, Sanctum will use that token to authenticate\
    \ the request.\n\n# [Customizing Authentication and Registration logic](#toc.xhtml#s165a)\n\
    \nTo achieve custom authentication logic for the Laravel application, it is critical\
    \ to incorporate HTTP authentication.\n\n# [HTTP Authentication](#toc.xhtml#s166a)\n\
    \nHTTP Authentication allows you to quickly authenticate users of your application\
    \ without having to build up a separate “login” page. Attach the `auth.basic`\
    \ middleware to a route to get started. You do not need to define the `auth.basic`\
    \ middleware because it is available with the Laravel framework.\n\n`Route::get(‘/profile’,\
    \ function () {`\n\n`// Only authenticated users may access this route`\n\n`})->middleware(‘auth.basic’);`\n\
    \nWhen you access the route in your browser once the middleware has been attached,\
    \ you will be requested for credentials. The `auth.basic` middleware will presume\
    \ that the `email` field in your `users` database table is the user’s “username”\
    \ by default.\n\nHTTP Basic authentication may fail if you use PHP FastCGI and\
    \ Apache to serve your Laravel application. To resolve these issues, add the following\
    \ lines to your application’s `.htaccess` file:\n\n`RewriteCond %{HTTP:Authorization}\
    \ ^(.+)$`\n\n`RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]`\n\
    \n# [Stateless HTTP Authentication](#toc.xhtml#s167a)\n\nYou may also use HTTP\
    \ Basic Authentication without setting a session identification cookie. This is\
    \ especially useful if you use HTTP Authentication to authenticate calls to your\
    \ application’s API. To do so, create a middleware that calls the `onceBasic`\
    \ function. If the `onceBasic` function returns no answer, the request may be\
    \ sent further through the application:\n\n`<?php`\n\n`namespace App\\Http\\Middleware;`\n\
    \n`use Closure;`\n\n`use Illuminate\\Http\\Request;`\n\n`use Illuminate\\Support\\\
    Facades\\Auth;`\n\n`use Symfony\\Component\\HttpFoundation\\Response;`\n\n`class\
    \ AuthenticateBasicAuth`\n\n`{`\n\n`/**`\n\n`* Handle an incoming request.`\n\n\
    `*`\n\n`* @param \\Closure(\\Illuminate\\Http\\Request): (\\Symfony\\Component\\\
    HttpFoundation\\Response) $next`\n\n`*/`\n\n`public function handle(Request $request,\
    \ Closure $next): Response`\n\n`{`\n\n` return Auth::onceBasic() ?: $next($request);`\n\
    \n`}`\n\n`}`\n\nAdditionally, attach a middleware to a route:\n\n`Route::get(‘/api/user’,\
    \ function () {`\n\n`// Only authenticated users may access this route`\n\n`})->middleware(AuthenticateBasicAuth::class);`\n\
    \n# [Custom User Providers](#toc.xhtml#s168a)\n\nIf you are not storing your users\
    \ in a standard relational database, you will need to extend Laravel with your\
    \ own authentication user provider. To define a custom user provider, we will\
    \ utilize the `provider` method on the `Auth` façade. The user provider resolver\
    \ should return an `Illuminate\\Contracts\\Auth\\UserProvider` implementation:\n\
    \n`<?php`\n\n`namespace App\\Providers;`\n\n`use App\\Extensions\\TestEmployeeProvider;`\n\
    \n`use Illuminate\\Contracts\\Foundation\\Application;`\n\n`use Illuminate\\Foundation\\\
    Support\\Providers\\AuthServiceProvider as ServiceProvider;`\n\n`use Illuminate\\\
    Support\\Facades\\Auth;`\n\n`class AuthServiceProvider extends ServiceProvider`\n\
    \n`{`\n\n`/**`\n\n`* Register any application authentication / authorization services.`\n\
    \n`*/`\n\n`public function boot(): void`\n\n`{`\n\n`Auth::provider(‘test’, function\
    \ (Application $app, array $config) {`\n\n`// Return an instance of Illuminate\\\
    Contracts\\Auth\\UserProvider`\n\n`return new TestEmployeeProvider($app->make(‘test.connection’));`\n\
    \n`});`\n\n`}`\n\n`}`\n\nAfter you’ve registered the provider using the provider\
    \ method, you may change your auth.php configuration file to utilize the new user\
    \ provider. First, identify a provider that will make use of your new driver:\n\
    \n`‘providers’ => [`\n\n`‘employees’ => [`\n\n`‘driver’ => ‘test’,`\n\n`],`\n\n\
    `],`\n\nFinally, you may use the following provider in your `guards` configuration:\n\
    \n`‘guards’ => [`\n\n`‘web’ => [`\n\n`‘driver’ => ‘session’,`\n\n`‘provider’ =>\
    \ ‘employees’,`\n\n`],`\n\n`],`\n\n# [User Provider Contract](#toc.xhtml#s169a)"
