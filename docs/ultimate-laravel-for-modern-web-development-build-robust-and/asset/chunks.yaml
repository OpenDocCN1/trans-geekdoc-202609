- fmt: "\nThe logical separation of operations in the application gives the power\
    \ to develop the components separately. This means the application components\
    \ can be broken down into logically separate components, which can be simultaneously\
    \ developed, leading to a quick turnaround time for the application development.\n\
    \nSimultaneous Development also allows us to build features quickly and independently\
    \ and then combine them using MVC principles. This ensures faster delivery of\
    \ software and also makes it easier to incorporate new features and improve on\
    \ the existing features.\n\n## Maintainability and Extensibility\n\nThe MVC architecture\
    \ enables the application to be easy to maintain. Once an application is developed\
    \ and used by users – many new insights might be discovered. It is important to\
    \ incorporate these insights into the applications. It is also possible that the\
    \ original team of developers who worked on the application have moved to a new\
    \ project. In this case, a new team of developers will work on maintaining the\
    \ application. With the MVC architecture pattern in development, the logical separation\
    \ of responsibilities makes it better and easier for someone new to understand\
    \ the code, making the code maintainable.\n\nThe current application can be added\
    \ with additional features, and this is achieved by the MVC pattern principles.\
    \ The MVC architecture makes code to be easily extendable with new capabilities.\
    \ This adds to the maintainability feature of MVC.\n\n## Models in Laravel\n\n\
    The Model component in Laravel interacts with the database layer and the controller\
    \ layer. It is also called the Data Logic component in the MVC architecture pattern.\n\
    \nThe role of the Model component is to fetch and retrieve data from the database,\
    \ as well as query the database for the desired data. In interacting with the\
    \ database layer, all the `CRUD` (Create, Read, Update, Delete) operations are\
    \ handled by the Model component. The Model components fetch the logic of the\
    \ various operations from the Controller layer and are responsible for all the\
    \ executions of operations, storing the result of the operations, and managing\
    \ the changes in the data within the database.\n\nThe Model component interacts\
    \ with the Controller layer and informs the Model component about the data flow\
    \ in the application. It takes full ownership of the data flow in the application,\
    \ from the UI to the database, with the Controller component serving as the intermediary.\n\
    \n## Views in Laravel\n\nThe Views component in Laravel comprises all the components\
    \ that are visible to the end-user on the application. The end user interacts\
    \ with the application through the User Interface (UI), and the UI components,\
    \ such as input boxes and buttons, are all encompassed within the View components\
    \ in the MVC architectural pattern.\n\n![](images/Figure-2.4.jpg)\n\n**Figure\
    \ 2.4:** View Component in Laravel\n\n[Figure 2.4] displays the various examples\
    \ of the View components. To summarize the View Components, it encompasses all\
    \ the components and elements that are visible to the user when he/she interacts\
    \ with the application interface.\n\n## Controllers in Laravel\n\nThe Controller\
    \ component in the Laravel MVC architecture is the `Brain` of the application.\
    \ The Controller is responsible for managing how the data in the application is\
    \ controlled and also interacts with the `Model` and `View` components to decide\
    \ how the data is displayed in the application. Controller components are also\
    \ responsible for performing the operations that the user performs via the user\
    \ interface of the application. This can be any `CRUD` (Create, Read, Update,\
    \ Delete) operation or any feature programmed in the application. All these are\
    \ the responsibilities of the Controller component.\n\n## Conclusion\n\nIn this\
    \ chapter, we examined the key concept that makes building and maintaining applications\
    \ in Laravel seamless. We delved into the MVC architectural pattern, exploring\
    \ its history and the need for such an architectural pattern. This chapter focused\
    \ on the MVC architecture pattern and how it is powerful and makes Laravel powerful.\n\
    \nNext, we explored the MVC pattern in depth, examining the responsibilities of\
    \ each of the components along with the design principles that govern the architectural\
    \ pattern. These design patterns serve as a critical benefit in using the MVC\
    \ architecture pattern and also enable the programmer to use these design patterns\
    \ to the fullest.\n\nThen, we looked at the MVC architecture pattern in Laravel.\
    \ We discussed key features, namely, SEO Friendly, Test Driven Development (TDD),\
    \ Maintainability and Extensibility, and Simultaneous Development. These key features\
    \ help in making our applications easily adopted in the industry and provide advanced\
    \ modern features like SEO, which make the application scalable.\n\nAdditionally,\
    \ we examined Models, Views, and Controllers in Laravel, understanding how to\
    \ create these components in application development and utilizing them to stay\
    \ true to the design principles and adapt the key features in the application.\n\
    \nThe MVC architecture pattern is like the backbone of Laravel, and this chapter\
    \ provides all the information, focusing on features, principles, and MVC in the\
    \ context of Laravel.\n\nIn the next chapter, we will explore Routers and Views\
    \ in Laravel.\n\n# CHAPTER 3: Routers and Views in Laravel\n\n### Introduction\n\
    \nThis chapter covers the routers and views in Laravel, which are an essential\
    \ part of web development. The chapter will start with the basics and lead up\
    \ to complex topics relating to routers and views. The chapter will also discuss\
    \ the different types of routers and views in Laravel and how to create these\
    \ components.\n\n### Structure\n\nIn this chapter, the focus will be on the following\
    \ topics:\n\n*   Routers in Laravel\n    *   Introduction to routers\n    *  \
    \ Routes directory\n    *   Router methods\n    *   Types of routers\n    *  \
    \ Optional parameters\n    *   Regular expression constraints\n    *   Route groups\n\
    \    *   Cross-origin resource sharing\n    *   Caching\n*   Views in Laravel\n\
    \    *   Creating views\n    *   Views and Extensions\n    *   Data and views\n\
    \    *   View composers and creators\n    *   View optimization\n\n### Routers\
    \ in Laravel\n\nWhile developing the Laravel web application, it is important\
    \ to have a programmatic way to route or provide a way to access the application’s\
    \ capabilities. This is where we need Routers in our application.\n\n#### Introduction\
    \ to Routers\n\nRouters are the URLs that an end user uses in order to interact\
    \ with different features of the web application. It is the endpoint that is accessed\
    \ by the user to fetch and transmit data in and out of the web application.\n\n\
    The fundamental syntax to understand routing is as follows:\n\n```\nuse Illuminate\\\
    Support\\Facades\\Route;\n\nRoute::get('/welcome', function () {\n    return 'Hello\
    \ Reader';\n});\n```\n\nThe following is the snapshot of the output on the browser:\n\
    \n![](images/Figure-3.1.jpg)\n\n**Figure 3.1:** Router Welcome Example\n\n####\
    \ Routes Directory\n\nYour route files, which can be found in the `routes` directory,\
    \ include definitions for all Laravel routes.\n\nThe `AppProvidersRouteServiceProvider`\
    \ in your application will automatically load these files. Routes for your web\
    \ interface are defined in the `routes/web.php` file. These routes fall within\
    \ the purview of the web middleware group, which offers capabilities like CSRF\
    \ protection and session state. The `api` middleware group is applied to the stateless\
    \ routes in `routes/api.php`.\n\nYou must begin by defining routes in your `routes/web.php`\
    \ file for the majority of applications. By typing the defined route’s URL into\
    \ your browser, you can access the routes defined in `routes/web.php`.\n"
