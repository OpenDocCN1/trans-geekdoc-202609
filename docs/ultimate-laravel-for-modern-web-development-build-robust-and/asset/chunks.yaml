    \n```\nRoute::domain(‘{city}.example.com’)->group(function () {\n    Route::get(‘city/{id}’,\
    \ function (string $name, string $id) {\n        // Code Logic\n    });\n});\n\
    ```\n\n## Route Prefixes\n\nEach route in the group may be prefixed with a specific\
