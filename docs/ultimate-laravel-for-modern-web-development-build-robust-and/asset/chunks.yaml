    在 MVC 模式采用的早期，它主要被用于桌面应用程序。到 20 世纪 90 年后期，它在 Web 应用程序中流行，并成为开发 Web 应用的行业主流。互联网的繁荣和业务数字化推动了
    MVC 架构模式在应用程序中的广泛应用。


    # 组件分离


    MVC 架构模式将三个主要职责分离为三个组件，如图 2.1 所示：


    ![](img/Figure-2.1.jpg)


    **图 2.1：** MVC 组件分离


    # Laravel 框架下的 MVC 架构模式


    MVC 架构模式使 Laravel 能够利用该模式强大的能力。通过 MVC 架构模式，关键区别在于逻辑组件的划分，这使得应用程序代码库具有模块化，并且便于进行更改——添加或删除功能。


    我们的 Laravel 应用在使用 MVC 架构模式时遵循了多项设计原则。


    将 Laravel 中的 `Model`（模型）视为数据后的大脑。它采用了 `Eloquent ORM`，这与与数据库通信的语言类似。因此，当你希望以更结构化的方式处理数据库时，`Eloquent`
    可以通过使用类似于以人类友好的方式与数据库对话的语法来帮助你。


    将 `View`（视图）视为应用程序的前脸。我们在 Laravel 中使用了 `Blade Templates`（模板模板），它们是网页外观的蓝图。它们维护
    HTML 结构，并确保所有内容都能正确地显示给用户。


    `Controllers`（控制器）负责整个过程。它们充当 `Model` 和 `View` 之间的媒介。当用户在网站上执行操作（例如点击按钮或完成表单）时，`Controllers`
    会介入。它们与 `Model` 通信以获取或修改数据，然后将这些数据传输到 `View`，向用户显示他们想要的内容。


    最后，Laravel 中的 `Resources` 和 `Collections` 是数据管理向师。将 `RESTful resource controllers`（RESTful
    资源控制器）视为执行 `CRUD` 活动（如添加、查看、更新或删除数据）时的助手。它们为每种职责都提供了独特的方法，使得应用程序中的数据处理变得简单。因此，这就像拥有一套工具以系统化的方式处理数据的各个部分。


    # 设计原则


    Laravel 的核心特性在于优化利用设计原则。让我们探索一下设计原则以及它们如何赋能 Laravel。


    ## 可复用性


    MVC 架构将代码拆分为独立的逻辑组件。功能和组件之间的区别允许创建可以直接重复复用的组件。


    `controller` 和 `view` 大量利用了可复用原则，在 `view` 和 `controller` 中创建的组件主要被重用于用户界面组件。


    ## 灵活性


    MVC 架构专注于以灵活性为核心设计应用程序。通过 `model`、`view` 和 `controller` 逻辑组件的区分，在现有应用程序中更改并整合新的行为和工作流是容易的。


    它赋予开发者自由，可以轻松更改 `view` 或 `controller` 或两者，而无需对 `model` 发生剧烈变化，有时甚至无需更改 `model`。这使得
    Laravel 应用程序开发具有灵活性。


    # 内聚性


    架构模式中的 `model`、`view` 和 `controller` 组件具有很强的层内聚。与组件职责没有逻辑分离相比，使用 MVC 架构强制了三个组件之间的内聚性。


    # 耦合性


    MVC 架构模式的三个组件具有逻辑分离，这似乎组件间的通信可能会受到这种模式的影响。然而，事实恰恰相反。


    这些通道之间的通信通道高效且极精简，导致组件之间数据和信息的快速传输。这使得组件之间的数据传输变得顺畅简单，并减少了耦合性，从而提高了应用程序系统的性能。


    # 组件的设计独立性


    MVC 架构模式的三个组件具有逻辑分离，这似乎组件间的通信可能会受到这种模式的影响。然而，事实恰恰相反。架构模式对每个组件进行分离，有助于优化组件执行的任务。


    ![](img/Figure-2.2.jpg)


    **图 2.2：** 设计原则


    # Laravel 中的 MVC


    Laravel 中的 MVC 架构设计对开发者、架构师以及应用程序用户都有许多优势。


    # 特性


    以下是 Laravel 中 MVC 的特性：


    *   SEO 友好

    *   测试驱动开发

    *   可维护性与扩展性

    *   同步开发


