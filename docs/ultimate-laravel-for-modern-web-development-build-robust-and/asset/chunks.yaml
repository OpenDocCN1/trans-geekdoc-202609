    \n```php\npublic function toMail(object $notifiable): MailMessage\n{\n    return\
    \ (new MailMessage)->view(\n        'emails.name', ['order' => $this->order]\n\
    \    );\n}\n```\n\nYou may define a plain-text view for the mail message by supplying\
