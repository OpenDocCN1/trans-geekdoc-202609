    public function toMail(object $notifiable): MailMessage\n{\n    return (new MailMessage)->view(\n\
    \        'emails.name', ['order' => $this->order], 'text'\n    );\n}\n```\n"
  raw: 'Notification delivery can be slow, particularly if the channel has to use
    an external API to provide the message. Allow your notification to be queued by
    including the `ShouldQueue` interface and `Queueable` trait in your class to improve
    the response time of your application. You may add the interface and trait to
    your notification class right away because they are already imported for all notifications
    created with the `make:notification` command:


    `<?php`


    `namespace App\Notifications;`


    `use Illuminate\Bus\Queueable;`


    `use Illuminate\Contracts\Queue\ShouldQueue;`


    `use Illuminate\Notifications\Notification;`


    `class orderRecieved extends Notification implements ShouldQueue`


    `{`


    `use Queueable;`


    `// Logic`


    `}`


    After your notice has been updated with the `ShouldQueue` interface, you may send
    it normally. When a class has the `ShouldQueue` interface, Laravel will recognize
    it and queue up the notification delivery automatically:


    `$user->notify(new orderRecieved($invoice));`


    Every recipient and channel combination will result in the creation of a queued
    job when queueing notifications. For instance, if your notice includes two channels
    and three receivers, six jobs will be added to the queue.


    # [Delaying Notifications](#toc.xhtml#s253a)


    You may link the `delay` method onto your notification instantiation to postpone
    the notice’s delivery:


    `$delay = now()->addMinutes(10);`


    `$user->notify((new orderRecieved($invoice))->delay($delay));`


    The `delay` function allows you to supply an array to set the delay amount for
    each channels:


    `$user->notify((new orderRecieved($invoice))->delay([`


    `‘mail’ => now()->addMinutes(2),`


    `‘sms’ => now()->addMinutes(5),`


    `]));`


    As an alternative, the notification class itself may define a `withDelay` method.
    Channel names and delay values should be returned as an array by the `withDelay`
    method:


    `public function withDelay(object $notifiable): array`


    `{`


    `return [`


    `‘mail’ => now()->addMinutes(2),`


    `‘sms’ => now()->addMinutes(5),`


    `];`


    `}`


    # [Custom Notification Queue](#toc.xhtml#s254a)


    Queued alerts will be automatically queued over the default queue connection of
    your application. You may call the `onConnection` function from your notification’s
    constructor if you want to choose a different connection to be utilized for a
    certain notification:


    `<?php`


    `namespace App\Notifications;`


    `use Illuminate\Bus\Queueable;`


    `use Illuminate\Contracts\Queue\ShouldQueue;`


    `use Illuminate\Notifications\Notification;`


    `class orderRecieved extends Notification implements ShouldQueue`


    `{`


    `use Queueable;`


    `public function __construct()`


    `{`


    `$this->onConnection(‘redis’);`


    `}`


    `}`


    Alternatively, you may define a `viaConnections` function on your notification
    to indicate which queue connection should be utilized for each notification channel
    that the notification supports. An array of channel name / queue connection name
    pairs ought to be the result of this method:


    `public function viaConnections(): array`


    `{`


    `return [`


    `‘mail’ => ‘redis’,`


    `‘database’ => ‘sync’,`


    `];`


    `}`


    # [Custom Notification Channel Queue](#toc.xhtml#s255a)


    You may define a `viaQueues` method on your notification to indicate which queue
    should be utilized for each notification channel that the notification supports.
    An array of channel name / queue name pairs ought to be the result of this method:


    `public function viaQueues(): array`


    `{`


    `return [`


    `‘mail’ => ‘mail-queue’,`


    `‘slack’ => ‘slack-queue’,`


    `];`


    `}`


    When queued alerts are sent within database transactions, the queue may handle
    them before the database transaction commits. Any adjustments you make to models
    or database records during the database transaction may not yet be reflected in
    the database if this occurs. Furthermore, any models or database entries produced
    during the transaction may no longer exist in the database. If your notification
    is based on these models, unanticipated problems may arise during the processing
    of the task that sends the queued notice.


    If the `after_commit` configuration option for your queue connection is set to
    `false`, you may still specify that a specific queued notification be dispatched
    after all open database transactions have been committed by utilizing the `afterCommit`
    method when delivering the notification:


    `use App\Notifications\orderRecieved;`


    `$user->notify((new orderRecieved($order))->afterCommit());`


    Or call the afterCommit method from constructor of notification.


    `<?php`


    `namespace App\Notifications;`


    `use Illuminate\Bus\Queueable;`


    `use Illuminate\Contracts\Queue\ShouldQueue;`


    `use Illuminate\Notifications\Notification;`


    `class orderRecieved extends Notification implements ShouldQueue`


    `{`


    `use Queueable;`


    `public function __construct()`


    `{`


    `$this->afterCommit();`


    `}`


    `}`


    After a queued notification is dispatched for background processing, it is normally
    received by a queue worker and delivered to its designated receiver.


    If you want to make the ultimate decision on whether to send a queued notification
    after it has been processed by a queue worker, you may specify a `shouldSend`
    method on the notification class. The notice will not be delivered if this method
    returns `false`:


    `public function shouldSend(object $notifiable, string $channel): bool`


    `{`


    `return $this->order->isMade();`


    `}`


    # [On-Demand Notifications](#toc.xhtml#s256a)


    You may need to send a notice to someone who is not registered as a user of your
    program on occasion. Before delivering the message, you may supply ad-hoc notification
    routing information using the message facade’s `route` method:


    `use Illuminate\Broadcasting\Channel;`


    `use Illuminate\Support\Facades\Notification;`


    `Notification::route(‘mail’, ‘abc@example.com’)`


    `->route(‘vonage’, ‘5555555555’)`


    `->route(‘slack’, ‘#slack-new’)`


    `->route(‘broadcast’, [new Channel(‘channel-name’)])`


    `->notify(new orderRecieved($order));`


    If you want to include the recipient’s name while sending an on-demand notice
    to the mail route, use an array with the email address as the key and the name
    as the value of the first element:


    `Notification::route(‘mail’, [`


    `‘qwerty@example.com’ => ‘Sample Name’,`


    `])->notify(new orderRecieved($order));`


    # [Mail Notifications](#toc.xhtml#s257a)


    If a notice can be sent as an email, the notification class should include a `toMail`
    function. This function should return an `IlluminateNotificationsMessagesMailMessage`
    instance after receiving a `$notifiable` entity.


    The `MailMessage` class has a few simple methods for creating transactional email
    messages. Lines of text and a call to action can be included in email communications.
    Let’s look at an example of the `toMail` method:


    `public function toMail(object $notifiable): MailMessage`


    `{`


    `$url = url(‘/order/’.$this->invoice->id);`


    `return (new MailMessage)`


    `->greeting(‘Hello!’)`


    `->line(‘We have recieved your order’)`


    `->lineIf($this->amount > 0, “Amount paid: {$this->amount}”)`


    `->action(‘View Bill’, $url)`


    `->line(‘Thank you for using our application!’);`


    `}`


    In this example, we have a welcome, a line of text, a call to action, and another
    line of text. The `MailMessage` object’s methods make it simple and quick to prepare
    tiny transactional emails. The message components will subsequently be translated
    by the mail channel into a beautiful, responsive HTML email design with a plain-text
    equivalent.


    Instead of setting the *lines* of text in the notification class, you may use
    the view function to define a custom template for rendering the notification email:


    `public function toMail(object $notifiable): MailMessage`


    `{`


    `return (new MailMessage)->view(`


    `‘emails.name’, [‘order’ => $this->order]`


    `);`


    `}`


    You may define a plain-text view for the mail message by supplying the view name
    to the `view` method as the second member of an array:


    `public function toMail(object $notifiable): MailMessage`


    `{`


