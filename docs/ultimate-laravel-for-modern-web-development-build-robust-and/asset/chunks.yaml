    storage:


    By adding a **newUniqueId** function to a model, you can modify how a UUID is
    generated for that particular model. Additionally, you may define a **uniqueIds**
    function on the model to indicate which columns should get UUIDs:


    `use Ramsey\Uuid\Uuid;`


    `/**`


    `* Generate a new UUID for the model.`


    `*/`


    `public function newUniqueId(): string`


    `{`


    `return (string) Uuid::uuid4();`


    `}`


    `/**`


    `* Get the columns that should receive a unique identifier.`


    `*`


    `* @return array<int, string>`


    `*`


    `*/`


    `public function uniqueIds(): array`


    `{`


    `return [‘id’, ‘offer_code’];`


    `}`


    You are free to use **ULIDs** instead of UUIDs if you choose. ULIDs are identical
    to UUIDs; however, they only have 26 characters. ULIDs can be lexicographically
    sorted for effective database indexing, just like ordered UUIDs.


    Use the `Illuminate\Database\Eloquent\Concerns\HasUlids` trait on your model to
    make use of ULIDs. Additionally, make sure the model contains a main key column
    that is equivalent to ULID.


    # [Database Connections](#toc.xhtml#s148a)


    All Eloquent models will automatically use the default database connection set
    up for your application. You should define a `$connection` property on the model
    if you want to specify a different connection to be utilized when interacting
    with a specific model:


    `<?php`


    `namespace App\Models;`


    `use Illuminate\Database\Eloquent\Model;`


    `class Office extends Model`


    `{`


    `/**`


    `* The database connection that should be used by the model.`


    `*`


    `* @var string`


    `*`


    `* Code Logic`


    `*/`


    `protected $connection = ‘sqlite’;`


    `}`


    # [Retrieving Models](#toc.xhtml#s149a)


    You are prepared to begin data retrieval from your database once you have generated
    a model and the corresponding database table. Each Eloquent model may be viewed
    as a potent query builder that enables you to fluidly query the database table
    connected to the model. The model’s `all` method will get every entry from the
    database table it’s linked to:


    `use App\Models\Office;`


    `foreach (Office::all() as $office) {`


    `echo $office->name;`


    `}`


    ![](images/Figure-5.4.jpg)


    **Figure 5.4:** Retrieving Models


    # [Collections](#toc.xhtml#s150a)


    The fundamental `Illuminate\Support\Collection` class from Laravel, which offers
    a number of useful methods for interacting with data collections, is extended
    by the `Eloquent` Collection class. For instance, based on the outcomes of an
    invoked closure, the `reject` method may be used to delete models from a collection:


    `$offices = Office::where(‘location’, ‘NYC’)->get();`


    `$offices = $offices->reject(function (Office $office) {`


    `return $office->cancelled;`


    `});`


    The Eloquent collection class has a few extra methods in addition to those offered
    by Laravel’s standard collection class that are specifically designed for working
    with collections of Eloquent models.


    You may loop over collections as if they were an array because Laravel’s collections
    all adhere to PHP’s iterable interfaces:


    `foreach ($offices as $office) {`


    `echo $office->id;`


    `}`


    # [Chunking Results](#toc.xhtml#s151a)


    If you try to use the `all` or `get` methods to load tens of thousands of Eloquent
    entries, your application can run out of memory. The `chunk` method can be used
    to process a lot of models more quickly than these other techniques.


    A closure will receive a subset of Eloquent models that were retrieved by the
    `chunk` method and processed. When working with a large number of models, the
    `chunk` approach will result in much less memory use because just the most recent
    chunk of Eloquent models is obtained at a time:


    `use App\Models\Office;`


    `use Illuminate\Database\Eloquent\Collection;`


    `Office::chunk(200, function (Collection $offices) {`


    `foreach ($offices as $office) {`


    `// Code Logic`


    `}`


    `});`


    The number of records you desire to receive each **chunk** is the first input
    supplied to the `chunk` method. For each chunk that is retrieved from the database,
    the closure supplied as the second parameter will be called. Each chunk of records
    supplied to the closure will be retrieved using a database query.


    Use the `chunkById` method if you want to filter the outcomes of the `chunk` method
    based on a column that will also be updated when you iterate through the outcomes.
    In some situations, applying the `chunk` technique could produce erroneous or
    inconsistent outcomes. Internally, the `chunkById` method will always return models
    whose last model in the chunk’s previous chunk has an `id` column larger than
    zero:


    `Office::where(‘closed’, true)`


    `->chunkById(200, function (Collection $offices) {`


    `$offices->each->update([‘closed’ => false]);`


    `}, $column = ‘id’);`


    # [Chunk Using Lazy Collections](#toc.xhtml#s152a)


    In that it conducts the query in pieces behind the scenes, the `lazy` method functions
    similarly to the `chunk` method. However, the `lazy` method returns a flattened
    `LazyCollection` of Eloquent models, allowing you to interact with the results
    as a single stream rather than simply handing each chunk into a callback as is:


    `use App\Models\Office;`


    `foreach (Office::lazy() as $office) {`


    `// Code Logic`


    `}`


    Use the `lazyById` method if you want to filter the outcomes of the `lazy` method
    based on a column that will also be updated as you iterate over the outcomes.
    Internally, the `lazyById` method will always return models whose `id` columns
    are bigger than the ones of the last model in the `chunk` before:


    `Office::where(‘closed’, true)`


    `->lazyById(200, $column = ‘id’)`


    `->each->update([‘closed’ => false]);`


    The `lazyByIdDesc` method allows you to filter the results based on the `id’s`
    descending order.


    # [Cursors](#toc.xhtml#s153a)


    The `cursor` method can be used to drastically reduce your application’s memory
    consumption when iterating through tens of thousands of Eloquent model records,
    similar to the `lazy` method.


    Individual Eloquent models won’t be hydrated until they are iterated through;
    the `cursor` technique will only run one database query. As a result, while iterating
    over the cursor, only one Eloquent model is retained in memory at any given time.


    Internally, the `cursor` method implements the following features using PHP generators:


    `use App\Models\Office;`


    `foreach (Office::where(‘location, ‘NYC’)->cursor() as $office) {`


    `//Code Logic`


    `}`


    An `Illuminate\Support\LazyCollection` instance is returned by the `cursor`. While
    only loading one model into memory at a time, lazy collections let you utilize
    many of the collection methods offered by standard Laravel collections:


    `use App\Models\User;`


    `$users = User::cursor()->filter(function (User $user) {`


    `return $user->age > 18;`


    `});`


    `foreach ($users as $user) {`


    `echo $user->name;`


    `}`


    Because it only keeps one Eloquent model in memory at a time, the `cursor` technique
    consumes far less memory than a standard query, but it will ultimately run out
    of space. This is because PHP’s PDO driver stores all raw query results in its
    internal buffer. Consider switching to the lazy technique if you’re working with
    a lot of Eloquent records.


    # [Advanced Subqueries](#toc.xhtml#s154a)'
