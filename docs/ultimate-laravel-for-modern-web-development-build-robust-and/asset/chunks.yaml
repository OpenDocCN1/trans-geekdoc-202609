  trans: "\nXdebug 默认启动并准备好接收连接。如果你需要在 CLI 中激活 Xdebug，请在你的 Homestead 虚拟机中使用 `sudo\
    \ phpenmod xdebug` 命令。现在，请按照 IDE 中的说明启用调试功能。最后，设置你的浏览器以便通过书签脚本（bookmarklet）或扩展程序启动\
    \ Xdebug。\n\n自动启动向 Web 服务器发送查询的功能测试，比修改测试以通过传递特殊标头或 cookie 来触发调试要简单得多。在你的 Homestead\
    \ 虚拟机中，编辑 `/etc/php/7.x/fpm/conf.d/20-xdebug.ini` 文件并添加以下设置以使 Xdebug 自动启动：\n\n\
    ```\nxdebug.client_host = 192.168.10.1\n```\n\n```\nxdebug.mode = debug\n```\n\
    \n```\nxdebug.start_with_request = yes\n```\n\n在你的 Homestead 虚拟机上使用 `xphp` shell\
    \ 别名来调试 PHP CLI 应用：\n\n```\nxphp /path/to/script\n```\n\n# 结论\n\n在本章中，我们涵盖了测试和调试\
    \ Laravel 应用的关键方面。本章首先介绍了 Laravel 的测试功能，包括预配置的 `phpunit.xml` 文件和辅助测试的帮助函数。我们讨论了测试结构，包括\
    \ `Feature` 和 `Unit` 测试文件夹，并强调了测试应用不同方面的重要性。本章深入探讨了测试环境的设置、`.env.testing` 文件以及\
    \ `CreatesApplication` 特性（trait）。\n\n本章解释了 Laravel 中的测试周期，涵盖了测试的创建与执行、报告、性能分析和并行执行。我们讨论了\
    \ HTTP 测试，包括发送请求、自定义标头、处理 cookie 以及身份验证。此外，它还提供了调试响应、处理异常和测试文件上传的见解。本章最后解释了如何在\
    \ Laravel Homestead 环境下使用 Xdebug 进行单步调试。\n\n在整个章节中，我们提供了各种代码示例和实用技巧，以帮助读者在他们的\
    \ Laravel 应用中有效地理解并实现测试和调试技术。本章旨在为开发者提供必要的知识和工具，以创建出健壮且经过良好测试的 Laravel 应用。\n\n\
    在下一章中，我们将查看 Laravel 的邮件和通知功能，该功能为 API 提供了支持。\n\n# 重点要点\n\n- 测试 Laravel 应用涉及一种结构化的方法，区分\
    \ `Unit` 和 `Feature` 测试。`Unit` 测试侧重于孤立的代码段，评估单个函数；而 `Feature` 测试则探索组件之间的交互，包括复杂的动态和\
    \ HTTP 请求评估。强调跨应用多个侧面的全面测试确保了代码库的健壮。配置测试环境至关重要，涉及 `phpunit.xml` 文件的调整以及利用 `.env.testing`\
    \ 文件进行特定的测试配置。`CreatesApplication` 特性有助于在测试前无缝引导 Laravel 应用，确保流畅的体验。\n\n- 理解测试周期至关重要，涵盖了测试的创建、执行、报告和性能分析。高效的并行执行可以缩短测试时间，优化测试过程。Laravel\
    \ 中的 HTTP 测试涉及查询应用和验证用户的强大工具，需要精通标头自定义、cookie 设置、会话管理和用户验证。调试技术涉及 Laravel Homestead\
    \ 中的 `dump`、`dd` 和 `Xdebug` 等工具用于单步调试。文件上传测试需要对 `UploadedFile` 类和 `Storage` Facade\
    \ 功能进行审查，确保严格验证和系统完整性。\n\n- 遵循最佳实践（例如强制最小测试覆盖率和应用性能分析）可以保证代码库的可靠性。在测试阶段保持一致的环境配置对于避免差异至关重要，有助于高效转换。团队成员之间的协作和开放通信增强了测试和调试的执行，详尽的文档作为宝贵的知识共享资源，促进团队内部的持续学习。\n\
    \n# 第 9 章：Laravel 中的邮件与通知\n\n# 引言\n\n本章专注于 Laravel 的邮件和通知功能，该功能为 API 提供了支持。通知提供了监控、接收警报和评估\
    \ Laravel 应用性能的一种极方式。\n\n# 结构\n\n在本章中，我们将涵盖以下主题：\n\n- 生成通知\n- 发送通知\n    - 传递通道\n\
    \    - 队列通知\n    - 延迟通知\n    - 自定义通知队列\n    - 自定义通知通道队列\n    - 随需通知\n- 邮件通知\n\
    \    - 自定义邮件组件\n    - 自定义模板\n    - 处理原始数据\n    - 标签和元数据\n    - 自定义 Symfony 消息\n\
    - 广播通知\n- 通知事件\n\n# 生成通知\n\n每个类（通常保存在 `app/Notifications` 目录中）代表 Laravel 中的每个通知。当你在程序中使用\
    \ `make:notification` 命令时，该目录将在应用中生成：\n\n```\nphp artisan make:notification orderRecieved\n\
    ```\n\n使用此命令将向你的 `app/Notifications` 目录添加一个新的通知类。每个通知类都包含一个 `via` 方法以及多种消息构建方法（如\
    \ `toMail` 或 `toDatabase`），这些方法将通知转换为特定于通道的消息。\n\n# 发送通知\n\n可以使用 `Notification`\
    \ Facade 或 `Notifiable` 特性的 `notify` 方法来发布通知。默认情况下，你应用中的 `App\\Models\\User` 模型已经包含了\
    \ `Notifiable` 特性：\n\n```php\n<?php\n\nnamespace App\\Models;\nuse Illuminate\\\
    Foundation\\Auth\\User as Authenticatable;\nuse Illuminate\\Notifications\\Notifiable;\n\
    \nclass User extends Authenticatable\n{\n    use Notifiable;\n}\n```\n\n该特性的 `notify`\
    \ 函数预期接收以下通知实例：\n\n```php\nuse App\\Notifications\\orderRecieved;\n$user->notify(new\
    \ orderRecieved($order));\n```\n\n向向多个可通知实体分发通知的有效方法是利用 `Notification` Facade。通过调用\
    \ `send` 函数并提供通知对象以及相关的可通知实体，你可以方便地向一组用户或接收者交付通知。\n\n```php\nuse Illuminate\\\
    Support\\Facades\\Notification;\nNotification::send($users, new orderRecieved($order));\n\
    ```\n\n你也可以使用 `sendNow` 方法立即发送通知。即使通知实现了 `ShouldQueue` 接口，此方法也会立即发送通知：\n\n```php\n\
    Notification::sendNow($developers, new DeploymentCompleted($deployment));\n```\n\
    \n# 传递通道\n\n每个通知类都包含一个 `via` 方法，该方法决定了通过哪些特定通道调度通知。可以使用各种通道，如 `mail`、`database`、`broadcast`、`Vonage`\
    \ 和 `Slack` 来发送通知。\n\n`via` 方法接收一个 `$notifiable` 实例——接收通知的类的实例。要选择在哪些通道发送通知，可以使用\
    \ `$notifiable`：\n\n```php\npublic function via(object $notifiable): array\n{\n\
    \    return $notifiable->prefers_sms ? ['vonage'] : ['mail', 'database'];\n}\n\
    ```\n\n# 队列通知\n"
- fmt: "\nNotification delivery can be slow, particularly if the channel has to use\
    \ an external API to provide the message. Allow your notification to be queued\
    \ by including the `ShouldQueue` interface and `Queueable` trait in your class\
    \ to improve the response time of your application. You may add the interface\
    \ and trait to your notification class right away because they are already imported\
    \ for all notifications created with the `make:notification` command:\n\n```php\n\
    <?php\nnamespace App\\Notifications;\nuse Illuminate\\Bus\\Queueable;\nuse Illuminate\\\
    Contracts\\Queue\\ShouldQueue;\nuse Illuminate\\Notifications\\Notification;\n\
    \nclass orderRecieved extends Notification implements ShouldQueue\n{\n    use\
    \ Queueable;\n    // Logic\n}\n```\n\nAfter your notice has been updated with\
    \ the `ShouldQueue` interface, you may send it normally. When a class has the\
    \ `ShouldQueue` interface, Laravel will recognize it and queue up the notification\
    \ delivery automatically:\n\n```php\n$user->notify(new orderRecieved($invoice));\n\
    ```\n\nEvery recipient and channel combination will result in the creation of\
    \ a queued job when queueing notifications. For instance, if your notice includes\
    \ two channels and three receivers, six jobs will be added to the queue.\n\n#\
    \ Delaying Notifications\n\nYou may link the `delay` method onto your notification\
    \ instantiation to postpone the notice’s delivery:\n\n```php\n$delay = now()->addMinutes(10);\n\
    $user->notify((new orderRecieved($invoice))->delay($delay));\n```\n\nThe `delay`\
    \ function allows you to supply an array to set the delay amount for each channels:\n\
    \n```php\n$user->notify((new orderRecieved($invoice))->delay([\n    'mail' =>\
    \ now()->addMinutes(2),\n    'sms' => now()->addMinutes(5),\n]));\n```\n\nAs an\
    \ alternative, the notification class itself may define a `withDelay` method.\
    \ Channel names and delay values should be returned as an array by the `withDelay`\
    \ method:\n\n```php\npublic function withDelay(object $notifiable): array\n{\n\
    \    return [\n        'mail' => now()->addMinutes(2),\n        'sms' => now()->addMinutes(5),\n\
    \    ];\n}\n```\n\n# Custom Notification Queue\n\nQueued alerts will be automatically\
    \ queued over the default queue connection of your application. You may call the\
    \ `onConnection` function from your notification’s constructor if you want to\
    \ choose a different connection to be utilized for a certain notification:\n\n\
    ```php\n<?php\nnamespace App\\Notifications;\nuse Illuminate\\Bus\\Queueable;\n\
    use Illuminate\\Contracts\\Queue\\ShouldQueue;\nuse Illuminate\\Notifications\\\
    Notification;\n\nclass orderRecieved extends Notification implements ShouldQueue\n\
    {\n    use Queueable;\n    public function __construct()\n    {\n        $this->onConnection('redis');\n\
    \    }\n}\n```\n\nAlternatively, you may define a `viaConnections` function on\
    \ your notification to indicate which queue connection should be utilized for\
    \ each notification channel that the notification supports. An array of channel\
    \ name / queue connection name pairs ought to be the result of this method:\n\n\
    ```php\npublic function viaConnections(): array\n{\n    return [\n        'mail'\
    \ => 'redis',\n        'database' => 'sync',\n    ];\n}\n```\n\n# Custom Notification\
    \ Channel Queue\n\nYou may define a `viaQueues` method on your notification to\
    \ indicate which queue should be utilized for each notification channel that the\
    \ notification supports. An array of channel name / queue name pairs ought to\
    \ be the result of this method:\n\n```php\npublic function viaQueues(): array\n\
    {\n    return [\n        'mail' => 'mail-queue',\n        'slack' => 'slack-queue',\n\
    \    ];\n}\n```\n\nWhen queued alerts are sent within database transactions, the\
    \ queue may handle them before the database transaction commits. Any adjustments\
    \ you make to models or database records during the database transaction may not\
    \ yet be reflected in the database if this occurs. Furthermore, any models or\
    \ database entries produced during the transaction may no longer exist in the\
    \ database. If your notification is based on these models, unanticipated problems\
    \ may arise during the processing of the task that sends the queued notice.\n\n\
    If the `after_commit` configuration option for your queue connection is set to\
    \ `false`, you may still specify that a specific queued notification be dispatched\
    \ after all open database transactions have been committed by utilizing the `afterCommit`\
    \ method when delivering the notification:\n\n```php\nuse App\\Notifications\\\
    orderRecieved;\n$user->notify((new orderRecieved($order))->afterCommit());\n```\n\
    \nOr call the `afterCommit` method from constructor of notification.\n\n```php\n\
    <?php\nnamespace App\\Notifications;\nuse Illuminate\\Bus\\Queueable;\nuse Illuminate\\\
    Contracts\\Queue\\ShouldQueue;\nuse Illuminate\\Notifications\\Notification;\n\
    \nclass orderRecieved extends Notification implements ShouldQueue\n{\n    use\
    \ Queueable;\n    public function __construct()\n    {\n        $this->afterCommit();\n\
    \    }\n}\n```\n\nAfter a queued notification is dispatched for background processing,\
    \ it is normally received by a queue worker and delivered to its designated receiver.\n\
    \nIf you want to make the ultimate decision on whether to send a queued notification\
    \ after it has been processed by a queue worker, you may specify a `shouldSend`\
    \ method on the notification class. The notice will not be delivered if this method\
    \ returns `false`:\n\n```php\npublic function shouldSend(object $notifiable, string\
    \ $channel): bool\n{\n    return true; // example logic\n}\n```\n\n# On-Demand\
    \ Notifications\n\nYou may need to send a notification to someone who is not registered\
    \ as a user. Before delivering the message, you may supply ad-hoc routing information\
    \ using the facade’s `route` method:\n\n```php\nuse Illuminate\\Broadcasting\\\
    Channel;\nuse Illuminate\\Support\\Facades\\Notification;\n\nNotification::route('mail',\
    \ 'abc@example.com')\n    ->notify(new OrderShipped($order));\n```\n\nIf you want\
    \ to include the recipient’s name while sending an on-demand notice, use an array\
    \ with the email address as the key and the name as the value:\n\n```php\nNotification::route('mail',\
    \ [\n    'qwerty@example.com' => 'Sample Name',\n])->notify(new OrderShipped($order));\n\
    ```\n\n# Mail Notifications\n\nIf a notice can be sent as an email, the notification\
    \ class should include a `toMail` function. This function should return an `MailMessage`\
    \ instance after receiving a `$notifiable` entity.\n\nThe `MailMessage` class\
    \ has a few simple methods for creating transactional email messages. Lines of\
    \ text and a call to action can be included in email communications. Let’s look\
    \ at an example of the `toMail` method:\n\n```php\npublic function toMail(object\
    \ $notifiable): MailMessage\n{\n    $url = url('/order/'.$this->invoice->id);\n\
    \    return (new MailMessage)\n        ->greeting('Hello!')\n        ->line('We\
    \ have received your order')\n        ->lineIf($this->amount > 0, \"Amount paid:\
    \ {$this->amount}\")\n        ->action('View Bill', $url)\n        ->line('Thank\
    \ you for using our application!');\n}\n```\n\nIn this example, we have a welcome,\
    \ a line of text, a call to action, and another line of text. The `MailMessage`\
    \ object’s methods make it simple and quick to prepare tiny transactional emails.\
    \ The message components will subsequently be translated by the mail channel into\
    \ a beautiful, responsive HTML email design with a plain-text equivalent.\n\n\
    Instead of setting the lines of text in the notification class, you may use the\
