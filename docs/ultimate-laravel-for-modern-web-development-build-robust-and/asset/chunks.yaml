  trans: "\nLaravel 了一了一系列功能丰富的特性，这些特性简化了开发过程，并允许开发者专注于应用程序的核心功能。该框架既适用于 Web 开发领域的初学者，也适用于该领域的专家。\n\
    \nLaravel 是一个 PHP Web 框架，提供了构建现代全栈 Web 应用的能力。\n\n它是一个开源框架，其文档可以在 [`www.laravel.com/`](https://www.laravel.com/)\
    \ 获取。\n\n## 为什么偏爱 Laravel\n\n在不断变化的技术版图中，有许多框架涌入市场。在本章的这一节中，我们将探索是什么让 Laravel\
    \ 在其他应用开发框架中脱颖而出且独特的。\n\n## 可扩展性\n\nPHP 是一种可扩展的语言，Laravel 为诸如 `Redis` 等快速分布式缓存系统提供了内置支持，使得框架支持水平扩展。过去的\
    \ Laravel 应用已经能够扩展到每月处理数亿请求。\n\nLaravel 平台（如 `Laravel Vapor`）为 Laravel 开发提供了无服务器（serverless）能力。它由\
    \ Amazon Web Services (AWS) 驱动，使得在 Laravel 开发中引入 AWS 功能变得简单且易维护。\n\n## MVC 架构\n\
    \nLaravel 框架基于模型-视图-控制器模式（MVC 模式），这使得应用程序的业务逻辑和表现层分离，通过提高性能增强了框架的强大。这一概念在本书的 *第\
    \ 2 章，Laravel 中的 MVC 架构* 中进行了深入讨论。\n\n## 社区\n\nLaravel 拥有一个强大且活跃的社区。该项目开源的，拥有活跃的贡献者、讨论论坛和强大的开发者社区。Laravel\
    \ 社区的实力使得框架的新开发者能够找到良好的文档，并方便他们使用 Laravel 进行学习和开发。此外，Laravel 被许多开发者采用，导致在开发过程中遇到问题时需求和支持增加。这降低了新手开发者的入门门槛，并营造了一个友好且支持的环境。\n\
    \n## 类依赖管理\n\nLaravel 框架由反转控制容器（IoC 容器）驱动，它实现了类依赖管理。它通过无需配置自动解析类的能力使框架变得强大。\n\n\
    依赖关系在运行时处理，这提供了灵活性，因为依赖实现可以轻松更换。IoC 容器解析依赖的两种方式是 `Closure` 回调和自动解析。\n\n## Eloquent\
    \ ORM\n\nLaravel 框架启用了 Eloquent 对象关系映射（ORM），允许 Laravel 开发者使用 PHP 语法而非 SQL 语法进行编写。它为处理应用程序数据库提供了一种实现\
    \ `ActiveRecord` 的极佳且优的方式。Eloquent ORM 在本书的 *第 5 章，使用 Eloquent ORM 和查询构造器* 中有更深入的。\n\
    \nLaravel 是一个强大、健壮且开发者友好的框架，提供了开发应用程序的现代能力*图 1.1* 展示了让开发者偏爱 Laravel 的核心支柱。\n\n\
    ![](img/Figure-1.1.jpg)\n\n**图 1.1:** Laravel 的核心支柱\n\nLaravel 还提供了以下功能：\n\n*\
    \   **URL 路由配置**\n    允许在同一网页中查看链接内容，而不是重定向到链接。通过 Laravel 内置的文件配置，它被加载到框架中并为应用程序用户提供无缝体验。\n\
    \n*   **邮件服务**\n    Laravel 拥有 `Swiftmailer` 库，能够为单个电子邮件账户提供清晰直接的 API 配置。它提供了驱动程序，允许通过云服务和本地服务发送消息。\n\
    \    部分驱动程序包括 `SMTP`、`Mailgun`、`Mandrill`、`SparkPost`、PHP 的 `mail` 和 `Sendmail`\
    \ 函数以及 Amazon `SES`。\n\n*   **消息队列系统**\n    Laravel 通过其内置的队列系统启用并驱动了消息队列系统，这是一个能够在后台运行任务的简单\
    \ API。它还支持 `Redis`、`SQS` 等许多其他消息队列。\n\n*   **调度**\n    Laravel 提供了自定义任务和作业的能力，无需开发者在系统级别进行设置。Laravel\
    \ `CRON` 任务是 Laravel 内置的实用，以用户友的方式提供了调度功能。\n\n*   **身份验证与授权**\n    让 Laravel 框架深受喜爱的关键因素是能够轻松控制资源的访问并组织身份验证逻辑。\n\
    \    Laravel 站点所有者可以无缝简化身份验证，框架在处理授权和验证时为所有者提供了灵活性安全性。\n\n## Laravel 的独特特性\n\n\
    Laravel 在整个开发者生态系统中被广泛采用，已成为开发者开发应用程序的首选框架。让 Laravel 独特之处在于它多多化的特性。让我们探索 Laravel\
    \ 的这些独特特性。\n\n## 种子（Database Seeding）\n\nLaravel 框架能够使用种子类（seed classes）用种子数据填充数据库表。这些种子类存储在\
    \ `database/seeders` 目录下，并定义了一个默认的 `DatabaseSeeder` 类。\n\n该类可以根据应用程序的要求进行修改。\n\
    \n让我们写一个 `DatabaseSeeder` 类示例来添加植物及其物种名称：\n\n```php\n<?php\n\nnamespace Database\\\
    Seeders;\n\nuse Illuminate\\Database\\Seeder;\nuse Illuminate\\Support\\Facades\\\
    DB;\nuse Illuminate\\Support\\Str;\n\nclass DatabaseSeeder extends Seeder\n{\n\
    \    /**\n     * 运行数据库种子器。\n     */\n    public function run(): void\n    {\n\
    \        DB::table('plants')->insert([\n            'name' => Str::random(10),\n\
    \            'species' => Str::random(10)\n        ]);\n    }\n}\n```\n\n## 本地化\n\
    \n为了全球化并适应全球范围内不同语言的用户，Laravel 提供了本地化功能，能够获取不同语言的字符串。这使得 Laravel 应用程序支持多种语言。\n\
    \n实现翻译字符串有两种方式：\n\n*   `lang` 目录\n    语言字符串必须存储在 `lang` 目录。同时也支持为应用程序支持的每种语言包含子目录。通过此功能，Laravel\
    \ 可以管理内置特性的翻译字符串，例如验证错误消息。\n\n    `/lang`\n    `/en`\n    `messages.php`\n   \
    \ `/es`\n    `messages.php`\n\n*   **JSON 文件**\n    翻译字符串也可以放置在 JSON 文件中，必须存储在\
    \ `lang` 目录结构中。在这种方法中，应用程序支持的每种语言将位于单独的 JSON 文件，列在 `lang` 目录下。\n    在处理大量翻译字符串时，必须优先这种方法。\n\
    \n    `/lang`\n    `en.json`\n    `es.json`\n\n在这种情况下，配置本地区域（locale）也是非常简单的。默认情况下，应用程序的默认语言存储在\
    \ `config/app.php` 配置文件的 `locale` 配置选项中。\n\n可以使用 `App` Facade 的 `setLocale` 方法在运行时为单个\
    \ HTTP 请求修改默认语言。\n\n```php\nuse Illuminate\\Support\\Facades\\App;\n\nRoute::get('/greeting/{locale}',\
    \ function (string $locale) {\n    if (! in_array($locale, ['en', 'es'])) {\n\
    \        abort(400);\n    }\n\n    App::setLocale($locale);\n\n    // …\n});\n\
    ```\n"
- fmt: "\nIt is also a good practice to configure a fallback language. This should\
    \ be configured in the `config/app.php` configuration file.\n\nThe syntax to set\
    \ a fallback language is as follows:\n\n```\n‘falback_locale’ => ‘<language>’\n\
    ```\n\nAn example, to set the fallback language as English:\n\n```\n‘falback_locale’\
    \ => ‘en’\n```\n\nTo determine the current locale, the `currentLocale` and `isLocale`\
    \ methods can be used, as follows:\n\n```php\nuse Illuminate\\Support\\Facades\\\
    App;\n\n$locale = App::currentLocale();\n\nif (App::isLocale(‘es’)) {\n    //\
    \ …\n}\n```\n\n# Latest Version Release Changes\n\n[#latest-version-release-changes](#toc.xhtml#s13a)\n\
    \nLaravel 10 is the current Laravel version in use. If you already have a previous\
    \ version of Laravel, you can continue to upgrade it. Alternatively, if you are\
    \ new, follow the next section of the chapter on how to install Laravel.\n\n#\
    \ How to Upgrade\n\nIn order to upgrade any existing Laravel projects to Laravel\
    \ 10, updating the dependencies is the most crucial step. The documentation for\
    \ the upgrade is available at [https://laravel.com/docs/10.x/upgrade](https://laravel.com/docs/10.x/upgrade)\n\
    \nLet’s explore how to upgrade to Laravel 10 to get the latest features and make\
    \ the necessary changes to upgrade our existing Laravel applications.\n\n# Dependencies\n\
    \nLaravel requires PHP `8.1.0` or higher and Composer version `2.20` or higher.\n\
    \nThe following dependencies need to be upgraded in the Laravel applications `composer.json`\
    \ file:\n\n| Dependency | Version |\n| --- | --- |\n| laravel/framework | ^10.0\
    \ |\n| laravel/sanctum | ^3.2 |\n| doctrine/dbal | ^3.0 |\n| spatie/laravel-ignition\
    \ | ^2.0 |\n| laravel/passport | ^11.0 |\n\n**Table 1.1:** `composer.json` dependencies\
    \ for Laravel 10\n\nAdditionally, if you wish to use PHPUnit 10, then delete the\
    \ `processUncoveredFiles` attribute from the `<coverage>` section of `phpunit.xml`,\
    \ and update the following in the `composer.json` file:\n\n| Dependency | Version\
    \ |\n| --- | --- |\n| nunomaduro/collision | ^7.0 |\n| phpunit/phpunit | ^10.0\
    \ |\n\n**Table 1.2:** `composer.json` dependencies for Laravel 10 if using PHPUnit\
    \ 10\n\nFurthermore, verify support for any other third-party packages used in\
    \ your application with Laravel 10.\n\n# Minimum Stability\n\nThe `minimum-stability`\
    \ setting in the `composer.json` needs to be set to the value `stable:`:\n\n```\n\
    “minimum-stability”: “stable”,\n```\n\nThe default value of `minimum-stability`\
    \ is now stable; so you may also choose to remove this completely.\n\n# Public\
    \ Path Binding\n\nUpdate your code in your Laravel application to invoke the `usePublicPath`\
    \ method of the `Illuminate\\Foundation\\Application` object. This should be done\
    \ instead of customizing its `public path` binding to `path.public` into the container:\n\
    \n```php\napp()->usePublicPath(__DIR__.’/public’);\n```\n\n# Redis Cache Tags\n\
    \nThe Redis cache tag has been rewritten in the Laravel version update for better\
    \ performance and efficient storage capabilities. Laravel has a new `cache:prune-stale-tags`\
    \ Artisan command that needs to be scheduled in the application’s `App\\Console\\\
    Kernel` class:\n\n```php\n$schedule->command(‘cache:prune-stale-tags’)->hourly();\n\
    ```\n\n`Adding the above scheduled job will corporate the latest update.`\n\n\
    # Database Expressions\n\nThe database expressions have been rewritten in Laravel\
    \ 10 to make it possible to add functionalities in the future.\n\nThe following\
    \ method and the manual casting need to be replaced with the `getValue` method:\n\
    \n*   Manual casting using `(string)`\n*   `__toString` method\n\nCasting expression\
    \ using `(string)` is not supported in this version.\n\n# Eloquent\n\nThe `$dates`\
    \ property of the Eloquent model is deprecated. The application should update\
    \ the instances with the `$casts` property.\n\nFor example:\n\n```php\nprotected\
    \ $casts = [\n    ‘deployed_at’ => ‘datetime’,\n];\n```\n\n# Testing\n\nThe `MocksApplicationServices`\
    \ trait is removed and deprecated.\n\nThe trait provided the following methods:\n\
    \n*   `expectsEvents`\n*   `expectsJobs`\n*   `expectsNotifications`\n\nThese\
    \ have to be replaced with the following methods (in order):\n\n*   `Event::fake`\n\
    *   `Bus::fake`\n*   `Notification::fake`\n\n# The Language Directory\n\nThe Laravel\
    \ application skeleton does not support the `lang` directory. Any new Laravel\
    \ applications can be published using the `lang:publish` command as follows:\n\
    \n```bash\nphp artisan lang:publish\n```\n\n# Installation and Setup of Laravel\
    \ Development Environment\n\nIn this section, we will look at the setup of the\
    \ Laravel development based on the operating system of the machine. For the three\
    \ commonly used operating systems – Windows, Mac, and Linux – the requirement\
    \ is.\n"
