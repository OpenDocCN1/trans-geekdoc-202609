  trans: "\n重定向响应派自 `Illuminate\\Http\\RedirectResponse` 类，并包含了将用户发送到不同 URL 的适当头部。\n\
    \n## 重定向辅助函数\n\n在 Laravel 中创建重定向简单的方法是使用重定向辅助函数（Redirect Helper）。让我们来看一个在 Laravel\
    \ 中创建重定向的示例：\n\n```php\nRoute::get(/aboutMe, function () {\n    return redirect(/home/aboutMe);\n\
    });\n```\n\n某些情况下，例如提交了错误或不完整的信息，你可能希望让用户返回上一个网页。使用全局 `back` 辅助函数来实现。请确保使用 `back`\
    \ 函数的路由使用了 web 中间件组，或者应用了所有的 session 中间件，因为此功能使用了 session：\n\n```php\nRoute::post(/user/aboutMe,\
    \ function () {\n    // 验证请求\n    return back()->withInput();\n});\n```\n\n##\
    \ 重定向到命名路由\n\n当 Laravel 应用中不带参数使用 `redirect` 辅助函数时会返回一个 `Illuminate\\Routing\\\
    Redirector` 实例，这允许你调用 `Redirector` 实例上的任何方法。例如，你可以使用 `route` 方法创建一个指向特定路由的 `RedirectResponse`：\n\
    \n```php\nreturn redirect()->route(register);\n```\n\n要添加参数将其作为 `route` 方法的第二个参数传递：\n\
    \n```php\n// 对于 URI 为 dashboard/{id} 的路由\nreturn redirect()->route(dashboard,\
    \ ['id' => 1]);\n```\n\nLaravel 还提供了一个全局函数 `to_route`，可用于重定向和路由。\n\n## 重定向到控制器操作\n\
    \n在 Laravel 中，重定向到控制器的操作也是可能的。要实现这一点，请为 `action` 方法提供控制器和操作名称：\n\n```php\nuse\
    \ App\\Http\\Controllers\\EmployeeController;\nreturn redirect()->action([EmployeeController::class,\
    \ 'taxID']);\n```\n\n如果你的控制器路由需要参数，可以作为 `action` 方法的第二个参数添加参数：\n\n```php\nreturn\
    \ redirect()->action(\n    [EmployeeController::class, 'dashboard'], ['id' =>\
    \ 1]\n);\n```\n\n## 重定向 - 闪存会数据（Flashed Session Data）\n\n通常将数据闪存到 session 并重定向到新\
    \ URL 是同时发生的。通常在成功完成一项活动后，我们会向 session 闪存一条成功消息。在单一、流式的方法链中，你可以构建一个 `RedirectResponse`\
    \ 对象并将数据闪存到 session 中以便方便：\n\n```php\nRoute::post(/employee/profile, function\
    \ () {\n    // 更新员工个人资料\n    return redirect(/dashboard)->with('status', 'Employee\
    \ Profile Data updated!');\n});\n```\n\n在将用户发送到不同页面之前，你可以使用 `RedirectResponse`\
    \ 类提供的 `withInput` 方法将当前请求的输入数据闪存到 session 中。每当你执行以下请求时，你可以在数据闪存到 session 后快速恢复这些输入：\n\
    \n```php\nreturn back()->withInput();\n```\n\n当用户被重定向时，你可以显示 session 的闪存消息。例如，使用\
    \ Blade 语法：\n\n```blade\n@if (session('status'))\n    <div class=\"alert alert-success\"\
    >\n        {{ session('status') }}\n    </div\n@endif\n```\n\n## Laravel 中的指令（Directives）\n\
    \n指令是 Laravel 中 Blade 模板中使用的显式指令，用于执行某些逻辑或操作。Laravel 的模板引擎（称为 Blade）允许你为应用程序创建极具表现力、整洁且易读的视图。\n\
    \n在 Laravel 中，指令通过 `@` 符号和指令名称进行标识。它们提供了一种快速且时尚的方法，在 Blade 模板内部运行 PHP 代码，而不会用\
    \ PHP 标签阻塞显示。\n\n![](img/Figure-4.1.jpg)\n\n**图 4.1:** Laravel 中的指令类型\n\n## 条件指令\n\
    \n`if` 指令用于在 Laravel 应用逻辑构建中指定条件。以下是不同的指令，如图 4.2 所示：\n\n![](img/Figure-4.2.jpg)\n\
    \n**图 4.2:** Laravel 中的条件指令\n\n`@if`、`@elseif`、`@else` 和 `@endif` 指令可以创建 if 语句。这些指令执行的任务与\
    \ PHP 等效语句相同：\n\n```blade\n@if (count($fruits) === 1)\n    有一个水果！\n@elseif (count($records)\
    \ > 1)\n    有多个水果。\n@else\n    没有水果。\n@endif\n```\n\n除了已经涵盖的条件指令外，`@isset` 和 `@empty`\
    \ 指令还可以作为其相应 PHP 函数的实际替代品：\n\n```blade\n@isset($fruits)\n    // $fruits 已定义且不为空\n\
    @endisset\n\n@empty($fruits)\n    // $fruits 是“空的”\n@endempty\n```\n\n## 自定义 if\
    \ 语句\n\n在创建基础自定义条件语句时，编写自定义指令往往比需要的更加困难。为了使用闭包轻松构建独特的条件指令，Blade 提供了 `Blade::if`\
    \ 函数。\n\n## Switch 指令\n\n`switch` 指令是 Laravel 中编写逻辑和处理不同场景的重要组成部分。\n\n![](img/Figure-4.3.jpg)\n\
    \n**图 4.3:** Laravel 中的 switch 指令\n\n让我们在代码中使用未使用 `switch` 指令：\n\n```blade\n@switch($i)\n\
    \    @case(1)\n        情况 1\n        @break\n    @case(2)\n        情况 2\n    \
    \    @break\n    @default\n        默认情况\n@endswitch\n```\n\n## Auth 指令\n\n`auth`\
    \ 指令对于维护代码中的身份验证和安全性非常有用。\n\n![](img/Figure-4.4.jpg)\n\n**图 4.4:** Laravel 中的\
    \ Auth 指令\n\n```blade\n@auth\n    // 用户已身份验证\n@endauth\n\n@guest\n    // 用户未身份验证\n\
    @endguest\n```\n\n`@auth` 和 `@guest` 指令允许你定义需要验证的身份守卫：\n\n```blade\n@auth(admin)\n\
    \    // 用户已身份验证\n@endauth\n\n@guest(admin)\n    // 用户未身份验证\n@endguest\n```\n\n\
    Laravel 应用中的身份验证依赖于指令的使用。它鼓励最佳实践并支持开发者通过关注分离管理前端视图。\n\n## 循环\n\n除了条件语句外，Blade\
    \ 还提供了简单的指令来与 PHP 的循环结构进行交互。\n\n![](img/Figure-4.5.jpg)\n\n**图 4.5:** Laravel\
    \ 中的循环指令\n\n再次，这些每个指令执行的任务与其 PHP 等效语句相同：\n\n```blade\n@for ($i = 0; $i < 10; $i++)\n\
    \    i 的当前值是 {{ $i }}\n@endfor\n\n@foreach ($employees as $employee)\n    <p>这是员工\
    \ {{ $employee->id }}</p>\n@endforeach\n\n@forelse ($employees as $employee)\n\
    \    <li>{{ $employee->name }}</li>\n@empty\n    <p>没有员工</p>\n@endforese\n\n@while\
    \ (true)\n    <p>死循环</p>\n@endwhile\n```\n\n使用 `@continue` 和 `@break` 指令，你还可以使用循环来跳过当前迭代或中断循环：\n\
    \n```blade\n@foreach ($employees as $employee)\n    @if ($employee->type == 1)\n\
    \        @continue\n    @endif\n    <li>{{ $employee->name }}</li>\n    @if ($employee->number\
    \ == 5)\n        @break\n    @endif\n@endforeach\n```\n\n继续或中断条件也可以包含在指令声明中：\n\
    \n```blade\n@foreach ($employees as $employee)\n    @continue($employee->type\
    \ == 1)\n    <li>{{ $employee->name }}</li>\n    @break($employee->number == 5)\n\
    @endforeach\n```\n"
- fmt: "\n# Once Directive (#toc.xhtml#s112a)\n\nYou may provide a section of the\
    \ template that will only be evaluated once during each rendering cycle using\
    \ the `@once` directive. This may help leverage stacks to push a specific piece\
    \ of JavaScript into the page’s header.\n\n![](images/Figure-4.6.jpg)\n\n**Figure\
    \ 4.6:** Once Directives and Helper Directives in Laravel\n\nFor instance, if\
    \ you are rendering a certain component repeatedly, you might just want to push\
    \ the JavaScript to the header the first time:\n\n```php\n@once\n@push(‘scripts’)\n\
    <script>\n// Custom JavaScript script\n</script>\n@endpush\n\n@endonce\n```\n\n\
    The `@pushOnce` and `@prependOnce` directives are included for your convenience\
    \ since the `@once` directive is frequently used in combination with the `@push`\
    \ or `@prepend` directives:\n\n```php\n@pushOnce(‘scripts’)\n<script>\n// Custom\
    \ JavaScript script\n</script>\n@endPushOnce\n```\n\n# Blade as Template Engines\
    \ in Laravel (#toc.xhtml#s113a)\n\nThe straightforward yet effective templating\
    \ engine that comes with Laravel is called Blade. In contrast to several PHP templating\
    \ engines, Blade does not prevent you from utilizing raw PHP code in your templates,.\
    \ In reality, Blade adds practically no cost to your application because all templates\
    \ are converted into normal PHP code and cached until they are updated. Blade\
    \ template files normally reside in the `resources/views` directory and have the\
    \ `.blade.php` file extension.\n\nUsing the global `view` helper, Blade views\
    \ may be retrieved from routes or controllers. Additionally, data may be provided\
    \ to the Blade view via the view helper’s second parameter, as explained in the\
    \ documentation on views:\n\n```php\nRoute::get(‘/’, function () {\n    return\
    \ view(‘welcome’, [‘name’ => ‘ABC’]);\n});\n```\n\n# Data in Blade (#toc.xhtml#s114a)\n\
    \nBy enclosing the variable in curly brackets, data that is supplied to your Blade\
    \ views may be shown. Consider the following route, for instance:\n\n```php\n\
    Route::get(‘/’, function () {\n    return view(‘welcome’, [‘name’ => ‘ABC’]);\n\
    });\n```\n\nIn order to display the contents inline of the variables, use double\
    \ curly brackets: `{{variable_name}}`\n\nFor the preceding example, it will be:\n\
    \n```text\nWelcome, {{name}}\n```\n\n# HTML Entity Encoding (#toc.xhtml#s115a)\n\
    \nBlade and Laravel helper double-encode HTML entities by default. Call the `Blade::withoutDoubleEncoding`\
    \ function from your `AppServiceProvider’s boot` method to stop double encoding:\n\
    \n```php\n<?php\n\nnamespace App\\Providers;\n\nuse Illuminate\\Support\\Facades\\\
    Blade;\nuse Illuminate\\Support\\ServiceProvider;\n\nclass AppServiceProvider\
    \ extends ServiceProvider\n{\n    /*\n    * Bootstrap any application services.\n\
    \    */\n    public function boot(): void\n    {\n        Blade::withoutDoubleEncoding();\n\
    \    }\n}\n```\n\n# Components (#toc.xhtml#s116a)\n\nSections, layouts, and inclusions\
    \ all give comparable benefits; nevertheless, some people may find the mental\
    \ model of components and slots simpler to grasp. Class-based components and anonymous\
    \ components are the two methods of writing components.\n\nYou may use the `make:component`\
    \ Artisan command to construct a class-based component. We’ll make an `Alert`\
    \ component to demonstrate how to use components. The component will be placed\
    \ in the `app/View/Components` directory using the `make:component` command:\n\
    \n```bash\nphp artisan make:component Alert\n```\n\nA view template will also\
    \ be produced for the component using the `make:component` command. The `resources/views/components`\
    \ directory will house the view. No further component registration is normally\
    \ needed when creating components for your own application because they are immediately\
    \ found in the `resources/views/components` directory and the `app/View/Components`\
    \ directory:\n\n```bash\nphp artisan make:component Forms/Input\n```\n\nThe aforementioned\
    \ command will place the view in the `resources/views/components/forms` directory\
    \ and an `Input` component in the `app/View/Components/Forms` directory.\n\nUse\
    \ the `--view` option when using `make:controller` if you want to construct an\
    \ anonymous component (a component with simply a Blade template and no class):\n\
    \n```bash\nphp artisan make:component forms.input --view\n```\n\nThe command will\
    \ create a Blade file located at the `input.blade.php` file located at `resources/views/components/forms`\
    \ that can be rendered as a component via `<x-forms.input />`.\n\n# Rendering\
    \ Components (#toc.xhtml#s117a)\n\nYou may use a Blade component tag inside one\
    \ of your Blade templates to show a component. Blade component tags begin with\
    \ the letter `x-` and the component class’s kebab case name:\n\nFor example:\n\
    \n```html\n<x-alert/>\n<x-user-profile/>\n```\n\nUse the character `.` to denote\
    \ directory nesting if the component class is further nested within the `app/View/Components`\
    \ directory. For instance, if we believe a component to be located in `app/View/Components/Inputs/Button.php`,\
    \ we may render it as follows:\n\n```html\n<x-inputs.button/>\n```\n\nYou may\
    \ add a `shouldRender` function to your component class to conditionally render\
    \ your component. The component won’t be rendered if the `shouldRender` function\
    \ returns false:\n\n```php\nuse Illuminate\\Support\\Str;\n\n/*\n* Whether the\
    \ component should be rendered\n*/\npublic function shouldRender(): bool\n{\n\
    \    return Str::length($this->message) > 0;\n}\n```\n\n# Passing Data (#toc.xhtml#s118a)\n\
    \nUsing HTML properties, you may provide data to components. Simple HTML attribute\
    \ strings can be used to the component:\n\n`<x-alert type=\"error\" :message=\"\
    $message\"/>`\n\nThe class constructor of the component should contain:\n\n```php\n\
    <?php\n\nnamespace App\\View\\Components;\n\nuse Illuminate\\View\\Component;\n\
    use Illuminate\\View\\View;\n\nclass Alert extends Component\n{\n    /*\n    *\
    \ Component Instance.\n    */\n    public function __construct(\n        public\
    \ string $type,\n        public string $message\n    ) {}\n\n    /*\n    * Get\
    \ the view that represent the component.\n    */\n    public function render():\
    \ View\n    {\n        return view('components.alert');\n    }\n}\n```\n\nTo display\
    \ the contents of the component, display the values as follows:\n\n```html\n<div\
    \ class=\"alert-{{ $type }}\">\n    {{ $message }}\n</div>\n```\n\n# Layouts (#toc.xhtml#s119a)\n\
    \nThe majority of web applications have the same overall layout across all of\
    \ their pages. If we had to duplicate the full layout HTML in each view we created,\
    \ it would be tremendously time-consuming and difficult to maintain our program.\
    \ We can specify this layout as a single Blade component and utilize it across\
    \ the rest of our application:\n\n```html\n<!-- resources/views/components/layout.blade.php\
    \ -->\n<html>\n<head>\n    <title>{{ $title ?? 'Grocery List' }}</title>\n</head>\n\
    <body>\n    <h1>Things to Buy</h1>\n    <hr/>\n    {{ $item }}\n</body>\n</html>\n\
    ```\n\nWe can make a Blade view that makes use of the `layout` component after\
    \ it has been defined.\n\nFor instance, in this illustration, we’ll create a straightforward\
    \ view to show our task list:\n\n```html\n<!-- resources/views/product.blade.php\
    \ -->\n<x-layout>\n    @foreach ($products as $product)\n        {{ $product }}\n\
    \    @endforeach\n</x-layout>\n```\n\n# Template Inheritance (#toc.xhtml#s120a)\n\
    \nAdditionally, **template inheritance** may be used to generate layouts. Before\
    \ the advent of components, this was the main method of application development.\n"
  raw: '# [Once Directive](#toc.xhtml#s112a)


    You may provide a section of the template that will only be evaluated once during
    each rendering cycle using the `@once` directive. This may help leverage stacks
    to push a specific piece of JavaScript into the page’s header.


    ![](images/Figure-4.6.jpg)


    **Figure 4.6:** Once Directives and Helper Directives in Laravel


    For instance, if you are rendering a certain component repeatedly, you might just
    want to push the JavaScript to the header the first time:


    `@once`


    `@push(‘scripts’)`


    `<script>`


    `// Custom JavaScript script`


    `</script>`


    `@endpush`


    `@endonce`


    The `@pushOnce` and `@prependOnce` directives are included for your convenience
    since the `@once` directive is frequently used in combination with the `@push`
    or `@prepend` directives:


    `@pushOnce(‘scripts’)`


    `<script>`


    `// Custom JavaScript script`


    `</script>`


    `@endPushOnce`


    # [Blade as Template Engines in Laravel](#toc.xhtml#s113a)


    The straightforward yet effective templating engine that comes with Laravel is
    called Blade. In contrast to several PHP templating engines, Blade does not prevent
    you from utilizing raw PHP code in your templates,. In reality, Blade adds practically
    no cost to your application because all templates are converted into normal PHP
    code and cached until they are updated. Blade template files normally reside in
    the `resources/views` directory and have the `.blade.php` file extension.


    Using the global `view` helper, Blade views may be retrieved from routes or controllers.
    Additionally, data may be provided to the Blade view via the view helper’s second
    parameter, as explained in the documentation on views:


    `Route::get(‘/’, function () {`


    `return view(‘welcome’, [‘name’ => ‘ABC’]);`


    `});`


    # [Data in Blade](#toc.xhtml#s114a)


    By enclosing the variable in curly brackets, data that is supplied to your Blade
    views may be shown. Consider the following route, for instance:


    `Route::get(‘/’, function () {`


    `return view(‘welcome’, [‘name’ => ‘ABC’]);`


    `});`


    In order to display the contents inline of the variables, use double curly brackets:
    `{{variable_name}}`


    For the preceding example, it will be:


    `Welcome, {{name}}`


    # [HTML Entity Encoding](#toc.xhtml#s115a)


    Blade and Laravel helper double-encode HTML entities by default. Call the `Blade::withoutDoubleEncoding`
    function from your `AppServiceProvider’s boot` method to stop double encoding:


    `<?php`


    `namespace App\Providers;`


    `use Illuminate\Support\Facades\Blade;`


    `use Illuminate\Support\ServiceProvider;`


    `class AppServiceProvider extends ServiceProvider`


    `{`


    `/*`


    `* Bootstrap any application services.`


    `*/`


    `public function boot(): void`


    `{`


    `Blade::withoutDoubleEncoding();`


    `}`


    `}`


    # [Components](#toc.xhtml#s116a)


    Sections, layouts, and inclusions all give comparable benefits; nevertheless,
    some people may find the mental model of components and slots simpler to grasp.
    Class-based components and anonymous components are the two methods of writing
    components.


    You may use the `make:component` Artisan command to construct a class-based component.
    We’ll make an `Alert` component to demonstrate how to use components. The component
    will be placed in the `app/View/Components` directory using the `make:component`
    command:


    `php artisan make:component Alert`


    A view template will also be produced for the component using the `make:component`
    command. The `resources/views/components` directory will house the view. No further
    component registration is normally needed when creating components for your own
    application because they are immediately found in the `resources/views/components`
    directory and the `app/View/Components` directory:


    `php artisan make:component Forms/Input`


    The aforementioned command will place the view in the `resources/views/components/forms`
    directory and an `Input` component in the `app/View/Components/Forms` directory.


    Use the `--view` option when using `make:controller` if you want to construct
    an anonymous component (a component with simply a Blade template and no class):


    `php artisan make:component forms.input --view`


    The command will create a Blade file located at the `input.blade.php` file located
    at `resources/views/components/forms` that can be rendered as a component via
    `<x-forms.input />`.


    # [Rendering Components](#toc.xhtml#s117a)


    You may use a Blade component tag inside one of your Blade templates to show a
    component. Blade component tags begin with the letter `x-` and the component class’s
    kebab case name:


    For example:


    `<x-alert/>`


    `<x-user-profile/>`


    Use the character `.` to denote directory nesting if the component class is further
    nested within the `app/View/Components` directory. For instance, if we believe
    a component to be located in `app/View/Components/Inputs/Button.php`, we may render
    it as follows:


    `<x-inputs.button/>`


    You may add a `shouldRender` function to your component class to conditionally
    render your component. The component won’t be rendered if the `shouldRender` function
    returns false:


    `use Illuminate\Support\Str;`


    `/*`


    `* Whether the component should be rendered`


    `*/`


    `public function shouldRender(): bool`


    `{`


    `return Str::length($this->message) > 0;`


    `}`


    # [Passing Data](#toc.xhtml#s118a)


    Using HTML properties, you may provide data to Blade components. Simple HTML attribute
    strings can be used to pass the component hard-coded, basic data. PHP variables
    and expressions must be supplied to the component using attributes with the character
    `:` in the prefix:


    `<x-alert type=”error” :message=”$message”/>`


    The class constructor of the component should contain a definition of each data
    attribute. A component’s view will always have access to all public attributes
    on the component. It is not required to transfer the data from the `render` method
    of the component to the view.


    `<?php`


    `namespace App\View\Components;`


    `use Illuminate\View\Component;`


    `use Illuminate\View\View;`


    `class Alert extends Component`


    `{`


    `/*`


    `* Component Instance.`


    `*/`


    `public function __construct(`


    `public string $type,`


    `public string $message,`


    `) {}`


    `/*`


    `* Get the view / contents that represent the component.`


    `*/`


    `public function render(): View`


    `{`


    `return view(‘components.alert’);`


    `}`


    `}`


    (**Source:** Laravel.com/docs)


    To display the contents of the component, display the values of the variables
    as follows:


    `<div class=”alert alert-{{ $type }}”>`


    `{{ $message }}`


    `</div>`


    # [Layouts](#toc.xhtml#s119a)


    The majority of web applications have the same overall layout across all of their
    pages. If we had to duplicate the full layout HTML in each view we created, it
    would be tremendously time-consuming and difficult to maintain our program. We
    can specify this layout as a single Blade component and utilize it across the
    rest of our application:


    `<!-- resources/views/components/layout.blade.php -->`


    `<html>`


    `<head>`


    `<title>{{ $title ?? ‘Grocery List’ }}</title>`


    `</head>`


    `<body>`


    `<h1>Things to Buy</h1>`


    `<hr/>`


    `{{ $item }}`


    `</body>`


    `</html>`


    We can make a Blade view that makes use of the `layout` component after it has
    been defined.


    For instance, in this illustration, we’ll create a straightforward view to show
    our task list:


    `<!-- resources/views/product.blade.php -->`


    `<x-layout>`


    `@foreach ($products as $product)`


    `{{ $product }}`


    `@endforeach`


    `</x-layout>`


    Keep in mind that any material that is injected into a component will go into
    the layout component’s `$item` default variable. As you may have observed, if
    a `$title` slot is given, our `layout` also honors it; otherwise, a default title
    is shown.


    # [Template Inheritance](#toc.xhtml#s120a)


    Additionally, **template inheritance** may be used to generate layouts. Before
    the advent of components, this was the main method of application development.'
