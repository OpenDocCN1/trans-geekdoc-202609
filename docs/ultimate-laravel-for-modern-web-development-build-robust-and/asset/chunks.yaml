- fmt: "\nOnce your domain has a valid SSL certificate, you may use the `domain` configuration\
    \ option in your application’s `vapor.yml` file to connect it to your environment.\
    \ You do not need to add the `www` subdomain when linking a domain to an environment:\n\
    \n```yaml\nid: 3\nname: vapor-laravel-app\nenvironments:\n  production:\n    domain:\
    \ example.com\n    build:\n      - 'composer install --no-dev'\n```\n\nVapor will\
    \ automatically set up the environment to handle requests from this domain upon\
    \ deployment. However, because of the nature of AWS CloudFront, custom domains\
    \ sometimes take 30-45 minutes to completely activate. So, don’t be concerned\
    \ if your custom domain isn’t instantly available after deployment.\n\nVapor lets\
    \ you associate many domains with a single project. Make sure you have a valid\
    \ certificate for each of the domains before proceeding. Then, change the `vapor.yml`\
    \ file in your application to add each domain:\n\n```yaml\nid: 3\nname: vapor-laravel-app\n\
    environments:\n  production:\n    domain:\n      - example1.com\n      - example2.com\n\
    \    build:\n      - 'composer install --no-dev'\n```\n\nAs long as you have a\
    \ valid certificate for the parent domain, you can specify that a domain should\
    \ enable wildcard subdomains. To associate a wildcard domain with an environment,\
    \ use `*` as the subdomain:\n\n```yaml\nid: 3\nname: vapor-laravel-app\nenvironments:\n\
    \  production:\n    domain: '*.example.com'\n    build:\n      - 'composer install\
    \ --no-dev'\n```\n\n## Multi-Level Subdomains\n\nVapor supports multiple-level\
    \ subdomains, such as `v1.api.example.com`. To use this capability, a certificate\
