  trans: "\n\n虽然 `assertStatus` 函数声明返回的响应应该具有指定的 HTTP 状态码，但 `get` 方法会向应用程序发送 `GET`\
    \ 请求。除了这个简单的断言外，Laravel 还有许多断言用于检查响应头、内容、JSON 格式和其他元素。\n\n# 发起请求\n\n你可以在测试中使用\
    \ `get`、`post`、`put`、`patch` 或 `delete` 方法向应用程序发送请求。这些技术并不会向你的应用程序发送*真实的* HTTP\
    \ 请求。相反，它们是在内部模拟了整个网络请求。\n\n测试请求方法返回 `Illuminate\\Http\\Response` 实例，而不是 `Illuminate\\\
    Testing\\TestResponse` 实例，后者提供了许多实用的断言，让你能够研究应用程序的响应：\n\n```php\n<?php\n\nnamespace\
    \ Tests\\Feature;\n\nuse Tests\\TestCase;\n\nclass ExampleTest extends TestCase\n\
    {\n    public function basicRequest(): void\n    {\n        $response = $this->get('/');\n\
    \        $response->assertStatus(200);\n    }\n}\n```\n\n通常情况下，每个测试应该只向你的应用程序发送一个请求。如果测试方法被用于运行多个请求，可能会发生意外的行为。\n\
    \n# 自定义请求头\n\n在请求传递到应用程序之前，你可以使用 `withHeaders` 函数修改其请求头。你可以使用此方法向请求添加任何自定义请求头：\n\
    \n```php\n<?php\n\nnamespace Tests\\Feature;\n\nuse Tests\\TestCase;\n\nclass\
    \ ExampleTest extends TestCase\n{\n    public function exampleSample(): void\n\
    \    {\n        $response = $this->withHeaders([\n            'X-Header' => 'Value',\n\
    \        ])->post('/user', ['name' => 'ABC']);\n        $response->assertStatus(201);\n\
    \    }\n}\n```\n\n# Cookies\n\n在发送请求之前设置 cookie 值，请使用 `withCookie` 或 `withCookies`\
    \ 方法。虽然 `withCookies` 函数接受一个键值对数组作为其两个参数，但 `withCookie` 方法接受一个 cookie 名称和值：\n\n\
    ```php\n<?php\n\nnamespace Tests\\Feature;\n\nuse Tests\\TestCase;\n\nclass ExampleTest\
    \ extends TestCase\n{\n    public function exampleFunctionCookies(): void\n  \
    \  {\n        $response = $this->withCookie('color', 'red')->get('/');\n     \
    \   $response = $this->withCookies([\n            'color' => 'red',\n        \
    \    'name' => 'ABC',\n        ])->get('/');\n    }\n}\n```\n\n# 身份验证\n\n在 HTTP\
    \ 测试期间，Laravel 提供了许多处理会话（session）的工具。使用 `withSession` 方法，你可以先将会话数据分配给指定的数组。你可以用它在应用程序发送请求之前将数据加载到会话中：\n\
    \n```php\n<?php\n\nnamespace Tests\\Feature;\n\nuse Tests\\TestCase;\n\nclass\
    \ ExampleTest extends TestCase\n{\n    public function exampleSessionInteraction():\
    \ void\n    {\n        $response = $this->withSession(['banned' => false])->get('/');\n\
    \    }\n}\n```\n\n通常，Laravel 的会话为当前授权的用户维护状态。因此，`actingAs` 辅助函数提供了一种快速方便的方法来确认某个用户是否为当前用户。例如，为了创建并验证用户，我们可以使用模型工厂（model\
    \ factory）：\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\nuse App\\Models\\\
    User;\nuse Tests\\TestCase;\n\nclass ExampleTest extends TestCase\n{\n    public\
    \ function exampleAuth(): void\n    {\n        $user = User::factory()->create();\n\
    \        $response = $this->actingAs($user)\n            ->withSession(['banned'\
    \ => false])\n            ->get('/');\n    }\n}\n```\n\n你可以通过将 guard 名称作为 `actingAs`\
    \ 函数的第二个参数来指定用户身份验证所需的 guard（守卫）。在整个测试过程中，分配给 `actingAs` 方法的 guard 也将作为默认 guard\
    \ 使用。\n\n`$this->actingAs($user, 'web')`\n\n# 调试响应\n\n可以使用 `dump`、`dumpHeaders`\
    \ 和 `dumpSession` 方法在向应用程序提交测试请求后检查并调试响应内容。\n\n![](img/Figure-8.2.jpg)\n\n**图\
    \ 8.2：** 调试响应的方法\n\n让我们来看一个例子：\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\
    \nuse Tests\\TestCase;\n\nclass ExampleTest extends TestCase\n{\n    public function\
    \ exampleTest(): void\n    {\n        $response = $this->get('/');\n        $response->dumpHeaders();\n\
    \        $response->dumpSession();\n        $response->dump();\n    }\n}\n```\n\
    \n作为替代方案，你可以挂起执行并使用 `dd`、`ddHeaders` 和 `ddSession` 方法输出响应相关的数据：\n\n```php\n<?php\n\
    \nnamespace Tests\\Feature;\n\nuse Tests\\TestCase;\n\nclass ExampleTest extends\
    \ TestCase\n{\n    public function exampleTest(): void\n    {\n        $response\
    \ = $this->get('/');\n        $response->dumpHeaders();\n        $response->dumpSession();\n\
    \        $response->dump();\n    }\n}\n```\n\n# 异常处理\n\n有时，可能需要确认应用程序内部是否抛出了异常。要断言闭包内的代码是否抛出了指定类型的异常，请使用\
    \ `assertThrows` 方法：\n\n`$this->assertThrows(`\n    fn () => (new Order)->execute(),\n\
    \    OrderInvalid::class\n`);`\n\n禁用弃用处理将导致弃用警告变为异常，从而导致你的测试失败。\n\n`$response\
    \ = $this->withoutDeprecationHandling()->get('/');`\n\n# 文件上传测试\n\n为了测试目的，你可以使用来自\
    \ `UploadedFile` 类的 `fake` 函数来生成模拟文件。这简化了文件上传的测试，特别是当与 `Storage`  facade 的 `fake`\
    \ 方法配合使用时。例如，你可以通过结合这两者来快速测试头像上传表单：\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\
    \nuse Illuminate\\Http\\UploadedFile;\nuse Illuminate\\Support\\Facades\\Storage;\n\
    use Tests\\TestCase;\n\nclass ExampleTest extends TestCase\n{\n    public function\
    \ testUpload(): void\n    {\n        Storage::fake('cat');\n        $file = UploadedFile::fake()->image('cat.jpg');\n\
    \        $response = $this->post('/cat', [\n            'cat' => $file,\n    \
    \    ]);\n        Storage::disk('cats')->assertExists($file->hashName());\n  \
    \  }\n}\n```\n\n你可以使用 `Storage` facade 提供的 `assertMissing` 函数来断言某个文件不存在：\n\n`Storage::fake('cats');`\n\
    `// Application Logic`\n`Storage::disk('cats')->assertMissing('missing.jpg');`\n\
    \n为了正确测试应用程序的验证需求，在通过 `UploadedFile` 类提供的 `fake` 方法生成文件时，你可以提供图片的宽度、高度和大小（单位为千字节）：\n\
    \n`UploadedFile::fake()->image('cat.jpg', $width, $height)->size(100);`\n\n`create`\
    \ 方法可用于生成图像之外的其他类型文件：\n\n`UploadedFile::fake()->create('document.pdf', $sizeInKilobytes);`\n\
    \n如有必要，你可以通过直接向方法传递 `$mimeType` 参数来指定文件应返回的 MIME 类型：\n\n`UploadedFile::fake()->create('document.pdf',\
    \ $sizeInKilobytes, 'application/pdf');`\n\n# 在 Laravel 中调试\n\nHomestead 支持使用\
    \ Xdebug 进行单步调试。例如，当你在浏览器中打开页面时，PHP 会与你的 IDE 建立，让你能够查看并编辑正在运行的代码。\n\n"
- fmt: "\nXdebug is launched and ready to receive connections by default. Use the\
    \ `sudo phpenmod xdebug` command in your Homestead virtual machine if you need\
    \ to activate Xdebug on the CLI. Now enable debugging by following the instructions\
    \ in your IDE. Lastly, set up your browser such that a bookmarklet or extension\
    \ will launch Xdebug.\n\nIt is easier to autostart debugging functional tests\
    \ that send queries to the web server than it is to change the tests such that\
    \ debugging is triggered by passing via a special header or cookie. In your Homestead\
    \ virtual machine, edit the `/etc/php/7.x/fpm/conf.d/20-xdebug.ini` file and add\
    \ the following settings to have Xdebug launch automatically:\n\n```\nxdebug.client_host\
    \ = 192.168.10.1\n```\n\n```\nxdebug.mode = debug\n```\n\n```\nxdebug.start_with_request\
    \ = yes\n```\n\nUse the `xphp` shell alias on your Homestead virtual machine to\
    \ debug a PHP CLI application:\n\n```\nxphp /path/to/script\n```\n\n# Conclusion\n\
    \nIn this chapter, we covered the essential aspects of testing and debugging your\
    \ Laravel application. The chapter begins by introducing the testing features\
    \ of Laravel, including the preconfigured `phpunit.xml` file and the helper functions\
    \ that facilitate testing. It discusses the testing structure, including the `Feature`\
    \ and `Unit` test folders, and emphasizes the importance of testing different\
    \ aspects of the application. The chapter delves into the setup environment for\
    \ testing, the `.env.testing` file, and the `CreatesApplication` trait.\n\nThe\
    \ chapter explains the testing lifecycle in Laravel, covering the creation and\
    \ execution of tests, reporting, profiling, and parallel execution. It discusses\
    \ HTTP testing, including making requests, customizing headers, dealing with cookies,\
    \ and authentication. Furthermore, it provides insights into debugging responses,\
    \ handling exceptions, and testing file uploads. The chapter concludes by explaining\
    \ how to use Xdebug for step debugging in the Laravel Homestead environment.\n\
    \nThroughout the chapter, various code examples and practical tips are provided\
    \ to help readers understand and implement testing and debugging techniques effectively\
    \ in their Laravel applications. The chapter aims to equip developers with the\
    \ necessary knowledge and tools to create robust and well-tested Laravel applications.\n\
    \nIn the next chapter, we will be looking at the mail and notifications feature\
    \ of Laravel that provides this feature to the APIs.\n\n# Points to Remember\n\
    \n- Testing a Laravel application involves a structured approach, distinguishing\
    \ between `Unit` and `Feature` tests. `Unit` tests focus on isolated code segments,\
    \ evaluating individual functions, while `Feature` tests explore the interactions\
    \ among components, including complex dynamics and HTTP request assessments. Emphasizing\
    \ comprehensive testing across various application facets ensures a robust codebase.\
    \ Configuring the testing environment is critical, involving adjustments in the\
    \ `phpunit.xml` file and utilizing the `.env.testing` file for specific testing\
    \ configurations. The `CreatesApplication` trait aids in seamless Laravel application\
    \ bootstrapping before testing, ensuring a smooth experience.\n\n- Understanding\
    \ the testing lifecycle is essential, encompassing test creation, execution, reporting,\
    \ and profiling. Efficient parallel execution reduces testing time, optimizing\
    \ the testing process. HTTP testing in Laravel involves powerful tools for querying\
    \ applications and authenticating users, requiring mastery of header customization,\
    \ cookie setting, session management, and user authentication. Debugging techniques\
    \ involve tools like `dump`, `dd`, and `Xdebug` in Laravel Homestead for step\
    \ debugging. File upload testing demands scrutiny of the `UploadedFile` class\
    \ and `Storage` facade functionalities, ensuring rigorous validation and system\
    \ integrity.\n\n- Adhering to best practices, such as minimal test coverage enforcement\
    \ and application profiling, guarantees a reliable codebase. Consistent environment\
    \ configuration across testing stages is crucial to avoid discrepancies, facilitating\
    \ efficient transitions. Collaboration and open communication among team members\
    \ enhance testing and debugging execution, with comprehensive documentation serving\
    \ as a valuable knowledge-sharing resource, fostering continuous learning within\
    \ the team.\n\n# CHAPTER 9: E-mail and Notifications in Laravel\n\n# Introduction\n\
    \nThe chapter focuses on e-mail and notifications feature of Laravel that provides\
    \ this feature to the APIs. Notifications provide an excellent way to monitor,\
    \ receive alerts and evaluate the performance of the Laravel application.\n\n\
    # Structure\n\nIn this chapter, we will cover the following topics:\n\n- Generating\
    \ Notifications\n- Sending Notifications\n    - Delivery Channels\n    - Queuing\
    \ Notifications\n    - Delaying Notifications\n    - Custom Notification Queue\n\
    \    - Custom Notification Channel Queue\n    - On-Demand Notifications\n- Mail\
    \ Notifications\n    - Customizing Email Components\n    - Custom templates\n\
    \    - Handling Raw Data\n    - Tags and Metadata\n    - Custom Symfony Message\n\
    - Broadcast Notifications\n- Notification Events\n\n# Generating Notifications\n\
    \nA single class, usually kept in the `app/Notifications` directory, represents\
    \ each notification in Laravel. When you use the `make:notification` command in\
    \ your program, this directory will be generated in the application:\n\n```\n\
    php artisan make:notification orderRecieved\n```\n\nA new notification class will\
    \ be added to your `app/Notifications` directory by using this command. A `via`\
    \ method and a variety of message building methods, such as `toMail` or `toDatabase`,\
    \ that transform the notification into a message specific to that channel are\
    \ included in every notification class.\n\n# Sending Notifications\n\nNotifications\
    \ can be issued using the `Notification` facade or the `notify` method of the\
    \ `Notifiable` trait. By default, the `App\\Models\\User` model in your application\
    \ has the `Notifiable` trait included:\n\n```php\n<?php\n\nnamespace App\\Models;\n\
    use Illuminate\\Foundation\\Auth\\User as Authenticatable;\nuse Illuminate\\Notifications\\\
    Notifiable;\n\nclass User extends Authenticatable\n{\n    use Notifiable;\n}\n\
    ```\n\nThis trait’s `notify` function anticipates receiving the following notification\
    \ instance:\n\n```php\nuse App\\Notifications\\orderRecieved;\n$user->notify(new\
    \ orderRecieved($order));\n```\n\nAn effective way to dispatch notifications to\
    \ multiple notifiable entities is by leveraging the `Notification` facade. By\
    \ invoking the `send` function and providing the notification object alongside\
    \ the relevant notifiable entities, you can conveniently deliver notifications\
    \ to a group of users or recipients.\n\n```php\nuse Illuminate\\Support\\Facades\\\
    Notification;\nNotification::send($users, new orderRecieved($order));\n```\n\n\
    You may use the `sendNow` method to send notifications right away as well. Even\
    \ if the notification implements the `ShouldQueue` interface, this method will\
    \ send the notice right away:\n\n```php\nNotification::sendNow($developers, new\
    \ DeploymentCompleted($deployment));\n```\n\n# Delivery Channels\n\nEach notification\
    \ class contains a `via` method that determines the specific channels through\
    \ which the notification will be dispatched. Various channels such as `mail`,\
    \ `database`, `broadcast`, `Vonage`, and `Slack` can be utilized for sending notifications.\n\
    \nA `$notifiable` instance—an instance of the class to which the notification\
    \ is being sent—is received by the `via` method. To choose which channels the\
    \ notice should be sent on, use `$notifiable`:\n\n```php\npublic function via(object\
    \ $notifiable): array\n{\n    return $notifiable->prefers_sms ? ['vonage'] : ['mail',\
    \ 'database'];\n}\n```\n\n# Queuing Notifications\n"
  raw: "Xdebug is launched and ready to receive connections by default. Use the `sudo\
    \ phpenmod xdebug` command in your Homestead virtual machine if you need to activate\
    \ Xdebug on the CLI. Now enable debugging by following the instructions in your\
    \ IDE. Lastly, set up your browser such that a bookmarklet or extension will launch\
    \ Xdebug.\n\nIt is easier to autostart debugging functional tests that send queries\
    \ to the web server than it is to change the tests such that debugging is triggered\
    \ by passing via a special header or cookie. In your Homestead virtual machine,\
    \ edit the `/etc/php/7.x/fpm/conf.d/20-xdebug.ini` file and add the following\
    \ settings to have Xdebug launch automatically:\n\n`xdebug.client_host = 192.168.10.1`\n\
    \n`xdebug.mode = debug`\n\n`xdebug.start_with_request = yes`\n\nUse the xphp shell\
    \ alias on your Homestead virtual machine to debug a PHP CLI application:\n\n\
    `xphp /path/to/script`\n\n# [Conclusion](#toc.xhtml#s245a)\n\nIn this chapter,\
    \ we covered the essential aspects of testing and debugging your Laravel application.\
    \ The chapter begins by introducing the testing features of Laravel, including\
    \ the preconfigured phpunit.xml file and the helper functions that facilitate\
    \ testing. It discusses the testing structure, including the Feature and Unit\
    \ test folders, and emphasizes the importance of testing different aspects of\
    \ the application. The chapter delves into the setup environment for testing,\
    \ the `.env.testing` file, and the `CreatesApplication` trait.\n\nThe chapter\
    \ explains the testing lifecycle in Laravel, covering the creation and execution\
    \ of tests, reporting, profiling, and parallel execution. It discusses HTTP testing,\
    \ including making requests, customizing headers, dealing with cookies, and authentication.\
    \ Furthermore, it provides insights into debugging responses, handling exceptions,\
    \ and testing file uploads. The chapter concludes by explaining how to use Xdebug\
    \ for step debugging in the Laravel Homestead environment.\n\nThroughout the chapter,\
    \ various code examples and practical tips are provided to help readers understand\
    \ and implement testing and debugging techniques effectively in their Laravel\
    \ applications. The chapter aims to equip developers with the necessary knowledge\
    \ and tools to create robust and well-tested Laravel applications.\n\nIn the next\
    \ chapter, we will be looking at the mail and notifications feature of Laravel\
    \ that provides this feature to the APIs.\n\n# [Points to Remember](#toc.xhtml#s246a)\n\
    \n*   Testing a Laravel application involves a structured approach, distinguishing\
    \ between Unit and Feature tests. Unit tests focus on isolated code segments,\
    \ evaluating individual functions, while Feature tests explore the interactions\
    \ among components, including complex dynamics and HTTP request assessments. Emphasizing\
    \ comprehensive testing across various application facets ensures a robust codebase.\
    \ Configuring the testing environment is critical, involving adjustments in the\
    \ phpunit.xml file and utilizing the .env.testing file for specific testing configurations.\
    \ The CreatesApplication trait aids in seamless Laravel application bootstrapping\
    \ before testing, ensuring a smooth experience.\n\n*   Understanding the testing\
    \ lifecycle is essential, encompassing test creation, execution, reporting, and\
    \ profiling. Efficient parallel execution reduces testing time, optimizing the\
    \ testing process. HTTP testing in Laravel involves powerful tools for querying\
    \ applications and authenticating users, requiring mastery of header customization,\
    \ cookie setting, session management, and user authentication. Debugging techniques\
    \ involve tools like dump, dd, and Xdebug in Laravel Homestead for step debugging.\
    \ File upload testing demands scrutiny of the UploadedFile class and Storage facade\
    \ functionalities, ensuring rigorous validation and system integrity.\n\n*   Adhering\
    \ to best practices, such as minimal test coverage enforcement and application\
    \ profiling, guarantees a reliable codebase. Consistent environment configuration\
    \ across testing stages is crucial to avoid discrepancies, facilitating efficient\
    \ transitions. Collaboration and open communication among team members enhance\
    \ testing and debugging execution, with comprehensive documentation serving as\
    \ a valuable knowledge-sharing resource, fostering continuous learning within\
    \ the team.\n\n# [CHAPTER 9](#toc.xhtml#c09)\n\n# [E-mail and Notifications in\
    \ Laravel](#toc.xhtml#c09)\n\n# [Introduction](#toc.xhtml#s247a)\n\nThe chapter\
    \ focuses on e-mail and notifications feature of Laravel that provides this feature\
    \ to the APIs. Notifications provide an excellent way to monitor, receive alerts\
    \ and evaluate the performance of the Laravel application.\n\n# [Structure](#toc.xhtml#s248a)\n\
    \nIn this chapter, we will cover the following topics:\n\n*   Generating Notifications\n\
    \n*   Sending Notifications \n\n    *   Delivery Channels\n\n    *   Queuing Notifications\n\
    \n    *   Delaying Notifications\n\n    *   Custom Notification Queue\n\n    *\
    \   Custom Notification Channel Queue\n\n    *   On-Demand Notifications\n\n*\
    \   Mail Notifications \n\n    *   Customizing Email Components\n\n    *   Custom\
    \ templates\n\n    *   Handling Raw Data\n\n    *   Tags and Metadata\n\n    *\
    \   Custom Symfony Message\n\n*   Broadcast Notifications\n\n*   Notification\
    \ Events\n\n# [Generating Notifications](#toc.xhtml#s249a)\n\nA single class,\
    \ usually kept in the `app/Notifications` directory, represents each notification\
    \ in Laravel. When you use the `make:notification` command in your program, this\
    \ directory will be generated in the application:\n\n`php artisan make:notification\
    \ orderRecieved`\n\nA new notification class will be added to your `app/Notifications`\
    \ directory by using this command. A `via` method and a variety of message building\
    \ methods, such as `toMail` or `toDatabase`, that transform the notification into\
    \ a message specific to that channel are included in every notification class.\n\
    \n# [Sending Notifications](#toc.xhtml#s250a)\n\nNotifications can be issued using\
    \ the `Notification` facade or the `notify` method of the `Notifiable` trait.\
    \ By default, the `App\\Models\\User` model in your application has the Notifiable\
    \ trait included:\n\n`<?php`\n\n`namespace App\\Models;`\n\n`use Illuminate\\\
    Foundation\\Auth\\User as Authenticatable;`\n\n`use Illuminate\\Notifications\\\
    Notifiable;`\n\n`class User extends Authenticatable`\n\n`{`\n\n`use Notifiable;`\n\
    \n`}`\n\nThis trait’s notify function anticipates receiving the following notification\
    \ instance:\n\n`use App\\Notifications\\orderRecieved;`\n\n`$user->notify(new\
    \ orderRecieved($order));`\n\nAn effective way to dispatch notifications to multiple\
    \ notifiable entities is by leveraging the `Notification` facade. By invoking\
    \ the `send` function and providing the notification object alongside the relevant\
    \ notifiable entities, you can conveniently deliver notifications to a group of\
    \ users or recipients.\n\n`use Illuminate\\Support\\Facades\\Notification;`\n\n\
    `Notification::send($users, new orderRecieved($order));`\n\nYou may use the `sendNow`\
    \ method to send notifications right away as well. Even if the notification implements\
    \ the `ShouldQueue` interface, this method will send the notice right away:\n\n\
    `Notification::sendNow($developers, new DeploymentCompleted($deployment));`\n\n\
    # [Delivery Channels](#toc.xhtml#s251a)\n\nEach notification class contains a\
    \ via method that determines the specific channels through which the notification\
    \ will be dispatched. Various channels such as `mail`, `database`, `broadcast`,\
    \ `Vonage`, and `Slack` can be utilized for sending notifications.\n\nA `$notifiable`\
    \ instance—an instance of the class to which the notification is being sent—is\
    \ received by the via method. To choose which channels the notice should be sent\
    \ on, use `$notifiable`:\n\n`public function via(object $notifiable): array`\n\
    \n`{`\n\n`return $notifiable->prefers_sms ? [‘vonage’] : [‘mail’, ‘database’];`\n\
    \n`}`\n\n# [Queuing Notifications](#toc.xhtml#s252a)"
