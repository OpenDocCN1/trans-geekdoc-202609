  trans: "\n应用中操作的逻辑分离使得独立开发组件成为可能。这意味着应用组件可以被拆分为逻辑上独立的组件，并进行并行开发，从而缩短应用程序的开发周期。\n\
    \n并行开发还允许我们快速、独立地构建功能，然后使用 MVC 原则将它们结合起来。这确保了软件的快速交付，并使得引入新功能和改进现有功能变得更加容易。\n\n\
    ## 可维护性与可扩展性\n\nMVC 架构使得应用程序易于维护。一旦应用程序开发完成并投入用户使用，可能会许多许多见解。将这些见解整合到应用中至关重要。此外，开发该应用的原始团队也可能已经转移到了新项目。在这种情况下，一组新的开发人员将负责维护应用。在开发过程中采用\
    \ MVC 架构模式，职责的逻辑分离使得新成员能够更好地、更容易地理解代码，提高了代码的可维护性。\n\n当前的应用程序可以添加额外的功能，而这正是通过 MVC\
    \ 模式准则实现的。MVC 架构使得代码能够通过新功能轻松扩展。这增强了 MVC 的可维护性特性。\n\n## Laravel 中的 Models\n\n\
    Laravel 中的 Model（模型）组件与数据库层和控制器层进行交互。在 MVC 架构模式中，它也被称为数据逻辑（Data Logic）组件。\n\n\
    Model 组件的作用是从数据库中获取和检索数据，并查询数据库所需的数据。在与数据库层交互时，所有的 `CRUD`（创建、读取、更新、删除）操作都由 Model\
    \ 组件处理。Model 组件从控制器层获取各种操作的逻辑，并负责所有操作的执行、存储操作结果以及管理数据库内的数据变化。\n\nModel 组件与控制器层交互，并告知\
    \ Model 组件应用中的数据流。它完全拥有从 UI 到数据库的应用数据流所有权，而 Controller 组件则充当中间角色。\n\n## Laravel\
    \ 中的 Views\n\nLaravel 中的 Views（视图）组件包含了应用程序中对终端用户可见的所有组件。终端用户通过用户界面（UI）与应用程序交互，而输入框和按钮等\
    \ UI 组件都包含在 MVC 架构模式的 View 组件之中。\n\n![](img/Figure-2.4.jpg)\n\n**图 2.4:** Laravel\
    \ 中的 View 组件\n\n[图 2.4] 显示了 View 组件的各种示例。总结来说，View 组件构涵盖了用户在与应用界面交互时可见的所有组件和元素。\n\
    \n## Laravel 中的 Controllers\n\nLaravel MVC 架构中的 Controller（控制器）组件是应用程序的`大脑`。Controller\
    \ 负责管理应用数据如何被控制，并与 `Model` 和 `View` 组件交互，以决定数据在应用中的显示方式。Controller 组件还负责执行用户通过应用程序界面的操作。这可以是任何\
    \ `CRUD`（创建、读取、更新、删除）操作或应用中编写的任何功能。这些都是 Controller 组件的职责。\n\n## 结论\n\n在本章中，我们研究了让\
    \ Laravel 中无缝构建和维护应用程序的关键概念。我们深入探讨了 MVC 架构模式，探索了它的历史以及这种架构模式的必要性。本章重点关注 MVC 架构模式及其如何强大并赋予\
    \ Laravel 强大。\n\n接下来，我们深入探讨了 MVC 模式，检查了每个组件的职责以及管理该架构模式的设计原则。这些设计模式是使用 MVC 架构模式的关键优势，并使程序员能够充分利用这些设计模式。\n\
    \n然后，我们查看了 Laravel 中的 MVC 架构模式。我们讨论了关键特性，即 SEO 友好、测试驱动开发（TDD）、可维护性与可扩展性以及并行开发。这些关键特性有助于我们的应用程序更容易被行业采用，并提供了如\
    \ SEO 等先进现代功能，使应用程序具有可扩展性。\n\n此外，我们研究了 Laravel 中的 Models、Views 和 Controllers，理解了如何在应用开发中创建这些组件，并利用它们保持设计初衷并适应应用中的关键特性。\n\
    \nMVC 架构模式就像 Laravel 的骨干，本章提供了所有信息，重点关注 Laravel 背景下的特性、原则和 MVC。\n\n在下一章中，我们将探索\
    \ Laravel 中的 Routers 和 Views。\n\n# 第 3 章：Laravel 中的路由与视图\n\n### 引言\n\n本章涵盖 Laravel\
    \ 中的路由（Routers）和视图（Views），它们是 Web 开发的重要部分。本章将从基础开始，引向与路由和视图复杂的主题。本章还将讨论 Laravel\
    \ 中不同路由和视图以及如何创建这些组件。\n\n### 结构\n\n在本章中，重点将放在以下主题：\n\n*   Laravel 中的路由 (Routers)\n\
    \    *   路由简介\n    *   路由目录 (Routes directory)\n    *   路由方法\n    *   路由类型\n \
    \   *   可选参数\n    *   正则表达式约束\n    *   路由组 (Route groups)\n    *   跨域资源共享\n  \
    \  *   缓存\n*   Laravel 中的视图 (Views)\n    *   创建视图\n    *   视图与扩展 (Extensions)\n\
    \    *   数据与视图\n    *   视图合成器与创建器 (View composers and creators)\n    *   视图优化\n\
    \n### Laravel 中的路由\n\n在开发 Laravel Web 应用程序时，拥有一种编程方式路由或提供访问应用能力的方法是非常重要的。这就是我们在应用中需要路由的地方。\n\
    \n#### 路由简介\n\n路由是用户用于与 Web 应用程序不同功能交互的 URL。它是用户访问以便在 Web 应用程序中获取和传输数据的终端。\n\n\
    理解路由的基础语法如下：\n\n```\nuse Illuminate\\Support\\Facades\\Route;\n\nRoute::get('/welcome',\
    \ function () {\n    return 'Hello Reader';\n});\n```\n\n以下是浏览器上的输出快照：\n\n![](img/Figure-3.1.jpg)\n\
    \n**图 3.1:** 路由示例\n\n#### 路由目录\n\n路由文件位于 `routes` 目录，包含了所有 Laravel 路由的定义。\n\n\
    应用程序中的 `AppProvidersRouteServiceProvider` 会自动加载这些文件。Web 路由定义在 `routes/web.php`\
    \ 文件中。这些路由属于 web 中间件组的范围，该组提供了 CSRF 保护和会话状态等功能。`api` 中间件组应用于 `routes/api.php`\
    \ 中的无状态路由。\n\n对于大多数应用程序，你必须在 `routes/web.php` 文件中定义路由。通过在浏览器中输入定义的 URL，你可以访问 `routes/web.php`\
    \ 中定义的路由。\n"
- fmt: "\nLet’s look at an example. To access the following route, you can navigate\
    \ to `[http://example.com/ep1](http://example.com/ep1)` in your browser.\n\n```\n\
    use App\\Http\\Controllers\\UserController;\n```\n\n```php\nRoute::get(‘/ep1,\
    \ [UserController::class, ‘index’]);\n```\n\n# Router Methods\n\nThe router enables\
    \ a programmer to register routes that respond to any HTTP verb.\n\n![](images/Figure-3.2.jpg)\n\
    \n**Figure 3.2:** Router Methods\n\nThe `get`, `post`, `put`, `patch`, `delete`,\
    \ and `options` methods should be defined before the `any`, `match`, and `redirect`\
    \ methods when building multiple routes that share the same URI. This means that\
    \ the appropriate route is matched to the incoming request.\n\n# Types of Routers\n\
    \nThere are four main types of routers which are extensively used in Laravel:\n\
    \n*   Redirect routes\n*   View routes\n*   Route list\n*   Fallback routes\n\n\
    ![](images/Figure-3.3.jpg)\n\n**Figure 3.3:** Router Types\n\n# Redirect Routes\n\
    \nThe `Route::redirect` method can be used to define a route that redirects to\
    \ another URI. With the help of this approach, you can quickly do a straightforward\
    \ redirect without having to construct a whole route or controller:\n\n```php\n\
    Route::redirect(‘/ep1’, ‘/ep2’);\n```\n\nThe status code can be customized as\
    \ well for the route:\n\n```php\nRoute::redirect(‘/ep1’, ‘/ep2’, 301);\n```\n\n\
    Alternatively, the `Route::permanentRedirect` method can be used to get a 301\
    \ status code:\n\n```php\nRoute::permanentRedirect(‘/ep1’, ‘/ep2’);\n```\n\n#\
    \ View Routes\n\nUse the `Route::view` method if your route needs to return only\
    \ a `view`. This technique offers a shortcut so that you do not need to define\
    \ a whole route or controller, similar to the redirect method.\n\nThe view method\
    \ takes two arguments:\n\n1.  a URI as the first\n2.  a view name as the second.\n\
    \nAs an optional third argument, you may also supply an array of data to the view:\n\
    \n```php\nRoute::view(‘/about’, ‘about’);\nRoute::view(‘/about’, ‘about’, [‘state’\
    \ => ‘Reader’]);\n```\n\n# The Route List\n\nThe `route:list` artisan command\
    \ can quickly give you a summary of all the routes that your application has created.\n\
    \nYou can tell Laravel to show the route middleware by adding the `-v` option\
    \ to the command: By default, the route middleware that is assigned to each route\
    \ will not be displayed in the `route:list` output.\n\n```bash\nphp artisan route:list\
    \ -v\n```\n\nBy adding the `--except-vendor` option while running the `route:list`,\
    \ you can also instruct Laravel to conceal any routes.\n\n```bash\nphp artisan\
    \ route:list --except-vendor\n```\n\nLikewise, by specifying the `--only-vendor`\
    \ option when executing the route, you may tell Laravel to only display routes\
    \ that are created by third-party packages.\n\n```bash\nphp artisan route:list\
    \ --only-vendor\n```\n\n# Fallback Routes\n\nYou can provide a route that will\
    \ be followed if no other route fits the incoming request by using the `Route::fallback`\
    \ function. Unhandled requests typically result in your application’s exception\
    \ handler rendering a “404” page. However, all middleware in the `web` middleware\
    \ group will apply to the route as the `fallback` route is normally defined in\
    \ your `routes/web.php` file. You are allowed to supplement this route with other\
    \ middleware as necessary:\n\n```php\nRoute::fallback(function () {\n    // Code\
    \ Logic\n});\n```\n\n# Route Parameters\n\nRoute parameters must always be enclosed\
    \ in braces and should only contain letters of the alphabet. Within the names\
    \ of route parameters, underscores (`_`) are also permitted.\n\nThe order in which\
    \ the route callbacks and controller arguments are passed determines how the route\
    \ parameters are injected; the arguments’ names are irrelevant.\n\nList your route\
    \ parameters after your dependencies if you want the Laravel service container\
    \ to automatically:\n\n```php\nuse Illuminate\\Http\\Request;\n\nRoute::get(‘/user/{num}’,\
    \ function (Request $request, string $num) {\n    return ‘User ‘.$num;\n});\n\
    ```\n\n# Optional Parameters\n\nSometimes a route parameter that isn’t always\
    \ in the URI needs to be specified. Put a question mark (`?`) after the parameter\
    \ name to do this. Make sure to assign a default value to the respective route\
    \ variable:\n\n```php\nRoute::get(‘/user/{place?}’, function (string $place =\
    \ null) {\n    return $place;\n});\n\nRoute::get(‘/user/{place?}’, function (string\
    \ $place = ‘London’) {\n    return $place;\n});\n```\n\n# Regular Expressions\
    \ Constraints\n\nUsing the `where` method on a route object, you can restrict\
    \ the format of your route arguments. The `where` method accepts a regular expression\
    \ that specifies how the parameter should be constrained in addition to the parameter’s\
    \ name.\n\nNote: Let’s understand regular expressions before diving deep into\
    \ the Regular expressions constraints.\n\n# Regular Expressions\n\nRegex is short\
    \ for regular expression. A string of various characters known as a regex, `regexp`,\
    \ or regular expression describes a specific search pattern. Additionally, it\
    \ is referred to or called a rational expression.\n\nIt is mostly utilized for\
    \ text string manipulation and search. Simply said, regular expressions make it\
    \ straightforward to look for patterns and replace them with those that match.\n\
    \n`*`\nIt is used to match strings with no restriction or rule. Generally used\
    \ in combination with other rules.\n\n`{}`\nThe number of times the previous regular\
    \ expression should be applied is indicated by the integer values wrapped in.\n\
    \n`<^>` or `<>` or `<[ A-Z]>`\nThese expressions among others help in finding\
    \ the length of string. The first two regex matches the entire subject string\
    \ and the last one matches any single uppercase character from A to Z.\n\n`^[a-zA-Z]`\n\
    It is used to match strings that either begin with a small- or capital-letter\
    \ character.\n\n`[0-9]`\nIt is used to match a digit from 0 to 9.\n\n`[aeiou]`\n\
    Only the lower-case vowels are matched by this square bracket.\n\n`[AEIOU]`\n\
    Only the upper-case vowels are matched by this square bracket.\n\n`ab[^3-7]`\n\
    It matches any numbers or characters that don’t have definitions inside the bracket.\n\
    \n`( )`\nIt is employed to match everything included in the bracket.\n\n`{ }`\n\
    It is employed to match everything included in the curly bracket.\n\n`[ ]`\nIt\
    \ is employed to match everything included in the square bracket.\n\n# Regular\
    \ Expressions Constraints\n\n```php\nRoute::get(‘/user/{name}’, function (string\
    \ $name) {\n    // Code Logic\n})->where(‘name’, ‘[A-z]+’);\n```\n\n```php\nRoute::get(‘/user/{id}’,\
    \ function (string $id) {\n    // Code Logic\n})->where(‘id’, ‘[0-9]+’);\n```\n\
    \n```php\nRoute::get(‘/user/{id}/{name}’, function (string $id, string $name)\
    \ {\n    // Code Logic\n})->where([‘id’ => ‘[0-9]+’, ‘name’ => ‘[a-z]+]);\n```\n\
    \nThere are a number of helper methods as well:\n\n```php\nRoute::get(‘/user/{id}/{name}’,\
    \ function (string $id, string $name) {\n    // Code Logic\n})->whereNumber(‘id’)->whereAlpha(‘name’);\n\
    ```\n\n```php\nRoute::get(‘/user/{name}’, function (string $name) {\n    // Code\
    \ Logic\n})->whereAlphaNumeric(‘name’);\n```\n\n```php\nRoute::get(‘/user/{id}’,\
    \ function (string $id) {\n    // Code Logic\n})->whereUuid(‘id’);\n```\n\n```php\n\
    Route::get(‘/user/{id}’, function (string $id) {\n    // Code Logic\n})->whereUlid(‘id’);\n\
    ```\n\n```php\nRoute::get(‘/category/{category}’, function (string $category)\
    \ {\n    // Code Logic\n})->whereIn(‘category’, [‘movie’, ‘song’, ‘painting’]);\n\
    ```\n\nA 404 HTTP response will be given if the inbound request does not comply\
    \ with the route pattern limitations.\n\n# Route Groups\n\nRoute groups are a\
    \ core concept of developing Laravel Applications. Route groups enable and provide\
    \ the feature to share route attributes, including middleware across numerous\
    \ routes. This also enables us to avoid describing the qualities of each individual\
    \ route.\n\nWith the built-in intelligent capabilities, the nested groups are\
    \ capable of compressing and merge different attributes present in the parent\
    \ group. This process is achieved as follows:\n\n1.  The where conditions are\
    \ merged.\n2.  The Middleware is merged.\n3.  Names are appended.\n"
  raw: 'Let’s look at an example. To access the following route, you can navigate
    to [http://example.com/ep1](http://example.com/ep1) in your browser.


    `use App\Http\Controllers\UserController;`


    `Route::get(‘/ep1, [UserController::class, ‘index’]);`


    # [Router Methods](#toc.xhtml#s62a)


    The router enables a programmer to register routes that respond to any HTTP verb.


    ![](images/Figure-3.2.jpg)


    **Figure 3.2:** Router Methods


    The get, post, put, patch, delete, and options methods should be defined before
    the any, match, and redirect methods when building multiple routes that share
    the same URI. This means that the appropriate route is matched to the incoming
    request.


    # [Types of Routers](#toc.xhtml#s63a)


    There are four main types of routers which are extensively used in Laravel:


    *   Redirect routes


    *   View routes


    *   Route list


    *   Fallback routes


    ![](images/Figure-3.3.jpg)


    **Figure 3.3:** Router Types


    # [Redirect Routes](#toc.xhtml#s64a)


    The `Route::redirect` method can be used to define a route that redirects to another
    URI. With the help of this approach, you can quickly do a straightforward redirect
    without having to construct a whole route or controller:


    `Route::redirect(‘/ep1’, ‘/ep2’);`


    The status code can be customized as well for the route:


    `Route::redirect(‘/ep1’, ‘/ep2’, 301);`


    Alternatively, the `Route::permanentRedirect` method can be used to get a 301
    status code:


    `Route::permanentRedirect(‘/ep1’, ‘/ep2’);`


    # [View Routes](#toc.xhtml#s65a)


    Use the `Route::view` method if your route needs to return only a `view`. This
    technique offers a shortcut so that you do not need to define a whole route or
    controller, similar to the redirect method.


    The view method takes two arguments:


    a URI as the first and


    a view name as the second.


    As an optional third argument, you may also supply an array of data to the view:


    `Route::view(‘/about’, ‘about’);`


    `Route::view(‘/about’, ‘about’, [‘state’ => ‘Reader’]);`


    # [The Route List](#toc.xhtml#s66a)


    The `route:list` The artisan command can quickly give you a summary of all the
    routes that your application has created.


    You can tell Laravel to show the route middleware by adding the -v option to the
    command: By default, the route middleware that is assigned to each route will
    not be displayed in the `route:list` output.


    `php artisan route:list -v`


    By adding the `--except-vendor` option while running the `route:list`, you can
    also instruct Laravel to conceal any routes.


    `php artisan route:list --except-vendor`


    Likewise, by specifying the --only-vendor option when executing the route, you
    may tell Laravel to only display routes that are created by third-party packages.


    `php artisan route:list --only-vendor`


    # [Fallback Routes](#toc.xhtml#s67a)


    You can provide a route that will be followed if no other route fits the incoming
    request by using the `Route::fallback` function. Unhandled requests typically
    result in your application’s exception handler rendering a “404” page. However,
    all middleware in the `web` middleware group will apply to the route as the `fallback`
    route is normally defined in your `routes/web.php` file. You are allowed to supplement
    this route with other middleware as necessary:


    `Route::fallback(function () {`


    `// Code Logic`


    `});`


    # [Route Parameters](#toc.xhtml#s68a)


    Route parameters must always be enclosed in braces and should only contain letters
    of the alphabet. Within the names of route parameters, underscores (\_) are also
    permitted.


    The order in which the route callbacks and controller arguments are passed determines
    how the route parameters are injected; the arguments’ names are irrelevant.


    List your route parameters after your dependencies if you want the Laravel service
    container to automatically:


    `use Illuminate\Http\Request;`


    `Route::get(‘/user/{num}’, function (Request $request, string $num) {`


    `return ‘User ‘.$num;`


    `});`


    # [Optional Parameters](#toc.xhtml#s69a)


    Sometimes a route parameter that isn’t always in the URI needs to be specified.
    Put a question mark (?) after the parameter name to do this. Make sure to assign
    a default value to the respective route variable:


    `Route::get(‘/user/{place?}’, function (string $place = null) {`


    `return $place;`


    `});`


    `Route::get(‘/user/{place?}’, function (string $place = ‘London’) {`


    `return $place;`


    `});`


    # [Regular Expressions Constraints](#toc.xhtml#s70a)


    Using the `where` method on a route object, you can restrict the format of your
    route arguments. The `where` method accepts a regular expression that specifies
    how the parameter should be constrained in addition to the parameter’s name.


    Note: Let’s understand regular expressions before diving deep into the Regular
    expressions constraints.


    # [Regular Expressions](#toc.xhtml#s71a)


    Regex is short for regular expression. A string of various characters known as
    a regex, regexp, or regular expression describes a specific search pattern. Additionally,
    it is referred to or called a rational expression.


    It is mostly utilized for text string manipulation and search. Simply said, regular
    expressions make it straightforward to look for patterns and replace them with
    those that match.


    `*`


    It is used to match strings with no restriction or rule. Generally used in combination
    with other rules.


    `{}`


    The number of times the previous regular expression should be applied is indicated
    by the integer values wrapped in.


    `<^> or <$> or <[ A-Z]>`


    These expressions among others help in finding the length of string. The first
    two regex matches the entire subject string and the last one matches any single
    uppercase character from A to Z.


    `^[a-zA-Z]`


    It is used to match strings that either begin with a small- or capital-letter
    character.


    `[0-9]`


    It is used to match a digit from 0 to 9.


    `[aeiou]`


    Only the lower-case vowels are matched by this square bracket.


    `[AEIOU]`


    Only the upper-case vowels are matched by this square bracket.


    `ab[^3-7]`


    It matches any numbers or characters that don’t have definitions inside the square
    bracket.


    `( )`


    It is employed to match everything included in the simple bracket.


    `{ }`


    It is employed to match everything included in the curly bracket.


    `[ ]`


    It is employed to match everything included in the square bracket.


    # [Regular Expressions Constraints](#toc.xhtml#s72a)


    `Route::get(‘/user/{name}’, function (string $name) {`


    `// Code Logic`


    `})->where(‘name’, ‘[A-Za-z]+’);`


    `Route::get(‘/user/{id}’, function (string $id) {`


    `// Code Logic`


    `})->where(‘id’, ‘[0-9]+’);`


    `Route::get(‘/user/{id}/{name}’, function (string $id, string $name) {`


    `// Code Logic`


    `})->where([‘id’ => ‘[0-9]+’, ‘name’ => ‘[a-z]+’]);`


    There are a number of helper methods as well:


    `Route::get(‘/user/{id}/{name}’, function (string $id, string $name) {`


    `// Code Logic`


    `})->whereNumber(‘id’)->whereAlpha(‘name’);`


    `Route::get(‘/user/{name}’, function (string $name) {`


    `// Code Logic`


    `})->whereAlphaNumeric(‘name’);`


    `Route::get(‘/user/{id}’, function (string $id) {`


    `// Code Logic`


    `})->whereUuid(‘id’);`


    `Route::get(‘/user/{id}’, function (string $id) {`


    `// Code Logic`


    `})->whereUlid(‘id’);`


    `Route::get(‘/category/{category}’, function (string $category) {`


    `// Code Logic`


    `})->whereIn(‘category’, [‘movie’, ‘song’, ‘painting’]);`


    A 404 HTTP response will be given if the inbound request does not comply with
    the route pattern limitations.


    # [Route Groups](#toc.xhtml#s73a)


    Route groups are a core concept of developing Laravel Applications. Route groups
    enable and provide the feature to share route attributes, including middleware
    across numerous routes. This also enables us to avoid describing the qualities
    of each individual route.


    With the built-in intelligent capabilities, the nested groups are capable of compressing
    and merge different attributes present in the parent group. This process is achieved
    as follows:


    1.  The where conditions are merged.


    2.  The Middleware is merged.


    3.  Names are appended.'
