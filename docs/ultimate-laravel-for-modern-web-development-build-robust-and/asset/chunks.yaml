  trans: "\n\n```bash\nbrew install composer\n```\n\n这将在机器上安装最新版本的 Composer，并处理任何环境变量设置以及机器上的\
    \ PATH 配置。\n\n若要安装特定版本的 Composer，请运行以下命令：\n\n```bash\nbrew install composer@<versionNumber>\n\
    ```\n\n将 `versionNumber` 替换为所需的 Composer 版本号。\n\n### 通过安装程序\n\n按照以下步骤通过安装程序在 Mac\
    \ 上安装 Composer：\n\n1. **下载安装程序。** \n   在终端中运行以下命令下载 Mac 最新版本的 Composer：\n   ```bash\n\
    \   sudo php -r “copy(‘https://getcomposer.org/installer’,’composer-setup.php’);”\n\
    \   ```\n\n2. **通过 Hash 验证安装程序**\n   运行以下命令验证安装程序的真实性：\n   ```bash\n   php -r\
    \ «if (hash_file(‘sha384’, ‘composersetup.php’) === ‘756890a4488ce9024fc62c56153228907f1545c228516cbf63f885e036d37e9a59d27d63f46af1d4d07ee0f76181c7d3){echo\
    \ ‘Installer verified’;}else{echo ‘Installer corrupt’;unlink(‘composer-setup.php’);)}”\
    \ \n   ```\n\n3. **运行安装。**\n   在终端通过以下命令运行 Composer 安装文件：\n   ```bash\n   php\
    \ composer-setup.php\n   ```\n\n4. **将 Phar 文件移动到 `/usr/bin/composer`：**\n   ```bash\n\
    \   sudo mv composer.phar /usr/local/bin/composer\n   ```\n\n5. **运行 Composer。**\n\
    \   在终端中输入以下内容运行 Composer：\n   ```bash\n   composer\n   ```\n\n将显示 Composer 版本和帮助菜单，表明\
    \ Composer 已成功安装。\n\n# Windows\n\n按照以下步骤在 Windows 上安装 Composer：\n\n1. 访问 [www.getcomposer.org](http://www.getcomposer.org)\n\
    2. 点击 Composer 网站上的 `Download`。\n3. 下载 `Composer-Setup.exe file`。\n4. 选择 `Install\
    \ for all users`。\n5. 保持默认设置或根据提示选择选项。\n6. 等待安装完成并点击 `Finish`。\n\nComposer 现在已成功安装在你的\
    \ Windows 机器上。要验证 Composer 的安装，请打开提示符并运行以下命令：\n\n```bash\ncomposer\n```\n\n输出将显示已安装的\
    \ Composer 版本，你可以验证 Composer 是否成功安装。\n\n# 安装 Laravel\n\n一旦在系统中安装了 PHP 和 Composer，在两个平台上安装\
    \ Laravel 的步骤都非常简单。\n\n### 通过安装程序\n\n若要使用安装程序安装 Laravel，我们利用 Composer。\n\n在终端中运行以下命令下载\
    \ Laravel 安装器：\n```bash\ncomposer global require laravel/installer\n```\n\n安装完成后，使用\
    \ `new` 命令在指定的目录中创建新的 Laravel 安装。相应的操作命令如下：\n\n```bash\nlaravel new directoryName\n\
    ```\n\n确保将 Composer 的系统级 vendor bin 目录已作为系统 `PATH` 变量的一部分添加，这非常重要。可以使用以下命令找到目录位置：\n\
    \n```bash\ncomposer global about\n```\n\n通常，基于不同操作系统的常见位置如下：\n\n**Mac**\n`$HOME/.composer/vendor/bin`\n\
    \n**Windows**\n`%USERPROFILE%\\AppData\\Roaming\\Composer\\vendor\\bin`\n\n**Linux**\n\
    `$HOME/.config/composer/vendor/bin`\n或\n`$HOME/.composer/vendor/bin`\n\n### 通过\
    \ Composer Create-Project\n\n也可以通过 Composer 的 `create-project` 命令完成 Laravel 安装。\n\
    \n在你的终端中运行以下命令：\n```bash\ncomposer create-project --prefer-dist laravel/laravel:¹⁰.0\
    \ blog\n```\n\n### 通过 PHP serve\n\nLaravel 也可以通过 PHP 内置的开发服务器运行。`serve Artisan`\
    \ 命令用于此操作。\n\n在你的终端中运行以下命令：\n```bash\nphp artisan serve\n```\n\n# Laravel Artisan\n\
    \nLaravel 也可以通过 PHP 内置的开发服务器运行。`serve Artisan` 命令用于此操作。\n\n在你的终端中运行以下命令：\n```bash\n\
    php artisan serve\n```\n\n### 调度命令\n\n`schedule` 定义在 `Kernel.php` 文件中。要每分钟调用一次调度器，请向项目的\
    \ `app/Console` 目录添加以下内容。\n\n### 频繁重复的任务\n\n若要每五分钟或每十分分钟调度一次任务，调度任务代码如下：\n\n**每五分钟执行一次的任务：**\n\
    `$schedule->command('test’)->everyFiveMinutes();`\n\n**每十分钟执行一次的任务：**\n`$schedule->command('test’)->everyTenMinutes();`\n\
    \n**每日重复任务：**\n`$schedule->command('test’)->daily();`\n\n**每日特定时间执行：**\n`$schedule->command('test’)->dailyAt(‘10:00’);`\n\
    \n### 特定日期任务\n\n以下方法允许在特定日期进行调度：\n`mondays()`\n`tuesdays()`\n`wednesdays()`\n\
    `thursdays()`\n`fridays()`\n`saturdays()`\n`sundays()`\n\n根据特定周几调度任务的频率要求，可以使用相应的方法来调度任务。\n\
    \n### 每周重复的任务\n\n`$schedule->command('test’)->weekly();`\n\n**每周特定时间执行：**\n`$schedule->command('test’)->weeklyOn(1,‘10:00’);`\n\
    \n"
- fmt: "\nThe first parameter takes arguments in the range of 0-6, where each number\
    \ represents a day of the week. The second argument is the time of the day.\n\n\
    ### Custom Schedule Jobs\n\nIn order to have more customization and frequency\
    \ in the schedule of jobs, Laravel allows the same with the manual CRON expression:\n\
    \n```php\n$schedule->command(‘test’)->cron(‘* * * * *’);\n```\n\n### Overlapping\
    \ Jobs Avoidance\n\nWith a number of jobs being scheduled, it is critical that\
    \ the previously scheduled completes before the same job is retriggered. To handle\
    \ this overlapping of jobs, Laravel provides a method that can be used in scheduling:\n\
    \n```php\n$schedule->command(‘test’)->withoutOverlapping();\n```\n\nThe `withoutOverlapping()`\
    \ method ensures that the `test` command will run every minute if it not not running\
    \ currently. This ensures there is no overlap in the jobs running.\n\n### Isolatable\
    \ Commands\n\nWhen working on developing Laravel Applications, as a developer,\
    \ multiple commands may run. There will be instances when you want only an instance\
    \ of the command to run at a given time. In this scenario, the concept of Isolatable\
    \ Commands comes into the picture.\n\nThe Isolatable interface consists of all\
    \ the core logic required to execute Isolatable Commands. The interface needs\
    \ to be implemented in the command class to use the functionality.\n\nThe interface\
    \ is located at:\n\n`Illuminate\\Contracts\\Console\\Isolatable`\n\nThis Isolatable\
    \ interface is used by the class that will implement the interface using the `implements`\
    \ keyword.\n\nLet us understand this concept in depth with the following example.\n\
    \nConsider a scenario where a class named `SendNotifications` is to be implemented\
    \ in such a way that an instance of the class is invoked at any given time in\
    \ the application. This makes it need the functionality of the `Isolatable` interface.\n\
    \n![](images/Fig-1.5.jpg)\n\n**Figure 1.5:** Class `SendNotifications` implements\
    \ Isolatable Interface\n\nThe code in the PHP class will look as follows:\n\n\
    ```php\nnamespace App\\Console\\Commands;\n\nuse Illuminate\\Console\\Command;\n\
    \nuse Illuminate\\Contracts\\Console\\Isolatable;\n\nclass SendNotifications extends\
    \ Command implements Isolatable\n{\n    // …\n}\n```\n\nAs a command is marked\
    \ as `Isolatable`, Laravel automatically adds the `–-isolate` option to the command,\
    \ reducing the option adding overload from the programmer.\n\nThis ensures that\
    \ the command has only a single instance when it is invoked with the option.\n\
    \n# Core Concept\n\nThe core concept in the way Laravel is able to achieve the\
    \ feature of Isolatable on the command and ensure a single instance of the command\
    \ (and no multiple instances) is by using the underlying default cache driver\
    \ of the application.\n\nBy acquiring an atomic lock using the application’s default\
    \ cache driver, the command is marked as Isolatable.\n\nIn a scenario when other\
    \ instances of the command are already in progress, the `isolatable` marked command\
    \ will not execute and will exit with a successful exit code by default. It is\
    \ possible to specify the exit code the command should exit in such a scenario\
    \ by specifying the desired status code via the `isolate` option in the command.\n\
    \nTo specify an exit code of 12 when another instance of the command is already\
    \ running, specify as follows:\n\n`--isolated=12`\n\n### Lock Management\n\nThe\
    \ architecture allows for the following:\n\n*   The architecture of the application,\
    \ namely:\n*   The architecture of the application, namely:\n\n```php\nuse DateTimeInterface;\n\
    \nuse DateInterval;\n\npublic function isolationLocksAt(): DateTimeInterface\n\
    {\n    return now()->add(new DateInterval('PT1M'));\n}\n```\n"
  raw: "    The first parameter takes arguments in the range of 0-6, where each number\
    \ represents a day of the week. The second argument is the time of the day.\n\n\
    \    **Custom Schedule Jobs:**\n\n    In order to have more customization and\
    \ frequency in the schedule of jobs, Laravel allows the same with the manual CRON\
    \ expression:\n\n    `$schedule->command(‘test’)->cron(‘* * * * *’);`\n\n    **Overlapping\
    \ Jobs Avoidance:**\n\n    With a number of jobs being scheduled, it is critical\
    \ that the previously scheduled completes before the same job is retriggered.\
    \ To handle this overlapping of jobs, Laravel provides a method that can be used\
    \ in scheduling:\n\n    `$schedule->command(‘test’)->withoutOverlapping();`\n\n\
    \    The `withoutOverlapping()` method ensures that the `test` command will run\
    \ every minute if it not running currently. This ensures there is no overlap in\
    \ the jobs running.\n\n    **Isolatable Commands:**\n\n    When working on developing\
    \ Laravel Applications, as a developer, multiple commands may run. There will\
    \ be instances when you want only an instance of the command to run at a given\
    \ time. In this scenario, the concept of Isolatable Commands comes into the picture.\n\
    \n    The Isolatable interface consists of all the core logic required to execute\
    \ Isolatable Commands. The interface needs to be implemented in the command class\
    \ to use the functionality.\n\n    The interface is located at:\n\n    `Illuminate\\\
    Contracts\\Console\\Isolatable`\n\n    This Isolatable interface is used by the\
    \ class that will implement the interface using the `implements` keyword.\n\n\
    \    Let us understand this concept in depth with the following example.\n\n \
    \   Consider a scenario where a class named `SendNotifications` is to be implemented\
    \ in such a way that an instance of the class is invoked at any given time in\
    \ the application. This makes it need the functionality of the `Isolatable` interface.\n\
    \n    ![](images/Fig-1.5.jpg)\n\n    **Figure 1.5:** Class `SendNotifications`\
    \ implements Isolatable Interface\n\nThe code in the PHP class will look as follows:\n\
    \n`namespace App\\Console\\Commands;`\n\n`use Illuminate\\Console\\Command;`\n\
    \n`use Illuminate\\Contracts\\Console\\Isolatable;`\n\n`class SendNotifications\
    \ extends Command implements Isolatable`\n\n`{`\n\n`// …`\n\n`}`\n\nAs a command\
    \ is marked as `Isolatable`, Laravel automatically adds the `–-isolate` option\
    \ to the command, reducing the option adding overload from the programmer.\n\n\
    This ensures that the command has only a single instance when it is invoked with\
    \ the option.\n\n# [Core Concept](#toc.xhtml#s31a)\n\nThe core concept in the\
    \ way Laravel is able to achieve the feature of Isolatable on the command and\
    \ ensure a single instance of the command (and no multiple instances) is by using\
    \ the underlying default cache driver of the application.\n\nBy acquiring an atomic\
    \ lock using the application’s default cache driver, the command is marked as\
    \ Isolatable.\n\nIn a scenario when other instances of the command are already\
    \ in progress, the `isolatable` marked command will not execute and will exit\
    \ with a successful exit code by default. It is possible to specify the exit code\
    \ the command should exit in such a scenario by specifying the desired status\
    \ code via the `isolate` option in the command.\n\nTo specify an exit code of\
    \ 12 when another instance of the command is already running, specify as follows:\n\
    \n`--isolated=12`\n\n**Lock Expiry Management**\n\nThe lock expires in two scenarios,\
    \ namely:\n\n*   The command execution is done, and the lock expires by default.\n\
    \n*   The command is interrupted and unable to finish, the lock will expire in\
    \ 1 hour.\n\nThe lock expiration can be modified by defining the `isolationLockExpiresAt()`\
    \ method on the command.\n\nLet’s look at the code for the method:\n\n`use DateTimeInterface;`\n\
    \n`use DateInterval;`\n\n`public function isolationLockExpiresAt(): DateTimeInterface|DateInterval`\n\
    \n`{`\n\n`return now()->addMinutes(10);`\n\n`}`\n\nThe aim of the preceding code\
    \ is to customize the lock expiration time and to set it to add 10 minutes as\
    \ the expiration of the lock time.\n\nThis enables us to base the expiration of\
    \ the lock based on the business logic of our application. It is key to note that\
    \ in case we do not custom specify the time when the lock will expire, the two\
    \ scenarios are by default incorporated and will take care to release the lock\
    \ in the given time, as mentioned at the start.\n\n# [Conclusion](#toc.xhtml#s32a)\n\
    \nIn this chapter, we explored what the Laravel framework is, why it is preferred\
    \ by developers, and its growing adaptability for application development. We\
    \ discussed the key pillars of Laravel, namely Scalability, MVC architecture,\
    \ Community, Eloquent ORM, and Class Dependency management. We looked at the pillars\
    \ and explored what makes these features unique and how they make the Laravel\
    \ framework powerful.\n\nNext, we learned about upgrading to the latest Laravel\
    \ version, including the changes required to handle deprecated methods, upgrade\
    \ to versions of the application dependencies, and also the command replacement\
    \ required based on the latest Laravel version change.\n\nWe looked at the installation\
    \ steps and system requirements to install Laravel on machines, and the various\
    \ steps involved based on the operating system of the machine.\n\nLaravel artisan\
    \ is at the core of everything related to Laravel development. In this chapter,\
    \ we looked at the history and what Artisan is, explored the commands, and looked\
    \ at scheduling CRON jobs and automating tasks. Additionally, we explored the\
    \ optimization technique to handle overlapping scheduled jobs and how to avoid\
    \ the same. The chapter covered Isolatable commands, emphasizing the need and\
    \ how to implement them into our Laravel applications.\n\nIn the next chapter,\
    \ we will dive deep into the MVC architecture pattern and how the pattern is used\
    \ to build Laravel.\n\n# [CHAPTER 2](#toc.xhtml#c02)\n\n# [MVC Architecture in\
    \ Laravel](#toc.xhtml#c02)\n\n# [Introduction](#toc.xhtml#s33a)\n\nThis chapter\
    \ focuses on the Model-View-Controller (MVC) architectural pattern followed in\
    \ Laravel. The chapter explores the key properties of MVC used in Laravel application\
    \ development. It covers practices for writing better code and incorporating key\
    \ features.\n\n# [Structure](#toc.xhtml#s34a)\n\nIn this chapter, the focus will\
    \ be on the following topics:\n\n*   Overview of MVC Architecture\n\n*   How Laravel\
    \ Follows the MVC Architecture \n\n    *   Design Patterns\n\n*   MVC in Laravel\
    \ \n\n    *   Key Features\n\n    *   Models in Laravel\n\n    *   Views in Laravel\n\
    \n    *   Controllers in Laravel\n\n# [Overview of MVC Architecture](#toc.xhtml#s35a)\n\
    \nMVC architecture stands for the Model-View-Controller architectural pattern.\
    \ This is a special architectural pattern that separates an application into distinct\
    \ logical components, namely model, view, and controller. The logical separation\
    \ enables the division of different aspects of the application into separate components.\
    \ These components are handled separately while maintaining the flow of actions\
    \ between the three components. This ensures the handling of the separate business\
    \ logic based on the components.\n\n# [History](#toc.xhtml#s36a)\n\nThe MVC architecture\
    \ pattern was first introduced in 1979 by Trygve Mikkjel Heyerdahl Reenskaug.\n\
    \nThe motivation behind creating the MVC pattern was to divide the complex application\
    \ into smaller, manageable components. Before the introduction of the MVC architecture\
    \ pattern, the complexity of handling different actions and tasks made the application\
    \ less maintainable and took relatively more time to develop the application due\
    \ to a lack of separation in responsibilities of tasks within the application.\n\
    \nIt was then in the late 1970s, while working on Samlltalk-79, Trygve Reenskaug\
    \ created a pattern (MVC) to overcome this complexity. He aimed to create a pattern\
    \ to be used to structure applications used by users who interacted with large\
    \ amounts of data.\n\nThe original name of the pattern was going to be Model-View-Editor,\
    \ but it was changed to Model-View-Controller."
