    # [Conditional Relationships](#toc.xhtml#s203a)


    You may conditionally include relationships on your resource answers in addition
    to loading attributes based on whether the connection has previously been loaded
    on the model. This lets your controller choose which relationships to put into
    the model, and your resource may conveniently include those relationships only
    after they have been loaded. In the end, this facilitates avoiding N+1 query issues
    with your resources.


    A relationship can be conditionally loaded using the `whenLoaded` method. This
    approach accepts the relationship name rather than the connection itself to prevent
    needlessly loading relationships:


    `use App\Http\Resources\PostResource;`


    `public function toArray(Request $request): array`


    `{`


    `return [`


    `‘id’ => $this->id,`


    `‘name’ => $this->name,`


    `‘city’ => $this->city,`


    `‘posts’ => PostResource::collection($this->whenLoaded(‘posts’)),`


    `‘created_at’ => $this->created_at,`


    `‘updated_at’ => $this->updated_at,`


    `];`


    `}`


    In this case, the resource response will not be delivered to the client until
    the posts key has been deleted in the event that the relationship has not loaded.


    You may conditionally include relationship *counts* on your resource answers in
    addition to conditionally include relationships, depending on whether the relationship’s
    count has been loaded into the model:


    `new UserResource($user->loadCount(‘posts’));`


    You may conditionally include the count of a relationship in your resource response
    by using the `whenCounted` method. By using this approach, the attribute is not
    included needlessly if the relationships’ count is missing:


    `public function toArray(Request $request): array`


    `{`


    `return [`


    `‘id’ => $this->id,`


    `‘name’ => $this->name,`


    `‘city’ => $this->city,`


    `‘posts_count’ => $this->whenCounted(‘posts’),`


    `‘created_at’ => $this->created_at,`


    `‘updated_at’ => $this->updated_at,`


    `];`


    `}`


    # [Resource Response](#toc.xhtml#s204a)


    Routes and controllers have the option of immediately returning resources:


    `use App\Http\Resources\UserResource;`


    `use App\Models\User;`


    `Route::get(‘/user/{id}’, function (string $id) {`


    `return new UserResource(User::findOrFail($id));`


    `});`


    On occasion, though, you might need to alter the outgoing HTTP response before
    sending it to the client. To do this, there are two approaches. The response method
    can be chained onto the resource first. An Illuminate\\Http\\JsonResponse object
    will be returned by this function, allowing you complete control over the response’s
    headers:


    `use App\Http\Resources\UserResource;`


    `use App\Models\User;`


    `Route::get(‘/user’, function () {`


    `return (new UserResource(User::find(1)))`


    `->response()`


    `->header(‘X-Value’, ‘True’);`


    `});`


    As an alternative, the resource itself may specify a withResponse method. When
    the resource is returned in a response as the outermost resource, this procedure
    will be called:


    `<?php`


    `namespace App\Http\Resources;`


    `use Illuminate\Http\JsonResponse;`


    `use Illuminate\Http\Request;`


    `use Illuminate\Http\Resources\Json\JsonResource;`


    `class UserResource extends JsonResource`


    `{`


    `public function toArray(Request $request): array`


    `{`


    `return [`


    `‘id’ => $this->id,`


    `];`


    `}`


    `public function withResponse(Request $request, JsonResponse $response): void`


    `{`


    `$response->header(‘the value is’, ‘True’);`


    `}`


    `}`


    # [Laravel Passport](#toc.xhtml#s205a)


    For your Laravel application, Laravel Passport offers a complete OAuth2 server
    solution in a matter of minutes. The League OAuth2 server, which is maintained
    by Andy Millington and Simon Hamp, provides the foundation upon which Passport
    is constructed.


    Use Laravel Passport if OAuth2 compatibility is a must-have feature for your application.


    # [Installing and Setup](#toc.xhtml#s206a)


    Using the Composer package manager, install Passport:


    `composer require laravel/passport`


    You should migrate your database after installing the package since the service
    provider for Passport registers its own database migration directory. The tables
    your application requires to hold OAuth2 clients and access tokens will be created
    by the Passport migrations:


    `php artisan migrate`


    The `passport:install` Artisan command should then be run. The encryption keys
    required to produce safe access tokens will be generated by this command. Additionally,
    *personal access* and *password grant* clients will be created by the command
    and used to produce access tokens:


    `php artisan passport:install`


    Install the `Laravel\Passport\HasApiTokens` trait to your `App\Models\Employee`
    model after performing the `passport:install` command. A few assistance methods
    that let you check the authorized user’s token and scopes will be provided by
    this trait to your model. You may delete the `Laravel\Sanctum\HasApiTokens` trait
    from your model if it is already using it:


    `<?php`


    `namespace App\Models;`


    `use Illuminate\Database\Eloquent\Factories\HasFactory;`


    `use Illuminate\Foundation\Auth\User as Authenticatable;`


    `use Illuminate\Notifications\Notifiable;`


    `use Laravel\Passport\HasApiTokens;`


    `class Employee extends Authenticatable`


    `{`


    `use HasApiTokens, HasFactory, Notifiable;`


    `}`


    Finally, you need establish an api authentication guard and set the `driver` option
    to `passport` in your application’s `config/auth.php` configuration file. This
    will tell your program to utilize Passport’s `TokenGuard` for incoming API request
    authentication.


    # [Configuration](#toc.xhtml#s207a)


    To ensure that the secrets of your clients are hashed before being saved in your
    database, you should invoke the `Passport::hashClientSecrets` function within
    your `App\Providers\AuthServiceProvider` class’ startup method:


    `use Laravel\Passport\Passport;`


    `Passport::hashClientSecrets();`


    All of your client secrets will only be visible to the user as soon as they are
    created, after they are enabled. If the plain-text client secret value is lost,
    it cannot be recovered because it is never kept in the database.


    # [Token Lifetimes](#toc.xhtml#s208a)


    Long-lived access tokens that expire after a year are automatically issued by
    Passport. Use the `tokensExpireIn`, `refreshTokensExpireIn`, and `personalAccessTokensExpireIn`
    methods to set a longer or shorter token lifespan.


    ![](images/Figure-7.2.jpg)


    **Figure 7.2:** Methods – token lifetime


    The `App\Providers\AuthServiceProvider` class in your application’s boot procedure
    is where these methods should be called:


    `public function boot(): void`


    `{`


    `Passport::tokensExpireIn(now()->addDays(15));`


    `Passport::refreshTokensExpireIn(now()->addDays(30));`


    `Passport::personalAccessTokensExpireIn(now()->addMonths(6));`


    `}`


