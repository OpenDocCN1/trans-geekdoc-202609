  trans: "\n\n本章将介绍如何使用 Laravel 进行 API 开发。它将引导用户从 REST API 的介绍开始，一直到 API 的高级话题。本章还将重点介绍\
    \ Laravel Passport API 及其功能以及更多内容。\n\n# 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   理解 API、REST\n\
    *   资源 (Resources)、集合 (Collections) 和嵌套关系\n    *   编写资源\n        *   关系 (Relationships)\n\
    \        *   数据包装 (Data Wrapping)\n        *   分页 (Pagination)\n        *   条件关系\n\
    \    *   资源响应 (Resource Response)\n*   Laravel Passport\n    *   安装与设置\n    *\
    \   配置\n    *   访问令牌 (Access Tokens)\n    *   保护路由\n    *   令牌范围 (Token Scopes)\n\
    \n# 理解 API、REST\n\nAPI 代表应用程序接口（Application Programming Interface）。API 可以比作不同软件程序之间的一组协议，用于相互通信，即共享数据和/或功能。\n\
    \n有两种广泛使用的 API 类型：\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1：** API 类型\n\n# REST\n\
    \nREST API 代表表述状态转移（Representational State Transfer）。\n\n它是 API 层中针对多个操作的单一资源，并使用\
    \ CRUD（创建、读取、更新、删除）操作来处理和转换数据。\n\n# SOAP\n\nSOAP API 代表简单对象访问协议（Simple Object\
    \ Access Protocol）。\n\n它可以是有状态的也可以是无状态的。它使用 POST 进行调用，并暴露了用于通信和数据包传输而执行的方法调用。\n\
    \n# 资源、集合和嵌套关系\n\n在路由或控制器中建立资源实例时，如果你交付的是分页响应或资源集合，应该使用由资源类提供的 `collection` 方法：\n\
    \n```php\nuse App\\Http\\Resources\\UserResource;\nuse App\\Models\\User;\nRoute::get('/users',\
    \ function () {\n    return UserResource::collection(User::all());\n});\n```\n\
    \n请注意，不允许添加自定义元数据，且元数据必须随集合一起返回。如果你想更改资源集合响应，可以创建一个特定的资源来表示该集合：\n\n```bash\nphp\
    \ artisan make:resource UserCollection\n```\n\n在生成资源集合类后，可以轻松定义必须包含在响应中的任何元数据：\n\
    \n```php\n<?php\nnamespace App\\Http\\Resources;\nuse Illuminate\\Http\\Request;\n\
    use Illuminate\\Http\\Resources\\Json\\ResourceCollection;\n\nclass UserCollection\
    \ extends ResourceCollection\n{\n    /**\n     * 将资源集合转换为数组。\n     *\n     * @return\
    \ array<int|string, mixed>\n     */\n    public function toArray(Request $request):\
    \ array\n    {\n        return [\n            'data' => $this->collection,\n \
    \           'links' => [\n                'self' => 'link-value',\n          \
    \  ],\n        ];\n    }\n}\n```\n*来源：www.laravel.com*\n\n一旦你定义了资源集合，就可以由路由或控制器返回它：\n\
    \n```php\nuse App\\Http\\Resources\\UserCollection;\nuse App\\Models\\User;\n\
    Route::get('/users', function () {\n    return new UserCollection(User::all());\n\
    });\n```\n\nLaravel 在从路由返回资源集合时，会将它的键（keys）恢复为数值顺序。尽管如此，你可以在资源类中提供 `preserveKeys`\
    \ 属性，以指示是否需要保留集合的原始键：\n\n```php\n<?php\nnamespace App\\Http\\Resources;\nuse Illuminate\\\
    Http\\Resources\\Json\\JsonResource;\n\nclass UserResource extends JsonResource\n\
    {\n    /**\n     * 指示资源的键是否应该被保留。\n     *\n     * @var bool\n     */\n    public\
    \ $preserveKeys = true;\n}\n```\n\n如果 `preserveKeys` 属性被设置为 `true`，则当集合从路由或控制器返回时，集合的键将被保留：\n\
    \n```php\nuse App\\Http\\Resources\\UserResource;\nuse App\\Models\\User;\nRoute::get('/users',\
    \ function () {\n    return UserResource::collection(User::all());\n});\n```\n\
    \n当 `preserveKeys` 属性设置为 `true` 时，当集合从路由或控制器返回时，集合的键将被保留。一旦你定义了资源集合，就可以由路由或控制器返回它。尽管如此，你可以在资源类中提供\
    \ `preserveKeys` 属性，以指示是否需要保留集合的原始键：\n\n```php\n<?php\nnamespace App\\Http\\Resources;\n\
    use Illuminate\\Http\\Resources\\Json\\JsonResource;\n\nclass UserResource extends\
    \ JsonResource\n{\n    /**\n     * 指示资源的键是否应该被保留。\n     *\n     * @var bool\n\
    \     */\n    public $preserveKeys = true;\n}\n```\n\n如果 `preserveKeys` 属性被设置为\
    \ `true`，则当集合从路由或控制器返回时，集合的键将被保留：\n\n```php\nuse App\\Http\\Resources\\UserResource;\n\
    use App\\Models\\User;\nRoute::get('/users', function () {\n    return UserResource::collection(User::all());\n\
    });\n```\n\n一旦你定义了资源集合，就可以由路由或控制器返回它。尽管如此，你可以在资源类中提供 `preserveKeys` 属性，以指示是否需要保留集合的原始键：\n\
    \n```php\n<?php\nnamespace App\\Http\\Resources;\nuse Illuminate\\Http\\Resources\\\
    Json\\JsonResource;\n\nclass UserResource extends JsonResource\n{\n    /**\n \
    \    * 指示资源的键是否应该被保留。\n     *\n     * @var bool\n     */\n    public $preserveKeys\
    \ = true;\n}\n```\n\n如果 `preserveKeys` 属性被设置为 `true`，则当集合从路由或控制器返回时，集合的键将被保留：\n\
    \n```php\nuse App\\Http\\Resources\\UserResource;\nuse App\\Models\\User;\nRoute::get('/users',\
