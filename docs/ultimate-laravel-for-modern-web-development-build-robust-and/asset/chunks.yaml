  trans: "\n\n当执行测试时，Laravel 会根据 `phpunit.xml` 文件中指定的环境参数自动将配置环境切换到 `testing`。此外，在测试阶段，Laravel\
    \ 默认会将话（session）和缓存（cache）配置为 `array` 驱动，确保会话或缓存数据不会持久化。\n\n如果你在 `testing` 环境下需要额外的配置参数，可以选择创建它们。你可以在应用程序的\
    \ `phpunit.xml` 文件中建立这些测试环境变量。但是，在运行测试之前，必须执行 `config:clear` Artisan 命令来清除配置缓存。\n\
    \n### `.env.testing` 环境文件\n\n你也可以在项目根目录下创建一个 `.env.testing` 文件并将其放置其中。当运行 PHPUnit\
    \ 测试或在执行 Artisan 命令时使用 `--env=testing` 选项时，该文件将替代 `.env` 文件。\n\n### `CreatesApplication`\
    \ Trait\n\n你应用程序中的基础 `TestCase` 类使用了 Laravel 自带的 `CreatesApplication` 特性。该特性中的\
    \ `createApplication` 函数会在执行你的测试之前引导 Laravel 应用程序。某些功能（如 Laravel 的并行测试功能）依赖于此属性，因此将其保持在原位置至关重要。\n\
    \n# 测试生命周期\n\n测试生命周期由测试 Laravel 应用程序时应执行的各种步骤组成。下图显示了 Laravel 应用程序测试生命周期的阶段。\n\
    \n![](img/Figure-8.1.jpg)\n\n**图 8.1:** Laravel 应用程序测试生命周期\n\n# 创建测试\n\n使用 `make:test`\
    \ Artisan 命令生成新的测试用例。测试默认存储在 `tests/Feature` 目录：\n\n```bash\nphp artisan make:test\
    \ SampleTest\n```\n\n若要在 `tests/Unit` 目录中创建测试，在执行 `make:test` 命令时使用 `–unit` 选项：\n\
    \n```bash\nphp artisan make:test SampleTest –unit\n```\n\n如果你想构建一个名为 `make:test`\
    \ 命令的 PHP 测试，可以为 make 命令提供 `--pest` 选项：\n\n```bash\nphp artisan make:test SampleTest\
    \ --pest\nphp artisan make:test SampleTest --unit --pest\n```\n\n生成测试文件后，你可以像往常一样使用\
    \ PHPUnit 来定义测试方法。从终端中使用 `vendor/bin/phpunit` 或 `php artisan test` 命令开始运行测试：\n\
    \n```php\n<?php\n\nnamespace Tests\\Unit;\n\nuse PHPUnit\\Framework\\TestCase;\n\
    \nclass Sampletest extends TestCase\n{\n    public function test_basic_test():\
    \ void\n    {\n        $this->assertTrue(true);\n        //测试用例逻辑\n    }\n}\n\
    ```\n\n# 运行测试\n\n要运行测试，请使用 `phpunit` 命令：\n\n```bash\n./vendor/bin/phpunit\n```\n\
    \n除了 `phpunit` 命令外，你还可以使用 `test` Artisan 命令运行测试。Artisan 测试运行器提供详细的测试结果，以便开发和调试：\n\
    \n```bash\nphp artisan test\n```\n\n任何可以传递给 `phpunit` 命令的参数也可以传递给 `Artisan test`\
    \ 命令：\n\n```bash\nphp artisan test --testsuite=Feature --stop-on-failure\n```\n\
    \n# 测试的并行执行\n\n通常，PHPUnit 和 Laravel 在单个进程中顺序执行测试。然而，选择跨多个进程并发测试可以显著缩短整体测试时间。要启动此过程，第一步涉及安装\
    \ `brianium/paratest` Composer 包作为 `dev` 依赖。随后，你可以使用启用 `--parallel` 选项的测试 Artisan\
    \ 命令来实现这种方法。\n\n```bash\ncomposer require brianium/paratest --dev\nphp artisan\
    \ test –-parallel\n```\n\nLaravel 默认启动的进程数等于计算机可用的 CPU 核心数。不过，你可以使用 `--processes`\
    \ 选项来更改进程数：\n\n```bash\nphp artisan test --parallel --processes=2\n```\n\n只要配置了主数据库连接，Laravel\
    \ 会为每个并行测试进程处理测试数据库的生成和迁移。每个进程都被分配了一个附加在测试数据库上的唯一进程令牌（token）。例如，如果有两个并发测试进程，Laravel\
    \ 将创建并利用 `your_db_test_1` 和 `your_db_test_2` 在测试数据库。\n\n默认情况下，测试数据库是持久的，在调用 `test`\
    \ Artisan 命令时可能会带有之前测试运行的数据。但是，你可以使用 `--recreate-databases` 选项根据需要重建这些数据库。\n\n\
    ```bash\nphp artisan test --parallel --recreate-databases\n```\n\n在某些情况下，有必要为应用程序的测试配置特定资源，以确保多个测试进程能够顺利访问。\n\
    \n使用 `ParallelTesting`  Facade，你可以定义在进程或测试用例的 `setUp` 和 `tearDown` 期间执行的代码。指定的闭包接收\
    \ `$token` 和 `$testCase` 变量，分别持有进程令牌和活跃的测试用例。\n\n```php\n<?php\n\nnamespace App\\\
    Providers;\n\nuse Illuminate\\Support\\Facades\\Artisan;\nuse Illuminate\\Support\\\
    Facades\\ParallelTesting;\nuse Illuminate\\Support\\ServiceProvider;\nuse PHPUnit\\\
    Framework\\TestCase;\n\nclass AppServiceProvider extends ServiceProvider\n{\n\
    \    public function boot(): void\n    {\n        ParallelTesting::setUpProcess(function\
    \ (int $token) {\n            // 逻辑\n        });\n\n        ParallelTesting::setUpTestCase(function\
    \ (int $token, TestCase $testCase) {\n            // 逻辑\n        });\n\n     \
    \   ParallelTesting::setUpDatabase(function (string $database, int $token) {\n\
    \            Artisan::call('db:seed');\n            // 逻辑\n        });\n\n   \
    \     ParallelTesting::tearDownTestCase(function (int $token, TestCase $testCase)\
    \ {\n            // 逻辑\n        });\n\n        ParallelTesting::tearDownProcess(function\
    \ (int $token) {\n            // 逻辑\n        });\n    }\n}\n```\n\n在测试代码的不同位置使用\
    \ `token` 方法来获取进程令牌。这种并发进程之间的资源分配是通过每个进程独有的字符串实现的。例如，Laravel 会将此令牌附加到测试数据库末尾。\n\
    \n```php\n$token = ParallelTesting::token();\n```\n\n# 报告\n\n当你运行应用程序测试时，可能希望检查测试使用了多少应用程序代码，以及测试用例是否真实覆盖了代码。你可以结合\
    \ `test` 命令使用 `--coverage` 选项来实现：\n\n```bash\nphp artisan test --coverage\n```\n\
    \n为应用程序提供最小测试覆盖率标准，可以使用 `--min` 选项。如果未达到阈值，测试套件将失败：\n\n```bash\nphp artisan test\
    \ --coverage --min=80.3\n```\n\n**分析**\n\nArtisan 测试运行器的一个方便功能是可以获取应用程序中运行时间最长的测试列表。运行\
    \ `--profile` 选项来获取最慢的测试列表。这可以帮助你快速确定需要修改哪些测试以加快测试套件：\n\n```bash\nphp artisan\
    \ test --profile\n```\n\n# HTTP 测试\n\nLaravel 提供了一个非常流畅的 API 用于向应用程序发送 HTTP 请求并接收结果。例如，考虑这里描述的特性测试：\n\
    \n```php\n<?php\n\nnamespace Tests\\Feature;\n\nuse Tests\\TestCase;\n\nclass\
    \ ExampleTest extends TestCase\n{\n    public function test_the_application_returns_a_successful_response():\
    \ void\n    {\n        $response = $this->get('/');\n        $response->assertStatus(200);\n\
    \    }\n}\n```\n\n"
- fmt: "\nWhile the `assertStatus` function states that the returned answer should\
    \ have the specified HTTP status code, the `get` method sends a `GET` request\
    \ to the application. Laravel has a number of assertions for examining the response\
    \ headers, content, JSON format, and other elements in addition to this straightforward\
    \ one.\n\n# Make a Request\n\nYou may use the get, `post`, `put`, `patch`, or\
    \ `delete` methods in your test to send a request to your application. These techniques\
    \ don’t really send your application a *real* HTTP request. Rather, the complete\
    \ network request is internally emulated.\n\nTest request methods return an instance\
    \ of `Illuminate\\Http\\Response` rather than an `Illuminate\\Testing\\TestResponse`\
    \ instance, which offers a number of useful assertions that let you investigate\
    \ the answers of your application:\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\
    \nuse Tests\\TestCase;\n\nclass ExampleTest extends TestCase\n{\n    public function\
    \ basicRequest(): void\n    {\n        $response = $this->get('/');\n        $response->assertStatus(200);\n\
    \    }\n}\n```\n\nGenerally speaking, there should only be one request made to\
    \ your application by each test. If a test method is used to run several requests,\
    \ unexpected behavior could happen.\n\n# Customizing Request Headers\n\nBefore\
    \ the request is delivered to the application, you can alter its headers using\
    \ the `withHeaders` function. You may add any custom headers to the request using\
    \ this method:\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\nuse Tests\\TestCase;\n\
    \nclass ExampleTest extends TestCase\n{\n    public function exampleSample():\
    \ void\n    {\n        $response = $this->withHeaders([\n            'X-Header'\
    \ => 'Value',\n        ])->post('/user', ['name' => 'ABC']);\n        $response->assertStatus(201);\n\
    \    }\n}\n```\n\n# Cookies\n\nTo set cookie values before sending a request,\
    \ use the `withCookie` or `withCookies` methods. While the `withCookies` function\
    \ takes an array of name/value pairs as its two parameters, the `withCookie` method\
    \ accepts a cookie name and value:\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\
    \nuse Tests\\TestCase;\n\nclass ExampleTest extends TestCase\n{\n    public function\
    \ exampleFunctionCookies(): void\n    {\n        $response = $this->withCookie('color',\
    \ 'red')->get('/');\n        $response = $this->withCookies([\n            'color'\
    \ => 'red',\n            'name' => 'ABC',\n        ])->get('/');\n    }\n}\n```\n\
    \n# Authentication\n\nDuring HTTP testing, Laravel offers a number of utilities\
    \ for dealing with the session. Using the `withSession` method, you may first\
    \ assign the session data to a specified array. You may use this to load data\
    \ into the session before sending a request to your application:\n\n```php\n<?php\n\
    \nnamespace Tests\\Feature;\n\nuse Tests\\TestCase;\n\nclass ExampleTest extends\
    \ TestCase\n{\n    public function exampleSessionInteraction(): void\n    {\n\
    \        $response = $this->withSession(['banned' => false])->get('/');\n    }\n\
    }\n```\n\nUsually, state is maintained for the present authorized user using Laravel’s\
    \ session. As a result, the `actingAs` helper function offers a quick and easy\
    \ manner of confirming that a certain user is the current user. For instance,\
    \ to create and authenticate a user, we may use a model factory:\n\n```php\n<?php\n\
    \nnamespace Tests\\Feature;\n\nuse App\\Models\\User;\nuse Tests\\TestCase;\n\n\
    class ExampleTest extends TestCase\n{\n    public function exampleAuth(): void\n\
    \    {\n        $user = User::factory()->create();\n        $response = $this->actingAs($user)\n\
    \            ->withSession(['banned' => false])\n            ->get('/');\n   \
    \ }\n}\n```\n\nYou can specify the desired guard for user authentication by including\
    \ the guard name as the second parameter in the `actingAs` function. Throughout\
    \ the test, the guard assigned to the `actingAs` method will also function as\
    \ the default guard.\n\n`$this->actingAs($user, 'web')`\n\n# Debugging Responses\n\
    \nThe `dump`, `dumpHeaders`, and `dumpSession` methods can be used to inspect\
    \ and debug the response content after submitting a test request to your application.\n\
    \n![](images/Figure-8.2.jpg)\n\n**Figure 8.2:** Methods of debugging response\n\
    \nLet’s look at an example:\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\n\
    use Tests\\TestCase;\n\nclass ExampleTest extends TestCase\n{\n    public function\
    \ exampleTest(): void\n    {\n        $response = $this->get('/');\n        $response->dumpHeaders();\n\
    \        $response->dumpSession();\n        $response->dump();\n    }\n}\n```\n\
    \nAs an alternative, you may suspend execution and dump response-related data\
    \ using the `dd`, `ddHeaders`, and `ddSession` methods:\n\n```php\n<?php\n\nnamespace\
    \ Tests\\Feature;\n\nuse Tests\\TestCase;\n\nclass ExampleTest extends TestCase\n\
    {\n    public function exampleTest(): void\n    {\n        $response = $this->get('/');\n\
    \        $response->dumpHeaders();\n        $response->dumpSession();\n      \
    \  $response->dump();\n    }\n}\n```\n\n# Exception Handling\n\nAt times, it may\
    \ be necessary to confirm whether an exception is raised within your application.\
    \ To assert that code inside a closure throws an exception of the designated type,\
    \ use the `assertThrows` method:\n\n`$this->assertThrows(`\n    fn () => (new\
    \ Order)->execute(),\n    OrderInvalid::class\n`);`\n\nDisabling deprecation handling\
    \ will result in deprecation warnings into exceptions, causing your test to fail.\n\
    \n`$response = $this->withoutDeprecationHandling()->get('/');`\n\n# File Upload\
    \ Testing\n\nFor the purpose of testing, you can employ the `fake` function from\
    \ the `UploadedFile` class to generate mock files. This simplifies the testing\
    \ of file uploads, particularly when used alongside the `Storage` facade’s `fake`\
    \ method. For instance, you can swiftly test an avatar upload form by combining\
    \ these two:\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\nuse Illuminate\\\
    Http\\UploadedFile;\nuse Illuminate\\Support\\Facades\\Storage;\nuse Tests\\TestCase;\n\
    \nclass ExampleTest extends TestCase\n{\n    public function testUpload(): void\n\
    \    {\n        Storage::fake('cat');\n        $file = UploadedFile::fake()->image('cat.jpg');\n\
    \        $response = $this->post('/cat', [\n            'cat' => $file,\n    \
    \    ]);\n        Storage::disk('cats')->assertExists($file->hashName());\n  \
    \  }\n}\n```\n\nYou may use the `assertMissing` function offered by the `Storage`\
    \ facade to assert that a certain file does not exist:\n\n`Storage::fake('cats');`\n\
    `// Application Logic`\n`Storage::disk('cats')->assertMissing('missing.jpg');`\n\
    \nTo properly test your application’s validation requirements, you may provide\
    \ the width, height, and size of the picture (in kilobytes) when generating files\
    \ using the `fake` method offered by the `UploadedFile` class:\n\n`UploadedFile::fake()->image('cat.jpg',\
    \ $width, $height)->size(100);`\n\nThe `create` method may be used to produce\
    \ any other sort of file in addition to images:\n\n`UploadedFile::fake()->create('document.pdf',\
    \ $sizeInKilobytes);`\n\nIf necessary, you may specify the MIME type that the\
    \ file should return directly by passing a `$mimeType` parameter to the method:\n\
    \n`UploadedFile::fake()->create('document.pdf', $sizeInKilobytes, 'application/pdf');`\n\
    \n# Debug in Laravel\n\nUsing Xdebug for step debugging is supported by Homestead.\
    \ For instance, PHP will establish a connection with your IDE when you open a\
    \ page in your browser, enabling you to view and edit the code that is now running.\n"
  raw: 'While the `assertStatus` function states that the returned answer should have
    the specified HTTP status code, the `get` method sends a `GET` request to the
    application. Laravel has a number of assertions for examining the response headers,
    content, JSON format, and other elements in addition to this straightforward one.


    # [Make a Request](#toc.xhtml#s237a)


    You may use the get, post, put, patch, or delete methods in your test to send
    a request to your application. These techniques don’t really send your application
    a *real* HTTP request. Rather, the complete network request is internally emulated.


    Test request methods return an instance of `Illuminate\Http\Response` rather than
    an `Illuminate\Testing\TestResponse` instance, which offers a number of useful
    assertions that let you investigate the answers of your application:


    `<?php`


    `namespace Tests\Feature;`


    `use Tests\TestCase;`


    `class ExampleTest extends TestCase`


    `{`


    `public function basicRequest(): void`


    `{`


    `$response = $this->get(‘/’);`


    `$response->assertStatus(200);`


    `}`


    `}`


    Generally speaking, there should only be one request made to your application
    by each test. If a test method is used to run several requests, unexpected behavior
    could happen.


    # [Customizing Request Headers](#toc.xhtml#s238a)


    Before the request is delivered to the application, you can alter its headers
    using the `withHeaders` function. You may add any custom headers to the request
    using this method:


    `<?php`


    `namespace Tests\Feature;`


    `use Tests\TestCase;`


    `class ExampleTest extends TestCase`


    `{`


    `public function exampleSample(): void`


    `{`


    `$response = $this->withHeaders([`


    `‘X-Header’ => ‘Value’,`


    `])->post(‘/user’, [‘name’ => ‘ABC’]);`


    `$response->assertStatus(201);`


    `}`


    `}`


    # [Cookies](#toc.xhtml#s239a)


    To set cookie values before sending a request, use the `withCookie` or `withCookies`
    methods. While the `withCookies` function takes an array of name/value pairs as
    its two parameters, the `withCookie` method accepts a cookie name and value:


    `<?php`


    `namespace Tests\Feature;`


    `use Tests\TestCase;`


    `class ExampleTest extends TestCase`


    `{`


    `public function exampleFunctionCookies(): void`


    `{`


    `$response = $this->withCookie(‘color’, ‘red’)->get(‘/’);`


    `$response = $this->withCookies([`


    `‘color’ => ‘red’,`


    `‘name’ => ‘ABC’,`


    `])->get(‘/’);`


    `}`


    `}`


    # [Authentication](#toc.xhtml#s240a)


    During HTTP testing, Laravel offers a number of utilities for dealing with the
    session. Using the `withSession` method, you may first assign the session data
    to a specified array. You may use this to load data into the session before sending
    a request to your application:


    `<?php`


    `namespace Tests\Feature;`


    `use Tests\TestCase;`


    `class ExampleTest extends TestCase`


    `{`


    `public function exampleSessionInteraction(): void`


    `{`


    `$response = $this->withSession([‘banned’ => false])->get(‘/’);`


    `}`


    `}`


    Usually, state is maintained for the present authorized user using Laravel’s session.
    As a result, the `actingAs` helper function offers a quick and easy manner of
    confirming that a certain user is the current user. For instance, to create and
    authenticate a user, we may use a model factory:


    `<?php`


    `namespace Tests\Feature;`


    `use App\Models\User;`


    `use Tests\TestCase;`


    `class ExampleTest extends TestCase`


    `{`


    `public function exampleAuth(): void`


    `{`


    `$user = User::factory()->create();`


    `$response = $this->actingAs($user)`


    `->withSession([‘banned’ => false])`


    `->get(‘/’);`


    `}`


    `}`


    You can specify the desired guard for user authentication by including the guard
    name as the second parameter in the `actingAs` function. Throughout the test,
    the guard assigned to the `actingAs` method will also function as the default
    guard.


    `$this->actingAs($user, ‘web’)`


    # [Debugging Responses](#toc.xhtml#s241a)


    The `dump`, `dumpHeaders`, and `dumpSession` methods can be used to inspect and
    debug the response content after submitting a test request to your application.


    ![](images/Figure-8.2.jpg)


    **Figure 8.2:** Methods of debugging response


    Let’s look at an example:


    `<?php`


    `namespace Tests\Feature;`


    `use Tests\TestCase;`


    `class ExampleTest extends TestCase`


    `{`


    `public function exampleTest(): void`


    `{`


    `$response = $this->get(‘/’);`


    `$response->dumpHeaders();`


    `$response->dumpSession();`


    `$response->dump();`


    `}`


    `}`


    As an alternative, you may suspend execution and dump response-related data using
    the `dd`, `ddHeaders`, and `ddSession` methods:


    `<?php`


    `namespace Tests\Feature;`


    `use Tests\TestCase;`


    `class ExampleTest extends TestCase`


    `{`


    `public function exampleTest(): void`


    `{`


    `$response = $this->get(‘/’);`


    `$response->ddHeaders();`


    `$response->ddSession();`


    `$response->dd();`


    `}`


    `}`


    # [Exception Handling](#toc.xhtml#s242a)


    At times, it may be necessary to confirm whether a specific exception is being
    raised within your application. To ensure that the exception is not intercepted
    by Laravel’s exception handler and presented as an HTTP response, you can employ
    the `withoutExceptionHandling` function before sending your request.


    `$response = $this->withoutExceptionHandling()->get(‘/’);`


    Furthermore, before sending your request, you have the option to utilize the `withoutDeprecationHandling`
    function, which ensures that your application does not rely on any functionalities
    that the PHP language or its associated libraries have deprecated. Disabling deprecation
    handling will result in the transformation of deprecation warnings into exceptions,
    causing your test to fail.


    `$response = $this->withoutDeprecationHandling()->get(‘/’);`


    To assert that code inside a given closure throws an exception of the designated
    type, use the `assertThrows` method:


    `$this->assertThrows(`


    `fn () => (new ProcessOrder)->execute(),`


    `OrderInvalid::class`


    `);`


    # [File Upload Testing](#toc.xhtml#s243a)


    For the purpose of testing, you can employ the `fake` function from the `Illuminate\Http\UploadedFile`
    class to generate mock files or images. This simplifies the testing of file uploads,
    particularly when used alongside the `Storage` facade’s `fake` method. For instance,
    you can swiftly test an avatar upload form by combining these two functionalities:


    `<?php`


    `namespace Tests\Feature;`


    `use Illuminate\Http\UploadedFile;`


    `use Illuminate\Support\Facades\Storage;`


    `use Tests\TestCase;`


    `class ExampleTest extends TestCase`


    `{`


    `public function testUpload(): void`


    `{`


    `Storage::fake(‘cat’);`


    `$file = UploadedFile::fake()->image(‘cat.jpg’);`


    `$response = $this->post(‘/cat’, [`


    `‘cat’ => $file,`


    `]);`


    `Storage::disk(‘cats’)->assertExists($file->hashName());`


    `}`


    `}`


    You may use the `assertMissing` function offered by the `Storage` facade to assert
    that a certain file does not exist:


    `Storage::fake(‘cats’);`


    `// Application Logic`


    `Storage::disk(‘cats’)->assertMissing(‘missing.jpg’);`


    To properly test your application’s validation requirements, you may provide the
    width, height, and size of the picture (in kilobytes) when generating files using
    the `fake` method offered by the `UploadedFile` class:


    `UploadedFile::fake()->image(‘cat.jpg’, $width, $height)->size(100);`


    The `create` method may be used to produce any other sort of file in addition
    to images:


    `UploadedFile::fake()->create(‘document.pdf’, $sizeInKilobytes);`


    If necessary, you may specify the MIME type that the file should return directly
    by passing a `$mimeType` parameter to the method:


    `UploadedFile::fake()->create(`


    `‘document.pdf’, $sizeInKilobytes, ‘application/pdf’`


    `);`


    # [Debugging in Laravel](#toc.xhtml#s244a)


    Using Xdebug for step debugging is supported by Homestead. For instance, PHP will
    establish a connection with your IDE when you open a page in your browser, enabling
    you to view and edit the code that is now running.'
