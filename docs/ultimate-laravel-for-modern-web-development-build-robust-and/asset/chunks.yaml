  trans: "\n我们可以利用查询构造器 `select` 和 `addSelect` 方法提供的子查询功能，通过单次查询选择所有的 `locations`\
    \ 以及每个位置的办公室名称：\n\n```php\nuse App\\Models\\Location;\nuse App\\Models\\Office;\n\
    \nreturn Location::addSelect([‘last_office’ => Office::select(‘name’)\n->whereColumn(‘Location_id’,\
    \ ‘locations.id’)\n->orderByDesc(‘Location_id’)\n->limit(1)])->get();\n```\n\n\
    此外，查询构造器的 `orderBy` 函数也支持子查询。以我们的办公室为例，我们可以利用此功能根据每个位置最近添加/建造办公室的时间对所有位置进行排序。\n\
    \n# 模型上的 CRUD 操作\n\n在使用 Eloquent 时，不仅要从数据库中获取模型，添加新记录也同样重要。幸运的是，Eloquent 让这一切变得非常简单。你只需要创建一个新的模型实例，指定它的属性，然后使用模型实例的\
    \ `save` 方法向数据库中插入新记录即可：\n\n```php\n<?php\nnamespace App\\Http\\Controllers;\n\
    use App\\Http\\Controllers\\Controller;\nuse App\\Models\\Office;\nuse Illuminate\\\
    Http\\RedirectResponse;\nuse Illuminate\\Http\\Request;\n\nclass OfficeController\
    \ extends Controller\n{\n    /**\n     * 在数据库中存储一个新的 Office。\n     */\n    public\
    \ function store(Request $request): RedirectResponse\n    {\n        // 验证请求…\n\
    \        $office = new Office;\n        $office->name = $request->name;\n    \
    \    $office->save();\n        return redirect(‘/offices’);\n    }\n}\n```\n\n\
    数据库中已经存在的模型可以使用 `save` 技术进行更新。必须先检索模型才能进行更新，然后设置任何所需的属性。最后再调用模型的 `save` 方法。同样，不需要显式地指定\
    \ `updated_at` 时间戳的值，因为它会被自动更新：\n\n```php\nuse App\\Models\\Office;\n$office =\
    \ Office::find(1);\n$office ->name = ‘SFO’;\n$office ->save();\n```\n\n你可以使用模型实例的\
    \ `delete` 函数来删除模型：\n\n```php\nuse App\\Models\\Office;\n$office = Office::find(1);\n\
    $office->delete();\n```\n\n# 事件\n\nEloquent 模型会发出各种事件，允许你钩入以下生命周期事件：\n\n1. retrieved\n\
    2. creating\n3. created\n4. updating\n5. updated\n6. saving\n7. saved\n8. deleting\n\
    9. deleted\n10. trashed\n11. forceDeleting\n12. forceDeleted\n13. restoring\n\
    14. restored\n15. replicating\n\n如果你在某个模型上监听许多事件，请使用观察者（Observers）将所有的监听器分类到同一个类中。你想要监听的\
    \ Eloquent 事件反映在观察者类的方法名中。受影响的模型是这些方法的唯一参数。构建新观察者类最简单的方法是使用 `make:observer` 命令：\n\
    \n```bash\nphp artisan make:observer UserObserver --model=Employee\n```\n\n该命令会将新的观察者添加到\
    \ `app/Observers` 目录中。如果该目录不存在，Artisan 会为你创建它。你的中立观察者看起来如下：\n\n```php\n<?php\n\
    namespace App\\Observers;\nuse App\\Models\\Employee;\n\nclass EmployeeObserver\n\
    {\n    /**\n     * 处理 Employee “created” 事件。\n     */\n    public function created(Employee\
    \ $employee): void\n    {\n        // 代码逻辑\n    }\n    /**\n     * 处理 Employee\
    \ “updated” 事件。\n     */\n    public function updated(User $employee): void\n\
    \    {\n        // 代码逻辑\n    }\n    /**\n     * 处理 User “deleted” 事件。\n     */\n\
    \    public function deleted(User $user): void\n    {\n        // …\n    }\n \
    \   /**\n     * 处理 Employee “restored” 事件。\n     */\n    public function restored(User\
    \ $employee): void\n    {\n        // 代码逻辑\n    }\n    /**\n     * 处理 Employee\
    \ “forceDeleted” 事件。\n     */\n    public function forceDeleted(User $employee):\
    \ void\n    {\n        // 代码逻辑\n    }\n}\n```\n\n有时，你可能需要静默（mute）整个模型的整个事件触发。这可以通过利用\
    \ `withoutEvents` 技术来实现。`withoutEvents` 函数的唯一输入是一个闭包（closure）。`withoutEvents`\
    \ 函数将返回闭包的任何结果，并且在此闭包内执行的任何代码都不会触发模型事件。\n\n# 总结\n\n在本章——*使用 Eloquent ORM 和查询构造器*\
    \ 中，重点是在流行的 PHP Web 开发框架 Laravel 的背景下探索 Eloquent ORM 和查询构造器的基本概念。本章开始介绍了 Eloquent\
    \ ORM 和查询构造器在 Laravel 中的重要性。本章的目标是让读者彻底理解 Eloquent ORM 和查询构造器，并强调它们在数据库操作中的意义。在下一章中，我们将查看\
    \ Laravel 的安全性方面，包括身份验证和授权。\n"
- fmt: "\n* Sorting middleware\n* Middleware parameters\n* Terminable middleware\n\
    \n# Laravel’s built-in Authentication System\n\nMany online apps include a method\
    \ for users to `login` and authenticate with the program. This feature’s implementation\
    \ in web applications can be a challenging and perhaps dangerous task. Laravel\
    \ makes an effort to provide you with the resources you need to create authentication\
    \ quickly, safely, and simply.\n\nThe `guards` and `providers` at the center of\
    \ Laravel’s authentication infrastructure make up the system. `guards` specify\
    \ the user authentication process for each request. For instance, Laravel has\
    \ a `session` guard that uses cookies and session storage to retain state.\n\n\
    Users are fetched from your persistent storage via `providers`. Laravel includes\
    \ `Eloquent` and the database query builder functionality for fetching users.\
    \ You may, however, establish more `providers` as needed for your application.\n\
    \nThe authentication configuration file for your application is located at `config/auth.php`.\
    \ This file includes a number of well-documented options for modifying the behavior\
    \ of Laravel’s authentication services.\n\n# Laravel API Authentication Services\n\
    \nPassport and Sanctum are two optional packages provided by Laravel to help you\
    \ manage API tokens and authenticate requests performed with API tokens. Please\
    \ keep in mind that these libraries and the built-in cookie-based authentication\
    \ libraries in Laravel are not mutually exclusive. These libraries are primarily\
    \ concerned with API token authentication, whereas the built-in authentication\
    \ services are concerned with cookie-based browser authentication. Many applications\
    \ will make use of both Laravel’s built-in cookie-based authentication and one\
    \ of Laravel’s API authentication packages.\n\n![](images/Figure-6.1.jpg)\n\n\
    **Figure 6.1:** Laravel Auth Packages\n\nIn addition to Passport and Sanctum,\
    \ Laravel also has Laravel Fortify that can be used for authentication. Laravel\
    \ Fortify is a Laravel authentication backend implementation that is not dependent\
    \ on the front end. Fortify registers the routes and controllers required to implement\
    \ all of Laravel’s authentication capabilities, including login, registration,\
    \ password reset, and email verification.\n\n# Passport\n\nPassport is an OAuth2\
    \ authentication provider that provides a number of OAuth2 “grant types” that\
    \ allow you to issue different sorts of tokens. In general, this is a comprehensive\
    \ and complicated API authentication package.\n\nMost apps, however, do not require\
    \ the extensive functionalities provided by the OAuth2 spec, which can be perplexing\
    \ for both users and developers. Furthermore, developers have previously been\
    \ perplexed as to how to authenticate SPA apps or mobile applications utilizing\
    \ OAuth2 authentication providers, such as Passport.\n\n# Sanctum\n\nLaravel Sanctum\
    \ is an authentication package that solves a number of problems faced in developing\
    \ Laravel applications. The package is a more streamlined package that is capable\
    \ of handling first-party web requests as well as API calls made through tokens.\
    \ This also helps remove the complexity of OAuth2.\n\nIn addition to being an\
    \ API, it offers a first-party web UI, which means that SPA (single-page applications)\
    \ exists independent of the backend Laravel application and independent of the\
    \ mobile client.\n\nLaravel Sanctum is a hybrid web/API authentication module\
    \ that can handle the complete authentication process for your application. This\
    \ is feasible because when Sanctum-based apps get a request, Sanctum first determines\
    \ if the request has a session cookie referencing an authenticated session.\n\n\
    Sanctum achieves this by utilizing Laravel’s built-in authentication services.\n\
    \n# Customizing Authentication\n\nTo achieve custom authentication logic, you\
    \ will need to extend Laravel with your own user provider. To define a custom\
    \ user provider, we will utilize the `provider` method on the `Auth` façade. The\
    \ user provider resolver should return an `Illuminate\\Contracts\\Auth\\UserProvider`\
    \ implementation:\n\n```php\n<?php\n\nnamespace App\\Providers;\n\nuse App\\Extensions\\\
    TestEmployeeProvider;\nuse Illuminate\\Contracts\\Foundation\\Application;\nuse\
    \ Illuminate\\Foundation\\Providers\\AuthServiceProvider as ServiceProvider;\n\
    use Illuminate\\Support\\Facades\\Auth;\n\nclass AuthServiceProvider extends ServiceProvider\n\
    {\n    /**\n     * Register any application authentication / authorization services.\n\
    \     */\n    public function boot(): void\n    {\n        Auth::provider('test',\
    \ function (Application $app, array $config) {\n            // Return an instance\
    \ of Illuminate\\Contracts\\Auth\\UserProvider\n            return new TestEmployeeProvider($app->make('test.connection'));\n\
    \        });\n    }\n}\n```\n\nAfter you’ve registered the provider using the\
    \ provider method, you may change your `auth.php` configuration file to utilize\
    \ the new user provider. First, identify a provider that will make use of your\
    \ new driver:\n\n```php\n'providers' => [\n    'employees' => [\n        'driver'\
    \ => 'test',\n    ],\n],\n```\n\nFinally, you may use the following provider in\
    \ your `guards` configuration:\n\n```php\n'guards' => [\n    'web' => [\n    \
    \    'driver' => 'session',\n        'provider' => 'employees',\n    ],\n],\n\
    ```\n\n# Stateless Authentication\n\nTo handle stateless authentication, you may\
    \ create a middleware:\n\n```php\n<?php\n\nnamespace App\\Middleware;\n\nuse Closure;\n\
    use Illuminate\\Http\\Request;\nuse Illuminate\\Support\\Facades\\Auth;\nuse Symfony\\\
    Component\\HttpFoundation\\Response;\n\nclass AuthenticateBasic\n{\n    /**\n\
    \     * Handle an incoming request.\n     *\n     * @param  \\Illuminate\\Http\\\
    Request  $request\n     * @param  \\Closure  $next\n     * @return \\Symfony\\\
    Component\\HttpFoundation\\Response\n     */\n    public function handle(Request\
    \ $request, Closure $next): Response\n    {\n        return Auth::once() ?: $next($request);\n\
    \    }\n}\n```\n\nAdditionally, attach a middleware to a route:\n\n```php\nRoute::get('/api/user',\
    \ function () {\n    // Only authenticated users may access this route\n})->middleware(AuthenticateBasic::class);\n\
    ```\n"
