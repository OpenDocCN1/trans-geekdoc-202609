    \ how to use Controllers with views, redirects, directives, and Blade as template\
    \ engines.\n\n# [Structure](#toc.xhtml#s95a)\n\nIn this chapter, we will discuss\
    \ the following topics:\n\n*   Controllers with Views in Laravel \n\n    *   Controllers\n\
    \n    *   Resource Controllers\n\n    *   Constructor Injection\n\n    *   Method\
    \ Injection\n\n*   Redirects in Laravel \n\n    *   Redirect Helper\n\n    * \
    \  Redirecting to Named Routes\n\n    *   Redirecting to Controller Actions\n\n\
    *   Directives in Laravel \n\n    *   Conditional Directive\n\n    *   Switch\
    \ Directive\n\n    *   Auth Directive\n\n    *   Loops\n\n    *   Once Directive\n\
    \n*   Blade as Template Engines in Laravel \n\n    *   Data in Blade\n\n    *\
    \   HTML Entity Encoding\n\n    *   Components \n\n        *   Rendering Components\n\
    \n        *   Passing Data\n\n    *   Layouts\n\n    *   Rendering Blade Templates\n\
    \n    *   Rendering Blade Fragments\n\n# [Controllers with Views in Laravel](#toc.xhtml#s96a)\n\
    \nControllers in the MVC architecture are simply classes that group the functionality\
    \ of one or more routes together. Particularly, if your application is organized\
    \ in a traditionally CRUD-like fashion, controllers prefer to group related routes\
    \ together.\n\nA good coding and application development practice is to separate\
    \ the application logic as per the Model-View-Controller (MVC) logic. It may feel\
    \ easier to have all logic in the controller, but that will drive away from the\
    \ purpose and the intention of the MVC architecture.\n\nA controller may manage\
    \ all the actions that can be performed on a specific resource, such as:\n\n**CRUD\
    \ – Create, Read, Update, Delete**\n\n# [Controllers](#toc.xhtml#s97a)\n\nThe\
    \ `make:controller` Artisan command is used to rapidly create a new controller,\
    \ and the `app/Http/Controllers` directory is where the Laravel application’s\
    \ controllers are kept by default.\n\nFor example:\n\n`php artisan make:controller\
    \ UserController`\n\nUsing the controller syntax, let’s look at the following\
    \ example to create a controller in Laravel:\n\n`<?php`\n\n`namespace App\\Http\\\
    Controllers;`\n\n`use App\\Models\\User;`\n\n`use Illuminate\\View\\View;`\n\n\
    `class UserController extends Controller`\n\n`{`\n\n`/*`\n\n`* Display the details\
    \ for a given user.`\n\n`*/`\n\n`public function show(string $id): View`\n\n`{`\n\
    \n`return view(‘user.details’, [`\n\n`‘user’ => User::findOrFail($id)`\n\n`]);`\n\
    \n`}`\n\n`}`\n\nThe display function on the `App\\Http\\Controllers\\UserController`\
    \ class is called and the route parameters are provided to it when an incoming\
    \ request matches the specified route URI.\n\n# [Resource Controllers](#toc.xhtml#s98a)\n\
    \nIt is customary to execute the same sets of actions against each resource in\
    \ your application, especially if you consider each Eloquent model to be a **resource**\
    \ rather than a data object. Consider a scenario in which your application includes\
    \ both a `Painting` model and a `Museum` model. Users most likely have the ability\
    \ to add, read, modify, or remove these resources.\n\nDue to this common use scenario,\
    \ Laravel resource routing only requires one line of code to assign the normal\
    \ create, read, update, and delete (CRUD) routes to a controller. We can utilize\
    \ the `make:controller` to get going here. Use the `--resource` argument of the\
    \ controller Artisan command to rapidly construct a controller to handle these\
    \ actions:\n\n`php artisan make:controller PaintingController --resource`\n\n\
    The controller created by this command will be located in `app/Http/Controllers/PaintingController.php`.\
    \ For each of the possible resource operations, a method will be present in the\
    \ controller. Following that, you can set up a resource route that directs traffic\
    \ to the controller:\n\n`use App\\Http\\Controllers\\PaintingController;`\n\n\
    `Route::resource(paintings, PaintingController::class);`\n\nMultiple routes are\
    \ created by this single route declaration to handle various operations on the\
    \ resource. Each of these actions will already have methods stubbed in the created\
    \ controller. Remember that the `route:list` Artisan command may always be used\
    \ to receive a quick overview of the routes in your application.\n\nAdditionally,\
    \ by providing an array to the `resources` methods, you may even register many\
    \ resource controllers at once:\n\n`Route::resources([`\n\n`‘paintings’ => PaintingController::class,`\n\
    \n`‘picture’ => PictureController::class,`\n\n`]);`\n\n| **Verb** || **URI** ||\
    \ **Action** || **Route Name** |\n\n| --- | --- | --- | --- |\n\n| `GET` || `/paintings`\
    \ || `index` || `paintings.index` |\n\n| `GET` || `/paintings/create` || `create`\
    \ || `paintings.create` |\n\n| `POST` || `/paintings` || `store` || `paintings.store`\
    \ |\n\n| `GET` || `/paintings/{paintings}` || `show` || `paintings.show` |\n\n\
    | `GET` || `/paintings/{paintings}/edit` || `edit` || `paintings.edit` |\n\n|\
    \ `PUT/PATCH` || `/paintings/{paintings}` || `update` || `paintings.update` |\n\
    \n| `DELETE` || `/paintings/{paintings}` || `destroy` || `paintings.destroy` |\n\
    \n**Table 4.1:** Action, Routes, and URLs\n\n# [Constructor Injection](#toc.xhtml#s99a)\n\
    \nAll Laravel controllers are resolved using the Laravel service container. You\
    \ may type-hint any dependencies your controller might require in its constructor\
    \ as a consequence. Automatic resolution and injection of the given dependencies\
    \ into the controller instance will take place:\n\n`<?php`\n\n`namespace App\\\
    Http\\Controllers;`\n\n`use App\\Repositories\\EmployeeRepository;`\n\n`class\
    \ EmployeeController extends Controller`\n\n`{`\n\n`/*`\n\n`* Create a new controller\
    \ instance.`\n\n`*/`\n\n`public function __construct(`\n\n`protected EmployeeRepository\
    \ $employees,`\n\n`) {}`\n\n`}`\n\n# [Method Injection](#toc.xhtml#s100a)\n\n\
    You may type-hint dependencies on the methods of your controller in addition to\
    \ injecting requirements in constructors. Injecting the `Illuminate\\Http\\Request`\
    \ object into your controller functions is a typical application of method injection:\n\
    \n`<?php`\n\n`namespace App\\Http\\Controllers;`\n\n`use Illuminate\\Http\\RedirectResponse;`\n\
    \n`use Illuminate\\Http\\Request;`\n\n`class EmployeeController extends Controller`\n\
    \n`{`\n\n`// Store a new employee.`\n\n`public function store(Request $request):\
    \ RedirectResponse`\n\n`{`\n\n`$name = $request->name;`\n\n`// Store the employee…`\n\
    \n`return redirect(‘/employees’);`\n\n`}`\n\n`}`\n\nList your route arguments\
    \ after your other requirements if your controller function additionally requires\
    \ input from a route parameter. For instance, if your route is specified as follows:\n\
    \n`use App\\Http\\Controllers\\EmployeeController;`\n\n`Route::put(‘/employee/{id}’,\
    \ [EmployeeController::class, ‘update’]);`\n\n# [Redirects in Laravel](#toc.xhtml#s101a)"
