    # [Database Migrations](#toc.xhtml#s128a)


    Database migrations play a crucial role in managing version control for databases,
    allowing your team to formulate and distribute the schema definition for the application’s
    database. If you’ve ever encountered the challenge of instructing a team member
    to manually integrate a new column into their local database schema after pulling
    your changes from source control, you’ve likely grappled with the problem that
    database migrations aim to solve.


    The Laravel Schema facade offers a versatile solution for creating and manipulating
    tables in a manner that is independent of the underlying database system. This
    facade is commonly employed in migrations to facilitate the creation and modification
    of database tables and columns across all of Laravel’s supported database systems.


    To create a database migration, use the `make:migration` Artisan command. The
    newly created migration will be saved in your `database/migrations` directory.
    Each migration filename has a date, which helps Laravel to identify the migrations’
    order:


    `php artisan make:migration create_cars_table`


    Laravel endeavors to predict the table name and determine whether a migration
    will generate a new table by analyzing the migration’s name. If Laravel can deduce
    the table name from the migration name, it automatically populates the created
    migration file with the identified table. However, if the table name cannot be
    inferred, you have the option to explicitly specify the table within the migration
    file.


    When employing the `make:migration` command, you have the flexibility to utilize
    the `--path` option to designate a particular path for the resultant migration.
    The specified path should be relative to your application’s base path.


    # [Primary Key](#toc.xhtml#s129a)


    Eloquent will additionally presume that the associated database table for each
    model contains an `id` primary key field. If required, you may designate a different
    column as your model’s main key by creating a protected `$primaryKey` property
    on your model:


    `<?php`


    `namespace App\Models;`


    `use Illuminate\Database\Eloquent\Model;`


    `class Car extends Model`


    `{`


    `/*`


    `* The primary key associated with the table.`


    `*`


    `* @var string`


    `*/`


    `protected $primaryKey = ‘car_id’;`


    `}`


    Each model must have at least one **ID** that may act as its primary key according
    to Eloquent. Eloquent models do not allow **composite** main keys. However, in
    addition to the main key that uniquely identifies the table, you are allowed to
    add other multi-column, unique indexes to your database tables.


    # [Timestamps](#toc.xhtml#s130a)


    By default, Eloquent anticipates the associated database table for your model
    to have the fields `created_at` and `updated_at`. When models are made or changed,
    Eloquent will automatically set the values for these columns. You should set the
    `$timestamps` property on your model to `false` if you do not want Eloquent to
    manage these columns automatically:


    `<?php`


    `namespace App\Models;`


    `use Illuminate\Database\Eloquent\Model;`


    `class Car extends Model`


    `{`


    `/*`


    `* Indicates if the model should be timestamped.`


    `*`


    `* @var bool`


    `*/`


    `public $timestamps = false;`


    `}`


    You can work on the model within a closure provided by the `withoutTimestamps`
    function if you don’t want the model’s `updated_at` timestamp to be changed while
    you’re working on it.


    # [Eloquent Events](#toc.xhtml#s131a)


    The different events in the lifecycle of an Eloquent can be used in any logical
    order and are as follows:


    ![](images/Figure-5.1.jpg)


    **Figure 5.1:** Eloquent Events


    When a current model is obtained from the database, the retrieved event will be
    sent. The creating and created events will be dispatched when a new model is stored
    for the first time. When an existing model is changed and the save method is invoked,
    the updating/updated events will be dispatched. When a model is created or modified,
    even if its characteristics have not changed, the saving/saved events will be
    dispatched.


    Events with names that end in `-ing` are sent out before any model changes are
    saved, whereas events with names that end in `-ed` are sent out once the changes
    to the model have been saved.


    For instance, create a `$dispatchesEvents` property on your Eloquent model to
    begin receiving model events. This property associates your own event classes
    with various phases of the Eloquent model’s lifecycle. Each model event class
    should anticipate receiving a constructor call from the impacted model’s instance:


    `<?php`


    `namespace App\Models;`


    `use App\Events\UserDeleted;`


    `use App\Events\UserSaved;`


    `use Illuminate\Foundation\Auth\User as Authenticatable;`


    `use Illuminate\Notifications\Notifiable;`


    `class User extends Authenticatable`


    `{`


    `use Notifiable;`


    `/*`


    `* The event map for the model.`


    `*`


    `* @var array`


    `*/`


    `protected $dispatchesEvents = [`


    ` ‘saved’ => UserSaved::class,`


    ` ‘deleted’ => UserDeleted::class,`


    `];`


    `}`


    (**Source**: Laravel.com/docs)


    # [Query Builder in Laravel](#toc.xhtml#s132a)


    Query Builder is one of the Laravel Framework’s most crucial features. The database
    query builder provided by the Laravel framework provides a simple and intuitive
    interface for developing and using database queries. The majority of database
    activities in the application may be carried out using this method, and it works
    with all database systems supported by the Laravel Framework. To safeguard the
    application from any SQL injection threats, it is built on PDO parameter binding.


    PDO parameter binding is used extensively throughout the Laravel query builder
    to defend your application from SQL injection threats. Strings passed as bindings
    do not need to be cleaned.


    # [Selects](#toc.xhtml#s133a)


    Selects are used to retrieve data in a Laravel application. In understanding Query
    Builder, we will look into the Employee Database scenario.


    To fetch all rows:


    `$employees = DB::table(‘employees’)->get();`


    `foreach ($employees as $employee)`


    `{`


    `var_dump($employee->name);`


    `}`


    To fetch a single row:


    `$employee = DB::table(‘employees’)->where(‘name’, ‘ABC’)->first();`


    `var_dump($employee->name);`


    To fetch a single column:


    `$employee = DB::table(‘employees’)->where(‘name’, ‘ABC’)->pluck(‘name’);`


    Select Clause:


    `$employees = DB::table(‘employees’)->select(‘name’, ‘email’)->get();`


    `$employees = DB::table(‘employees’)->distinct()->get();`


    `$employees = DB::table(‘employees’)->select(‘name as employeeName’)->get();`


    OR Statements:


    `$employees = DB::table(‘employees’)`


    `->where(‘employedDays’, ‘>’, 180)`


    `->orWhere(‘name’, ‘ABC’)`


    ` ->get();`


    OrderBy, GroupBy, and having:


    `$employees = DB::table(‘employees’)`


    ` ->orderBy(‘name’, ‘desc’)`


    ` ->groupBy(‘count’)`


    ` ->having(‘count’, ‘>’, 180)`


    ` ->get();`


    # [Joins](#toc.xhtml#s134a)


    Based on a shared column between two or more columns, a JOIN clause is used to
    merge rows from those tables.


    Syntax with an example:


    `DB::table(‘employees’)`


    `->join(‘contacts’, ‘employees.id’, ‘=’, ‘contacts. employee _id’)`


    `->join(‘orders’, ‘employees.id’, ‘=’, ‘orders. employee _id’)`


    `->select(‘employees.id’, ‘contacts.phone’, ‘orders.price’)`


    `->get();`


    # [Left Join](#toc.xhtml#s135a)


    ![](images/Figure-5.2.jpg)


    **Figure 5.2:** Left Join


    To implement a join in code, refer to the following code example:


