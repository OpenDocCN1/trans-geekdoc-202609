  raw: "This chapter will cover the API development with Laravel. It will teach the\
    \ user right from introduction on REST APIs to additional complex topics on APIs.\
    \ The chapter will also focus on Laravel Passport API, its features, and much\
    \ more.\n\n# [Structure](#toc.xhtml#s194a)\n\nIn this chapter, we will cover the\
    \ following topics:\n\n*   Understanding APIs, REST\n\n*   Resources, Collections\
    \ and Nesting Relationships \n\n    *   Writing Resources \n\n        *   Relationships\n\
    \n        *   Data Wrapping\n\n        *   Pagination\n\n        *   Conditional\
    \ Relationships\n\n    *   Resource Response\n\n*   Laravel Passport \n\n    *\
    \   Installation and Setup\n\n    *   Configuration\n\n    *   Access Tokens\n\
    \n    *   Protecting Routes\n\n    *   Token Scopes\n\n# [Understanding APIs,\
    \ REST](#toc.xhtml#s195a)\n\nAPI stands for Application Programming Interface.\
    \ APIs can be paralleled to a set of protocols between different software programs\
    \ to communicate with each other, that is, to share data and/or functionality\
    \ with each other.\n\nThere are two types of APIs widely used:\n\n![](images/Figure-7.1.jpg)\n\
    \n**Figure 7.1:** Types of API\n\n# [REST](#toc.xhtml#s196a)\n\nREST API stands\
    \ for Representational State Transfer.\n\nIt is a single resource for multiple\
    \ actions in the API layer and uses CRUD (Create, Read, Update, Delete) operations\
    \ to manipulate and transform data.\n\n# [SOAP](#toc.xhtml#s197a)\n\nSOAP API\
    \ stands for Simple Object Access Protocol.\n\nIt can be both stateful and stateless.\
    \ It makes its calls using POST and also exposes the method calls that are done\
    \ for communication and transfer of data packets.\n\n# [Resources, Collections\
    \ and Nesting Relationships](#toc.xhtml#s198a)\n\nWhen establishing the resource\
    \ instance in your route or controller, you should use the `collection` method\
    \ offered by your resource class if you are delivering a paginated response or\
    \ a collection of resources:\n\n`use App\\Http\\Resources\\UserResource;`\n\n\
    `use App\\Models\\User;`\n\n`Route::get(‘/users’, function () {`\n\n`return UserResource::collection(User::all());`\n\
    \n`});`\n\nPlease take note that custom metadata additions are not permitted and\
    \ must be returned with your collection. You may make a specific resource to represent\
    \ the collection if you would like to alter the resource collection response:\n\
    \n`php artisan make:resource UserCollection`\n\nAny metadata that has to be included\
    \ with the response can be readily defined after the resource collection class\
    \ has been generated:\n\n`<?php`\n\n`namespace App\\Http\\Resources;`\n\n`use\
    \ Illuminate\\Http\\Request;`\n\n`use Illuminate\\Http\\Resources\\Json\\ResourceCollection;`\n\
    \n`class UserCollection extends ResourceCollection`\n\n`{`\n\n`/**`\n\n`* Transform\
    \ the resource collection into an array.`\n\n`*`\n\n`* @return array<int|string,\
    \ mixed>`\n\n`*/`\n\n`public function toArray(Request $request): array`\n\n`{`\n\
    \n`return [`\n\n`‘data’ => $this->collection,`\n\n`‘links’ => [`\n\n`‘self’ =>\
    \ ‘link-value’,`\n\n`],`\n\n`];`\n\n`}`\n\n`}`\n\n*Source: www.laravel.com*\n\n\
    It might be returned by a route or controller once you have defined your resource\
    \ collection:\n\n`use App\\Http\\Resources\\UserCollection;`\n\n`use App\\Models\\\
    User;`\n\n`Route::get(‘/users’, function () {`\n\n`return new UserCollection(User::all());`\n\
    \n`});`\n\nLaravel restores the resource collection’s keys to their numerical\
    \ order upon returning them from a route. Nonetheless, you may provide a `preserveKeys`\
    \ attribute in your resource class that indicates if the original keys of a collection\
    \ need to be kept:\n\n`<?php`\n\n`namespace App\\Http\\Resources;`\n\n`use Illuminate\\\
    Http\\Resources\\Json\\JsonResource;`\n\n`class UserResource extends JsonResource`\n\
    \n`{`\n\n`/**`\n\n`* Indicates if the resource’s collection keys should be preserved.`\n\
    \n`*`\n\n`* @var bool`\n\n`*/`\n\n`public $preserveKeys = true;`\n\n`}`\n\nCollection\
    \ keys will be kept when the collection is returned from a route or controller\
    \ if the `preserveKeys` attribute is set to `true`:\n\n`use App\\Http\\Resources\\\
    UserResource;`\n\n`use App\\Models\\User;`\n\n`Route::get(‘/users’, function ()\
    \ {`\n\n`return UserResource::collection(User::all()->keyBy->id);`\n\n`});`\n\n\
    A resource collection’s `$this->collection` attribute is usually immediately supplied\
    \ with the outcome of mapping each item to its unique resource class. Without\
    \ the trailing `Collection` part in the class name, the single resource class\
    \ is taken to be the collection’s class name. Furthermore, `Resource` may or may\
    \ not be suffixed to the solitary resource class, based on your personal desire.\n\
    \n`UserCollection`, for instance, will try to map the supplied user instances\
    \ to the `UserResource` resource. You may modify this behavior by overriding your\
    \ resource collection’s `$collects` property:\n\n`<?php`\n\n`namespace App\\Http\\\
    Resources;`\n\n`use Illuminate\\Http\\Resources\\Json\\ResourceCollection;`\n\n\
    `class UserCollection extends ResourceCollection`\n\n`{`\n\n`public $collects\
    \ = Member::class;`\n\n`}`\n\n# [Writing Resource](#toc.xhtml#s199a)\n\nAll that\
    \ is required are resources to convert a given model into an array. Therefore,\
    \ every resource has a `toArray` function that converts the characteristics of\
    \ your model into an array that is compatible with APIs and can be obtained by\
    \ your application’s routes or controllers:\n\n`<?php`\n\n`namespace App\\Http\\\
    Resources;`\n\n`use Illuminate\\Http\\Request;`\n\n`use Illuminate\\Http\\Resources\\\
    Json\\JsonResource;`\n\n`class UserResource extends JsonResource`\n\n`{`\n\n`public\
    \ function toArray(Request $request): array`\n\n`{`\n\n`return [`\n\n`‘id’ =>\
    \ $this->id,`\n\n`‘name’ => $this->name,`\n\n`‘city’ => $this->city,`\n\n`‘created_at’\
    \ => $this->created_at,`\n\n`‘updated_at’ => $this->updated_at,`\n\n`];`\n\n`}`\n\
    \n`}`\n\nA resource can be returned straight from a route or controller after\
    \ it has been defined:\n\n`use App\\Http\\Resources\\UserResource;`\n\n`use App\\\
    Models\\User;`\n\n`Route::get(‘/user/{id}’, function (string $id) {`\n\n`return\
    \ new UserResource(User::findOrFail($id));`\n\n`});`\n\n# [Relationships](#toc.xhtml#s200a)\n\
    \nYou can add related resources to the array that your resource’s `toArray` function\
    \ returns if you would like to include them in your answer. In this example, we\
    \ will add the user’s blog posts to the resource response using the `collection`\
    \ function of the `PostResource` resource:\n\n`use App\\Http\\Resources\\PostResource;`\n\
    \n`use Illuminate\\Http\\Request;`\n\n`public function toArray(Request $request):\
    \ array`\n\n`{`\n\n`return [`\n\n`‘id’ => $this->id,`\n\n`‘name’ => $this->name,`\n\
    \n`‘city’ => $this->city,`\n\n`‘posts’ => PostResource::collection($this->posts),`\n\
    \n`‘created_at’ => $this->created_at,`\n\n`‘updated_at’ => $this->updated_at,`\n\
    \n`];`\n\n`}`\n\n# [Data Wrapping](#toc.xhtml#s201a)\n\nWhen the resource response\
    \ is translated to JSON, your outermost resource is automatically wrapped in a\
    \ data key. Thus, for instance, the following is a typical resource collection\
    \ response:\n\n`{`\n\n`“data”: [`\n\n`{`\n\n`“id”: 1,`\n\n`“name”: “Eladio Schroeder\
    \ Sr.”,`\n\n`“city”: “NYC”`\n\n`},`\n\n`{`\n\n`“id”: 2,`\n\n`“name”: “Liliana\
    \ Mayert”,`\n\n`“city”: “PUNE”`\n\n`}`\n\n`]`\n\n`}`\n\nDefine a `$wrap` property\
    \ on the resource class if you want to utilize a custom key in place of `data`:\n\
    \n`<?php`\n\n`namespace App\\Http\\Resources;`\n\n`use Illuminate\\Http\\Resources\\\
    Json\\JsonResource;`\n\n`class UserResource extends JsonResource`\n\n`{`\n\n`public\
    \ static $wrap = ‘user’;`\n\n`}`\n\nYou should use the `withoutWrapping` method\
    \ on the base `Illuminate\\Http\\Resources\\Json\\JsonResource` class to eliminate\
    \ the wrapping of the outermost resource. Generally, for each request made to\
    \ your application, you should invoke this function from your `AppServiceProvider`\
    \ or another service provider:\n\n`<?php`\n\n`namespace App\\Providers;`\n\n`use\
    \ Illuminate\\Http\\Resources\\Json\\JsonResource;`\n\n`use Illuminate\\Support\\\
    ServiceProvider;`\n\n`class AppServiceProvider extends ServiceProvider`\n\n`{`\n\
    \n`public function register(): void`\n\n`{`\n\n`// Register Logic`\n\n`}`\n\n\
    `public function boot(): void`\n\n`{`\n\n`JsonResource::withoutWrapping();`\n\n\
    `}`\n\n`}`\n\n# [Understanding Data Wrapping](#toc.xhtml#s202a)\n\nA Laravel paginator\
    \ object can be sent to a custom resource collection or the resource collection\
    \ function of a resource:"
