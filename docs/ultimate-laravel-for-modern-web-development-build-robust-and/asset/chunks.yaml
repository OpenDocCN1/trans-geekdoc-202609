  trans: "\n\n```php\nuse App\\Http\\Resources\\UserCollection;\n\nuse App\\Models\\\
    User;\n\nRoute::get('/users', function () {\n    return new UserCollection(User::paginate());\n\
    });\n```\n\n包含分页器状态的元数据（Metadata）和链接（link）键始终存在分页响应中：\n\n```json\n{\n  \"data\"\
    : [\n    {\n      \"id\": 1,\n      \"name\": \"ABC\",\n      \"city\": \"PUNE\"\
    \n    },\n    {\n      \"id\": 2,\n      \"name\": \"PQR\",\n      \"email\":\
    \ \"SEATTLE\"\n    }\n  ],\n  \"links\": {\n    \"first\": \"http://example.com/users?page=1\"\
    ,\n    \"last\": \"http://example.com/users?page=1\",\n    \"prev\": null,\n \
    \   \"next\": null\n  },\n  \"meta\": {\n    \"current_page\": 1,\n    \"from\"\
    : 1,\n    \"last_page\": 1,\n    \"path\": \"http://example.com/users\",\n   \
    \ \"per_page\": 12,\n    \"to\": 10,\n    \"total\": 10\n  }\n}\n```\n\n如果你想更改分页响应中\
    \ `links` 或 `meta` 键下显示的数据，可以在资源上定义一个 `paginationInformation` 方法。`$paginated`\
    \ 数据和 `$default` 信息的数组（一个包含 `links` 和 `meta` 键的数组）将被传递给此方法：\n\n```php\npublic\
    \ function paginationInformation($request, $paginated, $default)\n{\n    $default['links']['custom']\
    \ = 'https://example.com';\n    return $default;\n}\n```\n\n# 条件关联\n\n除了根据模型上之前是否已加载了连接来加载属性外，你还可以在资源回答中条件地包含关系。这允许你的控制器选择将哪些关系放入模型中，而你的资源可以在这些关系被加载后方便地仅包含它们。归根结底，这有助于避免资源中出现\
    \ N+1 查询问题。\n\n可以使用 `whenLoaded` 方法条件地加载关系。此方法接收关系名称而非连接本身，以防止不必要的关系加载：\n\n```php\n\
    use App\\Http\\Resources\\PostResource;\n\npublic function toArray(Request $request):\
    \ array\n{\n    return [\n        'id' => $this->id,\n        'name' => $this->name,\n\
    \        'city' => $this->city,\n        'posts' => PostResource::collection($this->whenLoaded('posts')),\n\
    \        'created_at' => $this->created_at,\n        'updated_at' => $this->updated_at,\n\
    \    ];\n}\n```\n\n在这种情况下，如果关系没有加载，在 posts 键被删除之前，资源响应将不会交付客户端。\n\n除了条件地包含关系外，你还可以根据关系的计数是否已加载到模型中，在资源回答中条件地包含关系计数：\n\
    \n```php\nnew UserResource($user->loadCount('posts'));\n```\n\n你可以使用 `whenCounted`\
    \ 方法在资源响应中条件地包含关系的计数。通过这种方法，如果缺少关系的计数，则该属性不会被包含：\n\n```php\npublic function toArray(Request\
    \ $request): array\n{\n    return [\n        'id' => $this->id,\n        'name'\
    \ => $this->name,\n        'city' => $this->city,\n        'posts_count' => $this->whenCounted('posts'),\n\
    \        'created_at' => $this->created_at,\n        'updated_at' => $this->updated_at,\n\
    \    ];\n}\n```\n\n# 资源响应\n\n路由和控制器可以选择立即返回资源：\n\n```php\nuse App\\Http\\Resources\\\
    UserResource;\n\nuse App\\Models\\User;\n\nRoute::get('/user/{id}', function (string\
    \ $id) {\n    return new UserResource(User::findOrFail($id));\n});\n```\n\n但偶尔，你可能需要在将其发送给客户端之前修改传出的\
    \ HTTP 响应。要做到这一点，有两种方法。可以先在资源上链式调用 `response` 方法。此函数将返回一个 `Illuminate\\Http\\\
    JsonResponse` 对象，允许你对响应的头部进行完全控制：\n\n```php\nuse App\\Http\\Resources\\UserResource;\n\
    \nuse App\\Models\\User;\n\nRoute::get('/user', function () {\n    return (new\
    \ UserResource(User::find(1)))\n        ->response()\n        ->header('X-Value',\
    \ 'True');\n});\n```\n\n另一种方法是资源本身可以指定一个 `withResponse` 方法。当资源作为最外资源在响应返回时，将调用此过程：\n\
    \n```php\n<?php\n\nnamespace App\\Http\\Resources;\n\nuse Illuminate\\Http\\JsonResponse;\n\
    use Illuminate\\Http\\Request;\nuse Illuminate\\Http\\Resources\\Json\\JsonResource;\n\
    \nclass UserResource extends JsonResource\n{\n    public function toArray(Request\
    \ $request)\n    {\n        return [\n            'id' => $this->id,\n       \
    \     'name' => $this->name,\n            'city' => $this->city,\n        ];\n\
    \    }\n\n    public function withResponse(Request $request, JsonResponse $response)\n\
    \    {\n        return $response->header('X-Value', 'True');\n    }\n}\n```\n\n\
    # Laravel Passport\n\nLaravel Passport 为你的 Laravel 应用提供了完整的 OAuth 服务器实现。它开箱提供了实现\
    \ OAuth2 认证所需的功能。\n\n# 安装与设置\n\n使用 Composer 包管理器安装 Passport：\n\n```bash\ncomposer\
    \ require laravel/passport\n```\n\n安装包后，你应该迁移数据库：\n\n```bash\nphp artisan migrate\n\
    ```\n\n然后运行 `passport:install` 命令来生成密钥并创建必要的表：\n\n```bash\nphp artisan passport:install\n\
    ```\n\n在你的 `User` 模型（或你任何用于认证的模型）中添加 `Laravel\\Passport\\HasApiTokens` Trait：\n\
    \n```php\nuse Laravel\\Passport\\HasApiTokens;\n\nclass User extends Authenticatable\n\
    {\n    use HasApiTokens, ...;\n}\n```\n\n# 配置\n\nPassport 会自动发放有效期为一年的令牌。使用 `tokensExpireIn`、`refreshTokensExpireIn`\
    \ 和 `personalAccessTokensExpireIn` 方法可以设置更长或更短的令牌寿命。\n\n这些方法应该在应用程序 `App\\Providers\\\
    AuthServiceProvider` 类的启动方法中调用：\n\n```php\npublic function boot(): void\n{\n \
    \   Passport::tokensExpireIn(now()->addDays(15));\n    Passport::refreshTokensExpireIn(now()->addDays(30));\n\
    \    Passport::personalAccessTokensExpireIn(now()->addMonths(6));\n}\n```\n\n\
    为了确保在保存到数据库之前对客户端密钥进行哈希，你应该在 `App\\Providers\\AuthServiceProvider` 类启动方法中调用 `Passport::hashClientSecrets`\
    \ 函数：\n\n```php\nuse Laravel\\Passport\\Passport;\n\nPassport::hashClientSecrets();\n\
    ```\n\n所有的客户端密钥仅在创建后（启用后）对用户可见。如果丢失了明文客户端密钥，将无法恢复，因为它们不会存储在数据库中。\n\n"
- fmt: "By creating your own model and expanding the matching Passport model, you\
    \ are able to expand the internal models that Passport uses:\n\n```php\nuse Laravel\\\
    Passport\\Client as PassportClient;\n\nclass Client extends PassportClient\n{\n\
    \    // Code Logic\n}\n```\n\nOnce your model has been defined, you can use the\
    \ `Laravel\\Passport\\Passport` class to tell Passport to utilize your custom\
    \ model. Generally, the `App\\Providers\\AuthServiceProvider` class `boot` function\
    \ in your application is where you should tell Passport about your custom models:\n\
    \n```php\nuse App\\Models\\Passport\\AuthCode;\nuse App\\Models\\Passport\\Client;\n\
    use App\\Models\\Passport\\PersonalAccessClient;\nuse App\\Models\\Passport\\\
    RefreshToken;\nuse App\\Models\\Passport\\Token;\n\npublic function boot(): void\n\
    {\n    Passport::useTokenModel(Token::class);\n    Passport::useRefreshTokenModel(RefreshToken::class);\n\
    \    Passport::useAuthCodeModel(AuthCode::class);\n    Passport::useClientModel(Client::class);\n\
    \    Passport::usePersonalAccessClientModel(PersonalAccessClient::class);\n}\n\
    ```\n\n# Overriding Routes\n\nThere may be occasions when you want to alter the\
    \ Passport-defined routes. In order to accomplish this, you must first add `Passport::ignoreRoutes`\
    \ to the `register` function of your application’s `AppServiceProvider` in order\
    \ to ignore the routes registered by Passport:\n\n```php\nuse Laravel\\Passport\\\
    Passport;\n\npublic function register(): void\n{\n    Passport::ignoreRoutes();\n\
    }\n```\n\nNext, you may copy and edit the routes that Passport defines in its\
    \ routes file to the `routes/web.php` file in your application:\n\n```php\nRoute::group([\n\
    \    ‘as’ => ‘passport.',\n    ‘prefix’ => config(‘passport.path’, ‘oauth’),\n\
    \    ‘namespace’ => ‘\\Laravel\\Passport\\Http\\Controllers’,\n], function ()\
    \ {\n    // Route Logic\n});\n```\n\n# Access Tokens\n\nOAuth2 is most often known\
    \ to developers through its use with permission codes. When a client application\
    \ uses authorization codes, it will send the user to your server, where they can\
    \ accept or reject the request to provide the client with an access token.\n\n\
    # Client\n\nIn order to create a communication with your Laravel application,\
    \ the client is created that enables the communication and interaction with your\
    \ Laravel application through the application API. In creating a client, the name\
    \ of the application and the URL of the application are required. The URL is the\
    \ application URL that an authenticated user will be redirected to.\n\n### Passport::client\
    \ Command\n\nUsing the `passport:client` Artisan command is the most straightforward\
    \ method of creating a client. You may use this command to make your own clients\
    \ so you can test the functioning of OAuth2. Passport will ask you for further\
    \ details about your client when you execute the `client` command and will give\
    \ you a client ID and secret:\n\n```bash\nphp artisan passport:client\n```\n\n\
    When asked for the URL by the `passport:client` command, you can enter as many\
    \ redirect URLs as you’d like for your client by providing a list separated by\
    \ commas. Every URL that has commas in it has to be URL encoded:\n\n```\nhttp://example1.com/callback\n\
    http://example2.com/callback\n```\n\n# JSON API\n\nPassport has a JSON API that\
    \ you may use to create clients, as your application’s users won’t be able to\
    \ use the `client` command. By doing this, you may save the hassle of manually\
    \ coding controllers for client creation, updates, and deletion.\n\nTo give your\
    \ users a dashboard to manage their customers, you must integrate Passport’s JSON\
    \ API with your own frontend. We’ll go over each of the API endpoints for client\
    \ management below. For ease of usage, we will show how to make HTTP queries to\
    \ the endpoints using Axios.\n\nThe `web` and `auth` middleware protect the JSON\
    \ API, so you can only call it from within your own application. It cannot be\
    \ invoked by an external source.\n\n# GET\n\n`GET /oauth/clients`\n\nFor the user\
    \ who has verified their identity, this route returns every client. The main usage\
    \ for this is to provide a list of all the user’s clients, allowing them to be\
    \ edited or removed:\n\n```javascript\naxios.get('/oauth/clients')\n  .then(response\
    \ => {\n    console.log(response.data);\n  });\n```\n\n# POST\n\n`POST /oauth/clients`\n\
    \nThe goal of this route is to attract new customers. A `redirect` URL and the\
    \ `name` of the customer are the two pieces of information needed. The user will\
    \ be forwarded to the `redirect` URL when granting or rejecting a permission request.\n\
    \nA client ID and client secret are assigned to it upon creation. When obtaining\
    \ access tokens from your application, these values will be utilized. The new\
    \ client instance will be returned by the client creation route:\n\n```javascript\n\
    const data = {\n    name: ‘ABC’,\n    redirect: ‘http://example1.com/callback’\n\
    };\naxios.post('/oauth/clients’, data)\n  .then(response => {\n    console.log(response.data);\n\
    \  })\n  .catch (response => {\n    // Error Handling Logic\n  });\n```\n\n# PUT\n\
    \n`PUT /oauth/clients`\n\nClient updates are sent over this route. A `redirect`\
    \ URL and the `name` of the customer are the two pieces of information needed.\
    \ The user will be forwarded to the `redirect` URL when granting or rejecting\
    \ a permission request. The new client instance will be returned by the client\
    \ creation route:\n\n```javascript\nconst data = {\n    name: ‘ABC’,\n    redirect:\
    \ ‘http://example1.com/callback’\n};\naxios.put('/oauth/clients', data)\n  .then(response\
    \ => {\n    console.log(response.data);\n  })\n  .catch (response => {\n    //\
    \ Error Handling Logic\n  });\n```\n\n# DELETE\n\n`DELETE /oauth/clients`\n\n\
    In order to delete clients.\n\n```javascript\naxios.delete('/oauth/clients' +\
    \ clientId)\n  .then(response => {\n    // Code Logic\n  });\n```\n\n# Protecting\
    \ Routes\n\nThe way to ensuring security in the routes is handled in a couple\
    \ of ways. We will dive into each of them.\n\n### Middleware\n\nAn authentication\
    \ guard included into Passport will verify access tokens for incoming requests.\
    \ You simply need to include the `auth:api` middleware on all routes that need\
    \ a valid token after setting up the `api` guard:\n\n```php\nRoute::get('/user',\
    \ function () {\n    // Code Logic\n})->middleware('auth:api');\n```\n\nFor each\
    \ user provider type that your application authenticates—which may involve using\
    \ distinctquent models—you will probably need to specify a guard configuration.\
    \ By doing this, you may safeguard requests meant for particular user providers.\
    \ For instance, the `config/auth.php` configuration file has the following guard\
    \ settings:\n\n```php\n'api' => [\n    'driver' => 'passport',\n    'provider'\
    \ => 'users',\n],\n'api-customers' => [\n    'driver' => 'passport',\n    'provider'\
    \ => 'customers',\n],\n```\n\nThe `api-customers` guard, which verifies incoming\
    \ requests using the `customers` user provider, will be used in the subsequent\
    \ route:\n\n```php\nRoute::get('/customer', function () {\n    // Code Logic\n\
    })->middleware('auth:api-customers');\n```\n\n# Access Token\n\nYour application’s\
    \ API users should provide their access token as a `Bearer` token in the `Authorization`\
    \ header of their request when contacting Passport-protected routes. When utilizing\
    \ the Guzzle HTTP library, for instance:\n\n```php\nuse Illuminate\\Support\\\
    Facades\\Http;\n\n$response = Http::withHeaders([\n    'Accept' => 'application/json',\n\
    \    'Authorization' => 'Bearer '.$accessToken,\n])->get('https://passport-app.test/api/user');\n\
    \nreturn $response->json();\n```\n\n# Token Scopes\n\nWith scopes, your API customers\
    \ may ask for a certain set of rights when seeking to access an account. For example,\
    \ not every API customer will want the ability to place orders if you are developing\
    \ an e-commerce service. Alternatively, you might let customers to see order shipment\
    \ statuses by only requesting authorization. Put differently, scopes let users\
    \ of your application restrict what a third-party program may do on their behalf.\n"
