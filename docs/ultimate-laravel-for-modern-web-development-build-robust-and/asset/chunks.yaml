  trans: "\n\n当按项目安装 CLI 时，你很可能需要从项目的 `vendor/bin` 目录运行它，该目录是 `Composer` 安装可执行文件的地方。例如，要查看所有可用的\
    \ Vapor CLI 命令，可以使用 `list` 命令：\n\n```bash\nphp vendor/bin/vapor list\n```\n\n\
    使用 `help` 命令以及你想要研究的命令名称：\n\n```bash\nphp vendor/bin/vapor help deploy\n```\n\n\
    # 安装 Vapor 核心 (The Core)\n\n每个使用 Vapor 的 Laravel 应用程序都必须加载 `laravel/vapor-core`\
    \ 包作为依赖。该包包含了几个 Vapor 运行时文件，以及一个允许你的应用程序在 Vapor 上运行的服务提供者（service provider）。可以使用\
    \ `Composer` 将 Vapor 核心集成到你的项目中：\n\n```bash\ncomposer require laravel/vapor-core\
    \ --update-with-dependencies\n```\n\n# 安装 Vapor 仪表板 (The Dashboard)\n\n你可能也希望安装\
    \ `laravel/vapor-ui` 包。该包为你的应用程序添加了一个漂亮的仪表板，允许你监控日志和失败的队列进程。在将应用部署到 Vapor 后，可以通过\
    \ `/vapor-ui` URI 访问仪表板。可以使用 `Composer` 在项目中安装 Vapor UI 仪表板包：\n\n```bash\ncomposer\
    \ require laravel/vapor-ui\n```\n\n你可以使用 `vapor-ui:install` Artisan 命令来发布它的资源：\n\
    \n```bash\nphp artisan vapor-ui:install\n```\n\n可以通过 `/vapor-ui` URI 访问仪表板。\n\n\
    # 仪表板授权 (Dashboard Authorization)\n\n在 `/vapor-ui` URI 处，Vapor UI 提供了一个仪表板。你的\
    \ `app/Providers/VaporUiServiceProvider.php` 文件中有一个 `gate` 函数，用于限制对 Vapor UI 仪表板的访问。默认情况下限制所有访问者。要授予对\
    \ Vapor UI 仪表板的访问权限，你需要根据需要修改此 `gate`：\n\n```php\nprotected function gate()\n\
    {\n    Gate::define(‘viewVaporUI’, function ($user = null) {\n        return in_array(optional($user)->email,\
    \ [\n            ‘abc@example.com’,\n        ]);\n    });\n}\n```\n\n# 环境 (Environment)\n\
    \n你所有的部署和命令执行都保存在环境中。每个项目可以拥有任意的环境。\n\n通常，你会有一个 `production`（生产环境）和一个用于测试应用程序的\
    \ `staging`（暂存环境）。然而，不要害怕设置其他环境来测试新功能，而不会干扰到你的主暂存环境。\n\n可以使用 `env` Vapor CLI 工具来构建环境：\n\
    \n```bash\nvapor env my-environment\n```\n\n此命令将向你的项目 `vapor.yml` 文件添加一个新的环境条目，准备好部署：\n\
    \n```yaml\nid: 3\nname: vapor-laravel-app\nenvironments:\n  production:\n    build:\n\
    \      - ‘composer install --no-dev’\n  my-environment:\n    build:\n      - ‘composer\
    \ install --no-dev’\n```\n\nVapor 除了原生运行时外还允许 Docker 镜像部署。在构建环境时，使用 `--docker`\
    \ 选项指定其利用 Docker 镜像运行时而不是默认的 Vapor 运行时。\n\n```bash\nvapor env my-environment --docker\n\
    ```\n\n此命令将在应用程序的根目录下创建一个名为 `my-environment.Dockerfile` 的新环境。Vapor CLI 中的 `open`\
    \ 命令可在默认浏览器中打开环境：\n\n```bash\nvapor open my-environment\n```\n\nVapor CLI 在执行命令时默认使用\
    \ `staging` 环境：\n\n```bash\nvapor open // 在默认浏览器中打开 `staging` 环境\nvapor production\
    \ // 在默认浏览器中打开 `production` 环境\n```\n\n但是，你可以通过在应用程序的 `vapor.yml` 文件中定义 `default-environment`\
    \ 选项更改项目的默认环境：\n\n```yaml\nid: 3\nname: vapor-laravel-app\ndefault-environment:\
    \ production\nenvironments:\n  production:\n    build:\n```\n"
