    you might want to send the user back to the previous webpage. Use the global `back`
    helper function to do this. Make sure the route using the `back` function is using
    the web middleware group or has all of the session middleware applied because
    this functionality uses the session:


    `Route::post(‘/user/aboutMe’, function () {`


    `// Validate the request`


    `return back()->withInput();`


    `});`


    # [Redirecting to Named Routes](#toc.xhtml#s103a)


    An instance of `Illuminate\Routing\Redirector` is returned when the `redirect`
    helper in a Laravel application is used without any arguments, enabling you to
    call any method on the `Redirector` instance. For instance, you can use the `route`
    method to create a `RedirectResponse` to a specific route:


    `return redirect()->route(‘register’);`


    To add parameters to pass it as a second argument to the `route` method:


    `// For a route with URI: dashboard/{id}`


    `return redirect()->route(‘dashboard’, [‘id’ => 1]);`


    Laravel also offers a global `to_route` function that can be used to redirect
    and route.


    # [Redirecting to Controller Actions](#toc.xhtml#s104a)


    In Laravel, redirects to controller operations are also possible. To achieve this,
    provide the `action` method with the controller and action name:


    `use App\Http\Controllers\EmployeeController;`


    `return redirect()->action([EmployeeController::class, ‘taxID’]);`


    You can add arguments as the second argument to the `action` method if your controller
    route calls for them:


    `return redirect()->action(`


    ` [EmployeeController::class, ‘dashboard’], [‘id’ => 1]`


    `);`


    # [Redirecting - Flashed Session Data](#toc.xhtml#s105a)


    Normally, flashing data to the session and redirecting to a new URL happen simultaneously.
    Usually, you flash a success message to the session after completing an activity
    successfully. In a single, fluid method chain, you may build a `RedirectResponse`
    object and flash data to the session for convenience:


    `Route::post(‘/employee/profile’, function () {`


    `// Update the employee’s profile`


    `return redirect(‘/dashboard’)->with(‘status’, ‘Employee Profile Data updated!’);`


    `});`


    Before sending the user to a different page, you may flash the input data from
    the current request to the session using the `withInput` method offered by the
    `RedirectResponse` class. Whenever you make the following request, you may quickly
    recover the input after it has been flashed to the session:


    `return back()->withInput();`


    You can show the session’s flashing message when the user is redirected. As an
    illustration, using Blade syntax:


    `@if (session(‘status’))`


    `<div class=”alert alert-success”>`


    `{{ session(‘status’) }}`


    `</div>`


    `@endif`


    # [Directives in Laravel](#toc.xhtml#s106a)


    Directives are explicit instructions that may be used within Blade templates in
    Laravel to carry out certain logic or actions. The Templating Engine for Laravel,
    known as Blade, enables you to create expressive, tidy, and readable views for
    your application.


    In Laravel, directives are identified by the symbol `@` and the directive name.
    They offer a quick and stylish method of running PHP code inside of your Blade
    templates without clogging the display with PHP tags.


    ![](images/Figure-4.1.jpg)


    **Figure 4.1:** Type of Directives in Laravel


    # [Conditional Directives](#toc.xhtml#s107a)


    The if directives are used to specify conditions in the logic building of the
    Laravel application. The following are the different directives, as shown in *[Figure
    4.2](#c04.xhtml#fig4_2):*


    ![](images/Figure-4.2.jpg)


    **Figure 4.2:** Conditional Directives in Laravel


    The directives `@if`, `@elseif`, `@else`, and `@endif` can be used to create if
    statements. These directives perform the same tasks as their PHP equivalents:


    `@if (count($fruits) === 1)`


    `There is one fruit!`


    `@elseif (count($records) > 1)`


    `There are multiple fruits.`


    `@else`


    `There are no fruits.`


    `@endif`


    The `@isset` and `@empty` directives can be used as practical substitutes for
    their respective PHP functions in addition to the conditional directives already
    covered:


    `@isset($fruits)`


    `// $fruits is defined and is not null`


    `@endisset`


    `@empty($fruits)`


    `// $fruits is “empty”`


    `@endempty`


    # [Custom if Statements](#toc.xhtml#s108a)


    When creating basic, custom conditional statements, programming a custom directive
    might often be more difficult than necessary. In order to easily build unique
    conditional directives using closures, Blade offers the `Blade::if function.`


    # [Switch Directive](#toc.xhtml#s109a)


    The switch directive is an essential component in writing the logic and handling
    of different scenarios in Laravel.


    ![](images/Figure-4.3.jpg)


    **Figure 4.3:** Switch Directive in Laravel


    Let’s look at using the switch directive in the code:


    `@switch($i)`


    `@case(1)`


    `Case 1`


    `@break`


    `@case(2)`


    `Case 2`


    `@break`


    `@default`


    `Default case`


    `@endswitch`


    # [Auth Directive](#toc.xhtml#s110a)


    The auth directive is useful to maintain authentication and security in application
    code.


    ![](images/Figure-4.4.jpg)


    **Figure 4.4:** Auth Directives in Laravel


    To easily detect whether the current user is authenticated or a guest, use the
    `@auth` and `@guest` directives:


    `@auth`


    `// The user is authenticated`


    `@endauth`


    `@guest`


    `// The user is not authenticated`


    `@endguest`


    The `@auth` and `@guest` directives allow you to define the authentication guard
    that should be verified if necessary:


    `@auth(‘admin’)`


    `// The user is authenticated`


    `@endauth`


    `@guest(‘admin’)`


    `// The user is not authenticated`


    `@endguest`


    In order to ensure that only users with the proper authorization may access particular
    areas of the program or carry out particular actions, authentication is a crucial
    component of online applications. Using directives for authentication in Blade
    templates is crucial in Laravel apps for a number of reasons, such as:


    *   Security


    *   Best Practices


    *   Separation of Responsibility and Concerns


    *   Scalability


    *   Template Inheritance


    Security, code structure, and maintainability all depend on the use of directives
    for authentication in Laravel apps. It encourages best practices and supports
    developers’ effective management of the frontend views’ authentication-related
    code.


    # [Loops](#toc.xhtml#s111a)


    Blade offers straightforward directives in addition to conditional statements
    for interacting with PHP’s loop structures.


    ![](images/Figure-4.5.jpg)


    **Figure 4.5:** Loop Directives in Laravel


    Again, each of these directives does the same tasks as their PHP equivalents:


    `@for ($i = 0; $i < 10; $i++)`


    `The current value of i is {{ $i }}`


    `@endfor`


    `@foreach ($employees as $employee)`


    `<p>This is employee {{ $employee->id }}</p>`


    `@endforeach`


    `@forelse ($employees as $employee)`


    `<li>{{ $employee->name }}</li>`


    `@empty`


    `<p>No employees</p>`


    `@endforelse`


    `@while (true)`


    `<p>Forever Loop</p>`


    `@endwhile`


    Using the `@continue` and `@break` directives, you can also use loops to skip
    the current iteration or break the loop:


    `@foreach ($employees as $employee)`


    `@if ($employee->type == 1)`


    `@continue`


    `@endif`


    `<li>{{ $employee->name }}</li>`


    `@if ($employee->number == 5)`


    `@break`


    `@endif`


    `@endforeach`


    The continuation or break condition may also be included in the directive declaration:


    `@foreach ($employees as $employee)`


    `@continue($employee->type == 1)`


    `<li>{{ $employee->name }}</li>`


    `@break($employee->number == 5)`


    `@endforeach`'
