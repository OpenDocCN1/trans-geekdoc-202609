    `->get();`\n\n# 高级连接 (Advanced Joins)\n\n如果你想在连接中使用 `where` 类型的子句，可以在连接可以使用 `where`\
    \ 和 `orWhere` 方法。这些技术用于列与值的比较，而不是两个列之间的比较：\n\n```php\nDB::table('employees')\n\
    ->join('contacts', function($join)\n{\n    $join->on('employees.id', '=', 'contacts.employee_id')\n\
    \    ->where('contacts.employee_id', '>', 10);\n})\n->get();\n```\n\n# 高级查询 (Advanced\
    \ Where)\n\n偶尔可能需要更复杂的 `where` 子句，例如 `where exists` 或嵌套参数分组。这些也可以由 Laravel 查询构造器处理：\n\
    \n```php\nDB::table('employees')\n->where('name', '=', 'ABC')\n->orWhere(function($query)\n\
    {\n    $query->where('votes', '>', 100)\n    ->where('title', '<>', 'Admin');\n\
    })\n->get();\n```\n\n上述查询将返回以下 SQL：\n\n`select * from employees where name = ‘ABC’\
    \ or (votes > 100 and title <> ‘Admin’)`\n\n# 聚合函数 (Aggregates)\n\n查询构造器现在支持广泛的聚合技术，包括\
    \ `count`、`max`、`min`、`average` 和 `total`。\n\n计数 (Count):\n\n`$employees = DB::table('employees')->count();`\n\
    \n最大值 (Max):\n\n`$cost = DB::table('orders')->max('cost');`\n\n最小值 (Min):\n\n\
    `$cost = DB::table('orders')->min('cost');`\n\n平均值 (Average):\n\n`$cost = DB::table('orders')->avg('cost');`\n\
    \n求和 (Sum):\n\n`$total = DB::table('employees')->sum('votes');`\n\n# 原始表达式 (Raw\
    \ Expressions)\n\n查询偶尔可能需要使用原始表达式。请务必不要构造任何 SQL 注入点，因为这些表达式将作为字符串注入查询中！你可以使用 `DB::raw`\
    \ 命令来生成原始表达式：\n\n```php\n$employees = DB::table('employees')\n->select(DB::raw('count(*)\
    \ as employee_count, status'))\n->where('status', '<>', 1)\n->groupBy('status')\n\
    ->get();\n```\n\n# 悲观锁 (Pessimistic Locking)\n\n查询构造器中有几个函数可以帮助你对 `SELECT` 语句实现`悲观锁`。\n\
    \n在查询上使用 `sharedLock` 方法可以执行带有`共享锁`shared lock）的 `SELECT` 语句：\n\n```php\nDB::table('employees')->where('votes',\
    \ '>', 140)->sharedLock()->get();\n```\n\n你可以在查询上使用 `lockForUpdate` 方法对 `SELECT`\
    \ 语句进行`更新锁`(lock for update)：\n\n```php\nDB::table('employees')->where('votes',\
    \ '>', 140)->lockForUpdate()->get();\n```\n\n# 查询缓存 (Caching Queries)\n\n使用 `remember`\
    \ 或 `rememberForever` 技术，你可以方便地缓存查询结果：\n\n```php\n$value = Cache::rememberForever('employees',\
    \ function () {\n    return DB::table('employees')->get();\n});\n```\n\n这将从缓存中检索结果，如果缓存不存在则将其永久存储。\n\
    \n# Eloquent 操作 (Eloquent Operations)\n\nEloquent 是一个对象关系映射（ORM），它让与数据库交互变得简单，它是\
    \ Laravel 的一个组件。Eloquent 中的每个数据库表都有一个对应的 `Model`（模型），用于与表通信。Eloquent 模型允许你从数据库中插入、编辑和删除记录。\n\
    \n# 模型类 (Model Classes)\n\n让我们从构建一个 Eloquent 模型开始。`Illuminate\\Database\\Eloquent\\\
    Model` 类通常会被模型扩展，这些模型通常位于 `app\\Models` 目录下。你可以使用模型命令 `make:model` 来创建一个新模型：\n\
    \n```bash\nphp artisan make:model Office\n```\n\n使用 `--migration` 或 `-m` 选项生成数据库迁移：\n\
    \n```bash\nphp artisan make:model Office -m\n```\n\n在创建模型时，你还可以同时创建不同的类，例如工厂（factories）、填充器（seeders）、控制器（controllers）和表单请求（form\
    \ requests）。此外，通过组合这些选项，可以一次创建多个类：\n\n- 生成模型和 `OfficeFactory` 类：\n```bash\nphp\
    \ artisan make:model Office --factory -f\n```\n- 生成模型和 `OfficeSeeder` 类：\n```bash\n\
    php artisan make:model Office --seed -s\n```\n\n- 生成模型和 `OfficeController` 类：\n\
    ```bash\nphp artisan make:model Office --controller -c\n```\n\n- 生成模型、`OfficeController`\
    \ 资源类和表单请求类：\n```bash\nphp artisan make:model Office --controller --resource -r\n\
    ```\n\n- 生成模型和 `OfficePolicy` 类：\n```bash\nphp artisan make:model Office --policy\n\
    ```\n\n- 生成模型、迁移、工厂、填充器和控制器：\n```bash\nphp artisan make:model Office -mfsc\n```\n\
    \n- 一键生成模型、迁移、工厂、填充器、策略、控制器和表单请求的快捷方式：\n```bash\nphp artisan make:model Office\
    \ --all\n```\n\n- 生成中间模型（pivot model）：\n```bash\nphp artisan make:model Member\
    \ --pivot -p\n```\n\n# 模型约定 (Model Conventions)\n\n`app/Models` 目录存放由 `make:model`\
    \ 命令创建的所有模型。让我们来看基础模型并讨论 Eloquent 的一些基础约定：\n\n```php\n<?php\nnamespace App\\Models;\n\
    \nuse Illuminate\\Database\\Eloquent\\Model;\n\nclass Office extends Model\n{\n\
    ```\n\n# 模型约定 (Model Conventions)\n\n`app/Models` 目录将存放由 `make:model` 命令创建的任何模型。让我们来看基础模型并讨论\
    \ Eloquent 的一些基础约定：\n\n```php\n<?php\nnamespace App\\Models;\n\nuse Illuminate\\\
    Database\\Eloquent\\Model;\n\nclass Office extends Model\n{\n    // 代码\n}\n```\n\
    \n# 表名 (Table Name)\n\n你可能从前面的示例中注意到，我们没有指定模型所对应的表名。按照约定，除非专门指定，否则 Eloquent 会假定表名是类名的复数形式并采用\
    \ `snake_case` 命名。\n\n如果你的数据库表不符合此规范，你可以在模型上定义 `table` 属性来手动指定表：\n\n```php\n<?php\n\
    namespace App\\Models;\n\nuse Illuminate\\Database\\Eloquent\\Model;\n\nclass\
    \ Office extends Model\n{\n    /**\n     * 与模型关联的表。\n     *\n     * @var string\n\
    \     *\n     */\n    protected $table = 'my_offices';\n}\n```\n\n# 主键 (Primary\
    \ Key)\n\nEloquent 额外假定每个模型的数据库表包含一个 `id` 主键列。\n\n![](img/Figure-5.3.jpg)\n\n\
    图 5.3 主键类型\n\n**同质主键 (Homogeneous Primary Key)**\n\nEloquent 额外假定每个模型的数据库表包含一个\
    \ `id` 主键列 - `$primaryKey`：\n\n```php\n<?php\nnamespace App\\Models;\n\nuse Illuminate\\\
    Database\\Eloquent\\Model;\n\nclass Office extends Model\n{\n    /**\n     * 与表关联的主键。\n\
    \     *\n     * @var string\n     *\n     */\n    protected $primaryKey = 'office_id';\n\
    }\n```\n\n此外，Eloquent 会自动将主键转换为整数，因为它期望主键是自增的整数。如果你想使用非自增或非数字的主键，必须在模型中声明一个公共的\
    \ `$incrementing` 属性并将其设置为 `false`：\n\n```php\nclass Office extends Model\n{\n\
    \    /**\n     * 模型的 ID 是否是自增的。\n     *\n     * @var bool\n     *\n     */\n \
    \   public $incrementing = false;\n}\n```\n\n如果主键不是整数，你应该为模型添加一个受保护的 `$keyType`\
    \ 属性。该属性的值应该是 `String`：\n\n```php\nclass Office extends Model\n{\n    /**\n  \
    \   * 自增 ID 的类型。\n     *\n     * @var string\n     *\n     */\n    protected $keyType\
    \ = 'string';\n}\n```\n\n**复合主键 (Composite Primary Key)**\n\n根据 Eloquent，每个模型必须至少有一个可以作为主键的\
    \ **ID**。Eloquent 模型不支持**复合**主键。\n\n然而，除了唯一标识表的主键外，你允许在数据库表中添加其他多列唯一索引。\n\n# UUID\
    \ 和 ULID 键\n\n"
- fmt: "\nYou may decide to utilize UUIDs as your Eloquent model’s main keys rather\
    \ than auto-incrementing integers. UUIDs are 36-character-long, globally unique\
    \ alphanumeric identifiers.\n\nUtilize the `Illuminate\\Database\\Eloquent\\Concerns\\\
    HasUuids` trait on the model if you want a model to utilize a UUID key rather\
    \ than an auto-incrementing integer key. Of course, you need to make sure that\
    \ the model has a primary key column with a UUID equivalent:\n\n```php\nuse Illuminate\\\
    Database\\Eloquent\\Concerns\\HasUuids;\nuse Illuminate\\Database\\Eloquent\\\
    Model;\nclass Chapter extends Model\n{\n    use HasUuids;\n    // Code logic\n\
    }\n```\n\n```php\n$chapter = Chapter::create([‘title’ => ‘Chapter 1’]);\n$chapter->id;\n\
    ```\n\nThe `HasUuids` trait creates `ordered` UUIDs by default for your models.\
    \ These UUIDs can be sorted lexicographically, making them more effective for\
    \ index database storage:\n\nBy adding a `newUniqueId` function to a model, you\
    \ can modify how a UUID is generated for that particular model. Additionally,\
    \ you may define a `uniqueIds` function on the model to indicate which columns\
    \ should get UUIDs:\n\n```php\nuse Ramsey\\Uuid\\Uuid;\n/**\n * Generate a new\
    \ UUID for the model.\n */\npublic function newUniqueId(): string\n{\n    return\
    \ (string) Uuid::uuid4();\n}\n\n/**\n * Get the columns that should receive a\
    \ unique identifier.\n *\n * @return array<int, string>\n *\n */\npublic function\
    \ uniqueIds(): array\n{\n    return [‘id’, ‘offer_code’];\n}\n```\n\nYou are free\
    \ to use `ULIDs` instead of UUIDs if you choose. ULIDs are identical to UUIDs;\
    \ however, they only have 26 characters. ULIDs can be lexicographically sorted\
    \ for effective database indexing, just like ordered UUIDs.\n\nUse the `Illuminate\\\
    Database\\Eloquent\\Concerns\\HasUlids` trait on your model to make use of ULIDs.\
    \ Additionally, make sure the model contains a main key column that is equivalent\
    \ to ULID.\n\n# Database Connections\n\nAll Eloquent models will automatically\
    \ use the default database connection set up for your application. You should\
    \ define a `$connection` property on the model if you want to specify a different\
    \ connection to be utilized when interacting with a specific model:\n\n```php\n\
    <?php\nnamespace App\\Models;\nuse Illuminate\\Database\\Eloquent\\Model;\nclass\
    \ Office extends Model\n{\n    /**\n     * The database connection that should\
    \ be used by the model.\n     *\n     * @var string\n     *\n     * Code Logic\n\
    \     */\n    protected $connection = ‘sqlite’;\n}\n```\n\n# Retrieving Models\n\
    \nYou are prepared to begin data retrieval from your database once you have generated\
    \ a model and the corresponding database table. Each Eloquent model may be viewed\
    \ as a potent query builder that enables you to fluidly query the database table\
    \ connected to the model. The model’s `all` method will get every entry from the\
    \ database table it’s linked to:\n\n```php\nuse App\\Models\\Office;\nforeach\
    \ (Office::all() as $office) {\n    echo $office->name;\n}\n```\n\n![](images/Figure-5.4.jpg)\n\
    \n**Figure 5.4:** Retrieving Models\n\n# Collections\n\nThe fundamental `Illuminate\\\
    Support\\Collection` class from Laravel, which offers a number of useful methods\
    \ for interacting with data collections, is extended by the `Eloquent` Collection\
    \ class. For instance, based on the outcomes of an invoked closure, the `reject`\
    \ method may be used to delete models from a collection:\n\n```php\n$offices =\
    \ Office::where(‘location’, ‘NYC’)->get();\n$offices = $offices->reject(function\
    \ (Office $office) {\n    return $office->cancelled;\n});\n```\n\nThe Eloquent\
    \ collection class has a few extra methods in addition to those offered by Laravel’s\
    \ standard collection class that are specifically designed for working with collections\
    \ of Eloquent models.\n\nYou may loop over collections as if they were an array\
    \ because Laravel’s: \n\n# Chunking Results\n\nIf you try to use `all` or `get`\
    \ methods with thousands of Eloquent records, your application can run out of\
    \ memory. This is because PHP’s PDO driver stores all raw query results in its\
    \ internal buffer. The `chunk` method can drastically reduce your application’s\
    \ memory consumption when iterating through thousands of Eloquent models, similar\
    \ to the `lazy` method. The `chunk` method processes records in pieces:\n\n```php\n\
    Office::where(‘closed’, true)->chunk(100, function (Collection $offices) {\n \
    \   foreach ($offices as $office) {\n        // Code Logic\n    }\n});\n```\n\n\
    # Using Lazy Collections\n\nThe `lazy` method functions similarly to the `chunk`\
    \ method, but it returns a `LazyCollection` instance. This allows you to utilize\
    \ many of the collection methods offered by standard Laravel collections. For\
    \ example:\n\n```php\nuse App\\Models\\Office;\nuse Illuminate\\Database\\Eloquent\\\
    Collection;\nOffice::where(‘closed’, true)->chunk(100, function (Collection $offices)\
    \ {\n    foreach ($offices as $office) {\n        // Code Logic\n    }\n});\n\
    ```\n\nThe `lazyById` method allows you to filter the results based on the `id`\
    \ column. The `lazyByIdDesc` method does this in `id` descending order:\n\n```php\n\
    Office::where(‘closed’, true)->lazyById(100, function (Collection $offices) {\n\
    \    foreach ($offices as $office) {\n        // Code Logic\n    }\n});\n```\n\
    \n# Cursors\n\nThe `cursor` method can drastically reduce your application’s memory\
    \ consumption when iterating through thousands of Eloquent records. Individual\
    \ Eloquent models won’t be hydrated until they are iterated through; the `cursor`\
    \ technique will only run one database query. As a result, while iterating over\
    \ the cursor, only one Eloquent model is retained in memory at any given time:\n\
    \n```php\nuse App\\Models\\Office;\nforeach (Office::where(‘location, ‘NYC’)->cursor()\
    \ as $office) {\n    // Code Logic\n}\n```\n"
