  trans: "\n\n接下来，我们将构建一个路由来处理来自“确认密码”页面的表单请求。该路由将负责验证用户的密码并将他们重定向到想要的目标地：\n\n```php\n\
    use Illuminate\\Http\\Request;\nuse Illuminate\\Support\\Facades\\Hash;\nuse Illuminate\\\
    Support\\Facades\\Redirect;\n\nRoute::post(‘confirmPassword’, function (Request\
    \ $request) {\n    if (! Hash::check($request->password, $request->user()->password))\
    \ {\n        return back()->withErrors([\n            ‘password’ => [‘Incorrect\
    \ Password’]\n        ]);\n    }\n    $request->session()->passwordConfirmed();\n\
    \    return redirect()->intended();\n})->middleware([‘auth’, ‘throttle:6,1’]);\n\
    ```\n\n在继续之前，让我们仔细查看一下这个路径。首先，系统会检查请求中的 `password` 字段，判断其是否与授权用户的密码匹配。如果密码正确，我们必须通知\
    \ Laravel 的会话用户已验证其密码。`passwordConfirmed` 方法会向用户的会话添加一个时间戳，Laravel 可能会使用它来检测用户上一次验证密码的时间。最后，我们可以引导用户到达他们想要的位置。\n\
    \n# 自定义认证守卫\n\n使用 `Auth` 门面上的 `extend` 方法，你可以创建自己的认证守卫。你应该调用服务提供者的 `extend` 方法。由于\
    \ Laravel 已经有一个 `AuthServiceProvider`，我们可以将以下代码粘贴到其中：\n\n```php\n<?php\nnamespace\
    \ App\\Providers;\nuse App\\Services\\Auth\\JwtGuard;\nuse Illuminate\\Contracts\\\
    Foundation\\Application;\nuse Illuminate\\Foundation\\Support\\Providers\\AuthServiceProvider\
    \ as ServiceProvider;\nuse Illuminate\\Support\\Facades\\Auth;\n\nclass AuthServiceProvider\
    \ extends ServiceProvider\n{\n    /**\n     * 注册任何应用认证 / 授权服务。\n     */\n    public\
    \ function boot(): void\n    {\n        Auth::extend(‘jwt’, function (Application\
    \ $app, string $name, array $config) {\n            // 返回 Illuminate\\Contracts\\\
    Auth\\Guard 的实例\n            return new JwtGuard(Auth::createUserProvider($config[‘provider’]));\n\
    \        });\n    }\n}\n```\n\n如前面的示例所示，提供给 `extend` 方法的回调应该返回 `Illuminate\\Contracts\\\
    Auth\\Guard` 的实现。该接口提供了几个必须实现的方法来定义自定义守卫。一旦你定义了自己的守卫，就可以在 `auth.php` 配置文件的 `guards`\
    \ 配置中运行它：\n\n```php\n‘guards’ => [\n    ‘api’ => [\n        ‘driver’ => ‘jwt’,\n\
    \        ‘provider’ => ‘users’,\n    ],\n],\n```\n\n# 闭包请求守卫\n\n使用 `Auth::viaRequest`\
    \ 函数是构建自定义基于 HTTP 请求的认证系统最简单的方法。通过单个闭包，你可以轻松地创建你的认证程序。\n\n开始之前，从 `AuthServiceProvider`\
    \ 的启动方法中调用 `Auth::viaRequest` 函数。`viaRequest` 方法的第一个参数是认证驱动程序的名称。任何描述你自定义守卫的字符串都可以作为此名称。该方法的第二个参数应该是一个闭包，它接收传入的\
    \ HTTP 请求并返回用户实例，或者在认证失败时返回 `null`：\n\n```php\nuse App\\Models\\User;\nuse Illuminate\\\
    Http\\Request;\nuse Illuminate\\Support\\Facades\\Auth;\n\n/**\n * 注册任何应用认证 /\
    \ 授权服务\n */\npublic function boot(): void\n{\n    Auth::viaRequest(‘customToken’,\
    \ function (Request $request) {\n        return Employee::where(‘token’, (string)\
    \ $request->token)->first();\n    });\n}\n```\n\n一旦开发了自定义认证驱动程序，你可以将其作为驱动程序添加到\
    \ `auth.php` 配置文件的 `guards` 配置中：\n\n```php\n‘guards’ => [\n    ‘api’ => [\n  \
    \      ‘driver’ => ‘jwt’,\n    ],\n],\n```\n\n"
- fmt: "\n```\nAuth::loginUsingId(5);\n```\n\nAs the second argument to the `loginUsingId`\
    \ function, you can send a boolean value. This value determines whether the “remember\
    \ me” capability for the authorized session is desired. Remember that the session\
    \ will be authenticated continuously or until the user logs out of the application\
    \ manually:\n\n```php\nAuth::loginUsingId(5, $remember = true);\n```\n\n# Authenticate\
    \ a User Once\n\nTo authenticate a user with the application for a single request,\
    \ use the `once` method. When calling this method, no sessions or cookies will\
    \ be used:\n\n```php\nif (Auth::once($credentials)) {\n    // Code Logic\n}\n\
    ```\n\n# Securing Routes and Actions with Middleware\n\nEven though the check\
    \ function may be used to ascertain whether a user is authenticated, you will\
    \ usually employ a middleware to confirm that the user is authorized before granting\
    \ access to specific routes or controllers.\n\nIt is possible to restrict access\
    \ to a certain route to authorized users by using route middleware. A middleware\
    \ for authentication that comes with Laravel makes use of the class `Illuminate\\\
    Auth\\Middleware\\Authenticate`. You just need to attach the middleware to a route\
    \ specification because it is already registered in the HTTP kernel of your application:\n\
    \n```php\nRoute::get('/offices', function () {\n    // Only authenticated users\
    \ logic\n})->middleware('auth');\n```\n\n# Middleware\n\nMiddleware offers an\
    \ easy way to analyze and filter HTTP requests coming into your application. Laravel,\
    \ for instance, comes with middleware that confirms the user of your application\
    \ has been authenticated. The middleware will lead the user to your application’s\
    \ login screen if they have not been authorized. However, the middleware will\
    \ permit the request to advance farther within the application if the user is\
    \ authorized.\n\nOther than authentication, other middleware may be created to\
    \ carry out a range of activities. For instance, a logging middleware may log\
    \ each request that comes through your application. The Laravel framework comes\
    \ with a variety of middleware, such as middleware for CSRF protection and authentication.\
    \ The `app/Http/Middleware` directory contains all of these middleware.\n\nUse\
    \ the `make:middleware` command to create a new middleware. crafter command:\n\
    \n```bash\nphp artisan make:middleware EnsureTokenIsValid\n```\n\nA new instance\
    \ of the `EnsureTokenIsValid` class will be created in the `app/Http/Middleware`\
    \ directory by this operation. In this middleware, we only permit access to the\
    \ route if the `token` input provided satisfies a predetermined value. If not,\
    \ we will send users back to the `home` URL.\n\n```php\n<?php\n\nnamespace App\\\
    Http\\Middleware;\n\nuse Closure;\nuse Illuminate\\Http\\Request;\nuse Symfony\\\
    Component\\HttpFoundation\\Response;\n\nclass EnsureTokenIsValid\n{\n    /**\n\
    \     * Handle an incoming request.\n     *\n     * @param \\Closure(\\Illuminate\\\
    Http\\Request): (\\Symfony\\Component\\HttpFoundation\\Response) $next\n     */\n\
    \    public function handle(Request $request, Closure $next): Response\n    {\n\
    \        if ($request->input('token') !== 'secret-token') {\n            return\
    \ redirect('home');\n        }\n        return $next($request);\n    }\n}\n```\n\
    \nAs you can see, the middleware will send the client an HTTP redirect if the\
    \ provided token does not match our secret `token`; otherwise, the request will\
    \ be sent to the application. Calling the `$next` callback with the `$request`\
    \ will transfer the request further into the application, letting the middleware\
    \ “pass”.\n\nThe easiest way to think of middleware is as a set of layers that\
    \ HTTP requests must transit through before they can access your application.\
    \ Each tier has the option to review the request or even reject it completely.\n\
    \nBefore or after forwarding the request further into the application, a middleware\
    \ might do our tasks. For instance, the middleware shown here would carry out\
    \ a job before the application handles the request:\n\n```php\n<?php\n\nnamespace\
    \ App\\Http\\Middleware;\n\nuse Closure;\nuse Illuminate\\Http\\Request;\nuse\
    \ Symfony\\Component\\HttpFoundation\\Response;\n\nclass BeforeMiddleware\n{\n\
    \    public function handle(Request $request, Closure $next): Response\n    {\n\
    \        // Perform action\n        return $next($request);\n    }\n}\n```\n*Source:\
    \ [https://laravel.com/docs/](https://laravel.com/docs/)*\n\nHowever, this middleware\
    \ would carry out its function after the application has dealt with the request:\n\
    \n```php\n<?php\n\nnamespace App\\Http\\Middleware;\n\nuse Closure;\nuse Illuminate\\\
    Http\\Request;\nuse Symfony\\Component\\HttpFoundation\\Response;\n\nclass AfterMiddleware\n\
    {\n    public function handle(Request $request, Closure $next): Response\n   \
    \ {\n        $response = $next($request);\n        // Perform action\n       \
    \ return $response;\n    }\n}\n```\n*Source: [https://laravel.com/docs/](https://laravel.com/docs/)*\n\
    \n# Assigning Middleware To Routes\n\nYou may use the `middleware` method while\
    \ specifying the route if you want to apply middleware to particular routes:\n\
    \n```php\nuse App\\Http\\Middleware\\Authenticate;\n\nRoute::get('/EmployeeProfile',\
    \ function () {\n    // Code Logic\n})->middleware(Authenticate::class);\n```\n\
    \nBy giving an array of middleware names to the `middleware` method, you may add\
    \ more than one middleware to the route:\n\n```php\nRoute::get('/', function ()\
    \ {\n    // Logic\n})->middleware([First::class, Second::class]);\n```\n\nYou\
    \ may give middleware aliases in your application’s `Kernel` for convenience.\
    \ The middleware that comes with Laravel is listed in the `$middlewareAliases`\
    \ field by default. You are free to add your own middleware and give it whatever\
    \ you like to this list:\n\n```php\n// Within App\\Http\\Kernel class\nprotected\
    \ $middlewareAliases = [\n    'auth' => \\App\\Http\\Middleware\\Authenticate::class,\n\
    \    'auth.basic' => \\Illuminate\\Auth\\Middleware\\AuthenticateWithBasic::class,\n\
    \    'bindings' => \\Illuminate\\Routing\\Middleware\\SubstituteBindings::class,\n\
    \    'cache.headers' => \\Illuminate\\Http\\Middleware\\SetCacheHeaders::class,\n\
    \    'allowed' => \\Illuminate\\Auth\\Middleware\\Authorize::class,\n    'guest'\
    \ => \\App\\Http\\Middleware\\RedirectIfAuthenticated::class,\n    'signed' =>\
    \ \\Illuminate\\Routing\\Middleware\\ValidateSignature::class,\n    'throttle'\
    \ => \\Illuminate\\Routing\\Middleware\\ThrottleRequests::class,\n    'verified'\
    \ => \\Illuminate\\Auth\\Middleware\\EnsureEmailIsVerified::class,\n];\n```\n\n\
    When adding middleware to routes, you can utilize the middleware alias that has\
    \ been specified in the HTTP kernel:\n\n```php\nRoute::get('/EmployeeProfile',\
    \ function () {\n    // Code Logic\n})->middleware('auth');\n```\n\n# Middleware\
    \ Groups\n\nTo make it simpler to attach middleware to routes, you might occasionally\
    \ wish to aggregate several middleware under a single key. The `$middlewareGroups`\
    \ property of your HTTP kernel may be used to do this.\n\nThe web and API middleware\
    \ groups that Laravel pre-defines contain common middleware that you might wish\
    \ to use on your `web` and `API` routes. Keep in mind that the following middleware\
    \ groups are automatically applied to the routes in your relevant `web` and `api`\
    \ route files by your application’s `App\\Providers\\RouteServiceProvider` service\
    \ provider:\n\n```php\n/**\n * The application’s route middleware groups.\n *\n\
    \ * @var array\n */\nprotected $middlewareGroups = [\n    'web' => [\n       \
    \ \\App\\Http\\Middleware\\EncryptCookies::class,\n        \\Illuminate\\Cookie\\\
    Middleware\\AddQueuedCookiesToResponse::class,\n        \\Illuminate\\Session\\\
    Middleware\\StartSession::class,\n        \\Illuminate\\View\\Middleware\\ShareErrorsFromSession::class,\n\
    \        \\App\\Http\\Middleware\\VerifyCsrfToken::class,\n        \\Illuminate\\\
    Routing\\Middleware\\SubstituteBindings::class,\n    ],\n    'api' => [\n    \
    \    \\Illuminate\\Routing\\Middleware\\ThrottleRequests::class.':api',\n    \
    \    \\Illuminate\\Routing\\Middleware\\SubstituteBindings::class,\n    ],\n];\n\
    ```\n"
  raw: '`Auth::loginUsingId(5);`


    As the second argument to the `loginUsingId` function, you can send a boolean
    value. This value determines whether the “remember me” capability for the authorized
    session is desired. Remember that the session will be authenticated continuously
    or until the user logs out of the application manually:


    `Auth::loginUsingId(5, $remember = true);`


    # [Authenticate a User Once](#toc.xhtml#s183a)


    To authenticate a user with the application for a single request, use the `once`
    method. When calling this method, no sessions or cookies will be used:


    `if (Auth::once($credentials)) {`


    `// Code Logic`


    `}`


    # [Securing Routes and Actions with Middleware](#toc.xhtml#s184a)


    Even though the check function may be used to ascertain whether a user is authenticated,
    you will usually employ a middleware to confirm that the user is authorized before
    granting access to specific routes or controllers.


    It is possible to restrict access to a certain route to authorized users by using
    route middleware. A middleware for authentication that comes with Laravel makes
    use of the class `Illuminate\Auth\Middleware\Authenticate`. You just need to attach
    the middleware to a route specification because it is already registered in the
    HTTP kernel of your application:


    `Route::get(‘/offices’, function () {`


    `// Only authenticated users logic`


    `})->middleware(‘auth’);`


    # [Middleware](#toc.xhtml#s185a)


    Middleware offers an easy way to analyze and filter HTTP requests coming into
    your application. Laravel, for instance, comes with middleware that confirms the
    user of your application has been authenticated. The middleware will lead the
    user to your application’s login screen if they have not been authorized. However,
    the middleware will permit the request to advance farther within the application
    if the user is authorized.


    Other than authentication, other middleware may be created to carry out a range
    of activities. For instance, a logging middleware may log each request that comes
    through your application. The Laravel framework comes with a variety of middleware,
    such as middleware for CSRF protection and authentication. The `app/Http/Middleware`
    directory contains all of these middleware.


    Use the `make:middleware` command to create a new middleware. crafter command


    `php artisan make:middleware EnsureTokenIsValid`


    A new instance of the `EnsureTokenIsValid` class will be created in the `app/Http/Middleware`
    directory by this operation. In this middleware, we only permit access to the
    route if the `token` input provided satisfies a predetermined value. If not, we
    will send users back to the `home` URL.


    `<?php`


    `namespace App\Http\Middleware;`


    `use Closure;`


    `use Illuminate\Http\Request;`


    `use Symfony\Component\HttpFoundation\Response;`


    `class EnsureTokenIsValid`


    `{`


    `/**`


    `* Handle an incoming request.`


    `*`


    `* @param \Closure(\Illuminate\Http\Request): (\Symfony\Component\HttpFoundation\Response)
    $next`


    `*/`


    `public function handle(Request $request, Closure $next): Response`


    `{`


    `if ($request->input(‘token’) !== ‘secret-token’) {`


    `return redirect(‘home’);`


    `}`


    `return $next($request);`


    `}`


    `}`


    As you can see, the middleware will send the client an HTTP redirect if the provided
    token does not match our secret `token`; otherwise, the request will be sent to
    the application. Calling the `$next` callback with the `$reque`st will transfer
    the request further into the application, letting the middleware “pass”.


    The easiest way to think of middleware is as a set of **layers** that HTTP requests
    must transit through before they can access your application. Each tier has the
    option to review the request or even reject it completely.


    Before or after forwarding the request further into the application, a middleware
    might do our tasks. For instance, the middleware shown here would carry out a
    job before the application handles the request:


    `<?php`


    `namespace App\Http\Middleware;`


    `use Closure;`


    `use Illuminate\Http\Request;`


    `use Symfony\Component\HttpFoundation\Response;`


    `class BeforeMiddleware`


    `{`


    `public function handle(Request $request, Closure $next): Response`


    `{`


    `// Perform action`


    `return $next($request);`


    `}`


    `}`


    *Source: [https://laravel.com/docs/](https://laravel.com/docs/)*


    However, this middleware would carry out its function after the application has
    dealt with the request:


    `<?php`


    `namespace App\Http\Middleware;`


    `use Closure;`


    `use Illuminate\Http\Request;`


    `use Symfony\Component\HttpFoundation\Response;`


    `class AfterMiddleware`


    `{`


    `public function handle(Request $request, Closure $next): Response`


    `{`


    `$response = $next($request);`


    `// Perform action`


    `return $response;`


    `}`


    `}`


    *Source: [https://laravel.com/docs/](https://laravel.com/docs/)*


    # [Assigning Middleware To Routes](#toc.xhtml#s186a)


    You may use the `middleware` method while specifying the route if you want to
    apply middleware to particular routes:


    `use App\Http\Middleware\Authenticate;`


    `Route::get(‘/EmployeeProfile’, function () {`


    `// Code Logic`


    `})->middleware(Authenticate::class);`


    By giving an array of middleware names to the `middleware` method, you may add
    more than one middleware to the route:


    `Route::get(‘/’, function () {`


    `// Code Logic`


    `})->middleware([First::class, Second::class]);`


    You may give middleware aliases in your application’s `app/Http/Kernel.php` file
    for convenience. The middleware that comes with Laravel is listed in the class’s
    `$middlewareAliases` field by default. You are free to add your own middleware
    and give it whatever alias you like to this list:


    `// Within App\Http\Kernel class…`


    `protected $middlewareAliases = [`


    `‘auth’ => \App\Http\Middleware\Authenticate::class,`


    `‘auth.basic’ => \Illuminate\Auth\Middleware\AuthenticateWithBasicAuth::class,`


    `‘bindings’ => \Illuminate\Routing\Middleware\SubstituteBindings::class,`


    `‘cache.headers’ => \Illuminate\Http\Middleware\SetCacheHeaders::class,`


    `‘allowed’ => \Illuminate\Auth\Middleware\Authorize::class,`


    `‘guest’ => \App\Http\Middleware\RedirectIfAuthenticated::class,`


    `‘signed’ => \Illuminate\Routing\Middleware\ValidateSignature::class,`


    `‘throttle’ => \Illuminate\Routing\Middleware\ThrottleRequests::class,`


    `‘verified’ => \Illuminate\Auth\Middleware\EnsureEmailIsVerified::class,`


    `];`


    When adding middleware to routes, you can utilize the middleware alias that has
    been specified in the HTTP kernel.


    `Route::get(‘/EmployeeProfile’, function () {`


    `// Code Logic`


    `})->middleware(‘auth’);`


    # [Middleware Groups](#toc.xhtml#s187a)


    To make it simpler to attach middleware to routes, you might occasionally wish
    to aggregate several middleware under a single key. The `$middlewareGroups` property
    of your HTTP kernel may be used to do this.


    The web and API middleware groups that Laravel pre-defines contain common middleware
    that you might wish to use on your `web` and `API` routes. Keep in mind that the
    following middleware groups are automatically applied to the routes in your relevant
    `web` and `api` route files by your application’s `App\Providers\RouteServiceProvider`
    service provider:


    `/**`


    `* The application’s route middleware groups.`


    `*`


    `* @var array`


    `*/`


    `protected $middlewareGroups = [`


    `‘web’ => [`


    `\App\Http\Middleware\EncryptCookies::class,`


    `\Illuminate\Cookie\Middleware\AddQueuedCookiesToResponse::class,`


    `\Illuminate\Session\Middleware\StartSession::class,`


    `\Illuminate\View\Middleware\ShareErrorsFromSession::class,`


    `\App\Http\Middleware\VerifyCsrfToken::class,`


    `\Illuminate\Routing\Middleware\SubstituteBindings::class,`


    `],`


    `‘api’ => [`


    `\Illuminate\Routing\Middleware\ThrottleRequests::class.’:api’,`


    `\Illuminate\Routing\Middleware\SubstituteBindings::class,`


    `],`


    `];`'
