    **Figure 3.4:** Route Groups


    # [Middleware](#toc.xhtml#s74a)


    You can use the middleware method before declaring the group to assign middleware
    to each route within it. The middleware is executed in the array in the following
    order:


    `Route::middleware([‘m1’, ‘m2’])->group(function () {`


    `Route::get(‘/’, function () {`


    `// Uses m1 & m2 middleware`


    `// Code Logic`


    `});`


    `Route::get(‘/city/pollution’, function () {`


    `// Uses m1 & m2 middleware`


    `// Code Logic`


    `});`


    `Route::get(‘/city/waterSupply’, function () {`


    `// Uses m1 & m2 middleware`


    ` // Code Logic`


    `});`


    `});`


    # [Controllers](#toc.xhtml#s75a)


    If a group of routes all use the same controller, you can define the shared controller
    for the group’s routes using the controller method. The controller method that
    they call can therefore be provided when defining the routes:


    `use App\Http\Controllers\CityController;`


    `Route::controller(CityController::class)->group(function () {`


    `Route::get(‘/city/{id}’, ‘show’);`


    `Route::post(‘/city’, ‘location’);`


    `});`


    **Additional ways to define routes**


    In the scenario of a single invokable method in the controller, use as following:


    `Route::post(‘/file’, FileHandler::class)`


    Additionally, the resource controller can be pointed to as:


    `Route::resource(‘users’, UserController::class)`


    # [Subdomain Routing](#toc.xhtml#s76a)


    For instances when you need to capture a part of the subdomain to use in a route
    or controller, the subdomain routing feature of Laravel is useful. Subdomain routing
    can be managed using ‘Route Groups’. The subdomain routes can make use of the
    parameters same as the route parameters and allow the use of the functionality
    to achieve the results using subdomain routing. Before defining the group, the
    `domain` method may be called to specify the subdomain:


    `Route::domain(‘{city}.example.com’)->group(function () {`


    `Route::get(‘city/{id}’, function (string $name, string $id) {`


    `// Code Logic`


    `});`


    `});`


    # [Route Prefixes](#toc.xhtml#s77a)


    Each route in the group may be prefixed with a specific URI using the `prefix`
    method. For instance, you might wish to append `admin:` to the beginning of every
    route URI in the group.


    `Route::prefix(‘hr’)->group(function () {`


    `Route::get(‘/employees’, function () {`


    `// Matches The “/hr/employees” URL`


    `});`


    `});`


    In order to prefix each route in the group, which also has a valid URL – the Laravel
    in-built method can be used. The method `prefix` helps achieve this functionality.
    A good practice is to make use of `admin` and prefix the group with the same.


    We will make sure to include the trailing because the given string is prefixed
    to the route name exactly as it is specified. An element of the prefix:


    `Route::name(‘admin.’)->group(function () {`


    `Route::get(‘/city’, function () {`


    `// Route assigned name “admin.city”`


    `})->name(‘city’);`


    `});`


    # [Cross-origin Resource Sharing (CORS)](#toc.xhtml#s78a)


    With values that you specify, Laravel may automatically reply to CORS `OPTIONS`
    HTTP requests. You may configure every CORS setting in the `config/cors.php` configuration
    file for your application.


    The `HandleCors` middleware, which comes preinstalled in your global middleware
    stack, will automatically handle the `OPTIONS` requests. The HTTP kernel (`App\Http\Kernel`)
    of your application houses the whole global middleware stack.


    # [Caching](#toc.xhtml#s79a)


    Use Laravel’s route cache when releasing your application to the live internet.
    It will take much less time to register all of your application’s routes if you
    use the route cache. Run the `route:cache` Artisan command to generate a route
    cache.


    `php artisan route:cache`


    Your cached routes file will be loaded on each request once you run this command.
    Keep in mind that you must create a new route cache if you add any new routes.
    As a result, you should only execute the `route:cache` command during the deployment
    of your project.


    You could take the route cache, and use the clear command:


    `php artisan route:clear`


    # [Views in Laravel](#toc.xhtml#s80a)


    Views offer a practical method for organizing all of our HTML into different files.


    The html code needed by your application is contained in views, a Laravel technique
    that separates the presentation logic from the controller logic and domain logic.
    Resources/views are the path of the views folder, where they can be found.


    The resources/views directory houses views, which separate your controller/application
    code from your presentation logic. The Blade templating language is typically
    used when using Laravel to create view templates. A straightforward view might
    resemble this:


    `<!-- View stored in resources/views/welcome.blade.php -->`


    `<html>`


    `<body>`


    `<h2>Hello, {{ $name }}</h2>`


    `</body>`


    `</html>`


    `To return the view:`


    `Route::get(‘/’, function () {`


    `return view(‘welcome’, [‘name’ => ‘ABC’]);`


    `});`


    # [Creating Views](#toc.xhtml#s81a)


    By adding a file with the `.blade.php` extension to the `resources/views` directory
    of your application, you can build a view. The framework is informed that a Blade
    template is present in the file by the `.blade.php` extension. Blade templates
    include HTML and Blade directives that make it simple to iterate through data,
    echo values, and generate “if” statements.


    Using the global `view` helper, you can return a view you’ve constructed from
    one of your application’s routes or controllers:


    `Route::get(‘/’, function () {`


    `return view(‘welcome’, [‘name’ => ‘ABC’]);`


    `});`


    The `View` facade can also be used to return views:


    `use Illuminate\Support\Facades\View;`


    `return View::make(‘welcome’, [‘name’ => ‘ABC’]);`


    As evident in the preceding code, the name of the view file in the `resources/views`
    directory corresponds to the first argument supplied to the `view` helper.


    An array of data that ought to be made available to the view is the second argument.
    In this instance, we are passing the `name` variable, which is written in Blade
    syntax and displayed on the view.


    # [Views and View Extensions](#toc.xhtml#s82a)


    The views can be defined in different forms. Let’s look at the views and the extension
    of the view feature.


    ![](images/Figure-3.5.jpg)


    **Figure 3.5:** Views


    # [Nested Views Directories](#toc.xhtml#s83a)


    The `resources/views` directory’s subdirectories are another place where views
    can be nested. Nested views may be referred to using “dot” notation.


    For instance, if your view is located at `resources/views/admin/welcome.blade.php`,
    you could return it using the following syntax from a route or controller in your
    application:


    `return view(‘admin.welcome’, $data);`


    The `.` character shouldn’t be used in view directory names.


    # [First Available View](#toc.xhtml#s84a)


    You can build the first view in an array of views by using the `first` method
    of the `View` facade. If your application or package permits views to be modified
    or replaced, this might be helpful:


    `use Illuminate\Support\Facades\View;`


    `return View::first([‘custom.playground’, ‘playground’], $data);`


    Use the `View` facade to check whether a view is available. If the view is present,
    the `exists` method will return `true`.


    `use Illuminate\Support\Facades\View;`


    `if (View::exists(‘emails.employee’)) {`


    `// Code Logic`


    `}`


    # [Data and Views](#toc.xhtml#s85a)


    The data to be given in this way should be an array containing key/value pairs.
    You can use the data’s keys, such as `<?php echo $name;?>`, to retrieve each value
    in your view after delivering the data to it.


    You can add certain pieces of data to the view using the `with` method rather
    than sending the `view` helper function a whole array of data.


    Before returning the view, the `with` method returns an instance of the view object
    so that you can chain additional methods:


    `return view(‘welcome’)`'
