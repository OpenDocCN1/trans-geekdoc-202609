  trans: "\n\n# 生成模型、CarController 资源类和表单请求类\n\n```bash\nphp artisan make:model Car\
    \ --controller --resource --requests\n```\n\n```bash\nphp artisan make:model Car\
    \ -crR\n```\n\n# 生成模型和 CarPolicy 类\n\n```bash\nphp artisan make:model Car --policy\n\
    ```\n\n# 生成模型、迁移文件、工厂、种子数据和控制器\n\n```bash\nphp artisan make:model Car -mfsc\n\
    ```\n\n# 生成模型、迁移文件、工厂、种子数据、策略、控制器和表单请求的快捷方式\n\n```bash\nphp artisan make:model\
    \ Car --all\n```\n\n# 生成中间表模型（Pivot Model）\n\n```bash\nphp artisan make:model\
    \ Member --pivot\n```\n\n```bash\nphp artisan make:model Member -p\n```\n\n# 数据库迁移\
    \ (Database Migrations)\n\n数据库迁移在管理数据库的版本控制方面起着至关重要的作用，允许团队制定并分发应用程序数据库的架构定义。如果你遇到过这样的挑战：从源码控制拉取更改后，指示团队成员手动向他们的本地数据库架构中集成新列，那么你很可能已经在与数据库迁移旨在解决的问题作斗争了。\n\
    \nLaravel 的 Schema Facade 类提供了一种通用的解决方案，以独立于底层数据库系统的方式创建和操作表。该 Facade 类通常用于迁移中，以便在\
    \ Laravel 支持的所有数据库系统中创建和修改数据库表及列。\n\n要创建数据库迁移文件，请使用 `make:migration` Artisan 命令。新创建的迁移将保存在你的\
    \ `database/migrations` 目录。每个迁移文件名都包含日期，这有助于 Laravel 识别迁移的顺序：\n\n```bash\nphp\
    \ artisan make:migration create_cars_table\n```\n\nLaravel 尝试通过分析迁移名称来预测表名并确定迁移是否会生成新表。如果\
    \ Laravel 能从迁移名称中推断出表名，它会将识别出的表填充到生成的迁移文件中。然而，如果无法推断表名，你可以在迁移文件中显式指定表名。\n\n在使用\
    \ `make:migration` 命令时，你可以灵活地使用 `--path` 选项为生成的迁移文件指定特定路径。指定的路径应相对于应用程序的基础路径。\n\
    \n# 主键 (Primary Key)\n\nEloquent 额外假定每个模型的关联数据库表包含一个 `id` 主键字段。如果需要，你可以通过在模型中创建一个受保护的\
    \ `$primaryKey` 属性将不同的列指定为模型的主键：\n\n```php\n<?php\n\nnamespace App\\Models;\n\
    use Illuminate\\Database\\Eloquent\\Model;\nclass Car extends Model\n{\n    /*\n\
    \     * 与表关联的主键。\n     *\n     * @var string\n     */\n    protected $primaryKey\
    \ = ‘car_id’;\n}\n```\n\n根据 Eloquent 的规定，每个模型至少有一个可以作为其主键的 ID。Eloquent 模型不允许复合主键。然而，除了唯一标识表的主键外，你还允许在数据库表中添加其他多列唯一索引。\n\
    \n# 时间戳 (Timestamps)\n\n默认情况下，Eloquent 预期你模型的关联数据库表具有 `created_at` 和 `updated_at`\
    \ 字段。当模型被创建或更改时，Eloquent 会自动为这些列设置值。如果你不想让 Eloquent 自动管理这些列，你应该将模型上的 `$timestamps`\
    \ 属性设为 `false`：\n\n```php\n<?php\n\nnamespace App\\Models;\nuse Illuminate\\Database\\\
    Eloquent\\Model;\nclass Car extends Model\n{\n    /*\n     * 表示模型是否应该包含时间戳。\n\
    \     *\n     * @var bool\n     */\n    public $timestamps = false;\n}\n```\n\n\
    如果你在处理模型时不想让模型的 `updated_at` 时间戳发生变化，可以在 `withoutTimestamps` 函数提供的闭包内处理模型。\n\n\
    # Eloquent 事件 (Eloquent Events)\n\nEloquent 生命周期周期中的不同事件可以按任何逻辑顺序使用，如下所示：\n\n\
    ![](img/Figure-5.1.jpg)\n\n**图 5.1:** Eloquent 事件\n\n当从数据库获取当前模型时，将发送被检索到的事件。当首次存储新模型时，将触发\
    \ `creating` 和 `created` 事件。当现有模型发生更改并调用 `save` 方法时，将触发 `updating/updated` 事件。当模型被创建或修改时，即使其特征没有变化，也会触发\
    \ `saving/saved` 事件。\n\n以 `-ing` 结尾的事件名称在任何模型更改保存之前发送，而以 `-ed` 结尾的事件名称在模型更改保存后发送。\n\
    \n例如，在你的 Eloquent 模型中创建一个 `$dispatchesEvents` 属性以开始接收模型事件。该属性将你自定义的事件类与 Eloquent\
    \ 模型生命周期的各个阶段相关联。每个模型事件类都应该预期接收来自影响模型实例的构造函数调用：\n\n```php\n<?php\n\nnamespace\
    \ App\\Models;\nuse Illuminate\\Events\\UserDeleted;\nuse Illuminate\\Events\\\
    UserSaved;\nuse Illuminate\\Foundation\\Auth\\User as Authenticatable;\nuse Illuminate\\\
    Notifications\\Notifiable;\nclass User extends Authenticatable\n{\n    use Notifiable;\n\
    \    /*\n     * 模型的事件映射。\n     *\n     * @var array\n     */\n    protected $dispatchesEvents\
    \ = [\n        'saved' => UserSaved::class,\n        'deleted' => UserDeleted::class,\n\
    \    ];\n}\n```\n\n**来源**: Laravel.com/docs\n\n# Laravel 查询构建器 (Query Builder)\n\
    \n查询构建器是 Laravel 最关键的功能之一。Laravel 提供的查询构建器为开发查询提供了简单直观的界面。大多数数据库活动都使用此方法。为了保护应用程序不受注入，它使用了\
    \ PDO 绑定。\n\n# 查询 (Selects)\n\n查询用于在 Laravel 中检索数据。为了理解查询构建器，我们将查看员工场景。\n\n获取所有行：\n\
    \n```php\n$employees = DB::table('employees')->get();\nforeach ($employees as\
    \ $employee)\n{\n    var_dump($employee->name);\n}\n```\n\n获取单行：\n\n```php\n$employee\
    \ = DB::table('employees')->where('name', 'ABC')->first();\nvar_dump($employee->name);\n\
    ```\n\n获取单列：\n\n```php\n$employee = DB::table('employees')->where('name', 'ABC')->pluck('name');\n\
    ```\n\n选择语句 (Select Clause)：\n\n```php\n$employees = DB::table('employees')->select('name',\
    \ 'email')->get();\n$employees = DB::table('employees')->distinct()->get();\n\
    $employees = DB::table('employees')->select('name as employeeName')->get();\n\
    ```\n\nOR 语句：\n\n```php\n$employees = DB::table('employees')\n->where('employedDays',\
    \ '>', 180)\n->orWhere('name', 'ABC')\n->get();\n```\n\nOrderBy, GroupBy 和 having：\n\
    \n```php\n$employees = DB::table('employees')\n->orderBy('name', 'desc')\n->groupBy('count')\n\
    ->having('count', '>', 180)\n->get();\n```\n\n"
