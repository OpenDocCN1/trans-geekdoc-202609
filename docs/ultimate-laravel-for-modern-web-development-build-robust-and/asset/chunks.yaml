- fmt: "\nLaravel provides a rich set of features that simplify the development process\
    \ and allow developers to focus on the core functionality of their applications.\
    \ The framework is well-suited for both novice users in the world of web development\
    \ and experts in the field of development.\n\nLaravel is a PHP web framework that\
    \ provides capabilities for building modern, full-stack web applications.\n\n\
    It is an open-source framework, and its document is available at [https://www.laravel.com/](https://www.laravel.com/)\n\
    \n## Preference for Laravel\n\nIn the ever-moving technology landscape, numerous\
    \ frameworks come into the market. In this section of the chapter, we will explore\
    \ what makes Laravel unique and stand out among other frameworks for application\
    \ development.\n\n## Scalable\n\nPHP is a scalable language, and Laravel provides\
    \ built-in support for fast, distributed cache systems like `Redis`, making the\
    \ framework support horizontal scalability. Laravel applications in the past have\
    \ been able to scale to handle hundreds of millions of requests per month.\n\n\
    Laravel platforms, such as `Laravel Vapor`, provide serverless capabilities for\
    \ Laravel development. It is powered with Amazon Web Services ( AWS) and makes\
    \ including capabilities of AWS in Laravel development easy and maintainable.\n\
    \n## MVC Architecture\n\nThe Laravel framework is based on the Model-View-Controller\
    \ pattern (MVC pattern), which makes the application’s business logic and presentation\
    \ to be distinct, making the framework powerful by increasing its performance.\
    \ This concept is discussed in-depth in [*Chapter 2, MVC Architecture in Laravel](#c02.xhtml)*,\
    \ In this book.\n\n## Community\n\nLaravel has a robust and active community.\
    \ The project is open-source and has active contributors, discussion forums, and\
    \ a strong developer community. The strength of the Laravel community enables\
    \ new developers of the framework to find good documentation and makes it easy\
    \ for them to learn and develop using Laravel. Additionally, Laravel is adopted\
    \ by many developers, leading to increased demand and support in case of issues\
    \ during development. This lowers the barrier to entry for novice developers and\
    \ fosters a welcoming and supportive environment.\n\n## Class Dependency Management\n\
    \nLaravel framework is powered by the Inversion of Control Container (IoC Container),\
    \ which enables class dependency management. It makes the framework powerful by\
    \ its capability to automatically resolve classes without configuration.\n\nThe\
    \ dependencies are tackled at runtime, which allows flexibility as dependency\
    \ implementations can be swapped easily. The two ways in which the IoC container\
    \ can resolve dependencies are `Closure` callbacks and automatic resolution.\n\
    \n## Eloquent ORM\n\nLaravel framework enables Eloquent Object-Relational Mapping\
    \ (ORM), allowing Laravel developers to write with PHP syntax over SQL syntax.\
    \ It provides a great and optimal way of implementation of `ActiveRecord` for\
    \ working with one’s application database. Eloquent ORM is explored more in [*Chapter\
    \ 5, Working with Eloquent ORM and Query Builder](#c05.xhtml),,* of the book.\n\
    \nLaravel is a powerful, robust, and developer-friendly framework, providing modern\
    \ capabilities to develop applications. [*Figure 1.1](#c01.xhtml#fig1_1)* highlights\
    \ the key pillars of Laravel that make developers prefer it.\n\n![](images/Figure-1.1.jpg)\n\
    \n**Figure 1.1:** Laravel Key Pillars\n\nLaravel also provides the following capabilities:\n\
    \n*   **URL Routing Configuration**\n    This enables viewing the content of a\
    \ link in the same webpage instead of redirecting to the link. With Laravel’s\
    \ built-in file configuration, it is loaded with the framework and provides a\
    \ seamless experience for the application user.\n\n*   **Mail Service**\n    Laravel\
    \ has the `Swiftmailer` library, which enables clean and straightforward API configurations\
    \ for individual email accounts. It provides drivers to permit message sending\
    \ via cloud-based and local services.\n    Some of the drivers include `SMTP`,\
    \ `Mailgun`, `Mandrill`, `SparkPost`, PHP’s `mail` and `Sendmail` functions, and\
    \ Amazon `SES`.\n\n*   **Message Queue System**\n    Laravel enables and powers\
    \ the message queue system with its own built-in queue system, which is a simple\
    \ API capable of running tasks in the background. It also supports message queues\
    \ like `Redis`, `SQS`, and many more.\n\n*   **Scheduling**\n    Laravel provides\
    \ the capability to custom schedule tasks and jobs without requiring the developer\
    \ to set it up at the system level. The Laravel `CRON` job is Laravel’s built-in\
    \ utility that provides scheduling functionality in a user-friendly way.\n\n*\
    \   **Authentication and Authorization**\n    The key factor that makes the Laravel\
    \ framework loved by developers is the ability to enable easy control access to\
    \ resources and organize authentication logic.\n    Laravel site owners can seamlessly\
    \ streamline authentication, and the framework provides the owners with flexibility\
    \ and security when dealing with authorization and authentication.\n\n## Unique\
    \ Features of Laravel\n\nLaravel is widely adopted across the developer ecosystem\
    \ and has become the go-to framework for developers for their application development.\
    \ What makes Laravel unique are its several diverse features. Let’s explore these\
    \ unique features of Laravel.\n\n## Database Seeding\n\nThe Laravel framework\
    \ has the ability to populate the database tables with seed data using seed classes.\
    \ These seed classes are stored in the `database/seeders` directory, with a default\
    \ `DatabaseSeeder` class defined.\n\nThis class can be modified to the application’s\
    \ requirement.\n\nLet’s write an example of the `DatabaseSeeder` class to add\
    \ plants and their species name:\n\n```php\n<?php\n\nnamespace Database\\Seeders;\n\
    \nuse Illuminate\\Database\\Seeder;\nuse Illuminate\\Support\\Facades\\DB;\nuse\
    \ Illuminate\\Support\\Str;\n\nclass DatabaseSeeder extends Seeder\n{\n    /**\n\
    \     * Run the database seeders.\n     */\n    public function run(): void\n\
    \    {\n        DB::table('plants')->insert([\n            'name' => Str::random(10),\n\
    \            'species' => Str::random(10)\n        ]);\n    }\n}\n```\n\n## Localization\n\
    \nWith globalization and to accommodate users across the globe with different\
    \ languages, Laravel provides the localization feature, enabling the retrieval\
    \ of strings in different languages. This allows the Laravel application to support\
    \ multiple languages.\n\nThere are two ways to achieve translation strings:\n\n\
    *   `lang` directory\n    The language strings must be stored in the `lang` directory.\
    \ There is also support to include subdirectories for each language supported\
    \ by the application. Through this feature, Laravel can manage translation strings\
    \ for built-in features, such as validation error messages.\n\n    `/lang`\n \
    \   `/en`\n    `messages.php`\n    `/es`\n    `messages.php`\n\n*   **JSON files**\n\
    \    Translation strings can also be placed within JSON files, which must be stored\
    \ in the `lang` directory structure. In this approach, each of the application’s\
    \ supported languages will be in a separate JSON file, which will be listed under\
    \ the `lang` directory.\n    When dealing with a large number of translation strings,\
    \ this method must be preferred.\n\n    `/lang`\n    `en.json`\n    `es.json`\n\
    \nConfiguring the locale is also trivial in this case. By default, the application’s\
    \ default language is stored in the `config/app.php` configuration file under\
    \ the `locale` configuration option.\n\nThe default language can be modified for\
    \ a single HTTP request at runtime with the `setLocale` method of the `App` facade.\n\
    \n```php\nuse Illuminate\\Support\\Facades\\App;\n\nRoute::get('/greeting/{locale}',\
    \ function (string $locale) {\n    if (! in_array($locale, ['en', 'es'])) {\n\
    \        abort(400);\n    }\n\n    App::setLocale($locale);\n\n    // …\n});\n\
    ```\n"
