    `})`


    `->get();`


    # [Advanced Where](#toc.xhtml#s137a)


    More complex `where` clauses, such as **where exists** or nested parameter groupings,
    could occasionally be required. These can also be handled by the Laravel query
    builder:


    `DB::table(‘employees’)`


    `->where(‘name’, ‘=’, ‘ABC’)`


    `->orWhere(function($query)`


    `{`


    `$query->where(‘votes’, ‘>’, 100)`


    `->where(‘title’, ‘<>’, ‘Admin’);`


    `})`


    `->get();`


    The aforementioned query will return the following SQL:


    `select * from employees where name = ‘ABC’ or (votes > 100 and title <> ‘Admin’)`


    # [Aggregates](#toc.xhtml#s138a)


    A wide range of aggregate techniques, including `count`, `max`, `min`, `average`,
    and `total`, are now available in the query builder.


    Count:


    `$employees = DB::table(‘employees’)->count();`


    Max:


    `$cost = DB::table(‘orders’)->max(‘cost’);`


    Min:


    `$cost = DB::table(‘orders’)->min(‘cost’);`


    Average:


    `$cost = DB::table(‘orders’)->avg(‘cost’);`


    Sum:


    `$total = DB::table(‘employees’)->sum(‘votes’);`


    # [Raw Expressions](#toc.xhtml#s139a)


    A query may occasionally need the usage of a raw expression. Take caution not
    to construct any SQL injection points because these expressions will be injected
    into the query as strings! You can use the `DB::raw` command to produce a raw
    expression:


    `$employees = DB::table(‘employees’)`


    `->select(DB::raw(‘count(*) as employee_count, status’))`


    `->where(‘status’, ‘<>’, 1)`


    `->groupBy(‘status’)`


    `->get();`


    # [Pessimistic Locking](#toc.xhtml#s140a)


    There are a few functions in the query builder that will assist you with **pessimistic
    locking** for your `SELECT` statements.


    Use the `sharedLock` method on a query to execute the `SELECT` statement with
    a **shared lock**:


    `DB::table(‘employees’)->where(‘votes’, ‘>’, 140)->sharedLock()->get();`


    You can use the `lockForUpdate` method on a query to **lock for update** on a
    `SELECT` statement:


    `DB::table(‘employees’)->where(‘votes’, ‘>’, 140)->lockForUpdate()->get();`


    # [Caching Queries](#toc.xhtml#s141a)


    Using the `remember or rememberForever` technique, you can conveniently cache
    a query’s results:


    `$value = Cache::rememberForever(‘employees’, function () {`


    `return DB::table(‘employees’)->get();`


    `});`


    This will retrieve it from the cache if it exists or store it forever if it does
    not exist.


    # [Eloquent Operations](#toc.xhtml#s142a)


    Eloquent, an object-relational mapper (ORM) that makes working with your database
    fun, is a component of Laravel. Each database table in Eloquent has a corresponding
    **Model** that is used to communicate with the table. Eloquent models allow you
    to insert, edit, and delete records from the database table in addition to fetching
    them.


    # [Model Classes](#toc.xhtml#s143a)


    Let’s start by building an Eloquent model. The `Illuminate\Database\Eloquent\Model`
    class is generally extended with models, which are typically located in the `app\Models`
    directory. You could use the model Artisan command `make:model` to create a new
    model:


    `php artisan make:model Office`


    Use the `--migration` or `-m` option to generate a database model:


    `php artisan make:model Office –-migration`


    When creating a model, you may also create different classes such as factories,
    seeders, policies, controllers, and form requests. Additionally, by combining
    these choices, it is possible to create numerous classes at once:


    `# Generate a model and a OfficeFactory class…`


    `php artisan make:model Office --factory`


    `php artisan make:model Office -f`


    `# Generate a model and a OfficeSeeder class…`


    `php artisan make:model Office --seed`


    `php artisan make:model Office -s`


    `# Generate a model and a OfficeController class…`


    `php artisan make:model Office --controller`


    `php artisan make:model Office -c`


    `# Generate a model, OfficeController resource class, and form request classes…`


    `php artisan make:model Office --controller --resource --requests`


    `php artisan make:model Office -crR`


    `# Generate a model and a OfficePolicy class…`


    `php artisan make:model Office --policy`


    `# Generate a model and a migration, factory, seeder, and controller…`


    `php artisan make:model Office -mfsc`


    `# Shortcut to generate a model, migration, factory, seeder, policy, controller,
    and form requests…`


    `php artisan make:model Office --all`


    `# Generate a pivot model…`


    `php artisan make:model Member --pivot`


    `php artisan make:model Member -p`


    # [Model Conventions](#toc.xhtml#s144a)


    The `app/Models` directory will house any models created by the `make:model` command.
    Let’s look at a fundamental model class and talk about some of Eloquent’s fundamental
    conventions:


    `<?php`


    `namespace App\Models;`


    `use Illuminate\Database\Eloquent\Model;`


    `class Office extends Model`


    `{`


    `// Code Logic`


    `}`


    # [Table Name](#toc.xhtml#s145a)


    You might have noted from the preceding example that we did not specify to Eloquent
    which database table corresponds to our `Office` model. Conventionally, unless
    another name is specifically supplied, the table name will be the class’s **snake
    case**, plural name. Since an `OfficeCapacityController` model would store entries
    in a table called `office_capacity_controllers`, Eloquent will presume that the
    `Office` model stores records in the `office` table.


    If the database table that corresponds to your model does not follow this norm,
    you can define a `table` attribute on the model to manually specify the table
    name:


    `<?php`


    `namespace App\Models;`


    `use Illuminate\Database\Eloquent\Model;`


    `class Office extends Model`


    `{`


    `/**`


    `* The table associated with the model. And the logic.`


    `*`


    `* @var string`


    `*`


    `*/`


    `protected $table = ‘my_offices’;`


    `}`


    # [Primary Key](#toc.xhtml#s146a)


    Eloquent will additionally presume that the associated database table for each
    model contains an `id` primary key column.


    ![](images/Figure-5.3.jpg)


    **Figure 5.3:** Primary Key Types


    **Homogeneous Primary Key**


    Eloquent will additionally presume that the associated database table for each
    model contains an `id` primary key column `- $primaryKey:`


    `<?php`


    `namespace App\Models;`


    `use Illuminate\Database\Eloquent\Model;`


    `class Office extends Model`


    `{`


    `/**`


    `* The primary key associated with the table.`


    `*`


    `* @var string`


    `*/`


    `protected $primaryKey = ‘office_id’;`


    `}`


    Moreover, Eloquent will automatically convert the primary key to an integer because
    it expects that the primary key is an incrementing integer value. You must declare
    a public `$incrementing` property on your model with the value set to `false`
    if you want to utilize a non-incrementing or non-numeric primary key:


    `<?php`


    `class Office extends Model`


    `{`


    `/**`


    `* Indicates if the model’s ID is auto-incrementing.`


    `*`


    `* @var bool`


    `*`


    `*/`


    `public $incrementing = false;`


    `}`


    You should add a protected `$keyType` property to your model if the primary key
    is not an integer. The `String` should be the value for this property:


    `<?php`


    `class Office extends Model`


    `{`


    `/**`


    `* The data type of the auto-incrementing ID.`


    `*`


    `* @var string`


    `*`


    `*/`


    `protected $keyType = ‘string’;`


    `}`


    **Composite Primary Key**


    Each model must have at least one **ID** that can act as its primary key according
    to Eloquent. Eloquent models do not support **composite** main keys.


    However, in addition to the main key that uniquely identifies the table, you are
    allowed to add other multi-column, unique indexes to your database tables.


    # [UUID and ULID Keys](#toc.xhtml#s147a)'
