- fmt: "\nWhen the CLI is installed per project, you will most likely need to run\
    \ it from your project’s `vendor/bin` directory, which is where `Composer` installs\
    \ executables. To see all of the available Vapor CLI commands, for example, use\
    \ the `list` command:\n\n```bash\nphp vendor/bin/vapor list\n```\n\nUse the `help`\
    \ command and the name of the command you want to investigate:\n\n```bash\nphp\
    \ vendor/bin/vapor help deploy\n```\n\n# Installing the Vapor Core\n\nEvery Laravel\
    \ application that uses Vapor must have the `laravel/vapor-core` package loaded\
    \ as a dependency. This package includes several Vapor runtime files as well as\
    \ a service provider that will allow your application to operate on Vapor. `Composer`\
    \ may be used to integrate the Vapor Core into your project:\n\n```bash\ncomposer\
    \ require laravel/vapor-core --update-with-dependencies\n```\n\n# Installing the\
    \ Vapor Dashboard\n\nYou may also wish to install the `laravel/vapor-ui` package.\
    \ This package adds a lovely dashboard to your application that allows you to\
    \ monitor logs and unsuccessful queue processes. After you deploy your app to\
    \ Vapor, the dashboard will be accessible via the `/vapor-ui` URI. `Composer`\
    \ may be used to install the Vapor UI dashboard package in your project:\n\n```bash\n\
    composer require laravel/vapor-ui\n```\n\nYou may use the `vapor-ui:install` Artisan\
    \ command to publish its assets:\n\n```bash\nphp artisan vapor-ui:install\n```\n\
    \nThe dashboard will be accessible using the `/vapor-ui` URI.\n\n# Dashboard Authorization\n\
    \nAt the `/vapor-ui` URI, Vapor UI offers a dashboard. There is a `gate` function\
    \ in your `app/Providers/VaporUiServiceProvider.php` file that regulates access\
    \ to the Vapor UI dashboard. All visitors are limited by default. To grant access\
    \ to your Vapor UI dashboard, you should alter this `gate` as needed:\n\n```php\n\
    protected function gate()\n{\n    Gate::define(‘viewVaporUI’, function ($user\
    \ = null) {\n        return in_array(optional($user)->email, [\n            ‘abc@example.com’,\n\
    \        ]);\n    });\n}\n```\n\n# Environment\n\nAll of your deployments and\
    \ command executions are saved in environments. Every project may have as many\
    \ environments as it requires.\n\nTypically, you will have a `production` environment\
    \ and a `staging` environment for testing your application. However, don’t be\
    \ scared to set up other environments for testing new features without interfering\
    \ with your primary staging environment.\n\nThe `env` Vapor CLI tool may be used\
    \ to build environments:\n\n```bash\nvapor env my-environment\n```\n\nThis command\
    \ will add a new environment entry to your project’s `vapor.yml` file, ready for\
    \ deployment:\n\n```yaml\nid: 3\nname: vapor-laravel-app\nenvironments:\n  production:\n\
    \    build:\n      - ‘composer install --no-dev’\n  my-environment:\n    build:\n\
    \      - ‘composer install --no-dev’\n```\n\nVapor allows Docker image deployments\
    \ in addition to native runtimes. When building an environment, use the `--docker`\
    \ option to specify that it should utilize a Docker image runtime rather than\
    \ the default Vapor runtime.\n\n```bash\nvapor env my-environment --docker\n```\n\
    \nThis command will establish a new environment called `my-environment.Dockerfile`\
    \ at the root directory of your application. The `open` command in the Vapor CLI\
    \ may be used to open environments in your default browser:\n\n```bash\nvapor\
    \ open my-environment\n```\n\nVapor CLI utilizes the `staging` environment by\
    \ default when performing a command:\n\n```bash\nvapor open // Opens the `staging`\
    \ environment in default browser\nvapor production // Opens the `production` environment\
    \ in default browser\n```\n\nHowever, you may alter the default environment for\
    \ your project by defining a `default-environment` option in your application’s\
    \ `vapor.yml` file:\n\n```yaml\nid: 3\nname: vapor-laravel-app\ndefault-environment:\
    \ production\nenvironments:\n  production:\n    build:\n      - ‘composer install\
    \ --no-dev’\n  my-environment:\n    build:\n      - ‘composer install --no-dev’\n\
    ```\n\n## Environment Variables\n\nEach environment comprises a collection of\
    \ environment variables, like the variables in your application’s `.env` file,\
    \ offer critical information to your program during execution. All of the environment\
    \ variables that are injected by Vapor, with their `env()` values, are listed\
    \ in the following table:\n\n| `.env` Value | `env()` Value |\n| :--- | :--- |\n\
    | `APP_ENV` | Environment name |\n| `APP_DEBUG` | Debug |\n| `APP_URL` | Vanity\
    \ domain, or custom domain if exists |\n| `ASSET_URL` | CloudFront |\n| `AWS_BUCKET`\
    \ | Storage resource if exists |\n| `BROADCAST_DRIVER` | Pusher |\n| `CACHE_DRIVER`\
    \ | DynamoDB, or cache (Redis) resource if exists |\n| `DB_*` | Database (MySQL,\
    \ Postgresql, etc) resource if exists |\n| `DYNAMODB_CACHE_TABLE` | `vapor_cache`\
    \ |\n| `FILESYSTEM_DISK` | S3 |\n| `FILESYSTEM_DRIVER` | S3 |\n| `FILESYSTEM_CLOUD`\
    \ | S3 |\n| `LOG_CHANNEL` | Stderr |\n| `MAIL_DRIVER` | LOG, but SES for environments\
    \ with the name `production` |\n| `MAIL_MAILER` | LOG, but SES for environments\
    \ with the name `production` |\n| `MAIL_FROM_ADDRESS` | `hello@example.com` or\
    \ `hello@custom-domain.com` if exists |\n| `MAIL_FROM_NAME` | `your_project_name`\
    \ |\n| `MIX_URL` | CloudFront |\n| `QUEUE_CONNECTION` | SQS |\n| `SCHEDULE_CACHE_DRIVER`\
    \ | DynamoDB |\n| `SESSION_DRIVER` | Cookie |\n\n**Table 10.1:** Environment Variables\
    \ injected by Vapor on the environment When you manage your environment with Vapor\
    \ CLI or Vapor UI, you will not see these environment variables, and any variables\
    \ you explicitly set will override Vapor’s automatically injected variables.\n\
    \n# Deployment\n\nDeployments can only be started via the Vapor CLI. Vapor will\
    \ perform the build steps of your `vapor.yml` file on the local computer that\
    \ the deployment is executing on deployment. This might be your own computer or\
    \ a continuous integration platform. To begin a deployment, use the `deploy` CLI\
    \ command from your application’s root directory.\n\n```bash\nvapor deploy production\n\
    ```\n\n# Hooks\n\nYou may specify build hooks for an environment in your `vapor.yml`\
    \ file by utilizing the `build` keyword. These instructions are run on the local\
    \ system where the deployment is taking place and may be used to prepare your\
    \ application for deployment. During deployment, your application is constructed\
    \ under a temporary `.vapor` directory established by the CLI, and all of your\
    \ `build` instructions are executed within that directory:\n\n```yaml\nid: 4\n\
    name: vapor-app\nenvironments:\n  production:\n    memory: 1024\n    database:\
    \ vapor-app\n    cache: vapor-cache\n    build:\n      - ‘composer install --no-dev’\n\
    \      - ‘php artisan event:cache’\n    deploy:\n      - ‘php artisan migrate\
    \ --force’\n```\n\nYou may specify deployment hooks for an environment in your\
    \ `vapor.yml` file by using the `deploy` key. These commands are run on the deployed\
    \ environment before it is made available to the public. The deployment will not\
    \ be activated if any of these instructions fail:\n\n```yaml\nid: 4\nname: vapor-app\n\
    environments:\n  production:\n    memory: 1024\n    database: vapor-app\n    cache:\
    \ vapor-cache\n    build:\n      - ‘composer install --no-dev’\n      - ‘php artisan\
    \ event:cache’\n    deploy:\n      - ‘php artisan migrate --force’\n```\n\nWhen\
    \ a deployment hook fails, you may see the output / logs via the deployment detail\
    \ tab in the Vapor UI. Also, if you use the `vapor deploy` command to deploy your\
    \ application, the CLI output will include the unsuccessful hook output. Of course,\
    \ you may inspect the output at any moment by utilizing the `hook:output` for\
    \ output:\n\n```bash\nvapor hook:output {DEPLOYMENT_HOOK_ID}\n```\n\nUsing the\
    \ `hook:log` command, you may examine the logs connected with the unsuccessful:\n\
    \n```bash\nvapor hook:log {DEPLOYMENT_HOOK_ID}\n```\n\n# Development\n\nTo return\
    \ binary replies from your Vapor application, such as PDF downloads, your HTTP\
    \ response should contain the `X-Vapor-Base64-Encode` header:\n\n```php\nreturn\
    \ $response->withHeaders([\n    'X-Vapor-Base64-Encode' => ‘True',\n]);\n```\n"
