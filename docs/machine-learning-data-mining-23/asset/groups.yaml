    其中 $\rho_{it}$ 是报纸 $i$ 在时间 $t$ 对应的流行度指数。计算 $\rho_{it}$ 需要了解该报纸所属每个主题的流行度指数。显而易见，某些新闻主题比其他更有吸引力，因此人们可能对讨论这些主题表现出更大的兴趣。由于模型产生的主没有按顺序排列（见第4.3节），我通过对主题进行排序，为每个主题建立流行度指数。开发该指数的第一步是为英语和中文用户构建社交网络语料库。


    我利用 Twitter API 在 2018 年 10 月 10 日至 2019 年 8 月 8 日之间从英语语料库中收集了共 15,236,749 条推文。查询
