    ## 5.2 从审查到民族主义


    我使用媒体一致性作为民族主义代理。报纸中的情感一致性是我在解释动态时需要考虑的重要因素。报纸自然地或由于审查关注某些群体；另一方面，新闻一致性取决于当前情绪。我通过跨平台聚合情感并在媒体审查压力下衡量一致性。换句话说，新闻一致性比传统的媒体情感更能解释民族主义。对于每个国家，我定义
    $t$ 时报纸 $i$ 的情感一致性代理 $c_i \in [0,1]$ 为：


    $c_{it} = \frac{1}{1 + |\Sigma_{it}|}$


    其中 $\Sigma_{it}$ 是 $t$ 时的平均情感，如第 4.2 节所述，$\bar{\Sigma}_i$ 是 $t$ 时所有新闻的平均值。


