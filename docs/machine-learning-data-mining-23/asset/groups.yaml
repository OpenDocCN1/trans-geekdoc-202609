    # Marco Antonio Aceves-Fernández

    Andries Engelbrecht


    # Machine Learning and Data Mining


    # Annual Volume 2023


    # Complexity Analysis in Channel Estimation Massive MIMO Compared with LMU and
    GRU


    Hany Helmy, Sherif El Diasty and Hazem Shatila


    ## Abstract


    MIMO: Multiple-input multiple-output channel technology uses multiple antennas
    to use reflected signals to provide channel robustness and throughput gains. It
    is advantageous in several applications like cellular systems, users are distributed
    over a wide coverage area in various applications such as mobile systems, improving
    channel state information (CSI) processing efficiency in massive MIMO systems.
    This chapter proposes two channel-based deep learning methods gated recurrent
    unit and a Legendre memory unit to enhance the performance in a massive MIMO system
    and compares the complexity analysis to the previous methods. The complexity analysis
    is based on the channel state information network connected with gated recurrent
    units and Legendre memory unit to indicator parameters which show the difference
    between literature-based techniques.


    **Keywords**: MIMO, FDD, compressed sensing, deep learning, conventional neural
    network, complexity analysis, gated recurrent unit, Legendre memory unit


    ## 1. Introduction


    Complexity analysis in deep learning is a fascinating topic when delving into
    the realm of deep learning, we often encounter intricate models with numerous
    layers and countless parameters [1]. It is essential for models to truly understand
    their inner workings. Now, complexity analysis in deep learning involves assessing
    the computational requirements and efficiency of these models. One commonly used
    metric is time complexity, which examines how the computational costs increase
    with the input size [2]. It allows us to estimate the computational resources
    needed for training and inference tasks.


    Another aspect to consider is the space complexity, which examines the memory
    requirements of deep learning models. As the number of layers and parameters grows,
    so does the memory needed to store them [3]. Understanding this helps us optimize
    memory usage and select suitable hardware for our neural networks. However, it''s
    worth mentioning that deep learning is an ever-evolving field, and complexity
    analysis is just a small part of the puzzle.


    # Machine Learning and Data Mining Annual Volume 2023


    There are always new challenges, surprises, and complexities waiting to be unveiled.
    It''s a journey that continues to captivate and intrigue scientists and enthusiasts
    alike. The history of complexity analysis in deep learning. It is indeed an intriguing
    subject. The path to understanding the complexity of deep learning has been paved
    with triumphs and challenges. Back in the early days, when I first ventured into
    the realm of theoretical physics, we were only scratching the surface of what
    would later become known as deep learning [4]. The concept of neural networks
    has been around for some time, but with the advent of powerful, computational
    capacities truly allowed us to explore their potential. As we delved deeper, we
    began to realize that the complexity of deep learning models was no trivial matter.


    The number of parameters, the intricate interconnections, and the sheer depth
    of these networks made a fascinating puzzle to unravel. The primary challenge
    was to develop methods for analyzing and understanding the complexity of these
    models. We needed tools that could help us comprehend the behavior of deep learning
    systems, predict their performance, and discern their limitations. Over time,
    researchers developed various approaches to complexity analysis in deep learning
    [5]. They ranged from straightforward measures like counting the number of parameters
    or layers, to more sophisticated techniques such as analyzing the network''s computational
    and memory requirements. Additionally, advancements were made in characterizing
    the computational complexity of training deep learning models. The notion of time
    and resource complexity became crucial in comprehending the training process and
    predicting how long it might take, given a certain dataset and architecture [6].


    ## 2. Complexity analysis


    ### 2.1 Performance and complexity trade-off of LMU and GRU


    The Legendre Memory Unit (LMU) is mathematically derived to orthogonalize its
    continuous-time history — by solving d coupled ordinary differential equations
    (ODEs), whose phase space linearly onto sliding windows of time via the Legendre
    polynomials to order d-1.


    The Gated Recurrent Unit (GRU) is a type of Recurrent Neural Network (RNN) which,
    in cases, has advantages over long-term memory (LSTM) (Figure 1). GRU uses less
    memory and is faster than LSTM, however, LSTM is more accurate when using datasets
    with longer sequences (Figure 2).


    The RNNs for CSI compression and reconstruction of massive MIMO systems have a
    remarkable number of parameters. The recurrent neural network model, for example,
    can add up to 10⁷ more parameters, raising storage and computation difficulties.
    To reduce the computational complexity and required memory, a fully connected-layer
    autoencoder has been developed for channel state information feedback in time-varying
    channels [9].


    While research investigated recurrent neural networks RNNs, the least computationally
    expensive of these models still need 10⁷ parameters per snapshot. When the compression
    ratio is small, the networks also suffer from a significant drop in performance
    because they must keep the same compression ratio in successive time slots and
    cannot obtain information [10]. Despite the reported performance of “stacked”
    GRUs, the minimum depth of recurrent layers required for CSI recovery has yet
    be determined. To reduce computational complexity, we seek to develop a simple
    but effective Legendre unit combined with gated recurrent unit to improve CSI
    accuracy. Temporally by developing a simple but effective Legendre unit combined
    with gated recurrent unit to improve CSI accuracy. Table 1 shows the number of
    parameters and floating-point operations (FLOPs) along with the high cost. The
    comparison results show that our architecture is a significant step forward for
    deep learning applications in massive MIMO.


