    ## D. Zeus Africa 多变量回归训练与测试数据


    | SKU ID | BZ01 | B004 | B009 | B012 | B013 | B030 | 总计 |

    |---|---|---|---|---|---|---|---|

    | 训练频率 % 和 | 444 | 559 | 342 | 488 | 199 | 641 | 2673 |

    | 16.6% | 20.9% | 12.8% | 18.3% | 7.4% | 24.0% | 100.0% |

    | 测试频率和 % | 191 | 239 | 146 | 209 | 85 | 275 | 1145 |

    | 16.7% | 20.9% | 12.8% | 18.3% | 7.4% | 24.0% | 100.0% |


    ## E. PCA 模型假设


    假设 1：变量间的球形性或存在共线性。

    使用 Bartlett 球形检验（Bartlett''s Test for Sphericity）来确定相关矩阵是否来自非线性总体。如果情况并非如此，PCA
    可能不再适用，因为它依赖于构建变量的线性组合。Bartlett 检验测试的假设如下：


    - Ho：变量之间不存在共线性。

    - Ha：变量之间存在共线性。

    - 在 0.05 的显著性水平下（记为 α = 0.05）应用 Bartlett 检验，得到的 p 值为 < 0.038，拒绝零假设并接受备择假设，即有充分证据表明变量之间存在共线性。


    假设 2：样本充足性。

    应用 KMO 检验（Kaiser-Meyer-Olin test）来确定数据是否适用于因子分析或 PCA 等降维技术。以下阈值指导了 KMO 统计量的解释，KMO
    值的可以解释如下（Stephanie, 2016）：

    KMO 值介于：


    - 0.49 被认为不可接受。

    - 0.50 到 0.59 被认为中等。

    - 0.60 到 0.69 被认为中等。


    总结来说，KMO 值大于 0.79 表示数据样本充足。KMO 值小于 0.5 表示数据样本不足，需要采取补救措施。应用 KMO 检验得到的总体 KMO 得数为
    0.79，证实数据是充足的。此外，KMO 分数小于 0.05 的变量被排除在 PCA 之外。


    假设 3. 相关或方方差矩阵的行列式。行列式值必须为正数，这意味着正对称协方差矩阵。通过应用 R 语言的“det”函数进行了测试。“det”函数返回值为2.75601E-09，证实了正值符合该假设。


    假设 4。PCA 碎点图 - PVE 和累积 PVE。

    下图显示了在第四个 PC 之后 PVE 的下降。然而，这四个 PC 可以解释数据集中 79% 的方差。此外，在四个 PC 上的模型准确性得到的残差均方根（RMSR）值为
    0.056，正处于 0.05 可接受阈值的边缘（Rajput, 2018）。载荷代表相应主成分的特征值。所有成分都反映了大于 1 的接受 SS 载荷值。


