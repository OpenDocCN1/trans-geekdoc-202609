    ## 2.4 随机森林


    随机森林（RF）[28] 是一种采用多个决策树进行训练和预测的分类器。RF 本质上是机器学习中的集成系统 [29]。作为新兴且高度灵活的机器学习算法，RF
    的应用范围广泛，从医疗保险到医疗营销。RF 可用于预测疾病风险和患者群的易感性 [30]。RF 基于决策树（DT）构建，利用从数据中学到的知识对新数据进行分类。通过设置树的数量和分支等参数，构建出多个模型。最终输出由所有树的集体决策决定，实现了超越其他方法的分类准确率。


    RF 算法还包含了 Bagging 方法。直观地说，每棵决策树都是一个分类器，对输入样本产生结果。RF 聚合所有投票，并指定票数最高的类别。RF 具有许多优势，如处理缺失值、高维数据不需要降维，以及引入随机性以防止过拟合。本质上，RF
    是机器学习领域中功能多样的强大工具，能够适应各种任务。RF 在估计映射方面特别有用，其多功能性使其极具价值。它不需要像支持向量机（SVM）那样进行大量的参数调优，并且产生更高的准确率
    [31]。


    在构建糖尿病、高血压和高脂血症等慢性病预测模型的案例中，分析 RF 与神经网络的混淆矩阵比较发现，加权平均和宏平均之间存在显著差异。宏平均给每个类别分配相同的权重。在类别分布不平衡的情况下，加权平均更强调样本量较大的类别，而削了样本较小类的性能。然而，在处理具有复杂决策边界的大型高维数据集时，RF
    的表现可能更好，使其值得在临床研究中被广泛采用。


    ## 2. 决策树


    决策树（DT）是一种机器学习方法 [36]。DT 的显著特征是其树形结构，其中每个节点代表对属性的判断，每条分支代表决策结果的输出，每个叶子节点代表一个分类结果。总来说，DT
    是一种决策分析方法，通过根据已知概率构建 DT 来计算预期净值大于或等于 0 的概率，从而评估风险和收益。这种决策分析方法以图形方式进行概率分析，由于其类似于树枝，因此被称为决策树。在机器学习中，DT
    是一种预测模型 [37]，表示对象属性与值之间的映射关系。


    ID3、C4.5 和 C5.0 等 DT 算法利用信息论中的熵的概念来生成树。用于分类的 DT 是一种监督学习，其中“监督学习”一词是指提供一组具有预定义类别的样本。另一方面，分类回归树（CART）是一种对分类和回归都完全有效的方法
    [38]。它构建二叉树。CART 被广泛应用于统计领域和数据挖掘，使其易于理解、使用和解释 [39]。随着数据变得复杂和变量数量增加，CART 生成的预测树通常比传统的代数标准更准确。在我的许多研究中，DT
    模型被广泛利用。此外，DT 可以指示相互作用效应，并可进一步用于乘法和加法相互作用分析。


    ## 2.5 支持向量机


    支持向量机（SVM）是一种广义线性分类器，以监督学习的方式对数据进行二分类。它的决策边界是根据学习样本推导出的最大间隔超平面，是一种以稀疏性和稳健性著称的分类器
    [32]。SVM 可以使用核方法进行非线性分类，将输入内容映射到高维特征空间。随着时间的演变，它可以通过扩展处理多分类和回归。


    SVM 在训练数据集上寻找一个用于分类的超平面，并根据结果大于或小于 0 来对新数据进行分类。对于完全线性可分的问题，可以直接找到超平面。即使考虑到噪声数据，引入软边界仍可以获得解决方案。由于（此处原文为演变）在线性可分的情况下，数据可以提升到更高维度以实现可分，且映射函数可以使用核技术解决。SVM
    最大的优势是利用核技术捕捉非线性关系。此外，SVM 在处理少量高维数据方面非常有效，特别是在分类问题中。SVM 广泛应用于医学诊断，如疾病检测和癌症诊断 [33]。它还可以通过从图像中提取特征向量用于识别、视频分类和医学图像分类。


