    ## 5.3 DID 模型


    此外，我采用一致性（consistency）作为媒体审查的代理变量，通过调节不同政治体制国家的民族主义情绪来衡量。为了减少在通过一致性衡量民族主义时由外部因素引入的潜在偏差，并考察审查对国际关系的影响，我利用了一个涉及
    2019 年中美贸易战的自然实验。


    贸易战是一次意料之外的事件，影响了每个实体对报纸的实际需求，因此双重差分法（DID）估计量是无偏的。这是因为，虽然贸易战影响了整体情绪，但国家情绪的变化与战争本身的强度无关。


    此外，每个实体的国家情绪水平不受贸易战的影响，因为它们受到舆论的控制或不受其影响。真实的媒体自由度以及其与政府立场的一致性可能会受到政府的干预，因此可能无法充分反映官方政策。


    在我的实证研究中，我选择媒体情绪作为交互作用的代理变量。$D(T-war)$ 是中美贸易战期间的虚拟变量，$\zeta_i$ 是来源固定效应。我允许实体固定效应来捕捉所测每个实体的异质性。我假设如果漏变量随时间变化但在所有报纸之间保持不变，那么每日媒体情绪和一致性指标应该吸收这种影响。因此，我不使用固定效应。$\omega$
    可以被解释为在没有显著权威干预的和平期间，中美各自民族主义对其双边关系的影响。


    在没有显著权威干预的和平期间的双边关系。$\theta_0$ 是常数项。


    系数 $\theta_1$ 是我关注的参数，用于捕捉中美贸易战后新闻一致性的变化。虚拟变量 $D(T-war)$ 用于区分处理组和控制组。处理组指示变量系数
    $\theta_1$ 代表了处理组 $(D(T-war)=1)$ 与控制组之间由贸易战引起的民族主义变化的结果差异。$\theta_1$ 的正负揭示了贸易战期间的新闻一致性对结果变量是有正向影响（改善国际关系）还是负面影响（损害国际关系）。


    # 6 实证结果


    本节介绍了本章的主要结果。在我的主要结果中，我关注 2009 年至 2019 年巴拉克·奥巴马总统和唐纳德·特朗普总统任期间发表的新闻文章。使用两个总统任期的观察结果反映了贸易战前后美国对华政治外交策略的稳定性。与美国共和党和民主党之间的竞争不同，中国统一战线的成员必须遵守中共，并必须接受其“领导地位”作为其继续存在的条件。此外，中国对美政策主要取决于中共的政策，而该政策具有相对的一致性。中美关系在期间可以得到有效衡量。


