    nationalism and the media are tightly bound together.


    # 2.3 Media and censorship system


    Montiel al. investigate production of nationalism in the national media during
    an international conflict [23]. Nationalism also has an effect on the public media.
    Studying the India-Pakistan military conflict of 29 September 2016, Pandit and
    Chattopadhyay argues that the news media in India has always adhered to belligerent
    voices of patriotism and consciously obscured the disagreement of minority voices
    [24]. The strong correlation between media reporting and nationalism allows us
    to use media as a proxy for measuring nationalism. Using news articles allows
    us to measure nationalism, another problem in this measure is the effects of a
