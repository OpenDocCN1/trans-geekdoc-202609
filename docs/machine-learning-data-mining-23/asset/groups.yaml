    sigmoid 函数的微分允许其用于梯度下降。在输出层使用 sigmoid 函数可以将输出值限制在较小的范围内。结果，模型的扩展连接性优于决策树（DT）等模型，其中隐藏层可以揭示自变量与因变量之间的相互作用。此外，ANN
    擅长快速找到解决方案。为复杂问题寻找最优解通常需要大量的计算工作。利用为特定问题设计的反馈类型神经网络，可以利用其高高速处理能力快速找到优化解决方案。ANN
    可以计算自变量特征的重要性值。根据自变量之间复杂的相互关系，可以清楚地识别出对因变量影响最大的特征。寻找最优解决方案的能力优于逻辑回归（LR）和 DT 模型。关于
    ANN 参数设置，可以在训练集和验证集上尝试各种变换。如果使用多层感知器（MLP）神经网络，建议添加支持集，以增强 ANN 模型训练和学习的有效性。在我在利用
    MLP 网络进行建模的经验中，我认为 MLP 神经网络是一种非常合适的监督学习技术，通过根据因变量的数据类型设置参数，可以产生更多的预测性分类和概率，指导临床诊断和治疗。然而，根据我目前的研究经验，BP
    神经网络和 MLP 神经网络存在缺点，如收敛速度慢、易陷入局部最优以及无法达到全局最优解。对于其他模型，如基函数神经网络、CNN 和随机网络，我尚未尝试进行建模，我目前将暂不讨论它们。


    上述提到的模型外，还有其他应用于临床医学研究的机器学习模型，包括基于直方图梯度提升、CatBoost、LightGB、XGBoost、GBM 和 GBDT，这些都是基于决策树的建模算法。CatBoost、LightGB、XGBoost
    和 GBM 是基于 GBM 算法改进和完善的先进机器学习算法，GBM 通过有序迭代使损失函数向梯度最陡峭的方向进行优化。这些算法，包括 GBM 及其衍生算法直方图梯度提升、XGBoost、LightGB
    和 CatBoost，被认为是医学研究的焦点，特别是因为它们非常适用于医学研究常用的扁平数据。然而，由于其复杂性，这些算法在临床应用中很少使用，使得普通医疗工作者难以理解。这些算法都有自己的优缺点，我目前缺乏相关经验来提供进一步见解。希望未来这些先进算法能应用于临床研究和验证，为医学研究探索更合适的建模算法。许多先进算法以决策树为基础。结合我之前的机器学习经验，我认为这很大程度上是因为决策树具有许多优势。例如，决策树可以被认为一组
    if-then 规则，使其易于理解和解释。它们对特征工程的要求极低，且不需要任何先验假设。决策树可以很好地处理缺失值并表现出稳健性能，特别是在实施防止过拟合的方法后。决策树构建技术不需要昂贵的计算成本。即使在处理大型训练集时也可以快速构建模型。


    # 2.8 朴素贝叶斯算法


    朴素贝叶斯算法广泛应用于医学研究，尽管我尚未亲自使用过它。朴素贝叶斯是一种分类算法 [53]，基于贝叶斯定理和特征独立性假设。它使用概率统计结合样本数据。它结合先验概率和后验概率，以避免使用先验概率产生主观偏差，或仅使用样本信息导致过拟合。该算法适用于中等规模的数据
    [54]。朴素贝叶斯在医学领域也得到了广泛应用。它可以用于诊断、对症状和测试结果预测可能的疾病，并协助医生做出诊断决策。此外，它常用于医学图像分类，尽管其处理图像数据的性能不如深度学习方法强；但它仍适用于简单的图像分类任务。通过对图像建模，它可以自动将图像分为不同的类别。


    # 3. 评估预测性能


    评估模型质量涉及某些标准。回归模型通常使用均方误差、R方和均方误差进行评估。在医学研究中，分类常用的指标包括准确率、精确率、召回率和 F1 分，这些源于混淆矩阵。ROC
    曲线 [55] 用于导出 AUC、特异性、灵敏度和约登指数。此外，临床影响、DCA 曲线 [24] 和校准曲线被用于评估模型性能。这些标准应用于建模后的验证。


