    尽管每个国家的民族主义水平不同，但许多学者和政治家特别关注中国民族主义，这是因为中国在东亚经济和军事事务中的重要地位，以及对邻国产生的地缘政治影响。Coanders
    和 Scheepers 通过关注 19 世纪的欧洲，揭示了联系民族主义与国家经济条件的机制 [10]。他们将民族主义描述为精英阶层用来说服公众接受工业化社会秩序的工具。首先，民族主义有助于维持当前的社会秩序；其次，它可以对国内经济的短期增长有所贡献。Heilmann
