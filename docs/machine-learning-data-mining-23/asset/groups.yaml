    ## 2.3 模型


    Transformer 架构（Vaswani 等人）是 Google 在 2017 年开发的一种自然语言处理神经网络架构。它在论文《Attention All
    You Need》[3] 中引入，并彻底改变了神经网络训练处理语言处理任务（如自动翻译和文本生成）的方式。Transformer 架构的主要创新是使用了注意力机制（attention），它允许网络在生成输出时同时考虑所有输入单词。这有助于处理许多自然语言处理任务中变长依赖问题。此外，Transformer
    使用了多层注意力头，有助于扩展网络的建模能力。


    BERT（基于 Transformer 的双向编码器表示）[4] 是 Google 在 2018 年开发的一种语言预训练技术。它使用 Transformer
    架构来学习文本语料库中每个单词的双向表示。这意味着与仅考虑单词左侧或右侧上下文的预训练技术不同，BERT 同时考虑左侧和右侧上下文。BERT 在互联网的大量文本上进行了训练，并可以轻松适应各种自然语言处理任务，如文本分类、实体提取和问答。它在许多自然语言处理任务中表现出卓越的结果，并成为许多其他语言的基础。


