    $\sigma$ 是作用应力；$E$ 是弹性模，代表土壤对变形的固有抵抗力；$\epsilon$ 是应变（单位长度的变形）；$n$ 是决定应力-应变行为非线性的因素。对于完全弹性材料，$n
    = 1$。


    - **不确定性处理：** 传统的确定性方法缺乏有效的机制来处理和量化不确定性。忽略这些不确定性可能导致保守的设计或风险的低估 [8]。


    ## 3.3 耗时的实验室和现场测试


    虽然现场勘探和实验室测试是不可缺的，但它们通常耗时且耗资源。结果产生的长时间等待有时会阻碍施工项目的进度，特别是在对快速决策至关重要的环境中 [9]。


    - **成本影响：** 多次测试（特别是在考虑深度变异性或大型场地时）在财务上压力很大。昂贵的设备、人力以及随后的分析增加了支出。表 1 提供了标准岩土工程测试及其相应成本的概述。该表可以列出标准贯入试验
