    主题分析的主要目标是识别新闻主题，结果分别在图 6 和图 7 中展示了美国和中国新闻语料库。这些中的热图代表了处理后每个主题语料库的前 12 个词汇，颜色越深表示这些词汇解释所在行主题的概率越高。尽管在主题模型的无监督学习过程中为每个主题都分配了一个名称，但每个主题中分组的词汇提供了自然的注释。例如，图
    6 所示的美国新闻语料库中的主题 2 对应“贸易战”，这是图 7 所示的中国新闻语料库中的主题 19。


