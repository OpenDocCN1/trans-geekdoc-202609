    # Marco Antonio Aceves-Fernández

    Andries Engelbrecht


    # 机器学习与数据挖掘


    # 2023年度卷册


    # 大规模 MIMO 信道估计中 LMU 与 GRU 的复杂度分析对比


    Hany Helmy, Sherif El Diasty 和 Hazem Shatila


    ## 摘要


    MIMO：多输入多输出通道技术利用多个天线通过反射信号提供信道稳健性和吞吐量增益。它在许多应用中具有优势，例如在小区系统中，用户分布在移动系统等各种应用的宽覆盖区域内，提升了大规模
    MIMO 系统信道状态信息（CSI）的处理效率。本章提出了两种基于信道的深度学习方法——门控循环单元（GRU）和勒格德记忆单元（LMU），以增强大规模 MIMO
    系统的性能，并与以往方法进行了复杂度分析对比。复杂度分析基于与门控循环单元和勒格德记忆单元连接的信道状态网络，指标参数展示了基于文献的技术之间的差异。


    **关键词**：MIMO、FDD、压缩感知、深度学习、传统神经网络、复杂度分析、门控循环单元、勒格德记忆单元


    ## 1 引言


    在深入深度学习领域时，复杂度分析是一个引人入胜的话题，我们经常会遇到具有许多层级和无数参数的复杂模型 [1]。对于模型真正理解其内部机制至关重要。现在，深度学习中的复杂度分析涉及评估这些模型的计算需求和效率。一个常用的指标是时间复杂度，它研究计算成本如何随输入规模的增大而增加
    [2]。它允许我们估计训练和推理任务所需的计算资源。


    另一个需要考虑的方面是空间复杂度，它研究深度学习模型的内存需求。随着层数和参数数量的增加，存储所需的内存也随之增加 [3]。理解这有助于我们优化内存使用，并为神经网络选择合适的硬件。然而，值得提到的是深度学习是一个不断演变的领域，而复杂度分析只是其拼图的一小部分。


    # 机器学习与数据挖掘 2023年度卷册


    总有新的挑战、惊喜和复杂性等待揭示。这是一段持续吸引着科学家和爱好者的者的程。关于深度学习复杂度分析的历史，这确实是一个引人入胜的主题。理解深度学习复杂性的道路充满了胜利与挑战。在早期阶段，当我第一次涉足理论物理领域时，我们仅仅对后来被称为深度学习的领域略有涉猎
    [4]。神经网络的概念已经存在了一段时间，但随着强大的计算能力的出现，真正允许我们探索它们的潜力。随着我们越钻深入，我们开始意识到深度学习模型的复杂度绝非易事。


    参数的数量、错综复杂的相互连接以及这些网络巨大的深度，使其成为了一个迷人的待解解谜题。首要挑战是开发分析和理解这些模型复杂度的方法。我们需要能够帮助我们理解深度学习系统行为、预测其性能并辨别其局限性的工具。随着时间的推移，研究人员开发了各种深度学习复杂度分析方法
    [5]。这些方法从计算参数数量或层数等简单度量方法，到分析网络计算和内存需求等更复杂的技术。此外，在表征训练深度学习模型的计算复杂度方面也取得了进展。时间和资源复杂度的概念对于理解训练过程以及在给定数据集和架构下预测可能需要多长时间至关重要
    [6]。


    ## 2 复杂度分析


    ### 2.1 LMU 和 GRU 的性能与复杂度权衡


    勒格德记忆单元（LMU）在数学上被推导出，用于将其连续时间历史正交化——通过求解 d 个耦合的常微分方程（ODEs），通过勒格德多项式到 d-1 阶将相位空间线性地映射到时间的滑动窗口上。


    门控循环单元（GRU）是循环神经网络（RNN）的一种，在某些情况下具有比长短期记忆（LSTM）的优势（图1）。GRU 使用的内存更少且速度比 LSTM 快，但在使用具有长序列的数据集时，LSTM
    更准确（图2）。


    用于大规模 MIMO 系统 CSI 压缩和重构的 RNN 具有惊人的参数数量。例如，循环神经网络模型可以增加高达 10⁷ 个参数，增加了存储和计算的困难。为了降低计算复杂所需的内存，已开发了一种用于时变信道中信道状态反馈的全连接层自动编码器
    [9]。


    虽然研究调查了循环神经网络 RNN，但这些模型中计算开销最小的每个快照仍需要 10⁷ 个参数。当压缩率较小时，网络性能也会大幅下降，因为它们必须在连续的时间隙中保持相同的压缩率且无法获取信息
    [10]。尽管报道了“堆叠” GRU 的性能，但恢复 CSI 所需的循环层最小深度尚待确定。为了降低计算复杂度，我们寻求开发一种简单但有效的勒格德单元，结合门控循环单元以提高
    CSI 准确性。在时间上，通过开发简单但有效的勒格德单元结合门控循环单元来提高 CSI 准确性。表1 显示了参数数量、浮点运算次数（FLOPs）以及高成本。对比结果显示，我们的架构是大规模
    MIMO 深度应用的一大步。


    大规模 MIMO 信道估计中 LMU 与 GRU 的复杂度分析


