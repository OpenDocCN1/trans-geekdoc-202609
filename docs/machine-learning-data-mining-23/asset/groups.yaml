    # 机器学习与数据挖掘年鉴 2023


    以及所有供应链（SC）成员内部对适当的供应链计划（SC）信息的共享 [2, 15]。


    为了充分理解供应链需求规划和预测的复杂性，必须理解供需关系的核心：库存管理。供应链中的核心商品是库存，也称为存货。Slack 等人 [13] 将库存描述为“转换系统内部资源的累积”。同时，库存规划旨在确保最佳库存水平，在降低缺货风险和过量积货成本的同时，能够高效地响应客户需求
    [13]。


    供应链决策者通过实施适当的库存管理策略并根据预测需求执行补货策略，支持这些目标的实现。


    需求预测的准确性对于支持以下工作至关重要：

    - 数量决策：订购什么物品以及订购数量？

    - 时机决策：何时下达订购订单？

    - 库存分析与控制决策：哪些政策和程序可以提供支持？


    库存决策过程的效率对牛鞭效应有显著影响。牛鞭效应描述了供应链领域内微小波动的后果，这种波动会被放大为订单中的需求波动，从而影响了整个供应链。


    [4] 对牛鞭效应进行了严谨评估，认为牛鞭效应是供应链低下的明显表现。多项研究假设需求规划、交期、批量处理、波动和行为原因之间存在收敛性，这些因素直接导致中断并引发了牛鞭效应。三个主要的供应链决策
    [4, 13, 14] 表明，由于实践不当导致供应链价值异常，增加了供应链的不确定性并导致表现不佳。大数据（BD）可以通过提供价值的见解和改进需求预测来促进供应链管理。研究
    [1, 3] 讨论了2015年至2019年文献的显著增加，使用了包括但不限于神经网络、ARIMA、支持向量机（SVM）和决策树等复杂方法。这些方法解决了传统时间序列技术的缺点，如依赖领域知识以及无法整合外部因素和复杂的非线性关系。它们被认为优于传统方法。大数据的计算效率能够适应日益增长的数据，允许进行更准确的预测和判断。因此，预测准确性的提高减轻了牛鞭现象，反映了可衡量的价值，包括但不限于减少运营成本、风险以及与需求预测相关的财务影响。


    ## 大数据能力与供应链管理的定量分析


    ### 2.3 中小型企业中的大数据分析


    大数据为没有资源投资系统和分析的中小型企业提供了机会，使其能够利用与其规模较大的企业相同的能力。此外，中小企业可以利用大数据来帮助和改进供应链功能，如采购、库存管理、需求规划和预测。


    然而，尽管中小企业行业被公认为至关重要，但许多文献集中于大型机构。[18]的一项研究显示，24%的中小企业认为快速变化的环境是一个关键挑战，且技术相关成本高，影响了减少运营成本和创造竞争优势的战略计划。同样，[19]
    对中小企业领域技术采纳和整合缓慢表示担忧，对于大数据的采用和相关性仍存在许多不确定性。


    ## 3 研究方法论


    ### 3.1 设计


    主要研究目标是通过在中小企业行业应用大数据，将实践知识应用于已识别的研究问题，以减少供应链不确定性并改进需求规划和预测。由于供应链流程和数据的复杂性，本研究采取了务实立场，并在现有理论的基础上建立研究并认为其为有效。随后，研究由演绎法支持，该方法涉及测试系列研究中列出的两个或多个变量之间的因果关系，这是一种广为人知的方法。简单来说，演绎研究从理论流向数据。定量设计的使用增加了研究的可推广性。采用单案例研究策略以结构化的方式指导了必要的研究行动，并促进了整个研究项目的连贯性。研究的描述性和解释性允许对大数据在改进需求规划和预测中的作用产生更深入的见解，这需要一种纵向设计来探索零售店消费者需求与供应之间的关系。


    ### 3.2 技术与程序


    研究的大数据部分利用了 CRISP-DM框架 [21]。CRISP-DM 是一项跨行业标准，开发于1996年用于数据挖掘。今天，该方法仍然有效并成功应用于大数据和数据科学领域
    [22]。通过对业务理解的强调以及与业务目标的一致性，若干活动将数据转化为可操作的见解，以更好地理解研究问题。所选分析类型由研究驱动，即描述性、诊断性和预测性分析。描述性分析是在双变量水平上进行的，以探索变量之间的关系并确定一个变量对其他变量的影响。。关系的理解可以通过相关性分析和交叉表来实现。需要注意的是，双变量分析衡量关系，引起相互变化的影响，并暗示了因果关系
    [20]。


    在整个研究过程中，采用了广泛使用的 Pearson 相关性方法来理解分析单元线性关系的强度和显著性 [23]。Pearson 相关性的一个缺点是要求数据呈良好分布，因为它是一种参数方法。因此，为了进一步支持初始相关性发现，部署了
    Kendall tau_b 和 Spearman 秩 (rho) 等非参数方法来实现相关性综合。此外，考虑到稀疏数据的慢移动非食品产品的性质，对相关性评分进行调整是必要的
    [24]。因此，任何 Pearson 和 Spearman (rho) 相关性大于0的变量均被认为是合理的关联。


    探索了一系列机器学习技术，即多元线性回归和回归树（即主成分分析 PCA），以追求进一步的深度分析并解决本研究的诊断性质。正如 James [23] 所述，回归分析应用各种统计过程来理解因变量和自变量之间关系的性质。因此，使用回归分析进一步分析供应商-零售商和零售商-消费者之间的需求以及牛鞭现象。回归方程估计了关系并识别了影响牛鞭威胁的重要因素。此外，多变量回归允许模型中包含多个自变量，每个变量对因变量的变化都有累加贡献
    [25]。然而，回归方法的一个已知局限性是对高度相关的自变量的敏感，即共线性。因此，共线性引入了冗余，影响了变量的统计显著性并降低了估计模型系数的精度 [26]。已经提出可以使用主成分分析
    (PCA) 等技术来利用共性的解决方案。根据 James 等人 [25]，PCA 比较变量之间的共同变异，并生成一系列不相关的线性组合或索引（称为成分），这些成分共同解释了数据集中大部分变异。此外，通过可用的
    PCA 假设可以减少已知的回归局限，如过拟合。


