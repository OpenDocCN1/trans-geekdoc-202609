    # 大数据分析能力与供应链管理的量化分析


    Janine Zitanellis


    # 摘要


    随着大数据技术（BDT）的出现和大数据分析（BDA）应用的日益广泛，供应链管理（SCM）研究人员越来越多地利用 BDA，因为 BDT 和 BDA 提供了许多机遇。供应链（SC）数据具有内在复杂性，导致环境具有高度不确定性，为供应链决策者带来了严峻挑战。本研究旨在调查并说明
    BDA 在现有决策过程中的应用。BDT 允许对供应链数据进行提取和处理。BDA 有助于进一步理解供应链的低效率问题，并通过验证供应链牛鞭效应及其影响因素的存在，提供了极具价值且可操作的见解。此外，BDA
    通过应用主成分分析（PCA）和多元回归分析等机器学习技术，实现了对线性和非线性回归关系的务实评估。此外，应用 Sarimax、Stats 和神经网络等更复杂的
    BDA 时间序列和预测技术提升了预测的准确性。最终，改进后的的需求规划和预测准确性将减少供应链的不确定性以及所观测牛鞭效应的影响，为供应链价值链中的所有成员创造竞争优势。


    **关键词：** 大数据分析，供应链管理，牛鞭效应，主成分分析，回归分析，需求规划与预测


    # 1. 引言


    BDA 为采购、库存管理以及需求规划与预测等关键供应链组件之间精确且透明的信息流提供了机会，促进了供应链的整合与协作，从而提升了整体供应链效率 [1, 2]。


    供应链管理最终试图以最具成本效益的方式匹配不同的供需率。正如人们想象的，由于市场全球化和供应链数字化倡议等因素的驱动，各种供应链渠道和数据节点导致通过供应链网络内多个组织之间的材料和信息流变得日益复杂
    [3]。供应链的低效率将显现出来，并导致了经过仔细研究的牛鞭效应 [4]。


    《机器学习与数据挖掘年刊》2023 卷


    本研究通过单案例研究，批判性地评估了 BDA 能力与供应链效之间的之间的关系。因此，本研究的主要关注点是调查并说明 BDA 在现有决策过程中的应用，以克服供应链信息流中的技术限制和挑战，并获得对当前市场环境的有价值的见解。本研究旨在更好地理解并衡量门店销售与库存持有之间的互动，作为辅助需求规划与预测的动态市场指标。以下研究问题针对特定的供应链问题，例如减少运营成本、风险以及与需求预测效率低下和错失机会相关的财务影响：


    尽管对中小企业（SMEs）中应用 BDA 的研究显而易见，但只有少数案例研究能够说明反映可衡量业务价值的 BDA 应用，例如运营成本、风险以及与需求预测效率低下和错失市场机会相关的财务影响的减少。因此，本项目旨在通过对中小企业行业单一组织的研究，应用各种
    BDA 技术，增加供应链协作与沟通，并最终提高供应链效率，从而推进相关领域的实践知识。


    # 2. 中小企业行业的大数据、分析与供应链管理


    ## 2.1 大数据与分析


    1941 年，“信息爆炸”一词出现后，在 1944 年至 2000 年间发表了若干出版物，反映了数据和信息的规模及预期增长率。“大数据”一词的真正起源尚不清楚。虽然许多人认为该术直到
    2005 年才由 Roger John Mougalas 和 O''Reilly 媒体集团正式提出 [5]，将大数据描述为无法通过传统的业务流程和分析工具进行处理或消费的数据集
    [6]。作为领先的研究和咨询公司，Gartner 通过整合大数据的关键特征扩展了定义，将大数据描述为：“……高容量、高速度和/或高特异性的信息资产，需要具有成本效益、创新的信息处理形式，以增强洞察力、决策和过程形成”
    [7]。若干研究报告了大数据的特征，通常被描述为大数据的 Vs 或数据维度。即：数量（Volume）、多样性（Variety）、价值（Value）和真实性（Veracity）[8–10]。数量和多样性描述了数据的大小、程度和格式。同时，价值、速度和真实性总结了数据实时处理的程度以及对数据质量的信任度。近年来，大数据
    Vs 有几种扩展，包括增加变异性（Variability）。变异性考虑数据结构的变化，更重要的是这些数据结构变化的节奏、频率和程度。在高水平数据真实性的支持下，理解数据的变异性可以对资源和过程进行高效规划，以确保对组织决策过程的干扰降至最低。


    大数据分析（简称 BDA）提供了可扩展且具有成本效益的机会来处理和整合不同的数据结构，能够从海量结构化和非结构化数据中提取有价值的见解。Kitch [11]
    研究了 BDA 对既有方法的影响，以及大数据如何作为一种颠覆性创新同时允许更高效的分析方法出现。技术技能对于从这些数据中提取信息和见解至关重要。这些分析工作还依赖于清晰的业务描述以及领域专家对结果的评估。


    所获得的见解使组织能够应对快速变化的环境，并在战术和战略层面保持竞争优势 [1, 9]。9] 的一项实证研究认为，组织需要重构以应对 BDA 交付的见解并产生可操作的见解，以从
    BDA 项目中获得最佳价值。作者观察到，尽管挪威的组织在采用技术和信息进步方面取得了进展，但只有少数观察到了 BDA 投资的完整收益。惊讶的是，该研究报告在考虑到过去十年
    BDA 趋势增加的情况下，拥有超过4 年 BDA 经验的公司仅占 10.8%。1] 的研究发现表明，组织仍然缺乏使 BDA 成为战略驱动力所需的能力。该研究强调，组织内部
    BDA 项目的成功取决于复合因素：时间和财务资源的分配、支持性的 BDA 基础设施以及对数据驱动文化的领导承诺。


    ## 2.2 供应链管理中的大数据分析


    BDA 为采购和库存管理等关键要素之间精确且透明的信息流提供了机会，鼓励了供应链的整合与协作 [1, 2]。此外，BDA 的通信效率应对了由倡议驱动的日益复杂的供应链数据
    [3]。因此，BDA 允许进行更准确的需求规划和预测，支撑供应链库存管理决策，以提高整体供应链效率。


