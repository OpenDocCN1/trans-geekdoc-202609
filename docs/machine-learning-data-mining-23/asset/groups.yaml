    # 大数据分析能力与供应链管理的定量分析 ITexLL1147


    附录 E 成立 [27]。最后，研究的预测性质在 RStudio 统计分析中部署了多种时间序列和预测技术。结果在 Tableau 工具中进行了可视化。


    ## 3.3 伦理考量


    B2B 背景下的数据保护和伦理考量主要关注对零售商数据存储和使用政策及程序的遵守。对 B2B 门户数据和门店运营进行安全处理并控制访问权限至关重要，将任何敏感零售商信息视为“个人”。此外，根据《通用数据保护条例》（GDPR）框架
    [28]，对 B2B 数据也考虑了相同的原则和知情同意。提取的数据以 CSV 格式存储在指定的 Google Drive 上用于收集和分析。执行了必要的程序和活动对数据进行匿名化处理。


    ## 4. 案例研究：南非慢消消费品中小企业供应商


    南非中小企业 Zeus Africa 在南非玩具行业中作为聚乙乙烯（HDPE）玩具玩具自行车制造商进行竞争。行业专家 [29] 将该行业评为一个具有挑战性但前景广阔的市场。因此，利用创新技术能力来提高需求规划和预测准确性并支持决策，对于该组织在当前市场下的生存和竞争优势至关重要。一个关键考虑是信息流，以及所选组织将其
    B2B 数据和观测数据整合到现有决策过程中的，以获得价值贵的消费者洞察并减少供应不确定性。


    ## 4.1 数据描述


    案例研究涉及识别问题及其相关目标和假设。生成所需信息的关键来源如下：


    ### 4.1.1 内部主要定量财务数据


    从组织主要财务系统提取的数据包括从 2018 年 8 月到 2021 年 10 月的 3 多年的销售订单。数据包括交付给单一零售商的七个独特 SKU 的交易级每日订单。


    ### 4.1.2 内部次定量 B2B 数据


    从组织 B2B 门户提取的数据包括从 2018 年 8 月到 2021 年 10 月的实体店每周聚合销售和库存持有数据。


    机器学习与数据挖掘年度报告 2023


    ### 4.1.3 包含供应商销售订单、门店销售及库存数据的集成数据


    分析由额外的集成数据集支持，命名为“B2B 补货”，包含供应商销售订单和门店级库存数据。该数据集按门店和 SKU ID 进行聚合。


    这些数据用于理解供应商-零售商与零售商-消费者需求与库存水平之间的关系。假设销售水平对库存持有敏感，本研究的分析单位是零售实体店中这些组件之间的关系，考虑了以下需求场景：


    - 供应商-零售销售订单，以充分满足零售商-消费者需求。

    - 有货时的零售商-消费者需求。

    - 缺货或无货时的零售商-消费者需求。


    这些单位有助于理解随时间推移消费者需求相对于需求规划的历史模式和趋势。此外，通过衡量库存供应对需求的影响以及对上游供应链需求的整体影响，来理解供应链的不确定性。此外，探索供应商-零售商与零售商-消费者需求之间的差异证明了牛鞭效应的存在。


    ## 4.2 描述性分析与讨论


    描述性分析通过应用双变量技术识别出关键 SKU，并在供应商-零售商和零售商-消费者需求差异之间建立了充分证据，表明存在牛鞭效应。


    ### 4.2.1 牛鞭效应的证据


    分析考虑了供应商销售订单数量、门店补货和销售数量需求的 SD 值作为分析单位，以验证牛鞭效应的存在。观察到库存补货和销售需求中销售订单数量的 SD 较高。因此，表明供应商-零售商需求的差异高于零售商-消费者需求。随后，通过采用
    [4] 使用的指标推导出牛鞭系数。通过衡量供应商销售订单数量与门店补货之间的方差比（公式 1），确定了供应商-零售需求的牛鞭效应。


    Zeus Africa 供应商牛鞭系数：


    ```

    Supplierbullwhhipratio = std.dev(SalesOrderQuantity) / std.dev(Replenishment(StockIn))
    (1)

    ```


    通过衡量门店补货与销售数量需求之间的方差比（公式 2），确定了零售商-消费者需求的牛鞭效应。


    # 大数据分析能力与供应链管理的定量分析 IToxLi111473


    Zeus Africa 牛鞭系数：


    ```

    Retailerbullwhipratio = sku std.dev(Replenishment(StockIn)) / std.dev(SalesQtyDemand)

    ```


    牛鞭系数的解释相对简单。牛鞭系数为一表示需求与供应之间的差异相等。因此，上游供应链需求的放大是显而易见的。相反，牛鞭系数小于一表示供应的波动性小于需求。结论是，牛鞭系数大于一表示需求波动性放大。图
    1 表示了每个 SKU 的供应商-零售需求和零售商-消费者需求的牛鞭系数。


    对图 1 中供应商-零售需求的检查显示，除 SKU ID BZ030 外，所有 SKU 均有需求放大的充分证据，这很大程度上由于进入市场的时间较短，表明消费者需求差异转化为放大的销售订单数量差异。描述性分析得了验证牛鞭效应的充分证据。


    ## 4.3 诊断性分析与讨论


