    ## 用于政治风险管理的人工智能技术：对2019年中美贸易战的NLP分析


    Michael D. Wang


    ## 摘要


    本章探讨了人工智能（AI）技术在自然语言处理（NLP）风险管理中的应用，特别关注政治经济学领域的应用。本分析旨在通过对报纸和社交媒体进行文本分析，并将情感得分作为民族主义的指标，来识别和衡量潜在的政治风险。研究以2019年中美贸易战作为一个自然实验，评估国际争端对政治风险的影响。一个重要发现是，贸易战对中国对美情绪产生了积极影响，这归因于中国政府为缓解贸易战对国际关系的负面影响所做的努力。研究还揭示了冲突对双进口的负面影响。此外，研究采用双重差分模型（DID）调查了贸易战期间新闻审查对媒体的影响。发现中国监管机构试图软化国内的反美情绪，而美国媒体在冲突期间对中国的报道则更为负面。总体而言，这项分析证明了如何通过分析新闻和其他媒体，有效利用NLP技术来识别政治风险管理的变化。


    关键词：国际冲突、民族主义、国际贸易、国际政治经济学、文本分析


    ## 引言


    McCombs和Shaw首次提出了媒体的议程设置功能，该功能描述了媒体如何被用来影响接收者的政治立场 [1]。由于报纸是人们日常生活中信息的主要来源，McCombs和Shaw提出，媒体在影响公民注意力甚至塑造他们对新闻话题的观点方面发挥着关键作用
    [2]。几十年来，一些学者认为中国当局利用政府控制的媒体通过塑造舆论来维持现状 [3, 4]。


    ## 2023年机器学习与数据挖掘年刊


    McCombs和Shaw通过研究美国1968年总统大选发展了议程设置理论，美国是一个媒体自由度较高的国家。媒体通过诉诸人们的情感来设定议程 [1]。例如，2020年新冠肺炎爆发引发了全球健康危机。许多中国和其他地区的人们遭受了疫情灾难。2020年3月3日，《华尔街日报》发表了一篇题为“中国是亚洲真正的病夫”的文章，我们可以很容易地从这种叙述中感知到对中国的负面和种族主义情绪
    [5]。新闻情感是媒体对所报道主题的立场，可能由作者设定或受受读者的喜好驱动。当特定的新闻情感通过传统的本地媒体传播时，我们可以推断出，大多数相对独立的媒体正试图取悦某个公众人物，或者当局正在为大众媒体设定议程。


    媒体与民族主义之间的联系在多部作品中讨论过。Eriksen声称媒体和互联网促进了国家和民族之间的民族中心主义倾向 [6]。Hyun等人指出，媒体中的用户生成内容可能促进民族主义行为
    [7]。为了弄清媒体对民族主义的因果效应，情感可以作为一个中间变量。一个例子是目前中国的反日情绪。Zhou和Wang建议政治宣传对对日本的情绪有显著影响 [8]。对于这个例子，政治宣传是出现在公共平台上最早的文本数据。这些带有某些元素的文本数据导致了读者中的负面情绪，并最终导致了中国的反日政治行动。当今的反日活动是中国民族主义的一个群体，而由政治宣传作为中间变量驱动的负面情绪为研究人员量化民族主义的质量提供了渠道。


    民族主义是政治学家的因果研究课题。大量研究关注民族主义产生的原因及其对冲突或民主等问题的政治影响 [9–13]。然而，关于美国民族主义的定量研究相对较少。本研究旨在通过将2019年贸易战分析为一个自然实验来弥补这一空白。通过研究媒体如何影响美国的民族主义，我们可以理解冲突期间中国新闻审查的作用。结果显示，中国监管机构试图软化国内的反美情绪，而美国媒体在冲突期间对中国的报道则更为负面。这项分析为数字时代的政治风险管理提供了新的视角。


