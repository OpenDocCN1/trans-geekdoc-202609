    # 缩写词


    - AI 人工智能

    - CCP 中国共产党

    - CPU 中国政治政治不确定性

    - DID 双重差分法

    - LDA 隐含狄利克雷概率分配

    - NLP 自然语言处理


    ## 话题选择


    在主要分析中，我为美国新闻语料库选择了 850 个主题，并为中国新闻语料库选择了 550 个主题。为了确定我们的模型选择是否合适，我测试了不同隐含主题数量
    $K$ 下主题模型的拟合优度。首先，我随机选择了 20% 的文档子集进行测试，并使用剩余文档作为训练数据，对 $K$ 在 50 到 1000 之间的 LDA
    模型进行拟合。我使用测试数据计算模型的验证困惑度（validation perplexity）作为拟合优度的衡量标准。困惑度表示模型描述一组文章的优程度，图
