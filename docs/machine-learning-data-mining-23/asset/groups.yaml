    # 基于 Transformer 模型的巴西葡萄牙语乳腺磁共振医学记录自动 BI-RADS 分类


    Ricardo de Oliveira, Bruno Menezes, Júnia Ortiz 和 Erick Nascimento


    ## 摘要


    本章旨在通过深度学习和自然语言处理（NLP），根据乳腺影像报告和数据系统（BI-RADS）分类，对临床报告进行词法、句法和语义分析，提出一种乳腺磁共振成像文本记录的分类模型。该模型是基于预训练的
    BERTimbau 模型（在巴西葡萄牙语中训练的 BERT，基于 Transformer 的双向编码表示）的迁移学习开发的。数据集由巴西葡萄牙语的医学报告组成，分为六类：不确定；正常或接近正常；良性发现；可能良性发现；可疑发现；高癌症风险；既往恶性病变。本文实现并比较了以下模型：随机森林、SVM、朴素贝叶斯、以及微调和未微调的
    BERTimbau。BERTimbau 模型结果更好，且在微调后性能更优。


    **关键词：** BI-RADS，深度学习，Transformers，BERTimbau，葡萄牙语 NLP


    ## 引言


    医疗保健部门的特点是大型数据催化剂，包含医学记录、报告、测试结果等。对于文本医学记录，对整合到医学文档中的非结构化部分进行正确分类，可以帮助医疗专业人员有效高效地管理相关数据，组织与患者及其诊断检查结果相关的数据。


    本工作介绍了一种基于文档词法、句法和语义分析的 BI-RADS [1] 分类系统，源自《2023年机器学习与数据挖掘年度卷》中的文本内容，利用深度学习和 NLP（自然语言处理）。主要目标是验证
    BERTimbau 模型 [2] 在乳腺磁共振临床记录 BI-RADS 分类中的性能。还使用了机器学习模型分类 BI-RADS 以建立基准。实现并比较了以下模型：随机森林、SVM、朴素贝叶斯、以及调优和未调的
    BERTimbau。


    将包含 8813 条医学文本的数据集提交给深度学习后，创建了一个基于现有规则的新专家模型，使用受监督机器学习方法对乳腺 MRI 报告进行自动 BI-RADS
    类别分类。该模型不仅能够将与乳腺 MRI 相关的医学文本分类到相应的 BI-RADS，还能根据既有统计数据提供有关医学记录质量的反馈。


    ## 2. 材料与方法


    ### 2.1 BI-RADS


    BI-RADS [1] 是乳腺影像报告和数据系统（Breast Imaging-Reporting and Data System）的缩写，最初设计用于乳腺癌检查的质量保证工具。许多医疗保健小组的协作成果由美国放射学学院（ACR）出版并版权。该系统旨在标准化临床报告，供医疗专业人员用于沟通乳腺癌风险。以下是放射学学院描述的六类分类：


    ### 2.1.1 BI-RADS 0 - 不确定


    当放射医生将结果分类为 BI-RADS 0 [1] 时，意味着检查不确定或不完整。原因包括技术因素，如图像质量差或患者移动。


    ### 2.1.2 BI-RADS 1 - 正常或接近正常


    当放射医生将结果分类为 BI-RADS 1 [1] 时，意味着没有异常。乳腺完全正常，没有肿块、结构扭曲或可疑钙化。


    ### 2.1.3 BI-RADS 2 - 良性发现


    当放射医生将结果分类为 BI-RADS 2 [1] 时，意味着发现了某些异常，但肯定是良性的。如果医生有轻微疑虑，则分类为3。


    ### 2.1.4 BI-RADS 3 - 可能良性发现


    当放射医生将结果分类为 BI-RADS 3 [1] 时，意味着发现了某些异常，可能是良性的，但并非 100% 安全。因此，类别 3 表示恶性风险极低，但在未来
    2 年内应密切观察。


    ### 2.1.5 BI-RADS 4 - 可疑发现


    当放射医生将结果分类为 BI-RADS 4 [1] 时，意味着发现了某些异常，可能是癌症，但并非必然。所有 BI-RADS 4 结果的患者都应接受活检以确定诊断。类别
    4 通常根据癌症风险分为三个子类：


    - BI-RADS 4A - 低恶性怀疑（2% 至 10% 的癌症风险）

    - BI-RADS 4B - 中等度恶性怀疑（11% 至 50% 的癌症风险）

    - BI-RADS 4C - 高恶性怀疑（51% 至 95% 的癌症风险）


    无论何种 BI-RADS 4 子类，所有病例都进行活检。区别在于，对于 BI-RADS 4A 患者，活检预计证实良性病变；而对于 BI-RADS 4C 患者，活检预计证实癌症诊断。


    ### 2.1.6 BI-RADS 5 - 高癌症风险


    当放射医生将结果分类为 BI-RADS 5 [1] 时，意味着发现了某些异常，极可能来源于乳腺癌。具有典型癌症特征的乳腺病变包括毛刺状结节、多形钙化、皮肤回缩或乳腺结构扭曲，以及线性钙化。因此，所有类别
    5 的病变都应活检，BI-RADS 5 分类的恶性风险大于 95%。


    ### 2.1.7 BI-RADS 6 - 既往已知恶性病变


    BI-RADS 6 分类 [1] 仅用于已确诊乳腺癌并接受诊断性检查的患者。'
