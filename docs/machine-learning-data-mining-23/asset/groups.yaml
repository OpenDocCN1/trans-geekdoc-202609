    # 大规模 MIMO 信道估计中 LMU 与 GRU 的复杂度分析


    本文展示了所提 LMU-GRUs 与各种先进 CSI 反馈系统的复杂度对比，其中参数数量和 MAC 分别代表空间和时间复杂度 [14]。与 CsiNet 相比，我们的框架在考虑
    CSI 恢复质量的同时增加了更少的参数，如表 2所示。


    卷积层是 MAC 增加的主要原因。当压缩率（CR）较低时，卷积层的计算量大于密集层。LMU-GRUs 的模型参数和 MAC 远低于 CsiNet 和 Conv-LSTM-CsiNet，后者由于
    GRU 单元中的密集层，以巨大的空间时间复杂度提高了重建精度 [5]。


    每个网络连接单个时隙平均浮点操作数（FLOPs）见表 3。在每个比较比例下，与 Conv-LSTM-CsiNet 相比，CsiNet-GRU 和 LMU-GRUs
    分别可以节省超过 (8/9) 和 (9/10) 的 FLOPs。即使在低压缩率下，Conv-LSTM-CsiNet 的计算量也没有显著减少 [16]。


    在不损失性能的情况下，我们证明了潜卷积层所需的参数比 FC 层少。表 3 比较了 CsiNet、Conv-LSTM-CsiNet、CsiNet-GRU 和
    LMU-GRUs 的模型大小和计算复杂度。


    在所有压缩率下，LMU-GRUs 使用的参数比 Conv-LSTM-CsiNet 少 60 倍。最关键，LMU-GRUs 使用 Conv-LSTM-CsiNet
    所参数量的 1/3000 实现了更高的 CSI 恢复精度。例如，16 倍的减少（比例从 1/4 到 1/64）仅节省了 1% 的 FLOPs。另一方面，CsiNet-GRU
    和 CsiNet-LMU-GRUs 在较低比例下的计算复杂度显著降低。


    例如，16 倍的减少（比例从 1/4 到 1/64）使 CsiNet-GRU 和 LMU-GRUs 的 FLOPs 分别减少了 9% 和 2%。


    将 CsiNet-GRU 和 LMU-GRUs 作为 UE 端的协作学习方法，我们发现训练阶段需要多出 50% 的参数和 FLOPs。这是因为训练好的解码器必须在
    UE 端准备好，以便解码编码器上时隙的 CSI。


    | | CsiNet [12] | Conv-LSTM CsiNet [13] | CsiNet-GRU [7] | LMU-GRUs |

    |---|---|---|---|---|---|

    | Params | 1/4 | 2.1 M | 2.1 M | 132.7 M | 2.1 M |

    | | 1/16 | 1.0 M | 542.9 K | 118.5 M | 1.0 M |

    | | 1/32 | 530.6 K | 280.7 K | 116.1 M | 535.7 K |

    | | 1/64 | 268.4 K | 149.6 K | 115.0 M | 273.3 K |

    | FLOPs | 1/4 | 412.9 M | 44.5 M | 42.2 M | 39.2 M |

    | | 1/16 | 409.8 M | 41.3 M | 40.5 M | 39.3 M |

    | | 1/32 | 409.2 M | 40.8 M | 40.4 M | 40.1 M |

    | | 1/64 | 409.0 M | 40.5 M | 40.3 M | 40.0 M |


    表 3. 测试网络模型大小和计算复杂度。


    2023年机器学习与数据挖掘年度会议报


    **表 3** 总结了参数数量和浮点操作数（FLOPs），以展示所提模型规模缩小的影响。这比较了在 CSI 压缩模块和相关的解压模块中使用 FC 层与建议的
    CNN 层的存储空间和计算难度。


    如表 3 所示，所提的 LMU-GRUs 压缩和解压模块将参数减少了 100 倍以上，FLOPs 减少了至少 4 倍 [17]。比较结果表明，我们用于 CSI
    压缩的新 LMU-GRUs 架构在扩展大规模 MIMO 无线系统中基于深度的 CSI 编码、反馈和重建的应用范围方面迈出了重要一步。


    ## 4. 结论


    本章通过扩展基于深度的 CSINet 技术，引入了 GRU 和 GRU 层上的 LMU，提出了一种信道状态信息（CSI）反馈网络。所提的 LMU-GRUs
    技术与其它基于 CS 和基于 CSI 方法相比，实现了更少的参数和 MAC。这项工作的动机是对于使用信道状态网络进行测试的循环卷积神经网络（RCNN）模型大小和计算复杂度的积极应用。基本概念是控制深度学习技术中的复杂度，以获得与时变
    MIMO 信道相关的结果。


    ## 5. 未来工作建议


    量子辅助深度学习（QDL）正引起增强通信网络性能指标的极大关注。经典深度学习面临各种挑战；其中为复杂的神经网络（NNs）拓扑结构确定训练方法是一个巨大的挑战。


    ## 致谢


    首先，感谢所有人让我完成了这项工作。非常感谢 Sherif El 博士，阿拉伯科学技术与海事学院（AAST）电子与通信系教授，感谢他对这项工作的卓越合作和专家帮助。感谢
    Hazem Shatila 教授，弗吉尼亚理工立大学人工智能系教授，感谢他的宝贵时间和持续鼓励。


