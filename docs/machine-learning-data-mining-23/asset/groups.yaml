    # 3.5 Difficulty in real-time monitoring and prediction


    While traditional methods excel in pre-construction assessments, real-time monitoring
    during and post-construction can be challenging. Continuous monitoring setups,
    if established, often demand significant resources, and might not be adept at
    predicting unforeseen failures swiftly [11].


    # 3.6 Empirical nature of traditional models


    A significant portion of traditional geotechnical engineering models are empirically
    derived. These models, developed from observed behavior in specific conditions,
    might not universally apply across varied geographies or under different circumstances
    [12]. While they offer a starting point, relying on empirical models might lead
    to potential inaccuracies.


    +   - Regional limits: Many empirical models were derived from studies in specific
    regions, reflecting the local geology and environmental conditions. Applying these
    models to regions with different geological histories or climates might introduce
    errors. For instance, a model developed in the temperate climates of Europe might
    not necessarily seem applicable to the tropical regions of Southeast Asia.


    +   - Aging of empirical data: As our understanding of geotechnical behavior advances
    and technological tools become more sophisticated, older models might become outdated.
    These models, while still valuable, might not capture the nuances that research
    and technology have unveiled.


    # 3.7 Challenges in large-scale integration


    Geotechnical risk assessment needs to be integrated with other domains, such as
    structural engineering, hydrology, and environmental science. Traditional methods,
    often siloed, can sometimes face challenges in this multi-disciplinary integration
    [13]. Addressing a problem from a purely geotechnical standpoint might overlook
    interactions and feedback loops from other domains, leading to potential miscalculations.


    +   - Data compatibility issues: When interfacing with other domains, data compatibility
    becomes a challenge. Different fields use varying metrics, scales, or data formats.
    Manually harmonizing this data is not only timeconsuming but also prone to errors.


    +   - Complexity in multi-disciplinary communication: Effective risk assessment
    in large projects requires seamless communication between different teams. Traditional
    methods, with their unique terminologies and approaches, may pose barriers in
    multi-disciplinary communication, leading to potential misunderstandings or oversights.


    # 3.8 Environmental and ethical considerations


    With increasing emphasis on sustainable and ethical engineering practices, traditional
    geotechnical methods face scrutiny. Some methods might involve intrusive site'
  - '[PAGE 78]


    # Machine Learning and Data Mining Annual Volume 2023


    investigations, which can disturb local ecosystems or even local communities.
    There''s an increasing need for methods that are not technically sound but also
    environmentally friendly and socially responsible [14].


    +   * **Sustainability concerns**: Traditional risk assessment might not always
    factor in long-term environmental implications. For example, certain foundation
    techniques might alter local groundwater flow, leading to unintended environmental
    consequences in the future.


    +   * **Ethical implications**: Intrusive site investigations or large-scale excavations
    might disrupt local communities, either by displacing them or affecting their
    local environment. Traditional methods need to evolve to ensure that geotechnical
    work respects both the physical and socio-cultural landscapes.


    # 4. Machine learning: a paradigm shift in geotechnical risk assessment


    In the last two decades, the realms of data analytics and computational power
    have grown exponentially, transcending across a myriad of disciplines. One beneficiary
    is the field of geotechnical engineering, which has always grappled with uncertainties
    inherent to its subject matter: the earths. The incorporation of ML techniques
    is not just as an enhancement, but a potential game-changer in deciphering the
    cryptic terrains and soils below few [15].


    Table 2 offers a side-by-side comparison of traditional risk assessment methods
    with their ML counterparts. By analyzing their features, benefits, and limits,
    the table provides a holistic view of how the two approaches fare in various factors
    of risk evaluation. Notably, ML often presents advantages in data processing speeds
    and predictive accuracy. However, they require vast datasets for optimal functionality.
    In contrast, traditional methods, while more time-intensive, are backed by tried-and-tested
    theories and methodologies.


    | ML technique | Application in geotechnical engineering | Advantages | Limitations
    |

    |---|---|---|--|

    | Supervised learning | Soil classification, foundation prediction | Direct mapping
    of input-output relations | Requires labeled data |

    | Unsupervised learning | Anomaly detection, soil clustering | Data exploration
    without predefined labels | Might miss hidden patterns |

    | Reinforcement learning | Real-time site adjustments, equipment optimization
    | Dynamic decision making in uncertain environments | Needs simulation or trial
    environment |

    | deep learning (neural nets) | Complex soil behavior modeling, image recognition
    | Can model intricate patterns and relationships | Requires large datasets, can
    be opaque |

    | Transfer learning | Quick adaptation to new sites | Uses knowledge from previous
    models/tasks | Might not always transfer effectively |

    | Federated learning | Distributed data training while maintaining privacy | Data
    privacy and localized training | Might be slower than centralized training


