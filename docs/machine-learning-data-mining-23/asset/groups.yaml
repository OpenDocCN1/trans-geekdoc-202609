    # Complexity Analysis in Channel Estimation Massive MIMO Compared with LMU and
    GRU


    This shows the complexity analysis of the proposed LMU-GRUs in comparison to various
    state-of-the-art CSI feedback systems, where the number of parameters and MAC
    stand for space and temporal complexity, respectively [14]. When compared to CsiNet,
    our frameworks add fewer parameters while considering CSI recovery quality, as
    seen in Table 2.


    Convolution layers are mainly responsible for the increase in MACs. When CR is
    low, convolutional layers require more computation than dense layers. LMU-GRUs
    have much lower model parameters and MACs as CsiNet and Conv-LSTM-CsiNet, which
    improve reconstruction accuracy at the expense of huge space and temporal complexity
    due to the dense layers in GRU cells [5].


    Each network''s average number of floating-point operations (FLOPs) connected
    with a single timeslot is also shown in Table 3. When compared to the Conv-LSTM-CsiNet
    in each comparison ratio, CsiNet-GRU, and LMU-GRUs can save more than (8/9) and
    (9/10) FLOPs, respectively. Even at low compression ratios, the computation for
    Conv-LSTM-CsiNet does not decrease considerably [16].


    Without loss of performance, we show that latent convolutional layers require
    fewer parameters than FC layers. Table 3 compares the model size and computational
    complexity of CsiNet, Conv-LSTM-CsiNet, CsiNet-GRU, and LMU-GRUs.


    LMU-GRUs use 60 times fewer parameters than Conv-LSTM-CsiNet across all compression
    ratios. Most crucially, LMU-GRUs achieve greater CSI recovery accuracy using 1/3000
    of the number of parameters required by Conv-LSTM-CsiNet. A 16-fold reduction
    (ratio from 1/4 to 1/64), for example, save only 1% of FLOPs. CsiNet-GRU and CsiNet-LMU-GRUs,
    on the other hand, require significantly less computing complexity in lower ratios.


    A 16-fold reduction (ratio from 1/4 to 1/64), for example, reduces the number
    of FLOPs in CsiNet-GRU and LMU-GRUs by 9 and 2%, respectively.


    Using CsiNet-GRU and LMU-GRUs as a cooperative learning method at UE, we found
    that 50 percent more parameters and FLOPs are required during the training phase.
    This is because the trained decoder must be prepared on the UE side to decode
    CSI for the encoder''s previous time slot.


    | | CsiNet [12] | Conv-LSTM CsiNet [13] | CsiNet-GRU [7] | LMU-GRUs |

    |---|---|---|---|---|---|

    | Params | 1/4 | 2.1 M | 2.1 M | 132.7 M | 2.1 M |

    | | 1/16 | 1.0 M | 542.9 K | 118.5 M | 1.0 M |

    | | 1/32 | 530.6 K | 280.7 K | 116.1 M | 535.7 K |

    | | 1/64 | 268.4 K | 149.6 K | 115.0 M | 273.3 K |

    | FLOPs | 1/4 | 412.9 M | 44.5 M | 42.2 M | 39.2 M |

    | | 1/16 | 409.8 M | 41.3 M | 40.5 M | 39.3 M |

    | | 1/32 | 409.2 M | 40.8 M | 40.4 M | 40.1 M |

    | | 1/64 | 409.0 M | 40.5 M | 40.3 M | 40.0 M |


    Table 3. Model size and computational complexity of tested networks.


    Machine Learning and Data Mining Annual 2023


    **Table 3** summarizes the number of parameters and floating-point operations
    (FLOPs) to show the impact of the proposed model size reduction. This compares
    the storage space and computational difficulty of using the FC layer against the
    suggested CNN layer in the CSI compression module and the related decompression
    module.


    The proposed LMU-GRUs compression and decompression module, as shown in Table
    3, reduces the number of parameters by over 100 times and the number of FLOPs
    by at least 4 times [17]. The comparison results show that our new LMU-GRUs architecture
    for CSI compression is a significant step forward in expanding the range of practical
    applications for deep learning-based CSI encoding, feedback, and reconstruction
    in massive MIMO wireless systems.


    ## 4. Conclusion


    This chapter presents a channel state information (CSI) feedback network by extending
    the DL-based CSINet technique to incorporate GRUs and LMU over GRU layers. The
    proposed LMU-GRUs technique achieved the number of parameters and MACs compared
    to other CS-based and CSI-based methods. The work is motivated by the active use
    of recurrent convolutional neural network (RCNN) model size and computational
    complexity of tested networks using a channel state information network. The basic
    concept is to control the complexity in deep learning techniques to get results
    related to time-varying MIMO channels.


    ## 5. Recommendations for future work


    Quantum-assisted Deep Learning (QDL) is receiving significant attention towards
    enhancing performance metrics of communication networks. The classical DL faces
    various challenges; where a substantial challenge is to figure out the training
    method for complex topologies of neural networks (NNs) (which are of similar complexity
    to the natural brain).


