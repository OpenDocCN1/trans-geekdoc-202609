    比例。 |

    | SKU ID BZ001 | 0.317456 | < 2e-16 | SKU ID BZ001 的估计值为基准值，等同于截距。转换为对数转换后的 burbuff
    比例为 0.3174756。 |

    | SKU ID BZ004 | 0.0651518 | 4.58e-08 | 与基准 SKU BZ001 相比，存储和销售 SKU ID BZ004 将对数转换后的
    burbuff 指标增加了 0.0651518。 |

    | SKU ID BZ009 | -0.04305434 | 0.002237 | 与基准 SKU BZ001 相比，存储和销售 SKU ID BZ009
    将对数转换后的 burbuff 指标减少了 -0.04305434。 |

    | SKU ID BZ012 | 0.0226517 | 0.062349 | 与基准 SKU BZ001 相比，存储和销售 SKU ID BZ012 将对数转换后的
