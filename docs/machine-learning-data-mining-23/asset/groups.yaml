    表 7 报告了基于我 2009 年后的数据集，对等式 (8) 中滞后媒体情绪的 DID 估计值。其中一个重要结果是第 (2) 列中正系数 $\theta_1$，表明在贸易战期间，中国公共媒体对美国新闻的报道更为积极。由于中国政府对国内媒体及部分海外中资媒体具有很强的影响力，我们可以合理地推断，在中美冲突期间，中国监管机构试图软化反美情绪，这可以被视为中国监管机构修复中美关系的一种效力。相反，第
    (1) 列中的负系数 $\theta_1$ 表示美国公共媒体在贸易战期间对中国的报道更趋负面。


    为了清楚地解释贸易战后新闻一致性在中美关系中的作用，我们创建了一个指标“统一效应”（unity effect），通过因变量 $y_{it}$ 的观测值平均值估计系数
    $\theta_1$ 为 $\theta_1$ 乘以参数 $\kappa$ 的百分比；在贸易战后，$\kappa$ 是用于判断新闻文章是否被认为与其他媒体保持一致的阈值。我选择美国报纸的
    $\kappa = 0.9$，中国报纸的 $\kappa = 0.8$。


    图 8 $\theta_1$ 表示一致的新闻文章，其估计的中美关系因贸易战而至少增加了这部分数值。例如，表 7 中 (2) 的统一效应为 $0.8 \times
    \frac{0.072}{0.034} \approx 100 = 167.9$。我根据用于生成指标的 $\hat{\theta}_1$ 显著性水平，在估计的统一效应估值旁边标注了星号*。根据表
    7 中的统一效应，我得出结论：中美民族主义对国际关系的影响在贸易战期间发生了相反的变化。在贸易战之前，由媒体一致性代表的中国民族主义能更显著地反映中美关系的变化。第
    (2) 列中中国民族主义削弱


    | 主要回归变量 | 美国 (1) | 中国 (2) |

    |---|---|---|

    | D/(T – war) $\times$ Consistency | -0.043*** | 0.072*** |

    | | [.002] | [.013] |

    | 一致性 | 0.033*** | -0.063*** |

    | | [.012] | [.013] |

    | 常数项 | 0.39*** | 0.0058 |

    | | [.011] | [.005] |

    | 观测值 | 42,144 | 81,866 |

    | 固定效应来源 FE | 是 | 是 |

    | 变量前效应 | 0.42 | -0.034 |

    | 统一效应 | -9.3*** | -167.9*** |


    注：括号内为聚类稳健标准误。系数根据显著性水平标记（* p < .1, ** p < .05, *** p < .01）。


    **表 7。**

    情绪衡量标准的 D 估计结果。


    ## 机器学习与数据挖掘年鉴 2023


    中国与美国的关系。在贸易战期间，第 (2) 列的 $\theta_1$ 变得显著为正，对中美关系产生了贡献。注意，中国监管机构部分审查媒体一致性作为民族主义的代理。因此，民族主义对国际关系积极影响的一种解释是监管机构改善中美关系的意愿。相反，我没有在美国方面观察到类似的结果。从美国的角度来看，中美之间升级的贸易冲突自然恶化了关系。


    ## 6.4 安慰剂检验


    为了解决现有因素对表 7 结果影响的担忧，进行了安慰剂检验，以评估 2019 年贸易战之前美国和中国报纸中等式 (8) 所的新绪。使用了 6.3 节中相同的
    DID 模型，其中 $\theta_1$ 代表处理组 (D-war)=1 和控制组 (D-war)=0 之间的结果变量差异。然而，安慰剂检验的基准与原始分析不同，基准为美国报纸
    2004 年 12 月 5 日和中国报纸 2007 年 12 月 5 日，这些是基于中美关系的没有重大冲突的时期。这项安慰剂研究涵盖了从九·十一恐袭击到奥巴马亚洲政策之前的时期。如果之前对贸易战影响中美关系的分析是准确的，那么安慰剂检验中观察到的统一效应应该是不显著的。安慰剂检验的结果见附录表
    B.1，除了第 (1) 列的常数项外，没有观察到显著效应。


    总体而言，我的安慰剂检验表明，6.3 节的结果对潜在的混杂因素具有稳健性。


