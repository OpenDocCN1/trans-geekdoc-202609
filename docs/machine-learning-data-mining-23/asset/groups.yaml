    This research critically evaluated the relationship between BDA capabilities and
    SC performance within a single case study. Therefore, the primary focus of this
    research was to investigate and illustrate the application of BDA in the existing
    decision-making process to overcome technology constraints and challenges within
    the SC information flow and obtain valuable insights into the current market environment.
    This research aimed to understand better and measure the interaction between in-store
    sales and stockholding as a dynamic market indicator aiding demand planning and
    forecasting. The following research question addresses specific SC issues, such
    as reducing operational costs, risks, and the financial impacts associated with
    demand forecast inefficiencies and missed opportunities:


    Even though growing research into the application of BDA in SMEs is evident, there
    are limited case studies that illustrate the application of BDA reflecting measurable
    business value, such as a reduction in operational cost, risk, and the financial
    impact associated with demand forecast inefficiencies and missed market opportunities.
    Thus, this project aimed to advance practical knowledge within the area of interest,
    applying various BDA techniques, increasing SC collaboration and communication,
    and ultimately improving SC efficiency by employing a single organization study
    within the SME industry.


    # 2. Big data, analytics, and supply chain management within the SME industry


    ## 2.1 Big data and analytics


    In 1941, the term "information explosion" was followed by several publications
    between 1944 and 2000, reflecting on the magnitude and expected growth rate of
    data and information. It remains unclear as to true origin of the term "Big data."
    While many states the term was only officially coined in 2005 by Roger John Mougalas
    and the O''Reilly Media group [5], describing big data as datasets that cannot
    be processed or consumed through traditional business processes and analytical
    tools [6]. Gartner, a leading research and consulting firm, extends a more definition
    by incorporating critical characteristics of big data and describing big data
    as: "...high-volume, high-velocity and/or high-variety information assets that
    demand cost-effective, innovative forms of information processing that have enhanced
    insight, decision making, and process formation" [7]. Several studies report on
    the characteristics of big data, often described as the Vs of big data or data
    dimensions. Namely, these are volume, variety, value, and veracity [8–10]. Volume
    and variety describe the data’s size, magnitude, and format. At the same time,
    value, velocity, and veracity summarize how close the data is processed in real
    time, the trust in the data quality. There have been several extensions to the
    big data Vs in recent years, including adding variability. Variability considers
    the change in data structures and, more importantly, the pace, frequency, and
    extent to which those data structures change. Understanding the variability of
    one’s data, supported by a high level of data veracity, allows for efficient planning
    of resources and processes to ensure minimal disruption to the organization''s
    decision-making process.


    Big Data Analytics, coupled with analytics, defined as BDA, presents scalable
    and cost-effective opportunities to process and integrate different data structures,
    enabling the extraction of valuable insights from high volume and structured unstructured
    data. Kitch [11] examined the impact of BDA on established methodologies and how
    big data acts as a disruptive innovation while permitting and more efficient analytical
    methods to emerge. Technical skills are vital in extracting information and insights
    from that data. Those analytical efforts also rely on clearly articulated businesses
    and the evaluation of results by subject matter experts.


    The insights drawn allow organizations to respond to rapidly developing environments
    and maintain a competitive advantage on tactical and strategic levels [1, 9].
    An empirical study by [9] argues that organizations require to reconfigure to
    respond to BDA insights delivered and generate actionable insights to obtain optimal
    value from BDA initiatives. The author observes that even though organizations
    within Norway are progressing in adopting technology and information advancements,
    only some observe the complete benefit of their BDA investment. Surprisingly,
    the study reports a low 10.8% of companies with more than 4 years of BDA experience,
    considering a notable increase in BDA trends over the past decade. Findings in
    a study by [1] suggest organizations still lack an understanding the required
    BDA capabilities to enable BDA as a strategic driver. The study emphasizes that
    the success of BDA initiatives within an organization is dependent on a composite
    factor of the allocation of time and financial resources, a supportive BDA infrastructure,
    and leadership commitment to driving a data-driven culture.


    ## 2.2 Big data analytics within supply chain management


    BDA presents an opportunity for precise and transparent information flow between
    crucial elements such as procurement and inventory management, encouraging SC
    integration and collaboration [1, 2]. Furthermore, the communication efficiency
    of BDA addresses the increasing complexity of SC data, driven by initiatives [3].
    Thus, BDA allows for more accurate demand planning and forecasting underpinning
    SC inventory management decisions to promote overall SC efficiency.


    SCM was defined by [12] as the alignment and horizontal integration of organizatization,
