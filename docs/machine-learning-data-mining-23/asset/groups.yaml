    机器学习与数据挖掘年度刊册 2023


    收集稳健、全面且标准化的数据是一项艰巨的任务，特别是对于那些土木工程研究资金不足或被忽视的地区而言。此外，一旦收集了数据，预处理阶段可能同样棘手。原始数据通常带有噪声、离群值或缺失值。清洗这些数据、对其归一化并使其适用于
    ML 模型需要大量的精力和专业知识。将原始土木工程数据转换为机器可读且有利于准确预测的格式，仍然是一个巨大的障碍 [45]。


    ## 6.2 可解释性与信任


    另一个可解释性的挑战是许多先进 ML 模型的“黑箱”性质。由于工作性质的限制，土木工程师倾向于信任那些能够提供清晰因果关系的模型和系统。当 ML 模型（如深度神经网络）提供预测或风险评估时，通往结论的路径并不总是透明的。这些模型的不透明性可能会在采用时导致犹豫，特别是在高风险的场景中；理解预测背后的“为什么”可能与预测本身一样关重要。


    这并非不可逾越的。可解释人工智能（XAI）领域的最新进展旨在使 ML 模型具有更高的可解释性。通过对模型的决策过程提供洞察，相关工具正努力弥合信任鸿沟。然而，将
    XAI 集成到土木风险评估中仍处于进行阶段，对 ML 的广泛信任仍是未来的目标 [46]。


    ## 6.3 可扩展性与实时处理


    虽然 ML 模型在处理数据集和计算方面表现出色，但在实时环境中的可扩展性仍然是一个挑战。土木风险评估通常要求瞬时决策，特别是在滑滑坡现场监测或地震多发地区基础设施结构完整性监测等场景下。模型越大、越复杂，其对计算能力的要求就越高，这有时会成为提供实时见解的瓶颈。


    此外，随着数据的不断收集，模型需要定期进行重新训练或微调。确保这些工作在不干扰时间评估的情况下无缝进行，是工程师和数据科学家正在努力解决的挑战 [47]。


    ## 6.4 与现有系统的集成


    大多数土木工程公司和机构已经有了用于风险评估的现有系统。这些系统经过多年甚至几十年的构建，已深植根于他们的操作工作流中。将 ML 模型集成到这些遗留系统中并非易事。它不仅需要技术上的适配，还需要文化上的转变。人员培训、适应新的决策范式以及确保集成不干扰正在进行的业务，都是重大挑战
    [48]。


    ## 6.5 伦理考量与责任制


    随着 ML 在风险评估中的应用，伦理困境随之浮现。如果 ML 模型的预测错误导致基础设施损坏，甚至更严重的人员伤，谁来承担责任？


