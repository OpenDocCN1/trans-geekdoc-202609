    # 机器学习与数据挖掘年刊 2023


    机器学习 [10] 是人工智能的一个子领域，在最近几十年显示出增长。机器学习模型的参数是从数据中学习的，而不是显式编程的。这使得模型能够适应新数据并做出预测或决策。各种类型的机器学习包括监督学习、无监督学习和强化学习。在监督学习中，模型在标记数据上进行训练。在无监督学习中，模型在未标记数据中寻找隐藏模式。在强化学习中，模型通过与环境交互来学习决策以最大化奖励。


    ## 3 结果


    ### 3.1 探索性分析


    原始数据集提交给了三个机器学习模型和一个深度学习模型（BERT）。用于验证模型性能的指标为：


    模型性能由以下若干指标确定：


    - 精确率（Precision）：分类模型仅识别相关数据点的能力。

    - 召回率（Recall）：模型找到所有相关案例的能力。

    - F1 分（F1-score）：精确率和召回率的调和平均数。

    - 准确率（Accuracy）：所有预测中正确预测的数量。


    为了清理数据，应用了预处理技术，如小写化、去除标点和停用词。类别的分布如图 2 所示。


    ![](img/a049673a68b5b639acde44ba5be0e01e_122_0.png)


    ### 3.2 分类模型


    通过随机搜索（Random Search）调优的最佳超参数为：


    - Bootstrap：采样数据点的方法（带回或不带回）。

    - 最大深度（max_depth）：30。决策树的最大深度。

    - 最大特征（max_features）：sqrt。

    - 最小叶节点样本（min_samples_leaf）：1。指定分裂后叶子节点中必须存在的样本数。

    - 最小分裂样本（min_samples_split）：5。告诉决策树在任何节点处进行分裂所需的最小观测数参数。

    - 估计器数量（n_estimators）：800。森林中树的数量。


    **表 1** 展示了随机森林训练后的结果。


    混淆矩阵显示了模型中每个类别的分类频率，对于随机森林模型的结果，如图 4 所示。


