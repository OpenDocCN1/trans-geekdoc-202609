    # 机器学习与数据挖掘在医学中的应用：机遇...

    ITXLl113286


    不仅关注实现结果，还旨在模仿人类或生物体的方法。遗传算法和神经网络（ANNs）都属于这一类。


    近期 ChatGPT 3.5 等 AI 的出现引发了新一轮 AI 潮。我曾个人使用 ChatGPT 3.5 对随机森林、支持向量机和神经网络进行建模和验证，通过分析将它们与传统的
    R 建模（RF、SVM 和 ANN）进行对比。在这方面获得了一些实践经验。需要注意的是，ChatGPT 是一个能够编辑文本和生成代码的语言模型。在医学研究背景下，使用
    ChatGPT 3.5 实际上涉及使用 R 或 Python 等语言编码，以获得超越传统代码建模的结果。根据对 ChatGPT 4.0 的测试（其在美国律师考试、生物奥林匹克竞赛和考试等多个领域的准确率超过
    90%），显然 ChatGPT 4.0 拥有更强的记忆、逻辑分析和推理能力。此外，持续的研究正在探索 ChatGPT 在美国医师中的表现 [57]。


    ChatGPT 具有独特的优势，例如增强科学写作、提高公平性和多功能性。在医疗健康领域 [58]，其应用涵盖了数据集分析、代码生成、文献综述，节省时间以专注于实验设计、药物发现和开发。对医疗实践的益处包括简化工作流、节约成本、记录、个性化医疗以及提高素养。在医疗教育中，这些益处包括个性化学习以及强调批判性思维和基于问题的学习
    [59]。ChatGPT 拥有类似于人类的“大脑”，可以回溯之前的交互和用户评论，建立上下文连接——这通常是 AI 语言模型落后的领域。基于这些优势，ChatGPT
    逐渐在医疗保健领域的广泛应用 [60]，并出现在许多论文中。然而，这种做法的有效性 [61] 和理性 [62] 还需要评估。


    在我的研究中，我尝试将 ChatGPT 生成的代码结合 R 语言建模（如 RF 和 ANN）。通过全面分析和比较使用 ChatGPT-3 生成的代码与传统
    R 模型相比的结果，我发现基于 ChatGPT 3.5 的模型显示出执行更快、准确率、精确率、召回率更高，且参数更简单。模型的验证性能优于传统的 R 语言机器学习，这使其成为临床推广和应用非常有价值的方法。最重要的是，基于
    AI ChatGPT 构建的模型可以根据需要自动调整参数，生成不断改进的预测模型，而无需像传统语言建模那样进行重复训练和调整参数等耗时耗资源的任务。AI ChatGPT
    在训练期间持续优化算法代码，而 R 语言建模缺乏实时算法优化。对于没有编码技能的医疗从业人员来说，AI 建模具有巨大的价值。如果使用得，ChatGPT 可以节省大量时间用于更高效、更优先的任务
    [63]。然而，披露在医疗保健和健康领域使用 ChatGPT 的缺点 [63] 是重要的。


    # 2023机器学习与数据挖掘年度


    虽然 ChatGPT 目前是计算机算法代码最好的编辑器之一，但它存在滞后，无法合成最新的算法代码。此外，ChatGPT 目前的应用可能会引发与抄袭、版权侵权、隐私和网络安全相关的担忧，因此需要对
    ChatGPT 的安全性进行彻底评估。最后，虽然 ChatGPT 有某些伦理要求，但它无法达到完美，如果咨询它，它可能会提供非法活动的指导。因此，使用 ChatGPT
    必须遵守相关法律并尊重地区习俗。


    # 5. 作用简介


    转向作用主题 [64]，作用分为乘法作用（乘积模型）和加法作用（求和模型）。在加法模型中，当不存在作用时，两个或多个因素作用于事件的效应等于单独作用效应之和。在乘法模型中，当不存在作用时，两个或多个因素作用于事件的效应等于这些因素单独作用效应的乘积。根据之前的流行病学文献
    [65]，乘法作用表示统计效应，而作用进一步暗示了生物学效应。鉴于临床研究通常没有孤立的影响，研究多个特征对结果变量的相互影响是临床研究的一个方向。这一方面在公共卫生研究中变得更加突出。同样，乘法作用和加法作用并不一定共存。然而，在我们的研究中，两个因素之间乘法和加法作用的同时显著性被用作临床研究的有意义的标准。换句话说，两个特征必须同时满足统计学显著乘法和加法作用的标准，具有统计学和生物学意义。这种对结果变量合并效应的评估对于临床研究至关重要。为了评估乘法作用的显著性，可以设定
    0.05 的假设检验标准。然而，评估加法作用需要满足三个标准：作用引起的相对风险（AP）和协同指数（S）。当不存在作用时，RI 和 AP 的置信区间包含 0，且
    S 的置信区间应包含。


    评估临床影响因素的加法和乘法模型对疾病预测和诊断具有重要意义，特别是在流行病学统计研究和 COVID-19 疫情之后。计算加法作用同样重要，因为它对公共卫生具有影响。我曾个人对高尿酸血和高血压等慢性病因素进行作用分析；结合我的经验，让我们用一个简单的例子来说作用研究的重要性。


    假设某人群参加了一个聚会活动，其中一些人的状况良好而另一些则不然。聚会活动是感染 COVID-19 的风险因素，我们希望干预以加强对 COVID-19 的控制。为了优化管理、激励和惩罚等资源的使用以实现最大影响，我们需要考虑乘法和加法作用模型。假设我们应用作用理论来研究基础健康状况和参加聚会会对
    COVID-19 感染风险产生的合并效应。假设在该研究中，没有基础健康状况的参加聚会的个人之间的乘法作用表示反向乘法作用，这意味着对于有基础健康状况的人来说，参加聚会的感染风险比不参加更高。然而，仅依赖乘法作用的结果会忽视健康状况的人群，并可能识别出错误的高风险组。现在，假设我们使用加法作用算法，它指示正性加法作用，解释了对于有基础健康状况的人来说，干预聚会可以产生更大的健康收益。因此，探索因素作用可以指导临床和预防决策，允许高效分配资源以实现最佳结果。全面分析乘法和加法模型以获得最可靠的研究结果是关重要的。随着传染病的广泛发生，与因素作用相关的统计研究将不可增加。希望这项研究能为未来的传染病防控工作提供宝贵的见解。这是本文最重要的贡献之一。


