    # 机器学习与数据挖掘 2023年度卷


    即分区段，代表了分析期间交付给零售商配送中心（DC）销售订单的“时间”元素。此外，非交付期间被解释为分析中的缺失值。缺失值可能会引入偏差并降低模型性能。若干时间序列模型可以处理缺失值，例如
    ARIMA 和神经网络。然而，缺失值对于时间序列回归和 Tbats 技术 [35] 来说存在问题。此外，采用了三次样条插法来处理供应商-零售商需求、零售商-消费者需求与库存供应之间的非线性关系
    [36]。


    从 B2B 数据识别并衍生出额外的自变量：(a) 从下单到在零售商实体店收到订单的总平均交期；(b) 促销指标；(c) 该时间点的国家库存水平；(d) 国家销售率
    (ROS) 以及 (e) 反映该时间点无库存、低库存或过剩的商店数量（计数）。引入这些变量是为了提高需求预测的准确性。


    ## 5.2.3 时间序列模型与预测评估


    以下指标用于评估预测准确性，并对采用的每种最小时间序列模型进行基准测试，随后给出与业务相关的解释。表 3 定义了所选的模型评估和评价指标。


    ## 5.2.4 时间序列训练集与测试集


    验证时间序列模型性能的标准方法是将观测值划分为相关的训练数据集和测试数据集，通常测试集（也称为验证集）由最近的观测值组成。在本研究背景下，测试数据集包含 2021
    年 7 月 11 日至 2021 年 10 月 3 日最近 13 周的观测值，而训练集包含了每个 SKU ID 在 2021 年 7 月 11 日之前的所有可用观测值。


    | 指标 | 定义 |

    |---|---|

    | 平均绝对误差 (MAE) | 代表误差的平均幅度，以因变量的单位表示。通过预测值与实际值的对齐密切程度可以衡量模型对数据的绝对拟合程度。 |

    | 平均绝对百分比误差 (MAPE) | 将预测误差表示为实际观测值的百分比。 |

    | 预测均方根误差 (RMSE) | 代表模型对数据的绝对拟合平方，衡量实际值与预测值的接近程度。RMSE 值以因变量的单位表示，等同于未解释方的标准差。
    |

    | 离散指数 (SI) | 用于判断 RMSE 是否可接受的指标，值 <1 被认为是可以接受的。 |


    表 3. 时间序列模型评估标准。


    ## 大分析能力与供应链管理的定量分析 IToxLi111147


    ## 5.2.5 SKU ID BZ001 时间序列模型与预测


    每种序列方法记录的 SI 值均 <1，处于可接受阈值内。然而，BDA 技术记录的平均 MAPE（误差率）为 33.5，显著低于传统技术的平均 MAPE（误差率）。此外，BDA
    技术反映出更高的预测准确性，因为与传统方法的平均 MAE (1148) 和平均 RMSE (1882) 相比，其平均 MAE (1172) 和平均 RMSE
    (1663) 值更低。总体结果表明，Sarimax 和 Tbats 模型被认为是性能最好的模型，其 MAPE（误差率）分别为 27.8 和 23.0。伴随的是较低的
    MAE 值（975 和 955）以及 RMSE 值（1315 和 1466）。


    ## 5.2.6 SKU ID BZ004 时间序列模型与预测


    每种序列方法记录的 SI 值均 <1，处于可接受阈值内。然而，BDA 技术记录的平均 MAPE（误差率）为 37.5，显著低于传统技术 47.2 的平均 MAPE（误差率）。此外，BDA
    技术反映出更高的预测准确性，因为与传统方法的平均 MAE (928) 和平均 RMSE (1120) 相比，其平均 MAE (648) 和平均 RMSE (719)
    值更低。总体结果表明，Sarimax 是性能最好的模型，具有最低的 MAPE（误差率）值 23.3、较低的 MAE 值 300 以及 RMSE 值 370。


    ## 5.2.7 SKU ID BZ009 时间序列模型与预测


    每种序列方法记录的 SI 值均 <1，处于可接受阈值内。传统技术的 MAPE（误差率）值为 30.1，优于 22.0 的 MAPE（误差率）值。此外，BDA
    技术反映出更高的预测准确性，因为与传统方法的平均 MAE (236) 和平均 RMSE (308) 相比，其平均 MAE (163) 和平均 RMSE (196)
    值更低。结果表明，Sarimax 模型被认为是性能最好的模型，其 MAPE（误差率）值为 15.3，伴随的是较低的 MAE 值 103 和 RMSE 值 119。


    ## 5.2.8 SKU ID BZ012 时间序列模型与预测


    每种序列方法记录的 SI 值均 <1，处于可接受阈值内。由于 Sarimax 模型表现不佳，总体 BDA 技术得出了违反直觉的结果，记录了高 MAPE（误差率）值
    72.3、高 MAE 值 933 以及 RMSE 值 1247。然而，总体结果显示 ARIMA、TBATS 和神经网络模型在 MAPE、MAE 和 RMSE
    方面的性能相似。


    ## 5.2.9 SKU ID BZ013 时间序列模型与预测


    每种序列方法记录的 SI 值均 <1，处于可接受阈值内。尽管神经网络并不适用，但 BDA 技术显著改进了传统技术的 19.0 MAPE（误差率）值。此外，BDA
    技术反映出更高的预测准确性，因为与传统方法的平均 MAE (1604) 和平均 RMSE (1770) 相比，其平均 MAE (553) 和平均 RMSE
    (685) 值更低。结果表明 Sarimax 模型是性能最好的模型，其 MAPE（误差率）值为较低的 12.8，伴随的是较低的 MAE 值 400 和 RMSE
    值 540。


    ## 5.2.10 SKU ID BZ030 时间序列模型与预测


    每种序列方法记录的 SI 值均 <1，处于可接受阈值内。由于趋势或季节性有限，Holt-Winters BDA 模型不再适用。然而，传统 ARIMA 模型优于
    BDA 技术，因为其 MAPE（误差率）值为 3.5，远低于 BDA 技术的 14.2。此外，ARIMA 模型反映出更高的预测准确性，因为与 BDA 技术的平均
    MAE (1023) 和平均 RMSE (1340) 相比，其平均 MAE (258) 和平均 RMSE (322) 值更低。总体表明，ARIMA 和神经网络模型被认为是性能最好的模型，其
    MAPE、MAE 和 RMSE 值非常接近。


    ## 5.2.11 时间序列模型与预测总结


    分析结果表明，当存在反映高季节性趋势和波动足够的数据时，BDA 技术优于传统方法。相比之下，传统技术（主要是 ARIMA 模型）更适用于历史数据或季节性数据的
    SKU。表 4 展示了每个 SKU 的最佳时间序列和预测技术。


