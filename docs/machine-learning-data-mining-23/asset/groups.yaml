    ## Time series technique class


    | Technique | Description | Class |

    |---|---|---|

    | Holt-Winters | An exponential smoothing forecast method. Transforming (response
    variable) into a weighted average of past observations, where current observation
    values will carry more weight than older observations. | Conventional |

    | Arima (AutoRegressive Integrated Moving Average) | AutoReg - Outer regressed
    on its own lagged observation values. - The number of differing needs to be applied
    to achieve stationarity. Moving average - using past errors as opposed to past
    observations. | Conventional |

    | Sarimax (Seasonal ARIMA + Exogenous variables) | Incorporates ARIMA components
    and accommodates exogenous variables – external regressors to improve forecast
    accuracy. | BDA |

    | Thats (Trigonometric seasonality: Cox transformation ARIMA errors Trend Seasonal
    + Exogenous variables) | An exponential smoothing forecast method. Accommodating
    for multiple seasonal patterns by the use of trigonometric function and allowing
    for exogenous variables - external regressors to improve forecast accuracy. |
    BDA |

    | Neural Networks | Accommodates non-linear relationships between demand (response
    variable) and exogenous variables - external regressors. | BDA |

    | SMA Simple Moving Average | Transforming demand (response variable) into an
    arithmetic average by the number of periods within a given range. | Conventional
    |


    ## I. Time series model measure


    | Measure | Definition |

    |---|---|

    | Mean absolute error (MAE) | Represents average magnitude of errors and expressed
    in units of the dependent variable. The absolute fit of the model to the data,
    measuring how close the actual values are to the predicted values. |

    | Mean absolute percentage error (MAPE) | Represents the forecast errors as a
    % of the actual observed value. |

    | Forecast Errors Root mean squared error (RMSE) | Represents the squared absolute
    fit of the model to the data, measuring how close the actual values are to the
    predicted values. The RMSE value is expressed in units of the dependent variable
    and translates to the standard deviation of the unexplained variance. |

    | Scatter index (SI) | A measure of determining if RMSE is acceptable, a value
    of < 1 is deemed acceptable. |

