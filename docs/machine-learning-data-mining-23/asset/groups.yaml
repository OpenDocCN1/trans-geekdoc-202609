    # Machine Learning and Data Mining Annual 2023


    current media sentiment, the interaction between topic popularity and media censorship,
    and other terms, including politics and demographic characteristics. I add this
    interaction term because of an assumption that regulators may have stronger censorship
    over the news with high popularity, so there is a potential interaction effect
    between popularity and censorship. Once regulators'' impact on censorship is relatively
    constant, external events such as the trade war as an instrumental should sufficiently
    explain the degree of censorship. Table 3 reports the descriptive statistics of
    news consistency.


    As in Figure 4, I assume media censorship only depends on two factors: one is
    regulators'' will, and another is the external interaction, such as the Trade
    War''s impact on Sino-US relations. In my study period, it is reasonable to consider
    the regulators'' will as relatively stable, therefore I recognise it as a constant
    term. As a result, the dynamic of censorship mainly depends on the Trade War effect.
    Vector X, controls for regulators in the US, including political bias in the media
    (using a dummy equal 1 for a right biased source and 0 for a left biased source)
    and the proportion of Chinese people (excluding Taiwanese) in state. Note the
    Chinese ratio is only suitable in the US region. I do not create the US ratio
    because China is not an immigration country, and the percentage of US immigrants
    in China is trivial. In addition, I do not use the Chinese ratio in my regression
    model because I assume the sentiment depends on the media and previous international
    relations. This is a reasonable purpose to report new information regardless of
    demographic interests, especially since my samples are well-known US newspapers.
    I consider the Chinese ratio could affect the media consistency because a higher
    number of Chinese clients might lead to lower media consistency to report Chinese
    if the US media generally tend to report Chinese negatively but still care about
    the local Chinese immigrants.


