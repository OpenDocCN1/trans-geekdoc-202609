    ## 政治风险管理的人工智能技术：基于自然语言处理的分析...

    IToxLI110794


    表 1 显示了贸易战对国家关系的描述性统计。情感指数，$S_{t+1}$ 是中美两国关系的代理变量，我将其设定为因变量。$D(T-war)$ 是一个虚拟变量，表示发布日期是否在中美贸易战期间（2016
    年 5 月之后为 1，之前为 0）。对于政治控制，$X_t$ 控制了政治因素以及与 $y_t$ 相关的影响。CPU 指数是一个基于词汇的指数，关注《人民日报》中表达的与中美关系无关的特定术。


    如上所述，《人民日报》于 1948 年创出版，是中国共产党的官方出版物，反映了中国政府的立场。CPU 指数和我的情感衡量标准都使用了词典法，该方法考虑了预设词典中特定词汇的频率或包含这些词汇的文档数量。特别是，CPU
    指数捕捉了公众对国家政策和经济不确定性的信息，这可以被视为对国家关系每月系统性风险感知的量化代理。


    对于政治控制（市场收益），我考虑了特定文章发布前一日的股市收益。很容易想象，人们在金融市场中的短期损益会影响他们的情绪。对于美国，我使用标普 500 指数作为美国市场表现的代理。对于中国，我使用上综指数来反映中国金融市场表现。


    此外，我包含了某些控制变量来管理中美关系。新闻情感衡量取决于新闻话题是否热门，这会影响作者的措辞并引发情绪唤醒。如果出版者认同大众的口味，该出版者将更有动力做出积极或负面的描述。相反，如果出版者试图通过使用煽动性的语言来操纵情绪，热门和冷门的新闻话题并不是理想目标。一方面，过于热门的话题很容易引发广泛讨论并暴露出版者的意图；另一方面，冷门的话题不能引起读者的兴趣，导致操纵失败。因此，我使用两个虚拟变量
    $D(Popular)$ 和 $D(Unpopular)$ 为情感衡量添加了特定主题的控制，分别表示新闻类目涵盖的是热门还是冷门的话题。


    我将讨论潜在主题指数（详见第 6.3 节）的新闻文章排名前 35% 的归类为热门新闻（$D(Popular) = 1$，否则为 0）。相反，如果文章的主题受欢迎指数处于底部
    35%，则将其定义为冷门文章（$D(Unpopular) = 1$，否则为 0）。这种控制使我们能够识别读者兴趣对新闻呈现方式的影响。


    表 2 显示了 2017 年以来中美贸易战影响的描述性统计。一方面，贸易战对双边贸易的直接影响非常有趣；另一方面，双边关系可能是媒体情感之外的国家关系的代理变量。因此，两种不同的国家关系代理为贸易战对双边关系的影响提供了稳健的估计。


    对于双边进口衡量，我添加了两个控制变量：总人口（Population）和中美之间每月世贸诉讼数量（$D(Dispute)$），而不是类型控制。该控制允许我们捕捉到人们对产品需求的自然影响。如果中美之间存在诉端，则
    $D(Dispute) = 1$，否则如此。最后，我添加了固定效应 $\alpha_i$ 来代表每个国家的情感衡量。


