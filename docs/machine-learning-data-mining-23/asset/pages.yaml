    32.8% of African SMEs considered the rapidly changing environment a critical challenge,
    with 28.24% concerned with the high cost associated with information technology.
    These challenges faced by SMEs influenced the implementation of strategic initiatives
    to reduce operational costs, increase profits, and create a competitive advantage.
