    # 6.4 Placebo-controlled study


    To address concerns regarding the impact of pre-existing factors on the results
    presented in Table 7, a placebo-controlled study is conducted to assess the news
    sentiment as in Eq.(8) in US and Chinese newspapers prior to the 2019 US trade
    war. The same DID model employed in Section 6.3 is utilised, with θ1 representing
    the difference in the outcome variable between the treatment group (D-war)=1 and
    the control group (D-war)=0 at the baseline. However, the placebo test differs
    from the original analysis in the baseline that is December 5, 2004 for US newspapers
    and December 5, 2007 for Chinese newspapers, which were periods without significant
    bilateral conflicts based on Sino-US relations. This placebo study covers the
    period from September 11 attacks to the time before Barack Obama''s Asian policy.
    If the previous analysis of the trade war on US-China relations is accurate, the
    unity effect observed in the placebo test should be insignificant or significantly.
    The results of the placebo test are reported in Table B.1 in Appendix B, and no
    significant effects are observed except for the constant term in Column (1).


    Overall, my placebo-controlled study suggests that the results presented in Section
    6.3 are robust to potential confounding factors. Specifically, I find that the
    difference in the unity effect between the treatment and control groups is primarily
    driven by the trade war rather than pre-existing heterogeneous factors.


    # 7. Robustness


    In Table C.1 in Appendix C, I present the results of my robustness tests for the
    main results in Section 6. Each table reports the coefficients of the t-war effect
    or the unity effect and their significance is based on the coefficients used in
    the calculations. The estimated sign of these effects and their level of significance
    in each robustness test are very close to the main results discussed in Section
    6. Using a period of more intense conflict as the trade war event, I observe that
    the estimated values of the t-war effect and the unity effect tend to be higher,
    indicating that nationalism and government intervention in the media tend to be
    stronger as international escalate.


    In Section 4.3, I present the LDA topic model to determine whether news article
    should be classified as placebo. As previously mentioned, K is an important parameter
    that we need to provide to the media using the LDA topic model to accurately and
    efficiently identify the latent topics of each text. Figure A.1 in Appendix A
