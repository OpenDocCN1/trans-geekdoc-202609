    # ## 2.3 Models


    The Transformer architecture (Vaswani et al.) is a natural language processing
    neural network architecture developed by Google in 2017. It was introduced in
    the paper "Attention All You Need" [3] and has revolutionized the way neural networks
    are trained to handle language processing tasks such as automatic translation
    and text generation. The main innovation of the Transformer architecture is the
    use of attention, which allows the network to consider all input words simultaneously
    when producing an output. This helps to deal with the variable length dependency
    problem present in many natural language processing tasks. In addition, the Transformer
    uses multi-layer heads of attention, which helps extend the network''s modeling
    capability.


    BERT (Bidirectional Encoder Representations from Transformers) [4] is a language
    pre-training technique developed by Google in 2018. It uses the Transformer architecture
    to learn bidirectional representations of each word in a text corpus. This means
    that, unlike pre-training techniques that only consider the left or right context
    of word, BERT considers both left and right context simultaneously. BERT was trained
    on a large amount of text from the internet and can be easily adapted to various
    natural language processing tasks such as text classification, entity extraction
    and answering. It has shown excellent results in many natural language processing
    tasks and has become a basis for many other language models.


    Language model pre-training has been shown to be effective in improving many tasks
    related to natural language processing [5]. This includes sentence-level tasks
    such as language inference [6], which aim to predict relationships between sentences
    by analyzing them holistically [7], as well as token-level tasks such as named
    entity recognition and answering queries, where models are needed to produce token-level
    output [8].


    In this study, data were submitted to a neural network algorithm BERTimbau [2],
    for natural language processing (NLP) in Portuguese, a variation of the BERT algorithm
    [9]. Random Forest, Support Vector Machine (SVM) and Naive learning algorithms
    were also used in order to create a baseline.'
