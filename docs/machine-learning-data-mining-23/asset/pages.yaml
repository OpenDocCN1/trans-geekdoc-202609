    # E. PCA model assumptions


    Assumption 1: Sphericity or existence of collinearity between the variables.

    Bartlett''s Test for Sphericity is used to determine whether the intercorrelation
    matrix comes from a non-linear population. If this is not the case, PCA may not
    be appropriate, as it relies on constructing a linear combination of the variables.
    The hypothesis being tested by Bartlett''s Test is as follows:


    +   * Ho: No collinearity between the variables.

    * Ha: Collinearity between the variables.

    * Application of Bartlett''s Test at a significance level of 0.05, denoted as
    α = 0.05, yielding a p-value of <0.038, rejecting the null hypothesis and accepting
    the alternative hypothesis of sufficient evidence that collinearity between the
    variables exist.


    Assumption 2: Sample adequacy.

    The KMO (Kaiser-Meyer-Olin) test is applied to determine if the data is suitable
    for dimension reduction techniques such as factor analysis or PCA. The following
    threshold guides interpretation of the KMO statistic, and KMO values can be interpreted
    as follows (Stephanie, 2016):

    KMO values between:


    +   * 0.49 is considered unacceptable.

    * 0.50 to 0.59 is considered mediocre.

    * 0.60 to 0.69 is considered mediocre.


    In summary, KMO values greater than 0.79 indicate an adequate data sample. KMO
    values less than 0.5 indicate an inadequate data sample and require remedial action.
    Applying the KMO (Kaiser-Meyer-Olin) yielded an overall KMO score of 0.79, confirming
    that the data is adequate. Furthermore, variables recording a KMO score of less
    than 0.05 were excluded from the PCA.


    Assumption 3. Determinant of the correlation or variance-covariance matrices The
    determinant value must be positive, implying a positive symmetric covariance matrix.
    The assumption was tested by applying the R “det” function. The "det” function
    yielded a value of 2.75601E-09, confirming that the positive value satisfies the
    assumption.


