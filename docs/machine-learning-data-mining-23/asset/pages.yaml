    # 2.2 COX regression


    COX regression, on the hand, is a semiparametric regression model based on time
    and outcome results [21], also known as the proportional hazards model or Cox
    model. It uses survival outcomes and survival time as dependent variables and
    can simultaneously analyze the influence of numerous features on survival time.
    It can analyze data with survival time without requiring the estimation of data
    distribution. Because of these advantages, since its inception, curve analysis
    and COX regression models have found extensive application in medical follow-up
    studies, particularly in clinically relevant research areas closely tied to survival
    time, such as malignant tumors and cardiovascular diseases. COX regression is
    currently one of the most used multivariate analysis methods in survival analysis.


    # 2.3 Nomogram


    Another intuitive machine learning algorithm is the nomogram. Nomograms represent
    relationships between multiple independent variables in a plane Cartesian coordinate
    system using a cluster of nonintersecting line segments [22]. While used in meteorology,
    they have gained widespread application in the medical field in recent years.
    Nomograms offer visual and convenient ways to present results based on different
    equations. Hence, nomograms can be used to depict regression results, including
    LR and COX regression. However, there is a debate on whether creating nomograms
    is necessary, as the calculations for linear regression are straightforward and
    the advantages of nomograms might not be pronounced. For LR and COX regression,
    nomograms conveniently provide insights into disease risk or proportional hazards.
    Nomograms are constructed based on regression results, representing multiple line
    segments that facilitate the calculation of risks for different individuals.


    Nomograms are widely used in clinical research [23, 24]. After building an LR
    model, I have found constructing nomograms on LR to be a logical next step for
    elaborating results. More specifically, nomograms are constructed through a multi-factor
    regression model, wherein each influence factor''s contribution to the outcome
    (the variable of regression coefficient) is scored for each value. These scores
    are summed up to obtain a total score. By establishing a function between the
    total score and the probability of the outcome event, the predicted value for
    the individual''s outcome can be calculated.


    Nomograms are built on the foundation of multifactor regression, integrating multiple
    predictive indicators and expressing the relationships between variables through
    scaled line segments on the same plane. They provide a quantifiable and visual
    representation of results obtained from regression predictive models, which is
    crucial for guiding clinical research. They hold significant application in analyzing
    disease prognosis, especially for diseases such as malignant tumors [25–27].'
