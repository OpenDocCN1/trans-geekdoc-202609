    # 8. Conclusions


    In my study, I have found evidence supporting my hypothesis that nationalism and
    international disputes play crucial roles in shaping bilateral relations between
    countries. Specifically, I have used the trade war effect and unity effect to
    capture the impact of nationalism and news censorship on US-China relations. My
    results show that the trade war has resulted in a reduction in civil and economic
    relations between the parties in conflict. However, news censorship can help mitigate
    or conceal nationalism generated by media sentiment, aiding in the repair of bilateral
    relations.


    Based on empirical findings, I have drawn two significant conclusions. First,
    excessive nationalism can hinder progress in negotiations during international
    conflicts, particularly if they are asymmetric, and may not always serve a government''s
    interest. Second, in instances where one party has weaker bargaining power, suppressing
    unfair nationalism among its citizens may facilitate negotiation agreements that
    increase the total utility of the nation, even if some agreement as unfair. Overall,
    this chapter proposes a methodology based on textual analysis and topic modelling
    to quantify subjective nationalism and international relations. These techniques
    are gaining popularity in the social sciences, with experts predicting a significant
    impact on various research fields and the management of political and economic
    risks.


    As shifts, textual analysis is poised to become a solid field in economics, owing
    to the increasing volume of data generated by social media and interdisciplinary
    developments in fields such as psychology, neuroscience, and artificial intelligence
    [33]. Thus, machine learning and text analysis methodologies hold great promise
    for driving revolutionary results in social science and other research domains.


