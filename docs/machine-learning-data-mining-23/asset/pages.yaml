    McCombs and Shaw developed the agenda-setting theory by studying the 1968 presidential
    election in the US, which is a country with a relatively high degree of media
    freedom. The media sets agendas by appealing to people''s emotions [1]. For example,
    the 2020 coronavirus disease outbreak caused a global health crisis. Many people
    in China and other regions suffered suffered the epidemic. On 3 February 2020,
    the Wall Street posted an article titled "China is the real sick of Asia" and
    we can easily sense the negative and racist emotions towards China in this narrative
    [5]. News sentiment is the position of the media on the subject reported and may
    set by authors or driven by the tastes of readers. When a particular news sentiment
    is transmitted through the traditional local media, we can deduce that most of
    relatively independent media are trying to satisfy a public figure, or that the
    authorities are setting the agenda for the mass media.


    The connection between media and nationalism has been discussed in several works.
    Eriksen claimed that media the Internet promotes ethnocentric orientations among
    national and ethnic [6]. Hyun et al. indicate that user-generated content in media
    may facilitate actions of nationalism [7]. To figure out the causal effect of
    media on nationalism, sentiment could be a middle variable. One example is the
    anti-Japanese sentiment in China nowadays. Zhou and Wang suggest political propaganda
    has a significant effect on sentiment towards Japan [8]. For this example, political
    propaganda is the earliest textual data to appear on public platforms. These textual
    data with some elements led to a negative sentiment among readers and finally
    led to anti-Japanese political actions in China. Today''s anti-Japanese activities
    are a group of Chinese nationalism, and the negative sentiment driven by political
    propaganda as a middle variable provides a channel for researchers to quantify
    the quality of nationalism.


    Nationalism is the causal research topic for political scientists. A large number
    of studies focus on the causes of nationalism and its political influence on conflict
    or democracy, among other issues [9–13]. However, there is relatively little quantitative
    research examining nationalism in different countries or discussing the role of
    the authorities in promoting or suppressing nationalism in international conflicts.
    Nationalism have positive and negative effects on bilateral conflicts. During
    the South China Sea depute, the Philippines'' attempt to end fishermen'' illegal
    poaching was stopped by a Chinese maritime reconnaissance vessel, intensifying
    the conflict on 8 April 2012. The Global Times (affiliated with the People''s
    Daily) followed would not rule out the possibility of using force to resolve the
    conflict with the Philippines [14]. In contrast, during the Diaoyu (Senkaku) Islands
    de-Senkaku) dispute in 2012 between China and Japan, Russia argued that there
    was no obvious trend in the frequency or timing of articles about the issue published
    by the People''s Liberation Army Daily or the People''s Daily (two official newspapers
    representing the attitudes of China''s military and government), suggesting that
    China avoided mobilising power when resolving the dispute [15]. In these two conflicts,
    the Chinese government approach to media censorship and its attitude towards nationalism
    were different. Story proposes that the weakness of the Philippine navy gave the
    People''s Republic of China an opportunity to extend its sovereignty in the South
    China Sea [16]. We can infer that military power is part of the bargaining power
    of a party in an international conflict, so whether or not this power is invoked
    can affect the positive and negative effects of nationalism on the achievement
    of desirable negotiation outcomes.'
