    Janine Zitanellis


    # Abstract


    With the emergence of Big Data Technologies (BDT) and the growing application
    of Big Data Analytics (BDA), Supply Chain Management (SCM) researchers incre increasingly
    utilize BDA due to the opportunities from BDT and BDA present. Supply Chain (SC)
    data is inherently complex and results in an environment with high uncertainty,
    which presents a real challenge for SC decision-makers. This study aimed to investigate
    and illustrate the application of BDA within the existing decision-making process.
    BDT allowed for the extraction and processing of SC data. BDA aided further understanding
    of SC inefficiencies and delivered valuable, actionable insights by validating
    the existence of SC bullhip phenomenon and its contributing factors. Furthermore,
    BDA enabled the pragmatic evaluation of linear and nonlinear regression relationships
    by applying machine learning techniques such as Principal Component Analysis (PCA)
    and multivariate regression analysis. Moreover, applying more sophisticated BDA
    time series and forecasting techniques such as Sarimax, Stats, and neural networks
    improved forecasting accuracy. Ultimately, the improved demand planning and forecast
    accuracy will reduce SC uncertainty and the effects of the observed bullhip phenomenon,
    creating a competitive advantage for all the members within the SC value chain.


    **Keywords:** big data analytics, supply chain management, bullhip phenomenon,
    principal component analysis, regression analysis, demand planning and forecasting


    # 1. Introduction


    BDA presents an opportunity for precise and transparent information flow between
    crucial SC components such as procurement, inventory management, and demand planning
    and forecasting encourages SC integration and collaboration to promote overall
    SC efficiency [1, 2].


    SCM ultimately attempts to match varying supply and demand rates in the most cost-efficient
    manner. As one can imagine, the flow of materials and information through several
    organizations within the SC network is increasingly and increasingly complex due
    to various SC channels and data nodes driven by factors such as market globalization
    and SC digitalization initiatives [3]. SC inefficiencies will manifest and contribute
    to the well-examined bullhip phenomenon [4].'
