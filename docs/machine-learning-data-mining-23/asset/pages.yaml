    # 2 News sentiment


    To interpret the opinion of each article in the US (Chinese) news corpus with
    regard China (the US), I retrieve emotional information from news articles using
    the sentiment score. One challenge for a large-scale news corpus is to design
    an appropriate and correct algorithm to capture the sentiment score for each document
    written in different languages. Moreover, there are many news sources available
    in the we selected newspapers providing new information at different times, so
    efficiency is another important criterion for the sentiment analysis algorithm.
    Based on these considerations, I apply the dictionary approach in textual analysis
    by calculating the total frequency of each word of emotional arousal based on
    a pre-established positive (negative) dictionary. To compute the absolute sentiment
    score (σ) for article *i* at time *t*, I use the number of positions (p) minus
    the number of negative words (n) by the total number of terms of emotional arousal
