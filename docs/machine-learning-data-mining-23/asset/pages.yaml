    # 5. Introduction to interaction


    Moving on the topic of interaction [64], interactions are classified into multiplicative
    interaction (product model) and additive interaction (sum model). In the additive
    model, when there is no interaction, the combined effect of two or more factors
    acting on an event equals the sum of the effects individually. In the multiplicative
    model, when there is no interaction, the combined effect of two or more factors
    acting on an event equals the product of the effects these factors acted individually.
    According to prior epidemiological literature [65], multiplicative interaction
    indicates statistical effects, whereas interaction further suggests biological
    effects. Given that in clinical research typically do not have isolated effects,
    investigating the mutual effects of multiple features on the outcome variable
    is a direction in clinical research. This aspect becomes even more prominent in
    public health studies. Similarly, multiplicative and additive interactions do
    not necessarily coexist. However, in our research, the simultaneous significance
    of both multiplicative and additive interactions between two factors is used as
    a meaningful criterion for clinical research. In other words, both features must
    simultaneously fulfill the criteria for statistically significant multiplicative
    and additive interactions to have statistical and biological significance. This
    evaluation of the combined effect on the outcome variable is crucial for studies
    in clinical research. To assess the significance of multiplicative interaction,
    hypothesis testing criteria can be set, at 0.05. However, assessing additive interaction
    requires the fulfilment of three criteria: the relative risk due to interaction
    (AP), and the synergy index (S). When there is no interaction, the confidence
    intervals for RI and AP include 0, and the confidence for S should be included.


    Evaluating the additive and multiplicative models of clinical impact factors carries
    great significance for disease prediction and diagnosis, particularly in epidemiological
    statistical research and in the aftermath of the COVID-19 pandemic. Calculating
    additive interaction is as important as it has implications for public health.
    I have personally conducted interaction analysis of factors in chronic diseases
    such as hyperuricemia and hypertension; combining my experience, let us illustrate
    the importance of interaction research with a simple example.


    Suppose a population attends a gathering event, where some individuals under health
