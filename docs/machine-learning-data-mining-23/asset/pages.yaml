    # 1.1 Background


    Geotechnical engineering stands as a testament to humankind''s quest to master
    the Earth''s materials and harness their properties for infrastructural projects.
    Tracing its roots back to the dawn of civilization, when the first foundations
    were laid, the discipline has expanded beyond its foundational tenets, particularly
    with the rise of urban centers, intricate transport systems, and monumental architectural
    marvels [1].


    Historically, the emphasis within geotechnical engineering was significantly on
    empirical and observational methods. Techniques involved comprehensive field investigations,
    laboratory testing of samples, and the use of deterministic models to assess the
    behavior of earth materials [2]. However, as the urban sprawl began demanding
    more from the earth, the discipline faced increasing challenges, many of which
    lay beyond the scope of conventional methodologies.


    Enter the age of computational advancements. The latter part of the twentieth
    century witnessed the integration of computational methods into geotechnical engineering,
    offering more sophisticated ways to analyze and predict earth materials behaviors.
    Yet, with the emergence of the twenty-first century and the computational tools
    it brought merely a steppingstone to what lay ahead: the union of ML with geotechnical
    engineering. Machine learning, a subset of artificial intelligence, has demonstrated
    remarkable success in various sectors, from finance to healthcare, largely attributed
    to its prowess in pattern recognition and predictive analysis [3]. For geotechnical
    engineering, with its complex datasets and myriad variables, the integration of
    ML can be nothing short of revolutionary.


    # 1.2 Purpose of the study


    Navigating this transformative era, our chapter seeks to illuminate the potential
    of ML in geotechnical engineering, especially within the domain of risk assessment.
    The union of computational capabilities of ML with the fundamental principles
    of geotechnical engineering is an avenue yet to be fully explored. We aim to probe
    this integration, discerning its potential in amplifying risk assessment capabilities,
    and setting the stage for a new era of predictive geotechnical analysis.


    This journey will take us through the very fabric of ML geotechnical datasets,
    case studies, and real-world applications. From forecasting soil behaviors that
    traditionally took weeks of lab testing, to real-time monitoring of infrastructural
    health, and predicting vulnerabilities in massive earth-retaining structures,
    the applications are as vast as they are groundbreaking.


    # 2. Traditional methods in geotechnical risk assessment


    Before the ascent of computational methods and ML, geotechnical engineering primarily
    relied on traditional methodologies that have been honed over decades of'
