    index of each topic to which the newspaper pertains. It is evident some news topics
    are more appealing than others, and therefore people may show more interest in
    discussing them. As the topics produced by the model are not arranged in any order
    (see Section 4.3), I establish a popularity index for each topic by ranking them.
    The initial step in developing this index involves constructing social network
    corpora for users who speak English and Chinese.


    I collected a total of 15,236,749 tweets from the English corpus between 10 October
    2018 and 8 August 2019 using the Twitter API. The specific keywords used to query
    the API were "tradewar", "tradewers", "MAGA", "trade", and "USChina". Subsequently,
    a subset of 30,437 unique narratives was constructed by random selection. It is
    assumed that these tweets relate to the 2019 US-China trade war encompass current
    economic and political narratives, which are of interest for this study. For the
    Chinese corpus, I utilised the Weibo timeline API, a popular social networking
    platform in similar to Twitter, to collect 3,194,226 narratives between May 29,
    2019, and October 17, 2018.


    Unlike the Twitter API, the Weibo API does not offer a query feature to the topics.
    Therefore, I collected general data on topics to build my Chinese corpus.


    In the second step of the analysis, I construct $p$ by $q$ matrix $T$, where $p$
    represents the number of topics selected in the topic model and $q$ represents
    the top $q$ terms generated by the model that are of interest. For the primary
    analysis, I set $p = 850$ for the English corpus, and $q = 12$. $T_{\mu}$ is utilised
    to capture the count of words in row $\mu$ and column $v$ in **Figure 6** and
    **Figure 7**, as presented in Section 6.1, for each topic network. I compute the
    popularity $\rho_\mu$,


    ```

    $$P_{\mu} = \sum_{i=1}^q T_{\mu i} \times W_{\mu i},$ \quad (5)$

    ```


    where $W_{\mu}$ represents the estimated probability that a word in column $v$
    belongs to topic $\mu$, generated by the topic model. It should be noted that
    $P$ is a column vector with $p$ dimensions. To obtain the popularity index vector,
    $\rho$ is normalized


    ```

    $$P^* = \frac{P}{\|P\|_2} = [\rho_1, \rho_2, \dots, \rho_p]^T,$ \quad (6)$

    ```


    where $\|P\|_2$ is the $l^2$-norm of $P$, and the average popularity index $\rho_t$
    at time $t$ can be expressed as


    ```

    $$\rho_{it} = \frac{\sum_{x \in t} \rho_x}{N_{it}} \quad \text{s.t.} \quad \text{card}(T_x)
    = N_{it}, \rho_x \in P^*,$ \quad (7)$

    ```'
