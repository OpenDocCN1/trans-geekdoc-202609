    The proposed LMU-GRUs compression and decompression module, as shown in Table
    3, reduces the number of parameters by over 100 times and the number of FLOPs
    by at least 4 times [17]. The comparison results show that our new LMU-GRUs architecture
    for CSI compression is a significant step forward in expanding the range of practical
    applications for deep learning-based CSI encoding, feedback, and reconstruction
    in massive MIMO wireless systems.


    # 4. Conclusion


    This chapter presents a channel state information (CSI) feedback network by extending
    the DL-based CSINet technique to incorporate GRUs and LMU over GRU layers. The
    proposed LMU-GRUs technique achieved the number of parameters and MACCS compared
    to other CS-based and CSI-based methods. The work is motivated by the active use
    of recurrent convolutional neural network (RCNN) model size and computational
    complexity of tested networks using a channel state information network. The basic
    concept is to control the complexity analysis in deep learning techniques using
    the COST 2100 model to get results related to indicators parameters in time-varying
    MIMO channels and acquire training samples.


    # 5. Recommendations for future work


    Quantum-assisted Deep Learning (QDL) is receiving significant attention towards
    enhancing performance metrics of communication networks. The classical DL faces
    various challenges; where a substantial challenge is to figure out the training
    method for complex topologies of neural networks (NNs) (which are of similar complexity
    to that of the natural structure of the human brain).


