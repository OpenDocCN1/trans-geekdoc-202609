  md: '# Complexity Analysis in Channel Estimation Massive MIMO Compared with LMU
    and GRU


    Hany Helmy, Sherif El Diasty and Hazem Shatila


    # # Abstract


    MIMO: Multiple-input multiple-output channel technology uses multiple antennas
    to use reflected signals to provide channel robustness and throughput gains. It
    is advantageous in several applications like cellular systems, users are distributed
    over a wide coverage area in various applications such as mobile systems, improving
    channel state information (CSI) processing efficiency in massive MIMO systems.
    This chapter proposes two channel-based deep learning methods gated recurrent
    unit and a Legendre memory unit to enhance the performance in a massive MIMO system
    and compares the complexity analysis to the previous methods. The complexity analysis
    is based on the channel state information network connected with gated recurrent
    units and Legendre memory unit to indicator parameters which show the difference
    between literature-based techniques.


    **Keywords**: MIMO, FDD, compressed sensing, deep learning, conventional neural
    network, complexity analysis, gated recurrent unit, Legendre memory unit


    # # 1. Introduction


    Complexity analysis in deep learning is a fascinating topic when delving into
    the realm of deep learning, we often encounter intricate models with numerous
    layers and countless parameters [1]. It is essential for models to truly understand
    their inner workings. Now, complexity analysis in deep learning involves assessing
    the computational requirements and efficiency of these models. One commonly used
    metric is time complexity, which examines how the computational costs increase
    with the input size [2]. It allows us to estimate the computational resources
    needed for training and inference tasks.


    Another aspect to consider is the space complexity, which examines the memory
    requirements of deep learning models. As the number of layers and parameters grows,
    so does the memory needed to store them [3]. Understanding this helps us optimize
    memory usage and select suitable hardware for our neural networks. However, it''s
    worth mentioning that deep learning is an ever-evolving field, and complexity
    analysis is just a small part of the puzzle.'
