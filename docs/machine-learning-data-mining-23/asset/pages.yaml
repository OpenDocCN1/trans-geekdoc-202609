    Applying a finetuning, and thus creating both a new specialist model in the area
    in question and also a specialist tokenizer, 1819 new tokens were added. After
    training in four epochs, the new model was created, expressing a perplexity at
    a value of 2.17. Perplexity is a measure of how well a probability distribution
    or probability model predicts a sample. Can be used to compare probability models.
    A low perplexity indicates that the probability distribution is good at predicting
    the sample.


    The values found using the created expert model, are presented in Table 6.

    In general, BERTimbau model presented better results compared to machine learning
    algorithms. Figure 7 presents the comparative values between BERTimbau model stages.


    By observing the values shown in the table above, it is clearly seen that in the
    vast majority of situations in which the classes were presented, the performance
    of the adjusted model was better than all previously tested models.


    # 4. Conclusions


    The Transformer architecture has become the dominant architecture for natural
    language processing, frequently outperforming models as convolutional neural networks
    and recurrent networks in different tasks [14]. Pre-trained models are able to
    be trained on generic or specialist sets and, consequently, are easily adapted
    to tasks with excellent performance. The architecture is particularly conducive
    to large corpora pre-training, providing accuracy increase in later tasks, such
    as text classification, language comprehension, and more.'
