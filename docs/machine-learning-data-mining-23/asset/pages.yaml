    investigations, which can disturb local ecosystems or even local communities.
    There''s an increasing need for methods that are not technically sound but also
    environmentally friendly and socially responsible [14].


    +   * **Sustainability concerns**: Traditional risk assessment might not always
    factor in long-term environmental implications. For example, certain foundation
    techniques might alter local groundwater flow, leading to unintended environmental
    consequences in the future.


    +   * **Ethical implications**: Intrusive site investigations or large-scale excavations
    might disrupt local communities, either by displacing them or affecting their
    local environment. Traditional methods need to evolve to ensure that geotechnical
    work respects both the physical and socio-cultural landscapes.


    # 4. Machine learning: a paradigm shift in geotechnical risk assessment


    In the last two decades, the realms of data analytics and computational power
    have grown exponentially, transcending across a myriad of disciplines. One beneficiary
    is the field of geotechnical engineering, which has always grappled with uncertainties
    inherent to its subject matter: the earths. The incorporation of ML techniques
    is not just as an enhancement, but a potential game-changer in deciphering the
    cryptic terrains and soils below few [15].


    Table 2 offers a side-by-side comparison of traditional risk assessment methods
    with their ML counterparts. By analyzing their features, benefits, and limits,
    the table provides a holistic view of how the two approaches fare in various factors
    of risk evaluation. Notably, ML often presents advantages in data processing speeds
    and predictive accuracy. However, they require vast datasets for optimal functionality.
