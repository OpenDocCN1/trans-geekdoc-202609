  md: '# Machine Learning and Data Mining Annual Volume 2023


    There are always new challenges, surprises, and complexities waiting to be unveiled.
    It''s a journey that continues to captivate and intrigue scientists and enthusiasts
    alike. The history of complexity analysis in deep learning. It is indeed an intriguing
    subject. The path to understanding the complexity of deep learning has been paved
    with triumphs and challenges. Back in the early days, when I first ventured into
    the realm of theoretical physics, we were only scratching the surface of what
    would later become known as deep learning [4]. The concept of neural networks
    has been around for some time, but with the advent of powerful, computational
    capacities truly allowed us to explore their potential. As we delved deeper, we
    began to realize that the complexity of deep learning models was no trivial matter.


    The number of parameters, the intricate interconnections, and the sheer depth
    of these networks made a fascinating puzzle to unravel. The primary challenge
    was to develop methods for analyzing and understanding the complexity of these
    models. We needed tools that could help us comprehend the behavior of deep learning
    systems, predict their performance, and discern their limitations. Over time,
    researchers developed various approaches to complexity analysis in deep learning
    [5]. They ranged from straightforward measures like counting the number of parameters
    or layers, to more sophisticated techniques such as analyzing the network''s computational
    and memory requirements. Additionally, advancements were made in characterizing
    the computational complexity of training deep learning models. The notion of time
    and resource complexity became crucial in comprehending the training process and
    predicting how long it might take, given a certain dataset and architecture [6].


    # 2. Complexity analysis


    # 2.1 Performance and complexity trade-off of LMU and GRU


    The Legendre Memory Unit (LMU) is mathematically derived to orthogonalize its
    continuous-time history — by solving d coupled ordinary differential equations
    (ODEs), whose phase space linearly onto sliding windows of time via the Legendre
    polynomials to order d-1.


    The Gated Recurrent Unit (GRU) is a type of Recurrent Neural Network (RNN) which,
    in cases, has advantages over long-term memory (LSTM) (Figure 1). GRU uses less
    memory and is faster than LSTM, however, LSTM is more accurate when using datasets
    with longer sequences (Figure 2).


    The RNNs for CSI compression and reconstruction of massive MIMO systems have a
    remarkable number of parameters. The recurrent neural network model, for example,
    can add up to 10⁷ more parameters, raising storage and computation difficulties.
    To reduce the computational complexity and required memory, a fully connected-layer
    autoencoder has been developed for channel state information feedback in time-varying
    channels [9].


    While research investigated recurrent neural networks RNNs, the least computationally
    expensive of these models still need 10⁷ parameters per snapshot. When the compression
    ratio is small, the networks also suffer from a significant drop in feedback performance
    because they must keep the same compression ratio in successive time slots and
    cannot obtain previous information in the first time slot [10]. Despite the reported
    performance of “stacked” GRUs, the'
