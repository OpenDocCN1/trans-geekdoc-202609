    # 2.4 Random forest


    Random forest (RF) [28] is a classifier that employs multiple decision trees for
    training and prediction. RF is essentially an ensemble system in machine learning
    [29]. As an emerging and highly flexible machine learning algorithm, RF has a
    broad range of options, from healthcare insurance to medical marketing. RF can
    be used to predict disease risks and the susceptibility of patient populations
    [30]. RF builds upon decision trees (DT), utilizing knowledge learned from the
    dataset to classify new data. By setting parameters such as the number of trees
    and branching, multiple DT models are constructed. The final output is determined
    by the collective decisions of all the decision trees, achieving optimal classification
    accuracy that surpasses others.


    The RF algorithm also incorporates the Bagging approach. To explain intuitively,
    each decision tree is a classifier, resulting in N outcomes for an input sample
    N trees. RF aggregates all classification votes and designates the class with
    the highest vote count as the final output. RF boasts several advantages, such
    as handling missing values, not requiring dimension reduction for high-dimensional
    data, and introducing randomness to prevent overfitting. Essentially, RF acts
    as a versatile powerhouse in the field of machine learning, accommodating a wide
    array of universally applicable. RF is particularly useful in estimating inference
    mappings, and its versatility renders it utterly useful. It does not require extensive
    parameter tuning and validation such as support vector machines (SVM) and yields
    higher accuracy [31].


    I have over 10,000 clinical cases to construct RF predictive models for chronic
    diseases such as diabetes, hypertension, and hyperlipidemia. Analyzing the results
    from the confusion matrix comparison between the RF and simultaneously constructed
    SVM and neural networks, there is a significant gap between the weighted average
    (avg) and macro average (macro avg). This discrepancy is attributed to the fact
    that macro avg is the arithmetic mean of indicators for each class, assigning
    equal weight to each class and disregarding the issue of sample imbalance. In
    cases of imbalanced class distribution, each class''s performance receives equal
    attention. In contrast, weighted is a weighted average, calculated by averaging
    over class with the sample size used as the weight. In the case of imbalanced
    class distribution, the weighted average places more emphasis on classes with
    larger sample sizes while attenuating the performance of classes with smaller
    sample sizes. However, the RF algorithm, with SVM and neural networks, might perform
    better when dealing with large datasets, high-dimensional datasets, and datasets
    with complex decision boundaries. It is worthy of broader adoption in clinical
    research.


