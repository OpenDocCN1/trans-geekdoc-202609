    confident in stating that the lesion is of benign origin. If the physician is
    in doubt, the result can not be classified as BI-RADS 2, but as BI-RADS 3. Therefore,
    in practice, a BI-RADS 2 result has the same clinical value as a BI-RADS 1. The
    risk of malignant lesion is 0%.


    # 2.1.4 BI-RADS category 3 - probably benign findings


    When the radiologist classifies the result as BI-RADS [1], it means that some
    alteration was found in the images, which is probably benign, but is not 100%
    safe. As the doctor is also sure that the lesion is benign, if he has the slightest
    doubt, the classification should be category 3. Therefore, a result in category
    3 indicates a lesion with very low risk of malignancy, which does not need to
    be biopsied initially, but as a precaution, should be followed closely over the
    next 2 years. The risk of malignant lesions in BI-RADS 3 is only 2%, which is,
    98% of cases are actually benign lesions.


    # 2.1.5 BI-RADS category 4 - suspicious findings


    When the radiologist classifies the result as BI-RADS 4 [1], it means that some
    alteration was found in the images, which may be cancer, but is not necessarily.
    All patients with a BI-RADS 4 result should undergo biopsy of the lesion so that
    the correct diagnosis can be established. Category 4 is usually divided into 3
    subcategories according to cancer risk:


    +   - BI-RADS 4A - Lesion with low suspicion of malignancy – 2 to 10% risk of
    cancer.

    - BI-RADS 4B - Lesion with moderate suspicion of malignancy – 11 to 50% risk of
    cancer.

    - BI-RADS 4C – Lesion with high suspicion of malignancy – 51 to 95% risk of cancer.


    Regardless of the BI-RADS 4 subcategory, all cases undergo biopsy. The difference
    is that in the patient with BI-RADS 4A, the biopsy is expected to confirm a benign
    lesion, while in the BI-RADS 4C, the biopsy is expected to confirm the diagnosis
    of cancer.


    # 2.1.6 BI-RADS category 5 - high cancer risk


    When the radiologist classifies the result as BI-RADS 5 [1], it means that some
    alteration was found in the images, which most certainly is derived from breast
    cancer. Breast lesions with typical features of cancer include dense, spiculated
    nodules, pleomorphic calcifications, lesions with skin retraction or distortions
    of breast architecture, or linear calcifications in a segment of the breast. Thus,
    all category 5 lesions should be biopsied and the risk of malignancy in a BI-RADS
    5 classification is greater than 95%.


    # 2.1.7 BI-RADS category 6 - Previously known malignant lesion


    The BI-RADS 6 classification [1] is only used in patients who already have a diagnosis
    of breast cancer established and end up undergoing a diagnostic'
