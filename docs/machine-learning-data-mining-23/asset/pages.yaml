    # 3.5 Difficulty in real-time monitoring and prediction


    While traditional methods excel in pre-construction assessments, real-time monitoring
    during and post-construction can be challenging. Continuous monitoring setups,
    if established, often demand significant resources, and might not be adept at
    predicting unforeseen failures swiftly [11].


    # 3.6 Empirical nature of traditional models


    A significant portion of traditional geotechnical engineering models are empirically
    derived. These models, developed from observed behavior in specific conditions,
    might not universally apply across varied geographies or under different circumstances
    [12]. While they offer a starting point, relying on empirical models might lead
    to potential inaccuracies.


    +   - Regional limits: Many empirical models were derived from studies in specific
    regions, reflecting the local geology and environmental conditions. Applying these
    models to regions with different geological histories or climates might introduce
    errors. For instance, a model developed in the temperate climates of Europe might
    not necessarily seem applicable to the tropical regions of Southeast Asia.


    +   - Aging of empirical data: As our understanding of geotechnical behavior advances
    and technological tools become more sophisticated, older models might become outdated.
    These models, while still valuable, might not capture the nuances that research
    and technology have unveiled.


    # 3.7 Challenges in large-scale integration


    Geotechnical risk assessment needs to be integrated with other domains, such as
    structural engineering, hydrology, and environmental science. Traditional methods,
    often siloed, can sometimes face challenges in this multi-disciplinary integration
    [13]. Addressing a problem from a purely geotechnical standpoint might overlook
    interactions and feedback loops from other domains, leading to potential miscalculations.


    +   - Data compatibility issues: When interfacing with other domains, data compatibility
    becomes a challenge. Different fields use varying metrics, scales, or data formats.
    Manually harmonizing this data is not only timeconsuming but also prone to errors.


    +   - Complexity in multi-disciplinary communication: Effective risk assessment
    in large projects requires seamless communication between different teams. Traditional
    methods, with their unique terminologies and approaches, may pose barriers in
    multi-disciplinary communication, leading to potential misunderstandings or oversights.


    # 3.8 Environmental and ethical considerations


    With increasing emphasis on sustainable and ethical engineering practices, traditional
    geotechnical methods face scrutiny. Some methods might involve intrusive site'
