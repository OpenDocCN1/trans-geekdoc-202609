  img_proc: true
- pgno: 118
  md: '# Machine Learning and Data Mining Annual Volume 2023


    clinical records, using Deep Learning and NLP (Natural Language Processing). The
    main goal is to verify the performance of BERTimbau model [2] in BI-RADS classification
    from breast magnet resonance imaging clinical records. Machine learning models
    were also used to classify BI-RADS, in order to establish a baseline. The following
    models were implemented and compared: Random Forest, SVM, Naive Bayes, BERTimbau
    with and without tuning.


    After submitting a dataset 8813 records of medical texts to deep learning, new
    expert model based on existing rules was created for automated BI-RADS category
    classification in breast MRI reports, using supervised machine learning approach.
    In addition to being able to classify medical texts related to breast MRIs to
    their corresponding BI-RADS, the model will be able to inform about the quality
    of the medical record, in relation to pre-existing statistics.


    # 2. Materials and method


    # 2.1 BI-RADS


    BI-RADS [1], is an acronym for Breast Imaging-Reporting and Data System, a quality
    assurance tool originally designed for using in mammography. The collaborative
    effort of many health care groups is published and copyrighted by the American
    College of Radiology (ACR). The system was designed to standardize clinical reporting
    and is used by medical professionals to communicate a patient’s risk of developing
    breast cancer, particularly for patients with dense breast tissue. The document
    focuses on patient reports used by medical professionals. The six classification
    categories of the American College of Radiology are described below.


    # 2.1.1 BI-RADS category 0 - inconclusive


    When the radiologist classifies the results as BI-RADS 0 [1], it means that the
    examination was considered inconclusive or incomplete. Causes include technical
    factors, such as poor image quality, which may be due to improper breastfeeding
    or patient movement during the exam. Category 0 can also be assigned when there
    is doubt about the existence or not of an injury, requiring another image exam
    to test the latter.


    # 2.1.2 BI-RADS category 1: Normal or negative


    When the radiologist classifies the results as BI-RADS 1 [1], it means that no
    alteration was present. The breast is completely normal. The breasts are symmetrical
    and do not present masses, architectural distortions or suspicious calcifications.
    The risk of malignant lesion in an exam classified as category 1 is 0%.


    # 2.1.3 BI-RADS category 2: Certainly benign findings


    When the radiologist classifies the results as BI-RADS 2 [1], it means that some
    alteration was found in the images, but that the characteristics of the lesion
    allow us to state that it is benign. To be classified as category 2, the physician
    needs to be'
