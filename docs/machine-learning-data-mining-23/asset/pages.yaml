  md: '# Automatic BI-RADS Classification of Breast Magnetic Resonance Medical Records
    Using Transformer-Based Models for Brazilian Portuguese


    Ricardo de Oliveira, Bruno Menezes, Júnia Ortiz and Erick Nascimento


    # Abstract


    This chapter aims to present a classification model for categorizing textual records
    of breast magnetic resonance imaging, based on lexical, syntactic and semantic
    analysis of clinical reports according to the Breast Imaging-Reporting and Data
    System (BI-RADS) classification, using Deep Learning and Natural Language Processing
    (NLP). The model was developed from transfer learning based on the pre-trained
    BERTimbau model, BERT (Bidirectional Encoder Representations from Transformers)
    trained in Brazilian Portuguese. The dataset is composed of medical reports in
    Brazilian Portuguese classified into six categories: Inconclusive; Normal or Nearly;
    Benign Findings; Probably Benign Findings; Suspicious Findings; High Risk of Cancer;
    Previously Known Malignant Injury. The following models were implemented and compared:
    Random Forest, SVM, Naive Bayes, BERTimbau with and without finetuning. The BERTimbau
    model presented better results, with better performance after finetuning.


    **Keywords:** BI-RADS, deep learning, transformers, BERTimbau, Portuguese NLP


    # ## Introduction


    The healthcare sector is characterized as a large data catalyst, contained in
    medical records, reports, test results and so. In case of textual medical records,
    the correctly classification of unstructured parts of the texts incorporated into
    medical documents can support healthcare professionals for managing relevant data
    effectively and efficiently, organizing the data related to patients and their
    findings in diagnostic tests.


    This work presents a classification system for categorization of BI-RADS [1],
    based on lexical, syntactic, and semantic analysis of documents, derived from
    textual'
