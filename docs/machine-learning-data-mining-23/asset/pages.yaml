    # 2.3 Media and censorship system


    Montiel al. investigate production of nationalism in the national media during
    an international conflict [23]. Nationalism also has an effect on the public media.
    Studying the India-Pakistan military conflict of 29 September 2016, Pandit and
    Chattopadhyay argues that the news media in India has always adhered to belligerent
    voices of patriotism and consciously obscured the disagreement of minority voices
    [24]. The strong correlation between media reporting and nationalism allows us
    to use media as a proxy for measuring nationalism. Using news articles allows
    us to measure nationalism, another problem in this measure is the effects of a
    news censorship system used by some governments.


    China''s censorship system limits coverage of information deemed harmful to the
    stability of its regime. In general, this type of media censorship is seen as
    part of authoritarian control of information to maintain the power of the regime
    and increase control over public sentiment. It is widely believed that authoritarian
    inevitably limit media independence. For instance, Lorenz argues that China strategically
    adjusts the number of reports based on potential tensions [25]. King et al. use
    textual analysis of social media to compare content before after the government
    imposes censorship to show that censorship is designed to prevent collective activity
    or activity that may occur in the future [26]. From the Chinese authorities''
    point of view, censorship is a means of ensuring that news content is in the interest
    of the government. Therefore, by comparing the differences in the effects of nationalism
    on the US and China during the natural experiment of the trade war, it is possible
    to identify the effect of the media censorship system. In addition, we can determine
    whether nationalism sparked by the trade war is in the interest of the government.


    # 3. Factiva news and trade data


