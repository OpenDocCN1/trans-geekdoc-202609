    # 7.3 Transfer learning and global risk prediction models


    Transfer learning is the practice of applying knowledge gained from one task to
    a different, related, task. In geotechnical terms, this means that an ML model
    trained on data from one geographic region can be adapted to make predictions
    in another region, given some fine-tuning. This approach can be particularly beneficial
    in areas where data is scarce, allowing engineers to leverage global datasets
    for local risk predictions [52].


