    ITxLL110794


    In this chapter, I measure the level of nationalism in English and Chinese regions
    using sentiment consistency in the mainstream press. I also discuss the role of
    the news censorship system in China during the 2019 US-China war and compare it
    with the press in the US, which has a higher degree of media freedom. To study
    the strategies that governments adopt to manage nationalism during international
    conflicts, it is first necessary to find an indicator based on the textual analysis
    of newspapers to capture the degree of emotional deviation between newspapers.
    After controlling for media bias and other macro factors, this consistency indicator
    can be used to measure the level of nationalism. In addition, examine government
    interference in news content, I use the 2019 US-China trade war as a natural experiment
    to identify the role of news censorship on nationalism and the effects of nationalism
    on the relations between the two parties engaged in a dispute. Identifying the
    position of the negotiating parties on nationalism can provide a means of determining
    the relative bargaining power of the parties and the possible outcome of negotiation.


    This chapter is organised as follows. Section 2 reviews the literature on nationalism
    and the outcomes of trades war to clearly explain the concept of my natural experiment.
    Section 3 describes how I construct my data set to measure nationalism and relations
    between the US and China. Section 4 presents my approach to transform my data
    into metrics. Section 5 indicates the conceptual framework and key variables for
    empirical analysis. Section 6 presents my main results on how news censorship
    affects US-China relations at the time of the trade war. Section 7 tests the robustness
    of my main results and in Section 8 I offer


    # 2. Literature review


    # 2.1 Nationalism


    Nationalism is an important factor in the economy, although economists often overlook
    it. Breton shows that political nationalism can influence countries'' capital
    investment in resources in nationality or ethnicity by household, business and
    government. It is important to first define nationalism. Hayes [17] divides nationalism
    into four types:


    > "It stands in the first place for an actual historical process, that of establishing
    nationalities as political units, of building out of tribes and empires the modern
    institution of the national state. Secondly, the term indicates the theory, principle,
    or ideal in actual historical process; in this sense it signifies both an intensification
    of connectedness and a philosophy of the national state. Thirdly, it may mean,
    in phrases as ''Irish nationalism'' or ''Chinese nationalism'', the activities
    of a particular political party, combining an historical process and a political
