    # 2.1 Overview of traditional risk assessment


    Risk assessment in geotechnical engineering is rooted in a combination of observational
    and empirical methods. Over the years, practitioners have leaned heavily on field
    investigations, laboratory testing, and the application of deterministic models
    to understand and predict the behavior of soils, rocks, and other related materials.
    The crux of these methods lies in assessing how earth materials will respond under
    different loading and environmental conditions, informing the safety and feasibility
    of various construction projects.


    Historically, these methods have had to balance between being rigorous and pragmatic.
    Due to the inherent variability of soil and rock properties across different sites,
    geotechnical engineers have often tasked with making decisions based on limited
    data, relying on their expertise and the accumulated knowledge of the field [4].


    # 2.2 Field investigations


    The foundation of any geotechnical project is comprehensive field investigation.
    By gathering information about the site''s subsurface conditions, engineers can
    make informed decisions about design and construction. Common field tests include:


    +   * Boring and sampling: This involves retrieving soil or rock samples from
    various depths using different boring equipment. These samples are tested in laboratories
    to determine their properties.


    +   * In-situ tests: Tests like the Standard Penetration Test (SPT) and Cone Penetration
    Test (CP) are used to assess soil characteristics directly at the site.


    # 2.3 Laboratory testing


    Once samples are collected from the field, they undergo a series of laboratory
    tests to evaluate their mechanical and physical properties. These tests can include:


    +   * Shear strength tests: These tests, like the Direct Shear Test and Triaxial
    Shear Test, assess the soil''s resistance to shearing stresses.'
