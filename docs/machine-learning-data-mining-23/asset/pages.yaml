    # 5.2.1 Time series analysis for demand planning and forecasting


    Time series analysis analyzing historical data before forecasting. Time series
    methodologies are classed and considered to be the mining of complex data types
    described as a sequence of ordered events numerically, as customer demand recorded
    at time intervals [33]. Forecasting customer demand involves the time component
    as an independent variable and estimating future demand based on observed historical
    data and current demand signals.


    In a recent review of predictive BDA for supply chain forecasting, authors [3]
    highlight a growing trend and increase in the application of BDA techniques such
    as but not limited to Neural Networks, regression, ARIMA, Support vector machine
    (SVM), and decision trees within the area of SC forecasting. The application of
    these methods addresses the drawbacks of conventional time series techniques,
    such as the high reliance on domain knowledge and the ability to incorporate external
    factors and compute complex non-linear customer behavior and relationships.


    Seeking evidence of improved SC forecasting through BDA techniques, the research
    employed and five well-established time series methods [34]. The time series techniques
    were grouped into two categories a) conventional time series techniques, namely
    Holt-Winters and ARIMA, and b) BDT-enabled time series techniques, namely Sarimax,
    Atibat, and Neural Networks. These techniques are briefly described in Appendix
    B. The forecast accuracy of each time series models employed was benchmarked using
    several measures described in Appendix C, followed by a business-relevant interpretation.


