    # 2.4 Deterministic models


    Geotechnical engineers have traditionally relied on deterministic models to predict
    the behavior of soils and rocks under specific conditions. These, rooted in the
    fundamentals of soil mechanics and rock mechanics, offer mathematical formulations
    to estimate behaviors such as bearing capacity, slope stability, and soil settlement.
    A classic example that exemplifies these deterministic models is Terzaghi''s Bearing
    Capacity Equation, expressed in Eq. (1). This equation is widely used in foundation
    design to determine the maximum load a soil can support without failure. The parameters
    in the equation include the effective cohesion of the soil, unit weight, depth,
    and effective width of the foundation, along with bearing capacity factors that
    are intrinsically tied to the internal friction angle.


    ```

    $q_u = c''N_c + \gamma D_q N_q + 0.5\gamma B N_gamma$

    ```


    where: $q_u$ = ultimate bearing capacity of the soil; $c''$ = effective cohesion
    of the soil; $D_q$ = depth of foundation; $B''$ = effective width of the foundation;
    $N_c, N_q, N_\gamma$ = bearing capacity factors, which are functions of the internal
    friction angle ($\phi''$) of the soil.


    While these traditional methods have been instrumental in advancing the field,
    they are not devoid of limitations. The next section will delve into some of these
    constraints, setting the stage for understanding the need for ML in enhancing
    geotechnical risk assessment.


    # 3. Constraints and limitations of traditional geotechnical risk assessment


    The traditional methodologies underpinning geotechnical risk assessment, while
    historically effective, are not without limitations, especially when considering
    the intricate, unpredictable nature of soil and rock behavior. Let us delve into
    these constraints in greater detail.


    # 3.1 Inherent variability of soil and rock


    Unlike manufactured materials whose properties can be standardized, soils and
    rocks possess a high degree of variability. Within a few meters, the geological
    history, deposition environment, and subsequent processes can significantly alter
    the mechanical and physical properties of these materials. Traditional methods
    often use average values or best estimates, which might overlook crucial local
    variations [5]. This variability means that even with meticulous sampling, unexpected
    behaviors can emerge, posing challenges in prediction and risk management.


    +   - Spatial variability: The spatial distribution of soil and rock properties
    can vary considerably. Conventional assessment often involves interpolating data
    between sampling points, but this assumes uniformity between these points, which
    might not be accurate. **Figure 1** offers a visual insight into the layered layers
    and inconsistencies in soil composition across a small region. Different colors'
