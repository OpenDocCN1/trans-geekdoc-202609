  md: '# epop''s General Syntax


    DOI: 10.1201/9781032687759-B


    Version: alpha/prototype: 0.19 – May, 2025

    License: Boost Software License - Version 1.0 -

    August 17th, 2003

    Contact: epop@SystemGoats.com


    # B.1 EPOP''S GENERAL SYNTAX


    These are the general rules for programming in epop. Individual words have their
    own rules, as documented below.


    epop syntax is run either at the epop> prompt or in a stand-alone epop program
    file using the RUN word. To invoke epop from the command-line, just enter: epop.
    That will start epop and display its prompt as:


    ```

    epop>

    ```'
  merge: -1
  img_proc: true
- pgno: 538
  md: 'Words and data can be entered at the prompt. Entries must be separated by at
    least one space, such as:


    ```

    epop> 6 8 SWAP SQUARE . CR

    epop> 36

    ```


    If a word entry is recognized, it is interpreted accordingly. Otherwise, the entry
    is designated as data and pushed onto the data stack as a number or string (one
    or more characters strung together that may form a word).


    # B.2 DATA CONTAINERS


    epop''s three data stacks are called: data stack, return stack and temporary stack.
    These stacks accommodate the following data types: strings (a sequence of characters),
    floating point numbers (numbers having decimal places), tables, and executable
    words. Integers are treated as floating point numbers by default.


    If a word (function) requires data, then data must already exist on the data stack
    for the word to execute without error.


    Apart from the data stacks, data can be stored in table objects or in SQL database
    tables. Both of these types of tables are designed with three columns to quickly
    facilitate simultaneous data transfer to and from the three data stacks. Accordingly,
    SQL queries having more than three'
  merge: -1
  img_proc: true
- pgno: 539
  md: 'columns of output are limited to three columns when the output is directed
    back to the three stacks.


    # ## B.3 POSTFIX


    Words that process data operate in postfix mode, such as:


    ```

    `operand1 operand2 operation`

    ```


    Or:


    ```

    `data data word`

    ```


    Data can be the output of a preceding word and a word in this series may, itself,
    produce data for the next word. In this way words may be used as arguments for
    subsequently postfixed words.


    # ## B.4 WORDS AS ARGUMENTS


    The arguments for a word can have the following form:


    +   * Numbers, characters, strings, functions (words).

    +   * Self-reference (recursion): A word that refers to itself.

    +   * Tick word: A word stored as data on the data stack.

    +   * Lambda expression: A nameless function containing functional words and/or
    data.

    +   * Captured word: A word inside the { scope } or definition of another word.

    +   * Pipe: Bypass the data stack with one word''s output being the next word''s
    input. The output could be a'
  merge: -1
  img_proc: true
- pgno: 540
  md: 'value or a word as well.


    These argument forms will be explained through the remainder of this section.


    Words may be used as arguments for other words, as needed for the purposes of
    branching, repetition, etc. For example, repetition can be induced by having a
    word refer to itself (aka *recursion*), such as:


    ```

    { + DUP 10 < sum ? } sum WORD

    ```


    Words that are defined recursively should usually make the self-reference conditional
    (the above example is conditional on sum < 10). Otherwise, to use a recursive
    word unconditionally without errors, it must be predefined, such as:


    ```

    { } sum WORD

    { + sum DUP 10 < sum ? } sum WORD

    ```


    Instead of recursion, the LREPEAT word can be used for repetition. LREPEAT repeats
    an expression inside of { } braces. The following code will repeat an operation
    of addition ten times:


    ```

    { + } 10 LREPEAT

    ```


    Alternatively, REPEAT can be used such as:


    ```

    + '' 10 REPEAT

    ```'
  merge: -1
  img_proc: true
- pgno: 541
  md: 'Instead of recursion, the REPEAT word can be used for repetition. For example,
    the following code will repeat an operation of addition ten times:


    ```

    + '' 10 REPEAT

    ```


    The tick mark after the + sign ensures the operations of addition is not immediately
    invoked, but is instead delegated to a subsequent word for whatever the purpose
    of the subsequent word. In this case, the + operation is an argument of REPEAT,
    which repeats + 10 times.


    For some words it is not necessary to follow the argument with a tick. Such words
    are referred to as inline words. For example, the inline word IFELSE takes two
    unticked words as arguments to branch conditionally depending on a 0 or 1 on top
    of the data stack (assume “if” and “else” here were already defined):


    ```

    if else IFELSE

    ```


    (see more about tick and inline words below).


    Incidentally, prefixing a word with #, such as #w, allows only its name to be
    put on the data stack instead of the word''s executable object. This means that
    only its stored definition will be put into effect if called from the data stack,
    as when using EXEC (any interim changes to the word''s definition will be ignored).'
  merge: -1
  img_proc: true
- pgno: 542
  md: 'A lambda expression is a nameless function containing functions and/or data.
    A lambda expression may formally be referred to as a *combinator* if it has no
    external dependencies. Words inside of lambda expressions, such as { w1 w2 ...
    wN }, can serve as arguments for other words following the expression in a postfixed
    operation. For example, a lambda expression may be used temporarily to define
    a new word, such as:


    ```

    { DUP * } square WORD

    ```


    The words enclosed inside the { braces } of a lambda expression may be referred
    to as *higher order functions*, as they are passable to other functions (words).
    For example, consider the following statement that increments a variable n:


    ```

    n = n + 1

    ```


    Here, n + 1 is assigned to the variable n.


    Likewise, in *epop* we can define a word called n+. This example uses *epop*''s
    pre-existing i+ word to increment by 1 the value on top of the data stack:


    ```

    { n @ i+ n ! } n+ WORD

    ```


    To test this new word, initialize the variable n to 0 as:


    ```

    0 n !

    ```'
  merge: -1
  img_proc: true
- pgno: 543
  md: 'Apply n+ a couple times by entering:


    ```

    n+ n+

    ```


    To see the new value of n, use the @ symbol:


    ```

    n @ . CR -> 2

    ```


    Those versed in *functional programming* might ask if *epop* facilitates currying.¹
    For *epop* as well as Forth, currying seems *inapplicable*, with *values sequentially
    processed* from the top of the data stack. Nonetheless, we can finagle a word
    to behave in a curried way. Consider here the word *csos*, for a curried sum of
    squares:


    ```

    { DUP * + 0 > ? } csos WORD

    3 csos 4 csos .

    25

    ```


    Because curried functions process only one argument at a time, the function *csos*
    must be invoked twice in order to exercise two arguments.


    Note the difference between a word sequence and a word that uses a proceeding
    word as an argument. Consider the word sequence: word1 word2. If word1 outputs
    to the data stack and word2 uses the data stack, then word2 will depend on word1.
    This is because word1 is invoked first.


    Due to the compiler''s compilation techniques, certain words cannot be used directly
    as arguments. These include'
  merge: -1
  img_proc: true
- pgno: 544
  md: 'the following words: EAGER, WORD, EXEC, LE, UIF, IFELSE, LREPEAT, LWHILE, ELE,
    ECOMPILE. A workaround to use these words as arguments is to define a temporary
    wrapper word. For example:


    ```

    { UIF } wrapper WORD

    ```


    Pipes are useful for directing output to a certain place within the sequence of
    a subsequent expression or word. For example, if w2 is defined as:


    ```

    { DUP * | | + } w WORD

    ```


    1In some programming languages, currying may be desirable due to certain architectural
    limits. Some interesting related comments by the Forth community here: https://groups.google.com/g/comp.lang.forth/c/5n723nWfgWo/m/FYjgqeBrAwAJ
    ¶


    Then, the final value from w₁ will be inserted at the place denoted by “||” such
    as:


    ```

    w1 || w2

    ```


    # B.5 DEFINING NEW WORDS


    New words can be defined a couple of different ways:


    +   1. Using the prefixed “:” compile operator and then terminating definitions
    using the “;” end-compile operator.'
  merge: -1
  img_proc: true
- pgno: 545
  md: '2. Using braces { } to enclose the word definition postfixed by the name and
    WORD.


    Here are some examples:


    ```

    : myword w1 w2 ;

    ```


    This operation literally “compiles” myword, meaning that its definition is appended
    to the epop dictionary. If myword already exists in the dictionary, then its definition
    is updated.


    Alternative postfixed syntax for defining a new word is:


    ```

    { w1 w2 } myword WORD

    ```


    Words can be defined in terms of other user-defined words or abstract words, as
    well as primitive words. User-defined words decompose to primitive words (functions)
    on the program stack. Because of this, user-defined words are also referred to
    as *reference* words. The composition of a reference word is displayed by using
    the SEE word, such as:


    ```

    myword '' SEE

    w1 w2

    ```


    # B.6 TICK WORDS


    TICK symbolized as “ ’ ”, saves the execution token of a word to the data stack
    for delayed (lazy) evaluation (similar'
  merge: -1
  img_proc: true
- pgno: 546
  md: 'to a function pointer in C). For example, we can store a mini program on the
    data stack such as:


    ```

    4 5 + '' 7 8 - ''

    ```


    We can then run that stored program from the data stack with the following instructions:


    ```

    { EXEC >> } 2 LREPEAT

    -1

    9

    ```


    The “>>” operator rotates the value on the top of the stack to the bottom of the
    stack, allowing LREPEAT to execute all of the operations on the data stack.


    There is special handling of in-line expressions containing tick words. For example,
    the following four expressions each give the same result of 8:


    ```

    3 5 + ''

    3 5 { + '' } LE

    3 5 + ''

    + '' 3 5 GSC i- MOVE

    ```


    Note that “LE” executes a lambda expression and “GSC i-MOVE” moves 2nd value from
    the bottom of the data stack to the top, where GSC provide the count of items
    on the data stack.'
  merge: -1
  img_proc: true
- pgno: 547
  md: 'Two notable words are HD and TL, for getting the head and tail of lists. In
    terms of stack oriented lists, the head of a list is the element at the bottom
    of the stack, and the tail of a list consists of all elements in the stack except
    the head element. Many function definitions can be based on HD and TL. Even though
    HD and TL are built-in to epop, for the sake of explanation, one could define
    them in epop as follows.


    ```

    ( Remove all but the first element on the stack. )

    : hd DROP '' GSC 2 - REPEAT ;

    ( Fetch the first item from the stack and drop it. )

    : tl GSC i- MOVE DROP ;

    ```


    HD and TL are considered list reducers. Similarly useful list reducers in functional
    programming are fold left and fold right functions. Starting from one end of a
    list, these functions apply a specified operator to each element of a list, “folding”
    the result into the next element in the list until there is a final value. A fold
    right function starts at the leftmost value in a list and “folds” to the right.
    A fold left function does the opposite. A fold left application can be understood
    by examining the following foldl definition and invocation, which results in 25:


    ```

    { GSC i- REPEAT } foldl WORD

    1 3 5 7 9 +'' foldl .

    25

    ```'
  merge: -1
  img_proc: true
- pgno: 548
