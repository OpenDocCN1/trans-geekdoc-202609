    # 17.2.2 Binary Tree Traversal Patterns


    Tree traversal can take various approaches, namely *level-order*, *in-order*,
    *pre-order*, and *post-order*. These traversal patterns are shown in Figure 17.7.


    +   * Level-order: Starting at root node [0], visit all nodes from left to right
    on each level before descending to the next level.

    +   * In-order: Starting at the left-most node [0], visit left → root → right.

    +   * Pre-order: Starting at root node [0], visit nodes in order of root → left
    → right.

    +   * Post-order: Starting at root node [0], visit nodes in order of left → right
    → root.


    A breadth-first search of a tree entails a level-order traversal, starting at
    the root and, going from left to right, visiting all the nodes at each level before
    descending to the next level.


    A depth-first search of a tree entails a pre-order traversal that starts at the
    tree root, then traverses the left-most branch as far as possible before moving
