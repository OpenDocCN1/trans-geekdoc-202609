    Using *if* we can define additional Boolean functions in lambda calculus as follows:


    ```

    and(x,y)=λxy.if x y f

    or(x,y)=λxy.if x t y

    not(x)=λx.if x f t

    ```


    For another perspective, the above Boolean functions are translated from lambda
    calculus to *epop*. As before, the key component is the *if* function, defined
    here as “{ t f ?? } if'
