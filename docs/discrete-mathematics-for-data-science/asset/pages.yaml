    There are generally two types of mathematical induction, weak and strong. For
    weak induction, we prove one base case and the given i of the inductive case needs
    only the immediate predecessor of i − 1. If we can show that P(i) is true using
    the assumption that P(i − 1) is true, then the inductive case is complete.


    Strong induction involves proving more than one base case (the number of base
    cases required depends on the situation). Then we assume the statement is true
    for all i < n, and prove the statement must also be true for the next case (i
    = n). That is, assume P(i) is true for all i < n, and show P(n) is true.'
