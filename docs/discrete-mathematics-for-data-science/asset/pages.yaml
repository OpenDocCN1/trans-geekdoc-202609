  md: 'to decode a message need only be made if we first determine that a message
    is probable.1


    Recall in the chapter on *Computability* the discussion of *finite automata*.
    Such systems that are deterministic produce a predetermined output state that
    is always the same for given inputs. Conversely, non-deterministic systems depend
    on possible or probable inputs, which are not known to the system in advance.
    In the context of Information Theory, deterministic finite automata may be considered
    *noiseless channels*. In that sense, probabilistic finite automata would be considered
    *noisy channels*.


    Also in the *Computability* chapter was Figure 22.1, which is appropriate here
    as well.


    ![](img/ff796e63b14a88ab72583e78f3994e90_492_0.png)


    # Figure 22.1 Information transmission, reception, and processing.


    For information to be conveyed from sender to receiver, both must utilize the
    same set of symbols and rules. Otherwise, communication is not possible.


    The probability of receiving a message depends on the quality of the data in its
    initial state from a sender, as well as its state after its transfer, storage,
    retrieval, and any data conditioning on the side of the receiver. The conditioning
    aspect of a data transmission entails eliminating noise. Information Theory accounts
    for this probability in a measure called *Shannon entropy*, or just *entropy*,
    which is computed based on the symbols comprising *messages* and *noise*.2


