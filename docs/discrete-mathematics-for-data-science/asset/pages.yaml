    # 17.2.4 Binary Search Tree


    A *binary search tree* is one which flattens to a sorted list. Recall from the
    *Linear Structures* chapter that a sorted list has its elements in either an ascending
    or descending order. The structure accommodates O(log n) time efficiencies for
    a binary search when the binary tree is balanced. A *balanced binary tree* is
    a binary tree wherein the heights of the left and right subtrees of any node do
    not differ by than 1.


    Note the subtree patterns in Figure 17.11, where the value of the root is greater
    than that of the left branch and less than that of the right branch. The insertion
    of a new element entails first comparing its value to that of the root. If less
    than the root, then the element is directed to the left branch. Otherwise, the
    element is directed to the right branch. If the applicable branch is already occupied,
    then the process of comparison is repeated. Inserting elements in this manner
    effectively sorts the tree.'
