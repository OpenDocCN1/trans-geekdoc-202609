    # 1.5 PROBLEM-SOLVING AMID COMPLEXITY


    Only when a problem is understood can its solution be succinct or elegant. Conversely,
    when a problem is merely known to exist, but not understood, the work toward a
    solution may entail numerous failed attempts of experimentation. Sometimes it
    takes such experimentation in order to intellectually isolate the true nature
    of a problem and then to provide an appropriate solution. This may be undesirable
    when experimentation is costly. In computer programming, usually the most significant
    cost is your time.


    Code bloat in a program is a sign that either a single problem is not understood
    or that the program is actually addressing various distinct problems.


    The recurrence of a somewhat-the-same section of code throughout a program suggests
    opportunity to condense those sections into a single abstract/generalized module,
    in one place, that can be used (imported, called, extended, ...) in other places.
    Rather than exhausting all possible solutions for all possible ..., trust that
    abstract solutions exist for a general set of problems.


    Abstraction as such coincides with understanding the problem, the context, and
    the tools available for the task. This allows a more efficient use of your time
    and resources.


    Problem solving involves recognizing the abstract aspects of a general solution
    for a problem, and then tailoring a solution for the specifics of the problem
    at hand. The process requires research as well as trial-and-error. Hence, work
    proceeds from abstract generalization to concrete implementation.


    Abstraction allows programmers to focus energies on problem solving rather than
    on the internal architecture or composition of a given function or object. This
    also allows for a concept known as _information hiding_, as when the internal
    architecture is off limits to outside inspection.


    Consider that the words of a spoken language are abstractions of meaning that
    embody other words. When combined with other words, they generally describe a
    context.


    Abstraction coincides with generalization. A broad framework can be honed for
    a specific solution at the programmer''s discretion, and one solution can differ
    from'
