  md: 'Or:


    $SSE = \sum_{i=1}^n(y_i - \hat{y}_i)^2$


    Contrast that to the *sum of squared residuals*, *SSR*, which, instead of using
    each $y_i$, uses the difference between each predicted $\hat{y}_i$ and the mean
    $\bar{y}$, computed as:


    $SSR = \sum_{i=1}^n(\hat{y}_i - \bar{y})^2$


    *SSR* gives us the sum of the squared differences between each estimated $\hat{y}_i$
    and the mean $\bar{y}$.


    Now calculate for $b_0$ and $b_1$ using the following formulas:


    $b_0 = \bar{y} - b_1\bar{x}$


    $b_1 = \frac{\sum_{i=1}^n(x_i - \bar{x})(y_i - \bar{y})}{\sum_{i=1}^n(x_i - \bar{x})^2}$


    Putting these parameters together, we can estimate a particular $y_i$ as:


    $\hat{y}_i = b_0 + b_1x$


