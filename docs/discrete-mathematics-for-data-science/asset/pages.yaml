    A relation is reflexive if every element of a set is related to itself, though
    an element may be related to another element as well. Stated differently, R is
    reflexive iff (a, a) ∈ R for all a ∈ A.


    For example, given set A = { 1 2 3 } and the relation R = { (1, 1) (2, 2) (3,
