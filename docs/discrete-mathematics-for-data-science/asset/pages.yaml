    # 20.5 MULTIPLE LINEAR REGRESSION


    Consider a regression model of multiple independent variables, such as:


    y = \(\beta_0 + \beta_1x1 + \beta_2x2 + \dots + \beta_NxN + \epsilon\)


    Each beta coefficient represents the change in the \( y_i \) for a given predictor
    \( x_i \), holding all the other predictors constant. That is, we generate these
    pair-wise.


    The predictor variables of a regression model may be primary data or derivations
    from that data, such as the products of predictor pairs, non-linear transformations,
    or time lags.


    It is common before regressing multiple explanatory variables to first normalize
    or standardize each data set. This accommodates a common'
