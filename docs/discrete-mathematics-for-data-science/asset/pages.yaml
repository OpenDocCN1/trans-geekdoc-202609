- pgno: 505
  md: 'B. Similarly, for the binary sequence 10, trace the route from the top node
    rightward down the 1 branch and then the 0 branch, which leads to C. Repeat this
    process for each set of bits in the message.


    It should be said that Huffman compression produces *prefix free code*, meaning
    that an encoding of one symbol is not a prefix for any other. The prefix free
    property makes Huffman encoded bit strings uniquely decipherable, allowing us
    to reconstruct the symbol sequences of a message.


    For example, using our prior symbol encodings, suppose the bit string 1011000
    is to be deciphered. Traversing that bit string from left to right we look for
    a bit that matches in the tree path. The first match is 10, which is C. Remove
    those two bits, 1 and 0, from the bit string. Resume by processing the remaining
    bit string, 11000, from left to right. The sequence of 11 connect to A. Remove
    those bits. The last three bits, 000, connect to B. In the sequence that the symbols
    were deciphered, we get the word CAB.


