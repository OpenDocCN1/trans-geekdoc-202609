- pgno: 498
  md: 'H can be computed before and after sending a message, by the sender and receiver,
    in order to determine if noise was introduced into the message.


    # 22.5 JOINT ENTROPY


    Joint entropy quantifies the uncertainty of two random variables taken together.
    Given that H(A) and H(B) represent the entropy for different sets of outcomes,
    their joint entropy is the union of these sets. If the sets are independent, then
    the joint entropy is the sum of their individual entropies.


    Joint entropy can be expressed as:


    ```

    H(A, B) = -\sum_{i=1}^n \sum_{j=1}^m P_i(A_i, B_j) \times log_2 P(A_i, B_j)

    = H(A) + H(B | A)

    ```


    where H(A_i, B_j) \in H(A) \cup H(B)


    # 22.6 CONDITIONAL ENTROPY


    There are cases in which one variable depends on another. For example, coincident
    signals may actually entail some causal relationship. The discrete random variable
    A may be interpreted as a case while the discrete random variable B is considered
    an effect.


    Consider that the entropy of B pertains to outcomes a_i, where H(B — A) is the
    weighted average of H(B — A = a_i) over all values a_i that B may take.


    Conditional entropy for B given a single event a_i can be expressed as:


    ```

    H(B | a_i) = -\sum_{j=1}^m P(b_j | a_i) \times log_2 P(b_j, a_i)

    ```


    Conditional entropy for B given events of A can be expressed as:


    ```

    H(B | A) = -\sum_{i=1}^n \sum_{j=1}^m P(a_i, b_j) \times log_2 P(b_j | a_i)

    = H(A, B) - H(B)

    ```


    where H(A_i, B_j) \in H(A) \cap H(B).'
  merge: -1
  img_proc: true
- pgno: 499
  md: 'To evaluate the quality of a received signal, we can compare the joint entropy
    of sender and receiver data to the entropy of the sender''s data. In this context
    the equation for conditional entropy can be expressed as:


    ```

    H(R | S) = H(S, R) – H(R)

    ```


    Given an uncertain received signal, where R is not likely to reflect S, the sets
    may be independent or there may too much noise in R.


    # 22.7 MUTUAL INFORMATION


    Mutual information can tell us how much uncertainty is removed from a message
    when there is prior knowledge of another message. The mutual information of two
    sets of symbols is a gauge of how much dependence exists between the sets.


    Mutual information I can be expressed in terms of the prior entropy equations.


    ```

    I(A, B) = H(A) – H(A | B)

    = H(B) – H(B | A)

    = H(A) – H(A, B) – H(B)

    = H(A) + H(B) – H(A, B)

    ```


    # 22.8 NOISE, ERROR DETECTION & CORRECTION


    Noise amounts to entropy and uncertainty. Therefore, it is to be minimized.


    Simplistic approaches to dealing with noise include sending redundant symbols
    and using a parity bit.


    A message can be sent twice and the two instances of the received message can
    be compared. The information that these messages have in common provides a degree
    of validation. If re-transmission corroborates the symbols that were received
    previously, then mutual information will be equivalent to the joint entropy of
    the redundant sets.


    Recall that for mutual information,


    ```

    I(A, B) = H(B) – H(A | B)

    ```'
  merge: -1
  img_proc: true
- pgno: 500
  md: 'If A = B, then by substitution it can be shown that:


    $$H(A \mid B) = H(A, B)$$


    This means that redundant symbol transmission maintains the same probability for
    symbols provided that all symbols have the same redundancy.


    For example, instead of only transmitting the symbols HOP, transmit symbols in
    duplicate, such as HHOOPP. That way the receiver can determine that the receipt
    of HHOXPP has an error, as the probabilities of these symbols are not the same.
    Then some corrective measures may be taken, such as a re-transmit request.


    A parity bit can be used to reduce the amount of redundant data that is used for
    defeating errors. The parity bit will be a single bit appended to each message
    indicating that the message had an odd (0) or even (1) number of bits.


    For a parity bit to work when transmitting symbols of the Unicode character set,
    the binary representation of that character is used. For example, H in Unicode
    is represented by the decimal number 72, which is 01001000 in binary.


    For basic one-dimensional parity, appending an even (1) parity bit makes that
    a 9-bit string, 010010001.


    The parity of a series of symbols can be checked using the following computation:


    $$paritysum = \sum_{i=1}^{n} S_i \text{ mod } 2$$


    The result can be compared to an expected parity sum.


    # 22.9 CHANNEL CAPACITY


    A channel is limited by how many bits it can carry without signal loss. The maximum
    bandwidth may be determined by finding the highest number bits that can be transmitted
    without increasing the entropy of the received message.'
