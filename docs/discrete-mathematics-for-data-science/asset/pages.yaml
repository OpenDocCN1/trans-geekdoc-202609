  md: 'Using the mathematical definition of subtraction, we obtain a - b by performing
    a + (-b).


    With signed magnitude, the most significant bit is designated for the sign: 0
    for positive and 1 for negative. This means that we can have +0 and -0. When we
    work with signed numbers, since 1 bit is used for “+” or “-”, we then have one
    fewer bit and are limited to a smaller sized number.


    Other methods for working with negative numbers involve what are referred to as
    one''s complement and two''s complement. To take the one''s complement of a number,
    we invert its bits. That is, flip all the 1s to 0s and all the 0s to 1s. For example,
    0101 becomes 1010.


    Once you understand one''s complement, you can easily perform two''s complement
    by simply adding 1 to the prior result (discarding any overflow of carries beyond
    the most significant bit).<sup>2</sup> Therefore, the prior result from one''s
    complement is 1011 in two''s complement.


