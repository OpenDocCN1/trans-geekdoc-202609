  md: "# 4.1.1 The Power Method\n\nRelated to the aforementioned columnar notation\
    \ is a base conversion technique called the _power method_. It selects the column\
    \ having the largest number that will fit into the _most significant_ (leftmost)\
    \ digit of the number that we wish to convert, and then the next one, etc. This\
    \ is also referred to as _Horner's Method_ or _Horner's rule_.\n\nWe can apply\
    \ Horner's Rule to convert a number of any base to decimal. The general form of\
    \ computation is:\n\n\\(\\sum S_n \\times base^n\\)\n\nWhere _S_ represents a\
    \ set of the numerical symbols used in a particular base number system. _S<sub>n</sub>_\
    \ is one of those symbols.\n\nA sequence of magnitudes will have the following\
    \ polynomial pattern:\n\n\\(a_n x^n + a_{n-1} x^{n-1} + \\dots + a_2 x^2 + a_1\
    \ x^1 + a_0 x^0\\)\n\nHere is an example that uses the power method to convert\
    \ 0d84 to binary.\n\n+   1. Create a sequence in magnitudes of base 2.\n+   128\
    \ 64 32 16 8 4 2 1\n+   \n+   2. Assign a 1 under the largest number ≤ 0d84.\n\
    +   128 64 32 16 8 4 2 1\n+   0   1\n+   \n+   3. Find the difference of 84 and\
    \ 64, or 20.\n+   4. Repeat step 2 for 0d20.\n+   5. Repeat while differences\
    \ > 0.\n+   6. Put a 1 under the 16, as 16 is the largest number less than 20."
  merge: -1
  img_proc: true
