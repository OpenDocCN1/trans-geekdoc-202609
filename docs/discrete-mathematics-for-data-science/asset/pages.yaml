- pgno: 105
  md: 'Of the 23 mantissa bits, the first bit is called the _implicit leading bit_.
    Because this implicit leading bit is always 1 for non-zero numbers, there is no
    need to allocate space for it. Therefore, we will reallocate that space to the
    mantissa bits, now referred to as _fraction bits_.


    As seen in the following table, the IEEE 754 floating-point standard accommodates
    zero, infinity and illegal results, such as the square root of -1. The _fraction_
    heading is for the mantissa, without the implicit leading bit.


    | Number | Sign | Exponent | Fraction |

    | :--- | :--- | :--- | :--- |

    | 0 | N/A | 00000000 | 00000000000000000000000 |

    | +∞ | 0 | 00000000 | 00000000000000000000000 |

    | -∞ | 1 | 11111111 | 11111111111111111111111 |

    | illegal | N/A | 11111111 | NaN (not a number) |


    The IEEE 754 conversion procedure:


    +   1. Convert the number to binary.

    +   2. Normalize: Shift the decimal point left until there is only a 1 in the
    most significant bit.

    +      (a) Exponent value = number of shifts.

    +      (b) Mantissa = that set of bits to the right of the decimal.

    +   3. Compute the exponent bias to adjust for negative values. Eight bits for
    the bias allows for a signed exponent, ranging from -126 to +127, given that we
    set 0 as 127. That is, _bias_ = 2^(8-1) - 1 = 127, where eight bits represent
    256 possible bit combinations, including 3 bits for 0, infinity, and NaN. The
    biased exponent = exponent + 127 (in binary).

    +   4. The floating point number = sign bit, exponent bits, and mantissa bits.

    +   5. Pad with 0s the empty bits on the right of the mantissa.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'IEEE 754''s bias computation allows us to represent negative numbers in an
    unsigned system. The concept is analogous to declaring that the number 127 shall
    represent the number 0, such that the number 120, for example, can then represent
    the number -7.


    As an example. Consider an 8-bit binary floating point number for 0d123.456, which
    is equivalent to 0b011110111.01110100. This is a whole number part of 0d123, or
    0b01111011, and a fraction part of 0d0.456, or 0b01110100.


    +   1. First, convert 0d123 to binary. (Assuming that, by now, you already know
    how to convert 0d123 to binary, we exclude that conversion to binary in these
    steps.)


    +   2. next, determine the fraction:

    +   2⁻¹ = 0.5. 0.5 into 0.456? .... 0

    +   2⁻² = 0.25. 0.25 into 0.456? .... 1 rem 0.206

    +   2⁻³ = 0.125. 0.125 into 0.206? .... 1 rem 0.081

    +   2⁻⁴ = 0.0625. 0.0625 into 0.081? .... 1 rem 0.0185

    +   2⁻⁵ = 0.03125. 0.03125 into 0.0185? .... 0

    +   2⁻⁶ = 0.015625. 0.015625 into 0.0185? .... 1 rem 0.002875

    +   2⁻⁷ = 0.0078125. 0.0078125 into 0.002875? .... 0

    +   2⁻⁸ = 0.00390625. 0.00390625 into 0.002875? .... 0

    +   The fraction is 0b01110100.


    +   3. Now normalize 11110111.01110100 as 1.111011101110100 × 2⁶ and discard the
    leading bit. The mantissa is 111011011110100 and the exponent is 0d6 or 0b110.
    Therefore, in terms of a 32 bit binary number, we have:

    +   8 exponent bits → 6 + 127 exponent bias → 0d133 = 10000101.

    +   23 mantissa bits → 111011011110100 + 000000000 for padding in unused bits.'
