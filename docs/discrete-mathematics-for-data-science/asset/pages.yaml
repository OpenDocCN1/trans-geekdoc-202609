    # 2.1.2 Abstract Data


    Data is not limited to simple characters and numbers. There are also custom or
    user-defined data types. These are known as abstract data types, or ADTs. An abstract
    data type may consist of primitive values, such as characters, numbers, and functions,
    as well as other abstract data types. Forms of abstraction include the names (variables)
    associated with data values and machine instructions (functions).


    The primitive values that ultimately comprise abstract data are the lifeblood
    of computers. At the lowest levels of a computer, machine instructions are given
    as binary operational codes or opcodes. However, because binary is difficult to
    memorize, each opcode has an alias called a mnemonic word, which can be somewhat
    descriptive. Using mnemonics instead of opcodes in the operational sequences that
    we call programs makes coding easier for the'
