- pgno: 466
  md: 'and \( b_1 \) are the regression coefficients that we generate. The equation
    may look familiar to you, as it is related to the elementary equation of a line:


    ```

    y = mx + b

    ```


    Where \( m \) is the slope and \( b \) is the y-intercept.


    We are interested in the line through the data points that best represents the
    data, having the least error. Therefore, if the best fitting line happened to
    have the equation:


    ```

    \hat{y} = 5 + 1.2x

    ```


    Then an input of 2 for \( x_i \) would give a predicted result for \( \hat{y}_i
    \) of 7.4. Comparing that result to the actual \( y_i \) int the data provides
    us with the residual error, \( e_i \), computed as:


    ```

    e_i = y_i - \hat{y}_i

    ```


    The best fitting line will be the one that minimizes the squared sum of all residuals
    for \( n \) predictors, or the sum of all:


    ```

    e_i^2 = (y_i - \hat{y}_i)^2

    ```


    Squaring the residuals deals with negative offsets that would otherwise give us
    an erroneous result.


    Such a regression technique of finding the line which minimizes the sum of the
    squared residual errors is known as ordinary least squares and it assumes that
    the errors have a normal distribution with a mean of 0.


    By summing the above terms, we get the sum of squared errors, or SSE, which is
    computed as:


    ```

    SSE = \sum_{i=1}^{n}(y_i - (b_0 + b_1x_i))^2

    ```'
