    *Range*: The difference between the maximum and minimum values in a data set.


    range = max (x₁, x₂, …, xₙ) - min (x₁, x₂, …, xₙ)


    *Deviation*: The difference between a particular data value and the mean value
    of a data set.


    deviation = xᵢ - x̄


    *Sample variance*: This is the mean of the squared deviations, denoted s² and
    computed using n - 1 as the denominator, such as:


    s² = (Σⁿᵢ₌₁(xᵢ - x̄)²) / (n - 1)


