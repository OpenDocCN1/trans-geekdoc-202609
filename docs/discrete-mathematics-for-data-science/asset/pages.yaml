  md: 'In practical terms, to determine symbol probabilities quantify the symbols
    of a symbol dictionary relevant to its system of use, such as a spoken language.
    For example, the English language has these quantifications:5


    5P. Norvig, English Letter Frequency Counts: Mayzner Revisited. (In practice we
    would account for many other types of characters, including those representing
    numbers, as well as lower case characters. For example, according to Peter Norvig
    on norvig.com, E is the most used letter, with 12.49% of the total letter count,
    and Z is the least used letter, with 0.09% usage.) 2012. [Online]. Available:
    http://www.norvig.com/mayzner.html.


    +   - Characters (A to Z and a blank space): 27

    +   - Words: 97,565

    +   - Average word length: 4.79 chars

    +   - Uniform character distribution: log2(27) = 4.75 bits

    +   - Uniform word distribution: log2(97,565) / 5.79 = 2.86 bits


    Accordingly, the Shannon Information for drawing a specific character, such as
    ‘A’ is:


    ```

    H = -log2(1/27) = 4.76

    ```


    Using the weightings, the Shannon Information for drawing any three character
    sequence, such as ABC or XYZ is:


    ```

    H = -log2(1/27) + -log2(1/27) + -log2(1/27)

    = 3 x -log2(1/27)

    = 14.26

    ```


    In reality, the letters in a language are not used with equal frequencies. Suppose
    that we have the probabilities of the characters H, O, and P as PH = 0.05, PO
    = 0.076, and PP = 0.02. The Shannon Information for a message of these characters
    in any order is computed as:


    ```

    H = -(0.05 x log2 0.05 + 0.076 x log2 0.076 + 0.02 x log2 0.02)

    = 0.61

    ```


    That is 0.61 bits of Shannon Information, or entropy.'
