  md: 'To prevent ambiguity, the base of a number may be denoted beside the number.
    For example, consider that the number 16 in decimal is 10000 in binary and 10
    in hexadecimal. Therefore, unless we know the number''s base, we are faced with
    some ambiguity – if you saw “10” without knowing the base, you would not know
    what number is actually intended.


    Depending your programming environment, the hexadecimal number 10 might be written
    as 10₁₆, 10r, or 10h. It may also appear with any of the following prefixes: x10,
    0x10, \x10, $10, #10, or & 10.


    A similar pattern of prefixes can represent other number bases. For example:


    +   - 0b is for binary.

    +   - 0o is for octal.

    +   - 0d is for decimal.

    +   - 0x is for hexadecimal.


    For example, binary 1010 will be prefixed with 0b, a zero and the letter b, which
    results in 0b1010.


    # 3.6 COMPUTER TERMINOLOGY VS MATH TERMINOLOGY


    Computer hardware ingests natural numbers as non-negative integers, including
    0. In formal mathematics, natural numbers are defined as positive integers, without
    0.'
