  md: 'Symbols are often used in propositional logic to denote predicates, such as
    q, p, r, and s. The proposition, itself, may also be symbolized.


    For example, letting 0 represent false and 1 represent true, define the following
    predicate variables:


    ```

    { 1 } a WORD

    { 1 } b WORD

    { 0 } c WORD

    ```


    These variables can now be evaluated using logic operators, such as:


    ```

    a b c AND AND ( → 1)

    ```


    What that statement does is first compare the truth value of predicates a and
    b. The result is, itself, a truth value that is then compared with the truth value
    of c. In your traditional infix notation, the logic can be given as:


    ```

    (a AND b) AND c ( → 1)

    ```


    The logic of the postfix statement can be negated as follows:


    ```

    a b c AND AND NOT ( → 1)

    ```


    The result of an evaluated expression can also be assigned to a variable or function,
    such as the word “result,” as shown here:


    ```

    { a b c OR OR } result WORD

    ```


