  md: 'Abstract words represent word subsets of the universal set which is the language
    dictionary. Because the sets that comprise word definitions may contain duplicates,
    they are technically defined as *bags* or *multisets* rather than proper sets,
    which are restricted to distinct elements.


    Defining a word appends it to the language''s dictionary. For example, here we
    define words w and x:


    ```

    { ab cd mn } w WORD

    { pq rs } x WORD

    ```


    Because abstract words are comprised of other words, they can also be decomposed
    into their constituent words, which is the task of a compiler program.


    Symbolically, a language''s dictionary $D_L$ is a multiset of primitive $P$ words
    that are combined to form abstract words. Thus, for language $L$, the dictionary
    $D_L$ is defined as:


    ```

    $D_L \subseteq (P \cup D_L)$

    ```


    If the set of language primitives $P$ were a proper set containing distinct elements,
    then $D_L \subseteq P \rightarrow false$. However, if $P$ is a multiset, then
    $D_L \subseteq P \rightarrow true$.


    Although element order does not formally matter for multisets, duplicate elements
    may be distinguished by arbitrarily denoting their order, such as $e_0 e_1 ...
    e_n$.'
