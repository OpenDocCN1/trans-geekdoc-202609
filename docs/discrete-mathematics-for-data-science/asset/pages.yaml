    state of 0 or 1 (false or true), IF will affect one operation or another. Assembling
    a sequence of several IF operations will effectively form a hierarchy of decisions,
    a decision tree. If some of those decisions involve unknown inputs and repeat
    a branch of the tree until a particular output is generated, then this system
    in non-deterministic.


    Such a non-deterministic branching system is demonstrated here. This code merely
