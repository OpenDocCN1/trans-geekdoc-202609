    Peano''s axioms extend axioms about equivalence of relations among natural numbers,
    as follows.


    *Closure of equality axiom*: Only that which is a natural number can be *equivalent*
    to a natural number. This can also be symbolically stated as:


    ```

    \forall x\forall y : IF n \in N AND n \equiv m THEN m \in N

    ```


    Equivalence is a relation having the properties of the axioms of *reflexivity*,
    *symmetry* and *transitivity*.


    *Reflexivity axiom*: Every natural number is equivalent to itself. This can be
    stated as:


    ```

    \forall n \in N : n \equiv n

    ```


    *Symmetry axiom*: If the current number in a sequence of natural numbers is equivalent
    to the next, then the next is equivalent to the current. This can be stated as:


    ```

    \forall n\forall m \in N : IF n \equiv m THEN m \equiv n

    ```


    *Transitivity axiom*: If the current number in a sequence of natural numbers is
    equivalent to the next, and the next is equivalent to its next, then its next
    is equivalent to the current. This can be stated as:


    ```

    \forall x \forall y \forall z \in N : IF x \equiv y AND y \equiv z THEN x \equiv
    z

    ```'
