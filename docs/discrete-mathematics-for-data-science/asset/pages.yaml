- pgno: 469
  md: '$SST = \sum_{i=1}^n (y_i - \bar{y})^2$


    Note that SST is also equivalent to the sum of SSR and SSE. That is:


    $SST = SSR + SSE$


    $MSE$ gives the variance of the errors and is computed as:


    $MSE = \frac{SSE}{N - k + 1}$


    The parameter $k$ is the number of predictors. Therefore, with a two variable
    model, $k = 1$ and $k + 1$, or $2$, is the total number of beta coefficients.
    The expression $N - k + 1$ in the denominator adjusts the degrees of freedom of
    a regression.


    The square root of the $MSE$ makes the magnitude of the error consistent with
    the original data. Hence, we get Root Mean Squared Error.


    $RMSE = \sqrt{MSE}$


    # 20.4 COEFFICIENT OF DETERMINATION, $R^2$


    The *coefficient of determination*, denoted $R^2$, is a measure of how much the
    variation in the predicted variable is explained by an independent variable.


    Given that $SST = SSR + SSE$, as previously noted, we can compute $R^2$ as:


    $R^2 = \frac{SSR}{SST} \text{ or } 1 - \frac{SSE}{SST}$


    $R^2$ will always fall between 0 and 1. A regression line that perfectly fits
    the data will see an $R^2$ value of 1. With an $R^2$ between 0 and 1, we can'
