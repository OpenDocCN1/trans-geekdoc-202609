    | 0 | 0 | 0 | 0 | 1 | 1 | 0 | 0 | <- Invert these bits. |

    |---|---|---|---|---|---|---|---|---|

    | 1 | 1 | 1 | 1 | 0 | 0 | 1 | 1 | <- one''s complement |


