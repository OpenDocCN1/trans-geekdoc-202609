    \   1\n+  1\n-----\n  1 0\n```\n\nThe carried 1 becomes the most significant digit\
    \ and 0 is the\nleast significant digit.\n\nHow about 1 + 2 in binary?\n\n```\n\
    \  1\n+ 1 0\n-----\n 1 1\n```\n\nNow add another 1 to the prior result."
