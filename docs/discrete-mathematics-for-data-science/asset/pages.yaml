  md: 'Practitioners of computer science generally accept the mantissa of a number
    to be the significant digits (significand) of a floating-point number. For example,
    the number 24.68 is represented by the mantissa (or significand) 2468 multiplied
    by a power of 10 as follows:


    24.68 = 2468 × 10⁻²


    Conversely, Mathematics has two definitions for the mantissa. One is the fractional
    part of a number, that part of the number to the right of the decimal place, such
    as the digits 68 in the number 24.68. Another is the first part of a number in
    scientific notation, such as the 2.45 in 2.45 × 10³.


