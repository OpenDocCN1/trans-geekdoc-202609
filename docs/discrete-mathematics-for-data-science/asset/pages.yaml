  md: 'Words may also be defined as data. That way, the word can serve as a variable
    that is associated with a value or as a list of many values. For example, we may
    define a word “five” as:


    ```

    :five 5;

    ```


    To define a named list of numbers:


    ```

    : evens 2 4 6 8;

    ```


    To express those even numbers, invoke the word evens, simply as:


    ```

    evens

    ```


    The result on the stack, as seen by entering. S, is 2 4 6 8.


    To compute the sum of evens, we can use the REPEAT word to apply the + operation
    4 times:


    ```

    evens

    4 + ’ REPEAT

    ```


    The result is 20. The tick “ ’ ” mark after the addition “+” symbol delegates
    the addition operation to the REPEAT function. Otherwise, there would be just
    a single addition operation.


    Compound words can be defined using words that were previously defined. For example:'
