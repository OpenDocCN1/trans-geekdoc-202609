  md: '# 16.9 SIMPLE SEARCHING & SORTING ALGORITHMS


    Linear data structures can be searched and sorted in ways that depend on the design
    of the data structure.


    > ⁹S. Smith, *The Scientist & Engineer''s Guide to Digital Signal Processing*,
    First. California Technical Pub, 1997. (A good take on hardware applications of
    the circular queue in found in Chapter 28.) ISBN: 0966017633. DOI: https://dspguide.com/ch28.htm.


    Some searching algorithms depend on sorted data so that elements can be retrieved
    from specific positions. With a sorted list, a search can directly retrieve such
    values as the maximum, minimum, median, or some other element according to the
    ordered rank of a sequence.


    Without sorting, a *linear search* is required to search a linear structure. A
    linear search, or *sequential search*, begins at one end of the sequence and examines
    each element, one after another, until either the sought value is found or the
    other end of the sequence is encountered.


    > An example of a linear search of a stack is found in Appendix C.5. The code
    incrementally checks if the element on the top of the data stack matches a targeted
    value. In contrast is a *random search* of the stack, shown in Appendix C.6, which
    searches a stack at random until the target is found, up to a maximum number of
    tries.'
