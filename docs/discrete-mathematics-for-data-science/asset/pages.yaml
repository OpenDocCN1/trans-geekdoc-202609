    For a single predictor, we have a regression equation in the form:


    $y = b_0 + b_1x + e$


    with regression coefficients $b_0$ and $b_1$, as the predicted weights, and an
    error term $e$ called a residual.


    With multiple predictors, the general form for the equation is:


    $y = b_0 + b_1x1 + b_2x2 + ... + b_NxN + e$


    where $e$ in this case is the sum of the residuals.


    # 20.3 LINE FITTING


    The relationship between two variables, as plotted in an XY plane, can be examined
    relative to a straight line. We are interested in that line which best overlays
    the data points. (Consider the line shown in Figure 20.1.) Such a line can be
    used to estimate other values of y given new values for x.


    The equation for the best-fitting line with sample data is:


    $\hat{y} = b_0 + b_1x$


    For population data, the symbols may be expressed as:


    $y = \beta_0 + \beta_1x$


    Or:


    $E(y) = \beta_0 + \beta_1x$


    where each predicted value is given by $\hat{y_i}$, each dependent value is given
    by $y_i$, and each predictor value is given by $x_i$. The parameters $b_0$'
