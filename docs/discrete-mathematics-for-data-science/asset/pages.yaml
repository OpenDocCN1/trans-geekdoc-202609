    The total number of edges in a complete undirected graph of \( n \) vertices is
    computed as:


    \( n \times \frac{(n - 1)}{2} \)


    If most vertices in a graph are connected by edges to other vertices, then the
    graph is said to be *dense*. The maximum density of a graph is 1, or 100%, and
    the minimum density is 0, representing an *isolated graph*. The computation for
    graph density is:


    \( \frac{2 \times \text{number of edges}}{n \times (n - 1)} \)


