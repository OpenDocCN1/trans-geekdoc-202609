  img_proc: true
- pgno: 285
  md: '# 12.1 LAMBDA λ CALCULUS


    Lambda calculus was invented by the American mathematician and logician Alonzo
    Church in the 1930s in his quest to come up with a theoretical system to represent
    functions for computation. Since then, aspects of lambda calculus have made their
    way into various programming languages, perhaps most notably Lisp in the late
    1950s and Haskell in the early 1990s.¹


    Lambda calculus is a minimal way to model computation. It provides a means of
    abstraction that may expedite modeling in comparison to the typical programming
    language''s syntax, allowing what may be considered verbose syntax to be condensed.
    These are aspects the *functional programming* paradigm, which is based on lambda
    calculus. While lambda calculus has a formal set of rules for computation, its
    interpretations and its programming language implementations vary.


    In lambda calculus all operations are defined by an inductive abstraction of a
    function called a *lambda*, which may be considered the only primitive object.
    All functions are unary (single argument), as opposed to *multi-arity* (multiple
    argument). Lambda calculus does not define an evaluation order, leaving it to
    the coder to specify as left-right, right-left, infix, postfix, or applicative,
    and related eager or lazy behavior. (The examples in this chapter emphasize postfix
    arithmetic.)'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'The flexibility of evaluation order in lambda calculus is corroborated by the
    *Church-Rosser Theorem*, which essentially states that whether or not an algorithm
    takes a lazy or eager path, the final solution is the same.²


    Typically in lambda calculus, lower case characters are used for variables (x,
    y, z, ...), upper case is for applications, (E, F, G, EG, ...), and a combination
    of these such as λ x.E is used for an abstraction. All of these are lambda terms.
    A function''s application is its operation, as when a function takes an argument.


    Lambda calculus deals with just three expressions:


    +   • Variables

    +   • Function abstraction

    +   • Function application


    ¹A. Church and J. Rossier, “Some properties of conversion,” *Transactions of the
    American Mathematical Society*, vol. 39, pp. 472–482, 1936. DOI: https://www.ams.org/journals/tran/1936-039-03/S0002-9947-1936-1501858-0/S0002-9947-1936-1501858-0.pdf
    ↩


    ²A. Church and J. Rossier, “Some properties of conversion,” *Transactions of the
    American Mathematical Society*, vol. 39, pp. 472–482, 1936. DOI: https://www.ams.org/journals/tran/1936-039-03/S0002-9947-1936-1501858-0/S0002-9947-1936-1501858-0.pdf
    ↩


    Function abstraction is symbolized by the Greek character λ, called lambda.'
