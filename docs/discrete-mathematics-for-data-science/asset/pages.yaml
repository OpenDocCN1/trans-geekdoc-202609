    # 20.6 TESTING THE SIGNIFICANCE OF REGRESSION VARIABLES


    When performing multivariable linear regression, it is best to only include those
    independent variables that provide a relatively significant contribution to the
    model.


    One method for determining which independent variables to use is to test the full
    model, removing one predictor at a time to check the impact of each on the accuracy
    of the model, also called the *efficacy of the model*.\(^2\)


    Another method for determining which independent variables to include involves
    comparing the y data to each independent variable, one at a time, to look for
    a significant linear relationship. For each comparison, a *hypothesis test* involving
    a statistic called *t-statistic* can be performed. A general overview of the hypothesis
    testing procedure follows:


    Formally, the claim that two variables do **not** have a significant relationship
    is called the *null hypothesis*, and is denoted \(H_0\). In contrast to the null
    hypothesis is the *alternative hypothesis*, denoted as \(H_1\) or \(H_a\). The
    alternative hypothesis is the claim that a significant relationship **does** exist
    between two variables. In a hypothesis test, we decide whether or not to reject
    the null hypothesis based on the data, or more specifically, based on a *test-statistic*
    computed from the data. If the test-statistic leads us to reject the null hypothesis,
    then we have'
  merge: -1
  img_proc: true
- pgno: 472
  md: 'evidence in support of the alternative hypothesis, and we conclude there is
    a significant relationship.


    ²Model testing is covered in the Resampling chapter. ⬚


    For comparing one predictor variable with the y data in a regression, the appropriate
    test statistic is:


    $t = \frac{b_1 - 0}{se_{b_1}}$


    where the numerator \(b_1 - 0\) differentiates the beta coefficient \(b_1\) with
    a slope of zero, and \(se_{b_1}\) is the standard error of the beta coefficient.


    Recall that \(b_1\) is:


    $b_1 = \frac{s_{xy}}{s_x}$


    The standard error of the estimate is:


    $se_{b_1} = \sqrt{\frac{\sum(Y - \hat{Y})^2}{N - 2}}$


    Here, the sum of squared errors is divided by \(n - 2\) instead of \(n - 1\),
    as we are estimating two parameters, the slope and the intercept, requiring an
    additional degree of freedom. This allows the standard error of the regression
    to be an unbiased estimate of the standard deviation of the estimate''s errors.


    Associated with the value of the t-statistic is the probability of obtaining a
    value at least as extreme as the value of the calculated t-statistic. This probability
    is referred to as the p-value. Note that the computations are complex and technology
    is normally used to calculate both the t-statistic and the p-value.'
