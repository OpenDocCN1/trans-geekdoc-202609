  md: 'A lambda expression may be either a name to identify an abstraction point,
    a function to introduce abstraction, or a function application to define some
    specialization for an abstraction. An abstraction point is the input variable
    of a function, allowing for the creation of anonymous functions. Anonymous functions
    are functions with a function body, but no name.


    Abstraction in lambda calculus has this form:


    ```

    λIdentifier.Expression

    ```


    An identifier is a symbol or a name for a variable (parameter) or function. It
    may consist of any sequence of non-blank characters. For example, λx.E denotes
    a lambda function x that evaluates a lambda expression E as a parameter.


    The symbol for the lambda expression, λ, precedes the name x used for an abstraction.
    The name used for the abstraction is called the function''s bound variable x.
    (A bound variable is one which exists inside of a function''s scope or body.)
    A dot “.” separates a bound variable from the expression body.


    Equivalent to λidentifier.expression is the expression:


    ```

    { expression } identifier WORD

    ```


