  md: '# Linear Structures


    DOI: 10.1201/9781032687759-16


    # **Abstract**


    Before dealing with the complexities of branched structures, the data scientist
    should have a firm grasp of the simpler linear structures. Linear structures are
    fundamental data collections in data science and they accommodate the processing
    of sequences of data.


    Linear structures have connected elements with each element having one leader
    and one follower, with exceptions for the first and last elements. The term connection
    is synonymous with linking, as in linked lists. Linear structures include arrays,
    lists, stacks, queues, random access lists, and sorted lists. Lists and arrays
    are commonly used in programming languages as the basis of other structures, including
    stacks and queues.


    # **16.1 PROPERTIES OF LISTS**'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'A list is a finite sequence of elements of the same data type, in a particular
    order. It may include duplicated elements. Lists are the basis of *sorted lists*,
    *stacks*, and *queues*, which are common data structures in data science. Strictly
    speaking, lists do not have *random access* capability, though this condition
    is relaxed for some practical applications.


    Random access is a property that allows immediate or direct access to any element,
    without having to traverse (cross over) other elements in the structure. This
    contrasts with *sequential access* which requires traversing a hierarchical order
    before reaching a targeted element.


    A list may be illustrated as connected objects.


    ![](img/ff796e63b14a88ab72583e78f3994e90_351_0.png)


    Figure 16.1 A connected list of objects.


    Because order matters, each element of a list depends on a preceding element and
    a following element.


    A list can simply be comprised of numbers or characters, as long as it is one
    type or the other.¹


    A list can also consist of a finite set of objects that conform to the same predefined
    definition. A list can include other'
  merge: -1
  img_proc: true
