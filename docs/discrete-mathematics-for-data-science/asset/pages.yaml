- pgno: 549
  md: '# B.8 WORD OVERRIDES


    Abstract words can be redefined, as they are *overridable*. User-defined words
    are abstract words.


    Primitive words are not overridable. Therefore, if a primitive word requires modification,
    then consider wrapping it in an abstract word. For example, suppose we want an
    addition operation that automatically emits the result. We can we define a word
    myadd that wraps the addition operator “+” followed by the *pop* operator denoted
    “.” and “CR” (carriage return) to display the result.


    ```

    { + . CR } myadd WORD

    1 2 myadd

    3

    ```


    # B.9 DEEP COPY VS SHALLOW COPY


    Words can control their own data and need not only reference the data of the other
    words comprising their definitions. That is, words may get a *deep copy* of data
    from their constituent words. For example:


    ```

    : lista 2 4 6 8 ;

    : listb lista ;

    listb ’ SEE

    2 4 6 8

    ```


    Consider now if we re-define lista:'
  merge: -1
  img_proc: true
- pgno: 550
  md: '```

    : lista 1 3 5 ;

    listb '' SEE

    2 4 6 8

    lista '' SEE

    1 3 5

    ```


    Note how the two data sets remain independent. listb maintains the original lista
    elements, { 2 4 6 8 }, even though lista was later changed. We say that listb
    has a deep copy of data as opposed to a shallow copy. A deep copy makes words
    immune to the changes to data (side-effects) of their constituent words.


    Conversely, a *shallow* copied word will have it changes reflected in the host
    word. One way to make a shallow copy of a word is to use the TICK " '' " mark.
    For example:


    ```

    : listc 1 2 3 ;

    : listd listc '' EXEC ;

    : listc 4 5 6 ;

    listd '' SEE

    4 5 6

    ```


    # B.10 STACK CHECKING & ERROR PREVENTION


    Primitive (non-abstract) words in *epop* have the following attributes:'
  merge: -1
  img_proc: true
- pgno: 551
  md: '+   - A dictionary entry consisting of: name, opcode, and definition.

    +   - Argument requirements include the argument count and their expected data
    types.

    +   - An short alias or symbol for some of the more frequently used words.

    +   - Either a postfix or prefix operation (most words are postfix).


    During run-time, _epop_ checks that argument requirements are satisfied, helping
    to prevent errors. A useful diagnostic tool in that regard is the SEE word. An
    example of what SEE displays is shown here for the XOR word:


    ```

    XOR '' SEE

    XOR. Opcode: 191

    0.0 RG5 opcode: 1. argc: 0

    GT opcode: 14. argc: 2

    SWAP opcode: 23. argc: 2

    0.0 RG5 opcode: 1. argc: 0

    GT opcode: 14. argc: 2

    ADD opcode: 8. argc: 2

    1 RG5 opcode: 1. argc: 0

    EQ opcode: 13. argc: 2

    ```


    Occasionally, errors arise when two or more unbound asynchronous words compete
    for the same data. To avoid this and to force synchronization, insert the SYNC
    operator, aliased as ";;". For example:'
  merge: -1
  img_proc: true
- pgno: 552
  md: '```

    epop> word1 ;; word2

    ```


    # B.11 LOCAL NAMESPACES


    The word *let* is used in various functional programming languages to limit a
    variable''s effect to the scope of a function or code block.


    In Forth, a local scope or namespace may be considered synonymous with a word
    definition and the present data stack. For this context we can use the word LET,
    which uses the data stack to store a variable. For example:


    ```

    { 5 } payload WORD

    { payload '' EXEC var LET } local WORD

    local

    .S

    ... Data Stack ...

    Address   Index  Value

    ---------------------------------------

    1BF114081800   0     var.v

    ```


    Then, using the word TEL (yes, LET backwards), we can retrieve the data from a
    variable on the data stack, such as:


    ```

    TEL . CR

    5

    ```'
  merge: -1
  img_proc: true
- pgno: 553
  md: 'In contrast to local variables are global variables, which have application
    throughout a program. Global variables are set using the “ ! ” symbol, an alias
    for SETV, and evaluated using the “ @ ” symbol, an alias for GETV. For example:


    ```

    5 x !

    x @ . ( emits 5 )

    ```


    As you can see, local variables as defined above are more complex than global
    variables. Local variables also require relatively more system resources, which
    is one reason Forth founder Chuck Moore tries to avoid their use.2


    # B.12 EPOP WORD SUMMARY


    More than two-hundred epop word definitions are described in the epop Syntax Reference,
    on the web at https://sherpa.systemgoats.com.


    2Source: https://www.ultratechnology.com/moore4th.htm'
