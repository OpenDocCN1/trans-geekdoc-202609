    +   - a, b, c, x, y, z

    +   - 5 7 2 8

    +   - cat dog goat


    As can be seen, list elements can have different delimiters or separators. Typically
    either commas or spaces are used as delimiters.


    ![](img/ff796e63b14a88ab72583e78f3994e90_352_0.png)


    Figure 16.2 A connected list of characters.


    To distinguish lists from non-list entities, enclose the list with open { and
    closing } braces. For example, the following sequence is of two lists of characters
    followed by an operation.


