  md: '# Resampling


    DOI: 10.1201/9781032687759-21


    # Abstract


    The development of models for estimation requires testing. Generally, this means
    splitting the original data source into separate data sets, one for training and
    one for testing. Using testing data to evaluate a model based on separate training
    data is known as *cross validation*. The cross validation process may be repeated
    for multiple testing sets with the results averaged for a single estimation.


    For training and test data sets to be relevant, the data must be randomly drawn
    from the same population or data stream. If the sample is too small or the selections
    are not sufficiently random, then the training and test sets may be too different
    and cross validation will not be relevant.


    In addition to covering random sampling for obtaining training and test data,
    this chapter discusses a method for comparing the means of two samples to check
    for'
  merge: -1
  img_proc: true
- pgno: 478
  md: 'randomness. This chapter also discusses frequency graphs, running averages,
    and calculating errors in estimates.


    # 21.1 RANDOM SAMPLES


    Population data includes data that is unknown, either because it is evolving and
    is not yet deemed complete, or because the population is simply too large to assess.
    Therefore, population data is sampled. The same can be said for streaming data,
    as it is said to have no beginning and no end.


    For the random selection of data we rely on some kind of random function or procedure.


    Recall the concept of randomness in the Unconnected Data and Probabilities & Statistics
    chapters. An ideal random number function will generate a uniform distribution
    without any particular repeated sequential pattern. In a uniform distribution,
    values are evenly spread out over their range. For example, when generating random
    digits, 0, 1, 2, ..., 9, each digit has approximately the same frequency, as seen
    in Figure 21.1.'
  merge: -1
  img_proc: true
- pgno: 479
  md: '![](img/ff796e63b14a88ab72583e78f3994e90_479_0.png)


    # Figure 21.1 A uniform distribution.


    Random number generation is important for applications in statistical re-sampling.
    However, true randomness is difficult to achieve because the random number function
    depends on the interactions of a computer system''s internal states that are not
    actually random. This is why we call a random number function a *pseudo-random
    number generator*, or a *PRNG*.


    Various measures of worldly phenomena and probabilistic events tend to exhibit
    a *normal* or *Gaussian* distribution.'
