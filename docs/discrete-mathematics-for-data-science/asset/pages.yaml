    # 8.6 CONDITIONAL PROOFS


    A conditional proof involves proving an implication, an if-then statement.


    The general form for proving \( p \rightarrow q \):


    +   1. Suppose: \( p \) is true.

    +   2. Show \( q \) must be true. This may require several steps.


    A biconditional compound proposition can be proven by stating two implications,
    and proving each with a conditional proof. For example, to prove \( p \) iff \(
    q \), we must prove both of the following statements:


    > *if p is true then q is true*

    > *if q is true then p is true*


    Similarly, the statement “The launch is on today if and only if it is sunny.”
    could be broken down into the following statements:


    > *If it is sunny today, then the launch in on.*

    > *If the launch is on, then it is sunny today.*


