    # 4.4 MACHINE REPRESENTATION OF NEGATIVE NUMBERS


    In computing systems, negative numbers may be represented using various conversions,
    the following of which we cover:


    +   - Signed Magnitude.

    +   - One''s Complement.

    +   - Two''s Complement.

    +   - The IEEE 754 Floating Point Standard.


    A computing system will be designed to deal with one of those representations.
    That said, most commercial computers today implement the IEEE 754 Floating Point
    Standard.


    Since machines really only perform addition, “subtraction” is actually the addition
    of a number that has been made negative.'
