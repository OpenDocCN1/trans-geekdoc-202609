    # 6.1 PROPOSITION


    A proposition is a statement that is either true or false. It cannot be both.
    Symbolically, true may be denoted as 1 or T and false may be denoted as 0 or F.
    As we will soon see, we can represent a proposition in a function form with variables,
    in the form of a truth table.


    We can represent a proposition as a statement in a postfix functional form as:


    ```

    15 5 10 + EQ (→ true)

    10 5 4 + EQ (→ false)

    ```


    A proposition may be a simple statement that is true or false, without depending
    on a predicate. Or, the proposition may be *predicated* upon some variable. A
    predicate is an expression or instance of a variable or symbol, that can be replaced
    by values. The predicates of a proposition are said to have *propositional form*.


    For example, consider the statement “Goats are quadrupeds.” This statement is
    a proposition, as it can be evaluated as true or false. Additionally, the statement
    contains a predicate, “quadrupeds,” which is variable, as there many types of
    quadrupeds.


    “The sky is sunny.” is a proposition in which “sky” is variable. In *predicate
    logic*, the variability of that entire statement is variable, making it also a
    predicate. Therefore, the statement is both a proposition and a predicate.'
  merge: -1
  img_proc: true
