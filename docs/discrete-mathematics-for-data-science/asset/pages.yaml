    # 1.4 ERRONEOUS PROBLEMS & EXPENSIVE SOLUTIONS


    Apart from seeking an elusive solution to a well-understood problem, the problem
    at hand may not be understood and should be reconsidered.


    Both difficult problems and erroneous questions can masquerade as nondeterministic
    problems. Examples of erroneous endeavors include attempting to prove that all
    scores are above average, isolating patterns among the decimal digits in irrational
    numbers, and other tasks that attempt solutions to problems that are not understood.
    These are vexing issues that are explored in more depth in the Computability chapter.


    The alchemists of ancient times sought to synthesize gold via chemistry. Such
    a solution is far from economical, even though the atomic structure of gold is
    known. It'
