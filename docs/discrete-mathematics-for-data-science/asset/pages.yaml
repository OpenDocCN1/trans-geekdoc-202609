  md: '# Your Mind: A Programming Environment


    DOI: 10.1201/9781032687759-1


    # Abstract


    Why don''t you eat your book? That would be one way to absorb information. Seriously,
    problem-solving skills along with understanding of facts in context (knowledge)
    come with working out problems in various contexts. Otherwise, we can _thoughtlessly
    possess knowledge_ not much differently than possessing a reference source. This
    is a trend these days, as solutions to simple programming tasks are easily available
    on the Internet. The student need not be so introspective about what they actually
    know when information is so easily and freely available.


    However, when tasks become more challenging, only those experienced in problem
    solving will be able to handle the situations. This chapter is meant to prepare
    the student for the subject matter by introducing fundamental concepts in problem
    solving and coding.


    # 1.1 PSEUDO CODE


    Framing problems in our natural language is a first step in problem solving. We
    can solve problems or complete tasks following a set of instructions such as a
    cooking recipe. These instructions can be translated into a form that is acceptable
    to a machine in order to automate the task at hand. In the computer context, recipes
    are called algorithms and its words are codes. A general recipe as such can be
    referred to as _pseudo-code_. Pseudo-code can be defined as a general expression
    of an algorithm, minus the idioms of a programming language that are unnecessary
    to convey the algorithm''s meaning.'
  merge: -1
  img_proc: true
