  md: '# Computability


    DOI: 10.1201/9781032687759-9


    # Abstract


    An understanding of computability can help data scientists recognize the limits
    of algorithms. The feasibility of algorithms is an important consideration before
    embarking on substantial data science initiatives, before significant time and
    investment have been allocated toward presumed solutions. It could be that a problem
    is not solvable or that it may only be solvable after an extraordinary outlay
    of funds. It would be best if, in advance, the decision to proceed was based on
    the proven logic of computability.


    Data science is concerned with empirical proof, evidence based on observed conditions
    from sets of data. However, observation is not always immediately possible because
    computations can take significant time. For such cases, mathematical logic expedites
    analysis of the relative performance of algorithms.'
