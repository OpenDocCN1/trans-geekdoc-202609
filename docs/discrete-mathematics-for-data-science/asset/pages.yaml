    # 1.7 MENTAL CONDITIONING FOR PROBLEM SOLVING


    If when faced with analytical puzzles you are prone to panic, for whatever reason,
    then your problem-solving abilities will be restricted. For example, students
    who start assignments the night before a due date tend to panic and find themselves
    unable to calmly work out problems. They may instead be tempted to seek turn-key
    solutions from others, which will not develop problem-solving muscle.


    Regardless of whether a student is apt to excel under pressure, the proper logistics
    for organizing assignment resources may be impossible given a late start. There
    may not be enough hours to perform research, contemplate ideas, and to follow
    up with research about one''s own questions. Additionally, if the most energetic
    hours of your day are dedicated to non-assignment activities, then you have to
    question your priorities.


    For many students, the key is to start assignments well in advance of due dates
    and at times of the day when the mind is rested and alert.


    > Late start → panic :

    > Non – analytical area of brain in physical-survival mode.

    > Early start → relaxed :

    > Analytical area of brain in abstract problem-solving mode.


    Sometimes even the most diligent students fail at managing their schedules. This
    may be because they have not yet learned how to efficiently allocate an ambitious
    schedule.


    When starting a task early you have time to explore your thoughts. That also provides
    time for free association journaling about problem solutions/coding, much the
    way that writers use journaling to break writer''s block. After writing for a
    while, once removed from the outer world, you may well enter a stream of thought
    with a focus on the problem at hand.


