- pgno: 375
  md: 'One interesting sort method is the *bubble sort*. This sort processes elements
    by comparing adjacent pairs, swapping them as required for a certain order. To
    sort in ascending order, a swap takes place only when the first value of a pair
    is greater than the second value. After the first pass of the search, the largest
    element will be the last in the ordered sequence. After the second pass, the second
    largest element will be in the second-to-last place of the ordered sequence. Because
    each element must be compared to all the other elements, there are potentially
    n – 1 passes required for a sequence to be completely sorted.


    The following is a trace of the steps required for a bubble sort to put the sequence
    “5, 4, 6, 3, 7” in ascending order. Each pass is denoted by the iteration i.


    | i = 1 | i = 2 | i = 3 | i = 4 |

    | :--- | :--- | :--- | :--- |

    | 5, 4, 6, 3, 7 <br> swap | 4, 5, 3, 6, | 7 <br> keep | 4, 3, 5, | 6, 7 <br> swap
    | 3, 4, | 5, 6, 7 <br> keep |

    | 4, 5, 6, 3, 7 <br> keep | 4, 5, 3, 6, | 7 <br> swap | 3, 4, 5, | 6, 7 <br> keep
    | |

    | 4, 5, 6, 3, 7 <br> swap | 4, 3, 5, 6, | 7 <br> keep | | |

    | 4, 5, 3, 6, 7 <br> keep | | | |


    Another interesting sorting routine is the *selection sort*, which builds a sorted
    list by partitioning the original list'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'into unsorted and sorted sections. To get a sort in descending order, we begin
    by scanning the unsorted elements for the maximum value, and then swapping that
    value with the one in the first index. An index counter is then incremented to
    mark the second index, where the next highest value will be placed. The process
    is repeated for all indices up to and including the index counter.


    The following is a trace of the steps required for a selection sort to put the
    sequence “5, 4, 6, 3, 7” in descending order.


    | Iteration | Unsorted | Maximum | Sorted List |

    |---|---|---|---|

    | 0 | 5 4 6 3 7 | 7 | 7 |

    | 1 | 5 4 6 3 | 6 | 7 6 |

    | 2 | 5 4 3 | 5 | 7 6 5 |

    | 3 | 4 3 | 4 | 7 6 5 4 |

    | 4 | 3 | 3 | 7 6 5 4 3 |


    Example *epop* code for a selection sort is available in Appendix C.7.


