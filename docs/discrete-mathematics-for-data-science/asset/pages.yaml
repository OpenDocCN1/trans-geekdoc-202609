    # 11.6 WHEN TO USE RECURSION


    Generally, solutions that require multiple recursive function calls (branches)
    in the same cycle and have a large number of input values are not suitable for
    recursion. This is because recursive algorithms generally require more memory
    than iterative algorithms, as discussed above.


    What do you do with an elegant recursive algorithm that runs too slow? Perhaps
    relegate it to prototyping and then use a less elegant and better performing iterative
    algorithm in production.


    Recursion is generally a suitable solution if:


    +   - The problem is related to the principle of mathematical induction.

    +   - Recursion allows for simpler or less syntax.

    +   - Using recursion means better overall algorithm efficiency.

    +   - There are few elements to process.

    +   - The variables involved are immutable (can only be assigned once).


    In some programming contexts, variables may not actually be variable, as they
    are defined as constant or immutable.7 This may lead to errors when an immutable
    variable is used in repetition and we attempt to mutate an immutable variable.
    In such cases a copy of the variable may actually be generated, unbeknownst to
    the programmer.'
