- pgno: 208
  md: 'In computer science, algorithm efficiency is also known by the terms *time
    complexity* and *algorithm complexity*. An algorithm''s complexity and its efficiency
    go hand-in-hand.


    Analysis of algorithms for their time complexity allows us to estimate the relative
    performance of different algorithms and whether a problem might be solved quickly
    or slowly. These are important considerations for data science, where processing
    *Big Data* can require a significant investment in computing resources and run-time
    before a useful solution is discovered.²


    Algorithms are intended to solve problems. However, their computability for a
    given problem may not be consistent, meaning that a problem may sometimes have
    no solution and, at other times, there may be multiple solutions. Such undetermined
    output may be described as *probabilistic*.


    ¹Related concepts are covered in the *Algorithmic Complexity* and *Data Dimensions*
    chapters. ⇨


    ²Informally, *Big Data* is hereby defined to exist when its processing cost exceeds
    the value of your local processing resources. ⇨


    In the *Theory of Computation*, problems are classified as *computable* or *decidable*.
    Computable problems are those for which computational solutions can be generated
    in a finite amount of time. Decidable problems are those for which a correct “yes”
    or “no” (or true or false) answer can be produced in a finite amount of time.'
