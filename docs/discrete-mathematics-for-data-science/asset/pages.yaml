  md: 'Why does the most significant digit of 10,236 correspond with the 2¹³ column
    for binary? Because 2¹³ is the largest power of 2 that is less than 10,000. Therefore,
    we have 2¹³ × 1 for that column.


    Conversely, the next most significant digit of 10,236 is 0, corresponding with
    the 2¹². Therefore, we have 2¹ × 0 for that column. We continue that progression,
    from left to right, until arriving at the *least significant* (rightmost) digit,
    2⁰. At that point, the binary equivalent of decimal 10,236 is revealed as 1001111111100
    in binary.


    Here is an example showing the columnar correspondence of hexadecimal 27FC and
    decimal 10236.


    | 16³ | 16² | 16¹ | 16⁰ |

    |---|---|---|---|

    | 4906 | 256 | 16 | 1 |

    | 2 | 7 | F | C |


    Where 2 × 4096 + 7 × 256 + 15 × 16 + 12 × 1 = 0d10236.


    From there, the columnar correspondence of a number''s hexadecimal and decimal
    notation provides a fast way to convert the hexadecimal to binary. This is because
    each hexadecimal digit can be represented by four binary bits. So, if you memorized
    the four-bit patterns in Table 4.1, then you will be more adept at converting
    hexadecimal to binary. For example:


    +   - 2 is 0010

    +   - 7 is 0111

    +   - F is 1111

    +   - C is 1100


    Therefore, 0x27FC is: 0010 0111 1111 1100, or 0b0001001111111100.'
