  md: '# ## 1.2 SYSTEMATIZING PROBLEMS VIA CODE


    If you understand the problem at hand, then you can begin coding to automate its
    solution. The data might change, but the variables and functions will remain the
    same.


    Knowing the pattern of a solution, one can work backwards to inductively build
    the logic that generates the solution.


    For example, suppose that the problem is to compute the sum of the squares of
    a list of numbers. In terms of mathematical symbols of abstraction, a sum of squares
    can be expressed as ΣNi². If you are uncertain of what all that means, then you
    may assume that the task is complicated. Putting the task into words makes it
    somewhat easier, and if those same words amount to a runnable program, then wonderful!


    In the *epop* programming language, we can work out a sum of squares routine with
    word definitions as follows.


    Square a number by duplicating it in order to multiply it by itself:


    ```

    {DUP*}square WORD

    ```


    Square a number, swap it with the next number on the list, square that next number,
    and then add the two squared numbers together:


    ```

    {square SWAP square+}sumsquares WORD

    ```


    Invoke the sumsquares operation using input numbers 2 and 3 and display the result:


    ```

    2 3 sumsquares ( → 13)

    ```


    To verify that the results from a program are correct, we can devise an assertion
    function to check algorithm results against expected results. For example:


    ```

    { 2 3 sumsquares 13 EQ } assert WORD

    assert ( → 1, true)

    ```


    The expression of EQ is a test of equivalence.


    Invariably, problem solving in data science entails functions that initially take
    input data and then output some data as a result. Within testing frameworks common
    to computer science, input and output are often referred to as *preconditions*
    and *postconditions*, respectively.


    A function''s precondition includes function arguments and the initial values
    of any internal variables. A function''s postcondition includes the final values
    of internal variables and any related output.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'What follows are the steps for a coded assertion to test a function, \(f(n)
    = n + 1\), that takes an input variable \(n\) that has a value of 3, the precondition,
    and makes it 4, the postcondition.


    Set a variable \(n\) to the value of 3:


    ```

    3 n!

    ```


    The “!” symbol sets a variable to a value. The “@” symbol will be used to get
    the value of the variable \(n\). The order of operations for ! and @ is: “value
    variable !” and then “variable @”.


    Define a function \(f\) that increments (adds 1 to) the variable \(n\):


    ```

    {n @ 1 + n !} f WORD

    ```


    Define function assert that tests whether or not the postcondition of \(n\) is
    satisfied:


    ```

    {f n @ 4 EQ} assert WORD

    ```


    Invoke assert. An output of 1 denotes true and an output of 0 denotes false:


    ```

    assert ( → 1,true)

    ```


    When defining words, we should heed the problem-solving concept of breaking big
    problems into small problems. In that way, words that we define will have a more
    specific and identifiable purpose. In programming talk, this is known as _factoring_.


    When we factor code, such as a word or function, we break it into other words
    that specifically deal with a component task of the general problem. Factoring
    function definitions becomes more important as the definitions become extensive
    and complex.


    Such factoring is reminiscent of algebraic factoring, such as:


    ```

    \(x^2 + 3x + 2 \rightarrow (x + 2)(x + 1)\)

    ```


    where the factors are: \((x + 2)\) and \((x + 1)\).


    For example, to process any number of inputs, a complicated unfactored version
    of sum squares might contain the following definition: (_Alert! The following
    code is intentionally complicated._)


    ```

    {{DUP* > R} GSC LREPEAT WAIT{R > +} GSC LREPEAT}

    ```


    Such complex word definitions make execution control and problem isolation more
    difficult. However, the extra challenge can be lessened by factoring operations
    into smaller word definitions. For example:'
  merge: -1
  img_proc: true
- pgno: 49
  md: '```

    { DUP * > R GSC 0 > squares ? } squares WORD

    { R R > + GRC 0 > sums ? } sums WORD

    { squares sums } sumsquares WORD

    0 1 3 5 7 9 sumsquares ( → 165)

    ```


    Note that some of these terms are predefined in epop. GSC and GRC are counters.
    >R and R> are operations that move data to and from a container called the return
    stack (we cover stacks in the Linear Structures chapter). The squares function
    repeats until GSC is 0, as determined by the ? operator (symbolizing an if statement).
    Similarly, the sums function repeats until GRC is 0.


    The above code will make more sense as we move through the text. In any case,
    you may wish to refer to the coding conventions discussed in Appendices A and
    B.


    In programming we want instructions that when executed only affect the parameters
    required by the instructions, and not those of other instructions. The term for
    this property in the context of programming is orthogonality. A more orthogonal
    instruction set better avoids side effects or unintended results, including output
    that was expected from different instructions and other mysterious errors.


    When we define multiple complex words with similar functionality, we leave the
    door open to side effects. The situation is compounded when operations involve
    a complex nesting of data structures. Then we are more likely to see resource
    conflicts, such as when multiple operations simultaneously vie for the use of
    a single data stack. In such cases, it would be better to give each function instance
    its own internal stack.


    # 1.3 DATA CONFUSION


    Is Big Data always necessary, or are we merely amusing ourselves by collecting
    more and more data? Perhaps it is human nature to be fascinated by mystery, and
    for that matter, complexity. This is reminiscent of the gold miners in the American
    west in the 1800s who spent their lives digging for gold, oftentimes to no avail.
    They had gold fever. Nowadays, data scientists have data fever.


    The motives for data mining are not always about finding nuggets of information.
    There are often institutional motives as well. The marshaling of resources and
    labor to deal with great amounts of data may both influence and depend on institutional
    budgets, business models, and other managerial motives. This means that the rationale
    for an acceptable data feature set may not be clear.


    In situations where the data is huge and complex, it is easier to camouflage mistakes,
    including:


    +   • Discarding subsets of data that contradict an objective (aka, cherry picking).'
