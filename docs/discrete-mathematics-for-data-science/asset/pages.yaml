    Such firm-oriented risk is referred to as non-systematic or microeconomic risk.
    In this example we ignore risks that are not specific to any one firm, such those
    of the general macroeconomy, also known as systematic risk.


    Systematic risk is easily corroborated by a statistical evaluation of the portfolio''s
    stock price data, as a large number of such data sets inevitably reveal multicollinearity.
    Multicollinearity in investment portfolio data indicates some portfolio holdings
    are redundant and, thus, do not reduce portfolio risk. Therefore, a highly diversified
    portfolio should be able to reduce its holdings without incurring additional risk.


