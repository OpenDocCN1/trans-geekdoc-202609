    # ## 9.1 NP-COMPLETENESS


    *NP-completeness* refers to problems for which there is a verifiable solution.
    *NP Completeness Theory* is concerned with *P* and *NP* problems. *P problems*
    are solved in *polynomial time* (also referred to as an algorithm''s time *complexity*).<sup>1</sup>
    *NP problems* are solved in *non-deterministic polynomial time*.


    The solution to a *deterministic problem* will be a certain expected result for
    a given set of inputs. In contrast, the solution to a *non-deterministic problem*
    can vary, even with the same set of inputs.


    Polynomial time is a measure of the amount of work that an algorithm must perform
    in order to solve a given problem. Polynomial time is expressed in terms of *Big-O*
    notation, such as *O(n<sup>k</sup>)*, where *n* is the input size and *k* is a
    constant. The “O” refers to the *order of magnitude*, the exponent *k*. (Hence,
    it may be said that an algorithm has a certain “Big-O”).'
