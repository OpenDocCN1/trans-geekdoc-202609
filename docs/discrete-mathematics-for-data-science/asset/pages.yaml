    # 17.2.5 Tree Glossary


    +   • Root: Top or first node. May be referred to as level 0 or 1.

    +   • Node: An element of a tree. May be a root, child node, or leaf.

    +   • Edge: Line connecting two nodes.

    +   • Leaf: A node without children.

    +   • Level (Height): The number of nodes along the tree''s longest path.

    +   • Subtree: A tree within a larger tree. Has its own root.

    +   • Balanced binary tree: A tree in which the height of right and left subtrees
    of any node do not differ by more than 1.

    +   • Full binary tree: Each node has either two branches or no branches.

    +   • Complete binary tree: At all tree levels, with the possible exception of
    the lowest, all nodes have two child nodes.


    # 17.3 GRAPHS


    A graph is a collection of distinct *vertices* (nodes), that may or may not be
    connected. A tree is a graph, but a graph is not a tree, as a cyclical path exists
    among the vertices.


    Each vertex may be associated with a label and other data, including the count
    of neighboring connections, referred to as its *degree*. Vertices are neighbors
    if they are connected by an *edge*.'
