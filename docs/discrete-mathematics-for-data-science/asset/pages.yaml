    # 21.2 RESAMPLING


    The development of models for estimation requires testing. Generally, this means
    splitting the original data source into separate data sets, one for training and
    one for testing. Using testing data to evaluate a model based on separate training
    data is known as *cross validation*. The cross validation process may be repeated
    for multiple testing sets with the testing results averaged for a single estimation.


    A sampled data set can be partitioned into $K$ equal size sets, where $K - 1$
    of the sets are designated as training sets and 1 set is retained for testing.
    This is known as $K$-fold validation. A $K$ of 10 is common.'
  merge: -1
  img_proc: true
- pgno: 486
  md: 'For the training and test data sets to be relevant, the data must be randomly
    drawn from the same population or data stream. If a sample set is too small or
    the selections not random enough, then the training and test sets may be too different
    and cross validation may not be relevant.


    To corroborate the relevance of sampled data, we can use a hypothesis test called
    a *two-sample t-test*, which checks for a significant difference between the means
    of two sets. For the purposes of resampling, we compare the means of each training
    set (one at a time) to that of the test set.


    A two-sample t-test statistic is computed as follows:


    \( t = \frac{(\bar{x}_1 - \bar{x}_2) - (u_1 - u_2)}{\sqrt{\frac{S_1^2}{n_1} +
    \frac{S_2^2}{n_2}}} \)


    where for both the test set and a training set, \(\bar{x}_1\) and \(\bar{x}_2\)
    are sample means, \(s_1\) and \(s_2\) are standard deviations, and \(n_1\) and
    \(n_2\) are sample sizes. The components \(u_1\) and \(u_2\) are population means.
    However, since both samples come from the same population, \(u_1 - u_2 = 0\).
    Also, because the computation compares a pair of statistics, we lose two degrees
    of freedom.


    The result of computing \(t\) conveys either that there is no significant difference
    between the means of the test sample and a training sample, the *null hypothesis*,
    or that there is a significant difference between the means of the two samples,
    the *alternate hypothesis*. An associated small p-'
  merge: -1
  img_proc: true
- pgno: 487
  md: 'value (usually less than 0.05, as discussed in the Multivariate Analysis chapter)
    suggests rejecting the null hypothesis and concluding that the alternative hypothesis
    is likely true.


    # 21.3 EVALUATING ESTIMATES


    We can compute the error for an estimate by comparing it to an actual value. For
    example, suppose we generated an estimate from training data. The estimate could
    be some statistic of the set or it could be for a particular value in the indexed
    set. The estimate from the training set is then compared to an actual value, either
    from the testing set or from the population data. The difference of those values
    is the error of the estimate. Measures of such error are elaborated in the following
    approaches.


    For a single point estimate, we can compute the Absolute Percent Error(APE):


    $APE = 100 \times \left| \frac{(estimate - actual)}{(actual)} \right|$


    However, to compute the error for multiple estimates, we are interested in an
    average of those errors. For that we can compute Mean Absolute Percent Error:


    $MAPE = \frac{\sum_{i=1}^n APE_i}{n}$'
  merge: -1
  img_proc: true
- pgno: 488
  md: 'Similar to the Mean Absolute Error is the _Mean Squared Error_:


    ```

    MSE = \frac{\sum_{i=1}^n (estimate_i - actual_i)^2}{n}

    ```


    With MSE, squaring rids us of negative errors that offset positive errors when
    computing an average of errors.


    The square root of the MSE makes the magnitude of the error consistent with the
    original data. Hence, this is called the _Root Mean Squared Error_.


    ```

    RMSE = \sqrt{MSE}

    ```


