  md: '# Data Organization


    DOI: 10.1201/9781032687759-14


    # Abstract


    Data organization entails ways in which collections organize their elements. Collections
    are generally categorized as connected, unconnected, or branched.


    As an analogy, consider the stars in the night sky, a myriad twinkling points
    of light. With a quick glance it may seem that these are random entities without
    any connections. But, with careful observation certain patterns can be seen. These
    patterns are defined as stellar constellations with names such as the Big Dipper
    and Orion''s Belt. These galactic structures are actually abstract constructs
    that were defined into existence by ancient astronomers.


    Similarly, data structures exist as the organization of individual data objects
    that are ascribed based on their topological relationships and groupings.


    # 14.1 DATA ORGANIZATION'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'This section provides a brief overview of the data structures in this book,
    each of which are given in-depth coverage in the following three chapters.


    An unconnected collection implies that elements are free of order such that elements
    appear to be placed at random. These collection types are sets and bags. A bag
    collection has the least restrictions of all the collection definitions, as it
    may contain duplicates and is not ordered.


    A connected collection implies that each element has a predecessor and a successor,
    with the exception of the first and last elements. Connection is synonymous with
    linking, as in linked-lists. The linear variety of such collection types includes
    lists, stacks, and queues.


    Of the connected types, some are branched, which means that an element may have
    multiple predecessors and successors, depending on a predefined topology. These
    collection types include graphs and trees.


    # 14.2 ORDERING


    Connected collections have an order. In turn, order indicates that the elements
    of a collection are connected.


    While the sequence of the order may be assigned by an index, lexical or numeric
    ordering is not necessary. Where a particular ordering of a sequence is necessary,
    the use of pre-sorted collections may be used. These include sorted lists, priority
    queues, and search trees.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# 14.2.1 Element Access


    Element access depends on the *connectedness* of the data collection.


    With connected collections, sequential elements may be traversed until arriving
    at a particular index or value.


    With unconnected collections, there is no structure to traverse and no permanent
    index. Therefore, element access requires random selection until arriving at a
    particular value, or until the collection is empty.


    # 14.3 COLLECTION OPERATIONS


    The various types of collections have both distinct and common operations.


    Common collection operations with respect to single elements include counting,
    inserting, removing, replacing, searching, and retrieval.


    Common operations that entail entire collections include copying and comparing
    two collections, as well as sorting connected collections.


    Each of these operations have an *algorithmic efficiency*, depending on the specific
    implementation of the algorithm for the operation.


    # 14.4 RELAXED PROPERTIES'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Unconnected data as found in sets and bags is defined as unordered. However,
    to be practical for storage and processing, unordered data must actually exist
    in the machine in a structured collection, such as a list. Unorderededness is
    therefore assumed, as we ignore any index of the sequence in which the data was
    entered to keep the appearance of randomness.


    For a formal set, having no duplicates and no order, the data processed from a
    list representing the set should be drawn at random. Thus, the requirements of
    the connected list structure are relaxed to allow direct, non-sequential, random
    access.¹


    If we are interested in preserving order and duplicates within lists having set
    operations, then we should use a more relaxed variation of sets called a multiset.²
    The concept of the multiset accommodates multiple instances certain elements.


    Data structures that are already ordered according to some trait of its elements,
    provide an expedient way to extract meaningful data via random access. For example,
    pre-sorted collections such as sorted lists, allow us to immediately determine
    values such as the maximum, minimum, median, and other elements that can be found
    at specific intervals. Therefore, in a practical sense, the sorted list and random
    access list are fairly synonymous.³'
