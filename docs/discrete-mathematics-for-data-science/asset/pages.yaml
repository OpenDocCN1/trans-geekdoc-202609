  md: 'Accordingly, any value in the Fibonacci sequence, beginning with the third
    term, is the sum of the previous two terms.


    An algorithm that uses the above recursive definition to generate the \(n^{th}\)
    term in the Fibonacci sequence requires a large number of steps as \(n\) increases.
    The function that represents an upper bound of the time complexity is \(g(n) =
    \phi^n\), where \(\phi = (1 + \sqrt{5})/2\). \(\phi\) is known as the _golden
    ratio_, the irrational number 1.618...


    As concluded by proofs using induction that are beyond the scope of this text,
    \(O(\phi^n)\) is the time complexity of the recursive Fibonacci algorithm. Nonetheless,
    we can see where the value \(\phi = (1 + \sqrt{5})/2\) originates. These proofs
    generally involve the equation \(\alpha^n = \alpha^{(n-1)} + \alpha^{(n-2)}\)
    which, when \(n = 2\), is the quadratic equation \(\alpha^2 = \alpha + 1\). Using
    the quadratic formula gives a positive solution of \(\alpha = (1 + \sqrt{5})/2\).


    However, an algorithm for generating Fibonacci numbers need not be so inefficient.
    Consider the following non-branching _epop_ code that, despite being recursive,
    has \(O(n)\) time complexity. This is accomplished by building the Fibonacci sequence
    on a stack while decrementing \(n\) from its original input value until it is
    not greater than 2.


    ```

    10 n !

    { n @ i- DUP n ! } n- WORD

    { DUP2 + n 2 > fibonacci ? } fibonacci WORD

    1 1 fibonacci ( → 55)

    ```


    The above approach to generating a Fibonacci number is referred to as _memoization_.
    The term derives from the Latin word “memorandum,” meaning “to remember.” Memoization
    leads to greater efficiency, as when expensive computations are avoided by storing
    interim results in a data structure, such as a stack in the above example. When
    a memoized solution overlaps with a prior memoized solution, as when the computation
    of a Fibonacci number depends on a previous computation, the approach may be referred
    to as _dynamic programming_.¹


    Memoization can make branching algorithms more efficient as well. For example,
    the above fibonacci function can be modified to include two recursive calls as
