    \ employed. For example, the following task updates a data list, replacing it's\
    \ x's with y's.\n\n```\n{ 1 x 3 x 5 x 7 x 9 } data LIST\n{ DROP y } replacement\
    \ WORD\n{ x } target WORD\n{ DUP target EQ replacement ? >> } task WORD\n{ { task\
    \ } GSC LREPEAT data ’ S2LIST } update-data WORD\ndata\nupdate-data\n```\n\nNow\
    \ the data list will be { 1 y 3 y 5 y 7 y 9 }. \n\n# B.7 INLINE WORDS\n\nInline\
    \ words expect their arguments to proceed them on the same line (and not from\
    \ the data stack). There will be an error message otherwise. The following are\
    \ inline words:\n\n+   - UIF ( alias ?)\n+   - IFELSE ( alias ??)\n+   - PIPE\
