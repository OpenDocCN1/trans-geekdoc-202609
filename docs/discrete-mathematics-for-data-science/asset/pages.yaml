- pgno: 29
  md: '# Preface


    # 0.1 THE PURPOSE OF THIS BOOK


    Does precision mean relevance? Can reasoning exist without data? For that matter,
    what is data?


    With those questions in mind, this book serves an early course in mathematical
    thinking for data science. Because data science is interdisciplinary, students
    of data science come from a variety of disciplines. Interdisciplinary motivations
    are fueling the emergence of data science initiatives in various academic disciplines,
    with Business, Statistics, Computer Science, Economics, and Psychology among the
    departments offering studies in data science. For many students, data science
    is considered a means of insight into a particular field of interest, with the
    study of its discrete mathematics not a primary objective.


    Courses in introductory data science and discrete mathematics tend to be ambitious.
    Introductory data science courses are seen requiring students to have prerequisite
    knowledge of statistics and computer programming, and a first course in discrete
    mathematics generally resembles a buffet of mathematical topics.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Students are often preoccupied with enough abstraction to miss the basic empirical
    essence of data science. This book aims to make these connections.


    In particular, those pursuing data engineering and high-performance computing
    for data science should be aware of the foundational aspects of data and computation
    present in this book.


    I wrote this book to give interdisciplinary students of data science a solid foundation
    in discrete mathematics for data science, connecting fundamental and abstract
    concepts for elementary problem solving.


    # 0.1.1 Context


    It is imperative to respect the interdisciplinary backgrounds of data science
    practitioners, as domain expertise ensures that analysis is kept to relevant contexts.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/ff796e63b14a88ab72583e78f3994e90_31_0.png)


    Figure 1 Interdisciplinary data science contexts.


    Context is important for the classification of data, for determining which data
    values belong in a certain class and which do not. In this age of Big Data, much
    irrelevant data and noise can amount to a significant waste of computing resources,
    and a much higher cost when mistaken for relevant data.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'For example, the history data scientist decides to count battlefield casualties
    that include soldiers too wounded for further combat. The business data scientist
    counts only those sales transactions where the customer''s payment has been received.
    The data engineer supports the domain specialists, filling voids and minimizing
    redundancies among maintained data sets.


    The classification of data requires details with respect to its source, type,
    organization, and sampling rate. These details are largely matters of domain expertise.
    In the process of data analysis, raw data must be ingested from a source and format,
    and computational results then generated and encoded for the next stage of analysis
    and eventually storage.


    Data scientists use programming tools for data conditioning, converting data to
    various formats. When data inconsistencies are encountered that the tools fail
    to process correctly, the data scientist is forced to become a student of low-level
    character encoding. Therefore, machine representations of numbers and text are
    considered important. Machine numbers, data types, and numerical representations
    are a few examples of discrete mathematics in practice.


    Computers get information from the outside world in discrete periodic samples.
    These samples are usually incomplete representations of real world data, being
    limited to a sampling rate per second of continuous data or'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'a data set sampled from a much larger population of data. Figure 2 depicts
    discrete samples of a continuous data waveform, such as from audio or video input.
    Each of those discrete samples in Figure 2 may be considered a snapshot in time,
    as conveyed by Figure 3.


    ![](img/ff796e63b14a88ab72583e78f3994e90_33_0.png)


    Figure 2 Discrete versus continuous information.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/ff796e63b14a88ab72583e78f3994e90_34_0.png)


    Figure 3 A discrete snapshot of a continuous reality.


    # 0.1.2 History & Human Nature


    Formal courses in discrete mathematics for computer science first appeared in
    the U.S. university curricula in the late 1970s. The rationale was that students
    of computer science needed exercise in mathematics related to applications and
    architectures of digital computers. The curriculum was later codified by the Association
    for Computing Machinery in a joint effort with the Mathematical Association of
    America. Early topics generally included analysis of algorithms, counting, propositional
    logic, and set theory.


    Over the past forty years, topics in discrete mathematics textbooks have expanded
    as computing topics have burgeoned, with college textbooks for discrete math now'
  merge: -1
