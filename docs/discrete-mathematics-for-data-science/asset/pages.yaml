- pgno: 493
  md: 'Claude Shannon, a pioneer of Information Theory, realized that more information
    does not necessarily equate to useful information. Rather, it is the amount of
    information of known symbols relative to noise that matters. In that respect,
    Information Theory seeks to minimize the amount of data required to convey a message.


    In his paper, *A Mathematical Theory of Communication*, Shannon coined the term
    *bit* for *binary digit* as a fundamental unit of information.³ A bit can be in
    one of two states, symbolized 0 or 1. Having just two states, the bit accords
    with the base 2 numbering system.


    Shannon determined the minimum number of binary digits required to store a symbol
    for reliable communication. Shannon termed this number *entropy*.


    Entropy is based on the probability of a symbol in a message. Redundant symbols
    do not affect the results as long as each symbol has the same redundancy. It may
    be the case that the sender sends duplicate symbols to ensure their receipt.


    Consider a set of symbols such as the characters of the alphabet. Suppose that
    message transmission is done at a rate of five symbols per second. The possible
    number of character combinations per second is 26⁵. Assuming each character is
    equally likely, the probability of drawing any one character is 1/26 .


    The calculation for entropy, as shown below, includes converting 26⁵ into binary
    terms (Shannon''s symbol set was { 0 1 }). Shannon symbolized the entropy of a
    message with the letter *H*.


    ```

    26⁵ = 2ˣ

    log₁₀26⁵ = log₁₀2ˣ

    5 × log₁₀26 = x × log₁₀2

    x = 5 × log₁₀26 / log₁₀2

    x = 5 × 1.41497334797082 / 0.301029995663981

    H = 23.5021985907055

    ```


    As can be seen, the Shannon entropy for drawing a sequence of 5 characters from
    the 26 letter alphabet is approximately 23.5 bits. That would equate to'
  merge: -1
  img_proc: true
- pgno: 494
  md: 'about 4.7 bits for any single character selected at random.


    ³C. E. Shannon, “A mathematical theory of communication,” *The Bell System Technical
    Journal*, vol. 27, pp. 379–423, 623–656, 1948. DOI: https://archive.org/details/ost-engineering-shannon1948.
    ⁴


    In practice, the characters of a message are expected to have varying rates, as
    linguistic research has established. Additionally, noise in the transmission of
    a message amounts to received characters that have nothing to do with the message.


    Given a certain entropy amid noise, a system''s communication capacity is defined
    as the maximum number of bits per second that can be reliably transmitted. Shannon
    symbolized communication capacity with the letter *C* and showed that reliable
    communication requires that *H < C*. More about that below.


    # 22.2 ENTROPY


    The essence of Shannon''s 1948 *Noiseless Coding Theorem* is that no irrelevant
    data be used in a message. In other words, the message and the data are ideally
    the same length. If not, then noise exists in the data. The amount of this noise
    is embodied by a statistical parameter that Shannon termed *entropy*, also known
    as *Shannon Entropy* or *Shannon Information*.⁴


    Since Shannon established entropy as a measure of uncertainty for information,
    we have come to see the terms Shannon Information and Shannon Entropy generally
    used as synonyms. This may be confusing, as one could reasonably expect these
    terms to have an opposite meanings, as the higher the entropy the less certain
    the message. However, consider that Shannon Information is inversely related to
    the probability of a single event, which should be interpreted as the probability
    that a message is received.


    We can compute the entropy of a message provided we are able to distinguish its
    symbols and know its length. Additionally, given that the probability of each
    of a message''s symbols is known (the message''s *probability distribution*),
    the length of the message can be computed.


    First, consider information, *I*, expressed as:


    ```

    I = -log<sub>2</sub>P<sub>0</sub>

    ```'
