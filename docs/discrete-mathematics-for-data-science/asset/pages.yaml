  md: '# # Atoms & Abstractions


    DOI: 10.1201/9781032687759-2


    # ## Abstract


    Being able to distinguish between simple and complex data types is an important
    basic skill for data science.


    There are generally two types of data. There is a single number that, by itself
    needs no interpretation. It is _atomic_ in that it is irreducible and we can refer
    to it as a singular object or element. Atomic elements may also be referred to
    as foundational or _primitive_ elements. Conversely, there are complex data that
    are the organization of a collection of both primitive and other complex elements,
    as well as functions. Such element organizations may be referred to as _abstract
    data types_ or simply _abstractions_ and are often symbolized by a name.


    # ### 2.1 THE MEANING OF DATA


    # #### 2.1.1 Atomic Data'
