    # 4.6 SIMPLISTIC CONVERSIONS


    Given smaller registers, such as 8 or 16 bit, one approach is to not use IEEE
    754, but to instead scale the number by a magnitude large enough to eliminate
    the floating point. For example, the floating point number 3.625 can be scaled
    up by multiplying it by 1000, making it 3625.


