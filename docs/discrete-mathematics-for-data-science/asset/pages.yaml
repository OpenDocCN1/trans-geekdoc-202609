    # Abstract


    Propositional logic is integral to the data scientist''s work with automated systems
    of analysis, including artificial intelligence, expert systems, and application
    development in general. In these endeavours, it is important to convey task objectives
    in unambiguous logical terms, be it for architecting data flows or generating
    statistical reports for business decisions.


    A proposition is simply a statement or expression which asserts that something
    is true or false. The assertion may require certain conditions be met and, because
    mathematical symbols may be used, propositional logic may be referred to as mathematical
    logic or symbolic logic.


    The concepts of propositional logic are applicable to set logic when the predicates
    are replaced with sets. Therefore, to understand propositional logic with respect
    to data sets, relationships between data sets must be defined.


    Applications of logic exist throughout machine architectures and program algorithms,
    with logical statements comprising'
