- pgno: 501
  md: 'The channel between a sender and a receiver may be considered a medium or a
    route. The channel may carry electrical pulses representing the bit-stream of
    a networking protocol.


    Suppose that a channel carries data at a maximum rate of 8-bits per second. The
    channel''s bandwidth is 8 bits/s. Beyond that, transmission becomes unreliable
    with too many errors and too much entropy.


    Shannon''s Fundamental Theorem for a Noiseless Channel presents a maximum set
    of symbols S in a period, a data rate of symbol transmission in terms of channel
    capacity C divided by the entropy H. That is:


    ```

    S=C / H

    ```


    We can re-arrange the symbols to get C = HS and see that channel capacity depends
    on the product of the symbol rate and entropy.


    Channel capacity may also be considered the maximum mutual information. As such,
    it is computed as:


    ```

    C(A, B) = I(A, S)

    ```


    Suppose that the sender has symbol set { 1 0 1 0 } as A to transmit. Given a data
    rate that is limited to half capacity, S would be { 1 0 } and it would not be
    clear which part of A was received.⁶


    ⁶H. Nyquist, “Certain topics in telegraph transmission theory,” Transactions of
    the American Institute of Electrical Engineers, vol. 47, no. 2, pp. 617–644, 1928.
    (The Nyquist Rate addresses a similar concept called aliasing with respect to
    signal processing.) DOI: 10.1109/T-AIEE.1928.5055024.


    # 22.10 DATA COMPRESSION & HUFFMAN ENCODING


    Data compression is an achievement of Information Theory. Compressing data allows
    us to represent information with fewer bits for transmission and storage. The
    receiver restores the original information using decompression.


    Shannon entropy tells us that information may be represented by more bits than
    necessary, indicating opportunity for compression.'
  merge: -1
  img_proc: true
- pgno: 502
  md: 'The effectiveness of compression can be measured as the size of the compressed
    data set relative to the original data set.


    Lossy methods of compression allow some bits to be lost after decompression. This
    may acceptable for some types of data, such as sound and graphics. The ear and
    the eye may not be able to perceive the missing bits. Conversely, lossless methods
    of compression are generally necessary for record keeping. For example, information
    from medical diagnostics and financial transactions must often be complete.


    Huffman Encoding is a type of lossless compression that encodes and decodes using
    a binary tree called a Huffman tree.


    As an example, suppose that we have a text message consisting of 120 characters,
    using only the characters A, B, C, X, Y, and Z. These characters have different
    frequencies of occurrence in the message. Their probabilities and entropy are
    given as follows:


    | Symbol | Probability | Entropy | Entropy total |

    | :--- | :--- | :--- | :--- |

    | A | 27 / 120 | 0.48 | 13.07 |

    | B | 9 / 120 | 0.28 | 2.52 |

    | C | 21 / 120 | 0.44 | 9.24 |

    | X | 15 / 120 | 0.38 | 5.63 |

    | Y | 12 / 120 | 0.33 | 3.99 |

    | Z | 16 / 120 | 0.39 | 6.20 |


    To compress or decompress, start with one of the symbols, such as ‘A’, to signify
    the root node of the Huffman tree. Left branches in the tree will be labeled with
    0s and right branches will be labeled with 1s.


    Re-order the symbols in terms of frequency:


    | B | Y | X | Z | C | A |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 9 | 12 | 15 | 16 | 21 | 27 |


    From left to right, add the frequencies of each pair, using each sum for the root
    nodes in the lowest level of the tree, as shown in Figure 22.2.'
