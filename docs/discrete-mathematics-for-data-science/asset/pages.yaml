  md: 'A proof is generally composed of consistent assertions that lead to a concluding
    assertion that is proved.


    For example, consider the form of an inference proof, as based on rules of inference:¹


    ```

    IF p → q

    AND q → r

    THEN p → r (conclusion)

    ```


    In postfix notation, this is:


    ```

    p q IF q r IF AND

    ```


    Here are some methods of proof.


    *Vacuous proof:* p → q is true if p is false.


    *Trivial proof:* p → q is true if q is *always* true.


    *Direct proof:* Given the assertion that p is true, by inference show that q must
    be true.


    *Proof of the contrapositive:* To prove p → q is true, we could prove that the
    contrapositive ¬q → ¬p is true.


    *Proof by contradiction:* Given the assumption that p → q is false, find some
    contradiction.


