    \( R^2 \), indicating no statistical relationship. However, a higher \( R^2 \)
    might be found using a non-linear model.


    A poor \( R^2 \) may not be entirely due to a sub-optimal regression model. Data
    quality and relevance is also a factor to consider. Anomalistic data values, what
    we call *outliers*, can skew a regression model''s results. It may also be that
    the data was imported from an incorrect or corrupt repository. Or, the data may
    have been sampled using insufficient randomness. (More is said about the last
