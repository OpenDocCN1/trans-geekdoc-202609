    Once a p-value is obtained, we use it to decide whether or not to reject the null
    hypothesis. If the p-value is small (usually less than 0.05), then we reject the
    null hypothesis. In this case the data supports the alternative hypothesis, which
    is the idea that a significant linear relationship exists. So, we include that
    independent predictor variable in our regression model.


    3 P-values can be computed online at the following link: https://www.gigacalculator.com/calculators/p-value-significance-calculator.php


    If the p-value is greater than 0.05, then we cannot reject the null hypothesis
    and we have not found a significant linear relationship between the predictor
    variable and the y data. So, we do not include that independent predictor variable
    in our regression model. In conclusion:


    If p-value < 0.05 then include the variable.

    If p-value > 0.05 then do not include the variable.


    # 20.6.1 Analysis of Variance Table


    An analysis of variance table, or ANOVA, is commonly used to display the parameters
