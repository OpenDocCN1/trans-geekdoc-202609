  md: '# 10.1 AXIOMATIC FOUNDATIONS


    When building mathematical proofs, we often start with basic statements that are
    so obvious that we accept them as true, even if these initial statements are not
    provable. Axioms are the unproven statements that we accept as true to establish
    a foundation for a proof.


    Functions have an axiomatic basis. We define functions to process a certain input
