  md: '# # Coding Conventions


    DOI: 10.1201/9781032687759-A


    # ## A.1 epop


    In this book a Forth-like system called epop is used to assist with the expression
    of key concepts. epop is a Forth-inspired Functional Programming environment.
    An objective of epop is to be a vehicle for the study of Discrete Mathematics
    for Data Science.


    epop characteristics (vs https://forth-standard.org):


    +   - Most operations are postfix and oriented to a stack data structure.

    +   - Three data stacks facilitate data manipulation: Data stack, Return stack
    and Temporary stack.

    +   - Unrecognized code is interpreted as either numeric floating point or character
    string data. This is referred to as dynamic data typing.'
  merge: -1
  img_proc: true
- pgno: 530
  md: '+   - Data types include floats, integers, strings, tables, and executable
    objects.

    +   - Scripts can be interpreted during run-time or run against the interpreter
    from the command line.

    +   - Words may be defined during run-time or preprocessed into the runnable machine
    code at complile time.

    +   - Words may also be defined during run-time that persist in the runnable machine
    code after restart.


    Apart from the above points, please note that epop requires particular word sequences.
    epop will not deduce what the coder intends if a sequence is incorrect. This makes
    epop good for teaching/learning and enforcing systematized reasoning.


    # A.2 POSTFIX


    The notation used for mathematical expressions in this book includes postfix as
    well as the more common infix. Postfix is also called Reverse Polish Notation
    (RPN).


    In postfix, the operation symbol is written last, after the arguments. (This pertains
    to words that require arguments.)


    Examples of infix as postfix:


    ```

    1 + 2 becomes: 1 2 +

    x * 2 + 1 becomes: x 2 * 1 +

    ```


    The distinguishing characteristics of postfix operations:'
  merge: -1
  img_proc: true
- pgno: 531
  md: '+   • All arguments are listed before the operation.

    +   • No use of parenthesis (versus infix, which uses parenthesis for algebraic
    expressions).

    +   • No assignment operator, such as the “=” symbol.

    +   • No need for arithmetic operator precedence (order of operation) rules.


    Because of these characteristics, postfix operations are more compact and require
    less computing resources than infix systems. The same benefits can be said of
    prefix.


    The most significant programming languages that use either postfix or prefix notation
    are Assembly programming (prefix or postfix depending on CPU), Forth (postfix),
    and Lisp (prefix). C primarily uses infix.


    # A.3 POSTFIX OPERATIONS


    Unlike the standard infix notation, such as 3 + 4, wherein the + operator is between
    the operands 3 and 4, postfix notation has the operator last, such as:


    ```

    operand1 operand2 operator

    ```


    For example:


    ```

    3 4 +

    ```


    The result is 7.'
  merge: -1
  img_proc: true
- pgno: 532
  md: '1 Polish notation is a prefix style of logical notation that is generally considered
    to be the invention of Polish philosopher Jan Lukasiewicz, in 1924.


    ![](img/ff796e63b14a88ab72583e78f3994e90_532_0.png)


    To duplicate a value, use DUP as a postfix operation:


    ```

    5 DUP

    ```


    The result is a sequence: 5 5.


    To compute the average of two numbers, 3 and 5, and add 1 to the result:


    ```

    3 5 + 2 / 1 + . CR

    ```


    The “.” operator pops the value from the top of the stack, displaying the computed
    result of 5. The CR operation is a carriage return, used here to put an extra
    line between the result and any subsequent output, such as the terminal prompt.


    # A.4 FUNCTION DEFINITIONS


    We define functions as we would define words. Like the definition of a word in
    the English dictionary, the definition of a code word consists of other words
    that are elsewhere defined. Word definitions can be short or extensive. Of course,
    long word definitions are difficult to remember. Instead of one long complex word
    definition, it is preferable to have a sequence of word definitions that are short
    and relatively simple.'
  merge: -1
  img_proc: true
- pgno: 533
  md: 'A colon ":" begins the definition in a prefix manner and a semi-colon ";" ends
    the definition. For example, define a word called *double* as:


    ```

    : double DUP +;

    ```


    Here the definition of the word double consists of:


    ```

    DUP +

    ```


    That is the sequence of a duplication operation followed by an addition operation.
    For example:


    ```

    7 double

    ```


    The result is 14.


    # A.5 DATA


    The word. S is used to display data that is readily available in a location called
    the *data stack*.


    Data is processed on a stack, in a First In Last Out (FILO) manner. Consider the
    postfix expression:


    ```

    2 45 +

    ```


    The result of 9 is put back onto the stack. Thus, the available data is now:


    ```

    29

    ```'
