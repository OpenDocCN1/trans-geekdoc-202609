    But, we truncated that long bit string to 8 bits to avoid the tedium of calculations
    by hand.


    Alternatively, we could first convert the real number 3.625 to fixed point binary,
    where one 4-bit register is used to represent the whole number part, and another
    4-bit register is used to represent the floating point decimal part.


    We already know that 3 decimal is 0011 in binary. Using a table representing components
    of the power method, lets convert 0.625 to binary as well:


