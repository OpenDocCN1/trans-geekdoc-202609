- pgno: 53
  md: 'another. Programmers can extend a programming language''s abstract facilities,
    perhaps overriding or wrapping a function with a new one for previously unforeseen
    capabilities.


    For example, one need not understand the mechanical aspects of an automobile engine
    to drive a car. The driver just operates a few controls. If the problem is to
    retrieve produce from the market, the solution is not to build an engine, but
    to drive the car. Similarly, one can use a programming language''s built-in functions
    without needing to understand the algorithms comprising these functions.


    This is not to say that abstraction should be taken for granted or that one need
    only memorize procedures. For the sake of applying analytical tools in a relevant
    manner, it is important to be aware of context and, for data science, to understand
    linkages of data and function abstractions to their primitive roots.


    Scoping out the deeper implications of analytics is common in other fields as
    well. It reminds me of when in my college days my friend Mike told me about his
    dental school lab assignment. After he detailed the extensive dissection of his
    assigned cadaver, I asked, “Mike, what does this have to do with becoming a dentist!?”
    He replied, “Muscle and nerve roots throughout the head and upper torso connect
    everything.”


    See, even dentists have to realize when seemingly peripheral matters are actually
    integral to a system of knowledge.


    # 1.6 CHALLENGES WITH PROBLEM SOLVING


    An understanding of the problem must exist before writing a program to deal with
    the problem. Otherwise, the program will be irrelevant and the nature of the problem
    will likely be clouded by redundant complexities.


    When a problem is translated into programming syntax for the purposes of writing
    a program to solve a problem, there are usually two dimensions of complexity:
    The parameters of the problem at hand and the programming language syntax.


    However, when a student attempts to solve a problem by first translating example
    code, they actually face a third dimension of complexity: the logic of the example
    code. Example code as such may be a crutch that does not help the student strengthen
    problem-solving skills. Therefore, it is often better to write a program from
    scratch to solve a problem.


    Understanding the problem requires asking questions about the problem. Asking
    questions can help you effectively break a problem into smaller problems. The
    questions need not actually be directed to anyone but ourselves, for once you
    have isolated a question you are partway to the answer, and to further questions.'
