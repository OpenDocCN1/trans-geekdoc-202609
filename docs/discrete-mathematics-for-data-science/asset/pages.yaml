  md: 'The node count \(n\) of a full binary tree depends on its height, \(h\). That
    is:


    \(n = 2^h - 1\)


    Knowing \(n\) we can solve the above equation for \(h\). Here are the steps:


    \(n + 1 = 2^h - 1 + 1\) (Add 1 to both sides.)

    \(h = \log_2(n + 1)\) (By definition of logarithm.)


    Or, using the change-of-base formula:


    \(h = \log_{10}(n + 1) / \log_{10}2\)


    The number of leaves on a full binary can also be computed from \(n\), such as:


    \(leaves = (n + 1) / 2\)


    A complete binary tree is useful in that its elements can be mapped to the simple
    index of an array or list, in a contiguous sequence. A complete binary tree is
    full at all levels with the possible exception of the bottom level, which should
    be filled from left to right. Such list representation of a tree may be referred
    to as a flattened tree.


    Searching a flattened binary tree is a relatively simple linear search of the
    list in the index sequence 0 1 2 3 .... Given a level-order indexing of a binary
    tree, as shown in Figure 17.7(a), a breadth-first search is the same as linear
    search of a flattened tree.'
