  md: 'Computability is the broader concept, encompassing both computable and decidable
    problems. Determining if and when the upper limit of a program''s repeating operation
    will be met is a matter of the halting problem. Think of cases where an algorithm
    is unable to arrive at a solution. Perhaps there is no possible solution and the
    algorithm was not given a condition by which to stop.


    Suppose that we need to set n number of cycles for an algorithm to repeat:


    ```

    operations ''n REPEAT

    ```


    What should be the value of n?


    There could possibly be an infinite loop in that the program runs indefinitely.3
    Or, maybe the solution is simply not feasible for the current algorithm and machine.
    In these contexts the question of computability becomes one of decidability, as
    in: “Should the program proceed or stop?”


    The bounded halting problem is one in which its number of steps, its bounds, is
    finite. That is, it is decidable. This contrasts with the general halting problem,
    which is undecidable.


    At first thought, one might create an algorithm checker to verify if guest algorithms
    are decidable (able to complete task). A conundrum arises when a guest algorithm
    depends on the checker for input, and the checker in turn depends'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'on the guest for its output. The general arrangement could look as follows:


    ```

    { input guest halts? checker ? } checker WORD

    ```


    The checker program repeatedly checks the guest program with new input as long
    as the guest halts for some input. If the guest does not halt, then the checker
    waits indefinitely. Either way, the system runs forever and is undecidable.


    ³Related material is in the section titled *Infinite Cycles* in the *Repetition
    & Recursion* chapter.


    In practice, attempting to solve the general halting problem may be considered
    an exercise in futility, as it is not possible to have a solution for all problems.
    Nonetheless, a study of the halting problem illuminates the limits of computation,
    making it not completely futile.


    For example, the *epop* programming language includes statistical heuristics to
    guess if a user''s running code is locked in an infinite loop. If so determined,
    rightly or wrongly, *epop* warns the user and eventually breaks the loop on the
    user''s behalf.


    In cases where a model''s solutions are probabilistic rather than deterministic,
    each possible output state is assigned a probability. Such models may be referred
    to as *probabilistic state machines*.⁴'
