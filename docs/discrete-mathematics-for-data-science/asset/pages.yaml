    # 16.8 LIST IMPLEMENTATION OF A QUEUE


    A queue is a data structure that has a First-In-First-Out (FIFO) sequence of processing.
    This ordering is similar to the entry-ramp for a freeway – the first car to enter
    the ramp is the first car to exit the ramp. The first item to enter a queue is
    the first to exit – FIFO for first in, first out. This contrasts with a stack,
    which is LIFO – last in, last out.'
