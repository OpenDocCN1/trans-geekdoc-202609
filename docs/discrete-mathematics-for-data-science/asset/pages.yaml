  md: 'experiment. That is, a sample space $S$ has the distinct outcomes:


    { $s_1 s_2 \dots s_n$ }


    When all possible individual outcomes are equally probable, the sample space is
    an *equi-probable space*.


    An event is a subset of a *sample space*. An event can consist of an individual
    outcome from the sample space or a collection of outcomes. Hence, we use set notation
    and set operations when computing probabilities involving subsets of the sample
    space, as seen in the coverage below of *mutually exclusive events*, *independent
    events*, *joint probability*, and *conditional probability*.


    For example, suppose we are rolling a 6-sided die and we are interested in the
    probability of obtaining an even number. The sample space is $S = \{ 1 \ 2 \ 3
    \ 4 \ 5 \ 6 \}$ and the event we are interested in is $E = \{ 2 \ 4 \ 6 \}$. If
    we roll the die and do get an even number, then event $E$ has occurred.


    Another example: Find the probability of obtaining exactly two heads among three
    tosses of a coin. The sample space is:


    $S = \{ TTT \ TTH \ THT \ HTT \ HHT \ HTH \ THH \ HHH \}$


    Note that assuming a fair coin is used, each of the eight outcomes is equally
    likely, with a probability of $\frac{1}{8}$.


    The event of obtaining exactly two heads is the subset:


    $E = \{ HHT \ HTH \ THH \}$'
