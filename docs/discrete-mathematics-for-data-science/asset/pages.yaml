    The running probability is the average of the current and the prior n probabilities.
    For example:


    ```

    P_i = \frac{(P_i + P_{i-1} + P_{i-2} + \cdots + P_{i-n})}{n + 1}

    ```


    For example, the following code generates a list of 2000 random probabilities,
    offset by -0.5 to simulate a mean of 0 in a range of -0.5 to +0.5, and then sorted.
    In order to achieve some data smoothing, each output number is the moving average
