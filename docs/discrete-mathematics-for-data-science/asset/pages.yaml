    # 0.3.1 Coding Conventions


    Coding is used in this book as a vehicle for learning the subject matter. You
    can learn the streets of the big city by studying a map. You can additionally
    walk the streets yourself and learn your way around through experience. To program
    is to walk the streets. Likewise, programming a statistics routine is a _learning-by-doing_
    approach that seems to be effective for many students.


    Coding allows us to condense otherwise verbose descriptions of concepts into a
    relatively compact, albeit abstract, perspective. For example, code that tests
    conditions is used to augment concepts of mathematical proof.


    To an extent, this book uses a Forth-like code called _epop_ for its compact,
    yet natural language structure. _epop_ is designed as a teaching tool to help
    students learn discrete math for data science, with data processing in mind. _epop_''s
    postfix notation allows fairly concise mathematical expressions, which leads to
    relatively compact syntax. More about this coding convention is presented in [Appendix
    A](#), as well as in the online resources noted in [Appendix C](#).'
