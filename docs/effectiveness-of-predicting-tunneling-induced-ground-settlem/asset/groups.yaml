    \ matrices w_{j,i} and w_{k,j} is m × n and n × s, respectively. The size of the\
    \ bias vector is n + s. Therefore, the total number of parameters needed to be\
    \ trained is (m + s + 1) × n + s. In applying ground surface settlement predictions,\
    \ one neuron (s = 1) in the output layer represents settlement. Thus, the total\
