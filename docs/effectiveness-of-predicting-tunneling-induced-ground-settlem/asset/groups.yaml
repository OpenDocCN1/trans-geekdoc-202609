    ML 方法摄取数据以学习。具体而言，ML 算法旨在找到产生最佳模型的最佳超参数。相应的超参数随机初始化并使用成本函数进行优化。通过从训练集学习来实现寻找最佳超参数的过程。使用训练好的超参数，ML
    模型具有预测输出的能力。本研究的数据集被随机划分为两组：训练集和测试集，如图 5 所示。训练集占数据的 70%，其余 30% 分配给测试集。两部分划分是 ML
    算法应用中的一种通用做法，旨在测试模型的预测性能。


    ## 4. 结果


    ### 4.1. 模型性能比较


    通常，可以进行统计性能评估以定量评估模型性能。采用式 (15) 定义的决定系数 (R²) 来评估和比较模型性能。它衡量模型提供的预测效果如何。最佳可能得分为
    1。R² 值越高，模型性能越好。此外，R² 值可能为负值，因为模型可能任意变差。


    R² = 1 − Σ(monitoring − predictions)² / Σ(monitoring − mean of monitoring)²   (15)


    七个模型的训练和测试精度已计算并在图 6 中呈现。根据计算的测试精度，预测性能从最好到最差为 RF (0.9) > GB (0.82) > DT (0.72)
    > PI-BPNN (0.79) > BPNN (0.59) > SVR (0.52) > MLR (− 3.89 × 10¹⁷)。在这些应用的模型中，MLR
    既没有学习能力也没有预测能力，这意味着诱发地面沉降与影响变量之间的关系是非线性的。非线性关系也可以由图 4 所示的变量系数矩阵指示。地表沉降与 14 个影响变量的相关性较弱，相关系数
    (R) 小于 0.3。


    在非线性模型的应用中，像 RF 和 GB 这样的集成方法已成功使用，具有相对较高的学习和测试精度。RF 模型实现了最佳性能。此外，在模型精度方面，集成模型
    (RF 和 GB) 优于单一 DT 方法。与浅层结构学习架构相比，NN 模型采用深度架构来学习分层表示。深度结构 ML 方法通常能够捕捉比传统学习方法更复杂、分层启动的输入统计模式，以适应新区域。此外，随着数据不断增大，深度学习对于为大规模数据集提供预测分析解决方案至关重要
    (Pasini, 2015; Qiu et al., 2016)。然而，对于隧道诱发地面沉降的应用，其中可用数据集较小，BPNN 的预测性能不如基于树的 ML
    算法。此外，所提出的 PI-BPNN 模型优于典型的 BPNN，表明在应用小数据集时，NN 架构和输入选择对模型性能至关重要。


    ### 4.2. 考虑欠预测和过预测的特征重要性评估


    除本研究中使用的 R² 外，模型性能还可以通过其他性能指标进行评估，例如平均绝对误差 (MAE)、均方根误差 (RMSE)、相对均方根误差 (RRMSE)、标准差
    (σ) 和多目标误差 (MOE)，其定义如下


    MAE = 1/n Σᵢ₌₁ⁿ |dᵢ − yᵢ|   (16)


    RMSE = √[1/n Σᵢ₌₁ⁿ (dᵢ − yᵢ)²]   (17)


    $$\mathrm{RRMSE}=\sqrt{\frac{1}{n}\sum_{i=1}^{n}\left(\frac{d_i-y_i}{d_i}\right)^2}
    \tag{18}$$


    $$\sigma=\sqrt{\frac{1}{n}\sum_{i=1}^{n}(e_i-\bar e)^2} \tag{19}$$


    $$MOE=RRMSE/(1+R) \tag{20}$$


    其中 $d$ 为监测值；$y$ 为预测值；$\bar d$ 和 $\bar y$ 分别为实际值和预测值的均值；$e$ 为绝对误差，且 $e=|d_i-y_i|$；$\bar
    e$ 为绝对误差的均值；$n$ 为数据集的数量。


    在上述参数中，MAE 反映了预测数据与实测数据之间误差的平均幅度，而 RMSE 描述了差异的标准差。RRMSE 是 RMSE 与监测值均值的比值 (Bsaibes
    et al., 2009)。RRMSE、RMSE、MAE 和 $\sigma$ 仅说明误差而不考虑相关性。MOE 函数结合了上述指标。


    这些方程通常用于 ML 应用中，以指示预测与观测之间的总体偏差。误差越高，模型从训练数据中正确泛化的可能性就越小。尽管这些方程存在细微差异，但一个共同点是欠预测和过预测被同等考虑。然而，对于隧道开挖引起的地面沉降，与过预测相比，欠预测可能导致项目失败甚至人员伤亡。因此，提出了一种
    QE 准则来评估模型性能。QE 准则中给出了高估和低估的不同惩罚。在 QE 计算中，可以对高估和低估给予不同的惩罚。这些惩罚基于所选分位数 ($\gamma$)
    的值，如式 (21) 所示。分位数误差可以被视为 MAE 的扩展，当分位数为 50% ($\gamma=0.5$) 时，QE 的方程简化为 MAE 的方程。$\gamma>0.5$
    的分位数损失函数对低估的惩罚大于对高估的惩罚。在模型性能评估中，QE 计算中的参数 $\gamma$ 已设为 0.7。每个模型的预测值 ($y$) 为 1000
    次预测结果的均值。


    $$QE=\frac{1}{n}\left(\sum_{i|d_i\le y}(\gamma-1)|d-y|+\sum_{i|d_i>y}\gamma|d-y|\right)
    \tag{21}$$


    使用 QE 准则，预测的模型性能从最好到最差为 RF (0.36) > GB (0.38) > DT (0.41) > SVR (1.02) > PI-BPNN
    (1.17) > BPNN (1.22) > MLR (1.81 × 10⁹)。即使对欠预测给予更多惩罚，RF 算法在 QE 误差方面仍具有最佳模型性能。与通过
    $R^2$ 评估的模型性能 (RF > GB > DT > PI-BPNN > BPNN > SVR > MLR) 相比，使用 QE 误差时 SVR 优于
    NNs，表明 NNs 容易产生欠预测。


