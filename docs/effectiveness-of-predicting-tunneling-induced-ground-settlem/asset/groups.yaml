    # 2.1. MLR


    MLR is a method of finding a linear model for the relationship between the output
    parameter (dependent variable) and a set of input parameters (independent variables).
    The mathematical form of the model is expressed as


    y = b1 x1 + b2 x2 + ⋯ + bn xn + c  (1)


    where bi is the regression coefficient representing the change of output (y) when
    the inputs (xi) change by 1 unit, and c is a bias term. Parameters bi and c are
    initiated randomly in the beginning, and then optimized using the gradient descent
    method so that this formula can predict the output closely.


    # 2.2. DT model


    DT model is a tree structure that consists of an arbitrary number of nodes and
    branches at each node. The depth of the tree determines how deep the tree can
    grow. The deeper the tree, the more it obtains information about the data. DT
    regression uses a fast divide-and-conquer-greedy algorithm that recursively splits
    the data into smaller parts (Pekel, 2020). The dataset is split at several split
    points for each input variable. At each split point, the errors of the cost function
    are calculated and compared. The split point is eventually determined by the variable
    yielding the lowest cost function values.


    The general procedure for decision tree regression is:


    +   1. Start with a single node.

    +   2. Determine the split point that offers the minimum value of the cost function.

    +   3. For each new node, go back to step (2). The procedure exists when the stopping
    criterion is reached.


    # 2.3. RF model


    RF is an ensemble learning technique developed by Breiman (2001) to improve the
    regression tree method by combining multiple DT models. In RF regression, each
    tree is built using a deterministic algorithm by selecting a random set of variables
    and a random sample from the training dataset (Mutanga et al., 2012). The RF algorithm
    is not biased since there are multiple trees, and each tree is trained on a subset
    of data. Thus, even if a new data point is introduced in the dataset, the overall
    algorithm is not affected much since new data may impact one tree, but it is hard
    to impact all the trees.


    Three parameters need to be optimized in RF:


    +   1. The number of regression trees, which is the most critical parameter.

    +   2. The number of different predictors tested at each node. The default value
    is 1/3 of the total number of the variables.

    +   3. The minimal size of the trees’ terminal nodes, the default value of which
    is 1.


    # 2.4. GB model


    GB regression is an ensemble method that employs a collection of simple additive
    regression model predictions and averages them to estimate the response (Lyashevska
    et al., 2020). GB regression trees consider additive models of the following form:


    Fm(x) = Σ_{m=1}^{M} ym hm(x)  (2)


    where ym is the learning rate, and hm(x) is the weak learner. DTs of fixed size
    typically serve as weak learners. GB regression trees build the additive model
    in a forward stepwise fashion (Eq. (3)). At each stage, the weak learner hm(x)
    is chosen to minimize the cost function. Specifically, GB splits each tree and
    uses the most contributing variable to minimize the cost function.


    Fm(x) = Fm−1(x) + Σ_{m=1}^{M} ym hm(x)  (3)


    Five essential parameters in the GB regression model need to be specified:


    +   1. The number of boosting stages that will be performed.

    +   2. The maximum depth, which limits the number of nodes in the tree. The optimum
    value depends on the interaction of the input variables.

    +   3. The minimum number of samples required to split an internal node.

    +   4. The learning rate, which describes how much the contribution of each tree
    will shrink.

    +   5. The cost function to be optimized. The lease squares function is used in
    this study.


    # 2.5. SVR model


    A set of training patterns (x1, y1), (x2, y2), …, (xl, yl) are given, where xi
    ∈ R^n and yi ∈ R (i = 1, 2, …, l). Each yi value is the desired output for the
    input vector xi. The SVR model is learnt from these patterns and used to predict
    the target values of unseen input vectors (Yeh et al., 2011).


    SVR is a popular choice for linear and nonlinear regression types, depending on
    the kernel selection. Transforming data is achieved by kernel functions. Kernels
    can be linear, nonlinear, polynomial, radial basis function (RBF), sigmoid, etc.
    Kernel selection is dataset-dependent. The SVR model with RBF kernel (RBF-SVR)
    is used in this study, chosen by trial-and-error experiments. Two associated hyperparameters,
    gamma and C, are needed to be specified. The parameter gamma defines how far the
    influence of a single training example reaches. It can also be considered as the
    inverse of the radius of influence of samples selected by the model as support
    vectors. The parameter C trades off the correct domain of training examples against
    the maximum decision function margin.


    # 2.6. BPNN model


    As a specific example of deep learning methods, NN models can predict the outcome
    from a developed network. A feedforward NN is a parametric function that takes
    a set of input values and maps them to a corresponding setting of output values
    (Darabi et al., 2012). The ANN employed in this study is a feedforward network
    trained by a back-propagation algorithm named BPNN. Ideally, the network becomes
    more knowledgeable about the relationships after each iteration or epoch of the
    learning process with the error back-propagation algorithm being used for this
    purpose. Furthermore, BPNN provides a meaningful nonlinear relationship between
    input and output neurons by iterative learning, with the predictive ability for
    dynamic nonlinear behaviors. Such inherent properties'
