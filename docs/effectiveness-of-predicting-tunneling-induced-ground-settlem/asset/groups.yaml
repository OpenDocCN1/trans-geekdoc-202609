    ### 4.3. 特征重要性


    ML 模型用于识别地表沉降与各种影响变量之间的关系。解释给定模型为何如此行为的一种方式是分析特征重要性。特征重要性提供了对模型行为高度压缩、全局性的洞察。


    置换特征重要性这一模型检验技术通过移除每个特征来测试模型性能。这样，各个变量的重要性可以直接比较。此类方法可用于消除机器学习算法作为不可复现“黑箱”的观念，并有助于获得新的见解。具体而言，置换特征重要性衡量的是在置换某个特征值后模型预测误差的增加，即当单个特征值被随机打乱时模型分数的下降。如果打乱其值会增加模型误差，因为模型依赖该特征进行预测，则该特征为“重要”。相反，如果打乱其值使模型误差保持不变，因为模型在这种情况下忽略了该特征用于预测，则该特征为“不重要”。


    然而，并非所有学习方法都能识别重要特征，因为它们过于复杂，无法分析单个协变量对整体结果的贡献，例如 ANNs 和 SVR (Altmann et al.,
    2010)。此外，MLR 的失败应用（图 6a）表明输入与输出之间的非线性关系未被捕捉，说明在 MLR 模型中没有特征被视为“重要”。因此，置换特征重要性将基于
    DT、RF 和 GB 方法的预测结果进行评估。


    根据图 7 所示的结果，已识别出六个对地表沉降有贡献的重要参数，包括隧道深度、DTM、ACM、注浆压力、掘进速率和推力。通常，隧道深度、DTM 和 ACM
    参数由隧道设计和地质条件决定。因此，由隧道掘进引起的地表沉降可通过如注浆压力、掘进速率和推力等 TBM 操作进一步控制。


    ### 4.4. 模型稳定性


    在应用机器学习算法时，模型精度通常被视为评估和选择学习算法的主要标准。精度高的算法可以以高度的置信度预测结果。然而，学习算法的稳定性也是一个重要问题，往往被较少考虑。因此，应给予更多关注，特别是对于小数据集的机器学习应用。学习算法的稳定性，也称为学习方差，指训练数据集改变时输出的变化。如果在训练集被修改时输出变化不大，则学习算法可被视为稳定。此外，算法稳定性也可被视为超参数训练好坏的体现。方差高的模型非常关注训练数据，在未见数据上泛化能力不佳。


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_9_0.png)


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_9_1.png)


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_9_2.png)


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_9_3.png)


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_9_4.png)


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_9_5.png)


    *图 6.* 应用的机器学习算法的精度：（a）MLR，（b）DT，（c）RF，（d）GB，（e）SVR，（f）BPNN，（g）PI-BPNN 模型。


    本研究中的每个机器学习模型都将进行多次预测，以研究小数据集上的模型稳定性。方差 s²（式 (22)）用于评估模型稳定性。它被计算为每次预测与平均预测之间平方偏差的平均值。数据分布越分散，相对于均值的方差越大。


    $$

    s^2 = \frac{\sum (X - \bar{X})^2}{n - 1}

    $$


    (22)


    其中 X 为预测值，X̄ 为平均预测值，n 为重复预测次数。方差越低，机器学习模型越稳定。


    这里对模型稳定性的评估分为两步进行。首先，测试训练集不发生变化的极端情况。每个单一测试样本已被预测 1000 次。1000 次预测结果的方差（图 8）被计算以评估由虚线表示的模型稳定性。由实线表示的方差趋势使用移动平均技术获得。根据图
    8 所示的结果，在相同的训练集和模型架构下，预测结果存在显著差异。BPNN 和 PI-BPNN 的稳定性平均方差分别为 5.76 和 3.58。BPNN 和
    PI-BPNN 显示出较差的模型稳定性，表明小数据集无法充分训练深度架构中的超参数。与典型的 BPNN 相比，所提出的 PI-BPNN 在模型精度和模型稳定性方面均表现更优。对于浅层结构机器学习算法（DT、RF、GB、SVR
    和 MLR），DT 模型显示出高方差（1.06），而 RF、GB、SVR 和 MLR 模型显示出良好的稳定性，方差几乎等于零。由于 MLR 模型完全未能学习和预测隧道诱发地表沉降，为节省计算资源，将不再进一步讨论。第二步是使用可变数据集进一步研究
    RF、GB 和 SVR 模型的稳定性。训练集和测试集被随机拆分 1000 次以重复训练模型。三种算法被训练 1000 次以提供 1000 次预测。图 9 所示的模型性能结果表明，RF、GB
    和 SVR 可被视为稳定模型，因为输出性能变化不大，方差小于 0.2。GB、SVR 和 RF 的平均方差分别为 $5.5 \times 10^{-3}$、$5.39
    \times 10^{-27}$ 和 $3.02 \times 10^{-27}$。因此，可以得出模型稳定性从最好到最差的顺序为 RF > SVR > GB
    > DT > PI-BPNN > BPNN。


    在所有这些应用的学习算法中，RF 模型显示出最佳的精度和稳定性。


