    Plots of soil void ratio *e* vs. effective pressure *p* can be drawn according
    to results of laboratory compression test. Based on the *e-p* curve, the coefficient
    of compressibility (*a_v*) expressed as Eq. (11) can be calculated, representing
    the change of void ratio concerning the applied effective pressure during compression.


    Given the initial void ratio of the consolidation layer (*e_0*), the coefficient
    of volume compressibility (*m_v*) is obtained according to Eq. (12). The parameter
    *m_v* represents the compression of soil per unit due to a unit increase of pressure.
    The modulus of soil compressibility (*E_s*) expressed in Eq. (13) is eventually
    selected as the parameter to represent the soil compressibility. Results of the
    calculated modulus of compressibility are plotted in Fig. 3. The ACM along drilled
    borehole can be calculated to represent the overall soil compressibility for every
    monitoring point using Eq. (14), where *E_si* is the modulus of soil compressibility
    of the ith soil layer, and *h_i* represents the height of the ith soil layer.


    ```

    a_v = -\Delta e / \Delta p  (11)

    m_v = a_v / (1 + e_0)  (12)

    E_s = 1 / m_v  (13)

    ACM = \sum E_s_i h_i / \sum h_i  (14)

    ```


