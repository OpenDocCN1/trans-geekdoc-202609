    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_10_1.png)


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_10_2.png)


    *图 7.* 机器学习算法识别的特征重要性：（a）DT，（b）RF，（c）GB 模型。


    机器学习模型的一个普遍优势是能够处理多变量数据并在复杂、动态甚至混沌的环境中提取隐含关系。此外，它们对预测变量不做分布假设。


    DT、RF 和 GB 是三种基于树的算法。DT 是一种基本的树结构算法，为 RF 和 GB 提供基础学习器。RF 和 GB 是最先进的集成学习技术，它们将多个机器学习算法（基础学习器）的预测结果结合起来以提供更准确的预测。单个
    DT 可能相对较弱，与一组树相比。理论上，树木更多的集成方法通常能产生更好的结果并作为更稳健的模型（Elish et al., 2013）。本研究表明，RF
    和 GB 在预测精度和模型稳定性方面优于 DT 模型。然而，预测精度与处理成本之间存在权衡。树越多，过程越慢，因为每棵树都需要生成、处理和分析。此外，特征越多，处理速度越慢。RF
    和 GB 之间的区别在于树的构建方式。RF 独立（并行）构建每棵树，而 GB 每次构建一棵树（顺序）(Callens et al., 2020)。


    MLR 模拟自变量与因变量之间的线性关系，而其他六种机器学习方法处理非线性关系。如其数学公式所示（式 (1)），其主要优势是直观地提供一个或多个预测变量的相对影响。然而，MLR
    无法近似影响变量与地表沉降之间的非线性关系。


    构建 SVR 模型需要数据转换，通过核函数实现。核选择取决于数据集。它可以通过试错法选择。选择测试精度最高的核。一旦核被选定，SVR 只有几个需要确定的超参数，易于实现。SVR
    显示出良好的模型稳定性但预测精度较差。在给予更多惩罚和欠预测并使用 QE 准则的情况下，SVR 的预测精度高于神经网络模型。


    在多层神经网络中，每个神经元通过某些超参数与其他神经元连接。鉴于存在许多超参数，如权重矩阵和偏置向量，神经网络具有学习和建模非线性和复杂关系的卓越能力。然而，网络中涉及的许多超参数可能无法通过有限数据集得到充分训练以提供理想的预测性能。本文提出的
    PI-BPNN 针对小数据集设计，考虑了模型架构与数据集大小之间的关系，表现优于典型的 BPNN。尽管神经网络在解决复杂问题方面功能强大，但它们不足以应用于小数据集，预测精度和模型稳定性均较差。


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_11_0.png)


    ## 6. 结论


    由于任何给定隧道项目的建设周期有限，可用的地表变形监测数据集都很小。当数据集很小时，机器学习方法能否有效预测隧道诱发地表沉降？采用浅层和深层结构，七种机器学习算法已被应用于预测隧道诱发地表沉降。这些机器学习方法包括
    MLR、DT、RF、GB、SVR、BPNN 和 PI-BPNN。


    七种机器学习算法从模型精度和稳定性的角度进行评估。我们的结果表明 MLR 模型未能学习和预测。此外，隧道诱发地表沉降与可能的影响变量之间的非线性关系得到了证实，包括
    TBM 操作参数、遇到的地质条件和隧道几何形状。在非线性学习算法的应用中，RF 模型表现最佳，预测精度高达 0.9，稳定性方差低至 $3.02 \times
    10^{-27}$。而被认为在近似复杂函数方面功能强大的 BPNN，其表现不如传统的浅层结构学习算法。所提出的 PI-BPNN 方法应用了置换特征选择技术以降低模型复杂度，在小数据集上实现了比典型
    BPNN 更好的性能。因此，无论模型多么有吸引力，模型选择都应基于对所要解决问题的充分考虑。总之，即使可用数据集大小很小，机器学习算法也可以成功用于预测隧道诱发地表沉降。此外，诸如
    RF 和 GB 回归等集成方法优于其他学习算法。


    此外，已识别出对开挖过程中发生的地表沉降贡献最大的六个变量，包括隧道深度、DTM、ACM、注浆压力、掘进速率和推力。


