    # 3.3. Data distribution


    The dataset used to design ML models for predicting the ground surface settlements
    consists of 14 input variables and 187 observations. Twelve parameters and their
    corresponding ranges of values are summarized in Table 3. The other two parameters
    are geology at tunnel crown and invert, represented by values 0 and 1, respectively,
