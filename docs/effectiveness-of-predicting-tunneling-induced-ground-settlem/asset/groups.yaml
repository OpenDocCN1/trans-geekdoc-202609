    在训练过程中，网络模型中的权重矩阵和偏置向量被调整，直到出现期望的输入-输出映射。因此，网络模型可以通过训练进行学习和预测。以下是BPNN算法中涉及的方程：


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_3_0.png)


    图1. ANN与信号传播。


    y_j = f_1( sum_{i=1}^{m} w_{j,i} x_i + b_j )   (4)


    y_k = f_2( sum_{j=1}^{n} w_{k,j} y_j + b_k )   (5)


