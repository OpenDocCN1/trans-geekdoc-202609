    \ Similarly, i, j, and k represent an individual neuron of the input, hidden,\
    \ and output layers.\n+   \n+   (2) The input layer plays no computational role\
    \ but merely serves to pass the input vector to the network. The input neurons\
    \ transmit these values across the links to the hidden layers (Eq. (4)). Each\
    \ node computes the weighted sum of its input (x_i). The result is then put through\
    \ an activation function (f_1) to generate a signal result for the neuron (y_i).\
    \ The activation functions of tan-sigmoid and log-sigmoid are commonly applied,\
