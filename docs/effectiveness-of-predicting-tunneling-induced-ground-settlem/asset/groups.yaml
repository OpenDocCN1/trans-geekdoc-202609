    Published research for tunneling-induced ground settlements via ML algorithms.


    | Dataset size | Number of inputs | Applied ML method | Reference |

    |---|---|---|---|

    | 49 | 10 | RF | Kohestani et al. (2017) |

    | 49 | 10 | ANN | Suwansawat and Einstein (2006) |

    | 49 | 10 | Wavelet-ANN | Pourtaghi and Lotfollahi-Yaghin (2012) |

    | 50 | 5 | ANN | Darabi et al. (2012) |

    | 53 | 5 | ANN | Ahangari et al. (2015) |

    | 55 | — | SVM | Zhang et al. (2017) |

    | 81 | 14 | ANN | Santos and Celestino (2008) |

    | 95 | — | ANN | Boubou et al. (2010) |

    | 95 | 15 | Fuzzy-ANN | Bouayad and Emeriault (2017) |

    | 113 | 19 | ANN | Kim et al. (2001) |

    | 115 | 8 | ANN | Goh and Hefney (2010) |

    | 143 | 3 | ANN | Hasanipanah et al. (2016) |

    | 143 | — | MLR, ANN | Moghaddasi and Noorian-Bidgoli (2018) |

    | 147 | 10 | RVM | Wang et al. (2013) |

    | 148 | 8 | ANN, SVM, TM | Zhang et al. (2020a) |

    | 160 | 9 | ANN | Marto et al. (2012) |

    | 200 | 11 | NNs, RF, SVM | Chen et al. (2019) |

    | 230 | 13 | ANN, SVM | Ocak and Seker (2013) |

    | 294 | 12 | RF, SVM, NNs | Zhang et al. (2020b) |

    | 300 | 7 | SVM, DT, LR, NNs | Mahmoodzadeh et al. (2020) |

    | 328 | 17 | ANN | Zhang et al. (2020c) |

    | 356 | 11 | ANN | Shi et al. (1998) |


    Note: ANN — Artificial neural network; NNs — Neural networks; RF — Random forest;
    SVM — Support vector machine; TM — Tree-based method; RVM — Relevance vector machine;
    LR — Linear regression; MLR — Multiple linear regression.


    representing predicted ground settlements (Suwansawat and Einstein, 2006). However,
    the neural network (NN) architecture design for applying small datasets is less
    considered, easily leading to overfitting performances. Apart from ANNs, shallow
    architecture models have also been utilized, such as support vector machine (SVM),
    decision tree (DT) and random forest (RF). SVM is designed to analyze large amounts
    of data and capable of handling high dimensionality (>1000) very well (Yang and
    Trew, 2004). SVM used in regression problems is known as support vector regression
    (SVR). Tree-based methods (TMs) such as DT and RF are recently introduced to predict
    tunneling-induced ground settlements (Chen et al., 2019). These applied ML methods
    are typically evaluated by the difference between predicted and target outputs.
    Predictive results could be either underprediction or overprediction. Calculated
    errors for model assessment typically consider underprediction and overprediction
    equally. However, underprediction is more severe than overprediction since underprediction
    may cause project failure. Additionally, the model stability is less considered.
    Model stability indicates if model performance is affected by variabilities in
    the model architecture and if the obtained results can be considered robust.


    Motivated by the above considerations, this paper aims to answer the question
    — “If ML algorithms can be applied effectively in small tunneling-related datasets.”
    Based on the literature review and summarization (Table 1), seven ML algorithms
    widely considered in publications will be applied, including multiple linear regression
    (MLR), DT, RF, gradient boosting (GB), SVR, an ANN trained by the back-propagation
    (BPNN) and permutation importance-based BPNN (PI-BPNN) algorithms. It should be
    noted that the PI-BPNN architecture is first-time proposed based on the consideration
    of applying NNs to small datasets. These seven algorithms are used and compared
    in an urban shield tunnel in China. Both model accuracy and stability are analyzed
    for seven learning algorithms. In addition, the quantile error (QE) is proposed
    to assess the model performance based on the consideration of underprediction
    and overprediction. Besides identifying the most suitable model, this paper also
    provides the feature importance using the permutation feature selection method.
    Several variables are identified as important factors affecting tunneling-induced
    ground settlements.


    # 2. Employed ML algorithms


    For ML models, parameters connecting inputs and outputs are initiated randomly
    and optimized based on a cost function. The cost function indicates the difference
    between the actual and the predicted outputs. An ML algorithm aims to minimize
    the cost function, “learn” the model parameters, and eventually achieve the prediction.
    The relationship between inputs and outputs could be linear or nonlinear. A linear
    ML model (MLR) and six nonlinear models (DT, RF, GB, SVR, BPNN and PI-BPNN) will
    be discussed.


    The successful application of ML techniques largely depends on the architecture
    design and hyperparameter training, such as the kernel selection of SVM, tree
    depth and tree number of tree-based algorithms, hidden layer design of NN models,
    etc. Without these considerations and detailed model design, it easily leads to
    the failed application of ML techniques. Additionally, model selection or improvement
    should be based on the consideration of the problem to be solved. For example,
    since the NN is powerful at capturing complex relationships, it might not provide
    ideal performance. Consequently, an improved BPNN model named PI-BPNN is proposed
    in this paper, which fully considers the relationship between a small dataset
    and network architecture.


    All the algorithms and analyses are programmed in MATLAB and Python. The Python
    code is implemented using Scikit-learn (Pedregosa et al., 2011) Python library.'
