    - 4. The learning rate, which describes how much the contribution of each tree
    will shrink.

    - 5. The cost function to be optimized. The least squares function is used in
    this study.


    ## 2.5. SVR model


    A set of training patterns (x1, y1), (x2, y2), …, (xl, yl) are given, where xi
    ∈ R^n and yi ∈ R (i = 1, 2, …, l). Each yi value is the desired output for the
    input vector xi. The SVR model is learnt from these patterns and used to predict
    the target values of unseen input vectors (Yeh et al., 2011).


    SVR is a popular choice for linear and nonlinear regression types, depending on
    the kernel selection. Transforming data is achieved by kernel functions. Kernels
    can be linear, nonlinear, polynomial, radial basis function (RBF), sigmoid, etc.
    Kernel selection is dataset-dependent. The SVR model with RBF kernel (RBF-SVR)
    is used in this study, chosen by trial-and-error experiments. Two associated hyperparameters,
    gamma and C, are needed to be specified. The parameter gamma defines how far the
    influence of a single training example reaches. It can also be considered as the
    inverse of the radius of influence of samples selected by the model as support
    vectors. The parameter C trades off the correct domain of training examples against
    the maximum decision function margin.


    ## 2.6. BPNN model


    As a specific example of deep learning methods, NN models can predict the outcome
    from a developed network. A feedforward NN is a parametric function that takes
    a set of input values and maps them to a corresponding setting of output values
    (Darabi et al., 2012). The ANN employed in this study is a feedforward network
    trained by a back-propagation algorithm named BPNN. Ideally, the network becomes
    more knowledgeable about the relationships after each iteration or epoch of the
    learning process with the error back-propagation algorithm being used for this
    purpose. Furthermore, BPNN provides a meaningful nonlinear relationship between
    input and output neurons by iterative learning, with the predictive ability for
    dynamic nonlinear behaviors. Such inherent properties offer a clear edge over
    sophisticated nonlinear regression techniques (Mukherjee and Routroy, 2012). The
    general architecture of a NN applied to tunnel engineering consists of an input
    layer, a hidden layer, and an output layer. It has been demonstrated that a NN
    model with one hidden layer can sufficiently model highly complex nonlinear functions
    with enough number of hidden neurons (Hegazy et al., 1994). Specifically, a three-layer
    BPNN architecture shown in Fig. 1 includes the following components:


    - (1) A general network model consisting of simple processing elements named neurons.
    Neurons are arranged in layers and are combined through excessive connectivity.
    The number of neurons in the input, hidden, and output layers is denoted as m,
    n, and s, respectively. Similarly, i, j, and k represent an individual neuron
    of the input, hidden, and output layers.

    - (2) The input layer plays no computational role but merely serves to pass the
    input vector to the network. The input neurons transmit these values across the
    links to the hidden layers (Eq. (4)). Each node computes the weighted sum of its
    input (x_i). The result is then put through an activation function (f_1) to generate
    a signal result for the neuron (y_i). The activation functions of tan-sigmoid
    and log-sigmoid are commonly applied, which are differentiable and bounded. The
    parameter (b_j) represents a bias associated with a neuron.

    - (3) The results of the hidden neurons (y_i) are then transmitted across their
    activation function f_2 to the neurons in the output layer (Eq. (5)). The output
    signal of neuron k is denoted by y_k, where the parameter w_{k,j} represents the
    weight on the connection between hidden nodes (j) and output nodes (k), and b_k
    is the bias.

    - (4) A back-propagation signal (an error signal) propagates backward through
    the network. The desired response or target output can be denoted by d_k. Consequently,
    an error signal denoted by E is produced by Eq. (6). The error signal is then
    propagated back to adjust weights and biases of each layer using a gradient descent
    method, namely, the weights and biases can be updated and revised in the direction
    of the loss function''s negative gradient (E). Specifically, parameters related
    to each neuron are adjusted according to the delta rule shown in Eqs. (7)–(10),
    where η denotes the learning rate.


    During the training process, weight matrices and bias vectors in the network model
    are adjusted until the desired input-output mapping occurs. Thus, the network
    model can learn and predict through training. The following are the equations
    involved in the BPNN algorithm:


