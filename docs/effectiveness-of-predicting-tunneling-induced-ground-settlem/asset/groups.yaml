    Dr. Wendy Zhou is a Professor at the Department of Geology and Geological Engineering
    and the Director of the GIS & Geoinformatics Program, Colorado School of Mines
    in Golden, Colorado, USA. Wendy Zhou received her Ph.D. degree in geological engineering
    from Missouri University of Science & Technology, USA, in 2001. Her research interests
    include: (1) geographic information system (GIS) and remote sensing applications
    in geohazard analysis, environmental impact study, and natural resource management,
    (2) interferometric synthetic aperture radar (InSAR) and machine learning applications
    in ground movement monitoring and landslide assessment, (3) rock mass characterization,
    and (4) numerical modeling for the ground thermal regime and stress-strain distribution
    in the rock or soil mass. She has supervised more than 30 masters and 9 Ph.D.
    students. She has published more than 60 papers in peer-reviewed journals or peer-reviewed
    conference proceedings. She has also contributed to 7 book chapters. She has been
    serving as an Associate Editor of the Journal of Applied Remote Sensing since
    2014 and a Topic Editor of Remote Sensing since 2020.

