  mdcn: "\n\n## 岩石力学与岩土工程学报\n\n期刊主页：www.jrmge.cn\n\n**全文论文**\n\n## 使用机器学习方法和小数据集预测隧道开挖引起的地表沉降的有效性\n\
    \nLinan Liu a,*, Wendy Zhou a,*, Marte Gutierrez b\n\n- a 美国科罗拉多州戈尔登市科罗拉多矿业大学地质与地质工程系，邮编\
    \ 80401\n- b 美国科罗拉多州戈尔登市科罗拉多矿业大学土木与环境工程系，邮编 80401\n- * 通讯作者。\n- * 电子邮件地址：wzhou@mines.edu（W.\
    \ Zhou）。\n- 同行评审由中国科学院岩土力学研究所负责。\n\n### 文章信息\n\n- 文章历史：\n  - 收稿日期：2021年3月31日\n\
    \  - 修改稿收到日期：2021年7月7日\n  - 接受日期：2021年8月20日\n  - 在线发布日期：2021年12月11日\n- 关键词：\n\
    \  - 地表沉降\n  - 隧道开挖\n  - 机器学习\n  - 小数据集\n  - 模型精度\n  - 模型稳定性\n  - 特征重要性\n\n###\
    \ 摘要\n\n隧道开挖引起的地表沉降预测是一项重要任务，尤其是在城市环境中进行隧道施工时。地表沉降必须限制在可容忍的阈值内，以避免对地上结构造成损害。机器学习（ML）方法正因其强大的学习和预测能力，在包括隧道和地下开挖在内的许多领域日益普及。然而，从应用\
    \ ML 方法的角度来看，从隧道工程中收集到的可用数据集通常很小。当可用数据集较小时，ML 算法能否有效预测隧道开挖引起的地表沉降？本研究采用七种 ML 方法，利用隧道开挖前或开挖过程中测量的\
    \ 14 个影响因素来预测隧道开挖引起的地表沉降。这些方法包括多元线性回归（MLR）、决策树（DT）、随机森林（RF）、梯度提升（GB）、支持向量回归（SVR）、反向传播神经网络（BPNN）和基于置换重要性的\
    \ BPNN（PI-BPNN）模型。除 BPNN 和 PI-BPNN 外，所有方法均为浅层结构 ML 方法。通过模型精度和稳定性，评估了这七种 ML 方法在小数据集上的有效性。模型精度通过训练和测试数据集的决定系数（R²）来衡量，而学习算法的稳定性则指示其预测性能。此外，还引入了分位数误差（QE）准则，以在考虑欠预测和过预测的情况下评估模型预测性能。研究发现，RF\
    \ 算法在所有模型中表现最佳，模型预测精度最高（0.9），稳定性最好（3.02 × 10⁻²）。深层结构 ML 模型在小数据集上表现不佳，模型精度（0.59）和稳定性（5.76）相对较低。PI-BPNN\
    \ 架构是针对小数据集提出和设计的，其性能优于典型的 BPNN。确定了地表沉降的六个重要影响因素，包括隧道埋深、隧道掌子面与地表监测点之间的距离（DTM）、土的加权平均压缩模量（ACM）、注浆压力、贯入速率和推力。©\
    \ 2022 中国科学院岩土力学研究所。由 Elsevier B.V. 制作和主办。这是一篇根据 CC BY 许可（http://creativecommons.org/licenses/by/4.0）提供的开放获取文章。\n\
    \n### 1. 引言\n\n在隧道开挖过程中，开挖周围岩土体中的原位应力状态和地层损失发生变化。这些变化通常表现为地表沉降，尤其是在城市环境中的浅埋隧道。对于城市盾构隧道建设，地表沉降必须限制在可容忍的阈值内，以防止对地上结构造成损坏。\n\
    \n因此，预测隧道开挖引起的地表位移至关重要。\n\n机器学习（ML）技术近年来在先进计算性能的推动下经历了巨大发展，并已被开发用于许多隧道应用，包括隧道掘进机（TBM）性能预测、隧道状态评估、隧道掌子面稳定性预测和隧道诱发沉降预测等（Sheil\
    \ et al., 2020; Zhu et al., 2021; Feng et al., 2021）。通常，ML 技术是在大数据的假设下实施的。然而，一个常见的话题——隧道开挖引起的地表变形预测——通常只能获得有限的监测数据集，规模从几十到几百不等，如表1所示。因此，在该研究领域应用\
    \ ML 算法的有效性需要进一步讨论，而不能直接盲目使用。\n\n**表1**\n通过 ML 算法预测隧道开挖引起的地表沉降的已发表研究。\n\n| 数据集规模\
    \ | 输入数量 | 应用的 ML 方法 | 参考文献 |\n|---|---|---|---|\n| 49 | 10 | RF | Kohestani et\
    \ al. (2017) |\n| 49 | 10 | ANN | Suwansawat and Einstein (2006) |\n| 49 | 10\
    \ | Wavelet-ANN | Pourtaghi and Lotfollahi-Yaghin (2012) |\n| 50 | 5 | ANN | Darabi\
    \ et al. (2012) |\n| 53 | 5 | ANN | Ahangari et al. (2015) |\n| 55 | — | SVM |\
    \ Zhang et al. (2017) |\n| 81 | 14 | ANN | Santos and Celestino (2008) |\n| 95\
    \ | — | ANN | Boubou et al. (2010) |\n| 95 | 15 | Fuzzy-ANN | Bouayad and Emeriault\
    \ (2017) |\n| 113 | 19 | ANN | Kim et al. (2001) |\n| 115 | 8 | ANN | Goh and\
    \ Hefney (2010) |\n| 143 | 3 | ANN | Hasanipanah et al. (2016) |\n| 143 | — |\
    \ MLR, ANN | Moghaddasi and Noorian-Bidgoli (2018) |\n| 147 | 10 | RVM | Wang\
    \ et al. (2013) |\n| 148 | 8 | ANN, SVM, TM | Zhang et al. (2020a) |\n| 160 |\
    \ 9 | ANN | Marto et al. (2012) |\n| 200 | 11 | NNs, RF, SVM | Chen et al. (2019)\
    \ |\n| 230 | 13 | ANN, SVM | Ocak and Seker (2013) |\n| 294 | 12 | RF, SVM, NNs\
    \ | Zhang et al. (2020b) |\n| 300 | 7 | SVM, DT, LR, NNs | Mahmoodzadeh et al.\
    \ (2020) |\n| 328 | 17 | ANN | Zhang et al. (2020c) |\n| 356 | 11 | ANN | Shi\
    \ et al. (1998) |\n\n注：ANN — 人工神经网络；NNs — 神经网络；RF — 随机森林；SVM — 支持向量机；TM — 基于树的方法；RVM\
    \ — 相关向量机；LR — 线性回归；MLR — 多元线性回归。\n\n大数据的特点是体量大、持续产生、性质多样，尽管它们通常是一个系统的副产品，而不是专门为研究特定现象或过程而设计。大数据为机器学习算法提供了丰富的输入，以提取潜在模式并构建预测模型（Zhou\
    \ 等，2017）。正如 Kitchin（2013）所描述的，大数据体积庞大，包含数万亿字节或千万亿字节的数据。相比之下，小数据通常具有体量有限、非连续采集、种类少的特点，并且是为了回答特定问题而生成的（Kitchin\
    \ 和 Lauriault，2015）。当训练样本数量与学习函数的 Vapnik–Chervonenkis（VC）维度之比小于 20 时，也可以认为数据集是小数据集（Chao\
    \ 等，2011；Vladimir，2020）。VC 维度定义为算法能够打散的最大点集的基数，很大程度上由输入空间决定。由于隧道工程通常工期有限，相关文献中的平均数据集规模和输入数量分别约为\
    \ 148 和 10（表1）。因此，预测隧道开挖引起的地表沉降是一个小数据集问题。\n\n利用 TBM 进行浅埋隧道开挖所引起的地表沉降预测是一个复杂问题，涉及\
    \ TBM 运行参数、所遇到的地质条件、隧道几何形状等。通过应用机器学习，从监测仪器中收集的这些可能影响因素（输入数据）可以直接作为学习和理解隧道开挖引起的地表沉降（输出数据）的“教科书”，而无需预先假设数据分布。\n\
    \n最流行的 ML 算法是 ANN（Zhang 等，2020c），一种深层结构模型。ANN 还与其它理论（如小波理论和模糊逻辑）集成（Pourtaghi 和\
    \ Lotfollahi-Yaghin，2012；Ahangari 等，2015），以提高预测性能。在 ANN 用于地表沉降预测的大多数应用中，输入层的节点数等于影响变量的数量，输出层有一个节点代表预测的地表沉降（Suwansawat\
    \ 和 Einstein，2006）。然而，针对小数据集应用的神经网络（NN）架构设计较少被考虑，容易导致过拟合。除 ANN 外，还使用了浅层架构模型，如支持向量机（SVM）、决策树（DT）和随机森林（RF）。SVM\
    \ 旨在分析大量数据，并且能够很好地处理高维（>1000）数据（Yang 和 Trew，2004）。用于回归问题的 SVM 即为支持向量回归（SVR）。基于树的方法（TM），如\
    \ DT 和 RF，最近被引入用于预测隧道开挖引起的地表沉降（Chen 等，2019）。这些应用的 ML 方法通常通过预测输出与目标输出之间的差异来评估。预测结果可能是欠预测或过预测。用于模型评估的计算误差通常同等对待欠预测和过预测。然而，欠预测比过预测更严重，因为欠预测可能导致工程失败。此外，模型稳定性较少被考虑。模型稳定性表示模型性能是否受到模型架构变异性的影响，以及所获得的结果是否可以被认为是稳健的。\n\
    \n基于上述考虑，本文旨在回答这样一个问题——“机器学习算法能否有效应用于小规模隧道相关数据集？”在文献综述和总结（表1）的基础上，本文将应用文献中广泛考虑的七种\
    \ ML 算法，包括多元线性回归（MLR）、DT、RF、梯度提升（GB）、SVR、通过反向传播训练的 ANN（BPNN）以及基于置换重要性的 BPNN（PI-BPNN）算法。需要指出的是，PI-BPNN\
    \ 架构是基于将 NN 应用于小数据集的考虑而首次提出的。这七种算法在中国的一条城市盾构隧道中进行了使用和比较。对七种学习算法都分析了模型精度和稳定性。此外，基于对欠预测和过预测的考虑，提出了分位数误差（QE）来评估模型性能。除了确定最合适的模型外，本文还利用置换特征选择方法提供了特征重要性。确定了几个影响隧道开挖引起地表沉降的重要因素。\n\
    \n### 2. 使用的机器学习算法\n\n对于 ML 模型，连接输入和输出的参数是随机初始化的，并根据成本函数进行优化。成本函数表示实际输出与预测输出之间的差异。ML\
    \ 算法的目标是最小化成本函数，“学习”模型参数，最终实现预测。输入和输出之间的关系可以是线性的或非线性的。本文将讨论一个线性 ML 模型（MLR）和六个非线性模型（DT、RF、GB、SVR、BPNN\
    \ 和 PI-BPNN）。\n\nML 技术的成功应用很大程度上取决于架构设计和超参数训练，例如 SVM 的核选择、基于树的算法的树深度和树数量、NN 模型的隐藏层设计等。如果没有这些考虑和详细的模型设计，很容易导致\
    \ ML 技术应用失败。此外，模型的选择或改进应基于待解决问题的考虑。例如，由于 NN 在捕获复杂关系方面很强大，它可能无法提供理想的性能。因此，本文提出了一种名为\
    \ PI-BPNN 的改进 BPNN 模型，该模型充分考虑了小数据集与网络架构之间的关系。\n\n所有算法和分析均使用 MATLAB 和 Python 编程。Python\
    \ 代码使用 Scikit-learn（Pedregosa 等，2011）Python 库实现。\n\n"
