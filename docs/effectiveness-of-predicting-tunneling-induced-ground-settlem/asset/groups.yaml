    algorithms in such a research area needs to be further discussed instead of using
    them directly and blindly.


    Big data are characterized as being large in volume, produced continuously, and
    varied in nature, even though they are often a by-product of a system rather than
    designed to investigate particular phenomena or processes. Big data provide rich
    inputs for ML algorithms to extract underlying patterns and build predictive models
    (Zhou et al., 2017). As Kitchin (2013) described, big data are enormous in volume
    consisting of terabytes or petabytes of data. In contrast, small data are generally
    characterized by limited volume, non-continuous collection, and little variety,
    and are generated to answer specific questions (Kitchin and Lauriault, 2015).
    Small datasets can also be identified when the ratio of the number of training
    samples to the Vapnik–Chervonenkis (VC) dimensions of a learning function is less
    than 20 (Chao et al., 2011; Vladimir, 2020). The VC dimension is defined as the
    cardinality of the largest set of points that the algorithm can shatter, largely
    determined by input space. Since a tunnel project is typically constructed within
    a limited period, the average dataset size and inputs in the publications are
    approximately 148 and 10, respectively (Table 1). Therefore, the prediction of
    tunneling-induced ground settlements is a small dataset question.


    The prediction of ground surface settlements induced by shallow tunnel excavation
    with TBM is a complex problem associated with TBM operation parameters, encountered
    geological conditions, tunnel geometry, etc. By applying MLs, these possible contributing
    factors (input data) collected from monitoring instrumentations can directly serve
    as the “textbook” for learning and understanding the tunneling-induced ground
    settlement (output data) without pre-assumption of data distribution.


    The most popular ML algorithm is the ANN (Zhang et al., 2020c), a deep structure
    model. ANN has also been integrated with other theories such as wavelet theory
    and fuzzy logic (Pourtaghi and Lotfollahi-Yaghin, 2012; Ahangari et al., 2015)
    to improve the prediction performance. In most applications of the ANN to ground
    settlement prediction, the input layer has the number of nodes equal to the number
    of influencing variables, and the output layer has one node


