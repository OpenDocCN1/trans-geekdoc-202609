    贯入速率和推力。隧道深度和ACM等变量由隧道设计和地质条件决定。因此，地表沉降可以通过TBM操作进一步控制。在隧道开挖过程中，应重点关注三种TBM操作，即注浆压力、贯入速率和推力。


    需要注意的是，我们的结论仅适用于小数据集的情况，例如表1中列出的隧道工程案例。它们不适用于大数据集的隧道工程案例，这超出了本研究的范围。


