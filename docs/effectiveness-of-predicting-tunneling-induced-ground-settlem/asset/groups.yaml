    Full Length Article


    # Effectiveness of predicting tunneling-induced ground settlements using machine
    learning methods with small datasets


    Linan Liu ${ }^{a, *}$, Wendy Zhou ${ }^{a, *}$, Marte Gutierrez ${ }^{b}$


    +   ${ }^{a}$Department of Geology and Geological Engineering, Colorado School
    of Mines, Golden, CO, 80401, USA

    +   ${ }^{b}$Department of Civil and Environmental Engineering, Colorado School
    of Mines, Golden, CO, 80401, USA


    # ARTICLE INFO


    +   Article history:

    +   Received 31 March 2021

    +   Received in revised form 7 July 2021

    +   Accepted 20 August 2021

    +   Available online 11 December 2021


    +   Keywords:

    +   Ground settlements

    +   Tunneling

    +   Machine learning

    +   Small dataset

    +   Model accuracy

    +   Model stability

    +   Feature importance


    # ABSTRACT


    Prediction of tunneling-induced ground settlements is an essential task, particularly
    for tunneling in urban settings. Ground settlements should be limited within a
    tolerable threshold to avoid damages to aboveground structures. Machine learning
    (ML) methods are becoming popular in many fields, including tunneling and underground
    excavations, as a powerful learning and predicting technique. However, the available
    datasets collected from a tunneling project are usually small from the perspective
    of applying ML methods. Can ML algorithms effectively predict tunneling-induced
    ground settlements when the available datasets are small? In this study, seven
    ML methods are utilized to predict tunneling-induced ground settlement using 14
    contributing factors measured before or during tunnel excavation. These methods
    include multiple linear regression (MLR), decision tree (DT), random forest (RF),
    gradient boosting (GB), support vector regression (SVR), back-propagation neural
    network (BPNN), and permutation importance-based BPNN (PI-BPNN) models. All methods
    except BPNN and PI-BPNN are shallow-structure ML methods. The effectiveness of
    these seven ML approaches on small datasets is evaluated using model accuracy
    and stability. The model accuracy is measured by the coefficient of determination
    $(R^2)$ of training and testing datasets, and the stability of a learning algorithm
    indicates predictive performance. Also, the quantile error (QE) criterion is introduced
    to assess model predictive performance considering underpredictions and overpredictions.
    Our study reveals that the RF algorithm outperforms all the other models with
    the highest model prediction accuracy (0.9) and stability $(3.02\times10^{-2})$.
    Deep-structure ML models do not perform well for small datasets with relatively
    low model accuracy (0.59) and stability $(5.76)$. The PI-BPNN architecture is
    proposed and designed for small datasets, showing better performance than typical
    BPNN. Six important contributing factors of ground settlements are identified,
    including tunnel depth, the distance between tunnel face and surface monitoring
    points (DTM), weighted average soil compressibility modulus (ACM), grouting pressure,
    penetrating rate, and thrust force. © 2022 Institute of Rock and Soil Mechanics,
    Chinese Academy of Sciences. Production and hosting by Elsevier B.V. This is an
    open access article under the CC BY license ([http://creativecommons.org/licenses/
    by/4.0](http://creativecommons.org/licenses/ by/4.0)).


    # 1. Introduction


    During tunnel excavation, changes in in situ stress state and ground loss occur
    in the mass around the excavation. These changes are often manifested in the ground
    settlement, particularly for shallow tunnels in urban settings. For urban shield
    tunnel constructions, the ground settlement must be limited within a tolerable
    threshold to prevent damage to aboveground structures.


    Therefore, predictions of tunneling-induced ground movement are of vital importance.


    Machine learning (ML) techniques have recently experienced immense growth driven
    by advanced computational performance and developed for many tunneling applications,
    including tunnel boring machine (TBM) performance prediction, tunnel condition
    assessment, predictions of tunnel face stability and tunnel-induced settlement,
    etc. (Shei et al., 2020; Zhu et al., 2021; Feng et al., 2021). Typically, ML techniques
    are implemented on the assumption of big data. However, one of the prevalent topics,
    prediction of tunneling-induced ground deformation, usually has access to limited
    monitoring datasets ranging from 10 s to 100 s, as summarized in Table 1. Thus,
    the effectiveness of applying ML


