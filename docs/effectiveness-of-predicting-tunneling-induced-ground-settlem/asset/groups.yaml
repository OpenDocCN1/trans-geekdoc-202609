    The ground surface displacements could result from multiple influencing variables
    fed into ML models as inputs. Based upon case history reviews of urban shield
    tunnels (Clough and Leca, 1993; Suwansawat and Einstein, 2006; Zhang et al., 2020b)
    and extensive observations in this tunnel project, the influencing variables can
    be grouped into three major categories: tunnel geometry, geological conditions
    and TBM operational parameters. Such classification proposed by Suwansawat and
    Einstein (2006) is widely accepted by researchers (Ding et al., 2013; Ocak et
    al., 2013; Wang et al., 2013; Zhou et al., 2017; Chen et al., 2019). Parameters
    included in every category are mainly derived from measurements before tunneling
    or observations along with tunnel excavation. Mahmoodzadeh et al. (2020) also
    mentioned that urban tunneling projects do not always have access to a vast number
    of parameters, therefore, it is preferable to consider parameters that can be
    easily achieved.


    #### 3.2.1. Input variables


    #### (1) Tunnel geometry


    Tunnel depth and diameter are considered in the modeling. The tunnel depth of
    the selected section varies from around 31 m–36 m. The tunnel project has a constant
    diameter of 12.4 m. A baseline feature selection approach in ML techniques is
    to remove features with low variance. Zero-variance features, i.e. features that
    have the same value in all samples, will not affect the changes of output. Thus,
    the tunnel diameter is not used as an input.


    Additionally, the horizontal distance between tunnel face and monitoring points
    (DTM) is also considered a parameter that might influence the monitored ground
    settlements, which indicates various excavation stages from before shield approaching
