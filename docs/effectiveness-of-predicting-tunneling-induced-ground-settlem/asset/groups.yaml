    \ back-propagation signal (an error signal) propagates backward through the network.\
    \ The desired response or target output can be denoted by d_k. Consequently, an\
    \ error signal denoted by E is produced by Eq. (6). The error signal is then propagated\
    \ back to adjust weights and biases of each layer using a gradient descent method,\
