  md: 'Each ML model in this study will conduct multiple predictions to study the
    model stability on a small dataset. The variance s² (Eq. (22)) is applied to assess
    the model stability. It is calculated as the average squared deviation of each
    prediction from the averaged prediction. The more spread the data, the larger
    the variance concerning the mean.


    $s^2 = \frac{\sum (X - \bar{X})^2}{n - 1}$


    (22)


    where X is the predictions, X̄ is the average predictions, and n is the repeated
    time of prediction. The lower the variance, the more stable the ML model.


    Evaluation of model stability is conducted in two steps here. First, an extreme
    case where the training set does not change is tested. Each single test sample
    has been predicted 1000 times. The variances of 1000 predictive results (Fig.
    8) are calculated to assess model stabilities represented by dash lines. Variance
    trend represented by solid lines is obtained using the moving average technique.
    According to the results presented in Fig. 8, the prediction results vary significantly
    given the same training set and model architecture. The average variance of stability
    of BPNN and PI-BPNN are 5.76 and 3.58, respectively. BPNN and PI-BPNN show poor
    model stability, indicating that a small dataset fails to train hyperparameters
    in deep architecture fully. Compared with typical BPNN, the proposed PI-BPNN outperforms
    both in model accuracy and model stability. For shallow-structure ML algorithms
    (DT, RF, GB, SVR and MLR), the DT model shows high variance (1.06), while RF,


    GB, SVR, and MLR models show good stability with variance almost equal to zero.
    Since the MLR model entirely failed to learn and predict tunneling-induced ground
    settlements, it will not be further discussed to save computing efforts. The second
    step is to further investigate the stability of RF, GB, and SVR models using a
    changeable dataset. The training and testing sets are randomly split 1000 times
    to train models repeatedly. Three algorithms are trained 1000 times to provide
    1000 predictions. Results of model performance presented in Fig. 9 indicate that
    RF, GB and SVR can be considered stable models since the output performances do
    not change much, with variance less than 0.2. The average variance of GB, SVR,
    and RF are 5.5 × 10⁻³, 5.39 × 10⁻²⁷ and 3.02 × 10⁻²⁷, respectively. Thus, it can
    be concluded that the model stability ranging from best to worst is RF > SVR >
    GB > DT > PI-BPNN > BPNN.


    Among all these applied learning algorithms, the RF model shows the best accuracy
    and stability.


    # 5. Discussion


    Applying ML techniques results in deriving patterns from existing datasets and
    approximating future behavior (i.e., predictions). It is important to evaluate
    ML performances, pros and cons to identify their ability of accurate prediction.
    Also, method selection should be appropriate based on the problem to be solved.
