    # 4.3. Feature importance


    ML models are used to identify the relationship between ground settlements and
    various influencing variables. One way to explain why a given model behaves the
    way it does is to analyze feature importance. Feature importance provides a highly
    compressed, global insight into the model''s behavior.


    The model inspection technique of permutation feature importance tests the model
    performance by removing every feature. In this way, the importance of individual
    variables can be directly compared. Methods like this can be used to dispel the
    notion of ML algorithms as irreproducible “black-box” and can be used to help
    to gain new insights. Specifically, permutation feature importance measures the
    increase in the prediction error of a model after we permute a feature’s value,
    i.e. the decrease in a model score when a single feature value is randomly shuffled.
    A feature is “important” if shuffling its values increases the model error because
    it relies on the prediction feature. Conversely, a feature is “unimportant” if
    shuffling its values leaves model error unchanged because the model ignores the
    feature for the prediction in this case.


    However, not all learning methods can identify important features because they
    are too complex to analyze contributions of single covariates to the overall results,
    for instance, ANNs and SVR (Altmann et al., 2010). Additionally, the failed application
    of MLR (Fig. 6a) demonstrates that the nonlinear relationship between inputs and
    output was not captured, indicating that no features are considered “important”
    in the MLR model. Thus, the permutation


    feature importance will be evaluated based on the predictive results of the DT,
    RF and GB methods.


    According to the results presented in Fig. 7, six important parameters contributing
    to ground settlements have been identified, including tunnel depth, DTM, ACM,
    grouting pressure, penetrating rate and thrust force. Typically, parameters of
    tunnel depth, DTM and ACM are given by tunnel design and geological conditions.
    Thus, the tunneling-induced ground settlements can be further controlled by TBM
    operations such as grouting pressure, penetrating rate and thrust force.


    # 4.4. Model stability


    In applying ML algorithms, model accuracy is typically considered the primary
    criterion for evaluating and selecting a learning algorithm. Algorithms with high
    accuracy can predict the outcome with a high degree of confidence. However, the
    stability of the learning algorithm is also a vital issue, which is often less
    considered. Therefore, it should be paid more attention, particularly for the
    ML applications of a small dataset. The stability of a learning algorithm, also
    called learning variance, refers to the output change when the training dataset
    is changed. A learning algorithm can be considered stable if the output does not
    change much when the training set is modified. Also, the algorithm stability can
    be considered a representation of how well hyperparameters have been trained.
    Models with high variance pay a lot of attention to training data and do not generalize
    on the unseen data.'
