- pgno: 7
  md: '$$\mathrm{RRMSE}=\sqrt{\frac{1}{n}\sum_{i=1}^{n}\left(\frac{d_i-y_i}{d_i}\right)^2}
    \tag{18}$$


    $$\sigma=\sqrt{\frac{1}{n}\sum_{i=1}^{n}(e_i-\bar e)^2} \tag{19}$$


    $$MOE=RRMSE/(1+R) \tag{20}$$


    where $d$ is the monitoring value; $y$ is the predicted value; $\bar d$ and $\bar
    y$ are the means of actual and predicted values, respectively; $e$ is the absolute
    error, and $e=|d_i-y_i|$; $\bar e$ is the mean of absolute error; and $n$ is the
    number of datasets.


    In the above parameters, MAE reflects the average magnitude of error between predicted
    and measured data, and RMSE describes the standard deviation of differences. RRMSE
    is the ratio of RMSE to the mean of monitoring values (Bsaibes et al., 2009).
    RRMSE, RMSE, MAE, and $\sigma$ merely illustrate the error without correlations.
    MOE function combines the above-mentioned metrics.


    These equations are commonly used in ML applications to indicate the overall deviation
    between predictions and observations. The higher the errors, the less likely the
    model generalized correctly from the training data. Although these equations have
    slight differences, one common aspect is that underpredictions and overpredictions
    are equally considered. However, for ground


    settlements induced by tunnel excavations, underpredictions may cause project
    failure and even loss of lives compared with overpredictions. Consequently, a
    QE criterion is proposed to assess the model performance. Different penalties
    for overestimation and underestimation are given in the QE criterion. In the QE
    calculation, different penalties can be given to overestimation and underestimation.
    These penalties are based on the value of chosen quantile ($\gamma$), as shown
    in Eq. (21). Quantile error can be considered an extension of MAE when the quantile
    is 50% ($\gamma=0.5$), and the equation of QE is reduced to the equation for MAE.
    A quantile loss function of $\gamma>0.5$ gives more penalty to underestimation
    than overestimation. In the model performance evaluation, the parameter $\gamma$
    in the QE calculation has been set as 0.7. Predictions ($y$) for each model are
    the mean of 1000 predictive results.


    $$QE=\frac{1}{n}\left(\sum_{i|d_i\le y}(\gamma-1)|d-y|+\sum_{i|d_i>y}\gamma|d-y|\right)
    \tag{21}$$


    Using the QE criterion, the predicted model performances ranging from best to
    worst are RF (0.36) > GB (0.38) > DT (0.41) > SVR (1.02) > PI-BPNN (1.17) > BPNN
    (1.22) > MLR (1.81 × 10⁹). The RF algorithm has the best model performance with
    the QE errors, even if more penalties are given to underpredictions. Compared
    with the model performance evaluated by $R^2$ (RF > GB > DT > PI-BPNN > BPNN >
    SVR > MLR), the SVR outperforms NNs using QE errors, indicating that NNs are prone
    to providing underpredictions.


