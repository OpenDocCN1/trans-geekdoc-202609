    of volume compressibility (*m_v*) is obtained according to Eq. (12). The parameter
    *m_v* represents the compression of soil per unit due to a unit increase of pressure.
    The modulus of soil compressibility (*E_s*) expressed in Eq. (13) is eventually
    selected as the parameter to represent the soil compressibility. Results of the
    calculated modulus of compressibility are plotted in Fig. 3. The ACM along drilled
    borehole can be calculated to represent the overall soil compressibility for every
    monitoring point using Eq. (14), where *E_si* is the modulus of soil compressibility
    of the ith soil layer, and *h_i* represents the height of the ith soil layer.


    ```

    a_v = -\Delta e / \Delta p  (11)

    m_v = a_v / (1 + e_0)  (12)

    E_s = 1 / m_v  (13)

    ACM = \sum E_s_i h_i / \sum h_i  (14)

    ```


    # (3) TBM operational parameters


    In soft ground with high water content, the slurry shield TBM is suitable. This
    TBM is equipped with a slurry system that controls the pressure in the excavation
    face by injecting pressurized slurry into the cutter chamber. Given a TBM, its
    specifications depend on and reflect soil conditions. The criterion of selecting
    TBM-related parameters is that parameters directly affect face stability, ground
    volume loss, etc. and further affect ground settlement (Mony et al., 2016; Chen
    et al., 2019; Zhang et al., 2020c). Additionally, real-time collection in the
    shield system is suggested to ensure the accuracy of these parameters. Based on
    the TBM parameters related to ground settlements suggested by Zhang et al. (2020b),
    eight features are selected, including rotational speed of cutterhead, penetrating
    rate, thrust force, torque, roller displacement, grouting pressure, grouting injection
    rate, and discharge flow rate. Controlling these parameters well may effectively
    reduce the surface settlement caused by shield construction.


    **Table 2**

    Geological conditions of tunnel crown and invert represented by binary code.

    | Type | Geology at tunnel crown |  | Geology at tunnel invert |  |

    |------|--------------------------|---|--------------------------|---|

    |  | Silty clay | Sand | Silty clay | Sand |

    | 1 | 1 | 0 | 1 | 0 |

    | 2 | 1 | 0 | 0 | 1 |

    | 3 | 0 | 1 | 1 | 0 |

    | 4 | 0 | 1 | 0 | 1 |


    TBM parameters, such as cutterhead rotational speed and penetrating rate, significantly
    influence TBM vibration. The thrust force of soft ground TBMs is controlled by
    earth pressure. Torque factor times the cube of tunnel diameter describes the
    torque of soft ground TBMs. TBM torque is governed by the friction between shield
    cutters and the ground or by the shear strength. This friction is caused by a
    few factors, such as earth pressure, chamber pressure acting on a bulkhead, driving
    force generated by direction changes in curved alignments, frictional force acting
    between the segments and tail seals, and hauling force of trailing units (Ates
    et al., 2014). In slurry shield TBM operations, the slurry circuit is a pipeline
    loop that connects the TBM to the slurry treatment plant (STP) at the surface.
    Pumps in the slurry discharge pipeline transport the loaded slurry to the STP.
    In the slurry feed line and discharge line, sensors are installed to determine
    the flow rate and density. Densities of slurry injection flow and discharge flow
    are almost constant. Thus, three parameters are selected to represent the slurry
    circuit condition: grouting pressure, grouting injection rate, and discharge flow
    rate.


    # 3.2.2. Output variables


    Ground settlement induced by tunneling excavations is set as the output variable
    in ML models, which is influenced by multiple input factors. Given that data are
    collected during the excavation process, ground settlements within eight times
    of the tunnel diameter at the excavation face are considered, with a measurement
    accuracy of 0.3 mm/km.'
