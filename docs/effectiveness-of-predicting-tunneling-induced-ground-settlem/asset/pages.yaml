    # 3. Description of the study site and collected dataset


    # 3.1. Geological conditions


    Data used in this study are collected from the Yuji tunnel project constructed
    in China, which is excavated by a slurry shield TBM. Many boreholes have been
    drilled to obtain information about the geological condition below the surface.
    The soil profile of the tunnel horizon is plotted in Fig. 2 based on the Unified
    Soil Classification System (USCS). The tunnel section with a total length of 1.1
    km is investigated. The ground condition encountered by the shield tunnel includes
    silty sands, silty clays, silts, sands, and artificial fills. The complexity of
    geological conditions varies. In general, the tunnel is constructed in a mixed
    silty clay-sand layer. Most areas were found with sands in the crown and silty
    clays in the invert. Some parts are entirely excavated in sand or silty clay layer.
    Ten surface settlement markers or settlement arrays are installed along the selected
    tunnel section (>1 km) to measure surface settlements during excavation. Vertical
    ground surface displacement is monitored by precise leveling of transverse profiles.
    Each profile consists of at least 13 monitoring points. A dataset of 187 observed
    maximum surface displacements is recorded, collected, and used in this study.


    # 3.2. Collected dataset for model construction


    The ground surface displacements could result from multiple influencing variables
    fed into ML models as inputs. Based upon case history reviews of urban shield
    tunnels (Clough and Leca, 1993; Suwansawat and Einstein, 2006; Zhang et al., 2020b)
    and extensive observations in this tunnel project, the influencing variables can
    be grouped into three major categories: tunnel geometry, geological conditions
    and TBM operational parameters. Such classification proposed by Suwansawat and
    Einstein (2006) is widely accepted by researchers (Ding et al., 2013; Ocak et
    al., 2013; Wang et al., 2013; Zhou et al., 2017; Chen et al., 2019). Parameters
    included in every category are mainly derived from measurements before tunneling
    or observations along with tunnel excavation. Mahmoodzadeh


    # 3.2.1. Input variables


    # (1) Tunnel geometry


    Tunnel depth and diameter are considered in the modeling. The tunnel depth of
    the selected section varies from around 31 m–36 m. The tunnel project has a constant
    diameter of 12.4 m. A baseline feature selection approach in ML techniques is
    to remove features with low variance. Zero-variance features, i.e. features that
    have the same value in all samples, will not affect the changes of output. Thus,
    the tunnel diameter is not used as an input.


    Additionally, the horizontal distance between tunnel face and monitoring points
    (DTM) is also considered a parameter that might influence the monitored ground
    settlements, which indicates various excavation stages from before shield approaching
    till after shielding pass.


    # (2) Geological conditions


    Geological conditions considered in ML models include soil types at tunnel invert
    and crown, groundwater level, and weighted average soil compressible modulus (ACM).
    All these parameters related to geological conditions are obtained from many drilled
    boreholes along the tunnel centerline.


    Intuitively by the geological profile shown in Fig. 3, there are two geological
    conditions of tunnel crown and invert, i.e. silty clays or sands. Binary code
    symbolized by 0 and 1 typically represents two states, “off” and “on”, respectively.
    Thus, the binary code can be adopted to indicate if a certain soil type is encountered
    or not (Suwansawat and Einstein, 2006). In this study area, four geological conditions
    are summarized, as listed in Table 2.


    Although geological complexity can be roughly determined intuitively by the geological
    profile, quantitative characteristics of soil consolidation are unknown, which
    may serve as a vital factor affecting the ground settlements. From the soil mechanics
