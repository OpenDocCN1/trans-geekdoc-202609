  md: 'A general advantage of ML models is the ability to handle multi-variate data
    and extract implicit relationships in a complex, dynamic and even chaotic environment.
    Moreover, they make no distributional assumptions about the predictor variables.


    DT, RF and GB are three tree-based algorithms. The DT is a basic tree-structure
    algorithm, serving the base learner for both RF and GB. The RF and GB are state-of-the-art
    ensemble learning techniques, a method that combines the predictions from multiple
    ML algorithms (base learners) to provide more accurate predictions. A single DT
    might be relatively weaker compared with a set of trees. Theoretically, ensemble
    methods with more trees usually yield better results and serve as a more robust
    model (Elish et al., 2013). This study reveals that RF and GB outperform the DT
    model in terms of prediction accuracy and model stability. However, there is a
    trade-off between prediction accuracy and processing cost. The more the trees,
    the slower the process, since every tree has to be generated, processed, and analyzed.
    Also, the processing will be slower given more features. The difference between
    RF and GB is how trees are built. The RF builds each tree independently (in parallel),
    while the GB builds one tree at a time (sequentially) (Callens et al., 2020).


    MLR models the linear relationship between independent and dependent variables,
    while the other six MLs work on processing nonlinear relationships. As its mathematic
    formula indicated (Eq. (1)), its main advantage is to provide the relative influence
    of one or multiple predictor variables intuitively. However, the MLR fails to
    approximate the nonlinear relationship between the influencing variables and ground
    settlements.


    Data transforming is required to construct an SVR model, achieved by kernel functions.
    Kernel selection is dataset-dependent. It can be selected through the tried-and-error
    method. The kernel with the highest testing accuracy is chosen. Once the kernel
    is selected, SVR has a few hyperparameters needed to be determined, easy for implementation.
    The SVR shows good model stability but poor prediction accuracy. Given more penalties
    and underprediction and using the QE criterion, SVR has higher prediction accuracy
    than NN models.


    In a multi-layer NN, each neuron is connected to other neurons with certain hyperparameters.
    Given many hyperparameters such as weight matrices and bias vectors, NNs have
    a remarkable capability to learn and model nonlinear and complex relationships.
    However, many hyperparameters involved in the network may not be well trained
    with the limited dataset to provide ideal predicting performance. The PI-BPNN
    proposed in this paper is designed for small datasets considering the relationship
    between model architecture and dataset size, showing better performance than typical
    BPNN. Although the NNs are powerful in solving complex problems, they are not
    effective enough to apply small datasets with both poor prediction accuracy and
    model stability.


    ![](img/3dd1490767e1ddfc7ef0e1a1ad6f2726_11_0.png)


    # 6. Concluding remarks


    Due to the limited construction period of any given tunnel project, the available
    monitoring datasets of ground deformation are small. Can ML methods effectively
    predict tunneling-induced ground settlement when the datasets are small? With
    both shallow- and deep-structure, seven ML algorithms have been applied for predicting
    tunneling-induced ground settlements. These ML methods include MLR, DT, RF, GB,
    SVR, BPNN, and PI-BPNN.


    The seven ML algorithms are assessed from the perspective of model accuracy and
    stability. Our results showed that the MLR model failed to learn and predict.
    Furthermore, the nonlinear relationship between tunneling-induced ground settlements
    and possible influencing variables, including TBM operation parameters, encountered
    geological conditions, and tunnel geometry, was demonstrated. In the applications
    of nonlinear learning algorithms, the RF model showed the best performance with
    high prediction accuracy reaching 0.9 and low stability variance of 3.02 × 10⁻²⁷.
    While the BPNN, which is believed powerful in approximating complicated functions,
    shows worse performance than conventional shallow-structure learning algorithms.
    The proposed PI-BPNN method applied a permutation feature selection technique
    to decrease model complexity, achieving a better performance than typical BPNN
    for small datasets. Thus, no matter how attractive a model is, model selection
    should base on the full consideration of the problem to be solved. In conclusion,
    ML algorithms can be successfully used to predict tunneling-induced ground settlements
    even if the available dataset size is small. Furthermore, ensemble methods, such
    as RF and GB regression, outperform other learning algorithms.


    Additionally, six variables that contributed most to the ground settlements occurring
    during the excavation process have been identified, including tunnel depth, DTM,
    ACM, grouting pressure,


