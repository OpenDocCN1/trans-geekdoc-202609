    # 3.3. Data distribution


    The dataset used to design ML models for predicting the ground surface settlements
    consists of 14 input variables and 187 observations. Twelve parameters and their
    corresponding ranges of values are summarized in Table 3. The other two parameters
    are geology at tunnel crown and invert, represented by values 0 and 1, respectively,
    in ML models (Table 3). Fig. 4 presents the variable correlation matrix illustrating
    the relationship between pairwise parameters to provide a descriptive overview
    of the data distribution. Most parameters show a relatively low correlation with
    Pearson correlation coefficient (r < 0.8), except for two pairs: grouting pressure
    vs. groundwater level (r = − 0.82) and geology at tunnel invert vs. ACM (r = −
    0.81). The larger the r value, the stronger the linear relationship. However,
    there are no direct physical links between these two pairwise datasets, so that
    all the data will be kept for learners. The data distribution also reveals that
    the ground settlements have inverse relationships with a few parameters. These
    parameters are the DTM, tunnel depth, ACM, thrust force, grouting pressure, grouting
    injection rate and discharge flow rate. Thus, the increase in these parameters
    can control the magnitude of ground settlements to some extent. Similarly, the
    decrease in positively related parameters might help to decrease the ground surface
    settlements.


    # 3.4. Training and testing sets


    ML methods ingest data to learn from it. Specifically, ML algorithms aim to find
    the optimal hyperparameters that yield the best model. Corresponding hyperparameters
    are initiated randomly and optimized using a cost function. The process to find
    the optimal hyperparameters is achieved by learning from the training set. Using
    trained hyperparameters, ML models have the ability to predict outputs. The dataset
    in this study is split randomly into two sets: a training set and a testing set,
    as plotted in Fig. 5. The training set consists of 70% of the data, while the
    remainder (30%) is assigned to the testing set. A two-part split is a general
    practice in the applications of ML algorithms, aiming at testing the predictive
    performances of the models.


    # 4. Results


    # 4.1. Comparison of model performances


    Typically, statistical performance evaluations can be conducted to assess model
    performance quantitatively. The coefficient of determination (R²) defined as Eq.
    (15) is adopted to assess and compare model performances. It measures how well
    predictions a model provides. The best possible score is 1. The higher the R²
    value, the better the model performance. Additionally, the R² value can be negative
    because a model can be arbitrarily worse.


    R² = 1 − Σ(monitoring − predictions)² / Σ(monitoring − mean of monitoring)²   (15)


    Training and testing accuracies for seven models have been calculated and are
    presented in Fig. 6. According to the calculated testing accuracy, the predictive
    performance ranging from best to worst is RF (0.9) > GB (0.82) > DT (0.72) > PI-BPNN
    (0.79) > BPNN (0.59) > SVR (0.52) > MLR (− 3.89 × 10¹⁷). Among these applied models,
    the MLR has neither learning ability nor predicting ability, which means that
    the relationship between induced ground settlements and influencing variables
    is nonlinear. The nonlinear relationship can also be indicated by the variable
    coefficient matrix shown in Fig. 4. The surface settlements weakly correlate to
    the 14 influencing variables with correlation coefficients (R) smaller than 0.3.


    In the applications of nonlinear models, the ensemble methods like RF and GB have
    been successfully used with both relatively high learning and testing accuracies.
    The RF model achieves the best performance. Also, the ensemble models (RF and
    GB) outperform the single DT method in terms of model accuracy. In contrast to
    shallow-structure learning architectures, the NN model adopts deep architecture
    to learn hierarchical representations. Deep-structure ML methods can often capture
    more complicated, hierarchically launched statistical patterns of inputs to adapt
    to new areas than traditional learning methods. Furthermore, as the data continuously
    get bigger, deep learning is essential in providing predictive analytic solutions
    for large-scale datasets (Pasini, 2015; Qiu et al., 2016). However, for the application
    of tunneling-induced ground settlements where the available dataset is small,
    the predictive performance of BPNN is worse than tree-based ML algorithms. Additionally,
    the proposed PI-BPNN model outperforms typical BPNN, indicating that the NN architecture
    and input selection are vital to the model performance when applying a small dataset.


    # 4.2. Feature importance evaluation considering underpredictions and overpredictions


    Besides the R² used in this study, model performances can be assessed by other
    performance indicators such as mean absolute error (MAE), root mean square (RMSE),
    relative RMSE (RRMSE), standard deviation (σ), and multiple-objective error (MOE),
    which are defined as


    MAE = 1/n Σᵢ₌₁ⁿ |dᵢ − yᵢ|   (16)


    RMSE = √[1/n Σᵢ₌₁ⁿ (dᵢ − yᵢ)²]   (17)'
