  \n### 28. PsySH\n\n`PsySH` 是一个 PHP 的运行时开发者控制台、交互式调试器和 REPL（读取-评估-打印循环）。它允许开发者在命令行中交互式地执行\
  \ PHP 代码。\n\n### ：PsySH\n```bash\nPsy Shell v0.x.x (PHP x.x.x — cli) by Justin Hileman\n\
