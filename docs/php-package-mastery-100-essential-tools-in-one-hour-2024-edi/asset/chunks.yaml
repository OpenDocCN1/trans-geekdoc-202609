  trans: "\n\n# 40. PhpSpreadsheet\n\nPhpSpreadsheet 是一个提供了一系列类，用于读取和写入不同的电子表格文件格式（如\
    \ Excel 和 CSV）。它是 PHPExcel 的继任者，代表了一次重大升级，提供了更好的性能和更多功能，如读取和写入电子表格、单元格格式以及图表创建。\n\
    \nEx:PhpSpreadsheet\n\n```php\nrequire 'vendor/autoload.php';\nuse PhpOffice\\\
    PhpSpreadsheet\\Spreadsheet;\nuse PhpOffice\\PhpSpreadsheet\\Writer\\Xlsx;\n//\
    \ 创建一个新的电子表格\n$spreadsheet = new Spreadsheet();\n$sheet = $spreadsheet->getActiveSheet();\n\
    $sheet->setCellValue('A1', 'Hello World!');\n// 写入文件\n$writer = new Xlsx($spreadsheet);\n\
    $writer->save('hello_world.xlsx');\n```\n\n这段代码创建一个名为 `hello_world.xlsx` 的新 Excel\
    \ 文件，其中包含一个单元格 (A1)，其内容为 'Hello World!'。\n\n在提供的示例中，我们首先引入 Composer 自动加载文件，这对于加载\
    \ PhpSpreadsheet 库类至关重要。然后，我们实例化了一个新的 `Spreadsheet` 对象，它作为电子表格数据的主要容器。使用 `getActiveSheet`\
    \ 方法来获取当前活动的工作表。\n\n接着，我们使用 `setCellValue` 方法将单元格 'A1' 的值设置为 \"Hello World!\"\
    。该方法接受两个参数：第一个参数是单元格坐标（在本例中为 'A1'），第二个参数是要设置的值。\n\n在设置了单元格值后，我们准备将电子表格写入文件。为了做到这一点，我们创建了一个新的\
    \ `Xlsx` 写入器实例，并将我们的 `Spreadsheet` 对象传递给构造函数。然后调用写入器对象的 `save` 方法并传入所需的文件名（`hello_world.xlsx`）。此操作会将我们的电子表格数据写入\
    \ XLSX 格式的 Excel 文件中。\n\n此示例演示了使用 PhpSpreadsheet 创建电子表格、修改内容并将其保存到文件的基本流程，这对于生成报告、导出数据以及通过\
    \ PHP 创建动态电子表格文件特别有用。\n\n# 41. ParagonIE Sodium Compat\n\n该库是 libsodium 的一个填充程序（polyfill），为\
    \ PHP 提供了加密、解密、签名和密钥交换等功能，旨在提高安全性。\n\nEx:ParagonIE Sodium Compat\n\n```php\nrequire\
    \ 'vendor/autoload.php';\nuse ParagonIE\\Sodium\\Core\\Salsa20;\n$message = 'This\
    \ is a secret.';\n$key = random_bytes(Salsa20::BYTES); // 生成一个密钥\n$nonce = random_bytes(Salsa20::NONCE);\
    \ // 生成一个 nonce\n// 加密\n$encrypted = Salsa20::crypto_encrypt($message, $key, $nonce);\n\
    // 解密\n$decrypted = Salsa20::crypto_decrypt($encrypted, $key, $nonce);\necho $decrypted;\n\
    ```\n\n在代码中，我们使用 `ParagonIE\\Sodium\\Core\\Salsa20` 进行加密和解密。首先，我们使用 `random_bytes()`\
    \ 常量 `Salsa20::BYTES` 和 `Salsa20::NONCE` 生成密钥和 nonce。然后，我们使用 `Salsa20::crypto_encrypt`\
    \ 加密消息。最后，使用 `Salsa20::crypto_decrypt` 解密消息并输出原始消息。\n\n# 42. PHPBench\n\nPHPBench\
    \ 是一个为 PHP 设计的基准测试框架，允许开发者系统地测量和比较代码块的性能。它类似于单元测试。\n\nEx:PHPBench\n\n```php\n\
    use PHPBench\\Benchmark\\Annotations\\Benchmark;\nuse PHPBench\\Benchmark\\Annotations\\\
    BeforeMethods;\nuse PHPBench\\Benchmark\\Annotations\\Iterations;\n\nclass MyBenchmark\
    \ {\n    private $dataArray;\n\n    /**\n     * 在基准测试前初始化数据。\n     * @BeforeMethods()\n\
    \     */\n    public function init() {\n        $this->-dataArray = range(1, 1000);\n\
    \    }\n\n    /**\n     * @Benchmark\n     * @Iterations(10)\n     * @BeforeMethods({\"\
    init\"})\n     */\n    public function benchArrayMap() {\n        array_map(function\
    \ ($item) {\n            return $item * 2;\n        }, $this->dataArray);\n  \
    \  }\n}\n```\n\n基准测试结果会根据运行的系统和条件而异。通常输出包括执行时间、内存占用和迭代次数。\n\n"
- fmt: "\n# 43. Imagine\n\n`Imagine` is a PHP library for image manipulation that\
    \ provides a simple and intuitive API for editing images using different backends\
    \ like `GD`, `Imagick`, and `Gmagick`.\n\n## Ex:Imagine\n\n```php\n// Example:\
    \ Resizing an image to 200x200 pixels using Imagine\nrequire 'vendor/autoload.php';\n\
    use Imagine\\Gd\\Imagine;\nuse Imagine\\Image\\Box;\n$imagine = new Imagine();\n\
    $image = $imagine->open('path/to/image.jpg');\n$image->resize(new Box(200, 200))->save('path/to/resized_image.jpg');\n\
    ```\n\nThis code does not produce a visual result here, but it creates a resized\
    \ image file at `/path/to/resized_image.jpg`.\n\nThis code snippet demonstrates\
    \ how to resize an image using the `Imagine` library in PHP. First, it includes\
    \ the necessary autoload file generated by `Composer`, a dependency manager for\
    \ PHP, ensuring that all the required classes are automatically loaded. It then\
    \ utilizes the `Imagine` library's classes for image manipulation. Here's a step-by-step\
    \ explanation:\n\n- **Autoload Composer dependencies**: The `require 'vendor/autoload.php';`\
    \ line includes `Composer`'s autoloader, which automatically loads all the necessary\
    \ classes from the `Imagine` library, so you don't have to manually include each\
    \ class file.\n- **Namespace importing**: The `use` statements import the necessary\
    \ classes from the `Imagine` library into the current namespace, allowing you\
    \ to use short class names (`Imagine`, `Box`) instead of their fully qualified\
    \ names (`Imagine\\Gd\\Imagine`, `Imagine\\Image\\Box`).\n- **Creating an Imagine\
    \ object**: The `$imagine = new Imagine();` line creates a new instance of the\
    \ `Imagine` class. This object is responsible for performing operations on images.\
    \ The `Imagine` class can work with different backends (`GD`, `Imagick`, `Gmagick`),\
    \ and here it defaults to `GD`, which is a common choice for basic image manipulation\
    \ in PHP.\n- **Opening an image**: The `open()` method is called on the `$imagine`\
    \ object with the path to the image you want to manipulate. It returns an image\
    \ object that represents the opened image.\n- **Resizing the image**: The `resize()`\
    \ method is called on the image object. It takes a `Box` object as an argument,\
    \ which defines the new size of the image (200x200 pixels in this example). This\
    \ method resizes the original image to the specified dimensions.\n- **Saving the\
    \ resized image**: Finally, the `save()` method is used to save the resized image\
    \ to a new file. The path where the new image should be saved is passed as an\
    \ argument to this method.\n\nThis library abstracts the complexities of image\
    \ manipulation, allowing developers to perform common tasks, such as resizing\
    \ images, with just a few lines of code.\n\n# 44. Faker\n\n`Faker` is a PHP library\
    \ that generates fake data for you. It's useful for bootstrapping your database,\
    \ creating good-looking XML documents, testing, and more. It supports a wide range\
    \ of data types like names, addresses, phone numbers, and more.\n\n## Ex:Faker\n\
    \n```php\n// Example: Generating a fake name and email using Faker\nrequire 'vendor/autoload.php';\n\
    use Faker\\Factory;\n$faker = Factory::create();\necho \"Name: \" . $faker->name\
    \ . \"\\n\";\necho \"Email: \" . $faker->email . \"\\n\";\n```\n(Note: Actual\
    \ output will vary since Faker generates random data.)\n\nThis code snippet demonstrates\
    \ how to generate fake data using the `Faker` library in PHP. The process involves\
    \ including `Composer`'s autoloader, creating an instance, and then using its\
    \ methods. Here's a detailed breakdown:\n\n- **Include Composer dependencies**:\
    \ The `require 'vendor/autoload.php';` line includes `Composer`'s autoloader,\
    \ ensuring all necessary classes are loaded.\n- **Namespace importing**: The `use\
    \ Faker\\Factory;` statement imports the `Factory` class from the `Faker` library\
    \ into the current namespace.\n- **Creating a Faker object**: The `$faker = Factory::create();`\
    \ line statically called on the `Factory` class returns a configured generator\
    \ instance.\n- **Generating Fake Data**: The `$faker->name` generates a fake name,\
    \ and `$faker->email` generates an email address.\n- **Echoing the Results**:\
    \ The last lines of the snippet output the generated name and email to the console.\n\
    \n`Faker` is highly configurable and supports localization. It's an invaluable\
    \ tool for developers who need to quickly generate realistic-looking data.\n\n\
    # 45. Symfony Security\n\nThe `Symfony Security` component provides a comprehensive\
    \ security system for PHP applications. It features authentication, authorization,\
    \ and protection against common vulnerabilities.\n\n## Ex:Symfony Security\n\n\
    ```php\n// Example of using Symfony Security for authentication\nuse Symfony\\\
    Component\\Security\\Core\\User\\UserProviderInterface;\nuse Symfony\\Component\\\
    Security\\Core\\User\\UserInterface;\nuse Symfony\\Component\\Security\\Core\\\
    User\\InMemoryUserProvider;\nuse Symfony\\Component\\Security\\Core\\User\\User;\n\
    \n$userProvider = new InMemoryUserProvider([\n    'admin' => ['password' => 'adminpass',\
    \ 'roles' => ['ROLE_ADMIN']],\n]);\n\n// Retrieve a user by username\n$user =\
    \ $userProvider->loadUserByUsername('admin');\n// Example output: instance of\
    \ UserInterface\necho get_class($user);\n```\n\nIn this code snippet, we're illustrating\
    \ how to use the `Symfony Security` component to create a simple user provider.\
    \ The `InMemoryUserProvider` is a basic user provider implementation useful for\
    \ quick setups or testing:\n\n- **Instantiating the provider**: We instantiate\
    \ `InMemoryUserProvider` with an array defining users. Each user is represented\
    \ by a username key, with their password and roles as values.\n- **Retrieving\
    \ a user**: The `loadUserByUsername()` method is then used to fetch a user by\
    \ their username. In a real application, this could be used during the login process\
    \ to validate user credentials.\n- **Verification**: Finally, we print the class\
    \ of the retrieved user object to demonstrate that it returns an instance of `UserInterface`.\n"
