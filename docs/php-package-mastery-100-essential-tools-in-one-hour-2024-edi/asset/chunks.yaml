  trans: "\n\n# 11. imagick\n`Imagick` 是一个 PHP 扩展，用于使用 `ImageMagick API` 创建和修改图像。它支持多种图像格式和操作，例如缩放、裁剪、格式转换以及应用效果。\n\
    \n### Ex:imagick\n```php\n<?php\n$image = new Imagick('input.jpg');\n$image->thumbnailImage(100,\
    \ 0);\necho $image->getImageBlob();\n?>\n```\n该代码输出输入图像宽度为 100 像素的缩略图二进制数据。\n\n\
    在提供的 PHP 代码中，我们首先通过向构造函数传递图像文件的路径（`'input.jpg'`）来创建一个 `Imagick` 类的新实例。这一步使用来自\
    \ `'input.jpg'` 的图像数据初始化 `Imagick` 对象。接下来，我们在 `$image` 对象上调用了 `thumbnailImage`\
    \ 方法。该方法接受两个参数：目标缩略图的宽度（在我们的示例中为 100 像素）和高度。通过将高度设置为 `0`，我们指示 `Imagick` 自动保持原始图像的宽高比例，确保缩略图看起来比例协调。最后，在\
    \ `$image` 对象上调用 `getImageBlob()` 方法，它会生成处理后图像的二进制数据（在此情况下为缩略图）。此二进制数据代表了当前格式的图像（由原始图像定义，或通过\
    \ `Imagick` 方法应用的任何后续格式更改定义），并可以直接在浏览器中显示、保存到文件或进行进一步处理。\n\n# 12. sockets\nPHP\
    \ 中的 `sockets` 扩展允许创建基于套接的连接，使 PHP 脚本能够网络与其他服务器或客户端通信。它支持多种套接操作，如在 TCP/IP 或 UDP\
    \ 上进行创建、绑定、监听、接受连接、发送和接收数据。\n\n### Ex:sockets\n```php\n<?php\n$socket = socket_create(AF_INET,\
    \ SOCK_STREAM, SOL_TCP);\n$result = socket_connect($socket, 'www.example.com',\
    \ 80);\n$message = \"GET / HTTP/1.1\\r\\nHost: www.example.com\\r\\nConnection:\
    \ Close\\r\\n\\r\\n\";\nsocket_write($socket, $message, strlen($message));\n$result\
    \ = socket_read($socket, 1024);\nsocket_close($socket);\necho $result;\n?>\n```\n\
    该代码显示从 `www.example.com` 接收到的 HTTP 响应。\n\nPHP 脚本从 `socket_create` 开始，它创建一个套接字资源。该函数接受三个参数：地址族（IPv4\
    \ 使用 `AF_INET`）、套接字类型（TCP 连接使用 `SOCK_STREAM`）和协议（TCP 协议使用 `SOL_TCP`）。创建套接字后，`socket_connect`\
    \ 尝试连接到端口 80（HTTP 的默认端口）上的 `'www.example.com'`。连接成功后，准备了一个简单的 HTTP GET 请求，请求 `'www.example.com'`\
    \ 的根文档（`'/'`）。该请求字符串随后通过 `socket_write` 通过套接字发送。`socket_read` 函数将服务器的响应读取到 `$result`\
    \ 中，然后使用 `echo` 输出。最后，调用 `socket_close` 关闭套接字连接。此示例演示了使用 PHP 套接字函数进行网络通信的基本用法，特别是通过原始\
    \ HTTP 请求检索网页的 HTML 内容。\n\n# 13. 文件系统函数\nPHP 的文件系统函数允许对文件系统进行操作和处理。这些包括读取、写入和修改文件及目录。\n\
    \n### Ex:Filesystem Functions\n```php\n// 将文件读取到字符串\n$content = file_get_contents('example.txt');\n\
    // 写入文件\nfile_put_contents('example_new.txt', $content . \" Additional content.\"\
    );\n```\n第一个函数读取 `'example.txt'` 的内容。第二个函数将内容写入新文件，并附加 \" Additional content.\"\
    。\n\n在代码的第一部分，`file_get_contents('example.txt')` 读取 `'example.txt'` 的全部内容。该函数非常适用于快速访问文件内容，而无需手动打开文件、逐行读取并关闭它。第二部分\
    \ `file_put_contents('example_new.txt', $content . \" Additional content.\")`\
    \ 获取之前读取的内容并附加字符串 `\" Additional content.\"`。然后将这些内容写入名为 `'example_new.txt'` 的文件中。如果文件不存在，PHP\
    \ 将创建它；如果文件已存在，PHP 将覆盖它。此函数简化了写入文件的过程，避免了手动打开文件、写入内容并关闭它的需要。\n\n# 14. file_exists\
    \ 和 is_writable\n`file_exists` 函数检查文件或目录是否存在，`is_writable` 检查文件或目录是否可写。这些在尝试文件操作之前验证权限至关重要。\n\
    \n### Ex:file_exists and is_writable\n```php\nif (file_exists('example.txt') &&\
    \ is_writable('example.txt')) {\n    file_put_contents('example.txt', \"Appending\
    \ new content.\", FILE_APPEND);\n} else {\n    echo \"文件不存在或不可写\";\n}\n```\n如果\
    \ `'example.txt'` 存在且可写，则向该文件附加 \"Appending new content.\"。否则，输出 \"文件不存在或不可写\"\
    。\n\n此代码段落演示了一个涉及文件操作的实际用例，同时确保操作是安全的。`file_exists('example.txt')` 函数检查指定的文件或目录是否存在，这对于避免尝试访问或修改不存在的文件至关重要。`is_writable('example.txt')`\
    \ 函数检查文件是否可写。这是一项重要的安全措施，确保您的脚本仅对具有相应权限的文件尝试写入，从而避免潜在的权限错误。`file_put_contents('example.txt',\
    \ \"Appending new content.\", FILE_APPEND)` 行尝试向文件的现有内容附加文本。`FILE_APPEND` 标志用于指示将新内容附加到文件末尾，而不是覆盖现有内容。这对于日志记录或随时间向文件添加数据而不丢失原始内容非常有用。这些函数共同构成了一个安全处理文件操作的稳健方法，在执行读取或写入操作之前确保文件存在且可访问。\n\
    \n"
- fmt: "\n# 15. SPL (Standard PHP Library)\n\nThe `SPL` is a collection of interfaces\
    \ and classes that are meant to solve common problems. It includes data structures,\
    \ iterators, and interfaces for object serialization.\n\n### Ex: SPL (Standard\
    \ PHP Library)\n\n```php\n<?php\n// Example of using SPL's ArrayObject\n$array\
    \ = array('1' => 'PHP', '2' => 'Python', '3' => 'JavaScript');\n$arrayObject =\
    \ new ArrayObject($array);\n// Iterate over the array values\nfor($iterator =\
    \ $arrayObject->getIterator(); $iterator->valid(); $iterator->next()) {\n    echo\
    \ $iterator->key() . ' => ' . $iterator->current() . \"\\n\";\n}\n?>\n```\nOutput:\n\
    1 => PHP\n2 => Python\n3 => JavaScript\n\nThe above PHP code demonstrates the\
    \ use of the `SPL ArrayObject` class, which is part of the Standard PHP Library.\
    \ This class allows arrays to be treated as objects, offering more flexibility\
    \ in handling data structures.\n\nWe start by creating a standard PHP array named\
    \ `$array` with three elements. We then instantiate an `ArrayObject` with our\
    \ array, which wraps the array in an object-oriented interface. Next, we obtain\
    \ an iterator for the `ArrayObject` using the `getIterator()` method. This returns\
    \ an instance of the `ArrayIterator` class, which implements the `Iterator` interface,\
    \ allowing us to traverse the array.\n\nWe loop over the iterator using a `for`\
    \ loop. Inside the loop, we use `$iterator->valid()` to check if there are more\
    \ elements to iterate over. `$iterator->current()` returns the current element's\
    \ value, and `$iterator->key()` returns the current element's key. Finally, we\
    \ print each key-value pair, demonstrating how `SPL` provides object-oriented\
    \ ways to interact with PHP arrays, enhancing readability and code organization.\n\
    \n# 16. CURL\n\n`CURL` is a library used to make HTTP requests in PHP. It supports\
    \ a wide range of protocols like HTTP, HTTPS, FTP, and more, making it versatile\
    \ for web development tasks such as API calls.\n\n### Ex:CURL\n\n```php\n<?php\n\
    // Example of using cURL to make a GET request\n$curl = curl_init('http://example.com');\n\
    curl_setopt($curl, CURLOPT_RETURNTRANSFER, true);\n// Execute the HTTP request\n\
    $response = curl_exec($curl);\n// Close the cURL session\ncurl_close($curl);\n\
    // Print the response\necho $response;\n?>\n```\nContent of:\nThis code snippet\
    \ demonstrates the basic usage of PHP's `cURL` library for making a simple GET\
    \ request. `curl_init('http://example.com')` initializes a new `cURL` session\
    \ and sets the URL to make the request. `curl_setopt($curl, CURLOPT_RETURNTRANSFER,\
    \ true)` sets an option for the `cURL` transfer. In this case, it tells `cURL`\
    \ to return the response as a string instead of outputting it. `curl_exec($curl)`\
    \ executes the `cURL` session. This sends the HTTP request to the specified URL\
    \ and stores the response in `$response`. `curl_close($curl)` closes the `cURL`\
    \ session to free up resources. `echo $response` prints the response from the\
    \ HTTP request.\n\nThis example illustrates a fundamental capability of `cURL`\
    \ library in PHP: to communicate with different types of servers using a variety\
    \ of protocols, essential for interacting with APIs or retrieving web resources.\n\
    \n# 17. JSON\n\n`JSON` functions in PHP are used for encoding and decoding data\
    \ in JSON format. This is crucial for web development, especially in APIs and\
    \ web services.\n\n### Ex:JSON\n\n```php\n<?php\n// Encode an array to JSON string\n\
    $array = ['name' => 'John', 'age' => 30];\n$jsonString = json_encode($array);\n\
    echo $jsonString;\n// Decode JSON string back to array\n$decodedArray = json_decode($jsonString,\
    \ true);\nprint_r($decodedArray);\n?>\n```\nOutput:\nArray\n(\n    [name] => John\n\
    \    [age] => 30\n)\n\nThis code example demonstrates two primary functions of\
    \ the JSON extension: `json_encode` and `json_decode`. `json_encode($array)`:\
    \ This function takes a PHP `array` (or any other type that can be converted to\
    \ JSON, such as objects) and converts it into a JSON-formatted string. In the\
    \ example, an associative array with a `name` and `age` is converted to a JSON\
    \ string. `json_decode($jsonString, true)`: This function converts a JSON-formatted\
    \ string back into a PHP variable. The second parameter, when set to `true`, ensures\
    \ the resulting value is an associative array rather than an object. Without it,\
    \ the default output would be an object. In the example, the JSON string is converted\
    \ back into a PHP `array`, which is then printed using `print_r`, showing the\
    \ structure and data.\n\nThese functions are essential for web development, allowing\
    \ easy data exchange between the client and server or among different systems.\
    \ `JSON` is a lightweight data-interchange format that is easy for humans to read\
    \ and write and for machines to parse and generate, making it highly used in web\
    \ development for API communication and configuration files.\n\n# 18. Multibyte\
    \ String (mbstring)\n\nThe `mbstring` library provides multibyte specific string\
    \ functions that help in dealing with multibyte encodings in PHP. It's essential\
    \ for handling, converting, and using strings in various encodings, ensuring proper\
    \ handling of UTF-8 and other character sets.\n\n### Ex:Multibyte String (mbstring)\n\
    \n```php\n<?php\n// Set internal character encoding to UTF-8\nmb_internal_encoding('UTF-8');\n\
    // Check if the string is valid UTF-8\n$string = 'こんにちは'; // \"Hello\" in Japanese\n\
    if (mb_check_encoding($string, 'UTF-8')) {\n    echo \"The string is valid UTF-8\"\
    ;\n} else {\n    echo \"The string is not valid UTF-8\";\n}\n?>\n```\nOutput:\n\
    The string is valid UTF-8\n\nThis code snippet showcases the usage of two functions\
    \ from the Multibyte String extension (`mbstring`) in PHP: `mb_internal_encoding`\
    \ and `mb_check_encoding`. `mb_internal_encoding('UTF-8')`: This function sets\
    \ the internal character encoding to UTF-8, which is a widely used multibyte character\
    \ encoding system. This setting affects the behavior of some of the `mbstring`\
    \ functions, ensuring they operate under the assumption that strings are encoded\
    \ in UTF-8. It's crucial for web applications that need to handle multilingual\
    \ content correctly. `mb_check_encoding($string, 'UTF-8')`: This function checks\
    \ if the specified string is valid for the specified encoding, UTF-8 in this case.\
    \ It returns true if the string is valid for the given encoding, otherwise false.\
    \ In the example, a Japanese greeting is used as the string, and the function\
    \ verifies it as a valid UTF-8 encoded string. The `mbstring` library is indispensable\
    \ for internationalized applications, as it provides capabilities to handle strings\
    \ in different encodings without worrying about unexpected behavior or data corruption.\
    \ This is especially important in a global context where applications must support\
    \ various languages and character sets.\n"
