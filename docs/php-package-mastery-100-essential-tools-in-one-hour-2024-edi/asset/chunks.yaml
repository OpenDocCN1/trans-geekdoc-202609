  trans: "\n\n# 23. PCNTL\n\n`PCNTL` (允许 PHP 脚本在基于 Unix 的操作系统上控制进程。)\n\n**Ex:PCNTL**\n\
    ```php\n<?php\n$pid = pcntl_fork();\nif ($pid == -1) {\n    die('could not fork');\n\
    } else if ($pid) {\n    // 父进程\n    pcntl_wait($status); // 防止产生僵尸进程\n    echo\
    \ \"Parent Process\";\n} else {\n    // 子进程\n    echo \"Child Process\";\n}\n\
    ?>\n```\n\n根据执行路径的不同，它会在子进程中显示“Child Process”，并在父进程中等待子进程结束，然后父进程可能会显示“Parent\
    \ Process”。\n\n此 PHP 脚本演示了如何使用 `PCNTL` 扩展在程序中创建分叉（fork）。分叉是一个概念，即当前进程创建它自身的副本。它就像道路上的分叉；父进程和子进程都会独立地继续执行后续代码。\n\
    \n`pcntl_fork()` 函数创建一个子进程。如果函数返回 `-1`，则意味着 fork 失败。如果返回 `0`，则意味着代码当前正在子进程中运行。任何其他正数都意味着代码正在父进程中运行，该数字代表子进程的\
    \ ID（PID）。\n\n在父进程中（`$pid` 为正数），调用 `pcntl_wait($status)` 来等待子进程完成。这对于防止僵尸进程非常重要，僵尸进程是指已经完成执行但在进程表中仍有条目的进程。\n\
    \n在子进程中（`$pid` 为 `0`），我们只需打印“Child Process”。此进程可以独立于父进程执行任何操作。\n\n根据时间顺序，输出可能会有所不同。通常会先显示子进程的消息，在父进程等待子进程完成后显示父进程的消息。\n\
    \n分叉概念对于在类 Unix 操作系统上运行的 PHP 脚本创建守护进程或任何后台进程至关重要。理解 `PCNTL` 是高级 PHP 编程的关键，特别是对于需要进程控制的健壮命令行应用程序。\n\
    \n# 24. posix\n\n`POSIX` 扩展提供了一组函数，允许 PHP 脚本与底层操作系统交互，包括访问用户信息。\n\n**Ex:posix**\n\
    ```php\n<?php\n$userInfo = posix_getpwuid(posix_getuid());\necho \"Username: \"\
    \ . $userInfo['name'];\n?>\n```\n\n显示用户的用户名，例如：“Username: johoe”。此 PHP 脚本使用 `POSIX`\
    \ 扩展来获取用户 ID。在类 Unix 系统中，`posix_getpwuid()` 返回一个包含用户信息的数组。`posix_getuid()` 函数返回当前用户的\
    \ ID。`posix_getpwuid()` 接收一个用户 ID 并返回一个包含用户信息的数组。此功能对于需要识别用户的脚本非常有用。`POSIX` 扩展为操作系统提供了一个桥梁。。这对于类\
    \ Unix 系统至关重要。\n\n# 25. Intl\n\n国际化扩展 `Intl` 提供了格式化、解析以及处理区域（locales）的工具。\n\n\
    **Ex:Intl**\n```php\n<?php\n$formatter = new NumberFormatter('en_US', NumberFormatter::DEFAULT_STYLE);\n\
    echo $formatter->format(1234567.89);\n?>\n```\n格式化后的数字为“1,234,567.89”。此代码演示了如何使用\
    \ `Intl`（国际化）`NumberFormatter` 类根据区域来格式化数字。以下是步骤：我们创建一个 `NumberFormatter` 类的实例，并指定\
    \ `'en_US'` 为区域，`NumberFormatter::DEFAULT_STYLE` 为样式。然后，我们在格式化器上调用 `format()`\
    \ 方法，传入数字 `1234567.89`。该方法根据指定的区域格式化数字。输出格式化后的数字“1,234,567.89”。这演示了 `Intl` 扩展处理区域格式的能力。\n\
    \n# 26. GMP (GNU Multiple Precision)\n\n`GMP` 扩展允许处理任意长度的整数，并比 PHP 原生算术提供更好的性能。\n\
    \n**Ex:GMP (GNU Multiple Precision)**\n```php\n<?php\n$gmpResult = gmp_add(\"\
    123456789012345678901234567890\", \"987654321098765432109876543210\");\necho gmp_strval($gmpResult);\n\
    ?>\n```\n结果为“111111111011111111101111111100”。在示例中，我们利用 `GMP`（GNU 多精度）扩展对非常大的整数进行算术运算，这些整数超出了\
    \ PHP 原生整数类型的范围。以下是详细说明：我们使用 `gmp_add()` 函数相两个以字符串表示的任意长度整数。这是因为 PHP 原生的 `int`\
    \ 类型无法在不丢失精度的情况下处理大数字。第一个字符串 `\"123456789012345678901234567890\"` 和第二个字符串 `\"\
    987654321098765432109876543210\"` 被传递给 `gmp_add()`，它返回一个表示这两个数字和的 GMP 数字资源。为了显示结果，我们使用\
    \ `gmp_strval()` 将 GMP 数字资源转换为字符串。`echo` 语句打印结果，“111111111011111111101111111100”，即这两个数字的和。\n\
    \n"
- fmt: "\n# 27. mysqli\n\nThe `mysqli` extension (MySQL Improved) is a relational\
    \ database driver used in the PHP programming language to provide an interface\
    \ with MySQL databases. It supports prepared statements, transactions, and enhanced\
    \ debugging capabilities.\n\n## Ex:mysqli\n```php\n<?php\n$mysqli = new mysqli(\"\
    localhost\", \"user\", \"password\", \"database\");\nif ($mysqli->connect_errno)\
    \ {\n    echo \"Failed to connect to MySQL: \" . $mysqli->connect_error;\n   \
    \ exit();\n}\n// Perform a query, check for error\nif (!$mysqli->query(\"CREATE\
    \ TEMPORARY TABLE myCity LIKE City\")) {\n    echo \"Query Failed: \" . $mysqli->error;\n\
    \    exit();\n}\n$mysqli->close();\n?>\n```\n\nIf successful, this script does\
    \ not produce any output. If it fails, it will print an error message, such as\
    \ \"Failed to connect to MySQL: \" followed by the error message, or \"Query Failed:\
    \ \" followed by the error reason.\n\nThis code snippet demonstrates the basic\
    \ usage of the `mysqli` extension to interact with a MySQL database. It performs\
    \ the following steps:\n- Creates a new instance of the `mysqli` class, attempting\
    \ to connect to a MySQL database using the provided hostname, username, password,\
    \ and database name.\n- Checks if the connection was successful by examining the\
    \ `connect_errno` property. If there's an error, it prints an error message and\
    \ exits the script.\n- Attempts to perform a SQL query that creates a temporary\
    \ table named 'myCity' which is like an existing table named 'City'. It checks\
    \ if the query was successful by evaluating the result of the `query()` method.\
    \ If the query fails, it prints an error message detailing the issue and exits.\n\
    - Closes the database connection with the `close()` method.\n\nThis example illustrates\
    \ how to establish a connection to a MySQL database, execute a query, handle potential\
    \ errors, and finally close the connection. It's a basic pattern for database\
    \ operations in PHP using `mysqli`.\n\n# 28. ftp\n\nThe `ftp` extension provides\
    \ a simple and intuitive way to interact with FTP servers using PHP. It allows\
    \ for file uploads, downloads, authentication, and navigation through directories\
    \ on a remote server.\n\n## Ex:ftp\n```php\n<?php\n$ftp_server = \"ftp.example.com\"\
    ;\n$ftp_user_name = \"username\";\n$ftp_user_pass = \"password\";\n// set up a\
    \ connection to ftp server\n$conn_id = ftp_connect($ftp_server);\n// login with\
    \ username and password\n$login_result = ftp_login($conn_id, $ftp_user_name, $ftp_user_pass);\n\
    // check connection and login result\nif ((!conn_id) || (!$login_result)) {\n\
    \    echo \"FTP connection has failed!\";\n    exit;\n} else {\n    echo \"Connected\
    \ to $ftp_server, as $ftp_user_name\";\n}\n// close the FTP stream\nftp_close($conn_id);\n\
    ?>\n```\n\nIf successful, this script prints \"Connected to ftp.example.com, as\
    \ username\". If the connection or login fails, it prints \"FTP connection has\
    \ failed!\".\n\nThis example provides a straightforward demonstration on using\
    \ the `ftp` extension in PHP to connect to an FTP server. The key steps involved\
    \ are:\n- Defining the FTP server details (server address, username, and password).\n\
    - Establishing a connection to the FTP server using `ftp_connect()`. This function\
    \ attempts to make a connection to the FTP server and returns a link identifier\
    \ on success or false on error.\n- Logging in to the FTP server with the provided\
    \ credentials using `ftp_login()`. This function takes the connection link identifier,\
    \ username, and password as parameters, returning true on successful login or\
    \ false on failure.\n- Checking the outcomes of the connection and login attempts.\
    \ If either the connection fails to establish or the login is unsuccessful, an\
    \ error message is printed, and the script exits.\n- Closing the connection to\
    \ the FTP server using `ftp_close()`, which takes the link identifier as its parameter.\n\
    \nThis script encapsulates a basic pattern for initiating a connection to an FTP\
    \ server, performing a login, verifying the success of these operations, and then\
    \ cleanly closing the connection.\n\n# 29. array_diff\n\n`array_diff` is used\
    \ to compare the values of two or more arrays and returns the values in the first\
    \ array that are not present in other arrays.\n\n## Ex:array_diff\n```php\n$array1\
    \ = ['apple', 'banana', 'cherry'];\n$array2 = ['banana', 'durian'];\n$difference\
    \ = array_diff($array1, $array2);\nprint_r($difference);\n```\nOutput:\n```\n\
    Array\n(\n    [0] => apple\n    [2] => cherry\n)\n```\n\nThis code snippet demonstrates\
    \ how to use the `array_diff` function to find differences between two arrays,\
    \ `$array1` and `$array2`. The function compares the values in `$array1` against\
    \ `$array2`. The result, stored in `$difference`, is an array containing all values\
    \ from `$array1` not found in `$array2`. When `print_r($difference)` is executed,\
    \ it prints the array $difference in a human-readable form. This result shows\
    \ that 'apple' and 'cherry' from `$array1` are not present in `$array2`, hence\
    \ they are included in the output. This example illustrates the utility of `array_diff`\
    \ for comparing arrays based on values, without considering the keys associated\
    \ with them.\n\n# 30. array_map\n\n`array_map` applies a callback function to\
    \ the elements of one or more arrays and returns an array containing all the elements\
    \ after applying the callback function.\n\n## Ex:array_map\n```php\n<?php\nfunction\
    \ square($n) {\n    return $n * $n;\n}\n$numbers = [1, 2, 3, 4];\n$squared = array_map('square',\
    \ $numbers);\nprint_r($squared);\n?>\n```\nOutput:\n```\nArray\n(\n    [0] =>\
    \ 1\n    [1] => 4\n    [2] => 9\n    [3] => 16\n)\n```\n\nIn this code we define\
    \ a simple function named `square` that calculates the square of a number. We\
    \ then declare an array `$numbers` with the elements 1, 2, 3, and 4. The `array_map`\
    \ function is used to apply the `square` function to each element of the `$numbers`\
    \ array. The result of this operation is assigned to the `$squared` array. The\
    \ `print_r($squared)` command prints the array `$squared`, showing the squared\
    \ values of the original numbers in `$numbers`. Each element of the `$numbers`\
    \ array is passed to the `square` function, which returns the square of the number.\
    \ The `array_map` function collects these return values into a new array, `$squared`,\
    \ which is then printed out. This demonstrates how `array_map` can be used to\
    \ apply a function to each element of an array, allowing for efficient bulk transformations\
    \ of array data.\n"
  raw: "  27\\. mysqli    The MySQLi extension (MySQL Improved) is a relational database\
    \ driver used in the PHP programming language to provide an interface with MySQL\
    \ databases. It supports prepared statements, transactions, and enhanced debugging\
    \ capabilities.    ––––––––    Ex:mysqli       ?php </span      $mysqli \\= new\
    \ mysqli(\"localhost\", \"user\", \"password\", \"database\");       if ($mysqli->connect\\\
    _errno) {       echo \"Failed to connect to MySQL: \" . $mysqli->connect\\_error;\
    \       exit();       }       // Perform a query, check for error       if (!$mysqli->query(\"\
    CREATE TEMPORARY TABLE myCity LIKE City\")) {       echo \"Query Failed: \" .\
    \ $mysqli->error;       exit();       }       $mysqli->close();       ?>    ––––––––\
    \    If successful, this script does not produce any output. If it fails, it will\
    \ print an error message, such as \"Failed to connect to MySQL: \" followed by\
    \ the error message, or \"Query Failed: \" followed by the error reason.       This\
    \ code snippet demonstrates the basic usage of the mysqli extension to interact\
    \ with a MySQL database. It performs the following steps:Creates a new instance\
    \ of the mysqli class, attempting to connect to a MySQL database using the provided\
    \ hostname, username, password, and database name.Checks if the connection was\
    \ successful by examining the connect\\_errno property. If there's an error, it\
    \ prints an error message and exits the script.Attempts to perform a SQL query\
    \ that creates a temporary table named 'myCity' which is like an existing table\
    \ named 'City'. It checks if the query was successful by evaluating the result\
    \ of the query() method. If the query fails, it prints an error message detailing\
    \ the issue and exits.Closes the database connection with the close() method.This\
    \ example illustrates how to establish a connection to a MySQL database, execute\
    \ a query, handle potential errors, and finally close the connection. It's a basic\
    \ pattern for database operations in PHP using mysqli.  \n\n  28\\. ftp    The\
    \ FTP extension provides a simple and intuitive way to interact with FTP servers\
    \ using PHP. It allows for file uploads, downloads, authentication, and navigation\
    \ through directories on a remote server.    ––––––––    Ex:ftp       ?php </span\
    \      $ftp\\_server \\= \"ftp.example.com\";       $ftp\\_user\\_name \\= \"\
    username\";       $ftp\\_user\\_pass \\= \"password\";       // set up a connection\
    \ to ftp server       $conn\\_id \\= ftp\\_connect($ftp\\_server);       // login\
    \ with username and password       $login\\_result \\= ftp\\_login($conn\\_id,\
    \ $ftp\\_user\\_name, $ftp\\_user\\_pass);       // check connection and login\
    \ result       if ((!$conn\\_id) || (!$login\\_result)) {       echo \"FTP connection\
    \ has failed!\";       exit;       } else {       echo \"Connected to $ftp\\_server,\
    \ as $ftp\\_user\\_name\";       }       // close the FTP stream       ftp\\_close($conn\\\
    _id);        ?>    ––––––––    If successful, this script prints \"Connected to\
    \ ftp.example.com, as username\". If the connection or login fails, it prints\
    \ \"FTP connection has failed!\".       This example provides a straightforward\
    \ demonstration on using the FTP extension in PHP to connect to an FTP server.\
    \ The key steps involved are:Defining the FTP server details (server address,\
    \ username, and password).Establishing a connection to the FTP server using ftp\\\
    _connect(). This function attempts to make a connection to the FTP server and\
    \ returns a link identifier on success or false on error.Logging in to the FTP\
    \ server with the provided credentials using ftp\\_login(). This function takes\
    \ the connection link identifier, username, and password as parameters, returning\
    \ true on successful login or false on failure.Checking the outcomes of the connection\
    \ and login attempts. If either the connection fails to establish or the login\
    \ is unsuccessful, an error message is printed, and the script exits.Closing the\
    \ connection to the FTP server using ftp\\_close(), which takes the link identifier\
    \ as its parameter.This script encapsulates a basic pattern for initiating a connection\
    \ to an FTP server, performing a login, verifying the success of these operations,\
    \ and then cleanly closing the connection.  \n\n  29\\. array\\_diff    array\\\
    _diff is used to compare the values of two or more arrays and returns the differences.\
    \ This function compares the values of the first array against one or more other\
    \ arrays and returns the values in the first array that are not present in any\
    \ of the other arrays.    ––––––––    Ex:array\\_diff       $array1 \\= \\['apple',\
    \ 'banana', 'cherry'\\];       $array2 \\= \\['banana', 'durian'\\];       $difference\
    \ \\= array\\_diff($array1, $array2);       print\\_r($difference);    ––––––––\
    \    Array       (       \\[0\\] \\=> apple       \\[2\\] \\=> cherry       )\
    \    ––––––––    This code snippet demonstrates how to use the array\\_diff function\
    \ to find the differences between two arrays, $array1 and $array2. The function\
    \ compares the values in $array1 against the values in $array2. The result, stored\
    \ in $difference, is an array containing all the values from $array1 that are\
    \ not found in $array2.When print\\_r($difference); is executed, it prints the\
    \ array $difference in a human-readable form. This result shows that 'apple' and\
    \ 'cherry' from $array1 are not present in $array2, hence they are included in\
    \ the output. This example illustrates the utility of array\\_diff for comparing\
    \ arrays and extracting differences based purely on values, without considering\
    \ the keys associated with those values.  \n\n  30\\. array\\_map    array\\_map\
    \ applies a callback function to the elements of one or more arrays and returns\
    \ an array containing all the elements after applying the callback function. \
    \   ––––––––    Ex:array\\_map       function square($n) {       return $n \\\
    * $n;       }       $numbers \\= \\[1, 2, 3, 4\\];       $squared \\= array\\\
    _map('square', $numbers);       print\\_r($squared);    ––––––––    Array       (\
    \       \\[0\\] \\=> 1       \\[1\\] \\=> 4       \\[2\\] \\=> 9       \\[3\\\
    ] \\=> 16       )    ––––––––    In this code we define a simple function named\
    \ square that calculates the square of a number. We then declare an array $numbers\
    \ with the elements 1, 2, 3, and 4\\. The array\\_map function is used to apply\
    \ the square function to each element of the $numbers array. The result of this\
    \ operation is assigned to the $squared array.The print\\_r($squared); command\
    \ prints the array $squared, showing the squared values of the original numbers\
    \ in $numbers. Each element of the $numbers array is passed to the square function,\
    \ which returns the square of the number. The array\\_map function collects these\
    \ return values into a new array, $squared, which is then printed out. This demonstrates\
    \ how array\\_map can be used to apply a function to each element of an array,\
    \ allowing for efficient bulk transformations of array data.  "
