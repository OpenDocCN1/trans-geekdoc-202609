    # 36. Whoops


    Whoops 是一个 PHP 库，帮助你以一种不那么痛苦的方式处理错误和异常。它提供了一个基于栈的错误处理器，可以显示详细的错误页面，向你展示出错之处以及错误发生的上下文。


    ### Ex:Whoops

    ```php

    require ''vendor/autoload.php'';

    use Whoops\Run;

    use Whoops\Handler\PrettyPageHandler;

    $whoops = new Run;

    $whoops->pushHandler(new PrettyPageHandler());

    $whoops->register();

    ```


    当你的 PHP 应用程序发生错误时，你看到的不再是标准的 PHP 错误页面，而是 Whoops 提供的详细且美化的错误页面，其中包含了错误消息、堆栈跟踪和上下文。


    这段代码段展示了如何在 PHP 项目中设置 Whoops 库。首先，我们通过引入 `vendor/autoload.php` 文件（由 Composer，即
    PHP 的依赖管理器——生成）来确保 Whoops 库被自动加载。接下来，我们实例化 `Whoops\Run` 类，该类负责注册 Whoops 错误处理系统。然后，我们创建一个
    `Whoops\Handler\PrettyPageHandler` 实例，这是 Whoops 提供的特定错误处理器，旨在生成更符合用户习惯的错误页面。通过调用
    `$whoops->pushHandler()`，我们将此处理器添加到 Whoops 将使用的错误处理器栈中。最后，`$whoops->register()`
    激活 Whoops 错误处理系统，替换 PHP 的默认错误处理机制。现在，每当发生错误时，Whoops 都会显示其自定义的详细错误页面，而不是默认 PHP
    错误页面，让调试变得简单许多。


    # 37. Faker


    Faker 是一个为你生成虚假数据的 PHP 库。它可以为各种用途（如测试、填充数据库等）创建数据，能够生成多种语言的姓名、地址、电话号码甚至文本。


    ### Ex:Faker

    ```php

    require_once ''vendor/autoload.php'';

    $faker = Faker\Factory::create();

    // 生成随机姓名

    echo "Name: " . $faker->name . "\n";

    // 生成随机地址

    echo "Address: " . $faker->address . "\n";

    // 生成随机文本

    echo "Text: " . $faker->text;

    ```

    Name: John Doe

    Address: 123 Main St., Springfield, 98765

    Text: Lorem dolor sit amet, consectetur elit...


    在上面的代码示例中，第一步是使用 Composer 的自动加载功能引入 Faker 库。这使得所有的 Faker 类都对你的脚本可用。


    实例化：`$faker = Faker\Factory::create();` - 这一行创建了一个新的生成器实例，它是你生成所有数据的核心。


    生成虚假数据：后续行使用 `$faker` 实例生成各种类型的虚假数据。每个方法（`name`、`address`、`text`）都旨在产生特定类型的数据。

    `echo "Name: " . $faker->name;` 打印随机生成的姓名。

    `echo "Address: " . $faker->address;` 打印随机生成的地址。

    `echo "Text: " . $faker->text;` 打印一段 "lorem ipsum" 文本。


    这段代码非常灵活，可以通过指定区域（locales）或调整想要生成的数据类型进行自定义，使其成为开发过程中需要占位符数据的开发者的强大工具。


    # 38. HTMLPurifier


    HTMLPurifier 是一个用 PHP 编写的 HTML 过滤库。它通过经过彻底审核、安全且允许的白名单移除所有恶意代码（广为人知的 XSS），并确保你的文档符合标准。


    ### Ex:HTMLPurifier

    ```php

    require_once ''vendor/autoload.php'';

    $config = HTMLPurifier_Config::create();

    $purifier = new HTMLPurifier($config);

    $dirty_html = ''<a href="javascript:alert(\''XSS\'')">Click me!'';

    $clean_html = $purifier->purify($dirty_html);

    echo $clean_html;

    ```

    代码示例演示了如何使用 HTMLPurifier 库来清理包含潜在 XSS（跨站脚本）攻击的 HTML 字符串。


    引入库：与 Faker 一样，你首先通过 Composer 的自动加载功能引入库。此操作使得 HTMLPurifier 可对你的脚本可用。


    创建配置和净化器实例：`$config = HTMLPurifier_Config::create();` 为 HTMLPurifier 设置默认配置。该配置可以自定义，但默认设置旨在移除所有恶意代码。`$purifier
    = new HTMLPurifier($config);` 使用之前定义的配置创建一个新的 HTMLPurifier 实例。


    清理 HTML：`$dirty_html` 包含你想清理的恶意 HTML 代码。在本例中，它是一个带有 onclick 事件的简单链接，这是一种常见的 XSS
    攻击向量。`$clean_html = $purifier->purify($dirty_html);` 根据配置定义的规则处理脏 HTML 并移除任何恶意代码。清理后的
    HTML 存储在 `$clean_html` 中。


    输出清理后的 HTML：`echo $clean_html;` 这一行输出经过处理的 HTML。在这种情况下，HTMLPurifier 移除了 `href`
    属性中的 `javascript:` 协议，在消解 XSS 威胁的同时保留了其余标记。这证明了 HTMLPurifier 在纯化用户输入和防止 XSS 攻击方面的有效性，使其成为关注安全的
    Web 开发者必不可少的工具。


    # 39. PHPLeague''s Plates


    Plates 是一个原生 PHP 模板系统，快速、易用且易于扩展。它受到 Twig 的启发，但专注于原生 PHP 模板，因此不需要学习新语法。它提供了跨模板的数据共享、模板继承以及用于组织模板的文件夹结构。


    ### Ex:PHPLeague''s Plates

    ```php

    // 使用 Plates 渲染模板的示例

    require ''vendor/autoload.php'';

    // 创建新的 Plates 实例

    $templates = new League\Plates\Engine(''/path/to/templates'');

    // 渲染模板

    echo $templates->render(''profile'', [''name'' => ''Jonathan'']);

    ```

    输出将显示 `profile.php` 模板文件的内容，并将 ''Jonathan'' 插入到模板适当的位置。


    在示例中，首先，我们引入 Composer 自动加载文件来自动加载依赖。然后，我们创建一个 Plates 引擎的新实例，指定模板的路径。在这种情况下，Plates
    将 `/path/to/templates` 目录下查找模板文件。


    接下来，我们渲染一个名为 ''profile'' 的模板。Plates 将自动在指定的目录下查找名为 `profile.php` 的文件。`render`
    方法的第二个参数是一个关联数组，其数据将传递给模板。在这里，我们传递了一个键名为 ''name''、值为 ''Jonathan'' 的单个数据。


    在 `profile.php` 模板文件中，你将使用标准的 PHP 语法访问名称变量，例如 `<?= <span>$name ?>`，以便在模板的所需位置打印名称。这种方法允许在不需要学习新模板语法的情况下实现逻辑与呈现的清晰分离，充分利用模板中
    PHP 的强大功能。


