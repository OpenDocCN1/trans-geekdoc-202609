  trans: "\n\n# 73. PsySH\n\nPsySH 是一个用于 PHP 的交互式 shell，为开发者提供了一个用于调试和交互式开发的控制台。它允许实时执行\
    \ PHP 代码，并包含变量检查、回溯轨迹浏览等功能，还可以与各种框架集成以增强调试能力。\n\n### 示例：PsySH\n\n```bash\n// 要使用\
    \ PsySH，你通常通过命令行执行它来进入 PsySH shell：\n// $ psysh\n// 然后，在 PsySH shell 中，你可以直接执行\
    \ PHP 代码。例如：\n// 定义一个新变量\n$exampleVar = 'Hello, PsySH!';\n// 倾储变量以检查其值\ndump($exampleVar);\n\
    ```\n\n`dump` 命令输出 `$exampleVar` 的值，显示内容如下：\n`\"Hello, PsySH!\"`\n\n要开始使用 PsySH，你需要通过\
    \ PHP 的依赖管理器 `Composer` 安装它。你可以通过运行 `composer require psy/psysh` 将其添加到你的项目中。安装完成后，你可以在终端中输入\
    \ `psysh` 来启动 PsySH shell。这将弹出一个交互式的 PHP 环境，你可以在其中逐段测试和调试你的代码片段。PsySH 特别适用于探索新库、调试复杂问题，或仅仅在不需要创建完整脚本的情况下测试小段\
    \ PHP 代码。它与主流 PHP 框架集成的能力使其成为寻求简化调试流程的 PHP 开发者不可或缺工具。提供的示例演示了你如何使用 PsySH 检查变量，但它的功能远不止于此，包括运行整个函数、评估复杂表达式等。\n\
    \n# 74. PHPStan\n\nPHPStan 是一个用于 PHP 的静态分析工具，专注于在不实际运行代码的情况下发现代码中的错误。它可以检测潜在的\
    \ bug 和不一致之处，遵循现代开发实践以确保代码的可靠性和可维护性。它支持从基础到严格的各种分析级别，允许开发者逐步改进他们的代码库。\n\n### 示例：PHPStan\n\
    \n```bash\n// PHPStan 通常从命令行运行，分析你的 PHP 文件以查找潜在问题。这是一个示例命令：\n// $ vendor/bin/phpstan\
    \ analyse src --level=max\n// 该命令告诉 PHPStan 以最高严格级别分析项目中的 \"src\" 目录。\n// 由于 PHPStan\
    \ 从命令行运行，这里有一个简化的 PHP 示例，在被 PHPStan 分析时可能会引发错误：\nfunction addNumbers(int $a, int\
    \ $b): int {\n    return $a + $b;\n}\necho addNumbers('5', 10);\n```\n\nPHPStan\
    \ 将报告类型不匹配错误，指示在需要整数的地方传递了字符串，并突出显示行：\n`Parameter #1 $a of function addNumbers\
    \ expects int, string given.`\n\nPHPStan 是一个帮助提高 PHP 代码质量而无需执行代码的工具。要使用 PHPStan，你首先需要通过\
    \ `Composer` 使用命令 `composer require --dev phpstan/phpstan` 安装它。安装完成后，你可以像示例所示对你项目中的\
    \ PHP 文件运行它。PHPStan 根据一组规则检查你的代码，以识别潜在问题，例如类型不匹配、未定义的变量等。严格程度可以调整，使得能够从基础检查开始，并随着项目的演进进展到更彻底的分析。这种灵活性使得\
    \ PHPStan 成为任何开发阶段项目的绝佳选择，从正在进行现代化的遗留代码库到从一开始就追求高质量代码的全新项目均适用。提供的示例演示了 PHPStan\
    \ 如何捕获常见错误（例如类型不匹配），这些错误开发者可能无法立即察觉，特别是在像 PHP 这样的动态类型语言中。\n\n# 75. SwiftMailer\n\
    \nSwiftMailer 是一个用于 PHP 应用程序发送邮件的库。它提供了一种灵活且优雅的面向对象的方法来发送邮件，具有多种功能。\n\n### 示例：SwiftMailer\n\
    \n```php\n<?php\nrequire_once 'vendor/autoload.php';\n// 创建传输层\n$transport = (new\
    \ Swift_SmtpTransport('smtp.example.com', 25))\n    ->setUsername('your_username')\n\
    \    ->setPassword('your_password');\n// 使用创建的传输层创建 Mailer\n$mailer = new Swift_Mailer($transport);\n\
    // 创建消息\n$message = (new Swift_Message('Wonderful Subject'))\n    ->setFrom(['john@doe.com'\
    \ => 'John Doe'])\n    ->setTo(['receiver@domain.org', 'other@domain.org' => 'A\
    \ name'])\n    ->setBody('Here is the message itself');\n// 发送消息\n$result = $mailer->send($message);\n\
    ?>\n```\n\n结果是一个整数，表示成功接收者的数量。如果一切设置正确，你将看到一个正数。这个示例展示了如何使用 SwiftMailer 发送邮件。首先，你通过\
    \ `require_once 'vendor/autoload.php';` 引入 SwiftMailer 库。接下来，你创建一个 SwiftMailer\
    \ 将用于发送邮件的 `transport`。在这种情况下，我们使用带有虚拟服务器 `smtp.example.com` 的 SMTP，并提供了你的 SMTP\
    \ 凭据。设置好传输层后，你创建一个负责发送邮件的 `mailer` 对象。然后，你使用 `Swift_Message` 类构建邮件本身。这包括了设置发件人和收件人地址、主题以及邮件正文。最后，你使用\
    \ `mailer` 对象上的 `send` 方法发送邮件。`send` 方法返回成功接收者的数量。如果设置正确且 SMTP 服务器接受了邮件，这应该是一个正数，表示邮件已成功发送。SwiftMailer\
    \ 处理了许多邮件发送的复杂性（如 MIME 类型和标头），为 PHP 应用程序提供了一个健壮的解决方案。\n\n"
- fmt: "\n# 76. PHPExcel (Now PhpSpreadsheet)\n\n`PHPExcel`, now known as `PhpSpreadsheet`,\
    \ is a library for reading and writing spreadsheet files (Excel, LibreOffice,\
    \ etc.). It supports various file formats including XLSX, XLS, and CSV, providing\
    \ a way to interact with spreadsheet data programmatically.\n\nEx:PHPExcel (Now\
    \ PhpSpreadsheet)\n\n```php\n<?php\nrequire 'vendor/autoload.php';\nuse PhpOffice\\\
    PhpSpreadsheet\\Spreadsheet;\nuse PhpOffice\\PhpSpreadsheet\\Writer\\Xlsx;\n$spreadsheet\
    \ = new Spreadsheet();\n$sheet = $spreadsheet->getActiveSheet();\n$sheet->setCellValue('A1',\
    \ 'Hello World !');\n$writer = new Xlsx($spreadsheet);\n$writer->save('hello_world.xlsx');\n\
    ?>\n```\n\n// A file named will be created with \"Hello World !\" in cell A1.\n\
    \nIn this example, we demonstrate creating a simple Excel file using `PhpSpreadsheet`,\
    \ the successor of `PHPExcel`. First, we include the `PhpSpreadsheet` library\
    \ with `require 'vendor/autoload.php';`. This line assumes that `PhpSpreadsheet`\
    \ has been installed via Composer, a dependency manager for PHP.\n\nWe start by\
    \ creating a new `Spreadsheet` object. This object represents the Excel file we\
    \ are going to create. The `getActiveSheet` method is then used to get the current\
    \ active sheet in the spreadsheet. This is where we'll be writing our data.\n\n\
    Next, we use the `setCellValue` method on the active sheet to write \"Hello World\
    \ !\" into cell A1. The `setCellValue` method takes two parameters: the first\
    \ is the cell coordinate (e.g., `'A1'`), and the second is the value to be written\
    \ to that cell.\n\nAfter writing to the spreadsheet, we create a writer object\
    \ that will save our spreadsheet to a file. In this case, we use `PhpOffice\\\
    PhpSpreadsheet\\Writer\\Xlsx` to create an XLSX file writer. Finally, we call\
    \ the `save` method on the writer object, passing the name of the file we want\
    \ to create (`hello_world.xlsx`).\n\n`PhpSpreadsheet` abstracts away the complexities\
    \ of dealing with different spreadsheet file formats, providing a unified API\
    \ to read from and write to various spreadsheet documents. This makes it incredibly\
    \ useful for generating reports, exporting data, and even reading spreadsheet\
    \ files for data processing in PHP applications.\n\n# 77. Whoops\n\n`Whoops` is\
    \ a PHP library designed to handle errors and exceptions in a more user-friendly\
    \ manner. It provides a stack-based error handler that can be integrated into\
    \ any PHP application, making it easier to debug during development. `Whoops`\
    \ displays detailed diagnostic information, including the file and code line where\
    \ the error occurred, the call stack, and, if available, the relevant code snippet.\n\
    \nEx:Whoops\n\n```php\nrequire 'vendor/autoload.php';\n$whoops = new Whoops\\\
    Run;\n$whoops->pushHandler(new Whoops\\Handler\\PrettyHandler);\n$whoops->register();\n\
    throw new Exception(\"Something went!\");\n```\n\nA error page showing \"Something\
    \ went!\", the file and line where the exception was thrown, the stack trace,\
    \ and the relevant code snippet. This code snippet demonstrates how to integrate\
    \ `Whoops` into a project. `require 'vendor/autoload.php';` - This line includes\
    \ the Composer autader, assuming `Whoops` has been installed via Composer. Composer\
    \ is a dependency manager for PHP.\n\n`$whoops = new Whoops\\Run;` - Creates an\
    \ instance of the Whoops error handler. `$whoops->pushHandler(new Whoops\\Handler\\\
    PrettyHandler);` - Adds a \"pretty\" error page handler to the Whoops stack. `$whoops->register();`\
    \ - Registers the Whoops instance as the default error handler for PHP. `throw\
    \ new Exception(\"Something went!\");` - This line is just an example of throwing\
    \ an exception to trigger `Whoops`. In a real application, exceptions might be\
    \ thrown by the application itself, Whoops takes over and displays the error page.\n\
    \n# 78. Predis\n\n`Predis` is a flexible and feature-complete Redis client for\
    \ PHP. It provides an easy-to-use interface for communicating with Redis. Redis\
    \ is a fast in-memory store used for caching, messaging, and more. `Predis` supports\
    \ various Redis features, including transactions, pipelining, pub/sub, and clustering.\n\
    \nEx:Predis\n\n```php\nrequire 'vendor/autoload.php';\n$client = new Predis\\\
    Client([\n    'scheme' => 'tcp',\n    'host' => '127.0.0.1',\n    'port' => 6379,\n\
    ]);\n$client->set('foo', 'bar');\n$value = $client->get('foo');\necho $value;\n\
    ```\n\nbar\n\nThis code snippet illustrates the basic usage of `Predis` to interact\
    \ with a Redis database. `require 'vendor/autoload.php';` - This includes the\
    \ Composer autader to autoload the `Predis` library, assuming it has been installed\
    \ via Composer. `$client = new Predis\\Client([...]);` - This line creates a new\
    \ instance of a `Predis` client. The array passed to the constructor contains\
    \ the connection parameters for the Redis server. In this example, it's connecting\
    \ to Redis on localhost (127.0.0.1) on the default port (6379). `$client->set('foo',\
    \ 'bar');` - Sets the value of the key `foo` to `bar` in Redis. This demonstrates\
    \ how to write data to Redis using `Predis`. `$value = $client->get('foo');` -\
    \ Retrieves the value of the key `foo` from Redis, which should be `bar` as set\
    \ in the previous step. `echo $value;` - Prints the value retrieved from Redis\
    \ to the standard output. In this case, it prints bar.\n\n`Predis` abstracts the\
    \ communication with Redis, providing a simple and intuitive API for PHP applications\
    \ to leverage Redis's capabilities. It supports a wide range of Redis commands\
    \ and features, making it a versatile choice for PHP developers working with Redis.\n"
