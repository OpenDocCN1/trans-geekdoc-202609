  trans: "\n\n# 7. DateTime\n\n`DateTime` 类用于表示和操作日期与时间。它提供了对日期进行加减等操作的方法，以及对日期和时间进行格式化以供显示。\n\
    \nEx:DateTime\n```php\n<?php\n$date = new DateTime('2024-03-20');\n$date->add(new\
    \ DateInterval('P10D')); // 增加 10 天\necho $date->format('Y-m-d');\n?>\n```\n\n\
    在这个 PHP 脚本中，我们正在处理 `DateTime` 类，这是一个管理日期和时间的强大工具。`$date = new DateTime('2024-03-20')`\
    \ 创建了一个表示 2024 年 3 月 20 日的 `DateTime` 对象。`DateTime` 构造函数可以接受一个日期字符串作为参数来初始化日期。`$date->add(new\
    \ DateInterval('P10D'))` 在初始设置的日期基础上增加了 10 天。`DateInterval` 对象通过周期标识符（`P`）创建，后面跟随着天数（`10D`）。这意味着“为期\
    \ 10 天的周期”。`DateInterval` 也可以用于月份、年份、小时、分钟和秒。`echo $date->format('Y-m-d')` 根据提供的格式（`'Y-m-d'`\
    \ 代表年-月-日）将修改后的日期格式化为字符串并打印。输出是“2024-03-30”，这是初始日期的 10 天后。这个示例展示了如何通过添加特定间隔并对输出进行格式化处理来操作日期，这是\
    \ Web 开发中常见的任务，例如用于过期日期、定时发布帖子或活动倒计时等功能。\n\n# 8. hash\n\n`hash` 扩展提供了一种使用各种算法生成任意长度哈希摘要（digest）的方法。它通常用于为密码或数据生成安全哈希以供验证。\n\
    \nEx:hash\n```php\n<?php\n$data = \"Hello, world!\";\n$hash = hash('sha256', $data);\n\
    echo $hash;\n?>\n```\n`a591a6d40bf420404a011733cfb7b190d62c65bf0eecb2b5571f4e3a5a6b3d79`\n\
    \n在这个简单的 PHP 脚本中，我们利用 `hash` 函数使用 `SHA-256` 算法生成字符串“Hello, world!”的哈希摘要。`$data\
    \ = \"Hello, world!\"` 设置了我们想要哈希的字符串。`$hash = hash('sha256', $data)` 使用 `SHA256`\
    \ 算法生成 `$data` 的哈希。`hash` 函数接受两个参数：算法名称（`'sha256'`）和要哈希的数据。`SHA256` 是 SHA 加密函数全集的一部分，广泛应用于安全领域和协议。`echo\
    \ $hash` 打印生成的摘要。结果是一个固定长度的字符串，充当输入数据的“数字指纹”。注意的是，即使输入数据发生微小的变化也会产生截然不同的哈希值。像\
    \ `SHA256` 这样的哈希函数对于创建安全的密码存储、数据完整性，以及在加密应用中确保数据未被篡改至关重要。\n\n# 9. Reflection\n\
    \nPHP 中的反射（Reflection）用于内省类、函数、方法和扩展。这种能力允许开发人员在运行时分析代码结构，包括属性、方法和参数，这对于调试或需要以动态方式操作对象的系统特别有用。\n\
    \nEx:Reflection\n```php\n<?php\nclass MyClass {\n    public $prop1 = 'Hello';\n\
    \    private $prop2 = 'World';\n    public function myMethod($arg1, $arg2) {\n\
    \        return $arg1 . $arg2;\n    }\n}\n$reflectionClass = new ReflectionClass('MyClass');\n\
    $properties = $reflectionClass->getProperties();\nforeach ($properties as $prop)\
    \ {\n    echo $prop->getName() . \"\\n\";\n}\n$methods = $reflectionClass->getMethods();\n\
    foreach ($methods as $method) {\n    echo $method->getName() . \"\\n\";\n}\n?>\n\
    ```\nprop1\nprop2\nmyMethod\n\n# 10. stream_context_create\n\nPHP 中的 `stream_context_create`\
    \ 函数用于创建并返回流上下文（stream context），该资源可用于文件系统或流函数。此上下文可以修改流函数的行为，允许自定义，如设置 HTTP 请求头、指定\
    \ SSL 选项或配置文件操作和传输的设置。\n\nEx:stream_context_create\n```php\n<?php\n$options =\
    \ array(\n    'http' => array(\n        'method' => \"GET\",\n        'header'\
    \ => \"Accept-language: en\\r\\n\" .\n                   \"Cookie: foo=bar\\r\\\
    n\"\n    )\n);\n$context = stream_context_create($options);\n$result = file_get_contents('http://www.example.com/',\
    \ false, $context);\necho $result;\n?>\n```\n请求的内容将被显示\n\n在这个示例中，我们演示了如何使用 `stream_context_create`\
    \ 函数来自定义 PHP HTTP 请求。我们首先定义了一个关联数组 `$options`，指定 HTTP 流上下文的选项。在这种情况下，我们将 HTTP\
    \ 方法设为 `\"GET\"`，并添加了包含 `Accept-language` 请求头和 `Cookie` 的自定义头部。然后，我们使用 `stream_context_create($options)`\
    \ 创建流上下文。该函数接收我们的选项数组并从其构建流上下文资源。通过此上下文，我们调用 `file_get_contents` 并传递要获取数据的网站 URL、标记\
    \ `false`（使用全局流上下文）以及我们自定义的 `$context`。这指令 `file_get_contents` 在发起请求时使用指定的 HTTP\
    \ 头部。最后，我们输出 `$result`，即从指定 URL 获取的内容，展示了流上下文如何被用于修改 HTTP 请求的行为。这种方法对于与 API 交互、爬虫或任何比默认提供更多\
    \ HTTP 请求控制的情况都极其有用。它展示了 PHP 流包装器和上下文选项用于自定义数据流的灵活性。\n\n"
- fmt: "\n# 11. imagick\n`Imagick` is a PHP extension for creating and modifying images\
    \ using the `ImageMagick API`. It supports a variety of image formats and operations,\
    \ such as resizing, cropping, converting between formats, and applying effects.\n\
    \n### Ex:imagick\n```php\n<?php\n$image = new Imagick('input.jpg');\n$image->thumbnailImage(100,\
    \ 0);\necho $image->getImageBlob();\n?>\n```\nThe code outputs the binary data\
    \ of a 100 pixels wide thumbnail of the input image.\n\nIn the provided PHP code,\
    \ we start by creating a new instance of the `Imagick` class by passing a path\
    \ to an image file (`'input.jpg'`) to its constructor. This step initializes the\
    \ `Imagick` object with the image data from `'input.jpg'`. Next, we call the `thumbnailImage`\
    \ method on the `$image` object. This method takes two parameters: the desired\
    \ width (100 pixels in our example) and height of the thumbnail. By setting the\
    \ height to `0`, we instruct `Imagick` to automatically maintain the aspect ratio\
    \ of the original image, ensuring the thumbnail looks proportional. Finally, `getImageBlob()`\
    \ method is called on the `$image` object, which generates the binary data of\
    \ the processed image (in this case, the thumbnail). This binary data represents\
    \ the image in its current format (as defined in the original image or any subsequent\
    \ format changes applied via `Imagick` methods) and can be directly displayed\
    \ in a browser, saved to a file, or manipulated further.\n\n# 12. sockets\nThe\
    \ `sockets` extension in PHP allows for the creation of socket-based connections,\
    \ enabling PHP scripts to communicate with other servers or clients over the network.\
    \ It supports various socket operations like creating, binding, listening, accepting\
    \ connections, sending, and receiving data over TCP/IP or UDP.\n\n### Ex:sockets\n\
    ```php\n<?php\n$socket = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);\n$result\
    \ = socket_connect($socket, 'www.example.com', 80);\n$message = \"GET / HTTP/1.1\\\
    r\\nHost: www.example.com\\r\\nConnection: Close\\r\\n\\r\\n\";\nsocket_write($socket,\
    \ $message, strlen($message));\n$result = socket_read($socket, 1024);\nsocket_close($socket);\n\
    echo $result;\n?>\n```\nThe code displays the HTTP response received from `www.example.com`.\n\
    \nThe PHP script begins with `socket_create`, which creates a socket resource.\
    \ This function takes three parameters: the address family (`AF_INET` for IPv4),\
    \ the type of socket (`SOCK_STREAM` for a TCP connection), and the protocol (`SOL_TCP`\
    \ for TCP protocol). Following socket creation, `socket_connect` attempts to establish\
    \ a connection to `'www.example.com'` on port 80, the default port for HTTP. With\
    \ a successful connection, a simple HTTP GET request is prepared, asking for the\
    \ root document (`'/'`) of `'www.example.com'`. This request string is then sent\
    \ through the socket using `socket_write`. The `socket_read` function reads the\
    \ response from the server into `$result`, which is then outputted using `echo`.\
    \ Finally, `socket_close` is called to close the socket connection. This example\
    \ demonstrates a basic use of PHP's socket functions to perform network communication,\
    \ specifically retrieving a web page's HTML content via a raw HTTP request.\n\n\
    # 13. Filesystem Functions\nPHP's filesystem functions allow for the manipulation\
    \ and handling of file systems. These include reading, writing, and modifying\
    \ files and directories.\n\n### Ex:Filesystem Functions\n```php\n// Reading a\
    \ file into a string\n$content = file_get_contents('example.txt');\n// Writing\
    \ to a file\nfile_put_contents('example_new.txt', $content . \" Additional content.\"\
    );\n```\nThe first function reads the content of `'example.txt'` into a variable.\
    \ The second function writes the content back into a new file, appending \" Additional\
    \ content.\" at the end.\n\nIn the first part of the code, `file_get_contents('example.txt')`\
    \ reads the entire content of the file named `'example.txt'` into a PHP string.\
    \ This function is very useful for quickly accessing the content of a file without\
    \ needing to open it manually, read its content line by line, and then close it.\
    \ The second part, `file_put_contents('example_new.txt', $content . \" Additional\
    \ content.\")`, takes the content previously read and adds the string `\" Additional\
    \ content.\"` to it. Then it writes this content into a new file named `'example_new.txt'`.\
    \ If the file does not exist, PHP will create it; if it does exist, PHP will overwrite\
    \ it. This function simplifies the process of writing to a file, abstracting away\
    \ the need to manually open a file, write the content, and then close it.\n\n\
    # 14. file_exists and is_writable\nThe `file_exists` function checks if a file\
    \ or directory exists, and `is_writable` checks if a file or directory is writable.\
    \ These are critical for verifying access before attempting file operations.\n\
    \n### Ex:file_exists and is_writable\n```php\nif (file_exists('example.txt') &&\
    \ is_writable('example.txt')) {\n    file_put_contents('example.txt', \"Appending\
    \ new content.\", FILE_APPEND);\n} else {\n    echo \"File does not exist or is\
    \ not writable.\";\n}\n```\nIf `'example.txt'` exists and is writable, it appends\
    \ \"Appending new content.\" to the file. Otherwise, it outputs \"File does not\
    \ exist or is not writable.\"\n\nThis code snippet demonstrates a practical use\
    \ case involving file manipulation while ensuring that the operations are safe.\
    \ The `file_exists('example.txt')` function checks if the specified file or directory\
    \ exists, which is crucial to avoid errors in attempting to access or modify a\
    \ non-existent file. The `is_writable('example.txt')` function checks if the file\
    \ is writable. This is an important security measure, ensuring that your script\
    \ only attempts to write to files that have the appropriate permissions set, thereby\
    \ avoiding potential permission errors. The `file_put_contents('example.txt',\
    \ \"Appending new content.\", FILE_APPEND)` line attempts to append text to the\
    \ existing content of the file. The `FILE_APPEND` flag is used to indicate that\
    \ the new content should be appended to the end of the file rather than overwriting\
    \ the existing content. This is particularly useful for logging or adding data\
    \ to a file over time without losing the original content. Together, these functions\
    \ form a robust method for safely handling file operations, ensuring that files\
    \ exist and are accessible before performing read or write operations.\n"
