    _CodeSniffer       \\# Install PHP\\_CodeSniffer using Composer       composer\
    \ require \"squizlabs/php\\_codesniffer=\\*\"       \\# Check coding standards\
    \ in a specific file       ./vendor/bin/phpcs /path/to/your/file.php    ––––––––\
    \    Output will display a list of coding standard violations (if any) found in\
