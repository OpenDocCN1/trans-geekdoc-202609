  trans: "\n\n# 29. GuzzleHttp\n\nGuzzleHttp 是一个 PHP HTTP 客户端，可以轻松发送 HTTP 请求并与 Web\
    \ 服务进行简单的集成。\n\n### 示例:GuzzleHttp\n```php\n// 通过 Composer 安装 GuzzleHttp\ncomposer\
    \ require guzzlehttp/guzzle:~6.0\n\n// 使用 GuzzleHttp 发送 GET 请求的示例 PHP 代码\nrequire\
    \ 'vendor/autoload.php';\n$client = new \\GuzzleHttp\\Client();\n$response = $client->request('GET',\
    \ 'https://api.github.com/repos/guzzle/guzzle');\necho $response->getStatusCode();\
    \ // 200\necho $response->getBody();\n```\n\n### 200\n来自 GitHub API 关于 Guzzle\
    \ 仓库的响应体。\n\n在本文示例中，我们首先使用 Composer（PHP 的依赖管理器）安装 GuzzleHttp。命令 `composer require\
    \ guzzlehttp/guzzle:~6.0` 将 `GuzzleHttp` 添加到我们的项目中，具体版本为 6 版或更高版本。\n\nPHP 代码从加载\
    \ Composer 生成的自动加载脚本开始，这确保了当我们在使用 `GuzzleHttp` 类时会自动加载它们。然后，我们创建 `GuzzleHttp\\\
    Client` 类的一个新实例，这是用于发送 HTTP 请求的主类。\n\n`$client->request('GET', 'https://api.github.com/repos/guzzle/guzzle')`\
    \ 这一行向 GitHub API 发送 GET 请求，获取有关 Guzzle 仓库的信息。`GuzzleHttp` 使 HTTP 请求和响应变得简单，它抽象了底层的\
    \ `curl` 命令和其他细节。\n\n响应对象上的 `getStatusCode()` 方法返回响应的 HTTP 状态码，对于成功请求，状态值为 200。`getBody()`\
    \ 方法返回响应体，在这种情况下，它将包含 JSON 格式的 Guzzle 仓库详细信息。\n\n此示例演示了如何使用 `GuzzleHttp` 进行简单的\
    \ HTTP 请求、处理响应以及访问响应的状态码和正文。`GuzzleHttp` 功能强大，支持广泛的 HTTP 客户端功能，包括异步请求、中间件等，使其成为处理\
    \ Web 服务的 PHP 开发人员的一项强大工具。\n\n# 30. PHPMailer\n\nPHPMailer 是一个 PHP 的邮件创建和传输类，支持\
    \ SMTP 和其他邮件发送方式。\n\n### 示例:PHPMailer\n```php\n// 通过 Composer 安装 PHPMailer\ncomposer\
    \ require phpmailer/phpmailer\n\n// 使用 PHPMailer 发送邮件的示例 PHP 代码\nrequire 'vendor/autoload.php';\n\
    $mail = new PHPMailer\\PHPMailer\\PHPMailer();\n$mail->isSMTP();\n$mail->Host\
    \ = 'smtp.example.com';\n$mail->SMTPAuth = true;\n$mail->Username = 'your_email@example.com';\n\
    $mail->Password = 'your_password';\n$mail->SMTPSecure = 'tls';\n$mail->Port =\
    \ 587;\n$mail->setFrom('from@example.com', 'Mailer');\n$mail->addAddress('recipient@example.com',\
    \ 'Recipient Name');\n$mail->Subject = 'Here is the subject';\n$mail->Body = 'This\
    \ is the HTML message body in bold!';\n$mail->AltBody = 'This is the body in plain\
    \ text for non-HTML mail clients';\nif(!$mail->send()) {\n    echo 'Message could\
    \ not be sent.';\n    echo 'Mailer Error: ' . $mail->ErrorInfo;\n} else {\n  \
    \  echo 'Message has been sent';\n}\n```\n\n### 邮件已发送\n此示例演示了 `PHPMailer` 的使用，这是一个用于从\
    \ PHP 脚本发送邮件的强大功能全库。首先，我们使用命令 `composer require phpmailer/phpmailer` 安装 PHPMailer，这会将库及其依赖下载到我们的项目中。\n\
    \n代码段展示了如何使用 `PHPMailer` 发送邮件。我们首先创建一个 `PHPMailer\\PHPMailer\\PHPMailer` 类的实例。然后，我们配置它使用\
    \ SMTP 发送邮件，这涉及指定 SMTP 服务器详情、身份验证凭据和加密协议（在此情况下为 TLS）。\n\n`setFrom` 方法指定发送者的邮箱地址和名称，而\
    \ `addAddress` 方法添加收件人。`Subject`、`Body` 和 `AltBody` 属性设置邮件内容。\n\n`send` 方法尝试发送邮件。如果成功，它返回\
    \ `true`，我们打印确认信息。如果没有成功，它返回 `false`，我们打印错误消息。此示例突出了 PHPMailer 简化邮件发送的能力。\n\n\
    # 31. Aura.Sql\n\nAura.Sql 是 PDO 类的扩展，为数据库交互提供了高级功能，如懒性连接、数组引用和性能分析器。它的目的是增强 PDO\
    \ 的用法。\n\n### 示例:Aura.Sql\n```php\n<?php\nrequire 'vendor/autoload.php';\n// 为\
    \ MySQL 创建一个新的 Aura.Sql 实例\n$pdo = new Aura\\Sql\\ExtendedPdo('mysql:host=localhost;dbname=test',\
    \ 'username', 'password');\n// 使用数组引用的查询\n$query = \"SELECT * FROM users WHERE\
    \ id IN (:user_ids)\";\n$result = $pdo->fetchAll($query, ['user_ids' => [1, 2,\
    \ 3]]);\necho json_encode($result);\n?>\n```\n\n### \"users\" 表中 ID 为 1, 2 和 3\
    \ 的用户的 JSON 表达。\n在上面的示例中，我们首先引入 `vendor/autoload.php` 文件（由 Composer 生成），以自动加载我们的依赖项。然后，我们使用数据库连接详情实例化一个\
    \ `ExtendedPdo` 对象。`Aura.Sql` 扩展了 PHP 原生的 `PDO` 类，在保持 PDO 简单性的同时增加了更多功能。\n\n`fetchAll`\
    \ 方法用于执行查询并检索所有匹配行。查询包含一个占位符 `:user_ids`，它是我们要选择的用户 ID 数组。`Aura.Sql\\ExtendedPdo`\
    \ 类允许我们直接为查询中的占位符传递数组，它将处理数组的转换并转换为适用于 SQL 执行的字符串。此功能对于需要根据值列表过滤结果的查询特别有用，避免了手动在\
    \ SQL 字符串中拼接和转义数组值。\n\n最后，我们使用 `json_encode` 将结果集转换为 JSON 字符串进行显示。\n\n"
- fmt: "\n# 32. League\\ColorExtractor\n\n`League\\ColorExtractor` is a PHP library\
    \ designed to extract colors from images. It can analyze images and extract the\
    \ most used colors, allowing developers to create color palettes or perform image\
    \ analysis for theming, indexing, or design purposes.\n\nEx:League\\ColorExtractor\n\
    ```php\n<?php\nrequire 'vendor/autoload.php';\nuse League\\ColorExtractor\\ColorExtractor;\n\
    use League\\ColorExtractor\\Palette;\n// Load an image from a file.\n$palette\
    \ = Palette::fromFilename('path/to/image.jpg');\n// Create a color extractor and\
    \ extract the 3 most used colors.\n$extractor = new ColorExtractor($palette);\n\
    $colors = $extractor->extract(3);\nforeach ($colors as $color) {\n    echo ColorExtractor::fromIntToHex($color)\
    \ . \"\\n\";\n}\n?>\n```\n\nHexadecimal values of the three most used colors in\
    \ the image.\n\nThis code snippet demonstrates how to use the `League\\ColorExtractor`\
    \ library to analyze an image and extract the most prevalent colors. The process\
    \ involves several steps:\n\n- **Autoload Dependencies**: We begin by loading\
    \ the necessary library files using Composer's autoload mechanism. Composer is\
    \ a dependency manager for PHP, which automates the process of installing, updating,\
    \ and loading libraries.\n- **Image Analysis**: We utilize `Palette::fromFilename`\
    \ to create a palette from an image file. The palette represents a collection\
    \ of colors derived from the image. This step involves analyzing the image file\
    \ and identifying the colors present in it.\n- **Color Extraction**: With the\
    \ palette prepared, we instantiate `ColorExtractor` by passing the palette to\
    \ its constructor. We then call `extract`, specifying the number of colors we\
    \ wish to extract - in this case, three. The `extract` method analyzes the palette\
    \ and identifies the most prominent colors based on their usage within the image.\n\
    - **Color Output**: For each color extracted, we convert it from an integer representation\
    \ to a hexadecimal color code using `ColorExtractor::fromIntToHex`. This makes\
    \ the colors easier to understand and use in web or graphic design. The loop iterates\
    \ through the extracted colors, printing their hexadecimal codes.\n\nThe `League\\\
    ColorExtractor` library is particularly useful for creating dynamic themes based\
    \ on images, generating color palettes for design projects, or categorizing images\
    \ based on their dominant colors.\n\n# 33. Swoole\n\n`Swoole` is a scalable, concurrent\
    \ networking communication framework for PHP. It allows developers to write asynchronous,\
    \ parallel, and high-performance code to build web servers, microservices, and\
    \ websocket servers.\n\nEx:Swoole\n```php\n<?php\n// Simple HTTP server using\
    \ Swoole\n$http = new Swoole\\Http\\Server(\"127.0.0.1\", 9501);\n$http->on(\"\
    start\", function ($server) {\n    echo \"Swoole http server is started at http://127.0.0.1:9501\\\
    n\";\n});\n$http->on(\"request\", function ($request, $response) {\n    $response->header(\"\
    Content-Type\", \"text/plain\");\n    $response->end(\"Hello World\\n\");\n});\n\
    $http->start();\n?>\n```\n\nWhen you run this youll see \"Swoole http server is\
    \ started at http://127.0.0.1:9501\" in your terminal. Visiting `http://127.0.0.1:9501`\
    \ in a web browser will display \"Hello World\".\n\nThis script creates a simple\
    \ HTTP server using `Swoole`. The `Swoole\\Http\\Server` object is instantiated\
    \ with the IP address and port number where the server will listen. The `on` method\
    \ is used to define callbacks for different events: `\"start\"` is triggered when\
    \ the server starts, and `\"request\"` is triggered for each incoming HTTP request.\
    \ The request handler sets the `Content-Type` header to `text/plain` and responds\
    \ with `Hello World`. To execute this script, you need Swoole extension installed\
    \ and enabled in your PHP.\n\n# 34. ReactPHP Promise\n\nReactPHP's `Promise` component\
    \ provides a robust implementation of promises in PHP. It is used for asynchronous\
    \ programming, allowing developers to handle asynchronous operations and their\
    \ resulting values or errors.\n\nEx:ReactPHP Promise\n```php\n<?php\nrequire 'vendor/autoload.php';\n\
    $promise = new React\\Promise\\Promise(function ($resolve, $reject) {\n    //\
    \ Simulate an asynchronous operation with a timer\n    $timer = mt_rand(1, 3);\
    \ // Random timer value\n    sleep($timer); // Simulating long-running task\n\
    \    if ($timer <= 2) {\n        $resolve(\"Success after {$timer} seconds.\"\
    );\n    } else {\n        $reject(new Exception(\"Failed after {$timer} seconds.\"\
    ));\n    }\n});\n$promise->then(\n    function ($value) {\n        echo \"Fulfilled:\
    \ \" . $value . PHP_EOL;\n    },\n    function (Exception $e) {\n        echo\
    \ \"Rejected: \" . $e->getMessage() . PHP_EOL;\n    }\n);\n?>\n```\n\nThe script\
    \ will output either \"Fulfilled: Success after X seconds.\" if the random timer\
    \ is 2 seconds or less, or \"Rejected: Failed after 3 seconds.\" if the timer\
    \ is 3 seconds.\n\nThis example illustrates how to use ReactPHP's `Promise` component\
    \ to handle asynchronous operations. A new promise is created with a callback\
    \ that contains an asynchronous operation, simulated here using `sleep` for a\
    \ random duration. The promise is resolved if the operation completes within 2\
    \ seconds, or rejected if it takes longer. The `then` method is used to specify\
    \ what should happen when the promise is fulfilled or rejected, with the first\
    \ callback handling success and the second handling failure. This approach to\
    \ asynchronous programming allows for more readable and maintainable code, especially\
    \ when dealing with operations that may not complete immediately, such as network\
    \ requests or file I/O. To run this example, you need to install ReactPHP's Promise\
    \ component via Composer.\n\n# 35. Carbon Fields\n\n`Carbon Fields` is a library\
    \ that allows developers to easily create custom fields for post types, taxonomy\
    \ terms, themes, and user profiles in WordPress. It provides a developer-friendly\
    \ API for adding fields like text, textarea, rich text, image, file, map, and\
    \ many others.\n\nEx:Carbon Fields\n```php\n<?php\nuse CarbonFields\\Container;\n\
    use CarbonFields\\Field;\nadd_action( 'carbon_fields_register_fields', 'crb_attach_theme_options'\
    \ );\nfunction crb_attach_theme_options() {\n    Container::make( 'theme_options',\
    \ 'Theme Options' )\n        ->add_fields( array(\n            Field::make( 'text',\
    \ 'crb_text', 'Text Field' ),\n            Field::make( 'image', 'crb_image',\
    \ 'Image Field' )\n        ) );\n}\n?>\n```\n\nThis code adds a new page under\
    \ the \"Appearance\" menu in WordPress admin with the title \"Theme Options\"\
    . In this page, there are two custom fields: a text field and an image upload\
    \ field.\n"
