  trans: "\n\n# 第 3 章：外部库\n\n## 1. Guzzle\nGuzzle 是一个 PHP HTTP 客户端，它可以轻松发送 HTTP 请求，并与\
    \ Web 服务无缝集成。\n\n### 示例：Guzzle\n```php\n<?php\nrequire 'vendor/autoload.php';\n\
    $client = new \\GuzzleHttp\\Client();\n$response = $client->request('GET', 'https://api.github.com/repos/guzzle/guzzle');\n\
    echo $response->getStatusCode(); // HTTP 状态码\necho $response->getBody(); // 响应体\n\
    ```\n– 200\n// 这里将显示来自 GitHub 关于 Guzzle 仓库的 JSON  此示例演示了如何使用 Guzzle 向 GitHub API\
    \ 发送 GET 请求以获取 Guzzle 仓库本身的信息。首先，你需要在你的项目中引入 Guzzle，这通常是通过使用 Composer（PHP 的依赖管理器）完成的。你可以在项目目录中运行\
    \ `composer require guzzlehttp/guzzle` 将 Guzzle 添加到你的项目中。\n\n代码开头引入了 Composer\
    \ 的自动加载文件，这使得你无需手动引入即可使用通过 Composer 安装的 Guzzle 以及其他库。然后，它创建了一个 Guzzle HTTP 客户端的新实例。通过该客户端，我们向指定的\
    \ URL 发送 GET 请求，在此例中是 GitHub 上 Guzzle 仓库的 API 端点。\n\n请求方法返回一个响应对象，我们可以通过 `$response->getStatusCode()`\
    \ 提取 HTTP 状态码，通过 `$response->getBody()` 提取响应体。在实际场景中，你可能会解析 JSON 体以提取特定的信息。\n\n\
    此示例提供了一种在 PHP 中开始使用外部 API 的直观方法，演示了 Guzzle 如何抽象发送 HTTP 请求和处理响应时涉及的大部分复杂度。\n\n\
    ## 2. PHPMailer\nPHPMailer 是一个用于 PHP 的邮件创建和传输类，支持 SMTP 以及许多其他“邮件发送”功能。\n\n###\
    \ 示例：PHPMailer\n```php\n<?php\nrequire 'vendor/autoload.php';\n$mail = new PHPMailer\\\
    PHPMailer\\PHPMailer();\n$mail->isSMTP(); // 设置邮件器使用 SMTP\n$mail->Host = 'smtp.example.com';\
    \ // 指定主备用 SMTP 服务器\n$mail->SMTPAuth = true; // 启用 SMTP 认证\n$mail->Username =\
    \ 'user@example.com'; // SMTP 用户\n$mail->Password = 'secret'; // SMTP 密码\n$mail->SMTPSecure\
    \ = 'tls'; // 启用 TLS 加密，也接受 `ssl`\n$mail->Port = 587; // 连接的 TCP 端口\n$mail->setFrom('from@example.com',\
    \ 'Mailer');\n$mail->addAddress('joe@example.net', 'Joe User'); // 添加收件人\n$mail->Subject\
    \ = '这是主题';\n$mail->Body = '这是邮件正文';\n$mail->isHTML(true); // 设置邮件格式为 HTML\nif(!$mail->send())\
    \ {\n    echo '邮件已发送';\n} else {\n    echo '邮件发送失败。邮件器错误：'.$mail->ErrorInfo;\n\
    }\n?>\n```\n此示例展示了如何使用 PHPMailer 发送邮件，PHPMailer 是一个简化邮件流程的流行库。在使用 PHPMailer 之前，你需要将其引入项目，最好使用\
    \ Composer。脚本开头引入了 phpmailerer 的 Composer 自动加载文件，从而使你能够使用 PHPMailer。然后它创建了一个 PHPMailer\
    \ 实例并将其设置为使用 SMTP（简单传输协议）。指定了 SMTP 详情，包括主机、SMTP 认证、用户名、密码、加密方法（TLS 或 ssl）和端口。配置好\
    \ SMTP 设置后，脚本设置了发件人和收件人地址、主题和正文。正文可以是纯文本也可以是 HTML，允许包含更多样化的内容。最后，脚本尝试使用 `send`\
    \ 方法发送邮件。如果发送失败，它会打印错误信息。\n\n## 3. Intervention Image\nIntervention Image 是一个\
    \ PHP 图像处理处理库，提供了一种更简单、更有表现力的方式来创建、编辑和组合图像。它支持各种图像操作，如缩放、裁剪、旋转。\n\n### 示例：Intervention\
    \ Image\n```php\n<?php\nrequire 'vendor/autoload.php';\nuse Intervention\\Image\\\
    ManagerStatic as Image;\n$image = Image::make('public/foo.jpg')->resize(300, 200);\n\
    echo $image->response('jpg');\n?>\n```\n这段代码将 `public/foo.jpg` 图像调整为 300x200 像素，并以\
    \ JPEG 格式直接输出到浏览器。\n\n在此示例中，我们首先通过 `require 'vendor/autoload.php'` 命令加载 Intervention\
    \ Image 包中的必要类。该命令对于通过 Composer 管理依赖的 PHP 项目至关重要，因为它会自动加载所有所需的库，无需在每个脚本中手动引入。然后，我们通过别名\
    \ `Image` 使用 `ManagerStatic` 类以静态方式执行图像操作，这意味着你不需要实例化即可使用其方法。`make` 方法从指定的源（在此例中为\
    \ `public/foo.jpg`）初始化图像对象。`resize` 方法用于将图像尺寸更改为 300x200 像素。当你标准化应用程序中的图像大小时，这是一个非常常见的操作，例如让所有用户上传的头像具有相同的大小。最后，`response`\
    \ 方法将图像直接输出到 Web 浏览器。'jpg' 参数指定了输出的格式。这一功能对于在 Web 应用程序中动态生成图像而无需保存到服务器上特别有用。总而言，Intervention\
    \ Image 库简化了 PHP 图像处理的过程，使得原本可能需要大量 GD 或 Imagick 扩展知识的任务变得更加易上手。\n\n"
- fmt: "\n# 4. PHP dotenv\n\n`PHP dotenv` is a library that loads environment variables\
    \ from a `.env` file into the PHP environment. It is useful for managing application\
    \ settings separate from code, which enhances security and flexibility across\
    \ different deployment environments.\n\n### Ex:PHP dotenv\n```php\n<?php\nrequire\
    \ 'vendor/autoload.php';\n$dotenv = Dotenv\\Dotenv::createImmutable(__DIR__);\n\
    $dotenv->load();\necho 'Database password: ' . $_ENV['DB_PASSWORD'];\n?>\n```\n\
    ––––––––– \n\nThis example displays the database password stored in the `.env`\
    \ file.\n\nThis example begins with the inclusion of the Composer autoload file\
    \ through `require 'vendor/autoload.php';`. Composer is a tool for dependency\
    \ management in PHP, allowing you to declare the libraries your project depends\
    \ on and it will manage (install/update) them for you.\n\nThe `Dotenv\\Dotenv::createImmutable(__DIR__)`\
    \ method creates an immutable dotenv object, pointing to the directory where the\
    \ `.env` file is located. The `__DIR__` magic constant provides the absolute path\
    \ to the directory of the current file. Making the dotenv object \"immutable\"\
    \ means that once an environment variable is set, it cannot be overwritten. This\
    \ is particularly important for maintaining the integrity and security of environment\
    \ variables throughout the application's execution.\n\nThe `load` method reads\
    \ the `.env` file and loads the environment variables into PHP's `$_ENV` superglobal.\
    \ This makes it possible to access these variables easily using the global `$_ENV`\
    \ array, as demonstrated when echoing the database password with `echo 'Database\
    \ password: ' . $_ENV['DB_PASSWORD'];`.\n\nThe `.env` file typically contains\
    \ sensitive information that you wouldn't want to hard-code into your application,\
    \ such as database passwords, API keys, and application secrets. By separating\
    \ these details from the codebase and loading them dynamically, PHP dotenv helps\
    \ in keeping your application's configuration secure and flexible, making it easier\
    \ to change settings between different deployment environments (e.g., development,\
    \ testing, and production) without altering the code.\n\n# 5. Slim Framework\n\
    \n`Slim` is a PHP micro framework that helps you quickly write simple yet powerful\
    \ web applications and APIs. It comes with a router, middleware support, and is\
    \ designed to be lightweight and easily understandable, making it ideal for projects\
    \ that need a minimalistic setup.\n\n### Ex:Slim Framework\n```php\n<?php\nuse\
    \ Psr\\Http\\Message\\ResponseInterface as Response;\nuse Psr\\Http\\Message\\\
    ServerRequestInterface as Request;\nuse Slim\\Factory\\AppFactory;\nrequire __DIR__\
    \ . '/../vendor/autoload.php';\n$app = AppFactory::create();\n$app->get('/hello/{name}',\
    \ function (Request $request, Response $response, $args) {\n    $name = $args['name'];\n\
    \    $response->getBody()->write(\"Hello, $name\");\n    return $response;\n});\n\
    $app->run();\n?>\n```\n––––––––– \n\nVisiting `/hello/John` on your server would\
    \ display: Hello, John\n\nThis example demonstrates setting up a basic web server\
    \ with Slim Framework. The `AppFactory::create()` method initializes the Slim\
    \ app. The `$app->get` method defines a route that listens for GET requests on\
    \ `/hello/{name}`. When this route is accessed, Slim executes the associated closure\
    \ function, which takes the `{name}` parameter from the URL, incorporates it into\
    \ the greeting message, and writes this message to the response body. Finally,\
    \ `$app->run()` starts the Slim application. This setup is ideal for building\
    \ APIs or microservices with PHP, offering a straightforward path for development\
    \ with minimal overhead.\n\n# 6. Laminas\n\n`Laminas`, formerly known as Zend\
    \ Framework, is a collection of professional PHP packages that can be used to\
    \ develop web applications and services. It includes components for tasks like\
    \ input filtering, form validation, and more, providing a robust set of tools\
    \ for complex applications.\n\n### Ex:Laminas\n```php\n<?php\nuse Laminas\\Validator\\\
    StringLength;\nuse Laminas\\I18n\\Validator\\Alnum;\nrequire 'vendor/autoload.php';\n\
    // String length validator\n$validator = new StringLength(['min' => 2, 'max' =>\
    \ 10]);\nif ($validator->isValid('example')) {\n    echo \"The string 'example'\
    \ is between 2 and 10 characters long\";\n} else {\n    echo \"The string 'example'\
    \ is not between 2 and 10 characters long\";\n}\n// Alphanumeric validator\n$alnumValidator\
    \ = new Alnum();\nif ($alnumValidator->isValid('example123')) {\n    echo \"\\\
    nThe string 'example123' is alphanumeric\";\n} else {\n    echo \"\\nThe string\
    \ 'example123' is not alphanumeric\";\n}\n?>\n```\n––––––––– \n\nThe string 'example'\
    \ is between 2 and 10 characters long\nThe string 'example123' is alphanumeric\n\
    ––––––––– \n\nIn this example, we utilize `StringLength` to check if a string\
    \ is within a specified range. If the string meets the criteria, a message is\
    \ printed. Next, we create `Alnum` (alphanumeric) to check if a string contains\
    \ only letters and numbers.\n\n# 7. Twig\n\n`Twig` is a modern template engine\
    \ for PHP. It is flexible, fast, and secure. It allows the separation of logic\
    \ and presentation, making web pages easier to write.–––––––––\n\n### Ex:Twig\n\
    ```php\n<?php\n// Load Twig's autoload file\nrequire_once '/path/to/vendor/autoload.php';\n\
    // Define the loader for the template files\n$loader = new \\Twig\\Loader\\FilesystemLoader('/path/to/templates');\n\
    // Initialize Twig environment\n$twig = new \\Twig\\Environment($loader);\n//\
    \ Render a template, passing data to the template\necho $twig->render('index.twig',\
    \ ['name' => 'John Doe']);\n?>\n```\n––––––––– \n\n`index.twig` contains \"Hello,\
    \ {{ name }}!\"—> Hello, John\n––––––––– \n\nLoading Twig: The code begins by\
    \ loading Twig's autoload file, which is necessary for Twig to operate. This file\
    \ is typically generated by Composer.Template Loader: Next, it sets up a loader\
    \ (`FilesystemLoader`) that tells Twig where to look for templates. The path you\
    \ provide should point to the directory where your Twig template files (`.twig`)\
    \ are located.Initializing Twig Environment: With the loader set up, the Twig\
    \ environment is initialized. This environment is the central object in Twig,\
    \ from which all template rendering is controlled.Rendering Templates: Finally,\
    \ the code renders a specific template file (`index.twig`) by calling `render`\
    \ on the Twig environment. This method takes two arguments: the name of the template\
    \ file and an associative array of data to be passed to the template. In the template,\
    \ you can access this data using the syntax `{{ variable_name }}`.Output: The\
    \ rendered HTML is then output with `echo`. In this example, if the index.twig\
    \ template contains Hello, {{ name }}!, and `['name' => 'John Doe']` is passed\
    \ to it, the output will be \"Hello, John!\".This process simplifies generating\
    \ dynamic content, as the business logic is handled in PHP, and the presentation\
    \ is handled in separate Twig template files, making the codebase cleaner and\
    \ more maintainable.\n"
