  trans: "\n\n# 70. PHP-DI\n\n`PHP-DI` 是一个为 PHP 应用程序设计的依赖注入容器。它允许通过配置管理类依赖关系，使得实例化和管理对象变得更加容易，从而提高代码的可维护性。\n\
    \n### 示例:PHP-DI\n```php\n// 使用 PHP-DI 注入依赖的示例\nuse DI\\ContainerBuilder;\nclass\
    \ Mailer\n{\n}\nclass UserController\n{\n    private $mailer;\n    public function\
    \ __construct(Mailer $mailer)\n    {\n        $this->mailer = $mailer;\n    }\n\
    }\n$containerBuilder = new ContainerBuilder();\n$container = $containerBuilder->build();\n\
    $container->set('Mailer', new Mailer());\n$userController = $container->get('UserController');\n\
    ```\n\n注入了 `Mailer` 依赖的 `UserController` 实例。\n\n此示例展示了了 `PHP-DI`，这是一个 PHP 的依赖注入（DI）容器，它可以方便类依赖关系的管理。以下是详细步骤：\n\
    \n- **定义类**：定义了两个类，`Mailer` 和 `UserController`。`UserController` 依赖 `Mailer` 来发送邮件，因此\
    \ `Mailer` 是 `UserController` 的依赖。\n- **使用 PHP-DI ContainerBuilder**：我们创建了 `ContainerBuilder`\
    \ 的新实例并构建容器。容器负责管理依赖关系和对象的实例化。\n- **注册服务**：我们显式地向容器注册了 `Mailer` 类。此注册告诉 `PHP-DI`\
    \ 在任何需要时该如何实例化 `Mailer`。\n- **依赖注入**：当我们向容器请求 `UserController` 实例时，`PHP-DI` 会自动将\
    \ `Mailer` 依赖注入其中。这是因为我们在 `UserController` 的构造函数中对 `Mailer` 进行了类型提示，`PHP-DI` 识别了这一需求。\n\
    - **优势**：使用像 `PHP-DI` 这样的 DI 容器简化了对象的创建和管理，特别是对于复杂的依赖关系。通过将对象的实例化与其使用解耦，它促进了代码的模块化和测试性。\n\
    - **实例化与使用**：示例的最后一步是实际使用 `UserController`。如所示，通过 `PHP-DI` 获取一个已准备就绪且所有依赖都已正确注入的实例是非常简单的。\n\
    \n这个简化的示例说明了使用 `PHP-DI` 进行依赖注入的核心概念，强调了 DI 容器如何帮助构建应用程序以获得更好的可维护性和可测试性。\n\n# 71.\
    \ Respect\\Validation\n\n`Respect\\Validation` 是一个强大且功能齐全的 PHP 验证库，用于简化应用程序中的数据验证。它提供了大量的预构建验证器以及创建自定义规则的能力，支持流式接口以实现简洁、可读的语法。\n\
    \n### 示例:Respect\\Validation\n```php\nrequire 'vendor/autoload.php';\nuse Respect\\\
    Validation\\Validator as v;\n$usernameValidator = v::alnum()->noWhitespace()->length(1,\
    \ 15);\n$emailValidator = v::email();\ntry {\n    $usernameValidator->assert('myusername');\n\
    \    $emailValidator->assert('user@example.com');\n    echo \"Validation passed!\"\
    ;\n} catch (\\Respect\\Validation\\Exceptions\\ValidationException $exception)\
    \ {\n    echo $exception->getMessage();\n}\n```\n\n验证通过！\n\n在此示例中，我们正在使用 `Respect\\\
    Validation` 库来验证用户名和电子邮件。我们首先导入该库，并为这两个字段创建验证器。用户名必须是字母数字，不包含空格，且长度在 1 到 15 字符之间。电子邮件必须是有效的电子邮件格式。\n\
    \n- `require 'vendor/autoload.php';`：此行包含了 Composer 自动加载文件，使得我们的脚本可以使用使用 `Respect\\\
    Validation` 库。\n- `use Respect\\Validation\\Validator as v;`：从库中导入 `Validator`\
    \ 类并将其别名为 `v` 以于方便。\n- `$usernameValidator = v::alnum()->noWhitespace()->length(1,\
    \ 15);`：为用户名创建一个验证链：它必须是字母数字（`alnum()`）、不包含空格（`noWhitespace()`）、且长度在 1 到 15 字符之间（`length(1,\
    \ 15)`）。\n- `$emailValidator = v::email();`：为电子邮件创建一个验证器，仅检查输入是否为有效的电子邮件地址。\n\
    - `try` 块尝试验证用户名和电子邮件的有效性。如果两个断言都通过，则打印“Validation passed!”。\n- 如果任何验证失败，将捕获 `ValidationException`\
    \ 并打印错误信息。\n\n# 72. PHP League's OAuth2 Client\n\n`PHP League's OAuth2 Client`\
    \ 是一个提供了灵活且可扩展的方式将 OAuth 2.0 客户端功能集成到 PHP 应用程序中的包。它开箱支持多个 OAuth 2.0 服务提供者，并允许自定义提供实现。\n\
    \n### 示例:PHP League's OAuth2 Client\n```php\nrequire 'vendor/autoload.php';\n\
    $provider = new League\\OAuth2\\Client\\Provider\\GenericProvider([\n    'clientId'\
    \ => 'demoapp',\n    'clientSecret' => 'demosecret',\n    'redirectUri' => 'http://example.com/your-redirect-url',\n\
    \    'urlAuthorize' => 'http://brentertainment.com/oauth2/lockdin/authorize',\n\
    \    'urlAccessToken' => 'http://brentertainment.com/oauth2/lockdin/token',\n\
    \    'urlResourceDetails' => 'http://brentertainment.com/oauth2/lockdin/resource'\n\
    ]);\n\ntry {\n    // 获取授权码\n    $authUrl = $provider->getAuthorizationUrl();\n\
    \    $_SESSION['oauth2state'] = $provider->getState();\n    echo \"Authorization\
    \ URL: \" . $authUrl;\n} catch (\\League\\OAuth2\\Client\\Provider\\Exception\\\
    IdentityProviderException $e) {\n    exit('Failed to get code: ' . $e->getMessage());\n\
    }\n```\n\n授权 URL: http://brentertainment.com/oauth2/lockdin/authorize?client_id=demoapp&state=XYZ&response_type=code\n\
    \n在此代码段中，我们正在使用 PHP League's OAuth2 Client 库来发起 OAuth 2.0 授权请求。此示例具体使用了通用提供者，可以适配任何\
    \ OAuth 2.0 服务。\n\n- `require 'vendor/autoload.php';`：此行包含了 Composer 自动加载文件，使得我们的脚本可以使用\
    \ OAuth2 Client 库。\n- `$provider = new League\\OAuth2\\Client\\Provider\\GenericProvider([...]);`：我们创建一个\
    \ `GenericProvider` 实例，并包含客户端 ID、客户端密钥、重定向 URI 以及授权、令牌交换和资源所有者 URL 的配置数组。\n- 在提供者实例上调用\
    \ `getAuthorizationUrl()` 以生成用户重定向以授权应用程序的 URL。\n- 我们将提供者生成的状态存储在会话中，以防止 CSRF\
    \ 攻击。\n- 随后打印授权 URL，它包含了客户端 ID 和状态参数。这就是你应该重定向用户以开始 OAuth 2.0 授权流的 URL。\n\n"
- fmt: "\n# 73. PsySH\n\nPsySH is an interactive shell for PHP, providing a developer\
    \ console for debugging and interactive development. It allows execution of PHP\
    \ code in real-time and includes features like variable inspection, backtrace\
    \ browsing, and integrates with various frameworks for enhanced debugging capabilities.\n\
    \n### Ex:PsySH\n\n// To use PsySH, you would typically enter the PsySH shell by\
    \ executing it from the command line:\n```bash\n// $ psysh\n// Then, within the\
    \ PsySH shell, you can execute PHP code directly. For example:\n// Defining a\
    \ new variable\n$exampleVar = 'Hello, PsySH!';\n// Dumping the variable to inspect\
    \ its value\ndump($exampleVar);\n```\n\nThe `dump` command outputs the value of\
    \ `$exampleVar`, displaying something like:\n`\"Hello, PsySH!\"`\n\nTo get started\
    \ with PsySH, you need to install it via `Composer`, PHP's dependency manager.\
    \ You can add it to your project by running `composer require psy/psysh`. After\
    \ installation, you can start the PsySH shell by typing `psysh` in your terminal.\
    \ This brings up an interactive PHP environment where you can test and debug your\
    \ code snippet by snippet. PsySH is particularly useful for exploring new libraries,\
    \ debugging complex problems, or simply testing out small pieces of PHP code without\
    \ the need to create a full script. Its ability to integrate with major PHP frameworks\
    \ makes it an indispensable tool for PHP developers looking to streamline their\
    \ debugging process. The example given demonstrates how you might use PsySH to\
    \ inspect variables, but its capabilities extend far beyond this, including running\
    \ entire functions, evaluating complex expressions, and much more.\n\n# 74. PHPStan\n\
    \nPHPStan is a static analysis tool for PHP that focuses on finding errors in\
    \ your code without actually running it. It can detect potential bugs and inconsistencies,\
    \ adhering to modern development practices to ensure code reliability and maintainability.\
    \ It supports various levels of analysis, from basic to strict, allowing developers\
    \ to gradually improve their code base.\n\n### Ex:PHPStan\n\n```bash\n// PHPStan\
    \ is typically run from the command line, analyzing your PHP files for potential\
    \ issues. Here's an example command:\n// $ vendor/bin/phpstan analyse src --level=max\n\
    // The command tells PHPStan to analyze the \"src\" directory of your project\
    \ at the maximum strictness level.\n// Since PHPStan runs from the command line,\
    \ here's a simplified PHP example that might raise an error when analyzed by PHPStan:\n\
    function addNumbers(int $a, int $b): int {\n    return $a + $b;\n}\necho addNumbers('5',\
    \ 10);\n```\n\nPHPStan would report a type mismatch error, indicating that a string\
    \ is passed where an integer was expected, highlighting the line:\n`Parameter\
    \ #1 $a of function addNumbers expects int, string given.`\n\nPHPStan is a tool\
    \ that helps improve the quality of your PHP code without having to execute it.\
    \ To use PHPStan, you first need to install it via `Composer` with the command\
    \ `composer require --dev phpstan/phpstan`. After installation, you can run it\
    \ against your project's PHP files as shown in the example. PHPStan checks your\
    \ code against a set of rules to identify potential issues, such as type mismatches,\
    \ undefined variables, and more. The level of strictness can be adjusted, making\
    \ it possible to start with basic checks and progress to more thorough analyses\
    \ as your project evolves. This flexibility makes PHPStan an excellent choice\
    \ for projects at any stage of development, from legacy codebases undergoing modernization\
    \ to brand-new projects aiming for high-quality code from the start. The example\
    \ provided demonstrates how PHPStan can catch common errors, such as type mismatches,\
    \ that might not be immediately evident to the developer, especially in dynamically\
    \ typed languages like PHP.\n\n# 75. SwiftMailer\n\nSwiftMailer is a library for\
    \ sending emails from PHP applications. It provides a flexible and elegant object-oriented\
    \ approach to sending emails with a multitude of features.\n\n### Ex:SwiftMailer\n\
    \n```php\n<?php\nrequire_once 'vendor/autoload.php';\n// Create the Transport\n\
    $transport = (new Swift_SmtpTransport('smtp.example.com', 25))\n    ->setUsername('your_username')\n\
    \    ->setPassword('your_password');\n// Create the Mailer using your created\
    \ Transport\n$mailer = new Swift_Mailer($transport);\n// Create a message\n$message\
    \ = (new Swift_Message('Wonderful Subject'))\n    ->setFrom(['john@doe.com' =>\
    \ 'John Doe'])\n    ->setTo(['receiver@domain.org', 'other@domain.org' => 'A name'])\n\
    \    ->setBody('Here is the message itself');\n// Send the message\n$result =\
    \ $mailer->send($message);\n?>\n```\n\nThe result will be an integer indicating\
    \ the number of successful recipients. If everything is set up correctly, you'll\
    \ see a positive number. This example showcases how to send an email using SwiftMailer.\
    \ First, you include the SwiftMailer library with `require_once 'vendor/autoload.php';`.\
    \ Next, you create a `transport` that SwiftMailer will use to send the email.\
    \ In this case, we're using SMTP with a fictional server `smtp.example.com`, and\
    \ you provide your SMTP credentials. After setting up the transport, you create\
    \ a `mailer` object that is responsible for sending the email. Then, you construct\
    \ the email message itself using the `Swift_Message` class. This includes setting\
    \ the sender and receiver addresses, the subject, and the body of the email. Finally,\
    \ you send the email using the `send` method on the `mailer` object. The `send`\
    \ method returns the number of successful recipients. If the setup is correct\
    \ and the SMTP server accepts the email, this should be a positive number, indicating\
    \ the email was sent successfully. SwiftMailer handles many complexities of email\
    \ sending, such as MIME types and headers, making it a robust solution for PHP\
    \ applications.\n"
