  trans: "\n\n# 14. Ratchet\n\nRatchet 是一个 PHP WebSocket 库，用于在客户端和服务器之间提供实时双向消息。它设计用于利用\
    \ WebSockets 构建交互式应用程序，允许开发者构建聊天应用程序、实时通知等。\n\n## 示例：Ratchet\n```php\nrequire\
    \ 'vendor/autoload.php';\nuse Ratchet\\Server\\IoServer;\nuse Ratchet\\Http\\\
    HttpServer;\nuse Ratchet\\WebSocket\\WsServer;\nuse MyApp\\Chat;\n$server = IoServer::factory(\n\
    \    new HttpServer(\n        new WsServer(\n            new Chat()\n        )\n\
    \    ),\n    8080\n);\n$server->run();\n```\n\n服务器启动并监听端口 8080 的 WebSocket 连接。这段代码片段提供了使用\
    \ Ratchet 搭建 WebSocket 服务器的基础基础设置。以下是关键组件的详细说明：\n\n- `require 'vendor/autoload.php';`\
    \ - 与之前一样，这包含了 Composer 的自动加载文件，用以自动加载所需的类。\n- `use` 语句从 `Ratchet` 库导入了必要的类。\n\
    - `new Chat()` - 这是用户自定义类的实例（通常位于 `MyApp\\Chat` 命名空间下），用于处理 WebSocket 消息。你需要定义这个类来管理连接、接收消息和发送响应。\n\
    - `IoServer::factory` 方法结合了 `HttpServer` 和 `WsServer`，创建一个在端口 8080 监听的 WebSocket\
    \ 服务器。`HttpServer` 用于处理建立 WebSocket 连接的初始 HTTP 升级请求。`WsServer` 处理 WebSocket 通信。\n\
    - `$server->run();` - 启动服务器，使其在指定的端口监听传入的连接。\n\n此示例展示了如何使用 Ratchet 设置基础的 WebSocket\
    \ 服务器，这可以作为构建实时聊天或游戏服务器等实时 Web 应用的基础。Ratchet 抽象了管理 WebSocket 连接的复杂性，让开发者能够专注于应用程序逻辑。\n\
    \n# 15. PHPUnit\n\nPHPUnit 是一个用于 PHP 的测试框架。它是 xUnit 单元测试框架架构的一个实例。\n\n## 示例：PHPUnit\n\
    ```php\n// 使用 PHPUnit 编写简单测试用例的示例\nuse PHPUnit\\Framework\\TestCase;\nclass StackTest\
    \ extends TestCase\n{\n    public function testPushAndPop()\n    {\n        $stack\
    \ = [];\n        $this->assertSame(0, count($stack));\n        array_push($stack,\
    \ 'foo');\n        $this->assertSame('foo', $stack[count($stack)-1]);\n      \
    \  $this->assertSame(1, count($stack));\n        $this->assertSame('foo', array_pop($stack));\n\
    \        $this->assertSame(0, count($stack));\n    }\n}\nphpunit StackTest\n```\n\
    \nOK (1 test, 3)\n\nPHPUnit 是一个帮助你为 PHP 代码编写和运行测试的工具。在提供的示例中，我们有一个简单的测试类 `StackTest`，它继承了\
    \ PHPUnit 的 `TestCase`。该类测试了两个基本操作：向栈中推入元素和从栈中弹出元素。\n\n我们首先创建一个空数组 `$stack` 来代表我们的栈。使用\
    \ `$this->assertSame`，我们检查栈的初始计数是否为 0。然后我们向栈中推入元素 `'foo'`，并检查栈顶部的元素是否为 `'foo'`\
    \ 以及栈的计数是否已变为 1。最后，我们从栈中弹出元素并检查栈是否再次为空。\n\n要运行此测试，你需要使用 `phpunit` 命令后跟测试文件的名称。结果显示测试成功通过，显示\
    \ \"OK\" 以及运行的测试次数和断言次数。PHPUnit 详细输出，有助于识别每个测试用例的成功或失败。\n\n# 16. Behat\n\nBehat\
    \ 是一个用于 PHP 的行为驱动开发 (BDD) 框架，它便于在不深入实现细节的情况下描述业务行为。\n\n## 示例：Behat\n```gherkin\n\
    # 简单的 Behat 特性示例\nFeature: List command\n  In order to see my tasks\n  As a user\n\
    \  I need to be able to list current tasks\n\n  Scenario: List tasks\n    Given\
    \ I have a task named \"Ratchet\"\n    And I have a task named \"PHPUnit\"\n \
    \   When I list all tasks\n    Then I should see \"Ratchet\"\n    And I should\
    \ see \"PHPUnit\"\n```\n```bash\nbehat\nfeatures/list.feature:6\nGiven I have\
    \ a task named \"Ratchet\" # FeatureContext::iHaveATaskNamed()\nAnd I have a task\
    \ named \"PHPUnit\"\nWhen I list all tasks\nThen I should see \"Ratchet\"\nAnd\
    \ I should see \"PHPUnit\"\n\n1 scenario (1 passed)\n4 steps (4 passed)\n```\n\
    \nBehat 围绕行为驱动开发 (BDD) 原则设计，允许你编写人类可读的场景来描述行为。这些故事随后可以针对你的应用程序进行自动测试。在示例中，我们有一个任务列表应用程序的特性文件（feature\
    \ file）。该特性描述了一个用户添加了任务并想要列出它们的场景。场景从上下文开始，设置初始条件。在这种情况下，是名为 \"Ratchet\" 和 \"\
    PHPUnit\" 的两个任务。接下来描述用户采取的操作：“当我列出所有任务时”。最后指出了预期结果：用户应该看到这两个任务。为了测试这种行为，Behat\
    \ 会运行场景的每个步骤，使用你在上下文文件中提供的定义来执行必要的操作和检查。输出显示了场景的每个步骤以及它们是通过还是失败，为你的应用程序行为提供即时反馈。Behat\
    \ 的方法鼓励开发者、测试人员和业务相关者之间的协作，确保每个人都能清晰理解应用程序的功能和目标。\n\n# 17. Carbon\n\nCarbon 是\
    \ DateTime 的简单 PHP API 扩展，提供了丰富的功能，可以轻松处理日期和时间。\n\n## 示例：Carbon\n```php\nrequire\
    \ 'vendor/autoload.php';\nuse Carbon\\Carbon;\nprintf(\"Right now is %s\", Carbon::now()->toDateTimeString());\n\
    ```\n\n现在是 12:34:56\n\n这段代码片段演示了如何在 PHP 中使用 Carbon 库打印当前日期和时间。首先，它包含了 Composer\
    \ 自动加载文件以便自动加载 Carbon 库。然后，它使用了 Carbon 库中的 `Carbon` 类，调用 `now()` 方法获取当前日期时间。`toDateTimeString()`\
    \ 方法将此日期时间格式化为可读的字符串。这个示例虽然简单，但展示了使用 Carbon 处理 PHP 日期时间的便利性，使其对于需要超出 PHP 内置 DateTime\
    \ 类功能范围来管理日期时间的开发者来说，是一个理想的选择。\n\n"
- fmt: "\n# 18. PHP-DI\n\nPHP-DI is a Dependency Injection Container for PHP, designed\
    \ to manage class dependencies and perform dependency injection, making it easier\
    \ to write scalable and testable code.\n\n### Ex:PHP-DI\n\n```php\nrequire 'vendor/autoload.php';\n\
    use DI\\ContainerBuilder;\nuse Psr\\Container\\ContainerInterface;\nclass MyClass\
    \ {\n    private $dependency;\n    public function __construct(ContainerInterface\
    \ $container) {\n        $this->dependency = $container->get('SomeService');\n\
    \    }\n    public function doSomething() {\n        return $this->dependency->process();\n\
    \    }\n}\n$containerBuilder = new ContainerBuilder();\n$containerBuilder->addDefinitions([\n\
    \    'SomeService' => DI\\create('SomeOtherClass')\n]);\n$container = $containerBuilder->build();\n\
    $myClass = new MyClass($container);\necho $myClass->doSomething();\n```\n\nWhatever\
    \ returns.\n\nIn this example, we're demonstrating the use of PHP-DI, a Dependency\
    \ Injection Container. First, we include Composer's autoload file to load PHP-DI\
    \ and any other libraries we might be using. We define a class `MyClass` that\
    \ depends on a service called `SomeService`. Instead of hardcoding a dependency\
    \ on `SomeService`, we inject a container interface (`ContainerInterface`) into\
    \ `MyClass` and use it to retrieve `SomeService`. This approach allows us to decouple\
    \ `MyClass` from `SomeService`, making our code more modular and easier to test.\
    \ We then use `ContainerBuilder` to create a container instance, defining `SomeService`\
    \ as an instance of `SomeOtherClass` within it. Finally, we create an instance\
    \ of `MyClass`, passing the container to its constructor, and call a method on\
    \ `MyClass` that uses `SomeService`.\n\nThis code snippet showcases the power\
    \ of dependency injection in making our codebase more flexible and maintainable.\
    \ By using a container, we can easily swap out implementations of `SomeService`\
    \ without changing the code that uses it, which is a key principle in writing\
    \ testable and scalable applications.\n\n# 19. PHP-Scoper\n\nPHP-Scoper is a tool\
    \ that prefixes all namespaces in a PHP library or project to avoid conflicts\
    \ with other libraries.\n\n### Ex:PHP-Scoper\n\n```php\n// Assuming we have a\
    \ file 'src/Example.php' with the namespace 'MyApp'\n// Before using PHP-Scoper,\
    \ the namespace would conflict with other 'MyApp' namespaces in a project.\n//\
    \ After applying PHP-Scoper, the namespace is prefixed, avoiding the conflict.\n\
    // Command to prefix namespaces\nphp-scoper add-prefix\n\n// src/Example.php before\
    \ PHP-Scoper\nnamespace MyApp;\nclass Example {\n    public function sayHello()\
    \ {\n        return 'Hello, World!';\n    }\n}\n\n// src/Example.php after PHP-Scoper\n\
    namespace Scoped\\MyApp;\nclass Example {\n    public function sayHello() {\n\
    \        return 'Hello, World!';\n    }\n}\n```\n\nNo direct output from PHP-Scoper,\
    \ but the namespaces will be modified. PHP-Scoper is primarily used to prevent\
    \ conflicts when integrating third-party libraries into a project. By prefixing\
    \ namespaces, it ensures that classes and functions do not clash with other libraries\
    \ having the same names.\n\n# 20. VichUploaderBundle\n\nVichUploaderBundle is\
    \ a Symfony bundle that simplifies file uploads in Symfony applications, handling\
    \ file-upload and file management.\n\n### Ex:VichUploaderBundle\n\n```php\nuse\
    \ Vich\\UploaderBundle\\Mapping\\Annotation as Vich;\n\n/**\n * @Vich\\Uploadable\n\
    \ */\nclass Product\n{\n    /**\n     * @Vich\\UploadableField(mapping=\"image\"\
    , fileNameProperty=\"imageName\")\n     * @var File|null\n     */\n    private\
    \ $imageFile;\n\n    // Property to store the filename in the database\n    private\
    \ $imageName;\n\n    // Setter method for the file, also triggers update for the\
    \ entity\n    public function setImageFile(?File $imageFile = null): void\n  \
    \  {\n        $this->imageFile = $imageFile;\n        if (null !== $imageFile)\
    \ {\n            // It is required that at least one field changes if you are\
    \ using Doctrine,\n            // otherwise the event listeners won't be able\
    \ to act on.\n            $this->updatedAt = new \\DateTimeImmutable();\n    \
    \    }\n    }\n\n    // Getter method for the file\n    public function getImageFile():\
    \ ?File\n    {\n        return $this->imageFile;\n    }\n}\n```\n\nNo direct output\
    \ from using VichUploaderBundle, but files will be uploaded and managed according\
    \ to the bundle's configuration. VichUploaderBundle integrates with Symfony to\
    \ offer a robust solution for file uploads. It abstracts the complexity of handling\
    \ file upload forms, file storage, and file management. The example above shows\
    \ how to annotate an entity to make a field uploadable. The bundle relies on annotations\
    \ to automate file handling processes such as uploading, deleting, and updating\
    \ file entities.\n"
