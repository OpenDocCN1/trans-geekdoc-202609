  trans: "\n\n# 18. PHP-DI\n\nPHP-DI 是一个用于 PHP 的依赖注入容器，旨在设计用于管理类依赖并执行依赖注入，这使得编写可扩展和可测试的代码变得更容易。\n\
    \n### 示例：PHP-DI\n\n```php\nrequire 'vendor/autoload.php';\nuse DI\\ContainerBuilder;\n\
    use Psr\\Container\\ContainerInterface;\nclass MyClass {\n    private $dependency;\n\
    \    public function __construct(ContainerInterface $container) {\n        $this->dependency\
    \ = $container->get('SomeService');\n    }\n    public function doSomething()\
    \ {\n        return $this->dependency->process();\n    }\n}\n$containerBuilder\
    \ = new ContainerBuilder();\n$containerBuilder->addDefinitions([\n    'SomeService'\
    \ => DI\\create('SomeOtherClass')\n]);\n$container = $containerBuilder->build();\n\
    $myClass = new MyClass($container);\necho $myClass->doSomething();\n```\n\n返回任意内容。\n\
    \n在这个示例中，我们演示了依赖注入容器 PHP-DI 的使用方法。首先，我们包含了 Composer 的自动加载文件以加载 PHP-DI 以及我们可能使用的任何其他库。我们定义了一个类\
    \ `MyClass`，它依赖于名为 `SomeService` 的服务。我们没有硬编码对 `SomeService` 的依赖，而是将容器接口（`ContainerInterface`）注入到\
    \ `MyClass` 并使用它来获取 `SomeService`。这种方法允许我们将 `MyClass` 与 `SomeService` 解耦，使代码更加模块化且更容易测试。然后，我们使用\
    \ `ContainerBuilder` 创建容器实例，并在将 `SomeService` 定义为 `SomeOtherClass` 的实例。最后，我们创建\
    \ `MyClass` 的实例，将容器传递给它的构造函数，并调用 `MyClass` 中使用 `SomeService` 的方法。\n\n这段代码展示了依赖注入在使代码库更加灵活和可维护方面的威力。通过使用容器，我们可以轻松替换\
    \ `SomeService` 的实现而无需更改它的代码，这是编写可测试和可扩展应用程序的关键原则。\n\n# 19. PHP-Scoper\n\nPHP-Scoper\
    \ 是一个工具，用于为 PHP 库或项目中的所有命名空间添加缀，以避免与其他库发生冲突。\n\n### 示例：PHP-Scoper\n\n```php\n\
    // 假设我们有一个命名空间为 'MyApp' 的文件 'src/Example.php'\n// 在使用 PHP-Scoper 之前，命名空间将与项目中其他的\
    \ 'MyApp' 命名空间冲突。\n// 应用 PHP-Scoper 后，命名空间将被添加缀，从而避免冲突。\n// 为命名空间添加缀的命令\nphp-scoper\
    \ add-prefix\n\n// PHP-Scoper 之前的 src/Example.php\nnamespace MyApp;\nclass Example\
    \ {\n    public function sayHello() {\n        return 'Hello, World!';\n    }\n\
    }\n\n// PHP-Scoper 后的 src/Example.php\nnamespace Scoped\\MyApp;\nclass Example\
    \ {\n    public function sayHello() {\n        return 'Hello, World!';\n    }\n\
    }\n```\n\nPHP-Scoper 没有产生直接输出，但命名空间会被修改。PHP-Scoper 主要用于在将第三方库集成到项目时防止冲突。通过为命名空间添加缀，它确保类和函数不会与其他具有名称名称库发生冲突。\n\
    \n# 20. VichUploaderBundle\n\nVichUploaderBundle 是一个 Symfony 扩展，用于简化 Symfony 应用程序中的文件上传，处理文件上传和文件管理。\n\
    \n### 示例：VichUploaderBundle\n\n```php\nuse Vich\\UploaderBundle\\Mapping\\Annotation\
    \ as Vich;\n\n/**\n * @Vich\\Uploadable\n */\nclass Product\n{\n    /**\n    \
    \ * @Vich\\UploadableField(mapping=\"image\", fileNameProperty=\"imageName\")\n\
    \     * @var File|null\n     */\n    private $imageFile;\n\n    // 在数据库中存储文件名的属性\n\
    \    private $imageName;\n\n    // 文件的 Setter 方法，也会触发实体的更新\n    public function\
    \ setImageFile(?File $imageFile = null): void\n    {\n        $this->imageFile\
    \ = $imageFile;\n        if (null !== $imageFile) {\n            // 如果你使用 Doctrine，则至少有一个字段发生变化，\n\
    \            // 否则监听器将无法作用。\n            $this->updatedAt = new \\DateTimeImmutable();\n\
    \        }\n    }\n\n    // 文件的 Getter 方法\n    public function getImageFile():\
    \ ?File\n    {\n        return $this->imageFile;\n    }\n}\n```\n\n使用 VichUploaderBundle\
    \ 没有直接输出，但文件将根据扩展的配置进行上传和管理。VichUploaderBundle 与 Symfony 集成，为文件上传提供了健壮的解决方案。它抽象了处理文件上传表单、文件存储和文件管理的复杂性。上面的示例显示了如何通过注解实体来使字段变得可上传。该扩展依赖注解来自动处理文件处理过程，如上传、删除和更新文件实体。\n\
    \n"
- fmt: "\n## 21. PHP League's Flysystem\n\nFlysystem is a filesystem abstraction library\
    \ for PHP that allows developers to easily interact with a variety of storage\
    \ backends using the same API. It supports local file systems, cloud storage like\
    \ Amazon S3, and others.\n\n### Ex:PHP League's Flysystem\n```php\n// Example:\
    \ Uploading a file to an Amazon S3 bucket using Flysystem\nrequire 'vendor/autoload.php';\n\
    use League\\Flysystem\\Filesystem;\nuse League\\Flysystem\\AwsS3v3\\AwsS3Adapter;\n\
    use Aws\\S3\\S3Client;\n$client = new S3Client([\n    'credentials' => [\n   \
    \     'key' => 'your-key',\n        'secret' => 'your-secret',\n    ],\n    'region'\
    \ => 'your-region',\n    'version' => 'latest',\n]);\n$adapter = new AwsS3Adapter($client,\
    \ 'your-bucket-name');\n$filesystem = new Filesystem($adapter);\n$fileStream =\
    \ fopen('path/to/your/file.txt', 'r+');\n$filesystem->writeStream('path/in/s3/to/file.txt',\
    \ $fileStream);\nif (is_resource($fileStream)) {\n    fclose($fileStream);\n}\n\
    ```\n\nThe file 'file.txt' is uploaded to the specified path in the Amazon S3\
    \ bucket. This example demonstrates how to upload a file to an Amazon S3 bucket\
    \ using Flysystem. First, we include the required libraries and use the relevant\
    \ Flysystem classes. Then, we create an `S3Client` instance with our AWS credentials,\
    \ region, and the version of the S3 service we are using. An `AwsS3Adapter` is\
    \ instantiated with the S3 client and the name of our bucket. We then create a\
    \ `Filesystem` object with this adapter, which abstracts away the details of working\
    \ with S3. The file we wish to upload is opened as a stream (`fopen`), and `writeStream`\
    \ method of the `Filesystem` object is used to upload it to a specified path within\
    \ our S3 bucket. Finally, we check if the file stream is still a resource and,\
    \ if so, close it. This process abstracts the complexity of directly interacting\
    \ with the AWS S3 SDK, providing a simpler interface for file operations.\n\n\
    ## 22. Propel\n\nPropel is an advanced open-source Object-Relational Mapping (ORM)\
    \ library for PHP. It is designed for speed and flexibility, providing an active\
    \ record implementation that allows developers to query and manipulate database\
    \ data in an object-oriented way.\n\n### Ex:Propel\n```php\n// Example: Querying\
    \ a table using Propel\nrequire 'vendor/autoload.php';\nuse Propel\\Runtime\\\
    Propel;\nuse Propel\\Runtime\\ActiveQuery\\Criteria;\nuse YourProject\\Model\\\
    YourTableQuery;\n// Assuming Propel is properly configured and YourTable is a\
    \ model class\n$results = YourTableQuery::create()\n    ->filterBySomeColumn('value')\n\
    \    ->orderByAnotherColumn(Criteria::DESC)\n    ->find();\nforeach ($results\
    \ as $result) {\n    echo $result->getSomeColumn();\n}\n```\n\nOutputs the value\
    \ of 'SomeColumn' for each row in 'YourTable' that matches the filter, ordered\
    \ by 'AnotherColumn' in descending order. In this example, we're showing how to\
    \ perform a query on a database table using Propel. First, we include the necessary\
    \ libraries with `require 'vendor/autoload.php'`. The Propel ORM requires a configuration\
    \ step (not shown here) that usually involves setting up your database connection\
    \ and generating model classes based on your database schema. `YourTableQuery::create()`\
    \ initiates a query on the `YourTable` model. The `filterBySomeColumn('value')`\
    \ method adds a condition to the query, looking for rows where 'SomeColumn' matches\
    \ a specified value. The `orderByAnotherColumn(Criteria::DESC)` method specifies\
    \ that the results should be ordered by 'AnotherColumn'. The `find()` method executes\
    \ the query and returns a collection, which we iterate over using `foreach`. Inside\
    \ the loop, we use `getSomeColumn()` to retrieve the value.\n\n## 23. Carbon\n\
    \nCarbon is an extension for DateTime that simplifies work with dates, providing\
    \ an intuitive interface and additional functionalities.\n\n### Ex:Carbon\n```php\n\
    // Example: Using Carbon\nrequire 'vendor/autoload.php';\nuse Carbon\\Carbon;\n\
    echo Carbon::now()->toDateTimeString();\necho Carbon::parse('2023-01-01')->addDays(5);\n\
    ```\n\nThis example demonstrates how to use Carbon to manipulate dates. First,\
    \ we include the necessary library using `require 'vendor/autoload.php'`. Then\
    \ we use the `Carbon` class. `Carbon::now()` retrieves the current date and time,\
    \ and `toDateTimeString()` formats it into a string. We also use `parse()` to\
    \ create a date instance and `addDays()` to perform arithmetic.\n\n## 24. Monolog\n\
    \nMonolog is a logging library for PHP, which provides a comprehensive logging\
    \ system that can send your logs to various destinations.\n\n### Ex:Monolog\n\
    ```php\n// Example: Logging with Monolog\nrequire 'vendor/autoload.php';\nuse\
    \ Monolog\\Logger;\nuse Monolog\\Handler\\StreamHandler;\n$log = new Logger('name');\n\
    $log->pushHandler(new StreamHandler('path/to/your.log', Logger::WARNING));\n$log->warning('This\
    \ is a warning.');\n$log->error('This is an error.');\n```\n\nThis will create\
    \ or update the specified log file with the messages. In the provided code, we\
    \ start by loading the Monolog package using Composer's autoload feature. We then\
    \ create a new instance of the `Logger` class, giving it a name. Next, we introduce\
    \ a `StreamHandler`. Handlers are responsible for writing the log messages to\
    \ a specific destination. In this case, the `StreamHandler` is used to write to\
    \ a file, specified by 'path/to/your.log'. The second parameter of the `StreamHandler`\
    \ constructor indicates the minimum logging level that this handler will write;\
    \ `Logger::WARNING`.\n\n## 25. Snappy\n\nSnappy is a PHP library that allows you\
    \ to generate PDF files and images from HTML. It acts as a wrapper for the `wkhtmltopdf`\
    \ and `wkhtmltoimage` command-line tools.\n\n### Ex:Snappy\n```php\n<?php\n//\
    \ Example: Generating a PDF\nrequire 'vendor/autoload.php';\nuse Knp\\Snappy\\\
    Pdf;\n$snappy = new Pdf('/usr/local/bin/wkhtmltopdf');\n$snappy->generateFromHtml('input.html',\
    \ 'output.pdf');\n?>\n```\n"
