  trans: "\n\n# 27. mysqli\n\n`mysqli` 扩展（MySQL Improved）是 PHP 编程语言中的一种关系型数据库驱动程序，用于提供\
    \ MySQL 数据库提供接口。它支持预语句、事务和增强的调试功能。\n\n## 示例：mysqli\n```php\n<?php\n$mysqli = new\
    \ mysqli(\"localhost\", \"user\", \"password\", \"database\");\nif ($mysqli->connect_errno)\
    \ {\n    echo \"Failed to connect to MySQL: \" . $mysqli->connect_error;\n   \
    \ exit();\n}\n// 执行查询并检查错误\nif (!$mysqli->query(\"CREATE TEMPORARY TABLE myCity\
    \ LIKE City\")) {\n    echo \"Query Failed: \" . $mysqli->error;\n    exit();\n\
    }\n$mysqli->close();\n?>\n```\n\n如果执行成功，此脚本不会产生任何输出。如果失败，它将打印错误消息，例如“Failed to\
    \ connect to MySQL: ”后跟错误信息，或者“Query Failed: ”后跟错误原因。\n\n此代码段落演示了使用 `mysqli` 扩展与\
    \ MySQL 数据库交互的基本用法。它执行了以下步骤：\n- 创建 `mysqli` 类的新实例，尝试使用提供的主机名、用户名、密码和数据库名称连接到 MySQL\
    \ 数据库。\n- 通过检查 `connect_errno` 属性检查连接是否成功。如果发生错误，则打印错误消息并退出脚本。\n- 尝试执行一个 SQL 查询，创建一个名为\
    \ 'myCity' 的临时表，其结构类似于现有表 'City'。它通过评估 `query()` 方法的结果来检查查询是否成功。如果查询失败，将打印详细说明问题的错误消息并退出。\n\
    - 使用 `close()` 方法关闭数据库连接。\n\n此示例说明了如何建立 MySQL 数据库的连接、执行查询、处理潜在错误并最后关闭连接。这是 PHP\
    \ 中使用 `mysqli` 进行数据库操作的基本模式。\n\n# 28. ftp\n\n`ftp` 扩展提供了一种使用 PHP 与 FTP 服务器交互的简单直观的方法。它允许文件上传、下载、身份验证以及在远程服务器的目录之间进行导航。\n\
    \n## 示例：ftp\n```php\n<?php\n$ftp_server = \"ftp.example.com\";\n$ftp_user_name\
    \ = \"username\";\n$ftp_user_pass = \"password\";\n// 设置到 ftp 服务器的连接\n$conn_id\
    \ = ftp_connect($ftp_server);\n// 使用用户名和密码登录\n$login_result = ftp_login($conn_id,\
    \ $ftp_user_name, $ftp_user_pass);\n// 检查连接和登录结果\nif ((!conn_id) || (!$login_result))\
    \ {\n    echo \"FTP connection has failed!\";\n    exit;\n} else {\n    echo \"\
    Connected to $ftp_server, as $ftp_user_name\";\n}\n// 关闭 FTP 流\nftp_close($conn_id);\n\
    ?>\n```\n\n如果成功，此脚本将打印“Connected to ftp.example.com, as username”。如果连接或登录失败，它将打印“FTP\
    \ connection has failed!”。\n\n此示例提供了如何在 PHP 中使用 `ftp` 扩展连接到 FTP 服务器的直接演示。涉及的关键步骤包括：\n\
    - 定义 FTP 服务器详情（服务器地址、用户名和密码）。\n- 使用 `ftp_connect()` 建立到 FTP 服务器的连接。该函数尝试建立连接，成功时返回链接标识符，失败时返回\
    \ false。\n- 使用 `ftp_login()` 使用提供的凭据登录 FTP 服务器。该函数接受连接链接标识符、用户名和密码作为参数，登录成功时返回\
    \ true，失败时返回 false。\n- 检查连接和登录尝试的结果。如果连接失败或登录未成功，则打印错误消息并退出脚本。\n- 使用 `ftp_close()`\
    \ 关闭到 FTP 服务器的连接，该函数接收链接标识符。\n\n# 29. array_diff\n\n`array_diff` 用于比较两个或多个数组，并返回第一个数组中不在其他数组中的值。\n\
    \n## 示例：array_diff\n```php\n$array1 = ['apple', 'banana', 'cherry'];\n$array2\
    \ = ['durian'];\n$difference = array_diff($array1, $array2);\nprint_r($difference);\n\
    ```\n输出：\n```\nArray\n(\n    [0] => apple\n    [2] => cherry\n)\n```\n\n此代码段演示了如何使用\
    \ `array_diff` 函数比较数组 `$array1` 和 `$array2`。该函数比较 `$array1` 中的值与 `$array2`。结果存储在\
    \ `$difference` 中，包含了 `$array1` 中未出现在 `$array2` 中的所有值。执行 `print_r($difference)`\
    \ 时，它以可读格式打印数组。此结果显示 `$array1` 中的 'apple' 和 'cherry' 不在 `$array2` 中，因此包含在输出中。\n\
    \n# 30. array_map\n\n`array_map` 将回调函数应用于一个或多个数组的元素，并返回一个应用回调函数后的元素数组。\n\n## 示例：array_map\n\
    ```php\n<?php\nfunction square($n) {\n    return $n * $n;\n}\n$numbers = [1, 2,\
    \ 3, 4];\n$squared = array_map('square', $numbers);\nprint_r($squared);\n?>\n\
    ```\n输出：\n```\nArray\n(\n    [0] => 1\n    [1] => 4\n    [2] => 9\n    [3] =>\
    \ 16\n)\n```\n\n在此代码中，我们定义了一个名为 `square` 的简单函数，用于计算数字的平方。然后我们声明了一个包含 1、2、3、4 元素的数组\
    \ `$numbers`。使用 `array_map` 函数将 `square` 函数应用到 `$numbers` 数组的每个元素上。该操作的结果被赋值给数组\
    \ `$squared`。执行 `print_r($squared)` 会打印数组 `$squared`，显示 `$numbers` 中原始数字的平方值。`$numbers`\
    \ 数组的每个元素都被传递给 `square` 函数，该函数返回数字的平方。`array_map` 函数将这些返回值收集到一个新数组 `$squared`\
    \ 中，然后将其打印。这演示了如何使用 `array_map` 将函数应用于数组的每个元素，从而实现数组数据的高批量转换。\n\n"
- fmt: "\n# Chapter 3: external library\n\n## 1. Guzzle\nGuzzle is a PHP HTTP client\
    \ that makes it easy to send HTTP requests and trivial to integrate with web services.\n\
    \n### Ex:Guzzle\n```php\n<?php\nrequire 'vendor/autoload.php';\n$client = new\
    \ \\GuzzleHttp\\Client();\n$response = $client->request('GET', 'https://api.github.com/repos/guzzle/guzzle');\n\
    echo $response->getStatusCode(); // HTTP status code\necho $response->getBody();\
    \ // Body of the response\n```\n– 200\n// The actual JSON response from GitHub\
    \ about the Guzzle repository will be displayed here.\n\nThis example demonstrates\
    \ how to use Guzzle to make a GET request to GitHub's API for information about\
    \ the Guzzle repository itself. First, you need to include Guzzle in your project,\
    \ which is typically done using Composer, a dependency manager for PHP. You can\
    \ add Guzzle to your project by running `composer require guzzlehttp/guzzle` in\
    \ your project directory.\n\nThe code begins by including the Composer autoload\
    \ file, which makes it possible to use Guzzle and other libraries installed via\
    \ Composer without manual includes. Then, it creates a new instance of the Guzzle\
    \ HTTP client. With this client, we make a GET request to the specified URL, which\
    \ in this case the API endpoint for the Guzzle repository on GitHub.\n\nThe request\
    \ method returns a response object from which we can extract information such\
    \ as the HTTP status code using `$response->getStatusCode()` and the body of the\
    \ response using `$response->getBody()`. In a real-world scenario, you might parse\
    \ the JSON body to extract specific pieces of information.\n\nThis example provides\
    \ a straightforward way to start working with external APIs in PHP, demonstrating\
    \ how Guzzle abstracts away much of the complexity involved in making HTTP requests\
    \ and handling responses.\n\n## 2. PHPMailer\nPHPMailer is a email creation and\
    \ transfer class for PHP, supporting SMTP and many other \"mail sending\" features.\n\
    \n### Ex:PHPMailer\n```php\n<?php\nrequire 'vendor/autoload.php';\n$mail = new\
    \ PHPMailer\\PHPMailer\\PHPMailer();\n$mail->isSMTP(); // Set mailer to use SMTP\n\
    $mail->Host = 'smtp.example.com'; // Specify main and backup SMTP servers\n$mail->SMTPAuth\
    \ = true; // Enable SMTP authentication\n$mail->Username = 'user@example.com';\
    \ // SMTP username\n$mail->Password = 'secret'; // SMTP password\n$mail->SMTPSecure\
    \ = 'tls'; // Enable TLS encryption, `ssl` also accepted\n$mail->Port = 587; //\
    \ TCP port to connect to\n$mail->setFrom('from@example.com', 'Mailer');\n$mail->addAddress('joe@example.net',\
    \ 'Joe User'); // Add recipient\n$mail->Subject = 'Here is the subject';\n$mail->Body\
    \ = 'This is the body';\n$mail->isHTML(true); // Set email format to HTML\nif(!$mail->send())\
    \ {\n    echo 'Message has been sent';\n} else {\n    echo 'Message could not\
    \ be sent. Mailer Error: '.$mail->ErrorInfo;\n}\n?>\n```\nThis example showcases\
    \ how to send an email using PHPMailer, a popular library that simplifies the\
    \ email process. Before you can use PHPMailer, you need to include it in your\
    \ project, preferably using Composer. The script begins with requiring the phpmailerer\
    \ the Composer autoload file, enabling you to use PHPMailer. It then creates an\
    \ instance of PHPMailer and sets it to use SMTP (Simple Transfer Protocol). The\
    \ SMTP details, including host, SMTP authentication, username, password, encryption\
    \ method (TLS or ssl), and port, are specified. After configuring the SMTP settings,\
    \ the script sets the sender and recipient addresses, subject, and body. The body\
    \ can be plain text or HTML, allowing for more styled content. Finally, the script\
    \ attempts to send the email using the send method. If sending fails, it prints\
    \ an error message along with the error. Otherwise, it confirms the message has\
    \ been sent.\n\n## 3. Intervention Image\nIntervention Image is a PHP image handling\
    \ and manipulation library providing an easier and expressive way to create, edit,\
    \ and compose images. It supports various image operations like resizing, cropping,\
    \ rotating, and applying filters.\n\n### Ex:Intervention Image\n```php\n<?php\n\
    require 'vendor/autoload.php';\nuse Intervention\\Image\\ManagerStatic as Image;\n\
    $image = Image::make('public/foo.jpg')->resize(300, 200);\necho $image->response('jpg');\n\
    ?>\n```\nThis code resizes the image 'public/foo.jpg' to 300x200 pixels and outputs\
    \ it directly to the browser in JPEG format.\n\nIn this example, we start by loading\
    \ the necessary classes from the Intervention Image package with the require 'vendor/autoload.php'\
    \ command. This command is essential for PHP projects that manage dependencies\
    \ through Composer, as it automatically loads all the required libraries without\
    \ needing to include them manually in each script. We then use the `ImageManagerStatic`\
    \ class, accessed via the `Image` alias, to perform image operations in a static\
    \ manner, which means you don't need to instantiate the class to use its methods.\
    \ The `make` method initializes an image object from the specified source, which\
    \ is 'public/foo.jpg' in this case. The `resize` method is used to change the\
    \ dimensions of the image to 300x200 pixels. This is a very common operation when\
    \ you need to standardize the size of images in your application, for example,\
    \ making all user-uploaded profile pictures the same size. Finally, the `response`\
    \ method is used to output the image directly to the web browser. The 'jpg' parameter\
    \ specifies the format of the output image. This feature is particularly useful\
    \ for dynamically generating images in web applications without the need to save\
    \ them on the server. Overall, the Intervention Image library simplifies the process\
    \ of handling and manipulating images in PHP, making tasks that would otherwise\
    \ require extensive knowledge of the GD or Imagick extensions much more accessible.\n"
