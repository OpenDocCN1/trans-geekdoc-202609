- fmt: "\n# 7. DateTime\n\nThe `DateTime` class allows for the representation and\
    \ manipulation of dates and times. It provides methods to perform operations such\
    \ as addition and subtraction on dates, as well as formatting dates and times\
    \ for display.\n\nEx:DateTime\n```php\n<?php\n$date = new DateTime('2024-03-20');\n\
    $date->add(new DateInterval('P10D')); // Adds 10 days\necho $date->format('Y-m-d');\n\
    ?>\n```\n\nIn this PHP script, we're dealing with the `DateTime` class, which\
    \ is a powerful tool for managing dates and times. `$date = new DateTime('2024-03-20')`\
    \ creates a new `DateTime` object representing March 20, 2024. The `DateTime`\
    \ constructor can take a date string as an argument to initialize the date. `$date->add(new\
    \ DateInterval('P10D'))` adds 10 days to the initially set date. The `DateInterval`\
    \ object is created with a period designator (`P`), followed by the number of\
    \ days (`10D`). This means \"a period of 10 days.\" `DateInterval` can also be\
    \ used for months, years, hours, minutes, and seconds. `echo $date->format('Y-m-d')`\
    \ formats the modified date into a string according to the format provided (`'Y-m-d'`\
    \ stands for year-month-day) and prints it. The output is \"2024-03-30,\" which\
    \ is 10 days after the initial date. This example showcases how to manipulate\
    \ dates by adding a specific interval and then formatting the output for display,\
    \ a common task in web development for features like expiration dates, scheduled\
    \ posts, or event countdowns.\n\n# 8. hash\n\nThe `hash` extension offers a way\
    \ to generate hash digests of arbitrary length using various algorithms. It is\
    \ commonly used for generating secure hashes of passwords or data for verification\
    \ purposes.\n\nEx:hash\n```php\n<?php\n$data = \"Hello, world!\";\n$hash = hash('sha256',\
    \ $data);\necho $hash;\n?>\n```\n`a591a6d40bf420404a011733cfb7b190d62c65bf0eecb2b5571f4e3a5a6b3d79`\n\
    \nIn this simple PHP script, we utilize the `hash` function to generate a hash\
    \ digest of the string \"Hello, world!\" using the `SHA-256` algorithm. `$data\
    \ = \"Hello, world!\"` sets the string we want to hash. `$hash = hash('sha256',\
    \ $data)` generates the hash of `$data` using the `SHA256` algorithm. The `hash`\
    \ function takes two parameters: the name of the algorithm (`'sha256'`) and the\
    \ data to hash. `SHA256` is part of the `SHA` set of cryptographic functions and\
    \ is widely used for security applications and protocols. `echo $hash` prints\
    \ the generated digest. The result is a fixed-length string that acts as a \"\
    digital fingerprint\" of the input data. It's important to note that even small\
    \ changes in the input data will produce significantly different hash. Hash functions\
    \ like `SHA256` are crucial for creating secure password storage, data integrity,\
    \ and in cryptographic applications to ensure that data has not been tampered\
    \ with.\n\n# 9. Reflection\n\nReflection in PHP is used to introspect classes,\
    \ functions, methods, and extensions. This capability allows developers to analyze\
    \ the structure of code at runtime, including properties, methods, and parameters,\
    \ which is particularly useful for debugging or systems that need to manipulate\
    \ objects in a dynamic manner.\n\nEx:Reflection\n```php\n<?php\nclass MyClass\
    \ {\n    public $prop1 = 'Hello';\n    private $prop2 = 'World';\n    public function\
    \ myMethod($arg1, $arg2) {\n        return $arg1 . ' ' . $arg2;\n    }\n}\n$reflectionClass\
    \ = new ReflectionClass('MyClass');\n$methods = $reflectionClass->getMethods();\n\
    foreach ($methods as $method) {\n    echo $method->name . \"\\n\";\n}\n$properties\
    \ = $reflectionClass->getProperties();\nforeach ($properties as $property) {\n\
    \    echo $property->name . \"\\n\";\n}\n?>\n```\nmyMethod\nprop1\nprop2\n\nThis\
    \ code snippet demonstrates how to use PHP's `Reflection` API to introspect a\
    \ class named `MyClass`. We define a simple class `MyClass` with two properties\
    \ (`prop1` and `prop2`) and one method (`myMethod`). Then we create a new `ReflectionClass`\
    \ object, passing the name of the class we want to inspect (`MyClass`) as the\
    \ argument. We use `$reflectionClass->getMethods()` to get an array of the methods\
    \ defined in `MyClass`. Looping through this array, we print the name of each\
    \ method. In our case, there's only one method: `myMethod`. Similarly, we use\
    \ `$reflectionClass->getProperties()` to get an array of properties defined in\
    \ the class. By iterating over this array, we print the names of the properties:\
    \ `prop1` and `prop2`. This reflection capability is incredibly useful for developing\
    \ frameworks, debuggers, or any application that requires dynamic analysis of\
    \ code. By allowing inspection and manipulation of objects, classes, and methods\
    \ at runtime, developers can write more flexible and introspectable code.\n\n\
    # 10. stream_context_create\n\nThe `stream_context_create` function in PHP is\
    \ used to create and return a stream context resource that can be used with file\
    \ system or stream functions. This context can modify the behavior of stream functions,\
    \ allowing for customization such as setting HTTP headers, specifying SSL options,\
    \ or configuring proxy settings for file operations or data transfers.\n\nEx:stream_context_create\n\
    ```php\n<?php\n$options = array(\n    'http' => array(\n        'method' => \"\
    GET\",\n        'header' => \"Accept-language: en\\r\\n\" .\n                \
    \   \"Cookie: foo=bar\\r\\n\"\n    )\n);\n$context = stream_context_create($options);\n\
    $result = file_get_contents('http://www.example.com/', false, $context);\necho\
    \ $result;\n?>\n```\nThe content of the requested web page will be displayed.\n\
    \nIn this example, we demonstrate how to use the `stream_context_create` function\
    \ to customize HTTP requests in PHP. We start by defining an associative array\
    \ `$options` that specifies the options for the HTTP stream context. In this case,\
    \ we set the HTTP method to `\"GET\"` and add a custom header that includes both\
    \ an `Accept-language` header and a `Cookie`. We then create a stream context\
    \ using `stream_context_create($options)`. This function takes our options array\
    \ and constructs a stream context resource from it. With this context, we call\
    \ `file_get_contents` and pass the URL of the website we want to fetch data from,\
    \ along with the flag `false` (to use the global stream context) and our custom\
    \ `$context`. This instructs `file_get_contents` to use the specified HTTP headers\
    \ when making the request. Finally, we echo the result, which is the content fetched\
    \ from the specified URL, demonstrating how the stream context has been used to\
    \ modify the behavior of the HTTP request. This method is extremely useful for\
    \ interacting with APIs, web scraping, or any situation where you need more control\
    \ over HTTP requests than what is provided by default. It showcases the flexibility\
    \ of PHP's stream wrappers and context options for customized data streams.\n"
