  trans: "\n\n## 21. PHP League 的 Flysystem\n\nFlysystem 是一个用于 PHP 的文件系统抽象库，允许开发者使用相同的\
    \ API 轻松与各种存储后端进行交互。它支持本地文件系统、Amazon S3 等云存储等。\n\n### 示例：PHP League's Flysystem\n\
    ```php\n// Example: Uploading a file to an Amazon S3 bucket using Flysystem\n\
    require 'vendor/autoload.php';\nuse League\\Flysystem\\Filesystem;\nuse League\\\
    Flysystem\\AwsS3v3\\AwsS3Adapter;\nuse Aws\\S3\\S3Client;\n$client = new S3Client([\n\
    \    'credentials' => [\n        'key' => 'your-key',\n        'secret' => 'your-secret',\n\
    \    ],\n    'region' => 'your-region',\n    'version' => 'latest',\n]);\n$adapter\
    \ = new AwsS3Adapter($client, 'your-bucket-name');\n$filesystem = new Filesystem($adapter);\n\
    $fileStream = fopen('path/to/your/file.txt', 'r+');\n$filesystem->writeStream('path_in/s3/to/file.txt',\
    \ $fileStream);\nif (is_resource($fileStream)) {\n    fclose($fileStream);\n}\n\
    ```\n\n文件 'file.txt' 被上传到 Amazon S3 桶中指定的路径。此示例演示了如何使用 Flysystem 将文件上传到 Amazon\
    \ S3 桶。首先，我们包含了所需的库并使用了相关的 Flysystem 类。然后，我们使用我们的 AWS 凭据、区域以及正在使用的 S3 服务版本创建一个\
    \ `S3Client` 实例。使用 S3 客户端和我们的桶名称实例化一个 `AwsS3Adapter`。接着，我们使用该适配器创建一个 `Filesystem`\
    \ 对象，它抽象了与 S3 交互的细节。我们想要上传的文件以流的形式（`fopen`）打开，并使用 `Filesystem` 对象的 `writeStream`\
    \ 方法将其上传到 S3 桶内的指定路径。最后，我们检查文件流是否仍为资源，如果是，则将其关闭。这个过程抽象了直接与 AWS S3 SDK 交互的复杂性，为文件操作提供了更简单的接口。\n\
    \n## 22. Propel\n\nPropel 是一个用于 PHP 的高级开源对象关系映射（ORM）库。它为速度和灵活性而设计，提供了一种活动记录实现，允许开发者以面向对象的方式查询和操作数据库数据。\n\
    \n### 示例：Propel\n```php\n// Example: Querying a table using Propel\nrequire 'vendor/autoload.php';\n\
    use Propel\\Runtime\\Propel;\nuse Propel\\Runtime\\ActiveQuery\\Criteria;\nuse\
    \ YourProject\\Model\\YourTableQuery;\n// 假设 Propel 已正确配置且 YourTable 是一个模型类\n\
    $results = YourTableQuery::create()\n    ->filterBySomeColumn('value')\n    ->orderByAnotherColumn(Criteria::DESC)\n\
    \    ->find();\nforeach ($results as $result) {\n    echo $result->getSomeColumn();\n\
    }\n```\n\n输出 'YourTable' 中每个匹配过滤条件的行的 'SomeColumn' 的值，并按 'AnotherColumn' 降序排列。在此示例中，我们展示了如何使用\
    \ Propel 对数据库表进行查询。首先，我们通过 `require 'vendor/autoload.php'` 包含必要的库。Propel ORM 需要一个配置步骤（此处未显示），该步骤通常涉及设置数据库连接并根据数据库架构生成模型类。`YourTableQuery::create()`\
    \ 初始化了对 `YourTable` 模型的查询。`filterBySomeColumn('value')` 方法为查询添加了条件，查找 'SomeColumn'\
    \ 匹配指定值的行。`orderByAnotherColumn(Criteria::DESC)` 方法指定结果应按 'AnotherColumn' 排序。`find()`\
    \ 方法执行查询并返回一个集合，我们使用 `foreach` 对其进行遍历。在循环中使用 `getSomeColumn()` 获取值。\n\n## 23.\
    \ Carbon\n\nCarbon 是 DateTime 的扩展，简化了日期的处理，提供了直观的接口和额外的功能。\n\n### 示例：Carbon\n\
    ```php\n// Example: Using Carbon\nrequire 'vendor/autoload.php';\nuse Carbon\\\
    Carbon;\necho Carbon::now()->toDateTimeString();\necho Carbon::parse('2023-01-01')->addDays(5);\n\
    ```\n\n此示例演示了如何使用 Carbon 操作日期。首先，我们通过 `require 'vendor/autoload.php'` 包含了库。然后我们使用\
    \ `Carbon` 类。`Carbon::now()` 获取当前日期和时间，`toDateTimeString()` 将其格式化为字符串。我们还使用 `parse()`\
    \ 创建日期实例并使用 `addDays()` 进行算术。\n\n## 24. Monolog\n\nMonolog 是一个用于 PHP 的日志库，它提供了一个全面的日志系统，可以将日志发送到不同的目的地。\n\
    \n### 示例：Monolog\n```php\n// Example: Logging with Monolog\nrequire 'vendor/autoload.php';\n\
    use Monolog\\Logger;\nuse Monolog\\Handler\\StreamHandler;\n$log = new Logger('name');\n\
    $log->pushHandler(new StreamHandler('path/to/your.log', Logger::WARNING));\n$log->warning('This\
    \ is a warning.');\n$log->error('This is an error.');\n```\n\n这将消息创建或更新指定的日志文件。在提供的代码中，我们首先通过\
    \ Composer 的自动加载功能加载 Monolog 包。然后我们创建一个 `Logger` 类的实例，并为其命名。接着，我们引入了 `StreamHandler`。处理器负责将日志消息写入特定的目的地。在这种情况下，使用\
    \ `StreamHandler` 写入文件，由 'path/to/your.log' 指定。`StreamHandler` 构造函数的第二个参数指示了该处理器将写入的最低日志级别；`Logger::WARNING`。\n\
    \n## 25. Snappy\n\nSnappy 是一个 PHP 库，允许从 HTML 生成 PDF 文件和图像。它是 `wkhtmltopdf` 和 `wkhtmltoimage`\
    \ 命令行工具的封装。\n\n### 示例：Snappy\n```php\n<?php\n// Example: Generating a PDF\nrequire\
    \ 'vendor/autoload.php';\nuse Knp\\Snappy\\Pdf;\n$snappy = new Pdf('/usr/local/bin/wkhtmltopdf');\n\
    $snappy->generateFromHtml('input.html', 'output.pdf');\n?>\n```\n\n"
