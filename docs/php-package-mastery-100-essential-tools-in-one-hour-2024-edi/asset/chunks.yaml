- fmt: "\n# 40. PhpSpreadsheet\n\nPhpSpreadsheet is a library that provides a set\
    \ of classes for reading from and writing to different spreadsheet file formats,\
    \ such as Excel and CSV. It's the successor of PHPExcel and represents a major\
    \ upgrade, offering better performance and more features like reading and writing\
    \ spreadsheets, cell formatting, and chart creation.\n\nEx:PhpSpreadsheet\n\n\
    ```php\nrequire 'vendor/autoload.php';\nuse PhpOffice\\PhpSpreadsheet\\Spreadsheet;\n\
    use PhpOffice\\PhpSpreadsheet\\Writer\\Xlsx;\n// Creating a new spreadsheet\n\
    $spreadsheet = new Spreadsheet();\n$sheet = $spreadsheet->getActiveSheet();\n\
    $sheet->setCellValue('A1', 'Hello World!');\n// Writing to a file\n$writer = new\
    \ Xlsx($spreadsheet);\n$writer->save('hello_world.xlsx');\n```\n\nThis code creates\
    \ a new Excel file named `hello_world.xlsx` containing a single cell (A1) with\
    \ the text 'Hello World!'.\n\nIn the provided example, we start by requiring the\
    \ Composer autoload file, which is essential for loading the PhpSpreadsheet library\
    \ classes. Then, we instantiate a new `Spreadsheet` object, which serves as the\
    \ primary container for our spreadsheet data. The `getActiveSheet` method is used\
    \ to fetch the current active worksheet.\n\nWe then set the value of cell 'A1'\
    \ to \"Hello World!\" using the `setCellValue` method. This method takes two parameters:\
    \ the cell coordinate as the first parameter (in this case, 'A1') and the value\
    \ to be set as the second parameter.\n\nAfter setting the cell value, we prepare\
    \ to write our spreadsheet to a file. To do this, we create a new `Xlsx` writer\
    \ instance, passing our `Spreadsheet` object to the constructor. The `save` method\
    \ of the writer object is then called with the desired file name (`hello_world.xlsx`).\
    \ This action writes our spreadsheet data to an Excel file in the XLSX format.\n\
    \nThis example demonstrates the basic process of creating a spreadsheet, modifying\
    \ its contents, and saving it to a file using PhpSpreadsheet, which can be particularly\
    \ useful for generating reports, exporting data, and creating dynamic spreadsheet\
    \ files through PHP.\n\n# 41. ParagonIE Sodium Compat\n\nThis library is a polyfill\
    \ for libsodium, providing features for PHP such as encryption, decryption, signatures,\
    \ and key exchange, aiming to improve security.\n\nEx:ParagonIE Sodium Compat\n\
    \n```php\nrequire 'vendor/autoload.php';\nuse ParagonIE\\Sodium\\Core\\Salsa20;\n\
    $message = 'This is a secret.';\n$key = random_bytes(Salsa20::BYTES); // Generate\
    \ a key\n$nonce = random_bytes(Salsa20::NONCE); // Generate a nonce\n// Encrypt\n\
    $encrypted = Salsa20::crypto_encrypt($message, $key, $nonce);\n// Decrypt\n$decrypted\
    \ = Salsa20::crypto_decrypt($encrypted, $key, $nonce);\necho $decrypted;\n```\n\
    \nIn this code, we use `ParagonIE\\Sodium\\Core\\Salsa20` for encryption and decryption.\
    \ First, we generate a key and a nonce using `random_bytes()` with the constants\
    \ `Salsa20::BYTES` and `Salsa20::NONCE`. We then encrypt the message using `Salsa20::crypto_encrypt`.\
    \ Finally, we decrypt the message using `Salsa20::crypto_decrypt` and echo the\
    \ original message.\n\n# 42. PHPBench\n\nPHPBench is a benchmarking framework\
    \ designed for PHP, allowing developers to measure and compare the performance\
    \ of code blocks systematically. It is similar to unit tests.\n\nEx:PHPBench\n\
    \n```php\nuse PHPBench\\Benchmark\\Annotations\\Benchmark;\nuse PHPBench\\Benchmark\\\
    Annotations\\BeforeMethods;\nuse PHPBench\\Benchmark\\Annotations\\Iterations;\n\
    \nclass MyBenchmark {\n    private $dataArray;\n\n    /**\n     * Initialize data\
    \ before benchmarks.\n     * @BeforeMethods()\n     */\n    public function init()\
    \ {\n        $this->-dataArray = range(1, 1000);\n    }\n\n    /**\n     * @Benchmark\n\
    \     * @Iterations(10)\n     * @BeforeMethods({\"init\"})\n     */\n    public\
    \ function benchArrayMap() {\n        array_map(function ($item) {\n         \
    \   return $item * 2;\n        }, $this->dataArray);\n    }\n}\n```\n\nBenchmark\
    \ results will vary based on the system and conditions under which they're run.\
    \ Typically, output includes execution time, memory usage, and iterations.\n"
  raw: "  40\\. PhpSpreadsheet    PhpSpreadsheet is a library that provides a set\
    \ of classes for reading from and writing to different spreadsheet file formats,\
    \ such as Excel and CSV. It's the successor of PHPExcel and represents a major\
    \ upgrade, offering better performance and more features like reading and writing\
    \ spreadsheets, cell formatting, and chart creation.    ––––––––    Ex:PhpSpreadsheet\
    \       require 'vendor/autoload.php';       use PhpOffice\\\\PhpSpreadsheet\\\
    \\Spreadsheet;       use PhpOffice\\\\PhpSpreadsheet\\\\Writer\\\\Xlsx;       //\
    \ Creating a new spreadsheet       $spreadsheet \\= new Spreadsheet();       $sheet\
    \ \\= $spreadsheet->getActiveSheet();       $sheet->setCellValue('A1', 'Hello\
