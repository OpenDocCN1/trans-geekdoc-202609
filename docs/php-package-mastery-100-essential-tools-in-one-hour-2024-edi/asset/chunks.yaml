  trans: "\n\n```php\n';\n    $snappy->generateFromHtml($content, 'hello-world.pdf');\n\
    ?>\n```\n当前目录下生成了一个名为 `hello-world.pdf` 的 PDF 文件，其中包含一个带有大字体文本“Hello, World!”的页面。此示例从引入\
    \ Composer 自动加载文件开始，以便在脚本中使用 `Snappy`。然后，它从 `Snappy` 命名空间导入了 `Pdf` 类。创建一个 `Pdf`\
    \ 类的实例，并指定 `wkhtmltopdf` 二进制文件的路径。`Snappy` 的工作需要该二进制文件，因为它利用 `wkhtmltopdf` 将 HTML\
    \ 转换为 PDF。\n\n`$content` 变量存储了你想转换的 HTML 内容。在本例中，它是一个带有“Hello, World!”的简单标题标签。调用了\
    \ `Snappy` 实例的 `generateFromHtml` 方法，并了 HTML 内容以及输出文件的路径和名称。该方法指示 `Snappy` 根据提供的\
    \ HTML 创建 PDF 文件。结果是保存在当前脚本目录下的名为 `hello-world.pdf` 的 PDF 文件。\n\n此过程演示了 `Snappy`\
    \ 从 HTML 生成 PDF 文档的基本用法，展示了它在 PHP 中动态创建文档的实用性。\n\n## 26. PHPLeague's Glide\n\n\
    `Glide` 是一个用于 PHP 的动态图像处理库。它允许对图像进行即时处理，如调整大小、裁剪和应用过滤器。\n\n### ：PHPLeague's Glide\n\
    ```php\n<?php\nrequire 'vendor/autoload.php';\nuse League\\Glide\\ServerFactory;\n\
    use League\\Glide\\Responses\\PsrResponseFactory;\nuse Zend\\Diactoros\\Response;\n\
    use Zend\\Diactoros\\ServerRequestFactory;\n\n$server = ServerFactory::create([\n\
    \    'source' => '/path/to/source/images',\n    'cache' => '/path/to/cache',\n\
    \    'response' => new PsrResponseFactory(),\n]);\n\n$request = ServerRequestFactory::fromGlobals();\n\
    $response = new Response();\n// 假设源目录存在一个名为 'example.jpg' 的图像。\n$server->outputImage('example.jpg',\
    \ ['w' => 300, 'h' => 200], $request, $response);\n```\n\n服务器处理 `example.jpg`，将其调整为\
    \ 300x200 像素，并将图像直接输出到浏览器。\n\n在此示例中，我们首先引入自动加载文件。我们使用 `ServerFactory::create`\
    \ 通过 `source` 路径 `/path/to/source/images` 和 `cache` 路径 `/path/to/cache` 初始化服务器。`response`\
    \ 是 `PsrResponseFactory` 的实例。`$request` 通过 `ServerRequestFactory::fromGlobals()`\
    \ 创建。`$response` 是一个新的 `Response`。\n\n`Glide` 的 `outputImage` 方法使用参数 `['w' =>\
    \ 300, 'h' => 200]` 处理 `example.jpg`，并传入 `$request` 和 `$response`。这演示了 `Glide`\
    \ 如何动态处理图像。\n\n## 27. VarDumper\n\n`Dumper` 是 Symfony 的一个组件，提供变量的可读版本。它对于调试特别有用。\n\
    \n### ：VarDumper\n```php\n<?php\nrequire 'vendor/autoload.php';\nuse Symfony\\\
    Component\\VarDumper\\Dumper;\n\n$array = [\n    'name' => 'John',\n    'age'\
    \ => 30,\n    'hobbies' => ['reading', 'cycling'],\n];\n\ndump($array);\n```\n\
    输出如下：\n```\narray(3) {\n  \"name\" => \"John\"\n  \"age\" => 30\n  \"hobbies\"\
    \ => array(2) {\n    0 => \"reading\"\n    1 => \"cycling\"\n  }\n}\n```\n在上面的代码中，我们引入了自动加载文件。我们使用了\
    \ `Symfony` 的 `VarDumper` 组件。我们定义了一个包含 `name`、`age` 和嵌套 `hobbies` 数组的 `$array`。当我们调用\
    \ `dump($array)` 时，它会输出数组的结构化视图。\n\n## 28. PsySH\n\n`PsySH` 是一个 PHP 的运行时开发者控制台、交互式调试器和\
    \ REPL（读取-评估-打印循环）。它允许开发者在命令行中交互式地执行 PHP 代码。\n\n### ：PsySH\n```bash\nPsy Shell\
    \ v0.x.x (PHP x.x.x — cli) by Justin Hileman\n>>> $a = \"Hello\";\nNULL\n>>> $a;\n\
    \"Hello\"\n```\n要使用 `PsySH`，你首先确保它已全局安装在系统中，或者通过 Composer 安装在特定的 PHP 项目中。安装完成后，你可以在终端中输入\
    \ `psysh` 来启动 PsySH shell。该命令会启动一个交互式 shell 会话，你可以在命令行中直接输入并执行 PHP 代码。\n\n"
- fmt: "\n# 29. GuzzleHttp\n\nGuzzleHttp is a PHP HTTP client that makes it easy to\
    \ send HTTP requests and trivial to integrate with web services.\n\n### Ex:GuzzleHttp\n\
    ```php\n// Install GuzzleHttp via Composer\ncomposer require guzzlehttp/guzzle:~6.0\n\
    \n// Example PHP code to send a GET request using GuzzleHttp\nrequire 'vendor/autoload.php';\n\
    $client = new \\GuzzleHttp\\Client();\n$response = $client->request('GET', 'https://api.github.com/repos/guzzle/guzzle');\n\
    echo $response->getStatusCode(); // 200\necho $response->getBody();\n```\n\n###\
    \ 200\nThe body of the response from GitHub API about the Guzzle repository.\n\
    \nIn this example, we're first installing GuzzleHttp using Composer, a dependency\
    \ manager for PHP. The command `composer require guzzlehttp/guzzle:~6.0` adds\
    \ `GuzzleHttp` to our project, specifically version 6 or later. \n\nThe PHP code\
    \ starts by loading the Composer-generated autoloader script, which ensures that\
    \ the `GuzzleHttp` classes are automatically loaded when we use them. We then\
    \ create a new instance of the `GuzzleHttp\\Client` class, which is the main class\
    \ used for sending HTTP requests. \n\nThe `$client->request('GET', 'https://api.github.com/repos/guzzle/guzzle')`\
    \ line sends a GET request to GitHub's API for information about the Guzzle repository.\
    \ `GuzzleHttp` makes handling HTTP requests and responses straightforward, abstracting\
    \ away the underlying `curl` commands and other low-level details.\n\nThe `getStatusCode()`\
    \ method on the response object returns the HTTP status code of the response,\
    \ which is 200 for a successful request. The `getBody()` method returns the body\
    \ of the response, which in this case would include details about the Guzzle repository\
    \ in JSON format. \n\nThis example demonstrates how to use `GuzzleHttp` for making\
    \ simple HTTP requests, handling the response, and accessing the status code and\
    \ body of the response. `GuzzleHttp` is versatile and supports a wide range of\
    \ HTTP client features, including asynchronous requests, middleware, and more,\
    \ making it a powerful tool for PHP developers working with web services.\n\n\
    # 30. PHPMailer\n\nPHPMailer is a email creation and transport class for PHP,\
    \ supporting SMTP and other email delivery methods.\n\n### Ex:PHPMailer\n```php\n\
    // Install PHPMailer via Composer\ncomposer require phpmailer/phpmailer\n\n//\
    \ Example PHP code to send an email using PHPMailer\nrequire 'vendor/autoload.php';\n\
    $mail = new PHPMailer\\PHPMailer\\PHPMailer();\n$mail->isSMTP();\n$mail->Host\
    \ = 'smtp.example.com';\n$mail->SMTPAuth = true;\n$mail->Username = 'your_email@example.com';\n\
    $mail->Password = 'your_password';\n$mail->SMTPSecure = 'tls';\n$mail->Port =\
    \ 587;\n$mail->setFrom('from@example.com', 'Mailer');\n$mail->addAddress('recipient@example.com',\
    \ 'Recipient Name');\n$mail->Subject = 'Here is the subject';\n$mail->Body = 'This\
    \ is the HTML message body in bold!';\n$mail->AltBody = 'This is the body in plain\
    \ text for non-HTML mail clients';\nif(!$mail->send()) {\n    echo 'Message could\
    \ not be sent.';\n    echo 'Mailer Error: ' . $mail->ErrorInfo;\n} else {\n  \
    \  echo 'Message has been sent';\n}\n```\n\n### Message has been sent\nThis example\
    \ demonstrates the use of `PHPMailer`, a powerful, full-featured library for sending\
    \ emails from PHP scripts. First, we install PHPMailer using Composer with the\
    \ command `composer require phpmailer/phpmailer`, which downloads the library\
    \ and its dependencies into our project.\n\nThe code snippet shows how to send\
    \ an email using `PHPMailer`. We start by creating an instance of the `PHPMailer\\\
    PHPMailer\\PHPMailer` class. Then, we configure it to use SMTP for sending the\
    \ email, which involves specifying the SMTP server details, authentication credentials,\
    \ and the encryption protocol (TLS in this case).\n\nThe `setFrom` method specifies\
    \ the sender's email address and name, while the `addAddress` method adds a recipient.\
    \ The `Subject`, `Body`, and `AltBody` properties set the email content. \n\n\
    The `send` method attempts to send the email. If successful, it returns true,\
    \ and we print a confirmation. If not, it returns false, and we print an error\
    \ message. This example highlights PHPMailer's ability to simplify email sending.\n\
    \n# 31. Aura.Sql\n\nAura.Sql is an extension of the PDO class that provides advanced\
    \ features for database interaction, such as lazy connection, array quoting, and\
    \ a profiler. It aims to enhance PDO usage.\n\n### Ex:Aura.Sql\n```php\n<?php\n\
    require 'vendor/autoload.php';\n// Create a new Aura.Sql instance for MySQL\n\
    $pdo = new Aura\\Sql\\ExtendedPdo('mysql:host=localhost;dbname=test', 'username',\
    \ 'password');\n// Example of query with array quoting\n$query = \"SELECT * FROM\
    \ users WHERE id IN (:user_ids)\";\n$result = $pdo->fetchAll($query, ['user_ids'\
    \ => [1, 2, 3]]);\necho json_encode($result);\n?>\n```\n\n### A JSON representation\
    \ of the users with IDs 1, 2, and 3 from the \"users\" table.\nIn the example\
    \ above, we start by including the `vendor/autoload.php` file, which is generated\
    \ by Composer, to autoload our dependencies. We then instantiate an `ExtendedPdo`\
    \ object with our database connection details. `Aura.Sql` extends PHP's native\
    \ `PDO` class, adding more functionality while keeping PDO's simplicity.\n\nThe\
    \ `fetchAll` method is used to execute a query and retrieve all matching rows.\
    \ The query includes a placeholder `:user_ids`, which is an array of user IDs\
    \ we want to select. `Aura.Sql\\ExtendedPdo` class allows us to directly pass\
    \ an array for a placeholder in the query, and it will handle the conversion and\
    \ quoting of the array into a string suitable for the SQL execution. This feature\
    \ is particularly useful for queries that need to filter results based on a list\
    \ of values, avoiding manual concatenation and quoting of array values into the\
    \ SQL string.\n\nFinally, we use `json_encode` to convert the result set into\
    \ a JSON string for display.\n"
  raw: "  29\\. GuzzleHttp    GuzzleHttp is a PHP HTTP client that makes it easy to\
    \ send HTTP requests and trivial to integrate with web services.    –––––––– \
    \   Ex:GuzzleHttp       // Install GuzzleHttp via Composer       composer require\
    \ guzzlehttp/guzzle:~6.0// Example PHP code to send a GET request using GuzzleHttp\
    \       require 'vendor/autoload.php';$client \\= new \\\\GuzzleHttp\\\\Client();\
    \       $response \\= $client->request('GET', 'https://api.github.com/repos/guzzle/guzzle');echo\
    \ $response->getStatusCode(); // 200       echo $response->getBody();    ––––––––\
    \    200       The body of the response from GitHub API about the Guzzle repository.\
    \    ––––––––    In this example, we're first installing GuzzleHttp using Composer,\
    \ a dependency manager for PHP. The command composer require guzzlehttp/guzzle:~6.0\
    \ adds GuzzleHttp to our project, specifically version 6 or later.The PHP code\
    \ starts by loading the Composer-generated autoloader script, which ensures that\
    \ the GuzzleHttp classes are automatically loaded when we use them. We then create\
    \ a new instance of the GuzzleHttp\\\\Client class, which is the main class used\
    \ for sending HTTP requests.The $client->request('GET', 'https://api.github.com/repos/guzzle/guzzle')\
    \ line sends a GET request to GitHub's API for information about the Guzzle repository.\
    \ GuzzleHttp makes handling HTTP requests and responses straightforward, abstracting\
    \ away the underlying curl commands and other low-level details.The getStatusCode()\
    \ method on the response object returns the HTTP status code of the response,\
    \ which is 200 for a successful request. The getBody() method returns the body\
    \ of the response, which in this case would include details about the Guzzle repository\
    \ in JSON format.This example demonstrates how to use GuzzleHttp for making simple\
    \ HTTP requests, handling the response, and accessing the status code and body\
    \ of the response. GuzzleHttp is versatile and supports a wide range of HTTP client\
    \ features, including asynchronous requests, middleware, and more, making it a\
    \ powerful tool for PHP developers working with web services.  \n\n  30\\. PHPMailer\
    \    PHPMailer is a email creation and transport class for PHP, supporting SMTP\
    \ and other email delivery methods.    ––––––––    Ex:PHPMailer       // Install\
    \ PHPMailer via Composer       composer require phpmailer/phpmailer// Example\
    \ PHP code to send an email using PHPMailer       require 'vendor/autoload.php';$mail\
    \ \\= new PHPMailer\\\\PHPMailer\\\\PHPMailer();       $mail->isSMTP();       $mail->Host\
    \ \\= 'smtp.example.com';       $mail->SMTPAuth \\= true;       $mail->Username\
    \ \\= 'your\\_email@example.com';       $mail->Password \\= 'your\\_password';\
    \       $mail->SMTPSecure \\= 'tls';       $mail->Port \\= 587;$mail->setFrom('from@example.com',\
    \ 'Mailer');       $mail->addAddress('recipient@example.com', 'Recipient Name');\
    \       $mail->Subject \\= 'Here is the subject';       $mail->Body \\= 'This\
    \ is the HTML message body **in** **bold!**';      $mail->AltBody \\= 'This is\
    \ the body in plain text for non-HTML mail clients';if(!$mail->send()) {       echo\
    \ 'Message could not be sent.';       echo 'Mailer Error: ' . $mail->ErrorInfo;\
    \       } else {       echo 'Message has been sent';       }    ––––––––    Message\
    \ has been sent       This example demonstrates the use of PHPMailer, a powerful,\
    \ full-featured library for sending emails from PHP scripts. First, we install\
    \ PHPMailer using Composer with the command composer require phpmailer/phpmailer,\
    \ which downloads the library and its dependencies into our project.The code snippet\
    \ shows how to send an email using PHPMailer. We start by creating an instance\
    \ of the PHPMailer\\\\PHPMailer\\\\PHPMailer class. Then, we configure it to use\
    \ SMTP for sending the email, which involves specifying the SMTP server details,\
    \ authentication credentials, and the encryption protocol (TLS in this case).The\
    \ setFrom method specifies the sender's email address and name, while the addAddress\
    \ method adds a recipient. You can call addAddress multiple times to add multiple\
    \ recipients. The Subject, Body, and AltBody properties set the email's subject,\
    \ HTML body, and plain text body, respectively. The plain text body is used for\
    \ email clients that do not support HTML.The send method attempts to send the\
    \ email. If successful, it returns true, and we print a confirmation message.\
    \ If not, it returns false, and we print an error message along with the error\
    \ information from PHPMailer.This example highlights PHPMailer's ability to simplify\
    \ email sending in PHP, including configuring SMTP settings, setting email content,\
    \ and handling errors. PHPMailer supports many other features not shown here,\
    \ such as attachments, custom headers, and more.  \n\n  31\\. Aura.Sql    Aura.Sql\
    \ is an extension of the PDO class that provides advanced features for database\
    \ interaction, such as lazy connection, array quoting, query building, and a profiler.\
    \ It aims to enhance PDO usage by offering convenient methods for common tasks\
    \ and queries.    ––––––––    Ex:Aura.Sql       ?php </span      require 'vendor/autoload.php';\
    \       // Create a new Aura.Sql instance for MySQL.       $pdo \\= new Aura\\\
    \\Sql\\\\ExtendedPdo('mysql:host=localhost;dbname=test', 'username', 'password');\
    \       // Example of query with array quoting       $query \\= \"SELECT \\* FROM\
    \ users WHERE id IN (:user\\_ids)\";       $result \\= $pdo->fetchAll($query,\
    \ \\['user\\_ids' \\=> \\[1, 2, 3\\]\\]);       echo json\\_encode($result); \
    \      ?>    ––––––––    A JSON representation of the users with IDs 1, 2, and\
    \ 3 from the \"users\" table.       In the example above, we start by including\
    \ the vendor/autoload.php file, which is generated by Composer, to autoload our\
    \ dependencies. We then instantiate an ExtendedPdo object with our database connection\
    \ details. Aura.Sql extends PHP's native PDO class, adding more functionality\
    \ while keeping PDO's simplicity.The method fetchAll is used to execute a SELECT\
    \ query and retrieve all matching rows. The query includes a placeholder :user\\\
    _ids, which is an array of user IDs we want to select. Aura.Sql's ExtendedPdo\
    \ class allows us to directly pass an array for a placeholder in the query, and\
    \ it will handle the conversion and quoting of the array into a string suitable\
    \ for the SQL execution. This feature is particularly useful for queries that\
    \ need to filter results based on a list of values, avoiding manual concatenation\
    \ and quoting of array values into the SQL string.Finally, we use json\\_encode\
    \ to convert the result set into a JSON string for display. This is a common practice\
    \ when building web applications or APIs that need to return data in a format\
    \ easily consumable by JavaScript and other languages.  "
