  trans: "\n\n# 46. Stomp PHP\n\nStomp PHP 是一个用于与支持 STOMP 协议的消息代理交互的客户端库，允许 PHP 应用程序与消息系统通信，实现异步消息和集成模式。\n\
    \n## 示例：Stomp PHP\n\n```php\n// 使用 Stomp PHP 向队列发送消息的示例\nuse Stomp\\Client;\n\
    use Stomp\\SimpleStomp;\n$stompClient = new Client('tcp://broker.example.com:61613');\n\
    $stompClient->connect();\n$stomp = new SimpleStomp($stompClient);\n// 向队列发送消息\n\
    $stomp->send('/queue/test', 'Hello, world!');\n// 断开连接\n$stompClient->disconnect();\n\
    echo \"Message sent!\";\n```\n\n消息发送！\n\n在这里，我们展示了如何使用 Stomp PHP 向队列发送消息。这个示例直观地演示了\
    \ PHP 应用程序与消息系统之间的异步消息传递：首先，我们创建一个新的 `Client` 实例，指定支持 STOMP 协议的消息代理的 URL。然后，我们使用\
    \ `connect` 方法与代理建立连接。使用 `stompClient` 实例化一个 `SimpleStomp` 对象。`SimpleStomp` 类是\
    \ `Client` 的便捷封装器，用于简化操作。通过 `send` 方法，我们将消息发布到特定队列（`/queue/test`）。此示例中的消息负载是一个简单的字符串\
    \ \"Hello, world!\"。发送消息后，我们通过调用 `disconnect` 方法正确地断开与代理的连接。输出 \"Message sent!\"\
    \ 确认操作成功。此示例演示了 PHP 应用程序如何使用 Stomp PHP 库轻松地与消息系统集成，从而实现了事件驱动架构或简单队列等通信模式，且服务之间没有紧密耦合。\n\
    \n# 47. Imagine\n\nImagine 是一个用于图像处理的 PHP 库。它提供了一个简单的 API 来执行缩放、裁剪和应用过滤器等图像操作。Imagine\
    \ 支持 GD2、Imagick 和 Gmagick 等不同的图像库作为后端。\n\n## 示例：Imagine\n\n```php\nrequire 'vendor/autoload.php';\n\
    use Imagine\\Gd\\Imagine;\nuse Imagine\\Image\\Box;\n$imagine = new Imagine();\n\
    $image = $imagine->open('path/to/image.jpg');\n$image->resize(new Box(200, 200))->save('path/to/destination/image.jpg');\n\
    ```\n\n这段代码将图像缩放到 200x200 像素并保存缩放后的图像。\n\n代码首先包含了 Composer 自动加载器，这允许 PHP 自动加载\
    \ Imagine 库中所需的类。然后从 Imagine 库导入必要的类。具体来说，它导入了 `Imagine\\Gd\\Imagine` 类（代表使用 GD2\
    \ 库的 Imagine 服务）以及 `Imagine\\Image\\Box` 类（代表尺寸框）。接下来，它创建了一个 `Imagine` 对象的实例。该对象用于打开指定路径的图像文件。随后对图像对象进行缩放。缩放操作通过创建一个所需尺寸的\
    \ `Box` 对象（在本例中为 200x200 像素）并传递给图像对象的 `resize` 方法来实现。最后，将缩放后的图像保存到新的文件路径。此示例使用了\
    \ GD2 库，但如果安装并配置了，Imagine 也可以使用 Imagick 或 Gmagick，根据服务器的 PHP 环境和可用的图像处理库提供灵活性。\n\
    \n# 48. PHP League's CSV\n\nPHP League's CSV 是一个处理 CSV 数据的库。它允许以内存高效且可扩展的方式轻松读取、写入和处理\
    \ CSV 文件。该库支持 CSV 控制项，如分隔符、包符和转义字符，使其适用于各种 CSV 格式。\n\n## 示例：PHP League's CSV\n\
    \n```php\nrequire 'vendor/autoload.php';\nuse League\\Csv\\Reader;\n$csv = Reader::createFromPath('path/to/csv/file.csv',\
    \ 'r');\n$csv->setHeaderOffset(0); // 设置表头偏移\n$results = $csv->getRecords(); //\
    \ 获取所有记录\nforeach ($results as $record) {\n    print_r($record);\n}\n```\n\n这段代码打印\
    \ CSV 文件中的所有记录，假设第一行为表头。此示例演示了如何使用 PHP League's CSV 库处理数据。首先，我们使用 `Reader::createFromPath`\
    \ 创建 `Reader` 实例，并指定路径和模式 ('r'）。我们使用 `setHeaderOffset(0)` 设置表头。`getRecords` 方法获取所有记录。`foreach`\
    \ 循环遍历记录并使用 `print_r` 输出记录。\n\n# 49. Symfony Validator\n\nSymfony Validator 组件是一个提供数据验证工具的库。它通过约束支持对象、数组等类型。它被广泛用于确保数据完整性和验证用户输入。\n\
    \n## 示例：Symfony Validator\n\n```php\nuse Symfony\\Component\\Validator\\Validation;\n\
    use Symfony\\Component\\Validator\\Constraints\\Length;\nuse Symfony\\Component\\\
    Validator\\Constraints\\NotBlank;\n\n$validator = Validation::createValidator();\n\
    $violations = $validator->validate('Hello World', [\n    new Length(['min' =>\
    \ 10]),\n    new NotBlank(),\n]);\n\nif (0 !== count($violations)) {\n    // 存在错误，获取它们\n\
    \    foreach ($violations as $violation) {\n        echo $violation->getMessage().\"\
    \\n\";\n    }\n} else {\n    echo \"验证通过!\\n\";\n}\n```\n\n验证通过！\n\n在此示例中，我们使用\
    \ Symfony Validator 组件对简单的字符串 \"Hello World\" 进行验证。首先，从 Symfony Validator 命名空间导入必要的类。然后，我们使用\
    \ `Validation::createValidator()` 方法创建一个验证实例。接下来，我们通过约束定义验证标准。在这里，我们使用了两个约束：`Length`\
    \ 用于确保字符串至少有 10 个字符，`NotBlank` 用于确保字符串不为空。这些约束作为数组传递给验证对象的 `validate` 方法，并连同我们要验证的字符串。`validate`\
    \ 方法根据我们的约束检查字符串并返回违规列表。如果有任何违规情况（即字符串不符合我们指定的标准），我们会遍历它们并打印违规信息。如果没有违规情况，说明我们的字符串通过了验证，我们输出“验证通过！”。\n\
    \n"
- fmt: "\n# 50. Laravel Excel\n\nLaravel Excel is a package that provides an interface\
    \ for importing and exporting Excel and CSV files in Laravel applications. It\
    \ wraps the functionality of the `PhpSpreadsheet` library, making it more accessible\
    \ and easier to use within the Laravel framework. It supports exporting models,\
    \ collections, and views to Excel files, as well as importing data directly to\
    \ models.\n\n### Ex:Laravel Excel\n\n```php\nuse Maatwebsite\\Excel\\Facades\\\
    Excel;\nuse App\\Exports\\UsersExport;\nRoute::get('/export-users', function ()\
    \ {\n    return Excel::download(new UsersExport, 'users.xlsx');\n});\n```\n\n\
    This code, when executed within a Laravel application, initiates the download\
    \ of an Excel file named `users.xlsx` containing user data.\n\nIn this simplified\
    \ example, we're showcasing how to use the Laravel Excel package to export data\
    \ to an Excel file. First, we assume that there is a Laravel route defined to\
    \ handle a specific URI (`/export-users`). When a `GET` request is made to this\
    \ URI, the closure function is executed.\n\nInside the function, we use the `Excel`\
    \ facade provided by the Laravel Excel package. The `download` method is called\
    \ on the facade, which initiates an export operation. This method takes two arguments:\
    \ an export object and the desired filename for the resulting Excel file. In this\
    \ case, we're passing an instance of `UsersExport`, a custom export class that\
    \ defines how user data should be exported, and a filename `users.xlsx`.\n\nThe\
    \ `UsersExport` class is not shown here but it typically extends one of the base\
    \ classes provided by Laravel Excel and implements its requirements, such as defining\
    \ which data to export and how it should be formatted.\n\nThis example demonstrates\
    \ the ease with which Laravel Excel integrates with Laravel applications, enabling\
    \ developers to implement data export features with minimal code. It's a powerful\
    \ tool for working with Excel and CSV files, providing a fluent and Laravel-friendly\
    \ API for tasks that would otherwise require more complex and less intuitive code.\n\
    \n# 51. PHP_CodeSniffer\n\nPHP_CodeSniffer is a library that helps in enforcing\
    \ a coding standard and detecting violations of defined coding standards in PHP,\
    \ JavaScript, and CSS files. It includes built-in standards such as `PEAR` and\
    \ `PSR1`/`PSR2`, and it allows for custom standards as well.\n\n### Ex:PHP_CodeSniffer\n\
    \n```bash\n# Install PHP_CodeSniffer using Composer\ncomposer require \"squizlabs/php_codesniffer*\"\
    \n\n# Check coding standards in a specific file\n./vendor/bin/phpcs /path/to/your/file.php\n\
    ```\n\nOutput will display a list of coding standard violations (if any) found\
    \ in the specified file, including line numbers and descriptions of the issues.\n\
    \nThe first command in the code snippet is how you install `PHP_CodeSniffer` using\
    \ `Composer`, which is a dependency manager. The second command `./vendor/bin/phpcs\
    \ /path/to/your/file.php` is used to check coding standards in a specific file.\
    \ The `phpcs` tool scans the file against the defined standards and reports any\
    \ violations it finds.\n\n# 52. PHPMD (PHP Detector)\n\nPHPMD is a user-friendly\
    \ utility that scans code for potential bugs, suboptimal code, unused parameters,\
    \ properties. It's aimed at improving code quality.\n\n### Ex:PHPMD (PHP Detector)\n\
    \n```bash\n# Install PHPMD using Composer\ncomposer require \"squizlabs/php_codesniffer=squizlabs/php_codesniffer*\"\
    \n\n# Analyze a specific file\n./vendor/bin/pmd /path/to/your/file.php\n```\n\n\
    The output will display a list of coding standard violations (if any) found in\
    \ the specified file, including line numbers and descriptions of the issues. The\
    \ first command in the code snippet is how you install `PHPMD` using `Composer`,\
    \ a dependency manager. The second command `./vendor/bin/pmd /path/to/your/file.php`\
    \ is used to analyze a specific file. The `pmd` tool scans the file against defined\
    \ rules and reports any violations it finds.\n\n# 53. GuzzleHttp\\Psr7\n\nProvides\
    \ utilities for working with PSR-7 message interfaces.\n\n### Ex:GuzzleHttp\\\
    Psr7\n\n```php\nuse GuzzleHttp\\Psr7\\Stream;\n$stream = GuzzleHttp\\Psr7\\Utils::streamFor('Hello,\
    \ world!');\necho $stream->read(5);\n```\n\nThis example demonstrates how to create\
    \ a stream from a string using the `GuzzleHttp\\Psr7\\Utils::streamFor` method,\
    \ which is part of the `GuzzleHttp\\Psr7` package. The package itself offers a\
    \ set of utilities for handling HTTP messages according to the PSR-7 standard.\
    \ In the example, we create a stream that contains \"Hello, world!\" and then\
    \ read the first 5 characters from it using the `read` method of the `Stream`\
    \ class. This operation results in the output \"Hello\", showcasing a simple way\
    \ to work with stream contents in PHP.\n\n# 54. League\\Uri\n\nAllows manipulation\
    \ and validation of URIs in PHP.\n\n### Ex:League\\Uri\n\n```php\nuse League\\\
    Uri\\UriString;\n$uri = 'https://example.com:443/path?query=123#fragment';\n$components\
    \ = UriString::parse($uri);\necho $components['scheme'];\n```\n\nIn this snippet,\
    \ we're using the `League\\Uri` package, specifically the `UriString` class, to\
    \ parse a URI string and extract its components. The `UriString::parse` method\
    \ decomposes the given URI into its constituent parts, such as scheme, host, port,\
    \ path, query, and fragment. By accessing the `scheme` key from the resulting\
    \ array, we can see the protocol (in this case, `https`) used in the URI. This\
    \ functionality is incredibly useful for web applications that need to manipulate\
    \ or validate URLs, as it provides a straightforward interface for breaking down\
    \ and examining the structure of URIs.\n"
