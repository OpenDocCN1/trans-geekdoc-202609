  trans: "\n\n# 50. Laravel Excel\n\nLaravel Excel 是一个为 Laravel 应用程序提供导入和导出 Excel\
    \ 及 CSV 文件的接口的包。它封装了 `PhpSpreadsheet` 库的功能，使其在 Laravel 框架内更加易用且易上手。它支持将模型（models）、集合（collections）和视图（views）导出到\
    \ Excel 文件，并将数据直接导入模型。\n\n### 示例：Laravel Excel\n\n```php\nuse Maatwebsite\\Excel\\\
    Facades\\Excel;\nuse App\\Exports\\UsersExport;\nRoute::get('/export-users', function\
    \ () {\n    return Excel::download(new UsersExport, 'users.xlsx');\n});\n```\n\
    \n这段代码在 Laravel 应用中执行时，会启动下载名为 `users.xlsx` 的包含用户数据的 Excel 文件。\n\n在这个简化示例中，我们展示了如何使用\
    \ Laravel Excel 包将数据导出到 Excel 文件。首先，我们假设已经定义了一个 Laravel 路由来处理特定的 URI (`/export-users`)。当向此\
    \ URI 发起 `GET` 请求时，就会执行该闭包函数。\n\n在函数内部，我们使用了 Laravel Excel 包提供的 `Excel` 门面（facade）。通过在该门面上调用\
    \ `download` 方法来启动导出操作。该方法接受两个参数：一个导出对象以及目标 Excel 文件所需的文件名。在这种情况下，我们传递了一个 `UsersExport`\
    \ 实例（这是一个自定义的导出类，定义了如何导出用户数据）以及一个文件名 `users.xlsx`。\n\n`UsersExport` 类在此未列出，但它通常扩展\
    \ Laravel Excel 提供的基类之一，并实现其要求，例如定义要导出哪些数据以及如何格式化。\n\n此示例演示了 Laravel Excel 与 Laravel\
    \ 应用程序集成的便利性，使开发者能够以极少的代码实现数据导出功能。它是处理 Excel 和 CSV 文件的强大工具，为那些原本需要更复杂、更不直观代码的任务提供了流式且符合\
    \ Laravel 习惯的 API。\n\n# 51. PHP_CodeSniffer\n\nPHP_CodeSniffer 是一个库，帮助强制执行编码标准，并检测\
    \ PHP、JavaScript 和 CSS 文件中违反已定义编码标准的违规行为。它包含了内置标准，如 `PEAR` 和 `PSR1`/`PSR2`，并且也允许自定义标准。\n\
    \n### 示例：PHP_CodeSniffer\n\n```bash\n# 使用 Composer 安装 PHP_CodeSniffer\ncomposer\
    \ require \"squizlabs/php_codesniffer*\"\n\n# 检查特定文件的编码标准\n./vendor/bin/phpcs\
    \ /path/to/your/file.php\n```\n\n输出将显示在指定文件中发现的编码标准违规行为列表（如果有），包括行号和问题描述。\n\n\
    代码段中的第一条命令展示了如何使用包依赖管理器 `Composer` 安装 `PHP_CodeSniffer`。第二条命令 `./vendor/bin/phpcs\
    \ /path/to/your/file.php` 用于检查特定文件的编码标准。`phpcs` 工具会根据定义的标准扫描文件，并报告发现的任何违规行为。\n\
    \n# 52. PHPMD (PHP 检测器)\n\nPHPMD 是一个用户友好的工具，用于扫描代码中的潜在 Bug、次优代码、未使用的参数和属性。它的目标是提高代码质量。\n\
    \n### 示例：PHPMD (PHP 检测器)\n\n```bash\n# 使用 Composer 安装 PHPMD\ncomposer require\
    \ \"squizlabs/php_codesniffer=squizlabs/php_codesniffer*\"\n\n# 分析特定文件\n./vendor/bin/pmd\
    \ /path/to/your/file.php\n```\n\n输出将显示在指定文件中发现的编码标准违规行为列表（如果有），包括行号和问题描述。代码段中的第一条命令展示了如何使用包依赖管理器\
    \ `Composer` 安装 `PHPMD`。第二条命令 `./vendor/bin/pmd /path/to/your/file.php` 用于分析特定文件。`pmd`\
    \ 工具根据定义的规则扫描文件并报告发现的任何违规。\n\n# 53. GuzzleHttp\\Psr7\n\n提供了处理 PSR-7 消息接口的工具。\n\
    \n### 示例：GuzzleHttp\\Psr7\n\n```php\nuse GuzzleHttp\\Psr7\\Stream;\n$stream =\
    \ GuzzleHttp\\Psr7\\Utils::streamFor('Hello, world!');\necho $stream->read(5);\n\
    ```\n\n此示例演示了如何使用 `GuzzleHttp\\Psr7\\Utils::streamFor` 方法从字符串创建流，该方法是 `GuzzleHttp\\\
    Psr7` 包的一部分。该包本身提供系列根据 PSR-7 标准处理 HTTP 消息的工具。在示例中，我们创建了一个包含 \"Hello, world!\"\
    \ 的流，然后使用 `Stream` 类的 `read` 方法从其读取前 5 个字符。此操作的结果输出为 \"Hello\"，展示了在 PHP 中处理流内容的简单方法。\n\
    \n# 54. League\\Uri\n\n允许在 PHP 中对 URI 进行操作和验证。\n\n### 示例：League\\Uri\n\n```php\n\
    use League\\Uri\\UriString;\n$uri = 'https://example.com:443/path?query=123#fragment';\n\
    $components = UriString::parse($uri);\necho $components['scheme'];\n```\n\n在代码段中，我们使用\
    \ `League\\Uri` 包（特别是 `UriString` 类）来解析 URI 字符串并提取其组件。`UriString::parse` 方法将指定的\
    \ URI 分解为各个组成部分，如方案（scheme）、主机、端口、路径、查询和片段。通过访问结果数组中的 `scheme` 键，我们可以查看 URI 中使用的协议（在本例中为\
    \ `https`）。此功能对于需要操作或验证 URL 的 Web 应用程序有用，因为它提供了一个直接的接口来分解和检查 URI 的结构。\n\n"
- fmt: "\n# 55. Symfony Process\n\nThe Symfony Process component allows you to execute\
    \ system commands in PHP applications, providing an object-oriented abstraction\
    \ over the `proc_open` function. It offers a way to run processes asynchronously,\
    \ handle their input/output, and get their exit status.\n\n### Ex: Symfony Process\n\
    \n```php\nuse Symfony\\Component\\Process\\Process;\n$process = new Process(['ls',\
    \ '-l']);\n$process->run();\n// Executes after the command finishes\nif (!$process->isSuccessful())\
    \ {\n    throw new RuntimeException($process->getErrorOutput());\n}\necho $process->getOutput();\n\
    ```\n\nThe result will be a detailed list of files and directories in the current\
    \ working directory, similar to what you would get from running `ls -l` in a terminal.\n\
    \nThis code snippet demonstrates the usage of the Symfony Process component to\
    \ execute a simple `ls -l` command, which lists files and directories with detailed\
    \ information in the current directory. Here's a breakdown:\n\n- We begin by importing\
    \ the `Process` class from the `Symfony Component` namespace.\n- An instance of\
    \ the `Process` class is created with the command to run (`ls -l`) as an argument.\
    \ This command is platform-dependent, so on Windows, you might use something like\
    \ `['cmd', '/c', 'dir']`.\n- The `run()` method is called to execute the command.\
    \ This method is blocking; it waits for the process to finish before moving to\
    \ the next line of code.\n- We check if the process completed successfully with\
    \ `isSuccessful()`. If it didn't, an exception is thrown with the error output.\n\
    - Finally, we print the command's output using `getOutput()`, which in this case,\
    \ lists the contents of the current directory.\n\nThis component is especially\
    \ useful for executing long-running commands, handling real-time output, or running\
    \ processes in the background.\n\n# 56. PHP League's Omnipay\n\nOmnipay is a payment\
    \ processing library for PHP. It provides a consistent, standardized interface\
    \ for interacting with multiple payment gateways, including Stripe, PayPal, and\
    \ many others. It abstracts the differences among various payment gateways, allowing\
    \ developers to work with a single, unified API.\n\n### Ex: PHP League's Omnipay\n\
    \n```php\nuse Omnipay\\Omnipay;\n$gateway = Omnipay::create('Stripe');\n$gateway->setApiKey('your_stripe_api_key');\n\
    $response = $gateway->purchase([\n    'amount' => '10.00',\n    'currency' =>\
    \ 'USD',\n    'token' => 'card_token',\n])->send();\nif ($response->isSuccessful())\
    \ {\n    // Payment was successful\n    echo $response->getTransactionReference();\n\
    } else {\n    // Payment failed\n    echo $response->getMessage();\n}\n```\n\n\
    The result depends on the payment outcome. On success, it will output the transaction\
    \ reference ID provided by Stripe. On failure, it will output an error message.\n\
    \nThis example demonstrates how to make a simple payment charge using Omnipay\
    \ with the Stripe gateway. Here's a detailed explanation:\n\n- First, we include\
    \ the necessary `Omnipay` namespace and use the `create()` method to initialize\
    \ the desired payment gateway, in this case, Stripe.\n- The `setApiKey` method\
    \ is used to authenticate with Stripe using your API key.\n- We then prepare and\
    \ send a purchase request with the `purchase()` method, passing an array that\
    \ includes the charge amount, currency, and a payment token. The payment token\
    \ is typically obtained on the client side using Stripe's JavaScript library.\n\
    - The `send()` method actually sends the request to Stripe and returns a response\
    \ object.\n- We check if the payment was successful by calling `isSuccessful()`\
    \ on the response object. If it's successful, we get and display the transaction\
    \ reference. Otherwise, we display the error message provided by Stripe.\n\nOmnipay\
    \ abstracts much of the boilerplate code required for processing payments, making\
    \ it easier to work with different payment gateways using the same codebase.\n\
    \n# 57. Symfony HttpFoundation\n\nThe Symfony HttpFoundation component defines\
    \ an object-oriented layer for the HTTP specification. It simplifies request and\
    \ response handling, providing a more flexible and powerful way to manage HTTP\
    \ operations compared to PHP's traditional superglobals (`$_GET`, `$_POST`, etc.)\
    \ and functions (`header()`, `setcookie()`, etc.).\n\n### Ex: Symfony HttpFoundation\n\
    \n```php\nuse Symfony\\Component\\HttpFoundation\\Request;\nuse Symfony\\Component\\\
    HttpFoundation\\Response;\n$request = Request::createFromGlobals();\n$response\
    \ = new Response();\n$response->setContent('Hello, world!');\n$response->setStatusCode(Response::HTTP_OK);\n\
    $response->headers->set('Content-Type', 'text/plain');\n$response->send();\n```\n\
    \nThis code sends an HTTP response with the content \"Hello, world!\", a status\
    \ code of 200 (OK), and the Content-Type header set to text/plain.\n\nHere's a\
    \ breakdown of the code:\n\n- First, we import the `Request` and `Response` classes\
    \ from the `Symfony HttpFoundation` component.\n- `$request = Request::createFromGlobals()`\
    \ creates a new `Request` object based on the global PHP variables (such as `$_GET`,\
    \ `$_POST`, etc.). This line is not directly used in this simple example but demonstrates\
    \ how to start handling an HTTP request.\n- `$response = new Response()` creates\
    \ a new, empty `Response` object.\n- `$response->setContent('Hello, world!')`\
    \ sets the body of the response to \"Hello, world!\".\n- `$response->setStatusCode(Response::HTTP_OK)`\
    \ sets the HTTP status code of the response to 200, which means OK. The HttpFoundation\
    \ component provides constants for most HTTP status codes, making your code more\
    \ readable.\n- `$response->headers->set('Content-Type', 'text/plain')` adds a\
    \ header to the response indicating that the content type of the response body\
    \ is plain text.\n- Finally, `$response->send()` sends the response to the client.\
    \ This includes the status line, headers, and the body of the response. This line\
    \ is what actually outputs the response to the client's web browser or HTTP client.\n\
    \nUsing the Symfony HttpFoundation component makes your code more object-oriented\
    \ and easier to read and maintain. It abstracts away the global PHP variables\
    \ and functions, giving you a more straightforward and flexible way to handle\
    \ HTTP requests and responses.\n"
