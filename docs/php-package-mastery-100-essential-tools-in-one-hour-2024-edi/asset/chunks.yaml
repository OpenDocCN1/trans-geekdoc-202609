    ## 3. BCMath

    `BCMath` (Binary Calculator Math) is a library for arbitrary precision arithmetic
    handling, especially useful for operations on large numbers or those requiring
    high precision.


    ### Ex:BCMath

    ```php

    <?php

    // Adding two arbitrary precision numbers

    $number1 = ''123456789123456789123456789'';

    $number2 = ''987654321987654321987654321'';

    $sum = bcadd($number1, $number2);

    echo $sum;

    ?>

    ```

    In this example, we use BCMath''s `bcadd` function to add two very large numbers
    that standard PHP integer types cannot accurately represent. The `$number1` and
    `$number2` variables store string representations of these large numbers, since
    PHP''s integer type has a maximum value limit. The `bcadd` function takes these
    string representations as input and returns their sum as a string. This is crucial
    for financial applications, scientific computations, or any domain where precision
    with very large numbers is paramount. By treating numbers as strings, BCMath avoids
    the limitations of PHP''s native number types.


    ## 4. exif

    The `EXIF` (Exchangeable Image File Format) extension allows you to read metadata
    from images (JPEG, TIFF) such as the camera used to take the photo, the date it
    was taken, GPS coordinates, and more.


    ### Ex:exif

    ```php

    <?php

    // Reading EXIF data from an image

    $exif = exif_read_data(''photo.jpg'');

    echo $exif[''Make''], "\n", $exif[''Model''];

    ?>

    ```

    Canon EOS 80D

    In this snippet, we use PHP''s `exif_read_data` function to extract EXIF metadata
    from an image file named `photo.jpg`. This function returns an associative array
    containing information about the image, such as the camera make (`$exif[''Make'']`)
    and model (`$exif[''Model'']`). This feature is particularly useful in photography-related
    applications, social media platforms, and any software that needs to organize,
    categorize, or display images based on their metadata. The ability to read this
    metadata programmatically can also assist in automating tasks like sorting images,
    generating captions, or even enhancing privacy by scrubbing GPS data before images.


    ## 5. Phar

    Phar (PHP Archive) is a library that allows for the packaging of entire PHP applications
    or libraries into a single archive. It simplifies deployment and distribution
    by encapsulating all files.


    ### Ex:Phar

    ```php

    <?php

    // Create a new Phar ''example.phar''

    $phar = new Phar(''example.phar'');

    // Add all PHP files in the ''src'' directory

    $phar->buildFromDirectory(dirname(__FILE__) . ''/src'', ''/.php$/'');

    // Define the stub to set the Phar archive''s default behavior

    $phar->setStub($phar->createDefaultStub(''index.php''));

    echo "Phar created successfully.";

    ?>

    ```

    Phar created successfully. This code snippet demonstrates how to create a Phar
    (PHP Archive) file named `example.phar`. Here''s a step-by-step explanation:

    - **Create a new object**: The `new Phar(''example.phar'')` line initializes a
    new archive named `example.phar`. This is the archive file that will contain your
    PHP application or library.

    - **Add files to the archive**: The `$phar->buildFromDirectory(dirname(__FILE__)
    . ''/src'', ''/.php$/'')` line adds all PHP files (`.php$` is a regular expression
    that matches any string ending with `.php`) from the `src` directory (located
    in the same directory as this script) to the Phar archive. This is a convenient
    way to package the necessary PHP files into a single archive.

    - **Set the default stub**: The `$phar->setStub($phar->createDefaultStub(''index.php''))`
    line sets the Phar archive''s default stub. The stub is a small script that runs
    when the Phar file is executed. In this case, `createDefaultStub(''index.php'')`
    specifies `index.php` as the default file to run when the Phar archive is executed.
    The stub ensures that the Phar archive behaves like a standard PHP application.

    - **Execution Confirmation**: The script echoes a confirmation message indicating
    that the Phar archive has been created successfully. This functionality is particularly
    useful for developers looking to distribute PHP applications or libraries as a
    single file, making deployment and distribution simpler and streamlined.


    ## 6. DOMDocument

    `DOMDocument` is part of PHP''s DOM extension, allowing for manipulation and traversal
    of XML and HTML documents in a tree format. It enables reading, modification,
    and validation of documents.


    ### Ex:DOMDocument

    ```php

    <?php

    // Load the HTML content

    $htmlString = ''<html><body>Hello, World!</body></html>'';

    // Create a new DOMDocument

    $doc = new DOMDocument();

    // Load the HTML string

    $doc->loadHTML($htmlString);

    // Add a new element

    $newElement = $doc->createElement(''p'', ''This is a new paragraph.'');

    $doc->getElementsByTagName(''body'')->item(0)->appendChild($newElement);

    // Save the modified HTML

    $modifiedHtml = $doc->saveHTML();

    echo $modifiedHtml;

    ?>

    ```

    <html><body>Hello, World!<p>This is a new paragraph.</p></body></html>

    This example demonstrates how to manipulate an HTML document using the `DOMDocument`
    class in PHP. Here''s a breakdown of the process:

    - **Create an HTML String**: The variable `$htmlString` contains an HTML document
    as a string. This is the document we will load into the `DOMDocument` object for
    manipulation.

    - **Initialize DOMDocument**: `$doc = new DOMDocument()` creates a new instance
    of the `DOMDocument` class, which represents an entire HTML or XML document. This
    object will be used to manipulate the document''s structure.

    - **Load the HTML Document**: `$doc->loadHTML($htmlString)` loads the HTML content
    from `$htmlString` into the `$doc` object. This method parses the HTML string
    and constructs the DOM tree.

    - **Create and Add a New Element**: The `$doc->createElement(''p'', ''This is
    a new paragraph.'')` creates a new paragraph `<p>` element with the text ''This
    is a new paragraph.''. The `$doc->getElementsByTagName(''body'')->item(0)->appendChild($newElement)`
    finds the first (item(0)) `<body>` tag in the document and appends the newly created
    paragraph as its child. This step modifies the DOM tree by adding a new element.

    - **Save and Echo the Modified HTML**: `$doc->saveHTML()` converts the modified
    DOM tree back into an HTML string. Echoing `$modifiedHtml` outputs the updated
    HTML document, which now includes the new paragraph element. This functionality
    is essential for dynamically generating or modifying HTML or XML content on the
    server-side. It provides a powerful interface for web developers to programmatically
    interact with and manipulate the structure of documents.

