  trans: "\n\n# 76. PHPExcel (现名为 PhpSpreadsheet)\n\n`PHPExcel` 现在被称为 `PhpSpreadsheet`，这是一个用于读取和写入表格文件（Excel、LibreOffice\
    \ 等）的库。它支持 XLSX、XLS 和 CSV 等多种文件格式，提供了一种程序化与表格数据交互的方法。\n\n示例：PHPExcel (现 PhpSpreadsheet)\n\
    \n```php\n<?php\nrequire 'vendor/autoload.php';\nuse PhpOffice\\PhpSpreadsheet\\\
    Spreadsheet;\nuse PhpOffice\\PhpSpreadsheet\\Writer\\Xlsx;\n$spreadsheet = new\
    \ Spreadsheet();\n$sheet = $spreadsheet->getActiveSheet();\n$sheet->setCellValue('A1',\
    \ 'Hello World !');\n$writer = new Xlsx($spreadsheet);\n$writer->save('hello_world.xlsx');\n\
    ?>\n```\n\n// 将创建一个文件，其中 A1 格显示为 \"Hello World !\"\n\n在这个示例中，我们演示了如何使用 `PHPExcel`\
    \ 的继者 `PhpSpreadsheet` 创建简单的 Excel 文件。首先，我们通过 `require 'vendor/autoload.php';`\
    \ 引入 `PhpSpreadsheet` 库。这一行假设 `PhpSpreadsheet` 已通过 Composer（PHP 的依赖管理器）安装。\n\n\
    我们从创建一个新的 `Spreadsheet` 对象开始。该对象代表我们要创建的 Excel 文件。然后使用 `getActiveSheet` 方法获取电子表格中的当前活动工作表。这将是我们写入数据的地方。\n\
    \n接下来，我们在活动工作表上使用 `setCellValue` 方法在 A1 格中写入 \"Hello World !\"。`setCellValue`\
    \ 方法接受两个参数：第一个是单元格坐标（例如 `'A1'`），第二个是要写入该单元格的值。\n\n在写入表格后，我们创建一个写入器对象，将我们的表格保存到文件中。在这种情况下，我们使用\
    \ `PhpOffice\\PhpSpreadsheet\\Writer\\Xlsx` 来创建一个 XLSX 文件写入器。最后，我们在写入器对象上调用 `save`\
    \ 方法，并传递我们想要创建的文件名（`hello_world.xlsx`）。\n\n`PhpSpreadsheet` 抽象了处理不同表格格式的复杂性，提供了一个统一的\
    \ API 来读取和写入各种表格文档。这使得它对于 PHP 应用中生成报告、导出数据，甚至读取表格文件进行数据处理变得极其有用。\n\n# 77. Whoops\n\
    \n`Whoops` 是一个 PHP 库，旨在以更用户友的方式处理错误和异常。它提供了一个基于栈的错误处理器，可以集成到任何 PHP 应用中，使开发期间的调试更加容易。`Whoops`\
    \ 显示详细的诊断信息，包括发生错误的文件和代码行、调用堆栈，以及如果可用的相关的代码段。\n\n示例：Whoops\n\n```php\nrequire\
    \ 'vendor/autoload.php';\n$whoops = new Whoops\\Run;\n$whoops->pushHandler(new\
    \ Whoops\\Handler\\PrettyHandler);\n$whoops->register();\nthrow new Exception(\"\
    Something went!\");\n```\n\n一个显示 \"Something went!\" 的错误页面，抛出异常的文件和行号、堆栈跟踪以及相关的代码片段。这段代码片段演示了如何将\
    \ `Whoops` 集成到项目中。`require 'vendor/autoload.php';` - 这一行引入了 Composer 自动加载器，假设\
    \ `Whoops` 已通过 Composer 安装。Composer 是 PHP 的依赖管理器。\n\n`$whoops = new Whoops\\Run;`\
    \ - 创建 Whoops 错误处理器的实例。`$whoops->pushHandler(new Whoops\\Handler\\PrettyHandler);`\
    \ - 向 Whoops 栈中添加一个“漂亮”的错误页面处理器。`$whoops->register();` - 将 Whoops 实例注册为 PHP 的默认错误处理器。`throw\
    \ new Exception(\"Something went!\");` - 这一只是抛出异常以触发 `Whoops` 的示例。在实际应用中，异常可能由应用程序抛出，Whoops\
    \ 会接管并显示错误页面。\n\n# 78. Predis\n\n`Predis` 是一个灵活且功能完备的 PHP Redis 客户端。它提供了与 Redis\
    \ 通信简单接口。Redis 是一种快速的内存存储，用于缓存、消息等。`Predis` 支持多种 Redis 功能，包括事务、管道（pipelining）、发布/订阅（pub/sub）和集群。\n\
    \n示例：Predis\n\n```php\nrequire 'vendor/autoload.php';\n$client = new Predis\\\
    Client([\n    'scheme' => 'tcp',\n    'host' => '127.0.0.1',\n    'port' => 6379,\n\
    ]);\n$client->set('foo', 'bar');\n$value = $client->get('foo');\necho $value;\n\
    ```\n\nbar\n\n这段代码片段说明了使用 `Predis` 与 Redis 数据库交互的基本用法。`require 'vendor/autoload.php';`\
    \ -  Composer 自动加载器以自动加载 `Predis` 库，假设它已通过 Composer 安装。`$client = new Predis\\\
    Client([...]);` - 这一行创建一个新的 `Predis` 客户端实例。传递构造函数的数组包含 Redis 服务器的连接参数。在示例中，它连接到本地\
    \ (127.0.0.1) 默认端口 (6379)。`$client->set('foo', 'bar');` - 将 Redis 中键 `foo` 的值设置为\
    \ `bar`。这演示了如何使用 `Predis` 向 Redis 写入数据。`$value = $client->get('foo');` - 从 Redis\
    \ 获取键 `foo` 的值，根据上一步的设置，应该是 `bar`。`echo $value;` - 将从 Redis 获取的值打印到标准输出。在这种情况下，它打印\
    \ bar。\n\n`Predis` 抽象了与 Redis 的通信，为 PHP 应用利用 Redis 能力提供了简单且直观的 API。它支持广泛的 Redis\
    \ 命令和功能，使其成为使用 Redis 的 PHP 开发者的多功能选择。\n\n"
