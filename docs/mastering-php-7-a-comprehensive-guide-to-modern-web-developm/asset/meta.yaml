- - '##'
  - 19.4 PHP 与 Web Assembly (Wasm)
- - '###'
  - 为什么要结合 Web Assembly 使用 PHP？
- - '####'
  - 1. 性能：Web Assembly 代码以接近原生的速度运行，使其成为计算密集任务的理想选择。通过将某些操作交给 Web Assembly，你可以显著提高
    Web 应用的性能。
- - '####'
  - 2. 客户端逻辑：PHP传统运行在服务器上，但通过 Web Assembly，你可以在客户端执行 PHP 代码。这为创建具有客户端 PHP 逻辑交互式 Web
    应用开辟了新的可能性。
- - '####'
  - 3. 跨平台兼容性：Web Assembly 可以在各种浏览器上运行，是一种跨平台解决方案。你的 PHP 代码可以在不同浏览器中一致工作，而没有兼容性问题。
