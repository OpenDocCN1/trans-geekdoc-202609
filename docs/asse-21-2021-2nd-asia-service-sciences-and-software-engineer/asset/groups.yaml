    the row 1 and row 4 in table 6, the confirmation time with 1000 nodes is almost
    twice as the confirmation time with 600 nodes. This is because that, with a certain
    time interval, larger a network scale means more pending blocks. Therefore, the
    blocks in larger network need more time to wait for enough descendant blocks to
    finalize it which stretches the confirmation time.


    ## 7 CONCLUSION


    Plume utilises single-chain to generate a randomness seed, and uses hash inequally
    to map the randomness seed to a group of participants as committee members. Blocks
    are created by committee members by computing $VRF_{s_k}(slot|||r_t)$ and construct
    DAG according to reference rules. As a consequence of our analysis, we have following
    conclusion: (1) In the case of a small number of malicious nodes, it is secure
    to generate commit according to the randomness from single chain. Although the
    randomness seed from the single chain is biased, its entropy is enough to make
    sure that the malicious nodes can not control the election of committee, and the
    security of Plume will not be affected. (2) If the randomness from single chain
    is secure, Plume can resist the double spending attack. Due to Plume adopts the
    mechanism of density comparison, when honest nodes are in the majority, malicious
    nodes can not form a double spending attack. (3) In Plume, the confirmation of
    blocks is probabilistic, and user can decide when a certain block is confirmed.
    When the interval between block is set appropriately, the confirming time can
    be controlled in seconds. (4) As a DAG class consensus protocol, Plume also can
    provide a high throughput without sacrificing decentralization and security. Nevertheless,
    in Plume there may be several participants pack transactions at the same time,
    a certain transaction may be packed more than one time which increase the redundancy
    of system. We will reduce the redundancy in the future.


