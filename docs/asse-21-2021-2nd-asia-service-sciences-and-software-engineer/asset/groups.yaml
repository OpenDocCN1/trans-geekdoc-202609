    $s_1 < s_2$，满足 $\mathbf{S}_1^{[\ell]} \preceq \mathbf{S}_2$。


    # 4 我们协议的细节


    我们称为 Plume 的协议的基本思想如图 1 所示。Plume 是传统单链共识协议和 DAG 结构的结合。Plume 中有两种类型的块。一种是传统块，记为
    $B_R$，需要更多时间生成，以保证综合安全性。另一种是 DAG 块，记为 $B_f$，可以快速生成。Plume 主要分为四个部分：(1) 从慢区块链生成随机数并选举委员会以生成快速块，(2)
    接收快速块并对它们进行排序，(3) 生成快速块并将它们组织成 DAG 结构，(4) 将 DAG 的当前状态存储在慢块中，以加快新参与者的同步。接下来，我们将描述这些部分的功能。


    ## 4.1 快速块的结构


    在本节中，我们将定义快速块的结构。我们将委员会生成的块称为快速块，因为这些块可以在不考虑最大网络延迟的情况下在每个槽中生成。快速块的头部结构如图 7 所示。我们可以看到，除了默克尔根之外，该结构与传统的块结构不同。“(y,
    π)” 等同于传统块中表 7 明确定义的“nonce”。两者都用于证明该节点有资格生成该块。而“slot”用于验证用于计算 $B_f$ 的随机数 r 是否正确。“reference
    number”用于声明该块引用了多少个快速块，其值需要与“reference hash”的内容匹配。需要注意的是，“reference”对应于 DAG 的有向边，每个快速块对应于
    DAG 中的一个顶点。txlist 是快速块中交易的列表，它与默克尔根一致。σ 是对快速块的签名，以防止对手将 (y, π) 用于其他快速块。


    ## 4.2 从慢区块链获取随机数并选举委员会


    有许多关于从区块链提取随机数的研究，例如 [4] 和 [3]。这些研究利用了挖掘过程本身的固有随机性。[4] 提出，区块头中包含足够的熵，使得提取器可以从区块头获取无偏随机数。但恶意矿工有能力选择优先广播的区块，这会在整体上产生偏差。


    ![](img/0ee32e7d194c7c0bdee0ce0091187b7c_3_0.png)


    **图 1: 我们协议的概述。**


    **表 1: 快速块的结构。**


    | 项目 | 描述 |

    |---|---|

    | $(y, \pi)$ | 证明该节点有资格生成此快速块的证据。 |

    | $r$ | 用于选举的随机数。 |

    | slot | 生成该快速块的槽。 |

    | merkle_root | 交易的默克尔根。 |

    | reference_number | 被此块引用的快速块数量。 |

    | reference_hash | 被此块引用的快速块的哈希值。 |

    | txlist | 交易列表。 |

    | $\sigma$ | 快速块的签名。 |


    根据先前的研究，我们可以看出，使用足够的块来生成无偏随机数是有必要的。但在 Plume 中，我们不需要无偏随机数，我们只需要一个具有足够熵的随机数，使得对手无法操纵随机数以使委员会中对手的比例超过阈值。我们通过计算确认的慢块的哈希值来获取随机数，即
    $r_i = H(B_i^s)$。并且我们以 $E$ 个槽的间隔切换到下一个慢块以生成下一个确认的随机数，其中 $E$ 是系统参数。更具体地说，我们从确认的慢区块链的创世块
    $B_0^s$ 获取我们的第一个随机数 $r_0$，在 $E$ 个槽后（$E$ 大于生成慢块的间隔），我们从块 $B_1^s$ 获取第二个随机数 $r_1$，依此类推。


