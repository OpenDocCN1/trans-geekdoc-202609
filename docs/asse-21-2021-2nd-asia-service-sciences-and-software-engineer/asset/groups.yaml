    | txs | 250*交易数量 | 交易 |


    的是更高的吞吐量和更窄的 DAG。我们发现，在块大小为 10K 字节且时间间隔为 1 秒的情况下，DAG 的宽度接近于块大小为 100K 字节且时间间隔为
    1 秒的情况。而后者的吞吐量是前者的两倍多。因此，在实际情况下，如何平衡时间间隔和块大小以实现更高的吞吐量和更窄的 DAG 应被认真考虑。


    其次，表 6 显示，随着块生成率的上升，特定块的确认时间也不断减少。并且在网络规模为 600 个节点且时间间隔为 0.5 秒的情况下，确认时间约为半分钟，远少于比特币和以太坊。比较表
    6 中的第 1 行和第 4 行，1000 个节点的确认时间几乎是 600 个节点确认时间的两倍。这是因为，在特定时间间隔下，网络规模越大意味着更多的待定块。因此，较大网络中的块需要更多时间等待足够的子代块来最终确定它，从而延长了确认时间。


    ## 7 结论


    Plume 利用单链生成随机性种子，并使用不等哈希将随机性种子映射到一组参与者作为委员会成员。委员会成员通过计算 $VRF_{s_k}(slot|||r_t)$
    创建块，并根据引用规则构建 DAG。作为我们分析的结果，我们有以下结论：(1) 在少数恶意节点的情况下，根据单链的随机性生成委员会是安全的。虽然来自单链的随机性种子存在偏差，但其熵足够确保恶意节点无法控制委员会选举，并且
    Plume 的安全性不会受到影响。(2) 如果来自单链的随机性是安全的，Plume 可以抵抗双花攻击。由于 Plume 采用密度比较机制，当诚实在节点占多数时，恶意节点无法形成双花攻击。(3)
    在 Plume 中，块的确认是概率性的，用户可以决定何时确认某个块。当块之间的间隔设置得当时，确认时间可以控制在几秒内。(4) 作为一种 DAG 类共识协议，Plume
    还可以在不牺牲去中心化和安全性的情况下提供高吞吐量。尽管如此，在 Plume 中可能有几个参与者同时打包交易，某个交易可能被打包多次，从而增加系统的冗余。我们将在今后的工作中减少冗余。


