    Both of them are used for proving the party is qualified to generate these block.
    And the “slot” is utilized to verify the randomness r used to compute $B_f$ is
    correct. “reference number” is to declare how many fast blocks are referenced
    by this block, and the values need to match the content of “reference hash”. It
    should be noted that “reference” corresponds to the directed edges of DAG, and
    every fast block corresponds to a vertex in DAG. txlist is the list of transactions
    in the fast block that would be consistent with the merkle root. σ is a signature
    on the fast block, in order to prevent adversaries from using the (y, π) on other
    fast blocks.


