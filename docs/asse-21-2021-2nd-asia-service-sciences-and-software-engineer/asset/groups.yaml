    \) 和 \( \mathcal{Y} \) 的概率密度图。我们可以看到，随着 \( T \) 的增加，变量 \( \mathcal{X} \) 和 \(
    \mathcal{Y} \) 的概率密度图的重叠区域变得越来越小。我们将不同 \( T \) 值下交点对应的纵坐标设为阈值 Th。


    ![](img/0ee32e7d194c7c0bdee0ce0091187b7c_6_1.png)


