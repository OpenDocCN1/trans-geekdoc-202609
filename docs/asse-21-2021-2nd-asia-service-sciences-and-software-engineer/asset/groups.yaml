    ### 5.2 无偏随机性下的安全性


    在本节中，我们将证明在选择委员会所使用的随机性是无偏的情况下，Plume 能够满足第 3 节中的安全性定义。随后，在下一节中，我们将解释来自慢区块链的有偏随机性不会影响整体安全性。


    **命题 5.1。** *当用于选择委员会的随机性是无偏时，Plume 满足了 5 项安全性定义，即唯一序列号、稳定最终性状态、序列增长、序列质量和序列公共前缀。*


    **证明。** 我们将分别证明 Plume 满足这 5 项安全性定义。


    *唯一序列号。* 在 Plume 中，快速区块的序列号是基于生成该快速区块的时间槽设定的。我们要求平均每个时间槽可以生成一个快速区块，但可能存在一个时间槽内生成多个快速区块的情况。我们通过比较它们的哈希值来处理这种情况，其中我们使用抗碰撞哈希算法。显然，如果一个攻击者能够破坏唯一序列号属性，他就能破坏哈希算法的抗碰撞性。


    **图 3**：当 \( \alpha = 0.9 \)，\( T = 5, 10, 15 \) 时，\( \mathcal{X} \) 和 \( \mathcal{Y}
    \) 的概率密度图


    *稳定最终性状态。* 如果一个攻击者想要改变 Seq[\( \mathfrak{S} \)\] 中某个快速区块 \( B_f \) 的序列号，他必须生成一个具有足够子区块且时间槽早于
    \( B_f \) 的快速区块 \( B_f'' \)，使得 \( B_f'' \) 满足被添加到 confirmedSet 的标准。一旦 \( B_f''
    \) 进入诚实方（honest party）的 confirmedSet，它将被添加到 Seq[\( \mathfrak{S} \)\] 并赋予一个序列号。由于
    Slot[\( B_f'' \)] < Slot[\( B_f \)]，必然有 Index[\( B_f'' \)] < Index[\( B_f \)]，这意味着
    \( B_f \) 的序列号被改变了。但幸运的是，只要 \( T \) 足够大，攻击者成功的概率可以忽略不计，如表 2 所示。具体而言，当 \( T = 100
    \) 个时间槽且 \( \alpha = 0.9 \) 时，成功概率仅为 \( 5.44851 \cdot 10^{-11} \)。


    图 4 展示了 \( T \) 从 10 到 100 每隔 10 为区间时，攻击者成功概率的变化趋势。我们可以看到，随着时间推移，单个恶意攻击者超过阈值的概率越来越小。当
    \( \alpha = 0.9 \) 时，成功概率太小，无法在图 4 的上图中显示，因此我们在下图单独展示。我们在表 2 中列出了具体数据。


    *序列增长。* 算法 3 保证了一个快速区块可以被后续所有快速区块直接或间接引用，并且仅由诚实玩家在 $T$ 个时间槽内生成的 DAG 部分无法达到阈值 $\mathsf{Th}$
    的概率可以忽略不计，因此，由诚实玩家生成的快速区块 $B_f$ 必须在 $\Delta + T$ 个时间槽之后被添加到 $\mathsf{Seq}[\mathbb{G}]$
    中。因此，$\mathsf{Seq}[\mathbb{G}]$ 保持增长。


    *序列质量。* $\mathsf{Seq}[\mathbb{G}]$ 中的快速区块是由随机选择的委员会生成的。当随机性是无偏的且诚实玩家的占比为 $\alpha$
    时，显然对于足够大的 $T$，$\mathsf{Seq}[\mathbb{G}]$ 中连续 $T$ 个快速区块中，诚实快速区块的数量平均为 $\alpha
    \cdot T$。


    *序列公共前缀。* 在 Plume 中，当诚实方接收到一个快速区块时，该诚实方会将此快速区块发送给其他所有诚实方。因此，除了最近的快速区块外，每个诚实方视图中
    pendingSet 和 candidateSet 的并集是相同的，从而从 pendingSet 和 candidateSet 并集中选出的 confirmedSet
    也是相同的。


    因此，对于任意拥有局部状态 $\mathbf{S}_1 = \mathsf{Seq}[\mathbb{G}_1]$ 的诚实玩家 $P_1$（在时间槽 $s_1$）和拥有局部状态
    $\mathbf{S}_2 = \mathsf{Seq}[\mathbb{G}_2]$ 的 $P_2$（在时间槽 $s_2$），其中 $s_1 < s_2$，成立
    $\mathbf{S}_1^{[k]} \preceq \mathbf{S}_2$。 \quad $\Box$


    ### 5.3 有偏随机性下的安全性


    在本节中，我们将证明虽然我们的随机性是有偏的，但它不会破坏 Plume 的安全性。当随机性无偏时，攻击者的成功概率如表 2 所示，但在 Plume 中，攻击者可以选择对其更有利的随机性，因此，首先我们分析能够操纵随机性的攻击者的成功概率。


    在 Plume 中，我们将已确认的慢区块的哈希值视为随机性。恶意攻击者可以选择一个最优的慢区块进行广播。最优慢区块是指由其生成的随机性能使被选中的恶意攻击者数量最大化。因此，我们可以计算当攻击者可以从
    $k$ 个随机性中选择一个时，被选中的最大恶意攻击者数量的期望。这意味着攻击者可以同时生成 $k$ 个慢区块，我们将此事件定义为 $A_k$。容易得到 $A_k$
    发生的概率为 $\gamma^k$，其中 $\gamma$ 是恶意攻击者算力的占比。


    我们将第 $i$ 次选举中 $k$ 次被选中的攻击者数量分别记为 $Y_1$, $Y_2, \cdots, Y_k$。并且我们将变量定义为 $\mathbf{Z}
    = \textbf{Max}\{Y_1$, $Y_2, \cdots, Y_k\}$。我们也考虑 $T$ 个时间槽，因此 $Y_1$, $Y_2, \cdots,
    Y_k$ 都服从正态分布 $N(\alpha T, (1-\alpha)T)$（即，$\mu = (1-\alpha)\cdot T$，$\sigma =
    \sqrt{(1-\alpha)\cdot T}$）。我们设定 $Y_i = \mu + \sigma \cdot Y_i''$，其中 $Y_i''$ 服从标准正态分布。然后我们可以得到
    $\mathbf{Z} = \textbf{Max}\{Y_1, Y_2, \cdots, Y_k\} = \mu + \sigma \cdot \textbf{Max}\{Y_1'',
    Y_2'', \cdots, Y_k''\}$。为了便于说明，我们将 $\textbf{Max}\{Y_1'', Y_2'', \cdots, Y_k''\}$
    记为 $Z''$。并且我们可以通过公式 (1) 得到 $Z''$ 的期望，其中 $\Phi(y)$ 是标准正态分布的分布函数，并通过公式 (2) 得到 $\mathbf{Z}$
    的期望。


    $$\mathbb{E}[Z''] = \int_{-\infty}^{\infty} y \cdot \frac{d(\Phi(y)^k)}{dy} dy
    \tag{1}$$

    $$\mathbb{E}[\mathbf{Z}] = \mu + \sigma \cdot \mathbb{E}[Z''] = (1-\alpha) \cdot
    T + \sqrt{(1-\alpha) \cdot T} \cdot \mathbb{E}[Z'']. \tag{2}$$


    我们可以从图 5 中看到，随着 $k$ 从 1 增加到 10，$\mathbb{E}[Z'']$ 的增长趋势。因此，$k$ 越大，攻击者成功的概率越高。接下来，我们仅考虑
    $k = 10$ 的情况，此时 $\mathbb{E}[Z''] = 1.53873$。我们设定 $T$ 从 10 变化到 100，间隔为 10，以比较有偏随机性与表
    2 中无偏随机性的成功概率。表 3 表明，当 $\alpha = 0.9$ 和 $\alpha = 0.8$ 时，被选中的最大攻击者数量始终小于我们的阈值。也就是说，即使攻击者可以准备
    10 个慢区块来选择随机性，他们也无法对已确认的交易进行双重支付。此外，同时获得 10 个慢区块的概率仅为 $\gamma^{10}$，其中 $\gamma
    < 0.5$。表 4 显示，当 $\alpha = 0.7$ 且 $T = 10, 20$ 时，被选中的最大攻击者数量超过我们的阈值，但当 $T \ge 30$
    时，攻击者无法成功。因此，当 $\alpha = 0.7$ 时，我们需要设置 $T \ge 30$ 以防止攻击者破坏安全性。


    综上所述，我们可以看到，攻击者可以通过选择随机性来增加成功概率，但即使他们有机会选择更优的随机性，成功概率也是微不足道的。


