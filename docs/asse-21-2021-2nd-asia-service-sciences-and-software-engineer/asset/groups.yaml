    # 4 THE DETAILS OF OUR PROTOCOL


    The basic idea of our protocol called Plume is showed in Fig.1. Plume is a combination
    of traditional single-chain consensus protocol and DAG structure. There are two
    kinds of blocks in Plume. One is the traditional block denoted as $B_R$ that needs
    more time to generate in order to guarantee the integrated security. Another is
    the DAG block denoted as $B_f$ that can be generated fast. Plume is mainly divided
    into four parts, those are (1) generating randomness from slow blockchain and
    electing committee to generate fast blocks, (2) receiving fast blocks and ordering
    them, (3) generating fast blocks and organizing them into DAG structure, (4) storing
    the current state of DAG in slow blocks to speed up synchronization of new parties.
    Next, we will describe what the parts do.


    # 4.1 The structure of a fast block


    In this section, we will define the structure of fast blocks. We denote the blocks
