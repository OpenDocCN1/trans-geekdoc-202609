    网络中诚实玩家的占比为 \( \alpha \)，而恶意玩家的占比为 \( 1 - \alpha \)。并且，玩家在一个时间槽（slot）中被选中的概率为
    \( p \)。因此，诚实玩家在 \( T \) 个时间槽内能够生成的节点数量的期望为 \( \alpha \cdot p \cdot N \cdot T
    \)。我们设定 \( p \cdot N = 1 \)，这意味着平均每个时间槽会产生一个快速区块。我们将诚实玩家在 \( T \) 个时间槽内生成的节点数量记为变量
    \( \mathcal{X} \)，将恶意玩家在 \( T \) 个时间槽内生成的节点数量记为变量 \( \mathcal{Y} \)。我们知道 \( \mathcal{X}
    \) 和 \( \mathcal{Y} \) 都服从二项分布，并且我们可以将这些变量视为正态分布。\( \mathcal{X} \) 的期望为 \( \alpha
    \cdot p \cdot N \cdot T = \alpha \cdot T \)，其方差为 \( \alpha \cdot p \cdot N \cdot
    T = \alpha \cdot T \)。相应地，\( \mathcal{Y} \) 的期望和方差均为 \( (1 - \alpha) \cdot T \)。（即，\(
    \mathcal{X} \sim \mathcal{N}(\alpha \cdot T, \alpha \cdot T) \)，\( \mathcal{Y}
    \sim \mathcal{N}((1 - \alpha) \cdot T, (1 - \alpha) \cdot T) \)）


