    ## 羽毛：无单点故障的快速终结区块链


    **潘亦达\***

    panyeda@cn.fujitsu.com

    富士通研发中心

    中国，苏州


    **皮冰峰†**

    winter.pi@cn.fujitsu.com

    富士通研发中心

    中国，苏州


    **孙军‡**

    sunjun@cn.fujitsu.com

    富士通研发中心

    中国，北京


    ## 摘要


    比特币缓慢的终结性是其无法在现实生活中广泛应用的重要因素。其他公共单链区块链也存在同样的问题。在本文中，我们提出了一种名为 Plume 的实用新协议，通过利用（缓慢的）传统区块链来实现具有快速终结性的共识。Plume
    结合了有向无环图（DAG）结构与传统区块链，以提高吞吐量并加速确认。DAG 结构旨在提高吞吐量，但如何基于 DAG 构建安全的共识协议非常困难。在 Plume
    中，我们使用传统区块链生成随机数，用于在 DAG 中生成快速块。DAG 中快速块的顺序依赖于全局时钟和哈希函数。与比特币一样，Plume 是一个概率性协议。然而，由于
    DAG 结构的引入，在不降低安全性的情况下，Plume 中块的创建率可以更高。因此，块的确认时间可以加快。本文还分析了不同条件下的确认概率，并证明了无论来自传统单链的随机数是否有偏差，Plume
    都是安全的。最后，本文使用 NS-3 模拟了 1000 个节点的性能。在块大小为 100K 字节且快速块时间间隔为 1 秒的情况下，吞吐量可提升至 400
    Tps。在块大小为 10K 字节且时间间隔为 1 秒的情况下，确认时间可缩短至 2 分钟以内。


    ## CCS 概念


    - *安全与隐私* → **网络安全**。

    - *计算机系统组织* → *可用性*。


    ## 关键词


    吞吐量，终结性，DAG，共识协议


    ## ACM 引用格式：


    Pan Yeda, Pi Bingfeng, and Sun Jun. 2021. Plume: Fast Finality Blockchain without
    Single Failure Point. In *2021 2nd Asia Service Sciences and Software Engineering
    Conference (ASSE’21)*, February 24–26, 2021, Macau, Macao. ACM, New York, NY,
    USA, 10 pages. https://doi.org/10.1145/3456126.3456128


    ## 1 引言


    作为一种新技术，区块链在金融 [12] [19] [18]、物联网 [6] 和供应链 [15] 等各种领域具有巨大的应用潜力。设计于 2008 年的比特币是区块链的第一个应用，它将其底层技术——区块链协议——公之于众。随后，区块链的安全性由
    [5] 和 [13] 得到证明，这为区块链的使用提供了安全保证。根据 [5]，我们必须将增长速率限制在特定范围内，以避免产生过多的分叉从而降低诚实参与者的算力。


    阻碍区块链在现实生活中广泛应用的是其吞吐量和确认时间。平均而言，比特币的吞吐量约为 3 tx/s [1]，且确认时间超过 1 小时。以太坊将生成区块的速率提高到约
    11 秒 [2]，但确认时间仍不足以应对实际场景。因此，寻找克服这两个问题的方法至关重要。


    目前，主要有两种提高吞吐量的方法，即分片 [20] [7] 和有向无环图（DAG）[8]。分片将参与者划分为几个较小的委员会，使委员会可以并行打包交易以提高吞吐量。DAG
    将单链更改为有向无环图，在这种结构中，无需考虑网络延迟即可加速区块的生成。这两种方法确实可以提高吞吐量，但它们无法从根本上提高确认速度。


    Sompolinsky 等人 [17] 发现，如果一种结构接受所有区块，它就能在不牺牲去中心化的情况下解除区块生成速率的限制。DAG 就是这样的结构。因此，我们的目标是为
    DAG 结构提供自然序列，并实现稳定且快速的确认。在本文中，我们使用传统单链区块链来确保整体安全性，并使用 DAG 结构来提高吞吐量和确认速率。


    直观上，我们利用传统单链区块链获取随机数，这些随机数可用于选择委员会来构建 DAG 结构并对其进行排序。网络中的每个参与者都有以一定概率获得创建区块资格的机制。只要传统单链区块链是安全的，攻击者就无法控制我们
    DAG 结构的顺序。并且，我们的 DAG 结构具有源自随机数的自然序列，因此，我们可以获得稳定的确认。


    我们使用 DAG 结构摆脱了区块生成的速度限制。在单链区块链中，一个区块必须等到其前一个区块广播到几乎整个网络后才能生成，以避免分叉。而对于 DAG，我们无需等待一个区块传遍整个网络生成下一个区块，因为所有区块最终都会被包含在
    DAG 中。同时，由于使用了属于安全单链的稳定区块以及两个区块之间更短的间隔，确认时间得到了改进。


    Plume 提供了一种实用的 DAG 协议，包含：

    - 如何在 DAG 中生成区块；

    - 为 DAG 中的所有区块赋予唯一的全局编号；

    - 分析区块何时可以被确认的条件。


    本文结构如下。在第 3 节中，我们提供了一些数据结构和安全的定义。在第 4 节中，我们给出 Plume 的细节，并在第 5 节中分析不同条件下的确认概率以及当来自单链的随机数无偏差和有偏差时
    Plume 的安全性。最后，第 6 节给出了使用 NS-3 对 1000 个节点的 Plume 模拟。


    ## 2 相关工作


    Thunderella [14] 由 Pass 和 Eilam 于 2018 年提出，旨在加速公共链的确认。它需要一个可信的加速器来收集交易并按顺序输出，然后委员会对这些顺序交易进行投票并将其打包以生成一致的日志。[14]
    只能保证在乐观情况下快速确认，但在最坏情况下会回退到传统区块链，并且它依赖于一个被称为加速器的指定实体。与 Thunderella 相关，Plume 证明了在不去中心化的情况下实现稳定且快速的确认。


    在过去几年中，提出了几种基于 DAG 的共识协议。SPECTRE [16] 为 DAG 中所有区块对指定了非传递偏序关系，而 Plume 为所有区块提供了全局一致的唯一编号，这对于支持智能合约等应用程序至关重要。并且，作为一种
    PoW 共识协议，ConfFlux [9] 使用 PoW 协议生成区块，这浪费了大量的电力。由于使用 GHOST [17] 在遇到分叉时决定哪个分支是有效的，ConfFlux
    也容易受到均衡攻击。均衡攻击 [10] 意味着持有少于 50% 算力的攻击者可以通过干扰分叉点两个部分中较弱的一方，使得某些区块永远无法被确认。而在 Plume
    中，DAG 快速块的生成是根据底层单链提供的随机数进行的，这是经济高效的。并且，Plume 给出的顺序协议可以抵御均衡攻击。


    ## 3 定义与模型


