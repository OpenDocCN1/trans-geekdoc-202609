    $s_1$ 拥有本地 $\mathbf{S} = \text{Seq}[\hat{\mathcal{G}}]$ 的诚实节点 P，对于 $\mathbf{S}$
    中足够大的连续 ℓ 个快速块，诚实快速块的比例至少为 $\mu$。

