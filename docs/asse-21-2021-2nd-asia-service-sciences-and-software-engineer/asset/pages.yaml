    *Unique sequence number.* In Plume, the sequence number of a fast block is set
    based on the slot in which the fast block was generated. And we require that there
    is a fast block can be generated in a slot averagely, but it is possible that
    there are more than one fast blocks are generated in a slot. We deal with this
    situation by comparing their hash values where we use the collision-resistant
    hash algorithm. It is obvious that if an adversary can break the unique sequence
    number property, he can break the collision-resistance of the hash algorithm.


