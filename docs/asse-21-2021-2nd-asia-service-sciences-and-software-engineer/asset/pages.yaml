    # 5.3 Security under biased randomness


    In this section, we will prove that although our randomness is biased, it will
    not break the security of Plume. When the randomness is unbiased, the success
    probability of an adversary is shown in Table 2, but in Plume, an adversary can
    select a randomness that is better for him, so firstly, we analyze the success
    probability of adversary who can bias the randomness.


    In Plume, we regard the hash value of a slow block that has been confirmed as
    the randomness. Malicious adversaries can select an optimal slow block to broadcast.
    The optimal slow block is that the randomness generated from it can make the number
    of elected malicious adversary is maximal. So we can compute the expectation of
    the maximal number of elected malicious adversary when they can select a randomness
    from $k$ randomneses. It means that adversaries can generate $k$ slow blocks at
    the same time, and we define the event as $A_k$. It is easy to get the happening
    probability of $A_k$ is $\gamma^k$ where $\gamma$ is the proportion of malicious
    adversaries'' computing power.


    We denoted the number of adversaries elected in $k$ times as $Y_1$, $Y_2, \cdots,
    Y_k$ respectively. And we denoted the variable $\mathbf{Z} = \textbf{Max}\{Y_1$,
    $Y_2, \cdots, Y_k\}$. We also consider $T$ slots, so $Y_1$, $Y_2, \cdots, Y_k$
    all obey the normal distribution $N(\alpha T, (1-\alpha)T)$ (s.t., $\mu = (1-\alpha)\cdot
    T$, $\sigma = \sqrt{(1-\alpha)\cdot T}$). And we set $Y_i = \mu + \sigma \cdot
    Y_i''$, where $Y_i''$ obeys standard normal distribution. Then we can get $\mathbf{Z}
    = \textbf{Max}\{Y_1, Y_2, \cdots, Y_k\} = \mu + \sigma \cdot \textbf{Max}\{Y_1'',
    Y_2'', \cdots, Y_k''\}$. For the sake of explanation, we denoted $\textbf{Max}\{Y_1'',
    Y_2'', \cdots, Y_k''\}$ as $Z''$. And we can get the expectation of $Z''$ by the
    equation (1), where $\Phi(y)$ is the distribution function of standard normal
    distribution, and get the expectation of $\mathbf{Z}$ by the equation (2).


    $$\mathbb{E}[Z''] = \int_{-\infty}^{\infty} y \cdot \frac{d(\Phi(y)^k)}{dy} dy
    \tag{1}$$

    $$\mathbb{E}[\mathbf{Z}] = \mu + \sigma \cdot \mathbb{E}[Z''] = (1-\alpha) \cdot
    T + \sqrt{(1-\alpha) \cdot T} \cdot \mathbb{E}[Z'']. \tag{2}$$


    We can see the growing trend of $\mathbb{E}[Z'']$ as $k$ increases from 1 to 10
    from Fig. 5. so the larger $k$ is, the higher the probability that adversaries
    can success will be. Next, we just consider the situation when $k = 10$, $\mathbb{E}[Z'']
    = 1.53873$. We set $T$ changes from 10 to 100 at an interval of 10, to compare
    the success probability under biased randomness with that in Table. 3 shows that
    when $\alpha = 0.9$ and $\alpha = 0.8$, the expectation of the maximal number
    of elected adversaries is smaller than our threshold all the time. It is to say
    that even though adversaries can prepare 10 slow blocks to select a randomness,
    they cannot double spend a confirmed transaction. Moreover, the probability of
    getting 10 slow blocks at the same time is only $\gamma^{10}$, where $\gamma <
    0.5$. Table. 4 shows that when $\alpha = 0.7$ and $T = 10, 20$, the expectation
    of the maximal number of elected adversaries exceeds our threshold, but when $T
    \ge 30$, adversaries cannot success. So when $\alpha = 0.7$, we need to set $T
    \ge 30$ to prevent adversaries from breaking the security.


    From the above, we can see that adversaries can increase the success probability
    by selecting randomness, but the success probability is negligible even if they
    have 10 chances to pick a preferable randomness.'
