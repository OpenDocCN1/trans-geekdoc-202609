  md: "# ## Plume: Fast Finality Blockchain without Single Failure Point\n\nPan Yeda*\
    \  \npanyeda@cn.fujitsu.com  \nFujitsu R & D Center  \nSuzou, China\n\nPi Bingfeng†\
    \  \nwinter.pi@cn.fujitsu.com  \nFujitsu R & D Center  \nSuzou, China\n\nSun Jun‡\
    \  \nsunjun@cn.fujitsu.com  \nFujitsu R & D Center  \nBeijing, China\n\n# **ABSTRACT**\n\
    \nBitcoin’s slow finality is an important factor preventing it from being widely\
    \ used in real life. And other public single-chain blockchains have the same problem.\
    \ In this paper, we propose a practical new protocol called Plume to achieve consensus\
    \ with fast finality by utilizing a (slow) traditional blockchain. Plume combines\
    \ the DAG structure and traditional blockchain to increase throughput and speed\
    \ up confirmation. DAG structure is proposed to increase throughput, but how to\
    \ construct a secure consensus protocol based on DAG is pretty hard. In Plume,\
    \ we use the traditional blockchain to generate a randomness which is used to\
    \ generate fast blocks in DAG. And the order of fast blocks in DAG is dependent\
    \ on a global clock and a hash function. Same as bitcoin, Plume is a probabilistic\
    \ protocol. However, with DAG structure, the creation rate of blocks in Plume\
    \ can be higher without reducing security. Thus the confirmation time of blocks\
    \ can be accelerated. This paper also analyzes the probability of confirmation\
    \ in different conditions and also proves that Plume is secure no matter the randomness\
    \ from traditional single chain is unbiased or not. At last, this paper simulates\
    \ performance with 1000 nodes using NS-3. The throughput can be improved to 400\
    \ Tps in the case that block size is 100K bytes and time interval of fast block\
    \ is 1 second. Also the confirmation time can be reduced to within 2 minutes in\
    \ the case that block size is 10K bytes and time interval is 1 second.\n\n# **CCS\
    \ CONCEPTS**\n\n+   *   *Security and privacy* → **Network security**. *Computer\
    \ systems organization* → *Availability*.\n\n# **KEYWORDS**\n\nthroughput, finality,\
    \ DAG, consensus protocol\n\n# **ACM Reference Format:**\n\nPan Yeda, Pi Bingfeng,\
    \ and Sun Jun. 2021. Plume: Fast Finality Blockchain without Single Failure Point.\
    \ In *2021 2nd Asia Service Sciences and Software Engineering Conference (ASSE’21)*,\
    \ February 24–26, 2021, Macau, Macao. ACM, New York, NY, USA, 10 pages. [https://doi.org/10.1145/3456126.3456128](https://doi.org/10.1145/3456126.3456128)\n\
    \n# 1 INTRODUCTION\n\nAs a new technology, blockchain has great potential to be\
    \ applied in various fields including finance [12] [19] [18], Internet of Things\
    \ [6] and supply chain [15]. Bitcoin designed in 2008 is the first application\
    \ of blockchain, and brought its underlying technology, blockchain has protocol,\
    \ to the public. Later on, the security of blockchain has been proved by [5] and\
    \ [13], which provide security assurance for the use of blockchain. According\
    \ to [5], we must limit the rate of growth to a certain range to avoid causing\
    \ too many forks to decrease the computing power of honest parties.\n\nWhat prevents\
    \ blockchain from being widely used in real life is its throughput and confirmation\
    \ time. On average, the throughput of Bitcoin is about 3 tx/s [1], and the confirmation\
    \ time is more than 1 hour. Ethereum speeds up the rate of generating blocks to\
    \ approximate 11s [2] and the confirmation time is not enough to deal with the\
    \ actual scenes. Thus, it is important to find means to overcome these two problems.\n\
    \nNowadays, there are two main methods to increase throughput, which are sharding[20][7]\
    \ and DAG[8]. Sharding divides the participants into several smaller committees\
    \ so that committees can pack transactions in parallel to improve throughput.\
    \ DAG changes the single-chain to directed acyclic graph where the generation\
    \ of blocks can be accelerated without considering the network delay. The two\
    \ ways can indeed increase throughput, but they cannot increase confirmation speed\
    \ fundamentally.\n\nSompolinsky and others [17] found if a structure accepted\
    \ all the blocks, it would remove the rate limitation of generating blocks with\
    \ our reduce the decentralization. DAG is such a structure. Therefore, our goal\
    \ is to provide the DAG structure a natural sequence and achieve steady and fast\
    \ confirmation. In this paper, we use the traditional single-chain blockchain\
    \ to ensure overall security, and use the DAG structure to increase throughput\
    \ and confirmation rate.\n\nIntuitively, we utilise the traditional single-chain\
    \ blockchain to get randomness which can be used to select committee to construct\
    \ DAG structure and sort it. Every party in the network can get the qualification\
    \ of creating blocks with a certain probability. As long as the traditional single-chain\
    \ blockchain is secure, adversaries cannot control the order of our DAG structure.\
    \ And our DAG structure has a natural sequence that comes from the randomness,\
    \ thus, we can get a steady confirmation.\n\nWe use the DAG structure to get rid\
    \ of the speed limit of generating blocks. In the single-chain blockchain, a block\
    \ cannot be generated until its previous block broadcasts almost entire network\
    \ to avoid forks. While as for DAG, we do not need to wait for one block to go\
    \ all over the network to generate the next block, because all the blocks would\
    \ included in the DAG at last. At the same\n\nPermission to make digital or hard\
