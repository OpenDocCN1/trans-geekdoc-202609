    in 4.1;

    • The timestamp in the fast block consists with the value of slot;

    • For each fast blocks $B_p$ in Parents$[B_f]$, |Slot[$B_f$]-Slot[$B_p$]| ≤ 2
    · Δ, where Δ is the maximum network delay.


    **DEFINITION 3.3. Pending fast block set pendingSet[Ĝ]**


    We define that the pending fast block set consists of all the valid fast blocks
    whose reception time are later than the maximum delay, and we denote this set
    as pendingSet[Ĝ].


    **DEFINITION 3.4. Candidate fast block set candidateSet[Ĝ]**


    We define that the candidate fast block set consists of all the valid fast blocks
    that are received in Δ slots, and we denote this set as candidateSet[Ĝ].


    **DEFINITION 3.5. Confirmed fast block set confirmedSet[Ĝ]**


    If the number of Density[$B_f$, Slot[$B_f$] + Δ, Slot[$B_f$] + Δ + T)] is larger
    than Th, where Th and T are systemic parameters that will be discussed in section
    5. We regard the valid block as a confirmed fast block. All the confirmed fast
    blocks constitute the confirmed fast block set denoted as confirmedSet[Ĝ]. And
    the sorting is only for the fast blocks in confirmedSet.


    **DEFINITION 3.6. Fast block sequence Seq[Ĝ]**


    Once getting the confirmed fast block set, we need to order these fast blocks
    to get a fast block sequence denoted $S = \text{Seq}[\hat{G}]$. In the sequence,
    every fast block $B_f$ has a unique sequence number, that is Index[$B_f$]. And
    a DAG structure corresponds to a fast block sequence that would extend with the
    DAG grows, but the earlier part of the sequence will not change. And we use len[S]
    to denote the number of fast blocks in S. Like slow chains, the notation $S^{[\kappa]}$
    denotes the entire sequence S except the trailing κ fast blocks, and symbol $\preceq$
    denotes the prefix relationship.


    **DEFINITION 3.7. Finality state**


    If a fast block $B_f$ gets its sequence number Index[$B_f$] of in sequence Seq[Ĝ],
    this block has reached its finality state.


    Here, the finality means the block can be reverted with negligible probability.


    **Security definitions.** We assume that there is a DAG structure Ĝ in every party’s
    view, and accordingly, there is a fast block sequence Seq[Ĝ]. A fast blockchain
    protocol should satisfy unique sequence number, stable finality state, sequence
    growth, sequence quality and sequence common prefix. Intuitively, unique sequence
    number requires that a fast block in Seq[Ĝ] must have a unique sequence number.
    Stable finality state requires the sequence number of a fast block cannot be changed.
    The remaining three properties are similar to the three security properties for
    slow blockchain. We will formally define these properties below.


    +   • **Unique sequence number:** For any two different fast block $B^1_f$ and
    $B^2_f$ in a Seq[Ĝ], Index[$B^1_f$] ≠ Index[$B^2_f$]. And if Slot[$B^1_f$] < Slot[$B^2_f$],
    Index[$B^1_f$] must be less than Index[$B^2_f$].

    • **Stable finality state:** For any fast block $B_f$ in Seq[Ĝ], the possibility
    that Index[$B_f$] changes is negligible.


    +   • **Sequence growth:** The property needs a parameter $g \in \mathbb{R}$ that
    is the minimum growth rate. For any two honest parties P1 with local $\mathbf{S}_1
    = \text{Seq}[\hat{\mathcal{G}}_1]$ at slot $s_1$ and P2 with local $\mathbf{S}_2
    = \text{Seq}[\hat{\mathcal{G}}_2]$ at slot $s_2$, where $s_1 < s_2$, len[$\mathbf{S}_2$]
    − len[$\mathbf{S}_1$] ≥ g · (s2 − s1).

    • **Sequence quality:** The property needs parameter $\mu \in \mathbb{R}$ that
    is the proportion of honest parties, and parameter $\ell \in \mathbb{N}$. For
    any honest party P with local $\mathbf{S} = \text{Seq}[\hat{\mathcal{G}}]$ at
    slot $s_1$, it holds that for large enough ℓ consecutive fast blocks of $\mathbf{S}$,
    the ratio of honest fast blocks is at least $\mu$.

    • **Sequence common prefix:** For any honest player P1 with local $\mathbf{S}_1
    = \text{Seq}[\hat{\mathcal{G}}_1]$ at slot s1 and P2 with local $\mathbf{S}_2
    = \text{Seq}[\hat{\mathcal{G}}_2]$ at slot s2, where $s_1 < s_2$, it holds that
    $\mathbf{S}_1^{[\ell]} \preceq \mathbf{S}_2$.


    # 4 THE DETAILS OF OUR PROTOCOL


    The basic idea of our protocol called Plume is showed in Fig.1. Plume is a combination
    of traditional single-chain consensus protocol and DAG structure. There are two
    kinds of blocks in Plume. One is the traditional block denoted as $B_R$ that needs
    more time to generate in order to guarantee the integrated security. Another is
    the DAG block denoted as $B_f$ that can be generated fast. Plume is mainly divided
    into four parts, those are (1) generating randomness from slow blockchain and
    electing committee to generate fast blocks, (2) receiving fast blocks and ordering
    them, (3) generating fast blocks and organizing them into DAG structure, (4) storing
    the current state of DAG in slow blocks to speed up synchronization of new parties.
    Next, we will describe what the parts do.


    # 4.1 The structure of a fast block


    In this section, we will define the structure of fast blocks. We denote the blocks
    generated by committee as fast blocks, because these blocks can be generated in
    every slot without considering the maximum network delay. The header structure
    of fast block is showed in Table 7. We can see that the structure is different
    with the traditional blocks except the merkle root. The “(y, π)” can be equated
    with the “nonce” in traditional block which is defined in table 7 explicitly.
    Both of them are used for proving the party is qualified to generate these block.
    And the “slot” is utilized to verify the randomness r used to compute $B_f$ is
    correct. “reference number” is to declare how many fast blocks are referenced
    by this block, and the values need to match the content of “reference hash”. It
    should be noted that “reference” corresponds to the directed edges of DAG, and
    every fast block corresponds to a vertex in DAG. txlist is the list of transactions
    in the fast block that would be consistent with the merkle root. σ is a signature
    on the fast block, in order to prevent adversaries from using the (y, π) on other
    fast blocks.


    # 4.2 Getting randomness from slow blockchain and elect committee


    There are many researches on extracting randomness from blockchain, such as [4]
    and [3]. These research used the inherent randomness of the mining process itself.
    [4] proposed there are sufficient entropy in a block header so that an extractor
    can get an unbiased randomness from a block header. But malicious miners have
    the ability of selecting preferable blocks to broadcast, then there will be biases
    on the whole.'
