    he will decide which set the fast block belongs to. Because of network delay,
    there is the possibility that a party receives a fast block before receiving its
    ancestors. It is necessary to check if the ancestors have been received. If every
    blocks in Ancestor[$B_F$] and $B_F$ are all received in $\Delta$ slots, the party
    will add $B_F$ and blocks which is in Ancestor[$B_F$] that received in time but
    have not been in candidateSet, to candidateSet. If every blocks in Ancestor[$B_F$]
    are received in $\Delta$ slots but $B_F$ is'
