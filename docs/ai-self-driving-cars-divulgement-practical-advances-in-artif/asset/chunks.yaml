    process. Deep within the mathematically arcane elements of the neural network,
    data related to race and gender were intricately woven into the calculations,
    having been dug out of the initial training dataset provided when the ANN was
    crafted. That is an example of how biases can be hidden within an AI system. And
    it also showcases that such biases can go otherwise undetected, including that
    the developers of the AI did not realize that the biases existed and were seemingly
    confident that they had not done anything to warrant such biases being included.
