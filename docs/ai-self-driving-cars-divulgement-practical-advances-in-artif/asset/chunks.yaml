- raw: 'Which of those scenarios will playout? Time will tell. Conclusion One thing
    you can say about the self-driving car realm is that there is never a dull moment.
    Something is always happening. At times, the self-driving dream is touted by the
    media and everyone rushes to get a piece of the pie, while at other times the
    doom-and-gloom settles in and people wonder whatever happened about those self-driving
    cars that were going to be ubiquitously zipping around on all of our highways
    and byways. Take a moment to contemplate what the future will bring in terms of
    this new shakeup. Has Bezos just bought himself the deal of the century? Will
    Musk rue the day that he ribbed Bezos about the Zoox acquisition and find himself
    staring enviously at “AmaZoox” or is it “ZooxAma” when their self-driving vehicles
    are doing donuts around Teslas? Or will Amazon absentmindedly drift onto other
    matters, and the only remaining reference to Zoox occurs whenever a trivia question
    asks what was the name of those single-celled dinoflagellates that live in coral
    and jellyfish, for which the answer is Zooxanthellae but some might reminisce
    and exclaim the word Zoox instead. Those that are skeptical about the Amazon and
    Zoox being a match made in heaven are apt to predict that Tesla cars will soon
    be sporting bumper stickers that declare: “My Other Car Was Going To Be A Zoox,
    But It Got Lost Somewhere In The Amazon.” Fans of Zoox are decidedly more upbeat,
    and with a Spock-like recital are solemnly stating that Zoox shall live long and
    prosper. For the sake of self-driving cars, hopefully, the passion and verve underlying
    Zoox will continue to survive and thrive, and the era of  true self-driving cars
    will fervidly see its day. CHAPTER 12 TESLA WITH LIDAR AND AI SELF-DRIVING CARS
