    optical trick involved and one that typically impacts human drivers too. The Burger
    King sign was atop a tall pole and standing relatively close to the highway. If
    you have ever seen their prominent signs, they are notable because they have “Burger
    King” spelled out in bright red letters, boldly proclaimed, and the shape of the
