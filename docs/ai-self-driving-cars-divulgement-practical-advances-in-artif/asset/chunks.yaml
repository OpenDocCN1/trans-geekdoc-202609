- raw: 'CHAPTER 13 AUTOPILOT BK WHOPPER AND AI SELF-DRIVING CARS CHAPTER 12 AUTOPILOT
    BK WHOPPER AND AI SELF-DRIVING CARS What do AI, self-driving cars, Tesla, Autopilot,
    and hamburgers such as the infamous Burger King Whopper all have in common? Well,
    a whopper of a story, of course. A recent ad campaign by Burger King has this
    smarmy catchphrase: “Smart cars are smart enough to brake for a Whopper.” And,
    just to make sure that the ad comes with all the toppings, they also indicate
    “Artificial Intelligence knows what you crave.” Admittedly, it is yet another
    notable example of Burger King cleverly leveraging what otherwise might have been
    a smalltime viral social media item into something indubitably marketable to sell
    those vaunted burgers and fries. This time their eagle eye and caustic wit involve
    a facet of automation that powers self-driving cars and perchance involves the
    use of a Tesla running Autopilot, which is not yet a full-fledged self-driving
    capability. Here’s the backstory about the so-called Autopilot Whopper tale. In
    May of this year, a video was posted on YouTube by a driver recording a highway
    driving journey that purports to showcase a Tesla running Autopilot that mistakenly
    classifies a roadside Burger King sign as possibly a stop sign. Note that the
    car merely began to slow down, gradually, and did not react jerkily or opt to
    radically try to come to a halt upon detecting what it interpreted as a possible
    stop sign. How do we know what the car was trying to do? Per the video recording
    made by the driver, the console screen in the Tesla flashes the classic message
    of “Stopping for traffic control” that is a usual message to let the human driver
    know that the system detects some form of traffic condition warranting the car
