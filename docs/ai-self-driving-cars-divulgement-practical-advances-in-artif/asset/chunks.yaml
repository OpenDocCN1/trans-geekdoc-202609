    relish conspiracy theories are apt to even believe that if their computer happens
    to be the one that detects intelligent life, those intelligent beings might decide
    that the owner of that computer is the first to go. Yikes, you could have done
    yourself in by simply participating in the search (well, this seems kind of a
    wacky notion, but everyone has their own cup of tea).


    For those of you that are interested in participating in the search, you can potentially
    make use of `SETI@home`, which has been based at the University of California
    Berkeley, though recently they decided to halt the distribution of the home version
    of the software. Via the `SETI@home` downloadable program, which was free of charge,
    you could install software that analyzes radio telescope data and report the results
    of the analysis. When I say free of charge, realize that you need to have access
    to the Internet, which you are probably paying for already, and you are allowing
    your computer to work on the data, thus the computer needs to be powered on (incurring
    presumably electricity, which you are likely paying to use). Thus, there are some
    costs associated with your aiding the effort (e.g., your Internet access, your
    power consumption, your computer cycles), but it’s probably a negligible cost
    overall for you.


    Here’s an intriguing question: Could the advent of true self-driving cars potentially
    help us in the search for discovering intelligent life on other planets? My answer
    is yes. Let’s unpack the matter and see why.


    ## The Levels Of Self-Driving Cars


    It is important to clarify what I mean when referring to true self-driving cars.
    True self-driving cars are ones that the AI drives the car entirely on its own
    and there isn’t any human assistance during the driving task. These driverless
    cars are considered a Level 4 and Level 5, while a car that requires a human driver
    to co-share the driving effort is usually considered at a Level 2 or Level 3.
    The cars that co-share the driving task are described as being semi-autonomous,
    and typically contain a variety of automated add-ons that are referred to as `ADAS`
    (Advanced Driver-Assistance Systems). There is not yet a true self-driving car
    at Level 5, which we don’t yet even know if this will be possible to achieve,
    and nor how long it will take to get there. Meanwhile, the Level 4 efforts are
    gradually trying to get some traction by undergoing very narrow and selective
    public roadway trials, though there is controversy over whether this testing should
    be allowed per se (we are all life-or-death guinea pigs in an experiment taking
    place on our highways and byways, some point out).


    Since semi-autonomous cars require a human driver, computer processing capabilities
    are typically less powerful than the computers used on truly autonomous cars.
    As will be explained shortly, the powerful computers employed in self-driving
    cars will be the key to the suggestion that driverless cars can help find intelligent
    life outside of our planet.


    For semi-autonomous cars, it is important that I mention a disconcerting aspect,
    namely that in spite of those human drivers that keep posting videos of themselves
    falling asleep at the wheel of a Level 2 or Level 3 car, do not be misled into
    believing that you can take away your attention from the driving task while driving
    a semi-autonomous car. You are the responsible party for the driving actions of
    the car, regardless of how much automation might be tossed into a Level 2 or Level
    3.


    ## Self-Driving Cars And The Search For Intelligent Life


    For Level 4 and Level 5 true self-driving cars, since they are going to be equipped
    with quite powerful computers, we can consider how those driverless cars can be
    an aid in the search for intelligent life. The AI software will be running on
    the on-board computers and has the life-or-death role of driving the car. There
    isn’t a human driving the car. All the occupants inside a self-driving car are
    passengers. While a self-driving car is in motion, the AI is churning away and
    examining the sensory data to figure out what the driving scene consists of. The
    AI must interpret the data and make “decisions” about what the car should do next.
    This is a computationally intensive task and requires some rather impressive computing
    capabilities to be included in the driverless car.


    To get software updates for the AI system, there is an on-board electronic communication
    capability known as `OTA` (Over-The-Air). The `OTA` is also used to take the collected
    data from the on-board sensors and push it up into the cloud, allowing cloud-based
    servers to use the data to uncover additional Machine Learning and Deep Learning
    improvements about the driving task.


    At some point, if the driverless car is an `EV` (Electrical Vehicle), it likely
    needs to be parked and plugged into a charger to get the electrical power pumped
    back up. While the self-driving car is sitting there, presumably the AI has nothing
    much to do. The computers on-board the driverless car is relatively idle at that
    time. Guess what, you could potentially use those idle computing cycles to search
    for intelligent life! Yes, one means of leveraging the topnotch processors of
    a self-driving car would be to engage them in the same kind of radio signal processing
    that your home computer can do. A downloaded and bona fide `SETI` program could
    be sitting in the memory of the self-driving car and be activated when the car
    is parked and doing nothing else of merit. Via `OTA`, radio signal data would
    be downloaded into the on-board computer memory, and once the analysis is done,
    the results could be pushed up into the cloud. Might as well use the car’s computers
    for something that can possibly help mankind.


    You might be puzzled about the efficacy of having one self-driving car help in
    this manner, which doesn’t seem like a moving-the-needle kind of assistance, so
    why bother with it. There are about 250 million conventional cars in the United
    States today. Eventually, inexorably, it is assumed that those conventional cars
    will be retired and gradually be replaced by self-driving cars. Some argue that
    we might not need the same number of driverless cars, meaning that we might end-up
    with some lesser number of driverless cars to provide the equivalent transport
    volume as today’s 250 million conventional cars. Meanwhile, an equally compelling
    argument is that we might end up with more driverless cars than the number of
    today’s conventional cars, doing so because of the principle of induced demand.
    Induced demand is the concept that once you start something new it can bring forth
    added demand that was previously being suppressed. If people that today are mobility
    disadvantaged opt to use driverless cars, and if we all become expectant of near-instantaneous
    mobility-on-demand, the number of driverless cars needed to fulfill societal needs
    could well exceed the number of today’s conventional cars.


    Anyway, putting aside this unresolved debate about the count, perhaps we can all
    agree that there is likely to be at least some hundred if not many hundreds of
    millions of driverless cars in our future. If all those millions upon millions
    of self-driving cars were using their top-end computers to analyze the radio signals,
    it would be a huge boost in the search effort. It could be a game-changer in the
    search for intelligent life.


    Fleet owners of driverless cars could establish a `SETI` search capability into
    their fleet. As a passenger, you might be utterly clueless that the fleet is supporting
    the intelligent life search effort. Or, the automaker or fleet owner might intentionally
    want you to know about the search activities, using their largesse as a kind of
    marketing ploy. Hey, you all, use our ridesharing driverless cars since you are
    then supporting the search for intelligent life.


    I’ve so far emphasized that the on-board computers would be only leveraged when
    the driverless car is parked and has no other task at hand, but this is not the
    only circumstance that could allow for doing the radio signal analyses. As a human
    driver, you know that there are times while driving a car that involves sitting
    still and idling, such as when you are waiting at a red light or waiting to make
    a right turn and there is a pedestrian crossing in the crosswalk. During those
    idle moments, the on-board computer could spare a few cycles and crunch further
    on the radio signal data. Computers operate at tremendously fast speeds, and thus
    a handful of seconds that to you or me doesn’t seem like much available time is
    a ton of computational time for the on-board processors.


    We can up the ante. Your driverless car is on the freeway and zooming along. There
    is no other significant traffic nearby. The driving scene is pretty much barren
    of anything other than simply driving in a straight line. Yes, the on-board computers
    could potentially do some alien outer space life searching during those moments
    too.


    ## Conclusion


    Two birds with one stone. You can have driverless cars and meanwhile also be improving
    the search efforts to discover intelligent life on other planets. It seems like
    a great combo deal.


    Not so fast! There are some potential drawbacks. First, some might argue that
    any “spare” moments of the on-board computers ought to go toward the number one
    priority of driving the car. Even though a car is sitting at a red light, there
    is still the opportunity to be continually examining and re-examining the driving
    scene. The case can be made that the computers in a self-driving car should be
    exclusively used toward the driving task, at all times, including when the driverless
    car is parked (it could be reviewing it’s driving efforts of the day and finding
    improvements in how to drive better). As such, you can put your foot down and
    declare that the computers are sacrosanct on a self-driving car and must be solely
    devoted to being able to drive.


    Another concern is that the program used to search for intelligent life might
    somehow go awry. Suppose the search software causes the on-board computers to
    get into a locked-up loop and those computers are unable to be switched over into
    the driving mode. Not a good outcome. Indeed, the classic line of “first, do no
    harm” is a crucial one for anything that is running on-board the computers inside
    the driverless car. Worse too, suppose someone attaches a computer virus to the
    search program. A fleet owner that has downloaded the search software is providing
    a goldmine form of access to the virus maker. In a trojan horse manner, the nefarious
    virus could be easily and readily pushed out to millions of driverless cars, doing
    so under the innocent guise of trying to help mankind. You can see why there are
    some that eschews the idea of using driverless cars to aid in the intelligent
    life search. No sense in taking any chances with a multi-ton automobile that somehow
    could go astray, all due to a “silly” and unlikely chance of detecting creatures
    in outer space.


    On the other hand, there are those that hate to see computing cycles go to waste
    and perceive the advent of self-driving cars as a boon to the number of topnotch
    computers that we will have on this planet. Should all those computers be doing
    nothing of consequence when they have idle time? Can’t we put in place enough
    safeguards to ensure that the search for intelligent life by self-driving cars
    is intelligently and safely devised? Right now, the automakers and tech firms
    are struggling with just trying to get self-driving cars to drive properly, let
    alone be worried about the search for intelligent life. You likely won’t see anyone
    seriously entertaining this topic for years to come, only once the advent of true
    self-driving cars seems more assured.


    One final thought. Suppose though that the sooner we could find intelligent life,
    the sooner we might learn of tech advances that we haven’t yet conceived of. Perhaps
    the delay in using self-driving cars for finding intelligent life might delay
    our discovering that we can beam humans like in Star Trek and dispense with cars
    of any kind. Oops, that’s not necessarily a good business model for the automakers.

    '
  trans: '


    # 第 2 章 发现智慧生命与 AI 自动驾驶汽车


    我们的星球之外是否存在智慧生命？这里没人知道，尽管有大量努力在试图寻找答案。搜寻地外文明计划（`SETI`）已持续多年。最常用的搜寻手段是检测来自外太空的电磁脉冲。通过拦截这些在太空中辐射传播的脉冲，我们希望能发现任何可能成为智慧生命发射这些射线的明显线索的迹象。也许某些智慧生物正刻意试图向我们发送信息，从遥远的地方发出，并希望我们足够敏锐以探测到这些信息。从这个意义上说，该通讯可能是有目的的。又或者，可能有智慧生物在从事某些活动，导致产生了电磁废气或溢出。在这种情况下，我们或许能走运，探测到这种泄漏，从而显著地发现智慧生命，而它或许尚未发现我们（我姑且大方地假设，如果你能领会我的意思，我们确实也是智慧生命）。


    做出这种惊人发现的几率有多大？你或许听说过著名的德雷克方程，这是科学家弗兰克·德雷克在 1960 年代初设计的一个公式，用于帮助估算我们银河系中存在智慧生命的几率。他的方程相对简单，却足够强大，经久不衰。许多人在其基础上进行了扩展，或批评了其中的某些要素。无论如何，他试图估算银河系中可被探测到的文明数量。通过监测窄带无线电信号并对信号进行大量分析，或许我们能查明智慧生命离我们很近（就在我们自己的银河系某处）。各路科学家都曾摆弄德雷克方程，有人称我们银河系中存在其他智慧生命且我们能探测到它们的概率接近于零（接近零到我们应假定它为零），而另一些人则声称这绝对是非零几率，我们有“合理”依据继续寻找。


    即使几率渺茫，我们仍可继续搜寻。人们搜寻的原因多种多样。一是出于纯粹的好奇心。二是如果存在智慧生命，或许我们能从它们那里学到一些有益于我们的东西。还有一个原因是科幻作品的描绘：也许智慧生命最终会来接管我们的星球，因此我们最好在它们入侵之前先找到它们。


    作为搜寻工作的一部分，计算机可用于检查科学家正在收集的来自外太空的无线电信号。这是一项计算机执行的繁琐工作，涉及在无线电信号中从数学上寻找模式。总的来说，无线电波只是噪音，随机的这或那的比特，假设是如果信号中存在独特模式，可能意味着那些是作为有目的的信号或溢出信号发射出来的。具有海量计算能力的超级计算机一直在并将继续被用于检海量的无线电信号数据。这是一项永无止境的任务。


    多年前，有人意识到或许可以利用日常 PC 或人们的家用微型计算机来协助这场电子狩猎。开发了一款屏幕保护程序，可轻松加载到 PC 上，并作为搜寻工作的参与者。本质上，通过互联网，无线电信号数据块可被下载到
    PC，PC 会进行运算，然后报告结果。如果能让成千上万的 PC 执行此任务，并仔细协调数据的分配，其效果可媲美甚至超越单台超级计算机。有人将此比作搜寻智慧生命的民主化，也有人称这仅仅是利用地球上现存的数百万台日常台式机和笔记本电脑的一种务实方式。下载并使用该软件的人自愿允许他们的计算机参与搜寻工作。大多数时间你的计算机可能处于闲置状态，没有什么特别重要的任务。为什么不让它参与一项伟大的事业，静静地致力于发现我们疆域之外的智慧生命呢？


    你可能会说你不想知道是否存在其他智慧生命，因此决定不参与搜寻。或者，你可能不想让你的计算机用于除你自己目的之外的任何用途。那些热衷阴谋论的人甚至倾向于相信，如果他们的计算机恰好是探测到智慧生命的那一台，那些智慧生物可能会决定让那台计算机的主人第一个“走人”。哎呀，仅仅参与搜寻就可能让你自掘坟墓（好吧，这想法有点古怪，但萝卜青菜各有所爱）。


    对于有兴趣参与搜寻的人，你们可以潜在地使用 `SETI@home`，它总部设在加州大学伯克利分校，尽管最近他们决定停止分发软件的家用版本。通过 `SETI@home`
    可下载的程序（免费），你可以安装分析射电望远镜数据并报告分析结果的软件。当我说免费时，请意识到你需要接入互联网（这你可能已经在付费了），并且你允许你的计算机处理数据，因此计算机需要开机（产生电费，这你也大概率在付费）。因此，协助该工作涉及一些成本（如你的互联网接入、电力消耗、计算机周期），但总体上对你来说微不足道。


    这里有个引人入胜的问题：真正自动驾驶汽车的出现能否潜在地帮助我们搜寻其他星球上的智慧生命？我的回答是肯定的。让我们拆解此事，看看原因。


    ## 自动驾驶汽车的等级


    有必要澄清我提到真正自动驾驶汽车时的含义。真正自动驾驶汽车是指 AI 完全自主驾驶汽车，驾驶任务中无需任何人工协助。这些无人驾驶汽车被视为 4 级和 5 级，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为
    2 级或 3 级。共同分担驾驶任务的汽车被称为半自动驾驶汽车，通常包含各种自动化附加功能，称为 `ADAS`（高级驾驶辅助系统）。目前尚无 5 级真正自动驾驶汽车，我们甚至不知道能否实现，也不知需要多长时间。同时，4
    级的努力正逐渐尝试通过非常狭窄且具有选择性的公共道路试验获得进展，尽管关于是否应允许此类测试存在争议（正如一些人指出的，我们都是在高速公路上和小巷中进行的生死实验中的小白鼠）。


    由于半自动驾驶汽车需要人类驾驶员，其计算机处理能力通常不如真正自动驾驶汽车上使用的计算机强大。稍后将解释，自动驾驶汽车中采用的强大计算机将是无人驾驶汽车有助于寻找地球外智慧生命这一建议的关键。


    对于半自动驾驶汽车，重要的是我要提一个令人不安的方面：尽管那些人类驾驶员不断发布自己在 2 级或 3 级汽车方向盘前睡着的视频，但不要被误导，以为开半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论
    2 级或 3 级汽车投入了多少自动化技术，你都是汽车驾驶行为的责任方。


    ## 自动驾驶汽车与搜寻智慧生命


    对于 4 级和 5 级真正自动驾驶汽车，既然它们将配备相当强大的计算机，我们可以考虑这些无人驾驶汽车如何协助搜寻智慧生命。AI 软件将运行在车载计算机上，承担驾驶汽车的生死攸关角色。车内无人驾驶。自动驾驶汽车内的所有乘员都是乘客。当自动驾驶汽车行驶时，AI
    正在高速运转，检查传感器数据以弄清驾驶场景包含什么。AI 必须解读数据并对汽车下一步该做什么做出“决策”。这是一项计算密集型任务，要求无人驾驶汽车包含一些相当令人印象深刻的计算能力。


    为了获取 AI 系统的软件更新，车载有一种称为 `OTA`（空中下载技术）的电子通信能力。`OTA` 还用于采集车载传感器收集的数据并将其推送到云端，让基于云的服务器利用这些数据挖掘关于驾驶任务的额外机器学习和深度学习改进。


    在某个时刻，如果无人驾驶汽车是 `EV`（电动汽车），它可能需要停靠并插上充电桩以补充电力。当自动驾驶汽车停在那里时，推测 AI 没什么大事可做。车载计算机此时相对闲置。猜猜看，你可以潜在地利用那些闲置的计算周期来搜寻智慧生命！是的，利用自动驾驶汽车顶级处理器的一种方式是让它们从事与你的家用计算机相同类型的无线电信号处理。一个下载的、正规的
    `SETI` 程序可以驻留在自动驾驶汽车的内存中，并在汽车停放且无其他有价值任务时被激活。通过 `OTA`，无线电信号数据将被下载到车载计算机内存，分析完成后，结果可被推送到云端。不妨让汽车的计算机做些可能造福人类的事。


    你可能会困惑，让一辆自动驾驶汽车以这种方式提供帮助似乎无法起到决定性作用，那为什么还要费心呢。美国目前约有 2.5 亿辆传统汽车。最终，不可避免地，人们假设这些传统汽车将逐渐退役并被自动驾驶汽车取代。有人认为我们可能不需要同样数量的无人驾驶汽车，意味着我们最终拥有的无人驾驶汽车数量可能少于今天的
    2.5 亿辆传统汽车，却能提供同等的运输量。同时，一个同样有力的论点是，我们最终可能拥有比今天传统汽车更多的无人驾驶汽车，这是由于诱导需求原理。诱导需求是指一旦你开始某种新事物，它可能会带来此前被抑制的额外需求。如果如今处于出行劣势的人群选择使用无人驾驶汽车，且我们都习惯了近乎即时的按需出行，满足社会需求所需的无人驾驶汽车数量完全可能超过今天的传统汽车数量。


    无论如何，撇开这场关于数量的未决辩论，或许我们都能同意，未来极有可能至少有数亿辆无人驾驶汽车。如果所有这些成百上千万的自动驾驶汽车都利用其顶级计算机分析无线电信号，将极大地推动搜寻工作。这可能成为搜寻智慧生命的游戏规则改变者。


    无人驾驶汽车车队所有者可在其车队中建立 `SETI` 搜寻能力。作为乘客，你可能完全不知车队正在支持智慧生命搜寻工作。或者，汽车制造商或车队所有者可能有意让你知晓搜寻活动，将其慷慨行为作为一种营销噱头。嘿，各位，使用我们的网约车无人驾驶汽车吧，因为你们
    بذلك就在支持智慧生命搜寻。


    到目前为止，我强调车载计算机仅在无人驾驶汽车停放且无其他任务时才被利用，但这并非允许进行无线电信号分析的唯一情况。作为人类驾驶员，你知道开车时有时会涉及静止怠速，比如在红灯前等待，或等待右转时有行人正在斑马线上过马路。在这些闲置时刻，车载计算机可腾出几个周期进一步处理无线电信号数据。计算机运行速度极快，因此对你我而言似乎微不足道的几秒钟，对车载处理器来说却是海量的计算时间。


    我们可以再提高赌注。你的无人驾驶汽车在高速公路上飞驰。附近无其他重要交通。驾驶场景除直线行驶外几乎空无一物。是的，车载计算机在这些时刻也潜在地可以进行外星智慧生命搜寻。


    ## 结论


    一石二鸟。你可以拥有无人驾驶汽车，同时也能改进搜寻其他星球智慧生命的工作。这似乎是个绝妙的组合交易。


    别急！存在一些潜在缺点。首先，有人可能会争辩说，车载计算机的任何“闲置”时刻都应用于驾驶汽车这一头等大事。即使汽车停在红灯前，仍有机会持续检查和复查驾驶场景。理由可以是：自动驾驶汽车中的计算机应始终专门用于驾驶任务，包括无人驾驶汽车停放时（它可能在回顾当天的驾驶表现，寻找改进驾驶的方法）。因此，你可以强硬地宣称：自动驾驶汽车上的计算机是神圣不可侵犯的，必须专心致志地用于驾驶。


    另一个担忧是，用于搜寻智慧生命的程序可能以某种方式出错。假设搜寻软件导致车载计算机陷入死循环，导致这些计算机无法切换回驾驶模式。后果不堪设想。确实，“首先，不伤害”这条经典准则对于运行在无人驾驶汽车车载计算机内的任何事物都至关重要。更糟的是，假设有人在搜寻程序中植入了计算机病毒。下载搜寻软件的车队所有者无意中为病毒制造者提供了一座金矿般的入口。以特洛伊木马的方式，恶意病毒可在造福人类的无辜幌子下，轻松推送到数百万辆无人驾驶汽车上。你能明白为何有些人反对利用无人驾驶汽车协助智慧生命搜寻。没必要拿一辆重达数吨的汽车冒险，让它因“愚蠢”且极不可能的探测外太空生物的机会而偏离轨道。


    另一方面，有人痛恨看到计算周期白白浪费，并视自动驾驶汽车的出现为我们将拥有的顶级计算机数量的福音。所有这些计算机在闲置时难道不应做些有意义的事吗？我们难道不能建立足够的保障措施，确保自动驾驶汽车搜寻智慧生命是智能且安全设计的吗？目前，汽车制造商和科技公司正努力只让自动驾驶汽车正常行驶，更别提操心搜寻智慧生命了。未来多年内，你大概率不会看到有人认真探讨这个话题，只有当真正自动驾驶汽车的出现似乎更有把握时才会。


    最后一个想法。假设我们越早发现智慧生命，就越早可能了解到我们尚未构想的技术进步。也许利用自动驾驶汽车寻找智慧生命的延迟，会延缓我们发现可以像《星际迷航》那样传送人类、从而彻底摆脱任何汽车的那一天。哎呀，那不一定是汽车制造商的好商业模式。


