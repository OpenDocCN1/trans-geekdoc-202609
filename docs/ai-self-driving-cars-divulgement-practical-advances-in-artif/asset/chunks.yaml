    I also develop AI software. I do what I describe. It also gives me insights into
    what others that are doing AI are really doing versus what it is said they are
    doing. Many faithful readers had asked me to pull together my insightful short
    essays and put them into another book, which you are now holding. For those of
    you that have been reading my essays over the years, this collection not only
    puts them together into one handy package, I also updated the essays and added
    new material. For those of you that are new to the topic of self-driving cars
    and AI, I hope you find these essays approachable and informative.


    I also tend to have a writing style with a bit of a voice, and so you''ll see
    that I am times have a wry sense of humor and poke at conformity. As a former
    professor and founder of an AI research lab, I for many years wrote in the formal
    language of academic writing. I published in referred journals and served as an
    editor for several AI journals. This writing here is not of the nature, and I
    have adopted a different and more informal style for these essays. That being
    said, I also do mention from time-to-time more rigorous material on AI and encourage
    you all to dig into those deeper and more formal materials if so interested.


    I am also an AI practitioner. This means that I write AI software for a living.
    Currently, I head-up the Cybernetics Self-Driving Car Institute, where we are
    developing AI software for self-driving cars. For those of you that are reading
    this book and have a penchant for writing code, you might consider taking a look
    at the open source code available for self-driving cars. This is a handy place
    to start learning how to develop AI for self-driving cars. There are also many
    new educational courses spring forth. There is a growing body of those wanting
    to learn about and develop self-driving cars, and a growing body of colleges,
    labs, and other avenues by which you can learn about self-driving cars. This book
    will provide a foundation of aspects that I think will get you ready for those
    kinds of more advanced training opportunities. If you''ve already taken those
    classes, you''ll likely find these essays especially interesting as they offer
    a perspective that I am betting few other instructors or faculty offered to you.
    These are challenging essays that ask you to think beyond the conventional about
    self-driving cars.


    # THE MOTHER OF ALL AI PROJECTS


    In June 2017, Apple CEO Tim Cook came out and finally admitted that Apple has
    been working on a self-driving car. As you''ll see in my essays, Apple was enmeshed
    in secrecy about their self-driving car efforts. We have only been able to read
    the tea leaves and guess at what Apple has been up to. The notion of an iCar has
    been floating for quite a while, and self-driving engineers and researchers have
    been signing tight-lipped Non-Disclosure Agreements (NDA''s) to work on projects
    at Apple that were as shrouded in mystery as any military invasion plans might
    be.


    Tim Cook said something that many others in the Artificial Intelligence (AI) field
    have been saying, namely, the creation of a self-driving car has got to be the
    mother of all AI projects. In other words, it is in fact a tremendous moonshot
    for AI. If a self-driving car can be crafted and the AI works as we hope, it means
    that we have made incredible strides with AI and that therefore it opens many
    other worlds of potential breakthrough accomplishments that AI can solve.


    Is this hyperbole? Am I just trying to make AI seem like a miracle worker and
    so provide self-aggrandizing statements for those of us writing the AI software
    for self-driving cars? No, it is not hyperbole. Developing a true self-driving
    car is really, really, really hard to do. Let me take a moment to explain why.


    As a side note, I realize that the Apple CEO is known for at times uttering hyperbole,
    and he had previously said for example that the year 2012 was "the mother of all
    years," and he had said that the release of iOS 10 was "the mother of all releases"
    – all of which does suggest he likes to use the handy "mother of" expression.
    But, I assure you, in terms of true self-driving cars, he has hit the nail on
    the head. For sure.


    When you think about a moonshot and how we got to the moon, there are some identifiable
    characteristics and those same aspects can be applied to creating a true self-driving
    car. You''ll notice that I keep putting the word "true" in front of the self-driving
    car expression. I do so because as per my essay about the various levels of self-driving
    cars, there are some self-driving cars that are only somewhat of a self-driving
    car. The somewhat versions are ones that require a human driver to be ready to
    intervene. In my view, that''s not a true self-driving car. A true self-driving
    car is one that requires no human driver intervention at all. It is a car that
    can entirely undertake via automation the driving task without any human driver
    needed. This is the essence of what is known as a Level 5 self-driving car. We
    are currently at the Level 2 and Level 3 mark, and not yet at Level 5.


    Getting to the moon involved aspects such as having big stretch goals, incremental
