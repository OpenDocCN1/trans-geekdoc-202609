    itself might be hard to see or partially obscured on purpose. Shift gears for
    a moment. Suppose that there was a better way to detect and track when a drive-by
    shooting occurred. Imagine an improved method or approach of detection and tracking
    that might significantly undercut the assumption by perpetrators that they are
    bound to get away with this atrocious act. This could cause drive-by shootings
    to lessen. What such means might there be? Consider this interesting question:
    Will the advent of AI-based true self-driving cars be a deterrent to the act of
    drive-by shootings and potentially lessen or curtail this scourge? Let’s unpack
    the matter and see. Understanding The Levels Of Self-Driving Cars As a clarification,
    AI-based true self-driving cars are ones that the AI drives the car entirely on
    its own and there isn’t any human assistance during the driving task. These driverless
    vehicles are considered a Level 4 and Level 5, while a car that requires a human
    driver to co-share the driving effort is usually considered at a Level 2 or Level
    3. The cars that co-share the driving task are described as being semi-autonomous,
    and typically contain a variety of automated add-on’s that are referred to as
    ADAS (Advanced Driver-Assistance Systems). There is not yet a true self-driving
