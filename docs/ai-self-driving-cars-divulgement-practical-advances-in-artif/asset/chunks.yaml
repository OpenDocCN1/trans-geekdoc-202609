    ## Big Stretch Goal


    Trying to take a human and deliver the human to the moon, and bring them back,
    safely, was an extremely large stretch goal at the time. No one knew whether it
    could be done. The technology wasn''t available yet. The cost was huge. The determination
    would need to be fierce. Etc. To reach a Level 5 self-driving car is going to
    be the same. It is a big stretch goal. We can readily get to the Level 3, and
    we are able to see the Level 4 just up ahead, but a Level 5 is still an unknown
