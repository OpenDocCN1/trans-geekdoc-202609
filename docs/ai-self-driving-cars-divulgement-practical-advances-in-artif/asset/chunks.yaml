    is that by Bezos buying Zoox via Amazon, the humongous e-commerce firm is going
    to become a head-to-head competitor with Tesla’s self-driving ambitions. You could
    view this as two titans that are now going to be  fiercely locked in hand-to-hand
    combat (note that Amazon had already been dabbling in the self-driving industry,
    but one could say that this purchase of Zoox is a bold and gauntlet tossing stance).
    That is why Musk can taunt Bezos as being an imitator or copycat, kind of like
    hey-dude, welcome to the party, finally. One interpretation of this move by Bezos
    is that it showcases a staunch belief that self-driving cars are going to be vital
    and therefore are worthy of making a sizable investment (reportedly, Amazon is
    paying around $1.2B for Zoox, which seems hefty, but is loose change for Amazon
    some would say). On the other hand, given that Zoox was previously reportedly
    valued at around $3B or more, some wring their hands that this rock bottom price
    for a self-driving firm reveals the softness in this space and stokes anew qualms
    that self-driving might not happen, or at least not happen for a long time to
    come. The counterargument is that achieving self-driving is a money-hungry game
    and trying to get customary investors to pitch-in for a future that might be rosy
    and yet far off on the horizon, and maybe not even attainable, makes it incredibly
    difficult to remain as a standalone AV developer. You need to have deep pockets
    and a willingness to have dogged patience to make it in this niche, of which Amazon
    potentially has those kinds of traits. Sure, you could say that Amazon likely
    got an enormously discounted price, partially as a result of the recent pullbacks
    by all self-driving efforts in light of societal and economic conditions, but
    it allows Zoox to keep pushing forward and seemingly prevents what would be a
    hurtful loss to this industry if Zoox could not find some other attractive means
    to get new financing. There is more to this story though than meets the obvious
    eye. Allow me a moment to bring you up-to-speed. What Does Self-Driving Mean As
    background, Zoox is a self-driving car maker based in Silicon Valley that started
    in 2014 and has been an upstart ever since. What makes them outside the norm is
    their profound and unshakable belief that self-driving cars need to be derived
    from the ground up. What does that mean? Many of the self-driving software development
    entities are aiming their autonomous capabilities at conventional cars that are
    supplemented with elaborate sensor suites and other augmentations to render them
    into autonomously driven vehicles. Meanwhile, though Zoox has been doing the same
    by making use of specially outfitted Toyota Highlanders and Prius C’s, their overarching
    passion is to entirely reinvent the car as a platform. For example, in a human-driven
    car, it makes sense to always architect a car to drive forwards, since the human
    is sitting in a fixed position facing forward. That is the way we’ve sat and driven
    cars throughout the modern history of this amazing invention. But in a self-driving
    car, the AI is doing the driving, and as such you could engineer the vehicle to
    readily drive forward in either direction. Thus, scratch the archaic notion of
    at times driving “backward” and instead flip the driver orientation to being forwards,
    always, even if you perchance happen to be going in the reverse direction of which
    you just came. They refer to this as a symmetrical and bidirectional design, plus
    the vehicle would be a zero-emissions Electrical Vehicle (EV). You might be wondering,
    which is the better route to go, namely whether to add complex space-age stuff
    onto conventional cars or reimagine anew what a car consists of. The rub is that
    if you decide to go the seemingly radical route and attempt a never-been-done-before
    design, you potentially have two major battles to confront simultaneously. You
    have to ensure that the physical car itself can work and be safe on the roads
    and at the same time you also have to make sure that the AI and the self-driving
    stuff works properly too. That is why many of the self-driving car related efforts
    are focused on using various augmented everyday cars, attempting to reduce the
    variability and uncertainties in what is otherwise inarguably a moonshot-like
    aspiration. The logic is that you might prudently ease into the self-driving car
    realm by having a rock-solid foundation based on an already proven car, and thus
    deal only with the angst and throes underpinning the AI self-driving capabilities.
    Zoox is essentially trying to have its cake and eat it too, doing so by using
    selected models of conventional cars that have been augmented with self-driving
    tech, including putting those onto the roadways for real-world tryouts, and pushing
    with great zeal behind-the-scenes on formulating a brand new purpose-built kind
    of car. If you have followed me so far on this explanation, let’s next dig more
    deeply into considering the multi-dimensional mind-bending implications of the
    tweet from Elon Musk. Everybody knows that Musk has been aiming to have Tesla
    become not just a premier automaker but also be the preeminent self-driving car
    provider too. Via the use of Autopilot and the sensors packaged into a Tesla vehicle,
    step-by-step there has been an incremental effort to gradually transform the semi-autonomous
    driving into a fully autonomous driving vehicle. Let’s make sure that everyone
    reading this knows one very clear cut and irrefutable point: Today’s Tesla’s are
    not fully autonomous. Despite whatever wild claims you hear, and those idiotic
    videos online of people falsely believing their Tesla can drive itself, this is
    a complete crock and a regrettable and dangerous falsehood. With today’s Tesla’s
    and all their “autopiloting” features, it is still a car that requires a human
    driver. On the autonomous driving scale, you would say that the vehicles are a
    Level 2. True autonomous cars are at a Level 4 and someday at a hoped-for Level
    5. Zoox is focusing on Level 4 and Level 5. Tesla is at a Level 2 and trying to
    progressively make its way to a Level 4 and Level 5. So you could readily indicate
    that both Tesla and Zoox are ultimately seeking to achieve true self-driving,
    though Tesla is doing so from a lesser level of semi-autonomous driving, while
    Zoox is skipping past those lower levels and striving instead for the topmost
    ones. Nobody can say for sure which path is the better route. Firms like Tesla
    would undoubtedly claim they are taking the “right” approach by a stepwise refinement
    methodology. What many people do not quite seem to realize is that Tesla is opening
    themselves to a lot of costly risks and potential downfall by embarking upon Level
    2 and presumably into a Level 3. I’ve exhorted repeatedly that we are going to
    have human drivers that do not take seriously their responsibilities as the driver
    of a Level 2 or Level 3 car. When there are car crashes involving Level 2 and
    Level 3 vehicles, the automaker immediately attempts to absolve themselves of
    all blame by pointing out that the human driver is the responsible party for the
    driving task. Whether this will continue to grant those firms a kind of scot-free
    liability remains to be seen, and my prediction is that there will likely be massive
    lawsuits that are going to potentially severely ding such firms and even put some
    of them out-of-business. As such, some maintain that the path of Zoox and others
    that are leapfrogging to Level 4 and eventually Level 5 is the more prudent approach,
    avoiding what might become an ugly and firm-destroying tussle by being mired in
    the muck of Level 2 and Level 3. Of course, those in the Level 2 and Level 3 are
    apt to claim that it is more likely they will get to Level 4 and then Level 5,
    sooner, since they will have built their way there, learning and reusing as they
    go. And, meanwhile, they can rake in revenue from Level 2 and Level 3, versus
    those having essentially no revenue at all while struggling with getting Level
    4 ready for use in the everyday world. The additional twist is that some of the
    Level 4 and Level 5 aimers are using their autonomous driving capabilities for
    aspects other than solely driving a passenger-based car. By leveraging related
    use cases, this can potentially imbue those firms into viable revenue streams
    sooner and keep the lights on. There are efforts of using self-driving delivery
    vehicles and other modes of transport such as autonomous shuttles that might be
    considered more readily viable, meanwhile potentially continuing the scuffles
    of problematic passenger car requirements (some believe that Amazon is most likely
    eyeing the use of Zoox capabilities for handling delivery and logistics mobility
    matters, more so than as rider or ride-sharing vehicle provider). What Will Amazon
    Do With Zoox In the case of Tesla, it seems rather apparent that Musk has a (heavy)
    hands-on approach and appears to be routinely if not daily putting his two cents
    into what is happening with Autopilot and the self-driving aspirations of the
    firm. You would be hard-pressed to suggest that Musk does otherwise. And probably
    get a tweet or two to set you straight. What will happen with Zoox and the potential
    hands-on or maybe arms-length reach of Jeff Bezos? According to the formal press
    release issued about the Amazon and Zoox deal, apparently, Zoox will remain as
    an independent operation within the Amazon empire. Some are dubious about such
    a declaration, and we have seen similar such assertions made when a large firm
    buys another company and yet the independence radiance does not last for very
    long (if it ever even had a semblance of happening). Put on your clairvoyance
    cap and let’s examine the self-driving era crystal ball to see what might happen
    to Zoox while within Amazon. Here are the Top Five scenarios: '
