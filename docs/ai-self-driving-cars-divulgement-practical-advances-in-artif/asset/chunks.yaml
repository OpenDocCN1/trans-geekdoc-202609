- raw: 'Some states have laws specifically directed at drive-by shootings, providing
    a particular indication about nature and repercussions associated with this decidedly
    illegal act. Besides the harm to an intended victim, a drive-by shooting is bound
    to potentially incur collateral damage, possibly striking innocent bystanders.
    The shooter might fire multiple rounds, doing so on a scattergun manner in hopes
    of striking the intended target and horrifically those rounds might find their
    way to hitting bystanders. An additional reason for the bullets hitting others
    is that the shooter inside a car is presumably not able to as readily aim at their
    intended target, having to do so from inside the vehicle, and even when outstretching
    an arm to try and use the firearm slightly outside the interior of the car, the
    result is likely to be poorly aimed (the shooter is undoubtedly nervous and anxious
    too, effecting any  accurate discharge of the firearm). The car is usually in
    motion, though perhaps having slowed down, yet nonetheless adds another confounding
    factor in being able to aim precisely at the victim, as does the potential distance
    to the target since the car is most likely on the roadway and the target is some
    distance from the street (which, also explains why the instances of a bus stop
    or street corner are sometimes used, providing a closer-in target). Why do people
    do drive-by shootings? One obvious intent is gang-related. A rival of a gang might
    seek to shoot someone in a targeted gang. Trying to get near to the intended target
    by walking up to them could be difficult, perhaps due to being surrounded by a
    protective force of fellow gang members, and thus a quick drive-by seems to offer
    a chance of catching the victim off-guard and allowing too for an escape without
    harm. The drive-by shooting might be intended to kill, yet only end-up injuring
    the victim or might be intending to injure and yet result in killing the victim
    (or others). Drive-by shootings will frequently lead to a retributive act, and
    therefore one drive-by shooting can spark a spate of subsequent drive-by shootings
    by each side, in turn. This provides a kind of multiplier and can in a sense socially
    and virally trigger a series of drive-by shooting efforts. Other reasons that
    people do drive-by shootings include being on drugs or drunk and opting to do
    a drive-by shooting while impaired, perhaps feeling strengthened in doing so due
    to the intoxication. A drive-by shooting might be planned and carefully performed,  or
    it could be ad hoc and occur on the spur of the moment. There are instances of
    sudden road rage whereby a driver of a vehicle got upset at another driver or
    a pedestrian and pulled out a gun to take a shot at the perceived offender. The
    intended target might have been singled out or could be someone randomly chosen.
    The law typically considers whether the drive-by shooting was willfully performed
    and whether it was maliciously conducted. At times, the shooter is the driver,
    taking on both roles, while in other cases there is a driver, while the shooter
    is strictly a passenger.  In theory, a passenger doing the shooting is less encumbered
    since they are not tasked with driving and might be more able to target the victim.
    All told, this brings us to a final overarching point and important question,
    notably why a drive-by shooter is not necessarily caught, either at the time of
    the shooting or subsequently thereafter (again, stats are hard to come by on the
    odds of getting caught, which it seems when gangs are involved tends to be less
    likely, since a rival gang is presumably not likely to report the incident). You
