    # CHAPTER 13 AUTOPILOT BK WHOPPER AND AI SELF-DRIVING CARS


    What do AI, self-driving cars, Tesla, Autopilot, and hamburgers such as the infamous
    Burger King Whopper all have in common? Well, a whopper of a story, of course.
    A recent ad campaign by Burger King has this smarmy catchphrase: “Smart cars are
    smart enough to brake for a Whopper.” And, just to make sure that the ad comes
    with all the toppings, they also indicate “Artificial Intelligence knows what
    you crave.” Admittedly, it is yet another notable example of Burger King cleverly
    leveraging what otherwise might have been a smalltime viral social media item
    into something indubitably marketable to sell those vaunted burgers and fries.
    This time their eagle eye and caustic wit involve a facet of automation that powers
    self-driving cars and perchance involves the use of a Tesla running Autopilot,
    which is not yet a full-fledged self-driving capability.


    Here’s the backstory about the so-called Autopilot Whopper tale. In May of this
    year, a video was posted on YouTube by a driver recording a highway driving journey
    that purports to showcase a Tesla running Autopilot that mistakenly classifies
    a roadside Burger King sign as possibly a stop sign. Note that the car merely
    began to slow down, gradually, and did not react jerkily or opt to radically try
    to come to a halt upon detecting what it interpreted as a possible stop sign.
    How do we know what the car was trying to do? Per the video recording made by
    the driver, the console screen in the Tesla flashes the classic message of “Stopping
    for traffic control” that is a usual message to let the human driver know that
    the system detects some form of traffic condition warranting the car to be brought
    to a halt by the computer. The car remained in motion on the highway, and once
    the distance to the roadside sign diminished, the alert about an upcoming traffic
    control no longer displayed and the vehicle accelerated back up to the posted
    speed limit.


    You might say this was a no-harm, no-foul situation. No one was hurt, no car crash
    ensued, and it does not appear that traffic was disturbed in the least. That being
    said, yes, the automation did falsely at first interpret that the detected sign
    might be a stop sign and began to reduce speed accordingly, but once the car got
    close enough to make a more ascertained analysis, the system figured out that
    it was not a stop sign and continued unabated in traffic. Let’s take the video
    at face value and assume it is not faked or otherwise doctored. I mention this
    caveat since someone could readily craft such a video via any decent video editing
    software, but generally, the video seems to be a likely indication of what happened
    and we can reasonably assume it is an actual occurrence.


    Your first thought, perhaps similar to mine, consisted of whether this was a perchance
    one-time fluke or whether it would potentially happen a second time, a third time,
    and so on. We do not know for sure if it was repeatable per se, though about a
    month or so later, the same driver drove the same way again and posted a newer
    video showing that the Tesla did not appear to make the same mistake. In that
    subsequent video, the driver verbally congratulates Tesla for the seeming facet
    that the car had presumably “learned” to deal with the Burger King sign and no
    longer was falsely categorizing it as a stop sign. We cannot necessarily make
    that leap of logic, nor leap of faith. Why so? There could be other plausible
    reasons for why the vehicle did not react the same way as it had done the first
    time. Allow me a moment to elaborate.


    Imagine when you are driving a car and sometimes you might see something as based
    on the lighting and other environmental conditions, and you see a sign in a sharper
    way or a more occluded manner, depending upon the amount of sunshine, cloud cover,
    and the like. It could be that the camera detection differed from the first time
    and thus by luck of the draw the subsequent drive-by did not spot the sign at
    all, or it spotted the sign but got a better look at it this time. Realize that
    at a distance, a camera picture or video is going to have less detail and be dealing
    with objects that are only vaguely visible. Again, this is somewhat like how you
    might strain to figure out a faraway object, and similarly, the on-board computer
    system attempts to classify whatever it can see, even if only seen faintly.


    Many that are not involved in self-driving tech do not realize that driving, even
    by humans, consists of a game of probabilities and uncertainties. When you see
    something up ahead on the road resembling say roadway debris, a stationary object
    that is sitting on the road, you might not know if it is a hard object akin to
    a dropped toolbox from the bed of a truck, or maybe it is an empty cardboard box
    and relatively harmless. Until you get closer, you are pondering what the object
    might be, along with trying to decide in advance as to what course of action you
    should take. If you can switch lanes, maybe you should do so to avoid hitting
    the object. If you cannot readily switch lanes, maybe it is better to try and
    roll over the top of the object and thus not take other extreme measures like
    swerving or screeching to a halt.


    This brings up an important lesson about AI and self-driving tech, which is that
    it is not going to operate in some magical way and drive in pure perfection. Just
    as a human will struggle to identify what a roadway piece of debris is, and has
    to ascertain driving options, likewise the AI has to do the same. That’s also
    why I keep exhorting that this notion of zero fatalities due to adopting AI driving
    systems is a false set of expectations. We are still going to have car crashes,
    despite having AI driving systems. In some cases, it could be that the AI “judges”
    improperly and takes the wrong driving action, while in other situations such
    as a pedestrian that unexpectedly darts in front of a moving car there are no
    viable alternatives available to avoid a collision. Keep in mind that even the
    revered AI-based true self-driving car is still bound by the law of physics. When
    something untoward happens, suddenly, without apparent prewarning, you can only
    stop a car as based on physics and cannot miraculously cause the vehicle to instantaneously
    cease in motion. Stopping distances are still stopping distances, regardless of
    human-driven versus AI-driven cars.


    That being said, it is certainly hoped that by having AI driving systems that
    fully operate a car, the number of car crashes due to human drunk driving and
    various human driving foibles will be significantly reduced and we will have a
    lot less injury and fatalities on our roadways (but, I emphasize, still not zero).
    In any case, just because the car did not repeat the mistaken identification of
    the Burger King sign on the subsequent run, we cannot assume that it was due to
    the car “learning” about the matter. Unless we are allowed to dig into the Autopilot
    system and the data being collected, it is not readily determinable what has perhaps
    altered, though it does seem like a reasonable guess that the system might have
    changed and can do a better job on dealing with the Burger King sign.


    ## What Is This Thing Learning


    Let’s suppose it was the case that the system was better able to categorize the
    Burger King sign. Does that mean that the system “learned” about the matter? First,
    whenever you use the word “learn” it can overstate what a piece of automation
    is doing. In a sense, the use of this moniker is what some people refer to as
    anthropomorphizing the automation. Here’s why. Suppose that AI developers and
    engineers in the backroom were examining the data being collected by their cars,
    including the video streams, and realized that the Burger King sign was being
    falsely classified as a stop sign. Those human developers might have tweaked the
    system to prevent it from doing so again. In that case, would you describe the
    automation as having “learned” what to do? Seems like a stretch.


    Or, suppose that the system was using Machine Learning (ML) or Deep Learning (DL),
    consisting of an Artificial Neural Network (ANN), which is a type of mathematical
    pattern matching approach that tries to somewhat mimic how the human brain might
    work (please be aware that today’s computer-based neural networks are a far cry
    from how the brain works, not at all equivalent, and generally a night and day
    kind of difference of the real thing). It could be that the HQ computer system
    on the backend via data collected from cars in the fleet has assembled the data
    into a cloud database, and might be set up to examine false positives (a false
    positive is when the detection algorithm thinks there is something there such
    as a stop sign, but it is not a stop sign). Upon computationally discovering the
    Burger King as a false positive, the system mathematically might flag that any
    such an image is decidedly not a stop sign and then this flag is pushed out to
    the cars in the fleet, doing so via the OTA (Over-The-Air) electronic communications
    that allow HQ to send data and program patches to the vehicles. Could you describe
    this as “learning” about Burger King signs? Well, you might try to make such a
    claim, exploiting the aspect that the computational methods are known as Machine
    Learning and Deep Learning, but for some this a stretch of the meaning associated
    with learning in any human-like manner.


    For example, a human that learned to not mistake Burger King signs might also
    have learned a lot of other facets at the same time. A human might generalize
    and realize that McDonald’s signs could be misinterpreted, maybe Taco Bell signs,
    and so on, all of which are part of the overarching semblance of learning. You
    could take that further. A human might learn about the whole concept that sometimes
    there are signs that resemble something else that we know, and thus, it is vital
    to carefully not assume that the traits of the Burger King sign are carried over
    into other aspects of making false identifications. This might also prompt the
    human to think about how they make other false assumptions based on quick judgments.
    Whenever they see someone, from a distance, perhaps judging them as to whether
    they are a certain kind of person is a premature act. And so on. I realize you
    might be pained to contemplate how far a human would really take the instance
    of a misclassified Burger King sign, but that misses the point I am trying to
    make. My point is that when a human learns, they usually (or hopefully) generalize
    that learning in a multitude of other ways. Some lump this into the idea that
    we have common sense and can perform common-sense reasoning. Shocker for you:
    There is not yet any AI that has any bona fide semblance of common-sense reasoning.
    Some assert that until we can get AI to embody common-sense reasoning, we will
    not achieve true AI, the kind of AI that is the equivalent of human intelligence,
    which nowadays is referred to as AGI or Artificial General Intelligence (suggesting
    that today’s typical AI is much narrower and simpler in scope and capability than
    the aspired version of AI). Overall, you would be hard-pressed to say that car
    automation has “learned” from the Burger King incident in any generalizable and
    full-reasoning way that a human might. In any case, people like to use the word
    “learn” when referring to today’s variant of AI, though it overstates what is
    happening and can cause overinflated and confounding expectations.


    ## The Puzzle About The Sign


    You might remember the famous scene in the movie Princess Bride involving a battle
    of wits, and one of the characters brazenly touts that he has only begun to proffer
    his logic. Let’s use that same bravado here. We have so far assumed that the Burger
    King sign was classified as a stop sign, momentarily so, while the car was traveling
    on a highway and approaching the off-highway signage. You might be thinking, why
    in the heck is a sign that isn’t actually on the roadway being examined as a potential
    stop sign and being given due consideration for coming to a stop? When driving
    your car on the highway, there are dozens upon dozens of off-highway stop signs
    and a slew of other traffic control signs that are quite readily visible from
    the highway, and yet you do not deem them worthy of bringing your car to a halt
    while on the highway. This is because you know that those signs are off the roadway
    and have nothing to do with your driving whilst on the highway. Imagine if every
    time you saw a formal traffic sign for local streets and yet they were not on
    the highway that you opted to react as though they were positioned on the highway.
    What a mess! You would be continually doing all sorts of crazy driving antics
    on the highway and be confusing all the other nearby drivers.


    In short, since the Burger King sign was not on the highway, it should have instantly
    been disregarded as a traffic control sign or any kind of sign worthy of attention
    by the automation. We could go extreme and say that if the Burger King sign was
    identical to a stop sign, in essence, replace the Burger King logo with an actual
    stop sign, this still should not matter. This brings us back to the so-called
    “learning” aspects. If the automation now has a computational indication that
    a Burger King sign is not a stop sign, this seems insufficient. We would also
    want it to “learn” that signs off the highway are not relevant to the highway
    driving, though, of course, there are exceptions that make this a necessarily
    flexible rule and you cannot simply declare that all off-the-road signs can be
    completely disregarded.


    Why did the automation seem to initially assess that the Burger King sign pertained
    to the highway? There is a bit of an optical trick involved and one that typically
    impacts human drivers too. The Burger King sign was atop a tall pole and standing
    relatively close to the highway. If you have ever seen their prominent signs,
    they are notable because they have “Burger King” spelled out in bright red letters,
    boldly proclaimed, and the shape of the sign is an oval, all of which does resemble
    from a distance the same overall look of a stop sign. Of course, the sign is purposely
    facing the highway to attract maximum attention. In this driving scenario, the
    car comes over a crest in the highway and the Burger King sign appears to be immediately
    adjacent to the highway and possibly could be construed as on the highway itself,
    as seen from a distance and based on the highway structure and coming over the
    crest. You most certainly have experienced such visual illusions before, and it
    is an easy phenomenon to fall for. Once you realize it is a Burger King sign,
    you don’t care anymore whether it is on the highway or off the highway since it
    does not require any action on your part (well, unless you are hungry and the
    signage sparks you to get off the highway for a burger).


    In theory, a human driver could have done the same thing that the automation did,
    namely begin to slow down as a precautionary act in case the sign was a stop sign.
    A novice driver might especially get caught by this kind of visual illusion the
    first few times they experience it, and thereafter presumably get the gist of
    what they are seeing. In that sense, as a human, you are learning by experience,
    essentially collecting data and then adjusting based on the data that you’ve collected.
    Potentially, the Machine Learning or Deep Learning that the automaker has established
    for self-driving automation can do somewhat likewise. A training data set is usually
    put together to try and train the ML/DL on what kinds of roadway signs to expect.
    The training data must include a sufficient variety of examples, otherwise, the
    computational calculations will overfit to the data and only those signs that
    are strictly obedient to the true sign will be later detectable. In the real world,
    stop signs are oftentimes defaced, bashed, or bent, possibly partially covered
    by tree limbs, and all sorts of other variations exist. If you used only the cleanest
    of stop signs to do the training of the ML/DL, the resultant in-car detection
    would undoubtedly be unable to ascertain lots of everyday and real-world distressed
    stop signs that are posted.


    One of the nightmare dangers for any self-driving car is the possibility of false
    negatives. A false negative is when let’s say a stop sign exists, but the automation
    does not construe the stop sign as a stop sign. This is bad. The automation could
    fail to make a required stop and the cataclysmic result could be a car crash and
    horrific outcomes. You could also assert somewhat the same about false positives.
    Suppose the automation fully mistook the Burger King sign as a stop sign and did
    come to a halt on the highway. Other drivers behind the stopped car could readily
    ram into the car since it inexplicably and unexpectedly stopped in the middle
    of a normally rushing along the highway.


    ## Conclusion


    Welcome to the conundrum facing those that are crafting self-driving cars. The
    goal is to prevent false negatives and prevent false positives, though this is
    not always going to be possible, thus, the system has to be adept enough to cope
    with those possibilities. For a Tesla on Autopilot, it is important to realize
    that the existing automation is considered at Level 2 of the automated driving
    capabilities, meaning that it is a driver-assisted kind of automation and not
    fully autonomous. For Level 2 cars, the human driver is still considered the responsible
    driver of the vehicle. In the case of falsely believing that the Burger King sign
    was a stop sign, even if the automation tried to come to a full stop, the human
    driver is presumed to be in-charge and should override that kind of adverse driving
    action. As I have repeatedly exhorted, we are heading into the dangerous territory
    of expecting human drivers to override automation in Level 2 and Level 3 rated
    cars, which you can bet many human drivers will not do or will do so belatedly
    due to a false belief that the car is soundly driving itself. You could say that
    human drivers will be making false positive and false negative judgments about
    what their car automation is doing, any of which can then lead to dreadful calamity.
    That is why some are arguing fervently that we ought to wait until the AI is good
    enough that we can use it in Level 4 and Level 5 self-driving cars, whereby the
    AI does all the driving and there is no human driving involved. If we can get
    there, it would mean that the Artificial Intelligence does “know what we crave”
    and that consists of a safe driving journey, burgers included or not.


    # CHAPTER 14 FIREWORKS CELEBRATIONS AND AI SELF-DRIVING CARS


    People are itching to use fireworks for this July 4th. According to the latest
    reported sales figures, fireworks are selling like pancakes, hot ones packing
    a firecracker punch, and there is no telltale end of sales in sight (well, other
    than generally extinguishing after July 4th). Why the feverish drive to obtain
    fireworks this year? Several reasons are being cited. First, most of the formal
    fireworks shows and events are canceled as a result of the concerns about crowds
    in a post-COVID setting, and thus there will not be an opportunity to witness
    those amazing mass displays this year. Secondly, if large-scale events aren’t
    in the cards, many have decided they will take matters into their own hands and
    put on their own fireworks show in front of their domicile. Third, some believe
    that setting off fireworks is a symbolic gesture in addition to being a fun activity.
    This means that there is an added impetus to engage with fireworks, doing so for
    the sport of it and to showcase a message or notable statement about our times.
    Fourth, and perhaps the most straightforward reason, after being stuck inside
    their homes for several months, people want to get outside and party, for which
    July 4th seems to offer an unbridled basis to do so. How many times a year can
    you lawfully sit or stand outside your house, typically making use of the street
    space too, and carry on, having the time of your life and making a ruckus along
    with outsized noises, explosions, and razzle-dazzle flames of fire and light.
    Pretty much our revered July 4th is the only time of the year to do so (well,
    maybe you can include New Year’s Eve, but that is a lesser scaled lightweight
    in comparison). And this year, July 4th lands on a Saturday, a weekend day that
    offers unmitigated revelry.


    Many people do not quite realize that for the fireworks industry, July 4th is
    the time of the year wherein around 90% of their revenue occurs in a rather tightly
    packed two-week period. It is considered a seasonal product, usually referred
    to as being hyper-seasonal due to the enormous dependence on such a limited window,
    and the rest of the year is spent getting ready for the next such annual celebration.
    Of course, there are the professional fireworks efforts that take place throughout
    the year. Many of the theme parks do fireworks shows year-round, while many sports
    make use of fireworks to herald runs scored or touchdowns made. Generally, the
    use of fireworks in a professional context is rather minuscule when compared to
    the incredible volume of public-used fireworks consumed for July 4th.


    You might think that it is blatantly evident that this July 4th would be a humongous
    fireworks gala. Believe it or not, when the pandemic first grabbed hold in March
    or so, there were some predictions made that perhaps this July 4th would be a
    colossal dud in terms of fireworks. The assumption was that we would all be steadfastly
    indoors and therefore not be able to step outside to undertake the use of fireworks.
    This belief momentarily stalled some of the fireworks companies as they wearily
    wondered if they would survive as a business, given that their entire yearly income
    stream was perhaps about to implode. We now know that the opposite seems to be
    poised to occur, namely that this will be the largest ever use of fireworks on
    July 4th by the general public. Fireworks firms are heralding this moment as an
    astonishing lottery ticket of its time, striking gold by perchance having a product
    that people are demanding to obtain. Another reason for the fireworks exuberance
    is the desire to do something different, other than sit around the house and play
    indoor games. You cannot go to the movie theatres since those are nearly all closed
    up, and you cannot go to the mall, and you cannot potentially even go out to eat
    at a restaurant. All in all, being cooped up and after exhausting all other options,
    the allure of using fireworks is immensely irresistible.


    ## Being Mindful About Fireworks


    One notable downside is that the sales of illegal fireworks appear to be up too.
    You might be thinking that buying illegal fireworks is no big deal. Unfortunately,
    besides being illegal, and besides denying sales to legitimate makers of fireworks,
    the other perhaps non-obvious concern is that those fireworks are going to likelier
    cause harm. As you know, even legal fireworks are dangerous, and people can get
    harmed. Per government studies, several thousand injuries are suffered each year
    at this time of the year by the use of fireworks. In one such government-run study;
    statistics indicate that children under the age of 15 account for over one-third
    of the injuries. Sparklers and bottle rockets are some of the most frequent injury-producing
    products, which makes logical sense since they are often carelessly used and frequently
    handed over to children to tryout. Not wanting to be gruesome, but please do realize
    that the most common injury is to the hands and fingers (around 28% of those with
    injuries), followed by the legs, eyes, and ears. Burns is the by far most common
    form of injury and can lead to disfigurement or outright loss of the appendage.
    Thus, with illegal fireworks, you are upping the ante on potentially injuring
    yourself or a loved one, and keep in mind that even with legal fireworks you are
    still taking risks for yourself and loved ones.


    Adding to the potential woes is the harm sometimes inflicted on others that have
    no part in your fireworks celebration. Getting a bit wild, those using fireworks
    on July 4th are apt to toss these explosive armaments into the air, landing on
    nearby neighbors, sometimes causing injury or potentially starting a fire by igniting
    a rooftop. The point is that everyone and I mean everyone, needs to be thoughtful,
    measured, and careful in using their fireworks this coming July 4th. Despite such
    high hopes, it is an easy bet that there will be lots of injuries, especially
    this year, due to the ramp-up of more so at-home fireworks parties and the likelihood
    that people will undoubtedly all want to come outside in front of their homes
    to see the neighborhood plethora of impromptu fireworks extravaganzas. Emergency
    rooms at hospitals are already gearing up for the result. If this seems overly
    doom and gloom, sorry to have cast a shadow on the merriment, but having seen
    firsthand the severe injuries that can occur and the long-lasting adverse impacts
    on a person’s life, including for small children, a bit of sobriety and cautioning
    are worth being seen as a sour stick-in-the-mud.


    Shifting gears, when people do fireworks in front of their homes, they usually
    opt to do so in the street. This makes obvious sense since your front yard might
    have grass or shrubs, all of which are easier to catch fire, whereas the asphalt
    of the street is seemingly impervious to the flames and explosions caused by fireworks.
    Have you ever tried to drive to the grocery store on a July 4th evening? If you
    have done so, you know that it is one of the trickiest and scariest nights of
    the year to be driving (even harder than traversing the roadways during Halloween).
    While navigating the streets in your neighborhood on July 4th, you need to slowly
    weave around the spots at which people have set up their fireworks displays. Also,
    some people are sitting in lawn chairs on the street, and children are running
    back and forth, readily targets to be hit by a moving car, and of which those
    kids are typically so excited that they aren’t looking for car traffic and are
    oblivious to what is occurring around them. Nighttime darkness tends to hide what
    exists in and around the streets, plus the sudden flashes of fireworks can muddle
    your vision, distract you from looking straight ahead, and startle a driver into
    making a rash driving judgment. Many a parent when asked to drive over to the
    store to get some more soda or chips is likely to think twice and suggest that
    it can wait until the next day.


    Another factor involved in driving on July 4th in the nighttime is that there
    are idiots and (I dare say) hoodlums that relish throwing firecrackers at moving
    cars. Not a good idea. Anyone opting to drive their car during the fireworks celebratory
    time is taking a big chance and must have a vital reason to do so. A related aspect
    is how to get a fireworks injured child or adult to the emergency room, which
    provides further complexity since you might drive yourself, but are limited to
    how fast you can go due to the obstructions and people in the streets, plus the
    same hurdles face any first responders driving ambulances or similar vehicles.
    All told, please be safe on this coming July 4th, and if possible, stay off the
    roads in terms of avoid doing any driving, especially during the prime-time fireworks
    activities in the evening.


    Mentioning the angst and throes of driving a car on July 4th brings up a related
    topic. Self-driving cars are gradually going to become viable as a form of transportation.
    The AI-based true self-driving cars will not make use of a human driver. Here
    is an intriguing question: Will AI-based true self-driving cars have any struggle
    with driving during a July 4th evening and if so, what kinds of difficulties might
    the AI driving systems confront? Let’s unpack the question and see.


    ## Understanding The Levels Of Self-Driving Cars


    As a clarification, true self-driving cars are ones that the AI drives the car
    entirely on its own and there isn’t any human assistance during the driving task.
    These driverless vehicles are considered a Level 4 and Level 5, while a car that
    requires a human driver to co-share the driving effort is usually considered at
    a Level 2 or Level 3. The cars that co-share the driving task are described as
    being semi-autonomous, and typically contain a variety of automated add-on’s that
    are referred to as ADAS (Advanced Driver-Assistance Systems). There is not yet
    a true self-driving car at Level 5, which we don’t yet even know if this will
    be possible to achieve, and nor how long it will take to get there. Meanwhile,
    the Level 4 efforts are gradually trying to get some traction by undergoing very
    narrow and selective public roadway trials, though there is controversy over whether
    this testing should be allowed per se. Since semi-autonomous cars require a human
    driver, the adoption of those types of cars won’t be markedly different than driving
    conventional vehicles, so there’s not much new per se to cover about them on this
    topic (though, as you’ll see in a moment, the points next made are generally applicable).
    For semi-autonomous cars, it is important that the public needs to be forewarned
    about a disturbing aspect that’s been arising lately, namely that despite those
    human drivers that keep posting videos of themselves falling asleep at the wheel
    of a Level 2 or Level 3 car, we all need to avoid being misled into believing
    that the driver can take away their attention from the driving task while driving
    a semi-autonomous car. You are the responsible party for the driving actions of
    the vehicle, regardless of how much automation might be tossed into a Level 2
    or Level 3.


    ## Self-Driving Cars And July 4th


    For Level 4 and Level 5 true self-driving vehicles, there won’t be a human driver
    involved in the driving task. All occupants will be passengers. The AI is doing
    the driving. Probably the most common misconception about self-driving cars is
    the false belief that they are going to be “superhuman” and drive in ways that
    are far superior to humans. We can certainly agree that the AI will not be driving
    while drunk, and in that sense, yes, this is an improvement over human drivers
    that opt to get behind the wheel while intoxicated. Would you though consider
    the act of not getting drunk to be the equivalent of “superhuman” capabilities?
    Seems doubtful. Note too that the generally accepted standard for the driving
    levels indicates that the AI is expected to drive in whatever manner a human driver
    could potentially drive on a roadway, which means that if a human can drive someplace,
    the AI ought to be able to do so too, though not necessarily beyond what a human
    can drive. Again, that would not be especially “superhuman” as to driving. Also,
    the existing levels of driving exclude the act of off-road driving. Thus, the
    AI might be able to do off-road driving, if the automaker and self-driving tech
    have such provisions, but it is not a requirement. For a wide variety of reasons,
    do not set up in your mind that AI driving systems are going to be superhuman,
    as it is misleading and provides false expectations.


    The reason that is an important point and fits this overall discussion about driving
    on July 4th is that you should not assume that a true self-driving car will magically
    drive in ways that exceed how humans would handle the driving circumstances. Sure,
    the AI will not be tipsy, and it will not be “frightened” as it tries to maneuver
    throughout the firework’s laden streets, thus avoiding those kinds of human driver
    foibles. On the other hand, detecting all those low laying objects is not easy
    for the self-driving car. Via the headlights of the vehicle, the cameras will
    be doing what they can to visually scan the scene and figure out what is taking
    place. Radar is going to possibly be detecting a lot of objects, though the ones
    close to the ground are challenging to discern. LIDAR would be helpful, as are
    the other sensors, though some like thermal imaging is going to get an eyeful
    when the fireworks are sparkling and spewing flames.


    Unlike a human, the AI is unlikely to have been programmed to cope with the specifics
    of a July 4th phenomenon. Humans know that there are lots of fireworks on the
    ground and that those are inherently dangerous. Furthermore, humans know that
    children are apt to be running around, sometimes even laying down or crouching
    in the middle of the street. Keep in mind that today’s AI lacks entirely any kind
    of common sense or what is referred to as common-sense reasoning. Currently, AI
    is very narrowly scoped and unable to “think” in the ways that humans can. This
    is crucial to realize since the AI is not going to “understand” what is taking
    place on July 4th and instead merely react to whatever happens to be seen in front
    of the vehicle. A human driver would have an overarching concept of what is occurring
    on the roadways and be able to presumably drive more astutely via having a generalized
    plan of how to deal with the matters. The AI would be taking everything one step
    at a time, as though it had no semblance of the context of why people are in the
    streets and nor what they are doing.


    You could argue that it doesn’t matter whether a driver has a big picture perspective,
    and the only thing that counts is what is immediately in front of the car. To
    some degree, it is the case that the action in front of the car is the most significant
    element, yet we also do a lot of anticipatory mental work when driving a car.
    For example, I might know that the street up ahead is one that has lots of families
    that live in the houses bordering the roadway, and I can guess that they will
    be outside on July 4th in large numbers. Meanwhile, if I make a right at the end
    of the block, I know that there is a side street that won’t likely have many people
    on it. Note that via visual cues alone, you could not make that same driving judgment,
    and would instead have to say go straight ahead into the street that had the mass
    gatherings, only realizing the situation upon directly seeing it. That’s what
    a self-driving car is apt to do. If you are thinking that a GPS and a map would
    avert this, it seems highly unlikely that any normal maps would provide a substantial
    clue about the aspect that the street is bounded by lots of families with small
    children and offer any such in-advance clues.


    There is another means though that can come to play for the AI. One aspect of
    self-driving cars is that they are using Machine Learning (ML) and Deep Learning
    (DL), a type of computational pattern matching that enables the AI to try and
    discover patterns. It could be that by driving around this July 4th, the ML/DL
    could attempt to “learn” what the streets are like in terms of gatherings and
    be better prepared for next and subsequent years. But this is probably not going
    to be happening this year. Most of the self-driving tryouts are not going to be
    on-the-roads on July 4th, rightfully so. The automakers and self-driving tech
    firms are right now coping with getting self-driving cars to safely drive in everyday
    circumstances. Any notion of driving in the once-a-year oddity of July 4th is
    considered an edge or corner case, suggesting that it is so unusual or extraordinary
    that it doesn’t deserve attention at this time, and instead would unduly sap energy
    toward the standard kind of driving.


    Another facet that would be difficult for the self-driving car is the potential
    for smoke from the fireworks to obscure what the camera sensors can see. The bright
    flashes of the fireworks could also impact the cameras and the nature of the visual
    imagery being captured and interpreted by the on-board computer system.


    ## Conclusion


    Trying to get a self-driving car to weave its way around a traditional fireworks
    gathering on the streets is something that goes beyond what most AI driving systems
    can readily accomplish today. The AI is usually programmed to be a timid driver,
    moving extremely cautiously, and the number of potential objects and obstacles
    would undoubtedly cause the system to decide to not proceed ahead, or do so at
    a pace slower than a snail or a turtle. What we need to do is add this kind of
    driving scenario to the list of specialized driving that we want self-driving
    cars to be able to eventually handle. Meanwhile, we will be pretty much dependent
    upon human drivers, which as I say, ought to avoid driving on the evening of July
    4th, if at all possible to so avert, and instead try to enjoy the festivities,
    doing so safely and determinedly not allowing anyone to get hurt. Be safe this
    July 4th!


