    ## Zoox 未来发展的五种情景


    ### Zoox 如虎添翼

    在此情景下，Amazon 内部向 Zoox 注入巨额资金，终于让那些 AI 开发者和工程师不再需要靠“胶带和口水”来维持运转，其影响力如同注入类固醇般全速前进，将
    Zoox 自动驾驶汽车推向行业顶峰，并以闪电般的速度推进发展。


    ### Zoox 因强风调整航向

    在此情景下，观点认为 Amazon 决定通过提供关于 Zoox 应前进方向的“建议”来对其独立性进行压力测试，也许会暂时否决专有车辆的概念，坚持认为只有 AI
    自动驾驶才是关键，推动公司转向使用经过改装的现有车辆进行自动驾驶，或采取其他类似耗尽实体精力的措施。


    ### Zoox 被博格同化

    在此情景下，你不妨把任何印有 Zoox 标志的钥匙扣和 T 恤放进纪念盒里作为收藏品，因为 Zoox 将会消失，完全被吸收进 Amazon 这个“博格”集体中，无论悲喜，最终结果都充满不确定性。


    ### Zoox 蒸发归于虚无

    在此情景下，Amazon 不对 Zoox 进行特别注资，任其“枯藤上悬”，逐渐地，人才被其他具备必要决心和支持自动驾驶雄心的公司挖走，剩下的 Zoox 看起来很像《硅谷》中
    Pied Piper 的变体，令人惊讶的是，Amazon 指派 Richard Hendricks 来领导该实体。


    ### Zoox 幻想成真

    在此情景下，Amazon 助力 Zoox 蓬勃发展，接下来发生的是超出许多人想象的反转：Zoox 在自动驾驶领域占据主导地位，带来的利润甚至超过 Amazon，而
    Amazon 的电商业务变得迟缓，Zoox 成为救世主，凭借自动驾驶业务市值攀升至万亿美元级别，Bezos 回顾对 Zoox 的收购，感谢自己的幸运星。

