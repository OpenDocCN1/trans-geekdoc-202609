    Which of the seven are you leaning toward? Maybe in the metaphysics world of Musk
    and his thinking outside the box, there are other reasons that none of us can
    yet fathom or divine. Since Musk also likes to at times grandly philosophize,
    perhaps the sighting isn’t real and only a dream that we are all caught up in.
