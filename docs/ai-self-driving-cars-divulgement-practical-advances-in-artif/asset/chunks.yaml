- raw: 'INTRODUCTION This is a book that provides the newest innovations and the latest
    Artificial Intelligence (AI) advances about the emerging nature of AI-based autonomous
    self-driving driverless cars. Via recent advances in Artificial Intelligence (AI)
    and Machine Learning (ML), we are nearing the day when vehicles can control themselves
    and  will not require and nor rely upon human intervention to perform their driving
    tasks (or, that allow for human intervention, but only require human intervention
    in very limited ways). Similar to my other related books, which I describe in
    a moment and list the chapters in the Appendix A of this book, I am particularly
    focused on those advances that pertain to self-driving cars. The phrase “autonomous
    vehicles” is often used to refer to any kind of vehicle, whether it is ground-based
    or in the air or sea, and whether it is a cargo hauling trailer truck or a conventional
    passenger car. Though the aspects described in this book are certainly applicable
    to all kinds of autonomous vehicles, I am focused more so here on cars. Indeed,
    I am especially known for my role in aiding the advancement of self-driving cars,
    serving currently as the Executive Director of the Cybernetic AI Self-Driving
    Cars Institute. In addition to writing software, designing and developing systems
    and software for self-driving cars, I also speak and write quite a bit about the
    topic. This book is a collection of some of my more advanced essays. For those
    of you that might have seen my essays posted elsewhere, I have updated them and
    integrated them into this book as one handy cohesive package. You might be interested
    in companion books that I have written that provide additional key innovations
    and fundamentals about self-driving cars.  Those books are entitled “Introduction
    to Driverless Self-Driving Cars,” “ Advances in AI and Autonomous Vehicles: Cybernetic
    Self-Driving Cars ,” “ Self-Driving Cars: “The Mother of All AI Projects,” “Innovation
    and Thought Leadership on Self-Driving Driverless Cars,” “New Advances in AI Autonomous
    Driverless Self-Driving Cars,” “Autonomous Vehicle Driverless Self-Driving Cars
    and Artificial Intelligence,” “Transformative Artificial Intelligence Driverless
    Self-Driving Cars,” “Disruptive Artificial Intelligence and Driverless Self-Driving
    Cars,  and “ State-of-the-Art AI Driverless Self-Driving Cars,” and “Top Trends
    in AI Self-Driving Cars,” and “AI Innovations and Self-Driving Cars,” “Crucial
    Advances for AI Driverless Cars,” “Sociotechnical Insights and AI Driverless Cars,”
    “Pioneering Advances for AI Driverless Cars” and “Leading Edge Trends for AI Driverless
    Cars,” “The Cutting Edge of AI Autonomous Cars” and “The Next Wave of AI Self-Driving
    Cars” and “Revolutionary Innovations of AI Self-Driving Cars,” and “AI Self-Driving
    Cars Breakthroughs,” “Trailblazing Trends for AI Self-Driving Cars,” “Ingenious
    Strides for AI Driverless Cars,” “AI Self-Driving Cars Inventiveness,” “Visionary
    Secrets of AI Driverless Cars,” “Spearheading AI Self-Driving Cars,” “Spurring
    AI Self-Driving Cars,” “Avant-Garde AI Driverless Cars,” “AI Self-Driving Cars
    Evolvement,” “AI Driverless Cars Chrysalis,” “Boosting AI Autonomous Cars,” “AI
    Self-Driving Cars Trendsetting,” “AI Autonomous Cars Forefront, “AI Autonomous
    Cars Emergence,” “AI Autonomous Cars Progress,” “AI Self-Driving Cars Prognosis,”
    “AI Self-Driving Cars Momentum,” “AI Self-Driving Cars Headway,” “AI Self-Driving
    Cars Vicissitude,” “AI Self-Driving Cars Autonomy,” “AI Driverless Cars Transmutation,”
    “AI Driverless Cars Potentiality,” “AI Driverless Cars Realities,” “AI Self-Driving
    Cars Materiality, “AI Self-Driving Cars Accordance,” “AI Self-Driving Cars Equanimity,”
    “AI Self-Driving Cars Divulgement” (they are available on Amazon). For this book,
    I am going to borrow my introduction from those companion books, since it does
    a good job of laying out the landscape of self-driving cars and my overall viewpoints
    on the topic. INTRODUCTION TO SELF-DRIVING CARS This is a book about self-driving
    cars. Someday in the future, we’ll all have self-driving cars and this book will
    perhaps seem antiquated, but right now, we are at the forefront of the self-driving
    car wave. Daily news bombards us with flashes of new announcements by one car
    maker or another and leaves the impression that within the next few weeks or maybe
    months that the self-driving car will be here. A casual non-technical reader would
    assume from these news flashes that in fact we must be on the cusp of a true self-driving
    car. We are still quite a distance from having a true self-driving car. A true
    self-driving car is akin to a moonshot. In the same manner that getting us to
    the moon was an incredible feat, likewise, is achieving a true self-driving car. 
    Anybody that suggests or even brashly states that the true self-driving car is
    nearly here should be viewed with great skepticism. Indeed, you’ll see that I
    often tend to use the word “hogwash” or “crock” when I assess much of the decidedly
    fake news about self-driving cars. Indeed, I’ve been writing a popular blog post
    about self-driving cars and hitting hard on those that try to wave their hands
    and pretend that we are on the imminent verge of true self-driving cars. For many
    years, I’ve been known as the AI Insider. Besides writing about AI, I also develop
    AI software. I do what I describe. It also gives me insights into what others
    that are doing AI are really doing versus what it is said they are doing. Many
    faithful readers had asked me to pull together my insightful short essays and
    put them into another book, which you are now holding. For those of you that have
    been reading my essays over the years, this collection not only puts them together
    into one handy package, I also updated the essays and added new material. For
    those of you that are new to the topic of self-driving cars and AI, I hope you
    find these essays approachable and informative. I also tend to have a writing
    style with a bit of a voice, and so you’ll see that I am times have a wry sense
    of humor and poke at conformity. As a former professor and founder of an AI research
    lab, I for many years wrote in the formal language of academic writing. I published
    in referred journals and served as an editor for several AI journals. This writing
    here is not of the nature, and I have adopted a different and more informal style
    for these essays. That being said, I also do mention from time-to-time more rigorous
    material on AI and encourage you all to dig into those deeper and more formal
    materials if so interested. I am also an AI practitioner. This means that I write
    AI software for a living. Currently, I head-up the Cybernetics Self-Driving Car
    Institute, where we are developing AI software for self-driving cars. For those
    of you that are reading this book and have a penchant for  writing code, you might
    consider taking a look at the open source code available for self-driving cars.
    This is a handy place to start learning how to develop AI for self-driving cars.
    There are also many new educational courses spring forth. There is a growing body
    of those wanting to learn about and develop self-driving cars, and a growing body
    of colleges, labs, and other avenues by which you can learn about self-driving
    cars. This book will provide a foundation of aspects that I think will get you
    ready for those kinds of more advanced training opportunities. If you’ve already
    taken those classes, you’ll likely find these essays especially interesting as
    they offer a perspective that I am betting few other instructors or faculty offered
    to you. These are challenging essays that ask you to think beyond the conventional
    about self-driving cars. THE MOTHER OF ALL AI PROJECTS In June 2017, Apple CEO
    Tim Cook came out and finally admitted that Apple has been working on a self-driving
    car. As you’ll see in my essays, Apple was enmeshed in secrecy about their self-driving
    car efforts. We have only been able to read the tea leaves and guess at what Apple
    has been up to. The notion of an iCar has been floating for quite a while, and
    self-driving engineers and researchers have been signing tight-lipped Non-Disclosure
    Agreements (NDA’s) to work on projects at Apple that were as shrouded in mystery
    as any military invasion plans might be. Tim Cook said something that many others
    in the Artificial Intelligence (AI) field have been saying, namely, the creation
    of a self-driving car has got to be the mother of all AI projects.  In other words,
    it is in fact a tremendous moonshot for AI. If a self-driving car can be crafted
    and the AI works as we hope, it means that we have made incredible strides with
    AI and that therefore it opens many other worlds of potential breakthrough accomplishments
    that AI can solve. Is this hyperbole? Am I just trying to make AI seem like a
    miracle worker and so provide self-aggrandizing statements for those of us writing
    the AI software for self-driving cars? No, it is not hyperbole. Developing a true
    self-driving car is really, really, really hard to do. Let me take a moment to
    explain why.  As a side note, I realize that the Apple  CEO is known for at times
    uttering hyperbole, and he had previously said for example that the year 2012
    was “the mother of all years,” and he had said that the release of iOS 10 was
    “the mother of all releases” – all of which does suggest he likes to use the handy
    “mother of” expression. But, I assure you, in terms of true self-driving cars,
    he has hit the nail on the head.  For sure. When you think about a moonshot and
    how we got to the moon, there are some identifiable characteristics and those
    same aspects can be applied to creating a true self-driving car. You’ll notice
    that I keep putting the word “true” in front of the self-driving car expression.
    I do so because as per my essay about the various levels of self-driving cars,
    there are some self-driving cars that are only somewhat of a self-driving car.
    The somewhat versions are ones that require a human driver to be ready to intervene.
    In my view, that’s not a true self-driving car. A true self-driving car is one
    that requires no human driver intervention at all. It is a car that can entirely
    undertake via automation the driving task without any human driver needed. This
    is the essence of what is known as a Level 5 self-driving car. We are currently
    at the Level 2 and Level 3 mark, and not yet at Level 5. Getting to the moon involved
    aspects such as having big stretch goals, incremental progress, experimentation,
    innovation, and so on. Let’s review how this applied to the moonshot of the bygone
    era, and how it applies to the self-driving car moonshot of today. Big Stretch
    Goal Trying to take a human and deliver the human to the moon, and bring them
    back, safely, was an extremely large stretch goal at the time. No one knew whether
    it could be done. The technology wasn’t available yet. The cost was huge. The
    determination would need to be fierce. Etc. To reach a Level 5 self-driving car
    is going to be the same. It is a big stretch goal. We can readily get to the Level
    3, and we are able to see the Level 4 just up ahead, but a Level 5 is still an
    unknown as to if it is doable. It should eventually be doable and in the same
    way that we thought we’d eventually get to the moon, but when it will occur is
    a different story. Incremental Progress Getting to the moon did not happen overnight
    in one fell swoop. It took years and years of incremental progress to get there.
    Likewise, for self-driving cars. Google has famously been striving to get to the
    Level 5, and pretty much been willing to forgo dealing with the intervening levels,
    but most of the other self-driving car makers are doing the incremental route.
    Let’s get a good Level 2 and a somewhat Level 3 going. Then, let’s improve the
    Level 3 and get a somewhat Level 4 going. Then, let’s improve the Level 4 and
    finally arrive at a Level 5. This seems to be the prevalent way that we are going
    to achieve the true self-driving car. Experimentation You likely know that there
    were various experiments involved in perfecting the approach and technology to
    get to the moon. As per making incremental progress, we first tried to see if
    we could get a rocket to go into space and safety return, then put a monkey in
    there, then with a human, then we went all the way to the moon but didn’t land,
    and finally we arrived at the mission that actually landed on the moon. Self-driving
    cars are the same way. We are doing simulations of self-driving cars. We do testing
    of self-driving cars on private land under controlled situations. We do testing
    of self-driving cars on public roadways, often having to meet regulatory requirements
    including for example having an engineer or equivalent in the car to take over
    the controls if needed. And so on. Experiments big and small are needed to figure
    out what works and what doesn’t. ​ Innovation ​ There are already some advances
    in AI that are allowing us to progress toward self-driving cars. We are going
    to need even more advances. Innovation in all aspects of technology are going
    to be required to achieve a true self-driving car. By no means do we already have
    everything in-hand that we need to get there. Expect new inventions and new approaches,
    new algorithms, etc. Setbacks Most of the pundits are avoiding talking about potential
    setbacks in the progress toward self-driving cars.  Getting to the moon involved
    many setbacks, some of which you never have heard of and were buried at the time
    so as to not dampen enthusiasm and funding for getting to the moon. A recurring
    theme in many of my included essays is that there are going to be setbacks as
    we try to arrive at a true self-driving car. Take a deep breath and be ready.
    I just hope the setbacks don’t completely stop progress. I am sure that it will
    cause progress to alter in a manner that we’ve not yet seen in the self-driving
    car field. I liken the self-driving car of today to the excitement everyone had
    for Uber when it first got going.  Today, we have a different view of Uber and
    with each passing day there are more regulations to the ride sharing business
    and more concerns raised. The darling child only stays a darling until finally
    that child acts up. It will happen the same with self-driving cars. SELF-DRIVING
    CARS CHALLENGES But what exactly makes things so hard to have a true self-driving
