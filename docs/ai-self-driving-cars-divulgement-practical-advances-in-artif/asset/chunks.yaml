    # 第 13 章 自动驾驶、汉堡王华堡与 AI 自动驾驶汽车


    AI、自动驾驶汽车、特斯拉、自动辅助驾驶系统，以及臭名昭著的汉堡王华堡等汉堡，这些究竟有何共同之处？当然是一个“惊天动地”的故事。汉堡王最近的一则广告活动使用了这个自鸣得意的广告语：“智能汽车足够聪明，会为华堡刹车。”为了确保广告“料足味全”，他们还宣称：“人工智能知道你渴望什么。”不得不承认，这又是汉堡王巧妙利用本可能只是小范围病毒式传播的社交媒体素材，将其转化为无可争议的可营销卖点，从而兜售那些备受推崇的汉堡和薯条的又一典型案例。这一次，他们敏锐的洞察力和辛辣的机智触及了为自动驾驶汽车提供动力的自动化层面，并极有可能涉及一辆运行自动辅助驾驶的特斯拉，而该系统尚未具备完全成熟的自动驾驶能力。


    以下是关于所谓“自动辅助驾驶华堡”事件的来龙去脉。今年 5 月，一位驾驶员在 YouTube 上发布了一段记录高速公路行驶过程的视频，声称展示了一辆运行自动辅助驾驶的特斯拉错误地将路边的汉堡王招牌识别为可能的停车标志。请注意，汽车仅仅开始逐渐减速，并没有急促反应，也没有试图在检测到其解读为可能的停车标志时激进地急刹车。我们怎么知道汽车想做什么？根据驾驶员拍摄的视频记录，特斯拉的中控屏闪烁出经典提示信息“因交通管制而停车”，这是一条常规信息，用于让人类驾驶员知晓系统检测到某种需要由计算机控制车辆停下的交通状况。汽车继续在高速公路上行驶，一旦与路边招牌的距离缩短，关于即将到来的交通管制的警报不再显示，车辆重新加速回到规定的限速。


    你可能会说这是一个“无伤无害”的情况。无人受伤，未发生车祸，交通似乎丝毫未受干扰。话虽如此，自动化系统确实最初错误地将检测到的标志解读为可能是停车标志，并相应地开始减速，但一旦车辆靠近到足以进行更确定的分析，系统便弄清那不是停车标志，并在交通流中毫无阻碍地继续行驶。让我们姑且相信视频内容属实，假设它未经伪造或篡改。我之所以提及这一警示，是因为有人完全可以利用任何像样的视频编辑软件制作出此类视频，但总体而言，该视频似乎很可能反映了实际发生的情况，我们可以合理地假设这是真实发生的事件。


    你的第一反应，或许和我一样，是怀疑这只是偶然的一次性失误，还是说有可能发生第二次、第三次，以此类推。我们无法确定它是否具有可重复性，尽管大约一个月后，同一位驾驶员再次驶经同一路段，并发布了新视频，显示特斯拉似乎没有再犯同样的错误。在后一个视频中，驾驶员口头祝贺特斯拉，称汽车似乎已经“学会”了应对汉堡王招牌，不再将其错误归类为停车标志。我们未必能做出这种逻辑上的飞跃，也不能盲目轻信。为何如此？车辆为何未像第一次那样反应，可能有其他合理的解释。请允许我稍作详述。


    想象一下你在驾驶汽车时，有时会根据光照和其他环境条件以不同方式看清某物，你可能更清晰地看到标志，或因遮挡而看得模糊不清，这取决于阳光多寡、云层覆盖等因素。摄像头检测情况可能与第一次不同，因此碰巧第二次驶经时根本未发现该标志，或者发现了但获得了更清晰的视角。请意识到，在远距离下，摄像头拍摄的图片或视频细节较少，处理的物体也只是隐约可见。这又有点像你可能会努力辨认远处的物体，同样，车载计算机系统也会尝试分类它能看到的任何东西，即使只是隐约可见。


    许多未涉足自动驾驶技术领域的人没有意识到，驾驶——即使是人类驾驶——本质上也是一场概率与不确定性的博弈。当你在前方道路上看到类似路面碎屑、静止物体停放在路上的东西时，你可能不知道它是类似从卡车货箱掉落的工具箱那样的硬物，又或许只是个空纸盒，相对无害。在靠近之前，你都在推测物体可能是什么，同时试图预先决定应采取何种行动。如果能变道，也许应该变道以避免撞击物体。如果无法轻易变道，也许碾压物体顶部更好，从而避免采取急转弯或尖叫刹车等极端措施。


    这引出了关于 AI 和自动驾驶技术的一个重要教训：它不会以某种神奇的方式运行，也不会实现纯粹完美的驾驶。正如人类难以识别路面碎屑是什么，并必须确定驾驶选项一样，AI
    也必须做同样的事。这也是为什么我一直呼吁：认为采用 AI 驾驶系统可实现零死亡的观念是一套错误的预期。尽管拥有 AI 驾驶系统，我们仍将发生车祸。在某些情况下，可能是
    AI“判断”不当并采取了错误的驾驶动作；而在其他情况下，如行人意外冲到行驶汽车前，根本没有可行的替代方案来避免碰撞。请记住，即使备受推崇的基于 AI 的真正自动驾驶汽车，仍受物理定律约束。当意外突发、毫无明显预警时，你只能根据物理原理让汽车停下，无法奇迹般地让车辆瞬间静止。制动距离终究是制动距离，无论是人类驾驶还是
    AI 驾驶。


    话虽如此，我们当然希望通过让 AI 驾驶系统全面接管车辆，能大幅减少因人类酒驾和各种人类驾驶缺陷导致的车祸，从而大幅减少道路上的伤亡（但我强调，仍非零）。无论如何，仅仅因为汽车在后续行程中未重复误识别汉堡王招牌，我们不能假设这是由于汽车“学习”了该情况。除非我们被允许深入挖掘自动辅助驾驶系统及其收集的数据，否则不易确定究竟发生了何种变化，尽管系统可能已改进，能更好地处理汉堡王招牌，这似乎是个合理的猜测。


    ## 这究竟是什么“学习”


    假设系统确实更好地对汉堡王招牌进行了分类。这是否意味着系统对此事进行了“学习”？首先，无论何时使用“学习”一词，都可能夸大自动化系统正在做的事情。从某种意义上说，使用这个称谓就是某些人所说的将自动化“拟人化”。原因如下。假设幕后的
    AI 开发人员和工程师正在检查其汽车收集的数据（包括视频流），并意识到汉堡王招牌被错误分类为停车标志。这些人类开发人员可能会调整系统以防止其再次如此。在这种情况下，你会描述自动化系统已经“学会”了该怎么做吗？似乎有点牵强。


    或者，假设系统使用了机器学习（ML）或深度学习（DL），包含人工神经网络（ANN），这是一种数学模式匹配方法，试图在一定程度上模仿人脑可能的工作方式（请注意，当今基于计算机的神经网络与大脑实际运作方式相去甚远，完全不等同，总体上属于截然不同的两码事）。后端总部计算机系统可能通过车队汽车收集的数据将其汇总到云数据库中，并可能被设置为检查误报（误报是指检测算法认为那里有东西，如停车标志，但实际并非停车标志）。在通过计算发现汉堡王招牌属于误报后，系统可能在数学上标记任何此类图像绝非停车标志，然后通过
    OTA（空中下载）电子通讯将此标记推送给车队车辆，OTA 允许总部向车辆发送数据和程序补丁。你能称之为关于汉堡王招牌的“学习”吗？你或许会试图提出这种主张，利用这些计算方法被称为机器学习和深度学习这一特点，但对某些人来说，这扩大了与任何类人学习相关的含义。


    例如，一个学会不把汉堡王招牌误认为停车标志的人，同时可能也学会了许多其他方面。人类可能会泛化推演，意识到麦当劳招牌可能被误解，塔可钟招牌亦然，等等，所有这些都是学习整体外观的一部分。你可以进一步推演。人类可能会领悟到这样一个完整概念：有时存在类似于我们已知事物的标志，因此至关重要的是不要假设汉堡王招牌的特征会延伸到其他导致误识别的方面。这还可能促使人类思考他们如何基于快速判断做出其他错误假设。每当他们远远看到某人，也许根据其外貌判断对方是某种类型的人，这就是一种过早的行为。以此类推。我意识到你可能不愿费心去设想人类真的会将误分类汉堡王招牌这件事推演多远，但那忽略了我试图表达的重点。我的观点是，当人类学习时，他们通常（或希望）会以多种其他方式泛化该学习。有人将这归结为我们拥有常识并能进行常识推理的观点。给你个震惊：目前尚无任何
    AI 具备任何真正意义上的常识推理。一些人断言，直到我们让 AI 具备常识推理，我们才无法实现真正的 AI——即与人类智力相当的 AI，如今称为 AGI 或通用人工智能（表明当今典型的
    AI 在范围和能力上远比渴望达到的 AI 版本狭窄和简单得多）。总体而言，你很难说汽车自动化已以人类可能拥有的那种可泛化、全推理的方式从汉堡王事件中“学习”了什么。无论如何，人们在提及当今变体
    AI 时喜欢用“学习”一词，尽管这夸大了正在发生的事情，并可能导致过高且混淆视听的预期。


    ## 关于招牌的谜题


    你可能记得电影《公主新娘》中著名的智力较量场景，其中一位角色厚颜无耻地吹嘘他才刚刚开始提出他的逻辑。让我们在此也用同样的豪气。到目前为止，我们假设汉堡王招牌被短暂地分类为停车标志，当时汽车正在高速公路上行驶并接近高速公路旁的标志牌。你可能会想，一个实际上不在道路上的标志，为何会被作为潜在停车标志进行检查，并被认真考虑是否要因此停车？当你在高速公路上驾驶时，有成打成打的高速公路旁停车标志和大量其他交通管制标志清晰可见，但你不会认为它们值得让你在高速公路上停车。这是因为你知道那些标志在路外，与你在高速公路上的驾驶无关。想象一下，如果每次你看到当地街道的正式交通标志，尽管它们不在高速公路上，你却选择像它们位于高速公路上一样做出反应。那将是一团糟！你将在高速公路上不断做出各种疯狂的驾驶举动，让附近所有其他驾驶员感到困惑。


    简而言之，既然汉堡王招牌不在高速公路上，它本应立即被忽略，不作为交通管制标志或任何值得自动化系统关注的标志。我们可以极端地说，即使汉堡王招牌与停车标志完全相同，本质上用真正的停车标志替换了汉堡王标志，这仍然不应有影响。这把我们带回到所谓的“学习”层面。如果自动化系统现在有了汉堡王招牌不是停车标志的计算指示，这似乎还不够。我们还希望它“学会”高速公路旁的标志与高速公路驾驶无关，尽管当然存在例外，使这成为一条必然灵活的规则，你不能简单地宣布所有路外标志都可以完全忽略。


    为何自动化系统似乎最初评估汉堡王招牌与高速公路相关？这涉及一个光学错觉，通常也会影响人类驾驶员。汉堡王招牌矗立在高杆顶端，离高速公路相对较近。如果你见过他们显眼的招牌，就会知道它们醒目之处在于用鲜艳的红色大字拼出“Burger
    King”，形状为椭圆形，所有这些从远处看都与停车标志的整体外观酷似。当然，招牌特意朝向高速公路以吸引最大关注。在此驾驶场景中，汽车驶过高速公路的一个山顶，汉堡王招牌看起来紧邻高速公路，并可能被视为位于高速公路上本身，这是基于远距离观察和驶过山顶时的高速公路结构造成的。你肯定经历过这种视觉错觉，很容易上当。一旦你意识到那是汉堡王招牌，你就不再在意它是在高速公路上还是路外，因为它不需要你采取任何行动（除非你饿了，招牌激起你驶离高速公路去吃汉堡）。


    理论上，人类驾驶员也可能做出自动化系统所做的同样的事，即作为预防措施开始减速，以防标志是停车标志。新手司机可能特别容易在最初几次经历这种视觉错觉时中招，此后大概能领会所见为何物。从这个意义上说，作为人类，你是在通过经验学习，本质上是收集数据并基于收集的数据进行调整。潜在地，车企为自动驾驶自动化建立的机器学习或深度学习也能在一定程度上做类似的事。通常会整理训练数据集，尝试训练
    ML/DL 识别何种路面标志。训练数据必须包含足够多样的示例，否则计算会过拟合数据，只有严格符合标准标志的那些标志才能在后续被检测到。在现实世界中，停车标志常被涂污、撞毁、弯曲，可能被树枝部分遮挡，存在各种其他变体。如果仅用最标准的停车标志训练
    ML/DL，车载检测结果无疑无法识别出许多日常真实世界中受损的张贴停车标志。


    对任何自动驾驶汽车而言，噩梦般的危险之一是假阴性的可能性。假阴性是指明明存在停车标志，自动化系统却不将其解读为停车标志。这很糟糕。自动化系统可能未能执行必要的停车，灾难性后果可能是车祸和可怕后果。你也可以在一定程度上断言误报同样糟糕。假设自动化系统完全误将汉堡王招牌当作停车标志并在高速公路上停下。后方其他驾驶员极易追尾撞上这辆停车，因为它在正常飞驰的高速公路上莫名其妙、意外地停下了。


    ## 结语


    欢迎来到打造自动驾驶汽车者面临的困境。目标是防止假阴性和防止假阳性，尽管这并非总是可能，因此系统必须足够擅长应对这些可能性。对于运行自动辅助驾驶的特斯拉，重要的是要意识到现有自动化被视为自动驾驶能力的
    L2 级，意味着它是驾驶辅助类自动化，而非完全自主。对于 L2 级汽车，人类驾驶员仍被视为车辆的责任驾驶员。在误以为汉堡王招牌是停车标志的情况下，即使自动化系统试图完全停车，人类驾驶员被推定为掌控者，应覆盖这种不利驾驶动作。正如我反复呼吁的，我们正步入危险领域，期望人类驾驶员在
    L2 和 L3 级汽车中覆盖自动化，你可以打赌许多人类驾驶员不会这样做，或因错误地相信汽车正稳妥地自行驾驶而延迟覆盖。你可以说人类驾驶员将对其汽车自动化正在做什么做出误报和误判，任何一种都可能导致可怕的灾难。这就是为什么一些人强烈主张我们应等到
    AI 足够好，可用于 L4 和 L5 级自动驾驶汽车，届时 AI 完成所有驾驶，无人类驾驶介入。如果我们能达到那一步，将意味着人工智能确实“知道我们渴望什么”，那包括安全的驾驶旅程，无论是否包含汉堡。


    # 第 14 章 烟花庆典与 AI 自动驾驶汽车


    人们渴望在今年 7 月 4 日燃放烟花。据最新报告的销售数据显示，烟花销售火爆如热卖煎饼，鞭炮威力十足，销售势头无明显止境迹象（除非通常在 7 月 4 日后熄火）。为何今年抢购烟花如此狂热？有几个原因被引述。首先，由于后疫情时代对人群聚集的担忧，大多数正式烟花表演和活动被取消，因此今年无法目睹那些惊人的大型表演。其次，既然大型活动无望，许多人决定自己动手，在自家门前举办自己的烟花秀。第三，一些人认为燃放烟花除是项有趣活动外，还是一种象征性姿态。这意味着人们有了额外的动力参与烟花活动，既为娱乐，也为展示关于我们时代的信息或重要声明。第四，或许是最直接的原因，在家里憋了几个月后，人们想出门狂欢，而
    7 月 4 日似乎提供了毫无拘束的理由。一年中有多少次你可以合法地坐或站在自家屋外，通常也利用街道空间，尽情狂欢，享受人生极乐，制造喧嚣，伴随巨大的噪音、爆炸和绚烂的火光。我们尊崇的
    7 月 4 日几乎是全年唯一可以这样做的时刻（或许可包括除夕夜，但那相比之下规模较小、分量较轻）。而今年，7 月 4 日恰逢周六，这个周末提供了无拘无束的狂欢。


    许多人不太意识到，对烟花行业而言，7 月 4 日是一年中约 90%收入集中在一个相当紧凑的两周时期的时刻。它被视为季节性产品，通常被称为超强季节性，因对如此有限窗口期的巨大依赖，其余时间都在为下一次年度庆典做准备。当然，全年也有专业烟花表演。许多主题公园全年举办烟花秀，许多体育赛事用烟花庆祝得分或达阵。总体而言，专业语境下的烟花使用量与公众为
    7 月 4 日消费的惊人数量相比，微不足道。


    你可能认为今年 7 月 4 日将是一场规模巨大的烟花盛宴，这显而易见。信不信由你，当疫情在 3 月左右首次爆发时，曾有预测称今年 7 月 4 日烟花可能会是巨大的“哑弹”。假设是我们都将坚定地待在室内，因此无法走出户外燃放烟花。这一信念一度让一些烟花公司陷入停滞，他们疲惫地担心能否作为企业生存下来，因为其全年收入来源或许即将崩塌。我们现在知道，相反的情况似乎即将发生，即这将成为公众在
    7 月 4 日使用烟花有史以来最大规模的一次。烟花公司将这一时刻誉为当时的惊人“中奖彩票”，因碰巧拥有一款人们渴望获得的产品而大获全胜。烟花狂热的另一个原因是渴望做些不同的事，而非坐在家里玩室内游戏。你去不了电影院，因为那些几乎全关门了；去不了商场；甚至可能去不了餐厅吃饭。总而言之，被困在家里且耗尽所有其他选择后，使用烟花的诱惑力大得无法抗拒。


    ## 对烟花保持警惕


    一个显著的负面因素是非法烟花的销售似乎也在上升。你可能会想买非法烟花没什么大不了。不幸的是，除了违法、剥夺合法烟花制造商的销售额外，另一个或许不显而易见的担忧是那些烟花更可能造成伤害。正如你所知，即使合法烟花也很危险，人们可能受伤。据政府研究，每年此时因使用烟花导致数千人受伤。一项政府研究的统计显示，15
    岁以下儿童占伤亡人数的三分之一以上。烟花棒和瓶装火箭是最常见的致伤产品，这合乎逻辑，因为它们常被粗心使用，且经常交给儿童尝试。不想渲染血腥，但请务必意识到最常见的伤害是手和手指（约占受伤者的
    28%），其次是腿、眼和耳。烧伤是迄今最常见的伤害形式，可导致毁容或肢体直接丧失。因此，使用非法烟花会增加你或亲人受伤害的风险，请记住即使使用合法烟花，你仍在为自己和亲人冒险。


    增加潜在烦恼的是有时会伤害到与你的烟花庆祝无关的他人。玩得有点疯狂时，7 月 4 日燃放烟花的人倾向于将这些爆炸武器抛向空中，落在附近邻居身上，有时造成伤害，或因点燃屋顶而引发火灾。关键是每个人，我指的是每个人，在即将到来的
    7 月 4 日使用烟花时都需要深思熟虑、适度且小心。尽管寄予厚望，但可以肯定的是会有大量伤害，尤其是今年，因家庭烟花派对激增，且人们无疑都想走出家门前往街道观看社区即兴烟花盛宴。医院急诊室已在为后果做准备。如果这显得过于悲观，抱歉给欢乐蒙上阴影，但我亲眼目睹过可能发生的严重伤害及对一个人生活的长期不利影响，包括对幼童，一点清醒和警示值得被视为扫兴之举。


    换个话题，当人们在自家门前燃放烟花时，通常选择在街道上。这显而易见，因为前院可能有草或灌木，更容易着火，而街道的沥青路面似乎对烟花引起的火焰和爆炸免疫。你曾在
    7 月 4 日晚上开车去杂货店吗？如果去过，你就知道这是一年中驾驶最棘手、最恐怖的夜晚之一（甚至比万圣节穿梭道路更难）。在 7 月 4 日穿梭你社区的街道时，你需要缓慢绕行人们搭建烟花表演的地点。此外，一些人坐在街道上的折叠椅里，儿童来回奔跑，极易成为行驶汽车的撞击目标，而那些孩子通常太兴奋，不留意车辆交通，对周围发生的事毫无察觉。夜间黑暗倾向于隐藏街道内外的事物，加上烟花的突然闪光会干扰你的视线，分散你直视前方的注意力，并惊吓驾驶员做出鲁莽的驾驶判断。许多家长被要求开车去商店买更多苏打水或薯片时，很可能会三思并建议等到第二天。


    7 月 4 日夜间驾驶的另一个因素是，有白痴和（我敢说）流氓以向行驶汽车扔鞭炮为乐。这不是好主意。任何选择在烟花庆祝时段驾驶汽车的人都在冒巨大风险，且必须有至关重要的理由。相关方面是如何将烟花受伤的儿童或成人送往急诊室，这增加了进一步的复杂性，因为你可能自己开车，但因障碍物和街道上的人而限制车速，救护车等首批响应车辆面临相同障碍。总而言之，请在这个即将到来的
    7 月 4 日保持安全，如果可能，尽量避免上路驾驶，尤其是晚间烟花高峰活动期间。


    提及 7 月 4 日驾驶汽车的焦虑与煎熬，引出了一个相关话题。自动驾驶汽车将逐渐成为一种可行的交通形式。基于 AI 的真正自动驾驶汽车将不使用人类驾驶员。这里有一个引人入胜的问题：基于
    AI 的真正自动驾驶汽车在 7 月 4 日晚上驾驶会有任何困难吗？如果有，AI 驾驶系统可能面临何种困难？让我们拆解这个问题一探究竟。


    ## 理解自动驾驶汽车的级别


    作为澄清，真正的自动驾驶汽车是指 AI 完全自主驾驶汽车，驾驶任务中无任何人类协助。这些无人驾驶车辆被视为 L4 和 L5 级，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为
    L2 或 L3 级。共同分担驾驶任务的汽车被称为半自动驾驶，通常包含各种自动化附加功能，称为 ADAS（高级驾驶辅助系统）。目前尚无 L5 级真正的自动驾驶汽车，我们甚至不知道能否实现，也不知需要多长时间。同时，L4
    级努力正逐渐尝试通过非常狭窄和选择性的公共道路试验获得一些进展，尽管关于是否应允许此类测试存在争议。由于半自动驾驶汽车需要人类驾驶员，采用这类汽车不会与驾驶传统车辆有显著不同，因此关于它们在这个话题上没有太多新内容可讲（尽管，正如你稍后将看到的，接下来的观点普遍适用）。对于半自动驾驶汽车，重要的是公众需要被预先警告关于一个最近出现的令人不安的方面，即尽管那些人类驾驶员不断发布自己在
    L2 或 L3 级汽车方向盘前睡着的视频，我们所有人都需要避免被误导，认为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论 L2 或 L3 级汽车投入多少自动化，你都是车辆驾驶行为的责任方。


    ## 自动驾驶汽车与 7 月 4 日


    对于 L4 和 L5 级真正的自动驾驶车辆，驾驶任务中不会有人类驾驶员参与。所有乘客将是乘客。AI 在驾驶。关于自动驾驶汽车最常见的误解大概是错误地认为它们将是“超人类”的，并以远超人类的方式驾驶。我们当然可以同意
    AI 不会酒驾，从这个意义上说，是的，这比选择酒后驾驶的人类驾驶员有所改进。但你会认为不喝酒等同于“超人类”能力吗？似乎令人怀疑。还请注意，普遍接受的驾驶级别标准表明，AI
    应以人类驾驶员在道路上潜在的驾驶方式进行驾驶，这意味着如果人类能开到某地，AI 也应能做到，尽管不一定超越人类能驾驶的范围。同样，那作为驾驶能力并不特别“超人类”。此外，现有驾驶级别排除了越野驾驶行为。因此，如果车企和自动驾驶技术有此规定，AI
    或许能进行越野驾驶，但这不是要求。基于各种原因，请不要在脑海中树立 AI 驾驶系统将是超人类的观念，这具有误导性并提供虚假预期。


    这一点之所以重要且契合关于 7 月 4 日驾驶的整体讨论，是因为你不应假设真正的自动驾驶汽车会以超越人类处理驾驶境况的神奇方式驾驶。当然，AI 不会微醺，也不会在穿梭于烟花铺满的街道时感到“恐惧”，从而避免了那些人类驾驶员的缺陷。另一方面，检测所有那些低矮物体对自动驾驶汽车并不容易。通过车辆大灯，摄像头将尽力视觉扫描场景并弄清正在发生什么。雷达可能会检测到大量物体，但贴近地面的物体难以辨别。激光雷达会有帮助，其他传感器也是，尽管热成像等在烟花闪烁喷吐火焰时会“看”得眼花缭乱。


    与人类不同，AI 不太可能被编程为应对 7 月 4 日现象的具体细节。人类知道地上有大量烟花，那些本质上很危险。此外，人类知道儿童容易到处奔跑，有时甚至躺下或蹲在街道中央。请记住，当今
    AI 完全缺乏任何形式的常识或所谓的常识推理。目前，AI 范围非常狭窄，无法像人类那样“思考”。这至关重要，因为 AI 不会“理解”7 月 4 日道路上发生的事，而只是对车辆前方碰巧看到的东西做出反应。人类驾驶员会对道路上发生的事有一个整体概念，并能推定通过拥有应对事务的通用计划来更敏锐地驾驶。AI
    将一步步地处理一切，仿佛它完全没有为什么人们在街道上、他们在做什么的语境概念。


    你可以争辩说驾驶员是否有大局观无关紧要，唯一重要的是车前方的即时情况。在某种程度上，车前方的动作确实是最重要的因素，但我们在开车时也做大量预判性的心理工作。例如，我可能知道前方那条街道两旁住着许多家庭，我可以猜测他们
    7 月 4 日会大量聚集在户外。同时，如果我在街区尽头右转，我知道那条侧街不太可能有很多人。请注意，仅凭视觉线索，你无法做出同样的驾驶判断，而必须直行驶入聚集人群的街道，只有直接看到才能意识到情况。这正是自动驾驶汽车倾向于做的事。如果你认为
    GPS 和地图能避免此事，似乎极不可能任何普通地图会提供关于街道两旁住着许多有幼童家庭这方面的实质性线索，并提供任何此类预先提示。


    不过还有另一种手段可供 AI 发挥作用。自动驾驶汽车的一个方面是它们使用机器学习（ML）和深度学习（DL），这是一种计算模式匹配，使 AI 能尝试发现模式。也许通过在今年
    7 月 4 日四处驾驶，ML/DL 可以尝试“学习”街道聚集的情况，为明年和随后几年做好更好准备。但这今年大概率不会发生。大多数自动驾驶尝试不会在 7 月
    4 日上路，理所当然。车企和自动驾驶技术公司目前正致力于让自动驾驶汽车在日常境况下安全驾驶。任何在一年一度的 7 月 4 日奇观中驾驶的想法都被视为边缘案例或极端案例，表明它太不寻常或非同寻常，不值得此时关注，否则会不当地消耗本应用于标准驾驶的精力。


    对自动驾驶汽车而言另一个困难方面是烟花产生的烟雾可能遮挡摄像头传感器的视野。烟花的强烈闪光也可能影响摄像头和车载计算机系统捕获和解读的视觉图像性质。


    ## 结语


    让自动驾驶汽车在传统烟花聚会的街道上穿梭，这超出了当今大多数 AI 驾驶系统能轻松完成的范围。AI 通常被编程为胆小的驾驶员，极其谨慎地移动，潜在物体和障碍物的数量无疑会导致系统决定不继续前进，或以比蜗牛或乌龟还慢的速度前进。我们需要做的是将这种驾驶场景添加到我们希望自动驾驶汽车最终能处理的专业驾驶清单中。同时，我们将很大程度上依赖人类驾驶员，正如我所说，他们应尽可能避免在
    7 月 4 日晚上驾驶，转而尝试享受庆典，安全且坚定地不让任何人受伤。在这个 7 月 4 日保持安全！


