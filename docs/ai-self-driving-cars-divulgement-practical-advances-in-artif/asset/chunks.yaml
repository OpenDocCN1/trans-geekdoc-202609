    # Which of those scenarios will playout?


    Time will tell.


    ## Conclusion


    One thing you can say about the self-driving car realm is that there is never
    a dull moment. Something is always happening. At times, the self-driving dream
    is touted by the media and everyone rushes to get a piece of the pie, while at
    other times the doom-and-gloom settles in and people wonder whatever happened
    about those self-driving cars that were going to be ubiquitously zipping around
    on all of our highways and byways.


    Take a moment to contemplate what the future will bring in terms of this new shakeup.
    Has Bezos just bought himself the deal of the century? Will Musk rue the day that
    he ribbed Bezos about the Zoox acquisition and find himself staring enviously
    at “AmaZoox” or is it “ZooxAma” when their self-driving vehicles are doing donuts
    around Teslas? Or will Amazon absentmindedly drift onto other matters, and the
    only remaining reference to Zoox occurs whenever a trivia question asks what was
    the name of those single-celled dinoflagellates that live in coral and jellyfish,
    for which the answer is Zooxanthellae but some might reminisce and exclaim the
    word Zoox instead.


    Those that are skeptical about the Amazon and Zoox being a match made in heaven
    are apt to predict that Tesla cars will soon be sporting bumper stickers that
    declare: “My Other Car Was Going To Be A Zoox, But It Got Lost Somewhere In The
    Amazon.” Fans of Zoox are decidedly more upbeat, and with a Spock-like recital
    are solemnly stating that Zoox shall live long and prosper. For the sake of self-driving
    cars, hopefully, the passion and verve underlying Zoox will continue to survive
    and thrive, and the era of true self-driving cars will fervidly see its day.


    # CHAPTER 12 TESLA WITH LIDAR AND AI SELF-DRIVING CARS


    Adding to how much the world has become topsy-turvy, an actual and official Tesla
    car was recently spotted wearing LIDAR sensor technology while traveling on public
    roadways. Heavens! For those of you that don’t know why this would be especially
    newsworthy, you need to be brought up-to-speed over the LIDAR uproar that has
    and continues to engulf the advent of self-driving cars.


    Let’s get the record straight on the foundations of this messy and bitter topic.
    I will endeavor to first bring you up-to-speed on the overarching saga, and then
    we can consider ways to explain this unexpected and somewhat stupefying sighting
    of an official Tesla car that had LIDAR on it, which is akin to spotting Bigfoot
    or the Loch Ness Monster, or like crossing the streams in the movie *Ghostbusters*,
    etc. It is either a watershed moment, an optical illusion, or maybe one of seven
    seemingly bona fide ways to explain the unusual and extraordinary phenomenon (which
    I’ll walk you through).


    ## What LIDAR Is All About


    LIDAR refers to a technology that combines the use of light via lasers and the
    application of radar-like techniques (light + radar), and for which such tech
    has been around since the late 1950s and has been used in a wide variety of ways.
    It is nothing new per se.


    The use of LIDAR has been considered a cornerstone of autonomous systems such
    as self-driving cars. By shooting out laser beams and gauging how long they take
    to return, it is possible to try and map out whatever surrounds the LIDAR device,
    getting a semblance of the distance to those detected objects and thus identifying
    where they are and potentially their size (plus, over time, the movement of those
    objects as a series of such sightings are recorded and compared).


    Initially, LIDAR sensors were relatively expensive, costing hundreds of thousands
    of dollars, which meant that though they were great for use on experimental self-driving
    cars, trying to use that costly kind of tech for production cars would make those
    vehicles prohibitively expensive. As with most tech, LIDAR inexorably has come
    way down on price. The LIDAR devices have also gotten a lot smaller and more adept,
    along with being less error-prone and able to withstand the rigors of being on
    cars that endure daily weathering and the grit and grime of the world.


    Here’s a key point: Nearly all automakers and self-driving tech firms have adopted
    the use of LIDAR, other than Tesla and Elon Musk. Some consider Elon Musk to be
    the leader of an anti-LIDAR camp.


    Why would anyone be arguing against the use of LIDAR? In the past, the easiest
    argument was that LIDAR was too costly, it was too big, it was impractical and
    so though maybe handy for doing experimental work, it did not have the right stuff
    for real-world use. You would be hard-pressed to use that same argument today,
    though some still try.


    In any case, setting aside all of that, the other question that people tend to
    ponder is whether LIDAR is essential for self-driving or whether it can be considered
    optional. In other words, if the LIDAR devices are the only means to ensure that
    a self-driving car can make its way through traffic and do so without hitting
    things, the costs and other factors do not seem quite so crucial and one ought
    to be putting LIDAR onto cars without hesitation.


    That takes us into one of the now loudest debates, namely the rancorous contention
    that LIDAR is unnecessary as it can be completely otherwise handled by cameras.
    Some believers contend that the use of cameras is sufficient and there is no need
    to use LIDAR. In their viewpoint, adding LIDAR is therefore an unnecessary added
    cost and complexity, no matter how low the cost might be and no matter how improved
    the tech has become.


    Generally, if you are a person that believes in parsimonious systems and do not
    perceive LIDAR as essential, you would say that though LIDAR might be handy, it
    is not needed, and including it is foolishly bulking up for no good reason.


    No one can yet prove beyond a shadow of a doubt that cameras can completely serve
    solely and in absence of having LIDAR too. Thus, it is relatively customary that
    self-driving cars are outfitted with both cameras and LIDAR devices, along with
    radar, ultrasonic, thermal imaging, and a slew of such detection sensors. Not
    so with Tesla.


    Elon Musk early on decided that LIDAR was not needed for Tesla cars. At first,
    he left open that he might someday be proven wrong on this judgment call, and
    then, later on, decided to harden his position and shifted into denigrating the
    need for LIDAR. Eventually, Musk went so far as to suggest that others using LIDAR
    were outright foolish in their doing so and would ultimately regret having used
    LIDAR.


    Your reaction to this is likely that Musk is a sharp person and seems to know
    a lot about physics and science stuff, so he must have a valid basis for making
    these assertions, and especially so since they seem to go against the grain of
    the rest of the self-driving field. Does Musk see something that others do not?
    Perhaps he has a vision that goes beyond the purview of others and, as per his
    other bets on things like universal space exploration and the boring of large
    tunnels, he decidedly travels on a different path than the norm.


    One argument that he has voiced about being essentially anti-LIDAR is that humans
    drive cars and do not have lasers spewing out light beams from their heads. As
    such, if a human can drive a car with the use of their good old plain eyeballs,
    it just stands to reason that a camera is the only thing particularly needed to
    achieve the equivalent of human driving levels of performance.


    The immediate counter-argument is that he has opted to use radar, and yet human
    drivers do not have radar built into their skulls, thus, based on his sense of
    elucidated logic, shouldn’t he ditch the use of radar from all Tesla cars? Besides,
    presumably self-driving cars are hopefully going to be better drivers than humans,
    avoiding the 40,000 annual car fatalities in the United States alone, and mitigating
    the approximate 1.2 million injuries due to car crashes, which perhaps could use
    the added help of LIDAR, rather than eschewing something that might make that
    last mile difference in life-or-death results.


    Another explanation as to why his now intransigent posture on anti-LIDAR has become
    so entrenched is that he has painted himself into a corner. How so? During the
    evolution and rollout of Tesla cars, Musk and Tesla have insisted and touted that
    your Tesla car has all the hardware that it needs to be self-driving ready. Presumably,
    only the software is missing to get there, and the software can be downloaded
    at some future time of readiness via the on-board `OTA (Over-The-Air)` electronic
    communications capabilities. And, keep in mind, the hardware on a Tesla does not
    include LIDAR.


    This all means that if he and Tesla were to recant their anti-LIDAR position,
    they would be on-the-hook to seemingly go around and retrofit every Tesla car
    with LIDAR devices. Let that soak in for a moment. Can you imagine the exorbitant
    cost and logistics nightmare of trying to ensure that every Tesla car was retrofitted
    with LIDAR devices?

