    Level 2 或 Level 3 汽车方向盘前睡着的视频，但我们都必须避免被误导，以为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论 Level
    2 或 Level 3 投入了多少自动化技术，**您都是车辆驾驶行为的责任方**。


    对于 Level 4 和 Level 5 真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘员均为乘客。AI 正在驾驶。


    ## 媒体误报的可能性


    转换话题，考虑一下新 AV TEST 日志可能带来的后果很有必要。遗憾的是，可能无法适当使用该日志的一个群体是媒体，它们可能会曲解日志中发布的任何内容，甚至可能曲解日志中未发布的内容。例如，已有媒体报道称
    AV TEST 日志将显示 Apple 自动驾驶汽车的测试地点。这是一种不体面的伎俩。虽然 Apple 可能会选择如此报告，但没有要求其必须这样做，我们将不得不拭目以待
    Apple 会如何选择。目前 Apple 对其工作守口如瓶，人们不禁要问，它们是否会自愿分享其迄今为止在自动驾驶汽车方面相当隐秘的活动信息。


    另一个潜在的麻烦将是媒体关于脱离的报道和误报。从本质上讲，脱离是指在公共道路上测试的自动驾驶汽车被车载人类安全员接管驾驶的实例。安全员可能认为 AI 驾驶系统即将犯错，从而选择从自动驾驶系统手中夺回驾驶控制权。或者，AI
    本身可能检测到需要人类安全员处理棘手驾驶情况的情形，并相应地移交驾驶权。媒体经常以各种不了解实情甚至奇葩创造的方式，误述脱离的意义和性质。其中一种方法是根据报告的脱离次数对自动驾驶工作进行排名，暗示脱离次数最少的尝试必定比脱离次数较多的尝试更先进、更成熟。这就是为什么这在最好的情况下也是误导性的。


    假设公司 X 有 5 次脱离，公司 Y 有 20 次。看起来，如果仅以此为依据报告，公司 X 似乎比公司 Y 好得多。但假设公司 X 仅行驶了 100 英里，而公司
    Y 行驶了 10,000 英里，我想您很容易意识到，公司 Y 的每英里脱离次数会少得多，这表明公司 Y 表现得比公司 X 好得多。即便如此，这仍然存在问题。正如自动驾驶行业众所周知的，并非所有里程都相同。如果一家公司选择在安静的郊区社区进行公开试驾，那些行驶的里程可能相对“容易”，假设车辆交通不多，驾驶情况温和。相比之下，在繁忙的市中心进行公开试驾，面对繁忙的交通、乱穿马路的行人和狂野的司机，这些里程与相对温顺的郊区环境截然不同。在所有这些考虑因素之上，脱离次数还可以被操纵。如果您担心必须报告脱离次数，一种方法是告诉安全员不惜一切代价避免脱离，以保持计数降低。从这个意义上说，报告机制可能会无意中激励不良行为，这具有讽刺意味，因为最初的意图可能是高尚的，旨在了解自动驾驶车辆的安全性能，却陷入了误报和恶意使用的泥沼。


    简而言之，请警惕关于自动驾驶汽车的“**假新闻**”。AV TEST 日志可能会引发更多此类误导性和错误的报道。


    ## 结论


    请勿误解，这并不意味着拥有这样一个全国性日志是不受欢迎的。日志非常有用，希望能被妥善利用，以激发讨论，推动关于自动驾驶车辆现状和未来的健康、有力的辩论。日志公开发布这一事实，或许有助于超越那些提供误读或持有其他偏颇观点的媒体。我们所有人都能够检查日志并得出自己的结论。此外，或许那些报道得当的媒体施加的压力，会迫使那些报道不当的媒体有所收敛。最重要的是，汽车制造商和自动驾驶汽车公司可能会因媒体报道而受到激励，在
    AV TEST 日志中进行报告。换句话说，如果一家公司决定不在 AV TEST 日志中分享其信息，媒体报道将指出这一遗漏，并加大对该公司公开其数据的压力。当然，恶劣的报道可能会阻碍一些公司分享信息，并被指为自愿报告与不报告同样麻烦的证据，因为共享的任何内容都可能被误述或歪曲。最终，希望新的
    AV TEST 日志能被各方有效利用，我们将共同庆幸拥有这样一个日志。时间会给出答案。


    # 第 8 章 驾车枪击案


