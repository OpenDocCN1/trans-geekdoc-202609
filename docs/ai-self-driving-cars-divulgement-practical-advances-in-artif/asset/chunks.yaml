    How so? Consider a real-world example. Suppose an AI application is developed
    to assess car loan applicants. Using Machine Learning (ML) and Deep Learning (DL),
    the AI system is trained on a trove of data and arrives at some means of choosing
    among those that it deems are loan worthy and those that are not. The underlying
