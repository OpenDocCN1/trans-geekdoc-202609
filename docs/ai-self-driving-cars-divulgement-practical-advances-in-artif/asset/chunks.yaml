    \ would suggest the usual culprits such as the Harvard Business Review, Forbes,\
    \ Fortune, WSJ, and the like. Here are some suggestions of homework or projects\
    \ that you could assign to students: a)        Assignment for foundational AI\
    \ research topic : Research and prepare a paper and a presentation on a specific\
    \ aspect of Deep AI, Machine Learning, ANN, etc. The paper should cite at least\
    \ 3 reputable sources. Compare and contrast to what has been stated in this book.\
    \ b)       Assignment for the Self-Driving Car topic : Research and prepare a\
    \ paper and Self-Driving Cars. Cite at least 3 reputable sources and analyze the\
    \ characterizations.  Compare and contrast to what has been stated in this book.\
    \ c)        Assignment for a Business topic : Research and prepare a paper and\
    \ a presentation on businesses and advanced technology. What is hot, and what\
    \ is not? Cite at least 3 reputable sources. Compare and contrast to the depictions\
    \ in this book. d)       Assignment to do a Startup: Have the students prepare\
    \ a paper about how they might startup a business in this realm. They must submit\
    \ a sound Business Plan for the startup. They could also be asked to present their\
    \ Business Plan and so should also have a presentation deck to coincide with it.\
    \ You can certainly adjust the aforementioned assignments to fit to your  particular\
    \ needs and the class structure. You’ll notice that I ask for 3 reputable cited\
    \ sources for the paper writing based assignments.  I usually steer students toward\
    \ “reputable” publications, since otherwise they will cite some oddball source\
    \ that has no credentials other than that they happened to write something and\
    \ post it onto the Internet. You can define “reputable” in whatever way you prefer,\
    \ for example some faculty think Wikipedia is not reputable while others believe\
    \ it is reputable and allow students to cite it.  The reason that I usually ask\
    \ for at least 3 citations is that if the  student only does one or two citations\
    \ they usually settle on whatever they happened to find the fastest.  By requiring\
    \ three citations, it usually seems to force them to look around, explore, and\
    \ end-up probably finding five or more, and then whittling it down to 3 that they\
    \ will actually use. I have not specified the length of their papers, and leave\
    \ that to you to tell the students what you prefer.  For each of those assignments,\
    \ you could end-up with a short one to two pager, or you could do a dissertation\
    \ length paper.  Base the length on whatever best fits for your class, and the\
    \ credit amount of the assignment within the context of the other grading metrics\
    \ you’ll be using for the class. I mention in the assignments that they are to\
    \ do a paper and prepare a presentation.  I usually try to get students to present\
    \ their work.  This is a good practice for what they will do in the business world. \
    \ Most of the time, they will be required to prepare an analysis and present it.\
    \ If you don’t have the class time or inclination to have the students present,\
    \ then you can of course cut out the aspect of them putting together a presentation.\
    \ If you want to point students toward highly ranked journals in AI, here’s a\
    \ list of the top journals as reported by various citation counts sources (this\
    \ list changes year to year): \n\n*   Communications of the ACM \n\n*   Artificial\
    \ Intelligence \n\n*   Cognitive Science \n\n*   IEEE Transactions on Pattern\
    \ Analysis and Machine Intelligence \n\n*   Foundations and Trends in Machine\
    \ Learning \n\n*   Journal of Memory and Language \n\n*   Cognitive Psychology\
    \ \n\n*   Neural Networks \n\n*   IEEE Transactions on Neural Networks and Learning\
    \ Systems \n\n*   IEEE Intelligent Systems \n\n*   Knowledge-based Systems "
