    THE AUTHOR Dr. Lance B. Eliot, Ph.D., MBA is a globally recognized AI expert and
    thought leader, an experienced executive and leader, a successful serial entrepreneur,
    and a noted scholar on AI, including that his Forbes and AI Trends columns have
    amassed over 2.8+ million views, his books on AI are frequently ranked in the
    Top 10 of all-time AI books, his journal articles are widely cited, and he has
    developed and fielded dozens of AI systems. He currently serves as the CEO of
    Techbruim, Inc. and has over twenty years of industry experience including serving
    as a corporate officer in billion-dollar sized firms and was a partner in a major
    consulting firm. He is also a successful entrepreneur having founded, ran, and
    sold several high-tech related businesses. Dr. Eliot previously hosted the popular
    radio show Technotrends that was also available on American Airlines flights via
    their in-flight audio program, he has made appearances on CNN, has been a frequent
    speaker at industry conferences, and his podcasts have been downloaded over 100,000
    times. A former professor at the University of Southern California (USC), he founded
    and led an innovative research lab on Artificial Intelligence. He also previously
    served on the faculty of the University of California Los Angeles (UCLA) and was
    a visiting professor at other major universities. He was elected to the International
    Board of the Society for Information Management (SIM), a prestigious association
    of over 3,000 high-tech executives worldwide.  He has performed extensive community
    service, including serving as Senior Science Adviser to the Congressional Vice-Chair
    of the Congressional Committee on Science & Technology.  He has served on the
    Board of the OC Science & Engineering Fair (OCSEF), where he is also has been
    a Grand Sweepstakes judge, and likewise served as a judge for the Intel International
    SEF (ISEF). He served as the Vice-Chair of the Association for Computing Machinery
    (ACM) Chapter, a prestigious association of computer scientists.  Dr. Eliot has
    been a shark tank judge for the USC Mark Stevens Center for Innovation on start-up
    pitch  competitions and served as a mentor for several incubators and accelerators
    in Silicon Valley and in Silicon Beach.  Dr. Eliot holds a Ph.D. from USC, MBA,
