    2 级或 3 级汽车方向盘前睡着的视频，我们都需要避免被误导，以为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论 2 级或 3 级汽车投入了多少自动化技术，你都是车辆驾驶行为的责任方。


    ### 自动驾驶汽车与应对沙尘暴


    对于 4 级和 5 级真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘员都将是乘客。AI 正在驾驶。就沙尘暴而言，不要错误地假设 AI 将是万无一失的，并且总能在浑浊的旋转泥土中驾驶。这一点值得提及，因为一些最近的民意调查和调查似乎表明，公众对自动驾驶汽车的理解是
    AI 可以在任何情况下、任何环境下驾驶车辆。请记住，关于 AI 自动驾驶汽车的核心原则之一是，它们旨在能够在人类能够驾驶的相同领域内驾驶。如果熟练的人类驾驶员无法在特定环境下驾驶，则没有期望
    AI 自动驾驶汽车能以其他方式做到。注意，这并不意味着 AI 自动驾驶汽车在这些情况下仍然不可能驾驶，但它不被视为一项“要求”本身。此外，人们经常震惊地发现，AI
    标准化驾驶等级的范围不包括越野驾驶，因此，AI 自动驾驶汽车没有要求或义务能够在越野环境下驾驶。我反复强调的一个恼人之处是，一些人倾向于不当地将 AI 驾驶系统称为“超人类”，这绝对是误导性的，并制造了极其危险的印象（包括埃隆·马斯克将特斯拉的
    Autopilot 称为所谓的超人类）。目前，AI 驾驶系统在各方面不如人类，在其他方面可能更好，但它们并非完全高于人类驾驶。我们在该目标上还有很长的路要走。


    好的，第一点是我们不应该也不能指望 AI 自动驾驶汽车一定能在沙尘暴中驾驶。你可能会困惑，既然它们塞满了最先进的传感器，包括专用摄像头、雷达、`LIDAR`（激光雷达）、热成像、超声波单元等，为什么它们会无法做到。拥有所有那些高科技装备，似乎它们一定能应对空气中的灰尘。抱歉，灰尘对
    AI 的迷惑程度不亚于对我们人类。你可能知道 Waymo 在亚利桑那州凤凰城测试他们的自动驾驶汽车，这是一个沙漠地区，时不时会有沙尘暴。当沙尘暴变得足够大时，科学家将那些大型沙尘暴称为“哈布布”（haboob，强沙尘暴）。凤凰城山谷见过一些惊人的哈布布，有时高达数千英尺，横跨数百平方英里。关于
    Waymo 自动驾驶车辆在亚利桑那沙尘暴中的短视频……这是当自动驾驶汽车试图在严重沙尘暴中驾驶时会发生的情况。首先，由于空气中尘埃颗粒的汇聚，摄像头检测道路场景的能力将下降。这种对驾驶视觉方面的遮蔽，与人类驾驶汽车时大致相同，即很难看清外面有什么。你可以争辩说摄像头仅用于捕捉视觉图像和视频，不像人类用眼睛审视周围环境时容易分心，因此摄像头比人类的眼球更可靠。此外，推测
    AI 不会被驾驶任务的任何恐惧所击中，而人类可能会被恐惧吞噬，从而对道路不那么专注，更容易在可怕的情况下犯驾驶错误。是的，这些都是支持摄像头有利于应对沙尘暴的理由。另一方面，那些摄像头有镜头，如果镜头被飞掠的灰尘划伤或弄脏，你突然就有了一个不再拥有完全可行图像的摄像头。摄像头可能会被一团泥土和灰尘完全遮蔽，对周围道路基本上变得盲目。人类驾驶员推测在车内，不太可能让灰尘进入眼睛，尽管如果他们打开侧窗试图向外看或以其他方式让灰尘进入，人类驾驶员也有机会弄脏眼睛。还记得挡风玻璃很难保持清晰。无论如何，仅凭视觉手段，AI
    和人类都无法看得更远，他们无法看到路边可能隐藏的东西，他们可能没有意识到行人正在穿过马路或即将进入马路，等等。审慎地，AI 通常被编程为在摄像头受到视觉限制的任何环境下减速并谨慎驾驶。当然，大多数自动驾驶汽车最初就被设计为谨慎驾驶（如不超速、完全停车不滑行停车等），但它们有时可能包含针对沙尘暴、大雾和其他天气情况等特殊情况的额外规定。


    这引出了自动驾驶汽车的另一个基本方面，即其 `ODD`（运行设计域）。在 4 级自动驾驶汽车的情况下，汽车制造商或自动驾驶技术公司应该定义一个 `ODD`，以划定适合其
    AI 驾驶系统使用的情况。例如，`ODD` 可能是 AI 驾驶系统旨在白天和非雨天条件下正常运行。如果开始下雨，AI 应该检测到这一方面，然后意识到其 `ODD`
    正在被超越，在这种情况下，它应该安全停车并等待，直到 `ODD` 条件恢复到其范围内。大多数现有自动驾驶汽车实体的主要努力是建立并部署他们的车辆在相当日常的条件下，然后稍后处理非常规条件，一旦他们充分处理了日常驾驶任务。这值得一提，因为沙尘暴极有可能被认为超出了当今自动驾驶汽车的
    `ODD`，被视为一种异常天气条件，目前不是高优先级，有时被称为边缘或角落案例。总而言之，这意味着如果你在沙尘暴期间身处自动驾驶汽车中，从驾驶角度来看，AI
    很可能尚未被设计为应对沙尘暴，因此它会相当迅速地警报将安全靠边停车并等待条件好转。我们可能期望人类驾驶员做同样的事。换句话说，不要尝试在恶劣的沙尘暴中驾驶，而是找个安全的地方停车等待条件好转。此外，如果已知或很可能在驾驶途中某处会发生沙尘暴，我们可能会建议甚至不要开始驾驶旅程。在道路条件适合安全驾驶之前，不要上路。


    回想一下，我之前提到自动驾驶汽车通常装载了一堆不同种类的传感器。理论上，如果摄像头被遮蔽或遇到困难，AI 可以使用其他传感器来尝试弥补视觉障碍。`MSDF`（多传感器数据融合）的整个概念是
    AI 可以汇集来自不同类型传感器的不同数据，这些传感器阵列分布在车身周围，并融合收集的数据，以试图获得车外发生情况的全面及时指示。尽管采用了这种整体方法，但要认识到在狂暴的沙尘暴中，雷达和
    `LIDAR` 也很可能在感知发生的事情时遇到困难，部分原因是大量漂浮颗粒会导致各种额外噪声、错误反射和其他问题。因此，虽然拥有多种传感器类型是一种优势，但它不能保证能应对沙尘暴。


    ### 结论


    想不想来个烧脑的？在这类驾驶情况下会出现 AI 伦理相关考量。你急需去医生办公室，通常会上车匆忙开过去。假设唯一可用的车是自动驾驶汽车。所以你召唤一辆自动驾驶汽车上车，通过其自然语言处理（`NLP`）告诉
    AI 医生的地址。AI 计算出该地区有沙尘暴并拒绝驾驶。AI 考虑到你的安全，不想在路上陷入沙尘暴，可能发生车祸让你受害。另一方面，你有你的理由想冒险去看医生。你应该能够覆盖
    AI 并坚持让它开车送你，还是你被困住，直到 AI 宣布可以安全出行？有大量这类 AI 伦理场景尚未解决，我们直到自动驾驶汽车更广泛普及时才会特别遇到它们。与此同时，对于美国东南部地区将被尘埃吞没的你们，你们可能会发现自己面临着与
    AI 驾驶系统类似的伦理困境，要求你衡量当沙尘暴包围你时，开车还是不开车是否是正确的选择。祝好运，远离尘埃，安全驾驶！


    # 第 11 章 亚马逊收购 Zoox 与 AI 自动驾驶汽车


    是时候吹响号角、铺开红毯，为一些古老的格言献上礼炮，它们解释了亚马逊这位巨头收购相对微不足道的 Zoox 这一近期宣布的消息，Zoox 是一家著名的自动驾驶汽车制造商，主要为自动驾驶汽车（`AV`）内部人士所知。试着衡量这些格言的分量：


