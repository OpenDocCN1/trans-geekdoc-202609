- raw: 'CHAPTER 2 DISCOVERING INTELLIGENT LIFE AND AI SELF-DRIVING CARS Is there intelligent
    life beyond our planet? Nobody here knows, though there are plenty of efforts
    to find out. The Search for Extraterrestrial Intelligence (SETI) has been going
    on for many years. The most common means for conducting the search consists of
    examining electromagnetic pulses coming from outer space. By intercepting such
    pulses as they are radiating across space, we hope to spot anything that might
    be a telltale clue of intelligent life that is beaming out those rays. It could
    be that some intelligent creatures are purposely trying to send us a message,
    doing so from far away, and they are hoping that we are astute enough to detect
    the messages. In that sense, the communique could be a purposeful one. Or, it
    might be that there are intelligent creatures that are doing things for which
    electromagnetic exhaust or spillover is occurring. In that case, we might get
    lucky and detect the leakage, remarkably discovering the intelligent life and
    yet perhaps it has not yet discovered us (I’m going to be generous and state that
    we are indeed intelligent life too if you get my drift). What are the odds of
    making such an incredible discovery? You might have heard of the famous Drake
    equation, a formula that was devised in the early 1960s by scientist Frank Drake
    to help estimate the odds of their being intelligent life in our galaxy. His  equation
    is relatively simple and yet powerful enough to have been long-lasting. Many have
    expanded upon his equation or have criticized elements of it. In any case, he
    had tried to estimate the odds that there are detectable civilizations in the
    Milky Way galaxy. By monitoring narrow-bandwidth radio signals and doing copious
    analysis of the signals, maybe we can ferret out that intelligent life is close
    to home (somewhere in our own galaxy). Various scientists have played with Drake’s
    equation and some say that the probability of there being other intelligent life
    in our galaxy and that we are able to detect them is near to zero (so close to
    zero that we should assume it is zero), while others claim that it is definitely
    a non-zero chance and we have a “reasonable” basis to keep looking. We can continue
    to look even if the odds are slim. People are looking for various reasons. One
    reason is out of pure curiosity. Another is that if there is intelligent life,
    maybe we can learn something from them that will help us. Yet another reason is
    the sci-fi portrayal that maybe an intelligent life will ultimately come to take
    over our planet, and thus we ought to find them before they start their invasion.
    As part of the search, computers can be used to examine the radio signals coming
    from outer space that scientists are in the process of collecting. It is a tedious
    effort by computers and involves mathematically looking for patterns within the
    radio signals. By-and-large, the radio waves are just noise, random bits of this
    or that, and the assumption is that if there a distinct pattern within the signals,
    it could mean that those are emanating as a purposeful signal  or a spillover
    signal. Supercomputers of massive computational capability have been and are continuing
    to be used to examine the voluminous radio signal data. It is a never-ending task.
    Years ago, some realized that it might be possible to harness everyday PC’s or
    people’s home microcomputers to also aid in the electronic hunt. A screen saver
    program was developed that could be easily loaded onto a PC and be used as a participant
    in the search. Essentially, via the Internet, chunks of the radio signal data
    could be downloaded to a PC, the PC would crunch away, and then the PC would report
    its results. If you could get lots and lots of PC’s doing this, and if you carefully
    coordinated the data being parceled out, you could do as much or even more than
    a single supercomputer could do. Some liken this to the democratization of the
    search for intelligent life, while others say it is merely a practical way to
    leverage the millions upon millions of everyday desktop and laptop computers that
    now exist on our planet. Those that download and employ the software are willingly
    allowing their computers to be used in the search effort. Much of the time your
    computer is likely idle and has nothing especially important to do. Why not let
    it participate in a larger than life kind of effort, quietly aiming to discover
    intelligent life beyond our borders? You might say that you don’t want to know
    whether there is other intelligent life, and therefore decide to not be part of
    the search. Or, you might not want your computer to be used for anything  other
    than for your own purposes. Those that relish conspiracy theories are apt to even
    believe that if their computer happens to be the one that detects intelligent
    life, those intelligent beings might decide that the owner of that computer is
    the first to go. Yikes, you could have done yourself in by simply participating
    in the search (well, this seems kind of a wacky notion, but everyone has their
    own cup of tea). For those of you that are interested in participating in the
    search, you can potentially make use of SETI@home, which has been based at the
    University of California Berkeley, though recently they decided to halt the distribution
    of the home version of the software. Via the SETI@home downloadable program, which
    was free of charge, you could install software that analyzes radio telescope data
    and report the results of the analysis. When I say free of charge, realize that
    you need to have access to the Internet, which you are probably paying for already,
    and you are allowing your computer to work on the data, thus the computer needs
    to be powered on (incurring presumably electricity, which you are likely paying
    to use). Thus, there are some costs associated with your aiding the effort (e.g.,
    your Internet access, your power consumption, your computer cycles), but it’s
    probably a negligible cost overall for you. Here’s an intriguing question: Could
    the advent of true self-driving cars potentially help us in the search for discovering
    intelligent life on other planets? My answer is yes. Let’s unpack the matter and
    see why. The Levels Of Self-Driving Cars It is important to clarify what I mean
    when referring to true self- driving cars. True self-driving cars are ones that
    the AI drives the car entirely on its own and there isn’t any human assistance
    during the driving task. These driverless cars are considered a Level 4 and Level
    5, while a car that requires a human driver to co-share the driving effort is
    usually considered at a Level 2 or Level 3. The cars that co-share the driving
    task are described as being semi-autonomous, and typically contain a variety of
    automated add-ons that are referred to as ADAS (Advanced Driver-Assistance Systems).
    There is not yet a true self-driving car at Level 5, which we don’t yet even know
    if this will be possible to achieve, and nor how long it will take to get there.
    Meanwhile, the Level 4 efforts are gradually trying to get some traction by undergoing
    very narrow and selective public roadway trials, though there is controversy over
    whether this testing should be allowed per se (we are all life-or-death guinea
    pigs in an experiment taking place on our highways and byways, some point out).
    Since semi-autonomous cars require a human driver, computer processing capabilities
    are typically less powerful than the computers used on truly autonomous cars.
    As will be explained shortly, the powerful computers employed in self-driving
    cars will be the key to the suggestion that driverless cars can help find intelligent
    life outside of our planet. For semi-autonomous cars, it is important that I mention
    a disconcerting aspect, namely that in spite of those human drivers that keep
    posting videos of themselves falling asleep at the wheel of a Level 2 or Level
    3 car, do not be misled into believing that you can take away your attention from
    the driving task while driving a semi-autonomous car. You are the responsible
    party for the driving actions of the car, regardless of how much automation might
    be tossed into a Level 2 or Level 3. Self-Driving Cars And The Search For Intelligent
    Life For Level 4 and Level 5 true self-driving cars, since they are going to be
    equipped with quite powerful computers, we can consider how those driverless cars
    can be an aid in the search for intelligent life. The AI software will be running
    on the on-board computers and has the life-or-death role of driving the car. There
    isn’t a human driving the car. All the occupants inside a self-driving car are
    passengers. While a self-driving car is in motion, the AI is churning away and
    examining the sensory data to figure out what the driving scene consists of. The
    AI must interpret the data and make “decisions” about what the car should do next.
    This is a computationally intensive task and requires some rather impressive computing
    capabilities to be included in the driverless car. To get software updates for
    the AI system, there is an on-board electronic communication capability known
    as OTA (Over-The-Air). The OTA is also used to take the collected data from the
    on-board sensors and push it up into the cloud, allowing cloud-based servers to
    use the data to uncover additional Machine Learning and Deep Learning improvements
    about the driving task. At some point, if the driverless car is an EV (Electrical
    Vehicle), it likely needs to be parked and plugged into a charger to get the electrical
    power pumped back up. While the self-driving car is sitting there, presumably
    the AI has nothing much to do. The computers on-board the driverless car is  relatively
    idle at that time. Guess what, you could potentially use those idle computing
    cycles to search for intelligent life! Yes, one means of leveraging the topnotch
    processors of a self-driving car would be to engage them in the same kind of radio
    signal processing that your home computer can do. A downloaded and bona fide SETI
    program could be sitting in the memory of the self-driving car and be activated
    when the car is parked and doing nothing else of merit. Via OTA, radio signal
    data would be downloaded into the on-board computer memory, and once the analysis
    is done, the results could be pushed up into the cloud. Might as well use the
    car’s computers for something that can possibly help mankind. You might be puzzled
    about the efficacy of having one self-driving car help in this manner, which doesn’t
    seem like a moving-the-needle kind of assistance, so why bother with it. There
    are about 250 million conventional cars in the United States today. Eventually,
    inexorably, it is assumed that those conventional cars will be retired and gradually
    be replaced by self-driving cars. Some argue that we might not need the same number
    of driverless cars, meaning that we might end-up with some lesser number of driverless
    cars to provide the equivalent transport volume as today’s 250 million conventional
    cars. Meanwhile, an equally compelling argument is that we might end up with more
    driverless cars than the number of today’s conventional cars, doing so because
    of the principle of induced  demand. Induced demand is the concept that once you
    start something new it can bring forth added demand that was previously being
    suppressed. If people that today are mobility disadvantaged opt to use driverless
    cars, and if we all become expectant of near-instantaneous mobility-on-demand,
    the number of driverless cars needed to fulfill societal needs could well exceed
    the number of today’s conventional cars. Anyway, putting aside this unresolved
    debate about the count, perhaps we can all agree that there is likely to be at
    least some hundred if not many hundreds of millions of driverless cars in our
    future. If all those millions upon millions of self-driving cars were using their
    top-end computers to analyze the radio signals, it would be a huge boost in the
    search effort . It could be a game-changer in the search for intelligent life.
    Fleet owners of driverless cars could establish a SETI search capability into
    their fleet. As a passenger, you might be utterly clueless that the fleet is supporting
    the intelligent life search effort. Or, the automaker or fleet owner might intentionally
    want you to know about the search activities, using their largesse as a kind of
    marketing ploy. Hey, you all, use our ridesharing driverless cars since you are
    then supporting the search for intelligent life. I’ve so far emphasized that the
    on-board computers would be only leveraged when the driverless car is parked and
    has no other task at  hand, but this is not the only circumstance that could allow
    for doing the radio signal analyses. As a human driver, you know that there are
    times while driving a car that involves sitting still and idling, such as when
    you are waiting at a red light or waiting to make a right turn and there is a
    pedestrian crossing in the crosswalk. During those idle moments, the on-board
    computer could spare a few cycles and crunch further on the radio signal data.
    Computers operate at tremendously fast speeds, and thus a handful of seconds that
    to you or me doesn’t seem like much available time is a ton of computational time
    for the on-board processors. We can up the ante. Your driverless car is on the
    freeway and zooming along. There is no other significant traffic nearby. The driving
    scene is pretty much barren of anything other than simply driving in a straight
    line. Yes, the on-board computers could potentially do some alien outer space
    life searching during those moments too. Conclusion Two birds with one stone.
    You can have driverless cars and meanwhile also be improving the search efforts
    to discover intelligent life on other planets. It seems like a great combo deal.
    Not so fast! There are some potential drawbacks. First, some might argue that
    any “spare” moments of the on-board computers ought to go toward the number one
    priority of driving the car. Even though a car is sitting at a red light, there
    is still the opportunity to be continually examining and re-examining the driving
    scene. The case can be made that the computers in a self-driving car should be
    exclusively used toward the driving task, at all times, including when the driverless
    car is parked (it could be reviewing it’s driving efforts of the day and finding
    improvements in how to drive better). As such, you can put your foot down and
    declare that the computers are sacrosanct on a self-driving car and must be solely
    devoted to being able to drive. Another concern is that the program used to search
    for intelligent life might somehow go awry. Suppose the search software causes
    the on-board computers to get into a locked-up loop and those computers are unable
    to be switched over into the driving mode. Not a good outcome. Indeed, the classic
    line of “first, do no harm” is a crucial one for anything that is running on-board
    the computers inside the driverless car. Worse too, suppose someone attaches a
    computer virus to the search program. A fleet owner that has downloaded the search
    software is providing a goldmine form of access to the virus maker. In a trojan
    horse manner, the nefarious virus could be easily and readily pushed out to millions
    of driverless cars, doing so under the innocent guise of trying to help mankind.
    You can see why there are some that eschews the idea of using  driverless cars
    to aid in the intelligent life search. No sense in taking any chances with a multi-ton
    automobile that somehow could go astray, all due to a “silly” and unlikely chance
    of detecting creatures in outer space. On the other hand, there are those that
    hate to see computing cycles go to waste and perceive the advent of self-driving
    cars as a boon to the number of topnotch computers that we will have on this planet.
    Should all those computers be doing nothing of consequence when they have idle
    time? Can’t we put in place enough safeguards to ensure that the search for intelligent
    life by self-driving cars is intelligently and safely devised? Right now, the
    automakers and tech firms are struggling with just trying to get self-driving
    cars to drive properly, let alone be worried about the search for intelligent
    life. You likely won’t see anyone seriously entertaining this topic for years
    to come, only once the advent of true self-driving cars seems more assured. One
    final thought. Suppose though that the sooner we could find intelligent life,
    the sooner we might learn of tech advances that we haven’t yet conceived of. Perhaps
    the delay in using self-driving cars for finding intelligent life might delay
    our discovering that we can beam humans like in Star Trek and dispense with cars
    of any kind. Oops, that’s not necessarily a good business model for the automakers. '
