    local streets and yet they were not on the highway that you opted to react as
    though they were positioned on the highway. What a mess! You would be continually
    doing all sorts of crazy driving antics on the highway and be confusing all the
    other nearby drivers. In short, since the Burger King sign was not on the highway,
