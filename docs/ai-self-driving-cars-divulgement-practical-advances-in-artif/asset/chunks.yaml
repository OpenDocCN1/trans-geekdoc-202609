    # INTRODUCTION TO SELF-DRIVING CARS


    This is a book about self-driving cars. Someday in the future, we''ll all have
    self-driving cars and this book will perhaps seem antiquated, but right now, we
    are at the forefront of the self-driving car wave. Daily news bombards us with
    flashes of new announcements by one car maker or another and leaves the impression
    that within the next few weeks or maybe months that the self-driving car will
    be here. A casual non-technical reader would assume from these news flashes that
    in fact we must be on the cusp of a true self-driving car.


    We are still quite a distance from having a true self-driving car. A true self-driving
    car is akin to a moonshot. In the same manner that getting us to the moon was
    an incredible feat, likewise, is achieving a true self-driving car. Anybody that
    suggests or even brashly states that the true self-driving car is nearly here
    should be viewed with great skepticism. Indeed, you''ll see that I often tend
    to use the word "hogwash" or "crock" when I assess much of the decidedly fake
    news about self-driving cars. Indeed, I''ve been writing a popular blog post about
    self-driving cars and hitting hard on those that try to wave their hands and pretend
    that we are on the imminent verge of true self-driving cars.


