    # AND AI SELF-DRIVING CARS


    ## CHAPTER 8 DRIVE-BY SHOOTINGS AND AI SELF-DRIVING CARS


    Drive-by shootings continue to be in the news and seem to be occurring at an alarming
    pace. Those that undertake this heinous act are often doing so on the basis that
    they believe they will not be caught. Here’s why they believe so. Via a car, it
    is possible to be somewhat hidden within the vehicle, not especially noticeable
    from the outside, and rapidly approach wherever the perpetrator intends to fire
    a shot, along with having a speedy getaway after shooting at their target. All
    in all, a car provides several crucial elements in the performance of a drive-by
    shooting.


    The car is a kind of protector. It helps to disguise or hide the perpetrator.
    A targeted person does not necessarily realize that the car holds someone desiring
    to shoot at them. Also, if the fired at intended target attempts to shoot back
    at the shooter, once the initial shots are fired, the car acts as a type of shield.
    Thus, a car is handy as a means of committing a drive-by shooting since it provides
    a form of protective cover.


    The car aids in rapidly committing the drive-by act. Speed in the case of drive-by
    shootings is frequently a key tactic that the perpetrator relies upon. If they
    were slowly approaching the intended target on say foot, they might be discovered,
    and a preemptive strike might occur, or the target might have time to hide or
    flee. After the perpetrator takes a shot, they could get rushed in response, but
    with a car, they can quickly drive away from the scene.


    The car can be said to bolster the perpetrator in a willingness to do a drive-by
    shooting. Those that commit a drive-by shooting are potentially bolstered by being
    inside a car, feeling less vulnerable, and gaining a sense of anonymity that no
    one will necessarily know that they committed the crime. In some cases, the perpetrator
    purposely pokes their head out of the car to let the intended target know it is
    them, yet assumes doing so will only reveal themselves to the victim and not otherwise
    readily showcase their criminal activity to other potential eyewitnesses.


    Statistics about drive-by shootings are somewhat sporadically recorded and not
    especially thoroughly logged on a nationwide basis. A prior study that examined
    drive-by shooting counts came to some interesting and tentative indications (be
    careful in using these results since it was a point-in-time study and other limitations
    apply), including:


    *   About half of drive-by shootings occurred at a targeted residence

    *   Other locales included street corners, parking lots, basketball courts, bus
    stops, etc.

    *   Drive-by shootings tended to occur at nighttime, usually between 7 p.m. and
    midnight

    *   Peak months were in the summertime, lowest months in the winter

    *   Gang involvement was a common underlying aspect


    Generally, those identified characteristics seem to make intuitive sense, namely
    that a drive-by shooting would tend to be done at nighttime, providing the added
    cover of darkness, and more so during the summer months, when people are outdoors,
    and that the location would be near a residence which presumably is where the
    target is known to be or likely to live, along with other locations that might
    be prime places to spot the intended victim.


    The listed Top 10 ranked states for overall counts of drive-by shootings were
    noted as (from most to less):


    *   California

    *   Texas

    *   Florida

    *   Illinois

    *   Washington (tied with Illinois)

    *   Oklahoma

    *   North Carolina

    *   Georgia

    *   New York

    *   Louisiana

    '
