- raw: 'CHAPTER 7 US FEDERAL TESTING LOG AND AI SELF-DRIVING CARS The U.S. federally
    chartered automotive safety agency NHTSA (National Highway Traffic Safety Administration)
    has announced today a new online log that will be used to indicate the ongoing
    status of nationwide Autonomous Vehicles (AVs) public roadway efforts, including
    those of self-driving cars. Known as the AV TEST initiative, a catchy acronym
    for Automated Vehicle Transparency and Engagement for Safe Testing, the public
    will be able to see the log online and also sign-up to be emailed whenever the
    latest info is posted. As stated at the AV TEST website: “You’ll be able to see
    if testing has been reported in your community and learn more about the types
    of activities happening, including testing of various types of motor vehicles
    — cars, low-speed shuttles, trucks, and driverless electric delivery vehicles.”
    Speakers at today’s kick-off included U.S. Department of Transportation Secretary
    Elaine L. Chao, National Highway Traffic Safety Administration Deputy Administrator
    James C. Owens, Federal Highway Administration Administrator Nicole Nason, and
    U.S. DOT Deputy Assistant Secretary for Transportation Policy Finch Fulton.  Rightfully,
    the session emphasized that there are not yet today any true self-driving cars
    yet available for sale to the public and that  it is important to clarify the
    difference between semi-autonomous vehicles and those that are fully autonomous.
    As eloquently stated by NHTSA Deputy Administrator James Owens: “For starters,
    there are no vehicles with automated driving systems available for sale to the
    public today, any vehicle that public can buy today cannot drive itself. It requires
    an active attentive and fully engaged driver, ready to act.” I’ll say more about
    this in a moment. One crucial caveat to keep in mind is that the log is based
    on voluntary submissions from those that are fielding self-driving vehicles, which
    means that the automakers and self-driving car firms can opt to post their status
    or decide to do not so. Furthermore, when they post their status, it could presumably
    be quite outdated and not necessarily reflect their most recent activities. Nonetheless,
    providing a centralized and easily utilized log is hopefully going to be well
    received and appropriately used on a timely and effective basis by all. This is
    especially welcomed on a centralized basis since currently the myriad of states
    that are enabling self-driving vehicle testing are widely disparate in their reporting
    efforts. Some states have required annual reporting, some states lack any viable
    reporting, and it is an across the board mishmash that can be laborious to try
    and stay on top of. So far, purportedly nine companies have signed-up to use the
    new AV TEST log including Fiat Chrysler, Toyota Motor, Cruise, Local Motors, Navya,
    Uber Technologies Inc., Nuro, Beep, and Waymo. One nifty feature of the AV TEST
    will be an online mapping tool that will allow the public to zoom-in on where
    public roadway  testing efforts are taking place, allowing you to ascertain if
    self-driving vehicles are roaming your neck of the woods, as it were. Also, data
    such as the type of vehicles being used, their frequency of use, dates of use,
    routes being taken, and other related info will be potentially available via the
    log. And, reportedly eight states have signed-up to-date to use the new log including
    California, Florida, Maryland, Michigan, Ohio, Pennsylvania, Texas, and Utah.
    The reason that the state and local agencies might log data at the AV TEST site
    is to indicate what types of legislation are being employed in their realm to
    oversee self-driving testing, and might also include aspects about emergency response
    plans if any self-driving adverse events occur. For overall info about what the
    U.S. Department of Transportation (USDOT) is doing regarding AVs, including a
    series of notable policy statements, the latest being AV 4.0 entitled “Ensuring
    American Leadership in Automated Vehicle Technologies: Automated Vehicles 4.0”
    see the USDOT website. Meanwhile, please be aware that federal legislation about
    regulating self-driving cars has continued to be stalled in Congress, partially
    due to differing viewpoints across political lines and most recently as a result
    of the pandemic and a focus on other legislative matters. It would seem unlikely
    that any such legislation will be completed soon, especially with the November
    election coming up, thus don’t expect to have new federal regulations on AVs until
    at least sometime next year. There are some arguing fervently that more laws and
    regulations are needed to keep the self-driving industry on point and ensure that
    the vaunted mobility-for-all aspiration will be achieved, along with attempting
    to implement stronger safety measures than otherwise might be chosen by the industry.
    At the same time, some want to change the existing laws that are seen as hampering
    progress in self-driving cars, thus proclaimed to be delaying the mobility-for-all
    hopes and impeding the presumed reduction in lives lost due to human-driven efforts.
    The shape and nature of what such legislation should consist of have been a long-standing
    tug-of-war and will likely remain so until other exigencies might occur. Understanding
    The Levels Of Self-Driving Cars As a clarification, true self-driving cars are
    ones that the AI drives the car entirely on its own and there isn’t any human
    assistance during the driving task. These driverless vehicles are considered a
    Level 4 and Level 5, while a car that requires a human driver to co-share the
    driving effort is usually considered at a Level 2 or Level 3. The cars that co-share
    the driving task are described as being semi-autonomous, and typically contain
    a variety of automated add-on’s that are referred to as ADAS (Advanced Driver-Assistance
    Systems). There is not yet a true self-driving car at Level 5, which we don’t
    yet even know if this will be possible to achieve, and nor how long it will take
    to get there. Meanwhile, the Level 4 efforts are gradually trying to get some
    traction by undergoing very narrow and selective public roadway trials, though
    there is controversy over whether this testing should be allowed per se. Since
    semi-autonomous cars require a human driver, the adoption of those types of cars
    won’t be markedly different than driving conventional vehicles, so there’s not
    much new per se to cover about them on this topic (though, as you’ll see in a
    moment, the points next made are generally applicable). For semi-autonomous cars,
    it is important that the public needs to be forewarned about a disturbing aspect
    that’s been arising lately, namely that despite those human drivers that keep
    posting videos of themselves falling asleep at the wheel of a Level 2 or Level
    3 car, we all need to avoid being misled into believing that the driver can take
    away their attention from the driving task while driving a semi-autonomous car.
    You are the responsible party for the driving actions of the vehicle, regardless
    of how much automation might be tossed into a Level 2 or Level 3. For Level 4
    and Level 5 true self-driving vehicles, there won’t be a human driver involved
    in the driving task. All occupants will be passengers. The AI is doing the driving.
    Potential For Media Misreporting Shifting gears, it is handy to consider what
    might take place as a result of the new AV TEST log. Sadly, one segment that might
    not use the log appropriately could be the media, going astray in misreporting
    whatever might be posted at the log, and, potentially misreporting what is even
    not posted there too. For example, already a media report indicated that the AV
    TEST log would indicate where Apple self-driving cars are being tested. This is
    a smattering of unseemly shenanigans. While it is true that Apple might opt to
    report as such, there is no requirement that they do so, and we will have to wait-and-see
    what Apple chooses to do. It is already the case that Apple has been quite tightlipped
    about their efforts and one wonders whether they will voluntarily share info about
    their heretofore quite secretive activities on self-driving cars. Another potential
    boondoggle will be the potential reporting and misreporting by the media about
    disengagements. Essentially, disengagements are supposed to be instances of when
    a self-driving car being tested on public roadways was taken over by an on-board
    human backup driver. The backup driver might decide that the AI driving system
    is about to make a mistake and thus choose to grab the driving controls back from
    the self-driving system. Or, the AI itself might detect a circumstance that requires
    the human backup driver to handle a thorny driving situation and handover the
    driving accordingly. The media oftentimes misstates the significance and nature
    of disengagements, doing so in a variety of ill-informed and at times oddly creative
    ways. One such method consists of ranking the self-driving efforts by the number
    of reported disengagements, implying that the tryouts with the least number of
    disengagements must ergo be further along and more advanced than those that have
    a higher number of disengagements. Here’s why that is misleading, at best. Suppose
    firm X has 5 disengagements and firm Y has had 20. Seemingly, if reported simply
    on that basis, it would appear that firm X is doing much better by far than firm
    Y. But suppose that firm X has driven only 100 miles, while firm Y has driven
    10,000 miles, I think you can readily realize that the number of disengagements
    per miles driven would be a lot less for firm Y, suggesting that firm Y is doing
    much better than firm X. Even this though is problematic. As is well-known in
    the self-driving industry, all miles are not the same. If a company opts to undertake
    their public tryouts in a quiet suburban neighborhood, those miles driven would
    presumably be relatively “easy” miles, assuming that there is likely not much
    vehicular traffic and the driving situations are tame. In comparison, public tryouts
    in a hectic downtown city with bustling traffic, dealing with jaywalking pedestrians
    and wild drivers, these are decidedly not the same kinds of miles as those of
    a somewhat docile suburban setting. On top of all of those considerations is that
    disengagements can be somewhat tricked. If you are leery of having to report your
    disengagements, one approach would be to tell the backup drivers to refrain from
    undertaking a disengagement, nearly at all costs, to keep your counts lowered.
