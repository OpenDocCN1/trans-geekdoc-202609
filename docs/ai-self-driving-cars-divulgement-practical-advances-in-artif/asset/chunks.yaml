    become not just a premier automaker but also be the preeminent self-driving car
    provider too. Via the use of Autopilot and the sensors packaged into a Tesla vehicle,
    step-by-step there has been an incremental effort to gradually transform the semi-autonomous
    driving into a fully autonomous driving vehicle. Let’s make sure that everyone
    reading this knows one very clear cut and irrefutable point: Today’s Tesla’s are
    not fully autonomous. Despite whatever wild claims you hear, and those idiotic
    videos online of people falsely believing their Tesla can drive itself, this is
    a complete crock and a regrettable and dangerous falsehood. With today’s Tesla’s
    and all their “autopiloting” features, it is still a car that requires a human
    driver. On the autonomous driving scale, you would say that the vehicles are a
    Level 2. True autonomous cars are at a Level 4 and someday at a hoped-for Level
    5. Zoox is focusing on Level 4 and Level 5. Tesla is at a Level 2 and trying to
    progressively make its way to a Level 4 and Level 5. So you could readily indicate
    that both Tesla and Zoox are ultimately seeking to achieve true self-driving,
    though Tesla is doing so from a lesser level of semi-autonomous driving, while
    Zoox is skipping past those lower levels and striving instead for the topmost
    ones. Nobody can say for sure which path is the better route. Firms like Tesla
    would undoubtedly claim they are taking the “right” approach by a stepwise refinement
    methodology. What many people do not quite seem to realize is that Tesla is opening
    themselves to a lot of costly risks and potential downfall by embarking upon Level
    2 and presumably into a Level 3. I’ve exhorted repeatedly that we are going to
    have human drivers that do not take seriously their responsibilities as the driver
    of a Level 2 or Level 3 car. When there are car crashes involving Level 2 and
    Level 3 vehicles, the automaker immediately attempts to absolve themselves of
    all blame by pointing out that the human driver is the responsible party for the
    driving task. Whether this will continue to grant those firms a kind of scot-free
    liability remains to be seen, and my prediction is that there will likely be massive
    lawsuits that are going to potentially severely ding such firms and even put some
    of them out-of-business. As such, some maintain that the path of Zoox and others
    that are leapfrogging to Level 4 and eventually Level 5 is the more prudent approach,
    avoiding what might become an ugly and firm-destroying tussle by being mired in
    the muck of Level 2 and Level 3. Of course, those in the Level 2 and Level 3 are
    apt to claim that it is more likely they will get to Level 4 and then Level 5,
    sooner, since they will have built their way there, learning and reusing as they
    go. And, meanwhile, they can rake in revenue from Level 2 and Level 3, versus
    those having essentially no revenue at all while struggling with getting Level
    4 ready for use in the everyday world. The additional twist is that some of the
    Level 4 and Level 5 aimers are using their autonomous driving capabilities for
    aspects other than solely driving a passenger-based car. By leveraging related
    use cases, this can potentially imbue those firms into viable revenue streams
    sooner and keep the lights on. There are efforts of using self-driving delivery
    vehicles and other modes of transport such as autonomous shuttles that might be
    considered more readily viable, meanwhile potentially continuing the scuffles
    of problematic passenger car requirements (some believe that Amazon is most likely
    eyeing the use of Zoox capabilities for handling delivery and logistics mobility
    matters, more so than as rider or ride-sharing vehicle provider).


    ## What Will Amazon Do With Zoox


    In the case of Tesla, it seems rather apparent that Musk has a (heavy) hands-on
    approach and appears to be routinely if not daily putting his two cents into what
    is happening with Autopilot and the self-driving aspirations of the firm. You
    would be hard-pressed to suggest that Musk does otherwise. And probably get a
    tweet or two to set you straight. What will happen with Zoox and the potential
    hands-on or maybe arms-length reach of Jeff Bezos? According to the formal press
    release issued about the Amazon and Zoox deal, apparently, Zoox will remain as
    an independent operation within the Amazon empire. Some are dubious about such
    a declaration, and we have seen similar such assertions made when a large firm
    buys another company and yet the independence radiance does not last for very
    long (if it ever even had a semblance of happening). Put on your clairvoyance
    cap and let’s examine the self-driving era crystal ball to see what might happen
    to Zoox while within Amazon. Here are the Top Five scenarios:

    '
  trans: '

    好吧，诚然最后那句俏皮话不完全符合其传统形式，但无疑非常贴切当下的局势。以下是幕后的花絮与姿态。在亚马逊和 Zoox 宣布交易后，埃隆·马斯克发了一条推文，旨在嘲讽杰夫·贝佐斯是个模仿者，推测模仿对象是特斯拉（趣味的是，该推文使用了一个猫的表情符号，给嘲讽增添了更多调料）。简而言之，这番调侃的意思是：贝佐斯通过亚马逊收购
    Zoox，这家庞大的电商巨头将成为特斯拉自动驾驶野心的正面竞争对手。你可以把这看作两个巨头现在将展开激烈的肉搏战（注：亚马逊早已涉足自动驾驶行业，但可以说这次收购
    Zoox 是一个大胆且抛出手套般的挑战姿态）。这就是为什么马斯克能嘲讽贝佐斯是模仿者或跟风者，有种“嘿，伙计，欢迎来到派对，总算来了”的意味。对贝佐斯此举的一种解读是，这展示了一个坚定的信念：自动驾驶汽车将至关重要，因此值得进行大笔投资（据报道，亚马逊斥资约
    12 亿美元收购 Zoox，数额可观，但有人会说这对亚马逊只是零花钱）。另一方面，考虑到 Zoox 此前据报道估值约 30 亿美元或更高，一些人为这家自动驾驶公司的“白菜价”捏把汗，担心这揭示了该领域的疲软，并重新点燃了人们的担忧：自动驾驶可能无法实现，或者至少在很长一段时间内无法实现。反方观点认为：实现自动驾驶是一个烧钱的游戏，试图让传统投资者为一个可能美好却遥遥无期、甚至可能根本无法实现的未来买单，这使得作为一家独立的自动驾驶开发商难以生存。你需要有深厚的资金实力和坚韧不拔的耐心才能在利基市场立足，而亚马逊潜在具备这些特质。当然，你可以说亚马逊很可能以极大的折扣价买入，部分原因是考虑到社会和经济环境，所有自动驾驶项目近期都有所收缩，但这让
    Zoox 能继续推进，并似乎避免了如果 Zoox 无法找到其他有吸引力的融资方式而给该行业带来的损失。不过，这桩交易的内幕远不止表面看起来那么简单。请允许我花一点时间为你梳理最新进展。


    ## 什么是自动驾驶


    作为背景，Zoox 是一家总部位于硅谷的自动驾驶汽车制造商，成立于 2014 年，自此一直是一家初创公司。让他们与众不同的是，他们深信不疑且坚定不移地认为：自动驾驶汽车必须从零开始打造。这是什么意思？许多自动驾驶软件开发实体将其自主能力瞄准传统汽车，通过配备精密的传感器套件和其他增强设备，将其改装成自动驾驶车辆。与此同时，尽管
    Zoox 也通过使用特别改装的丰田汉兰达和普锐斯 C 做着同样的事，但他们的总体激情在于彻底重塑汽车平台。例如，在人类驾驶的汽车中，始终将汽车设计为前向行驶是合理的，因为人类坐在固定位置面向前方。在现代汽车发明史上，我们一直是这样坐、这样开车的。但在自动驾驶汽车中，AI
    在驾驶，因此你可以设计车辆随时在任一方向“前向”行驶。因此，抛弃有时需要“倒车”的陈旧观念，转而将驾驶方向设定为始终向前，即使你碰巧正朝着刚来的反方向行驶。他们称之为对称且双向的设计，此外该车辆将是零排放的电动汽车（EV）。你可能会好奇，哪条路更好？是在传统车上堆砌复杂的尖端技术，还是重新构想汽车的构成。棘手的是，如果你决定走看似激进的路线，尝试前所未有的设计，你可能要同时面对两场硬仗。你必须确保物理车辆本身能在道路上运行且安全，同时还要确保
    AI 和自动驾驶系统正常工作。这就是为什么许多自动驾驶相关项目专注于使用各种增强版日常用车，试图减少原本就无可争议的“登月级”壮举中的变数和不确定性。逻辑是：你可以审慎地通过一个基于已验证车型的坚实基础，缓步进入自动驾驶领域，从而只需应对
    AI 自动驾驶能力背后的焦虑与阵痛。Zoox 本质上想“两全其美”，他们通过使用经过自动驾驶技术增强的特定常规车型（包括将这些车投入道路进行真实世界试驾），在幕后全力推进全新专用车型的研发。如果你一直跟得上我的解释，接下来让我们更深入地挖掘埃隆·马斯克那条推文所蕴含的多维度、令人费解的含义。大家都知道马斯克一直致力于让特斯拉不仅成为顶级车企，也成为卓越的自动驾驶汽车提供商。通过使用
    Autopilot 及封装在特斯拉车辆中的传感器，特斯拉一直在逐步、渐进地将半自动驾驶转变为全自动驾驶。让我们确保每位读者都知道一个非常清晰、不容辩驳的事实：**如今的特斯拉并非全自动驾驶。**
    无论你听到多么狂野的宣称，看到网上多少愚蠢的视频里人们错误地相信他们的特斯拉能自己开车，这完全是胡扯，是令人遗憾且危险的谎言。以如今的特斯拉及其所有“自动辅助驾驶”功能来看，它仍是一辆需要人类驾驶员的车。在自动驾驶等级划分中，你会说这些车属于
    L2 级。真正的自动驾驶汽车是 L4 级，未来有望达到 L5 级。Zoox 专注于 L4 和 L5 级。特斯拉处于 L2 级，并试图逐步迈向 L4 和 L5
    级。因此你可以明确指出，特斯拉和 Zoox 最终都在追求真正的自动驾驶，只是特斯拉从较低级别的半自动驾驶起步，而 Zoox 则跳过那些低级别，直接冲刺最高级别。没人能确定哪条路径更好。特斯拉这类公司无疑会声称，他们通过逐步完善的方法论走的是“正确”路线。许多人似乎没完全意识到，特斯拉涉足
    L2 级并推定进入 L3 级，让自己面临巨大的昂贵风险和潜在垮台危机。我反复呼吁：我们将会有不认真履行 L2 或 L3 级车辆驾驶员责任的人类驾驶员。当涉及
    L2 和 L3 级车辆的车祸发生时，车企会立即试图通过指出人类驾驶员是驾驶任务的责任方，来为自己完全免责。这种做法能否继续让这些公司获得“免责特权”仍有待观察，但我预测很可能会爆发大规模诉讼，可能会严重打击这些公司，甚至让一些公司倒闭。因此，一些人坚持认为，Zoox
    等公司跳跃式冲刺 L4 并最终达到 L5 的路径更为稳妥，避免了陷入 L2 和 L3 级的泥潭中可能引发的、足以毁掉公司的丑陋纠葛。当然，处于 L2 和 L3
    级的公司倾向于声称，他们更有可能更早达到 L4 甚至 L5，因为他们是一步步构建上来的，在过程中学习和复用。同时，他们能从 L2 和 L3 级赚取收入，而那些冲刺
    L4 级的公司基本没有任何收入，还在为让 L4 适应日常世界而挣扎。额外的转折在于，一些冲刺 L4 和 L5 级的公司将自动驾驶能力用于除载客乘用车之外的其他方面。通过利用相关用例，这些公司有望更早建立可行的收入来源并维持运营。例如利用自动驾驶配送车辆和自动驾驶班车等其他运输模式，这些可能被认为更容易实现商业化，同时继续应对棘手的乘用车需求（一些人认为亚马逊极有可能看中
    Zoox 的能力用于处理配送和物流出行事务，而非作为网约车或共享出行服务提供商）。


    ## 亚马逊将如何处置 Zoox


    在特斯拉的案例中，马斯克似乎采取了一种（深度）亲力亲为的方式，且似乎例行公事般、甚至每天都在为 Autopilot 和公司的自动驾驶愿景添砖加瓦。你很难想象马斯克会有别的做法。而且大概率会收到一两条推文来“纠正”你。那么
    Zoox 会怎样？杰夫·贝佐斯会亲力亲为，还是放手不管？根据关于亚马逊和 Zoox 交易的正式新闻稿，显然 Zoox 将作为亚马逊帝国内部的一个独立业务继续运营。一些人对这种声明持怀疑态度，我们也见过大公司收购小公司时做出类似断言，但这种独立的光环往往持续不了太久（如果它曾经真正出现过的话）。戴上你的“预知之帽”，让我们凭借自动驾驶时代的水晶球，看看
    Zoox 在亚马逊麾下可能会发生什么。以下是五大可能场景：


    '
