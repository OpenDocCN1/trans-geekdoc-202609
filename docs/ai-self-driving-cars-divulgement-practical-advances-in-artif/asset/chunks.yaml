- raw: 'CHAPTER 6 COPS SHOOTING AT VEHICLES AND AI SELF-DRIVING CARS One of the most
    controversial policing topics that society wrestles with is whether law enforcement
    officers should be able to shoot at a moving vehicle. Generally, three overarching
    opinions on the matter seem to have emerged on this weighty topic. Some insist
    that such an act should never be permitted. As notable emphasis, that means that
    no matter what the circumstances might be, no police officer is to ever shoot
    at a moving vehicle, period, end of the story. In somewhat of a contrast, others
    indicate that the act can be undertaken though only rarely, allowing that there
    would be extraordinary exceptions that merit such dire action. And then some would
    state that such an act can be done in the performance of law enforcement duties,
    for which the officer will ultimately need to justify their actions, and that
    trying to stipulate a narrow prespecified range of when such action can be undertaken
    is improperly hampering the officer and putting their life at undue risk and potentially
    likewise putting other innocents at risk too. In short, the three mainstay approaches
    might be described as: a)        Never allowed b)       Allowed rarely if ever
    c)        Allowed in due course as merited For those in the “never allowed” perspective,
    they would  typically argue that the moment that you accept the other two options
    to be considered, you are opening a Pandora’s box. To them, this is a strictly
    binary question and the answer is either that shooting at a moving vehicle is
    allowed or it is banned outright. Once you progress into the allowed viewpoints,
    the “never allowed” would tend to say that you are going to have a slew of instances
    and that some might be bona fide and yet some will not be, and instead of enabling
    a chance of incurring the instances that are not bona fide, the better approach
    is to cut-off the option altogether. In essence, beyond “never allowed” is a perceived
    slippery slope and thus the notion is to not allow any slippage potential at all,
    thus, stand fast on the precept that an officer should never ever shoot at a moving
    vehicle. You might have recently heard or seen in the media a lot of vigorous
    dialogue and acrimonious debate about this rather contentious and problematic
    matter. Recent news stories about policing have at times mentioned a campaign
    that is seeking to have police departments adopt eight policies, known as the
    “8 Can’t Wait” code. One of the steadfast eight rules of the campaign is that
    officers should be banned from shooting at moving vehicles “in all cases” and
    that without such a policy there are “loopholes,” accordingly shooting at moving
    vehicles ought to be “categorically banned.” You might be wondering what the law
    currently indicates about such matters. Generally, US federal laws and guidelines
    follow the advisement of several related Supreme Court rulings, each of which
    tends to ultimately hinge on the meaning of the Fourth Amendment, which you might
    recall states this: “The right of the people to be secure in their persons, houses,
    papers, and effects, against unreasonable  searches and seizures, shall not be
    violated, and no warrants shall issue, but upon probable cause, supported by oath
    or affirmation, and particularly describing the place to be searched, and the
    persons or things to be seized.” In a 1985 ruling by the Supreme Court in the
    case of Tennessee v. Garner, and as it pertains to the Fourth Amendment meaning,
    a decision was rendered that if “the officer has probable cause to believe that
    the suspect poses a significant threat of death or serious physical injury to
    the officer or others,” the officer can use deadly force to prevent an escape
    by the suspect, but otherwise cannot do so when such conditions otherwise do not
    exist. In short, this is a variant of the “allowed rarely if ever” and/or the
    “allowed in due course as merited” approaches, and decidedly is not the “never
    allowed” approach. Other relevant Supreme Court decisions include Graham v. Connor
    (1989), Plumhoff v. Rickard (2014), Mullenix v. Luma (2015), and other such cases,
    all of which further refined or reinforced the key characteristics associated
    with the “allowed” circumstances. Meanwhile, each of the states has at times opted
    to stipulate their own rules on the matter, presumably doing so in alignment with
    the overarching perspective rendered by the US Supreme Court. Notice that the
    states can opt to adopt a “never allowed” rule if they wish to do so. Furthermore,
    complicating the situation to some degree, there are approximately 18,000 law
    enforcement bodies throughout the US, and they too can stipulate their own rules,
    as long as they do so within the presumed bounds of their state rule and the US
    Supreme Court rulings. The result has been criticized as an unwieldy mishmash.
    Some police departments have adopted the “never allowed,” while others have adopted
    the “allowed” variants.  Plus, over time, there are police departments that have
    shifted in the adoption of the rules and gone from one of the approaches to another
    one of the approaches. This would seem to suggest that there are valid arguments
    to be made for whichever approach is chosen, though those within any particular
    approach are apt to strongly argue that theirs is the only truly valid approach
    and the others are plainly wrong. Some though are conflicted and opt for a given
    approach, hopeful that it is the “best” choice in hand, and yet are willing to
    reconsider based on how things bear out, having a willingness to be open to change
    if changing seems worthwhile. You might be wondering why there is such disparate
    opinion about the subject. Let’s do a brief dive into the matter and see. The
    Complexities Of Shooting At A Moving Vehicle Unlike what you might see in the
    movies, shooting at a moving vehicle is not a simple action. First, consider that
    a moving vehicle can be essentially a multi-ton deadly weapon in of itself. The
    vehicle can be used by a driver to rundown people, or smash into other cars, or
    ram into objects, etc. Second, the driver of the moving vehicle might themselves
    be armed directly with a deadly weapon, perhaps possessing a handgun or brandishing
    their firearm, possibly even firing the weapon at those outside the vehicle, or
    threatening to shoot someone else within the vehicle. In essence, there is a potential
    dual-threat, the threat of using the vehicle as a deadly weapon, and the threat
    potential of the driver being armed and using their weapon for deadly purposes
    too. Suppose a police officer is standing in front of the vehicle and it is being
    driven in such a way that the driver appears to be intending to run over the officer.
    Can the police officer use their firearm to try and shoot the driver? In theory,
    the shooting of the driver will prevent the driver from running down the officer.
    But, trying to shoot and hit a driver that is in a moving vehicle is not a sure
    thing, and again not akin to what you see in movies and TV shows. Some point out
    that the shots by the officer could hit and harm others inside the vehicle that
    might be either not bent on the apparent attempt to run over the officer or that
    are perhaps innocents that have been kidnapped essentially by the driver. The
    shots could also ricochet or miss entirely and hit innocent bystanders. Besides,
    even if the driver is hit by shots, the driver might still be able to drive the
    car, or they will be incapacitated and unable to drive, for which the car might
    then barrel out-of-control as a kind of now misguided weapon, perhaps running
    over bystanders, etc. Perhaps the officer should be shooting at the vehicle, attempting
    to disable the car, rather than shooting at the driver, since the car itself is
    a bigger target and more likely able to be struck. This is not quite as ready
    as a solution as you might assume. Conventional police firearms are not particularly
    likely to penetrate the vehicle sufficiently to somehow stop the engine or halt
    the car, and for those that think the tires should be shot out, it is much  harder
    to flatten today’s tires by a bullet than might seem to be portrayed in fictional
    films. As a counter-argument to the possibility of the officer’s bullets missing
    their intended target, those that are in the sometimes-allowed approach would
    likely say that if there is a chance to prevent the driver from otherwise killing
    or injuring people, it would seem a potentially worthwhile effort, and the situation
    at hand might in the balance save lives by the officer taking such actions. Generally,
    there are lots of probabilities and uncertainties involved. The “never allowed”
    perspective asserts that police officers should not be making those kinds of judgments
    and instead should consider taking some other action, but not be shooting at the
    vehicle. Indeed, there is some that question why an officer allowed themselves
    to get into a posture that the driver can viably threaten to run them down, or
    that the officer can merely jump out of the path of the vehicle. Others though
    counter-argue that it is not realistic to think that an officer would always be
    able to avoid getting caught in such a predicament, plus the viewpoint that the
    officer should just leap out of the way is exceedingly farfetched and not realistic.
    The scenario of the officer getting rundown is only one sliver of the circumstances
    that might arise for those that are in the sometimes-allowed viewpoint. Suppose
    the driver is steering toward the sidewalk and some pedestrians will likely get
    struck and rundown. In this case, the officer might not be in imminent danger,
    but those innocent bystanders are. Can the police officer use their firearm to
    try and shoot the driver? When presented with this type of an example, many would
    oftentimes find themselves struggling to remain in the never-allowed rule, since
    they see the tradeoff of having the officer shoot to try and prevent a larger
    potential set of deaths, even if it means that the shots fired by the officer
    go astray or do not end-up preventing the mayhem, at least an attempt was made
    and had a chance of curtailing the full extent of the injury and deaths that might
    have ensued. Notice too that these are usually life-or-death moments and must
    be acted upon in real-time, meaning that there is at times little or no time to
    consider all options and the uncertainties underlying them. Ironically, one supposes,
    this lack of time and sense of urgency can be used by either side of the argument,
    namely the never-allowed stating that a spur of the moment decision should not
    be permitted, while the sometimes-allowed would argue that it showcases the need
    for flexibility and reliance upon the officer in-the-moment making a crucial possibly
    life-saving decision. For any such situations whereby the officer might have acted
    in a life-saving manner, the never-allowed will typically counter-argue that this
    needs to be weighed against the instances of officers that miscomprehend the situation
    and make a wrongful choice, and also those instances in which “bad actor” officers
    opt to exploit the situation and make an intentionally aberrant choice that is
    intending for harm and was not warranted by the circumstances. So far, we’ve not
    yet considered herein the facet of a driver that is shooting while driving the
    vehicle, which would certainly tend to  up the ante on the use of dual deadly
    weapons. A slew of other considerations might come to play. Suppose the driver
    was known to have a criminal record that included the use of deadly force. Suppose
    the driver is smashing into other cars and threatening the lives of people in
    those other vehicles. Suppose a car chase is underway.  Some would argue that
    there is no need to undergo a car chase and just let the driver proceed, catching
    the driver at some future occasion, though the counter-argument is that the driver
    might be prone to harming others in the interim to whenever they might later be
    caught. Round and round the arguments go. Another twist that is a doozie involves
    the use of a car as a weapon of mass destruction (WMD). Suppose the car is jampacked
    with explosives. The driver might be seeking to use the car as more than a ramming
    device and be intending to cause a large amount of abhorrent destruction. Furthermore,
    it could be that the driver is willing to die in the act of doing so, being a
    suicide bomber, as it were. Can the police officer use their firearm to try and
    shoot the driver? This question overall about a police officer shooting at a moving
    vehicle is a daunting one and remains elusively unresolved by society. Self-Driving
    Cars As A New Case Shift gears and consider that we are gradually going to witness
    the advent of self-driving cars. Here’s an intriguing question: How will AI-based
    true self-driving cars alter our viewpoints about the act of a police officer
    shooting at a moving vehicle? Let’s unpack the matter and see. First, as clarification,
    true self-driving cars are ones that the AI drives the car entirely on its own
    and there isn’t any human assistance during the driving task. These driverless
    vehicles are considered a Level 4 and Level 5, while a car that requires a human
    driver to co-share the driving effort is usually considered at a Level 2 or Level
    3. The cars that co-share the driving task are described as being semi-autonomous,
    and typically contain a variety of automated add-on’s that are referred to as
    ADAS (Advanced Driver-Assistance Systems). There is not yet a true self-driving
    car at Level 5, which we don’t yet even know if this will be possible to achieve,
    and nor how long it will take to get there. Meanwhile, the Level 4 efforts are
    gradually trying to get some traction by undergoing very narrow and selective
    public roadway trials, though there is controversy over whether this testing should
    be allowed per se. Since semi-autonomous cars require a human driver, the adoption
    of those types of cars won’t be markedly different than driving conventional vehicles,
    so there’s not much new per se to cover about them on this topic (though, as you’ll
    see in a moment, the points next made are generally applicable). For semi-autonomous
    cars, it is important that the public needs to be forewarned about a disturbing
    aspect that’s been arising lately, namely that despite those human drivers that
    keep posting videos of themselves falling asleep at the wheel of a Level 2 or
    Level 3 car, we all need to avoid being misled into believing that the driver
    can take away their attention from the driving task while driving a semi-autonomous
    car. You are the responsible party for the driving actions of the vehicle, regardless
    of how much automation might be tossed into a Level 2 or Level 3. Self-Driving
    Cars And Shooting At A Moving Vehicle For Level 4 and Level 5 true self-driving
    vehicles, there won’t be a human driver involved in the driving task. All occupants
    will be passengers. The AI is doing the driving. Upon initial thought, you might
    assume that since there isn’t a human driver, there would never be a need to consider
    shooting at a self-driving car. Maybe yes, maybe no. Suppose that a passenger
    inside a self-driving car has a gun and is shooting at bystanders. Can the police
    officer use their firearm to try and shoot the passenger? It seems that we are
    not going to avoid the question, even when self-driving cars arrive. You could
    use the same arguments as before, asserting that the  officer’s shots might go
    astray, and thus you might still argue that the never-allowed is the right rule,
    or you might be in the sometimes-allowed perspective and indicate that if the
    circumstances seem applicable that the officer can go ahead and try to shoot the
    passenger, hopefully striking the passenger and stopping any subsequent carnage
    caused by the passenger using their weapon. Some would quickly offer that the
    AI ought to be told via electronic communication to drive the vehicle to a remote
    spot and thus prevent the shooting passenger from harming anyone. Well, that might
    work, but who will send such a directive, and meanwhile what about the passenger
    that is nonetheless still shooting at bystanders during that suggested journey?
    For more details about the controversies and tradeoffs in how to redirect or stop
    self-driving cars by authorities when perceived as so needed. Recall that earlier
    we had acknowledged that there is a dual weapon possibility, namely that the driver
    (now a passenger) could have a weapon, and likewise, the car itself could be used
    as a weapon. Does the advent of self-driving cars at least though obviate the
    concerns about the self-driving car itself being used as a deadly weapon? It might
    seem unthinkable that a self-driving car could somehow be used as a weapon in
    of itself. You would undoubtedly assume that the on-board AI system would be programmed
    to avoid hitting people and other cars, such that the AI would not allow the vehicle
    to be a weapon per se. One supposes that if an officer stood in front of a self-driving
    car, it would dutifully automatically come to a halt or otherwise avoid  hitting
    the officer, and therefore the car itself would no longer be actionable as a weapon.
    Numerous scenarios belie that simplicity. Suppose a self-driving car is going
    on the freeway at 65 miles per hour, there is a passenger shooting from within
    the vehicle, and it is known that the car is packed with explosives. The self-driving
    car is indeed now a weapon, though the AI is not aware of this. Note that today’s
    AI does not have any semblance of common-sense reasoning, it is not sentient,
    and the odds of the singularity happening anytime soon is slim at best, so do
    not assume that the AI driving system will be all-knowing. In short, the emergence
    of AI-based true self-driving cars is going to be encumbered by the same realities
    that we face today with conventional cars, though indubitably with a different
    set of twists and turns (including, for example, shooting at a self-driving car
    that has no passengers at all, which offers its own set of conundrums). Conclusion
    Most of the automakers and self-driving car tech firms would likely argue that
    this whole matter is an edge or corner case, meaning that it will rarely occur
    and does not need attention at this time, especially since they are immersed in
    just getting self-driving cars to drive in everyday circumstances safely. Unfortunately,
    the real-world will ultimately catch-up with the extraordinary innovation of self-driving
    cars, and we will collectively need to answer some troubling and difficult ethical
    questions. The advent of AI does not necessarily overcome tough ethical  dilemmas
    and without doubt, has the potential for bringing new ones to the forefront. '
  fmt: '

    # 第六章 警方向车辆开枪与AI自动驾驶汽车


    社会所面临的最具争议的警务话题之一，是执法人员是否应该向行驶中的车辆开枪。总体而言，对于这一沉重话题，似乎出现了三种主要观点。


    有人坚持认为这种行为永远不应被允许。特别强调的是，这意味着无论环境如何，警察永远不得向行驶中的车辆开枪，绝无例外。


    另一些人则表示，这种行为可以实施，但仅限于极少数情况，允许存在值得采取这种极端行动的特殊例外。


    还有人认为，这种行为可以在执法职责履行过程中进行，警官最终需要为其行为辩护，而试图规定一个狭窄的预先指定的可实施此类行动的范围，会不当地阻碍警官，使其生命面临过度风险，并可能同样使其他无辜者处于危险之中。


    简而言之，这三种主要立场可描述为：

    a) 永不允许

    b) 极少允许（甚至从不允许）

    c) 视情况允许


    ## “永不允许”视角的论据


    持“永不允许”观点者通常会辩称，一旦你接受另外两个选项作为考量对象，你就打开了潘多拉魔盒。对他们而言，这是一个严格的二元问题，答案要么是允许向行驶车辆开枪，要么是彻底禁止。一旦进展到“允许”的观点，“永不允许”派倾向于认为会出现大量实例，其中一些可能是真实的，但另一些则不是；与其冒着产生非真实实例的风险，不如彻底切断这一选项。实质上，“永不允许”之外被视为一条滑坡，因此主张完全不允许任何滑坡可能性，坚守“警官永远不得向行驶车辆开枪”这一原则。


    你可能最近在媒体上听到或看到过关于这一颇具争议和问题的激烈对话和尖锐辩论。近期关于警务的新闻报道有时会提到一项运动，旨在让警方采纳八项政策，称为“8 Can’t
    Wait”准则。该运动坚定的八条规则之一是，警官应在“所有情况下”被禁止向行驶车辆开枪，如果没有这种政策就会存在“漏洞”，因此向行驶车辆开枪应被“绝对禁止”。


    ## 法律现状


    你可能想知道法律目前对此类事项有何规定。总体而言，美国联邦法律和指南遵循几项相关最高法院裁决的建议，每项裁决最终都取决于对第四修正案的含义的理解。你可能记得第四修正案规定：

    > “人民的人身、住宅、文件和财产不受无理搜查和扣押的权利，不得侵犯。除非有合理根据，以宣誓或代誓宣言作保证，并详细说明搜查地点和扣押的人或物，不得发出搜查和扣押令。”


    在1985年`Tennessee v. Garner`案的最高法院裁决中，关于第四修正案的含义，法院判决：如果“警官有合理根据相信嫌疑人对警官或他人构成死亡或严重身体伤害的重大威胁”，警官可以使用致命武力防止嫌疑人逃跑，但如果不存在这些条件，则不得如此做。简而言之，这是“极少允许”和/或“视情况允许”方法的一种变体，绝不是“永不允许”的方法。


    其他相关的最高法院判决还包括`Graham v. Connor` (1989)、`Plumhoff v. Rickard` (2014)、`Mullenix
    v. Luma` (2015) 等案件，这些案件进一步细化或强化了与“允许”情况相关的关键特征。


    同时，各州有时会选择规定自己的规则，推测是与美国最高法院作出的总体观点保持一致。请注意，各州如果愿意，可以选择采纳“永不允许”规则。


    此外，使情况在一定程度上复杂化的是，美国约有18,000个执法机构，它们也可以规定自己的规则，只要在其州规则和美国最高法院裁决的推定范围内即可。结果被批评为笨重的大杂烩。一些警局采纳了“永不允许”，而另一些则采纳了“允许”变体。此外，随着时间的推移，一些警局已经改变了规则的采纳，从一种方法转向另一种方法。这似乎表明，无论选择哪种方法，都有合理的论据，尽管身处特定方法中的人倾向于强烈辩称他们的方法是唯一真正有效的，而其他方法显然是错误的。一些人虽然矛盾，但选择了某种方法，希望这是手头“最佳”的选择，但愿意根据事态发展重新考虑，如果改变似乎值得，则持开放态度。


    ## 向行驶车辆开枪的复杂性


    你可能想知道为何对此主题存在如此不同的意见。让我们简要深入探讨此事。


    与电影中看到的不同，向行驶车辆开枪并非简单行动。


    首先，考虑到行驶车辆本质上可以是一种多吨重的致命武器。车辆可被驾驶员用来撞倒人群，或撞向其他车辆，或冲撞物体等。


    其次，行驶车辆的驾驶员本身可能直接持有致命武器，或许持有手枪或挥舞枪支，甚至可能向车外人员开枪，或威胁射击车内其他人。实质上，存在潜在的双重威胁：利用车辆作为致命武器的威胁，以及驾驶员持械并为致命目的使用武器的威胁。


    假设一名警察站在车辆前方，车辆以一种显示驾驶员意图撞倒警官的方式行驶。警察能否使用枪支尝试射击驾驶员？理论上，射击驾驶员将阻止其撞倒警官。但试图射中行驶车辆中的驾驶员并非稳操胜券，这同样不像电影和电视剧中那样。


    有人指出，警官的子弹可能击中并伤害车内其他人，他们可能并非意图撞倒警官，或者实质上是被驾驶员绑架的无辜者。子弹也可能跳弹或完全偏离，击中无辜旁观者。此外，即使驾驶员中弹，驾驶员可能仍能驾驶汽车，或因丧失能力无法驾驶，导致汽车失控成为一种误导性武器，可能撞倒旁观者等。


    或许警官应该向车辆射击，试图使汽车失能，而不是射击驾驶员，因为汽车本身是更大的目标，更容易击中。这并不像你想象的那样是一个现成的解决方案。常规警用枪支不太可能充分穿透车辆以以某种方式停止发动机或制止汽车，至于那些认为应该射爆轮胎的人，用子弹击瘪现代轮胎比电影中描绘的要难得多。


    作为对警官子弹可能偏离预定目标这一可能性的反驳论点，持“有时允许”观点的人可能会说，如果有机会阻止驾驶员杀害或伤害他人，这似乎是一种潜在值得的努力，手头的情况在权衡下可能通过警官采取此类行动来挽救生命。总体而言，涉及大量概率和不确定性。


    “永不允许”视角断言，警察不应做出这类判断，而应考虑采取其他行动，但不得向车辆开枪。确实，有人质疑为何警官允许自己陷入驾驶员可行地威胁撞倒他们的姿态，或者警官仅能跳出车辆路径。另一些人则反驳认为，认为警官总能避免陷入这种困境是不现实的，而且“警官只需跳开”这一观点极其牵强且不现实。


    警官被撞倒的场景只是“有时允许”观点可能出现的情况的一个切片。假设驾驶员驶向人行道，一些行人可能会被撞倒。在这种情况下，警官可能不处于迫在眉睫的危险中，但那些无辜旁观者处于危险中。警察能否使用枪支尝试射击驾驶员？当面对这类例子时，许多人往往发现自己难以坚持“永不允许”规则，因为他们看到了权衡：让警官开枪试图防止更大规模的潜在死亡，即使警官发射的子弹偏离目标或最终未能阻止混乱，至少尝试了并有机会遏制可能随之而来的伤害和死亡的全部程度。


    还要注意，这些通常是生死攸关的时刻，必须实时采取行动，这意味着有时几乎没有时间考虑所有选项及其潜在的不确定性。具有讽刺意味的是，这种时间缺乏和紧迫感可以被辩论双方利用：即“永不允许”派主张瞬间决定不应被允许，而“有时允许”派则辩称这展示了对灵活性和依赖警官当下做出关键可能挽救生命决定的需求。


    对于警官可能以挽救生命方式行事的任何此类情况，“永不允许”派通常会反驳辩称，这需要与警官误解情况并做出错误选择的实例，以及“恶意行为者”警官选择利用局势并做出意图伤害且情节不支持的故意异常选择的实例进行权衡。


    到目前为止，我们尚未考虑驾驶员在驾驶车辆时开枪这一层面，这肯定会增加双重致命武器使用的筹码。大量其他考量因素可能发挥作用。假设驾驶员有使用致命武力的犯罪记录。假设驾驶员撞击其他车辆并威胁那些车内人员的生命。假设正在进行车辆追逐。一些人会辩称无需进行车辆追逐，只让驾驶员继续行驶，在未来某个时机抓捕驾驶员，尽管反驳论点是驾驶员在被抓获前的这段时间内可能倾向于伤害他人。论点循环往复。


    另一个棘手的转折涉及将汽车作为大规模杀伤性武器（WMD）使用。假设汽车塞满了炸药。驾驶员可能寻求将汽车不仅用作撞击装置，而是意图造成大量可怕的破坏。此外，驾驶员可能愿意在实施过程中死亡，成为自杀式炸弹袭击者。警察能否使用枪支尝试射击驾驶员？


    关于警察向行驶车辆开枪的总体问题是一个令人生畏的问题，至今仍未被社会彻底解决。


    ## 自动驾驶汽车作为新案例


    转换话题，考虑到我们将逐渐见证自动驾驶汽车的到来。这是一个引人入胜的问题：基于AI的真正自动驾驶汽车将如何改变我们对警察向行驶车辆开枪这一行为的看法？让我们拆解此事。


    首先，作为澄清，真正的自动驾驶汽车是指AI完全自主驾驶汽车，在驾驶任务中没有任何人类协助。这些无人驾驶车辆被视为Level 4和Level 5，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为Level
    2或Level 3。共享驾驶任务的汽车被描述为半自动驾驶，通常包含各种自动化附加功能，称为`ADAS`（高级驾驶辅助系统）。目前尚无Level 5的真正自动驾驶汽车，我们甚至不知道这是否可能实现，也不需要多久才能达到。同时，Level
    4的努力正在通过进行非常狭窄和选择性的公共道路试验逐渐获得一些进展，尽管关于是否应允许这种测试本身存在争议。


    由于半自动驾驶汽车需要人类驾驶员，采用这些类型的汽车不会与驾驶传统车辆有显著不同，因此在这方面没有太多新内容可讲（尽管，正如你稍后将看到的，接下来的观点通常适用）。


    对于半自动驾驶汽车，重要的是公众需要被预先警告关于最近出现的一个令人不安的方面，即尽管那些人类驾驶员不断发布自己在Level 2或Level 3汽车方向盘前睡着的视频，我们都需要避免被误导，认为驾驶员在驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论Level
    2或Level 3投入多少自动化，你都是车辆驾驶行为的责任方。


    ## 自动驾驶汽车与向行驶车辆开枪


    对于Level 4和Level 5真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘客将是乘客。AI正在驾驶。


    乍一看，你可能会假设既然没有人类驾驶员，就永远不需要考虑向自动驾驶汽车开枪。也许是，也许不是。


    假设自动驾驶汽车内的一名乘客持枪向旁观者射击。警察能否使用枪支尝试射击该乘客？看来即使自动驾驶汽车到来，我们也无法回避这个问题。你可以使用之前相同的论点，断言警官的子弹可能偏离目标，因此你可能仍会辩称“永不允许”是正确规则，或者你可能持“有时允许”观点，指出如果情况似乎适用，警官可以继续尝试射击乘客，希望击中乘客并阻止乘客使用武器造成的后续惨剧。


    有人会迅速提出，应通过电子通信指示AI将车辆驶向偏远地点，从而防止射击乘客伤害任何人。这可能行得通，但谁将发送此指令，而在建议的行程期间，仍在向旁观者射击的乘客怎么办？


    关于当局在认为必要时如何重定向或停止自动驾驶汽车的争议和权衡的更多细节。


    回顾一下，我们之前承认存在双重武器的可能性，即驾驶员（现在是乘客）可能有武器，同样，汽车本身也可被用作武器。自动驾驶汽车的出现至少是否消除了关于自动驾驶汽车本身被用作致命武器的担忧？


    你可能会认为自动驾驶汽车以某种方式被用作武器是不可想象的。你无疑会假设车载AI系统会被编程为避免撞击人员和其他车辆，因此AI不会允许车辆本身成为武器。人们推测，如果警官站在自动驾驶汽车前，它会忠实地自动停下或以其他方式避免撞击警官，因此汽车本身将不再可作为武器。


    许多场景揭穿了这种简单性。


    假设一辆自动驾驶汽车以每小时65英里的速度在高速公路上行驶，车内有乘客在射击，且已知汽车装满了炸药。这辆自动驾驶汽车确实现在是一种武器，尽管AI并不知情。请注意，当今的AI不具备任何常识推理的雏形，它没有知觉，奇点发生的几率充其量很小，所以不要假设AI驾驶系统将是全知的。


    简而言之，基于AI的真正自动驾驶汽车的出现将受到我们今天面对传统汽车时相同现实的阻碍，尽管无疑会有不同的曲折（例如，向一辆完全没有乘客的自动驾驶汽车开枪，这提供了自己的一套难题）。


    ## 结论


    大多数汽车制造商和自动驾驶汽车技术公司可能会辩称，这整个问题是一个边缘情况或极端情况，意味着它很少发生，目前不需要关注，特别是因为他们沉浸在仅让自动驾驶汽车在日常情况下安全驾驶中。不幸的是，现实世界最终将追上自动驾驶汽车这一非凡创新，我们将共同需要回答一些棘手和困难的伦理问题。AI的出现不一定能克服艰难的伦理困境，毫无疑问，它有可能将新的困境推向前台。

    '
