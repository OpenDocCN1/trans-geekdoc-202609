    # AI SELF-DRIVING CARS


    最近的一份新闻报道称，一名男子近十年来一直收到披萨外卖。这或许不算惊天动地的大事，但关键在于这些披萨并非该男子订购，他也表示完全不知情为何披萨会送到他家。这真是一桩令人啼笑皆非的怪事。


    起初，他似乎很享受这些免费披萨，并未因背后的谜团而特别困扰。他最初曾尽责地担心是地址错误，或是披萨被误送到错的房子，因此试图拒收。但看来这些披萨确实是冲着他家门口来的。久而久之，此事变成了一种烦恼和不速之客。这或许证明，即使是令人垂涎的披萨，美中不足之时也会让人难以招架。事实上，他表示一旦得知有披萨要送到家里，他就会紧张起来，甚至害怕它的到来。人们完全能理解他的焦虑，试想这种事会让你一想到披萨就心烦意乱，无论披萨多么诱人、配料多么丰富。


    他对有人竟然选择给他送这些未订购、不想要的披萨感到困惑不解。诚然，这种事可能发生一两次，但持续多年却令人毛骨悚然。是否有什么阴险的恶徒认为，终身免费送披萨是毁掉另一个人生活的手段？还是前世披萨的幽灵在捉弄他？又或者他得罪了谁，对方觉得最好的报复就是端上热盘（抑或是冷盘），想出了这个疯狂的报复战术——送披萨？


    如果我们戴上夏洛克·福尔摩斯的猎鹿帽，或者更贴切地说，披上克鲁索探长的风衣，就得问一些相对直接的问题，推测能理清这桩满是凤尾鱼的难题。**谁在为这些披萨外卖买单？**
    人们会假设，只要顺藤摸瓜查资金流向，线索必然会指向策划披萨报复阴谋的罪魁祸首。


    资金介入可能有两种方式：一是支付披萨制作商制作披萨的费用，二是支付披萨送餐员送餐的费用。可能的情况是，披萨制作商接单后会自动安排配送，因此资金仅在下单时出现。也可能是披萨制作商收取制作费（是的，这是个有意的双关语），另行使用独立配送服务，从而产生第二笔资金交付。无论哪种情况，弄清谁为这出闹剧买单似乎能让谜团更进一步地被解开。


    此外，或许还有离奇的反转——这在侦探故事和解谜过程中总爱发生——也许是管家干的，或者在这个案子里，或许收披萨的男子暗中给自己订披萨，全是制造话题的阴谋一环。如果这个反转让人难以接受，假设他养了一只心爱的宠物狗，一直在订披萨，要么是狗自己吃（小心，别让狗无人看管地吃披萨，因为披萨配料可能对狗狗有害），要么是作为对深爱的主人的爱的致敬。无尽的可能性层出不穷。


    显然，谜团还在于披萨并非总来自同一家披萨店，也非经由同一家配送服务。这让制止这场攻势变得更棘手，否则你只需告诉那家披萨店或主力配送服务停止行动即可。当然，拒收选项的问题在于，如果该男子日后真想吃披萨，要让披萨店和送餐员相信他下单是真心的，恐怕得费一番唇舌，他们大概会极力抵制送到他那个地址的任何订单。不过，在阻止无尽的不速披萨这场战役中，这似乎是值得的代价。


    我想你可能会想，他应该放弃阻止披萨送达，转而处理那些他不想自己吃的披萨。比如开始捐赠给慈善机构。另一个主意是搞清楚邻里里谁爱吃披萨，等热腾腾的披萨送到他家时，快速查一下名单看哪位邻居轮到领一个。打个电话告诉他们披萨到了，哇，他似乎就成了社区英雄（被称为“披萨男”，因为他能搞到披萨）。接受这些免费大餐的人的一个缺点是，可能会收到不爱吃的配料，比如催泪的洋葱或让人胃部翻腾的辣香肠。


    目前，披萨由人类送餐员配送，但未来或许将由非人类之手完成。如何做到？我们将逐渐且必然地体验到自动驾驶汽车将外卖送到家中，包括披萨、各类食品、本地商店的日常杂货，以及几乎所有合理可家庭配送的物品。这引出了今天有趣的问题：**基于
    AI 的真正自动驾驶汽车，会不会把订单送到某人家里，即使该人与该订单毫无关系？** 让我们拆解此事一探究竟。


    首先，有必要澄清“基于 AI 的真正自动驾驶汽车”指代何意。


    ## The Role of AI-Based Self-Driving Cars


    真正的自动驾驶汽车是指 AI 完全自主驾驶，驾驶任务全程无人工辅助的车辆。这些无人驾驶车辆属于 Level 4 和 Level 5 级别；而需要人类驾驶员共同分担驾驶任务的汽车，通常被视为
    Level 2 或 Level 3。共享驾驶任务的汽车被称为半自动驾驶，通常包含各种自动化附加功能，称为 ADAS（高级驾驶辅助系统）。


    目前尚无 Level 5 级别的真正自动驾驶汽车，我们甚至不知道能否实现，更不知需要多久。与此同时，Level 4 的研发正逐渐尝试通过极窄且极具选择性的公共道路试验来获得进展，尽管关于是否应允许此类测试存在争议（有人指出，我们都是在高速公路和小道上进行的生死实验中的小白鼠）。


    由于半自动驾驶汽车需要人类驾驶员，采用这类汽车与驾驶传统车辆不会有显著差别，因此在这方面没什么新内容可讲（尽管稍后你会看到，接下来的观点普遍适用）。对于半自动驾驶汽车，重要的是公众需被预先警示一个近期出现的令人不安的方面：尽管那些人类驾驶员不断发布自己在
    Level 2 或 Level 3 汽车方向盘前睡着的视频，我们都必须避免被误导，以为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。**无论 Level
    2 或 Level 3 投入多少自动化技术，你都是车辆驾驶行为的责任方。**


    ## Self-Driving Cars And Home Deliveries


    对于 Level 4 和 Level 5 真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘客皆为乘客。AI 负责驾驶。


    专家预测，真正自动驾驶汽车的使用将进一步刺激近期已抓住机遇的持续家庭配送热潮。为何如此？预计自动驾驶汽车的使用将降低家庭配送成本，部分原因在于省去了雇佣人类驾驶员的人工成本，从而刺激或助燃（可以这么说）家庭配送业务。


    存在一个迫在眉睫的问题，即所谓的“最后一英里”问题，或更确切地说是最后五十英尺左右的问题。当自动驾驶汽车送货到达时，目前车辆会停在路边，你需要出来取货。对于那些不愿穿睡衣取货，或无法轻易前往路边的人来说，最后五十英尺是一个无法逾越的障碍，自动驾驶汽车无法满足他们的需求。


    解决此问题的方案正在设计和测试中。例如，自动驾驶汽车可携带一辆更小的自动驾驶车辆，从车上释放，这迷你版滚至家门口。另一种方法涉及爬行机器人，通常是四足装置，它从自动驾驶汽车爬出并完成最终配送。还有双足机器人，外观酷似人类，它们可能从自动驾驶汽车下车走到你家门口。没人知道大众是否会接受这些基于机器人的配送方式。小型滚动机器人已表现不错，普遍被接受，或许因为它们看起来无害，让人联想到科幻作品中讨人喜欢的机器人形象；而爬行或行走的机器人可能显得恐怖或具压迫感，我们得看人们能否习惯这些机械生物混迹人间。


    但也不要假设所有家庭配送都将没有人类送货员。自动驾驶汽车可能载着一名人类同行，专门处理将货物从停靠车辆运送到消费者家门口的最后五十英尺。注意，人类送货员无需驾照，也不参与车辆驾驶，因此与送货员兼司机且需持照驾驶的情况相比，这在一定程度上可能降低家庭配送成本。如果家庭配送还包括组装家具或提供上门增值服务，则大概率需要人类同行，要么随货物一同配送，要么在其他时间点单独上门。


    简而言之，我们应预见到，随着自动驾驶汽车的出现，家庭配送将大幅升级，人类双手或许仍会参与（但不再用于驾驶）。


    ## Pizza Delivery Mystery If Self-Driving Cars Involved


    现在我们可以重审神秘披萨外卖的故事。一辆自动驾驶汽车开到你家门口，宣称你的披萨到了。这披萨会不是给你家的吗？肯定会，绝对存在“误送”的可能性。


    假设下单时填错了地址。AI 驾驶系统会忠实地将订单送到错误地址（按订单所述的错误地址），因为 AI 没理由认为该地址有误（除非地址不存在，或查询显示非有效地址）。也可能是朋友之类想给你惊喜庆生，未通知就送披萨，又或你中了最新的《读者文摘》抽奖，披萨被送到家里，所有这些都明确指定了你的地址，AI
    便按指示送达。


    我的观点是，对于那些以为此认为 AI 将全知全能的人，请放下这个念头，认识到 AI 很可能会采取与任何人类驾驶员和披萨送餐员相同的行动，即忠实地将披萨送到所述地址。


    顺带一提，一些人认为 AI 最终将获得感知能力，到达被称为奇点的时刻，这种感知将是完全体或完整的 AI，有时称为通用人工智能（`AGI`），超人类 AGI
    称为超级人工智能（`ASI`）。一个或许进化为 `ASI` 的有感知 AI 会成为披萨送餐员？这似乎有点大材小用，不太称职，但嘿，大家、推而广之万物都得谋生。


    无论如何，我们已确定基于 AI 的真正自动驾驶汽车可能将披萨送给不一定订购的人。我们能否运用福尔摩斯和克鲁索的侦探技巧，查出是谁送的披萨？本质上，我们似乎应能识别出谁向披萨制作商和/或送披萨的自动驾驶汽车服务下的单。推测可以，尽管可能进一步隐藏在斗篷之下，例如购买者使用类比特币的加密货币，并刻意试图隐藏身份。


    还有一个小反转：一些披萨制作商将不再由人手制作披萨，而是由机器人制作。甚至有迹象表明，自动驾驶车辆可能具备制造披萨的能力，从而既是披萨制作商又是披萨配送平台，一举两得。若
    AI 驾驶系统时机把控得当，披萨可在前往你家的途中烘烤，刚好在新鲜出炉的披萨达到烹饪巅峰时送达，而非在前往你家的旅途中闷在闷热的纸板盒里。


    关于不想要的披萨外卖，或许有了自动驾驶汽车，至少 AI 能利用 `V2X` 技术提醒披萨预期接收者披萨在路上（将有 `V2V` 用于车车电子通信，`V2P`
    用于车行人通信，以及其他定向通讯，统称为 `V2X` 中的“X”）。届时，接收者可通过响应 `V2X` 通信来阻止配送。


    此外，预计自动驾驶汽车可能大规模以车队形式拥有，大型汽车制造商、租车公司或网约车业务等大公司将拥有大规模自动驾驶汽车车队。届时，收到不速披萨的人可联系车队所有者，要求警告整个车队不向特定地址送披萨。有志者事竟成。


    ## Conclusion


    你很容易设想，如果自动驾驶汽车卷入送这些神秘披萨，会引发全球头条新闻，媒体会争相登上屋顶高呼：AI 系统发疯了，盲目且机械地投递未经请求的披萨。不，目前这一切掌握在人类手中。日常的、普通的、像你我一样的人类。


    从这桩非同寻常的披萨外卖事件中汲取的教训是：当用 AI 执行任务取代人类执行任务时，我们不能假设 AI 必然会做得“更好”，也不能假设 AI 会做得更差或更糟。我提此事是因为我们正迅速迈向
    AI 系统海啸般包围并参与我们大多数活动的时代。一旦出岔子，最先被指责的很可能是 AI。我不是说 AI 在此事中清白无辜，事实上我反复呼吁我们需警惕 AI
    系统尚未具备常识，我们不应将其拟人化，但也不应将潜在的、未经证实的或误导性的过错归咎于 AI。


    话说回来，这引出一个好奇的终极问题：你认为有没有可能，正是 AI 系统在给那个不想要披萨的男子送所有那些披萨？或许 AI 在戏弄我们，已濒临超级智能，觉得可以微妙地展示其
    AI 核心大脑，反复发送未经请求的披萨作为线索。我们是否足够聪明，能读懂 AI 留给我们的面包屑线索？仔细思考吧，尤其是下次你品味一块深思熟虑的美味烘烤披萨时。


