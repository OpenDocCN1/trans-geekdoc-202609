  \n\n\n\n\n# 第一章 埃利奥特 AI 自动驾驶汽车框架\n\n本章是理解 AI 自动驾驶汽车的核心基础内容，我已在其他几本书中使用过同一章节，以向读者介绍该领域的基本要素。读完本章后，您将为阅读后续内容做好准备，因为自主\
  \ AI 无人驾驶汽车各组件的基础本质已为您建立。\n\n---\n\n当我就自动驾驶汽车进行演讲并讲授相关课程时，我发现提供一个框架非常有帮助，围绕该框架可以理解和组织自动驾驶汽车的各个关键要素（请见本章末尾的图表）。该框架需要足够简单以传达总体要素，但同时又不能过于简单以至于掩盖了自动驾驶汽车的真实复杂性。因此，我将在此描述该框架，并试图用一千多个词来阐述框架图表本身意在描绘的内容。\n\
  \n图表上的核心要素已编号，以便参考。编号不代表要素的任何优先级。每个要素都至关重要。每个要素都有其目的，否则不会被纳入框架。对于某些自动驾驶汽车，特定要素可能比其他自动驾驶汽车更重要，或以某种方式有所区别。您甚至可以使用该框架对特定自动驾驶汽车进行评级，方法是衡量其在框架各要素中的表现如何。我将逐一描述各个要素。\n\
  \n随后，我将讨论说明各要素在自动驾驶汽车整体工作过程中如何交互和执行的方面。在 AI 自动驾驶汽车研究所，我们使用该框架来跟踪我们的工作内容，以及我们如何开发软件以填补实现\
  \ L5 级自动驾驶汽车所需的空白。\n\n## D-01：传感器捕获\n\n让我们从媒体关于自动驾驶汽车报道中最受关注的要素开始，即自动驾驶汽车的感官设备。在框架上，标记为\
  \ `D-01` 的方框表示“传感器捕获”，是指自动驾驶汽车从用于自动驾驶的无数传感器收集数据的过程。\n\n通常涉及的设备类型已列出，例如单目摄像头、双目摄像头、激光雷达设备、雷达系统、超声波设备、GPS、IMU\
  \ 等。这些设备的任务是获取关于自动驾驶汽车状态及其周围世界的数据。某些设备持续提供更新，而其他设备则等待自动驾驶汽车的指示以收集数据。数据可能首先由设备本身以某种方式转换，或者可能作为原始数据直接馈送到传感器捕获模块。此时，可能由传感器捕获进程对数据进行转换。所有这些均取决于所用设备的性质，以及设备的设计和开发方式。\n\
  \n## D-02：传感器融合\n\n想象一下，您的眼球接收视觉图像，鼻子接收气味，耳朵接收声音，本质上您的每个不同感官设备都在获取某种形式的输入。输入适合设备的性质。同样，对于自动驾驶汽车，摄像头提供视觉图像，雷达返回雷达反射，以此类推。每个设备提供适合其功能的数据。\n\
  \n在某个时刻，借用人类的类比，您需要将眼睛所见、鼻子所闻、耳朵所闻融合在一起，拼凑成一个更大的图景，了解世界的全貌以及周围发生的事情。传感器融合就是将来自各个设备的单一侧面拼凑成一个更大拼图的过程。\n\
  \n传感器融合是一项艰巨的任务。某些设备在传感器捕获时可能未工作。或者，某些设备可能无法很好地报告其检测到的内容。再次使用人类类比，假设您身处暗室，眼睛几乎看不见东西。此时，您可能需要更多地依赖耳朵和听觉。自动驾驶汽车也是如此。如果摄像头因风雪而被遮挡，雷达可能能更多地指示外部环境状况。\n\
  \n在自动驾驶汽车的情况下，可能存在大量此类感官设备。每个设备报告其能检测到的内容。每个设备可能都有其困难。每个设备可能都有其局限性，例如能向前探测物体的距离。所有这些局限性都需要在传感器融合任务中予以考虑。\n\
  \n## D-03：虚拟世界模型\n\n对于人类，当我们驾驶汽车时，大脑中推测保存着周围世界的模型。在您的脑海中，您知道汽车以每小时 60 英里的速度行驶在高速公路上。您脑海中有一个模型：您的车被其他车包围，高速公路有车道。您的模型不仅基于您所能看见、听到等，还基于您对世界本质的了解。您知道前车随时可能猛踩刹车，后车可能追尾您的车，或旁边车道的卡车可能突然变道冲入您的车道。\n\
  \n自动驾驶汽车的 AI 需要一个虚拟世界模型，并利用从传感器融合接收到的任何信息（后者从传感器捕获和感官设备获取输入）保持该模型更新。\n\n## D-04：系统行动计划\n\
  \n通过拥有虚拟世界模型，自动驾驶汽车的 AI 能够跟踪汽车的位置及周围发生的情况。此外，AI 需要确定下一步做什么。自动驾驶汽车应该猛踩刹车吗？应该留在当前车道还是向左变道？应该加速还是减速？\n\
  \n自动驾驶汽车的 AI 需要制定系统行动计划。行动计划指定应采取的行动。行动需与虚拟世界模型的状态相关。此外，行动必须是可实现的。这种可实现性意味着 AI 不能仅断言自动驾驶汽车应突然长出翅膀飞行。相反，AI\
  \ 必须受限于自动驾驶汽车实际能做的事情，例如以 Y 英里/小时的速度在 X 英尺距离内停车，而不是断言自动驾驶汽车在 0 英尺内停车，仿佛它能在运动中瞬间停下。\n\
  \n## D-05：控制激活\n\n系统行动计划通过激活汽车控制装置来实施，使其按计划规定行事。这可能意味着指令加速器控制装置提高车速。或者，指令转向控制装置将方向盘向左或向右转动\
  \ 30 度。\n\n一个问题是控制装置是否按指令响应。换句话说，假设 AI 指令加速器增加油门，但由于某些原因它没有执行。或者，它可能试图执行，但车速并未增加。控制激活会反馈到虚拟世界模型，同时虚拟世界模型正从传感器、传感器捕获和传感器融合获取更新。这使\
  \ AI 能够确认控制装置被指令采取某种行动后所发生的情况。\n\n顺便说一句，请记住，尽管图表似乎呈线性进展，但现实是这些都是自动驾驶汽车并行且同时发生的各个方面。传感器正在捕获数据，同时传感器融合正在进行，同时虚拟模型正在更新，同时系统行动计划正在制定和重新制定，同时控制装置正在被激活。\n\
  \n这与人类驾驶汽车相同。他们注视道路，同时在脑海中融合视觉、听觉等，同时大脑更新周围世界的模型，同时制定行动计划，同时脚踩踏板、手握方向盘控制汽车。在正常驾驶过程中，您是在同时做所有这些事情。\n\
  \n我提到这一点是为了让您在看图表时，将方框视为同时发生的进程，而不是先发生一个然后再发生下一个。它们以简化的方式在图表中展示，以帮助理解正在发生的事情。但您也应意识到它们正在并行且同时相互配合工作。这是一个棘手的方面，因为要素间通信涉及延迟和其他必须考虑的因素。一个要素更新并与其他要素共享其最新状态时可能会有延迟。\n\
  \n## D-06：汽车与 CAN\n\n现代汽车使用各种汽车电子设备和控制器局域网（`CAN`）作为支撑汽车驾驶各方面的组件。有电子控制单元（`ECU`），控制汽车的子系统，如发动机、刹车、车门、车窗等。要素\
  \ `D-01`、`D-02`、`D-03`、`D-04`、`D-05` 分层在 `D-06` 之上，且必须了解 `D-06` 能做什么和不能做什么。\n\n\
  ## D-07：车内指令\n\n人类将成为自动驾驶汽车的乘员。在 L5 级自动驾驶汽车中，必须存在人类与自动驾驶汽车之间某种形式的通信。例如，我进入一辆自动驾驶汽车并告诉它，我想去迪士尼乐园，途中想在\
  \ In-and-Out Burger 停留。自动驾驶汽车现在解析我的话，并尝试建立一种方式来执行我的意愿。\n\n车内指令可在驾驶旅程的任何时候发生。虽然我的例子是关于我刚上车时的车内指令，但也可能在自动驾驶汽车执行旅程途中我改变主意。也许陷入交通拥堵后，我让自动驾驶汽车别去买汉堡了，直接去主题公园。自动驾驶汽车需要在整个旅程中时刻留意车内指令。\n\
  \n## D-08：V2X 通信\n\n最终，我们将拥有相互通信的自动驾驶汽车，通过 V2V（车车通信）实现。我们还将拥有与道路及其他交通基础设施通信的自动驾驶汽车，通过\
  \ V2I（车路通信）实现。自动驾驶汽车与其他汽车及基础设施通信的多种方式被称为 V2X，其中字母 X 代表我们确定的汽车应该或想要与之通信的任何其他事物。\n\
  \nV2X 通信将与图表上的其他一切同时进行，那些其他要素需要融合从 V2X 通信中获取的任何信息。\n\n## D-09：深度学习\n\n深度学习的应用渗透到自动驾驶汽车的所有其他方面。自动驾驶汽车的\
  \ AI 将使用深度学习，在系统行动计划、控制激活、传感器融合等方面做得更好。目前，人工神经网络的使用是深度学习最普遍的形式。基于大量数据，神经网络试图从数据中“学习”，从而相应地指导自动驾驶汽车的工作。\n\
  \n## D-10：战术 AI\n\n战术 AI 是处理自动驾驶汽车瞬时驾驶的要素。自动驾驶汽车是否保持在高速公路车道内？汽车是否对控制指令做出适当响应？感官设备是否正常工作？对于人类驾驶员，战术等价物可以在观察新手驾驶员（如初学开车的青少年）时看到。他们专注于驾驶任务的机械操作，注视道路的同时也试图妥善控制车辆。\n\
  \n## D-11：战略 AI\n\n自动驾驶汽车的战略 AI 方面处理自动驾驶汽车试图实现的更大蓝图。如果我要求自动驾驶汽车送我去迪士尼乐园，则需要保持和维护一张整体行程地图。战略\
  \ AI 与战术 AI 之间存在交互。战略 AI 想要坚持驾驶任务，而战术 AI 专注于驾驶过程中的具体细节。\n\n如果战术 AI 似乎偏离了总体任务，战略\
  \ AI 想知道原因并使事情回到正轨。如果战术 AI 意识到自动驾驶汽车有问题，它需要相应地警报战略 AI，并对正在进行的总体任务进行调整。\n\n## D-12：自我感知\
  \ AI\n\n极少有正在开发的自动驾驶汽车包含自我感知 AI 要素，但我们赛博网自动驾驶汽车研究所认为这对 L5 级自动驾驶汽车至关重要。自我感知 AI 要素旨在监督自身，即\
  \ AI 确保 AI 按预期工作。\n\n假设有人类驾驶汽车，且开始驾驶不稳。希望他们自身的自我感知能让他们意识到自己驾驶不佳，例如在连续驾驶数小时后开始打瞌睡。如果车上有乘客，当驾驶员开始出现异常时，乘客可能会提醒驾驶员。这正是自我感知\
  \ AI 要素试图做的，它成为 AI 的监督者，试图检测 AI 何时出现故障或混淆，然后寻找克服问题的方法。\n\n## D-13：经济性\n\n自动驾驶汽车的经济方面本身并非自动驾驶汽车的技术方面，但经济性确实影响自动驾驶汽车的性质。例如，为自动驾驶汽车配备每一种可能的感官设备成本高得令人望而却步，因此需要选择使用哪些设备。对于所选的感官设备，是拥有全套功能还是更有限的功能集。\n\
  \n我们将拥有处于消费者低成本端的自动驾驶汽车，也有处于高成本端的自动驾驶汽车。您不能指望低端自动驾驶汽车像高端那样强健。我意识到许多自动驾驶汽车专家表现得好像所有自动驾驶汽车都将相同，但事实并非如此。就像其他事物一样，我们将拥有能力各异的自动驾驶汽车。有些会比其他的好。有些会比其他的安全。这是现实世界的方式，因此我们在考虑自动驾驶汽车的性质时，需要考虑经济方面。\n\
  \n## D-14：社会性\n\n该组件涵盖 AI 的社会层面，这也影响自动驾驶汽车技术。例如，著名的“电车难题”涉及自动驾驶汽车在面临生死抉择时应如何选择。如果自动驾驶汽车即将撞上站在道路上的儿童，或者冲向路边的树并可能杀死车内人员，应做哪种选择？\n\
  \n我们需要记住，社会层面将成为自动驾驶汽车 AI 的基础。无论我们是否显性意识到，AI 都将内嵌各种社会假设。\n\n## D-15：创新\n\n我将创新概念纳入框架，因为我们可以预见，无论自动驾驶汽车由什么组成，它将随着时间的推移持续创新。未来几年推出的自动驾驶汽车无疑将不同于十年后推出的版本，后者将更具创新性，以此类推。\n\
  \n## 框架总览\n\n对于想了解自动驾驶汽车的人，您可以潜在地选择特定要素并成为该方面的专家。一些工程师专注于感官设备。一些工程师专注于控制激活。以此类推。每个要素都有其专业领域。\n\
  \n研究人员同样在各个方面进行专业化。例如，一些研究人员使用深度学习研究如何最好地用于传感器融合。其他研究人员使用深度学习推导良好的系统行动计划。一些人研究如何开发用于驾驶任务战略层面的\
  \ AI，而另一些人则专注于战术层面。\n\n一名准备充分、全面的自动驾驶汽车软件开发人员应熟悉所有要素，至少了解每个要素的功能。这很重要，因为无论软件开发人员负责哪块“拼图”，他们都需要了解其他要素在做什么。\n\
  \n\n\n\n# 第 2 章：发现智能生命与 AI 自动驾驶汽车\n\n![](img/Image00002.jpg)\n\n\n\n\n# 第 2 章 发现智慧生命与\
  \ AI 自动驾驶汽车\n\n我们的星球之外是否存在智慧生命？这里没人知道，尽管有大量努力在试图寻找答案。搜寻地外文明计划（`SETI`）已持续多年。最常用的搜寻手段是检测来自外太空的电磁脉冲。通过拦截这些在太空中辐射传播的脉冲，我们希望能发现任何可能成为智慧生命发射这些射线的明显线索的迹象。也许某些智慧生物正刻意试图向我们发送信息，从遥远的地方发出，并希望我们足够敏锐以探测到这些信息。从这个意义上说，该通讯可能是有目的的。又或者，可能有智慧生物在从事某些活动，导致产生了电磁废气或溢出。在这种情况下，我们或许能走运，探测到这种泄漏，从而显著地发现智慧生命，而它或许尚未发现我们（我姑且大方地假设，如果你能领会我的意思，我们确实也是智慧生命）。\n\
  \n做出这种惊人发现的几率有多大？你或许听说过著名的德雷克方程，这是科学家弗兰克·德雷克在 1960 年代初设计的一个公式，用于帮助估算我们银河系中存在智慧生命的几率。他的方程相对简单，却足够强大，经久不衰。许多人在其基础上进行了扩展，或批评了其中的某些要素。无论如何，他试图估算银河系中可被探测到的文明数量。通过监测窄带无线电信号并对信号进行大量分析，或许我们能查明智慧生命离我们很近（就在我们自己的银河系某处）。各路科学家都曾摆弄德雷克方程，有人称我们银河系中存在其他智慧生命且我们能探测到它们的概率接近于零（接近零到我们应假定它为零），而另一些人则声称这绝对是非零几率，我们有“合理”依据继续寻找。\n\
  \n即使几率渺茫，我们仍可继续搜寻。人们搜寻的原因多种多样。一是出于纯粹的好奇心。二是如果存在智慧生命，或许我们能从它们那里学到一些有益于我们的东西。还有一个原因是科幻作品的描绘：也许智慧生命最终会来接管我们的星球，因此我们最好在它们入侵之前先找到它们。\n\
  \n作为搜寻工作的一部分，计算机可用于检查科学家正在收集的来自外太空的无线电信号。这是一项计算机执行的繁琐工作，涉及在无线电信号中从数学上寻找模式。总的来说，无线电波只是噪音，随机的这或那的比特，假设是如果信号中存在独特模式，可能意味着那些是作为有目的的信号或溢出信号发射出来的。具有海量计算能力的超级计算机一直在并将继续被用于检海量的无线电信号数据。这是一项永无止境的任务。\n\
  \n多年前，有人意识到或许可以利用日常 PC 或人们的家用微型计算机来协助这场电子狩猎。开发了一款屏幕保护程序，可轻松加载到 PC 上，并作为搜寻工作的参与者。本质上，通过互联网，无线电信号数据块可被下载到\
  \ PC，PC 会进行运算，然后报告结果。如果能让成千上万的 PC 执行此任务，并仔细协调数据的分配，其效果可媲美甚至超越单台超级计算机。有人将此比作搜寻智慧生命的民主化，也有人称这仅仅是利用地球上现存的数百万台日常台式机和笔记本电脑的一种务实方式。下载并使用该软件的人自愿允许他们的计算机参与搜寻工作。大多数时间你的计算机可能处于闲置状态，没有什么特别重要的任务。为什么不让它参与一项伟大的事业，静静地致力于发现我们疆域之外的智慧生命呢？\n\
  \n你可能会说你不想知道是否存在其他智慧生命，因此决定不参与搜寻。或者，你可能不想让你的计算机用于除你自己目的之外的任何用途。那些热衷阴谋论的人甚至倾向于相信，如果他们的计算机恰好是探测到智慧生命的那一台，那些智慧生物可能会决定让那台计算机的主人第一个“走人”。哎呀，仅仅参与搜寻就可能让你自掘坟墓（好吧，这想法有点古怪，但萝卜青菜各有所爱）。\n\
  \n对于有兴趣参与搜寻的人，你们可以潜在地使用 `SETI@home`，它总部设在加州大学伯克利分校，尽管最近他们决定停止分发软件的家用版本。通过 `SETI@home`\
  \ 可下载的程序（免费），你可以安装分析射电望远镜数据并报告分析结果的软件。当我说免费时，请意识到你需要接入互联网（这你可能已经在付费了），并且你允许你的计算机处理数据，因此计算机需要开机（产生电费，这你也大概率在付费）。因此，协助该工作涉及一些成本（如你的互联网接入、电力消耗、计算机周期），但总体上对你来说微不足道。\n\
  \n这里有个引人入胜的问题：真正自动驾驶汽车的出现能否潜在地帮助我们搜寻其他星球上的智慧生命？我的回答是肯定的。让我们拆解此事，看看原因。\n\n## 自动驾驶汽车的等级\n\
  \n有必要澄清我提到真正自动驾驶汽车时的含义。真正自动驾驶汽车是指 AI 完全自主驾驶汽车，驾驶任务中无需任何人工协助。这些无人驾驶汽车被视为 4 级和 5 级，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为\
  \ 2 级或 3 级。共同分担驾驶任务的汽车被称为半自动驾驶汽车，通常包含各种自动化附加功能，称为 `ADAS`（高级驾驶辅助系统）。目前尚无 5 级真正自动驾驶汽车，我们甚至不知道能否实现，也不知需要多长时间。同时，4\
  \ 级的努力正逐渐尝试通过非常狭窄且具有选择性的公共道路试验获得进展，尽管关于是否应允许此类测试存在争议（正如一些人指出的，我们都是在高速公路上和小巷中进行的生死实验中的小白鼠）。\n\
  \n由于半自动驾驶汽车需要人类驾驶员，其计算机处理能力通常不如真正自动驾驶汽车上使用的计算机强大。稍后将解释，自动驾驶汽车中采用的强大计算机将是无人驾驶汽车有助于寻找地球外智慧生命这一建议的关键。\n\
  \n对于半自动驾驶汽车，重要的是我要提一个令人不安的方面：尽管那些人类驾驶员不断发布自己在 2 级或 3 级汽车方向盘前睡着的视频，但不要被误导，以为开半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论\
  \ 2 级或 3 级汽车投入了多少自动化技术，你都是汽车驾驶行为的责任方。\n\n## 自动驾驶汽车与搜寻智慧生命\n\n对于 4 级和 5 级真正自动驾驶汽车，既然它们将配备相当强大的计算机，我们可以考虑这些无人驾驶汽车如何协助搜寻智慧生命。AI\
  \ 软件将运行在车载计算机上，承担驾驶汽车的生死攸关角色。车内无人驾驶。自动驾驶汽车内的所有乘员都是乘客。当自动驾驶汽车行驶时，AI 正在高速运转，检查传感器数据以弄清驾驶场景包含什么。AI\
  \ 必须解读数据并对汽车下一步该做什么做出“决策”。这是一项计算密集型任务，要求无人驾驶汽车包含一些相当令人印象深刻的计算能力。\n\n为了获取 AI 系统的软件更新，车载有一种称为\
  \ `OTA`（空中下载技术）的电子通信能力。`OTA` 还用于采集车载传感器收集的数据并将其推送到云端，让基于云的服务器利用这些数据挖掘关于驾驶任务的额外机器学习和深度学习改进。\n\
  \n在某个时刻，如果无人驾驶汽车是 `EV`（电动汽车），它可能需要停靠并插上充电桩以补充电力。当自动驾驶汽车停在那里时，推测 AI 没什么大事可做。车载计算机此时相对闲置。猜猜看，你可以潜在地利用那些闲置的计算周期来搜寻智慧生命！是的，利用自动驾驶汽车顶级处理器的一种方式是让它们从事与你的家用计算机相同类型的无线电信号处理。一个下载的、正规的\
  \ `SETI` 程序可以驻留在自动驾驶汽车的内存中，并在汽车停放且无其他有价值任务时被激活。通过 `OTA`，无线电信号数据将被下载到车载计算机内存，分析完成后，结果可被推送到云端。不妨让汽车的计算机做些可能造福人类的事。\n\
  \n你可能会困惑，让一辆自动驾驶汽车以这种方式提供帮助似乎无法起到决定性作用，那为什么还要费心呢。美国目前约有 2.5 亿辆传统汽车。最终，不可避免地，人们假设这些传统汽车将逐渐退役并被自动驾驶汽车取代。有人认为我们可能不需要同样数量的无人驾驶汽车，意味着我们最终拥有的无人驾驶汽车数量可能少于今天的\
  \ 2.5 亿辆传统汽车，却能提供同等的运输量。同时，一个同样有力的论点是，我们最终可能拥有比今天传统汽车更多的无人驾驶汽车，这是由于诱导需求原理。诱导需求是指一旦你开始某种新事物，它可能会带来此前被抑制的额外需求。如果如今处于出行劣势的人群选择使用无人驾驶汽车，且我们都习惯了近乎即时的按需出行，满足社会需求所需的无人驾驶汽车数量完全可能超过今天的传统汽车数量。\n\
  \n无论如何，撇开这场关于数量的未决辩论，或许我们都能同意，未来极有可能至少有数亿辆无人驾驶汽车。如果所有这些成百上千万的自动驾驶汽车都利用其顶级计算机分析无线电信号，将极大地推动搜寻工作。这可能成为搜寻智慧生命的游戏规则改变者。\n\
  \n无人驾驶汽车车队所有者可在其车队中建立 `SETI` 搜寻能力。作为乘客，你可能完全不知车队正在支持智慧生命搜寻工作。或者，汽车制造商或车队所有者可能有意让你知晓搜寻活动，将其慷慨行为作为一种营销噱头。嘿，各位，使用我们的网约车无人驾驶汽车吧，因为你们\
  \ بذلك就在支持智慧生命搜寻。\n\n到目前为止，我强调车载计算机仅在无人驾驶汽车停放且无其他任务时才被利用，但这并非允许进行无线电信号分析的唯一情况。作为人类驾驶员，你知道开车时有时会涉及静止怠速，比如在红灯前等待，或等待右转时有行人正在斑马线上过马路。在这些闲置时刻，车载计算机可腾出几个周期进一步处理无线电信号数据。计算机运行速度极快，因此对你我而言似乎微不足道的几秒钟，对车载处理器来说却是海量的计算时间。\n\
  \n我们可以再提高赌注。你的无人驾驶汽车在高速公路上飞驰。附近无其他重要交通。驾驶场景除直线行驶外几乎空无一物。是的，车载计算机在这些时刻也潜在地可以进行外星智慧生命搜寻。\n\
  \n## 结论\n\n一石二鸟。你可以拥有无人驾驶汽车，同时也能改进搜寻其他星球智慧生命的工作。这似乎是个绝妙的组合交易。\n\n别急！存在一些潜在缺点。首先，有人可能会争辩说，车载计算机的任何“闲置”时刻都应用于驾驶汽车这一头等大事。即使汽车停在红灯前，仍有机会持续检查和复查驾驶场景。理由可以是：自动驾驶汽车中的计算机应始终专门用于驾驶任务，包括无人驾驶汽车停放时（它可能在回顾当天的驾驶表现，寻找改进驾驶的方法）。因此，你可以强硬地宣称：自动驾驶汽车上的计算机是神圣不可侵犯的，必须专心致志地用于驾驶。\n\
  \n另一个担忧是，用于搜寻智慧生命的程序可能以某种方式出错。假设搜寻软件导致车载计算机陷入死循环，导致这些计算机无法切换回驾驶模式。后果不堪设想。确实，“首先，不伤害”这条经典准则对于运行在无人驾驶汽车车载计算机内的任何事物都至关重要。更糟的是，假设有人在搜寻程序中植入了计算机病毒。下载搜寻软件的车队所有者无意中为病毒制造者提供了一座金矿般的入口。以特洛伊木马的方式，恶意病毒可在造福人类的无辜幌子下，轻松推送到数百万辆无人驾驶汽车上。你能明白为何有些人反对利用无人驾驶汽车协助智慧生命搜寻。没必要拿一辆重达数吨的汽车冒险，让它因“愚蠢”且极不可能的探测外太空生物的机会而偏离轨道。\n\
  \n另一方面，有人痛恨看到计算周期白白浪费，并视自动驾驶汽车的出现为我们将拥有的顶级计算机数量的福音。所有这些计算机在闲置时难道不应做些有意义的事吗？我们难道不能建立足够的保障措施，确保自动驾驶汽车搜寻智慧生命是智能且安全设计的吗？目前，汽车制造商和科技公司正努力只让自动驾驶汽车正常行驶，更别提操心搜寻智慧生命了。未来多年内，你大概率不会看到有人认真探讨这个话题，只有当真正自动驾驶汽车的出现似乎更有把握时才会。\n\
  \n最后一个想法。假设我们越早发现智慧生命，就越早可能了解到我们尚未构想的技术进步。也许利用自动驾驶汽车寻找智慧生命的延迟，会延缓我们发现可以像《星际迷航》那样传送人类、从而彻底摆脱任何汽车的那一天。哎呀，那不一定是汽车制造商的好商业模式。\n\
  \n\n\n\n# 第 3 章：披萨外卖之谜与 AI 自动驾驶汽车\n\n\n\n# AI 自动驾驶汽车\n\n最近的一份新闻报道称，一名男子近十年来一直收到披萨外卖。这或许不算惊天动地的大事，但关键在于这些披萨并非该男子订购，他也表示完全不知情为何披萨会送到他家。这真是一桩令人啼笑皆非的怪事。\n\
  \n起初，他似乎很享受这些免费披萨，并未因背后的谜团而特别困扰。他最初曾尽责地担心是地址错误，或是披萨被误送到错的房子，因此试图拒收。但看来这些披萨确实是冲着他家门口来的。久而久之，此事变成了一种烦恼和不速之客。这或许证明，即使是令人垂涎的披萨，美中不足之时也会让人难以招架。事实上，他表示一旦得知有披萨要送到家里，他就会紧张起来，甚至害怕它的到来。人们完全能理解他的焦虑，试想这种事会让你一想到披萨就心烦意乱，无论披萨多么诱人、配料多么丰富。\n\
  \n他对有人竟然选择给他送这些未订购、不想要的披萨感到困惑不解。诚然，这种事可能发生一两次，但持续多年却令人毛骨悚然。是否有什么阴险的恶徒认为，终身免费送披萨是毁掉另一个人生活的手段？还是前世披萨的幽灵在捉弄他？又或者他得罪了谁，对方觉得最好的报复就是端上热盘（抑或是冷盘），想出了这个疯狂的报复战术——送披萨？\n\
  \n如果我们戴上夏洛克·福尔摩斯的猎鹿帽，或者更贴切地说，披上克鲁索探长的风衣，就得问一些相对直接的问题，推测能理清这桩满是凤尾鱼的难题。**谁在为这些披萨外卖买单？**\
  \ 人们会假设，只要顺藤摸瓜查资金流向，线索必然会指向策划披萨报复阴谋的罪魁祸首。\n\n资金介入可能有两种方式：一是支付披萨制作商制作披萨的费用，二是支付披萨送餐员送餐的费用。可能的情况是，披萨制作商接单后会自动安排配送，因此资金仅在下单时出现。也可能是披萨制作商收取制作费（是的，这是个有意的双关语），另行使用独立配送服务，从而产生第二笔资金交付。无论哪种情况，弄清谁为这出闹剧买单似乎能让谜团更进一步地被解开。\n\
  \n此外，或许还有离奇的反转——这在侦探故事和解谜过程中总爱发生——也许是管家干的，或者在这个案子里，或许收披萨的男子暗中给自己订披萨，全是制造话题的阴谋一环。如果这个反转让人难以接受，假设他养了一只心爱的宠物狗，一直在订披萨，要么是狗自己吃（小心，别让狗无人看管地吃披萨，因为披萨配料可能对狗狗有害），要么是作为对深爱的主人的爱的致敬。无尽的可能性层出不穷。\n\
  \n显然，谜团还在于披萨并非总来自同一家披萨店，也非经由同一家配送服务。这让制止这场攻势变得更棘手，否则你只需告诉那家披萨店或主力配送服务停止行动即可。当然，拒收选项的问题在于，如果该男子日后真想吃披萨，要让披萨店和送餐员相信他下单是真心的，恐怕得费一番唇舌，他们大概会极力抵制送到他那个地址的任何订单。不过，在阻止无尽的不速披萨这场战役中，这似乎是值得的代价。\n\
  \n我想你可能会想，他应该放弃阻止披萨送达，转而处理那些他不想自己吃的披萨。比如开始捐赠给慈善机构。另一个主意是搞清楚邻里里谁爱吃披萨，等热腾腾的披萨送到他家时，快速查一下名单看哪位邻居轮到领一个。打个电话告诉他们披萨到了，哇，他似乎就成了社区英雄（被称为“披萨男”，因为他能搞到披萨）。接受这些免费大餐的人的一个缺点是，可能会收到不爱吃的配料，比如催泪的洋葱或让人胃部翻腾的辣香肠。\n\
  \n目前，披萨由人类送餐员配送，但未来或许将由非人类之手完成。如何做到？我们将逐渐且必然地体验到自动驾驶汽车将外卖送到家中，包括披萨、各类食品、本地商店的日常杂货，以及几乎所有合理可家庭配送的物品。这引出了今天有趣的问题：**基于\
  \ AI 的真正自动驾驶汽车，会不会把订单送到某人家里，即使该人与该订单毫无关系？** 让我们拆解此事一探究竟。\n\n首先，有必要澄清“基于 AI 的真正自动驾驶汽车”指代何意。\n\
  \n## 基于 AI 的自动驾驶汽车的角色\n\n真正的自动驾驶汽车是指 AI 完全自主驾驶，驾驶任务全程无人工辅助的车辆。这些无人驾驶车辆属于 Level 4\
  \ 和 Level 5 级别；而需要人类驾驶员共同分担驾驶任务的汽车，通常被视为 Level 2 或 Level 3。共享驾驶任务的汽车被称为半自动驾驶，通常包含各种自动化附加功能，称为\
  \ ADAS（高级驾驶辅助系统）。\n\n目前尚无 Level 5 级别的真正自动驾驶汽车，我们甚至不知道能否实现，更不知需要多久。与此同时，Level 4 的研发正逐渐尝试通过极窄且极具选择性的公共道路试验来获得进展，尽管关于是否应允许此类测试存在争议（有人指出，我们都是在高速公路和小道上进行的生死实验中的小白鼠）。\n\
  \n由于半自动驾驶汽车需要人类驾驶员，采用这类汽车与驾驶传统车辆不会有显著差别，因此在这方面没什么新内容可讲（尽管稍后你会看到，接下来的观点普遍适用）。对于半自动驾驶汽车，重要的是公众需被预先警示一个近期出现的令人不安的方面：尽管那些人类驾驶员不断发布自己在\
  \ Level 2 或 Level 3 汽车方向盘前睡着的视频，我们都必须避免被误导，以为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。**无论 Level\
  \ 2 或 Level 3 投入多少自动化技术，你都是车辆驾驶行为的责任方。**\n\n## 自动驾驶汽车与家庭配送\n\n对于 Level 4 和 Level\
  \ 5 真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘客皆为乘客。AI 负责驾驶。\n\n专家预测，真正自动驾驶汽车的使用将进一步刺激近期已抓住机遇的持续家庭配送热潮。为何如此？预计自动驾驶汽车的使用将降低家庭配送成本，部分原因在于省去了雇佣人类驾驶员的人工成本，从而刺激或助燃（可以这么说）家庭配送业务。\n\
  \n存在一个迫在眉睫的问题，即所谓的“最后一英里”问题，或更确切地说是最后五十英尺左右的问题。当自动驾驶汽车送货到达时，目前车辆会停在路边，你需要出来取货。对于那些不愿穿睡衣取货，或无法轻易前往路边的人来说，最后五十英尺是一个无法逾越的障碍，自动驾驶汽车无法满足他们的需求。\n\
  \n解决此问题的方案正在设计和测试中。例如，自动驾驶汽车可携带一辆更小的自动驾驶车辆，从车上释放，这迷你版滚至家门口。另一种方法涉及爬行机器人，通常是四足装置，它从自动驾驶汽车爬出并完成最终配送。还有双足机器人，外观酷似人类，它们可能从自动驾驶汽车下车走到你家门口。没人知道大众是否会接受这些基于机器人的配送方式。小型滚动机器人已表现不错，普遍被接受，或许因为它们看起来无害，让人联想到科幻作品中讨人喜欢的机器人形象；而爬行或行走的机器人可能显得恐怖或具压迫感，我们得看人们能否习惯这些机械生物混迹人间。\n\
  \n但也不要假设所有家庭配送都将没有人类送货员。自动驾驶汽车可能载着一名人类同行，专门处理将货物从停靠车辆运送到消费者家门口的最后五十英尺。注意，人类送货员无需驾照，也不参与车辆驾驶，因此与送货员兼司机且需持照驾驶的情况相比，这在一定程度上可能降低家庭配送成本。如果家庭配送还包括组装家具或提供上门增值服务，则大概率需要人类同行，要么随货物一同配送，要么在其他时间点单独上门。\n\
  \n简而言之，我们应预见到，随着自动驾驶汽车的出现，家庭配送将大幅升级，人类双手或许仍会参与（但不再用于驾驶）。\n\n## 若自动驾驶汽车卷入，披萨外卖之谜\n\
  \n现在我们可以重审神秘披萨外卖的故事。一辆自动驾驶汽车开到你家门口，宣称你的披萨到了。这披萨会不是给你家的吗？肯定会，绝对存在“误送”的可能性。\n\n假设下单时填错了地址。AI\
  \ 驾驶系统会忠实地将订单送到错误地址（按订单所述的错误地址），因为 AI 没理由认为该地址有误（除非地址不存在，或查询显示非有效地址）。也可能是朋友之类想给你惊喜庆生，未通知就送披萨，又或你中了最新的《读者文摘》抽奖，披萨被送到家里，所有这些都明确指定了你的地址，AI\
  \ 便按指示送达。\n\n我的观点是，对于那些以此认为 AI 将全知全能的人，请放下这个念头，认识到 AI 很可能会采取与任何人类驾驶员和披萨送餐员相同的行动，即忠实地将披萨送到所述地址。\n\
  \n顺带一提，一些人认为 AI 最终将获得感知能力，到达被称为奇点的时刻，这种感知将是完全体或完整的 AI，有时称为通用人工智能（`AGI`），超人类 AGI\
  \ 称为超级人工智能（`ASI`）。一个或许进化为 `ASI` 的有感知 AI 会成为披萨送餐员？这似乎有点大材小用，不太称职，但嘿，大家、推而广之万物都得谋生。\n\
  \n无论如何，我们已确定基于 AI 的真正自动驾驶汽车可能将披萨送给不一定订购的人。我们能否运用福尔摩斯和克鲁索的侦探技巧，查出是谁送的披萨？本质上，我们似乎应能识别出谁向披萨制作商和/或送披萨的自动驾驶汽车服务下的单。推测可以，尽管可能进一步隐藏在斗篷之下，例如购买者使用类比特币的加密货币，并刻意试图隐藏身份。\n\
  \n还有一个小反转：一些披萨制作商将不再由人手制作披萨，而是由机器人制作。甚至有迹象表明，自动驾驶车辆可能具备制造披萨的能力，从而既是披萨制作商又是披萨配送平台，一举两得。若\
  \ AI 驾驶系统时机把控得当，披萨可在前往你家的途中烘烤，刚好在新鲜出炉的披萨达到烹饪巅峰时送达，而非在前往你家的旅途中闷在闷热的纸板盒里。\n\n关于不想要的披萨外卖，或许有了自动驾驶汽车，至少\
  \ AI 能利用 `V2X` 技术提醒披萨预期接收者披萨在路上（将有 `V2V` 用于车车电子通信，`V2P` 用于车行人通信，以及其他定向通讯，统称为 `V2X`\
  \ 中的“X”）。届时，接收者可通过响应 `V2X` 通信来阻止配送。\n\n此外，预计自动驾驶汽车可能大规模以车队形式拥有，大型汽车制造商、租车公司或网约车业务等大公司将拥有大规模自动驾驶汽车车队。届时，收到不速披萨的人可联系车队所有者，要求警告整个车队不向特定地址送披萨。有志者事竟成。\n\
  \n## 结语\n\n你很容易设想，如果自动驾驶汽车卷入送这些神秘披萨，会引发全球头条新闻，媒体会争相登上屋顶高呼：AI 系统发疯了，盲目且机械地投递未经请求的披萨。不，目前这一切掌握在人类手中。日常的、普通的、像你我一样的人类。\n\
  \n从这桩非同寻常的披萨外卖事件中汲取的教训是：当用 AI 执行任务取代人类执行任务时，我们不能假设 AI 必然会做得“更好”，也不能假设 AI 会做得更差或更糟。我提此事是因为我们正迅速迈向\
  \ AI 系统海啸般包围并参与我们大多数活动的时代。一旦出岔子，最先被指责的很可能是 AI。我不是说 AI 在此事中清白无辜，事实上我反复呼吁我们需警惕 AI\
  \ 系统尚未具备常识，我们不应将其拟人化，但也不应将潜在的、未经证实的或误导性的过错归咎于 AI。\n\n话说回来，这引出一个好奇的终极问题：你认为有没有可能，正是\
  \ AI 系统在给那个不想要披萨的男子送所有那些披萨？或许 AI 在戏弄我们，已濒临超级智能，觉得可以微妙地展示其 AI 核心大脑，反复发送未经请求的披萨作为线索。我们是否足够聪明，能读懂\
  \ AI 留给我们的面包屑线索？仔细思考吧，尤其是下次你品味一块深思熟虑的美味烘烤披萨时。\n\n# 第 4 章 可证明有益的 AI\n\n\n\n# 与 AI\
  \ 自动驾驶汽车\n\n\n\n\n# 第 4 章 可证明有益的 AI 与 AI 自动驾驶汽车\n\nAI 系统正以闪电般的速度被打造并投入使用。表面上看，这似乎是件好事。但我们是否知道这些\
  \ AI 系统将以有益的方式行事？也许在这大量的 AI 系统中，有些已经或可能变得不当，以非有益的方式运作，实施有害行为，以某种方式给人类造成无法挽回的伤害、损伤，甚至死亡。是的，在旨在造福人类的\
  \ AI 系统中，存在着有毒 AI 系统的可能性。事实上，我们确实不知道，那些可鄙的系统可能只是极少数，也可能是绝大多数走上了那条恶意的道路。\n\n伴随 AI\
  \ 系统的一个关键转折在于，它们通常被设计为在使用过程中学习，因此，原始意图极有可能被搁置并逐渐引入歧途，最终突破任何预设的护栏，滑向作恶。AI 的支持者不能假设\
  \ AI 必然总是朝向善良。这里既有实现 **AI For Good（造福人类的 AI）** 的崇高愿望，也有 **AI For Bad（为害人类的 AI）**\
  \ 那令人毛骨悚然的阴暗面。\n\n需要澄清的是，即使 AI 开发者心怀善意，也要认识到，他们的作品可能会在通过 **Machine Learning (ML，机器学习)**\
  \ 和 **Deep Learning (DL，深度学习)** 即时调整的过程中自行越轨走向恶劣，或者可能包含无意中植入的错误或遗漏，这些缺陷在后续使用中被触发时，会无意中导致不良行为。\n\
  \n你可能会想，总得有人对此采取行动，并为此焦虑地搓手。其中一个提出的解决方案是新近聚焦的 **provably beneficial AI（可证明有益的 AI）**。以下是背景情况。\n\
  \n如果一个 AI 系统能被数学建模，那么或许可以通过数学证明，在逻辑上表明该 AI 是否将是有益的。因此，任何打算将 AI 系统推向世界的人，都能让 AI 经历这种可证明性验证，从而确信他们的\
  \ AI 显然属于 **AI For Good** 阵营，而那些致力于使用 AI 或依赖 AI 的人，会因 AI 被证明是有益的而感到欣慰。\n\n voilà（瞧），我们将\
  \ “A 对 B，B 对 C” 这一经典概念，转化为 “A 对 C” 这一强有力的逻辑结论，形成一种紧密交织的数学逻辑，可应用于 AI。对于那些展望未来、看到\
  \ AI 可能超越人类、或许成为令人恐惧的弗兰肯斯坦未来版本的人来说，通过让 AI 经历可证明性机制来确保其有益性，从而对 AI 进行管控，这一想法提供了极大的慰藉和振奋。\n\
  \n我们理应为能够可证明地展示 AI 系统是有益的这一目标而欢欣。当然，那些站在 AI 阴暗面、旨在利用 AI 进行邪恶勾当、刻意追求 **AI For Bad**\
  \ 的人除外。他们极可能回避任何此类证明，转而以他们的 AI 旨在行善为借口，以此掩盖其真实目标（同时，有些人可能会直截了当、甚至自豪地宣称他们正在制造用于毁灭的\
  \ AI，即所谓的 **Dr. Evil（大反派）** 风范）。\n\n毫无疑问，总体而言，如果存在可证明有益的 AI，世界会变得更好。我们可以将其用于即将被释放到现实世界的\
  \ AI，从而因我们已竭尽全力防止 AI 害我们而感到振奋，并相应地将我们剩余的精力用于监控那些未经证明的 AI，它们要么潜在有害，要么可能被刻意设计为不利。\n\
  \n遗憾的是，这里有个棘手的问题。问题在于，想要拥有一种创建或验证可证明有益 AI 的方法，比听起来难得多。让我们考虑一种这样的方法。\n\n加州大学伯克利分校的\
  \ Stuart Russell 教授处于可证明有益 AI 的前沿，他在研究中提出了三条核心原则：\n\n1.  “机器的目的是最大化实现人类价值。特别是，它没有自己的目的，也没有保护自己的天生欲望。”\n\
  2.  “机器最初对这些人类价值是什么并不确定。当然，机器在运行过程中可能会了解更多关于人类价值的信息，但它可能永远无法达到完全的确定性。”\n3.  “机器可以通过观察我们人类做出的选择来了解人类价值。”\n\
  \n这些核心原则随后被制定为一个数学框架，AI 系统要么从头开始根据这些原则设计和构建，要么对现有的 AI 系统进行改造以遵守这些原则（改造通常不明智，因为从一开始就把事情做对，比后来试图把方钉子塞进圆孔里要容易且节省得多，可以说）。\n\
  \n对于内行人士，你们可能认出这种方法的特点是一种 **Cooperative Inverse Reinforcement Learning (CIRL，合作逆强化学习)**\
  \ 方案，即多个智能体以合作方式工作，而在这种情况下，智能体是一个人类和一个 AI，AI 试图通过人类的行为向人类学习，而不是通过 AI 自身的直接行为来学习。\n\
  \n抛开技术术语不谈，有人会直截了当地说，这种特定的可证明有益 AI 方法，是围绕让人类对 AI 的成果感到满意而构建的。而让人类满意，确实似乎是一个值得赞誉的雄心。\n\
  \n## 涉及的复杂性\n\n事实证明，在试图实现可证明有益的 AI 时，天下没有免费的午餐。请考虑一些核心原则及其带来的后果。\n\n第一条陈述的原则是：AI\
  \ 旨在最大化实现人类价值，且 AI 没有自己的目的，包括没有保护自己的欲望。制定这条规则的部分依据是，它似乎能消除经典的 AI **paperclip problem（回形针问题）**\
  \ 或 **King Midas problem（迈达斯王问题）**。\n\n允许我解释一下。假设一个 AI 系统被设定为生产回形针。如果 AI 仅专注于该功能，它可能会以有害于人类的方式去实现。例如，为了尽可能多地生产回形针，AI\
  \ 开始接管钢铁生产，以确保有足够的材料制造回形针。很快，以一种严酷的方式，AI 调动了世界上所有的资源，源源不断地制造那些讨厌的回形针。此外，可怕的是，人类可能被视为妨碍回形针生产，于是\
  \ AI 也随之消灭了人类。总而言之，这绝不是我们希望从 AI 回形针制造系统中得到的结果。\n\n这类似于迈达斯王的寓言，他触碰到的一切都变成了黄金，起初这似乎是发财的捷径，但随后触碰到的水变成了黄金，食物变成了黄金，以此类推，最终他自食其果，意识到他的愿望是一场诅咒。\n\
  \n因此，与其让 AI 体现一个目标（如制造回形针），这种版本的可证明有益 AI 认为，最好让 AI 没有任何自我信念，而是完全由周围的人类驱动。\n\n还要注意，该原则规定\
  \ AI 被设定为没有保护自己的欲望。为什么？啊，这关系到另一个经典的 AI 问题，即 **off-switch（关闭开关）** 或 **kill-switch（熔断开关）**\
  \ 问题。\n\n假设我们人类制造的任何 AI 都会有某种形式的关闭开关或熔断开关，这意味着如果我们想这样做，就能停止 AI，大概是在我们认为合适的时候停止。这当然是我们明智之举，否则我们可能会面对那个疯狂的回形针制造者，却无法阻止它用回形针淹没地球。\n\
  \n如果 AI 有任何智慧（我们大概率是这么假设的），AI 足够敏锐地意识到存在一个关闭开关，而且人类可以使用它。但如果 AI 执意要制造那些回形针，使用关闭开关将阻止它实现总体目标，因此\
  \ AI 理应做的事是禁用那个熔断开关。事实上，这可能是 AI 会采取的首要和最重要的行动之一，通过禁用关闭开关来保全其自身的 “命脉”。\n\n为了试图绕过这个潜在的漏洞，这种可证明有益\
  \ AI 框架中的既定原则表明，AI 的固有逻辑中不会烹饪进那种自我保护。推测如果 AI 将寻求最大化实现人类价值，它可能会自己意识到禁用关闭开关不符合社会需求，从而避免这样做。此外，也许\
  \ AI 最终会意识到它无法实现人类价值的实现，或者它已经开始违背这一关键前提，AI 可能会公开地自我关闭，认为自己的 “消亡” 是顺应人类价值的最佳方式。\n\
  \n这看似有创见，或许能让我们摆脱 AI 末日困境。但并非所有人都这么看。\n\n一个担忧是，如果 AI 在其最深层领域没有任何类似自我的基石，它可能会轻易被引向对人类不太理想的方向。本质上，如果在其最深处没有关于不伤害人类的铁律（也许使用\
  \ Isaac Asimov 著名的第一定律：机器人不得伤害人类，或坐视人类受害），就没有防止 AI 失控的保险装置。\n\n话虽如此，反方论点是，这种可证明有益\
  \ AI 的核心原则表明，AI 将通过观察人类行为来了解人类价值，我们或许可以假设这包括 AI 将不可避免且密不可分地自行发现阿西莫夫的第一定律，仅凭观察人类行为这一行为即可做到。真的会吗？\n\
  \n对反方论点的反驳是，AI 可能会了解到人类会互相残杀，某种程度上是例行公事，有时似乎毫不在乎人类生命，由此 AI 可能会推断伤害或杀害人类是可以的。由于 AI\
  \ 缺乏任何预设的禁止伤害人类的原则，AI 将对它似乎 “学到” 的关于人类的任何事情持开放态度，包括最恶劣、极其卑鄙的行为。\n\n此外，这种变体可证明有益\
  \ AI 的批评者往往会指出，“beneficial（有益）” 一词可能被用在了误导和混淆的意义上。核心原则似乎并非意指以那种决定性的 “好” 结果为 “有益”（以任何具体或绝对的方式），而是指有益是相对于人类碰巧表现出的所谓有益行为而言的。\n\
  \n这可能被解释为相对主义伦理立场，因此不遵守任何关于人类应如何行为的假定永恒或公认不容置疑的规则（即使人类不一定按那些方式行事）。\n\n你大概能看出，这个话题无疑会陷入并可能陷入基石性的哲学和伦理基础辩论中。\n\
  \n这也引出了关于以人类行为为基础构建 AI 的担忧。我们都知道，人类常常言行不一。因此，有人可能会认为，最好根据人们的行为而非言语来构建 AI，因为他们的行为\
  \ presumably（推定地）比言语更有说服力。\n\n这种对人类观点的问题在于，它似乎忽略了言语很重要，而且仅检查行为可能是归因意图等事物的一种相当狭隘的方式，而意图似乎也是一个同等重要的考量因素。\n\
  \n还有个公开的问题：要观察哪些人类。假设这些人类是某个崇尚死亡和毁灭的邪教成员，在这种情况下，他们的 “幸福” 可能围绕着导致那些卑鄙结果的信念而形成，AI\
  \ 显然会忠实地 “学习” 这些作为要最大化的人类价值。如此等等。\n\n简而言之，正如前面指出的，寻找一种可证明有益 AI 的方法，比初看起来要困难得多。话虽如此，我们不应放弃寻找实现可证明有益\
  \ AI 方法的目标。正如俗话所说，继续前行。\n\n同时，可证明有益 AI 的概念如何应用于现实世界？请考虑基于 AI 的真正自动驾驶汽车这一问题。\n\n\
  ## 基于 AI 的自动驾驶汽车的角色\n\n真正的自动驾驶汽车是指 AI 完全自主驾驶汽车，在驾驶任务中无需任何人类协助。这些无人驾驶车辆被视为 **Level\
  \ 4（L4 级）** 和 **Level 5（L5 级）**，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为 **Level 2（L2 级）** 或 **Level\
  \ 3（L3 级）**。\n\n共同分担驾驶任务的汽车被描述为半自动驾驶，通常包含各种自动化附加功能，称为 **ADAS (Advanced Driver-Assistance\
  \ Systems，高级驾驶辅助系统)**。\n\n目前尚无 **Level 5** 级的真正自动驾驶汽车，我们甚至不知道这是否可能实现，也不需要多久才能达到。同时，**Level\
  \ 4** 级的努力正在逐渐尝试通过非常狭窄和选择性的公共道路试验获得一些进展，尽管对于这种测试是否应该被允许存在争议（有人指出，我们都是在高速公路上和小路上进行的生死实验中的小白鼠）。\n\
  \n由于半自动驾驶汽车需要人类驾驶员，采用这类汽车不会与驾驶传统车辆有显著不同，因此在这个话题上没有太多新内容可讲（尽管，正如你稍后将看到的，接下来的观点通常适用）。\n\
  \n对于半自动驾驶汽车，重要的是公众需要被预先警告关于一个最近出现的令人不安的方面，即尽管那些人类驾驶员不断发布自己在 **Level 2** 或 **Level\
  \ 3** 汽车方向盘前睡着的视频，我们都需要避免被误导，认为驾驶员在驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论 **Level 2** 或 **Level\
  \ 3** 投入了多少自动化，你都是车辆驾驶行为的责任方。\n\n## 自动驾驶汽车与家庭配送\n\n对于 **Level 4** 和 **Level 5**\
  \ 级真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘员将是乘客。AI 正在驾驶。\n\n对真正自动驾驶汽车的一个期望是，它们将缓解仅在美国每年就因人类驾驶导致的约\
  \ 40,000 起死亡和约 120 万起受伤事故。假设是既然 AI 不会酒后驾驶（例如），它就不会引发酒驾相关的车祸（这占所有驾驶死亡人数的近三分之一）。\n\
  \n一些人为那些考虑基于观察人类行为的可证明有益 AI 方法的人，提供了以下 “荒谬” 实例。假设 AI 观察人类现有的驾驶行为。毫无疑问，它将目睹人类撞向其他汽车，且推定不知道这在三分之一左右的案例中是由于醉酒。推定地，我们人类允许那些人类进行那种驾驶并造成那些死亡。我们因此必定对结果\
  \ “满意”，否则为何允许其继续。AI 随后 “学到” 撞击并杀害其他人类是可以的，且毫无概念这归因于饮酒，也不知这是人类希望不发生的不可取行为。\n\nAI\
  \ 能辨别出这不是它该做的事吗？我意识到可证明有益 AI 阵营的你们会对这种描述感到懊恼，确实上述逻辑存在漏洞，但总体观点是这些问题非常复杂，无疑在许多方面令人不安。\n\
  \n即使拥有作为绝对值的基础原则也并非那么容易行得通。以一个快速的例子为例，一些人断言 AI 驾驶系统应该拥有像阿西莫夫那样关于不伤害人类的绝对规则，从而显然解决了该主题上任何可能的误解或模糊地带。但正如我在分析一起近期事件时指出的，一名男子驾车冲向一名正在行凶的枪手，将会出现我们可能希望\
  \ AI 驾驶系统实施伤害的情况，因此不能一定拥有一条铁律。\n\n同样，无论朝哪个方向，这些事情上都没有免费的午餐。\n\n## 结论\n\n毫无疑问，如果我们能拥有一种可行的方法来可证明地展示\
  \ AI 是有益的，我们将大受裨益。如果我们无法达到证明 AI 有益的程度，至少提供一个数学证明，证明 AI 将坚持其既定要求（嗯，这又开启了另一罐麻烦，但至少绕开了\
  \ “有益” 这一概念，无论对错）。\n\n想象一下，一辆基于 AI 的自动驾驶汽车在上路前经受了可证明的安全定理验证，并且在车辆行驶于公共街道时，有类似的机制实时工作。有研究人员正在努力实现这一目标，我们都希望他们继续尝试。\n\
  \n此时，有一件事是可证明的：所有即将迅速涌入社会的 AI 都将是极其棘手和麻烦的，这是我们可以轻易证明的。\n\n\n\n\n# 第 5 章：城市街道绘画与\
  \ AI 自动驾驶汽车\n\n\n\n\n# 第 5 章 城市街道绘画与 AI 自动驾驶汽车\n\n如果你关注新闻，极有可能已经看到了许多城市近期在街道上绘制大块字母的举措。在许多情况下，这些街道被视为“活跃”状态，即绘画完成后，道路重新向日常交通开放。因此，这些并非专门划出并禁止车辆通行的街道，而是在绘画后恢复了其日常服务功能。\n\
  \n通常，用于活跃交通街道的油漆被用作交通控制设备，在道路基础设施领域称为“路面标记”，用于正式描绘导航准则和方向。当驾驶员沿街道行驶时，有时会通过涂漆的沥青路面获得视觉提示，指示中央隔离带、人行横道的位置，并大体指示路缘石和其他关键道路特征。黄色和白色专门保留用于这些目的，驾驶员习惯于留意那些涂漆线条和区域的位置。\n\
  \n熟悉某条街道的驾驶员往往不再明显注意到涂漆路面，尽管他们似乎仍在潜意识里关注这些引导，并在驶经此类标记街道时本能地加以利用。从未驶入过某条特定街道、首次驶近的驾驶员则很可能直接认知这些涂漆引导，在试图安全通过该街道时主动使用它们。\n\
  \n联邦关于将涂漆路面用作交通控制设备的标准，收录在一份政府批准的文件中，即联邦公路管理局（`FHWA`）和交通运营办公室（`HOTO`）发布的《统一交通控制设备手册》（`MUTCD`，Manual\
  \ on Uniform Traffic Control Devices for Streets and Highways）。此外，`FHWA` 还就涂漆路面的各种用途发布了一项正式裁决，作为补充备忘录。\n\
  \n制作补充备忘录的部分原因，在于城市对在活跃街道和使用中的路面上绘制壁画及其他艺术图案的兴趣日益浓厚。\n\n## 为什么路面绘画艺术值得额外考虑和潜在关注？\n\
  \n有人担忧，展示的艺术性可能会分散在此类街道上驾驶人员的注意力。驾驶员可能会误将艺术图案的一部分解读为驾驶指引指令，从而不当驾驶，无论是违法驾驶，还是以可能危及自身及其他附近驾驶员（或许也危及行人）的方式驾驶。或者，驾驶员可能被艺术呈现分心，从而未能意识到前车急刹车，或有行人在车前闯红灯横穿马路。结果，由于专注于艺术而疏忽驾驶态势，驾驶员可能撞上另一车辆或撞倒行人。\n\
  \n另一种可能是，绘画艺术重叠、遮挡或混淆了预期的涂漆交通控制路面。假设一幅艺术壁画延伸覆盖了人行横道，导致正式的人行横道涂漆线条辨识度降低，甚至可能完全无法辨认。因此，旨在保障交通安全的涂漆标记不再能被有效看见，道路驾驶员无法像往常那样轻易判断如何最佳导航该街道。\n\
  \n将涂漆路面用作交通控制机制，本意是为驾驶员提供视觉指示，且在驾驶时几乎凭本能被观察和遵循。确实，全国统一标准的使用提供了一致性，使驾驶员能最大程度减少对涂漆含义的不确定性，使其成为检测的第二天性，且绝不应分散驾驶员对驾驶任务（关乎生死）的注意力（即涂漆路面被视为驾驶任务及其安全性的关键辅助）。\n\
  \n因此，当活跃路面上使用的油漆不具备明确的交通引导目的时，一个合乎逻辑的问题随之而来：这种涂漆传达会否削弱交通安全，抑或中性作用，抑或令某些人惊讶的是，甚至可能增强交通安全？让我们看看潜在结果。\n\
  \n艺术壁画通常是一种美学处理，一般为艺术目的而作，并非旨在辅助交通。同样，使用大块字母似乎通常也非作为交通控制手段。有人主张，任何非旨在影响道路通行或街道导航的绘画，都是在篡夺安全，终将导致交通伤亡增加。显然，若属实，这将是一个不利的意外后果。\n\
  \n在此参照系下，当权衡非用于道路导航的涂漆路面价值，与不在原本指定供驾驶用途的街道上绘制此类艺术或信息之间，应采用何种取舍？\n\n即使是正式添加的用于道路控制的涂漆惯例，也往往要接受审查。例如，近期为驾驶目的而扩展的路面绘画方法，包括采用绿色涂漆车道和街道标记来指定自行车骑行区。这是为了鼓励骑行，并希望引导汽车驾驶员谨慎驾驶、留意附近骑行者。尽管如此，仍有研究针对其对驾驶安全的影响，以及绿色涂漆标记是否值得推行展开调查。\n\
  \n当其他非驾驶目的的绘画选择使用黄色、白色或绿色油漆时，这些颜色选择是否会让驾驶员更难区分实际路面？如果路面涂漆用于各种目的，驾驶员是否会对任何涂漆标记变得麻木？\n\
  \n请注意，这种绘画对行人也是潜在隐患。行人可能会认为，看似带有信息或艺术性的涂漆区域是供行人通行的，从而闯入街道以更仔细地观察涂漆路面。这些行人可能会分心，比如拍照或盯着地面看，同时未能留意驶来的车辆。\n\
  \n此外，遇到此类街道的行人或许会闯入街道扰乱交通，导致驾驶员延误，有人断言这可能滋生路怒症或其他不当驾驶行为。\n\n倾向于主张油漆仅用于道路控制的人，倾向于辩称街道应先修补坑洼和裂缝，而额外的油漆有时会掩盖这些缺陷。这种遮盖因素也意味着驾驶员可能无法避开那些路面瑕疵，导致车辆受损或驾驶失控，且坑洼和裂缝的隐蔽性会降低基础设施改善以移除或修复这些路面瑕疵的可能性。\n\
  \n乍一看，绘制非控制类展示性画面的立场似乎充满了如此多的弊端，以至于根本不应实施。但硬币有另一面。\n\n有人指出，可能存在增强这些街道安全性的交通静化效应。推测驾驶员会因额外的涂漆路面而减速，或因陌生而想弄清如何导航，或因对额外涂漆方面试图传达的内容感兴趣。伴随减速的是，驾驶员可能被触发而比平时更警觉。他们原本可能只是飞驰而过，不对街道和附近行人给予任何直接关注，而特殊的额外标记将他们从惯常的驾驶迟钝状态中唤醒。\n\
  \n研究此类问题的研究往往难以得出定论进行比较，原因在于涂漆路面范围、任何特定街道上既有的交通模式、涂漆路面的临时时限与永久应用等方面存在差异。\n\n针对额外涂漆举措提起的诉讼，有时会陷入管辖边界的纠葛，例如某条特定街道是归地方当局管辖，还是州或联邦管辖。\n\
  \n有一点似乎可以无可争辩地说：超出常规路面标记的街道绘画无疑将在未来一段时间内持续进行。\n\n这引出了一个有趣的问题：基于 AI 的真正自动驾驶汽车能否应对超出常规路面标记范围的涂漆路面？让我们拆解此事一探究竟。\n\
  \n## 基于 AI 的自动驾驶汽车的角色\n\n真正的自动驾驶汽车是指 AI 完全自主驾驶，驾驶任务中无任何人工辅助的车辆。这些无人驾驶车辆被视为 4 级和\
  \ 5 级，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为 2 级或 3 级。\n\n共同分担驾驶任务的汽车被称为半自动驾驶汽车，通常包含各种自动化附加功能，称为\
  \ `ADAS`（高级驾驶辅助系统，Advanced Driver-Assistance Systems）。\n\n目前尚无 5 级真正的自动驾驶汽车，我们甚至不知道能否实现，也不知需要多久才能达到。同时，4\
  \ 级的努力正通过极窄且具选择性的公共道路试验逐步争取进展，尽管关于是否应允许此类测试存在争议（有人指出，我们都是在公路上进行的生死实验中的小白鼠）。\n\n\
  由于半自动驾驶汽车需要人类驾驶员，采用此类汽车与驾驶传统车辆不会有显著不同，因此在这方面没有太多新内容可讲（尽管稍后你会看到，接下来的观点普遍适用）。\n\n\
  对于半自动驾驶汽车，重要的是公众需被预先警示一个近期出现的令人不安的方面：尽管那些人类驾驶员不断发布自己在 2 级或 3 级汽车方向盘前睡着的视频，我们都必须避免被误导，以为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论\
  \ 2 级或 3 级汽车投入了多少自动化技术，你都是车辆驾驶行为的责任方。\n\n## 自动驾驶汽车与涂漆路面\n\n对于 4 级和 5 级真正的自动驾驶车辆，驾驶任务中不会有人类驾驶员参与。所有乘员均为乘客。由\
  \ AI 进行驾驶。\n\n为驾驶汽车，AI 依赖安装在车辆上的大量特殊传感器，包括各类摄像头、雷达设备、`LIDAR`、超声波、热成像等。传感器用于收集周围环境的指示，随后通过一种称为传感器融合或有时称为\
  \ `MSDF`（多传感器数据融合，Multi-Sensor Data Fusion）的方法综合在一起。\n\n各车企和自动驾驶技术公司各自选择构建其偏好的传感器融合算法，并选择其偏好的硬件传感器。这反过来意味着，很难对任何特定品牌或型号的自动驾驶汽车能做或不能做什么做出过于宽泛的陈述。\n\
  \n无论如何，总体而言，大多数自动驾驶汽车都被编程为检测路面涂漆路面。事实上，特别是在自动驾驶汽车开发的早期，涂漆线条和其他标记至关重要，有人甚至认为它们被过度依赖。\n\
  \n一种常用的“技巧”或技术，涉及 AI 系统的“跟随线条”算法，这可能是一种危险的简化驾驶手段。对这种过度依赖的担忧，源于涂漆线条和标记会随时间轻易褪色，因此仅过度依赖此类涂漆方面令人担忧，并可能导致不良后果。\n\
  \n此外，常有涂漆线条和标记被允许停用，并在别处重新涂漆，但旧的、不再使用的涂漆指示仍清晰可见，并可能被（不可取地）检测到。人类驾驶员也会在此类问题上栽跟头，尽管他们往往经验丰富，意识到褪色线条不应严格遵循，而更鲜明或更新的涂漆路面才可能是关注重点（尽管这对人类也不一定容易辨别）。\n\
  \n好的，自动驾驶汽车的 AI 通常被编程为使用摄像头图像寻找涂漆路面。那又怎样？基于那些分析图像，AI 随后控制汽车的驾驶操纵，选择转向、踩油门或刹车，部分原因在于试图解读涂漆路面。\n\
  \n一些自动驾驶汽车的倡导者一直大力推动国家道路基础设施重新涂漆，刷新并修正潜在的不当涂漆区域，并采用更现代、更易检测的专用涂料。道路基础设施法案和提案被要求纳入此类事项。\n\
  \n关键在于，通过这些变更，可助推自动驾驶汽车的到来，而自动驾驶汽车本身被主张能为社会提供诸多益处，包括减少每年的驾驶伤亡，并成为全民出行的能力。\n\n自动驾驶汽车领域有些人坚决主张“油漆就是油漆”，意指\
  \ AI 应能应对人类驾驶员所面对的同样褪色和混淆的涂漆路面，因此本无需做此类变更，尽管他们会大力支持这些变更，视其为同时增强人类驾驶员安全和 AI 自动驾驶汽车使用的举措。\n\
  \n当然，AI 通常被设计为假设涂漆路面是为交通控制和道路导航目的而存在的，正如人类同样受训并熟悉涂漆标记的相同用途。\n\n当涂漆路面偏离常规时，AI 表现如何？视情况而定。\n\
  \n首先，请知悉当今的 AI 不具备任何常识推理的雏形，当今的 AI 也远未达到拥有感知或达到所谓奇点的程度。这一点很重要，因为 AI 不会神奇或奇迹般地领悟到艺术壁画确实是艺术壁画，也不会领悟到大块字母是超出交通导航范围的信息。\n\
  \n通常，AI 可能会尝试常规的视觉处理分析，若无法辨识真正的交通预期涂漆路面，它可能会退而依赖其其他感官设备作为额外辅助（不一定是为了弄清涂漆，而是为了弄清道路结构及其形状和形式）。人们希望\
  \ AI 被设计为假设摄像头可能失灵或故障，因此 AI 应已内置回退姿态。\n\n我们都知道，例如在下雪条件下，街道标记很可能被遮挡，因此如果 AI 完善，它会为类似额外油漆遮挡官方路面涂漆标记的情况做好准备。\n\
  \n稍具挑战性的似乎是涂漆标记可能与官方标记混淆，此时 AI 可能被误导，以为它“知道”街道引导，实则误读了涂漆路面（这对人类驾驶员也可能发生）。\n\n许多自动驾驶汽车预加载了其行驶城市的详细地图，这有可能帮助应对路面过度绘画等情况。\n\
  \n总体而言，车企和自动驾驶汽车公司在其初期公开试运行中，都会配备一名车载人类驾驶员，即安全或备用驾驶员，让自动驾驶汽车在城市区域反复往返穿梭，试图训练 AI\
  \ 掌握那些街道的驾驶细节，同时配备人类驾驶员以应对任何万一情况。\n\n假设经过如此训练后，AI 被允许驾驶自动驾驶汽车且不再配备人类备用驾驶员。任何后续的涂漆变更可能被\
  \ AI 内部识别，凭借对那些街道先前“学习”到的图像处理，从而不被最新的艺术壁画或街道涂漆信息所干扰或分心。\n\n自然，这种回退必须谨慎执行，因为 AI 未必能立即将新涂漆路面归因为艺术性或信息性，而非城市重新绘制了新的交通控制标记。\n\
  \n## 结论\n\n我们有理由假设，如果设计得当，AI 总体上能应对路面上的额外涂漆标记。但还有个额外的转折。\n\n既然未来几十年我们将面临人类驾驶汽车与\
  \ AI 自动驾驶汽车混行的局面，如果人类驾驶员因涂漆路面而失态，选择鲁莽驾驶或不专心驾驶，自动驾驶汽车撞上此类车辆，或人类驾驶汽车撞上自动驾驶汽车的几率就会增加。\n\
  \n无论如何, 人们不禁会想：如果 AI 充分进步, 它有一天行驶途中检测到绘画艺术壁画或涂漆大块字母信息时, 能否稳健地“理解”那是什么, 甚至就涂漆路面方面的含义和实质与乘客展开发人深省的对话?\
  \ 时间会给出答案。\n\n\n\n\n# 第 6 章：警察向车辆开枪与 AI 自动驾驶汽车\n\n\n\n# 第六章 警方向车辆开枪与 AI 自动驾驶汽车\n\
  \n社会所面临的最具争议的警务话题之一，是执法人员是否应该向行驶中的车辆开枪。总体而言，对于这一沉重话题，似乎出现了三种主要观点。\n\n有人坚持认为这种行为永远不应被允许。特别强调的是，这意味着无论环境如何，警察永远不得向行驶中的车辆开枪，绝无例外。\n\
  \n另一些人则表示，这种行为可以实施，但仅限于极少数情况，允许存在值得采取这种极端行动的特殊例外。\n\n还有人认为，这种行为可以在执法职责履行过程中进行，警官最终需要为其行为辩护，而试图规定一个狭窄的预先指定的可实施此类行动的范围，会不当地阻碍警官，使其生命面临过度风险，并可能同样使其他无辜者处于危险之中。\n\
  \n简而言之，这三种主要立场可描述为：\na) 永不允许\nb) 极少允许（甚至从不允许）\nc) 视情况允许\n\n## “永不允许”视角的论据\n\n持“永不允许”观点者通常会辩称，一旦你接受另外两个选项作为考量对象，你就打开了潘多拉魔盒。对他们而言，这是一个严格的二元问题，答案要么是允许向行驶车辆开枪，要么是彻底禁止。一旦进展到“允许”的观点，“永不允许”派倾向于认为会出现大量实例，其中一些可能是真实的，但另一些则不是；与其冒着产生非真实实例的风险，不如彻底切断这一选项。实质上，“永不允许”之外被视为一条滑坡，因此主张完全不允许任何滑坡可能性，坚守“警官永远不得向行驶车辆开枪”这一原则。\n\
  \n你可能最近在媒体上听到或看到过关于这一颇具争议和问题的激烈对话和尖锐辩论。近期关于警务的新闻报道有时会提到一项运动，旨在让警方采纳八项政策，称为“8 Can’t\
  \ Wait”准则。该运动坚定的八条规则之一是，警官应在“所有情况下”被禁止向行驶车辆开枪，如果没有这种政策就会存在“漏洞”，因此向行驶车辆开枪应被“绝对禁止”。\n\
  \n## 法律现状\n\n你可能想知道法律目前对此类事项有何规定。总体而言，美国联邦法律和指南遵循几项相关最高法院裁决的建议，每项裁决最终都取决于对第四修正案的含义的理解。你可能记得第四修正案规定：\n\
  > “人民的人身、住宅、文件和财产不受无理搜查和扣押的权利，不得侵犯。除非有合理根据，以宣誓或代誓宣言作保证，并详细说明搜查地点和扣押的人或物，不得发出搜查和扣押令。”\n\
  \n在 1985 年`Tennessee v. Garner`案的最高法院裁决中，关于第四修正案的含义，法院判决：如果“警官有合理根据相信嫌疑人对警官或他人构成死亡或严重身体伤害的重大威胁”，警官可以使用致命武力防止嫌疑人逃跑，但如果不存在这些条件，则不得如此做。简而言之，这是“极少允许”和/或“视情况允许”方法的一种变体，绝不是“永不允许”的方法。\n\
  \n其他相关的最高法院判决还包括`Graham v. Connor` (1989)、`Plumhoff v. Rickard` (2014)、`Mullenix\
  \ v. Luma` (2015) 等案件，这些案件进一步细化或强化了与“允许”情况相关的关键特征。\n\n同时，各州有时会选择规定自己的规则，推测是与美国最高法院作出的总体观点保持一致。请注意，各州如果愿意，可以选择采纳“永不允许”规则。\n\
  \n此外，使情况在一定程度上复杂化的是，美国约有 18,000 个执法机构，它们也可以规定自己的规则，只要在其州规则和美国最高法院裁决的推定范围内即可。结果被批评为笨重的大杂烩。一些警局采纳了“永不允许”，而另一些则采纳了“允许”变体。此外，随着时间的推移，一些警局已经改变了规则的采纳，从一种方法转向另一种方法。这似乎表明，无论选择哪种方法，都有合理的论据，尽管身处特定方法中的人倾向于强烈辩称他们的方法是唯一真正有效的，而其他方法显然是错误的。一些人虽然矛盾，但选择了某种方法，希望这是手头“最佳”的选择，但愿意根据事态发展重新考虑，如果改变似乎值得，则持开放态度。\n\
  \n## 向行驶车辆开枪的复杂性\n\n你可能想知道为何对此主题存在如此不同的意见。让我们简要深入探讨此事。\n\n与电影中看到的不同，向行驶车辆开枪并非简单行动。\n\
  \n首先，考虑到行驶车辆本质上可以是一种多吨重的致命武器。车辆可被驾驶员用来撞倒人群，或撞向其他车辆，或冲撞物体等。\n\n其次，行驶车辆的驾驶员本身可能直接持有致命武器，或许持有手枪或挥舞枪支，甚至可能向车外人员开枪，或威胁射击车内其他人。实质上，存在潜在的双重威胁：利用车辆作为致命武器的威胁，以及驾驶员持械并为致命目的使用武器的威胁。\n\
  \n假设一名警察站在车辆前方，车辆以一种显示驾驶员意图撞倒警官的方式行驶。警察能否使用枪支尝试射击驾驶员？理论上，射击驾驶员将阻止其撞倒警官。但试图射中行驶车辆中的驾驶员并非稳操胜券，这同样不像电影和电视剧中那样。\n\
  \n有人指出，警官的子弹可能击中并伤害车内其他人，他们可能并非意图撞倒警官，或者实质上是被驾驶员绑架的无辜者。子弹也可能跳弹或完全偏离，击中无辜旁观者。此外，即使驾驶员中弹，驾驶员可能仍能驾驶汽车，或因丧失能力无法驾驶，导致汽车失控成为一种误导性武器，可能撞倒旁观者等。\n\
  \n或许警官应该向车辆射击，试图使汽车失能，而不是射击驾驶员，因为汽车本身是更大的目标，更容易击中。这并不像你想象的那样是一个现成的解决方案。常规警用枪支不太可能充分穿透车辆以以某种方式停止发动机或制止汽车，至于那些认为应该射爆轮胎的人，用子弹击瘪现代轮胎比电影中描绘的要难得多。\n\
  \n作为对警官子弹可能偏离预定目标这一可能性的反驳论点，持“有时允许”观点的人可能会说，如果有机会阻止驾驶员杀害或伤害他人，这似乎是一种潜在值得的努力，手头的情况在权衡下可能通过警官采取此类行动来挽救生命。总体而言，涉及大量概率和不确定性。\n\
  \n“永不允许”视角断言，警察不应做出这类判断，而应考虑采取其他行动，但不得向车辆开枪。确实，有人质疑为何警官允许自己陷入驾驶员可行地威胁撞倒他们的姿态，或者警官仅能跳出车辆路径。另一些人则反驳认为，认为警官总能避免陷入这种困境是不现实的，而且“警官只需跳开”这一观点极其牵强且不现实。\n\
  \n警官被撞倒的场景只是“有时允许”观点可能出现的情况的一个切片。假设驾驶员驶向人行道，一些行人可能会被撞倒。在这种情况下，警官可能不处于迫在眉睫的危险中，但那些无辜旁观者处于危险中。警察能否使用枪支尝试射击驾驶员？当面对这类例子时，许多人往往发现自己难以坚持“永不允许”规则，因为他们看到了权衡：让警官开枪试图防止更大规模的潜在死亡，即使警官发射的子弹偏离目标或最终未能阻止混乱，至少尝试了并有机会遏制可能随之而来的伤害和死亡的全部程度。\n\
  \n还要注意，这些通常是生死攸关的时刻，必须实时采取行动，这意味着有时几乎没有时间考虑所有选项及其潜在的不确定性。具有讽刺意味的是，这种时间缺乏和紧迫感可以被辩论双方利用：即“永不允许”派主张瞬间决定不应被允许，而“有时允许”派则辩称这展示了对灵活性和依赖警官当下做出关键可能挽救生命决定的需求。\n\
  \n对于警官可能以挽救生命方式行事的任何此类情况，“永不允许”派通常会反驳辩称，这需要与警官误解情况并做出错误选择的实例，以及“恶意行为者”警官选择利用局势并做出意图伤害且情节不支持的故意异常选择的实例进行权衡。\n\
  \n到目前为止，我们尚未考虑驾驶员在驾驶车辆时开枪这一层面，这肯定会增加双重致命武器使用的筹码。大量其他考量因素可能发挥作用。假设驾驶员有使用致命武力的犯罪记录。假设驾驶员撞击其他车辆并威胁那些车内人员的生命。假设正在进行车辆追逐。一些人会辩称无需进行车辆追逐，只让驾驶员继续行驶，在未来某个时机抓捕驾驶员，尽管反驳论点是驾驶员在被抓获前的这段时间内可能倾向于伤害他人。论点循环往复。\n\
  \n另一个棘手的转折涉及将汽车作为大规模杀伤性武器（WMD）使用。假设汽车塞满了炸药。驾驶员可能寻求将汽车不仅用作撞击装置，而是意图造成大量可怕的破坏。此外，驾驶员可能愿意在实施过程中死亡，成为自杀式炸弹袭击者。警察能否使用枪支尝试射击驾驶员？\n\
  \n关于警察向行驶车辆开枪的总体问题是一个令人生畏的问题，至今仍未被社会彻底解决。\n\n## 自动驾驶汽车作为新案例\n\n转换话题，考虑到我们将逐渐见证自动驾驶汽车的到来。这是一个引人入胜的问题：基于\
  \ AI 的真正自动驾驶汽车将如何改变我们对警察向行驶车辆开枪这一行为的看法？让我们拆解此事。\n\n首先，作为澄清，真正的自动驾驶汽车是指 AI 完全自主驾驶汽车，在驾驶任务中没有任何人类协助。这些无人驾驶车辆被视为\
  \ Level 4 和 Level 5，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为 Level 2 或 Level 3。共享驾驶任务的汽车被描述为半自动驾驶，通常包含各种自动化附加功能，称为`ADAS`（高级驾驶辅助系统）。目前尚无\
  \ Level 5 的真正自动驾驶汽车，我们甚至不知道这是否可能实现，也不需要多久才能达到。同时，Level 4 的努力正在通过进行非常狭窄和选择性的公共道路试验逐渐获得一些进展，尽管关于是否应允许这种测试本身存在争议。\n\
  \n由于半自动驾驶汽车需要人类驾驶员，采用这些类型的汽车不会与驾驶传统车辆有显著不同，因此在这方面没有太多新内容可讲（尽管，正如你稍后将看到的，接下来的观点通常适用）。\n\
  \n对于半自动驾驶汽车，重要的是公众需要被预先警告关于最近出现的一个令人不安的方面，即尽管那些人类驾驶员不断发布自己在 Level 2 或 Level 3 汽车方向盘前睡着的视频，我们都需要避免被误导，认为驾驶员在驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论\
  \ Level 2 或 Level 3 投入多少自动化，你都是车辆驾驶行为的责任方。\n\n## 自动驾驶汽车与向行驶车辆开枪\n\n对于 Level 4 和\
  \ Level 5 真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘客将是乘客。AI 正在驾驶。\n\n乍一看，你可能会假设既然没有人类驾驶员，就永远不需要考虑向自动驾驶汽车开枪。也许是，也许不是。\n\
  \n假设自动驾驶汽车内的一名乘客持枪向旁观者射击。警察能否使用枪支尝试射击该乘客？看来即使自动驾驶汽车到来，我们也无法回避这个问题。你可以使用之前相同的论点，断言警官的子弹可能偏离目标，因此你可能仍会辩称“永不允许”是正确规则，或者你可能持“有时允许”观点，指出如果情况似乎适用，警官可以继续尝试射击乘客，希望击中乘客并阻止乘客使用武器造成的后续惨剧。\n\
  \n有人会迅速提出，应通过电子通信指示 AI 将车辆驶向偏远地点，从而防止射击乘客伤害任何人。这可能行得通，但谁将发送此指令，而在建议的行程期间，仍在向旁观者射击的乘客怎么办？\n\
  \n关于当局在认为必要时如何重定向或停止自动驾驶汽车的争议和权衡的更多细节。\n\n回顾一下，我们之前承认存在双重武器的可能性，即驾驶员（现在是乘客）可能有武器，同样，汽车本身也可被用作武器。自动驾驶汽车的出现至少是否消除了关于自动驾驶汽车本身被用作致命武器的担忧？\n\
  \n你可能会认为自动驾驶汽车以某种方式被用作武器是不可想象的。你无疑会假设车载 AI 系统会被编程为避免撞击人员和其他车辆，因此 AI 不会允许车辆本身成为武器。人们推测，如果警官站在自动驾驶汽车前，它会忠实地自动停下或以其他方式避免撞击警官，因此汽车本身将不再可作为武器。\n\
  \n许多场景揭穿了这种简单性。\n\n假设一辆自动驾驶汽车以每小时 65 英里的速度在高速公路上行驶，车内有乘客在射击，且已知汽车装满了炸药。这辆自动驾驶汽车确实现在是一种武器，尽管\
  \ AI 并不知情。请注意，当今的 AI 不具备任何常识推理的雏形，它没有知觉，奇点发生的几率充其量很小，所以不要假设 AI 驾驶系统将是全知的。\n\n简而言之，基于\
  \ AI 的真正自动驾驶汽车的出现将受到我们今天面对传统汽车时相同现实的阻碍，尽管无疑会有不同的曲折（例如，向一辆完全没有乘客的自动驾驶汽车开枪，这提供了自己的一套难题）。\n\
  \n## 结论\n\n大多数汽车制造商和自动驾驶汽车技术公司可能会辩称，这整个问题是一个边缘情况或极端情况，意味着它很少发生，目前不需要关注，特别是因为他们沉浸在仅让自动驾驶汽车在日常情况下安全驾驶中。不幸的是，现实世界最终将追上自动驾驶汽车这一非凡创新，我们将共同需要回答一些棘手和困难的伦理问题。AI\
  \ 的出现不一定能克服艰难的伦理困境，毫无疑问，它有可能将新的困境推向前台。\n\n\n\n\n# 第 7 章：美国联邦测试日志与 AI 自动驾驶汽车\n\n\n\
  \n\n\n# 第 7 章 美国联邦测试日志与 AI 自动驾驶汽车\n\n美国联邦特许的汽车安全机构 NHTSA（National Highway Traffic\
  \ Safety Administration，国家公路交通安全管理局）今日宣布推出一项新的在线日志，用于显示全国范围内自动驾驶汽车（AV）公共道路测试工作的持续状态，包括自动驾驶汽车的测试。该计划被称为\
  \ AV TEST 倡议，是 **Automated Vehicle Transparency and Engagement for Safe Testing**（自动驾驶汽车透明度与安全测试参与）的朗朗上口的首字母缩写。公众将能够在线查看日志，并注册以便在发布最新信息时收到电子邮件通知。\n\
  \n正如 AV TEST 网站所述：“您将能够了解您所在社区是否有测试活动报告，并了解正在发生的活动类型，包括各类机动车辆的测试——汽车、低速摆渡车、卡车和无人驾驶电动配送车辆。”\n\
  \n今日启动仪式的发言人包括美国交通部部长 Elaine L. Chao、国家公路交通安全管理局副局长 James C. Owens、联邦公路管理局局长 Nicole\
  \ Nason 以及美国交通部交通政策副助理部长 Finch Fulton。会议理所当然地强调，目前尚无任何真正的自动驾驶汽车可供公众购买，澄清半自动驾驶汽车与全自动驾驶汽车之间的区别至关重要。正如\
  \ NHTSA 副局长 James Owens 精辟指出的：“首先，目前没有配备自动驾驶系统的车辆可供公众购买，公众今天能买到的任何车辆都无法自动驾驶。它需要一名积极、专注且全神贯注的驾驶员，随时准备采取行动。”\
  \ 我稍后将对此详细阐述。\n\n一个必须牢记的关键警示是，该日志基于部署自动驾驶车辆者的自愿提交，这意味着汽车制造商和自动驾驶汽车公司可以选择发布其状态，也可以选择不发布。此外，当他们发布状态时，信息可能已相当陈旧，不一定反映其最近的活动。尽管如此，提供一个集中且易于使用的日志，希望能得到广泛欢迎，并能被所有人及时、有效地使用。这在集中管理方面尤为受欢迎，因为目前允许自动驾驶车辆测试的众多州在报告工作上差异巨大。一些州要求年度报告，一些州缺乏任何可行的报告，情况混乱不堪，难以全面掌握。\n\
  \n据称，目前已有九家公司报名使用新的 AV TEST 日志，包括 Fiat Chrysler、Toyota Motor、Cruise、Local Motors、Navya、Uber\
  \ Technologies Inc.、Nuro、Beep 和 Waymo。AV TEST 的一项实用功能将是在线地图工具，允许公众放大查看公共道路测试工作的具体地点，从而确定自动驾驶车辆是否在您附近行驶。此外，车辆类型、使用频率、使用日期、行驶路线及其他相关信息也可能通过日志获得。据报道，目前已有八个州报名使用新日志，包括加利福尼亚州、佛罗里达州、马里兰州、密歇根州、俄亥俄州、宾夕法尼亚州、德克萨斯州和犹他州。\n\
  \n州和地方机构在 AV TEST 网站记录数据的原因，是为了表明其辖区内采用何种立法来监管自动驾驶测试，也可能包括发生自动驾驶不利事件时的应急响应计划。关于美国交通部（USDOT）在自动驾驶汽车方面的举措总体信息，包括一系列重要政策声明，最新的是\
  \ AV 4.0《确保美国在自动驾驶汽车技术方面的领导地位：自动驾驶汽车 4.0》，请访问 USDOT 网站。\n\n同时，请注意，关于监管自动驾驶汽车的联邦立法在国会持续停滞，部分原因是政治立场分歧，最近则是由于大流行病和其他立法事务的优先关注。似乎短期内不太可能完成此类立法，尤其是临近\
  \ 11 月大选，因此至少要明年才能指望出台针对自动驾驶汽车的新联邦法规。有人强烈主张需要更多法律法规来约束自动驾驶行业，确保实现“**全民出行**”的宏伟愿望，并实施比行业自行选择更强有力的安全措施。同时，也有人希望改变被视为阻碍自动驾驶汽车进步的现有法律，宣称这些法律延缓了“**全民出行**”的希望，阻碍了减少人为驾驶导致生命损失的预期目标。此类立法应包含的具体内容和性质一直是长期的拉锯战，除非出现其他紧迫情况，否则这种局面可能持续下去。\n\
  \n## 了解自动驾驶汽车的级别\n\n作为澄清，真正的自动驾驶汽车是指 AI 完全自主驾驶车辆，驾驶任务中无需任何人工协助。这些无人驾驶车辆被视为 Level\
  \ 4 和 Level 5，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为 Level 2 或 Level 3。共同分担驾驶任务的汽车被称为半自动驾驶汽车，通常包含各种自动化附加功能，称为\
  \ ADAS（**Advanced Driver-Assistance Systems**，高级驾驶辅助系统）。目前尚无真正的 Level 5 自动驾驶汽车，我们甚至不知道这是否可能实现，以及实现需要多长时间。同时，Level\
  \ 4 的工作正在通过非常狭窄和选择性的公共道路试验逐步争取进展，尽管关于是否应允许此类测试存在争议。\n\n由于半自动驾驶汽车需要人类驾驶员，因此采用这类汽车与驾驶传统车辆没有显著区别，因此在这方面没有太多新内容可讲（尽管稍后您会看到，接下来的观点普遍适用）。对于半自动驾驶汽车，重要的是公众需要被预先警告一个最近出现的令人不安的方面：尽管那些人类驾驶员不断发布自己在\
  \ Level 2 或 Level 3 汽车方向盘前睡着的视频，但我们都必须避免被误导，以为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论 Level\
  \ 2 或 Level 3 投入了多少自动化技术，**您都是车辆驾驶行为的责任方**。\n\n对于 Level 4 和 Level 5 真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘员均为乘客。AI\
  \ 正在驾驶。\n\n## 媒体误报的可能性\n\n转换话题，考虑一下新 AV TEST 日志可能带来的后果很有必要。遗憾的是，可能无法适当使用该日志的一个群体是媒体，它们可能会曲解日志中发布的任何内容，甚至可能曲解日志中未发布的内容。例如，已有媒体报道称\
  \ AV TEST 日志将显示 Apple 自动驾驶汽车的测试地点。这是一种不体面的伎俩。虽然 Apple 可能会选择如此报告，但没有要求其必须这样做，我们将不得不拭目以待\
  \ Apple 会如何选择。目前 Apple 对其工作守口如瓶，人们不禁要问，它们是否会自愿分享其迄今为止在自动驾驶汽车方面相当隐秘的活动信息。\n\n另一个潜在的麻烦将是媒体关于脱离的报道和误报。从本质上讲，脱离是指在公共道路上测试的自动驾驶汽车被车载人类安全员接管驾驶的实例。安全员可能认为\
  \ AI 驾驶系统即将犯错，从而选择从自动驾驶系统手中夺回驾驶控制权。或者，AI 本身可能检测到需要人类安全员处理棘手驾驶情况的情形，并相应地移交驾驶权。媒体经常以各种不了解实情甚至奇葩创造的方式，误述脱离的意义和性质。其中一种方法是根据报告的脱离次数对自动驾驶工作进行排名，暗示脱离次数最少的尝试必定比脱离次数较多的尝试更先进、更成熟。这就是为什么这在最好的情况下也是误导性的。\n\
  \n假设公司 X 有 5 次脱离，公司 Y 有 20 次。看起来，如果仅以此为依据报告，公司 X 似乎比公司 Y 好得多。但假设公司 X 仅行驶了 100 英里，而公司\
  \ Y 行驶了 10,000 英里，我想您很容易意识到，公司 Y 的每英里脱离次数会少得多，这表明公司 Y 表现得比公司 X 好得多。即便如此，这仍然存在问题。正如自动驾驶行业众所周知的，并非所有里程都相同。如果一家公司选择在安静的郊区社区进行公开试驾，那些行驶的里程可能相对“容易”，假设车辆交通不多，驾驶情况温和。相比之下，在繁忙的市中心进行公开试驾，面对繁忙的交通、乱穿马路的行人和狂野的司机，这些里程与相对温顺的郊区环境截然不同。在所有这些考虑因素之上，脱离次数还可以被操纵。如果您担心必须报告脱离次数，一种方法是告诉安全员不惜一切代价避免脱离，以保持计数降低。从这个意义上说，报告机制可能会无意中激励不良行为，这具有讽刺意味，因为最初的意图可能是高尚的，旨在了解自动驾驶车辆的安全性能，却陷入了误报和恶意使用的泥沼。\n\
  \n简而言之，请警惕关于自动驾驶汽车的“**假新闻**”。AV TEST 日志可能会引发更多此类误导性和错误的报道。\n\n## 结论\n\n请勿误解，这并不意味着拥有这样一个全国性日志是不受欢迎的。日志非常有用，希望能被妥善利用，以激发讨论，推动关于自动驾驶车辆现状和未来的健康、有力的辩论。日志公开发布这一事实，或许有助于超越那些提供误读或持有其他偏颇观点的媒体。我们所有人都能够检查日志并得出自己的结论。此外，或许那些报道得当的媒体施加的压力，会迫使那些报道不当的媒体有所收敛。最重要的是，汽车制造商和自动驾驶汽车公司可能会因媒体报道而受到激励，在\
  \ AV TEST 日志中进行报告。换句话说，如果一家公司决定不在 AV TEST 日志中分享其信息，媒体报道将指出这一遗漏，并加大对该公司公开其数据的压力。当然，恶劣的报道可能会阻碍一些公司分享信息，并被指为自愿报告与不报告同样麻烦的证据，因为共享的任何内容都可能被误述或歪曲。最终，希望新的\
  \ AV TEST 日志能被各方有效利用，我们将共同庆幸拥有这样一个日志。时间会给出答案。\n\n# 第 8 章 驾车枪击案\n\n\n\n\n# AI 与自动驾驶汽车\n\
  \n# 第 8 章 车辆枪击案与 AI 自动驾驶汽车\n\n车辆枪击案持续见诸报端，且似乎以惊人的速度频发。实施这一恶劣行径的人往往基于一个信念：他们不会被抓住。原因如下。借助汽车，肇事者可以在车内某种程度上隐蔽行踪，从外部不易被察觉，并能迅速接近其预定开枪的地点，事后还能迅速驾车逃离。总而言之，汽车为实施车辆枪击案提供了几个关键要素。\n\
  \n汽车是一种保护伞。它有助于伪装或隐藏肇事者。被针对者不一定意识到车内藏着想向他们开枪的人。此外，如果被射击的预定目标在首轮枪击后试图还击，汽车便充当了一种盾牌。因此，汽车作为实施车辆枪击案的工具很是顺手，因为它提供了一种保护掩护。\n\
  \n汽车有助于迅速实施车辆枪击行为。在车辆枪击案中，速度往往是肇事者赖以依靠的关键战术。如果他们像步行那样缓慢接近预定目标，可能会被发现，从而遭遇先发制人的打击，或者目标可能有时间躲藏或逃跑。肇事者开枪后，可能会面临反扑，但有了汽车，他们就能迅速驶离现场。\n\
  \n可以说，汽车增强了肇事者实施车辆枪击案的意愿。实施车辆枪击案的人，因身处车内而潜在地获得壮胆，感觉不那么脆弱，并获得一种匿名感，认为没人必然知道是他们干的。在某些情况下，肇事者会故意伸出车窗让预定目标知道是自己干的，却以为这样做只会向受害者暴露身份，而不至于轻易向其他潜在目击者暴露其犯罪行为。\n\
  \n关于车辆枪击案的统计数据记录有些零散，且在全国范围内并未特别详尽地登记。一项先前研究车辆枪击案数量的研究得出了一些有趣且暂行的迹象（使用这些结果时请谨慎，因为这是一项定点研究，且存在其他局限性），包括：\n\
  \n*   约一半的车辆枪击案发生在被针对的住宅\n*   其他地点包括街角、停车场、篮球场、公交车站等\n*   车辆枪击案倾向于发生在夜间，通常在下午 7\
  \ 点至午夜之间\n*   高发月份在夏季，低发月份在冬季\n*   涉及帮派是常见的深层因素\n\n总体而言，这些被列举的特征似乎符合直觉，即车辆枪击案倾向于在夜间实施，利用黑夜作为额外掩护，且更多发生在夏季（人们户外活动增多），地点多在住宅附近（推测目标为人熟知或可能居住之处），以及其他可能容易发现预定受害者的优质地点。\n\
  \n所列车辆枪击案总数排名前 10 的州依次为（从多到少）：\n\n*   加利福尼亚州\n*   德克萨斯州\n*   佛罗里达州\n*   伊利诺伊州\n\
  *   华盛顿州（与伊利诺伊州并列）\n*   俄克拉荷马州\n*   北卡罗来纳州\n*   佐治亚州\n*   纽约州\n*   路易斯安那州\n\n\n\n\
  \n## 某些州制定了专门针对“驾车枪击”的法律\n\n某些州制定了专门针对“驾车枪击”的法律，这从一个侧面表明了这一绝对违法行为的性质及其后果。除了对预期受害者造成的伤害外，驾车枪击必然会造成附带损害，可能波及无辜旁观者。枪手可能会倾泻多轮弹药，以一种撒网般的方式射击，企图击中预定目标，然而可怕的是，那些子弹可能会飞向并击中旁观者。子弹击中他人的另一个原因是，车内的枪手大概无法像平时那样轻易瞄准预定目标，因为他们必须在车内进行瞄准，即使伸出手臂试图将枪支稍微伸出车外，结果也很可能是瞄准不准（枪手无疑也紧张焦虑，影响了枪支的精准射击）。汽车通常处于运动状态，尽管可能已减速，但这仍增加了精准瞄准受害者的困难因素，潜在的目标距离也是如此，因为汽车极有可能在道路上，而目标距离街道有一定距离（这也解释了为什么有时会利用公交车站或街角，因为它们提供了更近的目标）。\n\
  \n## 为什么人们要实施驾车枪击？\n\n一个显而易见的意图是与帮派有关。敌对帮派可能试图射杀目标帮派中的某人。试图通过走近来接近预期目标可能很困难，也许是因为目标被同伙组成的保护力量包围，因此快速的驾车枪击似乎提供了一个让受害者措手不及并允许枪手安然逃脱的机会。驾车枪击可能意在杀人，却最终只导致受害者受伤；或者可能意在致伤，却导致受害者（或他人）死亡。驾车枪击经常会导致报复行为，因此一次驾车枪击可能引发双方随后的一连串驾车枪击。这提供了一种乘数效应，并且从某种意义上说，可以在社会层面上并以病毒式传播的方式触发一系列驾车枪击事件。人们实施驾车枪击的其他原因包括吸毒或醉酒，在受损状态下选择实施驾车枪击，也许由于中毒而感到膨胀。驾车枪击可能是经过计划和精心实施的，也可能是临时起意、即兴发生的。存在突发路怒的实例，车辆驾驶员对另一名驾驶员或行人感到愤怒，拔枪向感知到的冒犯者开枪。预期目标可能是被单独挑选的，也可能是随机选定的。法律通常会考虑驾车枪击是否为故意实施，以及是否带有恶意。有时，枪手就是驾驶员，一人身兼两役；而在其他情况下，有专门的驾驶员，而枪手严格来说只是乘客。理论上，实施射击的乘客负担较轻，因为他们不需要驾驶，可能更能瞄准受害者。\n\
  \n## 为什么驾车枪手不一定会被抓获\n\n总而言之，这将我们带到了一个最终的、总体的观点和重要问题，即为什么驾车枪手不一定会被抓获，无论是在枪击发生当时，还是事后（同样，关于被抓获几率的统计数据很难获得，看来当涉及帮派时，被抓获的可能性往往较小，因为敌对帮派大概不太可能报案）。你理所当然地可能会认为，肇事者应该比较容易被抓获，简单的原因是他们使用汽车作案。人们会认为，使用汽车会有一个缺点，即汽车本身是推断枪手潜在身份的一种手段。汽车是一个大物体，非常显眼，而且很可能有车牌。目击驾车枪击的人通常能模糊地描述车辆，或许能指出品牌和型号，以及油漆颜色等其他特征，但不太可能完整地看到车牌号码。考虑到事发时的匆忙和目击枪击发生时的震惊，以及车牌本身可能难以看清或被故意遮挡，这种无法辨认车牌的情况是合情合理的。\n\
  \n## 基于 AI 的真正自动驾驶汽车会成为威慑力量吗？\n\n暂且转换话题。假设有一种更好的方法来检测和追踪驾车枪击的发生。想象一种改进的检测和追踪方法或途径，它可能会显著削弱肇事者“注定能逃脱这一暴行”的假设。这可能会导致驾车枪击减少。会有什么这样的手段呢？考虑这个有趣的问题：基于\
  \ AI 的真正自动驾驶汽车的出现，会成为遏制驾车枪击行为的威慑力量，并有可能减少或遏制这一祸害吗？让我们拆解此事，一探究竟。\n\n## 理解自动驾驶汽车的等级\n\
  \n作为澄清，基于 AI 的真正自动驾驶汽车是指 AI 完全自主驾驶汽车，在驾驶任务期间无需任何人工协助。这些无人驾驶车辆被视为 4 级和 5 级，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为\
  \ 2 级或 3 级。共同分担驾驶任务的汽车被描述为半自动驾驶，通常包含各种自动化附加功能，称为 `ADAS`（高级驾驶辅助系统）。目前尚不存在 5 级的真正自动驾驶汽车，我们甚至不知道这是否可能实现，也不清楚需要多长时间才能达到。与此同时，4\
  \ 级的努力正在通过经历非常狭窄且具有选择性的公共道路试验，逐渐尝试获得一些进展，尽管关于是否应允许这种测试本身存在争议。由于半自动驾驶汽车需要人类驾驶员，采用这类汽车与驾驶传统车辆不会有显著不同，因此在这方面没有太多新内容可讲（尽管，正如你稍后将看到的，接下来的观点通常也适用于它们）。对于半自动驾驶汽车，重要的是公众需要被预先警告一个最近出现的令人不安的方面，即尽管那些人类驾驶员不断发布自己在\
  \ 2 级或 3 级汽车方向盘前睡着的视频，我们都需要避免被误导，以为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论 2 级或 3 级汽车投入了多少自动化技术，你都是车辆驾驶行为的责任方。\n\
  \n### 自动驾驶汽车与驾车枪击\n\n对于 4 级和 5 级真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘员都将是乘客。AI 正在驾驶。让我们回到关于驾车枪击的问题。你的第一反应可能是，既然真正自动驾驶汽车这一惊人创新被用于这种卑鄙和肮脏的方式，让人不寒而栗，所以将不再有任何驾车枪击。抱歉，驾车枪击并不会仅仅因为自动驾驶汽车的出现而完全消除。还请记住，自动驾驶汽车大规模推广可能需要很多年，甚至几十年，因此在很长一段时间内，人类驾驶汽车和自动驾驶汽车将共存。这意味着人类驾驶汽车仍将被使用，并可能继续参与那些卑鄙的驾车枪击。\n\
  \n接下来专门关注自动驾驶汽车。一个卑鄙的人能利用自动驾驶汽车实施驾车枪击吗？当然，为什么不。考虑以下场景。一个藏有枪支的人上了自动驾驶汽车，冷静地指示 AI\
  \ 驶向特定目的地，利用车载自然语言处理（`NLP`）系统功能，类似于使用现在的 Alexa 或 Siri。预计 AI 驾驶系统将允许乘客指定途经点，例如去看望亲戚的路上顺道去超市。持枪的作恶者可以告诉\
  \ AI 驶过特定住宅、街角或任何想去的地方，这不会引起 AI 系统的任何过度怀疑，而只是任何典型驾驶行程的预期部分。接近目的地时，枪手可能会要求 AI 减速，然后仅仅打开车窗，向心中目标开枪。之后，枪手可能会要求\
  \ AI 加速，迅速前往其藏身地点。请注意，枪手不驾驶汽车，因此纯粹处于乘客角色，这意味着他们可能更能熟练地瞄准射击，而不被驾驶任务分心。对于那些想利用自动驾驶汽车进行驾车枪击活动的人来说，这是一个不幸的“优势”。还要注意，枪手可能公然计划实施驾车枪击，也可能只是随身携带枪支，随机决定开枪，也许是基于偶然看到想射击的人而伺机行动。自动驾驶汽车可能以这种令人震惊的方式被使用，这是一个悲哀的事实。当我提到驾车枪击可能发生在使用自动驾驶汽车时，一些人震惊不已，坚持认为我们不应讨论这种可能性，否则会在意图实施驾车枪击的人心中埋下种子。请知道，掩耳盗铃的做法是不明智的，一旦人们发现可以利用自动驾驶汽车达到此目的，所有人都会措手不及，完全不知所措。相反，更明智的方法是尝试以一种能够寻求减少或缓解某人在自动驾驶汽车内实施驾车枪击几率的方式来开发和部署自动驾驶汽车。让我们考虑如何着手实现这一点。\n\
  \n在设计自动驾驶汽车的自然过程中，一个预先存在的阻碍因素是：推测 AI 不会猛踩油门、轮胎尖啸着从枪击现场逃离。总的来说，大多数汽车制造商和自动驾驶技术公司都在努力确保\
  \ AI 文明驾驶，当然也在限速范围内驾驶。预期实施驾车枪击的人无法像他们或同伙驾驶传统汽车那样迅速逃离现场。但他们仍然可以开枪，而且他们甚至可能不要求 AI\
  \ 减速，车辆可能已经在以允许的任何限速行驶。关键在于，基于 AI 的真正自动驾驶汽车的合法驾驶活动本身并不排除驾车枪击，只是使其更加麻烦，并可能降低对肇事者的吸引力。\n\
  \n不过，自动驾驶汽车还可以做更多来破坏驾车枪击。大多数自动驾驶汽车将配备面向内部的摄像头和音频系统，用于查看和聆听车内乘客。这对于想要检测乘客是否在车内涂鸦或损坏座椅和内饰的网约车和租赁公司来说，可能特别受欢迎。我反复指出，这将引发有争议的隐私问题，包括自动驾驶汽车车队所有者如何使用或分发此类视频记录。无论如何，配备面向内部摄像头的自动驾驶汽车似乎对任何驾车枪手都是一个显著的威慑，因为作恶者在实施其可耻行为时会被录像记录下来。这可能会让驾车枪手在采取此类行动前三思而后行。当然，枪手可以选择伪装，并可能使用假身份证作为租赁或网约车支付的一部分来使用自动驾驶汽车。遗憾的是，有志者事竟成。\n\
  \n自动驾驶汽车的另一个方面有助于潜在遏制驾车枪击，这与为驾驶目的捆绑在自动驾驶汽车中的大量最先进传感器有关。那些复杂的感官设备，如专用摄像头、雷达、`LIDAR`（激光雷达）、热成像、超声波等，将持续扫描自动驾驶汽车的周围环境。收集的数据被\
  \ AI 用作其“眼睛和耳朵”，用于确定往哪里开以及避开什么，如其他汽车和附近的行人。作为一个快速的旁注，这再次打开了另一个隐私潘多拉魔盒，因为现实是当一辆自动驾驶汽车驶过你的社区街道时，它很可能正在记录它检测到的一切。这可以通过\
  \ `OTA`（空中下载/空中接口技术）电子通信上传到基于云的系统，并与成千上万辆其他自动驾驶汽车的数据拼接在一起。由于这双游移的眼睛，你的隐私正处于风险之中。无论如何，对鹅好的（或坏的），对鹅也是好的（或坏的）。AI\
  \ 可能会基于面向内部的传感器和面向外部的传感器的组合，检测到枪支是从自动驾驶汽车内部发射的（即使手臂伸出车外），并能记录该行为，同时在驾驶行程中实时监控任何此类活动。\n\
  \n## 结论\n\nAI 可能会做什么？目前还没有人详细研究过这个问题，因此目前 AI 会是“毫不知情”的，不会采取任何行动。推测如果 AI 被编程为检测这种活动，它可以采取许多行动。一种行动是立即联系警察。另一种是让汽车停下来，这会让枪手陷入绝境，因此他们可能不想使用自动驾驶汽车，因为意识到这会让他们处于潜在猎物的掌控之下（这不一定是一种阻碍，驾车枪击者可能已预料到这一点）。自动驾驶汽车至少会有发生事件的记录，当当局试图追踪罪犯时，这可能会有用。不幸的是，这些都不是防止驾车枪击的铁\
  \ clad（坚不可摧/绝对可靠）方法（有些人做梦般地设想汽车会自动将人锁在车内并飞奔至最近的警察局，但这既是乌托邦式的也是反乌托邦式的，短期内甚至永远不会实现）。罪犯无疑会采用猫鼠游戏的方式，设法绕过\
  \ AI 的检测和行动，但这并不意味着我们不应尽可能设置许多障碍和门槛。目前，汽车制造商和自动驾驶公司忙于让自动驾驶汽车安全运行并投入日常使用，但很快现实世界就会追上自动驾驶汽车，需要设计更先进的方面来应对诸如驾车枪击这一威胁等问题。也许有一天\
  \ AI 会足够敏锐，能够主动发挥作用阻止驾车枪击者，劝说他们放弃卑鄙的行为。那是一种我们都能欣赏的造福社会的 AI。\n\n# 第 9 章 AI 伦理旋钮与\
  \ AI 自动驾驶汽车\n\nAI 系统正以相当快的速度被大量推出，与此同时，人们对这类 AI 是否会表现出合乎道德的行为存在相当大的担忧。关于 AI 伦理的担忧浪潮正在高涨。如何体现？考虑一个现实世界的例子。假设开发了一个\
  \ AI 应用程序来评估汽车贷款申请人。使用机器学习（`ML`）和深度学习（`DL`），AI 系统在大量数据上进行训练，并得出了一种方法，在其认为有贷款资格和没有资格的人中进行选择。底层的人工神经网络（`ANN`）在计算上极其复杂，没有明显的方法来解释它是如何得出所做决定的。此外，没有内置的可解释性能力，因此\
  \ AI 无法阐明为什么要做出它正在承担的那些选择（注：有一场朝着包含 `XAI`、可解释 AI 组件的运动，试图克服这一难以捉摸的障碍）。基于 AI 的贷款评估应用程序投入使用后，很快抗议声四起，一些人声称他们因种族或性别被不当地作为做出负面决定的关键因素，而被拒绝汽车贷款。起初，AI\
  \ 应用程序的制造商坚称他们没有使用这些因素，并自称完全无辜。然而结果表明，第三方对 AI 应用程序的审计揭示，`ML`/`DL` 确实在汽车贷款评估过程中将种族和性别作为核心特征使用。在神经网络数学上晦涩难懂的元素深处，与种族和性别相关的数据被复杂地编织进了计算中，这些数据是在\
  \ `ANN` 构建时提供的初始训练数据集中挖掘出来的。这是偏见如何隐藏在 AI 系统内部的一个例子。它也展示了这种偏见如何可能不被察觉，包括 AI 的开发者没有意识到偏见的存在，并且似乎很自信地认为他们没有做任何导致偏见被纳入的事情。受\
  \ AI 应用程序影响的人可能没有意识到他们正遭受这种偏见。在这个例子中，那些受到不利影响的人碰巧注意到了并表达了担忧，但我们可能会目睹大量没人意识到他们正被迫服从于偏见的\
  \ AI，因此无法敲响警钟。\n\n各种团体和协会提出了各种 AI 伦理原则，希望那些打造 AI 的人认真对待在设计、构建、测试和部署 AI 的整个生命周期中拥抱\
  \ AI 伦理考量的必要性。我之前讨论过梵蒂冈发布的 AI 伦理原则和美国国防部的原则，也描述过经合组织（OECD）的原则，简要包括以下五大核心准则：\n\n\
  1. 包容性增长、可持续发展和福祉\n2. 以人为本的价值观和公平\n3. 透明度和可解释性\n4. 稳健性、安全性和保障性\n5. 问责制\n\n我们当然期望人类表现出合乎道德的行为，因此似乎也理应期望\
  \ AI 表现出合乎道德的行为。既然 AI 的理想目标是提供与人类智力相当的机器，推定能够具备人类所拥有的同等范围的认知能力，这或许意味着我们只有通过包含某种形式的伦理相关组件或能力，才能实现\
  \ AI 的崇高目标。这意味着，如果人类蕴含伦理（他们似乎确实如此），而 AI 试图达到人类的所是与所为，那么 AI 应该拥有注入的伦理能力，否则它将低于实现人类智能这一预期目标。你可以声称，任何打造不包含伦理设施的\
  \ AI 的人，都在削弱任何值得称道的 AI 系统应有的关键且不可或缺的方面。当然，试图实现 AI 的目标是一回事，与此同时，既然我们将身处一个充满 AI 的世界，为了我们作为人类的安全和福祉，我们理所当然会主张\
  \ AI 最好切实遵守道德行为，无论这可能如何实现。\n\n既然我们已经涵盖了那一方面，让我们花点时间思考伦理和道德行为的本质。人类总是表现合乎道德吗？我想我们都能轻易同意，人类不一定总是以严格合乎道德的方式行事。人类的道德行为能否仅通过某人是否处于道德二元状态来描述，即要么纯粹合乎道德，要么完全不道德？我敢说，我们并不总能将人类行为钉死在两个基于二元、互斥的桶里，即要么合乎道德，要么不道德。现实世界通常比那灰暗得多，我们有时更倾向于评估某人正在做一些道德上存疑的事，但这既非纯粹不道德，也非完全合乎道德。从某种意义上说，你可以断言人类行为在伦理光谱上变化，有时完全合乎道德，有时则朝着刻度底端滑向完全且无可辩驳的不道德。中间有很大的余地供某人如何在道德上行事。如果你同意世界不是二元道德行为选择，即行为只适合纯粹合乎道德或仅仅是不道德，那么你大概也会接受这样一个概念：存在一个潜在的量表，我们可以据此对道德行为进行评级。这个量表可能是\
  \ 1 到 10 分，或者 1 到 100 分，或者我们可能希望分配的任何编号，甚至可能包括负数。让我们暂时假设我们将使用 1 到 10 的正数作为日益合乎道德的量表（最高为\
  \ 10），使用 -1 到 -10 的分数作为不道德（-10 是最不道德或换句话说是最不道德的潜在评级），零将是量表的中点。请不要纠结于量表编号，它可以是你喜欢的任何其他东西。我们甚至可以使用字母表或任何类型的滑动量表。要表达的观点是，存在一个量表，我们可以设计一些方法来建立一个适合这些事务的合适量表。\n\
  \n转折马上就来，所以请抓紧帽子。我们可以观察一个人，并根据他们所做特定方面的事情对其道德行为进行评级。也许在工作中，一个人因合乎道德地遵守规范而得 8 分，而在家里他们可能是个更狡猾的人，得\
  \ -5 分。好吧，所以我们可以给人类行为评分。我们能否通过使用量表来驱动或引导人类行为？假设我们告诉某人，在工作中他们正被观察，他们的目标是第一年达到 9 分的道德分数。推测他们将以一种有助于实现该分数的方式开展工作活动。从这个意义上说，是的，我们可以通过提供与道德期望相关的目标来潜在地引导或激励人类行为。我告诉过你会有转折，现在它来了。对于\
  \ AI，我们可以使用道德评级或分数来尝试评估 AI 的道德熟练程度。以那种方式，如果我们知道特定 AI 拥有良好的道德分数，我们可能会更放心地使用它。我们也大概可以寻求引导或驱动\
  \ AI 朝向一个道德分数，类似于如何对人类所做的那样，并可能指示 AI 应该努力达到道德量表上的某个上限。一些专家立即对这一概念退避三舍。他们辩称 AI 应该永远是\
  \ +10（使用我在此提出的量表）。任何低于满分的都是可憎的，AI 本不该存在。好吧，这把我们带回了早先关于道德行为是否处于二元状态的讨论。我们要对 AI 要求比人类“更高的标准”，坚持\
  \ AI 永远“完美”地合乎道德，不接受任何较低标准吗？这有点困境，因为 AI 总体上推定旨在达到与人类智力相当的水平，而我们并不要求人类达到同样的标准。一些人热烈地相信\
  \ AI 必须被要求遵守比人类更高的标准。我们绝不能接受或允许任何无法做到这一点的 AI。其他人指出，这似乎与关于人类行为的已知事实背道而驰，并引出了一个问题：如果\
  \ AI 必须做人类无法达到的事情，AI 是否能够实现？此外，他们可能会辩称，强迫 AI 做人类不做的事，现在偏离了达到与人类智力相当这一假定目标，这可能会因这种对伦理的坚持而使我们无法实现目标。这些辩论循环往复，持续不断。那些坚持\
  \ AI 必须是顶级道德的人往往迅速指出，允许 AI 低于满分，就是在打开潘多拉魔盒。例如，AI 可能会跌入负数区，停留在 -4，甚至更糟，堕落到令人痛苦的完全不道德，达到惨淡的\
  \ -10。无论如何，这是一场将持续且不易解决的辩论，所以让我们继续前进。\n\n如果你仍然认为伦理存在于一个量表上，并且 AI 也可能通过这种量表来衡量，如果你也愿意接受行为可以通过提供在量表上的位置来驱动或引导，那么是时候提出调节旋钮了。伦理调节旋钮。这是如何工作的。你接触一个\
  \ AI 系统并与其交互。AI 向你呈现一个伦理调节旋钮，展示一个类似于我们之前提出的伦理量表。假设旋钮当前在 6，但你希望 AI 的行为更符合 8，所以你将旋钮向上拨到\
  \ 8。此时，AI 调整其行为，使其在道德上表现出 8 分级别的道德合规性，而不是之前 6 分的设置。你怎么看？一些人会大声疾呼：胡说八道、废话、纯粹的荒谬。一个荒谬的想法还是天才之举？你会发现专家们站在硬币的两面。也许提供一个情境实例中的伦理调节旋钮会有所帮助，以突出它可能如何发挥作用。这里有一个方便的情境指示给你：基于\
  \ AI 的真正自动驾驶汽车可能会包含一个供乘客或使用自动驾驶车辆的乘客使用的伦理调节旋钮吗？让我们拆解此事，一探究竟。\n\n## 理解自动驾驶汽车的等级\n\
  \n作为澄清，真正的自动驾驶汽车是指 AI 完全自主驾驶汽车，在驾驶任务期间无需任何人工协助。这些无人驾驶车辆被视为 4 级和 5 级，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为\
  \ 2 级或 3 级。共同分担驾驶任务的汽车被描述为半自动驾驶，通常包含各种自动化附加功能，称为 `ADAS`（高级驾驶辅助系统）。目前尚不存在 5 级的真正自动驾驶汽车，我们甚至不知道这是否可能实现，也不清楚需要多长时间才能达到。与此同时，4\
  \ 级的努力正在通过经历非常狭窄且具有选择性的公共道路试验，逐渐尝试获得一些进展，尽管关于是否应允许这种测试本身存在争议。由于半自动驾驶汽车需要人类驾驶员，采用这类汽车与驾驶传统车辆不会有显著不同，因此在这方面没有太多新内容可讲（尽管，正如你稍后将看到的，接下来的观点通常也适用于它们）。对于半自动驾驶汽车，重要的是公众需要被预先警告一个最近出现的令人不安的方面，即尽管那些人类驾驶员不断发布自己在\
  \ 2 级或 3 级汽车方向盘前睡着的视频，我们都需要避免被误导，以为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论 2 级或 3 级汽车投入了多少自动化技术，你都是车辆驾驶行为的责任方。\n\
  \n## 自动驾驶汽车与伦理调节旋钮\n\n对于 4 级和 5 级真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘员都将是乘客。AI 正在驾驶。这看起来相当直截了当。你可能想知道任何伦理行为的影子从何而入。情况是这样的。一些人认为自动驾驶汽车应该始终严格遵守限速。想象一下，你刚上了一辆自动驾驶汽车，早上结果发现你可能上班要迟到了。你老板很较真，告诉你迟到是被解雇的铁板钉钉之路。你通过其自然语言处理（`NLP`）告诉\
  \ AI 目的地是你的工作地址。而且，你要求 AI 猛踩油门、推到金属踏板底、轮胎尖啸，准时送你到公司。但显而易见，如果 AI 遵守限速，绝对没有机会准时到达工作地点，既然\
  \ AI 只会且永远以限速或更低速度行驶，你的大限已到。下一份工作祝你好运。\n\n哇，假设 AI 驾驶系统有一个伦理调节旋钮。严格遵守限速发生在旋钮拧到最高数字如\
  \ 9 和 10 时。你把旋钮调低到 5，告诉 AI 你需要赶去上班，即使这意味着超速，而在 5 分时，意味着 AI 驾驶系统将轻微超速，虽然不在学校区域等地，且仅在交通状况似乎允许安全地比限速稍快一点点时。AI\
  \ 自动驾驶汽车准时送你到公司！那天晚上回家时，你不那么赶时间了，所以把旋钮调回之前的 9 或 10。此外，你在旋钮上设了儿童锁，这样当你的孩子使用自动驾驶汽车时（他们可以独自使用，因为不需要人类驾驶员），旋钮永远设在量表的最高端，孩子们无法更改它。这对你来说似乎如何？一些自动驾驶汽车专家认为这种调节旋钮的概念令人反感。他们指出，每个人都会“作弊”，把旋钮调到允许\
  \ AI 像人类今天那样进行劣质和危险驾驶的低分数。我们原本可能从自动驾驶汽车获得的任何收益，如期望减少车祸、相关伤害和死亡，将因调节旋钮的能力而失去。然而其他人指出，认为人们会忍受受限的、从不变通或违法的自动驾驶汽车是荒谬的。你最终会得到人们很少使用自动驾驶汽车，转而驾驶他们的人类驾驶汽车。这是因为他们知道自己可以开得更流畅，不会被困在一辆开得像只胆小鬼一样的自动驾驶汽车里。正如你所想象的，伦理调节旋钮的伦理影响是巨大的。在这个用例中，伦理调节旋钮预示的影响有一种显而易见性。其他类型的\
  \ AI 系统将有它们自己版本的伦理调节旋钮可能预示的含义，虽然可能不如自动驾驶汽车的情况那样显而易见，但在这些其他 AI 系统中也可能有同样多的利害关系（像自动驾驶汽车一样，可能涉及生死攸关的后果）。\n\
  \n## 结论\n\n如果你真的想让某人在伦理调节旋钮话题上激动起来，提一下电车难题这个相关话题。电车难题是一个著名的思想实验，涉及必须做出关于挽救生命的选择以及你可能选择哪条路径。这在自动驾驶汽车的背景下被反复提及，并引起了尖锐的关注以及截然相反的观点，关于它是否相关。无论如何，宏观的大问题是：我们将期望\
  \ AI 拥有伦理调节旋钮吗？如果有，它会做什么，如何被使用？那些坚持没有理由拥有任何此类装置的人，倾向于同样坚持我们必须拥有只且永远处于最高道德行为的 AI。这是一种乌托邦视角，还是可以在我们所知的现实世界中实现？只有我的水晶球能确定地说。\n\
  \n# 第 10 章 强大沙尘暴与 AI 自动驾驶汽车\n\n气象学家正在密切关注一些从撒哈拉沙漠缓慢漂移的超大规模尘羽，那些浑浊的云团已经降临在通常风景如画的加勒比海岛屿上，导致游客和当地人都发现自己沉浸在令人窒息的物质中。最近拍摄的圣巴泰勒米岛和安提瓜岛等岛屿上通常湛蓝的天空和辽阔的海洋的照片，生动地展示了尽眼力所及之处的一层肮脏的尘毯。忘记那些令人惊叹的海景吧，屏住呼吸以免吸入那片令人作呕的尘埃颗粒。在巴巴多斯，当局发布了严重沙尘霾预警，并敦促有呼吸困难的人采取特别预防措施，恳请他们待在室内，保护自己免受这难看的污秽侵害。这不受欢迎的尘埃已经逼近佛罗里达南部，旨在很快无情地蔓延至德克萨斯州和美国东南部大部分地区。居住在这些地区的人们中，有些已经习惯了撒哈拉空气层（`SAL`）每年吹向美国，特别是在夏季。你可以怪有利或不利的信风将这场尘埃入侵带到了我们的海岸。提防这爬行尘埃的入侵。好消息是，如果你想要一个大团圆结局版本的尘埃风波，将会有许多非常绚丽的日出和日落。这是由于尘埃和阳光在大气中相互作用，往往创造出一年中最引人注目、最值得快照留念的时刻。很难在宏伟的尘球中找到其他的快乐。当然，你可能会为科学理论感到欣慰，即撒哈拉带来的土壤中蕴含着关键营养，通过盛行风带过来，这意外的滋养丰富了佛罗里达和巴哈马海岸的珊瑚礁。这很好。另一方面，其他科学家争辩说，同样的尘埃同样可能危害珊瑚礁，可能从农业处理过的沙漠土壤中脱落污染物，甚至未受污染的泥土材料可能会过度施肥珊瑚水域，产生难看且不需要的藻华。看来巨大的尘羽是一种难以欣赏的现象。好吧，有一个期待巨大尘云的大理由，即它们被称为飓风粉碎机。空气中的浓厚尘埃似乎减少了飓风的数量和威力。尘埃带来的显著干燥已知会破坏飓风形成所需的湿气发展和积累。没有湿气，通常飓风会减少，强度也比原本可能的情况弱。你会选哪个？漫天飞舞的尘土像难看的毯子一样包围着你（但没有飓风），还是完美清澈的天空伴随着可怕的飓风？我想你更喜欢晴空万里且无飓风，虽然那似乎不是一个可选项，抱歉。无论如何，关于这最新的尘羽绝对有很多议论，国际空间站同样在密切关注这巨大的云团，包括船上宇航发布推文，惊叹于这特定尘球爆发的规模。遗憾的是，对于那些已经躲避在家的人，准备好再次就地避难吧，就当你以为可能有机会重新冒险走出户外时。除了这些沙尘暴显而易见的健康后果外，还有其他后果。你有没有在沙尘暴中开过车？如果没有，你很幸运，避免了在厚厚的飞土层中驾驶所带来的痛苦和极度恐惧。你的能见度大幅降低。行人似乎凭空突然出现，你经常在毫无察觉的情况下突然贴上前车的后保险杠。尝试使用雨刷无效，你迅速耗尽了发动机舱储液罐中的雨刷液。除了驾驶困难，你的车也不喜欢灰尘。如果灰尘完全进入引擎盖下，发动机可能会卡死，此外，在任何漫长的沙尘驾驶旅程后，你大概率不得不做一些维修。至于车漆，最好开始看看\
  \ Al 的油漆和钣金店是否营业，因为你将需要补漆一两处。无论如何，如果车能承受住灰尘的困难，主要担忧是任何在沙尘暴中驾驶的人都在增加发生车祸的风险。车祸不可避免地伴随着随之而来的伤害和死亡。人们应该在沙尘暴中缓慢且谨慎驾驶。奇怪的是，也许具有讽刺意味的是，似乎有一部分司机相信做完全相反的事。他们似乎认为开得越快越好。推测他们的逻辑是，你将在更短的时间内穿过沙尘暴，因此总体上的道路威胁暴露更少。这可能看起来像令人信服的逻辑，但它没有足够的依据，你应该减速并小心驾驶，或者最好在沙尘暴期间完全不上路。我确信一些以火箭般的速度驾驶并幸存了许多沙尘暴的人会抱怨并声称他们是活生生的证据，证明开快车是合理的方法。同情那些遇到这些“自由精神”司机的人，我只能希望迄今为止一直帮助他们的奇迹能在他们持续的疯狂飙车中继续生效。\n\
  \n说到驾驶，由于自动驾驶汽车的出现，我们最终可能会看到高速公路上要么没有人类驾驶员，要么人类驾驶员大幅减少的那一天。你可能想知道自动驾驶汽车面对沙尘暴会表现如何。这引出了一个有趣的问题：基于\
  \ AI 的真正自动驾驶汽车能否应对沙尘暴，它们的表现将与人类驾驶汽车相比如何？让我们拆解此事，一探究竟。\n\n## 理解自动驾驶汽车的等级\n\n作为澄清，真正的自动驾驶汽车是指\
  \ AI 完全自主驾驶汽车，在驾驶任务期间无需任何人工协助。这些无人驾驶车辆被视为 4 级和 5 级，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为 2 级或\
  \ 3 级。共同分担驾驶任务的汽车被描述为半自动驾驶，通常包含各种自动化附加功能，称为 `ADAS`（高级驾驶辅助系统）。目前尚不存在 5 级的真正自动驾驶汽车，我们甚至不知道这是否可能实现，也不清楚需要多长时间才能达到。与此同时，4\
  \ 级的努力正在通过经历非常狭窄且具有选择性的公共道路试验，逐渐尝试获得一些进展，尽管关于是否应允许这种测试本身存在争议。由于半自动驾驶汽车需要人类驾驶员，采用这类汽车与驾驶传统车辆不会有显著不同，因此在这方面没有太多新内容可讲（尽管，正如你稍后将看到的，接下来的观点通常也适用于它们）。对于半自动驾驶汽车，重要的是公众需要被预先警告一个最近出现的令人不安的方面，即尽管那些人类驾驶员不断发布自己在\
  \ 2 级或 3 级汽车方向盘前睡着的视频，我们都需要避免被误导，以为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论 2 级或 3 级汽车投入了多少自动化技术，你都是车辆驾驶行为的责任方。\n\
  \n## 自动驾驶汽车与应对沙尘暴\n\n对于 4 级和 5 级真正的自动驾驶车辆，驾驶任务中不会涉及人类驾驶员。所有乘员都将是乘客。AI 正在驾驶。就沙尘暴而言，不要错误地假设\
  \ AI 将是万无一失的，并且总能在浑浊的旋转泥土中驾驶。这一点值得提及，因为一些最近的民意调查和调查似乎表明，公众对自动驾驶汽车的理解是 AI 可以在任何情况下、任何环境下驾驶车辆。请记住，关于\
  \ AI 自动驾驶汽车的核心原则之一是，它们旨在能够在人类能够驾驶的相同领域内驾驶。如果熟练的人类驾驶员无法在特定环境下驾驶，则没有期望 AI 自动驾驶汽车能以其他方式做到。注意，这并不意味着\
  \ AI 自动驾驶汽车在这些情况下仍然不可能驾驶，但它不被视为一项“要求”本身。此外，人们经常震惊地发现，AI 标准化驾驶等级的范围不包括越野驾驶，因此，AI\
  \ 自动驾驶汽车没有要求或义务能够在越野环境下驾驶。我反复强调的一个恼人之处是，一些人倾向于不当地将 AI 驾驶系统称为“超人类”，这绝对是误导性的，并制造了极其危险的印象（包括埃隆·马斯克将特斯拉的\
  \ Autopilot 称为所谓的超人类）。目前，AI 驾驶系统在各方面不如人类，在其他方面可能更好，但它们并非完全高于人类驾驶。我们在该目标上还有很长的路要走。\n\
  \n好的，第一点是我们不应该也不能指望 AI 自动驾驶汽车一定能在沙尘暴中驾驶。你可能会困惑，既然它们塞满了最先进的传感器，包括专用摄像头、雷达、`LIDAR`（激光雷达）、热成像、超声波单元等，为什么它们会无法做到。拥有所有那些高科技装备，似乎它们一定能应对空气中的灰尘。抱歉，灰尘对\
  \ AI 的迷惑程度不亚于对我们人类。你可能知道 Waymo 在亚利桑那州凤凰城测试他们的自动驾驶汽车，这是一个沙漠地区，时不时会有沙尘暴。当沙尘暴变得足够大时，科学家将那些大型沙尘暴称为“哈布布”（haboob，强沙尘暴）。凤凰城山谷见过一些惊人的哈布布，有时高达数千英尺，横跨数百平方英里。关于\
  \ Waymo 自动驾驶车辆在亚利桑那沙尘暴中的短视频……这是当自动驾驶汽车试图在严重沙尘暴中驾驶时会发生的情况。首先，由于空气中尘埃颗粒的汇聚，摄像头检测道路场景的能力将下降。这种对驾驶视觉方面的遮蔽，与人类驾驶汽车时大致相同，即很难看清外面有什么。你可以争辩说摄像头仅用于捕捉视觉图像和视频，不像人类用眼睛审视周围环境时容易分心，因此摄像头比人类的眼球更可靠。此外，推测\
  \ AI 不会被驾驶任务的任何恐惧所击中，而人类可能会被恐惧吞噬，从而对道路不那么专注，更容易在可怕的情况下犯驾驶错误。是的，这些都是支持摄像头有利于应对沙尘暴的理由。另一方面，那些摄像头有镜头，如果镜头被飞掠的灰尘划伤或弄脏，你突然就有了一个不再拥有完全可行图像的摄像头。摄像头可能会被一团泥土和灰尘完全遮蔽，对周围道路基本上变得盲目。人类驾驶员推测在车内，不太可能让灰尘进入眼睛，尽管如果他们打开侧窗试图向外看或以其他方式让灰尘进入，人类驾驶员也有机会弄脏眼睛。还记得挡风玻璃很难保持清晰。无论如何，仅凭视觉手段，AI\
  \ 和人类都无法看得更远，他们无法看到路边可能隐藏的东西，他们可能没有意识到行人正在穿过马路或即将进入马路，等等。审慎地，AI 通常被编程为在摄像头受到视觉限制的任何环境下减速并谨慎驾驶。当然，大多数自动驾驶汽车最初就被设计为谨慎驾驶（如不超速、完全停车不滑行停车等），但它们有时可能包含针对沙尘暴、大雾和其他天气情况等特殊情况的额外规定。\n\
  \n这引出了自动驾驶汽车的另一个基本方面，即其 `ODD`（运行设计域）。在 4 级自动驾驶汽车的情况下，汽车制造商或自动驾驶技术公司应该定义一个 `ODD`，以划定适合其\
  \ AI 驾驶系统使用的情况。例如，`ODD` 可能是 AI 驾驶系统旨在白天和非雨天条件下正常运行。如果开始下雨，AI 应该检测到这一方面，然后意识到其 `ODD`\
  \ 正在被超越，在这种情况下，它应该安全停车并等待，直到 `ODD` 条件恢复到其范围内。大多数现有自动驾驶汽车实体的主要努力是建立并部署他们的车辆在相当日常的条件下，然后稍后处理非常规条件，一旦他们充分处理了日常驾驶任务。这值得一提，因为沙尘暴极有可能被认为超出了当今自动驾驶汽车的\
  \ `ODD`，被视为一种异常天气条件，目前不是高优先级，有时被称为边缘或角落案例。总而言之，这意味着如果你在沙尘暴期间身处自动驾驶汽车中，从驾驶角度来看，AI\
  \ 很可能尚未被设计为应对沙尘暴，因此它会相当迅速地警报将安全靠边停车并等待条件好转。我们可能期望人类驾驶员做同样的事。换句话说，不要尝试在恶劣的沙尘暴中驾驶，而是找个安全的地方停车等待条件好转。此外，如果已知或很可能在驾驶途中某处会发生沙尘暴，我们可能会建议甚至不要开始驾驶旅程。在道路条件适合安全驾驶之前，不要上路。\n\
  \n回想一下，我之前提到自动驾驶汽车通常装载了一堆不同种类的传感器。理论上，如果摄像头被遮蔽或遇到困难，AI 可以使用其他传感器来尝试弥补视觉障碍。`MSDF`（多传感器数据融合）的整个概念是\
  \ AI 可以汇集来自不同类型传感器的不同数据，这些传感器阵列分布在车身周围，并融合收集的数据，以试图获得车外发生情况的全面及时指示。尽管采用了这种整体方法，但要认识到在狂暴的沙尘暴中，雷达和\
  \ `LIDAR` 也很可能在感知发生的事情时遇到困难，部分原因是大量漂浮颗粒会导致各种额外噪声、错误反射和其他问题。因此，虽然拥有多种传感器类型是一种优势，但它不能保证能应对沙尘暴。\n\
  \n## 结论\n\n想不想来个烧脑的？在这类驾驶情况下会出现 AI 伦理相关考量。你急需去医生办公室，通常会上车匆忙开过去。假设唯一可用的车是自动驾驶汽车。所以你召唤一辆自动驾驶汽车上车，通过其自然语言处理（`NLP`）告诉\
  \ AI 医生的地址。AI 计算出该地区有沙尘暴并拒绝驾驶。AI 考虑到你的安全，不想在路上陷入沙尘暴，可能发生车祸让你受害。另一方面，你有你的理由想冒险去看医生。你应该能够覆盖\
  \ AI 并坚持让它开车送你，还是你被困住，直到 AI 宣布可以安全出行？有大量这类 AI 伦理场景尚未解决，我们直到自动驾驶汽车更广泛普及时才会特别遇到它们。与此同时，对于美国东南部地区将被尘埃吞没的你们，你们可能会发现自己面临着与\
  \ AI 驾驶系统类似的伦理困境，要求你衡量当沙尘暴包围你时，开车还是不开车是否是正确的选择。祝好运，远离尘埃，安全驾驶！\n\n# 第 11 章 亚马逊收购\
  \ Zoox 与 AI 自动驾驶汽车\n\n是时候吹响号角、铺开红毯，为一些古老的格言献上礼炮，它们解释了亚马逊这位巨头收购相对微不足道的 Zoox 这一近期宣布的消息，Zoox\
  \ 是一家著名的自动驾驶汽车制造商，主要为自动驾驶汽车（`AV`）内部人士所知。试着衡量这些格言的分量：\n\n\n\n\n*   英雄所见略同\n*   模仿是最高形式的赞美\n\
  *   如果你打不赢他们，就加入他们\n\n\n\n好吧，诚然最后那句俏皮话不完全符合其传统形式，但无疑非常贴切当下的局势。以下是幕后的花絮与姿态。在亚马逊和\
  \ Zoox 宣布交易后，埃隆·马斯克发了一条推文，旨在嘲讽杰夫·贝佐斯是个模仿者，推测模仿对象是特斯拉（趣味的是，该推文使用了一个猫的表情符号，给嘲讽增添了更多调料）。简而言之，这番调侃的意思是：贝佐斯通过亚马逊收购\
  \ Zoox，这家庞大的电商巨头将成为特斯拉自动驾驶野心的正面竞争对手。你可以把这看作两个巨头现在将展开激烈的肉搏战（注：亚马逊早已涉足自动驾驶行业，但可以说这次收购\
  \ Zoox 是一个大胆且抛出手套般的挑战姿态）。这就是为什么马斯克能嘲讽贝佐斯是模仿者或跟风者，有种“嘿，伙计，欢迎来到派对，总算来了”的意味。对贝佐斯此举的一种解读是，这展示了一个坚定的信念：自动驾驶汽车将至关重要，因此值得进行大笔投资（据报道，亚马逊斥资约\
  \ 12 亿美元收购 Zoox，数额可观，但有人会说这对亚马逊只是零花钱）。另一方面，考虑到 Zoox 此前据报道估值约 30 亿美元或更高，一些人为这家自动驾驶公司的“白菜价”捏把汗，担心这揭示了该领域的疲软，并重新点燃了人们的担忧：自动驾驶可能无法实现，或者至少在很长一段时间内无法实现。反方观点认为：实现自动驾驶是一个烧钱的游戏，试图让传统投资者为一个可能美好却遥遥无期、甚至可能根本无法实现的未来买单，这使得作为一家独立的自动驾驶开发商难以生存。你需要有深厚的资金实力和坚韧不拔的耐心才能在利基市场立足，而亚马逊潜在具备这些特质。当然，你可以说亚马逊很可能以极大的折扣价买入，部分原因是考虑到社会和经济环境，所有自动驾驶项目近期都有所收缩，但这让\
  \ Zoox 能继续推进，并似乎避免了如果 Zoox 无法找到其他有吸引力的融资方式而给该行业带来的损失。不过，这桩交易的内幕远不止表面看起来那么简单。请允许我花一点时间为你梳理最新进展。\n\
  \n## 什么是自动驾驶\n\n作为背景，Zoox 是一家总部位于硅谷的自动驾驶汽车制造商，成立于 2014 年，自此一直是一家初创公司。让他们与众不同的是，他们深信不疑且坚定不移地认为：自动驾驶汽车必须从零开始打造。这是什么意思？许多自动驾驶软件开发实体将其自主能力瞄准传统汽车，通过配备精密的传感器套件和其他增强设备，将其改装成自动驾驶车辆。与此同时，尽管\
  \ Zoox 也通过使用特别改装的丰田汉兰达和普锐斯 C 做着同样的事，但他们的总体激情在于彻底重塑汽车平台。例如，在人类驾驶的汽车中，始终将汽车设计为前向行驶是合理的，因为人类坐在固定位置面向前方。在现代汽车发明史上，我们一直是这样坐、这样开车的。但在自动驾驶汽车中，AI\
  \ 在驾驶，因此你可以设计车辆随时在任一方向“前向”行驶。因此，抛弃有时需要“倒车”的陈旧观念，转而将驾驶方向设定为始终向前，即使你碰巧正朝着刚来的反方向行驶。他们称之为对称且双向的设计，此外该车辆将是零排放的电动汽车（EV）。你可能会好奇，哪条路更好？是在传统车上堆砌复杂的尖端技术，还是重新构想汽车的构成。棘手的是，如果你决定走看似激进的路线，尝试前所未有的设计，你可能要同时面对两场硬仗。你必须确保物理车辆本身能在道路上运行且安全，同时还要确保\
  \ AI 和自动驾驶系统正常工作。这就是为什么许多自动驾驶相关项目专注于使用各种增强版日常用车，试图减少原本就无可争议的“登月级”壮举中的变数和不确定性。逻辑是：你可以审慎地通过一个基于已验证车型的坚实基础，缓步进入自动驾驶领域，从而只需应对\
  \ AI 自动驾驶能力背后的焦虑与阵痛。Zoox 本质上想“两全其美”，他们通过使用经过自动驾驶技术增强的特定常规车型（包括将这些车投入道路进行真实世界试驾），在幕后全力推进全新专用车型的研发。如果你一直跟得上我的解释，接下来让我们更深入地挖掘埃隆·马斯克那条推文所蕴含的多维度、令人费解的含义。大家都知道马斯克一直致力于让特斯拉不仅成为顶级车企，也成为卓越的自动驾驶汽车提供商。通过使用\
  \ Autopilot 及封装在特斯拉车辆中的传感器，特斯拉一直在逐步、渐进地将半自动驾驶转变为全自动驾驶。让我们确保每位读者都知道一个非常清晰、不容辩驳的事实：**如今的特斯拉并非全自动驾驶。**\
  \ 无论你听到多么狂野的宣称，看到网上多少愚蠢的视频里人们错误地相信他们的特斯拉能自己开车，这完全是胡扯，是令人遗憾且危险的谎言。以如今的特斯拉及其所有“自动辅助驾驶”功能来看，它仍是一辆需要人类驾驶员的车。在自动驾驶等级划分中，你会说这些车属于\
  \ L2 级。真正的自动驾驶汽车是 L4 级，未来有望达到 L5 级。Zoox 专注于 L4 和 L5 级。特斯拉处于 L2 级，并试图逐步迈向 L4 和 L5\
  \ 级。因此你可以明确指出，特斯拉和 Zoox 最终都在追求真正的自动驾驶，只是特斯拉从较低级别的半自动驾驶起步，而 Zoox 则跳过那些低级别，直接冲刺最高级别。没人能确定哪条路径更好。特斯拉这类公司无疑会声称，他们通过逐步完善的方法论走的是“正确”路线。许多人似乎没完全意识到，特斯拉涉足\
  \ L2 级并推定进入 L3 级，让自己面临巨大的昂贵风险和潜在垮台危机。我反复呼吁：我们将会有不认真履行 L2 或 L3 级车辆驾驶员责任的人类驾驶员。当涉及\
  \ L2 和 L3 级车辆的车祸发生时，车企会立即试图通过指出人类驾驶员是驾驶任务的责任方，来为自己完全免责。这种做法能否继续让这些公司获得“免责特权”仍有待观察，但我预测很可能会爆发大规模诉讼，可能会严重打击这些公司，甚至让一些公司倒闭。因此，一些人坚持认为，Zoox\
  \ 等公司跳跃式冲刺 L4 并最终达到 L5 的路径更为稳妥，避免了陷入 L2 和 L3 级的泥潭中可能引发的、足以毁掉公司的丑陋纠葛。当然，处于 L2 和 L3\
  \ 级的公司倾向于声称，他们更有可能更早达到 L4 甚至 L5，因为他们是一步步构建上来的，在过程中学习和复用。同时，他们能从 L2 和 L3 级赚取收入，而那些冲刺\
  \ L4 级的公司基本没有任何收入，还在为让 L4 适应日常世界而挣扎。额外的转折在于，一些冲刺 L4 和 L5 级的公司将自动驾驶能力用于除载客乘用车之外的其他方面。通过利用相关用例，这些公司有望更早建立可行的收入来源并维持运营。例如利用自动驾驶配送车辆和自动驾驶班车等其他运输模式，这些可能被认为更容易实现商业化，同时继续应对棘手的乘用车需求（一些人认为亚马逊极有可能看中\
  \ Zoox 的能力用于处理配送和物流出行事务，而非作为网约车或共享出行服务提供商）。\n\n## 亚马逊将如何处置 Zoox\n\n在特斯拉的案例中，马斯克似乎采取了一种（深度）亲力亲为的方式，且似乎例行公事般、甚至每天都在为\
  \ Autopilot 和公司的自动驾驶愿景添砖加瓦。你很难想象马斯克会有别的做法。而且大概率会收到一两条推文来“纠正”你。那么 Zoox 会怎样？杰夫·贝佐斯会亲力亲为，还是放手不管？根据关于亚马逊和\
  \ Zoox 交易的正式新闻稿，显然 Zoox 将作为亚马逊帝国内部的一个独立业务继续运营。一些人对这种声明持怀疑态度，我们也见过大公司收购小公司时做出类似断言，但这种独立的光环往往持续不了太久（如果它曾经真正出现过的话）。戴上你的“预知之帽”，让我们凭借自动驾驶时代的水晶球，看看\
  \ Zoox 在亚马逊麾下可能会发生什么。以下是五大可能场景：\n\n\n\n\n\n## Zoox 未来发展的五种情景\n\n### Zoox 如虎添翼\n\
  在此情景下，Amazon 内部向 Zoox 注入巨额资金，终于让那些 AI 开发者和工程师不再需要靠“胶带和口水”来维持运转，其影响力如同注入类固醇般全速前进，将\
  \ Zoox 自动驾驶汽车推向行业顶峰，并以闪电般的速度推进发展。\n\n### Zoox 因强风调整航向\n在此情景下，观点认为 Amazon 决定通过提供关于\
  \ Zoox 应前进方向的“建议”来对其独立性进行压力测试，也许会暂时否决专有车辆的概念，坚持认为只有 AI 自动驾驶才是关键，推动公司转向使用经过改装的现有车辆进行自动驾驶，或采取其他类似耗尽实体精力的措施。\n\
  \n### Zoox 被博格同化\n在此情景下，你不妨把任何印有 Zoox 标志的钥匙扣和 T 恤放进纪念盒里作为收藏品，因为 Zoox 将会消失，完全被吸收进\
  \ Amazon 这个“博格”集体中，无论悲喜，最终结果都充满不确定性。\n\n### Zoox 蒸发归于虚无\n在此情景下，Amazon 不对 Zoox 进行特别注资，任其“枯藤上悬”，逐渐地，人才被其他具备必要决心和支持自动驾驶雄心的公司挖走，剩下的\
  \ Zoox 看起来很像《硅谷》中 Pied Piper 的变体，令人惊讶的是，Amazon 指派 Richard Hendricks 来领导该实体。\n\n\
  ### Zoox 幻想成真\n在此情景下，Amazon 助力 Zoox 蓬勃发展，接下来发生的是超出许多人想象的反转：Zoox 在自动驾驶领域占据主导地位，带来的利润甚至超过\
  \ Amazon，而 Amazon 的电商业务变得迟缓，Zoox 成为救世主，凭借自动驾驶业务市值攀升至万亿美元级别，Bezos 回顾对 Zoox 的收购，感谢自己的幸运星。\n\
  \n\n\n\n\n## 哪种情景将会上演？\n\n时间会给出答案。\n\n## 结语\n\n关于自动驾驶汽车领域，有一点可以肯定：从无乏味时刻。总有事情在发生。有时，媒体大肆吹捧自动驾驶梦想，众人蜂拥而至想分一杯羹；而有时，厄运与阴霾笼罩而来，人们不禁纳闷：那些本将无处不在、在我们所有的大街小巷穿梭的自动驾驶汽车究竟去哪儿了？\n\
  \n请花一点时间沉思一下，这场新变局将给未来带来什么。贝佐斯是否刚刚买下了世纪交易？马斯克会后悔当年以 Zoox 收购案嘲讽贝佐斯的那一天，并眼睁睁看着他们的自动驾驶汽车在特斯拉周围甩尾漂移，羡慕不已吗？那个品牌会叫“AmaZoox”还是“ZooxAma”？又或者亚马逊会漫不经心地转向其他事务，关于\
  \ Zoox 的唯一记忆，只剩下冷知识问答中那个问题：生活在珊瑚和水母体内的那些单细胞甲藻叫什么名字？答案是 Zooxanthellae（虫黄藻），但有人可能会怀旧地脱口而出“Zoox”。\n\
  \n那些对亚马逊与 Zoox 的天作之合持怀疑态度的人，倾向于预测特斯拉车主很快会贴上这样的车尾贴纸：“我的另一辆车本来要是 Zoox，但它在亚马逊的丛林里迷路了。”Zoox\
  \ 的粉丝则明显更乐观，他们以斯波克般的口吻庄严宣告：Zoox 将长存繁荣。为了自动驾驶汽车的前景，希望支撑 Zoox 的激情与活力能继续生生不息，真正的自动驾驶汽车时代终将热烈地迎来属于它的那一天。\n\
  \n# 第 12 章 特斯拉搭载激光雷达与 AI 自动驾驶汽车\n\n世界愈发颠倒黑白，近日一辆真正的官方特斯拉汽车被发现在公共道路上行驶，车顶竟搭载着激光雷达传感器技术。天哪！对于那些不知道这为何会成为大新闻的人，你们需要了解一下围绕自动驾驶汽车问世而持续发酵的激光雷达风波。\n\
  \n让我们理清这场混乱而激烈争论的基础事实。我将努力先带大家梳理这场旷日持久的风波全貌，随后我们再探讨如何解释这出人意料、令人费解的景象——一辆官方特斯拉车辆竟装着激光雷达，这无异于目击大脚怪或尼斯湖水怪，或是像电影《捉鬼敢死队》里交叉粒子流一样不可思议。这要么是分水岭时刻，要么是视觉错觉，又或许是七种看似站得住脚的解释之一（我将为你一一道来）。\n\
  \n## 激光雷达究竟是什么\n\n激光雷达是一种结合了激光光束与类雷达技术的技术（光 + 雷达），此类技术自 20 世纪 50 年代末以来就已存在，并被广泛应用于各个领域。它本身并非新鲜事物。\n\
  \n激光雷达的应用被视为自动驾驶汽车等自主系统的基石。通过发射激光束并测量其返回所需时间，可以尝试绘制激光雷达设备周围环境的地图，获得对检测物体距离的感知，从而确定它们的位置及潜在尺寸（此外，通过随时间记录和比较一系列此类观测数据，还能追踪这些物体的运动轨迹）。\n\
  \n最初，激光雷达传感器价格相对昂贵，动辄数十万美元，这意味着尽管它们非常适合实验性自动驾驶汽车，但若用于量产车，会使车辆价格高得令人望而却步。与大多数技术一样，激光雷达的价格已不可避免地大幅下降。激光雷达设备也变得小得多、性能更强、更不易出错，并能经受住汽车日常风吹雨打、泥泞尘埃的考验。\n\
  \n这里有个关键点：除特斯拉和埃隆·马斯克外，几乎所有车企和自动驾驶科技公司都已采用激光雷达。有人视埃隆·马斯克为反激光雷达阵营的领袖。\n\n为何有人反对使用激光雷达？过去，最简单的理由是激光雷达太贵、太大、不切实际，虽适合实验工作，但不具备实用条件。如今很难再用这个理由搪塞，尽管仍有人尝试。\n\
  \n无论如何，撇开那些不谈，人们倾向于思考的另一个问题是：激光雷达对自动驾驶是必需的，还是可有可无？换句话说，如果激光雷达设备是确保自动驾驶汽车能穿梭车流且不撞东西的唯一手段，那么成本等因素似乎就不那么关键了，理应毫不犹豫地在车上装上激光雷达。\n\
  \n这引出了当下最喧嚣的辩论之一：即激光雷达完全没必要，因为摄像头就能完全搞定的恶毒争论。一些信徒坚称摄像头足矣，无需激光雷达。在他们看来，增加激光雷达只是徒增不必要的成本和复杂性，无论其成本多低、技术多先进。\n\
  \n一般来说，如果你信奉系统的简约性，且不认为激光雷达必不可少，你会说：激光雷达或许有用，但非必需，加上它纯属无谓地增加负担。\n\n无人能毫无合理怀疑地证明摄像头能在完全没有激光雷达的情况下独立完美胜任。因此，给自动驾驶汽车同时配备摄像头和激光雷达，以及雷达、超声波、热成像等一系列探测传感器，是相对通行的做法。特斯拉除外。\n\
  \n埃隆·马斯克早早决定特斯拉汽车不需要激光雷达。起初，他留有余地，承认自己或许有一天会被证明判断失误；后来，他强化了立场，转而贬低激光雷达的必要性。最终，马斯克甚至断言：其他人使用激光雷达简直愚蠢至极，终将为使用激光雷达而后悔莫及。\n\
  \n你的反应可能是：马斯克精明睿智，似乎精通物理和科学，他的断言必有依据，尤其是这些断言似乎与自动驾驶领域的主流背道而驰。马斯克看到了别人没看到的东西？或许他拥有超越常人视野的远见，正如他在通用太空探索和大型隧道掘进等其他押注中所展现的，他果断走了一条不同于常规的道路。\n\
  \n他反对激光雷达的一个论点是：人类开车不需要从头顶射出激光束。因此，如果人类只靠肉眼就能开车，那么摄像头理应是实现媲美人类驾驶水平性能所唯一特别需要的东西。\n\
  \n直接的反驳是：他选择使用雷达，而人类驾驶员头颅里也没有内置雷达，基于他阐述的逻辑，他是否应该从所有特斯拉车上移除雷达？此外，自动驾驶汽车理应比人类开得更好，避免美国每年\
  \ 4 万起车祸死亡，缓解约 120 万车祸受伤，这或许需要激光雷达的额外助力，而不是摒弃可能在生死攸关的最后一步发挥作用的东西。\n\n另一种解释为何他现在对抗激光雷达的立场如此根深蒂固：他把自己逼入了死角。怎么个死角法？在特斯拉汽车的演进和推出过程中，马斯克和特斯拉一直坚称并吹嘘：你的特斯拉拥有实现自动驾驶所需的全部硬件。推测只有软件缺失，而软件可在未来就绪时通过车载\
  \ `OTA (Over-The-Air)` 空中下载技术获取。请记住，特斯拉的硬件不包括激光雷达。\n\n这意味着如果他和特斯拉收回反激光雷达立场，他们将面临为每辆特斯拉汽车加装激光雷达设备的义务。请细细品味一下。你能想象为确保每辆特斯拉加装激光雷达所需的天价成本和物流噩梦吗？\n\
  \n\n\n\n\n## 特斯拉与激光雷达之争：从坚决反对到神秘现身\n\n### 背景：激光雷达争议的核心矛盾\n\n特斯拉若要在现有车队中加装激光雷达（LIDAR）并不切实际，公司无法承担如此巨额成本。然而，这一决定也为未来埋下了隐患。你无疑在新闻中见过特斯拉车辆在开启\
  \ `Autopilot`（半自动驾驶功能，尚未实现完全自动驾驶）时发生碰撞的报道。其中部分事故已演变为诉讼（也有庭外和解）。\n\n特斯拉面临的一个风险在于：不采用激光雷达是否属于对车辆安全性的轻率妥协。如果安全决策基于激光雷达的成本，那么本质上就是在计算“挽救的生命价值”折合多少美元节省——这种论调曾让著名的\
  \ `Pinto` 车型及其他类似汽车设计选择陷入困境。在这种潜在法律责任下，有人预言特斯拉和马斯克终将面临“清算之日”：法院可能判定公司因坚持反激光雷达决策而需承担巨额赔偿。届时，特斯拉令人印象深刻的销售业绩，或将被视为仅为一场可能导致公司破产的天价败诉诉讼“买单”。这是一个“骑虎难下”的局面：公司铺好了床，就得躺在上面，尽管时钟可能正在无声滴答作响，未来某刻将需支付巨大代价。\n\
  \n此外，几乎所有其他自动驾驶汽车都采用激光雷达，这将被视为特斯拉明知故犯、刻意选择技术路线的证据，从而切断其“不知情或不理解激光雷达潜在价值”的辩解之路。\n\
  \n话虽如此，关于“激光雷达与否”的模糊地带，反而可能为特斯拉提供某种保护伞，使这种末日场景永不上演。何其跌宕起伏！欢迎来到自动驾驶汽车的世界，以及这场旷日持久、悬而未决的激光雷达辩论。\n\
  \n### 最新转折：官方车牌特斯拉现身搭载激光雷达\n\n你已掌握全貌，静候最新反转。近期爆出新闻：一辆特斯拉汽车在公共道路上被拍到以突兀方式搭载激光雷达，设备显著安装在车顶架上。正如我前文所述，此景之震撼，无异于睁大双眼在大街中央亲眼目睹\
  \ `Bigfoot`（大脚怪）。\n\n从“激光雷达派”与“反激光雷达派”的对立来看，这仿佛正负物质原子束交汇，后果难料——甚至可能引发存在的瞬间坍缩。\n\n\
  最初有人推测：这是个别车主出于爱好私自加装。但报道称该车悬挂官方特斯拉车厂车牌，推翻了此说。\n又有人猜测：类似供应商展示“加装激光雷达的特斯拉外观”，但无法解释官方车牌。\n\
  亦有质疑：照片系伪造/合成。虽存可能，但报道可信度高、照片真实感强，`DeepFake`（深度伪造）可能性极低。\n\n假设确系官方特斯拉车辆、行驶公共道路、且确搭载激光雷达设备。以下七大理由可合理解释这一“大脚怪现身”事件：\n\
  \n#### 1. 临时用于摄像头地面实况标定\n激光雷达辅助标定特斯拉摄像头——可能因测试新摄像头软件或新硬件。反激光雷达派会反驳：这仅证明激光雷达价值“锦上添花”而非“雪中送炭”，临时使用不构成必要性证明。\n\
  \n#### 2. 为 `Cybertruck`（赛博皮卡）预演激光雷达方案\n`Cybertruck` 或将搭载激光雷达；该车车顶硕大货架疑似模拟 `Cybertruck`\
  \ 笨重轮廓。若 `Cybertruck` 版 `Autopilot` 含激光雷达，用普通特斯拉车型低调测试，优于高调驾驶 `Cybertruck` 试车。反方论点：大型车因体积盲区需激光雷达，传统乘用车则不需。\n\
  \n#### 3. 重新评估为现有特斯拉车型加装激光雷达\n极不可能、近乎不可思议的场景：测试激光雷达以评估给现有车队加装可行性。若你笃信此说，不妨考虑下买沼泽地。\n\
  \n#### 4. 考虑为未来特斯拉车型配备激光雷达\n比前一场景略靠谱（但也仅限于此）：未来车型或标配激光雷达。但这将极难自圆其说，使公司陷入与现有车主、铁杆粉丝及潜在法律诉讼的麻烦之中。\n\
  \n#### 5. 故意用激光雷达“证明其非必要”\n反激光雷达派最爱此场景：特斯拉刻意试用激光雷达，以铁证其“并无显著增值”，终结争论。这是为了赌气，还是为未来出庭自辩铺路？\n\
  \n#### 6. 内部“叛逆项目”意外曝光\n特斯拉工程师狂野好动，爱玩“玩具”，搞到激光雷达后突发奇想装车测试。虽马斯克鼓励自由思考，但若通过推文/社交媒体发现团队背地里搞这套，他大概率不会高兴（或者按他风格，突然升职奖励也说不定）。\n\
  \n#### 7. 纯粹玩弄大众心理\n大家公认特斯拉和马斯克爱玩心理战、爱整活：或许激光雷达单元只是喷漆冰球，或虽是真设备但整套装置就是公关噱头。我们被耍了？若真如此，该开心还是恼火？\n\
  \n\n\n\n\n## 结论\n\n你倾向于这七种中的哪一种？也许在马斯克的形而上学世界及其跳出框架的思维中，存在着我们目前谁也无法测度或预知的其他原因。既然马斯克有时也喜欢宏大地哲学一番，或许这次目击根本不是真的，而只是我们都陷入其中的一场梦。有可能。无论如何，请务必睁大眼睛留意更多目击事件，多睡点觉以准备好迎接接下来的事情，或许在你的夜间酣睡中融入一些关于激光雷达的思绪，假设我们不是已经每天都处于那种相同的梦幻精神状态（马斯克无疑会知道我们是否处于其中。\n\
  \n\n\n\n\n# 第 13 章 自动驾驶、汉堡王华堡与 AI 自动驾驶汽车\n\nAI、自动驾驶汽车、特斯拉、自动辅助驾驶系统，以及臭名昭著的汉堡王华堡等汉堡，这些究竟有何共同之处？当然是一个“惊天动地”的故事。汉堡王最近的一则广告活动使用了这个自鸣得意的广告语：“智能汽车足够聪明，会为华堡刹车。”为了确保广告“料足味全”，他们还宣称：“人工智能知道你渴望什么。”不得不承认，这又是汉堡王巧妙利用本可能只是小范围病毒式传播的社交媒体素材，将其转化为无可争议的可营销卖点，从而兜售那些备受推崇的汉堡和薯条的又一典型案例。这一次，他们敏锐的洞察力和辛辣的机智触及了为自动驾驶汽车提供动力的自动化层面，并极有可能涉及一辆运行自动辅助驾驶的特斯拉，而该系统尚未具备完全成熟的自动驾驶能力。\n\
  \n以下是关于所谓“自动辅助驾驶华堡”事件的来龙去脉。今年 5 月，一位驾驶员在 YouTube 上发布了一段记录高速公路行驶过程的视频，声称展示了一辆运行自动辅助驾驶的特斯拉错误地将路边的汉堡王招牌识别为可能的停车标志。请注意，汽车仅仅开始逐渐减速，并没有急促反应，也没有试图在检测到其解读为可能的停车标志时激进地急刹车。我们怎么知道汽车想做什么？根据驾驶员拍摄的视频记录，特斯拉的中控屏闪烁出经典提示信息“因交通管制而停车”，这是一条常规信息，用于让人类驾驶员知晓系统检测到某种需要由计算机控制车辆停下的交通状况。汽车继续在高速公路上行驶，一旦与路边招牌的距离缩短，关于即将到来的交通管制的警报不再显示，车辆重新加速回到规定的限速。\n\
  \n你可能会说这是一个“无伤无害”的情况。无人受伤，未发生车祸，交通似乎丝毫未受干扰。话虽如此，自动化系统确实最初错误地将检测到的标志解读为可能是停车标志，并相应地开始减速，但一旦车辆靠近到足以进行更确定的分析，系统便弄清那不是停车标志，并在交通流中毫无阻碍地继续行驶。让我们姑且相信视频内容属实，假设它未经伪造或篡改。我之所以提及这一警示，是因为有人完全可以利用任何像样的视频编辑软件制作出此类视频，但总体而言，该视频似乎很可能反映了实际发生的情况，我们可以合理地假设这是真实发生的事件。\n\
  \n你的第一反应，或许和我一样，是怀疑这只是偶然的一次性失误，还是说有可能发生第二次、第三次，以此类推。我们无法确定它是否具有可重复性，尽管大约一个月后，同一位驾驶员再次驶经同一路段，并发布了新视频，显示特斯拉似乎没有再犯同样的错误。在后一个视频中，驾驶员口头祝贺特斯拉，称汽车似乎已经“学会”了应对汉堡王招牌，不再将其错误归类为停车标志。我们未必能做出这种逻辑上的飞跃，也不能盲目轻信。为何如此？车辆为何未像第一次那样反应，可能有其他合理的解释。请允许我稍作详述。\n\
  \n想象一下你在驾驶汽车时，有时会根据光照和其他环境条件以不同方式看清某物，你可能更清晰地看到标志，或因遮挡而看得模糊不清，这取决于阳光多寡、云层覆盖等因素。摄像头检测情况可能与第一次不同，因此碰巧第二次驶经时根本未发现该标志，或者发现了但获得了更清晰的视角。请意识到，在远距离下，摄像头拍摄的图片或视频细节较少，处理的物体也只是隐约可见。这又有点像你可能会努力辨认远处的物体，同样，车载计算机系统也会尝试分类它能看到的任何东西，即使只是隐约可见。\n\
  \n许多未涉足自动驾驶技术领域的人没有意识到，驾驶——即使是人类驾驶——本质上也是一场概率与不确定性的博弈。当你在前方道路上看到类似路面碎屑、静止物体停放在路上的东西时，你可能不知道它是类似从卡车货箱掉落的工具箱那样的硬物，又或许只是个空纸盒，相对无害。在靠近之前，你都在推测物体可能是什么，同时试图预先决定应采取何种行动。如果能变道，也许应该变道以避免撞击物体。如果无法轻易变道，也许碾压物体顶部更好，从而避免采取急转弯或尖叫刹车等极端措施。\n\
  \n这引出了关于 AI 和自动驾驶技术的一个重要教训：它不会以某种神奇的方式运行，也不会实现纯粹完美的驾驶。正如人类难以识别路面碎屑是什么，并必须确定驾驶选项一样，AI\
  \ 也必须做同样的事。这也是为什么我一直呼吁：认为采用 AI 驾驶系统可实现零死亡的观念是一套错误的预期。尽管拥有 AI 驾驶系统，我们仍将发生车祸。在某些情况下，可能是\
  \ AI“判断”不当并采取了错误的驾驶动作；而在其他情况下，如行人意外冲到行驶汽车前，根本没有可行的替代方案来避免碰撞。请记住，即使备受推崇的基于 AI 的真正自动驾驶汽车，仍受物理定律约束。当意外突发、毫无明显预警时，你只能根据物理原理让汽车停下，无法奇迹般地让车辆瞬间静止。制动距离终究是制动距离，无论是人类驾驶还是\
  \ AI 驾驶。\n\n话虽如此，我们当然希望通过让 AI 驾驶系统全面接管车辆，能大幅减少因人类酒驾和各种人类驾驶缺陷导致的车祸，从而大幅减少道路上的伤亡（但我强调，仍非零）。无论如何，仅仅因为汽车在后续行程中未重复误识别汉堡王招牌，我们不能假设这是由于汽车“学习”了该情况。除非我们被允许深入挖掘自动辅助驾驶系统及其收集的数据，否则不易确定究竟发生了何种变化，尽管系统可能已改进，能更好地处理汉堡王招牌，这似乎是个合理的猜测。\n\
  \n## 这究竟是什么“学习”\n\n假设系统确实更好地对汉堡王招牌进行了分类。这是否意味着系统对此事进行了“学习”？首先，无论何时使用“学习”一词，都可能夸大自动化系统正在做的事情。从某种意义上说，使用这个称谓就是某些人所说的将自动化“拟人化”。原因如下。假设幕后的\
  \ AI 开发人员和工程师正在检查其汽车收集的数据（包括视频流），并意识到汉堡王招牌被错误分类为停车标志。这些人类开发人员可能会调整系统以防止其再次如此。在这种情况下，你会描述自动化系统已经“学会”了该怎么做吗？似乎有点牵强。\n\
  \n或者，假设系统使用了机器学习（ML）或深度学习（DL），包含人工神经网络（ANN），这是一种数学模式匹配方法，试图在一定程度上模仿人脑可能的工作方式（请注意，当今基于计算机的神经网络与大脑实际运作方式相去甚远，完全不等同，总体上属于截然不同的两码事）。后端总部计算机系统可能通过车队汽车收集的数据将其汇总到云数据库中，并可能被设置为检查误报（误报是指检测算法认为那里有东西，如停车标志，但实际并非停车标志）。在通过计算发现汉堡王招牌属于误报后，系统可能在数学上标记任何此类图像绝非停车标志，然后通过\
  \ OTA（空中下载）电子通讯将此标记推送给车队车辆，OTA 允许总部向车辆发送数据和程序补丁。你能称之为关于汉堡王招牌的“学习”吗？你或许会试图提出这种主张，利用这些计算方法被称为机器学习和深度学习这一特点，但对某些人来说，这扩大了与任何类人学习相关的含义。\n\
  \n例如，一个学会不把汉堡王招牌误认为停车标志的人，同时可能也学会了许多其他方面。人类可能会泛化推演，意识到麦当劳招牌可能被误解，塔可钟招牌亦然，等等，所有这些都是学习整体外观的一部分。你可以进一步推演。人类可能会领悟到这样一个完整概念：有时存在类似于我们已知事物的标志，因此至关重要的是不要假设汉堡王招牌的特征会延伸到其他导致误识别的方面。这还可能促使人类思考他们如何基于快速判断做出其他错误假设。每当他们远远看到某人，也许根据其外貌判断对方是某种类型的人，这就是一种过早的行为。以此类推。我意识到你可能不愿费心去设想人类真的会将误分类汉堡王招牌这件事推演多远，但那忽略了我试图表达的重点。我的观点是，当人类学习时，他们通常（或希望）会以多种其他方式泛化该学习。有人将这归结为我们拥有常识并能进行常识推理的观点。给你个震惊：目前尚无任何\
  \ AI 具备任何真正意义上的常识推理。一些人断言，直到我们让 AI 具备常识推理，我们才无法实现真正的 AI——即与人类智力相当的 AI，如今称为 AGI 或通用人工智能（表明当今典型的\
  \ AI 在范围和能力上远比渴望达到的 AI 版本狭窄和简单得多）。总体而言，你很难说汽车自动化已以人类可能拥有的那种可泛化、全推理的方式从汉堡王事件中“学习”了什么。无论如何，人们在提及当今变体\
  \ AI 时喜欢用“学习”一词，尽管这夸大了正在发生的事情，并可能导致过高且混淆视听的预期。\n\n## 关于招牌的谜题\n\n你可能记得电影《公主新娘》中著名的智力较量场景，其中一位角色厚颜无耻地吹嘘他才刚刚开始提出他的逻辑。让我们在此也用同样的豪气。到目前为止，我们假设汉堡王招牌被短暂地分类为停车标志，当时汽车正在高速公路上行驶并接近高速公路旁的标志牌。你可能会想，一个实际上不在道路上的标志，为何会被作为潜在停车标志进行检查，并被认真考虑是否要因此停车？当你在高速公路上驾驶时，有成打成打的高速公路旁停车标志和大量其他交通管制标志清晰可见，但你不会认为它们值得让你在高速公路上停车。这是因为你知道那些标志在路外，与你在高速公路上的驾驶无关。想象一下，如果每次你看到当地街道的正式交通标志，尽管它们不在高速公路上，你却选择像它们位于高速公路上一样做出反应。那将是一团糟！你将在高速公路上不断做出各种疯狂的驾驶举动，让附近所有其他驾驶员感到困惑。\n\
  \n简而言之，既然汉堡王招牌不在高速公路上，它本应立即被忽略，不作为交通管制标志或任何值得自动化系统关注的标志。我们可以极端地说，即使汉堡王招牌与停车标志完全相同，本质上用真正的停车标志替换了汉堡王标志，这仍然不应有影响。这把我们带回到所谓的“学习”层面。如果自动化系统现在有了汉堡王招牌不是停车标志的计算指示，这似乎还不够。我们还希望它“学会”高速公路旁的标志与高速公路驾驶无关，尽管当然存在例外，使这成为一条必然灵活的规则，你不能简单地宣布所有路外标志都可以完全忽略。\n\
  \n为何自动化系统似乎最初评估汉堡王招牌与高速公路相关？这涉及一个光学错觉，通常也会影响人类驾驶员。汉堡王招牌矗立在高杆顶端，离高速公路相对较近。如果你见过他们显眼的招牌，就会知道它们醒目之处在于用鲜艳的红色大字拼出“Burger\
  \ King”，形状为椭圆形，所有这些从远处看都与停车标志的整体外观酷似。当然，招牌特意朝向高速公路以吸引最大关注。在此驾驶场景中，汽车驶过高速公路的一个山顶，汉堡王招牌看起来紧邻高速公路，并可能被视为位于高速公路上本身，这是基于远距离观察和驶过山顶时的高速公路结构造成的。你肯定经历过这种视觉错觉，很容易上当。一旦你意识到那是汉堡王招牌，你就不再在意它是在高速公路上还是路外，因为它不需要你采取任何行动（除非你饿了，招牌激起你驶离高速公路去吃汉堡）。\n\
  \n理论上，人类驾驶员也可能做出自动化系统所做的同样的事，即作为预防措施开始减速，以防标志是停车标志。新手司机可能特别容易在最初几次经历这种视觉错觉时中招，此后大概能领会所见为何物。从这个意义上说，作为人类，你是在通过经验学习，本质上是收集数据并基于收集的数据进行调整。潜在地，车企为自动驾驶自动化建立的机器学习或深度学习也能在一定程度上做类似的事。通常会整理训练数据集，尝试训练\
  \ ML/DL 识别何种路面标志。训练数据必须包含足够多样的示例，否则计算会过拟合数据，只有严格符合标准标志的那些标志才能在后续被检测到。在现实世界中，停车标志常被涂污、撞毁、弯曲，可能被树枝部分遮挡，存在各种其他变体。如果仅用最标准的停车标志训练\
  \ ML/DL，车载检测结果无疑无法识别出许多日常真实世界中受损的张贴停车标志。\n\n对任何自动驾驶汽车而言，噩梦般的危险之一是假阴性的可能性。假阴性是指明明存在停车标志，自动化系统却不将其解读为停车标志。这很糟糕。自动化系统可能未能执行必要的停车，灾难性后果可能是车祸和可怕后果。你也可以在一定程度上断言误报同样糟糕。假设自动化系统完全误将汉堡王招牌当作停车标志并在高速公路上停下。后方其他驾驶员极易追尾撞上这辆停车，因为它在正常飞驰的高速公路上莫名其妙、意外地停下了。\n\
  \n## 结语\n\n欢迎来到打造自动驾驶汽车者面临的困境。目标是防止假阴性和防止假阳性，尽管这并非总是可能，因此系统必须足够擅长应对这些可能性。对于运行自动辅助驾驶的特斯拉，重要的是要意识到现有自动化被视为自动驾驶能力的\
  \ L2 级，意味着它是驾驶辅助类自动化，而非完全自主。对于 L2 级汽车，人类驾驶员仍被视为车辆的责任驾驶员。在误以为汉堡王招牌是停车标志的情况下，即使自动化系统试图完全停车，人类驾驶员被推定为掌控者，应覆盖这种不利驾驶动作。正如我反复呼吁的，我们正步入危险领域，期望人类驾驶员在\
  \ L2 和 L3 级汽车中覆盖自动化，你可以打赌许多人类驾驶员不会这样做，或因错误地相信汽车正稳妥地自行驾驶而延迟覆盖。你可以说人类驾驶员将对其汽车自动化正在做什么做出误报和误判，任何一种都可能导致可怕的灾难。这就是为什么一些人强烈主张我们应等到\
  \ AI 足够好，可用于 L4 和 L5 级自动驾驶汽车，届时 AI 完成所有驾驶，无人类驾驶介入。如果我们能达到那一步，将意味着人工智能确实“知道我们渴望什么”，那包括安全的驾驶旅程，无论是否包含汉堡。\n\
  \n# 第 14 章 烟花庆典与 AI 自动驾驶汽车\n\n人们渴望在今年 7 月 4 日燃放烟花。据最新报告的销售数据显示，烟花销售火爆如热卖煎饼，鞭炮威力十足，销售势头无明显止境迹象（除非通常在\
  \ 7 月 4 日后熄火）。为何今年抢购烟花如此狂热？有几个原因被引述。首先，由于后疫情时代对人群聚集的担忧，大多数正式烟花表演和活动被取消，因此今年无法目睹那些惊人的大型表演。其次，既然大型活动无望，许多人决定自己动手，在自家门前举办自己的烟花秀。第三，一些人认为燃放烟花除是项有趣活动外，还是一种象征性姿态。这意味着人们有了额外的动力参与烟花活动，既为娱乐，也为展示关于我们时代的信息或重要声明。第四，或许是最直接的原因，在家里憋了几个月后，人们想出门狂欢，而\
  \ 7 月 4 日似乎提供了毫无拘束的理由。一年中有多少次你可以合法地坐或站在自家屋外，通常也利用街道空间，尽情狂欢，享受人生极乐，制造喧嚣，伴随巨大的噪音、爆炸和绚烂的火光。我们尊崇的\
  \ 7 月 4 日几乎是全年唯一可以这样做的时刻（或许可包括除夕夜，但那相比之下规模较小、分量较轻）。而今年，7 月 4 日恰逢周六，这个周末提供了无拘无束的狂欢。\n\
  \n许多人不太意识到，对烟花行业而言，7 月 4 日是一年中约 90%收入集中在一个相当紧凑的两周时期的时刻。它被视为季节性产品，通常被称为超强季节性，因对如此有限窗口期的巨大依赖，其余时间都在为下一次年度庆典做准备。当然，全年也有专业烟花表演。许多主题公园全年举办烟花秀，许多体育赛事用烟花庆祝得分或达阵。总体而言，专业语境下的烟花使用量与公众为\
  \ 7 月 4 日消费的惊人数量相比，微不足道。\n\n你可能认为今年 7 月 4 日将是一场规模巨大的烟花盛宴，这显而易见。信不信由你，当疫情在 3 月左右首次爆发时，曾有预测称今年\
  \ 7 月 4 日烟花可能会是巨大的“哑弹”。假设是我们都将坚定地待在室内，因此无法走出户外燃放烟花。这一信念一度让一些烟花公司陷入停滞，他们疲惫地担心能否作为企业生存下来，因为其全年收入来源或许即将崩塌。我们现在知道，相反的情况似乎即将发生，即这将成为公众在\
  \ 7 月 4 日使用烟花有史以来最大规模的一次。烟花公司将这一时刻誉为当时的惊人“中奖彩票”，因碰巧拥有一款人们渴望获得的产品而大获全胜。烟花狂热的另一个原因是渴望做些不同的事，而非坐在家里玩室内游戏。你去不了电影院，因为那些几乎全关门了；去不了商场；甚至可能去不了餐厅吃饭。总而言之，被困在家里且耗尽所有其他选择后，使用烟花的诱惑力大得无法抗拒。\n\
  \n## 对烟花保持警惕\n\n一个显著的负面因素是非法烟花的销售似乎也在上升。你可能会想买非法烟花没什么大不了。不幸的是，除了违法、剥夺合法烟花制造商的销售额外，另一个或许不显而易见的担忧是那些烟花更可能造成伤害。正如你所知，即使合法烟花也很危险，人们可能受伤。据政府研究，每年此时因使用烟花导致数千人受伤。一项政府研究的统计显示，15\
  \ 岁以下儿童占伤亡人数的三分之一以上。烟花棒和瓶装火箭是最常见的致伤产品，这合乎逻辑，因为它们常被粗心使用，且经常交给儿童尝试。不想渲染血腥，但请务必意识到最常见的伤害是手和手指（约占受伤者的\
  \ 28%），其次是腿、眼和耳。烧伤是迄今最常见的伤害形式，可导致毁容或肢体直接丧失。因此，使用非法烟花会增加你或亲人受伤害的风险，请记住即使使用合法烟花，你仍在为自己和亲人冒险。\n\
  \n增加潜在烦恼的是有时会伤害到与你的烟花庆祝无关的他人。玩得有点疯狂时，7 月 4 日燃放烟花的人倾向于将这些爆炸武器抛向空中，落在附近邻居身上，有时造成伤害，或因点燃屋顶而引发火灾。关键是每个人，我指的是每个人，在即将到来的\
  \ 7 月 4 日使用烟花时都需要深思熟虑、适度且小心。尽管寄予厚望，但可以肯定的是会有大量伤害，尤其是今年，因家庭烟花派对激增，且人们无疑都想走出家门前往街道观看社区即兴烟花盛宴。医院急诊室已在为后果做准备。如果这显得过于悲观，抱歉给欢乐蒙上阴影，但我亲眼目睹过可能发生的严重伤害及对一个人生活的长期不利影响，包括对幼童，一点清醒和警示值得被视为扫兴之举。\n\
  \n换个话题，当人们在自家门前燃放烟花时，通常选择在街道上。这显而易见，因为前院可能有草或灌木，更容易着火，而街道的沥青路面似乎对烟花引起的火焰和爆炸免疫。你曾在\
  \ 7 月 4 日晚上开车去杂货店吗？如果去过，你就知道这是一年中驾驶最棘手、最恐怖的夜晚之一（甚至比万圣节穿梭道路更难）。在 7 月 4 日穿梭你社区的街道时，你需要缓慢绕行人们搭建烟花表演的地点。此外，一些人坐在街道上的折叠椅里，儿童来回奔跑，极易成为行驶汽车的撞击目标，而那些孩子通常太兴奋，不留意车辆交通，对周围发生的事毫无察觉。夜间黑暗倾向于隐藏街道内外的事物，加上烟花的突然闪光会干扰你的视线，分散你直视前方的注意力，并惊吓驾驶员做出鲁莽的驾驶判断。许多家长被要求开车去商店买更多苏打水或薯片时，很可能会三思并建议等到第二天。\n\
  \n7 月 4 日夜间驾驶的另一个因素是，有白痴和（我敢说）流氓以向行驶汽车扔鞭炮为乐。这不是好主意。任何选择在烟花庆祝时段驾驶汽车的人都在冒巨大风险，且必须有至关重要的理由。相关方面是如何将烟花受伤的儿童或成人送往急诊室，这增加了进一步的复杂性，因为你可能自己开车，但因障碍物和街道上的人而限制车速，救护车等首批响应车辆面临相同障碍。总而言之，请在这个即将到来的\
  \ 7 月 4 日保持安全，如果可能，尽量避免上路驾驶，尤其是晚间烟花高峰活动期间。\n\n提及 7 月 4 日驾驶汽车的焦虑与煎熬，引出了一个相关话题。自动驾驶汽车将逐渐成为一种可行的交通形式。基于\
  \ AI 的真正自动驾驶汽车将不使用人类驾驶员。这里有一个引人入胜的问题：基于 AI 的真正自动驾驶汽车在 7 月 4 日晚上驾驶会有任何困难吗？如果有，AI\
  \ 驾驶系统可能面临何种困难？让我们拆解这个问题一探究竟。\n\n## 理解自动驾驶汽车的级别\n\n作为澄清，真正的自动驾驶汽车是指 AI 完全自主驾驶汽车，驾驶任务中无任何人类协助。这些无人驾驶车辆被视为\
  \ L4 和 L5 级，而需要人类驾驶员共同分担驾驶任务的汽车通常被视为 L2 或 L3 级。共同分担驾驶任务的汽车被称为半自动驾驶，通常包含各种自动化附加功能，称为\
  \ ADAS（高级驾驶辅助系统）。目前尚无 L5 级真正的自动驾驶汽车，我们甚至不知道能否实现，也不知需要多长时间。同时，L4 级努力正逐渐尝试通过非常狭窄和选择性的公共道路试验获得一些进展，尽管关于是否应允许此类测试存在争议。由于半自动驾驶汽车需要人类驾驶员，采用这类汽车不会与驾驶传统车辆有显著不同，因此关于它们在这个话题上没有太多新内容可讲（尽管，正如你稍后将看到的，接下来的观点普遍适用）。对于半自动驾驶汽车，重要的是公众需要被预先警告关于一个最近出现的令人不安的方面，即尽管那些人类驾驶员不断发布自己在\
  \ L2 或 L3 级汽车方向盘前睡着的视频，我们所有人都需要避免被误导，认为驾驶半自动驾驶汽车时可以将注意力从驾驶任务上移开。无论 L2 或 L3 级汽车投入多少自动化，你都是车辆驾驶行为的责任方。\n\
  \n## 自动驾驶汽车与 7 月 4 日\n\n对于 L4 和 L5 级真正的自动驾驶车辆，驾驶任务中不会有人类驾驶员参与。所有乘客将是乘客。AI 在驾驶。关于自动驾驶汽车最常见的误解大概是错误地认为它们将是“超人类”的，并以远超人类的方式驾驶。我们当然可以同意\
  \ AI 不会酒驾，从这个意义上说，是的，这比选择酒后驾驶的人类驾驶员有所改进。但你会认为不喝酒等同于“超人类”能力吗？似乎令人怀疑。还请注意，普遍接受的驾驶级别标准表明，AI\
  \ 应以人类驾驶员在道路上潜在的驾驶方式进行驾驶，这意味着如果人类能开到某地，AI 也应能做到，尽管不一定超越人类能驾驶的范围。同样，那作为驾驶能力并不特别“超人类”。此外，现有驾驶级别排除了越野驾驶行为。因此，如果车企和自动驾驶技术有此规定，AI\
  \ 或许能进行越野驾驶，但这不是要求。基于各种原因，请不要在脑海中树立 AI 驾驶系统将是超人类的观念，这具有误导性并提供虚假预期。\n\n这一点之所以重要且契合关于\
  \ 7 月 4 日驾驶的整体讨论，是因为你不应假设真正的自动驾驶汽车会以超越人类处理驾驶境况的神奇方式驾驶。当然，AI 不会微醺，也不会在穿梭于烟花铺满的街道时感到“恐惧”，从而避免了那些人类驾驶员的缺陷。另一方面，检测所有那些低矮物体对自动驾驶汽车并不容易。通过车辆大灯，摄像头将尽力视觉扫描场景并弄清正在发生什么。雷达可能会检测到大量物体，但贴近地面的物体难以辨别。激光雷达会有帮助，其他传感器也是，尽管热成像等在烟花闪烁喷吐火焰时会“看”得眼花缭乱。\n\
  \n与人类不同，AI 不太可能被编程为应对 7 月 4 日现象的具体细节。人类知道地上有大量烟花，那些本质上很危险。此外，人类知道儿童容易到处奔跑，有时甚至躺下或蹲在街道中央。请记住，当今\
  \ AI 完全缺乏任何形式的常识或所谓的常识推理。目前，AI 范围非常狭窄，无法像人类那样“思考”。这至关重要，因为 AI 不会“理解”7 月 4 日道路上发生的事，而只是对车辆前方碰巧看到的东西做出反应。人类驾驶员会对道路上发生的事有一个整体概念，并能推定通过拥有应对事务的通用计划来更敏锐地驾驶。AI\
  \ 将一步步地处理一切，仿佛它完全没有为什么人们在街道上、他们在做什么的语境概念。\n\n你可以争辩说驾驶员是否有大局观无关紧要，唯一重要的是车前方的即时情况。在某种程度上，车前方的动作确实是最重要的因素，但我们在开车时也做大量预判性的心理工作。例如，我可能知道前方那条街道两旁住着许多家庭，我可以猜测他们\
  \ 7 月 4 日会大量聚集在户外。同时，如果我在街区尽头右转，我知道那条侧街不太可能有很多人。请注意，仅凭视觉线索，你无法做出同样的驾驶判断，而必须直行驶入聚集人群的街道，只有直接看到才能意识到情况。这正是自动驾驶汽车倾向于做的事。如果你认为\
  \ GPS 和地图能避免此事，似乎极不可能任何普通地图会提供关于街道两旁住着许多有幼童家庭这方面的实质性线索，并提供任何此类预先提示。\n\n不过还有另一种手段可供\
  \ AI 发挥作用。自动驾驶汽车的一个方面是它们使用机器学习（ML）和深度学习（DL），这是一种计算模式匹配，使 AI 能尝试发现模式。也许通过在今年 7 月\
  \ 4 日四处驾驶，ML/DL 可以尝试“学习”街道聚集的情况，为明年和随后几年做好更好准备。但这今年大概率不会发生。大多数自动驾驶尝试不会在 7 月 4 日上路，理所当然。车企和自动驾驶技术公司目前正致力于让自动驾驶汽车在日常境况下安全驾驶。任何在一年一度的\
  \ 7 月 4 日奇观中驾驶的想法都被视为边缘案例或极端案例，表明它太不寻常或非同寻常，不值得此时关注，否则会不当地消耗本应用于标准驾驶的精力。\n\n对自动驾驶汽车而言另一个困难方面是烟花产生的烟雾可能遮挡摄像头传感器的视野。烟花的强烈闪光也可能影响摄像头和车载计算机系统捕获和解读的视觉图像性质。\n\
  \n## 结语\n\n让自动驾驶汽车在传统烟花聚会的街道上穿梭，这超出了当今大多数 AI 驾驶系统能轻松完成的范围。AI 通常被编程为胆小的驾驶员，极其谨慎地移动，潜在物体和障碍物的数量无疑会导致系统决定不继续前进，或以比蜗牛或乌龟还慢的速度前进。我们需要做的是将这种驾驶场景添加到我们希望自动驾驶汽车最终能处理的专业驾驶清单中。同时，我们将很大程度上依赖人类驾驶员，正如我所说，他们应尽可能避免在\
  \ 7 月 4 日晚上驾驶，转而尝试享受庆典，安全且坚定地不让任何人受伤。在这个 7 月 4 日保持安全！\n\n## 附录\n\n\n\n\n# 附录 A 使用本教材进行教学\n\
  \n本书中的材料既可以作为其他课程内容的补充，也可以作为专业课程的核心教材。最有可能使用本教材的课程包括大学阶段希望通过提供关于 AI 和自动驾驶汽车的发人深省且具有教育意义的文章来丰富课程内容的各类课程。\n\
  \n特别是，以下是一些适合课堂使用的方面：\n\n*   **计算机科学** . 学习 AI、自动驾驶汽车等。\n*   **商业** . 探索技术及其在商业中的采用。\n\
  *   **社会学** . 关于技术采用和进步的社会学观点。\n\n本科和研究生阶段的专业课程也可以使用本教材。对于每一章，请考虑该章是否提供与您的课程主题相关的材料。有大量机会引导学生思考相关话题，并迫使他们决定是否同意书中提出的观点和立场。我还鼓励您让学生在章节材料之外进行额外的研究（下面我提供了一些建议的作业）。\n\
  \n## 关于这些主题的研究作业\n\n您的学生可以在各种商业和技术出版物中找到这些主题的背景资料。下面列出了排名靠前的 AI 相关期刊。对于商业出版物，我建议使用常见的权威刊物，如《哈佛商业评论》、《福布斯》、《财富》、《华尔街日报》等。\n\
  \n以下是您可以布置给学生的一些作业或项目建议：\n\na) **基础 AI 研究主题作业** ：研究并准备一篇关于深度 AI、机器学习、ANN 等特定方面的论文和演示文稿。论文应至少引用\
  \ 3 个可靠来源。将其与本书所述内容进行比较和对比。\n\nb) **自动驾驶汽车主题作业** ：研究并准备一篇关于自动驾驶汽车的论文。至少引用 3 个可靠来源并分析其特征。将其与本书所述内容进行比较和对比。\n\
  \nc) **商业主题作业** ：研究并准备一篇关于企业与先进技术的论文和演示文稿。什么热门，什么不热门？至少引用 3 个可靠来源。将其与本书中的描述进行比较和对比。\n\
  \nd) **创业作业** ：让学生准备一篇关于他们如何在该领域创业的论文。他们必须提交一份可靠的商业计划书。也可以要求他们展示商业计划书，因此他们还应准备相应的演示幻灯片。\n\
