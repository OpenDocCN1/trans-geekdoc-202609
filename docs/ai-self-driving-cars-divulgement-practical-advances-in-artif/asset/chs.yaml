  \n向 Peter Drucker、William Wang、Aaron Levie、Peter Kim、Jon Kraft、Cindy Crawford、Jenny\
  \ Ming、Steve Milligan、Chris Underwood、Frank Gehry、Buzz Aldrin、Steve Forbes、Bill\
  \ Thompson、Dave Dillon、Alan Fuerstman、Larry Ellison、Jim Sinegal、John Sperling、Mark\
  \ Stevenson、Anand Nallathambi、Thomas Barrack, Jr.以及许多我有幸结识并从中获益良多的创新者和领导者致谢。\n\n\
  感谢 Ed Trainor、Kevin Anderson、James Hickey、Wendell Jones、Ken Harris、DuWayne Peterson、Mike\
  \ Brown、Jim Thornton、Abhi Beniwal、Al Biland、John Nomura、Eliot Weinman、John Desmond\
  \ 以及许多其他人在我职业生涯中给予的坚定支持。\n\n最重要的是，一如既往地感谢 Lauren 和 Michael，感谢他们持续的支持，以及在我撰写本书的数月里，见证了我的写作过程并听闻了大量相关内容。感谢他们的耐心和倾听。\n\
  \n\n\n\n\n# 简介\n\n这是一本提供最新创新成果和人工智能（AI）最新进展的书籍，内容涉及基于 AI 的自动驾驶无人驾驶汽车的新兴本质。通过人工智能（AI）和机器学习（ML）的最新进展，我们正在逼近这样一天：车辆能够自我控制，不再需要也不依赖人类干预来执行驾驶任务（或者允许人类干预，但仅以非常有限的方式要求人类干预）。\n\
  \n与我其他相关书籍类似——我稍后会描述这些书籍，并在本书附录 A 中列出章节——我特别关注与自动驾驶汽车相关的进展。“自动驾驶车辆”一词常用于指代任何类型的车辆，无论是陆基、空基还是海基，无论是货运拖车还是传统乘用车。尽管本书所述方面当然适用于各类自动驾驶车辆，但我此处更侧重于汽车。确实，我因协助推动自动驾驶汽车的发展而广为人知，目前担任赛博网络\
  \ AI 自动驾驶汽车研究所执行董事。除了编写软件、为自动驾驶汽车设计和开发系统及软件外，我还大量演讲和撰写相关主题的文章。\n\n本书是我部分高阶随笔的合集。对于可能在其他地方见过我随笔的读者，我已对它们进行更新，并将其整合成本书这一便捷、连贯的整体。您可能对我的配套书籍感兴趣，那些书籍提供了关于自动驾驶汽车的额外关键创新和基础知识。这些书籍的书名分别为：《自动驾驶无人驾驶汽车导论》、《AI\
  \ 与自动驾驶车辆的进展：赛博网络自动驾驶汽车》、《自动驾驶汽车：所有 AI 项目之母》、《自动驾驶无人驾驶汽车的创新与思想领导力》、《AI 自动驾驶无人驾驶汽车的新进展》、《自动驾驶车辆无人驾驶自动驾驶汽车与人工智能》、《变革性\
  \ AI 无人驾驶自动驾驶汽车》、《颠覆性 AI 与无人驾驶自动驾驶汽车》、《最先进的 AI 无人驾驶自动驾驶汽车》、《AI 自动驾驶汽车的顶级趋势》、《AI\
  \ 创新与自动驾驶汽车》、《AI 无人驾驶汽车的关键进展》、《社会技术洞察与 AI 无人驾驶汽车》、《AI 无人驾驶汽车的开创性进展》、《AI 无人驾驶汽车的前沿趋势》、《AI\
  \ 自动驾驶汽车的尖端》、《AI 自动驾驶汽车的下一波浪潮》、《AI 自动驾驶汽车的革命性创新》、《AI 自动驾驶汽车的突破》、《AI 自动驾驶汽车的开拓性趋势》、《AI\
  \ 无人驾驶汽车的独创进展》、《AI 无人驾驶汽车的远见秘诀》、《引领 AI 自动驾驶汽车》、《推动 AI 自动驾驶汽车》、《前卫 AI 无人驾驶汽车》、《AI\
  \ 自动驾驶汽车的演变》、《AI 无人驾驶汽车的蛹化期》、《提升 AI 自动驾驶汽车》、《AI 自动驾驶汽车的引领潮流》、《AI 自动驾驶汽车的最前沿》、《AI\
  \ 自动驾驶汽车的涌现》、《AI 自动驾驶汽车的进步》、《AI 自动驾驶汽车的预后》、《AI 自动驾驶汽车的势头》、《AI 自动驾驶汽车的进展》、《AI 自动驾驶汽车的变迁》、《AI\
  \ 自动驾驶汽车的自主性》、《AI 无人驾驶汽车的蜕变》、《AI 无人驾驶汽车的潜能》、《AI 无人驾驶汽车的现实》、《AI 自动驾驶汽车的实质性》、《AI 自动驾驶汽车的符合性》、《AI\
  \ 自动驾驶汽车的平静》、《AI 自动驾驶汽车的揭示》（均可在亚马逊购买）。\n\n对于本书，我将借用那些配套书籍的简介，因为它很好地勾勒了自动驾驶汽车的全貌以及我对该主题的总体观点。\n\
  \n## 自动驾驶汽车导论\n\n这是一本关于自动驾驶汽车的书。未来的某一天，我们都将拥有自动驾驶汽车，而本书或许会显得过时，但就目前而言，我们正处于自动驾驶汽车浪潮的最前沿。每日新闻轰炸式地发布各大车企的新公告，让人印象深刻，仿佛在未来几周或几个月内，自动驾驶汽车就会问世。普通非技术读者会从这些新闻闪讯中推断，我们确实迫在眉睫地将迎来真正的自动驾驶汽车。\n\
  \n我们距离拥有真正的自动驾驶汽车还有相当长的距离。真正的自动驾驶汽车无异于“登月计划”。正如将人类送上月球是一项不可思议的壮举，实现真正的自动驾驶汽车亦是如此。任何暗示甚至鲁莽宣称真正的自动驾驶汽车即将到来的人，都应持高度怀疑态度。确实，当我评估关于自动驾驶汽车的那些明显的假新闻时，您会看到我经常倾向于使用“胡扯”或“废话”这样的词汇。确实，我一直在撰写一篇关于自动驾驶汽车的热门博客文章，猛烈抨击那些挥挥手就假装我们即将迎来真正自动驾驶汽车的人。\n\
  \n多年来，我一直被称为“AI 内行”。除了撰写 AI 文章，我还开发 AI 软件。我言行一致。这也让我洞察到其他从事 AI 工作的人*真正*在做什么，与*宣称*他们在做什么之间的区别。许多忠实读者曾请我将我富有洞察力的短文汇编成另一本书，即您现在手中的这本。对于多年来阅读我随笔的读者，这部合集不仅将它们汇集成一个便捷的整体，我还更新了随笔并增加了新内容。对于初接触自动驾驶汽车和\
  \ AI 主题的读者，我希望你们能觉得这些随笔平易近人且信息丰富。\n\n我还倾向于采用带有个人风格的写作方式，因此您会看到我有时带有讽刺幽默感，并嘲弄墨守成规。作为前教授和\
  \ AI 研究实验室创始人，我多年使用正式的学术写作语言。我曾在同行评审期刊上发表文章，并担任多本 AI 期刊的编辑。此处的写作并非那种性质，我为这些随笔采用了不同且更非正式的风格。话虽如此，我仍不时提及更严谨的\
  \ AI 材料，如果您感兴趣，鼓励大家深入钻研那些更深层、更正式的资料。\n\n我也是一名 AI 从业者。这意味着我以编写 AI 软件为生。目前，我领导赛博网络自动驾驶汽车研究所，我们在那里开发用于自动驾驶汽车的\
  \ AI 软件。对于阅读本书且热衷于编写代码的读者，您可以考虑查看可用于自动驾驶汽车的开源代码。这是一个学习如何为自动驾驶汽车开发 AI 的好起点。还有许多新的教育课程涌现出来。想要了解和开发自动驾驶汽车的人群日益壮大，学院、实验室和其他学习自动驾驶汽车的途径也日益增多。本书将提供我认为能让您为那些更高级培训机会做好准备的基础方面。如果您已经上过那些课程，您可能会发现这些随笔特别有趣，因为它们提供了一种视角，我打赌很少有其他讲师或教职员工会提供给您。这些是极具挑战性的随笔，要求您跳出常规思维来思考自动驾驶汽车。\n\
  \n## 所有 AI 项目之母\n\n2017 年 6 月，苹果 CEO 蒂姆·库克终于承认苹果一直在研发自动驾驶汽车。正如您将在我的随笔中看到的，苹果对其自动驾驶汽车项目一直守口如瓶。我们只能通过蛛丝马迹来猜测苹果在搞什么。“iCar”的概念已经流传了一段时间，自动驾驶工程师和研究人员签署了严格保密的保密协议（NDA），去参与苹果那些神秘程度堪比军事入侵计划的项目。\n\
  \n蒂姆·库克说了一句许多 AI 领域人士一直在说的话，即：制造自动驾驶汽车堪称**所有 AI 项目之母**。换句话说，这对 AI 而言确实是一个巨大的“登月计划”。如果能打造出自动驾驶汽车且\
  \ AI 能按预期工作，意味着我们在 AI 方面取得了惊人的进步，因此将为 AI 可解决的许多其他潜在突破性成就打开大门。\n\n这是夸张吗？我只是想让 AI\
  \ 看起来像个奇迹创造者，从而为我们这些编写自动驾驶汽车 AI 软件的人提供自我吹嘘的言论吗？不，这不是夸张。开发真正的自动驾驶汽车真的、真的、真的非常难。请允许我花一点时间解释原因。\n\
  \n作为旁注，我意识到苹果 CEO 有时以夸张著称，他之前曾说例如 2012 年是“所有年份之母”，iOS 10 的发布是“所有发布之母”——所有这些都表明他喜欢使用现成的“所有……之母”表达。但我向您保证，就真正的自动驾驶汽车而言，他一针见血。毫无疑问。\n\
  \n当您思考登月计划及我们如何登上月球时，会发现一些可识别的特征，这些特征同样适用于创造真正的自动驾驶汽车。您会注意到，我一直在“自动驾驶汽车”一词前加上“真正”二字。我这样做是因为根据我关于自动驾驶汽车各级别的随笔，有些自动驾驶汽车只是*某种程度上*的自动驾驶汽车。这些“某种程度”的版本需要人类驾驶员随时准备接管。依我之见，那不是真正的自动驾驶汽车。真正的自动驾驶汽车是完全不需要人类驾驶员干预的汽车。它是一辆能完全通过自动化承担驾驶任务、无需任何人类驾驶员的汽车。这就是所谓的\
  \ 5 级自动驾驶汽车的本质。我们目前处于 2 级和 3 级阶段，尚未达到 5 级。\n\n登月涉及设定宏大的伸展目标、循序渐进、实验、创新等方面。让我们回顾一下这些如何适用于过去的登月计划，以及如何适用于当今的自动驾驶汽车登月计划。\n\
  \n### 宏大的伸展目标\n\n试图将人类送上月球并安全带回，在当时是一个极其宏大的伸展目标。没人知道能否做到。技术尚不可用。成本巨大。需要坚定不移的决心。等等。达到\
  \ 5 级自动驾驶汽车将是同样的情况。这是一个宏大的伸展目标。我们可以轻松达到 3 级，并能看到前方不远的 4 级，但 5 级是否可行仍是未知数。它最终应该可行，就像我们曾认为最终能登上月球一样，但何时实现则是另一码事。\n\
  \n### 循序渐进\n\n登月不是一蹴而就的。它花费了数年数年的循序渐进才达成。自动驾驶汽车亦是如此。谷歌以致力于直接达到 5 级而闻名，且几乎愿意放弃处理中间级别，但大多数其他自动驾驶汽车制造商正在走循序渐进的路线。让我们先搞定一个扎实的\
  \ 2 级和一个勉强算得上 3 级的系统。然后，改进 3 级并实现一个勉强算得上 4 级的系统。接着，改进 4 级并最终达到 5 级。这似乎是我们实现真正自动驾驶汽车的主流方式。\n\
  \n### 实验\n\n您可能知道，为完善登月的方法和技术，进行了各种实验。按照循序渐进的原则，我们首先尝试看能否让火箭进入太空并安全返回，然后送入一只猴子，接着送入人类，然后我们飞向月球但不着陆，最后才实现了真正登月的任务。\n\
  \n自动驾驶汽车也是如此。我们在做自动驾驶汽车的仿真。我们在受控环境下的私有土地上测试自动驾驶汽车。我们在公共道路上测试自动驾驶汽车，通常必须满足监管要求，例如车上必须有工程师或同等人员，以便在需要时接管控制权。等等。无论大小，实验都是弄清什么行得通、什么行不通所必需的。\n\
  \n### 创新\n\n已经有一些 AI 进展让我们能向自动驾驶汽车迈进。我们还需要更多进展。实现真正的自动驾驶汽车需要技术各方面的创新。绝不意味着我们已经掌握了所需的一切。请期待新发明、新方法、新算法等。\n\
  \n### 挫折\n\n大多数评论家都在回避谈论自动驾驶汽车进程中潜在的挫折。登月过程涉及许多挫折，其中一些您从未听说过，当时被掩盖起来，以免削弱登月的热情和资金支持。我许多收录的随笔中反复出现的一个主题是，在我们试图实现真正的自动驾驶汽车时，将会遇到挫折。深吸一口气，做好准备。我只是希望挫折不会完全阻止进展。我确信这将以我们在自动驾驶汽车领域迄今未见的方式改变进程。\n\
  \n我将当今的自动驾驶汽车比作 Uber 初创时引发的万人空巷般的狂热。今天，我们对 Uber 有了不同的看法，随着每一天的过去，网约车业务面临更多监管，引发更多担忧。宠儿只有在闹腾之前才是宠儿。自动驾驶汽车也将发生同样的情况。\n\
  \n## 自动驾驶汽车的挑战\n\n但究竟是什么让真正的自动驾驶汽车如此之难，您可能会问。您见过巡航控制系统很多年了。最近您见过能自动平行泊车的汽车。您在 YouTube\
  \ 上见过特斯拉车主把手伸出车窗，汽车在高速公路上疾驰，看起来就像在自动驾驶汽车里。我们难道只需要在车上再装几个传感器，就能拥有真正的自动驾驶汽车了吗？并非如此。\n\
  \n请花片刻思考驾驶任务的本质。我们不会让任何年龄的人随随便便开车。全球大多数国家要求驾驶员年满 18 岁才发放驾照，尽管许多国家允许 15 或 16 岁申请学习驾驶许可。有人认为年龄较小者身体太矮，够不着车辆控制装置。虽然这可能是事实，但我们可以轻松调整控制装置以适应年龄较小、身材较矮的人。关键不在于他们的身体大小。而在于他们的认知发展。\n\
  \n开车需要能够对汽车进行推理，了解汽车能做什么、不能做什么。您需要知道如何操作汽车。您需要知道道路上其他汽车是如何行驶的。您需要知道驾驶中允许做什么，例如限速和在标线车道内行驶。您需要能够对情况做出反应，并能避免事故。您需要判断何时踩刹车、何时避开行人、以及如何避免撞上刚切入您车道的摩托车手。\n\
  \n我们许多人都上过驾驶课程。我们学习驾驶知识并接受驾驶训练。我们必须通过考试才能开车。关键在于，尽管大多数成年人视驾驶为理所当然，且经常“心不在焉”地开车，但驾驶汽车实际上涉及大量的认知努力。久而久之，这变成了第二天性。您不再特别思考如何开车，只是去做。但如果您观察一位新手司机，比如正在学车的青少年，您突然会意识到，这比我们想象的要复杂得多。\n\
  \n此外，驾驶是一项非常严肃的任务。我记得女儿和儿子初学开车时。他们都是非常有责任心的人。他们想确保无论做什么，都做好，且不伤害任何人。每天，当您坐进车里，您驾驭的大约是\
  \ 4000 磅（约两吨）沉重的金属和塑料，它是一件致命武器。想想看。您驾驶着一个重两吨的物体在街道上行驶，发动机能让它加速并撞向您想撞的任何东西。汽车能造成的破坏非常可怕。我的两个孩子都很惊讶，他们竟然被赋予了驾驭这头怪兽的权利，仅仅松开方向盘片刻或眼睛离开道路，就可能造成巨大伤害。\n\
  \n事实上，仅在美国每年就有约 30,000 人死于车祸，平均每天约 100 人。考虑到美国约有 2.63 亿辆汽车，我其实更惊讶于死亡人数并没有高得多。在早高峰通勤时，我看着高速公路上周围成千上万辆车，心想如果它们突然都“发疯”以疯狂狂躁的方式行驶，会有很多人丧生。然而，不可思议的是，每天大多数人都能相对安全地驾驶。对我来说，这本身就是个奇迹。让成千上万万人在驾驶两吨重的移动物体时保持安全理智，这是我们作为一个社会应该引以为豪的壮举。\n\
  \n所以，希望您同意驾驶任务需要大量的认知能力。开车不需要特别聪明，我们已经做了大量工作，让即使是普通笨蛋也能开车。开车不需要参加智商测试。如果您会读写，并能通过考试，基本上就能合法开车。当然也有人无证驾驶，还有农场等私人区域允许未成年人驾驶，但就美国公共道路而言，您普遍可以是普通智力（或更低）水平并合法驾驶。\n\
  \n这似乎暗示认知努力不大。如果认知努力真的很难，难道只有爱因斯坦才能开车吗？我们通过使控制装置简单且相对标准化、道路相对标准化等方式，竭力保持驾驶任务尽可能简单。这仿佛迪士尼乐园将他们的“汽车世界”搬进了现实世界，由我们全社会达成共识：道路将以特定方式建设，我们都将遵守各种驾驶规则。\n\
  \n人类的一项适度认知任务，至今仍难倒 AI。您当然知道 AI 已能击败棋手并在其他类型游戏中表现出色。这种狭窄的认知并非汽车驾驶的本质。汽车驾驶的范围广得多。它需要关于世界的知识，而下棋的\
  \ AI 系统不需要知道这些。驾驶的认知方面一方面看似简单，但同时需要关于汽车、人、道路、规则以及无数其他“常识”层面的层层知识。我们目前没有任何 AI 系统拥有那种同等广度和深度的感知与知识。\n\
  \n正如我的随笔所揭示的，当今的自动驾驶汽车正在使用“花招”来完成特定任务。其操作范围非常狭窄。此外，它目前假设人类驾驶员随时准备接管。这就像我们教会了一个孩子叠积木，但我们必须就站在旁边，以防孩子叠太高导致积木倒塌。当今的\
  \ AI 脆弱、狭窄，且无法接近人类的认知能力。这就是为什么真正的自动驾驶汽车还在未来的某个地方。\n\n驾驶任务的另一个方面是，它不仅仅是脑力活动。您需要使用感官来驾驶。您用眼睛作为视觉传感器观察前方道路。您的视觉能力就像流式视频，您的大脑需要在驾驶时持续分析它。路在哪里？路上有行人吗？前方有车吗？您的感官源源不断地向大脑输送信息。自动驾驶汽车试图做同样的事，通过使用摄像头、雷达、超声波和激光雷达。这是在尝试模仿人类拥有感官和感觉器官的方式。\n\
  \n因此，驾驶任务是心智与身体的结合。您使用感官，用手臂和腿操纵汽车控制装置，用大脑评估感官信息并指挥肢体作用于汽车控制装置。这一切瞬间完成。如果您曾经眼睛进了异物只能用一只眼开车，您会突然意识到您多么依赖视力。如果您脚骨折打着石膏，您会突然意识到控制刹车和油门有多难。如果您服药后大脑迟钝，您会突然意识到开车需要多大的精神压力。\n\
  \n下棋的 AI 系统只需专注于下棋。身体方面不重要，因为通常由人移动棋子或棋盘显示在电子屏幕上。用 AI 进行分析患者 MRI 影像这种更关乎生死的任务，同样不需要身体能力，而是通过检查图像位来完成。\n\
  \n开车是真正的生死攸关任务。这是一种 AI 应用，随时可能轻易导致死亡。对于像我一样开发这种 AI 的同事们，我们需要铭记这一沉重的方面。我们正在编写掌握车内乘客生命、附近其他车内人员生命、附近行人生命等的软件。下棋通常不关乎生死。\n\
  \n驾驶无处不在。汽车无处不在。当今大多数 AI 应用仅涉及少数人。或者它们在幕后运行，如果 AI 搞砸了，我们人类有其他补救措施。在高速公路上以 80 英里/小时的速度行驶的自动驾驶汽车的\
  \ AI 最好别搞砸。后果极其严重。乘以汽车数量，如果我们能神奇地让美国每辆车都实现自动驾驶，我们将在 2.63 亿辆汽车中运行 AI。这是大规模分布式的 AI，这是我们今天尚未做到的，它既蕴含希望也潜藏危险。\n\
  \n有些人想要自动驾驶汽车的 AI，因为他们设想一个没有任何车祸的世界。他们设想一个没有拥堵、所有汽车相互协作的世界。这些是美好的乌托邦愿景。它们也极具误导性。自动驾驶汽车的采用将是循序渐进的，而非一夜之间。我们不能在经济上直接报废所有现有汽车。也无法负担得起改装现有汽车。更有可能的是，自动驾驶技术将内置于新车中，并在现有汽车逐渐更替的漫长岁月中，我们将看到现实世界中自动驾驶汽车的比例变得可观。\n\
  \n在随笔中，我试图在不过度技术化描述的前提下提供技术洞见，并融合了商业、社会和经济层面。技术人员需要考虑其所为的非技术影响。非技术人员应了解正在开发的内容。我们所有人都需要共同努力，为真正的自动驾驶汽车带来的巨大颠覆和变革性影响做好集体准备。\n\
  \n## 本书提供的内容\n\n本书为您提供什么？它从基于 AI 的视角介绍了关于自动驾驶汽车的许多关键要素。我将技术和非技术方面交织在一起，随时从关注驾驶任务的认知能力及技术如何将其体现在自动驾驶汽车中，转而讨论社会和经济方面。它们相互交织，因为现实就是如此。您不能孤立地看待技术本身，而必须将其置于发明创新的环境中加以考量，并以当代风俗和文化塑造我们正在做的事和希望做的事的心态来审视。\n\
  \n## 为何写这本书\n\n我写这本书，试图将许多关于自动驾驶汽车却似乎无人讨论的方面呈现在公众视野中。对于参与制造自动驾驶汽车或将利用自动驾驶汽车的商业领袖，我希望本书能启迪您了解所涉风险以及应如何制定策略应对这些风险。对于想要进入新兴自动驾驶汽车市场的企业家、初创企业和其他企业，我希望本书能激发您的兴趣，并提供一些关于何种追求可能审慎的感知。对于研究自动驾驶汽车的研究人员，我希望本书能激发您对自动驾驶汽车风险和安全问题的兴趣，并推动您开展相关方面的研究。对于计算机科学或相关学科的学生，我希望本书能为您提供有趣且新颖的想法和材料，供您开展研究或为您的职业方向提供洞见。对于追求自动驾驶汽车的\
  \ AI 公司和高科技公司，本书有望拓宽您的视野，超越单纯的编码和开发。\n\n对于所有读者，我希望您能发现本书材料引人深思。部分内容可能是您已知之事的重复。但我相当确信，您也会发现各种“尤里卡时刻”，从而发现您早先未曾想到的新技术或新方法。我还打赌，会有材料迫使您重新思考您的某些当前做法。我不是说您会突然顿悟并改变所为。但我确实认为，您会重新考虑或重新审视您正在做的事。\n\
  \n对于选择将本书用于教学目的的任何人，请参阅附录中我的建议。我发现这些材料在我讲授的课程中很实用，其他教职人员也告诉我他们发现这些材料很实用，在某些情况下作为扩展阅读，在其他情况下作为课程的核心部分（取决于课程性质）。\n\
  \n在本书的写作中，我试图仔细融合从业者和学术界的写作风格。它不像典型的学术期刊写作那样抽象，但同时通过深入探讨各种实践的细微差别和权衡来提供深度。“深度”是当今的流行词，意味着深入钻研一个主题或话题，“解构”也是流行词，意味着剥离一个主题或话题的底层方面。我力求提供的材料通过相对深入地探讨一个问题或话题，并确保其被充分解构来加以阐述。\n\
  \n在任何关于 AI 的书中，用日常用语却不被误解是很难的。具体来说，很容易将 AI 拟人化。当我说 AI 系统“知道”某事时，我不希望您理解为 AI 系统拥有感知并像人类一样“知道”。它们目前还不是那样。我有时尝试给这类词加引号，以强调我使用的词不应被误解为将真正的人类智能归因于我们目前已知的\
  \ AI 系统。如果我给所有这类词都加引号，本书会非常难读，所以我审慎地使用。请阅读时留意这一点，谢谢。\n\n部分材料基于时间维度涵盖正在进行的活动，虽然其中一些可能会过时，但我相信您仍会发现这些材料有用且信息丰富。\n\
