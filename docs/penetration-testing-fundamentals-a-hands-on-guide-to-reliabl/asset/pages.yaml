- pgno: 226
  md: '# Chapter 9


    # Introduction to Linux


    # Chapter Objectives


    **After reading this chapter and completing the exercises, you will be able to
    do the following:**


    +   - Understand the essentials of Linux

    +   - Execute essential Linux commands

    +   - Understand Linux directory structure


    The next few chapters will be covering Metasploit. Metasploit is part of the Kali
    Linux distribution. That means you won’t be particularly effective with Kali or
    Metasploit if you don’t understand Linux. This chapter gives you an overview of
    the Linux operating system. If you are already proficient in Linux, feel free
    to either skip this chapter or skim it briefly. If, however, there is any doubt
    in your mind regarding your knowledge of Linux, then do at least peruse this chapter.


    # Linux History


    It is certainly possible to work with Linux without knowing its history. You may
    have already been working with Linux for some time, with little or no knowledge
    of how or why it was developed. However, I am a firm believer that when studying
    any topic, an understanding of the history of the subject is important. It can
    give one a context within which to study the topic and often helps clarify why
    some things are the way they are.


    Linux is, essentially, an open source clone of Unix. This is yet another reason
    to learn Linux. The two are so similar that many colleges will use Linux to teach
    Unix. This is because while their operations are remarkably similar, the prices
    are not. Linux is open source, and thus free. Unix can be quite expensive.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Let’s begin by discussing the birthplace of Unix. Unix was a creation of the
    legendary Bell Laboratories. For those readers who are not familiar with Bell
    Laboratories, they are famous for a plethora of technological and scientific breakthroughs,
    including the discovery of the first evidence of the Big Bang, the creation of
    the C programming language, and, of course, the creation of Unix. Bell Laboratories
    was actually founded by Alexander Graham Bell in the 1800s. It was later consolidated
    with AT&T Labs to form the Bell Labs we know today.


    By the late 1960s, computers were advancing. They were nowhere near what you are
    accustomed to today, but the use of computers was expanding. One problem was that
    there was no widely used common operating system. Bell Labs had been involved
    in a project called Multics (Multiplexed Information and Computing Service). Multics
    was a combined effort of Massachusetts Institute of Technology, Bell Labs, and
    General Electric to create an operating system with wide, general-use applicability.
    However, the Multics project was fraught with problems, and Bell Labs decided
    to pull out of the project. A team at Bell Labs, consisting of Ken Thompson, Dennis
    Ritchie, Brian Kernighan, Douglas McElroy, and Joe Ossanna, decided to create
    a new operating system that might have wide usage.


    Unix was an attempt to create an operating system that could run on various hardware.
    Bell Labs intended for Unix to be a general-purpose operating system that could
    be utilized in any number of different scenarios. It turned out to be an unequivocal
    success. Unix was first released in 1971, and it is still, almost 50 years later,
    a widely used operating system. Unix is widely considered to be the most stable
    operating system, and the most secure. It is worth noting that even Apple moved
    from its own proprietary operating system to the Unix variant-based OS X.


    The original name of the project was Unics, a play on the term Multics. Originally
    Unix was a side project by the team, because Bell Labs did not actively provide
    financial support. It was only after the team added functionality that could be
    used on other Bell computers that the company began to enthusiastically support
    the project.


    At that time, all operating systems were written in assembly language. In 1972
    Unix was rewritten entirely in the C programming language. Incidentally, C was
    also developed at Bell Labs, by some of the same team members who worked on the
    Unix project. For these reasons, there has always been a strong connection between
    C and Unix.


    The advent of the open source movement would eventually bring open source Unix
    variants. Open source was first brought to the public forefront by Richard Stallman.
    In 1985 Richard Stallman published a paper entitled “GNU Manifesto.” This document
    outlined the parameters for open source licensing, thus establishing Stallman
    as the father of open source software. Stallman’s Free Software Foundation later
    created the GNU General Public License that is now used for most open source products,
    including Linux.


    Stallman had begun working on his own operating system in 1983. He called this
    system GNU (this acronym stands for GNU is Not Unix). His goal was simply to create
    an open source version of Unix. He wanted it to be as much like Unix as possible,
    despite the name (GNU is Not Unix). However Stallman’s open source Unix variant
    did not achieve widespread popularity, and it was soon replaced by other, more
    robust variants.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'One reason that so many Unix variants arose in the 1970s and 1980s is that
    many of the creators of these variants had actually worked with the Unix source
    code. It is important to keep in mind that when Bell Labs originally created Unix,
    they released its source code to the public. That is no longer the case, but it
    means that computer scientists studying operating systems in the ’70s and ’80s
    were very likely intimately familiar with the Unix source code.


    In 1987 a university professor named Andrew S. Tanenbaum created another Unix
    variant, called Minix. Minix was fairly stable and functional and a reasonably
    good Unix clone. Minix was completely written in C by professor Tanenbaum. He
    created it primarily as a teaching tool for his students. He wanted them to learn
    operating systems by being able to study the actual source code for an operating
    system. The source code for Minix was included in his book Operating Systems:
    Design and Implementation. Placing the source code in a textbook that was widely
    used meant a large number of computer science students would be exposed to this
    source code. Coupled with the earlier release of the original Unix source code,
    this meant many computer science students learned Unix and/or Unix clones quite
    thoroughly. This wide exposure to both the original Unix source code and the source
    code for Unix clones is one reason that most open source operating systems are
    Unix clones.


    Though Minix failed to gain the popularity of some other Unix variants, it was
    an inspiration for the creator of Linux. The story of the Linux operating system
    really is the story of Linus Torvalds. He began his work on Linux in the early
    ’90s when he was a graduate student working toward his Ph.D. in computer science.
    In those days, all computer science students worked with Unix, as there was no
    Windows or DOS, and Apple was still very much a hobbyist computer. So, Torvalds
    was quite familiar with the Unix operating system.


    In addition to learning Unix, Torvalds was also introduced to the Minix operating
    system. Torvalds found many things he liked about the Minix operating system,
    but he believed that he could make a better Unix variant. So he created his own
    Unix clone and released it as open source. He chose the name Linux, as a combination
    of his first name, Linus, and the end of Unix, nix.


    Once his initial Linux project was underway, Torvalds had to address the issue
    of how to get it out to the public. He began by posting the operating system code
    on an Internet discussion board, allowing anyone to use it, play with it, or modify
    it. Finally, Torvalds released Linux 0.01 on the Internet under a GNU public license.
    Because it was open source, other computer scientists and programmers had access
    to the source code. That allowed people all over the world to become involved
    in Linux and to contribute to its development.


    Over the ensuing years, Linux popularity has grown. It has moved from a hobby
    operating system for computer enthusiasts to a full-fledged business operating
    system. Various vendors, including companies and individuals, take the Linux kernel
    and add their own nuances. These nuances may include additional applications,
    different installation processes, and even different targets. For example, Red
    Hat works to create a Linux distribution that is well suited to large-scale servers,
    whereas Ubuntu and Kubuntu are both targeted for novice users installing on a
    single workstation. Then there are Linux distributions like EnGarde, Trustix,
    and NetSecL that are specifically designed for high security. One'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'can also find Linux distributions that are specifically for firewalls such
    as IPCop and FireGate Server. It would not be an exaggeration to say that there
    is a Linux distribution for almost any purpose you might have. And of course there
    is Kali Linux, a favorite in the penetration testing community.


    # Linux Commands


    While the history of Linux is interesting and may put your understanding of Linux
    in context, the real goal of this chapter is to enable you to work with Linux.
    That means using Linux commands. In this section we will explore the basic Linux
    commands.


    # Is Command


    Is is one of the more elementary commands. It simply lists the contents of the
    current directory you are in. You can think of it much like the dir command in
    Windows. You can see this command in Figure 9-1.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_229_0.png)


    FIGURE 9-1 Listing Directory Contents with Is Command.


    Every command in Linux (or Windows for that matter) has flags. These flags allow
    you to modify the command to produce some different result.


    The easiest way to see these commands is to either type the command followed by
    -?, such as


    ```

    ls -?

    ```'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'or use the term **man** (short for manual page) followed by the command, such
    as


    ```

    man ls

    ```


    The following are a few of the more common **ls** flags:


    +   - **-a**: Shows you all files, even files that are hidden

    +   - **ls -l**: Gets properties of files

    +   - **ls -t**: Sorts by modification time


    This is a very fundamental command you should be quite familiar with.


    # cd Command


    The **cd** command is used to change directories, to move either down or up the
    directory tree. It works very much like the **cd** command in Windows. The following
    are a few of the options with **cd**:


    ```

    cd directoryname    // changes to the directory

    cd ~                //changes to home directory for that user

    cd..                //changes up one level

    ```


    This is another very fundamental command. Without a basic grasp of this command,
    you will have a very difficult time navigating folders in Linux. You can see this
    command in Figure 9-2.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_230_0.png)


    FIGURE 9-2  Changing Directories with **cd** Command.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Pipe Output


    All shell commands, by default, display their output to the screen; however, there
    may be instances where you would prefer the output be stored in some file. That
    is where the redirect command (>) comes in. It causes the output from some other
    command to be redirected to a file. This is very useful, particularly for some
    of the system commands:


    ```

    ls > myfile.txt

    ```


    You can see this command shown in Figure 9-3.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_231_0.png)


    FIGURE 9-3 Piping a Command.


    # finger Command


    The finger command is used to get information regarding a specific user. This
    is often useful for a system administrator. For example, if you run the top command
    and see that one specific user is spawning several processes on your server, and
    those processes are consuming resources, then you may want to find out about that
    user. This is shown in Figure 9-4.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_232_0.png)


    FIGURE 9-4 Retrieving User Activity with finger Command.


    # grep Command


    The grep command is so popular with Linux and Unix users because it is so flexible.
    If you type in man grep at the shell, you will see a rather extensive entry, listing
    a number of flags you can pass to grep. One small section, in one chapter of a
    book, could not possibly do justice to the versatility and flexibility of this
    command. However, I can provide you a basic introduction to grep.


    Find all instances of the word “virus” in a file named somefile:


    ```

    grep ''virus'' somefile

    ```


    Look for the same data in the same file, but ignore case:


    ```

    grep -i ''virus'' somefile

    ```


    Look for words beginning with v and ending with s in file somefile:


    ```

    grep ''v...s'' somefile

    ```


    In this case the ... tell Linux how many letters to search for. To search, regardless
    of the number of intervening letters:


    ```

    grep ''v. *s'' somefile

    ```'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'The following command counts the number of accounts that have /bin/false as
    the shell:


    ```

    grep -c false /etc/passwd

    ```


    If grep finds a result, then it displays that line from the text file. If it does
    not find a result, then it displays blank. You can see some basic grep examples
    in Figure 9-5.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_233_0.png)


    FIGURE 9-5 grep Examples.


    # ps Command


    The ps command is related to system processes, and is probably the most basic
    process-related command. It will provide you with a list of the current processes
    running on your system. With no options, ps will list processes that belong to
    the current user and have a controlling terminal. By default, ps selects all processes
    with the same user ID as the current user and associated with the same terminal
    as the invoker. It displays the process ID (PID), the terminal associated with
    the process (TTY), the cumulated CPU time in dd-hh:mm:ss format, and the executable
    name. Output is unsorted by default. However, as with so many shell commands,
    this one has a number of options you can pass to it in order to alter its behavior.
    Here are the more commonly used options:


    +   - **-A**: Displays all processes; this is identical to the **-e** option explained
    below.

    +   - **-N**: Displays all processes except those that fulfill the specified conditions.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '+   - **-a:** Displays all processes with a TTY except session leaders and
    any process not associated with a specific terminal.

    +   - **-d:** Displays all processes, but will omit session leaders.

    +   - **-e:** Displays all processes on this system regardless of user or terminal.

    +   - **-T:** Displays all processes on this terminal.

    +   - **-x:** Displays processes without controlling TTYs.

    +   - **-H:** Displays the processes in hierarchical format.

    +   - **-w:** Displays the data in wide format.


    You can see the **ps** command and the **ps -e** option in Figure 9-6.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_234_0.png)


    FIGURE 9-6 Displaying All Processes with ps Command.


    # pstree Command


    The **pstree** command is very similar to the **ps** command except that it shows
    all the processes in the form of a tree structure (similar to how **tree** does
    it for directories). I personally find this view of running processes, shown in
    Figure 9-7, to be very useful, and I prefer it over the **ps** command.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_235_0.png)


    FIGURE 9-7 Displaying Processes in Tree View with pstree Command.


    As with most commands, this one has several options you may need to use:


    +   - **-a**: Shows any command-line arguments.

    +   - **-A**: Alters the display by using ASCII characters to draw the tree.

    +   - **-c**: Disables compaction of identical subtrees. By default, subtrees
    are compacted whenever possible.

    +   - **-G**: Causes the display to use VT100 line-drawing characters.

    +   - **-h**: Displays the current process and its ancestors. If this terminal
    does not support highlighting, then it will simply display a normal pstree.

    +   - **-H**: Works just like -h, except it highlights the specified process instead.
    Unlike with -h, pstree fails when using -H if highlighting is not available.

    +   - **-l**: Causes the display to use long lines. By default, lines are truncated
    to the display width or 132 if output is sent to a non-TTY or if the display width
    is unknown.

    +   - **-n**: Sorts processes with the same ancestor by PID instead of by name
    (numeric sort).

    +   - **-p**: Causes the display to show PIDs. PIDs are shown as decimal numbers
    in parentheses after each process name.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '+   - **-u:** Shows UID transitions. Whenever the UID of a process differs
    from the UID of its parent, the new UID is shown in parentheses after the process
    name.

    +   - **-U:** Causes the display to use UTF-8 (Unicode) line-drawing characters.

    +   - **-V:** Displays version information.


    These options can be used to get additional information about the processes in
    the pstree.


    # top Command


    The top command is very much like the ps command except it lists the processes
    in the order of how much CPU time the process is utilizing. This can be very useful
    for an administrator, particularly if you are finding that your CPU utilization
    is high and you wish to identify the culprit. I personally also find the display
    to be far more informational than the ps display. I use the top command far more
    often than I do the ps command. You can see the top command in Figure 9-8.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_236_0.png)


    FIGURE 9-8 Viewing CPU Time of Processes with top Command.


    You should keep in mind that since this command lists processes by their CPU utilization,
    it is entirely possible to get different results if you run the command at different
    times. This command has a number of options that can alter the way it displays.
    In fact, it updates itself, so if you watch it you will probably see the items
    change.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '+   - **-b:** Batch mode operation. Starts **top** in ‘Batch mode’. People
    often use this to send output to some other program or to a flat file.

    +   - **-c:** Command line/program name toggle. Starts **top** with the last remembered
    ‘c’ state reversed.

    +   - **-d:** Delay time interval as **-d ss.tt** (*seconds.tenths*). Specifies
    the delay between screen updates.

    +   - **-h:** Help. Shows the library version and the usage prompt, then quits.

    +   - **-H:** Threads toggle. Starts **top** with the last remembered ‘H’ state
    reversed. When this toggle is *On*, all individual threads will be displayed.
    Otherwise, **top** displays a summation of all threads in a process.

    +   - **-i:** Idle processes toggle. Starts **top** with the last remembered ‘i’
    state reversed. When this toggle is *Off*, tasks that are idled will not be displayed.

    +   - **-n:** Limits number of iterations as **-n number**. Specifies the maximum
    number of iterations **top** should produce before terminating.

    +   - **-u:** Monitors by user as **-u username**. Monitors only processes with
    an effective UID or username matching the one given.

    +   - **-U:** Monitors by user as **-U someuserid**. Monitors only processes with
    a UID or username matching that given.

    +   - **-p:** Monitors only processes with specified process IDs. This option
    can be given up to 20 times, or you can provide a comma-delimited list with up
    to 20 PIDs. Comingling both approaches is permitted. This is a command-line option
    only. And should you wish to return to normal operation, it is not necessary to
    quit and restart **top**—just issue the ‘=’ interactive command.

    +   - **-s:** Secure mode operation. Starts **top** with secure mode forced, even
    for root.

    +   - **-S:** Starts **top** with the last remembered ‘S’ state reversed. When
    ‘Cumulative mode’ is *On*, each process is listed with the CPU time that it and
    any child processes have used.

    +   - **-v:** Shows the library version and the usage prompt, then quits.


    # kill Command


    The **kill** command is very simple. It will kill a running process by ID. It
    simply causes that application or daemon to unload from memory. This command depends
    on the process ID, so you need to find the PID for the process, which you can
    do by using a command like **ps**. Figure 9-9 demonstrates the **kill** command.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_238_0.png)


    FIGURE 9-9 Killing a Running Process with kill Command.


    Obviously, you find process IDs using ps or ps -e, or some similar command. Be
    careful, because unlike Windows, Linux won’t warn you. It will simply kill the
    process. For this demo, I just launched a calculator and then used its process
    ID to kill it.


    # Basic File and Directory Commands


    Basic directory and file commands will be useful to you. The most basic are covered
    here. To create a directory, you use the mkdir command followed by the directory
    name, such as


    ```

    mkdir testdir

    ```


    To delete a file, you use the rm command, as shown here:


    ```

    rm txt

    ```


    To move a file, you use the mv command with the filename and destination, like
    this:


    ```

    mv testfile.txt testdir

    ```


    To delete a directory, it must be empty first, then use rmdir:


    ```

    rmdir testdir

    ```


    Figure 9-10 shows these commands along with ls to show the changes to the files
    and directories.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_239_0.png)


    FIGURE 9-10 Basic File Commands.


    # chown Command


    The **chown** command changes the user and/or group ownership of each given file,
    according to its first non-option argument, which is interpreted as follows. If
    only a username is given, that user is made the owner of the file or files. If
    the username is followed by a colon or dot and a group name with no spaces between
    them, the group ownership of the files is changed as well. This command has several
    options, the most commonly used of which are given here:


    +   - **-c, --changes:** This option works like verbose but reports only when
    a change is made.

    +   - **--dereference:** This causes chown to be applied to the referent of each
    symbolic link, rather than the symbolic link itself.

    +   - **--from=CURRENT_OWNER:CURRENT_GROUP:** This option will causes chown to
    change the owner and/or group of each file only if its current owner and/or group
    match those specified here.

    +   - **-f, --silent, --quiet:** These options cause chown to suppress most error
    messages.

    +   - **-R, --recursive:** This option causes chown to operate on files and directories
    recursively.

    +   - **-v, --verbose:** This option causes a more thorough output.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '+   - **--help:** This will displays help for **chown** and exits.

    +   - **--version:** This will display the version information and exits.


    Figure 9-11 shows a very simple example of **chown**. In this figure, we change
    the owner of the file *atestfile.txt* to the user *bob*.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_240_0.png)


    FIGURE 9-11 Changing File Ownership with **chown** Command.


    # chmod Command


    The **chmod** command is used to change the permissions on a file. The options
    are simple:


    +   - **4** stands for “read.”

    +   - **2** stands for “write.”

    +   - **1** stands for “execute.”

    +   - **0** stands for “no permission.”

    +   - **7** combines **4**, **2**, and **1**, giving all permissions.


    The syntax is


    ```

    chmod options permissions filename

    ```'
  merge: -1
  img_proc: true
