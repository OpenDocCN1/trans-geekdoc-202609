- pgno: 313
  md: 'The message you see on the screen is telling you that your Metasploit payloads
    might be detected by some antivirus products. The suggestion is to upgrade to
    Metasploit Pro and use the Dynamic Payloads found in that product. Now you only
    need to do one more thing and you are ready to start. That is to check the database.
    Metasploit uses a database. The way to check and make sure it is running properly
    is to type:


    ```

    db_status

    ```


    If all is well, you will see the message shown in Figure 13-4.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_313_0.png)


    FIGURE 13-4 Database Connected.


    If there is any problem, you will see the message shown in Figure 13-5.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_313_1.png)


    FIGURE 13-5 Database Not Connected.


    If the database connection is not working, you can still use Metasploit but you
    won’t be able to save the results to the database. But now you are ready to use
    Metasploit!


    # Basic Usage of msfconsole


    We will begin with basic navigation and commands in this section. In the next
    sections you will learn to conduct scans with Metasploit and to perform exploits;
    however, you will need to refer back to these commands to navigate in Metasploit.


    # Basic Commands


    The basic commands that you will use most frequently in Metasploit are briefly
    described here:


    +   - **back:** This command is used to back out of an exploit. For example, if
    you just attempted an exploit and it did not work, and you wish to try another,
    then use this command to back out to the main Metasploit console.

    +   - **load:** You will use this command frequently. It allows you to load any
    module/plugin.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '+   - **unload:** This will unload a plugin.

    +   - **exit or quit:** These should be obvious. They quit Metasploit.

    +   - **use:** By the time you finish this chapter, you will be very familiar
    with this command. It is the command that tells Metasploit what you are going
    to use. This will become very clear in the next section on scanning.

    +   - **show exploits:** This shows exploits.

    +   - **show payloads:** Once you have loaded an exploit, this will show you the
    payloads you can use with that exploit.

    +   - **show options:** If you load a payload or an exploit, **show options**
    will tell you what options you can set and what you must set.

    +   - **jobs:** This command shows you currently running jobs.

    +   - **kill:** This command is used to kill any running job.

    +   - **sessions:** This shows you active sessions. If your exploit is successful,
    then you will have one or more running sessions. Then you can use **sessions -i
    3** (replace **3** with the session number you want) to take control of that session
    and interact with the target machine.

    +   - **msfupdate:** Metasploit updates the framework from time to time. If you
    want the latest, you type **msfupdate** from the shell. Notice I said from the
    shell, not from inside Metasploit.


    This is Linux, and remember that Linux is case sensitive.


    Again, these are the most fundamental commands. As you work through the chapter,
    you may wish to refer to this list from time to time.


    # Searching


    Metasploit has quite a lot in it. And you will be forgiven if you cannot memorize
    it all. Fortunately, it also has a very good built-in search capability. You can
    easily search for exploits in a variety of ways. Let us begin by searching by
    platform.


    You can try:


    ```

    search platform:Windows

    ```


    But that will quickly fill many screens with numerous results. And it is not that
    helpful. Is a given exploit for Windows 7, or Windows 8, or Windows Server 2016,
    or Windows 10? You can modify this to be more specific:


    ```

    search platform:"Windows 8.1"

    ```


    This will help you get exactly what you are looking for. You can see this in Figure
    13-6.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_315_0.png)


    FIGURE 13-6 Searching by Platform.


    That is only one of many search options. Here are a few others:


    +   - search name:mysql

    +   - search path:scada

    +   - search author:jsmith


    You can even combine searches:


    ```

    search cve:2011 author:jsmith platform:linux

    ```


    The search by author might seem odd. But these exploits are created by individual
