    These tools are not actually penetration testing tools. They are more security
    audit tools, also sometimes used in forensics. But keep in mind a theme throughout
    this book: a penetration tester is not a hacker. He or she will use hacking techniques,
    but the ultimate goal is to improve the system security. Therefore, from time
