- pgno: 280
  md: '# Introduction to Kali Linux


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand Kali Linux

    +   - Use Kali Linux features

    +   - Work with tools in Kali Linux


    Chapters 9 and 10 should have provided you with a basic working knowledge of Linux
    as well as an understanding of Linux security. Chapter 10 also gave you a look
    at Linux penetration testing and hacking issues.


    In this chapter, we will explore Kali Linux. The Kali Linux distribution is meant
    specifically for hacking, forensics, and cyber security. It is simply full of
    tools that can be used for penetration testing. You should be aware, however,
    that new releases sometimes change the toolset included. Some tools might be added
    or removed.


    # Kali Linux History


    Kali Linux is based on the Debian Linux distribution. Kali is maintained by Offensive
    Security, the vendors who also provide the Offensive Security Certified Professional
    (OSCP) certification test. While there are tools that come and go, some like nmap,
    Wireshark, Metasploit, and Burp suite are always included.


    Kali is the successor to BackTrack Linux. That distribution was based on Knoppix
    Linux and also included a wide range of pen testing related tools.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Kali Basics


    Kali is a free download (https://www.kali.org/). It is often loaded into a virtual
    machine (Oracle Virtual Box or VMware Workstation are popular choices). I recommend
    using it as a Live use (as shown in Figure 11-1), rather than installing it.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_281_0.png)


    FIGURE 11-1 Kali Linux Live.


    When teaching Kali or using it for penetration testing, I usually set the VM network
    to **bridge** and manually set a static IP address with **ifconfig eth0 191.168.0.XXX**.
    In Oracle Virtual Box (which is also a free download; https://www.virtualbox.org/),
    those settings can be found under the Machine drop-down list. Note that if you
    are instead using a VM for Kali, and testing with another VM as your target, both
    hosted on the same host, then instead of bridge, use the network setting **host
    only**. Figure 11-2 shows Oracle Virtual Box network settings.'
  merge: -1
