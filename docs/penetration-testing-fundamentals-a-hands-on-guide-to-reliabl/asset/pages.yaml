    testing. These standards can be used to guide your penetration testing efforts.
    When conducting a penetration test that is governed by a specific standard (such
    as PCI DSS compliance), you obviously must follow that standard. But even if your
    penetration test is not governed by a specific standard, referencing and using
    such standards will aid you in performing a more comprehensive penetration test.
