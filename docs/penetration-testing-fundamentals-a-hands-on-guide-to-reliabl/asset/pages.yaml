- pgno: 381
  md: '# Certification and Training


    Chapter 1, “Introduction to Penetration Testing,” briefly discussed industry certifications.
    In this chapter we will delve deeper into options for training, certifications,
    education, and more. As you are reading a book on penetration testing, clearly
    you have a desire to learn. You may even be reading this book as part of some
    class. However, you have entered a field where constant learning is a must. You
    will never know everything there is to know, and you must constantly be learning
    more. How do you address this issue? Moreover, do you know enough to start a career
    in penetration testing? In this section I will answer these questions.


    Let us begin with examining the requisite knowledge to be a penetration tester.
    Periodically, I see people advocate that formal education is irrelevant for penetration
    testing, or for cyber security in general. And such people will point to someone
    with a completely irrelevant degree (such as history, for example) or no degree
    at all, who happens to be doing well in this career. My experience does not support
    this.


    In general, those without any solid computer science background may have a career
    in cyber security, even penetration testing, but will have significant gaps in
    their knowledge. And these are gaps that would have been filled with some solid
    computer education. To be successful in cyber security, you need a working knowledge
    of how networks operate, computer operating systems, and some programming language,
    just to have a basic understanding of cyber security. For penetration testing,
    even more so.


    That fact is that to be truly effective at security requires a broader skill set
    than most other areas of IT. If you are an Oracle DBA, you really only need to
    know Oracle. If you are a driver programmer, then you need to really know C, and
    probably Assembly. But if you are in security, you need to have a working knowledge
    of networking, at least one or two programming languages, databases, operating
    systems, etc., as well as security-specific knowledge such as standards, procedures,
    pen testing techniques, etc. And frankly, all too many security professionals
    just don’t have that diverse knowledge. This is a very demanding profession that
    will require a very high standard. To use as an analogy medical doctors, cyber
    security is not like being a family practitioner, podiatrist, etc. To do it right
    is more akin to specialized surgical disciplines. And those require more training
    (both initially and ongoing continuing education).


    There are certainly people in cyber security (and in IT in general) without relevant
    degrees. However, having done this for about 30 years, my experience has been
    that these people fall into one of two categories:


    +   - The serious “computer nerd” who might not have a computer degree, but has
    been tinkering with computers, coding, etc. since childhood. This person may not
    have a computer degree, but has read more computer science books than they would
    have in obtaining three degrees. Their lack of formal education is compensated
    with a lifetime of delving into the topic.

    +   - The second group are simply not as good as they think they are. I frequently
    meet people with irrelevant degrees or no degree at all, but with 10+ years of
    experience. Many of those are very good at a very narrow scope of skills. They
    may know Java programming very well, but don’t really understand CPU architecture,
    algorithm design, data structures, and other topics they would have understood
    with formal training.'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'Ideally, one would have a four-year degree related to computers (Computer Science,
    Computer Information Systems, Engineering, etc.), that required you to study programming,
    networking, and other foundational topics. If you lack that, then you should probably
    start looking at what gaps you may have in your knowledge, and seek to correct
    them.


    Once one has the foundational education, then one can learn the details of cyber
    security. In this regard, the certifications discussed in Chapter 1 are very helpful.
    Let’s revisit some of those certifications (and some new ones) with a look at
    what each of these helps to cover:


    +   - **General knowledge:** To work in any aspect of cyber security, you need
    a general knowledge of a wide range of security topics. The ISC2 CISSP exam and
    the CompTIA Security+, both seek to provide a breadth of security topics. Both
    have been criticized for being overly broad and lacking depth, but this is precisely
    why I think they are useful. Either of these will give you the breadth of knowledge
    needed to have a general understanding of cyber security principles. Neither will
    make you a cyber security expert, but they will help you get a foundation. And
    if I can be forgiven for a small bit of blatant self-promotion, my own book *Computer
    Security Fundamentals* from Pearson Press (now its third edition) is designed
    to do the same thing.

    +   - **Basic penetration testing:** The Certified Ethical Hacker is the oldest
    hacking/pen testing certification. There is quite a bit of criticism of this test,
    some of which has merit. However, most of the criticism comes from a misunderstanding.
    The CEH will not make you a hacking or pen testing expert. It will expose you
    to a broad range of hacking technologies, techniques, and tools. It provides a
    foundation to start penetration testing. The same can be said for the Professional
    Penetration Tester exam discussed in Chapter 1, “Introduction to Penetration Testing.”
    This book itself covers the same topics, but goes a bit deeper into others such
    as Metasploit.

    +   - **More on penetration testing:** The Offensive Security certifications (OCSP
    and OCSE) mentioned in Chapter 1 are very good to help solidify your knowledge
    of Metasploit in particular, and penetration testing in general. Mile2 certifications
    (https://www.mile2.com/) are actually quite solid. They also have levels of certifications,
    each more difficult than the preceding. While these certifications are not as
    widely known in the United States as some of the others, they are quite popular
    internationally and they are more affordable than most other certifications.

    +   - **Others:** The SANS certifications, such as GPEN, have a great reputation.
    And they have a hierarchy, each going deeper. However, they are cost prohibitive
    for many people.


    Aside from certifications, there is the issue of formal education. When I began,
    there were no cyber security degrees. Now there are quite a few, many available
    via distance learning. You might be pursuing a degree in cyber security right
    now, and this book might even be one of your textbooks. Today there are many universities
    offering cyber security degrees, including doctorates. I am of the opinion that,
    like any other profession, you would be well served with a formal degree related
    to cyber security. Certainly, there are many in the profession without such degrees,
    but they may have gaps in their knowledge they are not even aware of—gaps that
    would be filled with the right degree program.


    This brings us to the ideal penetration tester. In my opinion, this is a person
    with 3 to 5 years of general IT experience (programming, networking, database
    administration, etc.) followed by 2 years of security experience. Ideally, this
    person would have some degree at least related to computers, and'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'even better if it is cyber security. I would also recommend having at least
    one general security certification and one pen testing certification.


    I am aware that there are many people who will denounce both certifications and
    formal education. This generally stems from their having met someone with degrees
    and certifications who had far less skill than they should have. Or perhaps they
    know someone with no certifications or formal degrees who is quite skilled. From
    time to time someone will post in a blog, or on LinkedIn, that industry certifications
    such as CISSP, GPEN, CEH, etc. are useless. Of course, at other times someone
    will take issue with one certification, while claiming another is the gold standard.
    Setting to one side the fact that many jobs either require or prefer certain certifications,
    let’s address the issue of whether or not a certification is of any worth, in
    and of itself.


    Let us begin by examining the other alternatives to validating a person’s skill.
    Most often that is done with either formal education or experience. Let us begin
    with formal education. Everyone reading this who attended university for any length
    of time is well aware that classes vary widely. As an example, an introduction
    to C++ programming class under one professor could be quite grueling, while the
    same class under another professor is an “easy A.” How can an employer know, based
    your having a degree, how rigorous your classes were? We have all met people with
    degrees who were shockingly ignorant of the subject for which they have a degree.


    But what of experience? Isn’t that the true standard of evaluating a person’s
    skill? The problem with this as your sole standard is that experience varies in
    quality as does education. You might have 10 years of programming experience,
    but it was as a small part of a very large team, wherein you were only responsible
    for a very small piece, and then only maintenance programming. No new development,
    no innovative thinking, no major challenges. Someone else might have only 2 years
    experience, but it was all in challenging, demanding, new development. So, who
    really has the experience?


    So, what of certifications? First, unlike university courses, the standard does
    not vary. A CISSP test is the same in Los Angeles, Mississippi, Jordan, India,
    etc. If you have a given certification, I know you have at least a certain level
    of knowledge on a specific set of topics. And unlike experience, I know exactly
    what you had to do to get the certification.


    Now, am I saying that certifications are the ultimate? Absolutely not. We have
    all met people with certifications who make us wonder how they got them. And clearly
    some certifications have more merit than others. I am also not denouncing formal
    education or experience. I am also not saying that formal education is the ultimate.
    We all have met someone with a graduate degree who was shockingly poorly skilled.
    What I am stating is that claims that certifications are useless are simply unfounded,
    and frankly absurd. I am saying that to truly judge one’s skill, you need to look
    at all aspects. Yes, formal education counts. Yes, experience counts. And yes,
    certifications matter. That is why I think the ideal penetration tester has a
    bit of all three.


    # Cyber Warfare and Terrorism


    The fact is that cyber is becoming an aspect of most international conflicts.
    Whether it is a nation or an international terrorist group, using cyber attacks
    and cyber espionage as a part of the conflict is now'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'the new norm. According to a 2014 article in Defense News, “Cyberwarfare is
    the most serious threat facing the United States, according to almost half of
    US national security leaders who responded to the inaugural Defense News Leadership
    Poll.”


    There are two compelling reasons to cover this topic, albeit briefly, in a book
    about penetration testing. The first is that penetration testing is a subset of
    the broader topic of cyber security. And all cyber security professionals should
    be at least somewhat aware of the issue of cyber warfare. The second reason is
    that one of the possible places a penetration tester might seek employment is
    with a government agency. In fact, the very techniques that a penetration tester
    uses are many of the same techniques used in cyber warfare.


    As nations become more dependent upon technology, they are also more vulnerable
    to attacks on that technology. Cyber attacks can be part of a broader conflict,
    including outright war, or they can be low-level attacks independent of any actual
    war. Espionage makes even more sense in cyberspace. Contrary to what you have
    seen in movies, the goal of espionage is not to drive an Aston Martin and to drink
    martinis, shaken not stirred. Rather, it is to get information. And the question
    becomes, where is most of the information? It is in a computer system somewhere.
    Therefore, cyber espionage is a logical development.


    In addition to these general statements, there have been actual events that illustrate
    these issues. The following is a brief sampling of actual events:


    +   - In 2008, CENTCOM was infected with spyware. A USB drive was left in the
    parking lot of a DoD facility. The worm was known as Agent.btz, a variant of the
    SillyFDC worm.

    +   - In 2009, the video feed for a military drone in Afghanistan was compromised.
    The perpetrators were not able to take control of the drone, but could view the
    video feed.

    +   - In 2009, a cyber attack penetrated the U.S. electrical grid and left software
    that would allow the attackers to disrupt power. The attacks came from China and
    Russia. The attacks were pervasive across the United States, affecting multiple
    power companies and regions. What is disturbing is most of these attacks were
    not discovered by the companies or their security departments, but rather by U.S.
    intelligence agencies.

    +   - In December of 2009, hackers broke into computer systems and stole secret
    defense plans of the United States and South Korea. Authorities speculated that
    North Korea was responsible. The information stolen included a summary of plans
    for military operations by South Korean and U.S. troops in case of war with North
    Korea, though the attacks traced back to a Chinese IP address.

    +   - On December 4, 2010, a group calling itself the Pakistan Cyber Army hacked
    the website of India’s top investigating agency, the Central Bureau of Investigation
    (CBI).

    +   - In 2012, the Flame virus appeared, targeting Windows operating systems.
    No modern discussion of cyber warfare and espionage would be complete without
    a discussion of Flame. The first item that makes this virus notable is that it
    was specifically designed for espionage. It was first'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'discovered in May 2012 at several locations, including Iranian government sites.
    Flame is spyware that can monitor network traffic and take screenshots of the
    infected system. The second is that it used a compromised digital certificate.


    +   - In 2012, the Shamoon virus was first discovered, and later a variant resur<|start|>ed
    in 2017. Shamoon acts as spyware, but deletes files from the target after it has
    uploaded them to the attacker. The virus attacked Saudi Aramco workstations and
    a group named “Cutting Sword of Justice” claimed responsibility for the attack.
    A number of security officials within Saudi Aramco have blamed Iran for this attack.
    And, like Stuxnet, this virus infected systems other than the intended target.

    +   - In 2017, while I was writing this book, the United States accused Russia
    of hacking into U.S. systems, using the antivirus product Kaspersky. Then in the
    fall of 2017, Israel claimed that it had hacked Russian spy agencies, and found
    evidence that, yes, the Russians were indeed using Kaspersky as a vehicle for
    cyber espionage. This is a classic case of everyone seems to be hacking into everyone
    else.


    Each of the aforementioned incidents clearly demonstrates that cyber warfare and
    cyber terrorism are not just fanciful stories designed to spread FUD (Fear, Uncertainty,
    and Doubt). Rather, the threats of cyber warfare and cyber terrorism are real
    concerns that any security professional should be aware of.


    # Nation State Actors


    While anyone can become involved in cyber conflicts, the majority of incidents
    described in the previous section involve nation state actors. Therefore, an understanding
    of how such actors conduct operations is critical.


    A classic example of nation state actors is found in the Chinese Advanced Persistent
    Threat (APT) attacks discovered by the cyber security firm Mandiant. Beginning
    in 2004, Mandiant tracked several APTs over a period of 7 years, all originating
    in China, specifically Shanghai and the Pudong region. These APTs were simply
    named APT1, APT2, etc. The attacks were linked to PLA Unit 61398 of China’s military.
    The Chinese government regards this unit’s activities as classified, but it appears
    that offensive cyber warfare is one of its tasks. Just one of the APTs from this
    group compromised 141 companies in 20 different industries. APT1 was able to maintain
    access to victim networks for an average of 365 days, and in one case for 1,764
    days. APT1 is responsible for stealing 6.5 terabytes of information from a single
    organization over a 10-month time frame.


    This case study reveals the essentials for nation state actors. First, the attacks
    tend to be sophisticated. These are not script kiddy attacks. Second, the attacks
    tend to persist over time. This is logical if you think about the difference between
    a nation state and a lone hacker (or small group of hackers). The lone attacker
    simply cannot attack 24 hours a day, 7 days a week. He or she must take time off.
    And eventually, that lone attacker will lose interest and move on. The nation
    state has the resources to keep an attack running 24 hours a day, day in and day
    out, for many months.'
