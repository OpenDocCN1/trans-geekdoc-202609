    # FIGURE 10-11 /etc/shadow File.


    Then there are subsequent fields (not on all versions of Linux):


    +   - **Minimum:** The minimum number of days required between password changes.

    +   - **Maximum:** The maximum number of days the password is valid (after that
    the user is forced to change his/her password).

    +   - **Warn:** The number of days before password is to expire that user is warned
    that his/her password must be changed.

    +   - **Inactive:** The number of days after password expires that account is
    disabled.

    +   - **Expire:** Days since Jan. 1, 1970 that account is disabled; i.e. an absolute
    date specifying when the login may no longer be used.


    If there is no data in a field, then the :: will be shown. It is important to
    examine this file when penetration testing. It will tell you a lot about how secure
    passwords are on this system. If a password is stored as a hash, you will want
    to take that hash and run it through various rainbow tables (many can be found
    online) to see if you can derive the password.'
