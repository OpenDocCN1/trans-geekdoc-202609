- pgno: 388
  md: '# Chapter 18


    # Additional Pen Testing Topics


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand how to conduct a wireless penetration test

    +   - Have an understanding of SCADA and penetration testing

    +   - Know the essentials of mobile device penetration testing


    Previous chapters have delved into various aspects of penetration testing including
    Windows pen testing, using Metasploit, and creating malware. In this chapter we
    talk about a few less common areas of penetration testing. These are topics that
    are more specialized. The goal is to provide you an introduction to these areas
    so that you can have at least a baseline knowledge of penetration testing for
    these technologies.


    # Wireless Pen Testing


    Wireless hacking was briefly discussed in a Chapter 12, “General Hacking Techniques”;
    however, in this chapter we will delve into details. In some cases, there may
    be a small amount of repeated information, but that is because that information
    is important.


    The first issue is to define what wireless means. You are probably thinking of
    the wireless router in your home or office. This operates using radio waves usually
    at either 2.4 GHz or 5.0 GHz. However, wireless can also be achieved with infrared,
    Bluetooth, and cellular. All of these constitute wireless communications. We will
    begin by examining the basics of each of these.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# 802.11


    Standards for networking technologies are often set by the Institute of Electrical
    and Electronics Engineers (IEEE). Usually the standards have a numeric designation.
    For wireless radio signals, the IEEE standard is 802.11. The 802.11 standard defines
    14 channels one can communicate on. The channels which can be used are determined
    by the host nation. For example, in the United States, a wireless access point
    can only use channels 1 through 11. Channels tend to overlap so nearby WAPs should
    not use close channels.


    Beyond the channels there has been an evolution in Wi-Fi standards. Each one is
    802.11 followed by some letter designation. A listing of the Wi-Fi standards,
    in chronological order, is given here:


    +   1. **802.11a:** This was the first widely used Wi-Fi; it operated at 5 GHz
    and was relatively slow.

    +   2. **802.11b:** This standard operated at 2.4 GHz and had an indoor range
    of 125 ft. with a bandwidth of 11 Mbps (megabits per second).

    +   3. **802.11g:** There are still many of these wireless networks in operation,
    but you can no longer purchase new Wi-Fi access points that use 802.11g. This
    standard includes backward compatibility with 802.11b. 802.11g has an indoor range
    of 125 ft. and a bandwidth of 54 Mbps.

    +   4. **802.11n:** This standard was a tremendous improvement over preceding
    wireless networks. It obtained a bandwidth of 100 to 140 Mbps. It operates at
    frequencies of 2.4 or 5.0 GHz, and has an indoor range of up to 230 ft.

    +   5. **802.11n-2009:** This technology gets bandwidth of up to 600 Mbps with
    the use of four spatial streams at a channel width of 40 MHz. It uses multiple-input
    multiple-output (MIMO), which uses multiple antennas to coherently resolve more
    information than is possible using a single antenna.

    +   6. **802.11ac:** This standard was approved in January 2014. It has throughput
    of up to 1 Gbps with at least 500 Mbps. Uses up to 8 MIMO.

    +   7. **802.11ad:** Wireless Gigabit Alliance standard. Supports data transmission
    rates up to 7 Gbps—more than ten times faster than the highest 802.11n rate.

    +   8. **802.11af:** Also referred to as “White-Fi” and “Super Wi-Fi,” this standard
    approved in February 2014 allows WLAN operation in the TV white space spectrum
    in the VHF and UHF bands between 54 and 790 MHz.

    +   9. **802.11aj:** IEEE 802.11aj is a rebranding of 802.11ad for use in the
    45 GHz unlicensed spectrum available in some regions of the world (specifically
    China).


    The next thing to be familiar with in Wi-Fi communications is Wi-Fi security.
    There are three protocols used as the primary Wi-Fi security mechanisms. They
    are briefly described here.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# WEP


    Wired Equivalent Privacy (WEP) uses the stream cipher RC4 to secure the data and
    a CRC-32 checksum for error checking. Standard WEP uses a 40-bit key (known as
    WEP-40) with a 24-bit initialization vector (IV), to effectively form 64-bit encryption.
    128-bit WEP uses a 104-bit key with a 24-bit IV.


    Because RC4 is a stream cipher, the same traffic key must never be used twice.
    The purpose of an IV, which is transmitted as plain text, is to prevent any repetition,
    but a 24-bit IV is not long enough to ensure this on a busy network. The way the
    IV is used also opens WEP to a related-key attack. For a 24-bit IV, there is a
    50% probability the same IV will repeat after 5,000 packets.


    # WPA


    Wi-Fi Protected Access (WPA) uses Temporal Key Integrity Protocol (TKIP). TKIP
    is a 128-bit-per-packet key, meaning that it dynamically generates a new key for
    each packet. WPA works in two modes:


    +   - **WPA-Personal:** Also referred to as *WPA-PSK* (Pre-shared key) mode. Is
    designed for home and small office networks and doesn’t require an authentication
    server. Each wireless network device authenticates with the access point using
    the same 256-bit key.

    +   - **WPA-Enterprise:** Also referred to as *WPA-802.1x* mode. Is designed for
    enterprise networks, and requires a RADIUS authentication server. An Extensible
    Authentication Protocol (EAP) is used for authentication. EAP has a variety of
    implementations such as EAP-Transport Layer Security (EAP-TLS) and EAP-Tunneled
    Transport Layer Security (EAP-TTLS).


    # WPA2


    WPA2 is based on the IEEE 802.11i standard. It is the only one of the three protocols
    that fully implements the 802.11i standard. Much of this will make sense to you,
    if you have read Chapter 3, “Cryptography.”


    WPA2 uses the Advanced Encryption Standard (AES) using the Counter Mode-Cipher
    Block Chaining (CBC)-Message Authentication Code (MAC) Protocol (CCMP) that provides
    data confidentiality, data origin authentication, and data integrity for wireless
    frames. Unless there is some compelling reason not to, one should always use WPA2.


    # BSSID


    When considering 802.11 Wi-Fi devices, the most interesting piece of information
    is the basic service set identifier (BSSID). Wireless networks have a basic service
    set that has an ID, the BSSID. That BSSID is preset during manufacture and is
    the MAC address of the wireless access point. If you have a BSSID in a log but
    don’t know where that wireless access point is, there are websites where one can
    take the BSSID and look up the geographic location, for example https://wigle.net/.
    That is just one use of the BSSID.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# Other Security Measures


    Implementing WPA2 is just the first step in securing a Wi-Fi network. There are
    several other steps one should take. One of those is to have a robust administrator
    password that is changed frequently. As a penetration tester, an obvious thing
    for you to test is whether or not your client is using a default password. This
    happens all too often.


    Another security measure is MAC filtering. Most Wi-Fi access points can be configured
    to allow devices to connect to the access point only if the device’s MAC address
    is on a list of approved devices. Figure 18-1 shows MAC filtering for a Linksys
    router.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_391_0.png)


    FIGURE 18-1 MAC Filtering.


    Unfortunately, as with all security measures, this one is not perfect. First,
    this is applicable only in environments with a relatively stable set of client
    devices. If you routinely have new devices connecting, it would be cumbersome
    to have to add each new device’s MAC address. Secondly, it is possible to spoof
    a MAC address and circumvent this security measure.


    It is also necessary to secure the interface for the wireless access point. These
    devices all have web interfaces. A few simple rules can make these more secure.
    First, they should only use https, not http. That way all the administrative commands
    being sent to and from the WAP are encrypted. Secondly, they should only be accessible
    via a wired connection, not wireless.'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'These are all items that should be checked in a penetration test. Try to log
    in to the WAP admin screen. If you can even access it wirelessly, that is a security
    flaw (even if you are not able to log in). Then try default passwords to log in.
    Later in this chapter we will discuss hacking techniques for Wi-Fi, but even without
    that, you can do a basic test of the WAP.


    # Infrared


    Infrared is not as widely used as it once was. The reason is that it depends on
    line-of-sight communication. Any obstacle can block the communication. The only
    uses for infrared today are short distance, limited application uses; for example,
    synchronizing two devices. The range on infrared is also rather short.


    # Bluetooth


    Bluetooth is not dependent on line of sight, as infrared is, but it does have
    a relatively short distance. This means that it may not be useful for general
    purpose wireless networks; however, for connecting devices to each other it is
    quite useful.


    It was developed by the Bluetooth Special Interest Group, which includes over
    1,000 companies including Siemens, Intel, Toshiba, Motorola, and Ericsson.


    The IEEE standardized Bluetooth as IEEE 802.15.1, but no longer maintains the
    standard. The main advantage of Bluetooth is its capability to discover Bluetooth
    devices that are within range.


    The name comes from king Harald Bluetooth, a 10th century Danish king. He united
    the tribes of Denmark; thus the implication is that Bluetooth unites communication
    protocols. There have been different explanations for his name, one being that
    he had a bad tooth that was blue (that is, rotted). Another explanation is that
    he was often clothed in blue. Many texts and courses teach that Bluetooth has
    a maximum range of 10 meters. That is only true for Bluetooth 3.0. Table 18-1
    summarizes the ranges and bandwidth for the various versions of Bluetooth.


    TABLE 18-1 Ranges/Bandwidth for Bluetooth Versions


    | Version | Bandwidth/Range |

    |---|---|

    | 3.0 | 25 Mbps; 10 meters (33 ft) |

    | 4.0 | 25 Mbps; 60 meters (200 ft) |

    | 5.0 | 50 Mbps; 240 meters (800 ft) |


    Bluetooth is designed as a layered protocol architecture. This means there are
    layers of protocols being used as described in the list that follows. The mandatory
    protocols that all Bluetooth devices have are LMP, L2CAP, and SDP.


    +   - **LMP:** Link Management Protocol is used to set up and control the communication
    link between two devices.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '+   - **L2CAP:** Logical Link Control and Adaptation Protocol is used for multiplexing
    multiple connections between two devices.

    +   - **SDP:** Service Discovery Protocol is how two devices find out what services
    each offers.

    +   - **RFCOMM:** Radio Frequency Communications, as the name implies, provides
    a data stream. In this case, it is a virtual serial data stream.

    +   - **BNEP:** Bluetooth Network Encapsulation Protocol is used to transfer some
    other protocol over the L2CAP channel. It is encapsulating the other protocol.

    +   - **AVCTP:** The Audio/Video Distribution Transport Protocol is used to transfer
    audio/visual control commands over the L2CAP channel.

    +   - **HCI:** Host Controller Interface refers to any standardized communication
    between the host stack (that is, the operating system) and the controller (the
    actual Bluetooth circuit).

    +   - **OBEX:** Object Exchange facilitates the transfer of binary objects between
    devices. It was originally designed for infrared, but is now used by Bluetooth.
    This is used in accessing phonebooks, printing, and other functions. It uses RFCOMM
    for communication.


    When you pair your device with another via Bluetooth, they exchange a bit of information
    including device name and list of services.


    Bluetooth security defines four modes. Clearly, which mode your phone is using
    will have a great impact on what attacks will and won’t work.


    +   - **Security Mode 1** is non-secure.

    +   - **Security Mode 2** controls access to certain services and uses a security
    manager. But this is only initiated after a link is established. Mode 2 has three
    levels:

    +     - **Level 1:** Open to all devices, the default level.

    +     - **Level 2:** Authentication only.

    +     - **Level 3:** Requires authentication and authorization. PIN number must
    be entered.

    +   - **Security Mode 3** initiates security procedures before any link is established.
    It supports authentication and encryption. The NIST considers this the most secure.

    +   - **Security Mode 4** requires authenticated links, but like mode 2 only initiates
    the authentication and encryption after a link is established.


    Bluetooth can be a more significant issue for a penetration tester than you may
    think. Most laptops are Bluetooth-enabled. This provides a possible avenue of
    attachment on the laptop. This should be tested. It is also the case that many
    organizations block a variety of computer connections (CD/DVD, USB, etc.) to prevent
    users from either installing files or exfiltrating data. If that is a concern
    in a penetration test, then you should also test to see if these same computers
    that have USB blocked, have Bluetooth working. That would provide another pathway
    to exfiltrate data or install software.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# Other Forms of Wireless


    For a long time, the aforementioned types of wireless connectivity were the only
    widely used wireless connections; however, that has changed.


    ANT+ is a wireless protocol often used with sensor data such as in biosensors
    or exercise applications.


    Near Field Communication (NFC) works if the two devices are within 4 cm (1.6 inches)
    of each other. It operates on the globally available unlicensed radio frequency
    ISM band of 13.56 MHz on ISO/IEC 18000-3 air interface at rates ranging from 106
    to 424 kbit/s. NFC is standardized in ECMA-340 and ISO/IEC 18092.


    These two may not be relevant to your penetration test. But you should at least
    determine if these technologies are used in the client network, then evaluate
    whether or not they should be within the scope of the penetration test.


    # Wi-Fi Hacking


    As you already know, penetration testing involves applying hacking techniques.
    So, in this section let us look at some Wi-Fi hacking tools and techniques.


    # NetStumbler


    The NetStumbler tool can be used to find Wi-Fi networks, and to learn something
    about them. It is a free download from http://www.netstumbler.com/downloads/.
    It has a very easy to use interface as shown in Figure 18-2.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_394_0.png)


    FIGURE 18-2 NetStumbler.


    The tool allows you to scan for nearby Wi-Fi access points and to get details
    about them.'
  merge: -1
  img_proc: true
- pgno: 395
  md: '# Hacking Wi-Fi Using Aircrack


    The first step is to use CommView to scan for wireless access points. You can
    download this tool from http://www.tamos.com/download/main/ca.php. Figure 18-3
    shows CommView.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_395_0.png)


    FIGURE 18-3  CommView.


    Now you select one of the wireless access points you wish to target. In Figure
    18-4, we selected one running WEP. With WEP you have a high probability of success.
    With WPA or WPA2 you have a very low chance of succeeding with this method.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_395_1.png)


    FIGURE 18-4  Select a WAP.'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'Let it capture packets for quite some time. Thousands of packets is a good
    start, and the more the better. You can see the packet capture in Figure 18-5.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_396_0.png)


    # FIGURE 18-5 Packet Capture.


    Now export the logs to .cap files by going to **File > Export**. In later versions
    it is **File > Save Log As**. You will now need to download Aircrack from https://www.aircrack-ng.org/downloads.html.
    Next open Aircrack and select WEP (if your target is using WEP; if not select
    the appropriate protocol for your target). You can see this in Figure 18-6.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_396_1.png)


    # FIGURE 18-6 Starting to Attack WEP.


    Then choose the right file (the one you just exported) and click **Launch**. If
    there are enough packets and enough information, it will crack WEP. For WPA and
    WPA2 you probably won’t succeed. If it is successful, a command window will launch
    and display **KEY FOUND**.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Cain and Abel


    You saw Cain and Abel earlier in this book as a password cracker for Windows.
    At the time I mentioned that Cain and Abel has many other features. One of those
    features is a Wi-Fi scanner that can attempt to crack the Wi-Fi password. You
    can see Cain and Abel scanning wireless access points in Figure 18-7.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_397_0.png)


    FIGURE 18-7 Cain and Abel.


    A great deal of information is shown about the WAP, including BSSID, signal, channel,
    etc. This information can be useful in attempting to breach the WAP.


    # AirJack and Kismet


    AirJack is downloadable as source code you then must compile. For some, this is
    going to be a bit more effort than they may wish to expend. However, AirJack is
    such a popular tool, I would be remiss not to cover it. You can download it from
    here: https://sourceforge.net/projects/airjack/.


    Kismet is another tool that downloads as source code you must compile yourself.
    It can be downloaded from https://www.kismetwireless.net/. Both of these tools
    provide similar functionality to the tools we have already discussed. I am simply
    listing them here as alternative tools you may wish to investigate.


    # KRACK


    During the writing of this book a new vulnerability was discovered for WPA2, called
    KRACK. It involves a flaw in the way WPA performs a handshake and establishes
    a shared key. The flaw allows the attacker to gain access to your Wi-Fi. A complete
    proof of concept for this attack is available at https://www.krackattacks.com/.
    This is important not only due to the immediate danger this presents to Wi-Fi
    networks, but because it illustrates why a penetration tester must be constantly
    learning. There will always be new flaws to exploit, and new countermeasures to
    mitigate those attacks. Outdated knowledge on your part will lead to security
    flaws for your clients.'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# Mainframe and SCADA


    Chapter 5, “Malware,” discussed the Stuxnet virus that specifically attacked supervisory
    control and data acquisition (SCADA) systems. Even more specifically, it attacked
    systems used in the refinement of uranium. In this section we will first discuss
    the basics of SCADA systems, then dive into the issues with penetration testing
    such systems.


    # SCADA Basics


    SCADA systems are used frequently in industrial systems. This can include water
    treatment facilities, manufacturing plants, and similar environments. These installations
    have complex equipment, often running semi-automated using programmable logic
    controllers (PLCs). The purpose of SCADA is to be able to manage all of these
    devices. There are some basic components of SCADA systems you should be familiar
    with:


    +   - Remote terminal units (RTUs) connect to sensors to send and receive data,
    and often have embedded control capabilities.

    +   - Programmable logic controllers (PLCs) are the controllers that actually
    are in the devices being managed.

    +   - A telemetry system is typically used to connect PLCs and RTUs with control
    centers.

    +   - A data acquisition server is a software service which uses industrial protocols
    to connect software services, via telemetry, with field devices such as RTUs and
    PLCs.

    +   - A human–machine interface or HMI is the apparatus or device which presents
    processed data to a human operator.

    +   - A historian is a software service which accumulates time-stamped data, Boolean
    events, and Boolean alarms in a database.

    +   - A supervisory (computer) system.


    The PLCs will be specific to the particular type of equipment in question. The
    supervisory computer along with the historian and HMI will be particular to individual
    SCADA vendors. A few SCADA systems are:


    +   - Eclipse NeoSCADA is a set of tools that can be configured to fit your own
    organization. It is open source, which makes it affordable. But considerable configuration
    is required. You can find out more at https://www.eclipse.org/eclipsesca da/.

    +   - WinCC is produced by Siemens. It is not an open source product. It has a
    very strong reputation in industry. You can find out more at http://w3.siemens.com/mcms/human-machine-interface/en/visualization-software/scada/pages/default.aspx.'
  merge: -1
  img_proc: true
- pgno: 399
  md: '+   - Ignition by Inductive Automation is for industrial systems and is used
    in many different installations. You can learn more about this system at https://inductiveautomation.com/what-is-scada.

    +   - Wonderware creates a number of SCADA solutions for different environments.
    You can find out details about these products at https://www.wonderware.com/hmi-scada/.


    We will look at some general SCADA penetration testing topics in this section.
    The first step in a SCADA penetration test, however, is to review documentation
    for that specific SCADA system.


    # SCADA Penetration Testing


    Fortunately, we don’t have to come up with our own guidelines for SCADA penetration
    testing. Like credit cards with the PCI DSS standard, SCADA has a standard for
    security. That standard is NIST Special Publication 800-82, Revision 2, “Guide
    to Industrial Control Systems (ICS) Security.” This document can be downloaded
    at http://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r2.pdf.


    That document is a wonderful starting place for SCADA in general. It begins with
    an overview of SCADA systems that is well worth your time reading. The document
    then moves directly into risk assessment for industrial systems.


    This document/standard does not define how to do a penetration test; however,
    it does define with great specificity what security measures must be in place.
    And a penetration test should test these items. A few fundamental items from the
    standard that should be present in any industrial system include:


    +   - Firewalls, with specific firewall rules for specific services

    +   - Security of remote access services (telnet, TFTP, etc.)

    +   - Defense in depth architecture

    +   - Network segmentation

    +   - Specific controls that must be in place


    The essential process for penetration testing of any SCADA system is as follows:


    +   - **STEP 1.** Review documentation for that specific SCADA system. Make sure
    you are familiar with general operations for that system. This should include
    a search for any known vulnerabilities in that specific system, as well as a search
    for any current SCADA threats or malware.

    +   - **STEP 2.** Review the 800-82, Revision 2 standard. List the security measures
    that need to be in place.

    +   - **STEP 3.** Target testing each of those protocols/devices/controls that
    need to be in place and test each of them.'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'Now this three-step process may appear simple, but that is somewhat deceptive.
    You can likely already see that step 1 is going to entail some time-consuming
    research. Step 2 is rather straightforward, and should be almost identical for
    all your SCADA penetration tests. Step 3 could include any of the penetration
    testing topics we have covered in the preceding 17 chapters. Given that Chapters
    13–16 focused on Metasploit, you will be pleased to know there are Metasploit
    modules for SCADA. Here are some resources:


    +   - https://scadahacker.com/resources/msf-scada.html

    +   - https://www.rapid7.com/about/press-releases/new-metasploit-module-to-exploit/

    +   - http://www.securityweek.com/rapid7s-metasploit-get-scada-exploits


    These sources can assist you in leveraging your newfound Metasploit skills to
    penetration test SCADA systems.


    In addition to the material already covered in this section, there are a few other
    standards that might be of interest in specific environments:


    +   - North American Electric Reliability Corporation (NERC) has standards for
    electrical systems. These can be accessed at http://www.nerc.com/pa/Stand/Pages/Project-2014-XX-Critical-Infrastructure-Protection-Version-5-Revisions.aspx.

    +     - NERC CIP (Critical Infrastructure Protection) 007-6 in particular addresses
    the patching of all systems.

    +     - The newest version of NERC 1300 is called CIP-002-3 through CIP-009-3.

    +   - “Firewall Deployment for SCADA and Process Control Networks,” https://www.ncsc.gov.uk/content/files/protected_files/guidance_files/2005022-gpg_scada_firewall.pdf.

    +   - NIST 800-115 is a general testing standard, at https://csrc.nist.gov/publications/detail/sp/800-115/final.


    The issue is this: you will use the same testing skills you have developed throughout
    this book. However, you will need to familiarize yourself with SCADA in general,
    and your particular system in particular, in order to perform a successful penetration
    test of a SCADA system.


    # Mainframes


    Contrary to what you may have heard, mainframes are not dead. They do still exist.
    While it is true that there are far fewer security issues with mainframes, it
    would be incorrect to assume there are no security issues. And any system with
    vulnerabilities needs testing. Mainframe penetration testing includes both the
    operating system and the application. A few operating systems are:'
  merge: -1
  img_proc: true
- pgno: 401
  md: '+   - AS/400

    +   - OS/390

    +   - Z/OS


    There are likely to be critical applications running on those systems, such as
    databases. Mainframe penetration testing is going to be quite similar to SCADA
    penetration testing. The first step will be to familiarize yourself with the target
    system and specific vulnerabilities to that system. Then you will use skills you
    have acquired throughout this book to attempt to exploit those vulnerabilities.


    # Mobile Pen Testing


    Mobile device penetration testing involves both cellular technology and Bluetooth.
    Earlier in this chapter we discussed Bluetooth technology. Before we delve into
    penetration testing for mobile devices let us first look at cellular technology.
    The first step is to get familiar with cellular terminology.


    # Cellular Terminology


    A mobile switching center (MSC) is the switching system for the cellular network.
    MSCs are used in 1G, 2G, 3G, and Global System for Mobile (GSM) communications
    networks. You will learn about 3G and GSM networks later in this section. The
    MSC processes all the connections between mobile devices and between mobile devices
    and landline phones. The MSC is also responsible for routing calls between base
    stations and the public switched telephone network (PSTN).


    The base transceiver station (BTS) is the part of the cellular network responsible
    for communications between the mobile phone and the network switching system.
    The base station system (BSS) is a set of radio transceiver equipment that communicates
    with cellular devices. It consists of a BTS and a base station controller (BSC).
    The BSC is a central controller coordinating the other pieces of the BSS.


    The home location register (HLR) is a database used by the MSC that contains subscriber
    data and service information. It is related to the visitor location register (VLR),
    which is used for roaming phones.


    The subscriber identity module (SIM) is a memory chip that stores the International
    Mobile Subscriber Identity (IMSI). It is intended to be unique for each phone
    and is what you use to identify the phone. Many modern phones have removable SIMs,
    which means you could change out the SIM and essentially have a different phone
    with a different number. A SIM card contains its unique serial number—the ICCID—the
    IMSI, security authentication, and ciphering information. The SIM will also usually
    have network information, services the user has access to, and two passwords.
    Those passwords are the personal identification number (PIN) and the personal
    unlocking code (PUK).'
  merge: -1
  img_proc: true
- pgno: 402
  md: 'The following is a list of cellular network types/technologies:


    +   - **Global System for Mobile (GSM) communications:** GSM communications is
    a standard developed by the European Telecommunications Standards Institute (ETSI).
    Basically, GSM is the 2G network.

    +   - **Enhanced Data Rates for GSM Evolution (EDGE):** EDGE does not fit neatly
    into the 2G-3G-4G continuum. It is technically considered 2G+, but was an improvement
    on GSM (2G), so it can be considered a bridge between 2G and 3G technologies.

    +   - **Universal Mobile Telecommunications System (UMTS):** UMTS is a 3G standard
    based on GSM. It is essentially an improvement of GSM.

    +   - **Long Term Evolution (LTE):** LTE is a standard for wireless communication
    of high-speed data for mobile devices. This is what is commonly called 4G.


    Currently, 5G is still not being utilized, so it is not something we will discuss
    in this chapter. However, in the next few years it should begin being rolled out,
    and at that point, you will need to familiarize yourself with it.


    # Bluetooth Attacks


    Bluetooth attacks are quite common on cellular phones, and perhaps the most important
    for you to test. Let’s begin with a brief summary of the most common Bluetooth
    attacks:


    +   - Blue snarfing is a class of attacks wherein the attacker attempts to get
    data from the phone.

    +   - Bluejacking is sending unsolicited data to a phone, via Bluetooth. This
    is sometimes used to send spam instant messages.

    +   - Blue smacking is a denial of service attack wherein the target is flooded
    with packets.

    +   - Blue bugging remotely accesses phone features. This may seem very similar
    to Blue snarfing, but the goal with Blue bugging is not to get data, but to activate
    certain phone features.

    +   - Blue sniffing is the same thing as war driving. The attacker is trying to
    find available Bluetooth devices to attack.

    +   - Blue printing gets its name from foot printing. In the case of Blue printing,
    the attacker is trying to get information about the target phone.


    # Bluetooth/Phone Tools


    There are a number of tools that an attacker can use to facilitate a Bluetooth
    attack. You should be familiar with at least some of these. They can be a useful
    part of your penetration test. Some tools are only for Android, others for iPhone.'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# BH BlueJack


