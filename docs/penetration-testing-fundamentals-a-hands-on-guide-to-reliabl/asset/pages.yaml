- pgno: 102
  md: 'You can see a history of when this website was archived, and pull up previous
    versions of the website. In many cases this will provide useful information about
    the target network. This site is useful, but is probably one of the less useful
    sources of information for a penetration tester. It can give you a history of
    information for that website, but it cannot provide you with current vulnerabilities.


    # Shodan


    This may be the single most important tool we discuss in this chapter. The website
    https://www.shodan.io/ is essentially a search engine for vulnerabilities. You
    need to sign up for a free account to use it, but then it can be invaluable to
    a pen tester trying to identify vulnerabilities. You can also be sure that attackers
    use this site as well. You can see the website in Figure 4-5.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_102_0.png)


    Explore the Internet of Things

    Use Shodan to discover which of your devices are connected to the Internet, where
    they are located and who is using them.


    See the Big Picture

    Websites are just one part of the Internet. There are power plants, Smart TVs,
    refrigerators and much more that can be found with Shodan!


    FIGURE 4-5 Shodan.io.


    There are many options you can use in searching with Shodan.io, some of which
    are given here with example results from my website:


    +   - Search for default passwords

    +     - default password country:US

    +     - default password hostname:chuckeasttom.com

    +     - default password city:Chicago

    +   - Find Apache servers

    +     - apache city:"San Francisco"'
