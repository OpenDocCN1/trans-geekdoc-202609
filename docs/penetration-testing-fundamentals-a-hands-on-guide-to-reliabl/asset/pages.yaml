- pgno: 276
  md: '# Linux Hacking Tricks


    By this point in this book you should be aware that no hacking trick works all
    the time. It will work on some systems, and not on others. There is no magic bullet.
    But in penetration testing, you try these tricks to see if they will work on the
    system you are testing. If they do, then you recommend steps to remediate. In
    this section, we will look at some basic hacking tricks you can try on a Linux
    system.


    However, it is worthwhile for a penetration tester to be aware of and attempt
    Linux hacking tricks, even very old ones. It is not uncommon for Linux to be used
    on a device, or a single-purpose server, and to not be updated regularly. Finding
    an older version of Linux that has not been updated in quite some time is not
    at all uncommon. And as a penetration tester, it is your job to find these vulnerabilities
    before an attacker does.


    # Boot Hack


    When the system is booting up, you can interrupt the boot process. In some Linux
    distributions, pressing any key during boot will do this; in others it will be
    a specific key (you will need to search the web for the interrupt for your Linux
    distribution). This should give you the GRUB menu (used to select what system
    to boot to). You can see the GRUB menu in Figure 10-12.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_276_0.png)


    FIGURE 10-12 GRUB Menu.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Now press the **e** key to edit the line starting with the kernel (if such
    a line appears; if not, then you won’t be able to do this hack on this system).
    Now add a blank space followed by a **1** to the end of that line. This causes
    you to log in as single-user mode, which is similar to safe mode for Windows.
    You can now use the **passwd** command to change the root password. In fact, any
    method that gets you to single-user mode (even trying to use **init 1**) gives
    you the option of trying to use the **passwd** command. If it works, this is wonderful.
    But in many systems it will not work.


    # Backspace Hack


    I would be remiss not to discuss this trick. In 2015, it was all the rage in hacking
    circles. Some researchers discovered a bug that allowed an attacker to bypass
    Linux authentication during bootup by pressing the backspace key 28 times. The
    end result is to open a “rescue shell,” which is a shell that allows you to perform
    a lot of tasks that you might not otherwise be able to perform.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Summary


    In this chapter, you have seen more of the Linux operating system, particularly
    those aspects related to security. You have also seen how to write Linux scripts,
    which is a common task for penetration testers. Finally, you have been introduced
    to a few common Linux hacking techniques.


    # Test Your Skills


    # MULTIPLE CHOICE QUESTIONS


    +   1. When examining /etc/shadow/, the password ID of $6$ means what?

    +      A. The password is stored as a SHA-256 hash.

    +      B. The password is encrypted with Blowfish.

    +      C. The password is stored as a SHA-512 hash.

    +      D. The password is stored as an MD5 hash.

    +   2. What is syslog error level 7?

    +      A. Severe

    +      B. Debugging

    +      C. Serious

    +      D. Informational

    +   3. Which of the following best describes the purpose of the touch command?

    +      A. Get information on a user

    +      B. Get information on a file

