- pgno: 104
  md: 'When you are performing a penetration test, it is a good idea to search the
    company domain for anything you can find via Shodan. This can guide your penetration
    testing efforts, and again you can be sure that would-be attackers will use this
    tool. You can restrict your search to the hostname or domain name of the client
    who has hired you to conduct a penetration test. You can seek out default passwords,
    old web servers, unsecure web cameras, and other vulnerabilities in the target
    network.


    # Social Media


    The value of social media, to a penetration test, cannot be overstated. If you
    are performing a pen test of XYZ company, then one of your early tasks should
    be to scan social media such as LinkedIn and Facebook for that company name. You
    will, of course, find some irrelevant information that does not assist you in
    your penetration test, but if you take the time to sift through this data, it
    is very likely you will find some very useful bits of information.


    It is relatively easy to find a company on social media, so the question becomes:
    what are you looking for? There are several things you can search for in social
    media. The first is general information about the company. You might find a network
    administrator complaining about the move to a new version of Windows, which tells
    you what version of Windows they are using, and that it is a new change, with
    issues still to resolve. You might find out the names of key individuals, which
    is useful in social engineering. In essence, you are creating a sort of dossier
    on the target company. It may surprise you just how much information companies
    allow to leak out.


    # Google Searching


    This may seem like an odd way to learn about a target system. I am certain that
    anyone reading this book has conducted Google searches. But you may not be aware
    of the flexibility you have with Google searching. Here are just a few searches
    that might be interesting to you:


    +   - **Info about a site:** info:http://www.google.com

    +   - **Find related sites:** related:http://www.google.com

    +   - **Search the cache:** cache:http://google.com search

    +   - **Word in URL:** inurl:http://google search

    +   - **Restrict search to a site:** site:http://somesite.net

    +   - **Similar items:** search ~tips

    +   - **The OR operator:** cats | dogs'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'For example, if you are searching for information about XYZ company, and you
    would like insight into their company policies, you might try


    ```

    policies site:xyz.com

    ```


    Or if you are specifically looking for PDF documents from that company, you could
    try one of the following two searches. First, this will return any PDF files that
    are related to policies, on xyz.com:


    ```

    policies filetype:pdf site:xyz.com

    ```


    Or if you just want all PDF files, you could try


    ```

    filetype:pdf site:xyz.com

    ```


    As you can see, more advanced Google searching features can be a powerful tool
    in gathering information about a target network. Often companies have policy documents,
    human resources manuals, and similar documents that are not easy to find by simply
    navigating their website, but which can be located with specialized Google searches.


    # Active Scanning Techniques


    The previously mentioned techniques are all considered passive, as they do not
    require the attacker to connect to the target system. Because the attacker is
    not actually connecting to the target system, it is impossible for an intrusion
    detection system (IDS) to detect the scan. Active scans are far more reliable
    but may be detected by the target system. There are a few types of active scans,
    as described in the sections that follow.


    # Port Scanning


    Port scanning is the process of attempting to contact each network port on the
    target system and see which ones are open. There are 1,024 well-known ports that
    are usually associated with specific services. For example, port 161 is associated
    with Simple Network Management Protocol. If an attacker detects port 161 open
    on the target system, he might decide to try SNMP-related attacks. Even more information
    can be derived from a port scan. For example, ports 137, 138, and 139 are all
    associated with NetBIOS, a very old Windows method of network communication, not
    used in Windows anymore. However, NetBIOS is often used for systems where Windows
    machines need to communicate with Linux machines. So, discovering those ports
    open reveals something about the target network.


    A simple Google search for “port scanner” will reveal a host of well-known, widely
    used, and often free port scanners. However, the most popular port scanner in
    the hacking and security community is the free tool nmap (https://nmap.org/).
    There is a Windows version of it with a GUI that can be downloaded from https://nmap.org/download.html.
    You can see a basic nmap scan of my own website in Figure 4-7.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_106_0.png)


    FIGURE 4-7 nmap Scan.


    Nmap allows you to customize your scan to make it more or less stealthy, and to
    target certain systems. The most common types of scans are listed here:


    +   - **Ping scan:** This scan simply sends a ping to the target port. Many network
    administrators block incoming ICMP packets for the purpose of stopping ping scans.

    +   - **Connect scan:** This is the most reliable scan, but also the most likely
    to be detected. With this type of scan a complete connection is made with the
    target system.

    +   - **SYN scan:** This scan is very stealthy. Most systems accept SYN (Synchronize)
    requests. In this scan you send a SYN packet but never respond when the system
    sends a SYN/ACK. However, you only send one packet per port. This is also called
    the half-open scan.

    +   - **FIN scan:** This scan has the FIN flag, or connection finished flag, set.
    This is also not an unusual packet for systems to receive, so it is considered
    stealthy.

    +   - **XMAS scan:** This scan has several flags turned on, like a Christmas tree
    with many lights on.

    +   - **NULL scan:** This scan is the opposite of the XMAS scan: no flags are
    turned on.

    +   - **ACK scan:** This scan sends an ACK, without first having received a SYN.
    This is done to see how the target responds.


    Each of these scans provokes a different response on the target machine and thus
    provides different information to the port scanner:


    +   - With a FIN scan or an XMAS scan, if the target port is closed, the system
    sends back an RST flag packet (RST means reset). If it is open, there is no response.

    +   - With a SYN scan, if the port is closed, the response is an RST; if it is
    open, the response is a SYN/ACK.

    +   - ACK scans and NULL scans only work on UNIX systems.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Nmap also lets you set a number of flags (either with the command-line version
    of nmap or the Windows version) that customize your scan. The allowed flags are
    listed here:


    +   - `-O` Detects operating system

    +   - `-sP` Ping scan

    +   - `-sT` TCP connect scan

    +   - `-sS` SYN scan

    +   - `-sF` FIN scan

    +   - `-sX` Xmas tree scan

    +   - `-sN` NULL scan

    +   - `-sU` UDP scan

    +   - `-sO` Protocol scan

    +   - `-sA` ACK scan

    +   - `-sW` Windows scan

    +   - `-sR` RPC scan

    +   - `-sL` List/DNS scan

    +   - `-sI` Idle scan

    +   - `-Po` Don’t ping

    +   - `-PT` TCP ping

    +   - `-PS` SYN ping

    +   - `-PI` ICMP ping

    +   - `-PB` TCP and ICMP ping

    +   - `-PM` ICMP netmask

    +   - `-oN` Normal output

    +   - `-oX` XML output

    +   - `-oG` Greppable output

    +   - `-oA` All output

    +   - `-T` Timing

    +     - `-T0` Paranoid

    +     - `-T1` Sneaking

    +     - `-T2` Polite

    +     - `-T3` Normal

    +     - `-T4` Aggressive

    +     - `-T5` Insane'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'In Figure 4-7 you can see that the nmap GUI will place these flags into the
    text box for you based on the search you pick. Figure 4-8 shows the search options.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_108_0.png)


    FIGURE 4-8 nmap GUI Search Options.


    There is also the option to set timing from. Timing involves how quickly to send
    scanning packets. Essentially, the faster you send packets, the more likely the
    scan is to be detected. The intense scan in the nmap GUI is timed as T4.


    Here are some very basic nmap scans, starting with scanning a single IP address:


    ```

    nmap 192.168.1.1

    ```


    Scan a range of IP addresses:


    ```

    nmap 192.168.1.1-20

    ```


    Scan to detect operating system, use TCP scan, and use sneaky speed:


    ```

    nmap -O -PT -T1 192.168.1.1

    ```


    Nmap and the GUI version Zenmap are the most commonly used port scanners. The
    idea of a port scan is twofold. First, knowing what ports are open will give you
    insight into what services are running. Secondly, specific ports (like NetBIOS
    and SMB) can give you insight into what operating system is running on the target
    system.


    This brings us to the very important question of what ports are most interesting.
    You can certainly find a comprehensive list of ports on the Internet by simply
    searching for “network ports,” but some ports are more interesting than others
    for a penetration tester. Table 4-1 summarizes some of the ports and what they
    mean to you.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# TABLE 4-1 Well-known Ports


    | Port | Meaning |

    |---|---|

    | 20, 21; FTP | FTP is a common protocol, and often found on web servers. The
    interesting thing for a penetration tester is that many FTP servers allow limited
    anonymous access. So if you see ports 20 and 21 are open, you might at least attempt
    anonymous FTP. |

    | 23; Telnet | Telnet is a command-line connection that is not secure (unlike
    SSH on port 22 that is encrypted). You might first wish to try to log on to telnet.
    However, even if that is unsuccessful, you may wish to run a packet sniffer (which
    we discuss later in this chapter) to watch traffic to that port. Administrators
    may be using port 23/telnet and thus sending commands in clear text. |

    | 69; TFTP | TFTP is basically limited FTP using UDP rather than TCP. This is
    often used with Cisco devices to retrieve digital certificates. So, seeing this
    open could provide a hint that Cisco devices with digital certificates might be
    in use. There are other uses of TFTP, but this is one of the most common. |

    | 137, 138, 139; NetBIOS | NetBIOS is primarily used by Microsoft. If you see
    this and 445 (see below) then it is clear this is a Microsoft system. |

    | 25, 110, 143, 220; email | These are all clear-text, unencrypted email protocols.
    Seeing these gives you two pieces of information. The first is that the target
    network is failing to use basic security precautions, and probably has a great
    many other security issues. The second is that you can run a packet sniffer and
    read all the emails going to and from this system. |

    | 465, 993, 995; encrypted email | This is just the opposite, encrypted email.
    Seeing one of these tells you that the target network at least takes some basic
    security precautions, and that you cannot read the emails. |

    | 161, 162; SNMP | Simple Network Management Protocol is very commonly used to
    manage a network. Versions 1 and 2 of SNMP were unencrypted, and you can read
    the traffic with a packet sniffer. Version 3 is encrypted. But with any version,
    you should try default passwords. |

    | 445; SMB | Server Message Block is used by Windows operating systems running
    Active Directory. So, seeing this port tells you it is a Windows domain. |

    | 88, 464; Kerberos | These are used by Kerberos. If you see these, you know that
    the target network uses Kerberos authentication. |

    | 3389; Remote Desktop | Remote Desktop is notoriously insecure, and if you see
    this port open, then you have to at least attempt to remote desktop into the system.
    |


    Clearly, port scanning is a relatively easy task, but one that can provide a lot
    of information. Nmap is probably the most widely used port scanner, both for penetration
    testers and hackers. It is also a frequent topic on many penetration testing–related
    certification tests. For all of these reasons, being skilled with nmap is important
    to a penetration tester. However, it is just as important to understand what the
    results mean. What we have seen in this section is that a strong working knowledge
    of computer networks is critical to being a good penetration tester.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Enumeration


    Another technique that is popular before the actual attack is enumeration. Enumeration
    is simply the process of finding out what is on the target system. If the target
    is an entire network, then the attacker is trying to find out what servers, computers,
    and printers are on that network. If the target is a specific computer, then the
    attacker is trying to find out what users and shared folders exist on that system.


    Chapter 3, “Cryptography,” introduced the Cain and Abel tool. This tool can also
    perform basic network enumeration. You can see Cain and Abel used as a network
    enumeration tool in Figure 4-9. Simply click on any item on the left for which
    you wish to see more details.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_110_0.png)


    FIGURE 4-9 Cain and Abel.


    Cain and Abel is clearly a versatile tool. We saw it in Chapter 3 for password
    cracking, and now we see it again for network enumeration. Cain and Abel is quite
    popular with both penetration testers and attackers.


    Angry IP Scanner is another port scanning/enumeration tool. It is a free download
    from the website http://angryip.org/download/#windows. You simply provide the
    tool a range of IP addresses, and it will scan them, letting you know which IP
    addresses are active as demonstrated in Figure 4-10.


    SuperScan is another free network scanner. You can download this tool from https://www.mcafee.com/us/downloads/free-tools/superscan.aspx.
    This tool is more versatile than Angry IP Scanner. You can see the main screen
    for SuperScan in Figure 4-11.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_111_0.png)


    FIGURE 4-10 Angry IP Scanner.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_111_1.png)


    FIGURE 4-11 SuperScan.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'As you can see, you can select a domain name or hostname, or a range of IP
    addresses, and SuperScan will scan the selected target. Also note the Windows
    Enumeration tab. You can select a hostname or IP address and enumerate what services
    that machine has. You can see the enumeration in Figure 4-12.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_112_0.png)


    FIGURE 4-12 SuperScan Enumeration.


    SuperScan can tell you a great deal about the target system. Most notably you
    can see the services running on that system and the users on that system. With
    users, SuperScan will tell you how many times that user has logged in, when the
    password expires, when it last changed, and the last time the user logged in.
    This is all very useful information. Even more importantly, SuperScan can tell
    you the account password policies such as lockout duration, lockout threshold,
    and maximum password age.


    SuperScan will also give you information on any shares that target computer has,
    as well as all services running on that system. It might be useful, for example,
    to know if the target system has the remote desktop service running.


    All of these tools have one thing in common: they provide you information about
    the target machine or network. As you saw in Chapters 1 and 2, penetration testing
    begins with gathering information. You'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'can use the tools just described, or you can simply do a web search for “network
    enumeration” (and “port scanner”) and find the tool that you prefer to use. Some
    penetration testers prefer a graphical user interface, others a command-line interface.
    You may also find that a particular tool has features you find useful. So, take
    that time to investigate port scanners and enumeration tools and find the one
    that best suits your needs. I personally like to use multiple tools for both port
    scanning and enumeration.


    # Wireshark


    This tool is not really a port scanner or a network enumeration tool. It is one
    of the most widely known network packet sniffers. Often a penetration tester can
    learn a great deal from simply sniffing the network traffic on a target network.
    Wireshark provides a convenient GUI for examining network traffic. It is a free
    download you can get at https://www.wireshark.org/. Figure 14-13 shows the main
    interface.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_113_0.png)


    FIGURE 4-13 Wireshark Main Interface.


    We see a single packet highlighted in Figure 4-14. This allows the user to drill
    down in specific packet details.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_114_0.png)


    # FIGURE 4-14 Wireshark Select a Packet.


    Display filters (also called post-filters) only filter the view of what you are
    seeing. All packets in the capture still exist in the trace. Display filters use
    their own format and are much more powerful than capture filters, as shown in
    Figure 4-15.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_114_1.png)


    # FIGURE 4-15 Wireshark Display Filters.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'The following are some display filter examples:


    ```

    ip.src==10.2.21.00/24

    ip.addr==192.168.1.20 && ip.addr==192.168.1.30

    tcp.port==80 || tcp.port==443

    !(ip.addr==192.168.1.20 && ip.addr==192.168.1.30)

    (ip.addr==192.168.1.20 && ip.addr==192.168.1.30) && (tcp.port==465|| tcp.port==139)

    (ip.addr==192.168.1.20 && ip.addr==192.168.1.30) && (udp.port==80|| udp.port==443)

    ```


    If you right-click on a packet, you can select to follow that particular TCP or
    UDP stream, which makes it easier to view the packets in that specific conversation
    as demonstrated in Figure 4-16 and Figure 4-17.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_115_0.png)


    FIGURE 4-16 Wireshark Follow TCP Stream.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_116_0.png)


    FIGURE 4-17 Wireshark Display TCP Stream.


    Wireshark is a very versatile packet sniffer. It is beyond the scope of this book
    to make you an expert in Wireshark; however, the material in this chapter should
    provide you with a solid introduction. You saw earlier in this chapter specific
    instances where running a packet sniffer can be quite useful. While there are
    certainly other packet sniffers, Wireshark is one of the most widely known. The
    Wireshark website provides some information for learning more:


    +   - The Wireshark Wiki page: https://wiki.wireshark.org/

    +   - Wireshark videos and tutorials: https://www.wireshark.org/#learnWS


    These should provide you a good working knowledge of Wireshark.


    # Maltego


    Maltego is an open source intelligence and forensics application offering extraordinary
    data mining and intelligence gathering capabilities. There are several versions,
    which you can download from https://www.paterva.com/web7/downloads.php#tab-3.
    The community version is free.


    Results are well represented in a variety of easy-to-understand views. In concert
    with its graphing libraries, Maltego identifies key relationships between data
    sets and identifies previously unknown relationships between them. Figure 4-18
    shows the main screen of Maltego.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_117_0.png)


    FIGURE 4-18 Maltego.


    Maltego is primarily used by working with entities and transforms. You select
    some entity (email address, website, person, phone number, etc.) and select a
    transform for that entity. Once you have selected something to graph, be it a
    person, email address, website, or other item, the relationships between that
    entity and other entities are shown as a graph, as illustrated in Figure 4-19.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_117_1.png)


    FIGURE 4-19 Maltego Graph.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Figure 4-20 shows the screen when you are starting a new graph. Simply select
    Share Graph, then create a new graph based on the entities and transforms you
    select.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_118_0.png)


    FIGURE 4-20 Start a New Maltego Graph.


    Maltego is more complex than some of the other tools we have discussed in this
    chapter; however, there are tutorials available on the Web to help you master
    this tool:


    +   - https://www.paterva.com/web7/docs/documentation.php

    +   - https://null-byte.wonderhowto.com/how-to/hack-like-pro-use-maltego-do-network-reconnaissance-0158464/


    # Other OSINT Tools


    Open source intelligence (OSINT) is used by attackers and cyber threat analysts.
    Maltego, discussed in the previous section, is a widely used OSINT tool. There
    are several other tools and resources that are used in OSINT that are also very
    valuable for a penetration tester performing reconnaissance.


    # OSINT Website


    The website http://osintframework.com provides a simple online tool whereby you
    can drill down on a specific search. Searches can be conducted on email addresses,
    domains, Bitcoin transactions, and many other items. For a penetration tester,
    searching a target domain will be useful, as illustrated in Figure 4-21.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_119_0.png)


    FIGURE 4-21 OSINT Framework.


    In Figure 4-21 the final section was a site that finds vulnerabilities that have
    been disclosed for various websites. This tool can be a valuable asset in performing
    reconnaissance on a target network.


    # Alexa


    The website http://www.alexa.com provides information about websites, including
    popularity, number of visitors, and how often it is searched for. This can give
    you an idea of how exposed a website is. More widely visited websites are more
    likely to be attacked.


    # Web Master Tips


    The website http://www.wmtips.com is similar to Alexa but aggregates data from
    multiple sources. This can give you a much better view as to how exposed the target
    website is, and thus help estimate the likelihood of a web attack. It will also
    give you information on the website such as IP, WhoIS, and the DNS server for
    that domain.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Summary


    In this chapter, you have learned how to perform reconnaissance on a target network.
    The first step is passive reconnaissance, which consists of using a variety of
    web-based tools as well as searching social media. Then you learned how to perform
    active reconnaissance, using port scanners, enumeration tools, and packet sniffers.
    Finally, you learned some basic cyber threat intelligence, using widely accepted
    tools. It is important that you practice each of the techniques and tools presented
    in this chapter before you proceed to the next chapter. Mastering reconnaissance
    is an important step in learning penetration testing.


    # Test Your Skills


    # MULTIPLE CHOICE QUESTIONS


    +   1. You execute a FIN scan and get back no response. What does this indicate?

    +      A. The port was closed.

    +      B. The port was open.

    +      C. The host is unreachable.

    +      D. The port is unreachable.

    +   2. You scan a target network and find port 445 is open and active. What does
    this tell you?

    +      A. The system is using Linux.

    +      B. The system is using Novell.

    +      C. The system is using Windows.

    +      D. The system has an IDS.

    +   3. Using nmap, a T0 flag means what?

    +      A. TCP scan

    +      B. No TCP scan

    +      C. Slowest speed

    +      D. Fastest speed'
