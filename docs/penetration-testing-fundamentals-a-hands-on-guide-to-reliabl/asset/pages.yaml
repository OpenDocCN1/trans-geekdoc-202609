    # userdel Command


    The userdel command is very simple. It deletes the referenced user account from
    the system. The only option for this command is the -r option, which causes the
    user’s home directory to be removed along with the home directory itself and the
    user’s mail spool.


    Figure 9-14 demonstrates this command.'
