- pgno: 72
  md: "# Rail Fence\n\nAll the preceding ciphers we examined are substitution ciphers.\
    \ Another approach to classic cryptography is the transposition cipher. The rail\
    \ fence cipher may be the most widely known transposition cipher. You simply take\
    \ the message you wish to encrypt and alter each letter on a different row. So\
    \ “attack at dawn” is written as\n\nA  t  c  a  d  w\n    t  a  k  t  a  n\n\n\
    Next, you write down the text reading from left to right as one normally would,\
    \ thus producing\n\natcadwtaktan\n\nIn order to decrypt the message, the recipient\
    \ must write it out on rows:\n\nA  t  c  a  d  w\n    t  a  k  t  a  n\n\nThen\
    \ the recipient reconstructs the original message. Most texts use two rows as\
    \ examples; however, this can be done with any number of rows you wish to use.\n\
    \n# Modern Methods\n\nThe preceding section was meant to make you comfortable\
    \ with the essential concepts of cryptography; however, as a penetration tester\
    \ you need to be familiar with modern methods of cryptography. The historical\
    \ methods discussed in the last section are no longer used.\n\nIt is best if you\
    \ start with a realistic understanding of cryptography. Unlike what is depicted\
    \ in many movies, you are unlikely to “crack” modern cryptographic algorithms.\
    \ Certainly, not in a timeframe that is of any use to you. However, the implementation\
    \ of cryptography, the passwords used to access an encrypted drive, and the key\
    \ exchange protocols all at least present the possibility of being subverted or\
    \ circumvented.\n\nBefore we delve too deeply into this topic, let’s start with\
    \ some basic definitions you will need:\n\n+   - **Key:** The bits that are combined\
    \ with the plaintext to encrypt it. In symmetric ciphers this is random numbers;\
    \ in asymmetric ciphers it is the result of some mathematical operation.\n+  \
    \ - **Plaintext:** The unencrypted text.\n+   - **Ciphertext:** The encrypted\
    \ text.\n+   - **Algorithm:** A mathematical process for combining the key with\
    \ the plaintext, to produce the ciphertext."
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Symmetric Encryption


    Symmetric encryption means that the same key is used to both encrypt and decrypt
    a message. This is also referred to as *single key encryption*. There are two
    types of symmetric algorithms: stream and block. A block cipher divides the data
    into blocks (often 64-bit blocks, but newer algorithms sometimes use 128-bit blocks)
    and encrypts the data one block at a time. Stream ciphers encrypt the data as
    a stream of bits, one bit at a time.


    # Data Encryption Standard


    This is an older algorithm, and no longer considered secure. However, the structure
    used in DES is still used today, and it is often the first symmetric algorithm
    any cryptography student will study. *Data Encryption Standard*, or *DES* as it
    is often called, was developed by IBM in the early 1970s. It was finally published
    in 1976. DES is a block cipher. A *block cipher* is one that divides the plaintext
    into blocks and encrypts each block. In the case of DES, 64-bit blocks are used.
    The basic concept, however, is as follows:


    +   1. Data is divided into 64-bit blocks, and those blocks are then transposed.

    +   2. Transposed data is then manipulated by 16 rounds of encryption involving
    substitutions, bit-shifting, and logical operations using a 56-bit key.

    +   3. Data is then further scrambled using a swapping algorithm.

    +   4. Data is transposed one last time.


    The algorithm is actually quite sound, but its small key size, 56 bits, is not
    good enough to defend against brute force attacks with modern computers. For those
    new to security and cryptography, the brief facts listed earlier are enough. However,
    for those who want to delve a bit deeper, let’s examine the details of the DES
    algorithm. DES uses a 56-bit cipher key applied to a 64-bit block. There is actually
    a 64-bit key, but one bit of every byte is used for error correction, leaving
    just 56 bits for actual key operations.


    DES is a Feistel cipher with 16 rounds and a 48-bit round key for each round.
    Feistel ciphers (also Feistel functions) are named after Horst Feistel, the inventor
    of the concept, and the primary inventor of DES. All Feistel ciphers work in the
    same way: They divide the block into two halves, apply a round function to one
    of those halves, and then swap the halves. This is done each round. The primary
    difference between different Feistel ciphers is what exactly occurs within the
    round function.


    # 3DES


    Triple DES was created as a replacement for DES. At the time, the cryptography
    community was searching for a viable alternative. While that was still being worked
    on, a stop-gap measure was created. It essentially applies DES three times with
    three different keys, thus the name 3DES.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'There were variations of 3DES that used only two keys. The text was first encrypted
    with key A. The ciphertext from that operation was then encrypted with key B.
    Then the ciphertext from that operation was encrypted, this time reusing key A.
    The reason for this is that creating good cryptographic keys is computationally
    intensive. This is one approach. There were other variations.


    # AES


    Advanced Encryption Standard (AES) was the algorithm eventually chosen to replace
    DES. It is a block cipher that works on 128-bit blocks. It can have one of three
    key sizes of 128, 192, or 256 bits. This was selected by the U.S. government to
    be the replacement for DES and is now the most widely used symmetric key algorithm.


    AES is also known as Rijndael block cipher. It was officially designated as a
    replacement for DES in 2001 after a 5-year process involving 15 competing algorithms.
    AES is designated as FIPS 197. Other algorithms that did not win that competition
    include such well-known algorithms as Twofish. The importance of AES cannot be
    overstated. It is widely used around the world and is perhaps the most widely
    used symmetric cipher. Of all the algorithms in this chapter, AES is the one you
    should give the most attention to.


    AES can have three different key sizes: 128, 192, and 256 bits. The three different
    implementations of AES are referred to as AES 128, AES 192, and AES 256. The block
    size can also be 128, 192, or 256 bit. It should be noted that the original Rijndael
    cipher allowed for variable block and key sizes in 32-bit increments. However,
    the U.S. government uses these three key sizes with a 128-bit block as the standard
    for AES.


    This algorithm was developed by two Belgian cryptographers, Joan Daemen and Vincent
    Rijmen. Joan Daemen is a Belgian cryptographer who has worked extensively on the
    cryptanalysis of block ciphers, stream ciphers, and cryptographic hash functions.
    For those new to security, this brief description given so far is sufficient;
    however, we will explore the AES algorithm in more detail. Just as with the details
    of DES, this may be a bit confusing to some readers at first glance and may require
    a few rereads.


    Rijndael uses a substitution-permutation matrix rather than a Feistel network.
    The Rijndael cipher works by first putting the 128-bit block of plaintext into
    a 4-byte by 4-byte matrix. This matrix is termed the state and will change as
    the algorithm proceeds through its steps. So the first step is to convert the
    plaintext block into binary and then put it into a matrix.


    Once you have the original plaintext in binary, placed in the 4-byte by 4-byte
    matrix, the algorithm consists of a few relatively simple steps that are used
    during various rounds. The steps are described here:


    +   - **AddRoundKey:** In this step, each byte of the state is exclusively ORd
    with the round key. Just like DES, there is a key schedule algorithm that slightly
    changes the key each round.

    +   - **SubBytes:** This involves substitution of the input bytes (which are the
    output from the AddRoundKey phase). This is where the contents of the matrix are
    put through the s-boxes. Each of the s-boxes is 8 bits.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - **ShiftRows:** This is a transposition step where each row of the state
    is shifted cyclically a certain number of steps. In this step the first row is
    left unchanged. Every byte in the second row is shifted one byte to the left (with
    the far left wrapping around). Every byte of the third row is shifted two to the
    left, and every byte of the fourth row is shifted three to the left (again with
    wrapping around).

    +   - **MixColumns:** This is a mixing operation that operates on the columns
    of the state, combining the four bytes in each column. In the MixColumns step,
    each column of the state is multiplied with a fixed polynomial. Each column in
    the state (remember the matrix we are working with) is treated as a polynomial
    within the Galois Field (2⁸). The result is multiplied with a fixed polynomial
    c(x) = 3x³ + x² + x + 2 modulo x⁴ + 1.


    The MixColumns step can also be viewed as a multiplication by the shown particular
    MDS matrix in the finite field GF(2⁸).


    With the aforementioned steps in mind, this is how those steps are executed in
    the Rijndael cipher. For 128-bit keys, there are 10 rounds. For 192-bit keys,
    there are 12 rounds. For 256-bit keys, there are 14 rounds.


    These last few steps may be leaving you a bit confused. Not to worry, for our
    purposes the details of the math of things, such as Galois fields, are not important.
    To get a better understanding of AES, you may find this animation useful: https://www.youtube.com/watch?v=evjFwDRTmV0.


    # Blowfish


    Blowfish is a symmetric block cipher that uses a variable-length key ranging from
    32 to 448 bits. Blowfish was designed in 1993 by Bruce Schneier. It has been analyzed
    extensively by the cryptography community and has gained wide acceptance. It is
    also a noncommercial (free of charge) product, thus making it attractive to budget-conscious
    organizations. Because of its free status, you are likely to see Blowfish used
    in a number of open source products.


    # RC4


    All the other symmetric algorithms we have discussed have been block ciphers.
    RC4 is a stream cipher developed by Ron Rivest. The RC is an acronym for Ron’s
    Cipher or sometimes Rivest’s Cipher. There are other RC versions, such as RC5
    and RC6, which are block ciphers.


    # Modification of Symmetric Methods


    Each of the algorithms described in the preceding paragraphs can be used exactly
    as written, or they can be modified to alter their functionality in some way.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Electronic Codebook


    The most basic encryption mode is the electronic codebook (ECB) mode. The message
    is divided into blocks, and each block is encrypted separately. The problem is
    that if you submit the same plaintext more than once, you always get the same
    ciphertext. This gives attackers a place to begin analyzing the cipher to attempt
    to derive the key. Put another way, ECB is simply using the cipher exactly as
    it is described without attempts to improve its security.


    # Cipher-Block Chaining


    When using cipher-block chaining (CBC) mode, each block of plaintext is XORed
    with the previous ciphertext block before being encrypted. This means there is
    significantly more randomness in the final ciphertext, making it much more secure
    than electronic codebook mode. It is the most common mode.


    There really is no good reason to use ECB over CBC if both ends of communication
    can support CBC. CBC is a strong deterrent to known plaintext attacks, a cryptanalysis
    method we will examine later in this chapter.


    The only issue with CBC is the first block. There is no preceding block of ciphertext
    to XOR the first plaintext block with. It is common to add an initialization vector
    (IV) to the first block so that it has something to be XORed with. The initialization
    vector is basically a pseudo-random number, much like the cipher key. Usually
    an IV is only used once and is thus called a nonce (number only used once). The
    CBC mode is actually fairly old. It was introduced by IBM in 1976.


    # Practical Applications


    Symmetric ciphers have several advantages over asymmetric (which we will discuss
    in the next section). First, symmetric ciphers are faster than asymmetric. Encrypting
    or decrypting something with a symmetric cipher takes less time than encrypting
    or decrypting with an asymmetric cipher. Symmetric ciphers are also just as secure,
    but with smaller keys. As you saw earlier in this section, AES is considered good
    enough for top-secret documents, with a 256-bit key. To get comparable security
    with RSA (the most widely used asymmetric key today) you would want to use a 4096-bit
    key. For these reasons, symmetric ciphers are almost always used to encrypt hard
    drives or files. Asymmetric ciphers are often used to encrypt emails.


    # Public Key (Asymmetric) Encryption


    *Public key encryption* is meant to overcome the issues of symmetric encryption.
    Recall that symmetric ciphers are always faster than asymmetric and just as secure
    but with smaller key sizes. With any public key encryption algorithm, one key
    is used to encrypt a message (called the public key), and another is used to decrypt
    the message (called the private key). You can freely distribute your public key
    so that anyone can encrypt a message to send to you, but only you have the private
    key and only you can decrypt the message. The actual mathematics behind the creation
    and application of the keys will vary between different asymmetric algorithms.
    We will look at the math for RSA later in this'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'section. It should be pointed out, however, that many public key algorithms
    are dependent, to some extent, on large prime numbers, factoring, and number theory.


    It has become standard in cryptography to use the fictitious Alice and Bob to
    illustrate asymmetric cryptography. If Alice wants to send Bob a message, she
    will use Bob''s public key to encrypt that message. It does not matter if every
    other person on the planet also has Bob''s public key. That key cannot decrypt
    the message. Only Bob''s private key can do that. This is shown in Figure 3-2.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_77_0.png)


    FIGURE 3-2 Asymmetric Cryptography.


    Public key encryption is important because there are no issues to deal with concerning
    distribution of the keys. With symmetric key encryption, you must get a copy of
    the key to every person to whom you wish to send your encrypted messages. If that
    key were lost or copied, someone else might be able to decrypt all of your messages.
    With public key encryption, you can freely distribute your public key to the entire
    world, yet only you can decrypt messages encrypted with that public key.


    # RSA


    You cannot discuss cryptography without at least some discussion of RSA, which
    is a very widely used encryption algorithm. This public key method was developed
    in 1977 by three mathematicians: Ron Rivest, Adi Shamir, and Len Adelman. The
    name RSA is derived from the first letter of each mathematician''s last name.
    Let us take a look at the math involved in RSA. It should be pointed out that
    knowing the math behind this, or any other algorithm, is not critical for most
    pen testing professionals. But some readers will have an interest in going deeper
    into cryptography, and this will be a good place to start.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Before we can delve into RSA, there are a few basic math concepts you need
    to know. Some (or even all) of this material may be a review.


    +   - **Prime numbers:** A prime number is only evenly divisible by itself and
    1. So 2, 3, 5, 7, 11, 13, 17, and 23 are all prime numbers. (Note that 1 itself
    is considered a special case and is not prime.)

    +   - **Co-prime:** This actually does not mean prime; it means two numbers have
    no common factors. So, for example, the factors of 8 (excluding the special case
    of 1) are 2 and 4. The only factor of 9 is 3. The numbers 8 and 9 have no common
    factors. They are co-prime.

    +   - **Euler’s totient:** Pronounced “oilers” totient, or just the totient, this
    is the number of integers smaller than n that are co-prime with n. So let us consider
    the number 10. Since 2 is a factor of 10, it is not co-prime with 10. But 3 is
    co-prime with 10. The number 4 is not co-prime since both 4 and 10 have 2 as a
    factor. The number 5 is not since it is a factor of 10. Neither is 6 since both
    6 and 10 have 2 as a cofactor. The number 7 is prime, so it is co-prime with 10.
    The number 8 is not because both 8 and 10 have 2 as a factor. The number 9 is
    co-prime with 10. So the numbers 3, 7, and 9 are co-prime with 10. We add in 1
    as a special case, and the Euler’s totient of 10 is 4. Now it just so happens
    that Leonard Euler also proved that if the number n is a prime number, then its
    totient is always n − 1. So the totient of 7 is 6. The totient of 13 is 12.

    +   - **Multiplying and co-prime:** Now we can easily compute the totient of any
    number. And we know automatically that the totient of any prime number n is just
    n − 1. But what if we multiply two primes? For example, we can multiply 5 and
    7, getting 35. Well, we can go through all the numbers up to 35 and tally up the
    number that are co-prime with 35. But the larger the numbers get, the more tedious
    this process becomes. For example, if you have a 20-digit number, manually calculating
    the totient is almost impossible. Fortunately, Leonard Euler also proved that
    if you have a number that is the product of two primes (let’s call them p and
    q), such as 5 and 7, then the totient of the product of those two numbers (in
    this case 35) is equal to p − 1 * q − 1 (in this case 4 * 6, or 24).

    +   - **Modulus:** This is the last concept you need for RSA. There are a few
    approaches to explaining this concept. We will actually use two of them. First,
    from a programmer’s perspective, the modulus operation is to divide two numbers
    but only give the remainder. Programmers often use the symbol % to denote modulo
    operations. So, 10 % 3 is 1. The remainder of 10 divided by 3 is 1. Now, this
    is not really a mathematical explanation of modulo operations.


    Basically, modulo operations take addition and subtraction and limit them by some
    value. You have actually done this all your life without realizing it. Consider
    a clock. When you say 2 p.m., what you really mean is 14 mod 12 (or 14 divided
    by 12; just give me the remainder). Or if it is 2 p.m. now (14 actually) and you
    tell me you will call me in 36 hours, what I do is 14 + 36 mod 12, or 50 mod 12,
    which is 2 a.m. (a bit early for a phone call, but it illustrates our point).


    Now if you understand these basic operations, then you are ready to learn RSA.
    If needed, reread the preceding section (perhaps even more than once) before proceeding.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'To create the key, you start by generating two large random primes, p and q,
    of approximately equal size. You need to pick two numbers so that when multiplied
    together the product will be the size you want (2048 bits, 4096 bits, and so on).


    Now multiply p and q to get n.


    Let n = pq


    The next step is to multiply the Euler''s totient for each of these primes. Basically,
    the Euler''s totient is the total number of co-prime numbers. Two numbers are
    considered co-prime if they have no common factors. For example, if the original
    number is 7, then 5 and 7 would be co-prime. Remember that it just so happens
    that for prime numbers, this is always the number minus 1. For example, 7 has
    6 numbers that are co-prime to it. (If you think about this a bit you will see
    that 1, 2, 3, 4, 5, and 6 are all co-prime with 7.)


    Let m = (p - 1)(q - 1)


    Now we are going to select another number. We will call this number e. We want
    to pick e so that it is co-prime to m.


    Choose a small number e, co-prime to m.


    We are almost done generating a key. Now we just find a number d that when multiplied
    by e and modulo m would yield a 1. (Remember: Modulo means to divide two numbers
    and return the remainder. For example, 8 modulo 3 would be 2.)


    Find d, such that de mod m = 1


    Now you will publish e and n as the public key. Keep d as the secret key. To encrypt,
    you simply take your message raised to the e power and modulo n.


    = m^e % n


    To decrypt, you take the ciphertext and raise it to the d power modulo n.


    P = C^d % n


    The letter e is for encrypt and d is for decrypt. If all this seems a bit complex
    to you, first you must realize that many people work in network security without
    being familiar with the actual algorithm for RSA (or any other cryptography, for
    that matter). However, if you wish to go deeper into cryptography, then this is
    a very good start. It involves some fundamental number theory, particularly regarding
    prime numbers. There are other asymmetric algorithms that work in a different
    manner. For example, elliptic curve cryptography is one such example.


    Let''s look at an example that might help you understand. Of course, RSA would
    be done with very large integers. To make the math easy to follow, we will use
    small integers in this example. (Note that this example is from Wikipedia.)


    Choose two distinct prime numbers, such as p = 61 and q = 53.


    Compute n = pq giving n = 61 * 53 = 3233.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Compute the totient of the product as φ(n) = (p − 1)(q − 1) giving φ(3233)
    = (61 − 1)(53 − 1) = 3120.


    Choose any number 1 < e < 3120 that is co-prime to 3120. Choosing a prime number
    for e leaves us only to check that e is not a divisor of 3120. Let e = 17.


    Compute d, the modular multiplicative inverse of yielding d = 2753.


    The public key is (n = 3233, e = 17). For a padded plaintext message m, the encryption
    function is m^17 (mod 3233).


    The private key is (n = 3233, d = 2753). For an encrypted ciphertext c, the decryption
    function is c^2753 (mod 3233).


    Again, it may not be necessary for all readers to fully understand the RSA mathematics.
    But it can be useful to have a deep understanding of algorithms in order to better
    assess the possible issues with that algorithm.


    # Diffie-Hellman


    Diffie-Hellman was the first publicly described asymmetric algorithm. This is
    a cryptographic protocol that allows two parties to establish a shared key over
    an insecure channel. In other words, Diffie-Hellman is often used to allow parties
    to exchange a symmetric key through some unsecure medium, such as the Internet.
    It was developed by Whitfield Diffie and Martin Hellman in 1976.


    # Elliptic Curve


    This algorithm was first described in 1985 by Victor Miller and Neal Koblitz.
    Elliptic curve cryptography is based on the fact that finding the discrete logarithm
    of a random elliptic curve element with respect to a publicly known base point
    is difficult to the point of being impractical to do. The mathematics behind this
    algorithm are a bit much for an introductory book on security; however, if you
    are interested, there is a great tutorial at http://arstechnica.com/security/2013/10/a-relatively-easy-to-understand-primer-on-elliptic-curve-cryptography/.


    There are a number of variations such as ECC Diffie Hellman (ECC-DH) and ECC Digital
    Signature Algorithm (ECC-DSA). The real strength of ECC crypto systems is that
    you can get just as much security with a smaller key than with other systems,
    like RSA. For example, a 384-bit ECC key is as strong as 2048-bit RSA.


    # Digital Signatures


    A digital signature is not used to ensure the confidentiality of a message but
    rather to guarantee who sent the message. This is referred to as nonrepudiation.
    Essentially, it proves who the sender is. Digital signatures are actually rather
    simple, but clever. They simply reverse the asymmetric encryption process. Recall
    that in asymmetric encryption, the public key (which anyone can have access to)
    is used to encrypt a message to the recipient, and the private key (which is kept
    secure, and private) can'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'decrypt it. With a digital signature, the sender encrypts something (usually
    a hash) with his private key. If the recipient is able to decrypt that with the
    sender’s public key, then it must have been sent by the person purported to have
    sent the message.


    # Hashing


    A hash is a type of cryptographic algorithm that has some specific characteristics.
    First and foremost, it is one-way. That means you cannot unhash something. Second,
    you get a fixed-length output no matter what input is given. Third, there are
    no collisions. A collision occurs when two different inputs to the same hashing
    algorithm produce the same output (called a hash or digest). Ideally, we would
    like to have no collisions. But the reality is that with a fixed-length output,
    a collision is possible. So the goal is to make it so unlikely as to be something
    we need not think about.


    Hashes are exactly how Windows stores passwords. For example, if your password
    is password, then Windows will first hash it producing something like this:


    ```

    0BD181063899C9239016320B50D3E896693A96DF

    ```


    Windows will then store that in the Security Accounts Manager (SAM) file in the
    Windows System directory. When you log on, Windows cannot unhash your password
    (remember it is one-way). So, what Windows does is take whatever password you
    type in, hash it, and then compare the result with what is in the SAM file. If
    they match (exactly), then you can log in.


    Storing Windows passwords is just one application of hashing. There are others.
    For example, in computer forensics it is common to hash a drive before you begin
    forensic examination. Then later you can always hash it again to see if anything
    was changed (accidentally or intentionally). If the second hash matches the first,
    then nothing has been changed.


    There are various hashing algorithms. The two most common are MD5 and SHA. (It
    was SHA-1, but since then later versions like SHA-256 are becoming more common.)


    # MD5


    MD5 is a 128-bit hash that is specified by RFC 1321. It was designed by Ron Rivest
    in 1991 to replace an earlier hash function, MD4. MD5 produces a 128-bit hash
    or digest. It has been found not to be as collision resistant as SHA.


    # SHA


    The Secure Hash Algorithm (SHA) is perhaps the most widely used hash algorithm
    today. There are now several versions of SHA. SHA (all versions) is considered
    secure and collision free.


    +   - **SHA-1:** This is a 160-bit hash function that resembles the earlier MD5
    algorithm. This was designed by the National Security Agency (NSA) to be part
    of the Digital Signature Algorithm.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - **SHA-2:** This is actually two similar hash functions, with different
    block sizes, known as SHA-256 and SHA-512. They differ in the word size; SHA-256
    uses 32-byte (256 bits) words, whereas SHA-512 uses 64-byte (512 bits) words.
    There are also truncated versions of each standard, known as SHA-224 and SHA-384.
    These were also designed by the NSA.

    +   - **SHA-3:** This is the latest version of SHA. It was adopted in October
    2012.


    # RIPEMD


    RACE Integrity Primitives Evaluation Message Digest is a 160-bit hash algorithm
    developed by Hans Dobbertin, Antoon Bosselaers, and Bart Preneel. There exist
    128-, 256-, and 320-bit versions of this algorithm, called RIPEMD-128, RIPEMD-256,
    and RIPEMD-320, respectively. All these replace the original RIPEMD, which was
    found to have collision issues.


    # Windows Hashing


    Windows originally used LM (LAN Manager) hashing. This was not a true hash and
    was limited to 14-character passwords. Later versions of Windows moved to NTLM
    (New Technology LAN Manager), and eventually NTLMv2. NTLMv2 uses an HMAC of an
    MD5 hash. We will discuss HMACs in the next section. LM was also not case sensitive,
    so an S was the same as an s.


    # MAC and HMAC


    Hashes are used for several security-related functions. One is to store passwords,
    which we have discussed already (and we will see more later in this chapter).


    A hash of a message can be sent to see if accidental alteration occurred in transit.
    If a message is altered in transit, the recipient can compare the hash she received
    against the hash the computer sent and detect the error in transmission. But what
    about intentional alteration of messages? What happens if someone alters the message
    intentionally, deletes the original hash, and re-computes a new one? Unfortunately,
    a simple hashing algorithm cannot account for this scenario.


    A Message Authentication Code (or MAC) is one way to detect intentional alterations
    in a message. A MAC is also often called a keyed cryptographic hash function.
    That name should tell you how this works. One way to do this is the HMAC, or Hashing
    Message Authentication Code. Let us assume you are using MD5 to verify message
    integrity. To detect an intercepting party intentionally altering a message, both
    the sender and the recipient must previously exchange a key of the appropriate
    size (in this case, 128 bits). The sender will hash the message and then XOR that
    hash with this key. The recipient will hash what she receives and XOR that computed
    hash with the key. Then the two hashes are exchanged. Should an intercepting party
    simply re-compute the hash, he will not have the key to XOR that with (and may
    not even be aware that it should be XORd); thus, the hash the interceptor creates
    won’t match the hash the recipient computes and the interference will be detected.


    There are other variations of the concept. Some use a symmetric cipher in cipher-block
    chaining (CBC) mode and then use only the final block as the MAC. These are called
    CBC-MAC.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Rainbow Tables


    Because Windows and many other systems store passwords as hashes, many people
    have had an interest in how to break hashes. As I''ve mentioned, since a hash
    is not reversible, there is no way to unhash something. In 1980, Martin Hellman
    described a cryptanalytic technique that reduces the time of cryptanalysis by
    using pre-calculated data stored in memory. This technique was improved by Rivest
    before 1982. Basically, these types of password crackers are working with pre-calculated
    hashes of all passwords available within a certain character space. This is called
    a rainbow table. If you search a rainbow table for a given hash, whatever plaintext
    you find must be the text that was input into the hashing algorithm to produce
    that specific hash.


    Clearly, such a rainbow table would get very large very fast. Assume that the
    passwords must be limited to keyboard characters. That leaves 52 letters (26 uppercase
    and 26 lowercase), 10 digits, and roughly 10 symbols, or about 72 characters.
    As you can imagine, even a 6-character password has a very large number of possible
    combinations. This means there is a limit to how large a rainbow table can be,
    and this is why longer passwords are more secure than shorter passwords.


    Since the development of rainbow tables, there have been methods designed to thwart
    such attacks. The most common is salt. Random bits are added to further secure
    encryption or hashing. Salt is often encountered with hashing to prevent rainbow
    table attacks.


    Essentially, the salt is intermixed with the message that is to be hashed. Consider
    this example. You have a password that is


    ```

    pass001

    ```


    In binary that is


    ```

    01110000 01100001 01110011 01110011 00110000 00110000 00110001

    ```


    A salt algorithm would insert bits periodically. Let''s assume for our example
    that we insert bits every fourth bit, giving us


    ```

    0111100001 0110100011 0111100111 0111100111 0011100001 0011100001 0011100011

    ```


    If you convert that to text, you would get


    ```

    xZ7♦♦#

    ```


    All this is transparent to the end user. The end user doesn''t even know that
    salting is happening or what it is. However, an attacker using a rainbow table
    to get passwords would get the wrong password.


    There are a number of tools available for a penetration tester to attempt to crack
    a password hash. A few of the most commonly used are discussed here.


    # pwdump


    The first step for many password cracking tools is to get a copy of the local
    password hashes from the Windows SAM file. The program pwdump can do this for
    you; there are several versions available at http://www.openwall.com/passwords/windows-pwdump.
    Figure 3-3 is an image of the output of pwdump7, with the actual hashes redacted
    because this was run on a live machine.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_84_0.png)


    FIGURE 3-3 pwdump7.


    Often, you will want to dump the hashes to an external file so that you can import
    them into a rainbow table tool. That is done quite easily and is shown in Figure
    3-4.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_84_1.png)


    FIGURE 3-4 pwdump7 Dump to External File.


    # RainbowCrack


    This tool is a free download from http://project-rainbowcrack.com/. It allows
    you to load hashes, like the ones exported from pwdump7, and search a rainbow
    table for a match. You can see the loading in Figure 3-5.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_84_2.png)


    FIGURE 3-5 RainbowCrack Loading a pwdump File.


    If the rainbow table has a match, then you will see the password in plaintext.'
