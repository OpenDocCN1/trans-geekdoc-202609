    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_241_0.png)


    FIGURE 9-12 Assigning File Permissions with chmod Command.


    # bg Command


    The bg command sends a job to the background. Then it is running without interaction
    with the user.


    # fg Command


    The fg command sends a job to the foreground, so you can interact with it. The
    process will use your current terminal. If you omit the job you wish to use the
    fg command with, it will simply bring to the foreground the last job that was
    backgrounded.


    # useradd Command


    The useradd command is pretty straightforward: it adds a specific user to the
    system. There are a number of options for this command:


    +   - -c: Comment. This adds a comment to the user file. Often administrators
    use this to put in a full name for the user or an account name.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   - **-d:** home_dir. With this option the new user will be created using
    home_dir as the value for the user''s login directory.

    +   - **-e:** expire_date. This option sets the user account to expire on the
    specific date provided. This is particularly useful with contract employees and
    others who may need temporary access to your systems. The date is specified in
    the format YYYY-MM-DD.

    +   - **-f:** inactive_days. This option sets the number of days after a password
    expires until the account is permanently disabled. In other words, if the user
    lets their password expire, after a certain number of days the account itself
    is disabled. A value of **0** disables the account as soon as the password has
    expired.

    +   - **-g:** initial_group. This option assigns a group name or number as the
    user''s initial login group. This must be an already existing group; you cannot
    create the group as you add the user.

    +   - **-G:** Group. A list of groups which the user is also a member of. Each
    group is separated from the next by a comma, with no intervening whitespace.

    +   - **-m:** This option causes the user''s home directory to be created if it
    does not exist.

    +   - **-M:** This option causes the user''s home directory to not be created,
    even if the systemwide setting from /etc/login.defs is to create home dirs.

    +   - **-o:** This option allows you to create a user with duplicate (non-unique)
    UIDs. This is one option I personally do not use.

    +   - **-p:** Passwd. This option will create an encrypted password, as returned
    by **crypt(3)**.

    +   - **-r:** This flag is used to create a system account—that is, a user with
    a UID lower than the value of UID_MIN defined in /etc/login.defs and whose password
    does not expire.

    +   - **-s:** Shell. This option lets you set the name of this user''s login shell.
    The default is to leave this field blank, in which case the user gets the default
    shell for that system.

    +   - **-u:** user ID. This option sets the numerical value of the user''s ID.
    And, unless you use the **-o** option, this value must be unique.


    In Figure 9-13, I am using the **useradd** command to add a user named jsmith.'
  merge: -1
  img_proc: true
