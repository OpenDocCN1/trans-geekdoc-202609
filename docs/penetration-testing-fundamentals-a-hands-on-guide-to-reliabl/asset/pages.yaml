  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_101_0.png)


    FIGURE 4-3 BuiltWith.com.


    This site will provide you a basic overview of the technologies used to build
    the target website. Knowing what a website is built with will indicate how you
    should go about attempting to breach the website. For example, you might use different
    techniques on an ASP.NET website than on a PHP website.


    # Archive.org


    Often times, you will want to know the history of a given website. Sometimes website
    owners put information on the website that they should not. They then later take
    it down, but you can pull up older versions of the website. For this demonstration,
    I will again use my own website, which you can see in Figure 4-4.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_101_1.png)


