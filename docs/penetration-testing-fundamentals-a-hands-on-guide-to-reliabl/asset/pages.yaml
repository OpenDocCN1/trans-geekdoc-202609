- pgno: 18
  md: '# About the Author


    **Chuck Easttom** has been in the IT industry for well over 25 years and cybersecurity
    for over 15. He has over 40 industry certifications, and has authored 24 other
    books. He is also an inventor with 13 patents. Chuck is a frequent speaker at
    various security conferences including Defcon, ISC2 Security Congress, Secure
    World, and many others. He also has authored a number of papers on security-related
    topics including malware development, penetration testing, and hacking techniques.
    He also has hands-on experience consulting on cyber security issues and conducting
    penetration tests.


    # About the Technical Reviewers


    **Steve Kalman** is both an attorney and a professional security expert. He holds
    the following credentials from (ISC)², for whom he worked as an authorized instructor:
    CISSP, CCFP-US, CSSLP, ISSMP, ISSAP, HCISPP, SSCP. Steve has been author or technical
    editor for more than 20 Pearson/Cisco Press books.


    **Everett Stiles** holds a Master of Science degree in Computer Engineering from
    the University of Tennessee and is currently a senior engineer in security research
    at Cisco Systems, Inc.'
  merge: -1
  img_proc: true
