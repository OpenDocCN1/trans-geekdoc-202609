- pgno: 200
  md: '# Chapter 8


    # Vulnerability Scanning


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand what vulnerability scanning is

    +   - Know how to use several vulnerability scanning tools

    +   - Conduct web vulnerability scanning

    +   - Conduct network vulnerability scanning


    The first and most important thing to understand is that vulnerability scanning
    is not penetration testing. It is amazing how many people think the two are one
    in the same; however, it would be a mistake to assume they are not related. Most
    companies will perform both vulnerability scanning and penetration testing. And
    as a penetration tester, using vulnerability scanning can help you focus your
    penetration testing efforts.


    So, what exactly is vulnerability scanning? It is using tools to scan for known
    issues. In other words, there are a variety of tools available which will scan
    your system, network, or website, and check them for documented vulnerabilities.
    For a penetration tester, this is just the first step. Once you have identified
    vulnerabilities, you then can attempt to exploit them. This chapter is going to
    discuss several widely used tools.


    # Vulnerabilities


    Vulnerability scanners scan systems for known vulnerabilities. That may seem absurdly
    obvious. But the question becomes, how do the vendors of such tools know about
    vulnerabilities? There are some repositories where vulnerabilities are documented.
    These are referenced by various tools to know what to look for. You should be
    familiar with these.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# CVE


    Common Vulnerabilities and Exposures (CVE) is a list maintained by the Mitre corporation
    at https://cve.mitre.org/. It is perhaps the most comprehensive vulnerability
    list. The CVE was designed to provide a common name and description for a vulnerability.
    This allows security professionals to communicate effectively about vulnerabilities.
    CVEs had originally been designated by a CVE ID in the format of CVE-YYYY-NNNN.
    This format only allows 9,999 unique identifiers per year. The new format is CVE
    prefix + Year + Arbitrary Digits and allows for any number of digits.


    An example CVE is CVE-2017-8541, the description of which is quoted here:


    > The Microsoft Malware Protection Engine running on Microsoft Forefront and Microsoft
    Defender on Microsoft Windows Server 2008 SP2 and R2 SP1, Windows 7 SP1, Windows
    8.1, Windows Server 2012 Gold and R2, Windows RT 8.1, Windows 10 Gold, 1511, 1607,
    and 1703, and Windows Server 2016, Microsoft Exchange Server 2013 and 2016, does
    not properly scan a specially crafted file leading to memory corruption. aka “Microsoft
    Malware Protection Engine Remote Code Execution Vulnerability”, a different vulnerability
    than CVE-2017-8538 and CVE-2017-8540.


    # NIST


    The United States National Institute of Standards maintains a database of vulnerabilities,
    which you can access at https://nvd.nist.gov/. NIST also uses the CVE format.
    For example, CVE-2016-0217 is described as follows:


    > IBM Cognos Business Intelligence and IBM Cognos Analytics are vulnerable to
    stored cross-site scripting, caused by improper validation of user-supplied input.
    A remote attacker could exploit this vulnerability to inject malicious script
    into a Web page which would be executed in a victim’s Web browser within the security
    context of the hosting Web site, once the page is viewed. An attacker could use
    this vulnerability to steal the victim’s cookie-based authentication credentials.


    # OWASP


    The Open Web Application Security Project is the standard for web application
    security. They publish a number of important documents. For our current purposes,
    the most important is their Top 10 list. Every few years they publish a Top 10
    web application vulnerabilities list. This list contains the actual vulnerabilities
    most frequently found in web applications. From a penetration testing perspective,
    not testing for these would be negligent. What is most disturbing for a security
    professional is how little this lists changes over the years. The list is publicly
    available, and as we will see later in this chapter there are free tools to test
    for these vulnerabilities, but many websites still have them. You can see a comparison
    of the 2010 and 2013 lists in Figure 8-1.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '| OWASP Top 10 – 2010 | OWASP Top 10 – 2013 |

    |---|---|

    | A1 – Injection | A1 – Injection |

    | A3 – Broken Authentication and Session Management | A2 – Broken Authentication
    and Session Management |

    | A2 – Cross-Site Scripting (XSS) | A3 – Cross-Site Scripting (XSS) |

    | A4 – Insecure Direct Object References | A4 – Insecure Direct Object References
    |

    | A6 – Security Misconfiguration | A5 – Security Misconfiguration |

    | A7 – Insecure Cryptographic Storage – Merged with A9 → | A6 – Sensitive Data
    Exposure |

    | A8 – Failure to Restrict URL Access – Broadened into → | A7 – Missing Function
    Level Access Control |

    | A5 – Cross-Site Request Forgery (CSRF) | A8 – Cross-Site Request Forgery (CSRF)
    |

    | <buried in A5: Security Misconfiguration> | A9 – Using Known Vulnerable Components
    |

    | A10 – Unvalidated Redirects and Forwards | A10 – Unvalidated Redirects and Forwards
    |

    | A9 – Insufficient Transport Layer Protection | Merged with 2010-A7 into new
    2013-A6 |


    # FIGURE 8-1 OWASP Top 10 List.


    As of this writing, the 2017 list is not finalized. But a tentative list is given
    here:


    +   - A1 Injection

    +   - A2 Broken Authentication

    +   - A3 Sensitive Data Exposure

    +   - A4 XML External Entities (XXE)

    +   - A5 Broken Access Control

    +   - A6 Security Misconfiguration

    +   - A7 Cross-Site Scripting (XSS)

    +   - A8 Insecure Deserialization

    +   - A9 Using Components with Known Vulnerabilities

    +   - A10 Insufficient Logging and Monitoring


    What should surprise you is that many of the vulnerabilities have stayed in the
    top 10 from year to year. Keep in mind that these lists are lists of actual vulnerabilities
    found in the real world. These are not theoretical. What that means is that year
    after year web developers keep making the exact same mistakes.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Packet Capture


    Capturing network traffic is often a part of vulnerability scanning. Seeing what
    data is being transmitted, and what is in that data, can be quite useful. In this
    section, we will take a look at some common packet sniffers/scanners.


    # tcpdump


    One of the most common packet scanners for Linux is tcpdump. It has also been
    ported to Windows. You will need to download it for Windows; you can get it from
    here: http://www.tcpdump.org/. It works from the shell/command line, and it is
    relatively easy to use. To start it, you have to indicate which interface to capture
    packets on such as:


    ```

    tcpdump -i eth0

    ```


    This command causes tcpdump to capture the network traffic for the network card,
    eth0. You can also alter tcpdump’s behavior with a variety of command flags such
    as the following:


    ```

    tcpdump -c 500 -i eth0

    ```


    This tells tcpdump to capture only the first 500 packets on interface eth0 and
    then stop.


    ```

    tcpdump -D

    ```


    This command will display all of the interfaces on your computer so you can select
    which one to use.


    You can see all three of these options in Figure 8-2.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_203_0.png)


    FIGURE 8-2 TCP Dump.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'There are several ways to use TCPdump. Here are a few examples:


    +   - **tcpdump host 192.168.2.3** will only show you traffic going to or from
    192.168.2.3.

    +   - **tcpdump -i any** gets traffic to and from any interface on your computer.

    +   - **tcpdump -i eth0** will only get traffic for the interface eth0.

    +   - **tcpdump port 3389** will only show traffic for port 3389.

    +   - **# tcpdump smtp** will only show traffic using the SMTP protocol.


    You can find more details at https://danielmiessler.com/study/tcpdump/#complex-grouping.


    # Wireshark


    Wireshark is one of the most widely known network packet sniffers. Often a penetration
    tester can learn a great deal from simply sniffing the network traffic on a target
    network. Wireshark provides a convenient graphical user interface (GUI) for examining
    network traffic. It is a free download, which you can get at https://www.wireshark.org/.
    The tool can be downloaded for Windows or Macintosh. It has a graphical user interface,
    as opposed to being command line based. Figure 8-3 shows the main Wireshark interface.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_204_0.png)'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'If you click the Expression button, shown in the red box in Figure 8-4, then
    the Display Filter Expression window will appear (also shown in Figure 8-4), allowing
    you to create filters.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_205_0.png)


    # FIGURE 8-4 Filters.


    Filters are necessary because Wireshark is going to capture all traffic it sees,
    thus leading to a lot of irrelevant packets. By using filters, you can pare down
    what is shown to just what you are currently interested in. It should also be
    noted that filters are one aspect of Wireshark that has expanded a great deal
    in the last few versions.


    When using Wireshark, you can highlight any packet and then see the details of
    that packet, including the various network headers such as Ethernet, TCP, and
    IP as demonstrated in Figure 8-5. You can also right-click on a specific packet
    and then choose to view the entire conversation associated with that packet.


    When you double-click on any packet, you will see the data and you can expand
    the headers as shown in Figure 8-6.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_206_0.png)


    FIGURE 8-5 Follow TCP Stream.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_206_1.png)


    FIGURE 8-6 Packet Details.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'If you click the Statistics drop-down menu, there are a number of interesting
    options, shown in Figure 8-7.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_207_0.png)


    FIGURE 8-7 Wireshark Statistics.


    As you can see, if there is DNS or DHCP traffic that has been captured, you can
    select that option to gather statistics related to that protocol. Selecting conversations
    will let you see statistics for IPv4, IPv6, TCP, and UDP conversations. HTTP can
    provide you with a great deal of information on HTTP traffic. Obviously there
    are many other choices. This chapter is not meant to be a Wireshark tutorial,
    but rather hopes to provide you a basic working knowledge of Wireshark.


    Wireshark is a very versatile tool. It is worth taking the time to learn completely
    all the features of this tool. Fortunately, there are a number of resources on
    the Wireshark page at https://www.wireshark.org/#learnWS to help you learn.


    The reason you use a tool like Wireshark is to get a very granular view of what
    is being transmitted over the network. You may actually see data, including credentials,
    sent in cleartext. Or you will be able to see TLS being established and used.
    You may also see error codes sent back from a web server. There is a wealth of
    data that can be derived from mapping network traffic.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Network Scanners


    Packet scanning is designed to capture packets that are seen by your network card.
    Network scanning will scan a network or network segment. It can enumerate the
    network as well as identify services on that network. This is an excellent preliminary
    step for a penetration tester.


    # LanHelper


    The LanHelper tool is an inexpensive network mapper/scanner that you can download
    from http://www.hainsoft.com/download.htm. It installs rather quickly, and then
    you simply tell it to scan by clicking the Network drop-down menu and then selecting
    one of the following:


    +   - Scan LAN

    +   - Scan IP

    +   - Scan Workgroups


    When the scan is done, you will see a list of all devices on the network and you
    can click on any one of them to get more detail, as shown in Figure 8-8.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_208_0.png)


    FIGURE 8-8 LanHelper.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Wireless Scanners/Crackers


    Wireless networks are ubiquitous today. For this reason, scanning the wireless
    network, and even testing its security by attempting to crack it, is an important
    activity for any network administrator. The network scanners mentioned in the
    previous section can be used for wireless networks, but there are also tools specifically
    designed for Wi-Fi that you can use as well.


    In addition to scanning, many of these Wi-Fi tools will attempt to crack your
    Wi-Fi. They will essentially attempt either to derive the password or circumvent
    the security. It is important that network security professionals scan their network
    with tools like this to find issues before an attacker does.


    # Aircrack


    Aircrack is one of the most popular tools for scanning and cracking Wi-Fi. It
    is a free download, and you can get it at http://www.aircrack-ng.org/. There are
    actually a few tools in this download. One, called wzcook.exe, will try to extract
    wireless data, including the password, from the local machine on which it is installed.
    But that is not the part we are interested in here. The main tool is aircrack-ng.
    It is a command-line tool, and you can see it in Figure 8-9.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_209_0.png)


    FIGURE 8-9 Aircrack-ng.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'It takes a bit of time to get comfortable with all of the command line flags;
    however, this is a very important tool and well worth the time spent. The reason
    why it is so important is that it is very popular with attackers. If you scan
    your wireless network with the same tool that attackers are likely to use, and
    you find problems and correct those, then your network is less vulnerable to wireless
    attacks.


    When you download Aircrack you will notice a number of executables in the bin
    directory. There is airdecloak-ng.exe; airodump-ng.exe; aircrack-ng-avx2.exe;
    etc. Each of these has a different wireless function. Here are a few basic commands:


    +   - **airodump-ng interface:** This will do packet capture for the interface
    designated.

    +   - **airodump-ng -c 11 --bssid 00:01:02:03:04:05 -w dump interface:** The -c
    indicates the Wi-Fi channel, in this case 11. The -w indicates to dump to hard
    drive. The -bssid will define the bssid of the wireless you wish to capture. For
    older encryption, like WEP, you can capture around 50,000 packets and you should
    be able to crack it.

    +   - **aircrack-ng -b 00:01:02:03:04:05 dump-01.cap:** This tells Aircrack to
    take the packet dump and try to crack it.


    # General Scanners


    There are several scanners that are general vulnerability scanners. These should
    be a part of your toolset for penetration testing. We will look at a few of the
    more common scanners in this section.


    # MBSA


    Microsoft Baseline Security Analyzer is not the most robust vulnerability scanner.
    However, it is a free download, and in addition to finding vulnerabilities, it
    is useful in finding configuration issues with Windows machines. You can download
    MBSA from:


    https://www.microsoft.com/en-us/download/details.aspx?id=7558


    In addition to being free, it is very easy to use. You can see the output from
    MBSA in Figure 8-10.


    MBSA is a limited vulnerability scanner. It is primarily used just to find common,
    basic Microsoft issues; however, it is a free download and remarkably easy to
    use. For that reason, it should certainly at least be considered.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_211_0.png)


    FIGURE 8-10 MBSA Output.


    # Nessus


    Nessus is a well-known vulnerability scanner. It has been used for many years.
    Unfortunately, it is not free. The license is over $2,100 per year and can be
    obtained from https://www.tenable.com/. Its price has been a barrier for many
    penetration testers. The primary advantage of Nessus is that the vendor is constantly
    updating the vulnerabilities it can scan for. Nessus also has a very easy-to-use
    web interface as shown in Figure 8-11.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_211_1.png)


    FIGURE 8-11 Nessus Main Screen.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The first step is to select **New Scan**. You then are given a number of options,
    shown in Figure 8-12.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_212_0.png)


    FIGURE 8-12 Nessus Scan Options.


    For our purposes, select a **Basic Network Scan**. The basic settings are intuitive.
    You have to name your scan and select a range of IP addresses, as demonstrated
    in Figure 8-13.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_212_1.png)


    FIGURE 8-13 Nessus Options.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Then you can either schedule the scan to run later, or launch it now. A Nessus
    scan can take some time to run, because it is quite thorough. The results are
    presented in a very organized screen, as you can see in Figure 8-14.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_213_0.png)


    FIGURE 8-14 Nessus Results.


    You then drill down on any item of interest. First you double-click on a specific
    IP address, which will show you the details for that IP, as displayed in Figure
    8-15.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_213_1.png)


    FIGURE 8-15 Nessus Results: Detailed.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'You can then double-click on any individual item for more details. This will
    provide you with details on the issue, and how to remediate the issue.


    # Nexpose


    Nexpose is another commercial product. It is from Rapid7, the vendors who distribute
    Metasploit. You can find Nexpose at https://www.rapid7.com/products/nexpose/.
    There is a free trial version that you can download and experiment with. This
    tool is a Linux virtual machine and takes some effort to learn. Given that it
    is distributed by the same people who distribute Metasploit, it has received significant
    market attention.


    # SAINT


    SAINT is a well-known vulnerability scanner. It is available at http://www.saintcorporation.com/.
    You can request a free trial version. It will scan the network for any TCP or
    UDP services, then scan those machines for any vulnerabilities. It uses Common
    Vulnerabilities and Exposures (CVE) as well as CERT advisories as references.


    # Web Application Scanners


    Web applications are public facing, and thus popular targets for attack. For this
    reason, you should definitely put effort into scanning your web application for
    vulnerabilities.


    # OWASP ZAP


    The Open Web Application Security Project (OWASP) is the standard for web application
    vulnerability. They also offer a free vulnerability scanner called the Zed Attack
    Proxy, or more commonly known as OWASP ZAP. You can download this from https://github.com/zaproxy/zaproxy/wiki/Downloads.
    The interface, shown in Figure 8-16, is very easy to use.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_215_0.png)


    # FIGURE 8-16 OWASP ZAP Main Screen.


    Just type in the URL of the site you wish to scan, and click Attack. After a few
    moments, the results will be displayed (at the bottom). You can then expand any
    item. If you click on a specific item, details will be loaded into the window
    panes. You can see this in Figure 8-17.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_216_0.png)


    FIGURE 8-17 OWASP ZAP Results.


    OWASP ZAP is a very easy to use tool. The basics can be mastered in a few minutes.
    And given that OWASP is the organization that tracks web application vulnerabilities,
    it is a very good source for testing the vulnerabilities of a website.


    # Vega


    Vega is another vulnerability scanner for websites. It is also free, and is available
    from https://subgraph.com/vega/download/. There are versions for Windows, Linux,
    or Macintosh. To begin a scan, just click on the target icon in the toolbar, then
    enter the URL of the website you wish to scan, as demonstrated in Figure 8-18.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_217_0.png)


    # FIGURE 8-18 Vega.


    You then step through a simple wizard, selecting what items you wish to scan for,
    then the scan begins. After a few moments, you will see the results. You can expand
    and select any specific issue to see details, as shown in Figure 8-19.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_218_0.png)


    FIGURE 8-19 Vega Results.


    Much like OWASP ZAP, Vega provides details on what is wrong, how serious the issue
    is, and how to remediate the issue. Given that both OWASP ZAP and Vega are free
    and very easy to use, I recommend using both to perform vulnerability scanning
    of a target website. The use of multiple tools guarantees thorough coverage. That
    still won’t guarantee you catch every vulnerability, but it is the best chance
    of doing so, and it is as thorough as you can get.


    # Cyber Threat Intelligence


    The topic of cyber threat intelligence is related to vulnerability scanning. The
    concept is that organizations should use intelligence gathering techniques to
    find out threats to their network. Part of cyber threat intelligence involves
    the Dark Web, which we will be examining in Chapter 17, “General Hacking Knowledge.”


    The concept is to monitor trends so that you have a general idea of what threats
    are likely to be issues for your network. For example, if you work for a bank,
    there are specific threats that are problems for banks but are either not an issue
    or at least far less significant for a university network. Cyber threat intelligence
    is about understanding the current trends so you can take proactive steps. What
    does this have to do with penetration testing, you may ask? The best penetration
    testers are proactive. Not just testing for the ordinary, well-known issues such
    as SQL injection, but gauging the current trends, and modifying tests accordingly.
    There are some excellent websites that will help you with trends.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Threatcrowd.org


    The website https://www.threatcrowd.org/ is a cyber threat search engine. You
    can search for domains, IP addresses, or specific threats. For example, in Figure
    8-20, I searched for Ransomware.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_219_0.png)


    FIGURE 8-20 Threat Crowd.


    It is a good idea to search for general trends, as well as the target network’s
    IP address and domain(s), prior to a penetration test.


    # Phishtank


    The website https://www.phishtank.com/ provides information on current phishing
    scams. This is less interesting to a penetration tester, but very interesting
    to a security administrator. If you are aware of current phishing scams, you can
    inform employees and they can be on the alert.


    # Internet Storm Center


    The SANS Institute Internet Storm Center, https://isc.sans.edu/, allows you to
    search for domains, keywords, IP addresses, or other characteristics. It lets
    you know what “storms” are currently occurring in cyber space.


    # OSINT


    Open source intelligence, or OSINT, is also a part of cyber threat intelligence.
    Beyond being aware of general trends, you may need to find information on a specific
    IP address, email address, or other identifying mark. The website http://osintframework.com/
    is a repository of open source intelligence links. You can use this site to search
    email addresses, specific exploits, or other items of interest. Figure 8-21 shows
    the main landing page.'
  merge: -1
  img_proc: true
