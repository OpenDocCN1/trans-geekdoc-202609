- pgno: 290
  md: '# John the Ripper


    John the Ripper is a well-known password cracking tool. Kali Linux has a shell
    version of John the Ripper and a GUI version named Johnny, seen in Figure 11-13.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_290_0.png)


    FIGURE 11-13 Johnny.


    It is fairly easy to use, particularly with the GUI. You must keep in mind, however,
    that there is no guaranteed password cracker. Any password cracking tool can simply
    make its best effort to crack a password.


    # Hashcat


    Hashcat is a rainbow table tool that tries to find passwords. It is completely
    shell, no GUI. Its main strength is that it can work with a variety of hash formats.
    Different applications can store their hashed passwords in a variety of ways.
    Haschcat can handle several widely used formats, including Mac OS X, as shown
    in Figure 11-14.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_291_0.png)


    FIGURE 11-14 Hashcat.


    # macchanger


    This particular tool is meant to change the MAC address your Kali machine sends
    out. That makes it more difficult to trace the attack back to the Kali machine.
    Also, MAC spoofing can be a way to circumvent some forms of authentication. Figure
    11-15 shows the available macchanger options.


    macchanger is a very easy to use tool. You can see in Figure 11-15 that it consists
    of just a few commands. The basic syntax is three steps:


    STEP 1. Turn off your network card:


    ```

    ifconfig eth0 down

    ```


    STEP 2. Run macchanger as follows:


    ```

    macchanger -m a1:b2:c3:11:22:33 eth0

    ```


    or set it to some random number:


    ```

    macchanger -r eth0

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# STEP 3. Bring your network card back up:


    ```

    ifconfig eth0 up

    ```


    If you get errors, the most common issue is not having root-level privileges.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_292_0.png)


    FIGURE 11-15 macchanger.


    # Note


    While ifconfig is commonly used, it does have known bugs, some of which are listed
    in the man page. There is an alternative, the package iproute2, with the tool
    ip. Here are the equivalent ip commands for bringing up/down an interface and
    changing its MAC address:


    +   - ip link set eth0 down

    +   - ip link set address a1:b2:c3:11:22:33 eth0

    +   - ip link set eth0 up


    # Ghost Phisher


    Ghost Phisher is a very versatile tool with several interesting functions. Figure
    11-16 shows the main screen.'
