    # Kali Tools


    Kali Linux includes literally hundreds of tools. One could fill an entire book
    just discussing the different tools. In this section, we will look at a few that
    are very useful to penetration testing. Each of these tools can be explored in
    more depth than presented here. The goal of this chapter is to make you aware
