    # PROJECTS


    # PROJECT 1: Bluetooth Scanning


    Download a Bluetooth scanner for your phone and scan nearby Bluetooth devices.
    Note the data you can collect on those devices. Then find a device whose owner
    you know and, with their permission, attempt to connect to their device.


    # PROJECT 2: Wi-Fi


    Using the CommView/Aircrack method discussed earlier in this chapter, you will
    crack a WAP in your lab. First set up a WAP to use WEP. Then have someone else
    connect to that WAP and begin Internet activity (visiting websites, downloading
    files, etc.). While that activity is ongoing, use the steps outlined earlier in
    this chapter to attempt to breach the Wi-Fi.'
