    \ noticed the comments placed liberally throughout this exploit. This exploit\
    \ is heavily commented so that you can more readily understand it. The next section\
    \ is explained in the comments, and it is the general description of this exploit.\n\
    \nNext, we come to this section, and it may look a bit odd to you:\n\n```\ndef\
    \ rannum\n    return Rex::Text.rand_text_alphanumeric(rand(1024))\nend\n```\n\n\
    This is generating a random string of alphanumeric text of a particular size.\
