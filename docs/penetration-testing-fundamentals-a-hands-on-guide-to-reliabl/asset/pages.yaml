- pgno: 406
  md: "# Summary\n\nIn this chapter, you have learned basic techniques for testing\
    \ Wi-Fi as well as some of the basic background technology of Wi-Fi. You have\
    \ also been introduced to SCADA systems and how to test them. Finally, we discussed\
    \ cellular and Bluetooth attacks. Each of these areas might require some additional\
    \ study to become truly proficient in, depending on how much your penetration\
    \ test is focused on these technologies.\n\nIn general, if you are doing a general\
    \ network penetration test, and one of the preceding technologies is simply a\
    \ small part of that test, you can probably use the material in this chapter to\
    \ adequately test the system. That includes the references cited in this chapter.\
    \ However, if your test is focused primarily on one of these technologies, such\
    \ as SCADA, you will need to study those specific systems in more detail, in order\
    \ to conduct a successful penetration test.\n\n# Test Your Skills\n\n# MULTIPLE\
    \ CHOICE QUESTIONS\n\n+   1. Which of the following is the most fundamental, basic\
    \ thing to verify in a Wi-Fi penetration test?\n+      A. Connection to the admin\
    \ interface is encrypted.\n+      B. No default passwords are being used.\n+ \
    \     C. MAC filtering is being used.\n+      D. Passwords are changed regularly.\n\
    +   \n+   2. Which Wi-Fi standard first introduced MIMO?\n+      A. 802.11n-2009\n\
    +      B. 802.11g\n+      C. 802.11ac\n+      D. 802.11n\n+   \n+   3. What is\
    \ the most significant weakness in WEP?\n+      A. There are no significant weaknesses;\
    \ WEP is the preferred mode.\n+      B. It uses a flawed algorithm.\n+      C.\
    \ It reuses the initialization vector.\n+      D. It has a short administrative\
    \ password."
