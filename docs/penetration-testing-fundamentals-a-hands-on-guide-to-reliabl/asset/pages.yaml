    # Conferences


    In any field of endeavor, it is critical to keep informed. You have to know what
    the latest trends are, and you need to make connections in the community. With
    penetration testing, you are in effect living in two worlds. One world is the
    professional IT world, with a combination of corporate IT personnel and academics.
    The other world is the hacking community.


    For hacking, the oldest and most respected conference is still DEF CON. While
    writing this book I presented a workshop at DEF CON 25. That should indicate to
    you how old this conference is (25 years as of this writing). That was my second
    presentation at DEF CON, and my impression is the same. This is the most diverse
    group of people you will ever meet. There are hardcore hackers, law enforcement,
    security professionals, members of the intelligence community, and even a few
    cyber'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'criminals. They are all there for the same purpose: to learn. The only problem
    with DEF CON is that it is so huge, you cannot possibly see everything you want
    to see.


    There are many other hacking conferences today. Black Hat is fairly large, and
    has a very good reputation. It also runs just prior to DEF CON, and both are in
    Las Vegas. So, you could come to both on a single trip. DEF CON and Black Hat
    are the two “must attend” conferences. At some point in your career, you should
    attend each of these. However, there are many other hacking conferences that are
    popping up all over the world. One of those might be more conveniently located
    for you.


    ShmooCon is starting to get more publicity. It has been around for a few years
    and, while not as well known or nearly as large as DEF CON, is an interesting
    conference.


    For the security professional side of things, the ISC2 Security Congress is probably
    the most well-known security conference. It is held each year in a different city.
    There is a wide range of speakers on a variety of security topics. You can pick
    those talks that are of most interest to you.


    Also of interest is SecureWorld. These tend to be smaller conferences, but are
    held in several major cities each year. This makes it more convenient for many
    security professionals to attend. Like ISC2, you can attend the talks that are
    of interest to you. The RSA Conference is also well respected, and has been around
    for quite a long time.


    The preceding are just a sample of the most widely known conferences. There are
    certainly many others that are very good conferences. The way you evaluate whether
    a conference is “good” or not is simply by how much you learn at the conference.


    # Dark Web


    The dark web is a critical topic for penetration testing, for several reasons.
    The first is that there is a great deal of information regarding hacking and breaches
    available on the dark web. Any penetration testing professional should be familiar
    with it. The second reason is that dark web markets are often a conduit for stolen
    data from corporations. Because penetration testing is about network security,
    it is useful to know something about how to track information on the dark web.


    The dark web is an area of the Internet only accessible via onion routing. Onion
    routing essentially routes packets all around the world, bouncing through proxy
    servers. Each packet is encrypted with multiple layers of encryption, and each
    proxy can only decrypt one layer, and send the packet to the next proxy. If someone
    intercepts a packet in transit between two proxies, you can only determine the
    previous proxy and the next proxy. You cannot determine the actual origin or destination,
    as illustrated in Figure 17-1.'
