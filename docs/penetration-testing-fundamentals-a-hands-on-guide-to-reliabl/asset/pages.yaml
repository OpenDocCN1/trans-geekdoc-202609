- pgno: 21
  md: '# PEARSON IT CYBERSECURITY CURRICULUM (ITCC)

    AT-A-GLANCE


    Pearson''s IT Cybersecurity Curriculum (ITCC) series is a turn-key curriculum
    solution for two- or four-year degree or certificate programs. Designed to support
    the critical need for workforce development in cybersecurity, Pearson ITCC provides
    multi-modal, real-world focused, hands-on courseware that can be used as a complete
    program or individual courses that can be chosen ad hoc to fill in your program
    to fit your student profile, workforce needs, and school requirements and articulation
    agreements. The program emphasizes applied, hands-on learning and validation through
    certifications set by industry organizations like EC Council, CompTIA, and Cisco.


    # Key features of the Pearson ITCC series:


    +   - Two parallel options for each course: Teach as a standard course or as a
    certification course. Follow a particular track or pick and choose courses that
    fit your student profile or workforce goals for your program.


    | | Course | Track I – Standard Textbook Focus | Track II – Certification Guide
    Focus |

    |---|---|---|---|

    | 1 | IT Fundamentals | Complete CompTIA A+ Guide to IT Hardware and Software
    | CompTIA A+ |

    | 2 | Networking Fundamentals | Networking Essentials | CompTIA Network+ |

    | 3 | Cybersecurity Fundamentals | Computer Security Fundamentals | CompTIA Security+
    or CCNA Cyber Ops SECFND |

    | 4 | Linux Fundamentals for Cybersecurity | Linux Essentials for Cybersecurity
    | CompTIA Linux+/LPIC-1 |

    | 5 | Ethical Hacking and Penetration Testing | Penetration Testing Fundamentals
    | Certified Ethical Hacker (CEH) |

    | 6 | Network Defense & Countermeasures | Network Defense & Countermeasures |
    ** |

    | 7 | Cybersecurity Operations (Incident Response & Digital Forensics) | A Practical
    Guide to Computer Forensics Investigations | CompTIA CySA+ or CCNA Cyber Ops SECOPS
    |

    | 8 | Developing Cybersecurity Programs and Policies | Developing Cybersecurity
    Programs and Policies | ** |


    ** no related certification track for these courses


    +   - Flexible offerings: Create certificate programs or fill in a degree program.

    +   - Low-priced, multi-modal delivery: Book, online courseware and virtual labs,
    plus valuable supplemental video library. Books are also available through Pearson''s
    direct digital access (DDA) program making the curriculum even more affordable
    to students.

    +   - Mapped to Leading Industry Standards: Be assured of compliance with industry
    standards and topic coverage—mapping to NSA/DHS CAE Knowledge units and aligned
    with NIST/NICE framework and ACM CSEC2017 Curricular guidance. Also where applicable
    the Pearson ITCC courses are certified as CompTIA Approved Quality Content (CAQC)
    and are the only official Cisco authorized content.

    +   - Powerful Online Courseware and Labs: Delivered through the CODiE award-winning
    platform provided by our partner uCertify. 24x7 Tech Support, easy and intuitive
    to use, LMS integration for single sign on (SSO) and gradebook integration, multiple
    levels of formative exercises and assessment tools, ADA compliant meeting all
    accessibility standards, and Certificate of completion badging for each course.'
  merge: -1
  img_proc: true
