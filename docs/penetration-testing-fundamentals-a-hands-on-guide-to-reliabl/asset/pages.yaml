- pgno: 408
  md: '# A Sample Pen Test Project


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Plan a small network penetration test

    +   - Conduct pre-test activities

    +   - Write a report


    At this point in your journey through this book, you should be familiar with a
    wide range of techniques, as well as various penetration testing standards. This
    chapter will be a bit different than the preceding chapters. We will walk through
    a penetration test of a small network. This will allow you to pull together all
    you have learned into a single project.


    This chapter has a few differences from the preceding chapters. First, there is
    only one end of chapter project. It is a scaled down version of this chapter hypothetical,
    appropriate for a small lab setting. The entire chapter is a project. Secondly,
    there are no end of chapter questions. We are simply putting into practice what
    you have learned up until this point.


    # Pen Test Outline


    What tests and tools you use will depend on the target network, the scope of work,
    and the items being tested. For illustration purposes, we will use a hypothetical
    company. This company is ACME Bookkeeping. It has 1 gateway router, 30 workstations,
    3 servers, and 1 web server. We will assume a white box test. In this chapter
    we will walk through the steps you should take in penetration testing this company.
    We will also provide you with hypothetical issues found in this company’s network.


    This penetration test is a rather simple one. That is intentional. It allows someone
    new to penetration testing to become acclimated to the process.'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# Pre-Test Activities


    The first step in performing this penetration test is a meeting with someone in
    authority at ACME Bookkeeping. At that meeting you need to request the following
    information:


    +   1. What operating systems are running on the servers and workstations?

    +   2. Identify critical applications.

    +   3. List of any suspected or confirmed security breaches or issues in the last
    12 months.

    +   4. Identify any regulatory issues that are applicable to this company.

    +   5. What is the scope of the project? Do they want every single machine tested,
    or just a sample? Do they want physical penetration testing? Do they want social
    engineering?

    +   6. Determine the rules of engagement. Should the servers only be tested in
    off hours?

    +   7. If there have been previous security audits, penetration tests, or vulnerability
    scans, you will want to see those.

    +   8. If there have been previous incident reports, you will want to see those
    as well.


    Most important, before you begin any penetration test, make certain you have written
    authorization from someone in the company who has the authority to authorize the
    penetration test.


    For our hypothetical test of ACME Bookkeeping we will assume the following answers:


    +   1. All servers except the web server are running Windows Server 2016. The
    web server is running Ubuntu Linux 16.03 with Apache web server.

    +   2. The web server hosts a customer portal application that does process confidential
    information. One of the servers is running SQL Server 2012.

    +   3. There have been two virus outbreaks in the past 12 months and one suspected
    DoS attack on the web server.

    +   4. No regulatory issues.

    +   5. All servers and 10% of workstations are to be tested. No physical penetration
    test or social engineering tests.

    +   6. All tests should be conducted outside normal business hours.

    +   7. If possible, have the client company create backups of all sensitive systems
    before you begin your test. Then if something does go wrong, it can be restored.


    Now that you have identified the information needed for this test, ensure that
    all of that is in the agreement you and the client sign.


    When you begin the test remember to frequently take screen shots of tools and
    attacks. Make copious notes about what you are doing and what the results are.
    You will need very detailed information in order to write an effective report
    when you are done.'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# External


    This section involves scanning activities that are done remotely from the organization.
    You don’t need to be onsite.


    # Passive Scanning


    Next, we begin with passive scanning. Use netcraft.com, shodan.io, builtwith.com,
    and archive.org to learn as much as you can about the technology the company uses.
    Pay particular attention to shodan.io. It can be very informative. Document all
    the details you find for the web server (builtwith.com and netcraft.com) as well
    as any vulnerabilities identified by shodan.io.


    Now it is time to search the web for this company name. Check LinkedIn, Twitter,
    and Facebook. You may wish to use Maltego on company phone numbers, URLs, and
    email addresses. This can give you an indication of any connected entities (individuals
    or companies) as well as any information about the company that is out in the
    public. It is also a good time to use cyberthreat intelligence websites such as
    threatcrowd.org.


    This is also the appropriate phase to research known vulnerabilities for the operating
    systems used in this network. We know they have Ubuntu Linux and Windows Server
    2016. Search the web using Google, threatpost.com, https://cve.mitre.org/, and
    others.


    # Active Scanning


    We now begin actively scanning the public facing portions of the target network.
    That will begin with using tools like Nmap to scan the gateway router and the
    web server. Note any open services and ports. If the company uses Wi-Fi, attempt
    to connect to the WAP using default passwords.


    This is also when we run external vulnerability scans. You should run two different
    scanners on the web server. I recommend Vega and OWASP ZAP, but you can use any
    two you like.


    This is also an appropriate place to utilize the Metasploit scans you learned
    in Chapter 13, “Introduction to Metasploit.” There are SSL, anonymous FTP, SQL
    Server, and other scans. Run these on any public facing device to determine if
    any services are exposed to the outside world, and if said services are exploitable.


    # Actual Breaching


    Now it is time to try actually breaching each of the external facing interfaces.
    We will start with the web server. Take each vulnerability you have discovered
    and attempt to breach them with multiple techniques. Assume the server is vulnerable
    to SQL Injection. You would then:


    +   1. Attempt to manually use SQL Injection

    +   2. Use a tool such as Burp Suite to attempt SQL Injection


    Do both manual and semi-automated attacks on all identified vulnerabilities.


    Now we repeat that process for the gateway router. We first attempt logging into
    it, guessing passwords, etc. Try a variety of techniques to gain access to the
    router and document the results.'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'Then we have one last public facing interface: the WAP. You should attempt
    to log into the admin screen, crack the security protocol (WEP, WPA, or WPA2),
    and breach any other vulnerability you have identified.


    After completing the pre-engagement activities and the phase 1—passive scanning,
    the active scanning is the next step. In a small network, such as the one described
    in this scenario, active scanning will flow naturally into phase 3—breaching.
    It is often easiest to start with external testing.


    For all three interfaces, there are a few steps you should always take:


    +   1. In addition to other attempts to breach, use any appropriate Metasploit
    attack. When you identified vulnerabilities, you can use the vulnerability to
    seek out Metasploit modules. Then use those modules on the target.

    +   2. Always try default passwords on all public interfaces.

    +   3. Always try some password cracking tool on all public interfaces.


    Depending on the nature of the test and rules of engagement, you may also use
    this phase to send phishing emails to a portion of the employees. These can use
    innocuous viruses, like those you saw in Chapter 5, “Malware”; for example, the
    virus that simply used the Windows speech engine to say “don’t open attachments.”


    At this point you have concluded the external portion of this penetration test.


    # Internal


    Now move internally. This part is done from inside the network. There are two
    reasons for internal testing. The first is that some vulnerabilities can only
    be found from inside the network. Another is that one must always be concerned
    with insider threats.


    Start with vulnerability scanning. Because this network is primarily Microsoft,
    MBSA would be a reasonable tool to run on the network. You should also consider
    a more robust tool such as Nessus. You should again run your Metasploit scans
    from Chapter 13.


    You will probably get more results from an internal scan than from an external
    scan. You will also want to run Nmap again internally. You are also likely to
    get more results from an internal scan than you did when you executed Nmap externally.


    Now, as per the rules of engagement, you should attempt to breach each of the
    servers, as well as 10% of the workstations (3 workstations). This will utilize
    all the Windows hacking techniques you learned in Chapter 6, “Hacking Windows.”
    Try to access shares, try password cracking, attempt to breach any known vulnerabilities.


    During this internal phase, Metasploit can again be quite useful. Try several
    Metasploit attacks on various machines, including those attacks that require a
    user to click on a link. This will test both phishing and Metasploit.


    Don’t forget other devices on the network, such as printers. Try to Telnet and
    SSH into those with default passwords. There could also be internal routers or
    switches, so do not forget to check those.'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'HP printers have a mechanism to send email to the printer. You can find the
    printer’s email address two different ways. The first way is to log into ePrintCenter.com
    and look on the printer’s page for the email address. The second way is to touch
    the ePrint button on the front panel and it will display all of the printer’s
    web services information. You should test this. And of course, find out if other
    devices have similar issues.


    Of course, you must test all items indicated by any standard you are using. For
    example, PCI DSS requires all external communication of credit card data to be
    encrypted. I suggest you test all internal and external data communication.


    # Optional Items


    The following items are not always included in penetration tests, but you should
    consider them. We discussed a few of these earlier in this chapter.


    +   1. Send employees anonymous phishing email that will do something harmless
    such as redirect them to a page admonishing them not to click on links, or a harmless
    malware attachment that just has a voice or popup telling them not to download
    attachments.

    +   2. Attempt social engineering via phone or in person.

    +   3. A penetration test is not a vulnerability scan, but can include vulnerability
    scanning (as already shown in this book). In the same way, a penetration test
    is not an audit, but can sometimes include elements of an audit. With that in
    mind, you may wish to check the following items:

    +      a. Password policies

    +         i. Lockout policy

    +         ii. Minimum requirements

    +         iii. How often passwords are changed

    +      b. Are there any unauthorized devices or software anywhere on the network?

    +      c. Are there still accounts active for employees no longer with the organization?


    In general, you should feel free to add items to this outline, but not to take
    any away. When you are testing a system, issues may arise that were not foreseen
    in the pre-project activities. Also, your own experience will teach you new things
    to be alert for. There may be recent security issues in the news that were not
    an issue at the time this chapter was written. Keep in mind the penetration test
    described in this chapter is for a small network, and it should be considered
    the baseline or minimum for a successful penetration test. You should feel free
    to add to it and expand it.


    # Report Outline


    Now that you have completed your test, you should have a lot of screenshots from
    your tools, lots of notes, and a significant amount of data. While the focus should
    be on issues found, anything you tested'
  merge: -1
  img_proc: true
- pgno: 413
  md: 'that was not vulnerable to a particular attack must also be noted. The main
    thing with a report is to be clear and thorough. The following outline provides
    you some guidelines:


    The report must be thorough, with the following sections:


    # I. Executive summary


    1 to 3 paragraphs explaining the scope of the test and results.


    # II. Introduction


    This is where you describe testing goals and objectives. This section must also
    include what the testing goals were, what was tested, and what was excluded. This
    is often referred to as the scope of work.


    This section should include rules of engagement and any past breaches or risk
    assessments. Such past activity should be guiding the prioritization of your penetration
    testing.


    # III. Detailed Analyses


    This must include every test you conducted, preferably with step by step discussion
    and screen shots. The detail should be sufficient that any competent technical
    person could repeat your tests.


    If you used tools that produced reports, those reports are attached as appendices.
    Most vulnerability scanners will produce reports.


    When you identify vulnerabilities, whenever possible identify them by a well-known
    standard. For example:


    +   - Common Vulnerabilities and Exposures (CVE)

    +   - National Vulnerability Database (NVD)

    +   - Common Vulnerability Scoring System (CVSS)

    +   - Bugtraq ID (BID)

    +   - Open Source Vulnerability Database (OSVDB)


    # IV. Conclusions & Risk Rating


    Provide a general description of what you found and what the risk level is. A
    risk rating of the network can be helpful to the customer. This need not be an
    absolute mathematical scale. It can be simply a description such as low, moderate,
    high. Or it can be expanded such as low, moderate, elevated, high, extreme.


    # V. Remediation steps


    This section provides details on how the flaws found in penetration testing can
    be addressed and mitigated. These should be detailed enough to allow any competent
    technical person to be able to correct the problems you discovered. This is a
    critical part of the report. It is not enough to simply state that there are problems;
    you must provide clear guidance on how to address those problems.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# Summary


    In this chapter you saw a penetration test outline for a small network. What must
    be stressed is that what was presented in this chapter is the baseline, the minimum
    for a penetration test. You may have noted that, for example, we did not test
    Bluetooth issues. Your tests will often be more extensive than this; however,
    the outline presented here is one that you can use for any penetration test. Just
    expand it as needed in your environment.


    In addition to this chapter, it is recommended that you also consult with the
    following resources:


    +   - Writing a penetration testing report: https://www.sans.org/reading-room/whitepapers/testing/writing-penetration-testing-report-33343

    +   - Conducting a penetration test on an organization: https://www.sans.org/reading-room/whitepapers/auditing/conducting-penetration-test-organization-67

    +   - Penetration test report: https://www.offensive-security.com/reports/sample-penetration-testing-report.pdf

    +   - Penetration testing methodologies: https://www.owasp.org/index.php/Penetration_testing_methodologies


    # PROJECT


    # PROJECT 1: The Penetration Test


    This is an ideal project for a small group, particularly when this book is used
    as a textbook for a class. To conduct this test you need a lab with the following
    minimal configuration:


    +   1. One gateway router. This can be an inexpensive, commercial router that
    one might purchase for a home.

    +   2. One server running multiple services. You can use a trial version of Microsoft
    Server, or a Linux server. Make sure you have some database, website, and FTP
    services running.

    +   3. Three workstations. These can be virtual machines running on a single computer.
    Again, you could use a free virtual machine like Oracle VirtualBox and use trial
    versions for the individual workstations.

    +   4. Make sure all the machines are on a single network.'
  merge: -1
  img_proc: true
- pgno: 415
  md: 'Now conduct the penetration test outlined in this chapter, and write a report.
    If this is part of an instructor led class it is recommended that the instructor
    put in a few specific security issues, and grade the assignment in part on the
    student''s discovery of those issues.


    If you do not have access to a lab, but wish to perform a similar test on your
    own, then the answer is to follow step 3, but ensure all the target machines are
    in a virtual machine. If these are all on a single host, you may only be able
    to launch and test one at a time.'
  merge: -1
