- pgno: 258
  md: '# Chapter 10


    # Linux Hacking


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand the security features of Linux

    +   - Extract Linux passwords

    +   - Understand basic Linux hacking techniques


    The Linux operating system is a fairly secure system. However, it is not perfectly
    secure; no system is. And if your network has Linux computers, then they too must
    be tested. Thus, any good penetration test must include testing Linux. In this
    chapter, we will be looking at Linux and at Linux security in more detail. Then
    we will look at specific hacking techniques for Linux.


    # More on the Linux OS


    Chapter 9, “Introduction to Linux,” gave you a working overview of the Linux operating
    system. It is important that you are very comfortable with all the material in
    that chapter before proceeding in this chapter. We will start with some more details
    on the Linux operating system, including places to get information.


    # sysfs


    sysfs is a virtual file system provided by Linux 2.6 that is used to gather information
    about the system. sysfs exports information about devices and drivers from the
    kernel device model to userspace. The organization of the file system directory
    hierarchy is based on the internal organization of kernel data structures. The
    files that are created in the file system are usually ASCII files that have one
    value per file.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'For each object added in the driver model tree, a directory in sysfs is created.
    The parent/child relationship is reflected with subdirectories under /sys/devices/.
    The subdirectory /sys/bus/ is populated with symbolic links, mirroring how the
    devices belong to different busses. The subdirectory /sys/class/ shows devices
    grouped according to classes. And /sys/block/ contains the block devices.


    A symbolic link is a special sort of file that is really a pointer to another
    file. You can think of it as the equivalent of a shortcut in Microsoft Windows.
    These are also sometimes called soft links.


    For device drivers and devices, attributes may be created. These are simple files;
    the rule is that they should only contain a single value and/or allow a single
    value to be set. These files show up in the subdirectory of the device driver
    respective to the device. Using attribute groups, a subdirectory filled with attributes
    may also be created.


    This service has gone through quite a few name changes in its lifetime. sysfs
    was originally called ddfs (Device Driver Filesystem) and was initially created
    to debug the driver model as it was being written. Previously, debugging was performed
    by using procfs to export a device tree; however, that was converted to use a
    new file system based on ramfs. By the time the new driver model was merged into
    the kernel around 2.5.1, it had changed names to driversfs to be a little more
    descriptive. If you open any file manager and look in the /sys directory, you
    will see subdirectories for firmware, devices, and more. This is shown in Figure
    10-1.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_259_0.png)


    FIGURE 10-1 The /sys Directory.


    You can drill down to specifics by opening subdirectories, as shown in Figure
    10-2.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_260_0.png)


    FIGURE 10-2 Drilling Down in the /sys Directory.


    # Crond


    Crond is a daemon (thus the d on the end of the name) that is responsible for
    seeing that scheduled tasks run as scheduled. This is a critical system service
    for a network administrator. It is inefficient for you to manually run every task
    every time it is needed. And on any but the smallest networks it is simply impossible.
    Therefore, you must have some mechanism whereby you can schedule tasks to run.
    Crond is that mechanism.


    The crond daemon uses crontab files for scheduling tasks. Crond searches /var/spool/cron
    for crontab files. Essentially crond periodically examines all the crontab files
    to see if there are commands to be run, and if so it executes them. Each user
    has their own crontab, and commands in any given crontab will be executed as the
    user who owns the crontab. It is important to keep this in mind. Unless absolutely
    necessary, you should not run tasks as the root. For the penetration tester, you
    may wish to see what cron jobs are running and you may need to turn some off,
    or at least verify if an intruder can turn them off.


    A crontab file contains instructions to the crond daemon of the general form:
    “run this command at this time on this date.” Inside crontabs, blank lines and
    leading spaces and tabs are ignored. Lines which begin with a pound sign (#) are
    comments, and are ignored. Note that comments are not allowed on the same line
    as cron commands. It is common practice to put the comment just before the command.
    Similarly, comments are not allowed on the same line as environment variable settings.


    An active line in a crontab will be either an environment setting or a cron command.
    An environment setting is of the form:


    ```

    name = value

    ```'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Several environment variables are set up automatically by the crond daemon.
    For example, SHELL is set to /bin/sh, and LOGNAME and HOME are set from the /etc/passwd
    line of the crontab''s owner. HOME and SHELL may be overridden by settings in
    the crontab; LOGNAME may not. Figure 10-3 shows a basic default crontab.


    ```

    SHELL=/bin/sh

    PATH=/usr/bin:/usr/sbin:/sbin:/bin:/usr/lib/news/bin

    MAILTO=root

    #

    # check scripts in cron.hourly, cron.daily, cron.weekly, and cron.monthly

    #

    */15 * * * * root test -x /usr/lib/cron/run-crons && /usr/lib/cron/run-crons >/dev/null
    2>&1

    ```


    # FIGURE 10-3 Basic crontab.


    The format of a cron command is basically what you see here:


    ```

    * * * * * /bin/execute/this/script.sh

    ```


    The five stars represent the date/time portions of the command. Note, these must
    be in order:


    +   1. minute (from 0 to 59)

    +   2. hour (from 0 to 23)

    +   3. day of month (from 1 to 31)

    +   4. month (from 1 to 12)

    +   5. day of week (from 0 to 6, where 0=Sunday)


    So if you want to schedule the script to run at 3 a.m. every Thursday, you would
    need the following cronjob:


    ```

    0 3 * * 4 /bin/execute/this/script.sh

    ```


    Here are some other example crontab entries.


    Remove all files from the temp directory at 2:30 a.m. every night:


    ```

    30 2 * * * rm /home/{username}/temp/*

    ```


    This command sends a “popup” message to the user’s screen, at 3:00 p.m. Fridays,
    if they are logged in:


    ```

    0 15 * * 5 echo "Time for staff meeting" | write $LOGNAME >/dev/null 2>&1

    ```


    I think you can see how crontab entries work. They are relatively simple. It is
    common practice to have various administrative functions, such as backups, scheduled
    via crontab. For a penetration tester, these can be very interesting. There may
    be cronjobs that you don’t wish to run. Or you can set up your own jobs (assuming
    you get this far into the Linux machine). You may wish to have a timed pop-up
    message letting the client know that you got into their Linux machine.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Shell Commands


    Chapter 9 introduced a number of Linux shell commands. In this chapter, we will
    look at shell commands that are of interest to both attackers and penetration
    testers. Of course, some of these commands will require root privileges, but if
    the attacker or tester can get root privileges, there are many interesting things
    he or she can do.


    # touch


    The **touch** command is used with files. If you type **touch filename** and no
    such file exits, then a file with that name will be created. But the really interesting
    part of **touch** comes with files that already exist.


    **touch -a** says to change the access time of a file. **touch -m** changes the
    modification time. Or you can even set one file to have the same times as another
    file. So **touch -r fileA fileB** will tell fileB to use all the timestamps from
    fileA.


    If you don’t provide specific times (for example to **-a** and **-m**), those
    will be changed to current time. Or you can change them to any time you wish:


    ```

    touch -d ''1 May 2018 10:00'' fileA

    ```


    In Figure 10-4 you can see the file properties for test.txt.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_262_0.png)


    FIGURE 10-4 File Properties for test.txt.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Now let’s use the touch command, as shown in Figure 10-5.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_263_0.png)


    FIGURE 10-5 The touch Command.


    Now let’s check those properties again, and in Figure 10-6 you can see them.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_263_1.png)


    FIGURE 10-6 File Properties After the touch Command.


    It should be obvious that an attacker can use touch to cover his or her tracks
    rather effectively.


    # nice


    The nice command is very useful. It sets the priority of a given process. With
    priorities, the lower the number, the higher the priority. The minimum priority
    is 20 and the maximum priority is –20 and only a root user can assign negative
    priorities. However, any user can always lower the priorities of their own processes.
    This is shown in Figure 10-7.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_264_0.png)


    FIGURE 10-7 Setting Process Priority with nice Command.


    # locate


    **locate** is a pretty effective search tool. To locate all files that have the
    word virus anywhere in the filename, you use the command


    ```

    locate *virus*

    ```


    Figure 10-8 demonstrates the **locate** tool in action.


    As with all Linux commands, there are a few flags. Some of the more commonly used
    flags are listed here:


    +   - **-c** gives a count of how many matches there are, rather than enumerating
    them all.

    +   - **-L** follows trailing symbolic links.

    +   - **-i** ignores case.

    +   - **-l** limits how many results to return.


    Clearly it is useful for a penetration tester to search for various files on a
    target machine. This is a command you will likely use frequently.'
  merge: -1
