- pgno: 296
  md: '# Chapter 12


    # General Hacking Techniques


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Use Kali Linux to perform basic functions

    +   - Understand social engineering

    +   - Launch a denial of service attack


    There are general techniques used in hacking (and in penetration testing) that
    you should be familiar with. These are techniques that attackers will often use
    against your network; therefore, you must test your network for these items. Some
    of these will use Kali Linux, which you learned about in Chapter 11, “Introduction
    to Kali Linux,” but others do not need Kali.


    # Wi-Fi Testing


    Wi-Fi testing is clearly needed in a penetration test. In this chapter I will
    briefly introduce the topic and some techniques that can be used to test Wi-Fi
    related security. Chapter 18, “Additional Pen Testing Topics,” will provide more
    specific techniques for attacking Wi-Fi.


    # Create a Hotspot


    With the ubiquitous nature of Wi-Fi, rogue hotspot attacks, also called evil twin
    attacks, are fairly common. There are many ways to set up a fake wireless access
    point (WAP); let us examine a few.


    # The WiFi Pineapple


    The WiFi Pineapple is a product from Hak5 LLC. The tool contains a number of Wi-Fi
    penetration testing tools and uses a web interface to configure. One of the things
    that the WiFi Pineapple can do is'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'set up a rouge access point. It then tracks the devices that connect to it
    and can be used to capture their traffic. You can get the WiFi Pineapple from
    https://www.wifipineapple.com/.


    # Turn Your Laptop into a WAP


    Many modern laptops have the capability of being a wireless access point. The
    laptop itself should first be connected to some Internet source (Wi-Fi or cellular)
    so it can route the incoming packets to that source. You will also need to have
    some packet sniffer running in order to view the data from the devices that connect
    to the laptop wireless access point. tcpdump or Wireshark will work well for this
    purpose, and both were discussed in Chapter 8, “Vulnerability Scanning.”


    In Windows, you can simply use the network settings, as shown in Figure 12-1 for
    Windows 10. Note that how to find these settings will depend on what version of
    Windows you have. In Windows 10, typing settings into Cortana search brings you
    the result Network and Internet, which you have to click on to get to network
    settings.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_297_0.png)


    FIGURE 12-1 Windows 10 Mobile Hotspot Settings.


    You have probably used the first button, Wi-Fi, many times, and likely the second
    button, Airplane mode. The third button turns your laptop into a mobile hotspot.
    Simply clicking on it will activate it, after which you can right-click on it
    to get the Go to Settings option, as shown in Figure 12-2.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_297_1.png)


    FIGURE 12-2 Turning On the Mobile Hotspot.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'When you click on Go to Settings, you will see the screen shown in Figure 12-3.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_298_0.png)


    FIGURE 12-3 Mobile Hotspot Settings.


    A random name and network password are configured. You can also see the number
    of devices currently connected. You can click on the Edit button and then change
    the settings, as you see in Figure 12-4.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_298_1.png)


    FIGURE 12-4 Change the Wi-Fi Settings.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'As you can see, it is actually a trivial task to set up your Windows 10 machine
    as a wireless access point with any name you wish.


    # Using Kali as a Hotspot


    By now you should be aware that Kali is replete with various tools that will be
    useful to you as a penetration tester. One of these tools is wifi-honey. It is
    a shell tool, but is very easy to use. Before we use it, we have to find out what
    wireless adapters we have. There are several commands that will do that, including:


    ```

    netstat -i

    ifconfig -a

    ```


    Figure 12-5 shows the ifconfig -a command results.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_299_0.png)


    FIGURE 12-5 Searching for Wireless Adapters with ifconfig -a.


    You may notice something odd. There is no wireless adapter shown. That would make
    it rather difficult to set up a Wi-Fi honey pot. The issue is that I am running
    Kali Linux in a virtual machine (Oracle Virtual Box to be specific). When running
    inside a virtual machine, the wireless card will appear as a wired network card.
    So, in this case, I will be using eth0. Now with that covered, on to the use of
    Wifi-Honey.


    If you have never used Wifi-Honey before, start with the help command so you can
    see what the options are, as demonstrated in Figure 12-6.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_300_0.png)


    FIGURE 12-6 Wifi-Honey Help Command.


    As you can see, you need to give your honey pot an SSID and a channel, and tell
    Wifi-Honey which interface to use. So, let’s do that. You can see this in Figure
    12-7.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_300_1.png)


    FIGURE 12-7 Setting Up Wifi-Honey.


    Now if you have any issues such as a conflict with another application, some file
    not found, Wifi-Honey will tell you that. Depending on your virtual machine (if
    you are using a VM), you might have issues with the wireless card. Many people
    find that the VMs work best with an external USB wireless card.


    But if all goes well, you are now running a wireless access point from your Kali
    Linux machine. Just as you would with Windows, you now need to turn on some packet
    sniffer. Because tcpdump is included with Linux, that would be a good choice.


    # Testing the WAP Administration


    Aside from creating a WAP, you will want to check the existing wireless access
    points. In fact, this part is probably more important. The wireless access point
    is the most important part of the wireless network. It is important that you test
    its security. This is done by simply connecting to the Wi-Fi, then attempting
    to log in to its administrative screen. If the system has even the most basic
    security, you should not be successful. The steps are trivial:


    +   - **STEP 1.** After connecting, run `ipconfig` (or `ifconfig` if using Linux)
    and get the gateway IP address.

    +   - **STEP 2.** Open your browser and connect to the gateway router.

    +   - **STEP 3.** Attempt to log in to the administrative screen with default
    passwords. You can get default WAP passwords by simply searching the Internet
    for “Default xxx wifi password” where xxx is replaced by Linksys, Belkin, Huawei,
    or whatever the brand of wireless access point you have.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'Again, if the system has even the most basic security, then this simply will
    not work. It is a relatively easy test to conduct, and therefore should definitely
    be a part of your penetration test. In fact, you should not be able to wirelessly
    access the admin interface. When you first attempt to reach the router’s IP address,
    if it is properly configured, you will not even see that admin screen to attempt
    to log in.


    Obviously, any level of success on this test should be documented in your penetration
    testing report.


    # Other Wi-Fi Issues


    The following are other Wi-Fi attacks that you should be aware of. Each of these
    can present a danger to your network.


    +   - **Jamming:** Simply attempting to jam the Wi-Fi signal so that users cannot
    get on the wireless network. This is essentially a denial of service attack on
    the wireless access point.

    +   - **De-authentication:** Sending a de-authentication or logoff packet to the
    wireless access point. The packet will spoof the user’s IP address. This can be
    done in order to trick the user into then logging into the rogue access point.

    +   - **WPS attack:** Wi-Fi Protected Setup (WPS) uses a PIN to connect to the
    WAP. The WPS attack attempts to intercept that PIN in transmission, connect to
    the WAP, and then steal the WPA2 password.

    +   - **Cracking the password:** You may wonder why this is not being covered
    in more detail. The reason is that while WEP was very easy to crack, WPA2 (which
    is widely used today) is not. The issue with cracking wireless has to do with
    the complexity of the password, as well as the WAP settings. It is much better
    to simply test those by directly auditing those items.


    # Social Engineering


    Social engineering is the art of using people skills to get people to either give
    you information they should not, or to do things they should not. Frankly, many
    attacks have an element of social engineering. Consider the wifi-honey honey pot
    discussed earlier in this chapter. When an attacker sets up in an airport and
    starts broadcasting “freewifi” this is a form of social engineering. With the
    malware discussed in Chapter 5, one of the most common ways to deliver malware
    is via email attachment. Then the success of the attack depends on being able
    to convince the user to actually open the attachment.


    Social engineering remotely involves communication that is designed to encourage
    the recipient to perform some action or provide some information. There are a
    variety of approaches to social engineering, the most common of which are briefly
    described here:


    +   - **Urgency:** This approach tries to convince the recipient that if they
    don’t act immediately, something bad will happen or they will miss out on something.

    +   - **Authority:** With this approach, the attacker attempts to convince the
    target the attacker is actually a person of authority and the target must comply.

    +   - **Greed:** Simply playing to the target’s greed.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'Of course, you can combine these. Let’s look at how these are used in practice.
    The urgency approach is one that is commonly used. For example, an email might
    indicate that the recipient’s computer has a major flaw and the attached patch
    must be applied immediately in order to protect that computer. A similar approach
    is used with emails that indicate there is a problem with the recipient’s bank
    account or credit card, and if the recipient does not click on the link and address
    it immediately, their account will be suspended. The purpose is to get the user
    to act immediately without thinking. This is in the attacker’s best interest.


    Use of authority is best explained by describing an actual attack that has been
    used for some years. The attacker sends an email that purports to be from the
    Federal Bureau of Investigation. The email may even have the FBI logo. The content
    of the email claims that the recipient has visited some website that is prohibited,
    and should click on a link to pay a fine. This is often combined with urgency
    by claiming that if the recipient does not pay the fine immediately they may face
    jail time.


    Greed is a common basis for many phishing emails. The email claims that there
    is some very large sum of money the recipient can have if they take action. Usually
    the user must click on a link or provide some information. Again, the basis is
    the recipient’s greed.


    As a penetration tester, it is often a good idea to send out some phishing emails
    to certain employees in the target company. The only way to see if the staff at
    a company will resist phishing emails is to send some.


    Social engineering is also sometimes used to physically access the target facilities.
    One common technique is to feign some minor injury, perhaps using crutches, and
    then stand in front of an entrance that requires a key card, or some similar object.
    Pretend to be searching for the key card in your pocket, and be unsteady (remember
    the crutches). It is reasonably likely that someone will let you into the building.


    # DoS


    Denial of service is any attack that attempts to overload a system so that it
    cannot respond to legitimate requests for the service. There are many, well-known,
    denial of service attacks. In this section, we will first review the more widely
    known variations of DoS, then we will look at some tools that will allow you to
    perform DoS attacks during your penetration test.


    A word of caution: By definition, a DoS attack will take a service offline. You
    should never use this during normal business hours. You will disrupt the business
    you are trying to test. It is best to perform DoS testing on a backup system,
    rather than the live system. If you must test the live system, then the date and
    time must be carefully selected to cause the least possible disruption to the
    business. That will vary depending on the business. If you intend to test the
    web server of a pizza delivery company, then Monday morning around 2 a.m. is a
    good choice. This gives you plenty of time to correct any problems before peak
    business hours. On the other hand, if the test is being conducted on a typical
    office that works normal business hours during the work week, then start the test
    Friday night, at the beginning of a long weekend. The idea is that you have time
    for any problems to be corrected, in case your test completely knocks the service
    offline and it cannot be quickly recovered.


    # Well-known DoS Attacks


    I will begin by briefly describing well-known denial of service attacks. This
    will provide you with an understanding of real attacks that attackers have used
    on real systems.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Syn Flood


    Standard network communications requires a three-way handshake for every connection
    between a client and server, as illustrated in Figure 12-8.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_303_0.png)


    FIGURE 12-8 Three-way Handshake.


    The client sends a packet with the SYN (Synchronize) flag switched on. The server
    first allocates resources for the connection, then responds with the SYN and ACK
    (Acknowledgement) flags switched on. The client then completes the connection
    by responding with a packet with the ACK flag turned on.


    A SYN flood works by the client sending a literal flood of SYN packets requesting
    a connection, but never responding to them. The server allocates resources for
    each of these connections, and eventually exhausts those resources. A properly
    configured stateful packet inspection (SPI) firewall will prevent this.


    # Smurf and Fraggle


    A Smurf attack uses a combo of IP spoofing and ICMP to saturate a target network
    with traffic. Smurf consists of three elements: source site, bounce site, and
    target site. The attacker (source site) sends a modified ping to the broadcast
    address of a large network (bounce site). The modified packet contains a source
    address of the target site; everyone at the bounce site replies to the target
    site.


    A fraggle attack is a variation of a Smurf attack where an attacker sends a large
    amount of UDP traffic to ports 7 (echo) and 19 (chargen) to a broadcast address,
    spoofing the intended victim’s source IP address. Configuring the gateway router/firewall
    to disallow incoming broadcast messages will prevent this.


    # DHCP Starvation


    If enough requests are flooded onto the network, the attacker can completely exhaust
    the address space allocated by the DHCP servers for an indefinite period of time.
    There are tools such as Gobbler that will do this for you. Preventing incoming
    DHCP requests, from outside the network, will prevent this.


    # Application Layer DoS


    Application layer denial of service is, as the name suggests, a denial of service
    that targets some network service that operates at the application layer, for
    example, targeting a database.


    # HTTP Post DoS


    An HTTP post DoS attack sends a legitimate HTTP post message. Part of the post
    message is the ‘content-length’. This indicates the size of the message to follow.
    In this attack, the attacker then sends the actual message body at an extremely
    slow rate. The web server is then “hung” waiting for that message to complete.
    For more robust servers, the attacker will need to use multiple HTTP Post DoS
    attacks simultaneously.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# PDoS


    A permanent denial of service (PDoS) is an attack that damages the system so badly
    that the victim machine needs either an operating system reinstall or even new
    hardware. This is sometimes called *phlashing*. This will usually involve a DoS
    attack on the device’s firmware.


    # DDoS


    A distributed denial of service attack is simply a denial of service attack that
    comes from many sources. Often the attacking machines are not even aware they
    are part of an attack. Those machines may have been infected with malware that
    launches a DDoS attack. Any of the preceding attacks could be used in a DDoS attack.


    # Tools


    For penetration testing, you will use the same tools that the attackers use. There
    are numerous tools available, many as free downloads from the Internet, for executing
    a DoS attack. These tools can be found on the Internet (the specific URL will
    change from time to time), most as free downloads.


    # Low Orbit Ion Cannon


    This is probably the most well-known, and certainly one of the simplest, DoS tools
    anywhere. A simple search of the Internet will show you multiple sites you can
    download this tool from.


    After you launch LOIC, first put the URL or IP address into the target box. Then
    click on the **Lock on** button. You can change settings regarding what method
    to use, the speed, how many threads, and whether or not to wait for a reply. Then
    simply click on the **IMMA CHARGIN MAH LAZER** button and the attack is underway.
    You can see this in Figure 12-9.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_304_0.png)


    FIGURE 12-9 LOIC.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# High Orbit Ion Cannon


    High Orbit Ion Cannon is a bit more advanced than LOIC, but actually simpler to
    run. Click the + button to add targets. A popup window will appear, where you
    put in the URL as well as a few settings as shown in Figure 12-10.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_305_0.png)


    FIGURE 12-10 HOIC Settings.


    Then you can simply click on the FIRE TEH LAZER! button to start the attack.


    # DoSHTTP


    This tool is also simple to use. You select the target, the agent (i.e. what browser
    type to simulate), how many sockets, the requests, then start the flood. You can
    see this in Figure 12-11.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_305_1.png)


    FIGURE 12-11 DoSHTTP.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Summary


    In this chapter, you have learned basic techniques for testing Wi-Fi security.
    This includes setting up your own rogue access device, to see if users can be
    tricked into accessing it. You also learned basic Wi-Fi security settings and
    how to assess those.


    We also covered the essentials of social engineering. This is a common technique
    that many attackers will use. Therefore, it must be a part of your penetration
    test.


    Finally, we discussed denial of service attacks. We began with a brief description
    of many well-known DoS attacks, then we looked at specific tools you can use to
    perform DoS on the networks you are testing.


    # Test Your Skills


    # MULTIPLE CHOICE QUESTIONS


    1. Which of the following is the most basic security measure for a WAP?


    +   A. Change the admin password

    +   B. Use WPA2

    +   C. Use MAC filtering

    +   D. Block unwanted services


    2. What DoS attack depends on sending fake broadcast messages to the router of
    the target’s network?


    +   A. SYN flood

    +   B. PDoS

    +   C. Smurf

    +   D. DDoS


    3. In order to perform a PDoS, you should target which of the following?


    +   A. Database server

    +   B. Web server

    +   C. Application layer

    +   D. Firmware'
  merge: -1
  img_proc: true
- pgno: 307
  md: '4. You have been asked to perform a penetration test of a small university.
    Which of the following would be the best time to attempt a DoS test?


    +   - A. Monday morning very early

    +   - B. Friday evening before a long weekend

    +   - C. Finals week

    +   - D. Registration week


    # PROJECTS


    # PROJECT 1: Denial of service


    Select an isolated Windows machine, preferably one in a lab. Turn on IIS (Windows
    web server) so you have a web server target. This is easy to do:


    If you do not have IIS installed, accessing **Control Panel > Programs > Programs
    & Features** will allow you to add it.


    Then open a browser, and direct it to the IP address of this machine (both computers
    should be on the same network). You will then see the default IIS website.


    Then use any of the DoS tools mentioned in this chapter to attack that website.
    Every few seconds, while the attack is ongoing, refresh the browser and see what
    happens to website response time.


    # PROJECT 2: Wi-Fi


    Set up your computer as a hotspot, and have a partner access it. If you are using
    a Windows computer, you can follow the instructions in this chapter. If you are
    using Linux, then use Wifi-Honey. You may wish to also run a packet sniffer while
    your partner surfs the web through your fake hotspot.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Introduction to Metasploit


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand the fundamentals of Metasploit

    +   - Execute basic Metasploit commands

    +   - Perform scans with Metasploit

    +   - Perform basic exploits with Metasploit


    Metasploit may be the single most popular tool for both hackers and penetration
    testers. For that reason alone, you really cannot be a penetration tester without
    at least a working knowledge of Metasploit. Before diving in deeper, we need to
    cover a few items.


    First, what exactly is Metasploit? Well, to put it simply, it is a framework for
    delivering exploits to the target. You can take a documented vulnerability, find
    an exploit designed for the vulnerability, then deliver it to the target machine.
    Sometimes this is done directly, sending it to the IP address and port. Sometimes,
    with some exploits, Metasploit works as a web server, and you send a link to the
    client. If the client clicks on the link, and their system is vulnerable to that
    attack, you are in. So, it is a very versatile tool. And, as you will see in this
    chapter, it is not hard to learn.


    The second thing to know, however, is that Metasploit is just a tool. It is a
    good tool, but just a tool. Hacking (whatever the motivation or intent) is not
    about a particular tool. It is about exploring the target and learning about it.
    I mention this because I routinely encounter people who tout Metasploit as being
    the be-all and end-all of hacking. They would have you believe that if you simply
    have Metasploit at your disposal, the world is yours for the taking. Not only
    is that not true, it is so far from the truth as to be shocking. I wonder if such
    people have ever used Metasploit on a real system, or only in classroom labs.
    Because the truth is, if you do everything right, but the target machine is not
    vulnerable to that'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'particular exploit, then you won’t get in. If a machine is thoroughly patched,
    you probably won’t get in. But from a penetration tester point of view, that is
    exactly the sort of thing you wish to test!


    This brings us to the third thing. How will you practice Metasploit? You will
    need at least two things:


    +   - An attack machine with Kali Linux

    +   - At least one target


    Fortunately, you can put both as virtual machines and have one VM attack the other.
    But what type of machine should you have for the target? There are two approaches
    to this. The first is to get a realistic modern target. A patched Windows 10 machine
    (or whatever version is current while you are reading this) is very realistic,
    but the truth is most of what you try will not work. If you want to guarantee
    that some if not all of the attacks described in this book work, then get a version
    of Windows 7 without service pack 1. There are a few places for you to look for
    a target machine:


    +   - Microsoft provides virtual machines for testing, which you can find at https://developer.microsoft.com/en-us/microsoft-edge/tools/vms/.
    However, all of their Windows 7 VMs do have service pack 1 and you cannot remove
    it. This may mean some exploits in this chapter won’t work.

    +   - If you have an MSDN subscription (and that is free), you may be able to
    get a Windows 7 iso from there.

    +   - There are many websites that sell old versions of Windows. But make sure
    you get one without service pack 1 if you want to guarantee the attacks will work.

    +   - People often sell old versions of Windows on places like eBay. Again, just
    check to make certain it is without service pack 1, to guarantee you will succeed
    in these exploits.


    Now, it may seem a bit artificial to have you try a Windows 7 machine with no
    service packs. But this chapter is meant for Metasploit beginners. It is meant
    for you to succeed. But do be aware, the ease with which you get into these machines
    will not be repeated when you move to real machines that probably are patched
    (or at least they should be!).


    Setting up your virtual machine is a bit different depending on whether your target
    is on a different computer or on a different virtual machine on the same host:


    +   - Installing *as Live USB with persistence*. This option will install very
    easily; however, the VM may not be on the same subnet as the host. The VM should
    still be able to ping the host. If you have trouble pinging host to VM and VM
    to host, then manually set the IP address to be on the same subnet as the host.

    +   - Set the VM network to **bridge** and manually set a static IP address with
    **ifconfig eth0** 191.168.0.XXX (or any range you want to use, as long as all
    machines involved are in the same range).'
  merge: -1
  img_proc: true
- pgno: 310
  md: "**Note**\n\nIf you are going from Kali VM to victim VM on the same host, then\
    \ set to **host only adapter** and **allow all.**\n\n# Background on Metasploit\n\
    \nMetasploit was first created in 2003 and was written in Perl. It was developed\
    \ by a man named H. D. Moore. Moore is a well-known security expert and hacker.\
    \ In 2007, it was rewritten in Ruby. In 2009, Metasploit was acquired by the company\
    \ Rapid7, who now handles all maintenance and distribution of Metasploit.\n\n\
    Really, much of Metasploit can be divided into four types of objects you will\
    \ work with:\n\n+   - **Exploits:** These are pieces of code that will attack\
    \ a specific vulnerability. Put another way, exploits are vulnerability specific.\n\
    +   - **Payload:** This is the code you actually send to the target. It is what\
    \ actually does the dirty work on that target machine, once the exploit gets you\
    \ in.\n+   - **Auxiliary:** These modules provide some extra functionality. For\
    \ example, scanning.\n+   - **Encoders:** These embed exploits into other files\
    \ like PDF, AVI, etc. We will see those in the next chapter.\n\nThis may make\
    \ more sense with an explanation from Rapid7 (the people who distribute Metasploit):\n\
    \n> A vulnerability is a security hole in a piece of software, hardware or operating\
    \ system that provides a potential angle to attack the system. A vulnerability\
    \ can be as simple as weak passwords or as complex as buffer overflows or SQL\
    \ injection vulnerabilities.\n> \n> To take advantage of a vulnerability, you\
    \ often need an exploit, a small and highly specialized computer program whose\
    \ only reason for being is to take advantage of a specific vulnerability and to\
    \ provide access to a computer system. Exploits often deliver a payload to the\
    \ target system to grant the attacker access to the system.\n> \n> The Metasploit\
    \ Project hosts the world’s largest public database of quality-assured exploits.\
    \ Have a look at our exploit database—it’s right here on the site.\n> \n> (https://kb.help.rapid7.com/v1.0/docs/penetration-testing)\n\
    \n# Getting Started with Metasploit\n\nOkay, you have read enough background,\
    \ you want to see Metasploit! Well, let us not delay any longer. You have two\
    \ options in Kali Linux. The first is to just use the desktop GUI and click on\
    \ the Metasploit icon. You can see how to find this in Figure 13-1."
  merge: -1
  img_proc: true
