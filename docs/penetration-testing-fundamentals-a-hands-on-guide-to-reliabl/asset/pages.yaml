- pgno: 183
  md: 'These are a few basic things you can do with SQL injection; however, it is
    far more interesting to attempt to leverage the database to get access to the
    underlying operating system. You should be aware that the deeper you go into SQL
    injection, the more tedious the process will become. The initial login is relatively
    straightforward, and it will either work or it won’t. It takes very little time
    to determine if it will work. More advanced techniques will involve a great deal
    of effort and time. Penetration testers often develop a fondness for heavily caffeinated
    beverages for just this reason.


    The following are some methods of interacting with the underlying operating system
    that the database is installed on.


    For a MySQL database running on Linux, you can try this command, added to your
    SQL injection login:


    ```

    '' union select 1, (load_file(''/etc/passwd'')),1,1,1;

    ```


    This command attempts to load the password hash file. You can then use that to
    execute a rainbow table attack and possibly get passwords for the users on that
    server.


    With MS SQL Server, you can also start services using stored procedures:


    ```

    ''; exec master..xp_servicecontrol ''start'',''Remote Registry''

    ```


    This one is particularly interesting. The ability to start or stop a service is
    very powerful. And it depends on the privileges of the database service itself.
    If it is properly configured, and running with least privileges, some of these
    may not work.


    Perhaps you are interested in using the command prompt/shell? If the target is
    SQL Server, there is certainly a way to do this. Let us start with this one:


    ```

    ''; exec xp_cmdshell ''net user /add jsmith Pass123''--

    ''; exec xp_cmdshell ''net localgroup /add administrators jsmith''

    ```


    This executes the net user scripting (recall Windows commands from Chapter 6,
    “Hacking Windows”) and creates a user named jsmith and adds him to the administrators
    group. This is just one illustration. In fact, if xp_cmdshell works, you are only
    limited by two things. The first is the privileges of the database service itself
    (remember least privileges is the most fundamental concept in security). The second
    is your knowledge of the Windows command prompt.


    You should also be aware that you can put multiple queries together. Use a semicolon
    as command separator, for example:


    ```

    '' or ''1'' =''1''; select * from someothertable

    ```


    # Avoiding Countermeasures


    Many intrusion detection systems and web application firewalls are set to detect
    SQL injection symbols. One way to get around that is to use alternative symbols
    for SQL symbols. For example, inject without quotes (string = “%”):


    ```

    '' or username like char(37);

    ```'
  merge: -1
