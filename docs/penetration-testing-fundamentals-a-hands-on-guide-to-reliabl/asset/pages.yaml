- pgno: 352
  md: '# Basic Ruby Scripting


    By convention, Ruby source files have the .rb file extension. In Microsoft Windows,
    Ruby source files sometimes end with .rbw, as in myfile.rbw. The Ruby coding convention
    states that file/directory name is lowercase of class/module name with .rb extension.
    For example, Foo class has name foo.rbz.


    # A First Script


    Yes, I will follow the time-honored tradition of teaching programming by starting
    with the “Hello World” program. Most often you will work in some text editor,
    then run the script with Ruby. So, use any text editor you like and type in the
    following:


    ```

    # hello.rb

    puts ''Hello World''

    ```


    The # denotes a comment. Now you can save this file to any location you wish.
    For you Windows users with Notepad, remember to change the file type to All Files
    so that Notepad does not add .txt at the end. Save the file as hello.rb as shown
    in Figure 15-3.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_352_0.png)


    FIGURE 15-3 Saving Your File.


    Now you can run this by simply navigating to that directory and typing:


    ```

    ruby hello.rb

    ```


    This is shown in Figure 15-4.


    So now you have two ways to write Ruby code. You can write directly in the interactive
    Ruby environment, or you can write your code in a text file, save it, then execute
    it.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_353_0.png)


    FIGURE 15-4 Running Your File.


    You might have noticed the word puts in the brief script shown at the beginning
    of this section. This means to display something to the screen. If you then wish
    to get whatever the user types, you use gets. We will see this in use later in
    this chapter.


    # Syntax


    Now let’s look at some basic structure. You understand that puts displays something
    to the screen, but let’s move beyond that, and add more syntax to your knowledge
    base.


    # Variables


    There are five types of variables in Ruby. They are Global, Instance, Class, Local,
    and Constants (constants are not truly variables, since by definition they don’t
    vary).


    Global variables are obviously global in scope. When you define them, they begin
    with $. Uninitialized global variables have the value nil, so always give them
    an initial value. Here is an example:


    ```

    $last_name = "doe"

    ```


    Instances variables are defined with an @. They also will have a nil value if
    not initialized. Here is an example:


    ```

    @last_name = "doe"

    ```


    Class variables exist within a class (obviously) and begin with @@. You cannot
    use a class variable without initializing it. Here is an example:


    ```

    @@last_name = "doe"

    ```


    Local variables exist within the scope of some containing code such as an if statement
    or loop, or in a function. They begin with a lowercase letter or _; for example:


    ```

    _last_name = "doe";

    ```


    Constants begin with an uppercase letter, and many programmers like to use all
    uppercase for constants. Here is an example:


    ```

    MAXVALUE = 10

    ```'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'You may have noticed that in Ruby, unlike many other languages (C, C++, Java,
    C#, etc.), each statement does not need to end with a semicolon.


    Variables can also be arrays. Arrays are simple to create in Ruby. Consider the
    following two array declarations:


    ```

    a = [ 1, 2, 3, 5, 8, 13, 21 ]

    b = [ ''tom'', ''juan'', ''fares'' ]

    ```


    The first declares an array named a. That array contains the first few numbers
    of the famed Fibonacci sequence. The second contains male first names, named b.
    As you can see, it is fairly easy to create an array of either numbers or strings.


    # Operators


    Ruby, like all programming and scripting languages, supports the basic mathematical
    operations of +, -, *, / (add, subtract, multiply, and divide).


    There are also additional operators supported by Ruby, and summarized here:


    +   - % is the modulus operator and simply means to divide two numbers and only
    report the remainder. Yes, this is an oversimplification of modulus mathematics,
    but is sufficient for programming.

    +   - ** is how Ruby performs exponents. So, if you have a variable a, and type
    a**3, that means “a cubed” or a³.

    +   - == compares two variables to determine if they are the same. Like many other
    programming/scripting languages, the single = assigns, and the double == evaluates.

    +   - != checks to see if two values are not equal.

    +   - < is the traditional less-than operator. And of course, > means greater
    than, <= means less than or equal to, and >= means greater than or equal to.


    You can also combine operators. For example, += means to add two numbers and produce
    the output. Here is what that looks like:


    ```

    a += 2

    ```


    This is a shorthand way of writing a = a+2.


    Here is a basic Ruby script that will perform some essential math operations:


    ```

    # demo basic variables and math


    #a global variable initialized to 0

    anumber=0


    # prompt the user to enter a number

    ```'
  merge: -1
  img_proc: true
- pgno: 355
  md: '```

    puts ''enter a number to cube''


    #put their number into the variable

    anumber = gets.to_i


    #compute and display the answer

    answer = 0


    answer = anumber**3


    puts "#{anumber} cubed is #{answer}"

    ```


    When you execute this, you will see what is depicted in Figure 15-5.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_355_0.png)


    FIGURE 15-5 Basic Math in Ruby.


    There are several items in this basic script that need to be understood. While
    this is a very elementary script, if you fully understand it, you will be on your
    way to understanding basic Ruby scripting.


    Let us begin by examining the variable declarations:


    ```

    anumber = 0

    ```


    Notice we did not use the symbols previously discussed. That is because this very
    simple program has no classes or functions, so there are not different types of
    variables (instance, local, class, etc.).


    Next you see we use the puts statement to prompt the user:


    ```

    puts ''enter a number to cube''

    ```


    But now you see something new—how to get the input from the user and place that
    in a variable:


    ```

    anumber = gets.to_i

    ```


    If this had been a string, we would just have wrote gets. But because we are looking
    for an integer, it is gets.to_i (convert to integer).'
