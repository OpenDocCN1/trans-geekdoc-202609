- pgno: 248
  md: '# /root


    The /root directory is the home directory for the root user. As the administrator,
    this is a rather important directory for you. This is where your files will be
    stored. This is usually not accessible to other users on the system. It is basically
    just a standard user home directory, except that it is specifically for the root
    user.


    # /bin


    The /bin directory holds binary or compiled files. For this reason, you will find
    many programs in this directory. Even many shell commands are stored in this directory,
    such as **ls** and **cat**. Keep in mind that shell commands are, after all, simply
    programs you invoke from the shell. We will be looking at various shell commands
    throughout this book. You should keep in mind that some binary files are in other
    directories.


    # /sbin


    This directory is similar to /bin, but it contains binary files that are not intended
    for the average computer user. For example, the **mke2fs** command is in this
    directory The **mke2fs** program is a file system utility. Because these are specialized
    binaries intended for the root user or super user, this directory is not usually
    in the default path of normal users. This directory will be in the root user’s
    default path, however, which means that most users who log on cannot access /sbin,
    or any commands stored therein.


    # /etc


    The /etc folder contains configuration files. Most applications require some configuration
    when they start up. Even boot loaders like LILO and Grub have configuration files.
    Those configuration files are found in /etc. This directory has several subdirectories,
    each containing a different type of configuration file. A few of the more important
    subdirectories are listed in this section.


    # /etc/passwd


    This is essentially a text-based database of users and information about their
    permissions. This clearly has interest for a penetration tester. Each user’s entry
    will have several fields:


    +   - **Username field:** This field denotes the User (or User Account) Name.

    +   - **Password field:** Second field is the Password field, not containing the
    actual password though. An ‘x’ in this field denotes the password is hashed and
    saved in the /etc/shadow file.

    +   - **UID field:** Whenever a new user account is created, it is assigned a
    user ID, or UID.

    +   - **GID field:** Similar to the UID field, specifies which group the user
    belongs to, the group details being present in the /etc/group file.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '+   - **Comment/Description/User Info field:** As the name suggests, a textual
    description of this user.

    +   - **User Home Directory field:** This is the directory this user has as a
    home directory.

    +   - **Shell field:** The user’s shell, usually /bin/bash or simply bash shell.


    # /etc/shadow


    This directory probably is the most interesting place for a penetration tester
    to look. While many resources refer to the password as being encrypted, it is
    most likely to be hashed. This will contain that hash. Other information in this
    directory include usernames (to go with passwords), date password last changed,
    number of days before a password change is required, and related information.


    # /etc/group


    Just as etc/passwd keeps user information, /etc/group keeps group information.
    So all the data regarding all the groups is kept here. It also is not a subdirectory
    but really a file.


    # /etc/inittab


    Here is where you change the configuration file for init, a very important configuration
    application. The inittab file describes which processes are started at bootup
    and during normal operation. The /etc/init program starts during the last phase
    of kernel initialization and has a PID of 1. The init process starts all other
    processes. The inittab file is the configuration file for the init program. This
    file can be edited with any standard text editor.


    The inittab file has a number of entries. Each entry is defined by four fields,
    separated by colons. Those fields include the following:


    +   - **label:** A unique identification label of up to four characters

    +   - **run_level:** The init level at which the entry is executed

    +   - **action:a:** A keyword indicating the action that init is to take on the
    process

    +   - **process:** The process init executes upon entering the specified run level


    When the system first boots, the inittab file is scanned for keywords. These keywords
    tell init how to deal with that given configuration command in inittab:


    +   - **boot:** Starts the process and continues to the next entry without waiting
    for the process to complete. When the process dies, init does not restart the
    process.

    +   - **bootwait:** Starts the process once and waits for it to terminate before
    going on to the next inittab entry.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '+   - **initdefault:** Determines which run level to enter initially, using
    the highest number in the run_level field. If there is no initdefault entry in
    inittab, then init requests an initial run level from the user at boot time.

    +   - **sysinit:** Starts the process the first time init reads the table and
    waits for it to terminate before going on to the next inittab entry.


    Here is an example of a very simple inittab file:


    ```

    # inittab for linux

    id:1:initdefault:

    rc::bootwait:/etc/rc

    1:1:respawn:/etc/getty 9600 tty1

    2:1:respawn:/etc/getty 9600 tty2

    3:1:respawn:/etc/getty 9600 tty3

    ```


    # /etc/motd


    The motd is an acronym for message of the day. That is exactly what this directory
    contains. You may have noticed that after logon you get a brief message, which
    is called the message of the day, and is found in this directory. This message
    is often used by system administrators to send information to end users. It is
    an excellent place to put announcements or security reminders. This is also a
    very cool place to leave a message as part of your pen testing: something like,
    “Well I see your security needs help, since I am in your server.”


    # /dev


    This directory contains device files. Device files are really interfaces to devices.
    Storage devices, sound devices—in fact, all of your devices—should have a device
    file located in this directory. There are some naming conventions that can help
    you navigate this directory. For example, all hard drives start with hd, floppy
    drives start with fd, and CD drives start with cd. So, the main hard drive might
    be named /dev/hd0. The floppy drive would be called /dev/fd0.


    This directory has a number of files, each representing a device. Obviously, your
    system may not have all of these, but here is a list of the ones that might be
    present on a Linux system. The most important are listed here:


    +   - **dev/dsp Digital Signal Processor:** The interface between sound software
    and your sound card.

    +   - **/dev/fd0:** The first floppy drive.

    +   - **/dev/fb0:** The first frame buffer device. A frame buffer is an abstraction
    layer between software and graphics hardware.

    +   - **/dev/hda:** The master IDE drive on the primary IDE controller.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '+   - **/dev/hdb:** The slave drive on the primary controller.

    +   - **/dev/hdc:** The master IDE drive on the secondary IDE controller.

    +   - **/dev/hdd:** The slave drive on the secondary IDE controller.

    +   - **/dev/pda:** Parallel port IDE disks.


    # /boot


    This boot directory contains those files critical for booting. Your boot loader
    (whether it is LILO or GRUB) will look in this directory. It is a common practice
    to have kernel images kept in this directory.


    # /usr


    As the name suggests, this directory contains all the subdirectories, and thus
    all the files, for all users on the system. On a Linux machine with many users,
    this can quickly become the largest directory on the computer. This directory
    also contains documentation, such as the man pages. Built into Linux is a manual
    of all the various shell commands, directories, etc. Those are referred to as
    man pages (i.e. manual pages), which I will be referring to many times in this
    book.


    This directory has a number of important subdirectories, which are listed here:


    +   - **/usr/X11R6:** This directory contains the X Window System.

    +   - **/usr/bin:** This directory holds most of the user commands. However, some
    commands are in /bin or in /usr/local/bin.

    +   - **/usr/sbin:** This directory stores system administration commands that
    are not needed on the root file system, /usr/share/man, the man pages that are
    so often referenced to look up Linux commands.

    +   - **/usr/share/info:** This directory holds GNU information documents.

    +   - **/usr/share/doc:** This directory contains a great deal of general documentation.

    +   - **/usr/include:** This directory has the header files used in the C programming
    language. The same people who created Unix also created the C programming language.
    And C has been deeply intertwined with Unix and most Unix-like systems, including
    Linux.

    +   - **/usr/lib:** Lib is short for *library*. This directory contains data files
    for programs and subsystems, including some configuration files.

    +   - **/usr/local:** This directory holds locally installed software and other
    files. Distributions may not install anything in here.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# /var


    The /var directory contains data that is changed when the system is running normally.
    The name var stems from variable, as in the contents vary.


    A few of the more important subdirectories are listed here:


    +   - **/var/cache/man:** This is a cache for man pages that are formatted on
    demand.

    +   - **/var/games:** Any variable data belonging to games in /usr should be placed
    here.

    +   - **/var/lib:** This is the place to store miscellaneous files that change
    while the system is running normally.

    +   - **/var/local:** This directory holds variable data for programs that are
    installed in /usr/local.

    +   - **/var/lock:** This is a particularly important directory for the internal
    operation of programs running on Linux. This directory stores lock files. Many
    programs will create a lock file in /var/lock to indicate that they are using
    a particular device or file. This allows other programs to see that device is
    being used and not attempt to use it.

    +   - **var/log:** This is another very important directory, which contains log
    files from various programs. We will be returning to this directory several times
    throughout this book.

    +   - **/var/mail:** This directory contains mailbox files, if your server is
    an email server.

    +   - **/var/run:** This directory is a bit different. It contains current information
    about the system, but it is information that is only valid until the system is
    next booted. For example, it contains information about currently logged-in users.

    +   - **var/spool:** This directory contains the print queue, so it can be very
    important when troubleshooting printer problems.


    # /proc


    The /proc directory is different from any other directory in that it is not really
    stored on your hard disk. It is created in memory and keeps information about
    currently running processes.


    A few examples are listed here:


    +   - **/proc/1:** This is information about currently running process 1. There
    will also be a /proc/2, /proc/3, and so on.

    +   - **/proc/cpuinfo:** This is where you find information about your CPU, such
    as its type, make, model, and performance.

    +   - **/proc/dma:** This contains information about currently used DMA (Direct
    Memory Access) channels.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '+   - **/proc/interrupts:** This contains data about which interrupts are in
    use.

    +   - **/proc/ioports:** This contains information about I/O ports currently in
    use.

    +   - **/proc/kcore:** In this directory, you will find an image of the physical
    memory of the system. This allows you to see exactly what is going on in the physical
    memory at any given point in time.

    +   - **/proc/meminfo:** This directory has information about current memory use,
    both physical and SWAP file.

    +   - **/proc/kmsg:** Here you will find messages output from the kernel.

    +   - **/proc/modules:** This contains a list of which kernel modules are loaded
    at the moment.

    +   - **/proc/stat:** This contains a number of interesting statistics about the
    system, such as how many page faults have occurred since the last boot.

    +   - **/proc/uptime:** The time the system has been up.

    +   - **/proc/version:** The kernel version.


    # Graphical User Interface


    As mentioned earlier in this chapter, the GUI is separate from the actual operating
    system. And with Linux this actually means you have a choice of GUIs to use. Many
    people refer to the specific GUI you use as your desktop. In fact, some Linux
    distribution installations ask you to select which desktop you wish, meaning which
    GUI. In the Linux world, the shell is king, but you should at least know about
    the two most widely used GUIs.


    # GNOME


    There is no doubt that Gnome (https://www.gnome.org/) is one of the two most popular
    GUIs for Linux. Most Linux distributions include GNOME, or a choice between GNOME
    and some other desktop environment. In fact, the popular Ubuntu distribution only
    ships with GNOME. GNOME is built on GTK+, which is a cross-platform toolkit for
    creating GUIs. The name “GNOME” is an acronym of GNU Network Object Model Environment.


    # KDE


    Along with GNOME, KDE (https://www.kde.org/) is one of the two most popular Linux
    GUIs available. Most Linux distributions will ship with either KDE or GNOME, or
    both. For example, the Kubuntu distribution is essentially Ubuntu with KDE. KDE
    was founded in 1996 by Matthias Ettrich. At the time of KDE’s creation, Ettrich
    was, like Linus Torvalds, a computer science student. The name KDE was intended
    as a word play on the existing Common Desktop Environment (CDE), available for'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Unix systems. Now the K stands for nothing and the acronym is K Desktop Environment.
    KDE is built on the Qt framework, a multiplatform GUI framework written in C++.


    KDE includes a number of useful applications. A few are listed here:


    +   - **KBookOCR:** An object character recognition application for scanning in
    documents into an editable form

    +   - **KWord:** A full-featured word processor

    +   - **KSpread:** A spreadsheet application

    +   - **Kexid:** A database creator

    +   - **Dolphin:** A file manager

    +   - **Kfrb:** A desktop sharing program

    +   - **Konqueror:** A web browser


    These are just a few of the applications that are part of the KDE environment.


    You should note that KDE has begun calling the desktop environment “The Plasma
