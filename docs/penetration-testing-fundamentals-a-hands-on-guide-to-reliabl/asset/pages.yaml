- pgno: 176
  md: '# Chapter 7


    # Web Hacking


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand the essentials of how websites work

    +   - Understand penetration testing of websites

    +   - Understand various website attacks


    The most exposed part of any network is the website. The website, therefore, makes
    an attractive target for attackers. In any penetration test, you should test the
    website. In later chapters, we will explore vulnerability scanners for web servers
    and web pages. In this chapter we will examine specific attacks and a few tools
    that can help automate such attacks.


    # Web Technology


    It is first important that you have a working knowledge of how websites work.
    Much of this should be review for many readers, but if you have any gaps in your
    knowledge, this section should help fill those in.


    Web traffic uses the Hypertext Transfer Protocol (HTTP). That protocol normally
    operates on port 80. If it is encrypted with SSL/TLS, then it will operate on
    port 443. The primary means of communication is via messages. These are the default
    ports, but you can use any port you wish.


    Table 7-1 provides a summary of the basic HTTP messages a web page might send.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# TABLE 7-1 Basic HTTP Messages Sent by a Web Page


    | Command | Purpose |

    |---|---|

    | GET | Request to read a web page |

    | HEAD | Request to read a web page |

    | PUT | Request to write a web page |

    | POST | Request to append to a page |

    | DELETE | Remove the web page |

    | LINK | Connects two existing resources |

    | UNLINK | Breaks an existing connection between two resources |


    The most common are GET, HEAD, PUT, and POST. In fact, you might see only those
    four during most of your analysis of web traffic. LINK and UNLINK are a lot less
    common. You should know that the GET command actually is the server getting information.
    So it is very much like the POST command. The differences between the two are
    as follows:


    +   - GET requests can be cached; POST requests are never cached.

    +   - GET requests remain in the browser history; POST requests do not remain
    in the browser history.

    +   - GET requests can be bookmarked; POST requests cannot be bookmarked.

    +   - GET requests should never be used when dealing with sensitive data.

    +   - GET requests have length restrictions; POST requests have no restrictions
    on data length.


    The response codes are just as important. You have probably seen “Error 404 file
    not found.” But you may not be aware that there are a host of messages going back
    and forth, most of which you don’t see, as outlined in Table 7-2.


    # TABLE 7-2 Web Server/Browser Messages Transparent to the User


    | Message Range | Meaning |

    |---|---|

    | 100–199 | These are just informational. The server is telling your browser some
    information, most of which will never be displayed to the user. For example, when
    you switch from http to https, a 101 message goes to the browser telling it that
    the protocol is changing. |

    | 200–299 | These are basically “OK” messages, meaning that whatever the browser
    requested, the server successfully processed. Your basic HTTP messages like POST,
    GET, HEAD, etc. should, if everything is working properly, get a 200 code in response.
    |

    | 300–399 | These are redirect messages telling the browser to go to another URL.
    For example, 301 means that the requested resource has permanently moved to a
    new URL, but the message code 307 indicates the move is temporary. |'
  merge: -1
  img_proc: true
- pgno: 178
  md: '| Message Range | Meaning |

    |---|---|

    | 400–499 | These are client errors, and the ones most often shown to the end
    user. This might seem odd since, for example, 404 file not found means that the
    server could not find the file you asked for. However, the issue is that the server
    functioned properly, just that the file does not exist. Therefore, the client
    request was in error. |

    | 500–599 | These are server-side errors. For example, 503 means the service requested
    is down, possibly overloaded. You will see this error frequently in denial-of-service
    (DoS) attacks. |


    These basic messages are sent from the web server to the browser. Most of them
    are never seen by the end user.


    These error messages help you gather information. In Chapter 4 we discussed reconnaissance.
    With web pages we can take that one step further. The goal is to identify the
    web server and the programming languages used. This process is called fingerprinting.
    One common method that skilled hackers use is to induce error messages. If you
    can enter incorrect input, you may get information from the error message. For
    example, if you get back an error message that has “JDBC” in it, then that is
    Java Database Connectivity, and that means the code is written in Java. The key
    to good fingerprinting is to know a bit about programming (web programming) and
    web servers.


    # Specific Attacks on Websites


    In this section, we will look at some of the most common attacks. These are items
    that you should definitely test a website for. Most of these can be tested manually.
    Later in this chapter we will examine a few tools that can assist you in automating
    the testing process.


    # SQL Script Injection


    This may be the most popular attack on websites. In recent years, more websites
    have taken steps to ameliorate the dangers of this attack; unfortunately, all
    too many websites are susceptible. This attack is based on passing Structured
    Query Language (SQL) commands to a web application and getting the website to
    execute them.


    Before we can discuss SQL injection, we must talk about SQL and relational databases.
    This should be a review for most readers. Relational databases are based on relations
    between various tables. The structure includes tables, primary and foreign keys,
    and relations. A basic description can be summarized with the following points:


    +   - Each row represents a single entity.

    +   - Each column represents a single attribute.

    +   - Each record is identified by a unique number called a primary key.

    +   - Tables are related by foreign keys. A foreign key is a primary key in another
    table.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'You can see these relations in Figure 7-1.


    | PK | LNAME | FNAME | JobCode | Hire Date |

    | 1 | Smith | Jane | 2 | 1/10/2010 |

    | 2 | Perez | Juan | 2 | 1/14/2011 |

    | 3 | Kent | Clark | 1 | 3/2/2005 |

    | 4 | Euler | Leonard | 3 | 3/5/2009 |

    | 5 | Plank | Max | 3 | 4/2/2012 |


    | PK | Job Name | Min Edu. | Min Salary | Max Salary |

    | 1 | Super Hero | None | 100,000 | 1,000,000 |

    | 2 | Programmer | BA/BS | 70,000 | 95,000 |

    | 3 | Math/Scientist | Ph.D. | 80,000 | 110,000 |

    | 4 | Manager | BA/BS | 140,000 | 220,000 |


    FIGURE 7-1 Relational Database Structure.


    All relational databases use SQL. SQL uses commands such as SELECT, UPDATE, DELETE,
    INSERT, WHERE, and others. At least the basic queries are very easy to understand
    and interpret.


    # The Most Basic SQL Injection


    The way the most basic SQL injection works is this. Many websites/applications
    have a page where users enter their username and password. That username and password
    will have to be checked against some database to see if they are valid. Regardless
    of the type of database (Oracle, SQL Server, MySQL), all databases speak SQL.
    SQL looks and functions a great deal like English. For example, to check a username
    and password, you might want to query the database and see if there is any entry
    in the users table that matches that username and password that was entered. If
    there is, then you have a match. The SQL statement might look something like this:


    ```

    "SELECT * FROM tblUsers WHERE USERNAME = ''jdoe'' AND PASSWORD = ''letmein''"

    ```


    The problem with this, while it is valid SQL, is that we have hard coded the username
    and password. For a real website, we would have to take whatever the user entered
    into the username field and password field and check that. This can be easily
    done (regardless of what programming or scripting language the website is programmed
    in). It would look something like this:


    ```

    String sSQL = "SELECT * FROM tblUSERS WHERE UserName '' " + txtUserName.text +
    " '' AND Password = '' " + txtPassword.text + " '' "

    ```'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Notice the extra '' in bold above. This is done so that whatever the user types
    in for username and password will each be within single quotes, contained in the
    larger SQL statement, which is in turn in double quotes.


    If you enter username ‘jdoe’ and password ‘letmein’, this code produces the following
    SQL command:


    ```

    "SELECT * FROM tblUsers WHERE USERNAME = ''jdoe'' AND PASSWORD = ''letmein'' "

    ```


    Now if there is a username jdoe in tblUsers, and the password for that user is
    letmein, then this user will be logged on. If not, then an error will occur.


    SQL injection works by putting some SQL into the username and password block that
    is always true. For example, suppose you enter ‘OR ‘1’=’1 into the username and
    password boxes. This may seem like a very odd thing to type in, but let us examine
    what this will cause. This will cause the program to create this query:


    ```

    "SELECT * FROM tblUsers WHERE USERNAME = ''OR ''1''=''1'' AND PASSWORD = ''OR
    ''1''=''1'' "

    ```


    Notice that we start with a single quotation mark ('') before or 1=''1 This is
    to close the open quote the attacker knows must be in the code. And if you see
    '', that essentially is a blank or null. So, what we are telling the database
    is to log us in if the username is blank, or if 1=1, and if the password is blank,
    or if 1=1. If you think about this for a second, you will see that 1 always equals
    1, so this will always be true.


    There is no significance to ‘OR ‘1’=’1; it is simply a statement that will always
    be true. Attackers try other similar statements, such as the following:


    +   - '' or ''a'' =''a

    +   - '' or ''42'' =''42

    +   - '' or (1=1)

    +   - '' or ''spongebob'' = ''spongebob


    The last example is meant both to be facetious and to illustrate that any true
    statement will work. That is one thing that makes it so difficult to block. Rather
    than attempt to block the specific equivalence, a website is defended by filtering
    symbols such as the single quote.


    This is only one example of SQL injection. And in fact, it’s the most simple version
    of SQL injection. There are other methods, but this is the most common. The defense
    against this attack is to filter all user input before processing it. This is
    often referred to as input validation. This prevents an attacker from entering
    SQL commands rather than a username and password. Unfortunately, many sites do
    not filter user input and are still vulnerable to this attack.


    The example given here is the most basic version of SQL injection. You can do
    far more with SQL injection. The attacker is limited only by her knowledge of
    SQL and the target database system.


    Remember that earlier in the text when we first, briefly, mentioned SQL injection,
    it was suggested that filtering input would prevent this. For example, the programmer
    creating the website should write the code to first check for any common SQL injection
    symbols such as the single quote (''), percent sign (%), equal sign (=), or ampersand
    (&), and if those are found, stop processing and log an error.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'This would prevent many SQL injection attacks. There are methods to circumvent
    these security measures, but implementing them would stop many SQL injection attacks.


    There are any number of ways to counter SQL injection. One is for the programmer
    to parameterize the queries. The most simple is to filter all user input for symbols;
    however, all too many web programmers don’t take these measures. Every list of
    OWASP Top 10 website vulnerabilities has included injection. In Chapter 8, “Vulnerability
    Scanning,” we will discuss OWASP and their Top 10 list in some detail.


    # Going One Step Further


    Again, the foregoing is the most basic form of SQL injection. You can expand from
    there. For example, once you have logged in you may wish to enumerate the other
    accounts rather than just the first. Perhaps you have logged in as a user with
    the first name of John. Now you would like to find the next user. Put this in
    the username box (keep password box the same):


    ```

    '' or ''1'' =''1'' and firstname <> ''john

    ```


    or try:


    ```

    '' or ''1'' =''1'' and not firstname != ''john

    ```


    Obviously firstname may not be a name of a column in that database. You might
    have to try various permutations to get one that works. Also remember Microsoft
    Access and SQL Server allow multiword column names with brackets (i.e. [First
    Name]) but MySQL and PostgreSQL do NOT accept brackets. This will be a bit tedious,
    but there are a finite number of possibilities. It is unlikely that the database
    has a column name that is totally unrelated to the “first name.” So you might
    try:


    ```

    '' or ''1'' =''1'' and firstname <> ''john

    '' or ''1'' =''1'' and fname <> ''john

    '' or ''1'' =''1'' and first_name <> ''john

    '' or ''1'' =''1'' and [first_name] <> ''john

    ```


    I think you can see that a dozen or so attempts have a high likelihood of success.
    Of course, this assumes that you have already succeeded with the ` or `1`1` =
    `1`. Once that initial login works, there are so many things you can attempt.
    Let us examine a few of them in the sections that follow.


    # Learning More About the Target


    Once you have logged in successfully, you probably want to know the other columns
    in that table. And you may not wish to go through the tedious guesswork previously
    described. Depending on the database used, there are methods for doing this.


    For MS SQL:


    ```

    SELECT name FROM syscolumns WHERE id = (SELECT id FROM sysobjects WHERE name =
    ''tablename '')

    ```


    For MySQL:


    ```

    show columns from tablename

    ```'
  merge: -1
  img_proc: true
- pgno: 182
  md: "For Oracle:\n\n```\nSELECT * FROM all_tab_columns\nWHERE table_name='tablename'\n\
    ```\n\nYou might also want to know about what user is logged in to the database.\
    \ In other words, what is the database running as? There are several SQL built-in\
    \ scalar functions that will work in most SQL implementations:\n\n```\nuser or\
    \ current_user\nsession_user\nsystem_user\n```\n\nTry each of these to see if\
    \ you can determine the user. This can be useful, particularly if the person who\
    \ set up the database did not obey the concept of least privileges.\n\n# More\
    \ Advanced SQL Injection\n\nYou can also create a new account. This is useful\
    \ so that you can log back in later, directly, without having to go through the\
    \ process of SQL injection. It is also a very clear indicator that your penetration\
    \ test was successful. You can demonstrate to the website owner that you not only\
    \ penetrated his or her website, but even were able to modify the underlying database.\
    \ The exact method is different depending on the database. Here are some examples.\n\
    \nFor Microsoft SQL Server, you will use two stored procedures. Stored procedures\
    \ are pre-constructed SQL that can be called from and executed. The two in question\
    \ first add a login, and then add that login to the system administrators role:\n\
    \n```\nexec sp_addlogin 'johnsmith', 'mypassword'\nexec sp_addsrvrolemember 'johnsmith',\
    \ 'sysadmin'\n```\n\nMicrosoft Access is even easier; just issue the CREATE USER\
    \ command:\n\n```\nCREATE USER johnsmith IDENTIFIED BY 'mypassword'\n```\n\nFor\
    \ MySQL, the issue is to insert a user and password into the users table. Here\
    \ is an example:\n\n```\nINSERT INTO mysql.user (user, host, password) VALUES\
    \ ('johnsmith', 'localhost', PASSWORD('mypassword'))\n```\n\nPostgreSQL is similar\
    \ to MySQL. That is not surprising, as both are very popular, open source relational\
    \ databases:\n\n```\nCREATE USER johnsmith WITH PASSWORD 'mypassword'\n```\n\n\
    Oracle requires a bit more complexity, but is relatively straightforward:\n\n\
    ```\nCREATE USER johnsmith IDENTIFIED BY mypassword\n    TEMPORARY TABLESPACE\
    \ temp\n    DEFAULT TABLESPACE users;\nGRANT CONNECT TO johnsmith;\nGRANT RESOURCE\
    \ TO johnsmith;\n```"
  merge: -1
