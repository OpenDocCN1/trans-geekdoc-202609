    # PROJECTS


    While it is not a crime to scan anyone’s network, people tend to find it unfriendly.
    It is best to scan your own home or class lab network. Doing this at work is usually
    not a good idea, unless you have permission from your boss.


    # PROJECT 1: MBSA


    Microsoft Baseline Security Analyzer is not the most robust vulnerability analyzer
    but it does work well in Microsoft environments, and it is free to download at
    https://www.microsoft.com/en-us/download/details.aspx?id=7558.


    Download and install it. Choose Scan a computer (see Figure 8-22), and scan your
    own computer (see Figure 8-23). Address any issues it finds.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_222_0.png)


    FIGURE 8-22 MBSA.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_223_0.png)


    FIGURE 8-23 MBSA Results.


    # PROJECT 2: OWASP ZAP


    In this project, you will actually use OWASP ZAP to find vulnerabilities in a
    website.


    +   1. Download and install OWASP ZAP, available at https://github.com/zaproxy/zaproxy/wiki/Downloads.

    +   2. Launch OWASP ZAP; you can use Windows or Kali Linux.

    +   3. Select a target (you can use www.chuckeasttom.com if you want).

    +   4. Click Attack.

    +   5. Review the results.


    # PROJECT 3: Download Wireshark


    First install Wireshark on your computer. It is a free download from https://www.wireshark.org/.
    Then follow these steps:


    +   1. Configure Wireshark to trap traffic on your network, using promiscuous
    mode (default) with no capture filters.

    +   2. Open your browser and surf to a few sites. Perhaps send an email.

    +   3. When you have about 2,000 packets, stop the capture.'
