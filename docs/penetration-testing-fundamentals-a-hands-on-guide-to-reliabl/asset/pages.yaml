- pgno: 339
  md: '# Cameras


    When I am teaching Metasploit, students always enjoy capturing the web camera
    of the target machine. These commands were mentioned in Chapter 13, but are given
    here with more detail. From a penetration testing perspective, nothing drives
    home the need for security like presenting an executive with a picture taken with
    his own web camera. From an attacker’s perspective, clearly the web camera is
    a powerful attack vector.


    The first step is to simply type in the command


    ```

    webcam_list

    ```


    If there are any web cameras attached to the target, they will be listed. Then
    you can use either


    ```

    webcam_snap

    ```


    or


    ```

    webcam_stream

    ```


    If there is no error, you will have a still shot of the camera with webcam_snap,
    or streaming live video with webcam_stream.


    If the target has a microphone, you can also try:


    ```

    record_mic

    ```


    Each of these commands is very easy—it either will work or will fail; there is
    no troubleshooting. If a command fails, it is possible that the target has a web
    camera or a microphone but it is not properly configured.


    # Key Logger


    You can also log, in real time, what the user on the target system is typing.
    You begin with:


    ```

    keyscan_start

    ```


    Then when done, you type:


    ```

    keyscan_dump

    ```


    Figure 14-9 shows the results.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_339_0.png)


    FIGURE 14-9 Key Logging.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'A variation of this can be done with the following command:


    ```

    use post/windows/capture/keylog_recorder

    ```


    # Other Information


    There are several other commands that will get information from the target machine.
    Each of these may be useful for you to run. A few are listed here:


    +   - **run get_application_list**: This will list all applications installed
    on the target, other than those that came with the operating system. This was
    mentioned in Chapter 13.

    +   - **run post/windows/wlan/wlan_profile**: This will list the complete profile
    for all wireless LANs the target computer has attached to, including the password.

    +   - **clearev**: This is an important command. This will clear the event log.
    From a penetration testing point of view, you may wish to avoid this, as it will
    clear all the logs on the target system.

    +   - **run event_manager -i**: This is a better choice than **clearev**. This
    command lets you interact with the event manager.


    # msfvenom


    msfvenom essentially combines msfpayload and msfencode so that you can encode
    payloads and then send them to the target. It is a powerful tool, and a part of
    Metasploit you should be familiar with. It is used from the shell in Kali, not
    from inside Metasploit. You start by trying **msfvenom -h**, as shown in Figure
    14-10.


