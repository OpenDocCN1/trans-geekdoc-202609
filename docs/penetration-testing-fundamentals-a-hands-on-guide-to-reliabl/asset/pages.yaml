- pgno: 317
  md: '# Scanning with Metasploit


    As you have seen in the early part of this book, scanning the target is an important
    step. If you don’t know much about the target, you will not have much success
    in attempting to breach it. Fortunately, Metasploit supports a large number of
    searches, as described in the sections that follow.


    # SMB Scanner


    Server Message Block (SMB) is used by Windows Active Directory. When you are scanning
    for this, you are checking to see if the target is a Windows computer. The scan
    is easy:


    ```

    use scanner/smb/smb_version

    set RHOSTS 192.168.1.177

    set THREADS 4

    run

    ```


    Of course, you should replace the IP address 192.168.1.177 with the IP address
    of the target you are scanning. You can see the results in Figure 13-9.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_317_0.png)


    FIGURE 13-9 SMB Scanner.


    While this is simple, it has a lot of information in it. So let us go through
    it, one line at a time, so that you fully understand. The first line is


    ```

    use scanner/smb/smb_version

    ```


    You will see lines, much like this, throughout this chapter. This is saying that
    you intend to use a specific module. And it gives the path to that module. Notice
    the first part of the path is scanner. This particular directory has a number
    of scanners you can use. The next line is


    ```

    set RHOSTS 192.168.1.177

    ```


    First notice the RHOSTS. This is the IP address for the remote host(s) you are
    scanning. Some modules will have RHOST, indicating you can only scan one target,
    while others will have RHOSTS, indicating you can scan several targets if you
    wish. Anytime a module has RHOSTS rather than RHOST, you could scan a range of
    IP addresses. Just modify the command to say:


    ```

    set RHOSTS 192.168.1.177 192.168.1.215

    ```'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Then we have:


    ```

    set THREADS 4

    ```


    This is telling Metasploit how many threads to use to run this module. There is
    no specific rule on this, other than don’t select too high a number or your own
    machine’s CPU may not be able to handle it. When in doubt, just go with one thread.
    Finally, we have:


    ```

    run

    ```


    Every module you see in this chapter ends with either run or exploit. This just
    tells Metasploit to go and do whatever you have just set up. If the target does
    not have the service you are scanning for, then Metasploit will simply indicate
    it has completed its scan.


    # SQL Server Scan


    Now let us scan for SQL Servers. If you carefully studied the SMB scan, then the
    commands here will be obvious. You type in:


    ```

    use auxiliary/scanner/mssql/mssql_ping

    set RHOSTS 192.168.1.177

    Set THREADS 1

    Set USE_WINDOWS_AUTHENT false

    run

    ```


    There is only one new item, USE_WINDOWS_AUTHENT false. This is just telling Metasploit
    that you don’t have any login credentials for SQL Server, so don’t attempt to
    log in. Figure 13-10 shows the results.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_318_0.png)


    FIGURE 13-10 SQL Server Scan.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Before we continue on to other scans, let’s do something we have not done so
    far. Let me show you how you can find out the options for these modules yourself,
    rather than simply taking what I tell you. After loading the module with use auxiliary/scanner/mssql/mssql_ping,
    type show options. Metasploit will tell you what that module’s options are, as
    well as which ones are required and which are optional. You can see this in Figure
    13-11.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_319_0.png)


    FIGURE 13-11 Viewing a Module’s Options with show options.


    As you are learning Metasploit, I suggest you run show options after every time
    you use any module. Study the options for a moment. At the end of this chapter,
    the goal is that you be basically proficient in Metasploit, not that you have
    simply memorized a handful of commands.


    # SSH Server Scan


    This is a scan to detect Secure Shell (SSH) servers on the target. The commands
    are very similar to what you have already seen:


    ```

    use scanner/ssh/ssh_version

    set RHOSTS 192.168.1.177

    Set THREADS 1

    Set USE_WINDOWS_AUTHENT false

    Run

    ```


    Because all of these commands have already been explained, no further explanation
    is needed. You can see the results in Figure 13-12.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_320_0.png)


    FIGURE 13-12 SSH Scan.


    # Anonymous FTP Servers


    As you might guess, this scans for FTP servers that allow anonymous login. This
    is a significant vulnerability:


    ```

    ```

    use auxiliary/scanner/ftp/anonymous

    set RHOSTS 192.168.1.177

    Set RPORT 21

    Set THREADS 1

    Set USE_WINDOWS_AUTHENT false

    run

    ```

    ```


    You might notice that some scans are in the /scanner/ directory, but many are
    in the /auxiliary/scanner/ directory. Figure 13-13 shows the results of this scan.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_320_1.png)


    FIGURE 13-13 Anonymous FTP Scan.'
