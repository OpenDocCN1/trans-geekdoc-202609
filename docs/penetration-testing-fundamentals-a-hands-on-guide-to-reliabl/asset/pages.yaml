- pgno: 356
  md: "You may see some sources that use gets.chomp for strings. The gets retrieves\
    \ string input with the null terminator on the end (\\n). The gets.chomp removes\
    \ the null terminator.\n\nAs you may guess, since gets.to_i provides integer input,\
    \ yes gets.to_f will provide floating value input.\n\nNext, we see one of the\
    \ math operators used. Here we take the value in anumber and raise it to the third\
    \ power, putting the answer into the variable answer:\n\n```\nanswer = anumber**3\n\
    ```\n\nFinally, we see a modification of the puts statement. To display variables\
    \ to the screen, inside of a string, we put those variables in #{ } blocks:\n\n\
    ```\nputs \"#{anumber} cubed is #{answer}\"\n```\n\nNotice that previously we\
    \ used puts with only single quotes, whereas here we use double quotes. In many\
    \ cases, either will work, but when inserting variables, you should use double\
    \ quotes.\n\n# Conditional Statements\n\nWe often wish to take different courses\
    \ of action depending on some condition. The most common way to do this in most\
    \ programming languages is the if statement. In Ruby the basic structure is:\n\
    \n```\nif somecondition\n  then do this code\nend\n```\n\nFor example, if you\
    \ wish to check if some number is even, you might use the modulus operator to\
    \ determine if the number is odd or even, like this:\n\n```\nif anumber % 2 ==\
    \ 1 then\n  print \"That's an odd number\"\nelse\n  print \"That's an even number\"\
    \nend\n```\n\nNotice that we end with the end statement. This is important. In\
    \ our example we have an if and an else. You can even have nested if statements.\
    \ That is shown in the following sample program:\n\n```\n# demo if statements\n\
    \n#a global variable initialized to 0\nage=0\n\n# prompt the user to enter age\n\
    puts 'enter your age'\n\n#put their number into the variable\nage= gets.to_i\n\
    puts \"your age is #{age}\"\n```"
  merge: -1
  img_proc: true
- pgno: 357
  md: "```\nif age <15\n    puts \"you are too young to drive\"\nelse\n    if age\
    \ <21\n        puts \"you are too young to drink alcohol\"\n    else\n       \
    \ if age >65\n            puts \"you are old enough to retire!\"\n        end\n\
    \    end\nend\n```\n\nYou can see the output of this in Figure 15-6.\n\n![](img/fa54c6d61c14db5421f8f63e6d594bb5_357_0.png)\n\
    \nFIGURE 15-6 if Statements.\n\nMost programming languages support this. In Ruby,\
    \ it looks a bit different than in other languages. Here is the previous code,\
    \ rewritten as a case statement:\n\n```\n#a global variable initialized to 0\n\
    age = 0\n# prompt the user to enter age\nputs 'enter your age'\n\n#put their number\
    \ into the variable\nage = gets.to_i\nputs \"your age is #{age}\"\ncase age\n\
    when 1..15\n    puts \"you are too young to drive\"\nwhen 16..20\n    puts \"\
    you are too young to drink\"\nwhen 65..100\n    puts \"you are old enough to retire\"\
    \nelse\n    puts \"hmmm you don't fit any category\"\nend\n```"
