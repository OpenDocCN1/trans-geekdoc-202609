- pgno: 364
  md: '# Chapter 16


    # Write Your Own Metasploit Exploits with Ruby


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Read and understand existing Metasploit exploit source code

    +   - Modify existing Metasploit exploit source code

    +   - Create your own Metasploit exploits


    This chapter is based heavily on the material in Chapter 15, “Introduction to
    Scripting with Ruby”. Make certain that you are completely comfortable with that
    material before proceeding. In this chapter we will first examine the Metasploit
    API that you will need for writing exploits. Then we will look through a few annotated
    current exploits. Finally, we will prepare you to write your own exploits.


    Exploits can be written in other programming languages, but since Metasploit is
    written in Ruby, writing the exploits in Ruby is a logical step. One other popular
    scripting language for writing Metasploit exploits is Python. We will focus on
    writing Ruby exploits in this chapter.


    # The API


    As you are already aware, Ruby is one of the languages you can use to write Metasploit
    exploits, perhaps the most popular language for exploit writing. Unfortunately,
    simply knowing Ruby is not going to be enough. In this section we will briefly
    examine the API. However, as you create your own exploits, you will undoubtedly
    need to refer to the API documentation. That can be found here: https://rapid7.github.io/metasploit-framework/api/.'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'The first step is to install the Metasploit Framework. You probably already
    have done that if you have worked through the last few chapters. If not, you can
    look here: https://github.com/rapid7/metasploit-framework/wiki/Nightly-Installers.


    You may find it useful to perform some of this work with the Interactive Ruby
    Shell (IRB). You can access this from within Metasploit by simply typing **irb**
    as shown in Figure 16-1.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_365_0.png)


    FIGURE 16-1 IRB.


    To exit IRB, just type **exit**. As you work through this chapter, you will see
    a few Metasploit Framework API methods used. However, there are many more than
    we will cover in this chapter. If you would like to see the methods in the API,
    you can type **framework.methods** in the IRB as shown in Figure 16-2.


    From within this interactive shell, you can get the total count of all methods,
    or use **grep** to search for methods of a specific type. Both of these are shown
    in Figure 16-3.


    The Metasploit API will provide you with the access to the Metasploit Framework
    that you need to create your own exploits. You can also get a complete list of
    methods in the framework, along with a description, at http://rapid7.github.io/metasploit-framework/api/.
    But rather than enumerate each method, we will explore these as they come up in
    the examples in this chapter.'
