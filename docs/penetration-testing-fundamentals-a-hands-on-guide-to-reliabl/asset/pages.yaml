- pgno: 265
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_265_0.png)


    FIGURE 10-8 The locate Command.


    # Linux Firewall


    Linux has its own firewall. Actually, the firewall in Linux has evolved over time.
    In this section, we will first discuss what a firewall is (which should be review
    for most readers), then discuss the Linux firewall. In its simplest form, a firewall
    is any software or device configured so that it blocks traffic based on some criteria.
    For example, a firewall might only allow incoming traffic on a specific port,
    or with a certain protocol. And a firewall might block traffic that has certain
    characteristics, or comes from a particular IP address. Most modern operating
    systems include some firewall capabilities, as do most modern routers. In fact
    there are Linux distributions whose sole function is to act as a firewall for
    an entire network.


    Essentially a firewall acts first as a gateway, facilitating access to the network.
    Then it often acts as a proxy server or network address translation (NAT) utility.
    This provides a demarcation point between the network and the outside world. There
    are of course many types of firewalls, and as this is not a book about firewalls,
    we won’t be exploring all of them. However, the two most common general classes
    of firewall are packet filtering and stateful packet inspection, which are described
    here:


    +   - **Packet filtering:** With this type of firewall, each packet’s header is
    examined to see if it matches the rules set up for the firewall. Those rules are
    generally regarding what ports and protocols to allow to enter the network, as
    well as what IP addresses to block from entering. A packet filtering firewall
    is the simplest form of firewall.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '+   - **Stateful packet inspection:** With this approach, the firewall examines
    not only the current packet header but in most cases the packet data as well.
    It also considers the packet in the context of the previous packets that have
    been sent from that same IP address. This is a more robust firewall than the packet
    filtering firewall.


    There are other sorts of firewalls, but these are the two most common. Many firewalls
    that come with operating systems, such as Windows or Linux, are simple packet
    filtering firewalls. More advanced firewalls, such as the Linux distributions
    configured explicitly as a firewall, use stateful packet filtering.


    # Iptables


    The first firewall widely available for Linux was called ipchains. This product
    worked, but had limitations. It was first introduced in version 2.2 of the Linux
    kernel and superseded ipfwadm. Now iptables is the primary firewall for Linux.
    The iptables service was first introduced in Linux kernel 2.4


    On most Linux systems, iptables is installed as /usr/sbin/iptables. However, if
    it was not included in the installation, you can add it later. You can see this
    in Figure 10-9.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_266_0.png)


    FIGURE 10-9 iptables.


    An iptables firewall is made up of three different kinds of object: tables, chains,
    and rules. Each table contains chains of rules. Each chain represents a series
    of rules that define what packets to allow in.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'There are actually three tables and each has some standard rule chains in it.
    You can of course add your own custom rules. The three tables and their standard
    chains are


    +   - **Packet filtering:** This table is the essential part of the firewall.
    It is, obviously, a packet filtering firewall. It has three standard chains: INPUT,
    OUTPUT, and FORWARD. Packets coming into the network are processed by the INPUT
    chain, and traffic sent out from the network is processed by the OUTPUT chain.
    If the firewall system is also acting as a router, only the FORWARD chain applies
    to routed packets.

    +   - **Network address translation:** This table is used for outbound traffic
    that initiates a new connection. It facilitates the process of network address
    translation. The rules in its PREROUTING chain are applied to packets as soon
    as they are received by the firewall for routing, and the POSTROUTING chain for
    packets about to leave after routing. The OUTPUT chain rules are applied to locally
    generated packets for modification before routing.

    +   - **Packet alteration:** This table is used only for specialized packet alteration.
    It is often called the mangle table since it alters, or mangles, packets. It contains
    two standard chains. The first chain is called PREROUTING, and is for modifying
    packets before routing. The other chain, called OUTPUT, is used to modify packets
    generated inside the network. This table may not be even needed for many standard
    firewalls.


    # iptables Configuration


    As you can probably guess, iptables requires some configuration. Let’s take a
    look at some common, basic configuration issues.


    To cause iptables to function as a basic packet filtering firewall, you need these
    commands:


    ```

    iptables -F

    iptables -N block

    iptables -A block -m state --state ESTABLISHED,RELATED -j ACCEPT

    ```


    Obviously, that is the most basic and essential iptables configuration. However,
    here are some others.


    To list the current iptables rules:


    ```

    iptables -L

    ```


    To allow communication on a specific port, in this example using SSH port 22:


    ```

    iptables -A INPUT -p tcp --dport ssh -j ACCEPT

    ```


    Or perhaps you need to allow all incoming web/http traffic:


    ```

    iptables -A INPUT -p tcp --dport 80 -j ACCEPT

    ```


    It is also a good idea to log dropped packets. The following command will do that:


    ```

    iptables -I INPUT 5 -m limit --limit 5/min -j LOG --log-prefix "iptables denied:
    "

    --log-level 7

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'As you can see, there are flags that can be passed to the iptables command.
    The following is a list of the most common flags and what they do:


    +   - **-A:** Append this rule to a rule chain.

    +   - **-L:** List the current filter rules.

    +   - **-p:** The connection protocol used.

    +   - **--dport:** The destination port(s) required for this rule. A single port
    may be given, or a range may be given as start:end.

    +   - **--limit:** The maximum matching rate, given as a number followed by "/second,"
    "/minute," "/hour," or "/day" depending on how often you want the rule to match.
    If this option is not used and -m limit is used, the default is "3/hour."

    +   - **--ctstate:** Define the list of states for the rule to match on.

    +   - **--log-prefix:** When logging, put this text before the log message. Use
    double quotes around the text to use.

    +   - **--log-level:** Log using the specified syslog level.

    +   - **-i:** Only match if the packet is coming in on the specified interface.

    +   - **-v:** Verbose output.

    +   - **-s --source:** address[/mask] source specification.

    +   - **-d --destination:** address[/mask] destination specification.

    +   - **-o --out-interface:** output name[+] network interface name ([+] for wildcard).


    This is not an exhaustive list, but these are the most common flags. When combined
    with the configuration statements given prior to the list, this should be adequate
    for you to get iptables running on your system.


    Some Linux distributions offer additional tools for working with iptables. For
    example, Red Hat includes a GUI configuration tool found at /usr/bin/redhat-config-securitylevel
    that can be used to choose a preconfigured firewall (High, Medium, or no firewall).


    In the next section we will look at a few of the other basic security services.


    # Syslog


    The syslog, or system logging, daemon records system events to log files. Those
    files are typically found in the directory /var/log. The actual name of the daemon
    is klogd. Essentially syslog/klogd is a utility for tracking and logging all system
    messages. Each system message sent to the syslog has'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'two descriptive labels associated with it. The first label describes the function
    of the application that generated this logging event. The second label describes
    the severity of the message. There are eight severity levels, shown in Table 10-1.


    # TABLE 10-1 Syslog Severity Levels


    | Severity Level | Title | Description |

    |---|---|---|

    | 0 | emergencies | System unusable |

    | 1 | alerts | Immediate action required |

    | 2 | critical | Critical condition |

    | 3 | errors | Error conditions |

    | 4 | warnings | Warning conditions |

    | 5 | notifications | Normal but significant conditions |

    | 6 | informational | Informational messages |

    | 7 | debugging | Debugging messages |


    You can see that some severity levels, like level 5, are mundane items and are
    of not urgent concern to an administrator. However, items with severity levels
    0 through 4 should be of concern to any administrator. These messages are typically
    stored in the /var/log/messages file. It is a prudent idea to check this file
    anytime you have a system error. The messages you find here can be an excellent
    first step in troubleshooting your system’s problems. And from a penetration tester
    point of view, these are places to check to see indications of significant breaches.


    If you have multiple servers, then forwarding your system messages to a single
    centralized server is a good security practice. With all servers logging to a
    central syslog server, it becomes easier to track the logs from all servers. Also,
    if an intruder gains access to one of your servers, he or she may wish to cover
    their tracks by removing data from that system’s syslog. By default, syslog doesn’t
    expect to receive messages from remote clients, but you can easily configure your
    system to do so. You will need to go to the server that will receive messages
    and alter its syslog configuration. The configuration file can be found at /etc/sysconfig/syslog.
    If a penetration tester (or attacker) gets access to the configuration file for
    syslog, they can turn off all logging.


    In order to enable the server to listen for remote messages, the SYSLOGD_OPTIONS
    variable in this file must have -r included, either like this:


    ```

    SYSLOGD_OPTIONS="-m 0 -r"

    ```


    Or like this:


    ```

    SYSLOGD="-r"

    ```


    You will have to restart syslog on the server for the changes to take effect.
    The server will now start to listen on UDP port 514, which you can verify using
    the netstat command.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Syslogd


    This shell utility is part of the daemon that provides system logging, more specifically
    kernel logging. This service is what provides the ability to log data to syslog.
    As you might expect, syslogd has some options you can set:


    +   - **-a:** This allows you to add additional sockets for the syslog daemon
    to listen to. This is useful if you have other servers forwarding their syslog
    messages to a central server.

    +   - **-d:** This runs the daemon in debugging mode, allowing you to view issues
    live in the shell.

    +   - **-h:** This option allows you to forward syslogd messages from the server/machine
    you are on to a centralized server.

    +   - **-r:** You would use this option on the central server receiving syslogd
    messages from other servers. It puts the daemon into a mode that allows it to
    receive messages from the network.

    +   - **-s:** This option is used to cause the daemon to log in verbose mode.
    This will increase the amount of detail in log entries.


    There are other options, but these are some of the most widely used, particularly
    -h and -s.


    Obviously, logging is an issue for penetration testers. From the attack perspective,
    you would like to know if your attacks are being logged. From a security testing
    perspective, you wish to ensure they are.


    # Scripting


    Eventually most penetration testers want to write their own scripts, in order
    to automate their favorite tests. Script writing is very similar to traditional
    programming that one might do in languages such as C, C++, or Java. However, it
    has some significant differences. First and foremost, you do not compile a script.
    You simply write your script code in your preferred text editor, then execute
    it when you need to. Secondly, script writing requires no special software tools
    or utilities. You can, as previously stated, use any text editor you prefer. But
    script writing does share one thing in common with traditional programming: the
    need for proper syntax and structure. Any errors in your script, even trivial
    ones, will either render your script nonfunctional or drastically change the output
    from your script.


    Scripts can be written in any basic text editor. You can use Kate, Kwrite, or
    any other text editor that you wish. The first issue to keep in mind when writing
    a script is that scripts are generally written for a particular shell ( i.e. BASH,
    C shell, Korn, etc.). For this reason, all the shells have an agreed upon standard,
    that the first line of a script declares what type of shell it runs in. Then that
    shell will be used to run the script. For example, if you want a script run by
    the C shell, your first line would be:


    ```

    #!/bin/csh

    ```'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'If, however, you wished your script to run in BASH:


    ```

    #! /bin/sh

    ```


    It is also standard practice to save your script file with an .sh extension, such
    as myscript.sh. As soon as you do save it with the .sh extension, many text editors
    in Linux will recognize this is a script and format the text accordingly. For
    example, shell commands will be in one color and font, comments in another, and
    script commands in another color and font. Consider this basic script:


    ```

    #! /bin/sh

    hostname

    who

    exit 0

    ```


    This particular script is very basic. It will display the hostname of the computer
    it is running on (hostname) and a list of any users currently logged on to that
    server (who), then exit the script (exit 0). You can also see from the first line
    of the script that this is written for BASH, the most common shell. Note all scripts
    must end with exit 0. That is the syntax to end the script.


    If you run the ls command on that directory, you will see that particular directory’s
    content.


    In some Linux distributions, any file with an .sh extension is automatically considered
    an executable file. In others, like OpenSUSE, you have to change the file to make
    it executable. That is a simple command:


    ```

    chmod 777 myscript.sh

    ```


    After that, if you run an ls, you will see your script file is in green. That
    is an indication that it is executable.


    This, of course, brings up the topic of the chmod command itself, which we discussed
    in Chapter 9. This command allows you to modify the permissions of any file. The
    three numbers represent the user who owns the file, the current group, or everyone.
    So, for example, if we just wanted a specific user to be able to execute this
    script, we would write


    ```

    chmod 700 myscript.sh

    ```


    If, instead, we wanted to provide the group execution access:


    ```

    chmod 070 myscript.sh

    ```


    The number 7 indicates full permission. The permissions are


    +   0 = No Permission

    +   1 = Execute

    +   2 = Write

    +   4 = Read'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'But they can be combined; for example, 2 and 1 give write and execute permission.
    The full list of permissions follows. If you combine read, write, and execute,
    that would be number 7 (just total up the 1 for execute, 2 for write, and 4 for
    read).


    +   - 0 – no permissions

    +   - 1 – Execute only

    +   - 2 – Write only

    +   - 3 – Write and execute

    +   - 4 – Read only

    +   - 5 – Read and execute

    +   - 6 – Read and write

    +   - 7 – Full control


    Now that you understand chmod and file permissions, it is time to execute our
    script. To execute this, or any other script, then from the shell type


    ```

    bash myscript.sh

    ```


    and your script will execute. In this case the script executes two specific shell
    commands: hostname and who. You can see it in Figure 10-10.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_272_0.png)


    FIGURE 10-10 Executing a Script.


    Obviously, this is a pretty simplistic script, and of limited use. However, it
    does show you the basic techniques used to write a script and to execute it. This
    script has the proper identifier for what shell it is written for, a series of
    commands (albeit a short series), and the terminating/exit code. While this is
    a simple script, it does give you a template for how all scripts must be written.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Sometimes in your script, you might have several related statements to write.
    You might want to put them all on one line. You could choose to do this either
    to save space or to logically group commands that belong together. For whatever
    reason, doing it is actually pretty simple. You simply separate each command on
    the line with a single semicolon, as you see here:


    ```

    ```

    statement one; statement two; statement three

    ```

    ```


    You can open your favorite text editor and type the following into it. Then save
    it as scriptmultiple.sh and run it.


    ```

    ```

    #!/bin/bash

    ls; ps;who;logname;

    exit 0

    ```

    ```


    When you run this, it will work just as if you had placed each command on a separate
    line. Many script writers do this, and you will probably see it in scripts written
    by other administrators. However, I do not recommend it. I am always in favor
    of writing any code so that it is easy to read and follow. In my opinion, putting
    several commands on one line does not facilitate an easy-to-read script.


    Beyond executing multiple shell commands, scripts can do many other things. For
    example, you can combine special characters with shell commands to alter the output
    of that command. The most common example of that is using wildcards with a command.


    A wildcard is a character that is used to represent any character at all. There
    are a few wildcards used in scripts. For example, if I write


    ```

    ```

    ls *.sh

    ```

    ```


    I am asking the shell to list any file ending in .sh (i.e. any script file), regardless
    of the number of characters in that file. So this command would list any script
    files at all. On the other hand, if I use the ? wildcard, then the command will
    only list files with the number of characters equal to the number of question
    marks. So if I write


    ```

    ```

    ls ??? .sh

    ```

    ```


    I am asking the shell to list any file ending in .sh (i.e. any script) that has
    a three-character filename.


    I can also look for ranges of letters, like this:


    ```

    ```

    ls myscript[123].jpg

    ```

    ```


    In this case I am asking the shell to list any files that end in .sh (i.e. any
    script) that also have a filename beginning with myscript, then ending in a 1,
    2, or 3.


    It is also possible to search for ranges of letters, like this:


    ```

    ```

    ls [a-d,A-D]*.txt

    ```

    ```


    This is telling the shell to find any document that begins with a–d lowercase
    or A–D uppercase.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'These wildcards can be used with commands other than ls. For example, the rm
    command (to remove a file) can also remove files based on wildcard assignments.
    Here is a basic script using wildcards:


    ```

    #!/bin/sh

    ls *.txt

    ls [a-m]???.sh

    ls ??.txt

    exit 0

    ```


    This is a very simple script but it illustrates the essentials of what we have
    discussed thus far. Table 10-2 provides a list of the available wildcards.


    # TABLE 10-2 Wildcards


    | Wildcard | Purpose |

    |---|---|

    | * | This means literally any character, and any number of characters. For example,
    *.sh would mean any shell, any file at all, regardless of how many characters
    are in the name, that ends in the .sh extension. |

    | ? | This denotes one character. For example, ????.txt would mean all text files
    that have a four-character name. |

    | ! | This means not, or negation. |

    | [abc] | This means containing any of the characters listed. So [abc]???.txt
    would mean all text files that start with an a, b, or c followed by three characters.
    |

    | [a-m] | This means any characters in the range shown. So [a-l]?? .txt would
    mean any file starting with some letter from a to e, followed by two characters.
    |


    # Linux Passwords


    You were briefly introduced to Linux passwords in Chapter 9. Now we will take
    a much closer look. First let’s look at the /etc/shadow file from my own Kali
    Linux, as shown in Figure 10-11.


    First notice that various services also have accounts. Let’s examine this so you
    can understand what you are seeing. First, it is obvious that each line is a separate
    user and that there are users for service accounts as well as humans. Each field
    is separated by a colon.


    The first field is the username. The second is the password. Now, the password
    can be stored as a hash or encrypted, depending on the version of Linux. Some
    versions of Linux (though not the one shown in Figure 10-11) will tell you which
    it is. There is an ID with the password:


    +   1. **$1$** is MD5.

    +   2. **$2a$ or $2y$** is Blowfish.

    +   3. **$5$** is SHA-256.

    +   4. **$6$** is SHA-512.'
  merge: -1
  img_proc: true
