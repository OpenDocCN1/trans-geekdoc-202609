- pgno: 98
  md: '# Reconnaissance


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Perform passive reconnaissance

    +   - Perform active reconnaissance

    +   - Gather information from public sources

    +   - Use port scanners and vulnerability scanners


    Once you are ready to begin the penetration test, one of the first steps will
    be to gather as much information as you can about the target network. In the case
    of a white box test, much of the information will be provided to you by your client.
    When conducting a black box test, you will be provided very little information,
    and must find it all out on your own.


    Even when doing a white box test, it may be appropriate to conduct some reconnaissance
    in order to discover how much information an attacker would be able to gather.
    The techniques discussed in this chapter are precisely the techniques that attackers
    use to gather information about targets. Therefore, using these techniques not
    only provides you with information for your penetration test, but also gives you
    insight into what information is available to attackers.


    In Chapter 8, “Vulnerability Scanning,” we will explore the topic of vulnerability
    scanning, which will add to the techniques you encounter in this chapter. By combining
    the reconnaissance explained in this chapter with the vulnerability scanning described
    in Chapter 8, you will have the techniques and tools to gather a great deal of
    information on a potential target network.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Passive Scanning Techniques


    Passive reconnaissance is the process of gathering information about a target
    network without actually connecting to the network. More skillful attackers will
    always start with passive reconnaissance, and so should penetration testers. In
    this section, we will examine some tools and techniques for performing passive
    reconnaissance. The concept is to gather information on a target website without
    actually connecting to that website. That way there is no chance of triggering
    an intrusion detection system, or leaving a trace in the log files of the target
    system.


    # Netcraft


    It is often useful to understand as much about a target website as you possibly
    can before connecting to that website. Penetration tests often involve testing
    web servers. So, a good first step is to learn all you can about the target web
    server. The site netcraft.com can be very useful in this regard. You can see the
    main page of netcraft.com in Figure 4-1.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_99_0.png)


    FIGURE 4-1 Netcraft.com.


    When you visit the page, just scroll down a little and you will see a section
    entitled “What’s that site running?” This is shown in the red box in Figure 4-1.
    This is where you type in the site you wish to test. To demonstrate this, I typed
    in my own website, www.ChuckEasttom.com. The results are shown in Figure 4-2.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_100_0.png)


    FIGURE 4-2 Netcraft.com Report for www.ChuckEasttom.com.


    There is a lot of information here. I should tell you, however, the address information
    is not accurate. I purposefully don’t have my real address in my website registration
    information. That, however, is a step very few companies take. It is most likely
    that the contact information you see in netcraft.com is accurate.


    Beyond background information, netcraft.com will tell you what operating system
    the web server is running as well as what web server software. This is very interesting
    information, and can be the first step in guiding your attempts to penetrate the
    web server. Other information found at netcraft.com can also be interesting. For
    example, if you see that the website is running in Internet Information Services
    (IIS) on a Windows 2012 server, but has not been rebooted in 8 months, this is
    very important. It is important because Windows often requires a reboot with certain
    patches and service packs. If the server has not been rebooted in 8 months, then
    those patches and service packs that require a reboot have not been applied in
    that time frame.


    That information is then coupled with a vulnerability web search where you look
    for vulnerabilities in Windows 2012 that have been found in the last 8 months.
    These are vulnerabilities this server has not been patched for. This can provide
    a valuable clue as to where to begin your penetration of the target web server.


    # BuiltWith


    Another interesting website that will give you information about other websites
    is https://builtwith.com/. This website will provide details about what a target
    website is built with (i.e. what scripting and programming languages). For demonstration
    purposes, I used my own website, the results of which are shown in Figure 4-3.'
