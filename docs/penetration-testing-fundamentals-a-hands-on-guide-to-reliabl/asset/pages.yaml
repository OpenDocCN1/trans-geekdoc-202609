- pgno: 46
  md: '# Chapter 2


    # Standards


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand various penetration testing standards

    +   - Use these standards to guide your own penetration testing

    +   - Synthesize these standards into a single cohesive approach to penetration
    testing.


    In Chapter 1, “Introduction to Penetration Testing,” you were introduced to both
    the subject and the profession of penetration testing. One issue that was heavily
    emphasized in Chapter 1 is that penetration testing is not hacking. In this chapter,
    that fact should become even more clear. Penetration testing is a professional
    activity that should be approached like any other engineering or project management
    task.


    As with engineering and project management, there are professional standards for
    penetration testing. Penetration testing should not be an ad hoc series of random
    hacking attempts. It should be a carefully planned project with specific goals.
    In order to accomplish this, a range of professional standards have evolved that
    address the pen testing process. Some of these standards are directed towards
    specific industry goals. For example, the Payment Card Industry Data Security
    Standard (PCI DSS) for pen testing is specifically for testing the security of
    companies that handle credit card data. Other standards (e.g. Penetration Testing
    Execution Standard [PTES] and Council of Registered Ethical Security Testers [CREST])
    are general approaches to penetration testing that can be used in any organization
    or industry.


    This chapter will describe and explain each of these standards. At the end of
    this chapter you should have a working knowledge of the major penetration testing
    standards. Then the standards will be synthesized into a proposed approach to
    penetration testing that you can utilize for your own pen tests.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# PCI DSS


    The Payment Card Industry Data Security Standard is the standard used by Visa,
    MasterCard, American Express, and Discover. There are in fact a great many parts
    to the standard, but we will only briefly summarize the general standard itself,
    then focus on the details of the penetration testing portion of it.


    The first version of PCI DSS was released in December of 2004. The standard has
    routinely been updated and, as of April 2016, currently is in version 3.2.


    The main focus of PCI DSS are the security controls and objectives that companies
    who process credit cards should implement. Security auditing and penetration testing
    are done to ensure such controls are implemented and the objectives met. This
    is one reason you will need a basic understanding of PCI DSS in order to truly
    understand a PCI DSS penetration test.


    PCI DSS defines some rather broad objectives of security that must be met in order
    for a network to be security compliant. You can see the control objectives in
    Figure 2-1.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_47_0.png)


    FIGURE 2-1 PCI DSS Control Objectives.


    If your penetration test is designed to test PCI DSS objectives, it is important
    that you be very familiar with the objectives.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# The Actual Test


    The PCI Penetration testing standard defines a specific process that must be used
    for a PCI penetration test. The overview of that process is provided here.


    First, PCI DSS has three concepts that must be explored prior to the test engagement.
    Then there are three phases of the test itself. Figure 2-2 shows the three conceptual
    areas that must be addressed.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_48_0.png)


    FIGURE 2-2 PCI DSS Testing Concepts.


    The first issue is to determine the scope of the test. This is important in any
    penetration test. It is not the case that you will always test everything. In
    fact, in many situations, this will be infeasible. So first determining what systems
    will be tested, and to what degree they will be tested, is critical.


    One of the things I truly admire about the PCI DSS standard, and something I believe
    should be incorporated into all penetration testing, is the issue of qualifications.
    In Chapter 1, I discussed the issue of exaggerated credentials, and that is part
    of what is meant here by qualifications. But beyond that, it must be determined
    what level of qualifications are needed for this specific pen test. Some people
    would argue that you simply always hire the best qualified person who is both
    available and within your budget. However obvious that might seem, it is incorrect.
    A good way to illustrate why this approach is wrong is to consider a medical analogy.
    You don’t need a world-renowned surgeon to set a broken arm.


    In determining the qualifications for a given penetration test, several factors
    need to be considered. The first is complexity. A simple test for web attacks
    on an e-commerce site is less complex than tests on supervisory control and data
    acquisition (SCADA) systems, for example. Another issue is the nature of the target
    network. A homogeneous network, for example a Microsoft Windows only network,
    is simpler to test than a network that has Microsoft Windows workstations, Linux
    web servers, and Mac laptops. The aforementioned scope is also an issue in determining
    the requisite qualifications. The broader the scope of the test, the more skills
    will be required.


    Finally, the third concept is methodology. In Chapter 1, I discussed a variety
    of methodologies. Closely related to that topic are the standards being discussed
    in this chapter. Of course, for a PCI DSS'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'test, it is obvious that PCI standards are being tested; however, there could
    be additional standards that should also be tested.


    Once these concepts are addressed, PCI DSS has a rather simple three-phase approach,
    but each phase has specific requirements. You can see a summary of those in Table
    2-1.


    # TABLE 2-1 PCI DSS Phases and Requirements


    | Pre-Engagement | Actual Test | Post-Engagement |

    |---|---|---|

    | Scope | Application layer | Remediation |

    | Documentation | Network layer | Retesting identified vulnerabilities |

    | Rules of engagement | Segmentation | Cleaning up |

    | Environment | How to handle cardholder data | Reporting |

    | Success criteria | Post-exploitation |  |

    | Pass vulnerability scans |  |  |


    # NIST 800-115


    The National Institute of Standards and Technology is a U.S. organization that
    formulates a number of standards, many of which are of interest to cyber security.
    Of particular interest to penetration testers is NIST 800-115, Technical Guide
    to Information Security Testing and Assessment. As the title of this standard
    suggests, it is a general guide for testing, not just penetration testing.


    The standard includes some items that are not relevant to penetration testing,
    such as document review, log review, and similar items. These issues are more
    appropriately covered in a security audit. It should be noted that it is entirely
    appropriate to have an audit precede and direct the focus of a penetration test.


    NIST 800-115 uses three phases:


    +   - Planning

    +   - Execution

    +   - Post-Execution


    This may seem like a rather simplified plan, but these phases are each robust
    and detailed. We will look at each phase in more detail in the following sections.


    # Planning


    Planning is one of the items that separates penetration testing from hacking.
    Hacking may or may not be planned, and if planned, the plan may be very flexible.
    However, professional penetration testing should be approached like an engineering
    project, which means that a detailed plan is critical.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The first issue to address in planning is to identify objectives. Exactly what
    are you trying to accomplish? A vague answer such as “test system security” is
    simply not adequate. When planning a penetration test, your goals should have
    a military precision. A good example goal might be “to test the e-commerce server
    against OWASP Top 10 vulnerabilities.” We will discuss OWASP in some detail later
    in this chapter; for now simply understand that it is an organization that is
    concerned about web security and publishes a Top 10 vulnerability list.


    The main issue with your objectives is that they must be specific enough to be
    measurable. Vague goals are very difficult to measure, and often provide no meaningful
    guidance. Related to objectives is the issue of scope. It would be wonderful to
    say you will test everything, but in any sizeable network, that just is not possible.
    It is important that you select a scope that is both manageable and effective
    at addressing security concerns. The way to do that is to allow past incident
    reports, vulnerability scans, and security audits to help you decide the scope
    of your penetration test.


    # Execution


    The execution of the test is actually three sub-phases. The first of these is
    network discovery. You simply try to find out what is on the target network. There
    are a number of tools, which we will be examining later in this book, that can
    help you to enumerate an entire network.


    After you have enumerated the network, you have to identify vulnerabilities. It
    is important to keep in mind that a vulnerability scan is not a penetration test;
    however, a vulnerability scan is one way to guide your penetration test. Put another
    way, nothing is accomplished by trying to exploit a target system that is not
    vulnerable to the attack you are attempting. In later chapters you will see a
    wide range of tools that can help you to identify vulnerabilities. Table 2-2 is
    from the NIST 800-115 document (it is Table 4-1 in that document) and describes
    the discovery techniques.


    TABLE 2-2 NIST 800-115 Discovery Techniques


    | Technique | Capabilities |

    |---|---|

    | Network Discovery | Discovers active devices

    Identifies communication paths and facilitates determination of network architectures
    |

    | Network Port and Service Identification | Discovers active devices

    Discovers open ports and associated services/applications |

    | Vulnerability Scanning | Identifies hosts and open ports

    Identifies known vulnerabilities (note: has high false positive rates)

    Often provides advice on mitigating discovered vulnerabilities |

    | Wireless Scanning | Identifies unauthorized wireless devices within range of
    the scanners

    Discovers wireless signals outside of an organization''s perimeter

    Detects potential backdoors and other security violations |


    Finally, it is time to attempt to exploit these vulnerabilities. This is the sub-phase
    wherein hacking techniques are actually used. At this phase you attempt a variety
    of techniques to breach the target system.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The actual penetration test, the attack phase, is divided into a four-step
    process. The steps are planning-discovery-attack-reporting. You can see this in
    Figure 2-3.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_51_0.png)


    FIGURE 2-3 Pen Testing Steps.


    The reason this is presented as a cycle is two-fold. The first reason is that
    if a previous penetration test has been conducted, then one of the things you
    should plan in the current test is to test what was uncovered in that previous
    penetration test. In essence, check to see if those issues were corrected. The
    second reason this is presented as a cycle is that within a penetration test,
    you may perform one attack, review the results, and that might guide you to other
    attacks that should be performed. For example, if you discover a site is vulnerable
    to SQL injection, then it is reasonable to also test for cross-site scripting.


    # Post-Execution


    Post-execution is not just a catch-all phrase to encompass everything you do after
    the actual attack. This phase is every bit as critical as the other phases. The
    first goal is to make sure you have not left any systems open. If you breached
    a system, whenever possible close that breach when your test is done.


    You also need to create a report. That report should be quite detailed and should
    show everything you did as well as the results. If an attempted breach failed,
    it is just as important to document that as it is to document successful breaches.
    In addition, when you are successful in breaching a system, you need to provide
    details on how you did it.


    The most important part of the report are the remediation steps. Your report should
    document how the target network can fix the vulnerabilities you discovered. The
    ultimate goal of a penetration test is to find weaknesses and correct them before
    an attacker finds them.


    NIST 800-115 is very detailed and discusses specific attacks you should attempt
    such as password cracking, social engineering, boundary checking, and others.
    It is a good idea to review this standard, even if you are not performing penetration
    tests that need to be compliant with NIST 800-155.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# National Security Agency InfoSec Assessment Methodology (NSA-IAM)


    The National Security Agency InfoSec Assessment Methodology (NSA-IAM) describes
    three general phases, each subdivided into specific tasks to be conducted during
    that phase.


    +   - Pre-Assessment

    +     - Determine and manage the customer''s expectations

    +     - Gain an understanding of the organization''s information criticality

    +     - Determine customer''s goals and objectives

    +     - Determine the system boundaries

    +     - Coordinate with customer

    +     - Request documentation

    +   - On-Site Assessment

    +     - Conduct opening meeting

    +     - Gather and validate system information (via interview, system demonstration,
    and document review)

    +     - Analyze assessment information

    +     - Develop initial recommendations

    +     - Present out-brief

    +   - Post-Assessment

    +     - Additional review of documentation

    +     - Additional expertise (get help understanding what you learned)

    +     - Report coordination (and writing)


    There are many things about this broad overview that are noteworthy for any penetration
    tester. Notice that in the pre-assessment phase there is the item manage customer
    expectations. Someone has hired you to perform a penetration test. In order to
    avoid misunderstandings and dissatisfaction later, it is critical that the customer
    understand exactly what a penetration test will, and won''t, do.


    Also in the pre-assessment phase, the NSA-IAM has you understand the target networks
    criticalities as well as the customer''s goals and objectives. This is part of
    a targeted penetration test. We have already discussed that it is impractical
    to simply try to test everything. By understanding what systems are most critical
    to this organization, and understanding the customer''s goals and objectives,
    you can effectively select the correct targets for your penetration test.


    I would also direct your attention to a specific item in the post-assessment phase.
    That is getting expertise to assist you. It is impossible for anyone to know everything.
    If your penetration test involves technologies you might not have expertise in,
    then you should get assistance from someone who is an'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'expert with that technology. That person need not be a penetration tester,
    just an expert in the specific technology of interest.


    The NSA-IAM has three levels of security testing. Assessment Level I is reviewing
    policies and procedures. It is not really a test, so much as it is an audit. Assessment
    Level II involves the use of tools for diagnosing and finding flaws. Assessment
    Level III is called Red Team exercises. This is where the penetration testing
    occurs.


    One item that stands out about Assessment Level III is that the goal is to simulate
    specific attackers. Rather than simply perform a broad-based penetration test,
    the goal is to perform threat modeling to describe a specific attacker, and then
    perform the penetration test in accordance with that model.


    For example, if your threat modeling determines that a likely attack would be
    an organized crime group attempting to breach the network specifically for the
    purpose of stealing financial data, then the penetration test should be done in
    that manner.


    # PTES


    The Pen Testing Execution Standard (PTES) recommends seven stages, which are shown
    in Figure 2-4.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_53_0.png)


    FIGURE 2-4 Seven Stages of PTES.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'It is noteworthy that in this process, the first four stages involve pre-penetration
    test information gathering. These seven steps are each carefully detailed on the
    PTES website (http://www.pentest-standard.org). We will explore the highlights
    in this section, but I highly recommend you visit the website and review, in detail,
    the entire process the PTES developers have outlined.


    As part of the pre-engagement activities, PTES recommends first defining the scope.
    We have discussed the need for clearly understanding the scope of the test, in
    reference to previous standards. PTES recommends a meeting with the client in
    order to fully discuss scope-related issues. In addition to the scope, PTES provides
    some basic metrics to help you estimate the time required to perform a penetration
    test.


    One feature that PTES offers, that I think you can apply to any penetration test,
    is the use of a questionnaire. PTES outlines some basic questions you should submit
    to the client. This provides you a formal mechanism for gathering data regarding
    the client’s objectives and goals, as well as their expectations.


    Intelligence gathering is always going to be an essential part of any effective
    penetration test, and PTES describes this process, quite thoroughly. In the intelligence
    gathering state, you are learning about the target network. For example, you find
    out whether there are specific standards the target organization must comply with
    (such as PCI DSS). That should be a factor in planning your penetration test.
    You might also go further, utilizing open source intelligence (OSINT) to find
    out what information is publicly available on the target organization. This is
    the sort of information that will guide real attackers, thus it should guide your
    penetration test.


    Threat modeling is the process of contemplating the likely threats to a target
    organization and modeling how those threats would be realized. This means you
    attempt to understand who the likely attackers are, and how they would go about
    attacking. This can be invaluable in guiding your penetration test.


    The vulnerability analysis phase is the transition from information gathering
    to action. You can use a wide range of vulnerability scanners (which we will be
    exploring in detail later in this book) in order to help you uncover vulnerabilities.
    This analysis will essentially be picking the targets for your actual attack.


    In the exploitation phase, you will actually attempt to breach the target network,
    via the previously identified vulnerabilities. This is where the actual hacking
    takes place. It is worth noting that in professional penetration testing, the
    hacking does not occur until far into the process. A great deal of work is done
    before you perform any hacking at all.


    The post-exploitation phase is not about after the test, it is about after a specific
    system has been compromised. The PTES standard dictates that this is the stage
    at which you determine the value of the system you have compromised, and take
    steps to maintain the access. This might involve creating a user account on the
    system or installing a back door.


    The reporting phase is where the work-product is finally produced. A report must
    be detailed, demonstrating exactly what techniques were used, what vulnerabilities
    were exploited, and most critically: how to remediate those issues that were discovered.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# CREST (UK)


    CREST is a not for profit organization that offers training and certification
    in cyber security (www.crest-approved.org). CREST was originally in the United
    Kingdom only but is now also in Asia and North America. CREST has several examinations
    one can take, the most relevant of which to our discussion is the Crest Registered
    Tester (CRT) exam.


    The CREST exams are practical exams wherein the test taker has to actually find
    and exploit specific issues. While CREST is not a standard, and is rather a certification,
    there are items in that certification that are worth reviewing.


    They require the test taker to first understand relevant cyber laws. This is something
    that is not covered by the other standards we have discussed, but is important
    to any penetration tester.


    Like many other standards, the CREST exam asks the tester to understand scoping
    the project. Unlike the other standards we have discussed, the CREST exam requires
    the test taker to have at least a working knowledge of networking. This may seem
    obvious for a penetration tester, but specifically requiring it is a very good
    idea, and helps to ensure the penetration tester is indeed qualified to perform
    the test. In fact, a significant portion of the CREST syllabus (http://www.crest-approved.org/wp-content/uploads/crest-crt-cpsa-technical-syllabus-2.0.pdf)
    is devoted to fundamental networking skills.


    # A Synthesis (Putting Standards Together into a Single Unified Approach)


    Each of the standards discussed in this chapter has specific strengths. By fusing
    them together into a single approach, the penetration tester will have a map for
    conducting penetration tests, and that map will be based on a very solid foundation.
    It should be noted that what is described in this section is an outline, and you
    should feel free to expand upon it as your situation requires. The method described
    in this section is a four-phase process that combines elements from each of the
    previously described standards and is consistent with those standards. Thus, this
    four-phase methodology could be used in conjunction with any of the aforementioned
    standards. The methodology describes your approach to penetration testing for
    a particular test. This will include:


    +   1. The amount of information given (i.e. black box, white box, gray box testing).

    +   2. Is this testing for some standard (NSA-IAM, PCI, etc.)?

    +   3. Will this test involve internal and external testing, or just one of those
    options?

    +   4. Will this test include physical penetration testing and/or social engineering?

    +   5. What is the mix of manual and automated testing?'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Most importantly, the methodology should describe the reasons for choosing
    that specific methodology. An example methodology statement might look something
    like the following example:


    This test is being conducted for PCI DSS requirements. The test will involve internal
    and external testing, and be conducted with the tester being given extensive information
    (i.e. a white box test). This specific test will not include physical testing
    or social engineering. The test will involve both automated and manual tasks with
    the primary tools used being:


    +   - Metasploit

    +   - OWASP ZAP

    +   - Vega

    +   - Nmap

    +   - Nessus


    These tools will be used in conjunction with manual testing techniques.


    The test will begin with internal and external vulnerability scans. This will
    be followed by assessing specific PCI DSS required security controls. Then manual
    attempts will be made to penetrate the network.


    Of course, more detail is usually preferred. The preceding example is merely meant
    as a starting point of how a basic methodology statement might look.


    # Pre-Engagement


    The most important element of the pre-engagement is a thorough contract. It must
    include the following:


    +   1. Scope of the test

    +   2. Any items not to be tested

    +   3. Goals of the test

    +   4. Time frame of the test

    +   5. Any standards to be met (PCI DSS, NIST, etc.)


    Any ambiguities in the contract are likely to lead to dissatisfaction for the
    penetration testing customer. Clearly, legal advice is preferred for any contract,
    but the preceding list provides an overview of the technical issues that must
    be addressed in the contract.


    In addition to the contract, information gathering is also critical in the pre-engagement
    phase. Failure to gather the appropriate information in this phase can lead to
    incorrect test focus or execution. Gather information regarding the following:


    +   1. Any past breaches. Details on such breaches are important. Obviously, you
    wish to begin by testing to ensure the network is no longer susceptible to them.

    +   2. Any recent risk analysis or audits. This information can also assist you
    in determining what areas are most critical to test.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   3. Any specific concerns the customer has. This can also guide you to testing
    the appropriate areas.

    +   4. Ensure that you and the client agree on the scope as well as what a penetration
    test can do. It is important that the client have realistic expectations.


    The preceding list is exemplary, not exhaustive. More information is always desirable.


    # The Actual Test


    Once the pre-engagement phase is complete, the next step is to conduct the actual
    penetration test. Pen testing is a multistep process. Each step is equally important.
    The actual test is further divided into four sub-phases:


    +   - **Phase 1 – Passive scanning:** You begin the penetration test by gathering
    as much data on the target as you can. This phase is the passive data gathering
    phase. This includes social media, netcraft.com, archive.org, etc. All the passive
    data you can obtain. Advanced Google searching combined with resources such as
    shodanhq can provide a wealth of information regarding the target network.

    +   - **Phase 2 – Active scanning:** This phase involves actively scanning the
    target network. At a minimum, you will use nmap to port scan all available IP
    addresses. Then use at least two different vulnerability scanners (Vega, OWASP
    ZAP, Burp Suite, etc.) to scan all available websites. You will also conduct a
    vulnerability scan of any accessible IP addresses (Nessus, MBSA, OpenVAS, etc.).

    +   Gather as much possible data about services, ports, etc. If appropriate, use
    Metasploit to scan for SQL Servers, SSH, FTP, SMB, etc.

    +   Network scanning along with wireless and Bluetooth scanning are also recommended.
    This can determine if the wireless is secured, discover if unencrypted data is
    being sent over the network, and give a general overview of the network traffic.

    +   - **Phase 3 – Breaching:** Now you must attempt to breach. This will include
    manually conducting SQL injection and cross-site scripting, trying to deliver
    malware from Metasploit, attempting phishing, delivering a harmless virus, etc.
    It is recommended that the penetration tester combine both automated and manual
    methods. Specific tools may vary depending on current trends, vulnerabilities
    identified, and the target network. For example, a Windows network may require
    attempts to exploit using Power Shell. In almost all cases, Metasploit will be
    useful in attempting to exploit identified vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "**Phase 4 – Completing the test:** In some cases, it is beneficial to do at\
    \ least a basic vulnerability scan after the issues found in the penetration test\
    \ are remediated. This checks to see if the remediation was successful.\n\n# Reporting\n\
    \nThe report must be thorough, with the following sections:\n\n+   I. Executive\
    \ summary\n+   \n+   One to three paragraphs explaining the scope of the test\
    \ and results.\n+   \n+   II. Introduction\n+   \n+   This is where you describe\
    \ testing goals and objectives. This section must also include what the testing\
    \ goals were, what was tested, and what was excluded. Items excluded will include\
    \ items you are not conducting for whatever reason you have, as well as items\
    \ excluded by the client’s direction. This is often referred to as the scope of\
    \ work.\n+   \n+   This section should include rules of engagement and any past\
    \ breaches or risk assessments. Such past activity should be guiding the prioritization\
    \ of your penetration testing.\n+   \n+   III. Detailed Analyses\n+   \n+   This\
    \ must include every test you conducted, preferably with step-by-step discussion\
    \ and screenshots. If you used tools that produced reports, attach those reports\
    \ as appendices.\n+   \n+   When you identify vulnerabilities, whenever possible\
    \ identify them by a well-known standard. For example:\n+   \n+   IV. Conclusions\
    \ & Risk Rating\n+   \n+   Provide a general description of what you found and\
    \ what the risk level is. A risk rating of the network can be helpful to the customer.\
    \ This need not be an absolute mathematical scale. It can be simply a description\
    \ such as low, moderate, high. Or it can be expanded such as low, moderate, elevated,\
    \ high, extreme.\n+   \n+   V. Remediation Steps\n+   \n+   This section provides\
    \ details on how the flaws found in penetration testing can be addressed and mitigated.\
    \ These details should be specific enough to allow any competent technical person\
    \ to be able to correct the problems you discovered. This is a critical part of\
    \ the report. It is not enough to simply state that there are problems—you must\
    \ provide clear guidance on how to address those problems.\n\n+   - The National\
    \ Vulnerability Database\n+     - Common Vulnerability Scoring System\n+     -\
    \ Common Vulnerabilities and Exposure\n+   - Bugtraq ID"
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Example Pen Test


    What tests and tools you use will depends on the target network, the scope of
    work, and the items being tested. For illustration purposes, consider a small
    network that has 1 gateway router, 30 workstations, 3 servers, and 1 web server.
    The following would be a very basic penetration test for a small network. Note
    that this is just an example. Your test assessment plan should be based on the
    criticality of systems within the target network.


    # External


    After completing the pre-engagement activities and the phase 1 passive scanning,
    the active scanning is the next phase. In a small network, such as the one described
    in this scenario, active scanning will flow naturally into phase 3, breaching.
    It is often easiest to start with external testing.


    +   1. Begin with port scanning all public-facing IP addresses (the web server
    and gateway router).

    +   2. Then use vulnerability scanners to scan the website (Vega, OWASP ZAP, Burp
    Suite, etc.).

    +   3. Manually attempt several common attacks on the web server (cross-site scripting,
    SQL injection, website path traversal, etc.).

    +   4. Try appropriate Metasploit attacks on the web server (depending on the
    server) and on the router. You may wish to use some Metasploit scans on the web
    server, particularly an anonymous FTP scan.

    +   5. Attempt to access the wireless. This should include both trying to break
    into the Wi-Fi as well as attempts to access the administrative screen for the
    wireless access point.

    +   6. Attempt standard attacks such as grab the banner, zone transfer, etc.

    +   7. Try default passwords on any public-facing device.


    # Internal


    Now move internally. This part is done from inside the network.


    +   1. Begin with network enumeration, which is internal active scanning.

    +   2. Perform a network-wide vulnerability scan using one or more tools.

    +   3. Nmap scan the entire network. Identify what ports and services are running
    to determine if they all need to be running.

    +   4. Use a packet sniffer to scan network traffic including wireless traffic.
    Note any sensitive data that is being sent unencrypted and whether the wireless
    traffic is secure.

    +   5. Perform the standard Metasploit scans (Anonymous FTP, SMB, SSH, SQL Server,
    etc.).

    +   6. Attempt to exploit any vulnerabilities found.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '+   7. Attempt standard attacks including:

    +     a. Try to connect to computers’ shares.

    +     b. Try to crack passwords on key machines.

    +     c. Try to telnet or ssh to printers.

    +     d. Attempt default passwords on any servers, printers, switches or routers,
    and wireless access points.


    Of course, you must test all items indicated by any standard you are using. For
    example, PCI requires all external communication of credit card data to be encrypted.
    I suggest you test all internal and external data communication.


    # Optional Items


    +   1. Send employees anonymous phishing email that will do something harmless
    such as redirect them to a page admonishing them not to click on links or a harmless
    malware attachment that just has a voice or popup telling them not to download
    attachments.

    +   2. Attempt social engineering via phone or in person.

    +   3. A penetration test is not a vulnerability scan, but can include vulnerability
    scanning (as already shown in this document). In the same way, a penetration test
    is not an audit, but can sometimes include elements of an audit. With that in
    mind, you may wish to check the following items:

    +      a. Password policies

    +         i. Lockout policy

    +         ii. Minimum requirements

    +         iii. How often passwords are changed

    +         iv. Check to ensure default passwords are not used on any systems

    +      b. Are there any unauthorized devices or software anywhere on the network?

    +      c. Are there still accounts active for employees no longer with the organization?


    This outline is a basic outline for a rather small network. Feel free to expand
    it and add to it as you see fit. This should be considered the bare minimum of
    a pen test.


    # Related Standards


    There are other standards that are not actually penetration testing standards,
    but are closely related. These are security standards that can be used to guide
    your penetration testing. For example, earlier in this chapter I mentioned OWASP
    as a web security standard. Testing against some standard is preferable to simply
    performing ad hoc tests of whatever issues occur to you.'
