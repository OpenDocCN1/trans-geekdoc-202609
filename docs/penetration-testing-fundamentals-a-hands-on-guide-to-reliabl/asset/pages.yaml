- pgno: 358
  md: "Notice that the case statements used in the preceding example have a range.\
    \ For example, when 1..15 indicates that the number is from 1 to 15. There are\
    \ no absolute rules about when to use a case statement versus when to use an if\
    \ statement. In general, as if statements become more convoluted, you may wish\
    \ to consider a case statement as an alternative.\n\n# Loops\n\nIt is a common\
    \ task in programming to need to iterate through a given piece of code a certain\
    \ number of times. This is generally accomplished with some sort of loop. The\
    \ following is an example of a simple for loop in Ruby:\n\n```\n# demo loops\n\
    \n#a global variable initialized to 0\ni=0\nfor i in (1...4)\n  print i,\" \"\n\
    end\n```\n\nFigure 15-7 shows the output.\n\n![](img/fa54c6d61c14db5421f8f63e6d594bb5_358_0.png)\n\
    \nFIGURE 15-7 for Loop.\n\nWe will see this used a bit more robustly in the next\
    \ section on functions. We could also rewrite this as a while loop as shown here:\n\
    \n```\ni = 0\nwhile i < 4\n  print i, \" \"\n\n  i = i + 1\nend\n```\n\nThe output\
    \ is almost identical, and can be seen in Figure 15-8. With the while loop, the\
    \ initial 0 is also printed to the screen."
  merge: -1
  img_proc: true
- pgno: 359
  md: "![](img/fa54c6d61c14db5421f8f63e6d594bb5_359_0.png)\n\nFIGURE 15-8 while Loop.\n\
    \n# Basic Functions\n\nAs with most programming languages, you will want to write\
    \ functions. Functions are groupings of statements, organized in a block with\
    \ a common name. Good functions work to perform a single goal. For example, a\
    \ function might calculate the monthly payments on a mortgage given a certain\
    \ principle and interest rate. Just like variables, you must define a function\
    \ before you can call it:\n\n```\ndef multiply(a,b)\n  product = a * b\n  return\
    \ product\nend\n```\n\nLet's combine some of what we saw in previous examples\
    \ with the functions I just introduced you to, to make a more robust Ruby example\
    \ program. In this case we will combine an if statement with a function to compute\
    \ the factorial of a number the user inputs:\n\n```\n# demo factorial\n\n#a global\
    \ variable initialized to 0\ni=0\n\nputs \"please enter an integer\"\ni = gets.to_i\n\
    \ndef fact(n)\n  if n == 0\n    1\n  else\n    n * fact(n-1)\n  end\nend\n\nputs\
    \ fact(i)\n```\n\nNotice that we call the function fact, after it is defined.\
    \ If you try to call it before you define it, you will get an error. This is an\
    \ important thing to remember. Figure 15-9 shows the results."
