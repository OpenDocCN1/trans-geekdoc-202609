- pgno: 368
  md: "We will take a look at each of these sections so you understand what each does.\
    \ The first part is just comments, which, as you know from Chapter 15, are preceded\
    \ by the # sign. I strongly recommend using comments liberally. It cannot hurt\
    \ to have plenty of inline documentation for your code.\n\nFollowing the comments,\
    \ the require ‘msf/core’ statement tells Ruby that you must have the Metasploit\
    \ Framework Core. While simple, this is important. In Kali Linux, you should have\
    \ very little problem with this statement. But if you are running this in Windows,\
    \ you are likely to get an error if Ruby cannot find where the msf/core is located.\n\
    \nIn some exploits you will see both require and include statements. So, what\
    \ is the difference? The require statement behaves the way include statements\
    \ do in most other programming languages: it reads in a file (or files) and puts\
    \ it in memory. The include statement will literally include all the methods from\
    \ the specified module. It is as if you wrote those methods in your module.\n\n\
    For the sake of those using your exploit, your initialize section should usually\
    \ include a few basics. The first is the author. Who wrote this? Second are references.\
    \ An exploit is written to take advantage of some vulnerability. What vulnerability\
    \ does your exploit take advantage of. Then we have platform. This indicates what\
    \ operating system(s) your exploit can attack. Identifying payloads is also important.\
    \ Tell the reader what payloads your exploit can deliver. Notice that all segments\
    \ end with the end statement. Don’t forget this, or you will have errors.\n\n\
    # Examine an Existing Exploit\n\nThe following exploit is part of the Exploit\
    \ Database and can be found at https://www.exploit-db.com/exploits/29035/. We\
    \ will walk through this, hoping it gives you an understanding of what is happening\
    \ on each line.\n\n```\nrequire 'msf/core'\n\nclass Metasploit3 < Msf::Exploit::Remote\n\
    \ninclude Msf::Exploit::Remote::Tcp\n\ndef initialize(info = {})\n  super(update_info(info,\n\
    \    'Name'        => 'SikaBoom Remote Buffer overflow',\n    'Description' =>\
    \ %q{\n      'This module exploits a buffer overflow in SikaBoom.'\n    },\n \
    \   'Module'      => [ 'Asesino04' ],\n    'References'  =>\n    [\n      [ 'Bug',\
    \ 'http://1337day.com/exploit/16672' ],\n```"
  merge: -1
