- pgno: 167
  md: 'Regardless of which specific password cracking tool you use, such tools can
    be very important in verifying the security of your passwords. Essentially, you
    attempt to crack the passwords, and if you are successful, that indicates that
    your passwords are not strong enough.


    # John the Ripper


    John the Ripper may be the oldest and most widely known password cracking tool.
    It is no longer just for Windows either. There are Linux and Macintosh versions
    as well. You can download John the Ripper from http://www.openwall.com/john/.


    John the Ripper is a command-line tool. However, there are full tutorials at http://openwall.info/wiki/john/tutorials.


    # Detecting Malware in Windows


    Remember, a pen tester has a different goal than an attacker. Your goal is to
    improve security. It is also frequently the case that a pen test and an audit/incident
    response/vulnerability scan are done in conjunction. So it is important that you
    have some basic knowledge of how to detect malware on a Windows computer. It is
    not always the case that malware can be detected by antivirus software. Zero-day
    exploits, for example, are difficult to detect because there is not yet any signature
    for them. Zero-day exploits are best described in this quote:


    > > Zero-day refers to how long the “good guys” have known about a security problem
    in the software. There are two kinds of zero-days. A zero-day vulnerability is
    a hole in the software’s security and can be present on a browser or an application.
    A zero-day exploit, on the other hand, is a digital attack that takes advantage
    of zero-day vulnerabilities in order to install malicious software onto a device.

    > >

    > > —Avast, https://www.avast.com/c-zero-day


    So how do you, when doing a penetration test or security audit, determine if such
    malware is present? For Windows computers, at least, it is actually less difficult
    than you may think. There are tools available to look for anomalies on the computer.
    Windows Sysinternals is a set of tools created by Mark Russinovich and available
    from Microsoft at https://docs.microsoft.com/en-us/sysinternals/. This suite of
    tools can check many aspects of a system.


    Process Explorer will show running processes and what process started those processes,
    as demonstrated in Figure 6-11.'
