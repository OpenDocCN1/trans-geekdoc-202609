- pgno: 85
  md: '# Ophcrack


    I would be remiss if I did not mention the long-used tool of the hacking community,
    ophcrack. Ophcrack is important because it can be installed on a bootable CD.
    If used in that manner, you boot the system to the CD, thus circumventing Windows
    security, and proceed to try and crack the passwords. Ophcrack offers a small
    rainbow table free of charge; one must purchase the larger rainbow tables. You
    can download ophcrack from http://ophcrack.sourceforge.net/. It also does not
    require a separate process to dump the Windows SAM file. Instead it will grab
    the data from the SAM file for you. Figure 3-6 shows the output from ophcrack
    (again, the hashes and passwords are redacted).


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_85_0.png)


    FIGURE 3-6 Ophcrack.


    With this, or other tools, you won’t always succeed. As a penetration tester,
    however, you should always try. If you can get the passwords, so can an attacker.


    # Linux Hashes


    We have been focusing on Windows hashes; however, Linux also stores passwords
    as a hash. Linux passwords are stored in the /etc/shadow file. They are salted
    and the algorithm being used depends on the particular distribution and is configurable.
    The /etc/password file is a list of users; the actual passwords are stored in
    /etc/shadow. If you can recover the hash from Linux, you can use the rainbow tables
    previously mentioned to attempt to recover the password.


    # Pass the Hash


    In a pass-the-hash attack, the attacker has the hash, and bypasses the application,
    passing the hash directly to the backend service. Basically, the process is this:
    Applications will take the password the user enters and hash that, sending the
    hash to the backend service or database. If the attacker can get a'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'copy of the hash, he or she can bypass the application and send the hash directly
    to the backend service or database, and log in.


    Whether it is for a pass-the-hash attack or to use in a rainbow table, attackers
    commonly engage in hash harvesting. This is the process of getting hashes from
    any place they can. A few common methods include:


    +   - Dumping the local SAM file from a Windows machine. That file contains password
    hashes for all local users. We saw this previously with pwdump7.

    +   - Using a packet sniffer to get NT and NTLM hashes as they are transmitted,
    if they are transmitted without encryption.

    +   - Getting any cached hashes that might be stored on the local machine. Some
    applications cache the hashed passwords.


    # Password Crackers


    In addition to the tools already mentioned, used to retrieve password hashes,
    there are a variety of tools used by hackers to retrieve passwords from many sources.
    One of the most well known is Cain and Abel. This is another free tool that will
    extract passwords for Wi-Fi, Internet Explorer, and other sources. You can see
    this in Figure 3-7. Again, the passwords are redacted in this image.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_86_0.png)


    FIGURE 3-7 Cain and Abel.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Steganography


    Steganography is the art and science of writing hidden messages in such a way
    that no one, apart from the sender and intended recipient, suspects the existence
    of the message. It is a form of security through obscurity. Often the message
    is hidden in some other file such as a digital picture or audio file to defy detection.


    The advantage of steganography over cryptography alone is that messages do not
    attract attention to themselves. If someone is unaware the message is even there,
    she won’t try to decipher it. In many cases messages are encrypted and hidden
    via steganography.


    The most common implementation of steganography utilizes the least significant
    bits (LSB) in a file in order to store data. By altering the least significant
    bit, you can hide additional data without altering the original file in any noticeable
    way.


    There are some basic steganography terms you should know:


    +   - Payload is the data to be covertly communicated. In other words, it is the
    message you wish to hide.

    +   - The carrier is the signal, stream, or data file into which the payload is
    hidden.

    +   - The channel is the type of medium used. This may be still photos, video,
    or sound files.


    The most common way steganography is accomplished today is via least significant
    bits. In every file, there are a certain number of bits per unit of the file.
    For example, an image file in Windows is 24 bits per pixel. If you change the
    least significant of those bits, then the change is not noticeable with the naked
    eye. And you can hide information in the least significant bits of an image file.
    With least significant bit (lsb) replacement, certain bits in the carrier file
    are replaced.


    # Historical Steganography


    In modern times, steganography means digital manipulation of files to hide messages.
    However, the concept of hiding messages is not new. There have been many methods
    used throughout history.


    +   - The ancient Chinese wrapped notes in wax and swallowed them for transport.
    This was a crude but effective method of hiding messages.

    +   - In ancient Greece, a messenger’s head might be shaved, a message written
    on his head, and then his hair was allowed to grow back. Obviously, this method
    required some time to be available.

    +   - In 1499 Johannes Trithemius wrote a book on cryptography and described a
    technique where a message was hidden by having each letter taken as a word from
    a specific column.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '+   - During WW II the French Resistance sent messages written on the backs
    of couriers using invisible ink.

    +   - Microdots are images/undeveloped film the size of a typewriter period, embedded
    in innocuous documents. These were said to be used by spies during the Cold War.

    +   - Also during the Cold War, the U.S. Central Intelligence Agency used various
    devices to hide messages. For example, they developed a tobacco pipe that had
    a small space to hide microfilm but could still be smoked.


    In more recent times, but before the advent of computers, other methods were used
    to hide messages.


    # Methods and Tools


    There are a number of tools available for implementing steganography. Many are
    free or at least have a free trial version. A few of these tools are listed here:


    +   - **QuickStego:** Easy to use but very limited

    +   - **MP3Stego:** Specifically for hiding payload in MP3 files

    +   - **Stealth Files 4:** Works with sound files, video files, and image files

    +   - **SNOW:** Hides data in whitespace

    +   - **StegVideo:** Hides data in a video sequence

    +   - **Invisible Secrets:** A very versatile steganography tool that has several
    options


    # Simple Stego


    You can also get a free, simple steganography program from my website: http://www.chuckeasttom.com/tutorialsandnotes.htm;
    it is near the bottom of the page. It should be noted that this is absolutely
    not the most sophisticated program available, but it is very easy to use and free!
    You simply type the text you wish to hide, open a carrier image, then click hide.
    You can see this in Figure 3-8.


    # DeepSound


    This program is also free, and is used to hide data in sound files. You can download
    DeepSound from http://jp insoft.net/deepsound/. Note that it can be rather particular
    on the carrier file, meaning some sound files simply won’t work. The process is
    rather simple:


    +   - **STEP 1.** Open a carrier file (some sound file).

    +   - **STEP 2.** Add secret files: one or more files you wish to hide (jpeg,
    text, etc.).

    +   - **STEP 3.** Click **Encode secret files**.'
  merge: -1
  img_proc: true
