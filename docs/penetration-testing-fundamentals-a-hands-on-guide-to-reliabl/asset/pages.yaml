- pgno: 61
  md: '# OWASP


    If your concern is web application security, then the Open Web Application Security
    Project is the logical place to begin your search for standards, frameworks, and
    guidelines. On the OWASP website, https://www.owasp.org, you can find a range
    of resources for web application security. Among other resources is the OWASP
    list of security controls for web developers:¹


    +   1. Verify for Security Early and Often

    +   2. Parameterize Queries

    +   3. Encode Data

    +   4. Validate All Inputs

    +   5. Implement Identity and Authentication Controls

    +   6. Implement Appropriate Access Controls

    +   7. Protect Data

    +   8. Implement Logging and Intrusion Detection

    +   9. Leverage Security Frameworks and Libraries

    +   10. Error and Exception Handling


    Perhaps what OWASP is most well known for is their Top 10 vulnerability list.
    Every few years they publish the top 10 vulnerabilities found in web applications
    the previous year. This is a great place for anyone concerned about web application
    security to begin. At a minimum, you should address these well-known vulnerabilities.


    # Other Standards


    In this section we will review general security standards that are commonly used.
    These standards are not specifically concerning penetration testing. But keep
    in mind, your penetration test is done to test the security of a target system.
    Therefore, referencing security standards can be quite useful. You are testing
    to see if the target has adequate security. It is important to document any case
    where the target fails to meet security standards.


    # ISO 27002


    ISO 27002 is an ISO standard widely used in cyber security. This standard recommends
    best practices for initiating, implementing, and maintaining information security
    management systems (ISMS). The standard itself starts with five introductory chapters
    that just provide some guidance such as terminology'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'and scope of the standard. It is the main chapters that are an issue, starting
    with Chapter 5. They provide recommended best practices on many areas of ISMS.
    A list of the chapters is given here:


    +   - 5. Information Security Policies

    +   - 6. Organization of Information Security

    +   - 7. Human Resource Security

    +   - 8. Asset Management

    +   - 9. Access Control

    +   - 10. Cryptography

    +   - 11. Physical and environmental security

    +   - 12. Operation Security procedures and responsibilities

    +   - 13. Communication security

    +   - 14. System acquisition, development and maintenance

    +   - 15. Supplier relationships

    +   - 16. Information security incident management

    +   - 17. Information security aspects of business continuity management


    One fascinating aspect of this standard, at least from a penetration testing perspective,
    is that each organization is expected to undertake a structured information security
    risk assessment process to determine its specific requirements before selecting
    controls that are appropriate to its particular circumstances. This means that
    using a formal methodology to assess risks is part of the standard. Of course,
    risk assessment does not have to include a penetration test. It could consist
    of other methods such as a risk assessment project, an audit, etc. However, penetration
    testing is quickly becoming a common part of risk assessment and testing.


    # NIST 800-12, Revision 1


    NIST Special Publication 800-12, Rev. 1, provides a broad overview of computer
    security. It primarily deals with areas of security controls. It was written with
    federal agencies in mind, but it can be useful to any security professional. The
    full title of the document is “NIST Special Publication 800-12, Revision 1, An
    Introduction to Information Security.” One of the more important features of this
    document is that it emphasizes the need to address computer security throughout
    the system development lifecycle, not just after the system is developed. You
    can read the entire document, over 100 pages, at http://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-12r1.pdf.
    Again, this'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'is not specific to penetration testing. In fact, it is really about how to
    do computer security. However, when performing a penetration test, one approach
    is to plan the test against certain security standards.


    # NIST 800-14


    NIST Special Publication 800-14 describes common security principles that should
    be addressed within security policies. The purpose of this document is to describe
    8 principles and 14 practices that can be used to develop security policies. A
    significant part of this document is dedicated to auditing user activity on a
    network. Specific requirements include tracking user actions and, in the event
    of any investigation, the ability to reconstruct exactly what a user has done.
    Auditing, monitoring, and intrusion detection are heavily emphasized in this standard.


    The eight principles of Special Publication 800-14 are as follows:


    +   1. Computer security supports the mission of the organization.

    +   2. Computer security is an integral element of sound management.

    +   3. Computer security should be cost-effective.

    +   4. System owners have security responsibilities outside their own organizations.

    +   5. Computer security responsibilities and accountability should be made explicit.

    +   6. Computer security requires a comprehensive and integrated approach.

    +   7. Computer security should be periodically reassessed.

    +   8. Computer security is constrained by societal factors.


    The 14 practice areas of Special Publication 800-14 are as follows:


    +   1. Policy

    +   2. Program Management

    +   3. Risk Management

    +   4. Life Cycle Planning

    +   5. Personnel/User Issues

    +   6. Preparing for Contingencies and Disasters

    +   7. Computer Security Incident Handling

    +   8. Awareness and Training

    +   9. Security Considerations in Computer Support and Operations'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   10. Physical and Environmental Security

    +   11. Identification and Authentication

    +   12. Logical Access Control

    +   13. Audit Trails

    +   14. Cryptography


    This standard provides guidelines for all of these areas. Therefore, it is a good
    place to get guidance on what security should be implemented at a target network.
    You can then tailor your penetration test to validate (or refute) that these standards
    are being met.'
