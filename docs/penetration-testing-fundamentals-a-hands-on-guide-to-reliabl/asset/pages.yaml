- pgno: 197
  md: '# Summary


    This chapter introduced the basics of how websites work, various web hacking techniques,
    and some tools to help you with penetration testing of a website. In Chapter 8
    you will be introduced to vulnerability scanners, then Chapter 13 introduces Metasploit.
    The primary goals of this chapter are that you understand common web attacks,
    and that you have at least some knowledge of some basic techniques and tools.


    # Test Your Skills


    # MULTIPLE CHOICE QUESTIONS


    1. You are carrying out the last round of testing for your new website before
    it goes live. The website has many subpages and connects to a SQL Server backend
    that accesses your product inventory in a database. You come across a web security
    site that recommends inputting the following code into a search field on web pages
    to check for vulnerabilities:


    ```

    <script>alert("Test My Site.")</script>

    ```


    When you type this and click on search, you receive a pop-up window that says:


    ```

    "Test My Site."

    ```


    What is the result of this test?


    +   - A. Your website is vulnerable to web bugs.

    +   - B. Your website is vulnerable to cross-site scripting.

    +   - C. Your website is vulnerable to SQL injection.

    +   - D. Your website is not vulnerable.


    2. Where would you look to enumerate all databases on a Microsoft SQL Server?


    +   - A. master.dbo.sysdatabase

    +   - B. It cannot be done by looking in just one place.

    +   - C. master.dbo.dbmaster

    +   - D. You must look in Active Directory.'
  merge: -1
  img_proc: true
