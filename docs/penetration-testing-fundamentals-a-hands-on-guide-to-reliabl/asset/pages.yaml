- pgno: 360
  md: "![](img/fa54c6d61c14db5421f8f63e6d594bb5_360_0.png)\n\nFIGURE 15-9 Factorial.\n\
    \n# Object-Oriented Programming\n\nAn object is a programming abstraction that\
    \ groups data with the code that operates on it. All programs contain data of\
    \ different types. An object simply wraps all that up in a single place, called\
    \ an object.\n\nThere are four basic concepts of object-oriented programming:\n\
    \n+   - **Abstraction** is basically the ability to think about concepts in an\
    \ abstract way. You can create a class for an employee, without having to think\
    \ about a specific employee. It is abstract and can apply to any employee.\n+\
    \   - **Encapsulation** is really the heart of object-oriented programming. This\
    \ is simply the act of taking the data and the functions that work on that data\
    \ and putting them together in a single class. Think back to our coverage of strings,\
    \ and the string class. The string class has the data you need to work on (i.e.\
    \ the particular string in question) as well as the various functions you might\
    \ use on that data, all wrapped into one class.\n+   - **Inheritance** is a process\
    \ whereby one class inherits, or gets, the public properties and methods of another\
    \ class. The classic example is to create a class called animal. This class has\
    \ properties such as weight, and methods such as move and eat. All animals would\
    \ share these same properties and methods. When you wish to create a class for,\
    \ say, a monkey, you then have class monkey inherit from class animal, and it\
    \ will have the same methods and properties that animal has. This is one way in\
    \ which object-oriented programming supports code reuse.\n+   - **Polymorphism**\
    \ literally means \"many forms.\" When you inherit the properties and methods\
    \ of a class, you need not leave them as you find them. You can alter them in\
    \ your own class. This will allow you to change the form which those methods and\
    \ properties take.\n\nIn Ruby, a class is defined by the class statement. This\
    \ is seen in the following, rather trivial, example:\n\n```\nclass person {\n\n\
    \    @@age = 0\n    @@name = \"doe\"\n    def increaseage {\n    }\n}\n```"
  merge: -1
  img_proc: true
