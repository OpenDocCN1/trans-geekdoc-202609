- pgno: 90
  md: 'Steganography is commonly used to hide data. Often, technically sophisticated
    insiders wishing to exfiltrate data will use steganography. A penetration tester
    should attempt to email out of the target network, something hidden in another
    file steganographically. Most network security won’t detect the hidden file, or
    even notice the email attachment.


    # Cryptanalysis


    Cryptanalysis is a daunting task. It is essentially the search for some means
    to break through some encryption. And, unlike what you see in the movies, it is
    a very time-consuming task that frequently leads to only partial success. Cryptanalysis
    involves using any method to decrypt the message that is more efficient than simple
    brute force attempts. Remember that brute force is simply trying every possible
    key.


    A cryptanalysis success is not necessarily breaking the target cipher. In fact,
    finding any information about the target cipher or key is considered a success.
    There are several types of cryptographic success:


    +   - **Total break:** The attacker deduces the secret key.

    +   - **Global deduction:** The attacker discovers a functionally equivalent algorithm
    for encryption and decryption but without learning the key.

    +   - **Instance (local) deduction:** The attacker discovers additional plaintexts
    (or ciphertexts) not previously known.

    +   - **Information deduction:** The attacker gains some Shannon information about
    plaintexts (or ciphertexts) not previously known. The concept of Shannon information
    is beyond the scope of this chapter; for now I will give an oversimplified definition:
    any bit of information you did not previously have.

    +   - **Distinguishing algorithm:** The attacker can distinguish the cipher from
    a random permutation.


    Entire books have been written on cryptanalysis. The purpose of this section is
    just to give you some basic concepts from the field so that you have a general
    understanding at a basic level. There are certainly other methods not discussed
    in this section.


    # Frequency Analysis


    Frequency analysis is the basic tool for breaking most classical ciphers. It is
    not useful against modern symmetric or asymmetric cryptography. It is based on
    the fact that some letters and letter combinations are more common than others.
    In all languages, certain letters of the alphabet appear more frequently than
    others. By examining those frequencies, you can derive some information about
    the key that was used. Remember in English that the words the and and are the
    two most common three-letter words. The most common single-letter words are I
    and a. If you see two of the same letters together in a word, it is most likely
    ee or oo.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Modern Methods


    Cracking modern cryptographic methods is quite daunting. The level of success
    depends on a combination of resources. Those resources are computational power,
    time, and data. If you had an infinite amount of any of these, you could crack
    any modern cipher. But you won’t have an infinite amount.


    # Known Plaintext Attack


    This method is based on having a sample of known plaintexts and their resulting
    ciphertexts and then using this information to try to ascertain something about
    the key used. It is easier to obtain known plaintext samples than you might think.
    Consider email. Many people, myself included, use a standard signature block.
    If you have ever received an email from me, you know what my signature block is.
    Then if you intercept encrypted emails I send, you can compare the known signature
    block to the end of the encrypted email. You would then have a known plaintext
    and the matching ciphertext to work with. This requires many thousands of known
    plaintext samples to be successful.


    # Chosen Plaintext Attack


    This is closely related to the known plaintext attack, the difference being that
    the attacker has found a method to get the target to encrypt messages the attacker
    chooses. This can allow the attacker to attempt to derive the key used and thus
    decrypt other messages encrypted with that key. The method can be difficult but
    is not impossible. It requires many thousands of chosen plaintext samples to be
    successful.


    # Ciphertext-Only Attack


    The attacker only has access to a collection of ciphertexts. This is much more
    likely than known plaintext, but also the most difficult. The attack is completely
    successful if the corresponding plaintexts can be deduced, or even better, if
    the key can. The ability to obtain any information at all about the underlying
    plaintext is still considered a success.


    # Related-Key Attack


    This is like a chosen plaintext attack, except the attacker can obtain ciphertexts
    encrypted under two different keys. This is actually a very useful attack if you
    can obtain the plaintext and matching ciphertext.


    These are the basic approaches used to attack block ciphers. There are other methods
    that are beyond the scope of this book, such as differential cryptanalysis and
    linear cryptanalysis. For the purposes of understanding basic computer security,
    it is not necessary that you master these techniques.


    # The Birthday Paradox


    There is a mathematical puzzle that can help get around hashed passwords. It is
    called the birthday paradox (sometimes called the birthday problem). The issue
    is this: How many people would you need to have in a room to have a strong likelihood
    that two would have the same birthday (i.e. month and'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'day, not year)? Obviously, if you put 367 people in a room, at least two of
    them must have the same birthday, since there are only 365 days in a year + February
    29 in a leap year. However, we are not asking how many people you need to guarantee
    a match, just how many you need to have a strong probability. It just so happens
    that with even 23 people in the room, you have a 50% chance that two have the
    same birthday.


    How is this possible? How is it that such a low number can work? Basic probability
    tells us that when events are independent of each other, the probability of all
    of the events occurring is equal to a product of the probabilities of each of
    the events. So, the probability that the first person does not share a birthday
    with any previous person is 100%, since there are no previous people in the set.
    That can be written as 365/365. Now for the second person there is only one preceding
    person, and the odds that the second person has a different birthday than the
    first are 364/365. For the third person there are two preceding people he or she
    might share a birthday with, so the odds of having a different birthday than either
    of the two preceding people are 363/365. Since each of these are independent,
    we can compute the probability as follows:


    365/365 * 364/365 * 363/365 * 362/365 ... * 342/365 (342 is the probability of
    the 23rd person sharing a birthday with a preceding person)


    Let us convert these to decimal values, which yields (truncating at the third
    decimal point) the following:


    1 * 0.997 * .994 * .991 * .989 * .986 * ... .936 = .49 or 49%


    This 49% is the probability that they will not have any birthdays in common; thus,
    there is a 51% (better than even odds) that 2 of the 23 will have a birthday in
    common.


    Just for reference, if you have 30 people, the probability that 2 have the same
    birthday is 70.6%. If you have 50 people, the probability rises to 97%, which
    is quite high. This does not simply apply to birthdays. The same concept can be
    applied to any set of data. It is often used in cryptography and cryptanalysis.


    In reference to cryptographic hash functions, the goal is to find two different
    inputs that produce the same output. When two inputs produce the same output from
    a cryptographic hash, this is referred to as a collision. It just so happens that
    the number of samples from any set of n elements required to get a match or collision
    is 1.174 √n. Returning to the preceding birthday problem, 1.174 √365 = 22.49.


    You can apply this to other cryptographic issues. Generally, the birthday paradox
    is applied to hashes. If you are trying to find a collision (i.e. a value that
    produces the same hash), the birthday paradox tells you that it may not take as
    long as you would think.


    # Practical Application


    As was mentioned earlier in this chapter, you are not likely to crack any modern
    encryption, at least not in any time that is useful. The previously discussed
    methods are more for your education than for actual application. So, what do you
    do to attempt to circumvent file encryption, or full disk encryption?


    Remember that encryption software uses passwords. The user enters a password to
    decrypt the file or drive. Therefore, the same methods used to retrieve passwords
    can be used to attempt to bypass encryption. Notice, I said bypass encryption,
    not break it. So, what are the methods?'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'First attempt passwords you have retrieved from other sources. For example,
    a password retrieved from a Windows SAM file might be quite similar to a password
    used for file encryption. You might even notice a pattern of passwords; perhaps
    they are all related to some particular sports team.


    Second, simply attempt passwords related to the person in question. People often
    pick passwords that match their hobbies and interests. It is always amazing to
    me how often companies use passwords that are related to their industry or company
    name.


    # Other Passwords


    Particularly with email and hard drive encryption, there is usually some password
    the user must know in order to decrypt the information and access it. Many hard
    drive encryption tools utilize very strong encryption. For example, Microsoft
    BitLocker uses AES with a 128-bit key. Several open source hard drive encryption
    tools use AES with a 256-bit key. It is simply not feasible to break the key.
    However, it is entirely possible that the user has utilized the same password
    (or a substantially similar permutation) somewhere else, for example with their
    email account, or with their Windows password. For example, you may wish to use
    ophcrack on the user’s Windows computer and take those passwords (and again use
    permutations of those passwords as well) to try and decrypt the encrypted partition
    or email.


    Many people are not even aware that their email password has been cracked. Several
    websites keep lists of email accounts that have been breached. The most popular
    is


    https://haveibeenpwned.com


    If, for example, you are a law enforcement officer attempting to breach an encrypted
    drive belonging to a suspect, you may wish to check these sites to see if that
    suspect’s email account has been breached. You can then use the email password,
    and close permutations, to attempt to decrypt the hard drive.


    # Learning More


    As I mentioned in the introduction of this chapter, a single chapter cannot make
    you an expert in cryptography. For some readers, the information contained in
    this chapter was all they really wanted to know. And in fact, it is enough for
    you to perform penetration tests. For those readers who wish to know more, however,
    allow me to share a few resources.


    First, I point you to a wonderful online cryptography course, taught by a very
    well-respected cryptographer, Professor Dan Boneh. Dr. Boneh is one of the most
    respected cryptographers in the world today, and he is an excellent teacher. He
    has been kind enough to put his entire introduction to cryptography course online.
    This is the same introduction to cryptography course Dr. Boneh teaches at Stanford
    University, and you can access it via https://www.coursera.org/learn/crypto. I
    strongly recommend his course.


    Allow me to also shamelessly suggest one of my own books, Modern Cryptography.
    This book is unique in the cryptographic world in that it is meant for people
    with limited mathematics. I must point out, however, that the book glosses over
    topics like mathematical proofs, and gives only the briefest coverage of higher
    math. The book is intended as a gateway for the non-cryptographer. It is intended'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'that after reading that book, the reader will move on to one of the more mathematically
    rigorous texts that I will mention here.


    *Cryptography and Network Security* by William Stallings is an excellent text.
    It covers all the essentials you need to know. It delves a bit deeper into the
    math than my own book, but not so deep as to lose the non-mathematician.


    *Introduction to Modern Cryptography* by Jonathan Katz and Yehuda Lindell is a
    pretty good book. It is certainly technically accurate, and more mathematically
    rigorous than either my book or the Stallings book, but it can be difficult to
    read for the novice.


    *An Introduction to Number Theory with Cryptography* by James Kraft and Lawrence
    Washington is very good, but delves deeper into the math, as the name suggests.


    My advice, if you really want to delve into cryptography, is to start with the
    online course by Professor Boneh. You can watch the videos multiple times. Frankly,
    after his course, you probably won’t need my cryptography book. But if you wish
    you may read that as well. Then, depending on how comfortable you are with the
    topic at that point, move next to either the Stallings book or the Katz and Lindell
    book. Alternatively, you might try my cryptography book and then move on to the
    Kraft and Washington book.


    Whatever path you choose, you should realize that cryptography is a complex topic
    and you will need to progress with it. You won’t read a single book and then be
    a master of cryptography.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Summary


    Cryptography is a complex topic, and a penetration tester need not be a cryptographer
    or cryptanalyst. However, a basic working knowledge of cryptography is useful
    for a penetration tester. It is unlikely that you will have any success “cracking”
    modern encryption. However, you may find various methods for circumventing encryption
    to be useful. Password retrieval is also a task every penetration test should
    include.


