- pgno: 221
  md: "# Summary\n\nThis chapter examined several packet sniffers, network scanners,\
    \ and vulnerability scanners. Each of these tools can provide an automated assessment\
    \ of vulnerabilities that exist on a given computer, web application, or network.\
    \ Vulnerability scanning can be a preliminary step in identifying attack vectors\
    \ for a penetration test, or it can be a separate test in and of itself. It is\
    \ important, however, to keep in mind that a vulnerability scan is not a penetration\
    \ test.\n\nCyber threat intelligence can help your penetration testing approach\
    \ be focused on the current and emerging threats. If you are not aware of the\
    \ current dangers to a target network, then your penetration test will be, at\
    \ most, incomplete.\n\n# Test Your Skills\n\n# MULTIPLE CHOICE QUESTIONS\n\n+\
    \   1. Which of the following is an automated general vulnerability assessment\
    \ tool?\n+      A. Nmap\n+      B. Nessus\n+      C. OWASP ZAP\n+      D. Wireshark\n\
    +   \n+   2. Which of the following commands will cause Aircrack to dump the contents\
    \ of a wireless access point with a bssid 00:01:02:03:04:05?\n+      A. airodump-ng\
    \ -c 11 --bssid 00:01:02:03:04:05 -w dump interface\n+      B. airodump-ng -c\
    \ 11 --bssid 00:01:02:03:04:05 dump interface\n+      C. airodump-ng --bssid 00:01:02:03:04:05\
    \ -w dump interface\n+      D. airodump-ng -c 11 --bssid 00:01:02:03:04:05 -w\
    \ dump\n+   \n+   3. What will the tcpdump -i eth0 command do?\n+      A. Dump\
    \ all packets except for those on eth0\n+      B. Dump all packets regardless\
