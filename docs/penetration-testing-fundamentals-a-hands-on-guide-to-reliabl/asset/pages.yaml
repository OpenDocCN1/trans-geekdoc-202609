- pgno: 350
  md: '# Chapter 15


    # Introduction to Scripting with Ruby


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand the basics of Ruby scripting

    +   - Write basic Ruby scripts

    +   - Read and understand Ruby scripts


    Ruby is the language used for Metasploit. As such, it is a key skill if you wish
    to write your own Metasploit payloads. In this chapter you will see a general
    introduction to Ruby. If you have some experience programming on another language
    (C++, Java, PHP, etc.) then this will probably be the easiest and fastest chapter
    in this book. If you require more help, at the end of the chapter, I will direct
    you to some additional tutorials on the Internet. In either case, the goal of
    this chapter is not to make you a master Ruby programmer. That would be beyond
    the scope of a single chapter; however, the goal is to get you to understand Ruby
    well enough that you can read Ruby code.


    Ruby is an object-oriented programming language. It was created in 1993 by Yukihiro
    Matsumoto of Japan. It has become quite popular in recent years. It is used in
    many contexts. For example, Ruby on Rails is a server-side web programming framework
    that is quite popular.


    # Getting Started


    You first need to install the Ruby environment. You have several options. If you
    are using Windows, then start here: https://rubyinstaller.org/. Users of Linux
    or Macintosh should start here: https://www.ruby-lang.org/en/downloads/.


    Or, some very helpful people have set up an online Ruby environment for you to
    practice with:


    https://www.tutorialspoint.com/ruby_terminal_online.php'
  merge: -1
  img_proc: true
