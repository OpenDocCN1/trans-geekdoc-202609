    have intermittent success. The exploit, illustrated in Figure 14-15, is **exploit/windows/local/ms14_058_track_popup_menu**.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_344_0.png)


    This exploit is based on a vulnerability in win32k.sys that involves NULL pointer
    dereferencing. It is used in the TrackPopupMenu API call, and under some circumstances
    can be used to execute code. The authors of this exploit claim it has been successfully
    executed on Windows Server 2003 SP2, Windows 2008 R2, as well as Windows 7. You
    can get more details on this attack at https://www.rapid7.com/db/modules/exploit/windows/local/ms14_058_track_popup_menu.


    # Attacking Windows via Office


