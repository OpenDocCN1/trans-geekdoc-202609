- pgno: 380
  md: 'You should be aware that these sites come and go. Some may not be up and running
    by the time you read this. Before you begin surfing the dark web, you should be
    aware that it is inherently dangerous. Certainly, the traditional web has its
    share of scams, malware, and other dangers. But the dark web is simply awash in
    such dangers. Before you begin searching the dark web, I strongly advise you to
    take the following safety measures.


    Many websites have spyware, viruses, and other malware. Therefore, one must establish
    a specific environment for dark web activities. That environment should be a virtual
    machine that is completely isolated from the host operating system. That means,
    no sharing of the clipboard or folders. The virtual machine is preferably of a
    different operating system than the host, making crossing the VM barrier even
    more difficult. And finally, that VM should only be used for the dark web activities,
    and for no other purpose. That way, if it should become infected with spyware,
    the person controlling the spyware will not gain information about the investigator’s
    real identity.


    It is also possible to penetration test a dark web market. As with traditional
    penetration testing, this begins with finding vulnerabilities in the dark web
    market site. Fortunately, tools are emerging that assist in this endeavor. The
    website ichidan (http://ichidanv34wrx7m7.onion) tracks vulnerabilities in dark
    web sites. This site operates similarly to the traditional Internet site shodan.io,
    which is a search engine for vulnerabilities in normal websites. Figure 17-3 shows
    ichidan used to search for default values on any dark website.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_380_0.png)


    FIGURE 17-3 ichidan Search.


    The dark web should be part of your assessment of a given organization’s security.
    If that company’s data is for sale on the dark web, there has already been some
    breach of the company’s security. In project 2 at the end of the chapter, you
    will actually see exactly how to connect to the dark web and conduct a search.'
