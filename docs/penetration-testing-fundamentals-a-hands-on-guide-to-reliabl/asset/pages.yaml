- pgno: 148
  md: '# Chapter 6


    # Hacking Windows


    # Chapter Objectives


    After reading this chapter and completing the exercises, you will be able to do
    the following:


    +   - Understand the basics of the Windows operating system

    +   - Have a working knowledge of Windows password storage

    +   - Understand several techniques for hacking Windows


    In this chapter, we will examine specific techniques used to hack into Windows
    systems. Because Windows is a ubiquitous operating system, these skills are particularly
    important for a penetration tester. We will begin by examining the Windows operating
    system, and ensuring you have a working knowledge of Windows. The reality of hacking
    is that the more thoroughly you understand the system you are hacking, the more
    successful you will be. This is equally true for penetration testing. The opposite
    is also true. The less you understand the system, the less complete and accurate
    your test will be.


    It should also be noted that we will be examining Metasploit later in Chapter
    13, “Introduction to Metasploit,” and Chapter 14, “More with Metasploit.” At that
    time you will see additional Windows hacking techniques. The goal in this chapter
    is to ensure you have a basic working knowledge of Windows, and you are familiar
    with basic Windows hacking techniques.


    # Windows Details


    Before delving deeply into Windows penetration testing, it is a good idea to get
    a better idea of the operating system itself. In this section, you learn about
    the history of Windows and its structure. For deeper coverage of Windows internals,
    refer to the book Windows Sysinternals Administrator’s Reference by Mark E. Russinovich
    and Aaron Margosis.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Windows History


    Windows became mainstream with the release of version 3.1 in 1992. At that time,
    Windows was a graphical user interface (GUI), and not really an operating system.
    The operating system was Disk Operating System (DOS). Windows provided a visual
    interface for interacting with the operating system by means of mouse clicks,
    rather than typing in DOS commands.


    For servers and IT professionals, Microsoft had Windows NT Versions 3.1, 3.51,
    and 4.0, which were widely used. Each version had both workstation and server
    editions. The NT version of Windows was widely considered more stable and more
    secure than Windows 3.1.


    The release of Windows 95 in 1995 marked a change in Windows. At this point, the
    underlying operating system and the GUI were no longer separate items. Instead
    they were one product. This means that the GUI was the operating system. Shortly
    after the release of Windows 95, Windows NT 4.0 was released. Many consider Windows
    98 just an intermediate step, an improvement on Windows 95. The interface looked
    very much the same as Windows 95, but the performance was improved. Windows 95
    and 98 used the FAT32 file system.


    Windows 2000 was widely considered a major improvement in the Windows line. Essentially,
    the days of separate NT and Windows lines were over. Now there would simply be
    different editions of Windows 2000. There were editions for home users, for professional
    users, and for servers. The differences among the editions were primarily in the
    features available and the capacity, such as how much random access memory (RAM)
    could be addressed. Windows 2000 was also the version of Windows wherein Microsoft
    began to recommend NTFS over FAT32 as a file system.


    Windows XP was the next milestone for Microsoft, and Windows Server 2003 was released
    the same year. This marked a return to the approach of having a separate server
    and desktop system (unlike Windows 2000). The interface was not very different,
    but there were structural improvements.


    Windows Vista and Windows 7 did not have significantly different user interfaces
    from XP. There were feature changes and additional capabilities, but essentially
    the interface was moderately tweaked with each version. The same can be said of
    the relationship between Windows Server 2008 and Windows Server 2003. Someone
    comfortable with Windows Server 2003 would have no problem working with Windows
    Server 2008. In fact, the next major developmental change in Windows Server was
    Windows Server 2012. The interface was a bit different, and there were more options
    for different types of installation.


    Windows 8 was a radical change. The operating system is meant to be more like
    that of a tablet. You can get to a desktop that looks much like Windows 7, but
    the default behavior of Windows 8 is tablet-like.


    Windows 10 was another dramatic change for Windows. New features like Cortana
    and the Edge browser have changed the way users interact with the Windows operating
    system, and in some cases changed the way you approach penetration testing. Windows
    Server 2016 was also available at about the same time.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'A Brief History of Windows:


    +   - 1985 Windows 1.0 opened

    +   - 1990 Windows 3.0

    +   - 1992 Windows 3.1

    +   - 1995 Windows 95

    +   - 1996 Windows NT 4.0

    +   - 1998 Windows 98

    +   - 2000 Windows 2000

    +   - 2001 Windows XP (first 64-bit version)

    +   - 2003 Windows XP with Windows Server 2003

    +   - 2007 General release of Windows Vista

    +   - 2008 Windows Vista Home Basic, Home Premium, Business, and Ultimate; Windows
    Server 2008

    +   - 2009 Windows 7 and Windows Server 2008 R2

    +   - 2012 Windows 8 and Windows Server 2012

    +   - 2013 Windows Server 2012 R1

    +   - 2015 Windows 10

    +   - 2016 Windows Server 2016


    This brief history and overview of Windows should give you a context for understanding
    Windows.


    # The Boot Process


    An important part of any operating system is the boot process. In order to truly
    understand Windows, you must have at least some idea of how the system boots up.
    The following is a summary of the basic process:


    +   1. The BIOS conducts the power-on self-test (POST). This is when the system’s
    basic input/output system (BIOS) checks to see if the drives, keyboard, and other
    key items are present and working. This occurs before any operating system components
    are loaded.

    +   2. The computer reads the master boot record (MBR) and partition table.

    +   3. The MBR locates the boot partition. This is the partition that has the
    operating system on it.

    +   4. The MBR passes control to the boot sector on the boot partition.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '+   5. The boot sector loads NTLDR. NTLDR is the NT loader; it is the first
    part of the Windows operating system and is responsible for preparing and loading
    the rest of the operating system.

    +   6. Note that if instead of being shut down, Windows has been put in the hibernation
    state, the contents of hiberfil.sys are loaded into memory, and the system resumes
    at the previous state.

    +   7. NTLDR switches from real mode to 32-bit memory or 64-bit depending on the
    system. Real mode is the default for x86 systems. It provides no support for memory
    protection, multitasking, or code privilege levels.

    +   8. NTLDR starts minimal file system drivers (FAT, FAT32, NTFS).

    +   9. NTLDR reads boot.ini and displays the boot loader menu. If there are multiple
    operating systems, they will be displayed.

    +   10. NTLDR loads NTOSKRNL and passes hardware information. NTOSKRNL is the
    actual kernel for the Windows operating system. This is the end of the *boot phase*
    and the beginning of the *load phase*.

    +   11. NTLDR loads hal.dll (hardware abstraction layer).

    +   12. NTLDR loads the system hive (i.e., the Registry) and reads in settings
    from it.

    +   13. Kernel initialization begins (the screen turns blue).

    +   14. The services load phase begins.

    +   15. The Win32 subsystem start phase begins.

    +   16. The user logs on.


    Knowing the boot order can allow you to diagnose issues that might prevent booting
    the system, to understand when encryption is implemented, and more. Some viruses
    infect the boot sector and, thus, are loaded when the system loads and can affect
    how the system loads. These are all good reasons to understand the boot order,
    at least in a general way.


    # Important Windows Files


    Windows has a number of files. If you look at the Task Manager, you see many processes/programs
    running. Clever virus and spyware writers give their malware a name that is similar
    to these system processes. This makes a casual observer think these are part of
    the operating system. A few of the more important Windows files are listed here:


    +   - **Ntdetect.com:** A program that queries the computer for basic device/config
    data like time/date from CMOS, system bus types, disk drives, ports, and so on

    +   - **Ntbootdd.sys:** A storage controller device driver

    +   - **Ntoskrnl.exe:** The core of the operating system'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   - **Hal.dll:** An interface for hardware

    +   - **Smss.exe:** A program that handles services on your system

    +   - **Winlogon.exe:** The program that logs you on

    +   - **Lsass.exe:** The program that handles security and logon policies

    +   - **Explorer.exe:** The interface the user interacts with, such as the desktop,
    Windows Explorer, and so on

    +   - **Crss.exe:** The program that handles tasks like creating threads, console
    windows, and so forth


    When examining a system, looking to see if it is infected with malware, you need
    to have some understanding of major system applications. It is common for malware
    to be given a name similar to a system process. If you see a running process with
    a similar name (for example, Lsassx.exe), that could indicate the presence of
    malware.


    # Windows Logs


    All versions of Windows support logging; however, the method to get to the log
    can vary from one version to another. With Windows 10 and Windows Server 2012,
    and now Server 2016, you find the logs by clicking on the Start button in the
    lower-left corner of the desktop and then clicking Control Panel. You then select
    Administrative Tools (icons view) and then Event Viewer. You would check for the
    following logs:


    +   - **Security log:** This is probably the most important log from a security
    point of view. It has both successful and unsuccessful logon events.

    +   - **Application log:** This log contains various events logged by applications
    or programs. Many applications record their errors here in the Application log.

    +   - **System log:** The System log contains events logged by Windows system
    components. This includes events like driver failures. This particular log is
    not as interesting from a security perspective as the other logs are.

    +   - **ForwardedEvents log:** The ForwardedEvents log is used to store events
    collected from remote computers. This has data in it only if event forwarding
    has been configured.

    +   - **Applications and Services logs:** These logs are used to store events
    from a single application or component rather than events that might have systemwide
    impact.


    Windows servers have similar logs; however, it is possible that the logs will
    be empty. For example, the tool auditpol.exe can turn logging on and off. Savvy
    criminals might turn the logging off while they do their misdeeds, and then turn
    it back on.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'In the Security log, you will find numbers designating entries. It is beyond
    the scope of this text to cover all of them, but a few common issues of concern
    are discussed here:


    +   - **4902:** Changes to the audit policy such as using Auditpol.exe. Auditpol.exe
    is a tool for admins to change policies; however, hackers sometimes use it to
    temporarily turn off logging. Seeing this number in the log may indicate a hacker
    was in your system and disabled logging.

    +   - **4741:** A computer account was created. Obviously, accounts are created
    in normal network operations. But, if this account creation cannot be accounted
    for by network administrators, then an attacker may have created this account.
    This is closely related to 4742, which shows a computer account was changed.

    +   - **4782:** The password hash account was accessed. Again, this can occur
    during normal operations, but you do want to check and see if it is accounted
    for by normal operations.

    +   - **4728:** A member was added to a security-enabled global group. If your
    administrators can account for this, then it is normal operations. If not, then
    it could indicate an attacker was elevating privileges and now has wider access
    to your network.


    # The Registry


    What is the Registry? It is a repository for all the information on a Windows
    system. When you install a new program, its configuration settings are stored
    in the Registry. When you change the desktop background, that is also stored in
    the Registry.


    While the following excerpt is old, it still applies. And the fact that it has
    applied for so many years indicates how critical the Windows Registry is. According
    to a Microsoft TechNet article by Joan Bard:


    > > “With few exceptions, all 32-bit Windows programs store their configuration
    data, as well as your preferences, in the Registry, while most 16-bit Windows
    programs and MS-DOS programs don’t— they favor the outdated INI files (text files
    that 16-bit Windows used to store configuration data) instead. The Registry contains
    the computer’s hardware configuration, which includes Plug and Play devices with
    their automatic configurations and legacy devices. It allows the operating system
    to keep multiple hardware configurations and multiple users with individual preferences.
    It allows programs to extend the desktop with such items as shortcut menus and
    property sheets. It supports remote administration via the network. Of course,
    there’s more. But this serves as a good introduction to what the Registry does.”


    As you will see in this section, there is a great deal of information you can
    gather from the Registry, which is why it is important to have a thorough understanding
    of Windows. You may also wish to experiment with malware that can read or write
    to the Registry. But, first, how do you get to the Registry? The usual path is
    through the tool regedit. In Windows 10 and Server 2016, you select Start, then
    Run, and then type in regedit. In Windows 8, you need to go to the applications
    list, select All Apps, and then find regedit.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'The Registry is organized into five sections, referred to as hives. Each of
    these sections contains specific information that can be useful to you. The five
    hives are described here:


    +   1. HKEY_CLASSES_ROOT (HKCR): This hive stores information about drag-and-drop
    rules, program shortcuts, the user interface, and related items.

    +   2. HKEY_CURRENT_USER (HKCU): This hive is very important. It stores information
    about the currently logged-on user, including desktop settings, user folders,
    and so forth.

    +   3. HKEY_LOCAL_MACHINE (HKLM): This hive contains those settings common to
    the entire machine, regardless of the individual user.

    +   4. HKEY_USERS (HKU): This hive has profiles for all the users, including their
    settings.

    +   5. HKEY_CURRENT_CONFIG (HCU): This hive contains the current system configuration.


    You can see these five hives in Figure 6-1.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_154_0.png)


    FIGURE 6-1 Windows Registry Hives.


    As you move forward in this section and learn where to find certain critical values
    in the Registry, keep in mind the specific hive names.


    # USB Information


    One important thing you can find in the Registry is any USB devices that have
    been connected to the machine.


    The Registry key HKEY_LOCAL_MACHINE\System\ControlSet\Enum\USBTOR lists USB devices
    that have been connected to the machine. It is often the case that a criminal
    will move evidence or exfiltrate other information to an external device and take
    it with him or her. This could indicate to you'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'that there are devices you need to find and examine. Often, criminals attempt
    to move files offline onto an external drive. This Registry setting tells you
    about the external drives that have been connected to this system.


    There are other keys related to USBSTOR that provide related information. For
    example, SYSTEM\MountedDevices allows investigators to match the serial number
    to a given drive letter or volume that was mounted when the USB device was inserted.
    This information should be combined with the information from USBSTOR in order
    to get a more complete picture of USB-related activities.


    The Registry key \Software\Microsoft\Windows\CurrentVersion\Explorer\MountPoints2
    will indicate which user was logged onto the system when the USB device was connected.
    This allows the investigator to associate a specific user with a particular USB
    device.


    # Wireless Networks


    Think, for just a moment, about connecting to a Wi-Fi network. You probably had
    to enter some passphrase. But you did not have to enter that passphrase the next
    time you connected to that Wi-Fi, did you? That information is stored somewhere
    on the computer, but where? It is stored in the Registry.


    When an individual connects to a wireless network, the service set identifier
    (SSID) is logged as a preferred network connection. This information can be found
    in the Registry in the HKLM\SOFTWARE\Microsoft\WZCSVC\Parameters\Interfaces key.


    The Registry key HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\NetworkList\Profiles\
    gives you a list of all the Wi-Fi networks to which this network interface has
    connected. The SSID of the network is contained within the Description key. When
    the computer first connected to the network is recorded in the DateCreated field.


    The Registry key HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\NetworkList\Signatures\Unmanaged\{ProfileGUID}
    stores the MAC address of the wireless access point to which it was connected.


    # Tracking Word Documents in the Registry


    Many versions of Word store a PID_GUID value in the Registry—for example, something
    like: { 1 2 3 A 8 B 2 2 - 6 2 2 B - 1 4 C 4 - 8 4 A D - 0 0 D 1 B 6 1 B 0 3 A
    4 }. The string 0 0 D 1 B 6 1 B 0 3 A 4 is the MAC address of the machine on which
    this document was created. In cases involving theft of intellectual property,
    espionage, and similar crimes, tracking the origin of a document can be very important.
    This is a rather obscure aspect of the Windows Registry that is not well known.


    # Malware in the Registry


    If you search the Registry and find HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon,
    it has a value named Shell with default data Explorer.exe. Basically, it tells
    the system to launch Windows Explorer when the logon is completed. Some malware
    append the malware executable file to the default values data, so that the malware
    will load every time the system launches. It is important to check this Registry
    setting if you suspect malware is an issue.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'The key HKLM\SYSTEM\CurrentControlSet\Services\ lists system services. There
    are several examples of malware that install as a service, particularly backdoor
    software. So again, check this key if you suspect malware is an issue.


    # Uninstalled Software


    An intruder who breaks into a computer might install software on that computer
    for various purposes such as recovering deleted files or creating a back door.
    The intruder will then, most likely, delete the software he or she used. It is
    also possible that an employee who is stealing data might install steganography
    software so he or she can hide the data. He or she will subsequently uninstall
    that software. The HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall key
    lets you see all the software that has been uninstalled from this machine. Even
    if you uninstall some hacking tool, it is likely that this Registry key will still
    have a record of the software having been on the machine.


    # Passwords


    If the user tells Internet Explorer to remember passwords, then those passwords
    are stored in the Registry and you can retrieve them. The following key holds
    these values:


    HKCU\Software\Microsoft\Internet Explorer\IntelliForms\SPW


    Note in some versions of Windows the ending will be \IntelliForms\Storage 1.


    Any source of passwords is particularly interesting. It is not uncommon for people
    to reuse passwords. Therefore, if you are able to obtain passwords used in one
    context, they may be the same passwords used in other contexts.


    # UserAssist


    UserAssist is a feature of Windows 2000 and later. Its purpose is to help programs
    launch faster. For this reason, it maintains a record of programs that have been
    launched. By examining the appropriate Registry key for UserAssist, one can view
    all the programs that have been executed on that machine. This information is
    stored in the Registry (HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\UserAssist),
    but it’s encrypted, so you’ll need something like the free UserAssist tool to
    find out more.


    You can get the UserAssist tool from https://www.downloadcrew.com/article/23805-userassist.


    # Prefetch


    Prefetch is a technique introduced in Windows XP. Most, if not all, Windows programs
    depend on a range of dynamic-link libraries (DLLs) to function. To speed up the
    performance of these programs, Windows keeps a list of all the DLLs a given executable
    needs. When the executable is launched, all the DLLs are “fetched.” The intent
    is to speed up software, but a side benefit is that the Prefetch entry keeps a
    list of how many times an executable has been run, and the last date/time it was
    run. This has been replaced by similar technologies such as Superfetch.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Each Prefetch file has a 4-byte signature (at offset 4) “SCCA” (or in hexadecimal
    notation 0x53 0x43 0x43 0x41). The signature is assumed to be preceded by a 4-byte
    format version indicator: 17 for Windows XP, 30 for Windows 10, etc. The files
    can be found in %SystemRoot%\Prefetch. Prefetch files end with a .pf extension.
    Superfetch files end in Ag*.db, Ag*.db.trx. There are limits to how many Prefetch
    files are kept, but that changes with different versions of Windows.


    # Volume Shadow Copy


    Windows Volume Shadow Copy keeps a record or copy of changes. These state changes
    are stored in blocks of data that are compared daily, and changed blocks are copied
    to Volume Shadow. The Volume Shadow Copy service runs once per day and uses 16-KB
    blocks of data. In differential copies of VSC, only the changes are backed up,
    on a cluster-by-cluster basis. For a full copy or clone, entire files are backed
    up. This can be an excellent place to seek evidence that the suspect may not even
    be aware is available.


    # Windows Password Hashing


    One common task of any penetration tester, or hacker, is to attempt to retrieve
    passwords from a Windows system. Therefore, it is important to understand how
    Windows stores passwords. All versions of Windows store passwords as a hash, and
    they store them in a file called a SAM file. The Security Accounts Manager file
    only stores a hash of the password. Windows itself does not know what your actual
    password is.


    Microsoft has created their own hash approach, rather than simply using a well-known
    hashing algorithm. The Microsoft hashing process has developed over the years.


    NT LAN Manager (NTLM) is a suite of Microsoft security protocols that provides
    authentication, integrity, and confidentiality. It is the successor to the older
    LAN Manager, and the current version is NTLMv2. Microsoft now uses Kerberos in
    Windows domains (since Windows 2000) but NTLM is still used when:


    +   1. The client is authenticating to a server via IP address

    +   2. The client is authenticating to a server in a different Active Directory
    forest that has a legacy NTLM trust instead of a transitive inter-forest trust

    +   3. The client is authenticating to a server that doesn’t belong to a domain

    +   4. If Kerberos is blocked by the firewall


    The first Microsoft hash was LanManager. It is now outdated, and can only be found
    in very old versions of Windows. LanManager (LM) had several limitations. The
    process is briefly described here:


    +   - LanManager was limited to 14 characters.

    +   - All passwords were first converted to uppercase before hashing.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   - If the password was less than 14 bytes, it was padded with null values.

    +   - The 14-byte value was split into two halves, each 7 bytes in length.

    +   - These two halves are used to create two separate DES keys.

    +   - Each of these keys is used to encrypt a constant ASCII string KGS!@#$% Yielding
    2 separate 8-byte ciphertext strings. These are then concatenated to form a 16-byte
    LM hash, which is not actually a true hashing algorithm.


    The first improvement on this was NT Hash. NT Hash did at least use an actual
    hashing algorithm, albeit one that was already outdated at the time, MD4.


    The next improvement was New Technology LAN Manager (NTLM). There are two versions
    of NTLM. The basic process of NTLM is given here:


    +   1. There is a client-server exchange consisting of the client sending NEGOTIATE_MESSAGE.

    +   2. The server responds with CHALLENGE_MESSAGE.

    +   3. The client responds with AUTHENTICATE_MESSAGE.


    One or both of the two hashed password values that are stored on the server are
    used to authenticate the client. These two are the LM Hash or the NT Hash.


    The basic process of NTLM version 1 begins with the server authenticating the
    client. The server authenticates the client by sending a random 8-byte number
    as the challenge. The client performs an operation involving the challenge and
    a secret shared between the client and server. The shared secret is one of the
    hashed passwords discussed in the general NTLM description. The result is a 24-byte
    value that is sent to the server. The server verifies it is correct.


    NTLM version 2 made some additional modifications. The client sends two responses
    to the 8-byte challenge from the server. Each is a 16-byte HMAC hash of the server
    challenged and an HMAC of the user’s password (the HMAC uses the MD5 hashing algorithm).
    The second response also includes the current time, an 8-byte random value, and
    the domain name.


    # Windows Hacking Techniques


    Given the ubiquitous nature of Microsoft Windows, it should be no surprise that
    a wide range of attacks are specifically aimed at that operating system. In this
    section, we will briefly look at some of these. Chapter 3, “Cryptography,” already
    discussed some password cracking techniques for Windows. Later in this book, when
    we turn our attention to Metasploit, we will see more ways to exploit Windows.
    For this current chapter, we will focus on non-Metasploit methods for attacking
    Windows.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Pass the Hash


    The pass the hash attack essentially realizes that the hash cannot be reversed
    (recall the discussion of hashes in Chapter 3); rather than trying to find out
    what the password is, the attacker just sends over the hash. If the attacker can
    obtain a valid username and user password hashes values (just the hash; the attacker
    does not know the actual password), then the hacker can use that hash, without
    ever knowing the actual password.


    Windows applications ask users to type in their passwords; then they in turn hash
    them. Often this can be done with an API like LsaLogonUser, converting the password
    to either an LM hash or an NT hash. Pass the hash skips around the application
    and just sends the hash.


    As a penetration tester, you hope this won’t work. There are countermeasures.
    One is to add a current date/time to the NTLM hash. That means that if the hash
    is not sent instantly from an application, it will be considered invalid.


    # chntpw


    This is a tool that can be downloaded from the Internet (http://www.chntpw.com/).
    It is used to blank passwords. It can be used from a USB or CD. It will edit the
    SAM file and simply blank the passwords used. It is a command-line tool, and will
    blank the passwords in the SAM file. Figure 6-2 shows the installation for USB.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_159_0.png)


    FIGURE 6-2 chntpw Installation for USB.


    # Net User Script


    This particular exploit first requires access to the target machine with at least
    guest-level privileges. It is based on the fact that many organizations put the
    technical support personnel in the domain admins group.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The attacker writes the following two-line script (obviously the word localaccountname
    is replaced with an actual local account name):


    ```

    net user /domain /add localaccountname password

    net group /domain "Domain Admins" /add localaccountname

    ```


    Save that script in the All Users startup folder. The next time someone with domain
    admin privileges logs on to the machine, it will execute and that localaccountname
    will now be a domain admin. The only problem is that it may be quite some time
    before someone with such privileges logs on to that machine. To make this happen,
    the attacker will cause a problem with the system that would necessitate technical
    support fixing it, such as by disabling the network card. The next user to log
    on will not be able to access the network or Internet and will call technical
    support. There is a reasonably high chance that the person in technical support
    is a member of the domain admins group. When that person logs on to the computer
    to fix the problem, unbeknownst to her the script will execute.


    This particular exploit illustrates two different security issues. The first is
    the concept of least privileges. This means each user has the minimum privileges
    to do his or her job. Therefore, technical support personnel should not be in
    the domain admins group.


    The second issue is that access to any of your machines should be controlled.
    This exploit only requires that the attacker have guest-level access, and then
    only for a few minutes. From that minimum access, a skilled attacker can move
    forward and acquire domain admin privileges.


    # Login as System


    This particular attack requires physical access to one machine on your network.
    It does not require domain or even computer login credentials. To understand this
    attack, think about the last time you logged in to any Windows computer, even
    a Windows server. Next to the login text boxes (Username and Password), there
    is an accessibility button that allows you to launch various tools to aid those
    users with disabilities. For example, you can launch the magnifier class in order
    to magnify text.


    In this attack, the perpetrator will boot the system to any Linux live CD. Then,
    using the FDISK utility, the attacker will locate the Windows partition. Navigating
    to the Windows\System32 directory, the attacker can first take magnify.exe and
    make a backup, perhaps naming the backup magnify.bak. Then she can take command.exe
    (the command prompt) and rename it magnify.exe.


    Now the attacker reboots to Windows. When the login screen appears, the perpetrator
    clicks Accessibility and then Magnify. Since command.exe was renamed to magnify.exe,
    this will actually launch the command prompt. No user has logged in yet, so the
    command prompt will have system privileges. At this point the attacker is only
    limited by her knowledge of commands executed from the command prompt.


    This particular attack illustrates the need for physical security. If an attacker
    can get even 10 minutes alone with your Windows computer, she will likely find
    a way to breach the network.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Find the Admin


    It is good security practice to rename accounts. Do not have the administrative
    account named administrator. However, the command-line tool sid2user can be used
    to locate the real administrator account:


    ```

    sid2user

    sid2user [\\computer_name] authority subauthority1

    ```


    where computer_name is optional. By default, the search starts at a local Windows
    NT computer. For example:


    ```

    sid2user 5 32 544

    sid2user 5 21 201642981 56263093 24269216 500

    ```


    That command always gets you the real administrator.


    http://www.securityfocus.com/tools/544


    In Figure 6-3 you can see sid2user in action. The admin always has user ID 500.
    It should be noted that guest is always 501. These two facts help you to identify
    the role a given user has. Microsoft has a detailed article on the topic of SIDs
    at https://msdn.microsoft.com/en-us/library/windows/desktop/aa379571(v=vs.85).aspx.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_161_0.png)


    FIGURE 6-3 sid2user in Action.


    # Windows Scripting


    There are any number of command-line utilities that can be helpful in hacking
    and penetration testing. The net command, once you have some level of access to
    a machine, can assist you in learning more. You can also write these as a script
    (recall script-based viruses from Chapter 5, “Malware”). Many of these require
    local administrative privileges to work. But it is amazing how many people log
    on to their computers with local administrative privileges on a routine basis.
    The sections that follow cover a few of the most basic commands.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# net users


    The **net users** command enumerates users. You can see it in Figure 6-4.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_162_0.png)


    FIGURE 6-4 **net users** Command.


    # net view


    The **net view** command is one of my personal favorites. It shows the networked
    items this computer can communicate with. If you have gained access to one machine,
    this command is invaluable in enumerating the network. You can see **net view**
    in Figure 6-5.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_162_1.png)


    FIGURE 6-5 **net view** Command.


    # net share


    **net share** is another good enumeration tool. It will show you all the network
    shares this computer can access. You can see this in Figure 6-6.


    Notice the printer Workforce845 that is shared. This might provide the next step
    in your penetration test of this network.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/fa54c6d61c14db5421f8f63e6d594bb5_163_0.png)


    FIGURE 6-6 net share Command.


    # net service


    The net command can be used to start or stop services. For example:


    ```

    net start service

    net stop service

    ```


    Common services include:


    +   - browser

    +   - alerter

    +   - messenger

    +   - "routing and remote access"

    +   - schedule

    +   - spooler


    # netshell


    netshell, or netsh, provides a number of interesting commands. As you read through
    these, think of how to combine them with the script viruses introduced in Chapter
    5. I think you will see some interesting possibilities.


    Let’s first examine netsh as a means of opening a port on a firewall:


    ```

    netsh firewall set portopening tcp 445 smb enable

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'It will work, but you will be notified that the netsh firewall has been deprecated.
    Repeat the lab with the new command (netsh advfirewall firewall) and a different
    port. You can see this in Figure 6-7.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_164_0.png)


    FIGURE 6-7 netsh advfirewall firewall.


    There are several others options, such as:


    +   - netsh wlan show networks

    +   - netsh interface ip show config


    You can even attempt connecting to another computer on that network, which works
    well with the previously examined net view command:


    ```

    netsh set machine remotecomputer

    ```


    This won’t always succeed, but is well worth the attempt.


    # Windows Password Cracking


    Password cracking is one of the most fundamental aspects of hacking Windows. It
    is important that a penetration tester attempt to crack Windows passwords. If
    you can crack them, so can an attacker. We will examine several tools in this
    section. Some of these we examined in Chapter 3 on cryptography, but they are
    given again here to put them in context of Windows password cracking.


    # Offline NT Registry Editor


    This tool simply wipes the passwords for the target machine. It is usually quite
    fast and quite effective. It is also a free download from https://www.lifewire.com/offline-nt-password-and-registry-editor-review-2626147.
    However, from an attacker’s point of view, it will be rather obvious that the
    local passwords were blanked.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# LCP


    LCP is an old, but effective, Windows password cracker. You can download it from
    http://www.tucows.com/preview/391886/LCP. This tool allows you to import hashes
    from a variety of locations, including another machine on the same network (Import
    > Import From Remote Computer) as demonstrated in Figure 6-8.


    ![](img/fa54c6d61c14db5421f8f63e6d594bb5_165_0.png)


    FIGURE 6-8 LCP.


    # pwdump


    pwdump is a common tool used by attackers, so it is a good thing for security
    professionals to use as well. The first step for many password cracking tools
    is to get a copy of the local password hashes from the Windows Security Accounts
    Manager (SAM) file where Windows stores hashes of passwords. The program pwdump
    will extract the password hashes from the SAM file. It is a free download from
    http://www.openwall.com/passwords/windows-pwdump.


    Figure 6-9 is an image of the output of pwdump7. The actual hashes are redacted,
    since this was run on a live machine.


