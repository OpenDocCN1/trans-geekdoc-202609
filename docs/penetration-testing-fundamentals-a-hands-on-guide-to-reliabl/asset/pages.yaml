  md: 'As you can see, Yahoo, thinks I am coming from Sweden, and presents its page
    to me in Swedish. This anonymity is not inherently illicit. There are many legitimate
    reasons one might wish to surf the Internet anonymously. Some people simply do
    not like being tracked, and it is clear that many companies do track Internet
    traffic for marketing purposes; however, the TOR browser has also given birth
    to illicit dark web markets. These are markets on the web where people buy and
    sell illicit goods. Items are paid for in Bitcoin or similar cryptocurrency, making
    the purchases very difficult to trace.


    One of the reasons, already mentioned, why this is an issue for security professionals,
    including penetration testers, is that your client’s data could already be for
    sale on the dark web. Most penetration tests/security audits do not do a dark
    web audit, but perhaps they should.


    Recently, a few major dark web markets have been taken down by law enforcement
    (HANSA and AlphaBay). But others have popped up. While writing this chapter, I
    took 15 minutes to search for dark web markets and it was trivial to find multiple
    sites that sell drugs, stolen data, firearms, and more. Methamphetamine, cocaine,
    heroin, all for sale. There is far more available on these dark web markets. Jihad
    training sites, instructions on how to make explosives, hacking services, places
    to buy and sell malware....


    While some prominent markets have been taken down by law enforcement, others remain
