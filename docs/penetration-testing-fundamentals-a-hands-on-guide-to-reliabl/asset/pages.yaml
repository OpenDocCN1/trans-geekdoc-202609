- pgno: 166
  md: 'Oftentimes, you will want to dump the hashes to an external file so that you
    can import them into a rainbow table tool. Rainbow tables are explained in detail
    in Chapter 3, but for now just recall they are tables of pre-computed hashes used
    to guess passwords. That is done quite easily by simply piping the output of pwdump
    to a test file. For example:


    ```

    pwdump > passwordhashes.txt

    ```


    Once you have the password hashes, you can use any rainbow table tool to check
    to see if the passwords can be recovered. This is one method for validating the
    strength of your organization’s passwords.


    # ophcrack


    ophcrack is one of the most widely used password cracking tools. ophcrack is important
    because it can be installed on a bootable CD. If used in that manner, you boot
    the system to the CD, thus circumventing Windows security, and proceed to try
    and crack the passwords. ophcrack offers a small rainbow table free of charge;
    one must purchase the larger rainbow tables. You can download ophcrack from http://ophcrack.sourceforge.net/.
    It also does not require a separate process to dump the Windows SAM file. Instead,
    it will grab the data from the SAM file for you. Figure 6-10 shows the output
    from ophcrack. The actual hashes and passwords are redacted.


