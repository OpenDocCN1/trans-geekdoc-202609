- pgno: 184
  md: 'Char(39) is the single quote. So instead of ‘ or ‘1’ = ‘1 you have:


    ```

    Char(39)  or Char(39) 1 Char(39) =Char(39) 1

    ```


    Char(42) is the asterisk.


    # Additional Resources


    This is just an introduction to SQL injection. If you wish to delve deeper into
    this, I recommend the following sites:


    +   - http://pentestmonkey.net/cheat-sheet/sql-injection/mysql-sql-injection-cheat-sheet

    +   - http://www.sqlinjectionwiki.com/categories/2/mysql-sql-injection-cheat-sheet/

    +   - https://information.rapid7.com/rs/rapid7/images/R7%20SQL_Injection_Cheat_Sheet.v1.pdf


    # XSS


    Cross-site scripting (commonly called XSS) is a relatively simple attack. You
    attempt to load scripts into a text field so they will be executed when another
    user visits that site. For example, you go to a product review section, but rather
    than enter a review, you enter JavaScript.


    Essentially you enter scripts into an area that other users interact with, so
    that when they go to that part of the site, you have your own script run, rather
    than the intended website functionality. This can include redirecting them.


    Cross-site scripting exploits the trust a user has for a particular site. Cross-Site
    Request Forgery (CSRF), discussed in a later section, exploits the trust that
    a site has in a user’s browser. What can you do with this? First let’s look at
    a bit of basic JavaScript.


    # Basic JavaScript


    In order to understand cross-site scripting, you need at least some understanding
    of JavaScript. It is also helpful to be able to manually enter a few scripts in
    order to test if a target website is susceptible.


    Consider this elementary JavaScript example:


    ```

    <SCRIPT>

    document.write("<H1>Hello World.</H1>")

    </SCRIPT>

    ```


    Write to an element:


    ```

    <script>

    document.getElementById("demo").innerHTML = "Hello World!";

    </script>

    ```'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'An alert is another popular and simple JavaScript function:


    ```

    <script>

    alert("You are vulnerable to XSS!");

    </script>

    ```


    JavaScript can be used to redirect the browser. In fact, there are several ways
    to do this:


    ```

    <SCRIPT>

    window.navigate("someurl");

    </SCRIPT>

    ```


    This one only works in some browsers. You may wish to try one of these two instead:


    window.location.href = ''someurl'' ; works in all browsers.


    window.location.replace (''someurl''); is even better because it does not show
    in the ‘back’ for history.


    You can also use JavaScript to see the browser’s history:


    ```

    history

    <SCRIPT>

    Window.History

    </SCRIPT>

    Length: how much is in history

    back()

    forward()

    ```


    You can loop through the entire history using the length property.


    # Things to Do with XSS


    A common XSS attack for penetration testers is to just pop up an alert. This lets
    the person know the site is vulnerable, without actually doing anything. As you
    can see, you can cause the site to redirect. This is a powerful method for phishing
    scams.


    Consider a website where users can shop and leave reviews of products. The attacker
    sets up a fake version of the site. If a user navigates to that site, they are
    prompted to log in, then informed the service is “temporarily unavailable, try
    again later.” The attacker just got that person’s username and password. But how
    do you get people to go to the fake website? You could try a phishing email campaign,
    and you would probably have some success. However, if you can perform XSS on the
    real website, it can direct the users to the fake website.


    As was also mentioned, you can navigate to the history of the browser. Recall
    the discussion of the difference between GET and POST earlier in this chapter.
    Imagine you visit a website that is mostly secure, except it uses GET commands.
    You provide a lot of sensitive information. Then, when you'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'are done, you navigate to another website that has been attacked with cross-site
    scripting. That website pulls your history, including the data you sent with GET.
    Now the attacker has retrieved your data, without actually hacking into the website
    where you entered the data. That should be a concern.


    # Other Web Attacks


    The following attacks are mentioned, but with a bit less detail. You need to be
    generally aware of these attacks, but this is an introductory text, and you don’t
    have to be an expert with every web attack. Also, as you will see in Chapter 8,
    there are automated tools that will tell you if a given website is vulnerable
    to one or more of these attacks.


    # CSRF


    Cross-Site Request Forgery (CSRF) is an attack that forces an end user to execute
    unwanted actions on a web application in which they’re currently authenticated.
    CSRF is an attack that tricks the victim into submitting a malicious request.
    It inherits the identity and privileges of the victim to perform an undesired
    function on the victim’s behalf. For most sites, browser requests automatically
    include any credentials associated with the site, such as the user’s session cookie,
    IP address, Windows domain credentials, and so forth.


    # Forceful Browsing


    Forceful Browsing web servers will send any file to a user, as long as the user
    knows the file name and the file is not protected. Therefore, a hacker may exploit
    this security hole, and “jump” directly to pages. For example, a registration
    page had an HTML comment mentioning a file named “_private/customer.txt”. Typing
    “http://www.xxx.com/_private/customer.txt” sent back all customers’ information.


    Appending “~” or “.bak” or “.old” to CGI names may send back an older version
    of the source code. For example, “www.xxx.com/cgi-bin/admin.jsp~” returns admin.jsp
    source code.


    # Parameter Tampering


    This attack is fast becoming outdated, in that fewer web programmers today still
    keep interesting information in the URL. Parameter tampering is a form of web-based
    attack in which certain parameters in URL or web page form field data entered
    by a user are changed. This is often done to alter the behavior of a web application.
    The most obvious example is when values are in the URL, such as this:


    Valid transaction:


    ```

    http://www.victim.com/tx?acctnum=12&debitamt=100

    ```


    Malicious transaction:


    ```

    http://www.victim.com/tx?acctnum=12&creditamt=1000000

    ```


    Mitigation: whenever parameters are sent, check the session token.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Cookie Poisoning


    Many web applications use cookies in order to save information (user id, time
    stamp, etc.) on the client’s machine. For example, when a user logs in to many
    sites, a login web script validates his username and password and sets a cookie
    with his numerical identifier.


    When the user checks his preferences later, another web script (say, preferences.asp)
    retrieves the cookie and displays the user information records of the corresponding
    user. Cookies are not always encrypted, so they can be modified. In fact, JavaScript
    can modify, write, or read a cookie. So this attack can be combined with XSS.


    # LDAP Injection


    This is a newer attack, at least newer than SQL injection. It depends on more
    complicated web applications that utilize Lightweight Directory Access Protocol
    (LDAP). It is probably best described by this quote from the Open Web Application
    Security Project (OWASP):


    > LDAP Injection is an attack used to exploit web based applications that construct
    LDAP statements based on user input. When an application fails to properly sanitize
    user input, it’s possible to modify LDAP statements using a local proxy. This
    could result in the execution of arbitrary commands such as granting permissions
    to unauthorized queries, and content modification inside the LDAP tree. The same
    advanced exploitation techniques available in SQL Injection can be similarly applied
    in LDAP Injection.


    # Tools


    There are a number of tools that will automate the process of any of the web attacks
    previously described in this chapter. We will review a few widely used tools in
    this section.


    # Burp Suite


    Burp Suite is a classic web attack tool. You can download it from https://portswigger.net/burp/.
    For demonstration purposes, we will launch Burp Suite using all default settings.
    That should present you with the screen shown in Figure 7-2. Note that I am using
    the free version.'
  merge: -1
  img_proc: true
