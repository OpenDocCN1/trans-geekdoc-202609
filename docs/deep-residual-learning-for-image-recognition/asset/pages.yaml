    networks as FiNet [34] and Highway [41]. Table 6, is yet among the state-of-the-art
    results (6.43), Table 6.


    # Analysis of Layer Responses. Figure 7 shows the standard deviations (std) of
    each 3x3 layer. The responses are the outputs of 3x3 layer, after BN and before
    nonlinearity (ReLU/addition). For ResNets, this analysis reveals the strength
    of the residual functions.


    We show that ResNets have smaller residual functions than their counterparts Section
    3.1 shows that the residual functions might be generally closer to zero than the
    non-residual units. We also notice that deeper ResNets have smaller magnitudes
    of responses, as seen by the comparisons among ResNet-20, 56, and 110 in Fig.7.
    When there are more layers, an individual layers of ResNets tend to make the signal.


    # Exploring Over 1000 layers. We explore an aggressively deep model of over 1000
    layers. We set $n=200$ that leads to a 1202-layer network, which is trained as
    residual. Our method shows no optimization difficulty, and this $10^3$-layer network
    is able to achieve training error <0.1% (Fig. 6, right). Its test error is still
    fairly good (7.93%), Table 6.


    But there are still problems on such aggressively deep models. The testing result
    of this 1202-layer network is worse than that of our 110-layer network, although
    both


    have similar error. This is because of overfitting. The over-1202 layer network
    may be necessarily inaccurate (19.4M) on that data. Strong regularization as max
    [9] or dropout [13] is applied to obtain the best. In this paper, we use no max/dropout
    and just simple regularization to deepen the architectures by tracking from the
    difficulties of optimization. By combining with stronger regularization may improve
    our results, which we will show in the future.


    # 4.3. Object Detection on Pascal and MS COCO


    Our method has good generalization performance on other recognition tasks. Table
    6 and 8 show the detection baseline results on Pascal VOC 2007 and 2012 [5] and
    COCO [26]. We adopt Faster R-CNN [32] as the detection method. Here we are implemented
    in the implementation of VGG-16 with ResNet-101. The use of both models is the
    same, so the gains can only be attributed to better networks. Mostly respectively,
    on the challenging COCO dataset we observed 0.9% increase in COCO''s standard
    mAP[5, 95], which is a 28% relative improvement. This gain is solely due to the
    learned representations.


    Based on deep residual networks, we won the 1st places in several tracks in ILSVRC
    & COCO 2015 competitions: Image detection, Localization detection, and COCO segmentation.
    The details are in the appendix.'
