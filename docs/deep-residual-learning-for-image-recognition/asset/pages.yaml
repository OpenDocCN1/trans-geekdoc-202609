    4 pixels are added on each side, and a 32×32 crop is randomly sampled from the
    input images. For testing we only evaluate the single view of the original 32×32
    image.


    We use n = [3, 5, 7, 9], leading to 22, 30, 44, and 56-layer networks. Fig. 6
    (left) shows the behaviors of the plain networks. The deep plain networks suffer
    from increased depth, and exhibit higher training when depth goes down.


    Fig. 6 (middle) shows the behaviors of ResNets. Also similar to the ImageNet cases
    (Fig. 4, right), our ResNets manage to overcome the optimization difficulty and
    maintain accuracy when the depth increases. We further explore n = 18 leads to
    a 110-layer ResNet. We find that the initial learning rate of 0.1 is too large
    to start convergence? So we use 0.01 to warm up the training until the training
    error is 800* (about 400 iterations), then go back to 0.1 to continue training.
    The rest of the learning schedule is as done previously. This 110-layer network
    converges well (Fig. 6, middle). It has fewer parameters than deep and


    > *With an initial learning rate of 0.1, it starts quickly (<90% error) after
    several epochs, but still remains similar accuracy.'
