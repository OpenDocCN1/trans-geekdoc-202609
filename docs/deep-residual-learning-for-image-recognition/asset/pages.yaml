    # # Related Work


    In this paper, we introduce a deep residual learning framework. Instead of each
    few stacked layers directly learn a underlying mapping, we explicitly let these
    layers learn a residual mapping. Denoting the underlying mapping as $\mathcal{H}(x)$,
    we let the stacked layers fit mapping of $\mathcal{F}(x) := \mathcal{H}(x) - x$.
    The original mapping is easier to optimize the residual mapping to utilize the
    original, unreferenced mapping. To the extreme, if identity mapping were optimal,
    it would be easier to push the residual further than an identity mapping by a
    stack of nonlinear layers.


    **Residual Representations.** In image recognition, VLAD [18] is a representation
    that encodes the residual layers with respect to a dictionary, and Fisher Vector
    [30] can be formulated as a probabilistic [18] of VLAD. Both of them are powerful
    representations for image retrieval and classification [4, 47]. For vector quantization,
    encoding residual layers [17] is shown to be more effective than encoding encoders.


    The formulation of $\mathcal{F}(x) + x$ can be realized by feedforward networks
    with shortcuts (connections). Fig. 2. Shortcut connections [2, 33, 48] are skipping
    one or more layers. In our case, the shortcuts perform identity mapping, and their
    outputs are added to the next layer. These stacked layers can still be trained
    end-to-end by SGD with backpropagation, and can be easily implemented using common
    libraries (e.g., Caffe [19]) without modifying the solvers.


    In physics and computer graphics, solving Partial Differential Equations (PDEs),
    using the Multigrid method [3] reformulates the system as subdomain at multiple
    scales, where each subdomain is solved by the residual solver between a coarse
    and finer scale. An alternative to Multigrid is hierarchical decomposition [44,
    45], which relies on variables that are separated between two scales. [34, 45]
    show that these solvers converge much faster than standard solvers that are unaware
    of the nature of the residuals. The methods suggest that such good reformation
    of shortcuts can simplify the optimization.


    We present experiments on ImageNet [35] to show the degradation problem and evaluate
    our results. We show that our extremely deep residual nets are easy to optimize,
    but "plain" nets (that stack layers exhibit higher training error when the depth
    increases); our deep nets can easily gain accuracy from greatly increasing depth,
    producing results significantly better than previous methods.


    **Short Connections.** Practices and theories that lead to shortcut connections
    [2, 33, 48] have been studied for a long time. Early practice of training multi-layer
    perceptrons (MLPs) is to add a layer connection connected from the network to
    the output [33, 44]. In [24], we employ linear layers are connected to classifiers
    for addition/without exploding gradients. The layers of [38, 37, 36] propose for
    centering layers by residuals, spouses, and gradients, implemented by shortcut
    connections. In [43], an "inception" layer is composed of a shortcut connection
    and a few deeper layers.


    Similar phenomena are also observed on the CIFAR-10 dataset [28], suggesting the
    optimization difficulties and effects of our method are not particular. We present
    successfully trained models on dataset with over 100 layers, and models with over
    1000 layers.


    Concur with our work, "highways" [41, 42] present are dependent and have parameters;
    in contrast our shortcuts are parameter-free. When a gated shortcut is "closed"
    (approaching zero), the layers in highway networks represent non-residual functions.
    On the contrary, our formulation always learns residual functions; our shortcut
    identities are never closed, and all information is passed through, with residual
    functions to be learned. In addition, high...


    On the ImageNet dataset [35], we obtain excellent results by extremely deep residual
    nets. Our residual net is the best network presented over ImageNet, while still
    having lower complexity than VGG nets. Our ensemble has 3.57% top-5 error on the'
