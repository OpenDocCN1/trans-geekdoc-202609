    # 3.4. Implementation


    Our implementation for ImageNet follows the practice in [21, 40]. The image is
    resized with its shorter side randomly sampled in [256, 480] for scale augmentation
    [40]. A 224x224 image is randomly sampled from any of these with a horizontal
    flip, with the pixel-mean subtracted [21]. We adopt batch normalization (BN) [16]
    after every convolution before activation. We initialize the weights as in [12]
    and train all plain/residual nets from scratch. We use SGD with a mini-batch size
    of 256. The learning rate starts from 0.1 and is divided by 10 every ten epochs,
    and the models are trained for 60×10⁶ iterations. We use a weight decay of 0.0001
    and a momentum of 0.9. We do not use dropout [13], following the policy in [7].


    In testing, we use the standard 10-count testing [21]. For best results, we evaluate
    the fully-convolutional format as in [14, 12], and report scores at multiple scales
    (images are resized so that the shorter side is in (224, 256, 381, 480, 640)).


    # 4. Experiments


    # 4.1. ImageNet Classification


    We evaluate our method on the ImageNet2012 classification dataset [35] which consists
    of 1000 classes. The models are trained on the 1.28 million images, and evaluated
    on the 50k test images, reported by the test server. We also report the Top-1
    and Top-5 error rates.


    Plain Networks. We evaluate all 18-layer and 34-layer nets. The 34-layer plain
    net is in Fig. 3 (middle). The 18-layer plain net is of a similar size. We refer
    to Table 1 for architectures.


    The results in Table 2 show that the deeper 34-layer plain net has higher validation
    error than the 18-layer plain net. To reveal the problem, in Fig. 4 (left) we
    compare their training/validation errors during the training procedure. We have
    observed the degradation problem -


