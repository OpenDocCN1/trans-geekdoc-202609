    classification [21, 40, 39]. Deep networks naturally integrate low/mid-level layers
    [40] and classifiers in an end-to-end manner where "features" of leaves are controlled
    by the number of stacked layers. Recent evaluation [43] reveal that depth is crucial
    of importance, and the leading results [40, 43, 12, 16] on the challenging ImageNet
    dataset [33] all "deep" nets [40], with a depth of sixteen [40] to thirty [16].
    Many other-visual recognition tasks [7, 11, 3, 22, 27] have


    greatly many benefits from depth.


    Driven by the significance of depth, a question arises: Is learning deeper networks
    as easy as making shallower? An obstacle to answering this question was the notorious
    problem of vanishing/exploding gradients [14, 1, 8], which from the beginning,
