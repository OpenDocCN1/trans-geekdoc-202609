    # ## Abstract


    Deeper neural networks are more difficult to train. We present a residual learning
    framework to ease the training of networks that are substantially deeper than
    those previously. We explicitly reformulate the layers as learning functions with
    respect to the layer inputs, instead of learning unreferenced functions. We provide
    empirical evidence showing that residual networks are easier to optimize, and
    can gain accuracy. On ImageNet we evaluate networks up to 52 layers deeper than
    VGG nets [40] but with lower complexity. An ensemble of residual nets achieves
    3.57% error on the ImageNet set. This result won the 1st place on ILSVRC-10 with
    100 and 1000 layers. We also present our application


    ![](img/a349fad16277a338a822f777f22b630b_0_0.png)


    on CIFAR-10 with 100 and 1000 layers.


    The depth of representation is of central importance for visual recognition tasks.
    So our extremely deep networks, we obtain a 28% improvement on the COCO object
    detection task. Deep residual nets are foundations of our submissions to ILSVRC
    & COCO 2015 competitions, we also won the 1st places on the tasks of ImageNet
    detection, Image local- detection, COCO segmentation.


    # ## 1. Introduction


