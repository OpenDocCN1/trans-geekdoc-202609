    网络如 FiNet [34] 和 Highway [41]。表 6 包含了目前最先进的结果 (6.43)，见表 6。


    ## 层响应分析


    图 7 显示了每个 3x3 层的标准差 (std)。响应是 3x3 层在 BN 之后、非线性激活（ReLU/加法）之前的输出。对于 ResNets，该分析揭示了残差函数的强度。


    我们证明了 ResNets 的残差函数比其对应网络更小。第 3.1 节表明，残差函数可能比非残差单元更接近零。我们还注意到，更深的 ResNets 响应幅度较小，如图
    7 中 ResNet-20、56 和 110 之间的对比。当层数较多时，ResNets 的单层倾向于产生恒信号。


    ## 探索超过 1000 层


    我们探索了一个超过 1000 层的极深模型。我们设置 $n=200$，产生一个 1202 层的网络，该网络以残差方式进行训练。我们的方法显示没有优化困难，这种
    $10^3$ 层网络能够达到小于 0.1% 的训练误差（图 6，右侧）。其测试误差仍然相当良好 (7.93%)，见表 6。


    但在这种极深模型上仍然存在问题。该 1202 层网络的测试结果差于我们的 110 层网络，尽管两者的误差相似。这是由于过拟合。超过 1202 层的网络在这些数据上可能必然是不准确的
    (19.4M)。应用了强正则化（如 max [9] 或 dropout [13]）以获得最佳。在本文中，我们没有使用 max/dropout，仅通过跟踪优化困难来通过简单正则化加深架构。结合更强的正则化可能会提高我们的结果，我们将在未来展示。


    ## 4.3. Pascal 和 MS COCO 上的目标检测


    我们的方法在其他识别任务上具有良好的泛化性能。表 6 和 8 显示了 Pascal VOC 2007 和 2012 [5] 以及 COCO [26] 上的检测基准结果。我们采用
    Faster R-CNN [32] 作为检测方法。我们在 VGG-16 和 ResNet-101 实现中实现了它。由于两个模型的使用相同，因此提升只能归功于更好的网络。在挑战性的
    COCO 数据集上，我们分别观察到 COCO 的标准 mAP[5, 95] 增长了 0.9%，相对提升了 28%。这一增益完全归于学习到的表表示。


    基于深度残差网络，我们在 ILSVRC & COCO 2015 竞赛的多个赛道中获得了第一名：图像检测、定位检测和 COCO 分割。细节见附录。


