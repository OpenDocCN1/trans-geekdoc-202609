    我们对 CIFAR-10 数据集 [20] 进行了研究，该数据集包含每类 5 万张训练图像和 1 万张测试图像。我们在训练集上进行了实验并评估了测试集。我们的关注点是极深网络的行为，但通过推向先进水平，我们提出的结果如下：


    | 方法 | 错误 (%) |

    |---|---|

    | Maxout [9] | 9.38 |

    | NIN [25] | 8.81 |

    | DSN [24] | 8.22 |

    | FitNet [34] | 7.32 |

    | Highway [41, 14] | 7.66 |

    | Highway [41, 42] | 7.54 |

    | ResNet [32] | 7.38 |

    | ResNet [32] | 7.46 |

    | ResNet [44] | 7.11 |

    | ResNet [56] | 6.65 |

    | ResNet [110] | 6.43 |


    表 6. CIFAR-10 测试集上的比较。所有方法均使用数据增强。对于 ResNet-110，我们运行了 5 次测试并显示了如 [42] 所示的平均值。我们的残差模型具有相同的深度和参数数量。我们使用
    0.0001 的权重衰减和 0.9 的动量，并采用了 [12] 和 BN [16] 中的权重初始化，不使用 dropout。这些方法在 20 个 GPU 上以
    120 的批量大小进行训练。我们使用 0.1 的学习率，并在 32k 和 48k 次迭代时减少 10 倍，在 64k 次迭代终止，这是由 4.5/5 的划分决定的。


    我们使用 n = [3, 5, 7, 9]，导致了 22、30、44 和 56 层网络。图 6（左侧）显示了普通网络的行为。深度普通网络受到深度增加的影响，并且随着深度减小而表现出更高的误差。


    图 6（中间）显示了 ResNets 的行为。与 ImageNet 案例（图 4 右侧）类似，我们的 ResNets 能够克服优化困难并在深度增加时保持精度。我们进一步探索了
    n = 18 导致的 110 层 ResNet。我们发现初始 0.1 的学习率对于开始收敛来说太大了？因此我们使用 0.01 进行预热训练，直到训练误差达到
    800（约 400 次迭代），然后回到 0.1 继续训练。其余的学习计划与之前相同。这层 110 层网络收敛良好（图 6 中间）。它的参数少于深层且


    > *非瓶颈 ResNet（例如图 5）也从深度的增加中获得精度（如在 CIFAR-0 上所示），但不如瓶颈 ResNet 那么经济。使用瓶颈主要是出于实际考虑。我们进一步注意到，普通网络的退化问题对于瓶颈设计并非毫无用。


