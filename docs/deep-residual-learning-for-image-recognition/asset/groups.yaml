    ## 3. 深度残差学习 (Deep Residual Learning)


    让我们考虑 $H(x)$ 为由几层固定的底层映射（不一定是整个输入过程），其中 $x$ 表示这些层中第一层的输入。如果我们假设多个非线性层近似函数，那么这等同于假设它们在学习残差
    $H(x) - x$（假设输入和输出的维度相同）。与其学习堆叠层，我们不如显式地让这些层近似残差函数 $\mathcal{F}(x) \equiv H(x)
    - x$。那么原始函数就仅仅变成了为了帮助近似所需的函数（如假设所示），这使得学习努力发生了巨大的变化。


    这种重新表述的动机来自于违反直觉的退化问题现象（图1，左侧）。正如我们所讨论的，如果层被构建为恒等映射（identity mappings），更深模型的训练误差不会大于其较浅的模型。退化问题表明，我们很难通过多个非线性层来近似恒等映射。通过残差重述，恒等映射变为最优，因此求解器会将多个非线性层的权重向恒等映射靠拢。


    在实际情况下，恒等映射可能比最优还要好，但重述可能有助于对进行预处理。如果最优函数是恒等映射到零，那么对于求解器来说，参考恒等映射来学习它比从零开始学习更容易。我们通过实验（图7）展示了学习到的函数通常具有合理的响应，这表明恒等映射提供了合理的推理。


    我们将残差学习应用于每几层堆叠层。图2展示了一个构建块（building block）。形式上，在本文中我们考虑的构建块定义为：


    ```

    $y = \mathcal{F}(x, \{W_i\}) + x.

    ```


    这里 $x$ 和 $y$ 是所考虑层的输入和输出向量。函数 $\mathcal{F}(x, \{W_i\})$ 表示要学习的残差映射。对于图2中所示具有两层的示例，$\mathcal{F}
    = W_2\sigma(W_1x)$，其中 $\sigma$ 表示 ReLU，为了简化操作省略了偏置。$F + x$ 通过捷径连接（shortcut connection）和逐元素相加完成。我们在相加之后采用非线性激活（即
    $\sigma(y)$，见图2）。等式(1)中的捷径连接引入了额外的参数，但没有计算复杂度。这不仅是有优势的，对于比较平直网络和残差网络的性能也同样重要。我们可以轻松实现具有相同参数数量、深度和计算成本的平直/残差网络。


    等式(1)中 $x$ 和 $F$ 的维度必须匹配。如果如此（例如当输入和输出不匹配时），我们可以为捷径连接学习投影 $W_s$ 以匹配维度：


    ```

    $y = \mathcal{F}(x, \{W_i\}) + W_s x.

    ```


    我们使用平方矩阵 $W_s$。实验证明恒等映射足以解决退化问题，因此在匹配维度时使用 $W_s = I$。


    残差函数 $F$ 的形式是灵活的。本文中的实验使用了两层（图5），也可以使用更多层。如果 $F$ 只有一层，等式(1)类似于线性层 $y = W + x$，我们没有观察到其优势。我们还证明了尽管我们使用了全连接层，但它们也适用于卷积层。函数
    $\mathcal{F}(x, \{W_i\})$ 表示多个卷积层。逐元素相加是在特征图上逐通道执行的。


    我们测试了平直/残差网络，并观察到了一致的性能。为了提供实例，我们描述了用于 ImageNet 的两个模型如下。


    **平直网络 (Plain Network)。** 我们的平直基准网络（图3，中间）主要灵感来自 VGG 网络架构 [40]（图3，左侧）。卷积层具有 3x3
    滤波器，并遵循两个简单设计规则：对于输入特征图的大小，层具有相同数量的滤波器；如果特征图大小减半，则滤波器的数量加倍，以保持网络复杂度。我们使用步长为 2
    的卷积层进行下采样。网络以全局池化层和一个1000节点的全连接层结束。图3（中间）中的加权层总数为34层。


    值得注意的是，我们的模型比 VGG 网络 [40]（图3，左侧）具有更少的滤波器和更低的复杂度。我们的层基准有36 亿次操作（乘加），仅为 VGG-19（196
    亿 FLOPs）的 18%。


    > *2然而，这一假设是一个开放性问题 [28]。


    ## VGG-19 34层平直网络 34层残差


    基于上述平直网络，我们插入了捷径连接（图3），这将网络转换为对应的残差版本。当输入和输出维度相同时（图3中的实线），可以直接使用捷径（等式1）。当维度增加时（图3中的虚线捷径），我们有两种选择：(A)
    执行恒等映射，对于增加的维度填充零元素。此选项不引入任何额外参数；(B) 使用投影捷径（等式2）来匹配维度（通过 1x1 卷积）。对于这两种选项，如果捷径连接携带的是不同尺寸的特征图，它们将与步长
    2 的配对。


