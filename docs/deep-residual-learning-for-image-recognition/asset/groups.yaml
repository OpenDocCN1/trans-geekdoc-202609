    # 用于图像识别的深度学习


    何恺明，张兴阳，邵庆庆，孙健

    微软研究院

    {kahe, v-xianz, v-shren, jiansun}@microsoft.com


    ## 摘要


    更深的神经网络更难训练。我们提出了一种残差学习框架，以简化比以往网络深得多的网络训练。我们显式地将层重新定义为关于层输入的学习函数，而不是学习未引用的函数。我们提供的经验证据表明，残差网络更容易优化，并且可以获得更高的准确率。在
    ImageNet 上，我们评估了比 VGG 网络 [40] 深达 52 层的网络，但复杂度更低。残差网络的集成在 ImageNet 集上达到了 3.57%
    的错误率。这一结果使我们在 ILSVRC-10 类中以 100 层和 1000 层结构获得第一名。我们还展示了在 CIFAR-10 上 100 层和 1000
    层的应用。


    ![](img/a349fad16277a338a822f777f22b630b_0_0.png)


    表示的深度对于视觉识别任务至关重要。因此，我们的极深网络在 COCO 目标检测任务上获得了 28% 的提升。深度残差网络是我们参加 ILSVRC & COCO
    2015 竞赛提交的基础，我们还在 ImageNet 检测、图像局部检测、COCO 分割任务中也获得了第一名。


    ## 1. 引言


    更深的神经网络 [21] 已经在图像分类领域取得了一系列突破 [21, 40, 39]。深度网络自然地以端到端的方式集成了低/中层 [40] 和分类器，其中叶片的“特征”由堆叠层的层数控制。最近的评估
    [43] 揭示了深度至关重要，在具有挑战性的 ImageNet 数据集 [33] 上的领先结果 [40, 43, 12, 16] 都是“深”网络 [40]，深度在十六层
    [40] 到三十层 [16] 不等。许多其他视觉识别任务 [7, 11, 3, 22, 27] 从深度中受益匪浅。


    受深度重要性的驱动，产生了一个问题：学习更深的网络是否像构建浅层的网络一样容易？回答这个问题的障碍是臭名的梯度消失/爆炸问题 [14, 1, 8]，这个问题从一开始很大程度上通过归一化初始化
    [23, 8, 36, 12] 和中间归一化层 [16] 解决了，使得具有层的网络能够通过带反向传播的随机梯度下降 (SGD) [22] 开始收敛。


    当深度网络能够开始收敛时，退化问题出现了：随着深度的增加，准确率达到饱和（这并不意外）。意外的是，这种退化是由过拟合引起的，为了满足更深的模型而增加层会导致更高的训练误差，正如
    [10, 41] 所述并经过我们的实验充分验证。我们在下方展示了一个图示例。


    退化（准确率）表明并非所有系统都容易优化。让我们考虑一个较浅的架构并为深度模型添加更多层：为了适应深度模型，存在一种通过等等映射解决方案，其他层则从浅层模型中复制。这种构建解决方案的存在表明，深度模型产生的训练误差不应比其浅层模型更高。但实验表明，我们目前的求解器无法找到明显优于构建解决方案的解（或在可行的时间内无法做到）。


    ![](img/a349fad16277a338a822f777f22b630b_1_0.png)


    图 2. 残差学习：一个构建块。


    ImageNet 测试集，以及 ILSVRC 2015 分类竞赛的冠军名。极深表征在其他识别任务上也具有良好的泛化性能，并使我们在 ILSVRC & COCO
    2015 竞赛中获得了 ImageNet 检测、ImageNet 定位、COCO 检测和 COCO 分割的冠军名。这一强有力的证据表明，残差学习原理是通用的，我们预计它适用于视觉问题和非视觉问题。


    ## 相关工作


    在本文中，我们引入了一种深度残差学习框架。我们不是让每几层堆叠直接学习底层映射，而是显式地让这些层学习残差映射。将底层映射表示为 $\mathcal{H}(x)$，我们让堆叠层拟合映射
    $\mathcal{F}(x) := \mathcal{H}(x) - x$。原始映射比残差映射更容易优化，从而利用原始的未引用的映射。极端情况下，如果恒等映射是最优的，通过堆叠非线性层将残差推得比恒等映射更容易。


    **残差表示。** 在图像识别中，VLAD [18] 是一种相对于字典编码残差层的表示，而 Fisher Vector [30] 可以表述为 VLAD 的概率
    [18]。两者都是图像检索和分类 [4, 47] 的强大表示。对于向量量化，证明编码残差层 [17] 比编码编码器更有效。


    $\mathcal{F}(x) + x$ 的公式可以通过带有快捷连接（连接）的前馈网络实现。图 2 所示所示。在物理学和计算机图形学中，求解偏微分方程 (PDE)
    使用多网格方法 [3] 将系统重新建模为多个尺度上的子区域，其中每个子区域通过粗糙和精细尺度之间的残差求解器求解。多网格的替代方案是分层分解 [44, 45]，它依赖于两个尺度之间分离的变量。[34,
    45] 显示这些求解器比不感知残差性质的标准求解器收敛得多。这些方法表明，这种良好的快捷连接重构可以简化优化。


    我们在 ImageNet [35] 上进行了实验以展示退化问题并评估我们的结果。我们展示了极深残差网络很容易优化，但“普通”网络（堆叠层在深度增加时表现出更高的训练误差）；我们的深度网络可以通过大幅增加深度来获得准确率，产生显著优于以前方法的结果。


    **短连接。** 导致快捷连接 [2, 33, 48] 的实践和理论已经研究很长时间。训练多层感知器 (MLP) 的早期实践是添加一个从网络到输出的层连接
    [33, 44]。在 [24] 中，我们采用线性层连接到分类器以进行加法/防止梯度爆炸。[38, 37, 36] 提议通过残差、配偶和梯度对层进行中心化，并通过快捷连接实现。在
    [43] 中，“inception”层由快捷连接和几个更深的层组成。


    类似的现象在 CIFAR-10 数据集 [28] 上也被观察到，表明优化困难和我们的方法并不是特定的。我们展示了在超过 100 层的数据上成功训练的模型，以及超过
    1000 层的模型。


    与我们的工作一致，“高速公路” [41, 42] 是依赖的且带有参数的；相比之下，我们的快捷是无参数的。当门控快捷“关闭”（接近零）时，公路网络中的层表示非残差函数。相反，我们的公式始终学习残差函数；我们的快捷恒等永远不会关闭，所有信息都会通过，只需学习残差函数。此外，高...


