    224x224 的图像并进行水平翻转，减去像素均值 [21]。我们在每次卷积激活之前采用批归一化 (BN) [16]。我们按照 [12] 中的方法初始化权重，并从零训练所有平直/残差网络。我们使用批处理大小为
    256 的 SGD。学习率从 0.1 开始，每十个 epoch 除以 10，模型训练 60×10⁶ 次迭代。我们使用 0.0001 的权重衰减和 0.9 的动量。我们遵循
    [7] 中的策略，不使用 dropout [13]。


    在测试中，我们使用标准的 10 计数测试 [21]。为了获得最佳结果，我们评估了如 [14, 12] 中的全卷积格式，并在多个尺度下报告分数（图像缩放使得短边位于
