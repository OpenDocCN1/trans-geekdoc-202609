    in part by the National Research Foundation of Korea by the Korean Government
    (NRF-2019-M3FA3A103079612 and NRF-2020M3FA3A202188)


    After training with plenty number of density using reinforcement FEXT, the agent
    is applied to get an optimal TSV array design that is least affected by crosstalk
    in HB. This shows how the state and FEXT at each stage changes when the TSV array
    design of the initial state is trained to the agent. Agent succeeds in satisfying
    the FEXT by only two actions in total. The trained design meets many requirements.


    In this paper, we propose the TSV array design method using DRL. We define the
    elements of the Markov decision process (MDP) for optimizing the TSV array arrangement
    using FEXT. We trained the agent using DQN. Finally, the loss converged and the
    agent was trained well. We applied the proposed method to design the TSV array
    at the stacked DRAM and got the optimal design successfully. This can be a base
    for further researches of DRL-based TSV array design considering SI in practical
    scales.


