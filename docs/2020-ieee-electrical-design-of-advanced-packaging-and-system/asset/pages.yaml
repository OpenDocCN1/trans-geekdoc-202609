  md: '# # Deep Reinforcement Learning-based Through Silicon Via (TSV) Array Design
    Optimization Method Considering Crosstalk


    Keunwoo Kim, Hyunook Park, Daehwan Lo, Minsu Kim, Keyoung Son, Kyjungune So, Seongkuk
    Kim, Tae Shin, Seung Choi, and Jongho Kim

    Terahertz Interconnection and Package Laboratory

    Korea Advanced Institute of Science and Technology (KAIST)

    Daejeon, Republic of Korea

    E-mail: keunwookim@kaist.ac.kr


    **Abstract—** In this paper, we propose the silicon via (TSV) array design optimization
    using reinforcement learning (DRL). The agent trained through the proposed method
    provide an optimal TSV array that minimizes crosstalk (NEXT) in a single step.
    We define the state, action, and reward to define the target NEXT, the Markov
    Decision Process (MDP) for optimizing the TSV array crosstalk and a deep q network
    (DNN). For verification, we apply the method to a 3-layer silicon via array at
    stacked High Bandwidth Memory (HBM).


    **Keywords—** Reinforcement learning (DRL), deep q network (DNN), near-end crosstalk
    (NEXT), High Bandwidth Memory (HBM), silicon via (TSV)


    Recently, the demand of high-performance computing is increasing due to the development
    of computer vision, artificial intelligence (AI). However, with the limitations
    of 2-dimensional (2-D) interconnection, there is a limit to bandwidth and interconnect.
    A 2.5D and 3D technology has emerged as a promising solution to overcome the current
    limit. Specifically, high bandwidth memory (HBM), which achieves bandwidth and
    density by stacking memories, is attracting great attention from the market [2].
    The technology that has contributed to the HBM is through silicon via (TSV), which
    allows chips to be stacked. With TSV array to HBM, remarkable electrical performance
    was achieved due to reduced length and interconnect interference.


    However, TSV is vulnerable to crosstalk, especially far-end crosstalk (NEXT).
    This is because the TSV structure has very few elements that act as guard against
    conventional horizontal interconnects [4]. Only, the power/ground TSV and the
    power distribution network (PDN) in the form of grid serves as the shielding.
    Thus, the design of generation occurs because of crosstalk from adjacent TSVs
    as shown in Fig. 1. Since the density of HBM is already high, additional structures
    for shielding is not possible. Therefore, the only way to reduce crosstalk is
    to change


    # I. INTRODUCTION


    ![](img/9b85c8ecfd965ba2f3a51c4b6e18b56c_0_0.png)


    The conventional design method was focused on developing the equivalent-circuit
    model with high accuracy and the design rule to optimize the TSV array design
    through numerous designs with the design rule [5]. However, a simple formula cannot
    capture the faults in frequencies and dimensions. Also, it takes a lot of time
    because one-step optimization is impossible.


    Reinforcement learning (RL) is used to solve complex problems with a simple algorithm
    without supervision. Moreover, once it is trained with the proper Markov decision
    process (MDP), the agent can produce an optimal design in a single step. Recently
    we have seen hardware design optimization attempts using RL. In the signal integrity
    (SI) and power integrity density (PI) due to issues of interconnects.


    In this paper we propose the RL method of the Markov decision process (MDP) for
    optimizing the TSV array crosstalk for NEXT and train the agent. After training,
    we apply the proposed method to a 3 by TSV array at stacked DRAM of HBM for verification.


