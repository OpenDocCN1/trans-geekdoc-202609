    ## I. INTRODUCTION


    ![](img/9b85c8ecfd965ba2f3a51c4b6e18b56c_0_0.png)


    The conventional design method was focused on developing the equivalent-circuit
    model with high accuracy and the design rule to optimize the TSV array design
    through numerous designs with the design rule [5]. However, a simple formula cannot
    capture the faults in frequencies and dimensions. Also, it takes a lot of time
    because one-step optimization is impossible.


    Reinforcement learning (RL) is used to solve complex problems with a simple algorithm
    without supervision. Moreover, once it is trained with the proper Markov decision
    process (MDP), the agent can produce an optimal design in a single step. Recently
    we have seen hardware design optimization attempts using RL. In the signal integrity
    (SI) and power integrity density (PI) due to issues of interconnects.


    In this paper we propose the RL method of the Markov decision process (MDP) for
    optimizing the TSV array crosstalk for NEXT and train the agent. After training,
    we apply the proposed method to a 3 by TSV array at stacked DRAM of HBM for verification.


    ## II. TSV ARRAY OPTIMIZATION METHOD


    The proposed method using DRL to optimize the TSV array design crosstalk between
    TSVs. Fig. 2 shows the schematic design of the proposed method. DNN was used to
    train


    ![](img/9b85c8ecfd965ba2f3a51c4b6e18b56c_1_0.png)


    Fig. 2. Schematic of RL for optimal TSV design considering FEXT for TSV reward.
    The design policy is trained by repeating design and SI performance. When the
    train is completed, the optimal design is obtained through the design process
    sequentially using the trained policy of the initial design.


    ![](img/9b85c8ecfd965ba2f3a51c4b6e18b56c_1_1.png)


    Fig. 3. (a) Resistance and inductance of multi-signal and multi-group TSV using
    multi transmission line (MTL) modeling and (b) Conductance and capacitance modeling
    of multi-signal and multi-group TSV.


    To solve a problem with RL framework, the components of MDP should be clearly
    defined. Depending on how MDP is defined on the target, the training efficiency
    and final performance are significantly changed. In this paper, we use MDP:


    - **State: S** is expressed by a matrix of TSVs. The value of each matrix is expressed
    as index of 0-3 using TSV type: unoccupied, signal, ground, therefore, the state
    can be expressed as a vector.

    - **Action: A** is defined in two ways: the choice of position of TSVs and designing
    ground/power TSV using occupancy.

    - **Agent: $\pi$ and $Q$.** The value is parameterized by $\theta$. We design
    the DNN with 2 hidden layers, 200 neurons in each layer.

    - **Reward: R** is defined by the difference between the target FEXT and the first
    TSV signals in frequency. In this research, the target FEXT is set to 3dB lower
    than FEXT of initial design. Then an additional reward is provided to reach the
    termination state as quickly as possible. Since SI evaluation might take too long,
    the time becomes impossible and couldn''t be used practically. Furthermore, the
    FEXT extraction method 3D EM simulation, which has high accuracy, was calculated
    using equivalent circuit model. Fig. 3 is a multi-signal multi-group TSV equivalent
    circuit model, which was used to get Self inductance ($L_i$) and mutual-inductance
    ($L_{ij}$) of TSVs:


    $$L_{ii} = \frac{\mu_{TSV}}{\pi} \ln\left(\frac{2d_{TSV}}{d_{TSV}}\right)$$


    Effective inductance of TSVs can be obtained through multicolor transmission line
    (MTL) method. Through this method, the amount of FEXT can be drastically reduced.
    The capacitance and conductance of TSV could be enhanced by properties of surrounding
    medium. After design, we train the agent with DQN with replay memory. The training
    process of MDP with DQN is followed as:


    $$\nabla(\theta) = E_{s,a}[r + \gamma \max_{a''} Q(s'',\theta) - Q(s,a)]$$


    where $L$ is the loss function.


    ## III. VERIFICATION OF THE PROPOSED METHOD


    TSVs at 16-layer IC was used for verifying the proposed method. The physical method
    of TSV design is shown in Fig. 4. The reward was defined with TSV of switching
    channel, including the capacitance of transceiver/receiver at each layer. We assumed
    that the on-chip PNM is used, so signals are transmitted through surround/power
    TSV. 3 size TSV was used for verifying the proposed method and the array size
