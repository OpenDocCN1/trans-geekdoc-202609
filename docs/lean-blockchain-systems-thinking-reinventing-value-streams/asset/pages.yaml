- pgno: 92
  md: '# Cause and Effect in Business Processes


    We have used a tool called SigmaXL for this example (see SigmaXL.com).


    Often the desired outcomes and outputs of a process don''t meet the expectations
    of the process stakeholders, especially the customers of the process.

    The customers are experiencing the effects of the process. This is also referred
    to as "the problem" or "problem statement" for a process.


    There are several categories of suggested possible causes with the outcomes or
    outputs of processes. These are often used as a starting point root-cause analysis
    using the Fishbone Diagram. These categories of causes have been defined in such
    a way so that all the words start with the letter "M" and hence they are sometimes
    referred to as "the 6Ms".


    +   **Manpower:** Refers to the human resources involved in the process, including
    their skills, training, and experience

    **Methods:** Describes the procedures, techniques, and processes used to complete
    tasks within the process

    **Machines:** Includes the equipment, tools, and technology used in the process

    **Materials:** Covers the raw materials, components, and supplies used in the
    process

    **Measurements:** Involves the metrics, (Key Performance Indicators (KPIs), and
    data used to evaluate the performance of the process

    **Mother Nature (Environment):** Considers the environmental factors that may
    impact the process, such as temperature, humidity, or other natural conditions


    The 6Ms help in identifying potential causes of problems or inefficiencies within
    a process.


