    # Two Choices Thinking: From Returning to the Whole to Transferring the Goal


    Imagine you are playing a really simple game with your friend. You can only ask
    questions that have a “Yes” or “No” answer. You get only one piece of information
    returned to you.


    We can call this **“bit” of information**.


    In the world of computers, everything works in “bits”. **A bit is the smallest
    unit of information a computer can handle**⁶. It''s the building block of all
    digital data.'
