  img_proc: true
- pgno: 116
  md: '# 90 Lean Blockchain Systems Thinking


    # Behavioral change


    One notable new behavior emerged due to the rise of the internet is the sharing
    economy. The concept of sharing resources, services and goods on a large scale
    through online platforms was not widely imaginable before the internet became
    prevalent.


    For example, peer-to-peer platforms like Airbnb and Uber have transformed the
    way people utilize their assets. Airbnb allows individuals to rent out homes or
    rooms to travelers, a decentralized and more personalized alternative to traditional
    hotels. Uber provides a platform for people to offer ridesharing services using
    their vehicles, creating a new form of transportation service.


    These platforms leverage technology, connectivity, and user systems to facilitate
    transactions and interactions between strangers. Before the internet, the idea
    of easily renting out a room in your house to a stranger or arranging a ride with
    someone you don''t know through a mobile app was not a common or easily conceivable
    behavior.


    The internet''s ability to connect people globally, coupled with advancements
    in digital payment systems and peer-to-peer communication, has led to the emergence
    and widespread adoption of these economy platforms, fundamentally changing how
    people access and utilize services and assets. This new behavior was made possible
    by the internet''s capacity to facilitate connections and transactions between
    individuals in a way that was previously unimaginable.


    ![](img/0daad7af426489da2dbf472852976622_116_0.png)


    # Blackboard lesson of how the Internet has created new economic models and behaviors.


    Understanding the principles of the internet in combination with Lean principles
    is essential to grasp the profound impact of Blockchain technology. To fully appreciate
    the potential of blockchain and navigate its transformative effects, it''s crucial
    to break free from traditional thinking and not be bound by the status quo or
    resistance to change.


    This chapter draws a comparison between the principles of Lean and the principles
    of Blockchain technology, providing a framework for embracing this innovative
    technology and its potential.


    # The Seven Blockchain Principles


    In this book, we often refer to the internet as Web 2.0 and Blockchain as Web
    3.0. However, for Blockchain technology to function, it does require the internet
    as a communication layer. Blockchain is an evolution in how the internet is used
    rather than a complete stand-alone technology. Some of the principles of the internet
    do also apply to blockchain; however, blockchain has several of its own principles
    that are separate from internet principles.


    We examine seven key principles of Blockchain technology, which are the basis
    of its power to transform business and society for the better.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 1. Remove Intermediaries (See Figure 5.2)


    Blockchain technology transforms the flow of value between the parties involved
    in a transaction by eliminating intermediaries. Intermediaries (sometimes referred
    to as “middlemen”) are a common source of bottlenecks in traditional systems.
    Intermediaries have traditionally been considered to be “Essential Non Value Added”
    or “Type 1 Muda³. This traditional dependence on intermediaries has resulted in
    slower transactions, higher costs, and exposure to centralized or single points
    of failure.


    Blockchain''s revolutionary impact lies in the decentralization of transactions
    through a distributed ledger. Unlike traditional centralized systems that rely
    on intermediaries such as brokers or third-party institutions, blockchain facilitates
    direct peer-to-peer transactions and removes the need for intermediaries. This
    direct interaction accelerates the value exchange between involved parties and
    reduces transactional friction.


    This decentralization is achieved by using networks of computers (nodes), where
    data and applications are distributed across the network, eliminating dependence
    on a single controlling authority. This disintermediation eliminates the need
    for third-party “middlemen”, significantly streamlining trust in value flow and
    making processes more predictable.


    # Remove Intermediaries


    ![](img/0daad7af426489da2dbf472852976622_117_0.png)


    Figure 5.2 Removal of intermediaries between transactions significantly streamlines
    value flow and makes processes more predictable.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Business Rules and Standard Operating Procedures Automated


    A crucial aspect that contributes to removing bottlenecks, the integration of
    smart contracts—a cornerstone of Blockchain technology. These self-executing contracts,
    embedded directly into the blockchain, automatically enforce and execute agreements
    when predefined conditions are met. Their automated and trustless nature eliminates
    the need for intermediaries, ensuring seamless and secure transactions.


    Furthermore, blockchain''s inherent transparency and immutability guarantee the
    secure recording of all transactions, making changes impossible.


    Essentially, blockchain''s elimination of intermediaries and its decentralized,
    transparent, secure framework play a crucial role in reducing barriers to the
    flow of value. This streamlined process promotes faster, more cost-effective,
    and more secure transactions, effectively eliminating traditional bottlenecks
    common in centralized systems.


    It does not require a Kaizen approach to the existing process, but a radical change
    in the way we work. In Lean philosophy, it is called a Lean Kakushin event.


    ![](img/0daad7af426489da2dbf472852976622_118_0.png)


    > “In most organizations, the bottleneck is at the top of the bottle”.

    – Peter Drucker


    # 2. Add Simplicity


    Less is more: Simplicity promotes shared understanding and clarity.

    Simplicity (inventive principle #2 in the TRIZ⁴ methodology⁵: “Taking Out”) is
