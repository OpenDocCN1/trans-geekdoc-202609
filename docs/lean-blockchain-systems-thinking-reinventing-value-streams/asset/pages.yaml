    Here''s a brief explanation of different types of tokens:


    # Security Tokens


    Security tokens represent ownership in an asset, similar to traditional securities
    or bonds. They are regulated and typically offer rights to dividends, profit shares,
    or voting rights within a company. Security tokens must comply with securities
    regulations.


    For example, a security token might represent ownership in a real estate property
