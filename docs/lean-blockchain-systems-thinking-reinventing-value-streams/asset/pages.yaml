    # Brief Explanation of This Care Process


    A patient is insured with the insurer and receives “care credits”. After the care
    is provided, the care provider records the provided care on a worksheet. The worksheet
    is then forwarded to the care agency for system recording. The data is then transmitted
    to the insurer, who also enters the same data into their systems. Finalization
    or settlement is achieved once all information is processed and synchronized.


    Our small-scale healthcare scenario involves four primary stakeholders (see Figure
    4.8):


    +   - the patient

    - the insurer

    - the healthcare agency

    - maternity care worker


    The process is explained in four simple steps:


    +   1. Customer eligibility approval

    The insurer approves the customer through a know-your-customer (KYC) process,
    allowing eligibility for care services. Care can be provided only after the customer
    has been accepted by the insurer.

    2. Care provision and documentation

    After care is provided, the maternity care worker generates a timesheet upon the
    hours care provided. The patient must also sign this for confirmation.'
