  md: 'product-oriented thinking to platform-oriented thinking, with an emphasis on
    coordination and facilitation. The effects of revolutionary technology, such as
    the internet, often unravel a compelling tale—clear and evident in hindsight,
    yet challenging to foresee in advance.


    > In the past, landowners were in control, with farmers creating value through
    their work. The majority of this value ended up in the landowner''s pockets. In
    our digital world, the land has been replaced by big data, cleverly harnessed
    by platform economies (FAANG companies).


    The internet is often criticized for treating individuals as commodities, diminishing
    our control over personal data. Companies utilize this data at the expense of
    user autonomy, sometimes engaging in actions that conflict with user interests.


    Just as with the invention of the wheel and the development of the internet, blockchain
    brings unforeseen consequences. To stay ahead, embracing change is crucial, alongside
    recognizing the internet''s limitations. Letting go of outdated habits and embracing
    a new, innovative approach is imperative. This new form of accounting may allow
    us to work in a more balanced way.


    # Triple-Entry Accounting


    Visualize each interaction as a transaction. See Figure 3.2.


    The current Internet protocol (TCP/IP) facilitates information transactions without
    intermediaries. However, transactions involving tangible value like voting rights,
    money, or diplomas necessitate intermediaries. These entities manage, monitor,
    and control access to information, often charging fees. Examples include government
    bodies, banks, accountants, and educational institutions.


    Why are intermediaries necessary? It comes down to trust. Monitoring the debit
    and credit flows of the balance sheet is crucial. If everyone were to maintain
    their own balance sheet, trust in the data would be compromised. Therefore, the
    existence of structured trust within specific roles, organizations, and supervisors
    becomes trustless.'
  merge: -1
  img_proc: true
