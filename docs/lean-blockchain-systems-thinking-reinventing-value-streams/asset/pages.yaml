  md: '# Examples of Tokens That Are Not on a Blockchain


    Although we may not be aware of them, tokens are already widely used in our daily
    lives. We use physical and internet-based tokens already for proof of ownership,
    identity, or access, and they play an important role in simplifying processes
    and facilitating transactions in various domains.


    These examples of physical and internet-based tokens assist in many of the principles
    of Lean methodology, streamlining operations and improving organizational efficiency.
    In this section, we provide examples of tokens that are already used in our daily
    lives.


    ![](img/0daad7af426489da2dbf472852976622_183_0.png)


    # Physical Money


    Physical money is the most obvious example of a token. The money itself does not
    have value; it is what it represents which is important. Money functions as a
    tangible representation of the intangible concept of value, enabling economic
    transactions and serving a critical purpose within an economy. As a token, it
    embodies consensus about value and facilitates the exchange of goods and services
    within a society.


    # Debit Card


    A debit card can be viewed as a token due to its role in representing access to
    financial resources and as a means of authentication in financial transactions.
    You don''t have to have physical money in your pocket to make a purchase. The
    debit card is a token of your ability to exchange money.'
  merge: -1
  img_proc: true
