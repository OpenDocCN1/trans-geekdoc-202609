- pgno: 147
  md: '# Building Blocks ■ 121


    # Accountability


    Accountability is the obligation to act on actions, decisions, and performance.
    It means taking responsibility for outcomes, both positive and negative, in personal,
    professional, or organizational contexts. This commitment involves transparency,
    integrity, and acceptance of the consequences of your behavior.


    An example of the lack of accountability is the use of disposable plastic. Consider
    the packaging sector. Many industries, including food and beverage, electronics,
    and consumer goods, rely heavily on plastic packaging due to its versatility,
    durability, and cost-effectiveness. While plastic packaging has several benefits,
    it also contributes significantly to the global plastic waste.


    The lack of responsibility for plastic waste is clearly visible at different stages
    of the product life cycle. For example, manufacturers prioritize cost-efficiency
    and convenience by using single-use plastic packaging, which is often discarded
    after a short period of use. End users, in turn, may improperly dispose of the
    packaging, leading to environmental pollution.


    The challenge lies in the fact that responsibility for plastic waste management
    is often fragmented and lacks a comprehensive approach. Many industries and consumers
    do not have robust systems in place to collect, recycle, or properly dispose of
    plastic waste. In many cases, plastic waste ends up in landfills, water bodies,
    or incineration, causing harm to ecosystems and wildlife.¹¹⁵


    Governments, industries, and consumers all have a role to play in tackling this
    problem. The lack of a uniform and responsible approach to plastic waste management
    contributes to the perpetuation of the environmental problems associated with
    plastic pollution. Initiatives such as extended producer responsibility and increased
    awareness of sustainable practices are crucial steps toward improving responsibility
    for plastic waste throughout its life cycle.


    # Profit, People, and Planet¹⁴


    In 1994, John Elkington coined the phrase “Triple Bottom Line” of People, Planet,
    and Profit (also known as the 3Ps).


    The idea behind the “3Ps” is that in order for companies to measure their true
    value, they should use three separate performance indicators. These should focus
    on profit but also the organization’s social (people) and environmental (planet)
    impact.'
  merge: -1
  img_proc: true
