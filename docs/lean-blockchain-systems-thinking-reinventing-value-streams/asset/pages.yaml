  img_proc: true
- pgno: 77
  md: '# Balancing ■ 51


    Rai stone at the Hamburg Ethnology Museum: https://en.wikipedia.org/wiki/Rai_stones


    What makes “the stone money” of Yap even more remarkable is the method of transaction.
    Carrying these massive discs was nearly impossible, so the Yapese people devised
    a unique system of exchange. It wasn''t the physical transfer of the stone that
    determined ownership, but rather a **system of word of mouth and oral history**.
    Everyone in the community knew the rightful owner of each stone was, and this
    collective understanding the same system functioned seamlessly.


    The Rai Stone functioned as **the first technological oracle** because it facilitated
    communication between community members who could not trust each other 100%.


    The function includes:


    +   - Listening to the needs of the system and knowing their boundaries

    - Collect and broadcast data

    - Make use of a standard process procedure

    - Shows the dependency with others

    - Validate and create consensus of the output


    The community supervisor often spoke the truth or make the final judgment when
    there was uncertainty regarding the decision-making process.


    The use of the Rai stones is an example of **single-entry accounting**. Single-entry
    accounting is a system in which financial transactions are recorded in one account,
    without a corresponding entry being made in a second account. This system was
    used in ancient civilizations and was the first recorded accounting method. The
    stones could be used because there was a basis of trust within the community.


