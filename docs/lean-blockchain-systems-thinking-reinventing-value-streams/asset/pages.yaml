    The internet has not revolutionized accounting like double-entry bookkeeping for
    single accounting. However, it is crucial to acknowledge how the internet has
    transformed our trust in organizations.


    It has given rise to new organizational and business models, introducing innovative
    products and seduction techniques.


    While before the internet era we had no need to be reachable by mobile phone,
    during the internet era we have become completely dependent on mobile phone.


