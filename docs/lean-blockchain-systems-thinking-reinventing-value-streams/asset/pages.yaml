  md: '# 8 Lean Blockchain Systems Thinking


    Lean practitioners and consultants to introduce the concepts and technology of
    blockchain and Web 3.


    The adverse effects of information fragmentation, characterized by fluctuating
    demand downstream, are referred to as the “Bullwhip” effect or whiplash effect
    within the supply chain. This phenomenon occurs when information arrives late,
    leading to automatic inventory fluctuations. Imagine the transformation if we
    shared critical information with our chain partners, such as customers providing
    real-time product feedback. This could dramatically impact lead times, quality,
    and customer satisfaction, as we will explore later. One can envision a “supermarket
    model” where all stakeholders gain insight into the “who, what, where, and when”
    of a process.


    Blockchain technology provides a solution to the problem of information fragmentation
    and information silos, for example, upstream suppliers may not have sufficient
    insights into the true fluctuation in downstream demand in a supply chain and
    therefore overcompensating, creating the “Bullwhip” effect.


    Imagine the reduction in waste and gains in sustainability if we shared critical
    information in real-time with supply-chain stakeholders, partners, suppliers,
    and customers who need it to make decisions. When information is not shared, not
    complete, not correct, or is lost, this results in many wastes, as shown in Figure
    1.1.


