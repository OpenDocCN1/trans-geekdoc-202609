- pgno: 178
  md: '# Accountability


    Data on internet-based Kanbans can be altered or deleted by users with the appropriate
    permissions. While there may be version control and audit trails, data can still
    be modified by authorized users. This is different with blockchain-based Kanban.


    Once data is recorded on a blockchain, it is nearly impossible to alter or delete.


    The immutability of the blockchain ensures that data remains secure and unchanging,
    providing a high level of data integrity and trust. Immutability leads to ownership
    and accountability, especially when combined with the transparency component.


    > What Is CRUD?

    CRUD is an acronym that comes from the world of computer programming and refers
    to the four functions that are considered necessary to implement a persistent
    storage application: **Create, Read, Update,** and **Delete.**.

    The blockchain is designed to be an append-only structure. A user can only add
    more data in the form of additional blocks. The delete function is missing.


    # Transparency and Traceability


    With internet-based Kanbans, transparency and traceability are reliant on the
    service provider’s policies and practices. Users must trust the provider to maintain
    a transparent and accountable system. Blockchain’s transparent and decentralized
    nature inherently provides accountability and traceability. All participants can
    verify and audit the data on the blockchain, ensuring trust based on distributed
    consensus rather than trust in a single entity.


    # Security


    With internet-based Kanbans, security measures rely on the service provider’s
    infrastructure and practices, which can be vulnerable to breaches or data manipulation.
    Blockchain’s security is based on cryptographic'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'algorithms and decentralization, making it highly resistant to hacking or fraudulent
    activities. The consensus mechanism adds an additional layer of security.


    # Integration and Interoperability


    With internet-based Kanbans, the integration with other internet-based tools and
    systems may require require custom development and API (Application Programming
    Interface). Interoperability can be a challenge. Blockchain''s modular and open
    architecture can facilitate easier integration with other blockchain-based systems
    and applications, improving interoperability.


    # Data Ownership and Control


    With internet-based Kanbans, users typically have limited control over their data.
    Data is often stored on the service provider''s servers. With blockchain-based
    Kanbans, users have greater control over their data and can maintain-ownership.
    Data stored on the blockchain is distributed, and users can access and manage
    it directly.


    CASE STUDY

    Data from physical infrastructure is made more transparent and accessible to all
    stakeholders using Blockchain technology.

    Data can then be used as a Kanban for status and alerts to any organization or
    person who can benefit from knowing!


    Decentralized Physical Infrastructure Networks (De-PIN) represent a shift in how
    data from infrastructure systems is managed and controlled. The De-PIN utilizes
    Blockchain technology to decentralize and share data associated with physical
    infrastructure such as telecommunications and energy distribution systems, but
    also such things as transport systems and house-hold devices.'
  merge: -1
  img_proc: true
