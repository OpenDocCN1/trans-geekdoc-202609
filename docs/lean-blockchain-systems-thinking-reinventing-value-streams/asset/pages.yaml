  md: '# Chapter 3


    # Balancing


    Ecosystem balance is the ability of a community to tolerate disturbances without
    entering a qualitatively different state. Balance creates stability in the sense
    of resilience, persistence, and resistance to major change.^1 This requires a
    transformation from a focus solely on growth and efficiency to ecosystem balancing,
    in which collective learning, adaptability, flexibility, and collaboration are
    the success factors.


    Balancing is essential for sustainability. For any system, when the inflow of
    a resource becomes less than the outflow, then depletion of that resource occurs.
    An example of this is the overfishing of certain species of fish in our oceans.^2


    Balance is required for sustainability. Any system that does not have balance
    will ultimately be unsustainable. This chapter explores the concept of balance
    and how Lean principles, together with Blockchain technology and Systems Thinking,
    can improve balance and equilibrium in order to achieve greater system sustainability.


    # Learning Objectives


    Upon completing this chapter, you will be familiar with:


    +   - The concept of balancing a system

    - System failure

    - Single-entry accounting

    - Double-entry accounting'
