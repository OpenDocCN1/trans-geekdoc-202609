- pgno: 43
  md: '# 1. Overproduction


    Producing more than requested or producing earlier than planned can lead to excess
    inventory, higher storage costs, and waste products become outdated or expired
    over time. Keep in mind that overproduction often comes from insufficient or a
    lack of real-time information or because of “just-in-case” management.


    # Improvements


    By improving the transparency and accuracy of information, companies can reduce
    the risks associated with overproduction. The Lean principle of producing the
    right amount of products at the right time and with the right resources is called
    “just-in-time” management. This requires just-in-time information.


    # 2. Waiting


    Delays in processes, whether due to idle time or waiting for materials, information,
    or approvals, can significantly impact operational efficiency and productivity.
    When workers are left waiting for the next step in a process, valuable time is
    wasted, leading to increased lead times, reduced throughput, and higher costs.
    Waiting is a symptom of a lack of flow in the process design.


    # Improvements


    Investing in advanced technologies that improve communication, collaboration,
    and coordination, as disintermediation, represents a clear path to significantly
    accelerate the reduction of wait times. Think of removing the intermediary by
    introducing a real-time information board, functioning as an automative trusted
    traffic light. This will replace all the actions that go along with intermediation,
    removing the opening hours, waiting times, the verification and authorization
    processes, etc.


