  md: '# Chapter 7


    # Procedures


    In this chapter, we explore the concept of procedures and learn why we need standard
    operating procedures (SOPs). We delve into the definition of a procedure and trace
    their evolution in the context of the internet and cryptography.


    # Learning Objectives


    Upon completing this chapter on procedures, you will be able to:


    +   - Explain the importance of standard procedures

    - Understand how procedures organize trust and the truth

    - Comprehend the concepts of smart contracts

    - Give some examples of cryptographic procedures

    - Introduce “the oracle problem”


    In this chapter, we look at the operation of procedures both in general and specifically
    in the procedures carried out by the intermediaries. In many cases, these procedures
    can be automated with “smart contracts”. These are simple “if/when this happens
    then that is the outcome” (IFTTT).


    A standard procedure is a procedure that one group of people has agreed this is
    the right way to work. The agreements are recorded in a document where the specifications
    are described. If everyone agrees with this method, this method forms the standard.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '> “Coming together is a beginning. Keeping together is progress. Working together
