    # System Standards


    Blockchain goes beyond digitization to digitalization, encouraging collaboration
    in end-to-end processes and making it possible to integrate international standards.
    Complying with international standards leads to increased efficiency and reduced
    carbon emissions. There are already standards, but the problem is there is no
