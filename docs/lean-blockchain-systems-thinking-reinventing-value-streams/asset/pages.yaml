  md: '# Chapter 8


    # Kanban


    The Japanese word “Kanban” translates to “signboard” or “billboard” in English.

    It is a scheduling system originally developed by Toyota in the 1940s as part
    of their “Lean” Just-in-Time production method.


    +   - Kanban provides visual clarity and transparency of all transfers, actions,
    hand-offs, and changes in ownership (or responsibility).

    - Kanban facilitates transactions between two or more parties (stakeholders) who
    have common goals and objectives for the outcomes of the transaction.


    Think of Kanban as traffic flow management. Just as traffic lights and roads guide
    vehicles smoothly through intersections, a Kanban system helps to guide tasks
    and transactions through different transfers and hand-offs.

    A Kanban system helps to synchronize tasks and transactions to reduce the waste
    of waiting and “missed connections”.

    When a task or transaction is delayed at a particular stage, it is immediately
    visible, prompting timely intervention to keep the workflow moving. This prevents
    queues, waiting lines, and backlogs. Kanban also prevents stockouts due to poor
    management of stock (inventory) levels.


    # Learning Objectives


    Upon completing this chapter, you will be familiar with:


    +   - What is Kanban?'
