    # ## Why Do We Need Standard Procedures?


    An SOP precisely outlines the method of performing work, encompassing details
    such as computer settings or configurations for various IT devices and machinery.
    It extends to specifying conditions, including ISO standards, for conducting control
    activities and verification audits. Understanding the concepts of a standard and
    a procedure sets the stage for appreciating how **consensus, trust, and truth**
    are structured.


    A procedure is the description of a series of actions and agreements to coordinate
    routine cross-functional (between departments of organization) activities.

    In Chapter 9, we will talk about **standard**. This is something different from
    standard procedures. When we talk about standardization, we mean a standard for
    products, materials, and services; the agreed specifications; the taxonomy.


    Standard procedures play a crucial role in Lean management. Here''s standard procedures
    are integrated into Lean management:


    # ## What Is a Process?


    A process is made up of a group of related procedures that together have a common
    goal.


    # ## Standardization of Processes


    Lean management emphasizes the standardization of processes to reduce variability
    and enhance efficiency. Procedures serve as documented guidelines for standardizing
    tasks and activities, ensuring that everyone follows a consistent and optimized
    approach.'
