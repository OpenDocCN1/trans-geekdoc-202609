    # System Methodology: Word of Mouth


    On Yap Island, one of the Caroline Islands in Micronesia, during the period from
    approximately 1899 to 1919, transactions were carried out using a system known
    as "word of mouth". This unique method of exchange was used due to the impracticality
    of physically moving massive disks called Rai Stones, which served as the island''s
