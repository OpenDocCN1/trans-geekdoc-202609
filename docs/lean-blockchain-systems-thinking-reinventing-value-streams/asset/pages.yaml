- pgno: 197
  md: '# Tokenization ■ 171


    When you ask a “Yes” or “No” question in the computer world, it’s represented
    by either a 0 or a 1.

    A “Yes” might be represented by a 1.

    A “No” might be represented by a 0.


    Imagine checking a young person''s age for entry into a bar or night-club.

    Instead of sharing all the information, the exact date of birth, the system can
    simply provide a “Yes” or “No” answer to the question whether the person is over
    18 years old. This produces a “bit” as either a 1 or a 0. Zero knowledge (ZK)
    is transferred about the exact date of birth, the name of the person, or any other
    information. Only the answer to the specific question is given.


    ![](img/0daad7af426489da2dbf472852976622_197_0.png)


    **Figure 9.4 Blockchain** for proof of age without giving away other information
    such as name or address.


    In this process design **the full information is not shared; only the answer to
    the question is shared.** This has several advantages:


    # Privacy Protection


    Sharing only “yes” or “no” answers minimizes the amount of sensitive information
    exposed. This helps with GDPR (General Data Protection Regulation)⁸ compliance,
    as only the necessary information is shared and/or stored.


    # Simplicity


    The process becomes simpler and more efficient because less data is exchanged
    and processed. This can lead to faster verifications and transactions.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Transparency and Trust


    Because only the necessary information is shared, the process is allowed to become
    more transparent, and trust can be established between parties more easily. It
    is not necessary to trust the other party with more information than they need.
    This contributes to a better user experience and customer satisfaction.


    # Compliance


    By complying with GDPR (General Data Protection Regulations), organizations can
    avoid fines and legal complications arising from improper handling of privacy
    data.


    # Conclusion


    Using status updates in the form of "yes" or "no" answers can be an effective
    way to protect privacy-sensitive information while still providing needed functionality.
    This new process design can create safer, more efficient, and compliant systems.


    Tokenization transforms “ITs” (identities, objects) into BITs (digital representation).
    Any physical identity (IT) can have a digital representation on the Internet (BIT).
    With smart process designs we can get answers to questions without having to share
    unnecessary information and knowledge. We can give an answer (in order to prove
    something) without also giving additional knowledge about the answer (this is
    also known as a ZK proof¹⁰). Welcome to the world of programmable internet!


