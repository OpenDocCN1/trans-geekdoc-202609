- pgno: 102
  md: 'aiming to eventually establish a seamless one-piece flow, also called single-piece
    flow.²


    Notice how the information is pushed through the system. From the care provider
    toward the client, from the caretaker toward the care agency, and finally from
    the care agency towards the insurer.


    Only after every stakeholder has received this information can payment be made.


    What would a Single-Piece-Flow look like?


    +   1. When the service has been delivered and approved by the customer

    2. The information is immediately synchronized

    3. So that the payment can take place


    We are looking for a pull strategy that ensures that information is immediately
    synchronized when the customer agrees with the care provided. It is also clear
    that this is not the case in our current organizational model.


    Let us take a closer look at the entire process and try to determine the root
    causes.


    # 5. Analyze the Whole


    When stakeholders do not synchronize their information promptly, it leads to the
    accumulation of different types of waste, causing significant reductions in efficiency
    and productivity. Let us look at the specific types of waste that result from
    our current organizational model.


    # Waiting Times


    Insufficient collaboration frequently causes delays and waiting periods between
    process steps. For example, when one stakeholder finishes their task, but the
    subsequent stakeholder isn''t ready or informed, or leads to waiting times, wasting
    resources, and increased inefficiencies.


    # Over-Processing


    When stakeholders operate in silos, the transfer of information between them becomes
    fragmented and more complicated (consider your email communications). Information
    may need to be passed through multiple channels, systems, applications, or individuals,
    which can lead to errors, delays, and the risk of miscommunication.'
