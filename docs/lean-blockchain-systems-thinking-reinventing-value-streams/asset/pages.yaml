- pgno: 89
  md: '# Cause and Effect ■ 63


    production line. The idea is to identify and optimize bottlenecks and inefficiencies
    within the process.


    By implementing process mining, you may be able to identify where inefficiencies
    within your process are occurring, but it doesn''t necessarily identify the root
    cause of the problem.


    It would not, for example, be able to identify if the wrong information or incomplete
    information is being supplied as inputs to the process. This information is outside
    of the scope of the process mining tool, and we are often unable to validate the
    accuracy of that information.


    This is similar to a doctor only identifying the symptoms of a disease (high temperature,
    fatigue, headaches, etc.) without understanding the underlying cause of the disease
    and how it was transmitted.


    A more holistic, system-wide approach not only identifies symptoms within a process
    but also understands the root causes of the symptoms which are originating from
    outside of the process.


    This is an excellent use of Blockchain technology, where information can be shared
    more transparently and directly among all parties involved in a supply chain or
    extended value-chain.


    Blockchain technology achieves this by providing one common ledger of data transactions,
    with data integrity and security "by-design" which can be trusted by all parties
    (stakeholders).


    Blockchain technology creates the ability to allow access only to the specific
    information needed by specific parties to be efficient and effective in the part
    of the value chain that they control. Blockchain also securely protects (by-design)
    information (such as internal records or personal information) from those parties
    who have no good reason to access it.


    Rules are assigned to specific data categories and to specific stakeholder identities
    (digital identities) to define access rights throughout the supply chain or value-chain.


