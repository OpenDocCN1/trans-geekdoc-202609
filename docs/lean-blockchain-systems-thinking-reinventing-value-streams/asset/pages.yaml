  md: '# Summary


    Standard procedures are integral to daily life, offering essential structure,
    consistency, and guidance across diverse activities for reaching our goals. They
    contribute significantly to efficiency, safety, and the seamless functioning of
    operations. The ascent of Blockchain technology is closely intertwined with the
    emergence of automated procedures known as smart contracts.


    Smart contracts serve the purpose of automatically executing agreements, ensuring
    adherence to contractual terms, minimizing exceptions, and eliminating intermediaries.


    However, challenges persist in the realm of blockchain and smart contracts. A
    primary issue is their detachment from the real world, existing within specific
    blockchain ecosystems—akin to a siloed or specific truth. A critical missing link
    is the connection to (off-chain) truth derived from the physical world.


    This challenge is concerned with the quality of input data from external souces
    such as financial market data, weather data, human behaviour data (for example
    births and deaths) and is commonly referred to as “the oracle problem”.¹


