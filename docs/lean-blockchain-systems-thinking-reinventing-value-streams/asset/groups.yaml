    # 精益化区块链系统思维


    ## 精益会计


    ![](img/0daad7af426489da2dbf472852976622_84_0.png)


    **图 3.3 从单式记账到复式记账再到三式记账的时代演变。**


    这一突破性的功能使得无需依赖中间介即可证明，开启了组织的革命性方法。


    当信息存储在单一中心位置时，它会变成一个脆弱的故障点，容易受到操纵和未经授权的访问。然而，区块链打破了这种范式，消除了单点故障并加强了数据完整性以防篡改。


    随着我们从单式、到复式、最后到三式记账跨越时代跨越，我们还创造了一个更“精益”的会计系统。见图 3.3。


    # 总结


    本章首先强调了平衡在精益系统思维中的至关重要。维持系统的平衡涉及调节资源的流动，确保效率、稳定性、适应性、质量和持续改进。未能平衡系统会导致“公地悲剧”，即自私利益耗尽共享资源，正如过度捕捞所示。


    # 平衡 ■ 59


    讨论涵盖了历史会计方法：以雅普岛（Yap Island）口系统为代表的单式记账，以及向复式记账的演变。复式记账为记录带来了准确性、财务控制和透明度。


    叙述转向互联网时代的影响，探讨了在涉及有形价值交易时对第三方信任的必要性。它强调了大数据作为数字时代主流货币的角色，并质疑了中心化的私营公司和政府处理我们数据的可靠性。


    区块链技术的出现被认为是信任和透明度问题的潜在解决方案，引出了三式记账的概念。区块链承诺去中心化、安全性和透明化，通过减少对中间介的依赖，可能彻底改变交互方式。


    最后，探索了精益哲学与区块链技术的融合。精益哲学对优化价值流的关注与区块链去中间质化的潜力相遇，重塑了传统的组织结构并**平衡了整个系统**。见图 3.4。


    总的来说，本章对平衡系统的重要性、会计原则的演变，以及区块链技术在变革交易信任和透明度方面的转型潜力提供了一个整体视角。


    # 平衡系统


    ![](img/0daad7af426489da2dbf472852976622_85_0.png)


    图 3.4 区块链重塑传统组织结构和平衡整个系统的潜力。


    区块链技术通过提供一个去中心化、不可篡改且透明的资产和信息交换平台的方法。虽然货币无疑是价值交换的形式，但区块链扩展了货币交易，涵盖了广泛的资产和权利，使其成为各个领域组织和促进价值流的多功能工具。


    这是一个在区块链技术上使用三式会计的计划示例。


    # Regen Network 与“生态信誉”


    Regen Network 是一个基于区块链的再生活动项目。Regen Network 选择使用“生态信誉”（Eco credit）一术。本博客概述了“生态信誉”、其在
    Regen Network 社区使用的历史，以及考虑过的一些替代方案。重要的是，我们使用的是一个在双方协议目标上明确的术语。


    - 基于资产的会计

    - 基于价值的会计

    - 基于贡献的会计

    - 基于碳抵消和缓解的会计

    - 基于碳移除的信誉体系

    - 结果付费

    - 环境管理支付

    - 生态效益会计与支付

    - 生态系统会计与支付


    ## 2.1 生态协议框架


    Regen Ledger 提供了三个核心生态协议框架：


    - 生态状态协议 (ESPs) 定义了验证某块土地特定状态或状态改变所需的算法和条件

    - 生态合约 (ECs) 允许我们资助并奖励理想的生态状态变化

    - 供应协议 (SPs) 允许我们以信任的方式将生态状态与供应链结合


