    # 第 10 章


    # DMAIC


    在任何组织中实现卓越运营都需要一种方法化和系统化的问题解决方法和持续改进。

    在精益区块链系统思维的背景下，DMAIC（定义、测量、分析、改进、控制）框架是提供结构化改进方法的卓越工具。


    本章始于对 DMAIC 框架以及定义、测量、分析、改进和控制阶段的理解。到本章结束，读者将理解 DMAIC 的益处，并理解其如何应用于从充满浪费和瓶颈的传统孤岛业务系统向基于精益、区块链技术和系统思维的连接型业务系统的转型。


    DMAIC 框架由摩托罗拉公司于 1985 年提出并使用，由通用电气在 20 世纪 90 年推广到全球，并通过 Michael L. George 的《服务精益六西格玛》在服务行业广受欢迎。


    # 学习目标


    完成本章后，读者将：


    - 理解 DMAIC 框架的“是什么”和“为什么”

    - 理解“如何”使用定义、测量和分析阶段来识别和理解传统组织（TRAD-ORG）当前状态系统和结构中的现有问题及其根源

    - 探索创新型问题解决和设计思维的概念，将其作为 DMAIC “改进”阶段开发解决方案的重要工具

    - 揭示去中心化组织（DE-ORG）改进后的未来状态，在那种状态下，消除孤岛和信任信息的点对点流动会导致吞吐量（价值交易） 10 倍以上的效率，并显著减少浪费

    - 认识到 DMAIC 为实现这种从“TRAD-ORG”到“DE-ORG”的提供了理想框架


    # 引言


    在之前的“因果关系”章节中，我们揭示了传统组织结构（TRAD-ORG）的固有问题，暴露了它们在设计上就会产生浪费、限制价值流动并提供低质量结果。为了帮助解决此类问题，我们提出了适用于精益区块链系统思维的改进型
    DMAIC 方案。

    见图 10.1。


    我们的观点是，区块链技术和系统思维补充现有的精益原则，将帮助通过改进协作、合作和通信来改进我们的组织结构，从而改善产品、信息和支付（PIP）的流。


    ![](img/0daad7af426489da2dbf472852976622_210_0.png)


    图 10.1 适用于精益区块链系统思维的改进型 DMAIC 方案。


    三流同步⁵），增加了价值吞吐量和结果质量。


    产产保健场景（在第 4 章介绍）说明了嵌入我们传统组织 TRAD-ORG 模型中的低效性。


    复杂的行政结算过程涉及涉及多个非增值步骤和 90 天的付款期，反映了系统内部缺乏协作和同步性差。


    显然，TRAD-ORG 结构导致所有参与者的等待时间长、成本高且满意度低。


    DMAIC 的定义、测量和分析阶段揭示了我们 TRAD-ORG 1 模型内部低效的根源。


    **两个关键问题——信息不对称和碎片化/孤岛化的组织结构**，被发现是 TRAD-ORG 模型中的根源，导致了很大比例的低效¹。


    信息不对称在医疗保健过程中很常见，会导致延迟和错误，增加复杂性（混乱）和利益相关者的不满。


