    # 成绩


    在学期结束时，他的成绩被令牌化并添加到他在区块链上的学术记录中。毕业时，Ivan 会收到一份令牌形式的数字毕业证书，他可以将其与潜在雇主分享以进行验证。


    # 存储在区块链上的数字令牌具有哪些精益益处和新可能性？


    区块链数字令牌的出现提供了新的精益益处和变革性的可能性。


    区块链实现的令牌化代表了资产所有权、交易和管理方式的**范式转变**。通过区块链技术，数字令牌提供了许多与精益原则无缝衔接的益处。从简化资产所有权流程到提高透明度和安全性，数字令牌的精益益处是多方面且影响深远的。


    精益方法论与区块链令牌化之间的共生关系是一种创新方法，它不仅优化了工作流，还为提高效率、可访问性和金融市场开辟了新途径。通过精益思维的视角，我们探索了区块链令牌化如何彻底改变共同创造、降低成本、增加灵活性并使投资机会民主化，从而改进整体而非局部。让我们从区块链令牌化的精益益处开始：


    # 简化与优化


    区块链实现的令牌化简化了资产所有权流程，促进了整个工作流中的一致性、效率、问责和透明度。这与精益系统思维相共鸣，强调房地产和私募股权等非流动资产可以通过区块链令牌化变得更具流动性，增强了市场流动性并可能降低与这些资产相关的风险。


    # 透明度与安全性


    基于区块链的令牌化提供了透明且安全的交易历史，减少了欺诈并确保了所有权记录的完整性。


    # 激励与责任：“利益相关”流程


    基于区块链的令牌化通过建立一种激励、责任和治理结构体系，鼓励网络参与者之间的积极参与、公平和协作，创造了“利益相关”的流程。


    # 数字令牌有哪些新可能性？


    基于区块链的所有权令牌化提供了许多新可能性。在下面的图 9.3 中我们展示了其中一些。


    - 基于区块链的令牌化拓宽了投资机会的获取，促进了互操作性并增加了市场的流动性。

    - 基于区块链的令牌化实现了房地产等传统不流动性市场中资产的碎片化所有权，允许更广泛的参与和多元化。


    ![](img/0daad7af426489da2dbf472852976622_193_0.png)


    图 9.3 基于区块链的所有权令牌化提供的许多新可能性之一。


    # 精益区块链系统思维


    - 基于区块链的令牌化提供了透明、安全且可审计的交易历史，确保了系统内的信任和问责。

    - 基于区块链的令牌化实现了材料、产品或服务的追溯性，这对于创建一个循环、再生和负责任的经济至关重要。

    - 基于区块链的令牌化通过标准化流程对共同目标进行协作。

    - 基于区块链的令牌化产生了不可破坏或不可更改的令牌。这实现了资产的生命周期管理，确保在令牌的整个生命周期内记录可靠且不可更改。


    > 令牌资产：价值或权利的数字表示，可以使用区块链分布式账本技术进行电子传输和存储。例如，一个令牌可以代表物理鞋子或 T 恤的所有权，或者使用自行车的权利。


    # 输入 → 令牌 → 输出


    随着区块链令牌化和加密货币的持续增长和发展，越来越多有趣的用例正在开发中。


    示例：


    - 为自动车辆提供优先级的区块链令牌。当两辆车同时到达路口时，哪辆车先走？

    - 车辆所有而非驾驶员拥有的停车令牌。

    - 在音乐会或体育赛事中通过优先门的安全令牌。


    # 区块链令牌分类


    自区块链诞生以来，已经开发了几种不同类型的区块链令牌。根据其分类，每种令牌都适用不同的规则（协议）、责任和功能。在这一探索中，我们检查了令牌的多样性，不同的类别提供了独特的特征，服务于不同的目的并具有不同的用例。


    令牌类别还可以决定外部监管、控制的程度以及符合法律要求的能力。根据令牌化的内容，不同令牌受不同法规、尽责义务和特定行为规则的约束。


    以下是对不同类型令牌的简要说明：


    # 证券令牌 (Security Tokens)


    证券令牌代表资产的所有权，类似于传统的证券或债券。它们受监管，通常提供公司内的股红、利润份额或投票权。证券令牌必须遵守证券法规。


    例如，证券令牌可能代表房地产的所有权或公司股份。一个例子是初创公司股份的令牌化，投资者接收代表其股权份额的令牌。


    # 实用型令牌 (Utility Tokens)


    实用型令牌提供对特定平台或生态系统中产品或服务的访问权限。它们的设计并非为了投资，而是作为访问特定功能或服务的手段。这些令牌通常用于支付特定生态系统内的商品和服务（例如Cosmos³
    生态系统或Polkadot⁴ 生态系统）。


    一个例子是以太坊的 Ether，它用于支付以太坊网络（第二大区块链）内的交易费用和智能合约执行费用。


    # 股权令牌 (Equity Token)


    股权令牌代表公司的所有权，类似于传统的股票。它们授予股红、投票和其他所有权特权。这些令牌与证券令牌的区别在于，它们可能并不总是处于严格的监管之下。


    一个例子可以是私人公司股份的令牌化表示。


    # 资产令牌 (Asset Token)


    资产令牌代表物理或数字资产的所有权或权利，例如商品、艺术品或知识产权。这些令牌实现了在区块链上进行碎片化所有权或交易。


    例如，一件艺术品可以被令牌化，允许投资者购买和交易该艺术品的部分。你可以收取入场费让他们查看该物品，从而为你产生（碎片化的）被动收入。


    # 奖励与激励令牌 (Reward and Incentivization Tokens)


    这些令牌奖励并激励生态系统或社区内的某些行为或行动。可以通过参与、贡献或特定成就获得，并且通常代表社区内的声誉或价值。


    一个例子是 Steem 的令牌 STEEM，它奖励用户在基于区块链的 Steem 社交媒体平台上创建和策划内容。


    这些令牌展示了区块链和加密领域内多样化的功能和目的，每种令牌都满足其各自生态系统中所有权、实用性、激励或奖励的不同方面。


    这些令牌的多样化格局凸显了区块链技术的复杂性以及潜藏的机遇。


    # 二元选择思维：从返回整体到转移目标


    想象你正在和朋友玩一个非常简单的游戏。你只能提问有“是”或“否”答案的问题。你只能得到一条信息的返回。


    我们可以把这种信息称为**“比特”（bit）**。


    在计算机世界中，一切都以“比特”的方式运行。**比特是计算机可以处理的最小信息单位**⁶。它是所有数字数据的构建块。


