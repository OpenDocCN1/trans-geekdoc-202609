  mdcn: "\n\n# DMAIC 193\n\n改进阶段（Improvement phase）我们可以实施区块链技术提供的许多变革可能性，以解决并消除困扰传统组织（TRAD-ORG）流程的根源。\n\
    \n从传统组织到去中心化组织（DE-ORG）的思维转变是构建更高效、响应灵敏且面向未来的系统的关键。创新智能技术与证明的精益（Lean）原则的融合，是实现彻底业务创新和改进的关键。\n\
    \n在精益区块链系统思维的改进阶段，我们从个人目标转向系统目标，从中心化控制转向去中心化共识，从隐藏信息转向透明化。\n\n这种转变通过使用生态系统设计框架（Ecosystem\
    \ Design Framework）并结合 Machiel Tesser 在 2018 年建议的关系逻辑协议得到了促进。7 \n\n该模型基于“如果 <谁>\
    \ 做了 <什么>，那么 <什么>”的关系逻辑协议运行。\n\n参见图 10.9\n\n- **谁（Who）：** 识别涉及的利益相关者/身份。\n- **什么（What）：**\
    \ 识别他们的角色和增值活动。\n\n![](img/0daad7af426489da2dbf472852976622_219_0.png)\n\n**图\
    \ 10.9** 根据 Machiel Tesser 在 2018 年建议集成的关系逻辑协议的生态系统设计框架。\n\n谁 + 什么 => 发生过（That\
    \ It Happened）：谁和什么信息的共识与整合。一个证明、一个时间戳、关于某事发生的系统批准共识。该信息是关于预定义系统变更的网络状态更新。\n\n\
    规则规范该协议：\n\n该模型提供了一种结构化的方法和共识框架，确保利益相关者在以可持续的方式共同实现系统目标时，保持清晰度和协调性。\n\n# 设计控制与内在价值控制元素\n\
    \n使用带有系统思维的去中心化区块链框架，导致了重新评估哪些控制元素具有内在价值。曾经在中心化系统中被认为有意义的任务在区块链框架内正在失去意义，特别是在信息同步、检查和第三方验证、治理以及合规领域。\n\
    \n如果所有利益相关者都参与控制阶段并拥有平衡的话语权，那么基于既有规则、指南、公差和限制的控制、治理和合规将变得更容易且公平。通过防止权力在部分利益相关者中集中，可以避免价值创造过程中的扭曲激励、冲突目标和腐败。8\n\
    \n![](img/0daad7af426489da2dbf472852976622_220_0.png)\n\n> “长期价值创造可以——也应该——考虑到所有利益相关者的利益”9\n\
    \n- - Marc Goedhart 和 Tim Kolle\n\n该框架还促进了关于具有影响力和有目的工作的意义讨论，摆脱了对可能无法满足客户需求或目标的传统结果的追求。它通过其系统设计专注于价值管理和控制。\n\
    \n让我们突出一些基于精益原则的强大控制机制：\n\n# 控制与改进流程机制\n\n去中心化和代币化促进了参与者之间的直接交易和互动，跳过了传统的中间商。确保在价值主张和分配的责任上达成共识和一致，对于可持续的系统设计至关重要。\n\
    \n消除这些传输点的浪费提供了更强的控制并简化了操作，降低了成本，并促进了更高效、韧性、透明的生态系统。见图 10.10，了解使用精益结合区块链工具包时消除的一些浪费。\n\
    \n# 集成的精益工具\n\n![](img/0daad7af426489da2dbf472852976622_221_0.png)\n\n**图 10.10**\
    \ 使用精益结合区块链工具包消除的浪费总结。\n\n它代表了广为人知的“精益革”（Lean Kakushin）事件的“彻底变革”，而不是通过渐进改进来改善“现状”（status\
    \ Quo）。\n\n此外，区块链通过其安全、透明且不可篡改的账本确保了数据的数据的完整性。对防篡改数据的信任消除了与中心化或个人数据收集及传输相关的混淆和信任问题。\n\
    \n自动化是区块链去中心化架构促进的关键功能¹⁰，减少了手动任务和错误。与“如果...那么...”（IFTTT）原则¹¹允许主动检测非预期结果，为不合规活动触发及时干预。\n\
    \n在询问“我需要区块链吗？”时需要考虑的问题：\n\n- 所有利益相关者都完全信任彼此吗？\n- 利益相关者之间是否存在不同的利益和目标？\n- 信息流是否畅通？\n\
    - 对于什么构成增值活动是否有共识？\n- 你是否受益于对交易状态的 24/7 洞察？\n- 审计追踪是否可以通过透明度和自动化得到改进？\n- 流程是否由于不同系统、角色和目标之间的相互作用而变慢？\n\
    - 谁负责改进整个系统的功能是否模糊？\n- 利益相关者对系统性能和改进领域是否有定期的反馈？\n- 是否有衡量系统成功的清晰指标？\n- 人们是否意识到当前系统设计相关的成本和问题？\n\
    \n**10.11 询问“我需要区块链吗？”时需要考虑的问题。**\n\n为了突出我们碎片化组织模型造成的浪费，我们列出了产产护理过程中每个流程步骤产生的浪费。\n\
    \n这应该让我们更好地理解那些我们已经接受为常态的问题，以及这种非协作模式的影响和根源。\n\n产产护士填写时间表，这些工表必须由父母签字。\n\n**非增值：**\
    \ 打印工表、运输工表、入库工表、人员移动、等待时间等。\n\n产产护理机构接收工表并在并在 ERP 系统中处理它们。\n\n**非增值：** 过度生产、过度加工、人才浪费、等待时间、缺陷、审计/控制信息。\n\
    \n产产护理机构将信息转发给保险公司。保险公司在其 ERP 系统中处理这些信息。\n\n**非增值：** 过度生产、在不同系统中重复/同步信息。\n\n在\
    \ 90 天后，产产护理机构从保险公司处收到资金。\n\n**非增值：** 等待信息。等待付款。人才未充分利用。\n\n![](img/0daad7af426489da2dbf472852976622_223_0.png)\n\
    \n**图 10.12** 传统组织结构导致延迟和错误的非增值活动（浪费）。\n\n# 教训\n\n产产医疗场景说明了我们传统组织模型中存在的低效率。复杂的行政结算流程涉及纸质文件和\
    \ 90 天的付款期限，反映了系统内部缺乏协作和同步不良。传统结构导致了利益相关者的高昂成本和极大不满满。\n\n# 总结\n\n本章强调需要一种方法论和系统的方法来解决问题并持续改进，以实现任何组织的卓越运营。在精益区块链的背景下，DMAIC\
    \ 框架被提出作为从传统组织向去中心化组织过渡的有效框架。\n\n本章强调了基本假设从**个人目标转向系统目标**的转变，整合了区块链技术和精益原则以实现彻底的业务创新。\n\
    \n我们证明了 DMAIC 在识别和纠正传统组织模型内部问题的潜力和可能性。\n\n通过强调将区块链技术作为解决方案，我们解释了它如何实现 3 流 PIP\
    \ 并减少**信息不对称以及碎片化/孤岛化的组织结构，这些是传统组织模型中许多低效率的根源。**\n\n改进阶段引入了基于关系逻辑协议的创新生态系统设计框架。它提供了一种结构化的方法和共识框架，将系统思维应用于协作、环境和生态设计中。\n\
    \n控制阶段侧重于主动监控，以寻找进一步改进的机会，强调了主动的“设计控制”方法。在这一阶段平衡不同的利益相关者，增加了获得更公平、更可持续结果的概率。\n\
    \n本章以问题结束，帮助组织确定它们是否需要区块链技术，考虑到信任、无摩擦信息流、共识、透明度和程序自动化等因素。\n\n"
