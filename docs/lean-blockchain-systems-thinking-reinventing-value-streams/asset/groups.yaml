    # Identities (Roles)


    Intellectual property management with unique identifiers for people, self-sovereign
    identities (SSI), for companies (wallets), for content identity (CID), and decentralized
    identifiers for products (DID). DID''s rely on cryptography to prove that you
    are in control of a given identity.


    # Relationships


    Digital data carriers on physical products (like a QR code or RFID) with a look-up
