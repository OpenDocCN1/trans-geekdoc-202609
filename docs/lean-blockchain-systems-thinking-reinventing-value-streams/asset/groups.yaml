    # 精益区块链系统思维


    ![](img/0daad7af426489da2dbf472852976622_90_0.png)


    图 4.1 因果关系的简单示例。


    ![](img/0daad7af426489da2dbf472852976622_90_1.png)


    图 4.2 一条因果链。


    一种名为低温体症的生理状态。低温体症会导致身体发生各种神经系统变化，导致大脑和心脏功能恶化，最终导致死亡。见图 4.2。


    另一种表示这种“因果链”的常用方法是使用石川图，通常也被称为“因果图”或“鱼骨图”。见图 4.3。


    它通常被精益和六西格玛的实践者作为 DMAIC 框架中解决问题的工具之一（见第 10 章：DMAIC）。


    你能看出为什么它被称为“鱼骨图”吗？

    你能想到其他与体温下降无关的死原因吗？你否为图 4.3 中的鱼骨图填充其他潜在的死因方框？


    # 因果与结果 ■ 65


    ![](img/0daad7af426489da2dbf472852976622_91_0.png)


    **图 4.3 石川因果图，通常被称为“鱼骨图”。**


    以下这些情况如何：


    - 药物中毒

    - 溺水

    - 窒息

    - 药物过量

    - 心脏发病

    - 呼吸困难


    图 4.4 显示了**石川图/因果图/鱼骨图**的通用格式（你可以选择你最喜欢的名称！）。


    ![](img/0daad7af426489da2dbf472852976622_91_1.png)


    **图 4.4 使用 SigmaXL 制作的鱼骨图通用格式。**


    # 流程中的因果关系


    我们在示例中使用了一个名为 SigmaXL 的工具（见 SigmaXL.com）。通常，流程预期的结果和输出无法满足流程利益相关者的期望，特别是流程的客户。

    客户正在经历流程产生。这也被称为流程的“问题”或“问题陈述”。


    对于流程的结果或输出，建议的可能原因有几类。这些类别通常作为使用鱼骨图进行根因分析的起点。这些原因类别的定义方式使得它们的所有单词都以字母“M”开头，因此它们有时被称为“6M（6Ms）”。


    - **人力（Manpower）：** 指涉及流程的人力资源，包括他们的技能、培训和经验。

    - **方法（Methods）：** 描述用于完成流程内任务的程序、技术和过程。

    - **机器（Machines）：** 包括在流程中使用的设备、工具和技术。

    - **材料（Materials）：** 涵盖流程中使用的原材料、组件和供应品。

    - **测量（Measurements）：** 涉及评估流程性能的指标、（关键绩效指标 (KPIs））和数据。

    - **自然环境（Mother Nature/Environment）：** 考虑可能影响流程的环境因素，如温度、湿度或其他自然条件。


    6M 有助于识别流程内部问题或低效现象的潜在原因。


    # 精益区块链中的因果关系


    在精益区块链的背景下，我们将解释以下因果关系的示例：


    - **原因：** 竞争性的组织设计导致了设计上的浪费。

    - **结果：** 社会成本增加。


    # 图 4.5 精益区块链用例中的因果关系。


    见图 4.5。

    在这个示例中，低效的生产流程（6M 中的 Methods）和原材料的过度使用（6M 中的 Materials）被确定为主要原因。


    论点认为这导致了浪费产生的增加以及更高的环境和生产成本，而这些是产生的结果。然而，很可能存在更深层的底层根因导致了这两个高级原因。


    本章旨在深入研究我们现有的组织模型，以发现产生浪费、成本增加和对社会负面影响的根本原因。


    见关于高环境、社会和生产成本的鱼骨图（图 4.6）。为了展示区块链技术减少社会成本的优势之间的关系，我们提出了图 4.7 所示的石川（鱼骨）图。


    ![](img/0daad7af426489da2dbf472852976622_93_0.png)


    # 图 4.6 精益区块链用例的鱼骨图。


    ![](img/0daad7af426489da2dbf472852976622_93_1.png)


    # 区块链石川图


    ![](img/0daad7af426489da2dbf472852976622_94_0.png)


    **4.7** 区块链技术如何对减少社会成本产生积极影响？


    我们现在将通过一个实际的医疗流程示例来进一步解释这一点。


    > “如果你手里只有锤子，每个问题看起来都像钉子。”

    – 亚伯拉罕·马斯洛（Abraham Maslow）


    也被称为“工具法则”或“马斯洛的锤子”。


    # 精益区块链因果关系的医疗示例


    理解区块链的潜力由于其复杂性仍然是一项挑战。目前许多注意力都集中在去中心化和不可篡改性等技术方面，或者仅仅关注数字货币应用。这种新的设计以以前无法的方式组织流程。


    ![](img/0daad7af426489da2dbf472852976622_94_1.png)


    # 因果与结果 69


    ![](img/0daad7af426489da2dbf472852976622_95_0.png)


