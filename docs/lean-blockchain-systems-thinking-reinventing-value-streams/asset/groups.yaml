    # Purpose ■ 25


    the chance of loss of information, creating waiting times and extra (control)
    work. These waiting times increase the overall process lead time, reduce efficiency,
    and create a bottleneck for improving flow.


    The question we may ask ourselves is why do we use a push system for information
    transfer? Why are we still using paper receipts and emailing as communication
    and coordination mechanisms?


    > “The most dangerous kind of waste is the waste we don’t recognize”. Shige Shingo^5


    ![](img/0daad7af426489da2dbf472852976622_51_0.png)


    +   ■ Miscommunication due to information loss


    Each handover introduces the potential for miscommunication or information loss.
    As work moves from one team or individual to another, there is a risk of details
    being misunderstood, overlooked, or not adequately communicated. In a world where
    data is valued as money or knowledge, there is a danger that certain data may
    not be shared. This leads to data errors, rework, control activities, or a need
    for clarification.


    Do you think the intensive use of email could be the result of an information
    backlog?


    +   ■ Adaptability and agility challenges


    Working with handovers often results in a push system. In a push system, work
    is pushed to the next stage regardless of its demand. This lack of responsiveness
    to actual demand will again result in all kinds of waste, such as overproduction,
    overprocessing, and defects, as mentioned in the first paragraph of this chapter.


    +   ■ Transitioning to a pull system


    Addressing these issues involves transitioning from a push system to a pull system
    design without handovers. In a pull system, work is initiated based on actual
    demand, based on real time information from customers to suppliers. This shift
    enhances adaptability and agility, mitigates waiting times, and minimizes the
    risk of miscommunication.'
