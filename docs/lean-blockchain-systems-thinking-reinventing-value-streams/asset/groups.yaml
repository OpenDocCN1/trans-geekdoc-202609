    # DMAIC 193


    The Improvement phase is where we can implement many of the transformative possibilities
    that Blockchain technology offers in addressing and eliminating the root causes
    that plague TRAD-ORG processes.


    The change in thinking from TRAD-ORG to DE-ORG is the key to a more efficient,
    responsive, and future-proof system. The convergence of Innovative smart technology
    and proven Lean principles is the key to radical business innovation and improvement.


    In the Improvement phase of Lean Blockchain System Thinking we move from individual
    goals to system goals, from centralized control to decentralized consensus, and
    from hidden information to transparency.


    This transition is facilitated by the use of the Ecosystem Design Framework with
    the integration of relationship logic protocol as suggested by Machiel Tesser
    in 2018. 7


    This model operates on a relationship logic protocol of "if <who> does <what>,
    then <what>".


    See Figure 10.9


    - **Who:** Identifies the stakeholders/identities involved

    - **What:** Identifies their roles and value-adding activities


    ![](img/0daad7af426489da2dbf472852976622_219_0.png)


    **Figure 10.9** The Ecosystem Design Framework with the integration of relationship
    logic protocol as suggested by Machiel Tesser in 2018.


    Who + What => That It Happened: The consensus and integration of Who and what
    information. A proof, a timestamp, a consensus of the fact that something happened
    with system approval. That information is a net-work status update regarding a
    predefined system change.


    Rules govern this protocol:


    This model provides a structured approach and consensus framework, ensuring clarity
    and coordination among stakeholders as they collectively work towards systemic
    goals in a sustainable way.


    # Control by Design and Intrinsic Value Control Elements


    Use of decentralized blockchain frameworks with Systems Thinking leads to a reassessment
    of what control elements have intrinsic value. Tasks once considered meaningful
    in centralized systems are losing their meaning within the blockchain framework,
    especially in the areas of information synchronization, inspection, and third-party
    validation, governance, and compliance.


    Control, Governance, and Compliance based on established rules, guidelines, tolerances,
    and limits become easier and fairer if all stakeholders are involved in the control
    phase and have a balanced voice. By preventing a concentration of power within
    a subset of stakeholders, perverse incentives, conflicting goals, and corruption
    in the creation of value is avoided.8


    ![](img/0daad7af426489da2dbf472852976622_220_0.png)


    > “Long-term value creation can—and should—take into account the interests of
    all stakeholders”9


    - - Marc Goedhart and Tim Kolle


    This framework also facilitates meaningful discussions about impactful and purposeful
    work, moving away from the traditional pursuit of outcomes that may not meet the
    client''s needs or goals. It focuses on value management and control, through
    its system design.


    Let''s highlight some powerful control mechanisms based on Lean principles:


    # Control and Improve the Flow Mechanism


    Decentralization and tokenization promote direct transactions and interactions
    between participants, bypassing traditional intermediaries. Ensuring consensus
    and alignment on both the value proposition and the assigned responsibilities
    is critical for a sustainable system design.


    The elimination of waste in these transfer points provides greater control and
    streamlines operations, reduces costs, and promotes a more efficient, resilient,
    transparent ecosystem. See Figure 10.10 for some of the wastes that are eliminated
    using Lean together with a blockchain toolkit.


    # LEAN TOOLS INTEGRATED


    ![](img/0daad7af426489da2dbf472852976622_221_0.png)


    **Figure 10.10** Summary of wastes that are eliminated using Lean together with
    a blockchain toolkit.


    It represents “radical change” better known as a “Lean Kakushin” event, instead
    of improving the “status Quo” with incremental improvements.


    Furthermore, blockchain ensures clarity and data integrity through its secure,
    transparent, and immutable ledger. Confidence in tamper-proof data eliminates
    confusion and trust issues associated with centralized or personal data collection
    and transmission.


    Automation is a key feature facilitated by blockchain''s decentralized architecture
    with smart contracts¹⁰ reducing manual tasks and errors. Integration with If-This-Then-That
    (IFTTT) principles¹¹ allows initiative-taking detection of undesired results,
    triggering prompt interventions for non-conforming activities.


    Questions to consider when asking ‘Do I need a blockchain?’


    - Do all stakeholders trust each other completely?

    - Are there different interests and goals among stakeholders?

    - Does information flow freely?

    - Is there consensus on what constitutes value-adding activities?

    - Would you benefit from 24/7 insight into the status of transactions?

    - Could the audit trail be improved through transparency and automation?

    - Do processes slow down due to the interaction of different systems, roles, and
    goals?

    - Is it ambiguous who is responsible for improving the functionality of the system
    as a whole?

    - Is there regular feedback from stakeholders on system performance and areas
    for improvement?

    - Are there clear metrics to measure the success of the system?

    - Do people realize the costs and problems related to the current system design?


    **10.11 Questions to consider when asking ‘Do I need a blockchain’.**


    To highlight the waste caused by our fragmented organizational model, we have
    listed the waste created per process step in the maternity care process.


    This should provide a better understanding of the issues we have come to accept
    as normal, along with the effects and root causes of this non-collaborative model.


    The maternity nurse writes time sheets that they have to sign by the parents.


    **Non value adding:** Printing timesheets, transporting timesheets, stocking timesheets,
    movement of people, waiting times, etc.


    The maternity care agency receives the timesheets and processes them in the ERP
    system.


    **Non value adding:** Overproduction, overprocessing, waste of talent, waiting
    times, defects, auditing/controlling information


    The maternity care agency forwards the information to the insurer. The insurer
    processes this information in its ERP system.


    **Non value adding:** Overproduction, duplicating/synchronizing information in
    different systems


    After 90 days, the maternity care agency receives its money from the insurer.


    **Non value adding:** Waiting for information. Waiting for the payment. Talent
    underutilized


    ![](img/0daad7af426489da2dbf472852976622_223_0.png)


    **Figure 10.12** Non value adding activities (wastes) in a traditional organizational
    structure leading to delays and mistakes.


    # Lessons


    The maternity healthcare scenario illustrates the inefficiencies embedded in our
    traditional organizational model. A complex administrative settlement process,
    involving paperwork and a 90-day payment term, reflects the lack of collaboration
    and poor synchronization within the system. The traditional structure leads to
    high costs and great dissatisfaction for its stakeholders.


    # Summary


    This chapter emphasizes the need for a methodical and systematic approach to problem-solving
    and continuous improvement to achieve operational excellence in any organization.
    In the context of Lean Blockchain, the DMAIC framework is presented as an effective
    framework to be used in the transition from TRAD-ORG to DE-ORG.


    The chapter emphasizes a change in basic assumptions from **individual goals to
    system goals**, integrating Blockchain technology and Lean principles for radical
    business innovation.


    We have demonstrated the potential and possibilities of DMAIC for identifying
    and correcting problems within the TRAD-ORG model.


    Highlighting the use of Blockchain technology as a solution, we explained how
    it can enable the 3-flow PIP and reduce the **information asymmetry and fragmented/siloed
    organizational structures that are the root causes of much inefficiency in TRAD-ORG
    models.**


    The Improvement phase introduces an innovative Ecosystem Design Framework operating
    with a relationship logic protocol. It provides a structured approach and consensus
    framework, applying Systems Thinking to a collaborative, environmental, and ecological
    design.


    The Control phase focuses on active monitoring to look for opportunities for further
    improvements, emphasizing a proactive “control by design” approach. Involving
    the correct balance of diverse stakeholders at this stage increases the probability
    of fairer and more sustainable outcomes.


    The chapter concludes with questions to help organizations determine whether they
    need Blockchain technology, considering such aspects as trust, frictionless information
    flow, consensus, transparency, and procedure automation.

