    ## 代币化 ■ 171


    在计算机世界中，当你提出一个“是”或“否”的问题时，它由 0 或 1 表示。

    “是”可能由 1 表示。

    “否”可能由 0 表示。


    想象一下在检查一个年轻人进入酒吧或夜俱乐部的年龄。

    系统不需要分享所有信息（如准确的出生日期），只需简单地针对该人员是否超过 18 岁的问题提供“是”或“否”的回答。这产生了一个作为 1 或 0 的“比特”（bit）。关于具体的出生日期、个人姓名或任何其他信息，都不会传输零知识（ZK）。仅给出特定问题的答案。


    ![](img/0daad7af426489da2dbf472852976622_197_0.png)


    **图 9.4 区块链**，用于在不泄露姓名或地址等其他信息的情况下进行年龄证明。


    在这种流程设计中，**完整信息并不被共享；共享的是问题的答案。** 这有几个优势：


    ## 隐私保护


    仅共享“是”或“否”的答案可以最大限度地减少暴露的敏感信息。这有助于符合 GDPR（通用数据保护条例）⁸ 的规定，因为只共享了/或存储了必要的信息。


    ## 简单


    由于交换和处理的数据更少，流程变得更加简单且高效。这可以带来更快的验证和交易。


    ## 透明度与信任


    由于只共享了必要信息，流程允许变得更加透明，双方之间可以更容易建立信任。没有必要让对方信任比他们需要的更多的信息。这有助于提高用户体验和客户满意度。


    ## 合规性


    通过遵守 GDPR（通用数据保护条例），组织可以避免因处理隐私数据不当而产生的罚款和法律纠纷。


    ## 结论


    使用“是”或“否”答案形式的状态更新，可以在提供所需功能的同时，保护隐私敏感信息的一种有效方法。这种新的流程设计可以创建更安全、更高效且合规的系统。


    代币化将“ITs”（身份、物体）转换为“BITs”（数字表示）。任何物理身份（IT）都可以在互联网上拥有数字表示（BIT）。通过智能流程设计，我们可以在无需分享不必要信息和知识的情况下获得问题的答案。我们可以给出答案（为了证明某物），而无需同时提供关于答案的额外知识（这被称为
    ZK 证明¹⁰）。欢迎来到可编程的世界！


    ## 为什么精益实践者和顾问应该理解代币化？


    精益实践者和顾问应该拥抱区块链代币化不断演变的潜力。这项技术引入了新的价值主张、优化流程的动力和激励技术。精益的价值已经超越了单纯的改进，现在包含了开发社区价值的方法，例如包容性、生物多样性、可持续性和其他社会挑战。


    以下是使用精益原则通过区块链代币化可以改进的社区价值和可持续目标示例：


    ### 1. 加速循环经济融资

    在气候和生物多样性策略中


    融资循环经济是我们当代财务框架面临的挑战。基于区块链的代币化有助于推动资金支持支持资源效率、减少浪费和促进环境保护的可持续实践。


    在气候和生物多样性策略中拥抱循环经济，通过将财务投资与可持续生态平衡原则对齐，提供了一个推动影响力变革的机会。这一新框架下融资的构建模块是什么？


    - ■ 众筹与采购


    区块链技术提供了一种创新的方式，将人们聚集在一起为共同目标筹集资金，例如加速气候和生物多样性策略内的循环经济融资。区块链允许个人和组织以非常快的方式团结、筹集资金并向更可持续的未来迈进。


    - ■ 供应链透明度


    区块链实现了交易的透明且不可篡改记录，提供了整个供应链的全面视图。这种透明度对于验证产品的真实性和可持续性至关重要，确保它们符合绿色和清洁标准。消费者可以追溯货物的来源、历程和对环境的影响，鼓励采用环保实践。


    - ■ 原产地与认证


    区块链可以追溯并验证原材料的来源（产地），确保它们来自可持续来源。这一功能有助于打击伪品产品，并确保生产商品时使用的材料和人员符合伦理和环境标准。


    ## ■ 用于可持续倡议的智能合约


    嵌入区块链的智能合约可以自动化并执行可持续性协议，确保符合环境法规。例如，这些合约可以根据预定义的标准自动执行碳信用、可再生能源证书或其他可持续相关激励措施的支付。


    ## ■ 可再生能源交易


    区块链促进了微网中的点对点能量交易，允许个人或企业买卖多余的可再生能源，促进更清洁的能源生态系统。


    ## ■ 碳足迹跟踪


    基于区块链的系统可以跟踪和管理整个生命周期的碳足迹。这使得公司能够衡量并减少碳排放，促进更清洁的生产过程。


    > 比捕捉和追踪二氧化碳和碳更重要的是，得于点对点的流程设计，使用更少二氧化碳和碳的新流程设计。

    这解决了源头问题，而不是监控外部性。


    ![](img/0daad7af426489da2dbf472852976622_200_0.png)


    ## ■ 绿色投资代币化


    基于区块链的代币可以代表可再生能源项目或可持续倡议的投资和激励。通过提供透明且易于使用的投资平台，鼓励为绿色项目提供资金。


    环境政策的去中心化治理


    区块链可以支持环境政策和倡议的去中心化治理模型。区块链的共识协议允许多个相关相关参与决策过程，实现可持续目标的共识和有效协作。


    区块链技术有助于努力创造清洁、绿色、可持续和具有韧性的商品和服务。区块链技术提供的透明性、可追溯性和自动化可以对可持续实践和更具环保意识经济的发展做出重大贡献。


    ## 将我们的线性经济转变为循环经济


    代币化在从线性经济向循环经济的转型中起着关键作用，促进了资源效率、可持续性和材料再利用。它使环境、社会和治理（ESG）标准无缝集成到业务实践和投资策略中。


    Web 2.0 缺乏所需的去中心化信任基础设施，以确保共享网络中的协作完整性、伦令和效率。


    区块链技术（Web 3.0）提供了透明且不可篡改的操作记录，赋予整个端到端价值流中的网络参与者和利益相关者权力。这种包容性方法允许参与者持有彼此信任令牌，将个人成功与网络的集体成功相结合。


    此外，代币化显著增强了对 ESG¹¹ 的验证。通过追踪和验证数据来源（产地），基于区块链的代币化确保了真实性和信誉，从而加强了 ESG 信息的可靠性和完整性，为明智和准确的决策提供支持。


