    # Rules


    Data processing, data exchange, storage, authentication, integrity, security,
    and privacy.


    # Results


    Sustainable products regulation, greenhouse gas emissions reporting, etc.


    # What Is the Added Value of Blockchain Technology?


    Let''s explore why blockchain is a necessary addition to Lean. We will do this
    looking at the six revelations of Russell L. Ackoff.

    Blockchain technology addresses several of the concerns highlighted by Ackoff.


    The six revelations of Russell L. Ackoff¹:


    +   1. Improving the performance of the parts of a system taken separately will
    not necessarily improve the performance of the whole; in fact, it may harm the
    whole.

    2. Problems are not disciplinary in nature but are holistic.

    3. The best thing that can be done to a problem is not to solve it but to dissolve
    it.

    4. The healthcare system of the United States is not a healthcare system; it is
    a sickness-and-disability-care system.'
