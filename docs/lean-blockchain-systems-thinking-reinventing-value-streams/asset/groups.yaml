  - '[PAGE 17]


    # Preface


    Vulnerabilities and inefficiencies in traditional business models, supply chains,
    financial systems, and government processes are increasingly being exposed.


    There is an underlying chronic waste and variation in our supply chains, business
    transactions, and government processes. Over-production, excessive inventories,
    delays, corruption, pollution, and market uncertainty are just some of the negative
    outcomes.


    These challenges emphasize the importance of creating more sustainable and adaptive
    systems.


    We look forward to a brighter future with the seamless integration of supply chains,
    trade finance, and logistics with efficient and waste-free flow of goods, services,
    data, and payments (Chapter 2: Purpose).


    This transformation will be driven by improved policies and procedures (the human
    element) (Chapter 5: Principles, Chapter 7: Procedures) as well as the digitalization
    of services, production, and supply chains, enhanced by the connectivity between
    machines and systems, and the adoption of advanced process control techniques
    such as digital twins (Chapter 1: Innovation, Chapter 9: Tokenization, Chapter
    6: Building Blocks).


    Use of blockchain to facilitate trusted transactions reduces the reliance on intermediaries,
    leading to cost savings and reduction in waiting times.


    Blockchain is becoming a fundamental pillar of Industry 4.0 and a transformation
    tool in Supply Chain Management. Blockchain, together with Lean and Systems Thinking,
    will enable the creation of fully automated and autonomous supply chains (ASC)
    that share real-time data and enhance the transparency of business operations
    (Chapter 8: Kanban).


    The resulting improvements will greatly enhance collaboration, reduce waste, increase
    sustainability, and improve balance across different silos, stakeholders, and
    industries (Chapter 3: Balancing).'
  - '[PAGE 18]


    To move to this next level of efficiency and sustainability, we must first recognize
    the faults and negative outcomes of our current traditional and centralized systems
    (Chapter 4: Cause and Effect) and follow a logical path and scientific framework
    for improvement (Chapter 10: DMAIC).


    We hope this book will help we with the understanding of Lean, Blockchain technology,
    and Systems Thinking, which combined can be a transformative force for good in
    both business and society.'
  - '[PAGE 19]


    # About the Authors


    **John Dennis** is Master Black Belt in Lean Six Sigma and the founder of Blockchain
    SVCS Ltd., UK. He is also the current Chairman of the International Lean Six Sigma
    Institute. John is Seasoned Practitioner, Facilitator, Coach, and Trainer of Process
    Improvement, Quality Control, Lean Management, and Project Management in Manufacturing,
    Services, and Information Systems environments.


    He has worked with Senior Operations Managers and Executives in Capability Transfer
    via coaching and mentoring to educate them in the application of Lean and Six
    Sigma methodology. Clients have recently included NHS, UBS Bank, STAAR Surgical
    Group, Hoffman La Roche, Zimmer Biomet, Ferrexpo Mining, Novartis, Croda Chemicals,
    The Welding Institute (TWI Cambridge UK), Morrison Data Services, Gates Engineering,
    PD Ports, and State Farm Insurance.


    John gained his experience in Lean Six Sigma process improvement while working
    for Instrument Control Services (GE Automation), Entergy Systems, and as Senior
    Project Manager for IBM Global Services in the USA. John has been a PMP with the
    Project Management Institute since 2000. He graduated from Loughborough University
    in Physics, and York University in Education, and also has an MBA from the University
    of New Orleans.


    **Machiel Tesser** is a pioneer in the blockchain and Lean System Thinking communities
    in the Netherlands. He has been an advocate for integrating Blockchain technology
    into lean process improvement and system design for several years. His work emphasizes
    the use of blockchain in creating “Economy of Things,” where connected devices
    and agents can autonomously interact and transact, driven by technologies like
    IoT and AI.'
  - '[PAGE 20]


    # # Introduction


    # ## Why Lean + Blockchain + Systems Thinking?


    "Lean thinking” has its roots in ideas developed for process improvement in the
    1900s.¹ “Systems Thinking” was discussed as far back as the 1950s.² “Blockchain”
    technology is based on work that started in the 1990s.³ and was implemented soon
    after Satoshi Nakamoto published his Bitcoin whitepaper⁴ in 2009.


    Together, these three components, Lean + Blockchain + Systems Thinking, provide
    a revolutionary force in process management efficiency and effectiveness.


    # ## Lean


    "Lean” is the name given to a framework of principles and tools used for optimizing
    processes through continuous problem-solving and improvements, involving all levels
    and categories of stakeholders across the full value-stream. This results in reduced
    waste and improved flow of value. In this book, we will use the symbol shown in
    Figure 0.1 when we discuss concepts that are derived from Lean principles:'
