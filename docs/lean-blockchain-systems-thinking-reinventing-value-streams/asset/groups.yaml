    This “disintermediation” and “trust by design” allow for a whole new landscape
    to open up for the use of Kanbans.


    Kanbans can now be used between diverse stakeholders in a long supply chain, or
    even between competitors in the same market who can mutually benefit from knowing
    certain status updates from each other.


