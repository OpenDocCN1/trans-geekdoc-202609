  mdcn: "\n\n## 验证与信任\n\n参与者可以通过检查与每个身份相关的加密签名来验证交易的真实性。这在网络参与者之间建立了信任。\n\n## 预定义规则和条件的共识\n\
    \n智能合约是自动执行的合同，其协议的条款直接写入代码中，这些合约通常涉及多个方。这些合约依赖于参与者的身份来执行预定义的规则和条件。\n\n在供应链区块链解决方案中，身份之间的相互依赖关系说明了每个参与者的独特数字身份对于建立信任、确保透明度和维护分布式账本的完整性至关重要。如果目标是让网络具有社会性或可持续性，那么就是调整规则以关注这些额外价值的问题。竞争应该发生在网络层面，而不是公司层面。\n\
    \n## 资源\n\n区块链技术是跨越传统分析的推动器，它提供了整个生态系统的整体视角，不仅揭示了关系，还揭示了价值的流动和积累、行为、规则、法规和目标。这种被称为精益系统思维（Lean\
    \ System Thinking）的整体方法探索了所有利益相关者及其贡献的互联性。对于评估碳足迹成为我们定义价值和成功日益重要部分的系统而言，这一点至关重要。\n\
    \n区块链管理的是整体而非局部。区块链是“如何做”和“在哪里”，它存储了关于“谁”、“什么”、“何时”和“为什么”的真实信息。见图 2.3。\n\n## 规则\n\
    \n区块链概念的规则本质上是治理网络行为的协议、算法和共识机制集。\n\n## 精益区块链系统思维\n\n![](img/0daad7af426489da2dbf472852976622_58_0.png)\n\
    \n图 2.3 区块链是“如何做”和“在哪里”，存储了关于“谁”、“什么”、“何时”和“为什么”的真实信息。\n\n这些规则的设计旨在确保分布式账本的安全、完整性和共识。\n\
    \n> 要有效管理一个系统，你可能需要关注各个部分之间的相互作用，而不是它们各自独立的行为。\n— Russell L. Ackoff\n\n以下是与区块链规则相关的关键方面：\n\
    \n### 共识机制\n\n共识机制是一种协议，允许去中心化网络中的节点对区块链的状态达成共识。它确保所有参与者对账本都有一致的视图。\n\n### 加密\n\
    \n加密技术（如哈希和数字签名）被用于保护交易并控制对区块链的访问。这些技术确保了账本的不可篡改性并防止篡改。\n\n![](img/0daad7af426489da2dbf472852976622_59_0.png)\n\
    \n哈希函数用于为区块创建唯一标识符，数字签名用于验证交易的真实性。\n\n### 智能合约\n\n智能合约是自动执行的合同，其协议条款直接写入代码中。它们在区块链内部强制执行预定义的规则并实现流程。\n\
    \n### 一致性与不可篡改性\n\n区块链维护了一致且不可篡改的交易历史。一旦区块被添加到链中，它就无法更改，从而确保了整个账本的完整性。\n\n###\
    \ 去中心化\n\n区块链网络的设计是去中心化的，这意味着没有单一实体可以控制整个网络。去中心化增强了安全性以及应对攻击的韧性。\n\n### 治理模型\n\
    \n治理模型决定了如何就协议升级、规则更改和网络修改做出决策。某些区块链具有去中心化的治理结构，而另一些可能具有更集中的控制。\n\n### 代币经济学\n\
    \n许多区块链使用原生代币作为价值转移、访问网络功能或参与治理的手段。代币经济学定义了代币在生态系统中如何创建、分配和使用。\n\n这些规则共同塑造了区块链的行为，促进了安全交易、去中心化治理以及通过智能合约执行可编程协议。规则确保了系统以无信任（trustless）且透明的方式运行，同时维护了分布式账本的完整性。所有这些元素都有于使结果更具可预测性；管理好目标！\n\
    \n## 结果\n\n区块链技术是超越传统分析的推动器，提供了整个生态系统的整体视角，不仅揭示了关系，还揭示了价值的流动和积累、行为、规则、法规和目标。这种被称为精益系统思维的整体方法探索了所有利益相关者及其贡献的互联性。对于评估碳足迹成为我们定义价值和成功日益重要部分的系统而言，这一点至关重要。\n\
