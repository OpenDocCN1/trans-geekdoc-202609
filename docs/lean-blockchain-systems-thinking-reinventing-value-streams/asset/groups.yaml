    **John Dennis** is Master Black Belt in Lean Six Sigma and the founder of Blockchain
    SVCS Ltd., UK. He is also the current Chairman of the International Lean Six Sigma
    Institute. John is Seasoned Practitioner, Facilitator, Coach, and Trainer of Process
    Improvement, Quality Control, Lean Management, and Project Management in Manufacturing,
