    # Cause and Effect ■ 75


    In the field of Lean methodologies, “the voice of the business”, “the voice of
    the employee”, or “the voice of the environment” typically emphasizes optimization
    from a single or linear perspective.


    However, what we really need is a more holistic view that recognizes and aligns
    multiple voices simultaneously and brings consensus on the diverse needs and goals.


    To address this, we introduce the VON. The VON emphasizes the overall intent of
    the process, which is to promote support and solidarity for our goals while providing
    enhanced analytical capabilities.


    To strengthen the whole, awareness of three information flows is required. Only
    when these flows are synchronized, the entire system is considered as fully optimized.


