    designated size of storage space for parts or materials between two successive
    production stages.


    The key concept is that the downstream operation, analogous to a supermarket customer,
    withdraws parts from this storage space as needed. When parts are removed, a visual
    signal, the Kanban, prompts the upstream operation to replenish the stock. This
    system minimizes excess inventory, reduces lead times, and ensures that resources
    are used efficiently, ultimately improving the overall production process.


    The shipment of a postal package with companies like Amazon utilizes various Kanban-like
    signals and systems to facilitate the process smoothly and track progress.


    Here is an example of how this can work: Online Order.


    The process begins when a customer orders the book online. This order is considered
    the “Kanban signal”, marking the starting point of the process.


    # Order Confirmation


    Once the order is placed, the customer receives a confirmation email or message,
    acting as an electronic Kanban signal to indicate that the order has been received
    and is being processed.


    # Preparation and Packaging


    In the distribution center, products are gathered and packaged for shipment. During
    this process, visual signals such as marked floor zones, shelves, or storage bins
    can be used to specify which products need to be collected for specific orders.


    # Shipping Status Updates


    After the package is dispatched, the customer can receive status updates through
    electronic messages or tracking codes. This serves as a continuous Kanban signal,
    showing where the package is within the delivery process.


    # Delivery Confirmation


    Once the package is delivered, the customer typically receives a confirmation
    through an electronic message, which serves as the final Kanban signal to indicate
    the successful completion of the order.'
