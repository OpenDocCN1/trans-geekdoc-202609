    # # What If We Don’t Balance the System?


    The tragedy of the commons is a well-known system failure (system archetype).
    It refers to a situation in which individuals, acting in their self-interest,
    deplete or spoil a shared resource. In the long term, this leads to the degradation
    or depletion of the resource.


    The metaphor is the title of a 1968 essay by ecologist Garrett Hardin.³


    > An example of the tragedy of the commons is overfishing in oceans or seas. Fishermen,
    acting in their own interest, are willing to catch as many fish as possible to
    maximize their profits. When multiple fishermen follow this practice without any
    regulation or cooperation, it can lead to the collapse of the fish stocks, impacting
    not only the fishermen but also the ecosystem and future availability of fish
    resources. This overexploitation occurs because no one owns the fishery, and individual
    actors prioritize their short-term gains over the long-term health of the resource.


    The sustainable development goals suggested by the United Nations highlight the
