    # How Does the Word-of-Mouth System Work?


    In the Yapese community, everyone was well informed about the property and the
    unique history behind each stone. This collective knowledge extended to knowing
    the specific owner, the location of the stone, and the story behind its acquisition.


    The transfer of ownership of these Rai Stones was a communal affair, characterized
    by public expressions in a shared space. When a transfer occurred, the entire
    community would gather to witness the exchange. During these public meetings,
    the transfer of ownership was announced, and the name of the new owner was added
    to the shared memory of the community. The crucial element lay in the collective
    recognition and acceptance of this transfer. Once the community recognized the
    new owner, it laid the foundation for future transactions. This **consensus and
    trust** in the community became the cornerstone for subsequent exchanges.


    Essentially, Yap Island''s word-of-mouth system relied on the collective memory
    of a community. The trust in the truth was based on a shared commitment of the
    community to maintain the integrity of ownership. It is a remarkable example of
    how a society can develop a functioning economic system based on shared knowledge
    and trust, **even without physical money, written documents, or technology like
    the internet.'
