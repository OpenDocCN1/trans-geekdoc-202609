    - 9. Gohardt, M. and Koller, T. (2020, 16 June). McKinsey Quarterly.

    - 10. A “smart contract” is a collection of code (its functions) and data (its
    state) that resides at a specific address on a blockchain. https://ethereum.org/en/developers/docs/smart-contracts/

    - 11. Oikonomou, L. and Lee, J. C. H. (2010). IFTTT: Automating the Web with Conditional
    Logic. https://ifttm.com.


