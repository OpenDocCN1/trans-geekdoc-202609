  mdcn: "\n\n# 精益区块链\n系统思维\n\n重塑价值流\n\n![](img/0daad7af426489da2dbf472852976622_0_0.png)\n\
    \nJohn Dennis • Machiel Tesser\n\nProductivity Press 出版书籍\n\n# 精益区块链系统思维\n\n精益思维源于\
    \ 20 世纪 90 年代开发的流程改进理念。系统思维早在 20 世纪 50 年代就被讨论。区块链技术基于 20 世纪 90 年代开始的工作，并在中本聪 2009\
    \ 年发布比特币白皮书后不久便得以实施。这三个要素——精益、区块链和系统思维——共同为流程管理的效率和有效性提供了革命性的力量。\n\n本书提供了一个关于区块链技术优势的视角，这种视角在商业书中很少涉及，同时也包含了专业的区块链相关内容。过去的关注点一直是加密货币作为金融价值的存储手段以及像股票市场一样的投机工具。本书展示了区块链结合精益和系统思维，可以为社会和环境提供多重优势。它可以被有效地用于实现可持续发展目标（SDGs）。\n\
    \n读者将发现，在精益实践和系统思维框架内，区块链为根本性的组织变革、改进战略决策、增强互操作性，以及一个更公平、更可持续且低浪费的世界开辟了机遇。本书阐明了作为一种组织概念的区块链技术是如何整合精益原则和系统思维的。这带来了流程设计的转型性转变，在工业、公共服务、治理、供应链和社会框架等领域在提高生产力的同时，最大限度地减少浪费。\n\
