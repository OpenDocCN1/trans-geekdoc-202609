    该协议为协作努力奠定了基础，强调了高效方式共享信息的“谁”、“什么”和“何时”方面。


    在改进阶段，我们还可以引入三流“产品-信息-支付”（PIP）同步价值流模型。三流同步消除了瓶颈，创造了更大的价值流和更少的浪费。


    改进措施还借鉴了精益概念，如“超市”库存管理系统、看板、标准作业以及单件流的创建。


    创新型问题解决和设计思维的使用可以利用区块链技术的转型潜力。


    区块链的控制元素，如共识、溯源、不可篡改性、反馈循环、透明度和自动化程序（智能合约），是我们从 TRAD-ORG 移动到 DE-ORG 的改进，增加了问责制、信任、诚信和价值……并减少了成本和错误。


