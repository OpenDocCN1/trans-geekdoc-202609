    ## The Lean Way


    Many corporations have built their production systems using Lean principles and
    given these systems names such as “The Toyota Production System,” “The Caterpillar
    Way,” and “The Nissan Way”. We will use the term “Lean Way” as a general term
    for any system that has used Lean principles in its core building blocks and its
    fundamental business architecture.


    ## The Lean House


    The “Lean House”, or “House of Lean”, is a useful metaphor that helps us to visualize
    the fundamental principles and building blocks of “The Lean Way”.

    In this chapter, we will visit the Lean House; see Figure 6.1 to understand its
    architecture. We will then explore how the innovative use of Blockchain technology
    can be used to further strengthen the Lean House. We will be using the “Lean Blockchain
    Way” of thinking. We will propose an updated design of the house and call it the
    “Lean Blockchain House”, Figure 6.2.


    ![](img/0daad7af426489da2dbf472852976622_133_0.png)


    Figure 6.1 The Lean House or ‘House of Lean’


    ## Lean Blockchain House³


    ## LEAN HOUSE 3.0


    | Direct feedbackloops | System analysis | System Standardization | Disintermediary
    |

    |---|---|---|---|---|

    | First-Time-Right | Accountability | | Just-In-Time |

    | Alignment, incentives, skin in the game, reputation, drive | | | |

    | Smart contracts, compliance by design | | | |

    | Value | Stream | Flow | Pull | Perfection |

    | Transparency | Visual management | | Notifications |

    | Stakeholder analysis | | Common goals and purpose | |

    | BLOCKCHAIN | SYSTEM THINKING | | LEAN |


    Figure 6.2 The Lean Blockchain House.


    ## Three Component Architecture


    The structures of both the Lean House and the Lean Blockchain House consist of
    three primary components:


    - 1. Foundations: Core principles, the starting point from which the rest of the
    house is dependent. Without strong foundations, neither house can stand.

    - 2. Pillars: The pillars of the Lean Blockchain House come from the original
    five core principles of Lean as proposed by Womack and Jones in 1996 ⁴.

