    ## 精益创业方法论


    我们看到，最大的互联网公司并非诞生于现有的标普500指数公司。这些新的组织形式遵循了精益创业（Lean Startup）方法，使用了新的组织方式、业务模式和激励机制。这对于区块链技术也适用吗？


    精益创业方法论在创业生态系统中被广泛采用，并证明通过强调快速实验、以客户为中心和持续迭代，能够高效地实现产品市场匹配，帮助创业者和企业构建成功的产品![](img/0daad7af426489da2dbf472852976622_114_0.png)


