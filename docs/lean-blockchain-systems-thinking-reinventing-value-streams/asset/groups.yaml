    # Trust


    Reflecting on the evolution of trust and its foundations, we could outline the
    following progression:


    - 1. Trust in God,

    - 2. Trust in communities,

    - 3. Trust in government,

    - 4. Trust in code.


    This progression broadly summarizes the historical shift in the foundations of
    trust between people. It started with trust in faith, followed by trust in local
    communities (with or without a king or leader), and then in institutions. Finally,
    we now trust in the reliability and integrity of code. All these mechanisms bring
    people together to collaborate, coordinate, and communicate.


    The effectiveness of collaboration is crucial in Lean manufacturing. The availability
    of information is often an important part of working effectively. We can also
    deduce this from our traditional black box organizational designs. Because we
    have no insight into the inflows and outflows of the entire chain, we have to
    make predictive forecasts.**


    Therefore, if we don''t want to say no to the customer, we always produce or order
    more stock than the market needs.


    With blockchain, we have access to technology that integrates trust into its process
    design. The key elements that make this possible are cryptographic principles,
    decentralization, transparency, predefined consensus mechanisms, and direct feedback
    loops.


    # Disintermediation


    This is a transformation from the traditional reliance on centralized authorities
    for trust in internet-based infrastructure. Blockchain''s trust in code promotes
    a more secure, transparent, and resilient system for various applications, including
    financial transactions and supply chain management.


    While blockchain holds significant promise, its implementation requires careful
    consideration of technical, regulatory, and organizational challenges.


    The Lean House framework requires a strategic approach that aligns with the organization’s
    goals and purpose of end-to-end processes.


