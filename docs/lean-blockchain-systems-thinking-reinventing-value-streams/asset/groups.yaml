    # DMAIC ■ 199


    突出了区块链技术在向去中心化组织模型 DE-ORG 转型中的力量。


    # 注释


    - 1. Ecks, G. (2000). 六西格玛革命：通用电气和其他公司如何将流程转化为利润。

    - 2. George, M. L. (2003). *精益六西格玛：如何利用精益速度和六西格玛质量改进和服务和服务。*

    - 3. 供应链管理中的“三流同步”概念涉及对产品流、信息流和资金流的协调管理，以提高整体效率和性能。

    - 4. 帕累托法则：大量的糟糕过程结果是由少数的缺陷过程输入造成的；信息不对称和碎片化/孤岛化组织是传统结构（TRAD-ORG）中产生许多糟糕过程结果的原因。

    - 5. 参见：IFTTT。自动化业务与家居。https://en.wikipedia.org/wiki/IFTTT。

    - 6. Hill, S. B. and Rees, G. H. (2008). 生态系统设计与可持续性的挑战。《生态经济学》，67(1), 1-9。

    - 7. T’s 生态系统设计框架。https://isss.org/tessers-ecosystem-design-framework/

    - 8. Gohardt, M. and Koller, T. (2020). 价值创造的价值。https://www.mckinney.com/capabilities/strategy-and-corporate-finance/our-insights/the-value-of-value-creation.

    - 9. Gohardt, M. and Koller, T. (2020, 6月16日).麦肯锡季》。

    - 10. “智能合约”是存储在区块链特定地址上的代码（其函数）和数据（其状态）集合。https://ethereum.org/en/developers/docs/smart-contracts/

    - 11. Oikonomou, L. and Lee, J. C. H. (2010). IFTTT：用条件逻辑实现 Web。https://ifttm.com。


