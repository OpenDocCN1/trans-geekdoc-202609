  - '[PAGE 39]


    Innovation ■ 13


    +   ■ Privacy


    Take control of your digital footprint and decide who has access to your personal
    information. With digital identity, privacy is not just a promise; it is a fundamental
    right.


    +   ■ Empowerment without waste (of time)


    With the ability to assert your identity across domains, wasted time is removed
    from the process. Lead times for processing documents and applications can be
    reduced by orders of magnitude.


    # Summary


    Lean goes beyond only continuous improvement, Lean Kaizen. Lean also encourages
    radical change and innovation through Lean Kaikaku and Lean Kakushin.


    Comparing the Internet and Web 2.0 revolution with the Blockchain and Web 3.0
    revolution helps with our understanding. Also, by applying the concept of decentralized
    organizations, we obtain an insight into the future of Lean organizational structures.


    Significant Lean benefits from moving to Web 3.0 include proof of ownership, improved
    privacy, new incentive and governance models, fewer handovers (middlemen: constraints
    in value flow), and global accessibility for information for those who need it
    and have permissions.


    We also recognize that the complexity of this concept does not allow for a simple
    and concise "elevator pitch". The same applied to explaining the internet when
    it first appeared. To fully understand these concepts, extensive reading, questioning,
    and individual research (DYOR) are needed.


    Within our organizational framework (TRAD-ORG), inefficiencies and waste persist
    as a result of information fragmentation, siloed behaviors, and push models. By
    embracing blockchain as a Lean system concept, the focus shifts from a competitive
    organizational model towards a collaborative model. Transparency and cooperation
    will become the new norm.


    The future state, as suggested in this chapter, involves the transition from a
    self-centered competitive organization to an eco-infrastructure organization.
    In this new model, rewards and incentives are given for behaviors that benefit
    the entire system. This helps to promote a more inclusive and fairer society,
    which is in alignment with SDG and other sustainability goals.'
