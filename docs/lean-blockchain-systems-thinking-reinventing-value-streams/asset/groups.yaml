    # DMAIC ■ 199


    highlights the power of Blockchain technology in the transition to decentralized
    organizational models, DE-ORG.


    # Notes


    - 1. Ecks, G. (2000). The Six Sigma Revolution: How General Electric and Others
    Turned Process Into Profits.

    - 2. George, M. L. (2003). *Lean Six Sigma for Service: How to Use Lean Speed
    and Six Sigma Quality to Improve Services and Transactions.*

    - 3. The concept of 3-flow synchronization in supply chain management involves
    the coordinated management of product flow, information flow, and payment flow
    to enhance overall efficiency and performance.

    - 4. The Pareto Principle: A large amount of poor process outcomes are a result
    of a small amount of defective process inputs, Information asymmetry and fragmented/siled
    organizations are the cause of many poor process outcomes in TRAD-ORG structures.

    - 5. See for example: IFTTT. Automate Business & Home. https://en.wikipedia.org/wiki/IFTTT.

