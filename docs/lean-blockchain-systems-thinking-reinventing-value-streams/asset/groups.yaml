    ## 8 精益区块链系统化思维


    为精益实践者和顾问介绍区块链和 Web 3 的概念与技术。


    信息碎片化的负面影响（其特征是下游需求的波动）在供应链中被称为“牛鞭效应”或长鞭效应。这种现象发生在信息到达延迟时，导致库存的自动波动。想象一下，如果我们与链中的伙伴共享关键信息，例如客户提供的实时产品反馈，将会发生怎样的转变。正如我们稍后将探讨的，这可能会极大影响交付周期、质量和客户满意度。可以设想一种“超市模型”，所有利益相关者都能对流程的“谁、什么、何地、何时”获得洞察。


    区块链技术为信息碎片化和信息孤岛问题提供了解决方案。例如，上游供应商可能对供应链下游需求的真实波动缺乏充分了解，从而过度补偿，产生“牛鞭效应”。


    想象一下，如果我们与需要做出决策的供应链利益相关者、合作伙伴、供应商和客户实时共享关键信息，将减少浪费并提高可持续性。当信息未共享、不完整、不准确或丢失时，将导致许多浪费，如图
    1.1 所示。


    ## 设计上的非预期浪费


    ![](img/0daad7af426489da2dbf472852976622_34_0.png)


    **图 1.1** 由信息输入质量差导致的浪费。


    Machiel Tesser 2022


    ## 区块链背后的精益驱动力


    基于区块链技术的去中心化组织模式的优雅之处在于透明性、标准化、可视化和问责制。区块链技术作为基础，为所有流程参与者提供了货物和工作流的实时洞察。对流程和供应链的新洞察使每个参与其中的利益相关者都能够及时了解其产品或服务的当前状态。


    例如，外包维护由公司和外部服务供应商共同监督。想象一下，不仅是这两个者，客户也可以协作监控整个过程。这种协作方法在缩短交付周期、提高质量、提升客户满意度和降低整体碳足迹方面具有产生积极结果的潜力——这些通过一次到位和准时交付来实现。它为利用“看板”实现更高效率的“准时制”铺平了道路，通过减少浪费来改进流程。


    这种转变更多关于流程设计和组织演变，而不仅仅是技术挑战。理解这一基本概念能够实现快速评估和适应，促进各业的进步和增强。


    ## 数字化转型：精益创新


    区块链技术正在改变互联网的“后台部门”。区块链将价值账本数字化，使得价值交易能够无缝地从一个账本流向另一个账本（“价值”的精确定义将在稍后详述）。


    产品流、支付流和信息流可以同步移动，从而避免由于不步一致产生的浪费和错误。见图 1.2。


    区块链是完全全新的价值流形式的推动者。这种演变与精益哲学中价值流的无摩擦流动高度契合。


    ## 10 精益区块链系统化思维


    ![](img/0daad7af426489da2dbf472852976622_36_0.png)


    **图 1.2** 三流模型：产品流、支付流和信息流。

    Machiel Tesser 2020


    与互联网一样，这种转型正在以渐进的方式进行。这种趋势是显而易见的。这本书解释了这些变化及其对商业和社会的影响。这本书强调了精益思维与区块链技术的交叉点。我们与互联网的兴起进行类比，并看到区块链技术是类似的根本性变革的基础。


    ## 趋势是你的朋友：从 dot.com 到 block.com 泡沫


    2001 年的互联网泡沫崩溃反映了 2018 年和 2022 年的加密货币崩溃。2001 年，互联网的潜力最初被高估了，导致了最初的价格泡沫。回想起来，这个泡沫是投资
    Amazon、Google 或 Facebook 等股票的机遇。正如互联网的兴起一样，区块链技术在感知潜力和后续价格波动方面也经历了波动。


    互联网的兴起始于 20 世纪 60 年代的 TCP/IP 协议，然后是 80 年代的第一个用用例（电子邮件），随后是 90 年代的电子商务。互联网电子商务达到成熟花费了
    45 年。从第一条区块链发布到现在我们仅经过了 17 年，因此我们可以预计在它成为我们业务应用中的主流之前，还有很多年。见图 1.3。


    ## 演进中的组织


    ![](img/0daad7af426489da2dbf472852976622_37_0.png)


    图 1.3 1960 年至 2025 年协议与应用程序时间线。


    Machiel Tesser


    ## 学习精益系统设计思维


    就像你可以解释汽车作为一种交通工具的功能，很快你就能就能从公路价值流、协作促进者、信任与协作的基础等方面来解释区块链的功能。一个具有内置设计安全性的 IT
    平台优于任何现有的网络安全模型。精益原则目前应用于中央协调的组织结构，我们目标是通过这本书激发去中心化组织——为了一个更精益、更可持续的未来。


    我们正在进入一个对“更多”的无止追求（“贪有社会”）对许多人来说失去吸引力的时代。我们正在进入一个“虚假新闻”被揭穿的时代，人们要求证据并渴望真理。我们不会信任基于包装的散养鸡蛋，也不会信任基于“Swoosh”标志缝合程度的耐克运动鞋。我们正在从以自我为中心的组织向以生态为中心的组织转变，在那里，贡献和协作带来价值、动力、认可和奖励，创造一个更精益、更公平、更有包容性的社会。这就是精益革（Kakushin）和区块链创新能为我们做的。


    ## 精益区块链系统化思维


    我们还将帮助防止产生 FOMO（错失恐惧症）！


    FOMO 是“错失恐惧症”（Fear of Missing Out）的缩写；即担心没有参与他人正在经历的事情（如有趣的或愉悦的活动）。


    ![](img/0daad7af426489da2dbf472852976622_38_0.png)


    为了让结合精益和系统化思维的区块链被采用，我们必须能够回答这个问题：“对我有什么好处？”一个实用的练习是看图 1.4 中的多少个复选框对你的业务回答了“是”。


    ## 设计控制


    个人信息受到身份盗窃的保护。仅提供所需的身份部分。例如，进入酒吧或夜店时，你可以证明年龄。


    ![](img/0daad7af426489da2dbf472852976622_38_1.png)


    图 1.4 对我有什么好处？基于共享现实的优势。Machiel Tesser (2020)


    ## 创新 ■13


    - 隐私：控制你的数字足迹并决定谁可以访问你的信息。通过数字身份，隐私不再是一个承诺，而是一项基本权利。

    - 赋能且无浪费（时间）：通过跨领域维护你的身份，消除了时间浪费。处理文档和申请的交付周期可以缩短几个数量。


    ## 总结


    精益不仅仅是持续改进（Kaizen）。精益还鼓励通过变革（Kaikaku）和创新（Kakushin）进行激进变革。将互联网和 Web 2.0 革命与区块链和
    Web 3.0 革命进行对比有助于我们的理解。此外，通过应用去中心化组织的概念，我们获得了对精益组织未来的洞察。


    在我们的传统组织框架中，由于信息碎片化、孤岛行为和推动模式，效率低下和浪费仍然存在。通过采用区块链作为精益系统概念，重点从竞争性组织模式转向协作模式。透明度和协作将成为新常态。


