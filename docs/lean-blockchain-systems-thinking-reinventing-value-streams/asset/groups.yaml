    # More About Common Goals and Purpose


    Establishing and aligning common goals and purpose across the organization is
    essential for efficient and effective process design. It ensures everyone is working
    towards the same objectives, promoting unity, cooperation, and a shared sense
    of direction among team members. When goals are clearly defined and understood,
    it helps prioritize efforts and streamline activities.


    The use of the internet for e-commerce is an example of a system where there is
    a huge disconnect between the goals of the various stakeholders in the system.


    Take, for example, business package tracking using the internet. The customer
    can receive an update about the status of a package. Only one stakeholder provides
    this tracking service and therefore has significant power and control. The information
    about the customer becomes a product that they can sell. The customer becomes
    the product.


    Is this aligned with the goals and values of the customer? Do the owners of the
    information care?


    # Consensus and Collaboration


    The dynamics change when Blockchain technology is used in the system. The consensus
    mechanisms built into the protocols of a blockchain prevent one stakeholder from
    making all decisions based on their goals alone.


    A consensus is required by all stakeholders. Rules agreed upon by consensus can
    be ‘pre-coded’ into a smart-contract⁸ stored in a blockchain, and consensus protocols
    can also be used to ensure that the rules have been obeyed for each transaction.'
