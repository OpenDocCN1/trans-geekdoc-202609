    # Chapter 2


    ## Purpose


    Optimizing ecosystem value through Lean, Blockchain, and Systems Thinking


    ![](img/0daad7af426489da2dbf472852976622_41_0.png)


    # Introduction


    David J. Morris observed that in the perpetual race between technology and ethics,
    the advantage consistently goes to technology.


    As we witness remarkable technological advancements, our ethical capacities struggle
    to keep pace.


    This chapter explains the purpose of Lean thinking with Blockchain technology
    and Systems Thinking for providing an ethical way to achieve sustainable productivity,
    growth, and development.


    # Learning Objectives


    Upon completing this chapter, you will be familiar with:


    - The purpose of Lean

    - Identifying value and waste in processes

    - Methods to eliminate waste strategically

    - Improving flow

    - The purpose of blockchains

    - Identifying ecosystem value through decentralization

    - Eliminating systems'' waste with blockchain

    - Improving collaborative flow with blockchain


    # The Purpose of Lean


    Lean create value while conserving resources and minimizing waste. In contrast
    to the common practice of always attempting to maximize resource utilization,
    Lean focuses on finding optimal resource utilization, that is not 100%, for the
    benefit of the entire system.


    Lean is not just a set of tools; it is a comprehensive, philosophical, and systemic
    approach.


    # Identifying Value and Waste in Processes


    One common definition of “value” is any action or process that a stakeholder is
    willing to pay for. This chapter emphasizes the importance of delivering high-quality
    products or services by maximizing value while minimizing waste.


    Japanese production guru Taiichi Ohno* suggested that waste (or “muda” in Japanese)
    has seven main categories. An eighth category of waste is also commonly considered
    to be an important consideration: the waste of skills, talent, and ideas of workers.


    Let’s define these categories of waste and see what process improvements could
    reduce these wastes.


    # 1. Overproduction


    Producing more than requested or producing earlier than planned can lead to excess
    inventory, higher storage costs, and waste products become outdated or expired
    over time. Keep in mind that overproduction often comes from insufficient or a
    lack of real-time information or because of “just-in-case” management.


    # Improvements


    By improving the transparency and accuracy of information, companies can reduce
    the risks associated with overproduction. The Lean principle of producing the
    right amount of products at the right time and with the right resources is called
    “just-in-time” management. This requires just-in-time information.


    # 2. Waiting


    Delays in processes, whether due to idle time or waiting for materials, information,
    or approvals, can significantly impact operational efficiency and productivity.
    When workers are left waiting for the next step in a process, valuable time is
    wasted, leading to increased lead times, reduced throughput, and higher costs.
    Waiting is a symptom of a lack of flow in the process design.


    # Improvements


    Investing in advanced technologies that improve communication, collaboration,
    and coordination, as disintermediation, represents a clear path to significantly
    accelerate the reduction of wait times. Think of removing the intermediary by
    introducing a real-time information board, functioning as an automative trusted
    traffic light. This will replace all the actions that go along with intermediation,
    removing the opening hours, waiting times, the verification and authorization
    processes, etc.


    # Example: Email as Waste


    Email, despite a prevalent communication tool, can introduce inefficiencies in
    Lean processes. Traditional email systems often lead to delays, miscommunication,
    and information silos, hindering the smooth flow of information within organizations.


    # Lack of Real-Time Collaboration


    Email limits real-time collaboration, which is essential for agile decision-making
    and problem-solving. Without instant communication channels, teams may struggle
    to address issues promptly, leading to delays in process improvement and decision
    implementation.


    # Lack of Real-Time Communication


    Email poses significant challenges in ensuring data integrity and security. Emails
    can be vulnerable to hacks, phishing attacks, and data breaches, compromising
    sensitive information critical for Lean operations. Maintaining the integrity
    of data throughout the supply chain is important for achieving Lean objectives.
    This is difficult to ensure through traditional email systems.


    # Lack of Real-Time Coordination


    In Lean processes, transparency and traceability are essential for identifying
    bottlenecks, monitoring progress, and ensuring accountability across the supply
    chain. Without these capabilities, organizations may struggle to optimize processes
    effectively.


    > Email''s limitations become more pronounced when considering blockchain solutions.
    Blockchain technology offers decentralized, secure, and transparent communication
    channels that align closely with Lean principles. Unlike email, blockchain facilitates
    real-time collaboration, ensures data integrity through cryptographic techniques,
    and provides transparent, immutable records of transactions. By leveraging blockchain
    solutions, organizations can overcome the shortcomings of email and achieve greater
    efficiency, security, and transparency in Lean processes.


    # 3. Transport


    Transportation (as a waste) is the unnecessary movement of materials or products
    between locations. It can significantly impact operational efficiency, increase
    costs, and contribute to environmental concerns such as carbon emissions. When
    materials or products are transported unnecessarily, it adds both time and expense
    to the production process, leading to delays, inefficiencies, and loss of resources.


    # Improvements


    To address transportation inefficiencies and minimize its negative impacts, companies
    must adopt strategies to optimize logistics and reduce unnecessary movement of
    materials. Improving supply chain visibility and transparency can greatly help
    optimize performance and resilience.


    # Example


    The blockage of the Suez Canal in 2021 by the container ship highlights inefficiencies.
    It shows that access to accurate information plays a pivotal role in optimizing
    transportation, efficiency, and risk management.


    # 4. Overprocessing


    Overprocessing is about doing more work than necessary or using more resources
    than required to complete a task. It also applies to over-complicating a process.
    When processes are over-processed, valuable resources such as time, labor, and
    energy are wasted on activities that do not contribute to the final outcome. This
    results in wasted efforts, longer cycle times, and higher operational expenses.
    Furthermore, overprocessing can lead to diminished quality and customer satisfaction.


    # Improvements


    Transparency, industry standards, and access to accurate information are critical
    to preventing overprocessing. There are limitations in current system design that
    make it challenging, as:


    - Communication: The system is competitively driven, preventing information sharing.

    - Coordination: Multiple stakeholders have their own vertical, siloed perspective,
    systems, and goals.

    - Cooperation: Cultures, rules, and legislation are not aligned.


    # 5. Unnecessary Inventory


    Maintaining too much inventory beyond what is needed ties up valuable resources
    and takes up space that could be used more effectively. Additionally, as inventory
    ages, it loses its quality, leading to potential losses and even more waste. Inventories
    are often the result of push system designs.


    In a push system, products are made based on forecasts or guesses about what customers
    might want. This often leads to overproduction and wasted resources because items
    are made before there is a demand for them.


    In a pull system, products are made only when there is a specific demand for them.
    This means production is driven by actual customer orders or needs. It helps to
    minimize waste and ensures that products are made when they are needed, reducing
    excess inventory and unnecessary costs. Push is more about guessing what customers
    want, while pull is about making and delivering what customers actually need.


    # Improvements


    With a pull system design, you can better understand inventory levels, demand
    patterns, and supply chain dynamics. This ensures that companies can make informed
    decisions about inventory levels and allocation. Due to its peer-to-peer system
    design, Blockchain technology is exceptionally well-suited for implementing a
    pull system for information retrieval.


    # 6. Unnecessary Motion


    Wasteful movements of people or equipment within processes, known as motion waste,
    can lead to inefficiencies, increased operational costs, and reduced productivity.
    Unnecessary motion not only consumes valuable time and energy but also increases
    the risk of errors, accidents, and injuries.

