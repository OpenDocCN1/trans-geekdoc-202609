    # 186 精益区块链系统思维


    DMAIC 框架被应用于精益和六西格玛方法论中的流程改进。DMAIC 代表定义（Define）、测量（Measure）、分析（Analyze）、改进（Improve）和控制（Control）。


    以下是每个阶段的简要说明：


    ## 定义 (Define)

    - 目标：明确定义问题、项目目标以及客户（内部和外部）需求。

    - 活动：制定项目章程、绘制流程图、识别关键利益相关者，并定义范围和目标。


    ## 测量 (Measure)

    - 目标：量化问题并建立基准测量。

    - 活动：收集当前流程的相关数据，建立关键绩效指标，并确保数据的准确性和可靠性。


    ## 分析 (Analyze)

    - 目标：识别问题的根本原因。

    - 活动：分析收集的数据，使用鱼骨图或帕累图等工具进行根本原因分析，并识别流程中的模式或偏差。


    ## 改进 (Improve)

    - 目标：制定并实施解决这些原因的解决方案。

    - 活动：脑暴潜在的解决方案，通过试点运行或模拟测试并验证这些解决方案，最后实施最有效的改进。


    ## 控制 (Control)

    - 目标：确保改进随时间持续。

    - 活动：制定并实施监控计划，建立控制系统，记录新程序，并培训员工以维护改进成果。


    通过遵循 DMAIC 框架，组织可以系统地改进流程、消除低效率并提升整体性能。在本章中，我们将使用该框架来展示区块链技术和系统思维引入精益管理和精益系统思维的益处。


    在上一章“因果关系”中，我们发现了传统组织模型中的两个关键问题：


    1. **信息孤岛**：信息未能有效共享，导致了大量的非增值活动。


    2. **碎片化的组织设计**：组织设计是孤岛化且碎片化的，导致与网络整体目标缺乏一致性和问责制。


    信息不对称（一方获取的信息与另一方不同，或在不同时间获取）在我们医疗保健流程中引入了一层混乱和浪费。这种不平等在许多层面都是显而易见的。不对称是共同目标和一致活动的敌人。见图
    10.2。


    例如，一旦产产护士确定了工表，该流程将经过父母的验证和授权。然而，此操作与产产机构和保险公司仍然隔离，形成了一个“黑点”和信息不对称。


    若干因素可能导致信息不对称以及信息的孤岛化和碎片化：


    ## 缺乏共同目标和一致性


    整个流程的目标、增值活动以及如何最有效地协调协作之间缺乏协调。


    ![](img/0daad7af426489da2dbf472852976622_213_0.png)


    图 10.2 不对称性是共同目标和一致活动的敌人。


    ## 信息不对称


    在获取信息方面存在差异：一方可能拥有更多资源、更好的关系或专业知识，使其在获取相关信息时具有优势。这种可用性、可访问性和透明度的缺乏会导致信息鸿沟。黑箱设计造成了如此巨大的浪费。


    ## 碎片化组织


    流程通常涉及多个具有不同目标和利益的利益相关者，这使得建立精益流程的设计、业务模式和对其需求的管理面临挑战。


    这种不对称在“网络声音（Voice-of-the-Network）”系统中引入了延迟、错误和浪费。解决信息不对称挑战对于构建更准确、更协作的医疗环境至关重要。


    ## 示例：产产医疗流程


    为了理解信息不对称和碎片化组织，我们将分四个独立步骤描述护理流程。每个步骤独立运行，而一个状态未知的“黑箱”使得交易变得不透明。见图 10.3。


    ![](img/0daad7af426489da2dbf472852976622_214_0.png)


    图 10.3 传统组织中的孤岛作为“黑箱”运行，只已知输入和输出。


    ## 第 1 步


    流程始于产产护理人员在工表中手动记录工时并让患者签字。注意，护理机构和保险公司没有参与此过程。护理机构和保险公司在之后才通过各种信息载体（纸张、电子邮件、应用程序等）推送信息来获得通知（见图
    10.4）。


    ## 第 2 步


    产产机构处理这些记录。客户、产产护士以及保险公司在此步骤中均未参与。此外，大多数组织拥有碎片化的部门、角色、职能和授权，这导致了整个流程的碎片化（见图 10.5）。


    ## 第 3 步


    产产机构通过电子邮件将数据发送给保险公司。保险公司在其企业资源计划（ERP）系统中处理这些信息。注意，每个组织都使用自己的系统、分类法、缩写以及对流程、产品或服务的命名。这增加了错误的几率并减慢了流程的周转时间（见图
    10.6）。


    ![](img/0daad7af426489da2dbf472852976622_215_0.png)


    图 10.4 “推式”流程，其中信息和活动是碎片化的。花费的时间在独立的活动中进行记录和批准。


    产产机构接收工表并在 ERP 系统中处理。


    图 10.5 “推式”流程，其中信息和活动是碎片化的。工表处理作为一项独立的活动。


    产产机构将信息发送给保险公司。


    保险公司在其 ERP 系统中处理这些信息。


    图 10.6 “推式”流程，其中信息和活动是碎片化的。信息流效率低下。


    ## 第 4 步


    整个流程的同步大约需要 90 天。我们希望已经说明这种碎片化的行政程序是极其低效的，并导致了各种运营成本。见图 10.7。


    ![](img/0daad7af426489da2dbf472852976622_217_0.png)


    图 10.7 “推式”流程，其中信息和活动是碎片化的。延迟和等待时间增加。


    行政结算过程中的信息不对称问题其特点是不必要的复杂性、额外的非增值任务以及长期的延迟（例如 90 天的付款延迟）。


    这些低效性导致了医疗机构、客户、保险公司以及整个社会高昂的行政成本。


    在我们的测量和分析阶段，我们发现信息不对称可能是缺乏端到端流程协作、透明度、一致性和动机的结果，导致了利益相关者之间有效的沟通和协调失效。


    共享信息或即时通知的缺乏增加了错误、偏差、低效率、高成本，并降低了客户满意度。


    如果我们尝试改进这种低效且无效的流程，并使用更循环和去中心化的组织设计会怎样？见图 10.8。


    关键成功因素如安全、质量、可靠性、灵活性、成本和交付时间起着至关重要的作用，特别是在一个依赖一致和共享信息的环境中，正如之前讨论的：


    ![](img/0daad7af426489da2dbf472852976622_218_0.png)


    **图 10.8 使用精益系统思维的去中心化组织设计。**


    第 4 章——因果关系。为了实现这些目标，将注意力从个人目标转向系统目标变得至关重要。


    为此，我们开发了一个创新的生态系统框架，这是我们将在接下来的“改进”阶段描述的重大变化。


    此外，我们还引入了“PIP 价值流模型”，其策略性设计旨在可视化价值流并识别由于协作不足和沟通不畅而产生的瓶颈。


    '
