    # 4. Feedback


    > "Your most unhappy customers are your greatest source of learning".


    Bill Gates


    A well-known Lean visionary was named Taiichi Ohno. He radically changed the production
    process at Toyota, Japan, in the 1970s and 1980s and was an architect of the Toyota
    Production System (TPS).


    Ohno saw inefficiencies plaguing the factory floor—overproduction, inventory waste,
    waiting times, defects, and uneven workloads. Determined to bring change, he delved
    deep into the processes, seeking ways to improve and refine the system.


    > "If you are going to do TPS you must do it the way. You also need to change
    the way you think. You need to change how you look at things".


    Taiichi Ohno


    Ohno''s philosophy echoed throughout the corridors of Toyota: Continuous improvement
    was imperative. He championed a culture where every employee''s insight mattered.
    Their feedback was vital in identifying problems and spurring solutions. Ohno
    aimed not only to resolve immediate issues to establish a culture of perpetual
    refinement—a pursuit for enhanced efficiency and quality ingrained in the company’s
    DNA.


    Fast forward to the digital age, where a different revolution is underway—one
    propelled by Blockchain technology. Like Ohno’s approach, haul Toyota’s manufacturing,
    blockchain introduces a new wave of tools for system enhancement, albeit in a
    digital age.


