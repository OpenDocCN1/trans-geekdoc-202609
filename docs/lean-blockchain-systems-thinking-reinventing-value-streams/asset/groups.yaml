    ## Chapter 7


    ## Procedures


    In this chapter, we explore the concept of procedures and learn why we need standard
    operating procedures (SOPs). We delve into the definition of a procedure and trace
    their evolution in the context of the internet and cryptography.


    ## Learning Objectives


    Upon completing this chapter on procedures, you will be able to:


    - Explain the importance of standard procedures

    - Understand how procedures organize trust and the truth

    - Comprehend the concepts of smart contracts

    - Give some examples of cryptographic procedures

    - Introduce “the oracle problem”


    In this chapter, we look at the operation of procedures both in general and specifically
    in the procedures carried out by the intermediaries. In many cases, these procedures
    can be automated with “smart contracts”. These are simple “if/when this happens
    then that is the outcome” (IFTTT).


    A standard procedure is a procedure that one group of people has agreed this is
    the right way to work. The agreements are recorded in a document where the specifications
    are described. If everyone agrees with this method, this method forms the standard.


    > “Coming together is a beginning. Keeping together is progress. Working together
    is success”. Henry Ford


    ### Why Do We Need Standard Procedures?


    An SOP precisely outlines the method of performing work, encompassing details
    such as computer settings or configurations for various IT devices and machinery.
    It extends to specifying conditions, including ISO standards, for conducting control
    activities and verification audits. Understanding the concepts of a standard and
    a procedure sets the stage for appreciating how **consensus, trust, and truth**
    are structured.


    A procedure is the description of a series of actions and agreements to coordinate
    routine cross-functional (between departments of organization) activities.


    In Chapter 9, we will talk about **standard**. This is something different from
    standard procedures. When we talk about standardization, we mean a standard for
    products, materials, and services.


    ### What Is a Process?


    A process is made up of a group of related procedures that together have a common
    goal.


    ### Standardization of Processes


    Lean management emphasizes the standardization of processes to reduce variability
    and enhance efficiency. Procedures serve as documented guidelines for tasks and
    activities.


    ### Continuous Improvement (Kaizen)


    Lean management promotes a culture of continuous improvement, known as Kaizen.
    Standard procedures act as a baseline for improvement. Teams can identify inefficiencies
    or bottlenecks in existing procedures and work collaboratively to enhance and
    optimize them.


    ### Waste Reduction


    One of the primary goals of Lean management is the elimination of waste in all
    forms, such as overproduction, excess inventory, waiting times, and defects. Standard
    procedures help identify and address areas of waste by providing a clear framework
    for evaluating processes and identifying non-value-added activities.


    ### Visual Management


    Lean management often utilizes visual tools, such as kanban boards and visual
    cues, to enhance communication and understanding. Procedures can be represented
    visually to provide quick reference points, aiding in the easy understanding and
    adherence to standardized processes.


    ### Employee Empowerment


    Standard procedures serve as a tool for training and empowering employees, providing
    clear guidelines on how to perform tasks and contribute to process improvement.


    ### Customer Focus


    Standard procedures help ensure that processes are aligned with customer requirements,
    and any deviations are promptly addressed to enhance customer satisfaction.


    ### Streamlining and Efficiency


    Lean management seeks to streamline processes to improve overall efficiency. Standard
    procedures provide a structured framework for teams to identify and eliminate
    unnecessary steps, reducing complexity and improving the flow of work.


    ### Data-Driven Decision-Making


    Standard procedures can include guidelines for data collection and analysis, facilitating
    informed decision-making to drive continuous improvement.


    In essence, standard procedures are an integral component of Lean management,
    serving as the foundation for continuous improvement, waste reduction, and the
    overall optimization of processes to deliver value to customers.


