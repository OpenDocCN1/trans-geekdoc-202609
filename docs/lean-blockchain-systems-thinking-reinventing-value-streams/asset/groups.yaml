    ### 为什么 #3：简化的解释与教育


    培训和教育可以消除区块链概念及其潜在应用的神秘感。区块链的 90% 是流程重设计的挑战，110% 是技术挑战。通过提供带有清晰解释和示例的培训，更容易理解你的流程如何重新设计，以最好地利用去中心化、协作、共识、不可篡改性和溯源性的力量。


