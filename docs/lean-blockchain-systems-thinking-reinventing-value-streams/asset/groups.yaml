    # Proof of Processing


    Blockchain is sometimes called a “network status technology”. It enables different
    stakeholders to “fact-check” the status of the network with real-time updates,
    signals, or notifications. It streamlines the system functioning with quality
    proofs and trust in collaboration.


    # Question?


    What do you think serves the insurance business model?


    +   - A. A transparent process design

    - B. A black box system design


    # The Five Pillars of the Lean Blockchain House


    The pillars of the Blockchain House come from the original five core principles
    of Lean as proposed by Womack and Jones in 1996. ¹¹ See Figure 6.4.

    Each of the five principles focuses on specific aspects crucial for Lean operations,
    reducing waste, and improving overall quality and efficiency.


    # 2.1 Value


    The concept of value is a central force that drives us to understand what customers
    really want and need in a product or service. It goes beyond mere transactional
    behavior.


    ![](img/0daad7af426489da2dbf472852976622_140_0.png)'
  - '[PAGE 141]


    Prioritizing value directs efforts and resources toward activities that directly
    fulfill customer needs and eliminates those that contribute no value.


    In today''s landscape, the definition of value is expanding beyond traditional
    economic boundaries. In addition to ecological, social, and economic values, other
    facets are also gaining importance. Consider cultural, ethical, educational, health,
    and personal development values, in addition to innovation, technical, and political
    values. All these values together shape the world of human perspectives and priorities.
    To make it even more complex, different cultures and individuals may assign different
    degrees of importance to these values based on their unique perspectives and contexts.


    # Exchange of Value


    The advent of Blockchain technology introduces a paradigm shift in the understanding
    and exchange of value. Cooperative technology is emerging, improving collaboration,
    inclusivity, and working towards shared goals. It outperforms competitive technology
    by promoting teamwork, innovation, and sustainability, prioritizing collective
    success over individual profit. This cooperative approach encourages open communication,
    knowledge sharing, and consideration of different perspectives, increasing overall
    efficiency and adaptability.


    Blockchain technology is a part of the puzzle contributing to the global initiatives
    such as the Sustainable Development Goals (SDGs)¹². See Figure 6.5. Collaborative
    technology harmonizes economic growth, social inclusion, and environmental protection
    for sustainable development in its design.


    The SDGs, also known as the Global Goals, were adopted by the United Nations in
    2015 as a universal call to action to end poverty, protect the planet, and ensure
    that by 2030 all people will enjoy peace and prosperity. To achieve sustainable
    development, it is crucial to harmonize three core elements: economic growth,
    social inclusion, and environmental protection. These elements are interconnected
    and are all crucial for the well-being of individuals and societies.


    ![](img/0daad7af426489da2dbf472852976622_141_0.png)'
  - '[PAGE 142]


    # 116 Lean Blockchain Systems Thinking


    ![](img/0daad7af426489da2dbf472852976622_142_0.png)


    **Figure 6.5** Blockchain technology contributes to the global initiatives such
    as the United Nations Sustainable Development Goals (SDGs) as used to reduce plastic
    waste in the ocean.


    , blockchain is an enabler to integrate and focus on value(s) that is no longer
    limited to the economic domain. The technology introduces new possibilities to
    process multiple values in each transaction. You could define a transaction as
    an **interaction of value**. By recording the transaction, it gives the sender
    or receiver value in a social context.


    The transparency of systems, smart collaboration rules, instant feedback loops,
    and immutable data are technical improvements that add value and accountability
    throughout the process. Other features that blockchain introduces to manage value
    through tokenization (collective ownership and accountability) and the way in
    which value is captured, stored, and exchanged.


    The decentralized and immutable nature of blockchain ensures the capture and storage
    of value. The joint effort of the network, distributed ledger, and cryptographic
    techniques guarantees the integrity and reliability of stored data. Consensus
    mechanisms, smart contracts, and permissioned blockchains further strengthen security,
    transparency, and trust in the value exchange processes.'
  - '[PAGE 143]


    # Building Blocks ■ 117


    At its core, Blockchain technology brings new opportunities for cooperative and
    sustainable practices, providing a secure, transparent, and accountable framework
    for capturing, storing, and exchanging value. This transformative journey aligns
    economic activities with broader social and environmental goals, marking a profound
    shift toward a future where value is not just traded, but co-created, shared,
    and sustained.


    If we look at trade finance, for example, Blockchain technology is to digitize
    paper documents flow. It harmonizes the settlement and cooperation between all
    stakeholders that currently have to work with millions of paper documents per
    year. It includes financial gains by improved efficiency, but also social and
    environmental benefits.


    ![](img/0daad7af426489da2dbf472852976622_143_0.png)


    # 2.2 Value Stream


    Value stream refers to the end-to-end sequence of processes and actions involved
    in delivering a product or service to the customer. Value stream mapping helps
    visualize and analyze these processes, distinguishing between value-adding activities
    (those that directly contribute to meeting customer needs) and non-value-adding
    activities (waste).


    Understanding the value stream enables organizations to optimize processes and
    eliminate inefficiencies.


    # 2.3 Flow


    Flow emphasizes the smooth and uninterrupted movement of work through the value
    stream. It involves minimizing interruptions, delays, or bottlenecks in the process
    to ensure a continuous and steady flow of work. By enhancing flow, organizations
    reduce lead times, improve responsiveness, and increase productivity.


    # 2.4 Pull


    Pull involves producing goods or services based on actual customer demand rather
    than speculative forecasts. Instead of pushing products into the market based
    on production schedules, the pull principle produces only what customers request
    or require. This strategy reduces excess inventory, minimizes waste, and ensures
    that resources are utilized efficiently.'
  - '[PAGE 144]


    # 2.5 Perfection


    Perfection is an ongoing pursuit of continuous improvement and excellence in all
    aspects of operations. It involves striving for perfection in processes, products,
    and systems by continuously eliminating waste, improving efficiency, and innovating
    to meet changing customer needs. Perfection is a long-term goal that encourages
    a culture of continuous learning and improvement within an organization.


    # The Roof of the Lean Blockchain House


    Despite having a solid foundation and robust pillars, the house would face significant
    challenges if it had a leaking roof! See Figure 6.6. The roof serves as the common
    shelter under which all the other components are protected. It binds the other
    components together.


    What are the essential components for a roof?

    A roof enables and facilitates trust in collaboration, the good of businesses,
    the good of people, and the good of society as a whole.


    # Smart Contracts, Trust by Design


    In traditional processes, intentions are usually documented in agreements, general
    terms and conditions, or on websites. Unlike traditional process design, which
    controls and reviews events after the fact, Web 3.0 prioritizes immediate and
    transparent execution through data sharing, ownership, and established protocols.


    ![](img/0daad7af426489da2dbf472852976622_144_0.png)


    Figure 6.6 The roof of the Lean Blockchain House.'
  - '[PAGE 145]


    Blockchain facilitates the formation of Decentralized Autonomous Organizations
    (DAOs). These are digital entities that are governed by smart contracts and community
    consensus mechanisms. This decentralization of decision-making allows participants
    to directly influence organizational decisions, creating a more responsive and
    involved network. Blockchain restructures the management layer of the organization
    by giving participants a voice, taking into account individual preferences, as
    well as the sustainable functioning of the whole.'
