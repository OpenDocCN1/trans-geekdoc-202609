    to the insurer, who also enters the same data into their systems. Finalization
    or settlement is achieved once all information is processed and synchronized.


    Our small-scale healthcare scenario involves four primary stakeholders (see Figure
    4.8):


    +   - the patient

    - the insurer

    - the healthcare agency

    - maternity care worker


    The process is explained in four simple steps:


