    making all decisions based on their goals alone.


    A consensus is required by all stakeholders. Rules agreed upon by consensus can
    be ‘pre-coded’ into a smart-contract⁸ stored in a blockchain, and consensus protocols
    can also be used to ensure that the rules have been obeyed for each transaction.


    ## Building Blocks ■ 111


    Blockchain technology becomes extremely useful when you need to collaborate on
    shared goals, purposes, and value(s).


    Consensus is needed on the end value, the value-adding activities, the roles of
    stakeholders, and the objectives to be achieved. It requires Lean thinking, System
    Thinking, value thinking, and community consensus from the beginning to the end
    of the process.


    ## Stakeholder Analysis


    Understanding and analyzing stakeholders'' interests, motivations, expectations,
    and influence within the organization is critical when forming the foundation.


    This involves identifying all stakeholders (for example, employees, customers,
    suppliers, and shareholders) and understanding their needs and concerns. This
    is also called understanding the "Voice of the Customer" (VOC), "Voice of the
    Business", and "Voice of the Network" (VON).


    ## New Stakeholders to Consider


    Concerns such as climate change, social inequality, and inclusivity are receiving
    increasing attention. We are witnessing a new wave of voices and needs, and new
    stakeholders who were overlooked in previous process designs.


    ## Question?


    Which model do you think will create more waste and externalities?


    - A. A competitive model or

    - B. A collaborative model


    We must learn ways to transform from a competitive system design toward a more
    collaborative and inclusive ecosystem design.


    ## Vertical Collaboration


    Vertical collaboration occurs when stakeholders at different stages in the value
    stream collaborate. For example, a supplier collaborates with a customer.


    The internet made the tracking and trace of business-to-consumer (B2C) packages
    possible. However, when the business has different motivations and goals from
    those of the customer, complexity arises, and collaboration is needed to find
    the optimal solution.


    ## Horizontal Collaboration


    Horizontal collaboration occurs within traditional organizations. For example,
    two different suppliers need to collaborate to complete one activity (the port
    services company unloading the containers and the shipping company holding the
    containers at the dock).


    This complexity arises from various factors such as a lack of trust in collaboration,
    a competitive business model, and the loss of control over data.


    In addition to the fact that companies find it difficult to collaborate on the
    basis of an internet-based infrastructure, the synchronization of ledgers and
    accounts balances is complex, time-consuming, and expensive. A shared system in
    which transfers of inflows and outflows of stock, information, or money are atomically
    updated would be the ideal result (IFR).⁹


    The Boston Consulting Group¹ has predicted that trade digitalization could increase
    revenues by 20%, processing time by 60%, and save global trade banks up to US
    $6 billion annually. The International Chamber of Commerce enterprises paperless
    trade to create US $267 billion of digital exports among the G7 countries.


    > On July 20, 2023, the Law Commission''s recommendations on electronic trade
    documents became law as the Electronic Trade Documents Act (ETDA) 2023 secured
    royal assent in the United Kingdom.


    > The UK Government has estimated that the Act will help to boost the UK’s international
    trade—already more than $1.4 trillion—by providing benefits to UK businesses over
    the next 10 years of $1.1 billion.


    > The process of moving goods across borders involves a range of actors, including
    transportation, insurance, finance, and logistics service providers. The Commission
    estimates that global container shipping generates billions of paper documents
    per year. Across so many documents, the potential positive impacts of using electronic
    trade documents—including financial and efficiency gains, and environmental benefits—are
    vast.


    ## Building Blocks ■ 113


    Despite the size and sophistication of this market, many of its processes and
    the laws underlying them, are based on practices developed by merchants hundreds
    of years ago. In particular, under the current law of England and Wales, being
    the “holder” or having “possession” of a trade document has special significance.
    However, the law does not allow an electronic document to be possessed. As a result,
    nearly all documents used in international trade are still in paper form.


    Over the past decade, the development of technologies such as distributed ledger
    technology has made trade based on electronic documents increasingly feasible.
    Without reform, the law would have lagged behind, hindering the adoption of electronic
    trade documents and preventing the significant associated benefits from being
    achieved.


    ## Transparency


    Transparency in Lean management involves open and clear communication across all
    levels of the organization. It ensures that information flows freely, enabling
    everyone to access relevant data and insights. Transparent practices improve trust
    in processes, encourage collaboration, and empower employees to make informed
    decisions, thereby enhancing overall efficiency.


    Digitalization with Blockchain technology enables transparency for end-to-end
    processes and system designs.


    Transparency could prevent questions about order status, input quality, provenance,
    location, authenticity, predictability of a process, etc.


    ![](img/0daad7af426489da2dbf472852976622_139_0.png)


    Understanding the difference between digitalization and digitization is important
    when discussing the use of Blockchain technology. **Digitization** denotes the
    process of converting analog data into digital format, exemplified by activities
    such as scanning physical documents or images. Conversely, **digitalization**
    involves the utilization of digital technologies to overhaul existing operational
    procedures, such as employing Blockchain technology or cloud services. Both digitization
    and digitalization play integral roles in facilitating a company’s journey towards
    digital transformation.

