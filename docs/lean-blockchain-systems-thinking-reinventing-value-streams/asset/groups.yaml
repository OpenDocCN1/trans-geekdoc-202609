    # 处理的证明


    区块链有时被称为“网络状态技术”。它使不同的利益相关者能够通过实时更新、信号或通知对网络状态进行“事实核查”。它通过质量证明和协作中的信任简化了系统运行。


    # 问？


    你认为什么服务于保险业务模式？


    +   - A. 透明的流程设计

    - B. 黑箱系统设计


    # 精益区块链大厦的五大支柱


    区块链大厦的支柱源于 Womack 和 Jones 在 1996 年提出的精益（Lean）最初的五个核心原则。¹¹ 参见图 6.4。

    这五个原则中的每一个都关注对精益运营至关重要的特定方面，旨在减少浪费并提高整体质量和效率。


    ## 2.1 价值


    价值的概念是一个核心力量，驱动我们理解客户在产品或服务中真正想要和需要什么。它超越了简单的交易行为。


    ![](img/0daad7af426489da2dbf472852976622_140_0.png)


    优先考虑价值会将努力和资源导向直接满足客户需求的活动，并消除那些不产生价值的活动。


    在今天的格局下，价值的定义正在扩展到传统的边界之外。除了生态、社会和经济价值外，其他方面也变得重要。考虑到文化、伦理、教育、健康和个人发展价值，以及创新、技术和政治价值。所有这些价值共同塑造了人类视角和优先级的世界。更为复杂的是，不同的文化和个人可能会根据其独特的视角和背景对这些价值赋予不同程度重要性。


    ### 价值的交换


    区块链技术的出现引入了价值理解和交换的范式转变。协作性技术正在兴起，改进了协作、包容性并致力于共同目标。它通过促进团队合作、创新和可持续性，优先考虑集体成功而非个人利益，优于竞争性技术。这种协作方法鼓励开放沟通、知识共享和对不同视角的考虑，提高了整体效率和适应性。


    区块链技术是全球倡议（如可持续发展目标（SDGs）¹²）贡献的一部分。参见图 6.5。协作技术在设计中协调了经济增长、社会包容和环境保护，以实现可持续发展。


    可持续发展目标（SDGs）也称为全球目标，由联合国于2015年通过，是一项全球性的行动号召，旨在消除贫困、保护地球，并确保到2030年所有人都能享受和平与繁荣。为了实现可持续发展，协调三个核心元素：经济增长、社会包容和环境保护至关重要。这些元素相互关联，并且对于个人和社会的福祉都都至关重要。


    ![](img/0daad7af426489da2dbf472852976622_141_0.png)


    # 116 精益区块链系统思考


    ![](img/0daad7af426489da2dbf472852976622_142_0.png)


    **图 6.5** 区块链技术有助于全球倡议，例如联合国可持续发展目标（SDGs），用于减少海洋塑料垃圾。


    区块链能够整合和关注价值，使其不再局限于经济领域。该技术为每笔交易中处理多种价值引入了新的可能性。你可以将交易定义为**价值的交互**。通过记录交易，它在社会背景下为发送者或接收者提供了价值。


    系统的透明性、智能协作规则、即时反馈循环和不可篡改的数据是技术改进，增加了整个过程价值和问责。区块链引入的其他特征还包括通过代币化（集体所有权和责任）管理价值，以及价值捕捉、存储和交换的方式。


    区块链的去中心化和不可篡改性确保了价值的捕捉和存储。网络、分布式账本和加密技术的共同努力保证了存储数据的完整性和可靠性。共识机制、智能合约和许可区块链进一步加强了价值交换过程中的安全性、透明度和信任。


    # 构建模块 ■ 117


    从核心上说，区块链技术为合作可持续实践带来了新机会，为捕捉、存储和交换价值提供了一个安全、透明且负责任的框架。这一变革性之旅将经济活动与更广泛社会和社会目标相联系，标志着向未来的深刻转变——价值不仅被交易，而且被共同创造、共享和维持。


    例如，如果我们看贸易金融，区块链技术是使纸质文档流数字化。它协调了目前每年必须处理数百万纸质文档的所有利益相关者之间的结算与合作。它包括提高效率带来的财务收益，还包括社会和环境效益。


    ![](img/0daad7af426489da2dbf472852976622_143_0.png)


    ## 2.2 价值流


    价值流是指向客户交付产品或服务涉及的端到端流程和行动序列。价值流图有助于可视化和分析这些流程，区分增值活动（直接有助于满足客户需求的活动）和非增值活动（浪费）。


    理解价值流使组织能够优化流程并消除低效环节。


    ## 2.3 流


    流动强调工作通过价值流的顺畅且连续的移动。它涉及减少过程中的中断、延迟或瓶颈，以确保工作的持续和稳定。通过增强流动，组织缩短了交付周期，提高了响应能力并增加了生产力。


    ## 2.4 拉


    拉是指根据实际客户需求而非投机预测来生产商品或服务。拉原则不是根据生产计划将产品推向市场，而是生产客户请求的产品。这种策略减少了过剩库存，减少了浪费，并确保资源得到有效利用。


    ## 2.5 完美


    完美是对运营各个方面持续改进和卓越的不断追求。它涉及通过不断消除浪费、提高效率和创新来满足客户需求，从而在流程、产品和系统中追求完美。完美是一个长期目标，鼓励组织内部形成持续学习和改进的文化。


    # 精益房屋的屋顶


    尽管有坚实的基础和稳固的支柱，如果屋顶漏水，房子将面临巨大挑战！参见图 6.6。屋顶作为所有其他组件受保护的共同庇护。它将其他组件结合在一起。


    屋顶的必要要素是什么？

    屋顶实现并促进了协作信任、企业利益、个人利益以及整个社会的利益。


    # 智能合约，设计信任


    在传统过程中，意图通常记录在协议、通用条款和条件或网站上。与事后控制和审查事件的传统流程设计不同，Web 3.0 优先通过数据共享、所有权和既定协议实现即时且透明的执行。


    ![](img/0daad7af426489da2dbf472852976622_144_0.png)


    图 6.6 精益区块链大厦的屋顶。


    区块链促进了去中心化自治组织（DAO）的形成。这些是由智能合约和社区共识机制治理的数字实体。这种决策去中心化允许参与者直接影响组织决策，创建一个更具响应能力和参与感的网络。区块链通过赋予参与者发言权，考虑到个人偏好以及整体的可持续运行，重构了组织的管理层。


