    # Lean Drivers Behind Blockchain


    The elegance of this decentralized organizational model built on Blockchain technology
    lies in transparency, standardization, visualization, and accountability. Blockchain
    technology serves as the foundation, offering all process participants real-time
    insights into the flow of goods and work. New insight into their processes and
    supply chains empowers every stakeholder involved to stay informed about the current
    status of their products or services.


    For example, outsourced maintenance is jointly overseen by a company and an external
    service provider. Imagine if not only these two parties also the customer could
    collaboratively monitor the entire process. This collaborative approach has the
    potential to yield positive results in terms of reduced lead times, enhanced quality,
    heightened customer satisfaction, and a lowered overall carbon footprint—all achievable
    by getting it the first time and delivering just-in-time. It paves the way for
    greater efficiency and effectiveness of “Just-in-Time” using “Kanban”, leading
    to improved flow with reduced waste.


    This transformation is more about process design and organizational evolution
    than a mere technological challenge. Understanding this fundamental concept enables
    rapid assessment and adaptation, fostering progress and enhancements across various
    industries.


    # The Digital Transformation: Lean Innovation


    Blockchain technology is transforming the “back office” of the internet. Blockchain
    digitizes registers of value, enabling value transactions to flow from one register
    to another in a seamless manner (the precise definition of “value” will be elaborated
    later).


    Product flow, payment flow, and information flow can be synchronized to move at
    the same time and avoid the wastes of wasting and mistakes made. See Figure 1.2.


    Blockchain is the enabler for entirely new forms of value streams. This evolution
    aligns closely with the Lean philosophy of the frictionless flow of value streams.'
