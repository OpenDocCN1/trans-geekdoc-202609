    # 186 Lean Blockchain Systems Thinking


    The DMAIC framework is used in Lean and Six Sigma methodologies for process improvement.
    DMAIC stands for Define, Measure, Analyze, Improve, and Control.


    Here is a brief explanation of each phase:


    # Define


    +   - Objective: Clearly define the problem, the project goals, and customer (internal
    and external) requirements.

    - Activities: Develop a project charter, map out the process, identify key stakeholders,
    and define the scope and objectives.


    # Measure


    +   - Objective: Quantify the problem and establish baseline measurements.

    - Activities: Collect relevant data on current processes, establish key performance
    metrics, and ensure data accuracy and reliability.


    # Analyze


    +   - Objective: Identify the root causes of the problem.

    - Activities: Analyze the data collected, perform root cause analysis using tools
    like Fishbone diagrams or Pareto charts, and identify patterns or variations in
    the process.


    # Improve


    +   - Objective: Develop and implement solutions to address the causes.

    - Activities: Brainstorm potential solutions, test and validate these solutions
    through pilot runs or simulations, and implement the most effective changes.


    # Control


    +   - Objective: Ensure that the improvements are sustained over time.

    - Activities: Develop and implement monitoring plans, establish control systems,
    document new procedures, and train staff to maintain the improvements.


    By following the DMAIC framework, organizations can systematically improve processes,
    eliminate inefficiencies, and enhance overall performance. In this chapter we
    will use the framework to demonstrate the benefits of Blockchain technology and
    System Thinking into Lean management and Lean System Thinking.


    In our previous chapter, Cause and Effect, we discovered two critical problems
    in our traditional organizational model:'
  - '[PAGE 213]


    1. **Information Silos**: Information is not shared effectively, leading to numerous
    non-value-adding activities.


    2. **Fragmented Organizational Design**: The organizational design is siloed and
    fragmented, resulting in a lack of alignment and accountability with the overall
    purpose of the network.


    Information asymmetry, where one party has access to different information than
    the other (or at various times), introduces a layer of confusion and waste within
    our healthcare process. This inequality is evident and visible on many levels.
    Asymmetry is the enemy of the shared purpose and aligned activities. See Figure
    10.2.


    For example, once the maternity nurse finalizes the timesheet, the process undergoes
    verification and authorization by the parents. However, this action remains isolated
    from the maternity care agency and the insurer, creating a “black spot” and an
    information asymmetry.


    Several factors can contribute to information asymmetry and siloed and fragmented
    information:


    # Lack of Shared Purpose and Alignment


    There is no coordination between the purpose of the total process, the value-adding
    activities, and how collaboration can be coordinated most effectively.


    ![](img/0daad7af426489da2dbf472852976622_213_0.png)


    Figure 10.2 Asymmetry is the enemy of the shared purpose and aligned activities.'
  - '[PAGE 214]


    # Information Asymmetry


    There is a difference in access to information: One party may have more resources,
    better connections, or specialized knowledge, giving them an advantage in acquiring
    relevant information. This lack of availability, accessibility, and transparency
    can result in an information gap. The black box design creates so much waste.


    # Fragmented Organization


    A process often involves multiple stakeholders with distinct goals and interests,
    making the design, business model, and management of their needs challenging for
    setting up a Lean process.


    This asymmetry introduces delays, mistakes, and wastes in the Voice-of-the-Network
    system. Addressing the challenges of information asymmetry is essential for a
    more accurate and collaborative healthcare environment.


    # Example: Healthcare Process for Maternity


    To understand the information asymmetry and fragmented organization, we will describe
    the care process in four separate steps. Each step acts independently and a “black
    box” of unknown status makes transactions non-transparent. See Figure 10.3.


    ![](img/0daad7af426489da2dbf472852976622_214_0.png)


    Figure 10.3 Silos in traditional organisations operate as ‘Black Boxes’ where
    only the input and outputs are known.'
  - '[PAGE 215]


    # Step 1


    The process starts when maternity caregivers Note manually record their hours
    in timesheets and let them sign by the patients. Note that the care agency and
    the insurer are not involved in this process. The care agency and the insurer
    are only informed at a later moment by pushing information in all kinds of information
    carriers, paper, email, apps, etc (See Figure 10.4).


    # Step 2


    The maternity care agency processes these records. The client, the maternity nurse,
    and also the insurer are not involved during this process step. Besides that,
    most organizations have fragmented departments, roles, functions and authorizations,
    which contributes to the fragmentation of the entire process (See Figure 10.5).


    # Step 3


    The maternity care agency forwards the data to the insurer via email. The insurer
    processes this information in its Enterprise Resource Planning system. Note that
    every organization uses its own systems, taxonomy, abbreviations, and names for
    processes and products or services. This increases the chance of errors and slows
    down the turnaround time of the process (See Figure 10.6).


    ![](img/0daad7af426489da2dbf472852976622_215_0.png)


    Figure 10.4 A ‘Push’ process in which information and activities are fragmented.
    Time spent is recorded and approved in separate activities.'
