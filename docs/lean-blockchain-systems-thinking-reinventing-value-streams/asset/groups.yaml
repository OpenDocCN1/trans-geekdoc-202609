    # Lean Blockchain Systems Thinking


    The Lean methodology serves as a comprehensive framework aimed at optimizing resource
    use, streamlining process flow, and systematically eliminating waste. By embracing
    Lean principles and methodologies alongside a continuous improvement mindset,
    organizations ensure consistent alignment of processes with customer needs and
    organizational goals.


    Management support is crucial for successful Lean implementation because decisions
    must be in harmony with the organization’s purpose, objectives, and vision.


    # Embracing Lean Thinking


    Effective implementation of Lean principles throughout a supply chain is usually
    prevented by poor collaboration and communication and a lack of common goal among
    stakeholders. Embracing “Lean thinking” is critical. To embrace this approach
    effectively, all relevant stakeholders must be brought together to look for “win-win-win”
    scenarios and to answer questions such as:


    +   - What are the causes of waiting times, overprocessing, and overproduction?

    - Why don’t we have standardized procedures?

    - What is the biggest constraint in the flow of value?


    Most of those problems will not be solved if there is no motivation or incentive
    to collaborate. The past 40 years have instead encouraged a “winner take all”
    and a “win-lose-lose” mentality.


    # Round Tables


    Examining the supply chain with a round table discussion or “Quality Circle⁶”
    could help to align the diverse needs and objectives of stakeholders. Needs and
    objectives are referred to as “Voices” by Lean practitioners. These voices include
    customers, suppliers, environmental concerns, special interest groups, shareholders,
    management, and workers.


    Ignoring these diverse voices and ignoring the end-to-end process design leads
    to waste by design. Therefore, addressing the concerns of all stakeholders through
    Lean System Thinking (LST) is essential for improving efficiency and effectiveness
    within the supply chain.'
