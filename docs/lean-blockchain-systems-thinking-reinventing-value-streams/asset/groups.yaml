    # Chapter 10


    # DMAIC


    Achieving operational excellence in any organization requires a methodical and
    systematic approach to problem-solving and continuous improvement.

    In the context of Lean Blockchain System Thinking, the DMAIC (Define, Measure,
    Analyze, Improve, Control) framework is an excellent tool for providing a structured
    approach to improvement.


    This chapter begins with an understanding of the DMAIC framework and the Define,
    Measure, Analyze, Improve and Control phases. By the end of this chapter, readers
    will appreciate the benefits of DMAIC and understand its application in the transformation
    from traditional siloed business systems, full of waste and bottlenecks, to connected
    business systems based on Lean, Blockchain technology and System Thinking.


    The framework of DMAIC was proposed and used by Motorola Corporation in 1985,
    expanded worldwide by General Electric in the 1990''s, and made popular for use
    in the service sector by Michael L. George''s book Lean Six Sigma for Service.


    # Learning Objectives


    Upon completing this chapter, readers will:


    - Understand the “what” and the “why” of the DMAIC framework

    - Understand “how” to use the Define, Measure, and Analyze phase to recognize
    and understand existing problems and their root causes in traditional organization
    (TRAD-ORG) current-state systems and structures.

    - Explore the concept of Innovative Problem Solving and Design Thinking as important
    tools for the development of solutions during the “Improve” phase of DMAIC

    - Reveal the improved future-state of decentralized organizations (DE-ORG), in
    which removal of silos and peer-to-peer flow of trusted information leads to 10x+
    efficiencies in throughput (transactions of value) and significant waste reduction

    - Appreciate that DMAIC provides the ideal framework to facilitate this move from
    “TRAD-ORG” to “DE-ORG”


