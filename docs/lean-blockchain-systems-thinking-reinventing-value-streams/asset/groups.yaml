    # 精益化区块链系统思维


    精益（Lean）方法是一个全面的框架，旨在优化资源利用、简化流程并并系统地消除浪费。通过接纳精益原则、方法论以及持续改进的心态，组织可以确保流程与客户需求及组织目标保持一致。


    管理层支持对于精益实施成功至关重要，因为决策必须与组织的宗旨、目标和愿景保持和谐。


    # 拥抱精益思维


    在供应链中有效实施精益原则通常会受到协作不力、沟通不畅以及利益相关者缺乏共同目标的影响。拥抱“精益思维”至关重要。为了有效采用这种方法，必须将所有利益相关者聚集在一起，寻找“三方赢”场景，并回答以下问题：


    - 等待时间、过度加工和过度生产的原因是什么？

    - 为什么我们没有标准化程序？

    - 价值流中最大的限制是什么？


    如果没有协作的动力或激励，这些大多数问题将无法得到解决。过去的 40 年里反而助长了“赢家通吃”和“赢输输”的心态。


    # 圆桌会议


    通过圆桌讨论或“质量小组⁶”来审查供应链，有助于协调利益相关者多样化的需求和目标。精益实践者将这些需求和目标称为“声音”（Voices）。这些声音包括客户、供应商、环境关注、特殊利益集团、股东、管理层和员工。


    忽视这些多样化的声音并忽视端到端的流程设计会导致设计性浪费。因此，通过精益系统思维（LST）解决所有利益相关者的关注点，对于提高供应链的效率和效果至关重要。


    #  ■ 27


    此外，识别那些本不应该的工作和活动至关重要，这些被称为“非价值活动”。考虑改进中间机构的流程，而新的创新可能会使中间机构变得多余。


    学习理解去中心化的组织方式，对于理解真正有助于创造价值的任务至关重要。


    总结来说，如果我们想设计精益系统基础设施，听取整个网络中所有的声音是非常重要的。


    在设计流程之前，确定涉及的价值并识别相关的利益相关者至关重要。在区块链技术领域，应用的有效性取决于对系统功能、需求和可持续目标的深度理解。


    在部署区块链时，重点在于规则和协议。这些规则作为朝着共同目标进行凝聚协作的指导原则，确保输入通过可重复的流程可靠地转换为预期结果。


    在共同目标上实现有效一致，需要明确如何一致且可靠地行动、解决问题和做出决策。


    在精益方法的背景下，这些操作指南被称为标准操作程序；在区块链领域，它们被称为协议或算法。至关重要的一点是，区块链是系统中的工具，而不是独立的解决方案，它实现了为了共同目标的协作努力。


    ![](img/0daad7af426489da2dbf472852976622_53_0.png)


    > 算法可以说是我们世界上最重要的单一概念。如果我们想理解自己的生活和未来，我们应该尽力理解什么是算法，以及算法如何与情感联系。算法是一套系统的方法步骤，可用于计算、解决问题和做出决策。算法不是某个特定的计算，而是进行计算时遵循的方法”。
    尤瓦尔·诺亚·哈拉里


    在本章中，我们正在探索区块链作为社区工具的角色，它与社区目标紧密一致。我们强调了第一次就做对、及时以及以协作心态运行重要性。


    当今的价值流通常是复杂的且在不同程度上相互相连的。


    这些价值流的有效性很大程度上取决于与共同使命和愿景一致的协作程度、沟通技巧以及编排互动的技巧。这些关键因素可以总结为协作（Collaboration）、协调（Coordination）和通信（Communication）的“三个C”。Web
    3.0 数字化促进了这些每个组件。见图 2.2。


    区块链概念是基于协作设计共享的。这与所有传统的基于互联网（TRADORG）流程有着完全不同的起点。在竞争性设计的过程中不存在真正的协作。这也导致了我们在本章之前提到的所有浪费。


    为了防止这种浪费，我们将对整个生态系统进行利益相关者分析和价值流分析。此外，我们将使用区块链技术作为一个中立系统，没有任何中心化实体负责。这种转型从对中心化...信任


    ![](img/0daad7af426489da2dbf472852976622_54_0.png)


    图 2.2 Web 3.0 数字化的“三个C”。


    信任转向对去中心化共识机制和密码学的信任。一次真正的精益改进（Kakushin）事件！


    为了理解区块链生态系统，我们将解释构成“系统”的五个组件。


    # 通过“5R”识别生态系统价值


    让我们探索系统的五个 R：角色（Roles）、关系（Relationships）、资源（Resources）、规则（Rules）和结果（Results）。


    # 角色


    区块链彻底了身份和交互追踪（关系），建立了一个透明的生态系统——无论是个人、公司、产品，甚至是像冰箱或树木这样的物体——都拥有独特的身份、声音和利益。


    映射系统中的所有角色是深入理解它们之间关系和依赖关系的第一步。理解所有利益相关者的角色，可以防止个人利益以牺牲整体为代价扩张。


    ![](img/0daad7af426489da2dbf472852976622_55_0.png)


    > 系统思维是一门观察整体的学科。它是一个观察关系而非事物的框架，观察“变化的模式”而非静态的“快照”。 彼得·圣格格⁸


    # 关系


    身份之间的依赖关系基于它们的关系和互动。至关重要的是意识到我们相互依赖，不仅在财务上，而且在社会上以及保护地球方面。这通过区块链利益相关者分析变得更加清晰。


    让我们通过简单的供应链来探索这一概念：假设你正在为一个供应链网络设计区块链解决方案，其中涉及制造商、供应商、分销商和零售商等各种实体。网络每个参与者都分配了一个唯一的加密密钥作为其数字身份。


    # 供应商


    区块链记录了从供应商到制造商的材料交易，将其与其各自的身份联系起来。


    # 制造商


    当制造商生产一批产品时，它在区块链上记录这些信息，并将交易与其唯一的身份关联。


    # 分销商


    涉及从制造商通过分销商到零售商的货物移动记录在区块链上，每个参与者的身份对于验证至关重要。


    # 零售商


    与产品销售和库存管理的交易记录在区块链上，将每项活动回溯零售商身份。身份之间的依赖关系通过以下方式变得显现：


    # 监管链


    区块链创建了一个透明且不可篡改的账本，显示了产品的整个监管链。它管理整个过程中的库存进出流。每个身份都与相应的交易相关，确保了历史的可追溯性。


    '
