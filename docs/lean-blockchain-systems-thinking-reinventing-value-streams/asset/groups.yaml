    # Building Blocks ■ 113


    Despite the size and sophistication of this market, many of its processes and
    the laws underlying them, are based on practices developed by merchants hundreds
    of years ago. In particular, under the current law of England and Wales, being
    the “holder” or having “possession” of a trade document has special significance.
    However, the law does not allow an electronic document to be possessed. As a result,
    nearly all documents used in international trade are still in paper form.


    Over the past decade, the development of technologies such as distributed ledger
    technology has made trade based on electronic documents increasingly feasible.
    Without reform, the law would have lagged behind, hindering the adoption of electronic
    trade documents and preventing the significant associated benefits from being
    achieved.


    # Transparency


    Transparency in Lean management involves open and clear communication across all
    levels of the organization. It ensures that information flows freely, enabling
    everyone to access relevant data and insights. Transparent practices improve trust
    in processes, encourage collaboration, and empower employees to make informed
    decisions, thereby enhancing overall efficiency.


    Digitalization with Blockchain technology enables transparency for end-to-end
    processes and system designs.


    Transparency could prevent questions about order status, input quality, provenance,
    location, authenticity, predictability of a process, etc.


    ![](img/0daad7af426489da2dbf472852976622_139_0.png)


    Understanding the difference between digitalization and digitization is important
    when discussing the use of Blockchain technology. **Digitization** denotes the
    process of converting analog data into digital format, exemplified by activities
    such as scanning physical documents or images. Conversely, **digitalization**
    involves the utilization of digital technologies to overhaul existing operational
    procedures, such as employing Blockchain technology or cloud services. Both digitization
    and digitalization play integral roles in facilitating a company’s journey towards
    digital transformation.'
