    将“区块链作为数字真理账本”或“去中心化作为一种民主化力量”，用于分析和理解数字时代围绕信任、安全和价值交换的文化神话。


    通过多视角审视问题，我们可以建立更深入细致的理解，并识别出更广泛干预的策略。


    ## 总结


    本章强调了理解浪费和低效率根源的重要性。当业务在多个试图实现不同目标的利益相关者之间进行交易时，识别竞争性组织模式是导致各种浪费和外部性的关键因素。


    为了优化和改进当前在产品、信息和支付同步性较低的竞争性组织设计中的现状（这种状态会导致资源浪费并推高社会成本），我们识别了以下机会：


    ## 1. 协作系统设计


    鼓励从纯竞争性的组织结构向更具协作的设计转变。从定义端到端流程的意图和目标开始，创建一个跨部门团队、部门、实体和政府共同工作的协作价值流图，共同优化流程并集体减少浪费。


    通过利用“网络之声”概念，并通过协作价值流图将利益相关者的需求与目标对齐，组织可以有效转向更具协作且以目标为驱动的方法，从而优化流程并集体减少浪费。


    ## 2. 三流思考


    我们已经看到，利益相关者之间的信息流顺畅至关重要。成功的要素（CSFs）——质量、可靠性、灵活性、成本和交付周期取决于信息的无断交换。在精益方法论中，包容性是实现有效性的关键。


    ## 因果关系 ■ 83


    产品、信息和支付的“三流思考”方法是任何流程同步和优化的必要步骤。


    从三种价值流的角度审视流程：产品流、信息流和支付流。


    - 消除每流中任何不增加价值的活动

    - 识别并消除每流中的瓶颈

    - 同步三流的时间，使其保持步调一致


    ## 3. 投资技术与创新


    发现能够简化运营并最大限度减少浪费的解决方案解决方案。这可能涉及采用自动化、区块链技术以及用于资源分配和预测模型的 AI 驱动分析，以预判低效环节。


    > 精益概念出现于互联网尚未存在的时代。

    > 随着互联网从 Web 1（读和写）和电子商务演变，每个阶段都彻底改变了我们处理精益管理和信息共享的方式。

    > 现在，随着区块链和 Web 3 的出现，这一格局为精益实践者提供了特别迷人的机会，因为它为转化为更公平、更透明和更以价值为导向的系统提供了基础要素。


    ![](img/0daad7af426489da2dbf472852976622_109_0.png)


    ## 4. 合规性


    Donella Meadows³ 描述了干预系统最重要的杠杆点。


    权力分配、目标、文化和激励是最四个杠杆点。


    ## 权力：符合 ESG 标准


    系统中的控制权力确保符合法律、环境和社会法规及标准，以减少浪费对社会的有害影响。


    这通常是不同国家主权政府的角色；然而，国际条约和协议也对单个组织施加监管权力。


    与环境、社会、治理（ESG）相关的规则以及企业社会责任（CSR），是近期尝试对组织施加权力以改变行为，并为公司和投资者的决策提供关键数据和指标的。


    ## 目标：解决组织设计缺陷


    识别并主动解决我们当前组织结构和流程中的缺陷。


    ## 文化：促进问责与透明度


    促进透明和问责的文化，确保个人、组织或生态系统对减少浪费及相关成本负责。


    ## 激励：激励减少浪费计划


    创建激励或奖励，激发并激励团队或个人产生创新想法，或实施旨在减少组织浪费的有效策略。


    ![](img/0daad7af426489da2dbf472852976622_110_0.png)


    > “给我激励，我给你结果。” Charlie Munger。构建诱导预期行为的激励往往比看起来要复杂，而错位的激励几乎总是会导致意料之外的后果。


    从更全面的视角衡量并跟踪进度。实施 KPI 以定期衡量浪费相关成本的减少。这种数据驱动的方法将有助于识别需要进一步改进的领域。


    ## 5. 教育与提高意识


    为员工提供全面的培训计划，强调减少浪费的重要性，并考虑系统框架内影响影响的后果。


    通过整合这些策略，组织可以从产生浪费的竞争性设计转向更具协作、高效且可持续的模型，从而降低整个社会的成本。


    ## 注释


    - 1. Maslow, A. H. (1966). The Psychology of Science: A Reconnaissance. Harper
    & Row.

    - 2 Womack, J. P. and Jones, D. T. (2003). Lean Thinking Banish Waste and Create
    Wealth in Your Corporation. Free Press. 第 60 页。

    - 3 Donella Hager “Dana” Meadows（1941年3月13日–2001年2月20日）是一位美国环境科学家、教育工作者作家。她最为人知的身份是《增长的极限》和《系统思维：入门》两本书的主作者。


    ## 第 5 章


    # 原则


    > “原则是为所有人开发愿景和系统的基础。”

    Stephen Covey


    ## 学习目标


    完成本次探索后，你将更好地理解：


    - 精益原则

    - 互联网原则

    - 区块链原则

    - 系统思维原则


    原则提供了新的视角，并以前以前未有的方式赋予个人和组织。理解精益、区块链和系统思维的底层原则将提升我们的理解。


    > 对于方法，可能有数百万甚至更多，但原则是寥寥无几的：掌握原则的人可以成功地选择自己的方法。尝试方法而忽略原则的人注定会有麻烦。

    Harrington Emerson²


    ## 精益原则


    精益是一套原则、工具和技术，用于平衡资源效率的优化（减少浪费）和流动（价值的流动）。随着时间的推移，低效会自然地渗透到流程中，从整个客户旅程来看这会产生浪费。消除这些浪费元素将使价值流变得更加顺畅。其核心重点围绕增强流程展开。


    精益原则是指导流程管理的基本概念。尽管这种哲学最初开发于制造业，但这些原则也可以应用于互联网环境或区块链基础设施。其核心目标仍然是为客户创造最大价值并减少浪费。精益的六大原则由识别价值、绘制价值流、创造流动、建立拉动系统、追求完美以及倾听利益相关者组成。让我们来看看这六原则：


    - 1. 识别价值：从客户的角度识别增加价值的内容。关注客户愿意付费的特征和属性。

    - 2. 绘制价值流：绘制整个价值流，包括向客户交付产品或服务所需的所有活动。识别创造价值的步骤以及浪费或非增值的步骤。

    - 3. 创造流动：简化流程以实现工作的顺畅流动，尽量减少中断、延迟和批量处理。这一原则旨在确保工作稳稳地移动到下一个环节。

    - 4. 建立拉动系统：实施基于客户需求的拉动系统，而不是向流程中推入更多工作。这有助于减少过量生产和过库存。

    - 5. 持续改进追求完美：通过消除浪费和坚持追求卓越来实现持续改进。鼓励学习和创新文化，以不断优化流程。


