    - 5. 分析并改进整体


    ## 1. 目的


    识别任何系统中的每位利益相关者都有其独特的视角和目标是至关重要的。然而，当我们放眼全局观察整个流程的总体目的时，我们看到了各种关系、价值驱动的活动以及为了共同目标所做的共同贡献。


    ## 引入精益系统思考


    想象通过精益系统思考者的视角来看这一医疗保健流程。其核心目的是确保以优化的成本高效交付高质量的医疗服务。为了实现这一目标，流程设计必须促进最佳协作、协调和沟通（3C），在成本效益和质量之间取得平衡。


    我们观察到，与同步信息相关的行政负担对整个流程的结算有显著影响，阻碍了其最终目的的实现。


    这引发了一些问题。见图 4.10。


    ## 精益区块链系统思考


    ![](img/0daad7af426489da2dbf472852976622_98_0.png)


    **图 4.10** 在设计任何信息系统时必须回答的问题。


    ## 2. 关键成功因素


    在精益方法论中，CSF 是决定流程或系统有效性和效率的关键要素。通过整合这些成功因素，组织可以有效实施精益原则，并在效率、质量和客户满意度方面实现持续改进。


    为了保持该流程分析的简单，我们选择了五个在每个流程中都重要的 CSF。见图 4.11。


    - **质量 (Quality)**

    质量是每个流程中的基本成功因素。它强调交付可能或超过客户需求和预期的产品或服务。它涉及追求完美的**透明度**、**责任制**、有效的资源管理并确保输出的一致性。功能和特性按预期工作以及信息的准确性都是质量
    CSF 的示例。


    - **可靠性 (Reliability)**

    可靠性关注流程的一致性和预测性。它关于创建**你可以信任的**系统和工作流，使其能够一致地产生预期结果，而不会出现意外的错误或波动。**标准**的使用在可靠性中起着重要作用。


    - **灵活性 (Flexibility)**

    灵活性是指系统或流程适应变化、波动或不断变化的客户需求而不损害效率的能力。精益旨在创建能够快速调整市场需求或需求变更的灵活系统。**反馈循环**、


    ![](img/0daad7af426489da2dbf472852976622_99_0.png)


    图 4.11 五个最重要的关键成功因素 (CSF)。


    系统分析和迭代的敏捷改进方法有助于提高灵活性。


    - **成本 (Cost)**

    削减成本是许多精益转型的一个重要 CSF。它涉及识别和消除浪费以精简流程，并在保持或提高质量的同时最大限度地减少不必要的支出。精益力求通过优化资源利用来实现成本效益。


    - **交付时间 (Lead Time)**

    交付时间代表了从流程开始到完成的期间。它包括从下订单到交付的时间（例如，支付发票的结算期为 90 天）。精益方法论侧重于通过消除非价值增任务（浪费）和限制流程波动（标准化工作）来缩短交付时间。


    为了实现这些 CSF，必须理解利益相关者的各种目标，并将其与端到端流程的总体目标对齐。


    我们的观察显示，目前的协作缺乏对流程优化的全面关注。重点主要放在个人利益相关者的目标及其独特能力上，忽视了他们的相互依赖关系。这是一种缺乏对整个工作流进行协调或优化的推送策略。


    显然，在整个端到端流程中促进更好的协作、协调和沟通——而不仅仅是改进单个步骤或活动——对于可持续性能和整体性能提升至关重要。


    为了实现这一目标，理解每个利益相关者对整个流程的目标、增值活动和特定需求是至关重要的。


    我们需要让每位利益相关者的目标和利益以及整个生态系统的目标可见。因此，我们引入了 VoN 的概念。


    ## 3. 网络声音 (Voice of the Network)


    在我们的产科医疗案例中，每个利益相关者都有自己的一套优先事项、期望和动力；我们称之为“声音”。平衡和对齐这些声音对于优化整个系统至关重要。只有这样：


    - 服务提供者可以高效地提供高质量服务，

    - 保险公司可以有效地管理风险和成本，

    - 医疗机构可以优化地协调服务，

    - 患者可以方便且负担得起获得最好的护理。


    以下是目标、价值和利益的概述。


    | 利益相关者 | 价值 | 声音 |

    |---|---|---|

    | 护理者 (Caretaker) | 提供护理 | 尽可能更多的时间 |

    | 医疗机构 (Care agency) | 促进护理 | 缩短交付时间，质量 |

    | 保险公司 (Insurer) | 规避风险 | 降低成本，形象 |

    | 患者 (Patient) | 接受最好的护理 | 服务良好，成本 |


    ## 因果关系


    在精益方法论领域，“业务声音”、“员工声音”或“环境声音”通常强调单一视角。


    然而，我们真正需要的是能够识别并对齐多个声音的全局视图。为了解决这个问题，我们引入了 VON。为了加强整体，需要对三种流有意识。


    ## 4. PIP 价值框架


    ### 三流结算


    三大流结算


    利益相关者分析和“声音”提供了对目标的见解。现在重要的是思考一种让每个利益相关者都做出贡献的策略。我们建议通过三种流来思考。见图 4.12。


    - (1) 产品流，

    - (2) 信息传输，以及

    - (3) 支付流程被可视化为三种流。


    采用三种流的策略对于识别影响结算的限制特别有用。目标是尽可能同步这三种流，


    ![](img/0daad7af426489da2dbf472852976622_101_0.png)


    旨在最终建立单件流，也称为单件流。


    注意信息是如何推送到系统的。从服务提供者到客户，从护理者到医疗机构，最后从医疗机构到保险公司。


    只有在每个利益相关者都收到这些信息后才能进行支付。


    单件流会是什么样的？


    - 1. 当客户交付并批准服务后

    2. 信息立即同步

    3. 这样就可以进行支付


    ## 5. 分析整体


    当利益相关者没有及时同步信息时，会导致各种类型浪费的积累，导致效率和生产力的显著下降。让我们仔细观察整个流程并尝试确定根源。


    ## 等待时间


    协作不足经常导致流程步骤之间的延迟和等待期。例如，当一个利益相关者完成任务，但后续的利益相关者尚未准备好或收到通知时，会导致等待时间、资源浪费和效率低下。


