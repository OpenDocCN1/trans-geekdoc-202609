  \n#### 3.6.1 仿真设置\n\n有多种模型被提出用于表征 ReRAM 操作；然而，在本章中，我们使用文献[168, 171]中提出的模型，该模型基于物理结构构建。文献[172]中的阈值开关型模型据称对变化具有容忍度[173]。文献[172]中阈值模型的![image](img/ch03_si285.gif)、![image](img/ch03_si286.gif)、![image](img/ch03_si287.gif)、![image](img/ch03_si288.gif)和![image](img/ch03_si289.gif)分别设置为\
