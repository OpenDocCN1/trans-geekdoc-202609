  ## 第 4 章\n\n### 机器学习算法背景\n\n本章介绍机器学习算法及优化技术。我们首先介绍支持向量机（`SVMs`），随后介绍神经网络及其变体。作为阐述这些算法基础的应用为分类问题。\n\
  \n### 4.1 基于 SVM 的机器学习\n\n`SVM` 是一种监督学习模型，具有相关的学习算法，用于分析用于分类和回归分析的数据。给定一组训练样本，每个样本标记为属于两个类别之一（考虑二分类问题），`SVM`\
  \ 训练算法构建一个模型，将新示例分配到两个类别之一，使其成为一种非概率二元线性分类器。`SVM` 模型将样本表示为空间中的点/坐标，通过映射使不同类别的样本由一个尽可能宽的可观察/可分离边界区分开来。新的输入样本随后被映射到同一空间，并根据其落在边界的哪一侧来预测其所属类别。\n\
  \n简而言之，`SVM` 是一种二元分类器（可扩展至多类），它从训练样本中寻求最大间隔分离超平面。`SVM` 的类型可能因数据属性而异。对于可线性分离的数据，可应用如图\
  \ 4.1(a)所示的线性 `SVM`，其中可观察到分离边界。否则，若数据不可线性分离，则需要如图 4.1(b)所示的非线性 `SVM`。与回归等技术相比，非线性\
  \ `SVM` 能更高效地区分复杂数据集。\n\n![image](img/PBPC0390-04-f01.jpg)\n\n图 4.1 (a) 线性 SVM；(b)\
  \ 非线性 SVM 演示\n\n由于传统 `SVM` 仅提供二元分类，因此无法用单个 `SVM` 对多标签进行分类。因此，对于指纹识别等复杂应用，需要多个 `SVM`，如图\
  \ 4.2 所示。测试图像需在 `SVM` 给出分类结果前通过多个分类器。为实现更高性能，每个 `SVM`（在不同阶段）都需提供正确的分类。这表明每个阶段都需要高精度的\
  \ `SVM`。\n\n![image](img/PBPC0390-04-f02.jpg)\n\n图 4.2 通过多个 SVM 进行指纹识别\n\n### 4.2\
  \ 基于单层前馈神经网络的机器学习\n\n除了 `SVM`，还存在许多用于多类分类的技术。在分析和分类复杂数据集方面取得显著成功的重要技术之一是神经网络。神经网络被认为是一种受哺乳动物大脑启发的技术，源于对人工神经元的利用，并通过利用其互连性来执行复杂任务。鉴于神经网络有众多可用变体，我们在此描述突出且广泛使用的架构和技术。\n\
  \n#### 4.2.1 单层前馈网络\n\n当今的数据分析主要基于机器学习算法来构建模型，以关联输入数据与目标输出。在神经网络中，通过神经元及其连接性从数据中进行特征提取，以提取用于数据分析的关键信息。神经网络是用于数据分析应用的流行模型\
  \ [174]，通常包含两个计算阶段：训练和测试。在训练阶段，通过反向传播技术利用训练输入数据，通过最小化试验值与目标值之间的误差，来确定神经网络模型的权重系数，即决定神经元间连接性的权重。在测试阶段，利用确定好系数的神经网络对新的测试数据进行分类。\n\
  \n然而，输入数据可能是高维且包含冗余信息的。为了便于训练并最小化信息冗余，通常需要进行特征提取，以在减少冗余和/或降维的情况下表征特征数据。\n\n\n\n\
  尽管特征有所减少，但将神经网络应用于大量数据时，训练时间极高。为了加快训练过程，需要从两个角度解决挑战。首先，具有最小参数调整的通用增量机器学习架构被视为加快训练阶段的解决方案。所提出的单层前馈网络（SLFN）如图\
  \ 4.3 所示，主要基于增量最小二乘（LS）解。其次，分析每个学习步骤的关键复杂度，并针对硬件友好型算法进行优化，以在最小化硬件操作复杂度的前提下探索并行性，是增强训练过程的另一种解决方案。由于硬件上的计算比软件快得多，在硬件中利用并行性可显著加快训练过程。从输入数据中提取特征是在执行分类和预测操作中的关键过程，随后是学习数据分布。\n\
  \n![image](img/PBPC0390-04-f03.jpg)\n\n图 4.3 (a) 单层神经网络。(b) 神经网络训练和测试的一般流程\n\n#####\
  \ 4.2.1.1 特征提取\n\n通常，通过投影从原始数据`![image](img/ch04_si1.gif)`中提取特征，\n\n`![image](img/ch04_si314.gif)`\n\
