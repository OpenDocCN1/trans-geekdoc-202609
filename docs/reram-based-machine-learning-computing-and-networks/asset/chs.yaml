  \n##### 4.2.1.2 基于神经网络的学习\n\n特征提取后，可以执行各种机器学习算法[53,176,177]进行数据分析。如图 4.3 所示，对于典型的神经网络模型，需要从训练中确定网络权重，然后执行测试（推理）。设`![image](img/ch04_si18.gif)`表示具有训练输入`![image](img/ch04_si19.gif)`的特征数量，其中`![image](img/ch04_si20.gif)`是训练数据大小。提取的特征将输入神经网络，第一层输出`![image](img/ch04_si21.gif)`具有以下关系：\n\
