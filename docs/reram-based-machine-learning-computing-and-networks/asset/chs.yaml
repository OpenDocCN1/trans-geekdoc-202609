  \n##### 4.2.2.2 基于直接梯度的 L2 范数优化\n\n如 算法 4.1 所示，该方法要求通过网络进行一次前向传递来计算每个权重的偏导数，随后进行一次网络的反向传递\
  \ [177]。当每个权重的导数已知时，这种方法非常高效。然而，对于基于硬件的训练，导数通常无法预先得知。在该算法中，基于 L2 范数计算，可在硬件上实现直接梯度计算，如下所示：\n\
  \n```\n![image](img/ch04_si330.gif)\n```\n\n其中 ![image](img/ch04_si99.gif) 是相对于\
  \ ![image](img/ch04_si100.gif) 的微小正向变化。该技术简单且精度足够，可用于基于 L2 范数的误差函数的硬件评估。在后续章节中，本书将展示，通过利用耦合振荡器网络和\
  \ ReRAM 器件中的交叉阵列结构，神经网络的前向传递以及 L2 范数误差函数的评估可以极快地完成，甚至可能在一个时钟周期内完成。\n\n### 4.3 基于\
  \ DCNN 的机器学习\n\n除了多层神经网络，深度神经网络和深度卷积网络在执行数据密集型和图像分析以及复杂数据集任务时，已获得更高的性能。\n\n####\
  \ 4.3.1 多层神经网络的深度学习\n\n\n\n虽然单隐层前馈神经网络（SLFN）能够以较小的推理和训练时间达到理想的精度，但尚未被证明能处理复杂的基准测试。例如，文献[183]中的最新研究仅展示了在加州大学欧文分校（UCI）数据集[184]上的高效性能，这距离实际问题仍有很大差距。文献[185]的研究表明，深度学习可用于训练多层神经网络。一个简单的深度学习示意图如图\
  \ 4.5 所示。在该图中，存在连接相邻节点的权重矩阵。当获得神经网络的输出时，可以更新多层神经网络中的所有权重。\n\n深度学习的架构包括各种深度神经网络、深度卷积神经网络（DCNN）、深度置信网络和循环神经网络。在以下章节中，将描述具有二值权重和神经元的\
  \ DCNN 的细节。\n\n#### 4.3.2 卷积神经网络\n\n图 4.5 展示了一个具有全连接层的多层神经网络。然而，通常简单的全连接层无法从输入信号和隐藏节点中提取足够的信息。因此，文献[187]中应用了卷积神经网络（CNN）[186]的基本结构，从而形成了\
  \ DCNN。在这种架构中，卷积层被用来替代图 4.5 中的全连接层。在每一层中，都有若干个卷积核来提取一个输入模式的不同信息。\n\n![图 4.5 具有全连接层的简单深度学习示意图](img/PBPC0390-04-f05.jpg)\n\
  \n图 4.6 以一个卷积核为例，展示了 CNN 进行图像分类的一层结构。输入特征的维度为 ，且所有像素均为实值。在此例中，两个向量之间的乘法运算执行 次。对于整个算法，存在许多卷积核和层，导致计算复杂度很大。因此，开发了二值卷积神经网络（BCNN）以降低运算中的位宽。\n\
  \n![图 4.6 CNN 图像分类中一层的示例](img/PBPC0390-04-f06.jpg)\n\n#### 4.3.3 二值卷积神经网络\n\n正如第\
  \ 4.3.2 节所讨论的，将 CNN 传统直接映射到硬件上，将需要大量且不必要的硬件资源，且并行性较差。文献[188]中的最新工作建议了一种在训练期间使用二值约束的\
  \ CNN。本节讨论生成一种具有位级并行性的 CNN 模型，用于卷积、批归一化、池化函数和激活函数。\n\n##### 4.3.3.1 位级卷积\n\n卷积运算是\
  \ CNN 中最耗时且计算密集型最强的运算。文献[188]中的二值卷积对输入特征和权重均使用 ，因此不需要浮点矩阵-向量乘法运算。然而，负二值权重无法直接在硬件上实现。为避免负权重，文献[189]中的最新工作使用位级\
  \ XNOR 和位计数运算，并配合 用于硬件实现。因此，位级 CNN（bitCNN）可在数学上表示如下：\n\n![公式](img/ch04_si331.gif)\n\
  \n其中 和 分别为第 个块中的二值权重和二值输入特征图。 为二值卷积的输出， 定义为位级 XNOR 运算。与单精度数据格式的实值 CNN 相比，由于权重和特征图的元素可存储在\
  \ 1 位中，二值卷积层对逻辑和存储资源的需求可大幅降低。同时，它还能带来更高的并行性以及更大的能效提升。\n\n##### 4.3.3.2 位级批归一化\n\n\
  接下来，需要批归一化来稳定并加速训练过程。在推理阶段，保留归一化以匹配训练过程。归一化的输出可表示为\n\n![公式](img/ch04_si332.gif)\n\
  \n其中 和 为小批量上的期望和方差，而 和 为可学习参数[190]，用于缩放和平移归一化后的值。在推理阶段， 、 和 均固定，用于归一化卷积输出，其值在训练阶段确定。\n\
  \n##### 4.3.3.3 位级池化和激活函数\n\n为最小化计算复杂度，池化层在归一化层输出的特征图上，跨连续区域执行下采样。池化用于从特征中选择最显著的信息。它还提供平移不变性并降低计算强度。CNN\
  \ 中常用两种池化方案。一种是最大池化，取池化区域内的最大值。另一种是平均池化，取池化区域的平均值。二值 CNN 的二值最大池化应用如下：\n\n![公式](img/ch04_si333.gif)\n\
  \n其中 和 分别为池化前后的特征。二值非线性可表示为 处理二值 CNN 中最大池化输出的激活函数称为二值化，可表示为\n\n![公式](img/ch04_si334.gif)\n\
  \n其中 为最大池化层的输出， 为第 个二值化层生成的二值化激活。\n\n综上所述，池化和二值化这两个步骤旨在找出池化区域中最大数的符号。因此，可先对池化区域内的所有数进行二值化，然后再确定它们中的最大值。由于二值化结果仅为\
  \ 或 ，池化过程只需检测区域内是否存在 即可。一个交换池化和二值化顺序的区域示例如下：\n\n![公式](img/ch04_si335.gif)\n\n此处，实值矩阵\
  \ 表示批归一化的输出。公式(4.22)中的第一条路径是先二值化，后最大池化，而第二条路径则相反。显然，在推理阶段，交换最大池化和二值化的顺序不会影响最终输出。\n\
  \n##### 4.3.3.4 位级 CNN 模型概览\n\n位级并行化 CNN 模型的整体工作流程如图 4.7(b)所示。每个二值卷积层接收来自前一层生成的二值特征图作为输入，并在二值特征图与二值滤波器权重之间执行位级卷积。卷积输出经归一化层进一步处理，再由最大池化层进行下采样。下采样后的特征图随后送入二值化层，根据输入符号产生二值非线性激活。\n\
  \n\n\n\n\n![image](img/PBPC0390-04-f07.jpg)\n\n图 4.7 (a) 传统 CNN 与 (b) 位并行 CNN 的计算流程对比\n\
