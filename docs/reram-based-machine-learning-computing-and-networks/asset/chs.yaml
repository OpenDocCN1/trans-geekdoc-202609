  \ 一致性。\n\n# 第 9 章\n\n**结论：总结、开放问题与挑战**\n\n### 9.1 结论\n\n总之，本书从电路层面、架构层面一直到系统层面，针对面向机器学习应用的基于电阻式随机存取存储器的非易失性存内计算架构，进行了彻底的研究。\n\
  \n在电路层面，一方面，我们使用非易失性存储器 (NVM)-SPICE 来模拟二进制 ReRAM 交叉阵列加速矩阵-向量乘法。通过将矩阵的所有元素编程到交叉阵列中的\
  \ ReRAM 电阻中，我们可以用交叉阵列的字线电压来表示另一个矩阵，乘法结果可以用位线上的汇聚电流来表示。在这种映射方案中，ReRAM 电阻和交叉阵列 I/O\
  \ 均为二进制格式，从而保证了计算精度。仿真结果表明，与基于互补金属氧化物半导体 (CMOS) 的专用集成电路 (ASIC) 同等设计相比，所提架构的速度快 ![image](img/ch09_si1.gif)，能效高\
  \ ![image](img/ch09_si2.gif)，面积小 ![image](img/ch09_si3.gif)。另一方面，我们在 Cadence 中使用\
  \ Verilog-A 模型构建了一个基于 ReRAM 的压控振荡器电路。在由基于 ReRAM 的振荡器组成的耦合网络中，仿真结果可以拟合为 L2 范数计算。与传统的基于\
  \ CMOS 的振荡器电路相比，它具有结构更简单、面积更小和能效更高的优势。\n\n在架构层面，我们开发了分布式存内计算架构 (XIMA) 和三维 (3D) CMOS-ReRAM\
  \ 架构。对于 XIMA，我们同时将 ReRAM 交叉阵列用于数据存储和计算引擎。我们使用一个数据块和一个逻辑块形成一个数据-逻辑对，所有对均分布式放置。因此，通信带宽可以显著提高，因为计算引擎仅从这些对中访问数据。为实现存内计算，我们在每个数据-逻辑对中设计了一条控制总线，用于处理器、数据块和逻辑块之间的通信。此外，重新定义了处理器与控制总线之间的通信协议，以实现存内计算。对于\
  \ 3D CMOS-ReRAM 架构，我们开发了两种方案：单层和多层。单层架构利用 ReRAM 通孔连接顶层字线和底层位线。所有其他 CMOS 逻辑也在底层实现。多层架构利用硅通孔\
  \ (TSV) 连接第一层基于 ReRAM 的数据缓冲、第二层基于 ReRAM 的逻辑计算和第三层 CMOS。这种 3D 架构可显著提高混合 ReRAM/CMOS\
  \ 计算系统的吞吐率和面积效率。\n\n在系统层面，对于 XIMA，我们加速了三种机器学习算法。单层前馈神经网络 (SLFN) 的学习和推理过程已被优化并部分映射到无源二进制\
  \ ReRAM 交叉阵列上。此外，我们还采用不同的映射方案，将二进制卷积神经网络同时映射到无源阵列和一选择器一 ReRAM (1S1R) 阵列上。而且，基于 L2\
  \ 范数梯度的学习和推理也在同时包含交叉阵列和耦合振荡器的 ReRAM 网络上实现。对于 3D CMOS-ReRAM 架构，我们也映射了优化的 SLFN 算法。学习和推理阶段的所有操作均已实现，从而实现在线学习。此外，张量化神经网络以不同的映射方案分别映射到单层和多层加速器上。对于所有映射到\
  \ XIMA 和 3D CMOS-ReRAM 加速器上的机器学习算法，我们在器件、架构和系统层面评估了它们的性能。所有实现均显示出更高的吞吐率、带宽和并行性，以及更好的能效。\n\
  \n### 9.2 未来工作\n\n基于上述工作，有几项潜在的未来工作可进一步完善本研究。\n\n第一项潜在工作是验证讨论的一些设计。在本工作中，我们通过仿真在器件和电路层面探索了二进制\
  \ ReRAM 交叉阵列以及振荡器网络。然而，阵列中的 ReRAM 器件并不完全均匀，因此该映射方案可能无法应用于大规模交叉阵列。此外，ReRAM 交叉阵列中的偷漏路径和热效应也会导致计算过程中的不准确性。至于\
  \ XIMA，本工作仅模拟了几组控制总线设计，但在实际实现中，将会有成千上万个控制总线模块，因此也有必要优化所有这些设计。\n\n第二项潜在工作是利用 ReRAM\
  \ 网络实现类脑计算。本工作仅探索了基于 ReRAM 架构的人工神经网络实现。所有这些算法最初均为基于 CMOS 的计算系统（如 CPU、GPU、CMOS-ASIC\
  \ 和 FPGA）设计。基于 ReRAM 的架构可执行模拟值计算操作，这广泛应用于类脑应用中。例如，与 CMOS-ASIC 或 FPGA 相比，在 ReRAM\
  \ 上实现基于尖峰时序依赖可塑性 (STDP) 的突触编程算法和脉冲神经网络更容易。有可能探索一种结构更简单、可扩展性优于现有最先进工作的基于 ReRAM 的类脑计算系统。\n\
