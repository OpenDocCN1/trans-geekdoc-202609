  1\"或\"0\"的。\n\n### 3.6 用于逻辑运算的 ReRAM\n\n正如引言中所述，将存储元件同时用于存储和处理（逻辑）将有助于减少面积开销并增加片上存储。在本节中，我们提出了这样一种电路，它将同时用于逻辑运算和存储目的。所设计的电路基于第\
  \ 3.5 节设计的逻辑电路。作为一个示例，我们在此展示基于 ReRAM 的或门兼存储器。\n\n图 3.21 展示了具有两个 ReRAM 的或门，可用于多用途，即作为用于数据存储的\
  \ ReRAM，以及作为用于 ReRAM 中存储数据的或计算元件。ReRAM 的输入由信号源![image](img/ch03_si275.gif)和![image](img/ch03_si276.gif)提供。为了执行逻辑运算（本例中为或运算），开关![image](img/ch03_si277.gif)和![image](img/ch03_si279.gif)两端清晰观察到。负载电阻![image](img/ch03_si280.gif)可替换为另一个基于\
  \ ReRAM 的电路。\n\n![image](img/PBPC0390-03-f21.jpg)\n\n**图 3.21** 两输入 ReRAM 或门输出\n\
  \n要将 ReRAM 用于存储目的，开关![image](img/ch03_si281.gif)和![image](img/ch03_si282.gif)保持断开（不连接）。需要注意的是，在执行读操作之前，信号源（![image](img/ch03_si283.gif)，![image](img/ch03_si284.gif)）必须连接到\
