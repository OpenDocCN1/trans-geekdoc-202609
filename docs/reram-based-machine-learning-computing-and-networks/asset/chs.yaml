  \n# 第一部分\n\n## 简介\n\n# 第 1 章\n\n## 简介\n\n### 1.1 简介\n\n在过去二十年中，计算范式经历了巨大的转变，商业单位和组织积累了近乎\
  \ EB 级（![image](img/ch01_stripin_si1.gif) 字节）的数据量。分析并响应此类海量数据的需求，促使机器学习（ML）方法在从自动驾驶到智能家居等广泛的应用中得到采用。\n\
  \n处理此类海量数据的主要挑战之一，是从内存中获取数据并将其写回，而不会遭遇众所周知的内存墙瓶颈。为解决此类问题，引入了存内计算（IMC）以及 Hadoop 和\
  \ MapReduce 等支持框架。这已被证明极具益处，因为这些方法解决了传统计算技术中存在的时间局部性缺乏的挑战。毫无疑问，这些技术提供了帮助，但功耗和处理延迟的挑战仍未解决，尤其是在宏观系统和数据中心中。\n\
  \n基于新兴非易失性器件的存内计算方法在学术界和工业界均备受关注。许多研究人员认为，由于其超低功耗和高密度嵌入式存储特性，这种架构将是打破摩尔定律的契机。包括电阻式随机存取存储器（ReRAM）、相变随机存取存储器（PCRAM）、磁阻随机存取存储器（MRAM）、铁电随机存取存储器（FeRAM）和\
  \ NOR Flash 在内的各种器件均已被讨论。由于 ReRAM 具有多电阻电平潜力且兼容 CMOS 技术，它是所有这些器件中最具前景的。IBM 和 HP 等知名公司已投资该领域，我们相信基于\
  \ ReRAM 的 IMC 将在未来 2-3 年内随物联网（IoT）产品实现商业化。本章介绍了为数据密集型计算部署 ML 算法的必要性和动机。\n\n####\
  \ 1.1.1 内存墙和功耗墙\n\n谷歌和 Facebook 等新型社交媒体的信息技术正在产生前所未有的 EB 级海量数据。例如，沃尔玛每小时处理一百万笔交易，并从中收集\
  \ 2.5 PB 的信息 [1]；Facebook 用户每天上传 100 TB 的数据和十亿条内容 [2]。深度数据分析可能成为面向数字数据社会的未来经济增长的驱动力。主要挑战源于建立在传统计算机架构和\
  \ CMOS 技术之上的现有硬件基础设施。与数据增长相比，摩尔定律的缩放已变得缓慢。尽管有许多最近的大规模研究计划，如 EB 级计算（NSF/DARPA-美国）和人脑计划（欧盟委员会），但它们仍受限于这一奇点，因为存在内存瓶颈。\n\
  \n为了处理并从海量收集的数据中获取洞察，需要能够随数据扩展的并行且可扩展的基于 ML 的解决方案。作为回应，出现了多种可扩展的 ML 算法及并行框架：Hadoop\
  \ [3]、Spark [4]、Flink [5,6]、Tez [7]、Google Dataflow [8]、0xdata H2O [9] 和 Petuum\
  \ [10]。毫无疑问，这些框架将处理能力推向了传统方法之外，但执行这些新兴分析解决方案需要大量的计算资源，如电力和合适的处理架构。因此，数据中心开始通过配备更多计算节点来扩展，以满足不断增长的数据量\
  \ [11–14] 和 ML 算法复杂性的需求。虽然对基于 ML 的计算资源的需求随着数据规模持续增长，但半导体行业已达到缩放极限，无法再降低新芯片的功耗。基于通用同构处理器的当前服务器设计，在处理此类基于\
  \ ML 的数据密集型计算时，在性能/功耗方面不再高效 [15–22]。\n\n在大数据分析期间，数据中心或节点中的计算系统需要通过密集的内存访问来处理存储的数据。内存访问被视为限制当前架构和数据中心性能与吞吐量的关键障碍之一。在包括网络搜索、数据挖掘和\
  \ ML 应用在内的新兴应用中，均可见密集的内存访问。微处理器需要通过密集的内存访问来处理存储的数据。然而，最先进的数据存储和处理硬件仍存在带宽墙问题（大量 I/O\
  \ 拥塞），以及先进 CMOS 技术中大量静态功耗导致的功耗墙问题。因此，迫切需要可扩展、节能的大数据分析硬件设计。以下研究活动 [23,24] 试图缓解未来大数据存储和处理中的内存瓶颈问题：\n\
  \n*   首先，作为面向大数据计算的有前景技术，新兴非易失性 IMC 展现出作为高吞吐率、节能解决方案的巨大潜力。可在存储器内开发专用加速器。在这种情况下，数据在被处理单元读出前可先进行预处理，从而将数据迁移最小化并缓解带宽墙。此外，非易失性存储器（NVM）器件无需电荷即可保持信息，从而可显著降低漏电流，并缓解功耗墙问题。\n\
  \n\n\n\n\n#### 1.1.2 半导体存储器\n\n正如上一节所见，在处理单元附近拥有存储元件有助于解决大量挑战。存在多种存储器，它们在功能、物理特性以及所提供的优势方面各不相同。我们首先回顾计算机体系结构中使用的存储器，这将为后续章节中描述的架构设计奠定基础。\n\
  \n##### 1.1.2.1 存储技术\n\n传统半导体存储器是指计算机体系结构中基于硅的晶体管器件（`CMOS`、`BTJ`、`FINFET` 等）。这些存储器用于临时或永久地存储计算指令以及数据。与硬盘驱动器（`HDD`）和光盘驱动器（`ODD`）等存储介质因机械驱动的限制而具有预定的数据访问顺序不同，半导体存储器具备随机访问的特性。无论数据位置如何，访问任意数据所需的时间几乎相同。\n\
  \n可以进一步将所有半导体存储器分为两类：易失性存储器和 `NVM`。在易失性存储器中，数据以电信号（如电压）的形式存储，且需要不间断的电源供应。一旦电源供应停止，器件关闭，数据随之丢失。目前，最常用的易失性存储器是静态随机存取存储器（`SRAM`）[25–27]和动态随机存取存储器（`DRAM`），其数据由电压电平指示。相反，`NVM`（非易失性存储器）即使在器件关闭时也能保留数据，因为其数据主要由非电学状态保存。例如，可编程只读存储器（`PROM`）中的位由单个存储单元的熔丝是否烧断来表示。图\
  \ 1.1 简要介绍了易失性 `SRAM`/`DRAM`、传统非易失性存储器（`NVMs`）以及新兴 `NVMs` 的特性。存储元件按大小和访问时间排列（最左侧的元件数量/容量最小，但对处理器的访问速度最快；而向右侧元件数量/容量增大，访问时间也随之变长）。三种主要的存储技术是\
  \ `SRAM`、`DRAM` 和闪存，其详细内容将在下文介绍。\n\n![image](img/PBPC0390-01-f01.jpg)\n\n**图 1.1**\
  \ 计算机体系结构中不同存储器的层级结构\n\n###### 静态随机存取存储器\n\n一个典型的 `CMOS-SRAM` 单元由六个晶体管组成，如图 1.2\
  \ 所示。由 `M1` 至 `M4` 组成的触发器保存存储的位。*静态* 一词源于该单元不像动态 RAM 那样需要刷新，且只要供电，数据即可保持的事实。连接有\
  \ `WL` 和两条位线（`BLs`）的 `M5` 和 `M6` 用作访问晶体管，以选中目标单元。\n\n![image](img/PBPC0390-01-f02.jpg)\n\
  \n**图 1.2** 待机状态下带有漏电路径的 6T SRAM 单元结构。`BLs` 被预充至高电平，假设 `Q` 处存储的数据为“1”。\n\n`SRAM`\
  \ 单元有三种操作状态：写入、读取和待机。对于写入操作，需将要写入的值以互补方式同时施加到两条 `BLs`（即 `BL` 和 `BLB`）上。假设我们希望向单元写入“0”，即\
  \ `Q` 为“0”且 `QB` 为“1”，则 `BL` 被拉低而 `BLB` 拉高。一旦通过将 `WL` 置“1”导通 `M5` 和 `M6`，`BL` 驱动器将覆盖先前存储的值。为了容易地覆盖自强化触发器中的先前状态，`BL`\
  \ 驱动器的设计驱动能力需强于触发器中的晶体管。\n\n对于读取操作，在读取周期开始前，两条 `BLs` 均被预充至高电平，字线（`WL`）的导通标志着读取操作的开始。由于\
  \ `Q` 和 `QB` 处电压相反，其中一条 `BL` 将被单元拉低，随后 `BL` 感测放大器检测到该 `BL` 的放电。在电压模式感测方案中，`BL` 电压差\
  \ `ΔVBL`（`Q` 减 `QB`）的符号决定存储位的值。几十毫伏量级的 `ΔVBL` 足以高效区分哪条 `BL` 正在放电。例如，假设存储位在 `Q` 处为“1”，在\
  \ `QB` 处为“0”，一旦 `WL` 有效，`QB` 将向“0”放电；当获得几十毫伏的正 `ΔVBL` 时，基于锁存器的感测放大器将通过正反馈放大该微小电压差，最终输出逻辑“1”作为结果。\n\
  \n当 `WL` 接地，导致两个访问晶体管关闭时，单元处于待机状态。在待机状态下，两个交叉耦合的反相器因正反馈而相互增强，只要供电，数值即可保持。关于 `SRAM`\
  \ 在待机状态下的一个显著问题是严重的亚阈值漏电。亚阈值漏电是指当栅源电压小于阈值电压时晶体管的漏源电流。亚阈值电流随阈值电压呈指数级变化，这导致在深亚微米工艺节点下产生巨大的亚阈值电流。图\
  \ 1.2 展示了一个 `SRAM` 单元中的三条漏电路径，假设 `Q` 处存储位为“1”。注意 `BL` 和 `BLB` 始终预充至 `VDD` 以便于未来的读取操作。无论存储值如何，始终会有三个晶体管消耗漏电功耗。\n\
  \n与其他存储技术相比，`SRAM` 能够提供最快的访问速度，但这一优势是以密度和功耗为代价的权衡结果。由于一个 `SRAM` 单元需要六个晶体管的硅面积，`SRAM`\
  \ 密度非常有限，因此比其他存储技术更昂贵。此外，由于待机状态下的漏电问题，其功耗很大。因此，`SRAM` 最适用于高性能为主要考量且容量要求不大的场景，即处理器的缓存。\n\
  \n###### 动态随机存取存储器\n\n\n\n\n\n# DRAM 理念与 Flash NVM\n\n###### DRAM 理念\n\nDRAM 背后的理念是简单性。与\
  \ SRAM 一个单元由六个晶体管组成不同，每个 DRAM 单元仅由一个电容和一个访问晶体管组成。数据“0”或“1”由电容是完全充电还是放电来表示。然而，电容上的电荷会逐渐泄漏，经过一段时间后，电容上的电压变得太低，以至于感测放大器无法区分“1”和“0”。因此，与\
  \ SRAM 只要供电数据就能保持不同，DRAM 的保持时间是有限的，所有 DRAM 单元都需要定期读出并写回以确保数据完整性。通常，单元每 32 或 64 ms\
  \ 刷新一次。这个过程称为*刷新*，这也是动态 RAM 名称的由来。图 1.3 显示了这种 1T1C 结构 DRAM 单元的电路图。\n\n![image](img/PBPC0390-01-f03.jpg)\n\
  \n图 1.3 1T1C DRAM 单元结构的电路图\n\n要写入 DRAM 单元，首先根据要写入的值将 `BL` 设为高或低。在 `WL` 置高打开访问晶体管后，选中单元中的电容被充电为“1”或放电为“0”。由于访问是通过\
  \ NMOS 晶体管进行的，写入“1”时存在 `Vth` 压降。为了防止这种 `Vth` 压降并维持较长的刷新周期，`WL` 的驱动电压通常被提升至 `Vpp`。\n\
  \n要读取 DRAM 单元，`BL` 首先预充电至 `Vdd/2`，然后使能 `WL`。由于电荷共享，`BL` 电压将根据电容之前充电的电压（即 `Vdd` 或\
  \ `0`）略微降低或升高。如果之前已充电，电荷共享将略微提升 `BL` 电压；否则，一些电荷将从 `BL` 分布到单元电容。在这两种情况下，存储电容的电压在读操作后都会改变；因此，读操作被称为破坏性的，需要即时写回。`BL`\
  \ 上的微小电压变化可通过以下公式计算：\n\n```\nΔV = ± (Cs / (Cs + Cb)) * (Vdd / 2)\n```\n\n`ΔV` 的符号取决于存储电容的状态。在现代\
  \ DRAM 器件中，存储电容的电容远小于 `BL` 的电容。通常，存储电容的电容是连接到数百或数千个其他单元的长 `BL` 电容的十分之一。相对电容值造成了这样一种情况：当存储电容中包含的少量电荷被放置在\
  \ `BL` 上时，`BL` 上产生的电压很小，难以从绝对意义上测量。在 DRAM 器件中，电压感测问题通过使用差分感测放大器来解决，该放大器将 `BL` 的电压与参考电压进行比较。\n\
  \n反过来，差分感测放大器的使用对 DRAM 阵列结构提出了一些要求。特别是，不再使用单个 `BL`，而是需要使用一对 `BL` 来感测任意 DRAM 单元中包含的电压值。此外，为了确保这对\
  \ `BL` 上的电压和电容值紧密匹配，`BL` 在路径长度和连接的单元数量方面必须紧密匹配。上述要求导致了两种截然不同的阵列结构：开放 `BL` 结构和折叠\
  \ `BL` 结构。\n\n###### Flash NVM\n\nFlash 存储器是当今应用最广泛的 NVM 技术。这种主流存储器中的关键器件是浮栅（FG）晶体管。图\
  \ 1.4 显示了 FG 晶体管的横截面图。与金属氧化物半导体场效应晶体管（MOSFET）不同，在控制栅和沟道之间增加了一个额外的浮栅。浮栅被氧化层隔离，能够捕获电荷并保持数年。因此，FG\
  \ 晶体管基于电子是否被捕获来编码数据，并能在无电源的情况下保持数据。这就是“非易失性”一词的由来。\n\n![image](img/PBPC0390-01-f04.jpg)\n\
  \n图 1.4 FG 晶体管的横截面\n\n读操作的原理可描述如下。当浮栅中没有捕获电荷时，FG 晶体管的阈值电压为 `Vt0`；当捕获负电荷时，它们会吸引控制栅的正电荷；因此，需要更高的控制栅电压才能导通沟道，从而产生更高的阈值电压\
  \ `Vt1`。通过施加介于 `Vt0` 和 `Vt1` 之间的中间控制栅电压并测量电流，可以得知器件的状态。\n\nFG 晶体管的写操作涉及将电子注入或拉出穿过氧化层势垒。有两种方法可以实现这一点：量子隧穿或热电子注入。在量子隧穿场景中，在控制栅上施加高电压，浮栅和沟道之间将发生量子隧穿，电子可以穿过氧化层势垒。对于热电子注入场景，电子在沟道中的高电场下被加速，直到其能量足以穿透氧化层。请注意，高能电子会破坏氧化层晶格，这种损伤会累积并导致有限的写入周期，通常约为\
  \ `10⁵` 次。\n\nFlash 存储器有两种常见布局，如图 1.5 所示，串联 FG 晶体管的 NAND Flash 存储器和并联 FG 晶体管的 NOR\
  \ Flash 存储器。NAND 和 NOR 这两个名称源于它们串联或并联的连接方式类似于 NAND 门或 NOR 门。NAND 布局相对于 NOR 布局具有密度优势，因为每行只有一个接地连接，因此广泛用于外部存储。NOR\
  \ 布局延迟较低，因此广泛用于需要高性能的嵌入式系统。图 1.5 还展示了如何实现 NAND 和 NOR Flash 存储器的读取。不同施加电压幅度之间的关系如下所示：\n\
  \n```\nVread < Vpass < Vpgm < Verase\n```\n\n![image](img/PBPC0390-01-f05.jpg)\n\
  \n图 1.5 Flash 存储器的两种常见布局：NOR Flash 存储器和 NAND Flash 存储器\n\n##### 1.1.2.2 纳米级局限\n\n\
  随着技术向纳米级缩放，传统存储器架构面临一些挑战和局限。这些挑战由物理规则引起，并从两个角度进行总结。一方面，由于工艺变异导致晶体管可能存在失配问题，从而引起功能失效。另一方面，SRAM\
  \ 或 DRAM 单元中的正反馈导致热失控失效 [28]。因此，NVM 被视为随技术缩放进行数据存储的潜在解决方案。\n\n#### 1.1.3 非易失性 IMC\
  \ 架构\n\n在传统计算架构中，所有数据都存储在存储器中。它与通用处理器分离，因此需要 I/O 连接。结果，在数据处理期间，所有数据都需要读出到外部处理器，之后再写回。然而，在面向数据的应用（如\
  \ ML 加速）中，这种架构会导致严重的 I/O 拥塞，从而极大地降低整体性能 [27,29–32]。此外，由于所有数据都需要被保持，即使当前不需要使用，也会消耗大量静态功耗\
  \ [26,28,33–39]。\n\n\n\n\n理论上，通过增加更多 I/O 引脚或以更高频率运行它们，可以克服带宽问题。但实际上，I/O 频率受限于信号传播延迟和信号完整性问题，I/O\
  \ 数量受限于封装技术，因此带宽几乎已达饱和。\n\n除了提高内存带宽，减少处理器与内存之间通信的数据量是提升性能的另一种可行方案。传统上，处理器仅从主存读取原始数据。如果内存能在发送数据前执行某些操作，I/O\
  \ 通信需求可显著降低 [40–42]。例如，若需对八个数求和，传统方式需将所有八个值加载到处理器中。然而，若两数相加作为存内逻辑操作执行，可在内存内预处理加法，仅需读出四个数即可。\n\
  \n要执行 IMC，需在内存内实现逻辑操作以便进行预处理。这种架构称为存内逻辑架构。理想存内逻辑架构的需求总结见 Figure 1.6。一个巨大的 NVM 阵列通过高带宽、节能的可重构\
  \ I/O 与数千个小型加速器核心相连。同时考虑到漏电流降低，与 NVM 相关的存内逻辑架构见文献 [43–47]。Figure 1.7 展示了一种通过构建 CMOS\
  \ 电路与存储器件相结合的存内逻辑架构。示例展示了一个包含 `sum` 和 `carry` 逻辑的全加器。然而，这种单元级存内架构存在两大问题。首先，基于 CMOS\
  \ 的逻辑构建在内存中，难以重构。其次，它只能执行低复杂度逻辑操作。示例中，一个简单的 1 位加器需要 ![image](img/ch01_stripin_si34.gif)\
  \ 个晶体管，内存复杂度因此大幅增加。\n\n![image](img/PBPC0390-01-f06.jpg)\n\nFigure 1.6 Ideal logic-in-memory\
  \ architecture\n\n![image](img/PBPC0390-01-f07.jpg)\n\nFigure 1.7 IMC architecture\
  \ at memory-cell level\n\n另一种以分布式方式在块级探索的存内架构如 Figure 1.8 所示，对流量降低更有效。内存数据通常按 H\
  \ 树方式组织，数据块可以是数据阵列，或属于同一“H 树”分支的若干数据阵列。Figure 1.8 中的架构不在数据阵列内部的单元级插入存内逻辑，而是将每个数据块与存内逻辑（加速器）配对。不同于单元级存内架构，加速器可实现更高复杂度，且每个数据块的加速器数量可定制。块级存内架构的数据流为：从数据块读出数据至存内逻辑，执行特定功能后将结果写回。数据也需存储在指定块中，但比单元级架构灵活得多。块级存内架构能极其有效地减少内存与处理器间的通信流量。因为部署高功能加速器可显著减少操作数。例如，在图像处理应用领域的人脸识别中，无需传输整张图像获取布尔结果，可直接通过存内逻辑获得结果。换言之，块级存内架构适用于流量降低比延迟降低更有益的大数据驱动应用。\n\
  \n![image](img/PBPC0390-01-f08.jpg)\n\nFigure 1.8 IMC architecture at memory block\
  \ level\n\n在此架构中，非易失性 ReRAM 被大量使用。每对中的内存块和逻辑块均纯由 ReRAM 器件实现。此外，节能的存内逻辑单元部署在外部处理器中，用于执行无法由存内逻辑加速的指令。\n\
  \n### 1.2 Challenges and contributions\n\n未来网络物理系统需要高效的实时数据分析 [48–52]，应用于机器人、脑机接口及自动驾驶汽车。文献\
  \ [53,54] 近期工作显示，ML 在实时数据分析中具有巨大潜力，训练时间显著缩短。\n\n基于硬件的加速器目前用于辅助 ML 应用。在传统硬件加速器中，内存与逻辑间存在大量数据迁移\
  \ [55,56]，导致带宽墙和功耗墙。因此，对于数据导向计算，将逻辑加速器尽可能靠近内存放置，有助于缓解 I/O 通信开销 [57]。文献 [43] 提出了单元级\
  \ IMC，在存储阵列中嵌入简单逻辑电路。然而，内存中配备的相应存内逻辑无法实现复杂逻辑功能，且利用效率低，因为逻辑无法在存储单元间共享。此外，基于 CMOS\
  \ 技术存在显著的内存漏电功耗。\n\n新兴 ReRAM [58–64] 显示出成为数据密集型应用解决方案的巨大潜力。除了因非易失性带来的最小化漏电功耗，交叉阵列结构的\
  \ ReRAM 已被开发作为计算元件 [59,65]。因此，存储和逻辑组件均可按节能、节面积方式实现。更重要的是，它能提供真正的存内逻辑-内存集成架构，无需使用\
  \ I/O。然而，之前基于 ReRAM 交叉阵列的计算主要基于多电平值的模拟方式 [66] 或尖峰时间依赖可塑性（STDP）[67]。虽提升了计算容量，但纳米尺度\
  \ ReRAM 交叉阵列的严重不均匀性限制了其在精确、可重复数据分析中的广泛应用。此外，文献 [67] 提到额外的 AD 转换和 I/O 存在显著功耗。除了 ReRAM\
  \ 交叉阵列，耦合 ReRAM 振荡器可用于模拟计算。通过将定点值映射到电压，耦合 ReRAM 振荡器可执行 L2 范数计算。因直接模拟计算，可实现显著加速和能效提升。\n\
  \n尽管非易失性 IMC 似乎是面向未来数据导向存储和计算系统的有前景解决方案，但近期新兴 ReRAM 因以下未解决的挑战仍处于起步阶段：\n\n*   **电路层面**：尽管存在一些模拟器可执行混合\
  \ NVM-CMOS 电路仿真 [63,64]，基于 ReRAM 的计算操作尚未完全开发。缺乏 ReRAM 上详细的 IMC 实现，难以在基于 ReRAM 的非易失性存内加速器上运行真实应用。\n\
  *   **架构层面**：需探索存内架构的详细实现。传统内存控制器不适用于基于 ReRAM 的 IMC 系统。基于 CMOS 的控制总线及其通信协议需为这种新型架构重新定义。\n\
  *   **系统层面**：需找出哪些 ML 算法可映射到存内加速器。针对不同操作或算法，需设计不同加速器以实现更高并行性和更好能效。\n\n\n\n本书阐述了探索基于\
  \ ReRAM 的逻辑运算与 NVM 存内计算架构的发展思路，以及将各类 ML 算法映射到此类架构上的具体细节。针对基于 ReRAM 的 IMC 实现，目标是开发\
  \ ReRAM 上不同运算的详细映射。我们提出了两种用于运算加速的基于 ReRAM 的结构：`ReRAM-crossbar`和`ReRAM oscillator\
  \ network`。特别是，本书总结了以下进展：\n\n*   首先，`NVM-SPICE`用于电路级仿真。介绍了漂移型 ReRAM 的模型及其仿真结果。此外，还展示了成形、置位（SET）和复位（RESET）过程的测量结果。对于扩散型\
  \ ReRAM，则采用子电路模型进行仿真。\n\n*   其次，我们引入了一种用于矩阵-向量乘法的二值`ReRAM-crossbar`。由于 ReRAM 器件的非均匀性，所提出的二值`ReRAM-crossbar`相比传统模拟方式的`ReRAM-crossbar`能实现更精确的计算。此外，还讨论了三种交叉阵列结构，包括无源阵列、一晶体管一\
  \ ReRAM（`1T1R`）和一选择器一 ReRAM（`1S1R`）。\n\n*   第三，我们描述了一种基于 ReRAM 的耦合振荡器网络，用于 L2-范数计算。基于扩散型\
  \ ReRAM 的开-关切换或漂移型 ReRAM 的成形过程，可以构建一个简单的振荡器。当基本振荡器形成网络时，根据拟合的仿真结果，它可以执行 L2-范数计算。\n\
  \n对于存内加速器，目标是确定架构设计。对于仅以 ReRAM 作为计算引擎的架构，我们详细设计了辅助 CMOS 逻辑，并定义了处理器与存储器之间的通信协议。对于同时以\
  \ ReRAM 和 CMOS 作为计算引擎的架构，我们开发了 3D CMOS-ReRAM 架构，通过引入以下两个主题，可实现更高的吞吐率和并行度：\n\n* \
  \  首先，描述了一种分布式存内计算架构（`XIMA`）。除了传统的存储和加载指令外，我们还定义了两条新指令：`start`和`wait`。此外，所有逻辑块和数据块均成对构建，以最大程度减少数据处理通信延迟。指令队列和解码器等\
  \ CMOS 逻辑也已设计完成。\n\n*   其次，展示了 3D CMOS-ReRAM 架构的设计空间探索。对于单层 3D 架构，ReRAM 器件通过过孔连接顶层字线（WLs）和底层位线（BLs）。所有其他\
  \ CMOS 逻辑均实现于底层。对于多层 3D 架构，我们分别使用两个 ReRAM 层作为数据缓冲和逻辑实现。此外，利用`TSVs`连接不同层。\n\n对于基于\
  \ ReRAM 架构的数据分析映射，目标是专注于针对特定应用的加速器详细设计。此外，算法需要经过优化，以便所有运算均可完全映射到加速器上。我们在分布式存内架构（`XIMA`）和\
  \ 3D CMOS-ReRAM 架构上，通过多个 ML 算法的案例研究，展示了带宽和能效的显著提升。\n\n*   首先，针对`XIMA`，我们加速了三种 ML\
  \ 算法。单层前馈神经网络（`SLFN`）的学习和推理过程已被优化并部分映射到无源二值`ReRAM-crossbar`上。此外，我们将二值卷积神经网络（`BCNN`）分别映射到无源阵列和`1S1R`阵列上，并采用了不同的映射方案。而且，基于\
  \ L2-范数梯度的学习和推理也在同时包含交叉阵列和耦合振荡器的 ReRAM 网络上实现。\n\n*   其次，针对 3D CMOS-ReRAM 架构，我们也映射了优化后的`SLFN`算法。学习和推理阶段的所有运算均已实现，从而实现在线学习。此外，张量化神经网络（`TNN`）分别映射到单层和多层加速器上，并采用不同的映射方案。\n\
  \n对于映射到`XIMA`和 3D CMOS-ReRAM 加速器上的每一种 ML 算法，我们均在器件、架构和系统三个层面评估其性能。所有实现均展现出更高的吞吐率、带宽和并行度，且具有更好的能效。\n\
  \n### 1.3 本书组织\n\n本书涵盖了从器件、架构、学习算法到系统视角的新兴 ReRAM 全流程内容。具体章节安排如下。第一章介绍了部署 ML 算法进行数据密集型计算的必要性与动机，同时也介绍了\
  \ ML 处理面临的硬件挑战与需求。第二章介绍了可支持 IMC 的新兴存储器件，并阐述了 IMC 的必要性。此外，还对不同的 IMC 架构进行了全面的比较与分析。这些架构包括从传统\
  \ DRAM 到 ReRAM、忆阻器等新兴器件。第三章介绍了 ReRAM 器件建模，随后阐述了主要用于 ML 应用中矩阵乘法的交叉阵列结构设计。此外，还介绍了\
  \ ReRAM 的多比特存储设计以及基于 ReRAM 的其他逻辑功能单元。\n\n第四章提供了 ML 算法的基本信息、计算复杂度及涉及的运算类型，包括最小二乘法（支持向量机`SVM`、极限学习机`ELM`）和深度学习（`CNN`、`TNN`）。本章将讨论训练量化（二值、三值、八位等）。此外，本章重点关注深度`CNN`和`TNN`的训练机制，因为它们是耗时操作，且性能取决于训练效率。\n\
  \n第五章介绍了将 ML 设计映射到硬件加速器的多种策略。展示了基于`ReRAM crossbar`的 IMC 架构设计以加速 ML 应用。此外，为适应深度神经网络（`DNNs`）和`CNNs`，引入了基于\
  \ 3D 堆叠的 CMOS-ReRAM 架构。本章的主要重点在于架构层面和电路设计，以高速支持数据密集型计算。第六章介绍了将 ML 应用映射到 ReRAM 的技术，以及主要挑战和改进空间。阐述了不同\
  \ ML 算法在不同架构（如传统 2D 和 3D 架构下的`ReRAM cross`）上的映射技术。\n\n展示了不同场景下基于 ReRAM 的 ML 加速案例研究。第七章介绍了不同场景下的`ResNet`，如带量化的`DNN`、基于\
  \ ReRAM 加速的`ResNet`。除`ResNet`外，本书第八章还介绍了基于 ReRAM 的压缩感知应用加速器。这部分展示了迭代启发式算法和行生成算法等不同场景。所有案例研究章节均包含大量实验结果与分析，有助于复现实验，并证明了\
  \ ReRAM 加速器的高效性及其在未来硬件加速器设计中的显著地位。最后一章总结了 ReRAM 加速器及其对 ML 应用的影响。此外，还展望了利用 ReRAM\
  \ 器件进一步增强 ML 计算的未来方向。\n\n## 第 2 章\n\n### 存内计算的必要性\n\n### 2.1 简介\n\n\n\n1974 年，Dennard\
  \ 预测随着晶体管特征尺寸的缩小，开关功耗将随之降低[68]，这一趋势在 2004 年前后终止。尽管晶体管尺寸持续缩小，但由于漏电流的增加，晶体管的工作电压和电流降低陷入停滞。工作频率的提高和晶体管密度的增加进一步加剧了计算系统的功耗，产生大量热量并阻碍了能效。功耗的另一个挑战源于传统冯·诺依曼或普林斯顿计算架构中数据处理单元与存储单元之间密集的数据传输，即所谓的“存储墙”。在这种计算范式中，由于数据和指令都存储在同一存储空间，计算单元在某一时刻只能处理一个任务并等待存储器更新其结果，这极大地限制了吞吐量并导致空闲功耗。尽管缓存和分支预测等机制可以部分消除这些问题，但“存储墙”仍然是现代处理器技术中海量数据交换面临的重大挑战。\n\
  \n为突破“存储墙”，存内计算自 2000 年代起便被研究，并被视为减少存储器与处理单元间冗余数据移动、降低功耗的有前景途径。该概念已通过不同硬件工具实现，例如三维堆叠动态随机存取存储器（DRAM）[69]和嵌入式\
  \ FLASH[70]。剪枝、量化和混合精度拓扑等软件解决方案被实施以减少信号交换的强度。\n\n生物神经网络（NN）在能效方面优于基于中央处理器（CPU）或图形处理器（GPU）的传统冯·诺依曼计算架构，在执行密集并行计算时，每个突触事件仅消耗\
  \ 1–100 fJ [71,72]。目前，突触阻变随机存取存储器（ReRAM）已成功展现出低功耗（(<pJ)）特性[73]。然而，即使是两款最有前景的全基于\
  \ CMOS 的类脑芯片——英特尔的 Loihi 和 IBM 的 TrueNorth，在能效方面仍落后于生物神经网络，每个突触事件分别消耗 23.6 和 26\
  \ pJ [74,75]。类脑计算通过模拟器件中的突触动力学以及神经网络中的数据流/连接，实现低功耗计算。突触事件由存储器件中的离子通量直接监测并精确调节，已在基于\
  \ ReRAM 的系统中成功仿真[73]。如图 2.1 所示[77]，与传统冯·诺依曼计算架构相比，类脑计算架构拥有复杂度更低的外围驱动电路和更简单的权重修改过程（例如快速点积运算[76]）。类脑计算还强调对系统级神经架构的模仿，例如人工神经网络（ANN）[78]、卷积神经网络（CNN）[79]、脉冲神经网络（SNN）[75,80]和循环神经网络（RNN）[81]。与通用处理器不同，神经网络是为特定应用场景构建的。例如，CNN\
  \ 具有分离的层和模块化的内核，可实现快速准确的特征识别；RNN 的循环输出使其适合语音识别；SNN 是一种事件驱动系统，更加灵活且容错性更强。基于专用类脑计算架构的片上系统（SoC）在功耗方面通常比基于传统冯·诺依曼架构的系统低几个数量级。例如，基于异步\
  \ SNN 的英特尔 Loihi 芯片[75]在能效和面积效率方面均比单个 CPU 高出三个数量级。\n\n![image](img/PBPC0390-02-f01.jpg)\n\
  \n图 2.1 PCM 对神经元的仿真，以及生物突触[88]和 PCM 的脉冲时间依赖可塑性\n\n基于冯·诺依曼架构和 Si CMOS 技术的传统计算机系统，虽然数据处理速度更快、计算精度远高于人脑，但在功耗方面仍显著落后。例如，谷歌开发的有监督深度学习机器\
  \ AlphaGo，由多达 1,202 个 CPU 和 176 个 GPU 组成，击败了围棋世界冠军，但其能耗是人脑的 1,000 倍。类脑计算算法的最新进展，涉及有效解决类似人脑的复杂任务，如模式识别、数据分类和目标检测，使其接近实际应用。然而，基于\
  \ Si CMOS 技术出于并行性和权重自适应原因对这些类脑计算算法的硬件实现，在计算、存储和通信方面带来了巨大挑战，并导致高功耗。在类脑计算系统的硬件实现方面取得突破显得极为迫切。\n\
  \n### 2.2 类脑计算器件\n\n随着当今计算变得越来越数据密集，计算范式正从以计算为中心转向以数据为中心。类脑计算（例如向量矩阵乘法）要求器件具备线性对称调谐、长保持时间、低随机行为（盲更新）和低能量调谐等特性。新兴非易失性存储器（NVM）有望满足这些要求，例如瞬时写/读（~ns）、低工作电压（<1\
  \ V）和低功耗（<pJ/突触事件）[82]。此处我们简要描述 ReRAM、自旋扭矩转移磁性随机存取存储器（STT-MRAM）和相变存储器（PCM）的工作机制。\n\
  \n广泛使用的静态随机存取存储器（SRAM）和动态随机存取存储器（DRAM）通过电荷存储信息，需要持续的工作电压波来通过给电容充放电以维持或更新其状态。作为新兴\
  \ NVM 的 ReRAM 是非基于电荷的器件，摆脱了电容存储数据的限制。较小的工作电压（<1 V）足以驱动 ReRAM 运行，且维持状态无需后续功耗。\n\n\
  当今的深度学习应用需要前所未有的海量数据进行动态数据分析。传统 CPU/GPU 必须通过编程程序从缓存存储器获取数据，这通常因缺乏有用数据而导致处理器待机。由于数据交换在延迟和功耗方面代价高昂，最直接的优化方法是数据本地化，即最小化处理器与缓存之间的物理距离。ReRAM\
  \ 与 CMOS 具有良好的兼容性，使其成为三维堆叠的理想选择。三维堆叠 ReRAM 可安装在处理器顶部，凭借其厚度优势缩短数据传输路径并实现高密度存储。三维堆叠\
  \ ReRAM 存储器可大幅减少数据传输、扩大数据复用，并最终提高能效。与当前主流存储器相比，STT-MRAM 在单元尺寸和能效上优于 SRAM，ReRAM 在功耗、读写速度和耐久性上优于\
  \ FLASH。在 STT-MRAM 中，保持时间与工作或开关功耗存在权衡。与其他保持时间超过 10 年的 NVM 器件不同，STT-MRAM 的保持时间与激励脉冲呈一一对应关系。作为\
  \ RAM 的替代品，STT-MRAM 的长保持时间与性能无关，因此可降低保持时间（例如至秒级）以实现更低功耗。\n\n\n\n\n# 2.2 神经形态计算用非易失性存储器件\n\
  \n作为存储器，读/写操作对计算至关重要。与传统的状态保持单元不同，ReRAM 可以在交叉阵列中分别进行读出和调制，且具有高功率效率。因为在读/写过程中，例如一晶体管一\
  \ ReRAM (`1T1R`) 结构，只有目标单元被选中，而所有其他单元保持空闲。\n\n#### 2.2.1 电阻式随机存取存储器\n\nReRAM 的电阻切换特性最早于\
  \ 20 世纪 60 年代被研究 [82]。ReRAM 的器件结构是一种三明治状结构，即两个金属电极之间夹着一层绝缘材料。它包括顶电极 (`TE`)、中间的氧化物层和底电极\
  \ (`BE`)。通常，ReRAM 是两端器件，具有两种电阻状态：高电阻状态 (`HRS`，或 OFF 状态) 和低电阻状态 (`LRS`，或 ON 状态)。电阻状态通过施加的电位和刺激持续时间来控制。电阻切换机制是由于氧空位的产生和漂移，导致金属氧化物中导电丝的形成/断裂。它在\
  \ `SET`/`RESET` 过程中表现出对称行为或李萨如 `I/V` 曲线。非基于电荷的 ReRAM 具有长期可塑性特征，能在一定周期内保持权重（电导）稳定，即使没有循环工作电源。\n\
  \nReRAM 的 `I–V` 特性根据公式 (2.1) 表示：\n\n![image](img/ch02_stripin_si61.gif)\n\n其中 ![image](img/ch02_stripin_si7.gif)(∼1\
  \ mA)、![image](img/ch02_stripin_si9.gif)(∼0.25 nm) 和 ![image](img/ch02_stripin_si11.gif)(∼0.25\
  \ V) 为由材料属性决定的常数。`HRS` 电阻与距离 (![image](img/ch02_stripin_si13.gif)) 呈指数相关，且具有大量的\
  \ ![image](img/ch02_stripin_si14.gif)(![image](img/ch02_stripin_si15.gif)0.5 V)。ReRAM\
  \ 电阻不仅响应电刺激，还取决于施加刺激的持续时间，如公式 (2.2) 所示：\n\n![image](img/ch02_stripin_si62.gif)\n\
  \n其中 ![image](img/ch02_stripin_si16.gif) 为空位产生速率，由产生率与复合率的差异决定。ReRAM 的数学模型类似于生物突触，并表现出超低功耗计算的非易失性行为\
  \ [83, 84]，这使得 ReRAM 成为神经形态计算构建模块的理想候选者。尖峰时间依赖可塑性，作为阵列级神经形态计算（如 `SNN`）中生物突触的关键特征，已在\
  \ ReRAM 中得到成功演示 [85]。\n\n作为一种两端非易失性器件，ReRAM 交叉阵列在功率效率和切换速度方面具有固有优势。当 ReRAM 交叉阵列通过\
  \ `CMOS` 集成大规模制造时，ReRAM 器件在每个交叉点处被两根垂直的电极线夹在中间。因此，纳米级 ReRAM 的矩阵式密集阵列相对容易实现。由于非易失性和两端特性，ReRAM\
  \ 实现了存内计算 (`IMC`) 且仅需极小的工作电压，基于 ReRAM 交叉阵列的处理单元在能耗、可扩展性和处理速度方面均优于采用传统冯·诺依曼架构的 `CPU`\
  \ 或 `GPU`。\n\n#### 2.2.2 自旋转矩磁阻随机存取存储器\n\n`STT-MRAM` 包含三层形成磁隧道结 (`MTJ`)：用于数据存储的自由层、用于参考的钉扎层，以及用于磁绝缘和数据读取过程的隧道势垒层\
  \ [86, 87]。隧道势垒定义了 `ON` 和 `OFF` 状态切换的能垒 (![image](img/ch02_stripin_si17.gif))。自由层的磁场方向决定了存储单元的电阻。当自由层和隧道层的磁矩平行时，`STT-MRAM`\
  \ 表现为低电阻。`STT-MRAM` 在反平行构型下表现为 `HRS`。通过向自由层引入相反的磁场，`STT-MRAM` 可表现出多个电阻状态 [87]。一个绝缘畴壁被放置在两个相反的磁畴之间，并由\
  \ `STT` 现象调节。由于保持时间与 ![image](img/ch02_stripin_si18.gif) 和切换功耗相关，`STT-MRAM` 在所有\
  \ `NVM` 中具有最小的功耗，并凭借其充分利用的非易失性实现了高工作速度。\n\n#### 2.2.3 相变存储器\n\n在 `PCM` 中，从 `HRS`\
  \ 到 `LRS` 的转变表现为切换层从非晶态到晶态的相变。在 `RESET` 过程中，晶态相变材料通过电产生的热熔化为非晶相。将相变材料 `SET` 回 `LRS`\
  \ 只需要较小的电流。\n\n与 `SRAM` 和 `FLASH` 相比，`NVM` 器件在数据存储方面表现出耐久性、功耗和速度上的巨大优势。基于 ReRAM\
  \ 的混合系统可同时作为存储器和处理器工作，从而消除冗余数据移动。随着点积引擎 [76, 89] 的推动，ReRAM 阵列仅利用欧姆定律和基尔霍夫电流定律，即可在极短时间内解决某些复杂任务，例如矩阵的乘法与求和运算。\n\
  \n`PCM` 具有与 ReRAM 相似的突触可塑性。与其他 `NVM` 器件相比，`PCM` 具有相对较大的电阻切换范围，使其成为每个事件调制尺度为 1% 的突触模拟计算的理想选择。通过使用幅度逐渐增加和持续时间定制的刺激脉冲，据报道\
  \ `PCM` 从 `LRS` 到 `HRS` 拥有超过 200 个调节电平 [90]。如 图 2.1 所示，`PCM` 的可塑性或权重更新具有时间依赖性。前/后突触事件的不同到达时间决定了调制方向。类似于神经突触，`PCM`\
  \ 对一连串连续尖峰表现出累积行为，可按公式 (2.3) 描述：\n\n![image](img/ch02_stripin_si63.gif)\n\n其中 ![image](img/ch02_stripin_si19.gif)\
  \ 为待更新的突触权重，![image](img/ch02_stripin_si20.gif) 为前/后突触事件到达时间的方差，![image](img/ch02_stripin_si21.gif)\
  \ 为缩放因子，![image](img/ch02_stripin_si22.gif) 代表 `STDP` 曲线的常数。与 `CMOS` 和基于电容的突触器件相比，基于\
  \ `PCM` 的突触表现出更低的功耗，`RESET` 和 `SET` 过程分别仅消耗 ∼50 和 0.675 pJ，且随着 `PCM` 器件尺寸缩小可进一步降低。但\
  \ `CMOS` 和基于电容的突触器件为正常功能运行，每个突触事件需消耗 ∼10^(−9) J [91]。\n\n### 2.3 神经形态计算用 NVM 器件的特性\n\
  \n用于计算的神经形态器件的理想特性包括线性/对称调谐、可扩展性、多电平电阻状态、长保持时间、随机行为和低能耗。\n\n1. **线性/对称调谐**：由于权重更新遵循时间依赖机制，权重载体与刺激脉冲之间的线性和对称关系有助于减少计算操作和功耗。上述大多数\
  \ `NVM` 具有相对线性的 `I/V` 电学特性。例如，通过施加一串持续时间变化的脉冲，可以增强 `TaO[x]`/`TiO[2]` ReRAM 的线性度，如\
  \ 图 2.2 所示。\n\n2. **可扩展性和可堆叠性**：存储器件的向下缩放实现了高密度集成。大多数 `NVM` 器件已成功制造在约 10 nm 尺度水平。为进一步提高集成密度并缩短存储与处理之间的距离，新兴\
  \ `NVM` 器件以三维 (`3D`) 堆叠方式实现并嵌入处理器中。\n\n\n\n\n\n#### 3. 多电平电阻状态\n\n由于生物突触中的权重以模拟形式处理，因此类脑器件需要多电平电阻状态。大量生物启发式算法需要多电平状态，而非推断出的\
  \ 0/1 状态 [92]。\n\n#### 4. 长时间保持\n\n在计算实现过程中，权重的持续更新对保持时间的要求有限。但在操作完成后，需要 NVM 的长保持时间，以确保即使\
  \ NVM 器件切换到空闲状态（断电），存储的权重仍然保留。因此，由于基于 NVM 的系统不再需要权重的全局更新，可以节省额外的功耗。\n\n#### 5. 低随机隧穿\n\
  \nNVM 仍然面临器件变异和切换模糊性的问题，例如 ReRAM 和 PCM 中电阻的骤降。NVM 的随机切换特性仍是一个开放的研究课题，并阻碍了商业应用。最近有一些关于神经网络\
  \ [92, 93] 的研究，显示出对器件变异的强鲁棒性。然而，此类神经网络在架构和精度上有所妥协。\n\n![image](img/PBPC0390-02-f02.jpg)\n\
  \n图 2.2 用于改善线性度的 TaO^x/TiO² ReRAM 刺激脉冲调制 [92]\n\n### 2.4 面向机器学习的 IMC 架构\n\n因此，针对替代性非冯·诺依曼计算机架构（如存内计算和近存计算）的研究日益增多，旨在克服传统冯·诺依曼架构面临的现有挑战\
  \ [20, 94]。IMC 或存内处理 (PIM) 通过在存储芯片内部实现处理单元，弥合了存储器与处理器之间的分离 [95, 96]。受限于存储芯片的制造工艺，这些处理元件只能实现有限的功能\
  \ [97]。然而，它们可以利用存储芯片内部的位线级并行性，构建大规模并行的单指令多数据流 (SIMD) 式处理架构，同时也享受通过存储位线实现的超高带宽和低延迟数据通信。IMC\
  \ 成为实现机器学习应用的可行候选者，最重要的是 CNN 算法，因为在 GPU 和 CPU 上实现时，仅卷积操作就占据了 CNN 计算时间最大的比例 [94,\
  \ 98]。IMC 架构可在 CNN/DNN 应用中实现无与伦比的能效下的显著性能优化。\n\n过去十年间，大量研究致力于在不同存储平台上设计 CNN/DNN\
  \ 推理和训练机器，包括传统的 SRAM 和 DRAM 存储平台，以及新型非易失性电阻式 RAM (ReRAM)、PCM 和 MRAM，如 STT-MRAM 和自旋轨道扭矩\
  \ MRAM (SOT-MRAM) 技术。研究发现，即使在 CNN 算法中对数据参数执行各种级别的量化/降级，仍可保持令人满意的精度水平 [93–103]。这为物联网和移动应用的高性能、低功耗\
  \ CNN 实现开辟了探索空间。IMC 范式也在利用这种数据降级技术 [94, 103–111]。\n\n鉴于存储技术在 IMC 系统设计中的重要性，我们首先根据\
  \ IMC 所基于的存储技术对 IMC 架构进行分类。存储技术可分为传统存储器 (SRAM 和 DRAM) 和新兴存储器 (ReRAM、STT-MRAM 和 SOT-MRAM)。下文将提供基于存储技术的\
  \ IMC 相关最新工作。\n\n#### 2.4.1 IMC 架构的操作原理\n\n##### 2.4.1.1 宏内操作方案\n\nIMC 的基本原理是在存储器件/宏中执行计算，实现方式多种多样。一般来说，文献中大多数\
  \ IMC 实现可归纳为四种方案，如 图 2.3 所示。\n\n![image](img/PBPC0390-02-f03.jpg)\n\n图 2.3 IMC 方案\n\
  \n图 2.3(a) 展示了最常见的 IMC 方案。用户必须先将操作数 2 写入存储器件和阵列，然后将操作数 1 转换为输入信号。在此方案中，操作数 1 可极快变更，而操作数\
  \ 2 需保持在存储器中。大多数文献将权重映射为操作数 2，将特征图映射为操作数 1，以加速神经网络应用。因为该方案不要求高耐久性，所以适用于包括 SRAM、ReRAM、PCM、Flash\
  \ 等在内的各种存储器件。\n\n图 2.3(b) 中的方案更像是“存旁计算”而非存内计算。在此方案中，操作数 1 和 2 最初均存储在寄存器中（存储阵列外部）。它们需要先被写入存储阵列，然后外围电路产生特定波形使存储器执行计算。之后，需要感测放大器等电路进行结果读出。该方案有潜力替代传统的\
  \ CMOS 数字逻辑电路。\n\n在 图 2.3(c) 中，基本假设是操作数 1 和 2 都预先存储在存储阵列内部。这通常发生在冯·诺依曼架构基于 SRAM\
  \ 的缓存中：上一层的特征图和本层的权重存储在同一缓存中，用户希望在将所有数据发送给处理器前进行一些预处理。\n\n图 2.3(d) 中的方案展示了 IMC 的终极构想：两个操作数最初都存储在存储器内部，计算过程结束后结果将自动写入存储器。该方案统一了输入和输出的数据格式，就像最先进\
  \ CMOS 逻辑的电压电平表示一样。\n\n##### 2.4.1.2 面向操作方案的架构\n\n从架构角度来看，图 2.3 中的操作方案适用于不同的架构。数据流式\
  \ [112] 和缓存式架构 [113] 是 IMC 最常见的两种架构。这两种架构可简化如 图 2.4 所示。显然，数据流式架构适合 图 2.3(a) 中的方案，而缓存式架构适合\
  \ 图 2.3(b) 和 (c) 中的方案。\n\n![image](img/PBPC0390-02-f04.jpg)\n\n图 2.4 IMC 通用架构：(a)\
  \ 数据流架构；(b) 缓存架构\n\n作为深度神经网络 (DNN) 硬件加速器，我们可以发现数据流式架构可用于 CNN 和多层感知机 (MLP)，它们需要对大型矩阵进行乘累加\
  \ (MAC) 运算。缓存式架构更适合大量迭代的小型矩阵运算，如 RNN、门控循环单元 (GRU) 和长短期记忆网络 (LSTM)。\n\n在以下章节中，我们将主要讨论\
  \ 图 2.3(a) 中的宏内方案和 图 2.4(a) 中的数据流式架构。\n\n#### 2.4.2 IMC 的模拟与数字化方式\n\n为在存储器内部执行计算，计算电路应在存储宏中定制。从存储设计者的角度来看，普通存储宏中的操作方案可概括为三个步骤：\n\
  \n*   步骤 1：在数字域接收读/写命令和地址；\n*   步骤 2：在模拟域预充电位线、使能字线、采样存储单元电压 (SRAM) 或测量电阻 (NVM)；\n\
  *   步骤 3：利用感测放大器执行读出操作，在数字域输出结果。\n\n\n\n\n即使在普通的存储宏访问过程中，部分流程也是在模拟域中完成的。因此，存内计算的关键在于在模拟域中执行不同的操作。在大多数文献中，这是通过同时启用多条字线或位线来实现的。图\
  \ 2.5 展示了普通存储宏与存内计算宏的对比。\n\n![image](img/PBPC0390-02-f05.jpg)\n\n图 2.5 (a) 启用一条字线的普通存储宏；(b)\
  \ 启用多条字线的存内计算宏的对比\n\n接下来，我们将讨论模拟和数字化存内计算的详细实现。我们可以根据以下条件大致对模拟和数字化方式进行分类：\n\n*  \
  \ **输入分辨率**：输入数字信号可以直接使用，也可以转换为模拟信号。\n*   **存储器件分辨率**：存储器件可用作单电平单元（`SLC`）或多电平单元（`MLC`）。\n\
  *   **读出准确性**：计算操作在模拟域中执行，电路可以准确或不准确地将其读出。\n*   **输出分辨率**：输出信号可通过 `ADC`/`量化器` 进行多位读出，或通过\
  \ `SA`/`比较器` 进行单位读出。\n\n我们还在表 2.1 中总结了模拟和数字化存内计算方式。在该分类中，只有当使用数字（二进制）输入、`SLC` 器件、准确读出和数字输出时，存内计算方式才能被称为“数字化”。\n\
  \n表 2.1 模拟和数字化存内计算的分类\n\n![image](img/tab2.1.jpg)\n\n#### 2.4.3 模拟存内计算\n\n#####\
  \ 2.4.3.1 模拟 MAC\n\n**用于乘法的模拟存内计算：** 模拟存内计算最常见的方案在电流域中执行计算。图 2.6 展示了模拟存内计算中乘法的两种方案。图\
  \ 2.6(a) 假设存储器件可作为双端电阻工作，从而形成电压输入-电流输出的计算方案。相反，图 2.6(b) 假设存储器件可作为三端类晶体管器件工作，从而形成电流输入-电流输出的计算方案。显而易见，这两种工作方案适用于不同的存储器件。\n\
  \n![image](img/PBPC0390-02-f06.jpg)\n\n图 2.6 存储器件中的模拟乘法：(a) 电压输入-电流输出方案；(b) 电流输入-电流输出方案\n\
  \n**用于 MAC 的模拟存内计算：** 大多数文献如图 2.7 所示，执行类似传统模拟加法器设计的 MAC 操作。这里我们以图 2.6(a)中的电压输入-电流输出方案为例。每个输入信号被转换为模拟电压，并与存储器件的值（表征为电阻）执行乘法。此处乘法结果由电流表示。乘法之后，利用\
  \ `Opamp` 和反馈电阻或跨阻放大器（`TIA`）对所有电流求和。因此，输出电压可以用以下公式表示：\n\n![image](img/ch02_stripin_si64.gif)\n\
  \n![image](img/PBPC0390-02-f07.jpg)\n\n图 2.7 基于 Opamp 求和电路的模拟存内计算矩阵乘累加操作\n\n如果 ![image](img/ch02_stripin_si30.gif)、![image](img/ch02_stripin_si31.gif)\
  \ 和 ![image](img/ch02_stripin_si32.gif) 由存储器件实现，我们就可以通过存储器件实现模拟计算。该计算方案可从器件扩展到阵列或宏，如图\
  \ 2.8 所示。\n\n![image](img/PBPC0390-02-f08.jpg)\n\n图 2.8 基于 Opamp 求和电路的模拟存内计算\n\n\
  除了上述基于电流域的存内计算外，还提出了基于时域的模拟存内计算 [114] 和基于电荷域的模拟存内计算 [115]。然而，由于这两种方案主要利用存储阵列外部的电路来执行计算，本书将不再详细讨论它们。\n\
  \n##### 2.4.3.2 级联存内计算宏\n\n计算在图 2.6 所示的电压输入-电流输出或电流输入-电流输出方案中执行。如果我们想按常规方式设计，即使存内计算宏成为通用处理核，则需要数模转换器（`DACs`）和模数转换器（`ADCs`）用于输入和输出，这会消耗大量功耗。然而，如果我们想要一个专用处理器核，可以串联多个存内计算核以获得更高的能效，如图\
  \ 2.9 所示。\n\n![image](img/PBPC0390-02-f09.jpg)\n\n图 2.9 级联存内计算宏：(a) 每个阵列配备 DAC 和\
  \ ADC；(b) 多个阵列共用 DAC 和 ADC\n\n显而易见，图 2.9(a) 在架构层面更灵活。用户可以在阵列之间执行不同操作，如浮点乘法、求和、除法和非线性激活函数（Tanh、Sigmoid\
  \ 等），用于机器学习算法。但对于图 2.9(b)，它只能支持层间有限的激活函数，如 ReLU。此外，模拟计算误差将累积直到使用 `ADC`，导致全模拟域中无法使用误差校正。\n\
  \n如果直接考虑级联，图 2.6(b)中的电流输入-电流输出方案优于图 2.6(a)中的电压输入-电流输出方案，因为它具有统一的输入输出表示。对于后者，每个阵列仍需\
  \ `TIA` 进行电流-电压转换。\n\n##### 2.4.3.3 模拟存内计算的位单元与阵列设计\n\n本节我们将讨论位单元和阵列设计，它们极大地影响存内计算方案的可行性和竞争力。然而，许多工作中忽略了这些方面。例如，标准模拟设计规则下（缩小前）定制\
  \ `SRAM` 位单元的尺寸可具有更小的晶体管变异，从而在仿真或测试片测量中获得更好的精度性能。然而，它可能比晶圆厂的位单元（缩小后）大 2 到 3 倍。例如，[116–119]\
  \ 中的工作直接使用晶圆厂的 `SRAM` 位单元或在紧凑规则下略微修改布局，从而在与传统架构对比时具有面积竞争力。\n\n至于 `RRAM`、`PCM` 和\
  \ `MRAM` 等新型存储器，由于通常在逻辑工艺中使用 `1T1R` 或 `1T1M`，位单元设计可能不是存内计算的问题。然而，如果使用多电平输入，阵列布局设计可能与晶圆厂用于存储的设计不同，如图\
  \ 2.10 所示。\n\n![image](img/PBPC0390-02-f10.jpg)\n\n图 2.10 1T1R 阵列对比：(a) 平行源线和位线；(b)\
  \ 垂直源线和位线\n\n图 2.10(a) 是平行源线-位线方案，图 2.10(b) 是垂直源线-位线方案。对于更高能效和吞吐率的存内计算核设计，大多数工作采用垂直方案，因为它支持模拟电压输入。然而，该方案存在一些挑战。首先，该方案在输入端需要\
  \ `DACs`，导致额外的功耗。同时，该 `DAC` 应具有大驱动能力，因为流过存储器件的所有电流都来自 `DAC`。在这种情况下，设计一个既具高分辨率又具大输出电流的\
  \ `DAC` 具有挑战性。其次，由于阵列需要执行并行编程，`IR` 压降可能引发一些问题。例如，一行中的最后一个单元可能无法完全编程。然而，对于图 2.10(a)中的平行源线和位线方案，每条源线和位线只需编程一个器件。因此，不太可能出现器件编程问题。\n\
  \n\n\n正如我们所观察到的，大多数工作采用图 2.10(b)中的垂直方案，而文献 [120, 121] 的工作采用图 2.10(b)中的并行方案。\n\n\
  ##### 2.4.3.4 模拟 IMC 的外围电路\n\n模拟 IMC 宏的简要概览如图 2.11 所示。它由数字输入缓冲器、输入电路、存储阵列、读出外围电路、数字控制器、编程电路和输出缓冲器组成。\n\
  \n*   数字输入模块接收来自 IMC 核外部模块的命令和数据，它需要执行两项任务：(1) 缓冲输入数据并发送至输入外围电路；(2) 解析命令并发送至存算一体（CIM）数字控制器。\n\
  *   输入外围电路将输入数据转换为具有强驱动能力的模拟电压，并执行采样保持（如果使用时分复用）。\n*   CIM 数字控制器是核心模块，它决定 CIM 核的模式（编程、校验、计算、测试等），输入外围电路将输入数据转换为具有强驱动能力的模拟电压，执行采样保持（如果使用时分复用），并执行重要的控制功能（如对\
  \ MLC 器件编程的脉冲宽度和幅度）。\n*   编程外围电路产生编程和计算所需的电压信号。对于 SRAM，它可以简化为写驱动器，但对于 RRAM 或 NOR\
  \ Flash，可能会用到电荷泵和低压差线性稳压器。此外，如果编程过程需要 MLC，则需要具有修整器或 DAC 以产生非常精确的电压或电流。\n*   读出外围电路侧重于如何测量输出电流或电压信号。它应具备高精度、大动态范围和快速读出能力。\n\
  *   数字输出模块充当输出缓冲器，并在必要时向外部发送警报信号。\n\n![image](img/PBPC0390-02-f11.jpg)\n\n图 2.11\
  \ 基于运算放大器求和电路的模拟 IMC\n\n##### 2.4.3.5 模拟 IMC 的挑战\n\n尽管模拟 IMC 已展现出作为机器学习低功耗高吞吐量解决方案的巨大潜力，但仍需在某些方面克服若干挑战。\n\
  \n首先，在架构层面，IMC 核只能用作 MAC 运算的加速器。因此，它仅能为海量 MAC 运算的应用展现最佳优势。然而，一些大规模机器学习算法并非全是 MAC\
  \ 运算，而是包含一些激活和除法运算。此外，IMC 核擅长大规模 MAC，即 ![image](img/ch02_stripin_si33.gif)。如果矩阵维度仅为\
  \ ![image](img/ch02_stripin_si34.gif)，其能效可能不如 GPU 或张量处理单元 (TPU)。而且，IMC 的架构灵活性不如通用处理器。\n\
  \n其次，在应用层面，大多数高吞吐量场景要求训练和推理都具备极强的计算能力。IMC 在推理阶段展现了其高吞吐潜力，但耐久性和写入速度成为训练阶段的瓶颈。因此，大多数公司或初创企业倾向于在边缘设备中使用\
  \ IMC。\n\n第三，模拟计算中的精度损失难以评估。据我们所知，模拟 IMC 包含以下误差来源：\n\n*   输入误差：DAC 中发生的误差。\n*  \
  \ 器件误差：存储器件的电导或电阻变化。请注意，模拟 8 位不等于数字 8 位，模拟 MLC 会呈现特定分布，从而导致计算误差。\n*   阵列误差：由大规模阵列效应导致的精度损失，包括\
  \ IR 压降、串扰等。\n*   输出误差：ADC 中发生的误差。\n\n##### 2.4.3.6 模拟 IMC 器件的权衡\n\n我们在表 2.2 中总结了\
  \ IMC 器件的理想规格。如果一种器件能同时具备类 SRAM 的写/读速度、耐久性和开关比，类 MRAM 的导通态变异和保持特性，类 RRAM 的单元密度，以及类\
  \ NOR Flash 的分辨率和线性度，那将是完美的。\n\n表 2.2 IMC 器件的关键规格\n\n| 规格 | 理想值 | 备注与理由 |\n| ---\
  \ | --- | --- |\n| 分辨率 | 8 位或更高 | 直接决定可在 CIM 中实现何种算法 |\n| 开关比 | 1,000× 或更高 | 用于\
  \ CIM 中的“真零” |\n| 导通态变异 | ![image](img/ch02_stripin_si38.gif)1% | 用于 CIM 中的“均匀一”\
  \ |\n| 保持时间 | 10 年@125° C | 决定刷新周期 |\n| 耐久性 | 无限 | 可用于训练场景 |\n| 线性度失配 | ![image](img/ch02_stripin_si38.gif)1%\
  \ | 决定输入分辨率 |\n| 写入速度 | ~ns | 可用于训练场景 |\n| 电流密度 | ![image](img/ch02_stripin_si40.gif)A\
  \ | 降低线电阻的影响，也利于低功耗和电路易实现 |\n| 读取速度 | ~ns | 用于低延迟场景 |\n| 面积 | ![image](img/ch02_stripin_si42.gif)\
  \ | 高密度片上集成 |\n| 3D 堆叠 | 是 | 用于更高密度片上集成 |\n| 工艺 | BEOL | 可集成在先进工艺节点 |\n| 良率 | 100%\
  \ | 不适用 |\n\n然而，表 2.2 中列出的某些规格相互矛盾。例如，器件必须经过修整并经历漫长的写入-校验方案，才能编程至 8 位或更高。同样，高分辨率器件需要多电平感测电路，导致读出时间变长。\n\
  \n#### 2.4.4 数字化 IMC\n\n如表 2.1 所示，数字化 IMC 的一切都应二值化，包括输入、存储单元和输出。因此，它与普通存储阵列非常相似，只是同时启用的字线/位线数量有限。例如，文献\
  \ [113, 122] 的工作仅在存储阵列内启用两条字线。\n\n显而易见，与模拟方式相比，数字化 IMC 可获得更高的精度。此外，该方案可采用纠错码 (ECC)\
  \ 技术，且计算过程可逆。然而，显然这种方式与普通存储宏相比，仅能获得 1 到 2 倍的能效提升。\n\n#### 2.4.5 IMC 文献综述\n\nIMC\
  \ 架构基于存储节点类型、映射、访问和量化类型进行分类，如[?]所示。\n\n##### 2.4.5.1 基于 DRAM 的 IMC\n\n**AMBIT：**\
  \ AMBIT [123] 是一种 IMC，它通过简单地同时激活三个操作数行（字线），利用位线间的电荷共享执行批量按位与和或运算。此外，AMBIT 通过一种新颖机制执行非运算，该机制通过在子阵列中用双访问晶体管\
  \ (2TC1) 结构增强一行单元来实现。尽管 AMBIT 没有面向机器学习的应用领域，但它为另外两个 CNN 加速器 DRISA [104] 和 DRACC\
  \ [105] 奠定了基础。\n\n**DRISA：** DRISA [104] 是一种基于 DRAM 的原位 CNN 加速器，可在 8 位二值权重神经网络 (BWNN)\
  \ 上执行 CNN 推理。DRISA 利用早期 DRAM 的 3T1C 存储单元结构实现 NOR 逻辑，也利用常规 1T1C DRAM 单元结构实现与、或、非运算，其机制源自\
  \ AMBIT。此外，DRISA 还具备一个移位层，该层与逻辑层共同构成可重构的存内处理层，可实现选择、行波进位加法、保存进位加法及大数据上的完整乘法。DRAM\
  \ 存储器组织通过调整可并行操作的 Bank 和子阵列大小，以及在 Bank 之上增加一个称为 Group 的额外层级阶段，得到了彻底改造。\n\n\n\n\n\
  ###### DrAcc\n\nDrAcc [105] 是一个基于 DRAM 的 CNN 加速器，用于执行三元加权神经网络（TWNN）推理，其中卷积运算简化为累加（加法）。它同样遵循\
  \ AMBIT 的机制进行按位 AND/OR 逻辑运算，但其关键特性是通过修改感测放大器电路实现的先行进位加法器。借助额外的移位层，DrAcc 可以在存储器内部实现所有\
  \ CNN 层，如池化、量化-归一化和激活。此外，还提出了三种数据分区和映射策略以及三种不同的性能模式，分别提供最大吞吐量、最小延迟和最大能效。\n\n######\
  \ SCOPE\n\nSCOPE [124] 是一个原位 DNN（CNN/RNN）加速器，利用随机计算（H2D 算法）将计算密集型乘法运算简化为按位 AND 操作。它是一个批量按位\
  \ IMC/PIM 架构，可执行 AND/OR 操作。子阵列感测放大器经过修改，以支持逻辑电路、寄存器、移位器和随机数生成器单元（SNG）以进行随机转换。它能够通过组合按位逻辑运算执行保留进位加法，并支持\
  \ 8 位定点精度的 CNN 推理和训练。\n\n###### pPIM\n\n可编程 PIM（pPIM）[125] 是一种基于查找表（LUT）的新型 PIM\
  \ 架构，实现在 DRAM 芯片内部。它主要设计用于执行超低功耗和低延迟的 CNN/DNN 加速。pPIM 处理单元称为“核心”，每个核心包含一个 8 位 LUT，因此可以通过读取预计算条目来执行计算和逻辑运算。这些\
  \ LUT 可编程和重编程，几乎可以对一对 4 位操作数执行任何操作。然而，九个 pPIM 核心组成一组，通过复杂的路由结构互连形成一个“簇”。每个簇可通过遵循包含操作数分解、乘法和加法阶段的九步操作，对\
  \ 8 位数据操作数执行 MAC 等运算。得益于其可编程性，它还能执行其他 CNN/DNN 层，如全连接、激活和池化层。此外，pPIM 支持低数据精度运算，如\
  \ 4 位缩放精度 MAC。pPIM 簇排列在 DRAM Bank 的存储子阵列之间的行中。对于簇间通信，pPIM 利用存储子阵列的局部位线，并通过连接相邻子阵列位线的子阵列互连进行增强，以促进快速数据传输。pPIM\
  \ 核心主要使用传输门实现，以最小化面积开销。仿真表明，与最先进的传统处理器架构、GPU 和先前的混合 LUT-逻辑基 PIM 相比，该架构在单位功耗下的推理吞吐量分别提高了\
  \ 2,000×、657.5× 和 1.46×。此外，4 位精度缩放使 pPIM 在代表性操作上的能效比基线 8 位精度模式提高了约 1.35×。\n\n######\
  \ LAcc\n\nLAcc [98] 是一个基于 DRAM 的 PIM CNN 加速器，利用 DRAM 子阵列中的存储单元实现 LUT，存储乘法运算的预计算输出。结合在修改后的感测放大器上实现的基于\
  \ XOR 的加法器，LAcc 可执行 16 位卷积运算。由于 LUT 随操作数大小呈二次方扩展，LAcc 利用矩阵分解保持 LUT 较小。为进一步减少 LUT，它提出固定权重或输入。LAcc\
  \ 以令人印象深刻的功耗和性能指标执行 16 位精度卷积。\n\n##### 2.4.5.2 基于 NAND Flash 的 IMC\n\n###### AMBIT\n\
  \nAMBIT [123] 是一种 IMC，基于跨位线的电荷共享，通过简单地同时激活三个操作数行（字线）执行批量按位 AND 和 OR 操作。此外，AMBIT\
  \ 通过一种新颖机制执行 NOT 操作，该机制由在子阵列中用双访问晶体管（2TC1）结构增强的一行单元实现。尽管 AMBIT 没有面向机器学习的应用领域，但它为另外两个\
  \ CNN 加速器 DRISA [104] 和 DRACC [105] 奠定了基础。\n\n##### 2.4.5.3 基于 SRAM 的 IMC\n\n######\
  \ Neural Cache\n\nNeural Cache [122] 是一种基于 SRAM 的原位 DNN 推理（主要针对 CNN）引擎，通过重新利用缓存存储器构建。它可以在\
  \ 8 位数据精度下实现卷积、池化、量化和全连接层。其基本功能是按位 AND 和 NOR 操作，通过同时激活操作数行执行。在感测放大器附加进位锁存器的辅助下，它可以在较大数据上执行逐位串行加法、减法、乘法、比较、搜索和复制。转置存储单元提供硬件支持，以在存储器内部将数据重组为逐位串行格式。\n\
  \n###### IMAC\n\nIMAC [126] 是一种 CNN 推理引擎，利用类 ReRAM 的模拟 MAC 对多位数据执行卷积。一行中的存储单元包含多位权重。输入信号的模拟版本通过该行的字线驱动，位线上的相应模拟电压信号聚合以执行\
  \ MAC 操作。外围转换器（DAC/ADC）执行数模转换和模数转换。它还可以实现全连接层和激活（ReLU）函数。\n\n###### XNOR-SRAM\n\n\
  XNOR-SRAM [106] 是一种用于加速神经网络的原位二元/三元卷积宏。二元/三元 CNN 将卷积运算简化为 XNOR 操作 [101] 后跟累加（XAC）。XAC\
  \ 通过以模拟形式驱动二元/三元输入信号通过字线执行，导致包含二元权重的 8T-SRAM 单元在读位线（RBL）上产生 XNOR 输出信号。XNOR 输出在 RBL\
  \ 上进行模拟累加，随后在 ADC 中数字化。\n\n##### 2.4.5.4 基于 ReRAM 的 IMC\n\n###### ISAAC\n\nISAAC\
  \ [127] 是一种 ReRAM 交叉阵列结构的 CNN/DNN 原位加速器，以模拟电阻值的形式将突触权重映射在存储单元中。在 ISAAC 中，输入位以串行方式通过字线以模拟电压脉冲形式驱动。位线中的相应电流幅度代表输入位与沿相应位线连接的所有权重（单元）的累积乘积。这些部分积被数字化、移位，然后累加以完成\
  \ MAC 操作。权重以 2 的补码表示，以同时考虑正负权重。ISAAC 具有复杂的分层架构，每个处理“瓦片”包含 MAC、ADC/DAC、Sigmoid 和最大池化单元。ISAAC\
  \ 将 CNN 的所有层映射到不同的瓦片中，并采用流水线数据流。\n\n###### PRIME\n\nPRIME [112] 是一种基于 ReRAM 平台的\
  \ IMC 架构。它通过修改 ReRAM 交叉阵列的一部分创建，该部分既可作为主机存储器，也可作为神经网络加速器。它在交叉阵列中以类似 ISAAC 的机制执行模拟\
  \ MAC，不同之处在于单独的交叉阵列专门用于正负模拟权重。它大量修改默认 ReRAM 微架构，以同时支持 Sigmoid、ReLU、最大池化、ADC/DAC、精度控制单元和缓冲子阵列。PRIME\
  \ 具有 Bank 级并行性，并提供软件和 API 支持用于编程和数据映射。\n\n\n\n\n\n##### 2.4.5.4 基于 ReRAM 的 IMC\n\
  \n###### PipeLayer\n**PipeLayer** [128] 是一种基于 ReRAM 的加速器，它利用基于脉冲的信号，并通过层间流水线实现引入了批级层内并行性。为了提高吞吐量，该加速器支持平铺架构，将计算和数据编码结合在一起，以便在\
  \ ReRAM 交叉阵列中并行处理数据。该加速器分析层间的数据依赖关系，以提高流水线和层间并行性的有效性。\n\n###### BCNN 加速器\nTang *et\
  \ al.* [108] 提出了一种 BCNN 加速器，该加速器重点优化 ReRAM 交叉阵列平台上的 CNN 推理。它考虑在模拟 ReRAM 单元中存储二进制数据，以确保对工艺变异的最大鲁棒性。文中提出了一种精心设计的矩阵分割方案，用于将大型\
  \ CNN 映射到多个交叉阵列单元上。CNN 的不同层（包括卷积层、全连接层和最大池化层）被映射到不同的 ReRAM 交叉阵列块，并且各层的执行是流水线化的。一个复杂的缓冲区（行缓冲区）确保了数据从一层到下一层的最快、最高效传输。\n\
  \n###### Atomlayer\n**Atomlayer** [129] 是一种基于 ReRAM 的加速器，它利用原子层计算，即一次处理神经网络的一层，以消除流水线。它解决了\
  \ ISSAC [127] 在执行神经网络训练方面的局限性以及 Pipelayer [128] 的低能效问题。为了减少流水线气泡，该设计利用大容量 DRAM 主存来存储神经网络推理或训练中产生的初始和中间数据。它使用旋转交叉阵列作为关键组件来执行原子层计算。它还采用行不相交滤波器映射，将滤波器行分布在其多个处理单元上，以确保最大程度的数据复用并降低\
  \ DRAM 带宽。\n\n###### XNOR-ReRAM\n**XNOR-ReRAM** [107] 是一种在 ReRAM 上实现的二值神经网络（MLP）推理引擎。由于输入和权重均为二值（1\
  \ 位），卷积运算简化为按位 XNOR 运算。采用双互补单元设置来执行 XNOR 运算。字线开关矩阵取代了 ReRAM 突触架构中的行解码器，从而实现了跨存储行的并行性。操作数矩阵被分割并分布在各位线上。部分和在每条位线上的多电平感测放大器（MSLA）处产生，随后进行量化累加并经二值激活以获得输出。\n\
  \n##### 2.4.5.5 基于 STT-MRAM 的 IMC\n\n###### 二值 CNN\nPan *et al*. [109] 展示了一种在 STT-MRAM\
  \ 上实现的二值 CNN 加速器。它采用多电平 STT-MRAM 单元结构（ML-STT），将两个非对称单元融合在一起以存储 2 位数据。它能够通过多行激活执行批量按位\
  \ AND/NAND、OR/NOR 运算，并通过改进的感测放大器执行 XOR 和行波进位加法运算。存储体外围的辅助处理单元（APU）执行其他 CNN 操作，如批归一化和池化。该工作在\
  \ XNOR-NET [101] 上进行了评估。\n\n###### MRIMA\n**MRIMA** [110] 是一种在 STT-MRAM 平台上实现的 IMC\
  \ 器件，旨在服务于两个不同的应用领域：CNN 推理和 AES 数据加密。这两种应用均由存内计算阵列提供支持，该阵列既可作为存储器件，也可通过利用多行激活并为每个逻辑输出的感测使用不同的参考电流，来执行批量按位\
  \ AND、NAND、NOR（针对 2 或 3 个操作数）以及 XOR/XNOR 运算。MRIMA 可执行 BWNN 和低位宽 CNN 推理。卷积运算通过对输入和核矩阵进行列分解、通过输入和核列之间的按位并行\
  \ AND 运算生成部分积、最后对这些部分积进行移位和累加来简化。MRIMA 拥有自己的指令集架构（ISA），并可通过 PCIe 端口作为协处理器连接。\n\n\
  ###### MRAM-DIMA\n**MRAM-DIMA** [130] 是一种基于 MRAM 的交叉阵列 MAC 引擎，面向 DNN 应用。权重以列主序格式映射到位线上，输入以脉宽调制（PWM）形式通过字线提供。模拟向量乘法在\
  \ MRAM 单元中并行进行，部分积在位线上产生，随后由数字处理器累加。MRAM-DIMA 还能执行截断 ReLU 激活。\n\n##### 2.4.5.6 基于\
  \ SOT-MRAM 的 IMC\n\n###### 二值 CNN\nFan *et al.* [131] 是一种基于 SOT-MRAM 平台的二值 CNN 加速器。BCNN\
  \ 推理将卷积简化为简单的存内按位 AND 运算，随后在外围位计数器中进行累加。DPU（数字处理单元）执行批归一化、缩放、乘法和池化运算。\n\n######\
  \ IMCE\n**IMCE** [94] 是一种基于 SOT-MRAM 的 IMC 器件，它通过利用二值卷积机制，能够在不同的数据精度组合下执行 CNN 推理和训练。该机制涉及输入特征图和核（权重矩阵）的列分解、这些列的按位卷积，最后通过外围计数器、移位器和加法器对这些部分积进行移位和累加以获得输出特征图。一个存内\
  \ DPU 执行量化、批归一化、池化和激活滤波。\n\n###### CMP-PIM\n**CMP-PIM** [132] 是一种执行基于比较器的 DNN 推理的\
  \ SOT-MRAM IMC。此处，卷积层中的逐像素卷积运算被深度可分离卷积所取代，后者是二值模式特征提取（深度卷积）和二值逐点（按位）卷积的组合。深度卷积利用固定三值核，在本文中通过多位比较和累加来实现。CMP-PIM\
  \ 的批量按位 IMC 架构可执行 AND/NAND、OR/NOR、XOR/XNOR 运算。逐点卷积阶段通过按位 AND 实现，随后进行位计数、移位和累加运算。量化、批归一化和激活在存内\
  \ DPU 中进行。\n\n### 2.5 IMC 架构分析\n\n表 2.3 展示了不同 IMC 技术的定性对比。图 2.12(a) 和 (b) 分别展示了基于传统和新兴存储平台的\
  \ IMC 面积对比。除 SCOPE 其面积是商品 DRAM 芯片的四倍多之外，基于 DRAM 的 CNN/DNN 加速器均以 60 mm² 的基准面积为中心。基于\
  \ SRAM 的神经缓存占地面积较小，归因于其极低的存储容量（35 MB）。ISAAC 和 PRIME 在 ReRAM IMC 中面积最大。这归因于它们的大数据精度（16\
  \ 位）。然而，AtomLayer 同样具有 16 位数据精度，却拥有显著更小的面积，因为它采用了大规模资源复用以减少处理面积。Tang *et al.* 的两种数据精度配置（CNN\
  \ 和 BCNN）以及 XNOR-ReRAM 的二值精度也反映了面积与数据精度成正比的相同规律。在基于 MRAM（STT-MRAM 和 SOT-MRAM）的工作中也可观察到类似现象——IMCE\
  \ 采用二值数据精度，CMP-PIM 采用 8 位数据精度，其中 CMP-PIM 占地面积更大。\n\n表 2.3 知名 IMC 架构及其特性\n\n![image](img/tab2.3.jpg)\n\
  \n![image](img/PBPC0390-02-f12.jpg)\n\n图 2.12 采用 (a) 传统和 (b) 新兴存储技术的 IMC 架构面积\n\n\
  \n\n\n\n图 2.13 展示了基于易失性存储器（DRAM 和 SRAM）的 IMC 在 AlexNet 上的性能（单位芯片面积吞吐率）和能效（单位能耗输出）基准测试。SCOPE\
  \ 展示了卓越的性能指标，尽管其能效相当低，这可归因于其用于乘法运算的随机方法。得益于其查找表（LUT）实现，LAcc 确保了这些工作中最高的能效。神经缓存的最低能效和最低性能指标分别可追溯到其相对低效的\
  \ SRAM 平台和较小的容量（35 MB）。\n\n![image](img/PBPC0390-02-f13.jpg)\n\n图 2.13 传统存储器 IMC\
  \ 在 AlexNet 上的基准测试\n\n图 2.14 展示了新兴非易失性存储器（NVM）IMC 的吞吐率（每单位面积每秒万亿次操作，TOPS）和能效（每单位功耗\
  \ TOPS）对比。与 ISAAC 和 Atomlayer 相比，Pipelayer 拥有显著更高的吞吐率，但能效最低，因为它利用大量层内数据并行性来最大化流水线吞吐率。尽管\
  \ Atomlayer 具备训练能力的优势，但在能效领域并未超越 ISAAC。由于极低的数据精度（二进制/三元精度），XNOR-ReRAM 是对比中最高效的 ReRAM\
  \ IMC。\n\n![image](img/PBPC0390-02-f14.jpg)\n\n图 2.14 新兴存储器 IMC\n\n## 第 3 章\n\n\
  **ReRAM 器件背景**\n\n在本章中，我们将首先介绍电阻式随机存取存储器（`ReRAM`）器件的特性。在对 `ReRAM` 进行表征后，我们将介绍 `ReRAM`\
  \ 的结构设计，随后介绍几种基于 `ReRAM` 的器件应用设计。\n\n### 3.1 ReRAM 器件与 SPICE 模型\n\n在本节中，我们将根据电荷粒子的扩散情况，介绍两类\
  \ `ReRAM` 器件：漂移型和扩散型。这些器件的模型及用法在文献 \\[24, 133\\] 中有介绍，下文将给出充分的细节描述。\n\n#### 3.1.1\
  \ 漂移型 ReRAM 器件\n\n`ReRAM`（也称为忆阻器）的存在最早由 Leon Chua 于 1976 年预测 \\[60\\]，但直到近 30 年后，才在\
  \ HP 实验室首次被重新发现并用于纳米级器件 \\[62\\]。忆阻器这一名称源于这样一个事实：其电阻由当前及过去流过它的电流决定，仿佛它能“记住”自己的历史。这种记忆效应具体表现为流过器件电流的时间积分：当电流沿一个方向流过\
  \ `ReRAM` 时，其电阻增加；而当电流沿相反方向流动时，电阻减小；类似地，当电流停止流动时，`ReRAM` 保持其之前的电阻，从而保持或记忆（电阻）状态。该器件的两个稳定状态被定义为\
  \ `HRS` 和 `LRS`。写操作通过施加大电流实现，从而迅速改变其电阻。读取单元时，施加小电流以检测其电阻，而不显著改变其电阻。Leon Chua 提出的第四基本元件\
  \ `ReRAM` 的基础如图 3.1 所示。2008 年，HP 实验室演示了首个 `ReRAM` 物理实现：通过沿 `TiO2` 薄膜器件移动掺杂前沿实现了忆阻效应\
  \ \\[62\\]。掺杂前沿两侧的材料具有不同的电阻率，总电阻计算为两个电阻串联的电阻。基于 `TiO2` 的 `ReRAM` 单元结构图如图 3.2 所示。此外，HP\
  \ 实验室在文献 \\[61\\] 中发布了 `ReRAM` 阵列（`ReRAM` 交叉阵列结构）的扫描电子显微镜（`SEM`）照片，如图 3.3 所示。\n\n\
  ![image](img/PBPC0390-03-f01.jpg)\n\n图 3.1 基本三要素（电阻、电容和电感）间的电压-电荷-电流关系及第四要素 `ReRAM`\
  \ 的预测 \\[60\\]\n\n![image](img/PBPC0390-03-f02.jpg)\n\n图 3.2 基于 `TiO2` 的 `ReRAM`\
  \ 单元结构图\n\n![image](img/PBPC0390-03-f03.jpg)\n\n图 3.3 HP 制造的 `ReRAM` 阵列照片\n\n一个综合的动态\
  \ `ReRAM` 模型（考虑了电荷诱导漂移效应、减速效应和强电场效应）如图 3.4(a)所示，包含掺杂区和非掺杂区。引入掺杂比（`w`）这一术语，以数值表示掺杂区长度（`D`）占\
  \ `ReRAM` 薄膜总厚度（`L`）的比例。由于掺杂区和非掺杂区的电阻率差异巨大，总电阻随掺杂比变化。例如，当 `w = 1` 时，`ReRAM` 处于 `LRS`，其电阻比\
  \ `w = 0` 时 `HRS` 下的电阻小近千倍。\n\n![image](img/PBPC0390-03-f04.jpg)\n\n图 3.4 `ReRAM`\
  \ 结构及动态模型的非线性效应：(a) 边界处的减速效应；(b) 漂移速度与电场的指数关系\n\n`ReRAM` 器件的工作原理可总结为：电荷诱导的状态（掺杂比\
  \ `w`）偏移。如图 3.4(a)所示，`ReRAM` 可视为串联的两个区域：掺杂区和非掺杂区。分隔两区的畴壁可由流过的电荷偏移。当正电荷流向 `ReRAM`\
  \ 结右侧时，畴壁右移，掺杂比（`w`）增大，电阻相应减小；电荷反向流动时则反之。传统上，该机制可描述为广义电压控制忆阻系统 \\[60\\]，数学定义如下：\n\
  \n```\nv = R(w) * i\ndw/dt = f(w, v)\n```\n\n其中 `R` 为 `ReRAM` 电阻，`f` 为 `w` 和施加电压\
  \ `v` 的显式函数；`dw/dt` 为由 `w` 和外部电压 `v` 决定的归一化漂移速度。注意，互补电流控制忆阻系统可类似定义。`ReRAM` 的漂移速度是施加电流的函数，最初可用以下分段线性形式建模\
  \ \\[62\\]：\n\n```\ndw/dt = mu_v * (R_on / L) * i\n```\n\n此外，强电场效应代表在强电场条件（`E >\
  \ E_c`）下漂移速度呈指数级增加 \\[134\\]。这通常发生在纳米级器件中，如新制造的 20 nm 级 `ReRAM`。如图 3.4(b)所示，该现象可用\
  \ `sinh` 函数近似，如文献 \\[134\\] 所述：\n\n```\ndw/dt = mu_v * (R_on / L) * i * sinh(E /\
  \ E_c)\n```\n\n其中 `E` 为施加场强，其余变量定义见表 3.1。\n\n表 3.1 漂移型 ReRAM 器件所用变量定义\n\n| 变量 |\
  \ 定义 |\n| --- | --- |\n| `R` | `ReRAM` 电阻 |\n| `G` | `ReRAM` 电导 |\n| `phi` | 磁通量\
  \ |\n| `q` | 电荷 |\n| `D` | 掺杂区长度 |\n| `L` | `ReRAM` 薄膜厚度 |\n| `w` | 掺杂比 `w = D/L`（非易失性状态变量）\
  \ |\n\n\n\n\n\n### 表 3.1 ReRAM 模型参数\n\n| 符号 | 说明 |\n| :--- | :--- |\n| `w` | 归一化漂移速度\
  \ |\n| `R_on` | 低阻态电阻 (LRS) |\n| `R_off` | 高阻态电阻 (HRS) |\n| `f(w)` | 定义边界条件 `w=0`\
  \ 或 `w=1` 的窗口函数 |\n| `μ_v` | 小电场下的迁移率 |\n| `F_c` | 晶体中特定移动原子的特征场 |\n\n此外，ReRAM 的减速效应如图\
  \ 3.4(a)所示，当 `w` 接近边界 `w=0` 或 `1` 时，漂移速度迅速下降，不再与施加的电流呈线性关系。这种非线性动态效应可以用以下任一窗口函数来表征\
  \ [135, 136]：\n\n```\nf(w) = 1 - (2w - 1)^(2p)  (Joglekar 窗口函数)\n```\n\n```\nf(w)\
  \ = w(1 - w)  (Biolek 窗口函数)\n```\n\n因此，考虑掺杂因子 `w` 的电荷诱导漂移效应、减速效应和强电场效应的完整非线性动态 ReRAM\
  \ 模型可从式 (2.2) 到 (2.6) 得出：\n\n```\ndw/dt = μ_v * (R_on / D²) * i(t) * f(w)\n```\n\
  \n```\nR(w) = R_on * w + R_off * (1 - w)\n```\n\n将推导出的 ReRAM 动态函数 (3.5)–(3.7) 结合到修正节点分析\
  \ (MNA) 矩阵中，可以推导出以下雅可比项：\n\n```\n∂i/∂v = G(w)\n```\n\n```\n∂i/∂w = (∂G/∂w) * v\n\
  ```\n\n```\n∂(dw/dt)/∂w = (∂/∂w)[μ_v * (R_on / D²) * i(t) * f(w)]\n```\n\n其中 `G(w)`\
  \ 是电导，`∂G/∂w` 是电导的非易失性状态变量导数；`μ_v`、`R_on`、`D` 为常数；`f(w)` 为窗口函数。回顾一下，其他参数定义见表 3.1。因此，线性化系统方程所需的所有雅可比项均可建立，据此可在类\
  \ SPICE 仿真器中相应地实现考虑非易失性状态变量的 ReRAM 器件仿真。\n\n为了验证动态 ReRAM 模型及功能，需要进行生成 ReRAM 磁滞回线的仿真。基于模型的操作特性效率根据文献\
  \ [62] 的实验测量进行验证，以评估效率。器件参数设置为：`D = 10 nm`，`R_on = 100 Ω`，`R_off = 16 kΩ`；初始电阻 `w_0\
  \ = 0.01`，`R_off = 16 kΩ`，`R_on = 100 Ω`；应用 Joglekar 窗口函数，`p = 5`。在驱动电压 `V = 1.2\
  \ V` 下研究动态行为。如图 3.5 所示，仿真结果能很好地捕捉文献 [62] 报告的实验结果。\n\n![Figure 3.5 ReRAM device simulation\
  \ with Joglekar window function: I–V curve, which is consistent with the measured\
  \ results reported](img/PBPC0390-03-f05.jpg)\n\n除了建模和仿真结果外，本章还介绍了一些漂移型 ReRAM 器件的测量。为此，首先需要对\
  \ ReRAM 进行成形过程，如图 3.6 所示。实验中顺应电流设置为 `100 μA`。\n\n![Figure 3.6 Measurement results\
  \ of voltage and current of a drift ReRAM in forming process](img/PBPC0390-03-f06.jpg)\n\
  \n成形过程后，此处分析了 ReRAM 器件 SET 和 RESET 的一些实验。首先，研究了 17 次 SET 和 18 次 RESET 的直流测量，ReRAM\
  \ 的行为显示出如图 3.7 所示的磁滞回线。对于 SET 过程，我们使用 `100 μA` 作为顺应电流。\n\n![Figure 3.7 Measurement\
  \ results of an ReRAM hysteresis loop drift in SET and RESET processes](img/PBPC0390-03-f07.jpg)\n\
  \n此外，瞬态测量也是研究的重点。为此，考虑使用三个脉冲，第一和第三个脉冲用于读取，第二个电压脉冲用于 SET 或 RESET。瞬态测量结果使用 `100 ns`\
  \ 作为时间间隔。首先，图 3.8 描绘了 SET 操作，并展示了 ReRAM 电阻如何从 1 MΩ 变化到 50 kΩ。此处，`0.1 V` 脉冲用于读操作，而\
  \ `1.5 V` 用于写操作。我们可以看到 SET 延迟在 `100 ns` 量级，因此很难看到电阻变化的过程。其次，我们用图 3.9 展示 RESET 操作，ReRAM\
  \ 电阻从 50 kΩ 变化到 100 kΩ。`0.1 V` 脉冲用于读操作，而 `-1.5 V` 用于写操作。\n\n![Figure 3.8 Transient\
  \ measurement results of resistance, voltage and current of a drift ReRAM in SET\
  \ operation](img/PBPC0390-03-f08.jpg)\n\n![Figure 3.9 Transient measurement results\
  \ of resistance, voltage and current of a drift ReRAM in RESET operation](img/PBPC0390-03-f09.jpg)\n\
  \n#### 3.1.2 扩散型 ReRAM 器件\n\n近期研究 [137, 138] 报道了一种扩散型 ReRAM 器件。不同于常见的漂移型 ReRAM，扩散型\
  \ ReRAM 的初始状态在无外部电压或电流施加时始终为 HRS，且 `R_off = 1 MΩ`。当输入电压超过阈值 `V_th = 1 V` 持续一段时间（如\
  \ 1 ms）后，扩散型 ReRAM 将切换到 LRS，`R_on = 1 kΩ`。器件开启后，若施加电压降至另一阈值 `V_hold = 0.5 V` 以下约\
  \ 20 ms，电阻将缓慢恢复回 HRS。此类器件作为自动开/关选择器显示出巨大潜力。下文中，我们用 `R_on` 和 `R_off` 表示扩散型 ReRAM\
  \ 的两种状态。\n\n在大多数应用中，扩散型 ReRAM 与漂移型 ReRAM 串联，形成一选择器一 ReRAM (1S1R) 结构。这种扩散型 ReRAM\
  \ 可作为突触模拟器 [137] 和选择器 [138]。我们在图 3.10 中使用 SPICE 仿真表征这两种 ReRAM。此处根据文献 [139] 设置漂移型\
  \ ReRAM 参数 `R_on = 100 Ω`，`R_off = 16 kΩ`，根据文献 [138] 设置扩散型 ReRAM 参数 `R_on = 1 kΩ`，`R_off\
  \ = 1 MΩ`。后续章节将使用 SPICE 模型进行 1S1R 性能评估。\n\n![Figure 3.10 Characterization of drift\
  \ ReRAM and diffusive ReRAM](img/PBPC0390-03-f10.jpg)\n\n### 3.2 ReRAM 交叉阵列结构\n\n\
  如前所述，ReRAM 是一种两端器件，可观察到夹在金属电极之间的亚化学计量比过渡金属氧化物 (`TMO_x`)。这种器件可用作具有离子电阻状态的非易失性存储器，从而产生两种非易失性状态：HRS\
  \ 和 LRS。通过施加 SET 电压 (`V_set`) 或 RESET 电压 (`V_reset`)，可将状态从 HRS 变为 LRS，或反之亦然。\n\n\
  两种状态 RHS 和 LRS 分别代表 `R_off` 和 `R_on`。读取 ReRAM 单元时，可向 ReRAM 施加读电压 `V_read`。`I_read_HRS`\
  \ 和 `I_read_LRS` 遵循：\n\n```\nI_read = V_read / R(w)\n```\n\n其中 `V_th` 是 ReRAM 的阈值电压。\n\
  \n\n\n\n\n# ReRAM 交叉阵列结构\n\n由于 ReRAM 器件的高密度，可以构建交叉阵列结构作为 ReRAM 阵列 [59, 140–144]。这种交叉阵列结构可用作高密度数据存储的存储器。通过控制字线（WL）和位线（BL）的电压，可以对存储阵列进行读取或写入。例如，我们可以在第\
  \ `i` 条 WL 上施加 `V_write`，在第 `j` 条 BL 上施加 `0`，以将数据写入第 `i` 行、第 `j` 列的 ReRAM 单元中。\n\
  \n#### 3.2.1 模拟与数字化 ReRAM 交叉阵列\n\n本节将介绍传统的模拟 ReRAM 交叉阵列和数字化 ReRAM 交叉阵列。这两种结构的 I/O\
  \ 接口和 ReRAM 器件电阻值的数量各不相同。\n\n##### 3.2.1.1 传统模拟 ReRAM 交叉阵列\n\nReRAM 是一种基于两端结器件的新兴非易失性存储器，其电阻可由外部施加电流的积分来控制。交叉阵列的结构天然支持矩阵-向量乘法，其中向量由行输入电压电平表示，矩阵由\
  \ ReRAM 电阻网格表示。为了计算矩阵-向量乘法 `y = Wx`。如图 3.11 所示，通过将 `W` 配置到 ReRAM 交叉阵列中并将 `x` 设置为交叉阵列输入，模拟计算可直接由\
  \ ReRAM 交叉阵列实现，输出为 `y`。\n\n![图 3.11 带有 ADC 和 DAC 的传统模拟式 ReRAM 交叉阵列](img/PBPC0390-03-f11.jpg)\n\
  \n然而，这种模拟 ReRAM 交叉阵列有两个主要缺点。首先，由于较大的 ReRAM 工艺变异，连续值 ReRAM 电阻的编程在实际中极具挑战性。具体而言，ReRAM\
  \ 电阻由流过器件的电流积分决定，这会导致如图 3.12(a)所示的开关曲线。由于工艺变异，曲线可能会发生偏移，导致中间值非常难以可靠地编程，如图 3.12(b)所示。其次，模数转换器（ADC）和数模转换器（DAC）既耗时又耗电。在我们的仿真中，如图\
  \ 3.13 所示，在 65 nm 工艺下，模数和数模转换可能消耗高达 85.5% 的总运算能量。\n\n![图 3.12 (a) 器件变异下的 ReRAM 开关曲线。(b)\
  \ 不同 ReRAM 目标电阻的编程不准确性](img/PBPC0390-03-f12.jpg)\n\n![图 3.13 (a) 模拟式 ReRAM 交叉阵列的功耗。(b)\
  \ 模拟式 ReRAM 交叉阵列的面积消耗](img/PBPC0390-03-f13.jpg)\n\n##### 3.2.1.2 数字化 ReRAM 交叉阵列\n\
  \n为克服上述问题，提出了一种用于矩阵-向量乘法的全数字化 ReRAM 交叉阵列。首先，如图 3.12 所示，导通态（ON-state）和截止态（OFF-state）比中间值可靠得多，因此只允许\
  \ ReRAM 采用二进制值，以减少 ReRAM 编程的不准确性。其次，部署了无需 A/D 转换的纯数字接口。\n\n在 ReRAM 交叉阵列中，我们用 `V_WL[i]`\
  \ 和 `V_BL[j]` 分别表示第 `i` 条 WL 和第 `j` 条 BL 上的电压。`R_LRS` 和 `R_HRS` 分别表示低电阻态（LRS）和高电阻态（HRS）的电阻。在每个感测放大器（SA）中，都有一个电阻固定且较小的感测电阻\
  \ `R_sense`。这三个电阻的关系为 `R_LRS < R_sense < R_HRS`。因此，第 `j` 条 BL 上的电压可表示为\n\n```\n\
  V_BL[j] = (Σ_i g_ij * V_WL[i]) / (Σ_i g_ij + 1/R_sense)\n```\n\n其中 `g_ij` 是 `R_ij`\
  \ 的电导。\n\n数字化交叉阵列的关键思想在于使用比较器。由于模拟交叉阵列每列的输出电压是连续值，因此使用比较器根据施加在 SA 上的参考阈值将其数字化：\n\
  \n```\nV_BL[j] > V_ref ? 1 : 0\n```\n\n然而，模拟电压值数字化带来的问题是信息丢失。为克服此问题，可采用三种技术。首先，使用多阈值以增加量化电平，从而保留更多信息。其次，将乘法运算分解为三个子运算，二进制交叉阵列可很好地处理这些子运算。第三，在数字化后能保留最多信息的区域精心选择阈值。\n\
  \n与传统的模拟 ReRAM 交叉阵列 [145, 146] 相比，数字 ReRAM 交叉阵列的优势如下：\n\n*   它在工艺变异下具有更好的 ReRAM\
  \ 器件编程精度，且无需额外的 ADC 转换。\n*   由于数字 ReRAM 交叉阵列中仅配置 LRS 和 HRS，因此不需要高 HRS/LRS 比，从而可以采用低功耗（高\
  \ LRS）器件 [139]。此外，使用低功耗 ReRAM 器件时，线电阻对 IR 压降的影响很小。\n*   二进制输入电压在大尺寸交叉阵列中对 IR 压降具有更好的鲁棒性。\n\
  \n然而，在数字 ReRAM 交叉阵列实现中，ReRAM 器件的面积和能耗会增加。这将在第 3.5 节中讨论。\n\n#### 3.2.2 ReRAM 交叉阵列的连接方式\n\
  \nReRAM 交叉阵列有三种连接方式：直接连接 ReRAM、一晶体管一 ReRAM (1T1R) 和 1S1R。下面将详细描述这些方法及其差异。\n\n#####\
  \ 3.2.2.1 直接连接 ReRAM\n\n直接连接 ReRAM，也称为无源 ReRAM 阵列，是一种仅包含 ReRAM 器件的交叉阵列结构。每条 WL 和\
  \ BL 通过单个漂移型 ReRAM 相连。直接连接 ReRAM 的结构如图 3.14(a)所示，此处以 `N` 条 WL（`i ∈ [1, N]`）和 `M`\
  \ 条 BL（`j ∈ [1, M]`）为例。要执行写操作，需要在 `WL[i]` 和 `BL[j]` 之间施加写电压 `V_write`。在这种情况下，连接它们的\
  \ ReRAM（`R_ij`）可以被精确配置。\n\n![图 3.14 ReRAM 交叉阵列实现对比：(a) 含偷路的直接连接；(b) 需额外控制信号的 1T1R；(c)\
  \ 无需额外控制信号的无偷路 1S1R；(d) 模拟与数字接口对比](img/PBPC0390-03-f14.jpg)\n\n然而，这种结构存在偷路问题。在该示例中，紫色路径是我们期望的理想电流路径，但可能存在另一条由绿色标识的路径。该路径由\
  \ `R_ik`、`R_lk` 和 `R_lj` 组成，因此我们可以看到 `V_write` 也施加在了这三个 ReRAM 的串联上。在某些情况下，其中两个处于\
  \ LRS，一个处于 HRS，导致处于 HRS 的 ReRAM 器件上施加了非常大的电压。在这种情况下，该 ReRAM 的状态也可能被配置，这是我们不希望发生的。\n\
  \n\n\n\n\n##### 3.2.2.2 一晶体管一 ReRAM\n\n在 1T1R 结构中，正如文献 [145] 所示，一个 NMOS 晶体管与每个 ReRAM\
  \ 器件串联连接。因此，每条字线 (WL) 通过一个晶体管和一个 ReRAM 连接到一条位线 (BL)，如图 3.14(b)所示。NMOS 晶体管用作电压控制选择器，以便我们可以配置每个\
  \ ReRAM 单元的连通性。1T1R 的主要优势在于避免了直接连接结构中的偷漏路径。在图 3.14(b)中，我们使用一个信号来控制连接到同一 WL 的晶体管。显而易见，我们只需在目标\
  \ `V_WL`、`V_BL` 上施加电压，并仅将 `V_WL` 置高；只有目标单元才能被配置。该结构的指标可总结如下：\n\n*   对 ReRAM 器件非线性要求低，因为电压仅施加在目标单元上。\n\
  *   控制器设计比直接连接结构容易得多。\n\n然而，1T1R 结构仍有一个缺点，即交叉阵列面积取决于晶体管，与 ReRAM 器件相比不可缩放。因此，当 ReRAM\
  \ 交叉阵列尺寸较大时，这不是一个好的选择。\n\n##### 3.2.2.3 一选择器一 ReRAM\n\n一种无偷漏路径的数字 ReRAM 交叉阵列如图 3.14(c)所示。在此架构中，每个漂移型\
  \ ReRAM 与一个扩散型 ReRAM（作为选择器）串联连接。与前两种实现相比，1S1R 可保持良好的可扩展性，且无需额外控制器即可消除偷漏路径。与文献 [150]\
  \ 相比，选择器的 `R_OFF` 仅对数字 ReRAM 的操作产生微小影响。由于如图 3.10 所示 `R_OFF >> R_ON`，1S1R 的静态电阻几乎等于\
  \ `R_ON`。此外，当选择器处于关断状态时，施加电压的大部分分布在选择器器件上。由于每条偷漏路径至少会连接三个 1S1R，因此工作电压 `V_OP` 只需满足以下方程即可消除偷漏路径：\n\
  \n```\nV_OP > 3 * V_TH\n```\n\n我们将在第 3.7.5 节进一步讨论关于无偷漏路径效应的仿真结果。\n\n### 3.3 基于 ReRAM\
  \ 的振荡器\n\n文献 [151, 152] 中观察到了 ReRAM 器件中的振荡行为，这是由漂移型 ReRAM 的成形过程实现的。最近的扩散型 ReRAM\
  \ [137, 138] 显示了作为振荡器的可行性。基于 ReRAM 的振荡器可如图 3.15(a)所示构建。在此基于 ReRAM 的振荡器中，一个物理电阻 `R_S`\
  \ 与 ReRAM 器件串联。输出电压将取决于 `R_S` 与 ReRAM 电阻 `R_R` 的比例。随着电容 `C` 的充/放电，输出电压 `V_OUT` 将趋近于\
  \ `V_DD`。为了使振荡工作，我们对结构中的 ReRAM 器件有以下要求：\n\n*   在相对较高的电压 `V_TH` 下，ReRAM 的电阻 `R_R`\
  \ 显著降低至 `R_ON`。\n*   如果我们将电压降至较低值 `V_H`，`R_R` 将升高至 `R_OFF`。\n\n![Figure 3.15](img/PBPC0390-03-f15.jpg)\n\
  \n**图 3.15** (a) 基于 ReRAM 的振荡器原理图；(b) 振荡器仿真结果；(c) 振荡器 DFT 分析；(d) 不同 `R_S` 值下的振荡频率\n\
  \n因此，如果 图 3.15(a) 中的所有参数都经过良好拟合，我们可以建立振荡，公式如下：\n\n```\nf = 1 / (2 * C * R_S * ln(R_OFF\
  \ / R_ON))\n```\n\n其中 `R_ON` 和 `R_OFF` 分别是 ReRAM 器件的低电阻和高电阻。因此，在 (3.12) 所述条件下，`R_ON`\
  \ 和 `R_OFF` 不能处于静态。当 ReRAM 从 `R_OFF` 转变为 `R_ON` 或反之亦然时，会出现负电阻效应。此外，振荡频率由 `R_S` 的值决定。根据文献\
  \ [153] 建立了用于案例研究的振荡器 ReRAM 模型，可在图 3.15(b)中观察到振荡结果。图 3.15(c) 显示了图 3.15(b)的离散傅里叶变换\
  \ (DFT) 分析。图 3.15(d) 显示了不同 `R_S` 值下的振荡频率。随着 `R_S` 增大，通过振荡器的电流减小，导致充/放电变慢，从而产生较低的振荡频率。\n\
  \n### 3.4 多位 ReRAM 存储的写入方案\n\n#### 3.4.1 ReRAM 数据存储\n\n电气工程师非常熟悉包含三种基本无源电路元件——电阻、电容和电感——的电路。然而，Leon\
  \ Chua 于 1971 年首次提出了第四种电路元件，描述了电荷 (`q`) 与磁通 (`φ`) 之间的关系 [60]。所谓忆阻器件的电阻取决于通过该器件的总电荷量\
  \ [60, 154]。在本章中，我们交替使用 ReRAM 和忆阻器术语。忆阻器的器件特性为许多新的应用领域打开了大门 [155–159]。最重要的应用之一正如预期的那样，是将其用作存储元件。例如，[160–162]\
  \ 等文献已投入大量精力研究基于忆阻器的存储单元设计。使用忆阻器的主要优势在于，在现代芯片中，存储数据所需的晶体管数量（例如在 SRAM 中）对总晶体管数量有显著且日益增加的影响\
  \ [163]。因此，利用忆阻器实现新的存储架构将大幅降低器件总漏电流 [161]。\n\n\n\n\n自 2008 年 HP 开发出首个无源忆阻器 [62]\
  \ 以来，已有关于单比特 [160–162, 164] 和多比特 [165, 166] 存储器的研究。然而，忆阻器独特的 $I$–$V$ 特性导致了非线性的 $q$–$\\\
  phi$ 特性，这使得难以确定实现特定状态所需的脉冲大小 [165, 166]。因此，这被视为多电平存储器设计的一个难题 [165, 166]。为克服这一问题，研究人员开发了一些方法，其中部分相当复杂，它们利用模拟电路和运算放大器进行读取和写入\
  \ [165, 166]。使用运算放大器和模拟电路进行读出似乎是不可避免的 [160, 165, 166]。然而，正如我们将展示的那样，上述特性可以被利用，通过兼容数字设计的电路，在忆阻器中存储多于一比特的数据。因此，这些电路复杂度较低。尽管数字位流已被用于设置突触权重\
  \ [167]，但在此类应用中，精确的存储值和存储值的恢复并非至关重要。而在存储器应用中，这却至关重要。因此，本章将讨论存储与读出的可靠性，以及编码如何有助于改善这些参数。\n\
  \n本章其余部分安排如下：下一节，我们简要回顾上述忆阻器的独特特性，并展示如何利用它在每个忆阻器中存储多于一比特的数据。在第 3.4.3 节中，我们提出了在单个忆阻器上存储两比特数据的数字写入方法以及读出电路。然后，在第\
  \ 3.4.4 节中，我们展示仿真结果，确证所提方法的可行性。在第 3.4.5 节中，我们利用不同的编码方案提高存储可靠性和存储比特数，特别是针对实际实现和对所提方法的进一步验证。\n\
  \n#### 3.4.2 用于数据存储的多阈值电阻\n\n文献中已充分证实这样一种现象：忆阻器的电阻取决于流过它的电荷 [160, 168]。这可以用多种方式建模，其中最著名的是\
  \ [168]：\n\n$$M(q) = R_{off} - (R_{off} - R_{on}) \\frac{q}{Q_0}$$\n\n其中 $R_{off}$\
  \ 和 $R_{on}$ 分别是忆阻器的最大和最小电阻，$q$ 是流过忆阻器的电荷，初始值为 $q_0$。最后，$Q_0$ 是一个常数，代表器件的物理特性，如半导体掺杂及其尺寸。\n\
  \n根据公式 (3.13)，不仅电阻，而且忆阻器因相同电压脉冲而产生的电阻变化，也取决于其当前状态 [165, 169]。这一被视为困难的特性 [165, 166]，可根据以下定理转化为机遇。\n\
  \n**定理：** *不同的输出电阻对应不同的输入模式，这允许在单个忆阻器中存储多于一比特的数据。*\n\n**简短证明**[[*]](#Chapter3.html#c03_fn1)：假设存在两个不同的状态\
  \ A 和 B，如图 3.16 所示，它们具有不相等的电阻 $M_A \\neq M_B$，其中 $M_A > M_B$。现在，我们想找出施加幅度为 $V_p$、宽度为\
  \ $T_p$ 的输入电压脉冲后，这两个点电阻变化率的比值。根据欧姆定律，我们有\n\n$$i(t) = \\frac{V_p}{M(q(t))}$$\n\n\
  其中忆阻器的 $M(q)$ 由公式 (3.13) 给出。求解该方程相当复杂，超出了本章范围。因此，以简化方式，我们通过其斜率 $\\frac{dM}{dq}$\
  \ 来估算每一点的电阻变化。换句话说，在 $q$ 点附近，我们用以下公式估算 (3.13)：\n\n$$M(q) \\approx M(q_0) + \\frac{dM}{dq}(q\
  \ - q_0)$$\n\n![图 3.16 忆阻器电阻作为其存储电荷的函数](img/PBPC0390-03-f16.jpg)\n\n将 (3.15) 代入\
  \ (3.14)，并在周期 $T_p$ 内积分，得到 [169]\n\n$$\\Delta q = \\int_0^{T_p} \\frac{V_p}{M(q(t))}\
  \ dt$$\n\n求解 (3.16)，可得\n\n$$\\Delta M \\approx \\frac{dM}{dq} \\Delta q = \\frac{dM}{dq}\
  \ \\frac{V_p T_p}{M(q_0)}$$\n\n其中\n\n$$\\frac{dM}{dq} = -\\frac{R_{off} - R_{on}}{Q_0}$$\n\
  \n另一方面，从 (3.15) 可轻松推断 $\\frac{dM}{dq}$ 为常数。基于此，点 A 和点 B 因电荷变化而导致的电阻变化比为\n\n$$\\\
  frac{\\Delta M_A}{\\Delta M_B} = \\frac{M_B}{M_A}$$\n\n这表明忆阻器在不同阶段因相同脉冲而产生的电阻变化，取决于其当时的状态（电阻）。该比率可进一步简化并近似为仅电阻比\
  \ [169]。\n\n现在，假设正脉冲表示“1”，负脉冲表示“0”，如果忆阻器先后接收一个正输入脉冲和一个负输入脉冲（“10”），它将达到一个不同的状态（“$A_{10}$”），这与先施加负脉冲再施加正脉冲的情况（“01”，因此为\
  \ $A_{01}$）相比。其根本原因在于：初始负脉冲导致的电阻变化（A 到 $A_0$）与先前正脉冲改变忆阻器状态后（$A_1$ 到 $A_{10}$），同一脉冲导致的电阻变化不同。正脉冲在两个不同状态下引起的变化（$A_0$\
  \ 到 $A_{01}$ 与 A 到 $A_1$）也是如此。因此，我们可以得出结论：由于施加“01”和“10”后忆阻器的状态不同，基于忆阻器的状态，可以恢复其原始输入\
  \ [169]。这将在下一节中验证。\n\n#### 3.4.3 写入与读出\n\n基于上述概念，本节提出我们的读写方法，并在第 3.4.4 节中对其进行仿真，以测试通过数字流存储的数据值能否成功恢复。对于阵列架构、存储单元的隔离与访问，假设采用类似于\
  \ [166] 的 1T1R 架构。由于运算放大器（比较器）是决定该实现可行性和可靠性的关键电路部分，我们使用了一款现有现货运算放大器 `LT1012` 的模型，该模型考虑了失调电压等非理想特性。\n\
  \n##### 3.4.3.1 写入方法\n\n如前所述，为了分别区分“1”输入和“0”输入，使用正脉冲和负脉冲，这可以通过连接参考电压的简单开关来实现。这消除了\
  \ [165] 中提到的复杂电路或 [166] 中使用的 DAC 的需求。本实验中这些脉冲的幅度为 0.5 V，脉冲宽度为 10 ms。输入按最高有效位优先、最低有效位最后的顺序施加。\n\
  \n\n\n\n表 3.2 显示了要存储的数据以及由于这些输入而导致的忆阻器（电阻）的结果状态。该表表明，正如预期的那样，不同的输入数据模式会导致忆阻器出现不同的状态。与\
  \ [166] 类似，该列中的温度计读出码稍后可以使用简单的数字逻辑电路转换为正常的二进制表示（类似于最左侧的列）。每个包含数百到数千个忆阻器单元的存储块只需要一个这样的电路实例。因此，额外硬件的成本可以忽略不计。\n\
  \n### 表 3.2 要存储在忆阻器上的数据、结果状态和预期的未编码读出值\n\n| 数据 | | ![image](img/ch03_si177.gif)(k![image](img/ch03_si178.gif))\
  \ | | 预期读出 |\n| --- | --- | --- | --- | --- |\n| “00” | | 5.213 | | “000” |\n| “01”\
  \ | | 5.108 | | “001” |\n| “10” | | 4.890 | | “011” |\n| “11” | | 4.778 | | “111”\
  \ |\n\n##### 3.4.3.2 读出方法\n\n为了检索存储的数据，[160] 使用基于运算放大器的电路，[166] 使用 ADC，而 [165] 使用受\
  \ ADC 启发的电路。在本章中，如 图 3.17 所示，我们也使用一种受闪速 ADC 启发的电路。在该电路中，输入施加且数据存储在忆阻器后，输入源被断开。然后，施加一个受控电流脉冲（此处为幅值\
  \ 1 A、宽度 1 ms 的矩形脉冲），忆阻器两端产生的电压被缓冲并送入三个比较器电路（为简化起见，图 3.17 底部仅显示了其中一个）。然后将忆阻器两端的电压与施加类似电流脉冲到预定电阻值上产生的电压进行比较。如果预定电阻（R![image](img/ch03_si180.gif)）两端的电压大于从忆阻器读取的电压，比较器将翻转为高输出，并在相应的触发器输出（RD![image](img/ch03_si181.gif)）中存储“1”。这意味着单元的电阻低于相应的电阻\
  \ R![image](img/ch03_si182.gif)。\n\n![image](img/PBPC0390-03-f17.jpg)\n\n**图 3.17**\
  \ 对于读出，![image](img/ch03_si185.gif) 被送入三个连接到 D 触发器的比较器，它们提供 ![image](img/ch03_si186.gif)\
  \ 位（为简化起见，仅描绘了一组）\n\n我们注意到，读出电流脉冲被选择为比输入脉冲小得多，以便它对忆阻器状态的影响较小。然而，无论这种影响多小，都需要进行补偿。因此，类似于\
  \ [160, 166]，通过施加另一个反向的受控脉冲，可以补偿这种影响。与 [160, 166] 中使用的电压脉冲相比，使用电流脉冲的优势在于，正负电流脉冲对电阻变化的影响将是相似的，而正如\
  \ 3.4.2 节 所证明的，电压脉冲则不存在这种情况。也就是说，由于忆阻器的固有特性及其非线性电压-电流关系，负电压脉冲无法精确补偿正电压脉冲，并将留下残余的额外电荷（正或负）。因此，需要检查忆阻器的状态并更频繁地刷新以补偿残余电荷。\n\
  \n正如此处提出的，使用电流源，消除读出效应的复杂方法简化为通过反向电流脉冲进行自动补偿，这比 [165] 中使用的方法简单得多。自动刷新可能会导致额外的功耗；然而，它消除了\
  \ [166] 中提出的用于刷新的状态读取操作或计数过程。因此，它将会更简单。我们注意到，这种技术可能并不适用于所有类型的忆阻器技术（例如非 TiO![image](img/ch03_si187.gif)\
  \ 忆阻器）或场景（例如受功耗限制的应用）。因此，为了补偿未补偿读出的破坏性影响（针对功耗关键型应用或该技术不高效的场景），可以采用 [166] 中讨论的其他场景来补偿读出效应。\n\
  \n#### 3.4.4 验证\n\n为了评估在忆阻器中存储数据的所提方法的实用性，我们在 LTSPICE 中仿真了所提电路。我们使用了最著名的模型（即 Biolek\
  \ 的 [168]）TiO![image](img/ch03_si187.gif) 忆阻器，由公式 (3.13) 描述。模型参数使用了以下值（由作者 [168]\
  \ 给出）：![image](img/ch03_si188.gif)、![image](img/ch03_si189.gif)、![image](img/ch03_si190.gif)\
  \ 和 ![image](img/ch03_si191.gif)。输入信号持续时间分别为 10 ms 和 1 ms，对应输入电压和读出电流脉冲。幅值分别为 ![image](img/ch03_si192.gif)\
  \ 0.5 V（用于“1”和“0”输入脉冲）和 ![image](img/ch03_si193.gif) A（用于读出电流脉冲）。这组仿真中使用的 R![image](img/ch03_si194.gif)\
  \ 电阻值分别为 5,170、5,130 和 5,010 ![image](img/ch03_si195.gif)，对应 ![image](img/ch03_si196.gif)\
  \ 1、2 和 3。\n\n比较器及其精度在读出电路的实际实现中起着关键作用，它们决定了状态之间微小差异能被区分到何种程度。为了考虑其非理想特性，我们使用了现成的运算放大器模型，即\
  \ LT1012（最大失调 25 V）。这确保了诸如失调等参数的假设值是现实且已被考虑在内的，即该电路在实践中也能按预期工作。\n\n图 3.18 显示了一个样例情况（即“01”输入）的仿真结果。在该图中，蓝色曲线显示忆阻器两端的电压（即\
  \ ![image](img/ch03_si201.gif)），黑色曲线显示 RD![image](img/ch03_si202.gif) 输出。为简化起见，RD![image](img/ch03_si203.gif)\
  \ 和 RD![image](img/ch03_si204.gif) 未显示，因为正如预期的那样，它们在整个仿真过程中保持为零。正如我们所见，在 3.1 s 施加读出电流后不久（放大区域），RD![image](img/ch03_si205.gif)\
  \ 的输出变为“1”。\n\n![image](img/PBPC0390-03-f18.jpg)\n\n**图 3.18** “01”输入的仿真结果。在 3.1\
  \ s 施加读出电流后不久（放大视图），RD![image](img/ch03_si198.gif) 的输出翻转为“1”，代表存储的数据。RD![image](img/ch03_si199.gif)\
  \ 和 RD![image](img/ch03_si200.gif) 保持为零，为简化起见未显示。\n\n此仿真及所有输出的其他仿真均满足 表 3.2 中所示的预期输出，其中预期输出代表“RD![image](img/ch03_si206.gif)\
  \ & RD![image](img/ch03_si207.gif) & RD![image](img/ch03_si208.gif)”组合。一旦获得这些值，不同的输入就能被正确区分，并且通过简单的逻辑电路，这些输出可以再次转换为二进制值。这一概念验证确认了数字流式方法在单个忆阻器上存储并成功检索两比特信息的可行性。\n\
  \n#### 3.4.5 编码与 3 位存储\n\n在本节中，我们将介绍忆阻范围和数据编码对读出可靠性的影响。\n\n##### 3.4.5.1 忆阻范围的探索\n\
  \n\n\n试图在单个忆阻器中存储 3 位或更多比特，可能会对读出的可靠性产生负面影响，这是由于不同状态下电阻之间的差异较小所致。扩大忆阻器的范围（在 `R_on`\
  \ 和 `R_off` 之间）有助于降低相对灵敏度。虽然这样可以改善具有相同数量“1”或“0”的输入之间的忆阻相对差异，但这种改善不一定与范围的扩大成正比。\n\
  \n例如，在量程为 100 `Ω`–10 k`Ω` 的忆阻器中，若“10”与“01”之间的差值为 10 `Ω`，则在量程为 1–100 k`Ω` 的忆阻器中，根据我们的模拟，该差值可达\
  \ 17 `Ω`。我们在模拟中验证了这一点，其中考虑了两个忆阻器：忆阻器 1（M1），量程为 0.1–10 k`Ω`；忆阻器 2（M2），量程为 0.5–100\
  \ k`Ω`。脉冲宽度设为 100 ms，幅度设为 `V_p = 0.5 V`，分别对应“1”和“0”输入。忆阻器的初始状态假设为 5 k`Ω`。表 3.3 列出了不同\
  \ 3 位数据模式下的忆阻值。\n\n表 3.3 不同忆阻量程忆阻器的电阻值。M1：0.1–10 k`Ω`，M2：0.5–100 k`Ω`\n\n| 输入 |\
  \ | M1 (k`Ω`) | | M2 (k`Ω`) |\n| --- | --- | --- | --- | --- |\n| “000” | | 7.2453\
  \ | | 47.2428 |\n| “001” | | 5.8991 | | 28.9629 |\n| “010” | | 5.8997 | | 28.9710\
  \ |\n| “011” | | 3.9089 | | 5.0033 |\n| “100” | | 5.8990 | | 28.9600 |\n| “101”\
  \ | | 3.9078 | | 4.9898 |\n| “110” | | 3.9088 | | 5.0014 |\n| “111” | | 1.0396 |\
  \ | 0.5000 |\n\n例如，“011”与“101”之间的忆阻差值在 M1 中为 1 `Ω`，而在 M2 中为 14 `Ω`。这表明，在电阻范围更宽的忆阻器中，包含相同数量“1”或“0”的输入更容易被区分。\n\
  \n尽管通过这种方式差值有所增加，但仍然很小，并且需要复杂的互补电路（如文献 [165] 所用）来精确设定数值。同时也需要精确的比较器（如文献 [166] 假设的那样）来读取数值。为了缓解不同状态下电阻值接近的问题，并在不使用模拟写入电路或用于读出操作的高复杂度额外电路的情况下提高可靠性，我们提出了两种编码方案。这些技术显著提高了具有相同数量“1”和“0”的输入之间的相对忆阻差异。由于编码不增加忆阻器的数量，存储器的面积保持不变，仅增加了整个系统的一个编码器（该编码器是一个包含数百到数千个存储单元的存储块）。因此，编码器占用的面积可以忽略不计。\n\
  \n##### 3.4.5.2 均匀输入编码\n\n在第一种方案中，我们采用一种简单的编码方法。在此技术中，我们将最高有效位（MSB）追加到输入的末尾，如 图\
  \ 3.19 所示。换句话说，输入“100”被编码为“100**1**”。仿真设置与 3.4.4 节 前述数值相同，选用忆阻器 M1 进行仿真，初始忆阻设为 5\
  \ k`Ω`。表 3.4 和 表 3.5 分别展示了编码对 2 位输入和 3 位输入数据的影响。\n\n![图 3.19](img/PBPC0390-03-f19.jpg)\n\
  \n图 3.19 3 位输入数据的均匀输入编码为 4 位和 5 位数据\n\n表 3.4 采用均匀编码的 2 位输入忆阻值\n\n![表 3.4](img/tab3.4.jpg)\n\
  \n表 3.5 采用两种不同均匀编码方案的 3 位输入忆阻值\n\n![表 3.5](img/tab3.5.jpg)\n\n表 3.4 给出了原始输入数据和编码后数据的忆阻值。原始情况下，“01”与“10”之间的忆阻差值近似为\
  \ 1 `Ω`，而编码为 3 位后，相对忆阻差值近似为 1.9 k`Ω`。因此，可以容忍更大的实现误差（如参考值的不准确性）和变异（制造、实现或不同单元间的差异）。文献\
  \ [166] 中观察到制造工艺中高达 6% 的物理变异，文献 [165] 中假设了 10% 的忆阻变异。然而，鉴于所提编码后忆阻状态间的最小距离为 19%（而编码前仅为\
  \ 0.2%），预期即使存在这些变异也能实现无瑕疵运行。\n\n同样，表 3.5 展示了编码对 3 位数据的影响。此处给出了 3 位数据编码为 4 位和 5 位时的忆阻值（注：在\
  \ 5 位编码情况下，前两个最高有效位被追加到数据末尾）。从 表 3.5 可知，原始（3 位）、编码为 4 位和编码为 5 位数据的“001”与“100”两个输入之间的忆阻差值分别为\
  \ 0.1 `Ω`、1.64 k`Ω` 和 1.4 k`Ω`。然而，如果我们注意到，当编码为 4 位时，“001”与“010”之间的相对忆阻差值为 `ΔR ≈\
  \ 1 Ω`。这是因为两者追加的比特相同。在 5 位编码数据的情况下，这两个输入之间的差值较大，仅仅是因为此时追加的比特不再相同。尽管如此，在某些情况下，数值仍然非常接近，这危及存储数据的可靠检索。因此，有必要进行如下进一步改进。\n\
  \n##### 3.4.5.3 非均匀编码\n\n为了解决均匀编码场景中数值接近和追加比特相似的问题，我们提出了另一种编码方案，如 表 3.6 所示。在此场景中，追加比特的选择不基于两个最高有效位，而是旨在使所有状态之间的距离最大化。为此，某些比特追加两位，某些追加一位，某些则不追加。\n\
  \n表 3.6 采用非均匀编码的 3 位输入忆阻值，“–”表示无输入施加\n\n![表 3.6](img/tab3.6.jpg)\n\n正如我们在 表 3.6\
  \ 中所见，采用新编码方案后，所有输入之间的最小差值增加到了 905.6 `Ω`，而在 表 3.5 所示的 4 位编码方案中仅为 0.5 `Ω`，5 位编码方案中仅为\
  \ 2.2 `Ω`。这一最小距离始终大于 11%，表明文献 [165, 166] 中提到的潜在物理和制造变异可被系统容忍。因此，利用这种非均匀编码方案，三位数据可被数字化流式传输至单个忆阻器，且存储的数值可利用\
  \ 3.4.3 节 中提出的读出电路可靠恢复。\n\n### 3.5 基于 ReRAM 的逻辑功能单元\n\n\n\n\n# 基于 ReRAM 的逻辑门\n\n\
  基于 ReRAM 的特性，我们利用 ReRAM 构建逻辑门。本节首先介绍逻辑或门，随后介绍与门。\n\n#### 3.5.1 或门\n\n受文献[170, 171]启发，此处提出了一种逻辑或门。基于\
