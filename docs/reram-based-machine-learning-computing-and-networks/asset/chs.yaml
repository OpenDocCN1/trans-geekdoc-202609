  \n图 5.7 不同原始维度下的硬件性能可扩展性：(a) 面积；(b) 延迟；(c) 能耗；(d) EDP\n\n##### 5.1.2.2 性能评估\n\n\
  基于 ReRAM 的振荡器详细评估见表 5.2。与 [209, 210] 中的设计相比，它具有功耗优势，且易于通过多个电压输入进行控制。由于流过基于 ReRAM\
