  \ ReRAM 模型，![image](img/ch03_si292.gif)、![image](img/ch03_si293.gif)和![image](img/ch03_si294.gif)分别设置为\
  \ 100 ![image](img/ch03_si295.gif)、10 k![image](img/ch03_si296.gif)和 5 k![image](img/ch03_si297.gif)。用于读出\
  \ ReRAM 的运算放大器为 LT1012。仿真在运行于 2.66 GHz、拥有 8 GB 内存的 CPU 上，使用 PSPICE 和 LTSPICE 执行。为演示\
  \ ReRAM 的工作能力，我们考虑了 5 ms 和 10 ms 的脉冲宽度。通过适当调整参数，也可在 ns 量级进行仿真。主要需要调整![image](img/ch03_si298.gif)，正如构建阈值开关\
  \ ReRAM 模型的 Vourkas 所建议的。\n\n#### 3.6.2 基于 ReRAM 的电路\n\n在本小节中，我们将展示基于 ReRAM 的逻辑门和读出电路的操作特性。\n\
  \n##### 3.6.2.1 逻辑运算\n\n基于 ReRAM 的或门在 PSPICE 中进行仿真。负载电阻设置为 10 k![image](img/ch03_si299.gif)。输入脉冲宽度设置为\
  \ 5 ms。基于 ReRAM 的或门输出如图 3.22 所示。\n\n![image](img/PBPC0390-03-f22.jpg)\n\n**图 3.22**\
  \ 利用 ReRAM 实现的或门兼 2 位数据存储\n\n\n\n\n同样地，基于 ReRAM 的与门仿真结果如图 3.23 所示。需要注意的是，脉冲宽度保持足够长以便于更好地理解。\n\
  \n![image](img/PBPC0390-03-f23.jpg)\n\n图 3.23 两输入 ReRAM 与门输出\n\n##### 3.6.2.2 读出电路\n\
  \n此处我们将展示第 3.4.3.2 节中提出的读出电路的输出。仿真在 `LTSPICE` 中进行，使用了文献 [168] 中开发的理想 ReRAM 模型。同样也可以使用文献\
