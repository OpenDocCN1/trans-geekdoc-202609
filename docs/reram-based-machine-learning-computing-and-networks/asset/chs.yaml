  \ 和 `![image](img/ch05_stripin_si9.gif)`。\n\n###### 并行数字化\n\n\n\n第一步称为并行数字化，需要 `ReRAM`\
  \ 交叉阵列。其思路是将矩阵-向量乘法拆分为多个两个向量的内积运算。每个内积由一个 `ReRAM` 交叉阵列计算。对于每个交叉阵列，如图 5.1 所示，所有列均配置相同的元素，对应随机布尔矩阵中的一列，字线（WL）上的输入电压由公式决定。由于\
