  \n# 第 8 章\n\n## 大规模案例研究：压缩感知加速器\n\n### 8.1 简介\n\n用于健康远程监测 [280, 281] 和植入式生物传感器 [282,\
  \ 283] 等应用的生物医学无线电路对能量敏感。为了延长其服务寿命，在获取原始数据时执行降维至关重要。压缩感知 [284] 是一种信号处理技术，它利用信号稀疏性，使信号能在低于奈奎斯特采样定理采样率的条件下重构。将压缩感知技术应用于生物医学硬件的现有工作，侧重于通过字典学习\
  \ [283, 285] 或寻找最稀疏系数的更高效算法 [280, 281, 286] 来实现高效信号重构。然而，这些工作通过改进移动/服务器节点上的重构，而非传感器节点上的数据采集，只能间接减少无线传输的样本数以降低能耗。在本工作中，我们旨在直接在传感器节点上实现高性能信号采集和低采样硬件成本。\n\
  \n\n\n\n### 8.1 简介\n\n在压缩感知中，采样是通过将原始信号向量与线性嵌入矩阵相乘来执行的，这将高维数据向量投影到保留内在信息的低维子空间中。这种简洁的表示被称为低维嵌入。采样矩阵可以是随机的、通用优化的，也可以是针对特定数据集优化的。\n\
  \n随机采样矩阵，如伯努利矩阵或高斯矩阵，虽然更易于构建，但存在两大局限。首先，它们对可恢复性的保证仅是概率性的，因此可能会导致较大的恢复误差。其次，它们的构建独立于所研究的数据，因此无法利用数据集的几何信息。\n\
  \n通用优化采样矩阵，如里德-穆勒码 [287, 288] 或 Puffer 变换 [283]，通过构建互相干度最小化的矩阵，具有确定性的可恢复性。然而，它们仍然独立于感兴趣的数据类型，因此性能无法最大化。\n\
  \n另一方面，数据驱动优化嵌入可以通过额外的学习阶段，利用特定应用中数据集的几何结构，这对于目标数据类型预先确定的生物医学采样硬件尤为有益。由数据驱动优化采样矩阵进行的信号采集能保留更多原始信号的内在信息，从而确保更精确的信号重构和/或更高的压缩比。\n\
  \n大多数现有的数据驱动优化方法仅产生实值嵌入矩阵 [289]。然而，实值采样矩阵的硬件映射比布尔矩阵消耗更多功率。原因在于，对于实值嵌入运算，所需的硬件资源（主要是全加器）与所需精度呈二次方依赖关系，而布尔嵌入映射仅呈线性依赖。因此，布尔采样矩阵更受青睐，因为显著减少的硬件资源有助于提高能效和面积效率。\n\
  \n事实上，随机伯努利矩阵是现有基于 CMOS 实现中为实现低功耗而最广泛使用的采样矩阵 [283, 286, 290]。此外，交叉阵列（或交叉点）结构 [62]\
  \ 中最近出现的电阻式随机存取存储器（ReRAM）[62, 291] 可为矩阵-向量乘法提供内在结构，从而可能实现线性嵌入的高能效和高面积效率硬件实现。然而，有限的\
  \ ReRAM 编程分辨率也倾向于仅将布尔嵌入矩阵映射到 ReRAM 交叉阵列结构中。\n\n因此，采样矩阵的硬件实现面临两难境地。一方面，如果映射数据驱动优化的实值嵌入（如\
  \ NuMax [289]）以获得更好的恢复质量，将预期带来巨大的功耗开销。另一方面，如果映射非数据驱动的随机布尔嵌入或布尔里德-穆勒 [287, 288] 嵌入以获得更好的硬件能效，则无法实现高信号恢复精度。这种权衡如图\
  \ 8.1 所示。图 8.1 还揭示了通过直接截断对 NuMax 进行量化仅在 16 位以上精度下有效，低于该精度将导致显著的性能下降。因此，若无数据驱动优化的布尔嵌入，无法同时实现双方的优势。执行数据驱动布尔嵌入优化的挑战在于，随着大量数据集参与采样矩阵优化，仅有基于实值优化矩阵的凸方法是可行的。\n\
  \n![Figure 8.1](img/PBPC0390-08-f01.jpg)\n\n**图 8.1** NuMax 通过截断量化与本文提出的量化方法的信息损失对比。本文通过提出的量化算法，同时实现了高信号恢复性能和低采样硬件成本。\n\
  \n在本章中，为了实现高性能（数据驱动）和低功耗（布尔）采样，我们提出了一种优化算法，将数据驱动优化的实值采样矩阵转换为布尔采样矩阵，而不是在原始数据集上直接优化布尔嵌入。提出的优化流程如图\
  \ 8.2 所示。由于输入的优化实值嵌入矩阵是针对特定数据集优化的，而提出的算法寻求最小的内在信息损失，因此生成的布尔嵌入矩阵仍针对同一训练数据集进行优化。此外，我们还讨论了基于\
  \ CMOS 技术和新兴非易失性 ReRAM 技术的相应硬件实现，用于获得的优化布尔嵌入。这种能力首次在我们的前期工作 [249] 中被利用。数值实验表明，提出的数据驱动布尔嵌入可以兼顾高信号质量和低采样功耗。具体而言，与非数据驱动的伯努利嵌入相比，它可将图像恢复质量（重构信噪比\
  \ RSNR）提高 9 dB，并将能效提高 ![image](img/ch08_si1.gif)，优于数据驱动实值采样电路。\n\n![Figure 8.2](img/PBPC0390-08-f02.jpg)\n\
  \n**图 8.2** 数据驱动布尔采样矩阵优化的提出流程。\n\n本章贡献总结如下：\n\n*   据我们所知，数据驱动优化的布尔采样矩阵首次被构建。由于其具有布尔性且针对数据集优化，我们在所有现有方案中实现了最高的信号恢复质量和最佳的硬件能效。\n\
  *   我们将寻找最佳变换以将实值采样矩阵量化为布尔矩阵并实现最小信息损失的问题进行了形式化。\n\n本章其余部分组织如下。第 8.2 节介绍压缩感知和近等距嵌入的背景。第\
  \ 8.3 节介绍布尔嵌入的采样硬件及相应的优化问题形式化。第 8.4 节和第 8.5 节详述两种布尔嵌入优化算法。第 8.6 节给出数值结果。\n\n###\
  \ 8.2 背景\n\n#### 8.2.1 压缩感知与等距畸变\n\n近年来，新兴的压缩感知理论使得欠采样信号的恢复成为可能，前提是信号稀疏或在某个基（如小波变换和傅里叶变换）上具有稀疏表示。恢复可通过求解以下问题实现：\n\
  \n```\nmin ||x||_1 subject to y = Phi * Psi * x\n```\n\n其中 `x` 为稀疏系数向量，`Psi` 为原始信号在其上稀疏的基；`Phi`\
  \ 为感知矩阵，`y` (`y = Phi * s`) 为低维欠采样数据。\n\n为确保成功恢复，感知矩阵 (`Phi`) 必须满足受限等距性质 (RIP)，定义如下：若存在\
  \ `delta_s` 使得以下方程对每个向量 `v` 均成立，\n\n```\n(1 - delta_s) ||v||_2² <= ||Phi * v||_2²\
  \ <= (1 + delta_s) ||v||_2²\n```\n\n则 `Phi` 具有等距畸变常数 `delta_s` 的 RIP。所有使用符号的表示法汇总于表\
  \ 8.1。\n\n**表 8.1** 使用的数学符号表示法表\n\n| 符号 | 说明 |\n| --- | --- |\n| `delta_s` | 受限等距性质的等距畸变\
  \ |\n\n\n\n\n\n#### 8.2.2 优化的近等距嵌入\n\n构建具有 RIP（限制等距性质）矩阵的最简单方法是生成随机矩阵。文献 [292] 证明了随机矩阵以极高的概率满足\
  \ RIP，但这并非确定性的。与 RIP 具有概率性的随机伯努利采样矩阵不同，数据驱动采样矩阵可以确保有限给定数据点的 RIP。文献 [289] 中的一项最新工作提出了\
  \ **NuMax** 框架，用于构建具有确定性 RIP 的近等距嵌入矩阵。给定数据集 `X`，NuMax 生成一个优化的连续值嵌入矩阵 `Φ`，使得对于 `x_i,\
  \ x_j ∈ X`，每个成对距离向量 `x_i - x_j` 在嵌入后都能在给定的失真容限 `ε` 内保持其范数。\n\n一旦获得优化的 NuMax 采样矩阵\
  \ `Φ_opt`，信号采集 `y = Φx` 即可通过将嵌入矩阵 `Φ` 与信号向量 `x` 相乘来执行。执行实值嵌入的传统基于 CMOS 电路的数据采集前端如\
  \ 图 8.3 所示。采样电路主要包含两大组件：存储嵌入矩阵的静态随机存取存储器（SRAM）和执行乘法与累加的乘法累加器（MAC）。对于嵌入矩阵 `Φ ∈ R^{M×N}`（`M\
  \ < N`），在每个周期中，`M` 个 MAC 将输入向量 `x` 的一个元素与 `Φ` 的一列相乘，然后加到先前累积的结果上。因此，需要 `N` 个周期才能获得嵌入信号\
  \ `y`。\n\n![image](img/PBPC0390-08-f03.jpg)\n\n图 8.3 基于 CMOS 矩阵-向量乘法器的嵌入电路\n\n由于\
  \ NuMax 产生实值 `Φ`，`Φ` 的精度实质上决定了硬件复杂度。例如，MAC 中具有 4 位分辨率的乘法器（如 图 8.4(a) 所示）需要 16 个全加器。实际上，所需全加器的数量通常取决于\
  \ `Φ` 和 `x` 精度的平方。对于采样矩阵中实值元素的典型精度，16 位分辨率（图 8.1）可能导致每个 MAC 需要多达数百个全加器，这使得实值 NuMax\
  \ 嵌入在信号采集硬件映射方面吸引力大打折扣。\n\n![image](img/PBPC0390-08-f04.jpg)\n\n图 8.4 (a) 用于实值嵌入矩阵的\
  \ 4 位分辨率带乘法器 MAC 的实现；(b) 用于 `{+1, -1}` 嵌入矩阵的 MAC；(c) 具有功耗优化的 `{+1, 0, -1}` 嵌入矩阵\
  \ MAC\n\n### 8.3 用于信号采集前端的布尔嵌入\n\n#### 8.3.1 基于 CMOS 的布尔嵌入电路\n\n布尔嵌入矩阵的映射可以消除乘法器的使用。对于\
  \ `{0, 1}` 布尔嵌入矩阵，仅当布尔被乘数为 `1` 时，MAC 才累加信号数据。对于更通用的 `{+1, -1}` 布尔矩阵，布尔被乘数指示对信号数据进行加法或减法运算。也就是说，所需的全加器资源仅线性依赖于信号\
  \ `x` 的精度。因此，硬件资源可以显著减少。\n\n具体针对 `{+1, -1}` 嵌入矩阵映射，乘以 `-1` 需要计算 2 的补码。直观的方法如 图 8.4(b)\
  \ 所示。乘以 `+1` 时 `x` 信号为 `x`，乘以 `-1` 时为 `~x`。为了获得 2 的补码，使用异或（XOR）逻辑获取每一位的补码，并应用 `C_in\
  \ = 1`（进位 0）。然而，靠近输入端的 2 的补码计算会给组合逻辑带来巨大的动态功耗。相反，图 8.4(c) 中的电路图首先分别累加所有要乘以 `+1`\
  \ 和 `-1` 的数据，并在最后一个周期执行减法。因此，2 的补码电路仅每 `N` 个周期激活一次，这可以极大地提高能效。\n\n为了兼容优化采样矩阵（如 Reed-Muller\
  \ 码 [287, 288] 和 NuMax [289]），需要 SRAM 块来存储矩阵并提供可重构性。对于非优化采样矩阵（如随机高斯和伯努利矩阵），除了将矩阵存储在\
  \ SRAM 中外，还可以在运行时生成矩阵，从而提高硬件效率。在实践中，会使用伪随机数生成器（PRNG）[286, 290]，这避免了耗电的 SRAM 阵列。由于\
  \ PRNG 生成具有预定模式的 0/1 序列，PRNG 的一个问题是自相干性。例如，一个每周期产生 8 位的 PRNG 周期为 256 `N`，当用这种 0/1\
  \ 序列按行填充 `M×N` 采样矩阵时，矩阵的所有行将完全相同。这可以通过增加 PRNG 每周期产生的位数来克服，但代价是更高的硬件复杂度。在有限的硬件资源下，PRNG\
  \ 生成的伪随机数通常会导致信号采集性能下降，不如存储的随机采样矩阵。\n\n#### 8.3.2 基于 ReRAM 交叉阵列的布尔嵌入电路\n\n\n\n\n\
  新兴的 ReRAM 交叉阵列 [62, 191] 提供了一种固有的存内矩阵-向量乘法结构，如图 8.5 所示。与 CMOS 嵌入电路相比，基于 ReRAM 交叉阵列的方法可提供三大主要优势：(1)\
  \ 无需每个周期从外部加载 ![image](img/ch08_si74.gif) 即可将感测矩阵嵌入存储器中；(2) 在单周期内执行矩阵-向量乘法；(3) 因其非易失性而将漏电功耗降至最低。\n\
  \n![image](img/PBPC0390-08-f05.jpg)\n\n**图 8.5** 由新兴非易失性 ReRAM 交叉阵列构成的嵌入电路\n\nReRAM\
  \ 交叉阵列结构由三层组成：顶层的水平导线、底层的垂直导线，以及位于中间层每个交叉点的 ReRAM 器件。对于一个 ![image](img/ch08_si75.gif)\
