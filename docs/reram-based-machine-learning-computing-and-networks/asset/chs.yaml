  \ 实现相比，这种配置以更少的权重量提供了更强大的表征能力。同时，在卷积后应用二值批归一化以加速和稳定训练。除最后一层全连接层外，我们对每个二值卷积层和全连接层都采用二值激活。最后一层全连接层的输出在不进行二值化的情况下送入\
