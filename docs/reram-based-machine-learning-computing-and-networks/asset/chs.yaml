  \ U\n\n5: **当** 未收敛 **时**\n\n6: `![image](img/ch08_si195.gif)` ← `![image](img/ch08_si197.gif)`\
  \ 的量化\n\n7: U, S, V ← `![image](img/ch08_si198.gif)` `![image](img/ch08_si199.gif)`\
  \ 的 SVD\n\n8: T ← UV\n\n9: `![image](img/ch08_si201.gif)`\n\n10: **如果** `![image](img/ch08_si202.gif)`\
  \ **则**\n\n11: `![image](img/ch08_si203.gif)` `![image](img/ch08_si204.gif)` `![image](img/ch08_si205.gif)`\n\
  \n12: **结束如果**\n\n13: **结束当**\n\n14: **结束当**\n\n由于整数约束和正交约束均为非凸，局部最优在大多数情况下并非全局最优。换句话说，解强烈依赖于通向局部近似最优的初始猜测。因此，算法\
  \ 8.1 的外层循环通过生成散布在正交矩阵空间内的大量初始猜测来增加搜索宽度。对于每个初始猜测，它将逐渐收敛到一个局部最优；因此，搜索宽度的增加将比较大量局部最优解并逼近全局最优。\n\
  \n### 8.5 行生成算法\n\n(8.5) 中表述的问题是一个混合整数非线性规划 (MINLP) 问题，因为它同时具有非线性正交约束 `![image](img/ch08_si206.gif)`\
  \ 和整数约束 `![image](img/ch08_si207.gif)`。虽然此类 MINLP 问题可通过现有算法（如遗传算法 [295]）求解，但其效率低下，且仅能处理小规模问题。对于压缩感知中的嵌入矩阵，变换矩阵\
  \ `![image](img/ch08_si208.gif)` 可能有数十行，而矩阵 `![image](img/ch08_si209.gif)` 可能包含数千个布尔变量，因此当前求解器可能无法处理如此规模。在本节中，我们提出了一种行生成算法，也能高效解决该问题。\n\
  \n#### 8.5.1 范数等式约束的消除\n\n(8.5) 中 `![image](img/ch08_si210.gif)` 的正交性意味着两个特定约束：`![image](img/ch08_si211.gif)`\
  \ 的行正交性，即\n\n```\n![image](img/ch08_si438.gif)\n```\n\n以及范数相等性，即\n\n```\n![image](img/ch08_si439.gif)\n\
  ```\n\n其中 `![image](img/ch08_si212.gif)` 是 `![image](img/ch08_si214.gif)` 的第 `![image](img/ch08_si213.gif)`\
  \ 行。两者均意味着大量二次等式约束（非凸），因此难以同时处理。`![image](img/ch08_si215.gif)` 的行的非凸二次范数等式约束表明在满足正交性后对行进行归一化。下文将展示如何在不影响\
