  \ 电阻设置为 10 kΩ 和 1 MΩ 作为导通态和截止态电阻，SET/RESET 电压为 2V，工作频率为 100 MHz。CMOS 和 ReRAM 的集成基于\
  \ [64] 进行评估。\n\n\n\n\n为了评估所提出的架构，我们应用 UCI [184] 和 MNIST [232] 数据集来分析加速器的可扩展性、模型配置分析和性能分析（表\
  \ 6.11）。模型配置首先在 MATLAB 中使用张量火车工具箱 [204] 执行，然后再映射到 3D CMOS-ReRAM 架构上。为了评估模型压缩，我们将我们的方法与基于奇异值分解（SVD）的节点剪枝方法\
