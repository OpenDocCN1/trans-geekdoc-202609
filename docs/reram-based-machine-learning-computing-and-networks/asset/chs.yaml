  ```\n\n当所提量化 `![image](img/ch08_si358.gif)`/1 布尔嵌入在 ReRAM 交叉阵列上执行时，硬件性能进一步显著提升。具体而言，在每次嵌入的操作能耗方面，基于\
  \ ReRAM 交叉阵列的嵌入比基于 CMOS 电路的实值嵌入优越 `![image](img/ch08_si359.gif)`。基于 ReRAM 交叉阵列的嵌入面积比基于\
