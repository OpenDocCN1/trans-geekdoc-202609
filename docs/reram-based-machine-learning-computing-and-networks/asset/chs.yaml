  \ CNN（direct-truncated CNN，采用低精度位 [191]）之间的关键区别如下所述。直接截断 CNN 是在训练后阶段通过降低数值精度获得的，而此处开发的位卷积神经网络则是在二值约束下训练获得的\
  \ [188]。因此，直接截断 CNN 通常会遭受精度损失，但位卷积神经网络却能在最低精度下保留大部分精度。在推理阶段，仅保留二值化权值 `![image](img/ch04_si169.gif)`，从而实现更小的存储开销、更快的推理速度、更高的并行度以及更高的能效。\n\
  \n### 4.4 基于 TNN 的机器学习\n\n前文讨论的神经网络压缩仅通过精度位截断或低秩近似 [192—195] 进行，难以在网络压缩与网络精度之间保持良好的平衡。通过利用高维空间中的自然稀疏性来表示稠密数据，张量化数据格式能够在不造成太大精度损失的情况下，显著压缩神经网络复杂度\
  \ [196]。相比之下，本节将探讨训练过程中的张量火车格式神经网络 [197]。首先介绍基于张量火车的分解与压缩。然后，基于通用神经网络的扩展，讨论张量化神经网络（TNN）。最后，进一步提出了一种采用修正交替最小二乘法（MALS）的\
  \ TNN 分层训练方法。为便于说明，我们先基于单隐藏层神经网络阐述该思路，随后将其扩展至多层神经网络。同时，还开发了一种基于张量火车的神经网络训练方法，该方法结合\
  \ MALS 方法考虑了模型压缩，并提供了复杂度分析。\n\n#### 4.4.1 张量火车分解与压缩\n\n张量是矩阵的自然多维推广。在此，我们将一维数据称为*向量*，记作\
  \ `![image](img/ch04_si170.gif)`。二维（2D）数组称为*矩阵*，记作 `![image](img/ch04_si171.gif)`，高维数组称为*张量*，记作如图\
  \ 4.8 所示。若要从张量中引用某个特定元素，本章使用花体大写字母 `![image](img/ch04_si172.gif)`，其中 `![image](img/ch04_si173.gif)`\
  \ 为张量 `![image](img/ch04_si174.gif)` 的维数。可将 2D 矩阵有效重塑为四维（4D）张量，如图 4.8 所示。\n\n![image](img/PBPC0390-04-f08.jpg)\n\
  \n图 4.8 分块矩阵及其用 4D 张量表示\n\n若 `![image](img/ch04_si175.gif)` 维 `![image](img/ch04_si176.gif)`\
  \ 张量 `![image](img/ch04_si177.gif)` 的张量核 `![image](img/ch04_si178.gif)` 定义为 `![image](img/ch04_si179.gif)`，且每个元素定义\
  \ [197] 为\n\n```\n![image](img/ch04_si336.gif)\n```\n\n则称该张量分解为张量火车数据格式。其中 `![image](img/ch04_si180.gif)`\
  \ 为求和索引，从 1 开始至秩 `![image](img/ch04_si181.gif)` 结束。`![image](img/ch04_si182.gif)`\
  \ 为边界条件，`![image](img/ch04_si183.gif)` 称为模态尺寸。此处，`![image](img/ch04_si184.gif)`\
  \ 为核秩，`![image](img/ch04_si185.gif)` 为此张量分解的核。利用 `![image](img/ch04_si186.gif)`\
  \ 记法，可将上式改写为更紧凑的形式：\n\n```\n![image](img/ch04_si337.gif)\n```\n\n其中 `![image](img/ch04_si187.gif)`\
  \ 为 `![image](img/ch04_si188.gif)` 矩阵，即从 3D 矩阵 `![image](img/ch04_si189.gif)` 切取的一个切片。\n\
  \n这种表示法存储高维数据时内存效率高，因而也能显著节省能量。例如，一个 `![image](img/ch04_si190.gif)` 维张量需要 `![image](img/ch04_si191.gif)`\
  \ 个参数。然而，若采用张量火车格式表示，则仅需 `![image](img/ch04_si192.gif)` 个参数。因此，若能降低各核的秩，便可高效地以高压缩率表示数据并分布式存储。通过将神经网络权值排列为高维数据，可实现神经网络压缩。此处，若神经网络的权值可用张量火车数据格式表示，则定义为\
  \ TNN。例如，二维权值 `![image](img/ch04_si193.gif)` 可通过分解 `![image](img/ch04_si196.gif)`\
  \ 和 `![image](img/ch04_si197.gif)` 重塑为 `![image](img/ch04_si194.gif)` 维张量 `![image](img/ch04_si195.gif)`，且该张量可分解为张量火车数据格式以节省存储空间^(1)。\n\
  \n#### 4.4.2 基于张量火车的神经网络\n\n\n\n\n\n# 基于张量火车的神经网络 (TNN)\n\n为了阐明 TNN，本节从一般的前馈神经网络入手，然后将其扩展到基于张量火车的神经网络。为了便于说明，本节以单隐藏层神经网络为例；相同的原理也可应用于多层神经网络\
  \ [199—201]。\n\n通常，神经网络的训练是基于具有 `N` 个训练样本、`D` 维输入特征和 `C` 个类别的数据特征 `X` 和标签 `Y` 进行的。在训练过程中，需要最小化具有确定权重的误差函数：单隐藏层神经网络的\
  \ `W_in`（输入层）和 `W_out`（输出层）[2]：\n\n```\nE(W_in, W_out) = ||Y - f(X; W_in, W_out)||²\n\
  ```\n\n其中 `f` 是用于根据输入执行预测的训练模型。\n\n本节主要讨论推理（测试）过程，稍后介绍训练过程。每一层的输出基于矩阵乘法和激活函数。例如，第一层的输出\
  \ `H` 在数学上定义为：\n\n```\nH = σ(X W_in + b_in)\n```\n\n其中 `X` 是测试数据。`W_in` 和 `b_in`\
  \ 分别是输入权重和偏置。然后，单隐藏层神经网络的神经网络输出为：\n\n```\nY_pred = H W_out + b_out\n```\n\n```\n\
  Y_pred(c) = H W_out(:, c) + b_out(c)\n```\n\n其中 `c` 表示类别索引 `c ∈ {1, ..., C}`。我们通过神经网络的输出来近似每个类别的预测概率。\n\
  \n## 基于张量火车的神经网络推理\n\n对于基于张量火车的神经网络，**图 4.9** 展示了总体思路。一个二维权重被折叠成一个三维张量，然后分解为张量核\
  \ `G_k`。由于秩 `R` 的值较小，这些张量核是相对较小的矩阵，从而实现了较高的神经网络压缩率。然后，整个神经网络将在张量火车数据格式下进行训练。\n\n\
  ![图 4.9 神经网络权重张量化并用张量火车数据格式表示以实现参数压缩（从 W_in 到 G_k）](img/PBPC0390-04-f09.jpg)\n\n\
  TNN 推理是张量火车矩阵乘向量运算的直接应用 [196,197]。我们将使用 `W_in` 来讨论神经网络的前向传播。首先，我们将 `X` 重排为一个 `d`\
  \ 维张量 `X_tensor`，其第 `k` 维是一个长度为 `n_k` 的向量。此处，`n_k` 和 `R_k` 定义为 `n_k = n_k` 和 `R_k\
  \ = R_k`。不考虑偏置 `b_in` 和激活函数的情况下，张量火车数据格式下的神经网络前向传播 `H` 为：\n\n```\nH = X_tensor ×_1\
  \ G_1 ×_2 G_2 ... ×_d G_d\n```\n\n其中 `G_k`、`G_{k+1}` 和 `G_{k+2}` 是核的切片。我们使用一对 `(k,\
  \ i_k)` 来指代向量 `X_k` 的一个索引，其中 `i_k ∈ {1, ..., n_k}`。由于全连接层是核大小为 `1×1` 的卷积层的特例，这种张量化的权重也可应用于其他卷积层。\n\
  \n这种张量火车矩阵乘向量乘法的复杂度为 `O(d R² n)` [196]，其中 `R` 是核 `G_k` 的最大秩，`n` 是张量 `X_tensor` 的最大模态尺寸\
  \ `n_k`。如果秩 `R` 与一般矩阵-向量乘法相比非常小，这将非常高效。由于每个核都很小且矩阵乘法满足结合律，这也有利于在 ReRAM 设备上进行分布式计算。\n\
  \n#### 4.4.3 TNN 训练\n\n基于张量火车的神经网络最早由 [196] 提出，但由于张量火车数据格式下的反向传播 (BP)，其训练复杂度显著增加。逐层训练以减少的反向传播轮数提供良好的性能，从而显著减少训练时间\
  \ [200—202]。此外，为了成功映射 TNN，需要对 TNN 进行递归训练，以权衡精度和压缩率。因此，本章为 TNN 开发了一种快速逐层训练方法。\n\n\
  TNN 的训练过程与一般神经网络的逐层训练相同，但采用张量火车数据格式。我们首先遵循 [53] 的训练框架讨论一般训练过程，然后将其扩展到 TNN。给定一个具有随机生成的输入权重的单隐藏层，训练过程旨在最小化：\n\
  \n```\nE = ||Y - H W_out||² + λ ||W_out||²\n```\n\n其中 `H` 是由 Sigmoid 函数激活生成的隐藏层输出矩阵，`λ`\
  \ 是一个用户定义的参数，用于平衡训练误差和输出权重 [53]。输出权重 `W_out` 基于最小二乘 (LS) 问题计算：\n\n```\nW_out = H^†\
  \ Y\n```\n\n其中 `H^†` 是 `H` 的伪逆，`C` 是类别数量。`H ∈ R^{N×L}` 且 `Y ∈ R^{N×C}`。\n\n要构建多层神经网络，可以应用反向传播\
  \ [199] 或使用自编码器技术的逐层训练 [200,201]。自编码器层将单层输出 `H` 设置为与输入 `X` 相同，并找到一个最优权重来表示其自身。通过在最终决策层上堆叠自编码器层，我们可以构建多层神经网络。**算法\
  \ 4.3** 总结了采用改进最小二乘求解器 (MALS) 方法的逐层训练。\n\n### 算法 4.3：采用改进最小二乘求解器的神经网络逐层训练\n\n**输入：**\
  \ 输入集 `D = {X, Y}`，`X` 为输入数据，`Y` 为根据层架构确定的期望输出，激活函数 `σ`，隐藏神经元节点数 `L`\n\n**输出：**\
  \ `K` 层神经网络的神经网络权重 `W`\n\n1: **for** `k = 1 to K` **do**\n2: **if** `k == 1` **then**\n\
  3: 对 `X` 和 `Y` 进行因子分解（例如，`X = X_tensor` 和 `Y = Y_tensor`）。\n4: 随机生成张量核 `G_1`、`G_2`\
  \ 和其他张量核以表示张量 `W_in`\n5: **else**\n6: 按照步骤 3、4 随机生成 `W_in`\n7: 基于（公式 4.8）执行张量火车矩阵乘向量乘法，这等价于\
  \ `H = f(X W_in)`\n8: 执行激活函数，这等价于 `H = σ(H)`。\n9: 使用 MALS 计算 `W_out`：`W_out = argmin\
  \ ||Y - H W_out||² + λ ||W_out||²`。\n\n\n\n\n10: 注意：{对于自编码器层，`![image](img/ch04_si273.gif)`\
  \ 是激活矩阵 `![image](img/ch04_si274.gif)` (`![image](img/ch04_si275.gif)`)。对于决策层，`![image](img/ch04_si276.gif)`\
  \ 是标签矩阵 `![image](img/ch04_si277.gif)`。\n\n11: `end if`\n\n12: `end for`\n\nTNN\
  \ 旨在开发高维权重并使用张量列车分解方法对其进行压缩。例如，一个 `![image](img/ch04_si278.gif)` 全连接层可以表示为一个 4D\
  \ `![image](img/ch04_si279.gif)` 张量。因此，我们不生成随机输入权重 `![image](img/ch04_si280.gif)`，而是通过指定每个核\
  \ `![image](img/ch04_si282.gif)` 的秩来生成一个低秩张量 `![image](img/ch04_si281.gif)`。然后输入权重可以通过\
  \ (4.23) 生成，其中每个核 `![image](img/ch04_si283.gif)` 都是随机生成的。\n\n正如在通用神经网络中所讨论的，TNN\
  \ 的训练需要在张量列车数据格式下求解一个最小二乘（LS）问题。对于 (4.29) 中的输出权重 `![image](img/ch04_si284.gif)`，我们提出了一种基于张量列车的最小二乘训练方法，使用\
  \ MALS 算法（在量子动力学中也称为密度矩阵重整化群）[203,204]。`![image](img/ch04_si285.gif)` 最小化的 MALS\
  \ 算法工作流程如下。\n\n对于输出权重 `![image](img/ch04_si286.gif)`，我们有两种潜在的解决方案来实现张量列车数据格式。一种直接的方法是求解通用矩阵最小二乘问题，然后按照迭代截断奇异值分解（SVD）算法\
  \ [197] 将其重塑为高维张量。这类似于高阶 SVD，且在相对较小的压缩率下性能退化显著。相反，我们提出了一种基于张量列车的最小二乘训练方法，使用 MALS\
  \ 算法（在量子动力学中也称为密度矩阵重整化群）[203,204]。\n\n1.  **初始化**：随机初始化核 `![image](img/ch04_si287.gif)`\
  \ 并设置 `![image](img/ch04_si288.gif)`。该过程与 算法 4.3 中的步骤 3、4 相同。\n\n2.  **核扫动**：在固定其他核的情况下优化核\
  \ `![image](img/ch04_si289.gif)`。从 `![image](img/ch04_si290.gif)` 到 `![image](img/ch04_si291.gif)`\
  \ 进行从左到右的扫动。\n\n3.  **生成超级核**：创建超级核 `![image](img/ch04_si292.gif)` 并通过最小化最小二乘问题\
  \ `![image](img/ch04_si293.gif)` 来求解它，重塑 `![image](img/ch04_si294.gif)` 和 `![image](img/ch04_si295.gif)`\
  \ 以适应矩阵-矩阵乘法^(3)。\n\n4.  **分割超级核**：对 `![image](img/ch04_si299.gif)` 进行 SVD 分解，令\
  \ `![image](img/ch04_si300.gif)` 和 `![image](img/ch04_si301.gif)`。`![image](img/ch04_si302.gif)`\
  \ 被确定，`![image](img/ch04_si303.gif)` 被更新。也可以通过移除较小的奇异值来执行截断 SVD 以降低秩。\n\n5.  **扫动终止**：如果达到最大扫动次数或误差小于要求，则终止。\n\
  \n低秩初始化对于使每个核具有较小的秩 `![image](img/ch04_si304.gif)` 非常重要。每次超级核生成都是求解最小二乘问题的过程。`![image](img/ch04_si305.gif)`\
  \ 的 LS 复杂度为 `![image](img/ch04_si306.gif)` [204]，而 SVD 压缩需要 `![image](img/ch04_si307.gif)`，其中\
  \ `![image](img/ch04_si308.gif)`、`![image](img/ch04_si309.gif)` 和 `![image](img/ch04_si310.gif)`\
  \ 分别是激活矩阵 `![image](img/ch04_si311.gif)` 的秩、核 `![image](img/ch04_si312.gif)` 的最大秩和\
  \ `![image](img/ch04_si313.gif)` 的最大模态尺寸。通过使用截断 SVD，我们可以自适应地降低每个核的秩，以降低计算复杂度并节省内存存储。\n\
  \n这种张量化有利于实现大型神经网络。首先，通过执行张量化，神经网络的规模可以被压缩。此外，通过采用较小的张量秩，计算负载也可以减少。其次，权重矩阵的张量化可以将大矩阵分解为许多小的张量核矩阵，这可以有效减少\
  \ ReRAM 的配置时间。最后，小矩阵的乘法可以在 ReRAM 上以高度并行的方式执行，以加速大型神经网络的处理时间。\n\n¹ 感兴趣的读者可参考 [197,198]\
  \ 了解更多关于张量列车数据格式的细节。\n\n² 为便于说明，我们忽略了偏置项。\n\n³ 关于 `![image](img/ch04_si296.gif)`\
  \ 和 `![image](img/ch04_si297.gif)` 的详细信息可参见 [203,204]。由于每个核都是 3D 张量，因此需要置换为 2D 矩阵。在不滥用符号的前提下，我们用\
  \ `![image](img/ch04_si298.gif)` 来表示它。\n\n## 第 5 章\n\n**XIMA：ReRAM 内机器学习架构**\n\n\
  ### 5.1 基于 ReRAM 网络的 ML 运算\n\n在不同的硬件架构中，基于电阻式随机存取存储器（ReRAM）的架构被认为是在面积、功耗和计算延迟方面最高效的架构之一。在本章中，我们将介绍两种类型的\
  \ ReRAM 神经网络，重点关注密集矩阵乘法运算。ReRAM 交叉阵列网络可用作矩阵-向量乘法加速器，并用于说明详细映射。耦合 ReRAM 振荡器网络可应用于低功耗和高吞吐率的\
  \ L2 范数计算。\n\n#### 5.1.1 ReRAM 交叉阵列网络\n\n本节描述二进制 ReRAM 交叉阵列上的矩阵-向量乘法。这是各种数据分析应用（如压缩感知和机器学习\
  \ (ML)）中最常用的运算。例如，特征提取可以通过乘以 [205] 中的伯努利矩阵来实现。\n\n矩阵乘法可以表示为 `![image](img/ch05_stripin_si1.gif)`，其中\
  \ `![image](img/ch05_stripin_si2.gif)` 和 `![image](img/ch05_stripin_si3.gif)` 是被乘矩阵，`![image](img/ch05_stripin_si4.gif)`\
  \ 是结果矩阵。\n\n##### 5.1.1.1 ReRAM 交叉阵列用于矩阵-向量乘法的映射\n\n本节介绍矩阵乘法在 ReRAM 架构上的硬件映射。所需的逻辑是由\
  \ ReRAM 交叉阵列实现的矩阵-向量乘法器。通常，可以利用位线（BL）上的电流汇聚来实现矩阵-向量乘法，然后使用基于 ReRAM 的闪存模数转换器（ADC）进行格式转换。这里介绍了一种三步\
  \ ReRAM 交叉阵列二进制矩阵-向量乘法器，其中 ReRAM 交叉阵列的输入和输出均为二进制数据，无需 ADC。三个 ReRAM 交叉阵列步骤——并行数字化、异或（XOR）和编码——将详细介绍如下。由于一个\
  \ ReRAM 交叉阵列的输出可以连接到另一个 ReRAM 交叉阵列的输入，因此可以在逻辑块中利用多个 ReRAM 阵列进行映射。这里使用符号 `![image](img/ch05_stripin_si5.gif)`\
  \ 来表示二进制矩阵-向量乘法的结果。因此，`![image](img/ch05_stripin_si6.gif)` 遵循\n\n`![image](img/ch05_stripin_si165.gif)`\n\
  \n其中 `![image](img/ch05_stripin_si7.gif)` 是最大结果。为了更清晰地说明三步过程，让我们考虑以下矩阵-向量乘法作为一个说明性示例：\n\
