  \ 的能效改进。\n\n##### 6.2.3.3 基于 3D 单层架构的 TNN 分布式片上设计\n\n###### 实验设置\n\n在实验中，我们实现了不同的基线以进行性能对比。每个基线的详细信息如下：\n\
