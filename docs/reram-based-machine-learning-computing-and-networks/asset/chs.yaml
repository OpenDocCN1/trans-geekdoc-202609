  \n### 5.2 基于 ReRAM 网络的存内机器学习加速器\n\n本节介绍基于 ReRAM 器件的不同计算加速器。首先，将详细阐述分布式 ReRAM 交叉阵列存内架构\
  \ (XIMA)。ReRAM 交叉阵列存储与计算的融合带来了吞吐率优势。随后，将介绍两种 3D CMOS-ReRAM 架构。3D 架构的主要优势在于面积开销更小，且通过\
  \ 3D 互连实现更高的吞吐率。\n\n表 5.2 基于 ReRAM 的振荡器详细评估\n\n![image](img/tab5.2.jpg)\n\n![image](img/PBPC0390-05-f09.jpg)\n\
  \n图 5.9 ReRAM 振荡器网络输出的瞬态响应：(a) Cint = 1pF；(b) Cint = 5pF；(c) Cint = 10pF；(d) Cint\
  \ = 20pF\n\n#### 5.2.1 分布式 ReRAM 交叉阵列存内架构\n\n传统上，处理器和存储器是通过 I/O 连接的独立组件。由于带宽有限且存在显著的\
  \ RC 延迟，I/O 被视为系统整体吞吐率的瓶颈。由于存储器通常采用 H 树结构组织，树的所有叶节点均为数据阵列，因此在此层级引入具有并行性的存内计算极具前景。在下一节中，将讨论一种分布式\
  \ ReRAM 交叉阵列存内架构 (XIMA)。此类架构可用于多种 ML 应用，如第 5.7.5 节所述。\n\n##### 5.2.1.1 存算融合\n\n\
  由于数据和逻辑单元在 ReRAM 交叉阵列上实现时具有统一结构，一半的叶节点被用作逻辑元件，并与数据阵列配对。所讨论的架构如图 5.10 所示。分布式的局部数据-逻辑对可形成一条局部数据路径，使数据能在本地并行处理，无需读出至外部处理器。\n\
  \n在称为 `in-pair control bus`（对内控制总线）的额外控制单元协调下，存内计算按以下步骤执行：(1) 逻辑配置：处理器发出命令，根据所需功能将逻辑\
  \ ReRAM 交叉阵列编程为特定模式，以配置逻辑；(2) 加载操作数：处理器发送数据地址和逻辑加速器输入的相应地址；(3) 执行：逻辑加速器基于配置的逻辑执行计算，若干周期后获得结果；(4)\
  \ 写回：计算结果直接写回数据阵列，而非外部处理器。\n\n![image](img/PBPC0390-05-f10.jpg)\n\n图 5.10 ReRAM\
  \ 交叉阵列上分布式存内计算架构概览\n\n针对不同功能，用于数据存储和逻辑单元的 ReRAM 交叉阵列具有不同的接口。数据 ReRAM 交叉阵列在读写操作期间一次仅激活一行，而逻辑\
  \ ReRAM 交叉阵列则可自发激活所有行，因为行被用作输入端。因此，逻辑交叉阵列的输入输出接口需要模数 (AD) 或数模 (DA) 转换，这可能会抵消所获得的收益。因此，本章提出了一种无需转换的数字接口逻辑\
  \ ReRAM 交叉阵列设计，该设计利用三层 ReRAM 交叉阵列将复杂功能分解为数字交叉阵列可处理的若干简单操作。\n\n##### 5.2.1.2 通信协议与控制总线\n\
  \n外部处理器与存储器之间的传统通信协议由 `store` 和 `load` 动作标识符、路由至数据阵列不同位置的地址以及待操作的数据组成。随着额外的存内计算能力引入，所提出的分布式存内计算架构需要对现有通信协议进行修改。表\
  \ 5.3 中提出了新的通信指令，称为对内控制。\n\n对内控制总线需执行表 5.3 中的指令。`SW` (store word，存字) 指令用于将数据写入数据阵列或存内逻辑中的\
  \ ReRAM。若目标地址在数据阵列中，则为常规写入或结果写回；否则为逻辑配置。`LW` (load word，取字) 指令执行类似于常规读取操作。`ST` (start，启动)\
  \ 指令意为在计算设置完成后开启逻辑模块进行计算。`WT` (wait，等待) 操作是在计算期间停止从指令队列读取。\n\n\n\n\n除了通信指令外，内存地址格式也不同于传统架构。要在所提架构中指定一个字节，地址包含以下标识符段。首先，需要数据-逻辑对索引段，该段由块解码器用于定位目标数据-逻辑对。其次，需要一位标志位来明确目标地址是在数据阵列中还是在存内逻辑交叉阵列中。第三，如果目标是逻辑加速器，则需要额外的段来指定层索引。最后，地址段的其余部分是每个\
  \ ReRAM 交叉阵列中的行和列索引。数据阵列和存内逻辑的地址示例如图 5.11 所示。\n\n表 5.3 外部处理器与控制总线之间的协议\n\n![image](img/tab5.3.jpg)\n\
  \n要执行逻辑运算，需要执行以下指令。首先，可以使用 `SW` 操作存储所需的输入数据和 ReRAM 数值。其次，将发出一条 `ST` 指令以启用所有列和行来执行逻辑计算。同时也会执行\
  \ `WT` 指令以等待逻辑计算完成。最后，执行 `LW` 指令从 ReRAM 交叉阵列的输出端加载数据。\n\n鉴于引入了通用处理器与内存之间的新通信协议，可以设计相应的控制总线，如图\
  \ 5.11 所示。控制总线由指令队列、指令解码器、地址解码器和静态随机存取存储器（`SRAM`）阵列组成。由于 ReRAM 交叉阵列的操作频率低于外部处理器，外部处理器发出的指令将首先存储在指令队列中。然后，它们由指令解码器按先到先服务（`FCFS`）的原则进行分析。地址解码器从指令中获取行和列索引，`SRAM`\
  \ 阵列用于存储临时数据（如计算结果），这些数据稍后将被写回数据阵列。\n\n#### 5.2.2 3D XIMA\n\n##### 5.2.2.1 3D 单层\
  \ CMOS-ReRAM 架构\n\n近期的工作（如 [211–216]）表明，3D 集成支持异构堆叠，因为不同类型的组件可以分别制造，且各层可采用不同技术进行堆叠和实现。因此，将非易失性存储器堆叠在微处理器之上可实现具有成本效益的异构集成。此外，[217–221]\
  \ 中的工作也证明了将 ReRAM 堆叠在 CMOS 上以实现更小面积和更低能耗的可行性。\n\n![image](img/PBPC0390-05-f11.jpg)\n\
  \n图 5.11 控制总线详细结构与通信协议\n\n所讨论的 3D CMOS-ReRAM 加速器如图 5.12(a)所示。该加速器由顶层的 `WL`、底层的 CMOS\
  \ 电路以及由 ReRAM 连接两层的垂直互连组成。在此架构中，ReRAM 交叉阵列执行矩阵-向量乘法以及向量加法，如图 5.12(b)所示。此处，我们以 ![image](img/ch05_stripin_si160.gif)\
  \ 为例展示矩阵-向量乘法的映射方案。矩阵 ![image](img/ch05_stripin_si161.gif) 需要通过写入相应电阻值存储在 ReRAM\
  \ 交叉阵列中。为执行计算，![image](img/ch05_stripin_si162.gif) 被转换为 `WL` 电压，可获得输出电流 ![image](img/ch05_stripin_si163.gif)\
  \ 表示 ![image](img/ch05_stripin_si164.gif)。只需将电流转换为电压并利用 `ADC` 进行数字化转换 [147]。ReRAM\
  \ 交叉阵列的读出电路由底层 CMOS 实现。此外，ReRAM 交叉阵列的控制信号及其他操作（池化、激活）也由 CMOS 实现。\n\n3D 单层 CMOS-ReRAM\
  \ 架构将在后续章节中用于张量化神经网络（`TNN`）。本书将在 6.2 节和 6.2.3 节进一步介绍详细映射与结果。\n\n##### 5.2.2.2 3D\
  \ 多层 CMOS-ReRAM 架构\n\n除了 3D 单层 CMOS-ReRAM 架构外，本章还讨论了用于在线 ML 应用的 3D 多层 CMOS-ReRAM\
  \ 架构。如图 5.13(a)所示，该三层 3D 多层 CMOS-ReRAM 加速器由两层 ReRAM 交叉阵列和一层 CMOS 电路组成。如图 5.13(a)所示，第\
  \ 1 层 ReRAM 交叉阵列作为缓冲区实现，用于临时存储待处理的输入数据。第 2 层 ReRAM 交叉阵列执行逻辑运算，如前所述，如矩阵-向量乘法和向量加法。注意，缓冲区的设计旨在隔离第\
  \ 1 层和第 2 层之间的电阻网络。最后一层 CMOS 包含 ReRAM 交叉阵列的读出电路，并作为逻辑加速器执行除矩阵-向量乘法以外的其他操作，包括流水线除法器、专为除法运算设计的查找表（`LUT`）以及\
  \ ML 中的激活函数。\n\n![image](img/PBPC0390-05-f12.jpg)\n\n图 5.12 (a) 3D CMOS-ReRAM 加速器架构；(b)\
  \ 基于 ReRAM 的矩阵-向量乘法引擎\n\n![image](img/PBPC0390-05-f13.jpg)\n\n图 5.13 (a) 3D 多层 CMOS-ReRAM\
  \ 加速器架构；(b) 所提加速器上的增量 ML 算法映射流程\n\n此外，图 5.13(b) 展示了基于所提架构的增量 ML 工作流程。首先，根据精度要求和数据特征确定\
  \ ML 的详细架构（如层数和激活函数）。其次，分析并重新表述该 ML 算法的操作，使所有操作均可在如图 5.13(a)所示的 3D 多层 CMOS-ReRAM\
  \ 架构中加速。此外，通过平衡精度损失与节能，确定在 ReRAM 交叉阵列上运行的位宽。最后，根据重新表述的操作、节能和加速要求，配置 ReRAM 交叉阵列和\
  \ CMOS 上的逻辑运算。\n\n这种 3D 多层 CMOS-ReRAM 架构在三个方面具有优势。首先，通过利用 ReRAM 交叉阵列存储输入数据，存储器的漏电功耗基本被消除。在具有\
  \ `TSV` 互连的 3D 架构中，该层到下一层的带宽足够大，可执行并行计算。其次，ReRAM 交叉阵列可配置为计算单元，以高并行性和低功耗执行矩阵-向量乘法。最后，借助额外的\
  \ CMOS-ASIC 层，可执行除法和非线性映射等更复杂的任务。因此，ML 的整个训练过程可完全映射到所提的 3D 多层 CMOS-ReRAM 加速器架构上，实现实时训练和测试。\n\
  \n3D 多层 CMOS-ReRAM 架构将在后续章节中用于在线 ML（学习和推理阶段）。我们将在 6.2 节和 6.2.3 节进一步介绍详细映射与结果。\n\n\
  # 第 6 章\n\n## 机器学习算法在 XIMA 上的映射\n\n本章介绍了第 5 章讨论的多种基于电阻式随机存取存储器（`ReRAM`）架构上的多个机器学习应用的映射。针对每个应用，此处均给出了详细的映射策略、实验设置和评估结果。\n\
  \n### 6.1 XIMA 上的机器学习算法\n\n\n\nThis chapter first details the mapping of various\
  \ machine learning applications onto the distributed in-memory computing architecture\
  \ (XIMA), including learning based on Single-Layer Feedforward Neural Networks (SLFN),\
  \ inference on passive arrays based on Binary Convolutional Neural Networks (BCNN),\
  \ and One Selector One ReRAM (1s1R) array inference.\n\n#### 6.1.1 SLFN-based Learning\
  \ and Inference Acceleration\n\nDetails of SLFN-based learning can be found in reference\
  \ [148]. Reference [148] maps the SLFN-based learning and inference process according\
  \ to the algorithms and networks in Section 4.2. In this network, matrix-vector\
  \ multiplication (the primary operation for machine learning on ReRAM crossbars)\
  \ is implemented in three steps, with a detailed mapping strategy developed for\
  \ each step. The process of mapping `![image](img/ch06_si1.gif)` to ReRAM is shown\
  \ in Figure 4.3.\n\nIn matrix-vector multiplication, assuming the output matrix\
  \ is `![image](img/ch06_si2.gif)`. For ease of understanding, we replace `![image](img/ch06_si3.gif)`\
  \ with `![image](img/ch06_si4.gif)` and `![image](img/ch06_si5.gif)` with `![image](img/ch06_si6.gif)`,\
  \ transforming the equation into `![image](img/ch06_si7.gif)`. Each element in `![image](img/ch06_si8.gif)`\
  \ follows:\n\n`![image](img/ch06_si940.gif)`\n\nwhere `![image](img/ch06_si9.gif)`\
  \ and `![image](img/ch06_si10.gif)` are elements of `![image](img/ch06_si11.gif)`\
  \ and `![image](img/ch06_si12.gif)`, respectively. The process of computing `![image](img/ch06_si13.gif)`\
  \ via a four-step ReRAM crossbar will be presented in the following subsections.\n\
  \n##### 6.1.1.1 Step 1. Parallel Digitization\n\nThe first step, parallel digitization,\
