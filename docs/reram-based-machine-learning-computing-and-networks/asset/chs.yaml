  \n我们首先展示在器件工艺变差下，模拟 ReRAM 与数字化 ReRAM 之间的精度对比。然后展示采用直接截断精度的传统 CNN 与所提出的位运算 CNN 之间的精度对比。此处使用了\
  \ CIFAR-10 [233] 和 MNIST [232] 等各种基准。\n\n\n\n\n\n####### 器件变差下的误差\n\n在前面的讨论中，数字化\
  \ ReRAM 交叉阵列比模拟 ReRAM 交叉阵列具有更好的编程精度。图 6.10 展示了在不同写入电压 $V_{write}$ 下单个 ReRAM 器件编程过程的\
  \ 200 次蒙特卡洛仿真，其中电压幅度服从高斯分布 ($\\mu=V_{write}$, $\\sigma=0.1V_{write}$)，每一列代表一个 $\\\
  Delta V_{write}$ 区域。显然，数字 ReRAM 交叉阵列（仅 $R_{on}$ 和 $R_{off}$）比模拟 ReRAM 交叉阵列能实现更好的一致性。ReRAM\
  \ 器件变差下的精度对比如 图 6.11(b) 所示。器件变差百分比定义了最大电阻偏移，每个 ReRAM 器件遵循标准差。蒙特卡洛方法用于器件变差的生成。在 CIFAR-10\
  \ 中，可以观察到当器件变差（ReRAM 电阻值）超过 8% 时，会报告较大的输出电流误差。例如，当器件变差达到 29% 时，数字 ReRAM 仍能达到 87.4%\
  \ 的准确率，仅比无变差时下降 4%，优于模拟 ReRAM 的 84.8% 准确率（下降 7.6%）。在 MNIST 中，即使器件变差大于 27%，数字 ReRAM\
  \ 表现也始终优于模拟 ReRAM。\n\n![image](img/PBPC0390-06-f10.jpg)\n\n**图 6.10** 电压幅度变化服从高斯分布的\
  \ ReRAM 配置\n\n####### 近似计算下的误差\n\n对于精度位直接截断的 CNN，我们采用传统方法先训练全精度（$N$ 位）CNN，然后降低网络中所有权重的精度。不同位宽权重的数值实验结果如\
  \ 图 6.11(b) 所示。此处，逐位 CNN 中的权重为 1 位，其准确率保持不变。在 CIFAR-10 中，虽然直接截断 CNN 的全精度（$N$ 位）准确率可达\
  \ 92.4%，但位宽对准确率影响很大，尤其是当位宽小于 $N$ 时。例如，当精度降至 $k$ 位时，准确率骤降至仅约 11.8%。在 MNIST 中，当位宽小于\
  \ $k$ 位时，直接截断 CNN 的准确率显著下降。结果表明，提出的逐位 CNN 表现远优于直接截断 CNN。\n\n![image](img/PBPC0390-06-f11.jpg)\n\
  \n**图 6.11** (a) 器件变差下与模拟 ReRAM 的准确率对比；(b) 近似计算下与截断 CNN 的准确率对比\n\n####### 可扩展性研究\n\
  \n为实现 BNN 更好的能效，我们进行可扩展性研究，以寻找兼顾良好测试准确率和能效的 BNN 参数。我们以 MNIST 基准上的四层 BNN 为基线（100%\
  \ 能效，如 表 6.6 所示），并改变第 2 层（CONV-2，50）的输出特征图数量和第 3 层（FC-1，500）的隐藏节点数量，如 图 6.12(a)\
  \ 和 (b) 所示。为进行公平比较，我们对每种能效配置进行 20 个周期的训练。当隐藏节点或输出特征图数量减少时，能效虽提高，但会导致更高的测试错误率。综上所述，图\
  \ 6.12(c) 显示第 2 层的隐藏节点对测试准确率更敏感。因此，增加第 2 层的隐藏节点有利于提高准确率，而减少第 3 层的隐藏节点有利于提高能效。\n\n\
