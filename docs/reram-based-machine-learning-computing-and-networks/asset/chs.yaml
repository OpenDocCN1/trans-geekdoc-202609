  \n![image](img/tab6.17.jpg)\n\n在能效方面，我们提出的加速器可达到 1,055.95 GOPS/W，这相当于未压缩神经网络的 7.661\
  \ TOPS/W。我们提出的 TNN 加速器还能比 3D CMOS-ASIC 结果（441.36 GOPS/W）实现 ![image](img/ch06_si938.gif)更好的能效，并比\
  \ Nvidia Tesla K40 实现 ![image](img/ch06_si939.gif)更好的能效，后者可达到 1,092 GFLOPS 且功耗为\
  \ 235 W。\n\n# 第三部分\n\n## 案例研究\n\n# 第 7 章\n\n## 大规模案例研究：ResNet 加速器\n\n### 7.1 简介\n\
  \n残差网络（ResNet）是一种基于卷积神经网络（CNN）的网络，它利用残差连接 [246,247] 采用了层级更深的架构，已成为深度学习的常用网络模型。然而，将\
  \ ResNet 高效地实现到具有高吞吐率（TOPs）且低功耗（mW）等高效推理 [248–251] 的终端硬件上，极具挑战性。这要求从机器学习算法和底层硬件两个方面进行彻底的重新审视。\n\
  \n首先从机器学习算法的角度来看，要在终端硬件上实现深度学习，网络需要被简化。例如，ResNet-50 网络包含近 50 个卷积层，这些层主导了网络的复杂度。由于大多数卷积滤波器现在都是小尺寸（3\
  \ × 3、5 × 5 等）算子。近期工作 [252] 报告了一种直接截断量化方法。最近，一些方法 [253–255] 证明了使用低位宽权重和激活值进行量化的可行性，从而大幅降低了内存需求和计算复杂度。低位宽梯度\
  \ [256] 进一步被推广用于训练 CNN。其他工作在网络训练后执行量化，或在 CNN 上应用直通估计器 [257]。此外，二值神经网络（BNN）被引入 [222,224]，并进一步实现在基于数字电阻式随机存取存储器（ReRAM）的加速器上。虽然其中一些方法在小规模网络模型\
  \ [258–260] 上显示出了良好的性能，但尚无方法将训练量化策略应用于大规模网络（如 ResNet-50）的大规模分类任务（如 ImageNet）并保持一定的准确度。\n\
  \n接下来，从硬件和器件的角度来看，传统计算架构需要在存储器和处理器之间进行大量数据迁移。这导致机器学习（尤其是更深的 ResNet）在带宽和能量方面的效率都很低。最近新兴的非易失性存储器（NVM）技术显示出显著降低的待机功耗，以及存内/近存计算的可能性\
  \ [225,261–263]。例如，交叉阵列中的 ReRAM 器件 [57,62,264] 可用于存储权重，也可用于执行卷积运算。\n\n针对本案例研究，我们利用\
  \ ImageNet [265] 基准开发了一种量化的大规模 ResNet-50 网络，并实现了高准确度。我们进一步表明，量化的 ResNet-50 网络可以在\
  \ ReRAM 交叉阵列上实现，并显著提高了吞吐率和能效。本章的发现可概括如下：\n\n1.  我们首次采用了一种带有 `all-integer computations`（全整数计算）的训练量化策略，应用于\
  \ `large-scale`（大规模）深层 ResNet，将其量化至如此低的位宽，同时受准确度控制约束。\n\n2.  我们提出了一种互补金属氧化物半导体（CMOS）-ReRAM\
  \ 加速器的算法-硬件协同设计，并开发了新型数模转换器（DAC）/模数转换器（ADC）电路。\n\n实验结果表明，与基于中央处理器（CPU）的实现相比，所提出的加速器可实现\
  \ ![image](img/ch07_si4.gif)加速和六个数量级的能效提升；与基于图形处理器（GPU）的实现相比，可实现 ![image](img/ch07_si5.gif)加速和四个数量级的能效提升；并比基于\
  \ CMOS-专用集成电路（ASIC）的实现 ![image](img/ch07_si6.gif)更快和 ![image](img/ch07_si7.gif)更节能。\n\
  \n### 7.2 带量化的深度神经网络\n\n基于 CNN 的网络的传统直接实现将需要不必要的软硬件资源，且并行性较差。[256,266] 中的先前工作建议在训练期间使用带量化约束的神经网络。在本节中，我们提出了一种大规模\
  \ ResNet 模型的硬件友好型算法设计，该设计针对卷积、残差块、批量归一化（BN）、最大池化和激活函数具有量化并行性。不同于传统量化方法执行原始的 32 位浮点运算并附加权重/激活量化过程，我们提出了一种仅在训练和推理期间使用量化变量和计算的全整数算术。由于计算复杂度和存储规模的显著压缩，在\
  \ ReRAM 交叉阵列上进一步实现量化网络成为可能，这将在第 7.4 节中讨论。\n\n#### 7.2.1 ResNet 基础\n\n深层 ResNet 因其有效性，在许多应用中取得了卓越的性能。不同于传统的基于\
  \ CNN 的网络结构，ResNet 利用残差连接，通过训练极深的网络来解决退化问题。\n\n\n\n\n# ResNet 架构与量化\n\n## 7.2.1\
  \ ResNet 结构\n\nResNet 由一系列残差块组成，每个残差块包含若干个堆叠的卷积层。修正线性单元层[267]和 BN 层[190]也被视为 ResNet\
  \ 中卷积层的组成部分。具体而言，我们采用了一个具有 50 层的 ResNet（ResNet-50）[246]，其深度足以提取丰富且具有判别力的特征。ResNet-50\
  \ 的具体结构如图 7.1 所示，包含 16 个残差块，每个残差块包含三个卷积层。每个残差块的末尾都有一个加残差操作，可表示为\n\n$$y = F(x, \\\
  {W_i\\}) + x$$\n\n其中$x$和$y$分别表示残差块的输入和输出特征矩阵，同时$y$可视为下一个残差块的输入，函数$F(x, \\{W_i\\\
  })$表示待学习的残差映射。\n\n![图 7.1 ResNet-50 的详细结构：49 个卷积层和 1 个 FC 层](img/PBPC0390-07-f01.jpg)\n\
  \n## 7.2.2 量化卷积与残差块\n\n卷积是 ResNet 以及任何其他基于 CNN 的网络中计算量最大的操作。近期，文献[188,256]中的低位宽卷积展现出了极具前景的性能，它通过将卷积参数量化为低位宽来减少硬件资源消耗，同时保持相当的精度。\n\
  \n首先，我们介绍采用 4 位量化值$W_q$作为权重矩阵的低位宽卷积。值得注意的是，我们将权重量化为 2 的幂次方。这样，量化算法可以在模型紧凑性和容量之间取得平衡，这已通过测试多种最先进实现方案得到实验验证（详见第\
  \ 5.3.1 节）。此外，应用了半电压工作方案[268]以克服偷路径问题，而较大的权重间隔将有助于在器件变异下保持高鲁棒性（详见第 5.3.2 节）。如图 7.2(a)所示，假设$w$是第$l$层权重矩阵$W$中的全精度元素，$w_q$是量化值元素，它们具有近似关系$w\
  \ \\approx \\alpha w_q$，其中$\\alpha$为非负缩放因子。卷积层中的每个权重元素可按以下方式进行 4 位量化：\n\n$$w_q =\
  \ Q_w(w) = \\text{sign}(w) \\cdot 2^{\\lfloor \\log_2(|w|/\\alpha) \\rfloor}$$\n\
  \n其中$Q_w(\\cdot)$代表所提出的 4 位量化策略，$\\alpha$为非负阈值参数，计算公式为\n\n$$\\alpha = \\frac{1}{N}\
  \ \\sum_{i=1}^{N} |w_i|$$\n\n其中$N$为权重矩阵中的元素数量。此外，我们基于文献[256]开发了一种针对特征的 4 位量化策略，将第$l$层特征矩阵$X$中的实数特征元素$x$量化为\
  \ 4 位特征元素$x_q$。该策略定义如下：\n\n$$x_q = Q_x(x) = \\text{clip}(\\lfloor x/\\beta + 0.5\
  \ \\rfloor, -8, 7)$$\n\n其中$\\lfloor \\cdot \\rfloor$函数取最接近的整数（若小数部分恰好为 0.5 则取较大的整数）。因此，4\
  \ 位量化特征$x_q$的取值范围为$[-8, 7]$，如图 7.2(b)所示。\n\n![图 7.2 (a)权重和(b)特征的 4 位量化策略](img/PBPC0390-07-f02.jpg)\n\
  \n拥有 4 位特征和权重后，我们执行 4 位量化卷积，计算公式为\n\n$$y_{i,j,k} = \\sum_{m,n,c} x_{q_{i+m, j+n,\
  \ c}} \\cdot w_{q_{m, n, c, k}}$$\n\n其中$x_q$和$w_q$分别为 4 位量化特征和权重元素，$y$为计算结果。此处，$H_x,\
  \ W_x, C_x$为特征的模态尺寸，$H_w, W_w, C_w$为权重核的模态尺寸，可见图 7.3。与采用全精度数据格式的实值基于 CNN 的网络相比，由于权重和特征均可用\
  \ 4 位存储，量化卷积层（称为 QConv）所需的软硬件资源可大幅减少。同时，采用 4 位参数的 QConv 在存内计算器件上实现时，可带来更高的能效和并行度。\n\
  \n![图 7.3 采用 4 位量化的深度残差网络 ResNet-50 计算流程](img/PBPC0390-07-f03.jpg)\n\n对于式(2.1)中描述的残差块，我们通过直接替换$x,\
  \ y, F, W, \\alpha$中的元素来执行所提出的优化，如图 7.3 所示。因此，每个残差块末尾的加残差操作也被量化为 4 位。\n\n## 7.2.3\
  \ 量化 BN\n\nBN 能加速训练过程并降低权重缩放的整体影响[190]。归一化过程对于稳定深层 ResNet 至关重要。然而，在原始基于 CNN 的网络中，BN\
  \ 需要大量乘法运算（计算全精度标准差并除以它）。本节提出了 4 位量化 BN，称为量化批归一化（QBN），以大幅压缩计算量。QBN 中的量化计算可表示为\n\n\
  $$y_q = Q_{bn}\\left( \\frac{x_q - \\mu}{\\sqrt{\\sigma² + \\epsilon}} \\gamma +\
  \ \\beta \\right)$$\n\n其中$\\mu$和$\\sigma²$为批次上的期望和方差，$\\gamma$和$\\beta$为对归一化值进行缩放的可学习参数[190]，$Q_{bn}(\\\
  cdot)$为对归一化值进行平移的量化项。在推理阶段，$\\mu, \\sigma², \\gamma, \\beta$固定不变，用于归一化卷积输出。\n\n\
  ## 7.2.4 量化激活函数与池化\n\n激活函数通过 BN 输出的非线性组合产生非线性决策边界。在深层 ResNet 中，常用 ReLU，定义为$f(x)\
  \ = \\max(0, x)$[267]。量化 ReLU 层（称为 QReLUs）可优化为\n\n$$y_q = Q_{relu}(x_q) = \\max(0,\
  \ x_q)$$\n\n其中$x_q$为 QBN 的输出，$y_q$为第$l$层生成的量化激活值。\n\n我们可以通过以下$2 \\times 2$区域示例，将\
  \ QReLUs 函数应用于所有实数矩阵：\n\n$$Y_q = \\begin{bmatrix} \\max(0, 1.2) & \\max(0, -0.5)\
  \ \\\\ \\max(0, 3.7) & \\max(0, -2.1) \\end{bmatrix} = \\begin{bmatrix} 1 & 0 \\\
  \\ 3 & 0 \\end{bmatrix}$$\n\n其中$2 \\times 2$实值矩阵表示 QBN 的输出。QReLUs 过滤掉所有负值，使计算更高效，更适合硬件实现。\n\
  \n\n\n\n此外，可选择性地应用池化操作以从特征中选取最显著的信息，该操作在特征上一个 `![image](img/ch07_si62.gif)` 的连续区域内执行下采样。CNN\
  \ 网络中常用的池化方案有两种：最大池化和平均池化。最大池化取池化区域的最大值，而平均池化取池化区域的平均值。深度 ResNet 以最大池化开始，以全局平均池化层和一个带有\
  \ softmax 层的 `![image](img/ch07_si63.gif)` 路全连接（FC）层结束。为了节省推理时的运行时内存和存储开销，我们可以进行融合，因为\
  \ `![image](img/ch07_si64.gif)` 函数与最大池化函数可交换：\n\n```\n![image](img/ch07_eqn9.gif)\n\
  ```\n\n量化最大池化（称为 QPooling）按以下公式应用：\n\n```\n![image](img/ch07_eqn10.gif)\n```\n\n\
  其中 `![image](img/ch07_si65.gif)` 和 `![image](img/ch07_si66.gif)` 分别为池化前后的特征。\n\n\
  #### 7.2.5 量化深度神经网络概览\n\n带有量化和并行化的深度 ResNet 模型的整体工作流程如 图 7.3 所示。第一层之后，QPooling 将主要工作并将下采样后的特征送入\
  \ 4-bit QConv。然后每个 4-bit QConv 层在 4-bit 量化特征和权重之间执行量化卷积。接着，QConv 的特征输出将由 QBN 和 QReLUs\
  \ 函数进一步处理。每三个卷积层后，将在残差块末尾使用 4-bit 量化参数执行加残差操作。\n\n由于所有主要参数和昂贵计算均以 4-bit 量化执行，所提出的\
  \ 4-bit ResNet 将获得更低的存储开销、更快的速度以及更高的能效。\n\n**算法 7.1：** 使用 4-bit 权重、特征训练量化 ResNet。`![image](img/ch07_si67.gif)`\
  \ 为层数，`![image](img/ch07_si68.gif)` 为参数梯度。\n\n**要求**：前一层输入 `ak−1` 和前一层权重 `wk`\n\n\
  **保证**：更新后的权重 `w∗ k` 。\n\n1. 计算前向传播：\n\n```\n1: for k = 1 : L do\n2: wq k ← quantize(wk\
  \ )\n3: a q k−1 ← quantize(ak−1)\n4: s q k ← compute(wb k , a q k−1)\n5: a qbn k\
  \ ← compute(s q k ,μ, σ2, γ , β)\n6: if max-pooling layer then\n7: a qp k ← compute(a\
  \ qbn k )\n8: a qrelu k ← compute(a qp k )\n9: else\n10: a qrelu k ← compute(a qbn\
  \ k )\n11: end if\n12: a q k ← a qrelu k\n13: end for\n```\n\n2. 计算反向梯度：\n\n```\n\
  14: for k = L : 1 do\n15: ga q k−1 ← backward(ga q k ,wq k )\n16: gwq k ← backward(ga\
  \ q k , a q k−1)\n17: end for\n```\n\n3. 累积参数梯度：\n\n```\n18: for k = 1 : L do\n\
  19: w∗ k ← update(wq k , gwq k )\n20: end for\n```\n\n#### 7.2.6 训练策略\n\n详细的训练策略见算法\
  \ 2.5。假设网络具有前馈线性拓扑，计算以高并行性和高效率的 4-bit 量化执行。注意 `![image](img/ch07_si86.gif)` 和 `![image](img/ch07_si87.gif)`\
  \ 函数代表上述相应的量化和计算方法，`![image](img/ch07_si88.gif)` 函数指定如何在反向传播中计算参数梯度 [254]，`![image](img/ch07_si89.gif)`\
  \ 函数展示当梯度已知时如何更新参数 [269]。\n\n训练后，可获得所提出的 4-bit ResNet 模型，该模型通过量化实现了高度压缩。与原始 ResNet\
  \ 相比，量化 ResNet 从大幅压缩和高并行化中获益良多。它将降低复杂度并提升低位宽参数网络的吞吐率，使在存内计算设备上的实现变得更加切合实际。\n\n###\
  \ 7.3 存内计算设备\n\n本节将介绍可同时用于存储和计算的 ReRAM 交叉阵列设备。它将被用于支持 CMOS-ReRAM 存内计算加速器。第 7.2 节讨论的带有量化的大规模深度\
  \ ResNet 将被映射到其上。\n\n#### 7.3.1 ReRAM 交叉阵列\n\nReRAM [62] 是一款面向未来的存内计算设备。ReRAM 的不同电阻状态可在计算时代表不同参数。除了作为存储内存工作外，ReRAM\
  \ 交叉阵列还可用于执行逻辑运算 [263]，特别是基于点积的卷积。\n\n[258, 259] 等先前工作通常选择仅有两种非易失性状态的两端子 ReRAM 器件：高电阻态（HRS）和低电阻态（LRS）来构建存内架构，如\
  \ 图 7.4(a) 所示。然而，当应用网络变得更深、更复杂时，两端子计算导致 ReRAM 交叉阵列性能受限，同时牺牲了网络精度。为实现所提出的 4-bit ResNet-50，我们采用\
  \ [270] 中的 ReRAM 模型，该模型具有多位电阻状态。所提出的 ReRAM 器件状态由置位电压 `![image](img/ch07_si90.gif)`\
  \ 的分布决定。\n\n```\n![image](img/PBPC0390-07-f04.jpg)\n```\n\n图 7.4 (a) 传统两端子 ReRAM\
  \ 交叉阵列；(b) 带有 4-bit DAC/ADC 电路的 4-bit ReRAM 交叉阵列\n\n在一个 ReRAM 交叉阵列中，给定每条字线（WL）上的输入探测电压\
  \ `![image](img/ch07_si91.gif)`，每条位线（BL）上的电流 `![image](img/ch07_si92.gif)` 成为流过每个\
  \ ReRAM 器件电流的自然乘加运算。因此，ReRAM 交叉阵列可内在地执行矩阵-向量乘法。给定输入电压向量 `![image](img/ch07_si93.gif)`，输出向量\
  \ `![image](img/ch07_si94.gif)` 可表示为\n\n```\n![image](img/ch07_eqn11.gif)\n```\n\
  \n其中 `![image](img/ch07_si95.gif)` 为 ReRAM 电阻 `![image](img/ch07_si96.gif)` 的可配置电导，可代表权重的真实值。与传统\
  \ CMOS 实现相比，ReRAM 器件可实现更高级别的并行性，并消耗更少的功耗（含待机功耗）。\n\n不同于传统的非量化两端子 ReRAM 交叉阵列，所提出的\
  \ 4-bit 量化 ReRAM 交叉阵列如 图 7.4(b) 所示，每个 ReRAM 器件配置 4-bit 电阻。此外，WL 上采用新设计的 4-bit DAC\
  \ 传输数字输入，BL 上采用 4-bit ADC 识别模拟输出。因此，感测到的模拟输出可编码为量化数字信号以产生乘法结果 [237]。\n\n与两端子 ReRAM\
  \ 交叉阵列相比，4-bit ReRAM 交叉阵列在大规模实现中对 IR-drop（压降）具有更好的鲁棒性，使得线电阻对 IR-drop 影响甚微。此外，由于量化\
  \ ReRAM 交叉阵列中仅配置 4-bit 输入，其具有更好的编程精度，可为映射更深、更大规模的网络提供更好的策略。\n\n#### 7.3.2 定制化 DAC\
  \ 与 ADC 电路\n\n\n\nTo accommodate multi-bit networks on the ReRAM crossbar, we customized\
  \ the designs of 4-bit DAC and ADC respectively, as shown in Fig. 7.5(a) and (b).\
  \ To save area, the DAC is implemented using a resistor-resistor (R2R) structure\
  \ with a compact Opamp buffer. Compared to traditional resistor dividers, R2R uses\
  \ uniform resistance values, which is beneficial for achieving better matching.\
  \ The Opamp buffer adopts a feedforward structure to minimize current consumption\
  \ and achieve fast settling. Under a voltage bias of approximately `1.2V` and a\
  \ current bias of `100μA`, the total Opamp current consumption is less than `50μA`,\
  \ achieving a `100MHz` unity-gain bandwidth. Meanwhile, an ADC scheme similar to\
  \ [271] is adopted to reduce switching power, which uses an asynchronous SAR to\
  \ minimize area and energy.\n\n```\nFigure 7.5 Simplified 4-bit (a) DAC and (b)\
  \ ADC circuits\n```\n\n#### 7.3.3 In-Memory Computing Architecture\n\nBased on the\
  \ developed 4-bit ReRAM crossbar devices and novel DAC/ADC circuits, we propose\
  \ a CMOS-ReRAM in-memory computing accelerator, as shown in Fig. 7.6, where both\
  \ storage and computation are implemented within the memory cells.\n\n```\nFigure\
  \ 7.6 In-memory accelerator architecture based on 4-bit ReRAM crossbar for 4-bit\
  \ quantized ResNet-50\n```\n\nIn this architecture, data-logic pairs are laid out\
  \ in a distributed manner, and data transfer between data blocks, logic blocks,\
  \ and the external scheduler is maintained by a control bus. Therefore, logic blocks\
  \ can read data locally and write back to the same data block after logic computation\
  \ is completed [237]. Consequently, the huge communication burden between the memory\
  \ and the general-purpose processor is alleviated, as most data transfers are completed\
  \ within the data-logic pairs. Based on this in-memory computing architecture using\
  \ the 4-bit CMOS-ReRAM accelerator, we will further introduce the strategy for mapping\
  \ the proposed 4-bit quantized ResNet-50 onto it.\n\n### 7.4 Quantized ResNet on\
  \ ReRAM Crossbar\n\nIn this section, we propose detailed strategies for mapping\
  \ the proposed large-scale 4-bit quantized ResNet onto the 4-bit CMOS-ReRAM, including\
  \ quantized convolution and add-residual operations.\n\n#### 7.4.1 Mapping Strategy\n\
  \nTo avoid mapping negative weights on the ReRAM crossbar devices, the 4-bit weights\
  \ shown in Fig. 7.2(a) are decomposed into positive weights `W+` and negative weights\
  \ `W-`. Therefore, the quantized convolution can be expressed as two separate multiplication\
  \ operations, as follows:\n\n```\nEquation (7.5)\n```\n\nto obtain the expected\
  \ computation results (keeping weights positive), and the values of `W+` and `W-`\
  \ will satisfy the following conditions:\n\n```\nEquation (7.6)\n```\n\n```\nEquation\
  \ (7.7)\n```\n\nThis all-positive trick makes the implementation of large-scale\
  \ networks on the ReRAM crossbar more feasible. Specifically, the architecture of\
  \ the quantized ResNet-50 is shown in Table 7.1, which will be further mapped onto\
  \ the 4-bit ReRAM crossbar discussed previously.\n\n**Table 7.1 Network model of\
  \ quantized ResNet-50**\n\n| Layer/residual block | Output size | Parameters (kernels,\
  \ channels) |\n| :--- | :--- | :--- |\n| CONV1 | `112x112` | `7x7, 64` |\n| | |\
  \ `3x3 max pool` |\n| CONV2 | `56x56` | `3x3, 64` |\n| CONV3 | `28x28` | `3x3, 128`\
  \ |\n| CONV4 | `14x14` | `3x3, 256` |\n| CONV5 | `7x7` | `3x3, 512` |\n| | | `7x7\
  \ average pool` |\n| FC | `1000` | softmax output |\n\n#### 7.4.2 Overall Architecture\n\
  \nThe overall mapping of the proposed 4-bit ResNet-50 residual block is shown in\
  \ Fig. 7.7. Due to the existence of both positive and negative WLs, the 4-bit ResNet-50\
  \ requires a `2N x N` ReRAM crossbar, where `N` is the number of elements in the\
  \ feature matrix. 4-bit DAC and 4-bit ADC are used for input and output features,\
  \ respectively. All columns are configured with the same elements, corresponding\
  \ to the quantized weight column `W_col` of the neural network, and the WL voltage\
  \ is determined by the analog input `V_in` converted by the 4-bit DAC. Meanwhile,\
  \ the output of each BL is converted into a digital signal by a 4-bit ADC. `I_out`\
  \ represents the convolution result, as seen in Equation (7.5).\n\n```\nFigure 7.7\
  \ Mapping strategy for a 4-bit quantized ResNet-50 block on 4-bit ReRAM crossbar\n\
  ```\n\nAs stated in Equation (3.5), each quantized weight vector `W_vec` performs\
  \ quantized convolution with multiple input features. Therefore, each logic block\
  \ in Fig. 7.6 stores a quantized vector `W_vec`, while the control bus transfers\
  \ input features sequentially. In this case, quantized convolution can be executed\
  \ in parallel in separate logic blocks.\n\nAlthough these operations are implemented\
  \ on different ReRAM crossbars, their input/output formats are compatible, so they\
  \ can be directly connected as shown in the logic blocks in Fig. 7.6. As discussed\
  \ in the in-memory computing architecture, a ResNet-50 residual block contains three\
  \ convolutional layers, and the add-residual operation is applied at the end of\
  \ the residual block to directly add the input of Layer 1 and the output of Layer\
  \ 3.\n\nIn summary, the 4-bit quantized convolution, BN, ReLU, and add-residual\
  \ operations in Fig. 7.1 can be mapped onto the proposed 4-bit CMOS-ReRAM accelerator,\
  \ while the max-pooling operation is performed in an additional processor. The pipeline\
  \ design is based on Table 7.1. We observe that CONV2, CONV3, CONV4, and CONV5 are\
  \ the stages requiring the most ReRAM cells and computation time. Therefore, more\
  \ logic blocks are allocated to these steps to alleviate the critical path. Since\
  \ the output features from Fig. 7.7 are 4-bit quantized, the area overhead and energy\
  \ consumption of data storage can be significantly reduced. Furthermore, since the\
  \ layers in Table 7.1 are implemented by different data-logic pairs, the data transfer\
  \ volume is also reduced.\n\n### 7.5 Experimental Results\n\n#### 7.5.1 Experimental\
  \ Setup\n\nIn the experiments, we implemented different baselines for accuracy and\
  \ performance comparison. The detailed settings for each baseline are as follows:\n\
  \n1.  **Proposed 4-bit CMOS-ReRAM**: We use the ReRAM model from [272] with uniformly\
  \ separated resistance values ranging from `1 kΩ` to `5 kΩ`, operating at `200MHz`.\n\
  2.  **CPU**: The general-purpose processor implementation is based on Matconvnet\
  \ [227], running on a computer server equipped with `32` cores at `2.4GHz` and `128GB`\
  \ RAM.\n3.  **GPU**: The general-purpose GPU implementation is based on a CUDA-enabled\
  \ graphics card [188] at `1.5GHz`.\n4.  **State-of-the-art ReRAM-based architectures**:\
  \ Two existing ReRAM-based architectures [146, 222].\n5.  **Others**: Conventional\
  \ CNN networks implemented on Field-Programmable Gate Array (FPGA) [273], CMOS-ASIC\
  \ [230], and Micro-automata processor [274].\n\n\n\n\n为了展示所提架构的强大性能，我们采用大规模 ImageNet\
  \ [265] 数据集来分析所提 4 位硬件加速器的精度和性能。首先，模型将一个 `224×224×3` 的 RGB 图像作为第一卷积层的输入，该层具有 `3×3×3×64`\
  \ 组量化滤波器。随后，应用 `QPooling` 为后续层准备数据。接着，第一个残差块的 `QConv` 层在输入特征与权重之间执行量化卷积，随后进行 `QPooling`。然后，在\
  \ `QConv` 后采用 `QBN` 以加速训练。同时，我们在每个 `QConv` 层后采用 `QReLUs` 以稳定流程。对于每个层堆叠，三个级联卷积层配合一个加残差操作构成一个残差块。最后，最后一个\
  \ `FC` 层的输出被送入 softmax 层，以生成 `1000` 个类别的概率分布。\n\n#### 7.5.2 器件仿真\n\n根据 ResNet-50\
  \ 中特征矩阵的尺寸，我们采用一个 `128×128` 的 ReRAM 交叉阵列，其中输入特征数设为 `128`，输出通道数为 `128`。我们采用文献 [275]\
  \ 中的读/写延迟和读/写能量，分别为每个脉冲 `10`ns/`10`ns，每个脉冲 `0.1`pJ/`1`nJ。所提 4 位 DAC 和 ADC 电路的最终布局如图\
  \ 7.7 所示。我们进一步汇报了所提 CMOS-ReRAM 加速器的仿真结果。在图 7.8(a)中，4 位数字波形通过 4 位 DAC 转换为模拟信号。然后在图\
