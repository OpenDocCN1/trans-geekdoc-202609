  \n##### 4.2.2.1 多层神经网络\n\n基于多层神经网络的机器学习因其在从预测到图像分类等众多数据分析应用领域的成功而闻名 [182]。它通常包含两个计算阶段：训练阶段和测试阶段。在训练阶段，特征按前述方式提取，并构建神经网络将特征映射到其类别，利用训练输入来确定网络系数。在测试阶段（推理阶段），基于训练好的网络，通过选择最接近的类别标签值对新输入数据进行分类。主要的计算瓶颈实际上来自训练阶段。\n\
