  \ MATLAB 环境中。\n\n表 6.11 MNIST 数据集在不同隐藏节点数下的带宽提升\n\n![image](img/tab6.11.jpg)\n\n\
  ###### 性能评估\n\n####### 3D 多层 CMOS-ReRAM 加速器可扩展性分析\n由于神经网络处理需要频繁读取网络权重，因此将内存读取延迟优化配置设置为生成\
  \ ReRAM 内存架构。通过采用 3D 实现，仿真结果表明，与 2D 实现相比，内存读取和写入带宽分别显著提高了 51.53% 和 6.51%。对于较少数量的隐藏节点，读/写带宽仍有提升，但瓶颈转移到了内存逻辑控制的延迟上。\n\
  \n为了评估所提出的 3D 多层 CMOS-ReRAM 架构，我们在 MNIST 数据集 [232] 上进行了能量、延迟和面积的可扩展性分析。该数据集被应用于多层神经网络，隐藏节点的数量可能会根据精度要求而变化。因此，如图\
  \ 6.28 所示，评估了所提出加速器在不同 $N_h$（从 128 到 2048）下的改进情况。随着 $N_h$ 的增加，在 3D CMOS-ASIC 和 ReRAM\
  \ 交叉阵列中设计了更多的计算单元来评估性能。神经网络被定义为一个具有权重 $W_1$、$W_2$ 和 $W_3$ 的四层网络。根据图 6.28(b)，对于计算延迟，当\
  \ $N_h=128$ 时，GPU、3D CMOS-ASIC 和 3D CMOS-ReRAM 接近。当 $N_h$ 达到 2048 时，与 3D CMOS-ASIC\
  \ 相比，3D CMOS-ReRAM 可实现 42.3% 的面积节省和 68.7% 的能量节省。尽管计算复杂度与隐藏节点数量不呈线性关系，但 ReRAM 交叉阵列的能量消耗和\
  \ EDP 随着隐藏节点数量的增加而增加。根据图 6.28(d)，当隐藏节点增加时，混合加速器的优势变小，但当隐藏节点数量为 2048 时，其 EDP 仍比 3D\
  \ CMOS-ASIC 好 1.8 倍。\n\n![image](img/PBPC0390-06-f28.jpg)\n\n图 6.28 不同隐藏节点数下硬件性能的可扩展性研究：（a）面积，（b）延迟，（c）能量和（d）EDP\n\
  \n####### 模型配置分析\n图 6.29 显示了 MNIST 数据集的测试准确率和运行时间比较。它显示了一个明显的趋势：随着隐藏节点数量的增加，准确率提高。TTN\
  \ 和通用神经网络之间的运行时间几乎相同。这是由于相对较大的秩 $R$ 和 $O(NR²)$ 的计算成本。这种基于张量火车的神经网络在隐藏节点数为 1024 和\
  \ 2048 时，分别在 2% 准确率损失内实现了 98.5% 和 99.2% 的模型压缩。模型压缩的详细信息如表 6.12 所示。从表 6.12 可以观察到，压缩率与秩\
  \ $R$ 直接相关，其中内存存储可以从 $O(N²)$ 简化为 $O(NR²)$，但与隐藏节点数量没有直接联系。还可以观察到，通过将张量核心秩设置为 35，可以在可接受的准确率损失下实现\
  \ 99.5% 的模型压缩。因此，初始化低秩核心和 MALS 算法中超核心的 SVD 分解是降低核心秩和提高压缩率的重要步骤。\n\n![image](img/PBPC0390-06-f29.jpg)\n\
