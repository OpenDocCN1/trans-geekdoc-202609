  \n##### 6.1.3.2 批归一化、池化与二值化的映射\n\n\n\n\n#### 6.1.4 基于 L2 范数梯度的学习与推理加速\n\n本节细节已在文献[225]中展示。本节阐述了根据第\
  \ 4.2.2 节中的算法和网络，将基于多层前馈神经网络的学习和推理过程进行映射。本节重点关注将所有矩阵-向量乘法运算和 L2 范数计算映射到无源阵列和耦合振荡器基\
  \ XIMA 上。\n\n##### 6.1.4.1 在 ReRAM 交叉阵列网络上映射矩阵-向量乘法\n\n随着二值忆阻器交叉阵列网络的引入，可以执行矩阵-向量乘法[147]。与多电平模拟忆阻器交叉阵列相比，它在工艺变异下具有更好的非均匀性。正如第\
  \ 6.1.2 节所讨论的，机器学习中的关键操作（特征提取和卷积）需要大量的矩阵-向量乘法。\n\n如前所述，关键操作(6.13)和(6.14)需要大量的矩阵-向量乘法。例如，以`W`为例说明在交叉阵列上的乘法映射。对于`W`中的每个元素，遵循以下关系，这里我们以`W\
  \ * x`的操作为例说明在交叉阵列上的乘法映射。对于`W`中的每个元素，遵循\n\n```\ny_i = Σ_j W_ij * x_j\n```\n\n其中`W_ij`和`x_j`分别是`W`和`x`中的元素。\n\
  \n对于图 6.4 中的交叉阵列结构，流过每条位线(BL)的电流遵循\n\n```\nI_BL_i = Σ_j G_ij * V_WL_j\n```\n\n因此，我们可以将`W`和`x`分别映射到`G`和`V`上。通过使用二进制数字化测量流过\
  \ BL 的电流，可以在数字域中得出结果`y`。详细操作可参考文献[147]中的工作。\n\n注意，对于实数，只需进行几次移位加法即可完成利用忆阻器交叉阵列进行矩阵-向量乘法的最终过程。图\
  \ 6.5 表明，我们只需采用 8 位精度的四次移位加法即可计算最终的内积。此外，Sigmoid 函数可以通过查找表(LUT)在忆阻器交叉阵列中实现。\n\n\
  ![image](img/PBPC0390-06-f05.jpg)\n\n图 6.5 (a) 用于乘法的交叉阵列网络；(b) 移位加法\n\n##### 6.1.4.2\
  \ 在耦合 ReRAM 振荡器网络上映射 L2 范数计算\n\n在耦合振荡器网络中，我们使用类似于图 3.15(a)所示的忆阻器振荡器单元（Rs 替换为 PMOS）。通过改变\
  \ PMOS 的栅极电压，可以如图 3.15(d)所示控制振荡频率。参考前人工作[209, 210]，提出的耦合忆阻器振荡器网络如图 5.8(a)所示。此处，振荡器通过忆阻器直接耦合。每个振荡器的振荡频率由多个输入电压决定。如图\
  \ 3.15(d)所述，电压控制 PMOS 可视为电压控制电阻。图 5.8(b)和 5.8(c)分别是单输入和多输入振荡器的原理图。直接耦合后，可以获得一个反相器和一个二极管连接的\
  \ NMOS 反馈电阻。这些元件保证电流仅从振荡器网络流向`V_out`。在`V_out`处设计了一个 RC 电路，以便测量`V_out`的直流电压。输出电压指示耦合振荡器的相对同步程度。\n\
  \n为了在振荡器网络上执行(4.14)，我们只需为图 5.8(c)中的每个振荡器使用两个输入。更具体地说，可以有如下映射函数：\n\n```\nV_in_i =\
  \ α * (W_ij + x_j)\n```\n\n其中`α`是将振荡器输入电压关联起来的比例因子，`W_ij`和`x_j`分别是矩阵`W`和`x`中的元素。\n\
  \n正如文献[209, 210]所述，当图 5.8(c)中每个振荡器有两个输入时，耦合振荡器网络可以作为匹配度(DOM)电路工作，通过将`V_out`拟合为`a\
  \ * V_in² + b * V_in + c`多项式来计算 L2 范数。因此，输出电压遵循\n\n```\nV_out = k * ||W - x||² +\
  \ V_offset\n```\n\n其中`k`是拟合参数，`V_offset`是`W = x`时的输出电压。\n\n因此，可以利用耦合忆阻器振荡器网络实现机器学习中的\
  \ L2 范数误差函数。L2 范数结果是通过曲线拟合而非精确计算获得的。与其他实现相比，这种振荡器网络能以快得多的速度完成运算，因为平方运算`(W_ij - x_j)²`可以由振荡器电路同时执行。此外，累加也由耦合网络自动实现。\n\
  \n##### 6.1.4.3 多层神经网络在 ReRAM 网络上的映射流程\n\n基于耦合忆阻器振荡器网络和二值忆阻器交叉阵列网络，我们可以如图 6.6 所示，加速机器学习中基于直接梯度的\
  \ L2 范数最小化。对于模型部分，我们使用两种类型：忆阻器振荡器和忆阻器交叉阵列。我们在振荡器网络中寻找参数以计算 L2 范数，并在交叉阵列网络上映射以计算数字化的矩阵-向量乘法。随后，可以生成`W_1`和`W_2`的初始权重来计算梯度`∇L`。可得出使`L`最小化的最佳方向。该过程将重复多次，直到达到最小化，仅当`∇L\
  \ = 0`时停止。\n\n![image](img/PBPC0390-06-f06.jpg)\n\n图 6.6 机器学习在忆阻器网络上的映射流程\n\n####\
  \ 6.1.5 XIMA 架构上机器学习算法的实验评估\n\n\n\n\n我们将展示几种机器学习应用在 XIMA 上的详细映射，包括基于 SLFN 的学习、基于\
  \ BCNN 的无源阵列推理以及 1S1R 阵列推理。\n\n##### 6.1.5.1 基于 SLFN 的学习与推理加速\n\n###### 实验设置\n\n\
  硬件评估平台实现于一台配备 4.0 GHz 核心和 16.0 GB 内存的计算机服务器上。特征提取分别由通用处理器、基于 CMOS 的专用集成电路 (ASIC)、基于数字化\
  \ ReRAM 交叉阵列的非分布式存内计算以及分布式存内计算来实现。对于 ReRAM 交叉阵列设计评估，根据文献 [206]，ReRAM 的电阻分别设定为 1\
  \ kΩ 和 1 MΩ 作为导通态和截止态电阻。\n\n通用处理器方案通过在 4.0 GHz 桌面端运行 MATLAB 实现。对于 CMOS-ASIC 实现，我们使用\
  \ Verilog 进行实现，并利用 CMOS 65 纳米低功耗工艺设计套件 (PDK) 进行综合。对于基于 ReRAM 交叉阵列的方案，我们使用 SPICE\
  \ 工具 NVM-SPICE [63] 在电路层面验证功能。通过分析机器学习算法，我们获得了基本运算操作及所需的 ReRAM 交叉阵列逻辑单元数量。\n\n通用处理器实现的工作频率为\
  \ 4.0 GHz，而 CMOS-ASIC 特征提取设计的频率为 1.0 GHz。对于基于所提 ReRAM 交叉阵列的存内计算，写电压设为 V，读电压设为 V，持续时间为\
  \ ns。此外，还基于文献 [207] 的设计进行了 ReRAM 交叉阵列上的模拟计算以作对比。\n\n下文中，我们将首先展示 ReRAM 交叉阵列上矩阵-向量乘法的性能。引入可扩展性研究，展示不同矩阵尺寸下的面积、能耗和计算延迟。随后，呈现基于存内架构的人脸识别评估。最后，我们将阐述三维\
  \ (3D) CMOS-ReRAM 架构上的目标分类。不同位宽配置的性能也将展示。此外，3D CMOS-ReRAM 方案将与 CMOS-ASIC 以及图形处理单元\
  \ (GPU) 实现进行对比。\n\n###### 性能评估\n\n在本工作中，我们在存内架构上实现了人脸识别应用。我们将首先分析人脸识别的计算复杂度，然后评估其性能。\n\
