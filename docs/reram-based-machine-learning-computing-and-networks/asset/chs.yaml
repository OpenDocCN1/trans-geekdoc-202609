  \n##### 4.2.1.3 基于增量 LS 求解器的学习\n\n(4.5)中的目标函数是一个 LS 问题，可以使用反向传播（BP）或基于矩阵运算的直接解来求解。由于目标是利用最新的训练样本进行增量学习，迭代基于梯度的\
