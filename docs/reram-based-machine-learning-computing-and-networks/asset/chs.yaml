  \ 和 HRS 单元的均值分别为 `![image](img/ch08_si368.gif)` 和 `![image](img/ch08_si369.gif)`，标准差分别为\
  \ `![image](img/ch08_si370.gif)` 和 `![image](img/ch08_si371.gif)`。\n\n\n\n\n通过不同的\
  \ ![image](img/ch08_si372.gif) 和 ![image](img/ch08_si373.gif)，从 图 8.10 可以观察到，性能下降更容易受到\
  \ LRS 电阻变化的影响，而对 HRS 变化不太敏感。在实践中，HRS 变化 ![image](img/ch08_si374.gif) 约为 ![image](img/ch08_si375.gif)\
  \ [301]，而 LRS 变化 ![image](img/ch08_si376.gif) 大约为 ![image](img/ch08_si377.gif) [301]。真实世界的\
