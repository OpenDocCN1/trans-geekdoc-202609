  \ 的 RGB 图像作为第一层的输入。我们使用 `![image](img/ch06_si347.gif)` 组二值滤波器，每组包含三个二值滤波器，分别处理来自\
  \ R、G 和 B 通道的数据。每个二值卷积层的宽度和高度固定为 `![image](img/ch06_si348.gif)`，步长为 `![image](img/ch06_si349.gif)`，零填充为\
  \ `![image](img/ch06_si350.gif)`。二值卷积层在输入特征图和权重之间执行位运算卷积，随后进行位运算批归一化和二值激活。请注意，全连接层的计算可视为步长为\
  \ `![image](img/ch06_si351.gif)`、零填充为 0 的卷积。因此，我们也将全连接层中的矩阵乘法视为卷积处理。\n\n如 表 6.2\
