  \ 上噪声的容限。因此，在压缩感知信号采集前端硬件复杂度保持不变且恢复质量不受影响的情况下，消除了范数等式约束。\n\n#### 8.5.2 正交约束的凸松弛\n\
  \n\n\n在构建具有正交行的变换矩阵 `![image](img/ch08_si226.gif)` 并同时最小化代价函数具有挑战性，因此我们提出了一种凸行生成算法来寻求局部最优解。其思路是在最小化代价函数的同时，一次构建\
  \ `![image](img/ch08_si227.gif)` 的每一行。假设 `![image](img/ch08_si228.gif)` 是已构建的、具有正交性的前\
  \ `![image](img/ch08_si229.gif)` 行，要构建第 `![image](img/ch08_si230.gif)` 行 `![image](img/ch08_si231.gif)`，\n\
  \n```\n![image](img/ch08_si444.gif)\n```\n\n换句话说，每次构建新行 `![image](img/ch08_si232.gif)`\
  \ 时，它必须与之前构建的 `![image](img/ch08_si233.gif)` 正交。迭代行生成算法如算法 8.2 所示。从几何角度看，算法 8.2\
  \ 迭代地在 `![image](img/ch08_si234.gif)` 维空间中寻找一组正交基。初始时 `![image](img/ch08_si235.gif)`\
  \ 为空，因此第一个方向向量拥有最大的自由度来最小化代价函数。选定第一个基向量后，算法在剩余的 `![image](img/ch08_si236.gif)` 维子空间中寻找能最好地最小化目标函数的最佳基向量。此过程迭代执行，直到在仅具备长度自由度的一维子空间中选定最后一个方向。\n\
  \n由于 `![image](img/ch08_si237.gif)` 是方阵，算法 8.2 总存在解。因此，(8.18) 中包含 `![image](img/ch08_si238.gif)`\
  \ 个整数变量的 MINLP 问题被松弛为 `![image](img/ch08_si239.gif)` 个 MINLP 子问题，每个子问题仅包含 `![image](img/ch08_si240.gif)`\
  \ 个整数变量。\n\n### 算法 8.2：迭代行生成算法\n\n**输入**：实值嵌入矩阵 `![image](img/ch08_si241.gif)`\n\
  \n**输出**：正交变换矩阵 `![image](img/ch08_si242.gif)`，优化后的布尔嵌入矩阵 `![image](img/ch08_si243.gif)`\n\
  \n1. 初始化 `![image](img/ch08_si244.gif)` = `![image](img/ch08_si245.gif)`，`![image](img/ch08_si246.gif)`\
  \ = `![image](img/ch08_si247.gif)`\n2. **for** `![image](img/ch08_si248.gif)` to\
  \ `![image](img/ch08_si249.gif)` **do**\n3. 通过求解 (8.22) 中的问题获取 `![image](img/ch08_si250.gif)`\n\
  4. 更新 `![image](img/ch08_si251.gif)`，`![image](img/ch08_si252.gif)`\n5. **end for**\n\
  \n#### 8.5.3 整体优化算法\n\n求解 (8.18) 的整体算法如算法 8.2 所示。循环内的 0-1 规划问题 (8.22) 可通过分支定界法轻松求解，前提是布尔变量的数量保持较小。分支定界法广泛实现于\
  \ MOSEK [296] 和 BARON [297] 等求解器中。\n\n若无行生成线性化，分支定界法无法应用，因为正交约束强非线性，导致每个子问题的上下界评估极其复杂。此外，行生成线性化显著减少了布尔变量数量，将最坏情况复杂度从\
  \ `![image](img/ch08_si253.gif)` 降至 `![image](img/ch08_si254.gif)`。因此，行生成结合广泛可用的整数规划求解器可求解\
  \ (8.18) 中形式化的问题。\n\n### 8.6 数值结果\n\n#### 8.6.1 实验设置\n\n本部分从软硬件两个角度评估不同的压缩感知采样矩阵。数值实验在配备\
  \ 3.6 GHz Intel i7 处理器和 16 GB 内存的台式机上，于 MATLAB 中执行。采样矩阵的软件性能主要由其信号恢复质量表征。为此，使用了\
  \ LFW（Labeled Faces in the Wild）图像数据 [298] 和生物医学心电图（ECG）数据 [299]。针对两类数据，首先应用 NuMax\
  \ [289] 优化，并变化训练参数 `![image](img/ch08_si255.gif)` 的值 `![image](img/ch08_si256.gif)`，NuMax\
  \ 生成了不同秩的优化实值采样矩阵。如 图 8.2 流程图所示，随后应用所提算法将 NuMax 采样矩阵布尔化。除上述数据驱动采样矩阵外，还对比了随机高斯、伯努利和\
  \ Reed-Muller [287, 288]（非数据驱动优化）采样。RSNR 作为信号恢复质量指标，定义为\n\n```\n![image](img/ch08_si445.gif)\n\
  ```\n\n其中 `![image](img/ch08_si257.gif)` 为原始信号，`![image](img/ch08_si258.gif)` 为重构信号。\n\
  \n关于硬件成本考量，上述所有采样矩阵均可映射至三种不同的采样硬件配置。具体评估了 MAC/SRAM、MAC/PRNG 和 ReRAM 交叉阵列配置及其变体，以考察所有采样方案的硬件友好度。对于实值\
  \ MAC，采用 16 位分辨率，因为我们发现高于 16 位的分辨率不会提升精度，如 图 8.1 所示。对于 ReRAM 交叉阵列，根据 [293]，使用 1K\
  \ `![image](img/ch08_si259.gif)` 和 1M `![image](img/ch08_si260.gif)` 分别作为 ReRAM\
  \ 导通电阻和截止电阻。ReRAM 交叉阵列面积通过单元面积（4 `![image](img/ch08_si261.gif)`）乘以采样矩阵尺寸，并加一列以计算电流偏移进行评估，详见\
  \ 3.2 节。ReRAM 交叉阵列动态功耗在 1,000 个随机输入模式下统计评估，输入遵循均匀分布，电压范围 `![image](img/ch08_si262.gif)`\
  \ 至 `![image](img/ch08_si263.gif)` V（`![image](img/ch08_si264.gif)` V 和 `![image](img/ch08_si265.gif)`\
  \ V [293]），操作时长 `![image](img/ch08_si266.gif)` ns [293]。实值和布尔数字 CMOS 矩阵乘法器设计均用 Verilog\
  \ 实现，并基于 GlobalFoundries 65-nm 低功耗工艺设计包（PDK）综合。PRNG 设计 [286] 也已实现并综合。存储采样矩阵的 SRAM\
  \ 通过 CACTI [300] 内存建模工具评估，选用 65-nm 低待机功耗工艺。\n\n表 8.3 列出了本节将对比的所有有效采样矩阵与硬件配置组合。在所有组合中，我们将展示所提采样矩阵能同时实现最佳信号恢复质量和硬件效率。\n\
  \n**表 8.3 待对比嵌入方法汇总**\n\n```\n![image](img/tab8.3.jpg)\n```\n\n#### 8.6.2 IH 算法在高维\
  \ ECG 信号上的表现\n\n训练阶段（NuMax）中，从数据库 [299] 随机选取 1,000 个维度为 256 的 ECG 周期作为数据集 `![image](img/ch08_si282.gif)`，由此在集合\
  \ `![image](img/ch08_si283.gif)` 中产生约 100 万个成对距离向量。测试阶段另选 1,000 个 ECG 周期作为数据集 `![image](img/ch08_si284.gif)`，其与学习数据集\
  \ `![image](img/ch08_si285.gif)` 无重叠。在未见数据集 `![image](img/ch08_si286.gif)` 上，利用\
  \ Battle-Lemarie 小波基求解 (8.1) 进行 ECG 信号重构。\n\n##### 8.6.2.1 算法收敛性与有效性\n\n算法 8.1 的效率可从寻找局部最优和全局最优两方面考察。寻找局部最优的效率通过收敛速率评估。当近似误差\
  \ `![image](img/ch08_si287.gif)` 不再改善时，局部搜索终止。\n\n\n\n给定特定的 RIP 上界，NuMax [289] 提供不同秩的\
  \ $\\Phi$。在 0.1 的 RIP 约束下，NuMax 生成一个 $\\Phi \\in \\mathbb{R}^{m \\times n}$ 采样矩阵。算法\
  \ 8.1 应用于 $\\Phi \\in \\mathbb{R}^{m \\times n}$，总共进行 10,000 次重复局部搜索，其收敛情况如图 8.6(a)所示。可以观察到，相对误差在前几次迭代中大幅降低。放大的子图显示，局部搜索平均在\
  \ 50 次迭代内收敛，此处收敛定义为连续两次迭代中误差减小量小于 1e-6。通常情况下，局部最优可在 100 次迭代内找到。\n\n![image](img/PBPC0390-08-f06.jpg)\n\
  \n图 8.6 算法效率：(a) 局部搜索收敛和 (b) 全局搜索收敛\n\n全局搜索通过在 $\\Phi \\in \\mathbb{R}^{m \\times\
  \ n}$ 的正交矩阵空间中散布许多初始猜测，并比较相应的局部最优来实现。不同初始猜测数量下的误差如图 8.6(b)所示。考虑到布尔约束和正交约束，公式 (8.5)\
  \ 中形式化的问题通常是 NP-hard 的。因此，虽然通过散布指数级更多的初始猜测可以改善相对误差，但未观察到收敛。因此，应设计高效的搜索策略，以尽可能散布更多的初始点，并将每个初始猜测的局部搜索限制在\
  \ 100 次迭代以内。\n\n##### 8.6.2.2 ECG 恢复质量对比\n\n$m/n = 0.25$ 下的 ECG 信号恢复示例如图 8.7 所示。对于非数据驱动采样矩阵，随机伯努利矩阵和高斯矩阵表现出相似的重构质量。换句话说，增加随机数的位数不会提高恢复质量。这是因为增加随机数的位数不会获得任何额外信息。\n\
  \n![image](img/PBPC0390-08-f07.jpg)\n\n图 8.7 不同采样矩阵的恢复质量对比：(a) $m/n = 0.25$ 时的恢复\
  \ ECG 信号示例和 (b) 1,000 个 ECG 周期的 RSNR\n\n基于 PRNG 的伯努利矩阵表现出最低的重构信号质量。这是因为，PRNG 生成具有预定模式的\
  \ 0/1 序列，存在自相干性问题。例如，一个每周期 8 位的 PRNG 在 $m/n = 0.25$ 时周期为 256，当用这样的 0/1 序列按行填充采样矩阵时，矩阵的所有行将完全相同。\n\
  \nReed-Muller 码通过最小化不同行/列间的相关性来优化采样矩阵，这有助于提高采样性能。作为一种适用于所有数据类型的通用采样矩阵，它无法利用 ECG\
  \ 信号的等距特性，这限制了其在特定应用中的性能。具体而言，与随机伯努利采样相比，它仅显示出 1 dB 的改进。\n\n数据驱动的 NuMax 实值采样表现出最佳的恢复质量（最高\
  \ RSNR），如图 8.7(b)所示。所提出的迭代启发式 (IH) 算法将实值 NuMax 采样量化，仅带来微小的质量损失。具体而言，在欠采样率 $m/n =\
  \ 0.25$ 下，IH (lv2) 的 RSNR 分别比 Reed-Muller、伯努利和伪伯努利采样高出 8、9 和 10 dB。此外，通过 (8.15)\
  \ 的 3 级量化比通过 (8.13) 的 2 级量化能保留更多信息。IH (lv3) 的 RSNR 比 IH (lv2) 边际性地高出 0.48 dB。IH\
  \ (lv3) 采样矩阵 $\\Phi \\in \\{-1, 0, 1\\}^{m \\times n}$ 相比 IH (lv2) $\\Phi \\in \\\
  {-1, 1\\}^{m \\times n}$ 将产生额外的硬件开销。\n\n图 8.7(a) 直观展示了不同采样矩阵下恢复的 ECG 信号片段质量。数据驱动采样矩阵，即\
  \ NuMax、IH (lv2) 和 IH (lv3)，能够恢复与原始信号紧密吻合的信号。\n\n#### 8.6.3 低维图像块上的行生成算法\n\n在训练阶段，从所有图像中随机选取\
  \ 6,000 个大小为 $8 \\times 8$ 的图像块作为数据集 $\\mathcal{X}_{train}$，这在集合 $\\mathcal{D}_{train}$\
  \ 中产生约 1800 万个成对距离向量。在测试阶段，另选取 6,000 个大小为 $8 \\times 8$ 的图像块作为数据集 $\\mathcal{X}_{test}$，与学习数据集\
  \ $\\mathcal{X}_{train}$ 无重叠。通过使用 2D 离散余弦变换 (DCT) 基求解 (8.1)，在未见数据集 $\\mathcal{X}_{test}$\
  \ 上进行图像重构。\n\n采用遗传算法 [295] 作为 (8.5) 中 MINLP 的基线求解器，与算法 8.3 中提出的算法进行对比。两种算法在相同的时间量下运行，即\
  \ $T = 100r²$ s，其中 $r$ 是 $\\Phi$ 的秩，指示问题的规模。\n\n##### 8.6.3.1 算法有效性\n\n所提出的实值矩阵布尔化背后的思想是保持\
  \ NuMax 采样矩阵的 RIP，这与基于截断的量化不同。量化过程中的信息损失直接与 RIP 保持相关。本部分的算法有效性将通过等距畸变 $\\delta_{iso}$\
  \ 来检验，其定义见 (8.2)。\n\n**算法 8.3：** 迭代行生成算法\n\n**输入**：实值嵌入矩阵 $\\Phi \\in \\mathbb{R}^{m\
  \ \\times n}$\n\n**输出**：正交变换矩阵 $Q \\in \\mathbb{R}^{n \\times n}$，优化的布尔嵌入矩阵 $\\\
  Phi_B \\in \\{-1, 1\\}^{m \\times n}$\n\n1: 初始化 $\\Phi_B^{(0)} = \\text{sign}(\\\
  Phi)$，$Q^{(0)} = I_n$\n\n2: **for** $k = 1$ **to** $K$ **do**\n\n3: **while** $\\\
  text{not converged}$ **do**\n\n4: **for all** branch with feasible set $\\mathcal{F}$\
  \ **do**\n\n5: 将可行集 $\\mathcal{F}$ 划分为 $\\mathcal{F}_1$ 和 $\\mathcal{F}_2$\n\n6:\
  \ 评估 $LB(\\mathcal{F}_1)$，$LB(\\mathcal{F}_2)$\n\n7: 更新全局下界 $LB_{global}$\n\n8:\
  \ 评估 $UB(\\mathcal{F}_1)$，$UB(\\mathcal{F}_2)$\n\n9: 更新全局上界 $UB_{global}$\n\n10:\
  \ **if** $LB > UB_{global}$ **then**\n\n11: 剪枝 $\\mathcal{F}_1$ 或 $\\mathcal{F}_2$\n\
  \n12: **end if**\n\n13: **end for**\n\n14: **end while**\n\n15: 更新 $\\Phi_B^{(k)}$，$Q^{(k)}$\n\
  \n16: **end for**\n\n所有嵌入的畸变均在未见数据集 $\\mathcal{X}_{test}$ 上测试（见图 8.8）。两种随机嵌入的等距畸变几乎保持不变。经过在图像数据集\
  \ $\\mathcal{X}_{train}$ 上优化，NuMax 和提出的（量化 NuMax）均显著优于随机嵌入。聚焦于硬件友好的布尔采样矩阵，优化布尔嵌入的等距畸变平均比随机布尔嵌入好\
  \ $3.2\\times$。\n\n![image](img/PBPC0390-08-f08.jpg)\n\n图 8.8 不同嵌入在未见数据集 $\\mathcal{X}_{test}$\
  \ 上的等距畸变\n\n\n\n由于近似正交旋转，与 NuMax 方法相比，优化后的布尔嵌入在等距畸变 `![image](img/ch08_si338.gif)`\
  \ 方面会受到一定惩罚。对于遗传算法，由于其经历的畸变高于所提算法，可以推断算法 8.3 能找到更精确的解。此外，可以观察到当欠采样率 `![image](img/ch08_si339.gif)`\
  \ 增加时，遗传算法会失效，这是因为所提基于行生成的算法在行数 `![image](img/ch08_si340.gif)` 增加时所需时间呈线性增长，而遗传算法所需时间呈指数增长。而且，遗传算法提供的解是随机的，无法保证其有效性，而所提算法是确定性的。\n\
  \n##### 8.6.3.2 图像恢复质量对比\n\n`![image](img/ch08_si343.gif)` 下的恢复示例如 图 8.10(a) 所示。蓝框中的重建图像对应于具有低功耗硬件实现的布尔嵌入，红框中的图像来自基于优化的方法，显示出较低的恢复误差。遗传算法也是基于优化的，但其有效性不足为据。因此，只有所提方法能同时实现低功耗和高恢复性能。数值图像重建质量如\
  \ 图 8.10(b) 所示。两种随机嵌入显示出相似的重建 RSNR，平均比所提优化布尔采样矩阵低 8.3 dB。优化布尔嵌入的 RSNR 接近 NuMax 嵌入，由于近似正交旋转导致的信息损失，其低\
  \ 2.5 dB。\n\n```\n![image](img/PBPC0390-08-f09.jpg)\n```\n\n图 8.9 不同嵌入矩阵的恢复质量对比：(a)\
  \ `![image](img/ch08_si341.gif)` 下的恢复图像示例和 (b) 6,000 个 `![image](img/ch08_si342.gif)`\
  \ 图像块的 RSNR\n\n```\n![image](img/PBPC0390-08-f10.jpg)\n```\n\n图 8.10 (a) 图像信号和 (b)\
  \ ECG 信号的恢复质量对 ReRAM 低电阻态和高电阻态遵循对数正态分布时的电阻标准差 `![image](img/ch08_si346.gif)` 的敏感性\n\
  \n另一方面，即使遗传算法优化了布尔嵌入矩阵，其在提高恢复质量方面也未显示出明显的有效性。主要原因是在 `![image](img/ch08_si344.gif)`\
  \ 向 `![image](img/ch08_si345.gif)` 的转换过程中，过多的信息损失导致 `![image](img/ch08_si346.gif)`\
  \ 接近随机布尔矩阵。换句话说，遗传算法无法有效求解问题 (8.5)。此外，遗传算法的随机性使其需要执行大量次数。相反，所提算法保证单次执行即可生成高性能的布尔矩阵。\n\
  \n#### 8.6.4 硬件性能评估\n\n本部分将详细研究布尔嵌入的硬件性能优势。评估仅关注图 8.3 和 8.5 中红色虚线框所指示的嵌入硬件。\n\n\
  ##### 8.6.4.1 硬件对比\n\n矩阵-向量乘法器由多个并行的 MAC（乘累加单元）组成。要将信号向量与 19`![image](img/ch08_si347.gif)`256\
  \ 采样矩阵相乘，需要 19 个 MAC，每个 MAC 需要 256 个周期来执行内积运算，每个周期（1`![image](img/ch08_si348.gif)`）。存储\
  \ NuMax 实值采样矩阵使用带有 64 位 I/O 总线宽度的 16kB SRAM。\n\n所提布尔优化将 NuMax 采样矩阵量化为 `![image](img/ch08_si349.gif)`\
  \ 布尔矩阵。因此，存储采样矩阵的 SRAM 尺寸从 16kB 减小到 1kB。与伯努利 `![image](img/ch08_si350.gif)` 矩阵相比，`![image](img/ch08_si351.gif)`\
  \ 乘法需要计算输入信号向量的 2 的补码，这会给 MAC 带来额外的硬件开销。为了最小化 2 的补码开销，采用了 图 4(c) 中的 MAC 设计，该设计每\
  \ 256 个周期仅计算一次 2 的补码。\n\nReRAM 交叉阵列同时支持 `![image](img/ch08_si352.gif)` 和 `![image](img/ch08_si353.gif)`\
  \ 布尔矩阵。由于采样矩阵嵌入到同时执行矩阵乘法的 ReRAM 交叉阵列中，因此不需要单独的存储器。\n\n表 8.4 对比了支持不同类型采样矩阵的四种硬件方案的性能。与基于\
  \ 16 位 MAC 和 16 kB SRAM 硬件的 NuMax 实值嵌入相比，基于 1 位 MAC 和 1 kB SRAM 的所提量化 `![image](img/ch08_si354.gif)`/1\
  \ 布尔嵌入，每次嵌入的操作能耗降低 `![image](img/ch08_si355.gif)`，漏电功率减小 `![image](img/ch08_si356.gif)`，面积减小\
  \ `![image](img/ch08_si357.gif)`。这是因为，如第 8.3 节所述，实值乘法器在分辨率提高时通常需要二次方增长的全加器数量，而布尔乘法器只需要线性增长的全加器。\n\
