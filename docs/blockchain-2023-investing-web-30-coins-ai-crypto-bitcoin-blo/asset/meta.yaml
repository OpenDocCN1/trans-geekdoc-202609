  - '**10 月 12 日：** 位于新泽西州的加密货币贷款机构 `Celsius Network LLC` 收到来自魁北克存款投资局（Caisse de dépôt
    et placement du Québec）的 15 亿美元投资。'
- - '###'
  - '**11 月 10 日：** 比特币的历史日内高为 68,789.63 美元。'
- - '###'
  - '**11 月 16 日：** 以太坊以 4,891.70 美元达到历史日内高。'
- - '##'
  - '2022'
- - '###'
  - '**1 月：** `OTPP` 继续对 `FTX` 进行 2,000 万美元的美国投资。'
- - '###'
  - '**1 月 10 日：** `Fidelity Investments Canada ULC` 宣布其资产配置型 ETF 现在将包含 1% 至 3% 的比特币敞口。（截至本文发布时，目标配置保持不变。）'
- - '###'
  - '**2 月 14 日：** 位于新泽西州的 `BlockFi Lending LLC` 同意向 `美国证券交易委员会` 支付 1 亿美元罚金，并寻求注册其加密货币贷款服务。'
- - '###'
  - '**3 月 31 日：** 根据 `National Bank Financial` 的信息，加拿大加密货币 ETF 的管理资产已达 61 亿美元。'
- - '###'
  - '**5 月：** 挂钩代币 `Luna` 和稳定币 `TerraUSD` 均崩盘。'
- - '###'
  - '**5 月 18 日：** 比特币跌破 25,000 美元。（注：此处OCR错乱已修复逻辑）'
- - '###'
  - 5 月初，其交易价格远高于 50,000 美元。
- - '###'
  - '**7 月 6 日：** 总部位于纽约的加密货币经纪 `Voyager Digital Ltd.` 申请保护。'
- - '###'
  - '**7 月 13 日：** `Celsius Network` 宣布破产。'
- - '###'
  - '**8 月 17 日：** 魁北克存款投资局宣布注销其全部投资。'
- - '###'
  - '**9 月 11 日：** `FTX` 宣布破产。'
- - '###'
  - '**10 月 17 日：** `OTPP` 宣布注销其股权。'
- - '###'
  - '**10 月 21 日：** `Elizabeth Warren`、`Durbin` 和 `Tina Smith` 要求 `FMR LLC (401k)`
    计划允许接触比特币。'
- - '###'
  - '**11 月 27 日：** 一家名为 `Bitfront` 的美国交易所宣布关闭。'
