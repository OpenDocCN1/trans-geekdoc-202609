    # Metacade 优于其他产品


    列表中的每种货币都是 2023 年及以后最值得投资的顶级 Web 3.0 代币之一。然而，如果你必须选择一个，Metacade 的 `MCADE` 代币将是首选。得益于
    Metacade，可以在一个平台上获得最好的 Web 3.0 游戏、赚钱和社区建设方案。从竞争性游戏赛事和抽奖活动，到通过质押和内容上传获得的被动收入，它为所有人提供了各种选择。


    无论你的 Web 3.0 目标是什么或你是谁，Metacade 都会帮助你实现。这种巨大的潜力使 Metacade 成为 2023 年最值得长期持顶级 Web
    3.0 货币。


    ## 本章核心要点


    - 公链区块链（一种以促进比特币交易而闻名的数据库）是 Web 3.0（互联网的潜在未来版本）的基础。

    - 在本章中，我们讨论了互联网如何随时间演变、为什么 Web 3.0 是一个热门话题、它的用途是什么、加密货币中的 Web 3.0 意味着什么、它将走向何方以及为什么它很重要。

    - 在 Web 2.0 中，你不需要成为开发者即可参与开发过程。

    - Web 2.0 以用户为中心，开发者仅需创建一个系统来启用并吸引用户。


    # 2023 年预测：对 AI、BNPL、加密货币及其他领域的预期


    鉴于即将到来的经济衰退和持续的通胀压力，我们的研究人员考察了加密货币、“先买后付”（BNPL）、视频流、度假租赁、转售、社交媒体、人工智能和烹饪等领域在 2023
    年的关键趋势。


    随着许多公司将 COVID-19 抛在历史舞台，2022 年为零售、技术、运输和其他行业的人们带来了一系列新挑战。我们的行业分析师预计，2023 年主要子分行业将持续动荡，其他行业也将如此，消费者几乎各处都会采取削减措施。


    ### 尽管持续波动，加密货币将生存下来


    进入 2023 年，加密货币无疑是问题最多的领域。2022 年的市场崩溃让数字货币处于了生命维持状态；`Bitcoin` 的价值自今年初以来下降了约三分之一。然而，尽管最大的加密货币交易所之一
    `FTX` 倒闭并损害了其声誉，购买加密货币的兴趣仍然保持如一，所有者继续相信这种商品最终会反弹。


    消费者非常擅长预测大型加密领域风向标 `bitcoin` 的健康状况。因此，这一因素至关重要。尽管高估了加密货币的价值，但消费者正确预测了今年 `bitcoin`
    价格的下跌。例如，在 1 月的调查中，受访者预计六个月内 `Bitcoin` 的价格将跌至约 27,000 美元；而在 7 月，价格在 19,000 美元到
    23,000 美元之间。当客户在 5 月预测 `Bitcoin` 价格将再次跌至 21,000 美元时，一种类似的趋势开始出现；今天，价格为 17,000
    美元。根据 11 月的一项客户研究，预计 2023 年 5 月的价格将达到 11,500 美元元的位。


    以下宏观经济原因导致了这种持续的下降：由于四十年来来的高通胀、利率上升和长期的地缘政治不稳定性，为加密货币创造了一个难以稳定、更说发展的恶劣气候。这些因素对于加密货币的长期生存至关重要。


    尽管消费者需求增加，但由于拜登政府在监控犯罪行为和限制可能盈利的业务之间寻求平衡，明年不太可能出现全面的监管。`证券交易委员会`（Securities and
    Exchange Commission）最可能负责任何监管工作。


    ### “先买后付”将会有更多扩散和审查


    虽然 `BNPL` 服务在整个 2022 年里在 Z 世代成年人和千禧一代中表现出持续的增长，但这种扩张也伴随着更严厉的监管审查。当通胀将家庭预算推向极限时，这种服务的吸引力是显而易见的：在一段时期内分期支付物品，通常没有利息。通过与这些供应商合作，商户可以为客户提供更灵活的支付选择，并从那些无法一次性支付全额的客户那里获得销售。


    2021 年冬假后，在经历了假期后的小幅下跌，观察到 Z 世代成年人和千禧一代中 `BNPL` 使用了数月的持续增长。尽管受到通胀影响，消费者今年仍维持了支出，而
    `BNPL` 贷款对担心财务状况的购物者特别有吸引力。


    在假期期间，感到焦虑的购物者计划使用 `BNPL` 的概率比不焦虑的人高出 20 个百分点。这些新的贷款选择显示出更高的消费者接受度，并在零售业中无处不在：黑五期间的
    `BNPL` 支付较上周增长了 78%。重要的是，服装是使用 `BNPL` 最受欢迎的类别之一，这些经常购买将支持其在下一年的增长。


    零售商和 `BNPL` 服务应该意识到这种快速扩张的几个缺点。根据 `LendingTree` 的调查，消费者需要申请更多小额贷款并支付所有款项。此外，供应商正面临`消费者金融保护局`（Consumer
    Financial Protection Bureau）的审查，且目前的利率环境让 `BNPL` 者的运营变得困难。根据零售和电子商务分析师 `Claire
    Tassin` 的观点，零售商应该欢迎该领域增加监管，因为对于 `BNPL` 贷款人来说，被指控掠夺性策略对品牌形象不利。


    ### 视频流媒体包组合将重新成为主导趋势


    ###2023 年将是流媒体战争的“组合”年


    虽然组合作为趋势看起来像是 2019 和 2020 年新流媒体服务利用其获得关注的回顾，但考虑到最近修订的流媒体增长预测，流媒体公司需要更新、更具效益的策略来加速注册。要赢得预算敏感型客户的钱包份额，不仅仅需要广告分级，这将带回熟悉的组合机会。


    虽然最大的国内视频流媒体不会与其来自其他母公司的服务进行折扣组合，但我们将看到更多流媒体与电信运营商、非媒体巨头或音乐流媒体服务建立组合协议以加速增长。想想之前提供的
    `Disney+` 和 `Amazon Music` 组合、T-Netflix Mobile 的交易，以及 `Walmart+` 包含 `Paramount+`。


    2023 年 `HBO Max` 与华纳兄弟探索拥有的另一个流媒体 `Discovery+` 的合并将是两个流媒体合作力量的最佳案例。尽管目前 unknown
    合并服务的成本，但根据媒体和娱乐分析师 `Kevin Tran` 的说法，这将迫使顶级流媒体供应商以更低的价格为客户提供更多内容。


