    # The 11 best new Blockchain companies for 2023


    **Fluree**: [https://flur.ee](https://flur.ee), founded in 2016


    What does it do? Fluree is a semantic graph database built on the Blockchain.
    It lets developers make graphs and concept map with fast search speeds. The company
    promises that all data can be traced back to its source, and its semantic standards
    make it stand out from the rest. Users can see their data differently and keep
    it safe with their main product.


    **MeetKai**: [https://meetkai.com/](https://meetkai.com/) founded in 2018


    This Los Angeles company wants to make a virtual-reality app with a map of the
    whole world. MeetKai already keeps track of many real-world places and adds them
    to its app. The company wants to give people in the metaverse a look at real places.
    MeetKai uses AI models to recognize places and speech patterns to help with its
    mission and make an engaging VR experience.


    **Constellation Network**: https://constellationnetwork.io/


    Founded in 2017


    Constellation Network is a Blockchain that can be used by entrepreneurs who want
    to build a new Blockchain app quickly. It has a high transaction speed thanks
    to its highly decentralized DAG design and level-zero data transport layer (8-.000
    TPS in seven seconds using only six nodes). To further bolster its suitability
    for scalability in the context of Blockchain applications, the network also provides
    a method for completing transactions without incurring fees. Because of the features
    of the Constellation Network, developers will be able to build apps that connect
    to other Blockchains and help them build their ecosystems.


    **Metaking Studios**: [https://www.metakingstudios.com/](https://www.metakingstudios.com/)
    founded in 2017


    MetaKing Studios is a AAA game company making Blocklords, a medieval fantasy grand
    strategy MMO game where players can own digital assets. The team plans to add
    DeFI features to the game, giving it an economy that doesn''t exist in Blockchain
    games as yet. The team has partners from all over the world, and their goal is
    to make Blockchain games that are deep and interesting.


    **Certik**: [https://www.certik.com/](https://www.certik.com/) founded in 2018


    CertiK is a Blockchain startup whose main focus is security. The company was started
    by professors from Columbia University and Yale. They use research that has been
    proven to work to make Blockchains safer, and that''s something that businesses
    that use Blockchain can use. CertiK has implemented AI systems and Formal Verification
    to deal with cybersecurity threats. It also checks the security of other projects
    and lists the most secure websites on its website.


    **Poko**: [https://www.pokoapp.xyz/](https://www.pokoapp.xyz/) founded in 2022


    Poko is an out-of-the-box idea for making DAOs legal. The people who started it
    call it "Slack for DAOs." It makes it easier for anyone to join an existing DAO
    or start their own by simplifying the legal and technical steps. The legal setup
    fee will be reduced to a small amount, like $50. This will make DAOs available
    to a lot more people online.


    **Soon**: [https://www.soon.app/](https://www.soon.app/) founded in 2020


    Soon is different from other cryptocurrency investment apps since it does not
    require users to be active investors. Soon, anyone with a debit card or savings
    account can invest without worrying about how their money is being managed. The
    catch is that the app has a transaction fee of over 3%, which is high. But if
    you want to invest quickly and easily from your bank account, including investing
    in cryptocurrencies, a tiny price to pay. The app will start in the United States
    and then move to other countries.


    **Payourse**: [https://www.payourse.com/](https://www.payourse.com/) founded in
    2019


    Payourse, based in Africa, has the best idea out of all the startups there: making
    tools to set up crypto exchanges. They have set up a website called `Coinprodile`
    that lets anyone send cryptocurrency to people in Africa. But `Simpa` is the thing
    that people are talking about. It is an app that lets tech entrepreneurs set up
    crypto exchanges quickly without writing any code. The African crypto market needs
    to grow the use of digital currencies on the continent.


    **Finnt**: [https://www.finnt.com/](https://www.finnt.com/) founded in 2022


    Finnt wants to make an app that makes it easy to save money and send money back
    home. Users can set up high-interest savings accounts through a decentralized
    network, and `Stablecoins` will be used to back these accounts, protecting those
    who have them from inflation. Finnt has the potential to become the money transfer
    app of choice in many countries because it can be used to save and pay across
    borders.


    **Argo**: [https://watchargo.com/](https://watchargo.com/) founded in 2020


    Argo stands for "Artists Going places". Artists and people who make short films
    can share their work on Argo, which has NFT functionality. In fact, it has curated
    lists for genre-based and niche-based content. It also helps creators get the
    word out about their movies and make money through NFTs.


