  trans: '

    在 Web 2.0 中，你无法控制数据是如何被保存的。现实中，公司经常在未经用户同意的情况下收集并存储用户数据。所有这些数据都由负责这些平台的公司拥有并管理。此外，当政府怀疑某人表达与其宣传内容相悖的观点时，他们经常关闭服务器或没收银行账户。政府可以使用中心化服务器来干扰、管理或停止某些应用程序。


    由于银行是中心化且数字化的，政府经常对其进行干预。然而，在极端波动、过度通胀或其他政治动荡期间，他们可能会冻结银行账户或限制资金访问。Web 3.0 从从根本上重新思考我们创建和使用应用程序的方式，并将解决许多问题。


    ## 什么是 Web 3.0？


    Web 3.0 时代也被称为语义网或读写执行网络，始于 2010 年，展示了互联网未来的趋势。人工智能 (`AI`) 和机器学习 (`ML`) 让计算机能够像人类一样观察数据。这使得计算机能够根据用户需求创建并共享实用的信息。


    Web 2.0 和 Web 3.0 都基于去中心化，但它们存在一些主要差异。Web 3.0 应用程序开发者很少制作并销售将数据存储在单一服务器或数据库的程序，而这些通常由单一云提供商托管和管理。


    另一方面，Web 3.0 应用程序构建在区块链、许多 P2P 节点（服务器）的去中心化网络或两者的结合之上。Web 3.0 社区通常将这些程序称为“DApps”，即“去中心化应用”。为了让去中心化网络可靠安全，用户（开发者）必须通过提供优质服务获得报。


    ## 加密领域的 Web 3.0 指什么？


    你会发现讨论 Web 3.0 时经常提到加密货币。这是因为加密货币是许多 Web 3.0 协议的重要部分。相反，它以代币的形式授予任何想要帮助构建、运行、贡献或改进某个项目的人。创建去中心化互联网的目标与被称为“Web
    3.0 代币”的数字资产有关。这些协议可以提供各种服务，如托管、计算、带宽、存储、身份以及云提供商以前提供的其他服务。


    例如，制作视频基础设施和流媒体服务的人可以在基于 `Ethereum` 的 Livepeer 协议销售他们的产品。同样，`Helium` 使用区块链和代币让个人和小型企业提供并测试无线覆盖，并在网络发送设备数据。


    该协议为人们提供了广泛的技术和非技术生计方式。服务用户通常需要为该协议付费，就像他们向 `Amazon Web Services` 等云提供商付费一样。去中心化通常意味着消除那些不需要且经常浪费金钱的中间者。


    Web 3.0 还将包含重要部分，如非同质化代币 (`NFTs`)、数字货币以及区块链的其他部分。例如，Reddit 想要进入 Web 3.0 领域，通过创建一个系统，让用户使用加密代币来管理他们所属的在线社区的某些方面。根据这一想法，用户将使用“社区积分”，这些积分是通过在特定的板块（subreddit）上发帖获得的。对帖子进行点赞或吐槽的人数决定了该用户获得的积分数。（在区块链上，这只是
    Reddit 积分 Karma。）


    这些积分可以用作投票份额，让贡献较多的用户对社区影响重大的决策拥有更大的影响力。这些积分不会被随意夺走，因为它们存储在区块链上并随你移动，赋予了所有者更多控制权。公平来说，这仅仅是
    Web 3.0 概念的一种用途，称为去中心化自治组织 (`DAOs`)，它利用代币更公平地共享所有权决策权。


    ## Web 2.0 vs Web 3.0


    ### Web 3.0 具有哪些特征？


    从 Web 2.0 到 3.0 的转变正在缓慢发生，但只有少数人知道。Web 3.0 应用程序看起来像 Web 2.0 应用程序，但它们的后端不同。在 Web
    3.0 的未来，将会有可以被不同硬件和软件访问和使用的通用应用程序。我们共同会有更多的时间用于工作和娱乐。


    分布式账本和区块链存储等新兴技术将实现数据去中心化，并构建一个与中心化不同的透明且安全的环境。


    当去中心化基础设施和应用平台取代科技公司时，人们就可以合法地拥有自己的数据。为了进一步理解 Web 3.0 的细微和复杂之处，让我们来看看它的关键特征。


    ### 语义网


    语义网是 Web 3.0 的重要部分。蒂姆·伯纳斯-李（Tim Berners-Lee）提到了一种计算机可以分析的信息网络。那么，在日常语言中这意味着什么？谈论“语义”意味着什么？


    尽管这两个短语的组合方式不同，但它们的意思相同。语义是研究事实的含义或它们如何带给我们感受的学科，在上面的例子中，两个短语让我们产生了相同的感觉。人工智能和语义网是
    Web 3.0 的两个支柱。通过帮助计算机学习数据的含义，语义网将使 `AI` 能够创建实际用例。


    ### 3D 图形


    随着 Web 3.0 将互联网从简单的二维 Web 变为更真实的三维网络世界，互联网的未来将发生改变。三维设计广泛应用于 Web 3.0 网站和服务，包括电子商务、在线游戏和房地产市场。


    ### 人工智能 (AI)


    人工智能将使网站能够筛选并向消费者展示最相关的信息。在目前的 Web 2.0 时代，企业已经征求消费者反馈以了解商品或资产的效果如何。以 `Rotten Tomatoes`
    这样的网站为例，人们可以在那里对电影进行评分和评论。正如我们已经说的，同行评审是 Web 2.0 最重要的贡献之一。然而，众所周知，人类的建议是不受偏见影响的。一个群体可以共同为某部电影提供虚假好评以提高其评分。

