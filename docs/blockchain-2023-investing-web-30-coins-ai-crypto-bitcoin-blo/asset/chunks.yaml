    By terminating its Azure Blockchain Service offering in September 2021, Microsoft
    Azure left the Blockchain-as-a-service industry. The Quorum Blockchain-as-a-service
    on the Azure Cloud is offered by ConsenSys, a third party, to customers of that
    service. However, this does not imply that Microsoft Azure is giving up on Blockchain
    altogether.


    Microsoft has included Blockchain technology in a few brand-new products now under
    preview. Blockchain technology is used to power a new ledger feature for the Azure
    SQL Database that improves record integrity and lets users demonstrate that records
    haven''t been altered.


    For the same reason, Microsoft has also released Azure Confidential Ledger. Your
    data is kept on your Azure storage account as objects instead of in a SQL database,
    except Confidential Ledger.


    **AWS Blockchain services**


    The complete option for anyone wishing to board the Blockchain train is Amazon
    Web Services (AWS). AWS offers Managed Blockchain if you search for a fully automated
    Blockchain solution. Customers can start a node on the open Ethereum Blockchain
    network by pressing a few buttons.


    Users can quickly set up or join private Hyperledger Fabric networks with a few
    clicks. You don''t need to worry about technicalities because these public nodes
    and private networks are completely managed; you pay by the hour.


    Amazon Quantum Ledger Database (also available through AWS) is designed for programmers
    who guarantee completely immutable data change tracking. The shortened name for
    this is QLDB, and it has two components: (1) a section that keeps the current
    state data and (2) an append-only journal that records every alteration made to
    that current state database. Developers and applications can communicate with
    it using SQL or the API since it is essentially simply a database. Behind the
    scenes, the Blockchain ledger portion is managed.


    If you''re familiar with other databases, you''ll notice that this ledger sounds
    like transaction logs or journaling. And the reason is that it is something similar.
    The distinction is that every entry in that journal is cryptographically linked
    to both the entry before it and the one after it. This makes it simple to verify
    and unchangeable.


    Some well-known names have signed on to use AWS''s Blockchain offerings, including
    The BMW Group, Nestle, Sony Music, and Workday are a few of the well-known companies
    that have used AWS''s Blockchain solutions.


    Additionally, AWS claims to host at least 25% of all Ethereum network nodes and
    has over 70 validated Blockchain solutions available on its AWS Marketplace. But
    is AWS the only provider of Blockchain-as-a-service? In no way.


    **IBM Cloud**


    IBM Cloud was one of the first prominent cloud providers to enter the hosted Blockchain
    market. It has one of the most developed offerings as a result. IBM hosts Blockchains
    for several major firms, such as Walmart and the shipping company Maersk. Additionally,
    IBM has significantly played a part in Hyperledger Fabric, a renowned open-source
    Blockchain technology, and the software that powers its branded Blockchain products,
    and it continues to do so.


    **Oracle Cloud**


    Then there''s the Oracle Blockchain Platform which is a Hyperledger Fabric implementation
    with additional capabilities added to improve compatibility with the Oracle Cloud.
    They host Blockchains for the financial services, fashion, healthcare, and transportation
    sectors. Blockchain is merely another tool in their customers'' arsenal, and both
    Oracle and IBM use their partnerships with large enterprises to market their Blockchain
    services.


    **Other Blockchain services in the cloud**


    Numerous cloud-native firms outside the major cloud providers are working to capitalize
    on Blockchain through industry-specific solutions or other distinctive value propositions.
    Just think carefully about who you might connect with because Blockchain use cases
    are typically rather far-reaching. Thus, the existing dispersed and diverse cloud
    landscape for Blockchain is described. Others are remaining steadfast and increasing
    their investments in Blockchain-as-a-service, while public clouds like Azure and
    SAP Cloud may have backed away.'
