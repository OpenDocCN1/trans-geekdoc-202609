  trans: '


    `TRUST`（信任）的概念是将发生重大变化的地方，特别是在跨国业务的背景下。过去，律师被聘请来帮助两个互不信任的双方，但这增加了时间和金成本。然而，加密货币的引入从根本上改变了信任的方程式。


    许多组织位于资源有限且腐败程度严重的地区。`Blockchain` 为为这些受影响的个人和组织在这些情况下提供了巨大的竞争优势，使他们能够避免可疑的第三方中间介的策略。


    物联网（`IoT`）是一个已经充斥着智能设备的全新现实。它可以完成任何事情，从开启洗衣机到操作汽车、操纵船只、规划取货、控制你所在社区的交通安全等等！通过使用
    `Blockchain` 技术来构建智能合约，任何企业都可以在所有情况下（以及更多情况）优化流程并维护更精确的记录。


    `Blockchain` 技术允许像 `Airbnb` 和 `Uber` 这样的企业或应用程序在去中心化的对点网络上运行。它允许消费者支付停车费和过路费等费用。医疗行业可以使用
    `Blockchain` 作为安全平台来存储患者的隐私信息。该技术允许健康相关公司建立中央数据库，并专门与具有必要权限的人通信数据。


    两个想要执行私有交易的双方可以使用全球的 `Blockchain` 技术。然而，在双方进行这些交易之前，需要解决几个要素：

    - 交易的条款和条件（`T&C`）是什么？

    - 是否所有的条款都已理解？

    - 对话何时开始？

    - 对话何时结束？

    - 何时对对话是不公平的？


    所有方都可以通过查看“链”中的“区块”立即获得这些问题的答案，因为 `Blockchain` 技术使用了去中心化网络上的共享分布式账本。链中的所有交易都可用于跟踪从源头到最终目的地的交易。


    ## 区块链的应用与案例


    `Blockchain` 的应用不仅限于 `Bitcoin` 等加密货币。这项技术正在影响许多行业，从合同的执行方式到让政府更有效地运行。它可以增加透明度，同时为企业节省时间和金钱。我们汇编了这项实用但具有突破性的技术的现实
    `Blockchain` 应用案例。尽管这个列表远不完整，但它们已经在改变我们开展业务的方式。


    ### 区块链在资金转账中的应用


    加密货币转账应用程序目前在 `Bitcoin` 的引领下正经历爆发性的增长。由于 `Blockchain` 通过减少第三方费用、消除官僚主义程序以及使账本系统实时化为金融机构节省了时间和资金，这些业务使用
    `Blockchain` 技术高效地移动资金。


    1. `Chainalysis`: 纽约州纽约市

    `Chainalysis` 创建工具以协助政府和金融机构监控加密货币交易。该企业的尽职调查软件在促进 `Blockchain` 信任的同时，留意非法洗钱、交易和合规问题。


    2. `Circle`: 马萨诸塞州波士顿

    位于波士顿的 `Circle` 负责监管用户之间的加密货币支付和交易。`Circle` 的投资和资金转账平台提供其他七种加密货币，包括 `Zcash`、`Monero`
    和 `Bitcoin`。


    3. `Algorand`:萨诸塞州波士顿

    `Algorand` 创建了桥接中心化金融与去中心化金融差距的技术，使用先进的产品和协议来提高金融交易的公平性。该公司的技术通过一组层 1 `Blockchains`
    实现，其用例涵盖从证券、供应链到保险、数字合约等。这些 `Blockchains` 提供了扩展性、安全性、交易终局性、隐私、共链和智能合约能力。


    4. `Chain.io`: 加利州旧金山

    `Chain` 为金融服务行业创建 `Blockchain` 云基础设施。由于这家位于旧金山的公司的数字账本，金融机构可以安全、高效地移动加密货币。


    ### 区块链智能合约


    智能合约与普通合同类似，但它们消除了中间人，并为所有参与方提供了传统协议中无法实现的问责机制（accountability）程度。相反，合同规则在 `Blockchain`
    上实时执行，在确保所有方合规的同时，为企业节省了时间和资金。随着包括政府、医疗保健和房地产在内的行业了解了这些优势，基于 `Blockchain` 的合同日益流行。以下是企业利用
