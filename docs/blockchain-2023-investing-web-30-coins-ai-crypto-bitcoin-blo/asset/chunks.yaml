  trans: '


    投机性投资吸引了人们进入 FTX。现在我们已经看到了结果，希望他们开始寻求基于价值的主张。FTX 的崩盘凸出的不仅仅是另一个 `Bitcoin` 交易所的倒闭。它提醒着我们，该行业必须发展并接纳价值；这正是价值缺口所在。


    FTX 被列为全球第二大加密货币交易所。它现在就像一个隐喻，象征着大量资金投入到现代化、中心化的企业模型（这些模型披着虚假的去中心化外壳）所导致的临终挣扎。


    根据传奇投资者沃伦·巴菲特的说法，只有当潮水退去时，你才知道是谁在裸体游泳。一些裸主义者参与了最近这一轮竞争。但这无疑发生过以前。实际上，并不完全如此。


    `Bitcoin` `BTC` 在历史上最长金融市场牛市开始时，曾下跌了 `$16,744`。它所催生的行业在理想条件下几乎几近爆炸。但好事终有尽头。寻求控制权的监管机构和日益恶化的宏观经济状况为比特币业务制造了不利的汇点。


    与此同时，基于价值的投资正带着谨慎的态度回归传统市场。简单来说：当利率处于历史低位时，钱几乎是免费的。但现在并非如此。`Uber`、`Airbnb` 和 `DoorDash`
    的飞速上升之所以可能，是因为那些赚钱的企业在这些价值被免费提供时并未受到重视。然而，今天的承诺仍需被做出。投资者在投入他们日益昂贵的资本之前，将需要价值的确认。


    随着 FTX 的覆灭，价值驱动型投资将首次在加密市场成为可能。`FTX Token` `FTT` 下跌了 `$1.06`，证明了代币经济学的虚假性。尽管在经济繁荣时我们经常忽视它的教诲，但经济学确实存在。供需关系。当市场处于平衡时，它们就能运行。如果不平衡，市场就无法运行。


    我们已经知道，`bitcoin` 市场的中心化控制可能更有帮助。贪婪的骗钱骗子有太多的机会去利用那些不熟悉复杂技术的人。发生了什么？那些相信加密货币彩虹尽头有金子的人他们的梦想破灭了。但在混乱之中，价值的分裂提供了一丝希望。


    ### 什么是价值分歧？


    根据行业术语，加密货币正在经历一场“硬叉”。在 FTX 的尘埃落定后，幸存者们有两个选择：要么继续盲目下注以寻找一个“更大的傻瓜”，要么搜寻可以收集并提供给用户的信息。


    一些人将坚持后一条路。坏习惯仍在持续。然而，随着投资者的要求的增加，他们将会消失。在此期间，那些回归传统商业并提供真实价值的 `Web 3` 倡议将获得青睐。成功的人将将获得丰厚的回报。对于那些仅仅在提供过去陈旧助威的人来说，终结将很快到来。


    ### 应对新范式


    在价值分歧中，有两个原则需要考虑。第一，加密货币被视为金融资产。第二，`Blockchain` 被视为技术框架。


    由于定价协议需要功能性模型，因此将加密货币作为一类金融资产进行评估是具有挑战性的。这在初创公司是可以预见到的。在开始，没有标准可以评估这些网络。改造后的市场是为成熟市场而建立的。


    从那时以后加密学发生了变化。现在我们对去中心化金融（`DeFi`）协议的众多用途有了基础性的理解，可以对网络进行分类。`Bitcoin` 使用的工作量证明链广泛、缓慢且安全。我们可以看到有多少个
    `Bitcoin wallets` 以及它们如何与网络交互。次级交易层 `Lightning Network` 允许计算跨其传递的价值。


    `Ethereum` 是一条权益证明链。尽管它比 `Bitcoin` 更中心化，但它是 `DeFi` 的基础。`DeFi` 开发了一种名为 `total-value-locked`（锁仓价值）计算的技术来帮助估算价值。尽管它们有一些局限性，但在既有机构之外创建复杂的金融指标是非常有趣的。传统金融对此表示认同，这解释了为什么监管关注正在增加。


    2016 年，以 $1,187 的价格卖出 `Bitcoin` 或 `Ether` 似乎差不多。现在这些网络更加清晰，我们可以使用广泛的数据驱动指标来评估它们。加密货币正在成为一种经过验证的资产类别。


    ## 功能性的兴起


    功能性资产是非金融的 `Web 3.0` 资产，例如 `Blockchain` 产品和服务。。以 `ZK`（零知识）`Proof` 为例。一个潜在的房屋主想向房地产经纪介展示他们拥有所需的资金，而无需透露其账户的细节。他们可以使用
    `ZK` 为这项服务付费。他们不是在交换或保留资产，而是为了保护其匿名性的服务付费。


    许多新出现的数据处理倡议提供了识别工具、云存储以及搜索和索引等服务。得益于其去中心化的基础设施，与其中心化的竞争对手相比，它们价格相对合理。


    FTX 的失败既非寻常也非决定性的，由于宏观经济力量施加的向下压力，系统的感染变得复杂。毕竟，事已定论；然而，FTX 将成为加密故事中的一个增长点，留下了增强价值的系统。


    ## 市场为何恢复以及买什么


    随着 2022 年结束，FTX 的崩溃和加密市场的下跌给全球加密货币交易者带来了最糟糕的恐惧。然而，如果我们观察 2023 年的预测，可能会市场将反弹且现在是投资的时机。以下是未来的预测以及潜力的加密货币：


    *   `Dash 2 Trade` - 现在值得购买的加密货币

    *   `RobotEra` - 潜在的玩赚 NFT 游戏

    *   `Impt.io` - `Blockchain` 上的碳信用市场

    *   `Calvaria` - 一款在线卡牌战斗游戏及进入加密世界的入口


    ### 指向加密市场恢复的五个预测


    以下是显示 2023 年将是牛年的专家预测和分析：


    *   根据加密市场的历史记录，2023 年应该是成功的一年

    *   2023 年初将标志着熊市的结束

    *   当加密市场达到底部时，牛市将开始

    *   `Bitcoin` 将回归

    *   `Web 3.0` 将席卷世界


    ### Dash 2 Trade 是现在最值得投资的加密货币


    明智的投资是在市场恢复并进入牛市之前在价格便宜时购买。`Dash 2 Trade` 是交易者目前最感兴趣的项目。


