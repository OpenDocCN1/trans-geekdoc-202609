    根据高特纳著名的技术曲线，区块链即服务（Blockchain-as-a-service）目前正处于高特纳所谓的“幻灭之谷”。这意味着（这并非双关语），所有这些高预期正处于讨论之中。


    Cello 的以下关键方面得到了区块链技术和现代 PaaS 工具的支持：


    • 自动化区块链网络生命周期的创建、终止、删除和维护。

    • 允许为区块链网络定制化的类型和大小。

    • 支持原生 `Docker` 主机、虚拟机、`vSphere`、裸机、`Swarm` 和 `Kubernetes`。

    • 该平台通过集成 `ElasticStack` 等当前工具，提供监控、日志、健康状况和分析等尖端功能。


    区块链即服务可能成为区块链在众多企业和行业中广泛应用的动力。为了专注于核心业务而非管理和创建区块链，无论大小的公司，现在都可以轻松地“外包”这些在技术上艰巨的任务。


    为了自己的 BaaS 部署，许多 IT 公司已经投身区块链领域。微软的 `Azure` 平台即可支持 BaaS 系统。亚马逊和甲骨文提供云服务，但它们自己的
    BaaS 侧重于私有区块链。


    ### 结论


    大型科技公司已经在提供区块链服务，帮助客户采用这一革命性技术并保持竞争力。微软和 IBM 等大公司提供区块链即服务。得益于这些服务，首席执行官可以获取区块链功能，而无需自己创建这些平台。由于区块链技术充满前景，基于区块链的服务可能是任何业务中改变游戏规则的突破。


    如果你想推进你的业务，BaaS 是你需要的技术。区块链即服务通过让区块链技术面向更广泛的受众，并支持该技术所有快速发展的用例，扩展了你业务的潜力。


    ## 本章关键特性


    * 为开发区块链应用程序的企业由第三方建立和管理云网络被称为区块链即服务（BaaS）。

    * 我们研究了几个云提供商提供的类似云服务。

    * Fortune Business Insights 表示，全球 BaaS 市场在 2020 年到 2027 年之间将以 39.5% 的 `CAGR` 增长，到
    2027 年将达到 249.4 亿美元。

    * 区块即服务可能成为区块链在众多企业和行业中广泛应用的动力。


    # 区块链与 Web 3.0


    ## 解释 Web 3.0


    公共区块链是一种以促进比特币交易而闻名的数据库，它是 Web 3.0（互联网可能的未来版本）的基础。Web 3.0 之引人入胜是因为它是去中心化的，这意味着用户拥有并管理互联网的某些区域，而不是作为客户使用
    Google、Apple 或 Facebook 等公司调介的服务。


    由于 Web 3.0 缺乏“权限”或“信任”，中心化机构无法监管谁可以访问哪些服务。两个或多个方之间的虚拟交易也可以发生，无需中间人。由于这些公司和中介执行了大部分数据收集，Web
    3.0 能够更好地保护用户隐私。


    去中心化金融也称为 `DeFi`，是一项迅速流行的 Web 3.0 特性。现实世界的金融交易必须在区块链上完成，无需银行或政府的协助。同时，许多大型风险投资公司大力投资
    Web 3.0，很难想象他们的参与不会导致某些中心化的产生。


    在本章中，我们将讨论 Web 如何随时间变化、为什么 Web 3.0 是一个热点、它的用途是什么、加密货币中的 Web 3.0 是什么意思、它将向何处发展以及为什么它很重要。


    ## Web 的演变


    全球数十亿人读取、写入、交换信息以及在线联系他人的主要工具是万维网。多年来，Web 经历了巨大的变革，它今天使用的应用程序与其婴儿时期的程序几乎无法区分。Web
    经历了三个阶段：Web 1.0、Web 2.0 和 Web 3.0。


    ### 什么是 Web 1.0？


    Web 1.0 指的是互联网的初始迭代。可以将只读或语法 Web 视为 Web 1.0。大多数参与者是内容的消费者。相比之下，大多数创建者是 Web 开发者，他们创建了以文本或视觉格式提供内容的网站。通常来说，Web
    1.0 从从 1991 年持续到 2004 年。


    在 Web 1.0 中，静态内容通过网站发布而非动态 `HTML`。使用静态文件系统而不是数据库来存储数据和内容，用户在网站上只能做很少的操作。


    ### 什么是 Web 2.0？


    我们大多数人只熟悉 Web 的当前迭代，通常被称为 Web 2.0，即交互式读写和社交 Web。在 Web 2.0 中，你不需要成为开发者就可以参与开发过程。许多应用程序的创建是为了让任何人都可以制作它们。


    你可以向世界思考并表达你的想法。在 Web 2.0 中，你还可以提交视频，并让数百万其他用户能够查看、参与和评论。Web 2.0 应用程序包括 YouTube、Facebook、Flickr、Instagram、Twitter
    以及其他社交媒体。


    得益于 `HTML5`、`CSS3` 以及 `ReactJs`、`AngularJs`、`VueJs` 等 `Javascript` 框架等 Web 技术，公司可以创建新概念让人们为社交
    Web 做出更多贡献。由于 Web 2.0 以用户为中心，开发者只需要创建一个系统来启用并吸引用户。


    想想 Instagram、Twitter、LinkedIn 和 YouTube 这四个热门应用程序在早期与现在相比如何。所有这些业务都经常遵循以下流程：


    * 业务发布一个应用程序。

    * 它接受尽可能多的学生（用户）。

    * 之后，它对其用户群进行变现。


