    # 什么是区块链技术？区块链是如何工作的？


    在过去的几年里，“区块链技术”这个术语可能经常与 `Bitcoin` 等加密货币一起出现。你可能在想：“区块链技术究竟是什么？”区块链是一个陈词滥调，但仅在假设的意义上，因为它缺乏一个普通人能够清晰理解的切实际含义。解释“什么是区块链技术”至关重要，包括其中涉及的技术、它的运行机制以及它为何在数字领域变得越来越重要。


    你有责任自己学习这项不断发展的技术，以便为区块链发展并变得更易上手的未来做好准备。如果你是区块链初学者，这里是学习基础的最佳地点。在本章，你将发现如何回答“什么是区块链技术？”这个问题。此外，你还将了解区块链如何运作、为什么重要，以及你如何利用它来促进你的职业发展。


    ## 什么是区块链？


    要理解区块链，你必须知道区块仅仅是一部分数据。任何可以数字形式存储的内容都包含在该区块中，例如财务交易、发票、提单，或之前添加到链中的区块的哈希值（hashes）。


    什么是哈希？将其视为一种通过统计确定的指纹，用于识别该区块中的每条信息。上一个区块的指纹包含在每个区块中，这种哈希链链赋予了区块链不可篡改的特性。如果有人回溯并更改链中的某笔交易，该区块的哈希以及所有后续哈希都会发生改变。


    ## 什么是区块链技术？


    区块链技术存储的数据使得系统难以或无法被更改、黑客攻击或滥用。一种被称为区块链的分布式账本在对点节点连接的计算机系统中分发并复制交易。


    区块链技术在通过对点节点连接的网络的众多数据库中保存公共交易记录。这些记录通常被称为“区块”，“而数字账本”一词被广泛用于描述这种存储方式。


    所有者的数字签名作为该账本每笔交易的验证和防欺诈机制，并有助于验证交易。因此，数字账本中的信息非常安全。


    数字账本可以比作共享 Google 电子表格的计算机网络，而交易数据则是根据实际购买进行保留的。数据可以公开查看，但不能被更改，这是一个非常迷人的特性。


    ## 区块链是如何开始的


    “区块链”一词可能会让你想到 `Bitcoin`或其他加密货币。这是该术语首次引入的背景；但在这一切之前，就已经有了区块链的想法。


    1982 年，戴·豪（David Chaum）在加利福尼亚大学伯克利分校的博士论文中提出了类似于区块链的系统。


    十年后，Bellcore 的研究人员提交了一份关于使用区块链技术确保文档时间戳的报告。他们后来创立了一家名为 Surety 的公司（稍后会详细介绍）。2008
    年之前，一个名为中本聪（Satoshi Nakamoto）的人或团体开发了最终为 `Bitcoin` 提供动力的区块链理念。


    关于 Surety，自 1995 年以来，它一直在《纽约时报》的公共公告栏目中发布其密封过的每个电子文档的最新哈希值。这一广为人知的事利用了区块链可以使用的另一种方法。哈希值广播得越广，想要秘密编辑一个已添加到链中的区块就越困难。


    由于每个参与者都拥有最新哈希值的副本，这种想法维护了公共区块链和联盟链的完整性。它最终演变成了 `Bitcoin` 的核心——这种广为人知的加密货币，它充当所有网络交易的公共记录。


    ## 为什么区块链很流行？


    考虑从你的银行账户向亲戚或朋友汇款。你使用账户密码连接到网上银行并将资金转账给另一个人。交易完成后，你的银行会更新交易记录。这相对容易。但存在一个我们大多数人都忽略的潜在问题：这类交易很容易被操纵。意识到这一真相的人不愿使用它们，这就是为什么过去几年第三方支付程序不断发展的原因。这种弱点是推动开发区块链技术的主要动力。


    从技术角度来说，区块链是一种最近引起了广泛关注的数字账本。但它为什么会获得如此多的追随呢？让我们调查一下以完全理解这个想法。数据和交易记录是业务不可或缺的一部分。当这些信息在内部处理或通过经纪人、银行家或律师等第三方处理时，业务需要时间、金钱或两者。幸运的是，区块链消除了这种冗长的程序，使交易运行更快速，节省了时间和金钱。


    大多数人认为 `Bitcoin` 和区块链可以互换使用，但它们是不同的。`Bitcoin` 是一种依赖区块链技术来确保安全的货币，而区块链技术可以连接到金融、供应链、制造业等多个行业的应用。


    **区块链是一项新技术，在日益数字化的社会中具有多项优势：**


    *   **极其安全：** 它使用数字签名函数来执行无欺诈的交易，使得具有特定数字签名的其他用户难以腐败或编辑个人的数据。

    *   **去中心化系统：** 在过去，交易需要政府或银行等监管机构的批准。然而，有了区块链，交易通过用户共识完成，从而实现了无忧、更安全且更快的交易。

    *   **自动化能力：** 当满足触发器的要求时，它可以被编程自动生成一系列活动、事件和支付。


    ## 区块链技术是如何工作的？


    你可能注意到，几年来几家公司一直在引入区块链技术。但这项技术是如何运作的？它是重大的修改还是仅仅是补充？让我们从揭秘区块链技术开始，因为它仍处于早期阶段，并具有革命性的潜力。


    **结合了三种热门技术，区块链由：**


    1.  加密密钥

    2.  具有共享账本的对点网络

    3.  一种用于存储网络交易和记录的计算方法


    ## 区块链的不同类型


