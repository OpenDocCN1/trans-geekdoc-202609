    11 月 30 日的无限制比特币总持量增加至 4,200 BTC。截至 11 月 30 日，该公司报告拥有 6,170 万美元现金。


    八家对冲基金报告称在 2022 年第三季度持有 Marathon Digital Holdings, Inc. (`NASDAQ:MARA`) 的多头头寸，总价值为
    919 万美元。除了 Marathon Digital Holdings, Inc. (`NASDAQ:MARA`) 外，Visa Inc. (`NYSE:V`)、PayPal
    Holdings, Inc. 和 Mastercard Incorporated (`NYSE:MA`) 是其他预计随着区块链业务扩张而将优于市场的股票（`NASDAQ:PYPL`）。


    ### 3. Canaan Inc. (`NASDAQ:CAN`) **对冲基金持有者数量：9**


    Canaan Inc. (`NASDAQ:CAN`) 是区块链应用、人工智能及其他尖端技术的高性能计算系统的领先供应商。凭借比竞争对手更有效、更强大的专用集成电路（`ASIC`）挖矿芯片，该在在市场中具有显著的竞争优势。此外，其生产的矿矿设备具有极高的能源效率，吸引了更多矿工。Canaan
    Inc. (`NASDAQ:CAN`) 是目前最值得购买的顶级区块链公司之一，有望从区块链行业的扩张中获利。


    根据 H.C. Wainwright 分析师 Kevin Dede (`NASDAQ:CAN`) 的说法，截至 7 月 6 日，Canaan Inc. 获得“买入”评级，目标价为
    5 美元。Canaan Inc. (`NASDAQ:CAN`) 于 10 月 24 日推出了其下一代基于 `ASIC` 的比特币挖矿设备 `A13` 系列。`A1346`
    型具有 110 TH/s 的算力及 30 J/TH 的能效，而 `A1366` 型则具有 130 TH/s 的算力能力和 25 J/TH 的能效。


    2022 年第三季度末，九家对冲基金持有 Canaan Inc. (`NASDAQ:CAN`) 的股份，总价值为 830 万美元。相比之下，上季度有八家对冲基金持有价值
    890 万美元的仓。通过向 Canaan Inc. (`NASDAQ:CAN`) 投资 460 万美元，Polunin Capital 截至 9 月 30
    日成为公司的最大股东。


