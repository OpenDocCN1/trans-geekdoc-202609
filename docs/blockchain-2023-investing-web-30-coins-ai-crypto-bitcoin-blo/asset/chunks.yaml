    Bitcoin owners have suffered significant losses: When you sum up the fall in the
    value of bitcoin, ether, and all the other digital currencies since they were
    at or around their peaks last year, you end up with a loss of more than $2 trillion
    in market cap.


    Most of the current issues are on crypto lenders, an area of the cryptocurrency
    business that has experienced rapid growth in recent years. Crypto users who deposit
    their digital assets at a crypto lender or digital exchange also make money, just
    like customers of conventional banks do with interest rates on their savings.
    Due to historically low-interest rates, savings accounts at banks only provided
    minimal returns over the past couple of years. However, certain cryptocurrency
    lenders and exchanges provided substantially greater yields, frequently in the
    double digits and occasionally as high as 20%.


    The truth about the unsustainable yields provided by some cryptocurrency exchanges
    and lenders has come to light. These cryptocurrency companies, like banks, make
    money from deposits by lending.


    The fees that borrowers pay for the loan are a percentage, and cryptocurrency
    lenders earn from the difference between the interest payments made to depositors
    and the fees paid by borrowers. However, unlike conventional regulated lenders,
    crypto firms aren''t under the control of banking regulators; as a result, few
    regulations are governing the capital they must retain or the things they may
    do with their clients'' digital assets.


    The current failure of these cryptocurrency lenders has also highlighted how intertwined
    many of these businesses are. FTX gave affiliated trading company Alameda Research
    billions of dollars, which were then used to finance dangerous trades. Alameda
    Research and Three Arrows Capital were on the list of debtors for the cryptocurrency
    lender BlockFi.


    More cryptocurrency business failures appear likely. Additionally, other exchanges
    besides FTX were involved in shady trading, utilizing depositors'' money when
    customers became concerned about the security of their digital currency deposits
    and wanted their money back.


    ## Who is most at risk to the effects of crypto?


    Thankfully, banks are secure. They each hold roughly $9 billion in cryptocurrencies.
    Banks paid attention to regulators'' warnings to be cautious while investing in
    the asset class. Unexpectedly many retail investors possess cryptocurrency and
    experience some losses. Although broad, that exposure is very brief. In the US
    and Europe, 10% of homes have cryptocurrencies. The typical holding in the US
    is $1,000, and most European investors hold under $5,000.


    Venture capital firms, which have staked much money on the cryptocurrency market,
    are the true bag holders. Only a few hundred of the 10,000 or so companies connected
    to the cryptocurrency industry are publicly traded. Venture capitalists, who funded
    the majority of the remainder, are now facing significant (and, in some cases,
    almost entirely) losses.


    **So, is the once-booming industry''s end near?**


    Not exactly. Some more popular currencies, such as bitcoin and ether, appear resilient.
    For instance, Bitcoin is still four times higher than it was in December 2018
    despite a 75% decline from its top in November 2021. The second-placed token,
    ether, has increased by more than 1,000%. But there is unquestionably a significant
    shrinking happening. Not all tokens will survive. Since their customers prefer
    to keep their cryptocurrency in "digital wallets," which often don''t allow holders
    to earn a return on their cryptocurrency but ensure their assets stay safe, many
    exchanges and crypto lenders won''t.


    The exchanges that endure will have to put in a lot of effort to demonstrate to
    users that their money is safe and liquid rather than being the next FTX waiting
    to crash.


    Washington will likely impose more regulations in the future to put an end to
    the cryptocurrency industry''s ad hoc character. This shake-up is necessary for
    the industry''s survival to eliminate the currencies and businesses that are nothing
    more than hype and to focus on the few promising players. It will be much tougher
    to demonstrate their usefulness and practical value now; gone are the days of
    easy riches.


    ## Learn From FTX And Stop Making Speculative Investments'
