    # 概述

    国际商业机器公司（NYSE:IBM）在区块链行业取得了进展。该业务已成为企业级区块链服务的市场领导者，并非常适合从该行业的积极趋势中获益。机构可以使用该公司的分布式账本技术（DLT）平台安全地存储、管理并与第三方共享数据。该平台基于开源
    `Hyperledger Fabric` 平台构建，该平台是通通过合作开发的，旨在增强多个行业的区块链技术。在顶级区块链股票中，国际商业机器公司（NYSE:IBM）位列第六。


    国际商业机器在华尔街（NYSE:IBM）上情绪乐观。10 月，摩根士丹分析师 Erik Woodring 重申了其对国际商业机器公司（NYSE:IBM）股票的“增持”评级，并将目标价从
    155 美元下调至 152 美元。10 月 17 日，国际商业机器公司（NYSE:IBM）分析师 David Grossman 将该股票的目标价从 150
    美元上调至 140 美元，同时维持“买入”评级。


    截至 2022 年第三季度末，40 位投资者披露了国际商业机器公司（NYSE:IBM）的持股，总价值达 8.687 亿美元。截至 9 月 30 日，该公司业务最大的股东是
    Arrowstreet Capital，持股为 515.76 亿美元。


    国际商业机器公司（NYSE:IBM）、万事卡公司（NYSE:MA）、Visa 公司（NYSE:V）和 PayPal 控股公司是预计在未来几年内将继续在全球区块链行业领先的少数企业（NASDAQ:PYPL）。


    ## 本章主要特征

    * 值得买入的顶级区块链之一是 Riot Blockchain, Inc. (NASDAQ:RIOT)。

    * 2022 年第三季度末，24 家对冲基金披露了对 Robinhood Markets, Inc. (NASDAQ:HOOD）价值 7.4 亿美元的持股。

    * 2022 年第三季度末，28 位投资者的投资组合中持有 Coinbase Global, Inc. (NASDAQ:COIN) 价值 9.768 亿美元的股票。

    * 该业务已成为企业级区块链服务的市场领导者，并非常适合从该行业的积极趋势中获益。

    * 在顶级区块链股票中，国际商业机器公司（NYSE:IBM）位列第六。


    # 区块链即服务 (BAAS)


    ## 区块链即服务 (BaaS)：是什么？

    “块链即服务”（Blockchain-as-a-service，简称“BaaS”）是指一种云管理平台，允许个人和公司快速地创建、托管和维护区块链应用程序。“BaaS”这一缩写也经常用于“后端即服务”（backend
    as a service）。


    由第三方为开发区块链应用程序的企业建立和管理云网络被称为块链即服务（BaaS）。这些第三方服务是快速发展的区块链技术领域的一项近期创新。区块链技术的使用已扩展到包括各种安全交易，远超其在比特币交易中最著名的用途。


    通过块链即服务，由第三方管理基础设施和后端，降低了个人和企业的采纳门槛。因此，产生了对托管服务的需求。


    ### 学习块链即服务 (BaaS)

    BaaS 的运行方式与软件即服务（SaaS）的概念类似，实际上也是构建在其之上的。通过云解决方案，客户可以创建、托管和管理他们的区块链应用以及相关的区块链服务。云服务提供商同时保持基础设施的活性和功能性。BaaS
    被认为是大型区块链生态系统中的一项突破，将增加区块链的业务用途。


    ### BaaS 市场的领先公司包括：

    * 2015 年，得益于 `Microsoft` 与 `ConsenSys` 的合作，以太坊区块链即服务在 `Microsoft Azure` 上可用。

    * 亚马逊发布了 `Amazon Managed Blockchain`，该解决方案使用 `Hyperledger Fabric` 和 `Ethereum`
    等开源框架，“使其更容易构建和管理大型区块链网络”。

    * R3 是国际金融机构的合作，创建了 `Corda`，一种分布式金融账本。

    * `PayStand`，专注于企业间的资金转账。


    企业和消费者都变得越来越开放采用区块链技术。然而，开发、建立、运行和维护区块链基础设施相关的技术挑战和行政负担往往会成为障碍。


    通过支付费用，BaaS 提供了一个外部服务提供商来建立所有所需的区块链基础设施和技术。完成后，提供商将继续处理客户复杂的后端流程。BaaS 提供商通常提供支持服务，包括带宽管理、适当的资源分配、托管需求和数据安全功能。BaaS
    提供商让客户能够专注于区块链的基本功能。


    ### 区块链即服务 (BaaS) 的示例图

    Hyperledger 项目的区块链即服务 `Hyperledger Cello` 是一种类似于 BaaS 的区块链模块工具包和实用程序系统。BaaS 提供商的功能类似于网站托管公司。网站的内容由其开发者在个人计算机上创建和维护。他们可能会聘请支持人员或在
    `HostGator` 或 `Amazon Web Services` 等第三方托管商处注册。这些外部公司处理基础设施和维护方面的困难。


    BaaS 可能是许多业务部门和行业垂直领域更广泛、更深入使用区块链技术的动力。无论组织规模大小，都可以外包具有技术挑战性的工作，并专注于其核心竞争力，而不是构建和管理自己的区块链。


    ## BaaS 是如何工作的？

    区块链是这项新兴技术的必要组件。在区块链技术的帮助下，组织可以快速安全地交换数据，因为交易不受任何一方的控制。


    为特定应用程序构建、维护和监控区块链系统需要花费大量时间，因为它通常具有复杂性。分布式账本是区块链即服务（BaaS）的一种广泛使用的替代方案，特别是对于寻找降低成本方法的企业。尽管区块链技术有很多用途，但某些行业仍需要帮助来实现其全部潜力。


    ## 企业如何从区块链中受益？

    通过云计算，BaaS（区块链即服务）使能够能够构建维护基于区块链的网络。提供第三方服务是区块链技术领域较新的进展。区块链应用已发展到包括各种安全交易，远超其在比特币交易中最著名的用途。因此，对托管服务的需求很大。BaaS
    使任何规模的企业都能够利用区块链提供商的服务来实现区块链应用。


    Fortune Business Insights 预测，全球 BaaS 市场在 2020 年至 2027 年将以 39.5% 的复合年增长率增长，到 2027
    年达到 249.4 亿美元。


    ## 区块链即服务有多重要？


