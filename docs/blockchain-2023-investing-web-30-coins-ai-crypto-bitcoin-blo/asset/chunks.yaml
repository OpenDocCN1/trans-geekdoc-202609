    # 2023 年最佳的 11 家新兴区块链公司


    **Fluree**: [`flur.ee`](https://flur.ee)，成立于 2016 年


    它是做什么的？Fluree 是一种构建在区块链上的语义图数据库。它让开发者能够以快速的搜索速度创建图谱和概念地图。该公司承诺所有数据都可以追溯到其源头，它的语义标准使其脱颖而出。用户可以通过其主产品以不同的方式查看他们的数据并保持其安全。


    **MeetKai**: [`meetkai.com/`](https://meetkai.com/) 成立于 2018 年


    这家位于洛杉矶的公司想要开发一个带有整个世界地图的虚拟现实应用。MeetKai 已经在跟踪许多现实世界中的地点并将其添加到应用中。该公司想要让元宇宙中的人们能够看到真实的场所。MeetKai
    使用 AI 模型识别地点和语音模式，以帮助实现其使命并创造引入的 VR 体验。


    **Constellation Network**: https://constellationnetwork.io/


    成立于 2017 年


    Constellation Network 是一个可以被想要快速构建新区块链应用的创业者使用的区块链。得益于其高度去中心化的 DAG 设计和零层数据传输层（仅使用六个节点在七秒内即可达到
    8,000 TPS），它具有极高的交易速度。为了进一步增强其在区块链应用背景下的可扩展性，该网络还提供了一种无需产生费用即可完成交易的方法。由于 Constellation
    Network 的特性，开发者将能够构建连接到其他区块链的应用，并帮助他们建立自己的生态系统。


    **Metaking Studios**: [`www.metakingstudios.com/`](https://www.metakingstudios.com/)
    成立于 2017 年


    MetaKing Studios 是一家 AAA 公司，正在制作《Blocklords》，这是一款中世纪幻想大策略 MMO 游戏，玩家可以拥有数字资产。团队计划为游戏添加
    DeFi 功能，为其提供一种目前区块链游戏中尚不存在的经济模式。该团队拥有世界各地的合作伙伴，他们的目标是制作深度且有趣的区块链游戏。


    **Certik**: [`www.certik.com/`](https://www.certik.com/) 成立于 2018 年


    CertiK 是一家主要关注安全的区块链初创公司。该公司由哥伦比亚大学和耶鲁大学的教授创立。他们使用被证明有效的研究来提高区块链的安全性，这是使用区块链的企业可以利用的。Certik
    已实施 AI 系统和形式化验证来应对网络安全威胁。它还检查其他项目的安全性，并在网站上列出最安全的网站。


    **Poko**: [`www.pokoapp.xyz/`](https://www.pokoapp.xyz/) 成立于 2022 年


    Poko 是一个让 DAO 合法的新颖想法。它的创建者称之为“DAO 的 Slack”。它通过简化法律和技术步骤，让任何人都能更容易加入现有的 DAO 或建立自己的
    DAO。法律设立费用将减少到很小的一部分，例如 50 美元。这将让更多在线用户能够使用 DAO。


    **Soon**: [`www.soon.app/`](https://www.soon.app/) 成立于 2020 年


    Soon 与其他加密货币投资应用不同，因为它不需要用户成为活跃投资者。在 Soon，任何拥有借记卡或储蓄账户的人都可以进行投资，而无需担心资金是如何被管理的。问题在于该应用有超过
    3% 的交易费，这很高。但如果你想从银行账户快速方便地投资（包括投资加密货币），这笔微小的代价是值得的。应用将在美国启动，然后扩展到其他国家。


    **Payourse**: [`www.payourse.com/`](https://www.payourse.com/) 成立于 2019 年


    Payourse 位于非洲，拥有那里所有初创公司最好的想法：制作建立加密交易所的工具。他们建立了一个名为 `Coinprodile` 的网站，允许任何人向非洲的人发送加密货币。但
    `Simpa` 是大家讨论的话题。它是一个让科技企业家无需编写任何代码即可快速建立加密交易所的应用。非洲加密市场需要增加在该大陆对数字货币的使用。


    **Finnt**: [`www.finnt.com/`](https://www.finnt.com/) 成立于 2022 年


    Finnt 想要制作一个方便储钱和汇回国内的应用。用户可以通过去中心化网络建立高息储蓄账户，并使用 `Stablecoins` 来支撑这些账户，保护持有者免受通货膨胀的影响。Finnt
    有潜力成为许多国家首选汇款应用，因为它可以用于跨境储蓄和支付。


    **Argo**: [`watchargo.com/`](https://watchargo.com/) 成立于 2020 年


    Argo 代表“艺术家走向四方”。艺术家和短片制作者可以在 Argo 上分享他们的作品，Argo 具有 NFT 功能。事实上，它拥有基于类型和小众内容的精选列表。它还帮助创作者推广他们的电影并通过
    NFT 赚钱。


    **JustCarbon**: [`www.justcarbon.com/`](https://www.justcarbon.com/) 成立于 2021
    年


    JustCarbon 是一个消除碳项目的市场，使碳市场透明化。在 JustCarbon 区块网上，买家可以购买 `JCR` 令牌来支持有利于环境的项目。一个
    `JCR` 等于移除一吨碳。尽管该公司承认碳排放通常是避免的，但他们帮助公司减少碳足迹。


    许多基于区块链的初创公司正尝试使用 Web 3.0 来解决许多问题。尽管我们只讨论了少数初创公司，但我们我们提供了行业发展的思路。


    ## 2023 年关注区块链趋势


    区块链改变了许多行业交易和数据共享的方式，包括信息技术、金融、政府和医疗。区块链支持者一直对分布式账本技术在网络安全、金融服务、物联网 (IoT)、房地产和供应链管理方面的可能性感到兴奋。


    展望 2023 年，还有一些值得关注的市场以观察区块链如何被使用。以下四个行业将加速区块链的使用。


    ### 云服务


    国际数据公司表示，全球公共云服务市场（包括 `infrastructure-as-service`、`platform-as-service` 和 `software-as-service`）在
    2021 年的规模已达 4086 亿美元。


