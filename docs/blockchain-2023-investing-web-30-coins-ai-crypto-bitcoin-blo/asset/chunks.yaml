    ### **10 月 12 日：** 位于新泽西州的加密货币贷款机构 `Celsius Network LLC` 收到来自魁北克存款投资局（Caisse de
    dépôt et placement du Québec）的 15 亿美元投资。


    ### **11 月 10 日：** 比特币的历史日内高为 68,789.63 美。


    ### **11 月 16 日：** 以太坊以 4,891.70 美元达到历史日内高。


    ## 2022


    ### **1 月：** `OTPP` 继续对 `FTX` 进行 2,000 万美元的美国投资。


    ### **1 月 10 日：** `Fidelity Investments Canada ULC` 宣布其资产配置型 ETF 现在将包含 1% 至 3%
    的比特币敞口。（截至本文发布时，目标配置保持不变。）


    ### **2 月 14 日：** 位于新泽西州的 `BlockFi Lending LLC` 同意向 `美国证券交易委员会` 支付 1 亿美元罚金，并寻求注册其加密货币贷款服务。


    ### **3 月 31 日：** 根据 `National Bank Financial` 的信息，加拿大加密货币 ETF 的管理资产已达 61 亿美元。


    ### **5 月：** 挂钩代币 `Luna` 和稳定币 `TerraUSD` 均崩盘。比特币在 6 月 18 日跌破 25,000 美。5 月初，其交易价格远高于
    50,000 美。


    ### **7 月 6 日：** 总部位于纽约的加密货币经纪 `Voyager Digital Ltd.` 申请第 11 章破产。


    ### **7 月 13 日：** `Celsius Network` 宣布根据第 11 章申请破产。


    ### **8 月 17 日：** 魁北克存款投资局宣布注销其对 `Celsius Network` 的全部投资。


    ### **11 月 11 日：** `FTX` 宣布根据第 11 章破产。


    ### **11 月 17 日：** `OTPP` 宣布将注销其所有的 `FTX` 股权。


    ### **11 月 21 日：** 参员 `Elizabeth Warren`、`Dick Durbin` 和 `Tina Smith` 致信给 `FMR
    LLC`（富达投资），要求该公司重新考虑在 `401(k)` 计划中允许接触比特币的决定。


    ### **11 月 27 日：** 一家名为 `Bitfront` 的美国加密货币交易所宣布将于 2023 年 3 月关闭。据该平台表示，这一决定“与近期某些被指控行为不当的交易相关的困难无关”。


    ### **11 月 28 日：** `BlockFi` 宣布根据第 11 章破产，并声称对 `FTX` 有风险暴露。


    ## FTX 崩溃后，加密货币会发生什么？


    加密货币市场是否仍有光明，还是说加密泡沫即将破灭？近期加密货币行业破产申请的增加引发了人们对数字资产和该行业长期可持续性的担忧。


    首先，想想这场惨剧的程度：由于流动性问题导致的加密货币市场破产数量大幅上升。由于业务无法维持，`Three Arrows Capital`、`Alameda
    Research`、`Voyager Digital`、`FTX`、`Genesis`、`BlockFi` 和 `Celsius Network` 已经停止了客户提现或申请了破产。


    曾是全球最大的加密货币交易所之一的 `FTX` 崩溃是因为资产负债表缺乏资产导致的。11 月 7 日，由于有关交易所可能需要进行适当清算的传言，客户提取了
    6.5 亿美元资产。结果发现，`FTX` 使用客户资金资助其关联交易公司 `Alameda Research` 进行危险的赌博。在倒闭的前一天，该交易所仅有
    9 亿美元的流动资产来抵消其 90 亿美元的负债。作为加密货币领域的市场领导者，`FTX` 的崩溃是一个巨大的冲击，并削弱了对数字资产的信任。


    比特币持有者遭受了巨大损失：如果你计算出 `bitcoin`、`ether` 以及所有其他数字货币自去年达到或接近峰值以来的跌幅，市值损失将超过 2 万亿美元。


    目前大多数问题集中在加密货币贷款机构，这是加密货币业务中近年来快速增长的领域。在加密货币贷款机构或数字交易所存款数字资产的加密用户也可以赚钱，就像传统银行客户通过储蓄利息赚钱一样。由于历史性的低利率，银行储蓄账户在过去几年中仅提供极低的回报。然而，某些加密货币贷款机构和交易所提供了高得多的收益，通常是双位数，偶尔甚至高达
    20%。


    某些加密货币交易所和贷款机构所提供的不可持续收益的真相已大白于。这些加密货币公司像银行一样，通过贷款存款获利。


    借款人为贷款支付的费用是一个百分比，加密货币贷款机构则通过支付给存款人的利息与借款人支付的费用之间的差额盈利。然而，与传统的受监管贷款机构不同，加密公司不受银行监管机构的控制；因此，很少有规定限制他们必须保留的资本或他们对客户数字资产可以的操作。


    目前这些加密货币贷款机构的失败也凸显了许多业务之间是如何相互关联的。`FTX` 为关联交易公司 `Alameda Research` 提供了数十亿美元，这些资金随后被用于资助危险交易。`Alameda
    Research` 和 `Three Arrows Capital` 在加密货币贷款机构 `BlockFi` 的债务人名单上。


    可能会更多加密货币业务失败。此外，除了 `FTX` 之外的其他交易所也涉及不当交易，当客户担心其数字货币存款的安全并想要取回资金时，使用了存款者的钱。


    ## 谁受加密货币影响风险最大？


    幸运的是，银行是安全的。它们每家持有约 90 亿美元的加密货币。银行注意到了监管机构的警告，在投资此类资产类别时保持谨慎。意外的是，许多零售投资者持有加密货币并遭受了某些损失。尽管范围广泛，但这种暴露时间非常短。在美国和欧洲，10%
    的家庭拥有加密货币。美国的典型持有量为 1,000 美元，大多数欧洲投资者持有少于 5,000 美元。


    在加密货币市场押了大量资金的风投公司是真正的“接盘侠”。在 10,000 多家与加密货币行业相关的公司，只有几百家是上市公司。资助了剩余大部分公司的风险投资家现在面临着巨大的（在某些情况下几乎是全部的）损失。


    **那么，这个曾经繁荣的行业终结了吗？**


    并不完全如此。一些更流行的货币，如 `bitcoin` 和 `ether` 看起来具有韧性。例如，尽管从 2021 年 11 月的峰值下跌了 75%，比特币的价格仍是
    2018 年 12 月的四倍。第二大代币 `ether` 增长了超过 1000%。但确实发生了大规模的萎缩。并不是所有的代币都能生存。由于客户更倾向于将加密货币存放在`数字钱包`中（这通常不允许持有者从加密货币获得回报，但能确保资产安全），许多交易所和贷款机构将会消失。


    生存下来的交易所必须付出努力向用户证明他们的资金是安全且具有流动性的，而不是下一个等待崩溃的 `FTX`。


    华盛顿未来可能会实施更多监管，以结束加密货币行业的无章法状态。


