    ## Key Features in This Chapter


    - In terms of technology, `Blockchain` is a digital ledger that has recently attracted
    much interest.

    - Customers can create, host, and use their `Blockchain` apps, smart contracts,
    and other functionalities on the Azure cloud platform thanks to the Blockchain-as-a-service
    cloud-based service.

    - Two parties who want to execute a private transaction can use Blockchain technology
    in the world of private consumers.

    - There are 34 real-world Blockchain application cases for this practical, yet
    ground-breaking technology have been compiled for us.

    - Businesses are using Blockchain to improve the Internet of Things security and
    intelligence.

    - Over 500,000 shipping companies operate in the US, which leads to data soloing
    and transparency problems, according to a joint study by Accenture and logistics
    behemoth `DHL`.

    --oitte thinks `Blockchain` can give the sector a much-needed facelift regarding
    data rights, piracy, and payments.


    # THE BLOCKCHAIN AFTER THE FTX CRASH


    Investor trust has decreased as a result of several recent market disasters. Cryptocurrencies
    were entering the mainstream as 2022 got underway. Leading institutional investors
    had made large bets in cryptocurrency the year before, giving the market credibility.


    `Bitcoin` and `ether` values have already dropped by around 75% from their all-time
    highs due to a slew of industry failures, including the collapse of Bahamas-based
    `FTX Trading Ltd.` in November. Financial advisors and cryptocurrency specialists
    are split on the future of the sector.


    Many crypto doubters have interpreted the demise of `FTX` as confirmation of their
    darkest fears. According to Andrew Pyle, a financial advisor at `CIBC Wood Gundy`
    in Peterborough, Ontario, "[Cryptocurrency] is highly speculative, highly volatile,
    and it''s something you steer clear from until we see signs of maturity in that
    area."


    According to Pyle, who has never advised investing in cryptocurrencies, the sector
    has no place in the portfolios of the "overwhelming majority" of clients today,
    even though the Blockchain technology that powers cryptocurrencies is likely to
    bring investment opportunities in the future.


    Mark Noble, executive vice-president of ETF strategy at `Horizons ETFs Management
    (Canada) Inc.`, stated that "you''re looking at several years before you gain
    broader public faith in cryptocurrencies" as a result of the impact of `FTX`''s
    collapse.


    That said, Noble argued that Blockchain advancements would continue even if there
    were a period of low investor interest known as the "crypto winter." Both long
    and short `bitcoin` funds are available through `Horizons ETFs`.


    Consistent with Michael Zagari, a Montreal-based financial advisor with Burlington,
    Ontario-based `Mandeville Private Client Inc.`, institutional investors who believe
    in Blockchain technology''s transformative potential are likely to "double down"
    on their investments. There will be "a lot of bargains to be had," according to
    Zagari, who expects the business will remain unpredictable for the next 12 to
    18 months even though "just because one investment [FTX] didn''t perform doesn''t
    mean they''re going to stop there."


    For risk-tolerant customers with at least a ten-year time horizon, he advises
    investing no more than 10% of a portfolio in `bitcoin` or investments related
    to cryptocurrencies as part of their equity exposure. Other cryptocurrency exchanges
    have had to halt withdrawals due to `FTX`''s insolvency, and others are battling
    to stay in business.


    Additionally, "additional shoes are about to drop. We just don''t know how many
    or how big," said Alex Tapscott, managing director of `Ninepoint Partners LP`''s
    digital asset group, during a webcast on November 24.


    The `Ontario Teachers'' Pension Plan Board` and the `Caisse de dépôt et placement
    du Québec` exposed themselves to "huge concentration risk" by investing in a single
    crypto firm rather than taking positions in well-established cryptocurrencies,
    as claimed by Tapscott, who describes himself as "short-term bearish, long-term
    bullish" on cryptocurrencies.


    `Bitcoin` and `ether` will survive this fall, based on Brian Mosoff, CEO of Toronto-based
    `Ether Capital Corp.`, even if some exchanges don''t. The technology hasn''t altered,
    and the principles and value proposition of `bitcoin` and `ether` "still do exactly
    what they set out to do."


    The general public concurs. According to `National Bank Financial Markets` data,
    only $66 million of the loss in crypto ETF assets under management between January
    1st and November 30th was caused by withdrawals (`NBFM`).


    As mentioned by Daniel Straus, director of ETF research and financial products
    research with `NBFM`, "it seems like the crypto ETF users in Canada are keeping
    to their allocations," in an email to `Investment Executive`. The anemic outflows
    from Canadian crypto ETFs indicate its investors may consider them like "moonshot"
    long-term bets, even though `bitcoin` and `ether` are both exceedingly hazardous
    and speculative.


    After the failure of `FTX`, Mike Tropeano, Senior Director of Wealth Consulting
    at `Broadridge Financial Solutions Inc.` in Boston, predicted that international
    regulators would "be much harsher" toward the cryptocurrency business. The most
    well-known names will flee for safety in the upcoming years, and there will be
    a "thinning of the herd" and an increase in inventiveness.


    Tropeano stated that "the information is still pouring every day, [not only] regarding
    `FTX`, [but also] with the overall market." ''Anyone wishing to participate in
    the market — the [financial] advisor especially — needs to exercise great attention
    to stay current on events,"


    In the opinion of Mosoff, some "advisors are probably relaxing a little bit" because
    they know that their clients are less likely to inquire about cryptocurrency investments
    "until the next cycle starts." However, he predicted that the cycle would occur
    and advised advisors to use the crypto winter to further their education.


    Although the market has been shaken by the failure of `FTX` and `BlockFi Lending
    LLC`, the severity of the crypto winter may depend on how the sector''s stalwarts
    fare under pressure, as believed by Daniel Gonzalez, research analyst and consultant
    in Toronto for the California-based `Javelin Strategy & Research`: "I believe
    that the adoption of cryptocurrencies by retail investors would be halted for
    a period if `Coinbase`, `crypto.com`, or `Binance` were to go under."


    The advisor''s job today is similar to what it was during the height of cryptocurrency
    trading in many aspects. There is unquestionably a role for advisors to play in
