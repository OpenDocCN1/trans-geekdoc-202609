    游客现在可以搜索“任何时间、任何地点”的列表，这让那些不受限于特定假期日期或目的地的个人能够强调享受而非物流安排。长期住宿为公司创造了观观收入，所有这些元素共同促成了公司在整个
    2022 年夏季创纪录的预订量。


    然而，2023 年将成为旅游业终极颠覆者的转折点。房东与客人之间的矛盾对 Airbnb 来说并不陌生，最近的更新已经解决了一些主要问题，例如隐藏费用和冗长的家务清单。但
    Airbnb 在旅游业中拥有的独特地位正面临来自老牌酒店连锁加剧的竞争。


    如果客户对成本、责任和安全仍有顾虑，万豪酒店较新的 Homes & Villas 服务提供了类似的体验，且没有这些烦恼。消费者不再将 Airbnb 视为一个匆忙的初起之秀，这意味着游客将更彻底地对比各项项目，而不是仅仅让品牌影响他们的决策。Airbnb
    一直能够保持在竞争领先地位。


    即使 Airbnb 能够克服竞争，低迷的住房市场也威胁着品牌的成功。Airbnb（以及其他度假租赁业务）对负担得起的住房可用性的影响长期以来一直是批评的对象。如果利率一直高高到
    2023 年，该问题将获得更多关注，特别是在年轻买家中，他们是 Airbnb 大多数客户，且由于价格过高而无法成为首次购房者。


    在 2023 年，如果 Airbnb 想继续受到年轻游客欢迎，就必须正面对这些问题。根据旅游和酒店分析师 Lindsey Roeschke 的说法，否则，土豆屋广告的观众将变得厌烦。


    ## 转卖市场的增长将激增。


    转卖今年是成功的一年：Sandro、Timberland 和 Athleta 等品牌正在尝试转卖市场，并使用各种策略，包括平台合作伙伴关系、点对点交换和品牌自有寄卖。哪些策略失败、哪些成功尚有待观察。


    然而，销售趋势在 2022 年远未达到巅峰；2023 年的爆发式增长已定好框架。大量品牌的入驻吸引了消费者的兴趣，因为它们理想上能够解决消费者和卖者参与二手市场时的典型障碍，例如确认产品质量和真实性。将客户的购买历史与转卖平台连接，可以帮助公司通过减少创建列表花费的时间，让销售他们不再需要的产品变得简单。


    与此同时，由于通货膨胀导致买家更难获得新产品，购买二手商品已变得时尚。特别是女性，报告称 2022 年进行了更多的二手购物：11 月，22% 的女性表示她们在过去的三个月内在线购买过二手商品，高于
    5 月的 18%，而 35% 的女性表示在此期间在店内购买过二手商品。女性更有可能报告面临严重的财务困难，并特别被二手购物的成本节约所吸引。


    好消息是，二手购物者对圣诞商品上迷，就像本文作者一样。根据 Morning Consult 最近的分析，过去买过二手产品的人可能会再次购买。根据 Claire
    Tassin 的说法，随着持续的高通货膨胀，越来越多的公司进入这一市场，更多的消费者将受到鼓励尝试二手购物，并可能再次这样做。


    ## Mastodon 和 BeReal 等社交媒体竞争对手将失败。


    在 2022 年获得关注的竞争性社交平台，如 BeReal 和 Mastodon，在 2023 年需要帮助来保持势头，这会引起反垄断执法者的不满。这两个截然不同的应用今年因各种因素引起了关注。然而，随着社交媒体巨头积极推广它们的
    BeReal 模仿功能，以及更多用户意识到 Mastodon 太复杂，无法作为 Twitter 的可靠替代品，其增长将在 2023 年放缓。


    这只是两个例子，但遗憾的是，它们可能发生的轨迹发生得太频繁了。一个热门的新社交媒体挑战者在取得初步成功后不断进步，并像 TikTok 那样确立自己作为对市场的严重威胁，是非常罕见的。只需记住“tbh”、“Houseparty”或“Clubhouse”，这可能是最广为人知的例子。


    强调真实的连接，而不是在围绕“点赞”数量设计的平台上所受激励的过度筛选的内容，是许多出现的最新且最成功的社交媒体网络中反复出现的主题。这里有一些会吸引年轻群体的东西。因此，社交媒体竞争对手应该继续研究这种通用方法。尽管根据
    Kevin Tran 的说法，在如何实现这一愿景方面仍有很大的实验空间。


    ## 大型科技公司将继续投资 AI。


    大型科技企业正专注于投资尖端的机器学习应用，这些应用将通过简化现有的产品和服务，或在短期内开发出全新的服务，或者它们已经在这些应用上看到了投资回报。尽管技术尚未达到准确复制人类智能的程度，但这种先进的机器学习在媒体中通常被称为
    `AI`。对这些 `AI` 应用的引用越来越频繁，对该主题的兴趣稳步增长（参见 Google 搜索趋势）。


    为什么这一切都发生在现在？支持这些尖端应用的处理能力终于进入了主流。像 `Nvidia` 这样的芯片制造商正在营销专门的深度学习和人工智能 (`AI`) 解决方案。`Intel`
    正在朝着其开发强大的量子计算芯片的截止日期进展，这些芯片预计将引领计算能力的新时代。


    我们使用的许多日常服务已经有 `AI` 程序在后台运行。`Google` 表示，其对 `AI` 技术的投入在第二季度的搜索、翻译和地图服务已获得回报。`Meta`
    表示，其平台在第二季度收到了 `AI` 程序的内容推荐。


    展望未来，“生成式” `AI`——可以根据用户文本输入生成内容的函数和 `APIs`——是该领域发生最引入胜的突破的地方。`DALLE`、`Stable Diffusion`
    和 `Mid journey` 目前非常受欢迎，它们让这一切成为可能，并能产生足以获奖的壮丽景观。根据简短的建议，某些程序如 `GPT-3` 可能会快速编写全文文章、短故事或评论文章。


    根据 Morning Consult 最近的一项调查，这些先进学习模型的新颖和兴奋的应用将在 2023 年（及以后）出现，但只有部分人对此充满期待。此外，根据技术分析师
    Jordan Marlatt 的说法，对于工作风险和复杂的伦理问题，我们才刚刚触及皮毛。


    客户更倾向于自己制作食物和烘焙。


    2022 年，通货膨胀主了食品饮料行业的新闻。该类别自 20 世纪 80 年代以来最高的通胀率是由食品价格上涨引起的，这促使消费者采取各种策略来减少杂货支出，包括缩小规模选择更便宜的选项以及由于需要减少整体购买量。

