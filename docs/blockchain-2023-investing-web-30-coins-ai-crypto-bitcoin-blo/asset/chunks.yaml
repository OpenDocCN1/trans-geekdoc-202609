    \nDespite rising consumer demand, comprehensive regulation is unlikely to happen\
    \ in the coming year as the Biden administration strikes a balance between monitoring\
    \ criminal behavior and limiting a potentially lucrative business. The Securities\
    \ and Exchange Commission is most likely responsible for any regulation.\n\n**There\
    \ will be more proliferation and scrutiny of \"buy now, pay later.\"**\n\nWhile\
    \ BNPL services have shown consistent growth among Gen Z adults and millennials\
    \ throughout 2022, this expansion coincided with greater regulatory scrutiny.\
    \ The offer's attraction is clear when inflation pushes household budgets to the\
