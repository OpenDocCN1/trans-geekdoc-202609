    纳斯达克上市的 Marathon Digital Holdings, Inc. (`NASDAQ:MARA`) 是一家区块链网络和数字资产矿工提供企业级托管和基础设施的服务商。该业务是目前最值得购买的区块链股票之一，并有望从区块链开发和数字资产挖矿需求的增长中获利，特别是当比特币和加密货币获得更广泛的认可时。


    10 月 7 日，Lucas Pipes 分析师 B. Riley 维持了中性评级，并将 Marathon Digital Holdings, Inc. (`NASDAQ:MARA`)
    的目标价从 10 美元下调至 8 美元。


