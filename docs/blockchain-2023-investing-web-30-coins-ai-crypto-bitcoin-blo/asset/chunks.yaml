    # WHAT IS BLOCKCHAIN TECHNOLOGY? HOW DOES BLOCKCHAIN WORK?


    The term "Blockchain technology" has probably come up with cryptocurrencies like
    `Bitcoin` over the past few years. Maybe you''re thinking, "What is Blockchain
    technology exactly?" Blockchain is a platitude, but only in the hypothetical sense
    because it lacks a tangible meaning, one that the typical person can clearly understand.
    It is essential to explain "what Blockchain technology is," including the technology
    involved, how it functions and is becoming important in the digital sphere.


    You are responsible for educating yourself on this developing technology to be
    ready for the future when Blockchain develops and becomes more approachable. If
    you''re new to Blockchain, this is the best location to learn the basics. In this
    chapter, you will discover how to respond to the query, "what is Blockchain technology?"
    Additionally, you will find out how Blockchain functions, why it''s significant,
    and how you may use it to advance your profession.


    ## What is Blockchain?


    To comprehend Blockchain, you must know that a block is only a piece of data.
    Anything that may be stored digitally, like financial transactions, invoices,
    bills of lading, or hashes from the block previously added to the chain is included
    in that block.


    What is a hash? Consider it a statistically determined fingerprint that identifies
    every piece of information in that block. The fingerprint of the previous block
    is included in every block, and this chaining of hashes gives the Blockchain its
    immutable characteristics. The hash of that block and all succeeding hashes will
    change if someone went back and changed a transaction in the chain.


    ## What is Blockchain technology?


    Blockchain technology stores data that makes it difficult or impossible for the
    system to be changed, hacked, or misused. A distributed ledger known as a Blockchain
    distributes and copies transactions among a system of computers.


    Blockchain technology keeps public transactional records across numerous databases
    in a network connected by peer-to-peer nodes. These records are commonly referred
    to as "blocks," and the term "digital ledger" is widely used to describe this
    storage.


    The owner''s digital signature serves as a validation and fraud prevention mechanism
    for every transaction in this ledger and helps authenticate the transaction. The
    information in the digital ledger is, therefore, very secure.


    The digital ledger can be compared to a network of computers sharing a Google
    spreadsheet, whereas transactional data are preserved per actual purchases. The
    data is available for public viewing, but it cannot be changed, which is a fascinating
    feature.


    ## How Blockchain Started


    The term "Blockchain" may conjure images of `Bitcoin` or other cryptocurrencies.
    This was the setting where the term was first introduced; but before all of that,
    there was the idea of a Blockchain.


    David Chaum suggested a Blockchain-like system in his doctoral paper at the University
    of California, Berkeley, back in 1982.


    Bellcore researchers submitted a report on using a Blockchain technique to ensure
    document timestamps nearly ten years later. They would later start a business
    called Surety (more on them in a second). Before 2008, a person or group, Satoshi
    Nakamoto, developed the Blockchain idea that would eventually power `Bitcoin`.


    Relating to Surety, since 1995, it has been posting the most recent hash of each
    electronic document it has ever sealed in The New York Times Public Notices section.
    The fact that it is generally known taps into another approach that Blockchains
    can use. It would be challenging to covertly edit a block that has already been
    added to the chain, the more widely broadcast a hash is.


    Since each participant has a copy of the most recent hash, this idea maintains
    integrity in public and consortium Blockchains. It ultimately evolved into `Bitcoin`''s
    core, the well-known cryptocurrency that acts as a public record for all network
    transactions.


    ## Why is Blockchain Popular?


    Consider sending funds from your bank account to relatives or friends. You connect
    to online banking using your account number and transfer the funds to another
    individual. Your bank updates the transaction records after the transaction is
    complete. It is relatively easy. But a potential problem exists that most of us
    ignore: these kinds of transactions are easily manipulated. People aware of this
    truth are reluctant to use them, which is the reason why third-party payment programs
    have developed over the past few years. This weakness was the primary motivation
    behind the development of Blockchain technology.


    In terms of technology, a Blockchain is a digital ledger that has recently attracted
    much interest. But why has it gained such a following? So let''s investigate it
    to understand the idea entirely. Data and transaction recording is an essential
    component of the business. When this information is handled internally or through
    third parties like brokers, bankers, or lawyers, the business takes time, money,
    or both. Fortunately, Blockchain eliminates this drawn-out procedure and enables
    the transaction to move more quickly, saving time and money.


    Most people believe `Bitcoin` and Blockchain may be used interchangeably, but
    it is different. `Bitcoin` is a currency that depends on Blockchain technology
    to be secure, and Blockchain technology can enable applications connected to multiple
    industries like finance, supply chain, manufacturing, etc.


    **Blockchain is a new technology with several benefits in a society that is becoming
    more digital:**


    *   **Extremely secure:** It uses a digital signature function to execute fraud-free
    transactions, making it easier for other users with a specific digital signature
    to corrupt or edit an individual''s data.

    *   **Decentralized system:** In the past, the approval of regulatory bodies like
    a government or bank is necessary for transactions. Still, with Blockchain, transactions
    are completed by user consensus, resulting in trouble-free, safer, and faster
    transactions.

    *   **Automation capability:** When the trigger''s requirements are satisfied,
    it can be programmed to automatically generate a series of activities, events,
    and payments.


    ## How does Blockchain technology work?


    You may have observed that several companies have been incorporating Blockchain
    technology in recent years. But how does this technology operate? Is it a substantial
    modification or merely an addition? Let''s start with demystifying Blockchain
    technology since it is still in its early stages and has the potential to be revolutionary.


    **Combining three popular technologies, Blockchain consists of:**


    1.  Cryptographic keys

    2.  A peer-to-peer network with a shared ledger

    3.  A method of computing that can be used to store network transactions and records


    ## Different Types of Blockchain

