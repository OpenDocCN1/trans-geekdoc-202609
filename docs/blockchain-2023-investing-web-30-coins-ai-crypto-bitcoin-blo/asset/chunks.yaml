    区块链有四种不同的类型：


    ### 私有区块链网络

    单一权威控制私有区块链网络，该网络在封闭网络上供私人公司和组织运行。私有区块链允许企业设置网络特性、可访问性和权限选择以及其他关键的安全特性。


    ### 公有区块链网络

    数据并非存储在一个处，而是通过 `DLT` 分布在整个点对点网络中。共识算法验证信息的合法性；两种流行的共识技术是`Proof of Stake`（`PoS`）和`Proof
    of Work`（`PoW`）。公共区块链有助于传播分布式账本技术（`DLT`）的，并消除了一些困难和问题，包括中心化和安全弱点。


    ### 许可链区块链网络

    许可链区块链（有时被称为混合区块链）是允许经过批准的用户独占访问的私有区块链。这些区块链通常由企业建立，以实现两者的优势。它们在决定谁可以参与网络以及进行哪些交易时，提供了更好的结构。


    ### 联盟链区块链

    联盟链最适合与各种组织合作。与许可链区块链类似，联盟链同时具有公共和私有属性。然而，一个单一的联盟链区块链网络将由许多公司管理。尽管最初建立较困难，但这些区块链一旦运行起来，就能提供卓越的安全性。


    ## 交易流程

    区块链技术确认和授权交易的方式是其定义特征之一。例如，如果双方要使用各自的私钥和公钥完成交易，第一方会将交易详情附加到第二方的公钥上。然后，所有这些数据被汇成一个区块。


    该区块包含时间戳、数字签名和其他重要信息。必须强调的是，区块不包含双方交易身份的信息。随后，该区块被发送到整个网络，当正确的用户使用其私钥与区块匹配时，交易即完成。


    区块链应用的一个示例：


    ### 哈希加密

    区块链技术对数据进行哈希和加密，主要使用 `SHA256` 方法来保护数据。`SHA256` 方法传递了有关发送者地址（公钥）、接收者地址、交易和私钥的信息。经过验证后，哈希数据会被发送到全球并以加密格式放入区块链。通过
    `SHA256` 算法几乎不可破解的哈希加密，发送者和接收者的身份验证变得更加容易。


    ### 工作量证明

    * 区块链中的每个区块都有四个主要标头。

    * `Previous hash`：标识此区块之前的区块。

    * `Transaction details`：关于必须发生的每笔交易的信息。

    * `Nonce`：在密码学中，一个任意整数用于区分区块的哈希地址。

    * `Block hash address`：使用哈希算法发送上述所有信息，包括交易信息和 nonce。这产生一个独特的“哈希地址”输出，这是一个长度为 64
    个字符的 256 位数字。因此，被称为区块哈希。

    * 通过计算机程序，许多人尝试发现满足预定标准的适当哈希值。当满足预定条件时，交易完成。简单来说，区块链矿工试图解决一个工作量证明问题（一个数学难题），第一个解决它的人将获得奖励。


    ### 挖矿

    在区块链技术中，将交易信息添加到当前的数字/公共账本被称为“挖矿”。尽管与比特币有关，但该术语也用于描述其他区块链技术。挖矿涉及创建一个难以伪造的区块交易哈希。这确保了整个区块链的安全性，而不需要中心化系统。


    ## 区块链：优势与缺点

    区块链技术有几个优点和缺点：


    ### 优势

    * 由于其高水平安全性，区块链的一个主要优势是它们可以安全地保护在线交易中的敏感数据。

    * 区块链技术还为有需要的人提供了快速且方便的交易。

    * 与可能需要几天时间完成的其它交易技术相比，它只需要几分钟。

    * 没有政府或金融机构的第三方参与，许多用户认为这是一种积极的因素。


    ### 缺点

    * 区块链和密码学都使用公钥和私钥，据说私钥偶尔会导致问题。

    * 区块链的一个缺点是，如果用户丢失了私钥，他们需要帮助。

    * 另一个是由于节点交易数量限制导致的扩展性限制，因此，完成大量交易可能需要几小时。

    * 信息一旦被记录，添加或更改的困难是区块链的另一个重大缺陷。


    ## 区块链如何使用？

    区块链存储了加密货币金融交易和其他类型的数据，如产品追踪。例如，食品产品可以从发货到交付到目的地一直被追踪。这些信息非常有帮助，因为可以简单地识别污染疫情的源头。这只是区块链用于存储数据的众多方式之一。


    ### Linux 基金会托管的 Hyperledger

    Linux 基金会是国际合作伙伴 `Hyperledger` 的所在地，该组织汇聚了技术、供应链、银行和 `IoT`（物联网）领域的领导者。通过为分布式账本建立开放的、跨行业的标准，`Hyperledger
    Fabric` 允许程序员创建满足特定需求的区块链应用程序。


    ### 去中心化

    去中心化是功能、权力、人员或事物远离中心或权威的分布或分散。在业务中，它通常是指权力从高级高管转移到组织架构图中的中间经理和基层团队成员。下放有许多优势，但经常提到的包括更好的沟通、增强员工赋权以及提高灵活性和响应能力。


    ### 透明度

    透明一直是去中心化最关键的部分之一。在去中心化组织中，所有员工都有权访问信息和决策程序。由于这种开放性，员工更容易相互信任并合作。此外，它让员工对自己的选择负责。


    ## 比特币 vs 区块

    到今为止最知名且利润丰利的加密货币 `Bitcoin` 最初于 2009 年提出，并日益受欢迎。由于其去中心化的本质（防止了中心权威或银行管理其供应），`Bitcoin`
    非常流行。这意味着使用它不涉及交易费用且是匿名交易。


    区块链是双方之间交换的数据库，数据块（包括每笔交换的详情）按其发生的顺序添加到链中。随着新区块的添加，区块链不断扩大，随着在每条记录之后添加了更多区块，编辑该记录变得越来越困难。


    ## 区块链 vs 银行


