    此外，还可以购买使用或开发区块链技术的企业股票，例如 `Starbucks` 或 `Walmart`。通过实施数字账本系统，公司可以变得更加精简且更有盈利；随着时间的推移，更高的收益等同于更高的股票价值。


    然而，其他企业对区块链进行了更具体的押注。数字支付领域的领导者 `PayPal Holdings` (`NASDAQ:PYPL`) 允许企业通过其子公司 `Braintree`
    接受比特币支付。此外，该公司正在开发更多方法，以便在其 `PayPal` 和 `Venmo` 数字钱包应用中包含区块链以及加密货币的买卖功能。


    同样，可以使用 `Square` (`NYSE:SQ`) 的 `Cash App` 数字钱包来买卖 `Bitcoin`。老牌数字支付公司巨头 `Visa`
    (`NYSE:V`) 和 `Mastercard` (`NYSE:MA`) 也在与加密货币和区块链初创公司合作，以确保其支付网络在时代演变中保持竞争力。


    大宗商品和金融衍生品交易所的领导者 `CME Group` (`NASDAQ:CME`) 也因推出首比特币期货和期权市场而值得关注。


    此外，`Facebook` (`NASDAQ:FB`) 仍在努力通过其 `Libra` 项目将金融服务和数字支付整合到其应用中。政府监管机构多次阻止了这家社交媒体巨头的野心。尽管如此，拥有超过二十亿用户的
    `Facebook` 如果能解决如何运作的问题，可能会成为区块链领域的主要参与者。`Salesforce` 的平台包含软件，允许用户在日常业务中使用区块链或接受加密货币支付。


    技术从半导体开始，正如所有技术一样。数字货币通常使用由 `NVIDIA` (`NASDAQ:NVDA`) 和 `AMD` (`NASDAQ:AMD`) 制造的图形处理器
    (`GPU`) 芯片。即使是老 `Intel` (`NASDAQ:INTC`) 也设有与创建区块链的企业合作的部门，以促进创新和增长。IBM (`NYSE:IBM`)
    是一家寻求适应快速变化的世界的老牌计算公司，其区块链部门已与多家企业合作，帮助他们使用新技术。


    区块链服务在三大公共云服务提供商的平台上提供，包括 `Google Cloud` (`NASDAQ:GOOG`)、`Microsoft Azure` 和 `Amazon
    Web Services` (`NASDAQ:AMZN`)。特别是 `Amazon` 可能将这些功能集成到其庞大的电子商务业务中。虽然这不是有针对性的押注，但如果数字账本技术的使用增长，这些云提供商可能会获得巨大的收益。


    区块链技术与其他技术一样，可能为进步型企业提供开发和发现新价值的机会。去中心化的数字账本现在被用于金融交易和物流效率改进，但它们在公司运营的其他领域仍有许多应用潜力。


    如果你想对区块链的持续发展进行押注，购买那些花时间充分理解并利用该技术的企业股票可能是一个稳健的长期投资计划。


    # 区块链技术的投资策略


    购买任何开发、使用或投资加密货币的上市公司股票，是投资区块链技术的一种简单方法。


    ## 区块链特定股票：通用型企业


    最为人知的使用或与区块链技术合作的上市公司包括：


    * `IBM`（提供块（链）服务）

    * `Amazon`（提供 `Amazon Managed Blockchain` 服务）

    * `Intel`（提供区块链服务）

    * `Intel`（向加密货币矿工出售 `GPU`）

    * `AMD`（向加密货币矿工出售 `GPU`）

    * 卡：`Mastercard`（与 `R3` 合作基于区块链的跨境支付）


    ## 霍尼韦（使用区块链跟踪销售）


    * 使用 `DocuSign`（提供区块链服务）

    * `J.P. Morgan`（创建了其加密货币 `JPM Coin` 及其区块链项目部门）

    * `Israel`（制造矿硬件）

    * `The Silvergate`（为区块链和加密货币公司提供银行服务）


    ## 个人区块链股票：涉及加密货币的企业


    作为替代，一些上市公司提供与加密货币相关的服务，或对其有直接的敞口：


    * `Block`（提供比特币支付服务，同时也持有比特币）

    * `PayPal`（提供比特币支付服务）

    * `Grayscale Ethereum Trust` 和 `Grayscale Bitcoin Trust` 分别运行比特币投资基金（运营以太坊投资基金）

    * `International Currency Exchange`（运营 `Bakkt` 加密货币交易所）

    * `Oversupply`（接受比特币的数字零售商）


    随着加密货币的使用变得广泛，将更多比特币公司上市。例如，美国最大的加密货币交易所 `Coinbase` 已 2021 年上市。


    ## 区块链基金


    除了购买个股外，还有其他方式接触区块链。根据 Jones 的说法，某些基金提供了区块链技术的敞口，并被主要归类为传统的[投资]基金。


    共同基金和交易所交易基金持有资产组合，通常是个人投资者的首选工具，因为它们提供了多样化，从而以相对较低的成本降低风险。然而，它们在这个行业中有一个独特的优势。


    尽管有上述 `Grayscale Bitcoin Trust` 等几种可能性，`Bitcoin ETFs` 仍需出现：截至 2021 年初，美国 `SEC`
    拒绝许可它们，因为很难确定该货币的价值和流动性。


    这些问题在区块链并不存在。现在有越来越多的区块链 ETF 可供选择。这些投资于几家使用区块链技术的企业。以下是最大的几个：


    * `Amify Transformational Data Sharing ETF`

    * `Reality Shares Nasdaq NexGen Economy ETF`

    * `First Trust Indxx Innovative Transaction & Process ETF`

    * `Goldman Sachs Finance Reimagined ETF`，以及

    * `Innovation Shares NextGen Protocol ETF`


    # 投资建议


    尽管潜力巨大，区块链技术仍处于根源阶段，在商品方面尚未确立地位。根据 Hadyn Jones 的说法，“区块链是一项新兴技术，就像量子计算、电力航空或空间计算一样，所有这些都需要承担风险来进行创新。因此，在投资区块链技术时，有几点需要考虑。


    进行尽职调查。如今，许多企业声称从事区块链业务，但某些公司对技术的投入比其他公司多。这使得研究特定公司及其基本面变得至关重要。根据 Jones 的说法，“第一步是根据开发潜力、竞争环境或使其与其他风险项目区分开来的元素等因素，为投资本身制定一个投资论据。”


    将区块链行业视为一个高风险、高增长的行业：与科技股类似，区块链股票是快速增长行业的一部分，会给投资者带来巨大风险。建议仅将可用现金的一小部分投资到区块链初创公司中，并在其他领域尽可能进行多元化投资，因为区块链更广泛的效用仍需证明。


    警惕新法律和规章：鉴于区块链行业在很大程度上仍处于起步阶段，研究个别公司并与机构保持联系同样至关重要。政府官员和机构颁布的法律可能会严重损害专注于区块链技术的业务。


