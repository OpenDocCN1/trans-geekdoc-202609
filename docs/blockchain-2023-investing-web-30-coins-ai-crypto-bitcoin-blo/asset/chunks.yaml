    # 信息是推动公司前行的引擎。建议尽可能及时、准确地传递信息。区块链是传递此类信息的最佳方式，因为它提供了实时、可共享且透明的数据，这些数据存储在不可篡改的账本上，并且只有获得访问权限的人才能访问。订单、支付、账户、生产以及上述许多内容都通过区块链网络进行跟踪。成员可以在一处查看有关交易的所有信息，通过增强信任来创造更多效率和机会。


    各行业的 IT 公司都在积极研究区块链技术的实施。尽管如此，适应性计划经常由于内在的技术复杂性、构建、管理和维护区块链的运营成本，以及领域专业知识的匮乏而进展缓慢。然而，`BaaS`
    目前被认为是解决这一问题的可能良方。


    通过为企业提供合格的区块链开发者、流程和治理专家以及必要的云基础设施，正确的 `Blockchain-as-a-service`（区块链即服务）提供商可以让他们更容易过渡到区块链技术，而无需担心启动和开销成本。


    可靠的 `BaaS` 供应商还会提供丰富的知识和经验，这些可用于升级系统安全性。因此，它大大降低了在内部创建时可能需要管理的风险。


    ## 区块链即服务的功能


    当第三方为你提供所有必要的“区块链技术和基础设施”时，这被称为 `BaaS`。你向提供商付费以建立和维护节点。对于用户及其业务而言，`BaaS` 提供商管理后端的动态。


    `BaaS` 运营商确保强制性的区块链相关资产和服务得到仔细的保存和管理。它还可以控制带宽、确定存储需求、分配资源并准确定安全威胁。`BaaS` 将用户从基础设施和性能问题的担忧中解放出来，让他们能够专注于自己的核心活动——区块链技术。


    以托管公司中的 `BaaS` 为例。只需几分钟即可创建一个数百万人每天看到的网页。你可以在办公室里舒适地使用计算机或服务器来管理你的网站，你可以自己处理工作，也可以聘请支持人员。此外，网站可以托管在对你不方便的地方。


    `Hyperledger Cello` 是一种区块链模块的实用系统和工具包，类似于 `BaaS` 平台，它是区块链技术的极佳说明。一种名为 `Hyperledger
    Cello` (`HLC`) 的分布式计算架构实现了对区块链系统更有效的管理和使用。


    ## 区块链云对比


    在本节中，我们将检查几家云提供商提供的相同云服务。我们将观察它们的相似之处、差异以及任何其他相关信息。在本文中，我们将深入探讨云提供商提供的区块链选项。


    ### 哪些应用程序使用了区块链？


    区块链技术现在已用于各种用途，包括供应链追溯、零售忠诚奖励计划、房地产交易和电子投票。


    ### Google Cloud 区块链服务


    Google Cloud Platform (`GCP`) 目前不提供任何区块链服务。你可以在几台虚拟机上下载并安装区块链平台，但你仍然需要管理一切。


    ### Microsoft Azure 区块链服务


    通过在 2021 年 9 月终止其 `Azure Blockchain Service` 供应，`Microsoft Azure` 离开了“区块链即服务”行业。`Azure
    Cloud` 上的 `Quorum Blockchain-as-a-service` 由第三方 `ConsenSys` 提供给该服务的客户。然而，这并不意味着
    `Microsoft Azure` 完全放弃了区块链。


    `Microsoft` 现在在几个处于预览状态的全新产品中包含了区块链技术。区块链技术被用于为 `Azure SQL Database` 的一项新账本功能，该功能改进了记录的完整性，并允许用户证明记录未被更改。


    出于相同的原因，`Microsoft` 还发布了 `Azure Confidential Ledger`。你的数据存储在你的 `Azure storage
    account` 中作为对象，而不是 SQL 数据库中（`Confidential Ledger` 除外）。


    ### AWS 区块链服务


    对于任何想要加入区块链之旅的人来说，完整的选项是 `Amazon Web Services` (`AWS`)。如果你寻找完全自动的区块链解决方案，`AWS`
    提供 `Managed Blockchain`。客户只需点击几个按钮即可在开放的 `Ethereum Blockchain` 网络上启动节点。


    用户只需点击即可快速设置或加入私有的 `Hyperledger Fabric` 网络。你不需要担心技术细节，因为这些公共节点和私有网络是完全托管的；你按小时付费。


    `Amazon Quantum Ledger Database`（也可通过 `AWS` 获取）专为保证完全不可篡改的数据更改跟踪的程序员设计。其缩写为 `QLDB`，它包含两个部分：(1)
    一个保存当前状态数据的部分和 (2) 一个只允许追加的日志，记录对该当前状态数据库进行的每一次更改。开发者和应用程序可以使用 `SQL` 或 `API` 与其通信，因为它本质上只是一个数据库。在后台，区块链账本部分由系统管理。


    如果你熟悉其他数据库，你会注意到这个账本听起来像事务日志或记录。原因在于它与此相似。区别在于该日志中的每个条目在密码学上与其前一个条目和后一个条目链接。这使得验证变得简单且不可篡改。


    一些知名品牌已签约使用 `AWS` 的区块链产品，包括 `The BMW Group`、`Nestle`、`Sony Music`，`Workday` 是使用
    `AWS` 区块链解决方案的一些知名公司。


    此外，`AWS` 声称托管了至少 25% 的 `Ethereum` 网络节点，并且其 `AWS Marketplace` 上提供了超过 70 个经过验证的区块链解决方案。但
    `AWS` 是“区块链即服务”的唯一提供商吗？完全不是。


    ### IBM Cloud


    `IBM Cloud` 是最早进入托管区块链市场的知名云提供商之一。因此，它拥有最先进的产品之一。`IBM` 为几家大公司（如 `Walmart` 和航运公司
    `Maersk`）托管区块链。此外，`IBM` 在 `Hyperledger Fabric`（一种著名的开源区块链技术）以及支持其品牌区块链产品的软件方面发挥了重要作用，并并将继续这样做。


    ### Oracle Cloud


    然后是 `Oracle Blockchain Platform`，它是一个 `Hyperledger Fabric` 的实现，增加了额外的功能以提高与 `Oracle
    Cloud` 的兼容性。他们为金融服务、时尚、医疗和运输行业托管区块链。区块链仅仅是他们客户武器中的另一种工具，`Oracle` 和 `IBM` 都利用与大型企业的伙伴关系来推销它们的区块链服务。


    ### 云中的其他区块链服务


    主流云提供商之外的众多云原生公司正努力通过行业特定的解决方案或其他独特的价值主张来利用区块链。请仔细考虑你可能会与谁联系，因为区块链的用例通常非常广泛。因此，本文描述了目前分散且多样化的区块链云格局。其他公司正保持坚定并增加对区块链的投资，而
    `Azure` 和 `SAP Cloud` 等公共云可能已经退缩。


