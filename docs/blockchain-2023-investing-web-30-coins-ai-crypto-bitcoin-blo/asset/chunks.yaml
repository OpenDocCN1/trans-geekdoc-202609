    Blockchains come in four different varieties:


    ### Private Blockchain networks

    A single authority controls a private Blockchain network that functions for private
    corporations and organizations on closed networks. Private Blockchains allow businesses
    to set network characteristics, accessibility and permission choices, and other
    crucial security features.


    ### Public Blockchain networks

    Instead of being kept in one place, data is spread throughout a peer-to-peer network
    using `DLT`. A consensus algorithm verifies the legitimacy of information; the
    two popular consensus techniques are `Proof of Stake` (`PoS`) and `Proof of Work`
    (`PoW`). Public Blockchains helped spread awareness of distributed ledger technology
    (`DLT`) and removed some difficulties and problems, including centralization and
    security weaknesses.


    ### Permissioned Blockchain networks

    Permissioned Blockchain networks, sometimes called hybrid Blockchains, are private
    Blockchains that grant approved users exclusive access. These Blockchains are
    frequently set up by businesses to achieve the best of both worlds. They enable
    better structure when determining who can participate in the network and what
    transactions.


    ### Consortium Blockchains

    Consortium Blockchains are also the best for working with various organizations.
    Similar to permissioned Blockchains, consortium Blockchains feature both public
    and private components. However, a single consortium Blockchain network will be
    managed by numerous companies. Though initially more difficult to set up, these
    Blockchains can provide superior security once operational.


    ## The Process of Transaction

    The manner that Blockchain technology confirms and authorizes transactions is
    one of its defining features. For example, the first party would attach the transaction
    details to the second party''s public key if they were to complete a transaction
    using their respective private and public keys. Then, this entire data is collated
    into a block.


    The block comprises a timestamp, a digital signature, and other vital information.
    It should be emphasized that the block does not contain information on both parties''
    transaction identities. The block is then sent around the entire network, and
    the transaction is completed when the right user uses his private key to match
    it with the block.


    An example of how Blockchain is put to use:


    ### Hash encryptions

    Blockchain technology hashes and encrypts data, mainly using the `SHA256` method
    to protect the data. The `SHA256` method conveys information about the sender''s
    address (public key), the recipient''s address, the transaction, and the private
    key. After being verified, the hashed data is sent around the globe and put into
    the Blockchain in encrypted form. The sender and receiver''s authentication is
    made more accessible by the `SHA256` algorithm''s virtually impenetrable hash
    encryption.


    ### Proof of work

    * Each block in a Blockchain has four major headers.

    * `Previous hash`: addresses identifies the block before this one.

    * `Transaction details`: information about each transaction that must take place.

    * `Nonce`: in cryptography, an arbitrary integer is used to distinguish the block''s
    hash address.

    * `Block hash address`: a hashing algorithm is used to send all the information
    mentioned above, including the transaction information and nonce. This produces
    an output that is the distinct "hash address," which is a 256-bit number with
    64 characters in length. As a result, it is referred to as the block hash.

    * Using computer procedures, many people attempt to discover the appropriate hash
    value to satisfy predetermined criteria. When the predetermined condition is met,
    the transaction is finished. To put it simply, Blockchain miners attempt to solve
    a proof of work problem, a mathematical puzzle, and the first person to solve
    it earns a prize.


    ### Mining

    Adding transactional information to the current digital/public ledger is known
    as "mining" in Blockchain technology. Despite being linked to Bitcoin, the phrase
    is also used to describe other Blockchain technologies. Mining involves creating
    a block transaction hash that is difficult to forge. This ensures the security
    of the entire Blockchain without needing a centralized system.


    ## Blockchain: Advantages and Disadvantages

    Blockchain technology has several benefits and drawbacks:


    ### Advantages

    * As a result of their high level of security, one of the key benefits of Blockchains
    is that they can secure and protect sensitive data from online transactions.

    * Blockchain technology also provides quick and convenient transactions for those
    who desire them.

    * In contrast to other transaction techniques, which can take several days to
    complete, it only takes a few minutes.

    * There is no third-party involvement from governmental or financial entities,
    which many users view as a positive.


    ### Disadvantages

    * Blockchain and cryptography both use public and private keys, and private keys
    are said to have occasionally caused problems.

    * One drawback of Blockchains is that users need help if they misplace their private
    keys.

    * Another is the scaling limitations resulting from the cap on transactions per
    node, and because of this, finishing numerous transactions can take hours.

    * The difficulty of adding or changing information once it has been recorded is
    another significant flaw with Blockchain.


    ## How is Blockchain used?

    Blockchains hold data on cryptocurrency-based financial transactions and other
    kinds, like product tracking. For instance, food products can be tracked from
    when they are shipped out until they are delivered to their destination. This
    information can be helpful since it makes it simple to identify the source of
    a contamination epidemic. This is just one of the numerous ways Blockchains may
    be used to hold data.


    ### Hyperledger, hosted by the Linux Foundation

    The Linux Foundation is the home of the international partnership known as `Hyperledger`,
    which brings together leaders in technology, supply chain, banking, and `IoT`
    (`Internet of Things`). By establishing an open, cross-industry standard for distributed
    ledgers, `Hyperledger Fabric` enables programmers to create Blockchain applications
    that cater to particular requirements.


    ### Decentralization

    Decentralization is the distribution or dispersion of functions, powers, people,
    or things far from a central place or authority. In business, it often refers
    to the transfer of power from top executives to middle managers and lower team
    members on the organizational chart. Devolution has many advantages, but the ones
    mentioned frequently include better communication, enhanced employee empowerment,
    and improved flexibility and responsiveness.


    ### Transparency

    Transparency is one of the most critical parts of decentralization. All employees
    have permission to access information and decision-making procedures in a decentralized
    organization. Because of this openness, workers are more inclined to trust one
    another and work together. Additionally, it enables workers to hold bosses responsible
    for their choices.


    ## Bitcoin vs. Blockchain

    The most well-known and profitable cryptocurrency to date, `Bitcoin`, was first
    presented in 2009 and has since grown in popularity. Due to its decentralized
    nature, which prevents a central authority or bank from managing its supply, `Bitcoin`
    is extremely popular. This also means that using it entails no transaction fees
    and anonymous transactions.


    Blockchain is a database of exchanges between two parties, with blocks of data,
    including details about each exchange being added to the chain in the order in
    which they occur. The Blockchain constantly expands as new blocks are added to
    it, and as more blocks are added after each record, it becomes harder to edit
    that record.


    ## Blockchain vs. Banks

