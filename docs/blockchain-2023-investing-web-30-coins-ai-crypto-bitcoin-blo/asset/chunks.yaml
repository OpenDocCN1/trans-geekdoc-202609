    ## 本章核心内容


    - 在技术方面，`Blockchain`（区块链）是一种近期引起广泛关注的数字账本。

    - 得益于区块链即服务（Blockchain-as-a-service）云端服务，客户可以在 Azure 云平台上创建、托管和使用他们的 `Blockchain`
    应用程序、智能合约和其他功能。

    - 想要执行私有交易的双方可以在私有消费领域中使用区块链技术。

    - 我们为读者整理了 34 个这项实用性且具有突破性的技术的真实世界区块链应用案例。

    - 企业正在利用区块链来提高物联网的安全性和智能水平。

    - 根据埃森哲和物流巨头 `DHL` 的联合研究，美国有超过 500,000 家货运公司在运营，这导致了数据孤岛和透明度问题。

    - 行业认为 `Blockchain` 可以在数据权、盗版和支付方面为该行业提供急需的形象改观。


    # FTX 崩盘后的区块链


    由于近期发生的多次市场灾难，投资者的信任有所下降。随着 2022 年的开始，加密货币进入了主流。领先的机构投资者在前一年对加密货币进行了大量押注，为市场带来了信誉。


    但由于一系列行业失败（包括 11 月总部位于巴哈马的 `FTX Trading Ltd.` 倒闭），`Bitcoin` 和 `ether` 的价值已从历史高点下跌了约
    75%。财务顾问和加密货币专家对该行业的未来持有分歧。


    许多加密货币的怀疑者将 `FTX` 的覆灭解读为他们最深层恐惧的证实。根据安大略省彼得罗伯多市 `CIBC Wood Gundy` 财务顾问 Andrew
    Pyle 的说法，“[加密货币]具有高度的投机性和波动性，在我们看到该领域出现成熟迹象之前，你应该避开它。”


    据从未提供过投资加密货币建议的 Pyle 称，尽管驱动加密货币的区块链技术可能在未来带来投资机会，但该行业在如今“绝大多数”客户的投资组合中尚没有立足之地。


    `Horizons ETFs Management (Canada) Inc.` 的 ETF 策略执行副总裁 Mark Noble 表示，受 `FTX` 崩盘的影响，“在获得公众对加密货币更广泛的信任之前，还需要几年时间”。


    尽管如此，Noble 认为即使在一段被称为“加密寒冬”的投资者低迷期，区块链的进步也将继续。通过 `Horizons ETFs` 可以获得长多和短多 `bitcoin`
    基金。


    与位于安大略省伯灵顿市的 `Mandeville Private Client Inc.` 的蒙特利尔财务顾问 Michael Zagari 观点一致，坚信区块链技术变革潜力的机构投资者可能会对他们的投资进行“加倍投注”。Zagari
    预计会有“很多廉价的机会可供”，并预计在未来 12 到 18 个月内业务将继续保持不可预测性，尽管“仅仅因为一项投资 [FTX] 表现不佳并不意味着他们会就此为止”。


    对于具有至少十年时间跨度的风险承受能力强的客户，他建议将投资组合中不超过 10% 的投入 `bitcoin` 或与加密货币相关的投资，作为其权益敞口的一部分。由于
    `FTX` 破产，其他加密货币交易所不得不停止提现，另一些则在苦苦支撑。


    此外，`Ninepoint Partners LP` 数字资产组董事总经理 Alex Tapscott 在 11 月 24 日的一场网络研讨会上表示，“更多的靴子将要落下了。我们只是不知道有多少只或有多大。”


    Tapscott 称，安大略省教师养老金计划（`Ontario Teachers'' Pension Plan Board`）和魁北克存款投资集团（`Caisse
    de dépôt et placement du Québec`）通过投资单一加密货币公司而非持有成熟加密货币，使其暴露在“巨大的集中风险”之中。Tapscott
    描述自己对加密货币“短期看空，长期看好”。


    根据多伦多 `Ether Capital Corp.` 执行官 Brian Mosoff 的观点，即使某些交易所无法生存，`Bitcoin` 和 `ether`
    也将生存。技术没有改变，`bitcoin` 和 `ether` 的原则和价值主张“仍然完全履行着它们设定的要做的事”。


    大众对此表示赞同。根据 `National Bank Financial Markets` 的数据，在 1 月 1 日至 11 月 30 日之间，加密货币
    ETF 托管资产的损失中，只有 6600 万美元是由提现引起的 (`NBFM`)。


    正如 `NBFM` ETF 研究和金融产品研究监 Daniel Straus 在给 `Investment Executive` 的邮件中提到的，“看来加拿大的加密
    ETF 用户正维持他们的配置。”加拿大加密货币 ETF 的疲软流出表明，其投资者可能将它们视为类似于“登月计划”的长期赌注，尽管 `bitcoin` 和 `ether`
    均极具危险性和投机性。


    在 `FTX` 失败后，波士顿 `Broadridge Financial Solutions Inc.` 财富咨询高级总监 Mike Tropeano 预测，国际监管机构对加密货币业务将“严厉得多”。最知名的名字将在未来几年内逃往避风港，市场将“优胜劣汰”。


    Tropeano 表示，“信息每天都在涌入，不仅关于 `FTX`，还关于整个市场。任何想要参与的人——特别是财务顾问——都需要密切关注。”


    在 Mosoff 看来，“一些顾问可能会放松，因为他们知道直到下一个周期开始。”然而，他预测周期将会发生，并建议顾问利用加密寒冬进行学习。


    ## 加密货币领域的巅峰与低谷


    **2021 年**


    - 2 月 18 日：多伦多 `Purpose Investments Inc.` 发布了第一个比特币 ETF。

    - 10 月：安大略省教师养老金计划（OTPP）通过其教师风险增长平台向 `FTX Trading Ltd.` 投资了 7500 万美元。


    '
- fmt: '

    ### **October 12:** `Celsius Network LLC`, a cryptocurrency lender, based in New
    Jersey, receives a US$150 million investment from `Caisse de dépôt et placement
    du Québec`.


    ### **November 10:** The all-time intraday high for bitcoin is US$68,789.63.


    ### **November 16:** At $4,891.70, ether reaches its all-time intraday high.


    ## 2022


    ### **January:** The `OTPP` continues its $20 million US investment in `FTX`.


    ### **January 10:** `Fidelity Investments Canada ULC` announced that its asset-allocation
    ETFs will now include 1% to 3% exposure to bitcoin. (At the time of this publication,
    the target allocations are unchanged.)


    ### **February 14:** New Jersey-based `BlockFi Lending LLC` agrees to pay $100
    million in fines to the `US Securities and Exchange Commission` and pursue registration
    of its cryptocurrency lending service.


    ### **March 31:** According to information from `National Bank Financial`, Canadian
    cryptocurrency ETFs have $6.1 billion in assets under management.


    ### **May:** The linked token `Luna` and the stablecoin `TerraUSD` both crash.
    Bitcoin fell below US$25,000 on June 18. Early in May, it was trading at much
    more than $50,000.


    ### **July 6:** A crypto broker with headquarters in New York, `Voyager Digital
    Ltd.`, files for `Chapter 11` bankruptcy.


    ### **July 13:** `Celsius Network` declares bankruptcy under `Chapter 11`.


    ### **August 17:** Announcing the write-down of its entire investment in `Celsius
    Network`, `Caisse de dépôt et placement du Québec`.


    ### **November 11:** `FTX` declares bankruptcy under `Chapter 11`.


    ### **November 17:** `OTPP` declares that it will write off all of its `FTX` stakes.


    ### **November 21:** Senators `Elizabeth Warren`, `Dick Durbin`, and `Tina Smith`
    write to `FMR LLC` (`Fidelity Investments`) requesting that the company rethink
    its decision to permit access to bitcoin in `401(k)` plans.


    ### **November 27:** A US cryptocurrency exchange called `Bitfront` has announced
    that it will shut down in March 2023. The decision "is unrelated to recent difficulties
    related to certain deals that have been accused of misbehavior," according to
    the platform.


    ### **November 28:** `BlockFi` declares bankruptcy under `Chapter 11`, alleging
    exposure to `FTX`.


    ## What Will Happen to Cryptocurrency After FTX Collapses?


    Does the cryptocurrency market still have a bright future, or is the cryptocurrency
    bubble about to burst? A recent uptick in bankruptcy filings within the cryptocurrency
    industry has sparked worries about the long-term sustainability of digital assets
    and the industry.


    First, think about the extent of the carnage: there has been a remarkable rise
    in the number of cryptocurrency market bankruptcy attributed to liquidity issues.
    Since their businesses could not continue, `Three Arrows Capital`, `Alameda Research`,
    `Voyager Digital`, `FTX`, `Genesis`, `BlockFi`, and `Celsius Network` have either
    halted customer withdrawals or filed for bankruptcy.


    The collapse of `FTX`, previously one of the biggest cryptocurrency exchanges
    in the world, was caused by a lack of assets on its balance sheet. Customers withdrew
    $650 million in assets on November 7 in response to rumors that the exchange may
    need to be properly liquidized. As a result, it was discovered that `FTX` was
    using customer funds to finance dangerous bets made by the affiliated trading
    company `Alameda Research`. The day before it failed, the exchange had only $900
    million in liquid assets to offset its $9 billion in liabilities. The collapse
    of `FTX`, a market leader in the cryptocurrency space, was a big shock and diminished
    trust in digital assets.


    Bitcoin owners have suffered significant losses: When you sum up the fall in the
    value of `bitcoin`, `ether`, and all the other digital currencies since they were
    at or around their peaks last year, you end up with a loss of more than $2 trillion
    in market cap.


    Most of the current issues are on crypto lenders, an area of the cryptocurrency
    business that has experienced rapid growth in recent years. Crypto users who deposit
    their digital assets at a crypto lender or digital exchange also make money, just
    like customers of conventional banks do with interest rates on their savings.
    Due to historically low-interest rates, savings accounts at banks only provided
    minimal returns over the past couple of years. However, certain cryptocurrency
    lenders and exchanges provided substantially greater yields, frequently in the
    double digits and occasionally as high as 20%.


    The truth about the unsustainable yields provided by some cryptocurrency exchanges
    and lenders has come to light. These cryptocurrency companies, like banks, make
    money from deposits by lending.


    The fees that borrowers pay for the loan are a percentage, and cryptocurrency
    lenders earn from the difference between the interest payments made to depositors
    and the fees paid by borrowers. However, unlike conventional regulated lenders,
    crypto firms aren''t under the control of banking regulators; as a result, few
    regulations are governing the capital they must retain or the things they may
    do with their clients'' digital assets.


    The current failure of these cryptocurrency lenders has also highlighted how intertwined
    many of these businesses are. `FTX` gave affiliated trading company `Alameda Research`
    billions of dollars, which were then used to finance dangerous trades. `Alameda
    Research` and `Three Arrows Capital` were on the list of debtors for the cryptocurrency
    lender `BlockFi`.


    More cryptocurrency business failures appear likely. Additionally, other exchanges
    besides `FTX` were involved in shady trading, utilizing depositors'' money when
    customers became concerned about the security of their digital currency deposits
    and wanted their money back.


    ## Who is most at risk to the effects of crypto?


    Thankfully, banks are secure. They each hold roughly $9 billion in cryptocurrencies.
    Banks paid attention to regulators'' warnings to be cautious while investing in
    the asset class. Unexpectedly many retail investors possess cryptocurrency and
    experience some losses. Although broad, that exposure is very brief. In the US
    and Europe, 10% of homes have cryptocurrency. The typical holding in the US is
    $1,000, and most European investors hold under $5,000.


    Venture capital firms, which have staked much money on the cryptocurrency market,
    are the true bag holders. Only a few hundred of the 10000 or so companies connected
    to the cryptocurrency industry are publicly traded. Venture capitalists, who funded
    the majority of the remainder, are now facing significant (and, in some cases,
    almost entirely) losses.


    **So, is the once-booming industry''s end near?**


    Not exactly. Some more popular currencies, such as `bitcoin` and `ether`, appear
    resilient. For instance, `Bitcoin` is still four times higher than it was in December
    2018 despite a 75% decline from its top in November 2021. The second-placed token,
    `ether`, has increased by more than 1,000%. But there is unquestionably a significant
    shrinking happening. Not all tokens will survive. Since their customers prefer
    to keep their cryptocurrency in `digital wallets`, which often don''t allow holders
    to earn a return on their cryptocurrency but ensure their assets stay safe, many
    exchanges and crypto lenders won''t.


    The exchanges that endure will have to put in a lot of effort to demonstrate to
    users that their money is safe and liquid rather than being the next `FTX` waiting
    to crash.


    Washington will likely impose more regulations in the future to put an end to
    the cryptocurrency industry''s ad hoc character. This shake-up is necessary for
    the industry''s survival to eliminate the currencies and businesses that are nothing
    more than hype and to focus on the few promising players. It will be much tougher
    to demonstrate their usefulness and practical value now; gone are the days of
    easy riches.


    ## Learn From FTX And Stop Making Speculative Investments

    '
