  - '[PAGE 5]


    ![](img/01c86b2ad179591527c53d35745207c8_5_0.png)


    Above, we see our Lua Folder. This Lua Folder contains the Lua .exe files. Currently,
    they are named with a version number, such as, Lua54.exe


    But, since we don''t want to have to write the version number everytime that we
    cmd, we can change the name of these files to say lua without the version number
    of 54.


    Thus, as shown on the next page, let us change the names of these files to say
    only lua lua54.exe will be renamed to lua.exe'
  - '[PAGE 6]


    We change the names of the Lua .exe files, to make it easier for us to use cmd
    later


    ![](img/01c86b2ad179591527c53d35745207c8_6_0.png)


    As we can see above, the Lua .exe files are now named without a version number.


    We have changed the name of the exe files to make it easier for us to later cmd
    our folder and thus to activate our scripts we now only have to write in command
    prompt:


    ```

    lua nameOfScript.lua

    ```


    instead of


    ```

    lua54 nameOfScript.lua

    ```'
