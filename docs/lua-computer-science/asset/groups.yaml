  - "[PAGE 26]\n\n# -- print_variable_string.lua\n\n```\nnumberOfPeople = \"Twenty\"\
    \nprint(numberOfPeople)\nio.write(\"Press Enter to Exit\")\nio.read()\n```\n\n\
    ```\n----\n--[[ \nTwenty \nPress Enter to Exit \n--]]\n```"
  - '[PAGE 27]


    # -- open_browser.lua


    ```

    local url = "https://www.x.com"


    io.popen(''start "" "" .. url .. ""'')


    print(url .. " is opened")


    io.write("Press Enter to Exit")

    io.read()

    ```


    ----


    ```

    --[[

    https://www.google.com is opened

    Press Enter to Exit

    ]]--

    ```'
  - '[PAGE 28]


    ```

    -- open_a_file_in_write_mode.lua


    local file = io.open("001.txt",

    "w")


    -- write content to the file

    file:write("Hi Everyone\n")

    file:write("Here is more text")


    -- close file to save changes

    file:close()


    io.write("Press Enter to Exit")

    io.read()

    ```'
  - "[PAGE 29]\n\n```\n```lua\n-- read_text_file.lua\nlocal file = io.open(\"001.txt\"\
    , \"r\")\n-- check if file was opened\nif file then\n    -- read each line of\
    \ file\n    for line in file:lines() do\n        print(line)\n    end\n    --\
    \ close file after reading\n    file:close()\nelse\n    print(\"File did not open\"\
    )\nend\nio.write(\"Press Enter to Exit\")\nio.read()\n```\n```"
