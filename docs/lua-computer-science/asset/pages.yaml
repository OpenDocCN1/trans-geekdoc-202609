- pgno: 28
  md: '```

    -- open_a_file_in_write_mode.lua


    local file = io.open("001.txt",

    "w")


    -- write content to the file

    file:write("Hi Everyone\n")

    file:write("Here is more text")


    -- close file to save changes

    file:close()


    io.write("Press Enter to Exit")

    io.read()

    ```'
