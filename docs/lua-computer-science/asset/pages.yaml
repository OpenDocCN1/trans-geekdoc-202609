- pgno: 2
  md: '# Download Lua


    ![](img/01c86b2ad179591527c53d35745207c8_2_0.png)


    We Download Lua from:

    https://luabinaries.sourceforge.net/download.html


    On Windows: Download the file named:

    lua-5.4.2_Win64_bin.zip

    Windows x64 Executables


    On Mac: Download the File named:

    lua-5.4.2_MacOS1011_bin.tar.gz

    MacOS X Intel Executables


    On Linux: Download the File named:

    lua-5.4.2_Linux54_64_bin.tar.gz

    Linux x64 Executables'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# Extract the LUA zip file


    ![](img/01c86b2ad179591527c53d35745207c8_3_0.png)


    Right Click on the Downloaded Zip Folder

    Choose Extract All...


    ![](img/01c86b2ad179591527c53d35745207c8_3_1.png)'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# Extract Compressed (Zipped) Folders


    # Select a Destination and Extract Files


    Files will be extracted to this folder:


    C:\Users\energy\Downloads\lua\lua-5.4.2_Win64_bin


    # Left Click Extract Button


    This PC > Downloads > lua


    ![](img/01c86b2ad179591527c53d35745207c8_4_0.png)


    ![](img/01c86b2ad179591527c53d35745207c8_4_1.png)


    Here is our Lua Folder. Now that it is extracted we can use the .exe files in
    the Lua Folder.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '![](img/01c86b2ad179591527c53d35745207c8_5_0.png)


    Above, we see our Lua Folder. This Lua Folder contains the Lua .exe files. Currently,
    they are named with a version number, such as, Lua54.exe


    But, since we don''t want to have to write the version number everytime that we
    cmd, we can change the name of these files to say lua without the version number
    of 54.


    Thus, as shown on the next page, let us change the names of these files to say
    only lua lua54.exe will be renamed to lua.exe'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'We change the names of the Lua .exe files, to make it easier for us to use
    cmd later


    ![](img/01c86b2ad179591527c53d35745207c8_6_0.png)


    As we can see above, the Lua .exe files are now named without a version number.


    We have changed the name of the exe files to make it easier for us to later cmd
    our folder and thus to activate our scripts we now only have to write in command
    prompt:


    ```

    lua nameOfScript.lua

    ```


    instead of


    ```

    lua54 nameOfScript.lua

    ```'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# We Copy the Path of our Lua Folder to later use it for our Lua Environment
    Variable


    ![](img/01c86b2ad179591527c53d35745207c8_7_0.png)


    We have copied the Path of our Lua folder. It looks like this:


    ```

    C:\Users\energy\Downloads\lua\lua-5.4.2_Win64_bin

    ```


    We will later use this path, to add a Lua Environment Variable on Windows, so
    that we can cmd our scripts and have them open in Command Prompt.'
  merge: -1
  img_proc: true
