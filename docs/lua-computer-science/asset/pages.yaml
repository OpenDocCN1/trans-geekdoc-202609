  md: "```\n-- isNumberEvenOrOdd.lua\n```\n\n```\n-- checks if a number is even or\
    \ odd\nfunction checkEvenOdd(number)\n    if number % 2 == 0 then\n        print(number\
    \ .. \" is even.\")\n    else\n        print(number .. \" is odd.\")\n    end\n\
    end\n```\n\n```\n-- ask user to input a number\nprint(\"Enter a number to check\
    \ if it's\neven or odd:\")\n```\n\n```\n-- read user input (string) and\nconvert\
