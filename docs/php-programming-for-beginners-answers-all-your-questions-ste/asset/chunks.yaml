    i)In-built functions are the system defined functions


    ii)Example:


    ## 5 Explain the String Manipulation functions:


    i) `strtoupper()` : convert your strings to all UPPERCASE

    ```php

    $name = "Matthew ";

    echo strtolower($name); // matthew

    ```


    ii) `strtolower()` : convert your strings to all lowercase

    ```php

    $name = "Matthew ";

    echo strtolower($name); // matthew

    ```


    iii) `strlen()`:It works by passing a string or variable and then returns the
    total number of characters including spaces.

    ```php

    $name = "Matthew ";

    echo strlen($name); // 8

    ```


    iv) `strchr()` : This function is used to find the first occurrence of the string
    and return all the characters from the search position to the end of the string.

    ```php

    $x=”CBSE Multimedia and Web Technology";

    $y = strchr($x, ‘M’)

    echo $y // the output will be  : Multimedia and Web Technology

    ```


    v) `strpos()`:This function is used to find the position of first occurrence of
    the string and return value is a number.

    Syntax: `strpos(string, find, start)`

    `start` is optional

    ```php

    $x=”CBSE Multimedia and Web Technology";

    $y = strpos($x, ‘M’,0)

    echo $y // the output will be  : 5

    ```


    vi) `ord()` : This function is used to find the ASCII value of first character
    of a string.

    ```php

    $x=”CBSE Multimedia and Web Technology";

    $y = ord($x)

    echo $y // the output will be  : 67

    ```


    vii) `chr()` : This function is used to convert a specified ASCII value to its
    corresponding character and return it.

    ```php

    $x= chr(67)

    Echo $x // the output will be  : C

    ```


    viii) `trim()`, `ltrim()`, `rtrim()` :`trim()` is used to trim the white space
    from both the sides, `ltrim` and `rtrim` from left and right side respectively.


    ix) `substr()` : This function returns a string or part of string containing a
    specified number of characters from an original string.

    Syntax: `substr(string, start, length)`

    `Length` is optional

    ```php

    $x=” Multimedia and Web Technology - 2016”;

    echo substr($x, 0,10) // returns : Multimedia

    echo substr($x, 19,10) // returns : Technology

    echo substr($x, -4) // returns : 2016

    echo substr($x, -4,-2) // returns : 20

    echo substr($x, 0, -6) // returns : Multimedia and Web Technology

    ```


    x) `strrev()` : It returns a string in which the character order of the string
    is reversed

    ```php

    $x=” Multimedia”

    echo strrev($x) // returns: aidluM

    ```


    xi) `strcasecmp()`: This is used to compare two strings and return an integer.
    It is case-Insensitive. The function returns the following values:

    0 if the two strings are equivalent

    <0 if smaller byte is found in String1

    >0 if smaller byte is found in String2


    xii) `strcmp()` : similar to `strcasecmp()` but Case-Sensitive.


    xiii) `stripslashes()` : will remove any backslashes from the string.


    xiv) `str_word_count()`: This function is used to count the number of words in
    a string.

    Syntax: `str_word_count(string,return,char)`

    | Parameter | Description |

    | :--- | :--- |

    | string | Required. Specifies the string to check |

    | return | Optional. Specifies the return value of the `str_word_count()` function.
    |

    | char | Optional. Specifies special characters to be considered as words. |

    Note: The example provided was incomplete.


    ## 6 Explain the Numeric functions:


    i) `abs()`: This function returns the absolute value of a number. ie removes the
    negative sign.

    ```php

    echo abs(-48.6); // return: 48.6

    ```


    ii) `atan()`: This function return the arctangent of a specified number.


    iii) `cos()`: This function return the cosine of a specified number.


    iv) `ceil()`: This function returns the ceiling value for x. The smallest integer
    not less than x.

    ```php

    echo ceil(48.6); // return: 49

    echo ceil(48.1); // return: 49

    echo ceil(-48.1); // return: -48

    ```


    v) `exp()`: This function returns the exponent of e, that is e raised to the power.

    ```php

    echo exp(1); // return: 2.71828128459

    ```


    vi) `floor()`: This function returns the floor value for x. The largest integer
    not greater than x. That is the next integer after x.

    ```php

    echo floor(48.6); // return: 48

    echo floor(48.1); // return: 48

    echo floor(-48.1); // return: -49

    ```


    vii) `log()`: This function returns the natural logarithm of a specified number.


    viii) `pow()`: This function returns the value x to y.

    ```php

    echo pow(5,2); // return: 25

    ```


    ix) `rand()`: The function returns a random number.

    Syntax : `rand(min,max)`

    `min` and `max` are optional. If you use `rand()` without parameters then any
    number between 0 to 32767 will be returned.

    ```php

    echo rand(); // return: 1254

    echo rand(5,15); // return: 13

    ```


    x) `sin()`: This function return the sine of a specified number.


    ) `round()`: This function is used to round up or down based on their values.
    Any decimal .5 or above is rounded up, any under .5 is rounded down. Even the
    number of decimal places required can be specified as an optional argument.

    Syntax: `round(number, optional_decimal)`

    ```php

    echo round(3.141) // return: 3

    echo round(3.67) // return: 4

    echo round(3.9078, 2) // return: 3.91

    ```

