  trans: "\n\nstring: \n\n```php\n$a = array( “Rahul”, “ravi”, “ajit”, “pratik” );\
    \ \n$b = $a[0]; // $myAuthor contains “Rahul” \n$c = $a[1]; // $anotherAuthor\
    \ contains “ravi” \n$a = array( “Rahul”, “ravi”, “ajit”, “pratik” ); \n$pos =\
    \ 2; \necho $a[$pos + 1]; // Displays “ajit”\n```\n\n## 使用 `print_r()` 输出整个数组\n\
    \n你不能像打印普通变量那样直接用 `print()` 或 `echo()` 来打印数组，因为这些函数一次只能处理一个值。\n\n不过，PHP 确实为你提供了一个名为\
    \ `print_r()` 的函数，你可以用它来输出数组的内容以便调试。\n\n使用 `print_r()` 非常简单简单——只需将你想要输出的数组传递给它即可：\n\
    \n```php\nprint_r( $a);\n```\n\n以下示例代码创建了一个索引数组和一个关联数组，然后显示这两个数组：\n\n```php\n\
    <?php\n $a = array( \"Rahul\", \"ravi\", \"ajit\", \"pratik\" ); \nprint_r ( $a\
    \ ); \n?>\n```\n\n## `foreach` 循环结构\n\n- 存在一种 `foreach` 结构（命令），它可以对数组中的每个值执行一组语句。\n\
    - 然而，它只对数组有效，如果你尝试对其他类型的变量使用它，它会给出一个巨大的错误。\n- 你的 `foreach` 命令语法如下所示：\n\n```php\n\
    foreach ($array_variable as $value_variable) \n{ \n    // .. 对 $value_variable\
    \ 中的值进行某些操作\n} \n\nforeach ($array_variable as $key_var => $value_var) \n{\n \
    \   // .. 对 $key_var 和/或 $value_var 进行某些操作\n}\n```\n\n- 示例：\n\n```html\n<html\n\
    <head>\n<title>For Each 结构</title>\n</head>\n<body>\n<?php\n $a[] = \"Rahul\"\
    ; \n $a[] = \"Ravi\"; \n $a[] = \"Pratik\"; \necho \"My Name -->\".'</br>'; \n\
    foreach ($a as $b) \n{ \n    // 只要 $a 中还有值，这些行就会执行 \n    echo $b.'</br>'; \n}\
    \ \n?>\n</body>\n</html>\n```\n\n## 数组数组的内置函数：`sort()` 和 `rsort()`\n\n### i. `sort()`\n\
    \n- 对数组排序。\n- 定义和用法：`sort()` 函数按值对数组进行排序。\n- 此函数为数组中的元素分配新键。现有的键将被删除。\n- 此函数在成功时返回\
    \ `TRUE`，失败时返回 `FALSE`。\n- 语法：`sort(array,sorttype)`\n  - `Array`: 必须。指定要排序的数组。\n\
    \  - `Sorttype`: 可选。指定如何对数组值排序。可能的值有：\n    - `SORT_REGULAR`: 默认。按原样处理值（不改变类型）。\n\
    \    - `SORT_NUMERIC`: 以数值方式处理值。\n    - `SORT_STRING`: 将值视为字符串处理。\n    - `SORT_LOCALE_STRING`:\
    \ 根据本地设置将值视为字符串处理。\n- 示例：\n\n```php\n<?php\n$animal = array(\"a\" => \"Dog\",\
    \ \"b\" => \"Cat\", \"c\" => \"Horse\");\nsort($animal);\nprint_r($animal);\n\
    ?>\n```\n- 输出：\nArray ( [0] => Cat [1] => Dog [2] => Horse )\n\n### ii. `rsort()`\n\
    \n- 按降序顺序返回数组。\n- 定义和用法：`rsort()` 函数按降序顺序返回数组。\n- `Array`: 必须。指定一个数组。\n- `Preserve`:\
    \ 可选。可能的值为：`true` 或 `false`。指定该函数是否应该保留数组的键。\n- 示例：\n\n```php\n<?php\n$a=array(\"\
    a\"=>\"Dog\",\"b\"=>\"Cat\",\"c\"=>\"Horse\");\nprint_r(rsort($a));\n?>\n```\n\
    - 输出： Array ( [c] => Horse [b] => Cat [a] => Dog )\n\n## 第 7 章：自定义函数和全局变量\n\n\
    ### 函数\n\n函数在代码需要多处使用时最有用，但即使在只使用一次的情况下也有帮助，因为可以使你的代码更具可读性。\n\n#### 语法\n函数定义具有以下形式：\n\
    \n```php\nfunction function-name ($argument-1, $argument-2)\n{\n    statement-1;\n\
    \    statement-2;\n    ...\n}\n```\n\n#### 示例-1\n```php\n<?php\nfunction add($a,\
    \ $b) \n{ \n    $c=$a+$b; \n    echo \"Total\".$c; \n} \n$x = 10; \n$y = 20; \n\
    add($x,$y); \n?>\n```\n\n#### 示例-2 (返回值)\n```php\n<?php\nfunction add($a, $b)\
    \ \n{ \n    return $a+$b; \n} \n$x = 10; \n$y = 20; \n$c=add($x,$y); \necho \"\
    Total\".$c; \n?>\n```\n\n#### 形参数与实际参数\n\n在前面的示例中，我们传递给函数的参数恰好是变量，但这不是要求的。实际参数（即函数调用中的参数）可以是任何求值为某个值的表达式。在我们的示例中，我们可以向函数调用传递数字而不是变量，如：`add(10,20)`。\n\
    \n还要注意，在示例中，我们有几种情况实际参数变量的名称与形参数相同（例如 `$a`），而且我们也有实际名称和形名称不同的情况（`$x` 不等于 `$a`）。正如我们将在下一节中看到的，这种名称的一致并不重要——函数形参数的名称完全独立于函数外部，包括函数调用本身。\n\
    \n示例：\n```php\n<?php\nfunction add($a,$b) \n{ \n    $c=$a+$b; \n    echo \"Addition\"\
    .$c.'</br>'; \n} \nfunction sub($d,$e) \n{ \n    $f=$d-$e; \n    echo \"Sub\"\
    .$f; \n} \nadd(10,20); \n$x=20; \n$y=10; \nsub($x,$y); \n?>\n```\n\n#### 参数传递：传值传递与引用传递\n\
    \nPHP 提供了两种方式传递参数：传值传递和引用传递。\n\n##### 值传递\nPHP 默认行为是值传递。这意味着当你向函数调用传递变量时，PHP 会创建变量值的副本。如果你只想通过函数的返回值使用函数，这种行为是很好的，但如果你想修改传递的变量，可能会导致困惑。\n\
    \n示例：\n```php\n<?php\nfunction display($b1,$b2) \n{ \n    $b1 = 30; \n    $b2\
    \ = 40; \n} \n$a1=10; \n$a2=20; \ndisplay($a1,$a2); \necho $a1; \necho $a2; \n\
    ?>\n```\n输出：\n10\n20\n\n##### 引用传递\nPHP 提供了不同的方式让函数实际修改参数：在函数定义和函数调用中。\n\n示例：\n\
    ```php\n<?php\nfunction display(&$b1,&$b2) \n{ \n    $b1 = 30; \n    $b2 = 40;\
    \ \n} \n$a1=10; \n$a2=20; \ndisplay($a1,$a2); \necho $a1; \necho $a2; \n?>\n```\n\
    输出：\n30\n40\n\n### 返回\n通过可选的 `return` 语句返回值。任何类型都可以被返回，包括数组和对象。这会导致函数结束执行并将控制权交回调用它的行。如果从函数内部调用，`return()`\
    \ 函数会立即结束当前函数的执行，并将参数作为函数调的值。\n\n示例：\n```php\n<?php\nfunction sum($a,$b) \n{ \n\
    \    $c=$a+$b; \n    return $c; \n} \n$x = 10; \n$y = 20; \n$z=sum($x,$y); \n\
    echo $z; \n?>\n```\n输出：30\n\n### 默认参数\n要定义带有默认参数的函数，将形参数名称转换为赋值表达式。如果实际调用的参数少于定义的形参数，PHP\
    \ 将匹配实际和形参数直到实际参数耗尽，然后将使用默认赋值填充剩余部分。\n\n示例：\n```php\n<?php\nfunction info($fname=\"\
    rahul\",$lname=\"patel\") \n{ \n    echo $fname; \necho $lname.'</br>'; \n} \n\
    info(); \ninfo(\"ravi\"); \ninfo(\"ravi\",\"dave\"); \n?>\n```\n输出：\nRahulpatel\n\
    Ravipatel\nRavidave\n\n## 变量的作用域和生命周期\n\n#### 局部变量\n正如你所见的，函数的局部变量不存在于函数外部。事实上，在函数内部声明的所有变量在函数退出时被删除，并在下次调用函数时重新创建。\n\
    \n"
- fmt: "\n- This is usually what you want to happen, because it allows you to write\
    \ nicely self-contained functions that work independently of each other.\n- However,\
    \ sometimes it’s useful to create a local variable that has a somewhat longer\
    \ lifespan.\n- Static variables let you do just this. These types of variables\
    \ are still local to a function, in the sense that they can be accessed only within\
    \ the function’s code.\n- However, unlike local variables, which disappear when\
    \ a function exits, static variables remember their values from one function call\
    \ to the next.\n- To declare a local variable as static, all you need to do is\
    \ write the word `static` before the variable name, and assign an initial value\
    \ to the variable:\n\n```\nstatic $var = 0;\n```\n\n- The first time the function\
    \ is called, the variable is set to its initial value (zero in this example).\n\
    - However, if the variable's value is changed within the function, the new value\
    \ is remembered the next time the function is called.\n- The value is remembered\
    \ only as long as the script runs, so the next time you run the script the variable\
    \ is reinitialized.\n\n### Example: (Local variable)\n\n```php\n<?php\nfunction\
    \ nextNumber()\n{\n  $counter = 0;\n  return ++$counter;\n}\n\necho \"I’ve counted\
    \ to:\".nextNumber().\" <br/> \";\necho \"I’ve counted to:\".nextNumber().\" <br/>\"\
    ;\necho \"I’ve counted to:\".nextNumber().\" <br/>\";\n?>\n```\n\nOutput:\n```\n\
    I’ve counted to: 1\nI’ve counted to: 1\nI’ve counted to: 1\n```\n\n- Each time\
    \ the `nextNumber()` function is called, its `$counter` local variable is re-created\
    \ and initialized to zero.\n- Then it’s incremented to 1 and its value is returned\
    \ to the calling code.\n- So the function always returns 1, no matter how many\
    \ times it’s called.\n\n### Example: (Static variable)\n\n```php\n<?php\nfunction\
    \ nextNumber()\n{\n  static $counter = 0;\n  return ++$counter;\n}\n\necho \"\
    I’ve counted to:\".nextNumber().\" <br/> \";\necho \"I’ve counted to:\".nextNumber().\"\
    \ <br/>\";\necho \"I’ve counted to:\".nextNumber().\" <br/>\";\n?>\n```\n\nOutput:\n\
    ```\nI’ve counted to: 1\nI’ve counted to: 2\nI’ve counted to: 3\n```\n\n- You\
    \ probably won’t use static variables that often, and you can often achieve the\
    \ same effect (albeit with greater risk) using global variables.\n\n## Global\
    \ variable\n\n- Although the concept of variable scope is extremely useful, occasionally\
    \ you do actually want to create a variable that can be accessed anywhere in your\
    \ script, whether inside or outside a function. Such a variable is called a global\
    \ variable.\n- PHP supports global variables, but if you’re used to other programming\
    \ languages you’ll find PHP handles global slightly differently.\n- In PHP, all\
    \ variables created outside a function are, in a sense, global in that they can\
    \ be accessed by any other code in the script that not inside a function.\n- To\
    \ use such a variable inside a function, write the word `global` followed by the\
    \ variable name inside the function’s code.\n\n### Example:\n\n```php\n<?php\n\
    $myGlobal = \"Hello\";\nfunction hello()\n{\n  global $myGlobal;\n  echo \"$myGlobal\"\
    ;\n}\nhello(); // Displays Hello\n```\n\n- You can see that the `hello()` function\
    \ accesses the `$myGlobal` variable by declaring it to be global using the `global`\
    \ statement.\n- The function can then use the variable to display the greeting.\
    \ In fact, you don’t need to have created a variable outside a function to use\
    \ it as a global.\n- Take a look at the following script:\n\n```php\n<?php\nfunction\
    \ setup()\n{\n  global $myGlobal;\n  $myGlobal = \"Hello there!\";\n}\n\nfunction\
    \ hello()\n{\n  global $myGlobal;\n  echo \"$myGlobal\";\n}\nsetup();\nhello();\
    \ // Displays Hello there!\n?>\n```\n\n- In this script, `setup()` function is\
    \ called first.\n- It declares the `$myGlobal` variable as global, and gives it\
    \ a value.\n- Then `hello()` function is called.\n- It too declares `$myGlobal`\
    \ to be global which means it can now access its value — previously set by `setup()`\
    \ — and display it.\n- By the way, you can also declare more than one global variable\
    \ at once on the same line using commas:\n\n```php\nfunction myFunction()\n{\n\
    \  global $oneGlobal, $anotherGlobal;\n}\n```\n\n- Finally, you can also access\
    \ global variables using the `$GLOBALS` array.\n- This array is a special type\
    \ of variable called superglobal, which means you can access it from anywhere\
    \ without using the `global` statement.\n- It contains a list of all global variables\
    \ with the variable names stored in its keys and the variable’s values stored\
    \ in its values. Here’s an example that uses `$GLOBALS`:\n\n```php\n<?php\n$myGlobal\
    \ = \"Hello\";\nfunction hello()\n{\n  echo $GLOBALS[\"myGlobal\"];\n}\nhello();\
    \ // Displays Hello\n?>\n```\n\n- The `hello()` function accesses the contents\
    \ of the `$myGlobal` variable via the `$GLOBALS` array. Notice that the function\
    \ doesn’t have to declare the `$myGlobal` variable as global in order to access\
    \ its value.\n\n## SUPERGLOBALS\n\n### 1. PHP Super Global Variables\nSeveral\
    \ predefined variables in PHP are \"superglobals\", which means that they are\
    \ always accessible, regardless of scope - and you can access them from any function,\
    \ class or file without having to do anything.\n\n### 2. List PHP superglobals\n\
    - `$GLOBALS`\n- `$_SERVER`\n- `$_REQUEST`\n- `$_POST`\n- `$_GET`\n- `$_FILES`\n\
    - `$_ENV`\n- `$_COOKIE`\n- `$_SESSION`\n\n`$GLOBALS` is a PHP super global variable\
    \ which is used to access global variables from anywhere in the PHP script (also\
    \ within functions or methods).\na. PHP stores all global variables in an array\
    \ called `$GLOBALS`. The index holds the name of the variable.\nb. The example\
    \ below shows how to use the super global `$GLOBALS`:\n\n```php\n<?php\n$x = 75;\n\
    $y = 25;\nfunction addition() {\n  $GLOBALS['z'] = $GLOBALS['x'] + $GLOBALS['y'];\n\
    }\naddition();\necho $z;\n?>\n```\nOutput:100\n\n$_SERVER is a PHP super global\
    \ variable which holds information about headers, paths, and script locations.\n\
    a. The example below shows how to use some of the elements in `$_SERVER`:\n\n\
    ```php\n<?php\necho $_SERVER['PHP_SELF'];\necho \"<br>\";\necho $_SERVER['SERVER_NAME'];\n\
    echo \"<br>\";\necho $_SERVER['HTTP_HOST'];\necho \"<br>\";\necho $_SERVER['HTTP_REFERER'];\n\
    echo \"<br>\";\necho $_SERVER['HTTP_USER_AGENT'];\necho \"<br>\";\necho $_SERVER['SCRIPT_NAME'];\n\
    ?>\n```\nOUTPUT:\n```\n/php/demo_global_server.php\nwww.w3schools.com\nwww.w3schools.com\n\
    http://www.w3schools.com/php/showphp.asp?filename=demo_global_server\nMozilla/5.0\
    \ (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/52.0.2743.116\
    \ Safari/537.36\n/php/demo_global_server.php\n```\n\nThe following table lists\
    \ the most important elements that can go inside `$_SERVER`:\n\n| Element/Code\
    \ | Description |\n| --- | --- |\n| `$_SERVER['PHP_SELF']` | Returns the filename\
    \ of the currently executing script |\n| `$_SERVER['GATEWAY_INTERFACE']` | Returns\
    \ the version of the Common Gateway Interface (CGI) the server is using |\n| `$_SERVER['SERVER_ADDR']`\
    \ | Returns the IP address of the host server |\n| `$_SERVER['SERVER_NAME']` |\
    \ Returns the name of the host server (such as www.w3schools.com) |\n| `$_SERVER['SERVER_SOFTWARE']`\
    \ | Returns the server identification string (such as Apache/2.2.24) |\n| `$_SERVER['SERVER_PROTOCOL']`\
    \ | Returns the name and revision of the information protocol (such as HTTP/1.1)\
    \ |\n| `$_SERVER['REQUEST_METHOD']` | Returns the request method used to access\
    \ the page (such as POST) |\n| `$_SERVER['REQUEST_TIME']` | Returns the timestamp\
    \ of the start of the request (such as 1377687496) |\n| `$_SERVER['QUERY_STRING']`\
    \ | Returns the query string if the page is accessed via a query string |\n| `$_SERVER['HTTP_ACCEPT']`\
    \ | Returns the Accept header from the current request |\n| `$_SERVER['HTTP_ACCEPT_CHARSET']`\
    \ | Returns the Accept_Charset header from the current request (such as utf-8,ISO-8859-1)\
    \ |\n| `$_SERVER['HTTP_HOST']` | Returns the Host header from the current request\
    \ |\n"
