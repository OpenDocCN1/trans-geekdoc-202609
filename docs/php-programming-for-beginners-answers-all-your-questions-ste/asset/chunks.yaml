    Double quotes can contain variables; this is called “interpolation”.


    ```php

    <?php

    $juice=''plum'';

    echo"I like $juicejuice";//Output:Ilikeplumjuice

    ```


    When using interpolation, it is often the case that the variable will be touching
    another character. This will result in some confusion as to what is the name of
    the variable, and what is a literal character.


    To fix this problem, wrap the variable within a pair of curly brackets.


    ```php

    <?php

    $juice=''plum'';

    echo"I drank some juice made of $juices";// $juice cannot be parsed

    ```


    # vs


    ```php

    $juice=''plum'';

    ```


    ## What are the difference between constants and variable?


    Differences between constants and variables are


    i)There is no need to write a dollar sign (`$`) before a constant, where as in
    Variable one has to write a dollar sign.


    ii)Constants cannot be defined by simple assignment, they may only be defined
    using the `define()` function.


    iii)Constants may be defined and accessed anywhere without regard to variable
    scoping rules.


    iv)Once the Constants have been set, may not be redefined or undefined.


    ## What is meant by operator precedence?


    i)Operator precedence determines the grouping of term in an expression. Certain
    operators will be performed before others.


    ii)Example:


    ```php

    $x=7+3\*2;

    ```


    Here `$x` is assigned 13, not 20 because operator `*` has higher precedence than
    `+`, so it first gets multiplied with `3*2` and then adds into `7`.


    ### List the Operator Precedence


    | Order | Operator | Operation |

    | :--- | :--- | :--- |

    | 1 | | Logical NOT |

    | 2 | `++` | Increment |

    | 3 | `--` | Decrement |

    | 5 | `*` | Multiplication |

    | 6 | `/` | Division |

    | 7 | `%` | Modulus |

    | 8 | `+` | Addition |

    | 9 | `-` | Subtraction |

    | 10 | | String concatenation |

    | 11 | `<`, `<=` | Less than, less than or equal |

    | 12 | `>`, `>=>` | Greater than, greater than or equal |

    | 13 | `=` | Value equality |

    | 14 | `!=`, `<>` | Inequality |

    | 15 | `===` | Type and value equality |

    | 16 | `!==` | Type and value inequality |

    | 17 | `&&` | Logical AND |

    | 18 | `||` | Logical OR |

    | 19 | `?:` | Conditional operator |

    | 20 | `=` | Assignment |

    | 21 | `+=`, `-=`, `*=`, `/=`, `.=`, `%=`, `&=`, `|=`, `^=`, `~=`, `<<=`, `>>=`
    | Assignment with operation |

    | 22 | `and` | Logical AND |

    | 23 | `xor` | Logical XOR |

    | 24 | `or` | Logical OR |

    | 25 | | | List separator |


