  trans: "\n\n- 客户端与服务器的交互被称为会话（session）。\n- 会话通过 `session_start()` 函数启动。\n- 用户关闭浏览器窗口或调用\
    \ `session_destroy()` 函数时，会话结束。\n- 每个会话都有一个唯一的 `SessionID`。\n- 可以创建会话变量来存储用户信息。\n\
    - 会话变量比 Cookie 更安全，因为会话变量存储在服务器端，而 Cookie 存储在客户端计算机上。\n\n### 示例\n\n```php\n<?php\n\
    // Start the session\nsession_start();\n?>\n```\n\n```php\n<?php\n// Set session\
    \ variables\n$_SESSION[\"favcolor\"] = \"green\";\n$_SESSION[\"favanimal\"] =\
    \ \"cat\";\necho \"Session variables are set.\";\n?>\n```\n\n```php\n<?php\nsession_start();\n\
    ?>\n```\n\n```php\n<?php\n// Echo session variables that were set on previous\
    \ page\necho \"Favorite color is \" . $_SESSION[\"favcolor\"] . \".<br>\";\necho\
    \ \"Favorite animal is \" . $_SESSION[\"favanimal\"] . \".\";\n?>\n```\n\n```php\n\
    <?php\nsession_start();\n?>\n```\n\n```php\n<?php\nprint_r($_SESSION);\n?>\n```\n\
    \n### 修改 PHP 会话变量\n\n```php\n<?php\nsession_start();\n?>\n```\n\n```php\n<?php\n\
    // to change a session variable, just overwrite it \n$_SESSION[\"favcolor\"] =\
    \ \"yellow\";\nprint_r($_SESSION);\n?>\n```\n\n### 销毁 PHP 会话\n\n要移除所有全局会话变量并销毁会话，使用\
    \ `session_unset()` 和 `session_destroy()`：\n\n```php\n<?php\nsession_start();\n\
    ?>\n```\n\n```php\n<?php\n// remove all session variables\nsession_unset(); \n\
    // destroy the session \nsession_destroy(); \n?>\n```\n\n# 第 9 章：PHP 中的文件操作与错误处理\n\
    \n本章将解释以下与文件相关的函数——\n- 打开文件\n- 读取文件\n- 写入文件\n- 关闭文件\n\n## I. 打开和关闭文件\n\n### 1.\
    \ fopen() 函数：\ni) PHP `fopen()` 函数用于打开文件。它需要两个参数，首先是文件名，然后是操作模式。\nii) 如果尝试打开文件失败，`fopen`\
    \ 返回 `false` 值，否则返回一个文件指针，用于对该文件进行后续读取或写入。\niii) 文件模式可以指定为表中的六个选项之一。\n\n| 模式 |\
    \ 目的 |\n| --- | --- |\n| r | 以只读模式打开文件。将文件指针放在文件开头。 |\n| r+ | 以读写模式打开文件。将文件指针放在文件开头。\
    \ |\n| w | 以只写模式打开文件。将文件指针放在文件开头并将文件截断为零长度。如果文件不存在，则尝试创建文件。 |\n| w+ | 以读写模式打开文件。将文件指针放在文件开头并将文件截断为零长度。如果文件不存在，则尝试创建文件。\
    \ |\n| a | 以只写模式打开文件。将文件指针放在文件末尾。如果文件不存在，则尝试创建文件。 |\n| a+ | 以读写模式打开文件。将文件指针放在文件末尾。如果文件不存在，则尝试创建文件。\
    \ |\n\n如果文件不存在，则尝试创建文件。\n\n### 2. fclose() 函数：\na. 在对打开的文件进行更改后，使用 `fclose()`\
    \ 函数关闭它非常重要。`fclose()` 函数需要一个文件指针作为参数，关闭成功时返回 `true`，失败时返回 `false`。\n\n## II.\
    \ 读取文件\n\n### 1. fread() 函数：\na. 一旦使用 `fopen()` 打开文件，就可以用 `fread()` 读取。\nb. 该函数需要两个参数：文件指针和以字节为单位的文件长度。\n\
    \n### 2. fgets() 函数：\n`fgets()` 函数用于从文件中读取单行，调用该函数后文件指针将移动到下一行。\n\n### 3. fgetc()\
    \ 函数：\n`fgetc()` 函数从文件中读取单个字符，调用该函数后文件指针将移动到下一个字符。\n\n### 4. filesize() 函数：\n\
    可以使用 `filesize()` 函数查找长度，它接收文件名作为参数并返回以字节为单位的文件大小。\n\n### 5. feof() 函数：\n如果到达文件末尾则返回\
    \ `True`，否则返回 `False`。\n\nPHP 读取文件的步骤如下：\n- 使用 `fopen()` 函数打开文件。\n- 使用 `filesize()`\
    \ 函数获取文件长度。\n- 使用 `fread()` 函数读取内容。\n- 使用 `fclose()` 函数关闭文件。\n\n#### 示例 1：PHP\
    \ 读取文件\n\n```php\n<?php\n$fileName=\"myFile.txt\";\n$fp = fopen($fileName,\"r\"\
    );\nif($fp==false)\n{\n  echo (\"Error in file\");\nexit();\n}\n$fileSize=filesize($fileName);\n\
    $fileData=fread($fp, $fileSize);\n?>\n```\n\n#### 示例 2：逐行读取文件\n\n示例：\n```php\n\
    <?php\n$fileName=\"myFile.txt\";\n$fp = fopen($fileName,\"r\");\nif($fp==false)\n\
    {\n  echo (\"Error in file\");\nexit();\n}\nwhile(!feof($fp))\n{\necho fgets($fp).\
    \ \"<br>\";\n}\n?>\n```\n\n#### 示例 3：逐字符读取文件并显示次数\n\n示例：\n```php\n<?php\n$fileName=\"\
    myFile.txt\";\n$fp = fopen($fileName,\"r\");\nif($fp==false)\n{\n  echo (\"Error\
    \ in file\");\nexit();\n}\nwhile(!feof($fp))\n{\nif(fgetc($fp)==\" \")\n{\n$count++;\n\
    }\n}\necho “The total number of times is :).count;\n?>\n```\n\n## III. PHP 写入文件\n\
    \n### 1. fwrite() 函数：\na. 使用 `fwrite()` 函数可以写入新文件或向现有文件追加文本。\nb. 该函数需要两个参数：文件指针和要写入的字符串。\n\
    c. 可选的第三整数参数可以指定数据长度。如果使用了第三参数，文件将在达到指定长度后停止。\n\n#### 示例 1：PHP 写入文件\n\n```php\n\
    <?php\n$fileName=\"myFile.txt\";\n$fp = fopen($fileName,\"w\");\nif($fp==false)\n\
    {\n  echo (\"Error in file\");\nexit();\n}\nfwrite( $fp,\"This is sample text\
    \ to write\");\n?>\n```\n\n## IV. PHP 关闭文件\n\n### 1. fclose() 函数：\n在 PHP 中，使用后关闭所有文件并不是必须的，因为文件会自动关闭。你可以使用\
    \ `fclose()` 函数关闭文件。\n\n示例：\n```php\n<?php\n$fileName=\"myFile.txt\";\n$fp = fopen($fileName,\"\
    w\");\nif($fp==false)\n{\n  echo (\"Error in file\");\nexit();\n}\n//some code\
    \ to be executed\nfclose( $fp);\n?>\n```\n\n### 2. file() 函数：\na. PHP `file()`\
    \ 函数用于将整个内容读取到数组中。\nb. 该函数也会以读模式打开文件，不需要单独打开和关闭文件。\nc. 每个数组元素包含文件中的一行。\n\n示例：使用\
    \ `file()` 读取整个文本文件并逐行显示的 PHP 程序。\n\n```php\n<?php\n$FArray=file('myFile.txt');\n\
    foreach($FArray as $line)\n{\necho $line.'<br>';\n}\n?>\n```\n\n# 第 10 章：PHP 错误处理\n\
    \n## 1. 错误类型\n- **语法错误 (Syntax Error)**：当我们违反编程规则时发生。例如：`$abc=”hello\"`（缺少分号）。\n\
    - **运行时 (Run time error)**：程序运行时发生的错误。例如：当数据库服务器关闭时尝试连接数据库。\n- **逻辑错误 (Logical\
    \ Error)**：由于编程中算法错误导致的错误。\n\n## 2. PHP 通过三种方法处理错误：\n- PHP `die()` 函数\n- 设置自定义处理程序和触发错误\n\
    - 错误报告\n\n## 3. 使用 PHP die() 函数：\n`die()` 函数显示消息并停止执行当前脚本。\n示例：打开文本文件时，如果文件没有打开，则显示错误消息并停止脚本。\n\
    \n```php\n<?php\n$file=fopen(\"welcome.txt\",\"r\");\nif(!file_exists(\"welcome.txt\"\
    )) \n{\n  die(\"File not found\");\n} \nelse \n{\n  $file=fopen(\"welcome.txt\"\
    ,\"r\");\necho “File is ready for reading”;\n}\n?>\n```\n\n## 4. 创建自定义错误处理器与 PHP\
    \ 错误报告：\na. 可以通过 `CustomError()` 函数覆盖默认 PHP 错误。\n\n"
- fmt: "\nb. The function has to handle minimum 2 parameters (error level and error\
    \ message)\n\nc. Example of custom error handlers:\n\n```php\n<?php\nfunction\
    \ handleError($errno, $errstr, $error_file, $error_line)\n{\n    echo \"<b>Error:</b>\
    \ [$errno] $errstr – $error_file:$error_line\";\n    echo \"<br />\";\n    echo\
    \ \"Terminating PHP Script\";\n    die();\n}\n// set error handler\nset_error_handler(\"\
    handleError\");\n// trigger error\nmyFunction();\n?>\n```\n\nd. `set_error_handler()`\
    \ function: The default error handler for PHP can be changed using this function.\n\
    \ne. `trigger_error()` function: PHP also provides `trigger_error()` function\
    \ that can be used to trigger an error.\n\nExample:\n\n```php\n<?php\n$test=2;\n\
    if ($test>=1) {\n  trigger_error(\"Value must be 1 or below\");\n}\n?>\n```\n"
