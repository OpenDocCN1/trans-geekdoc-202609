    ## 5 解释字符串处理函数：


    i) `strtoupper()`：将你的字符串转换为全大写

    ```php

    $name = "Matthew ";

    echo strtolower($name); // matthew

    ```


    ii) `strtolower()`：将你的字符串转换为全小写

    ```php

    $name = "Matthew ";

    echo strtolower($name); // matthew

    ```


    iii) `strlen()`：它通过传递字符串或变量来工作，然后返回包括空格在内的字符总数。

    ```php```


    iv) `strchr()`：此函数用于找到字符串第一次出现的位置，并返回从搜索位置到字符串末尾的所有字符。

    ```php

    $x=”CBSE Multimedia and Web Technology";

    $y = strchr($x, ‘M’)

    echo $y // 输出将为 : Multimedia and Web Technology

    ```


    v) `strpos()`：此函数用于找到字符串第一次出现的位置，返回值为一个数字。

    语法：`strpos(string, find, start)`

    `start` 是可选的

    ```php

    $x=”CBSE Multimedia and Web Technology";

    $y = strpos($x, ‘M’,0)

    echo $y // 输出将为 : 5

    ```


    vi) `ord()`：此函数用于找到字符串第一个字符的 ASCII 值。

    ```php

    $x=”CBSE Multimedia and Web Technology";

    $y = ord($x)

    echo $y // 输出将为 : 67

    ```


    vii) `chr()`：此函数用于将指定的 ASCII 值转换为对应的字符并返回它。

    ```php

    $x= chr(67)

    ```


    viii) `trim()`，`ltrim()`，`rtrim()`：这些函数用于去除指定的字符。


    ix) `substr()`：此函数用于从指定位置开始截取字符串。

    语法：`substr(string, start, length)`

    `start` 是可选的

    ```php

    x = Multimedia and Web Technology

    ```


    x) `strrev()`：此函数用于反转字符串。

    ```php

    $x = Multimedia

    ```


    xi) `str_replace()`：此函数用于替换字符串中的某些字符。

    ```php

    $x = Multimedia

    ```


    xii) `str_count()`：此函数用于统计字符串中字符出现的次数。

    ```php

    $x = Multimedia

    ```


    xiii) `str_split()`：此函数用于将字符串分割为数组。

    ```php

    $x = Multimedia

    ```


    xiv) `preg_replace()`：此函数用于使用正则表达式替换字符串中的内容。

    ```php

    $x = Multimedia

    ```


    xv) `preg_match()`：此函数用于根据正则表达式匹配字符串内容。

    ```php

    $x = Multimedia

    ```


    ## 6 解释数值函数：


    i) `abs()`：此函数返回数字的绝对值。去掉负号。

    ```php

    echo abs(-48.6); // 返回 48

    ```


    ii) `atan()`：此函数返回指定数的反正切。


    iii) `cos()`：此函数返回指定数的余弦。


    iv) `ceil()`：此函数返回 x 的向上取整。不小于 x 的最小整数。

    ```php

    echo ceil(48.6); // 返回 49

    echo ceil(48.1); // 返回 49

    echo ceil(-48.1); // 返回 -48

    ```


    v) `exp()`：此函数返回 e 的幂，即 e 的几次方。

    ```php

    echo exp(1); // 返回 2.7182818284

    ```


    vi) `floor()`：此函数返回 x 的向下取整。不大于 x 的最大整数。即 x 之后的整数。

    ```php

    echo floor(48.6); // 返回 48

    echo floor(48.1); // 返回 48

    echo floor(-48.1); // 返回 -49

    ```


    vii) `log()`：此函数返回指定数的自然对数。


    viii) `pow()`：此函数返回 x 的 y 次。

    ```php

    echo pow(5,2); // 返回 25

    ```


    ix) `rand()`：该函数返回一个随机数。

    语法：`rand(min,max)`

    `min` 和 `max` 是可选的。如果你不带参数使用 `rand()`，将返回 0 到 32767 之间的任意数字。

    ```php

    echo rand(); // 返回 1254

    echo rand(5,15); // 返回 13

    ```


    x) `sin()`：此函数返回指定数的正弦。


    ) `round()`：此函数用于根据其值四舍五入。任何 .5 或以上的小数都会四舍五入，任何小于 .5 的都会向下舍入。甚至可以作为可选参数指定指定的保留后位数。

    语法：`round(number, optional_decimal)`

    ```php

    echo round(3.141) // 返回 3

    echo round(3.67) // 返回 4

    echo round(3.9078, 2) // 返回 3.91

    ```'
