    \ with arithmetic operators to create operator.\n\nSuch as `+=`, `-=`, `/=`, `*=`,\
    \ `%=`. Compound assignment operator allows to write shorter expression. e.g:\n\
    \n```php\n<?php\n    $i = 100;\n    $i = $i + 10;\n    echo $i;\n?>\n```\n\ncan\
    \ be written as\n\n```php\n<?php\n    $i = 100;\n    $i += 10;\n?>\n```\n\n##\
