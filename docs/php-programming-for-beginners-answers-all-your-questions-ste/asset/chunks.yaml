    双引号可以包含变量；这被称为“插值”。


    ```php

    <?php

    $juice=''plum'';

    echo"I like $juicejuice";//Output:Ilikeplumjuice

    ```


    在使用插值时，变量通常会紧挨另一个字符。这会导致对哪些是变量名、哪些是字面字符产生混淆。


    为了解决这个问题，请将变量包裹在花括号中。


    ```php

    <?php

    $juice=''plum'';

    echo"I drank some juice made of $juices";// $juice 无法解析

    ```


    # vs


    ```php

    $juice=''plum'';

    ```


    ## 常量和变量之间有什么区别？


    常量和变量的区别在于：


    i) 常量前面不需要写美元符号（`$ `），而变量则必须写美元符号。


    ii) 常量不能通过简单的赋值定义，只能使用 `define()` 函数定义。


    iii) 常量可以在任何地方定义和访问，而不受变量作用域规则的。


    iv) 常量一旦设置，就不能重新定义或取消定义。


    ## 运算符优先级是指什么？


    i) 运算符优先级决定了表达式中项的分组。某些运算符会在其他运算符之前执行。


    ii) 示例：


    ```php

    $x=7+3\*2;

    ```


    这里 `$x` 被赋值为 13 而不是 20，因为运算符 `*` 的优先级高于 `+`，所以它先乘以 `3*2`，然后加到 `7`。


    ### 列出运算符优先级


    | 顺序 | 运算符 | 操作 |

    | :--- | :--- | :--- |

    | 1 | | 逻辑非 |

    | 2 | `++` | 增 |

    | 3 | `--` | 递减 |

    | 5 | `*` | 乘法 |

    | 6 | `/` | 除法 |

    | 7 | `%` | 取模 |

    | 8 | `+` | 加法 |

    | 9 | `-` | 减法 |

    | 10 | | 字符串拼接 |

    | 11 | `<`, `<=` | 小于、小于等于 |

    | 12 | `>`, `=>` | 大于、大于等于 |

    | 13 | `=` | 值相等 |

    | 14 | `!=`, `<>` | 不相等 |

    | 15 | `===` | 类型和值相等 |

    | 16 | `!==` | 类型和值不相等 |

    | 17 | `&&` | 逻辑与 |

    | 18 | `||` | 逻辑或 |

    | 19 | `?:` | 三元运算符 |

    | 20 | `=` | 赋值 |

    | 21 | `+=`, `-=`, `*=`, `/=`, `.=`, `%=`, `&=`, `|=`, `^=`, `~=`, `<<=`, `>>=`
    | 带运算的赋值 |

    | 22 | `and` | 逻辑与 |

    | 23 | `xor` | 逻辑异或 |

    | 24 | `or` | 逻辑或 |

    | 25 | | 列表分隔符 |


    # 第 3 章：PHP 内置函数


    ## 1 什么是函数？


    i) 函数是一段代码，它以参数的形式接收一个或多个输入，进行某些处理并返回一个值。


    ii) 函数可以反复重复使用。


    ## 2 函数 get 什么类型？


    i) 内置/系统定义函数


    ii) 用户定义函数


    ## 3 函数有什么用处？


    i) 函数可以反复重复使用


    ii) 易调试


    ## 4 什么是内置函数？


    i) 内置函数是系统定义的函数


