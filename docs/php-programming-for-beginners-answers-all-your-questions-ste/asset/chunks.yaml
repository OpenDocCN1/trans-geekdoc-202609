  raw: "| $\\_SERVER\\['HTTP\\_REFERER'\\] || Returns the complete URL of the current\
    \ page (not reliable because not all user-agents support it) |\n\n| $\\_SERVER\\\
    ['HTTPS'\\] || Is the script queried through a secure HTTP protocol |\n\n| $\\\
    _SERVER\\['REMOTE\\_ADDR'\\] || Returns the IP address from where the user is\
    \ viewing the current page |\n\n| $\\_SERVER\\['REMOTE\\_HOST'\\] || Returns the\
    \ Host name from where the user is viewing the current page |\n\n| $\\_SERVER\\\
    ['REMOTE\\_PORT'\\] || Returns the port being used on the user's machine to communicate\
    \ with the web server |\n\n| $\\_SERVER\\['SCRIPT\\_FILENAME'\\] || Returns the\
    \ absolute pathname of the currently executing script |\n\n| $\\_SERVER\\['SERVER\\\
    _ADMIN'\\] || Returns the value given to the SERVER\\_ADMIN directive in the web\
    \ server configuration file (if your script runs on a virtual host, it will be\
    \ the value defined for that virtual host) (such as someone@w3schools.com) |\n\
    \n| $\\_SERVER\\['SERVER\\_PORT'\\] || Returns the port on the server machine\
    \ being used by the web server for communication (such as 80) |\n\n| $\\_SERVER\\\
    ['SERVER\\_SIGNATURE'\\] || Returns the server version and virtual host name which\
    \ are added to server-generated pages |\n\n| $\\_SERVER\\['PATH\\_TRANSLATED'\\\
    ] || Returns the file system based path to the current script |\n\n| $\\_SERVER\\\
    ['SCRIPT\\_NAME'\\] || Returns the path of the current script |\n\n| $\\_SERVER\\\
    ['SCRIPT\\_URI'\\] || Returns the URI of the current page |\n\nCHAPTER 8: PHP\
    \ FORMS HANDLING, FORM VALIDATIONS\n\n(USING $\\_GET, $\\_POST, $\\_REQUEST)\n\
    \n1.The ACTION attribute of the <FORM> :\n\nThe ACTION attributes calls the given\
    \ ASP file, when the SUBMIT button is clicked. If the ACTION attribute is not\
    \ given for a <FORM> then the ASP is requesting itself, it is a “Self-referencing”\
    \ page.\n\n2.The GET and POST method:\n\na.The GET method sends the variable names\
    \ and the value pairs of the Form by concatenating it along with the URL as a\
    \ Query String.\n\nb.The POST method sends the variable names and value pairs\
    \ of the Form as encoded along with the HTTP headers.\n\ni.Advantage of POST :\
    \ Security of information\n\nii.Disadvantage of POST: The resulting response page\
    \ cannot be bookmarked.\n\n3.PHP has two global variables $\\_GET and $\\_POST\
    \ which are used to retrieve user input information from HTML forms.\n\n4.Super\
    \ global variable $\\_REQUEST to collect the value of the input field instead\
    \ of $\\_GET or $\\_POST.\n\n5.Practical Examples: Separate HTML and PHP files.\n\
    \nQ. Write the HTML and PHP program to create the Welcome message:\n\n ![](Images/image00172.jpeg)\n\
    \nAns: HTML file save on desktop(wel.html)\n\n<html>  \n\n<body>\n\n<form action=\"\
    welcome.php\" method=\"post\">\n\nName: <input type=\"text\" name=\"name\"><br>\n\
    \nE-mail: <input type=\"text\" name=\"email\"><br>\n\n<input type=\"submit\">\n\
    \n</form>\n\n</body>\n\n</html>\n\nPHP file saved in htdocs (welcome.php)\n\n\
    <?php\n\necho \"Your name is: \" . $\\_POST\\[\"name\"\\], \"<br>\";\n\necho \"\
    You Email is \" . $\\_POST\\[\"email\"\\];\n\n?>\n\nOutput :\n\nWelcome John\n\
    \nYour email address is john.doe@example.com\n\nPractical Examples: Single  PHP\
    \ file with HTML form.\n\n Q. Write a single PHP file which contains the form\
    \ that accepts the Name and Age of the user displays it back when the submit button\
    \ is clicked. (Note: In the example $\\_GET is used.)\n\nAns:\n\n<html>\n\n<head>\n\
    \n<title>$\\_POST result in URL</title>\n\n</head>\n\n<body>\n\n<FONT SIZE=\"\
    6pt\" color=blue FACE=\"Comic Sans MS\">\n\n<H3>Handling HTML forms</H3>\n\n</FONT>\n\
    \n<HR>\n\n<form name=\"DisplayDetails\" method=\"GET\" \n\naction=\"<?php echo\
    \ $\\_SERVER\\[\"PHP\\_SELF\"\\]; ?>\">\n\nName: <input type=\"text\" name=\"\
    fname\" />\n\nAge: <input type=\"text\" name=\"age\" />\n\n<input type=\"submit\"\
    \ name=\"btnSubmit\" id=\"btnSubmit\" value=\"Submit\"/>\n\n</form>\n\n<?php\n\
    \necho \"Your name is: \" . $\\_GET\\[\"fname\"\\], \"<br>\";\n\necho \"You age\
    \ is \" . $\\_GET\\[\"age\"\\];\n\n?>\n\n</body>\n\n</html>\n\nPractical Examples:\
    \ Validating Forms\n\nQ. Write the PHP program which displays a form that accepts\
    \ User Name. Then it validates if the User Name is empty and display messages. \
    \ (Note: In the example $\\_REQUEST is used.)\n\nAns:\n\n<html>\n\n<body>\n\n\
    <form method=\"post\" action=\"<?php echo$\\_SERVER\\['PHP\\_SELF'\\];?>\">\n\n\
      Name: <input type=\"text\" name=\"fname\">\n\n  <input type=\"submit\">\n\n\
    </form>\n\n<?php\n\nif ($\\_SERVER\\[\"REQUEST\\_METHOD\"\\] == \"POST\") {\n\n\
        // collect value of input field\n\n    $name = $\\_REQUEST\\['fname'\\]; \n\
    \n    if (empty($name)) {\n\n        echo \"Name is empty\";\n\n    } else {\n\
    \n        echo $name;\n\n    }\n\n}?>\n\nPHP $\\_FILES,$\\_EVN, $\\_COOKIE, $\\\
    _SESSION\n\n1.$\\_FILES:  This this the superglobal array that help us to upload\
    \ files to the server.\n\nIt has various values that can provide information regarding\
    \ the file that is to be uploaded, they are as follows:\n\n| Superglobal || Description\
    \ |\n\n| --- | --- |\n\n| $\\_FILES\\['my-file'\\]\\['name'\\] || Original Name\
    \ of File Before It Was Uploaded |\n\n| $\\_FILES\\['my-file'\\]\\['type'\\] ||\
    \ The MIME Type of File, Provided By the Browser |\n\n| $\\_FILES\\['my-file'\\\
    ]\\['size'\\] || Size of the File (In Bytes) |\n\n| $\\_FILES\\['my-file'\\]\\\
    ['tmp\\_name'\\] || Location of Temporary File on Server |\n\n| $\\_FILES\\['my-file'\\\
    ]\\['error'\\] || Any Error Codes Resulting From the File Upload |\n\nProcedure\
    \ to upload a file to the server:\n\na)Create a HTML form to get the name of the\
    \ file that is required to be uploaded.\n\nWe’ll start with the basics: let’s\
    \ write an HTML form that allows users to upload files. HTML makes this quite\
    \ easy with its<input type=\"file\"/> tag. By default, however, only the name\
    \ of the file selected by the user is sent. To have the file itself submitted\
    \ with the form data, we need to add enctype=\"multipart/form-data\" to the <form>\
    \ tag:\n\nb)Next, create the PHP file that will check if the file was successfully\
    \ uploaded using is\\_uploaded\\_file() function.\n\nExample 1: Write the HTML\
    \ and PHP programs to upload a file onto the server.\n\n ![](Images/image00173.jpeg)\n\
    \na)HTML form named:myupload.html\n\n<form action=\"http://localhost/fup.php\"\
    \ method=\"post\" enctype=\"multipart/form-data\">\n\n<input type=\"file\" name=\"\
    my-file\" size=\"50\" maxlength=\"25\"><br>\n\n<input type=\"submit\" name=\"\
    upload\" value=\"Upload\">\n\n</form>\n\nb)PHP program named fup.php\n\n<?php\n\
    \n  if (is\\_uploaded\\_file($\\_FILES\\['my-file'\\]\\['tmp\\_name'\\]) && $\\\
    _FILES\\['my-file'\\]\\['error'\\]==0) {\n\n    echo \"The file was uploaded successfully\
    \ but has not been saved.<br>\";\n\necho \"The file is temporarily stored: \"\
    \ . $\\_FILES\\['my-file'\\]\\['tmp\\_name'\\] . \"<br>\";\n\necho \"The file\
    \ name was: \" . $\\_FILES\\['my-file'\\]\\['name'\\] . \"<br>\";\n\necho \"The\
    \ file type is: \" . $\\_FILES\\['my-file'\\]\\['type'\\] . \"<br>\";\n\necho\
    \ \"The file size is: \" . $\\_FILES\\['my-file'\\]\\['size'\\] . \"<br>\";\n\n\
      } else {\n\necho \"The file was not uploaded successfully.\";\n\necho \"(Error\
    \ Code:\" . $\\_FILES\\['my-file'\\]\\['error'\\] . \")\";\n\n  } ?>\n\nOutput:\n\
    \nThe file was uploaded successfully but has not been saved.\n\nThe file is temporarily\
    \ stored: C:\\\\xampp\\\\tmp\\\\php734D.tmp\n\nThe file name was: UPTEST.txt\n\
    \nThe file type is: text/plain\n\nThe file size is: 9\n\n2.$\\_COOKIE:A cookie\
    \ is a piece of date(file) that the browser saves on the client’s machine, that\
    \ is can access the next time the browers visits the website.\n\n(i)The common\
    \ uses of Cookies are:\n\na.To store username/password information so that the\
    \ user doesnot have to log in every time they visit the website.\n\nb.To remember\
    \ the user’s theme\n\n(ii)setcookies(): The setcookies() function is used to create\
    \ a cookie.\n\nThe syntax is: setcookie(name, value, expire, path, domain);\n\n\
    (iii)The superglobal$\\_cookieis used to access the cookies.\n\nExample 2: Write\
    \ a PHP program to create a cookie and another PHP program to display its value.\n\
    \nPHP File 1: mycookie.html\n\n<?php\n\nsetcookie(\"Example\", \"Whatever Value\
    \ I Want\", time()+2592000);\n\n?>\n\nPHP File 2: displaycookie.php\n\n<?php\n\
    \n  if (isset($\\_COOKIE\\[\"Example\"\\])) \n\n {\n\n    echo $\\_COOKIE\\[\"\
    Example\"\\];\n\n  } \n\nelse \n\n{\n\n    echo \"No Cookie Named 'Example' Is\
    \ Set\";\n\n  }\n\n?\n\nOutput : Whatever Value I Want\n\n3.$\\_SESSION\\[ \\\
    ]: This is the superglobal variable that is used to Session level variables.\n\
    \na.What is a Session?\n\nAns:"
