    define(\"PI\",3.14);\ndefine(\"MAXSIZE\",100);\necho \"Value of Pi is \" . PI\
    \ . \"<BR>\";\necho \"six is \" . MAXSIZE;\necho constant(\"PI\");\n```\n\n##\
    \ 16. What is a Literal?\n\nA literal is a sequence of characters used in a program\
    \ to represent a constant value.\n\n## 17. Explain the String Types:\n\ni) Single\
