  trans: "\n\n# PHP 编程\n\n初学者教程：\n逐步解答你的所有问题\nRYSHITH DOYLE\n\n版权所有 © 2019 Ryshith\
    \ Doyle\n保留所有权利\nISBN:\n\n## 目录\n- 第 1 章：PHP 编程简介\n- 第 2 章：PHP 运算符\n- 第 3 章：PHP\
    \ 内置函数\n- 第 4 章：PHP 条件分支\n- 第 5 章：PHP 循环\n- 第 6 章：PHP 数组\n- 第 7 章：PHP 中的自定义函数与全局变量\n\
    - 第 8 章：PHP 表单处理、表单验证（使用 `$_GET`, `$_POST`, `$_REQUEST`）\n- 第 9 章：文本文件操作\n- 第\
    \ 10 章：PHP 错误处理\n\n## 第 1 章：PHP 语言简介\n\n### 1. 什么是 PHP？\ni) `PHP` 代表“超文本预处理器”（Hypertext\
    \ Preprocessor）\nii) 它被用于创建“动态网页”\niii) 它是一门“**服务器端脚本**”语言，可以替代 `ASP`、`JSP`、`PERL`。\n\
    iv) 它是一项“开源软件”\n\n### 2. 列出 PHP 的特性：\ni) `PHP` 易于阅读和理解。\nii) 不需要包含像 `C` 那样的库。\n\
    iii) 它是开源的——因此可以“免费使用”。\niv) 它是一门服务器端脚本语言。\nv) 它是跨平台的（即它可以运行在任何操作系统上——Windows、Mac\
    \ 等）。\nvi) 它提供了与数据库的连接（如 `Oracle`、`MySQL`、`Ms-Access` 等）。\nvii) `PHP` 是面向对象的。\n\
    \n### 3. 列出运行 PHP 的要求。\ni) 一个 Web 服务器（如 `IIS Web server`、`Apache Web server` 等）\n\
    ii) Web 浏览器（如 `IE`、`Google Chrome`）\niii) 文本编辑器（`Notepad` 或 `Notepad++`）\n\n###\
    \ 4. PHP 和 HTML 的区别。\n\n| 序号 | PHP | HTML |\n| --- | --- | --- |\n| 1 | `PHP`\
    \ 用于设计动态网页 | `HTML` 用于设计静态网页 |\n| 2 | `PHP` 文件在服务器端执行 | `HTML` 文件由浏览器解释并执行 |\n\
    | 3 | `PHP` 文件先由 `PHPengine` 执行，在发送给客户端之前转换为 `HTML` 代码 | 因为它在客户端浏览器上运行，所以速度更快\
    \ |\n\n### 5. 服务器端脚本与客户端脚本的区别。\n\n| 序号 | 服务器端脚本 | 客户端脚本 |\n| --- | --- | --- |\n\
    | 1 | 通常用 `ASP`、`JSP` 或 `PHP` 编写 | 它是用 `VBScript` 或 `JavaScript` 编写 |\n| 2 | 始终由\
    \ Web 服务器处理 | 由客户端的 Web 浏览器处理 |\n| 3 | 能够根据用户需求创建 `HTML` 文件 | 无法根据需求创建 `HTML`\
    \ 文件 |\n\n### 6. 什么是 IIS Web 服务器？\ni) `Internet Information Services (IIS)` 是由\
    \ `Microsoft Inc.` 创建的 Web 服务器。\nii) 它是开发和运行 `PHP` 文件的选项之一。\niii) 使用 `IIS` 时，`PHP`\
    \ 文件必须保存在 `C:\\INETPUB\\WWWROOT\\` 文件夹中。\n\n### 7. 什么是 Apache Web 服务器？\ni) `Apache`\
    \ 是最广泛使用的 Web 服务器软件。\nii) `Apache` 是一个免费提供的开源软件。\niii) 可以 `XAMPP` 安装 `Apache`\
    \ Web 服务器。\niv) 使用 `XAMPP` 时，PHP 文件必须保存在 `C:\\htdocs\\` 文件夹中。\n\n### 8. 如何在网页中引入\
    \ PHP？\ni) 使用\n```php\n<?php echo \"hello world\"; ?>\n```\nii) 使用 `<script language=\"\
    php\">`\n\n### 9. PHP 中分号 (;) 的作用是什么？\ni) 分号（`;`）用于终止/结束一条命令。\nii) 示例：\n```php\n\
    <?php echo \"hello world\"; ?>\n```\n\n### 10. PHP 中如何编写注释？\ni) 单行注释 (`//`)\n\
    ii) 多行注释 (`/* */`）\niii) 示例：\n```php\n/* 这个 echo 语句将打印消息 */\necho “Hello World”;\n\
    // 我也可以显示欢迎消息\necho “Ajay”;\n// 以防用户名为 Ajay\n```\n\n### 11. 变量（Variable）是指什么？\n\
    i) 变量是一个命名的位置。\nii) 变量的值在执行过程中可以改变。\niii) PHP 变量示例：\n```php\n<?php\n$x = 52;\n\
    echo $x;\n?>\n```\n\n### 12. 关于变量需要记忆的点：\ni) 所有变量以 `$` 开头，后跟变量名。\nii) 变量名只能包含字母、数字和下划线（_）。\n\
    iii) 变量名不能以数字开头。\niv) 变量名是对大小敏感的。\nv) 变量名不能包含空格。\nvi) 变量在初始化时可以没有值。\nvii) 变量的值可以是任何类型。\n\
    viii) 变量在定义时必须赋值。\nix) 变量在作用域内是有效的。\n\n### 13. 变量赋值（Assignment）是指什么？\ni) 将一个值赋给变量的过程。\n\
    ii) 赋值操作可以在执行过程中完成。\niii) 赋值示例：\n```php\n<?php\n$name = \"John\";\necho $name;\n\
    ?>\n```\n\n### 14. 作用域（Scope）是指什么？\ni) 变量在程序中可以访问的范围。\nii) PHP 中有三种作用域：\n   -\
    \ 局部作用域（在函数内部）\n   - 全局作用域（在函数外部）\n   - 静态作用域（使用 `static` 关键字）\n\n### 15. 常量（Constants）是指什么？\n\
    i) 常量是指一旦定义就不能更改的值。\nii) 使用 `define()` 函数或 `const` 关键字定义。\niii) 常量示例：\n```php\n\
    <?php\ndefine(\"SITE_URL\", \"localhost\");\necho SITE_URL;\n?>\n```\n\n### 16.\
    \ 数组（Arrays）是指什么？\ni) 数组是用于存储多个值的变量。\nii) PHP 支持三种主要类型的数组：\n   - 索引数组（Indexed\
    \ arrays）\n   - 关联数组（Associative arrays）\n   - 多维数组（Multidimensional arrays）\n\
    iii) 数组示例：\n```php\n<?php\n$colors = array(\"Red\", \"Green\", \"Blue\");\necho\
    \ $colors[0];\n?>\n```\n\n### 17. 什么是函数（Functions）？\ni) 函数是执行特定任务的代码块。\nii) 它们通过\
    \ `function` 关键字进行定义。\niii) 函数示例：\n```php\n<?php\nfunction greet($name) {\n  \
    \  echo \"Hello, $name!\";\n}\ngreet(\"World\");\n?>\n``````\n\n### 18. 超局变量（Superglobals）是指什么？\n\
    i) 超局变量是 PHP 中预定义的内置变量，在脚本的任何地方都可以访问。\nii) 常见的超局变量包括：\n   - `$_GET`\n   - `$_POST`\n\
    \   - `$_REQUEST`\n   - `$_SESSION`\n   - `$_COOKIE`\n   - `$_SERVER`\n   - `$_ENV`\n\
    \   - `$_GLOBALS`\n   - `$_FILES`\n\n"
