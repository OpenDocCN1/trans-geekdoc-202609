    \ variable's value.\n\n| Operator | Name | Description |\n| --- | --- | --- |\n\
    | `++$x` | Pre-increment | Increments `$x` by one, then returns `$x` |\n| `$x++`\
    \ | Post-increment | Returns `$x`, then increments `$x` by one |\n| `--$x` | Pre-decrement\
    \ | Decrements `$x` by one, then returns `$x` |\n| `$x--` | Post-decrement | Returns\
    \ `$x`, then decrements `$x` by one |\n\n## 13. What are the Conditional operators\
    \ in PHP?\n\ni) It is used as shorthand for writing an `if/else` statement that\
    \ assigns a value to a variable.\n\nii) Syntax: `Variable=(condition) ? expression1\
    \ if true : expression2 if false`\n\niii) Example 1:\n```php\n$x = 10;\n$y = 15;\n\
    $z = ($x > $y) ? $x : $y;\necho $z; // result : 15\n```\n\niv) Example 2:\n```php\n\
    $age = 20;\n$flag = ($age > 18) ? \"Eligible to vote\" : \"Not Eligible to vote\"\
    ;\n```\n\n## 14. What are the Array operators in PHP?\n\ni) The operators used\
    \ to do array related operations.\n\nii) List of array Operators.\n\niii) The\
    \ PHP array operators are used to compare arrays.\n\n| Op | Name | Example | Result\
    \ |\n| --- | --- | --- | --- |\n| `+` | Union | `$x + $y` | Union of `$x` and\
    \ `$y` |\n| `==` | Equality | `$x == $y` | Returns true if `$x` and `$y` have\
    \ the same key/value pairs |\n| `===` | Identity | `$x === $y` | Returns true\
    \ if `$x` and `$y` have the same key/value pairs in the same order and of the\
    \ same types |\n| `!=` | Inequality | `$x != $y` | Returns true if `$x` is not\
    \ equal to `$y` |\n| `<>` | Inequality | `$x <> $y` | Returns true if `$x` is\
    \ not equal to `$y` |\n| `!==` | Non-identity | `$x !== $y` | Returns true if\
    \ `$x` is not identical to `$y` |\n\n## 15. What is meant by Constant?\n\ni) Constant\
