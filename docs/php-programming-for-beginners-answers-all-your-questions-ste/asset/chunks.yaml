  trans: "\n\n```\n{ \nstatement-1 \n} \n```\n\n或者带有可选的 `else` 分支：\n\n```php\nif (condition)\
    \ \n{ \nstatement-1 \n} \nelse \n{ \nstatement-2 \n}\n```\n\n- 当处理 `if` 语句时，会评估测试表达式，并将结果解释为布尔值。\n\
    - 如果 `condition` 为真（true），则执行 `statement-1`。如果 `condition` 不为真，且存在 `else` 子句，则执行\
    \ `statement-2`。\n- 如果 `condition` 为假（false），且没有 `else` 子句，执行将直接继续 `if` 结构之后的下一个语句。\n\
    \n### 示例:-1 (简单 If)\n\n```php\n<?php\n $a=10; \n if ($a == 10) \n { \n echo $a;\
    \ \n } \n?>\n```\n\n### 示例:-2 (简单 If 和 Else)\n```php\n<?php\n $a=10;\n$b=4; \n\
    \ if ($a > $b) \n { \n echo \"A is greater than\"; \n } \n else \n { \n echo \"\
    B is greater than\"; \n } \n?>\n```\n\n### 示例:-3 (Elseif)\n```php\n<?php\n $a=2;\
    \ \n if ($a == 1) \n { \n print \"Mon\"; \n }\nelseif($a==2) \n { \n print \"\
    Thu\"; \n } \n else \n { \n print \"wrong choice\"; \n } \n?>\n```\n\n### 示例:-4\
    \ (嵌套 if……else)\n```php\n<?php\n $a=1; \n $b=2; \n $c=3; \n if ($a > $b) \n {\
    \ \n if ($a > $c)  {  print \"a is max\";  } \n else  {  print \"c is max\"; \
    \ }  } \n else \n { \n if ($b > $c) \n { \n print \"b is max\";\n} \n else \n\
    \ { \n print \"c is max\"; \n } \n } \n?>\n```\n\n# Switch\n\n- 对于特定类型的多路分支，`switch`\
    \ 结构非常有用。\n- `switch` 并不是根据任意逻辑表达式进行分支，而是根据单个表达式的值采取不同的路径。\n- 语法如下，可选部分包含在方括号\
    \ `[]` 中：\n\n```\nswitch(expression) \n{ \ncase value-1: \nstatement-1 \nstatement-2\
    \ \n... \n[break;] \ncase value-2: \nstatement-3 \nstatement-4 \n... \n[break;]\
    \ \n..... \n…… \n[default: \ndefault-statement] \n}\n```\n\n- 表达式可以是变量或任何其他表达式，只要它评估结果为一个简单值（即整数、双精度浮数或字符串）。\n\
    - 该结构通过评估表达式，然后将结果与每个 `case` 值进行等值性测试来执行。\n- 一旦找到匹配的值，后续语句将按顺序执行，直到遇到特殊语句 `break;`\
    \ 或到达 `switch` 结构的末尾。\n- 在末尾可以使用特殊的 `default` 标签，如果目前为止没有其他 `case` 匹配该表达式，则它将匹配该表达式。\n\
    \n### 示例:\n```php\n<?php\n $a=6; \n switch($a) \n { \n case 1: \n print \"Mon\"\
    ; \n break; \n case 2: \n print \"Tue\"; \n break;\ncase 3: \n print \"Wen\";\
    \ \n break; \n case 4: \n print \"Thu\"; \n break; \n case 5: \n print \"Fri\"\
    ; \n break; \n case 6: \n print \"sat\"; \n break; \n case 7: \n print \"Sun\"\
    ; \n break; \n default: \n print \"Wrong Choice\"; \n } \n?>\n```\n\n# 第 5 章：PHP\
    \ 中的循环\n\n循环：它允许程序员执行一个可以重复执行的操作，直到给定的条件为真。\n\n### 1. While\n\n- 最 的 PHP 循环结构是\
    \ `while`，它具有如下语法：\n\n```\nwhile (condition) \n{ \nStatement \n}\n```\n\n- `while`\
    \ 循环将条件表达式评估为布尔值——如果为真，则执行 `statement` 然后通过重新评估 `condition` 开始循环。\n- 如果 `condition`\
    \ 为假，`while` 循环终止。当然，就像 `if` 一样，`statement` 可以是一个单独的语句，也可以是一个大括号包裹的块。\n- 示例:-\n\
    \n```php\n<?php\n $a=1; \n while ($a <= 10) \n { \n print \"count is $a<BR>\"\
    ; \n $a = $a + 1; \n } \n?>\n```\n\n### 2. do-while\n\n- `do-while` 结构与 `while`\
    \ 类似，不同在于测试发生在循环的末尾。\n- 语法为：\n\n```\ndo \n{ \ncode to be executed; \n} \nwhile\
    \ (condition);\n```\n\n- 语句执行一次，然后评估表达式。\n- 如果表达式为真，则重复语句，直到表达式变为假。\n- `while`\
    \ 和 `do-while` 之间唯一的实际区别是 `do-while` 至少执行一次语句。\n- 示例:-\n\n```php\n<?php\n $a=1;\
    \ \n do \n { \n print \"count is $a<BR>\"; \n $a = $a + 1; \n } while ($a <= 10);\n\
    ?>\n```\n\n### 3. for\n\n- 最复杂的循环结构是 `for`，它具有如下语法：\n\n```\nfor (initialization;\
    \ condition; increment) \n{ \nstatement\n}\n```\n\n- `for` 循环通过初始化、评估条件和增量来执行。\n\
    - 只要条件为真，循环就会继续执行。\n- 示例:-\n\n```php\n<?php\n for ($i=0; $i<10; $i++) \n { \n\
    \ echo $i; \n } \n?>\n```\n\n### 4. foreach\n\n- 存在 `foreach` 作用于数组。\n- `foreach`\
    \ 语法如下：\n\n```\nforeach (array as value) \n{ \nstatement \n}\n```\n\n- 示例:-\n\n\
    ```php\n<?php\n $authors = array(\"Rahul\", \"ravi\", \"ajit\", \"pratik\");\n\
    foreach ($authors as $name) \n { \n echo $name;\n } \n?>\n```\n\n### 5. Break\
    \ 和 continue\n\n- `break` 和 `continue` 命令提供了控制循环的方法。\n- `break` 命令退出它所所在的内层循环。\n\
    - `continue` 命令跳过当前迭代。\n\n- 示例(Break):\n\n```php\n<?php\n for ($i=0; $i<10; $i++)\
    \ \n { \n if ($i == 6) break;\n echo $i; \n } \n?>\n```\n\n- 示例(Continue):\n\n\
    ```php\n<?php\n for ($i=0; $i<10; $i++) \n { \n if ($i == 5) continue;\n echo\
    \ $i; \n } \n?>\n```"
- fmt: "\nstring: \n\n```php\n$a = array( “Rahul”, “ravi”, “ajit”, “pratik” ); \n\
    $b = $a[0]; // $myAuthor contains “Rahul” \n$c = $a[1]; // $anotherAuthor contains\
    \ “ravi” \n$a = array( “Rahul”, “ravi”, “ajit”, “pratik” ); \n$pos = 2; \necho\
    \ $a[$pos + 1]; // Displays “ajit”\n```\n\n## Output an Entire Array with `print_r()`\n\
    \nYou can’t just print an array with `print()` or `echo()`, like you can with\
    \ regular variables, because these functions can work with only one value at a\
    \ time. \n\nHowever, PHP does give you a function called `print_r()` that you\
    \ can use to output the contents of an array for debugging. \n\nUsing `print_r()`\
    \ is easy — just pass it the array you want to output:\n\n```php\nprint_r( $a);\n\
    ```\n\nThe following example code creates an indexed array and an associative\
    \ array, then displays both arrays:\n\n```php\n<?php\n $a = array( \"Rahul\",\
    \ \"ravi\", \"ajit\", \"pratik\" ); \nprint_r ( $a ); \n?>\n```\n\n## foreach\
    \ loop Constructs\n\n- There exists a `foreach` Constructs (command) that will\
    \ apply a set of statements for each value in an array.\n- It works only on arrays,\
    \ however, and will give you a big old error if you try to use it with another\
    \ type of variable.\n- Your syntax for the `foreach` command looks like this:\n\
    \n```php\nforeach ($array_variable as $value_variable) \n{ \n    // .. do something\
    \ with the value in $value_variable\n} \n\nforeach ($array_variable as $key_var\
    \ => $value_var) \n{\n    // .. do something with $key_var and/or $value_var\n\
    }\n```\n\n- Example:\n\n```html\n<html>\n<head>\n<title>For Each Constructs</title>\n\
    </head>\n<body>\n<?php\n $a[] = \"Rahul\"; \n $a[] = \"Ravi\"; \n $a[] = \"Pratik\"\
    ; \necho \"My Name -->\".'</br>'; \nforeach ($a as $b) \n{ \n    //these lines\
    \ will execute as long as there is a value in $a \n    echo $b.'</br>'; \n} \n\
    ?>\n</body>\n</html>\n```\n\n## In-Built Functions used with Arrays: `sort()`\
    \ and `rsort()`\n\n### i. `sort()`\n\n- Sorts an array.\n- Definition and Usage:\
    \ The `sort()` function sorts an array by the values.\n- This function assigns\
    \ new keys for the elements in the array. Existing keys will be removed.\n- This\
    \ function returns `TRUE` on success, or `FALSE` on failure.\n- Syntax: `sort(array,sorttype)`\n\
    \  - `Array`: Required. Specifies the array to sort.\n  - `Sorttype`: Optional.\
    \ Specifies how to sort the array values. Possible values:\n    - `SORT_REGULAR`:\
    \ Default. Treat values as they are (don't change types).\n    - `SORT_NUMERIC`:\
    \ Treat values numerically.\n    - `SORT_STRING`: Treat values as strings.\n \
    \   - `SORT_LOCALE_STRING`: Treat values as strings, based on local settings.\n\
    - Example:\n\n```php\n<?php\n$animal = array(\"a\" => \"Dog\", \"b\" => \"Cat\"\
    , \"c\" => \"Horse\");\nsort($animal);\nprint_r($animal);\n?>\n```\n- Output:\n\
    Array ( [0] => Cat [1] => Dog [2] => Horse )\n\n### ii. `rsort()`\n\n- Returns\
    \ an array in descending order.\n- Definition and Usage: The `rsort()` function\
    \ returns an array in descending order.\n- `Array`: Required. Specifies an array.\n\
    - `Preserve`: Optional. Possible values: `true` OR `false`. Specifies if the function\
    \ should preserve the array's keys or not.\n- Example:\n\n```php\n<?php\n$a=array(\"\
    a\"=>\"Dog\",\"b\"=>\"Cat\",\"c\"=>\"Horse\");\nprint_r(rsort($a));\n?>\n```\n\
    - Output: Array ( [c] => Horse [b] => Cat [a] => Dog )\n\n## CHAPTER 7: USER-DEFINED\
    \ FUNCTIONS AND GLOBAL VARIABLES\n\n### Function\n\nFunctions are most useful\
    \ when will be using the code more than one place, but can be helpful even in\
    \ one-use situations because they can make your code more readable.\n\n#### Syntax\n\
    Function definitions have the following form:\n\n```php\nfunction function-name\
    \ ($argument-1, $argument-2)\n{\n    statement-1;\n    statement-2;\n    ...\n\
    }\n```\n\n#### Example-1\n```php\n<?php\nfunction add($a, $b) \n{ \n    $c=$a+$b;\
    \ \n    echo \"Total\".$c; \n} \n$x = 10; \n$y = 20; \nadd($x,$y); \n?>\n```\n\
    \n#### Example-2 (Return value)\n```php\n<?php\nfunction add($a, $b) \n{ \n  \
    \  return $a+$b; \n} \n$x = 10; \n$y = 20; \n$c=add($x,$y); \necho \"Total\".$c;\
    \ \n?>\n```\n\n#### Formal parameters versus actual parameters\n\nIn the preceding\
    \ examples, the arguments we passed to our functions happened to be variables,\
    \ but this is not a requirement. The actual parameters (that is, the arguments\
    \ in the function call) may be any expression that evaluates to a value. In our\
    \ examples, we could have passed numbers to our function calls rather than variables,\
    \ as in: `add(10,20)`.\n\nAlso notice that in the examples we had a couple of\
    \ cases where the actual parameter variable had the same name as the formal parameter\
    \ (for example, `$a`), and we also had cases where the actual and formal names\
    \ were different ($x is not the same as $a). As we will see in the next section,\
    \ this name agreement doesn’t matter either—the names of a function’s formal parameters\
    \ are completely independent of the world outside the function, including the\
    \ function call itself.\n\nExample:\n```php\n<?php\nfunction add($a,$b) \n{ \n\
    \    $c=$a+$b; \n    echo \"Addition\".$c.'</br>'; \n} \nfunction sub($d,$e) \n\
    { \n    $f=$d-$e; \n    echo \"Sub\".$f; \n} \nadd(10,20); \n$x=20; \n$y=10; \n\
    sub($x,$y); \n?>\n```\n\n#### Argument passes: Call By Value and Call By Reference\n\
    \nIn PHP we can pass argument to the function by two ways: Call By Value and Call\
    \ By Reference.\n\n##### Call-by-Value\nThe default behavior for user-defined\
    \ functions in PHP is call-by-value. This means that when you pass variables to\
    \ a function call, PHP makes copies of the variable values to pass on to the function.\
    \ So, whatever the function does, it is not able to change the actual variables\
    \ that appear in the function call. This behavior can be good or bad. It’s a nice\
    \ reassurance if you only want to use a function for its returned value, but it\
    \ can also be a source of confusion and frustration if changing the passed variable\
    \ is actually your goal.\n\nExample:\n```php\n<?php\nfunction display($b1,$b2)\
    \ \n{ \n    $b1 = 30; \n    $b2 = 40; \n} \n$a1=10; \n$a2=20; \ndisplay($a1,$a2);\
    \ \necho $a1; \necho $a2; \n?>\n```\nOutput:\n10\n20\n\n##### Call-by-Reference\n\
    PHP offers two different ways to have functions actually modify their arguments:\
    \ in the function definition and in the function call.\n\nExample:\n```php\n<?php\n\
    function display(&$b1,&$b2) \n{ \n    $b1 = 30; \n    $b2 = 40; \n} \n$a1=10;\
    \ \n$a2=20; \ndisplay($a1,$a2); \necho $a1; \necho $a2; \n?>\n```\nOutput:\n30\n\
    40\n\n### Return Function\nValues are returned by using the optional `return`\
    \ statement. Any type may be returned, including arrays and objects. This causes\
    \ the function to end its execution immediately and pass control back to the line\
    \ from which it was called. If called from within a function, the `return()` function\
    \ immediately ends execution of the current function, and returns its argument\
    \ as the value of the function call.\n\nExample:\n```php\n<?php\nfunction sum($a,$b)\
    \ \n{ \n    $c=$a+$b; \n    return $c; \n} \n$x = 10; \n$y = 20; \n$z=sum($x,$y);\
    \ \necho $z; \n?>\n```\nOutput: 30\n\n### Default arguments\nTo define a function\
    \ with default arguments, simply turn the formal parameter name into an assignment\
    \ expression. If the actual call has fewer parameters than the definition has\
    \ formal parameters, PHP will match actual with formal until the actual parameters\
    \ are exhausted and then will use the default assignments to fill in the rest.\n\
    \nExample:\n```php\n<?php\nfunction info($fname=\"rahul\",$lname=\"patel\") \n\
    { \n    echo $fname; \necho $lname.'</br>'; \n} \ninfo(); \ninfo(\"ravi\"); \n\
