    \ the URI of the current page |\n\n# CHAPTER 8: PHP FORMS HANDLING, FORM VALIDATIONS\n\
    (USING `$_GET`, `$_POST`, `$_REQUEST`)\n\n## 1. The `ACTION` attribute of the\
    \ `<FORM>`\n\nThe `ACTION` attributes calls the given ASP file, when the `SUBMIT`\
    \ button is clicked. If the `ACTION` attribute is not given for a `<FORM>` then\
    \ the ASP is requesting itself, it is a “Self-referencing” page.\n\n## 2. The\
    \ `GET` and `POST` method\n\na. The `GET` method sends the variable names and\
    \ the value pairs of the Form by concatenating it along with the URL as a Query\
    \ String.\n\nb. The `POST` method sends the variable names and value pairs of\
    \ the Form as encoded along with the HTTP headers.\n\ni. Advantage of `POST`:\
    \ Security of information\n\nii. Disadvantage of `POST`: The resulting response\
    \ page cannot be bookmarked.\n\n## 3. PHP has two global variables `$_GET` and\
    \ `$_POST` which are used to retrieve user input information from HTML forms.\n\
    \n## 4. Super global variable `$_REQUEST` to collect the value of the input field\
    \ instead of `$_GET` or `$_POST`.\n\n## 5. Practical Examples: Separate HTML and\
    \ PHP files.\n\n### Q. Write the HTML and PHP program to create the Welcome message:\n\
    \n![](Images/image00172.jpeg)\n\n**Ans: HTML file save on desktop(wel.html)**\n\
    \n```html\n<html>  \n<body>\n<form action=\"welcome.php\" method=\"post\">\nName:\
    \ <input type=\"text\" name=\"name\"><br>\nE-mail: <input type=\"text\" name=\"\
    email\"><br>\n<input type=\"submit\">\n</form>\n</body>\n</html>\n```\n\n**PHP\
    \ file saved in htdocs (welcome.php)**\n\n```php\n<?php\necho \"Your name is:\
    \ \" . $_POST[\"name\"], \"<br>\";\necho \"You Email is \" . $_POST[\"email\"\
    ];\n?>\n```\n\n**Output :**\nWelcome John\nYour email address is john.doe@example.com\n\
    \n## Practical Examples: Single PHP file with HTML form.\n\n### Q. Write a single\
    \ PHP file which contains the form that accepts the Name and Age of the user displays\
    \ it back when the submit button is clicked. (Note: In the example `$_GET` is\
    \ used.)\n\n**Ans:**\n\n```html\n<html>\n<head>\n<title>$_POST result in URL</title>\n\
    </head>\n<body>\n<FONT SIZE=\"6pt\" color=blue FACE=\"Comic Sans MS\">\n<H3>Handling\
    \ HTML forms</H3>\n</FONT>\n<HR>\n<form name=\"DisplayDetails\" method=\"GET\"\
    \ action=\"<?php echo $_SERVER[\"PHP_SELF\"]; ?>\">\nName: <input type=\"text\"\
    \ name=\"fname\" />\nAge: <input type=\"text\" name=\"age\" />\n<input type=\"\
    submit\" name=\"btnSubmit\" id=\"btnSubmit\" value=\"Submit\"/>\n</form>\n<?php\n\
    echo \"Your name is: \" . $_GET[\"fname\"], \"<br>\";\necho \"You age is \" .\
    \ $_GET[\"age\"];\n?>\n</body>\n</html>\n```\n\n## Practical Examples: Validating\
    \ Forms\n\n### Q. Write the PHP program which displays a form that accepts User\
    \ Name. Then it validates if the User Name is empty and display messages. (Note:\
    \ In the example `$_REQUEST` is used.)\n\n**Ans:**\n\n```html\n<html>\n<body>\n\
    <form method=\"post\" action=\"<?php echo$_SERVER['PHP_SELF'];?>\">\n  Name: <input\
    \ type=\"text\" name=\"fname\">\n  <input type=\"submit\">\n</form>\n<?php\nif\
    \ ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n    // collect value of input\
    \ field\n    $name = $_REQUEST['fname']; \n    if (empty($name)) {\n        echo\
    \ \"Name is empty\";\n    } else {\n        echo \"Welcome, \" . $name;\n    }\n\
    }\n?>\n</body>\n</html>\n```\n\n`$_REQUEST` is a superglobal that contains information\
    \ about current HTTP request variables. By default, `$_REQUEST` contains the contents\
    \ of `$_GET`, `$_POST`, and `$_COOKIE`.\n\nIt is an array that contains information\
