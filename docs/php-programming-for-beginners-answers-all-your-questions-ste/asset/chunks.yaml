  trans: "\n\n- 这通常是你希望发生的情况，因为这允许你编写出良好的、自包含的函数，这些函数之间可以独立运行。\n- 然而，有时创建一个生命周期较长的局部变量也是很有用的。\n\
    - 静态变量（static variables）让你能够实现这一点。这些类型的变量在意义上仍然是函数的局部的，因为它们只能在函数代码内部被访问。\n- 但是，与退出函数后就会消失的局部变量不同，静态变量会记住从一次函数调用到下一次调用的值。\n\
    - 要将局部变量声明为静态的，你只需要在变量名之前编写 `static` 关键字，并为变量分配一个初始值：\n\n```\nstatic $var = 0;\n\
    ```\n\n- 当函数第一次被调用时，该变量被设置为它的初始值（在本例中为 0）。\n- 但是，如果变量的值在函数内部被更改，那么在下一次调用函数时将记住这个新值。\n\
    - 该值只在脚本运行期间被记住，因此当你下次运行脚本时，变量将重新初始化。\n\n### 示例：（局部变量）\n\n```php\n<?php\nfunction\
    \ nextNumber()\n{\n  $counter = 0;\n  return ++$counter;\n}\n\necho \"I’ve counted\
    \ to:\".nextNumber().\" <br/> \";\necho \"I’ve counted to:\".nextNumber().\" <br/>\"\
    ;\necho \"I’ve counted to:\".nextNumber().\" <br/>\";\n?>\n```\n\n输出：\n```\nI’ve\
    \ counted to: 1\nI’ve counted to: 1\nI’ve counted to: 1\n```\n\n- 每每次调用 `nextNumber()`\
    \ 函数时，它的局部变量 `$counter` 都会被重新创建并初始化为 0。\n- 随后它被递增到 1，并将其值返回给调用代码。\n- 因此，无论调用多少次，该函数始终返回\
    \ 1。\n\n### 示例：（静态变量）\n\n```php\n<?php\nfunction nextNumber()\n{\n  static $counter\
    \ = 0;\n  return ++$counter;\n}\n\necho \"I’ve counted to:\".nextNumber().\" <br/>\
    \ \";\necho \"I’ve counted to:\".nextNumber().\" <br/>\";\necho \"I’ve counted\
    \ to:\".nextNumber().\" <br/>\";\n?>\n```\n\n输出：\n```\nI’ve counted to: 1\nI’ve\
    \ counted to: 2\nI’ve counted to: 3\n```\n\n- 你可能不会频繁使用静态变量，而且你通常可以使用全局变量来实现相同的效果（尽管风险更大）。\n\
    \n## 全局变量\n\n- 尽管变量作用域的概念非常有用，但有时你确实想要创建一个可以在脚本中任何地方被访问的变量，无论是在函数内部还是外部。这种变量被称为全局变量（global\
    \ variable）。\n- PHP 支持全局变量，但如果你习惯其他编程语言，你会发现 PHP 处理全局变量的方式略有不同。\n- 在 PHP 中，所有在函数外部创建的变量某种意义上都是全局的，因为它们可以被脚本中任何函数之外的任何代码访问。\n\
    - 要在函数内部使用此类变量，请在函数代码中编写 `global` 关键字后跟变量名。\n\n### 示例：\n\n```php\n<?php\n$myGlobal\
    \ = \"Hello\";\nfunction hello()\n{\n  global $myGlobal;\n  echo \"$myGlobal\"\
    ;\n}\nhello(); // 显示 Hello\n```\n\n- 你可以看到，`hello()` 函数通过使用 `global` 语句将 `$myGlobal`\
    \ 变量声明为全局来访问它。\n- 随后函数可以使用该变量来显示问候。事实上，你不需要在函数外部创建变量就可以将其作为全局变量使用。\n- 查看下面的脚本：\n\
    \n```php\n<?php\nfunction setup()\n{\n  global $myGlobal;\n  $myGlobal = \"Hello\
    \ there!\";\n}\n\nfunction hello()\n{\n  global $myGlobal;\n  echo \"$myGlobal\"\
    ;\n}\nsetup();\nhello(); // 显示 Hello there!\n?>\n```\n\n- 在此脚本中，首先调用了 `setup()`\
    \ 函数。\n- 它将 `$myGlobal` 变量声明为全局，并给它赋值。\n- 然后调用了 `hello()` 函数。\n- 它也将 `$myGlobal`\
    \ 声明为全局，这意味着它现在可以访问之前由 `setup()` 设置的值并将其显示。\n- 顺便说一下，你还可以在同一行上使用逗号同时声明多个全局变量：\n\
    \n```php\nfunction myFunction()\n{\n  global $oneGlobal, $anotherGlobal;\n}\n\
    ```\n\n- 最后，你还可以使用 `$GLOBALS` 数组访问全局变量。\n- 该数组是一种特殊的变量类型，称为超级全局（superglobal），这意味着你可以从任何地方访问它而无需使用\
    \ `global` 语句。\n- 它包含了所有全局变量列表，变量名存储在键中，变量值存储在值中。这里有一个使用 `$GLOBALS` 的示例：\n\n```php\n\
    <?php\n$myGlobal = \"Hello\";\nfunction hello()\n{\n  echo $GLOBALS[\"myGlobal\"\
    ];\n}\nhello(); // 显示 Hello\n?>\n```\n\n- `hello()` 函数通过 `$GLOBALS` 数组访问 `$myGlobal`\
    \ 变量的内容。注意，函数不需要将 `$myGlobal` 变量声明为全局即可访问其值。\n\n## SUPERGLOBALS\n\n### 1. PHP\
    \ 超全局变量\nPHP 中的几个内置变量是“超级全局变量”，这意味着无论在函数、类还是文件中，都可以访问它们。\n\n### 2. 超全局变量列表\n-\
    \ `$GLOBALS`\n- `$_SERVER`\n- `$_REQUEST`\n- `$_POST`\n- `$_GET`\n- `$_FILES`\n\
    - `$_ENV`\n- `$_COOKIE`\n- `$_SESSION`\n\n`$GLOBALS` 是一个 PHP 超全局变量，它将全局变量存储在一个数组中。\n\
    a. 它的索引是变量名。\nb. 下面的示例展示了如何使用 `$GLOBALS`：\n\n```php\n<?php\n$x = 75;\n$y = 25;\n\
    function addition() {\n  $GLOBALS['z'] = $GLOBALS['x'] + $GLOBALS['y'];\n}\naddition();\n\
    echo $z;\n?>\n```\n输出:100\n\n`$_SERVER` 是 PHP 超全局变量，包含了标头、路径和脚本位置的信息。\na. 下面的示例展示了如何使用\
    \ `$_SERVER` 中的某些元素：\n\n```php\n<?php\necho $_SERVER['PHP_SELF'];\necho \"<br>\"\
    ;\necho $_SERVER['SERVER_NAME'];\necho \"<br>\";\necho $_SERVER['HTTP_HOST'];\n\
    echo \"<br>\";\necho $_SERVER['HTTP_REFERER'];\necho \"<br>\";\necho $_SERVER['HTTP_USER_AGENT'];\n\
    echo \"<br>\";\necho $_SERVER['SCRIPT_NAME'];\n?>\n```\n输出：\n```\n/php/demo_global.php\n\
    www.w3schools.com\nwww.w3schools.com\nhttp://www.w3schools.com/php.asp?filename=demo_global\n\
    Mozilla/5.0 (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/52.0.2743.116\
    \ Safari/537.36\n/php/demo_global.php\n```\n\n下表列出了 `$_SERVER` 中最重要的元素：\n\n| 元素/代码\
    \ | 说明 |\n| --- | --- |\n| `$_SERVER['PHP_SELF']` | 返回当前执行的文件 |\n| `$_SERVER['GATEWAY_INTERFACE']`\
    \ | 返回服务器使用的通用网关接口 (CGI) 版本 |\n| `$_SERVER['SERVER_ADDR']` | 返回服务器的 IP 地址 |\n\
    | `$_SERVER['SERVER_NAME']` | 返回服务器名称（例如 www.w3schools.com） |\n| `$_SERVER['SERVER_SOFTWARE']`\
    \ | 返回服务器标识字符串（例如 Apache/2.2.24） |\n| `$_SERVER['SERVER_PROTOCOL']` | 返回协议协议名称和修订（例如\
    \ HTTP/1.1） |\n| `$_SERVER['REQUEST_METHOD']` | 返回访问页面的请求方法（例如 POST） |\n| `$_SERVER['REQUEST_TIME']`\
    \ | 返回请求开始的时间戳（例如 1377687496） |\n| `$_SERVER['QUERY_STRING']` | 如果通过查询字符串访问页面，则返回查询字符串\
    \ |\n| `$_SERVER['HTTP_ACCEPT']` | 返回当前请求中的 Accept 头部 |\n| `$_SERVER['HTTP_ACCEPT_CHARSET']`\
    \ | 返回当前请求中的 Accept_Charset 头部（例如 utf-8,ISO-8859-1） |\n| `$_SERVER['HTTP_HOST']`\
    \ | 返回当前请求中的 Host 头部 |\n\n"
