    i)A function is a piece of code which takes one or more input in the form of parameter
    and does some processing and returns a value.


    ii)Functions can be reused again and again.


    ## 2 What are the two types of Function?


    i)In-built/system defined functions


    ii)User defined functions


    ## 3 What are the benefits of Functions?


    i)Functions can be reused again and again


    ii)Easy debugging


