    ## 第 4 章：PHP 中的分支


    1 分支


    - 分支的主要两个结构是 if 和 switch。

    - If 是核心工具，通常是任何人学习的第一个条件结构。

    - 在某些情况下，如果你想根据单个值有多个可能的分支，且一系列 if 语句会很繁琐，Switch 是一个非常有用的替代方案。


    1.If-else


    - 语法：


    ```php

    if (condition)

    ```


    '
- fmt: "\n```\n{ \nstatement-1 \n} \n```\n\nOr with an optional else branch:\n\n```\n\
    if (condition) \n{ \nstatement-1 \n} \nelse \n{ \nstatement-2 \n}\n```\n\n- When\
    \ an `if` statement is processed, the test expression is evaluated, and the result\
    \ is interpreted as a Boolean value.\n- If `condition` is true, `statement-1`\
    \ is executed. If `condition` is not true, and there is an `else` clause, `statement-2`\
    \ is executed.\n- If `condition` is false, and there is no `else` clause, execution\
    \ simply proceeds with the next statement after the `if` construct.\n\n### Example:-1\
    \ (Simple If)\n\n```php\n<?php\n $a=10; \n if ($a == 10) \n { \n echo $a; \n }\
    \ \n?>\n```\n\n### Example:-2 (Simple If and Else)\n```php\n<?php\n $a=10;\n$b=4;\
    \ \n if ($a > $b) \n { \n echo \"A is greater than\"; \n } \n else \n { \n echo\
    \ \"B is greater than\"; \n } \n?>\n```\n\n### Example:-3 (Elseif)\n```php\n<?php\n\
    \ $a=2; \n if ($a == 1) \n { \n print \"Mon\"; \n }\nelseif($a==2) \n { \n print\
    \ \"Thu\"; \n } \n else \n { \n print \"wrong choice\"; \n } \n?>\n```\n\n###\
    \ Example:-4 (Nested if……else)\n```php\n<?php\n $a=1; \n $b=2; \n $c=3; \n if\
    \ ($a > $b) \n { \n if ($a > $c)  {  print \"a is max\";  } \n else  {  print\
    \ \"c is max\";  }  } \n else \n { \n if ($b > $c) \n { \n print \"b is max\"\
    ;\n} \n else \n { \n print \"c is max\"; \n } \n } \n?>\n```\n\n# Switch\n\n-\
    \ For a specific kind of multi way branching, the `switch` construct can be useful.\n\
    - Rather than branch on arbitrary logical expressions, `switch` takes different\
    \ paths according to the value of a single expression.\n- The syntax is as follows,\
    \ with the optional parts enclosed in square brackets `[]`:\n\n```\nswitch(expression)\
    \ \n{ \ncase value-1: \nstatement-1 \nstatement-2 \n... \n[break;] \ncase value-2:\
    \ \nstatement-3 \nstatement-4 \n... \n[break;] \n..... \n…… \n[default: \ndefault-statement]\
    \ \n}\n```\n\n- The expression can be a variable or any other kind of expression,\
    \ as long as it evaluates to a simple value (that is, an integer, a double, or\
    \ a string).\n- The construct executes by evaluating the expression and then testing\
    \ the result for equality against each `case` value.\n- As soon as a matching\
    \ value is found, subsequent statements are executed in sequence until the special\
    \ statement `break;` or until the end of the `switch` construct.\n- A special\
    \ `default` tag can be used at the end, which will match the expression if no\
    \ other case has matched it so far.\n\n### Example:\n```php\n<?php\n $a=6; \n\
    \ switch($a) \n { \n case 1: \n print \"Mon\"; \n break; \n case 2: \n print \"\
    Tue\"; \n break;\ncase 3: \n print \"Wen\"; \n break; \n case 4: \n print \"Thu\"\
    ; \n break; \n case 5: \n print \"Fri\"; \n break; \n case 6: \n print \"sat\"\
    ; \n break; \n case 7: \n print \"Sun\"; \n break; \n default: \n print \"Wrong\
    \ Choice\"; \n } \n?>\n```\n\n# CHAPTER 5: LOOPING IN PHP\n\nLooping: It allows\
    \ the programmer to perform an action that can be repeated till the given condition\
    \ is true.\n\n### 1. While\n\n- The simplest PHP looping construct is `while`,\
    \ which has the following syntax:\n\n```\nwhile (condition) \n{ \nStatement \n\
    }\n```\n\n- The `while` loop evaluates the condition expression as a Boolean—if\
    \ it is true, it executes `statement` and then starts again by evaluating `condition`.\n\
    - If the `condition` is false, the `while` loop terminates. Of course, just as\
    \ with `if`, `statement` may be a single statement or it may be a brace-enclosed\
    \ block.\n- Example:-\n\n```php\n<?php\n $a=1; \n while ($a <= 10) \n { \n print\
    \ \"count is $a<BR>\"; \n $a = $a + 1; \n } \n?>\n```\n\n### 2. do-while\n\n-\
    \ The `do-while` construct is similar to `while`, except that the test happens\
    \ at the end of the loop.\n- The syntax is:\n\n```\ndo \n{ \ncode to be executed;\
    \ \n} \nwhile (condition);\n```\n\n- The statement is executed once, and then\
    \ the expression is evaluated.\n- If the expression is true, the statement is\
    \ repeated until the expression becomes false.\n- The only practical difference\
    \ between `while` and `do-while` is that the latter will always execute its statement\
    \ at least once.\n- Example:-\n\n```php\n<?php\n $a=1; \n do \n { \n print \"\
    count is $a<BR>\"; \n } \nwhile (condition);?>\n```\n\n### 3. for\n\n- The most\
    \ complicated looping construct is `for`, which the following syntax:\n\n```\n\
    for (initial-expression;termination-check;end-expression) \n{ \nstatements \n\
    }\n```\n\n- In a `for` statement, first the `initial-expression` is initialized.\n\
    - Then `termination-check` is evaluated; if it is false, the loop concludes. If\
    \ it is true, the `end-expression` is executed.\n- Finally, the `end-expression`\
    \ is executed, and the cycle begins.\n- The `for` construct may be a single statement,\
    \ a brace-enclosed block, or a variable.\n- Example:-\n\n```php\n<?php\n for ($i=0;\
    \ $i<5; $i++) \n { \n echo $i; \n } \n?>\n```\n\n### 4. foreach\n\n- There exists\
    \ `foreach` command that apply to arrays.\n- The `foreach` loop works only on\
    \ arrays.\n- The syntax looks like this:\n\n```\nforeach (array as value) \n{\
    \ \nstatement \n}\n```\n\n- Example:-\n\n```php\n<?php\n $authors = array(\"Rahul\"\
    , \"ravi\", \"ajit\", \"pratik\");\nforeach ($authors as $name) \n { \n echo $name;\n\
    \ }\n?>\n```\n\n### 5. Break and continue\n\n- The `break` and `continue` commands\
    \ offer a way to control the loop.\n- The `break` command exits the innermost\
    \ loop that contains it.\n- The `continue` command skips to the end of the current\
    \ iteration.\n\n- Example(Break):\n```php\n<?php\n $i = 0; \n while ($i<10) \n\
    \ { \n if ($i > 6) break; \n echo $i; \n $i=$i+1; \n } \n?>\n```\n\n- Example(Continue):\n\
    ```php\n<?php\n for ($i=0; $i<10; $i++) \n { \n if ($i == 5) continue; \n echo\
    \ $i; \n } \n?>\n```\n\n# CHAPTER 6: ARRAY IN PHP\n\nArrays\n\n- An array is a\
    \ single variable that can hold more than one value at.\n- You can think of an\
    \ array as a list of values.\n- Each value within an array is called an element,\
    \ and each element is referenced by its own index, which is unique to that array.\n\
    - To access an element’s value — whether you’re creating, reading, writing, or\
    \ deleting the element — you use that element’s index. For example, the first\
    \ element has an index of 0.\n\nAssociative arrays\n\nWith associative arrays,\
    \ each element is referenced by a string index. For example, you might create\
    \ an array element representing a customer’s age and give it an index of “age”.\n\
    \n### Creating Arrays\n\n- This takes a list of values and creates an array containing\
    \ those values, which you can then assign to a variable:\n\n```php\n$a = array(\
    \ \"Rahul\", \"ravi\", \"ajit\", \"pratik\" );\n```\n\n- In this line of code,\
