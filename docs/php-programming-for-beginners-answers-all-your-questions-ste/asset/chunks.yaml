  raw: "{ \n\nstatement-1 \n\n} \n\nOr with an optional else branch: \n\nif (condition)\
    \ \n\n{ \n\nstatement-1 \n\n} \n\nelse \n\n{ \n\nstatement-2 \n\n} \n\n When\
    \ an if statement is processed, the test expression is evaluated, and the result\
    \ is interpreted as a Boolean value. \n\n If condition is true, statement-1 is\
    \ executed. If condition is not true, and there is an else clause, statement-2\
    \ is executed. \n\n If condition is false, and there is no else clause, execution\
    \ simply proceeds with the next statement after the if construct. \n\n Example:-1\
    \ (Simple If) \n\n<?php\n\n $a=10; \n\n if ($a == 10) \n\n { \n\n echo $a; \n\n\
    \ } \n\n?>\n\nExample:-2 (Simple If and Else) \n\n<?php\n\n $a=10;\n\n$b=4; \n\
    \n if ($a > $b) \n\n { \n\n echo \"A is greater than\"; \n\n } \n\n else \n\n\
    \ { \n\n echo \"B is greater than\"; \n\n } \n\n?>\n\nExample:-3 (Elseif) \n\n\
    <?php\n\n $a=2; \n\n if ($a == 1) \n\n { \n\n print \"Mon\"; \n\n } \n\nelseif($a==2)\
    \ \n\n { \n\n print \"Thu\"; \n\n } \n\n else \n\n { \n\n print \"wrong choice\"\
    ; \n\n } \n\n?>\n\n Example:-4 (Nested if……else) \n\n<?php\n\n $a=1; \n\n $b=2;\
    \ \n\n $c=3; \n\n if ($a > $b) \n\n { \n\n if ($a > $c)  {  print \"a is max\"\
    ;  } \n\n else  {  print \"c is max\";  }  } \n\n else \n\n { \n\n if ($b > $c)\
    \ \n\n { \n\n print \"b is max\";\n\n} \n\n else \n\n { \n\n print \"c is max\"\
    ; \n\n } \n\n } \n\n?>\n\nSwitch\n\n For a specific kind of multi way branching,\
    \ the switch construct can be useful. \n\n Rather than branch on arbitrary logical\
    \ expressions, switch takes different paths according \n\nto the value of a single\
    \ expression. \n\n The syntax is as follows, with the optional parts enclosed\
    \ in square brackets (\\[\\]) \n\nswitch(expression) \n\n{ \n\ncase value-1: \n\
    \nstatement-1 \n\nstatement-2 \n\n... \n\n\\[break;\\] \n\ncase value-2: \n\n\
    statement-3 \n\nstatement-4 \n\n... \n\n\\[break;\\] \n\n..... \n\n…… \n\n\\[default:\
    \ \n\ndefault-statement\\] \n\n} \n\n The expression can be a variable or any\
    \ other kind of expression, as long as it evaluates to a \n\nsimple value (that\
    \ is, an integer, a double, or a string). \n\n The construct executes by evaluating\
    \ the expression and then testing the result for equality \n\nagainst each case\
    \ value. \n\n As soon as a matching value is found, subsequent statements are\
    \ executed in sequence \n\nuntil the special statement (break ;) or until the\
    \ end of the switch construct. \n\n A special default tag can be used at the\
    \ end, which will match the ex pression if no other \n\ncase has matched it so\
    \ far. \n\nExample: \n\n<?php\n\n $a=6; \n\n switch($a) \n\n { \n\n case 1: \n\
    \n print \"Mon\"; \n\n break; \n\n case 2: \n\n print \"Tue\"; \n\n break;\n\n\
    case 3: \n\n print \"Wen\"; \n\n break; \n\n case 4: \n\n print \"Thu\"; \n\n\
    \ break; \n\n case 5: \n\n print \"Fri\"; \n\n break; \n\n case 6: \n\n print\
    \ \"sat\"; \n\n break; \n\n case 7: \n\n print \"Sun\"; \n\n break; \n\n default:\
    \ \n\n print \"Wrong Choice\"; \n\n } \n\n?>\n\nCHAPTER 5: LOOPING IN PHP\n\n\
    Looping : It allows the programmer to perfom an action that can be repeated till\
    \ the given condition is true.\n\n1.While \n\n The simplest PHP looping construct\
    \ is while, which has the following syntax: \n\nwhile (condition) \n\n{ \n\nStatement\
    \ \n\n} \n\n The while loop evaluates the condition expression as a Boolean —if\
    \ it is true, it executes \n\nstatement and then starts again by evaluating condition.\
    \ \n\n If the condition is false, the while loop terminates. Of course, just\
    \ as with if, statemen t may \n\nbe a single statement or it may be a brace-enclosed\
    \ block. \n\n Example:- \n\n<?php\n\n $a=1; \n\n while ($a <= 10) \n\n { \n\n\
    \ print \"count is $a<BR>\"; \n\n $a = $a + 1; \n\n } \n\n?>\n\n2.do-while\n\n\
     The do-while construct is similar to while, except that the test happens at\
    \ the end of the \n\nloop. \n\n The syntax is: \n\ndo \n\n{ \n\ncode to be executed;\
    \ \n\n} \n\nwhile (condition); \n\n The statement is executed once, and then\
    \ the expression is evaluated. \n\n If the expression is true, the statement\
    \ is repeated until the expression becomes false. \n\n The only practical difference\
    \ between while and do-while is that the latter will always \n\nexecute its statement\
    \ at least once. \n\n Example:- \n\n<?php\n\n $a=1; \n\n do \n\n { \n\n print\
    \ \"count is $a<BR>\"; \n\n $a = $a + 1; \n\n } \n\n while ($a <= 10); \n\n?>\n\
    \n3.for \n\nThe most complicated looping construct is for, which h as the following\
    \ syntax: \n\nfor (initial-expression;termination-check;loop-end-expression\n\n\
    { \n\nNumber of statements \n\n} \n\n In executing a for statement, first the\
    \ initial-expression is evaluated just once, usually to \n\ninitialize variables.\
    \ \n\n Then termination-check is evaluated—if it is false, the for statement\
    \ concludes, and if it is \n\ntrue, the statement executes. \n\n Finally, the\
    \ loop-end-expression is executed and the cycle begins again with termination-\n\
    \ncheck. \n\n As always, by statement we mean a single (semicolon -terminated)\
    \ statement, a brace-\n\nenclosed block, or a conditional construct. \n\n Example:-\
    \ \n\n<?php\n\n for ($i = 1; $i<= 5; $i++) \n\n { \n\n echo $i; \n\n } \n\n?>\n\
    \n4.foreach loop\n\n There exists a foreach Constructs (command) that will apply\
    \ a set of statements for each \n\nvalue in an array. \n\n It works only on arrays,\
    \ however, and will give you a big old error if you try to use it with \n\nanother\
    \ type of variable. \n\n Your syntax for the foreach command looks like this:\
    \ \n\nforeach ($array\\_variable as $value\\_variable) \n\n { \n\n// .. do something\
    \ with the value in $value\\_variable\n\n} \n\nforeach ($array\\_variableas $key\\\
    _var => $value\\_var) \n\n{ \n\n// .. do something with $key\\_var and/or $value\\\
    _var\n\n} \n\n Example: \n\n<html>\n\n<head>\n\n<title>\n\n For Each Constructs\
    \ \n\n</title>\n\n</head>\n\n<body>\n\n<?php\n\n $a\\[\\] = \"Rahul\"; \n\n $a\\\
    [\\] = \"Ravi\"; \n\n $a\\[\\] = \"Pratik\"; \n\n echo \"My Name -->\".'</br>';\
    \ \n\nforeach ($a as $b) \n\n { \n\n //these lines will execute as long as there\
    \ is a value in $a \n\n echo $b.'</br>'; \n\n } \n\n?>\n\n</body>\n\n</html>\n\
    \n5.Break and continue \n\n The standard way to get out of a looping structure\
    \ is for the main test condition to become \n\nfalse. \n\n The special commands\
    \ break and continue offer an optional side exit from all the looping \n\nconstructs,\
    \ including while, do-while, and for: \n\n The break command exits the innermost\
    \ loop construct that contains it. \n\n The continue command skips to the end\
    \ of the current iteration of the innermost loop \n\nthat contains it. \n\n Example(Break):-\
    \ \n\n<?php\n\n $i = 0; \n\n while ($i<100) \n\n { \n\n if ($i> 6) \n\n break;\
    \ \n\n echo $i; \n\n $i=$i+1; \n\n } \n\n?>\n\n Example(Continue):- The following\
    \ code prints the number 0 to 9, except 5. \n\n<?php\n\n for ($i = 0; $i<10; $i++)\
    \ \n\n { \n\n if ($i == 5) \n\n { \n\n continue; \n\n } \n\n echo $i;  } ?>\n\n\
     CHAPTER 6: ARRAY IN PHP\n\nArrays\n\n An array is a single variable that can\
    \ hold more than one value at once. \n\n You can think of an array as a list\
    \ of values. \n\n Each value within an array is called an element, and each element\
    \ is referenced by its own index, which is unique to that array. \n\n To access\
    \ an element’s value — whether you’re creating, reading, writing, or deleting\
    \ the \n\nelement — you use that element’s index. \n\nFor example, the first element\
    \ has an index of 0. the second has an index of 1, and so on  Associative arrays\
    \ \n\nWith associative arrays, each element is referenced by a string index. \n\
    \nFor example, you might create an array element representing a customer’s age\
