- raw: 'After taking a few moments to celebrate, René retreats to her office and sits
    down. A scene from her childhood plays on a loop in her mind.


    Her father, a police officer, trying to teach her math at the kitchen table: “You
    must learn math and then computers. You can be an accountant, a nice office job.”
    She put her forehead on the kitchen table over her folded arms, trying to ignore
    him.


    Now she repeats the gesture on her office desk. What would her father, the police
    officer, think if he knew what she was doing?


    Sig taps on the door and walks in. René looks up.


    “How should we split it?” he asks. “You decide.”


    Typically, everyone in the office gets a piece of the ransom. It is a team effort,
    and if one goes down, they all go down.


    “Evenly, just like all the others,” she says. “It will keep them from fighting.”


    “Are you sure?”


    “Yes. This isn’t going to be the last one, is it?”


    Sig smiles. All of their previous hacks had targeted companies and ransomed institutional
    data. This is the first time they have gone after a prominent individual. They
    hadn’t so much deployed ransomware as they had committed blackmail, without the
    thinly veiled guise of offering cybersecurity services. TechSolu is about to pivot
    into a much more dangerous and much more lucrative business model.


    **That night, they go** out to one of René’s favorite clubs. She gets everyone
    cherry ChapStick-flavored cocktails. It’s ’80s night. René twirls with her colleagues
    to New Order’s “Blue Monday,” Depeche Mode, Prince. Sig sits in a corner, watching,
    sketching on his napkin.


    He hadn’t expected this. He likes it, that they have brought in so much money.
    But now there is René, the center of attention. A master criminal after just a
    few hours of work. With nothing more than a proficiency in PowerPoint and a God-given
    gift of talking to people she has all of TechSolu’s employees spinning around
    her like satellites.


    Sig realizes he no longer has control of the situation. He doesn’t like this.
    He smiles at René, a big, sincere grin. She flashes one back, tipsy as she is,
    for a beat too long.


    *He’s so handsome*, she thinks, as a Guns N’ Roses song comes on. “Welcome to
    the Jungle.” *Such a good smile* he has.


    *Such nice teeth*, she thinks.


    Like a vampire.


    ## **10.**


    ## The Medium


    **Charlie Mack has been working** nights and weekends to prepare for the public
    disclosure of what happened at NOW Bank.


    When the company was breached and the rumors reached the media, it was a fucking
    free-for-all. People could talk and talk and talk about what they thought had
    gone down without knowing a thing. It was the not knowing that led to ridiculous,
    random speculation. That’s why lawyers are so necessary—because disclosing the
    truth can dispel all their bullshit in one blow.


    This propensity toward rumor-mongering was endemic to the field of security, including
    at Charlie’s previous position at the CIA. Just before coming to NOW Bank, Charlie
    left his spy job, where he was stationed in Benghazi, Libya. He left right before
    the deadly attack on the compound there. Charlie Mack knows all about the dangers
    of speculation.


    In NOW Bank’s case, there are rumors that entire books of asset management clients
    have been snatched and that the hackers have control of high-speed trading platforms,
    that they could have taken down the bank or the whole financial sector itself.


    There are rumors that “they” are Chinese spies, sent in to monitor each and every
    activity of the bank. Or possibly Russians trying to get the financial information
    of either enemies or friends of Vladimir Putin. These rumors are mostly ludicrous
    but, like the best lies, contain a kernel of truth.


    Some of the rumors, Charlie knows, have been spread around to various media contacts
    by Raykoff himself. In fact, there have been a few laudatory profiles in selected
    media outlets of the strong and tough military men the bank has hired.


    But the positive coverage hasn’t helped Raykoff. It became apparent to Charlie
    early in the investigation of the breach that Raykoff couldn’t handle the pressure.
    He was replaced by Prem, first nominally, then literally, through an organizational
    shift.


    Raykoff will eventually be moved into a more suitable job doing government relations
    work. Soon after that, he’ll be reporting to Prem.


    **But for now, Charlie** does what he does best. Saves the world, his world anyway,
    with intense attention to detail and an encyclopedic knowledge of cybersecurity
    law. The purpose of the disclosure is to spell out what happened as clearly as
    possible for the public while maintaining some degree of dignity for the bank.
    The disclosure will divulge most of the known knowns, a few known unknowns, and
    virtually no unknown unknowns.


    Most of the latter two categories fall under law enforcement, and those enforcement
    professionals have the unenviable task of disclosing what must be disclosed to
    the public while leaving undisclosed the information that the Department of Justice
    wants to keep for itself to tout its own accomplishments.


    Charlie takes a deep breath.


    The “northern Italians” responsible for Venice are two Israelis and one Russian
    Israeli. They will be apprehended by the FBI and placed under arrest soon. There
    is a fourth guy, a mystery man named Tony Belvedere, who has been laundering money
    through Newark and Manhattan for the trio. This information will be kept under
    wraps. It is not for the bank to disclose.


    **The communications team is** working alongside Charlie on a disclosure to media.
    To reaffirm the bank’s commitment to cybersecurity, to maintaining the privacy
    and integrity of its customers’ accounts.


    It’s Sunday and Charlie is wearing a pink button-down shirt, cargo shorts, and
    open-toed sandals. He’s just returned from a short vacation to the Caribbean.
    He’s trim and tan and looks more like a teenager coming back from spring break
    than a corporate lawyer. He talks in between document reviews to the other two
    workers who are there, Caroline and Frances, the communications lead.


    Charlie is bored. He loved being a spy. In that job, he got to go to exotic places,
    do exciting things, know everything before it happened. Before it was disclosed.
    If it ever was disclosed. Benghazi. Malta. Morocco. Romania. He loves knowing
    secrets and, even more than that, keeping them. But he’s a dad now with two young
    daughters. So no more spy stuff. This is as close to his old life as it gets for
    Charlie. The thrill of knowing a little inside info before it hits the press.


    The fact is that all the rumors are vaguely true, they just aren’t specific to
    Venice.


    Did Chinese hackers get into the bank to steal all its secrets? Yes, but that
    was a while ago.


    Are Russians trolling bank networks looking to grab information on Putin’s “friends”
    and enemies? Sure. Just not in this particular case.


    There are more important questions emerging from this particular breach. Are any
    of these things a matter of national security? Could the bank hold its own against
    fully funded international armies? Should it even be expected to?


    The bank’s relationship with its government “partners” is complex. For one thing,
    its government counterparts don’t have the capabilities to truly help against
    these bigger, badder enemies, no matter what the various agencies claim. For that,
    they would need full visibility into bank networks. But the bank does business
    in many countries, not just this one. Giving the government that visibility would
    alienate a lot of important customers.'
