    But today, despite the excitement of what’s to come, she is really tired and really
    pregnant. She is a short, petite woman, and being really pregnant is no joke.
    It means serious balance issues. It means almost constant trips to the bathroom.
    And to her, it means worrying about her job because it seems like women in the
    department run by `Bob Raykoff` are being “managed out.” That is the euphemism
    in corporate speak for an unspoken but established technique of making one’s work
    life so unpleasant and unrewarding that one will want to resign voluntarily, thus
    saving the company severance pay and possible litigation. In her opinion, Bob
    is a jerk, but not of an outstanding type. This is a standard work challenge,
    endured by women all over the world, one she’s helped many of her employees through
    and one she intends to weather with dignity.


    But it’s hard. The sighs and wan smiles from people who know she’s not coming
    back from maternity leave wear her down. So do the congratulations, both parties
    understanding that she’s just forfeited her bonus for the year. This is Caroline’s
    second time through this, which is a blessing and a curse. When it’s your first
    baby, everyone around recalibrates their expectations because they know your loyalties
    are going to be split in a most significant way. *How will she make my project
    her priority with a baby to worry about?* God, she hated that.


    She’s comforted because she has her network to lean on. Her former boss, `Joe`,
    the Kool-Aid Man, has moved on to a job at an insurance company. Nice and safe
    out in central New Jersey.


    Another of her charges, `Frances`, the woman she prepared a care package for when
    her house burned down, gets Caroline an offer from a consulting firm. It would
    be a huge raise. She turns it down, knowing that what she wants next is something
    a little quieter.


    She tries to tell the kids at the hack-a-thons that the trope of a morally tormented
    genius like `Mr. Robot` couldn’t be further from the truth. Most people in this
    field are just normal, average Joes. Some are even mom types, sitting there, organizing
    the program, making sure everyone’s on time and under budget. Getting into the
    field and getting good at it won’t make you cool if you weren’t cool to begin
    with. And that’s OK. Cool people are frequently unreliable.


    When Caroline had her first child, she was 35. She’s now almost 40. Just before
    giving birth that first time, her doctors discovered a significant and possibly
    deadly tumor on her thyroid. She brought the baby, a boy, to term, underwent a
    C-section, and then immediately went into surgery to have her tumor removed on
    the same day.


    She endured cancer treatment while raising her newborn. Then she went back to
    work at `NOW Bank`.


    And today, she has some government wonk, high on the scent of his own gas, suggesting
    that her nearly 20-year career in cybersecurity is over? Caroline would use her
    significant influence to ensure that `Prem` takes `Raykoff`’s job, and `Raykoff`
    gets demoted and shuttled into a less influential—and far less risky and damaging—position
    before she departs. It will be one of her final acts at `NOW Bank`.


    Caroline is sad, but she isn’t afraid.


