- raw: 'Victor has an important point. For so long, worries about the damage hacking
    may cause us have been pointless and arcane. Why would somebody bother hacking
    a pacemaker? Why would a foreign nation risk a kinetic, guns-blazing war by meddling
    with our power grid?


    Victor knows it’s not the grandiose plots and huge explosions that should concern
    us but the gentle tide of insecurity that has been rolling in for 20 years. The
    little bits of erosion that, over time, change absolutely everything. The slow
    march on our infrastructure, dams and electric grids and wireless fidelity, that
    has been underway for decades.


    ## **21.**


    ## The Spaniard


    **These days Dieter Reichlin is drinking** coffee by the gallon. Sig Himelman’s
    life has turned into a real-life soap opera. He is ashamed of himself, but he
    can’t get enough.


    It’s the summer of 2016 and the Russians are pulling all kinds of crazy shit on
    the Americans. It’s been a roller-coaster ride from Dieter’s recliner in Helsinki.


    Fucking bad passwords. That’s how easy it is to break into an American political
    party, he muses. No problem for even a nontechnician.


    Then there’re the simmering resentments, the complacency of social media, the
    utter disregard for technical privacy, the racial issues, such an enticing treat
    for a good social engineer. A hot cauldron of fuckedupness that Dieter suspects
    will play out well after November, but, he is confident, there is no way Trump
    can win.


    Dieter is trying to come up with a new topic for a Norwegian magazine for which
    he occasionally writes. He wants to take on the attacks by Anders Behring Breivik,
    but with a twist: cyberterrorism. How the next mass attack may be carried out
    by cyber means. He doesn’t know where to start. For one thing, it’s not terribly
    feasible, but the assignment is high profile and he wants to make it work.


    So he procrastinates by flipping open his window into Sig’s world, where something
    weird is unfolding. Something far more interesting. Something that started early
    in the morning yesterday, even earlier in Romanian time.


    Sig has been using a tracking service to ping a cell phone, then a computer. It’s
    unclear if they belong to Sig, and Dieter is intrigued momentarily. Both keep
    coming back with the location right there in Arnica Valka. Then silence for one
    hour.


    Then Sig tries logging into a Bitcoin wallet. The balance is zero. Silence for
    another hour.


    Then chaos. Twenty email messages, some of them checking on business deals. Others
    plying new women from Craigslist. Lonely hearts stuff. Sig is going above and
    beyond his usual charm, and all before 8 a.m.


    Then Sig creates a new email address, HRH13023@romamail.ro. Then a message to
    an email address Dieter hadn’t yet seen. One that makes him sit up in his seat.


    R.Kreutz@ram.college.ro


    I don’t know where you are but please I beg that you forgive me. I don’t know
    why you would leave but I am so worried about you and about dear Henry. You both
    are everything to me. I am not upset. I love you. Please come back and things
    can be the way they were.


    Dieter leans back in his seat. René Kreutz. Henry. Things had just taken an unexpected
    turn to say the least.


    He thinks for a while. Walks to the fridge and grabs a tomato sandwich. Thankfully
    there is some egg salad left from the previous evening. He piles that on top of
    the sandwich, making a small mountain. He puts on another pot of coffee before
    going back to the Sig Himelman show.


    Next Sig creates another new email address. RomanianLad991@romamail.ro. He uses
    this to email what appears to be another lonely heart from Craigslist.


    I am terribly sorry to hear what happened to you in Marrakesh in 2011. You can
    email me here from now on at my real address. I have a good friend, a Russian
    friend, who was injured in the same blast, if you can believe it! I know you are
    Muslim and so are probably not interested in a man like me, someone who is not
    Muslim. But you are so beautiful. And so pure. So divine. I have spent the past
    week thinking of nothing but you. It’s hard to work, hard to even think clearly.
    I think the fact that my friend was injured there and you are too is a sign that
    God is bringing us together. God or Allah or however we refer to Him at a given
    moment.


    I know somebody who could help get you a passport here. As I said, I own a successful
    company and I am looking for a secretary. But more importantly, I am looking for
    a companion, someone to share my big house with, spend money on. Somebody to love
    and who will love me in return. I have had a hard life too, but that makes times
    like these even sweeter. I have been unlucky in love. I was scammed by my last
    wife, she stole so much money from me. But I have hope that someone as pure as
    you could bless my life and change these views.


    It’s so bizarre. Dieter can’t quite make sense of what is happening.


    “Did you pile egg salad on top of that?” his wife’s voice intrudes on his spying.
    “That’s not how it’s supposed to work. Mikael Blomkvist would never do that.”
    She is referring to the male, middle-aged hero from *The Girl with the Dragon
    Tattoo*.


    “Blomkvist? No, no, no, I am Lisbeth Salander!” Dieter sucks in his stomach in
    imitation of the novel’s slender young female hero and hacker extraordinaire.


    “You couldn’t hack your way out of a paper bag. And you’ve gotten fat on top of
    it.”


    Dieter smiles, aware as he is that sharp barbs like this mean sex might be around
    the corner. It adds another level of intrigue to this strange morning.


    “Well,” he says, choosing his words carefully, “you’re an accountant. You’re not
    even part of the narrative.”


    His wife throws her head back and feigns laughter. A hearty do-not-wake-the-babies
    laugh.


    “Read this,” he says.


    She does. He has shared with her many iterations of the Sig show, of which she
    disapproves. She sips her coffee again. Raises her eyebrows dismissively.


    “Typical. Dangerous for her, if her passport is on the line. He got her involved
    in his illegal shit, then tied her down with a baby. That’s terrorism. Of the
    domestic type. Imagine what else he feels entitled to?”


    She gets up. One of the children is calling for her. She flicks her nearly white
    hair in his direction as she walks away.


    Dieter is satisfied. He has an answer. He has his thesis for his article. And
    he will be having sex tonight.


    **René doesn’t sleep until** they get to Munich. They stopped once in Hungary.
    She has never been there and has always wanted to visit. She believes, but can’t
    recall for certain, that she has family here.


    She looks everywhere for Sig. But he is nowhere. He’s sent a message to her email
    address, a short one. She ignores it.


    In Munich, it’s nighttime again. They have been traveling for 24 hours. Henry
    is bubbly and talkative in his carrier. It’s much colder here, so she buys him
    a cap with some of her remaining cash. She briefly considers finding a hotel,
    but something tells her to keep going. She doesn’t like the weather. The people
    look too straitlaced. She imagines they can tell she’s a criminal. She sees the
    next train from Munich terminates in Malaga, Spain.


    Probably warmer there. She speaks some Spanish. It’s close to Gibraltar, she knows.
    A tax haven. So probably some criminals around. She wonders if she will always
    only be comfortable in the company of criminals.


    She tries to ask the teller in German whether it’s nice in Malaga this time of
    year. The teller answers her in English. “Oh, I believe it’s to be twenty-one
    degrees Celsius and sunny tomorrow.”


    Malaga it is.


    ## **22.**


    ## The Project Manager


    **In Malaga, René Kreutz finds a** one-bedroom attic apartment. It’s modest, but
    has a beautiful deck with flowers and sunset views. The house is owned by a Muslim
    family too busy with their own children to pay any attention to what she and Henry
    are doing.


    She starts applying for jobs. She withdraws little bits of the Bitcoin money at
    a time. She keeps to herself. Talks to no one.'
