  trans: '

    Victor 有一个非常重要的观点。长期以来，对黑客攻击可能造成的损害担忧一直是徒劳且晦涩的。为什么有人会费心入侵心搏器？外国国家为什么要通过干涉我们的电网来冒风险一场枪火激烈的动能战争？


    Victor 清楚，我们应该关注的不是那些宏大的阴谋和巨大的爆炸，而是 20 年来一直席卷而来的不安全感潮汐。那些微小的侵蚀随着时间的推移，会改变一切。这种对我们基础设施、大坝、电网和无线网络的缓慢渗透，已经持续了数十年。


    ## 21. 那个西班牙人


    这些日子，`Dieter Reichlin` 一加加地喝着咖啡。`Sig Himelman` 的生活变成了一场现实版的肥皂剧。他感到很羞愧，但他欲罢不能。


    那是 2016 年的夏天，俄罗斯人正对美国人采取各种疯狂的手段。从 Dieter 在赫尔辛基的扶手椅上看，这就像是一场过山车之旅。


    该死的弱密码。他沉思，入侵一个美国政党竟然如此简单。即使对于非技术人员来说也没有问题。


    接着是酝酿的怨恨、社交媒体的自满、对技术隐私的完全无视、以及种族问题——这些对于一个优秀的社会工程师来说都是极具吸引力的诱饵。这是一个充满混乱的火炉，Dieter
    怀疑这在 11 月之后会有很好的结果，但他坚信，`Trump` 绝不可能赢。


    Dieter 正在尝试为他偶尔撰稿的挪威杂志想一个新主题。他想挑战 `Anders Behring Breivik` 的攻击，但要有一个转折：网络恐怖主义。下一次大规模攻击可能如何通过网络手段实施。他不知道从何处开始。一方面，这并不怎么可行，但这项任务非常很高，他想让它成功。


    于是，他通过打开通往 Sig 世界的窗户来拖延时间，那里正在发生一些奇怪的事情。一些有趣得多的事情。这从昨天一早就开始了，罗马尼亚时间甚至更早。


    Sig 一直在使用一种追踪服务探测手机，然后是电脑。目前不清楚这些设备是否属于 Sig，Dieter 曾短暂地产生了兴趣。两次返回的定位都在 `Arnica
    Valka`。然后是沉默了一个小时。


    接着 Sig 尝试登录一个 `Bitcoin` 钱包。余额为零。又是沉默了一个小时。


    然后是混乱。二十封邮件，其中一些是在跟进生意交易。另一些是在 `Cralist` 上搭讪新女性。都是些孤独单身者的琐事。Sig 付出的努力远超他平常的魅力，而这一切都发生在早上
    8 点之前。


    接着 Sig 创建了一个新的电子邮箱地址，`HRH13023@romamail.ro`。然后向一个 Dieter 尚未见过的邮箱地址发送了信息。那封邮件让他坐直了身体。


    `R.Kreutz@ram.college.ro`


    “我不知道你在哪里，但请我求你原谅我。我不知道你为什么要离开，但我我很担心你和亲爱的 `Henry`。你们俩对我来说就是一切。我没有生气。我爱你。请回来吧，一切可以回到从前。”


    Dieter 靠在椅子上。`René Kreutz`。`Henry`。至少可以说，事情刚刚发生了一个意料之外的转折。


    他思考了一会儿。走到冰箱拿了一个西红柿明治。谢天地，昨晚还剩了一些鸡蛋沙拉。他把沙拉堆在明治上，堆成了一座小山。在回到 `Sig Himelman` 的节目之前，他又煮了一壶咖啡。


    接着 Sig 创建了另一个新邮箱地址。`RomanianLad91@romamail.ro`。他用这个地址给另一个似乎来自 `Cralist` 的孤独单身者发了邮件。


    “一听到你在 2011 年在 `Marrakesh` 发生的事情，我非常难过。从现在起，你可以通过我的真实地址给我发邮件。我有一个好朋友，一个俄罗斯朋友，他在那次爆炸中受伤了，如果你能相信的话！我知道你是穆斯林人，所以可能对我这样的男人不感兴趣，一个不是穆斯林的人。但你是如此美丽。如此纯洁。如此神圣。过去的一周，我的脑子里只有你。工作很难，甚至无法清晰地思考。我觉得，我的朋友在那里受伤了而你也是，这是上帝正在将我们聚在一起的信号。上帝，或真主，或者取决于我们在特定时刻如何称呼祂。”


    我认识一个可以帮你找到她的人。

