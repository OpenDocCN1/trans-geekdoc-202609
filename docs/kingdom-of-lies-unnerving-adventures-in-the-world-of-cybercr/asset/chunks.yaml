  trans: '


    上班第一天，蕾妮（René）就帮助四位“客户”将比特币传输到 TechSolu 持有的数字钱包中。她在电话中谈到的几位高管心急如焚。西格（Sig）解释说，这些高管之所以愤怒，是因为他们在交钱之后才发现如何解决网络安全问题。


    她很快就上手了。TechSolu 主楼层的员工都是黑客，而且毫无道德可言。他们闯入美国和欧洲的公司，冻结他们的重要文件，并要求支付费用以换取能够解锁这些文件的数字密钥。除了数字密钥，TechSolu
    还会提供一份实用的 PowerPoint 演示文，教他们如何防止像他们这样的黑客再次发生同样的事情。她的一个同事有时也会接电话，向高管们解释他们错在了哪里。


    尽管感觉像咨询公司，但很明显，西格和团队其他人都是网络犯罪分子。TechSolu 的业务模式是勒索软件。


    但他们现在就在这里，在一个完全正常的办公室里，蕾妮非常喜欢这里。他们提供一些医疗福利。那里有一张足球桌。蕾妮将犯罪因素合理化了。*网络犯罪和“普通”犯罪不同*，她想。*你必须足够聪明、老练才能办成这件事。而且，没有人受伤，至少在身体上没有。*


    她有时会得到一笔丰厚的现金奖金。每隔，她会将一些现金扎成小捆贴在办公室办公桌底下。以防万一。


    ### 增长与策略


    蕾妮在计算机技能上的短板用街头智慧来补。她很快迷上了客户服务。每天，她都会与焦虑的男士女性交谈，安慰他们，并解释他们被黑客了，只需支付少量费用即可立即恢复数据，并可以确保不再再次发生。


    这些“客户”通常会从哀求、哭泣、有时尖叫转变为感谢她。有些人甚至说，那些钱——通常只有几百美元——对于找回文件并确保再也不发生这种情况来说，是微小的代价。


    蕾妮很快发现，General Maleur 上所有的科技初创公司都专门从事勒索软件或类似的工作。在韩国茶店上方，有一家公司入侵美国零售商的数据库并盗取信用卡号。在
    Americain 咖啡馆旁边，另一家公司购买这些信用卡号，并制造可以像真卡一样工作的假信用卡。他们雇佣骡人去购买可以轻松转手并出售的商品，从而从非法信用卡交易中产生“干净”的现金。


    ### 运营规模化


    西格曾说会把蕾妮在 City Italia 的薪水增加三倍，他是错的。事实上，她的收入是她在餐厅时收入的四倍。她退出了社区学院，但利用在课上学到的知识让 TechSolu
    的 PowerPoint 演示文变得更美观、更易读。很快，蕾妮就开始优化 TechSolu 的勒索软件勾当。


    她为被黑客的客户创建了一个更有说服力的屏幕。屏幕不再是在黑底上用绿色字体显示“你被黑了！”。现在，一个更微妙、几乎让人感到安心的消息出现在全白的背景上：


    抱歉打扰您，但您操作系统中的一个漏洞导致黑客干扰了您的运营。您的文件已被冻结，但您有多种方法可以将它们恢复。


    她为客户创建了一个选项菜单，这让 TechSolu 在短短几个月内将利润率提高了 20%。大多数客户支付的赎金大约只有 `$300` 或 `$400`，但有了新菜单，有些人支付了超过
    `$1,000`。客户可以选择快速支付以获得折扣，或者等待并面临不断增加的金额。如果他们不在规定时间内付款，他们的文件将被销毁。他们还可以额外付费获取最新最先进的
    PowerPoint 演示文。在某些情况下，蕾妮说服客户实际上允许 TechSolu 的黑客访问其整个网络以进行合法的渗透测试。西格提拔了她，给她加了薪，并给了她一个独立的玻璃办公室。


    ### 目标


    不久后，蕾妮发现了一个目标。目标是一个位于旧金山的公司。西格说这个目标值得大笔钱。蕾妮开始研究这个公司。西格说他们可以信任他。蕾妮想，*这需要很聪明了*。西格走进蕾妮的办公室。西格说：“这个目标值一百万美元吗？”楼上的黑客们欢呼起来。西格走进了蕾妮的办公室。


    西格说：“做吧。”


    ### 执行


    西格给了她一个私人电话号码。蕾妮开始写信息。西格说他们可以信任西格。蕾妮的电话响了。她没有接。又响了。她还是没接。“接电话！”有人大喊。她还是没理。


    蕾妮的电话响了。是 `WhatsApp`。


    “你好？是卡特琳吗？”


    “是我。”


    “我想问问你们的粉碎服务费用是多少？”


    “目前的报价是 `200 Bitcoin`。”


    “那超过了一万美元。”


    “是的，”她说。


    “在你们的服务之后……文件会被完全销毁吗？”


    “是的。如果你需要，我可以写成书面发给你——”


    “不！不！这样就行。毕竟，如果你不守信用，没人再付你的钱了，对吧？”


    “是的，先生。”


    长久的沉默。“你的声音很好听。你是哪里人？他们付你多少钱？我打赌你很想在美国工作。H-1B 签证很难办，但我只想让你知道我爱女性。我尊重她们。”


    “我确定如此，先生。如果你在十分分钟内不付款，价格将涨到 `300 Bitcoin`。我会通过 `WhatsApp` 向你发送汇款详情。祝你有一个愉快的夜晚！”


    她挂了电话，满头大汗。她转过身，可以看到楼上所有的黑客正透过办公室的玻璃墙看着她。


    手机又响了。她没理。又响了。她还是没理会。


    这时，隔壁西格办公室传来了细微的叮叮声。在死寂的氛围中显得格外清晰。接着，西格的声音响彻整个办公室，用德语说道：“*Oh mein verdammter Gott*。”


    我的老天。


    他清了清嗓子，走出办公室，谦虚地宣布：“确认：首付 `200 Bitcoin`。”


    130 万美元。


