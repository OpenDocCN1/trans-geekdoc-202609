  trans: '

    ## 后果


    此外，许多政府员工正跃跃欲试，想要通过其他类型的违规行为让银行陷入麻烦。这可以为他们赢得很多社会声望、晋升，或者最重要的是，在某些大型咨询公司获得一份薪水不错的工作。谁知道呢，也许他们中真的有人在乎正义。因此，如果银行一遇到问题就引入政府机构，那么银行将受到监管机构的惩罚、媒体的猛击，并浪费本可以花在实际安全工作上的大量时间和金钱。


    一切都是复杂的。没有哪件事是显而易见的。查理最了解的、他比任何事情都更信任的，就是人类智能。


    银行、整个网络安全团队——该死，整个网络安全行业——太过度依赖数据分析。“大数据”。海量信息流涌入银行狭小的服务器瓶颈，由“人工智能”引擎解析，然后由大学毕业仅两年的孩子解读成电子表格或
    PowerPoint 演示稿。


    在查理的经验中，这些事事对解决日常问题很有用，但从长远来看毫无意义。它们并没有“解决”任何问题。


    *真正*产生影响的是在现场、在战壕中，正在犯罪、解决犯罪或监控犯罪的那个男孩或女孩，他们能够揭示真实的问题以及可能的解决办法。我们面对的是什么的人？是什么驱动着他们？其他都只是文字游戏。查理应该很清楚。他是律师。


    这就是他爱着卡罗琳的原因。她知道人为因素的价值。这就是为什么她雇佣了那么多前间谍员。


    披露内容将如下所示：


    > *2014 年 8 月 5 日，我们发现一组犯罪分子入侵了我们的服务器，窃取了 8700 万 NOW 银行客户的个人详情，包括姓名、社会安全号码、地址和电话号码。我们正与执法部门合作调查此事，结果是，无法完全披露调查的某些细节。*


    后续还有更多内容。但这样很好。简洁、直接、直击要点。充满了清晰、安全的“已知之知”事实。


    他是在骗谁呢？人们会惊坏掉的。


    到 2015 年情人节时，NOW 银行所有负责网络安全工作的人都在寻找新工作，如果他们还没有离职的话。奖金将在几周后发放。在那之后，真正的离职潮将开始。


    他们在忍受威尼斯之苦工作时，都被承诺了高得薪水和巨额奖金。但这两者都没有实现。许多参与者认为，这是因为雷科夫（Raykoff）得罪了太多人，他们正在对他施压，以便为开除他提供理由。他们中许多对银行内部运作不熟悉的新手忘记了自己工作在一个成本中心。而一旦你发现自己处于成本中心，你就永远处于成本中心。


    雷科夫今天很忙。他正会见一些大人物。SOC（安全运营中心）的一一些行政人员被敲门声惊扰。那是一个男人和一个女人，两人都戴着耳机，后面还站着另一个男人。他们看起来很有身份。


    “我们……在找比尔·雷科夫？”那个没带耳机的男人问道。


    秘书回答道：“是的，他在楼上。我现在可以你们进去。”

