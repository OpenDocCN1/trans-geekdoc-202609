- raw: "\n\n**KINGDOM OF LIES**\n\n# **KINGDOM OF LIES**\n\n**UNNERVING ADVENTURES\
    \ IN THE WORLD OF CYBERCRIME**\n\n**KATE FAZZINI**\n\n![image](images/img_pub.jpg)\n\
    \n*For Noah and Zahra*\n\n*This work of mine, the kind of work which takes no\
    \ arms to do,  \n\nIs least noble of all. It’s peopled by Wizards, the Forlorn,\
    \  \n\nThe Awkward, the Blinkers, the Spoon-Fingered, Agnostic Lispers,  \n\n\
    Stutterers of Prayer, the Flatulent, the Closet Weepers,  \n\nThe Charlatans.\
    \ I am one of those. In January, the month the owls  \n\nNest in, I am a witness\
    \ & a small thing altogether. The Kingdom  \n\nOf Ingratitude. Kingdom of Lies.\
    \ Kingdom of* How Dare I.\n\n— LUCIE BROCK\\-BROIDO\n\n## Contents\n\n[**Before:\
    \ The Swallows**](#before.html#bef)\n\n*Where we are introduced to some of the\
    \ landmark events that set the stage for the book*.\n\n[**Preface: Kingdom of\
    \ Lies**](#preface.html#pre)\n\n*Where we learn about the variety of lies we will\
    \ encounter on our journey*.\n\n[**1. The Futurethreat**](#chapter_01.html#ch1)\n\
    \n*We look back to the early days of some of the people perpetrating cyberthreats\
    \ and their opposites in this book*.\n\n[**2. The Charlatan**](#chapter_02.html#ch2)\n\
    \n*Where we learn that the upshot of a major cyberattack against the financial\
    \ sector is that cash-strapped cybersecurity executives see a budget increase.\
    \ But even a hiring spree has its downsides*.\n\n[**3. The Wall**](#chapter_03.html#ch3)\n\
    \n*Where we meet some of the criminals who are attacking the financial sector\
    \ and witness the uphill battle facing large organizations as they try to respond*.\n\
    \n[**4. The Baby**](#chapter_04.html#ch4)\n\n*Where we consider how a long-term\
    \ strategy, by Russia and others, to tacitly allow cybercrime in exchange for\
    \ the information and expertise of their criminals may bear strange fruit*.\n\n\
    [**5. The Italians**](#chapter_05.html#ch5)\n\n*We begin to see how the cybercriminal\
    \ world, devoid of physical borders, and media misinterpretations of cyber events\
    \ inform and misinform our view of cybercrime*.\n\n[**6. The Gig Economy**](#chapter_06.html#ch6)\n\
    \n*We meet more hackers and see how some have managed to convert their cybercriminal\
    \ expertise into legitimate work. Though many find it hard to leave their old\
    \ ways behind*.\n\n[**7. The Tryout**](#chapter_07.html#ch7)\n\n*We learn how\
    \ banks and nation-states strategize to capture the best up-and-coming hackers,\
    \ from New York to China and in between*.\n\n[**8. The Father**](#chapter_08.html#ch8)\n\
    \n*We see how hackers struggle with the pains of life, including parenthood, death,\
    \ and even getting hacked themselves*.\n\n[**9. The Teenager**](#chapter_09.html#ch9)\n\
    \n*In Romania, we watch as a young university student makes a foolish teenager’s\
    \ gamble, with a twist*.\n\n[**10. The Medium**](#chapter_10.html#ch10)\n\n*We\
    \ discover the long history of connections between intelligence work, foreign\
    \ influence campaigns, and how kinetic misinformation has gone digital*.\n\n[**11.\
    \ The Lovers**](#chapter_11.html#ch11)\n\n*Again in the Transylvanian countryside,\
    \ we discover it may be too late for a teenager in a small town who has gotten\
    \ in way over her head in the cybercriminal underground*.\n\n[**12. The Researcher**](#chapter_12.html#ch12)\n\
    \n*We meet a hacker for hire who is one of the good guys, as he follows an intriguing\
    \ lead from Helsinki to Bucharest*.\n\n[**13. The Volunteers**](#chapter_13.html#ch13)\n\
    \n*Criminals don’t always offer themselves and their skills willingly when their\
    \ governments come knocking—and this creates an intriguing conflict*.\n\n[**14.\
    \ The Mother**](#chapter_14.html#ch14)\n\n*Even hackers must sometimes answer\
    \ to one of the world’s most powerful forces: mom*.\n\n[**15. The Ghost**](#chapter_15.html#ch15)\n\
    \n*People, machines, and companies all are haunted by the past, whether it is\
    \ a traumatic event, a bad merger, or an executive clash. This is how some cope.\
    \ Or don’t*.\n\n[**16. The Recruiters**](#chapter_16.html#ch16)\n\n*Where we ask,\
    \ in what direction does a young hacker go when he or she wants to grow up and\
    \ get a real job? Considering the overwhelming lack of professionals currently\
    \ working in the field, there is a space for everyone*.\n\n[**17. The Insider\
    \ Threat**](#chapter_17.html#ch17)\n\n*Intelligence professionals make up a significant\
    \ portion of cybersecurity staff today. How hard is it to journey from intriguing\
    \ foreign fields to the sober offices of corporate America?*\n\n[**18. The Terrorist**](#chapter_18.html#ch18)\n\
    \n*What happens when criminals don’t cooperate with their demanding governments\
    \ but choose a transnational terrorist organization to latch on to instead*.\n\
    \n[**19. The Long Trip**](#chapter_19.html#ch19)\n\n*Even for cybercriminals,\
    \ it’s possible to go down a better path, and sunlight—in limited quantities—provides\
    \ the best disinfectant*.\n\n[**20. The Reason**](#chapter_20.html#ch20)\n\n*Why\
    \ do cybercriminals do what they do? We learn that maybe it doesn’t fucking matter*.\n\
    \n[**21. The Spaniard**](#chapter_21.html#ch21)\n\n*Where we learn that in the\
    \ cleansing sunshine of Malaga on the Costa del Sol, even cybercriminals who think\
    \ they’re irredeemable can get a second chance*.\n\n[**22. The Project Manager**](#chapter_22.html#ch22)\n\
    \n*In the end, no matter where you come from, what crimes you’ve committed, or\
    \ how many lives you’ve saved and what titles you’ve acquired, you’re really just\
    \ a glorified project manager*.\n\n[**23. The Reporter**](#chapter_23.html#ch23)\n\
    \n*Where we see our sole representative from media struggle to come to terms with\
    \ the fact that, to paraphrase Thomas Wolfe, sometimes you leave the SOC and sometimes\
    \ the SOC leaves you, but you can’t go back to the SOC again*.\n\n[**Epilogue:\
    \ We Didn’t Start the Fire**](#epilogue.html#epi)\n\n*A reminder that there are\
    \ so many more stories left to tell*.\n\n[**Appendix A: Glossary of Cyberterms**](#appendix_a.html#appa)\n\
    \n*Where we are given technical material to induce restful sleep*.\n\n[**Appendix\
    \ B: Epilogue Explained**](#appendix_b.html#appb)\n\n*A brief journey among the\
    \ hacker nerds*.\n\n[**Sources**](#sources.html#sou)\n\n[**Author’s Note**](#author.html#aut)\n\
    \n[**Acknowledgments**](#acknowledgments.html#ack)\n\n[**Index**](#index.html#ind)\n\
    \n## Before\n\nThe Swallows\n\n**René Kreutz is only 15 years** old, but she’s\
    \ out drinking and dancing in a club on a Thursday after school, in the outskirts\
    \ of a mid-sized town in Romania.\n\nIt’s late 2013. They’re playing her jam.\
    \ Carly Jepsen’s “Call Me Maybe.”\n\nIt’s the kind of club where the bouncers\
    \ don’t let in too many guys over 18. So she feels safe. And anyway, she’s surrounded\
    \ by her girlfriends. Giggling. Drinking weak drinks.\n\nThey dance in a big circle.\
    \ Occasionally, one will enter the circle and do a particularly silly series of\
    \ moves, usually something inspired more by their ballet instructor than pop culture.\
    \ The song is the kind that forces you to bob and weave and shake your hair around,\
    \ and she does. It’s so loud, it’s hard for conversation, or really anything else\
    \ for that matter.\n\n*Hey, I just met you*.\n\nRené shout-sings along with the\
    \ song. She bobs her head left to right with an ear-to-ear smile. Her auburn hair\
    \ flies around, smacks her friend in the face. They laugh.\n\nAt the same time,\
    \ far away in China, a government-backed hacker named Bolin Chou, who has been\
    \ stealing intellectual property from U.S. companies for the bulk of his career,\
    \ has left his job. He is drinking a cheap beer in a Shanghai bar for expats,\
    \ having scored a new gig at a big hotel as a dishwasher. The bartender is glaring\
    \ at him and he knows he’ll be chased out soon, since he doesn’t fit in with the\
    \ more upscale, European clientele. He’s surprised they served him in the first\
    \ place.\n\nWith his cell phone, he uses the short time he has left to monitor\
    \ the computers of all the businessmen connecting to the bar’s unsecured Wi-Fi\
    \ network.\n\nHe contemplates the possibilities.\n\n*And this is crazy*.\n\nIn\
    \ Romania, René, who has never met someone from China, bobs left to right and\
    \ spins."
