  trans: '

    “他们可能会；这取决于情况。很大程度上取决于他们的员工，他们正盯着异常情况。但通常情况下不会，至少不是立即。这就是为什么你必须飞快完成下一个部分。塔林的那个‘骡子’拿着信用卡，等
    ATM 机装满的那天。他提着一个麻袋。晚上去，穿上合适的衣服，做一点伪装。他插入信用卡，输入一些数字，略低于 200,000 美元，ATM 就吐了出来。他用袋子遮住钞币出口并将其装满，然后离开。他们中有些人一天能拿走百万。”


    “获取凭证用什么类型的恶意软件？”


    “有一种叫 `August Malware` 的软件，针对 `Microsoft Word` 文档，对大多数银行来说很容易，但俄罗斯银行不是。还有 `Acecard`
    和 `GMBot`；两者都针对 Android 操作系统。” Dieter 无辜地耸了耸肩，但他知道罗马尼亚每个人都在用 Android，而且 Sig 正在密切关注这一点。


    Sig 现在正温柔地微笑，变得越来越醉了。他在脑中已经勾勒好了这一切。他厌倦了勒索软件——有太多其他组织参与其中了。这似乎是一个很棒的新步骤。而且他已经认识一个留着红褐色发的罗马尼亚女孩，她会是完美的“骡子”。


    Dieter 熟练地取出 `USB stick` 并将其放回口袋。他也感到更加放松了，部分是因为酒精的作用，另一部分是因为他的恶意软件诡计奏效了。起码，它没有被发现。而且他很快就要坐飞机回赫尔辛基了。


    他们谈论着一些浅层的话题。Sig 从没有提到过 René。Dieter 的每一句话都避开了他的妻子和孩子。他们转向了政治话题。法国即将举行的选举——Sig
    确定极右翼会赢。在美国总统大选中中，一位名叫唐纳德·特朗普的候选人（在 Dieter 看来他是一个电视明星）刚刚宣布他将竞选。


    “整件事会变得像动物园一样，这是我唯一知道的，”Dieter 说。Sig 醉醉地表示同意。


    “我不认为那个参选的女性会很受欢迎，”Sig 说，“看看俄罗斯人会做什么很有趣。他们最近非常活跃。”


    “是的，”Dieter 同意道，这次是真话。他看了看表。该走了。


    # 13. 志愿者


    **到 2015 年，任何在**网络安全领域工作——无论是犯罪分子、好人还是介于两者之间的人——都能看到俄罗斯人的异常活跃。他们忙得以至于培训黑客的速度不够快了。


    网络犯罪犯的需求量很大，特别是政府资助的情报机构。情报机构中有太多的黑客和参与网络犯罪的情报人员了，以至于那些知情的人也不确定确定他们面对的究竟是谁。


    这种活动在 2016 年美国总统大选前激增，但俄罗斯的参与者在地理位置、意识形态和背景方面非常分散，看起来并不像是一项协调一致行动。至少对于没有受过训练的人来说不是。


    到此时，已经没有所谓的“预备队”可以从中选拔热血勃勃的候选人进入俄罗斯的网络行动中了。招募已经采取了全新的角度。


