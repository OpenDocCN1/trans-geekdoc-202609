    Despite being up all night, `René` doesn’t feel tired in the slightest, nor sad,
    nor scared. Her blood is pure adrenaline. The pain in her jaw is gone.


    By 1 a.m. Bucharest time, she imagines `Sig` stumbling home. He won’t notice they
    are gone until he wakes up. This scenario is keeping her on edge. Imagining those
    first moments when he realizes she’s not there, has taken the money, and has left
    him for good.


    Will he come after her?


    She doesn’t think so. `Sig` values control above all things. If he knows she is
    no longer susceptible to his influence, he will simply cease to care about her.


    This is what she hopes.


    ## 20.


    ## The Reason


    “`Valery Romanov? Don’t know him. He’s in prison, you say?”


    “I was wondering if you had heard of him,” the reporter asks.


    `Victor Tanninberg` laughs. “Why would I hear of him? For the last time, I’m not
    a hacker!”


    His reporter friend sits on the corner of the bed in his small house. But that’s
    only because there is nowhere else to sit. Every square inch of his place is covered
    with computer parts and wires and tools. `Fox News` blares in the background.


    “So let’s go back to my original question then, because I’m writing a story on
    it. Is it possible to cut the brakes on a car remotely? To blow out the tires
    or depress the accelerator? Everyone says it’s possible, but nobody can demonstrate
    it.”


    `Victor` sits in a dark corner of the room, next to a fat rabbit named `Sam`.
    Both like to be close to the air conditioner.


    “Why would I do such a thing as cut brakes?” he says. “I would just lose customer.”


    “I’m not asking if you would do it. I’m asking if it’s possible.”


    “Why would I want to put myself in this kind of risk?”


    He gestures around the room. The reporter, named `Frances`, assumes he’s referring
    to the overflowing stacks of computers when he adds, “And give up all this?”


    His computers are not “computers” as a consumer might think of them. They are
    computers that control each car’s engine. Each of them is the size of a small,
    thick textbook. Accordingly, some are even filed like books on a bookshelf. The
    rest are.

