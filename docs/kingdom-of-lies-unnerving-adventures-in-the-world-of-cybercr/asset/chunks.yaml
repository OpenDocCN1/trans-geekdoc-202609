- raw: 'When Bo was young, his mother would tell him tall tales about the original
    Silk Road. It was a rare show of warmth on her part and one of his better childhood
    memories. One of his favorite tales was about the tradition of sand mandalas:
    elaborate, colorful sand sculptures made by Buddhist monks that, once completed,
    were destroyed in a religious ceremony.


    She would tell him of the shocked looks on the faces of Arabs and Jews and Europeans
    after witnessing this sight on their travels through Kashgar. She acted as if
    she had been there. He would laugh at the foreigners’ surprise as the monks blew
    the sand away. All that work, all those beautiful designs—gone.


    This is the high school textbook version, of course. Kashgar’s ancient trading
    post saw far darker exchanges than feel-good stories like the ones his mother
    used to tell him. Slaves were brought thousands of miles and traded along the
    route. Concubines captured by Vikings were sold in Dublin and young men captured
    by the Turks were sold to fight wars across the Ottoman Empire. The Silk Road
    was a prime route for carrying viruses and bacteria—including *Yersinia pestis*,
    the Black Death.


    The dark web Silk Road was, by contrast, mostly remembered for its pestilence.
    Founded in 2011, it served as a vending point for drugs and firearms. It also
    was ground zero for a certain brand of libertarian idealism characteristic of
    its founder, an American computer programmer named Ross Ulbricht.


    Ulbricht, who is currently serving two life sentences for drug trafficking and
    other crimes that were perpetrated on the digital Silk Road, created the space
    as a kind of freethinking exercise.


    The Silk Road was accessed, like most dark websites, by using a virtual private
    network and downloading a specific browser. Designing the browser took computer
    programming skills that Bo admired but did not himself possess. Learning about
    the massive global marketplace for cybercrime and falling in love with it, however,
    was just as addicting as Facebook.


    **Sixty minutes have passed.**


    Sand mandalas. The impermanence of love and hate. The way the past reaches into
    the future. Bo’s imagination has roamed the space between here and there, good
    and bad, white and black.


    Now he has 10 minutes before the ransomware eats his past five years of hard labor.
    He opens the email from the American company’s Singapore office and reads it again.
    It’s not a hard offer. It’s not a certainty. Three minutes. He reviews the chat
    history with the insider traders who want him to join.


    One minute.


    He closes his laptop. Throws it into a plastic bag. Ties it up. Smashes the bag
    with a hammer. He throws it in the garbage, presenting his data to the wind like
    a monk’s sacrifice.


    He composes a note to the executive in Singapore expressing his great interest
    in the opportunity. Next, he does something that he hadn’t even contemplated 72
    minutes ago.


    Bo Chou calls his mother.


    ## **15.**


    ## The Ghost


    **Victor Tanninberg is having lunch** with his journalist friend. It is early
    November 2015, and he hasn’t been outside his house in what seems like a year.


    She has hundreds of questions for him. Especially about the upcoming election.
    She’s been getting lots of weird chatter about hacker activity during the 2015
    primaries. And she wants to hear about the cars he’s been working on, about hacking
    in general.


    “I’m not a hacker,” he insists, over and over again. “Yes, I have a Russian background,
    but I don’t know what the Russians are up to—that’s ridiculous.”


    They have bur gers at a pub. They drink beer. He shows off pictures of his kid.


    In the end, he admits, leaving his house wasn’t too terrible. He has had what
    most people call “fun.” He might even do it again sometime.


    **It’s a quiet day** in Helsinki. Dieter Reichlin has finished reading *The Girl
    with the Dragon Tattoo* for the second time. The book, which is ostensibly about
    a slim, angry hacker named Lisbeth Salander, makes frequent references to the
    various types of sandwiches—tomato and mozzarella, egg salad—eaten in Scandinavia.


    The first time he read it, he was left with an unstoppable hunger for egg salad
    sandwiches. In anticipation of his finishing the book a second time, Dieter’s
    wife has mixed up a big bowl of egg salad. He sits, now, in his underwear at the
    breakfast table, eating egg salad right out of the bowl and watching Sig Himelman
    try to pick up women on Craigslist 1,700 miles away.


    It is not what he’d expected. TechSolu or whatever Sig calls that place was a
    tiny criminal speck, but one that appeared to have been operating efficiently.


    Dieter is interested in seeing if Sig will try the ATM cash-out scheme. At first,
    Dieter was sure he would, but Sig’s crack operation seems to be fraying at the
    edges. After watching the litany of flattering, saccharine messages to girls across
    Romania, he wonders if Sig even has time to work at all.


    One event flagged his attention. Directly after their meeting in the Helsinki
    airport, Sig opened a new bank account at Arnica Valka’s branch of Banca Transilvania
    on his laptop.


    He did it using the identity of a young woman. It appeared to be a stolen identity,
    someone named René Kreutz, with an address in a suburb of the city.


    It was the only inkling that Sig would branch out into this new scam, and then
    it was gone. Otherwise, besides the Craigslist solicitations, Sig remains balls
    deep in cyber-extortion. It isn’t clear who the victims are, but the payments—usually
    in the five-to six-figure range—keep rolling in.


    It caused Dieter to rethink how he viewed his former rival.


    Dieter had long viewed their relationship as a meeting of equals and opposites.
    Black and white. Good, simple Dieter and bad, complicated Sig.


    This was changing things. Reading Sig’s messages, the flowery language, the grasping
    at straws with women he doesn’t know, dispels the illusion of a cool and confident
    criminal mastermind.


    He had imagined Sig as a powerful executive with an army of underlings, or “employees,”
    as Sig would call them. In this reckoning, Dieter had pictured someone who comes
    across as a legitimate boss, making his charges feel better about the bad things
    they are doing, the risks they are taking. Through the handful of exchanges he
    can see on Sig’s laptop, however, he detects someone who is not in complete control,
    a personality that is deteriorating.


    Dieter had fantasized about the incredible white paper he could write about Sig.
    Tracking the criminal element, offering a detailed look at how a cybercriminal
    operates, getting inside his head.


    Now he isn’t so sure. As with many types of spyware, Dieter’s visibility is myopic.
    He can see only one piece of the puzzle, and it’s getting him nowhere.


    He has some view into Sig’s transactions and his keystrokes, but it is difficult
    to connect the dots. Dieter hates spyware. Even the type that can co-opt webcams
    offer limited visibility. You can only see a single subject—if it’s a camera on
    somebody’s computer—or a stationary space, watching people walk in and out of
    a building. Unlike Lisbeth Salander, who could in her fictional world seemingly
    monitor everything about everyone simultaneously from an old Nokia smartphone.
    He laughs to himself, then frowns.


    Because despite the obvious downside, here he is, still watching Sig. *Perhaps*,
    he thinks, *this is more personal than practical*. He shuts his laptop and digs
    into the bowl of egg salad with a large soup spoon. He will check back in a week
    to see if Sig has tried to open the bank account.


    There’s a sudden commotion on the stairs leading to the kitchen. It’s his wife,
    the kids. Two daughters, from deep asleep to wide awake in a second. Insane, ghostly
    children. Hair perpetually a mess. His wife is pregnant again. She glares at him.


    “You have egg hanging out the corner of your mouth.”


    “It’s that damn book.”


    “Watch your language.”


    The children shriek: “Damn! Damn! Damn!”


    “I’m sorry.”


    “You will want tomato sandwiches next.”'
