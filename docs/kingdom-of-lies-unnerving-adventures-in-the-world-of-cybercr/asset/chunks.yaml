- raw: 'Ultimately, this book is about control. If there is one common theme in everything
    that happens to us when we interact with technology, it’s our desire to control
    our environment in a way that benefits us. This desire to come out on top drives
    nearly every technical decision we make.


    Every catalyst to innovate, every curve in the trajectory forward is borne by
    someone who wants to control something or someone, or everything and everyone.
    Maybe with technology, maybe with authority, maybe with brilliance or whatever
    skill they bring to the table. To be the one who holds the reins high on this
    monstrous beast we’ve created—that’s the prize. At any given time, hundreds of
    thousands of people are scrambling and punching and grappling for their ins.


    Of course, you already know the answer to the question of who is *really* in control.
    Because you know more about cybersecurity than you think you do.


    ## **1.**


    ## The Futurethreat


    **Carl knows that if bank** systems are flooded with packets, they won’t be able
    to handle the traffic, web applications will overload, and the bank’s websites
    will go down. People won’t be able to bank or pay bills. Twitter will blow up.
    Call center phones will start ringing like a sadistic chorus. Bank executives
    will *look bad*.


    That’s what happened in September. And that’s what the terrorists are trying to
    do now, for a second time.


    *But it had better not fucking work*, Carl has been told over and over these past
    few weeks. *This can’t happen again*.


    Carl doesn’t care why this is happening, but bankers always want to know why.
    So, in Joe’s report, he explains the reason that the terrorists have provided
    for their attack, a rationale that makes little sense but was apparently proposed
    by the Izz ad-Din themselves online: There’s an American preacher named Terry
    Jones who is threatening to burn Qurans and a YouTube video criticizing Islam,
    and the Izz ad-Din want both to stop. And also Israel. The group has lots to say
    about Israel.


    The Izz ad-Din claim they have waited four months because they are merciful. They
    delayed their second action due to the U.S. presidential election and Hurricane
    Sandy.


    But that is all B.S.


    Because this kind of thing happens to banks all the time. DDoS (distributed denial-of-service)
    attacks come from aggrieved teenagers and foreign ne’er-do-wells and every class
    of hacker in between. They are a dime a dozen. Especially after the financial
    crisis, when a surge of hostility from Anonymous and activists against “the 1
    percent” spiked.


    Carl and Joe and the cybersecurity team have stopped DDoS attacks many, many times
    before. The Izz ad-Din are different. They have the skills and they have the hardware.
    And people. Lots and lots of people. They are not a loosely defined network of
    20-something terrorists scattered across Eastern Europe. Not some kids in a basement
    somewhere. They are an entire nation-state.


    Iran, to be specific.


    **Over the course of** the next several days, Carl and a team of five other security
    professionals battle the bad guys.


    Carl spends all his time in the room. They turn the heat down in the room until
    it is freezing so everyone can stay awake. Somebody keeps bringing up sandwiches
    from the cafeteria. Executives drift in and out of the room. Some stand next to
    him, look over his shoulder, and make significant gestures and solemn sighs before
    leaving again.


    They code name the attack Deep Blue, have daily and nightly and sometimes hourly
    phone calls about it. More and more people get involved. Some of them Carl has
    never seen before. Some of them, he knows, are consultants not even affiliated
    with the bank. The longer the attacks go on, the more people get involved in the
    crisis. And it *is* a crisis. No one has ever seen anything like this before.
    From the outside looking in, from the inside looking out, one fact becomes obvious
    to all: The bank’s management needs to make cybersecurity a priority. Not tomorrow,
    not next week, but right now.


    **As the suits pile** in, act interested, and watch Carl sit at the computer and
    fight the Iranian Army every fucking day, he becomes more detached and more alone.
    The attacks surpass the skills of his colleagues, relegating them to supporting
    roles on the sidelines. Carl is a *real* hacker, an extremely good one, and he’s
    seen it all, but never an attack this big.


    Then just as suddenly as it began, it ends. Somebody has finally taken down the
    stupid anti-Islam YouTube video. The Izz declare the war is over. Carl can’t believe
    it. He sits at his desk, fingers poised over the keyboard, exhausted, overcaffeinated,
    buzzing just a little bit, wondering if it’s really over.


    Everyone goes home. Carl stays behind, putting together one more security report
    for the bank’s board of directors. They have asked him to predict when the next
    strike will come. He considers the request and begins to type. “Futurethreat,
    a type of cyberthreat from a heavily weaponized nation-state . . .”


    Carl reconsiders, hits delete. *“Futurethreat” is a garbage term*, he thinks.
    It was probably invented by some government lunkhead. It will make the bankers’
    eyes glaze over. He can’t have that. He has their attention and he wants to keep
    it because Deep Blue has created a golden opportunity for Carl and his colleagues’
    cybersecurity team.


    And his boss. Joe Marcella, beloved by his employees, reviled by his superiors,
    bursts into the room. He has never, Carl has noticed, entered a room any other
    way. It is what earned him the nickname among some of his colleagues of Kool-Aid
    Man. Taller and with about 150 pounds on Carl, when Joe opens a door it has the
    same look and feel of a giant pitcher of punch smashing through a wall.


    “Where the fuck have you been? The fucking suits want another fucking PowerPoint
    about this shit if you can believe it.”


    Carl smiles. Joe’s his friend. Joe is unpolished—to say the least—but he has a
    way of earning a great deal of loyalty from his employees, which starts and ends
    with fighting with the higher-ups to pay them very well. Joe won’t make it long
    past the DDoS attacks. He’ll be replaced by executives who don’t fight hard for
    good pay, with predictable consequences.


    But those days are more than a year away. Right now, Carl is dealing with the
    fact that the top-level executives at NOW Bank suddenly care about cybersecurity,
    and the way bankers show that they care is with money.


    Carl writes, “Other hostile nations will have used DDoS attacks as cover for entering
    and persisting on our networks, with the goal of gathering information covertly
    over long periods of time.”


    Carl rubs his eyes, closes his laptop. As he walks into the lobby, now dark, he
    blows on his knuckles like a gunslinger.


    **At around that same** moment, Bob Raykoff, a former Air Force commander, reads
    some of the text he and a ghostwriter have cobbled together for the next edition
    of his textbook.


    *Futurethreats in cyberspace will require that we take some type of offensive
    action, heretofore under the characterization active defense. The only way to
    ensure the safety of these active defense measures is to design clear military
    protocols around them, and to the extent possible, engage other nations—even hostile
    nations—in creating a more robust international norm for cyberattacks, cyber-reconnaissance
    and other tactics*.


    Bob Raykoff was one of the first people to use the term “futurethreat.” He is
    working on his latest book and writing a chapter with that name. He is obsessed
    with futurethreat. He has been watching the DDoS attacks against the banks and
    wonders who will make use of the distraction caused by the Islamists. The Chinese?
    The Russians?


    Definitely the Russians. Bob *hates* the Russians.'
