- raw: 'On her first day, René helps four “customers” transmit Bitcoin into a digital
    wallet held by TechSolu. The executives she speaks to on the phone are distraught.
    Sig explains the executives are angry because they don’t find out how to fix the
    cybersecurity problems until after they pay.


    She catches on quickly. The workers on the main floor of TechSolu are hackers
    and by no means ethical. They are breaking into American and European companies,
    freezing their important files, and demanding payment in exchange for a digital
    key that will un-freeze those files. Along with the digital key, TechSolu will
    also deliver a helpful PowerPoint deck on how to keep hackers like them from doing
    the same thing again. One of her colleagues sometimes gets on the phone, too,
    and walks the executives through what they did wrong.


    Despite the consultancy feel, it’s clear Sig and the rest of the team are cybercriminals.
    TechSolu’s business model is ransomware.


    But here they are, in a completely normal office, one that René really likes.
    They offer some health benefits. There is a football table. René rationalizes
    the criminal aspects away. *Cybercrime isn’t the same as “regular” crime*, she
    thinks. *You have to be smart and savvy to pull it off. Plus, no one gets hurt,
    at least not physically*.


    She sometimes gets a nice bonus in cash. Every so often, she tapes some of the
    cash in a small bundle underneath her desk in the office. Just in case.


    **What René lacks in** computer skills she makes up for in street smarts. She
    quickly becomes hooked on customer service.


    Every day, she talks to distressed businessmen and -women, calms them down, and
    explains that they have been hacked, that they can restore their data immediately
    for a small fee, and they can make sure it doesn’t happen again.


    The “customers” often go from pleading, crying, sometimes screaming to thanking
    her. Some even say that the money—often just a few hundred dollars—is a small
    price to pay for recovering their files and making sure it never happens again.


    René soon learns that all tech start-ups on General Maleur specialize in ransomware
    or similar work. Above the Korean tea shop is a company that hacks into the databases
    of American retailers and steals credit card numbers. Next to Cafe Americain,
    another company buys those credit card numbers and manufactures fake credit cards
    that work like the real thing. They hire mules to go out and purchase goods that
    can easily be turned around and sold, thereby creating “clean” cash from the illegal
    credit card transactions.


    Sig was wrong when he said he would triple her pay from City Italia. In fact,
    she makes four times what she had been making at the restaurant. She quits community
    college but uses what she’d learned in class to make TechSolu’s PowerPoint decks
    prettier and more readable. Soon René is optimizing TechSolu’s ransomware racket.


    She creates a much more compelling screen for customers to see when they are hacked.
    It no longer read “You’ve been hacked!” in green font on black. Now a subtler,
    almost reassuring message appears on an all-white background:


    We are sorry to disturb you, but a flaw in your operating system has allowed hackers
    to disrupt your operations. Your files have been frozen, but you have a number
    of ways to get them back.


    She creates a menu of options for the customers, which allows TechSolu to increase
    its margins by 20 percent in only a few months. Most of the ransoms that clients
    pay are only around $300 or $400, but some are paying over $1,000 with the new
    menu. Clients can choose to pay quickly at a discount or wait and face an ever-increasing
    payment. If they do not pay by a certain time, their files will be destroyed.
    They can also pay extra for the latest and most up-to-date PowerPoint deck. In
    a few cases, René convinces customers to actually allow TechSolu’s hackers access
    to their full network to do legitimate penetration testing. Sig promotes her,
    gives her a raise and her own glass office.


    Shortly thereafter, one of TechSolu’s hackers manages to get into a large technology
    company in San Francisco. A company René has heard of. The file cache the hacker
    accesses contains company emails, and a quick look reveals some very embarrassing
    messages from the CEO.


    He is a well-known name, and as René pages through the trove, she is disgusted
    by his attempts to use vendor contacts to procure hookers. Other messages he sends
    internally to female employees include egregious innuendo and commentary on their
    looks and clothes.


    René simmers. She’s making good money, but this guy is a billionaire. Some executives
    at Sony had just been roasted all over the internet for far lesser crimes than
    these. *He needs to be put in his place*, she thinks. She churns through revenge
    scenarios in her mind, then hits on one that could be a huge win for TechSolu.


    While the boys on the floor laugh about the treasure trove of filth they have
    hacked, René ducks into Sig’s office.


    “I have an idea. We contact the CEO and we ransom him for his emails. We don’t
    ransom the company’s files. We stay under the radar and spook him just enough
    to get him to pay up, but not enough for him to call the FBI. I’ll reach out and
    explain the situation. I mean, how much do you think it’s worth to him, a million
    dollars?”


    “Do it,” Sig says.


    She researches the CEO but can’t find a private email address, only a work address.
    She writes him something very discreet but references one email in particular,
    one that the CEO will know is from his emails: “I’ll bet it tastes like chicken,
    but really good chicken.” She shudders a little from writing it out, proofreads
    the rest, adds a burner phone number that will call back to her office phone.
    She uses the pseudonym Katrina and hits send.


    It takes three minutes for her phone to ring, even though it is 1 a.m. in San
    Francisco. The call comes over a WhatsApp line—encrypted. On the other end, a
    tired man’s voice with a surfer’s affectation speaks.


    “Hello? Is this Katrina?”


    “Yes.”


    “I would like to ask . . . how much does it cost to use your . . . shredding services?”


    “The current rate is two hundred Bitcoin.”


    “That’s . . .” His voice trails off while he does the math, but she could have
    easily finished the sentence for him. “More than a million dollars.”


    “Yes,” she says.


    “And the documents . . . they are completely destroyed . . . after this service?”


    “Yes.”


    She can, as she has grown accustomed to with other customers, hear him talk himself
    into accepting her proposal.


    “Can you guarantee it?”


    “Yes. I can put it in writing if you like and send it to—”


    “No! No. That’s fine. Your word is sufficient. After all, if you didn’t keep your
    word, nobody would ever pay you again, would they?”


    “No, sir.”


    Long pause.


    “You have a nice voice. Where are you from, Russia? How much are they paying you?
    I’ll bet you’d love to work in the U.S. H-1B visas are hard to get, but I just
    want you to know that I love women. I respect them.”


    “I’m sure you do, sir. If you don’t pay within the next ten minutes, the rate
    goes up to three hundred Bitcoin. I will text you the details for sending the
    money to our wallet via WhatsApp. Have a wonderful evening!”


    She hangs up, sweating. She turns around and can see all the hackers on the floor
    watching her through the glass walls of her office.


    Her phone rings again. She ignores it. It rings again. She ignores it again. “Answer
    it!” someone yells. She ignores that, too.


    Then a tiny ping from Sig’s office next door. Only audible because of the dead
    silence. Then Sig’s voice, ringing through the whole office, in German:


    “*Oh mein verdammter Gott*.”


    Oh my fucking God.


    He clears his throat, steps out of the office, and announces humbly: “Confirmed:
    200 Bitcoin deposit.”


    $1.3 million.


    Cheers. Whistles. René has pulled off the largest ransom in company history.


    It is not yet 10 a.m. in Arnica Valka.'
