- raw: 'In 1901, Congress created the National Bureau of Standards (**NBS**), which
    would later turn into the National Institute for Standards in Technology, the
    organization that would create the country’s primary framework for cybersecurity.
    Throughout the 1930s and 1940s, NBS produced the “math tables project,” a division
    of Roosevelt’s Works Projects Administration, which led to some of the foundational
    mathematics for today’s internet.


    **John Curtiss**—a pioneer in “the salt mines of computing”—came up with some
    of the first computational algorithms associated with modern computing. Curtiss
    helped found the Applied **Math**ematics **Lab**oratories, which would become
    the U.S.-based Applied Mathematics Division of the U.S. Department of Energy’s
    Office of Science. It would ultimately develop some of the earliest software and
    hardware in the United States.


    One of the first applications for this computing capability was with the **new**
    U.S. **Census** in 1951, which relied on an early version of a computer database
    called **UNIVAC**, regarded as the world’s first commercial computer.


    ### **LANCZOS, KRYLOV, HESTENES AND STIEFEL**


    Cornelius **Lanczos**, a Hungarian, developed several new uses for algorithmic
    computing throughout the 1950s and 1960s, as well as the mathematical technology
    that allows us to zoom in and out of digital images and videos.


    One of Lanczos’s methods, known as **Krylov**, was a collaboration between himself
    and Magnus **Hestenes** and Eduard **Stiefel** in the 1950s. The Krylov algorithm
    was named the algorithm of the century because it led to foundational elements
    behind the scale at which computers can sift through information.


    ### **SEAC, UNIVAC, FBI AND FINGERPRINTS**


    **SEAC**, or Standards Eastern Automatic Computer, was one of the first computers
    that could be accessed remotely, created for government use in 1964.


    Also around this time, the **FBI** started using the early computing technology
    to digitize its database of **fingerprints**.


    ### **BROOKS ACT, MAGIC FACTS, CHURCHILL EISENHART**


    In 1964, the **Brooks Act** established automatic data-processing standards, and
    the federal government launched the first **MAGIC** terminal, one of the earliest
    computers to use graphics to display information. **Churchill Eisenhart**, a mathematician
    and chief of the U.S. statistical engineering laboratory, advocated for the federal
    government to favor “sound mathematical analysis \[over\] costly experimentation.”


    ### **FIPS 1, CST, RAILROAD CLUB AT MIT**


    The first incarnation of the Federal Information Processing Standards (or **FIPS**)
    was published in 1968, followed by several standards on encryption and data security
    throughout the 1970s that would underpin the field of cybersecurity into the twenty-first
    century.


    **CST** probably refers to the Computer Sciences and Technology Lab. One of its
    first publications, in 1978, is “Effective Use of Computer Technology in Vote-Tallying,”
    which focuses on accuracy and security controls in vote counting done by computer.


    The Tech Model **Railroad Club** at the Massachusetts Institute of Technology
    (**MIT**), which formed in 1946, became a hotbed of early hacker activities in
    the 1970s and early 1980s, a result of actual model railroad enthusiasts’ interest
    in “signals and power” circuits and switches that make the trains run. This group
    utilized the term “hacker” in its current form as early as the 1940s.


    ### **VOTE COUNTS, JARGON FILE, LINUX KERNEL ONE**


    Electronic voting has a long history in the United States going back to the 1960s.
    By the 1980s, several states, wary of traditional punch-card systems, began favoring
    electronic readers for counting vote cards and punch ballots.


    The **jargon file** is a record of hacker lingo first developed at Stanford in
    the mid-1970s. It records the history and development of casual cybersecurity
    terms. The first **Linux kernel**, version 0.01, an open-source computer code,
    was released in 1991 by **Linus** Torvalds.


    ### **BILL JOY, LARRY WALL, LINUS, GUIDO VAN ROSSUM**


    **Bill Joy** was a cofounder in 1982 of Sun Microsystems, an early computer company.
    Around the same time, **Larry Wall** was developing Perl, an influential computer
    language. Linus Torvalds is mentioned above, and **Guido van Rossum** developed
    the Python programming language, one of the most popular languages today.


    ### **CAPTAIN CRUNCH, MA BELL, TWENTY-SIX HUNDRED**


    John Draper, aka **Captain Crunch**, was an early and influential hacker, part
    of a loose collective that referred to themselves as Phone Phreaks because they
    used telephones to hack into various organizations through the phone lines, especially
    those owned by the Bell Telephone Company, aka **Ma Bell**. The **2600** was a
    magazine catering to phreaks and other early hackers that detailed how to achieve
    various malicious activities. Founded in 1984, the title refers to the 2600-hertz
    tone, which hackers found could be replicated with a toy whistle found inside
    Cap’n Crunch cereal boxes.


    ## Sources


    My observations and conclusions in *Kingdom of Lies* are based exclusively on
    unclassified, open-source information; my personal observations; and my interviews
    with individuals who claim knowledge of specific events. None of the information
    in this book involved access to classified intelligence.


