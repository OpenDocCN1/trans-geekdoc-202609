- raw: 'But there are at least two others brewing at the bank. The first involves
    some of the bank’s law firms. Chinese nationals have been stealing proprietary
    data on deals for years in order to insider trade. It’s getting worse. They’re
    starting to share that information with other operatives in other countries. Hundreds
    of them. Insider trades galore. The Department of Justice is investigating. The
    Securities and Exchange Commission is investigating. But the law firms are clueless.
    Then the SEC was hacked, too, by the same people. The cycle continues.


    The Chinese are out there smashing and grabbing and they’ve got their mitts on
    some heady stuff. They treat hacking like a full-time job, a cushy military career,
    a nine-to-five with on-the-job training. Imagine if safecracking were institutionalized,
    what would the safe-crackers do when they retire? Take up fishing? Not when they
    can make much more doing the same thing underground.


    Many of the attacks, workers in the SOC now know because of some public intelligence
    reports they’ve received, originate from a gray cement building in Shanghai known
    as People’s Liberation Army Unit 61398. It’s a sooty place where employees of
    China’s PLA cyberunit have been hacking U.S. corporations for their intellectual
    property since at least the early 2000s. In the SOC in New York, the security
    analysts record electronic pings from the facility throughout the Chinese workday.
    They see a reprieve only on Chinese holidays.


    The Chinese use rudimentary toolkits to break the meager defenses at most U.S.
    companies and steal swaths of data, most of it useless. Business plans, names
    of partners, dates, images, corporate charters, movies, embarrassing and incriminating
    information like names of mistresses and favorite kinks. They are especially interested
    in visiting businessmen.


    Two Chinese schemes running simultaneously involve information from NOW Bank and
    some of its competitors, data that has been mishandled terribly by their respective
    law firms. Both schemes concern initial public offerings.


    These two law firms deal in data related to mergers, acquisitions, and financing.
    Some of their divisions also handle Food and Drug Administration approvals and
    loans for pharmaceutical companies. NOW Bank helps finance these deals, so the
    information resides with them, but their law firms have access to it as well.


    Knowing that an unannounced merger is going to take place or that a drug trial
    was successful is a great way to get key information in order to execute an insider
    trade. The term “insider trading” used to refer to corporate insiders, company
    leaders, nosy bankers, and Wall Street journalists using their access to exploit
    the markets. But the new insiders are hackers who plunder corporate networks,
    and they are making hundreds of millions.


    These guys get all the benefits of insider trading without having to ever rub
    shoulders with bankers, lawyers, or government officials.


    Luckiest fucks in the world, Charlie says, just to make Caroline laugh.


    **It’s now October 2014.** Six years earlier, Bolin “Bo” Chou, a bisexual Shanghai
    expat from a village near the Nepalese border, learned how to create fake credit
    cards from a younger, less cynical Valery Romanov. This was in the spare time
    he had away from his job at PLA 61398.


    Bo doesn’t like talking about his government work. Not because it is supposed
    to be secretive. It is. But that’s not the reason.


    It’s boring. A boring story. Strapping in, executing code all day, reworking old
    hashes, trudging home, filling quotas. He likes computer engineering and is pretty
    good at it. He loves data and what it can do. He is interested in how hackers
    in other countries operate. White hats and black hats. They are all the same to
    Bo.


    Because what is he? He is good, he wears a white hat, he is fulfilling his duty
    to country. He is bad, he wears a black hat, he is doing things that are illegal
    in other countries.


    People like Valery Romanov, they probably think they are white hats, too, when
    everyone else thinks they are pure black. Everything and everyone, all over the
    world, is gray, in Bo’s opinion.


    He loves Valery Romanov, not because he admires him, but because Romanov is pure
    camp. Romanov, the Russian rock star. Romanov, who posts pictures of himself with
    stacks of money and fancy cars. Romanov, who identifies with American rappers
    and calls himself Tupac. It was all so much flashier than Bo’s work at PLA 61398.


    Valery is fun and ultra-capitalist with a persona much bigger than anyone working
    in a Chinese hack farm could ever dream of. Bo doesn’t want to emulate him, mind
    you. Just enjoy the show. He got into rap because of Romanov. Biggie, Tupac.


    Then Romanov disappeared.


    Then, it turns out, Romanov got arrested.


    Bo, out of the army for a few years now, considers a different career.


    In the tech-heavy suburbs of Shanghai, he tries getting into the skin care business
    for a while, selling pearl lotion to tourists. He moonlights as a tour guide,
    taking foreigners on tours of factories that make those pearl-based skin care
    products. He thinks about starting his own line of moisturizers. Then he gets
    a job washing dishes at one of the fancy hotels near the convention centers. And
    everything changes again.


    Turns out, he loves the excitement of the hotels, the hustle and bustle. It’s
    all new, fun, sexy to him. It is the polar opposite of the military job. It is
    different, too, from the cynical, clandestine world of the Russians and newbie
    cybercriminals and hackers and DEFCON wannabes he’d gotten to know online. It
    is better than the “hacker community,” whatever that means.


    Everything else has changed, too. Bo is bi, and he likes to be quiet about that.
    He’d joined the army and moved to Shanghai in the first place to get away from
    the traditions of his home life farther west. Traditions with no room for his
    ambiguous preferences.


    Bo thinks the visionary European and American businessmen and-women are attractive
    and interesting. The Israelis, wily and clever. Even the Australians and Canadians
    are elegant and sophisticated in their own ways, with their bold and contagious
    friendliness.


    And here he is, struggling with his identity as part of the Chinese contingent
    of the world’s most boring hackers. Really, more like hammers, brute-force pounding
    away over and over and over again at infrastructure in the English-speaking world.
    Pound, smash, grab the pieces, pound, smash, grab the pieces, pound, smash, grab
    the pieces. Then screech out of there on worn-out tires, so everyone in the neighborhood
    can hear.


    So Bo stays at the hotel job. Gives up the skin care tours in favor of a better
    racket. He rises to the status of lead doorman, because he can speak English well
    and remembers every detail about every guest. A nice rollover habit from his army
    days doing cyber-reconnaissance. He greets taxicabs, takes bags to rooms, helps
    direct the elegant businessmen and savvy businesswomen to the best restaurants,
    tailors, plastic surgeons.


    **At around the same** time Charlie Mack is contemplating the mess in front of
    him at NOW Bank, Bo discovers even more reasons to love his new job, reasons that
    promise a beautiful marriage of past and present.


    Bo is planning a fascinating evening of cyber-reconnaissance when he is distracted
    by a harried businessman who has left a satchel with his passport in it in a taxicab
    that is disappearing out of the hotel’s circular drive.


    The taxi driver isn’t paying attention, and screeches out of the driveway. Bo
    takes off down the road. Running at a full clip for at least a quarter mile. Flat
    out. Like Jason Fucking Bourne, but in a black suit with a mandarin collar. He
    catches the taxi as it pulls up to a stop-light and pounds on the door. He manages
    to open it and jumps inside even as the driver tries to ignore him.'
