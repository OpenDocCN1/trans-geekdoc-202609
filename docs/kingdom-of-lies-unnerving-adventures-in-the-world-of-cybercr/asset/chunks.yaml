- raw: 'But today, despite the excitement of what’s to come, she is really tired and
    really pregnant. She is a short, petite woman, and being really pregnant is no
    joke. It means serious balance issues. It means almost constant trips to the bathroom.
    And to her, it means worrying about her job because it seems like women in the
    department run by Bob Raykoff are being “managed out.” That is the euphemism in
    corporate speak for an unspoken but established technique of making one’s work
    life so unpleasant and unrewarding that one will want to resign voluntarily, thus
    saving the company severance pay and possible litigation. In her opinion, Bob
    is a jerk, but not of an outstanding type. This is a standard work challenge,
    endured by women all over the world, one she’s helped many of her employees through
    and one she intends to weather with dignity.


    But it’s hard. The sighs and wan smiles from people who know she’s not coming
    back from maternity leave wear her down. So do the congratulations, both parties
    understanding that she’s just forfeited her bonus for the year. This is Caroline’s
    second time through this, which is a blessing and a curse. When it’s your first
    baby, everyone around recalibrates their expectations because they know your loyalties
    are going to be split in a most significant way. *How will she make my project
    her priority with a baby to worry about?* God, she hated that.


    She’s comforted because she has her network to lean on. Her former boss, Joe,
    the Kool-Aid Man, has moved on to a job at an insurance company. Nice and safe
    out in central New Jersey.


    Another of her charges, Frances, the woman she prepared a care package for when
    her house burned down, gets Caroline an offer from a consulting firm. It would
    be a huge raise. She turns it down, knowing that what she wants next is something
    a little quieter.


    She tries to tell the kids at the hack-a-thons that the trope of a morally tormented
    genius like Mr. Robot couldn’t be further from the truth. Most people in this
    field are just normal, average Joes. Some are even mom types, sitting there, organizing
    the program, making sure everyone’s on time and under budget. Getting into the
    field and getting good at it won’t make you cool if you weren’t cool to begin
    with. And that’s OK. Cool people are frequently unreliable.


    When Caroline had her first child, she was 35. She’s now almost 40. Just before
    giving birth that first time, her doctors discovered a significant and possibly
    deadly tumor on her thyroid. She brought the baby, a boy, to term, underwent a
    C-section, and then immediately went into surgery to have her tumor removed on
    the same day.


    She endured cancer treatment while raising her newborn. Then she went back to
    work at NOW Bank.


    And today, she has some government wonk, high on the scent of his own gas, suggesting
    that her nearly 20-year career in cybersecurity is over? Caroline would use her
    significant influence to ensure that Prem takes Raykoff’s job, and Raykoff gets
    demoted and shuttled into a less influential—and far less risky and damaging—position
    before she departs. It will be one of her final acts at NOW Bank.


    Caroline is sad, but she isn’t afraid.


    ## **8.**


    ## The Father


    ***Another goddamn, motherfucking hassle*, Victor** Tanninberg thinks, as he contemplates
    the 1994 Corvette before him at Padraigh’s place. He looks through his bag for
    some of his older equipment. *Another motherfucking hassle when I leave the house*,
    he thinks.


    His phone is ringing. An ancient Samsung flip-phone he found on eBay because he
    despises Apple and Google. His son is calling.


    He says he’s going to a friend’s house; he’s hungry and is going to stop to eat
    along the way.


    The voice Victor uses on the phone is a complete mismatch to the one in his head.


    “OK, just be careful. Are you going to take the bus back from Steve’s? All right.
    Want me to bring you home some Subway? Be careful, OK?”


    Then he hangs up. Mutters a string of curse words under his breath. His son is
    good, shy, with a few friends he keeps close. He’s quickly turning into an accomplished
    artist, and Victor has taught him to play guitar, one of his own hobbies.


    He’s also taught him to specialize in evasive maneuvers, not while driving but
    while living. Never attend large events in high-value-target locations like Madison
    Square Garden. Take the subway sparingly, and only to and from stations that are
    unlikely to be targeted by terrorists. Avoid Grand Central Station and Times Square.


    Victor instructs him to avoid engaging in any political debate and recognizes
    that all teachers, especially those who teach in the public schools he attends,
    are probably intellectually limited.


    Don’t trust anyone who asks you for money or tells you a sad story about his life
    too soon after meeting him, Victor tells him. Never share any personal information
    until you’ve known someone for well over a year. If someone tells you they’re
    not a good guy, believe them the first time. Never download any apps onto your
    phone. Never allow some company to track your location.


    He worries he is too dark with the kid, but the kid smiles a lot. His boy humors
    him. Laughs sometimes at things Victor’s not joking about.


    Indeed, these are things a hacker actually worries about.


    In fact, what worries him most is what he believes is an increasing lack of attention
    to detail in all things—engineering, security, car manufacturing. There’s more
    stuff but so much of it sucks that it introduces more risk.


    Victor immigrated to Israel from Russia when he was a child, and then to the United
    States when he was eight years old. His father, a government engineer, stayed
    behind in Russia while Victor, his mother, and Victor’s older sister went ahead.


    For several years, they lived without Dad, in a world of impossible freedom. It
    was the beginning of what would turn him deeply capitalist and conservative. He
    only works with American cars, he says frequently, because he loves America. From
    the get-go, Victor’s father—who rejoined the family after five years in purgatory—marveled
    at the inadequacy of American engineering and how it seemed to be growing worse
    as the years wore on. He referred to his own experience in industrial engineering—not
    computer code, but in bridges, tunnels, subway systems, and skyscrapers. He pointed
    out lopsided entryways and inelegant angles each time they would go into the city.


    Victor sees parallels to this everywhere. Inefficiencies. Poor design. Lopsided
    and inelegant are the least of these. Sloppy code that invites problems. Sloppy
    thinking that invites manipulation.


    It doesn’t surprise him at all when computer engineers in Russia are able to do
    any number of things the media accuses them of doing. But he doesn’t know that
    he would call it hacking. You can’t break into a house whose doors have been left
    open.


    You can’t break code that was written with giant holes. You can’t break weak minds.
    They’re already broken.


    ## **9.**


    ## The Teenager


    **René Kreutz never learned a** single thing about evasive maneuvers from her
    father, even though he was a cop. He retired well before she was born. And he
    really retired. He sat down in a big, soft chair in front of a television and
    never—or so it seemed to René—got up again.


    René’s mother makes nice Romanian dinners and buys her good conservative clothes,
    but offers no life advice. When René asks either of them what they think she should
    do with her life, all they have to offer are blank stares. “Whatever you want,
    I guess.”


    René feels as if she is always tripping into and out of trouble, lighthearted
    trouble, but trouble nonetheless.'
