- raw: 'Can you use a smartphone? Make a PowerPoint? Think on your feet? Ever organize
    a night out to the movies with your friends that went well and nobody crashed
    their car to or from the event? Welcome to the twenty-first century’s hottest
    career path. Are you able to charm the pants off women? Did you escape an abusive
    marriage? Have you ever hosted a toddler’s birthday party at your home? Honey,
    I want you on my cybersecurity team.


    After reading the stories in this book, you will understand that what makes cybersecurity
    complicated is the complexity of human beings. So if you know how to deal with
    people, you can handle internet security. If you understand what makes people
    tick, not only will you be able to recognize a threat, you’ll be one step ahead
    of your adversary.


    During my career as a cybersecurity executive at multinational corporations, a
    journalist for *The Wall Street Journal* and later CNBC, and a professor at Georgetown
    University, I’ve met a lot of fascinating people. From the hackers who perpetrate
    malicious attacks to the security professionals who try to prevent these incidents
    from happening, and the alphabet soup of government agencies that do damage control,
    at the end of the day they’re all fathers, sons, mothers, sisters, and spouses.
    In other words, people just like us. Yes, white hats cross paths with black hats
    and change alliances more frequently than you might expect, but they’re driven
    by the same desires as the rest of us—even if sometimes it feels as if everyone
    in cybersecurity is allergic to the truth.


    As a professional, I was told a great many lies about the field I have grown to
    love so much. After becoming a journalist on the cybersecurity beat, I was told
    even more. Here are a few:


    *“Let me introduce you to the hacker community.”*


    This lie is usually delivered with a wink and a nod from someone who thinks they
    know every hacker on the planet. The truth of the matter is, there is no hacker
    “community.”


    Sure, the guys who make a splash at the big annual conferences might say otherwise.
    But every country, every state, every faction, every identifying group has its
    own community of people who hack computers. Some of them are extremely conservative,
    others are massively liberal, most fall somewhere in between. Some wear suits
    and ties and work as lawyers during the day, while others look like everyday citizens
    and have great people skills as they pursue their idiosyncratic agendas.


    Some are good guys who get fed up with the low pay and boring duties and become
    criminals. Some are criminals who end up becoming good guys. Many start and end
    their careers on either end of that spectrum.


    Some, including many you’ll meet in this book, are extremely proficient hackers
    who have no time or inclination to identify with any community at all.


    As a journalist, I was astonished at the number of people who came out of the
    woodwork to offer me exclusive access to the hacker community. I couldn’t help
    but notice that the members of the source’s “hacker community” were often people
    just like him or her. My point is there are many different types of people working
    in this field, and I can guarantee you that a lot of them are exactly like you.


    Here’s another lie: *“He’s a luminary in the cybersecurity field.”*


    He’s probably not. Fame and luminescence don’t typically intersect in this field.
    The people I’ve met who are actual geniuses aren’t famous, and most of them don’t
    have social media profiles. They tend not to pontificate on areas outside their
    expertise.


    The people who are constantly headlining conferences and who are so often offered
    up to me for interviews have less insight than those who stay underground. Anything
    a high-profile hacker is willing to share typically carries with it a massive
    and crystal-clear agenda that I’ve learned to spot from a mile away. Even if a
    conversation is off the record, the intel coming from top government officials
    or other marquee corporate cybersecurity names carries little novel information.


    The only people who have illuminated the way for me in this world—and in this
    book—have been genuine practitioners who never held a C-level title. You’ve never
    heard of them and because I’ve changed their names to protect their privacy, you
    probably never will.


    They are luminaries not because of the degrees they’ve collected or the events
    they’ve headlined but because they carry a lantern that guides the path for others.
    These types of people typically don’t have a public relations team.


    One of my favorite lies: *“He doesn’t know what he’s talking about.”*


    This one is usually delivered by someone who asserts that he or she knows the
    cybersecurity field better than anyone else. These people will brag that they
    know what it’s like to be a hacker and can do things that no one else in the room
    can.


    I’m always wary of those who try to establish their bona fides by discrediting
    the expertise of other cybersecurity professionals. The depth and breadth of this
    field is so vast that everyone who works in it is an expert at some part of it,
    and I have yet to meet someone who is an expert at all of it. Not even close.


    Every view of an incident is informed by the viewer—what he sees, what her level
    of expertise is—and that changes over time. It’s like asking a tourist to describe
    Times Square, then asking someone who lives and works in New York to do the same
    thing. Different pictures emerge of the same subject depending on your point of
    reference.


    Then there is the final lie, the one that is the hardest to dispute, the lie of
    the *Machiavellian technological wonder*. The Lisbeth Salanders and Mr. Robots.
    The media loves to portray hackers, security experts, and intelligence professionals
    through a two-dimensional lens: they’re either crusaders for good or practitioners
    of evil, and they all wear black.


    I’ve read countless news articles about people I know that portray cybersecurity
    professionals as shadowy puppet masters pulling strings with their computer science
    acumen. For better or worse, I’ve seen these people go through all the same human
    experiences as you and I, and I want to tell you about them.


    **I’ve been working in and** observing the cybersecurity world for the past decade.
    Some of my contacts are criminals. Some of them skate the line between truth and
    fiction. To the best of my ability, I’ve tried to verify that their stories are
    accurate or, at the very least, plausible.


    The profession, as I write this, is made up of about 9 percent women. I know a
    lot of them, maybe because we are such a rare lot. In order to staff the shortfall
    of cybersecurity jobs—millions that will need to be filled by 2020—we are going
    to have to do a better job of recruiting women to the field. This makes it sound
    like we are up against some sort of serious challenge, but it shouldn’t be this
    way. It’s a natural career for women.


    Hypervigilance. Risk aversion. The ability to imagine frightening scenarios that
    nobody else can see based on a series of devastating, cascading factors. Three
    pathologies so often held against women in business. Three characteristics of
    so many new mothers. These are enormous assets in the field. Perhaps it’s better,
    I learned, for women who suffer from them to put them to work, to use anxieties
    to make money hand over fist.


    I didn’t know when I entered the field that I was going to write a book, I just
    knew I wanted to know more about these interesting people who were passing in
    and out of my life. Writing a book has been very different from being a journalist,
    in that I’m not objective about some of the individuals I write about here. I
    consider many of them personal friends; some I consider enemies. I have saved
    their stories for this book.'
