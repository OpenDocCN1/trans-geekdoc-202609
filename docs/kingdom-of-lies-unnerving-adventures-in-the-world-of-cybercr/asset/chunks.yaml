- raw: 'Brendan goes back to his previous assignment. Finding identities on the dark
    web that could be of use to ISIS.


    He posts again, this time on a chat board with other terrorists. He buys credit
    cards elsewhere. He trades for them using a rootkit that he has customized slightly
    and loaded onto a variety of popular pornography websites. Anyone who visits them
    will have malware downloaded onto their computers, a botnet for minor-type cyberattacks
    like DDoS. He doesn’t care. These people deserve it. It is his right to ruin their
    computers, because he is pure.


    These things are bad, corrupting to the human mind. That’s why he designed it.
    Rootkits are important tools, made of software but no different from the shovels
    and spades ISIS is using to create a new and better civilization in Syria. He
    will fight for his brothers using his engineering degree and his heart, which
    is *just like a lion’s heart*. Fucking women. None of them ever appreciate this
    about him.


    Brendan is from a suburb of Galway, Ireland, called Ballybane. A drab and gray
    place where he grew up in ivory-white public housing. He traveled the world and
    managed to get a few engineering certifications and make a decent living along
    the way, but he never made enough money to entice a woman to pay him any mind.


    He likes Singapore. It’s clean and quiet, and he can go about his business undisturbed.
    He uses a virtual private network to access the dark web because, despite its
    many advantages, Singapore is still run by *the thought police*. To anyone trying
    to spy on him, it looks like he’s doing straight work, coding and fixing bugs
    for merchant websites on a freelance site called Fiverr. He does this on his “straight”
    laptop, which he connects to the local network. On a different laptop, however,
    the signal is routed through a server far away in Kiev using a virtual private
    network. Anyone trying to locate him will think he’s operating from Ukraine.


    Local law enforcement agencies know all about him, but he’s not really doing any
    damage. The information he’s trading is irrelevant. But they’re watching. They
    know how VPNs work, too.


    Dieter Reichlin is also watching. He likes to read Tahir’s ludicrous posts, especially
    now that he is writing about cyberterrorism.


    There are two types of cyberterrorism, and Dieter is trying to distinguish between
    them for a possible article, which he is not sure he’ll ever be able to finish.
    He wants to find the parallels between the two.


    There is the type of terrorism that everyone fears: the big, sweeping attack that
    takes down an entire country’s electrical grid or causes a nuclear facility to
    overheat.


    But there is also the more personal type, the kind Tahir perpetrates, attempting
    to take low-level, rudimentary hacking tools and turn them into something that
    can be used to move his own personal agenda forward. This philosophy is behind
    many different types of attacks, of course, but Dieter wants to understand the
    agenda so he can make sense of the action.


    Bo Chou is also watching people like Tahir. He’s permitted to go on the dark web
    as part of his job. As ISIS has proliferated, so have the armchair warriors who
    want to support the terrorist network. A fascinating bunch, and a legitimate reason
    for him to visit the very latest incarnation of the Silk Road.


    **Despite the large numbers** of people like Tahir on the internet, there has
    been only one successful prosecution of a cyberterrorism case in the United States.


    Ardit Ferizi was a Kosovar Muslim living in Malaysia who used stolen credentials
    from military bases to supply a kill list to ISIS. In order to do this, Ferizi
    used a rudimentary attack technique called a SQL (pronounced like *sequel*) injection—abbreviated
    as SQLi—in which malicious code is injected into a database in order to corrupt
    it and, in this case, extract information. Ferizi targeted retailers on military
    bases not only to steal names and addresses of government personnel who may be
    living overseas, in reach of actual ISIS fighters, but to provide those names
    to high-level members of the terrorist group.


    Here’s a real interaction between Ferizi and Junaid Hussain, an ISIS recruiter,
    captured by the Department of Justice:


    **Ferizi:** Elhamdulilah brother :)


    wait i prepare some dumps i got ok


    **Hussain:** which website akhi


    **Ferizi:** \[Company Name Withheld\] :)


    Plus i got


    the credit card


    of airforce


    department


    waiti show u


    \[Company Name Withheld\] have around 190k users


    :)


    orders.html


    **Hussain:** Where u get the mil/gov dumps?


    **Ferizi:** in the website \[Company Name Withheld\] already now I’m connected
    on it


    —


    **Ferizi:** I have also another shop which have 878k clients and its a military
    shop


    :)


    there is huge db \[database\]


    —


    **Hussain:** how did u get DB access?


    **Ferizi:** easy penetration


    **Hussain:** SQLi?


    **Ferizi:** sqli the mobile app :P


    And got access all in


    **Hussain:** masha’Allah


    **Hussain:** nice


    **Ferizi:** everyday 400/500 orders come in this website \[Company Name Withheld\]
    :)


    **Hussain:** But how you got DB login info


    **Ferizi:** penetration after penetration


    Injection after injection


    Ferizi, who was 19 years old when he committed these crimes, would later be extradited
    to the United States, tried, convicted, and sentenced to 20 years.


    **Bo Chou has been** eagerly following Ferizi’s story. He has settled into a modest
    apartment provided by his new employer. His managers overlooked a number of holes
    in his resume to give him a job monitoring for insider threats, because they couldn’t
    find anyone else with the skills to do the job. They have sophisticated software
    tools that help him visualize the activity of all of the company’s employees.


    He is like an ex-smoker who frequently seeks out information confirming the wisdom
    of his decision. And Ferizi’s case is just another one of those reference points,
    an example of what can happen to you when you go bad, when you pick up that cigarette
    again.


    He knows it’s not the same, though. There are always a few smokers who live to
    be a hundred. And this sometimes keeps him up at night.


    When he thinks about what could have been, he often goes back to one of his former
    associates: Nat Oren, an Israeli hacker who seemed to embody this moral ambiguity
    so perfectly.


    Israel itself seemed to be churning out Nat Orens, in fact. It’s easy to become
    a cybersecurity expert in Israel, as easy as getting a degree in English in England
    or business management in New York or comparative studies in Portland, Oregon.


    Cybersecurity education starts in earnest in middle school there, and in many
    cases, even earlier. The population is small, agile, security-minded, and entrepreneurial.
    Nearly everyone gets military training. And in many ways, they dominate cyberspace.
    Proof, on a larger scale, that tight, small, and smart in the world of hackers
    may win out over big and sprawling any day.


    Nat conducts detailed research on private online terrorist networks. He has several
    LLCs and S-Corps to his name, which he established by the time he was in his mid-20s.


    He is also a frequent buyer on the dark marketplace of material nonpublic information,
    most of the time stolen by other hackers from law firms and banks. He uses this
    information in order to conduct a tidy one-man insider trading business. He buys
    the kind of data Bo used to provide on the dark web, discreetly.


    Nat is one of the few people Bo keeps in touch with. Bo expects Nat will never
    get caught. Because unlike in the massive operation behind the hacks against NOW
    Bank, this Israeli is content with pocketing only a few million dollars here and
    there. Nat prefers to focus his life’s work on hunting terrorists. He justifies
    his cybercrime by saying it helps fund this endeavor. Bo can’t hold that kind
    of morality against him—it’s a higher justification than his own ever was.'
