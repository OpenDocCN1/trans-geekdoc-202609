- raw: '**PRIVATE KEY:** A cryptographic key that must be kept confidential and is
    used to enable the operation of an asymmetric cryptographic algorithm. The secret
    part of an asymmetric key pair that is uniquely associated with an entity.


    **PUBLIC KEY:** A cryptographic key that may be widely published and is used to
    enable the operation of an asymmetric cryptographic algorithm. The public part
    of an asymmetric key pair that is uniquely associated with an entity.


    **PUBLIC KEY CRYPTOGRAPHY:** A branch of cryptography in which a cryptographic
    system or algorithm uses two uniquely linked keys: a public key and a private
    key (a key pair).


    **RECOVERY:** The activities after an incident or event to restore essential services
    and operations in the short and medium term and to fully restore all capabilities
    in the longer term.


    **RED TEAM:** A group authorized and organized to emulate a potential adversary’s
    attack or exploitation capabilities against an enterprise’s cybersecurity posture.


    **REDUNDANCY:** Additional or alternative systems, subsystems, assets, or processes
    that maintain a degree of overall functionality in case of loss or failure of
    another system, subsystem, asset, or process.


    **RESILIENCE:** The ability to adapt to changing conditions and prepare for, withstand,
    and rapidly recover from disruption.


    **RESPONSE:** The activities that address the short-term, direct effects of an
    incident and may also support short-term recovery.


    **RISK ASSESSMENT:** The product or process that collects information and assigns
    values to risks for the purpose of setting priorities, developing or comparing
    courses of action, and informing decision-making. The appraisal of the risks facing
    an entity, asset, system, or network, organizational operations, individuals,
    geographic areas, other organizations, or society, including determining the extent
    to which adverse circumstances or events could result in harmful consequences.


    **RISK MANAGEMENT:** The process of identifying, analyzing, assessing, and communicating
    risk and accepting, avoiding, transferring, or controlling it to an acceptable
    level considering associated costs and benefits of any actions taken. These actions
    may include (1) conducting a risk assessment; (2) implementing strategies to mitigate
    risks; (3) continuously monitoring risk over time; and (4) documenting the overall
    risk management program.


    **ROOTKIT:** A set of software tools with administrator-level access privileges
    installed on an information system and designed to hide the presence of the tools,
    maintain the access privileges, and conceal the activities conducted by the tools.


    **SECURITY PROGRAM MANAGEMENT OR PROJECT MANAGEMENT:** Work where a person manages
    information security implications within the organization, a specific program,
    or other area of responsibility, to include strategic, personnel, infrastructure,
    policy enforcement, emergency planning, security awareness, and other resources.


    **SIGNATURE:** A recognizable, distinguishing pattern.


    **SITUATIONAL AWARENESS:** Comprehending information about the current and developing
    security posture and risks based on information gathered, observation, analysis,
    knowledge, and/or experience. In cybersecurity, comprehending the current status
    and security posture with respect to availability, confidentiality, and integrity
    of networks, systems, users, and data, as well as projecting future states of
    these.


    **SOFTWARE ASSURANCE:** The level of confidence that software is free from vulnerabilities,
    either intentionally designed into the software or accidentally inserted at any
    time during its life cycle, and that the software functions in the intended manner.


    **SPAM:** The abuse of electronic messaging systems to indiscriminately send unsolicited
    bulk messages.


    **SPOOFING:** Faking the sending address of a transmission to gain illegal or
    unauthorized entry into a secure system. The deliberate inducement of a user or
    resource to take incorrect action. Impersonating, masquerading, piggybacking,
    and mimicking are forms of spoofing.


    **SPYWARE:** Software that is secretly or surreptitiously installed into an information
    system without the knowledge of the system user or owner.


    **SUPPLY CHAIN:** A system of organizations, people, activities, information,
    and resources for creating and moving products, including product components and/or
    services from suppliers, to their customers.


    **SYSTEM ADMINISTRATOR:** The person who installs, configures, troubleshoots,
    and maintains server configurations (hardware and software) to ensure their confidentiality,
    integrity, and availability. Also manages accounts, firewalls, and patches and
    is responsible for access control, passwords, and account creation and administration.


    **TABLETOP EXERCISE:** A discussion-based exercise where personnel meet in a classroom
    setting or breakout groups and are presented with a scenario to validate the content
    of plans, procedures, policies, cooperative agreements, or other information for
    managing an incident.


    **THREAT:** A circumstance or event that indicates the potential to exploit vulnerabilities
    and to adversely impact organizational operations, organizational assets, including
    information and information systems, individuals, other organizations, or society.
    May include an individual or group of individuals, an entity such as an organization,
    or a nation, action, or occurrence.


    **THREAT ACTOR:** An individual, group, organization, or government that conducts
    or has the intent to conduct detrimental activities.


    **THREAT ANALYSIS:** The detailed evaluation of the characteristics of individual
    threats. Cybersecurity work that includes identifying and assessing the capabilities
    and activities of cybercriminals or foreign intelligence entities and producing
    findings to help initialize or support law enforcement and counterintelligence
    investigations or activities.


    **THREAT ASSESSMENT:** The product or process of identifying or evaluating entities,
    actions, or occurrences, whether natural or man-made, that have or indicate the
    potential to harm life, information, operations, and/or property.


    **TICKET:** In access control, data that authenticates the identity of a client
    or a service and, together with a temporary encryption key (a session key), forms
    a credential.


    **TRAFFIC LIGHT PROTOCOL:** A set of designations employing four colors (red,
    amber, green, and white) used to ensure that sensitive information is shared with
    the correct audience.


    **TROJAN HORSE:** A computer program that appears to have a useful function but
    also has a hidden and potentially malicious function that evades security mechanisms,
    sometimes by exploiting legitimate authorizations of a system entity that invokes
    the program.


    **UNAUTHORIZED ACCESS:** Any access that violates the stated security policy.


    **VIRUS:** A computer program that can replicate itself, infect a computer without
    user permission or knowledge, and then spread or propagate to another computer.


    **VULNERABILITY:** A characteristic or specific weakness that renders an organization
    or asset open to exploitation by a given threat or susceptible to a given hazard.


    **WEAKNESS:** A shortcoming or imperfection in software code, design, architecture,
    or deployment that, under proper conditions, could become a vulnerability or contribute
    to the introduction of vulnerabilities.


    **WHITELIST:** A list of entities that are considered trustworthy and are granted
    access or privileges.


    **WORM:** A self-replicating, self-propagating, self-contained program that uses
    networking mechanisms to spread itself.


    ## Appendix B


    Epilogue Explained


