- raw: 'His suit is crisp, dark navy seersucker, because it’s hot this time of year
    in Romania and air-conditioning is hard to find. Leather shoes from a small, private
    shop in London. He’s driving a black BMW, late model. He wants it to look like
    he bought it and has owned it for a long time. Practical. Not someone who needs
    to impress. Not someone who leases.


    There’s nothing in the paper that interests him. Nothing about Valery Romanov,
    at least not today. He had heard through the grapevine that Romanov had fired
    his lawyer. Again. Knowing what Sig knows about Romanov, America might not have
    enough lawyers to satisfy the man’s ego. He picks up *The New York Times* and
    finds something that interests him—an article about something serious possibly
    happening at NOW Bank. Must have been a leak there. Tied to northern Italy, the
    paper says. He laughs. Ridiculous. Some Russians, Israelis, Chinese businessmen
    maybe. Northern Italy? Unlikely.


    He contemplates briefly. Italy, if it was true at all, would just be a smokescreen.
    A server in Venice or Rome set up to receive pings from another server in Tel
    Aviv and a third in Beirut, a fourth in Japan.


    “What’s so funny, boss?” the waiter asks as he takes a seat at the table next
    to Sig.


    “Italians. Reporters.”


    “You Italian?”


    “Yes.” He says it without hesitation.


    “I thought you were German. Your accent is very German.”


    “I had a German uncle who taught me English.” Another easy lie.


    “You’re not a reporter, too?”


    Sig laughs, raises his sunglasses to his head. “Of course not.”


    “Reporters, they always lie, no?”


    “I don’t think it is that they lie. No, no,” Sig says, settling into his chair.
    He spreads his arms wide and knits his fingers together behind his head, a gesture
    of expansive command of the environment. “They are like teenage boys watching
    pornography. They look and say, ‘*See, they are fucking! Now, she’s had an orgasm!
    Look!*’ ”


    The waiter laughs and sips his coffee.


    “And in five minutes they are finished. They think they have witnessed the act
    of sex, that they could describe it to someone else. But they cannot. They see
    only what the actors and producers and cameraman and Viagra maker and plastic
    surgeon want them to see. And they talk about the long hairless legs, the perfect
    fake tits, then they drink beers together and congratulate themselves for being
    experts on fucking.”


    Everything is an illusion. Sig hasn’t hacked a computer in a decade but is regarded
    as an influential hacker. He has never worn a hooded sweatshirt in his life. He
    may have a personality disorder, but he definitely doesn’t have emotional problems.
    He doesn’t need a therapist like this American Mr. Robot. He does not suffer from
    depression. He does not lack for friends or female company. He is never awkward,
    but as smooth and soft and familiar as his gently worn leather BMW seats.


    Today, he is headed to a new job in a village near Arnica Valka. He already knows
    a lot of carders who work there, many of whom have made money off Romanov’s instruction
    and processes. Some of them are very good. He wants to pull them into a more cohesive
    unit, and they want the same thing. Some people are amenable to having a boss.
    Start-ups need CEOs. Even criminal ones.


    *Germany is becoming a surveillance state*, he thinks. He traces over a story
    about the BaFin, Germany’s financial regulator, buried on the back page of the
    B section. Something about them coming down hard on Deutsche Bank for bad culture.
    He has insiders at Deutsche Bank. *Bad culture*. Oh, they have no idea.


    BaFin, Sig had real problems with. Regulate this, regulate that, squeeze all the
    fun and ingenuity out of the entrepreneurial process. Root out insider threats.
    Give power to whistleblowers. But one man’s insider threat is another man’s whistleblower.
    Surveil them all!


    Criminals are ahead of everyone. He pulls out another Australian paper.


    “Newspapers,” the waiter says. “I see you like the newspapers. Newspapers are
    good. Everyone today with the iPhones.”


    “I guess I’m just paranoid. Don’t want to be tracked.” Sig smiles. An infectious
    smile, one that leads to the eyes.


    “They can do that, you know. That’s what I’ve heard.” The waiter’s voice is a
    low whisper. “The *Russians*.”


    “Oh, well, what can you do? I’m not really into these things. I like the feel
    of the paper on my fingers.” A bigger smile. He orders a slice of spinach and
    cheese pie and turns back to his reading.


    He bought the papers on his commute from Hamburg. He’s been reading nonstop about
    the burgeoning market for a new kind of financial instrument: ransomware. Malware
    that locks up a person’s files and generates an encrypted key that the person
    must then buy in order to access their own files. He’s trying to gauge how it’s
    perceived in the real world.


    It is a flawless business proposition, he believes. The world is filled with little
    law firms and consulting firms and one-man shops that need to work every day,
    every hour, gears constantly grinding. They will pay the $500 to get back to work
    if the gears stop, especially when their yearly revenue is in the millions. They
    can pay this modest sum again and again, all over the world.


    Ransomware is new, and has been percolating quietly, below the surface, for about
    a year. He hasn’t yet figured out the best way to monetize it. But the market
    for carding is changing, becoming too crowded, too boring. The fact that Russia
    allowed Romanov to get extradited proved that whatever the big carders were doing
    is no longer important, that carding itself is no longer important. And Sig likes
    to be important.


    A widespread ransomware attack had hit media outlets and the Australia Post, a
    national mail courier based in Melbourne. So of course, they are reporting on
    it. Inside the second paper is a screenshot of a PowerPoint slide from the ransomware
    attackers. Sig studies it—green text on a black background. It is spare, rife
    with misspellings, ugly. “Once you’ve paid, than you can have your files back,”
    it reads. Sig shakes his head. Hackers can be so inelegant.


    The newspaper doesn’t say whether the Post paid the ransom, which he assumes means
    they have. Imagine how much more they might have paid if they thought they were
    dealing with a serious criminal enterprise? Not some foreign kids who don’t know
    the difference between “then” and “than.”


    Sig sets down the newspaper. Gets out a napkin. Asks the waiter for a pen. Begins
    to sketch out a plan for a ransomware business.


    **Sig is deeply interested** in the concept of criminal organizations as business
    organizations. And as cybercrime goes, it can be one of the most challenging problems
    to overcome in turning a profit. Imagine a version of any American office, include
    all the drudgery, paperwork, sniping, and backstabbing, but add to it an entire
    workforce made up of people with a very loose relationship with the law, and subtract
    much of the face-to-face interaction.


    Sig appreciates the advantages organized cybercrime has over traditional, Mafia-based
    organized crime. First, there are hardly any laws that robustly prohibit the kinds
    of crimes they will be committing. This is especially true in the countries of
    Eastern Europe. It’s not necessary to involve oneself in the messy business of
    bribing police or prosecutors when nobody’s looking for you.


    Second, there is more churn and more opportunities for small, independent criminal
    groups to form. For those few big shots, like Valery Romanov, who happen to be
    incarcerated, their ability to run a criminal enterprise ends. That’s because
    their access to computers is shut off, and unlike the old-school mafiosi, they
    can’t conduct their business merely by prison phone.


    This means new leaders can take their place. Sig is hoping he’s among them because,
    unlike the Mafia, these individuals don’t need to come from the same family.


    **Sig also knows a** fair number of ex-criminals who went on to do legitimate
    work, especially after they did time in prison.'
