- raw: 'Lydia DeBuffet conveys a very specific type of wealth: confident but never
    flashy. She’s unmistakably beautiful, but not sexy. Grievances are closely held
    and never, ever aired in public. Lydia is deeply intelligent, aggressively well
    connected—more than she will ever let on—and she can bevel the edge of a Carrara
    marble countertop with her glare.


    In many ways the asset management network is like her: utterly impenetrable. Unless
    you have $250 million. Or look like you do. Or, in the case of Belvedere’s contacts
    in Tel Aviv and Russia, have other ways to get in.


    Finally, there’s the corporate organization. Compared to asset management’s refinement,
    corporate is the Lotto-ticket buying cousin from the old country. Bob Raykoff
    sits in corporate. When he meets Lydia DeBuffet for the first time, it does not
    go well. Because one of them holds all the cards—the one who makes the money—and
    it’s not him.


    Within the company, corporate is referred to as a “cost center.” Meaning it has
    a negative bottom line and is a drain on resources. Cost centers don’t generate
    revenue, they only incur costs.


    Cybersecurity is also a cost center. However, the DDoS attacks demonstrated value
    in what cybersecurity professionals do. But value and making money are two very
    different things. People like Caroline will never have the status of a less-experienced
    banker who happens to bring in the bucks. Most people who work in the corporate
    setting understand this implicitly, but this reality can take time to get used
    to.


    Technology is both corporate and a cost center. After the financial crisis, the
    bank had the unenviable task of integrating, practically overnight, the technology
    from several other large investment banks, retail banks, commercial banks, and
    asset managers who were thrown together at once—all on a cost center budget. The
    bank also had to integrate thousands of potentially disgruntled employees who
    weren’t thrilled about the work, a huge risk to cybersecurity.


    **At about the same** time in mid-2014, in a prison cell in Seattle, Valery Romanov
    contemplates the indictment against him. The indictment is sealed and not yet
    available to the public, but he knows why he’s being held because he has a copy.
    It’s his indictment.


    He has been accused of multiple violations of the U.S. Computer Fraud and Abuse
    Act. He is accused of abusing computers and the internet, two entities he thinks
    deserve far less abuse than humans. He’s not particularly worried. Such crimes
    normally garner a sentence of five years or less, so it’s not like he will be
    here for decades.


    *Beginning at a time unknown, but no later than October 2, 2009, and continuing
    through on or about January 20, 2011, within the Western District of Washington
    and elsewhere, Valery Romanov, aka NTrain, aka Roman Valerov, aka Nikolai Rubenfeld,
    aka nCux, aka bandylegs, aka shrork, aka Tokyo Joe, aka peacemaster, aka Tupac
    (hereinafter Valery Romanov), and others unknown to the grand jury, knowingly
    and willfully devised and executed, and aided and abetted a scheme and artifice
    to defraud various financial institutions, including but not limited to NOW Bank,
    Boeing Employees’ Credit Union, Chase Bank, Capital One, Citibank and Key Bank.
    The object of the scheme and artifice was to “hack” into the computers of retail
    businesses within the Western District of Washington and elsewhere; to install
    malicious computer code onto those hacked computers that would effectively steal
    the credit card numbers of the victim businesses’ customers; to market and sell
    the stolen credit card numbers on criminally inspired websites, for the purpose
    and with the intent that the stolen credit card numbers would then, in turn, be
    used for fraudulent transactions across the United States, and in foreign countries.
    By way of this series of criminal actions, the defendants intended to and did
    generate and receive millions of dollars in illicit profits that they then converted
    to their own personal benefit and use*.


    He scans the indictment again. And again. And again. Reads it in full. Makes a
    mental note of the things they got wrong, but does not laugh about them. Here,
    in this cell, they have taken away his computers. There is nothing to laugh about.
    He has nobody to ping, nobody to text to commiserate with about this injustice.
    He cannot take selfies with stacks of cash to balm his pain. He’s alone with the
    papers and his own mind.


    The printed pages feel foreign to him. He doesn’t like how thick and heavy the
    paper feels, how difficult it is to interact with the words. Sometimes he swipes
    his fingers across it by mistake instead of turning the page with his hands. There
    is no depth to it, no endless electronic well to dive into. If Valery Romanov
    were the anxious type, which he is not, he would be feeling it now. He has reached
    the end of the 40-page indictment. He goes back again to the first sentence. His
    favorite sentence:


    *Beginning at a time unknown*.


    This is the government’s biggest mistake. Because when did it all begin for Valery?
    What made Valery the most influential hacker in the world? He goes over, in his
    mind, some of the options, but none of them is a time unknown. He knows all of
    them.


    1984\. Maybe that’s when it began, when he was born and lived in a 1,000-square-foot
    room in Vladivostok, Russia. A port town on the Sea of Japan, 5,778 miles from
    Moscow, a two-day, 120-stop train ride on the Trans-Siberian Railway. He shared
    the room with his single mother and three other families.


    His father left when he was two. He learned how to use computers at a young age.
    Buried his heart and his life in them. He sank into them more deeply every time
    his alcoholic mother got drunk and ignored him. She could be sitting in the same
    room yet be locked far away in her head, farther even than Moscow.


    He would grind, grind, grind into the code, plunging deeper into the internet
    just to see how deep it went. Digital technology slowly but surely began spreading
    its tendrils everywhere, giving him the pleasure of diving into an ocean that
    kept getting more interesting as he went. In those early years, it was so exciting
    to see it grow. Into shops and schools and private clubs, government agencies,
    other countries, other worlds.


    Wherever the internet went, Valery could go, too. Into homes, gyms, and Army installations.
    Into ATMs and the little tiny boxes where people swipe their credit cards. Especially
    the little boxes.


    He showed unusual proficiency with computers. His teachers optimistically talked
    about a nice job for him in technology. Maybe he could have a good paycheck right
    out of high school and help his mother, they said. He had bigger ambitions. To
    be an entrepreneur. Own a start-up. Have equity.


    At the age of 17, Valery came home from school one day and found his mother had
    drowned in the bathtub. Whether it was deliberate or not made little difference
    to him.


    After the funeral he accepted that his father was never coming back. With nobody
    left to love or hate, to impress or distress, Valery went in a different direction.
    Down, down, deeper into the internet, to a place with no bottom.


    To his surprise, Valery found himself there. Many selves, actually. Cocky and
    poetic as his hero Tupac Shakur one day, smooth and cool as Drake the next. He
    kept stacks of cash in his closet. He drank too much vodka and sang the lyrics
    to his favorite Tupac song, “Starin’ Through My Rear View.”


    The U.S. government was right. Valery knowingly and willfully invented the machinery
    that revolutionized how credit card numbers are stolen. Those who noticed a fraudulent
    charge on their credit card in those early years of the internet may have been
    reimbursed by the bank, but Valery was in on it, too. Every last-minute Christmas
    purchase and late-night Taco Bell run, Valery was there. He was inside every swipe
    of the card. He was everywhere and everyone and nobody at all.'
