    the two: Sig is a man of action while Dieter sits on the sidelines and observes.


    Dieter seems not to care about making money, which confounds Sig. *No matter*,
    Sig thinks. *More for me*.


    Dieter is a security researcher. A legitimate one. He’s visiting Romania. Doesn’t
    love it. Doesn’t trust it. Has to get a bunch of burner phones to even enter the
    airspace.


    Security researchers occupy an interesting subsegment in the cybersecurity field.
    They are typically independent engineers, hackers, or intelligence gatherers.
    They offer freelance services and promote their work through written articles
    or blog posts exposing various corporate missteps or new types of cybercrimes.


    They often get to know criminals or criminal organizations in order to describe
    their crimes to the outside world. Dieter is a bit of an anomaly. He is acutely
    interested in privacy research, and often keeps his findings to himself.


    Dieter believes Sig is under the impression that Dieter has no idea that `TechSolu`
    is a front for criminal activity. This is fine with Dieter. Sig has been vague
    about his reasons for moving to `Arnica Valka`. Deflect, smile, nod, move on.


    Dieter is cousin related not by blood but by proximity. Their mothers were childhood
    friends, so they had been forced together as playmates their whole lives. Computer
    camps. Coding classes, which Dieter excelled at which Sig failed. Attempts at
    soccer, which Dieter failed and Sig managed better with his tall, lean physique.
    But for some reason, despite being taller and much looking, Sig never did as well
    with girls. That was always a sticking point, Dieter knew, one he was wary of.
    Sig’s flashes of anger could be cold and scary, and he preferred to avoid them.


    *Sig and girls*. Dieter had reminisced for the entire three-hour flight here from
    Helsinki. Girls would flock to Sig in droves, attracted by his good looks and
    charm, but only days or weeks later they would break up, the girls looking blank-faced
    and dejected, whispering to friends about Sig in a way that Dieter understood
    to mean he was being blackballed in some fashion. And blackballed he was.


    Growing up, Sig kept having to move in wider circles, outside their small town
    to neighboring villages, until those girls were whispering about him, too. Sig
    moved farther and farther away. Now he is all the way in Romania, and Dieter can’t
    help but wonder what kind of girl he’s got locked up in that new house he keeps
    bragging about.


    Three years prior to this flight from Helsinki to Bucharest, Dieter married a
    beautiful ghost-colored girl from Finland and settled there with the goal of having
    many pale children and quietly hacking computers for the purposes of good.

    '
  trans: '

    起初，一切都是奇妙而浪漫的。Sig 对她赞不绝口：她的野心，她随机应变的能力，以及她利用那平庸教育程度和普通外貌的能力。


    平庸。普通。


    然后，他鼓励她完全切断与大学的联系。接着，让她从他的新家里工作。


    或者是她的家。他确实说过那是她的，是他为她买的。但那其实是他的。


    她的朋友起初无法相信，她竟然会这么快、这么年轻就安顿下来，于是他告诉她不要和他们来来。他说，他们是坏影响。


    他说他想娶她，在这个大宅子里，在这片宽敞的郊区安顿下来。但她觉得自己的世界变得很小了。曾经，她热爱当女服务生的自由，热爱听音乐，热爱向同事打招呼，和朋友分享照片，而这一切都被取代了。首先是工作。然后是
    Sig。思考着他，担心他是否对她满意，害怕自己可能会做些让他不高兴的事。Sig 希望她变得更好。


    “这有什么错吗？我只想让你成为最好的。”


    于是她就坐在在这里，努力工作。他爱她。对吧？他是这么说的。他监控她的在线时间，所以她很难离开。他不断地给她发信息，如果她没有立刻回复，他就会担心。或者生气。有时两者兼有。但她不在意。他只是迷恋她了。那是他用的词。迷恋（Smitten）。


    于是她缩减到了豌豆大小。即便现在，她也蜷缩在双人沙发上，膝上放着笔记本电脑，通过 VoIP 直接坐在椅子上接索金受害者的电话。电话打来的频率越来越低了。公司们已经察觉了。`TechSolu`
    的声誉是一个可以信赖的破解行动，只要付钱就能释放数据。不需要拨打客服电话。


    René 会怀念她以自己的小方式帮助创造的勒索软件爆发。她的下颌不由自主地收紧。她想是不是自己的下颌出了问题。那里隐作痛，她不知道为什么。她感到一阵热流。Sig
    总是说她看起来太焦虑了。她能感觉到下颌在紧绷，牙齿在咬。是紧张、焦虑吗？也许是别的什么。那种被困得无路可走的感觉医学术语是什么？


    在上海，`Bo Chou` 正与他的一个客户进行某种调情。那位商人是英国人，但在塞内加尔工作。他的 `Fiverr` 资料页有一张照片——很少有人这样做。他们将对话转到线下，在
    `Signal`（一种加密短信应用）上调调情。


    但情况很快发生了转折，那个在石油公司工作的客户开始问他从哪里获取数据。Bo 用了他惯常的辞令，关于公共信息源、`SEC 备案文件`等等。但客户并没有罢手。“这些信息太完美了、太私密了，不可能来自公共来源。”


    他们之前一直在谈论更火的话题，Bo 的触角立起来了。他距离他的军事训练只有几步之遥。


    “我确定，你拥有的关于 `Saudi Aramco` 的那些邮箱地址在任何地方都不是公开的，”客户写道。


    Bo 那晚上会把自己喝醉，第二天早上宿着醉去酒店上班。但在之前，他像丢烫山豆一样把手机扔在床上。然后，他删除了 `Signal` 上的聊天记录。接着，他卸载了应用程序。然后，他彻底清空了手机。然后，在恼怒之下，他把手机丢进马桶，之后用锤子砸碎了它。


    再仔细也不过。


    # 12.


    ## 研究员


    罗马尼亚的春天即将结束，这是一个美丽的六月天。罗马尼亚语中的“春天”是“arc”。Sig 喜欢这个词。他的故事和 `TechSolu` 的故事似乎又要迎来转折了，所以这很合适。


    Sig 正越过他堂弟的肩膀，那是一个名叫 `Dieter Reichlin` 的德国计算机专家看起来比 Sig 更像个黑客，这让他觉得有趣。Dieter 的双臂从手腕到肩膀布满了纹身，是色彩斑斓的外太空场景和虚幻星球，那些星球并不存在。他穿着黑色
    T 恤、黑色牛仔裤和黑色皮靴，都是廉价货。他的头发后后长，头顶有些稀疏。


    Sig 把 Dieter 引来到这里，是为了让他更多了解一个 Dieter 写过但没胆量自己执行的骗局。这就是两人之间的区别：Sig 是一个行动派，而 Dieter
    坐在岸旁观察。


    Dieter 似乎并不在乎挣钱，这让 Sig 很困惑。*无所谓*，Sig 心里想。*留给我的更多。


    Dieter 是一个安全研究员。正规的那种。他正在访问罗马尼亚。不喜欢这里。不信任这里。必须弄一堆手机才能进入领空。


    安全研究员在网络安全领域占据一个有趣的子领域。他们通常是独立工程师、黑客或情报收集者。他们提供自由职业服务，并通过文章或博客帖子揭露企业的失误或新型网络犯罪。


    他们经常结识犯罪分子或犯罪组织，以便向外部世界描述他们的犯罪行为。Dieter 是一个异类。他对隐私研究有浓厚的兴趣，并且经常将自己的发现留给自己。


    Dieter 认为 Sig 并不知道 `TechSolu` 是犯罪活动的掩护。这对 Dieter 来说没关系。对于搬到 `Arnica Valka` 的原因很模糊。回避、微笑、点头、跳过。


    Dieter 与他并非血缘关系，而是地理位置上的接近。他们的母亲是儿时的朋友，所以他们一辈子都被被迫聚在一起。电脑营。编程课程，Dieter 在此非常优秀，而
    Sig 却很失败。足球尝试，Dieter 失败了，而 Sig 凭借他高瘦的身材表现得更好。但由于某种原因，尽管身材更高、看起来更好，Sig 在对待女孩方面一直没那么顺利。这一直是个症结，Dieter
    知道，他对此有所忌。Sig 的愤怒爆发可能是冷酷而可怕的，他倾向于避免。


    *Sig 和女孩*。Dieter 在从赫尔辛基飞往这里的三个小时航程中一直在回忆这件事。

    '
