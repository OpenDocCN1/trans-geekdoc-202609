  trans: '

    他要求出租车司机掉头返回酒店。司机对在没有报酬的情况下运送乘客感到不耐烦。Bo 向他保证会付钱的。Bo 回到酒店，司机继续在窗外喋喋道道。Bo 给司机了一笔额外的小费，因为他知道拿回那个美国人的护照才是更大的胜利。


    这位商人当然感到很高兴。他试图给 Bo 小费作为他劳动的报酬，但通过一系列鞠躬，Bo 传达了帮助客人是他的荣幸，并表示如果客人愿意，可以给酒店经理写一封表扬信。Bo
    是维护他主业工作声誉的大师——如果他想保住自己的兼职，这是很有必要的。


    Bo 对这个哥们儿再别无其他要求了。你怀疑这其中有什么阴险的事情吗？Bo 如果大声说出来会脸红，但他坚定地相信“不要在吃饭的地方拉屎”这一准则。他不会打扰自己酒店的客人们。


    但他会黑所有其他人。不是用那种粗暴的 `Chinese` 方式，也不是为了什么糟糕的国家利益原因，而是平滑、优雅，就像以色列人或者一个像罗曼诺夫那样不在乎钱的优秀俄罗斯人做的那样。他从不是
    `best` 黑客。但他总是试图让自己变得最有风格。


    盗刷信用卡（Carding）真的不适合他，太非法了。东欧人带着他们的犯罪组织、规则和商业结构，变得太具有攻击性，难以从远程合作。


    由于他热爱数据，所以他专注于此。他对此非常痴迷，收集、解析数据，让它们看起来非常精美。如果没有能够解读数据的人，数据就毫无用处，而这种勤奋的人非常稀见。他知道自己有一个利基市场。数据已成为一种宝贵的商品，`the`
    商品，如果你知道如何正确展示它，它比信用卡号更有价值。


    每家大公司都是这么说的。他知道有些公司，比如 `Facebook`，已经成功地从中赚了钱。他从后台可以看到这一点。但大众似乎并没有意识到，所有这些数据本质上都是没用的。除非你关心政治和选举之类的事务。而
    Bo 并不。太世俗了。


    所以，Bo 开始在经营酒店之余，向前往上海会议中心的旅行者索取信息。


    这令人兴奋，每周都有新的行业——家居装修、医疗设备、家用电器、油漆、电脑。列表一直没完没了。金融公司。非营利组织和非政府组织。


    参加活动的人是国际商务专家，完美的目标。他使用一种常见的 `malware`，可以帮助他尽可能快地获取关于公司的大量信息。他通过散布在会议中心的 `USB`
    设备分发这些程序，让毫无防备的专业人士很容易捡起并直接插入他们的电脑中——那些存有所有电子表格和专利客户名单的电脑。


    Bo 在南方找到了一个极佳且廉价的供应商，以大约 100 美元的价格卖给他数千个 `USB` 存储设备。周一早晨，他来到一个销售大量量产小物件的区域，买了几个漂亮、抛光、看起来现代的银碗。


    然后，Bo 在每个设备上加载了 `malware`。他制作了一个看起来非常专业的告示牌，颜色和字体模仿任何会议的赞助商，并将 `USB` 设备放在精美的银碗里。“免费
    `USB` 存储。欢迎光临！”他悄悄地将它们留在酒店大堂、会议中心食堂，或者如果他能溜进去的话，就放在新闻发布室，那里是所有媒体休息和开会的地方。


    在这一计划的早期，会议者捡起设备并使用的频率比现在高得多。许多人已经学会了免费赠品可能存在风险，Bo 对此并不在意。因为捡起的人已经足够了。他不贪婪。


    一旦加载到 `USB` 驱动器上的简单 `malware` 安装到他们的电脑上，Bo 就会从他们的机器上抓取尽可能多的电子表格——就是电子表格。当这些旅行者回到纽约、旧金山、伦敦或布里斯时，`malware`
    可能会在公司团队的例行扫描中被发现，但那时已经太晚了。Bo 将拥有他所需的一切，包括个人联系人的所有电子邮件和个人详情。

