    迪特从未发表过他关于恐怖主义的论文。杂志编辑认为他关于网络恐怖分子中反复出现的优越感主题的切入点太“虚”了。


    他把论文发给了通过职业网络认识的一位记者听听她的意见。对方花了很长时间才回复他。她粗鲁地回答说，她的报纸不收投稿。


    后来她给他来电道歉。说她对他还有一些其他问题想请教，关于罗马尼亚和勒索软件的。


    他不怎么信任记者。他权衡是否要和她谈谈。提到 `Sig` 时，他不认为自己再也见不到他了。


    他销毁了在 `Sig` 电脑上植入的恶意软件，他的表弟消失在了虚无之中。


    别碰。`Sig` 只想互不干涉。被动收入比任何主动收入都好。`Bitcoin` 很快就会飙升。他手里有很多。他还想要更多。


    米凯尔·根特是 `TechSol` 第一个也是最后一位留下的员工；其他人都离开了。他们中的一些人想奇 `René` 发生了什么。`Sig` 告诉他们那个臭女人跟着另一个男人跑了。其中一个人大声质问他是不是杀了她。然后他们就都消失了，去了其他企业。


    有了 `cryptomining`，一切都是被动的。`Mikael` 教过他如何感染电脑。像控制 `botnet` 一样控制它们，但它们做的只是产生加密货币。每天都有新类型。如果他们能利用整个数据库，而
    `Insite` 正在波兰建立基地，他们就会富了。


    如果他们能收买一些权力，就能让 `Bitcoin` 顺着多瑙河流。


    `René` 审阅了 `Muhammad` 发给她的经理职位描述。里面充满了难以理解的术语和技术黑话。有大量关于云服务器、红-黄-绿状态以及公司遵循的其他其他协议的内容。“必须具备
    PMP 或相关证书”，提到了项目经理所持有的认证，而 `René` 并没有。“**绝对必须具备** CISSP 或 CERM”，提到了 `René` 同样没有的认证。“**必须理解**
    Python”，提到了一种 `René` 不懂的编程语言。


    她认为这行不通。但最后一点给了她一些希望：`必须是 NINJA（忍者）`”。


    `Henry` 在推车里睡觉。这是她每晚让他安静下来的办法。她用两只手打字，脚来回地推着推车，来回去。她看了他一眼。做了一个小武术动作，“忍者”。


    `René` 拿着她那份贫乏、满是漏洞和半真假假的简历，把它放了进去。她对每一页进行了排版设计和扫视。她添加了微妙的阴影和颜色。她增强了图形以支持最佳的可读性。她将简历同时提交给了职位描述中列出的招聘人员和高管。


    第二天，招聘人员给她打了电话，说她没有胜任工作的经验。五分钟后，负责的高管也给她打了电话。“听着，你能一直做那样的演示吗？这太棒了。这是你能做到的水平吗？”`René`
    笑了。她从他的声音就知道她可以。那是对她以前生活的怀旧。她给出了肯定的回答。在 `ransomware mitigation` 方面的经验。


    “噢，真的吗？”“但作为项目经理来处理问题，这才是我们想要的。从项目管理的角度来看，我们需要为 `ransomware` 建立一个灾难恢复计划；我相信你可以在这方面提供帮助。“我完全可以，先生。”“好了，让我给招聘人员打电话告诉他们。他们和我们不在一个频道。”


    几个月后，`René` 在新工作中过得风生水起。经理甚至要派她去纽约参加一个会议。在她离开期间，`Henry` 会和 `Muhammad` 以及他们的孩子待两天。这是她第一次在离开时让他放心。她每晚让他安静下来。她用两只手打字，脚来回地推着推车，来回去。她看了他一眼。做了一个小武术动作，“忍者”。


