- raw: 'Around that same time, Sig got into some kind of trouble in Germany and ran
    off to Eastern Europe, and that’s when the phone calls and visits stopped. Whether
    the trouble was with girls or computers, Dieter was never sure.


    So then Sig was gone. Jet-setting, he said.


    Dieter has ghostwritten a few articles in a German computer academic periodical
    about ransomware and criminal enterprises in Eastern Europe. He writes about social-engineering
    techniques in particular, the ones that involve people pretending to be someone
    they aren’t by email, phone, text, even in-person meetings in order to get something
    from someone else fraudulently.


    In one, where he was credited by name, he wrote about a particular ATM cash-out
    scheme that involved an especially tricky bit of social engineering—in this case,
    very slick fraud, the kind of work that suits narcissists and sociopaths. That’s
    when he got an email from Sig, who was impressed with his research and wondered
    if he’d like to visit Romania. Bucharest is so nice this time of year, he wrote.


    Dieter immediately agreed to the trip. Sig believed it was because his long-lost
    cousin must be bored with his married life and childcare responsibilities, because
    who would enjoy such things?


    Dieter, always the researcher, merely wanted to know what Sig was up to, because
    Sig was a criminal. And Dieter tracks crimes and likes to write about them.


    So around and around they went, making travel arrangements and small talk for
    a few weeks by phone and email, a light waltz of two oppositely charged magnets.


    They settled on a good place to meet—a pub near the Bucharest airport. Dieter
    lies and says he can only spend the day before he has to return home. The plausible
    fiction: he must get back to watch the kids while his wife is on a business trip.


    “That’s terrible,” Sig says.


    “Yes, yes, what can I do? She wants to work, but you know women,” Dieter had whined,
    his wife laughing silently and giving him the finger from the kitchen.


    **Now, here they are,** in this pub in Bucharest. Sig watches expectantly as Dieter
    describes this new type of crime in detail. ATM cash-outs aren’t particularly
    novel, but this particular approach takes it to a new level.


    “It starts like this,” Dieter says. “Let’s say we are dealing with two locations.
    Bucharest in Romania and Tallinn in Estonia. You start with research. Banks have
    different kinds of ATMs, and some of them hold more money than others. Some hold
    up to $200,000. Most hold around $10,000.


    “The $200,000 ATMs have a lot of things in common—they are older, connected with
    banks that don’t have reasonable hours, and are often in areas where people do
    a lot of business in cash. These may be popular areas for mob activity or lots
    of Saudis or something like that. So you find out the First Local Bank of Tallinn
    has one of these big, overloaded ATMs. More research. When does the ATM get filled,
    what time of day? What car company brings the cash? When do they depart? Is the
    bank open or closed at the time? Does it see much traffic on that day?” Dieter
    pauses.


    “You find the optimal location that meets all your criteria. OK, now you have
    your cash-out target.”


    Dieter has created a rudimentary PowerPoint presentation to illustrate this, on
    a crappy seven-year-old laptop. Sig frowns at it, pokes fun at how bad the PowerPoint
    is, comments that he knows somebody who could make it better. Dieter takes a drink
    of lager and ignores him.


    “The next step is getting an account. Let’s say you find a nice, small bank, the
    First Local Bank of Tallinn. It has a branch in Bucharest. So you get a mule,
    somebody you know well, who looks trustworthy. Like you! Not someone with lots
    of tattoos and bad clothes like me.”


    A sheepish smile from Dieter before he continues. “This good-looking mule opens
    an account at the First Local Bank of Tallinn in Bucharest and lists a Tallinn
    P.O. box as their address. They get a checking account with a debit card and a
    modest deposit and a credit card with a modest limit. The debit card and credit
    card for the bank are sent to the P.O. box in Tallinn, where you have another
    person you know, a money mule, pick it up. If you are—or a criminal is—working
    with a big network of people.”


    The next slide is taking a long time to load. Dieter feigns exasperation with
    the old laptop.


    “You know,” he says, “if you don’t like the PowerPoint, I have a video presentation
    that illustrates this crime—it just won’t play on my piece-of-shit computer.”


    Sig sighs, eyeing him cryptically. He reaches into his book bag and gets out a
    new, expensive laptop.


    “Jesus, that thing is beautiful,” says Dieter.


    “You need to treat yourself,” says Sig. “I’m sure budgets are limited with a wife
    and kids. But you need to have the best stuff if you are going to succeed in your
    business. I hope this woman knows that.” Sig smiles pityingly.


    “What can I do?” Dieter shrugs. “You know women.” He tugs at the collar of his
    $2 T-shirt. His face turns red and his jaw tightens. He does his best to pass
    it off as shame, but something about Sig’s casual cruelty sparks his anger, and
    he doesn’t think it’s their history together, not some sort of latent sibling
    rivalry.


    At home, Dieter has a custom-built, state-of-the-art, completely segmented personal
    network. A fully automated smart home. He has three or four laptops far nicer
    than the beater he’s using now. His yearly compensation is in the mid six figures,
    higher if he feels like pushing it. His wife is a successful accountant. Dieter
    doesn’t need to brag about his wealth. Sig’s weakness is his arrogance. Dieter
    knows this so he keeps his emotions in check.


    Dieter gets a USB drive out of his pocket and sticks it into Sig’s computer. Sig
    barely notices. Dieter continues praising the computer, its sleek lines and massive
    memory. He launches the video presentation about the ATM cash-out scheme from
    the memory stick. Unheard and unseen over Dieter’s praise is the fact that a very
    specific, very insidious little piece of custom-made malware is already installing
    itself on Sig’s computer.


    **The delicate little waltz** between the two cousins continues. The video unfolds
    as a nice, clean, beautiful presentation, magically queued up right where Dieter
    had left off.


    “So where was I? Oh yes, if you—or the person in question—is working with a criminal
    network, they will undoubtedly have mules already available in Tallinn for the
    next step. But if it is a smaller organization, usually someone very close to
    the criminal or the criminal himself will make the trip. The mule picks up the
    debit card from the P.O box in Tallinn and activates it, then waits.”


    “Waits? How frustrating!” Sig smiles, focused on the video, paying no mind to
    the USB stick. *Some criminal*, Dieter thinks.


    “Now, the hacking part. Someone needs to install a back door on the bank’s network,
    but discreetly. This can be accomplished with social engineering, convincing a
    system administrator at the bank to give up their login or password. Or phishing
    them. Or otherwise delivering malware that steals credentials. There are a few
    different ways of achieving it; it’s a part of this particular scam that is not
    yet terribly well defined. However the method, you get into the bank’s networks.
    You locate the account associated with the one that the mule just opened.” Dieter
    pauses the video.


    “The target here is the average daily limit for withdrawal and the credit limit
    of the credit card. You tick both of these up very high, to at least $200,000.
    Most accounts have a limit on how much you can take out of an ATM in one day,
    so you have to override that. And obviously, you need to have the highest possible
    credit limit.”


    Sig’s eyes are wide as he focuses on the paused still of the video. Another round
    of lager arrives. “The bank doesn’t catch the change?” Sig asks.'
