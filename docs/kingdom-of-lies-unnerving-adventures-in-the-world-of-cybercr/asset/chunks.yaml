- raw: 'She fantasizes about going somewhere nicer than Romania, someplace really
    far away. In her wilder fantasies she escapes to England, America, the Caribbean.
    She imagines cashing it all in, her and Sig on a nice, warm island somewhere.
    Then maybe the old Sig would come back.


    She is the girl who made those saucy phone calls to technology executives. Who
    shut down their advances with a crisp, cutting word or two. Tastes like chicken,
    ha, ha, ha. Now she is reduced to slicing and dicing her own internal monologue,
    for an audience of one. Well, technically, now two people. A baby. She can hardly
    believe it’s real.


    She stares at the ceiling, rubs her jaw. She has been reading a medical website’s
    recommendations for jaw pain. She has ruled out many of the reasons for it—no
    tooth problems, no loose fillings or flu. The medical site has suggested a strange
    reason for it, one she hadn’t expected: anger. Unresolved anger.


    She ruminates on that point for a little bit. Anger, yes, anger. A strange feeling.


    ## **14.**


    ## The Mother


    **The data isn’t gone. It’s** just locked. Bo Chou is slightly panicked. He is
    the victim of ransomware, and his files are locked. Held captive. His beautiful
    data. He has half an hour to respond to the criminals who have attacked him. First
    the spy from Senegal, and now this. *Lie down with dogs, get fleas*, he thinks.
    It’s too much.


    The ransomware in question is called CryptoLocker, and he’s done all the quick
    research he can on what it is, how to remediate it.


    This isn’t the same type of ransomware TechSolu uses, but an older, more rudimentary
    version. A more brutal type. Bo won’t encounter any soft-spoken customer service
    representatives here. It’s the automated call center version of TechSolu’s full-service
    business.


    Bo has gigabytes of research at stake. The criminals pitching him are Russian,
    it seems, or maybe even North Korean? It’s difficult to tell through all the automation.
    They want $500, or the equivalent of that in Bitcoin. Bo is grateful that he has
    a little bit of cryptocurrency, enough to make the payment. He is ready to wire
    the money by smartphone, but pauses for a minute to contemplate what he’s doing.


    It’s Halloween in Shanghai, 2015. The city has adopted the American holiday with
    a little too much enthusiasm, and people are screaming their heads off outside
    Bo’s apartment window.


    What Bo is experiencing is something on the brink of taking off, of turning into
    a global phenomenon. More sophisticated, smaller organizations like TechSolu have
    already pivoted to cyber-extortion: demanding bribes to bury damaging information,
    often for much higher figures. Automated ransomware is the latest trend because
    it can be spread virally and across many machines at once before being discovered.
    It’s the Walmart of cyberattacks.


    There’s tons of ambiguity involved. It’s rarely clear if the ransomers have access
    to the files they steal. Even some of the criminals don’t always know what they
    have, but it’s likely they are dealing with too many compromised files and machines
    to find out.


    Bo is worried they have not only locked up his files but have downloaded them,
    as well. Losing the data would be devastating for his business. He kicks himself
    for not updating his damn laptop. He didn’t want to take five minutes out of his
    day to do it, as if he didn’t know better. It’s unlikely that they have his data
    files, but he’s not quite sure how CryptoLocker works, and even the information
    he can find about it on private forums is unclear.


    Bo, stuck in his technological ways, never migrated his database to a cloud server—meaning
    all of the data exists on his laptop, stored locally. Years ago he had made a
    habit of backing up his data on a separate hard drive, but he grew lazy and stopped.
    This means all of his files are inaccessible unless he pays the ransom, gets the
    decryption key, and is able to open them back up.


    *Perhaps it is fortuitous*, he thinks. He’s been wanting to start fresh again.
    Maybe he shouldn’t pay the ransom. Maybe he should leave those files locked up.
    Maybe he should stick to his hotel job. Maybe he should live a nice, clean life,
    find a nice girl or guy to settle down with.


    Or he can pay the ransom, keep the data, and go completely in the opposite direction.
    There is an underground group he frequents on the dark web that’s been discussing
    a lucrative scam involving just the kind of data he has been able to collect from
    his USB stick malware.


    It works like this: Bo collects proprietary information strategically from selected,
    specific law firms, banks, or consulting firms. The information is about publicly
    traded companies and is nonpublic. In other words, information that could influence
    the company’s stock price.


    That information could include poor test results for a cancer drug if it’s a pharmaceutical
    company or news that a big account had fallen through if it’s a consulting firm.
    Other criminals in the group then put spyware designed to read keystrokes or observe
    the target through computer webcams to determine when the news is going to be
    released.


    Then the group buys and sells stocks in anticipation of the news. And they almost
    always win. They are raking in millions in the stock market, way more than the
    pocket change Bo was making on Fiverr.


    Then there’s the craziest option of them all: Bo leaves the life of crime and
    gets a legitimate job. He has received some interest from an American company
    with offices in Singapore. The role would be in big data and analytics. The offer
    had come from one of his Fiverr clients, a frequent flier. The guy is an executive
    who runs a small business unit covering southern Asia. He is impressed with Bo’s
    ability to gather such intricate knowledge about certain companies. The executive
    has no reason to disbelieve Bo’s story, that the information is all gleaned legitimately.


    Bo could get a visa to Singapore, a luxurious and exciting nation, even more exciting,
    perhaps, than Shanghai. But he’d have to give up his data collection activities
    and change his lifestyle entirely. An American company wouldn’t tolerate his data
    harvesting, and he couldn’t risk getting on the wrong side of Singapore’s legal
    system. He’d probably have to live in fear of all the risky stuff he’d done.


    He stares at the computer screen. It looks like this:


    ![image](images/img_158-01.jpg)


    Outside, the crowd is getting louder. Drums and music have started up. He realizes
    10 more minutes have gone by. He now has only a little over an hour to decide,
    before all his data is destroyed. He notices a voicemail on his phone. Doesn’t
    recognize the number.


    He puts the phone on speaker and nearly falls out of his chair. It’s his mother.
    He doesn’t even know how she got this phone number. It’s been nearly a year since
    he’s heard her voice. She is firm, as always, but there’s a bit more emotion there.
    Dad has been sick with the flu, she says. They’re so grateful for the money that
    he sent them six months ago. She misses him.


    **Bo’s mother is from** Kashgar in the far west of China, close to Nepal. She
    is a Buddhist. She clings to tradition. She tried to shape him into someone just
    like her—hardworking and satisfied with a dull but safe life—but she did not succeed.


    Kashgar was once a critical trading post on the Silk Road. Bo enjoys reading about
    its history. It was one of the things that attracted him to the dark web, when
    an illicit marketplace by the same name rose to prominence there.


    The Silk Road was an integral route for trading between China, Korea, Japan, India,
    Iran, Europe, the Arab world, and the African continent.


    It wasn’t only silk that was traded. Islamic and Christian teachings made their
    way across various parts of the world through this route. Art, literature, and
    philosophy spread, as well, alongside cultural traditions, languages, and cuisine.'
