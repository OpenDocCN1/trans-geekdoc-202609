- raw: 'He demands the taxi driver turn around and go back to the hotel. The driver
    is irritated he has to travel with a passenger without getting paid. Bo promises
    him he’ll get paid. Bo arrives back at the hotel, and the driver continues ranting
    and raving out the window. Bo tips the driver extra knowing that getting the American’s
    passport back is the bigger win.


    The businessman is pleased, of course. He tries to tip Bo for his trouble, but
    with a series of bows, Bo conveys that it is his honor to help the guest and that,
    if he likes, the guest should send a laudatory note to the hotel’s manager. Bo
    is a master of keeping his stock in his primary employment high—a necessity, if
    he wants to keep his side gigs.


    Bo wants nothing else from this guy. Did you suspect something insidious? Bo would
    blush to say it out loud, but he is a firm believer in the mantra of don’t shit
    where you eat. He leaves the patrons of his own hotel alone.


    But he hacks everyone else. Not in some blunt-force *Chinese* way, or for terrible
    nation-state reasons, but smoothly, elegantly, like an Israeli would or a good
    Russian who didn’t care for money like Romanov did. He is never the *best* hacker.
    He always tries to be the most stylish, though.


    Carding really isn’t for him, too illicit. The Eastern Europeans, with their criminal
    groups and rules and business structures, are getting too aggressive and difficult
    to work with from afar.


    Since it is data that he loves, he focuses on that. He is obsessive about it,
    collating it, parsing it, making it look gorgeous. Data is useless without someone
    with the skills to make sense of it, and the industriousness to do so is rare.
    He knows he has a niche. Data has become a valuable commodity, *the* commodity,
    more valuable than credit card numbers if you know how to present it right.


    Every big company says so. Some companies, he knows, like Facebook, are already
    successfully making money off of it. He can see it on the back end. But what the
    general public doesn’t seem to realize is that all of that data is essentially
    useless. Unless you care about stuff like politics and elections. And Bo does
    not. Too vulgar.


    So Bo has begun working the travelers to the Shanghai convention center for information
    alongside his hotel gig.


    It is exciting, and every week there are new industries—home improvement, medical
    devices, housewares, paint, computers. The list goes on and on. Financial firms.
    Nonprofits and NGOs.


    The people attending are international business experts, perfect targets. He uses
    a commonly available type of malware that can help him get as much information
    on a company as quickly as possible. He delivers it through USB devices that he
    scatters around the convention center, making it easy for unwitting professionals
    to pick up and stick right into their computers, computers with all those spreadsheets
    and proprietary client lists.


    Bo finds a great, cheap supplier from down south who sells him thousands of USB
    storage devices for around $100. One Monday morning, he goes down to the area
    that sells lots of mass-produced tchotchkes and buys a few beautiful, polished,
    modern-looking silver bowls.


    Then Bo loads malware on each device. He creates a very professional-looking sign,
    one that mimics whoever is sponsoring the convention in color and font, and puts
    the USB devices in the beautiful silver bowl. “Free USB Storage. Welcome guests!”
    He leaves them, surreptitiously, in the lobbies of the hotels or the convention
    center cafeteria or, if he can slip in, its press room, where all the media outlets
    take their breaks and meetings.


    In the early days of this scheme, convention-goers would pick up the devices and
    use them much more frequently than they do today. Many people have learned such
    freebies might be risky, and Bo is fine with that. Because the ones who pick them
    up are enough. He isn’t greedy.


    Once the simple malware loaded onto the USB drives is installed onto their computers,
    Bo grabs as many spreadsheets—just spread-sheets—as he can from their machines.
    The malware will probably be caught in a routine scan by some corporate technology
    team when the travelers get back to New York or San Francisco or London or Brisbane,
    but by then it will be too late. Bo will have everything he needs, including all
    of the emails and personal details of the individual’s business contacts. He particularly
    likes getting business plans, budgets, future merger ideas.


    Then, after all this excitement, the denouement. What does Bo do with this valuable
    information? He has an account on Fiverr, a legitimate, U.S.-based website for
    freelancers, and he sells this business intelligence to other companies. Companies
    that love the breadth and depth of his data but have no idea where it came from
    and know better than to ask.


    The platform behind Fiverr is fairly simple. The baseline price is $5, which is
    where anyone using it to sell goods starts. Bo picks a simple interface, lists
    his location as Japan, uses a special program and a virtual private network (VPN)—a
    program that masks his movements from the Chinese government. To an outside observer,
    it would look like Bo’s computer is pinging from a Tokyo apartment complex.


    From there, he offers “curated” lists made up of “publicly available” corporate
    information on big players in all the industries that have trade shows in Shanghai.
    Building materials. Finance. Risk and compliance. Even money laundering. He starts
    with a $5 price tag for a basic report.


    Of course, his intel is so good, the business quickly grows. And he is so good
    at curating it, business contacts recommend him to others in their industry. He
    becomes especially popular with salesmen looking for detailed prospect lists.
    He becomes a master at PowerPoint, making the data even more digestible to his
    less-than-tech-savvy customers.


    The platform helps him get paid in all kinds of currencies—U.S. dollars, euros,
    cryptos—all of which are far more valuable than his local currency.


    But even this is wearing thin. Bo wants to go legit permanently. His love of the
    business-class lifestyle means he is starting to find the pursuit of illicit gains
    to be far too vulgar. The problem, of course, is the scheme is so lucrative and
    so easy he can’t afford to give it up.


    ## **7.**


    ## The Tryout


    **Caroline is preparing for a** hack-a-thon. It is meant to get young engineers
    to come to the bank and showcase their skills.


    It is an all-night afair. Coding through the wee hours of the night. The kind
    of opportunity that younger people, seeing promise in working at a bank, might
    jump at.


    They are all college students, a few still in high school. Caroline will put them
    through their paces, allow them to write new code to fix a variety of problems.
    She gathers some of the engineers into teams to allow them to maliciously hack
    one another on a fake bank network.


    It is billed as a charity event, but it is really a tryout camp.


    Caroline makes sure the results are meticulously recorded. Early on in events
    like this, one or two rock stars are always evident. Kids who just have it. Perfect
    10s.


    And she likes to pull those people out of the crowd. Sit them down for a tea.
    Talk to them about how important cybersecurity is to the financial services sector.
    How rewarding it is to come work as a hacker for a bank. The bonuses they can
    make. The importance of a prestigious, marquee name on their resumes. A name like
    NOW Bank.'
