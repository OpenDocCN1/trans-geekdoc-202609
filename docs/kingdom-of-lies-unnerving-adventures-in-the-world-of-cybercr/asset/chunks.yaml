  trans: '

    然而，阳光开始融化她的冰。到 2016 年 9 月，她变得更加开朗了。她更频繁地出门，开始认出邻居的面孔，甚至带着亨利去了海滩。找工作很难，西班牙正处于经济衰退中。但如果绝对需要，她手里的钱也足够维持一年。


    偶尔，这间房子的房主——诺拉（Norah）和穆哈默德（Muhammad）会把饭放在门口：饼干；在`Ramadan`（斋月）期间，还有整份的`kebabs`、沙拉和汤。在其中一次机会，他们相遇了。她邀请他们来到阳台聊天。


    他们问她为什么来到西班牙。她告诉他们，她来这里是为了阳光和天气，她和`Henry`以前在布加勒勒时饱受了过敏和感冒的困扰，她需要改变一下。她希望能完成在故乡开始的大学学业。希望能尽快找到一份工作。科技方面的。她告诉他们，自己有这方面的背景，但在技术支持部门，她并不是一个技术人员。


    “是哪家公司？”穆哈默德问。


    她犹豫了，她并没有打算在任何人面前放下戒备，只是紧张地脱口而出：“TechSolu。”


    “我没听过。”她感到松了一口气。“什么类型的公司？”


    “勒索软件。缓解，”她说道，喝了一口水，“老实说，我主要做客户服务。”


    “有项目管理吗？我哥哥在`Insite`工作——你听过吗？他们在这儿有一间技术办公室。”


    雷内（René）听过。它总部位于`Silicon Valley`（硅谷），是世界上最大的科技公司之一。


    “我想我认识那里的一个人，”雷内说，马拉加的傍晚微风让她变得有些心不大意（大粗），“但那是很久以前的事了。”


    “这个，如果你想写份简历，我发给他看。他们急需项目经理。还有勒索软件的事——我确定他们会感兴趣。妈妈们工作的好地方——他们喜欢女性！”


    诺拉斜了她丈夫一眼，做了一个手势让他安静点。


    自从 3 月发了那封邮件后，雷内就没有收到过`Sig`的消息。她点头微笑：“我会的。我这就去。”


    `Caroline Chan`、`Charlie Mack`、`Bob Raykoff`、`Joe the Kool-Aid Man`、远在新加坡的`Carl
    Ramirez`、同样在新加坡的`Bo Chou`，以及与`Victor`友好的记者，所有在`NOW Bank`工作过网络安全的人，在起诉书发布后，一直在阅读他们能获取的关于`Venice
    hackers`（威尼斯黑客）的每一丝信息。


    `FBI`（联邦调查局）对其进展保持沉默，没有向任何人透露过发生了什么。突然之间，起诉书发布了。两个以色列人，`Yuval Dev`和`Ivan Misrachi`；一个俄罗斯裔以色列人，`Leonid
    Kravitz`；以及一个名为`Tony Belvedere`的洗钱犯。


    指控声称，他们偷取的信息被用于“拉高出货”（pump-and-dump）计划。对于大多数关注此案的人来说，这是他们第一次看到所有细节汇在一起，尽管他们对发生的事情曾深度参与。


    其中两名涉嫌共谋者在 2016 年 12 月被捕。起诉书概述了同时被黑客的其他银行、软件公司和报纸。犯罪者手中有 1 亿个名字可以操作。


    头目`Dev`利用这些信息联系他的客户，试图抛售某些股票，以操纵证券市场。


    这条线索远超`Caroline`和同伙在 2014 年夏天所对抗的那种相对简单、直接的网络犯罪。


    特别是在大约 2007 年到 2015 年 7 月之间，`Dev`在美国及境外拥有并运营非法的网络赌博业务；拥有并运营为非法药品供应商、假货和恶意软件分销商以及非法网络赌场提供跨国支付处理服务；并拥有并控制`Coin.mx`，这是一家违反联邦反洗钱法的、位于美国的非法比特币交易所。


    `Dev`通过这种方式赚了数亿。他至少在瑞士银行和全球其他地方，通过 75 家空壳公司的证券账户隐藏了 1 亿美元。他甚至将其中一部分资金存放在资产管理账户中，也许在`NOW
    Bank`里。`Dev`和他的同伙使用了 200 个不同的别名和 16 个国家签发的 30 本假护照。


    政府表示，`Dev`曾吹嘘他的事迹。“我们非常低廉地买入股票，进行运作，然后玩弄它们。在美国买股票——就像在俄罗斯喝该死的伏特卡一样。”


    `Dev`会给那些被偷了个人信息的人打电话撒谎。像`Bo`一样，`Dev`会对信息的来源撒谎，声称他是从一个公开的“投资者数据库”中获得的。


    在邮件中，`Dev`对那些被他偷了个人信息的人打电话并撒谎。像`Bo`一样，`Dev`会对信息的来源撒谎，声称他是从一个公开的“投资者数据库”中获得的。

