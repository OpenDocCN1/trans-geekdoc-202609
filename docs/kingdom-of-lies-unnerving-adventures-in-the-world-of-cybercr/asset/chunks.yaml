    # 攻击背景：Operation Ababil


    At the same time, far away in Washington, D.C., Michael Rogers, the head of the
    National Security Agency (`NSA`) and the Central Intelligence Agency, addresses
    Congress about cyberthreats, contrasting them with nuclear weapons. “That’s very
    different from,” he says. “Where we’re not going to be dealing with nation-states,
    but we’re going to be dealing with groups, with individuals when we’re dealing
    with capability that is relatively inexpensive and easy to acquire, unlike nuclear
    kind of. That makes this really problematic.”


    René has never met an American. She doesn’t know about `NSA`, nor what admiral
    is. In Romania, René enters the circle and starts a silly dance. She pretends
    her drink is a microphone and sings even louder.


    At the same time, not far away, in Germany, Sigmar “Sig” Himelman, an influential
    30-something cybercriminal, acknowledges that he’s burned too many bridges, including
    with the local police, and is going to make a move. He has already disposed of
    several computers and hard drives. He’s not answering his phones, and soon those
    will be destroyed, too. He’s packing his bag and going somewhere else, somewhere
    safer for hackers who like to innovate: René has never met someone from Germany.
    She’s been a bit sheltered. The junior-league club is as bad-assed as it gets
    for her. For now. But not too long, she’ll be a more cybercriminal than Sig, a
    competitor of Bo’s, and one of Rogers’ new problems.


    ## The Scene at NOW Bank


    Carl Ramirez stands in a room inside a NOW Bank building in Midtown Manhattan
    that reasons he has never able to ascertain is shaped like a plus sign. He faces
    a receptionist’s desk, long abandoned, covered in a layer of dust. Behind the
    desk, a wall of glass showcases a seven-story drop to a lower atrium where bankers
    sit, drinking coffee and eating breakfasts.


