    So then Sig was gone. Jet-setting, he said.\n\nDieter has ghostwritten a few articles\
    \ in a German computer academic periodical about ransomware and criminal enterprises\
    \ in Eastern Europe. He writes about social-engineering techniques in particular,\
    \ the ones that involve people pretending to be someone they aren’t by email,\
    \ phone, text, even in-person meetings in order to get something from someone\
    \ else fraudulently. \n\nIn one, where he was credited by name, he wrote about\
    \ a particular `ATM cash-out scheme` that involved an especially tricky bit of\
    \ social engineering—in this case, very slick fraud, the kind of work that suits\
    \ narcissists and sociopaths. That’s when he got an email from Sig, who was impressed\
    \ with his research and wondered if he’d like to visit Romania. Bucharest is so\
    \ nice this time of year, he wrote.\n\nDieter immediately agreed to the trip.\
    \ Sig believed it was because his long-lost cousin must be bored with his married\
    \ life and childcare responsibilities, because who would enjoy such things?\n\n\
    Dieter, always the researcher, merely wanted to know what Sig was up to, because\
    \ Sig was a criminal. And Dieter tracks crimes and likes to write about them.\n\
    \nSo around and around they went, making travel arrangements and small talk for\
    \ a few weeks by phone and email, a light waltz of two oppositely charged magnets.\n\
    \nThey settled on a good place to meet—a pub near the Bucharest airport. Dieter\
    \ lies and says he can only spend the day before he has to return home. The plausible\
    \ fiction: he must get back to watch the kids while his wife is on a business\
    \ trip.\n\n“That’s terrible,” Sig says.\n\n“Yes, yes, what can I do? She wants\
    \ to work, but you know women,” Dieter had whined, his wife laughing silently\
    \ and giving him the finger from the kitchen.\n\nNow, here they are, in this pub\
    \ in Bucharest. Sig watches expectantly as Dieter describes this new type of crime\
    \ in detail. `ATM cash-outs` aren’t particularly novel, but this particular approach\
    \ takes it to a new level.\n\n“It starts like this,” Dieter says. “Let’s say we\
    \ are dealing with two locations. Bucharest in Romania and Tallinn in Estonia.\
    \ You start with research. Banks have different kinds of ATMs, and some of them\
    \ hold more money than others. Some hold up to $200,000. Most hold around $10,000.\n\
    \n“The $200,000 ATMs have a lot of things in common—they are older, connected\
    \ with banks that don’t have reasonable hours, and are often in areas where people\
    \ do a lot of business in cash. These may be popular areas for mob activity or\
    \ lots of Saudis or something like that. So you find out the `First Local Bank\
    \ of Tallinn` has one of these big, overloaded ATMs. More research. When does\
    \ the `ATM` get filled, what time of day? What car company brings the cash? When\
    \ do they depart? Is the bank open or closed at the time? Does it see much traffic\
    \ on that day?” Dieter pauses.\n\n“You find the optimal location that meets all\
    \ your criteria. OK, now you have your cash-out target.”\n\nDieter has created\
    \ a rudimentary `PowerPoint presentation` to illustrate this, on a crappy seven-year-old\
    \ laptop. ...\n"
  trans: '

    大约在同一时间，Sig 在德国陷入了某种麻烦，并逃到了东欧，从那时起电话和拜访也停止了。至于是关于女孩还是电脑，迪特（Dieter）从不确定。


    于是，Sig 就消失了。他说，是去到处奔波了。


    迪特曾在一家德国计算机学术期刊上，代写过几篇关于东欧勒索软件和犯罪集团的文章。他专门撰写关于社会工程技巧的文章，即通过电子邮件、电话、短信，甚至面谈伪装成他人身份，从而从他人那里骗取财物的手段。


    在其中一篇署有名的文章中，他描写了一种特定的 `ATM cash-out scheme`（ATM 取款方案），这涉及到一种极其复杂的社会工程——在这种情况下，是极其老练的诈骗，这种工作适合自恋狂和反社会心理变。就在那时，他收到了
    Sig 的邮件，Sig 对他的研究留印象深刻，并好奇他是否想去罗马尼亚旅游。他写道，这个季节的布加勒斯非常漂亮。


    迪特立刻同意了这次旅行。Sig 认为这是因为他失散多年的表弟一定对婚姻生活和育儿责任感到厌倦了，毕竟谁会喜欢那些事呢？


    迪特一直是个研究者，他只想知道 Sig 在忙什么，因为 Sig 是个罪犯。而迪特追踪犯罪并喜欢描写它们。


    于是他们来来回回，在几周内通过电话和邮件安排行程并进行闲聊，就像两个电荷相反的磁体跳着轻盈的华尔兹。


    他们定了一个不错的会面地点——布加勒斯机场附近的一家酒吧。迪特谎说，在必须回家之前他只能待一天。这个合情合理的虚构谎言是：他必须在妻子出差期间回去照看孩子。


    “那太糟糕了，”Sig 说。


    “是啊，是，我能怎么办呢？她想工作，但你知道女人的……”迪特曾这样哀怨道，而他的妻子在厨房里静静大笑，并对他竖了个中指。


    现在，他们就在布加勒斯的这家酒吧里。Sig 满怀期待地看着迪特详细描述这种新型犯罪。`ATM cash-outs`（ATM 自动取款）并不特别新颖，但这种特定方法将其推向了一个新的高度。


    “它是这样开始，”迪特说，“假设我们正在处理两个地点：罗马尼亚的布加勒斯和爱斯尼亚的塔林。你先从研究开始。银行有不同类型的 ATM，其中一些装的钱比其他的多。有些可以装下
    200,000 美元。大多数装在 10,000 美元左右。”


    “装有 200,000 美元的 ATM 有许多共同点——它们比较老旧，连接的银行营业时间不合理，而且通常位于人们大量使用现金的地区。这些地方可能是黑帮活动的活跃区域，或者有很多沙特人之类的。所以你发现
    `First Local Bank of Tallinn` 拥有其中这样一个大容量且过载的 ATM。进一步研究：`ATM` 什么时候被填满？一天中什么时候？哪家汽车公司送的现金？他们什么时候离开？当时银行是开门还是关门？那天的流量大吗？”迪特停顿了一下。


    “你找到了符合你所有标准的最佳地点。好，，现在你有了你的取款目标。”


    迪特在一台破旧的七年前笔记本电脑上创建了一个简陋的 `PowerPoint presentation` 来演示这一点。

