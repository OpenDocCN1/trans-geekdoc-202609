    # 攻击背景：Operation Ababil


    与此同时，在远处的华盛顿特区，国家安全局（`NSA`）和中央情报局局长迈克尔·罗杰斯（Michael Rogers）正在国会汇报网络威胁，并将其与核武器进行对比。“这非常不同，”他说，“我们要面对的不是国家，而是团体，甚至是个人。当我们面对这种相对廉价且易于获取的能力时，它不像核武器。这使得问题变得非常棘手。”


    蕾内（René）从未见过美国人。她不知道 `NSA` 是什么，也不知道什么是海军。在罗马尼亚，蕾内进入了圈子并开始跳起愚蠢的舞蹈。她假装自己的饮料是麦克风，唱得更大声。


    与此同时，在不远处的德国，具有影响力的三十多网络犯罪分子西格马·“锡”希尔曼（Sigmar “Sig” Himelman）承认自己烧掉了太多的桥，包括与当地警察的关系，并打算采取行动。他已经处理了几台电脑和硬盘。他不接电话，很快那些电话也会被销毁。他正在收拾行李去另一个地方，去一个对喜欢创新的黑客更安全的地方：蕾内从未见过德国人。她一直受到某种保护。对她来说，这个初级俱乐部已经够酷了。但不会持续太久，她将成为一个比锡更厉害的网络犯罪分子，波（Bo）的竞争对手，以及罗杰斯新问题之一。


    ## NOW Bank 的场景


    卡尔·拉米雷斯（Carl Ramirez）站在曼哈顿中区一座 NOW Bank 大楼内的一间房间里，他一直无法确定这个房间的形状像一个加号。他面对着一个早已被遗弃、覆盖着层灰尘的接待台。接待台后面是一面玻璃墙，展示着通往下方中庭的七层落，银行家们坐在那里喝着咖啡吃着早餐。


    下方的银行家和上方的许多银行高管并不知道，金融部门即将遭受恐怖分袭击。卡尔是一个平平无奇、脚踏地的银行高管，拥有卡内基·梅隆大学的工程学位，有着像戈默·帕尔尔（Gomer
    Pyle）一样的笑声，他来救援了。他是拯救世界的。这里没有人迎接他。他的身后、左右各是三扇锁着的门。他的手机无法使用。尽管这一层充满了员工，但大堂里死气沉沉。卡尔觉得这一场景就像末日电影里的情节，恰在僵尸出现之前的时刻。卡尔再次尝试了门。没有运气。还是锁着的。


    他拿起起接待台上的电话。听筒已经断开。事实上，它被剥离了电线。四个回形针整齐地排在两个空三环活夹旁边，每个活夹上都有金色的 `Fleur Stansbury`
    标志。现在是 2012 年，世界并没有终结，但四年前，有人在 `Fleur Stansbury` 一夜之间解散时匆忙清空了这个办公桌。`Fleur Stansbury`
    搬走了，`NOW Bank` 搬入了。卡尔知道，`NOW Bank` 是交易量、分行数量、客户数量和全球办公室数量范围内最大的银行之一。几乎按照任何你可以衡量的标准，`NOW
    Bank` 绝对规模巨大。每天都有数万亿美元流经银行广泛的计算机系统。


    没有人忙于清理办公桌或聘佣新的接待员，因为这一层是给技术人员使用的，而不是给银行家。这个办公室将不再接待大牌投资者了。不再了。卡尔抓起其中一个活夹，把它夹在腋下。他需要一个地方来存放今天活动的安全报告。一个满是灰尘的华尔街遗迹似乎很合适。在他上方一盏荧光灯在闪烁。里面有死的苍蝇。


    ## 威胁情报


    卡尔拿着一个活夹，里面有一份关于当前事项的 PowerPoint 简报：一场名为 `Operation Ababil` 的恐怖袭击即将执行。这是一场经过周计划的网络攻击，并可能将由一个资源极其惊人、自称为
    `Izz ad-Din al-Qassam Cyber Fighters` 的团体完美执行。


    简短历史：`NOW Bank` 的网络安全团队在四个月前首次遇到这个集体，当时该团体攻击了这家银行。该团体声称他们的攻击是对美国在叙利亚政策以及其他针对什派穆斯林特定特定问题的反应。正是在那时，`Izz
    ad-Din` 集体入侵了 `NOW Bank` 的主网站。


    '
