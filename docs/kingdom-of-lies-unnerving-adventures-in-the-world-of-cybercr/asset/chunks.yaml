- raw: 'Dieter never published his paper on terrorism. The magazine editor thought
    his angle on the recurrent themes of entitlement among cyberterrorists was too
    “fluffy.”


    He sends it to a journalist he knows through his professional network to get her
    opinion. She takes forever to get back to him. Her newspaper doesn’t take submissions,
    she replies, rudely.


    She calls him later to apologize. Says she has some other questions for him, about
    Romania and ransomware.


    He doesn’t trust journalists much. He weighs whether to talk to her. When it comes
    to Sig, he doesn’t expect he’ll ever see him again.


    He destroys the malware he planted on Sig’s computer, losing his cousin to the
    ether.


    **Hands off. Sig just** wants to be hands off. Passive income is better than anything
    active. Bitcoin could spike soon. He’s got a lot of it. And he wants more.


    Mikael Gunther is the first and last remaining TechSolu employee; everyone else
    has left. Some of them wondered what happened to René. Sig told them she ran off
    with another man, the bitch. One of them wondered out loud if he’d killed her.
    Then they’d all slowly faded away, to other enterprises. Whether they were criminal
    or legit, no one would say.


    With cryptomining, it is all passive. Mikael showed him how to infect remote computers.
    Control them like a botnet, but all they do is produce the energy required to
    create more cryptocurrency. There are new types each day. If they exploit whole
    databases, like the big data centers Insite is setting up in Poland, they will
    be rich.


    If they can co-opt some of that power, they’ll have Bitcoin flowing like water
    along the Danube.


    **René reviews the project** manager job description that Muhammad had sent to
    her. It’s filled with incomprehensible jargon and technological speak.


    There’s tons of stuff about cloud servers and red-amber-green status and other
    protocols typically followed by corporate project executives.


    *Must have a PMP or related certificate*, a reference to certifications typically
    held by project managers, which René does not have. *ABSOLUTELY MUST have a CISSP
    or CERM*, referring to cybersecurity certifications that René also does not have.


    *MUST understand Python*, a reference to a computer coding language that René
    does not understand.


    She thinks there is no way this will work out. Then the last bullet point gives
    her some hope:


    ***MUST be a PowerPoint NINJA*.**


    Henry is sleeping in his stroller. This is how she gets him to settle down every
    evening. She types with two hands and pushes the stroller with her foot back and
    forth, back and forth.


    She glances over at him. Makes a small karate-chop motion. *Ninja*.


    She takes her meager resume, filled with holes and half-truths, and puts it into
    a PowerPoint. She does graphics and sweeping transitions from page to page. She
    adds subtle but unique shadings and color. She enhances graphics to support the
    best possible readability. She submits it to both the recruiter and the executive
    listed on the job description as hiring for the role.


    **The next day, the** recruiter calls her and says she doesn’t have enough experience
    for the job.


    Five minutes later, the executive in charge of hiring calls her, too.


    “Listen, can you do presentations like that PowerPoint all the time? This is amazing.
    Is this what you can do?”


    René smiles. She knows by the sound of his voice that she has him. A throwback
    to her previous life. She answers in the affirmative. Breezes through a description
    of her experience in ransomware mitigation.


    “That’s interesting, we haven’t had a very big problem with ransomware.”


    “Oh really?”


    “But managing the problem, as a project manager, that is what we’re looking for.
    From a project management standpoint. We need to set up a disaster recovery plan
    for ransomware; that’s something you could help with, I’m sure.”


    “I can definitely do that, sir.”


    “All right, let me call the recruiter and tell them. Sorry, they’re not always
    on the same page as us.”


    **After several months, René** is thriving in her new job. Her manager is even
    sending her to a conference in New York. Henry will stay with Muhammad and Norah
    and their kids for two days while she is gone. It’s the first time they will be
    separated. Her manager warns her there will be reporters at the conference and
    so she should be careful who she talks to. She always is, she replies.


    It’s May 2017, and it’s hot and gorgeous in Malaga. It’s going to be Mother’s
    Day in America on Sunday, and René has gotten herself and Henry a little cake
    to celebrate.


    **But that Saturday, a** global, sweeping ransomware attack called WannaCry hits
    everyone where it hurts.


    Including Insite.


    As René is inundated with images and emails about the attack, she sees a few screenshots
    that—though unrelated to WannaCry—echo some designs from her previous life. She
    is unstirred.


    **But the fallout from** the event is sensational. Pictures of stopped ambulances
    in the United Kingdom, offices shut down across Europe, panicked security personnel
    in the United States. Now everyone in the world knows what ransomware is, though
    this attack has no resemblance to any of the work TechSolu ever did.


    Still, the conditions are just right for a ransomware specialist’s star to shine.
    René does what René does best: she shines.


    **It’s a hot day** in Queens. A prelude to a muggy Mother’s Day. Victor Tanninberg
    is cranky as hell. A gastrointestinal issue has flared up.


    He spent the last week getting into vicious arguments with his doctor over the
    matter. He has intensely researched gastrointestinal issues. His doctor, he says,
    is a fucking idiot blinded by the tyranny of treatments preferred by the healthcare
    companies.


    Although he’d rather be home, he’s come to Queens to fix the reporter’s car. She
    gets a text from her former colleague, Caroline, about the attack they’re calling
    WannaCry, and it distracts her.


    He has a can of coolant in one hand, an iced tea with extra sugar in the other.
    The reporter is making spaghetti. It’s Mother’s Day.


    “I’m going to write a book about hackers,” she says. “I want to put you in it.
    What do you think?”


    “I’m not a fucking hacker. We’ve discussed this.”


    “You say you’re not a car mechanic, either. But here you are, fixing my car,”
    she says, and smiles.


    “Well, I’m tired of that, too,” he says, smiling.


    There is no profession on earth Victor despises more than journalism. The two
    of them have been arguing about the elections for the past hour. Now some sort
    of ransomware attack is breaking out and she says she might have to cut the visit
    short.


    “I don’t want to be in any book,” he tells her.


    “But what would I call you if you were?”


    He does not hesitate.


    “Victor Tanninberg.”


    ## Epilogue


    We Didn’t Start the Fire


    **I’m sitting at my desk** at *The Wall Street Journal*, getting ready to print
    out my letter of resignation, when I decide it will be easier and more efficient
    to email it instead.


    I hit send. I’m sad. It was a dream job, combining my experience in the field
    and my writing ability to provide greater insight and nuance to reporting on hackers.


    But it’s just not working out.


    I check my voicemail. There are 10 calls, and the first seven are from PR specialists
    pitching insidious dark web finds.


    “You may have heard of ransomware,” one of them starts. I delete it.


    Then number eight. It’s an autistic Billy Joel fanatic, one of my many oddball
    sources, who somehow has caught wind that I’m having job trouble. Anthony is one
    of several sources for whom I only have a screen name.


    He’s taken the time to write and sing a technology version of Billy Joel’s “We
    Didn’t Start the Fire” in a bid to cheer me up.


    It’s bad. But it works. And for a computer geek, Anthony’s got some surprisingly
    good pipes:


    *NBS, John Curtiss, Math Lab, New Census*


    *Lanczos, Krylov, Hestenes and Stiefel*


    *SEAC, UNIVAC, FBI and Fingerprints*


    *Brooks Act, MAGIC Facts, Churchill Eisenhart*


    *FIPS 1, CST, Railroad Club at MIT*'
  fmt: "\nDieter never published his paper on terrorism. The magazine editor thought\
    \ his angle on the recurrent themes of entitlement among cyberterrorists was too\
    \ “fluffy.”\n\nHe sends it to a journalist he knows through his professional network\
    \ to get her opinion. She takes forever to get back to him. Her newspaper doesn’t\
    \ take submissions, she replies, rudely.\n\nShe calls him later to apologize.\
    \ Says she has some other questions for him, about Romania and ransomware.\n\n\
    He doesn’t trust journalists much. He weighs whether to talk to her. When it comes\
    \ to `Sig`, he doesn’t expect he’ll ever see him again.\n\nHe destroys the malware\
    \ he planted on `Sig`’s computer, losing his cousin to the ether.\n\nHands off.\
    \ `Sig` just wants to be hands off. Passive income is better than anything active.\
    \ `Bitcoin` could spike soon. He’s got a lot of it. And he wants more.\n\nMikael\
    \ Gunther is the first and last remaining `TechSol` employee; everyone else has\
    \ left. Some of them wondered what happened to `René`. `Sig` told them `she` ran\
    \ off with another man, the bitch. One of them wondered out loud if he’d killed\
    \ her. Then they’d all faded away, to other enterprises.\n\nWith `cryptomining`,\
    \ it is all passive. `Mikael` showed him how to infect computers. Control them\
    \ like a `botnet`, but all they do is produce cryptocurrency. There are new types\
    \ each day. If they exploit whole databases, `Insite` is setting up in Poland,\
    \ they will be rich.\n\nIf they can co-opt some of power, they’ll have `Bitcoin`\
    \ flowing along the Danube.\n\n`René` reviews the manager job description that\
    \ `Muhammad` had sent to her. It’s filled with incomprehensible jargon and technological\
    \ speak. There’s tons of stuff about cloud servers and red-amber-green status\
    \ and other protocols followed by corporate. `Must have PMP or related certificate`,\
    \ reference to certifications held by project managers, which `René` does not\
    \ have. `ABSOLUTELY MUST have CISSP or CERM`, referring to certifications that\
    \ `René` also does not. `MUST understand Python`, reference to a coding language\
    \ that `René` does not understand.\n\nShe thinks there is no way this will work.\
    \ Then the last point gives her some hope: `MUST be NINJA`.\n\n`Henry` is sleeping\
    \ in his stroller. This is how she gets him to settle down every evening. She\
    \ types with two hands and pushes the stroller with her foot back and forth, back\
    \ and forth. She glances over at him. Makes a small karate motion `Ninja`.\n\n\
    `René` takes her meager resume, filled with holes and half-truths, and puts it\
    \ into it. She does graphics and sweeping from page to page. She adds subtle shadings\
    \ and color. She enhances graphics to support the best readability. She submits\
    \ it to both the recruiter and the executive listed on job description for the\
    \ role.\n\nThe next day, the recruiter calls her and says she doesn’t have enough\
    \ experience for the job. Five minutes later, the executive in charge calls her,\
    \ too. “Listen, can you do presentations like that all the time? This is amazing.\
    \ Is this what you can do?” `René` smiles. She knows by the sound of his voice\
    \ that she has. A throwback to her previous life. She answers the affirmative.\
    \ Experience in `ransomware mitigation`.\n\n“Oh really?” “But managing the problem,\
    \ as a project manager, that is what we’re looking for. From a project management\
    \ standpoint, we need to set up a disaster recovery plan for `ransomware`; that’s\
    \ something you could help with, I’m sure.” “I can definitely do that, sir.” “All\
    \ right, let me call the recruiter and tell them. They’re not on the same page\
    \ as us.”\n\nAfter several months, `René` is thriving in her new job. Her manager\
    \ is even sending her to a conference in New York. `Henry` will stay with `Muhammad`\
    \ and their kids for two days while she is gone. It’s the first time they will\
    \ be separated. Her manager warns her there will be reporters at the conference\
    \ and so she should be careful who she talks to. She always is, replies. It’s\
    \ May 2017, and it’s hot and gorgeous in Malaga. It’s going to be Mother’s Day\
    \ in America on Sunday, and `René` has gotten herself a little cake to celebrate.\n\
    \n global sweeping ransomware attack called `WannaCry` hits everyone where it\
    \ hurts. Including `Insite`. As `René` is inundated with images and emails about\
    \ the attack, she sees a few screenshots that—though unrelated to `WannaCry`—echo\
    \ some designs from her previous life. She is unstirred.\n\nThe fallout from the\
    \ event is sensational. Pictures of stopped ambulances in the United Kingdom,\
    \ offices shut down across Europe, panicked security personnel in the United States.\
    \ Now everyone in the world knows what ransomware is, though this attack has no\
    \ resemblance to the work `TechSol` ever did. Still, the conditions are just right\
    \ for a ransomware specialist’s star to shine. `René` does what she does best:\
    \ she shines.\n\nIt’s a hot day in Queens. A prelude to a muggy Mother’s Day.\
    \ `Victor Tanninberg` is cranky as hell. A gastrointestinal issue has flared up.\
    \ He spent the last week getting into vicious arguments with his doctor over the\
    \ matter. He has intensely researched gastrointestinal issues. His doctor, he\
    \ says, is an idiot blinded by the tyranny of treatments preferred by the healthcare\
    \ companies. Although he’d rather be home, he’s come to Queens to fix the reporter’s\
    \ car. She gets a text from her former colleague, `Caroline`, about the attack\
    \ they’re calling `WannaCry`, and it distracts her. He has a can of coolant in\
    \ one hand, an iced tea with extra sugar in the other. The reporter is making\
    \ spaghetti. It’s Mother’s Day.\n\n“I’m going to write a book about hackers,”\
    \ she says. “I want to put you in it. What do you think?” “I’m not a hacker. We’ve\
    \ discussed this.” “You say you’re not a car mechanic, either. But here you are,\
    \ fixing my car,” she says, and smiles. “Well, I’m tired of that, too,” he says,\
    \ smiling.\n\nThere is no profession on earth `Victor` despises more than journalism.\
    \ The two of them have been arguing about the elections for the past hour. Now\
    \ some sort of ransomware attack is breaking out and she says she might have to\
    \ cut the visit short. “I don’t want to be in any book,” he tells her. “But what\
    \ would I call you if you were?” He does not hesitate. “Victor Tanninberg.”\n\n\
    ## Epilogue We Didn’t Start the Fire\n\nI’m sitting at my desk at `The Wall Street\
    \ Journal`, getting ready to print out my letter of resignation, when I decide\
    \ it will be easier and more efficient to email it instead.\n\nI hit send. I’m\
    \ sad. It was a dream job, combining my experience in the field and my writing\
    \ ability to provide greater insight and nuance to reporting on hackers. But it’s\
    \ just not working out.\n\nI check my voicemail. There are 10 calls, and the first\
    \ seven are from PR specialists pitching insidious dark web finds. “You may have\
    \ heard of ransomware,” one of them starts. I delete it.\n\nThen number eight.\
    \ It’s an autistic Billy Joel fanatic, one of my many oddball sources, who somehow\
    \ has caught wind that I’m having job trouble. `Anthony` is one of several sources\
    \ for whom I only have a screen name.\n\nHe’s taken the time to write and sing\
    \ a technology version of Billy Joel’s “We Didn’t Start the Fire” in a bid to\
    \ cheer me up. It’s bad. But it works. And for a computer geek, `Anthony`’s got\
    \ some surprisingly good pipes:\n\n```\nNBS, John Curtiss, Math Lab, New Census\n\
    Lanczos, Krylov, Hestenes and Stiefel\nSEAC, UNIVAC, FBI and Fingerprints\nBrooks\
    \ Act, MAGIC Facts, Churchill Eisenhart\nFIPS 1, CST, Railroad Club at MIT\n```\n"
