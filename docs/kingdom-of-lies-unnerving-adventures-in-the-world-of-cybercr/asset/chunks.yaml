  trans: '

    庆祝了片刻儿后，蕾妮（René）回到办公室坐了下来。她童年的一的一幕在她的脑海中循环播放。


    她的父亲是一名警察，正试图在厨房餐桌旁教她数学：“你必须学数学，然后学电脑。你可以当一名会计，做一份体面的办公室工作。”她把额头放在折叠的双臂上抵在厨房餐桌上，试图无视他。


    现在她在办公室的办公桌前重复着同样的动作。如果她父亲，那个警察，知道她在做什么，会怎么想呢？


    西格（Sig）敲了敲门走了进来。蕾妮抬起头。


    “我们该怎么分？”他问道，“你决定。”


    通常情况下，办公室里的每一个人都能分到笔赎金。这是一项团队合作成果，如果一个人倒下了，大家都会一起完蛋。


    “平分，就像其他人一样，”她说，“这能防止他们内斗。”


    “你确定吗？”


    “确定。这不会是最后一次，对吧？”


    西格笑了。他们之前的每一次黑客攻击针对的都是公司，勒索的是机构数据。这是他们第一次针对知名个人。与其说他们部署了勒索软件，不如说是实施了勒索，而且披着提供网络安全服务的虚伪外衣。TechSolu
    将转向一个危险得多且利润丰厚的业务模式。


    那天晚上，他们去了蕾妮最喜欢的俱乐部之一。她给每个人点了樱桃唇膏味道的鸡尾酒。今晚是 80 年代之夜。蕾妮和同事们随着 New Order 乐队的《Blue
    Monday》旋转，还有 Depeche Mode 和 普林斯（Prince）。西格坐在角落里观察着，在餐巾纸上画着。


    他没预料到这些。他喜欢现状，喜欢他们带来了这么多钱。但现在蕾妮成了关注的焦点。在工作了几个小时后，她就成了一个天才罪犯。仅仅凭借对 PowerPoint 的熟练运用和天赋予的社交天赋，她就让
    TechSolu 的所有员工像卫星一样环绕着她旋转。


    西格意识到自己不再控制着局势。他不喜欢这样。他对着蕾妮笑了，露出了一个大而真诚的微笑。蕾妮也回以微笑，尽管她有些醉了，笑容停留得稍微长了点。


    *他真帅*，她心想，此时一首火器玫瑰乐队的歌曲《Welcome to the Jungle》响起。“*笑容真好笑*。”


    *牙齿真整齐*，她想。


    像吸血鬼一样。


    # 10. 中介


    查理·麦克（Charlie Mack）一直在利用夜间和周末工作，准备公开披露 NOW 银行发生的事情。


    当公司被攻破、传言传到媒体时，那简直是一场该死的大乱。人们可以没完没了地谈论他们认为发生了什么，却对实际情况一无所知。正是这种无知导致了荒谬的、随机的推测。这就是为什么律师是如此必要的——因为公布真相可以一次击碎他们所有的狗屁。


    这种散布谣言的倾向在安全领域是普遍存在的，包括查理之前在 `CIA`（美国中央情报局）的职位。在加入 NOW 银行之前，查理辞去了他的间谍工作，当时他驻扎在利比亚的班格西（Benghazi）。他在那处基地遭受致命攻击前不久就离开了。查理·麦克深知这种推测的危险性。


    在 NOW 银行的案件中，有传言称整个资产管理客户名单被抢夺了，黑客控制了高频交易平台，他们本可以击垮银行甚至整个金融部门。


    还有传言说“他们”是中国间谍，被派来监视银行的每一项活动。或者可能是俄罗斯人，试图获取弗拉基米尔·普京（Vladimir Putin）的敌人或盟的财务信息。这些传言大多是荒谬的，但像最完美的谎言一样，包含了一丝真的内核。


