- raw: '**In May 2000, Vladimir Putin** became president of Russia. The country had
    already established itself as one of the leading bastions of criminal hackers—like
    Levin—and one of the greatest sources of astonishingly gifted engineers and mathematicians.
    Those great engineers and mathematicians, builders of code, of cyberweapons, hackers
    of nation-states didn’t associate with common criminals. What they did was different.
    Many hackers, like the infamous German cyberoperatives who stole nuclear secrets
    from U.C. Berkeley computers in the 1980s, just went on to work desk jobs after
    their years of espionage.


    But Putin saw the value in what hackers did, probably better than any other world
    leader. These criminals were incredibly sophisticated, some as much as the most
    gifted engineers, but they were messy and sloppy and weren’t motivated by patriotism.
    They wanted money and power and women and respect. But Putin believed patriotism
    could be cultivated, especially if it meant gifted hackers would not get extradited,
    as Levin had, and their spoils turned into shared resources of the state.


    Russia, both its government officials and certainly its criminals, turned its
    attention away from government assets in other nations and focused on business
    assets, which were poorly protected, if they were protected at all. Fewer and
    fewer cybercriminals were extradited. The state looked the other away when it
    came to taxing the hackers’ illicit earnings. But when Putin came knocking at
    the door for a slice of the information stolen from U.S. citizens, cybercriminals
    knew they had no choice but to give it up. It didn’t hurt their earnings and the
    state enjoyed the plausible deniability of being able to say it hadn’t ordered
    anybody to hack anything.


    On April 27, 2007, Russia attacked Estonia over a dispute involving an elaborate
    bronze statue of a Russian soldier in a Tallinn cemetery. To exact revenge for
    the removal of the war memorial, Russian criminal and state resources banded together
    and, most likely aided by a private-sector telecommunications company, took down
    a great many of Estonia’s broadcast services and defaced many of its websites.
    This cyberwar, the first of its kind, would lead the North Atlantic Treaty Organization
    to establish its cybersecurity headquarters in Tallinn. The decision was more
    than a symbolic gesture; today Estonia is a cybersecurity heavyweight.


    But when Russia brought Estonia offline, it caught the attention of the world’s
    militaries. And it emboldened young computer enthusiasts in Eastern Europe, especially
    Romania.


    **In 1994, when Vladimir Levin** was stealing Citi’s money, René Kreutz was born
    in her mother’s bedroom in a communist bloc apartment in Arnica Valka, Romania.
    Mrs. Kreutz, a homemaker, and Mr. Kreutz, a police officer, had never seen a computer.
    They would give their daughter an abacus as a toy, in the hopes that she would
    take up mathematics. It would be the first thing she ever gripped in her tiny
    fist.


    In 2000, when Vladimir Putin was sworn in as president of Russia, René saw a computer
    at a local library for the first time.


    In 2007, the year René tried alcohol, she heard all about the Estonia attacks.


    It was the Estonia event that made many of her young friends want to become hackers.
    Their motivation was half patriotic and half economic. Many of them hated the
    Russians for constantly using their digital might to assert themselves across
    borders. They also wanted to be rich and didn’t see a way to get there through
    a traditional career. They didn’t see themselves as criminals, just smart kids
    wanting to get one over on the world.


    René would not follow in their footsteps, however. Computers didn’t interest her.
    Math didn’t interest her, to her parents’ great disappointment. She liked to talk
    and wanted to be around people. It didn’t mean she didn’t respect the fevered
    pursuit of money or understand it, she just didn’t take part. Some kids like soccer,
    some kids like dancing, and some like computers. René liked to party.


    René’s schoolmates were no different from other kids across Eastern Europe and
    Russia, especially former Soviet states. These kids were competitive, anarchic,
    and untethered from their countries or their governments. In many of these former
    Soviet nations, few resources were dedicated to legal enforcement of computer
    crimes. It was like an open invitation for hackers. They had the same mind-set
    as someone who dreamed of Silicon Valley or the dormitories of Stanford, but they
    lacked the opportunity to pursue a career in tech. So they created their own opportunities.


    The competition to make money was fun for René’s friends. It was unstructured.
    Online, they could match wits, swap techniques, and share code with Russians,
    Israelis, Iranians, Americans, Jews, Muslims, and Hindus. René thought it was
    more like World Cup soccer than cyberwarfare. This post-Soviet hacker culture
    solidified around a few ideals: making money is paramount; it’s much more dignified
    to outwit opponents with a new innovation than to beat them with brute force;
    you need to show your country a little loyalty for letting you get away with this
    stuff.


    **By July 2014, while** Caroline admires a perfect sunset in Manhattan, René is
    heading off to class. She is studying marketing. This class is on making PowerPoint
    presentations. She is boring her pants off at Arnica Community College. She sometimes
    wishes she’d paid more attention to what her friends were doing and gotten into
    computers, too. Many of them already had good jobs in Bucharest or Tallinn.


    But she resigns herself to the work ahead. A marketing job will be nice. She dreams
    of being a spokeswoman for something, a professional talker. Something that involves
    being around people. She hates being online, despises social media, except to
    share pictures with her friends. She barely checks her email, never goes on Facebook.
    Prefers instead working her job as a waitress in the evening.


    PowerPoint class is boring but there is still a certain art to it that she appreciates.
    She pours as much energy as she has into making her slides look perfect. She worries
    she is wasting her time because nobody ever made millions off nice-looking PowerPoints.
    Though hers are beautiful, there’s no point in thinking that far ahead. There
    are hardly any businesses in Arnica Valka, or anywhere nearby, that need fancy
    PowerPoint presentations.


    **Bob Raykoff is lumbering his** way around the SOC, introducing some important-looking
    businesspeople. According to some employees, his use of jargon from his prior
    position makes them uncomfortable and prone to distrust him.


    Knowing glances have become currency in the SOC. Whenever Raykoff delivers a speech
    or tries to motivate them, the disconnection is so profound you can see the operators
    at their desks, completely motionless, only their eyes moving to meet with those
    of their deskmates. The unspoken message: “We’re fucked.”


    Professionally, legally, even personally. Fucked because Raykoff is already bringing
    in second and third layers of executives from his pool of guvvy friends, people
    he knows well, an informant army of fall guys who will provide a cushion between
    him and the unpredictable staff.


    Raising legitimate alarms up the corporate food chain will become harder, a huge
    problem in cybersecurity, as raw information will get filtered by the agendas
    of those in the middle before it reaches someone who can actually take action.


    Raykoff goes back to his new office outside the SOC within earshot of a handful
    of employees. He logs onto his computer. Ten minutes later he is slamming the
    mouse down repeatedly. His administrative assistant enters the room.


    “Everything OK?”


    “Uh, ha.” He grins sheepishly. “I can’t get this thing to work.”


    “What is it you’re trying to do?”


    “Uh, this . . . onboarding training. For new employees.” He sighs. “Honestly,
    I don’t understand why someone in my position needs to do this.”'
  fmt: "\nIn May 2000, Vladimir Putin became president of Russia. The country had\
    \ already established itself as one of the leading bastions of criminal hackers—like\
    \ `Levin`—and one of the greatest sources of astonishingly gifted engineers and\
    \ mathematicians. Those great engineers and mathematicians, builders of code,\
    \ of cyberweapons, hackers of nation-states didn’t associate with common criminals.\
    \ What they did was different. Many hackers, like the infamous German cyberoperatives\
    \ who stole nuclear secrets from `U.C. Berkeley` computers in the 1980s, just\
    \ went on to work desk jobs after their years of espionage.\n\nBut Putin saw the\
    \ value in what hackers did, probably better than any other world leader. These\
    \ criminals were incredibly sophisticated, some as much as the most gifted engineers,\
    \ but they were messy and sloppy and weren’t motivated by patriotism. They wanted\
    \ money and power and women and respect. But Putin believed patriotism could be\
    \ cultivated, especially if it meant gifted hackers would not get extradited,\
    \ as `Levin` had, and their spoils turned into shared resources of the state.\n\
    \nRussia, both its government officials and certainly its criminals, turned its\
    \ attention away from government assets in other nations and focused on business\
    \ assets, which were poorly protected, if they were protected at all. Fewer and\
    \ fewer cybercriminals were extradited. The state looked the other away when it\
    \ came to taxing the hackers’ illicit earnings. But when Putin came knocking at\
    \ the door for a slice of the information stolen from `U.S.` citizens, cybercriminals\
    \ knew they had no choice but to give it up. It didn’t hurt their earnings and\
    \ the state enjoyed the plausible deniability of being able to say it hadn’t ordered\
    \ anybody to hack anything.\n\nOn April 27, 2007, Russia attacked Estonia over\
    \ a dispute involving an elaborate bronze statue of a Russian soldier in a Tallinn\
    \ cemetery. To exact revenge for the removal of the war memorial, Russian criminal\
    \ and state resources banded together and, most likely aided by a private-sector\
    \ telecommunications company, took down a great many of Estonia’s broadcast services\
    \ and defaced many of its websites. This cyberwar, the first of its kind, would\
    \ lead the North Atlantic Treaty Organization to establish its cybersecurity headquarters\
    \ in Tallinn. The decision was more than a symbolic gesture; today Estonia is\
    \ a cybersecurity heavyweight.\n\nBut when Russia brought Estonia offline, it\
    \ caught the attention of the world’s militaries. And it emboldened young computer\
    \ enthusiasts in Eastern Europe, especially Romania.\n\nIn 1994, when Vladimir\
    \ Levin was stealing `Citi`’s money, René Kreutz was born in her mother’s bedroom\
    \ in a communist bloc apartment in Arnica Valka, Romania. Mrs. Kreutz, a homemaker,\
    \ and Mr. Kreutz, a police officer, had never seen a computer. They would give\
    \ their daughter an abacus as a toy, in the hopes that she would take up mathematics.\
    \ It would be the first thing she ever gripped in her tiny fist.\n\nIn 2000, when\
    \ Vladimir Putin was sworn in as president of Russia, René saw a computer at a\
    \ local library for the first time.\n\nIn 2007, the year René tried alcohol, she\
    \ heard all about the Estonia attacks. \n\nIt was the Estonia event that made\
    \ many of her young friends want to become hackers. Their motivation was half\
    \ patriotic and half economic. Many of them hated the Russians for constantly\
    \ using their digital might to assert themselves across borders. They also wanted\
    \ to be rich and didn’t see a way to get there through a traditional career. They\
    \ didn’t see themselves as criminals, just smart kids wanting to get one over\
    \ on the world.\n\nRené would not follow in their footsteps, however. Computers\
    \ didn’t interest her. Math didn’t interest her, to her parents’ great disappointment.\
    \ She liked to talk and wanted to be around people. It didn’t mean she didn’t\
    \ respect the fevered pursuit of money or understand it, she just didn’t take\
    \ part. Some kids like soccer, some kids like dancing, and some like computers.\
    \ René liked to party.\n\nRené’s schoolmates were no different from other kids\
    \ across Eastern Europe and Russia, especially former Soviet states. These kids\
    \ were competitive, anarchic, and untethered from their countries or their governments.\
    \ In many of these former Soviet nations, few resources were dedicated to legal\
    \ enforcement of computer crimes. It was like an open invitation for hackers.\
    \ They had the same mind-set as someone who dreamed of Silicon Valley or the dormitories\
    \ of `Stanford`, but they lacked the opportunity to pursue a career in tech. So\
    \ they created their own opportunities.\n\nThe competition to make money was fun\
    \ for René’s friends. It was unstructured. Online, they could match wits, swap\
    \ techniques, and share code with Russians, Israelis, Iranians, Americans, Jews,\
    \ Muslims, and Hindus. René thought it was more like World Cup soccer than cyberwarfare.\
    \ This post-Soviet hacker culture solidified around a few ideals: making money\
    \ is paramount; it’s much more dignified to outwit opponents with a new innovation\
    \ than to beat them with brute force; you need to show your country a little loyalty\
    \ for letting you get away with this stuff.\n\nBy July 2014, while Caroline admires\
    \ a perfect sunset in Manhattan, René is heading off to class. She is studying\
    \ marketing. This class is on making `PowerPoint` presentations. She is boring\
    \ her pants off at Arnica Community College. She sometimes wishes she’d paid more\
    \ attention to what her friends were doing and gotten into computers, too. Many\
    \ of them already had good jobs in Bucharest or Tallinn.\n\nBut she resigns herself\
    \ to the work ahead. A marketing job will be nice. She dreams of being a spokeswoman\
    \ for something, a professional talker. Something that involves being around people.\
    \ She hates being online, despises social media, except to share pictures with\
