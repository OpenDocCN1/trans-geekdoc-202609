  trans: '

    她幻想着去比罗马尼亚更漂亮的地方，一个非常遥远的地方。在她更狂野的幻想中，她逃到了英国、美国和加勒比海。她想象自己和西格（Sig）在某个温暖的岛屿上变现、度日。然后，也许老西格会回来。


    她是那个曾给科技高管们打过调情电话的女孩。她用一两个干脆、犀利的话语拒绝了他们的追求。“吃起来像鸡肉，哈，哈，哈。”现在，她只能对着唯一的观众（她自己）切碎、拆解自己的内心独白。嗯，从技术上说，现在有两个观众了。由于一个宝宝。她简直不敢相信这是真的。


    她盯着天花板，揉了揉下巴。她一直在看一个医疗网站关于颌痛的建议。她排除了许多原因——没有牙齿问题，没有补牙松动，也没有感冒。该医疗网站给了一个意外的原因，一个她意料之外的原因：愤怒。未化解的愤怒。


    她对这一点沉思了一会儿。愤怒，是的，愤怒。一种奇怪的感觉。


    # 14. 母亲


    数据并没有消失。只是被锁住了。波波（Bo Chou）略显恐慌。他是勒索软件的受害者，他的文件被锁定了。被质了。了他漂亮的数据。他有半小时时间回应攻击他的犯罪分子。首先是来自塞内加尔的间谍，现在又是这个。*狗，躺下*，他想。这太疯狂了。


    这种勒索软件被称为 `CryptoLocker`，他已经做了所有关于它的快速研究，以及如何修复它。数据并没有消失，只是被锁住了。波波略显恐慌。他是勒索软件的受害者，他的文件被锁定了。事实上，这并不是
    TechSolu 使用的那种勒索软件，而是一个更老旧、更原始的版本。波波没有遇到任何客服代表。


    波波有几个 GB 的数据面临风险。向他推销犯罪分子似乎是俄罗斯人，甚至是朝鲜人？很难通过自动化来判断。他们想要 500 美元，或者等值的 `Bitcoin`。波波很感激自己能够支付。他准备好通过手机转账，但停顿了一分钟思考自己所做的一切。


    在上海的 2015 年，自动化勒索软件是最新趋势，因为它可以病毒式传播到许多机器上。在被发现之前，波波正在经历某种处于爆发边缘的事情。更复杂的组织，如 TechSolu，已经转向了网络勒索：索要破坏性信息，金额通常更高。


    由于这涉及到很多不确定性。勒索者是否总是访问他们窃取的文件，这并不清楚。在波波的公寓窗外，人们尖叫得震天。。


    波波受困于自己的技术习惯，从未将他的数据库迁移到云服务器——这意味着他所有的数据都存储在笔记本电脑上。


    波波担心他们不仅锁定了了他的文件，还下载了它们。失去数据对他的生意来说是毁灭性的。他埋怨自己没有更新笔记本电脑。他花了几分钟时间研究 `CryptoLocker`
    是如何工作的，甚至在私人论坛上找到了一些信息。多年前，他习惯于在独立的硬盘上备份他的数据，但他变得懒惰并停止了。这意味着他所有的文件都无法访问，除非他支付赎金，获得解密密钥，并重新打开它们。


    *也许是运气好*，他想。他想要重新开始。也许他不应该支付赎金。也许他应该留下那些被锁的文件。也许他应该过上体面的、干净的生活，找一个女孩或男士安定下来。


    或者可以支付赎金，保留数据，并完全走向相反的方向。他在暗网上经常出没的一个地下组织正在讨论一种涉及他能从 `USB stick malware` 中收集的类型数据的盈利骗局。


    这种运作方式是：波波策略性地从选定的律师事务所、银行或咨询公司收集专有信息。这些信息是关于上市公司的，是非公开的。换句话说，就是影响公司股价的信息。


    如果是制药公司，这些信息可能包括癌症药物的糟糕测试结果；如果是咨询公司，则是大订单失败的消息。该小组的其他犯罪分子随后放置记录击输入的间谍软件或通过电脑摄像头观察目标，以确定新闻何时发布。


    然后小组在预期新闻之前买卖股票。他们几乎总是赢。他们在股市中赚了数百万，比波波在 `Fiverr` 上赚的零钱多得多。


    还有一个最疯狂的选择：波波离开犯罪生活，找一份合法的工作。他收到了一家在新加坡设有办公室的美国公司的兴趣。该职位将涉及大数据和分析。这个报价来自他的一个 `Fiverr`
    客户，一个经常飞行的那。那是一个经营东南亚小业务的高管。波波可以获得新加坡签证，这是一个奢侈且兴奋的国家，比上海更令人兴奋。但他必须放弃数据收集活动并完全改变生活方式。美国公司不会容忍他的数据采集，而且无法承担得罪新加坡法律系统的风险。他可能会生活在对自己所做过的危险事的恐惧中。


    他盯着电脑屏幕。它看起来是：


    ```

    ![image](img/158-01.jpg)

    ```


    外面，人群的声音越来越大。鼓声和音乐响了起来。他意识到又过去了 10 分钟。他现在只有一多小时的时间做决定，在他所有的数据被销毁之前。他注意到手机上有一个语音留言。不认识那个号码。


    他把手机免提，差点从椅子上掉下来。是他母亲的声音。他甚至不知道她是怎么得到这个号码的。他已经快一年没有听到她的声音了。她一如既往地很坚定，但语气里多了一些情感。她说，爸爸生了感冒了。他们对他六个月前寄给他们的钱非常感激。她想念他。


    波波的母亲来自中国西部的喀什，靠近尼泊尔。她是一个佛教徒。她固守传统。她试图将他塑造成和她一样的人——勤劳并满足于平淡的生活——但她没有成功。

    '
