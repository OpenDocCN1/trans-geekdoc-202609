- raw: 'In Bucharest, she buys a train ticket to Prague. From there, she intends to
    go to Berlin. *It’s beautiful there, lots of big companies*, she thinks to herself.


    The train trip will be 24 hours. She books a private overnight room. It has a
    seat and a fold-out twin bed. $200. She has the Bitcoin wallet address and her
    private keys memorized. She will tap into them once she’s in Germany, though it
    might not be easy to turn the cryptocurrency into euros. She attempts to tackle
    the problem from the train.


    The train has good Wi-Fi, which she uses with her burner to set up a business
    identity in Estonia shielding her own name. She creates a PayPal account. She’s
    learned all this from the guys at TechSolu, idly discussing what they will do
    with their earnings. Someday she will thank them.


    She does a test transfer from CEX.IO, a company that can cash out and transfer
    Bitcoin into PayPal accounts. She sees now, for the first time, that Sig had taken
    most of her stash. She isn’t surprised. She is more surprised that he’s left a
    fair amount, enough to get by for a year if she’s frugal. She transfers the remaining
    funds to PayPal. The transaction, thanks to the privacy of the blockchain, will
    be untraceable.


    Henry is easy. He sleeps, wakes, feeds, sleeps. The privacy of the private car
    is glorious.


    Despite being up all night, René doesn’t feel tired in the slightest, nor sad,
    nor scared. Her blood is pure adrenaline. The pain in her jaw is gone.


    By 1 a.m. Bucharest time, she imagines Sig stumbling home. He won’t notice they
    are gone until he wakes up. This scenario is keeping her on edge. Imagining those
    first moments when he realizes she’s not there, has taken the money, and has left
    him for good.


    Will he come after her?


    She doesn’t think so. Sig values control above all things. If he knows she is
    no longer susceptible to his influence, he will simply cease to care about her.


    This is what she hopes.


    ## **20.**


    ## The Reason


    **“Valery Romanov? Don’t know him.** He’s in prison, you say?”


    “I was wondering if you had heard of him,” the reporter asks.


    Victor Tanninberg laughs. “Why would I hear of him? For the last time, I’m not
    a hacker!”


    His reporter friend sits on the corner of the bed in his small house. But that’s
    only because there is nowhere else to sit. Every square inch of his place is covered
    with computer parts and wires and tools. Fox News blares in the background.


    “So let’s go back to my original question then, because I’m writing a story on
    it. Is it possible to cut the brakes on a car remotely? To blow out the tires
    or depress the accelerator? Everyone says it’s possible, but nobody can demonstrate
    it.”


    Victor sits in a dark corner of the room, next to a fat rabbit named Sam. Both
    like to be close to the air conditioner.


    “Why would I do such a thing as cut brakes?” he says. “I would just lose customer.”


    “I’m not asking if you would do it. I’m asking if it’s possible.”


    “Why would I want to put myself in this kind of risk?”


    He gestures around the room. The reporter, named Frances, assumes he’s referring
    to the overflowing stacks of computers when he adds, “And give up all this?”


    His computers are not “computers” as a consumer might think of them. They are
    computers that control each car’s engine. Each of them is the size of a small,
    thick textbook. Accordingly, some are even filed like books on a bookshelf. The
    rest are bursting out of drawers and piling up on the couch.


    He doesn’t like when the reporter calls him a hacker. He has a PhD in string theory,
    he likes to remind her.


    The reporter was in a jam, so he sold her one of his hacked cars. A ’99 Chevy
    Lumina, a used cop car that looked like it was beaten with golf clubs. It drives
    like a Porsche.


    The reporter wants to talk to him about his business, but Victor keeps turning
    the conversation to Donald Trump. The man from Queens has turned into an obsession
    for Victor. He shows the reporter a detailed map on his laptop of precisely how
    Trump will win the election. She tells him he’s crazy. Never gonna happen. He
    won’t even win the primary, she says.


    He gets annoyed. Trump will win Michigan, Florida, Ohio, and Pennsylvania, he
    insists.


    “You will see.”


    She laughs.


    The reporter has come out to New Jersey to find out if assassination by car hacking
    is possible. It’s one of the perennial what-ifs that she gets asked about the
    most. A tall tale, heretofore theoretical, that everyone from military generals
    to cybersecurity PR flacks to sociopathic executives seem to hope is true. It’s
    part of the greater collection of apocalyptic cyberliterature under the headline
    of “Cyber Pearl Harbor” or “Cyber 9/11.”


    *Huge lie*, she thinks. Thirty years of this lie and so little to show for it.
    A court of lies. A kingdom of lies.


    Everyone wants to scare their bosses, to maximum effect. More fear equals a bigger
    budget to combat that fear when what they are really doing is stoking it. The
    reporter just wants an answer, for today anyway. Some proof that this one little
    hallmark of horrific cyberthreats is legitimate. And if it is, an explanation
    of how it can be pulled off.


    “Sounds like beginning of conspiracy theory,” Victor says, a wry grin on his face.
    “Diplomat A dies. Diplomat A’s supporters say he was assassinated by unknowable
    person related to Politician B. Conspiracy theory remains in perpetuity, benefiting
    all.” He lights a cigarette, a long Parliament. “Yes, it can be done. But who
    would want to do such a thing?”


    The reporter’s mind reels. “OK, wow. But how?”


    He looks at her with eyes narrowed to tiny slits. “Too hard to explain.”


    “I’m serious, so you go in, the same way you would tweak the—I don’t know—fuel
    pump output . . .”


    “You don’t know what you’re talking about.”


    “No shit. So explain it to me so I can understand.”


    “Would you like me to explain to you string theory, too? Maybe before lunch? You
    won’t have any hope of understanding that, either. This isn’t even my field, not
    even close. Someone would have to understand the complexities of the entire car
    network. People like this exist, but these are not run-of-the-mill idiots on the
    internet. CIA, Russian intelligence, Mossad, this is very complicated. Probably
    easier to dangle diplomat over tank of sharks.”


    The reporter doesn’t answer, hoping he will continue. Victor does not.


    She tries to fill in the space with more questions. “But can’t you do it remotely?
    As the car is passing by?”


    He pulls a face—pure exasperation. He collapses his head and shoulders down. Rubs
    the area between his eyes. She reminds him how many people have written articles
    about the threats to our consumer products, that, wired as they are to the internet,
    they could be turned against us, to be used for terrorism.


    “Not my thing. Why are you so worried about cars? I’m worried about the electric
    grid.” But he just pets his rabbit and turns his attention to a Trump rally in
    Fort Lauderdale on Fox.


    “Look at this man, he is an animal,” he says, a bright smile on his face. “He
    will win, you will see.”


    **The reporter has learned** a lesson through these conversations, that the significant
    cyber incidents indeed don’t happen without a person behind the scenes who has
    a deeply felt reason for inflicting pain. People need reasons to do what they
    do, and hackers are people. Money is the usual reason, followed by loyalty to
    country—like Russia’s intelligence directorate—or loyalty to a cause, like the
    Izz ad-Din al-Qassam Cyber Fighters.


    If the reason isn’t money or identification with some type of faction, it could
    be simple curiosity or something equally unpredictable. There are people like
    Dieter, who have managed to turn their curiosity into a profession, but at that
    point, the motivation becomes money—at least, enough to make a living doing what
    one enjoys.'
