  trans: '

    当 Raykoff 在二楼不在时，一名新团队成员正搬进 `SOC`。Caroline 也在帮助他做准备。Prem Ramesh 现在是 Raykoff 的二号人物，担任新设立的首席幕僚一职。他并不是
    Raykoff 想要雇佣的那个人。事实上，Prem 曾为了 Raykoff 的职位——网络安全负责人一职与之竞争。Ramesh 个子高大，三十多岁，且像灰猎犬一样矫捷，与他以前的竞争对手和新老板完全不同。相反，他被硬塞进来，当了
    Raykoff 的副手以及银行网络安全运营团队的领导。


    Prem 曾在国内最大的国防工业公司之一建立了一家咨询业务，并发明了一种理解 IT 安全的框架，被称为 `kill chain`（攻击链）。它不仅被 Raykoff
    和他的同僚采用，也被许多网络安全专业人员采用，作为描述犯罪分子如何实施网络犯罪的简单方法。它是一个关于网络攻击如何运作的便捷叙事包，从早期的侦察到攻击者的直接行动无所不。


    其背后的哲学非常简单：在尽可能早阶段中断序列，以停止攻击并减少损失。花钱专注于在犯罪分子完全进入命令和控制阶段之前发现正在进行侦察的他们。


    但对于 Prem 的目标来说，教训更具挑战性，因为攻击 `NOW Bank` 的人已经处于命令和控制阶段。


    Prem 和一个传播团队正在制作一份 PowerPoint 演示稿，反复勾画和修改，试图决定如何用 `kill-chain` 的术语来解释他们目前对此次入侵的了解情况。


    首先，犯罪分子似乎对银行进行了大量的研究，在组织的许多不同层级上进行了侦察。他们在 `LinkedIn` 上寻找员工的个人信息，并探索了边界——即存在于 `firewalls`
    之外的银行数字部分——寻找入侵方法。他们还研究了可能与公司连接的其他网站。`NOW Bank` 运行的是所谓的扁平网络，这意味着任何获得网络部分访问权限的人都可以访问其所有部分，跨越所有这些机构，一直到资产管理、投资银行及更远的地方。


    犯罪分子获取这些宝贵信息并将其武器化。他们利用收集的所有数据来寻找突破口。他们为 `NOW Bank` 或他们可能针对的任何其他人进行定制方案。


    在其中一个案例中，分子的研究发现了两个初级员工，他们是罗德岛州一个大学计划的承包商，通过社会工程学手段交出了凭据。社会工程学描述了人们被说服放弃敏感信息的各种方式：无论是通过巧妙的电子邮件，还是通过位置恰当、有说服力的电话。有时，犯罪分子会伪装成一个不幸的技术人员，试图为目标解决某些问题。这之所以被称为社会工程学，是因为这种技术利用了你信任他人的本能欲望；它本质上是将你的礼貌和帮助的意愿作为对你的工具。


    侦察还得出了另一个入口区域：一个由 `NOW Bank` 赞助的年度活动半马拉松网站。该网站本身是由第三方（一家外部公关机构）应银行内部一个低调的社区服务部门的要求构建的。这类项目很容易被遗漏。由于该赛马网站的构建方式不安全，但被允许连接到银行网络以方便参与者报名，任何可以访问防御薄弱的赛马网站的人都可以进入银行庞大网络的其余部分。Caroline
    和她的团队，以及在此之前的之前的许多安全高管多年一直倡导网络分段，这一过程本可以在银行各个部门之间创建吊桥，但从未有足够的资金。


    因此，对于这些显然老练的犯罪分子来说，将武器化的恶意软件包投递给毫无防备的员工或通过未受保护的网站，并没有多大挑战。`kill chain` 的利用和安装部分涉及使用此通道来执行恶意包并安装程序，允许犯罪分子提取他们想要的信息：在这种情况下，是姓名、社会安全号码。

