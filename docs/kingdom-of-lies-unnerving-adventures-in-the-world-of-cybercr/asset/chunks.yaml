  trans: '


    `PRIVATE KEY`: 私钥：一种必须保持保密的加密密钥，用于启用非对称加密算法的运行。非对称密钥对中与实体唯一关联的机密部分。


    `PUBLIC KEY`: 公钥：一种可以广泛发布的加密密钥，用于启用非对称加密算法的运行。非对称密钥对中与实体唯一关联的公开部分。


    `PUBLIC KEY CRYPTOGRAPHY`: 公钥加密：密码学的一个分支，其中加密系统或算法使用两个唯一关联的密钥：公钥和私钥（一对密钥）。


    `RECOVERY`: 恢复：在事故或事件发生后，在短期和中期内恢复基本服务和操作，并在长期内完全恢复所有能力的活动。


    `RED TEAM`: 红队：一个获得授权并组织的团体，用于模拟潜在对手对企业网络安全态势的攻击或利用能力。


    `REDUNDANCY`: 冗余：额外的或替代的系统、子系统、资产或过程，在另一个系统、子系统、资产或过程丢失或失败时维持整体功能的一定程度。


    `RESILIENCE`: 韧性：适应变化条件的能力，以及准备、承受和从中断中快速恢复的能力。


    `RESPONSE`: 响应：处理事故的短期直接影响的活动，并可能支持短期恢复。


    `RISK ASSESSMENT`: 风险评估：收集信息并对风险赋值的成果或过程，目的是设定优先级、制定或比较行动方案，并为决策提供信息。对实体、资产、系统或网络、组织运营、个人、地理区域、其他组织或社会所临风险的评估，包括确定不利情况或事件可能导致有害后果的程度。


    `RISK MANAGEMENT`: 风险管理：识别、分析、评估和沟通风险，并在考虑所采取任何行动的相关成本和收益的情况下，接受、避免、转移或将风险控制在可接受水平的过程。这些行动可能包括(1)
    进行风险评估；(2) 实施缓解风险的策略；(3) 持续监控风险；(4) 记录整体风险管理计划。


    `ROOTKIT`: 根根包：安装在信息系统中具有管理员级访问权限的软件工具集，旨在隐藏工具的存在、维持访问权限并掩盖工具执行的活动。


    `SECURITY PROGRAM MANAGEMENT OR PROJECT MANAGEMENT`: 安全计划管理或项目管理：人员管理组织内、特定计划或其他责任范围内的信息安全影响的工作，包括战略、人员、基础设施、策略执行、应急计划、安全意识和其他资源。


    `SIGNATURE`: 签名：一种可识别的、独特的模式。


    `SITUATIONAL AWARENESS`: 态势感知：根据收集的信息、观察、分析、知识和/或经验，理解有关当前和发展的安全态势及风险的信息。在网络安全中，理解网络、系统、用户和数据在可用性、机性和完整性方面的当前状态和安全态势，并预测它们的未来状态。


    `SOFTWARE ASSURANCE`: 软件保证：对软件不存在由于故意设计的漏洞的信心程度。


    `SPAM`: 垃圾邮件：滥用电子消息无差别地发送大量信息。


    `SPOOFING`: 伪装：伪造传输地址以获得非法或未经授权的进入。冒充、搭便和模仿都是伪装的形式。


    `SPYWARE`: 间谍软件：秘密或暗中安装在系统中的软件。


    `SUPPLY CHAIN`: 供应链：由组织、人员、活动和资源组成的系统，用于从供应商到客户创建并移动产品。


    `SYSTEM ADMINISTRATOR`: 系统管理员：安装、配置、故障排除和维护服务器（硬件和软件）的人。还管理账户、密码和账户创建。


    `TABLETOP EXERCISE`: 桌面演习：基于讨论的练习，人员在教室环境或小组中会合，并接收一个情景以验证计划、程序、政策、合作协议的内容。


    `THREAT`: 威胁：指示可能对生命、信息、操作和/或财产或社会造成伤害的情况或事件。


    `THREAT ACTOR`: 威胁主体：实施或意图实施有害活动的的个人、团体、组织或政府。


    `THREAT ANALYSIS`: 威胁分析：对单个威胁特征的详细评估。包括识别和评估网络犯罪或外国情报实体能力的工作。


    `THREAT ASSESSMENT`: 威胁评估：识别或评估具有可能性的实体、行动或事件（无论是自然还是人为）的成果或过程。


    `TICKET`: 票：在访问控制中，验证客户端或服务身份的数据，并与临时加密密钥（会话密钥）共同组成凭据。


    `TRAFFIC LIGHT PROTOCOL`: 红绿灯协议：一组使用四种颜色（红、黄、绿、白）的标记，用于确保敏感信息共享给正确的受众。


    `TROJAN HORSE`: 特洛伊马：一种看似具有有用功能但具有隐藏的潜在恶意功能的计算机程序，有时通过利用调用程序的系统实体的合法授权来规避安全机制。


    `UNAUTHORIZED ACCESS`: 未经授权访问：任何违反规定安全策略的访问。


    `VIRUS`: 病毒：可以自我复制、在用户许可或不知的情况下感染计算机，然后传播到另一台计算机的计算机程序。


    `VULNERABILITY`: 漏洞：一种特征或特定弱点，使组织容易受到特定威胁的利用或特定危害的影响。


    `WEAKNESS`: 软件代码、设计、架构或部署中的缺陷或不足，在适当条件下可能成为漏洞或导致漏洞的产生。


    `WHITELIST`: 白名单：被认为是信任的并授予访问权限的实体列表。


    `WORM`: 蠕虫：一种自我复制、自我传播的自包含程序，利用网络机制传播自身。


