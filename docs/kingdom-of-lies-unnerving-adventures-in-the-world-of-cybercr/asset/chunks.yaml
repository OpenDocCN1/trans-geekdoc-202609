- raw: 'While Raykoff is MIA on the second floor, a new team member is moving into
    the SOC. Caroline is helping to prep him, too. Prem Ramesh is now Raykoff’s number
    two, in the newly created role of chief of staff. He wasn’t the person Raykoff
    had wanted to hire. In fact, Prem had competed for Raykoff’s job as the head of
    cybersecurity. Short, mid-30s, and sleek as a greyhound, Ramesh is nothing like
    his former rival and new boss. Instead, he was shoe-horned in as Raykoff’s second
    in command and the leader of the bank’s cybersecurity operations team.


    Prem had built a consulting business within one of the country’s biggest defense
    industrial companies and invented a framework for understanding IT security called
    the kill chain. It’s been adopted not just by Raykoff and his compatriots but
    by many cybersecurity professionals as a simple way of describing how criminals
    commit cybercrime. It’s a convenient soup-to-nuts narrative package for how a
    cyberattack works, from early reconnaissance to direct action by an attacker.


    The philosophy behind it is simple: Interrupt the sequence at the earliest point
    in order to stop the attack and reduce the damage. Spend money to focus on finding
    criminals doing reconnaissance before they get all the way to command and control.


    But for Prem’s purposes, the lesson is more challenging because whoever has attacked
    NOW Bank is already on command and control.


    **Prem and a communications** team are creating a PowerPoint presentation, sketching
    and resketching, trying to decide how to explain what they know about the intrusion
    so far in kill-chain terms.


    First, it appears the criminals conducted significant research on the bank, reconnaissance
    at many different levels of the organization. They looked for personal details
    of employees on LinkedIn and explored the perimeter—the digital part of the bank
    that exists outside its firewalls—for ways in. They also researched other websites
    that may connect with the company. NOW Bank runs what is known as a flat network,
    which means that anyone who gains access to one part of the network can essentially
    access all of it, across all of those many organizations, all the way up to asset
    management, investment bank, and beyond.


    The criminals take this valuable information and weaponize it. They use all of
    the data they have gathered to find a way in. They do a custom-made job for NOW
    Bank or for whoever else they may be targeting.


    In one case, the criminals’ research yielded two junior employees, contractors
    at a university program in Rhode Island, who were socially engineered to give
    up their credentials. Social engineering describes the variety of ways people
    can be convinced to give up sensitive information: whether through a clever email
    or a well-placed, convincing phone call. Sometimes a criminal will pose as a hapless
    technology worker trying to fix some problem for the target. It’s called social
    engineering because the technique exploits your natural desire to trust another
    person; it essentially uses your politeness and willingness to help as a tool
    against you.


    There is another area of entry that the reconnaissance also yielded: a half-marathon
    website for a yearly event sponsored by NOW Bank. The website itself was built
    by a third party, an outside public relations agency, at the behest of a discrete
    community service department within the bank. These types of projects can easily
    fall through the cracks. Since the race website was built insecurely but was allowed
    to connect to the bank’s network in order to facilitate the sign-up of participants,
    anyone who could access the poorly defended race website could gain entry to the
    rest of the bank’s vast network. Caroline and her team, and many security executives
    before her, had been advocating for network segmentation for years, a process
    that would have created drawbridges between various bank departments, but there
    was never enough funding.


    It’s therefore not much of a challenge for the criminals, who are clearly sophisticated,
    to deliver a weaponized bundle of malicious software to unsuspecting employees
    or through the unprotected website. The exploitation and installation portions
    of the kill chain involve using this conduit to execute the malicious bundle and
    install programs that allow the criminals to extract the information they want:
    in this case names, Social Security numbers, and other sensitive banking information
    belonging to NOW Bank customers who may be especially susceptible to a pushy stock
    scheme.


    With this access now installed throughout the bank, the criminals are able to
    command and control their various malicious installations to forward all that
    sensitive information to their servers overseas.


    NOW Bank is trying to determine which course of action to take. If they tip off
    the criminals that they are aware of their presence, it could cause them to take
    destructive action that could ruin the bank’s servers and burn their trail. The
    attackers would do this only if they knew their nefarious activity had been discovered.
    So the SOC team has to work quickly and very quietly.


    After three days of working on the kill-chain explainer, the cybersecurity team
    opts to destroy it before it’s circulated further.


    **To continue working the** incident quietly, the professionals in the SOC must
    try to determine what’s being taken and which pipelines they will need to shut
    off to stop the problem.


    There are many *other* problems that complicate this. First, the bank is using
    wildly different storage protocols from one department to the next. In a single
    organization, people in one department may have been saving their documents, reports,
    client lists, and other critical data to a database shared among similar employees,
    while in another department, people have the habit of storing these documents
    in duplicate to their email inboxes or on their desktops. These reports are given
    names, and those names would also be different across departments. Because of
    this, determining what is being taken is a monumental task in itself.


    There are further complications. NOW Bank, like most large banks, has a patchwork-quilt
    network compromised by years of acquisitions. Different systems of storage and
    data layered on top of data and more data are a legacy hallmark of the 2008 financial
    crisis, when several failing banks were pushed together rapidly and haphazardly.
    Like those messy and fast mergers, the merged networks of those banks were equally
    messy, difficult to navigate, and difficult to secure, contributing yet more headaches
    for the cybersecurity staff.


    In order to talk about the ongoing data breach as quietly as possible, the cybersecurity
    investigators give the incident a name: Venice. Apropos of nothing, the name is
    meant as a way to easily discuss what’s happening with the breach in conversation
    without anyone, including the criminals, catching on to the use of language like
    “breach” or “intrusion.” This way, the investigators can avoid tipping off the
    criminals who have taken up residence in their network.


    Prem is speed-walking from one meeting to another to discuss Venice. Right now,
    the bulk of the conversations about the event are happening face-to-face to keep
    things quiet. Sometimes Raykoff is in the room, but most often he is not.


    The focus on privacy will soon become more like an obsession, though. Because
    someone will start leaking details of the attack to the press.


    **About four weeks later,** somewhere in what used to be called Transylvania,
    a German sits at a cafe by the highway, drinking strong coffee and reading *The
    Sydney Morning Herald*. The weather is hot and humidity is 100 percent, unlike
    the cool dry New York July.


    Sig Himelman is a six-foot, four-inch hacker. He looks like a businessman. The
    waiter at the cafe treats him accordingly. Calls him boss. Comments on his good
    sunglasses.'
