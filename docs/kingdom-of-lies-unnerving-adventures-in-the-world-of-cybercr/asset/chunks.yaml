  trans: '

    攻击是不可避免的。国防部每天都遭受攻击，而国防部是一台战争机器。银行不是战争机器。它无法反击，只能防御。即便在那种防御中，该企业也受限于其预先规划的场景。。这些场景被记录在堆积如山的文件中。它们通常是理论性的、历史性的或隐形的——也就是说，没有重要人物见过这些攻击的发生——这一事实让安全职能本身保持了隐形。


    这就是为什么 DDoS 攻击改变了一切。一些高管开始将银行视为一台战争机器。另一些人开始认为，银行如果失败，至少会面临极高程度的尴尬——这在商业术语中被称为“声誉风险”。


    网络安全人员获得了机会提议他们如何使用一笔巨额预算。作为回应，卡罗琳（Caroline）和她的团队创建了世界上见过的最雄勃的 PowerPoint 预算提案系列之一。他们要了大量的资金，并且获得了。数百万美元流入了网络安全预算。他们建立了
    `SOC`。更优秀的人来到那里工作。纸面再次获胜。


    然后，事情发生了意料之外的转折，完全超出了任何从事网络安全工作人员的控制。银行的首席运营官让他的兄弟卷了进来。高管们痴迷于寻找一个与预算相匹配的知名人物。一个在纸面上看起来非常棒的人，一个写过关于网络战争书籍的人。因为他们现在是一台战争机器，对吧？


    鲍勃·雷科夫（Bob Raykoff）登场。


    ## 网络安全文化


    企业界存在一种广泛观点，认为豪华、高调的环境对于保持资金流动是必要的，因为金钱生金钱。


    但网络安全人员，即使是技术人员，也不需要、也不一定喜欢昂贵的技术。电影和电视在这一点上误导了观众，因为分析师的大部分工作涉及坐在椅子上，眼睛来回扫动，根据不断变化的变量计算风险。为此你不需要昂贵的装饰。


    令人印象深刻的霓虹图形和带有闪烁灯光（代表攻击）的世界地图只是一层外壳，是层层的代码。`SOC` 中大多数工作者整天看到的更像上面那样。


    ![image](img/img_049-01.jpg)


    他们对于自己被看到也不感到特别舒服。拨动雾墙开关很快变成了一个笑话。每当这种情况发生时，大家不是透过透明玻璃向外看，而是同时看着离子屏幕上的数据。他们想确保上面没有什么真实的定罪证据。一旦确保了安全，也许，他们就会大笑。


    只有极少数人真正关心办公室的外观，但关注这一点是卡罗琳众多工作之一。成功和权力的表象赋予了真正的成功和权力。昂贵的艺术品装饰着即使是最简陋的会议室墙壁。银行在五十楼的一个会议室里展示了西迪·罗斯福（Teddy
    Roosevelt）的狩猎枪。`SOC` 相当于网络安全版的西迪·罗斯福狩猎枪。


    没有优秀的安全人员，你就无法做好良好的安全，而真正优秀、有才华的安全人员通常不想在银行工作。将他们从硅谷、初创公司、Google 和 Apple 抢走是花钱的。


    `SOC` 还没有标志。玻璃大部分时间保持不透明。为了进入 `SOC`，你必须知道它在那里。然后你需要注意到蜂蜜橡木墙隔板上的缝隙。那是门，但没有手手。有一个小小的电子条，你可以在那里刷安全证，但如果你不是
    30 万名员工中的约 30 人之一，你就无法进入。所以你必须敲墙。


    ## SOC 运营


    这一天，和大多数时候一样，雷科夫无处寻觅。他的新办公室在接待区。那里有一排六把椅子和六张办公桌，呈交易员阵型排列，全部面向朝南的落地窗。那里的光线非常亮，员工有时很难看清屏幕。通常只有两个人：一个政府关系关系人员和一个情报主管。他们是
    `SOC` 的支持人员。政府关系人员——一个高大、易怒的阿拉伯裔美国前特工，名叫盖布（Gabe），他不停地喝红牛——确保来自 `FBI`、`NSA`、`DHS`、军方分支和
    `CIA` 的每个人都觉得他们被知情了。盖布的工作是牵着他们的手，确保他们被邀请参加午宴。


    情报主管是一个安静、才华横溢的韩裔美国前特工名叫汤姆（Tom），他接收 `SOC` 内部人员所有的新闻和信息源，并将其转化为一份关于下一个威胁将是什么以及从哪里来的预测报告。


    这一天，卡罗琳意识到她把钥匙留在了 `SOC` 里。她冲回，刷了四次卡回到大楼，跑上楼梯，通过安检接待，回到 `SOC`，在那里她拿了钥匙并迅速转身，瞥向南面的落地窗。阳光洒满了房间，景色让她屏息。这地方也是她的孩子。


    这是国家黑客建立的。


    ## 莱文事件


    1994 年 8 月，一个名叫弗拉基米尔·莱文（Vladimir Levin）的黑客转账了 1000 万美元（相当于 2018 年的 2.5 亿美元），通过电信网络汇入瑞典和丹麦的账户。他入侵了
    `Citibank` 和存款储信结算公司（Depository Trust & Clearing Corporation，后者是监控和批准国际电汇的中间机构）。这不是第一次有人利用计算机从银行偷钱，但它是最大、最直观、最受报道的抢劫案之一。`Citibank`
    在 1995 年使用了大量技术，但他们没有网络安全部门。他们有物理安全人员。但他们过去处理过的数据类型更像是新泽西州公路路上的一辆翻车的车，那辆车装载着数据带前往存储设施。


    莱文事件导致银行创建了首个首席信息安全办公室。新部门将帮助保护银行的资金。而不是人们的数据，不是知识产权或专利交易信息。钱。因为在当时那是人们想要偷的东西。俄罗斯允许莱文被引渡。像莱文这样的黑客领先了银行
    15 年。钱就是钱，没了就没了。他随后在伦敦的希斯罗机场被捕获，送往曼哈顿，并因其犯罪被处监禁三年。

