- raw: '*Military men and women who engage the enemy today may give little thought
    . . . to the damage they may cause digitally. As with military actions from the
    air or by drone, military personnel may not be significantly or closely engaged
    with the people who are affected at the other end of their attack. The collateral
    damage in cyberwarfare, particularly in the private sector, where these battles
    will most likely be fought, could be catastrophic*.


    A little over a year from now, Bob will be Carl’s boss. Neither of them knows
    it; nor can they even fathom the possibility. There are a lot of things that Bob
    knows about cybersecurity, but there are even more things that he doesn’t know.
    But he’s right on the money when it comes to the fallout from the DDoS attack
    at NOW Bank. It will be catastrophic. There will be considerable collateral damage,
    and he will be right in the middle of it.


    From his office in the Washington, D.C., suburbs, Bob considers the futurethreat
    again.


    *Definitely Russia*, he thinks. *Or China*.


    As it turns out, the futurethreat is neither Russia nor China, It is a 15-year-old
    girl living in the Romanian countryside, dancing to music so loud she can barely
    hear herself think.


    René Kreutz shouts in ecstasy as another wave of her high school friends makes
    it through the door of a pop-up nightclub in a small Transylvanian town called
    Arnica Valka. It’s a town hardly anyone has ever heard of. It is known mostly
    as an acceptable place to stop for lunch between Bucharest and Budapest.


    René is a little bit drunk. The club is the center of the world, as far as she’s
    concerned. Everywhere else is orbiting around this spot. Around her.


    She dances, the eye of a sweaty storm of teenagers, and screams the lyrics to
    a Bucharest rapper’s hit song, spoken in half English, half Romanian, called “Americandrim.”
    It references every pop-culture trope, one after the other: Coca-Cola, MTV, George
    W. Bush, McDonald’s.


    *I can be what I want to be*


    *Losing my identity*


    René’s friends scream the last line into the sooty air above them. Everything
    around her smells like cheap liquor and cherry-flavored lip gloss. In fact, René’s
    drink tastes like cherry-flavored lip gloss.


    *Is there anything more to life than this?* she wonders, happily, drunkenly.


    There is. A great deal more, in fact. In three years, René, who is no good at
    computers but who is utterly charming, will become one of the world’s most influential
    hackers practically overnight.


    René squeezes next to her friends and flashes a peace sign for a selfie on an
    old Motorola cell phone.


    **At around this same** moment in Moscow, one of the world’s most influential
    hackers, Valery Romanov, is taking a selfie, too. It’s his favorite pose: Valery
    Romanov, hacker extraordinaire, with stacks and stacks of cash.


    Valery is dressed like an extra in an American office-based situation comedy.
    A short-sleeved, button-down shirt, wrinkled khakis. Blond and pudgy, he isn’t
    really focusing on his own bland countenance. He centers the photograph on the
    cash instead, the real star of this portrait. He flashes a peace sign.


    Romanov has just finished watching the DDoS attack against NOW Bank from inside
    the bank’s networks. He’s in there, too. But not for silly Islamist reasons. He
    enjoys live-action fighting. Like pay-per-view only without the pay. He smiles
    and contemplates the bottle of vodka beside him.


    The DDoS attack presents a big opportunity for somebody, he thinks as he looks
    at the open ports at the bank, the unguarded sections of a huge, vast enterprise.
    The data has been left unguarded because the bank is pouring all its resources
    into fighting the DDoS attack.


    Valery notices that all of the credit cards issued by the bank are now expired.
    Somebody has slipped in while the bank was fighting off the Iranians and made
    the change. But it wasn’t him. Not this time.


    Valery is a little preoccupied these days. The FBI is after him. And Interpol.
    And now the surprisingly fast and frightening Direction Générale de la Sécurité
    Extérieure in France. He’s drinking too much. His new fiancée is pregnant. The
    selfies with the cash make him feel better.


    Two years earlier, he got caught up in stupid Islamist bullshit when the cafe
    in Marrakesh he happened to be eating at was blown up in a terrorist attack. Now
    part of his head is missing. Before that, and for a little while afterward, he
    was one of the greatest, most prolific, and most influential hackers in the world.


    Now it’s 2012, and his number is just about up.


    ## **2.**


    ## The Charlatan


    **Caroline Chan is a killer.**


    Her new boss doesn’t know this. And he won’t realize it when he meets her today.
    In fact, he never will.


    Caroline works at NOW Bank, one of the world’s biggest banks. She doesn’t wear
    a suit. She’s not in Manhattan. She’s in a back office in New Jersey and doesn’t
    dress to impress.


    Caroline is what is known in the staid language of corporate finance as a business
    manager, and she manages the business of the bank’s cybersecurity. She manages
    the shit out of it. She does the budget; builds teams of engineers, technicians,
    security executives; and keeps the factions from fighting with one another.


    She also hires the hackers. She’s been doing this for nearly 20 years, since she
    was an intern fresh out of college. She’s been hiring hackers since before the
    bank knew it needed to hire them. She’s the hacker whisperer, and they are her
    dragons.


    Caroline is a 4-foot, 11-inch Chinese woman with a New Jersey accent and an Irish
    Catholic husband. She doesn’t crush nuts in board meetings. Her ambition extends
    to doing good for the people who have become her friends and carving out a comfortable
    existence in the New Jersey suburbs.


    She is always handing the microphone to somebody else. She scoops the ice cream
    at retirement parties. She drops achievement certificates on her colleagues’ desks
    on their work anniversaries. She’s the one who hugs the interns when they are
    done for the summer. She does all of the dirty work.


    But, by God, if you cross her . . .


    Caroline incubates and raises hackers. She gets them when they’re young, watches
    them hatch, and turns them into dragons. Many of them grow into productive bank
    employees, testing the bank’s networks, rising through the executive ranks. The
    bank has 300,000 employees, and they’re spread out in all corners of the globe.
    There’s one guy in Greece, three people in Beirut, and a receptionist in Uzbekistan.
    Her dragons have grown up and spread their wings across the bank’s vast expanse.
    She protects them from the suits. She is the Daenerys Targaryen of cybersecurity.


    Take Carl, for instance. He’s one of her dragons. Now he’s a high-level manager
    in Singapore. She made sure he was taken care of after the DDoS attacks. She takes
    care of her dragons when they deliver, and they always deliver.


    Nobody has more dirt than Caroline. All those executives who try to score hookers
    on Craigslist? She knows them on a first-name basis. The traders who create their
    own applications so they can insider trade? She’s onto them. The derivative swappers
    who lose it from the pressure and send abusive emails to the CIA? She has some
    stories.


    The executive who propositions his employees on one of those “disappearing” chat
    services? She’s got more than a few files saved.


    The C-suiter who registered his corporate email with [backpage.com](http://backpage.com)—not
    to procure a hooker, but to be one? Oh, she’s keeping that one to herself for
    now.


    Everyone at NOW Bank who has ever done anything at all related to cybersecurity
    has worked for Caroline. The senior guys, the junior guys, even some of the big
    shots who go on CNBC, they all sat in a room across from Caroline once. They slid
    a copy of their resume across the desk, answered her probing questions, and negotiated
    their salaries. She dealt with them all with the tenderness of a mother.'
