    投票计数、术语表、Linux 内核之路，


    比尔·乔、拉里·沃尔、林纳斯、吉多·范·罗斯姆


    Crunch 船长、老贝尔、二六六百


    火从未熄灭


    它一直在燃烧，自从世界转动以来


    这种情况一直持续了好几个乐章。安东尼穿梭于 Crunch 船长的历史、《布谷之蛋”、莫里斯蠕虫、温尼·施瓦陶以及网络版的珍珠港事件、斯塔克斯网上、沙丘行动、勒索软件、Equifax。


    歌曲结束于当时暗示的对 12 名干扰 2016 年总统大选的俄罗斯人的起诉。


    现在是提醒人们这片知识海洋有多么庞大的恰当时机。网络安全宇宙已变得如此不可思议。我在其中是多么微不足道。我不应该那么在意我那些转瞬即逝的工作问题。


    在这次投身新闻业之后，我本想回到网络安全领域，但我去 CNBC 找了一份工作。我不知道该期待什么。股市对我来说有点陌生。当我只想坐在某处的后办公室，和其他极客交流故事时，我为什么要去做这种事呢？


    我的手机震动了。我收到一条来自名为“布加勒斯兔子”的人的加密加密短信。目前来说这个答案足够了。


    我想还有几个故事要讲。


    [1]。 完整解释请参见附录 B。


    ## 附录 A


    ### 网络术语表


    根据美国国土安全部属机构国家网络安全职业与研究倡议组织（NICE）提供的内容为本书书改编。


    **对手（ADVERSARY）：** 实施或意图实施有害活动的的个人、团体、组织或政府。


    **物理隔离（AIR GAP）：** 物理上将一个系统与其他系统或网络分离或隔离（动词）。将一个系统与其他系统或网络进行物理分离或隔离（名词）。


    **警报（ALERT）：** 一种通知，表示检测到特定攻击或针对组织信息系统的攻击。


    **防病毒软件（ANTIVIRUS SOFTWARE）：** 监控计算机或网络的程序，用于检测或识别主要类型的恶意代码，并防止或遏制恶意软件事件，有时通过删除或中化恶意代码来实现。


    **资产（ASSET）：** 具有价值的人、结构、设施或材料。也可适用于数字信息、记录和资源，或抽象过程、关系和声誉。任何对某事成功有贡献的事，例如组织使命；资产是有价值的物品或可以赋予价值的属性。


    **攻击（ATTACK）：** 尝试获取系统服务、资源或信息的未经授权访问，或尝试破坏系统完整性的尝试。试图绕过信息系统的一个或多个安全服务或控制的故意行为。


    **身份验证（AUTHENTICATION）：** 验证实体（用户、进程或设备）身份或其他属性的过程。也是验证数据源源和完整性的过程。


    **黑名单（BLACKLIST）：** 被阻止或被拒绝权限或访问权限的实体列表。


    **机器人（BOT）：** 连接到互联网的计算机，其被恶意代码秘密地和/或秘密地入侵，以便在远程管理员的命令和控制下执行活动。受感染计算机的大集合（即僵尸网络）的成员。


    **僵尸网络（BOTNET）：** 被恶意代码感染并在跨网络控制的计算机集合。


    **漏洞（BUG）：** 信息系统或设备中意外之外且相对较小的缺陷、故障、缺陷或不完美。


    **云计算（CLOUD COMPUTING）：** 一种模型，允许按需访问共享的可配置计算能力或资源池（例如网络、服务器、存储、应用程序和服务），这些资源可以以极少的管理努力或与服务提供商的交互来快速置备和释放。


    **关键基础设施（CRITICAL INFRASTRUCTURE）：** 无论是物理还是虚拟的系统和资产，对于一个组织或国家至关重要，以至于其故障或破坏可能对安全、经济、公共健康或安全、环境或这些方面的任何结合产生破坏性影响。


    **密码学（CRYPTOGRAPHY）：** 使用数学技术提供安全服务，如机密性、数据完整性、实体认证和数据源认证。关于将明文转换为密文以及恢复加密密文的方法的方法和科学。


    **网络基础设施（CYBERINFRASTRUCTURE）：** 任何电子信息和通信系统及其包含的服务。由处理、存储和通信的硬件和软件组成的系统。


    **网络安全（CYBERSECURITY）：** 保护信息通信系统及其包含的信息免受损坏、未经授权的使用或修改的活动、过程、能力或状态。


    **网络行动（CYBEROPERATIONS）：** 网络安全工作，其中 `(1)` 执行收集证据的活动以获取 `(2)` 防御 `(3)` 支持其他情报活动。


    **网络空间（CYBERSPACE）：** 相互依赖的信息技术基础设施，包括互联网、电信网络、计算机系统以及嵌入式处理器和控制器。


    **数据泄露（DATA BREACH）：** 敏感信息的未经授权移动或披露给组织之外未授权拥有或查看信息的方。


    **数据完整性（DATA INTEGRITY）：** 数据是完整、完好且可信的，并且没有被未经授权或意外破坏的属性。


    **数据丢失（DATA LOSS）：** 无意或意外删除数据、忘记存储位置或数据暴露给未经授权方的结果。


    **数据丢失防护（DATA LOSS PREVENTION）：** 防止敏感数据离开安全边界的一系列程序和机制。


    **数据挖掘（DATA MINING）：** 用于分析现有数据集以发现以前未发现的模式或相关性的过程或技术。


    **解密（DECRYPTING）：** 将密文转换为明文的过程。将加密数据转换回其原始形式，以便可以理解。


    **拒绝服务（DOS）：** 一种阻止或损害授权使用信息系统资源或服务的攻击。


    **加密（ENCRYPTION）：** 将明文转换为密文的过程。将数据转换为未经授权人员难以理解的形式。


