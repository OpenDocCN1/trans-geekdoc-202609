- raw: "Sig paces nervously. He’s been spending the past hour alternately charming\
    \ René’s mother and the nurses, talking about how worried he was for René and\
    \ the baby. His baby. He seems thrilled, but René has grown wise in the past 24\
    \ hours.\n\n“I’m so exhausted,” Sig says.\n\nRené’s mother tries to hand him the\
    \ baby, but he demurs. Looks at his mobile phone. Picks at his cuticles.\n\nRené’s\
    \ mother pats him on the back, asks him if he’d like to go out for cookies. He\
    \ says yes. René is grateful her mother is there to help, and to keep Sig out\
    \ of her way.\n\n## **17.**\n\n## The Insider Threat\n\n**By April 2016, ransomware\
    \ has** become so prevalent that many of the criminal organizations that pioneered\
    \ it are breaking apart at the seams.\n\nBut Bo Chou couldn’t be happier. The\
    \ financial firm in Singapore offered him a contract. He was worried it wouldn’t\
    \ work out. But the boom in this new kind of criminal enterprise means his inbox\
    \ is overflowing with interesting work. Work he is very good at.\n\nBo is in the\
    \ midst of helping write a ransomware policy for his company and translating it\
