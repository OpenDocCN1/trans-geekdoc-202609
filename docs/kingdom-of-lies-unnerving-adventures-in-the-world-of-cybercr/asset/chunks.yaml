- raw: 'In addition, many government employees are champing at the bit to get the
    bank in trouble over other types of violations. It could get them a lot of street
    cred, a promotion, or, most important, a decent-paying job at one of the big consulting
    firms. Who knows, maybe some of them actually care about justice. So if the bank
    brings in a government agency every time there is a problem, the bank is going
    to get dinged by regulators, slammed by the media, and waste tons of time and
    money that could be better spent on actual security.


    Everything is complicated. Nothing is straightforward. What Charlie knows best
    and what he puts more of his faith in than anything else is human intelligence.


    The bank, the entire cybersecurity team—fuck, the entire cybersecurity profession—is
    relying too heavily on analyzing data. “Big data.” Vast swaths of information
    streaming into little bank server bottlenecks, parsed by “artificial intelligence”
    engines, and interpreted into a spreadsheet or PowerPoint by kids two years out
    of college.


    In Charlie’s experience, this shit is useful for day-to-day problem-solving but
    meaningless in the long run. It “solves” nothing.


    What *does* make a difference is the one guy or gal on the ground, in the trenches,
    doing the crimes or solving the crimes or watching the crimes who can illuminate
    the real problems and how they might be solved. Who are we dealing with? What
    motivates them? Everything else is just semantics. Charlie should know. He’s the
    lawyer.


    That’s what he loves about Caroline. She knows the value of the human element.
    That’s why she hired so many former spies.


    The disclosure will go like this:


    *On August 5, 2014, we discovered a group of criminals had broken into our servers
    and stolen the personal details, including names, Social Security numbers, addresses
    and phone numbers of 87 million NOW Bank clients. We are working with law enforcement
    to investigate this matter and, as a result, cannot fully disclose some details
    of the investigation*.


    There is more to come. But this is good. Nice, straight, and to the point. Filled
    with crisp, safe known knowns.


    Who was he kidding? People were going to freak out.


    **By Valentine’s Day 2015 everyone** in cybersecurity at NOW Bank is looking for
    a new job. If they haven’t jumped already. Bonuses get paid out in a few weeks.
    After that, the real exodus will begin.


    They were all promised sky-high salaries and big bonuses while they went slogging
    through the pain of Venice. Neither of which came to pass. Many people involved
    are of the opinion that this is due to Raykoff having pissed off so many people
    that they are putting the squeeze on him in order to further justify moving him
    out. Many of them, novices to the inner workings of the bank, have forgotten they
    work in a cost center. And once you find yourself in a cost center, you’re always
    in a cost center.


    Raykoff is busy today. He’s meeting some important people. Some of the administrative
    workers in the SOC are surprised by a knock on the door. It’s a man and a woman,
    both with earpieces, and another man behind them. They seem important.


    “We’re . . . looking for Bill Raykoff?” asks the one man without an earpiece.


    The secretary answers. “Yes, he’s upstairs. But I can let you in now.”


    The man is Admiral Michael Rogers, and the people with him are Secret Service
    agents. He’s in civvies. Rogers is the head of the National Security Agency and
    Cyber Command, a centralized operations point for all branches of the Armed Forces
    and other agencies of the Department of Defense. He is there to see the SOC. He
    seems puzzled.


    The secretary swipes him into the secure room. The door swings open. The SOC workers
    look up, slightly curious, then back down at their computers. Only one of them,
    a Navy vet, snaps to attention and salutes. Nobody else knows who Michael Rogers
    is.


    Frances is now five months pregnant. She walks into the room and waves at Admiral
    Rogers and his entourage. “Howdy!” she says as she takes a seat.


    Just a few moments before the admiral’s arrival, she received an offer from a
    consulting firm that will more than double her salary—despite her being five months
    pregnant. She doesn’t know who Admiral Rogers is and right now she couldn’t care
    less. Between her house burning down and the breach, it’s been a rough year.


    But getting big offers and aggressive recruiter calls is happening to many of
    NOW Bank’s security employees. Their phones have been ringing off the hook from
    recruiters.


    There is now a premium price for the bank’s cybersecurity employees. It’s a seller’s
    market for their skills. That’s because they worked through Venice and thus have
    experience working on a complex, public breach, one of the biggest ever. Nobody
    hiring at other companies blames them for the breach. The top executives take
    the fall while the cybersecurity pros run.


    Caroline will go to an insurance company, one populated by many of her best dragons
    who have already flown away. Charlie will stay, not for a lack of offers but because
    he keeps seeing daylight at NOW Bank as others peel off and everyone realizes
    he’s one of a kind.


    Prem will rise to the top. He’s already replaced Raykoff and is sitting in his
    office. A new group will come in under him, and the ties that bind the old guard
    will wither away.


    Raykoff is getting settled into his new role with a government relations theme.
    Things must be looking up because several employees visiting his new office have
    noted an industrial-size bottle of Viagra on his desk.


    **There are new criminals,** too. Charlie is busy drafting an internal policy
    on how the bank and its executives will respond to ransomware and its rarer cousin
    cyber-extortion.


    It’s only a draft, though. Ransomers are targeting very discreetly now. He knows
    that will change once other criminal groups recognize the upside potential in
    the simple, cost-efficient attack. It’s a new vector; he likes that. The concept,
    though, of compromising, extorting, and bolting is as old as spies.


    He *loves* that.


    ## **11.**


    ## The Lovers


    **Sig smiles. He has regained** control of the situation so he is smiling a *lot*
    these days.


    René is at home, his home, the home he bought for them to live in together after
    a whirlwind romance. She doesn’t come into the office anymore. It’s better that
    way.


    After her wild, overnight success, the guys at TechSolu started looking up to
    René in a way that threatened Sig’s oversight of the enterprise. To combat this,
    he fell in love with her and ensured she did with him. Before she knew it, all
    her dreams for an exciting, high-profile, interesting life had been fulfilled.
    She was so star struck. Lovely, too. It was easy, and now she is still working
    for TechSolu but out of the picture. A perfect solution.


    He has three business propositions he’s considering. The first, something that
    will later be known as the post-Soviet bank heist, is just a fledgling scam right
    now. He has to go to Bucharest for the day to learn more about it. He doesn’t
    like traveling these days. He’s already put spyware on René’s computer, though,
    and GPS on her phone, so he’ll know what she’s up to or if she leaves.


    **It is hard for** René to believe that just six months ago, she was dancing in
    a club, celebrating her life as a newly minted millionaire. The phone contacts
    all over the world, the danger, the deception, demanding extortions from billion-dollar
    companies, it had been so sexy. That lasted about a week. But now she doesn’t
    go to the club anymore. She doesn’t even go to work. She got off social media
    entirely. Left her house and all of her friends. Her mother, who seemed to barely
    notice, has called her once.


    Only six months, and now René works from home or, rather, an old farmhouse Sig
    bought for her and intends to renovate. It’s big and airy and spacious, but she
    spends most of her time in it alone, in the smallest room in the house. She’s
    even afraid to step outside some days.'
