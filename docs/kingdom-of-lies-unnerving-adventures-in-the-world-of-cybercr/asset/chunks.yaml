  trans: '


    1901 年，美国国会成立了国家标准局（`NBS`），它后来演变为美国国家标准与技术研究院（NIST），该机构创建了美国主要的网络安全框架。在 20 世纪
    30 年代和 40 年代，NBS 启动了“数学表格项目”，这是罗斯福政府“公共事业工程管理局”的一个部门，该项目为当今的互联网奠定了部分基础数学基础。


    `John Curtiss`——“计算盐矿”的先驱——构思了一些与现代计算相关的最早计算算法。Curtiss 协助创立了应用数学实验室，该实验室后来成为美国能源部科学办公室下属的美国应用数学部门。它最终开发了美国最早的一批软件和硬件。


    这种计算能力的首次应用之一是 1951 年的新美国人口普查，该次普依赖于一个名为 `UNIVAC` 的早期计算机数据库，它被认为是世界上第一台商用计算机。


    ### LANCZOS、KRYLOV、HESTENES 和 STIEFEL


    匈牙利人科尼利亚斯·`Lanczos` 在 20 世纪 50 年代和 60 年代开发了算法计算的几种新用途，以及让我们能够自由缩放数字图像和视频的数学技术。


    Lanczos 的方法之一被称为 `Krylov`，是他在 20 世纪 50 年代与 Magnus `Hestenes` 和 Eduard `Stiefel`
    合作的成果。Krylov 算法被誉为“世纪算法”，因为它在计算机筛选信息的规模上，导致了其背后的基础性元素。


    ### SEAC、UNIVAC、FBI 与指纹


    `SEAC`，即标准东部自动计算机，是最早可以远程访问的计算机之一，于 1964 年为政府用途而创建。


    大约在此期间，`FBI` 开始使用早期计算技术将其指纹数据库数字化。


    ### BROOKS ACT、MAGIC FACTS、CHURCHILL EISENHART


    1964 年，《布克斯法案》（`Brooks Act`）建立了自动数据处理标准，联邦政府发布了第一个 `MAGIC` 终端，这是最早使用图形显示信息的计算机之一。`Churchill
    Eisenhart` 是一位数学家、美国统计工程实验室负责人，他主张联邦政府倾向于“可靠的数学分析[而非]昂贵的实验”。


    ### FIPS 1、CST、MIT 的模型铁路俱乐部


    第一版联邦信息处理标准（或 `FIPS`）于 1968 年发布，随后在 20 世纪 70 年代发布了关于加密和数据安全的若干标准，这些标准支撑了整个 21
    世纪的网络安全领域。


    `CST` 可能指的是计算机科学与技术实验室。它在 1978 年的早期出版物之一是《计算机技术在选票统计中的有效利用》，该文献关注计算机计票选票的准确性和安全控制。


    马萨诸塞理工学院（`MIT`）的技术模型铁路俱乐部成立于 1946 年，它在 20 世纪 70 年代和 80 年代初成为早期黑客（hacker）活动的温床，这是由于真实的铁路爱好者对使火车运行的“信号和功率”电路感兴趣。该小组早在
    20 世纪 40 年代就使用了目前形式的“黑客”（hacker）一词。


    ### 选票计数、术语表、LINUX 内核


    电子投票在美国有很久的历史，可以追溯到 20 世纪 60 年代。到 20 世纪 80 年代，几个州由于担心传统的打孔系统，开始倾向于使用电子阅读器来统计选票。


    `jargon file` 是 20 世纪 70 年代中期在斯坦福大学开发的非正式术语记录。第一个 `Linux kernel`（版本 `0.01`）这一开源计算机代码于
    1991 年发布。


    ### BILL JOY、LARRY WALL、LINUS、GUIDO ROSSUM


    `Bill Joy` 是 Sun 公司的联合创始人。在同一时期，`Larry Wall` 开发了 Perl 语言，`Guido Rossum` 开发了目前最流行的语言之一
    Python。


    ### CAPTAIN CRUNCH、MA BELL、TWENTY-SIX HUNDRED


    John Draper 又名 `Captain Crunch`，是早期电话黑客（phreaks），他们自称为电话黑客，是因为他们利用电话入侵 `Ma Bell`
    等组织。`2600` 杂志成立于 1984 年，面向电话黑客，详细介绍了如何进行各种活动。


    ## 来源


    《谎言王国》（Kingdom of Lies）中的观察和结论基于未分类信息；个人访谈。


