    乔治亚州联邦检察官办公室 (2017 年 5 月 19 日)：“被定罪的俄罗斯刑事 Seleznev 在亚特兰面临指控”。`www.justice.gov/usao-ndga/pr/convicted-russian-criminal-seleznev-faces-charges-atlanta`.


