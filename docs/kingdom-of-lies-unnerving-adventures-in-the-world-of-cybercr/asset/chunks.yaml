    ## Author’s Note


    Thank you for taking the time to read this book.


    I didn’t set out to write a book, certainly not after I joined the cybersecurity
    field. I wanted to leave my brief, youthful background as a journalist behind
    and do something real. And I did.


    As I wrote in the beginning, that’s when I noticed the holes in the narrative
    we have grown to accept about security and insecurity of technology, and the real
    people who were working in or even leading various factions within it.


    ### **WHAT JUST HAPPENED?**


    After going to work for *The Wall Street Journal*, I was mostly prohibited from
    using anonymous sources, which is a good thing and strengthens news coverage.
    But it also meant that the majority of people I talked to would never see their
    names—or pseudonyms—in print.


    This book gave me the flexibility to tell controversial stories, or see events
    through the eyes of people who lived them. I acknowledge that these people might
    not always have told the truth. My father, a Navy vet, once said that sailors
    had a tendency to tell tall tales, and here we are looking through the lens of
    sailors on a rough, digital sea.


    You may also note that I’ve fictionalized some locations—such as Arnica Valka,
    Romania, which does not exist—but kept other real locations. In some cases, creating
    fictional locations or companies was the only way to adequately convey the story
    while ensuring that I was protecting the identity of sources and other innocent
    parties.


    ### **WHY DOES IT MATTER?**


    I’m completing this book after yet another contentious election—the US 2018 midterms.
    There will be more. Some predicted this election would be “the World Cup of cyber
    influence.” Another lie, of course. Our elections boards did a fine job of mucking
    up local elections without needing any interference from Russian elites. Just
    another in a long line of dire predictions that we have somehow turned a corner
    into a heretofore unimagined apocalypse.


    The idea we are somehow in a strange and very different time is dangerous for
    three reasons. One, it negates history and historians unfairly, as if all knowledge
    we’ve acquired up until this moment is meaningless in the face of this new threat.
    Two, it gives governments, corporations, and institutions an out that they don’t
    deserve—specifically, the excuse that things have become so incomprehensible and
    troubling that they can’t possibly be expected to fight against them. And three,
    it makes people feel helpless, as if they can have no part in understanding security
    or threats, working on it or having opinions on it, because it’s all so new and
    frightening that trying to grasp it won’t matter.


    If I could support any outcome of reading this book, it is that people feel more
    empowered to make decisions in their lives that support their own best idea of
    personal privacy. And that they feel empowered to hold governments, media, and
    institutions accountable for doing their jobs and providing them with timely,
    accurate, and actionable information.


    Above all, I hope people can start to see that what is happening is more like
    decades of erosion and less like having the ground disappear from underneath our
    feet. And that there are ways to stop erosion.


    ## Acknowledgments


    First and foremost, I’d like to thank Elisabeth Dyssegaard from St. Martin’s Press
    and Peter McGuigan from Foundry Literary Media—and all of their staff—for taking
    a chance on this first-time author. To the people who made endorsements for this
    book, it’s meant so much to me—thank you.


    For their support in trying to turn me into a proper journalist: Matt Rossoff,
    Jeff McCracken, Mike Calia, Mary Duffy, Elisabeth Cordova, Lauren Hirsch, and
    Steve Kovach from CNBC; Ben DiPietro, Nick Elliott, Rob Sloan, Will Wilkinson,
    and Kim Nash from *The Wall Street Journal*; and Ken Clark, Allan Ripp, John Garger,
    and Paul Comstock.


    I’d like to thank several people who were incredibly supportive during my time
    working on this book, earlier in my career, and through some trying experiences—without
    whom it wouldn’t have been possible: Judith Pinto, Jennifer Flores, Jamal Raghei,
    and Britt-Louise Gilder; Seth Kaufman, Elena Tisnovsky, Victoria and Justin Meyer,
    Amy Edelstein, Frederic Lemieux, Susanne Gutermuth, Ida Piasevoli, Ang Johnson,
    Steven Greene, Pete Cavicchia, Anish Bhimani, Michael Spadea, Marc Loewenthal,
    Mike Joseph, and Earl Crane.


    There are many people who served as anonymous sources for this book who I can’t
    name here, but I would like to acknowledge: thank you for taking a risk and telling
    me your stories.


    To Mrs. Belcastro, Miss Kristy, and all the staff and teachers at PS 002 in Queens
    and New Milestone Preschool for their incredible work with my kids. To the staff
