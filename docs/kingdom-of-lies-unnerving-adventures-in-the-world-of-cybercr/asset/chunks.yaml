- raw: 'At the same time, far away in Washington, D.C., Admiral Michael Rogers, the
    head of the National Security Agency (NSA) and the Central Intelligence Agency,
    addresses Congress about cyberthreats, contrasting them with nuclear weapons.
    “That’s very different from the cyber dynamic,” he says. “Where we’re not only
    going to be dealing with nation-states, but we’re going to be dealing with groups,
    with individuals, when we’re dealing with a capability that is relatively inexpensive
    and so easy to acquire, very unlike the nuclear kind of model. That makes this
    really problematic.”


    René has never met an American. She doesn’t know about the NSA, nor what an admiral
    is.


    *But here’s my number*.


    In Romania, René enters the circle of girlfriends and starts a silly dance. She
    pretends her drink glass is a microphone and sings along even louder.


    Also at the same time, not so far away, in Germany, Sigmar “Sig” Himelman, an
    influential 30-something cybercriminal, acknowledges that he’s burned too many
    bridges, including with the local police, and is going to need to make a move.
    He has already disposed of several computers and hard drives. He’s not answering
    his phones, and soon those will be destroyed, too. He’s packing his bag and going
    somewhere else, somewhere safer for hackers who like to innovate: Romania.


    René has never met someone from Germany. She’s been a bit sheltered. The junior-league
    clubbing is about as bad-assed as it gets for her. For now.


    But in not too long, she’ll be a more influential cybercriminal than Sig, a competitor
    of Bo’s, and one of Rogers’ new big problems.


    *So call me maybe*.


    **Also at the same time**, Carl Ramirez stands in a room inside a NOW Bank building
    in Midtown Manhattan that for reasons he has never been able to ascertain is shaped
    like a plus sign.


    He faces a receptionist’s desk, long abandoned, covered in a layer of dust. Behind
    the desk, a wall of glass showcases a vivid seven-story drop to a lower atrium
    where bankers sit, drinking coffee and eating power breakfasts. Unbeknownst to
    the bankers down below and many of the bank executives above, the financial sector
    is about to be attacked by terrorists.


    Carl, an unimposing, flat-footed bank executive with an engineering degree from
    Carnegie Mellon and a Gomer Pyle laugh, has come to the rescue. He is here to
    save the world.


    There is nobody here to greet him. Behind him and to the right and left are three
    locked doors. His cell phone doesn’t work. Even though this floor is filled with
    employees, the lobby is dead silent.


    Carl thinks the scene is like something out of an apocalypse movie, right before
    the zombies appear. Carl tries the doors again. No luck. Still locked.


    He picks up the phone on the receptionist’s desk. The handset has been disconnected.
    In fact, it’s been stripped of wires. Four paper clips sit lined up in a row next
    to two empty three-ring binders, each with a gold-leaf Fleur Stansbury insignia.


    It’s 2012 and the world is not ending, but four years earlier, someone emptied
    this desk out in a hurry when Fleur Stansbury dissolved overnight. Fleur Stansbury
    moved out and NOW Bank moved in. NOW Bank, Carl knows, is one of the biggest banks
    in the world, by trade volume, by number of branches, by number of customers,
    and by number of global offices. Pretty much by any standard that you can measure,
    NOW Bank is absolutely massive. Trillions of dollars flow through the bank’s extensive
    computer systems every single day.


    Nobody has bothered to clean up the desk or hire a new receptionist because this
    floor is for technologists, not bankers. No big-shot investors were going to be
    received in this office. No swinging dicks of Wall Street here. Not anymore.


    Carl grabs one of the binders. Tucks it under his arm. He needs someplace to store
    his security reports from today’s event. A dusty relic of Wall Street seems appropriate.
    Above him, a fluorescent light flickers. There are dead flies inside it.


    Carl holds a binder with a PowerPoint briefing about the matter at hand: A terrorist
    attack called Operation Ababil is about to be executed. It is a well-planned cyberattack,
    and will likely be well-executed by a shockingly well-resourced group calling
    itself the Izz ad-Din al-Qassam Cyber Fighters.


    A little history: NOW Bank’s cybersecurity team encountered this collective for
    the first time four months ago, when the group attacked the bank. The group claimed
    their attack was a response to U.S. policies in Syria and other problems specific
    to Shiite Muslims. That’s when the Izz ad-Din collective took down NOW Bank’s
    main website.


    When this happened, the entire corporate side of the bank, including its executives,
    its board of directors, and its customers, all looked to the NOW Bank cybersecurity
    team to find out what the fuck had happened. And what the executives found staring
    back at them were a bunch of nerds with zero charisma and even less *presence*
    wearing bad, off-the-rack suits without ties. Some of them even wore athletic
    shoes, not just on their way to work but all day long. They spoke in inside jokes
    and used weird technical references and spooky-sounding security terms. They were
    not reassuring.


    So for four months, Carl’s cybersecurity team went through a sort of front-office
    boot camp. They learned what a tailor does. They crammed on how to use PowerPoint.
    They practiced spinning the Izz ad-Din incident to get a bigger budget, which
    they needed, because all of them were making a lot less than their friends at
    tech companies and not much more than their friends in government. With that kind
    of compensation, Carl’s boss, Joe, understood, it was getting harder and harder
    to hire good people.


    So here they are, still trying to explain an extraordinarily complex set of circumstances
    and protocols to a cadre of executives who enjoy a white-glove technology experience
    in their day-to-day existence. These are people who rarely bother with technicalities,
    and when they do, they view them as an inconvenience.


    Hackers are a notoriously crude lot, and Carl should know because he’s one of
    the best. He enjoys the elegance of the operation’s timeline because it gives
    him a schedule during which to size up his worthy opponent. Not only does whoever
    put this together know what they’re doing. They have *style*.


    This is where the battle between NOW Bank and the Izz ad-Din will be fought.


    Game on.


    ## Preface


    Kingdom of Lies


    **It didn’t take me long** in my career as a cybersecurity executive to figure
    out everyone was lying to me.


    The biggest lie of all came at the very beginning: that cybersecurity is hard.
    Too hard. Certainly too difficult for someone who lacks years and years of deep
    technical training. That it is no place for writers.


    That thicket of incomprehensible jargon alone seemed meant to discourage outsiders
    like me from entering the field. They told me I could never hope to understand
    the terminology unless I’d worked around it for a very long time. Unless I had
    a special and complicated certification. Unless I knew how to take apart and reassemble
    a computer. Unless I knew how to code in Python and could read it, interpret it,
    and spot problems on sight.


    And if I somehow managed to learn the lingo, the learning curve for the rest of
    it would prove insurmountable.


    Lies, lies, lies.


    It’s unfortunate, because there is a huge gap between the demand for cybersecurity
    workers and the people available to fill those jobs. I think one of the reasons
    for that is because people can’t imagine themselves doing this kind of work.'
