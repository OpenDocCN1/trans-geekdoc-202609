    the markets. But the new insiders are hackers who plunder corporate networks,
    and they are making hundreds of millions. These guys get all the benefits of insider
    trading without having to ever rub shoulders with bankers, lawyers, or government
    officials.


    Luckiest fucks in the world, Charlie says, just to make Caroline laugh.


    **It’s now October 2014.** Six years earlier, `Bolin “Bo” Chou`, a bisexual Shanghai
    expat from a village near the Nepalese border, learned how to create fake credit
    cards from a younger, less cynical `Valery Romanov`. This was in the spare time
    he had away from his job at `PLA 61398`.


    `Bo` doesn’t like talking about his government work. Not because it is supposed
    to be secretive. It is. But that’s not the reason. It’s boring. A boring story.
    Strapping in, executing code all day, reworking old code.


    The Chinese use rudimentary toolkits to break the meager defenses at most `U.S.
    companies` and steal swaths of data, most of it useless. Business plans, names
    of partners, dates, images, corporate charters, movies, embarrassing and incriminating
    information like names of mistresses and favorite kinks. They are especially interested
    in visiting businessmen.

    '
  trans: '

    但银行内部至少还有另外件事正在酝酿。第一件涉及银行的一些律师事务所。多年来，中国籍人士一直在窃取交易的专有数据以进行内幕交易。情况正变得越来越糟糕。他们开始将这些信息分享给其他国家的特工，多达数百人。内幕交易随处可见。司法部正在调查。证券交易委员会也在调查。但这些律所对此一无所知。随后，`SEC`
    也被这群人入侵了。这种循环一直在持续。


    中国人在那里大肆横行抢夺，而且他们掌握了一些非常棘手的手段。他们把黑客攻击视作一份全职工作，一份舒适的军旅生涯，一份带有在职培训的朝九晚五。想象一下，如果破解保险变成了制度化，那些破解者在退休后会做什么？去钓鱼吗？当他们在地下世界做同样的事情可以赚更多钱时，他们不会。


    `SOC` 的员工现在通过他们收到的一些公开情报报告得知，许多攻击源于上海一栋被称为`人民解放军第 61398 部队`的灰色水泥建筑。那是一个烟尘满满的地方，`中国解放军网络部队`的员工至少从
    2000 年代初就开始入侵`美国公司`以获取其知识产权。在纽约的`SOC`，安全分析师在整个中国工作日内记录来自该设施的电子脉冲。只有在中国的节假日，他们才能获得喘息。


    中国人使用原始的工具包攻破大多数`美国公司`薄弱的防御，并窃取大量数据，其中大部分是无用的。商业计划、合作伙伴姓名、日期、图像、公司章程、电影，以及令人脸脸且具有犯罪指控的信息，如情人的名字和喜好的性癖。他们对出访的商人特别感兴趣。


    两个同时进行的中国计划涉及来自 `NOW Bank` 及其某些竞争对手的信息，这些数据被各自的律师事务所处理得极其糟糕。这两个计划都涉及首次公开募股（IPO）。这两家律师事务所处理与合并、收购和融资相关的数据。他们的一些部门还负责处理制药公司的`食品药品监督管理局`审批和贷款。`NOW
    Bank` 为这些交易提供融资支持，因此信息存储在他们那里，但他们的律师事务所也有访问权限。


    获知某场未预先的合并即将发生，或药物试验取得成功，是获取关键信息以执行内幕交易极佳方法。“内幕交易”一词曾是指公司内部人员、公司领导、爱管事的银行家和`华尔街记者`利用他们获取的权限来剥削市场。但新的内幕人士是掠夺公司网络的黑客，他们正赚着数亿资金。这些人获得了内幕交易的所有利益，而根本不需要与银行家、律师或政府官员打交道。


    Charlie 说，他们是世界上最幸运的混蛋，这只是为了让 Caroline 笑笑。


    **现在是 2014 年 10 月。** 六年前，`Bolin “Bo” Chou`——一个来自尼泊尔边境村庄的、双性恋的上海外籍人士——从一个更年轻、不那么世俗的
    `Valery Romanov` 那里学会了如何制作伪信用卡。这是他在`PLA 61398` 工作之余学习学会的。


    `Bo` 不喜欢谈论他的政府工作。不是因为这些工作本该保密的。事实确实如此。但这不是原因。它太无聊了。一个无聊的故事。整天系好安全带，执行代码，重写旧代码。


    中国人使用原始的工具包攻破大多数`美国公司`薄弱的防御，并窃取大量数据，其中大部分是无用的。商业计划、合作伙伴姓名、日期、图像、公司章程、电影，以及令人脸脸且具有犯罪指控的信息，如情人的名字和喜好的性癖。他们对出访的商人特别感兴趣。

    '
