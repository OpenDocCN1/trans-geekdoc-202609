- raw: '*Vote Counts, Jargon File, Linux Kernel One,*


    *Bill Joy, Larry Wall, Linus, Guido van Rossum*


    *Captain Crunch, Ma Bell, Twenty-Six Hundred*^([1](#epilogue.html#epifn1))


    *We didn’t start the fire*


    *It was always burning, since the world’s been turning*


    It goes on like this for several verses. Anthony wends his way through the history
    of Captain Crunch, the Cuckoo’s Egg, the Morris worm, Winn Schwartau and the cyber
    Pearl Harbor, Stuxnet, Shamoon, ransomware, Equifax.


    The song ends at the then-hinted-at indictment of 12 Russians for disrupting the
    2016 presidential election.


    This is an apt time for a reminder of how big this sea of knowledge is. How incredibly
    vast the universe of cybersecurity has become. How insignificant I am within it.
    How little I should care about my transient work problems.


    After this foray into journalism, I had wanted to go back to a career in cybersecurity,
    but I took a job at CNBC instead. I don’t know what to expect. The stock market
    is a little foreign to me. Why would I do such a thing when all I want to do is
    sit in a back office somewhere and trade stories with other nerds?


    My cell buzzes. I have an incoming, encrypted text from somebody called “the Bucharest
    bunny.” That’s enough of an answer for now.


    I suppose there are a few more stories to tell.


    [1](#epilogue.html#repifn1). See Appendix B for a full interpretation.


    ## Appendix A


    Glossary of Cyberterms


    Adapted for this book from the National Initiative for Cybersecurity Careers and
    Studies, a division of the Department of Homeland Security.


    **ADVERSARY:** An individual, group, organization, or government that conducts,
    or has the intent to conduct, detrimental activities.


    **AIR GAP:** To physically separate or isolate a system from other systems or
    networks (verb). The physical separation or isolation of a system from other systems
    or networks (noun).


    **ALERT:** A notification that a specific attack has been detected or directed
    at an organization’s information systems.


    **ANTIVIRUS SOFTWARE:** A program that monitors a computer or network to detect
    or identify major types of malicious code and to prevent or contain malware incidents,
    sometimes by removing or neutralizing the malicious code.


    **ASSET:** A person, structure, facility, or material that has value. Can also
    apply to digital information, records, and resources, or abstract processes, relationships,
    and reputations. Anything that contributes to the success of something, such as
    an organizational mission; assets are things of value or properties to which value
    can be assigned.


    **ATTACK:** An attempt to gain unauthorized access to system services, resources,
    or information, or an attempt to compromise system integrity. The intentional
    act of attempting to bypass one or more security services or controls of an information
    system.


    **AUTHENTICATION:** The process of verifying the identity or other attributes
    of an entity (user, process, or device).


    Also the process of verifying the source and integrity of data.


    **BLACKLIST:** A list of entities that are blocked or denied privileges or access.


    **BOT:** A computer connected to the internet that has been surreptitiously and/or
    secretly compromised with malicious code to perform activities under the command
    and control of a remote administrator. A member of a larger collection of compromised
    computers known as a botnet.


    **BOTNET:** A collection of computers compromised by malicious code and controlled
    across a network.


    **BUG:** An unexpected and relatively small deffect, fault, flaw, or imperfection
    in an information system or device.


    **CLOUD COMPUTING:** A model for enabling on-demand network access to a shared
    pool of configurable computing capabilities or resources (e.g., networks, servers,
    storage, applications, and services) that can be rapidly provisioned and released
    with minimal management effort or service provider interaction.


    **CRITICAL INFRASTRUCTURE:** The systems and assets, whether physical or virtual,
    so vital to an organization or nation-state that the incapacity or destruction
    of such may have a debilitating impact on the security, economy, public health
    or safety, environment, or any combination of these matters.


    **CRYPTOGRAPHY:** The use of mathematical techniques to provide security services,
    such as confidentiality, data integrity, entity authentication, and data origin
    authentication. The art and science concerning the principles, means, and methods
    for converting plaintext into ciphertext and for restoring encrypted ciphertext
    to plaintext.


    **CYBERINFRASTRUCTURE:** Any electronic information and communications system
    and its services, and the information contained therein. The information and communications
    systems and services composed of all hardware and software that process, store,
    and communicate information, or any combination of these elements.


    **CYBEROPERATIONS:** Cybersecurity work in which a person (1) performs activities
    to gather evidence about criminal or foreign intelligence entities in order to
    mitigate possible or real-time threats, (2) protects against espionage or insider
    threats, foreign sabotage, international terrorist activities, and/or (3) supports
    other intelligence activities.


    **CYBERSECURITY:** The activity, process, ability, capability, or state whereby
    information and communications systems, and the information contained therein,
    are protected from and/or defended against damage, unauthorized use or modification,
    or exploitation. Also pertains to the strategy, policy, and standards regarding
    the security of and operations in cyberspace, and encompasses the full range of
    threat reduction, vulnerability reduction, deterrence, international engagement,
    incident response, resiliency, and recovery policies and activities, including
    computer network operations, information assurance, law enforcement, diplomacy,
    military, and intelligence missions as they relate to the security and stability
    of the global information and communications infrastructure.


    **CYBERSPACE:** The interdependent network of information technology infrastructures
    that includes the internet, telecommunications networks, computer systems, and
    embedded processors and controllers.


    **DATA BREACH:** The unauthorized movement or disclosure of sensitive information
    to a party, usually outside the organization, that is not authorized to have or
    see the information. Related terms: data loss, exfiltration


    **DATA INTEGRITY:** The property that data is complete, intact, and trusted and
    has not been modified or destroyed in an unauthorized or accidental manner.


    **DATA LOSS:** The result of unintentionally or accidentally deleting data, forgetting
    where it is stored, or it being exposed to an unauthorized party.


    **DATA LOSS PREVENTION:** A set of procedures and mechanisms to stop sensitive
    data from leaving a security boundary.


    **DATA MINING:** The process or techniques used to analyze large sets of existing
    information to discover previously unrevealed patterns or correlations.


    **DECRYPTING:** The process of transforming ciphertext into its original plaintext.
    The process of converting encrypted data back into its original form, so it can
    be understood. Synonyms: decoding, deciphering


    **DENIAL OF SERVICE (DOS):** An attack that prevents or impairs the authorized
    use of information system resources or services.


    **DIGITAL FORENSICS:** The processes and specialized techniques for gathering,
    retaining, and analyzing system-related data (digital evidence) for investigative
    purposes. Synonyms: computer forensics, forensics


    **DISTRIBUTED DENIAL OF SERVICE (DDOS):** A denial of service technique that uses
    numerous systems to perform the attack simultaneously.


    **ENCRYPTION:** The process of transforming plaintext into ciphertext. Converting
    data into a form that cannot be easily understood by unauthorized people.'
  fmt: '

    Vote Counts, Jargon File, Linux Kernel One,


    Bill Joy, Larry Wall, Linus, Guido van Rossum


    Captain Crunch, Ma Bell, Twenty-Six Hundred


    We didn’t start the fire


    It was always burning, since the world’s been turning


    It goes on like this for several verses. Anthony wends his way through the history
    of Captain Crunch, the Cuckoo’s Egg, the Morris worm, Winn Schwartau and the cyber
    Pearl Harbor, Stuxnet, Shamoon, ransomware, Equifax.


    The song ends at the then-hinted-at indictment of 12 Russians for disrupting the
    2016 presidential election.


    This is an apt time for a reminder of how big this sea of knowledge is. How incredibly
    vast the universe of cybersecurity has become. How insignificant I am within it.
    How little I should care about my transient work problems.


    After this foray into journalism, I had wanted to go back to a career in cybersecurity,
    but I took a job at CNBC instead. I don’t know what to expect. The stock market
    is a little foreign to me. Why would I do such a thing when all I want to do is
    sit in a back office somewhere and trade stories with other nerds?


    My cell buzzes. I have an incoming, encrypted text from somebody called “the Bucharest
    bunny.” That’s enough of an answer for now.


    I suppose there are a few more stories to tell.


    [1]. See Appendix B for a full interpretation.


