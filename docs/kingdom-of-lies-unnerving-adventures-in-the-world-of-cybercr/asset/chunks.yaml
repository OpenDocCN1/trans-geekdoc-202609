    ## 作者自序


    感谢你花时间阅读这本书。


    我原本并没有打算写一本书，尤其是在我加入网络安全领域之后。我本想抛弃我短暂、年轻的记者背景，去做一些真正的事情。而我确实做到了。


    正如我在开头提到的，那时我注意到，我们习以为常的关于技术安全性和与不安全性的叙述存在漏洞，以及那些在其中不同派系中工作甚至领导这些派系的真实人物。


    ### 发生了什么？


    在去《华尔街日报》工作后，我主要被禁止使用匿名消息源，这是一件好事，也加强了新闻报道性。但这意味着我接触的大多数人永远不会在印刷物上看到他们的名字（或笔名）。


    这本书给了我灵活性去讲述争议性故事，或者从经历过事件的人的视角来看待。我承认，这些人可能并不总是说实话。我的父亲是一名海军退伍军人，曾说过水手倾向于吹嘘大牛，而我们现在正通过水手的透镜观察这片波涛诡诡的数字海洋。


    你可能还会注意到我对某些地点进行了虚构处理——例如罗马尼亚的阿尔尼卡·瓦尔卡（Arnica Valka），那里并不存在——但我保留了其他真实地点。在某些情况下，虚构地点或公司是在能够充分传达故事的同时，确保保护来源和其他无辜方的身份的唯一方法。


    ### 这为什么很重要？


    我在又一次充满争议的选举之后完成了这本书——美国 2018 年年中期。未来还更多。有人预测这次选举是“网络影响力的世界杯”。当然，那是另一个谎言。我们的选举委员会很好地搞砸了地方选举，而完全不需要俄罗斯精英的任何干预。这只是长系列糟糕预测中的又一个，我们不知如何转入了一个此前无法想象的末日。


    我们正处于一个奇怪且完全不同的时代的想法是危险的，原因有三个：第一，它否定了历史和……第二，它给了……政府……以及第三，它让人们感到……


    ## 致谢


    首先，我想感谢……圣马丁出版社（St. Martin’s Press）……以及《华尔街日报》。


    有许多人担任这本书的匿名消息源，我无法在这里点出他们的名字，但我想表达：感谢你们承担风险并告诉我这些故事。


    致给……皇后区的 PS 002 和新里程碑幼儿园（New Milestone Preschool）……


    当然，感谢妈妈、爸爸和姐姐 Ann 持久的支持。


