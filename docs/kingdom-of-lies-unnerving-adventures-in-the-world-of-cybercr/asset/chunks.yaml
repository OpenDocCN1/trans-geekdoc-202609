  trans: "\n\n布伦丹回到了他之前的任务。在暗网上寻找可能对 ISIS 有用的身份信息。\n\n他再次发布了帖子，这次是在一个与其他恐怖分子交流的聊天板上。他在别处购买信用卡。他使用一个经过稍微修改并加载到各种流行色情网站的\
    \ `rootkit`（根内核程序）来换取这些信用卡。任何访问这些网站的人，其电脑都会被下载恶意软件，即一个用于实施 `DDoS` 等轻级网络攻击的僵尸网络。他不在乎。这些人活该得如此。毁掉他们的电脑是他的权利，因为他是纯洁的。\n\
    \n这些事情是坏的，会腐蚀人心。这就是他设计这些它们的原因。`Rootkits` 是重要的工具，由软件制成，但与 ISIS 在叙利亚创造一个新更好文明的使用的铲子和铁锹无异。他将用他的工程学位和那颗如狮子之心为兄弟们而战。该死的女人。没有人能感激他的这一点。\n\
    \n布伦丹来自爱尔兰加尔威的一个郊区，名为巴利巴恩（Ballybane）。那是一个阴暗灰暗的地方，他在象牙白的公共住房里长大。他周游世界，设法获得了几个工程认证，并一路上过上了体面的生活，但他从未赚够足够的钱来让一个女性关注他一眼。\n\
    \n他喜欢新加坡。那里干净安静，他可以不受干扰地处理自己的事务。他使用 `virtual private network`（虚拟专用网络）访问暗网，因为尽管有许多优点，但新加坡仍然由思想警察管理。对于任何试图监视他的人来说，他看起来像是在做正经工作，在一个名为\
    \ Fiverr 的自由职业平台上为商业网站编写代码和修复漏洞。他在那台“正经”的笔记本电脑上这样做，并连接到本地网络。然而，在另一台笔记本电脑上，信号通过\
    \ `virtual private network` 路由到远在基辅的服务器。任何试图定位他的人都会认为他正在乌克兰操作。\n\n当地执法机构对他了他的如指掌，但他并没有真的造成任何伤害。他交易的信息无关紧要。但他们一直在盯着。他们也知道\
    \ `VPNs` 的工作原理。\n\n迪特·莱希林（Dieter Reichlin）也在关注。他喜欢读塔希尔那些荒谬的帖子，尤其是现在塔希尔正在撰写关于网络恐怖主义的文章。\n\
    \n网络恐怖主义有两种类型，迪特正试图区分它们，以便写一篇可能的文章，尽管他不确定自己是否能完成。他想找到两者之间的相似之处。\n\n一种是所有人恐惧的恐怖主义类型：大规模的、横扫式的攻击，瘫痪整个国家的电网或导致核设施过热。\n\
    \n但还有一种更具个人色彩的类型，塔希尔所实施的那种，试图利用低级、原始的黑客工具并将其转化为可以推进其个人议程的东西。当然，这种哲学是许多不同类型攻击的后盾，但迪特想理解这种议程，以便理解这些行动的意义。\n\
    \n鲍波（Bo Chou）也在关注像塔希尔这样的人。作为工作的一部分，他被允许进入暗网。随着 ISIS 的泛滥，想要支持恐怖分子网络的“沙发击军师”也随之增多。这是一群迷人的群体，这也是他访问“丝绸之路”（Silk\
    \ Road）最新变版本的正当理由。\n\n尽管互联网上像塔希尔这样的人很多，但在美国只有一宗网络恐怖主义案件获得了成功的起诉。\n\n阿尔迪蒂·费里齐齐（Ardit\
    \ Ferizi）是一个居住在马来西亚的科索沃穆斯林，他利用从军事基地窃取的身份向 ISIS 提供杀手名单。为了做到这一点，费里齐使用了一种名为 `SQL`（读作\
    \ sequel）注入的原始攻击技术——缩写为 `SQLi`——在这种情况下，恶意代码被注入数据库以破坏它，并在本例中提取信息。费里齐的目标是军事基地上的零售商，不仅是为了窃取可能居住海外的政府人员的姓名和地址（这些人员处于真实\
    \ ISIS 战士的范围内），而且为了将这些名字提供给恐怖组织的高层成员。\n\n这里是：\n\n```\n**Ferizi:** 准备好的\n**Hussain:**\
    \ 网站\n**Ferizi:** \n**Hussain:** \n**Ferizi:** \n**Hussain:** 军事基地\n**Ferizi:**\
    \ \n**Hussain:** 手机应用\n**Ferizi:** \n**Hussain:** \n**Ferizi:** 应用程序\n**Hussain:**\
    \ SQLi?\n**Ferizi:** \n**Hussain:** masha’Allah\n**Ferizi:** \n**Hussain:** \n\
    **Ferizi:** \n**Hussain:** \n**Ferizi:** \n**Hussain:** \n**Ferizi:** \n**Hussain:**\
    \ \n**Ferizi:** \n**Hussain:** \n**Ferizi:** 注入后注入注入后注入\n```\n\n费里齐在 19 岁时犯下这些罪，后来被引渡到美国受审、定罪并判处\
    \ 20 年。\n\n鲍波一直在关注费里齐的故事。他已经住进了新雇主提供的一间小公寓。他们拥有的软件可以帮助他可视化员工的活动。\n\n他像一个经常寻找信息的吸烟者。费里齐的案例只是他的一个参考点，说明了当你变坏、当你拿起香烟时会发生什么。\n\
    \n但他知道并不一样。有些吸烟者能活到百岁。这有时让他彻夜难眠。\n\n当他思考可能发生的情况，他经常想起他的一个老同事：纳特·奥伦（Nat Oren），一个完美体现了这种道德模糊性的以色列黑客。\n\
    \n事实上，以色列本身似乎在生产纳特·奥伦。在以色列成为网络安全专家，就像在英国获得英语学位、在纽约学习商业管理或在俄勒冈州波兰进行比较研究一样简单。\n\n\
    网络安全教育在那里的中学就开始了，在很多情况下更早。那里的人口少、敏捷、具有安全意识且富有创业精神。几乎每个人都过军事训练。在许多方面，他们主导了网络空间。从更大范围内证明了，在黑客世界，紧凑、精明和聪明可以胜过庞大。\n\
    \n纳特对私人在线恐怖网络进行详细研究。在他 20 多岁时，他就拥有了几个 LLC 公司和 S 公司。\n\n他还是非公开重大信息市场的频繁买家，这些信息大部分是由其他黑客从律师事务所和银行窃取的。他利用这些信息经营着体面的个人内部交易业务。他购买布波以前在暗网上提供的类型的数据\n\
    \n纳特是布波保持联系的人之一。布波预计纳特永远不会被捕。因为与攻击 NOW 银行的大规模行动不同，这个以色列人满足于此处赚入几百万。纳特更倾向于将生命精力集中在追踪恐怖分子上。他通过说这有助于资助这项事业来为自己的网络犯罪辩护。布波无法从这种道德角度对他指责他——这比他自己的理由要高得多。\n\
    \n"
