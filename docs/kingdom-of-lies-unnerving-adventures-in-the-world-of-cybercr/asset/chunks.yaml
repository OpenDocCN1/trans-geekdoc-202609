    lot of them, maybe because we are such a rare lot. In order to staff the shortfall
    of cybersecurity jobs—millions that will need to be filled by 2020—we are going
    to have to do a better job of recruiting women to the field. This makes it sound
    like we are up against some sort of serious challenge, but it shouldn’t be this
    way. It’s a natural career for women.


    Hypervigilance. Risk aversion. The ability to imagine frightening scenarios that
    nobody else can see based on a series of devastating, cascading factors. Three
    pathologies so often held against women in business. Three characteristics of
    so many new mothers. These are enormous assets in the field. Perhaps it’s better,
    I learned, for women who suffer from them to put them to work, to use anxieties
    to make money hand over fist.


    I didn’t know when I entered the field that I was going to write a book, I just
    knew I wanted to know more about these interesting people who were passing in
    and out of my life. Writing a book has been very different from being a journalist,
    in that I’m not objective about some of the individuals I write about here. I
    consider many of them personal friends; some I consider enemies. I have saved
    their stories for this book.

    '
  trans: '

    你会用智能手机吗？会做 PowerPoint 吗？反应快吗？你是否曾和朋友组织过一次完美的电影聚会，不仅进展顺利，而且没有人在往返活动途中发生车祸？欢迎来到
    21 世纪最热门的职业道路。你能让女性为之魂颠倒吗？你逃离了一段虐待你的婚姻吗？你是否曾在家里举办过蹒幼儿的生日派对？亲爱的，我想要你加入我的网络安全团队。


    读完书中的故事后，你将会明白，网络安全之所以复杂，是因为人性的复杂。所以，如果你知道如何与人相处，你就能处理网络安全。如果你理解人的行为逻辑，你不仅能够识别威胁，还能比你的对手领先一步。


    在我担任跨国公司网络安全高管、在《华尔街日报》及随后的 CNBC 担任记者，以及后来在乔治敦大学担任教授的职业生涯中，我遇到了许多迷人的人。从实施恶意攻击的黑客，到试图防止这些事件发生的安全专业人士，再到那些进行危机处理的缩写字母般的政府机构，归根结底，他们都是父亲、儿子、母亲、姐姐和配偶。换句话说，他们和我们一样的人。是的，白帽和黑帽会交集，改变盟的频率比你想象的要频繁得多，但他们的驱动力与我们其他人无异——尽管有时感觉网络安全领域的每个人都对真相过敏。


    作为一名专业人士，我听过许多关于我如此喜爱的领域的巨大谎言。在成为网络安全领域的记者后，我听到了更多。以下是其中几个：


    ### 谎言 1：“让我向你介绍一下黑客社区。”


    这个谎言通常由某个眨着眼睛、点首的人说出，他们认为自己认识地球上的每一个黑客。事实是，根本没有所谓的黑客“社区”。


    当然，那些在大型年度会议上大出水面的人可能会有不同说法。但每个国家、每个州、每个派系、每个身份小组都有自己的电脑黑客群体。其中一些人极其保守，另一些人极度自由，大多数人介于两者之间。有些人白天穿西装打领带，当律师工作，而另一些人看起来像普通公民，在追求他们独特议程时拥有极佳的人际交往技巧。


    有些人是好人，因为厌倦了低薪和无聊的工作而变成犯罪分子。有些人是犯罪分子，最终却变成了好人。许多人的职业生涯始于终于这个光谱的两端。


    有些人（包括你将在本书中会遇到的许多人）是极其高练的黑客，他们没有时间也没有倾向去认同任何社区。


    作为一名记者，我对那些涌现出来向我提供进入黑客社区独家访问权限的人数感到惊讶。我不禁注意到，这些来源的所谓“黑客社区”的成员往往是像他或她这样的人。我的观点是，在这个领域工作着许多不同类型的人，我可以向你保证，他们很多人和你完全一模一样。


    ### 谎言 2：“他是网络安全领域的领军人物。”


    他可能不是。名声和光芒在这一领域通常并不交集。我见过的真正的天才并不出名，他们大多数人都没有社交媒体资料。他们倾向于不对自己专业知识之外的领域发表政论。


    那些不断登上会议头条、并经常被推荐给我采访的人，其洞察力不如那些隐伏在地下的人。高知名黑客愿意分享的任何内容，通常都带着一个巨大且清晰的意图，我已经学会了在几里外就识破它。即使对话是非下进行的，来自政府高层官员或其他知名企业网络安全将领的情报也包含很少的新颖信息。


    在这个世界——以及在这书中——唯一为我指明道路的人，是那些从未担任过 C 级职位的真实从业者。你从未听说过他们，由于我隐去了他们的名字，你可能永远不会知道。


    他们并不是因为是领军人物才在这个世界上点亮我的道路，而是因为他们是真正的实践者。这些人通常没有公关团队。


    ### 谎言 3：“他并不知道自己在说什么。”


    这个谎言通常由一个声称自己比任何人更了解该领域的人说出。作为一名专业人士，我对于这个我如此喜爱的领域听过许多巨大的谎言。在成为网络安全领域的记者后，我听到了更多。这里是其中几个：


    （注：此处由于原文文本在谎言 3 处中断，以下根据你提供的文本结尾进行翻译，但原文似乎不完整，请检查检查。）

    '
