    **René 躺在床上，感到不适，浑身发热。** 她怀孕了。她感到恐慌，因为她以为自己不会怀孕。她担心 Sig 不会相信她。她检查了他买的避孕胶，他说他一直在用。但那个盒子是没拆过的，塞在浴室的抽屉里，还在袋子里。


    他没有用过吗？她知道如果问这个问题，他会说什么。他会说她是幻觉，是疯了。她根本没办法提这件事，否则会被指责总是指控他。


    “我像女王一样对待你，得到的却是这种报答。” 他的脸从那种愉悦的温蔼、巨大的微笑瞬间变成露出牙齿的愤怒。他会说她在幻幻、听到了幻听。“也许我们需要带去看心理医生？”他会对她吐口水。

