- raw: 'In Sig’s experience, hacking collectives typically resemble start-up businesses
    more than old-school mafiosi. Divisions of the organization are best left to specific
    talent classes. Some specialists in arcane, difficult technology disciplines may
    work autonomously, and hiring them comes at a premium.


    In bigger organizations, there are even human resources functions and customer
    service divisions. Some groups also have cybersecurity divisions of their own,
    which keep other criminal groups from stealing the illicit intellectual property
    they are creating and stealing.


    Sig loves start-up culture. This is what he seeks to emulate. The new organization
    he hopes to build will include intelligence specialists to collect reconnaissance
    and a malware specialist—whom he knows from experience—to help design or alter
    existing components. He’ll also use specialists who can deliver, exploit, and
    install the malware on the targets. Guys who are good at operating command and
    control servers and directing botnets, or large collections of compromised computers
    and devices.


    Once he’s got these pieces in place, Sig will set up a collections department
    to make sure people pay up. This collections person will be proficient in various
    clandestine money transfer methods and cryptocurrencies, to facilitate ransom
    payments from a global series of victims.


    Most of the people he has in mind are men in their 20s to 40s from around Eastern
    Europe.


    Finally, he wants a customer service rep. A pretty girl. Someone to temporarily
    offset all the testosterone that, he knows from experience, will ultimately break
    the organization apart.


    *That shouldn’t be too difficult*, Sig thinks. He’s never had a problem getting
    the attention of an attractive woman.


    **Caroline is trying to** organize her thoughts. She is pregnant with her second
    child and she can see the writing on the wall—Raykoff’s new organization has no
    place for someone like her, someone who knows and is friendly with everyone, who
    is well loved and plugged into many cybersecurity communities. She is, in a word,
    dangerous.


    The breach has slowed many things down, so news of her pregnancy came later than
    she would have liked. But the conversation with Raykoff was still jarring. She
    told him about her pregnancy, let him know when she would be taking maternity
    leave, approximately six months away now. It’s considered polite protocol to not
    let something like a baby’s arrival sneak up on your boss, and Caroline is congenitally
    on the right side of protocol. His response was predictable but cast a pall over
    her nonetheless: “When you get back from leave, you won’t have a job in cybersecurity
    anymore.”


    Not “you won’t be working for me,” or “you won’t be working in my division,” or
    “you won’t be working in this company.” “You won’t have a job in *cybersecurity*
    anymore.” The threat was specific. She felt like he intended to blackball her.
    Her solace was that although he may have had the power to do this when he worked
    in government, he did not have the same power over the finance sector.


    Still, his reaction has thrown her off. She has been seeking consolation from
    her vast network of peers. They have her back, as she always had theirs. They
    are enraged about this turn of events, even more than she is.


    Now she sits with Michael Joseph, a former Marine Corps drill sergeant who is
    one of her closest confidants, and one of her earliest hires. He is filling her
    in on details of Venice. It’s a Sunday night. Everyone has lost track of time.
    Their conversation is scored by the sound of quiet typing inside the SOC.


    The security analysts detected the trip wire set by the attackers and have observed
    several terabytes being exfiltrated—taken out of the bank—all by the same perpetrator.
    As part of the investigation, they have found other problems, other attacks, other
    exfiltrations. They don’t know yet how much data has been taken or what was in
    the data. It will be a very long time before they find out who did it. Possibly
    never.


    Raykoff had been going around telling every executive who will listen that this
    is war. It looks like Chinese influence, he says. Game-changing, he says.


    Michael agrees. It is big. And different. Not the sort of thing they have been
    trained for. They are a team of technologists first, engineers who understand
    protocols, controls, wonky stuff meant to create a relatively safe-as-possible
    environment. Michael has spent time on the battlefield in Afghanistan, but that
    was different. Banks don’t go to war with the enemy, Marines do. When the enemy
    attacks a bank, Marines step in to control the situation. But there are no troops
    on the ground here. No NSA. No DHS. The FBI has been in touch, but not to do battle,
    to help figure out who is behind Venice.


    The bank wants to both cooperate politely with and keep the three-letter agencies
    at bay, as most companies do if they can help it. Keep them vaguely satisfied
    and cordoned into their own investigative corners. The more agencies, the more
    leaks. The more agents, the more leakers. And the agencies didn’t have the cyberarmy
    to help the bank anyway. They simply aren’t set up to deal with cyberattacks spread
    out across every company in the country, each with its own internal politics and
    lingo and an unwillingness to share information with the government.


    Then there’s Raykoff. He knows something about the current threat. He understands
    how kinetic warfare can be executed. He understands the threats.


    True, he might not have the depth of knowledge about the most current technical
    landscape. But that isn’t the real problem. The real problem is that, based on
    his lack of experience in the finance sector and based on his early interactions
    with bankers, he doesn’t appear to have a good grasp of how a bank works. He doesn’t
    seem to understand that bankers are unlikely to listen to him since he’s coming
    from a cost center, and pounding the table won’t change their minds. His connections
    to the Pentagon no longer matter. Instead of focusing on how to explain what is
    happening with the breach to his counterparts across the bank, he defaults to
    Cold War rhetoric and sends frightening emails to employees who might leak to
    media, which is apparently what happened.


    Michael slaps his forehead. “Did you see the article?”


    “What article?” Caroline is too depressed to read the news, even about NOW Bank.


    He pulls up a *New York Times* piece on the breach. An obvious leak from within.
    Some details of the attack are completely on point, others are totally wrong.
    One sticks out as being particularly egregious. The reporter says that sources
    inside the firm say the attack likely originated in northern Italy. They laugh.
    Italy isn’t known as a hotbed of malicious activity. It is dead wrong. It’s Russia,
    maybe Israel, possibly China.


    Reporters are terrible at telling stories about cybersecurity. The hushed, striking
    mystery in the writing belies the clunky reality behind the scenes. Michael and
    Caroline go over the details again, trying to figure out who could have leaked
    the story. Who could have gotten a detail like that so wrong?


    Then Caroline looks up, as if she could see the interaction unfolding in front
    of her. A confused, nervous internal source. A reporter with no grasp of the subject
    matter.


    “*They’re calling it Venice*.”


    They both laugh out loud, disturbing some of the SOC workers.


    It’s 9 p.m. on a Sunday. Somebody knocks on the door.


    Prem speed-walks inside. “Dinner’s here!”


    The sound of typing finally stops.


    ## **6.**


    ## The Gig Economy


    **Three months have passed. In** Romania, things are going well with Sig’s new
    company, which he has decided to call TechSolu. It’s a nonsense term that simply
    sounds like an Eastern European tech startup. He stole the logo from a manufacturer
    of vacuum cleaners. It’s a half sun. Not that it matters.'
