- raw: 'In the beginning, it was amazing and romantic. Sig praised her endlessly:
    her ambition, her ability to think on her feet and make use of her meager education
    and average looks.


    Meager. Average.


    Then he encouraged her to cut ties with her college completely. Then, to work
    from his new home.


    Or hers. He did say it is hers. That he’d bought it for her. But it is his.


    Her friends couldn’t believe it at first, that she’d settle down so quickly and
    so young, so he told her to stop talking to them. They are a bad influence, he
    says.


    He says he wants to marry her, to settle in this spacious suburb in this big country
    house. But she feels her world has grown quite small. Where once she loved the
    freedom of being a waitress, and listening to music, and saying hello to her coworkers,
    and sharing her pictures with friends, all that has been replaced. First by work.
    Then by Sig. Thinking about him, worrying about whether he is happy with her,
    fearing she might do something to make him upset. Sig wants her to be better.


    “Is there something wrong with that? I just want you to be the best.”


    So here she sits, working hard. He loves her. Right? That’s what he says. He monitors
    her time online so it’s difficult for her to leave. He texts her constantly, and
    if she doesn’t answer right away, he gets worried. Or angry. Sometimes both. But
    she doesn’t mind. He is just smitten with her. That’s the word he uses. Smitten.


    So she shrank down to the size of a pea. Even now, she’s curled up in the loveseat,
    laptop in her lap, voice-over-IP to receive calls from ransom victims right in
    her chair. The calls come less frequently now. Companies have caught on. TechSolu
    gained a reputation as a crack operation that can be trusted to release data once
    it is paid. No need to call customer service.


    René will miss the ransomware explosion that she in her own small way helped create.
    Her jaw tightens involuntarily. She wonders if she has a jaw problem. It aches
    and she doesn’t know why. She feels something hot. Sig is always saying she seems
    too anxious. She can feel her jaw tightening, her teeth grinding. Is it nervousness,
    anxiety? Or maybe it’s something else. What is the medical term for feeling trapped
    with no way out?


    **In Shanghai, Bo Chou** is involved in a bit of a flirtation with one of his
    customers. The businessman is English but working in Senegal. He has a picture
    as part of his Fiverr profile—so few of them do. They take their conversation
    offline, flirting over Signal, an encrypted texting application.


    But things quickly take a turn, when the client, who works for an oil company,
    starts asking him questions about where he gets his data. Bo goes with his usual
    lines, about public sources of information, SEC filings, and so on. But the client
    doesn’t let up. “This info is too good, too personal, to come from public sources.”


    They’d been talking about far sexier things, and Bo’s antenna goes up. He’s only
    ever a few steps removed from his military training.


    “I know for a fact that those email addresses you had for Saudi Aramco aren’t
    public anywhere,” the client writes.


    Bo will drink himself into a stupor that night and go to work at the hotel the
    next morning hungover. But first he drops the phone on the bed like a hot potato.
    Then he deletes his chat history over Signal. Then he uninstalls the application.
    Then he wipes his phone entirely. Then, in a fit of pique, he drops it in the
    toilet and, after that, smashes it with a hammer.


    Can’t be too careful.


    ## **12.**


    ## The Researcher


    **It’s nearing the end of** spring in Romania, a beautiful June day. The Romanian
    word for spring is “arc.” Sig likes that. His story and TechSolu’s story are about
    to take another turn, so it seems appropriate.


    Sig is looking over the shoulder of his cousin, a German computer expert named
    Dieter Reichlin, who looks much more the part of a hacker than Sig does, which
    amuses him. Dieter is tattooed from wrist to shoulder on both arms, with colorful
    scenes of outer space and fantasy planets that don’t really exist. He wears a
    black T-shirt and black jeans and black leather boots, all cheap. His hair is
    long in the back and thinning a bit on top.


    Sig has lured Dieter here so he can learn more about a scam that Dieter has written
    about but doesn’t have the balls to pull off himself. That’s the difference between
    the two: Sig is a man of action while Dieter sits on the sidelines and observes.


    Dieter seems not to care about making money, which confounds Sig. *No matter*,
    Sig thinks. *More for me*.


    **Dieter is a security** researcher. A legitimate one. He’s visiting Romania.
    Doesn’t love it. Doesn’t trust it. Has to get a bunch of burner phones to even
    enter the airspace.


    Security researchers occupy an interesting subsegment in the cybersecurity field.
    They are typically independent engineers, hackers, or intelligence gatherers.
    They offer freelance services and promote their work through written articles
    or blog posts exposing various corporate missteps or new types of cybercrimes.


    They often get to know criminals or criminal organizations in order to describe
    their crimes to the outside world. Dieter is a bit of an anomaly. He is acutely
    interested in privacy research, and often keeps his findings to himself.


    Dieter believes Sig is under the impression that Dieter has no idea that TechSolu
    is a front for criminal activity. This is fine with Dieter. Sig has been vague
    about his reasons for moving to Arnica Valka. Sig deflects any conversations related
    to his current work. Deflect, smile, nod, move on. That’s Sig, a master of deflection.


    Dieter is a cousin related not by blood but by proximity. Their mothers were childhood
    friends, so they had been forced together as playmates and for family trips and
    had, by necessity, floated in the same general direction their whole lives. Computer
    camps. Coding classes, which Dieter excelled at and which Sig failed. Attempts
    at soccer, which Dieter failed and Sig managed better with his tall, lean physique.


    But for some reason, despite being taller and much better looking, Sig never did
    as well with girls. That was always a sticking point, Dieter knew, one he was
    wary of. Sig’s flashes of anger could be cold and scary, and he preferred to avoid
    them.


    *Sig and girls*. Dieter had reminisced for the entire three-hour flight here from
    Helsinki. Girls would flock to Sig in droves, attracted by his good looks and
    charm, but only days or weeks later they would break up, the girls looking blank-faced
    and dejected, whispering to friends about Sig in a way that Dieter understood
    to mean that he was being blackballed in some fashion. And blackballed he was.


    Growing up, Sig kept having to move in wider circles, outside their small town
    to neighboring villages, until those girls were whispering about him, too. Sig
    moved farther and farther away. Now he is all the way in Romania, and Dieter can’t
    help but wonder what kind of girl he’s got locked up in that new house he keeps
    bragging about.


    To Dieter’s surprise, when they became teenagers, it was he—short, a bit awkward
    but warm enough—who managed to do better with girls. For him, they were usually
    computer geeks, but he always had a pretty girlfriend who would stick around even
    after the breakup to be friends. Sig sneered at this, but he was clearly jealous.
    It drove the men apart. Dieter was not a psychologist, so he could not say why.


    Dieter didn’t like Sig, but he stayed close to him. This puzzling decision—puzzling
    even to Dieter himself—would only make sense later. Once Sig became a criminal
    and Dieter went on to be a researcher, he understood why. Because Sig made a very
    good specimen, and Dieter, an excellent scientist.


    Three years prior to this flight from Helsinki to Bucharest, Dieter married a
    beautiful ghost-colored girl from Finland and settled there with the goal of having
    many pale children and quietly hacking computers for the purposes of good.'
