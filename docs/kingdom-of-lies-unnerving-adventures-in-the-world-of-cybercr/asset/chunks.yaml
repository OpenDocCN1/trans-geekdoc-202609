  trans: '


    # 企业风险管理：一种全面的风险管理方法，通过涉及组织内部的人员、流程和系统，来提高决策质量，以管理那些可能阻碍组织实现其目标的风险。它也可能涉及识别任务对企业能力的依赖性、识别并优先处理由定义威胁引起的风险、实施应对措施以提供静态风险态势和对活动威胁的有效动态响应，并根据威胁评估企业性能并在必要时调整应对措施。


    # 事件：信息系统或网络中可观测到的发生情况。能够提供事件正在发生的迹象，或至少引发对事件可能正在发生疑虑的事物。


    # 数据外泄：从信息系统中未经授权地传输信息的行为。


    # 漏洞利用：一种违反安全策略以突破网络或信息系统安全性的技术。


    # 暴露：处于不受保护的状态，从而允许攻击者访问其进入系统或网络的信息或能力。


    # 防火墙：限制网络与网络和/或信息系统之间网络流量的能力。一种根据允许或不允许或授权访问的一系列规则来限制网络流量的硬件/软件设备或软件程序。


    # 黑客：试图获取或已获得信息系统访问权限的授权用户。


    # 哈希化：对一组数据应用数学算法以产生代表该数据的数值（“哈希值”）的过程。


    # 身份和访问管理：用于管理主体及其访问特定对象的身份验证和授权的方法和流程。


    # 影响：行为的结果。


    # 事件：实际或可能对信息系统或该系统处理、存储或传输的信息产生不利影响或构成威胁的发生情况，并可能需要响应行动来减轻后果。构成对安全策略、安全程序或可接受使用策略的违反或即将违反的发生情况。


    # 事件管理：与实际发生或可能发生导致信息或信息系统产生不利后果的事件相关的活动进行管理和协调。


    # 事件响应：处理事件短期直接影响的活动，并可能支持短期恢复。网络安全工作，其中人员：对相关领域内的危机或紧急情况做出响应以减轻眼前和潜在威胁；根据需要使用缓解、准备以及响应和恢复方法，最大限度地保护生命、财产和信息安全。


    # 工业控制系统：用于控制工业过程（如制造、产品处理、生产和配送）或控制基础设施资产的信息系统。


    # 信息保证：通过确保信息的可用性、完整性和机密性来保护和防御信息及信息系统的措施。


    # 信息技术：任何处理、传输、接收或交换数据或信息的设备或互连的系统或子系统。


    # 内部威胁：组织内部通过违反安全策略构成潜在风险的人员或群体。一个或多个拥有公司、组织或企业的权限和/或内部知识的个人，旨在破坏该实体安全、系统、服务、产品或设施的漏洞。


    # 完整性：信息、信息系统或系统组件未经过授权的方式被修改或破坏的属性。信息从源源产生起保持不变的状态。


    # 侵入：未经授权绕过网络或信息系统安全机制的行为。


    # 入侵检测：分析网络信息以确定是否发生突破的过程的方法。


    # 调查：使用数字取证和其他技术对威胁或事件进行的系统的正式查询。


    # 密钥：用于控制加密操作（如解密、加密或签名生成）的数值。


    # 键盘记录器：跟踪击键和键盘事件的软件或硬件，通常用于监控用户的操作。


    # 密钥对：一个`public key`和一个`private key`。两个数学相关的密钥，其属性是其中一个密钥用于加密消息，而该消息只能使用另一个密钥进行解密。


    # 恶意代码：旨在执行未经授权功能的程序代码。


    # 恶意软件：损害系统运行的软件。同义词：恶意代码、恶意小程序、恶意逻辑。


    # 缓解：应用一种或多种措施以减少意外情况发生的概率和/或减轻其后果。也可以涉及基于风险管理优先级和替代方案分析来实施适当的风险降低控制。


    # 外部威胁：组织外部的未经授权访问其资产并对组织及其资产构成潜在风险的人员或群体。


    # 数据包：数据包或网络数据包由数据组成，格式化以便网络传输，通常包括有关控制和终端用户的信息。当网站一次接收过多数据包时，可能会变得平衡，导致网站崩溃或被恶意攻击者接管。


    # 被动攻击：由蓄意的威胁源实施的实际攻击，试图学习或利用系统信息，但未尝试更改系统、资源、数据或其操作。


    # 密码：用于验证身份或验证访问授权的字符字符串（字母、数字和/或其他符号）。


    # 渗透：进入网络或系统。


    # 渗透测试：渗透测试（penetration testing）的俗称。


    # 渗透测试：一种评估方法，评估人员借此寻找漏洞并尝试绕过网络和/或信息系统的安全特性。


    # 个人身份信息/个人可识别信息：允许直接或间接推断出个人身份的信息。


    #  网络钓鱼：一种数字形式的社会工程，用于欺骗个人提供敏感信息。


    # 隐私：确保对实体某些信息的机密性和访问受到保护的保证。个人理解并控制他人如何使用其自身信息的能力。


    '
