  trans: "\n归根结底，这本书关于控制。当我们与技术互动时，发生的一切中如果说有一个共同的主题，那就是我们渴望以有利于自己的方式来控制环境。这种想要胜出的欲望驱动着我们所做的几乎每一个技术决策。\n\
    \n每一个创新的动力，前进轨迹中的每一条曲线，都由那些想要控制某些事、某人，或者所有人每个人的人所承担。也许通过技术，也许通过权威，也许通过才华或他们能提供的任何技能。成为我们创造的这头巨兽手中高举缰绳的人——这才是奖励。在任何时候，都有成千上万的人为了自己的利益在抢夺、攻击和搏斗。\n\
    \n当然，你已经知道了谁是谁*真正*掌控着局面的人。因为你对网络安全的了解比你想象的要多。\n\n# 1. 未来威胁\n\n`Carl 知道，如果银行系统被数据包淹，他们将无法处理流量，网络应用程序将过载，银行网站将崩溃。人们将无法办理业务或支付账单。Twitter\
    \ 将爆炸。呼叫中心的电话会像施虐狂者的合唱一样响起来。银行高管会显得很难看。` \n\n这就是九月份发生的情况。这也是恐怖分子现在正试图做的，第二次。\n\
    \n*但这最好他妈的别成功*，`Carl`在过去的几周里被反复告知这一点。*这种情况不能再次发生了*。\n\n`Carl`不在乎为什么会发生这种情况，但银行家总是想知道为什么。所以，在`Joe`的报告中，他解释了恐怖分子为攻击提供的理由，这种理由逻辑上不通，但显然是\
    \ Izz ad-Din 成员自己在网上提出的：有一位名叫 Terry Jones 的美国牧师威胁要烧毁《古兰经》，并有一个批评伊斯兰教的 YouTube\
    \ 视频，而 Izz ad-Din 希望这两者都能停止。还有以色列。该组织对以色列有很多话想说。\n\nIzz ad-Din 声称他们等了四个月是因为他们很仁慈。他们因为美国总统选举和桑迪飓风延迟了第二次行动。\n\
    \n但那全是胡扯。\n\n因为这种事情经常发生在银行身上。`DDoS`（分布式拒绝服务）攻击来自愤愤的青少年、外国的亡命之徒以及之间的各阶层黑客。他们随处可见。特别是在金融危机之后，来自`Anonymous`（匿名者）和活动分子对“1%精英”的敌意激增。\n\
    \n`Carl`、`Joe` 和网络安全团队以前已经无数次阻止了 `DDoS` 攻击。Izz ad-Din 不同。他们有技能，也有硬件。他们还有人。很多，很多人。他们不是散布在东欧的\
    \ 20 多岁恐怖分子组成的松散网络。不是某个地方地下室里的孩子。他们是一个整个国家。\n\n具体来说，是伊朗。\n\n在接下来的几天里，`Carl` 和另外五名安全专业人士与反派作斗。\n\
    \n`Carl`所有的时间都待在房间里。他们把房间的温度调到冰点，让每个人都能保持清醒。有人不断从食堂带来三明治。高管们进进出出房间。有些人站在他身边，越过他的肩膀看，在再次离开之前做出重要的手势并发出庄重的叹息。\n\
    \n他们将攻击命名为`Deep Blue`（深蓝），并对此进行每天、每天晚上有时每小时一次的电话。参与的人越来越多。其中一些 `Carl` 以前见过。其中一些，他知道是甚至不属于银行的顾问。攻击持续得越久，参与危机的人就越多。这*确实*是一个危机。没有人见过这种事。从外部看，从内部看，一个事实对所有人都是显而易见的：银行管理层需要将网络安全放在优先位置。不是明天，不是下周，而是现在。\n\
    \n随着西装们聚集，假装感兴趣，看着 `Carl` 坐在电脑前每天妈地与伊朗军队战斗，他变得越来越疏离，越来越孤独。攻击超过了他的同事的技能，将他们边缘化为侧旁的支持角色。`Carl`\
    \ 是一个*真正的*黑客，一个极其优秀的黑客，他见过一切，但从未见过如此巨大的攻击。\n\n接着就像开始时一样，突然结束了。有人终于删掉了那个愚蠢的反伊斯兰教\
    \ YouTube 视频。Izz ad-Din 宣布战争结束了。`Carl`无法置信。他坐在桌前，手指按在键盘上，精疲力竭，咖啡因过度，身体微微颤抖，怀疑是否真的结束了。大家都回家了。`Carl`\
    \ 留了下来，为董事会编写最后一份安全报告。他们要求他预测下一次打击何时到来。`Carl` 重新考虑，按下了删除键。“未来威胁”是一个垃圾术语，他想。这可能是某个政府大笨蛋发明的。这会让银行家们两眼发直。他不能那样。现在，`Carl`\
    \ 正在面对这样一个事实：现在的银行高层高管突然关心网络安全，而银行家表达关心的方式就是金钱。\n\n`Carl` 写道：“其他敌对国家将使用 DDoS 攻击作为进入并留存在我们网络的掩护，目标是长期秘密收集信息。”\n\
    \n`Carl`揉了揉眼睛，合上笔记本电脑。当他走进此时黑暗的大堂时，他像枪手一样吹了吹指关节。\n\n大约同一时刻，前空军指挥官 Bob Raykoff\
    \ 阅读了和他与一名代笔作家凑在一起、用于教材下一版的的一些文本。\n\n*网络空间中的未来威胁将要求我们采取某种进攻性行动，此前这被定性为主动防御。确保这些主动防御措施安全的唯一方法是围绕它们设计明确的军事协议，并尽可能与其他国家——甚至是敌对国家——合作建立更稳健的网络攻击、网络侦察和其他策略的国际规范*。\n\
    \nBob Raykoff 是最早使用“未来威胁”一词的人之一。他正在编写他的新书，并写一个以该命名的章节。他痴迷于未来威胁。他一直在观察针对银行的 DDoS\
    \ 攻击，思考谁会利用伊斯兰分子造成的注意力。中国人？俄罗斯人？\n\n肯定是俄罗斯人。Bob *非常恨*俄罗斯人。\n"
