- raw: '**ENTERPRISE RISK MANAGEMENT:** A comprehensive approach to risk management
    that engages people, processes, and systems across an organization to improve
    the quality of decision-making for managing risks that may hinder an organization’s
    ability to achieve its objectives. May also involve identifying mission dependencies
    on enterprise capabilities, identifying and prioritizing risks due to defined
    threats, implementing countermeasures to provide both a static risk posture and
    an effective dynamic response to active threats, and assessing enterprise performance
    against threats and adjusting countermeasures as necessary.


    **EVENT:** An observable occurrence in an information system or network. Something
    that provides an indication that an incident is occurring or at least raises the
    suspicion that an incident may be occurring.


    **EXFILTRATION:** The unauthorized transfer of information from an information
    system.


    **EXPLOIT:** A technique to breach the security of a network or information system
    in violation of security policy.


    **EXPOSURE:** The condition of being unprotected, thereby allowing access to information
    or capabilities that an attacker can use to enter a system or network.


    **FIREWALL:** A capability to limit network traffic between networks and/or information
    systems. A hardware/software device or software program that limits network traffic
    according to a set of rules of what access is and is not allowed or authorized.


    **HACKER:** An unauthorized user who attempts to gain or gains access to an information
    system.


    **HASHING:** A process of applying a mathematical algorithm against a set of data
    to produce a numeric value (a “hash value”) that represents the data.


    **IDENTITY AND ACCESS MANAGEMENT:** The methods and processes used to manage subjects
    and their authentication and authorizations to access specific objects.


    **IMPACT:** The consequence of an action.


    **INCIDENT:** An occurrence that actually or potentially results in adverse effects
    on or poses a threat to an information system or the information that the system
    processes, stores, or transmits, and that may require a response action to mitigate
    the consequences. An occurrence that constitutes a violation or imminent threat
    of violation of security policies, security procedures, or acceptable use policies.


    **INCIDENT MANAGEMENT:** The management and coordination of activities associated
    with an actual or potential occurrence of an event that may result in adverse
    consequences to information or information systems.


    **INCIDENT RESPONSE:** The activities that address the short-term, direct effects
    of an incident and may also support short-term recovery. Cybersecurity work where
    a person: responds to crises or urgent situations within the pertinent domain
    to mitigate immediate and potential threats; uses mitigation, preparedness, and
    response and recovery approaches, as needed, to maximize survival of life, preservation
    of property, and information security.


    **INDUSTRIAL CONTROL SYSTEM:** An information system used to control industrial
    processes such as manufacturing, product handling, production, and distribution
    or to control infrastructure assets.


    **INFORMATION ASSURANCE:** The measures that protect and defend information and
    information systems by ensuring their availability, integrity, and confidentiality.


    **INFORMATION TECHNOLOGY:** Any equipment or interconnected system or subsystem
    of equipment that processes, transmits, receives, or interchanges data or information.


    **INSIDER THREAT:** A person or group of persons within an organization who pose
    a potential risk through violating security policies. One or more individuals
    with the access to and/or inside knowledge of a company, organization, or enterprise
    that would allow them to exploit the vulnerabilities of that entity’s security,
    systems, services, products, or facilities with the intent to cause harm.


    **INTEGRITY:** The property whereby information, an information system, or a component
    of a system has not been modified or destroyed in an unauthorized manner. A state
    in which information has remained unaltered from the point it was produced by
    a source, during transmission, storage, and eventual receipt by the destination.


    **INTRUSION:** An unauthorized act of bypassing the security mechanisms of a network
    or information system.


    **INTRUSION DETECTION:** The process and methods for analyzing information from
    networks and information systems to determine if a security breach has occurred.


    **INVESTIGATION:** A systematic and formal inquiry into a qualified threat or
    incident using digital forensics and/or other traditional criminal inquiry techniques
    to determine the events that transpired and to collect evidence. Any cybersecurity
    work in which a person applies tactics, techniques, and procedures for a full
    range of investigative tools and processes, including interview and interrogation
    techniques, surveillance, countersurveillance, and surveillance detection, and
    appropriately evaluates the benefits of prosecution versus intelligence gathering.


    **KEY:** The numerical value used to control cryptographic operations, such as
    decryption, encryption, signature generation, or signature verification.


    **KEYLOGGER:** Software or hardware that tracks keystrokes and keyboard events,
    usually to monitor actions by the user of an information system.


    **KEY PAIR:** A public key and its corresponding private key. Two mathematically
    related keys having the property that one key can be used to encrypt a message
    that can only be decrypted using the other key.


    **MALICIOUS CODE:** Program code intended to perform an unauthorized function
    or process that will have adverse impact on the confidentiality, integrity, or
    availability of an information system.


    **MALWARE:** Software that compromises the operation of a system by performing
    an unauthorized function or process. Synonyms: malicious code, malicious applet,
    malicious logic.


    **MITIGATION:** The application of one or more measures to reduce the likelihood
    of an unwanted occurrence and/or lessen its consequences. Can also involve implementing
    appropriate risk-reduction controls based on risk management priorities and analysis
    of alternatives.


    **OUTSIDER THREAT:** A person or group of persons external to an organization
    who are not authorized to access its assets and pose a potential risk to the organization
    and its assets.


    **PACKETS:** Packets, or network packets, consist of data, formatted to be carried
    over a network, typically including information about controls and end users.
    When a website receives too many packets at once, it can become unbalanced, resulting
    in a crash of the website or a takeover of the website by a malicious actor.


    **PASSIVE ATTACK:** An actual assault perpetrated by an intentional threat source
    that attempts to learn or make use of information from a system but does not attempt
    to alter the system, its resources, its data, or its operations.


    **PASSWORD:** A string of characters (letters, numbers, and/or other symbols)
    used to authenticate an identity or to verify access authorization.


    **PENETRATION:** Intrusion into a network or system.


    **PEN TEST:** A colloquial term for penetration test or penetration testing.


    **PENETRATION TESTING:** An evaluation methodology whereby assessors search for
    vulnerabilities and attempt to circumvent the security features of a network and/or
    information system.


    **PERSONAL IDENTIFYING INFORMATION/PERSONALLY IDENTIFIABLE INFORMATION:** The
    information that permits the identity of an individual to be directly or indirectly
    inferred.


    **PHISHING:** A digital form of social engineering to deceive individuals into
    providing sensitive information.


    **PRIVACY:** The assurance that the confidentiality of and access to certain information
    about an entity is protected. The ability of individuals to understand and exercise
    control over how information about themselves may be used by others.'
