    Can’t stand working alongside other people. Hates answering questions. He has
    a PhD in string theory and sometimes can’t be bothered to say what he is thinking
    out loud; it takes much longer than simply doing it. He doesn’t do paperwork.


    So 12 years ago, he put his PhD in string theory to work by learning how to program
    and tweak the electronic control units of `GM` cars. He has three cars, all modified.
    A navy blue `Corvette` and a black `Crown Victoria` with a `Corvette` engine.
    The `Crown Victoria` has a push bar and police spotlights. Then there is the dusty
    old `Chevy Lumina` that he lets his sister drive around.


    The `Crown Vic` is a monster. It drives fast and turns on a pin and takes up far
    more space than it should. It is what he prefers to drive out to `Padraigh’s`
    place in Newark. People tend to get out of his way when he drives the `Crown Vic`,
    which he appreciates.


    **Over those years, he’s** watched as the networks that operate those cars proliferate
    and grow to a degree that is similar to the interwoven, sometimes dysfunctional
    networks supporting `NOW Bank`. In `Victor’s` case, the networks are made compact
    and introduce incredible complexity to each individual `Malibu` or `Impala`.


    It’s a job that’s always challenging in some new way. A job that mostly always
    keeps him, blessedly, thankfully, out of contact with other people.


    Now a reporter is bothering him. He hates reporters. The reporter is trying to
    get him to explain to her how car computers work and how they could be hacked.
    He explains, carefully, first that he is not a hacker. Then he describes how car
    computers have changed over the years to become more vulnerable. She treats `Victor`
    like he simultaneously represents every hacker, Russian and Israeli, who has ever
    lived.


    “Have you heard anything about this breach at `Home Depot`?” she asks.


    He hesitates. “No. From who?”


    “From other hackers?”


    “I am not a hacker, and I don’t know other hackers,” he says. Although, given
    his credit card issues, he wonders if it’s related.


    `Victor` knew the reporter from his post-academic career in the mid-2000s. Then,
    he was working in arbitrage. In traditional banking, this is the buying and selling
    of assets in different markets in order to make a profit off of price differences.


    But `Victor` was no banker. And this arbitrage was not the type usually entertained
    by international financiers.


    With a loosely connected group of physicists and mathematicians, he wrote code
    that took advantage of the growing popularity of online sports betting websites.
    He wrote bots that continuously parsed the sports betting sites to find `arbs`—combinations
    of bets on different websites weighted in such a way that a positive return is
    guaranteed regardless of which side wins. The ultimate hedge. Their work was landmark
    but completely under the radar. His group of friends eventually broke up, and
    he turned his attention to cars.


    “So, let’s get back to the cars. Why are cars so much more complicated today?”
    the reporter asks.


    `Victor` speaks to what he knows of `GM` cars, and only the very basics. In the
    1980s and before, cars were almost entirely mechanical. Electronics, in the form
    of computers, were introduced as engine control modules (`ECMS`) in the 1990s.
    Following that, the addition of powertrain and transmission control modules.


    By 2006, `GM` had updated its on-board protocol, allowing for the proliferation
    of computers far beyond anything in the past, from two to fifteen or more: door-lock
    control, `ABS` computers, traction-control modules, and so on. After explaining
    the history of car computing, `Victor` has to remind the reporter once again that
    like most technologists, he’s focused on only one part—the `ECM`.


    `Victor` hates these questions. He only focuses on car performance, that’s it.
    Anything nefarious is going to happen in those other control modules, and could
    be achieved only by someone with the desire to figure out how to work on and spread
    a nefarious action laterally across the whole network. A microcosm of a big bank,
    with all its loosely tied together parts. He wants to get the reporter off the
    phone before he can be bothered more.


    People don’t realize, he says, that if they do so much as get bigger tires on
    their car, the computer will be thrown out of whack. The speedometer will show
    that they are going 50 miles per hour when they are really going 60. And isn’t
    that more dangerous on a regular basis, he says, than some hacker figuring out
    how to steal data from your infotainment system?


    He hangs up, vaguely dissatisfied, feeling that the reporter didn’t get the message.
    He gears up to go to work, out in the big, awful world today.


    ## 5.


    ## The Italians


    **It’s sunny but cool for** New York in late July 2014. There’s been a breach
    at `NOW Bank`. In the `SOC`, doors slam. Workers pull one another into empty conference
    rooms and whisper, looking both ways before closing the door. Eyes are wide as
    analysts share the gory details of what happened and how it happened, or how they
    think it happened.


    `Caroline` is trying to manage the chaos, but first she has to find `Bob Raykoff`.
    `Bob` is missing, and he is needed in a meeting up immediately. She sends word
    down to the second floor, where there are several conference rooms. He was supposed
    to make an appearance at a panel of chief investment officers but never showed.


    She asks the conference staff to have someone look out for a tall, gray-haired
    man walking with purpose in wide circles around the conference floor. Ask for
    `Mr. Raykoff`. Just tell him he has a call on the twelfth floor. `Caroline` presumes
    he can find his office from there.

    '
  trans: '

    “我们来看吧。你没法通过这个培训？”


    她走到他身后，接过了鼠标。这门培训的内容是关于安全专业人员的隐私义务。她点击了屏幕上正确的答案，五个红色的“X”消失了，培训模块继续进行。她露出了微笑，假装不知道自己所做的只是为问题提供了正确答案。真是一次意外的幸运运。


    “搞定了，”她说，转身准备离开房间。


    “等一下。呃，我真的忙得不可开交。”他转回办公桌，弄乱了一叠纸以装作姿态。“你能帮我把这个做了吗？”他顿了顿。“那个`Home Depot`的事太疯狂了，对吧？希望那是我们今年见过的最糟糕的事情。”


    她回到办公桌旁。看了一眼站在办公室外的同事。双方交换了某种利益。她开始不断点击正确答案，脸上带着一抹紧绷的微笑。


    “没问题。”


    **一个拥有俄罗斯血统、身材矮小且壮实的以色列人**，`Victor Tanninberg` 有各种理由无法胜任一份办公室工作。他鄙视权威。无法忍受与他人共事。讨厌回答问题。他拥有弦理论的博士学位，有时甚至懒得大声说出自己的想法；那比直接做要花时间得多。他不处理文书工作。


    于是 12 年前，他将自己的弦理论博士学位派上了用场，学习如何编程和调整 `GM` 汽车的电子控制单元。他有三辆车，全部经过了改装。一辆深蓝色的 `Corvette`
    和一辆装有 `Corvette` 引擎的黑色 `Crown Victoria`。`Crown Victoria` 装有推杆和警察聚光灯。还有一辆满是灰尘的旧
    `Chevy Lumina`，他让妹妹开到处转转。


    `Crown Vic` 是一头猛兽。它跑得极快，转弯如神，占据的空间远比应有的得多。这是他喜欢开着去纽瓦克 `Padraigh` 地方的车。当他开着 `Crown
    Vic` 时，人们往往会避开他，对此很感激。


    **在这些年来，他**目睹了运行这些车辆的网络激增并增长，其程度与支持 `NOW Bank` 的错综复杂、有时功能失调的网络相似。在 `Victor` 的情况下，这些网络被做得紧凑，并为每一辆
    `Malibu` 或 `Impala` 引入了难以置信的复杂性。


    这份工作在某些方面总是具有挑战性。这份工作大多数时候幸运地、谢天地让他与其他人保持联系。


    现在一个记者在骚扰他。他讨厌记者。那个记者正试图让他向解释汽车计算机是如何工作的，以及它们是如何被黑客攻击的。他仔细地先解释说自己不是黑客。然后他描述了汽车计算机多年来是如何变化变得更加脆弱的。她把
    `Victor` 当作是同时代表了有史存在过的每一个俄罗斯和以色列黑客。


    “你听过关于 `Home Depot` 这次泄露的什么吗？”她问。


    他犹豫了。“没有。从谁口中？”


    “从其他黑客那里？”


    “我不是黑客，我不认识其他黑客，”他说。尽管如此，考虑到他的信用卡问题，他怀疑这是否有关。


    `Victor` 在 21 世纪 00 年代的学术生涯之后认识了那个记者。那时，他从事套利交易。在传统银行业中，这是通过在不同市场买卖资产以从价差获利。


    但 `Victor` 并不是银行家。而且这种套利并不是国际金融家通常考虑的类型。


    他与一个松散的物理学家和数学家小组一起编写了代码，利用在线体育博彩网站日益流行的趋势。他编写了机器人持续解析体育博彩网站以寻找 `arbs`（套利机会）——即不同网站上的投注组合，通过加权计算，确保无论哪一方获胜都能获得正收益。这是终极对冲。他们的工作具有里程碑意义，但完全处于无人关注的状态。他的小组最终解散了，他转向了汽车。


    “所以让我们回到汽车上。为什么汽车变得这么复杂？”记者问。


    `Victor` 解释了他关于 `GM` 的了解，仅仅是最基础的部分。在 80 年代及以前，汽车几乎完全是机械的。电子设备以计算机的形式在 90 年代作为发动机控制模块（ECM）被引入。2006
    年，`GM` 更新了其车载协议，允许了远超过去的计算机模块出现：门锁控制、`ABS` 计算机、牵引力控制模块等等。在解释了汽车的历史后，`Victor` 不得不再次提醒记者，他只关注一部分——`ECM`。


    `Victor` 讨厌这些问题。他只关注汽车性能。任何恶意行为都会发生在其他控制模块中，并且只有那些想要在整个网络中横向传播的人才能实现。这是一个大银行的微缩模型，拥有所有松散连接的部分。


    人们没有意识到，他说，如果他们只是换了大轮胎，计算机就会乱套。速度表显示速度是 50 英里/小时，而实际上是 60 英里。而且这通常比某些黑客破解如何窃取你的娱乐系统数据更危险，不是吗？”


    他挂了电话，感到有些不满，觉得记者没有领会会。他准备去工作，回到这个巨大糟糕的世界。

    '
