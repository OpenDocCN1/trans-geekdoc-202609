- raw: 'The sun begins to thaw her out, though. By September 2016, she is more open.
    She leaves the house more often, starts to recognize the faces in her neighborhood,
    and even brings Henry down to the beach. It’s hard to find a job. Spain is in
    a recession. But she has enough to get by for a year if she absolutely has to.


    Every so often, the couple who own the house—Norah and Muhammad—leave her meals
    by the door, cookies; at Ramadan, whole servings of kebabs and salad and soup.
    On one of these occasions, they run into each other. She invites them onto the
    balcony for a conversation.


    They ask why she came to Spain. She tells them that she came here for the sun
    and the weather, that she and Henry were getting sick with allergies and colds
    back in Bucharest and she needed a change. She’s hoping to finish college, which
    she started back home. Hopes to find a job soon. Something in technology. She
    has a background in it, she tells them, but on the support side, she is not a
    technologist.


    “What company was it?” Muhammad asks.


    She hesitates, not having meant to let her guard down with anyone, and nervously
    blurts out, “TechSolu.”


    “I’ve never heard of it.” She feels some relief. “What kind of company?”


    “Ransomware. Mitigation,” she says, taking a sip of water. “I mostly did customer
    service, to be honest.”


    “Any project management? My brother works at Insite—have you heard of it? They
    have a technology office here.”


    René has heard of it. It is based in Silicon Valley and is one of the biggest
    technology companies in the world.


    “I think I know somebody there,” René says, the evening Malaga breeze making her
    a little careless. “But that was a long time ago.”


    “Well, if you want to put together a resume, I’ll send it to him. They’re desperate
    for project managers. And the ransomware thing—I’m sure they’ll be interested.
    Good place for moms to work—they love women!”


    Norah gives her husband a sideward glance, a hand motion to settle down.


    René hasn’t heard from Sig since the email he sent in March. She nods and smiles.
    “I will. I’ll do it right away.”


    **Caroline Chan and Charlie** Mack and Bob Raykoff and Joe the Kool-Aid Man and
    Carl Ramirez, who is still in Singapore, and Bo Chou, who is also in Singapore,
    and the reporter who is friends with Victor and everyone else who ever worked
    in cybersecurity at NOW Bank have been reading every last bit of information they
    can get their hands on about the Venice hackers now that an indictment has been
    issued.


    The FBI has been quiet about its progress, hasn’t spoken to anybody about what
    was happening. Then, suddenly, the indictments. Two Israelis, Yuval Dev and Ivan
    Misrachi; one Russian Israeli, Leonid Kravitz; and a money launderer named Tony
    Belvedere.


    The information they were stealing, the allegations maintain, was being used for
    a pump-and-dump scheme. For most of the people following the case, it’s the first
    time they’ve seen all of the details pulled together in one place, even though
    they were intimately involved in what happened.


    Two of the alleged conspirators are picked up in December 2016. The indictment
    outlines the numerous other banks, software companies, and newspapers that were
    hacked at the same time. The perpetrators had 100 million names to work with.


    The ringleader, Dev, used the information to contact his customers and try to
    offload certain stocks in an effort to manipulate the securities market.


    The trail goes well beyond the relatively simple, straightforward cybercrime that
    Caroline and her compatriots were fighting in the summer of 2014.


    *In particular, between approximately 2007 and July 2015, Dev owned and operated
    unlawful internet gambling businesses in the United States and abroad; owned and
    operated multinational payment processors for illegal pharmaceutical suppliers,
    counterfeit and malware distributors, and unlawful internet casinos; and owned
    and controlled Coin.mx, an illegal United States-based Bitcoin exchange that operated
    in violation of federal anti-money laundering laws*.


    Dev earned hundreds of millions this way. He concealed $100 million, at least,
    in Swiss banks and other places across the globe, within 75 shell companies, in
    brokerage accounts. He even stashed some of it in asset management accounts, maybe
    at NOW Bank. Dev and his compatriots used 200 different aliases and 30 false passports
    issued from 16 different countries.


    Dev bragged about his exploits, the government says. “We buy stocks very cheap,
    perform machinations, then play with them. Buying stocks in the U.S.—it’s like
    drinking freaking vodka in Russia.”


    **Dev would call and** lie to people whose personal information he’d stolen. Like
    Bo, Dev would lie about where the information came from and claim he got it from
    a publicly available “investors’ database.”


    In emails, Dev would discuss the low risk of law enforcement intervention. Like
    Valery Romanov before him, he wasn’t afraid of the authorities until he had a
    reason to be.


    “In Israel, you guys probably don’t have to be afraid of the USA, meaning that
    even if there is some case, they won’t be able to do anything?” Belvedere asked
    him in one exchange, to which Dev replied: “There is nothing to be afraid of in
    Israel.”


    Then the conspiracy hatched another type of scheme: market manipulation of a different
    sort—insider trading.


    “The top managers at NOW Bank, they have some interesting information in their
    email? Regarding working on the stock market, etcetera? It’s a big company, after
    all. Maybe they have some secrets. What do you think?” asked Leonid Kravitz.


    “Yes, this is a very cool idea,” Dev responded. “We need to think how we can do
    it.”


    ## **23.**


    ## The Reporter


    **Bo Chou clicks his tongue** repeatedly. A reporter who was introduced to him
    10 years ago at a convention in Shanghai asks him questions about the Dev indictment.


    How she’s managed to stay in touch with him for so long, he doesn’t know. But
    he does know she’s perpetually barking up the wrong tree. She reads back the names
    and the statements obtained by the Department of Justice. She wants to know what
    he thinks.


    “These people, they’re terrible,” he says. “Listen, do you know anyone at Google?
    I’m really interested in making some contacts there.”


    “If I knew anyone at Google, I wouldn’t be doing this job,” she says.


    “I really can’t help you,” Bo says. “Sorry. I don’t know anybody who has ever
    worked on one of these types of schemes, come on. I don’t know anything about
    insider trading. No, no, can’t help, sorry.”


    He hangs up. He’ll talk more to her later, when he’s not at work. Bo now lives
    in a world that is colorful, specifically Red, Amber, and Green. This RAG status,
    the term that defines how well a project is proceeding, is the ever-present code
    of the project manager. Red is bad; Amber is kind of bad; Green is good.


    But right now, he has a project that is in red status at the hedge fund where
    he works that he needs to clean up. His mom’s birthday is tomorrow, and he wants
    to get her a card before the stores close. His official title is project manager.
    His projects are insider threats. His job is to manage them.


    And he manages the shit out of them.


    **Dieter has not lost** track of Sig, but his activities have become tedious and
    a little sad. Sig’s business operation seems to have fallen apart. Things never
    panned out with the girl from Marrakesh.


    Surprisingly, Sig has suddenly lost interest in pursuing women. Now he is corresponding
    with other criminals about setting up a cryptomining operation.


    Cryptomining involves using, or stealing, the power generated by computers—which
    is the basis for cryptocurrencies like Bitcoin. In order to do this on a large
    scale, individuals put a relatively benign type of malware on computers belonging
    to other people. It involves no phone calls, no personal contact at all, and generates
    passive income while the criminal sleeps.


    *Passive aggressive. Suits Sig well*, Dieter thinks.'
