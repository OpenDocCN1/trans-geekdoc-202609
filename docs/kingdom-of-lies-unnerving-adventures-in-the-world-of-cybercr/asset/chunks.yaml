- raw: 'He had a house in Bali, one in Rome, one in Tokyo. That one sat directly across
    the Sea of Japan from his old single-room dirt pit and the bathtub where his mother
    drowned in Vladivostok. He had beautiful women. Fistsfuls of cash. He had a child
    with one woman, then another kid with a different woman. Their mothers are ungrateful
    but good at raising children. An adequate choice. The world is my bitch, *beginning
    at a time unknown*.


    *Tupac went to prison, too*, Valery thinks. He did around a year, and that was
    for a sex crime. Computer fraud isn’t nearly as bad. Valery hopes it won’t be
    that long for him. He’s made some notes for his lawyer. Government agents from
    four different three-letter organizations want to talk to him.


    He knows so much that the government would like to hear, he expects they’ll let
    him out in five minutes with a pat on the back and a nice fish dinner at one of
    Seattle’s finest restaurants. They’ll want to learn about the Israelis doing that
    pump-and-dump scheme. He can describe to them precisely how he laundered his money.
    Give up some people he can characterize as big shots but who are, in reality,
    nobodies.


    He has taught so many. Across Europe, Asia, the former Soviet states, America,
    too. He wasn’t just a carder, he didn’t just scam numbers, he was an *educator*.
    The people he instructed branched off, started their own operations, modified
    the code, and found their own niches to exploit. There are people who can modify
    the card-creating machines at banks, insiders who get jobs as restaurant servers
    to install malware on their busiest terminals. Swipe, swipe, swipe.


    One of his most lucrative operations was in gift cards. He and his contemporaries
    used stolen credit card numbers to buy reams of the cards, then used those cards
    to buy commodities that could be cashed out. Tires, iPhones, gold, it didn’t matter.
    They bought and bought and bought. The government will want to know who those
    people are, he imagines.


    Right now, he just wants to go back to Vladivostok and sit in a big room with
    a laptop warming his thighs and a very good internet connection. He is inside
    nothing now. He is outside. The analog world is strange and stupid. He hopes he
    won’t be out there for a whole fucking year. *No way he would get a whole year*,
    he thinks.


    Valery is right. He won’t get a year. He’ll get almost 30.


    **Back at NOW Bank,** Bob Raykoff is perched on an uncomfortable stool in a large
    conference room in New Jersey. He’s meeting his entire cybersecurity team for
    the first time. Caroline has just handed him the microphone.


    His title is chief information security officer. He has two bosses, the chief
    information officer, who is his boss on paper, and a chief security officer, who
    was the person who brought him into the bank—another Air Force vet named Edward
    Smitty. Smitty is fairly new himself. He is there today, standing next to Raykoff.
    It’s the first time many of the bank’s cybersecurity staff have met him, as well.


    “I have to say,” Raykoff says, halfway through his speech, “I wanted to do this
    job for one reason. I wanted to protect the people of this country, of the United
    States of America, and their money, their treasure. That’s their treasure, the
    people of this country, and I take that job very seriously, and I think it’s a
    very honorable job to protect those customers.”


    The speech does not go over well. About a quarter of the people in the room are
    from London, where they oversee investments from European nations. The bank in
    London has no operations that involve deposits from individuals, and those workers
    have no American customers. There are a few people from Singapore who had dialed
    in by video conference. One of them looks puzzled and texts his colleague in New
    York an earnest message:


    Is NOW Bank pulling out of Asia??? :-0


    **This is a problem.** As I write this in 2018, at the time of the action in the
    book, and before then, too. Global corporations serve masters in many different
    countries. Militaries serve masters in one country. Corporations are loyal to
    their clients and shareholders. Militaries are loyal to their citizens. Corporations
    must bow to the rules of the jurisdictions where they want to operate. Militaries
    have strict protocols about showing deference to other nations.


    Over the course of the past three decades, the digital battleground has shifted
    to take advantage of the muddy boundaries between these two factions.


    Early in the history of hacking, government agencies enjoyed the relative simplicity
    of a unilateral back-and-forth—countries tried to hack them, and they tried to
    hack those countries back.


    But corporations, with their complex international ties and information that proved
    to be just as valuable as the information being cached by governments, became
    much more interesting battlegrounds.


    In many ways, the private sector has always been an easier environment to exploit.
    Surveillance and theft, if done quietly, fly under the radar. Executives don’t
    care if someone takes your money, if they even know, and if they do know, who
    would they tell and why? What does it get them? They are happy to be kept in the
    dark.


    NOW Bank has major operations in China and Russia. The U.S. government wants banks
    to share information about nation-state attacks they receive from these countries.
    But NOW Bank must do business there. How does it reconcile this discrepancy?


    When companies realized they were under a direct threat from nation-states, they
    woke up, but only slightly. They invited in, as NOW Bank did, as many military
    people as they could get their hands on, thinking that those sources could offer
    some valuable insights that didn’t exist in the private sector.


    They were right in one regard. Few bankers have the ability to offer up valuable
    military battle strategies. Their values are tied up in making money, not in military
    machinations.


    And they were right in another regard: Military veterans make excellent cybersecurity
    employees, because they understand security so well. They are disciplined. They
    have insights into perimeter security and intelligence that traditional technologists
    usually do not.


    But bringing in a lot of military brass introduced a great deal of unforeseen
    conflict, primarily because the criteria for rising to a top military position
    are not the same as climbing the corporate ranks. There are plenty of ex-military
    folks working in cybersecurity who have impressive skill sets, but they typically
    didn’t come from the upper echelon.


    Then there are the charlatans. Steeped in jargon and tough talk, with little discernible
    real-world knowledge or experience to back it up, they quickly make a mess of
    things. In the hierarchal haven of the military, these individuals do just fine.
    They have countless staffers to prop them up and carry them through, to do research,
    to write detailed plans, to get coffee and run the printer. But these kinds of
    people don’t flourish in corporations, and most certainly not in cost centers.


    Absent all those extra staffers, the charlatans often find themselves revealed
    in sharp relief. Like a pilot flying with no pants who suddenly has to eject.


    ## **3.**


    ## The Wall


    **The customer service rep on** the other end of the line can’t be more than 20
    years old, and she’s clearly reading from a script. But Victor Tanninberg’s brain
    doesn’t process information in that way.


    “I’m never shopping at Home Depot again. These people, their arms grow out of
    their asses. You know, I just needed a fucking area rug for my fucking living
    room and now I’m going to have to spend the next fucking week waiting for a new
    credit card, Jesus fucking Christ.”


    It’s now close to the end of July 2014.


    “Sir, as I mentioned, we’re sorry for the inconvenience. We can expedite the new
    card. Unfortunately, there are many ways criminals can fraudulently obtain credit
    card numbers.”


    Victor weighs the pros and cons of continuing the argument with the NOW Bank customer
    service rep.'
