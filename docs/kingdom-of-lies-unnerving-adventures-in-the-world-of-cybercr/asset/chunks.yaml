- raw: 'He creates a meager website describing the company as an IT security service
    provider and leaves it at that. He manages to hire 10 new employees, all men—boys
    really—two of them from Poland, one from Russia, the rest from Romania. It is
    good to have a little diversity, he jokes to his new colleagues, referring to
    the Poles.


    But Sig wants a woman in the office, too. Women keep everyone calm. Things get
    weird in an office with all men. People steal things. They fight, say racist things.
    They talk about sex too much, and if they’re not talking about it, they’re thinking
    about it. They steal intellectual property. Adding at least one woman creates
    a civil dance. It’s not a perfect solution, but it is a form of risk mitigation.


    They have been piecing together ransomware, bought from a variety of kits available
    on the dark web. It works well.


    At the beginning, it was just Sig and the Russian, whose name is Mikael Gunther.
    Before coming to TechSolu, he had been fiercely independent. He had partnered
    with a Chinese hacker who was also inclined to solitude.


    Together they ransomed grandmothers for their grandkids’ photos, locking them
    up and asking for $50 or $100 to unlock them with the proper code. The grandmas
    never suspected what was happening was even a crime, as Gunther made it appear
    to be some sort of exploitative part of the Windows operating system. They are
    ethical—they asked the grandmas for their credit card numbers but didn’t steal
    the numbers, only took the ransom payment. That’s what Sig likes about Gunther.
    He is an ethical criminal, someone he can trust, at least a little bit.


    Gunther reengineered the exploit kit and ultimately sold it on the dark web, cutting
    out his Chinese partner. He made more money selling the kit to other would-be
    ransomers than he would doing the ransoming himself. Gunther’s toolkit was exceptional.
    That’s how Sig found him.


    They build a more enterprise-worthy version of Gunther’s model, and that helps
    jump-start their business through trial and error on small law firms with lucrative
    clients. It is a relief to Gunther, who finds working with contacts in China to
    be exhausting.


    Chinese, Gunther tells Sig, prefer a smash-and-grab way of doing things. It is
    antithetical to the Russian approach to hacking, which must always involve some
    level of stealth. It’s just no fun without the intrigue, he says.


    To illustrate this, Gunther talks disparagingly of his Chinese former colleague,
    who eventually changed his model to a pay-to-play arrangement. The last he’d heard,
    the partner had tried to get a job consulting with American companies concerned
    about security at their Asian branches. Gunther scoffs at this. “Sellout,” he
    says.


    Gunther helps Sig bring in other people from his network. Some come to sit with
    them in Arnica Valka, while others work remotely. The village itself is slowly
    becoming a destination for criminal hackers. There are many such pockets throughout
    Eastern Europe, but how many could boast the scenic countryside of Transylvania?
    A steady stream of curious specialists keep turning up in Arnica Valka. But only
    a handful of the townies seem to grasp what is going on.


    **With his first 10** employees, Sig puts the focus on targeting law firms and
    consulting firms. The reconnaissance on these is almost scandalously easy. Law
    firms in particular like to brag about their acquisition of new celebrity clients
    or their representation of large companies in a merger or acquisition. They send
    out a press release, swell with pride about it all over LinkedIn, write a pitch
    article about it for some trade magazine. Press releases provide the information
    necessary for the easiest and most obvious lures.


    Gunther and the team at TechSolu find the firms quickly. In a typical ransomware
    pass, they execute a well-crafted email that appears to be a congratulatory note
    to one attorney from a colleague at another firm, based on whatever news was posted.


    The note includes a link that, when clicked, allows TechSolu to deploy ransomware
    onto the machines of the law firm partners, locking them up. Then a frightening-looking
    green screen appears telling the attorneys that to get back access to their files,
    they need to pay a ransom of $500 to $5,000, depending on what the law firm can
    likely afford. That number is based on TechSolu’s intelligence gathering.


    Rival ransomers are sending out scattershot emails. Rivals aren’t always unlocking
    the files after collecting the ransom.


    But Sig knows the importance of building up a rock-solid reputation for reliability.
    This is a start-up, after all. He wants TechSolu to become known among victimized
    companies as an honest criminal organization, one that their insurance companies
    will be comfortable with.


    This is especially important because now some insurance policies are starting
    to reimburse law firms for the ransom. If the insurance company is assured that
    the firm will get its files back in exchange for the ransom payment, they will
    approve it. And they do, and Sig and his compatriots get paid. And paid well.
    As their reputation for honesty in these transactions grows, so does their ability
    to collect higher amounts.


    He still needs to find a woman.


    Most of their victims require a great deal of convincing to pay up, and the lousy
    green screen with its dire warnings doesn’t always do the trick. And nobody in
    the office speaks English as well as Sig. Sometimes the victims need to ask simple
    questions: “How do I set up a Bitcoin wallet?” Or “Are you able to read the files
    that you stole?”


    Sig’s answer to the last question differs, depending on the company. Because some
    of these law firms have more interesting information than others. Future mergers.
    Pending bankruptcies. The answer is always “yes,” but usually he tells them “no”
    just to keep the transaction moving and pockets the valuable information for later.


    Truthfully, Sig hates answering questions. He recognizes that a throwaway phone
    line with a dedicated customer service representative will go a long way in getting
    more payments through and increasing the organization’s cachet among victims.


    Not victims. Clients. “Clients” sounds much better.


    There is another angle. A third TechSolu employee, Jakub Brik, stands out as the
    only African in the bunch, Polish only by way of Nigeria. He has become quite
    good at consulting. For the very small businesses, he is able to talk them through
    the process that will ensure they don’t suffer another ransomware attack.


    These small businesses often pay up gratefully at the end of the conversation.
    Jakub’s consulting is further legitimizing the business, perhaps even enough so
    that Sig can hire somebody wholly legitimate. One of the pretty waitresses from
    the restaurant downtown, maybe.


    **Caroline hired Charlie Mack.** Although he’s a lawyer and was technically brought
    on by NOW Bank’s legal department, it was her connections who got the ex–CIA officer
    and Harvard lawyer into the bank to oversee all of their cybersecurity troubles
    from a legal point of view.


    What Caroline knows and a few select others suspect is that Charlie Mack is a
    goddamn hero. He’s a corporate lawyer now, sure, but he’s a legend and a bona
    fide hero. He never brings it up. Just thinks about it sometimes when some executive
    tries throwing a bad lawyer joke at him. *Listen to me, asshole, I’m trying to
    protect you from yourself. I was raiding Gaddafi’s compound just last year. Do
    you think I’m being overly fucking careful?*


    It is helpful to have a guy like Charlie around for crises, and Venice is going
    to be a big one.'
