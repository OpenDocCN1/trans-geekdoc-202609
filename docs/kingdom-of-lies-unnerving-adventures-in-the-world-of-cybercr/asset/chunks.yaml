- raw: 'Still, Bo is glad to have moved on from that life. The indictments of Chinese
    and Israeli and Russian hackers remind him of the terrible end he may have had.


    Bo is quietly dating someone. A trader from India. Very quietly, since same-sex
    relationships carry various legal penalties in Singapore. It is the only part
    of his life in which he regularly flaunts the law. Still, it is a quiet life.
    Just like his mother had always wanted for him.


    He almost never thinks about his old life anymore. Blown off to a faraway desert,
    scattered for all time.


    ## **19.**


    ## The Long Trip


    **It’s a rare night out** for Charlie Mack. He’s one finger into a large glass
    of scotch as he contemplates a *New York Times* article about the 2012 terrorist
    attacks on a CIA compound in Benghazi, Libya.


    “Is this true? How about this?” The Midtown bar looks like a law library by the
    light of the iPhone his companion holds up for him to see.


    “Sure,” he says with a shrug. “It’s plausible.”


    Not yes or no, but plausible.


    **“I left right before** it happened,” he reminds them when they push for details.


    “Did you take any time off in between?” one of his colleagues asks.


    “No.” Sip. Silence.


    For years, he traveled the world, performing an extremely dangerous job. It was,
    somehow at the same time, a fantasy that could only be dreamed up by a particularly
    creative schoolboy. He gambled in Monaco on the company dime. Helped liberate
    firearms from Gaddafi’s compound after the 2011 coup.


    There are many people in the cybersecurity field who cross over, from the bad
    guy timeline to the good guy timeline. There are some who stay firmly in one timeline
    or the other. Charlie Mack is in the middle of a long, arduous trip on the good
    guy timeline, whether he likes it or not.


    He shows off pictures of himself, which he’s saved on his own iPhone, in fatigues,
    sporting a beard and a weed-wacker haircut, holding two enormous guns, which he
    says were taken off Gaddafi when he was captured. In another photograph, an African
    militant is presenting him with a sword, a gift of some kind. For what, Charlie
    won’t say.


    “It must be incredibly jarring to go from that to this,” his colleagues say, fishing
    for more details. North African intrigue to a bank lawyer and dad. From canvas
    fatigues to wool crepe.


    Charlie puts the iPhone away. His companions put their phones away, too. Sip.


    “Thought it was time to finally make use of my law degree.” He doesn’t say he
    earned his degree at Harvard. He doesn’t need to.


    One of his drinking companions, a veteran of NOW Bank, recalls Charlie’s first
    day at work. Charlie was introduced to a big group of cybersecurity executives
    as a former employee of the CIA. There was silence and tension in the room. Then
    one executive shouted out: “Culinary Institute of America?”


    Laughs all around. Then and now.


    Someone asks again when, exactly, he started at NOW Bank. Someone else asks about
    the military. Something happens, nobody is sure what, but before Charlie is able
    to answer they are talking about something else. The Vatican. Then Donald Trump.
    Then Bob Raykoff.


    Because Charlie has distracted them. It’s something he is exceedingly good at.
    Whenever the camera focuses on him, he bumps it away with a flick of his wrist,
    aiming its lens at someone else. Maybe even someone who isn’t there.


    Raykoff, for example.


    They share stories about the executive and some of his most frustrating moments.
    They laugh. They get loud.


    Then the conversation turns a fourth time, to a scandal making headlines: the
    saga of a well-known security software maker called Achinsk Antivirus, which is
    based in Minsk. The company is highly rated, supplying one of the best-reviewed
    antivirus products in the world.


    Achinsk’s software is in millions of companies and on hundreds of government servers.
    The company has a free product used by a significant number of small law firms,
    independent workers, and startup tech companies. The company is suspected of providing
    a back door to hundreds of organizations to be used by the Russian government,
    something Achinsk continues to deny as it pushes its free products more fervently
    than ever.


    Charlie Mack appears resigned to this reality, but the rest of the group is aghast.
    One by one, they recount companies and government agencies they’ve worked for
    that have used Achinsk software. They remember how deeply embedded it was into
    sensitive systems. They sober up a little, quiet down, as they come to the same
    grim conclusion that all security professionals do: we’re fundamentally compromised
    down to the very bones of every single one of our computers. What this means,
    really, for the cybersecurity profession itself is not something that will be
    solved tonight by a handful of drunk, 30-something bankers.


    Charlie shifts the conversation again. He asks about Caroline. He is genuinely
    sad. Since she left NOW Bank, he hasn’t had a chance to see her.


    The conversation continues without him. While they talk, he reaches for *The New
    York Times* and glances at the article on Benghazi.


    Sip.


    **René is preparing to** leave TechSolu. Sig instructs her to get a sandwich at
    Cafe Americain and take a taxi home. Detours along his suggested route might be
    dangerous, but she will make just one.


    René walks down the stairs to the cafe. Henry is on her chest, sleeping contentedly.
    She buys two yogurts and two prepackaged fruit smoothies. They will be good for
    the train ride, and easy to carry.


    She asks the teller for two bags and she splits up the food.


    She walks out of Cafe Americain, stops in front of the store. She slightly loosens
    the strap on her carrier. Henry shifts and she catches him, dropping her cell
    phone on the ground, breaking it. “How clumsy of me,” she says.


    She ducks into the technology store next door. Points to a burner phone on the
    wall. Shows the cashier her broken phone. Plausible deniability if Sig happens
    to find out.


    She hails a taxi and heads home. Her head is whirring, but it spins in only one
    direction.


    Out.


    **René plans to go** to Germany on an EU passport she got while in college. She
    knows Sig won’t go back to Germany because of some legal trouble he’s been in
    there.


    At home, she packs Henry’s diaper bag and the two bags from Cafe Americain. One
    will serve as her purse, the other for the food. The diaper bag holds four outfits
    for Henry, one extra for her. She will put on two layers of clothes, so three
    outfits total. The $1,000 she has folded into a roll and put inside a tampon box.


    René will breastfeed Henry to get him milk-drunk and tired, so he will sleep through
    these last few moments in Romania.


    **Sig arrives home earlier** than expected, drunk. To her surprise, he tells her
    he is going back out for the evening. Investors from Vladivostok are in town.


    He changes his clothes into something nicer looking. René busies herself around
    the house and keeps her head down.


    “That’s right, don’t look at me,” he mumbles on his way out, slamming the door
    behind him.


    It is 9 p.m. She knows he will be gone the rest of the night.


    She lines up everything she’s prepared. The diaper bag, the two Cafe Americain
    bags, Henry’s carrier. This is all she needs. Using the burner smartphone, she
    calls a local taxi service. One Sig never uses. Gives the neighbor’s address.


    She gathers Henry up into the carrier, puts on one of Sig’s jackets, and tucks
    her hair up under the hood. The car arrives. She picks up her bags and leaves.


    **René sidesteps through the** darkness and over a small fence, to make it appear
    as if she is coming from her neighbor’s house.


    There is no night train from Arnica Valka. So she asks the driver to take her
    all the way to Bucharest, a 2-hour, 30-minute drive that will cost $120. Her mother
    is ill, she tells him. It’s an emergency. He asks her a few questions. She says
    she is tired and wants to sleep. He leaves her in peace. She is grateful for this.'
  fmt: '

    Still, Bo is glad to have moved on from that life. The indictments of Chinese
    and Israeli and Russian hackers remind him of the terrible end he may have had.


    Bo is quietly dating someone. A trader from India. Very quietly, since same-sex
    relationships carry various legal penalties in Singapore. It is the only part
    of his life in which he regularly flaunts the law. Still, it is a quiet life.
    Just like his mother had always wanted for him.


    He almost never thinks about his old life anymore. Blown off to a faraway desert,
    scattered for all time.


    # 19.


    ## The Long Trip


    It’s a rare night out for Charlie Mack. He’s one finger into a large glass of
    scotch as he contemplates a `New York Times` article about the 2012 terrorist
    attacks on a CIA compound in Benghazi, Libya.


    “Is this true? How about this?” The Midtown bar looks like a law library by the
    light of the `iPhone` his companion holds up for him to see.


    “Sure,” he says with a shrug. “It’s plausible.”


    Not yes or no, but plausible.


    “I left right before it happened,” he reminds them when they push for details.


    “Did you take any time off in between?” one of his colleagues asks.


    “No.” Sip. Silence.


    For years, he traveled the world, performing an extremely dangerous job. It was,
    somehow at the same time, a fantasy that could only be dreamed up by a particularly
    creative schoolboy. He gambled in Monaco on the company dime. Helped liberate
    firearms from Gaddafi’s compound after the 2011 coup.


    There are many people in the cybersecurity field who cross over, from the bad
    guy timeline to the good guy timeline. There are some who stay firmly in one timeline
    or the other. Charlie Mack is in the middle of a long, arduous trip on the good
    guy timeline, whether he likes it or not.


    He shows off pictures of himself, which he’s saved on his own `iPhone`, in fatigues,
    sporting a beard and a weed-wacker haircut, holding two enormous guns, which he
    says were taken off Gaddafi when he was captured. In another photograph, an African
    militant is presenting him with a sword, a gift of some kind. For what, Charlie
    won’t say.


    “It must be incredibly jarring to go from that to this,” his colleagues say, fishing
    for more details. North African intrigue to a bank lawyer and dad. From canvas
    fatigues to wool crepe.


    Charlie puts the `iPhone` away. His companions put their phones away, too. Sip.


    “Thought it was time to finally make use of my law degree.” He doesn’t say he
    earned his degree at Harvard. He doesn’t need to.


    One of his drinking companions, a veteran of `NOW Bank`, recalls Charlie’s first
    day at work. Charlie was introduced to a big group of cybersecurity executives
    as a former employee of the CIA. There was silence and tension in the room. Then
    one executive shouted out: “Culinary Institute of America?”


    Laughs all around. Then and now.


    Someone asks again when, exactly, he started at `NOW Bank`. Someone else asks
    about the military. Something happens, nobody is sure what, but before Charlie
    is able to answer they are talking about something else. The Vatican. Then Donald
    Trump. Then Bob Raykoff.


    Because Charlie has distracted them. It’s something he is exceedingly good at.
    Whenever the camera focuses on him, he bumps it away with a flick of his wrist,
    aiming its lens at someone else. Maybe even someone who isn’t there.


    Raykoff, for example.


    They share stories about the executive and some of his most frustrating moments.
    They laugh. They get loud.


    Then the conversation turns a fourth time, to a scandal making headlines: the
    saga of a well-known security software maker called `Achinsk Antivirus`, which
    is based in Minsk. The company is highly rated, supplying one of the best-reviewed
    antivirus products in the world.


    `Achinsk`’s software is in millions of companies and on hundreds of government
    servers. The company has a free product used by a significant number of small
    law firms, independent workers, and startup tech companies. The company is suspected
    of providing a back door to hundreds of organizations to be used by the Russian
    government, something `Achinsk` continues to deny as it pushes its free products
    more fervently than ever.


    Charlie Mack appears resigned to this reality, but the rest of the group is aghast.
    One by one, they recount companies and government agencies they’ve worked for
    that have used `Achinsk` software. They remember how deeply embedded it was into
    sensitive systems. They sober up a little, quiet down, as they come to the same
    grim conclusion that all security professionals do: we’re fundamentally compromised
    down to the very bones of every single one of our computers. What this means,
    really, for the cybersecurity profession itself is not something that will be
    solved tonight by a handful of drunk, 30-something bankers.


    Charlie shifts the conversation again. He asks about Caroline. He is genuinely
    sad. Since she left `NOW Bank`, he hasn’t had a chance to see her.


    The conversation continues without him. While they talk, he reaches for `The New
    York Times` and glances at the article on Benghazi.


    Sip.


    René is preparing to leave `TechSolu`. Sig instructs her to get a sandwich at
    `Cafe Americain` and take a taxi home. Detours along his suggested route might
    be dangerous, but she will make just one.


    René walks down the stairs to the cafe. Henry is on her chest, sleeping contentedly.
    She buys two yogurts and two prepackaged fruit smoothies. They will be good for
    the train ride, and easy to carry.


    She asks the teller for two bags and she splits up the food.


    She walks out of `Cafe Americain`, stops in front of the store. She gathers Henry
    up into the carrier, puts on one of Sig’s jackets, and tucks her hair up under
    the hood. The car arrives. She picks up her bags and leaves.


    René sidesteps through the darkness and over a small fence, to make it appear
    as if she is coming from her neighbor’s house.


    There is no night train from Arnica Valka. So she asks the driver to take her
    all the way to Bucharest, a 2-hour, 30-minute drive that will cost $120. Her mother
    is ill, she tells him. It’s an emergency. He asks her a few questions. She says
    she is tired and wants to sleep. He leaves her in peace. She is grateful for this.

