  trans: "\n\n# 谎之王国\n\n## 谎之王国\n\n网络犯罪世界中的惊悚冒险\n\n凯特·法西尼 (KATE FAZZINI)\n\n![image](img/img_pub.jpg)\n\
    \n*献给诺亚和扎拉*\n\n*我的这类作品，这种无需武器就能完成的作品，\n是最不高尚的。它充满了巫师、被遗弃者、\n笨拙者、视而不见者、笨手脚、无神论的结口者、\n\
    祈祷结结者、胀气者、密室哭泣者、\n以及骗子。我是其中之一。在一月，在这个猫头鹰筑巢的月份，我是一个见证者，也完全是一个微小的存在。忘恩之王国。谎之王国。你竟敢之王国。*\n\
    \n— 露西·布洛克-布鲁多\n\n## 目录\n\n- **序言：燕子**\n  *在这里我们将介绍一些为本书书奠定基础的里程碑式事件。*\n- **前言：谎之王国**\n\
    \  *在这里我们将了解到在旅程中将会遇到的各种谎言。*\n- **第一章 未来的威胁**\n  *我们回首了书中某些制造网络威胁的人及其对立面早期的经历。*\n\
    - **第二章 骗子**\n  *在这里我们了解到，针对金融部门的一次重大网络攻击的结果是，由于资金紧张的网络安全高管们看到了预算的增加。但即使是一场招聘热潮也有其负面影响。*\n\
    - **第三章 墙**\n  *在这里我们遇到了一些攻击金融部门的罪犯分子，并见证了大型组织在尝试应对时所面临的艰苦战斗。*\n- **第四章 婴儿**\n\
    \  *在这里我们思考了俄罗斯等国家采取的长期策略——通过默许网络犯罪来换取犯罪分子的信息和专业知识——可能会结出怎样奇异的果实。*\n- **第五章 意大利人**\n\
    \  *我们开始看到没有物理边界的网络犯罪世界，以及媒体对网络事件的误解，如何影响并误导了我们对网络犯罪的认知。*\n- **第六章 零工经济**\n  *我们遇到了更多的黑客，并看到一些人如何成功地将他们的网络犯罪专长转化为合法。尽管许多人发现很难放下过去的生活。*\n\
    - **第七章 试用**\n  *我们了解到银行和民族国家如何制定策略来捕获从纽约到中国及其他地区最优秀的优秀黑客。*\n- **第八章 父亲**\n  *我们看到黑客如何在生活的痛苦中挣扎，包括为人父母、死亡，甚至他们自己也被黑客攻击。*\n\
    - **第九章 少年**\n  *在罗马尼亚，我们目睹了一名女大学生进行了一场愚蠢的青少年赌博，并带有反转。*\n- **第十章章 媒介**\n  *我们发现了情报工作、外国影响活动之间漫长的历史联系，以及动能虚假信息是如何数字化的。*\n\
    - **第十一章 爱人**\n  *再次回到特兰西瓦尼亚的乡村，我们发现对于一个在一个小镇上并在网络犯罪地下世界深陷泥潭的青少年来说，可能已经太晚了。*\n\
    - **第十二章章 研究员**\n  *我们遇到了一位受雇佣的黑客，他是好人之一，他正从赫尔辛基到布加勒斯特追踪一个引人入胜的线索。*\n- **第十三章\
    \ 志愿者**\n  *当他们的政府上门时，罪犯并不总是自愿提供自己和他们的技能——这产生了一个有趣的冲突。*\n- **第十四章 母亲**\n  *即使是黑客有时也必须向世界上最强大的力量之一交待：妈妈。*\n\
    - **第十五章章 幽灵**\n  *即使是黑客有时必须向世界上最强大的力量之一交待：妈妈。*\n- **第十六章章 招募者**\n  *即使是黑客有时必须向世界上最强大的力量之一交待：妈妈。*\n\
    - **第十七章章 内部人员**\n  *即使是黑客有时必须向世界上最强大的力量之一交待：妈妈。*\n- **第十八章章 恐怖分子**\n  *即使是黑客有时必须向世界上最强大的力量之一交待：妈妈。*\n\
    - **第十九章章 长途**\n  *即使是黑客有时必须向世界上最强大的力量之一交待：妈妈。*\n- **第二十章章 原因**\n  *即使是黑客有时必须向世界上最强大的力量之一交待：妈妈。*\n\
    - **第二十一章章 西班牙人**\n  *即使是黑客有时必须向世界上最强大的力量之一交待：妈妈。*\n- **第二十二章章 项目经理**\n  *即使是黑客有时必须向世界上最强大的力量之一交待：妈妈。*\n\
    - **第二十三章章 记者**\n  *即使是黑客有时必须向世界上最强大的力量之一交待：妈妈。*\n- **结语：我们没有点燃火**\n- **附录 A：网络术语表\n\
    - **附录 B：结语说明\n- **参考文献\n- **作者注**\n- **致谢\n- **索引\n\n## 序言：燕子\n\n在这里我们将介绍一些为本书奠定基础的里程碑式事件。\n\
    \n**雷内·克鲁伊茨（René Kreutz）只有 15 岁**，但她正在罗马尼亚一个中型城镇的俱乐部里喝酒跳舞。\n\n"
