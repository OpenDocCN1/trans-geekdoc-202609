- raw: 'He begins listing all the cybersecurity staffers he is hoping to hire, a job
    he is tasking her with. The people he is naming will replace some of her most
    precious, most loyal dragons. People she loves like her own family. The godparents
    of her children. Some attended her wedding. She cried with them when their children
    were born and, in some cases, when their children died.


    He never looks at her. He keeps his eyes set on a space on the wall far above
    her forehead.


    He asks her if she knows the best route to get to the Newark airport.


    She is taking notes. She’s written the name “Bob Raykoff” in black as the header.
    She clicks the black part of her four-color pen closed. Clicks open the red part.
    Draws a neat red line through his name.


    “Yes, sir,” Caroline says with a smile. “I’ll go print off a map for you.”


    On her way out, Caroline stops by the operations center, where she’s greeted cheerfully
    by some of her colleagues. She gives out a round of hugs. They want to know how
    the meeting went. She tells them it was fine. No one says another word. They don’t
    have to.


    Raykoff doesn’t know it and he never will, but his career at NOW Bank is over.
    It ended during the first hour of his first meeting with the mother of so many
    hackers.


    It will be a very fast, then a very slow demise.


    **It is 5:15 a.m.** in Vladivostok, Russian Federation, and still the previous
    day elsewhere—3:15 p.m. in Orlando, Florida, and 12:15 p.m. in Seattle, Washington,
    and 9:15 p.m. in Tel Aviv, Israel.


    Tony Belvedere is at the Orlando International Airport. He waits quietly in a
    long line of tired, sweaty families. The air conditioner blasts. He contemplates
    a giant gumball machine the size of a minivan. It has an intricate trail and takes
    minutes to spit out each individual piece of candy. Two boys keep pumping quarters
    into it. Tony understands. It’s mesmerizing to watch.


    He’s on his way to Newark. Once he reaches his destination, Tony plans to drive
    out to a dump of an abandoned suburb of the city, a subsection of a neighborhood
    called Orange, and set up a fake bank. It’s the fifth time he’s done this.


    He’ll set up the fake bank inside the Clarksburg Federal Credit Union, a nearly
    defunct institution for low-income residents of Orange. For the modest sum of
    $100,000, he will bribe the credit union’s board of directors to allow him and
    his cohorts to take it over.


    He will pay in cash with the proceeds of the members-only sports memorabilia collectors
    group that he owns. Tony hates sports but loves money. That company, Fantastical
    Autographs, is a front that launders money for cybercriminals in Vladivostok and
    Tel Aviv. Using Bitcoin converted into cash, the dirty money gets filtered into
    phony sports memorabilia investments, then cashed out and cleaned up through a
    network of both real and phony banks.


    Tony’s not flying with the $100,000 in cash. That would be gauche. It’s in a business
    account held by Fantastical Autographs at a NOW Bank branch in Midtown Manhattan,
    just 11 floors below where Caroline Chan sits in a conference room, sadly contemplating
    what she will do next in her career.


    Tony’s associates in Tel Aviv, Moscow, and Vladivostok have also hacked into NOW
    Bank. They prowl the bank’s networks, looking around, taking information from
    the bank’s asset management organization about people who may be susceptible to
    a pump-and-dump scheme. This type of scheme will involve calling those individuals
    who, based on their data, appear rich and possibly vulnerable enough to hit with
    a sales pitch for penny stocks. Once their orders drive up the price of the stocks,
    of which the criminals hold the majority, they will “dump” the worthless investments
    and pocket a significant profit.


    They take just enough information, not too much to trip any alarms, not enough
    to ping the sensitive radars of the bank’s many sophisticated cybersecurity tools.
    Just enough. Little by little. They drill these folks with penny stocks, then
    reap the proceeds. Drip, drip, drip.


    They’ve made close to $100 million doing this. Some of that money will be flowing
    through the credit union by the end of the month; some of it will make its way
    back through NOW Bank. Some of it will be used to buy baseballs with forged Pete
    Rose signatures for outrageous prices. None of it will be in any given place at
    any given time.


    It’s some kind of god-awful hour in Tel Aviv, but his associates there are awake
    and texting him secure, disappearing messages on a smartphone application called
    Wickr. They want to know the status of the bank setup in Orange. They have too
    much money; they need to dump it now. They don’t state this exactly, of course,
    but Tony gets the gist.


    They are not just in NOW Bank. They’re in some smaller banks, as well. They’ve
    also hacked a consulting firm, an accounting giant. They’re even in *The Wall
    Street Journal*. All with the same goal—finding people with too much money and
    not enough street smarts. Thankfully for Tony and his cohorts, there are a lot
    of people who fit that description.


    **At a place like** NOW Bank, it’s easy for hackers to narrow the target pool.
    The bank does the work for them by cordoning off the rich and older customers
    from the hoi polloi.


    NOW Bank has five primary lines of business: retail banking, investment banking,
    commercial banking, asset management, and the core corporation itself, which is
    where all the lawyers, human resource people, and technology staff are housed.


    The retail bank oversees all of the bank branches, its brick-and-mortar presence.
    This includes the mortgage lending business, car loans, personal loans, small
    business banking, private banking, and wealth management.


    Those last two might be of some interest to the Israelis. The highest tier of
    individuals served by the retail bank are people who have at least $50 million
    in assets but less than $100 million. Not *that* rich. But good targets for one-off
    schemes. The retail bank is a great target if they are going after credit card
    numbers and checking accounts, but they’re not.


    Then there’s the commercial bank. It’s a slightly better target because there
    are some big transfers going back and forth. This makes for lots of reconnaissance
    opportunities for other types of operations. Specifically, it’s perfect for getting
    enough information to execute man-in-the-middle attacks.


    In these types of schemes, the bad guys get as much information about a company’s
    CEO as possible. They’ll pretend to be him—digitally anyway—and convince his lawyer
    or his secretary to wire money to an offshore account, feigning urgency on an
    unpaid invoice. Some of these scams make upward of $10 million at a time.


    And then there’s the investment bank. A treasure trove of embarrassments, especially
    when plumbing the emails of male traders who just *cannot* keep it in their pants.


    These guys have been dreaming of the day that they can have a big swinging dick
    just as described in *Liar’s Poker*. Those days are long gone, but even the 20-year-old
    upstarts don’t realize it. They don’t even work on Wall Street. They work on Park
    Avenue or in Brooklyn. There are 16-year-old Russians turning more profit than
    they do, and without taxes. These bankers put so much information about what they’re
    doing in email and text messages. Who’s acquiring whom, what analysts will say
    in their next series of letters recommending certain stocks. They store valuable
    algorithms, business plans, instructions on how to execute high-speed trades,
    and they do it carelessly. Hubris.


    Then there’s asset management. Nobody’s allowed in without $250 million or more
    in wealth. This is the sweet spot for a pump-and-dump operation. But it’s smaller
    and more prestigious and, for that reason, harder to get to. That’s a lot of money
    and reputation at stake, and banks have traditionally been better at protecting
    these clients.


    At NOW Bank, as in most large banks, the asset management organization is run
    by a *personality*: Lydia DeBuffet.'
