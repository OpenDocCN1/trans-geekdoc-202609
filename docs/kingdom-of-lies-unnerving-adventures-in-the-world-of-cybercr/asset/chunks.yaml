  trans: '

    他创建了一个简陋的网站，将公司描述为 IT 安全提供商，并就此作罢。他成功招聘了 `10` 名新员工，全是男性——其中两个来自`波兰`，一个来自`俄罗斯`，其余来自`罗马尼亚`。他向同事开玩笑提到那些波兰人，说有一点多样性是好的。


    但 Sig 也希望办公室里有一个女性。女性能让所有人保持冷静。在全男办公室里，事情会变得奇怪。人们会偷东西。他们说，他们会打架。他们过度谈论性，如果不谈这个，就会谈论知识产权。至少增加一名女性就能营造出一种文明的氛围。这并非完美解决方案，但是一种风险缓解的形式。


    他们一直在拼凑勒索软件，这些软件是从暗网上各种工具包中购买的。它们运行良好良好。起初，只有 `Sig` 和那个名叫 `Mikael Gunther` 的俄罗斯人。在加入
    `TechSolu` 之前，他一直非常独立。他曾与一位同样倾向于独处的中国黑客合作过。


    他们一起向母亲们索要照片赎金，将照片锁定并要求支付 `$50` 或 `$100` 以用正确的代码解锁。这些母亲们从未怀疑发生的事情甚至是一个犯罪，因为 Gunther
    让它看起来像是 Windows 系统的某些剥削性部分。他们是有道德的——他们向母亲们要了信用卡号，但并没有盗取号码，只收取了赎金。这就是 Sig 喜欢 Gunther
    的地方。他是一个道德的罪犯，是一个可以信任的人，至少有一点。


    Gunther 重新工程了该漏洞并最终在暗网上将其出售，排除了合作伙伴。他向其他勒索者出售工具包赚的钱比自己赚的多得多。Gunther 的工具包是异常的。Sig
    正是这样发现他的。


    他们构建了一个更适合企业级的 Gunther 模型，这有助于他们通过对拥有优质客户的小型律事务所进行试错，从而启动他们的业务。这对 Gunther 来说是一种松口气，因为他发现与中国的联系人工作非常精疲力竭。这种“抢夺”的方式与俄罗斯人的黑客方法背道而驰，后者必须始终涉及某种程度的隐蔽性。他说，没有了计谋就毫无乐趣。


    为了说明这一点，Gunther 贬低地谈到了他的前同事，后者最终将他的模型改为了付费参与的安排。据他最后所知，那个合伙人试图为担心安全的美国公司提供职业咨询。Gunther
    对此嗤之以鼻：“商人。”


    Gunther 帮助 Sig 从他的网络中引入了其他人。有些人来到 `Arnica` 与他们在一起，而另一些则远程工作。村子本身正在慢慢成为犯罪黑客的目的地。东欧有许多这样的聚集点，但有多少地方可以吹嘘拥有`特兰西瓦尼亚`风景优美的乡村呢？源源不断的好奇专家不断出现在
    `Arnica`。但只有少数镇民似乎理解正在发生什么。


    有了前十名员工，Sig 将重点放在针对律事务所和咨询公司。对这些机构的侦察工作几乎易得惊人。律事务所特别喜欢夸耀他们获得了新的名人客户，或者在合并或收购中代表大公司。他们发布新闻稿，在
    `LinkedIn` 上对这一切感到无比自豪，并为某些行业杂志撰写关于它的推销文章。新闻稿为最简单、最显而易见的诱饵提供了所需的信息。


    Gunther 和 `TechSolu` 的团队很快找到了这些公司。在典型的勒索攻击中，他们执行一封制作精良的电子邮件，邮件看起来是来自另一家事务所同事给某位律师的祝贺信，基于之前发布的任何新闻。


    信中包含一个链接，点击该链接后`TechSolu` 就能将勒索软件部署到律事务所合伙人的机器上并将其锁定。然后会出现一个看起来可怕的绿色屏幕，告诉律师他们要重新获得文件的访问权限，需要支付
    `$500` 到 `$5,000` 的赎金，取决于该律事务所可能负担得起。那个数字基于 `TechSolu` 的情报收集。


    竞争对手勒索者正在发送随机的邮件。竞争对手在收取赎金后并不总是解锁文件。


    但 Sig 知道建立稳如磐石的信誉的重要性。毕竟这是一家初创公司。他希望 `TechSolu` 在受害公司中声成为一个正直的犯罪组织，一个让他们的保险公司感到安全的组织。这尤为重要，因为现在有些保险单开始报销律事务所的赎金。如果保险公司确保在支付赎金后事务所能够拿回文件，他们就会批准。事实他们批准了，而
    `Sig` 和他的伙伴们赚了钱。而且很丰厚。随着他们在这些交易中诚实声誉的增长，他们更高金额的能力也之增长。


    他仍然需要寻找女性。


    他们的大多数受害者需要大量的说服才会付钱，而那个带有严重警告的糟糕绿色屏幕并不总是奏效。而且办公室里没有人的英语水平比 `Sig` 好。有时受害者需要问一些简单的问题：“我如何设置
    `Bitcoin` 钱包？”或者“你们能读你们偷走的文件吗？”


    Sig 对最后一个问题的回答取决于公司。因为这些律事务所中的某些公司比其他的更有趣。未来的合并。待处理的破产。答案总是“肯定的”，但通常由他来。

    '
