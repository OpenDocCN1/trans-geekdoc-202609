- raw: 'An hour ago, he tried using his card at his neighborhood Habib Deli outside
    Princeton, New Jersey, to buy cigarettes and extra-sweet iced tea, and it was
    declined.


    Thirty minutes later, someone from the bank’s credit fraud department calls Victor.
    Somebody tried to use his card number to buy tires in Germany so the bank locked
    up the card. Can’t unlock it. Have to get a new card. He has another card somewhere
    in a cabinet or a drawer, for emergencies. Maybe in the freezer? Packed away behind
    a stack of old, dusty laptops probably. No, stuck between the pages of a theoretical
    physics textbook on a high shelf. He can’t remember.


    “Fuck.” Victor hangs up the phone.


    Victor is a hacker, too. But he’s not some scumbag who steals credit card numbers,
    he’s a pro, and these people keep giving him a bad name. Making everyone think
    all hackers are criminals. He spots a pack of Marlboros, with a single cigarette
    left inside, hiding in the corner of the pack. Serendipity, at last. *Thank Christ*,
    he thinks. He lights it up and starts hunting for the spare credit card.


    **Back at NOW Bank,** Caroline is packing a suitcase with clothes and scarves,
    toilet paper, baby diapers. One of her colleagues, a communications specialist
    named Frances, had a house fire. She’s bringing her the suitcase as a care package.
    She adds a striped shorts-and-shirt set with a smiling puppy on the front. Toddler
    size 3.


    Something else is going on. It’s not the Home Depot thing. That’s just a standard
    breach, like the Target thing before it. This one is different.


    A small flame has been started within the bank’s security team. A whisper of something
    wrong. A trip wire tripped. Some of the most technical staffers have been in closed-door
    meetings. Others, those not privy to the inside story, whisper speculation back
    and forth. It’s something Caroline recognizes as significant. But until somebody
    who determines who needs to know tells her she needs to know, she will not know.
    She wonders where Raykoff is on that list, if he is on it at all.


    Caroline leaves the suitcase under the woman’s desk and walks out of the bank’s
    headquarters, hoping to catch a train back to the New Jersey office before 5 p.m.


    **After the DDoS attacks** in 2012 and 2013, cybersecurity enjoyed an uptick in
    status at the bank. It gained political currency in the sense that the attacks
    were so high profile that executives knew promising to do something about them
    would create professional heft. It also saw an increase in real capital because
    the attacks were a catalyst for a bigger budget.


    Both types of currency bought a new security operations center at the bank’s headquarters.
    That’s where Caroline parks the care package for her colleague, one of the new
    staffers she has hired to work there. Other new security employees, about 30 in
    all, have been hired or imported from New Jersey. Caroline keeps offices in both
    places.


    In the security operations center, which they informally call the SOC, pronounced
    “sock,” the security team quietly buzzes away. Stretching their legs and bumping
    their knees under their desks. Squinting and rubbing their eyes. Most of them
    are still getting used to all the natural light that the new SOC gets.


    It’s a move from the back office to the front office, at least that’s what executives
    keep saying. From the back burner to the front burner. For some of the team members,
    it’s an exciting change, getting noticed, coming to work at the corporate headquarters,
    where everyone dresses well and market-moving business decisions happen right
    under their noses. For others, it just feels like being on the burner.


    The SOC has been over a year in the making. Everything was planned down to the
    last detail.


    Inside the main room, which they call the secure room, 30 desks, each with four
    20-inch widescreen monitors, are set up in a configuration they’ve tested on hackers
    in New Jersey to find just the right specs for left-right and up-down eye scanning.
    They look like this for each SOC employee:


    ![image](images/img_044-01.jpg)


    Five 50-inch plasma screens span the east wall, one displaying scrubbed and fake
    data from an analytics software program called Splunk. The data is scrubbed or
    fake because the hackers working in the SOC, who are known officially as analysts,
    are deeply uncomfortable displaying real data on widescreen televisions. On the
    south wall, a 90-inch plasma screen plays CNBC on mute. Frances often watches
    it intently to see what they might be getting wrong.


    The north wall is made up of 100 square feet of electrochromic glass. The analysts
    call this the fog wall. It has been constructed using a five-layer sandwich of
    ultra-thin glass and polymer layers, the middle layer being a separator with rows
    of thin, clear, invisible electrodes on either side. One of the layers is soaked
    in polycrystalline tungsten oxide. When someone flips a switch, lithium ions are
    attracted to one side of the sandwich, making the glass go white so it resembles
    a plain, opaque wall. Flip the switch again, and the glass goes clear, so you
    can see inside the SOC.


    The fog wall is not meant as some kind of impermeable force field against cyberattacks,
    prying eyes, or malicious devices. It is meant to surprise and delight corporate
    clients who visit the bank.


    The significant location, the fog wall, the blinking and blooping screens and
    high-tech computer setups serve one purpose: to entertain important clients coming
    through for a tour. Bankers talk to them in the sober confines of the walnut and
    forest-green atrium, then drop the lithium ion curtain and reveal those flashing,
    blinking plasma screens with their impressive graphics and all those young turks
    typing away feverishly on their keyboards. Keeping the financial sector safe from
    peril, live and in real time. That experience transforms a cost center into something
    more than what it is. Something *valuable*.


    The fog wall faces an atrium on the twelfth floor of NOW Bank’s headquarters,
    an area that previously served as a pass-through to get from one bank of elevators
    to another. The hallway includes a sitting area, outfitted in sober dark-wood
    furniture with tasteful, academic dark green accents.


    On either side of the pass-through sits the company’s global physical security
    team, which includes the people who issue credentials to employees and monitor
    bank robberies. Farther down the hall, there is a hair salon, a wellness center,
    a “mother’s room” with three curtained stalls where nursing women pump breast
    milk throughout the day, conference rooms, a catering area, several meeting rooms,
    one fancy meeting room with soft couches, and lots of audiovisual equipment. Ensconced
    within these symbols of normalcy, the analysts inside the SOC prowl the bank’s
    systems, waiting for an enemy to strike.


    They will not have to wait long.


    ## **4.**


    ## The Baby


    **Ultimately, the SOC is** about function, not style. The analysts in the SOC
    are good, probably some of the best in New York. They were hand-selected and hired
    by Caroline, after all. The bank itself is great at security. NOW Bank is great
    at security in large part because of all the writing, all the documentation, all
    the clearly outlined rules for employees, for letting people into buildings, for
    hiring and firing, all the rules for software security and rules for vendors and
    rules for budget projections and rules for intelligence reports. Their security
    posture on paper is outstanding.


    Paperwork, maybe paradoxically, is frequently proven to be one of the best lines
    of defense.'
