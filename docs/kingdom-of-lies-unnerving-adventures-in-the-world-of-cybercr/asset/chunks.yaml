- raw: 'After the first round of DDoS attacks from Iran, it was Caroline who polished
    up the basement dwellers, freaks, and weirdos who saved the day. She made them
    presentable for the company’s board of directors, especially on paper. She made
    sense of what hackers do with neat charts and tidy graphs, workforce shortfalls
    and budget projections. Lingo the suits could understand.


    She was the one who scored them a brand-spanking-new budget and hundreds of new
    open positions. It was she who consoled them when the board then made a left turn
    and hired some new guy to be the top cybersecurity executive, some military guy
    who spewed a lot of manly stuff about battles and cyberwar that sounded impressive.
    Someone from outside.


    This morning Caroline dusted off her best suit to go to Manhattan and meet the
    new guy. He has a litany of very impressive titles, but word from her sources
    is that he appears to know little about the nuts and bolts of the field of cybersecurity,
    nor, according to them, does he seem to know how a bank operates or what its workers
    do. Although she herself doesn’t trust him, she tells her colleagues to give Bob
    Raykoff a chance.


    But she remains skeptical. She taps into her vast network of corporate hackers
    for all the intel on him they can muster. He’s a glad-hander they say, at best.
    Stories are already trickling in about how he needs an excessive amount of handholding.
    For instance, when he travels he insists on having someone accompany him to point
    out which service car is his. Not once or twice, but every single time. He suggests
    bringing in an ex-military general at an exorbitant salary to read a weekly report
    about cybersecurity to bank executives. Presumably *with gravitas*.


    Bob Raykoff. A former military big shot. Then a *consultant*. Author of extremely
    boring academic textbooks, discussing untested theories on the nature of hacking,
    geopolitics, and cyberespionage.


    *Give him a chance*, Caroline thinks as she smiles, shakes his hand. He seems
    to be nearly two feet taller than her. His height is not, she knows in her heart,
    why he looks right past the top of her head as if she isn’t even in the room.
    She gets out her four-color pen and a fresh notebook.


    They talk. Well, Raykoff talks. Caroline will be his chief of staff. He doesn’t
    like the title “business manager.” Caroline knows the bank calls this function
    a business manager and not a chief of staff to confer a sort of corporate neutrality
    to the title. Something more sober and removed than charged and aligned, politically,
    with the senior-most leader.


    Executives are expected to be able to interact with all the people who work in
    the bank. A business manager is an organizer; a chief of staff is a gatekeeper.


    Gatekeepers. They are not just deadly in the enterprise, they are murderous to
    the practice of cybersecurity. Caroline knows this—everyone in cybersecurity knows
    this. A 20-year-old analyst who specializes in examining computer code must be
    able to quickly raise an alarm to his top executive. Gatekeepers stop that from
    happening. A talented engineer who has unique knowledge about mobile device security
    must be able to shine when the bank buys new cell phones for everyone. Gatekeepers
    stop this from happening.


    Still, Caroline is a company woman. If her boss wants her to be a chief of staff,
    she will call herself a chief of staff. But she’ll do the job the right way. And
    she will manage his business. She will manage the shit out of it.


    Just before Raykoff came on board, Caroline and the others who had survived the
    DDoS attack decided to create a matrixed organization. For cybersecurity in the
    business world, this works well, because there are so few employees and so many
    things to do. Everyone multi-tasks.


    When a cybersecurity team is matrixed, everyone—including the people who do the
    hacking, manage the buildings, install the technology, and deal with regulators—cooperates
    with each other.


    What Raykoff proposes is the opposite of that. A heavily layered, top-down organization,
    where one leader (him) has all the decision-making power and those below him report
    exclusively to him. This works well in the military, where people must know where
    their orders are coming from. It does not work as well in a corporation, especially
    in an organization that does not rely on orders to achieve goals. The enterprise,
    by contrast, depends on the autonomy of very smart people who are paid to solve
    problems.


    Imagine it this way: You are a cybersecurity employee. You need to make a change
    to some software that the bankers use. This change will cause the software to
    go offline for four hours during the workday. The bankers want to be able to work,
    to make money and hit targets, and they have to do this job using the software.
    They will be very angry about this. You, the cybersecurity employee, therefore,
    will not order them to do it because if you do so, they will tell their boss,
    who will tell his boss, who will raise it up to a high-level manager who will
    then get into a fight with your high-level manager, delaying this important security
    project. So instead you negotiate.


    You agree with the business unit leaders to stagger the time, so only half the
    downtime is during the workday and the rest of the hours are on a Sunday. You
    create a chart describing precisely how the downtime will keep their systems safe
    from some kind of awful security problem that recently struck traders at another
    bank. You, the cybersecurity employee, are not in charge. Neither is your boss.
    Nor are the bankers or their bosses. Nobody is really “in charge” except the shareholders,
    so all things must be negotiated.


    But it becomes quite clear that Raykoff, who continues talking over Caroline’s
    head about operational strategies and synergies and best practices, does not believe
    this, or perhaps does not understand it. As Raykoff drones on, it becomes clear
    that Caroline will not be in her job for long, because he wants a military man.
    Someone more hard-hitting, more authoritative. One of his buddies.


    He says he wants to be insulated from the lower levels of staff. He discusses
    adding several layers below the chief of staff to help with this. He already has
    a few people in mind. People to replace all the talented people, like Carl, who
    have already proven their worth.


    Gatekeepers for the gatekeepers. Caroline winces.


    It’s not that Caroline isn’t comfortable with leaving her job if necessary. This
    is the nature of how a bank operates. Organizations change all the time. But she
    never contemplated having to leave her friends in the hands of someone who so
    transparently doesn’t understand how the organization that hired him works. She
    feels an unfamiliar anxiety in her stomach as he rambles on. He mentions some
    aspects of cybersecurity that are unfamiliar to her. She plumbs her memory and
    experience to try to understand the terms he’s using.


    It’s government jargon. Terms that have little practical application in the enterprise.
    Then he brags a little, something about having served as a cybersecurity advisor
    to Condoleezza Rice. He talks about something called *con-ops*. Concept of operations.
    That sounds vaguely familiar.


    “Do you mean a business plan?” she asks.


    He stares back at her blankly.


    What we have here is a failure to communicate.


    It gets worse. He seems annoyed that she spoke. He becomes gruff. Dismissive.
    *Rude*. Asks her where the coffee machine is. Makes a joke about how that’s probably
    sexist. She composes herself. Anger helps.


    He asks her whether she knows how to use the fax machine. Her eyes narrow. Caroline
    has a master’s degree in cybersecurity and seven technical certifications. She
    knows more about financial-sector security than anyone at the U.S. Department
    of Treasury.'
