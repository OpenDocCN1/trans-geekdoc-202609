  trans: '

    在 Sig 的经验中，黑客集体通常更像初创企业，而不是老派的黑社会。组织的分工最好留给特定的才俊。。某些深奥、困难技术领域的专家可能会独立独立工作，而且雇佣他们需要支付高额费用。


    在较大的组织中，甚至有人力资源部门和客户服务部门。有些小组还拥有自己的网络安全部门，防止其他犯罪组织窃取他们正在创建和窃取的非法知识产权。


    Sig 喜欢初创文化。这正是他想要模仿的。他希望建立的新组织将包括负责收集侦察信息的情报专家，以及一名恶意软件专家——他通过经验认识了对方——来帮助设计或修改现有组件。他还会使用那些能够交付、利用并将恶意软件安装到目标上的专家。比如那些擅长操作命令与控制服务器并指挥僵尸网络（或大量受控计算机和设备）的人。


    一旦这些人员到位，Sig 将建立一个催收部门，以确保人们付钱。这个催收人员将精通各种秘密资金转账方法和加密货币，以便从全球系列受害者那里收取赎金。


    他脑海中的大多数人是来自东欧的 20 到 40 岁的男性。


    最后，他想要一个客户服务代表。一个漂亮女孩。一个可以暂时抵消所有荷尔蒙的人，他从经验知道，这些荷尔蒙最终会瓦解组织。


    *那应该不难*，Sig 这样想。他从未在吸引女性女性注意方面遇到过问题。


    **Caroline 正在整理**她的思绪。她怀着第二个孩子，她能预见到局势的走向——Raykoff 的新组织容不下像她这样的人，一个认识所有人并与每个人都友好的、深受深受喜爱并活跃于许多网络安全社区的人。用一句话说，她是危险的。


    泄露事件减慢了许多进度，所以她怀孕的消息比她预想的要晚。但她与 Raykoff 的对话仍然令她震惊。她告诉他自己怀孕了，让他知道她什么时候将休产，现在大约还有六个月时间。不让宝宝出生这种事突然让老板措手不及被认为是一种礼貌的规矩，而
    Caroline 天生就非常合乎规矩。他的回答在预料之中，但仍然给她笼罩上了一层阴影：“当你休完假回来时，你在网络安全领域将不再工作了。”


    不是“你不再为我工作了”，或“你不再在我部门工作了”，或“你不再在这家公司工作了”。而是“你不再从事 `cybersecurity` 工作。”这个威胁很具体。她觉得他打算让她列入黑名单。她唯一的慰藉是，尽管他在政府工作时可能有权这样做，但他对金融行业并没有同样的权力。


    尽管如此，他的反应还是打乱了她的节奏。她一直在她庞大的同行网络中寻求慰藉。他们支持她，就像她一直支持他们一样。他们对事态的发展感到愤怒，甚至比她还要愤怒。


    现在，她和 Michael Joseph 坐在一起，Michael 是前海军陆战队教官，是他最亲的密友之一，也是她最早雇用的人之一。他正在向她介绍 Venice
    事件的细节。这是一个周日晚上。大家都忘记了时间。他们的对话伴随着 `SOC` 内部轻微的打字声。


    安全分析师检测到了攻击者设置的绊丝器，并观察到数 TB 的数据被外泄——从银行中取出——全部由同一个犯罪分子实施。作为调查的一部分，他们发现了其他问题、其他攻击、其他外泄。他们还不知道被走了多少数据，也不知道数据里有什么。要查出是谁干的，还需要很长时间。可能永远也查不到。


    Raykoff 一直告诉每一个愿意听他说话的高管这是一场战争。他说，这看起来像是中国的影响。他说，这改变游戏规则。


    Michael 同意。这很大。而且很不同。不是他们受过训练的那种事情。他们首先是一支技术团队，是一群理解 `protocols`、控制措施以及旨在尽可能安全环境的古怪事物的工程师。Michael
    曾在阿富汗的战场上待过，但那是另一回事。银行不会与敌人作战，海军陆战队会。当敌人攻击银行时，海军陆战队会介入控制局面。但这里没有地面部队。没有 `NSA`。没有
    `DHS`。`FBI` 已经联系了，但不是为了战斗，而是为了帮助弄清 Venice 的幕后黑手。


    银行既想礼貌地合作，又想让这三个字母的机构保持距离，正如大多数公司在可以的情况下所做的那样。让他们感到模糊的满意，并将他们限制在自己的调查角落里。机构越多，泄露越多。探员越多，泄露者越多。而且这些机构根本没有网络军队来帮助银行。他们根本就无法应对分散在全国每家公司的网络攻击，每家公司都有自己的内部政治、术语以及不愿与政府共享信息的意愿。


    然后是 Raykoff。他对目前的威胁有所了解。他理解如何执行动战。他理解这些威胁。


    确实，他可能对最新的技术格局的知识深度不够。但并不是真正的问题。真正的问题是，根据他在金融行业缺乏经验以及根据他与银行家的早期接触，他似乎并不了解银行是如何运作的。他似乎并不理解银行家不太可能听他的，因为他来自一个成本中心，拍桌子改变不了他们的想法。


    ## **6.**


    ## 零工经济


    **三个月过去了。在**罗马尼亚，Sig 的新公司进展顺利，他决定将其命名为 `TechSolu`。这是一个毫无意义的词，听起来就像一家东欧的科技初创公司。他偷用了一个吸尘器制造商的标志。它是一个半太阳。不过这并不重要。


    '
