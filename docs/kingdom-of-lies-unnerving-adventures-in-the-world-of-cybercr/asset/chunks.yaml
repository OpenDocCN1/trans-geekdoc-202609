    In Charlie’s experience, this shit is useful for day-to-day problem-solving but
    meaningless in the long run. It “solves” nothing.


    What *does* make a difference is the one guy or gal on the ground, in the trenches,
    doing the crimes or solving the crimes or watching the crimes who can illuminate
    the real problems and how they might be solved. Who are we dealing with? What
    motivates them? Everything else is just semantics. Charlie should know. He’s the
    lawyer.


    That’s what he loves about Caroline. She knows the value of the human element.
    That’s why she hired so many former spies.


    The disclosure will go like this:


    *On August 5, 2014, we discovered a group of criminals had broken into our servers
    and stolen the personal details, including names, Social Security numbers, addresses
    and phone numbers of 87 million NOW Bank clients. We are working with law enforcement
    to investigate this matter and, as a result, cannot fully disclose some details
    of the investigation*.


    There is more to come. But this is good. Nice, straight, and to the point. Filled
    with crisp, safe known knowns.


    Who was he kidding? People were going to freak out.


    By Valentine’s Day 2015 everyone in cybersecurity at NOW Bank is looking for a
    new job. If they haven’t jumped already. Bonuses get paid out in a few weeks.
    After that, the real exodus will begin.


    They were all promised sky-high salaries and big bonuses while they went slogging
    through the pain of Venice. Neither of which came to pass. Many people involved
    are of the opinion that this is due to Raykoff having pissed off so many people
    that they are putting the squeeze on him in order to further justify moving him
    out. Many of them, novices to the inner workings of the bank, have forgotten they
    work in a cost center. And once you find yourself in a cost center, you’re always
    in a cost center.


    Raykoff is busy today. He’s meeting some important people. Some of the administrative
    workers in the SOC are surprised by a knock on the door. It’s a man and a woman,
    both with earpieces, and another man behind them. They seem important.


    “We’re . . . looking for Bill Raykoff?” asks the one man without an earpiece.


    The secretary answers. “Yes, he’s upstairs. But I can let you in now.”

