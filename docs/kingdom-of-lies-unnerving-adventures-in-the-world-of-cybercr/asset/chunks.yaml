- raw: 'A few of the girls René grew up with and went to clubs with managed to wend
    their way into a life of casual prostitution. This isn’t something René wants,
    so she leaves them behind. She gets involved romantically with a few feckless,
    aimless boys, but for no more than a few weeks. When they ask her for money, she
    rids herself of them quickly. She tries to be practical. Often in warm water but
    never hot.


    Both she and Arnica Valka are growing up. And it’s not just her nineteenth birthday
    that’s making her feel wiser and older. It’s much more concrete than that.


    **Arnica Valka is a** quiet town, just 100,000 people, nestled in the foothills
    of the Transylvanian Alps, two hours west of Bucharest. It has, in fact, right
    under René’s nose, become one of the world’s most notorious cybercrime villages,
    with an underground economy funded almost entirely by ransomware, stolen credit
    cards, and identity theft. Media will later call some of its neighboring towns
    among the most “dangerous places on the internet” and “hackervilles.” To her,
    it is just home.


    René was born in Arnica and grew up in Nicolae Ceauşescu–era housing projects.
    About two years prior to her nineteenth birthday, she noticed her hometown changing.
    Tech start-ups were percolating in warehouses and old barns, furnished like American
    social media companies with beanbag chairs and exposed brick walls. René heard
    the pay at these start-ups was fantastic—too good to be true.


    René never mastered math like her parents had wanted and had no desire to marry
    a nice, older rich man, as her mother had suggested. She decides to go into advertising.
    As a student in marketing at Arnica Community College, she fantasizes about landing
    a job in tech, but she can’t write code. Besides, it’s not like these start-ups
    she keeps hearing about actually advertise job openings. It is all very hush-hush.


    In her free time, René likes dancing and reading detective novels. She smokes
    cigarettes with her friends that she rolls herself with fresh tobacco. She is
    paying her way through college by working at City Italia, one of the fancy new
    restaurants that has just cropped up to meet the demands of the tech economy.
    She jokes to patrons that her only tech skills are texting with one hand while
    pouring coffee with the other.


    One thing René *is* good at is talking. She argues her way to better grades in
    school even when she has cut classes. She talked her way into a job at City Italia
    and talks her way out of parking tickets. She is pretty, too, slender with long
    auburn hair. Then again, most of the young women in Arnica are pretty. As the
    economy grows, she can’t help but notice how the local pool of beautiful young
    women grows with it.


    Sig Himelman first sees René at Sunday brunch at City Italia. He watches as she
    flirts with each table, just enough to get a good tip, but not enough give them
    the wrong idea. He sees potential in her right away. Sig sits with a group of
    other well-dressed, 30-something men. Tall and engaging, with a new, neatly trimmed
    beard and a brand-new set of custom-made white veneers, he’s clearly the ringleader
    of the table. René flirts with him accordingly.


    They talk in English—Sig with a German accent—but right away she thinks he asks
    too many questions for her comfort.


    “How old are you?”


    “Nineteen.”


    “Your voice is too low for a nineteen-year-old,” he says.


    “I roll my own cigarettes and I often forget the filters.”


    “It’s a good voice. Reassuring. Do you like your job?”


    René is always on guard for when a less-than-wholesome proposition might be coming.
    She leans in and whispers, “I am a child of God. You can find your whores elsewhere.”


    She grabs the tip from the table and walks away. He follows her and she debates
    whether to get the manager. No, she will handle this herself.


    “Wait, wait,” he says to her. “You misunderstood me.”


    She turns, arms crossed, and listens.


    “I work at a company called TechSolu,” Sig says. “We just opened a few months
    ago on General Maleur Street. We need a call center operator. Someone who sounds
    mature and who likes to solve problems. Whatever they pay you here, I’ll triple
    it.”


    *It sounds too good to be true*, René thinks, but she wants a job at a start-up.
    Maybe this is how it works.


    Sig can tell she’s reluctant. He hands her his card along with a stack of crisp
    American bills.


    “Meet me at the address on the card, Monday at nine a.m.” He gestures behind him
    to the restaurant floor. “What do you have to lose?”


    **Monday morning, René finds** herself walking down General Maleur Street, her
    father’s pistol in her handbag, just in case.


    The neighborhood is changed, indeed. Block by block as she nears the center of
    town, she sees new streetlights, more police cars. There are more people, too—young
    people—moving quickly in the cool morning air as they make their way to work.


    Stores that once sold cheap cell phones are now vending expensive tablets. Computer
    servers are advertised in the windows like puppies. Some of the storefronts promote
    the fact that they accept Bitcoin as payment. René passes the old, yellow-drab
    laundry where her mother would take her when their washing machine wasn’t working.
    It is now called Cafe Americain and looks just like a Starbucks.


    Wedged between a health food store selling some kind of Korean drink with bubbles
    in it and a law office advertising financial crime defense is TechSolu. René grips
    her handbag a bit tighter as she enters.


    Inside she finds a beautifully appointed open floor plan. The workers, all men,
    stare intently at their computer screens. Sig leaps up and greets her like an
    old friend, then ushers her into a glass office. On his desk, five laptops are
    stacked up like most people stack paperwork.


    “I’m so glad you came, René!”


    “I didn’t think I would.”


    He offers her a seat and then leans back in his desk chair. “Do you know what
    we do here?”


    “Technology, I presume,” she says, raising an eyebrow. “But I am no good with
    computers. I am an excellent typist, though, and can certainly answer phones.
    I would require my first paycheck up front.” She shifts her weight in the chair
    and smiles. Negotiating is a strong suit.


    He smiles. “Do you speak any other languages besides English?”


    “Russian and French.”


    “Both will definitely come in handy here. We have customers all over the globe.”


    René remains expressionless.


    “We do penetration testing,” Sig offers. “That is, we hack into companies and
    then they pay us to show them where they are vulnerable, so they can fix the problem.
    We’re a cybersecurity company.”


    “Cybersecurity? Not hackers?” she ventures.


    Sig grins. “Well, yes and no. We are hackers, but the good kind. Ethical hackers.
    White hats.”


    “So why do you need customer service?”


    “Sometimes, when our clients have problems, they need to vent, they get mad because
    they don’t like to find out that their computers were vulnerable. I’ll be honest,
    sometimes they need to vent a lot. Or they can’t figure out how to pay, so you
    have to guide them through the process. Most of our customers pay in Bitcoin,
    and it can be a little tricky for them to get it right.”


    “You don’t pay your workers in Bitcoin, do you?”


    “No. Of course not. You will be paid in leus or euros or U.S. dollars.”


    René knows of no legitimate business in Romania that gives its workers a choice
    to be paid in whatever foreign currency they want. But Sig is growing on her.
    He seems genuine and charming. And the workers in the open-plan office are all
    well dressed and appear happy. There are even beanbag chairs. It’s just how she
    imagines working at Facebook must be, but on a smaller scale. Plus, she is really
    good at customer service.


    “U.S. dollars,” she says.


    “Excellent! Let me show you your desk!”


    Her desk is inside a small alcove office, slightly removed from the rest of the
    team so that she doesn’t disturb them with her phone calls.'
  fmt: '

    A few of the girls René grew up with and went to clubs with managed to wend their
    way into a life of casual prostitution. This isn’t something René wants, so she
    leaves them behind. She gets involved romantically with a few feckless, aimless
    boys, but for no more than a few weeks. When they ask her for money, she rids
    herself of them quickly. She tries to be practical. Often in warm water but never
    hot.


    Both she and Arnica Valka are growing up. And it’s not just her nineteenth birthday
    that’s making her feel wiser and older. It’s much more concrete than that.


    `Arnica Valka` is a quiet town, just 100,000 people, nestled in the foothills
    of the Transylvanian Alps, two hours west of Bucharest. It has, in fact, right
    under René’s nose, become one of the world’s most notorious cybercrime villages,
    with an underground economy funded almost entirely by ransomware, stolen credit
    cards, and identity theft. Media will later call some of its neighboring towns
    among the most “dangerous places on the internet” and “hackervilles.” To her,
    it is just home.


    René was born in Arnica and grew up in Nicolae Ceauşescu–era housing projects.
    About two years prior to her nineteenth birthday, she noticed her hometown changing.
    Tech start-ups were percolating in warehouses and old barns, furnished like American
    social media companies with beanbag chairs and exposed brick walls. René heard
    the pay at these start-ups was fantastic—too good to be true.


    René never mastered math like her parents had wanted and had no desire to marry
    a nice, older rich man, as her mother had suggested. She decides to go into advertising.
    As a student in marketing at Arnica Community College, she fantasizes about landing
    a job in tech, but she can’t write code. Besides, it’s not like these start-ups
    she keeps hearing about actually advertise job openings. It is all very hush-hush.


    In her free time, René likes dancing and reading detective novels. She smokes
    cigarettes with her friends that she rolls herself with fresh tobacco. She is
    paying her way through college by working at `City Italia`, one of the fancy new
    restaurants that has just cropped up to meet the demands of the tech economy.
    She jokes to patrons that her only tech skills are texting with one hand while
    pouring coffee with the other.


    One thing René `is` good at is talking. She argues her way to better grades in
    school even when she has cut classes. She talked her way into a job at `City Italia`
    and talks her way out of parking tickets. She is pretty, too, slender with long
    auburn hair. Then again, most of the young women in Arnica are pretty. As the
    economy grows, she can’t help but notice how the local pool of beautiful young
    women grows with it.


    Sig Himelman first sees René at Sunday brunch at `City Italia`. He watches as
    she flirts with each table, just enough to get a good tip, but not enough give
    them the wrong idea. He sees potential in her right away. Sig sits with a group
    of other well-dressed, 30-something men. Tall and engaging, with a new, neatly
    trimmed beard and a brand-new set of custom-made white veneers, he’s clearly the
    ringleader of the table. René flirts with him accordingly.


    They talk in English—Sig with a German accent—but right away she thinks he asks
    too many questions for her comfort.


    “How old are you?”


    “Nineteen.”


    “Your voice is too low for a nineteen-year-old,” he says.


    “I roll my own cigarettes and I often forget the filters.”


    “It’s a good voice. Reassuring. Do you like your job?”


    René is always on guard for when a less-than-wholesome proposition might be coming.
    She leans in and whispers, “I am a child of God. You can find your whores elsewhere.”


    She grabs the tip from the table and walks away. He follows her and she debates
    whether to get the manager. No, she will handle this herself.


    “Wait, wait,” he says to her. “You misunderstood me.”


    She turns, arms crossed, and listens.


    “I work at a company called `TechSolu`, Sig says. “We just opened a few months
    ago on General Maleur Street. We need a call center operator. Someone who sounds
    mature and who likes to solve problems. Whatever they pay you here, I’ll triple
    it.”


    *It sounds too good to be true*, René thinks, but she wants a job at a start-up.


    Sig can tell she’s reluctant. He hands her his card along with a stack of crisp
    American bills.


    “Meet me at the address on the card, Monday at nine a.m.” He gestures behind him
    to the restaurant floor. “What do you have to lose?”


    `Monday morning, René finds` herself walking down General Maleur Street, her father’s
    pistol in her handbag, just in case.


    The neighborhood is changed, indeed. Block by block as she nears the center of
    town, she sees new streetlights, more police cars. There are more people, too—young
    people—moving quickly in the cool morning air as they make their way to work.


    Stores that once sold cheap cell phones are now vending expensive tablets. Computer
    servers are advertised in the windows like puppies. Some of the storefronts promote
    the fact that they accept Bitcoin as payment. René passes the old, yellow-drab
    laundry where her mother would take her when their washing machine wasn’t working.
    It is now called `Cafe Americain` and looks just like a Starbucks.


    Wedged between a health food store selling some kind of Korean drink with bubbles
    in it and a law office advertising financial crime defense is `TechSolu`. Inside
    she finds a beautifully appointed open plan. The workers, all men, stare intently
    at computer screens. Sig René leaps up and greets her like an old friend, then
    ushers her into a glass office. On his desk, five laptops are stacked up.


    “I’m so glad you came, René!”


    “didn’t think I would.”


    He offers her a seat and then leans back in his chair. “Do you know what we do
    here?”


    “Technology, I presume,” she says, raising an eyebrow. “But I am no good with
    computers. I am an excellent typist, though, and can certainly answer phones.
    I would require my paycheck up front.” She shifts her weight in the chair and
    smiles. Negotiating is a strong suit.


    He smiles. “Do you speak any other languages besides English?”


    “Russian and French.”


    “Both will definitely come handy here. We have customers all over the globe.”


    René remains expressionless.


    “We do penetration testing,” Sig offers. “That is, we hack into companies and
    then they pay us to show them where they are vulnerable, so they can fix the problem.
    We’re a company.”


    “Cybersecurity? Not hackers?” she ventures.


    Sig grins. “Well, yes and no. We are hackers, but the good kind. Ethical hackers.
    White hats.”


    “So why do you need customer service?”


    “Sometimes, when our clients have problems, they need to vent, they get mad because
    they don’t like to find out that computers were vulnerable. I’ll be honest, sometimes
    they need to vent a lot. Or they can’t figure out how to pay, so you have to guide
    them through the process. Most of our customers pay in Bitcoin, and it can be
    a little tricky for them to get it right.”


    “You don’t pay your workers in Bitcoin, do you?”


    “No. Of course not. You will be paid in leus or euros or U.S. dollars.”


    René knows of no legitimate business in Romania that gives its workers a choice
    to be paid in whatever foreign currency they want. But Sig is growing on her.
    He seems genuine and charming. And the workers in the open-plan office are all
    well dressed and appear happy. There are even beanbag chairs. It’s just how she
    imagines working at Facebook must be, but on a smaller scale. Plus, she is really
    good at customer service.


    “U.S. dollars,” she says.


    “Excellent! Let me show you your desk!”


    Her desk is inside a small alcove office, slightly removed from the rest of the
    team so that she doesn’t disturb them with her phone calls.

