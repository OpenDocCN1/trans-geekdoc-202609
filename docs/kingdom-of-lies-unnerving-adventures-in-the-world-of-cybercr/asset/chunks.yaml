    Sig paces nervously. He’s been spending the past hour alternately charming René’s
    mother and the nurses, talking about how worried he was for René and the baby.
    His baby. He seems thrilled, but René has grown wise in the past 24 hours.


    “I’m so exhausted,” Sig says.


    René’s mother tries to hand him the baby, but he demurs. Looks at his mobile phone.
    Picks at his cuticles.


    René’s mother pats him on the back, asks him if he’d like to go out for cookies.
    He says yes. René is grateful her mother is there to help, and to keep Sig out
    of her way.


    # 17. The Insider Threat


    By April 2016, `ransomware` has become so prevalent that many of the criminal
    organizations that pioneered it are breaking apart at the seams.


    But Bo Chou couldn’t be happier. The financial firm in Singapore offered him a
    contract. He was worried it wouldn’t work out. But the boom in this new kind of
    criminal enterprise means his inbox is overflowing with interesting work. Work
    he is very good at.


    Bo is in the midst of helping write a ransomware policy for his company and translating
    it into several languages. Just the other day, he helped coach a department through
    a difficult ransomware attack. They were able to avoid paying the ransom after
    verifying that all of the locked data was held on a cloud server. Now he’s writing
    a proposal to move all data backups to cloud servers in advance of what will become
    a much larger and more damaging wave of ransomware. His boss is thrilled. They
    might even win a bigger budget.


    From a drab cubicle on a red dot in the middle of Asia, in a glamorous high-rise
    office far removed from his drab military days, Bo silently high-fives himself.


    Absolutely no one at `TechSolu` is happy. All the workers are getting recruited
    by other criminal groups. Some of them, Sig knows, are plotting to go off on their
    own as independents. Some of them, Sig suspects, are planning on stealing his
    intellectual property before they do.


    Sig tries finding a new woman for the office, but it hasn’t yet worked out. The
    guys want René back, but he told them she didn’t want to see them anymore. That
    she’s too busy with the baby. They are offended. Sig shrugs. *You know, women*
    . . .


    Based on his recent searches, Dieter knows that Sig is worried about insiders
    at his enterprise making off with his criminal trade secrets.


    Dieter has been leaving Sig’s feed alone in recent weeks. He’s been thinking about
    a number of projects and thought pieces on ransomware. As a researcher, he is
    somewhat lazy and easily distracted, but he’s curious about one of his favorite
    topics: insider threats.


    What Dieter loves most is the inevitable and ultimate failure of organizations
    attempting to find someone who is threatening their business from the inside.
    It’s like trying to rid a house of mice. You think they’re there. You imagine
    you hear them scurrying. Sometimes you catch a glimpse of a darting gray form
    across the floor.


    But human beings are even less predictable than mice. They easily have a change
    of heart. They are able to evaluate their priorities and change them on a whim,
    reconsider their decisions, and turn into completely different people.


    Edward Snowden, for example, was a good and trustworthy Booz Allen Hamilton employee
    before he turned into the infamous figure we know today. The only difference was
    a change of heart, a shift in thinking, from doing an engineering job he enjoyed
    to being offended by government oversteps to going rogue.


    Chelsea, née Bradley, Manning was an Army employee with a history of filing complaints
    and small behavioral problems, but not enough to put him on the front burner for
    discipline, when she was charmed by the online community at `WikiLeaks`. So convinced
    was she by these latent online friendships that she went from being a middling
    employee to committing high espionage.


    History is filled with examples of decent, hardworking people who, upon experiencing
    a startling revelation, suddenly and irreversibly become insider threats.


    And here is Sig with his tiny criminal enterprise, Googling “how to find an insider
    threat.” *Good luck with that*, Dieter thinks. His employees wouldn’t need much
    of a reason to turn on Sig. His compatriots are criminals, after all.


    René doesn’t care about `TechSolu`’s troubles, or being ostracized from the workplace,
    or the fact that she’s so young and is now a mother. She has a little baby boy
    named Henry. He’s lovely. She’s breastfeeding him.


    Henry. She calms at the sound of it. It’s not a name so much as a course forward.


    Sig has noticed her sudden shift in loyalty. It’s made him even less pleasant
    but also kept him away more often. He’s never home, and when he is, he’s a terror.
    Everything is a reason for a fight. He yells at her in the morning, at dinner,
    in front of the baby, while she’s breastfeeding . The harder she clutches Henry,
    the louder he yells. The louder he yells, the closer she pulls the baby to her.
    It’s a ridiculous spiral that must end soon.


    She hasn’t seen other people for ages. But that is going to change. Despite Sig’s
    efforts to keep René away from the `TechSolu` office, he still wants her to come
    down to show off the baby. They plan on going today.


    Henry is so cute and perfect looking, after all. Shiny dark hair and light eyes.
    “He looks just like me, don’t you think?” Sig says as they head outside to his
    `BMW`. René stares straight ahead, her pretty mouth flat as a dash on her face.


    “I’m sorry,” she says in a monotone.


    Sig smiles.


    At the office, René thinks things look different. They smell different. Several
    seats are empty. The remaining guys glare at her, follow her every move. She senses
    their suspicion but doesn’t understand its origin. She doesn’t really care. She
    can withstand their looks. She won’t engage in their workplace drama. She has
    nothing to explain to them.


    Sig gives her some money for lunch, fans the bills out in front of everyone so
    they can see how generous he is. Sig says he has to get back to work, that she
    should go down to `Café Americain` and grab whatever she wants. He keeps his arm
    around her as if he’s reluctant to let her go and wears a huge, unflinching smile.


    “Everyone here misses you!” he says.


    She smiles halfheartedly.


    “You’re so shy these days,” he says.


    She nods again. Doesn’t speak. Doesn’t make eye contact. She takes baby Henry
    out of the carrier around her chest, briefly shows him off like Simba in *The
    Lion King*. He wakes up, fusses. “He needs to feed,” she whispers to Sig. He directs
    her to the ladies’ room. “What about my old office? It’s more sanitary,” she suggests.
    He ushers her in, lets her sit. Closes the door. Gives her five minutes of privacy.


    She puts Henry on her breast, then reaches under the desk, her fingers feeling
    around the fiberboard underneath. There it is. Taped just where she remembers
    it. $1000 in cash. She stuffs the money into her bra.


    *It is a gift*, she thinks, left to her by the old René, the one who packed a
    pistol in her purse on her first trip to `TechSolu`.


    # 18. The Terrorist


    The new dark web `Silk Road` is where Brendan “Tahir” Gerie likes to spend most
    of his time these days, and in spite of himself, he keeps getting tempted by the
    less refined wares the service has to offer, like this one:


    FRESH, NEW UPSKIRTS. HOT YOUNG TIGHT UNIQUE. FREE WITH YOUR PURCHASE OF THESE
    AMERICAN RETAIL CC NUMBERS


    He hovers his mouse over the chyron. He could use some more credit card numbers.
    The price is reasonable. And, of course, the value proposition is high.


    But is it halal? Probably not. Depends on the girls, though. Maybe they are Muslim,
    and if it was unwitting, or if they were tricked, then it is not their fault.
    So maybe he can look? He’s confused, consults an ISIS messaging board that he
    frequents. He waits for several minutes. No answer to this pressing problem.


    He prays, has to start over again four or five times. It’s March and it’s hot
    in Singapore. *HOT HOT HOT*.

