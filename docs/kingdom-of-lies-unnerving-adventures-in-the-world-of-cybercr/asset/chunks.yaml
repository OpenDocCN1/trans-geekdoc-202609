- raw: '“They might; it depends. It depends a lot on their employees, who are watching
    for anomalies. But typically, no, at least not right away. That’s why you do the
    next part very quickly. The mule in Tallinn takes the credit card, waits for the
    day the ATM is filled. He brings a burlap bag. Goes at night, with the appropriate
    clothes, a bit of a disguise. He puts the credit card in, types in some number,
    something just below $200,000, and the ATM spits it out. He covers the money dispenser
    with the bag and fills it up, then walks away. Some of them get away with a million
    in one day.”


    “What type of malware for the credentials?”


    “There’s one called August Malware that targets Microsoft Word documents, easy
    for most banks, though not Russian ones. There’s Acecard and GMBot; both of those
    target the Android operating system.” Dieter shrugs innocently, but he knows everybody
    uses Android in Romania and that Sig is paying close attention to this.


    Sig is smiling softly now, getting a little drunker. He has it scoped out in his
    mind. He is getting tired of ransomware—too many other organizations are getting
    involved in it. This seems like a nice new step. And he already knows a pretty,
    auburn-haired Romanian girl who would make the perfect mule.


    Dieter takes the USB stick out deftly and puts it back in his pocket. He feels
    more relaxed, too, partly because of the alcohol and partly because his malware
    trick worked. At the very least, it went unnoticed. And he will be on a plane
    back to Helsinki soon.


    They talk about superficialities. Sig never mentions René. Dieter steers every
    sentence away from his wife and kids. They settle on politics. The upcoming election
    in France—Sig is sure the far right will win. In the American presidential election,
    a candidate named Donald Trump, a television star as far as Dieter understands,
    has just announced he will run.


    “The whole thing will be a zoo, that is the only thing that I know,” Dieter says.
    Sig drunkenly agrees.


    “I don’t think the woman who is going to run will be very popular,” Sig says.
    “It will be interesting to see what the Russians do. They’ve been very active
    lately.”


    “Yes,” Dieter agrees, this time truthfully. He checks his watch. Time to go.


    ## **13.**


    ## The Volunteers


    **By 2015, anyone who works** in cybersecurity—criminal, good guy, or in between—can
    see that the Russians are more than active. They are so busy they can’t train
    their hackers fast enough.


    Cybercriminals are in high demand, especially by government-sponsored intelligence
    organizations. There are so many hackers in intelligence organizations and intelligence
    operatives involved in cybercrimes that even those in the know aren’t sure exactly
    who they are dealing with.


    This activity spikes during the lead-up to the 2016 U.S. presidential election,
    but the participants in Russia are so spread out, in terms of their geographic
    location, ideology, and backgrounds, that it doesn’t appear like a coordinated
    effort. At least not to the untrained eye.


    By this time, there is no longer a “farm team” from which to pull eager candidates
    into Russian cyberoperations. Recruitment has taken on a whole new angle.


    The people doing bad deeds may have no desire to work for the government. They’ve
    never signed up for any patriotic mission beyond cheering on Russia in the World
    Cup. But they are being pressed into service by the government.


    These young Russians are a lot like the young students at Caroline’s hack-a-thon
    at NOW Bank. Instead of a conference room at the bank’s headquarters, they are
    being recruited from all over Russia. A cup of tea and a recruitment pitch from
    one of Vladimir Putin’s henchmen is more persuasive than Caroline’s pep talk.


    **The recruitment process may** be more modern, but one of their primary tasks
    is age-old. Election interference is an art, one perhaps first perfected by the
    British.


    In 1940, British intelligence officers wanted to stack the American political
    deck with individuals who would favor U.S. entry into World War II. To do it,
    they tapped the phones of political candidates and used the deleterious statements
    they recorded in media campaigns against candidates who did not support their
    agenda.


    They spread the news via a network of compromised journalists, who filed fake
    or exaggerated news stories to battle isolationist or neutral sentiments. In one
    case, they discovered that one of the political parties was taking donations from
    the Nazis. It’s unclear how effective their efforts were, but it’s likely the
    British had some influence on U.S. elections.


    The truth is, every election, presidential or otherwise, is “interfered with”
    by some outside force. Every candidate has a series of nations behind him or her,
    loudly or quietly pushing for a win so that they can enjoy a relationship with
    the United States that furthers their goals.


    There has been a series of changes in the past 20 years that has helped the Russians
    to be infinitely more capable than they were before. The first is a technically
    superior workforce of math wizards and computer hackers. What’s more, now the
    government is willing to let those people—criminals, intelligence officers, or
    a combination of the two—work off the books with other nations in an effort to
    weaken U.S. infrastructure. Nations like Iran and North Korea.


    And now they have ample testing grounds. The United States has sold or deployed
    its technology to many places across the globe. The United States is far less
    concerned about cyberattacks against infrastructure in Brazil or Ukraine or Mexico.
    But it’s the same infrastructure.


    The only way cybersecurity people get to be any good in this field is by doing
    the work. And for decades Russia has used the world as its lab.


    Then there is the matter of shaky alliances. The ease of digital recruitment.
    Convincing government malcontents to give up their credentials is an art form
    that grows easier with the vast global exposure of the internet. But there’s one
    thing that will never change and that, paradoxically, is the very human proclivity
    to change one’s mind.


    In Russia and other hotbeds of cybercrime, there is a long-established precedent
    that each individual employee, every government agent, each operative could wake
    up one morning with a sudden, irrevocable desire to pivot, to change directions,
    to switch sides.


    **René lies in bed, sick,** feverish all over. She’s pregnant. She’s panicked,
    because she didn’t think she could get pregnant. She worries Sig won’t believe
    her. She checked the box of condoms he’d bought, which he says he has been using.
    But there is the box, unopened, shoved in a drawer in the bathroom, still in the
    bag.


    Had he not been using them? She knows what he will say if she asks this question.
    He’ll say she was delusional. Crazy. There was no way to bring it up without being
    accused of always accusing him of things.


    “I treat you like a queen and this is what I get in return.” His face will go
    from that pleasant mildness, that big, white smile, to teeth-baring rage in nothing
    flat. He will say she was seeing things, hearing things. “Maybe we need to get
    you to a psychologist?” he’ll spit at her.


    By June, she’s figured out she is three months pregnant. She has been so busy,
    so distracted, that she hasn’t noticed the missed periods. It is Sig who notices
    she is looking bigger around month two. He rids the house of carbohydrates. Insists
    she eat a diet of lentils and small portions of skinless chicken. She’s hungry
    all the time, and now she knows why.


    So she waits for him to come home. He said he was going to Bucharest to meet a
    business contact. Or was it an old friend? A cousin? She can’t remember. It is
    all so mysterious; he is always so mysterious about where he is going and what
    he is doing.


    He will be home late, past midnight. She hopes he isn’t in the mood for sex when
    he gets home. She can’t sleep because now that she knows she is pregnant, she
    can think of nothing else.'
