- raw: 'Attacks are inevitable. The Defense Department sustains them daily, and the
    Defense Department is a war machine. A bank is not a war machine. It can’t fight
    back, only defend. And even in that defense, the enterprise is constrained by
    the scenarios it has planned for. Those scenarios are recorded in the reams of
    paperwork. They are often theoretical, historical, or invisible—as in, nobody
    of significance will ever see that they happened—a fact that keeps the security
    function itself invisible.


    That’s why the DDoS attacks changed everything. Some executives have started to
    see the bank as a war machine. Some begin to view the bank as, at the very least,
    subject to a potentially high degree of embarrassment—called reputational risk
    in business speak—if it fails.


    The cybersecurity staff got their chance to propose what they would do with a
    huge new budget. In response, Caroline and her team created one of the most ambitious
    series of PowerPoint budget proposals the world has ever seen. They asked for
    a lot of money and they got it. Many millions flowed into cybersecurity’s budget.
    They built up the SOC. Better people came to work there. Paper wins again.


    Then things took an unexpected turn, way out of the control of any of the people
    who did the work of cybersecurity. The bank’s chief operations officer got his
    brother involved. Executives became obsessed with finding a marquee name to match
    the budget. Somebody who looked fantastic on paper, who had written books about
    cyberwar. Because they were a war machine now, right?


    Enter Bob Raykoff.


    There is a widely held view in the corporate world that luxurious, high-profile
    surroundings are necessary to keep the money flowing because money begets money.


    But cybersecurity people, even the technical ones, don’t need, nor do they necessarily
    like, expensive technology. Movies and television have misled their audiences
    on this point, because so much of what the analysts do involves sitting in chairs,
    eyes darting back and forth, calculating risks based on variables that constantly
    change. You don’t need expensive accoutrements for that.


    Impressive neon graphics and world maps with blinking lights representing attacks
    are just a veneer, code on code. What most of the workers in the SOC see all day
    looks more like the above.


    ![image](images/img_049-01.jpg)


    They also aren’t terribly comfortable with being seen themselves. It quickly became
    a practical joke to flip the switch on the fog wall. Whenever this happened, rather
    than look out the clear glass, everyone simultaneously looked at the data on the
    plasma screens. They wanted to be sure nothing real incriminating was up there.
    Once safety was assured, then, perhaps, they would laugh.


    Only a small handful of people truly care how the office looks, but it is one
    of Caroline’s many jobs to care about this. The appearance of success and power
    confers actual success and power. Expensive art lines the walls of even the most
    modest meeting space. The bank displays Teddy Roosevelt’s hunting rifle in a conference
    room on the fiftieth floor. The SOC is the cybersecurity equivalent of Teddy Roosevelt’s
    hunting rifle.


    You can’t do good security without good security people, and really good, talented
    security people don’t generally want to work in a bank. It costs money to rip
    them away from Silicon Valley, away from start-ups, away from Google and Apple.


    There is no sign marking the SOC yet. The glass stays opaque most of the time.
    In order to enter the SOC, you have to know it’s there. Then you need to notice
    the seam in the honey oak wall partition. That’s the door, but there’s no handle.
    There’s a small electronic strip where you can swipe your security badge, but
    if you’re not one of about 30 people out of 300,000 employees, you won’t get access.
    So you have to knock on the wall.


    On this day, as on most, Raykoff is nowhere to be found. His new office is in
    the reception area. It holds a row of six chairs and six desks in trader formation
    all facing south toward the floor-to-ceiling windows. It’s so bright in there,
    the employees sometimes have trouble seeing their screens. There are usually only
    two people: a government relations person and the head of intelligence. They are
    support staff for the SOC. Government relations—a tall, angry Arab American ex-spook
    named Gabe who constantly drinks Red Bull—makes sure everyone from the FBI, NSA,
    DHS, branches of the military, and CIA feel like they are looped in. Gabe’s job
    is to hold their hands and make sure they are invited to luncheons.


    The head of intelligence, a quiet, brilliant Korean American ex-spook named Tom,
    takes all of the news and information feeds from the guys inside the SOC and turns
    it into a predictive report about what the next threat will be and where it will
    come from.


    On this day, Caroline realizes she left her keys in the SOC. She sprints back,
    swipes her card four times to get back into the building, runs up the stairs,
    goes through security reception, and returns to the SOC, where she grabs her keys
    and quickly turns, glancing out the south-facing floor-to-ceiling windows. Sunlight
    floods the room and the view makes her catch her breath. It’s so clear you can
    see all the way down Vanderbilt Avenue. She sighs. This place is her baby, too.


    This is the house that nation-state hackers built.


    **In August 1994, a** hacker named Vladimir Levin transferred $10 million, the
    equivalent of $250 million in 2018 dollars, via the telecommunications network
    to accounts in Sweden and Denmark. He had infiltrated the core banking components
    of the interbank wire system and intercepted communications channels between Citibank
    and the Depository Trust & Clearing Corporation, an intermediary that monitors
    and approves international wire transactions. It wasn’t the first time somebody
    had stolen money from a bank using computers, but it was one of the biggest, most
    visible, and most highly publicized heists.


    Citibank used a great deal of technology in 1995, but they had no cybersecurity
    department. They had a physical security staff. But the types of data breaches
    they’d dealt with in the past were more along the lines of an overturned truck
    on the New Jersey Turnpike that had been carrying data tapes to a storage facility.


    The Levin incident would lead to the bank creating the first-ever chief information
    security office. The new department would help protect the bank’s money. Not the
    data of its people, not the intellectual property or proprietary trading information.
    The money. Because back then, that’s what people wanted to steal. Because they
    could. Russia allowed Levin to be extradited. He was later picked up at Heathrow
    Airport in London, flown to Manhattan, and sentenced to three years in jail for
    his crimes.


    Hackers like Levin were 15 years ahead of the banks. Money is money, and when
    it’s gone, it’s gone. Citibank pumped funds into its new cybersecurity office,
    and other banks followed suit. In about a year, thefts of money directly out of
    bank coffers stopped almost completely.


    Hackers had to find new things to steal in order to make money. It didn’t mean
    they stopped targeting the banks, it just meant that they eventually gave up on
    trying to break into them and steal dollars. They turned to other things they
    could monetize, then to other types of companies that dealt in financial transactions,
    then to other types of companies, period. The practice of intercepting financial
    communications never ended, only the practice of specifically trying to intercept
    communications between banks and clearing houses. The targets changed but the
    tactics stayed the same.


    Identities, bank account details, birth dates, credit card numbers, and maiden
    names became the new commodities. None of those things, of course, is money. When
    these things are stolen, they aren’t really gone; they can be replaced. Because
    they are perceived as less valuable than money, it’s harder to lock them down.'
