- raw: '“I can get some at the store. Later. Tomorrow. Next week.” *Whenever suits
    you, my love*.


    He smiles. She smiles back.


    She picks up a month-old newspaper from the rack. Reclines on the couch. He reads
    the unspoken signal.


    *It’s your turn to mind the children*.


    He drops down to the floor on his hands and knees. “Who wants to ride the horsey?”


    The children cry: “Me! Me! Me! Damn! Damn! Damn!”


    **René Kreutz is exhausted.** Eight-months-pregnant exhausted. She reclines on
    her side on the couch while Sig clicks away at his laptop at the kitchen table.


    He’s been bothering her for days to go downtown and set up her own bank account.
    She has no idea why. *It’s utterly ridiculous*, she thinks. He insists it’s for
    the baby. His arguments make no sense, and she’s too tired to do anything about
    it other than politely decline.


    She doesn’t want to go into town and risk running into someone she knows. She’s
    embarrassed about being pregnant. She’s perpetually embarrassed these days. The
    girl who never got herself into hot water is boiling.


    She drifts off into a sort of half sleep. In her daydream, she goes through the
    motions of what a best-case-scenario childbirth will be like. The epidural. Sig
    by her side, offering support. Nice nurses dressed in white. She’s in the bedroom,
    the same one where she was born. Her mother will come later, after the birth.


    “Could you stop breathing so loudly?” he says, startling her slightly. She complies,
    staring at the wall in misery. She’s frowning without realizing it, something
    Sig forbids in the house. He looks up. “What did I tell you about frowning at
    me? Why don’t you smile sometimes? You need to smile more. You look old like that.”


    She smiles at him, but he’s staring at her. He looks afraid, an unusual expression
    for him.


    “Yes?”


    “Look at your legs.”


    René looks down.


    Blood everywhere. She hates blood.


    René turns white as a cloud and passes out.


    ## **16.**


    ## The Recruiters


    **The market for cybersecurity jobs** is hot and it’s not likely to change anytime
    soon. There are so many open jobs and so few people who can do them that many
    firms predict millions of open jobs over the next 10 years. Far more of those
    jobs will go unfilled globally, where skills are in even shorter supply than they
    are in the United States.


    Cybersecurity education is deficient. It’s hard, if not impossible, for people
    to get experience in the field, and many of these jobs require experience.


    The following are generalizations, but legitimate ones: People with strong technical
    backgrounds frequently have a hard time making it in the corporate world. They
    may, like Victor Tanninberg, be excellent programmers and exceptional mathematicians,
    but they have little taste for politics, paperwork, or being required to show
    up between the hours of nine and five. Some people hate wearing a suit; others
    can’t follow rules.


    People with a corporate background often can’t get the experience necessary to
    transition to security. They may be excellent at managing projects or leading
    a team of people, but the rote requirements for cybersecurity jobs—various certifications,
    for instance—keep them out of those roles. An investment of six weeks can turn
    a generalist into a good cybersecurity professional. Somebody talented, like Charlie
    Mack, for instance, can come from an intelligence and security background with
    a law degree and can learn the cybersecurity side in an instant. Most companies
    aren’t willing to take that kind of gamble.


    People in the military have a full range of security skills, but they get little
    help going from the highly structured environment of the government to the free-for-all
    that is the private sector. Some big corporations, like NOW Bank, tackle this
    by giving veterans mentors who can help them understand the protocols of the enterprise.
    Chief among these lessons is that crossing hierarchal lines is more acceptable,
    and sometimes even preferred, in a corporation than it is in the military.


    This type of mentorship has helped countless veterans make a smooth transition
    to lucrative cybersecurity careers, like the employees Caroline Chan plucked out
    of obscurity to work at NOW Bank. However, military brass like Bob Raykoff, who
    have been in leadership positions for a substantial amount of time, don’t always
    think they need this type of training, and before they know it, they inadvertently
    alienate huge segments of their organizations.


    There is, as Victor points out, a significant lack of experts who are both proficient
    and savvy enough to do truly original cybersecurity work. The very good ones are
    quickly courted by the largest technology companies, followed by the banks and
    start-ups, with other types of companies, like healthcare firms and hedge funds,
    bringing up the rear. Those who are left often go to the government. There are
    many government cybersecurity employees who are highly proficient and true believers
    in their mission, but no one is under the illusion that a good hacker will be
    satisfied with making $50,000 a year for the National Security Agency when he
    could be pulling in four times that much at Google.


    There is also a lack of people with truly good social-engineering skills. When
    a malicious person calls you and convinces you they are a help desk employee and
    you need to give up your username and password to prevent a problem, that’s social
    engineering. When he says he’s a Nigerian prince and needs your help, that’s social
    engineering. When they open an account under a fraudulent name and identity at
    a bank branch, they are socially engineering the bank branch manager with a wink
    and a smile.


    This is social engineering, taken from the 2018 indictment of 12 Russian hackers
    accused of infiltrating the Democratic National Committee:


    *On or about June 8, 2016, and at approximately the same time that the [dcleaks.com](http://dcleaks.com)
    website was launched, the Conspirators created a DCLeaks Facebook page using a
    preexisting social media account under the fictitious name “Alice Donovan.” In
    addition to the DCLeaks Facebook page, the Conspirators used other social media
    accounts in the names of fictitious U.S. persons such as “Jason Scott” and “Richard
    Gingrey” to promote the DCLeaks website. The Conspirators accessed these accounts
    from computers managed by POTEMKIN and his co-conspirators. On or about June 8,
    2016, the Conspirators created the Twitter account @dcleaks\_. The Conspirators
    operated the @dcleaks\_ Twitter account from the same computer used for other
    efforts to interfere with the 2016 U.S. presidential election. For example, the
    Conspirators used the same computer to operate the Twitter account @BaltimoreIsWhr,
    through which they encouraged U.S. audiences to “\[j\]oin our flash mob” opposing
    Clinton and to post images with the hashtag #Blacks-AgainstHillary*.


    People who can do this type of work are incredibly hard to find, because they
    often don’t realize they can do this type of work. Having a technology degree
    doesn’t help, but being a social butterfly certainly does.


    This is why Russian intelligence operatives have thrown in with criminals, because
    they are good at these things. They aren’t wonks. They find your soft spots. This
    is why Bo Chou, when he decides to go legit, will be so good at his job in Singapore—because
    unlike many other strong technicians, he knows that running down a taxicab and
    rescuing a customer’s passport is a key to success despite the fact that there
    is no immediate payoff for him.


    It is also why, when René wakes up in the hospital, she will be eminently employable.
    Even if, in a fog of shame, she doesn’t realize it yet.


    **“Placenta previa,” says René.** Her mother cuddles the baby, a boy, not yet
    named. “That’s what they called it.”


    It was the lining of her uterus. Stuck in the wrong place. It caused some bleeding
    and she had to have an emergency C-section. Baby is fine. Mama is fine. She is
    in pain, but opioids are making everything better.'
