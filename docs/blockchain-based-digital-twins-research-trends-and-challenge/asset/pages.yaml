- pgno: 336
  md: 'policies, rules, and operation of DT can be maintained securely in Blockchain.
    The architecture of blockchain is classified into three categories private, public,
    and consortium blockchain. Access permission, consensus determination, and level
    of immutability are determined based on the kind of architecture adopted. In our
    proposed framework for DT-based predictive maintenance, the status information
    of different machine parts needs to be tracked by different organizations. Hence,
    consortium-based architecture is considered to be more suitable.


    Consortium blockchain is a hybrid form of private and public blockchain. The sensor
    data which exhibits the current status of the real-time machine parts and DT need
    to be maintained in the blockchain for predictive maintenance. It can ensure data
    accountability, security, and transparency among the members of different organizations
    who are involved in the predictive maintenance process. In the proposed framework,
    two different blockchains are constructed in order to improve the efficiency of
    the learning model: Digital Twin Blockchain (DTBC) and Real-time Machine Blockchain
    (RBC). RMBC carries a chain of blocks with data obtained from the real-time physical
    entity to be maintained whereas DTBC includes blocks that carry information obtained
    from the DT.


    # 10.3.3.1 CONSTRUCTION OF RMBC


    In this section, the steps for creating a blockchain are discussed.


    +   Step 1: Creation of Aggregate Data Structure: Each block in the blockchain
    carries the data used for tracking the state of individual parts of the machine
    to be maintained. The data stream generated by the sensing devices that are fixed
    in the machine equipment is to minimize the cost of storage and communication,
    the number of blocks in the blockchain is to be reduced. This can be achieved
    by aggregating the stream of data which is generated by the sensing devices. For
    each major part, the virtual entities used to describe the state of the part are
    collected'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'by edge computing devices that act as aggregators. The aggregator computes
    the aggregate representation of all the virtual entities. These aggregates are
    grouped based on the parts to which they belong. Depending on the block size,
    either a separate block for each part can be created, or aggregates of multiple
    parts can be stored in a single block along with part identification and time.
    This information helps to track the status of machine parts at different times.
    The possible aggregate functions are SUMMATION, AVERAGE, COUNT, MAXIMUM, or MINIMUM.
    The description of the aggregation function is provided in Table 10.1. Depending
    on the kind of virtual entity and the parts to which it belongs, different aggregation
    functions can be applied. Hence, information regarding the kind of aggregate function
    has to be stored along with the aggregate. Figure 10.7 exhibits the structure
    of data which describes the state of a machine part to be stored in the chain
    block. Let the values that occurred during the particular time intervals be $v_{1},v_{2},...v_{j}$.


    # TABLE 10.1 Aggregation function


    | Aggregate Function | Description |

    |---|---|

    | SUMMATION | $\sum_{i=1}^{n} v_{i}$ |

    | AVERAGE | $\frac{\sum_{i=1}^{j} v_{i}}{j}$ |

    | MAXIMUM | maximum $(V_{1},V_{2},...,V_{j})$ |

    | MINIMUM | mininmum $(V_{1},V_{2},...,V_{j})$ |

    | COUNT | ''j'' |'
