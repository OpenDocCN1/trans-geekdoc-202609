- pgno: 333
  md: '# 10.3.1 PRE-DESIGN PHASE


    In this phase, information required for constructing the DT so that the DT will
    imitate the functionalities of real-time physical machines is identified. The
    required information is classified into functional information and operational
    influencing information. The functional information provides insight into the
    sequence of operations to be replicated by the DT for predictive maintenance like
    parts of the equipment, the functionality of each part, physical characteristics
    of each part, operational sequence, logical and physical connection among the
    parts, etc. The operational influencing information refers to the factors that
    affect the performance of the machines and external factors that influence the
    function of machines like temperature, oil, number of hours operated, humidity,
    etc.


    +   1. Virtua Entity (VE): Based on the information identified in the pre-design
    phase, virtual entities corresponding to their physical counterparts and additional
    virtual entities required so that the functionality of physical parts can be replicated
    in the DT need to be identified.


    +   2. Hierarchy Relation of VE: The collection of virtual entities and the hierarchical
    relationship among them creates the virtual representation of the physical entity
    to be imitated by the DT. Hence, based on the operational sequence of the physical
    entity to be replicated, the hierarchy of the VEs has to be created by establishing
