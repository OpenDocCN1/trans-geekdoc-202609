  md: '# CHAPTER 10


    # Blockchain-Based Digital Twin for Predictive Maintenance of Machines Using Machine
    Learning


    D. VINODHA,1 E. A. MARY ANITA,1 PADMAVATHY THIRUNAVUKARASU,2 and P. GEETHA2


    1CHRIST (Deemed to University), Bangalore, Karnataka, India


    2Department of Computational Intelligence, SRM Institute of Science and Technology,
    Kattakulathur, Tamil Nadu, India


    # ABSTRACT


    Digital Twin (DT) is a software replica of the physical asset or process that
    serves the automobile industry by empowering engineers and data scientists to
    gain a deeper insight into the system and solve the biggest challenges with less
    time and cost. Blockchain technology is an evolving and promising technology that
    foreseen providing surveillance facilities for DTs, resulting in firm up security
    and improving the openness, reliability, and unchangeability of DTs. By incorporating
    intellectual behavior in blockchain-based DTs, the functions of machines can be
    governed parallel, and the major maintenance activities can be predicted effectively.
    This chapter explores the design of various frameworks using recent technologies.
    Some of them are DTs, blockchain, artificial intelligence, and the Internet of
    Things which drive resolution in the industry to minimize the governing cost of
    machines.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# 10.1 INTRODUCTION


    Machine maintenance is vital in any industry or plant that utilizes mechanical
    parts. It helps industries meet production schedules and improve safety by preventing
    accidents and injuries due to faulty machinery. Regular maintenance is the key
    point for enhancing the performance level and longevity of machines. The major
    classification of maintenance includes proactive and reactive maintenance. In
    reactive maintenance, only broken machines will be brought into working condition
    once they are found to be repaired [1]. But we need to wait until something goes
    wrong with the machine.


    Proactive maintenance is carried out in three forms: preventive, conditional-based,
    and predictive maintenance [2]. In preventive maintenance, the machinery is maintained
    at predetermined intervals without considering the current state of the machines,
    whether it is good or bad. Condition-based maintenance does not require preplanning,
    but the machines need to be monitored regularly. Once a change is sensed, the
    machines start to display problems that can be sensed by the sensor, and the maintenance
    process is carried out. The third kind of proactive maintenance, predictive maintenance,
    is considered to be more important than the other two. Predictive maintenance
    combines the strength of preventive and conditional-based maintenance.


    The condition and performance of the machines are regularly monitored and tracked
    using the real-time data collected using the sensors. The need for maintenance
    is predicted by analyzing the machines’ condition using this historical data.
    These predictions help the organization to prevent unexpected failure of the machines
    and hence avoid costly downtime. The Internet of Things (IoT) plays a major role
    in monitoring machines regularly [3]. With the'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'advent of industrial automation and the technological boom, industries have
    shifted from condition-based maintenance to predictive maintenance.


    The major benefits of predictive maintenance:


    +   1. Fewer Failures of Machinery: Regular monitoring of the machine conditions
    and process systems helps to minimize failures by predicting the need for maintenance
    in advance.


    +   2. Increased Equipment Lifespan: Prevention of failure reduces the severity
    of impairment and the dissemination of defects. It helps to improve the lifespan
    of machines.


    +   3. Effective Management/Decision Making: The ability of predictive maintenance
    to use real-time data enables managers to make decisions on when to replace machinery.


    +   4. Increased Safety: Early prediction of problems minimizes the possibility
    of fatal accidents and injuries.


    +   5. Cost Reduction: As predictive maintenance predicts the health status of
    the machines and decides when the parts need to be replaced or repaired, the need
    for unnecessary inspection and maintenance can be avoided. Hence, the cost incurred
    due to this unnecessary maintenance can be eliminated.


    The effectiveness of predictive maintenance relies on three major components which
    are depicted in Figure 10.1.'
  merge: -1
  img_proc: true
