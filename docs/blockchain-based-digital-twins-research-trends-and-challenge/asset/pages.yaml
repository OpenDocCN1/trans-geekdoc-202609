    # 4.3 INTRODUCTION TO BLOCKCHAIN


    Blockchain technology is a distributed, immutable database that monitors asset
    and business transaction processes. A material asset, such as a home, money, vehicle,
    or plot, or an intangible asset, such as a patent, intellectual property, copyrights,
    and brand awareness, can be monitored by a blockchain network. This network can
    record and trade almost anything of value, reducing risk and lowering costs for
    parties during transactions.


    In other words, Blockchain preserves data and information in a digital format
    without the need for a central authority. Data is gathered from numerous sources
    and organized into blocks on a Blockchain. Additionally, after they are full,
    these blocks link with subsequent blocks after including the sets of information.
    Thus, this network of data links and chains is referred to as a blockchain. Additionally,
    it stores the data and uses cryptography to link the blocks together.


    # 4.3.1 FEATURES OF BLOCKCHAIN


    Blockchain consists of the following features [9]:'
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   1. **Decentralization**: The term “decentralization” describes a blockchain
    network that is not controlled by a central authority or intermediary. A blockchain,
    on the other hand, runs on a globally dispersed network of nodes (computers) that
    each keeps a copy of the complete blockchain.


    +   2. **Immutability**: This is a blockchain that refers to the characteristic
    of data being permanent and impervious to tampering once it is added. Data that
    has been stored in a block and uploaded to the blockchain can no longer be changed
    or removed. Consensus techniques and cryptographic hashing are used to achieve
    this.


    +   3. **Consensus**: The network’s users must reach a consensus on its validity
    using a consensus mechanism. Only authentic and valid transactions are added to
    the blockchain as a result of this agreement.


    The features of Blockchain are depicted in Figure 4.3.'
  merge: -1
  img_proc: true
