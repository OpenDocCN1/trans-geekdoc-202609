    # 6.3 SUGGESTED APPROACH


    The utilization of digital twin technologies in the real world is not always without
    complications. Finding a method to accurately convey and modify simulation facts
    in real-time is one of the main challenges. The information generated by physical
    property may also include sensitive information from information owners, and if
    this information is disclosed to an enemy, serious private difficulties may arise.
    The suggested machine concept makes use of blockchain technology for data verifiability
    and cloud computing for effective fact exchange.


