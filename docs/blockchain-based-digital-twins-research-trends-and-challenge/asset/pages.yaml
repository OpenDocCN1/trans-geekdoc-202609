  md: '# Preface


    Blockchain technology has leveraged most of the manufacturing and service industries
    by deploying inviolable trust. It is the design, the blue-print of a product,
    to the sales and after-sale agreements for the product. All transactions are documented
    well in this distributed ledger. Blockchain has identified many applications across
    industries, such as integrated architecture for handling IoT ecosystems, measuring
    diagnosis accuracy, blockchain-based smart tracing and tracking platforms for
    supply chains, and handling privacy and security preservation of health records.


    Huge growth in the usage of blockchain, with the amalgamation of AI and big data,
    has exploited the potential of the data generated from current industrial practices.
    The trustworthiness of blockchain technology and its digital twin has greater
    reach when compared to traditional systems. The blockchain will intelligently
    automate the generation of smart contracts from the Industrial Internet of Things,
    parallel governance, cybersecurity, and the healthcare sector in providing policy-making
    processes.


    Today, the parallel existence of blockchain-based digital twins influences AI,
    ML, and IoT to integrate smart contracts across industries. In the real world,
    document frauds are very common; thus, blockchain-based smart contracts will help
    mitigate this problem and assist in easy record-keeping from the beginning of
    the contract until the end. The smart contract will be viable to assist in legal
    proceedings.


    The world is keen to leverage multi-faceted blockchain techniques to deploy and
    deliver newer business models. Recent times have witnessed tremendous growth in
    blockchain technology, its related framework, and the'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'coexistence of digital twins. These come in handy in replicating the physical
    world with cyber-physical space. Resource-intensive service models spread across
    a variety of environments (including smart contracts, smart supply chain management,
    etc.) are meticulously empowered with blockchain-based digital twins. These facilitate
    blockchain-based digital twin processes to join the mainstream world. All kinds
    of connected products are collectively and/or individually enabled to be secure
    in their operations, offerings, and outputs. The edited book on blockchain-based
    digital twins addresses the next-generation technology to actualize secure systems,
    networks, and environments.


    In the case of smart contract execution in cyberspace, the use of digital twin
    technology will help in fixing the authority and responsibility of the parties
    involved. The research trends for blockchain-based digital twins in Agriculture
    4.0, supply chain management, and smart logistics are evolving, and the future
    directions for a suitable policy and framework are the need of the hour.


