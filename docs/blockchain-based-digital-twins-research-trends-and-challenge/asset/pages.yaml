- pgno: 42
  md: 'In healthcare systems, patient histories are digitally recorded as a chain
    of blocks in a network known as a distributed ledger. This ledger is secured by
    cryptography and timestamped to ensure its integrity and accuracy. The ledger
    is contributed to by various healthcare providers, such as nurses, surgeons, doctors,
    and lab technicians. Due to its decentralized nature, this data cannot be easily
    hacked or altered by any single party, since any changes made to the ledger must
    be validated by the other contributors in the network. This ensures that the data
    is reliable and secure and cannot be reversed or manipulated [31].nA simple use
    case of healthcare:


    +   - Step 1: The information of the patient is collected by the health-care providers.

    - Step 2: The patient information is stored in the database.

    - Step 3: A hash key is created for each block of data and is given to the blockchain.

    - Step 4: The patient key access to maintain the privacy of his/her data and decides
    whom to give access.

    - Step 5: Once a patient has permitted a doctor to access their medical data,
    the smart contract code present in each block of the distributed ledger is executed.
    The code verifies the permission and authenticates the doctor’s identity. If the
    doctor’s identity is authenticated and permission is granted, the hash key is
    matched with the specific block where the data is stored. The smart contract then
    allows the doctor to access the patient’s data in that block, ensuring that the
    data is secure, tamper-proof, and only accessible to authorized parties.


    Using blockchain technology in healthcare has two primary benefits. The first
    is that the system is patient-centric, which means patients own their medical
    records. However, they cannot modify or delete any data within the blockchain.
    The data is created by healthcare providers, and patients have'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'access to it. Furthermore, no one can access a patient’s information without
    their explicit permission, which solves privacy concerns within the healthcare
    system.


    The second advantage is that blockchain stores all the medical history of a patient
    in a secure, decentralized ledger. This means that when a patient goes to a new
    doctor or healthcare provider, they can access the patient’s complete medical
    history on the blockchain, without having to repeat any tests or procedures that
    have already been done. This improves the efficiency and effectiveness of healthcare
    delivery, as doctors can provide better, and more informed care based on the patient’s
