    # 11.2.1 PROBLEM STATEMENT


    Many countries'' development depends on agriculture. Increasing world population
    and estimations show that in 2050 the population will be approximately 9 billion.
    Due to urbanization, people are moving to cities, specifically, 65% of people
    are residing in cities. It causes challenges in shelter and food production. Not
    only is the population increasing, but also the availability of areas is not.
    Due to this fact, agriculture needs to be improved in terms of production with
    fewer resources. The other main problem in agriculture is crops that are damaged
    due to diseases and insects. Even though insects help to maintain soil structure,
    fertility, and nutrients, pathogenic organisms like bacteria, viruses, and protozoa
    cause diseases in plants. This results in an average of 40% loss in agricultural
    production.'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'To overcome the problem, an idea of Digital technology is planned to monitor
    the farmland and crops. It enables the simulation models in the digital world
    to reflect in the physical world. Using this particular technology, the efficiency
    and growth of agriculture can be increased. In the proposed method, AI, IoT, and
    machine learning are integrated, requiring more memory space. To reduce the memory
    space, blockchain technology is used. Therefore, the data and records are encrypted.


    # 11.3 PROPOSED METHODOLOGY


    Digital twin connects the virtual and real world by gathering-time data from IoT
    sensors and cameras. Through this process, the physical product can be represented
    in the digital world. This technology has a significant impact on development,
    production, and processes. In agricultural fields, IoT sensors such as optical
    sensors, electrochemical sensors, moisture sensors, location sensors, and temperature
    sensors are used to create a database. Additionally, the data may be stored either
    in a decentralized manner or centrally in the cloud. The collected data is processed
    using big data techniques. Subsequently, the data is tested and simulated in digital
    assets. Once the optimal solution is obtained from the simulation, it is applied
    to crops.


    It helps in optimizing the performance of crops and plants. Digitalization of
    digital twins along with AI is more effective. Specifically, AI is employed to
    select the simulation options that have the highest chances so that AI reduces
    the amount of simulations to evaluate and to store. Blockchain contains the records
    of the data from simulations, which are then applied to crops based on the analysis
    of data. Finally, the digital twin connects all the data collected in each technology
    together into a virtual model as shown in Figure 11.3.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '![](img/5575f2d1bada0bd1c2731bf9be91c7c9_361_0.png)


    # 11.3.1 WORKING


    In the proposed process, two places exist. One is the field area. In that, plants,
    crops, and some gadgets are available to obtain real-time data. The second part
    is the simulation center. In that, the current ongoing process can be viewed,
    along with previous actions and details of past data stored in a specific space.
    The future process of the crops can also be predicted. In simple terms, real-time
    input is collected from the field area, transmitted to the simulation center,
    processed, and stored as shown in Figure 11.4.'
  merge: -1
  img_proc: true
