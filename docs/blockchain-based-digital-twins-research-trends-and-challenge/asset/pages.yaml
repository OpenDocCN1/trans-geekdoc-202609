    and the expectations of individuals will continue to morph and grow. The requirements
    are being easily and elegantly met thanks to the proliferation of groundbreaking
    technology, both individually and jointly [1]. Because of the proliferation of
    Internet of Things devices in the surroundings which we live and work, there is
    a growing demand to endow these devices with the necessary intelligence so that
    they can demonstrate adaptive behavior in their'
