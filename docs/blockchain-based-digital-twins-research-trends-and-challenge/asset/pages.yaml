    # 11.1 INTRODUCTION


    Most of the countries are agricultural-based nations. Agriculture is very important
    because it is the source of our life. In fact, in India, 68% of the people are
    based on income from agriculture and allied sectors. It is the main source of
    human food. Even small-scale productions and cottage businesses depend on farming
    production centers. Not only for food but also in our daily lives, all the necessary
    products are produced by agriculture (meaning all products'' raw materials are
    from agricultural plants and trees). Therefore, in the current situation, the
    population is increasing drastically. Similarly, with the increase in population,
    pollution is increasing. The nutrient level in the soil has decreased significantly,
    and the soil is heavily affected by the chemicals entering the rivers and lakes
    [1].


    Due to the decreased nutrient level, crops are being affected at an early stage.
    After the nutrients, crops are further affected by pests and fungi at a'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'higher rate. Even though farmers use pesticides and fungicides to control them,
    the crops still get affected. Moreover, farmers cannot identify all these issues
    at an early stage. Therefore, there is a need for automation to identify and address
    these issues at the initial stages. Looking at automation in agriculture, there
    are many innovations in management [2]. However, all these advancements face a
    common challenge, which is the collection, storage, and processing of data for
    management.


    As agricultural fields contain millions of crops, the data collected for further
    processing is extensive. There is no backend option to retrieve this data for
    future use. Therefore, we decided to create a blockchain integrated with big data
    automation to monitor the crops, along with Artificial Intelligence (AI) to predict
    diseases at an early stage [3]. In the blockchain component, the data collected
    from the automation process is stored in the cloud for easy access at any time
    and for seamless transmission to the AI for evaluation metrics. Big data is utilized
    to store the large data extracted from the blockchain and real-time data for analysis.
    By using this data, the AI predicts diseases and provides information to the digital
    twin to visualize the real-time condition of the specific crop with the location
    indicated, as shown in Figure 11.1.


    ![](img/5575f2d1bada0bd1c2731bf9be91c7c9_355_0.png)


    # FIGURE 11.1 Outline of the entire process.'
