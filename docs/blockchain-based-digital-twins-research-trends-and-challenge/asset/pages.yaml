  md: '# 7.3.3 COMPONENTS OF BLOCKCHAIN


    +   1. **Data Block**: Blocks that make up a blockchain reveal events that have
    taken place on the platform. The transactional data can be provided as information
    sharing or as a token transmission procedure that takes place in a system.


    +   2. **Ledger Distribution**: A distributed ledger is a database that is replicated
    and shared among all nodes in a network. Any user on the network can access this
    central repository of information. Keeping track of deals is similar to how people
    in a network exchange information with one another. In a decentralized setting,
    where no trusted party is required to supervise the system''s operation, the participating
    nodes can automatically come to an agreement using a well-established consensus
    method. Since each entry in the ledger is stamped with a unique cryptographic
    signature and timestamp, the entire database can be verified and never altered
    after it has been created. Any alteration to the transaction will produce a new
    hash inside its branch, which can be easily detected using computational speed
    and efficiency.


    +   3. **Consensus Algorithm**: In a blockchain system, there are no centralized
    organizations to control and enforce the standards governing transactions or protect
    data from security risks. Consensus algorithms seek to update the replicated shared
    states and ensure that at any given time, all replicas of the shared states are
    synchronized and in agreement. A blockchain''s consensus method is a technique
    for several untrustworthy nodes to decide on a single data log.


    +   4. **Smart Contracts**: To monitor and conduct transactions in line with specified
    terms and conditions, blockchain applications known as smart contracts are used.
    To be more precise, a smart contract is a “digital representation of a temporary
    economic agreement between two or more parties.” Unlike traditional contracts,
    which rely on centralized'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'authorizing entities to enforce their terms and conditions, smart contracts
    on a blockchain network do not require such intermediaries to function properly.
    Smart contracts have become more popular in the blockchain community since the
    first smart contract platform, Ethereum, was released in 2015. Another name for
    a smart contract is an “autonomous agent” or a “self-executing engine.” As soon
    as the criteria specified in the contract are satisfied, the code automatically
    carries out the contract’s established provisions, a concept known as “self-execution.”


    # 3.3.4 TYPES OF BLOCKCHAINS


    Blockchains can be divided into a variety of sorts, each with its unique characteristics,
    depending on how they are utilized. Generally speaking, there are three types
    of blockchains: public (or permissionless), private (or permitted), and consortium
    (or federated).


    +   1. Public Blockchain: Because a public blockchain is an open and accessible
    network, anyone may join, conduct transactions, and take part in the consensus
    procedure. It also goes by the name “permissionless blockchain” and operates entirely
    decentralized and dispersed. Anyone can keep a copy of the blockchain and participate
    in the process of validating new blocks thanks to the permissionless blockchain.
    Typically, cryptocurrencies like Bitcoin and Ethereum employ this kind of blockchain
    technology. As a high number of anonymous nodes can often run on a permissionless
    blockchain, it is crucial to prevent malicious activity.


    +   2. Private Blockchain: On the other hand, a private blockchain is an exclusive
    network controlled by a single entity. To publish or issue transactions on this
    blockchain, all parties must first receive permission from a validation process.
    This suggests that every node joining a private blockchain is a recognized and
    approved employee of a single company.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "A private blockchain is often appropriate for a single enterprise solution\
    \ and utilized as a distributed synchronized database to track information flows\
    \ between several offices or people. Particularly, the incentive mechanism is\
    \ not required for a private blockchain to function, hence a transaction processing\
    \ charge is often not required.\n\n+   3. \n**Consortium Blockchain**: If you're\
    \ familiar with the settings of a private blockchain, you'll find that a consortium\
    \ blockchain, also known as a federated blockchain, has a similar permission system.\
    \ Consortium networks typically encompass more than one company and aid in keeping\
    \ everyone on the same page. Information transactions between consortium members\
    \ may be tracked using a consortium blockchain, which acts as an auditable and\
    \ consistently synced distributed database. Consortium blockchains, like private\
    \ blockchains, often incur no costs while processing transactions or publishing\
    \ a new block, both in terms of money and computing resources. The consortium\
    \ blockchain, in contrast to public and private blockchains, is widely used in\
    \ massive industrial IoT systems.\n\nBased on the preceding inquiry, Table 7.2\
    \ compares various blockchain types. Industrial IoT often employs either a private\
    \ blockchain or a consortium blockchain due to the confidentiality and safety\
    \ of manufacturing applications.\n\n# TABLE 7.2 Comparison of Various Blockchains\n\
    \n| | Public | Private | Consortium |\n|---|---|---|---|n| Involvement | All nodes\
    \ | Single system | Nodes are chosen in different organizations |\n| Individuality\
    \ | False anonymous | Valid participants | Valid participants |\n| Admittance\
    \ | Read/write | Restriction | Restriction |"
