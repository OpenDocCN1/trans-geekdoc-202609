  md: 'PREDICTIVE MAINTENANCE


    +   - Reusability of PM model: The major challenge of predictive maintenance is
    the variability in the data and behavior of industrial machines. This is applicable
    for machines working under the same environmental features, making the reusability
    of models difficult for different machines.

    - Though the LSTM adopted in the proposed framework can address the problem of
    vanishing gradient, which is underfitting, by replacing the sigmoid function in
    the hidden layer with ReLU, it converges quickly and suffers from extensive overfitting.


    # 10.4 CONCLUSION


    In this chapter, a novel framework for predictive maintenance of the IoT-enabled
    industry was proposed by leveraging the benefits of edge computing, DT, and blockchain
    technologies. It utilized the LSTM for feature extraction and predicted the major
    maintenance activities like possible time and type of failure of different machine
    equipment and which parts of the machine require replacement or regular preventive
    maintenance activities at what time. The effectiveness of prediction functions
    was improved by managing the DTs of multiple parts of the machine. Parallel governance
    of multiple DTs provides a comprehensive insight into the functionalities of machines.
    The data collected from the DT enables the framework to identify the difference
    between expected target characteristics and the current behaviors of the machine.
    The incorporation of blockchain technology ensures the security of data of different
    machine parts and allows the smooth sharing of it among diverse stakeholders.'
