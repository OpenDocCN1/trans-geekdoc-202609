- pgno: 356
  md: 'Most of the plants are affected by diseases. To control the issue, it is necessary
    to know the status and condition of the plants/crops/trees instantly. Based on
    the plant’s condition, precautionary steps can be taken to maintain high efficiency
    and protect the plants from viruses and diseases. With the ongoing revolution
