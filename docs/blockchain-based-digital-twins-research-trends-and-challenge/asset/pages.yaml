- pgno: 289
  md: 'Three important characteristics of the technology are mentioned in these qualifications:


    +   - The goal of synchronization is to ensure that the represented thing and
    its digital duplicate are as similar as feasible.

    - Depending on the goal, a digital twin’s update frequency or pace can be quite
    variable, ranging from seconds to weeks to on-demand.

    - Fidelity is the level of accuracy and precision of the synchronization mechanism
    and the virtual representation.


    Designers and engineers utilize the same modeling and CAD tools to create digital
    twins throughout the initial product development process. The distinction between
    the digital twin and the traditional twin is that the digital twin is handled
    via Product Lifecycle Management software and retains and updates the model for
    use in subsequent phases of the product’s lifespan such as inspection and maintenance.


    IoT sensors are frequently used as the physical links between the thing and its
    twin, and a developed IoT implementation is frequently needed for digital twins
    [13]. Digital twins are claimed to be equally important to IoT since they give
    otherwise chaotic and challenging-to-interpret IoT data structure, analytics,
    and usability.


    # 9.2.1 PROCESS OF DIGITAL TWIN


    A virtual picture created to perfectly replicate a real-world object is called
    a digital twin. The object under evaluation, such as a wind turbine, is equipped
    with a variety of sensors that have been interconnected to crucial functioning
    areas. These sensors generate information on the characteristics of the physical
    device, including temperature, power capacity, and other parameters as well as
    environmental factors. This knowledge is subsequently applied to the digital copy
    by the processing system. With this information, the system prototype'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'may be used to simulations, look into performance concerns, and propose changes,
    each to produce informative data that can subsequently be transmitted to the actual
    device [14]. Figure 9.2 shows the model for representing Digital Twin.


    ![](img/5575f2d1bada0bd1c2731bf9be91c7c9_290_0.png)


    FIGURE 9.2 Digital twin model.


    # 9.2.2 SIMULATION VERSUS DIGITAL TWIN


    Digital twins and simulations may utilize the virtual model to replicate the multiple
    operations of any system. The digital twin may be more helpful for study because
    it is essentially a virtual scenario. A simulation and a digital twin differ in
    scale. A digital twin may contain many relevant simulations as necessary to simultaneously
    investigate several processes, whereas simulations normally analyze one procedure
    at a time. There are likely more differences. For example, real-time data is frequently
    advantageous for simulations.


    Digital twins, on the other hand, are created to work with multiple information
    flows that start whenever the system processor receives crucial data from object
    sensors. This continues whenever the processor exchanges further information with
    the source object [15]. By providing more accurate and up-to-date data from various
    disciplines, digital twins enhance the'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'computational capability offered by a virtual environment [16]. Since digital
    twins can examine more issues from a wider variety of angles than normal simulations
    can, they have a higher potential to ultimately improve products and processes
    [17].


    # 9.3 HISTORY OF DIGITAL TWINS


    The digital twin technology concept was first introduced in 1991 by David Gelernter
    in the book “Mirror Worlds.” Dr. Michael Grieves, a professor at the University
    of Michigan, developed the idea of DT software and implemented it in 2002. John
    Vickers of NASA then coined the term “digital twin” in 2010.


    However, the basic concept of studying a physical thing with a digital doppeltanger
    was developed much earlier. Figure 9.3 shows the roadmap for the advancement of
    technology in the electronic field.


    ![](img/5575f2d1bada0bd1c2731bf9be91c7c9_291_0.png)


    # 9.3.1 ORIGIN OF THE IDEA OF DIGITAL TWINS AND'
