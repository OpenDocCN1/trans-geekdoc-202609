    # ## 6.4 DISCUSSIONS


    # ### 6.4.1 PERFORMANCE ANALYSIS


    The proposed method evaluated the proposed authentication strategy against newly
    reported techniques [16, 18, 20] in related scenarios.


    +   1. **Computational Cost**: It is viewed as a key breakthrough by the blockchain
    community. The “proof of work” and “proof of stake” consensus algorithms are greatly
    improved as a result, which creates a transparent and efficient framework for
    mining operations. Smart contracts use the computational cost, which is an Ethereum
    unit, to pay miners as are essential to adding and validating transactions to
    the blockchain. Consequently, the pricing of computational expenses may differ
