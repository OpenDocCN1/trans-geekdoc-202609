    # ## 4.2.2 WORKING OF DIGITAL TWIN


    A digital twin contains three main components. They are:


    +   - **Past Data:** It includes historical information, precise systems, and
    complete processes.

    - **Present Data:** Sensor data, outputs from production platforms, and pertinent
    information from systems along the distribution chain are all included.

    - **Future Data:** This is predicted data and insights from input and machine
    learning models.


    The following are three working steps of digital twin [4]:'
  merge: -1
  img_proc: true
- pgno: 132
  md: '+   **Step 1: Data Gathering and Simulation:** The data is athered and then
    simulated into a virtual model. Locally or on a distributed cloud, the gathered
    information is stored.


    +   **Step 2: Applying Cognitive Insights:** When simulation data is received,
    parameters are applied to tangible assets and merged for precise virtual representation.
    The data is reviewed to determine its variations and tolerances. To better understand
    the dynamics of the information being presented, natural language processing,
    machine-to-machine communication, acoustical video analytics, and other approaches
    are used.


    +   **Step 3: Dynamic Recalibration:** The environment around that particular
    gadget is dynamically recalibrated using the gathered information and cognition.
    This impacts the phases of design, build, and operation. The performance of tangible
    assets is enhanced by integrating data into both real-world and digital representations.


