    each one takes a long time to set up; the Bitcoin blockchain cannot perform real-time
    transactions. Currently, only around seven transactions can be processed per second
    on the network. Miners prioritize transactions with a high fee; many lowvalue
    transactions may be delayed because of the limited size of blocks.


