    # ### FIGURE 11.2 Landscape objects to digital representation.


    For modeling and training, the proposed simulation needs some deeplearning concepts.
    All these technologies occupy more memory space. To overcome this specific disadvantage,
    it is planned to process the data and records into another form, i.e., “Blockchain.”
    Blockchain is known as distributed ledger technology. It creates a database of
    digital assets that are chained together and stored for processing. It is decentralized,
    and real-time data can be accessed. Blockchain technology is encrypted and immutable.
    It is used in many applications like healthcare, gaming, and industries. In the
    proposed field, it is used for computing and storing transactions and records.
    Therefore, it improves the efficiency in the transmission of data at a higher
    speed.


    # ## 11.2 LITERATURE REVIEW


