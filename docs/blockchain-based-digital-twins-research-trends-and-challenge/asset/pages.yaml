    # 11.3.2 IOT


    IoT is used to gather real-time data for a simulation [14, 15 and 16]. In the
    proposed process, IoT stands for Internet of Things. It is a technology that uses
    sensors to convert real-time data (analog) into machine-level data (digital).
    The proposed technology mainly involves embedded sensor systems, software, and
    other technologies (such as memory devices, displays, etc.). For the proposed
    simulation, five sensors and a camera for image processing are required: a sensor
    to detect soil moisture, a sensor to measure air humidity, a sensor to monitor
    soil temperature, a sensor to determine crop location and'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'height, a sensor to measure groundwater level, and a camera for image processing.
    The specific image processing falls under deep learning:


    +   1. **Moisture Sensor**: The proposed sensor is used to measure the humidity
    content of the soil. The default range is 0%RH–100%RH. It helps in reducing the
    water used for irrigation. If the moisture content in the soil is adequate, it
    stops the irrigation because, during that time, the crop doesn’t need water.

    2. **Temperature Sensor**: It is used to measure the temperature around the farmland.
    The default range is -40 to +80°C. It monitors the presence of heat in the soil.
    It helps to monitor whether the plant is in need of dry or wet conditions.

    3. **Optical Sensor**: It is used to measure the nitrogen rate. It collects data
    on the condition of clay, organic matter, and humidity properties of the soil.

    4. **Electrochemical Sensor**: These monitor the pH level and nutrient levels.
    Nutrients are essential for the plant to grow. By using the proposed sensor, nutrients
    can be provided based on the level.

    5. **Location Sensor**: These are positioned at different places throughout the
    farm field. They are used to measure the variety, height, and distance of the
    crop plants. They also receive information from Global Positioning System (GPS)
    satellites.


    As shown in Figure , using these sensors, it is decided to fetch data and carry
    out the process as per the data. Because of that, water can be saved. Using the
    wetness of soil, air, and groundwater levels, the water can be utilized as required
    so that it will not be wasted. In IoT, microcontrollers are the brain of the system
    [17]. So, in the proposed method, a microcontroller is used to collect the entire
    output of the sensor (raw data) and process the obtained data (convert into readable
    format) to convert it effectively by using the microcontroller’s communication
    ports universal synchronous/ asynchronous'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'receiver/transmitter (USART), serial communication, parallel port communication,
    Inter-integrator circuits (I2C), etc. The data can be transferred to the blockchain
    module (which will be discussed later). Some more features such as controlling
    the water lines, controlling the animals'' detection alarm, and so on can be added.
    Using the microcontroller''s communication ports, the data from the simulation
    center to the microcontroller can easily be accessed. Also, using the particular
    communication, the water pipelines, and some more hardware devices are controlled
    as well. Each individual crop sapling data is sent to the blockchain.


