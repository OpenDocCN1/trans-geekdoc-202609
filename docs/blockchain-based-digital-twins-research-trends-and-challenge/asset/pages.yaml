    # ### 6.3.2 NETWORK PARADIGM


    A blockchain network, or technical infrastructure, provides contract (chain code)
    services and an application ledger. The primary purpose of smart contracts is
    to establish transactions, which are subsequently transmitted to all their peer
    nodes in the network and permanently recorded on each of their respective ledgers.
    Users of applications could be blockchain network administrators or end users
    utilizing client applications [14]. Typically, a collaboration of organizations
    forms the network, and when the network is initially configured, the collaboration
    decides on a set of regulations that will govern which organization’s permissions
    are granted access to the network.


    The described approach gives a network paradigm that utilizes blockchains for
    cloud-based digital twin scenarios as stated in Figure 6.2. The proposed concept
    consists of four parts: a blockchain, a cloud server, a client side, and a data
    consumer. A more thorough explanation of each entity can be found below:'
