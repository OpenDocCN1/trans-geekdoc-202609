    # 11.4 BLOCKCHAIN


    Blockchain is a new trend which is called distributed ledger technology [18].
    It has a ledger for every input and communication so that the proposed'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'blockchain is used. Actually, there are more field areas and because of that,
    all the data taken by the sensors is stored in clouds and transferred to the simulation
    center. Using the microcontroller itself, communication can be done to the simulation
    center, but it might be very slow, and the data may or not be affected by the
    noise. Because of that, it may lead to the biggest error in the prediction. That
    is why Blockchain technology is proposed.


    Using the particular method, communication can be done at high speed and the data
    in the blockchain is immutable. It is not able to update or insert any blocks
    into the chain, and it has high security, i.e., it is very safe to use for communication
    and storage of data. Moreover, it is generally used in big industries, banks,
    and mainly in the transaction of Bitcoins. As said before, the proposed module
    will get the information from the microcontroller (the processed raw data of the
    sensors) convert it into the respective format, and transmit the data to the simulation
    center.


    In the simulation center, there is another blockchain module that will receive
    the information transmitted from the field area. It will data and sends it to
    the simulation. If any command is made by the AI, it is also transmitted from
    the blockchain module from the simulation center to the field area. That specific
    information is converted into data that will be given to the microcontroller block.
    It involves using particular technology for the proposed condition.


    The first key point is “Distributed ledger technology,” which means it has some
    ledger data containing information. This makes it very convenient for the customer
    using it. It also has smart contracts, connecting the blocks in the shortest way
    to access those blocks. It has an irreversible data structure, and each data block
    is connected to the one before and after it (like a doubly linked list). These
    are the main features of the proposed blockchain.'
  merge: -1
  img_proc: true
