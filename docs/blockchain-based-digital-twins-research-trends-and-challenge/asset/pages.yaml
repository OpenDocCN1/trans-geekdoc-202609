    #  7.4.1.3 SMART CONTRACTS


    +   - Secured code execution, also known as a smart contract, is a computer-based
    operation that may be executed independently of a trusted third party.

    - Once certain conditions are satisfied, the smart contract becomes active and
    enacts the relevant contractual requirements.

    - The smart contract can operate as a real-time auditor since all transactions
    in the distributed ledger must be logged and validated.

    - A smart contract can either be implemented externally, where the receiver checks
    the transactions using the smart contract address, or internally, where the code
    is run.

    - Blockchain technology allows for tracking all aspects of performance.

    - The smart contract is dynamically executed independently on each node of the
    blockchain network.


