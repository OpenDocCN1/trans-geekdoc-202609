    # 3.4.3 SELFISH MINING


    A blockchain may be attacked by a group of selfish miners working together. For
    example, the network remains susceptible even if a fraction of the hashing power
    is used to cheat. Selfish miners only share their blocks with others and hold
    on them until certain conditions are met, at which point the private branch is
    made public. All miners would eventually accept the private branch as the new
    private chain since it is longer than the one. In the interim, between now and
    when the private blockchain is made public, the honest miners spend their time
    and energy on an inactive fork, while the selfish miners are mining the private
    chain with no competition. Therefore, greedy miners often get more rewards.


    Many attacks have been developed to illustrate that blockchain is not so safe,
    and they rely on selfish mining. To increase the profitability of obstinate mining,
    miners may combine mining operations with network-level eclipse assaults in a
    non-trivial way. One of the tenacious tactics'' miners use is “trail-stubbornness,”
    in which blocks are continually mined even if the private chain falls behind.
    However, there are situations when the advantages outweigh the costs by 13% compared
    to a non-trailstubborn alternative. Selfish mining is not the only way to make
    money in the cryptocurrency industry; as shown, other, more lucrative approaches
    may be taken by smaller miners.'
