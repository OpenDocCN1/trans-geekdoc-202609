    # ABSTRACT


    Agriculture is the major source of the world’s food and fabrics. Increasing population
    and globalization affect the demand for food. So, there is a need to develop cost-effective
    technologies to improve agriculture. One such technology is the digital twin.
    This twin technology is the computer-generated imaginary illustration of the factual
    article in the computer-generated imaginary world. A digital twin is a virtual
    replica to monitor, detect, prevent, predict, and customize using real-time data.
    In agriculture, the digital twin acquires data using sensors, satellites, drones,
    historical soil information, and soil probes. From observations, first, it creates
    a database using API data, live sensor data, and manual records. Then it processes
    the data and provides'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'historical data as output. Comments on feedback, and errors, predicts future
    conditions, and suggests further improvement. It provides photos, digitized paper
    maps, farm data, moisture content, weather, and crop properties. Furthermore,
    the specified data are stored using blockchain technology where the blockchain
    is a chain of blocks that contain information. It is used for computing and to
    store transactions and records. This chapter explores the usage of Blockchain
    and digital twins in the agriculture sector. It also deals with the sensing, computing,
    and communicating models for various agriculture applications. Finally, it enumerates
    the virtual model for healthy crops and non-healthy crops in the agriculture field.


    Blockchain-Based Digital Twins: Research Trends and Challenges.

    A Prasanth, Vandana Sharma, Rajesh Kumar Dhanaraj, Pethuru Raj (Eds.)

