  md: '# CHAPTER 9


    # Collaboration of Blockchain-Based Digital Twins in the Healthcare Industry:
    From Idea to Implementation


    G. BOOPATHI RAJA,1 M. PARIMALA DEVI,1 T. SATHYA,1 and ARUN SEERALAN BALAKRISHNAN2


    1Department of Electronics and Communication Engineering, Velalar College of Engineering
    and Technology, Tamil Nadu, India


    2Department of Mechatronics Engineering, Asia Pacific University of Technology
    and Innovation, Kuala Lumpur, Malaysia


    # ABSTRACT


    Digital twins (DTs) have been made possible by the quick development of computer,
    storage, communications, and networking technology. It is undoubtedly the digitized
    version of any physical feature, item, or machine. Further, it can be used for
    prototyping, simulation, validation, and 3-D design before the real component
    is built. A DT can be employed for configuration, surveillance, diagnostics, and
    prognostics once a physical component has been put into service. It is anticipated
    that the Internet of Things (IoT) and DTs will attract a lot of attention soon
    and will be crucial for the Healthcare Industry. However, current DT construction
    techniques, platforms, and tools are heavily centralized and unable to provide
    trustworthy data provenance, audit, and traceability. The information about transactions,
    logs, and history is neither'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'safe nor impenetrable. A blockchain-based development process for DTs has been
    designed to enable secure and reliable traceability, availability, and data integrity
    of transactions, records, and data provenance. Few methods employ smart contracts
    to control and monitor actions taken by those participating in DT generation.
    This chapter deals with the analysis of Blockchain-based DT for healthcare applications.
    It also provides the various integration constraints and challenges faced in the
    healthcare Industry.


    Blockchain-Based Digital Twins: Research Trends and Challenges.

    A. Prashanth, Vandana Sharma, Rajesh Kumar Dhanaraj, Pethuraj Raj (Eds.)

    © 2025 Apple Academic Press, Inc. Co-published with CRC Press (Taylor & Francis)


    # 9.1 INTRODUCTION


    An online representation of a real-world organization, item, or service known
    as a digital twin. A wind farm, a jet engine, as well as a larger entity like
    a skyscraper or a whole city, might have a digital twin. The physical item is
    modeled as a digital twin in this digital era. To collect data or information
    and predict the operation of physical assets and process the same, digital twin
    technology may be employed. It is also used to recreate both of these representations
    [1].


    The strength of digital twins derives from the ability to better view realworld
    assets and data by linking them together [2]. Cross-functional teams can work
    together on the interactive and immersive design, development, testing, deployment,
    and operation of complex systems because of digital twins. They support businesses
    in understanding the history, seeing the current, and averting issues in the future.
    Insights from sales and marketing, assessment, 3D visualization, simulation, and
    forecasting are used to inform decision-making [3]. A digital twin is often computer
    software that uses data from the real world to replicate how a product or service
    might function. These programs can boost'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'output using industry 4.0 technologies such as software analytics, artificial
    intelligence, and the IoT [4, 5 and 6].


    Digital twins are created by integrating conceptual models using Building Information
    Modeling (BIM) and Geographic Information System (GIS) or scanning them to examine
    and analyze actual items in the real world with business and IoT data. Various
    data sources, including information and models, may be gathered, organized, and
    presented as realistic, interactive visualizations using a real-time 3D-enabled
    digital twin. A computer graphics technology called real-time 3D produces dynamic
    content faster than the human eye can see it.


    Digital twins are representations in the virtual realm of the loads, connections,
    and movements that assets may encounter in the physical world. Customers may engage
    with dynamic, three-dimensional, and responsive content in real-time. They may
    instantly view the findings on any platform, including portable devices, computers,
    and augmented, mixed, and virtual reality (AR/MR/VR) devices and they can precisely
    simulate real-world events, what-if scenarios, and any situation conceivable in
    the virtual environment. Every deployment of a digital twin is different. The
    complexity and business effect of deployments often increase with each stage that
    is added. A DT can be anything from a 3D product configuration to an accurate
    depiction of a city-sized network or system with each of its parts dynamically
    connected to engineering, construction, and operating data.


    The virtual models have emerged as a foundation in contemporary engineering to
    promote innovation and boost efficiency as a result of the development of machine
    learning as well other factors including big data. In other words, having one
    might help see important technological trends, and prevent expensive physical
    item breakdowns and testing procedures and services utilizing improved quantitative,
    monitoring, and forecasting skills.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'Virtual representations of patients (referred to as “health digital twins”)
    are created from the database of different categories of patients, their statistical
    medical data, and real-time modifications of patient and environmental factors
    are known as “physical twins” in the medical field. Human Digital Twin (HDT) can
    be used to simulate random impacts on the digital twin to offer insight into the
    predicted performance of the physical twin, presenting a ground-breaking potential
    in personalized medicine, diagnostic tests, and healthcare. Computational needs,
    data governance, clinical implementation, and product supervision are important
    things that need to be taken care of when converting HDT studies into clinical
    practice [7].


    # 9.2 DEFINITION OF A DIGITAL TWIN


    The digital twin is a process of modeling a system or a service that extends its
    lifecycle, incorporating modeling, machine learning, and inference to assist decision-making
    and is maintained with real-time data [8, 9]. It is divided into three parts:


    +   - an object in a real-time environment;

    - the digital twin is expressed in a software form; and

    - data that connects the first two components.


    A virtual model serves as an intermediary representation of the actual state of
    the thing it represents. Furthermore, it is specific to the item it represents
    rather than being merely general. The digital twins of two things that appear
    to be similar are frequently not the same [10, 11]. Figure 9.1 shows the process
    for defining a Digital Twin. Although a 2D or 3D CAD image is frequently connected
    with a digital twin, it is not necessary. A database, a list of equations, or
    a spreadsheet might make up the digital representation or digital model.'
