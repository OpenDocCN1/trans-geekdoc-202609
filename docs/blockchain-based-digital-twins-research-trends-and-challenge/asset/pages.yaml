    +   * **Step 2**: Encryption of Aggregate Data Structure: After the creation of
    an aggregate data structure, it should be added to the blockchain. From the edge
    computing device, the aggregate has to be broadcast to all the nodes in the blockchain
    for the mining process. Hence, it is required to ensure the security of the data
    being broadcast. This can be achieved by applying cryptography and converting
    the data aggregate into a non-understandable format.


    +   * **Step 3**: Block Creation and Addition: To ensure reliability and confidence
    among the stakeholders about the data maintained in the blockchain, consensus
    algorithms are mainly designed. It enables the computer nodes to agree on the
    state of the distributed ledger. The consensus mechanism is the way to reach an
    agreement between'
