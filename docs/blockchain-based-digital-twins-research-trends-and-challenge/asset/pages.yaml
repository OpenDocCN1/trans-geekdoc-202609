    #  10.3.4 CONSTRUCTION OF DEEP LEARNING MODEL


    To model the temporal relationship of sequential data collected from realtime
    IoT-enabled machines and its digital counterpart is the collections of DTs, the
    RNN-based learning model is considered for the proposed framework. To predict
    the failures and recognize the patterns that require timely maintenance, it is
    required to model the longer-time dependencies from the data that describe the
    status of machine parts collected at different periods. To predict the abnormality
    in the operational behavior of machines, it is needed to identify the difference
    between expected target characteristics and the current behaviors of the machine.


    This is supported in the proposed framework through the two kinds of blockchain
    RMBC and DTBC. The DTBC provides the expected behavior of the machine. Another
    requirement for predictive maintenance is finding the relationship between the
    sequence of state information. Let s<sub>t</sub> be the state of'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'the machineat time ''t'' and $s_{t-1}$ be the state of the machineat time ''t-1.''
    While analyzing the $s_t$ for predicting the maintenance requirement or probability
    of failure, the knowledge of the machine state at a time ''t-1'', i.e., $S_{t-1}$
    is also to be considered. The Preciseness of the prediction task can be improved
    by also considering previous ''n'' state information like $S_{t-1,t-2}, S_{t-3\dots
    t-n}$. Hence, the Long Short-Term Memory (LSTM) neural network is considered to
    be a suitable learning model for the proposed predictive maintenance.


    The LSTM can do analysis and classification of current input using the knowledge
    acquired from the past data. The LSTM can decide which information is worth mentioning
    or not. The architecture of LSTM has four gates to support learning based on long-term
    dependencies. The gates decide what to learn, forget, remember, and use. The Learning
    gate takes the current state $C_t$ and previous short-term memory $SM_{t-1}$ as
    input. It decides which information is relevant and keeps only as learning for
    prediction. The operation of the learning gate $(lg)$ using the weight matrix
    $(M_n)$ is given below:


    ```

    $Learning Matrix (L_t) = \tanh(M_n [SM_{t-1}, S_t]) + bias \_n$

    ```


    ```

    $Ignoring factor (ig_t) = (M_n [SM_{t-1}, S_t]) + bias \_n$

    ```


    ```

    $lg_{output} = L_t ig_t$

    ```


    The Forgetting gate takes the long-term memory $(SM_t)$ as input and decides what
    to be forgotten and what to be remembered as follows:


    ```

    $Ignoring factor (ig_t) = (M_n [SM_{t-1}, S_t]) + bias \_n$

    ```'
  merge: -1
  img_proc: true
- pgno: 346
  md: '```

    $LM_t = LM_{t-1} \cdot ((M_n [SM_{t-1}, S_t]) + bias_n)$ \quad (5)$

    ```


    The output of the remembering gate is produced by adding the output of the learning
    gate and the forgetting gate. The use gate combines vital information from the
    previous long-term memory and short-term memory to produce the short-term memory
    for the next cell. Once the data from the RMBC is fed into the LSTM-based learning
    model, the type of failure is predicted. Prediction accuracy is improved with
    the help of DTBC. The architecture for the proposed framework twin is given in
    Figure 10.12.'
