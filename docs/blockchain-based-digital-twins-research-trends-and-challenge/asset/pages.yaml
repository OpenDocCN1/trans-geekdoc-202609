    by leveraging the benefits of blockchain, DT, and DL.


    # 10.3 FRAMEWORK OF BLOCKCHAIN-BASED DIGITAL TWIN FOR PREDICTIVE MAINTENANCE


    A framework of Blockchain-based DTs for the predictive maintenance of industrial
