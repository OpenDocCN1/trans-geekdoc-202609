  md: 'known threat model created: Microsoft. Microsoft created the STRIDE framework
    to aid with threat modeling. Each letter of the acronym STRIDE stands for one
    of the most prevalent cybersecurity threats:


    +   - **Spoofing**: The capacity of the attacker to pose as someone else on the
    system is referred to as spoofing.

    - **Data Integrity**: It is violated by tampering attacks on the protected system''s
    data.

    - **Repudiation**: The capacity to retract one''s previous statements or actions
    is known as repudiation.

    - **Information Disclosure**: This category includes violations of confidentiality.

    - **Elevated Privileges**: A privilege escalation attack occurs when a user can
    take over the system with unlawful levels of authority.


    In the context of blockchain technology, we can categorize elevated privileges
    according to whether the attacker has unauthorized access to a user''s account,
