    # 1.2.8 BLOCKCHAIN APPLICATION IN VOTING


    The foundation of any democratic country is its election process, which citizens
    exercise their right to vote for the candidates they believe in. India, representatives
    are elected through elections at all levels, from local bodies and panchayats
    to parliament. It is crucial that the election process is both transparent and
    reliable to maintain the credibility of the entire system. If the process is only
    reliable, citizens will have confidence in the system and if transparency is lacking,
    citizens may choose to ignore the system, which poses a significant risk to democracy
    [38].


    In India, before 1997, the ballot box method was the primary means of conducting
    elections. Voters would mark their desired candidate''s symbol on a printed electoral
    chart and cast their vote. However, in 1997, the electronic voting machine was
    introduced as an alternative method for conducting elections, and it has been
    the sole means of voting since 2004. The Election Commission of India is implementing
    continuous evaluation in the election process to ensure more efficient, transparent,
    reliable elections. Despite the use of the Electronic Voting Machine system, fraudulent
    voting continues to occur in elections. To address these and other issues, the
    introduction of blockchain and DLTs in the electoral process could be beneficial.
    Challenges such as voter anonymity, vote confidentiality, and end-to-end verification
    for voters to confirm that the vote they cast is the one they intended can be
    effectively addressed and implemented with these technologies.'
