    # 4.1 INTRODUCTION


    A promising technique called the “digital twin” can significantly improve distributed
    manufacturing by delivering current functional data representations of actual
    assets, assisting in decision-making, and reducing potential dangers in such systems.
    Dispersed manufacturing systems must also work together to anticipate hazards
    and arrive at consensus-based decisionmaking [1]. However, due to centralized
    attack and connection, data interoperability, authentication, and scalability
    suffer from a single failure.


    To mitigate the aforementioned-challenges, the adoption of Blockchain technology
    with Digital Twin enables safe data sharing and interoperability among numerous
    stakeholders, including manufacturers, suppliers, service providers, and users.
    Blockchains are digital databases or ledgers that consist'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'of growing lists of records, named as a chain of blocks, each containing a
    list of transactions or data entries.


    Blockchain and Digital Twins alter industry-oriented applications and guarantee
    data management security. Blockchain and Digital Twin technologies can deliver
    useful data and a host of advantages for decision-making and data management without
    the aid of a central authority. Furthermore, Blockchain-based technologies provide
    Digital Twins with security and integrity. As a result, merging Blockchain with
    Digital Twins improves corporate efficiency and legitimacy. Blockchain-based Digital
    Twin has the potential to change several sectors due to the growth in market share
    and requirements, and it also aids enterprises in broadening their horizons. Businesses
    can gather pertinent data about their products and processes by fusing blockchain
    technology and digital twins. Additionally, it motivates companies to produce
    more genuine and distinctive goods, giving them a competitive edge over rivals
    who might use analogous procedures for their goods. Indeed, combining digital
    twins with blockchain technology can greatly improve security, data privacy, and
    solution credibility in terms of product design and process outcomes. Although
    blockchain enables them to keep information, digital twins are created using conventional
    technology.


    # 4.2 INTRODUCTION TO DIGITAL TWIN


    Digital twin explores the simulated representation of an actual object or thing
    [2]. A thing can be a car, an engine, a building, or a flyover. The data can be
    gathered from sensors connected with these actual assets and converted into a
    virtual system. Because of digital twins, people can view important information
    about how an actual object performs in the real world. The addition of various
    cutting-edge domains like Intelligent Systems, Data Science, the Internet of Things,
    Sensors, Simulation, and Connectivity significantly enhanced the sophistication
    and capabilities of digital twins [3].'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 4.2.1 FEATURES OF DIGITAL TWIN


    +   1. **Connectivity**: It is the basis of a digital twin. It establishes a link
    between the actual element and its digital counterpart. Sensors provide the connectivity
    of physical objects by acquiring, integrating, and communicating data through
    different integration techniques.


    +   2. **Homogenization**: Data homogeneity is both the result and the enabler
    of digital twins. It allows data to be separated from its actual form.


    +   3. **Re-Programmability**: Digital twins provide programmability automatically
    via artificial intelligence techniques, sensors, and predictive analysis.


    +   4. **Digital Traces**: These are left by digital twin technology. In the event
    of a machine failure, the trails can be used to locate the source of the problem.


    +   5. **Modularity**: It refers to the design and customization of products and
    industrial modules. Modularity added to functional models allows producers to
    fine-tune machinery and models. Digital twin features are represented in Figure
    4.1.'
