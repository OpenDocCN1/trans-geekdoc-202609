    # ABSTRACT


    The digital twin (DT) of the diagnostic patients is created using augmented reality
    (AR) and maintained if a patient is facing an emergency during the unavailability
    of the doctor. The virtual item is sent by the already assigned doctor to the
    operating doctor to grasp the internal status of the patient and treat the patient,
    among others. After a physical object is operational, a DT can be used for configuration,
    monitoring, diagnostics, and prognostics. The suggested approach also creates
    decentralized storage space to store, retrieve, and share DTs data. Here, DT is
    shared using the Ethereum'
