    # # Chapter 6: New NFT Investments, Uses and Disruptive Projects


    ![](img/9e732599f379d4f1dd55a1fd64d01531_222_0.png)


    Many people wonder if there are any applications for NFTs. Despite the fact that
    the concept is still in its infancy, numerous possible applications have already
    been developed.


    # ## 6.1 New Uses of NFTs


    We have chosen some of the most notable ones:


    # ### 6.1.1 Tickets


    Event tickets are one of the applications of NFTs. The reasoning is that if tickets
    are produced using a non-fungible token, there will be a record of that trade
    if the ticket is exchanged. As a result, there is no possibility of scalping,
    stealing, or attempting to use counterfeit tickets. This is due to the fact that
    the token on the blockchain linked with that ticket cannot be replaced.


    # ### 6.1.2 Fashion


    NFTs have the potential to solve a number of important difficulties in the fashion
    industry. Start with a digital record of authenticity, which can help with concerns
    like counterfeit items. An NFT could be connected to a luxury object to prove
    its authenticity. Similarly, a non-fungible token could provide important information
    about an item''s origins, like the materials used, where they came from, and'
  - '[PAGE 223]


    how far it has traveled. This might help people make more ethical decisions as
    topics like fashion and sustainability become more prominent.


    # 6.1.3 Collectibles


    We''ve already touched on this subject. Collecting souvenirs, trinkets, and other
    similar stuff has always been a popular pastime. NFTs act as a form of digital
    signature or stamp of approval, confirming authenticity.


    # 6.1.4 Gaming


    NFTs allow gamers to own one-of-a-kind in-game objects. Such tokens can power
    in-game ecosystems, whether for enjoyment, authenticity, or competitive nature.


    # 6.2 Why do NFTs have value?


    A non-fungible token is effectively a certificate of ownership for a digital asset,
    as we''ve already mentioned. The value is derived from the asset''s collectibility
    as well as its possible future sale value. NFTs can be bought and sold. Using
    art as an example of the benefits of NFTs is another excellent example. Beeple,
    a digital artist, sold the NFT for their Everyday – The First 5000 Days artwork
    to Christie''s auction house for a stunning $69.3 million in February 2021.


    # 6.2.1 Examples of NFT sales


    NFT art isn''t the only thing that sells well. There have been several major sales
    of NFTs in recent months, which has led to concerns that the market is currently
    in a bubble (more on that later). The following are some examples of NFT sales:


    # The first Tweet


    The founder of Twitter sold the NFT for his first Tweet for $2.9 million


    # The ‘Nyan Cat’ GIF


    The colorful GIF’s NFT was sold for 300 Ether, worth around $561,000 at the time.


    # The ‘Charlie Bit Me’ Video


    The famous video in which a baby was biting his brother’s finger was viewed over
    800 million times on YouTube. The NFT for the video was sold for around £500,000.'
