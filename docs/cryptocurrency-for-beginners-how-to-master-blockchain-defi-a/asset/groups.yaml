    # 3.5.7 Paypal


    ![](img/9e732599f379d4f1dd55a1fd64d01531_172_0.png)


    PayPal (PYPL) is a true e-commerce behemoth with a bright future and a devoted
    user base that is expected to grow as more young people embrace the digital-payment
    platform. The company is profitable, with revenue exceeding $15 billion in 2018,
    and truly global in scope, with the platform supporting 100 currencies in over
    200 global markets. The conventional wisdom is that PayPal will continue to grow
    and dominate the digital payment space, despite increased competition for a share
    of the lucrative e-commerce payments market - one of the most lucrative in an
    expanding business and consumer technology market.


    # The History of PayPal


    Although PayPal''s history isn''t particularly lengthy, there have been numerous
    ebbs, flows, and tipping points throughout the company''s two-decade-plus existence.
    When technology entrepreneurs Peter Thiel and Max Levchin founded PayPal in 1998,
    it wasn''t even called PayPal. Confinity was the company''s original name, and
    it was founded on the premise of providing consumers and businesses with low-cost,
    almost effortless digital payments. As the internet''s grip on global consumers
    tightened, the company wisely targeted an underserved market: banking and payments.'
  - '[PAGE 173]


    The founders'' concept was simple and effective: persuade customers to share their
    email addresses, banking information, and credit card numbers in exchange for
    quick, low-cost payments. Within three years of opening its doors, the company
    had processed more than $3 billion in payments from 10.2 million individual consumers
    as well as 2.6 million commercial customers. After deciding to focus solely on
    payments made over the internet, the founders changed their name to PayPal two
    years later. Thiel and Levchin cleverly exploited a gap in the payments market,
    when no one was really concentrating on a digital payment platform for consumers
    and businesses, a gap that the duo brilliantly exploited as PayPal took off at
    the turn of the century.


    # PayPal timeline


    PayPal''s growth trajectory accelerated in its early years, and the company soon
    set some impressive growth benchmarks.


    # August 1998


    After giving a speech on global market opportunities at Stanford University, Peter
    Thiel meets Max Levchin. They came up with the concept of digital wallets later
    that year.


    # December 1998


    PayPal is established.


    # October 1999


    Email-based payment technology is produced by the company''s engineer.


    # January 2000


    PayPal''s founders and managers noticed that end-users were asking commercial
    partners as well as other buyers to sign up for PayPal in order'
