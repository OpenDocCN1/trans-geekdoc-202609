    Venly 的点对点 NFT 市场已处于测试版，拥有超过 20 万名玩家的用户群，使登录用户可以在无需先获取比特币的情况下创建、购买和出售游戏角色、武器和收藏品。用户可以通过将其账户链接到数字钱包来购买和出售来自
    The Sandbox、Ethermon 和 Vulcan Verse 等区块链游戏的资产。得益于与 Polygon 的合作，这一区块链不可知的市场现在接受以美元支付的
    PayPal 付款，Polygon 是一种用于连接以太坊兼容区块链网络以及像 Binance 这样的加密货币交易所的开发框架。


    ## 6.5 NFT 的未来


    我们已经看到，非同质化代币有多种现实世界应用，但它们是未来的技术吗？很难预测 NFT 是否将在未来得到更广泛的应用。显然，目前对它们有很大的兴趣，并且它们具有很多潜在的好处。然而，该技术仍处于早期阶段，需要克服许多障碍。这些新行业中的许多正在寻找合格的员工，因此了解基础知识可能有助于你在职业生涯中取得进步。无论
    NFT 是否代表未来，它们都是流行文化中一个引人入胜的元素。


    ### 6.5.1 未来收藏品


    今年早些时候，非同质化代币曾是艺术界的热潮。然而，新的研究表明 NFT 热潮正在消退。根据 Nonfungible 的数据，总收入从 5 月 9 日的七日高点
    1.76 亿美元下降到 6 月 15 日的仅 870 万美元。因此，交易量基本上回到了 2021 年初的水平。根据 Nonfungible 首席运营官 Gauthier
    Zuppinger 的说法，NFT 市场剧烈下降的关键原因之一是名为 MeeBits 的新加密收藏品销售迅速激增然后崩溃——MeeBits 由 CryptoPunks
    的创始人开发。要点是，每当你目睹任何趋势的如此快速飙升时，你也会看到相对的下跌，这表明市场稳定。据 NFT 应用程序 S!NG 的首席执行官兼联合创始人 Geoff
    Osler 称，数字收藏品热潮可能是由加密货币价值增长所带来的财富所产生的“积压需求”所推动的，现在市场似乎正随着加密市场的下降而趋于稳定。


    ## 6.6 NFT 的下一步是什么？


    NFT 的支持者并不认为市场最近的低迷是走向死路。当高知名度 NFT 以数百万美元售出时，市场将其视为投机资产的态度就很明显了。对 NFT 来说，更紧迫的问题是它们的长期价值，预计将相当可观。随着增强和虚拟现实技术的改进，普通人将在虚拟环境中花费越来越多的时间——因此也会花费越来越多的钱。


    ### 6.6.1 以太坊与 NFT 的未来


    NFT 在 2021 年的指数级增长可归因于以太坊。NFT 技术为文化和商业提供的可能性显而易见，全球对它的渴望也是如此。现在是 NFT 技术——以及为其提供动力的区块链——扩展其功能的时刻。根据当前状况，大部分
    NFT 流量目前都发生在以太坊上并源于以太坊。NFT 诞生于以太坊，并将继续在未来发挥重要作用，即使存在多条链。因此，以太坊兼容性对新生态系统至关重要。NFT
    系统应继续保持 EVM 兼容，以便它们可以与 MetaMask 等以太坊钱包一起使用。这也是 Polkadot 生态系统如此强大的原因之一：它允许你以多链未来为目标开始开发产品。出于多种原因，以太坊使
    NFT 能够运行。由于交易历史和代币信息均可公开验证，因此很容易证明所有权历史。此外，交易确认后，操纵数据以“窃取”所有权几乎是不可能的。此外，交易 NFT
    可以直接点对点进行，而无需使用收取高额佣金作为补偿的平台。所有以太坊产品的“后端”都相同。换句话说，所有以太坊产品可以相互通信，使 NFT 可以跨产品转移。你可以轻松在一个产品上购买
    NFT 并在另一个产品上出售。作为创作者，你可以同时在多个项目上列出你的 NFT，每个项目都会拥有最新的详细信息。最后，因为以太坊不会宕机，你的代币始终可供出售。


    ### 6.6.2 环境友好的加密货币


    根据最近的研究，以太坊每年消耗 44.94 太瓦时的电能，这与整个国家的电力产出相似。Polkadot、Kusama 和 Unique Network 等链使用一种构建用于容纳清洁解决方案和“绿色
    NFT”的共识方法，因为所需的计算功率非常低。责怪发电者，而不是技术；我们拥有拒绝被采用的可再生能源，这与 NFT 无关。NFT 正在变得越来越流行，这意味着它们受到更严格的审查——特别是在碳足迹方面。我们必须认识到，NFT
    并不会直接增加以太坊的碳足迹。以太坊目前保护你的美元和资产的方法是高能耗的，但即将变得更好。当以太坊的碳足迹得到改善时，它将降低 99.95%，使其更加节能，与许多现有行业不同。


    ### 6.6.3 艺术品和奢侈品收藏品的合作投资


    人们可能并且确实收集的任何实物，从精美瓷器到酒瓶，从稀有手稿到复古汽车——以及两者之间的一切——都是收藏品。收藏家收集这些“有形资产”是因为他们喜欢它们。投资者持有它们，期望其价值随时间增长。与任何投资一样，没有保证哪些会升值，哪些不会。收藏品是一个特别意想不到的群体，因为其多样性。当像
    Beanie Babies 这样被炒作的东西一年飙升，下一年几乎变得完全无用时，最容易被丢弃的物品往往是价格飙升的那些。感兴趣的收藏家应该通过创建自己的加密货币钱包并购买一些低成本作品来了解
    NFT。了解媒介本身有所帮助，就像了解如何收藏和投资艺术一样。SuperRare 上的每一件物品都不昂贵；价格从 41 美元到数十万美元不等。该网站还通过指导用户完成创建钱包、购买以太坊和出价的步骤，使开始收藏变得简单。人们将在
