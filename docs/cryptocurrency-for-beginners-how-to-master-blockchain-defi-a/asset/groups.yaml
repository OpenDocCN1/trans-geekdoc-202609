  - '[PAGE 218]


    because they add an extra layer of authenticity.


    # They''re immutable


    Non-fungible tokens can never be changed, erased, or replaced because they are
    blockchain-based. This is a valuable attribute to have when demonstrating the
    origin or authenticity of digital content.


    # Composability


    One of the most exciting aspects of NFTs is that they may be thought of as interconnected
    Lego pieces. This means that designers can launch NFTs that capitalize on the
    success of previous NFTs. Any NFT project can be regarded as a module of a much
    broader, interconnected ecosystem because of its composability.


    # They can include smart contracts


    Smart contracts are yet another exciting aspect of blockchain technology. They
    can basically hold instructions that are carried out when specific criteria are
    met. As a result, an NFT with a smart contract might provide artists with a portion
    of the profit if the NFT is sold in the future. Artists and producers can be paid
    in the future based on the use and resale of their work using "smart contracts,"
    which are a series of coded commands incorporated into the blockchain.


    # 5.7.2 Cons of NFTs


    The disadvantages of NFTs include:


    # They are speculative in nature


    The big question is whether or not NFTs have any real value. Are they a good long-term
    investment or just a fad? It''s difficult to say. Currently, the only criterion
    for valuing NFTs is their emotive quality.


    # Digital assets can be copied'
  - '[PAGE 219]


    The fact that someone possesses the NFT of a digital object does not rule out
    the possibility of copies. Art could be copied as well as pasted, GIFs can be
    shared hundreds of times, and videos can be shared throughout the internet. You
    don''t have power over the asset just because you own the NFT; it''s only proof
    of ownership.


    # Environmental costs


    The environmental impact of blockchain-based cryptocurrencies like Ether and Bitcoin
    has received a lot of attention. Entering records onto a blockchain requires a
    lot of computing power. The long-term viability of blockchain-based assets is
    a major concern.


    # They can be stolen


    Despite the fact that the technology behind NFTs is very safe, many of the exchanges
    and platforms are not. As a result, there have been a number of stories of NFTs
    being stolen as a result of cyber security breaches.


    # Decrease in value due to reduced demand


    As many of the NFTs are immobile assets that don''t generate any money on their
    own, subjective indicators such as buyer demand are used to determine their worth.
    Consequently, extremely high prices may not bear indefinitely, and NFTs may lose
    noticeable value.


    # Sustainability in question


    Creating & selling NFTs accounts for a significant amount of power consumption,
    similar to blockchain transactions. Some scientists are concerned that a growing
    NFT market would exacerbate the effects of a quickly deteriorating environment.


    # Ownership doesn’t equal control'
  - '[PAGE 220]


    Ownership of an original NFT does not imply ownership over its distribution or
    duplication across platforms. Ownership simply means they have the "original"
    – they have no power to prevent "prints" from being made.


    # 5.8 What determines the success and failure of NFTs?


    NFTs can either be your best friend or your worst enemy. NFT initiatives are as
    unpredictable as British weather on a sunny day, but there are patterns among
    the chaos, and if yours can channel one of them, your project may be worth a million
    dollars by Christmas. Alternatively, it might fail quietly, a whisper in the world
    of digital art.


    # 5.8.1 Celebrity and NFTs


    The simplest way to succeed with an NFT project is to get the help of a celebrity,
    particularly a world champion footballer, basketball player, or ice hockey player.
    NFTs thrive in sports environments. Trading cards, ticket stubs, uniforms, autographed
    shirts, Andre Agassi''s Ponytail, and a bloodied sock are all collectibles that
    may be bought and sold on the open market. Messi''s new PSG deal includes NFT
    rights. So rare, an NFC collector card with a football theme acquired $532 million
    in seed money. So rare has signed deals with football giants such as Japan, the
    United States, Belgium, the Netherlands, Liverpool, and West Ham United. Football
    is a license to print money. NFTs are, in essence, a license to print money. It''s
    a match made in competitive heaven, and if you want your NFT project to succeed,
    you should contact an agency.


    # 5.8.2 Copy, imitate, and catch the NFT Zeitgeist


    Nothing is unique, therefore copy. Ride the tidal wave, ride the zeitgeist, bask
    in the light of a Twitter storm, and unleash your ten thousand NFT collection
    on the OpenSea to a chorus of squandered opportunities and hope. CryptoPunks has
    spawned a swarm of copycats who profit on pixelated avatars and animal stories.
    CyberKongz, Bored Ape Yacht Club, Pudgy Penguins, and a zoo of pretenders have
    all adopted CryptoPunks'' basic ideals.


    # 5.8.3 Build a quality team and a creative NFT project'
  - '[PAGE 221]


    Recruit an inspiring leader, assemble a talented team, and create an outstanding
    NFT. Nothing you could make on an old Amstrad should be released. Even when we''re
    in the midst of a gold rush, you still have to motivate the NFT audience. The
    importance of great artwork, a sound business plan, and equitable distribution
    should all be at the top of your priority list. Build a community, don''t tell
    collectors you''re only wanting their money, and give them extra goodies like
    exclusive online interviews and conversations. You must be imaginative.


    # 5.8.4 Why do NFT projects fail?


    Innovation is a scarce resource. It will become increasingly difficult for NFT
    projects that do not offer something innovative, fascinating, or exciting to break
    through the noise & rank highly on the OpenSea or generate Twitter engagement.
    There are copyright difficulties, environmental impacts (whether or not NFTs are
    melting the ice caps is irrelevant to the media and headlines), and the crooked
    nature of some in the eco-system. Scams, rug pulls, security concerns and mishandling
    of cash and projects are all serious concerns. Any or all of these factors could
    jeopardize the success of your NFT project. Of course, in the world of NFTs and
    cryptocurrency, nothing is ever foreseeable. What constitutes a strong NFT project
    will alter substantially in the months and years ahead, just as the markets are
    as unpredictable as a North Korean supreme leader.'
