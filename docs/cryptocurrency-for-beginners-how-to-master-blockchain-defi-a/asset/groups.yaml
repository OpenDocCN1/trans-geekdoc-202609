    ## 引言


    最近席卷大众的加密货币热潮是NFT。当佳士得拍卖行以惊人的6930万美元售出第一件NFT作品时，世界的目光被NFT吸引。数字艺术家Beeple为此项目创作了一幅照片拼贴画。“非同质化代币”指的是能够保存任何数字内容的能力，例如艺术品、动态GIF、音乐和视频游戏素材。它是不可替代的，这意味着它是独一无二的。NFT以最基本的形式，将数字艺术品和其他珍品转化为独一无二、不可否认的资产，这些资产在区块链上易于交易。对于许多艺术家、歌手、网红等人来说，回报非常可观，投资者愿意为数字图片的NFT副本支付高额现金。例如，勒布朗·詹姆斯扣篮视频以超过20万美元的价格售出，而一个十年历史的“Nyan
    Cat”GIF以60万美元的价格售出。另一方面，NFT已经存在很长时间了。Crypto Kitties是建立在以太坊加密货币平台上的数字交易游戏，允许用户购买和交易虚拟猫，这些虚拟猫不仅独一无二，而且存储在区块链上，是最早的NFT之一。NFT吸引着喜欢购买独立制作者作品的消费者。其他人则对声称拥有任何人都可以复制的数字财产的所有权感到着迷。新晋加密货币百万富翁和亿万富翁渴望分散他们的比特币持有量并增加在加密生态系统中的参与度，似乎推动了NFT的近期标价纪录。因为比特币彼此相同，可以相互交换。另一方面，并非所有NFT都是平等的。NFT可以用于在区块链上购买、出售和监控独特数字商品的所有权。区块链是一种存储数据的数字数据库。在比特币等加密货币系统中，区块链因其保持安全和去中心化的交易记录而闻名。由于区块链技术，一切都尽可能安全。去中心化区块链的数据是不可更改的，这意味着它无法被修改。这意味着所有比特币交易都被永久记录，并且任何人都可以查阅。Twitter的创始人杰克·多西的第一条推文以290万美元的价格卖给了一位匿名竞买人。尽管多西仍然拥有这条推文，但买方实际上拥有它，就像它是一份签名一样。独一无二的NFT（如现实中的艺术品）或许多副本之一（如集换卡）都是可行的。另一方面，区块链记录谁拥有该文件。简而言之，它相当于拥有一件艺术品、一份签名或几乎任何其他东西的数字形式。本书涵盖了NFT的工作原理、NFT与区块链、智能合约、智能现金、Flooz、Digicash、B-Money、BitGold、PayPal、E-Gold、Hash-Cash、比特币等加密货币的历史、加密资产使用量增长的原因、如何开始创建、购买和出售NFT、如何成为加密艺术家、合法市场、新的NFT市场等更多内容。了解什么是NFT以及如何在生活中使用它们。


