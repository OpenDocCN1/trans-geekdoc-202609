    to facilitate faster payments. PayPal paved the way for eBay payments on the site
    almost immediately, boosting PayPal''s user base significantly.


    # March 2000


    PayPal surpasses the one million customer target.


    # June 2001


    The founders replace the Confinity name with its official name PayPal.


    # February 2002


    With the issuance of new company stock, PayPal (PYPL-Nasdaq) goes public. The
    IPO is a success, with PayPal stock rising by more than 50% and closing at $20
    per share on its first day of trading.


    # October 2002


    In a much-touted "marriage" between digital auction as well as online payment
    services, PayPal is sold to eBay for $1.5 billion.


    # February 2006


    PayPal crosses one hundred million end-user accounts.


    # April 2006


    PayPal launches PayPal Mobile, a new mobile payment platform that allows customers
    to pay with PayPal from their smartphones.


    # December 2008


    PayPal moves close to the one hundred million user accounts user mark.


    # September 2013


    PayPal pays $800 million for Braintree Systems, the payments gateway company that
    was owned by Venmo, an online payment competitor.


    # July 2015'
