    money is made up of paper notes. To put it another way, their face and intrinsic
    values aren''t the same. Fiat money is defined as a government-issued currency
    that is not backed by physical assets such as silver or gold. It is in contrast
    to commodity money, which has its own value. There are several advantages to using
    paper currency. The government can issue paper currency notes at a low cost because
    their intrinsic value is much lower than their face value. They are also simple
    to store due to their light weight, durability, and portability. They are perfectly
    safe to carry and store than gold coins. Paper currencies, unlike coins, are not
    good or bad; they are all the same. By regulating the supply of paper currency,
    the issuing authority can keep its value stable. The regulating authority has
    the power to increase and decrease its quantity. As a result, its supply can be
    described as elastic. The disadvantages of paper currency, on the other hand,
    cannot be overlooked. Governments issue these currencies, which are controlled
    by a central bank. Legitimate investors lose their money deposited in banks during
    liquidity crises and bank runs. The government issuing of too many currencies
    can lead to inflationary pressures. Inflation occurs when the overall price level
    rises, resulting in a decrease in the value of money. Paper money is not indestructible;
    it can be harmed by floods, fires, insects, and other natural disasters.


    ### 2.1 Money as a medium of exchange


    Money is commonly recognized in a given country as a means for payment for goods
    and services and payment of debts. Nearly all modern money systems are based on
    fiat currency. Economies depend on the exchanging of goods and services for money.
    Money, where it comes from and what it is worth, is described by economists. Given
    below are the multifarious characteristics of money.


    ### Characteristics of Money


    Money has three characteristics, according to the economists:

    - Means of Payment

    - Unit of Account

    - Store of Value


    ### 2.1.1 What actually is money?


    Means of Payment is the most important characteristic of money out of its three
    widely recognized characteristics that have been listed above. The value and worth
    of money for society are only gauged through its acceptance by the general population
    as a means of payment that is unconditional. Money makes it easy for people to
    work in coordination for their common good. Listed below are many practical definitions
    of money. Money is:

    - Creature of the law

    - Not tangible wealth in itself

    - A power to obtain wealth

    - A token

    - A symbol of wealth

    - An abstract social power based on law

    - What government accepts in taxes

    - A medium of exchange

    - It is legally enforced by the government

    - Is an exchange medium greatly accepted by the People?


    Money’s worth as an exchange medium exists because of its acceptability by the
    people. Money is legally enforced by Government. During this enforcement, the
    Government acts on behalf of the People.


