    在原本无限可获取的商品中呈现稀缺性，并附带真实性证明。NFT 可用于买卖 GIF、推文、虚拟交易卡、实物照片、电子游戏皮肤、虚拟房地产及其他数字艺术品。


    ## 5.3 How do NFTs work?


    与其他加密货币相比，NFT 并非即时可交换的，因为即使属于同一平台、集合或游戏，也不存在两个完全相同的 NFT。你可以将其视为音乐节通行证。每张票都包含购买者姓名、活动日期和场地等信息。这些信息使得音乐节门票难以交换。


    ### 5.3.1 How to buy NFTs


    原则上，任何数字图像都可以作为 NFT 购买。不过，尤其是如果你是新手，在获取 NFT 时有几点需要牢记。你需要选择一个购买市场、一个用于存储加密货币的数字钱包，以及执行交易所需的加密货币。一些最著名的
    NFT 市场包括 OpenSea、Mintable、Nifty Gateway 和 Rarible。


    ### 5.3.2 How to sell NFTs?


    NFT 也在市场中出售；不过，方式因平台而异。基本上，你会将作品发布到市场，然后按照流程将其转换为 NFT。你可以输入作品描述和定价建议等详细信息。大多数
    NFT 使用以太坊购买，但也可以使用其他 ERC-20 代币（如 WAX 和 Flow）获取。


    ### 5.3.3 How to create an NFT?


    任何人都可以创建 NFT。你所需要的只是一个数字钱包、少量以太币，以及可以访问的 NFT 市场，在那里你可以上传并将作品转换为 NFT 或加密艺术。如果你是一位有志于成为数字艺术家的人，那么很可能有兴趣为自己的作品制作
    NFT。幸运的是，有各种平台可以帮助你入门。一般而言，这个过程相当简单，各平台也会为你提供指导。不过，在开始之前，你可能需要了解一些事项。NFT 建立在特定的区块链之上并由其支持。以太坊区块链目前是非同质化代币最流行的选择。要开始，你需要一个比特币钱包和加密货币。目前，以太币（ETH）是使用最广泛的。在
    NFT 市场上，你可以生成并出售数字资产。基于以太坊的 OpenSea 平台非常流行。


    ## 5.4 NFT and blockchain


    今天有多种不同的区块链技术可供选择。有些区块链是为满足网络访问受限的小群体需求而创建的。那么，NFT 在区块链世界中处于什么位置？请记住，区块链是一种在通信网络的节点之间充当分布式账本的软件。其不可篡改性使其区别于其他在线数据库或交易平台：我们可以进行点对点的数字资产交易，且未经网络大多数同意，没有人能更改或删除这些交易。在互联网方面，这是一个巨大的优势。NFT
    中的每个代币都代表一个独一无二的物品。如果你在合同中将安德鲁·怀斯（Andrew Wyeth）的画作替换为米克·温克尔曼（Mike Winkelmann）的艺术作品，你不能指望任何人会注意到。NFT
    涵盖广泛的独特资产，包括出生和死亡证明、房产契约以及物联网对象的身份。尽管 CryptoKitties（首个 NFT 热潮）的泡沫可能已经破裂，但围绕 Beeple
    作品拍卖的兴奋情绪展示了 NFT 的潜力。这是一个价值创造领域，你唯一的限制是你的想象力、技术技能以及营销、会计和法律支持。


    ## Discovering NFT


    尽管 NFT 仍然是数字金融生态系统中的“闪亮新事物”，但其实用性和市值尚未充分释放。如果要实现对普通消费者的潜力，NFT 必须在中端市场环境中展示和提供，而不仅仅是在高端、顶级机会中。普通购物者需要获取信息，并具备搜索、比较和购物的能力。买家旅程中的发现阶段至关重要。别忘了冲动购买的力量。这很可能导致
    NFT 市场基于特定用例变得更加专业化。OpenSea 作为最初的 NFT 市场之一，正在经历快速增长。2021 年，OpenSea 的交易量增长了 12,000
    多个百分点，仅 6 月份就创下 1.5 亿美元的 NFT 交易纪录。如果这还不够好消息，他们的用户基数在短短六个月内从 315 增长到 14,520，使公司在
    8 月份的月度 NFT 交易量达到 30 亿美元。所有这些对 NFT 以及整个数字金融行业来说都是绝佳消息，但专业化的市场无法像阿里巴巴这样的国际知名巨头那样快速推动行业发展。这就是为什么阿里巴巴最近的公告如此引人入胜。


    ## Smart contracts


    用于分配所有权并管理 NFT 可转让性的智能合约被用来创建它们。当有人生成或铸造 NFT 时，他们正在执行来自遵循各种标准（如 ERC-721）的智能合约的代码。这些数据存储在区块链上，NFT
    也在其中进行处理。以非同质化代币（NFT）的形式，智能合约对普通大众产生了重大影响。2021 年第一季度，在 NFT 上的支出超过 20 亿美元，表明相比
    2020 年第四季度增长了 2,100 个百分点。


    ## Digital asset


    简单来说，数字资产是指以数字形式存在并具有使用能力（复制、复制权、复制和修改）的任何东西。例如，文档、音频或视觉信息、照片以及其他相关数字数据都被称为数字资产。


    ## 5.5 NFTs vs. Cryptocurrency


    必须澄清加密货币与非同质化代币之间的区别。尽管两者都使用区块链技术，但它们之间的根本差异可能有助于我们理解 NFT 的工作原理。主要区别源于加密货币是可替代的。例如，你可以用一个比特币交换另一个比特币。然而，对于
    NFT 则不能这样做。非同质化代币与单个数字资产相关联，不能与另一个代币交换。NFT 与加密货币的主要区别在于，与加密货币不同，NFT 是现实世界商品的独一无二的表现形式，不能相互交换。加密货币可以相互交易，因为其价值不会贬值。另一方面，加密货币和
    NFT 都是去中心化的，并由运行它们的社区进行治理。此外，加密货币和 NFT 可以通过数字公共账本访问，这使所有交易都透明。


    ## 5.6 NFT vs. Bitcoin


    尽管 NFT 使用与比特币等加密货币相同的技术，但相似之处仅此而已。比特币可以相互交易且价值相同，即一卢比始终等于另一卢比，一个比特币始终等于另一个比特币，无论相对于其他类似货币的价格如何波动。NFT
