    or list of transactions can be viewed by anyone in the world, the parties who
    exchange cryptocurrency are more private. Cryptocurrencies are continuing to hold
    electronically in digital wallets by definition. The owner is the owner of the
    wallet''s private key. The currency is mostly exchanged digitally from users''
    anonymous wallets.


    ### 3.3.4 Cryptocurrency security grows through time & value


    A hacker would have to have control of more than half of the computers in the
    "consensus" network. All of the computers which receive copies of the blockchain
    or distributed ledger form the consensus network. The cryptocurrency networks
    for more established cryptos, such as Bitcoin or Ethereum, are so large that a
    hack is nearly impossible. Because the cryptocurrency network was much smaller
    in the early days, it was easier to gain the majority of control.

