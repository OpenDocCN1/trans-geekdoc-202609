  mdcn: "\n\n因为它们增加了一层额外的真实性。\n\n### 它们是不可更改的\n\n非同质化代币（NFT）绝不会被更改、擦除或替换，因为它们基于区块链。在证明数字内容的来源或真实性时，这是一项宝贵的属性。\n\
    \n### 可组合性\n\nNFT最令人兴奋的方面之一是，它们可以被视为相互关联的乐高积木。这意味着设计师可以推出利用之前NFT成功的NFT。由于其可组合性，任何NFT项目都可以被视为更广泛、相互关联的生态系统中的一个模块。\n\
    \n### 它们可以包含智能合约\n\n智能合约是区块链技术的另一个令人兴奋的方面。它们基本上可以存储指令，当满足特定条件时执行这些指令。因此，带有智能合约的NFT如果在未来被出售，可能会为艺术家提供部分利润。艺术家和制作者可以根据其作品的使用和转售，在未来通过“智能合约”获得报酬，“智能合约”是一系列编码到区块链中的指令。\n\
    \n### 5.7.2 NFT的缺点\n\nNFT的缺点包括：\n\n- **它们本质上具有投机性**\n  最大的问题是NFT是否具有任何真实价值。它们是良好的长期投资，还是只是昙花一现？这很难说。目前，对NFT估值的唯一标准是其情感属性。\n\
    \n- **数字资产可以被复制**\n  某人拥有数字对象的NFT这一事实，并不排除存在副本的可能性。艺术品可以被复制和粘贴，GIF可以被分享数百次，视频可以在互联网上传播。你仅仅因为拥有NFT，并不意味着对资产拥有控制权；它只是所有权证明。\n\
    \n- **环境成本**\n  像以太币和比特币这样的基于区块链的加密货币的环境影响已受到广泛关注。将记录写入区块链需要大量计算能力。基于区块链的资产的长期可行性是一大担忧。\n\
    \n- **它们可能被盗**\n  尽管NFT背后的技术非常安全，但许多交易所和平台并不安全。因此，已有多起因网络安全漏洞导致NFT被盗的案例。\n\n-\
    \ **因需求减少而导致价值下降**\n  由于许多NFT是不自行产生任何收益的固定资产，因此使用买家需求等主观指标来确定其价值。因此，极高的价格可能无法无限期维持，NFT可能会失去明显的价值。\n\
    \n- **可持续性存疑**\n  创建和销售NFT占用大量电力，与区块链交易类似。一些科学家担心，不断增长的NFT市场将加剧环境快速恶化的影响。\n\n\
    - **所有权不等于控制权**\n  拥有原始NFT并不意味着拥有其在各平台上的分发或复制权。所有权仅意味着他们拥有“原件”——他们无权阻止制作“印刷品”。\n\
    \n## 5.8 决定NFT成败的因素是什么？\n\nNFT可以成为你最好的朋友，也可能成为你最糟糕的敌人。NFT项目如同晴天的英国天气一样不可预测，但在混乱中存在规律，如果你的项目能利用其中一种规律，到圣诞节它可能价值百万美元。或者，它可能会悄然失败，成为数字艺术世界中的一声低语。\n\
    \n### 5.8.1 名人与NFT\n\n与NFT项目取得成功的最简单方法是获得名人的帮助，尤其是世界冠军足球运动员、篮球运动员或冰球运动员。NFT在体育领域蓬勃发展。交易卡、票根、球衣、签名球衣、安德烈·阿加西的马尾辫和一只沾血的袜子，都是可以在公开市场上购买和出售的收藏品。梅西与巴黎圣日耳曼的新交易包括NFT权利。So\
    \ rare，一款足球主题的NFT收藏卡获得了5320万美元的种子资金。So rare已与日本、美国、比利时、荷兰、利物浦和西汉姆联等足球巨头签订协议。足球是印钞许可证。NFT本质上也是印钞许可证。这是竞技天堂中的完美组合，如果你希望自己的NFT项目成功，应该联系一个机构。\n\
    \n### 5.8.2 模仿、复制并捕捉NFT的时代精神\n\n没有独一无二的东西，因此要模仿。乘上潮流，搭上时代精神的顺风车，沐浴在Twitter风暴的光芒下，将你的一万个NFT系列发布到OpenSea，伴随着浪费机会和希望的合唱。CryptoPunks催生了一大群模仿者，他们从像素化头像和动物故事中获利。CyberKongz、无聊猿游艇会、肥企鹅以及一大群冒牌货都采用了CryptoPunks的基本理念。\n\
    \n### 5.8.3 组建高质量团队并打造创意NFT项目\n\n招募一位鼓舞人心的领导者，组建一支有才华的团队，并创建一个出色的NFT。你在旧的Amstrad上能做出的东西都不应该发布。即使在淘金热的浪潮中，你仍然需要激励NFT受众。优秀的艺术作品、可靠的商业计划和公平的分配都应排在你的优先事项列表之首。建立社区，不要告诉收藏家你只想要他们的钱，并给他们额外的福利，例如独家在线采访和对话。你必须富有想象力。\n\
    \n### 5.8.4 为什么NFT项目会失败？\n\n创新是一种稀缺资源。对于不提供创新、迷人或令人兴奋内容的NFT项目，要想突出重围并在OpenSea上排名靠前或引发Twitter互动，将变得越来越困难。存在版权难题、环境影响（NFT是否融化冰盖与媒体和头条无关），以及生态系统中某些人的不正当本质。诈骗、跑路、安全问题以及资金和项目管理不当，都是严重问题。这些因素中的任何一个或全部都可能危及你的NFT项目的成功。当然，在NFT和加密货币的世界里，没有什么是可以预见的。构成强大NFT项目的标准在未来几个月和几年内将发生重大变化，就像市场像朝鲜最高领导人一样不可预测。\n\
    \n## 第6章：新的NFT投资、用途及颠覆性项目\n\n![](img/9e732599f379d4f1dd55a1fd64d01531_222_0.png)\n\
    \n许多人想知道NFT是否有任何应用。尽管概念仍处于起步阶段，但许多可能的应用已经被开发出来。\n\n### 6.1 NFT的新用途\n\n我们选择了一些最著名的应用：\n\
    \n### 6.1.1 门票\n\n活动门票是NFT的应用之一。其原理是，如果门票是使用非同质化代币制作的，那么当门票被交换时，会有该交易的记录。因此，不存在黄牛倒卖、盗窃或试图使用伪造门票的可能性。这是因为与该门票关联的区块链上的代币无法被替换。\n\
    \n### 6.1.2 时尚\n\nNFT有潜力解决时尚行业中许多重要难题。从数字真实性记录开始，这有助于解决假冒商品等问题。NFT可以与奢侈品相关联以证明其真实性。同样，非同质化代币可以提供关于物品来源的重要信息，例如使用了什么材料、材料来自哪里，以及它运输了多远。随着时尚和可持续性等话题变得更加突出，这可能有助于人们做出更符合伦理的决策。\n\
    \n### 6.1.3 收藏品\n\n我们已经触及过这个话题。收集纪念品、小饰品和其他类似物品一直是受欢迎的消遣。NFT充当一种数字签名或认可印章，以确认真实性。\n\
    \n### 6.1.4 游戏\n\nNFT允许玩家拥有独一无二的游戏内物品。此类代币可以驱动游戏内生态系统，无论是为了娱乐、真实性还是竞技性。\n\n###\
    \ 6.2 NFT为何有价值？\n\n如前所述，非同质化代币实际上是数字资产的所有权证书。其价值来源于资产的收藏价值以及其未来可能的转售价值。NFT可以被购买和出售。使用艺术作为NFT优势的例子是另一个极佳的例子。数字艺术家Beeple于2021年2月，将其《Everyday\
    \ – The First 5000 Days》作品的NFT以惊人的6930万美元售予佳士得拍卖行。\n\n### 6.2.1 NFT销售示例\n\nNFT艺术品不是唯一畅销的东西。最近几个月发生过多次重大的NFT销售，这引发了人们对市场目前处于泡沫中的担忧（稍后将详细讨论）。以下是一些NFT销售示例：\n\
    \n- **第一条推文**\n  Twitter创始人以290万美元的价格出售了他第一条推文的NFT\n\n- **“彩猫”GIF**\n  这张彩色GIF的NFT以300个以太币售出，当时价值约56.1万美元。\n\
    \n- **“查理咬我的手指”视频**\n  那段著名视频中，一个婴儿咬他兄弟的手指，在YouTube上的观看次数超过8亿次。该视频的NFT售价约为50万英镑。\n\
    \n"
