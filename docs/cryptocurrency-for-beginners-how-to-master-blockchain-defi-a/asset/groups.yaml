    ## 3.5 加密货币的历史


    自2009年比特币推出以来，全球加密货币世界迅猛发展。最初一个未经验证的概念，如今已被广泛视为货币的未来。自加密货币交易所开设以来，成千上万种其他加密货币相继涌现，也有不少随之失败。尽管比特币目前仍是最受欢迎的加密货币，遥遥领先，且大多数类似加密货币的非投机性影响微乎其微，但投资者和消费者也应牢记其他加密货币。以下列出了当今最常见的加密货币。


    - SmartCash

    - Flooz

    - Digicash

    - B-Money

    - Paypal

    - BitGold

    - E-Gold

    - Hash-Cash

    - Ethereum

    - XRP

    - Tether

    - Bitcoin Cash

    - Litecoin

    - EOS


    ### 3.5.1 SmartCash


    SmartCash 是一种以社区为驱动的零现金型加密货币。为了实现商家采用的愿景，它优先考虑隐私和快速交易时间。该项目的显著特征是反对中央权威，这导致项目放弃了核心团队。该货币与
    Dash 等同，因为它旨在通过快速、私密的货币获得广泛采用。由于其使用主节点并依赖 Dash 基金会，Dash 被视为一种相对集中化的货币。基金会、核心团队和集中化挖矿都是
    SmartCash 希望避免的概念。另一方面，SmartCash 包含多种分散式治理以及开发功能。它在社区驱动的开发上进行了大量投资。因此，SmartCash
    越来越受欢迎。SmartCash 尽管不如 Dash 以及 Zcash 和 Monero 等其他私密支付平台知名，但对匿名、不可追踪且可用的加密货币提供了独特视角。传统加密货币（例如比特币）仅激励矿工，而忽略了为项目维护、开发和推广做出贡献的其他利益相关者。SmartCash
    是一种优先考虑开发和社区的社区驱动型加密货币。总区块奖励的 29% 已留出，以支持 SmartHive 社区提案以及蜂巢团队。SmartMining 是 SmartCash
    的一项新功能，可抑制挖矿攻击。任何拥有电脑和一块或多块显卡的人都可以参与挖矿。针对 Keccak 挖矿算法的 ASIC 尚未开发出来，可以合理假设在很长一段时间内都不会出现。


    ### 3.5.2 SmartHive 和 SmartVoting


    ![](img/9e732599f379d4f1dd55a1fd64d01531_164_0.png)


    SmartCash 社区表示，拥有“核心”团队的加密货币从长远来看是低效且腐败的。人们担心，创始人会将赚钱置于创建开放且低成本平台之上。随着 ICO 的兴起以及创始团队代币分配的增加，我们已经见证了这种情况的发生。这些中央组织可能变得官僚主义、难以应对，并优先考虑相互冲突的目标。相反，SmartCash
    推荐一种基于蚂蚁和蜜蜂自我组织的治理模式。目标是创建一个蜂巢，让人们可以在小团体中从事特定项目。有人认为，这种分散的方法最终可能比它试图取代的基金会/核心团队方法效率更低。然而，社区认为，自我治理团队比引导式开发更加敏捷和高效。所有
    SMART 代币持有者将获得投票权。一枚代币等于一票。任何人都可以使用这个所谓的 SmartVoting 系统向蜂巢提交提案以供评估和投票。目标是创建一种自下而上的管理系统，其中项目由
    SmartHive 基金资助。此外，蜂巢成员在完成提案后会获得补偿。SmartHive 是项目的生命线，旨在使项目无限期运行。这种结构得到了一群对该项目充满热情的铁杆粉丝的草根支持。SmartCash
    的每个区块奖励都用于资助未来的开发项目。截至目前，该基金的价值已超过 2.5 亿美元。


    ### 3.5.3 蜂巢结构化团队


    ![](img/9e732599f379d4f1dd55a1fd64d01531_166_0.png)


    在蜂巢投票批准后，团队将承担拟议的项目。这些团队起初很简单：开发、推广和支持。随着改进提案数量和社区的增长，会形成新团队。一个团队由最多八人组成，他们作为一个小组一起工作。除此之外，你还需要组建一个新的项目团队。这被称为蜂巢结构化团队，它将贡献社区划分为更小的子群，人们根据需要加入和退出团队。因此，每个团队都有自己的预算和由社区任命的团队协调员。团队一旦组建，便是自成体系的。除了全社区范围的
    SmartVoting 公投外，没有建立任何控制结构。蜂巢结构化团队是一群每天参与项目工作的专职社区成员。个人将由团队雇佣。如果社区成员无法承诺加入团队，他们将有不那么正式的方式为
    SmartHive 做出贡献。


    ### 3.5.4 Flooz


    ![](img/9e732599f379d4f1dd55a1fd64d01531_167_0.png)


    Flooz.com 曾是九十年代末科技热潮的宠儿，但到 2001 年便趋于冷落。Flooz 被比作优惠券或航空里程，可以通过推广活动积累，也可直接从 Flooz
    的中央平台购买，作为相对年轻的互联网上接受支付的商家的数字工具。Flooz 在其三年运营期间筹集了高达 3500 万美元的风险投资，押注商家对新颖且令人兴奋的支付机制的需求。Flooz
    在其广告活动上没有花费一分钱，甚至邀请了喜剧演员 Whoopi Goldberg 拍摄一系列电视广告。尽管有势头，但据报道 Flooz 最终未能吸引大量用户和商家，而该公司平台上的犯罪活动最终证明对其来说无法承受。到
    2001 年 8 月，由于投资者支持迅速下降以及其平台上涉嫌犯罪活动的指控，该公司的倒闭进程被加速。根据 2001 年《纽约时报》的一篇报道，俄罗斯犯罪团伙被怀疑使用被盗信用卡购买在线货币并洗黑钱，这促使联邦调查展开。据
    Flooz 方面消息，约 30 万美元被盗。欺诈指控浮出水面后不久，Flooz 在未能找到买家的情况下关闭了。


    ### 3.5.5 DigiCash


    ![](img/9e732599f379d4f1dd55a1fd64d01531_168_0.png)


    DigiCash 是一家成立于 1990 年代的数字货币公司，曾一度接近成为全球成功案例。然而，DigiCash 由于内部纠纷和缺乏启动动力等多重因素而失败，这使其无法成为广泛使用的在线支付系统。ecash
    系统的创建者 David Chaum 是加密协议领域的先驱。DigiCash 成立于 1990 年，支持 cyberbucks，这是一种为用户提供匿名性、为接受该货币的商家提供安全性的数字货币。据《卫报》2003
    年的一篇报道，自由意志主义者及其他支持超越政府控制的国际在线货币的人士支持了 DigiCash。DigiCash 值得注意的是，它允许各种支付规模，尤其是微支付。对于货币交易，该系统使用电子邮件邮件列表系统，有报道表明交易者进行了场外交易。据当时的报道，现金流不足以及公司员工与领导层之间的摩擦是导致
    DigiCash 失败的原因之一。尽管与主要银行和信用卡公司进行了高层谈判前景看好，但该企业未能达成一笔重大交易，以确保其在 an

