    ## 3.5.12 瑞波币（XRP）


    ![](img/9e732599f379d4f1dd55a1fd64d01531_190_0.png)


    虽然瑞波币拥有本土加密货币XRP，但IOUs处理更多的是关于网络本身，而非加密货币本身。该货币并非作为交换媒介来存储和交换价值，而是作为一种代币来保护网络免受垃圾信息的侵害。与比特币和以太坊不同，瑞波币没有挖矿，因为所有代币都已经预挖完毕。随着多家银行加入瑞波币网络，瑞波币在金融领域变得极其重要。瑞波币（XRP）是一种实时全额结算（RTGS）系统，充当货币转账、货币兑换和汇款网络。它由美国的Ripple
    Labs Inc.开发，并在2012年发布前由独立服务器验证。XRP是被交易的加密货币的名称（一种加密货币）。XRP可以兑换成几乎任何其他货币，使用户避免在银行排长队。另一方面，加密货币波动相对较大，意味着其价值可能会波动。财务顾问可以帮助您确定整体投资策略应是什么。


    ### 什么是瑞波币（XRP）？


    与比特币和以太坊等其他形式的加密货币不同，瑞波币由“哈希树”组成，而非区块链。由于代币数量有限——1000亿枚——XRP无法被挖矿。加密货币建立在区块链技术之上。这是一种将信息分组到组或块中的数据库类型。每条新信息会在新添加的块合并为新块并添加到链中后被加入。顾名思义，区块链将数据分成相互链接的块。瑞波币与区块链相似之处在于，交易由多个节点处理。支付过程包括：有人发送交易，信息被赋予一个单一值并发送到共享公共数据库，验证服务器或节点共享信息，如果单独的服务器报告匹配，则交易被授权并处理。由于不涉及工作量证明，该系统无法与比特币相比。在比特币中，比特币区块链上的矿工需要完成一个复杂的方程式来展示工作量，然后才能将区块接受到链中。另一方面，瑞波币模型基于共识。一旦达成协议，交易即被清算。因此，瑞波币网络确实可以每秒处理1500笔交易，而比特币每秒只能处理3到6笔交易，以太坊每秒只能处理15笔交易。尽管它与区块链系统不完全相同，但瑞波币流程相对高效且快速，这是银行和主要支付系统考虑和尝试瑞波币的主要原因之一。此外，瑞波币并不以与以太坊相同的方式完全去中心化。从技术上讲，瑞波币可以控制哪些服务器被接受到网络上，因为开发人员确实控制着保护系统免受恶意运营商侵害的机制（这使其成为一个中央权威）。因此，有人认为XRP不是真正的或标准的加密货币。


    ## 3.5.13 泰达币（Tether）


    ![](img/9e732599f379d4f1dd55a1fd64d01531_192_0.png)


    ### 历史


    Tether（USDT），以前名为“Realcoin”，是一种旨在保持与美元固定1:1汇率的加密货币。它由Brock Pierce、Craig Sellars和Reeve
    Collins于2014年7月创立。建立在Mastercoin（Omni）之上，这是一种2012年将稳定币概念引入世界的比特币协议层，Tether是最早创建的稳定币之一。Tether目前是使用最广泛的稳定币，开创了现在被称为法币抵押稳定币模式的模式。Tether的创建旨在解决现有加密货币的两个关键问题：高波动性以及法币与加密货币的可兑换性。Tether通过创建一种完全由美国银行存款1:1支持的加密货币来解决这些问题。USDT代币在以太坊上表示为ERC-20代币，而Tether使用Omni层在比特币上表示USDT代币。尽管代币本身在去中心化网络上运行，但总部位于香港的Tether
    Ltd 独家负责代币的创建和赎回，以及1:1存款支持。USDT主要被交易所用作法币替代品，减少或消除了对外部银行关系的需求。自2014年成立以来，Tether一直是争议的主题，原因是公司未能提供经过审计的财务报表来证明有足够的储备金来支持USDT。Tether有不披露其银行关系的历史，直到2018年11月才最近披露，以平息由相关加密货币交易所Bitfinex提出的关于其偿付能力的担忧。Tether于2019年3月更新了其披露声明，声称其代币不再完全由美元存款支持。Tether现在由储备金100%支持，这些储备金包括传统货币以及现金等价物，以及Tether不时向第三方（包括关联实体）发放贷款的其他资产和应收款项。


