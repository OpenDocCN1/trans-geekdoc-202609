    ## Chapter 3: History of Cryptocurrencies


    ![](img/9e732599f379d4f1dd55a1fd64d01531_157_0.png)


    Digital money, or digital currency, is any form of money or payment that is only
    available in electronic form. Digital currency lacks a tangible form, like a bill,
    receipt, or coins. Electronic codes are used to account for and transmit it in
    machines. Payments are becoming more automated as automation becomes more prevalent,
    resulting in a decrease in the need for physical currency. Cryptocurrency, also
    widely recognized as crypto, is a type of digital currency that can be used as
    a form of payment. It employs cryptography to secure & verify transactions, as
    well as to regulate the creation of new digital currency units. Blockchain technology
    is a distributed ledger mandated by a distributed network of computers. Blockchain
    is at the heart of many cryptocurrencies. Cryptocurrencies differ from fiat currencies
    like the US dollar and the British pound in that they are not issued by a central
    authority, making them potentially insensitive to government intervention or manipulation.
    In this chapter, we will discuss various concepts of a cryptocurrency and unravel
    information about its origin to help you understand the unique financial innovation.


    ### 3.1 How does cryptocurrency work?


    The vast majority of cryptocurrencies operate independently of a central bank
    or government. Rather than relying on state guarantees, cryptocurrencies are powered
    by a decentralized technology called blockchain. Cryptocurrencies do not appear
    in the form of a banknote or a coin. Rather, they exist solely on the internet.
    Consider them virtual tokens, whose value is determined by market forces established
    by those who want to buy or sell them. Cryptocurrency is created by mining. Mining
    is a process in which complex computer processing power is involved to solve complex
    mathematical problems in order to earn coins. Users can also buy the currencies
    from brokers. Users can then store and spend with the help of encrypted wallets.


    ### 3.2 Explanation of Cryptocurrency


    New types of technology now allow digital money or cryptocurrency to be used more
    safely and effortlessly. With technology such as credit cards, smartphones, and
    online crypto-currency transactions, digital money can be transferred and traded.
    Crypto currency refers to a type of cryptography-secured digital money that makes
    it even harder to counterfeit or double-spend. It operates through decentralized
    blockchain technology-based networks, which are basically a database that is stored
    through a computing network. Crypto currencies are not distributed by a central
    bank or government, which frees them from the impediment of government interference
    or abuse. Digital money''s history dates back to the internet''s inception. In
    the early days, there were challenges in getting the community to support the
    use of digital currency; but as people get more familiar with technology and the
    technology itself gets simpler and safer, more people are now eager to use digital
    money. PayPal is considered one of the first popular enterprises to introduce
    to mass adoption the concept of easy-to-use automated financial transactions.
    To understand how digital currency has become so popular, it is important to first
    understand what digital currency is. Crypto currencies decentralize currencies
    in very basic words so that the money is not regulated by the government. However,
    without a single agency, it becomes a challenge to check transfers and stop double-spending.
    That is when the culture of cryptographers comes into play. Crypto currency transactions
    are effectively distributed to the whole network through cryptography and blockchain,
    rather than checking a transaction via a centralized third party. In an open-source
    network, this public ledger tracks all transactions, empowering anyone to see
    transactions. Transactions are only done when by solving a cryptographic puzzle,
    crypto currency miners validate the transaction. In crypto-currencies, by legitimizing
    transfers, miners operate as a third party, close to the government, in regular
    currency transactions. Crypto miners are, however, paid with crypto from the network
    itself instead of taking a share of the trade and the money of the participants.
    In order to preserve the integrity of the transaction history, this system encourages
    everybody in the blockchain. This solution to the conventional financial system
    has become more and more attractive as it encourages individuals without a watchful
    third eye to have more power over their money. Now, let''s have a look back at
    the monumental steps of the crypto-currency over the past 10-plus years.


    ### 3.3 Why do we use cryptocurrencies today?


    The main goal of cryptocurrency is to address the problems of traditional currencies
    by giving currency holders power and responsibility. Every cryptocurrency tries
    to solve one or more real-world issues. The following are four major reasons why
    people have become interested in cryptocurrency.


    ### 3.3.1 Cryptocurrency is owned by everyone


    Cryptocurrency works in a similar way to traditional national currencies, but
    with a few key differences. A governmental body creates and regulates current
    "fiat currency," all of which now represent debt. Anyone who owns a country''s
    currency is in possession of an "IOU" issued by that country. The term "cryptocurrency"
    does not mean "debt." It only represents itself, and its worth is ascertained
    by what somebody is willing to give up in exchange for it. The decentralized nature
    of cryptocurrency has a significant impact on how its value is determined. A cryptocurrency
    is neither owned nor regulated by anyone. Its value is unaffected by the political
    whims of a country''s government or the monetary policies of its central bank.
    Cryptocurrency, like stocks and bonds, is regarded as an asset. When sold or exchanged
    in the United States, it is subject to capital gains taxes.


    ### 3.3.2 Cryptocurrency is almost impossible to forge


    Cryptocurrency is based on a distributed ledger called a blockchain. Understanding
    blockchain technology can help you see why it is so important to the digital currency''s
    power. The "block" is made up of encrypted data chunks. The "chain" refers to
    the public database where the blocks are stored and linked sequentially. Each
    block in the blockchain has its own unique code that distinguishes it from all
    other blocks. A hash is a name given to this one-of-a-kind code. The blocks of
    data that are added to a blockchain are added in chronological order. After the
    creation of the last block, a new block is created with its own unique hash. The
    ledger and/or database of blocks in the chain is distributed globally at the same
    time, across thousands, or in the case of Ethereum and Bitcoin, millions of computers.
    Assume that someone wished to forge a single data block on the chain. In that
    case, they''ll have to change all of the blocks from a certain point in time forward,
    as well as update all of the computers that have copies of the blockchain ledger.
    Theoretically, this is possible, but the amount of money and influence required
    to pull it off makes it nearly impossible.


    ### 3.3.3 Cryptocurrency transactions are confidential


    Traditional government-issued currencies allow you to conduct private transactions
    or make payments in person using physical cash. Paper, metal, cloth, as well as
    plastic currencies, account for a small percentage of total fiat money in circulation.
    Large cash withdrawals are quickly detected and investigated by a central authority,
