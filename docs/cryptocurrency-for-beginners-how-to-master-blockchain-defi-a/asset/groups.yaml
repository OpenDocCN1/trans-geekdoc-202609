    # Chapter 4: Myths about cryptocurrencies and Altcoins Generation 2


    The universe of cryptocurrencies has flourished in recent years due to the asset''s
    incredible profits. However, their meteoric growth, fueled by Bitcoin, has spawned
    a slew of myths that may or may not be genuine. Here are some typical cryptocurrency
    misconceptions. It is feasible for governments to order financial institutions
    to cease dealing with cryptocurrency or any companies that deal with them, but
    it is practically hard to outright prohibit cryptocurrencies from existence. Cryptocurrency
    transactions are no more complicated than sending an email, and anybody who has
    internet access can do them with ease.


    Governments have been apprehensive of the dangers involved with cryptocurrency
    because they want to exert more authority over anything that could be deemed a
    viable currency in the first place. However, a growing number of countries have
    shown a readiness to approach cryptocurrency with an inquisitive attitude in recent
    years.


    The application cases of blockchain, a technology that supports cryptocurrencies
    like bitcoin, have gotten a lot of attention. Any experts believe that blockchain
    has yet to establish any use case and that bitcoin is likely the only tool that
    has had some success. The fact is that blockchain technology is evolving at a
    breakneck speed. Smart contracts on the blockchain, for example, may hold a contract
    between such a lender and a house loan recipient. It has the potential to automate
    loan payments from the beneficiary''s crypto wallet to the lender''s account.
    From DeFi to NFT, blockchain technology offers a plethora of possibilities and
    applications.


