    ## 3.2 Stellar


    Stellar 是一种基于分布式账本技术的支付机制。它能够在几秒钟内实现任何两种货币之间的跨境支付。在许多方面，它与其他基于区块链的加密货币相似。通货膨胀是
    X.L.M. 被创建的唯一其他方式。为了适应经济增长和丢失的 Lumen，Lumen 生成率设定了每年 1% 的固定通货膨胀率。新的 Lumen 每周通过直接投票系统生成并分配。


