    ## 3.5.6 B-Money


    Wei Dai came up with B-money as an early proposal for an "anonymous, distributed
    electronic cash system." Satoshi Nakamoto made a reference to B-money when he
    created the world-famous Bitcoin. B-money was first offered in 1998 by Wei Dai,
    a graduate of Washington University. His plan was to create a free online financial
    system. So that no one can impose taxes or compel people to do anything, few people
    will remember B-Money, which was first introduced to the public in 1998, more
    than ten years before bitcoins. B-Money, on the other hand, is very different
    from bitcoins, despite the fact that the creator of the first, Wei Dai, also wanted
    to create an unnamed and distributed method of issuing coins. Technical documents
    (link) (the so-called "white paper") containing the same basic principles as modern
    cryptocurrency were published to speed up the implementation of B-money. The "digital
    aliases" are expected to be able to send as well as receive money through a decentralized
    network, as well as ensure the execution of contracts between themselves without
    the involvement of a third party. The use of a proof of work function as a means
    of creating money is proposed in the first protocol. Dai''s B-Money was proposed
    in the context of cypherpunks mailing-list discussions about Hashcash, the first
    symmetric proof-of-work function, which was also printed on the same mailing list
    the previous year - in May 1997. (Bitcoin uses the hashcash cost function as the
    proof-of-work during coin minting, just like the B-money proposal.) Money is transferred
    in B-Money by transmitting the transaction to all participants, who all keep track
    of each other''s accounts. Contracts with the possibility of reparation in the
    event of default can be made with a third party agreeing to act as arbitrator.
    If no agreement is reached, each party broadcasts arguments or evidence in its
    favor, and each participant calculates the reparations/fines in his own account.
    The accounts can be kept only by a subset of participants, the "servers". These
    accounts are necessary to be published, and the participants who do exchanges
    verify their balances by asking a large number of them in the second protocol.
    The participants also make sure the money supply isn''t inflated. To become a
    server, you must post a bond, which is forfeited if the server is found to be
    dishonest. An alternative method of creating money is proposed, involving an auction
    in which participants bid on the solution of known-complexity computational problems.
    Regretfully, the B-Money project has remained stuck since the white paper was
    implemented.


    ## 3.5.7 PayPal


    ![](img/9e732599f379d4f1dd55a1fd64d01531_172_0.png)


    PayPal (PYPL) is a true e-commerce behemoth with a bright future and a devoted
    user base that is expected to grow as more young people embrace the digital-payment
    platform. The company is profitable, with revenue exceeding $15 billion in 2018,
    and truly global in scope, with the platform supporting 100 currencies in over
    200 global markets. The conventional wisdom is that PayPal will continue to grow
    and dominate the digital payment space, despite increased competition for a share
    of the lucrative e-commerce payments market - one of the most lucrative in an
    expanding business and consumer technology market.


    ### The History of PayPal


    Although PayPal''s history isn''t particularly lengthy, there have been numerous
    ebbs, flows, and tipping points throughout the company''s two-decade-plus existence.
    When technology entrepreneurs Peter Thiel and Max Levchin founded PayPal in 1998,
    it wasn''t even called PayPal. Confinity was the company''s original name, and
    it was founded on the premise of providing consumers and businesses with low-cost,
    almost effortless digital payments. As the internet''s grip on global consumers
    tightened, the company wisely targeted an underserved market: banking and payments.


    The founders'' concept was simple and effective: persuade customers to share their
    email addresses, banking information, and credit card numbers in exchange for
    quick, low-cost payments. Within three years of opening its doors, the company
    had processed more than $3 billion in payments from 10.2 million individual consumers
    as well as 2.6 million commercial customers. After deciding to focus solely on
    payments made over the internet, the founders changed their name to PayPal two
    years later. Thiel and Levchin cleverly exploited a gap in the payments market,
    when no one was really concentrating on a digital payment platform for consumers
    and businesses, a gap that the duo brilliantly exploited as PayPal took off at
    the turn of the century.


    ### PayPal timeline


    PayPal''s growth trajectory accelerated in its early years, and the company soon
    set some impressive growth benchmarks.


    ### August 1998


    After giving a speech on global market opportunities at Stanford University, Peter
    Thiel meets Max Levchin. They came up with the concept of digital wallets later
    that year.


    ### December 1998


    PayPal is established.


    ### October 1999


    Email-based payment technology is produced by the company''s engineer.


    ### January 2000


    PayPal''s founders and managers noticed that end-users were asking commercial
    partners as well as other buyers to sign up for PayPal in order to facilitate
    faster payments. PayPal paved the way for eBay payments on the site almost immediately,
    boosting PayPal''s user base significantly.


    ### March 2000


    PayPal surpasses the one million customer target.


    ### June 2001


    The founders replace the Confinity name with its official name PayPal.


    ### February 2002


    With the issuance of new company stock, PayPal (PYPL-Nasdaq) goes public. The
    IPO is a success, with PayPal stock rising by more than 50% and closing at $20
    per share on its first day of trading.


    ### October 2002


    In a much-touted "marriage" between digital auction as well as online payment
    services, PayPal is sold to eBay for $1.5 billion.


    ### February 2006


    PayPal crosses one hundred million end-user accounts.


    ### April 2006


    PayPal launches PayPal Mobile, a new mobile payment platform that allows customers
    to pay with PayPal from their smartphones.


    ### December 2008


    PayPal moves close to the one hundred million user accounts user mark.


    ### September 2013


    PayPal pays $800 million for Braintree Systems, the payments gateway company that
    was owned by Venmo, an online payment competitor.


    ### July 2015


    PayPal buys Xoom, a digital money transfer firm, for $890 million. This enables
    the company to accelerate the handling of international payments.


    ### February 2017


    PayPal launches its first peer-to-peer payment system. This helped the company
    establish a solid foothold in the emerging P2P marketplace.


    ### Present


    The company has begun to delve deep into the lucrative but volatile cryptocurrency
    market, concentrating on the technology''s underlying Blockchain platform and
    avoiding Bitcoin - at least for now. In addition, the company is expanding its
    presence in India, a key global market, by hiring 1,200 new company technology
    specialists to concentrate on mobile as well as other emerging payment technologies
    in India. It also announces a partnership with Facebook (FB) - Get Facebook, Inc.
    Class A Report Marketplace, which company officials believe has the potential
    to outperform its long-time partner eBay in terms of financial performance. Overall,
    investors and analysts see PayPal as a leading player in the digital payments
    sector, and despite fierce competition from fintech companies and major global
    banks for the same customers, the company appears well-positioned for financial
    growth in the future, with a rising share price a near-certainty.

