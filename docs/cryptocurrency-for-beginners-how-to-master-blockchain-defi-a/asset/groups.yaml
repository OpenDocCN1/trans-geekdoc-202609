    ## 1.9 All about Bitcoin


    Bitcoins have led investors and the rest of the globe on a wild journey from its
    small start in 2008 to its price high in 2017. It''s risen, fallen, rallied, and
    then risen again in a little over a decade. Bitcoin is based on economic ideas
    and market efficiency principles. It is a property that is not owned by a single
    body, is safe, international, fungible, liquid, and has a finite supply for trading.
    Because of the high demand and near-constant supply, prices have risen disproportionately
    quickly, drawing additional investors. Some would argue that Bitcoin''s tumultuous
    voyage paved the way for the hundreds of other cryptocurrencies that are now utilized
    for financial and investment purposes, he argues. This is how Bitcoin accomplished
    it.


    ### Bitcoin Price History


    Earle claims that "Bitcoin''s history is essentially one of meteoric expansion
    interrupted by a few dramatic price retrenchments. The price of bitcoin surpassed
    $1 in February 2011. Its pricing was around $2 for the first several years as
    it flourished. In June 2011, it saw its first bubble, skyrocketing to approximately
    $31 before plummeting to single digits. Bitcoin topped $200 almost shortly afterward,
    in April 2013. It was worth over $1,000 by the end of December of the same year.
    In November 2017, it rose tenfold to $10,000.


    ![](img/9e732599f379d4f1dd55a1fd64d01531_33_0.png)


    The highest price for bitcoin was around $19,650 in late 2017, with varied peak
    values on other exchanges. "Over the following five years, it plummeted dramatically.
    The 2017-2018 boom was mostly driven by a surge in digital currencies or ICOs.
    Some market experts link Bitcoin inflation to the late-twentieth-century internet
    boom.


    Everyone from your next-door neighbor to the world''s richest money managers was
    speaking about Bitcoins or some other cryptocurrency, new network, or protocol.
    The ICO fever flooded the crypto market with billions of cash. Investors watched
    the value of coins plummet in the first months of 2018, as prices plummeted due
    to a combination of psychological and technical causes like uncertainty, fraud,
    and a loss of faith.


    Following the depreciation of bitcoin''s value, a "mature market" emerged around
    the cryptocurrency. National banks were granted authorization to hold digital
    assets when Fidelity joined the custodian field. Today, Bitcoin trading is available
    in all 50 states via Square. Bitcoin''s market has grown quite mature as a result
    of these events. Smart and effective exchanges exist, and major institutional-grade
    participants are taking the required steps to build a sustainable, viable market
    for Cryptos trading and investment. The worldwide pandemic of 2020 has also benefited
    digital money, as seen by its present price of much more than $10,000.


    ### Bitcoin Today


    One bitcoin is now worth slightly less than $12,000 at the time of writing. It''s
    a far cry from its post-peak low of just over $3,000, which was the previous record.


    Even now, no one understands who Satoshi is or was. In addition to the discussion,
    conjecture, and—perhaps unavoidably—conspiracy theories surround this issue. Conspiracy
    theories abound, ranging from Bitcoin being a skunk work or an advanced and frequently
    covert project of Alphabet or an intelligence organization such as the Security
    Agencies to Bitcoin really being a skunk work. Others say it is a ''trapdoor project,''
    which, when it becomes large enough, will be taken over by a malicious group that
    has been waiting quietly in the wings for more than a decade.


    The value of Bitcoin is more essential than its price history. "Two long-disputed
    viewpoints are supported by the evidence: first, that currency is a product like
    any other, and second, that money may be created as a consequence of a market
    process. The "concept that money really isn''t money until it is recognized as
    payment for taxes" has been substantially extinguished by cryptocurrency, and
    particularly by Bitcoin, even as it continues to develop into its position as
    a store of wealth and unit of account, according to the author, Earle expresses
    himself."


    ### Bitcoin Tomorrow


    So, what does the future hold for Bitcoin? Nobody knows for sure, but Furo thinks
    it''ll be a bright and lively place. "Innovative, cost-effective, and transparent
    investment vehicles are on the horizon and will help make bitcoin investing even
    more available," he argues. This level of access would be comparable to that of
    conventional marketplaces. Just keep in mind how no investment, especially one
    on the frontier, is without danger. If there''s one thing we can learn from Bitcoin''s
    past, it''s that what starts going up can also fall down and can come down quickly.


    ### Pros and Cons of Bitcoin


    In this day and age, no matter where you fall on the economic spectrum — whether
    you''re a traditionalist who prefers actual cash or an investing devotee — you''ve
    almost surely heard about cryptocurrencies and maybe even some of their benefits
    and drawbacks. Cryptocurrency has grown in popularity in recent years, with over
    14% of the U.S. population holding some type of bitcoin as of March 2021. Furthermore,
    Bitcoin is owned by approximately 46 million people in the United States.


    Bitcoins are one of the most well-known and widely used cryptocurrencies. It''s
    also where bitcoin newbies could contemplate putting their toes into cryptocurrency
    investment. So, if you''re wondering, "Is Bitcoin worth investing in?" or "Is
    Bitcoin a good investment?" knowing the benefits and drawbacks of Bitcoin will
    assist.


    ### Advantages of Bitcoin


    Despite the fact that Bitcoin was launched in 2009, it is still regarded as a
    new kind of money with a bunch of misunderstandings. Understanding the advantages
    of Bitcoin will help you determine whether it''s a suitable investment for you.


    ### User Anonymity and Transparency


    Bitcoin users are recognized by numerical identifiers and may have several public
    keys, albeit they are not fully anonymous. This eliminates public monitoring and
    prevents transactions from being linked back to the person. Despite the fact that
    the transactions are constantly visible, which provides transparency, blockchain
    technology ensures that they are protected from fraud. Furthermore, you, as the
    account holder, would be the only one who knows how many bitcoin you have.


    Even though the address for a private wallet becomes public, you could construct
    a new wallet for greater protection and anonymity. In contrast to a typical money
    system in which private details might be leaked from the bank, Bitcoin transactions
    do not need any additional personal information, which enhances user privacy.


    ### Accessibility and Liquidity


    One of the most appealing aspects of cryptocurrency, and Bitcoins are no exception,
    is that it frequently sees no boundaries. Bitcoin has the advantage of being highly
    accessible and adaptable money. Because sending bitcoins to some other user takes
    just a few minutes, it may be used to buy products or services with the ever-growing
    number of businesses who accept it. This enables spending the money in another
    nation and converting currencies easily, with the added benefit of low or no costs.
    Bitcoins are also easy to sell at any time.


    ### Independence from Central Authority


    Bitcoin is a decentralized currency, which means it isn''t controlled by a single
    country''s central bank. This implies that your coins are unlikely to be frozen
    or demanded by authorities. There''s also no method to tax Bitcoin in a practical
    manner. Because the pricing isn''t related to government policy, this theoretically
    provides people independence and freedom over their money. And, in general, cryptocurrency
    users consider this to be one of the most significant benefits of Bitcoin.


    ### Disadvantages of Bitcoin


    Despite its quick development and a growing number of customers, there are certain
    downsides to Bitcoin that you should be aware of, particularly if you''re considering
    whether it''s worthwhile to invest in cryptocurrency. As with many financial choices,
    the more information you have, the more educated a conclusion you can make about
    whether or not it is worthwhile to invest in Bitcoin.


    ### No Government Regulations


    Sure, a decentralized currency is one of the advantages of cryptocurrencies, but
    it can also be perceived as a drawback of Bitcoin since it implies that Bitcoin
    investments are unregulated. Unlike a currency controlled by the central bank,
    Bitcoin is unprotected by law and is often irreversible, making them vulnerable
    to fraud.


    Another disadvantage of Bitcoin''s decentralized nature is that there is no assurance
    of a minimum value. As a result, if a huge group of investors chooses to stop
    utilizing bitcoins and trade them, the cryptocurrency''s value might plummet,
    affecting users who own substantial amounts of the cryptocurrency.


    ### Volatility

