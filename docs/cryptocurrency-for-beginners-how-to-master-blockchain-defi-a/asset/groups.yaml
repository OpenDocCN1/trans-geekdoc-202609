    关于安全和财务担保，例如网络存款保险公司 FDIC。


    ## 人为错误（与遗忘）


    由于资产类别的抽象特性，人为错误以及密码遗忘等令人困惑的情况可能导致加密货币财富的完全丧失。并非人人都像 50 Cent 那样幸运，他在仅仅为了发行专辑而忘记比特币后，发现了一笔
    800 万美元的比特币奖金。被锁定在外、丢失硬件或遇到“地理物理危险”（如打翻咖啡）的威胁足以造成损失——更不用说由于比特币价格波动而带来的购买后悔这一始终存在的风险。在资产持有者光谱的“鲸鱼”这一端，知名度高且公众地位突出的持有者可能面临绑架、赎金和勒索等直接的实际安全问题。一大群兰博基尼并不能帮助人们避免成为目标所需的谨慎。


    ## 技术风险


    已有许多文章探讨比特币挖矿的计算难度和能耗，以说明加密货币的部分技术局限。在假设复杂结构会以复杂方式失效的前提下，这种计算成本也可能起到相反作用，对资产类别构成重大威胁。事实上，真正的区块链系统的去中心化特性提供了集中式数据库所不具备的内在灾难和风险防护。然而，并非所有加密货币或代币都遵循相同路径。因此，投资者应警惕众多项目所声称的技术风险和去中心化特性，因为并非所有加密算法都同等创建。


    ## （非）安全避风港


    缺乏对加密货币及该资产类别在监管、财务、税务和法律处理方面的合作与透明度，是另一大主要危险。鉴于该行业相对新兴，且“监管跟进”的质量通常较差且滞后，这种情况可预见。事实上，直到
    2017 年比特币惊人走红之前，全球大多数主管部门才开始对加密货币形成看法。突然间，全球各国政府和司法管辖区都发起了加密货币领地争夺战，力争成为潜在投资者和企业的首选地点。如同国际经济市场一样，协调与一致性在很大程度上有助于避免系统性和平淡无奇的危险，同时提升整体市场稳定性。


    ## 分叉引发的内战


    最后但同样重要的是，尽管许多加密财富集中在考虑这种投资工具对世界产生积极影响的长期战略的人群中，但分叉战争和分叉（可能分裂加密货币共识，侵蚀市场份额、估值和采用率）的威胁始终存在。这场标准之争持续不断，尤其体现在比特币现金的推出上。尽管关于对称加密的讨论提及一个由盲目模块化信任主导、没有中央权威的世界，但值得注意的是，大型虚拟货币持有者的市政政府（类似教皇选举会或国际金融公司
    IFC/BIS）可以引导市场，试图影响后果和价格波动。小鱼虾可能会被更大的鲸鱼吞没或卷入其尾流中，就像它们可能被真实鲸鱼留下的波浪困住一样。


    比特币市场之所以有收益，正是因为存在风险。无数新进入者看到，一场由技术驱动的财富创造海啸已经袭来，无论他们是意识到区块链潜力的巨型传统组织，还是致力于构建挑战现状的新去中心化未来的初创团队。了解跳入这场浪潮的风险，将有助于加密货币的长期前景，并将其受欢迎程度扩展到风险规避型早期采用者之外。


    竞争风险很高，因为企业需要调整和扩展其产品以涵盖所有支付传输，这将需要对所有现有系统和基础设施进行重大调整。此外，这些系统变更还需要定期保持更新，并与公司的交付系统及其各第三方供应商的系统保持互操作性。


    税务风险重大，因为美国公民可能试图通过以非正常方式将资金保存在海外来规避 FBAR 申报等税务要求。无论明知故犯还是无意中促成这种规避行为的机构，都可能面临处罚和/或罚款。货币转换或反译以及这些指令的申报可能会导致额外的公司义务。


    随着技术的改进，加密货币将长期存在。公众需要一些时间来接受和信任这种货币，但风险将保持不变，某些风险对货币和公司而言都可能比以往更严重、更高。


    ### 5.2 降低风险


    加密货币本质上就很神秘；名字就说明了一切。如果采纳沃伦·巴菲特“永远不要投资自己不理解的公司”的建议，那么购买一种基于数学而非黄金的货币可能很难说服人。


