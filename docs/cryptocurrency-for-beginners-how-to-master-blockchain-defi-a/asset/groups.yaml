    \  - 5.1 加密货币风险\n  - 5.2 降低风险\n  - 5.3 投资者应避免的常见错误\n  - 5.4 投资策略\n  - 5.5 安全与保障。\n\
    - 结论\n\n## 简介\n\n加密货币在过去几年中越来越受欢迎，目前已有超过 1,600 种可用。而且数量还在稳步增加。因此，对区块链开发人员的需求也在增加。区块链工程师的薪资证明了他们备受重视：Indeed，全栈开发人员的平均年薪超过\
    \ 112,000 美元。甚至有专门的比特币招聘网页。加密货币是为交易而设计的数字或虚拟货币。它的工作方式类似于现实世界中的现金，只是没有实体形式，并依赖加密来运行。只有在满足特定要求时，才能引入新单位，因为加密货币自由且自主地运行，无需银行或中央机构。比特币的上限为\
    \ 2100 万，之后将不再生成更多。\n\n![](img/9e732599f379d4f1dd55a1fd64d01531_5_0.png)\n\n加密货币作为在线交易的支付选项越来越受欢迎。在将美元、欧元、英镑或其他传统货币转换为比特币（最流行的加密货币）之前，熟悉加密货币并了解使用它们相关的风险至关重要。说到使用加密货币，有哪些危险？尽管加密货币仍是一个相对较新的概念，但此类数字货币的市场波动性很大。因为加密货币不需要银行或其他相关方的参与来治理，它们通常没有保险，且难以转换为法定货币形式。此外，由于加密货币是无形创新资产，它们容易受到黑客攻击，就像任何其他无形技术资产一样。最后，由于您将加密货币投资存储在虚拟钱包中，如果失去对钱包的访问权限，您将失去整个加密货币投资。\n\
    \n尽管大多数人投资加密货币就像投资股票或贵金属等其他资产一样，但您可以使用加密货币购买传统产品和服务。虽然加密货币是一种新颖而有趣的资产类别，但投资它们可能很危险，因为您必须进行广泛的研究来了解每个系统的运作方式。中本聪最初在一篇名为\
    \ \"Bitcoin: An end-to-end Electronic Cash System\" 的论文中将比特币提议为点对点电子现金系统。中本聪关于该概念表示：“一种以密码学证据而非信任为关键的数字支付系统。”这种密码学证据以区块链上的经过验证和记录的交易形式出现。\n\
    \n说到加密货币，世界上存在分歧。一方面，支持者如 Bill Gates、Al Gore 和 Russell Brand 认为加密货币优于传统货币。另一方面，有些人反对它，例如\
    \ Warren Gates、Paul Krugman 和 Steven Shiller。Krugman 和 Shiller 都是经济学诺贝尔奖获得者，他们认为这是一种庞氏骗局和犯罪活动的载体。未来将在监管与匿名性之间发生冲突。因为几种加密货币已与恐怖活动有关联，政府可能希望控制其运作方式。另一方面，加密货币非常注重确保用户保持匿名。\n\
    \n区块链技术是一种以这种方式存储数据的方法，使得数据难以或无法被更改、黑客攻击或欺骗。区块链是一份数字交易日志，被复制并分布在区块链完整的计算机系统网络中。链上的每个块包含若干笔交易，每当数据库中发生新操作时，该事件的备注就会添加到每个参与者的账本中。分布式账本是由多个人管理的分散数据库。区块链是一种分布式账本技术，其中信息使用哈希（即不可更改的电子签名）进行记录。\n\
