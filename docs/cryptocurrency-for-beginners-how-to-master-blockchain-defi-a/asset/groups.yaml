    unique and hard to forge. Because metals met this requirement, metal coins were
    created. To serve as a medium, small gold coins were minted. The weights of these
    coins represented their value. The use of precious metals had the disadvantage
    of not being readily available in every location. There was also an increased
    risk of theft.


    ### 1.2.4 A comparative analysis of gold and money


    John Maynard Keynes described gold as the “barbarous relic.” He was alluding to
    the fact, based on his belief and analysis, that gold’s usefulness and its value
    are antiquated. It was in 1971 when Nixon took the world off of the gold standard,
    proclaiming, “We’re all Keynesians now.” Milton Friedman once famously said, “Money
    is what money does.” This means that anything can be classified as money provided
    that it can be used as a medium of exchange. Convicts, for example, often trade
    cigarettes for goods and services, so in prison, cigarettes are money. Likewise,
    for most of human history, gold has been a medium of exchange. In today''s economy,
    paper cash is the preferred form of payment. Some argue that the sole advantage
    of gold is that it is a substance that is utilized in jewelry. The opposing camp,
    on the other hand, claims that gold is a unique asset with a variety of inherent
    attributes that make it vital for investors to maintain in their portfolios. The
    question is whether or not gold is still valuable. Gold is unquestionably associated
    with money. Surprisingly, governments all around the globe own substantial amounts
    of gold and have recently begun to increase their gold holdings. The question
    is: If gold is not money, why would they own it all? If the answer is “yes,” then
    what is its value? The overwhelming evidence from the past suggests that gold
    was used and was useful as a medium of exchange, as elaborated below:


    ### 1.2.5 Gold''s brief history


    One cannot fully comprehend gold’s actual purpose without looking back at the
    onset of the gold market. The history of gold began in 3000 B.C. It was the time
    when the early Egyptians started making jewelry. This wasn''t till 560 B.C. that
    gold began to be used as a medium of exchange. Merchants at the period were seeking
    a means to create a standardized, readily transportable form of money that would
    make the trade process easier and more efficient. Although gold jewelry was generally
    acknowledged and recognized at the time, the invention of a gold coin stamped
