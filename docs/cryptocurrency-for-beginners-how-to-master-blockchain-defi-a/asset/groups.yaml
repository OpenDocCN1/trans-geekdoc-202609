    Paypal buys Xoom, a digital money transfer firm, for $890 million. This enables
    the company to accelerate the handling of international payments.


    # February 2017


    PayPal launches its first peer-to-peer payment system. This helped the company
    establish a solid foothold in the emerging P2P marketplace.


    # Present


    The company has begun to delve deep into the lucrative but volatile cryptocurrency
    market, concentrating on the technology''s underlying Blockchain platform and
    avoiding Bitcoin - at least for now. In addition, the company is expanding its
    presence in India, a key global market, by hiring 1,200 new company technology
    specialists to concentrate on mobile as well as other merging payment technologies
    in India. It also announces a partnership with Facebook (FB) - Get Facebook, Inc.
    Class A Report Marketplace, which company officials believe has the potential
    to outperform its long-time partner eBay in terms of financial performance. Overall,
    investors and analysts see PayPal as a leading player in the digital payments
    sector, and despite fierce competition from fintech companies and major global
    banks for the same customers, the company appears well-positioned for financial
    growth in the future, with a rising share price a near-certainty.'
