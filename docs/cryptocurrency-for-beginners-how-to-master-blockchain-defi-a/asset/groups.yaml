    专家表示，加密货币市场交易者应该经常获利了结。获利应作为最佳实践存留在你的加密货币钱包中。获利时，加密货币交易者常常面临加密货币价值可能上涨或下跌的风险。定期获利了结有助于随时间平滑这种风险。“许多人只是买入并持有不确定的时间，”Greenberg
