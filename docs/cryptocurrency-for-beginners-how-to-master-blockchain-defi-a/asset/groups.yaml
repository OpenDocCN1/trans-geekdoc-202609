    ## 1.6 Cryptocurrency in the Future


    When it comes to cryptocurrencies, the globe is plainly split. On the one hand,
    proponents like Bill Gates, Al Gore, and Russell Brand argue that cryptocurrencies
    are superior to traditional currencies. On the other hand, there are some who
    are against it, such as Warren Buffett, Paul Krugman, and Robert Shiller. Krugman
    and Shiller, both Nobel Laureates in economics, see it as a Ponzi scam and a vehicle
    for criminal activity.


    There will be a clash in the future between regulations and anonymity. Because
    a number of cryptocurrencies have been connected to terrorist activities, governments
    may wish to control how they operate. Cryptocurrencies, but on the other side,
    place a strong focus on ensuring that users stay anonymous.


    According to futurists, cryptocurrencies will account for 25% of national currencies
    by 2030, implying that a large portion of the globe will begin to trust bitcoin
    as a method of trade. It will become more widely recognized by merchants and consumers,
    and it will retain its volatile character, implying that prices are expected to
    vary as they have over the previous several years.


    ## 1.7 Blockchain


    Blockchain technology is a method of storing data in such a manner that it is
    hard or impossible to alter, hack, or defraud it. A blockchain is a digital log
    of transactions that is copied and distributed throughout the blockchain''s complete
    network of computer systems. Each block on the chain comprises a number of trades,
    and each time a new action takes place on the database, a note of that event is
    added to the Ledger of each participant.


    ![](img/9e732599f379d4f1dd55a1fd64d01531_26_0.png)


    Distributed Ledger is a decentralized database that is administered by various
    people. Blockchain is a sort of distributed ledger technology in which information
    is recorded using a hash, which is an immutable electronic signature.


    ### The Properties of Distributed Ledger Technology


    ### Secure


    Each record is encrypted separately.


    ### Immutable


    Any records that have been verified are irrevocable and cannot be modified.


    ### Programmable


    A blockchain may be programmed (Smart contracts, etc.)


    ### Unanimous


    The legitimacy of each record is agreed upon by all network participants.


    ### Anonymous


    Participants'' identities are either anonymous or pseudonymous.


    ### Timestamped


    A block contains a transaction timestamp.


    ### Distributed


    For total transparency, all network members get a shared ledger.


    This implies that if a single block in a chain is modified, it will be instantly
    clear that the chain has been tampered with. Hackers would have to modify every
    block to the blockchain across all distributed copies of the chain if they intended
    to destroy a blockchain system.


    Blockchains like Cryptocurrencies are continuously expanding as new blocks are
    added to the blockchain, increasing the integrity of the Ledger dramatically.


    ### The hype around blockchain technology


    Many efforts to generate digital money have been made previously, but they have
    all failed.


    The most pressing problem is one of trust. How can we believe that if someone
    invents new money termed the X dollar, they won''t award themselves a million
    dollars or take your X amount of dollars?


    Bitcoin was created to address this issue by using a blockchain, which is a form
    of a database. A person in control of most regular databases, such as a SQL database,
    may make changes to the data. Blockchain is unique in that no one is in control;
    instead, the individuals who utilize it run it. Bitcoins can’t be counterfeit,
    hacked, or double-spent, so those who hold them may be certain that they’re worth
    something.


    ## 1.8 Decentralization


    The movement of power and choice from a centralized entity to a dispersed network
    is referred to as decentralization in the blockchain. Decentralized networks aim
    to limit the amount of confidence that members must put in one another and prevent
    them from exerting control or power over others in ways that harm the network’s
    performance.


    ### Why decentralization matters


    The notion of decentralization is not new. Three basic network designs are often
    examined when developing a technological solution: centralized, distributed, and
    decentralized. While decentralized networks are often used in blockchain technology,
    a blockchain application cannot simply be classified as decentralized or not.
    Rather, decentralization should be extended to all components of a blockchain
    program on a sliding scale. Greater or fairer service may be accomplished by decentralizing
    resource utilization and access in an application. Decentralization has certain
    drawbacks, such as decreased transaction throughput, but the benefits of increased
    stability and levels of service outweigh the drawbacks.


    ### Benefits of decentralization


    ![](img/9e732599f379d4f1dd55a1fd64d01531_29_0.png)


    - Optimizes Resource distribution


    Decentralization may also aid in resource distribution optimization, ensuring
    that stated services are delivered with improved performance and reliability,
    as well as a lower risk of catastrophic failure.


    - Improves data reconciliation


    Companies often share information with their partners. This data is then modified
    and kept in each party''s silos, only to be resurfaced when it''s time to transfer
    it downstream. Each time data is converted, the possibility of data loss or inaccurate
    data entering the workstream increases. Every entity gets access to a true, shared
    view of information thanks to decentralized data storage.


    - Provides a trustless environment


    No one needs to recognize or trust anybody other in a decentralized public blockchain.
    In the format of a public ledger, each member of the network owns a duplicate
    of the same data. If a member''s Ledger is tampered with or damaged in any manner,
    the rest of the network''s members will reject it.


    - Reduces points of weakness


    Decentralization may help to mitigate sources of vulnerability in systems when
    single actors are too reliant. Systemic failures might result from these flaws,
    such as inability to deliver expected service or ineffective service owing to
    resource depletion, recurrent outages, bottlenecks, a lack of appropriate incentives
    for effective service, or corruption.


    ![](img/9e732599f379d4f1dd55a1fd64d01531_30_0.png)


    ### How decentralization compares


    Wherever possible, decentralization should be used. Because it''s a blockchain
    application, it doesn''t have to be completely decentralized. Any blockchain solution''s
    purpose is to provide what its customers need, which may or may not incorporate
    specific degrees of decentralization.


    ### Building blockchain applications leveraging the decentralization


    Decentralization varies depending on the blockchain protocol, distributed application,
    Non-Governmental Organization, or any blockchain technology solution. The maturity
    of a solution, the time-proven dependability of its incentive systems and consensus
    procedures, and the capacity of the founders to strike the proper balance determine
    the adoption level. Many DAOs, for example, have components at various stages
    of decentralization: oracles may be partially decentralized, smart contracts may
    be fully centralized, and the governance framework for adjusting parameters may
    be community-driven and decentralized.


    Decentralized cryptocurrency solutions are being researched and used by organizations
    of all types, sizes, and industries on a larger scale. Applications that offer
