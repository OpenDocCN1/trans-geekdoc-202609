    world. In 1066, the United Kingdom was likewise establishing its metal-based coinage.
    The value of all types of British currency, such as the pound, shillings, and
    pence, was based on the quantity of gold (or silver) they represented. Gold eventually
    became a symbol of riches across Europe, Asia, Africa, and the Americas.


    ### 1.2.6 Bimetallic standard of the US


    In 1792, the United States government maintained its gold legacy by creating a
    bimetallic standard. Every monetary unit in the United States had to be supported
    by either gold or silver, according to the bimetallic standard. For example, one
