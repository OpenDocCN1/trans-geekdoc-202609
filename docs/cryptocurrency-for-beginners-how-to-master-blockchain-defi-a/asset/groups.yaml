    的个性化连帽衫。Headspace 也这样做，其中一些 NFT 可以在 Decentraland 中看到。


    ### 6.3.10 虚拟场景


    NFT 可用于创建整个虚拟建筑和游戏。Metazoan 是一个出色的倡议，允许 Decentraland 土地所有者在其土地上购买和部署游戏、结构和增强功能。如果你真的想在自己的地产上举办聚会，但又不想支付
    4000 美元的开发费用，不妨考虑租赁市场。为什么不花 200 美元租用一个周末呢？随着基于区块链的虚拟领域不断扩大，这一概念潜力巨大。


    ### 6.3.11 虚拟汽车


    为什么我们不能在虚拟世界中以 NFT 形式拥有虚拟汽车、飞机和船只？有些人已将数字汽车以数百 ETH 的价格售出，随着基于区块链的虚拟世界不断发展，对先进交通和探索方式的需求也将随之增长。CryptoMotors、F1
    Delta Time 和 Battle Racers 已对此领域进行了探索。


    ## 6.4 合法且新兴的 NFT 市场


    NFT 是独一无二的对象，无法被其他任何东西取代。如今，大多数 NFT 都是数字化的。这使得创作者向粉丝提供稀有且独特的东西变得特别简单。例如，某些 NFT
    是数字艺术品，目前的收藏方式与收藏家多年来收藏真实绘画的方式相同。而其中一些 NFT 已售出天文数字的价格。最初的 NFT 是以太坊区块链的一部分，该链包含用于相互识别的额外电子数据。现在，其他区块链也支持
    NFT。由于不同的 NFT 使用不同的区块链技术，并非所有 NFT 市场都交易所有类型的 NFT。创作者通常根据市场是否支持特定的 NFT 代币标准来选择
    NFT 市场。ERC-721 和 ERC-1155 是迄今产生的两个以太坊标准。竞争对手 Binance 随后开发了 BEP-721 和 BEP-1155
    规范。由于这两个标准允许将多个 NFT 捆绑并在一起交易，它们与原始“721”规范有所不同。大多数 NFT 平台要求购买者拥有数字钱包，并使用加密货币支付购买款项。


    ### 6.4.1 OpenSea


    OpenSea 声称自己是全球最大的 NFT 市场。非同质化代币包括艺术、抗审查域名、虚拟世界、交易卡、体育和收藏品。基于 ERC-721 和 ERC-1155
    的资产也包括在内。


    ### 6.4.2 Rarible


    Rarible 是一个社交 NFT 市场，使用 RARI 代币作为其“所有权”代币，这是一个 ERC-20 代币。Rarible 向在 NFT 市场上买卖的活跃用户发放
    RARI 代币。它每周发放 75,000 个 RARI。在该平台上，艺术资产备受重视。


    ### 6.4.3 SuperRare


    SuperRare 主要是一个面向消费者购买和销售独一无二、限量版数字艺术品的市场。每件艺术品由网络艺术家创建，并被代币化为可拥有和交易的加密收藏品数字商品。他们将自己定位为
    Instagram 与 Christie''s 的结合体，提供了一种在互联网上参与艺术、文化和收藏的新方式。SuperRare 上的每件艺术品都是数字收藏品，是在区块链上加密和监控的数字对象。在市场之上，SuperRare
    构建了一个社交网络。数字收藏品非常适合社交环境，因为它们有明确的所有权记录。


    ### 6.4.4 Foundation


    Foundation 是一个利基平台，汇集数字创新者、加密原住民和收藏家以推动文化发展。它被称为“新创意经济”。它主要关注数字艺术。2020 年 8 月，他们在其网站上的第一篇博客文章中发起公开呼吁，邀请创作者使用加密货币并探索价值概念。创作者受邀黑客攻击、破坏和扭曲创意作品的价值。当
    NFT 在 Foundation 上交易时，艺术家将获得二级交易价值的 10%，即当收藏家以更好的价格将其作品转售给他人时，艺术家将获得销售价值的 10%。


    ### 6.4.5 AtomicMarket


    AtomicMarket 是一个由众多网站使用的具有共享流动性的 NFT 市场智能合约。在一个市场上发布的所有内容都会出现在所有其他交易所上，这被称为共享流动性。它是
    Atomic Assets（一种基于 eosio 网络的非同质化代币标准）的市场。Atomic Asset 标准可用于代币化和生成数字资产，以及在 Atomic
    Assets 市场上购买、交易和拍卖资产。在 AtomicMarket 上，你既可以出售自己的 NFT，也可以浏览现有列表。知名集合的 NFT 标记有验证勾选标记，从而更容易识别真正的
    NFT。恶意集合将被列入黑名单。


    '
