    由 Dan Larimer 创立，他也是 Bitshares 和 Steem 等知名平台的创始人和创建者。目前，它由 Block.one 公司拥有。


    下面是与比特币相关的按时间顺序排列的事件状态。


    ## 初始失败


    虽然加密货币直到 2009 年才合法挖矿，但在之前的年份里，曾有过其他建立数字货币的尝试。1998 年，加密货币的两位创始人 Wei Dai 和 Nick
    Szabo 发布了关于货币去中心化前景的想法。他们的提案都围绕将数字货币作为一种手段，以取代传统金融系统的低效问题，例如制造纸币和硬币货币所花费的金钱。尽管没有提案付诸实践，但十多年后，Dai
    和 Szabo 都成为了早期的加密货币采用者。第一种真正的加密货币比特币的诞生，正是这些最初失败的结果。


    ## 2008 年 10 月


    当一名或一群人以中本聪的化名发表了一篇名为《点对点电子现金系统》的比特币白皮书时，加密货币世界便开始了。这篇出版物解释了比特币是什么，为什么它等同于传统金融方案，并通过向世界引入区块链，首次似乎修复了数字货币中缺失的部分。中本聪的论文延续了十年前某些难以出现的早期概念，并正如我们所知，成为加密货币的基础。


    ## 揭露中本聪的身份


    比特币发明者的真实身份是当今世界最大的谜团之一。多年来，关于中本聪是谁的几种理论浮出水面，包括他是时间旅行者、外星人、流氓人工智能，或者是 NSA、CIA
    和 Yakuza 的幌子。中本聪是发明比特币的人为隐藏其真实身份而选择的化名。人们怀疑他声称自己是日本人，因为他出生于 1975 年 4 月 5 日，目前居住在日本。这是因为他英语母语水平，并且希望工作时间更符合英国的时间。


    ## 比特币在创建初期经历了什么？


    杂志引用的证据包括中本聪这个名字字面上孕育了多里安这一事实。他毕业于加州理工大学（Cal Poly University），主修物理，曾担任秘密军事项目的系统工程师，以及电子和金融信息服务公司的计算机工程师。“中本聪还具有自由意志倾向，并鼓励他的女儿开办一家‘不受政府控制’的企业。”当他最初被问及比特币时，中本聪错误地认为这是关于他为美国军事承包商进行的某个机密项目的询问，并说：“我对这个不再感兴趣，也无法谈论它。”随后被移交给其他人。


    ## 2009 年 1 月


    不到三个月后，中本聪通过挖出比特币的第一个区块，宣布加密货币宇宙正式开始。中本聪因批准第一笔交易而获得 50 枚比特币，该交易的受益者是 Hal Finney，而该区块被称为比特币的创世区块。数字货币的势头正式开始，交易得到正式登记，比特币网络得到合法化。


    ## 2010 年 3 月


    正式交易一年多后，以现已停止运营的 BitcoinMarket.com 形式，首个加密货币交易市场被引入。在一个比特币论坛上，一位希望开始将比特币作为人们相互共享并兑换为美元的货币的消费者提出了这一突破性进展。交易者可能潜在地衡量一枚比特币的价值，最初只需几分钱。


    ## 2010 年 5 月


    在首个数字货币交易市场建立并以鼓舞人心的速度增长之际，Laszlo Hanyecz 报告了使用比特币进行的首次产品购买。Hanyecz 在 2010 年 5
    月 22 日用 10,000 枚比特币购买了两个 Papa John''s 比萨，到 2018 年，该金额估计为 8000 万美元。这一天进一步巩固了加密货币的有效性。此后，它每年被庆祝为比特币比萨日。


    ## 2011 年 2 月 – 6 月


    此时，当其他交易市场登上舞台中心，包括臭名昭著的 Mt. Gox 市场时，BitcoinMarket.com 正变得越来越无关紧要。2 月标志着第一次，当其价值开始飙升时，


