    比特币与美元持平。整年，竞争性加密货币也开始涌现。


    6 月，当黑客盗取了 2,000 个比特币时，Mt. Gox 上发生了第一次加密货币攻击。在黑客攻击中，该市场继续在声誉和持有量方面上升。


    ## 2013 年


    时光快进两年，Mt. Gox 无疑已成为世界上最大的货币市场。据 Investopedia 报道，该市场在 2013 年的高峰期占了所有比特币交易的 70%
    以上。尽管热情高涨，但该交易所的极端声名狼藉仍为黑客提供了绝佳机会。


    ## 2014 年 2 月


    Mt. Gox 仅用一个月的时间，就从世界上最大的比特币交易所沦为破产。该交易所成为了加密货币历史上最重大黑客攻击的受害者。黑客从 Mt. Gox 消费者那里洗劫了天文数字般的
    744,408 个比特币，以及交易所本身额外的 100,000 个比特币。当时价值为 4.6 亿美元。因此，在接下来的几个月里，这次黑客攻击迫使比特币价值暴跌
    50%。尽管该加密货币的价值随后恢复到了攻击前的水平，但这次攻击本身凸显了对更强安全措施的必要性。


    ## 2015 年 7 月


    当比特币和竞争性加密货币仍在从黑客攻击的冲击中恢复时，一种新的加密货币应运而生，随之带来了另一种保护层级。以太坊网络成立，用于作为交易以太币加密货币的平台。该网络使智能合约的使用普及，智能合约是一种加密软件，无需第三方在场即可更容易地促进可信交易。以太坊网络及其智能合约现在被加密货币世界中的多种加密货币以
    ERC-20 代币的形式使用。ERC-20 代币的不同之处在于，它们是由以太坊网络的智能合约生成的资产，而比特币和其他加密货币拥有自己的区块链，因此与以太坊的区块链共存。


    ## 当前


    此后，加密货币环境的进步持续不断，目前可交易的加密货币已超过 2,000 种。凭借其 2020 年 4 月最新的全市场评估达到 1280 亿美元，比特币似乎处于主导地位。就市值而言，数字货币
    XRP（80 亿美元）和以太坊（190 亿美元）高于其他三种加密货币。


    ## 第 4 章：什么是区块链？


    ![](img/9e732599f379d4f1dd55a1fd64d01531_203_0.png)


    区块链是一种数据记录机制，使得修改、黑客攻击或作弊系统变得困难或不可能。区块链基本上是一种数字交易账本，在整个计算机系统网络中复制并分布在区块链上。链中的每个块包含若干笔交易，每当区块链上发生新交易时，该交易的记录就会添加到每个参与方的账本中。分布式账本技术被定义为由许多用户操作的共享网络（DLT）。区块链是一种
    DLT 类型，其中一种称为哈希的不可更改的加密签名会在交易中注册。这意味着，如果一条链中的一个区块被篡改，那么它已被破坏就会自动明显。如果黑客要破坏区块链结构，他们必须通过链的所有分布式迭代来更改链中的每个区块。随着区块被附加到链中，比特币和以太坊等区块链正在积极且持续地增长，这大大有助于账本的稳定性。区块链为企业带来了交易透明性的承诺，有可能与全球合作者建立稳定的实时联系网络，以促进从供应链到支付网络，再到房地产交易和健康数据交换的方方面面。围绕这种相对现代的技术的当前猜测是真实的，因为
    DLT 基本上是一种新的信息交换模式；计算机提供商和企业不出所料地竞相学习如何使用分布式账本技术（DLT）来节省时间和行政成本。


    ### 4.1 区块链技术的未来


    目前行业中最受关注的发展之一就是区块链。从金融和网络安全，到知识产权和医疗保健，区块链技术有能力在各行各业推动重大改进并创造新市场。区块链是一个共享档案，作为电子分布式账本或文档登记处，向多人开放。为了注册、处理和验证任何交易，区块链使用加密技术，使其稳定、永久且透明。存在两类通用的区块链：


    - 无许可型，任何人都可以进入

    - 许可型，允许参与者由监督它的成员或组织批准（此类别进一步细分为私有区块链网络和社区区块链网络）


    ### 4.1.1 谁已经在使用区块链？


    区块链技术最著名的实例是比特币，但越来越多的早期采用者正在进入该领域。例如，微软、高盛、维萨和德勤正在投资区块链领域的项目。以及专注于区块链服务的组织包括：


    - Spotify，用于控制版权

    - IBM，用于为超市连锁和航运公司构建监控服务

    - 伊士曼柯达，用于构建股票照片存储


    ### 4.1.2 区块链的未来


    区块链是一项新技术，因此关于其潜力的预测仍然不一。


    分析公司 Gartner 的一份新的趋势洞察研究中做出了以下预测：


    - 到 2022 年，只有 10% 的公司可以通过使用区块链进行某种根本性转型。

    - 到 2022 年，至少有一家专注于区块链技术的开创性企业将价值 100 亿美元。

    - 区块链贡献的市场价值将在 2026 年上升到略超过 3600 亿美元，然后到 2030 年扩大到超过 3.1 万亿美元。


    区块链技术预期发展中最有前景的领域之一是网络防御。数据篡改是各种规模组织面临的持续问题。可以使用区块链技术来避免篡改、保护数据安全，并允许参与者检查文件的有效性。


    在科技和 IT 市场，区块链技术被认为在未来几年将是革命性的，类似于互联网在 90 年代和 21 世纪初对世界所取得的成就。


    ### 4.1.3 区块链确保最高水平的技术


    如今，区块链是数据安全领域最安全的技术之一。数字技术的快速发展也引发了关于数据保护的新问题。通过融合强大的身份验证和加密主金库协议，组织需要保护其记录。区块链技术在解决如何保护数据和阻止破坏性网络攻击的问题上工作充分。报告称，到
    2024 年，区块链技术的总需求预计将达到约 200 亿美元。在医院、银行、体育等多个市场，区块链已具有开创性。


    与传统方法不同，许多区块链软件公司很大程度上受到这项技术的启发，以重新架构和重新制定安全问题。区块链为数据提供了真正的信任感。


    ### 4.1.4 区块链技术挑战漏洞


    为了创建稳定的数据网络，这种分布式账本系统提供的高度保护具有优势。提供消费品和服务的企业使用区块链技术来保护消费者数据信息。


    技术正在寻找颠覆市场服务和客户解决方案的创新方式。这项技术未来将成为领先者，在多样化行业中出现新兴的全球服务。


    ### 4.1.5 提供加密和验证


    区块链程序足够专业，可以处理任何事情，因此知识没有以任何方式被更改。默认情况下，区块链是加密的，这使得准确验证成为可能。


