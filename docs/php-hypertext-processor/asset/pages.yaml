- pgno: 184
  md: "When inheriting from an abstract class, all methods marked abstract in the\
    \ parent's class declaration must be defined by the child; additionally, these\
    \ methods must be defined with the same visibility.\n\n```\nabstract class MyAbstractClass\
    \ {\n   abstract function myAbstractFunction() {\n   }\n}\n```\n\nNote that the\
    \ function definitions inside an abstract class must also be preceded by the keyword\
    \ abstract. It is not legal to have abstract function definitions inside a non-abstract\
    \ class.\n\n# Static Keyword\n\nDeclaring class members or methods as static makes\
    \ them accessible without needing an instantiation of the class. A member declared\
    \ as static cannot be accessed with an instantiated class object (though a static\
    \ method can).\n\nTry out the following example:\n\n```\n<?php\nclass Foo\n{\n\
    \   public static $my_static = 'foo';\n   public function staticValue() {\n  \
    \    return self::$my_static;\n   }\n}\nprint Foo::$my_static . \"\\n\";\n$foo\
    \ = new Foo();\nprint $foo->staticValue() . \"\\n\";\n```\n\n# Final Keyword\n\
    \nPHP 5 introduces the final keyword, which prevents child classes from overriding\
    \ a method by prefixing the definition with final. If the class itself is being\
    \ defined final, then it cannot be extended.\n\nThe following example results\
    \ in Fatal error: Cannot override final method BaseClass::moreTesting()\n\n```\n\
    <?php\nclass BaseClass {\n   public function test() {\n```"
