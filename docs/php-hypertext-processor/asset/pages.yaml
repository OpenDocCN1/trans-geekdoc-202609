  md: "# 12. PHP – GET and POST Methods\n\nThere are two ways the browser client can\
    \ send information to the web server.\n\n+   - The GET Method\n+   - The POST\
    \ Method\n\nBefore the browser sends the information, it encodes it using a scheme\
    \ called URL encoding. In this scheme, name/value pairs are joined with equal\
    \ signs and different pairs are separated by the ampersand.\n\n```\nname1=value1&name2=value2&name3=value3\n\
    ```\n\nSpaces are removed and replaced with the + character and any other non-alphanumeric\
    \ characters are replaced with a hexadecimal values. After the information is\
    \ encoded, it is sent to the server.\n\n# The GET Method\n\nThe GET method sends\
    \ the encoded user information appended to the page request. The page and the\
    \ encoded information are separated by the ? character.\n\n```\nhttp://www.test.com/index.htm?name1=value1&name2=value2\n\
