  md: "```\nmyFunction();\n?>\n```\n\n# Exceptions Handling\n\nPHP 5 has an exception\
    \ model similar to that of other programming languages. Exceptions are important\
    \ and provides a better control over error handling.\n\nLet's now explain the\
    \ new keyword related to exceptions.\n\n+   • Try - A function using an exception\
    \ should be in a \"try\" block. If the exception does not trigger, the code will\
    \ continue as normal. However if the exception triggers, an exception is \"thrown\"\
    .\n+   • Throw - This is how you trigger an exception. Each \"throw\" must have\
    \ at least one \"catch\".\n+   • Catch -- A \"catch\" block retrieves an exception\
    \ and creates an object containing the exception information.\n\nWhen an exception\
    \ is thrown, the code following the statement will not be executed, and PHP will\
    \ attempt to find the first matching catch block. If an exception is not caught,\
    \ a PHP Fatal Error will be issued with an \"Uncaught Exception ...\n\n+   • An\
    \ exception can be thrown, and caught (\"catched\") within PHP. Code may be surrounded\
    \ in a try block.\n+   • Each try must have at least one corresponding catch block.\
    \ Multiple catch blocks can be used to catch different classes of exceptions.\n\
    +   • Exceptions can be thrown (or re-thrown) within a catch block.\n\n# Example\n\
    \nCopy and paste the following piece of code into a file and verify the result.\n\
    \n```\n<?php\ntry {\n    $error = 'Always throw this error';\n    throw new Exception($error);\n\
    \    // Code following an exception is not executed.\n    echo 'Never executed';\n\
    } catch (Exception $e) {\n    echo 'Caught exception: ', $e->getMessage(), \"\\\
    n\";\n}\n```"
