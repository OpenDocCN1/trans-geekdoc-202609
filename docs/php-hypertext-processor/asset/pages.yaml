  md: '# About the Tutorial


    The PHP Hypertext Preprocessor (PHP) is a programming language that allows web
    developers to create dynamic content that interacts with databases. PHP is basically
    used for developing web-based software applications. This tutorial will help you
    understand the basics of PHP and how to put it in practice.


    # Audience


    This tutorial has been designed to meet the requirements of all those readers
    who are keen to learn the basics of PHP.


    # Prerequisites


    Before proceeding with this tutorial, you should have a basic understanding of
