  md: "This session demonstrates how PHP can provide dynamic content according to\
    \ browser type, randomly generated numbers or User Input. It also demonstrated\
    \ how the client browser can be redirected.\n\n# # Identifying Browser & Platform\n\
    \nPHP creates some useful **environment variables** that can be seen in the phpinfo.php\
    \ page that was used to setup the PHP environment.\n\nOne of the environment variables\
    \ set by PHP is **HTTP_USER_AGENT** which identifies the user's browser and operating\
    \ system.\n\nPHP provides a function getenv() to access the value of all the environment\
    \ variables. The information contained in the HTTP_USER_AGENT environment variable\
    \ can be used to create dynamic content appropriate to the browser.\n\nThe following\
    \ example demonstrates how you can identify a client browser and operating system.\n\
    \nNOTE: The function preg_match()is discussed in PHP Regular expression session.\n\
    \n```\n```html\n<html>\n<body>\n<?php\n   $viewer = getenv( \"HTTP_USER_AGENT\"\
    \ );\n   $browser = \"An unidentified browser\";\n   if( preg_match( \"/MSIE/i\"\
    , \"$viewer\" ) )\n   {\n      $browser = \"Internet Explorer\";\n   }\n   else\
    \ if( preg_match( \"/Netscape/i\", \"$viewer\" ) )\n   {\n      $browser = \"\
    Netscape\";\n   }\n   else if( preg_match( \"/Mozilla/i\", \"$viewer\" ) )\n \
    \  {\n      $browser = \"Mozilla\";\n   }\n   $platform = \"An unidentified OS!\"\
    ;\n   if( preg_match( \"/Windows/i\", \"$viewer\" ) )\n```\n```"
