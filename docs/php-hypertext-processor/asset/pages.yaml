- pgno: 21
  md: '# Escaping to PHP


    The PHP parsing engine needs a way to differentiate PHP code from other elements
    in the page. The mechanism for doing so is known as ''escaping to PHP.'' There
    are four ways to do this:


    # Canonical PHP tags


    The most universally effective PHP tag style is:


    ```

    <?php ... ?>

    ```


    If you use this style, you can be positive that your tags will always be correctly
    interpreted.


    # Short-open (SGML-style) tags


    Short or short-open tags look like this:


    ```

    <? ... ?>

    ```


    Short tags are, as one might expect, the shortest **option** You **must** do one
    of two things to enable PHP to recognize the tags:


    +   - Choose the --enable-short-tags configuration option when you''re building
    PHP.

    +   - Set the short_open_tag setting in your php.ini file to on. This option must
    be disabled to parse XML with PHP because the same syntax is used for XML tags.


    # ASP-style tags


    ASP-style tags mimic the tags used by Active Server Pages to delineate code blocks.
    ASP-style tags look like this:


    ```

    <% ... %>

    ```


    To use ASP-style tags, you will need to set the configuration option in your php.ini
    file.


    # HTML script tags


    HTML script tags look like this:


    ```

    <script language="PHP">...</script>

    ```'
  merge: -1
  img_proc: true
- pgno: 22
  md: "# Commenting PHP Code\n\nA _comment_ is the portion of a program that exists\
    \ only for the human reader and stripped out before displaying the programs result.\
    \ There are two commenting formats in PHP:\n\n**Single-line comments:** They are\
    \ generally used for short explanations or notes relevant to the local code. Here\
    \ are the examples of single line comments.\n\n```\n<?\n# This is a comment, and\n\
    # This is the second line of the comment\n// This is a comment too. Each style\
    \ comments only\nprint \"An example with single line comments\";\n?>\n```\n\n\
    **Multi-lines printing:** Here are the examples to print multiple lines in a single\
    \ print statement:\n\n```\n<?\n# First Example\nprint <<<END\nThis uses the \"\
    here document\" syntax to output\nmultiple lines with $variable interpolation.\
    \ Note\nthat the here document terminator must appear on a\nline with just a semicolon\
    \ no extra whitespace!\nEND;\n# Second Example\nprint \"This spans\nmultiple lines.\
    \ The newlines will be\noutput as well\";\n?>\n```\n\n**Multi-lines comments:**\
    \ They are generally used to provide pseudocode algorithms and more detailed explanations\
    \ when necessary. The multiline style of commenting is the same as in C. Here\
    \ are the example of multi lines comments.\n\n```\n<?\n/* This is a comment with\
    \ multiline\n   Author : Mohammad Mohtashim\n   Purpose: Multiline Comments Demo\n\
    \   Subject: PHP\n*/\nprint \"An example with multi line comments\";\n?>\n```\n\
    \n# PHP is whitespace insensitive\n\nWhitespace is the stuff you type that is\
    \ typically invisible on the screen, including spaces, tabs, and carriage returns\
    \ (end-of-line characters).\n\nPHP whitespace insensitive means that it almost\
    \ never matters how many whitespace characters you have in a row.one whitespace\
    \ character is the same as many such characters."
