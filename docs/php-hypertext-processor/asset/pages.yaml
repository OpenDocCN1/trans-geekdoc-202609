  md: 'Error handling is the process of catching errors raised by your program and
    then taking appropriate action. If you would handle errors properly, then it may
    lead to many unforeseen consequences. It is very simple in PHP to handle errors.


    # Using die() function


    While writing your PHP program you should check all possible error condition before
    going ahead and take appropriate action when required.


    Try the following example without having /tmp/test.txt file and with this file.


    ```

    <?php

    if(!file_exists("/tmp/test.txt"))

    {

    die("File not found");

    }

    else

    {

    $file=fopen("/tmp/test.txt","r");

    print "Opend file sucessfully";

    }

    // Test of the code here.

    ?>

    ```


    You can thus write an efficient code. Using the above technique, you can stop
    your program whenever it errors out and display more meaningful and user-friendly
    message.


    # Defining Custom Error Handling Function


    You can write your own function to handling any error. PHP provides you a framework
    to define error-handling function.


    This function must be able to handle a minimum of two parameters (error level
    and error message) but can accept up to five parameters (optionally: file, line-number,
    and the error context):


    # Syntax


    ```

    error_function(error_level,error_message, error_file,error_line,error_context);

    ```'
