    +   - Copy some .dll files from your PHP directory to your system directory (usually
    C:\\Windows). You need php5ts.dll for every case. You will also probably need
    to copy the file corresponding to your Web server module - C:\\PHP\\Sapi\\php5apache.dll.
    to your Apache modules directory. It''s possible that you will also need others
    from the dlls subfolder, but start with the two mentioned previously and add more
    if you need them.

    +   - Copy either php.ini-dist or php.ini-recommended (preferably the latter)
    to your Windows directory, and rename it php.ini. Open this file in a text editor
