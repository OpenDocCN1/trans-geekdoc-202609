  md: "```\n$maths->getTitle();\n\n$physics->getPrice();\n$chemistry->getPrice();\n\
    $maths->getPrice();\n```\n\nThis will produce the following result:\n\n```\nPhysics\
    \ for High School\nAdvanced Chemistry\nAlgebra\n10\n15\n7\n```\n\n# Destructor\n\
    \nLike a constructor function you can define a destructor function using function\
    \ __destruct(). You can release all the resources with-in a destructor.\n\n# Inheritance\n\
    \nPHP class definitions can optionally inherit from a parent class definition\
    \ by using the extends clause. The syntax is as follows:\n\n```\nclass Child extends\
    \ Parent {\n  <definition body>\n}\n```\n\nThe effect of inheritance is that the\
    \ child class (or subclass or derived class) has the following characteristics:\n\
    \n+   * Automatically has all the member variable declarations of the parent class.\n\
    \n+   * Automatically has all the same member functions as the parent, which (by\
    \ default) will work the same way as those functions do in the parent.\n\nFollowing\
    \ example inherit Books class and adds more functionality based on the requirement.\n\
    \n```\nclass Novel extends Books{\n  var publisher;\n  function setPublisher($par){\n\
    \  $this->publisher = $par;\n  }\n```"
