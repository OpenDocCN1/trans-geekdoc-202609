    # Conditional Operator


    There is one more operator called the conditional operator. It first evaluates
    an expression for a true or false value and then executes one of the two given
    statements depending upon the result of the evaluation.


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | ? : | Conditional Expression | If Condition is true ? Then value X : Otherwise
    value Y |


    Try the following example to understand the conditional operator. Copy and paste
    the following PHP program in test.php file and keep it in your PHP Server''s document
    root and browse it using any browser.


    ```

    <html>

    <head><title>Arithmetical Operators</title></head>

    <body>

    <?php

    $a = 10;

    $b = 20;


    /* If condition is true then assign a to result otherwise b */

    $result = ($a > $b ) ? $a:$b;

    echo "TEST1 : Value of result is $result<br/> ";


    /* If condition is true then assign a to result otherwise b */

    $result = ($a < $b ) ? $a:$b;

    echo "TEST2 : Value of result is $result<br/> ";


    ?>

    </body>

    </html>

    ```'
