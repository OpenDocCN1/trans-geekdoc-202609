    result into multiple pages and how to create the navigation link.

    +   - **Updating Data Into MySQL Database** - This part explains how to update
    existing records into MySQL database using PHP.

    +   - **Deleting Data From MySQL Database** - This part explains how to delete
    or purge existing records from MySQL database using PHP.

