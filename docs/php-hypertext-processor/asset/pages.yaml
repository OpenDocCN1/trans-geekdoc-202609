    # # Converting a Time Stamp with date()


    The **date()** function returns a formatted string representing a date. You can
    exercise an enormous amount of control over the format that date() returns with
    a string argument that you must pass to it.


    ```

    date(format,timestamp)

    ```


    The date() optionally accepts a time stamp if omitted, then current date and time
    will be used. Any other data you include in the format string passed to date()
    will be included in the return value.


    The following table lists the codes that a format string can contain:


    | Format | Description | Example |

    |---|---|---|

    | a | ''am'' or ''pm'' lowercase | pm |

