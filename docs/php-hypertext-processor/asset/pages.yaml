    \ classes override definitions with the same name in parent classes. In a child\
    \ class, we can modify the definition of a function inherited from parent class.\
    \ In the following example, getPrice and getTitle functions are overriden to retrun\
    \ some values.\n\n```\nfunction getPrice(){\n     echo $this->price . \"<br />\"\
    ;\n     return $this->price;\n        }\n        function getTitle(){\n     echo\
    \ $this->title . \"<br />\";\n     return $this->title;\n        }\n    }\n```\n\
    \n# # Public Members\n\nUnless you specify otherwise, properties and methods of\
    \ a class are public. That is to say, they may be accessed in three possible situations:\n\
    \n+   * From outside the class in which it is declared\n+   * From within the\
    \ class in which it is declared\n+   * From within another class that implements\
    \ the class in which it is declared\n\nTill now we have seen all members as public\
    \ members. If you wish to limit the accessibility of the members of a class, then\
    \ you define class members as **private** or **protected**.\n\n# # Private members\n\
    \nBy designating a member private, you limit its accessibility to the class in\
    \ which it is declared. The private member cannot be referred to from classes\
    \ that inherit the class in which it is declared and cannot be accessed from outside\
    \ the class.\n\nA class member can be made private by using **private** keyword\
    \ in front of the member.\n\n```\nclass MyClass {\n```"
