  md: "# Using PHP to Backup MySQL Database\n\nIt is always a good practice to take\
    \ a regular backup of your database. There are three ways you can use to take\
    \ backup of your MySQL database.\n\n+   - Using SQL Command through PHP.\n+  \
    \ - Using MySQL binary mysqldump through PHP.\n+   - Using phpMyAdmin user interface.\n\
    \n# Using SQL Command through PHP\n\nYou can execute SQL SELECT command to take\
    \ a backup of any table. To take a complete database dump you will need to write\
    \ separate query for separate table. Each table will be stored into separate text\
    \ file.\n\n# Example\n\nTry the following example of using SELECT INTO OUTFILE\
    \ query for creating table backup –\n\n```\n<?php\n   $dbhost = 'localhost:3036';\n\
    \   $dbuser = 'root';\n   $dbpass = 'rootpassword';\n\n   $conn = mysql_connect($dbhost,\
    \ $dbuser, $dbpass);\n\n   if(! $conn ) {\n      die('Could not connect: '. mysql_error());\n\
    \   }\n\n   $table_name = \"employee\";\n   $backup_file  = \"/tmp/employee.sql\"\
    ;\n   $sql = \"SELECT * INTO OUTFILE '$backup_file' FROM $table_name\";\n\n  \
    \ mysql_select_db('test_db');\n   $retval = mysql_query( $sql, $conn );\n\n  \
    \ if(! $retval ) {\n      die('Could not take data backup: '. mysql_error());\n\
    \   }\n}\n```"
  merge: -1
  img_proc: true
