  md: "# # Destroying a PHP Session\n\nA PHP session can be destroyed by session_destroy()\
    \ function. This function does not need any argument and a single call can destroy\
    \ all the session variables. If you want to destroy a single session variable,\
    \ then you can use unset() function to unset a session variable.\n\nHere is the\
    \ example to unset a single variable:\n\n```\n<?php\n   unset($_SESSION['counter']);\n\
    ?>\n```\n\nHere is the call which will destroy all the session variables:\n\n\
    ```\n<?php\n   session_destroy();\n?>\n```\n\n# # Turning on Auto Session\n\n\
    You don't need to call start_session() function to start a session when a user\
    \ visits your site if you can set session.auto_start variable to 1 in php.ini\
    \ file.\n\n# # Sessions without cookies\n\nThere may be a case when a user does\
    \ not allow to store cookies on their machine. So there is another method to send\
    \ session ID to the browser.\n\nAlternatively, you can use the constant SID which\
    \ is defined if the session started. If the client did not send an appropriate\
    \ session cookie, it has the form session_name=session_id. Otherwise, it expands\
    \ to an empty string. Thus, you can embed it unconditionally into URLs.\n\nThe\
    \ following example demonstrates how to register a variable, and how to link correctly\
    \ to another page using SID.\n\n```\n<?php\n   session_start();\n\n   if (isset($_SESSION['counter']))\
    \ {\n       $_SESSION['counter'] = 1;\n   } else {\n       $_SESSION['counter']++;\n\
    \   }\n?>\n\n$msg = \"You have visited this page \". $_SESSION['counter'];\n```"
