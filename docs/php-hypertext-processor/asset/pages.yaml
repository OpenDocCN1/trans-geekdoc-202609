    # # Creating an upload script


    There is one global PHP variable called $_FILES. This variable is an associate
    double dimension array and keeps all the information related to uploaded file.
    So if the value assigned to the input''s name attribute in uploading form was
    **file**, then PHP would create the following five variables:


    +   - $_FILES[''file''][''tmp_name'']- the uploaded file in the temporary directory
    on the web server.

    +   - $_FILES[''file''][''name''] - the actual name of the uploaded file.

    +   - $_FILES[''file''][''size''] - the size in bytes of the uploaded file.

    +   - $_FILES[''file''][''type''] - the MIME type of the uploaded file.

    +   - $_FILES[''file''][''error''] - the error code associated with this file
    upload.'
