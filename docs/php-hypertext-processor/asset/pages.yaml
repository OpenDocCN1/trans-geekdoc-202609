    \ Chemistry\nAlgebra\n10\n15\n7\n```\n\n# Constructor Functions\n\nConstructor\
    \ Functions are special type of functions which are called automatically whenever\
    \ an object is created. So we take full advantage of this behavior, by initializing\
    \ many things through constructor functions.\n\nPHP provides a special function\
    \ called __construct() to define a constructor. You can pass as many as arguments\
    \ you like into the constructor function.\n\nFollowing example will create one\
    \ constructor for Books class and it will initialize price and title for the book\
    \ at the time of object creation.\n\n```\nfunction __construct( $par1, $par2 ){\n\
    \   $this->price = $par1;\n   $this->title = $par2;\n}\n```\n\nNow we don't need\
    \ to call set function separately to set price and title. We can initialize these\
    \ two member variables at the time of object creation only. Check following example\
    \ below:\n\n```\n$physics = new Books( \"Physics for High School\", 10 );\n$maths\
    \ = new Books ( \"Advanced Chemistry\", 15 );\n$chemistry = new Books (\"Algebra\"\
    , 7 );\n\n/* Get those set values */\n$physics->getTitle();\n$chemistry->getTitle();\n\
    ```"
