  md: "# PHP Function Parameters\n\nPHP Functions are covered in detail in PHP Function\
    \ Chapter. In short, a function is a small unit of program which can take some\
    \ input in the form of parameters and does some processing and may return a value.\n\
    \nFunction parameters are declared after the function name and inside parentheses.\
    \ They are declared much like a typical variable would be:\n\n```\n<?\n// multiply\
    \ a value by 10 and return it to the caller\nfunction multiply ($value) {\n  \
    \  $value = $value * 10;\n    return $value;\n}\n\n$retval = multiply (10);\n\
    Print \"Return value is $retval\\n\";\n?>\n```\n\nThis will produce the following\
    \ result.\n\n```\nReturn value is 100\n```\n\n# PHP Global Variables\n\nIn contrast\
    \ to local variables, a global variable can be accessed in any part of the program.\
    \ However, in order to be modified, a global variable must be explicitly declared\
    \ to be global in the function in which it is to be modified. This is accomplished,\
    \ conveniently enough, by placing the keyword **GLOBAL** in front of the variable\
    \ that should be recognized as global. Placing this keyword in front of an already\
    \ existing variable tells PHP to use the variable having that name. Consider an\
    \ example:\n\n```\n<?\n$somevar = 15;\nfunction addit()\n{\nGLOBAL $somevar;\n\
    $somevar++;\nprint \"Somevar is $somevar\";\n}\naddit();\n?>\n```"
