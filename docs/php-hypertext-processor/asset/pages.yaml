  md: "Let us discuss a few concepts being used in PERL regular expressions. After\
    \ that, we will\nintroduce you with regular expression related functions.\n\n\
    # Metacharacters\n\nA metacharacter is simply an alphabetical character preceded\
    \ by a backslash that acts to\ngive the combination a special meaning.\n\nFor\
    \ instance, you can search for large money sums using the '\\d'\nmetacharacter:/([\\\
    d+])000/, Here \\d will search for any string of numerical character.\n\nFollowing\
    \ is the list of metacharacters which can be used in PERL Style Regular\nExpressions.\n\
    \nCharacter\tDescription\n. a single character\n\\s a whitespace character (space,\
    \ tab, newline)\n\\S non-whitespace character\n\\d a digit (0-9)\n\\D a non-digit\n\
    \\w a word character (a-z, A-Z, 0-9, _)\n\\W a non-word character\n[aeiou] matches\
    \ a single character in the given set\n[^aeiou] matches a single character outside\
    \ the given set\n(foo|bar|baz) matches any of the alternatives specified\n\n#\
    \ Modifiers\n\nSeveral modifiers are available that can make your work with regexps\
    \ much easier, like\ncase sensitivity, searching in multiple lines etc.\n\nModifier\
    \ Description\ni Makes the match case insensitive\nm Specifies that if the string\
    \ has newline or carriage\nreturn characters, the ^ and $ operators will now\n\
    match against a newline boundary, instead of a\nstring boundary\no Evaluates the\
    \ expression only once\ns Allows use of . to match a newline character\nx Allows\
    \ you to use white space in the expression for clarity\ng Globally finds all matches\n\
    cg Allows a search to continue even after a global match fails"
