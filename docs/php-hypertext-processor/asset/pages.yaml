  md: '# # 16. PHP – Cookies


    Cookies are text files stored on the client computer and they are kept of use
    tracking purpose. PHP transparently supports HTTP cookies.


    There are three steps involved in identifying returning users:


    +   - Server script sends a set of cookies to the browser. For example, name,
    age, or identification number etc.

    +   - Browser stores this information on local machine for future use.

    +   - Next time, when the browser sends any request to the web server, it sends
    those cookies information to the server and server uses that information to identify
    the user.


    This chapter will teach you how to set cookies, how to access them and how to
    delete them.


    # ## The Anatomy of a Cookie


    Cookies are usually set in an HTTP header (although JavaScript can also set a
    cookie directly on a browser). A PHP script that sets a cookie might send headers
    that look something like this:


    ```

    HTTP/1.1 200 OK

    Date: Fri, 04 Feb 2000 21:03:38 GMT

    Server: Apache/1.3.9 (UNIX) PHP/4.0b3

    Set-Cookie: name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT;

    path=/; domain=tutorialspoint.com

    Connection: close

    Content-Type: text/html

    ```


    As you can see, the Set-Cookie header contains a name value pair, a GMT date,
    a path and a domain. The name and value will be URL encoded. The expires field
    is a instruction to the browser to "forget" the cookie after the given time and
    date.


    If the browser is configured to store cookies, it will then keep this information
    until the expiry date. If the user points the browser at any page that matches
    the path and domain of the cookie, it will resend the cookie to the server. The
    browser''s headers might look something like this:


    ```

    GET / HTTP/1.0

    Connection: Keep-Alive

    User-Agent: Mozilla/4.6 (X11; I; Linux 2.2.6-15apmac ppc)

    Host: zink.demon.co.uk:1126

    ```'
  merge: -1
  img_proc: true
- pgno: 88
  md: "```\nAccept: image/gif, */*\nAccept-Encoding: gzip\nAccept-Language: en\nAccept-Charset:\
    \ iso-8859-1,*,utf-8\nCookie: name=xyz\n```\n\nA PHP script will then have access\
    \ to the cookie in the environmental variables $_COOKIE or $HTTP_COOKIE_VARS[]\
    \ which holds all cookie names and values. Above cookie can be accessed using\
    \ $HTTP_COOKIE_VARS[\"name\"].\n\n# Setting Cookies with PHP\n\nPHP provided **setcookie()**\
    \ function to set a cookie. This function requires up to six arguments and should\
    \ be called before <html> tag. For each cookie this function has to be called\
    \ separately.\n\n```\nsetcookie(name, value, expire, path, domain, security);\n\
    ```\n\nHere is the detail of all the arguments:\n\n+   * **Name** - This sets\
    \ the name of the cookie and is stored in an environment variable called HTTP_COOKIE_VARS.\
    \ This variable is used while accessing cookies.\n+   * **Value** -This sets the\
    \ value of the named variable and is the content that you actually want to store.\n\
    +   * **Expiry** - This specify a future time in seconds since 00:00:00 GMT on\
    \ 1st Jan 1970. After this time cookie will become inaccessible. If this parameter\
    \ is not set, then cookie will automatically expire when the Web Browser is closed.\n\
    +   * **Path** -This specifies the directories for which the cookie is valid.\
    \ A single forward slash character permits the cookie to be valid for all directories.\n\
    +   * **Domain** - This can be used to specify the domain name in very large domains\
    \ and must contain at least two periods to be valid. All cookies are only valid\
    \ for the host and domain which created them.\n+   * **Security** - This can be\
    \ set to 1 to specify that the cookie should only be sent by secure transmission\
    \ using HTTPS otherwise set to 0 which mean cookie can be sent by regular HTTP.\n\
    \nThe following example will create two cookies **name** and **age**. These cookies\
    \ will expire after an hour.\n\n```\n<?php\n   setcookie(\"name\", \"John Watkin\"\
    , time()+3600, \"/\",\"\", 0);\n   setcookie(\"age\", \"36\", time()+3600, \"\
    /\", \"\", 0);\n?>\n<html>\n<head>\n```"
  merge: -1
  img_proc: true
