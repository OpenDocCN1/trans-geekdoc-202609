  md: "# Using the strpos() function\n\nThe strpos() function is used to search for\
    \ a string or character within a string.\n\nIf a match is found in the string,\
    \ this function will return the position of the first match. If no match is found,\
    \ it will return FALSE.\n\nLet's see if we can find the string \"world\" in our\
    \ string:\n\n```\n<?php\n   echo strpos(\"Hello world!\",\"world\");\n ?>\n```\n\
    \nThis will produce the following result:\n\n| 6 |\n|---|\n\nAs you can see, the\
    \ position of the string \"world\" in our string is position 6. The reason that\
    \ it is 6, and not 7, is that the first position in the string is 0, and not 1."
