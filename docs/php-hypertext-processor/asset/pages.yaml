- pgno: 54
  md: "# The foreach loop statement\n\nThe foreach statement is used to loop through\
    \ arrays. For each pass the value of the current array element is assigned to\
    \ $value and the array pointer is moved by one and in the next pass next element\
    \ will be processed.\n\n# Syntax\n\n```\nforeach (array as value)\n{\n   code\
    \ to be executed;\n}\n```\n\n# Example\n\nTry out the following example to list\
    \ out the values of an array.\n\n```\n<html>\n<body>\n  <?php\n   $array = array(\
    \ 1, 2, 3, 4, 5);\n   foreach( $array as $value )\n   {\n      echo \"Value is\
    \ $value <br />\";\n   }\n  ?>\n</body>\n</html>\n```\n\nThis will produce the\
    \ following result:\n\n```\nValue is 1\nValue is 2\nValue is 3\nValue is 4\nValue\
    \ is 5\n```\n\n# The break statement\n\nThe PHP break keyword is used to terminate\
    \ the execution of a loop prematurely.\n\nThe break statement is situated inside\
    \ the statement block. If gives you full control and whenever you want to exit\
    \ from the loop you can come out. After coming out of a loop immediate statement\
    \ to the loop will be executed."
