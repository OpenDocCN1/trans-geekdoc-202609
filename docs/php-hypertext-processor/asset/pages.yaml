  md: '# 25. PHP – Date and Time


    Dates are so much part of everyday life that it becomes easy to work with them
    without thinking. PHP also provides powerful tools for date arithmetic that make
    manipulating dates easy.


    # Getting the Time Stamp with time()


    PHP''s time() function gives you all the information that you need about the current
    date and time. It requires no arguments but returns an integer.


    The integer returned by time() represents the number of seconds elapsed since
    midnight GMT on January 1, 1970. This moment is known as the UNIX epoch, and the
    number of seconds that have elapsed since then is referred to as a time stamp.


    ```

    <?php

    print time();

    ?>

    ```


    It will produce the following result:


    ![](img/b9c80e155ac304a53696823920b08082_137_0.png)


    This is something difficult to understand. But PHP offers excellent tools to convert
    a time stamp into a form that humans are comfortable with.


    # Converting a Time Stamp with getdate()


    The function getdate() optionally accepts a timestamp and returns an associative
    array containing information about the date. If you omit the time stamp, it works
    with the current time stamp as returned by time().'
  merge: -1
  img_proc: true
