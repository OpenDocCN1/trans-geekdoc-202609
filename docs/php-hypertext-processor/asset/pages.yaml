- pgno: 16
  md: '# # Apache Configuration for PHP


    Apache uses httpd.conf file for global settings, and the .htaccess file for per-directory
    access settings. Older versions of Apache split up httpd.conf into three files
    (access.conf, httpd.conf, and srm.conf), and some users still prefer this arrangement.


    Apache server has a very powerful, but slightly complex, configuration system
    of its own. Learn more about it at the Apache Web site: www.apache.org


    The following section describes settings in httpd.conf that affect PHP directly
    and cannot be set elsewhere. If you have standard installation, then httpd.conf
    will be found at /etc/httpd/conf:


    # ## Timeout


    This value sets the default number of seconds before any HTTP request will time
    out. If you set PHP''s max_execution_time to longer than this value, PHP will
    keep grinding away but the user may see a 404 error. In safe mode, this value
    will be ignored; you must use the timeout value in php.ini instead


    # ## DocumentRoot


    DocumentRoot designates the root directory for all HTTP processes on that server.
    It looks something like this on Unix:


    ```

    DocumentRoot ./usr/local/apache_1.3.6/htdocs.

    ```


    You can choose any directory as document root.


    # ## AddType


    The PHP MIME type needs to be set here for PHP files to be parsed. Remember that
    you can associate any file extension with PHP like .php3, .php5 or .htm.


    ```

    AddType application/x-httpd-php .php

    AddType application/x-httpd-php5 .phps

    AddType application/x-httpd-php3 .php3 .phtml

    AddType application/x-httpd-php .html

    ```


    # ## Action


    You must uncomment this line for the Windows apxs module version of Apache with
    shared object support:


    ```

    LoadModule php4_module modules/php4apache.dll

    ```


    or on Unix flavors:


    ```

    LoadModule php4_module modules/mod_php.so

    ```'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# AddModule


    You must uncomment this line for the static module version of Apache.


    ```

    AddModule mod_php4.c

    ```


    # PHP.INI file Configuration


    The PHP configuration file, php.ini, is the final and most immediate way to affect
    PHP''s functionality. The php.ini file is read each time PHP is initialized.in
    other words, whenever httpd is restarted for the module version or with each script
    execution for the CGI version. If your change isn''t showing up, remember to stop
    and restart httpd. If it still isn''t showing up, use phpinfo() to check the path
    to php.ini.


    The configuration file is well commented and thorough. Keys are case sensitive,
    keyword values are not; whitespace, and lines beginning with semicolons are ignored.
    Booleans can be represented by 1/0, Yes/No, On/Off, or True/False. The default
    values in php.ini-dist will result in a reasonable PHP installation that can be
    tweaked later.


    Here we are explaining the important settings in php.ini which you may need for
    your PHP Parser.


    # short_open_tag = Off


    Short open tags look like this: <?= ?>. This option must be set to Off if you
    want to use XML functions.


    # safe_mode = Off


    If this is set to On, you probably compiled PHP with the --enable-safe-mode flag.
    Safe mode is most relevant to CGI use. See the explanation in the section "CGI
    compile-time options". earlier in this chapter.


    # safe_mode_exec_dir = [DIR]


    This option is relevant only if safe mode is on; it can also be set with the --with-exec-dir
    flag during the Unix build process. PHP in safe mode only executes external binaries
    out of this directory. The default is /usr/local/bin. This has nothing to do with
    serving up a normal PHP/HTML Web page.


    # safe_mode_allowed_env_vars = [PHP_]


    This option sets which environment variables users can change in safe mode. The
    default is only those variables prepended with "PHP_". If this directive is empty,
    most variables are alterable.


    # safe_mode_protected_env_vars = [LD_LIBRARY_PATH]


    This option sets which environment variables users can''t change in safe mode,
    even if safe_mode_allowed_env_vars is set permissively.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# disable_functions = [function1, function2...]


    A welcome addition to PHP4 configuration and one perpetuated in PHP5 is the ability
    to disable selected functions for security reasons. Previously, this necessitated
    hand-editing the C code from which PHP was made. Filesystem, system, and network
    functions should probably be the first to go because allowing the capability to
    write files and alter the system over HTTP is never such a safe idea.


    # max_execution_time = 30


    The function set_time_limit() won.t work in safe mode, so this is the main way
    to make a script time out in safe mode. In Windows, you have to abort based on
    maximum memory consumed rather than time. You can also use the Apache timeout
    setting to timeout if you use Apache, but that will apply to non-PHP files on
    the site too.


    # error_reporting = E_ALL & ~E_NOTICE


    The default value is E_ALL & ~E_NOTICE, all errors except notices. Development
    servers should be set to at least the default; only production servers should
    even consider a lesser value


    # error_prepend_string = [""]


    With its bookend, error_append_string, this setting allows you to make error messages
    a different color than other text, or what  you have.


    # warn_plus_overloading = Off


    This setting issues a warning if the + operator is used with strings, as in a
    form value.


    # variables_order = EGPCS


    This configuration setting supersedes gpc_order. Both are now deprecated along
    with register_globals. It sets the order of the different variables: Environment,
    GET, POST, COOKIE, and SERVER (aka Built-in).


    You can change this order around. Variables will be overwritten successively in
    left-to-right order, with the rightmost one winning the hand every time. This
    means if you left the default setting and happened to use the same name for an
    environment variable, a POST variable, and a COOKIE variable, the COOKIE variable
    would own that name at the end of the process. In real life, this doesn''t happen
    much.


    # register_globals = Off


    This setting allows you to decide whether you wish to register EGPCS variables
    as global. This is now deprecated, and as of PHP4.2, this flag is set to Off by
    default. Use superglobal arrays instead. All the major code listings in this book
    use superglobal arrays.


    # gpc_order = GPC


    This setting has been GPC Deprecated.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# magic_quotes_gpc = On


    This setting escapes quotes in incoming GET/POST/COOKIE data. If you use a lot
    of forms which possibly submit to themselves or other forms and display form values,
    you may need to set this directive to On or prepare to use addslashes() on string-type
    data.


    # magic_quotes_runtime = Off


    This setting escapes quotes in incoming database and text strings. Remember that
    SQL adds slashes to single quotes and apostrophes when storing strings and does
    not strip them off when returning them. If this setting is Off, you will need
    to use stripslashes() when outputting any type of string data from a SQL database.
    If magic_quotes_sybase is set to On, this must be Off.


    # magic_quotes_sybase = Off


    This setting escapes single quotes in incoming database and text strings with
    Sybase-style single quotes rather than backslashes. If magic_quotes_runtime is
    set to On, this must be Off.


    # auto-prepend-file = [path/to/file]


    If a path is specified here, PHP must automatically include() it at the beginning
    of every PHP file. Include path restrictions do apply.


    # auto-append-file = [path/to/file]


    If a path is specified here, PHP must automatically include() it at the end of
    every PHP file.unless you escape by using the exit() function. Include path restrictions
    do apply.


    # include_path = [DIR]


    If you set this value, you will only be allowed to include or require files from
    these directories. The include directory is generally under your document root;
    this is mandatory if you.re running in safe mode. Set this to . in order to include
    files from the same directory your script is in. Multiple directories are separated
    by colons: .:/usr/local/apache/htdocs:/usr/local/lib.


    # doc_root = [DIR]


    If you.re using Apache, you.ve already set a document root for this server or
    virtual host in httpd.conf. Set this value here if you.re using safe mode or if
    you want to enable PHP only on a portion of your site (for example, only in one
    subdirectory of your Web root).


    # file_uploads = [on/off]


    Turn on this flag if you will upload files using PHP script.


    # upload_tmp_dir = [DIR]


    Do not uncomment this line unless you understand the implications of HTTP uploads!


    # session.save-handler = files


    Except in rare circumstances, you will not want to change this setting. So don''t
    touch it.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# ignore_user_abort = [On/Off]


    This setting controls what happens if a site visitor clicks the browser.s Stop
    button. The default is On, which means that the script continues to run to completion
    or timeout. If the setting is changed to Off, the script will abort. This setting
    only works in module mode, not CGI.


    # mysqli.default_host = hostname


    The default server host to use when connecting to the database server if no other
    host is specified.


    # mysqli.default_user = username


    The default user name to use when connecting to the database server if no other
    name is specified.


    # mysqli.default_password = password


    The default password to use when connecting to the database server if no other
    password is specified.'
  merge: -1
