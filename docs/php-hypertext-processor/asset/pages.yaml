  md: "# 8. PHP – Loop Types\n\nLoops in PHP are used to execute the same block of\
    \ code a specified number of times. PHP supports following four loop types.\n\n\
    +   * **for** - loops through a block of code a specified number of times.\n+\
    \   * **while** - loops through a block of code if and as long as a specified\
    \ condition is true.\n+   * **do...while** - loops through a block of code once,\
    \ and then repeats the loop as long as a special condition is true.\n+   * **foreach**\
    \ - loops through a block of code for each element in an array.\n\nWe will discuss\
    \ about **continue** and **break** keywords used to control the loops execution.\n\
    \n# The for loop statement\n\nThe for statement is used when you know how many\
    \ times you want to execute a statement or a block of statements.\n\n# Syntax\n\
    \n```\nfor (initialization; condition; increment)\n{\n   code to be executed;\n\
    }\n```\n\nThe initializer is used to set the start value for the counter of the\
    \ number of loop iterations.\nA variable may be declared here for this purpose\
    \ and it is traditional to name it $i.\n\n# Example\n\nThe following example makes\
    \ five iterations and changes the assigned value of two\nvariables on each pass\
    \ of the loop:\n\n```\n<html>\n<body>\n<?php\n$a = 0;\n$b = 0;\n\nfor( $i=0; $i<5;\
    \ $i++ )\n{\n   $a += 10;\n```"
  merge: -1
  img_proc: true
- pgno: 52
  md: "```\n$b += 5;\n}\necho (\"At the end of the loop a=$a and b=$b\" );\n?>\n</body>\n\
    </html>\n```\n\nThis will produce the following result:\n\n```\nAt the end of\
    \ the loop a=50 and b=25\n```\n\n# The while loop statement\n\nThe while statement\
    \ will execute a block of code if and as long as a test expression is true.\n\
    If the test expression is true, then the code block will be executed. After the\
    \ code has\nexecuted the test expression will again be evaluated and the loop\
    \ will continue until the\ntest expression is found to be false.\n\n# Syntax\n\
    \n```\nwhile (condition)\n{\n   code to be executed;\n}\n```\n\n# Example\n\n\
    This example decrements a variable value on each iteration of the loop and the\
    \ counter\nincrements until it reaches 10 when the evaluation becomes false and\
    \ the loop ends.\n\n```\n<html>\n<body>\n<?php\n$i = 0;\n$num = 50;\nwhile( $i\
    \ < 10)\n{\n   $num--;\n   $i++;\n}\necho (\"Loop stopped at i = $i and num =\
    \ $num\" );\n```"
