    All the above error level can be set using the following PHP built-in library
    function where level cab be any of the value defined in above table.


    ```

    int error_reporting ( [int $level] )

    ```


    Here is how you can create an error handling function:


    ```

    <?php

    function handleError($errno, $errstr,$error_file,$error_line)

    {

    echo "<b>Error:</b> [$errno] $errstr - $error_file:$error_line";

    echo "<br />";

    echo "Terminating PHP Script";

    die();

    }

    ?>

    ```


    Once you define your custom error handler, you need to set it using PHP built-in
    library **set_error_handler** function. Now let''s examine our example by calling
    a function which does not exist.


    ```

    <?php

    error_reporting( E_ERROR );

    function handleError($errno, $errstr,$error_file,$error_line)

    {

    echo "<b>Error:</b> [$errno] $errstr - $error_file:$error_line";

    echo "<br />";

    echo "Terminating PHP Script";

    die();

    }

    //set error handler

    set_error_handler("handleError");

    //trigger error

    ```'
