  md: "# What is AJAX ?\n\n+   - AJAX stands for **Asynchronous JavaScript** and **XML**.\
    \ AJAX is a new technique for creating better, faster, and more interactive web\
    \ applications with the help of XML, HTML, CSS and Java Script.\n+   - Conventional\
    \ web application transmit information to and from the sever using synchronous\
    \ requests. This means you fill out a form, hit submit, and get directed to a\
    \ new page with new information from the server.\n+   - With AJAX when submit\
    \ is pressed, JavaScript will make a request to the server, interpret the results\
    \ and update the current screen. In the purest sense, the user would never know\
    \ that anything was even transmitted to the server.\n+   For complete learning\
    \ on AJAX, please refer our AJAX Tutorial.\n\n# PHP and AJAX Example\n\nTo clearly\
    \ illustrate how easy it is to access information from a database using Ajax and\
    \ PHP, we are going to build MySQL queries on the fly and display the results\
    \ on \"ajax.html\". But before we proceed, let's do a bit of ground work first.\
    \ Create a table using the following command. **NOTE:** We are assuming you have\
    \ sufficient privilege to perform following MySQL operations\n\n```\nCREATE TABLE\
    \ `ajax_example` (\n `name` varchar(50) NOT NULL,\n `age` int(11) NOT NULL,\n\
    \ `sex` varchar(1) NOT NULL,\n `wpm` int(11) NOT NULL,\n PRIMARY KEY (`name`)\n\
    )\n```\n\nNow dump the following data into this table using the following SQL\
    \ statements:\n\n```\nINSERT INTO `ajax_example` VALUES ('Jerry', 120, 'm', 20);\n\
    INSERT INTO `ajax_example` VALUES ('Regis', 75, 'm', 44);\nINSERT INTO `ajax_example`\
