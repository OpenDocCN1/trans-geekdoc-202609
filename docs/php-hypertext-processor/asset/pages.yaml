- pgno: 76
  md: '# # 13. Php – File Inclusion


    You can include the content of a PHP file into another PHP file before the server
    executes it. There are two PHP functions which can be used to included one PHP
    file into another PHP file.


    +   - The include() Function

    +   - The require() Function


    This is a strong point of PHP which helps in creating functions, headers, footers,
    or elements that can be reused on multiple pages. This will help developers to
    make it easy to change the layout of complete website with minimal effort. If
    there is any change required, then instead of changing thousands of files just
    change included file.


    # ## The include() Function


    The include() function takes all the text in a specified file and copies it into
    the file that uses the include function. If there is any problem in loading a
    file, then the include() function generates a warning but the script will continue
    execution.


    Assume you want to create a common menu for your website. Then create a file menu.php
    with the following content.


    ```

    <a href="http://www.tutorialspoint.com/index.htm">Home</a> -<a href="http://www.tutorialspoint.com/ebxml">ebXML</a>
    -<a href="http://www.tutorialspoint.com/ajax">AJAX</a> -<a href="http://www.tutorialspoint.com/perl">PERL</a>
    <br />

    ```


    Now create as many pages as you like and include this file to create header. For
    example now your test.php file can have the following content.


    ```

    <html>

    <body>

    <?php include("menu.php"); ?>

    <p>This is an example to show how to include PHP file!</p>

    </body>

    </html>

    ```


    This will produce the following result:


    ```

    Home -ebXML -AJAX -PERL


    This is an example to show how to include PHP file.

    ```'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# The require() Function


    The require() function takes all the text in a specified file and copies it into
    the file that uses the include function. If there is any problem in loading a
    file, then the **require()** function generates a fatal error and halt the execution
    of the script.


    So there is no difference in require() and include() except they handle error
    conditions. It is recommended to use the require() function instead of include(),
    because scripts should not continue executing if files are missing or misnamed.


    You can try using above example with require() function and it will generate same
    result. But if you will try the following two examples where file does not exist,
    then you will get different results.


    ```

    ```html

    <html>

    <body>

    <?php include("xxmenu.php"); ?>

    <p>This is an example to show how to include wrong PHP file!</p>

    </body>

    </html>

    ```

    ```


    This will produce the following result:


    This is an example to show how to include wrong PHP file!


    Now let us try same example with require() function.


    ```

    ```html

    <html>

    <body>

    <?php require("xxmenu.php"); ?>

    <p>This is an example to show how to include wrong PHP file!</p>

    </body>

    </html>

    ```

    ```


    This time file execution halts and nothing is displayed.


    **NOTE:** You may get plain warning messages or fatal error messages or nothing
    at all. This depends on your PHP Server configuration.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'This chapter will explain the following functions related to files:


    +   - Opening a file

    +   - Reading a file

    +   - Writing a file

    +   - Closing a file


    # Opening and Closing Files


    The PHP fopen() function is used to open a file. It requires two arguments stating
    first the file name and then mode in which to operate.


    Files modes can be specified as one of the six options in this table.


    | Mode | Purpose |

    | :--- | :--- |

    | r | Opens the file for reading only.

    Places the file pointer at the beginning of the file. |

    | r+ | Opens the file for reading and writing.

    Places the file pointer at the beginning of the file. |

    | w | Opens the file for writing only.

    Places the file pointer at the beginning of the file.

    and truncates the file to zero length. If the file does not exist, then it attempts
    to create a file. |

    | w+ | Opens the file for reading and writing only.

    Places the file pointer at the beginning of the file.

    and truncates the file to zero length. If the file does not exist, then it attempts
    to create a file. |

    | a | Opens the file for writing only.

    Places the file pointer at the end of the file.

    If the file does not exist, then it attempts to create a file. |

    | a+ | Opens the file for reading and writing only.

    Places the file pointer at the end of the file.

    If the file does not exist, then it attempts to create a file. |


    If an attempt to open a file fails, then fopen returns a value of false otherwise
    it returns a file pointer which is used for further reading or writing to that
    file.'
  merge: -1
  img_proc: true
- pgno: 79
  md: "After making a changes to the opened file it is important to close it with\
    \ the fclose()function. The fclose() function requires a file pointer as its argument\
    \ and then returns **true** when the closure succeeds or **false** if it fails.\n\
    \n# Reading a file\n\nOnce a file is opened using **fopen()** function it can\
    \ be read with a function called **fread()**. This function requires two arguments.\
    \ These must be the file pointer and the length of the file expressed in bytes.\n\
    \nThe file's length can be found using the **filesize()** function which takes\
    \ the file name as its argument and returns the size of the file expressed in\
    \ bytes.\n\nSo here are the steps required to read a file with PHP.\n\n+   - Open\
    \ a file using **fopen()** function.\n+   - Get the file's length using **filesize()**\
    \ function.\n+   - Read the file's content using **fread()** function.\n+   -\
    \ Close the file with **fclose()** function.\n\nThe following example assigns\
    \ the content of a text file to a variable and then displays those contents on\
    \ the web page.\n\n```\n<html>\n<head>\n<title>Reading a file using PHP</title>\n\
    </head>\n<body>\n\n<?php\n$filename = \"/home/user/guest/tmp.txt\";\n$file = fopen(\
    \ $filename, \"r\" );\nif( $file == false )\n{\n   echo ( \"Error in opening file\"\
    \ );\n   exit();\n}\n\n$filesize = filesize( $filename );\n$filetext = fread(\
    \ $file, $filesize );\n\nfclose( $file );\n\necho ( \"File size : $filesize bytes\"\
    \ );\n\n```"
