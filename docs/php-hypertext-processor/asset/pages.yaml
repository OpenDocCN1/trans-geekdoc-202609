- pgno: 119
  md: '# PHP — Function split()


    # Syntax


    ```

    array split (string pattern, string string [, int limit])

    ```


    # Definition and Usage


    The split() function will divide a string into various elements, the boundaries
    of each element based on the occurrence of pattern in string.


    The optional input parameter limit is used to signify the number of elements into
    which the string should be divided, starting from the left end of the string and
    working rightward. In cases where the pattern is an alphabetical character, split()
    is case sensitive.


    # Return Value


    +   * Returns an array of strings after splitting up a string.


    # Example


    Following is the piece of code, copy and paste this code into a file and verify
    the result.


    ```

    <?php

    $ip = "123.456.789.000"; // some IP address

    $iparr = split ("\.", $ip);

    print "$iparr[0] <br />";

    print "$iparr[1] <br /> " ;

    print "$iparr[2] <br /> " ;

    print "$iparr[3] <br /> " ;

    ?>

    ```


    This will produce the following result –


    ```

    123

    456

    789

    000

    ```'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# PHP — Function spliti()


    # Syntax


    ```

    array spliti (string pattern, string string [, int limit])

    ```


    # Definition and Usage


    The spliti() function operates exactly in the same manner as its sibling split(),
    except that it is not case sensitive. Case-sensitive characters are an issue only
    when the pattern is alphabetical. For all other characters, spliti() operates
    exactly as split() does.


    # Return Value


    +   * Returns an array of strings after splitting up a string.


    # Example


    Following is the piece of code, copy and paste this code into a file and verify
    the result.


    ```

    <?php

