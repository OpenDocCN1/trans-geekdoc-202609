    \ a numeric index. Values are stored and accessed in linear fashion\n+   \n+ \
    \  - **Associative array** - An array with strings as index. This stores element\
    \ values in association with key values rather than in a strict linear index order.\n\
    +   \n+   - **Multidimensional array** - An array containing one or more arrays\
