  md: "# The continue statement\n\nThe PHP **continue** keyword is used to halt the\
    \ current iteration of a loop but it does not terminate the loop.\n\nJust like\
    \ the **break** statement the **continue** statement is situated inside the statement\
    \ block containing the code that the loop executes, preceded by a conditional\
    \ test. For the pass encountering **continue** statement, rest of the loop code\
    \ is skipped and next pass starts.\n\n![](img/b9c80e155ac304a53696823920b08082_56_0.png)\n\
    \n# Example\n\nIn the following example, the loop prints the value of array, but\
    \ when the condition becomes true, it just skips the code and next value is printed.\n\
    \n```\n<html>\n<body>\n<?php\n$array = array( 1, 2, 3, 4, 5);\nforeach( $array\
    \ as $value )\n{\n   if( $value == 3 )continue;\n   echo \"Value is $value <br\
    \ />\";\n}\n?>\n</body>\n</html>\n```\n\nThis will produce the following result:"
