- pgno: 135
  md: "# 24. PHP – Bugs Debugging\n\nPrograms rarely work correctly the first time.\
    \ Many things can go wrong in your program that cause the PHP interpreter to generate\
    \ an error message. You have a choice about where those error messages go. The\
    \ messages can be sent along with other program output to the web browser. They\
    \ can also be included in the web server error log.\n\nTo make error messages\
    \ display in the browser, set the **display_errors** configuration directive to\
    \ **On**. To send errors to the web server error log, set **log_errors** to On.\
    \ You can set them both to On if you want error messages in both places.\n\nPHP\
    \ defines some constants you can use to set the value of **error_reporting** such\
    \ that only errors of certain types get reported: E_ALL (for all errors except\
    \ strict notices), E_PARSE (parse errors), E_ERROR (fatal errors), E_WARNING (warnings),\
    \ E_NOTICE (notices), and E_STRICT (strict notices).\n\nWhile writing your PHP\
    \ program, it is a good idea to use PHP-aware editors like **BBEdit** or **Emacs**.\
    \ One of the special features of these editors is syntax highlighting. It changes\
    \ the color of different parts of your program based on what those parts are.\
    \ For example, strings are pink, keywords such as if and while are blue, comments\
    \ are grey, and variables are black.\n\nAnother feature is quote and bracket matching,\
    \ which helps to make sure that your quotes and brackets are balanced. When you\
    \ type a closing delimiter such as }, the editor highlights the opening { that\
    \ it matches.\n\nYou need to verify the following points while debugging your\
    \ program.\n\n+   - **Missing Semicolons** - Every PHP statement ends with a semicolon\
    \ (;). PHP doesn't stop reading a statement until it reaches a semicolon. If you\
    \ leave out the semicolon at the end of a line, PHP continues reading the statement\
    \ on the following line.\n+   \n+   - **Not Enough Equal Signs** - When you ask\
    \ whether two values are equal in a comparison statement, you need two equal signs\
    \ (==). Using one equal sign is a common mistake.\n+   \n+   - **Misspelled Variable\
    \ Names** - If you misspelled a variable, then PHP understands it as a new variable.\
    \ Remember: To PHP, $test is not the same variable as $Test.\n+   \n+   - **Missing\
    \ Dollar Signs** - A missing dollar sign in a variable name is really hard to\
    \ see, but at least it usually results in an error message so that you know where\
    \ to look for the problem.\n+   \n+   - **Troubling Quotes** - You can have too\
    \ many, too few, or the wrong kind of quotes. So check for a balanced number of\
    \ quotes.\n+   \n+   - **Missing Parentheses and curly brackets** - They should\
    \ always be in pairs.\n+   \n+   - **Array Index** - All the arrays should start\
    \ from zero instead of 1."
  merge: -1
