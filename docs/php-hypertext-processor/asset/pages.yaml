  md: 'Every company follows a different coding standard based on their best practices.
    Coding standard is required because there may be many developers working on different
    modules. If they start inventing their own standards, then the source will become
    very un-manageable and it will become difficult to maintain that source code in
    future.


    Here are several reasons why to use coding specifications:


    +   Your peer programmers have to understand the code you produce. A coding standard
    acts as the blueprint for all the team to decipher the code.


    +   Simplicity and clarity achieved by consistent coding saves you from common
    mistakes.


    +   If you revise your code after some time, then it becomes easy to understand
    that code.


    There are a few guidelines which can be followed while coding in PHP.


    +   **Indenting and Line Length** - Use an indent of 4 spaces and don''t use any
    tab because different computers use different setting for tab. It is recommended
    to keep lines at approximately 75-85 characters long for better code readability.


    +   **Control Structures** - These include if, for, while, switch, etc. Control
    statements should have one space between the control keyword and opening parenthesis,
    to distinguish them from function calls. You are strongly encouraged to always
    use curly braces even in situations where they are technically optional.


    # Example


    ```

    if ((condition1) || (condition2)) {

    action1;

    } elseif ((condition3) && (condition4)) {

    action2;

    } else {

    default action;

    }

    ```


    You can write switch statements as follows:


    ```

    switch (condition) {

    case 1:

    action1;

    break;

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 105
  md: "```\ncase 2:\n    action2;\n    break;\n\ndefault:\n    defaultaction;\n  \
    \  break;\n}\n```\n\n**Function Calls** - Functions should be called with no spaces\
    \ between the function name, the opening parenthesis, and the first parameter;\
    \ spaces between commas and each parameter, and no space between the last parameter,\
    \ the closing parenthesis, and the semicolon. Here's an example:\n\n```\n$var\
    \ = foo($bar, $baz, $quux);\n```\n\n**Function Definitions** - Function declarations\
    \ follow the \"BSD/Allman style\":\n\n```\nfunction fooFunction($arg1, $arg2 =\
    \ '')\n{\n    if (condition) {\n        statement;\n    }\n    return $val;\n\
    }\n```\n\n**Comments** - C style comments (/* */) and standard C++ comments (//)\
    \ are both fine. Use of Perl/shell style comments (#) is discouraged.\n\n**PHP\
    \ Code Tags** - Always use <?php ?> to delimit PHP code, not the <? ?> shorthand.\
    \ This is required for PHP compliance and is also the most portable way to include\
    \ PHP code on differing operating systems and setups.\n\n# Variable Names -\n\n\
    +   * Use all lower case letters\n+   * Use '_' as the word separator.\n+   *\
    \ Global variables should be prepended with a 'g'.\n+   * Global constants should\
    \ be all caps with '_' separators.\n+   * Static variables may be prepended with\
    \ 's'.\n\n**Make Functions Reentrant** - Functions should not keep static variables\
    \ that prevent a function from being reentrant.\n\n**Alignment of Declaration\
    \ Blocks** - Block of declarations should be aligned."
