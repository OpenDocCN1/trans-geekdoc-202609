  md: "\n| Parameter | Description |\n|---|---|\n| error_level | Required - Specifies\
    \ the error report level for the user-defined error. Must be a value number. |\n\
    | error_message | Required - Specifies the error message for the user-defined\
    \ error |\n| error_file | Optional - Specifies the filename in which the error\
    \ occurred |\n| error_line | Optional - Specifies the line number in which the\
    \ error occurred |\n| error_context | Optional - Specifies an array containing\
    \ every variable and their values in use when the error occurred |\n\n## Possible\
    \ Error levels\n\nThese error report levels are the different types of error the\
    \ user-defined error handler can be used for. These values can be used in combination\
    \ using | operator\n\n| Value | Constant | Description |\n|---|---|---|\n| 1 |\
    \ E_ERROR | Fatal run-time errors. Execution of the script is halted |\n| 2 |\
    \ E_WARNING | Non-fatal run-time errors. Execution of the script is not halted\
    \ |\n| 4 | E_PARSE | Compile-time parse errors. Parse errors should only be generated\
    \ by the parser. |\n| 8 | E_NOTICE | Run-time notices. The script found something\
    \ that might be an error, but could also happen when running a script normally\
    \ |\n| 16 | E_CORE_ERROR | Fatal errors that occur during PHP's initial startup.\
    \ |\n| 32 | E_CORE_WARNING | Non-fatal run-time errors. This occurs during PHP's\
    \ initial startup. |\n| 256 | E_USER_ERROR | Fatal user-generated error. This\
    \ is like an E_ERROR set by the programmer using the PHP function trigger_error()\
    \ |\n| 512 | E_USER_WARNING | Non-fatal user-generated warning. This is like an\
    \ E_WARNING set by the programmer using the PHP function trigger_error() |\n|\
    \ 1024 | E_USER_NOTICE | User-generated notice. This is like an E_NOTICE set by\
    \ the programmer using the PHP function trigger_error() |\n| 2048 | E_STRICT |\
    \ Run-time notices. Enable to have PHP suggest changes to your code which will\
    \ ensure the best interoperability and forward compatibility of your code. |\n\
    | 4096 | E_RECOVERABLE_ERROR | Catchable fatal error. This is like an E_ERROR\
    \ but can be caught by a user defined handle (see also set_error_handler()) |\n\
    | 8191 | E_ALL | All errors and warnings, except level E_STRICT (E_STRICT will\
    \ be part of E_ALL as of PHP 6.0) |\n\nAll the above error level can be set using\
    \ the following PHP built-in library function where level can be any of the value\
    \ defined in above table.\n\n```\nint error_reporting ( [int $level] )\n```\n\n\
    Here is how you can create an error handling function:\n\n```\n<?php\nfunction\
    \ handleError($errno, $errstr,$error_file,$error_line)\n{\necho \"<b>Error:</b>\
    \ [$errno] $errstr - $error_file:$error_line\";\necho \"<br />\";\necho \"Terminating\
    \ PHP Script\";\ndie();\n}\n?>\n```\n\nOnce you define your custom error handler,\
    \ you need to set it using PHP built-in library **set_error_handler** function.\
    \ Now let's examine our example by calling a function which does not exist.\n\n\
    ```\n<?php\nerror_reporting( E_ERROR );\nfunction handleError($errno, $errstr,$error_file,$error_line)\n\
    {\necho \"<b>Error:</b> [$errno] $errstr - $error_file:$error_line\";\necho \"\
    <br />\";\necho \"Terminating PHP Script\";\ndie();\n}\n//set error handler\n\
    set_error_handler(\"handleError\");\n//trigger error\nmyFunction();\n?>\n```\n\
    \n## Exceptions Handling\n\nPHP 5 has an exception model similar to that of other\
    \ programming languages. Exceptions are important and provides a better control\
    \ over error handling.\n\nLet's now explain the new keyword related to exceptions.\n\
    \n- Try - A function using an exception should be in a \"try\" block. If the exception\
    \ does not trigger, the code will continue as normal. However if the exception\
    \ triggers, an exception is \"thrown\".\n- Throw - This is how you trigger an\
    \ exception. Each \"throw\" must have at least one \"catch\".\n- Catch - A \"\
    catch\" block retrieves an exception and creates an object containing the exception\
    \ information.\n\nWhen an exception is thrown, the code following the statement\
    \ will not be executed, and PHP will attempt to find the first matching catch\
    \ block. If an exception is not caught, a PHP Fatal Error will be issued with\
    \ an \"Uncaught Exception\".\n\n- An exception can be thrown, and caught (\"caught\"\
    ) within PHP. Code may be surrounded in a try block.\n- Each try must have at\
    \ least one corresponding catch block. Multiple catch blocks can be used to catch\
    \ different classes of exceptions.\n- Exceptions can be thrown (or re-thrown)\
    \ within a catch block.\n\n### Example\n\nCopy and paste the following piece of\
    \ code into a file and verify the result.\n\n```\n<?php\ntry {\n    $error = 'Always\
    \ throw this error';\n    throw new Exception($error);\n    // Code following\
    \ an exception is not executed.\n    echo 'Never executed';\n} catch (Exception\
    \ $e) {\n    echo 'Caught exception: ', $e->getMessage(), \"\\n\";\n}\n\n// Continue\
    \ execution\necho 'Hello World';\n?>\n```\n\nIn the above example, $e->getMessage\
    \ function is used to get error message. The following functions can be used from\
    \ **Exception** class.\n\n- **getMessage()** - message of exception\n- **getCode()**\
    \ - code of exception\n- **getFile()** - source filename\n- **getLine()** - source\
    \ line\n- **getTrace()** - an array of the backtrace()\n- **getTraceAsString()**\
    \ - formatted string of trace\n\n## Creating Custom Exception Handler\n\nYou can\
    \ define your own custom exception handler. Use the following function to set\
    \ a user-defined exception handler function.\n\n```\nstring set_exception_handler\
    \ ( callback $exception_handler )\n```\n\nHere **exception_handler** is the name\
    \ of the function to be called when an uncaught exception occurs. This function\
    \ must be defined before calling set_exception_handler().\n\n### Example\n\n```\n\
    <?php\nfunction exception_handler($exception) {\n   echo \"Uncaught exception:\
    \ \" , $exception->getMessage(), \"\\n\";\n}\n\nset_exception_handler('exception_handler');\n\
    \nthrow new Exception('Uncaught Exception');\n\necho \"Not Executed\\n\";\n?>\n\
    ```\n\nCheck the complete set of error handling functions at [PHP Error Handling\
    \ Functions].\n\n## 24. PHP – Bugs Debugging\n\nPrograms rarely work correctly\
    \ the first time. Many things can go wrong in your program that cause the PHP\
    \ interpreter to generate an error message. You have a choice about where those\
    \ error messages go. The messages can be sent along with other program output\
    \ to the web browser. They can also be included in the web server error log.\n\
    \nTo make error messages display in the browser, set the **display_errors** configuration\
    \ directive to **On**. To send errors to the web server error log, set **log_errors**\
    \ to On. You can set them both to On if you want error messages in both places.\n\
    \nPHP defines some constants you can use to set the value of **error_reporting**\
    \ such that only errors of certain types get reported: E_ALL (for all errors except\
    \ strict notices), E_PARSE (parse errors), E_ERROR (fatal errors), E_WARNING (warnings),\
    \ E_NOTICE (notices), and E_STRICT (strict notices).\n\nWhile writing your PHP\
    \ program, it is a good idea to use PHP-aware editors like **BBEdit** or **Emacs**.\
    \ One of the special features of these editors is syntax highlighting. It changes\
    \ the color of different parts of your program based on what those parts are.\
    \ For example, strings are pink, keywords such as if and while are blue, comments\
    \ are grey, and variables are black.\n\nAnother feature is quote and bracket matching,\
    \ which helps to make sure that your quotes and brackets are balanced. When you\
    \ type a closing delimiter such as }, the editor highlights the opening { that\
    \ it matches.\n\nYou need to verify the following points while debugging your\
    \ program.\n\n- **Missing Semicolons** - Every PHP statement ends with a semicolon\
    \ (;). PHP doesn't stop reading a statement until it reaches a semicolon. If you\
    \ leave out the semicolon at the end of a line, PHP continues reading the statement\
    \ on the following line.\n- **Not Enough Equal Signs** - When you ask whether\
    \ two values are equal in a comparison statement, you need two equal signs (==).\
    \ Using one equal sign is a common mistake.\n- **Misspelled Variable Names** -\
    \ If you misspelled a variable, then PHP understands it as a new variable. Remember:\
    \ To PHP, $test is not the same variable as $Test.\n- **Missing Dollar Signs**\
    \ - A missing dollar sign in a variable name is really hard to see, but at least\
    \ it usually results in an error message so that you know where to look for the\
    \ problem.\n- **Troubling Quotes** - You can have too many, too few, or the wrong\
    \ kind of quotes. So check for a balanced number of quotes.\n- **Missing Parentheses\
    \ and curly brackets** - They should always be in pairs.\n- **Array Index** -\
    \ All the arrays should start from zero instead of 1.\n"
  mdcn: "\n\n| 参数 | 描述 |\n|---|---|\n| error_level | 必需 - 指定用户定义错误的错误报告级别。必须是一个数值。\
