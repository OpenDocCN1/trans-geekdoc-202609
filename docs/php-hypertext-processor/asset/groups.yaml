    \n现在创建任意数量的页面，并包含此文件以创建标题。例如，您的 test.php 文件现在可以包含以下内容。\n\n```\n<html>\n<body>\n\
    <?php include(\"menu.php\"); ?>\n<p>This is an example to show how to include\
