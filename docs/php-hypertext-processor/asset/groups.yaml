    \ as one of the six options in this table.\n\n| Mode | Purpose |\n|------|---------|\n\
    | r | Opens the file for reading only. Places the file pointer at the beginning\
    \ of the file. |\n| r+ | Opens the file for reading and writing. Places the file\
    \ pointer at the beginning of the file. |\n| w | Opens the file for writing only.\
    \ Places the file pointer at the beginning of the file. and truncates the file\
