    Regular expressions are nothing more than a sequence or pattern of characters.
    They provide the foundation for pattern-matching functionality.


    Using regular expressions you can search a particular string inside another string,
    you can replace one string by another string and you can split a string into many
    chunks.


    PHP offers functions specific to two sets of regular expression functions, each
    corresponding to a certain type of regular expression. You can use any of them
    based on your comfort.


    - POSIX Regular Expressions

    - PERL Style Regular Expressions


    ## POSIX Regular Expressions


    The structure of a POSIX regular expression is not dissimilar to that of a typical
    arithmetic expression: various elements (operators) are combined to form more
    complex expressions.


    The simplest regular expression is one that matches a single character, such as
    g, inside strings such as g, haggle, or bag.


    Let us discuss a few concepts being used in POSIX regular expression. After that,
    we will introduce you to regular expression related functions.


    ### Brackets


    Brackets ([ ]) have a special meaning when used in the context of regular expressions.
    They are used to find a range of characters.


    | Expression | Description |

    | --- | --- |

    | [0-9] | It matches any decimal digit from 0 through 9. |

    | [a-z] | It matches any character from lowercase a through lowercase z. |

    | [A-Z] | It matches any character from uppercase A through uppercase Z. |

    | [a-Z] | It matches any character from lowercase a through uppercase Z. |


    The ranges shown above are general; you could also use the range [0-3] to match
    any decimal digit ranging from 0 through 3, or the range [b-v] to match any lowercase
    character ranging from b through v.


    ### Quantifiers


    The frequency or position of bracketed character sequences and single characters
    can be denoted by a special character. Each special character having a specific
    connotation. The +, *, ?, {int. range}, and $ flags all follow a character sequence.


    | Expression | Description |

    | --- | --- |

    | p+ | It matches any string containing at least one p. |

    | p* | It matches any string containing zero or more p''s. |

    | p? | It matches any string containing zero or more p''s. This is just an alternative
    way to use p*. |

    | p{N} | It matches any string containing a sequence of N p''s. |

    | p{2,3} | It matches any string containing a sequence of two or three p''s. |

    | p{2, } | It matches any string containing a sequence of at least two p''s. |

    | p$ | It matches any string with p at the end of it. |

    | ^p | It matches any string with p at the beginning of it. |


    ### Examples


    Following examples will clear your concepts about matching characters.


    | Expression | Description |

    | --- | --- |

    | [^a-zA-Z] | It matches any string not containing any of the characters ranging
    from a through z and A through Z. |

    | p.p | It matches any string containing p, followed by any character, in turn
    followed by another p. |

    | ^..{2}$ | It matches any string containing exactly two characters. |

    | <b>(.*)</b> | It matches any string enclosed within <b> and </b>. |

    | p(hp)* | It matches any string containing a p followed by zero or more instances
    of the sequence hp. |


    ### Predefined Character Ranges


    For your programming convenience several predefined character ranges, also known
    as character classes, are available. Character classes specify an entire range
    of characters, for example, the alphabet or an integer set:


    | Expression | Description |

    | --- | --- |

    | [[:alpha:]] | It matches any string containing alphabetic characters aA through
    zZ. |

    | [[:digit:]] | It matches any string containing numerical digits 0 through 9.
    |

    | [[:alnum:]] | It matches any string containing alphanumeric characters aA through
    zZ and 0 through 9. |

    | [[:space:]] | It matches any string containing a space. |


    ## PHP''s Regexp POSIX Functions


    PHP currently offers seven functions for searching strings using POSIX-style regular
    expressions:


    | Function | Description |

    | --- | --- |

    | ereg() | The ereg() function searches a string specified by string for a string
    specified by pattern, returning true if the pattern is found, and false otherwise.
    |

    | ereg_replace() | The ereg_replace() function searches for string specified by
    pattern and replaces pattern with replacement if found. |

    | eregi() | The eregi() function searches throughout a string specified by pattern
    for a string specified by string. The search is not case sensitive. |

    | eregi_replace() | The eregi_replace() function operates exactly like ereg_replace(),
    except that the search for pattern in string is not case sensitive. |

    | split() | The split() function will divide a string into various elements, the
    boundaries of each element based on the occurrence of pattern in string. |

    | spliti() | The spliti() function operates exactly in the same manner as its
    sibling split(), except that it is not case sensitive. |

    | sql_regcase() | The sql_regcase() function can be thought of as a utility function,
    converting each character in the input parameter string into a bracketed expression
    containing two characters. |


    ## PHP—Function ereg()


    ### Syntax


    ```

    int ereg(string pattern, string originalstring, [array regs]);

    ```


