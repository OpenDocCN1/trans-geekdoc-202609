    - 赋值运算符，将值赋给变量。\n\n### PHP 运算符优先级\n\n运算符优先级决定表达式中项的分组。这会影响表达式的求值方式。某些运算符的优先级高于其他运算符；例如，乘法运算符的优先级高于加法运算符：\n\
