    Following is the piece of code, copy and paste this code into a file and verify
    the result.


    ```

    <?php

    $password = "abc";

    if (! eregi ("[[ :alnum: ]]{8,10}", $password))

    {

    print "Invalid password! Passwords must be from 8 - 10 chars";

    }

    else

    {

    print "Valid password";

    }

    ```'
