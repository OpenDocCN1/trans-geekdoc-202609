    # Selecting a Database


    Once you establish a connection with a database server, then it is required to
    select a particular database with which all your tables are associated.


    This is required because there may be multiple databases residing on a single
    server and you can do work with a single database at a time.


    PHP provides function mysql_select_db to select a database. It returns TRUE on
    success or FALSE on failure.


    # Syntax


    ```

    bool mysql_select_db( db_name, connection );

    ```


    | Sr.No | Parameter & Description |

    |---|---|

    | 1 | db_name<br>Required - Database name to be selected |

    | 2 | connection<br>Optional - if not specified, then the last opened connection
    by mysql_connect will be used. |


    # Example


    Here is the example showing you how to select a database.


    ```

    <?php

    $dbhost = ''localhost:3036'';

    $dbuser = ''guest'';

    $dbpass = ''guest123'';

    $conn = mysql_connect($dbhost, $dbuser, $dbpass);

    ```'
