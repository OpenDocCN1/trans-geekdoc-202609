    \ Deleting Data from MySQL Database\n\nData can be deleted from MySQL tables by\
    \ executing SQL DELETE statement through PHP function **mysql_query**.\n\nFollowing\
    \ is a simple example to delete records into **employee** table. To delete a record\
    \ in any table it is required to locate that record by using a conditional clause.\
    \ Below example uses primary key to match a record in employee table.\n\n### Example\n\
    \nTry the following example to understand delete operation. You need to provide\
    \ an employee ID to delete an employee record from employee table.\n\n```html\n\
    <html>\n<head>\n<title>Delete a Record from MySQL Database</title>\n</head>\n\
    <body>\n<?php\nif(isset($_POST['delete'])) {\n   $dbhost = 'localhost:3036';\n\
    \   $dbuser = 'root';\n   $dbpass = 'rootpassword';\n   $conn = mysql_connect($dbhost,\
    \ $dbuser, $dbpass);\n\n   if(! $conn ) {\n      die('Could not connect: ' . mysql_error());\n\
    \   }\n\n   $emp_id = $_POST['emp_id'];\n\n   $sql = \"DELETE employee \". \"\
    WHERE emp_id = $emp_id\" ;\n   mysql_select_db('test_db');\n   $retval = mysql_query(\
    \ $sql, $conn );\n\n   if(! $retval ) {\n      die('Could not delete data: ' .\
    \ mysql_error());\n   }\n   echo \"Deleted data successfully\\n\";\n\n   mysql_close($conn);\n\
    } else {\n?>\n<form method = \"post\" action = \"<?php $_PHP_SELF ?>\">\n<table\
