    \ returned.\n- **PREG_SPLIT_DELIM_CAPTURE** – If this flag is set, parenthesized\
    \ expressions in the pattern will be captured and returned as well.\n- **PREG_SPLIT_OFFSET_CAPTURE**\
    \ – If this flag is set, for every occurring match the appended string offset\
