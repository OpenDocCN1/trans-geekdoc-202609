    \   }\n}\nprint Foo::$my_static . \"\\n\";\n$foo = new Foo();\nprint $foo->staticValue()\
    \ . \"\\n\";\n```\n\n## Final Keyword\n\nPHP 5 引入了 final 关键字，通过在定义前加上 final 来防止子类重写方法。如果类本身被定义为\
    \ final，则不能被继承。\n\nThe following example results in Fatal error: Cannot override\
    \ final method BaseClass::moreTesting()\n\n```php\n<?php\nclass BaseClass {\n\
    \   public function test() {\n      echo \"BaseClass::test() called<br>\";\n\n\
    \   }\n\n   final public function moreTesting() {\n       echo \"BaseClass::moreTesting()\
    \ called<br>\";\n   }\n}\n\nclass ChildClass extends BaseClass {\n    public function\
    \ moreTesting() {\n        echo \"ChildClass::moreTesting() called<br>\";\n  \
    \  }\n}\n\n?>\n```\n\n## Calling parent constructors\n\n与其为子类编写一个全新的构造函数，不如通过显式调用父类的构造函数，然后为实例化子类执行任何必要的额外操作来编写它。以下是一个简单示例：\n\
    \n```php\nclass Name\n{\n    var $_firstName;\n    var $_lastName;\n    function\
    \ Name($first_name, $last_name)\n    {\n        $this->_firstName = $first_name;\n\
    \        $this->_lastName = $last_name;\n    }\n\n    function toString() {\n\
    \        return($this->_lastName .\", \". $this->_firstName);\n    }\n}\n\nclass\
    \ NameSub1 extends Name\n{\n    var $_middleInitial;\n\n    function NameSub1($first_name,\
    \ $middle_initial, $last_name) {\n        Name::Name($first_name, $last_name);\n\
    \        $this->_middleInitial = $middle_initial;\n    }\n\n    function toString()\
    \ {\n        return(Name::toString() . \" \" . $this->_middleInitial);\n    }\n\
    }\n```\n\n在此示例中，我们有一个父类（Name），它有一个两参数构造函数；还有一个子类（NameSub1），它有一个三参数构造函数。NameSub1\
    \ 的构造函数通过使用 :: 语法显式调用其父构造函数（传递其中两个参数），然后设置一个额外字段来工作。同样，NameSub1 定义其非构造函数 toString()\
    \ 函数，以它重写的父函数为基础。\n\n**注意：** 构造函数可以与类同名定义。上面的示例中已定义。\n\n将 PHP 最简单地理解为可嵌入 HTML\
    \ 文档的解释型 C。该语言本身非常类似 C，只是带有无类型变量、大量内置的 Web 特定库，并且一切都直接钩入您喜爱的 Web 服务器。\n\n语句和函数定义的语法应该很熟悉，只是变量总是以\
    \ $ 开头，并且函数不需要单独的原型。\n\n这里列出了 PHP 与 C 的一些相似之处和不同之处。\n\n### Similarities\n\n相似之处\n\
    \n- **语法：** 总的来说，PHP 语法与 C 相同：代码对空格不敏感，语句以分号结束，函数调用结构相同（my_function(expression1,\
    \ expression2)），花括号（{ 和 }）将语句组合成块。PHP 支持 C 和 C++ 风格的注释（/* */）以及 //），还支持 Perl 和\
    \ shell 脚本风格（#）。\n\n- **运算符：** 赋值运算符（=、+=、*= 等）、布尔运算符（&&、||、!）、比较运算符（<、>、<=、>=、==、!=）以及基本算术运算符（+、-、*、/、%）在\
    \ PHP 中的行为与 C 中相同。\n\n- **控制结构：** 基本控制结构（if、switch、while、for）的行为与 C 中相同，包括支持 break\
    \ 和 continue。一个显著的区别是，PHP 中的 switch 可以接受字符串作为 case 标识符。\n\n- **函数名称：** 浏览文档时，您会看到许多看起来与\
    \ C 函数相同的函数名称。\n\n### Differences\n\n不同之处\n\n- **美元符号：** 所有变量都以 $ 开头。变量不需要在赋值前提前声明，并且没有固有类型。\n\
    \n- **类型：** PHP 只有两种数值类型：integer（对应 C 中的 long）和 double（对应 C 中的 double）。字符串长度任意。没有单独的字符类型。\n\
    \n- **类型转换：** 类型不在编译时检查，运行时通常也不会出现类型错误。相反，变量和值会根据需要自动跨类型转换。\n\n- **数组：** 数组的语法表面上与\
    \ C 的数组语法相似，但实现完全不同。它们实际上是关联数组或哈希表，索引可以是数字或字符串。不需要提前声明或分配。\n\n- **没有结构体类型：** PHP\
    \ 中没有 struct，部分原因是数组和对象类型合在一起使其变得多余。PHP 数组的元素不需要是一致的类型。\n\n- **没有指针：** PHP 中没有可用的指针，尽管无类型变量起到了类似的作用。PHP\
    \ 支持变量引用。您也可以在某种程度上模拟函数指针，即函数名称可以存储在变量中，并通过变量而非文字名称来调用。\n\n- **没有原型：** 函数不需要在定义其实现之前声明，只要函数定义可以在当前代码文件或包含的文件中找到。\n\
    \n- **内存管理：** PHP 引擎实际上是一个垃圾回收环境（引用计数），在小脚本中不需要进行任何释放。您可以自由分配新结构，例如新字符串和对象实例。在\
    \ PHP5 中，可以为对象定义析构函数，但没有 free 或 delete。析构函数在对象的最后一个引用消失、内存被回收之前被调用。\n\n- **编译和链接：**\
    \ PHP 脚本没有单独的编译步骤。\n\n- **宽松性：** 总体而言，PHP 比 C 更宽容（尤其是在其类型系统中），因此会让您犯下新的错误。意外结果比错误更常见。\n\
    \n"
