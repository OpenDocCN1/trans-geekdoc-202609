  mdcn: "\n## 18. PHP – 发送电子邮件\n\nPHP 必须在 **php.ini** 文件中正确配置，包含系统发送电子邮件的详细信息。打开 **/etc/**\
    \ 目录下的 php.ini 文件，找到标题为 **[mail function]** 的部分。\n\nWindows 用户应确保提供两个指令。第一个称为\
    \ SMTP，用于定义您的电子邮件服务器地址。第二个称为 sendmail_from，用于定义您自己的电子邮件地址。\n\nWindows 的配置大致如下：\n\
    \n```\n[mail function]\n; For Win32 only.\nSMTP = smtp.secureserver.net\n\n; For\
    \ win32 only\nsendmail_from = webmaster@tutorialspoint.com\n```\n\nLinux 用户只需让\
    \ PHP 知道其 sendmail 应用程序的位置。路径和任何所需的开关应指定给 sendmail_path 指令。\n\nLinux 的配置大致如下：\n\
    \n```\n[mail function]\n; For Win32 only.\nSMTP =\n\n; For win32 only\nsendmail_from\
    \ =\n\n; For Unix only\nsendmail_path = /usr/sbin/sendmail -t -i\n```\n\n现在您可以开始了。\n\
    \n### 发送纯文本电子邮件\n\nPHP 使用 **mail()** 函数发送电子邮件。该函数需要三个必填参数，分别指定收件人的电子邮件地址、邮件主题和实际消息，此外还有另外两个可选参数。\n\
    \n```\nmail( to, subject, message, headers, parameters );\n```\n\n每个参数的说明如下。\n\
    \n| 参数 | 说明 |\n|---|---|\n| to | 必填。指定电子邮件的接收者 / 接收者列表 |\n| subject | 必填。指定电子邮件的主题。该参数不能包含任何换行符\
    \ |\n| message | 必填。定义要发送的消息。每行应使用换行符（\\n）分隔。每行不应超过 70 个字符 |\n| headers | 可选。指定其他标头，例如\
    \ From、Cc 和 Bcc。其他标头应使用 CRLF（\\r\\n）分隔 |\n| parameters | 可选。指定发送给 sendmail 程序的其他参数\
    \ |\n\n一旦调用 mail 函数，PHP 将尝试发送电子邮件，如果成功则返回 true，如果失败则返回 false。\n\n多个接收者可以以逗号分隔的列表形式作为\
    \ mail() 函数的第一个参数指定。\n\n### 示例\n\n以下示例将向 xyz@somedomain.com 发送一封 HTML 电子邮件。您可以这样编写程序：程序应接收来自用户的所有内容，然后发送电子邮件。\n\
    \n```\n<html>\n<head>\n<title>Sending email using PHP</title>\n</head>\n<body>\n\
    <?php\n$to = \"xyz@somedomain.com\";\n$subject = \"This is subject\";\n$message\
    \ = \"This is simple text message.\";\n$header = \"From:abc@somedomain.com \\\
    r\\n\";\n$retval = mail ($to,$subject,$message,$header);\nif( $retval == true\
    \ )\n{\n   echo \"Message sent successfully...\";\n}\nelse\n{\n   echo \"Message\
    \ could not be sent...\";\n}\n?>\n</body>\n</html>\n```\n\n### 发送 HTML 电子邮件\n\n\
    使用 PHP 发送文本消息时，所有内容都将被视为纯文本。即使在文本消息中包含 HTML 标签，它也将显示为纯文本，HTML 标签不会按照 HTML 语法进行格式化。但\
    \ PHP 提供了将 HTML 消息作为实际 HTML 消息发送的选项。\n\n发送电子邮件时，您可以指定 MIME 版本、内容类型和字符集来发送 HTML\
    \ 电子邮件。\n\n### 示例\n\n以下示例将向 xyz@somedomain.com 发送一封 HTML 电子邮件，并抄送至 afgh@somedomain.com。您可以这样编写程序：程序应接收来自用户的所有内容，然后发送电子邮件。\n\
    \n```\n<html>\n<head>\n<title>Sending HTML email using PHP</title>\n</head>\n\
    <body>\n<?php\n$to = \"xyz@somedomain.com\";\n$subject = \"This is subject\";\n\
    $message = \"<b>This is HTML message.</b>\";\n$message .= \"<h1>This is headline.</h1>\"\
    ;\n$header = \"From:abc@somedomain.com \\r\\n\";\n$header .= \"Cc:afgh@somedomain.com\
    \ \\r\\n\";\n$header .= \"MIME-Version: 1.0\\r\\n\";\n$header .= \"Content-type:\
    \ text/html\\r\\n\";\n$retval = mail ($to,$subject,$message,$header);\nif( $retval\
    \ == true )\n{\n   echo \"Message sent successfully...\";\n}\nelse\n{\n   echo\
    \ \"Message could not be sent...\";\n}\n?>\n</body>\n</html>\n```\n\n### 通过电子邮件发送附件\n\
    \n要发送包含混合内容的电子邮件，需要将 **Content-type** 标头设置为 **multipart/mixed**。然后可以在 **边界** 中指定文本和附件部分。\n\
    \n边界以两个连字符后跟一个唯一数字开头，该唯一数字不能出现在电子邮件的消息部分中。PHP 函数 **md5()** 用于创建一个 32 位十六进制数字以生成唯一数字。表示电子邮件末尾部分的最终边界也必须以两个连字符结尾。\n\
    \n附件文件应使用 **base64_encode()** 函数进行编码以实现更安全的传输，并最好使用 **chunk_split()** 函数分割成块。这会在文件中以固定间隔（通常每\
    \ 76 个字符）插入 `\\r\\n`。\n\n以下示例将文件 **/tmp/test.txt** 作为附件发送。您可以编写程序来接收上传的文件并将其发送。\n\
    \n```\n<html>\n<head>\n<title>Sending attachment using PHP</title>\n</head>\n\
    <body>\n<?php\n$to = \"xyz@somedomain.com\";\n$subject = \"This is subject\";\n\
    $message = \"This is test message.\";\n# Open a file\n$file = fopen( \"/tmp/test.txt\"\
    , \"r\" );\nif( $file == false )\n{\n   echo \"Error in opening file\";\n   exit();\n\
    }\n# Read the file into a variable\n$size = filesize(\"/tmp/test.txt\");\n$content\
    \ = fread( $file, $size);\n# encode the data for safe transit\n# and insert \\\
    r\\n after every 76 chars.\n$encoded_content = chunk_split( base64_encode($content));\n\
