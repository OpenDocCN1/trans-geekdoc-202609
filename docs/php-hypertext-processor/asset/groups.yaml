    print \"$iparr[0] <br />\";\nprint \"$iparr[1] <br />\" ;\nprint \"$iparr[2] <br\
    \ />\" ;\nprint \"$iparr[3] <br />\" ;\n?>\n```\n\nThis will produce the following\
    \ result –\n\n123.456.789.000\n\n### PHP— Function preg_grep()\n\n#### Syntax\n\
    \n```\narray preg_grep ( string $pattern, array $input [, int $flags ] );\n```\n\
    \n#### Definition and Usage\n\nReturns the array consisting of the elements of\
    \ the input array that match the given pattern.\n\nIf flag is set to PREG_GREP_INVERT,\
    \ this function returns the elements of the input array that do not match the\
    \ given pattern.\n\n#### Return Value\n\n- Returns an array indexed using the\
    \ keys from the input array.\n\n#### Example\n\nFollowing is the piece of code,\
    \ copy and paste this code into a file and verify the result.\n\n```\n<?php\n\
