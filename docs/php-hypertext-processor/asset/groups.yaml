    \n```\nPhysics for High School\nAdvanced Chemistry\nAlgebra\n10\n15\n7\n```\n\n\
    ## 构造函数\n\n构造函数是一种特殊类型的函数，每当创建对象时就会自动调用。因此，我们通过构造函数初始化许多事物来充分利用这一行为。\n\nPHP 提供了一个名为\
    \ __construct() 的特殊函数来定义构造函数。你可以向构造函数传递任意数量的参数。\n\n以下示例将为 Books 类创建一个构造函数，并在创建对象时初始化书籍的价格和标题。\n\
    \n```php\nfunction __construct( $par1, $par2 ){\n   $this->price = $par1;\n  \
    \ $this->title = $par2;\n}\n```\n\n现在我们不需要单独调用 set 函数来设置价格和标题。我们可以仅在创建对象时初始化这两个成员变量。请查看以下示例：\n\
    \n```php\n$physics = new Books( \"Physics for High School\", 10 );\n$maths = new\
    \ Books ( \"Advanced Chemistry\", 15 );\n$chemistry = new Books (\"Algebra\",\
    \ 7 );\n\n/* Get those set values */\n$physics->getTitle();\n$chemistry->getTitle();\n\
    $maths->getTitle();\n\n$physics->getPrice();\n$chemistry->getPrice();\n$maths->getPrice();\n\
    ```\n\n这将产生以下结果：\n\n```\nPhysics for High School\nAdvanced Chemistry\nAlgebra\n\
    10\n15\n7\n```\n\n## 析构函数\n\n与构造函数类似，你可以使用 function __destruct() 定义析构函数。你可以在析构函数中释放所有资源。\n\
    \n## 继承\n\nPHP 类定义可以通过使用 extends 子句选择性地从父类定义继承。语法如下：\n\n```php\nclass Child extends\
    \ Parent {\n  <definition body>\n}\n```\n\n继承的效果是子类（或子类、派生类）具有以下特征：\n\n- 自动拥有父类的所有成员变量声明。\n\
    \n- 自动拥有与父类相同的所有成员函数，（默认情况下）这些函数的工作方式与父类中的函数相同。\n\n以下示例继承 Books 类，并根据要求添加更多功能。\n\
    \n```php\nclass Novel extends Books{\n  var publisher;\n  function setPublisher($par){\n\
    \  $this->publisher = $par;\n  }\n\nfunction getPublisher(){\n     echo $this->publisher.\
    \ \"<br />\";\n     }\n}\n```\n\n现在，除了继承的函数外，类 Novel 还保留了两个额外的成员函数。\n\n### 函数重写\n\
    \n子类中的函数定义会覆盖父类中同名的定义。在子类中，我们可以修改从父类继承的函数定义。在以下示例中，getPrice 和 getTitle 函数被重写以返回某些值。\n\
    \n```php\nfunction getPrice(){\n     echo $this->price . \"<br />\";\n     return\
    \ $this->price;\n        }\n        function getTitle(){\n     echo $this->title\
    \ . \"<br />\";\n     return $this->title;\n        }\n    }\n```\n\n### 公共成员\n\
    \n除非另有说明，类的属性和方法都是公共的。也就是说，它们可以在三种可能的情况下访问：\n\n- 从声明它的类之外\n\n- 从声明它的类之内\n\n- 从实现声明它的类的另一个类之内\n\
    \n到目前为止，我们看到所有成员都是公共成员。如果你希望限制类成员的可访问性，则可以将类成员定义为 **private** 或 **protected**。\n\
    \n### 私有成员\n\n通过将成员指定为私有，你将其可访问性限制在声明它的类中。私有成员不能从继承该类的类中引用，也不能从类外部访问。\n\n类成员可以通过在成员前使用\
    \ **private** 关键字设为私有。\n\n```php\nclass MyClass {\n    private $car = \"skoda\"\
    ;\n    $driver = \"SRK\";\n\n    function __construct($par) {\n        // Statements\
    \ here run every time an instance of the class is created.\n    }\n\n    function\
    \ myPublicFunction() {\n        return(\"I'm visible!\");\n    }\n\n    private\
    \ function myPrivateFunction() {\n        return(\"I'm not visible outside!\"\
    );\n    }\n}\n```\n\n当 MyClass 类通过 extends 被另一个类继承时，myPublicFunction() 将可见，$driver\
    \ 也是如此。扩展类将不了解或无法访问 myPrivateFunction 和 $car，因为它们被声明为私有。\n\n### 受保护成员\n\n受保护的属性或方法可在声明它的类以及扩展该类的类中访问。受保护成员在这两类类之外不可用。类成员可以通过在成员前使用\
    \ **protected** 关键字设为受保护。\n\n以下是 MyClass 的另一个版本：\n\n```php\nclass MyClass {\n\
    \    protected $car = \"skoda\";\n    $driver = \"SRK\";\n\n    function __construct($par)\
    \ {\n        // Statements here run every time\n        // an instance of the\
    \ class\n        // is created.\n    }\n\n    function myPublicFunction() {\n\
    \        return(\"I'm visible!\");\n    }\n\n    protected function myPrivateFunction()\
    \ {\n        return(\"I'm visible in child class!\");\n    }\n}\n```\n"
