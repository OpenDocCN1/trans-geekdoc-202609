    \ - 包括 if、for、while、switch 等。控制语句在控制关键字和左括号之间应有一个空格，以将其与函数调用区分开来。强烈建议始终使用花括号，即使在技术上是可选的情况下也是如此。\n\
    \n## 示例\n\n```\nif ((condition1) || (condition2)) {\naction1;\n} elseif ((condition3)\
    \ && (condition4)) {\naction2;\n} else {\ndefault action;\n}\n```\n\n您可以按照以下方式编写\
    \ switch 语句：\n\n```\nswitch (condition) {\ncase 1:\naction1;\nbreak;\ncase 2:\n\
    \    action2;\n    break;\n\ndefault:\n    defaultaction;\n    break;\n}\n```\n\
    \n**函数调用** - 调用函数时，函数名、左括号和第一个参数之间不应有空格；逗号和每个参数之间应有空格；最后一个参数、右括号和分号之间不应有空格。示例如下：\n\
    \n```\n$var = foo($bar, $baz, $quux);\n```\n\n**函数定义** - 函数声明遵循 \"BSD/Allman 风格\"\
    ：\n\n```\nfunction fooFunction($arg1, $arg2 = '')\n{\n    if (condition) {\n \
    \       statement;\n    }\n    return $val;\n}\n```\n\n**注释** - C 风格注释（/* */）和标准\
    \ C++ 注释（//）都可以。不鼓励使用 Perl/shell 风格注释（#）。\n\n**PHP 代码标记** - 始终使用 <?php ?> 来分隔\
    \ PHP 代码，而不是 <? ?> 缩写。这对于 PHP 合规性是必需的，也是在不同操作系统和设置中包含 PHP 代码的最便携方式。\n\n### 变量名\n\
    \n- 使用全小写字母\n- 使用 '_' 作为单词分隔符。\n- 全局变量应以 'g' 开头。\n- 全局常量应全大写并使用 '_' 分隔符。\n- 静态变量可以以\
    \ 's' 开头。\n\n**使函数可重入** - 函数不应保留阻止函数可重入的静态变量。\n\n**声明块对齐** - 声明块应保持对齐。\n\n**每行一条语句**\
    \ - 每行只应有一条语句，除非语句之间关系非常密切。\n\n**简短的方法或函数** - 方法应限制在一页代码之内。\n编写 PHP 程序时还应考虑更多要点。总体意图应是在整个代码编程过程中保持一致，这只有在遵循任何编码标准时才能实现。如果您喜欢不同的内容，可以制定自己的标准。\n\
    \n## 第 2 部分：高级 PHP\n\n### 21. PHP – 预定义变量\n\nPHP 为其运行的任何脚本提供大量预定义变量。PHP 还提供一组预定义数组，包含来自\
    \ Web 服务器、环境和用户输入的变量。这些新数组称为超全局变量：\n\n以下所有变量在每个作用域中都自动可用。\n\n### PHP 超全局变量\n\n\
    | 变量 | 描述 |\n| :--- | :--- |\n| $GLOBALS | 包含对当前在脚本全局作用域中可用的每个变量的引用。该数组的键是全局变量的名称。\
    \ |\n| $_SERVER | 这是一个包含标头、路径和脚本位置等信息的数组。该数组中的条目由 Web 服务器创建。不能保证每个 Web 服务器都会提供这些变量。有关所有\
    \ SERVER 变量的完整列表，请参见下一节。 |\n| $_GET | 通过 HTTP GET 方法传递给当前脚本的变量关联数组。 |\n| $_POST\
    \ | 通过 HTTP POST 方法传递给当前脚本的变量关联数组。 |\n| $_FILES | 通过 HTTP POST 方法上传到当前脚本的项目关联数组。\
    \ |\n| $_REQUEST | 由 $_GET、$_POST 和 $_COOKIE 的内容组成的关联数组。 |\n| $_COOKIE | 通过 HTTP\
    \ Cookie 传递给当前脚本的变量关联数组。 |\n| $_SESSION | 包含当前脚本可用的会话变量的关联数组。 |\n| $_PHP_SELF\
    \ | 包含调用它的 PHP 脚本文件名的字符串。 |\n| $php_errormsg | $php_errormsg 是一个包含 PHP 生成的最后一条错误消息文本的变量。\
    \ |\n\n### 服务器变量：$_SERVER\n\n$_SERVER 是一个包含标头、路径和脚本位置等信息的数组。该数组中的条目由 Web 服务器创建。不能保证每个\
    \ Web 服务器都会提供这些变量。\n\n| 变量 | 描述 |\n|---|---|\n| $_SERVER['PHP_SELF'] | 当前正在执行的脚本的文件名，相对于文档根目录\
    \ |\n| $_SERVER['argv'] | 传递给脚本的参数数组。当脚本在命令行上运行时，这提供对命令行参数的 C 样式访问。当通过 GET 方法调用时，这将包含查询字符串。\
    \ |\n| $_SERVER['argc'] | 如果在命令行上运行，则包含传递给脚本的命令行参数的数量。 |\n| $_SERVER['GATEWAY_INTERFACE']\
    \ | 服务器正在使用的 CGI 规范修订版；例如 'CGI/1.1'。 |\n| $_SERVER['SERVER_ADDR'] | 当前脚本正在其下执行的服务器的\
    \ IP 地址。 |\n| $_SERVER['SERVER_NAME'] | 当前脚本正在其下执行的服务器主机名。如果脚本在虚拟主机上运行，这将是为该虚拟主机定义的值。\
    \ |\n| $_SERVER['SERVER_SOFTWARE'] | 服务器标识字符串，在响应请求时给出于标头中。 |\n| $_SERVER['SERVER_PROTOCOL']\
    \ | 请求页面所使用的信息协议名称和修订版；例如 'HTTP/1.0'。 |\n| $_SERVER['REQUEST_METHOD'] | 用于访问页面的请求方法；例如\
    \ 'GET'、'HEAD'、'POST'、'PUT'。 |\n| $_SERVER['REQUEST_TIME'] | 请求开始的时间戳。自 PHP 5.1.0\
    \ 起可用。 |\n| $_SERVER['QUERY_STRING'] | 查询字符串（如果有），通过该字符串访问了页面。 |\n| $_SERVER['DOCUMENT_ROOT']\
    \ | 当前脚本正在其下执行的文档根目录，如服务器配置文件中所定义。 |\n\n"
