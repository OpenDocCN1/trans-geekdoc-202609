    \ **全局** 放在应被视为全局的变量前面即可。将此关键字放在已存在的变量前面，告诉 PHP 使用带有该名称的变量。请看示例：\n\n```php\n<?\n\
    $somevar = 15;\nfunction addit()\n{\nGLOBAL $somevar;\n$somevar++;\nprint \"Somevar\
    \ is $somevar\";\n}\naddit();\n?>\n```\n\n这将产生以下结果。\n\n```\nSomevar is 16\n```\n\
    \n## PHP 静态变量\n\n我讨论的最后一种变量作用域类型是静态。与作为函数参数声明的变量（在函数退出时销毁）不同，静态变量在函数退出时不会丢失其值，如果函数再次被调用，它仍将保持该值。\n\
    \n只需将关键字 **静态** 放在变量名前面，即可将变量声明为静态。\n\n```php\n<?\nfunction keep_track() {\nSTATIC\
    \ $count = 0;\n$count++;\nprint $count;\nprint \"\\n\";\n}\nkeep_track();\nkeep_track();\n\
    keep_track();\n?>\n```\n\n这将产生以下结果。\n\n```\n1\n2\n3\n```\n\n常量是简单值的名称或标识符。常量值在脚本执行期间不能更改。默认情况下，常量区分大小写。按惯例，常量标识符始终为大写。常量名以字母或下划线开头，后跟任意数量的字母、数字或下划线。如果已定义常量，则永远无法更改或取消定义。\n\
    \n要定义常量，必须使用 define() 函数；要获取常量的值，只需指定其名称即可。与变量不同，不需要为常量加上 $。如果您希望动态获取常量的名称，也可以使用\
    \ constant() 函数来读取常量的值。\n\n## constant() 函数\n\n顾名思义，此函数将返回常量的值。\n\n当您想要获取常量的值，但不知道其名称（即，它存储在变量中或由函数返回）时，这很有用。\n\
    \n## constant() 示例\n\n```php\n<?php\ndefine(\"MINSIZE\", 50);\necho MINSIZE;\n\
    echo constant(\"MINSIZE\"); // same thing as the previous line\n?>\n```\n\n常量中只能包含标量数据（布尔、整数、浮点数和字符串）。\n\
    \n## 常量与变量的区别\n\n- 常量前无需编写美元符号 ($)，而变量则必须编写美元符号。\n- 常量不能通过简单赋值定义，只能使用 define()\
    \ 函数定义。\n- 常量可以在任何位置定义和访问，无需考虑变量作用域规则。\n- 一旦设置了常量，就不能重新定义或取消定义。\n\n## 有效和无效的常量名\n\
    \n```php\n// Valid constant names\ndefine(\"ONE\", \"first thing\");\ndefine(\"\
    TWO02\", \"second thing\");\ndefine(\"THREE_3\", \"third thing\");\n// Invalid\
    \ constant names\ndefine(\"2TW0\", \"second thing\");\ndefine(\"__THREE__\", \"\
    third value\");\n```\n\n## PHP 魔术常量\n\nPHP 为其运行的任何脚本提供大量预定义常量。\n\n有五个神奇常量，其值取决于使用位置。例如，__LINE__\
    \ 的值取决于脚本中使用它的行。这些特殊常量不区分大小写，如下所示：\n\n下表列出了几个“神奇”的 PHP 常量及其描述：\n\n| 名称 | 描述 |\n\
    | --- | --- |\n| __LINE__ | 文件的当前行号。 |\n| __FILE__ | 文件的完整路径和文件名。如果在 include 内部使用，则返回包含文件的名称。自\
    \ PHP 4.0.2 起，__FILE__ 始终包含绝对路径，而在旧版本中，在某些情况下它包含相对路径。 |\n| __FUNCTION__ | 函数名。（添加于\
    \ PHP 4.3.0）从 PHP 5 开始，此常量返回按声明的函数名（区分大小写）。在 PHP 4 中，其值始终为小写。 |\n| __CLASS__ |\
    \ 类名。（添加于 PHP 4.3.0）从 PHP 5 开始，此常量返回按声明的类名（区分大小写）。在 PHP 4 中，其值始终为小写。 |\n| __METHOD__\
    \ | 类方法名。（添加于 PHP 5.0.0）按声明的方式返回方法名（区分大小写）。 |\n\n"
