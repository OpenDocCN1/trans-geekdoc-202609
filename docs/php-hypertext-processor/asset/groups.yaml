    \n## 异常处理\n\nPHP 5 具有一个与其他编程语言类似的异常模型。异常非常重要，可对错误处理提供更好的控制。\n\n现在让我们介绍与异常相关的新关键字。\n\
    \n- Try - 使用异常的函数应位于 \"try\" 块中。如果未触发异常，代码将照常继续。但是，如果触发异常，则会抛出异常。\n- Throw - 这是触发异常的方式。每个\
    \ \"throw\" 必须至少有一个 \"catch\"。\n- Catch - \"catch\" 块会捕获异常并创建包含异常信息的对象。\n\n抛出异常后，语句后面的代码将不会执行，PHP\
    \ 将尝试查找第一个匹配的 catch 块。如果异常未被捕获，将发出带有 \"Uncaught Exception\" 的 PHP 致命错误。\n\n- 异常可以在\
    \ PHP 中抛出和捕获（\"caught\"）。代码可以包围在 try 块中。\n- 每个 try 必须至少有一个对应的 catch 块。可以使用多个 catch\
    \ 块来捕获不同类的异常。\n- 异常可以在 catch 块中抛出（或重新抛出）。\n\n### 示例\n\n将以下代码片段复制并粘贴到文件中，验证结果。\n\
    \n```\n<?php\ntry {\n    $error = 'Always throw this error';\n    throw new Exception($error);\n\
    \    // Code following an exception is not executed.\n    echo 'Never executed';\n\
    } catch (Exception $e) {\n    echo 'Caught exception: ', $e->getMessage(), \"\\\
    n\";\n}\n\n// Continue execution\necho 'Hello World';\n?>\n```\n\n在上面的示例中，使用 $e->getMessage\
    \ 函数来获取错误消息。可以从 **Exception** 类中使用以下函数。\n\n- **getMessage()** - 异常消息\n- **getCode()**\
    \ - 异常代码\n- **getFile()** - 源文件名\n- **getLine()** - 源行号\n- **getTrace()** - backtrace()\
    \ 的数组\n- **getTraceAsString()** - 格式化的跟踪字符串\n\n## 创建自定义异常处理程序\n\n您可以定义自己的自定义异常处理程序。使用以下函数设置用户定义的异常处理程序函数。\n\
    \n```\nstring set_exception_handler ( callback $exception_handler )\n```\n\n这里\
    \ **exception_handler** 是发生未捕获异常时要调用的函数名称。必须在调用 set_exception_handler() 之前定义此函数。\n\
    \n### 示例\n\n```\n<?php\nfunction exception_handler($exception) {\n   echo \"Uncaught\
    \ exception: \" , $exception->getMessage(), \"\\n\";\n}\n\nset_exception_handler('exception_handler');\n\
    \nthrow new Exception('Uncaught Exception');\n\necho \"Not Executed\\n\";\n?>\n\
    ```\n\n在 [PHP 错误处理函数](PHP Error Handling Functions) 中查看完整的错误处理函数集合。\n\n## 24.\
    \ PHP – Bug 调试\n\n程序很少第一次就能正确运行。程序中许多事情可能会出错，导致 PHP 解释器生成错误消息。您可以选择这些错误消息的去向。消息可以连同其他程序输出一同发送到\
    \ Web 浏览器。它们也可以包含在 Web 服务器错误日志中。\n\n要使错误消息在浏览器中显示，请将 **display_errors** 配置指令设置为\
    \ **On**。要将错误发送到 Web 服务器错误日志，请将 **log_errors** 设置为 On。如果希望在两个位置都显示错误消息，可以将两者都设置为\
    \ On。\n\nPHP 定义了一些常量，可用于设置 **error_reporting** 的值，以便仅报告特定类型的错误：E_ALL（除严格通知外的所有错误）、E_PARSE（解析错误）、E_ERROR（致命错误）、E_WARNING（警告）、E_NOTICE（通知）和\
    \ E_STRICT（严格通知）。\n\n编写 PHP 程序时，最好使用感知 PHP 的编辑器，如 **BBEdit** 或 **Emacs**。这些编辑器的一个特殊功能是语法高亮。它会根据程序各部分的内容更改其颜色。例如，字符串为粉色，if\
    \ 和 while 等关键字为蓝色，注释为灰色，变量为黑色。\n\n另一个功能是引号和括号匹配，有助于确保引号和括号成对。当您键入闭合定界符（例如 }）时，编辑器会高亮显示与其匹配的开放\
    \ {。\n\n调试程序时，需要验证以下几点。\n\n- **缺少分号** - 每个 PHP 语句都以分号 (;) 结尾。PHP 在遇到分号之前不会停止读取语句。如果行末省略了分号，PHP\
    \ 将继续读取下一行中的语句。\n- **等号不足** - 在比较语句中询问两个值是否相等时，需要两个等号 (==)。使用一个等号是常见错误。\n- **变量名拼写错误**\
    \ - 如果变量名拼写错误，PHP 会将其理解为一个新变量。请记住：对于 PHP，$test 与 $Test 不是同一个变量。\n- **缺少美元符号**\
    \ - 变量名中缺少美元符号很难发现，但至少通常会导致错误消息，从而让您知道在哪里查找问题。\n- **引号问题** - 引号可能过多、过少或类型错误。因此请检查引号数量是否平衡。\n\
    - **缺少括号和花括号** - 它们应始终成对出现。\n- **数组索引** - 所有数组都应从 0 开始，而不是从 1 开始。\n\n"
