    http://www.tutorialspoint.com/perl\">PERL</a> <br />\n```\n\nNow create as many\
    \ pages as you like and include this file to create header. For example now your\
    \ test.php file can have the following content.\n\n```\n<html>\n<body>\n<?php\
    \ include(\"menu.php\"); ?>\n<p>This is an example to show how to include PHP\
    \ file!</p>\n</body>\n</html>\n```\n\nThis will produce the following result:\n\
    \n```\nHome -ebXML -AJAX -PERL\n\nThis is an example to show how to include PHP\
    \ file.\n```\n\n### The require() Function\n\nThe require() function takes all\
    \ the text in a specified file and copies it into the file that uses the include\
    \ function. If there is any problem in loading a file, then the **require()**\
    \ function generates a fatal error and halt the execution of the script.\n\nSo\
    \ there is no difference in require() and include() except they handle error conditions.\
    \ It is recommended to use the require() function instead of include(), because\
    \ scripts should not continue executing if files are missing or misnamed.\n\n\
