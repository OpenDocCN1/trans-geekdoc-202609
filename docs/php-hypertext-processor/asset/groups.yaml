    #### Definition and Usage\n\nThe preg_match_all() function matches all occurrences\
    \ of pattern in string.\n\nIt will place these matches in the array pattern_array\
    \ in the order you specify using the optional input parameter order. There are\
    \ two possible types of order –\n\n- **PREG_PATTERN_ORDER** – PREG_PATTERN_ORDER\
    \ specifies the order in the way that you might think most logical; $pattern_array[0]\
    \ is an array of all complete pattern matches, $pattern_array[1] is an array of\
    \ all strings matching the first parenthesized regexp, and so on.\n\n- **PREG_SET_ORDER**\
    \ – PREG_SET_ORDER specifies the order in the way that you might think most logical;\
    \ $pattern_array[0] contains elements matched by the first parenthesized regexp,\
    \ $pattern_array[1] contains elements matched by the second parenthesized regexp,\
    \ and so on.\n\n#### Return Value\n\n- Returns the number of matches.\n\n####\
    \ Example\n\nFollowing is the piece of code, copy and paste this code into a file\
    \ and verify the result.\n\n```\n<?php\n$userinfo = \"Name: <b>John Poul</b> <br>\
    \ Title: <b>PHP Guru</b>\";\npreg_match_all (\"/<b>(.*)<\\/b>/U\", $userinfo,\
    \ $pat_array);\n\nprint $pat_array[0][0].\" <br> \".$pat_array[0][1].\"\\n\";\n\
    ?>\n```\n\nThis will produce the following result –\n\nJohn Poul\nPHP Guru\n\n\
    ### PHP—Function preg_replace()\n\n#### Syntax\n\n```\nmixed preg_replace (mixed\
    \ pattern, mixed replacement, mixed string [, int limit [, int &$count]] );\n\
    ```\n\n#### Definition and Usage\n\nThe preg_replace() function operates just\
    \ like POSIX function ereg_replace(), except that regular expressions can be used\
    \ in the pattern and replacement input parameters.\n\nThe optional input parameter\
    \ limit specifies how many matches should take place.\n\nIf the optional parameter\
    \ $count is passed, then this variable will be filled with the number of replacements\
    \ done.\n\n#### Return Value\n\n- After the replacement has occurred, the modified\
    \ string will be returned.\n- If no matches are found, the string will remain\
    \ unchanged.\n\n#### Example\n\nFollowing is the piece of code, copy and paste\
    \ this code into a file and verify the result.\n\n```\n<?php\n$copy_date = \"\
    Copyright 1999\";\n$copy_date = preg_replace(\"([0-9]+)\", \"2000\", $copy_date);\n\
    \nprint $copy_date;\n?>\n```\n\nThis will produce the following result –\n\nCopyright\
    \ 2000\n\n### PHP — Function preg_split()\n\n#### Syntax\n\n```\narray preg_split\
    \ (string pattern, string string [, int limit [, int flags]]);\n```\n\n#### Definition\
    \ and Usage\n\nThe preg_split() function operates exactly like split(), except\
    \ that regular expressions are accepted as input parameters for pattern.\n\nIf\
    \ the optional input parameter limit is specified, then only limit number of substrings\
    \ are returned.\n\nflags can be any combination of the following types -\n\n-\
