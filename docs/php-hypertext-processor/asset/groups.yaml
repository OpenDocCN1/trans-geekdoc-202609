    \ FROM employee';\nmysql_select_db('test_db');\n\n$retval = mysql_query( $sql,\
    \ $conn );\nif(! $retval ) {\n  die('Could not get data: ' . mysql_error());\n\
    }\nwhile($row = mysql_fetch_array($retval, MYSQL_NUM)) {\n  echo \"EMP ID :{$row[0]}\
    \ <br> \".\n       \"EMP NAME : {$row[1]} <br> \".\n       \"EMP SALARY : {$row[2]}\
    \ <br> \".\n       \"--------------------------------<br>\";\n}\nmysql_free_result($retval);\n\
    echo \"Fetched data successfully\\n\";\nmysql_close($conn);\n?>\n```\n\nWhile\
    \ fetching data, you can write as complex SQL as you like. The procedure will\
    \ remain the same as mentioned above.\n\n## Using Paging through PHP\n\nIt's always\
    \ possible that your SQL SELECT statement query may result into thousands of records.\
    \ But it is not good idea to display all the results on one page. So we can divide\
    \ this result into many pages as per requirement.\n\nPaging means showing your\
    \ query result in multiple pages instead of just put them all in one long page.\n\
    \nMySQL helps to generate paging by using **LIMIT** clause which will take two\
    \ arguments. First argument as OFFSET and second argument how many records should\
    \ be returned from the database.\n\nFollowing is a simple example to fetch records\
    \ using **LIMIT** clause to generate paging.\n\n### Example\n\nTry the following\
    \ example to display 10 records per page.\n\n```html\n<html>\n<head>\n<title>Paging\
    \ Using PHP</title>\n</head>\n\n<body>\n<?php\n$dbhost = 'localhost:3036';\n$dbuser\
    \ = 'root';\n$dbpass = 'rootpassword';\n\n$rec_limit = 10;\n$conn = mysql_connect($dbhost,\
    \ $dbuser, $dbpass);\n\nif(! $conn ) {\n  die('Could not connect: ' . mysql_error());\n\
    }\nmysql_select_db('test_db');\n\n/* Get total number of records */\n$sql = \"\
    SELECT count(emp_id) FROM employee \";\n$retval = mysql_query( $sql, $conn );\n\
    \nif(! $retval ) {\n  die('Could not get data: ' . mysql_error());\n}\n$row =\
    \ mysql_fetch_array($retval, MYSQL_NUM );\n$rec_count = $row[0];\n\nif( isset($_GET{'page'}\
    \ ) ) {\n   $page = $_GET{'page'} + 1;\n   $offset = $rec_limit * $page ;\n}else\
    \ {\n   $page = 0;\n   $offset = 0;\n}\n\n$left_rec = $rec_count - ($page * $rec_limit);\n\
    $sql = \"SELECT emp_id, emp_name, emp_salary \".\n       \"FROM employee \".\n\
    \       \"LIMIT $offset, $rec_limit\";\n\n$retval = mysql_query( $sql, $conn );\n\
    if(! $retval ) {\ndie('Could not get data: ' . mysql_error());\n}\nwhile($row\
    \ = mysql_fetch_array($retval, MYSQL_ASSOC)) {\necho \"EMP ID :{$row['emp_id']}\
    \ <br> \".\n\"EMP NAME : {$row['emp_name']} <br> \".\n\"EMP SALARY : {$row['emp_salary']}\
    \ <br> \".\n\"--------------------------------<br>\";\n}\nif( $page > 0 ) {\n\
    $last = $page - 2;\necho \"<a href = \\\"$_PHP_SELF?page = $last\\\">Last 10 Records</a>\
    \ | \";\necho \"<a href = \\\"$_PHP_SELF?page = $page\\\">Next 10 Records</a>\"\
    ;\n}else if( $page == 0 ) {\necho \"<a href = \\\"$_PHP_SELF?page = $page\\\"\
    >Next 10 Records</a>\";\n}else if( $left_rec < $rec_limit ) {\n$last = $page -\
    \ 2;\necho \"<a href = \\\"$_PHP_SELF?page = $last\\\">Last 10 Records</a>\";\n\
    }\nmysql_close($conn);\n?>\n</body>\n</html>\n```\n\n## Updating Data into MySQL\
    \ Database\n\nData can be updated into MySQL tables by executing SQL UPDATE statement\
    \ through PHP function **mysql_query**.\n\nBelow is a simple example to update\
    \ records into **employee** table. To update a record in any table it is required\
    \ to locate that record by using a conditional clause. Below example uses primary\
    \ key to match a record in employee table.\n"
