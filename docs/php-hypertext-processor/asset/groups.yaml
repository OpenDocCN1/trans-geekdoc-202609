  mdcn: "\n- **构造函数：** 是一种特殊类型的函数，每当从类中创建对象时，该函数会被自动调用。\n\n- **析构函数：** 是一种特殊类型的函数，每当对象被删除或超出作用域时，该函数会被自动调用。\n\
    \n## 在 PHP 中定义类\n\n在 PHP 中定义新类的一般形式如下：\n\n```php\n<?php\nclass phpClass{\nvar\
    \ $var1;\nvar $var2 = \"constant string\";\nfunction myfunc ($arg1, $arg2) {\n\
    [...]\n}\n[...]\n}\n?>\n```\n\n以下是每一行的说明：\n\n- 特殊形式 **class**，后跟要定义的类名。\n\n- 一组花括号，包含任意数量的变量声明和函数定义。\n\
    \n- 变量声明以特殊形式 **var** 开头，后跟常规的 $ 变量名；它们也可以有一个对常量值的初始赋值。\n\n- 函数定义看起来很像独立的 PHP\
    \ 函数，但局限于类，并用于设置和访问对象数据。\n\n### 示例\n\n以下是一个定义图书类型类的示例：\n\n```php\n<?php\nclass\
    \ Books{\n/* Member variables */\nvar $price;\nvar $title;\n/* Member functions\
