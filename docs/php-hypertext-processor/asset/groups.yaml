    \n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| ? : | Conditional\
    \ Expression | If Condition is true ? Then value X : Otherwise value Y |\n\nTry\
    \ the following example to understand the conditional operator. Copy and paste\
    \ the following PHP program in test.php file and keep it in your PHP Server's\
    \ document root and browse it using any browser.\n\n```\n<html>\n<head><title>Arithmetical\
    \ Operators</title></head>\n<body>\n<?php\n$a = 10;\n$b = 20;\n\n/* If condition\
    \ is true then assign a to result otherwise b */\n$result = ($a > $b ) ? $a:$b;\n\
    echo \"TEST1 : Value of result is $result<br/> \";\n\n/* If condition is true\
    \ then assign a to result otherwise b */\n$result = ($a < $b ) ? $a:$b;\necho\
    \ \"TEST2 : Value of result is $result<br/> \";\n\n?>\n</body>\n</html>\n```\n\
    \nThis will produce the following result:\n\n```\nTEST1 : Value of result is 20\n\
    TEST2 : Value of result is 10\n```\n\n### Operators Categories\n\nAll the operators\
    \ we have discussed above can be categorized into the following categories:\n\n\
    - Unary prefix operators, which precede a single operand.\n- Binary operators,\
    \ which take two operands and perform a variety of arithmetic and logical operations.\n\
    - The conditional operator (a ternary operator), which takes three operands and\
    \ evaluates either the second or third expression, depending on the evaluation\
    \ of the first expression.\n- Assignment operators, which assign a value to a\
    \ variable.\n\n### Precedence of PHP Operators\n\nOperator precedence determines\
    \ the grouping of terms in an expression. This affects how an expression is evaluated.\
    \ Certain operators have higher precedence than others; for example, the multiplication\
    \ operator has higher precedence than the addition operator:\n\nFor example, x\
    \ = 7 + 3 * 2; Here x is assigned 13, not 20 because operator * has higher precedence\
    \ than + so it first get multiplied with 3*2 and then adds into 7.\n\nHere operators\
    \ with the highest precedence appear at the top of the table, those with the lowest\
    \ appear at the bottom. Within an expression, higher precedence operators will\
    \ be evaluated first.\n\n| Category | Operator | Associativity |\n|---|---|---|\n\
    | Unary | ! ++ -- | Right to left |\n| Multiplicative | * / % | Left to right\
    \ |\n| Additive | + - | Left to right |\n| Relational | < <= > >= | Left to right\
    \ |\n| Equality | == != | Left to right |\n| Logical AND | && | Left to right\
    \ |\n| Logical OR | || | Left to right |\n| Conditional | ?: | Right to left |\n\
    | Assignment | = += -= *= /= %= | Right to left |\n\n## 7. PHP – Decision Making\n\
    \nThe if, elseif ...else and switch statements are used to take decision based\
    \ on the different condition.\n\nYou can use conditional statements in your code\
    \ to make your decisions. PHP supports the following three decision making statements:\n\
    \n- **if...else statement** - use this statement if you want to execute a set\
    \ of code when a condition is true and another if the condition is not true\n\
    - **elseif statement** - is used with the if...else statement to execute a set\
    \ of code if one of several condition are true\n- **switch statement** - is used\
    \ if you want to select one of many blocks of code to be executed, use the Switch\
    \ statement. The switch statement is used to avoid long blocks of if...elseif..else\
    \ code.\n\n### The If...Else Statement\n\nIf you want to execute some code if\
    \ a condition is true and another code if a condition is false, use the if...else\
    \ statement.\n\n### Syntax\n\n```\nif (condition)\ncode to be executed if condition\
    \ is true;\nelse\ncode to be executed if condition is false;\n```\n\n### Example\n\
    \nThe following example will output \"Have a nice weekend!\" if the current day\
    \ is Friday, otherwise it will output \"Have a nice day!\":\n\n```\n<html>\n<body>\n\
    <?php\n$d=date(\"D\");\nif ($d==\"Fri\")\necho \"Have a nice weekend!\";\nelse\n\
    echo \"Have a nice day!\";\n?>\n</body>\n</html>\n```\n\nIt will produce the following\
    \ result:\n\n![](img/b9c80e155ac304a53696823920b08082_47_0.png)\n\n### The Elseif\
    \ Statement\n\nIf you want to execute some code if one of the several conditions\
    \ is true, then use the elseif statement.\n\n### Syntax\n\n```\nif (condition)\n\
    \  code to be executed if condition is true;\nelseif (condition)\n  code to be\
    \ executed if condition is true;\nelse\n  code to be executed if condition is\
    \ false;\n```\n\n### Example\n\nThe following example will output \"Have a nice\
    \ weekend!\" if the current day is Friday, and \"Have a nice Sunday!\" if the\
    \ current day is Sunday. Otherwise it will output \"Have a nice day!\":\n\n```\n\
    <html>\n<body>\n    <?php\n    $d=date(\"D\");\n    if ($d==\"Fri\")\n    echo\
    \ \"Have a nice weekend!\";\nelseif ($d==\"Sun\")\n echo \"Have a nice Sunday!\"\
    ;\nelse\n echo \"Have a nice day!\";\n?>\n</body>\n</html>\n```\n\nIt will produce\
    \ the following result:\n\n```\nHave a nice weekend!\n```\n\n### The Switch Statement\n\
    \nIf you want to select one of many blocks of code to be executed, use the Switch\
    \ statement. The switch statement is used to avoid long blocks of if..elseif..else\
    \ code.\n\n### Syntax\n\n```\nswitch (expression)\n{\ncase label1:\n code to be\
    \ executed if expression = label1;\n break;\ncase label2:\n code to be executed\
    \ if expression = label2;\n break;\ndefault:\n code to be executed\n if expression\
    \ is different\n from both label1 and label2;\n}\n```\n\n### Example\n\nThe `switch`\
    \ statement works in an unusual way. First it evaluates the given expression,\n\
    then seeks a label to match the resulting value. If a matching value is found,\
    \ then the\ncode associated with the matching label will be executed. If none\
    \ of the labels match, then\nthe statement will execute any specified default\
    \ code.\n\n```\n<html>\n<body>\n <?php\n$d=date(\"D\");\nswitch ($d)\n{\ncase\
    \ \"Mon\":\necho \"Today is Monday\";\nbreak;\ncase \"Tue\":\necho \"Today is\
    \ Tuesday\";\nbreak;\ncase \"Wed\":\necho \"Today is Wednesday\";\nbreak;\ncase\
    \ \"Thu\":\necho \"Today is Thursday\";\nbreak;\ncase \"Fri\":\necho \"Today is\
    \ Friday\";\nbreak;\ncase \"Sat\":\necho \"Today is Saturday\";\nbreak;\ncase\
    \ \"Sun\":\necho \"Today is Sunday\";\nbreak;\ndefault:\necho \"Wonder which day\
    \ is this ?\";\n}\n ?>\n </body>\n</html>\n```\n\nIt will produce the following\
    \ result:\n\n```\nToday is Friday\n```\n\n## 8. PHP – Loop Types\n\nLoops in PHP\
    \ are used to execute the same block of code a specified number of times. PHP\
    \ supports following four loop types.\n\n- **for** - loops through a block of\
    \ code a specified number of times.\n- **while** - loops through a block of code\
    \ if and as long as a specified condition is true.\n- **do...while** - loops through\
    \ a block of code once, and then repeats the loop as long as a special condition\
    \ is true.\n- **foreach** - loops through a block of code for each element in\
    \ an array.\n\nWe will discuss about **continue** and **break** keywords used\
    \ to control the loops execution.\n\n### The for loop statement\n\nThe for statement\
    \ is used when you know how many times you want to execute a statement or a block\
    \ of statements.\n\n### Syntax\n\n```\nfor (initialization; condition; increment)\n\
    {\n   code to be executed;\n}\n```\n\nThe initializer is used to set the start\
    \ value for the counter of the number of loop iterations.\nA variable may be declared\
    \ here for this purpose and it is traditional to name it $i.\n\n### Example\n\n\
    The following example makes five iterations and changes the assigned value of\
    \ two\nvariables on each pass of the loop:\n\n```\n<html>\n<body>\n<?php\n$a =\
    \ 0;\n$b = 0;\n\nfor( $i=0; $i<5; $i++ )\n{\n   $a += 10;\n   $b += 5;\n}\necho\
    \ (\"At the end of the loop a=$a and b=$b\" );\n?>\n</body>\n</html>\n```\n\n\
    This will produce the following result:\n\n```\nAt the end of the loop a=50 and\
    \ b=25\n```\n\n### The while loop statement\n\nThe while statement will execute\
    \ a block of code if and as long as a test expression is true.\nIf the test expression\
    \ is true, then the code block will be executed. After the code has\nexecuted\
    \ the test expression will again be evaluated and the loop will continue until\
    \ the\ntest expression is found to be false.\n\n### Syntax\n\n```\nwhile (condition)\n\
    {\n   code to be executed;\n}\n```\n\n### Example\n\nThis example decrements a\
    \ variable value on each iteration of the loop and the counter\nincrements until\
    \ it reaches 10 when the evaluation becomes false and the loop ends.\n\n```\n\
    <html>\n<body>\n<?php\n$i = 0;\n$num = 50;\nwhile( $i < 10)\n{\n   $num--;\n \
    \  $i++;\n}\necho (\"Loop stopped at i = $i and num = $num\" );\n```\n"
