    echo (\"Loop stopped at i = $i\" );\n?>\n</body>\n</html>\n```\n\nThis will produce\
    \ the following result:\n\n```\nLoop stopped at i = 10\n```\n\n## The foreach\
    \ loop statement\n\nThe foreach statement is used to loop through arrays. For\
    \ each pass the value of the current array element is assigned to $value and the\
