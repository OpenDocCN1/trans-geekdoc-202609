    # 6. PHP – Operator Types


    **What is Operator?** Simple answer can be given using expression 4 + 5 is equal
    to 9.

    Here 4 and 5 are called operands and + is called operator. PHP language supports
    following type of operators.


    +   - Arithmetic Operators

    +   - Comparison Operators

    +   - Logical (or Relational) Operators

    +   - Assignment Operators

    +   - Conditional (or ternary) Operators


    Let’s have a look on all operators one by one.


    # Arithmetic Operators


    The following arithmetic operators are supported by PHP language:


    Assume variable A holds 10 and variable B holds 20 then:


    | Operator | Description | Example |

    |---|---|---|

    | + | Adds two operands | A + B will give 30 |

    | - | Subtracts second operand from the first | A - B will give -10 |

    | * | Multiply both operands | A * B will give 200 |

    | / | Divide the numerator by denominator | B / A will give 2 |

    | % | Modulus Operator and remainder of after an integer division | B % A will
    give 0 |

    | ++ | Increment operator, increases integer value by one | A++ will give 11 |

    | -- | Decrement operator, decreases integer value by one | A-- will give 9 |


    # Example


    Try the following example to understand all the arithmetic operators. Copy and
    paste following PHP program in test.php file and keep it in your PHP Server’s
    document root and browse it using any browser.'
  - '[PAGE 36]


    ```

    <html>

    <head><title>Arithmetical Operators</title></head>

    <body>

    <?php

    $a = 42;

    $b = 20;


    $c = $a + $b;

    echo "Addition Operation Result: $c <br/>";

    $c = $a - $b;

    echo "Subtraction Operation Result: $c <br/>";

    $c = $a * $b;

    echo "Multiplication Operation Result: $c <br/>";

    $c = $a / $b;

    echo "Division Operation Result: $c <br/>";

    $c = $a % $b;

    echo "Modulus Operation Result: $c <br/>";

    $c = $a++;

    echo "Increment Operation Result: $c <br/>";

    $c = $a--;

    echo "Decrement Operation Result: $c <br/>";

    ?>

    </body>

    </html>

    ```


    This will produce the following result:


    ```

    Addition Operation Result: 62

    Subtraction Operation Result: 22

    Multiplication Operation Result: 840

    Division Operation Result: 2.1

    Modulus Operation Result: 2

    Increment Operation Result: 42

    Decrement Operation Result: 43

    ```'
