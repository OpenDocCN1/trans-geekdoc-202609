    j of F Y, \\\\a\\\\t g.i a\", time());\n?>\n```\n\n它将产生以下结果：\n\n07/19/16 11.15:06今天是\
    \ 2016 年 7 月 19 日，上午 11:15\n\n希望您已了解如何根据需求格式化日期和时间。作为参考，所有日期和时间函数的完整列表载于 PHP 日期和时间函数中。\n\
    \n## 26. PHP – PHP 和 MySQL\n\nPHP 可与几乎所有数据库软件协作，包括 Oracle 和 Sybase，但最常用的是免费可用的\
    \ MySQL 数据库。\n\n### 您应当已具备\n\n- 您已学习 MySQL 教程以了解 MySQL 基础知识。\n- 已下载并安装最新版本的 MySQL。\n\
    - 已创建密码为 **guest123** 的数据库用户 **guest**。\n- 如果您尚未创建数据库，则需要 root 用户及其密码来创建数据库。\n\
    \n本章已分为以下各节：\n\n- **连接到 MySQL 数据库** - 了解如何使用 PHP 打开和关闭 MySQL 数据库连接。\n- **使用 PHP\
    \ 创建 MySQL 数据库** - 本部分介绍如何使用 PHP 创建 MySQL 数据库和表。\n- **使用 PHP 删除 MySQL 数据库** -\
    \ 本部分介绍如何使用 PHP 删除 MySQL 数据库和表。\n- **向 MySQL 数据库插入数据** - 一旦您创建了数据库和表，您可能希望将数据插入到已创建的表中。本节将通过真实示例演示数据插入。\n\
    - **从 MySQL 数据库检索数据** - 了解如何使用 PHP 从 MySQL 数据库获取记录。\n- **使用 PHP 实现分页** - 本部分介绍如何将查询结果显示为多页以及如何创建导航链接。\n\
    - **向 MySQL 数据库更新数据** - 本部分介绍如何使用 PHP 更新 MySQL 数据库中的现有记录。\n- **从 MySQL 数据库删除数据**\
    \ - 本部分介绍如何使用 PHP 删除或清除 MySQL 数据库中的现有记录。\n- **使用 PHP 备份 MySQL 数据库** - 了解出于安全目的备份\
    \ MySQL 数据库的不同方法。\n\n### 连接到 MySQL 数据库\n\n### 打开数据库连接\n\nPHP 提供 **mysqli_connect**\
    \ 函数来打开数据库连接。该函数接受五个参数，成功时返回 MySQL 链接标识符，失败时返回 FALSE。\n\n### 语法\n\n```\nconnection\
    \ mysqli_connect(server,user,passwd,new_link,client_flag);\n```\n\n| 序号 | 参数 &\
    \ 描述 |\n| :--- | :--- |\n| 1 | **server** 可选 – 运行数据库服务器的主机名。如果未指定，则默认值为 **localhost:3306**。\
    \ |\n| 2 | **user** 可选 – 访问数据库的用户名。如果未指定，则默认为拥有服务器进程的用户名。 |\n| 3 | **passwd**\
    \ 可选 – 访问数据库的用户密码。如果未指定，则默认为空密码。 |\n| 4 | **new_link** 可选 – 如果使用相同参数再次调用 mysqli_connect()，则不会建立新连接；而是返回已打开连接的标识符。\
    \ |\n| 5 | **client_flags** 可选 – 以下常量的组合 – **MYSQL_CLIENT_SSL** – 使用 SSL 加密；**MYSQL_CLIENT_COMPRESS**\
    \ – 使用压缩协议 |\n\n- **MYSQL_CLIENT_IGNORE_SPACE** – 允许函数名后带有空格\n- **MYSQL_CLIENT_INTERACTIVE**\
    \ – 允许在关闭连接前进行交互式超时秒数的非活动\n\n**注意** – 您可以在 **php.ini** 文件中指定 server、user、passwd，而无需在每个\
    \ PHP 脚本中反复使用它们。请检查 php.ini 文件配置。\n\n### 关闭数据库连接\n\nPHP 提供用于关闭数据库连接的最简单函数 mysqli_close。该函数接受\
    \ mysqli_connect 函数返回的连接资源。成功时返回 TRUE，失败时返回 FALSE。\n\n### 语法\n\n```\nbool mysqli_close\
    \ ( resource $link_identifier );\n```\n\n如果未指定资源，则关闭最后打开的数据库。\n\n### 示例\n\n尝试以下示例来打开和关闭数据库连接\
    \ –\n\n```php\n<?php\n$dbhost = 'localhost:3036';\n$dbuser = 'guest';\n$dbpass\
    \ = 'guest123';\n$conn = mysqli_connect($dbhost, $dbuser, $dbpass);\nif(! $conn\
    \ ) {\n  die('Could not connect: ' . mysqli_error());\n}\necho 'Connected successfully';\n\
    mysqli_close($conn);\n?>\n```\n\n### 使用 PHP 创建 MySQL 数据库\n\n### 创建数据库\n\n"
