    \ information to and from the server using synchronous requests. This means you\
    \ fill out a form, hit submit, and get directed to a new page with new information\
    \ from the server.\n- With AJAX when submit is pressed, JavaScript will make a\
    \ request to the server, interpret the results and update the current screen.\
    \ In the purest sense, the user would never know that anything was even transmitted\
    \ to the server.\n\nFor complete learning on AJAX, please refer our AJAX Tutorial.\n\
    \n## PHP and AJAX Example\n\nTo clearly illustrate how easy it is to access information\
