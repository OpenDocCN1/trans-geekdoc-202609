    We can imagine our universe made of different objects like sun, earth, moon etc.
    Similarly, we can imagine our car made of different objects like wheel, steering,
    gear etc. In the same way, there are object oriented programming concepts which
    assume everything as an object and implement a software using different objects.


    # Object Oriented Concepts


    Before we go in detail, let''s define important terms related to Object Oriented
    Programming.


    +   - **Class:** This is a programmer-defined datatype, which includes local functions
    as well as local data. You can think of a class as a template for making many
    instances of the same kind (or class) of object.

    +   - **Object:** An individual instance of the data structure defined by a class.
    You define a class once and then make many objects that belong to it. Objects
    are also known as instance.

    +   - **Member Variable:** These are the variables defined inside a class. This
    data will be invisible to the outside of the class and can be accessed via member
    functions. These variables are called attribute of the object once an object is
    created.

    +   - **Member function:** These are the function defined inside a class and are
    used to access object data.

    +   - **Inheritance:** When a class is defined by inheriting existing function
    of a parent class, then it is called inheritance. Here child class will inherit
    all or few member functions and variables of a parent class.

    +   - **Parent class:** A class that is inherited from by another class. This
    is also called a base class or super class.

    +   - **Child Class:** A class that inherits from another class. This is also
    called a subclass or derived class.

    +   - **Polymorphism:** This is an object oriented concept where the same function
    can be used for different purposes. For example, function name will remain same
    but it may take different number of arguments and can do different task.

    +   - **Overloading:** a type of polymorphism in which some or all of operators
    have different implementations depending on the types of their arguments. Similarly,
    functions can also be overloaded with different implementation.

    +   - **Data Abstraction:** Any representation of data in which the implementation
    details are hidden (abstracted).

    +   - **Encapsulation:** refers to a concept where we encapsulate all the data
    and member functions together to form an object.'
