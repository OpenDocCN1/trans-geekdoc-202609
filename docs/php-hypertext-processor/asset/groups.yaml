    # Statements are expressions terminated by semicolons


    A _statement_ in PHP is any expression that is followed by a semicolon (;).Any
    sequence of valid PHP statements that is enclosed by the PHP tags is a valid PHP
    program. Here is a typical statement in PHP, which in this case assigns a string
    of characters to a variable called $greeting:


    ```

    $greeting = "Welcome to PHP!";

    ```


    # Expressions are combinations of tokens


