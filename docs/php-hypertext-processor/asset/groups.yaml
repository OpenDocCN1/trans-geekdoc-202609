    \    echo $this->price .\"<br/>\"\n}\nfunction setTitle($par){\n    $this->title\
    \ = $par;\n}\nfunction getTitle(){\n    echo $this->title .\" <br/>\";\n}\n}\n\
    ?>\n```\n\n变量 $this 是一个特殊变量，它指向同一个对象，即自身。\n\n## 在 PHP 中创建对象\n\n定义类后，你可以根据需要创建任意数量的该类型对象。以下是使用\
