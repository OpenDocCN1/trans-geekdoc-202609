    # PHP''s Regexp PERL Compatible Functions


    PHP offers the following functions for searching strings using Perl-compatible
    regular expressions:


    | Function | Description |

    | :--- | :--- |

    | preg_match() | The preg_match() function searches string for pattern, returning
    true if pattern exists, and false otherwise. |

    | preg_match_all() | The preg_match_all() function matches all occurrences of
    pattern in string. |

    | preg_replace() | The preg_replace() function operates just like ereg_replace(),
    except that regular expressions can be used in the pattern and replacement input
    parameters. |

    | preg_split() | The preg_split() function operates exactly like split(), except
    that regular expressions are accepted as input parameters for pattern. |

    | preg_grep() | The preg_grep() function searches all elements of input_array,
    returning all elements matching the regexp pattern. |

    | preg_quote() | Quote regular expression characters |


    # PHP—Function preg_match()


    # Syntax


    ```

    ```c

    int preg_match (string pattern, string string [, array pattern_array] [, int $flags
    [, int $offset]]);

    ```

    ```


    # Definition and Usage


    The preg_match() function searches string for pattern, returning true if pattern
    exists, and false otherwise.


    If the optional input parameter pattern_array is provided, then pattern_array
    will contain various sections of the subpatterns contained in the search pattern,
    if applicable.


    If this flag is passed as PREG_OFFSET_CAPTURE, for every occurring match the appendant
    string offset will also be returned


    Normally, the search starts from the beginning of the subject string. The optional
    parameter offset can be used to specify the alternate place from which to start
    the search.


    # Return Value


    +   • Returns true if pattern exists, and false otherwise.'
