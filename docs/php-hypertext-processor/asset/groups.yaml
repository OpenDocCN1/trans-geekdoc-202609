    \n## 13. PHP – 文件包含\n\n您可以在服务器执行之前将一个 PHP 文件的内容包含到另一个 PHP 文件中。有两个 PHP 函数可用于将一个\
    \ PHP 文件包含到另一个 PHP 文件中。\n\n- include() 函数\n- require() 函数\n\n这是 PHP 的一大优势，有助于创建可在多个页面上重复使用的函数、标题、页脚或元素。这将帮助开发人员以最小的努力轻松更改整个网站的布局。如果需要进行任何更改，则无需修改成千上万个文件，只需更改包含的文件即可。\n\
    \n### include() 函数\n\ninclude() 函数将指定文件中的所有文本复制到使用 include 函数的文件中。如果加载文件时出现任何问题，则\
