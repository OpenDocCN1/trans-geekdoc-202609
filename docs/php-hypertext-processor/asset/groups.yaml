    \ \"Message could not be sent...\";\n}\n?>\n</body>\n</html>\n```\n\n尝试上述所有示例。如果您遇到任何问题，可以在我们的讨论论坛中发帖。\n\
    \n## 19. PHP – 文件上传\n\n可以使用 PHP 脚本配合 HTML 表单允许用户将文件上传到服务器。最初，文件会上传到临时目录，然后由 PHP\
    \ 脚本将其重新定位到目标目录。\n\n**phpinfo.php** 页面中的信息描述了用于文件上传的临时目录（即 **upload_tmp_dir**），以及允许上传的文件最大允许大小（即\
    \ **upload_max_filesize**）。这些参数设置在 PHP 配置文件 **php.ini** 中。\n\n文件上传过程遵循以下步骤：\n\n\
    - 用户打开包含 HTML 表单的页面，该表单带有文本字段、浏览按钮和提交按钮。\n- 用户单击浏览按钮，从本地计算机选择要上传的文件。\n- 所选文件的完整路径出现在文本字段中，然后用户单击提交按钮。\n\
    - 所选文件被发送到服务器上的临时目录。\n- 作为表单 action 属性中指定的表单处理程序的 PHP 脚本会检查文件是否已到达，然后将文件复制到目标目录中。\n\
    - PHP 脚本向用户确认上传成功。\n\n与往常一样，写入文件时，临时位置和最终位置都必须设置允许文件写入的权限。如果其中任何一个设置为只读，则进程将失败。\n\
    \n上传的文件可以是文本文件、图像文件或任何文档。\n\n### 创建上传表单\n\n以下 HTML 代码创建了一个上传表单。该表单的 method 属性设置为\
    \ **post**，enctype 属性设置为 **multipart/form-data**\n\n```\n<html>\n<head>\n<title>File\
    \ Uploading Form</title>\n</head>\n<body>\n<h3>File Upload:</h3>\nSelect a file\
    \ to upload: <br />\n```\n"
