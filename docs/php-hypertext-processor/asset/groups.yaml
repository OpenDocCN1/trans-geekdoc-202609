    # Possible Error levels


    These error report levels are the different types of error the user-defined error
    handler can be used for. These values cab used in combination using | operator


    | Value | Constant | Description |

    |---|---|---|

    | 1 | E_ERROR | Fatal run-time errors. Execution of the script is halted |

    | 2 | E_WARNING | Non-fatal run-time errors. Execution of the script is not halted
    |

    | 4 | E_PARSE | Compile-time parse errors. Parse errors should only be generated
    by the parser. |

    | 8 | E_NOTICE | Run-time notices. The script found something that might be an
    error, but could also happen when running a script normally |

    | 16 | E_CORE_ERROR | Fatal errors that occur during PHP''s initial startup. |

    | 32 | E_CORE_WARNING | Non-fatal run-time errors. This occurs during PHP''s initial
    startup. |

    | 256 | E_USER_ERROR | Fatal user-generated error. This is like an E_ERROR set
    by the programmer using the PHP function trigger_error() |

    | 512 | E_USER_WARNING | Non-fatal user-generated warning. This is like an E_WARNING
    set by the programmer using the PHP function trigger_error() |

