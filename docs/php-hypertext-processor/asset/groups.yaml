    \ 等字符。\n\n变量大小没有限制。\n\n## PHP – 变量\n\n作用域可定义为变量在其声明的程序中可用的范围。PHP 变量可以是四种作用域类型之一：\n\
    \n- 局部变量\n- 函数参数\n- 全局变量\n- 静态变量\n\n## PHP 局部变量\n\n在函数中声明的变量被视为局部变量；也就是说，它只能在该函数中引用。函数外的任何赋值都被视为与函数中包含的变量完全不同的变量：\n\
    \n```php\n<?\n$x = 4;\nfunction assignx () {\n$x = 0;\nprint \"\\$x inside function\
