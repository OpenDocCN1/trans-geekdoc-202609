    \ \"Message could not be sent...\";\n}\n?>\n</body>\n</html>\n```\n\n### Sending\
    \ attachments with email\n\nTo send an email with mixed content requires to set\
    \ **Content-type** header to **multipart/mixed**. Then text and attachment sections\
    \ can be specified within **boundaries**.\n\nA boundary is started with two hyphens\
