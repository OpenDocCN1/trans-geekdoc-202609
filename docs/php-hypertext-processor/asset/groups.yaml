  mdcn: "\n## 注释 PHP 代码\n\n_注释_ 是程序中仅供人类读者存在的部分，在显示程序结果之前会被剔除。PHP 中有两种注释格式：\n\n###\
    \ 单行注释\n\n它们通常用于与本地代码相关的简短说明或注释。以下是单行注释的示例。\n\n```\n<?\n# This is a comment, and\n\
    # This is the second line of the comment\n// This is a comment too. Each style\
    \ comments only\nprint \"An example with single line comments\";\n?>\n```\n\n\
    ### 多行打印\n\n以下是用单个 print 语句打印多行的示例：\n\n```\n<?\n# First Example\nprint <<<END\n\
    This uses the \"here document\" syntax to output\nmultiple lines with $variable\
    \ interpolation. Note\nthat the here document terminator must appear on a\nline\
    \ with just a semicolon no extra whitespace!\nEND;\n# Second Example\nprint \"\
    This spans\nmultiple lines. The newlines will be\noutput as well\";\n?>\n```\n\
    \n### 多行注释\n\n它们通常用于在必要时提供伪代码算法和更详细的解释。多行注释风格与 C 语言相同。以下是多行注释的示例。\n\n```\n<?\n\
    /* This is a comment with multiline\n   Author : Mohammad Mohtashim\n   Purpose:\
    \ Multiline Comments Demo\n   Subject: PHP\n*/\nprint \"An example with multi\
    \ line comments\";\n?>\n```\n\n## PHP 对空白字符不敏感\n\n空白字符是你输入的通常在屏幕上不可见的内容，包括空格、制表符和回车符（行结束字符）。\n\
    \nPHP 对空白字符不敏感，意味着你连续使用多少个空白字符几乎都无关紧要。一个空白字符与许多这样的字符是一样的。\n\n例如，以下将 2 + 2 的和赋值给变量\
    \ $four 的 PHP 语句均等效：\n\n```\n$four = 2 + 2; // single spaces\n$four = 2 + 2 ;\
    \ // spaces and tabs\n$four =\n2+\n2; // multiple lines\n```\n\n## PHP 对大小写敏感\n\
    \n是的，PHP 是一门对大小写敏感的语言，这是真的。尝试以下示例：\n\n```\n<html>\n<body>\n<?\n$capital = 67;\n\
    print(\"Variable capital is $capital<br>\");\nprint(\"Variable CaPiTaL is $CaPiTaL<br>\"\
    );\n?>\n</body>\n</html>\n```\n\n这将产生以下结果：\n\n```\nVariable capital is 67\nVariable\
    \ CaPiTaL is\n```\n\n## 语句是以分号结尾的表达式\n\nPHP 中的 _语句_ 是任何后跟分号 (;) 的表达式。任何由 PHP 标签括起来的有效\
    \ PHP 语句序列都是有效的 PHP 程序。以下是 PHP 中的典型语句，在此示例中将字符串赋值给名为 $greeting 的变量：\n\n```\n$greeting\
    \ = \"Welcome to PHP!\";\n```\n\n## 表达式是标记的组合\n\nPHP 的最小构建块是不可分割的标记，例如数字（3.14159）、字符串（.two.）、变量（$two）、常量（TRUE）以及构成\
    \ PHP 语法本身的特殊单词，如 if、else、while、for 等等。\n\n## 大括号构成代码块\n\n虽然语句不能像表达式那样组合，但你始终可以通过将一系列语句用一组花括号括起来，将其放置在任何可以放置语句的位置。这里两个语句是等价的：\n\
    \n```\nif (3 == 2 + 1)\n  print(\"Good - I haven't totally lost my mind.<br>\"\
    );\n\nif (3 == 2 + 1)\n{\n  print(\"Good - I haven't totally\");\n  print(\"lost\
    \ my mind.<br>\");\n}\n```\n\n## 从命令提示符运行 PHP 脚本\n\n是的，你可以在命令提示符中运行 PHP 脚本。假设你在\
    \ test.php 文件中有以下内容：\n\n```\n<?php\n   echo \"Hello PHP!!!!!\";\n?>\n```\n\n现在按如下方式在命令提示符中运行此脚本：\n\
    \n```\n$ php test.php\n```\n\n它将产生以下结果\n\n```\nHello PHP!!!!!\n```\n\n## 4. PHP\
    \ – 变量类型\n\n在 PHP 程序中间存储信息的主要方式是使用变量。\n以下是关于 PHP 中变量需要知道的最重要的事情。\n\n- PHP 中的所有变量都以美元符号\
    \ ($) 开头。\n- 变量的值是其最近一次赋值的值。\n- 变量使用 = 运算符进行赋值，变量在左侧，要计算的表达式在右侧。\n- 变量可以，但不需要在赋值前声明。\n\
    - PHP 中的变量没有固有类型 - 变量预先不知道它是用于存储数字还是字符字符串。\n- 在赋值前使用的变量具有默认值。\n- PHP 在必要时会很好地自动在不同类型之间进行转换。\n\
    - PHP 变量类似于 Perl。\n\nPHP 总共有八种我们用来构建变量的数据类型：\n\n- **整数：** 是没有小数点的整数，如 4195。\n\
    - **双精度浮点数：** 是浮点数，如 3.14159 或 49.1。\n- **布尔值：** 只有两个可能的值，即 true 或 false。\n- **NULL：**\
    \ 是一种特殊类型，只有一个值：NULL。\n- **字符串：** 是字符序列，如 'PHP supports string operations.'。\n\
    - **数组：** 是命名和索引的其他值的集合。\n- **对象：** 是程序员定义的类的实例，可以封装其他各种值和特定于类的函数。\n- **资源：**\
    \ 是保存对 PHP 外部资源（如数据库连接）引用的特殊变量。\n\n前五种是 _简单类型_，接下来两种（数组和对象）是复合类型 - 复合类型可以封装其他任意类型的任意值，而简单类型不能。\n\
    \n本章将仅解释简单数据类型。数组和对象将分别解释。\n\n## 整数\n\n它们是没有小数点的整数，如 4195。它们是最简单的类型。它们对应于简单的整数，包括正数和负数。整数可以赋值给变量，也可以在表达式中使用，如下所示：\n\
    \n```\n$int_var = 12345;\n$another_int = -12345 + 12345;\n```\n\n整数可以是十进制（基数 10）、八进制（基数\
    \ 8）和十六进制（基数 16）格式。十进制格式是默认格式，八进制整数以 0 开头，十六进制整数以 0x 开头。\n\n对于大多数常见平台，最大整数为 (2**31\
    \ - 1)（即 2,147,483,647），最小（最负）整数为 - (2**31 - 1)（即 -2,147,483,647）。\n\n## 双精度浮点数\n\
    \n它们类似于 3.14159 或 49.1。默认情况下，双精度浮点数打印所需的最小小数位数。例如，代码：\n\n```\n$many = 2.2888800;\n\
    $many_2 = 2.2111200;\n$few = $many + $many_2;\nprint(\"$many + $many_2 = $few<br>\"\
    );\n```\n\n它会产生以下浏览器输出：\n\n```\n2.28888 + 2.21112 = 4.5\n```\n\n## 布尔值\n\n它们只有两个可能的值，即\
    \ true 或 false。PHP 提供了一组专门用作布尔值的常量：TRUE 和 FALSE，可以这样使用：\n\n```\nif (TRUE)\nprint(\"\
    This will always print<br>\");\nelse\nprint(\"This will never print<br>\");\n\
    ```\n\n## 将其他类型解释为布尔值\n\n以下是确定任何非布尔类型值的“真实性”的规则：\n\n- 如果值是数字，则当其正好等于零时为假，否则为真。\n\
    - 如果值是字符串，则当字符串为空（零个字符）或为字符串 \"0\" 时为假，否则为真。\n- NULL 类型的值始终为假。\n- 如果值是数组，则当其不包含其他值时为假，否则为真。对于对象，包含值意味着有一个已赋值的成员变量。\n\
    - 有效资源为真（尽管某些在成功时返回资源的函数在失败时会返回 FALSE）。\n- 不要将 double 用作布尔值。\n\n以下每个变量在布尔上下文中使用时，其名称中都包含真值。\n\
    \n```\n$true_num = 3 + 0.14159;\n$true_str = \"Tried and true\";\n$true_array[49]\
    \ = \"An array element\";\n$false_array = array();\n$false_null = NULL;\n$false_num\
    \ = 999 - 999;\n$false_str = \"\";\n```\n\n## NULL\n\nNULL 是一种特殊类型，只有一个值：NULL。要给变量赋\
    \ NULL 值，只需这样赋值：\n\n```\n$my_var = NULL;\n```\n\n特殊常量 NULL 按惯例大写，但实际上不区分大小写；你也可以输入：\n\
    \n```\n$my_var = null;\n```\n\n已赋 NULL 值的变量具有以下属性：\n\n- 在布尔上下文中求值为 FALSE。\n- 使用\
    \ IsSet() 函数测试时返回 FALSE。\n\n## 字符串\n\n它们是字符序列，如 \"PHP supports string operations\"\
    。以下是字符串的有效示例：\n\n```\n$string_1 = \"This is a string in double quotes\";\n$string_2\
    \ = \"This is a somewhat longer, singly quoted string\";\n$string_39 = \"This\
    \ string has thirty-nine characters\";\n$string_0 = \"\"; // a string with zero\
    \ characters\n```\n"
