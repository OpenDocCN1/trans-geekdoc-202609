    # Operators Categories


    All the operators we have discussed above can be categorized into the following
    categories:


    +   - Unary prefix operators, which precede a single operand.

    +   - Binary operators, which take two operands and perform a variety of arithmetic
    and logical operations.

    +   - The conditional operator (a ternary operator), which takes three operands
    and evaluates either the second or third expression, depending on the evaluation
    of the first expression.

    +   - Assignment operators, which assign a value to a variable.


    # Precedence of PHP Operators


    Operator precedence determines the grouping of terms in an expression. This affects
    how an expression is evaluated. Certain operators have higher precedence than
    others; for example, the multiplication operator has higher precedence than the
    addition operator:


    For example, x = 7 + 3 * 2; Here x is assigned 13, not 20 because operator * has
    higher precedence than + so it first get multiplied with 3*2 and then adds into
    7.


    Here operators with the highest precedence appear at the top of the table, those
    with the lowest appear at the bottom. Within an expression, higher precedence
    operators will be evaluated first.


    | Category | Operator | Associativity |

    |---|---|---|

    | Unary | ! ++ -- | Right to left |

    | Multiplicative | * / % | Left to right |

    | Additive | + - | Left to right |

    | Relational | < <= > >= | Left to right |

    | Equality | == != | Left to right |'
