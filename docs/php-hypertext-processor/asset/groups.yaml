    \n### 显示“文件下载”对话框\n\n有时，我们希望在用户点击链接时弹出“文件下载”框，而不是显示实际内容。这非常简单，可通过 HTTP 标头实现。\n\
    \n在这种情况下的 HTTP 标头与发送 Content-Type 为 text/html\\n\\n 的实际标头不同。此时内容类型将是 application/octet-stream，实际文件名将与其连接。\n\
    \n例如，如果要使给定链接中的 FileName 文件可下载，其语法如下。\n\n```\n#!/usr/bin/perl\n\n# HTTP Header\n\
