    # PHP Installation on Windows NT/2000/XP with IIS


    The Windows server installation of PHP running IIS is much simpler than on Unix,
    since it involves a precompiled binary rather than a source build.


    If you plan to install PHP over Windows, then here is the list of prerequisites:


    +   - A working PHP-supported Web server. Under previous versions of PHP, IIS/PWS
    was the easiest choice because a module version of PHP was available for it; but
    PHP now has added a much wider selection of modules for Windows.


    +   - A correctly installed PHP-supported database like MySQL or Oracle etc. (if
    you plan to use one)


    +   - The PHP Windows binary distribution (download it atwww.php.net/downloads.php)


    +   - A utility to unzip files (search http://download.cnet.com for PC file compression
    utilities)


    Now here are the steps to install Apache and PHP5 on your Windows machine. If
    your PHP version is different, then please take care accordingly.


    +   - Extract the binary archive using your unzip utility; C:\PHP is a common
    location.


    +   - Copy some .dll files from your PHP directory to your systems directory (usually
    C:\Winnt\System32). You need php5ts.dll for every case. You will also probably
    need to copy the file corresponding to your Web server module - C:\PHP\Sapi\php5isapi.dll.
    It''s possible you will also need others from the dlls subfolder - but start with
    the two mentioned above and add more if you need them.'
