    # # 19. PHP – File Uploading


    A PHP script can be used with a HTML form to allow users to upload files to the
    server. Initially files are uploaded into a temporary directory and then relocated
    to a target destination by a PHP script.


    Information in the **phpinfo.php** page describes the temporary directory that
    is used for file uploads as **upload_tmp_dir** and the maximum permitted size
    of files that can be uploaded is stated as **upload_max_filesize**. These parameters
    are set into PHP configuration file**php.ini**


    The process of uploading a file follows these steps:


    +   - The user opens the page containing a HTML form featuring a text files, a
    browse button and a submit button.

    +   - The user clicks the browse button and selects a file to upload from the
    local PC.

    +   - The full path to the selected file appears in the text field, then the user
    clicks the submit button.

    +   - The selected file is sent to the temporary directory on the server.

    +   - The PHP script that was specified as the form handler in the form’s action
    attribute checks that the file has arrived and then copies the file into an intended
    directory.

    +   - The PHP script confirms the success to the user.


    As usual, while writing files, it is necessary for both temporary and final locations
    to have permissions set that enable file writing. If either is set to be read-only,
    then process will fail.


    An uploaded file could be a text file or image file or any document.


    # ## Creating an Upload Form


    The following HTML code creates an uploader form. This form is having method attribute
    set to **post** and enctype attribute is set to **multipart/form-data**


    ```

    ```html

    <html>

    <head>

    <title>File Uploading Form</title>

    </head>

    <body>

    <h3>File Upload:</h3>

    Select a file to upload: <br />

    ```

    ```'
  md: "\n## 18. PHP – Sending Emails\n\nPHP must be configured correctly in the **php.ini**\
    \ file with the details of how your system sends email. Open php.ini file available\
    \ in **/etc/** directory and find the section headed **[mail function]**.\n\n\
    Windows users should ensure that two directives are supplied. The first is called\
    \ SMTP that defines your email server address. The second is called sendmail_from\
    \ which defines your own email address.\n\nThe configuration for Windows should\
    \ look something like this:\n\n```\n[mail function]\n; For Win32 only.\nSMTP =\
    \ smtp.secureserver.net\n\n; For win32 only\nsendmail_from = webmaster@tutorialspoint.com\n\
    ```\n\nLinux users simply need to let PHP know the location of their sendmail\
    \ application. The path and any desired switches should be specified to the sendmail_path\
    \ directive.\n\nThe configuration for Linux should look something like this:\n\
    \n```\n[mail function]\n; For Win32 only.\nSMTP =\n\n; For win32 only\nsendmail_from\
    \ =\n\n; For Unix only\nsendmail_path = /usr/sbin/sendmail -t -i\n```\n\nNow you\
    \ are ready to go.\n\n### Sending plain text email\n\nPHP makes use of **mail()**\
    \ function to send an email. This function requires three mandatory arguments\
    \ that specify the recipient's email address, the subject of the message and the\
    \ actual message additionally there are other two optional parameters.\n\n```\n\
    mail( to, subject, message, headers, parameters );\n```\n\nHere is the description\
    \ for each parameters.\n\n| Parameter | Description |\n|---|---|\n| to | Required.\
    \ Specifies the receiver / receivers of the email |\n| subject | Required. Specifies\
    \ the subject of the email. This parameter cannot contain any newline characters\
    \ |\n| message | Required. Defines the message to be sent. Each line should be\
    \ separated with a LF (\\n). Lines should not exceed 70 characters |\n| headers\
    \ | Optional. Specifies additional headers, like From, Cc, and Bcc. The additional\
    \ headers should be separated with a CRLF (\\r\\n) |\n| parameters | Optional.\
    \ Specifies an additional parameter to the sendmail program |\n\nAs soon as the\
    \ mail function is called, PHP will attempt to send the email, then it will return\
    \ true if successful or false if it is failed.\n\nMultiple recipients can be specified\
    \ as the first argument to the mail() function in a comma separated list.\n\n\
    ### Example\n\nThe following example will send an HTML email message to xyz@somedomain.com.\
    \ You can code this program in such a way that it should receive all content from\
    \ the user and then it should send an email.\n\n```\n<html>\n<head>\n<title>Sending\
    \ email using PHP</title>\n</head>\n<body>\n<?php\n$to = \"xyz@somedomain.com\"\
    ;\n$subject = \"This is subject\";\n$message = \"This is simple text message.\"\
    ;\n$header = \"From:abc@somedomain.com \\r\\n\";\n$retval = mail ($to,$subject,$message,$header);\n\
    if( $retval == true )\n{\n   echo \"Message sent successfully...\";\n}\nelse\n\
    {\n   echo \"Message could not be sent...\";\n}\n?>\n</body>\n</html>\n```\n\n\
    ### Sending HTML email\n\nWhen you send a text message using PHP, then all the\
    \ content will be treated as simple text. Even if you will include HTML tags in\
    \ a text message, it will be displayed as simple text and HTML tags will not be\
    \ formatted according to HTML syntax. But PHP provides option to send an HTML\
    \ message as actual HTML message.\n\nWhile sending an email message, you can specify\
    \ a Mime version, content type and character set to send an HTML email.\n\n###\
    \ Example\n\nThe following example will send an HTML email message to xyz@somedomain.com\
