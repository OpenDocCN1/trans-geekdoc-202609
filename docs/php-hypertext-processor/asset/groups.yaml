    <td> </td>\n</tr>\n\n<tr>\n<td width = \"100\"> </td>\n<td>\n<input name = \"\
    delete\" type = \"submit\"\nid = \"delete\" value = \"Delete\">\n</td>\n</tr>\n\
    </table>\n</form>\n<?php\n}\n?>\n</body>\n</html>\n```\n\n## Using PHP to Backup\
    \ MySQL Database\n\nIt is always a good practice to take a regular backup of your\
    \ database. There are three ways you can use to take backup of your MySQL database.\n\
    \n- Using SQL Command through PHP.\n- Using MySQL binary mysqldump through PHP.\n\
    - Using phpMyAdmin user interface.\n\n### Using SQL Command through PHP\n\nYou\
    \ can execute SQL SELECT command to take a backup of any table. To take a complete\
    \ database dump you will need to write separate query for separate table. Each\
    \ table will be stored into separate text file.\n\n### Example\n\nTry the following\
    \ example of using SELECT INTO OUTFILE query for creating table backup –\n\n```php\n\
    <?php\n   $dbhost = 'localhost:3036';\n   $dbuser = 'root';\n   $dbpass = 'rootpassword';\n\
    \n   $conn = mysql_connect($dbhost, $dbuser, $dbpass);\n\n   if(! $conn ) {\n\
    \      die('Could not connect: '. mysql_error());\n   }\n\n   $table_name = \"\
    employee\";\n   $backup_file  = \"/tmp/employee.sql\";\n   $sql = \"SELECT * INTO\
    \ OUTFILE '$backup_file' FROM $table_name\";\n\n   mysql_select_db('test_db');\n\
    \   $retval = mysql_query( $sql, $conn );\n\n   if(! $retval ) {\n      die('Could\
    \ not take data backup: '. mysql_error());\n   }\n}\necho \"Backed up data successfully\\\
    n\";\n\nmysql_close($conn);\n?>\n```\n\nThere may be instances when you would\
    \ need to restore data which you have backed up some time ago. To restore the\
    \ backup, you just need to run LOAD DATA INFILE query like this –\n\n```php\n\
    <?php\n$dbhost = 'localhost:3036';\n$dbuser = 'root';\n$dbpass = 'rootpassword';\n\
    \n$conn = mysql_connect($dbhost, $dbuser, $dbpass);\n\nif(! $conn )\n{\n die('Could\
    \ not connect: ' . mysql_error());\n}\n\n$table_name = \"employee\";\n$backup_file\
    \ = \"/tmp/employee.sql\";\n$sql = \"LOAD DATA INFILE '$backup_file' INTO TABLE\
    \ $table_name\";\n\nmysql_select_db('test_db');\n$retval = mysql_query( $sql,\
    \ $conn );\n\nif(! $retval )\n{\n die('Could not load data : ' . mysql_error());\n\
    }\n\necho \"Loaded data successfully\\n\";\n\nmysql_close($conn);\n?>\n```\n\n\
    ### Using MySQL binary mysqldump through PHP\n\nMySQL provides one utility mysqldump\
    \ to perform database backup. Using this binary you can take complete database\
    \ dump in a single command.\n\n### Example\n\nTry the following example to take\
    \ your complete database dump –\n\n```php\n<?php\n$dbhost = 'localhost:3036';\n\
    $dbuser = 'root';\n$dbpass = 'rootpassword';\n\n$backup_file = $dbname . date(\"\
    Y-m-d-H-i-s\") . '.gz';\n$command = \"mysqldump --opt -h $dbhost -u $dbuser -p\
    \ $dbpass \". \"test_db |\ngzip > $backup_file\";\n\nsystem($command);\n?>\n```\n\
    \n### Using phpMyAdmin user interface\n\nIf you have phpMyAdmin user interface\
    \ available, then it is very easy for you to take backup of your database.\n\n\
    To back up your MySQL database using phpMyAdmin click on the \"export\" link on\
    \ phpMyAdmin main page. Choose the database you wish to backup, check the appropriate\
    \ SQL options and enter the name for the backup file.\n\n## What is AJAX ?\n\n\
    - AJAX stands for **Asynchronous JavaScript** and **XML**. AJAX is a new technique\
