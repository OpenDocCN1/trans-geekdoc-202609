    \ website with minimal effort. If there is any change required, then instead of\
    \ changing thousands of files just change included file.\n\n### The include()\
    \ Function\n\nThe include() function takes all the text in a specified file and\
    \ copies it into the file that uses the include function. If there is any problem\
    \ in loading a file, then the include() function generates a warning but the script\
    \ will continue execution.\n\nAssume you want to create a common menu for your\
    \ website. Then create a file menu.php with the following content.\n\n```\n<a\
    \ href=\"http://www.tutorialspoint.com/index.htm\">Home</a> -<a href=\"http://www.tutorialspoint.com/ebxml\"\
