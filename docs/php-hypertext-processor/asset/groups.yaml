    # # 16. PHP – Cookies


    Cookies are text files stored on the client computer and they are kept of use
    tracking purpose. PHP transparently supports HTTP cookies.


    There are three steps involved in identifying returning users:


    +   - Server script sends a set of cookies to the browser. For example, name,
    age, or identification number etc.

    +   - Browser stores this information on local machine for future use.

    +   - Next time, when the browser sends any request to the web server, it sends
    those cookies information to the server and server uses that information to identify
    the user.


    This chapter will teach you how to set cookies, how to access them and how to
    delete them.


    # ## The Anatomy of a Cookie


    Cookies are usually set in an HTTP header (although JavaScript can also set a
    cookie directly on a browser). A PHP script that sets a cookie might send headers
    that look something like this:


    ```

