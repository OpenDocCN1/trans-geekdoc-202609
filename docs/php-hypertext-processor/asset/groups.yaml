    # Definition and Usage


    The eregi() function searches throughout a string specified by pattern for a string
    specified by string. The search is not case sensitive. Eregi() can be particularly
    useful when checking the validity of strings, such as passwords.


    The optional input parameter regs contains an array of all matched expressions
    that were grouped by parentheses in the regular expression.


    # Return Value


    +   • It returns true if the pattern is validated, and false otherwise.


