    # # 13. Php – File Inclusion


    You can include the content of a PHP file into another PHP file before the server
    executes it. There are two PHP functions which can be used to included one PHP
    file into another PHP file.


    +   - The include() Function

    +   - The require() Function


    This is a strong point of PHP which helps in creating functions, headers, footers,
    or elements that can be reused on multiple pages. This will help developers to
    make it easy to change the layout of complete website with minimal effort. If
    there is any change required, then instead of changing thousands of files just
    change included file.


    # ## The include() Function


    The include() function takes all the text in a specified file and copies it into
    the file that uses the include function. If there is any problem in loading a
    file, then the include() function generates a warning but the script will continue
    execution.


    Assume you want to create a common menu for your website. Then create a file menu.php
    with the following content.


    ```

    <a href="http://www.tutorialspoint.com/index.htm">Home</a> -<a href="http://www.tutorialspoint.com/ebxml">ebXML</a>
    -<a href="http://www.tutorialspoint.com/ajax">AJAX</a> -<a href="http://www.tutorialspoint.com/perl">PERL</a>
    <br />

    ```


    Now create as many pages as you like and include this file to create header. For
    example now your test.php file can have the following content.


    ```

    <html>

    <body>

    <?php include("menu.php"); ?>

    <p>This is an example to show how to include PHP file!</p>

    </body>

    </html>

    ```


    This will produce the following result:


    ```

    Home -ebXML -AJAX -PERL


    This is an example to show how to include PHP file.

    ```'
