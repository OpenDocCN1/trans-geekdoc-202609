    \ if you're cutting-edge) you'll have PHP statements like this:\n\n```html\n<html>\n\
    <head>\n<title>Hello World</title>\n<body>\n<?php echo \"Hello, World!\";?>\n\
    </body>\n</html>\n```\n\nIt will produce the following result:\n\n```\nHello,\
    \ World!\n```\n\nIf you examine the HTML output of the above example, you'll notice\
    \ that the PHP code is not present in the file sent from the server to your Web\
    \ browser. All of the PHP present in the Web page is processed and stripped from\
    \ the page; the only thing returned to the client from the Web server is pure\
    \ HTML output.\n\nAll PHP code must be included inside one of the three special\
    \ markup tags are recognized by the PHP Parser.\n\n```\n<?php PHP code goes here\
    \ ?>\n<?   PHP code goes here ?>\n<script language=\"php\"> PHP code goes here\
    \ </script>\n```\n\nMost common tag is the <?php...?> and we will also use the\
    \ same tag in our tutorial.\n\nFrom the next chapter, we will start with PHP Environment\
    \ Setup on your machine and then we will dig out almost all concepts related to\
    \ PHP to make you comfortable with the PHP language.\n\n### 2. PHP – Environment\
    \ Setup\n\nIn order to develop and run PHP Web pages, three vital components need\
    \ to be installed on your computer system.\n\n**Web Server** - PHP will work with\
    \ virtually all **Web Server** software, including Microsoft's Internet Information\
    \ Server (IIS) but then most often used is freely available Apache Server. Download\
    \ Apache for free here: http://httpd.apache.org/download.cgi\n\n**Database** -\
    \ PHP will work with virtually all database software, including Oracle and Sybase\
    \ but most commonly used is freely available MySQL database. Download MySQL for\
    \ free here: http://www.mysql.com/downloads/index.html\n\n**PHP Parser** - In\
    \ order to process PHP script instructions, a parser must be installed to generate\
    \ HTML output that can be sent to the **Web Browser**. This tutorial will guide\
    \ you how to install PHP parser on your computer.\n\n#### PHP Parser Installation\n\
    \nBefore you proceed, it is important to make sure that you have a proper environment\
    \ setup on your machine to develop your web programs using PHP.\n\nType the following\
    \ address into your browser's address box.\n\n```\nhttp://127.0.0.1/info.php\n\
    ```\n\nIf this displays a page showing your PHP installation related information,\
    \ then it means you have PHP and Webserver installed properly. Otherwise you have\
    \ to follow given procedure to install PHP on your computer.\n\nThis section will\
    \ guide you to install and configure PHP over the following four platforms:\n\n\
    - PHP Installation on Linux or Unix with Apache\n- PHP Installation on Mac OS\
    \ X with Apache\n- PHP Installation on Windows NT/2000/XP with IIS\n- PHP Installation\
    \ on Windows NT/2000/XP with Apache\n\n#### PHP Installation on Linux or Unix\
    \ with Apache\n\nIf you plan to install PHP on Linux or any other variant of Unix,\
    \ then here is the list of prerequisites:\n\n- The PHP source distribution http://www.php.net/downloads.php\
    \ The latest Apache source distribution http://httpd.apache.org/download.cgi\n\
    - A working PHP-supported database, if you plan to use one ( For example MySQL,\
    \ Oracle etc. )\n- Any other supported software to which PHP must connect (mail\
    \ server, BCMath package, JDK, and so forth)\n- An ANSI C compiler\n- Gnu make\
    \ utility - you can freely download it at http://www.gnu.org/software/make\n\n\
    Now here are the steps to install Apache and PHP5 on your Linux or Unix machine.\
    \ If your PHP or Apache versions are different, then please take care accordingly.\n\
    \n- If you haven't already done so, unzip and untar your Apache source distribution.\
    \ Unless you have a reason to do otherwise, /usr/local is the standard place.\n\
    ```\ngunzip -c apache_1.3.x.tar.gz\ntar -xvf apache_1.3.x.tar\n```\n- Build the\
    \ apache Server as follows\n```\ncd apache_1.3.x\n./configure --prefix=/usr/local/apache\
    \ --enable-so\nmake\nmake install\n```\n- Unzip and untar your PHP source distribution.\
    \ Unless you have a reason to do otherwise, /usr/local is the standard place.\n\
    ```\ngunzip -c php-5.x.tar.gz\ntar -xvf php-5.x.tar\ncd php-5.x\n```\n- Configure\
    \ and Build your PHP, assuming you are using MySQL database.\n```\n./configure\
    \ --with-apxs=/usr/sbin/apxs \\\n--with-mysql=/usr/bin/mysql\nmake\nmake install\n\
    ```\n- Install the php.ini file. Edit this file to get configuration directives:\n\
    ```\ncd ../php-5.x\ncp php.ini-dist /usr/local/lib/php.ini\n```\n- Tell your Apache\
    \ server where you want to serve files from, and what extension(s) you want to\
    \ identify PHP files. **.php** is the standard, but you can use .html, .phtml,\
    \ or whatever you want.\n  - Go to your HTTP configuration files (/usr/local/apache/conf\
    \ or whatever your path is)\n  - Open httpd.conf with a text editor. Search for\
    \ the word DocumentRoot (which should appear twice), and change both paths to\
    \ the directory you want to serve files out of (in our case, /home/httpd). We\
    \ recommend a home directory rather than the default /usr/local/apache/htdocs\
    \ because it is more secure, but it doesn't have to be in a home directory. You\
    \ will keep all your PHP files in this directory.\n- Add at least one PHP extension\
    \ directive, as shown in the first line of code that follows. In the second line,\
    \ we've also added a second handler to have all HTML files parsed as PHP\n```\n\
    AddType application/x-httpd-php .php\nAddType application/x-httpd-php .html\n\
    ```\n- Restart your server. Every time you change your HTTP configuration or php.ini\
    \ files, you must stop and start your server again.\n```\ncd ../bin\n./apachectl\
    \ start\n```\n- Set the document root directory permissions to world-executable.\
    \ The actual PHP files in the directory need only be world-readable (644). If\
    \ necessary, replace /home/httpd with your document root below:\n```\nchmod 755\
    \ /home/httpd/html/php\n```\n- Open a text editor. Type: <?php phpinfo(); ?>.\
    \ Save this file in your Web server's document root as info.php.\n- Start any\
    \ Web browser and browse the file. You must always use an HTTP request (http://www.testdomain.com/info.php\
    \ or http://localhost/info.php or http://127.0.0.1/info.php) rather than a filename\
    \ (/home/httpd/info.php) for the file to be parsed correctly\n\nYou should see\
    \ a long table of information about your new PHP installation message Congratulations!\n\
    \n#### PHP Installation on Mac OS X with Apache\n\nMac users have the choice of\
    \ either a binary or a source installation. In fact, your OS X probably came with\
    \ Apache and PHP preinstalled. This is likely to be quite an old build, and it\
    \ probably lacks many of the less common extensions.\n\nHowever, if all you want\
    \ is a quick Apache + PHP + MySQL/PostgreSQL setup on your laptop, this is certainly\
    \ the easiest way to fly. All you need to do is edit your Apache configuration\
    \ file and turn on the Web server.\n\nSo just follow the steps given below:\n\n\
    - Open the Apache config file in a text editor as root.\n```\nsudo open -a TextEdit\
    \ /etc/httpd/httpd.conf\n```\n"
  mdcn: "\n\n## 31. PHP – PHP for PERL Developers 183\n- 相似点\n- 差异点\n\n## PART 3:\
    \ 函数参考 185\n\n## 32. PHP – 函数参考 186\n\n## Part 1: 学习 PHP\n\n### 1. PHP – 简介\n\n\
    PHP 最初是一个小型开源项目，随着越来越多的人发现它有多有用而不断发展。Rasmus Lerdorf 在 1994 年推出了第一个版本的 PHP。\n\n\
    - PHP 是递归缩写词，代表 \"PHP: Hypertext Preprocessor\"。\n- PHP 是一种服务器端脚本语言，嵌入于 HTML 中。它用于管理动态内容、数据库、会话跟踪，甚至构建整个电子商务网站。\n\
    - 它与多种流行数据库集成，包括 MySQL、PostgreSQL、Oracle、Sybase、Informix 和 Microsoft SQL Server。\n\
    - PHP 的执行速度非常快，尤其是在 Unix 侧作为 Apache 模块编译时。MySQL 服务器启动后，即使是非常复杂的查询和巨大的结果集，也能在创纪录的时间内执行。\n\
    - PHP 支持大量主要协议，如 POP3、IMAP 和 LDAP。PHP4 增加了对 Java 和分布式对象架构（COM 和 CORBA）的支持，使多层开发首次成为可能。\n\
    - PHP 很宽容：PHP 语言尽可能地宽容。\n- PHP 语法类似于 C 语言。\n\n#### PHP 的常见用途\n\nPHP 执行系统函数，即从系统上的文件中，它可以创建、打开、读取、写入和关闭文件。PHP\
    \ 的其他用途包括：\n\n- PHP 可以处理表单，即从文件中收集数据，将数据保存到文件，通过电子邮件发送数据，将数据返回给用户。\n- 你可以通过 PHP\
    \ 在数据库中添加、删除、修改元素。\n- 访问 Cookie 变量并设置 Cookie。\n- 使用 PHP，你可以限制用户访问网站的某些页面。\n- 它可以加密数据。\n\
    \n#### PHP 的特性\n\n五个重要特性使 PHP 的实用性成为可能：\n\n- 简单性\n- 效率\n- 安全性\n- 灵活性\n- 熟悉度\n\n\
    #### PHP 中的 \"Hello World\" 脚本\n\n要初步了解 PHP，首先从简单的 PHP 脚本开始。由于 \"Hello, World!\"\
    \ 是一个基本示例，我们将先创建一个友好的小型 \"Hello, World!\" 脚本。\n\n如前所述，PHP 嵌入于 HTML。这意味着在你的普通 HTML（或如果你追求前沿技术的\
    \ XHTML）中，你会看到这样的 PHP 语句：\n\n```html\n<html>\n<head>\n<title>Hello World</title>\n\
    <body>\n<?php echo \"Hello, World!\";?>\n</body>\n</html>\n```\n\n它将产生以下结果：\n\n\
    ```\nHello, World!\n```\n\n如果你检查上述示例的 HTML 输出，你会注意到 PHP 代码不存在于从服务器发送到 Web 浏览器的文件中。网页中所有的\
    \ PHP 都会被处理并从页面中剔除；从 Web 服务器返回到客户端的只有纯 HTML 输出。\n\n所有 PHP 代码都必须包含在 PHP 解析器识别的三种特殊标记标签之一中。\n\
    \n```\n<?php PHP code goes here ?>\n<?   PHP code goes here ?>\n<script language=\"\
    php\"> PHP code goes here </script>\n```\n\n最常用的标签是 <?php...?>，我们在教程中也将使用相同的标签。\n\
    \n从下一章开始，我们将在你的机器上进行 PHP 环境设置，然后我们将探讨与 PHP 相关的几乎所有概念，让你熟悉 PHP 语言。\n\n### 2. PHP\
    \ – 环境设置\n\n为了开发和运行 PHP 网页，你的计算机系统需要安装三个关键组件。\n\n**Web 服务器** - PHP 可以与几乎所有 **Web\
    \ 服务器** 软件一起工作，包括 Microsoft 的 Internet Information Server (IIS)，但最常用的是免费可用的 Apache\
    \ 服务器。在此免费下载 Apache：http://httpd.apache.org/download.cgi\n\n**数据库** - PHP 可以与几乎所有数据库软件一起工作，包括\
    \ Oracle 和 Sybase，但最常用的是免费可用的 MySQL 数据库。在此免费下载 MySQL：http://www.mysql.com/downloads/index.html\n\
    \n**PHP 解析器** - 为了处理 PHP 脚本指令，必须安装一个解析器以生成可以发送到 **Web 浏览器** 的 HTML 输出。本教程将指导你如何在计算机上安装\
    \ PHP 解析器。\n\n#### PHP 解析器安装\n\n在继续之前，重要的是要确保你的机器上已正确设置环境，以便使用 PHP 开发 Web 程序。\n\
    \n将以下地址输入到浏览器的地址框中。\n\n```\nhttp://127.0.0.1/info.php\n```\n\n如果这显示一个显示 PHP 安装相关信息的页面，那么意味着你已正确安装\
    \ PHP 和 Web 服务器。否则，你需要按照给定的过程在计算机上安装 PHP。\n\n本节将指导你在以下四个平台上安装和配置 PHP：\n\n- 在带有\
    \ Apache 的 Linux 或 Unix 上安装 PHP\n- 在带有 Apache 的 Mac OS X 上安装 PHP\n- 在带有 IIS 的\
    \ Windows NT/2000/XP 上安装 PHP\n- 在带有 Apache 的 Windows NT/2000/XP 上安装 PHP\n\n####\
    \ 在带有 Apache 的 Linux 或 Unix 上安装 PHP\n\n如果你计划在 Linux 或任何其他 Unix 变体上安装 PHP，那么以下是先决条件列表：\n\
    \n- PHP 源代码分发 http://www.php.net/downloads.php 最新的 Apache 源代码分发 http://httpd.apache.org/download.cgi\n\
    - 一个正常工作的 PHP 支持的数据库，如果你打算使用一个（例如 MySQL、Oracle 等）\n- PHP 必须连接的任何其他受支持的软件（邮件服务器、BCMath\
    \ 包、JDK 等等）\n- ANSI C 编译器\n- GNU make 实用程序 - 你可以在此免费下载：http://www.gnu.org/software/make\n\
    \n现在，以下是在你的 Linux 或 Unix 机器上安装 Apache 和 PHP5 的步骤。如果你的 PHP 或 Apache 版本不同，请相应注意。\n\
    \n- 如果你还没有这样做，请解压并解包你的 Apache 源代码分发。除非你有理由这样做，否则 /usr/local 是标准位置。\n```\ngunzip\
    \ -c apache_1.3.x.tar.gz\ntar -xvf apache_1.3.x.tar\n```\n- 如下构建 Apache 服务器\n\
    ```\ncd apache_1.3.x\n./configure --prefix=/usr/local/apache --enable-so\nmake\n\
    make install\n```\n- 解压并解包你的 PHP 源代码分发。除非你有理由这样做，否则 /usr/local 是标准位置。\n```\ngunzip\
    \ -c php-5.x.tar.gz\ntar -xvf php-5.x.tar\ncd php-5.x\n```\n- 配置并构建你的 PHP，假设你使用的是\
    \ MySQL 数据库。\n```\n./configure --with-apxs=/usr/sbin/apxs \\\n--with-mysql=/usr/bin/mysql\n\
    make\nmake install\n```\n- 安装 php.ini 文件。编辑此文件以获取配置指令：\n```\ncd ../php-5.x\ncp\
    \ php.ini-dist /usr/local/lib/php.ini\n```\n- 告诉你的 Apache 服务器你希望从哪里提供文件，以及你希望使用哪些扩展名来识别\
    \ PHP 文件。**.php** 是标准，但你可以使用 .html、.phtml 或任何你想要的扩展名。\n  - 转到你的 HTTP 配置文件（/usr/local/apache/conf\
    \ 或你的任何路径）\n  - 用文本编辑器打开 httpd.conf。搜索单词 DocumentRoot（应该出现两次），并将两个路径都更改为你希望提供文件的目录（在我们的例子中，/home/httpd）。我们建议使用主目录而不是默认的\
    \ /usr/local/apache/htdocs，因为它更安全，但不必位于主目录中。你将把所有 PHP 文件保存在此目录中。\n- 添加至少一个 PHP\
    \ 扩展指令，如以下代码的第一行所示。在第二行中，我们还添加了第二个处理程序，以将所有 HTML 文件解析为 PHP\n```\nAddType application/x-httpd-php\
    \ .php\nAddType application/x-httpd-php .html\n```\n- 重新启动你的服务器。每次更改 HTTP 配置或\
    \ php.ini 文件时，你都必须停止并重新启动服务器。\n```\ncd ../bin\n./apachectl start\n```\n- 将文档根目录权限设置为全局可执行。目录中的实际\
    \ PHP 文件只需全局可读（644）。如果必要，将下面的 /home/httpd 替换为你的文档根目录：\n```\nchmod 755 /home/httpd/html/php\n\
    ```\n- 打开文本编辑器。键入：<?php phpinfo(); ?>。将此文件保存在 Web 服务器的文档根目录中，文件名为 info.php。\n\
    - 启动任何 Web 浏览器并浏览该文件。你必须始终使用 HTTP 请求（http://www.testdomain.com/info.php 或 http://localhost/info.php\
    \ 或 http://127.0.0.1/info.php），而不是文件名（/home/httpd/info.php），才能正确解析该文件。\n\n你应该看到一个关于新\
    \ PHP 安装的长信息表，恭喜你！\n\n#### 在带有 Apache 的 Mac OS X 上安装 PHP\n\nMac 用户可以选择二进制安装或源代码安装。事实上，你的\
    \ OS X 可能预装了 Apache 和 PHP。这可能是一个相当旧的构建版本，并且可能缺少许多不常用的扩展。\n\n但是，如果你只想在笔记本电脑上快速设置\
    \ Apache + PHP + MySQL/PostgreSQL，这无疑是最简单的方法。你只需要编辑 Apache 配置文件并打开 Web 服务器。\n\n\
    所以，请按照以下步骤操作：\n\n- 以 root 身份在文本编辑器中打开 Apache 配置文件。\n```\nsudo open -a TextEdit\
    \ /etc/httpd/httpd.conf\n```\n\n"
