  \n\n\n\n\n## 附录 B 书面实验答案\n\n### 第 1 章：通过原则和政策进行安全治理\n\n1.  CIA 三要素是机密性、完整性和可用性的组合。机密性是指用于确保数据、信息或资源的秘密性得到保护的措施概念。完整性是指保护数据的可靠性和正确性的概念。可用性是指授权主体被授予及时、不间断地访问对象的概念。术语\
  \ CIA 三要素用于表示安全解决方案的三个关键组成部分。\n\n2.  问责制的要求包括识别、认证、授权和审计。这些组件中的每一个都需要具有法律效力，才能真正让某人对其行为负责。\n\
  \n3.  变更控制管理的好处包括：防止因不受控制的变更而导致安全性降低、记录和跟踪环境中的所有更改、标准化、符合安全策略，以及在发生意外或非预期结果时回滚更改的能力。\n\
  \n4.  (1) 确定保管人，并定义其职责。(2) 指定信息将如何被分类和标记的评估标准。(3) 对每个资源进行分类和标记。虽然此步骤由所有者执行，但主管应对其进行审查。(4)\
  \ 记录发现的分类策略例外情况，并将其纳入评估标准。(5) 选择将应用于每个分类级别的安全控制，以提供必要的保护级别。(6) 指定取消分类资源的程序以及将资源的保管权转移给外部实体的程序。(7)\
  \ 创建全企业范围的意识培训计划，指导所有人员了解分类系统。\n\n5.  六个安全角色是：高级管理层、IT/安全人员、所有者、保管人、操作员/用户和审计员。\n\
  \n6.  安全策略的四个组成部分是：策略、标准、指南和程序。策略是广泛的安全声明。标准是硬件和软件安全合规性的定义。当没有合适的程序时，使用指南。程序是以安全方式执行工作任务的详细分步说明。\n\
  \n### 第 2 章：人员安全和风险管理概念\n\n1.  可能的答案包括：职位描述、最小权限原则、职责分离、工作职责、工作轮换/交叉培训、绩效评估、背景调查、工作行动警告、安全意识培训、岗位培训、离职面谈/解雇、保密协议、竞业禁止协议、雇佣协议、隐私声明和可接受使用策略。\n\
  \n2.  公式如下：\n\n*   `SLE = AV * EF`\n*   `ARO = # / yr`\n*   `ALE = SLE * ARO`\n\
  *   `Cost/benefit = (ALE1 – ALE2) – ACS`\n\n3.  德尔菲技术是一种匿名反馈和响应过程，用于使小组达成匿名共识。其主要目的是引出所有参与者诚实且不受影响的回应。参与者通常聚集在一个会议室中。针对每次反馈请求，每位参与者匿名在纸上写下他们的回应。结果被汇总并呈现给小组进行评估。该过程重复进行，直到达成共识。\n\
  \n4.  风险评估通常涉及一种混合方法，同时使用定量和定性方法。纯定量分析是不可能的；并非分析的所有要素和方面都可以量化，因为有些是定性的、主观的和无形的。由于纯定量风险评估是不可能的，平衡定量分析的结果至关重要。将定量和定性分析结合起来形成最终组织风险评估的方法称为混合评估或混合分析。\n\
  \n### 第 3 章：业务连续性规划\n\n1.  许多联邦、州和地方法律或法规要求企业实施 BCP 规定。在 BCP 团队中包含法律代表有助于确保您遵守法律、法规和合同义务。\n\
  \n2.  “拍脑袋”方法是那些不想投入时间和金钱来妥善制定 BCP 的个人使用的借口。当没有一个周密的计划来指导在压力巨大的紧急情况下的响应时，这可能导致灾难。\n\
  \n3.  定量风险评估涉及使用数字和公式来做决策。定性风险评估包括专业知识而非数字度量，例如情绪、投资者/消费者信心和员工队伍稳定性。\n\n4.  BCP\
  \ 培训计划应包括面向所有员工的计划概述简报，以及针对直接或间接参与人员的具体培训。此外，每个关键 BCP 角色的备份人员也应接受培训。\n\n### 选择题答案解析\n\
  \n4.  A. 虽然高级持续性威胁（APT）可能利用这些攻击中的任何一种，但它们与零日攻击的关联最为紧密。\n\n5.  A. 为了避免被基于特征码的防病毒软件包检测到，多态病毒每次感染系统时都会修改自己的代码。\n\
  \n6.  A. `LastPass` 是一款工具，允许用户为他们使用的每个服务创建唯一、强健的密码，而无需承担记住所有密码的负担。\n\n7.  D. 缓冲区溢出攻击允许攻击者通过写入超出为变量分配的空间来修改系统内存的内容。\n\
  \n8.  D. 除选项 D 外，其他选项都是字典攻击中可能发现的常见单词形式。`mike` 是一个名字，很容易被检测到。`elppa` 只是 `apple`\
  \ 倒拼，`dayorange` 组合了两个字典单词。`Crack` 和其他工具可以轻松识破这些“隐蔽”技术。选项 D 只是一个随机字符串，字典攻击无法发现。\n\
  \n9.  B. 加盐在哈希之前向密码添加随机值，使得构建包含所有可能值的彩虹表变得不切实际。\n\n10.  D. 单引号字符（`'`）用于 SQL 查询，必须在\
  \ Web 表单上仔细处理，以防止 SQL 注入攻击。\n\n11.  B. Web 应用程序开发人员应利用数据库存储过程来限制应用程序执行任意代码的能力。使用存储过程时，SQL\
  \ 语句驻留在数据库服务器上，只能由数据库管理员修改。\n\n12.  B. 端口扫描揭示了机器上运行的服务相关的端口以及可供公众访问的端口。\n\n13. \
  \ A. 跨站脚本攻击仅对包含反射输入的 Web 应用程序有效。\n\n14.  D. 多部分病毒使用两种或更多传播技术（例如，文件感染和引导扇区感染）以最大化其传播范围。\n\
  \n15.  B. 输入验证通过将用户输入限制在预定义范围内来防止跨站脚本攻击。这可以防止攻击者在输入中包含 HTML `<SCRIPT>` 标签。\n\n16.\
  \  A. `Stuxnet` 是一种高度复杂的蠕虫，旨在破坏连接到西门子控制器的核浓缩离心机。\n\n17.  B. 后门是未记录的命令序列，允许了解后门的个人绕过正常的访问限制。\n\
  \n18.  D. Java 沙箱隔离小程序，并允许它们在受保护的环境中运行，限制它们对系统其余部分可能产生的影响。\n\n19.  D. `<SCRIPT>`\
  \ 标签用于指示可执行客户端脚本的开始，并用于反射输入以创建跨站脚本攻击。\n\n20.  A. 具有内部源 IP 地址的数据包不应被允许从外部进入网络，因为它们很可能是伪造的。\n\
  \n\n\n\n\n#### 第 4 章：法律、法规与合规\n\n1.  美国与欧盟之间《隐私盾框架》协议的关键条款如下：\n\n    *   向个人告知数据处理情况\n\
  \    *   提供免费且易于获取的争议解决机制\n    *   与 `Department of Commerce`（商务部）合作\n    *   维护数据完整性和目的限制\n\
  \    *   确保向第三方传输数据的问责制\n    *   保持与执法行动相关的透明度\n    *   确保只要持有数据，承诺就一直有效\n\n2. \
  \ 组织可能会询问关于外包服务提供商的一些常见问题如下：\n\n    *   供应商存储、处理或传输哪些类型的敏感信息？\n    *   有哪些控制措施来保护组织的信息？\n\
  \    *   我们组织的信息如何与其他客户的信息隔离？\n    *   如果依赖加密作为安全控制，使用了哪些加密算法和密钥长度？密钥管理如何处理？\n \
  \   *   供应商执行哪些类型的安全审计，客户对这些审计有何访问权限？\n    *   供应商是否依赖任何其他第三方来存储、处理或传输数据？合同中与安全相关的条款如何延伸至这些第三方？\n\
  \    *   数据存储、处理和传输将在何处进行？如果在客户和/或供应商的本国之外，会有什么影响？\n    *   供应商的事件响应流程是什么？何时会通知客户潜在的安全漏洞？\n\
  \    *   有哪些条款确保客户数据的持续完整性和可用性？\n\n3.  雇主通知员工监控情况的一些常见步骤包括：在雇佣合同中加入条款，声明员工在使用公司设备时不应抱有隐私期望；在公司可接受使用政策和隐私政策中包含类似的书面声明；登录横幅警告所有通信均可能被监控；以及在计算机和电话上贴标签警告监控的存在。\n\
  \n#### 第 5 章：保护资产安全\n\n1.  **个人身份信息 (PII)** 是指可用于识别特定个人的任何信息。它包括可用于区分或追踪个人身份的信息，例如姓名、社会安全号码或国家身份证号码、出生日期和地点、母亲婚前姓氏以及生物识别记录。**受保护健康信息\
  \ (PHI)** 是指可与特定个人关联的任何健康相关信息。PHI 不仅适用于医疗服务提供者。任何提供或补充医疗保险政策的雇主都会收集和处理 PHI。\n\n\
  2.  **固态硬盘 (SSD)** 应当被销毁（例如使用粉碎机）以进行清理。用于硬盘驱动器的传统方法并不可靠。虽然加密驱动器上存储的所有数据无法实现清理，但它确实提供了一层额外的保护。\n\
  \n3.  **假名化** 是用假名替换数据的过程。在此语境下，假名是人工标识符，**通用数据保护条例 (GDPR)** 将其称为假名。GDPR 建议使用假名以减少数据识别个人的可能性。\n\
  \n4.  **范围界定** 是指审查一份基线安全控制清单，并仅选择适用于你试图保护的 IT 系统的那些控制措施。**定制** 是指修改所选基线控制清单，以适应那些具有不同需求的系统。\n\
  \n#### 第 6 章：密码学与对称密钥算法\n\n1.  广泛采用一次性密码本密码系统的主要障碍在于创建和分发该算法所依赖的超长密钥的困难。\n\n2. \
  \ 加密此消息的第一步要求为秘密关键字的字母分配数字列值：\n\n    ```\n    S E C U R E\n    5 2 1 6 4 3\n   \
  \ ```\n\n    接下来，将消息的字母按顺序写在关键字字母的下方：\n\n    ```\n    S E C U R E\n    5 2 1 6 4\
  \ 3\n    I W I L L P\n    A S S T H E\n    C I S S P E\n    X A M A N D\n    B E\
  \ C O M E\n    C E R T I F\n    I E D N E X\n    T M O N T H\n    ```\n\n    最后，发送者通过向下读取每一列来加密消息；读取列的顺序对应于第一步中分配的数字。这会产生以下密文：\n\
  \n    ```\n    I S S M C R D O W S I A E E E M P E E D E F X H L H P N M I E T I\
  \ A C X B C I T L T S A O T N N\n    ```\n\n3.  此消息通过使用以下函数进行解密：\n\n    ```\n  \
  \  P = (C - 3) mod 26\n    C: F R Q J U D W X O D W L R Q V B R X J R W L W\n  \
  \  P: C O N G R A T U L A T I O N S Y O U G O T I T\n    ```\n\n    隐藏的消息是“Congratulations\
  \ You Got It.” 恭喜你，你做到了！\n\n#### 第 7 章：PKI 与密码学应用\n\n1.  Bob 应使用 Alice 的公钥加密消息，然后将加密后的消息传输给\
  \ Alice。\n\n2.  Alice 应使用她的私钥解密消息。\n\n3.  Bob 应使用哈希函数从明文消息生成消息摘要。然后他应使用自己的私钥加密消息摘要以创建数字签名。最后，他应将数字签名附加到消息中并传输给\
  \ Alice。\n\n4.  Alice 应使用 Bob 的公钥解密 Bob 消息中的数字签名。然后她应使用 Bob 创建数字签名时所用的相同哈希算法，从明文消息创建一个消息摘要。最后，她应比较这两个消息摘要。如果它们相同，则签名是真实的。\n\
  \n#### 第 8 章：安全模型、设计与能力原则\n\n1.  安全模型包括状态机、信息流、非干扰、Take-Grant、访问控制矩阵、Bell-LaPadula、Biba、Clark-Wilson、Brewer\
  \ and Nash（又称中墙）、Goguen-Meseguer、Sutherland 和 Graham-Denning。\n\n2.  **可信计算基 (TCB)**\
  \ 的主要组件包括：用于强制执行安全策略的硬件和软件元素（这些元素称为 TCB）、区分并分隔 TCB 组件与非 TCB 组件的安全边界，以及作为安全边界上访问控制设备的参考监视器。\n\
  \n3.  **Bell-LaPadula** 的两条主要规则是：简单安全规则（禁止向上读）和 *星号* 安全规则（禁止向下写）。**Biba** 的两条规则是：简单完整性规则（禁止向下读）和\
  \ *星号* 完整性规则（禁止向上写）。\n\n4.  **开放系统** 是指具有公开 API、允许第三方开发产品与其交互的系统。**封闭系统** 是指专有的、不支持第三方产品的系统。**开源**\
  \ 是一种编码立场，允许他人查看程序的源代码。**闭源** 是一种对立的编码立场，保持源代码机密。\n\n#### 第 9 章：安全漏洞、威胁与对策\n\n\n\
  \n\n### 云服务模型与安全架构\n\n#### 1. 云服务模型\n\n三种标准的基于云的 X-as-a-service 选项是 `platform as\
  \ a service (PaaS)`、`software as a service (SaaS)` 和 `infrastructure as a service\
  \ (IaaS)`。\n\n**PaaS** 是提供计算平台和软件解决方案栈作为虚拟或基于云服务的概念。本质上，这种类型的云解决方案提供了平台的所有方面（即操作系统和完整的解决方案包）。PaaS\
  \ 的主要吸引力在于避免了在本地购买和维护高端硬件和软件。\n\n**SaaS** 是 PaaS 的衍生模式。SaaS 提供按需在线访问特定软件应用程序或套件，无需本地安装。在许多情况下，几乎没有本地硬件和操作系统的限制。SaaS\
  \ 可以作为订阅制、按需付费服务或免费服务实施。\n\n**IaaS** 将 PaaS 模型进一步推进，不仅提供按需操作解决方案，还提供完整的外包选项。这可以包括效用计量计算服务、管理任务自动化、动态扩展、虚拟化服务、策略实施和管理服务，以及托管/过滤的互联网连接。最终，IaaS\
  \ 允许企业通过云系统快速扩展新的软件或基于数据的服务/解决方案，而无需在本地安装大量硬件。\n\n#### 2. 安全模式\n\n四种安全模式分别是：专用模式、系统高模式、分区模式和多级模式。\n\
  \n#### 3. 存储描述特性\n\n用于描述存储的三对方面或特性是：主存 vs. 辅存、易失性 vs. 非易失性、随机访问 vs. 顺序访问。\n\n####\
  \ 4. 分布式架构漏洞\n\n分布式架构中发现的一些漏洞包括：桌面/终端/笔记本电脑上存在敏感数据、用户缺乏安全意识、物理组件被盗风险更大、客户端妥协导致整个网络妥协、因用户安装软件和可移动介质而面临更大的恶意软件风险、客户端上的数据不太可能被纳入备份。\n\
  \n### Chapter 10: Physical Security Requirements（物理安全需求）\n\n#### 1. 围栏防护\n\n围栏是一种出色的周界防护措施，有助于阻止随意闯入。中等安全级别的安装要求围栏高\
  \ 6 到 8 英尺，通常采用旋风网（也称为链式围栏），上表面扭曲或带刺以阻止随意攀爬。更安全的安装通常选择 8 英尺以上的围栏高度，并常在链式网布上方加装多股带刺铁丝或刀片刺绳，以进一步阻止攀爬者。\n\
  \n#### 2. Halon 灭火剂\n\nHalon 在华氏 900 度（约 482 摄氏度）下会降解为有毒气体。此外，它不环保（属于消耗臭氧层物质）。虽然可回收\
  \ Halon 可用，但发达国家于 2003 年停止生产 Halon。Halon 通常被更环保、毒性更低的介质所取代。\n\n#### 3. 水灭火的风险\n\n\
  任何时候使用水来应对火灾、火焰或烟雾，水损都成为严重关切，特别是在使用电气设备的区域释放水时。计算机和其他电气设备不仅可能被水损坏或毁坏，许多形式的存储介质也可能变得损坏或不可用。此外，消防员在寻找热点灭火时，常使用斧头砸开门或切割墙壁以尽快到达。这也可能对附近的设备和/或布线造成物理损坏或毁坏。\n\
  \n### Chapter 11: Secure Network Architecture and Securing Network Components（安全网络架构与网络组件安全）\n\
  \n#### 1. OSI 七层模型\n\n应用层 (7)、表示层 (6)、会话层 (5)、传输层 (4)、网络层 (3)、数据链路层 (2)、物理层 (1)。\n\
  \n#### 2. 布线问题与对策\n\n布线问题及其对策包括：\n- 衰减（使用中继器或不违反距离建议）\n- 使用错误的 CAT 线缆（检查线缆规格是否满足吞吐量要求，宁可谨慎选择）\n\
  - 串扰（使用屏蔽线缆、将线缆放置在单独的管道中，或使用每英寸扭转次数不同的线缆）\n- 线缆断裂（避免在发生移动的位置铺设线缆）\n- 干扰（使用线缆屏蔽、使用每英寸扭转次数更高的线缆，或改用光纤）\n\
  - 窃听（对所有线缆布线保持物理安全或改用光纤）\n\n#### 3. 频谱使用技术\n\n一些频谱使用技术包括：扩频、`Frequency Hopping Spread\
  \ Spectrum (FHSS)`、`Direct Sequence Spread Spectrum (DSSS)` 和 `Orthogonal Frequency-Division\
  \ Multiplexing (OFDM)`。\n\n#### 4. 802.11 无线网络安全加固方法\n\n保护 802.11 无线网络的方法包括：禁用 SSID\
  \ 广播；将 SSID 更改为唯一值；启用 MAC 过滤；考虑使用静态 IP 或带预留的 DHCP；开启提供的最高加密形式（如 `WEP`、`WPA` 或 `WPA2/802.11i`）；将无线视为远程访问并采用\
  \ `802.1X`、`RADIUS` 或 `TACACS`；使用防火墙将无线接入点与 LAN 隔离；使用 IDS 监控所有无线客户端活动；考虑要求无线客户端通过\
  \ VPN 连接以获得 LAN 访问权限。\n\n#### 5. LAN 共享介质访问技术\n\nLAN 共享介质访问技术包括：`CSMA`、`CSMA/CA`（`802.11`\
  \ 和 `AppleTalk` 使用）、`CSMA/CD`（`Ethernet` 使用）、令牌传递（`Token Ring` 和 `FDDI/CDDI` 使用）以及轮询（`SDLC`、`HDLC`\
  \ 和某些大型机系统使用）。\n\n### Chapter 12: Secure Communications and Network Attacks（安全通信与网络攻击）\n\
  \n#### 1. IPsec 模式\n\n`IPsec` 的传输模式用于主机到主机的链接，仅加密载荷，不加密头部。`IPsec` 的隧道模式用于主机到 LAN\
  \ 和 LAN 到 LAN 的链接，加密整个原始载荷和头部，然后添加链路头部。\n\n#### 2. 网络地址转换 (NAT)\n\n网络地址转换 (`NAT`)\
  \ 允许隐藏内部系统的身份，使其不被外部实体知晓。`NAT` 常用于在 `RFC 1918` 私有 IP 地址和租用的公共地址之间进行转换。`NAT` 充当单向防火墙，因为它只允许作为对先前内部查询的响应的入站流量。`NAT`\
  \ 还允许使用少量租用的公共地址为更多内部系统提供互联网连接。\n\n#### 3. 电路交换 vs. 分组交换\n\n**电路交换** 通常与物理连接相关。链路本身被物理建立，通信结束后拆除。电路交换提供已知的固定延迟，支持恒定流量，面向连接，仅对连接丢失敏感而非通信本身，最常用于语音传输。\n\
  \n**分组交换** 通常与逻辑连接相关，因为链路只是可能路径中逻辑定义的路径。在分组交换系统中，每个系统或链路可同时被其他电路使用。分组交换将通信分成段，每个段遍历电路到达目的地。分组交换具有可变延迟，因为每个段可能走唯一路径，通常用于突发流量，物理上非面向连接但常使用虚电路，对数据丢失敏感，可用于任何形式的通信。\n\
  \n#### 4. 电子邮件安全性\n\n电子邮件天生不安全，因为它主要是明文通信媒介，且采用非加密传输协议。这使得电子邮件容易被伪造、垃圾邮件泛滥、邮件洪水攻击、窃听、干扰和劫持。针对这些问题的防御主要包括：实施更强的认证要求，以及使用加密保护传输中的内容。\n\
  \n### Chapter 13: Managing Identity and Authentication（身份与认证管理）\n\n#### 1. 访问控制类型\n\
  \n访问控制类型包括：预防性、检测性、纠正性、威慑性、恢复性、指令性和补偿性访问控制。它们可作为管理控制、逻辑/技术控制和/或物理控制来实施。\n\n\n\n\n\
  #### 2. 识别、认证、授权和审计\n\n识别是指主体声称一种身份，例如使用用户名。认证是指主体提供信息以验证所声称的身份即为该主体的真实身份。例如，用户可以提供与用户名匹配的正确密码。授权是根据主体经过验证的身份，授予其权利和权限的过程。审计通过记录主体的行为来实现，只有当识别和认证过程强健且安全时，审计才是可靠的。\n\
  \n#### 3. 认证因素类型\n\n类型 1 认证因素是**你知道的东西**。类型 2 认证因素是**你拥有的东西**。类型 3 认证因素是**你本身的东西**（生物特征）。\n\
  \n#### 4. 联合身份管理\n\n联合身份管理系统允许将单点登录 (SSO) 扩展到单个组织之外。SSO 允许用户认证一次即可访问多个资源，而无需再次认证。SAML\
  \ 是一种常用语言，用于在组织之间交换联合身份信息。\n\n#### 5. 身份与访问配置生命周期\n\n身份与访问配置生命周期包括配置账户、定期审查和管理账户，以及在账户不再使用时禁用或删除账户。\n\
  \n### 第 14 章：控制和监控访问\n\n#### 1. 访问控制模型\n\n自主访问控制 (DAC) 模型允许对象的所有者、创建者或数据管理员控制和定义访问权限。管理员集中管理非自主访问控制，并可进行影响整个环境的更改。\n\
  \n#### 2. 风险识别\n\n应通过资产评估、威胁建模和漏洞分析来识别资产、威胁和漏洞。\n\n#### 3. 密码攻击方法\n\n暴力破解攻击、字典攻击、嗅探攻击、彩虹表攻击和社会工程学攻击都是用于发现密码的已知方法。\n\
  \n#### 4. 盐值 vs. 胡椒值\n\n数据库中每个密码的**盐值**都是不同的。数据库中每个密码的**胡椒值**都是相同的。密码的盐值与哈希后的密码存储在同一个数据库中。胡椒值存储在数据库外部，例如应用程序代码中或作为服务器的配置设置。\n\
  \n### 第 15 章：安全评估与测试\n\n#### 1. 端口扫描技术\n\nTCP SYN 扫描向每个扫描端口发送一个设置了 SYN 标志的单个数据包。这表示请求建立新连接。如果扫描器收到设置了\
  \ SYN 和 ACK 标志的响应，这表明系统正在进入 TCP 三次握手的第二阶段，且该端口处于开放状态。TCP SYN 扫描也称为“半开放”扫描。TCP 连接扫描在指定端口上与远程系统建立完整连接。当运行扫描的用户没有运行半开放扫描所需的权限时，会使用此扫描类型。\n\
  \n#### 2. Nmap 端口状态值\n\nNmap 返回的三种可能的端口状态值如下：\n\n*   **开放**——远程系统上的端口是开放的，且有应用程序正在该端口上主动接受连接。\n\
  *   **关闭**——远程系统上的端口是可访问的，意味着防火墙允许访问，但没有应用程序在该端口上接受连接。\n*   **被过滤**——由于防火墙干扰了连接尝试，Nmap\
  \ 无法确定端口是开放还是关闭。\n\n#### 3. 软件测试技术\n\n静态软件测试技术（如代码审查）通过分析源代码或编译后的应用程序，在不运行软件的情况下评估其安全性。动态测试在运行时环境中评估软件安全性，对于部署他人编写的应用程序的组织来说，这通常是唯一的选择。\n\
  \n#### 4. 模糊测试类型\n\n变异（哑）模糊测试从软件实际运行的先前输入值中获取数据，并对其进行操作（或变异）以创建模糊输入。它可能会更改内容的字符、在内容末尾追加字符串，或执行其他数据操作技术。\n\
  \n生成式（智能）模糊测试开发数据模型，并基于对程序使用的数据类型的理解创建新的模糊输入。\n\n### 第 16 章：管理安全运营\n\n#### 1. 需知原则\
  \ vs. 最小权限原则\n\n需知原则关注权限和访问信息的能力，而最小权限原则关注特权。特权包括权利和权限。两者都将用户和主体的访问限制在仅为其所需的范围内。遵循这些原则可以预防安全事件并限制其影响范围。\n\
  \n#### 2. 管理敏感信息\n\n管理敏感信息包括根据其分类级别，对其进行适当的标记、处理、存储和销毁。\n\n#### 3. 监控特殊权限\n\n监控特殊权限的**分配**可检测个人何时被授予更高特权（例如被添加到管理员账户）。它可以检测未经授权的实体何时被授予更高特权。监控特殊权限的**使用**可检测实体何时正在使用更高特权，例如创建未经授权的账户、访问或删除日志以及创建自动化任务。这种监控可以检测潜在的恶意内部人员和远程攻击者。\n\
  \n#### 4. 云服务模型\n\n这三种模型分别是软件即服务 (SaaS)、平台即服务 (PaaS) 和基础设施即服务 (IaaS)。云服务提供商 (CSP)\
  \ 在 SaaS 中提供最多的维护和安全服务，PaaS 中较少，IaaS 中最少。虽然 NIST SP 800-144 提供了这些定义，但 CSP 有时会在营销材料中使用自己的术语和定义。\n\
  \n#### 5. 变更管理\n\n变更管理流程通过确保拟议变更在部署前经过审查和测试，有助于防止中断。它们还确保变更有文档记录。\n\n### 第 17 章：预防和响应事件\n\
  \n#### 1. 事件响应步骤\n\nCISSP 安全运营领域中列出的事件响应步骤包括：检测、响应、缓解、报告、恢复、补救和经验教训。\n\n#### 2.\
  \ 入侵检测系统 (IDS)\n\n入侵检测系统可根据其部署位置描述为基于主机或基于网络，根据其检测方法描述为基于知识或基于行为，根据其响应方式描述为被动或主动。\n\
  \n基于主机的 IDS 详细检查单个计算机上的事件，包括文件活动、访问和进程。基于网络的 IDS 通过流量评估检查一般网络事件和异常。\n\n基于知识的 IDS\
  \ 使用已知攻击数据库来检测入侵。基于行为的 IDS 以正常活动的基线为起点，将网络活动与基线进行比较以识别异常活动。\n\n被动响应将记录活动并通常提供通知。主动响应直接响应入侵以阻止或阻断攻击。\n\
  \n#### 3. 审计与审计跟踪\n\n审计是对环境进行有条理的检查或审查，涵盖广泛的活动，以确保符合法规并检测异常、未经授权的事件或彻底的犯罪行为。审计跟踪提供支持此类检查或审查的数据，本质上是使审计以及随后对攻击和不当行为的检测成为可能的关键。\n\
  \n#### 4. 访问审查与审计\n\n组织应定期执行访问审查和审计。这些可以检测组织何时未遵循其自身与账户管理相关的策略和程序。它们可以手动执行，也可以使用某些身份与访问管理\
  \ (IAM) 系统中提供的自动化技术来执行。\n\n### 第 18 章：灾难恢复规划\n\n\n\n\n\n### 业务连续性与灾难恢复\n\n#### 互助协议的三大顾虑\n\
  \n企业在考虑采用互助协议（MAA）时，主要有三大顾虑：\n\n1.  **地理位置与共同威胁**：MAA 的性质通常要求参与企业地理位置相近。然而，这也增加了双方同时遭受同一威胁的风险。\n\
  2.  **危机中的执行困难**：MAA 在危机中难以强制执行。若一家机构受灾而另一家未受影响，未受影响的机构可能在最后一刻退出，使受灾方陷入困境。\n3. \
  \ **保密性顾虑**：法律和业务层面的保密要求，往往阻碍企业将敏感运营数据托付给他人。\n\n#### 灾难恢复测试的五种主要类型\n\n1.  **通读测试**：向灾难恢复人员分发恢复清单供其审阅。\n\
  2.  **结构化演练**：即“桌面演练”，召集灾难恢复团队讨论灾难场景。\n3.  **模拟测试**：更全面，可能影响组织的一个或多个非关键业务单元。\n4.\
  \  **并行测试**：将人员转移至备用站点并在那里开始运营。\n5.  **全面中断测试**：将人员转移至备用站点，并关闭主站点的运营。\n\n#### 备份策略\n\
  \n*   **完全备份**：创建服务器上所有存储数据的副本。\n*   **增量备份**：创建自上次完全备份或增量备份以来修改过的所有文件的副本。\n*  \
  \ **差异备份**：创建自上次完全备份以来修改过的所有文件的副本，不考虑期间可能发生的任何差异或增量备份。\n\n### 第 19 章：调查与道德\n\n####\
  \ 计算机犯罪主要分类\n\n计算机犯罪主要分为：军事/情报攻击、商业攻击、金融攻击、恐怖主义攻击、怨恨攻击和刺激攻击。\n\n#### 攻击动机\n\n* \
  \  **刺激攻击**：由个人寻求成功入侵计算机系统所带来的“快感”所驱动。\n\n#### 访谈与审讯的区别\n\n*   **访谈**：旨在从个人处收集信息以协助调查。\n\
  *   **审讯**：旨在从嫌疑人处收集证据，用于刑事起诉。\n\n#### 证据可采性标准\n\n证据要被采纳，必须具备**可靠性**、**胜任力**和**关联性**（与案件相关）。\n\
  \n### 第 20 章：软件开发安全\n\n#### 数据库关键概念\n\n*   **主键**：唯一标识表中的每一行。例如，员工编号可作为包含员工信息表的主键。\n\
  *   **多实例化**：一种数据库安全技术，允许插入多个共享相同唯一标识信息的行。\n\n#### 代码分析方法\n\n*   **静态分析**：评估代码本身，分析指令序列以发现安全缺陷。\n\
  *   **动态分析**：在实时生产环境中测试代码，搜索运行时缺陷。\n\n#### 软件开发生命周期\n\n*   **单阶段模型**。\n\n### 第 21\
  \ 章：恶意代码与应用攻击\n\n#### 病毒与蠕虫的区别\n\n病毒和蠕虫都会在系统间传播，试图将恶意载荷传递给尽可能多的机器。但两者传播机制不同：\n\n\
  *   **病毒**：需要人为干预（如共享文件、网络资源或电子邮件）才能传播。\n*   **蠕虫**：主动寻找漏洞，凭自身能力在系统间传播，极大地增强了繁殖能力，尤其是在网络互联良好的环境中。\n\
  \n#### 彩虹表构建过程\n\n构建彩虹表的步骤如下：\n\n1.  获取或编制常用密码列表。\n2.  确定密码机制使用的哈希函数。\n3.  计算列表中每个密码的哈希值，并将其与密码一同存储。该操作的结果即为彩虹表。\n\
  \n#### 杀毒软件处理流程\n\n杀毒软件会尝试对受感染文件进行**消毒**，移除病毒的恶意代码。若失败，则会**隔离**文件供人工审查，或**自动删除**以防止进一步感染。\n\
  \n#### 文件完整性监控\n\n数据完整性保障工具（如 `Tripwire`）会计算受保护系统上每个文件的哈希值。若文件感染型病毒袭击系统，会导致受影响文件的哈希值发生变化，从而触发文件完整性警报。\n\
