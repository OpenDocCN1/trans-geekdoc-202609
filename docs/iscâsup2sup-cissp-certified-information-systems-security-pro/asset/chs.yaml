  \     2.  首席信息官\n     3.  首席执行官\n     4.  业务连续性经理\n\n#### 第 4 章：法律、法规与合规\n\n## 本章涵盖的\
  \ CISSP 考试主题包括：\n\n### 领域 1：安全与风险管理\n\n*   1.3 确定合规要求\n    *   1.3.1 合同、法律、行业标准和法规要求\n\
  \    *   1.3.2 隐私要求\n*   1.4 理解在全球背景下与信息安全相关的法律和法规问题\n    *   1.4.1 网络犯罪和数据泄露\n\
  \    *   1.4.2 许可和知识产权要求\n    *   1.4.3 进出口管制\n    *   1.4.4 跨境数据流动\n    *   1.4.5\
  \ 隐私\n\n对于信息技术（`IT`）和网络安全专业人员而言，合规世界是一个法律和法规的丛林。国家、州和地方政府都以拼凑的方式通过了重叠的法律，监管网络安全的不同组成部分。这给安全专业人员带来了极其困惑的局面，他们必须协调多个司法管辖区的法律。对于跨国公司而言，情况变得更加复杂，因为它们还必须驾驭国际法之间的差异。\n\
  \n\n\n\n执法机构近年来大力打击网络犯罪。世界各国的立法机构至少已尝试解决网络犯罪问题。许多执法机构都有全职、受过良好训练的计算机犯罪调查员，他们具备高级安全培训背景。那些没有此类人员的机构，通常也知道在需要这种经验时该向何处求助。\n\
  \n在本章中，我们将介绍处理计算机安全问题的各类法律。我们将探讨围绕计算机犯罪、隐私、知识产权及其他多个相关主题的法律问题。我们还将介绍基本的调查技术，包括寻求执法部门协助的利弊。\n\
  \n### 法律的类别\n\n三大主要法律类别在我们的法律体系中发挥作用。每一类都涵盖各种情况，且违反不同类别法律的处罚差异巨大。在以下章节中，您将了解刑法、民法和行政法如何相互作用，形成复杂的司法体系网络。\n\
  \n#### 刑法\n\n刑法构成了维护治安、保障社会安全的法律体系基石。许多备受瞩目的法庭案件涉及刑法事务；这些是警方和其他执法机构关注的法律。刑法禁止谋杀、袭击、抢劫和纵火等行为。违反刑事法规的处罚范围包括：强制社区服务时数、以罚款形式出现的金钱处罚（大额或小额），以及以监禁形式剥夺公民自由。\n\
  \n许多刑法旨在保护社会免受计算机犯罪侵害。在本章后续章节中，您将了解到某些法律（如《计算机欺诈和滥用法》、《电子通信隐私法》和《身份盗窃和假冒阻遏法》等）如何为严重计算机犯罪提供刑事处罚。精通技术的检察官与关注此事的执法机构联手，利用法院系统对罪犯判处长期监禁，从而对“黑客地下世界”造成严重打击，这些罪行过去常被视为无害的恶作剧。\n\
  \n在美国，各级政府的立法机构通过民选代表制定刑法。在联邦层面，众议院和参议院通常必须以多数票通过刑法案，该案才能成为法律。一旦通过，这些法律即成为联邦法律，适用于联邦政府拥有管辖权的所有案件（主要涉及州际贸易、跨州案件或针对联邦政府本身的犯罪）。如果不适用联邦管辖权，州政府将依据州立法机构通过的类似法律处理案件。\n\
  \n所有联邦和州法律必须遵守规定美国政府体制运作的最高权威——美国宪法。所有法律均接受地区法院的司法审查，并可一路上诉至美国最高法院。如果法院认定某法律违宪，有权将其废除并宣布无效。\n\
  \n请记住，刑法事务严肃重大。如果您以证人、被告或受害者身份卷入刑事机关介入的事务中，强烈建议您寻求熟悉刑事司法系统、特别是计算机犯罪事务的律师协助。在如此复杂的体系中“单打独斗”并不明智。\n\
  \n#### 民法\n\n民法构成了我们法律体系的主体。其旨在提供有序的社会环境，管辖那些不属于犯罪、但需要公正仲裁人在个人和组织间裁决的事务。可依据民法裁决的事务类型包括：合同纠纷、房地产交易、雇佣事务和遗产/遗嘱认证程序。民法还用于构建行政分支履行职责所用的政府框架。这些法律为政府活动提供预算，并规定授予行政分支制定行政法的权力（见下一节）。\n\
  \n民法的颁布方式与刑法相同。它们必须经立法程序通过方能生效，并受相同的宪法参数和司法审查程序约束。在联邦层面，刑法和民法均收录于《美国法典》（USC）中。\n\
  \n民法与刑法的主要区别在于执行方式。通常，执法机关除采取恢复秩序所需的必要行动外，不介入民法事务。在刑事起诉中，政府通过执法调查员和检察官对被指控犯罪的人提起诉讼。在民事事务中，自认为受到损害的人有责任聘请法律顾问，向自认为应对其不满负责的人提起民事诉讼。政府（除非是原告或被告）不在争议中站队，也不为任何一方辩护。政府在民事事务中的唯一角色是提供审理民事案件所需的法官、陪审团和法庭设施，并依法在管理司法系统中发挥行政作用。\n\
  \n与刑法一样，如果您认为需要提起民事诉讼，或有人对您提起民事诉讼，最好寻求法律援助。虽然民法不构成监禁威胁，但败诉方可能面临严重的经济处罚。您只需看看晚间新闻即可找到例子——针对烟草公司、大型企业和富人的数百万美元诉讼每天都在提起。\n\
  \n#### 行政法\n\n政府行政分支赋予众多机构广泛职责，以确保政府职能有效运行。这些机构有责任遵守并执行立法机关颁布的刑法和民法。然而，显而易见，刑法和民法不可能为所有可能的情况规定规则和程序。因此，行政分支机构有一定自由度制定行政法，以政策、程序和法规的形式管控机构日常运作。行政法涵盖的主题范围极广，从联邦机构内部申请办公电话的程序等琐事，到执行国会通过的法律所用的移民政策等重大问题。行政法公布于《联邦法规汇编》，常被称为\
  \ CFR。\n\n尽管行政法无需立法机关法案即可生效，但必须遵守所有现有的民法和刑法。政府机构不得实施直接与立法机关通过的现有法律相抵触的法规。此外，行政法（及政府机构的行为）也必须遵守美国宪法，并接受司法审查。\n\
  \n\n\n### 理解合规要求与程序\n\n要理解合规要求和程序，必须精通法律的复杂性。从行政法到民法再到刑法（在某些国家甚至包括宗教法），驾驭监管环境是一项艰巨的任务。CISSP\
  \ 考试侧重于法律、法规、调查和合规的一般性原则，以及它们如何影响组织的安全工作。然而，寻求专业帮助（即律师）以指导和支持您维护合法且具有法律效力的安全，是您的责任。\n\
  \n#### 法律\n\n在本节中，我们将探讨许多与信息技术相关的法律。由于必要性，本讨论以美国为中心，CISSP 考试涵盖的材料也是如此。我们将简要介绍几部备受瞩目的非美国法律，例如欧盟的《通用数据保护条例》（GDPR）。但是，如果您所在的运营环境涉及外国司法管辖区，您应聘请当地法律顾问为您提供指导。\n\
  \n##### 计算机犯罪\n\n立法者解决的首批计算机安全问题涉及计算机犯罪。早期的计算机犯罪起诉尝试依据传统刑法进行，许多案件被驳回，因为法官认为将传统法律应用于这种现代类型的犯罪有些牵强。立法者通过通过具体法规来定义计算机犯罪，并规定了各种犯罪的具体处罚作为回应。在以下章节中，我们将介绍其中的几部法规。\n\
  \n###### 计算机欺诈与滥用法案\n\n《计算机欺诈与滥用法案》（CFAA）是美国第一部主要的针对网络犯罪的专门立法。国会早先曾将计算机犯罪法作为 1984\
  \ 年《综合犯罪控制法案》（CCCA）的一部分颁布，但 CFAA 经过精心编写，专门涵盖跨越州界的计算机犯罪，以避免侵犯州权和触及敏感的宪法领域。原始 CCCA\
  \ 的主要条款将以下行为定为犯罪：\n\n*   未经授权或超出授权特权访问联邦系统中的机密信息或财务信息\n*   未经授权访问联邦政府专用的计算机\n* \
  \  利用联邦计算机实施欺诈（除非欺诈的唯一目的是获取计算机本身的使用权）\n*   对联邦计算机系统造成超过 1,000 美元的恶意损害\n*   修改计算机中的医疗记录，导致损害或可能损害对个人的检查、诊断、治疗或医疗护理\n\
  *   如果贩运计算机密码影响州际贸易或涉及联邦计算机系统，则构成犯罪\n\n当国会通过 CFAA 时，将损害门槛从 1,000 美元提高到 5,000 美元，但也大幅改变了法规的范围。该法案不再仅涵盖处理敏感信息的联邦计算机，而是扩展到涵盖所有“联邦利益”计算机。这扩大了法案的覆盖范围，包括以下内容：\n\
  \n*   美国政府专用的任何计算机\n*   金融机构专用的任何计算机\n*   政府或金融机构使用的任何计算机，当犯罪行为妨碍政府或机构使用该系统的能力时\n\
  *   用于实施犯罪的任何计算机组合，当它们不都位于同一州时\n\n###### CFAA 修正案\n\n1994 年，国会认识到自 1986 年 CFAA 最后一次修正以来，计算机安全的面貌已发生剧变，因此对该法案进行了多项全面修改。这些变化统称为\
  \ 1994 年《计算机滥用修正案》，包含以下条款：\n\n*   将创建任何可能对计算机系统造成损害的恶意代码定为非法\n*   修改 CFAA，使其涵盖用于州际贸易的任何计算机，而不仅仅是“联邦利益”计算机系统\n\
  *   允许监禁犯罪者，无论其是否真意图造成损害\n*   为计算机犯罪受害者提供法律授权，以寻求民事诉讼获得禁令救济和损害赔偿\n\n自 1994 年最初的\
  \ CFAA 修正案以来，国会又在 1996 年、2001 年、2002 年和 2008 年作为其他网络犯罪立法的一部分通过了额外的修正案。我们将在本章后续内容中讨论这些修正案。\n\
  \n虽然 CFAA 可用于起诉各种计算机犯罪，但安全和隐私社区的许多人批评它是一部过于宽泛的法律。根据某些解释，CFAA 将违反网站服务条款的行为定为犯罪。该法律曾被用于起诉麻省理工学院学生\
  \ Aaron Schwartz，罪名是从麻省理工学院网络可访问的数据库中下载大量学术研究论文。Schwartz 于 2013 年自杀，并激发了一个 CFAA\
  \ 修正案的起草，该修正案旨在将违反网站服务条款的行为从 CFAA 中排除。该法案被称为“Aaron’s Law”，从未提交国会全院表决。\n\n######\
  \ 联邦量刑指南\n\n1991 年发布的《联邦量刑指南》提供了惩罚指南，以帮助联邦法官解释计算机犯罪法律。这三项主要条款对信息安全社区产生了持久影响。\n\n\
  *   该指南将*审慎人规则*形式化，要求高级管理人员对确保尽职调查承担个人责任，即普通审慎的人在同等情况下会行使的注意义务。这项在财政责任领域开发的规则，现在也适用于信息安全。\n\
  *   该指南允许组织和高管通过证明他们在履行信息安全职责时使用了尽职调查，来减轻违规行为的惩罚。\n*   该指南概述了疏忽的三个举证责任。首先，被指控疏忽的人必须负有法律认可的义务。其次，该人必须未能遵守公认标准。最后，疏忽行为与随后的损害之间必须存在因果关系。\n\
  \n###### 1996 年国家信息基础设施保护法案\n\n1996 年，国会通过了另一组针对《计算机欺诈与滥用法案》的修正案，旨在进一步扩大其提供的保护。《国家信息基础设施保护法案》包含以下主要新增覆盖领域：\n\
  \n*   将 CFAA 扩展到涵盖用于国际贸易的计算机系统，除了州际贸易系统\n*   将类似的保护扩展到国家基础设施的其他部分，而不仅仅是计算系统，例如铁路、天然气管道、电网和电信电路\n\
  *   将任何造成关键国家基础设施部分损害的故意或鲁莽行为视为重罪\n\n###### 联邦信息安全管理法案\n\n2002 年通过的《联邦信息安全管理法案》（FISMA）要求联邦机构实施涵盖机构运营的信息安全计划。FISMA\
  \ 还要求政府机构在其安全管理计划中包含承包商的活动。FISMA 废止并取代了两部早期法律：1987 年《计算机安全法案》和 2000 年《政府信息安全改革法案》。\n\
  \n美国国家标准与技术研究院（NIST）负责制定 FISMA 实施指南，概述了有效信息安全计划的以下要素：\n\n\n\n\n####### FISMA 要求\n\
  \n*   定期进行风险评估，包括因未经授权的访问、使用、披露、中断、修改或破坏信息和信息系统而可能导致的危害程度，这些信息和信息系统支持组织的运营和资产\n\
  *   基于风险评估的政策和程序，以具有成本效益的方式将信息安全风险降低到可接受的级别，并确保在组织每个信息系统的整个生命周期中都解决信息安全问题\n*   为网络、设施、信息系统或信息系统组（视情况而定）提供充分信息安全的下级计划\n\
  *   安全意识培训，告知人员（包括承包商和支持组织运营和资产的信息系统的其他用户）与其活动相关的信息安全风险，以及他们在遵守旨在降低这些风险的组织政策和程序方面的责任\n\
  *   定期测试和评估信息安全政策、程序、实践和安全控制的有效性，频率取决于风险，但不得少于每年一次\n*   规划、实施、评估和记录补救措施的流程，以解决组织信息安全政策、程序和实践中的任何缺陷\n\
  *   检测、报告和响应安全事件的程序\n*   确保支持组织运营和资产的信息系统运营连续性的计划和程序\n\nFISMA 给联邦机构和政府承包商带来了沉重的负担，他们必须开发并维护大量文档，以记录其\
  \ FISMA 合规活动。\n\n####### 2014 年联邦网络安全法\n\n2014 年，贝拉克·奥巴马总统签署了一系列法案，使其成为法律，从而使联邦政府应对网络安全问题的方法实现了现代化。\n\
  \n其中第一项是令人困惑地命名为《联邦信息系统现代化法案》（也称为 FISMA）。2014 年 FISMA 通过将联邦网络安全责任集中到国土安全部，修改了 2002\
  \ 年 FISMA 的规则。此项集中化有两个例外：与国防相关的网络安全问题仍由国防部长负责，而与情报相关的问题则由国家情报总监负责。\n\n其次，国会通过了《网络安全强化法案》，赋予\
  \ NIST 协调全国自愿网络安全标准工作的责任。NIST 发布与联邦政府计算机安全相关的 800 系列特别出版物。这些出版物对所有安全从业者都很有用，可在 [`csrc.nist.gov/publications/PubsSPs.html`](http://csrc.nist.gov/publications/PubsSPs.html)\
  \ 免费在线获取。\n\n以下是常用的 NIST 标准：\n\n*   **NIST SP 800-53**：《联邦信息系统和组织的安全和隐私控制》。联邦计算系统必须使用此标准，它也常被用作行业网络安全基准。\n\
  *   **NIST SP 800-171**：《在非联邦信息系统和组织中保护受控非密信息》。政府机构通常将遵守该标准的安全控制（这些控制与 NIST 800-53\
  \ 中的控制非常相似）作为合同要求。联邦承包商通常必须遵守 NIST SP 800-171。\n*   *NIST 网络安全框架* (CSF) 是一套标准，旨在作为基于风险的自愿框架，用于保护信息和系统的安全。\n\
  \n这波新要求中的第三部法律是《国家网络安全保护法》。该法律责成国土安全部建立国家网络安全与通信整合中心。该中心的作用是作为联邦机构与民间组织之间共享网络安全风险、事件、分析和预警的接口。\n\
  \n##### 知识产权\n\n美国在全球经济中的角色正从商品制造商转向服务提供商。这一趋势也体现在世界上许多大型工业化国家中。随着向提供服务的转变，知识产权在许多公司中扮演着日益重要的角色。确实可以说，许多大型跨国公司最有价值的资产，仅仅是我们都熟知的品牌名称。戴尔、宝洁和默克等公司名称能为任何产品带来即时的公信力。出版公司、电影制片人和艺术家依靠其创造性成果谋生。许多产品依赖于秘密配方或生产技术——例如可口可乐的传奇秘方或肯德基的秘制香料配方。\n\
  \n这些无形资产统称为*知识产权*，大量法律旨在保护其所有者的权利。毕竟，如果音乐店只买每位艺术家的一张 CD，然后刻录副本卖给所有顾客，那将是不公平的——这会剥夺艺术家劳动成果的收益。在以下章节中，我们将探讨围绕四大类知识产权（版权、商标、专利和商业秘密）的法律。我们还将讨论这些概念如何专门关联到信息安全专业人员。许多国家以不同方式保护（或未能保护）这些权利，但基本概念在全世界都是通用的。\n\
  \n###### 版权与《数字千年版权法》\n\n*版权*法保证“原创著作”的创作者受到保护，免遭其作品被未经授权的复制。八大类作品符合版权保护资格。\n\n\
  *   文学作品\n*   音乐作品\n*   戏剧作品\n*   哑剧和编舞作品\n*   绘画、图形和雕塑作品\n*   电影和其他视听作品\n*   声音录制\n\
  *   建筑作品\n\n计算机软件申请版权是有先例的——它属于文学作品的范畴。但重要的是要注意，版权法仅保护计算机软件固有的表达——即实际的源代码。它不保护软件背后的思想或过程。关于版权是否可以扩展到涵盖软件包图形用户界面的“外观和感觉”，也存在一些争议。法院对此判决不一；如果您将涉及此类问题，应咨询合格的知识产权律师，以确定当前的立法和判例法状态。\n\
  \n获得版权有一个正式程序，涉及将受保护作品的副本连同适当的注册费一起发送给美国版权局。有关此过程的更多信息，请访问该局网站 [www.copyright.gov](http://www.copyright.gov)。但重要的是要注意，正式注册版权并非版权执法的先决条件。事实上，法律规定作品创作者从创作完成的那一刻起就自动拥有版权。如果您能在法庭上证明您是作品的创作者（例如通过出版），您将受到版权法保护。正式注册仅提供政府确认其在特定日期收到了您的作品这一事实。\n\
  \n\n\n\n\n### 版权、商标和专利\n\n#### 版权\n\n版权所有权始终默认归作品创作者所有。此政策的例外情况是“职务作品”。当作品是在雇员正常工作日期间为雇主创作时，该作品被视为“职务作品”。例如，当公司公关部门的雇员撰写新闻稿时，该新闻稿被视为职务作品。如果书面合同声明作品为职务作品，该作品也可能被视为职务作品。\n\
  \n现行版权法规定了漫长的保护期限。由一位或多位作者创作的作品，受保护至最后一位在世作者去世后 70 年。职务作品和匿名作品受保护期为首次出版之日起 95 年或创作之日起\
  \ 120 年，以较短者为准。\n\n1998 年，国会认识到快速变化的数字环境正在延伸现有版权法的管辖范围。为应对这一挑战，国会颁布了备受争议的《数字千年版权法》（DMCA）。DMCA\
  \ 还旨在使美国版权法符合世界知识产权组织（WIPO）两项条约的条款。\n\nDMCA 的第一项主要条款是禁止试图规避版权持有者在受保护作品上设置的版权保护机制。该条款旨在保护放置在数字媒体（如光盘\
  \ [CD] 和数字多功能光盘 [DVD]）上的防拷贝机制。DMCA 规定，累犯最高可处以 1,000,000 美元罚金和 10 年监禁。非营利机构（如图书馆和学校）可豁免该条款。\n\
  \nDMCA 还限制了互联网服务提供商（ISP）在其线路被罪犯用于侵犯版权法时的法律责任。DMCA 承认 ISP 具有类似于电话公司“公共承运人”的法律地位，不对其用户的“暂时性活动”承担责任。要获得此豁免，服务提供商的活动必须满足以下要求（直接引用自\
  \ 1998 年《数字千年版权法》，美国版权办公室摘要，1998 年 12 月）：\n\n* 传输必须由提供商以外的人发起。\n* 传输、路由、提供连接或复制必须通过自动技术流程进行，服务提供商不得选择材料。\n\
  * 服务提供商不得确定材料的接收者。\n* 任何中间副本通常不得让预期接收者以外的任何人访问，且不得保留超过合理必要的时间。\n* 材料必须在不修改其内容的情况下传输。\n\
  \nDMCA 还豁免了与系统缓存、搜索引擎以及个人用户在网络上存储信息相关的服务提供商活动。然而，在这些情况下，服务提供商在收到侵权通知后必须立即采取行动移除受版权保护的材料。\n\
  \n国会还在 DMCA 中纳入了允许创建计算机软件备份副本的条款，以及任何需要软件复制的维护、测试或常规使用活动。这些条款仅在软件获许可在特定计算机上使用、使用符合许可协议，且任何此类副本在不再用于允许的活动时立即删除的情况下适用。\n\
  \n最后，DMCA 详细规定了版权法原则在通过互联网流式传输音频和/或视频内容中的应用。DMCA 规定，这些用途应被视为“合格非订阅传输”。\n\n#### 商标\n\
  \n版权法用于保护创意作品；`商标` 也受到保护，商标是用于识别公司及其产品或服务的文字、标语和徽标。例如，企业可能为其销售手册申请版权，以确保竞争对手无法复制其销售材料。同一企业可能还会为其公司名称以及其向客户提供的特定产品和服务名称寻求商标保护。\n\
  \n商标保护的主要目的是在保护个人和组织知识产权的同时，避免市场上的混淆。与版权保护一样，商标无需正式注册即可获得法律保护。如果您在公开活动中使用商标，您将自动受相关商标法保护，并可使用\
  \ ™ 符号表明您意图将文字或标语作为商标保护。如果您希望获得商标的官方认可，可以向美国专利商标局（USPTO）注册。此过程通常需要律师进行尽职调查，全面检索可能妨碍您注册的现有商标。整个注册过程从开始到结束可能需要一年多时间。一旦您收到\
  \ USPTO 颁发的注册证书，即可使用 ® 符号标注您的商标为注册商标。\n\n商标注册的一大优势是，您可以注册打算使用但尚未实际使用的商标。此类申请称为 `意向使用`\
  \ 申请，自申请之日起即享有商标保护，前提是您在一定期限内实际在商业中使用该商标。如果您选择不向专利商标局（PTO）注册商标，您的保护仅从您首次使用商标时开始。\n\
  \n在美国，商标申请的受理取决于以下两项主要要求：\n\n* 商标不得与另一商标混淆性相似——您应在律师的尽职调查检索期间确定这一点。将有一个公开异议期，在此期间其他公司可对您的商标申请提出异议。\n\
  * 商标不应描述您将提供的商品和服务。例如，“Mike's Software Company”不是一个好的商标候选，因为它描述了公司生产的产品。如果 USPTO\
  \ 认为商标具有描述性，可能会驳回申请。\n\n在美国，商标授予初始期限为 10 年，并可无限次连续续展，每次 10 年。\n\n#### 专利\n\n`专利`\
  \ 保护发明人的知识产权。它们提供 20 年的期限，在此期间发明人被授予使用发明的专有权（无论是直接使用还是通过许可协议）。专利专有期结束后，发明进入公共领域，任何人均可使用。\n\
  \n专利有三项主要要求。\n\n* 发明必须是新的。只有原创构思才能申请专利。\n* 发明必须是有用的。它必须实际可行并能完成某种任务。\n* 发明必须非显而易见。例如，您无法为“使用饮水杯收集雨水”这一想法申请专利。这是一个显而易见的解决方案。但是，您可能可以为一种特别设计的杯子申请专利，该杯子在最小化蒸发的同时优化收集雨水的量。\n\
  \n\n\n\n在技术领域，专利长期以来一直被用于保护硬件设备和制造工艺。在这些领域，有大量判例支持发明人。近期也颁发了涵盖软件程序和类似机制的专利，但这些专利变得颇具争议，因为技术界许多人认为它们过于宽泛。这些宽泛专利的授予催生了一类仅作为专利持有公司存在的企业，它们通过对被认为侵犯其专利组合中专利的公司提起法律诉讼来获取收入。在技术界，这些公司被称为“专利流氓”（patent\
  \ trolls），这是一个贬义称呼。\n\n##### 商业秘密\n\n许多公司拥有对其业务至关重要的知识产权，一旦向竞争对手和/或公众披露将造成重大损害——换句话说，即**商业秘密**。我们之前提到过流行文化中此类信息的两个例子——可口可乐的秘密配方和肯德基的“秘制香料配方”。其他例子不胜枚举；制造公司可能希望对只有少数核心员工完全掌握的某项制造工艺保密，或者统计分析公司可能希望保护为内部使用开发的高级模型。\n\
  \n前文讨论的两种知识产权工具——版权和专利——可用于保护此类信息，但有两大缺点：\n\n*   申请版权或专利要求公开披露作品或发明的细节。这会自动消除您财产的“秘密”性质，并可能通过消除产品周围的神秘感，或允许不择手段的竞争对手违反国际知识产权法复制您的财产，从而损害贵公司利益。\n\
  *   版权和专利均仅提供有限期限的保护。一旦法律保护期满，其他公司即可随意使用您的作品（而且他们拥有您在申请过程中公开披露的所有细节！）。\n\n实际上，针对商业秘密有一套官方流程。基于其性质，您无需向任何人注册；您只需自行保管。为维持商业秘密地位，您必须在组织内实施适当的控制措施，确保只有知悉范围内的授权人员才能接触这些秘密。您还必须确保所有拥有此类访问权限的人员均受保密协议（NDA）约束，该协议禁止其与他人共享信息，并规定了违约惩罚。请咨询律师，确保协议期限为法律允许的最长期限。此外，您必须采取措施证明您重视并保护自己的知识产权。未能做到这一点可能导致商业秘密保护的丧失。\n\
  \n商业秘密保护是保护计算机软件的最佳方式之一。正如上一节所述，专利法无法为计算机软件产品提供充分保护。版权法仅保护源代码的实际文本，并不禁止他人以不同形式重写您的代码并实现相同目标。如果您将源代码视为商业秘密，它首先就能避免落入竞争对手手中。微软等大型软件开发公司即采用此技术保护其核心知识产权库。\n\
  \n##### 许可\n\n安全专业人员还应熟悉软件许可协议相关的法律问题。目前常用的许可协议主要有四种类型。\n\n*   **合同许可协议** 采用软件供应商与客户之间的书面合同，明确双方的责任。此类协议常见于高价和/或高度专业化的软件包。\n\
  *   **收缩包装许可协议** 印在软件包装盒外部。它们通常包含一条款，声明您仅凭撕开包装盒上的收缩膜密封即视为确认同意合同条款。\n*   **点击通过许可协议**\
  \ 正比收缩包装协议更普遍。在此类协议中，合同条款印在软件盒上或包含在软件文档中。安装过程中，您必须点击按钮，表明已阅读协议条款并同意遵守。这增加了主动同意的环节，确保个人在安装前知晓协议的存在。\n\
  *   **云服务许可协议** 将点击通过协议推向极致。大多数云服务不需要任何形式的书面协议，只是在屏幕上闪现法律条款供审阅。某些情况下，它们可能仅提供法律条款链接和一个复选框，供用户确认已阅读并同意条款。大多数用户因急于使用新服务，直接点击通过协议而不阅读，可能无意中将整个组织绑定到苛刻的条款和条件中。\n\
  \n##### 进口/出口\n\n联邦政府意识到，驱动互联网和电子商务的那些计算机和加密技术，在军事力量手中也可能成为极其强大的工具。基于此原因，冷战期间，政府制定了一套复杂的法规，管控敏感软硬件产品向其他国家的出口。法规涵盖新技术、知识产权和个人身份信息的跨境数据流动管理。\n\
  \n直到最近，将高性能计算机出口到美国境外仍属困难，除少数盟国外。对加密软件出口的管控甚至更为严厉，几乎不可能将任何加密技术出口到国外。联邦政策的近期变更放宽了这些限制，并允许更开放的贸易。\n\
  \n两套管辖进出口的联邦法规引起网络安全专业人员的特别关注。\n\n*   **国际武器贸易条例（ITAR）** 管控专门指定为军事和国防物项的出口，包括与这些物项相关的技术信息。ITAR\
  \ 涵盖的物项列于《美国军火清单》（USML）中，维护于 `22 CFR 121`。\n*   **出口管理条例（EAR）** 涵盖范围更广的物项，这些物项设计用于商业用途但可能具有军事应用。EAR\
  \ 涵盖的物项列于《商业管制清单》（CCL）中，由美国商务部维护。值得注意的是，EAR 包含一个完整的类别，涵盖信息安全产品。\n\n###### 计算机出口管制\n\
  \n目前，美国公司可将高性能计算系统出口到几乎任何国家，无需事先获得政府批准。针对被商务部工业与安全局（BIS）指定为关注国家的国家，存在例外情况，理由是它们构成核扩散威胁、被列为恐怖主义支持国家或基于其他顾虑。这些国家包括古巴、伊朗、朝鲜、苏丹和叙利亚。\n\
  \n###### 加密出口管制\n\n\n\n\n美国商务部工业与安全局制定了关于加密产品出口美国境外的法规。根据以往的法规，即使是相对低级的加密技术也几乎不可能出口到美国境外。这使得美国软件制造商相对于不受类似法规约束的外国公司处于极大的竞争劣势。在软件行业长期的游说活动之后，总统指示商务部修订其法规，以促进美国安全软件产业的发展。\n\
  \n现行法规现在指定了零售和大众市场安全软件的类别。新规则允许公司提交这些产品供商务部审查，但审查时间不得超过 30 天。成功完成审查后，公司可以自由出口这些产品。\n\
  \n#### 隐私\n\n多年来，隐私权一直是美国备受争议的问题。争议的主要根源在于宪法《权利法案》并未明确规定隐私权。然而，这项权利已得到众多法院的支持，并由美国公民自由联盟（ACLU）等组织积极维护。\n\
  \n欧洲人长期以来也非常关注他们的隐私。事实上，瑞士等国家因其保守财务秘密的能力而享誉世界。本章稍后我们将探讨欧盟数据隐私法如何影响公司和互联网用户。\n\n\
  ###### 美国隐私法\n\n尽管宪法未明确保障隐私权，但大量联邦法律（许多是在近年颁布的）旨在保护政府掌握的关于公民的私人信息，以及金融、教育和医疗机构等私营部门关键领域的隐私。在以下章节中，我们将探讨其中的一些联邦法律。\n\
  \n**第四修正案** 隐私权的基础在于美国宪法第四修正案。其内容如下：\n\n> 公民的人身、住宅、文件和财产不受无理搜查和扣押的权利，不得侵犯。除依据合理理由，以宣誓或代誓宣言作保证，并具体说明搜查地点和扣押的人或物，不得发出搜查和扣押状。\n\
  \n该修正案的直接解释禁止政府特工在没有搜查令和合理理由的情况下搜查私人财产。法院已将对第四修正案的解释扩大，以包括针对窃听和其他侵犯隐私行为的保护。\n\n\
  **1974 年隐私法** 1974 年《隐私法》或许是限制联邦政府处理个人公民私人信息方式的最重要隐私立法。它严格限制联邦政府机构在未经当事人事先书面同意的情况下，向其他个人或机构披露私人信息。它确实为人口普查、执法、国家档案、健康与安全以及法院命令等情况提供了例外规定。\n\
  \n《隐私法》要求机构仅保存开展业务所必需的记录，并在不再需要用于合法政府职能时销毁这些记录。它为个人访问政府保存的关于他们的记录、并要求修正不正确的记录提供了正式程序。\n\
  \n**1986 年电子通信隐私法** 《电子通信隐私法》（ECPA）将侵犯个人电子隐私定为犯罪。该法案扩大了原先仅涵盖通过物理线路传输的通信的《联邦窃听法》，使其适用于任何非法拦截电子通信或故意未经授权访问电子存储数据的行为。它禁止拦截或披露电子通信，并界定了合法披露的情形。它保护电子邮件和语音邮件通信免受监控，并防止这些服务的提供者未经授权披露其内容。\n\
  \nECPA 最引人注目的条款之一是将监控移动电话通话定为非法。事实上，此类监控可处以高达 `$500` 美元的罚款和长达五年的监禁。\n\n**1994 年执法协助通信法\
  \ (CALEA)** 1994 年《执法协助通信法》（CALEA）修订了 1986 年《电子通信隐私法》。CALEA 要求所有通信运营商在持有适当法院命令的情况下，使执法部门能够实施窃听，无论使用何种技术。\n\
  \n**1996 年经济间谍法** 1996 年《经济间谍法》将财产的定义扩展至包括专有经济信息，从而使该信息的窃取可被视为工业或商业间谍活动。这改变了盗窃的法律定义，使其不再受物理限制约束。\n\
  \n**1996 年健康保险流通与责任法案** 1996 年，国会通过了《健康保险流通与责任法案》（HIPAA），对管辖健康保险和健康维护组织（HMO）的法律进行了多项修改。HIPAA\
  \ 的条款中包括隐私和安全法规，要求医院、医生、保险公司以及处理或存储个人私人医疗信息的其他组织采取严格的安全措施。\n\nHIPAA 还明确界定了作为医疗记录主体的个人的权利，并要求维护此类记录的组织以书面形式披露这些权利。\n\
  \n**2009 年健康信息技术经济与临床健康法案** 2009 年，国会通过《健康信息技术经济与临床健康法案》（HITECH）修订了 HIPAA。该法律更新了\
  \ HIPAA 的许多隐私和安全要求，并于 2013 年通过 HIPAA 综合规则实施。\n\n新法规强制要求的一项变更是法律对待业务关联方的方式，业务关联方是代表\
  \ HIPAA 覆盖实体处理受保护健康信息（PHI）的组织。覆盖实体与业务关联方之间的任何关系都必须由一份称为业务关联协议（BAA）的书面合同管辖。根据新规定，业务关联方直接受\
  \ HIPAA 约束，并以与覆盖实体相同的方式接受 HIPAA 执法行动。\n\nHITECH 还引入了新的数据泄露通知要求。根据 HITECH 违规通知规则，遭遇数据泄露的\
  \ HIPAA 覆盖实体必须通知受影响的个人，且当泄露影响超过 500 人时，还必须通知卫生与公众服务部部长和媒体。\n\n**1998 年儿童在线隐私保护法**\
  \ 2000 年 4 月，《儿童在线隐私保护法》（COPPA）的条款在美国正式生效。COPPA 向面向儿童或明知收集儿童信息的网站提出了一系列要求。\n\n*\
  \   网站必须有隐私声明，清楚说明其收集的信息类型及用途，包括是否向第三方披露任何信息。隐私声明还必须包含网站运营者的联系信息。\n*   必须给父母提供机会查看从其子女处收集的任何信息，并将其从网站记录中永久删除。\n\
  \n\n\n\n\n### 家长同意要求\n\n父母必须在收集 13 岁以下儿童信息之前，对该收集行为给予可验证的同意。法律中的例外条款允许网站仅为获取此类家长同意的目的而收集最少量的信息。\n\
  \n### 1999 年《格雷姆-里奇-比利雷法案》\n\n直到 1999 年《格雷姆-里奇-比利雷法案》（GLBA）颁布实施前，金融机构之间存在严格的政府监管壁垒。银行、保险公司和信贷提供机构在可提供的服务以及彼此间可共享的信息方面受到严格限制。GLBA\
  \ 在一定程度上放宽了关于各机构可提供服务的法规。国会在通过该法时意识到，这种增加的自由度可能产生深远的隐私影响。基于此顾虑，法案对甚至同一公司子公司之间可交换的信息类型施加了诸多限制，并要求金融机构在\
  \ 2001 年 7 月 1 日前向所有客户提供书面隐私政策。\n\n### 2001 年《美国爱国者法案》\n\n国会通过 2001 年《团结和加强美国通过提供拦截和阻碍恐怖主义所需适当工具法案》（USA\
  \ PATRIOT Act），直接回应 2001 年 9 月 11 日在纽约市和华盛顿特区发生的恐怖袭击。《爱国者法案》极大地扩展了执法机构和情报机构在多个领域的权力，包括监控电子通信。\n\
  \n《爱国者法案》带来的主要变化之一，在于政府机构获取窃听授权的方式。此前，警方只有在证明某条线路被监控对象使用后，才能一次获得一条线路的授权。《爱国者法案》的条款允许当局为某人获得一份全面授权，然后依据该单一授权监控该人发送或接收的所有通信。\n\
  \n另一项重大变化在于政府与互联网服务提供商（ISP）的打交道方式。根据《爱国者法案》条款，ISP 可自愿向政府提供大量信息。《爱国者法案》还允许政府通过传票（而非窃听令）获取用户活动的详细信息。\n\
  \n最后，《美国爱国者法案》修订了《计算机欺诈和滥用法案》（又一组修正案！），为犯罪行为规定了更严厉的处罚。《爱国者法案》规定最长可判处 20 年监禁，并再次扩大了\
  \ CFAA 的适用范围。\n\n《爱国者法案》拥有复杂的立法历史。由于国会未能通过续签法案，《爱国者法案》的许多关键条款于 2015 年失效。然而，国会后来于\
  \ 2015 年 6 月通过了《美国自由法案》，恢复了《爱国者法案》的关键条款，这些条款将持续有效至 2019 年 12 月，除非国会再次续签。\n\n###\
  \ 《家庭教育权利和隐私法案》\n\n《家庭教育权利和隐私法案》（FERPA）是另一项专门的隐私法案，影响接受联邦政府任何形式资助的教育机构（绝大多数学校）。它赋予年满\
  \ 18 周岁的学生及未成年学生家长特定的隐私权利。FERPA 的具体保护措施包括：\n\n*   家长/学生有权查阅机构保存的该学生的任何教育记录。\n* \
  \  家长/学生有权要求更正他们认为有误的记录，并有权在记录中加入声明以反驳任何未获更正的内容。\n*   学校未经书面同意不得发布学生记录中的个人信息，特定情形除外。\n\
  \n### 《身份盗窃和假冒威慑法案》\n\n1998 年，总统签署《身份盗窃和假冒威慑法案》使其成为法律。在过去，身份盗窃的唯一合法受害者是被欺诈的债权人。该法案将身份盗窃定性为针对被盗用身份之人的犯罪，并对被判定违反该法律的任何人规定了严厉的刑事处罚（最长\
  \ 15 年监禁和/或 25 万美元罚款）。\n\n### 欧盟隐私法\n\n1995 年 10 月 24 日，欧洲联盟（EU）议会通过了一项全面指令，规定了必须采取的隐私措施，以保护信息系统处理的个人数据。该指令于三年后的\
  \ 1998 年 10 月生效。该指令要求所有个人数据处理必须满足以下标准之一：\n\n*   同意\n*   合同\n*   法律义务\n*   数据主体的重大利益\n\
  *   数据持有者利益与数据主体利益之间的平衡\n\n该指令还概述了数据被持有和/或处理的相关个人的关键权利：\n\n*   访问数据的权利\n*   知晓数据来源的权利\n\
  *   更正不准确数据的权利\n*   在某些情况下拒绝同意处理数据的权利\n*   权利受侵犯时提起法律诉讼的权利\n\n即使是总部设在欧洲以外的组织，也必须考虑这些规则的适用性，这是由于跨境数据流动要求所致。在涉及欧盟公民个人信息离开欧盟的情况下，数据发送方必须确保其持续受到保护。在欧洲开展业务的美国公司可根据欧盟与美国之间的“隐私盾”协议获得保护，该协议允许商务部和联邦贸易委员会（FTC）认证合规企业，并为其提供“安全港”以免受起诉。\n\
  \n要获得“隐私盾”保护，在欧洲开展业务的美国公司必须满足以下七项个人信息处理要求：\n\n#### 告知个人数据处理情况\n\n公司必须在其隐私政策中包含对“隐私盾”原则的承诺，使其在美国法律下具有强制执行力。它们还必须告知个人其在“隐私盾”框架下的权利。\n\
  \n#### 提供免费且可及的争议解决机制\n\n参与“隐私盾”的公司必须在 45 天内回应消费者的任何投诉，并同意包含具有约束力的仲裁在内的上诉程序。\n\n\
  #### 与商务部合作\n\n受协议约束的公司必须及时回应美国商务部发出的与其参与“隐私盾”相关的任何信息请求。\n\n#### 维护数据完整性和目的限制\n\n\
  参与“隐私盾”的公司只能收集和保留与其声明的收集目的相关的个人信息。\n\n#### 确保向第三方传输数据的问责制\n\n“隐私盾”参与者在向第三方传输信息前必须遵循严格要求。这些要求旨在确保传输是为了有限且特定的目的，且接收方将充分保护信息隐私。\n\
  \n#### 执法行动相关的透明度\n\n如果“隐私盾”参与者因未遵守项目要求而收到执法行动或法院命令，其必须公开提交给 FTC 的任何合规或评估报告。\n\n\
  #### 确保承诺在数据持有期间持续履行\n\n退出“隐私盾”协议的组织必须在其保留根据协议收集的信息期间，继续每年认证其合规性。\n\n### 欧盟通用数据保护条例\n\
  \n\n\n\n\n### 欧盟通用数据保护条例 (GDPR)\n\n欧盟于 2016 年通过了一项涵盖个人信息保护的新的综合性法律。通用数据保护条例 (GDPR)\
  \ 计划于 2018 年 5 月 25 日生效，并将在该日期取代旧的数据保护指令。该法律的主要目的是提供一部单一的、协调一致的法律，涵盖整个欧盟范围内的数据。\n\
  \nGDPR 与数据保护指令的一个主要区别在于监管范围的扩大。新法律适用于从欧盟居民收集数据或代表收集者处理该信息的所有组织。重要的是，即使组织**不在欧盟设立**，如果它们收集关于欧盟居民的信息，该法律也适用。取决于法院如何解释这一点，由于其广泛的范围，它可能产生成为国际法的效力。欧盟在全球范围内执行该法律的能力仍是一个悬而未决的问题。\n\
  \nGDPR 的一些关键条款包括：\n\n*   数据泄露通知要求，强制公司在 24 小时内向当局通报严重的数据泄露\n*   在每个欧盟成员国设立集中的数据保护机构\n\
  *   规定个人将有权访问自己的数据\n*   数据可移植性条款，将方便个人根据要求在服务提供商之间传输个人信息\n*   “被遗忘权”，允许人们要求公司在其信息不再需要时删除这些信息\n\
  \n### 合规\n\n在过去十年中，管辖信息安全的监管环境变得日益复杂。组织可能发现自己受制于各种各样的法律（其中许多在本章前面已概述）以及监管机构施加的法规或合同义务。\n\
  \n应对组织面临的众多重叠且有时相互矛盾的合规要求，需要周密的计划。许多组织雇佣全职 IT 合规人员，负责跟踪监管环境、监控控制措施以确保持续合规、促进合规审计，并履行组织的合规报告义务。\n\
  \n组织可能会接受合规审计，审计方可能是其标准的内部和外部审计师，也可能是监管机构或其代理人。例如，组织的财务审计师可能会进行 IT 控制审计，旨在确保组织财务系统的信息安全控制足以保证遵守《萨班斯-奥克斯利法案》(SOX)。某些法规（如\
  \ `PCI DSS`）可能要求组织聘请经批准的独立审计师来验证控制措施，并直接向监管机构提供报告。\n\n除了正式审计外，组织通常还必须向许多内部和外部利益相关者报告监管合规情况。例如，组织的董事会（或更常见的是该董事会的审计委员会）可能要求定期报告合规义务和状态。同样，`PCI\
  \ DSS` 要求那些不被强制进行正式第三方审计的组织完成并提交一份自我评估报告，概述其合规状态。\n\n### 合同与采购\n\n云服务和其他外部供应商的使用增加，用于存储、处理和传输敏感信息，这促使组织将重点放在其合同和采购流程中实施安全审查和控制。安全专业人员应对供应商实施的安全控制进行审查，既包括初始供应商选择和评估过程，也包括作为持续供应商治理审查的一部分。\n\
  \n以下是供应商治理审查期间需要涵盖的一些问题：\n\n*   供应商存储、处理或传输哪些类型的敏感信息？\n*   有哪些控制措施来保护组织的信息？\n* \
  \  我们组织的信息如何与其他客户的信息隔离？\n*   如果依赖加密作为安全控制，使用了哪些加密算法和密钥长度？密钥管理如何处理？\n*   供应商执行哪些类型的安全审计，客户对这些审计有何访问权限？\n\
  *   供应商是否依赖任何其他第三方来存储、处理或传输数据？合同中与安全相关的条款如何扩展到这些第三方？\n*   数据存储、处理和传输将在何处进行？如果在客户和/或供应商的本国之外，这会有什么影响？\n\
  *   供应商的事件响应流程是什么？何时会通知客户潜在的安全漏洞？\n*   有哪些规定来确保客户数据的持续完整性和可用性？\n\n这只是您可能关心的一些问题的简要列表。请根据您组织的具体关注点、供应商提供的服务类型以及将与其共享的信息，定制您的安全审查范围。\n\
  \n### 总结\n\n计算机安全必然需要法律界的高度参与。在本章中，您了解了管辖安全问题的法律，如计算机犯罪、知识产权、数据隐私和软件许可。\n\n影响信息安全专业人员的法律主要有三大类。刑法规定了严重违背公众信任行为的规则和制裁。民法为我们开展业务提供了框架。政府机构利用行政法颁布解释现有法律的日常法规。\n\
  \n管辖信息安全活动的法律多种多样，涵盖所有三大类。有些（如《电子通信隐私法》和《数字千年版权法》）是刑法，违反者可能面临刑事罚款和/或监禁。其他（如商标法和专利法）是民法，管辖商业交易。最后，许多政府机构颁布行政法（如\
  \ `HIPAA` 安全规则），影响特定行业和数据类型。\n\n信息安全专业人员应了解其行业和业务活动特有的合规要求。跟踪这些要求是一项复杂的任务，应指派给一名或多名合规专家，由他们监控法律的变化、商业环境的变化以及这两个领域的交集。\n\
  \n仅仅担心自己的安全和合规也是不够的。随着云计算的广泛采用，许多组织现在与充当服务提供商的供应商共享敏感和个人数据。安全专业人员必须采取措施，确保供应商像组织本身一样细心地对待数据，并满足任何适用的合规要求。\n\
  \n### 考试要点\n\n**理解刑法、民法和行政法之间的区别。** 刑法保护社会免受违反我们所信奉的基本原则的行为的侵害。刑法违规行为由联邦和州政府起诉。民法为人与组织之间的商业交易提供框架。民法违规行为提交法院，由双方当事人辩论。行政法被政府机构用于有效地开展其日常业务。\n\
  \n\n\n\n\n### 考试目标\n\n**能够解释旨在保护社会免受计算机犯罪侵害的主要法律的基本条款。**\n\n`Computer Fraud and\
  \ Abuse Act`（计算机欺诈和滥用法案，经修订）保护政府使用的计算机或用于州际商业的计算机免受各种滥用行为的侵害。`Electronic Communications\
  \ Privacy Act`（ECPA，电子通信隐私法案）将侵犯个人电子隐私定为犯罪。\n\n**了解版权、商标、专利和商业秘密之间的区别。**\n\n版权保护原创著作，如书籍、文章、诗歌和歌曲。商标是用于识别公司、产品或服务的名称、标语和徽标。专利为新发明的创造者提供保护。商业秘密法保护公司的运营秘密。\n\
  \n**能够解释 1998 年《数字千年版权法》的基本条款。**\n\n`Digital Millennium Copyright Act`（数字千年版权法）禁止规避数字媒体中设置的复制保护机制，并限制互联网服务提供商因其用户活动而承担的责任。\n\
  \n**了解 1996 年《经济间谍法》的基本条款。**\n\n`Economic Espionage Act`（经济间谍法）对被判定犯有盗窃商业秘密罪的个人规定了处罚。如果个人知道该信息将使外国政府受益，则适用更严厉的处罚。\n\
  \n**了解各类软件许可协议。**\n\n合同许可协议是软件供应商与用户之间的书面协议。收缩包装协议印在软件包装上，用户打开包装即生效。点击包装协议包含在包装内，但要求用户在软件安装过程中接受条款。\n\
  \n**了解发生数据泄露的组织必须遵守的通知要求。**\n\n加利福尼亚州的 `SB 1386` 实施了首个全州范围的要求，强制通知个人其个人信息遭到泄露。除三个州外，所有州最终都跟进颁布了类似法律。目前，联邦法律仅要求在\
  \ `HIPAA` 覆盖实体泄露受保护的健康信息时通知个人。\n\n**了解美国和欧盟管辖个人信息隐私的主要法律。**\n\n美国有多部隐私法律，影响政府对信息的使用以及特定行业（如处理敏感信息的金融服务公司和医疗保健组织）对信息的使用。欧盟拥有更全面的\
  \ `General Data Protection Regulation`（通用数据保护条例），管辖个人信息的使用和交换。\n\n**解释完善的合规计划的重要性。**\n\
  \n大多数组织都受到与信息安全相关的各种法律和监管要求的约束。建立合规计划可确保您满足并持续遵守这些往往重叠的要求。\n\n**了解如何将安全纳入采购和供应商治理流程。**\n\
  \n许多组织扩大了云服务的使用，这要求在供应商选择过程和持续的供应商治理中，对信息安全控制进行审查时给予额外关注。\n\n### 书面实验\n\n1.  美国和欧盟之间的\
  \ `Privacy Shield Framework`（隐私盾框架）协议的关键条款是什么？\n\n2.  组织在考虑外包信息存储、处理或传输时，应询问哪些常见问题？\n\
