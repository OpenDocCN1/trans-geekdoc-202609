  4.  语音钓鱼\n\n> **第 19 和 20 题场景：**\n> 一个组织最近遭受了一系列损害其声誉的安全漏洞。几次成功的攻击导致通过公司一台 Web 服务器可访问的客户数据库文件被泄露。此外，一名员工拥有从以前工作任务中遗留的机密数据访问权限。该员工复制了数据并将其出售给竞争对手。该组织聘请了一名安全顾问来帮助他们降低未来遭受攻击的风险。\n\
  \n### 19. 顾问将使用什么来识别潜在攻击者？\n\n1.  资产估值\n2.  **威胁建模**\n3.  漏洞分析\n4.  访问审查与审计\n\n\
  ### 20. 管理层希望确保顾问在研究过程中优先级正确。以下哪项应提供给顾问以满足这一需求？\n\n1.  **资产估值**\n2.  威胁建模结果\n3.\
  \  漏洞分析报告\n4.  审计追踪\n\n\n\n\n\n*   控制项配置错误导致安全受威胁的可能性\n*   系统遭受攻击的风险\n*   控制项配置的变更率\n\
  *   可能影响控制项性能的技术环境其他变更\n*   执行控制项测试的难度和所需时间\n*   测试对正常业务运营的影响\n\n在评估上述各因素后，安全团队设计并验证一套全面的评估和测试策略。该策略可能包括频繁的自动化测试，辅以不频繁的手动测试。例如，信用卡处理系统可能会每晚进行自动化漏洞扫描，当扫描检测到新漏洞时立即向管理员发出警报。自动化扫描一旦配置完成，无需管理员投入工作，因此很容易非常频繁地运行。安全团队可能希望用外部顾问执行的手动渗透测试来补充这些自动化扫描，但这需要支付高额费用。为将成本和对业务的干扰降至最低，此类测试可能每年进行一次。\n\
  \n当然，仅执行安全测试是远远不够的。安全专业人员还必须仔细审查这些测试的结果，以确保每项测试都成功完成。在某些情况下，这些审查包括手动阅读测试输出并验证测试是否成功完成。一些测试需要人工解读，必须由受过培训的分析师执行。\n\
  \n其他审查可能是自动化的，由安全测试工具执行，这些工具验证测试的成功完成、记录结果，除非有重大发现否则保持静默。当系统检测到需要管理员关注的问题时，根据警报的严重程度和管理员的偏好，可能会触发警报、发送电子邮件或短信，或自动打开一个故障单。\n\
  \n### 安全评估\n\n**安全评估** 是对系统、应用程序或其他受测环境安全性的全面审查。在安全评估期间，受过培训的信息安全专业人员执行风险评估，识别受测环境中可能导致妥协的漏洞，并根据需要提出补救建议。\n\
  \n安全评估通常包括使用安全测试工具，但不局限于自动化扫描和手动渗透测试。它们还包括对威胁环境、当前和未来风险以及目标环境价值的深思熟虑的审查。\n\n安全评估的主要工作成果通常是一份致管理层的评估报告，其中包含用非技术语言编写的评估结果，并以改进受测环境安全性的具体建议作为结语。\n\
  \n评估可由内部团队进行，也可外包给在受评估领域具有特定专业知识的第三方评估团队。\n\n### 安全审计\n\n**安全审计** 使用许多与安全评估期间相同的技术，但必须由独立审计员执行。虽然组织的安全人员可能会定期执行安全测试和评估，但审计则不然。评估和测试结果仅供内部使用，旨在评估控制项以发现潜在改进。另一方面，审计是为了向第三方证明控制项有效性而进行的评估。为组织设计、实施和监控控制项的员工在评估这些控制项的有效性时存在固有的利益冲突。\n\
  \n审计员提供对安全控制状态公正、无偏见的看法。他们撰写的报告与安全评估报告非常相似，但这些报告面向不同的受众，可能包括组织的董事会、政府监管机构和其他第三方。主要有三种类型的审计：内部审计、外部审计和第三方审计。\n\
  \n#### 内部审计\n\n**内部审计** 由组织的内部审计人员执行，通常面向内部受众。执行这些审计的内部审计人员通常拥有完全独立于其评估职能的汇报线。在许多组织中，首席审计执行官直接向总裁、首席执行官或类似角色汇报。首席审计执行官也可能直接向组织的治理董事会负有汇报责任。\n\
  \n#### 外部审计\n\n**外部审计** 由外部审计公司执行。这些审计具有高度的外部效度，因为执行评估的审计员理论上与组织本身不存在利益冲突。有数千家公司执行外部审计，但大多数人对所谓的“四大”审计公司给予最高的信誉：\n\
  \n*   安永\n*   德勤\n*   普华永道\n*   毕马威\n\n由这些公司执行的审计通常被大多数投资者和治理机构成员所接受。\n\n#### 第三方审计\n\
  \n**第三方审计** 由另一组织执行或代表另一组织执行。例如，监管机构可能有权根据合同或法律发起对受监管公司的审计。在第三方审计的情况下，发起审计的组织通常选择审计员并设计审计范围。\n\
  \n向其他组织提供服务的组织经常被要求参与第三方审计。如果拥有大量客户，这对被审计组织来说可能是相当大的负担。美国注册会计师协会（AICPA）发布了一项旨在减轻这一负担的标准。《鉴证业务准则声明第\
  \ 16 号》（**SSAE 16**），即《控制报告》，提供了一项通用标准，供审计员在评估服务组织时使用，旨在允许组织进行一次外部评估，而非多次第三方评估，然后将生成的报告与客户和潜在客户共享。\n\
  \nSSAE 16 业务产出两种不同类型的报告。\n\n*   **I 型报告** 提供对被审计组织所提供控制项的描述，以及审计员基于该描述发表的意见。I 型审计涵盖单一时间点，不涉及审计员对控制项的实际测试。\n\
  *   **II 型报告** 涵盖至少六个月的时间段，还包括审计员基于其实际执行的测试，对这些控制项有效性发表的意见。\n\nII 型报告被认为比 I 型报告可靠得多，因为它们包含对控制项的独立测试。I\
  \ 型报告仅根据服务组织的陈述，认为控制项按描述实施。\n\n信息安全专业人员经常被要求参与内部、外部和第三方审计。他们通常必须通过面谈和书面文档向审计员提供有关安全控制的信息。审计员还可能要求安全人员参与控制评估的执行。审计员通常拥有访问组织内所有信息的完全权限，安全人员应遵守这些要求，并在需要时咨询管理层。\n\
  \n#### 审计标准\n\n\n\n\n\n### 审计与评估标准\n\n在进行审计或评估时，执行审查的团队应明确他们用于评估组织的标准。该标准提供了应满足的控制目标描述，随后审计或评估旨在确保组织已正确实施控制以满足这些目标。\n\
  \n用于进行审计和评估的一个常见框架是*信息及相关技术控制目标*。COBIT 描述了组织在其信息系统周围应建立的通用要求。\n\n国际标准化组织 (ISO) 还发布了一套与信息安全相关的标准。`ISO\
  \ 27001` 描述了建立信息安全管理体系的标准方法，而 `ISO 27002` 则更详细地阐述了信息安全控制的具体细节。这些国际公认的标准在安全领域被广泛使用，组织可以选择正式认证为符合\
  \ `ISO 27001`。\n\n### 执行漏洞评估\n\n漏洞评估是信息安全专业人员工具箱中最重要的测试工具之一。漏洞扫描和渗透测试为安全专业人员提供了关于系统或应用程序技术控制中弱点的视角。\n\
  \n#### 描述漏洞\n\n安全社区依赖一套通用标准，为描述和评估漏洞提供通用语言。NIST 为社区提供了*安全内容自动化协议* 以满足这一需求。SCAP 提供了这一通用讨论框架，并促进了不同安全系统之间交互的自动化。SCAP\
  \ 的组件包括以下内容：\n\n*   *通用漏洞披露* 提供了一套描述安全漏洞的命名系统。\n*   *通用漏洞评分系统* 提供了一套描述安全漏洞严重程度的标准化评分系统。\n\
  *   *通用配置枚举* 提供了一套描述系统配置问题的命名系统。\n*   *通用平台枚举* 提供了一套描述操作系统、应用程序和设备的命名系统。\n*   *可扩展配置清单描述格式*\
  \ 提供了一种指定安全清单的语言。\n*   *开放漏洞与评估语言* 提供了一种描述安全测试过程的语言。\n\n#### 漏洞扫描\n\n*漏洞扫描* 会自动探测系统、应用程序和网络，寻找攻击者可能利用的弱点。这些测试中使用的扫描工具提供快速的“点击式”测试，无需人工干预即可执行原本繁琐的任务。大多数工具允许按周期安排定期扫描，并提供报告显示不同日期执行的扫描之间的差异，为管理员提供了了解其安全风险环境变化的视角。\n\
  \n漏洞扫描主要有四大类：网络发现扫描、网络漏洞扫描、Web 应用程序漏洞扫描和数据库漏洞扫描。各种各样的工具可执行这些类型的扫描。\n\n##### 网络发现扫描\n\
  \n网络发现扫描使用多种技术扫描一系列 IP 地址，搜索具有开放网络端口的系统。网络发现扫描器实际上并不探测系统的漏洞，而是提供一份报告，显示网络上检测到的系统以及网络和服务器防火墙（位于扫描器与被扫描系统之间的网络路径上）所暴露的端口列表。\n\
  \n网络发现扫描器使用许多不同的技术来识别远程系统上的开放端口。一些较常见的技术如下：\n\n**TCP SYN 扫描** 向每个被扫描端口发送一个设置了 SYN\
  \ 标志的单个数据包。这表示请求打开一个新连接。如果扫描器收到的响应同时设置了 SYN 和 ACK 标志，则表明系统正在进入三次 TCP 握手的第二阶段，且该端口是开放的。TCP\
  \ SYN 扫描也称为“半开放”扫描。\n\n**TCP Connect 扫描** 在指定端口上与远程系统建立完整连接。当运行扫描的用户没有运行半开放扫描所需的权限时，会使用此扫描类型。大多数其他扫描类型都需要发送原始数据包的能力，而用户可能会受到操作系统限制而无法发送手工制作的数据包。\n\
  \n**TCP ACK 扫描** 发送一个设置了 ACK 标志的数据包，表明它是开放连接的一部分。此类扫描可能旨在确定防火墙强制执行的规则和防火墙方法。\n\n\
  **Xmas 扫描** 发送一个同时设置了 FIN、PSH 和 URG 标志的数据包。设置了如此多标志的数据包被称为“像圣诞树一样亮起来”，因此得名。\n\n\
  用于网络发现扫描的最常用工具是一个名为 `nmap` 的开源工具。`nmap` 最初于 1997 年发布，令人惊讶的是它至今仍在维护并普遍使用。它仍然是最流行的网络安全工具之一，几乎每个安全专业人员要么定期使用\
  \ `nmap`，要么在其职业生涯的某个阶段使用过它。您可以在 <http://nmap.org> 下载 `nmap` 的免费副本或了解更多关于该工具的信息。\n\
  \n当 `nmap` 扫描系统时，它会识别系统上每个网络端口的当前状态。对于检测到结果的端口，它会提供该端口的当前状态：\n\n**开放** 该端口在远程系统上是开放的，且有应用程序正在该端口上主动接受连接。\n\
  \n**关闭** 该端口在远程系统上是可访问的，意味着防火墙允许访问，但没有应用程序在该端口上接受连接。\n\n**被过滤** 由于防火墙干扰了连接尝试，`nmap`\
  \ 无法确定端口是开放还是关闭。\n\n图 15.1 展示了 `nmap` 运行的示例。用户在 Linux 提示符下输入了以下命令：\n\n```\nnmap\
  \ –vv 52.4.85.159\n```\n\n![图 15.1 从 Linux 系统运行的 Web 服务器 Nmap 扫描](img/c15f001.jpg)\n\
  \n**图 15.1** 从 Linux 系统运行的 Web 服务器 Nmap 扫描\n\n`nmap` 软件随即开始对 IP 地址为 `52.4.85.159`\
  \ 的系统进行端口扫描。命令中指定的 `–vv` 标志只是告诉 `nmap` 使用详细模式，报告其结果的详细输出。图 15.1 底部附近出现的扫描结果表明，`nmap`\
  \ 在该系统上发现了三个活动端口：`22`、`80` 和 `443`。端口 `22` 和 `80` 是开放的，表明系统正在主动接受这些端口上的连接请求。端口 `443`\
  \ 是关闭的，意味着防火墙包含允许该端口连接尝试的规则，但系统未运行配置为接受这些连接的应用程序。\n\n要解读这些结果，您必须了解常见网络端口的用途，这在第\
  \ 12 章“安全通信与网络攻击”中已讨论过。让我们演练一下此 `nmap` 扫描的结果：\n\n*   端口列表的第一行 `22/tcp open ssh`\
  \ 表明系统接受 TCP 端口 `22` 上的连接。安全外壳 (SSH) 服务使用此端口允许对服务器进行管理连接。\n*   端口列表的第二行 `80/tcp\
  \ open http` 表明系统正在接受端口 `80` 上的连接请求，该端口由超文本传输协议 (HTTP) 用于传送网页。\n\n\n\n\n端口列表的最后一行\
  \ `443/tcp closed https` 表明存在一条防火墙规则允许访问 443 端口，但没有服务在该端口上监听。443 端口由超文本传输安全协议（HTTPS）用于接受加密的\
  \ Web 服务器连接。\n\n从这些结果中我们能学到什么？被扫描的系统很可能是一台 Web 服务器，它公开接受来自扫描系统的连接请求。扫描器与该系统之间的防火墙配置为允许安全（443\
  \ 端口）和不安全（80 端口）连接，但服务器并未设置为实际执行加密事务。该服务器还开放了一个管理端口，可能允许命令行连接。\n\n阅读这些结果的攻击者可能会对系统做出一些观察，从而进行进一步探测：\n\
  \n*   将 Web 浏览器指向该服务器，很可能会很好地了解服务器的功能及其运营者。只需在浏览器地址栏输入 `http://52.4.85.159` 即可能揭示有用信息。图\
  \ 15.2 显示了执行此操作的结果：该站点运行的是 Apache Web 服务器的默认安装版本。\n*   与该服务器的连接未加密。如果可能，窃听这些连接可能会泄露敏感信息。\n\
  *   开放的 SSH 端口是一个有趣的发现。攻击者可能会尝试针对该端口上的管理账户进行暴力破解密码攻击，以获取系统访问权限。\n\n![FIGURE 15.2\
  \ Default Apache server page running on the server scanned in Figure 15.1](img/c15f002.jpg)\n\
  \n**图 15.2** 图 15.1 中扫描的服务器上运行的默认 Apache 服务器页面\n\n在本例中，我们使用 nmap 扫描了单个系统，但该工具也允许扫描整个网络以查找具有开放端口的系统。图\
  \ 15.3 所示的扫描针对 `192.168.1.0/24` 网络，包括 `192.168.1.0`–`192.168.1.255` 范围内的所有地址。\n\n\
  ![FIGURE 15.3 Nmap scan of a large network run from a Mac system using the Terminal\
  \ utility ](img/c15f003.jpg)\n\n**图 15.3** 使用终端实用程序从 Mac 系统运行的大型网络 Nmap 扫描\n\n#####\
  \ 网络漏洞扫描\n\n*网络漏洞扫描* 比发现扫描更深入。它们不仅检测开放端口，还会继续探测目标系统或网络是否存在已知漏洞。这些工具包含数千个已知漏洞的数据库，以及可用于识别系统是否易受数据库中每个漏洞影响的测试。\n\
  \n当扫描器测试系统漏洞时，它使用数据库中的测试来确定系统是否可能包含该漏洞。在某些情况下，扫描器可能没有足够的信息来确定性地判断漏洞是否存在，从而在实际上不存在问题时报告漏洞。这种情况称为*误报*，有时被系统管理员视为麻烦。更危险的是，漏洞扫描器遗漏了漏洞，未能提醒管理员存在危险情况。这种错误称为*漏报*。\n\
  \n默认情况下，网络漏洞扫描器运行未认证扫描。它们在没有密码或其他授予扫描器特殊权限的特殊信息的情况下测试目标系统。这使扫描能够从攻击者的角度运行，但也限制了扫描器全面评估可能漏洞的能力。提高扫描准确性并减少误报和漏报的一种方法是对系统执行*认证扫描*。在这种方法中，扫描器拥有对被扫描服务器的只读访问权限，并可利用此访问权限从目标系统读取配置信息，在分析漏洞测试结果时使用这些信息。\n\
  \n图 15.4 显示了使用 Nessus 漏洞扫描器对同一系统执行网络漏洞扫描的结果，该系统在本章前面曾接受过网络发现扫描。\n\n![FIGURE 15.4\
  \ Network vulnerability scan of the same web server that was port scanned in Figure\
  \ 15.1](img/c15f004.jpg)\n\n**图 15.4** 图 15.1 中端口扫描的同一 Web 服务器的网络漏洞扫描\n\n图 15.4\
  \ 所示的扫描结果非常干净，代表了一个维护良好的系统。没有严重漏洞，只有两个与扫描系统上运行的 SSH 服务相关的低风险漏洞。虽然系统管理员可能希望调整 SSH\
  \ 加密设置以消除这些低风险漏洞，但这对管理员来说是一份非常好的报告，确信系统管理得当。\n\nNessus 是常用的漏洞扫描器，但也有许多其他可用工具。其他流行的商业扫描器包括\
  \ Qualys 的 QualysGuard 和 Rapid7 的 NeXpose。开源的 OpenVAS 扫描器也拥有不断壮大的用户社区。\n\n组织还可能对无线网络进行专门的漏洞评估。Aircrack\
  \ 是常用于执行这些评估的工具，通过测试无线网络的加密和其他安全参数。它可结合被动监控技术使用，后者可能识别网络上的流氓设备。\n\n### Web 漏洞扫描\n\
  \nWeb 应用程序对企业安全构成重大风险。由于其本质，运行许多 Web 应用程序的服务器必须向互联网用户暴露服务。防火墙和其他安全设备通常包含允许 Web 流量无阻碍地通过到\
  \ Web 服务器的规则。Web 服务器上运行的应用程序复杂，且通常对底层数据库拥有特权访问。攻击者经常试图利用这些情况，使用结构化查询语言（SQL）注入和其他针对\
  \ Web 应用程序安全设计缺陷的攻击。\n\n*Web 漏洞扫描器* 是专门用于搜寻 Web 应用程序已知漏洞的特殊工具。它们在任何安全测试计划中都发挥着重要作用，因为它们可能发现网络漏洞扫描器不可见的缺陷。当管理员运行\
  \ Web 应用程序扫描时，该工具使用自动化技术探测 Web 应用程序，通过操纵输入和其他参数来识别 Web 漏洞。然后该工具提供其发现的报告，通常包括建议的漏洞修复技术。图\
  \ 15.5 显示了使用 Nessus 漏洞扫描工具执行 Web 漏洞扫描的示例。此扫描针对运行在同一服务器上的 Web 应用程序，该服务器曾在图 15.1 中接受网络发现扫描，在图\
  \ 15.4 中接受网络漏洞扫描。当你阅读图 15.5 中的扫描报告时，请注意它检测到了网络漏洞扫描中未显示的漏洞。\n\n![FIGURE 15.5 Web\
  \ application vulnerability scan of the same web server that was port scanned in\
  \ Figure 15.1 and network vulnerability scanned in Figure 15.2. ](img/c15f005.jpg)\n\
  \n**图 15.5** 图 15.1 中端口扫描且图 15.2 中网络漏洞扫描的同一 Web 服务器的 Web 应用程序漏洞扫描。\n\n\n\n\n###\
  \ Web 漏洞扫描\n\nWeb 漏洞扫描是组织安全评估和测试计划的重要组成部分。在以下情况下运行扫描是一种良好的实践：\n\n*   当您首次开始执行 Web\
  \ 漏洞扫描时，扫描所有应用程序。这将检测遗留应用程序的问题。\n*   在首次将任何新应用程序移至生产环境之前对其进行扫描。\n*   在代码变更移至生产环境之前，扫描任何已修改的应用程序。\n\
  *   定期扫描所有应用程序。有限的资源可能要求根据应用程序的优先级安排这些扫描。例如，您可能希望比那些不涉及敏感信息的应用程序更频繁地扫描与敏感信息交互的 Web\
  \ 应用程序。\n\n在某些情况下，Web 应用程序扫描可能是满足合规要求所必需的。例如，第 4 章“法律、法规和合规”中讨论的支付卡行业数据安全标准（PCI\
  \ DSS）要求组织至少每年执行一次 Web 应用程序漏洞扫描，或安装专用的 Web 应用程序防火墙，以增加针对 Web 漏洞的额外保护层。\n\n除了 Nessus\
  \ 之外，其他常用的 Web 应用程序漏洞扫描工具包括商业工具 Acunetix 扫描器、开源工具 Nikto 和 Wapiti 扫描器，以及 Burp Suite\
  \ 代理工具。\n\n#### 数据库漏洞扫描\n\n数据库包含组织一些最敏感的信息，是攻击者极具诱惑力的目标。虽然大多数数据库受防火墙保护，免受直接外部访问，但\
  \ Web 应用程序提供了通往这些数据库的门户，攻击者可能利用数据库支持的 Web 应用程序针对数据库发起攻击，包括 SQL 注入攻击。\n\n数据库漏洞扫描器是允许安全专业人员扫描数据库和\
  \ Web 应用程序以查找可能影响数据库安全的漏洞的工具。`sqlmap` 是一种常用的开源数据库漏洞扫描器，允许安全管理员探测 Web 应用程序中的数据库漏洞。图\
  \ 15.6 展示了 sqlmap 扫描 Web 应用程序的示例。\n\n![图 15.6 使用 sqlmap 扫描数据库支持的应用程序](img/c15f006.jpg)\n\
  \n**图 15.6** 使用 sqlmap 扫描数据库支持的应用程序\n\n#### 漏洞管理工作流\n\n采用漏洞管理系统的组织还应制定一种工作流方法来管理漏洞。此工作流中的基本步骤应包括以下内容：\n\
  \n1.  **检测**：漏洞的初始识别通常是漏洞扫描的结果。\n2.  **验证**：扫描器检测到漏洞后，管理员应确认该漏洞，以确定它不是误报。\n3.  **修复**：然后应修复已验证的漏洞。这可能包括应用供应商提供的安全补丁、修改设备配置、实施变通方法以避免漏洞，或安装\
  \ Web 应用程序防火墙或其他防止漏洞被利用的控制措施。\n\n工作流方法的目标是确保以有序的方式检测和解决漏洞。工作流还应包括根据漏洞的严重性、被利用的可能性和修复的难度，对漏洞修复进行优先级排序的步骤。\n\
  \n### 渗透测试\n\n`渗透测试` 超越了漏洞测试技术，因为它实际上会尝试利用系统。漏洞扫描仅探测漏洞的存在，通常不对目标系统采取进攻行动。（也就是说，某些漏洞扫描技术可能会破坏系统，尽管这些选项通常默认处于禁用状态。）另一方面，执行渗透测试的安全专业人员会尝试击败安全控制并闯入目标系统或应用程序，以证明缺陷的存在。\n\
  \n与漏洞扫描相比，渗透测试需要受过训练的安全专业人员投入更多的专注精力。执行渗透测试时，安全专业人员通常以单个系统或一组系统为目标，并使用多种不同的技术来获取访问权限。该过程通常包含以下阶段，如图\
  \ 15.7 所示：\n\n*   **规划** 包括就测试范围和交战规则达成一致。这是一个极其重要的阶段，因为它确保测试团队和管理层就测试的性质达成一致，并且测试已获得明确授权。\n\
  *   **信息收集与发现** 使用手动和自动化工具收集有关目标环境的信息。这包括执行基本侦察以确定系统功能（如访问系统上托管的网站）以及进行网络发现扫描以识别开放端口。\n\
  *   **漏洞扫描** 使用网络漏洞扫描、Web 漏洞扫描和数据库漏洞扫描来探测系统弱点。\n*   **利用** 尝试使用手动和自动化利用工具来击败系统安全。\n\
  *   **报告** 总结渗透测试的结果并提出改进系统安全的建议。\n\n渗透测试人员通常使用一种名为 `Metasploit` 的工具来自动针对目标系统执行利用代码。如图\
  \ 15.8 所示，Metasploit 使用一种脚本语言来允许自动执行常见攻击，通过消除执行攻击所涉及的许多繁琐、常规步骤，为测试人员（和黑客！）节省了大量时间。\n\
  \n![图 15.7 渗透测试过程](img/c15f007.jpg)\n\n**图 15.7** 渗透测试过程\n\n![图 15.8 Metasploit\
  \ 自动化系统利用工具允许攻击者快速针对目标系统执行常见攻击。](img/c15f008.jpg)\n\n**图 15.8** Metasploit 自动化系统利用工具允许攻击者快速针对目标系统执行常见攻击。\n\
  \n渗透测试人员可能是将这些测试作为其职责一部分的公司员工，也可能是受雇执行渗透测试的外部顾问。测试通常分为三类：\n\n#### 白盒渗透测试\n\n向攻击者提供有关其目标系统的详细信息。这绕过了攻击前通常所需的许多侦察步骤，缩短了攻击时间，并增加了发现安全缺陷的可能性。\n\
  \n#### 灰盒渗透测试\n\n也称为部分知识测试，有时会选择这种测试来平衡白盒和黑盒渗透测试的优缺点。当需要黑盒结果但成本或时间限制意味着需要某些知识来完成测试时，这种情况尤为常见。\n\
  \n#### 黑盒渗透测试\n\n在攻击前不向攻击者提供任何信息。这模拟了外部攻击者试图在发起攻击前获取有关业务和技术环境的信息。\n\n\n\n\n执行渗透测试的组织应当小心谨慎，确保了解测试本身的危害。渗透测试旨在利用漏洞，因此可能会中断系统访问或破坏存储在系统中的数据。这就是为什么在测试规划阶段明确规定交战规则，以及在开始任何测试之前获得高级管理层的完全授权非常重要的主要原因之一。\n\
  \n渗透测试耗时且需要专业资源，但它们在健全的信息安全测试计划的持续运行中发挥着重要作用。\n\n### 测试您的软件\n\n软件是系统安全的关键组件。请思考一下现代企业中许多正在使用的应用程序所共有的以下特征：\n\
  \n*   软件应用程序通常拥有对操作系统、硬件和其他资源的特权访问。\n*   软件应用程序例行处理敏感信息，包括信用卡号、社会安全号和专有业务信息。\n*\
  \   许多软件应用程序依赖也包含敏感信息的数据库。\n*   软件是现代企业的核心，执行业务关键功能。软件故障可能会中断业务，造成非常严重的后果。\n\n这些只是仔细测试软件对于每个现代组织的机密性、完整性和可用性要求至关重要的众多原因中的几个。在本节中，您将了解可以集成到组织软件开发生命周期中的多种软件测试类型。\n\
  \n#### 代码审查与测试\n\n软件测试计划中最关键的组成部分之一是进行代码审查和测试。这些程序在代码移入生产环境之前，提供对开发人员所执行工作的第三方审查。代码审查和测试可能会在应用程序上线并对业务运营产生负面影响之前，发现其中的安全、性能或可靠性缺陷。\n\
  \n##### 代码审查\n\n`Code review` 是软件评估计划的基础。在代码审查期间，也称为“同行评审”，编写代码的开发人员以外的其他开发人员会审查代码以查找缺陷。代码审查可能会导致批准应用程序移入生产环境，也可能会将代码连同针对审查中发现的问题的重新修改建议一起退回给原开发人员。\n\
  \n代码审查有多种不同的形式，其正式程度因组织而异。最正式的代码审查流程称为 Fagan 检查，遵循包含六个步骤的严格审查和测试流程：\n\n1.  规划\n\
  2.  概述\n3.  准备\n4.  检查\n5.  返工\n6.  跟进\n\nFagan 检查的概述见 图 15.9。这些步骤中的每一个都有定义明确的进入和退出标准，必须满足这些标准，流程才能正式从一个阶段过渡到下一个阶段。\n\
  \nFagan 检查这种正式程度通常只存在于代码缺陷可能造成灾难性影响的高度受限环境中。大多数组织使用不那么严格的流程，采用包含以下措施的代码同行评审：\n\n\
  *   开发人员在与一个或多个其他团队成员的会议中演示其代码\n*   高级开发人员执行手动代码审查，并在代码移入生产环境前对所有代码签署确认\n*   使用自动化审查工具在移入生产环境前检测常见的应用程序缺陷\n\
  \n![FIGURE 15.9 Fagan inspections follow a rigid formal process, with defined entry\
  \ and exit criteria that must be met before transitioning between stages.](img/c15f009.jpg)\n\
  \n**图 15.9** Fagan 检查遵循严格的正式流程，具有定义明确的进入和退出标准，必须满足这些标准才能在阶段间过渡。\n\n每个组织都应采用适合其业务需求和软件开发文化的代码审查流程。\n\
  \n### 静态测试\n\n`Static testing` 通过分析源代码或编译后的应用程序，在不运行软件的情况下评估软件的安全性。静态分析通常涉及使用旨在检测常见软件缺陷（如缓冲区溢出）的自动化工具。在成熟的开发环境中，应用程序开发人员可以访问静态分析工具，并在设计、构建和测试过程中全程使用它们。\n\
  \n### 动态测试\n\n`Dynamic testing` 在运行时环境中评估软件的安全性，对于部署他人编写的应用程序的组织来说，这通常是唯一的选择。在这些情况下，测试人员通常无法访问底层源代码。动态软件测试的一个常见示例是使用\
  \ Web 应用程序扫描工具来检测 Web 应用程序中是否存在跨站脚本、SQL 注入或其他缺陷。在生产环境上进行的动态测试应始终经过仔细协调，以避免无意中中断服务。\n\
  \n动态测试可能包括使用 `synthetic transactions` 来验证系统性能。这些是具有已知预期结果的脚本化事务。测试人员针对被测代码运行合成事务，然后将事务的输出与预期状态进行比较。实际结果与预期结果之间的任何偏差都代表代码中可能存在的缺陷，必须进一步调查。\n\
  \n##### 模糊测试\n\n`Fuzz testing` 是一种专门的动态测试技术，它向软件提供多种不同类型的输入，以测试其极限并发现先前未被检测到的缺陷。模糊测试软件向软件提供无效输入，这些输入要么是随机生成的，要么是专门设计用于触发已知软件漏洞的。模糊测试人员随后监控应用程序的性能，留意软件崩溃、缓冲区溢出或其他不良和/或不可预测的结果。\n\
  \n模糊测试主要分为两大类：\n\n**变异（哑）模糊测试** 从软件实际运行期间的先前输入值获取数据，并对其进行操作（或变异）以创建模糊输入。它可能会改变内容的字符、在内容末尾追加字符串，或执行其他数据操作技术。\n\
  \n**生成（智能）模糊测试** 开发数据模型，并基于对程序所用数据类型的理解创建新的模糊输入。\n\n`zzuf` 工具根据用户规范操作输入，实现了变异模糊测试过程的自动化。例如，图\
  \ 15.10 显示了一个包含一系列 1 的文件。\n\n![FIGURE 15.10 Prefuzzing input file containing a series\
  \ of 1s](img/c15f010.jpg)\n\n**图 15.10** 模糊测试前的输入文件，包含一系列 1\n\n图 15.11 显示了将 `zzuf`\
  \ 工具应用于该输入后的结果。生成的模糊文本与原始文本几乎相同。它仍然主要包含 1，但现在文本中有几处更改，可能会使期望原始输入的程序感到困惑。这种略微操作输入的过程称为\
  \ `bit flipping`。\n\n![FIGURE 15.11 The input file from Figure 15.10 after being\
  \ run through the zzuf mutation fuzzing tool](img/c15f011.jpg)\n\n**图 15.11** 经过\
  \ `zzuf` 变异模糊测试工具处理后的 图 15.10 中的输入文件\n\n\n\n### 模糊测试的局限性\n\n模糊测试是一项重要工具，但它也有局限性。模糊测试通常无法实现代码的全覆盖，且通常仅限于检测那些不需要复杂业务逻辑操纵的简单漏洞。因此，模糊测试应被视为一套测试工具中的仅一项工具，进行测试覆盖率分析（本章后面将讨论）以确定测试的完整范围是很有用的。\n\
  \n#### 接口测试\n\n*接口测试*是复杂软件系统开发的重要组成部分。在许多情况下，多个开发团队分别负责复杂应用程序的不同部分，这些部分必须协同工作以实现业务目标。这些独立开发模块之间的交接使用定义良好的接口，以便团队能够独立工作。接口测试根据接口规范评估模块的性能，以确保当所有开发工作完成时，它们能够正常协同工作。\n\
  \n软件测试过程中应测试三种类型的接口：\n\n**应用程序编程接口 (API)** 为代码模块交互提供了一种标准化方式，并可能通过 Web 服务暴露给外部世界。开发人员必须测试\
  \ API，以确保它们强制执行所有安全要求。\n\n**用户界面 (UI)** 示例包括图形用户界面 (GUI) 和命令行界面。UI 为最终用户提供与软件交互的能力。接口测试应包括对所有用户界面的审查，以验证其功能是否正常。\n\
  \n**物理接口** 存在于那些操纵机械、逻辑控制器或物理世界中其他对象的应用程序中。软件测试人员应密切关注物理接口，因为如果它们失效，后果可能很严重。\n\n\
  接口为复杂系统的计划内或未来互联提供了重要机制。Web 2.0 世界依赖这些接口的可用性来促进不同软件包之间的交互。然而，开发人员必须小心，接口提供的灵活性不应引入额外的安全风险。接口测试提供了额外的保证，确保接口满足组织的安全要求。\n\
  \n#### 误用用例测试\n\n在某些应用程序中，软件用户可能尝试误用应用程序的方式显而易见。例如，银行软件的用户可能会尝试操纵输入字符串以访问另一个用户的账户。他们还可能尝试从已透支的账户中取款。软件测试人员使用一种称为*误用用例测试*或*滥用用例测试*的过程，来评估其软件针对这些已知风险的脆弱性。\n\
  \n在误用用例测试中，测试人员首先列举已知的误用用例。然后，他们尝试利用手动和/或自动攻击技术来利用这些用例。\n\n#### 测试覆盖率分析\n\n虽然测试是任何软件开发过程的重要组成部分，但遗憾的是，无法完全测试任何一款软件。软件可能发生故障或遭受攻击的方式实在太多。软件测试专业人员通常会进行*测试覆盖率分析*，以估算针对新软件所进行测试的程度。测试覆盖率使用以下公式计算：\n\
  \n```\n测试覆盖率 = 已测试用例数量 / 用例总数\n```\n\n当然，这是一个高度主观的计算。准确计算测试覆盖率需要列举可能的用例，这是一项异常困难的任务。因此，任何使用测试覆盖率计算的人都应小心理解开发输入值所用的过程，以便在解读结果时做到心中有数。\n\
  \n测试覆盖率分析公式可调整为使用许多不同的标准。以下是五个常见标准：\n\n*   **分支覆盖率**：每个 `if` 语句是否已在所有 `if` 和 `else`\
  \ 条件下执行？\n*   **条件覆盖率**：代码中的每个逻辑测试是否已在所有输入集下执行？\n*   **函数覆盖率**：代码中的每个函数是否已被调用并返回了结果？\n\
  *   **循环覆盖率**：代码中的每个循环是否已在导致代码多次执行、仅执行一次以及完全不执行的条件下执行？\n*   **语句覆盖率**：代码的每一行是否已在测试期间执行？\n\
  \n#### 网站监控\n\n安全专业人员也经常参与网站的持续监控，以进行性能管理、故障排除和识别潜在安全问题。这种监控主要有两种形式。\n\n*   **被动监控**\
  \ 通过在网络传输过程中或到达服务器时捕获实际发送到网站的网络流量来进行分析。这提供了真实世界的监控数据，让管理员深入了解网络上实际发生的情况。**真实用户监控\
  \ (RUM)** 是被动监控的一种变体，其中监控工具重组单个用户的活动以追踪他们与网站的交互。\n*   **合成监控**（或**主动监控**）对网站执行人工事务以评估性能。这可能只是从网站请求一个页面以确定响应时间，也可能执行一个复杂的脚本，旨在识别事务的结果。\n\
  \n这两种技术经常结合使用，因为它们实现不同的结果。被动监控只能在真实用户实际发生问题后检测到问题，因为它监控的是真实用户活动。被动监控对于排查用户报告的问题特别有用，因为它允许捕获与该问题相关的流量。如果测试脚本中未包含真实用户遇到的问题，合成监控可能会遗漏这些问题，但它能够在问题实际发生*之前*检测到问题。\n\
  \n### 实施安全管理流程\n\n除了执行评估和测试外，完善的信息安全计划还包括各种管理流程，旨在监督信息安全计划的有效运行。这些流程是安全评估过程中的关键反馈回路，因为它们提供了管理监督，并对内部威胁攻击起到威慑作用。\n\
  \n满足这一需求的安全管理审查包括日志审查、账户管理、备份验证，以及关键绩效和风险指标。每项审查都应遵循标准化流程，并在审查完成时包含管理层批准。\n\n####\
  \ 日志审查\n\n在第 16 章“管理安全运营”中，您将了解存储日志数据以及进行自动和手动日志审查的重要性。安全信息和事件管理 (SIEM) 套件在这些过程中发挥着重要作用，自动化了日志审查的大量常规工作。这些设备利用许多设备、操作系统和应用程序中存在的\
  \ `syslog` 功能来收集信息。某些设备（包括 Windows 系统）可能需要第三方客户端来添加 `syslog` 支持。管理员可以选择通过 Windows\
  \ 组策略对象 (GPO) 和其他机制部署日志记录策略，这些机制可以在整个组织中部署和强制执行标准策略。\n\n\n\n\n\n### 日志系统与时间同步\n\n\
  日志系统还应利用网络时间协议（NTP）来确保发送日志条目到 SIEM 的系统以及 SIEM 本身的时钟保持同步。这可确保来自多个来源的信息具有一致的时间线。\n\
  \n信息安全管理人员还应定期进行日志审查，特别是针对敏感功能，以确保特权用户没有滥用其特权。例如，如果信息安全团队有权访问电子取证工具，允许搜索单个用户文件的内容，安全管理人员应定期审查这些管理用户采取行动的日志，以确保其文件访问与合法的电子取证计划相关，且不侵犯用户隐私。\n\
  \n#### 账户管理\n\n账户管理审查旨在确保用户仅保留授权权限，且未发生未经授权的修改。账户管理审查可以是信息安全管理人员或内部审计员的职能。\n\n执行账户管理的一种方法是对所有账户进行全面审查。由于耗时较长，这通常仅针对高度特权账户执行。具体流因组织而异，但以下是一个示例：\n\
  \n1.  管理者要求系统管理员提供拥有特权访问权限的用户名单及其特权访问权限。他们可能会监控管理员检索该名单的过程，以防篡改。\n2.  管理者要求特权批准机构提供授权用户名单及其应分配的特权。\n\
  3.  管理者随后对比这两份名单，以确保只有授权用户保留对系统的访问权限，且每个用户的访问权限不超出其授权范围。\n\n此过程可能包含许多其他检查，例如验证离职用户不再保留系统访问权限、检查特定账户的文档记录轨迹或其他任务。\n\
  \n没有时间执行这一彻底流程的组织可改用抽样检查。在此方法中，管理者随机抽取一部分账户，并对用于授予这些账户权限的流程执行全面验证。如果在样本中未发现重大缺陷，则假定该样本具有代表性，能反映整体情况。\n\
  \n组织还可实现账户审查流程的部分自动化。许多身份与访问管理（IAM）供应商提供账户审查工作流，提示管理员进行审查、维护用户账户文档，并提供审计追踪以证明审查的完成情况。\n\
  \n#### 备份验证\n\n在第 18 章“灾难恢复规划”中，您将了解维护一致备份计划的重要性。管理者应定期检查备份结果，以确保该流程有效运行并满足组织的数据保护需求。这可能涉及审查日志、检查哈希值，或请求对系统或文件执行实际恢复。\n\
  \n#### 关键绩效与风险指标\n\n安全管理人员还应持续监控关键绩效与风险指标。他们监控的确切指标因组织而异，但可能包括以下内容：\n\n*   未修复漏洞的数量\n\
  *   解决漏洞所需时间\n*   漏洞/缺陷复发率\n*   遭入侵账户的数量\n*   预生产环境扫描中发现的软件缺陷数量\n*   重复的审计发现\n*\
  \   用户尝试访问已知恶意站点的次数\n\n一旦组织确定了希望跟踪的关键安全指标，管理者可能希望开发一个仪表板，清晰地显示这些指标随时间变化的值，并将其展示在管理者和安全团队都能定期看到的地方。\n\
  \n### 摘要\n\n安全评估与测试计划在确保组织安全控制长期保持有效方面发挥着关键作用。业务运营、技术环境、安全风险和用户行为的变化，可能会改变保护信息资产机密性、完整性和可用性的控制措施的有效性。评估与测试计划监控这些控制措施，并突出显示需要管理员干预的变更。安全专业人员应精心设计其评估与测试计划，并随业务需求变化进行修订。\n\
  \n安全测试技术包括漏洞评估和软件测试。通过漏洞评估，安全专业人员执行各种测试，以识别系统和应用程序中的错误配置和其他安全缺陷。网络发现测试识别网络上具有开放端口的系统。网络漏洞扫描发现这些系统上已知的安全缺陷。Web\
  \ 漏洞扫描探测 Web 应用程序的运行，搜索已知漏洞。\n\n软件在任何安全基础设施中都发挥着关键作用，因为它处理敏感信息并与关键资源交互。组织应使用代码审查流程，允许同行在代码移至生产环境前对其进行验证。严格的软件测试计划还包括使用静态测试、动态测试、接口测试和误用用例测试，以稳健地评估软件。\n\
  \n安全管理流程包括日志审查、账户管理、备份验证以及关键绩效与风险指标的跟踪。这些流程帮助安全管理人员验证信息安全计划的持续有效性。它们由第三方不那么频繁地执行的正式内部和外部审计所补充。\n\
  \n### 考试要点\n\n**理解安全评估与测试计划的重要性。** 安全评估与测试计划为验证安全控制的持续有效性提供了重要机制。它们包含各种工具，包括漏洞评估、渗透测试、软件测试、审计和安全管理任务，旨在验证控制措施。每个组织都应定义并运行一项安全评估与测试计划。\n\
  \n**开展漏洞评估和渗透测试。** 漏洞评估使用自动化工具搜索系统、应用程序和网络中的已知漏洞。这些缺陷可能包括缺失补丁、错误配置或有缺陷的代码，从而使组织面临安全风险。渗透测试也使用这些相同工具，但会结合攻击技术加以补充，评估人员尝试利用漏洞并获取系统访问权限。\n\
  \n**执行软件测试以验证移入生产环境的代码。** 软件测试技术验证代码按设计运行且不包含安全缺陷。代码审查使用同行评审流程，在将代码部署到生产环境前对其进行正式或非正式验证。接口测试评估组件与用户之间的交互，包括\
  \ API 测试、用户界面测试和物理接口测试。\n\n**理解静态与动态软件测试的区别。** 静态软件测试技术（如代码审查）通过分析源代码或编译后的应用程序，在不运行软件的情况下评估其安全性。动态测试在运行时环境中评估软件安全性，对于部署他人编写的应用程序的组织来说，这通常是唯一可行的选择。\n\
  \n\n\n\n### 解释模糊测试的概念\n\n模糊测试使用修改后的输入来测试软件在意外情况下的表现。变异模糊测试修改已知输入以生成可能触发意外行为的合成输入。生成式模糊测试基于预期输入的模型开发输入以执行相同任务。\n\
  \n### 执行安全管理任务以对信息安全计划提供监督\n\n安全管理人员必须执行各种活动，以保持对信息安全计划的适当监督。日志审查（特别是针对管理员活动）可确保系统未被滥用。账户管理审查可确保只有授权用户保留对信息系统的访问权限。备份验证可确保组织的数据保护流程正常运行。关键绩效和风险指标提供了安全计划有效性的高层视图。\n\
  \n### 进行或促进内部和第三方审计\n\n安全审计发生在第三方对保护组织信息资产的安全控制执行评估时。内部审计由组织内部员工执行，旨在供管理层使用。外部审计由第三方审计公司执行，通常旨在供组织的治理机构使用。\n\
  \n### 书面实验\n\n1. 描述 TCP SYN 扫描和 TCP 连接扫描的区别。\n2. `nmap` 网络发现扫描工具返回的三种端口状态值是什么？\n\
  3. 静态和动态代码测试技术有什么区别？\n4. 变异模糊测试和生成式模糊测试有什么区别？\n\n### 复习题\n\n1. 以下哪种工具主要用于执行网络发现扫描？\n\
  \    1. `Nmap`\n    2. `Nessus`\n    3. `Metasploit`\n    4. `lsof`\n\n2. Adam 最近对其组织中运行的\
  \ Web 服务器进行了网络端口扫描。他从外部网络运行扫描，以获得攻击者视角的扫描结果。以下哪个结果最令人担忧？\n    1. 80/open\n    2.\
  \ 22/filtered\n    3. 443/open\n    4. 1433/open\n\n3. 在为特定系统规划安全测试计划时，以下哪个因素**不**应予以考虑？\n\
  \    1. 系统上存储信息的敏感度\n    2. 执行测试的难度\n    3. 想要尝试新测试工具的愿望\n    4. 系统对攻击者的吸引力\n\n\
  4. 以下哪项通常**不**包含在安全评估中？\n    1. 漏洞扫描\n    2. 风险评估\n    3. 漏洞缓解\n    4. 威胁评估\n\n\
  5. 安全评估报告的目标受众是谁？\n    1. 管理层\n    2. 安全审计师\n    3. 安全专业人员\n    4. 客户\n\n6. Beth\
  \ 希望对其组织私有网络上的所有系统运行 `nmap` 扫描。这些系统包括 10.0.0.0 私有地址空间中的系统。她希望扫描整个私有地址空间，因为她不确定使用了哪些子网。Beth\
  \ 应将哪个网络地址指定为扫描目标？\n    1. 10.0.0.0/0\n    2. 10.0.0.0/8\n    3. 10.0.0.0/16\n \
  \   4. 10.0.0.0/24\n\n7. Alan 对一台服务器运行了 `nmap` 扫描，确定该服务器的 80 端口处于开放状态。哪个工具最有可能为他提供关于服务器用途及操作人员身份的最佳附加信息？\n\
  \    1. `SSH`\n    2. Web 浏览器\n    3. `telnet`\n    4. `ping`\n\n8. 通常使用哪个端口通过 `SSH`\
  \ 实用程序接受管理连接？\n    1. 20\n    2. 22\n    3. 25\n    4. 80\n\n9. 以下哪种测试能提供关于服务器安全状态最准确、最详细的信息？\n\
  \    1. 未认证扫描\n    2. 端口扫描\n    3. 半开放扫描\n    4. 认证扫描\n\n10. 哪种类型的网络发现扫描仅遵循 TCP\
  \ 三次握手的前两步？\n     1. TCP 连接扫描\n     2. Xmas 扫描\n     3. TCP SYN 扫描\n     4. TCP\
  \ ACK 扫描\n\n11. Matthew 希望测试其网络上的系统是否存在 SQL 注入漏洞。以下哪种工具最适合此任务？\n     1. 端口扫描器\n\
  \     2. 网络漏洞扫描器\n     3. 网络发现扫描器\n     4. Web 漏洞扫描器\n\n12. Badin Industries 运行一个处理电子商务订单和信用卡交易的\
  \ Web 应用程序。因此，它受支付卡行业数据安全标准 (PCI DSS) 约束。该公司最近对该应用程序执行了 Web 漏洞扫描，结果无不合格发现。Badin\
  \ 必须多久重新扫描一次该应用程序？\n     1. 仅当应用程序发生变更时\n     2. 至少每月一次\n     3. 至少每年一次\n     4.\
  \ 无重新扫描要求。\n\n13. Grace 正在对客户网络执行渗透测试，希望使用工具协助自动执行常见漏洞利用。以下哪种安全工具最能满足她的需求？\n   \
  \  1. `nmap`\n     2. `Metasploit`\n     3. `Nessus`\n     4. `Snort`\n\n14. Paul\
  \ 希望针对之前使用过的输入的轻微修改版本测试其应用程序。Paul 打算执行哪种类型的测试？\n     1. 代码审查\n     2. 应用程序漏洞审查\n\
  \     3. 变异模糊测试\n     4. 生成式模糊测试\n\n15. 银行应用程序的用户可能会尝试从其账户中取出不存在的资金。开发人员知晓此威胁并实施了代码以防范它。如果开发人员尚未修复该漏洞，哪种类型的软件测试最有可能捕获此类漏洞？\n\
  \     1. 误用用例测试\n     2. SQL 注入测试\n     3. 模糊测试\n     4. 代码审查\n\n16. 哪种类型的接口测试能识别程序命令行界面中的缺陷？\n\
  \     1. 应用程序编程接口测试\n     2. 用户界面测试\n     3. 物理接口测试\n     4. 安全接口测试\n\n17. 在哪种类型的渗透测试中，测试人员始终拥有对系统配置信息的访问权限？\n\
  \     1. 黑盒渗透测试\n     2. 白盒渗透测试\n     3. 灰盒渗透测试\n     4. 红盒渗透测试\n\n18. 运行未加密 HTTP\
  \ 服务器的系统通常开放哪个端口？\n     1. 22\n     2. 80\n     3. 143\n     4. 443\n\n19. 以下哪项是\
  \ Fagan 检查过程的最后一步？\n     1. 检查\n     2. 返工\n     3. 跟进\n     4. 以上都不是\n\n20. 哪项信息安全管理任务确保有效满足组织的数据保护要求？\n\
  \     1. 账户管理\n     2. 备份验证\n     3. 日志审查\n     4. 关键绩效指标\n\n### 第 16 章：管理安全运营\n\
  \n## 本章涵盖的 CISSP 考试主题包括：\n\n### 领域 7：安全运营\n\n#### 7.4 安全地供应资源\n*   7.4.1 资产清单\n\
  *   7.4.2 资产管理\n*   7.4.3 配置管理\n\n#### 7.5 理解并应用基础安全运营概念\n*   7.5.1 知情需要/最小权限\n\
  *   7.5.2 职责分离\n*   7.5.3 特权账户管理\n*   7.5.4 工作轮换\n*   7.5.5 信息生命周期\n*   7.5.6 服务级别协议\
  \ (SLA)\n\n#### 7.6 应用资源保护技术\n*   7.6.1 介质管理\n*   7.6.2 硬件和软件资产管理\n\n#### 7.9 实施并支持补丁和漏洞管理\n\
  \n\n\n### 7.10 理解并参与变更管理流程\n\n### 7.16 解决人员安全与安保问题\n\n#### 7.16.1 差旅\n\n#### 7.16.2\
  \ 安全培训与意识\n\n#### 7.16.3 应急管理\n\n#### 7.16.4 胁迫\n\n![images](img/clogo.jpg) 安全运营领域包含广泛的安全基础概念和最佳实践。这包括任何组织为提供基本安全防护所需实施的几个核心概念。本章的第一部分涵盖了这些概念。\n\
  \n资源保护确保资源在部署时及其整个生命周期内都得到安全配置。配置管理确保系统配置正确，而变更管理流程可防止未经授权的变更导致中断。补丁和漏洞管理控制确保系统保持最新状态，并受到保护，免受已知漏洞的侵害。\n\
  \n### 应用安全运营概念\n\n安全运营实践的主要目的是保护资产，包括信息、系统、设备和设施。这些实践有助于识别威胁和漏洞，并实施控制措施以降低组织资产的整体风险。\n\
  \n在信息技术（IT）安全的背景下，`due care`（应尽的注意义务）和 `due diligence`（应尽的勤勉义务）是指持续采取合理的注意来保护组织的资产。高级管理层有直接责任履行应尽的注意义务和勤勉义务。实施以下各节涵盖的常见安全运营概念，以及执行定期的安全审计和评估，表明履行了一定程度的应尽注意义务和勤勉义务，这将在发生损失时减轻高级管理层的责任。\n\
  \n#### 知情需要与最小权限原则\n\n知情需要和最小权限原则是任何安全 IT 环境中遵循的两项标准原则。它们通过限制对这些资产的访问，帮助为宝贵资产提供保护。虽然它们相关联，且许多人交替使用这些术语，但两者之间有明显的区别。知情需要侧重于权限和访问信息的能力，而最小权限侧重于特权。\n\
  \n第 14 章“控制和监控访问”对比了权限、权利和特权。提醒一下，权限允许访问文件等对象。权利是指执行操作的能力。访问权利与权限同义，但权利也可以指在系统上执行操作的能力，例如更改系统时间的权利。特权是权利和权限的组合。\n\
  \n##### 知情需要访问\n\n`need-to-know`（知情需要）原则要求仅授予用户执行分配的工作任务所需的数据或资源的访问权限。其主要目的是保守秘密信息。如果你想保守秘密，最好的办法是不告诉任何人。如果只有你知道，你可以确保它保持秘密。如果你告诉一个值得信赖的朋友，它可能仍然是秘密。你的朋友可能会告诉其他人——比如另一个值得信赖的朋友。然而，随着知道秘密的人越来越多，秘密泄露给他人的风险也会增加。限制知情人数，就能增加保守秘密的几率。\n\
  \n知情需要通常与安全许可相关联，例如某人拥有机密级许可。然而，许可并不会自动授予数据访问权。例如，假设 Sally 拥有机密级许可。这表明她有资格访问机密数据。然而，该许可并不会自动授予她访问所有机密数据的权限。相反，管理员仅授予她完成工作所需知情的机密数据访问权限。\n\
  \n虽然知情需要最常与军事和政府机构使用的许可相关联，但它也适用于民用组织。例如，数据库管理员可能需要访问数据库服务器以执行维护，但他们不需要访问服务器数据库中的所有数据。基于知情需要限制访问，有助于防止未经授权的访问导致机密性丧失。\n\
  \n##### 最小权限原则\n\n`principle of least privilege`（最小权限原则）规定，主体仅被授予执行分配的工作任务所需的特权，不得更多。请记住，此语境下的特权包括对数据的权限和对系统执行任务的权利。对于数据，它包括控制写入、创建、修改或删除数据的能力。基于此概念限制和控制特权可保护机密性和数据完整性。如果用户只能修改其工作任务要求他们修改的数据文件，则可保护环境中其他文件的完整性。\n\
  \n不过，这一原则不仅限于访问数据。它也适用于系统访问。例如，在许多网络中，普通用户可以使用网络账户登录网络中的任何计算机。然而，组织通常通过阻止普通用户登录服务器或将用户限制为仅登录单个工作站来限制此特权。\n\
  \n组织违反这一原则的一种方式是将所有用户添加到本地 Administrators 组或授予计算机的 root 访问权限。这赋予了用户对计算机的完全控制权。然而，普通用户很少需要如此多的访问权限。当他们拥有这种访问权限时，可能会意外（或故意）对系统造成损害，例如访问或删除有价值的数据。\n\
  \n此外，如果用户以完全管理特权登录并无意中安装了恶意软件，该恶意软件可以承担用户账户的完全管理特权。相反，如果用户使用普通用户账户登录，恶意软件只能承担普通账户的有限特权。\n\
  \n最小权限通常侧重于确保用户特权受到限制，但它也适用于其他主体，例如应用程序或进程。例如，服务和应用程序通常在专门为该服务或应用程序创建的账户上下文中运行。历史上，管理员往往在未考虑最小权限原则的情况下，授予这些服务账户完全管理特权。如果攻击者攻破了应用程序，他们可能会承担服务账户的特权，从而获得完全管理特权。\n\
  \n人员在实施知情需要和最小权限时，应考虑的其他概念包括授权、聚合和传递信任。\n\n**授权** 授权是指授予用户的特权数量，通常在首次配置账户时。换句话说，当管理员创建用户账户时，他们确保账户配置了适当数量的资源，这包括特权。适当的用户配置流程遵循最小权限原则。\n\
  \n**聚合** 在最小权限的语境下，聚合是指用户随时间积累的特权数量。例如，如果用户在为组织工作期间从一个部门调动到另一个部门，该用户最终可能会拥有来自每个部门的特权。为避免此类访问聚合问题，当用户调动到不同部门且不再需要先前分配的特权时，管理员应撤销这些特权。\n\
  \n\n\n\n\n### 传递信任\n\n两个安全域之间的信任关系允许一个域（称为*主域*）中的主体访问另一个域（称为*训练域*）中的对象。假设训练域有一个名为\
  \ `training.cissp` 的子域。传递信任将信任关系扩展到子域。换句话说，主域中的用户可以访问训练域中的对象，也可以访问 `training.cissp`\
  \ 子域中的对象。如果信任关系是非传递的，主域中的用户就无法访问子域中的对象。在最小权限原则的背景下，审查这些信任关系非常重要，尤其是在不同组织之间创建它们时。非传递信任强制执行最小权限原则，一次只向单个域授予信任。\n\
  \n#### 职责分离\n\n*职责分离*确保没有单个人对关键功能或系统拥有完全控制权。这是为了确保没有单个人能够危害系统或其安全性。相反，必须有两个或更多的人共谋或串通才能对组织造成损害，这增加了这些人的风险。\n\
  \n职责分离策略创建了一种制衡系统，在这种系统中，两个或更多用户相互验证对方的行为，并必须协同工作以完成必要的工作任务。这使得个人更难从事恶意、欺诈或未经授权的活动，并扩大了检测和报告的范围。相反，如果个人认为他们可以逃脱惩罚，他们可能更倾向于实施未经授权的行为。随着两个或更多人的参与，被发现的风险增加，从而起到了有效的威慑作用。\n\
  \n这里有一个简单的例子。电影院利用职责分离来防止欺诈。一个人售票。另一个人收票，不允许没有票的人入场。如果同一个人既收钱又允许入场，这个人就可以允许没票的人进入，或者把收来的钱揣进腰包而不出票。当然，售票员和检票员有可能串通一气，密谋从电影院偷窃。这就是串通，因为它是两个或更多的人之间为实施某些未经授权的活动而达成的协议。然而，串通需要更多的精力，并增加了他们各自的风险。职责分离策略通过要求两个或更多的人串通才能实施未经授权的活动，有助于减少欺诈。\n\
  \n同样，组织通常将流程分解为多个任务或职责，并将这些职责分配给不同的个人以防止欺诈。例如，一个人批准有效发票的付款，但由另一个人付款。如果一个人控制了整个批准和付款流程，就很容易批准虚假发票并欺骗公司。\n\
  \n强制执行职责分离的另一种方法是将安全或管理功能分配给多个受信任的个人。当组织将管理和安全职责分配给多个用户时，没有单个人拥有足够的访问权限来绕过或禁用安全机制。\n\
  \n##### 特权分离\n\n*特权分离*在概念上类似于职责分离。它建立在最小权限原则之上，并将其应用于应用程序和进程。特权分离策略要求使用细粒度的权限和许可。\n\
  \n管理员为每种类型的特权操作分配不同的权限和许可。他们仅授予特定进程执行特定功能所需的特权，而不是授予它们对系统的无限制访问权限。\n\n正如最小权限原则既适用于用户账户也适用于服务账户一样，特权分离概念也既适用于用户账户也适用于服务账户。\n\
  \n许多服务器应用程序都有支持应用程序的底层服务，如前所述，这些服务必须在账户的上下文中运行，通常称为服务账户。如今，服务器应用程序拥有多个服务账户是很常见的。管理员应仅授予每个服务账户执行其在应用程序内的功能所需的特权。这支持特权隔离策略。\n\
  \n##### 职责隔离\n\n职责隔离类似于职责分离策略，但它也结合了最小权限原则。其目标是确保个人没有过度的系统访问权限，从而导致利益冲突。当职责得到适当隔离时，没有单个员工既有能力实施欺诈或犯错，又有能力掩盖它。它类似于职责分离，因为职责被分离了；也类似于最小权限原则，因为特权受到了限制。\n\
  \n对于任何必须遵守 2002 年《萨班斯-奥克斯利法案》（SOX）的公司来说，职责隔离策略都高度相关，因为 SOX 专门要求这一点。然而，也可以在任何 IT\
  \ 环境中应用职责隔离策略。\n\n职责隔离策略最常见的实施之一是确保安全职责与组织内的其他职责分开。换句话说，负责审计、监控和审查安全的人员没有与他们正在审计、监控和审查的内容相关的其他操作职责。每当安全职责与其他操作职责结合在一起时，个人就可以利用他们的安全特权来掩盖与其操作职责相关的活动。\n\
  \n图 16.1 是一个基本的职责隔离控制矩阵，用于比较组织内不同角色和任务。标记为 X 的区域表示要避免的潜在冲突。例如，考虑一名应用程序员和一名安全管理员。程序员可以对应用程序进行未经授权的修改，但安全管理员的审计或审查会检测到未经授权的修改。然而，如果一个人同时拥有这两份工作的职责（和特权），这个人就可以修改应用程序，然后掩盖修改以防止被发现。\n\
  \n![图 16.1 职责隔离控制矩阵](img/c16f001.jpg)\n\n**图 16.1** 职责隔离控制矩阵\n\n理想情况下，人员永远不会被分配到存在利益冲突的两个角色。然而，如果特殊情况要求这样做，则可以实施补偿控制来降低风险。\n\
  \n##### 双人控制\n\n双人控制（通常称为双人规则）要求两个人批准关键任务。例如，银行的保险箱通常需要两把钥匙。银行员工控制一把钥匙，客户持有第二把钥匙。需要两把钥匙才能打开箱子，银行员工只有在核实客户身份后才允许客户进入箱子。\n\
  \n在组织内使用双人控制可确保同行评审，并降低串通和欺诈的可能性。例如，组织可以要求公司内的两个人（如首席财务官和首席执行官）批准关键业务决策。此外，某些特权活动可以配置为需要两名管理员协作完成任务。\n\
  \n\n\n\n\n### 拆分知识\n\n*拆分知识*将职责分离和双人控制的概念结合到一个解决方案中。基本思想是执行某项操作所需的信息或特权在两个或多个用户之间进行划分。这确保了没有任何单个人拥有足够的特权来危害环境的安全。\n\
  \n#### 岗位轮换\n\n通过使用*岗位轮换*，可以进一步控制和限制特权能力。岗位轮换（有时称为职责轮换）简单来说就是员工在不同岗位间轮换，或者至少将部分工作职责轮换给不同的员工。将岗位轮换作为一种安全控制手段，可以提供同行评审、减少欺诈，并实现交叉培训。交叉培训有助于使环境不再依赖任何单一的个人。\n\
  \n岗位轮换既可以起到威慑作用，也可以作为一种检测机制。如果员工知道未来某个时候会有其他人接管他们的工作职责，他们就不太可能参与欺诈活动。如果他们无论如何还是选择这样做，稍后接管工作职责的人很有可能会发现欺诈行为。\n\
  \n#### 强制休假\n\n许多组织要求员工以一周或两周为增量进行*强制休假*。这提供了一种同行评审的形式，并有助于检测欺诈和串通。该政策确保另一名员工接管个人的工作职责至少一周。如果某员工涉及欺诈，接管职责的人很有可能会发现它。\n\
  \n正如岗位轮换政策一样，强制休假既可以起到威慑作用，也可以作为一种检测机制。即使其他人只接管一个人的职责一两周，这通常足以发现异常情况。\n\n#### 特权账户管理\n\
  \n特权账户管理确保人员拥有的特权不超过其所需，且不会滥用这些特权。特权操作是指需要特殊访问权限或提升的权利和许可来执行许多管理和敏感工作任务的活动。这些任务的示例包括创建新用户账户、向路由表添加新路由、更改防火墙的配置，以及访问系统日志和审计文件。使用通用的安全实践（如最小权限原则）可确保只有少数人拥有这些特殊特权。监控可确保被授予这些特权的用户不会滥用它们。\n\
  \n被授予提升权限的账户通常被称为特权实体，它们拥有普通用户无法访问的特殊、更高阶的能力。如果被滥用，这些提升的权利和许可可能会对组织资产的机密性、完整性或可用性造成重大危害。因此，监控特权实体及其访问行为非常重要。\n\
  \n在大多数情况下，这些提升的特权仅限于管理员和某些系统操作员。在此背景下，系统操作员是指需要额外特权来执行特定工作职能的用户。普通用户（或普通系统操作员）只需要最基本的特权来完成工作。\n\
  \n担任这些特权角色的员工通常是受信任的员工。然而，员工从受信任员工转变为不满员工或恶意内部人员的原因有很多。导致受信任员工行为改变的原因可能很简单，比如奖金低于预期、负面的绩效评估，或者仅仅是对另一名员工的个人恩怨。然而，通过监控特殊特权的使用，组织可以威慑员工滥用特权，并在受信任员工确实滥用时检测到该行为。\n\
  \n一般来说，任何类型的管理员账户都具有提升的特权，应当受到监控。也可以在不给予用户完全管理访问权限的情况下授予其提升的特权。考虑到这一点，当用户拥有特定的提升特权时，监控用户活动也很重要。以下列表包含一些需要监控的特权操作示例。\n\
  \n*   访问审计日志\n*   更改系统时间\n*   配置接口\n*   管理用户账户\n*   控制系统重启\n*   控制通信路径\n*   备份和恢复系统\n\
  *   运行脚本/任务自动化工具\n*   配置安全机制控制\n*   使用操作系统控制命令\n*   使用数据库恢复工具和日志文件\n\n有许多自动化工具可用于监控这些活动。当管理员或特权操作员执行其中一项活动时，工具可以记录事件并发送警报。此外，访问审查审计可以检测这些特权的滥用行为。\n\
  \n#### 管理信息生命周期\n\n第 5 章“保护资产安全”讨论了多种保护数据的方法。当然，并非所有数据都值得同等级别的保护。然而，组织会定义数据分类，并根据其分类确定保护数据的方法。组织定义数据分类，并通常将其发布在安全策略中。政府常用的一些数据分类包括绝密、机密、秘密和非密。民用分类包括机密（或专有）、私密、敏感和公开。\n\
  \n安全控制在整个生命周期中保护信息。然而，没有一致的标准来识别数据生命周期的每个阶段或步骤。有人将其简化为简单的“从摇篮到坟墓”，即从创建时到销毁时。以下列表包含用于识别数据生命周期中不同阶段的一些术语：\n\
  \n##### 创建或捕获\n\n数据可以由用户创建，例如用户创建文件时。系统也可以创建数据，例如创建日志条目的监控系统。数据也可以被捕获，例如用户从互联网下载文件且流量通过边界防火墙时。\n\
  \n##### 分类\n\n确保数据尽快被分类非常重要。组织对数据的分类方式不同，但最重要的考虑因素是确保敏感数据被识别并根据其分类得到适当处理。第 5 章讨论了用于定义敏感数据和定义数据分类的不同方法。一旦数据被分类，人员就可以确保根据分类对其进行适当的标记和处理。标记（或标签）数据可确保人员轻松识别数据的价值。人员应在创建数据后尽快对其进行标记。例如，绝密数据的备份应标记为绝密。同样，如果系统处理敏感数据，该系统应标记上相应的标签。除了在外部标记系统外，组织通常还会配置壁纸和屏幕保护程序，以清晰地显示系统上处理的数据级别。例如，如果系统处理秘密数据，其壁纸和屏幕保护程序会明确指示其处理秘密数据。\n\
  \n\n\n\n\n### 数据生命周期管理\n\n#### 存储\n\n数据主要存储在磁盘驱动器上，人员会定期备份有价值的数据。存储数据时，必须确保根据其分类级别应用足够的安全控制来保护数据。这包括应用适当的权限以防止未经授权的披露。敏感数据还应进行加密以保护它。敏感信息的备份存储在本地的一个位置，并将副本存储在异地的另一个位置。物理安全方法可防止这些备份被盗。环境控制可防止因热和湿度等环境破坏导致数据丢失。\n\
  \n#### 使用\n\n使用是指数据在使用中或在网络上传输的任何时候。数据在使用时处于未加密格式。应用程序开发人员需要采取措施，确保任何敏感数据在使用后从内存中清除。传输中的数据（通过网络传输）需要根据数据的价值提供保护。发送前对数据进行加密可提供这种保护。\n\
  \n#### 归档\n\n有时为了遵守要求保留数据的法律或法规而将数据归档。此外，作为基本的安全控制，会备份有价值的数据，以确保即使失去对原始数据的访问，数据仍可用。归档和备份通常存储在异地。传输和存储此数据时，提供的保护级别应与本地存储期间相同。保护级别取决于数据的分类和价值。\n\
  \n#### 销毁或清除\n\n当数据不再需要时，应以无法读取的方式将其销毁。仅仅删除文件并不会真正删除它们，而只是将它们标记为待删除，因此这不是销毁数据的有效方法。技术人员和管理员会在必要时使用各种工具删除文件的所有可读元素。这些工具通常用\
  \ 1 和 0 的模式覆盖文件或磁盘，或使用其他方法粉碎文件。删除敏感数据时，许多组织要求人员销毁磁盘，以确保数据不可访问。美国国家标准与技术研究院（NIST）特别出版物（SP）SP\
  \ 800-88r1《媒体清理指南》提供了如何清理媒体的详细信息。此外，第 5 章介绍了各种销毁和清除数据的方法。\n\n### 服务级别协议\n\n服务级别协议（SLA）是组织与外部实体（如供应商）之间的协议。SLA\
  \ 规定了性能期望，通常还包括供应商未达到这些期望时的惩罚措施。\n\n例如，许多组织使用基于云的服务来租用服务器。供应商提供服务器访问权限并对其进行维护，以确保其可用。组织可以使用\
  \ SLA 来指定可用性，例如最大停机时间。考虑到这一点，组织在与第三方合作时应清楚了解自身需求，并确保 SLA 包含这些需求。\n\n除了 SLA，组织有时还会使用谅解备忘录（MOU）和/或互连安全协议（ISA）。MOU\
  \ 记录了两个实体为共同目标而合作的意向。虽然 MOU 类似于 SLA，但它不那么正式，且不包含任何一方未履行职责时的金钱惩罚。\n\n如果两个或多方计划传输敏感数据，可以使用\
  \ ISA 来指定连接的技术要求。ISA 提供了关于双方如何建立、维护和断开连接的信息。它还可以确定用于保护数据的最低加密方法。\n\n### 人员安全与安保\n\
  \n人员安全问题是安全运营的重要组成部分。数据、服务器甚至整栋建筑等物品总是可以替换的。相比之下，人员是无法替换的。考虑到这一点，组织应实施增强人员安全的安全控制。\n\
  \n例如，考虑由按钮式电子密码锁控制的数据中心出口门。如果火灾导致停电，出口门是自动解锁还是保持锁定？重视服务器室资产胜过人员安全的组织可能会决定在断电时确保门保持锁定。这保护了数据中心的物理资产。然而，这也会危及室内人员的生命，因为他们无法轻松离开房间。相反，重视人员安全胜过数据中心资产的组织将确保断电时锁具解锁出口门。\n\
  \n#### 胁迫\n\n当人员独自工作时，胁迫系统很有用。例如，一名保安可能在下班后独自看守一栋建筑。如果一群人闯入大楼，保安可能无法独自阻止他们。但是，保安可以使用胁迫系统发出警报。简单的胁迫系统只是一个发送求救信号的按钮。监控实体接收求救信号并根据既定程序做出响应。监控实体可以向发送求救信号的人回拨电话或发送短信。在本例中，保安通过确认情况来响应。\n\
  \n安全系统通常包含人员用来验证一切正常或验证存在问题的代码词或短语。例如，表示一切正常的代码短语可以是“everything is awesome”。如果保安无意中激活了胁迫系统，监控实体做出响应，保安说“Everything\
  \ is awesome”并解释发生了什么。但是，如果罪犯控制了保安，他可能会跳过该短语，而是编造一个他意外激活胁迫系统的故事。监控实体会识别出保安跳过了代码短语并派遣援助。\n\
  \n#### 差旅\n\n另一个安全问题是员工差旅，因为罪犯可能会在员工差旅时将其作为目标。对人员进行差旅安全实践培训可以提高他们的安全性并防止安全事件。这包括一些简单的事情，例如在打开酒店房门前验证对方身份。如果客房服务送来免费食物，给前台打个电话可以核实这是否有效或是否为诈骗的一部分。\n\
  \n员工还应被告知差旅时与电子设备（如智能手机、平板电脑和笔记本电脑）相关的诸多风险。这些风险包括：\n\n##### 敏感数据\n\n理想情况下，设备不应包含任何敏感数据。这可以防止设备丢失或被盗时数据泄露。如果员工差旅时需要此数据，应使用强加密进行保护。\n\
  \n##### 恶意软件和监控设备\n\n已有许多报告称员工访问外国时系统被安装恶意软件。同样，我们也听说过员工出国旅行后，设备内部被安装物理监控设备的第一手报告。人们可能认为设备在酒店房间里很安全，因为他们外出去当地餐厅用餐。然而，这足够让看起来像酒店工作人员的人进入房间，在操作系统中安装恶意软件，并在计算机内部安装物理窃听设备。始终保持对设备的物理控制可以防止这些攻击。此外，安全专家建议员工不要携带个人设备，而是携带临时设备在旅行期间使用。旅行结束后，这些设备可以被擦除并重新制作镜像。\n\
  \n\n\n\n\n### 免费 Wi-Fi\n\n免费 Wi-Fi 在旅途中往往颇具吸引力。然而，它很容易成为一个陷阱，被配置用来捕获用户的所有流量。例如，攻击者可以将\
  \ Wi-Fi 连接配置为中间人攻击，强制所有流量经过攻击者的系统。随后，攻击者便可捕获所有流量。复杂的中间人攻击能在客户端与攻击者系统之间建立一个超文本传输安全协议\
  \ (HTTPS) 连接，并在攻击者系统与基于互联网的服务器之间建立另一个 HTTPS 连接。从客户端的角度来看，这看起来像是客户端计算机与基于互联网的服务器之间建立了一条安全的\
  \ HTTPS 连接。然而，所有数据都在攻击者的系统上被解密，且易于查看。相反，用户应拥有创建自己互联网连接的方法，例如通过智能手机或使用 Mi-Fi 设备。\n\
  \n### VPN\n\n雇主应提供虚拟专用网络 (VPN) 的访问权限，以便员工创建安全连接。这些网络可用于访问内部网络中的资源，包括工作相关的电子邮件。\n\
  \n#### 应急管理\n\n应急管理计划和实践有助于组织在灾难发生后解决人员安全与安保问题。灾难可以是自然灾害（如飓风、龙卷风和地震），也可以是人为灾害（如火灾、恐怖袭击或导致大规模停电的网络攻击），详见第\
  \ 18 章“灾难恢复规划”。组织将根据其可能遇到的自然灾害类型制定不同的计划。\n\n#### 安全培训与意识\n\n实施安全培训和意识计划也很重要。这些计划有助于确保人员了解胁迫系统、旅行最佳实践、应急管理计划以及通用的安全最佳实践。\n\
  \n### 安全配置资源\n\n安全运营领域的另一个要素是在资源的整个生命周期中对其进行配置和管理。第 13 章“管理身份和认证”涵盖了作为身份与访问配置生命周期一部分的用户账户配置与取消配置。本节重点关注其他资产类型（如硬件、软件、物理、虚拟和基于云的资产）的配置与管理。\n\
  \n组织应用各种资源保护技术，以确保资源得到安全配置和管理。例如，台式计算机通常使用镜像技术进行部署，以确保它们从一个已知的安全状态启动。变更管理和补丁管理技术确保系统通过所需的更改保持最新状态。这些技术因资源而异，将在以下各节中描述。\n\
  \n#### 管理硬件和软件资产\n\n在此语境下，硬件是指计算机、服务器、路由器、交换机和外设等 IT 资源。软件包括操作系统和应用程序。组织通常执行例行清点以追踪其硬件和软件。\n\
  \n##### 硬件清点\n\n许多组织使用数据库和清点应用程序来执行清点，并在整个设备生命周期中追踪硬件资产。例如，可用的条形码系统可以打印条形码以粘贴在设备上。条形码数据库包含硬件的相关详细信息，如型号、序列号和位置。购买硬件时，会在部署前先贴上条形码。定期，人员使用条形码阅读器扫描所有条形码，以验证组织仍控制着该硬件。\n\
  \n一种类似的方法使用射频识别 (RFID) 标签，它可以向 RFID 阅读器传输信息。人员将 RFID 标签贴在设备上，并使用 RFID 阅读器对设备进行清点。RFID\
  \ 标签和阅读器比条形码和条形码阅读器更昂贵。然而，RFID 方法能显著减少执行清点所需的时间。\n\n在处置设备之前，人员会对其进行清理。清理设备会移除所有数据，以确保未经授权的人员无法访问敏感信息。当设备达到使用寿命终点时，个人很容易忽视其中包含的数据，因此使用清单对系统进行清理通常很有价值。清单可包括对硬盘驱动器、非易失性内存以及系统内的可移动介质（如光盘\
  \ (CD)、数字多功能光盘 (DVD) 和通用串行总线 (USB) 闪存驱动器）进行清理的步骤。NIST 800-88r1 和第 5 章提供了有关驱动器清理程序的更多信息。\n\
  \n存放敏感数据的便携式介质也作为资产进行管理。例如，组织可以用条形码标记便携式介质，并使用条形码清点系统定期完成清点。这使他们能够定期清点存放敏感数据的介质。\n\
  \n##### 软件许可\n\n组织为软件付费，许可密钥常用于激活软件。激活过程通常需要通过互联网联系许可服务器以防止盗版。如果许可密钥泄露到组织外部，可能会导致组织内部的密钥失效。监控许可合规性以避免法律问题也很重要。\n\
  \n例如，组织可能购买了某软件产品五次安装的许可密钥，但最初只安装并激活了一个实例。如果密钥被盗并在组织外部的四个系统上安装，这些激活将会成功。当组织尝试在内部系统上安装该应用程序时，激活将会失败。因此，任何类型的许可密钥对组织都极具价值，应受到保护。\n\
  \n软件许可还指确保系统未安装未经授权的软件。有许多工具可远程检查系统以检测系统详细信息。例如，Microsoft 的 System Center Configuration\
  \ Manager (ConfigMgr 或 SCCM) 是一款服务器产品，可查询网络上的每个系统。ConfigMgr 拥有广泛的功能，包括识别已安装的操作系统和应用程序的能力。这使其能够识别系统上运行的未经授权的软件，并帮助组织确保其遵守软件许可规则。\n\
  \n#### 保护物理资产\n\n物理资产不仅限于 IT 硬件，还包括所有物理资产，如组织的建筑物及其内容。用于保护物理安全资产的方法包括围栏、路障、锁闭的门、警卫、闭路电视\
  \ (CCTV) 系统等。\n\n当组织规划布局时，通常将敏感的物理资产置于建筑物的中心位置。这使组织能够实施逐步增强的物理安全控制。例如，组织会将数据中心置于靠近建筑物中心的位置。如果数据中心位于外墙边，攻击者可能开着卡车撞破墙壁并窃取服务器。\n\
  \n同样，建筑物通常设有任何人均可进入的公共入口。然而，额外的物理安全控制限制了对内部工作区域的访问。密码锁、人员闸、安全徽章和警卫都是常用的访问控制方法。\n\
  \n#### 管理虚拟资产\n\n\n\n\n\n### 虚拟化与基于云的资产管理\n\n#### 虚拟化技术\n\n由于可获得巨大的成本节约，组织正在持续实施越来越多的虚拟化技术。例如，一个组织可以将\
  \ 100 台物理服务器减少到仅 10 台物理服务器，每台物理服务器托管 10 台虚拟服务器。这降低了供暖、通风和空调（HVAC）成本、电力成本以及整体运营成本。\n\
  \n虚拟化不仅限于服务器。**软件定义一切（SDx）** 指的是利用虚拟化以软件取代硬件的趋势。SDx 中的一些虚拟资产包括以下内容：\n\n##### 虚拟机（VM）\n\
  \n**虚拟机** 作为客户操作系统运行在物理服务器上。物理服务器包含额外的处理能力、内存和磁盘存储，以满足虚拟机的需求。\n\n##### 虚拟桌面基础设施（VDI）\n\
  \n**虚拟桌面基础设施（VDI）**，有时称为虚拟桌面环境（VDE），将用户的桌面作为虚拟机托管在服务器上。用户可以连接到服务器，从几乎任何系统（包括移动设备）访问其桌面。**持久虚拟桌面**\
  \ 为用户保留自定义桌面。**非持久虚拟桌面** 对所有用户均相同。如果用户进行了更改，桌面会在用户注销后恢复到已知状态。\n\n##### 软件定义网络（SDN）\n\
  \n**软件定义网络** 将控制平面与数据平面（或转发平面）解耦。控制平面使用协议决定将流量发送到何处，数据平面包含决定是否转发流量的规则。不使用路由器和交换机等传统网络设备，而是由\
  \ **SDN 控制器** 使用接受控制器指令的更简单的网络设备来处理流量路由。这消除了与传统网络协议相关的部分复杂性。\n\n##### 虚拟存储区域网络（VSAN）\n\
  \n**存储区域网络（SAN）** 是托管多个存储设备的专用高速网络。它们通常用于需要高速访问数据的服务器。由于 SAN 复杂的硬件要求，历史上这些设备价格昂贵。**虚拟存储区域网络（VSAN）**\
  \ 利用虚拟化绕过了这些复杂性。\n\n虚拟化中的主要软件组件是 **管理程序**。管理程序管理虚拟机、虚拟数据存储和虚拟网络组件。作为物理服务器上额外的一层软件，它代表了额外的攻击面。如果攻击者能够攻破物理主机，则攻击者可能访问托管在该物理服务器上的所有虚拟系统。管理员通常会采取额外措施，确保虚拟主机经过加固。\n\
  \n尽管虚拟化可以简化许多 IT 概念，但必须记住，许多相同的基本安全要求仍然适用。例如，每个虚拟机仍需单独更新。更新宿主系统不会更新虚拟机。此外，组织应维护其虚拟资产的备份。许多虚拟化工具包含用于创建虚拟系统完整备份和创建定期快照的内置工具，从而允许相对轻松地进行时间点恢复。\n\
  \n#### 管理基于云的资产\n\n**基于云的资产** 包括组织使用云计算访问的任何资源。**云计算** 指对几乎随处可用的计算资源的按需访问，云计算资源具有高可用性且易于扩展。组织通常从组织外部租赁基于云的资源，但也可以在组织内部托管内部部署资源。托管在组织外部的基于云的资源的主要挑战之一是，它们不在组织的直接控制之下，这使得风险管理更加困难。\n\
  \n某些基于云的服务仅提供数据存储和访问。在云中存储数据时，组织必须确保已实施安全控制，以防止未经授权访问数据。此外，组织应正式定义存储和处理云中存储数据的要求。例如，**美国国防部（DoD）云计算安全要求指南**\
  \ 定义了美国政府机构在评估云计算资产使用时必须遵循的具体要求。该文件使用六个单独的信息影响级别，标识了标记为“机密”及以下资产的计算要求。\n\n根据服务模型的不同，对资产的责任程度也有所不同。这包括维护资产、确保其保持功能正常，以及使系统和应用程序保持最新补丁的最新状态。在某些情况下，**云服务提供商（CSP）**\
  \ 负责这些步骤。在其他情况下，消费者负责这些步骤。\n\n##### 软件即服务（SaaS）\n\n**软件即服务（SaaS）** 模型提供通常可通过 Web\
  \ 浏览器访问的全功能应用程序。例如，Google 的 Gmail 就是一种 SaaS 应用程序。CSP（本例中为 Google）负责 SaaS 服务的所有维护。消费者不管理也不控制任何基于云的资产。\n\
  \n##### 平台即服务（PaaS）\n\n**平台即服务（PaaS）** 模型为消费者提供计算平台，包括硬件、操作系统和应用程序。在某些情况下，消费者从 CSP\
  \ 提供的选择列表中安装应用程序。消费者管理其应用程序，并可能管理主机上的某些配置设置。然而，CSP 负责主机和底层云基础设施的维护。\n\n##### 基础设施即服务（IaaS）\n\
  \n**基础设施即服务（IaaS）** 模型为消费者提供基本计算资源。这包括服务器、存储，以及在某些情况下的网络资源。消费者安装操作系统和应用程序，并对操作系统和应用程序执行所有必需的维护。CSP\
  \ 维护基于云的基础设施，确保消费者能够访问租赁的系统。在评估公共服务时，IaaS 和 PaaS 模型之间的区别并不总是清晰的。然而，在租赁基于云的服务时，CSP\
  \ 使用的标签不如清楚地了解谁负责执行不同的维护和安全操作那么重要。\n\n云部署模型也会影响基于云的资产的责任划分。可用的四种云模型为公有云、私有云、社区云和混合云。\n\
  \n*   **公有云** 模型包含可供任何消费者租赁的资产，由外部 CSP 托管。服务级别协议能有效确保 CSP 以组织可接受的水平提供基于云的服务。\n*\
  \   **私有云** 部署模型用于单个组织的基于云的资产。组织可以使用自己的内部部署资源创建和托管私有云。如果是这样，组织负责所有维护。然而，组织也可以从第三方租赁资源供组织专用。维护要求通常根据服务模型（SaaS、PaaS\
  \ 或 IaaS）进行划分。\n*   **社区云** 部署模型向两个或多个组织提供基于云的资产。资产可由一个或多个组织拥有和管理。维护责任根据托管资产的一方和服务模型共同承担。\n\
  *   **混合云** 模型包含两种或多种云的组合。与社区云模型类似，维护责任根据托管资产的一方和正在使用的服务模型共同承担。\n\n### 媒体管理\n\n\n\
  \n\n\n### 媒体管理\n\n媒体管理是指为保护存储在媒体上的媒体和数据而采取的步骤。在此语境下，媒体是指任何可以存放数据的介质。它包括磁带、光学介质（如\
  \ CD 和 DVD）、便携式 USB 驱动器、外置 SATA (eSATA) 驱动器、内置硬盘驱动器、固态硬盘和 USB 闪存驱动器。许多便携式设备（如智能手机）也属于此类，因为它们包含可存放数据的存储卡。备份通常存储在磁带上，因此媒体管理与磁带直接相关。然而，媒体管理不仅限于备份磁带，还延伸至任何可以存放数据的媒体类型。它还包括任何类型的硬拷贝数据。\n\
  \n当媒体包含敏感信息时，应将其存储在具有严格访问控制的安全位置，以防止因未经授权的访问而导致损失。此外，用于存储媒体的任何位置都应具备温度和湿度控制，以防止因损坏导致损失。\n\
  \n媒体管理还可以包括技术控制，以限制计算机系统对设备的访问。例如，许多组织使用技术控制来阻止 USB 驱动器的使用，和/或检测并记录用户尝试使用它们的行为。在某些情况下，书面安全策略禁止使用\
  \ USB 闪存驱动器，自动检测方法会检测并报告任何违规行为。\n\n妥善管理媒体直接关系到机密性、完整性和可用性。当媒体被正确标记、处理和存储时，有助于防止未经授权的披露（机密性丧失）、未经授权的修改（完整性丧失）和未经授权的销毁（可用性丧失）。\n\
  \n#### 磁带媒体\n\n组织通常将备份存储在磁带上，且磁带极易因损坏而导致数据丢失。作为最佳实践，组织至少保留两份备份副本。他们在本地保留一份副本以备即时使用，并将第二份副本存储在异地的安全位置。如果火灾等灾难性事件摧毁了主站点，数据仍可在备用站点获取。\n\
  \n存储区域的洁净度将直接影响磁带媒体的使用寿命和可用性。此外，磁场可充当消磁器，擦除或损坏磁带上的数据。考虑到这一点，磁带不应暴露在可能来自电梯电机和某些打印机等来源的磁场中。以下是管理磁带媒体的一些有用指南：\n\
  \n*   在需要之前，将新媒体保留在其原始密封包装中，以防止灰尘和污垢污染。\n*   打开媒体包装时，要格外小心，避免以任何方式损坏媒体。这包括避免使用尖锐物体，以及不扭曲或弯曲媒体。\n\
  *   避免让媒体暴露在极端温度下；不应将其存放在靠近加热器、散热器、空调或其他极端温度源的地方。\n*   不要使用已损坏、暴露在异常灰尘和污垢中或跌落过的媒体。\n\
  *   媒体应在温控车辆中从一个站点运输到另一个站点。\n*   媒体应防止暴露在外部环境中；避免阳光、潮湿、湿度、高温和低温。使用前应适应环境 24 小时。\n\
  *   从备份设备离开到安全的异地存储设施这一全过程中，应对媒体保持适当的安全控制。媒体在运输过程中的任何时刻都容易遭受损坏和盗窃。\n*   基于媒体上数据的分级，在媒体的整个生命周期内应保持适当的安全控制。\n\
  *   考虑对备份进行加密，以防备份磁带丢失或被盗时发生未经授权的数据泄露。\n\n#### 移动设备\n\n移动设备包括智能手机和平板电脑。这些设备拥有内部存储器或可移动存储卡，可存放大量数据。数据可包括带附件的电子邮件、联系人和日程信息。此外，许多设备包含允许用户阅读和操作不同类型文档的应用程序。\n\
  \n许多组织向用户发放移动设备，或实施“自主选择设备”(CYOD) 策略，允许员工在组织网络中使用特定设备。虽然一些组织仍支持“自带设备”(BYOD) 策略，允许员工使用任何类型的设备，但这已被证明极具挑战性，组织往往转而采用\
  \ CYOD 策略。管理员将员工设备注册到移动设备管理 (MDM) 系统中。MDM 系统监控和管理设备，并确保它们保持最新状态。\n\n组织在用户手机上启用的一些常见控制包括加密、屏幕锁定、全球定位系统\
  \ (GPS) 和远程擦除。加密可在手机丢失或被盗时保护数据，屏幕锁定可延缓可能窃取手机的人员，GPS 可在手机丢失或被盗时提供位置信息。远程擦除信号可发送给丢失的设备，以删除设备上的部分或全部数据。许多设备在远程擦除成功后会发送确认消息。\n\
  \n#### 管理媒体生命周期\n\n所有媒体都有其有用但有限的生命周期。可重复使用的媒体受限于 `平均故障时间 (MTTF)`，有时以可重复使用的次数或预期可保存的年数来表示。例如，某些磁带的规格说明称其最多可重复使用\
  \ 250 次，或在理想条件下可保存长达 30 年。然而，许多变量会影响媒体的寿命并降低这些估计值。监控备份错误并将其作为衡量您环境中媒体寿命的指南非常重要。当磁带开始产生错误时，技术人员应将其轮换退役。\n\
  \n一旦备份媒体达到其 MTTF，应将其销毁。磁带上数据的分级将决定销毁媒体的方法。一些组织在高度机密磁带达到使用寿命末期时对其进行消磁，然后将其存储直到可以销毁磁带。磁带通常在大型碎纸机或焚烧炉中批量销毁。\n\
  \n第 5 章讨论了固态硬盘 (SSD) 的一些安全挑战。具体而言，消磁无法清除 SSD 上的数据，内置擦除命令通常也无法清理整个磁盘。许多组织选择销毁 SSD，而不是尝试从中清除数据。\n\
  \n### 管理配置\n\n配置管理有助于确保系统以安全一致的状态部署，并在其整个生命周期内保持安全一致的状态。基线和镜像常用于部署系统。\n\n#### 基线化\n\
  \n基线是一个起点。在配置管理的语境下，它是系统的起始配置。管理员通常在部署系统后修改基线，以满足不同的需求。然而，如果系统以安全状态和安全基线部署，它们更有可能保持安全。如果组织建立了有效的变更管理计划，这一点尤其正确。\n\
  \n基线可以通过清单来创建，清单要求某人确保系统以特定方式或特定配置部署。然而，手动基线容易受人为错误影响。人员很容易遗漏步骤或意外错误配置系统。\n\n\n\n\
  \n\n### 使用脚本和自动化操作系统工具实施基线是更好的替代方案\n\n这具有很高的效率，并降低了出错的可能性。以 Microsoft 操作系统为例，其包含组策略。管理员只需配置一次组策略设置，即可自动将该设置应用到域中的所有计算机。\n\
  \n#### 使用镜像进行基线部署\n\n许多组织使用镜像来部署基线。图 16.2 展示了在整体三步流程中创建和部署基线镜像的过程。以下是具体步骤：\n\n![FIGURE\
  \ 16.2 Creating and deploying images](img/c16f002.jpg)\n\n**图 16.2** 创建和部署镜像\n\n\
  1.  管理员首先在一台计算机上安装操作系统和所有所需的应用程序（在图中标记为基线系统）。然后，管理员使用相关的安全设置和其他设置配置系统，以满足组织的需求。人员随后执行广泛的测试，以确保系统按预期运行，然后再进入下一步。\n\
  \n2.  接下来，管理员使用镜像软件捕获系统的镜像，并将其存储在服务器上（在图中标记为镜像服务器）。也可以将镜像存储在外部硬盘驱动器、USB 驱动器或 DVD\
  \ 上。\n\n3.  然后，人员根据需要将镜像部署到各个系统。这些系统通常需要额外的配置来完成最终设置，例如分配唯一名称。然而，这些系统的整体配置与基线系统相同。\n\
  \n基线镜像通过确保所需的安全设置始终正确配置，提高了系统的安全性。此外，它们减少了部署和维护系统所需的时间，从而降低了总体维护成本。部署预构建的镜像可能只需要技术人员几分钟的时间。此外，当用户的系统损坏时，技术人员可以在几分钟内重新部署镜像，而不必花费数小时进行故障排除或尝试从头重建系统。\n\
  \n将镜像技术与其他自动化基线方法相结合是常见的做法。换句话说，管理员可以为组织内的所有台式计算机创建一个镜像。然后，他们使用自动化方法为特定计算机组添加额外的应用程序、功能或设置。例如，某个部门的计算机可能通过脚本或其他自动化工具应用额外的安全设置或应用程序。\n\
  \n组织通常会保护基线镜像，以确保它们不被修改。在最坏的情况下，恶意软件可能被注入镜像，然后部署到网络内的系统中。\n\n#### 管理变更\n\n以安全状态部署系统是一个良好的开端。然而，确保系统保持同等级别的安全性也同样重要。`变更管理`\
  \ 有助于减少由未授权变更导致的意外中断。\n\n变更管理的主要目标是确保变更不会导致中断。变更管理流程确保相关人员在实施前审查并批准变更，并确保人员对变更进行测试和记录。\n\
  \n变更往往会产生意外的副作用，从而导致中断。管理员可能会更改一个系统以解决一个问题，却不知不觉地导致其他系统出现问题。请参考 图 16.3。Web 服务器可从互联网访问，并访问内部网络上的数据库。管理员已在防火墙\
  \ 1 上配置适当的端口以允许互联网流量访问 Web 服务器，并在防火墙 2 上配置适当的端口以允许 Web 服务器访问数据库服务器。\n\n![FIGURE\
  \ 16.3 Web server and database server](img/c16f003.jpg)\n\n**图 16.3** Web 服务器和数据库服务器\n\
  \n一位好心的防火墙管理员可能会在防火墙 2 上看到一个无法识别的开放端口，并出于安全考虑决定将其关闭。不幸的是，Web 服务器需要此端口开放以与数据库服务器通信，因此当端口关闭时，Web\
  \ 服务器将开始出现问题。很快，服务台将被修复 Web 服务器的请求淹没，人们开始对其进行故障排除。他们请求 Web 服务器程序员协助，经过一些故障排除后，开发人员意识到数据库服务器没有响应查询。然后他们叫来数据库管理员对数据库服务器进行故障排除。经过一番大吵大闹、互相推卸责任和指责后，有人意识到防火墙\
  \ 2 上一个必需的端口被关闭了。他们打开该端口并解决了问题。至少直到这位好心的防火墙管理员再次将其关闭，或开始摆弄防火墙 1 为止。\n\n未授权的变更直接影响\
  \ CIA 三要素中的 `A`——可用性。然而，变更管理流程为各种 IT 专家提供了机会，在技术人员实施变更之前，审查拟议变更可能产生的意外副作用。它们还给管理员时间在受控环境中检查他们的工作，然后再在生产环境中实施变更。\n\
  \n此外，某些变更可能会削弱或降低安全性。例如，如果组织没有使用有效的访问控制模型来授予用户访问权限，管理员可能无法跟上额外访问请求的步伐。沮丧的管理员可能会决定将一组用户添加到网络中的管理员组。用户现在将拥有他们所需的所有访问权限，提高了他们使用网络的能力，并且不再因访问请求而打扰管理员。然而，以这种方式授予管理员访问权限直接违反了最小权限原则，并显著削弱了安全性。\n\
  \n##### 安全影响分析\n\n变更管理流程确保人员可以执行安全影响分析。专家评估变更，以在人员将变更部署到生产环境之前识别任何安全影响。\n\n变更管理控制提供了一个控制、记录、跟踪和审计所有系统变更的流程。这包括系统任何方面的变更，包括硬件和软件配置。组织在任何系统的整个生命周期中实施变更管理流程。\n\
  \n变更管理流程中的常见任务如下：\n\n1.  **请求变更。** 一旦人员确定了所需的变更，他们就会请求变更。一些组织使用内部网站，允许人员通过网页提交变更请求。该网站会自动将请求记录在数据库中，这允许人员跟踪变更。它还允许任何人查看变更请求的状态。\n\
  \n2.  **审查变更。** 组织内的专家审查变更。审查变更的人员通常来自组织内的几个不同领域。在某些情况下，他们可能会迅速完成审查并批准或拒绝变更。在其他情况下，变更可能需要在广泛测试后，由正式的变更审查委员会批准。\n\
  \n3.  **批准/拒绝变更。** 基于审查结果，这些专家随后批准或拒绝变更。他们还会在变更管理文档中记录响应。例如，如果组织使用内部网站，有人会在网站的数据库中记录结果。在某些情况下，变更审查委员会可能要求制定回滚或退出计划。这确保了如果变更导致故障，人员可以将系统恢复到其原始状态。\n\
  \n4.  **测试变更。** 一旦变更获批，就应该对其进行测试，最好在非生产服务器上进行。测试有助于验证变更不会导致意外问题。\n\n\n\n\n\n###\
  \ 5. 计划并实施变更\n\n变更会被安排计划，以便以对系统和系统客户影响最小的方式实施。这可能要求在非值班时间或非高峰时段安排变更。\n\n### 6. 记录变更\n\
  \n最后一步是记录变更，以确保所有相关方知情。这通常需要更新配置管理文档。如果发生无关灾难，要求管理员重建系统，变更管理文档将为他们提供变更信息。这确保他们能将系统恢复到变更前的状态。\n\
  \n有时可能需要紧急变更。例如，如果攻击或恶意软件感染导致一个或多个系统瘫痪，管理员可能需要对系统或网络进行变更以遏制事件。在这种情况下，管理员仍需记录这些变更。这确保变更审查委员会可以审查变更的潜在问题。此外，记录紧急变更可确保受影响的系统在需要重建时包含新配置。\n\
  \n当强制执行变更管理流程时，它会为系统的所有变更创建文档。如果人员需要撤销变更，这提供了信息追踪。如果人员需要在其他系统上实施相同的变更，文档也提供了可遵循的路线图或程序。\n\
  \n变更管理控制是 ISO 通用准则中某些安全保证要求（SAR）的强制性要素。然而，许多不要求遵守 ISO 通用准则的组织也实施了变更管理控制。它通过防止导致意外损失的未授权变更，提高了环境的安全性。\n\
  \n#### 版本控制\n\n版本控制通常指软件配置管理中使用的版本控制。标签或编号系统用于区分跨多台机器或单台机器在不同时间点的不同软件集和配置。例如，应用程序的第一个版本可能标记为\
  \ `1.0`。第一个小版本更新将标记为 `1.1`，第一个大版本更新将是 `2.0`。这有助于跟踪已部署软件随时间发生的变更。\n\n虽然大多数成熟的软件开发人员认识到版本控制和修订控制在应用程序中的重要性，但许多新晋\
  \ Web 开发人员并不认识到其重要性。这些 Web 开发人员学习了一些用于创建很棒网站的优秀技能，但并不总是认识到底层原则（如版本控制）的重要性。如果他们不通过某种版本控制系统来控制变更，可能会实施一个实际上导致网站瘫痪的变更。\n\
  \n#### 配置文档\n\n配置文档标识系统的当前配置。它标识系统负责人和系统用途，并列出应用于基线的所有变更。多年前，许多组织使用简单的纸质笔记本记录服务器的此类信息，但如今将这些信息存储在文件或数据库中要普遍得多。当然，将文档存储在数据文件中的挑战在于，在停机期间可能无法访问。\n\
  \n### 管理补丁与减少漏洞\n\n补丁管理和漏洞管理流程协同工作，帮助保护组织免受新兴威胁的侵害。操作系统和应用程序中会定期发现 Bug 和安全漏洞。发现后，供应商会编写并测试补丁以消除漏洞。补丁管理确保应用适当的补丁，漏洞管理有助于验证系统不易受已知威胁的影响。\n\
  \n#### 管理的系统\n\n值得强调的是，补丁和漏洞管理不仅适用于工作站和服务器。它也适用于任何带有操作系统的计算设备。网络基础设施系统（如路由器、交换机、防火墙、设备（如统一威胁管理设备）和打印机）都包含某种类型的操作系统。有些基于\
  \ Cisco，有些基于 Microsoft，还有些基于 Linux。\n\n嵌入式系统是指具有中央处理单元（CPU）、运行操作系统，并拥有一个或多个旨在执行一个或多个功能的应用程序的设备。示例包括摄像头系统、智能电视、家用电器（如防盗报警系统、无线恒温器和冰箱）、汽车、医疗设备等。这些设备有时被称为物联网（IoT）。\n\
  \n这些设备可能存在需要补丁的漏洞。例如，2016 年底针对域名系统（DNS）服务器的大规模*分布式拒绝服务*攻击，通过阻止用户访问数十个网站，实际上导致了互联网瘫痪。据报道，攻击者使用\
  \ Mirai 恶意软件控制物联网设备（如互联网协议 [IP] 摄像头、婴儿监视器和打印机）并将它们加入*僵尸网络*。数千万台设备向 DNS 服务器发送 DNS\
  \ 查找请求，有效地使其过载。显然，这些设备应打补丁以防止此类攻击重演，但许多制造商、组织和所有者并不给物联网设备打补丁。更糟的是，许多供应商甚至不发布补丁。\n\
  \n最后，如果组织允许员工在组织网络内使用移动设备（如智能手机和平板电脑），这些设备也应纳入管理。\n\n#### 补丁管理\n\n补丁是一个统称，指为修正 Bug\
  \ 或漏洞或改进现有软件性能而编写的任何类型的代码。软件可以是操作系统，也可以是应用程序。补丁有时被称为更新、快速修复和热修复。在安全语境下，管理员主要关注安全补丁，即影响系统漏洞的补丁。\n\
  \n尽管供应商定期编写并发布补丁，但这些补丁只有在应用后才有用。这似乎显而易见，但许多安全事件发生的原因仅仅是组织未实施补丁管理策略。例如，第 14 章讨论了\
  \ 2017 年对 Equifax 的多次攻击。2017 年 5 月的攻击利用了 Apache Struts Web 应用程序中的一个漏洞，本可以在 2017\
  \ 年 3 月修补。\n\n一个有效的*补丁管理*计划确保系统通过最新补丁保持最新状态。有效补丁管理计划中的常见步骤如下：\n\n##### 评估补丁\n\n\
  当供应商宣布或发布补丁时，管理员会对其进行评估，以确定它们是否适用于其系统。例如，修复配置为域名系统（DNS）服务器的 Unix 系统漏洞的补丁，与运行 Windows\
  \ 版 DNS 的服务器无关。同样，如果功能未安装，则不需要修复 Windows 系统上运行功能的补丁。\n\n##### 测试补丁\n\n只要可能，管理员会在隔离的非生产系统上测试补丁，以确定补丁是否会导致任何不良副作用。最坏的情况是应用补丁后系统将无法启动。例如，补丁偶尔会导致系统开始无限重启循环。它们启动进入停止错误，并不断尝试重启以从错误中恢复。如果测试在单个系统上显示此问题，则仅影响一台系统。然而，如果组织在测试前将补丁应用到一千台计算机，可能会造成灾难性后果。\n\
  \n\n\n\n\n### 补丁管理流程\n\n#### 批准补丁\n管理员测试补丁并确定其安全后，会批准补丁进行部署。通常会将变更管理流程（本章前面已介绍）作为批准流程的一部分。\n\
  \n#### 部署补丁\n测试和批准完成后，管理员部署补丁。许多组织使用自动化方法来部署补丁。这些可以是第三方产品，也可以是软件供应商提供的产品。\n\n####\
  \ 验证补丁是否已部署\n部署补丁后，管理员会定期测试和审核系统，以确保系统保持已修补状态。许多部署工具都包含审核系统的功能。此外，许多漏洞评估工具也包含检查系统以确保其安装了适当补丁的功能。\n\
  \n### 漏洞管理\n\n漏洞管理是指定期识别漏洞、评估漏洞，并采取措施缓解与之相关的风险。无法消除风险。同样，也无法消除所有漏洞。然而，有效的漏洞管理计划有助于组织确保其定期评估漏洞，并缓解那些代表最大风险的漏洞。漏洞管理计划的两个常见要素是例行漏洞扫描和定期漏洞评估。\n\
  \n#### 漏洞扫描\n\n**漏洞扫描器**是用于测试系统和网络已知安全问题的软件工具。攻击者使用漏洞扫描器来检测系统和网络中的弱点，例如缺失的补丁或弱密码。检测到弱点后，他们会发起攻击以利用这些弱点。许多组织的管理员使用同类型的漏洞扫描器来检测其网络上的漏洞。他们的目标是在攻击者发现这些漏洞之前检测并缓解它们。\n\
  \n正如防病毒软件使用特征库来检测已知病毒一样，漏洞扫描器包含一个已知安全问题的数据库，并根据该数据库检查系统。供应商会定期更新此数据库，并向客户出售更新订阅。如果管理员不保持漏洞扫描器为最新状态，他们将无法检测到较新的威胁。这类似于防病毒软件如果没有当前的病毒特征定义，将无法检测到较新的病毒。\n\
  \n**Nessus** 是由 Tenable Network Security 管理的一款流行漏洞扫描器，它结合多种技术来检测各种漏洞。Nessus 分析系统发出的数据包以确定系统的操作系统及其他详细信息。它使用端口扫描来检测开放端口，并识别这些系统上可能正在运行的服务和协议。一旦\
  \ Nessus 发现了关于系统的基本详细信息，它便可以通过查询进一步测试系统的已知漏洞，例如系统是否安装了当前的补丁。它还可以发现网络上使用 IP 探测和 Ping\
  \ 扫描的潜在恶意系统。\n\n重要的是要认识到，漏洞扫描器的功能不仅仅是检查未打补丁的系统。例如，如果系统正在运行数据库服务器应用程序，扫描器可以检查数据库是否使用带有默认账户的默认密码。同样，如果系统托管了一个网站，扫描器可以检查该网站以确定其是否使用输入验证技术来防止不同类型的注入攻击，例如\
  \ SQL 注入或跨站脚本攻击。\n\n在一些大型组织中，专门的安全团队将使用可用工具执行定期漏洞扫描。在较小的组织中，IT 或安全管理员可能会将扫描作为其其他职责的一部分来执行。但请记住，如果负责部署补丁的人员也负责运行扫描以检查补丁，这代表了潜在的利益冲突。如果某些因素阻止管理员部署补丁，该管理员也可能会跳过本应检测到未打补丁系统的扫描。\n\
  \n扫描器包含生成报告的功能，以标识其发现的任何漏洞。报告可能建议应用补丁或进行特定的配置或安全设置更改，以改进或强制实施安全性。显然，仅仅建议应用补丁并不能减少漏洞。管理员需要采取措施来应用补丁。\n\
  \n然而，在某些情况下，这样做可能不可行或不可取。例如，如果修复次要安全问题的补丁破坏了系统上的应用程序，管理层可能会决定在开发人员创建变通方法之前不实施该修复。即使组织已处理了该风险，漏洞扫描器仍会定期报告该漏洞。\n\
  \n相反，从不执行漏洞扫描的组织可能会存在许多漏洞。此外，这些漏洞将保持未知状态，管理层将没有机会决定缓解哪些漏洞、接受哪些漏洞。\n\n#### 漏洞评估\n\
  \n漏洞评估通常包含漏洞扫描的结果，但评估的作用不止于此。例如，年度漏洞评估可能会分析过去一年所有的漏洞扫描报告，以确定组织是否在处理漏洞。如果同一漏洞在每份漏洞扫描报告中都重复出现，一个合乎逻辑的问题是：“为什么这还没有得到缓解？”可能有正当理由且管理层选择了接受风险，也可能是执行了漏洞扫描但从未采取行动来缓解发现的漏洞。\n\
  \n漏洞评估通常作为风险分析或风险评估的一部分进行，以识别某一时间点的漏洞。此外，漏洞评估还可以检查其他领域以确定风险。例如，漏洞评估可以检查敏感信息在其整个生命周期中是如何被标记、处理、存储和销毁的，以解决潜在漏洞。\n\
  \n第 15 章“安全评估与测试”涵盖了渗透测试。许多渗透测试始于漏洞评估。\n\n### 常见漏洞与披露\n\n漏洞通常使用**常见漏洞与披露（CVE）**字典来引用。CVE\
  \ 字典提供了一种用于识别漏洞的标准约定。MITRE 维护 CVE 数据库，您可以在此处查看：[www.cve.mitre.org](http://www.cve.mitre.org)。\n\
  \n补丁管理和漏洞管理工具在扫描特定漏洞时，通常使用 CVE 字典作为标准。例如，前面提到的 WannaCry 勒索软件利用了未打补丁的 Windows 系统中的漏洞，微软发布了微软安全公告\
  \ MS17-010 并附带更新以防止该攻击。同一漏洞被标识为 **CVE-2017-0143**。\n\nCVE 数据库使创建补丁管理和漏洞管理工具的公司受益。它们无需花费任何资源来管理漏洞的命名和定义，而是可以专注于用于检查系统漏洞的方法。\n\
  \n### 摘要\n\n\n\n\n\n### 几项基本安全原则\n\n几项基本安全原则构成了任何环境中安全运营的核心。这些原则包括知情需要、最小权限、职责分离与责任分离、轮岗以及强制休假。这些实践相结合，有助于防止安全事件的发生，并限制确实发生的事件的影响范围。管理员和操作员需要特殊权限才能遵循这些安全原则执行其工作。除了实施这些原则外，监控特权活动以确保特权实体不滥用其访问权限也至关重要。\n\
  \n### 资源保护\n\n通过资源保护，包含数据的介质和其他资产在其整个生命周期内得到保护。介质包括任何能够存放数据的载体，例如磁带、内部驱动器、便携式驱动器（`USB`、`FireWire`\
  \ 和 `eSATA`）、CD 和 DVD、移动设备、存储卡以及打印输出件。存放敏感信息的介质应使用组织认可的方法进行标记、处理、存储和销毁。资产管理不仅限于介质，还延伸至组织认为有价值的任何资产——例如计算机等物理资产，以及购买的应用程序和软件密钥等软件资产。\n\
  \n#### 虚拟资产\n\n虚拟资产包括虚拟机、虚拟桌面基础设施（`VDI`）、软件定义网络（`SDN`）和虚拟存储区域网络（`VSAN`）。管理程序是管理虚拟组件的软件组件。管理程序增加了额外的攻击面，因此确保其以安全状态部署并及时应用补丁保持最新非常重要。此外，每个虚拟组件都需要单独更新。\n\
  \n#### 基于云的资产\n\n基于云的资产包括存储在云中的任何资源。在与云服务提供商谈判时，您必须了解谁负责维护和安全。一般来说，云服务提供商对软件即服务（`SaaS`）资源承担最大责任，对平台即服务（`PaaS`）产品承担较少责任，对基础设施即服务（`IaaS`）产品承担最小责任。许多组织在签订基于云的服务合同时会使用服务级别协议（`SLA`）。`SLA`\
  \ 规定了性能预期，且通常包含供应商未达标时的惩罚条款。\n\n### 变更与配置管理\n\n变更管理和配置管理是有助于减少停机的两项额外控制措施。配置管理确保系统以一致且已知安全的方式部署。镜像是一种常见的配置管理技术，可确保系统从已知基线启动。变更管理有助于减少由未授权变更导致的意外停机，还能防止变更削弱安全性。\n\
  \n### 补丁与漏洞管理\n\n补丁管理和漏洞管理程序协同工作，使系统免受已知漏洞的侵害。补丁管理使系统通过相关补丁保持最新状态。漏洞管理包括漏洞扫描，以检查各种已知漏洞（包括未打补丁的系统），并包含作为风险评估一部分进行的漏洞评估。\n\
  \n### 考试要点\n\n#### 理解知情需要和最小权限原则\n\n**理解知情需要和最小权限原则。** 知情需要和最小权限原则是在安全网络中实施的两项标准\
  \ IT 安全原则。它们限制对数据和系统的访问，使得用户和其他主体仅能访问其所需的内容。这种有限的访问有助于防止安全事件，并在事件发生时限制其影响范围。如果不遵循这些原则，安全事件将给组织造成更大的损害。\n\
  \n#### 理解职责分离和轮岗\n\n**理解职责分离和轮岗。** 职责分离是一项基本安全原则，确保没有单个人能够控制关键功能或系统的所有要素。通过轮岗，员工会轮换到不同的岗位，或将任务分配给不同的员工。串通是指多人达成协议实施某些未授权或非法行为。实施这些策略通过限制个人在不串通他人的情况下所能采取的行动，有助于防止欺诈。\n\
  \n#### 理解监控特权操作的重要性\n\n**理解监控特权操作的重要性。** 特权实体是受信任的，但它们可能滥用特权。因此，监控所有特权分配和特权操作的使用非常重要。目标是确保受信任的员工不滥用被授予的特殊权限。监控这些操作还可以检测到许多攻击，因为攻击者在攻击过程中通常会使用特殊权限。\n\
  \n#### 理解信息生命周期\n\n**理解信息生命周期。** 数据需要在其整个生命周期内得到保护。这始于对数据进行适当的分类和标记。还包括对数据进行适当的处理、存储和销毁。\n\
  \n#### 理解服务级别协议\n\n**理解服务级别协议。** 组织与供应商等外部实体使用服务级别协议（`SLA`）。它们规定了性能预期，例如最长停机时间，且通常包含供应商未达标时的惩罚条款。\n\
  \n#### 理解安全供应概念\n\n**理解安全供应概念。** 资源的安全供应包括确保资源以安全方式部署，并在其整个生命周期内以安全方式维护。例如，台式个人计算机（`PC`）可以使用安全镜像进行部署。\n\
  \n#### 理解虚拟资产\n\n**理解虚拟资产。** 虚拟资产包括虚拟机、虚拟桌面基础设施、软件定义网络和虚拟存储区域网络。管理程序是管理虚拟资产的主要软件组件，但管理程序也为攻击者提供了额外的攻击目标。确保托管虚拟资产的物理服务器针对操作系统和管理程序应用适当的补丁以保持最新非常重要。此外，所有虚拟机都必须保持最新状态。\n\
  \n#### 识别基于云的资产的安全问题\n\n**识别基于云的资产的安全问题。** 基于云的资产包括通过云访问的任何资源。将数据存储在云中会增加风险，因此可能需要采取额外措施来保护数据，具体取决于其价值。租用基于云的服务时，您必须了解谁负责维护和安全。在\
  \ `IaaS` 模型中，云服务提供商提供的维护和安全最少。\n\n#### 解释配置和变更控制管理\n\n**解释配置和变更控制管理。** 有效的配置和变更管理计划可以防止许多停机和事件。配置管理确保系统配置相似，且系统配置是已知且有文档记录的。基线化确保系统使用通用基线或起点进行部署，镜像是一种常见的基线化方法。变更管理有助于减少由未授权变更导致的停机或安全性削弱。变更管理流程要求变更必须被请求、批准、测试和记录。版本控制使用标签或编号系统来跟踪更新版本软件中的变更。\n\
  \n#### 理解补丁管理\n\n**理解补丁管理。** 补丁管理确保系统通过当前补丁保持最新状态。您应该知道，有效的补丁管理计划将评估、测试、批准和部署补丁。此外，请注意系统审计会验证已批准补丁向系统的部署。补丁管理通常与变更和配置管理交织在一起，以确保文档反映这些变更。当组织没有有效的补丁管理计划时，往往会因本可预防的已知问题而遭遇停机和事件。\n\
  \n\n\n\n**解释漏洞管理。** 漏洞管理包括例行漏洞扫描和定期漏洞评估。漏洞扫描器可以检测已知的安全漏洞和弱点，例如缺失补丁或弱密码。它们生成报告，指示系统的技术漏洞，并作为补丁管理计划的有效检查手段。漏洞评估不仅限于技术扫描，还可以包括审查和审计以检测漏洞。\n\
