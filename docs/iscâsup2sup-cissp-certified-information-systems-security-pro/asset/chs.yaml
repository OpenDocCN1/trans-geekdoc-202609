  \n    1.  版权\n    2.  商标\n    3.  专利\n    4.  商业秘密\n\n9.  Richard 最近为新产品想到了一个绝佳的名称，并计划立即开始使用。他咨询了律师并提交了适当的申请以保护产品名称，但尚未收到政府关于其申请的回复。他希望立即开始使用该名称。他应在名称旁使用什么符号来表明其受保护状态？\n\
