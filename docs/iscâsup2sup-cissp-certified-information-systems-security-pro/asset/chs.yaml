  4.  **数据管理员**\n\n### 5. 以下哪种模型也称为基于身份的访问控制模型？\n\n1.  **DAC**\n2.  RBAC\n3.  基于规则的访问控制\n\
  4.  MAC\n\n### 6. 中央权威决定用户可以访问哪些文件。以下哪项最能描述这一点？\n\n1.  访问控制列表 (ACL)\n2.  访问控制矩阵\n\
  3.  自主访问控制模型\n4.  **非自主访问控制模型**\n\n### 7. 中央权威根据组织的层级结构决定用户可以访问哪些文件。以下哪项最能描述这一点？\n\
