  \  `IPsec`\n    4.  `PPTP`\n\n8.  `IPsec` 协议在 `OSI` 模型的哪一层运行？\n\n    1.  数据链路层\n\
  \    2.  传输层\n    3.  会话层\n    4.  网络层\n\n9.  什么技术允许通过现有的 `TCP/IP` 网络和互联网连接进行电话通话？\n\
  \n    1.  `IPsec`\n    2.  `VoIP`\n    3.  `SSH`\n    4.  `TLS`\n\n10. 以下哪项不是 `NAT`\
  \ 的优势？\n\n     1.  隐藏内部 `IP` 寻址方案\n     2.  让大量内部客户端共享少量公共互联网地址\n     3.  在内部网络上使用来自\
  \ `RFC 1918` 的私有 `IP` 地址\n     4.  过滤网络流量以防止暴力破解攻击\n\n11. 安全控制的一大优势是用户感觉不到它的存在。这叫什么？\n\
  \n     1.  不可见性\n     2.  透明性\n     3.  转移注意力\n     4.  明目张胆地隐藏\n\n12. 当您为互联网传递的电子邮件设计安全系统时，以下哪项最不重要？\n\
  \n     1.  不可抵赖性\n     2.  可用性\n     3.  消息完整性\n     4.  访问限制\n\n13. 关于电子邮件保留策略，以下哪项通常不是必须与最终用户讨论的要素？\n\
  \n     1.  隐私\n     2.  审计员审查\n     3.  保留期限\n     4.  备份方法\n\n14. 当电子邮件本身被用作攻击机制时，这叫什么？\n\
  \n     1.  伪装\n     2.  邮件炸弹\n     3.  欺骗\n     4.  Smurf 攻击\n\n15. 为什么垃圾邮件如此难以阻止？\n\
  \n     1.  过滤器无法有效拦截入站消息。\n     2.  源地址通常被伪造。\n     3.  这是一种几乎不需要专业知识的攻击。\n    \
  \ 4.  垃圾邮件可能导致拒绝服务攻击。\n\n16. 以下哪种连接类型可以描述为始终存在且等待客户发送数据的逻辑电路？\n\n     1.  `ISDN`\n\
  \     2.  `PVC`\n     3.  `VPN`\n     4.  `SVC`\n\n17. 除了维护更新后的系统和控制物理访问外，以下哪项是应对\
  \ `PBX` 欺诈和滥用最有效的对策？\n\n     1.  加密通信\n     2.  更改默认密码\n     3.  使用传输日志\n     4.\
  \  录音并归档所有通话\n\n18. 以下哪项可用于绕过即使是最好的物理和逻辑安全机制以访问系统？\n\n     1.  字典攻击\n     2.  拒绝服务\n\
  \     3.  社会工程学\n     4.  端口扫描\n\n19. 以下哪项*不是*拒绝服务攻击？\n\n     1.  利用程序缺陷消耗 100%\
  \ 的 `CPU`\n     2.  发送畸形数据包导致系统冻结\n\n\n\n\n\n## 第 13 章：管理身份与认证\n\n## 本章涵盖的 CISSP\
  \ 考试主题\n\n**领域 5：身份与访问管理 (IAM)**\n\n*   **5.1 控制对资产的物理和逻辑访问**\n    *   5.1.1 信息\n\
  \    *   5.1.2 系统\n    *   5.1.3 设备\n    *   5.1.4 设施\n*   **5.2 管理人员、设备和服务的识别与认证**\n\
  \    *   5.2.1 身份管理实施\n    *   5.2.2 单因素/多因素认证\n    *   5.2.3 问责制\n    *   5.2.4\
  \ 会话管理\n    *   5.2.5 身份注册与验证\n    *   5.2.6 联合身份管理 (FIM)\n    *   5.2.7 凭据管理系统\n\
  *   **5.3 将身份作为第三方服务集成**\n    *   5.3.1 本地部署\n    *   5.3.2 云\n    *   5.3.3 联合\n\
  *   **5.5 管理身份与访问配置生命周期**\n    *   用户访问审查\n    *   系统账户访问审查\n    *   配置与取消配置\n\n\
  ---\n\n### 复习题\n\n3.  在账户锁定策略不存在的情况下，对已知用户账户执行暴力破解攻击\n\n4.  向单个地址发送数千封电子邮件\n\n20.\
  \  哪种认证协议为登录凭据**不**提供任何加密或保护？\n\n    1.  `PAP`\n    2.  `CHAP`\n    3.  `SSL`\n\
  \    4.  `RADIUS`\n\n---\n\n身份与访问管理 (IAM) 领域关注与授予和撤销访问数据或在系统上执行操作的特权相关的问题。主要关注点在于识别、认证、授权和问责制。在本章和第\
  \ 14 章“控制与监控访问”中，我们将讨论身份与访问管理领域内的所有目标。请务必阅读并学习这两章的材料，以确保全面覆盖该领域的核心内容。\n\n### 控制对资产的访问\n\
  \n控制对资产的访问是安全的核心主题之一，你会发现许多不同的安全控制协同工作以提供访问控制。资产包括信息、系统、设备、设施和人员。\n\n#### 信息\n组织的信息包括其所有数据。数据可能存储在服务器、计算机和较小设备上的简单文件中。它也可以存储在服务器场内的海量数据库中。访问控制旨在防止未经授权访问信息。\n\
  \n#### 系统\n组织的系统包括提供一项或多项服务的任何信息技术 (IT) 系统。例如，存储用户文件的简单文件服务器就是一个系统。此外，协同工作以提供电子商务服务的\
  \ Web 服务器和数据库服务器也是一个系统。\n\n#### 设备\n设备是指任何计算系统，包括服务器、台式计算机、便携式笔记本电脑、平板电脑、智能手机，以及打印机等外部设备。越来越多的组织采用了允许员工将个人拥有的设备（如智能手机或平板电脑）连接到组织网络的策略。尽管设备通常归员工所有，但存储在设备上的组织数据仍属于组织的资产。\n\
  \n#### 设施\n组织的设施包括其拥有或租赁的任何物理场所。这可能是单个房间、整栋建筑，或包含数栋建筑的整个园区。物理安全控制有助于保护设施。\n\n####\
  \ 人员\n为组织工作的人员也是组织的宝贵资产。保护人员的主要方式之一是确保采取了充分的安全实践，以防止伤害或死亡。\n\n### 比较主体与客体\n\n访问控制不仅涉及控制哪些用户可以访问哪些文件或服务。它关乎实体之间的关系（即主体和客体）。访问是从客体向主体的信息传输，因此理解主体和客体的定义非常重要。\n\
  \n#### 主体\n`subject`（主体）是访问被动客体以接收来自客体的信息或数据的主动实体。主体可以是用户、程序、进程、服务、计算机，或任何能够访问资源的其他事物。当获得授权时，主体可以修改客体。\n\
  \n#### 客体\n`object`（客体）是向主动主体提供信息的被动实体。客体的示例包括文件、数据库、计算机、程序、进程、服务、打印机和存储介质。\n\n\
  你可能已经注意到，某些示例（如程序、服务和计算机）既被列为主体，也被列为客体。这是因为主体和客体的角色可以来回切换。在许多情况下，当两个实体交互时，它们执行不同的功能。有时它们可能请求信息，有时则提供信息。关键区别在于主体始终是接收关于客体的信息或来自客体的数据的主动实体。客体始终是提供或托管信息或数据的被动实体。\n\
  \n以提供动态网页给用户的常见 Web 应用程序为例。用户查询 Web 应用程序以检索网页，因此应用程序最初作为客体。随后，Web 应用程序切换为主体角色，查询用户的计算机以检索\
  \ Cookie，并查询数据库以根据 Cookie 检索用户信息。最后，应用程序再次切换回客体角色，将动态网页发送回用户。\n\n### CIA 三要素与访问控制\n\
  \n组织实施访问控制机制的主要原因之一是防止损失。IT 损失分为三类：`confidentiality`（机密性）、`availability`（可用性）和 `integrity`（完整性）的丧失\
  \ (CIA)。防范这些损失是 IT 安全的核心，因此它们常被称为 `CIA Triad`（CIA 三要素，有时也称为 AIC 三要素或安全三要素）。\n\n\
  #### 机密性\n访问控制有助于确保只有授权主体才能访问客体。当未经授权的实体能够访问系统或数据时，就会导致机密性丧失。\n\n#### 完整性\n完整性确保数据或系统配置未经授权不被修改，或者如果发生未经授权的更改，安全控制能检测到这些更改。如果客体发生未经授权或不需要的更改，就会导致完整性丧失。\n\
  \n#### 可用性\n必须在合理的时间内向主体授予对客体的授权请求。换句话说，系统和数据应在用户和其他主体需要时可用。如果系统无法运行或数据不可访问，就会导致可用性丧失。\n\
  \n### 访问控制的类型\n\n一般来说，访问控制是指控制对资源访问的任何硬件、软件、管理策略或程序。其目标是向授权主体提供访问权限，并防止未经授权的访问尝试。访问控制包括以下总体步骤：\n\
  \n1.  识别并认证试图访问资源的用户或其他主体。\n2.  确定该访问是否已授权。\n3.  根据主体的身份授予或限制访问。\n4.  监控并记录访问尝试。\n\
  \n这些步骤涉及广泛的控制措施。三种主要的控制类型是预防性、检测性和纠正性。只要可能，你都希望预防任何类型的安全问题或事件。当然，这并不总是可行的，意外事件仍会发生。一旦发生，你希望尽快检测到该事件。如果检测到事件，你希望对其进行纠正。\n\
  \n\n\n\n### 访问控制类型\n\n还有其他四种访问控制类型，通常称为威慑、恢复、指导和补偿访问控制。\n\n当您阅读以下列表中的控制措施时，您会注意到某些示例被用于多种访问控制类型。例如，建筑物周围放置的围栏（或周界界定装置）可以是一种预防控制，因为它在物理上阻止某人进入建筑物院落。然而，它也是一种威慑控制，因为它会阻止某人试图进入。\n\
  \n#### 预防访问控制\n`预防控制` 旨在阻挠或阻止不想要的或未经授权的活动发生。预防访问控制的示例包括围栏、锁、生物识别技术、人员闸、照明、报警系统、职责分离策略、轮岗策略、数据分类、渗透测试、访问控制方法、加密、审计、安全摄像头或闭路电视\
  \ (CCTV) 的存在、智能卡、回拨程序、安全策略、安全意识培训、防病毒软件、防火墙和入侵防御系统。\n\n#### 检测访问控制\n`检测控制` 旨在发现或检测不想要的或未经授权的活动。检测控制在事后运行，只能在活动发生后才能发现。检测访问控制的示例包括保安、运动探测器、安全摄像头或\
  \ CCTV 捕获事件的记录与审查、轮岗策略、强制休假策略、审计追踪、蜜罐或蜜网、入侵检测系统、违规报告、用户监督与审查以及事件调查。\n\n#### 纠正访问控制\n\
  `纠正控制` 修改环境，以便在发生不想要的或未经授权的活动后将系统恢复正常。纠正控制试图纠正因安全事件而发生的任何问题。纠正控制可以很简单，例如终止恶意活动或重启系统。它们还包括可以清除或隔离病毒的防病毒解决方案、备份和恢复计划以确保丢失的数据可以恢复，以及可以修改环境以阻止正在进行的攻击的主动入侵检测系统。\n\
  \n#### 威慑访问控制\n`威慑访问控制` 旨在阻止安全策略违规。威慑控制和预防控制相似，但威慑控制通常取决于个人决定不采取不想要的行动。相比之下，预防控制则是阻止该行动。一些示例包括策略、安全意识培训、锁、围栏、安全工牌、保安、人员闸和安全摄像头。\n\
  \n#### 恢复访问控制\n`恢复访问控制` 旨在安全策略违规后修复或恢复资源、功能和能力。恢复控制是纠正控制的延伸，但具有更高级或更复杂的能力。恢复访问控制的示例包括备份和恢复、容错驱动器系统、系统镜像、服务器集群、防病毒软件以及数据库或虚拟机影子复制。\n\
  \n#### 指导访问控制\n`指导访问控制` 旨在指导、限制或控制主体的行为，以强制或鼓励遵守安全策略。指导访问控制的示例包括安全策略要求或标准、张贴的通知、逃生路线出口标志、监控、监督和程序。\n\
  \n#### 补偿访问控制\n`补偿访问控制` 在无法使用主要控制时，或需要增加主要控制有效性时，提供一种替代方案。例如，安全策略可能规定所有员工使用智能卡，但新员工可能需要很长时间才能拿到智能卡。组织可以向员工发放硬件令牌作为补偿控制。这些令牌提供比仅用户名和密码更强的身份验证。\n\
  \n### 访问控制实施类别\n\n访问控制也按其实施方式分类。控制可以通过管理、逻辑/技术或物理方式实施。前面提到的任何访问控制类型都可以包含这些实施类型中的任何一种。\n\
  \n#### 管理访问控制\n`管理访问控制` 是由组织的安全策略及其他法规或要求定义的策略和程序。它们有时被称为管理控制。这些控制侧重于人员和业务实践。管理访问控制的示例包括策略、程序、招聘实践、背景调查、数据分类和标记、安全意识和培训工作、报告和审查、人员控制以及测试。\n\
  \n#### 逻辑/技术控制\n`逻辑访问控制`（也称为 `技术访问控制`）是用于管理访问并为资源和系统提供保护的硬件或软件机制。顾名思义，它们使用技术。逻辑或技术访问控制的示例包括身份验证方法（如密码、智能卡和生物识别技术）、加密、受限接口、访问控制列表、协议、防火墙、路由器、入侵检测系统和截断级别。\n\
  \n#### 物理控制\n`物理访问控制` 是您可以亲身接触的项目。它们包括部署的物理机制，用于防止、监控或检测与设施内系统或区域的直接接触。物理访问控制的示例包括保安、围栏、运动探测器、上锁的门、密封的窗户、灯光、电缆保护、笔记本电脑锁、工牌、刷卡、护卫犬、摄像机、人员闸和警报器。\n\
  \n### 比较标识和身份验证\n\n#### 标识\n`标识` 是主体声称或宣称身份的过程。主体必须向系统提供身份，以启动身份验证、授权和问责流程。提供身份可能包括输入用户名；刷智能卡；挥动令牌设备；说出一句短语；或将您的面部、手或手指置于摄像头前或靠近扫描设备。身份验证的一个核心原则是所有主体必须拥有唯一的身份。\n\
  \n#### 身份验证\n`身份验证` 通过将一个或多个因素与有效身份数据库（如用户账户）进行比较，来验证主体的身份。用于验证身份的身份验证信息属于私密信息，需要受到保护。例如，密码很少以明文形式存储在数据库中。相反，身份验证系统将密码的哈希值存储在身份验证数据库中。主体和系统维护身份验证信息机密性的能力，直接反映了该系统的安全级别。\n\
  \n标识和身份验证始终作为一个单一的两步过程一起发生。提供身份是第一步，提供身份验证信息是第二步。没有这两步，主体无法访问系统。\n\n或者，想象一下用户声称一个身份（例如用户名为\
  \ `john.doe@sybex.com`），但不证明该身份（用密码）。此用户名属于名为 John Doe 的员工。然而，如果系统在没有密码的情况下接受用户名，它就无法证明用户是\
  \ John Doe。任何知道 John 用户名的人都可以冒充他。\n\n\n\n\n\n### 认证技术与因素\n\n每种认证技术或因素都有其独特的优缺点。因此，在部署环境的背景下评估每种机制非常重要。例如，处理绝密材料的设施需要非常强的认证机制。相比之下，教室环境中学生的认证要求要低得多。\n\
  \n#### 注册与身份验证\n\n注册过程发生在用户首次被赋予身份时。在组织内部，新员工在入职过程中通过适当的文件证明其身份。人力资源（HR）部门的人员随后开始创建其用户\
  \ ID 的过程。\n\n对于更安全的认证方法，注册过程更为复杂。例如，如果组织使用指纹识别作为生物识别认证方法，注册过程包括采集用户指纹。\n\n对于与在线站点（如网上银行网站）交互的用户，身份验证略有不同。当用户首次尝试创建账户时，银行将采取额外步骤来验证用户身份。这通常要求用户提供用户和银行都知道的信息，例如账号，以及用户的个人信息，如国民身份证号或社会安全号码。\n\
  \n在此初始注册过程中，银行还会要求用户提供额外信息，例如用户最喜欢的颜色、最大兄弟姐妹的中间名或第一辆车的型号。稍后，如果用户需要更改密码或想要转账，银行可以用这些问题质询用户，作为一种身份验证方法。\n\
  \n许多组织（如金融机构）通常使用更高级的验证技术。它们从客户那里收集信息，然后使用国家数据库验证该信息的准确性。这些数据库允许组织验证当前和以前的地址、雇主及信用记录等项目。在某些情况下，验证过程会给用户一个多项选择题，例如“以下哪家银行持有您的抵押贷款？”或“以下哪项最接近您当前的抵押贷款支付额？”\n\
  \n#### 授权与问责\n\n访问控制系统中的另外两个安全要素是 `authorization` 和 `accountability`。\n\n**授权**\
  \ 主体根据经过验证的身份被授予对客体的访问权限。例如，管理员根据用户经过验证的身份授予用户对文件的访问权限。\n\n**问责** 当实施审计时，用户和其他主体需对其行为负责。审计跟踪主体并记录它们何时访问客体，在一个或多个审计日志中创建审计跟踪。例如，审计可以记录用户何时读取、修改或删除文件。审计提供了问责机制。\n\
  \n此外，假设用户已通过适当认证，审计日志提供了不可抵赖性。用户无法可信地否认审计日志中记录的行为。\n\n一个有效的访问控制系统需要强大的标识和认证机制，以及授权和问责要素。主体拥有唯一身份并通过认证证明其身份。管理员根据主体身份授予访问权限，提供授权。基于经过验证的身份记录用户行为提供了问责制。\n\
  \n相反，如果用户不需要使用凭据登录，那么所有用户将都是匿名的。如果所有人都是匿名的，就无法将授权限制为特定用户。虽然日志记录仍可记录事件，但无法识别执行任何操作的用户。\n\
  \n##### 授权\n\n授权指明谁被信任执行特定操作。如果允许该操作，则主体被授权；如果不允许，则主体未被授权。这是一个简单的例子：如果用户尝试打开文件，授权机制会检查以确保用户至少拥有该文件的读取权限。\n\
  \n重要的是要认识到，仅仅因为用户或其他实体可以向系统进行认证，并不意味着它们被授予了访问任何和所有内容的权限。相反，主体根据其经过验证的身份被授权访问特定客体。授权过程确保请求的活动或客体访问基于分配给主体的特权是可行的。管理员遵循最小权限原则，仅授予用户执行其工作所需的特权。\n\
  \n标识和认证是访问控制的“全有或全无”方面。要么用户的凭据证明了声称的身份，要么没有。相比之下，授权则涵盖广泛的变化范围。例如，用户可能能够读取文件但不能删除它，或者可能能够打印文档但不能更改打印队列。\n\
  \n##### 问责\n\n审计、日志记录和监控通过确保主体对其行为负责来提供问责制。审计是跟踪和记录日志中主体活动的过程。日志通常记录谁采取了行动、何时何地采取的行动以及行动是什么。一个或多个日志创建\
  \ `audit trail`，研究人员可利用它重建事件并识别安全事件。当调查人员审查审计跟踪的内容时，他们可以提供证据让人们为其行为负责。\n\n关于问责制有一个微妙但重要的点需要强调。问责制依赖于有效的标识和认证，但不要求有效的授权。换句话说，在识别和认证用户后，诸如审计日志之类的问责机制可以跟踪他们的活动，即使他们试图访问未被授权访问的资源。\n\
  \n#### 认证因素\n\n三种基本的认证方法也称为类型或因素。它们如下：\n\n**类型 1** `Type 1 authentication factor`\
  \ 是你所知的事物。示例包括密码、个人识别号码（PIN）或口令短语。\n\n**类型 2** `Type 2 authentication factor` 是你所有的事物。用户持有的物理设备可以帮助他们提供认证。示例包括智能卡、硬件令牌、`memory\
  \ card` 或通用串行总线（USB）驱动器。\n\n**类型 3** `Type 3 authentication factor` 是你本身的特征或你的行为习惯。它是通过不同类型的生物识别技术识别的一个人的身体特征。属于“你是什么”类别的示例包括指纹、声纹、视网膜模式、虹膜模式、面部形状、手掌拓扑和手部几何结构。属于“你的行为”类别的示例包括签名和击键动态，也称为行为生物识别。\n\
  \n当正确实施时，这些类型的强度依次增强，类型 1 最弱，类型 3 最强。换句话说，密码（类型 1）最弱，指纹（类型 3）比密码强。然而，攻击者仍然可以绕过某些类型\
  \ 3 认证因素。例如，攻击者可能能够在软糖上制作重复的指纹并欺骗指纹读取器。\n\n除了三个主要认证因素外，还有一些其他的因素。\n\n\n\n\n\n###\
  \ 您所在的某处\n\n您所在的某处因素根据特定计算机、由互联网协议 (IP) 地址标识的地理位置，或由来电显示标识的电话号码来确定主体的位置。通过物理位置控制访问会强制主体必须位于特定位置。地理定位技术可以根据\
  \ IP 地址识别用户的位置，并被某些认证系统所使用。\n\n### 上下文感知认证\n\n许多移动设备管理 (MDM) 系统使用 `context-aware\
  \ authentication`（上下文感知认证）来识别移动设备用户。它可以识别多个要素，例如用户的位置、一天中的时间以及移动设备本身。地理定位技术可以识别特定位置，例如组织的大楼。地理围栏是一种虚拟围栏，用于标识大楼的位置，并能识别用户何时身处大楼内。组织经常允许用户使用移动设备访问网络，当用户尝试登录时，MDM\
  \ 系统可以检测设备的详细信息。如果用户满足所有要求（在本例中为位置、时间和设备类型），则允许用户使用其他方法（如用户名和密码）登录。\n\n许多移动设备支持在触摸屏上使用手势或手指滑动。例如，Microsoft\
  \ Windows 10 支持图片密码，允许用户通过在自己选择的图片上滑动手指来进行认证。同样，Android 设备支持 Android 锁屏，允许用户通过滑动屏幕连接网格上的点来解锁。请注意，这些方法与本章后面“生物识别”部分进一步解释的行为生物识别不同。行为生物识别示例（如签名和击键动力学）因人而异，并提供一定级别的识别，但任何知道模式的人都可以重复触摸屏滑动操作。有些人将其视为一种类型\
  \ 1 认证因素（您知道的东西），尽管手指滑动是您做的事情。\n\n### 密码\n\n最常见的认证技结是结合类型 1 认证（您知道的东西）使用 `password`（密码，用户输入的一串字符）。密码通常是静态的。`static\
  \ password`（静态密码）会在一段时间内（例如 30 天）保持不变，但静态密码是最薄弱的认证形式。密码之所以是薄弱的安全机制，有以下几个原因：\n\n\
  *   用户通常选择容易记住的密码，因此也容易被猜测或破解。\n*   随机生成的密码难以记忆；因此，许多用户会将其记录下来。\n*   用户经常共享他们的密码，或忘记密码。\n\
  *   攻击者通过多种手段检测密码，包括旁观、网络嗅探和窃取安全数据库。\n*   密码有时以明文传输，或使用容易被破解的加密协议传输。攻击者可以使用网络嗅探器捕获这些密码。\n\
  *   密码数据库有时存储在公开可访问的在线位置。\n*   暴力破解攻击可以快速发现弱密码。\n\n#### 创建强密码\n\n当用户创建强密码时，密码最有效。强密码长度足够，并使用多种字符类型，如大写字母、小写字母、数字和特殊字符。组织通常会在整体安全策略中包含书面的\
  \ `password policy`（密码策略）。IT 安全专业人员随后通过技术控制（如强制执行 `password restriction`（密码限制）要求的技术密码策略）来强制执行该策略。以下列表包含一些常见的密码策略设置：\n\
  \n##### 最长使用期限\n\n此设置要求用户定期更改密码，例如每 45 天。\n\n##### 密码复杂度\n\n密码的复杂度是指其包含的字符类型数量。一个包含大写字符、小写字符、符号和数字的八字符密码，比仅使用数字的八字符密码强得多。美国国家标准与技术研究院\
  \ (NIST) 特别出版物 (SP) 800-63B《数字身份指南》指出，认证系统应支持使用任何可打印的美国信息交换标准代码 (ASCII) 字符和空格字符。\n\
  \n##### 密码长度\n\n长度是指密码中的字符数量。较短的密码更容易被破解。例如，运行在单台计算机上的密码破解应用程序可以在不到一秒的时间内发现复杂的五字符密码，但破解复杂的\
  \ 12 字符密码却需要数千年。当然，不同的计算机拥有不同的算力，并行处理系统可以创建多台计算机，从而更快地破解密码。然而，关键在于较长的密码比较短的密码更难破解。NIST\
  \ SP 800-63B 指出，密码长度应至少为八个字符，且系统应支持长达 64 个字符的密码。许多组织要求特权账户密码更长，例如至少 15 个字符。\n\n\
  ##### 密码历史记录\n\n许多用户养成了在两个密码之间轮换的习惯。密码历史记录会记住一定数量的以前的密码，并防止用户重复使用历史记录中的密码。这通常与最短密码使用期限设置相结合，防止用户反复更改密码，直到能将密码改回原来的密码。最短密码使用期限通常设置为一天。\n\
  \n用户通常不理解强密码的必要性。即使理解了，他们往往也不知道如何创建既强壮又容易记住的密码。以下建议可以帮助他们创建强密码：\n\n*   不要使用您姓名、登录名、电子邮件地址、工号、国家身份证号或社会安全号码、电话号码、分机号或任何其他识别性名称或代码的任何部分。\n\
  *   不要使用社交网络档案中可获取的信息，如家庭成员姓名、宠物姓名或您的出生日期。\n*   不要使用字典单词（包括外语字典中的单词）、俚语或行业首字母缩略词。\n\
  *   请使用非标准的大小写和拼写，例如 `stRongsecuRitee` 代替 `strongsecurity`。\n*   请用特殊字符和数字替换字母，例如\
  \ `stR0ng$ecuR1tee` 代替 `strongsecurity`。\n\n在某些环境中，系统会自动为用户账户创建初始密码。通常生成的密码是一种组合密码的形式，即两个或多个不相关的单词通过中间的数字或符号连接在一起。组合密码易于计算机生成，但不应长期使用，因为它们容易受到密码猜测攻击。\n\
  \n#### 密码短语\n\n比基本密码更有效的密码机制是 `passphrase`（密码短语/通行短语）。密码短语是一串类似于密码的字符，但对用户具有独特的含义。例如，密码短语可以是“I\
  \ passed the CISSP exam.”（我通过了 CISSP 考试）。许多认证系统不支持空格，因此该密码短语可以修改为“IPassedTheCISSPExam.”\n\
  \n使用密码短语有几个好处。它易于记忆，并鼓励用户创建更长的密码。更长的密码更难通过暴力破解工具破解。鼓励用户创建密码短语还有助于确保他们不使用常见的、可预测的密码，如“password”和“123456”。\n\
  \n\n\n\n\n### 在线认证系统\n\n在线认证系统通常会对用户施加复杂的规则，要求他们使用最少数量的大写字母、小写字母、数字和特殊字符。满足这些规则要求的一种方法是用字符或数字替换字母。例如，字母\
  \ `a` 可以用 `@` 字符替换，字母 `i` 可以用数字 `1` 替换。这实际上将 “IPassedTheCISSPExam” 变成了 “1P@ssedTheC1SSPEx@m。”\n\
  \n#### 认知密码\n\n另一种密码机制是 *认知密码*。认知密码是一系列关于事实或预定义回答的挑战性问题，只有主体本人应该知道答案。认证系统通常在账户初始注册期间收集这些问题的答案，但也可以稍后收集或修改。例如，创建账户时可能会要求主体回答三到五个此类问题：\n\
  \n*   您的出生日期是什么？\n*   您母亲的娘家姓是什么？\n*   您第一任老板的名字是什么？\n*   您第一只宠物的名字是什么？\n*   您最喜欢的运动是什么？\n\
  \n稍后，系统使用这些问题进行认证。如果用户正确回答了所有问题，系统就会认证该用户。最有效的认知密码系统会收集多个问题的答案，并且每次使用时询问不同的一组问题。认知密码通常通过自助密码重置系统或辅助密码重置系统来协助密码管理。例如，如果用户忘记了原始密码，他们可以请求帮助。密码管理系统随后会用一个或多个认知密码问题对用户进行质询，这些问题据推测只有用户本人知道答案。\n\
  \n#### 智能卡和令牌\n\n智能卡和硬件令牌都是类型 2（即“你拥有的东西”）认证因素的示例。它们很少单独使用，但通常与另一个认证因素结合使用，提供多因素认证。\n\
  \n##### 智能卡\n\n*智能卡* 是一张信用卡大小的身份证或工牌，内嵌了一体化电路芯片。智能卡包含关于授权用户的信息，用于识别和/或认证目的。大多数当前的智能卡都包含一个微处理器和一个或多个证书。这些证书用于非对称加密，例如加密数据或对电子邮件进行数字签名。（非对称加密主题在第\
  \ 7 章 “PKI 和加密应用” 中有更深入的介绍。）智能卡具有防篡改性，并为用户提供了一种携带和使用复杂加密密钥的简便方式。\n\n用户在认证时将卡插入智能卡读卡器。通常还要求用户输入\
  \ PIN 码或密码，作为与智能卡配合使用的第二认证因素。\n\n美国政府人员使用 *通用访问卡 (CAC)* 或 *个人身份验证 (PIV) 卡*。CAC 和\
  \ PIV 卡是包含持有者照片和其他身份识别信息的智能卡。用户在走动时将其作为工牌佩戴，登录时将其插入计算机的读卡器中。\n\n##### 令牌\n\n*令牌设备*，或硬件令牌，是一种用户可随身携带的密码生成设备。目前常用的一种令牌包含一个显示屏，显示六到八位数字。认证服务器存储令牌的详细信息，因此在任何时刻，服务器都知道用户令牌上显示的数字。令牌通常与另一种认证机制结合使用。例如，用户可能输入用户名和密码（属于“你知道的东西”认证因素），然后输入令牌上显示的数字（属于“你拥有的东西”认证因素）。这提供了多因素认证。\n\
  \n硬件令牌设备使用动态 *一次性密码*，这使它们比静态密码更安全。静态密码在很长一段时间内保持不变，例如 60 天。动态密码不会保持静态，而是频繁更改，例如每\
  \ 60 秒。动态一次性密码仅使用一次，使用后不再有效。令牌分为两种类型：*同步动态密码令牌* 和 *异步动态密码令牌*。\n\n###### 同步动态密码令牌\n\
  \n创建 *同步动态密码* 的硬件令牌基于时间，并与认证服务器同步。它们定期生成新密码，例如每 60 秒。这要求令牌和服务器都拥有准确的时间。一种常见的用法是要求用户在网页中输入用户名、静态密码和动态一次性密码。\n\
  \n###### 异步动态密码令牌\n\n*异步动态密码* 不使用时钟。相反，硬件令牌基于算法和递增计数器生成密码。使用递增计数器时，它会创建一个保持不变的动态一次性密码，直到被用于认证为止。某些令牌在用户将认证服务器提供的\
  \ PIN 码输入令牌时创建一次性密码。例如，用户首先向网页提交用户名和密码。验证用户凭据后，认证系统使用令牌的标识符和递增计数器创建一个质询数字并发送回用户。质询数字每次用户认证时都会改变，因此通常称为一次性数字，即\
  \ nonce（\"number used once\" 的缩写）。该质询数字仅会在属于该用户的设备上产生正确的一次性密码。用户将质询数字输入令牌，令牌生成密码。用户随后将密码输入网站以完成认证过程。\n\
  \n硬件令牌提供强认证，但也有缺陷。如果电池耗尽或设备损坏，用户将无法获得访问权限。\n\n一些组织使用相同的概念，但通过运行在用户设备上的软件应用程序提供 PIN\
  \ 码。例如，Symantec 支持 VIP Access 应用。配置为与认证服务器配合工作后，它每 30 秒向应用发送一个新的六位数 PIN 码。\n\n###\
  \ 两步认证\n\n许多在线组织正在采用的一种趋势是两步认证。例如，假设您进行网上银行操作，使用用户名和密码登录。您的银行最近要求您提供手机号码。现在，当您登录时，银行网站会提示已向您的手机发送了一条包含验证码的短信。然后提示您输入验证码以完成登录过程。果不其然，当您查看智能手机时，会看到一个六位数字代码。在网站上输入后，您就登录成功了。\n\
  \n在此场景中，您的智能手机实际上模拟了一个硬件令牌，这属于双因素认证，尽管谷歌等许多组织称之为两步认证。此过程通常利用以下标准之一。\n\n#### HOTP\n\
  \n基于哈希消息认证码 (HMAC) 的一次性密码 (HOTP) 标准使用 HMAC 包含的哈希函数来创建一次性密码。它通常创建六到八位数字的 HOTP 值。这类似于令牌创建的异步动态密码。HOTP\
  \ 值在被使用前一直保持有效。\n\n#### TOTP\n\n基于时间的一次性密码 (TOTP) 标准类似于 HOTP。但是，它使用时间戳，并在特定时间范围内（例如\
  \ 30 秒）保持有效。如果用户未在该时间范围内使用，TOTP 密码将过期。这类似于令牌使用的同步动态密码。\n\n许多在线组织结合使用 HOTP 和 TOTP，通过两步认证为用户提供一次性密码。\n\
  \n\n\n\n虽然这听起来很安全，但我们经常看到 NIST 解决的一个常见漏洞。具体而言，SP 800-63B 建议发送到用户智能手机的代码在用户解锁手机之前不应可见。然而，该代码几乎总是以通知的形式出现，而无需解锁手机。\n\
  \n许多在线网站使用的另一种流行的双步验证方法是电子邮件质询。当用户登录时，网站会向用户发送一封包含 PIN 码的电子邮件。然后用户需要打开电子邮件并在网站上输入\
  \ PIN 码。如果用户无法输入 PIN 码，网站将阻止用户的访问。虽然攻击者可能在数据泄露后获得用户的凭据，但攻击者可能无法访问用户的电子邮件（除非用户对所有账户使用相同的密码）。\n\
  \n### 生物识别\n\n另一种常见的认证和识别技术是使用`生物识别`。`生物识别因素`属于类型 3（即“你是什么”）认证类别。\n\n生物识别因素可用作识别或认证技术，或两者兼用。使用生物识别因素代替用户名或账户\
  \ ID 作为识别因素，需要将提供的生物识别模式与存储的已注册和授权模式数据库进行一对多搜索。捕获一个人的单张图像并在包含许多人的人员数据库中搜索匹配项，就是一对多搜索的一个例子。作为一种识别技术，生物识别因素用于物理访问控制。\n\
  \n将生物识别因素用作认证技术，需要将提供的生物识别模式与所声称的主体身份的存储模式进行一对一匹配。换句话说，用户声称一种身份，然后检查生物识别因素以查看该人是否与声称的身份匹配。作为一种认证技术，生物识别因素用于逻辑访问控制。\n\
  \n生物识别特征通常被定义为生理特征或行为特征。生理生物识别方法包括指纹、面部扫描、视网膜扫描、虹膜扫描、掌纹扫描（也称为掌部地形或掌部地理）、手部几何结构和语音模式。行为生物识别方法包括签名动力学和击键模式（击键动力学）。这些有时被称为“做什么”认证。\n\
  \n#### 指纹\n\n`指纹`是人们手指和拇指上的可见图案。它们对每个人都是唯一的，几十年来一直用于物理安全识别。指纹阅读器现在通常用于笔记本电脑和 USB\
  \ 闪存驱动器，作为一种识别和认证方法。\n\n#### 面部扫描\n\n`面部扫描`使用面部的几何图案进行检测和识别。Facebook 多年来一直使用面部识别软件来提供标签建议。例如，如果你的照片和名字存在于\
  \ Facebook 上（例如在你的个人资料图片中），它可以利用这些信息来识别你。它扫描新发布的照片并提供标签建议（照片中人物的姓名）。每当有人在照片中标记你时，它都会为\
  \ Facebook 正确识别你下次发布的照片提供更多信息。Facebook 最近开始允许用户结合另一种认证方法使用面部识别来解锁账户。赌场用它来识别作弊者。执法机构一直在边境和机场使用它来抓捕罪犯。面部扫描也用于在访问安全空间（如保险库）之前识别和认证人员。\n\
  \n#### 视网膜扫描\n\n`视网膜扫描`关注眼球后部血管的模式。它们是生物识别认证中最准确的形式，可以区分同卵双胞胎。然而，一些隐私倡导者反对其使用，因为它们可能揭示医疗状况，如高血压和怀孕。较早的视网膜扫描会向用户的眼睛吹一口气，但较新的扫描通常使用红外光。此外，视网膜扫描仪通常要求用户距离扫描仪近至三英寸。\n\
  \n#### 虹膜扫描\n\n聚焦于瞳孔周围的有色区域，`虹膜扫描`是生物识别认证中第二准确的形式。与视网膜一样，虹膜在一个人的一生中相对保持不变（除非眼睛受损或患病）。虹膜扫描通常被普通用户认为比视网膜扫描更可接受，因为扫描可以从远处进行。扫描通常可以在\
  \ 6 到 12 米外（约 20 到 40 英尺）完成。然而，一些扫描仪可能会被高质量的图像代替人的眼睛而欺骗。此外，准确性可能会受到光线变化以及某些眼镜和隐形眼镜使用的影响。\n\
  \n#### 掌纹扫描\n\n`掌纹扫描仪`扫描手掌以进行识别。它们使用近红外光测量手掌中的静脉模式，这些模式与指纹一样独特。个人只需在注册过程中将手掌放在扫描仪上几秒钟。稍后，他们再次将手放在扫描仪上进行识别。例如，研究生管理入学委员会（GMAC）使用掌静脉阅读器来防止代考，并确保休息后重新进入考场的是同一个人。\n\
  \n#### 手部几何结构\n\n`手部几何结构`识别手的物理尺寸。这包括手掌和手指的宽度和长度。它捕获手的轮廓，但不捕获指纹或静脉模式的细节。手部几何结构很少单独使用，因为很难仅使用此方法唯一地识别个人。\n\
  \n#### 心率/脉搏模式\n\n测量用户的脉搏或心跳可确保真人提供生物识别因素。它通常作为辅助生物识别手段来支持另一种类型的认证。一些研究人员推测个体之间的心跳是独特的，并声称心电图可用于认证。然而，可靠的方法尚未被创建或完全测试。\n\
  \n#### 语音模式识别\n\n这种类型的生物识别认证依赖于一个人说话声音的特征，称为声纹。用户说出一个特定短语，由认证系统记录。为了认证，他们重复相同的短语并将其与原始短语进行比较。`语音模式`识别有时用作额外的认证机制，但很少单独使用。\n\
  \n#### 签名动力学\n\n这识别主体书写一串字符的方式。`签名动力学`检查主体执行书写行为的方式以及书写样本中的特征。签名动力学的成功依赖于笔压、笔画模式、笔画长度以及笔从书写表面抬起的时间点。创建书写样本的速度通常不是一个重要因素。\n\
  \n#### 击键模式\n\n`击键模式`（也称为`击键动力学`）通过分析飞行时间和停留时间来衡量主体使用键盘的方式。`飞行时间`是按键之间的时间间隔，`停留时间`是按键被按下的时长。使用击键模式成本低廉、无侵入性，且通常对用户透明（无论是使用还是注册）。不幸的是，击键模式容易出现巨大差异。用户行为的简单变化会极大地影响这种生物识别因素，例如单手操作、感到寒冷、站立而非坐着、更换键盘，或手部或手指受伤。\n\
  \n\n\n\n### 生物识别认证\n\n生物识别技术的应用有望为地球上的每个人提供通用的唯一标识。遗憾的是，生物识别技术尚未兑现这一承诺。然而，专注于物理特征的技术对于认证非常有用。\n\
  \n#### 生物识别因子错误率\n\n生物识别设备最重要的方面是其准确性。要将生物识别技术用于识别，生物识别设备必须能够检测信息中的细微差异，例如个人视网膜血管的变化或个人手掌静脉的差异。由于大多数人基本相似，生物识别方法经常导致假阴性和假阳性认证。生物识别设备通过检查它们产生的不同类型错误来评定性能。\n\
  \n##### 误拒率\n\n误拒是指有效主体未被认证。例如，Dawn 已注册其指纹并曾用其进行自我认证。假设她今天使用指纹进行自我认证，但系统错误地拒绝了她的有效指纹。这有时称为假阴性认证。误拒次数与有效认证次数之比称为\
  \ `误拒率 (FRR)`。误拒有时称为 `I 类错误`。\n\n##### 误纳率\n\n误纳是指无效主体被认证。这也称为假阳性认证。例如，假设黑客 Joe\
  \ 没有账户且未注册其指纹。然而，他使用指纹进行认证，系统却将其识别通过。这是一个假阳性或误纳。假阳性次数与有效认证次数之比称为 `误纳率 (FAR)`。误纳有时称为\
  \ `II 类错误`。\n\n大多数生物识别设备都有灵敏度调节功能。当生物识别设备过于灵敏时，误拒（假阴性）更常见。当生物识别设备不够灵敏时，误纳（假阳性）更常见。\n\
  \n您可以使用 `交叉错误率 (CER)`（也称为等错误率 (ERR)）来比较生物识别设备的整体质量。图 13.1 显示了设备在不同灵敏度级别下设置时的 FRR\
  \ 和 FAR 百分比。FRR 和 FAR 百分比相等的点即为 CER，CER 被用作比较不同生物识别设备准确性的标准评估值。CER 较低的设备比 CER 较高的设备更准确。\n\
  \n![图 13.1 FRR 和 FAR 错误图，指示 CER 点](img/c13f001.jpg)\n\n**图 13.1** FRR 和 FAR 错误图，指示\
  \ CER 点\n\n并非必须（且通常也不理想）将设备灵敏度设置在 CER 级别下运行。例如，组织可能使用人脸识别系统来允许或拒绝进入安全区域，因为他们希望确保未经授权的人员绝不会获得访问权限。在这种情况下，组织会将灵敏度设置得非常高，从而使误纳（假阳性）的可能性极小。这可能会导致更多的误拒（假阴性），但在这种场景下，误拒比误纳更可接受。\n\
  \n#### 生物识别注册\n\n由于注册时间、吞吐率和接受度等因素，生物识别设备可能无效或不可接受。要使生物识别设备作为识别或认证机制工作，必须进行一个称为\
  \ `注册` 的过程。在注册期间，采集主体的生物识别因子并将其存储在设备的数据库中。这种生物识别因子的存储样本称为 `参考档案`（也称为 `参考模板`）。\n\n\
  扫描和存储生物识别因子所需的时间取决于所测量的物理或性能特征。用户不太愿意接受耗时较长的生物识别方法带来的不便。一般来说，超过 2 分钟的注册时间是不可接受的。如果您使用的生物识别特征会随时间变化，例如一个人的声调、胡须或签名模式，则必须定期重新注册，这会增加不便。\n\
  \n`吞吐率` 是系统扫描主体并批准或拒绝访问所需的时间。生物识别特征越复杂或详细，处理时间越长。主体通常接受约 6 秒或更快的吞吐率。\n\n#### 多因子认证\n\
  \n`多因子认证` 是指使用两个或更多因子进行的任何认证。`双因子认证` 需要两个不同的因子来提供认证。例如，智能卡通常要求用户将卡插入读卡器并输入 PIN 码。智能卡属于“你拥有的东西”因子，而\
  \ PIN 码属于“你知道的东西”因子。一般来说，使用更多类型或因子会导致更安全的认证。\n\n当同一因子的两种认证方法一起使用时，认证强度不会大于仅使用一种方法时的强度，因为能够窃取或获取其中一种的攻击也能获取另一种。例如，同时使用两个密码并不比使用单个密码更安全，因为密码破解尝试可能在一次成功攻击中同时发现两者。\n\
  \n相反，当采用两个或更多不同因子时，必须有两个或更多不同的攻击方法同时成功，才能收集所有相关的认证要素。例如，如果令牌、密码和生物识别因子都用于认证，那么物理窃取、密码破解和生物识别复制攻击必须同时全部成功，入侵者才能进入系统。\n\
  \n#### 设备认证\n\n历史上，用户只能从公司拥有的系统（如台式电脑）登录网络。例如，在 Windows 域中，用户计算机加入域，并拥有类似于用户账户和密码的计算机账户和密码。如果计算机未加入域，或其凭据与域控制器不同步，用户无法从该计算机登录。\n\
  \n如今，越来越多的员工自带移动设备上班并将其连接到网络。一些组织拥抱这一趋势，但实施安全策略作为控制措施。这些设备不一定能加入域，但可以为这些设备实施设备识别和认证方法。\n\
  \n一种方法是设备指纹识别。用户可以向组织注册其设备，并将其与其用户账户关联。在注册期间，设备认证系统会采集设备的特征。这通常通过让用户使用该设备访问网页来完成。注册系统随后使用操作系统及版本、Web\
  \ 浏览器、浏览器字体、浏览器插件、时区、数据存储、屏幕分辨率、Cookie 设置和 HTTP 标头等特征来识别设备。\n\n当用户从该设备登录时，认证系统会检查用户账户是否有注册设备。然后，它会将用户设备的特征与已注册设备进行验证。即使其中一些特征会随时间变化，这已被证明是一种成功的设备认证方法。组织通常使用第三方工具（如\
  \ `SecureAuth Identity Provider (IdP)`）进行设备认证。\n\n\n\n\n如前所述，许多 MDM 系统使用上下文感知身份验证方法来识别设备。它们通常与网络访问控制\
  \ (NAC) 系统配合工作，以检查设备的健康状况，并根据 NAC 系统中配置的要求授予或限制访问权限。\n\n802.1x 是另一种用于设备身份验证的方法。它可用于某些路由器和交换机上的基于端口的身份验证。此外，它常与无线系统配合使用，强制用户在获得网络访问权限前使用账户登录。最近，一些\
  \ 802.1x 解决方案已与 MDM 和/或 NAC 解决方案结合实施，以控制来自移动设备的访问。如果设备或用户无法通过 802.1x 系统进行身份验证，则不会被授予网络访问权限。\n\
  \n#### 服务身份验证\n\n许多服务也需要身份验证，它们通常使用用户名和密码。服务账户就是为服务而非个人创建的用户账户。\n\n例如，为监视 Microsoft\
  \ Exchange Server 中电子邮件的第三方工具创建服务账户是一种常见做法。这些第三方工具通常需要权限来扫描所有邮箱，查找垃圾邮件、恶意软件、潜在的数据渗漏尝试等。管理员通常会创建一个\
  \ Microsoft 域账户，并赋予该账户执行任务所需的特权。\n\n通常会设置账户属性，使密码永不过期。对于普通用户，你会将最长使用期限设置为 45 天左右。密码过期时，用户会收到必须更改密码的通知，并由用户自行更改。然而，服务无法响应此类消息，只会被锁定。\n\
  \n由于服务账户拥有高级别的特权，因此会为其配置强复杂密码，且比普通用户更频繁地更换。管理员需要手动更改这些密码。密码保持不变的时间越长，被泄露的可能性就越大。另一种选择是将账户配置为非交互式，这可以防止用户使用传统登录方法登录该账户。\n\
  \n服务可配置为使用基于证书的身份验证。证书颁发给运行服务的设备，并在服务访问资源时由服务呈现。基于 Web 的服务通常使用应用程序编程接口 (API) 方法在系统间交换信息。这些\
  \ API 方法因基于 Web 的服务而异。例如，Google 和 Facebook 提供 Web 开发人员使用的基于 Web 的服务，但它们的实现方式不同。\n\
  \n#### 实施身份管理\n\n身份管理技术通常分为两类：集中式和分散式/分布式。\n\n*   **集中式访问控制** 意味着系统内的所有授权验证均由单个实体执行。\n\
  *   **分散式访问控制**（也称为 **分布式访问控制**） 意味着系统中分布的各个实体执行授权验证。\n\n集中式和分散式访问控制方法提供了任何集中式或分散式系统中所具有的相同优缺点。一个小团队或个人即可管理集中式访问控制。管理开销较低，因为所有更改都在单一位置进行，且单次更改即可影响整个系统。\n\
  \n分散式访问控制通常需要多个团队或多名个人。管理开销较高，因为更改必须在众多位置实施。随着访问控制点数量的增加，维护系统间的一致性变得更加困难。对任何单个访问控制点所做的更改都需要在每个访问点重复执行。\n\
  \n##### 单点登录\n\n**单点登录 (SSO)** 是一种集中式访问控制技术，允许主体在系统上经过一次身份验证后，无需再次验证即可访问多个资源。例如，用户可以在网络上进行一次身份验证，然后访问整个网络中的资源，而无需再次接受身份验证提示。\n\
  \nSSO 对用户非常方便，但也能提高安全性。当用户必须记住多个用户名和密码时，他们往往会将其记录下来，最终削弱安全性。用户不太可能记录单个密码。SSO 还通过减少主体所需的账户数量来简化管理。\n\
  \nSSO 的主要缺点是一旦账户被攻破，攻击者将获得对所有授权资源的无限制访问权限。然而，大多数 SSO 系统都包含保护用户凭据的方法。以下几节将讨论几种常见的\
  \ SSO 机制。\n\n###### LDAP 和集中式访问控制\n\n在单个组织内，通常使用集中式访问控制系统。例如，**目录服务** 是一个集中式数据库，包含有关主体和对象的信息。许多目录服务基于轻量级目录访问协议\
  \ (LDAP)。例如，Microsoft Active Directory 域服务基于 LDAP。\n\n你可以将 LDAP 目录视为网络服务和资产的电话簿。用户、客户端和进程可以搜索目录服务，以查找所需系统或资源所在的位置。主体在执行查询和查找活动前，必须向目录服务进行身份验证。即使经过身份验证，目录服务也仅根据主体分配的特权向其透露特定信息。\n\
  \n多域和信任关系常用于访问控制系统。安全域是共享通用安全策略的主体和对象的集合，各个域可以独立于其他域运行。域之间建立 **信任关系** 以创建安全桥接，允许一个域中的用户访问另一个域中的资源。信任关系可以是单向的，也可以是双向的。\n\
  \n###### LDAP 和 PKI\n\n公钥基础设施 (PKI) 在将数字证书集成到传输中时会使用 LDAP。第 7 章将更深入地介绍 PKI，简而言之，PKI\
  \ 是一组用于在证书生命周期内管理数字证书的技术。客户端经常需要查询证书颁发机构 (CA) 以获取证书信息，LDAP 是使用的协议之一。\n\nLDAP 和集中式访问控制系统可用于支持单点登录功能。\n\
  \n###### Kerberos\n\n票据身份验证是一种采用第三方实体来证明身份并提供身份验证的机制。最常见且最知名的票据系统是 **Kerberos**。\n\
  \nKerberos 为用户提供单点登录解决方案，并保护登录凭据。当前版本 Kerberos 5 依赖对称密钥加密（也称为密钥加密），使用高级加密标准 (AES)\
  \ 对称加密协议。Kerberos 通过端到端安全为身份验证流量提供机密性和完整性，并有助于防范窃听和重放攻击。它使用几个不同的重要元素：\n\n**密钥分发中心**\
  \ **密钥分发中心 (KDC)** 是提供身份验证服务的受信任第三方。Kerberos 使用对称密钥加密将客户端向服务器进行身份验证。所有客户端和服务器均向\
  \ KDC 注册，KDC 维护所有网络成员的密钥。\n\n\n\n\n### Kerberos 认证服务器\n\n认证服务器承载 KDC 的功能：票据授予服务\
  \ (TGS) 和认证服务 (AS)。不过，也可以将票据授予服务托管在另一台服务器上。`authentication service`（认证服务）负责验证或拒绝票据的真实性和时效性。这台服务器通常被称为\
  \ KDC。\n\n### 票据授予票据\n\n票据授予票据 (TGT) 证明某主体已通过 KDC 认证，并获授权请求票据以访问其他对象。TGT 经过加密，包含一个对称密钥、过期时间和用户的\
  \ IP 地址。主体在请求访问对象的票据时会出示 TGT。\n\n### 票据\n\n票据是一条加密消息，证明某主体获授权访问某对象。它有时被称为服务票据 (ST)。主体请求票据以访问对象，如果它们已通过认证且获授权访问该对象，Kerberos\
  \ 就会向它们颁发票据。Kerberos 票据具有特定的生命周期和使用参数。一旦票据过期，客户端必须请求续订或获取新票据，才能继续与任何服务器通信。\n\nKerberos\
  \ 需要一个账户数据库，该数据库通常包含在目录服务中。它通过客户端、网络服务器和 KDC 之间的票据交换来证明身份并提供认证。这使得客户端能够向服务器请求资源，且客户端和服务器都能确信对方的身份。这些加密票据还确保登录凭据、会话密钥和认证消息永远不会以明文形式传输。\n\
  \n#### Kerberos 登录过程\n\nKerberos 登录过程如下：\n\n1.  用户在客户端输入用户名和密码。\n2.  客户端使用 AES 加密用户名，以便传输给\
  \ KDC。\n3.  KDC 根据已知凭据数据库验证用户名。\n4.  KDC 生成一个将由客户端和 Kerberos 服务器使用的对称密钥。它使用用户密码的哈希值对该密钥进行加密。KDC\
  \ 还生成一个加密的带时间戳的 TGT。\n5.  KDC 随后将加密的对称密钥和加密的带时间戳的 TGT 传输给客户端。\n6.  客户端安装 TGT 以供使用，直到其过期。客户端还使用用户密码的哈希值解密该对称密钥。\n\
  \n#### 请求票据以访问对象\n\n当客户端想要访问某个对象（如网络上托管的资源）时，必须通过 Kerberos 服务器请求票据。此过程涉及以下步骤：\n\n\
  1.  客户端将其 TGT 连同资源访问请求一起发送回 KDC。\n2.  KDC 验证 TGT 是否有效，并检查其访问控制矩阵，以确认用户是否拶有足够的特权访问所请求的资源。\n\
  3.  KDC 生成一张服务票据并将其发送给客户端。\n4.  客户端将票据发送给托管该资源的服务器或服务。\n5.  托管资源的服务器或服务与 KDC 验证票据的有效性。\n\
  6.  一旦身份和授权得到验证，Kerberos 活动即告完成。服务器或服务主机随后与客户端打开一个会话，并开始通信或数据传输。\n\n#### Kerberos\
  \ 的局限性\n\nKerberos 是一种通用的认证机制，适用于本地局域网、远程访问以及客户端-服务器资源请求。然而，Kerberos 存在单点故障——即 KDC。如果\
  \ KDC 被攻破，网络上每个系统的密钥也将随之泄露。此外，如果 KDC 离线，将无法进行任何主体认证。\n\n它对时间也有严格要求，默认配置要求所有系统的时间同步在彼此五分钟之内。如果系统未同步或时间被更改，先前颁发的\
  \ TGT 将不再有效，系统也将无法接收任何新票据。实际上，客户端将被拒绝访问任何受保护的网络资源。\n\n#### 联合身份管理与 SSO\n\nSSO 在内部网络中很常见，在互联网上也有使用。许多基于云的应用程序使用\
  \ SSO 解决方案，使用户更容易通过互联网访问资源。许多基于云的应用程序使用联合身份管理 (FIM)，这是一种形式的 SSO。\n\n身份管理是对用户身份及其凭据的管理。FIM\
  \ 将这一范围扩展到单一组织之外。多个组织可以加入一个联盟或群组，在其中就共享身份的方法达成一致。每个组织中的用户可以在自己的组织中登录一次，其凭据将与一个联合身份相匹配。然后，他们可以使用此联合身份访问群组内任何其他组织中的资源。\n\
  \n联盟可以由单一大学校园内多个不相关的网络、多个大学校园、多个共享资源的组织，或任何其他能就通用联合身份管理系统达成一致的群体组成。联盟成员将组织内的用户身份与联合身份进行匹配。\n\
  \n例如，许多企业在线培训网站使用联合 SSO 系统。当组织与在线培训公司协调员工访问权限时，也会协调联合访问所需的细节。一种常见方法是将用户的内部登录 ID\
  \ 与联合身份匹配。用户使用其正常的登录 ID 在组织内登录。当用户使用网页浏览器访问培训网站时，联合身份管理系统使用其登录 ID 检索匹配的联合身份。如果找到匹配项，它将授权用户访问授予该联合身份的网页。\n\
  \n管理员在后台管理这些细节，该过程通常对用户透明。用户无需再次输入凭据。\n\n多家公司在联盟中通信面临的一个挑战是寻找一种通用语言。它们通常拥有不同的操作系统，但仍需要共享一种通用语言。为解决这一挑战，联合身份系统通常使用安全断言标记语言\
  \ (SAML) 和/或服务供应标记语言 (SPML)。作为背景知识，以下是一些标记语言的简短描述。\n\n##### 超文本标记语言\n\n超文本标记语言 (HTML)\
  \ 通常用于显示静态网页。HTML 源自标准通用标记语言 (SGML) 和通用标记语言 (GML)。HTML 使用标签操纵文本的大小和颜色来描述数据如何显示。例如，以下\
  \ H1 标签将文本显示为一级标题：\n\n```\n<H1>I Passed The CISSP Exam</H1>\n```\n\n##### 可扩展标记语言\n\
  \n可扩展标记语言 (XML) 不仅描述如何显示数据，还通过实际描述数据本身来超越这一点。XML 可以包含标签，将数据描述为任何期望的内容。例如，以下标签将数据标识为参加考试的结果：\n\
  \n```\n<ExamResults>Passed</ExamResults>\n```\n\n来自多个供应商的数据库可以将数据导入和导出到 XML 格式，使\
  \ XML 成为交换信息的通用语言。已经创建了许多特定的模式，以便公司确切知道特定标签用于特定目的。这些模式中的每一个实际上都创建了一种新的 XML 语言。此处列出了一些用于联合身份的常用语言。\n\
  \n##### 安全断言标记语言\n\n安全断言标记语言 (SAML) 是一种基于 XML 的语言，常用于在联合组织之间交换认证和授权 (AA) 信息。它常用于为浏览器访问提供\
  \ SSO 功能。\n\n\n\n\n\n### 服务供应标记语言\n\n**服务供应标记语言 (SPML)** 是由 OASIS 开发的一个较新框架，OASIS\
  \ 是一个鼓励开发开放标准的非营利性联盟。它基于 XML，专门设计用于为联合身份 SSO 目的交换用户信息。它基于目录服务标记语言 (DSML)，后者可以以 XML\
  \ 格式显示基于 LDAP 的目录服务信息。\n\n### 可扩展访问控制标记语言\n\n**可扩展访问控制标记语言 (XACML)** 是由 OASIS 开发的标准，用于在\
  \ XML 格式中定义访问控制策略。它通常将策略实现为基于属性的访问控制系统，但也可以使用基于角色的访问控制。它有助于向联合体中的所有成员提供保证，即他们授予不同角色相同级别的访问权限。\n\
  \n### OAuth 2.0\n\n**OAuth 2.0**（意指开放授权）是一个用于访问委派的开放标准。举个例子，假设你有一个 Twitter 账户。然后你下载了一个名为\
  \ Acme 的应用程序，它可以与你的 Twitter 账户交互。当你尝试使用此功能时，它会将你重定向到 Twitter，如果你尚未登录，系统会提示你登录 Twitter。随后\
  \ Twitter 会询问你是否要授权该应用程序，并告知你将授予哪些权限。如果你批准，Acme 应用程序就可以访问你的 Twitter 账户。一个主要优势是你永远不需要将\
  \ Twitter 凭据提供给 Acme 应用程序。即使 Acme 应用程序遭遇重大数据泄露并暴露其所有数据，也不会暴露你的凭据。许多在线网站支持 OAuth\
  \ 2.0，但不支持 OAuth 1.0。OAuth 2.0 与 OAuth 1.0 不向后兼容。RFC 6749 记录了 OAuth 2.0。\n\n###\
  \ OpenID\n\n**OpenID** 也是一个开放标准，但它由 OpenID 基金会维护，而非作为 RFC 标准。它提供去中心化认证，允许用户使用由第三方服务（称为\
  \ OpenID 提供商）维护的一组凭据登录多个不相关的网站。当用户访问启用了 OpenID 的网站（也称为信赖方）时，系统会提示他们提供作为统一资源定位符 (URL)\
  \ 的 OpenID 身份。这两个网站交换数据并创建一个安全通道。然后用户被重定向到 OpenID 提供商并提示提供密码。如果正确，用户将被重定向回启用了 OpenID\
  \ 的网站。\n\n### OpenID Connect\n\n**OpenID Connect** 是一个使用 OAuth 2.0 框架的认证层。与 OpenID\
  \ 一样，它由 OpenID 基金会维护。它基于 OpenID 创建的技术构建，但使用 JavaScript 对象表示法 (JSON) Web 令牌 (JWT)，也称为\
  \ ID 令牌。OpenID Connect 使用符合表述性状态转移 (REST) 的 Web 服务来检索 JWT。除了提供认证外，JWT 还可以包含用户的配置文件信息。\n\
  \n#### 脚本访问\n\n**脚本访问** 或登录脚本通过提供自动化流程在登录会话开始时传输登录凭据来建立通信链接。脚本访问通常可以模拟 SSO，即使环境仍然需要唯一的认证过程来连接到每个服务器或资源。在真正的\
  \ SSO 技术不可用的环境中，可以使用脚本来实现 SSO。脚本和批处理文件应存储在受保护的区域，因为它们通常包含明文访问凭据。\n\n### 凭据管理系统\n\
  \n**凭据管理系统** 为用户提供存储空间以在 SSO 不可用时保存其凭据。用户可以存储需要不同凭据集的网站和网络资源的凭据。管理系统通过加密保护凭据以防止未经授权的访问。\n\
  \n例如，Windows 系统包含凭据管理器工具。用户将凭据输入凭据管理器，并在必要时，操作系统检索用户的凭据并自动提交它们。当用于网站时，用户输入 URL、用户名和密码。稍后，当用户访问该网站时，凭据管理器会自动识别该\
  \ URL 并提供凭据。\n\n第三方凭据管理系统也可用。例如，KeePass 是一款免费工具，允许你存储凭据。凭据存储在加密数据库中，用户可以使用主密码解锁数据库。解锁后，用户可以轻松复制密码粘贴到网站表单中。也可以将应用程序配置为自动将凭据输入网页表单。当然，使用强主密码保护所有其他凭据非常重要。\n\
  \n### 集成身份服务\n\n身份服务为识别和认证提供额外工具。一些工具专门为基于云的应用程序设计，而另一些则是设计用于组织内部（本地部署）的第三方身份服务。\n\
  \n**身份即服务**，或身份与访问即服务 (IDaaS)，是一种提供身份和访问管理的第三方服务。IDaaS 实际上为云提供 SSO，当内部客户端访问基于云的软件即服务\
  \ (SaaS) 应用程序时特别有用。Google 通过其“一个 Google 账户畅享所有 Google 服务”的座右铭实现了这一点。用户登录其 Google\
  \ 账户一次，即可访问多个基于云的 Google 应用程序，而无需再次登录。\n\n作为另一个例子，Office 365 将 Office 应用程序作为安装型应用程序和\
  \ SaaS 应用程序的组合提供。用户在其系统上安装了完整的 Office 应用程序，这些应用程序也可以使用 OneDrive 连接到云存储。这允许用户从多个设备编辑和共享文件。当人们在家使用\
  \ Office 365 时，Microsoft 提供 IDaaS，允许用户通过云进行认证以访问其 OneDrive 上的数据。\n\n当员工在企业内部使用 Office\
  \ 365 时，管理员可以将网络与第三方服务集成。例如，Centrify 提供可与 Microsoft Active Directory 集成的第三方 IDaaS\
  \ 服务。配置完成后，用户登录域，然后即可访问 Office 365 云资源，无需再次登录。\n\n### 管理会话\n\n使用任何类型的认证系统时，管理会话以防止未经授权的访问非常重要。这包括常规计算机（如台式机）上的会话以及与应用程序的在线会话。\n\
  \n台式机和笔记本电脑包含屏幕保护程序。当计算机未被使用时，这些程序会通过显示随机图案、不同图片或仅仅是将屏幕变黑来更改显示。屏幕保护程序保护了旧式计算机的屏幕，但新型显示器不再需要它们。然而，它们仍在使用，并且屏幕保护程序具有可启用的密码保护功能。此功能显示登录屏幕，并强制用户在退出屏幕保护程序前再次进行认证。\n\
  \n屏幕保护程序有一个以分钟为单位的可配置时间范围。它们通常设置为 10 到 20 分钟之间。如果你将其设置为 10 分钟，它将在 10 分钟后激活。这要求用户在系统空闲\
  \ 10 分钟或更长时间后再次登录。\n\n\n\n\n安全的在线会话通常也会在一段时间后终止。例如，如果你与银行建立了安全会话，但在 10 分钟内未与该会话交互，应用程序通常会将你注销。在某些情况下，应用程序会给你一个通知，提示即将注销。这些通知通常会给你一个机会，点击页面以保持登录状态。如果开发人员不实现这些自动注销功能，就会允许用户的浏览器会话在用户处于登录状态下保持打开。即使用户在未注销的情况下关闭浏览器标签页，也可能会使浏览器会话保持打开状态。如果其他人访问该浏览器，这会使得用户的账户容易受到攻击。\n\
  \n### AAA 协议\n\n有几种协议提供认证、授权和审计，被称为 AAA 协议。这些协议为远程访问系统（如虚拟专用网络（VPN）和其他类型的网络接入服务器）提供集中式访问控制。它们有助于保护内部局域网认证系统和其他服务器免受远程攻击。当使用单独的系统进行远程访问时，对该系统的成功攻击仅影响远程访问用户。换句话说，攻击者将无法访问内部账户。移动\
  \ IP（为智能手机移动用户提供接入）也使用 AAA 协议。\n\n这些 AAA 协议使用本章前面所述的访问控制要素：标识、认证、授权和问责。它们确保用户拥有有效的凭据进行认证，并基于用户已证明的身份验证用户是否被授权连接到远程访问服务器。此外，审计要素可以跟踪用户的网络资源使用情况，可用于计费目的。下面介绍一些常见的\
  \ AAA 协议。\n\n##### RADIUS\n\n`Remote Authentication Dial-in User Service (RADIUS)`\
  \ 为远程连接集中认证。通常在组织拥有多个网络接入服务器（或远程访问服务器）时使用。用户可以连接到任意网络接入服务器，后者将用户的凭据传递给 RADIUS 服务器以验证认证和授权并跟踪审计。在此背景下，网络接入服务器是\
  \ RADIUS 客户端，而 RADIUS 服务器充当认证服务器。RADIUS 服务器还为多个远程访问服务器提供 AAA 服务。\n\n许多互联网服务提供商（ISP）使用\
  \ RADIUS 进行认证。用户可以从任何地方访问 ISP，然后 ISP 服务器将用户的连接请求转发给 RADIUS 服务器。\n\n组织也可以使用 RADIUS，且通常结合基于位置的安全性实施。例如，如果用户通过\
  \ IP 地址连接，系统可以使用地理定位技术识别用户的位置。虽然现在不太常见，但一些用户仍使用综合业务数字网（ISDN）线路连接到 VPN。RADIUS 服务器可以使用回拨安全性提供额外的保护层。用户拨入，认证后，RADIUS\
  \ 服务器终止连接并回拨用户预定义的电话号码。如果用户的认证凭据泄露，回拨安全性可防止攻击者利用它们。\n\nRADIUS 使用 `User Datagram\
  \ Protocol (UDP)` 且仅加密密码的交换过程。它不加密整个会话，但可使用额外的协议来加密数据会话。当前版本定义在 `RFC 2865` 中。\n\n\
  ##### TACACS+\n\n`Terminal Access Controller Access-Control System (TACACS)` 作为\
  \ RADIUS 的替代方案被引入。Cisco 后来推出了作为专有协议的扩展 TACACS（`XTACACS`）。然而，TACACS 和 XTACACS 如今不常用。后来创建了作为开放公开文档协议的\
  \ TACACS Plus（`TACACS+`），它是三者中最常用的。\n\n与早期版本和 RADIUS 相比，TACACS+ 提供了多项改进。它将认证、授权和审计分离为独立的进程，如需要可托管在三台独立的服务器上。其他版本将其中两个或三个进程合并。此外，TACACS+\
  \ 加密所有认证信息，而不仅像 RADIUS 那样仅加密密码。TACACS 和 XTACACS 使用 `UDP` 端口 49，而 TACACS+ 使用 `Transmission\
  \ Control Protocol (TCP)` 端口 49，为数据包传输提供了更高的可靠性。\n\n##### Diameter\n\n基于 RADIUS\
  \ 和 TACACS+ 的成功，开发了 RADIUS 的增强版本 `Diameter`。它支持广泛的协议，包括传统 IP、移动 IP 和 IP 语音（`VoIP`）。因为它支持额外的命令，所以在需要漫游支持的场景（如无线设备和智能手机）中越来越流行。虽然\
  \ Diameter 是 RADIUS 的升级版，但它不向后兼容 RADIUS。\n\nDiameter 使用 `TCP` 端口 3868 或 `Stream\
  \ Control Transmission Protocol (SCTP)` 端口 3868，比 RADIUS 使用的 UDP 提供了更好的可靠性。它还支持\
  \ `Internet Protocol security (IPsec)` 和 `Transport Layer Security (TLS)` 进行加密。\n\
  \n### 管理身份与访问配置生命周期\n\n`identity and access provisioning lifecycle`（身份与访问配置生命周期）指账户的创建、管理和删除。虽然这些活动看似平常，但它们对系统的访问控制能力至关重要。如果没有正确定义和维护的用户账户，系统就无法建立准确的身份、执行认证、提供授权或跟踪问责。如前所述，标识发生在主体声称身份时。这种身份最常见的是用户账户，但也包括计算机账户和服务账户。\n\
  \n访问控制管理是在账户生命周期内管理账户、访问权限和问责所涉及的任务和职责的集合。这些任务包含在身份与访问配置生命周期的三个主要职责中：配置、账户审查和账户撤销。\n\
  \n#### 配置\n\n身份管理的初始步骤是创建新账户并为其配置适当的特权。创建新用户账户通常是一个简单的过程，但该过程必须通过组织安全策略程序得到保护和保障。用户账户不应随管理员意愿创建，也不应响应随意请求而创建。相反，适当的配置确保人员在创建账户时遵循特定程序。\n\
  \n新用户账户的初始创建通常称为 `enrollment`（注册）或登记。注册过程创建新身份并建立系统执行认证所需的因素。注册过程必须完整且准确地完成至关重要。同样至关重要的是，通过组织认为必要且充分的任何手段，证明被注册人员的身份。照片\
  \ ID、出生证明、背景调查、信用检查、安全许可验证、FBI 数据库搜索，甚至致电推荐人，都是在将人员注册到任何安全系统之前验证其身份的有效形式。\n\n\n\n\
  \n许多组织都拥有自动化供给系统。例如，一旦录用某人，人力资源部门完成初始身份识别和入职步骤，然后向 IT 部门转发创建账户的请求。IT 部门内的用户通过应用程序输入信息，如员工姓名及其分配的部门。然后，应用程序使用预定义规则创建账户。自动化供给系统能一致地创建账户，例如始终以相同方式创建用户名，并一致地处理重复用户名。如果策略规定用户名包含名和姓，则应用程序将为名为\
  \ Suzie Jones 的用户创建用户名 `suziejones`。如果组织雇佣了第二名同名员工，则第二个用户名可能是 `suziejones2`。\n\n\
  如果组织使用组（或角色），应用程序可以根据用户的部门或工作职责，自动将新用户账户添加到适当的组中。这些组已分配有适当的特权，因此此步骤可为账户供给适当的特权。\n\
  \n作为招聘流程的一部分，新员工应接受组织安全策略和程序的培训。在招聘完成前，员工通常需要审查并签署一份协议，承诺遵守组织的安全标准。这通常包括可接受使用策略。\n\
  \n在用户账户的整个生命周期中，都需要持续的维护。拥有静态组织层级、低员工流动率或晋升率的组织，所进行的账户管理工作将显著少于拥有灵活或动态组织层级、高员工流动率和晋升率的组织。大多数账户维护涉及更改权利和特权。应建立类似于创建新账户时使用的程序，以管控用户账户生命周期内访问权限的变更方式。账户访问能力的未授权增加或减少可能导致严重的安全后果。\n\
  \n#### 账户审查\n\n应定期审查账户，以确保安全策略得到执行。这包括确保禁用非活动账户，以及员工不拥有过度特权。\n\n许多管理员使用脚本定期检查非活动账户。例如，脚本可以定位过去\
  \ 30 天内用户未曾登录的账户，并自动禁用它们。同样，脚本可以检查特权组（如管理员组）的组成员身份，并移除未授权账户。账户审查通常在审计程序中正式化。\n\n\
  必须防范与访问控制相关的两个问题：过度特权和特权蔓延。`过度特权` 是指用户拥有的特权超出了其分配的工作任务所要求的范围。如果发现用户账户具有过度特权，应立即撤销不必要的特权。`特权蔓延`（有时称为\
  \ `privilege creep`）涉及用户账户随着工作角色和分配任务的变化，随时间积累特权。这可能是因为向用户的工作中添加了新任务并增加了相应特权，但从未移除不再需要的特权。特权蔓延会导致过度特权。\n\
  \n这两种情况都违反了最小特权这一基本安全原则。最小特权原则确保主体仅被授予执行其工作任务和职能所需的特权，而不多授予任何额外特权。账户审查能有效发现这些问题。\n\
  \n#### 账户撤销\n\n无论出于何种原因，当员工离开组织时，尽快禁用其用户账户非常重要。这包括员工休假的情况。只要有可能，人力资源人员应具备执行此任务的能力，因为他们知晓员工因任何原因离职的情况。例如，人力资源人员知道员工即将被解雇，他们可以在员工离职面谈期间禁用账户。\n\
  \n如果已解雇的员工在离职面谈后仍保留对用户账户的访问权限，破坏活动的风险极高。即使该员工不采取恶意行动，如果其他员工发现了密码，也可能使用该账户。日志将以已解雇员工的名义记录活动，而不是实际执行操作的人。\n\
  \n该账户可能仍被需要，例如用于访问加密数据，因此不应立即删除。当确定不再需要该账户时，应将其删除。账户通常在禁用后 30 天内删除，但这可能因组织需求而异。\n\
  \n许多系统都有为任意账户设置特定过期日期的功能。这些对于临时或短期员工很有用，并可在过期日期自动禁用账户，例如为期 30 天合同雇佣的临时员工，在 30 天后自动禁用。这在不需要持续管理监督的情况下保持了一定程度的控制。\n\
  \n### 摘要\n\nCISSP 通用知识体系的第 5 领域是身份与访问管理（IAM）。它涵盖了授予或限制对资产访问的管理、行政和实施方面。资产包括信息、系统、设备、设施和人员。访问控制基于主体和客体之间的关系来限制访问。主体是主动实体（如用户），客体是被动实体（如文件）。\n\
  \n三种主要的访问控制类型是预防性、检测性和纠正性。预防性访问控制试图在事件发生前防止事件。检测性访问控制试图在事件发生后检测事件。纠正性访问控制试图在检测到事件后纠正事件造成的问题。\n\
  \n控制措施以管理、逻辑和物理方式实施。管理控制也称为管理控制，包括策略和程序。逻辑控制也称为技术控制，通过技术手段实施。物理控制使用物理手段保护客体。\n\n\
  四个主要的访问控制要素是识别、认证、授权和审计。主体（用户）声称一种身份（如用户名），并通过认证机制（如密码）证明该身份。在认证主体后，授权机制控制其访问，审计跟踪记录其活动，以便追究其行为责任。\n\
  \n认证的三个主要因素是：你知道的（如密码或 PIN）、你拥有的（如智能卡或令牌）和你本身的（通过生物特征识别）。多因素认证使用不止一种认证因素，它比使用任何单一认证因素都更强。\n\
  \n单点登录允许用户认证一次，即可访问网络中的任何资源，而无需再次认证。Kerberos 是一种流行的单点登录认证协议，使用票据进行认证。Kerberos 使用主体数据库、对称加密和系统时间同步来颁发票据。\n\
  \n联合身份管理是一种单点登录解决方案，可扩展到单个组织之外。多个组织创建或加入一个联盟，并就共享身份的方法达成一致。用户可在其组织内认证，并访问其他组织中的资源，而无需再次认证。SAML\
  \ 是互联网上用于 SSO 的常用协议。\n\n\n\n\n\n### AAA 协议\n\nAAA 协议提供认证、授权和审计。流行的 AAA 协议包括 RADIUS、TACACS+\
  \ 和 Diameter。\n\n### 身份与访问配置生命周期\n\n身份与访问配置生命周期包含创建、管理和删除主体所用账户的过程。配置包括创建账户的初始步骤，并确保授予它们对对象的适当访问权限。随着用户工作职责的变化，他们通常需要对初始访问权限进行更改。账户审查过程确保账户修改遵循最小权限原则。当员工离开组织时，应尽快禁用账户，并在不再需要时将其删除。\n\
  \n### 考试要点\n\n#### 了解主体与对象的区别\n\n您会发现 CISSP 考题和安全文档通常使用*主体*和*对象*这两个术语，因此了解它们之间的区别非常重要。主体是访问被动对象（如文件）的主动实体（如用户）。用户是在执行某项操作或完成工作任务时访问对象的主体。\n\
  \n#### 了解各种访问控制类型\n\n您应该能够识别任何给定访问控制的类型。访问控制可分为预防性（阻止不需要或未授权的活动发生）、检测性（发现不需要或未授权的活动）或纠正性（在不需要或未授权的活动发生后将系统恢复正常）。威慑性访问控制试图通过鼓励人们决定不采取不需要的行动，来阻止违反安全策略的行为。恢复控制试图在安全策略违规后修复或恢复资源、功能和能力。指令性控制试图指导、限制或控制主体的行为，以强制或鼓励其遵守安全策略。补偿性控制为现有控制提供选项或替代方案，以协助安全策略的实施和支持。\n\
  \n#### 了解访问控制的实施方法\n\n控制措施可作为管理控制、逻辑/技术控制或物理控制来实施。管理控制包括实施和强制执行整体访问控制的策略或程序。逻辑/技术控制包括用于管理对资源和系统的访问并为这些资源和系统提供保护的硬件或软件机制。物理控制包括部署的物理屏障，用于防止与设施内的系统或区域进行直接接触和访问。\n\
  \n#### 了解标识与认证的区别\n\n访问控制依赖于有效的标识和认证，因此了解它们之间的区别很重要。主体声称一种身份，标识可以像用户的用户名一样简单。主体通过提供认证凭据（如与用户名匹配的密码）来证明其身份。\n\
  \n#### 了解授权与问责的区别\n\n在认证主体之后，系统根据其已验证的身份授权对对象的访问。审计日志和审计跟踪记录事件，包括执行操作的主体身份。有效的标识、认证和审计相结合可提供问责制。\n\
  \n#### 了解主要认证因素的详细信息\n\n认证的三个主要因素是：您知道的某事（如密码或 PIN 码）、您拥有的某物（如智能卡或令牌）和您本身的特征（基于生物特征）。多因素认证包含两个或更多认证因素，使用它比使用单一认证因素更安全。密码是最薄弱的认证形式，但密码策略通过强制执行复杂性和历史要求有助于提高其安全性。智能卡包含微处理器和加密证书，令牌生成一次性密码。生物特征方法根据指纹等特征识别用户。交叉错误率标识生物特征方法的准确性。它显示了拒真率等于认假率的点。\n\
  \n#### 了解单点登录\n\n单点登录 (SSO) 是一种机制，允许主体认证一次即可访问多个对象，而无需再次认证。Kerberos 是组织内部最常用的 SSO\
  \ 方法，它使用对称加密和票据来证明身份并提供认证。当多个组织想要使用通用的 SSO 系统时，它们通常会使用联合身份管理系统，其中联盟或组织群体就通用的认证方法达成一致。安全断言标记语言\
  \ (SAML) 常用于共享联合身份信息。其他 SSO 方法包括脚本访问、SESAME 和 KryptoKnight。OAuth 和 OpenID 是互联网上使用的两种较新的\
  \ SSO 技术。谷歌等许多大型组织推荐使用 OAuth 2.0 而非 OAuth 1.0。\n\n#### 了解 AAA 协议的目的\n\n多种协议提供集中式认证、授权和审计服务。网络接入（或远程接入）系统使用\
  \ AAA 协议。例如，网络接入服务器是 RADIUS 服务器的客户端，RADIUS 服务器提供 AAA 服务。RADIUS 使用 UDP 且仅加密密码。TACACS+\
  \ 使用 TCP 且加密整个会话。Diameter 基于 RADIUS 并改进了 RADIUS 的许多弱点，但 Diameter 与 RADIUS 不兼容。Diameter\
  \ 在智能手机等移动 IP 系统中越来越流行。\n\n#### 了解身份与访问配置生命周期\n\n身份与访问配置生命周期是指账户的创建、管理和删除。配置账户可确保它们根据任务要求拥有适当的特权。定期审查可确保账户没有过度特权并遵循最小权限原则。撤销包括员工离职时尽快禁用账户，并在不再需要时删除账户。\n\
  \n### 书面实验\n\n1.  列举至少三种访问控制类型。\n2.  描述标识、认证、授权和问责之间的区别。\n3.  描述三种主要的认证因素类型。\n4.\
  \  说出允许用户登录一次即可访问多个组织中的资源而无需再次认证的方法名称。\n5.  确定身份与访问配置生命周期中的三个主要要素。\n\n### 复习题\n\n\
