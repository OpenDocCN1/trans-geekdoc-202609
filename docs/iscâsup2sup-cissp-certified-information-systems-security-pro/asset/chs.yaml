  \n1.  完全备份和差异备份\n2.  部分备份和增量备份\n3.  完全备份和增量备份\n4.  增量备份和差异备份\n\n## 20. 哪种灾难恢复计划测试类型会在备用设施全面评估运营，但不会将主要运营责任从主站点转移？\n\
  \n1.  结构化演练\n2.  并行测试\n3.  全面中断测试\n4.  模拟测试\n\n## 第 19 章 调查与伦理\n\n## 本章涵盖的 CISSP\
  \ 考试主题\n\n### 领域 1：安全与风险管理\n\n*   1.5 理解、遵守并推广职业道德\n    *   1.5.1 (ISC)² 职业道德准则\n\
  \    *   1.5.2 组织职业道德准则\n\n### 领域 7：安全运营\n\n*   7.1 理解并支持调查\n    *   7.1.1 证据收集与处理\n\
  \    *   7.1.2 报告与记录\n    *   7.1.3 调查技术（如根因分析、事件处理）\n    *   7.1.4 数字取证工具、战术与程序\n\
  *   7.2 理解调查类型的要求\n    *   7.2.1 行政调查\n    *   7.2.2 刑事调查\n    *   7.2.3 民事调查\n\
  \    *   7.2.4 监管调查\n    *   7.2.5 行业标准\n\n![images](img/clogo.jpg) 在本章中，我们将探讨调查是否发生计算机犯罪以及在适当情况下收集证据的过程。本章还完整讨论了道德问题和信息安全从业者的行为准则。\n\
  \n作为一名安全专业人员，您必须熟悉各种类型的调查。这些包括行政、刑事、民事和监管调查，以及涉及行业标准的调查。您必须熟悉每种调查类型使用的证据标准以及收集证据以支持调查的取证程序。\n\
  \n### 调查\n\n每一位信息安全专业人员都会在某个时候遇到需要调查的安全事件。在许多情况下，这种调查将是简短的、非正式的，以确定该事件是否严重到足以采取进一步行动或涉及执法部门。然而，在某些情况下，所构成的威胁或造成的损害将足够严重，需要进行更正式的调查。当这种情况发生时，调查人员必须小心确保遵循正确的程序。未能遵守正确程序可能会侵犯被调查个人的公民权利，并可能导致起诉失败，甚至针对调查人员的法律行动。\n\
  \n#### 调查类型\n\n安全从业者可能会因各种原因进行调查。其中一些调查涉及执法部门，必须遵循旨在产生法庭可采纳证据的严格标准。其他调查支持内部业务流程，所需严谨性要低得多。\n\
  \n##### 行政调查\n\n行政调查是内部调查，旨在检查运营问题或违反组织政策的行为。它们可以作为技术故障排除工作的一部分，或支持其他行政流程（如人力资源纪律程序）而进行。\n\
  \n运营调查检查与组织计算基础设施相关的问题，其主要目标是解决运营问题。例如，信息技术（IT）团队发现其 Web 服务器存在性能问题，可能会进行运营调查以确定性能问题的原因。\n\
  \n运营调查对信息收集的标准最为宽松。它们不旨在产生证据，因为它们仅用于内部运营目的。因此，进行运营调查的管理员将仅进行得出运营结论所需的分析。收集过程无需彻底或有详细记录，因为解决问题是主要目标。\n\
  \n\n\n\n\n### 调查\n\n除了解决运营问题外，运营调查通常还会进行*根因分析*，旨在确定运营问题发生的原因。根因分析往往会凸显出需要补救的问题，以防止未来发生类似事件。\n\
  \n非运营性质的行政调查可能需要更严格的证据标准，特别是当调查可能导致对个人实施制裁时。对于这些调查中适当的证据标准，没有固定的指导方针。安全专业人员应咨询调查发起人及其法律团队，以确定行政调查中适当的证据收集、处理和保留指南。\n\
  \n#### 刑事调查\n\n刑事调查通常由执法人员进行，旨在调查涉嫌违反刑法的行为。刑事调查可能导致对嫌疑人提起刑事指控，并在刑事法庭上对这些指控进行起诉。\n\
  \n大多数刑事案件必须满足*排除合理怀疑*的证据标准。遵循这一标准，控方必须通过呈现事实来证明被告犯有罪行，这些事实不得有其他合乎逻辑的结论。因此，刑事调查必须遵循非常严格的证据收集和保全流程。\n\
  \n#### 民事调查\n\n民事调查通常不涉及执法部门，而是涉及代表法律团队工作的内部员工和外部顾问。他们准备在民事法庭上提交证据，以解决双方之间的纠纷。\n\
  \n大多数民事案件不遵循排除合理怀疑的举证标准。相反，它们使用较弱的*证据优势*标准。满足这一标准仅要求证据证明案件的结果更有可能发生而非不发生。因此，民事调查的证据收集标准不如刑事调查严格。\n\
  \n#### 监管调查\n\n当政府机构认为个人或公司违反了行政法时，可能会进行监管调查。监管机构通常会按照与其预期审理案件的法庭相称的证明标准来进行这些调查。监管调查的范围和程序差异很大，通常由政府特工执行。\n\
  \n某些监管调查可能不涉及政府机构。这些调查基于行业标准，例如支付卡行业数据安全标准（PCI DSS）。这些行业标准不是法律，而是参与组织签订的合同义务。在某些情况下（包括\
  \ PCI DSS），组织可能被要求接受独立第三方进行的审计、评估和调查。拒绝参与这些调查或调查结果不佳可能导致罚款或其他制裁。因此，针对违反行业标准的调查应以类似于监管调查的方式对待。\n\
  \n#### 电子取证\n\n在法律程序中，双方都有责任保存与案件相关的证据，并通过取证程序与对手共享信息。这一取证程序适用于纸质记录和电子记录，电子取证（或\
  \ eDiscovery）流程促进了电子信息的处理以供披露。\n\n电子取证参考模型描述了进行电子取证的标准流程，共九个步骤：\n\n*   **信息治理**确保信息组织良好，以便未来的电子取证工作。\n\
  *   **识别**在组织预计可能发生诉讼时，定位可能响应取证请求的信息。\n*   **保全**确保潜在可取证的信息免受篡改或删除。\n*   **收集**将响应信息集中收集，以供电子取证流程使用。\n\
  *   **处理**筛选收集的信息，对无关信息进行“粗略剔除”，减少需要详细筛选的信息量。\n*   **审查**检查剩余信息，确定哪些信息响应请求，并移除受律师-委托人特权保护的任何信息。\n\
  *   **分析**对剩余信息的内容和上下文进行更深入的检查。\n*   **生成**将信息转换为可与他人共享的格式。\n*   **呈现**向证人、法庭和其他当事方展示信息。\n\
  \n进行电子取证是一个复杂的过程，需要信息技术专业人员和法律顾问之间的仔细协调。\n\n### 证据\n\n要成功起诉犯罪，控方律师必须提供充分的证据，证明个人有罪达到了排除合理怀疑的程度。在以下章节中，我们将解释证据在被法庭采纳前必须满足的要求、可引入的各种证据类型，以及证据处理和记录的要求。\n\
  \n#### 可采纳证据\n\n证据要在法庭上被采纳，有三项基本要求。要被视为*可采纳证据*，法官在公开审理前必须认定其同时满足以下三项要求：\n\n*   证据必须与确定事实*相关*。\n\
  *   证据旨在确定的事实必须与案件*实质相关*（即相关联）。\n*   证据必须*合法有效*，意味着其必须通过合法手段获得。因非法搜查而获得的证据将因不合法而被判定为不可采纳。\n\
  \n#### 证据类型\n\n法庭上可使用三类证据：物证、书证和证人证言。每类证据对于可采纳性都有略微不同的额外要求。\n\n##### 物证\n\n*物证*（也称为*实物证据*）由可实际带入法庭的物品组成。在常见的刑事诉讼中，这可能包括凶器、衣物或其他实物。在计算机犯罪案件中，物证可能包括被扣押的计算机设备，例如带有指纹的键盘或来自黑客计算机系统的硬盘驱动器。视情况而定，物证也可能是*确凿证据*，例如脱氧核糖核酸（DNA），这是无可辩驳的。\n\
  \n##### 书证\n\n*书证*包括带入法庭以证明当前事实的任何书面材料。此类证据也必须经过认证。例如，如果律师想将计算机日志作为证据引入，他们必须传唤证人（例如系统管理员）出庭作证，证明该日志是作为常规业务实践收集的，且确实是系统收集的实际日志。\n\
  \n两条额外的证据规则专门适用于书证：\n\n*   *最佳证据规则*规定，当文件在法庭程序中作为证据使用时，必须提交原始文件。除非适用该规则的特定例外情况，否则原始证据的副本或描述（称为*次级证据*）将不被接受为证据。\n\
  *   *口头证据规则*规定，当当事人之间的协议以书面形式订立时，推定书面文件包含协议的所有条款，任何口头协议均不得修改书面协议。\n\n\n\n\n如果书面证据满足实质性、胜任力和关联性要求，且遵守最佳证据规则和口头证据规则，则可被法庭采纳。\n\
  \n##### 证人证言证据\n\n**证人证言证据** 简单来说，就是由证人证词组成的证据，无论是法庭上的口头证词，还是记录在案的书面证词（即证词记录）。证人必须宣誓承诺讲真话，且其证词必须基于个人知晓的情况。此外，证人必须记住其证词的依据（他们可以查阅书面笔记或记录来辅助记忆）。证人可以提供\
  \ **直接证据**：基于其自身直接观察，能够证明或反驳主张的口头证词。大多数证人的证言证据必须严格限制在基于证人事实观察的直接证据上。但是，如果证人已被法庭认定为某一领域的专家，则不适用此限制。在这种情况下，证人可以基于呈堂的其他事实及其对该领域的个人知识，提供\
  \ **专家意见**。\n\n证言证据不得为 **传闻证据**。即证人不能就法庭外他人告诉他们的内容作证。未经系统管理员认证的计算机日志文件也可被视为传闻证据。\n\
  \n###### 证据收集与取证程序\n\n收集数字证据是一个棘手的过程，应仅由专业的取证技术人员尝试。国际计算机证据组织 (IOCE) 概述了六项原则，指导数字证据技术人员在追求取证恢复证据的过程中进行介质分析、网络分析和软件分析：\n\
  \n*   处理数字证据时，必须应用所有通用的取证和程序原则。\n*   扣押数字证据时，采取的行动不应改变该证据。\n*   当有必要由某人访问原始数字证据时，该人员应接受过相应目的的培训。\n\
  *   与数字证据的扣押、访问、存储或传输相关的所有活动，必须完整记录、保存，并可供审查。\n*   个人对其持有数字证据期间采取的所有行动负责。\n*   负责扣押、访问、存储或传输数字证据的任何机构，均有责任遵守这些原则。\n\
  \n在进行取证证据收集时，保留原始证据非常重要。请记住，调查行为本身可能会改变您正在评估的证据。因此，在分析数字证据时，最好尽可能使用实际证据的副本进行工作。例如，在调查硬盘驱动器内容时，制作该驱动器的镜像，将原始驱动器密封在证据袋中，然后使用磁盘镜像进行调查。\n\
  \n###### 介质分析\n\n介质分析是计算机取证分析的一个分支，涉及从存储介质中识别和提取信息。这可能包括以下内容：\n\n*   磁性介质（如硬盘、磁带）\n\
  *   光学介质（如光盘 (CD)、数字多功能光盘 (DVD)、蓝光光盘）\n*   存储器（如随机存取存储器 (RAM)、固态存储）\n\n介质分析使用的技术可能包括：从物理磁盘的未分配扇区恢复已删除文件、对连接到计算机系统的存储介质进行实时分析（在检查加密介质时特别有用）、以及对存储介质的取证镜像进行静态分析。\n\
  \n###### 网络分析\n\n取证调查人员通常也对安全事件发生期间网络上发生的活动感兴趣。由于网络数据的易失性，这通常很难重构——如果在发生时没有刻意记录，通常不会被保留。\n\
  \n因此，网络取证分析通常依赖于对事件正在进行的事先知情，或使用预先存在的记录网络活动的安全控制。这些包括：\n\n*   入侵检测和防御系统日志\n*   流量监控系统捕获的网络流数据\n\
  *   事件期间刻意收集的数据包捕获\n*   防火墙和其他网络安全设备的日志\n\n网络取证分析师的任务是从这些不同来源收集并关联信息，生成尽可能全面的网络活动图景。\n\
  \n###### 软件分析\n\n取证分析师也可能被要求对应用程序或运行中应用程序内发生的活动进行取证审查。在某些情况下，当怀疑存在恶意内部人员时，取证分析师可能被要求审查软件代码，寻找后门、逻辑炸弹或其他安全漏洞。有关这些主题的更多信息，请参见第\
  \ 21 章“恶意代码和应用攻击”。\n\n在其他情况下，取证分析师可能被要求审查和解读应用程序或数据库服务器的日志文件，寻找其他恶意活动迹象，如 SQL 注入攻击、权限提升或其他应用攻击。这些内容也在第\
  \ 21 章中讨论。\n\n###### 硬件/嵌入式设备分析\n\n最后，取证分析师通常必须审查硬件和嵌入式设备的内容。这可能包括对以下内容的审查：\n\n\
  *   个人计算机\n*   智能手机\n*   平板电脑\n*   汽车、安全系统和其他设备中的嵌入式计算机\n\n进行这些审查的分析师必须具备对被审查系统的专业知识。这通常需要聘请熟悉此类设备的内存、存储系统和操作系统的专家顾问。由于软件、硬件和存储之间复杂的交互，硬件分析学科要求同时具备介质分析和软件分析的技能。\n\
  \n### 调查流程\n\n当你启动计算机安全调查时，首先应组建一支由胜任分析师组成的团队协助调查。该团队应在组织现有的事件响应政策下运作，并获得一份章程，明确界定调查范围；调查人员的权限、角色和职责；以及他们在调查过程中必须遵守的任何交战规则。这些交战规则定义并指导调查人员在调查不同阶段被授权采取的行动，如联络执法部门、讯问嫌疑人、收集证据和中断系统访问。\n\
  \n#### 收集证据\n\n为了进行适当的调查，通常会没收设备、软件或数据。没收证据的方式很重要。证据的没收必须以适当的方式进行。有三种基本选择。\n\n首先，证据所有人可以\
  \ **自愿交出** 证据。这种方法通常仅适用于攻击者不是所有者的情况。极少有罪方会自愿交出他们知道会使自己受到指控的证据。经验较浅的攻击者可能认为他们已成功掩盖踪迹，从而自愿交出重要证据。优秀的取证调查员可以从计算机中提取大量“被掩盖”的信息。在大多数情况下，向嫌疑攻击者索要证据只会警告嫌疑人，您即将采取法律行动。\n\
  \n\n\n\n### 证据获取的法律途径\n\n其次，您可以申请法院签发 `subpoena`（传票/法庭命令），强制个人或组织交出证据，随后由执法部门送达传票。同样，这种做法会给当事人留出足够的时间篡改证据，导致其在法庭上失去效力。\n\
  \n最后一种选择是 `search warrant`（搜查令）。只有在必须不惊动证据持有者或其他人员的前提下获取证据时，才应使用此选项。您必须有强烈的怀疑并提供可信的理由，以说服法官批准这一行动。\n\
  \n上述三种方式均适用于组织内外设备的扣押，但还有一项措施可确保扣押属于您组织的设备时程序合规。通常要求所有新入职员工签署一份协议，同意在调查期间搜查并扣押任何必要的证据。这样，同意权即作为雇佣协议的条款之一被授予。这使得扣押过程更加顺利，并降低了在等待合法扣押许可期间证据灭失的风险。请确保您的安全策略涵盖这一重要主题。\n\
  \n### 联系执法部门\n\n调查初期必须做出的首要决定之一是否联系执法部门。这是一个相对复杂的决策，应由高级管理人员参与。联系专业机构有许多有利因素。例如，联邦调查局（FBI）设有全国性的网络部门，作为网络犯罪调查的卓越中心。此外，当地\
  \ FBI 分局现已配备专门受过网络犯罪调查培训的特工。这些特工负责调查其辖区内的联邦罪行，并可应要求与当地执法部门协商。美国特勤局总部及分局同样拥有具备相关技能的工作人员。\n\
  \n另一方面，两大因素可能导致公司不愿联系当局。首先，调查极有可能公开，从而给公司带来尴尬。其次，执法部门必须遵守第四修正案及其他法律要求开展调查，而这些要求在组织自行进行私人调查时可能不适用。\n\
  \n### 开展调查\n\n如果决定不联系执法部门，仍应遵循严谨调查的原则，以确保调查的准确性与公正性。请牢记以下关键原则：\n\n*   **切勿在实际受损系统上开展调查。**\
  \ 将系统下线、制作备份，并使用备份进行事件调查。\n*   **切勿尝试“反向入侵”以报复犯罪。** 您可能会误伤无辜的第三方，并因此面临计算机犯罪指控。\n\
  *   **如有疑虑，请寻求专家协助。** 若不愿联系执法部门，请联系在计算机安全调查领域具有特定经验的私人调查公司。\n\n### 询问相关人员\n\n调查过程中，您可能需要与掌握相关信息的个人交谈。若仅为收集信息以协助调查，这称为\
  \ `interview`（访谈）；若怀疑该人涉嫌犯罪并意图将所获信息用于法庭，则称为 `interrogation`（讯问）。\n\n访谈与讯问均属专业技能，仅应由受过培训的调查人员执行。不当手法可能危及执法部门成功起诉犯罪者的能力。此外，许多法律管辖拘留或扣押人员的行为，若您计划进行私人讯问，必须遵守这些法律。开展任何访谈前，请务必咨询律师。\n\
  \n### 数据完整性与保留\n\n无论证据多具说服力，若在收集过程中遭篡改，法庭均可将其排除。务必能证明您保持了所有证据的完整性。但数据在收集前的完整性如何保障？\n\
  \n您可能无法在事件发生时尽数发现。有时调查会揭示此前存在未被察觉的事件。沿着证据线索追踪，却发现本可指向攻击者的关键日志文件已被清除，这令人沮丧。请审慎考虑日志文件或其他潜在证据存储位置的留存策略。简单的归档策略有助于确保关键证据随时可用，无论事件发生多久前。\n\
  \n由于许多日志文件包含有价值证据，攻击者在得手后常试图清洗日志。请采取措施保护日志文件完整性并防止其被篡改。一种技术是实施 `remote logging`（远程日志记录），即网络上所有系统将日志记录发送至一台集中式日志服务器，该服务器经过加固可抵御攻击，且不允许修改数据。此技术可防范事后日志清洗。管理员也常使用\
  \ `digital signatures`（数字签名）证明日志文件在初始采集后未被篡改。有关数字签名的更多信息，请参阅第 7 章“PKI 与密码学应用”。\n\
  \n与安全规划的各个方面一样，不存在放之四海而皆准的单一解决方案。请熟悉您的系统，并采取最适合贵组织的措施加以保护。\n\n### 调查报告与文档记录\n\n\
  每次调查均应形成最终报告，记录调查目标、遵循的程序、收集的证据及最终结果。报告的正式程度将根据组织的策略与程序以及调查性质而有所不同。\n\n编写正式文档至关重要，因为它为升级处理和潜在法律行动奠定了基础。您可能在调查开始时（甚至结束后）并不知晓是否会引发法律诉讼，但应为此做好准备。即使是针对行政事务的内部调查，也可能成为雇佣纠纷或其他法律诉讼的一部分。\n\
  \n建议与企业法务人员及相关执法机构建立工作关系。提前确定贵组织的执法联系人并与其沟通。当需要上报事件时，前期建立的工作关系将发挥作用。若您已熟悉对方，将大幅减少介绍和解释的时间。最好提前指定组织内的单一联络点作为与执法部门的联络人。这有两大好处：首先，确保执法部门听到组织统一的声音，并知晓获取进展的“首选联系人”；其次，让指定联络人得以与执法人员建立工作关系。\n\
  \n### 计算机犯罪的主要类别\n\n\n\n\n### 计算机犯罪分类\n\n攻击计算机系统的方式多种多样，动机也是各不相同。信息系统安全从业者通常将针对计算机或涉及计算机的犯罪划分为不同的类别。简单来说，**计算机犯罪**是指涉及计算机的犯罪（或违反法律法规的行为）。犯罪的对象可以是计算机本身，也可以是利用计算机实施实际犯罪行为。每一类计算机犯罪都代表了攻击的目的及其预期结果。\n\
  \n任何违反您一项或多项安全策略的个人都被视为**攻击者**。攻击者使用不同的技术来达成特定目标。了解这些目标有助于理清不同类型的攻击。请记住，犯罪就是犯罪，计算机犯罪背后的动机与其他任何类型犯罪背后的动机并无不同。唯一真正的区别可能在于攻击者用来实施攻击的方法。\n\
  \n计算机犯罪通常可归类为以下类型之一：\n\n*   军事和情报攻击\n*   商业攻击\n*   金融攻击\n*   恐怖主义攻击\n*   怨恨攻击\n\
  *   寻求刺激攻击\n\n了解计算机犯罪各类别之间的差异，对于理解如何最好地保护系统以及在攻击发生时如何应对至关重要。攻击者留下的证据类型和数量往往取决于其专业水平。在以下章节中，我们将讨论计算机犯罪的不同类别以及攻击发生后您可能发现的证据类型。这些证据可以帮助您确定攻击者的行为和预期目标。您可能会发现，您的系统只是用于到达真正受害者的网络跳板链中的一环，这使得回溯追踪真正的攻击者变得更加困难。\n\
  \n#### 军事和情报攻击\n\n**军事和情报攻击**的主要发起目的是从执法部门、军事或技术研究来源获取秘密和受限信息。此类信息的泄露可能会危及调查、扰乱军事规划并威胁国家安全。旨在收集军事信息或其他敏感情报的攻击，往往是其他更具破坏性攻击的前兆。\n\
  \n攻击者可能在寻找以下类型的信息：\n\n*   任何类型的军事描述性信息，包括部署信息、备战信息和作战计划\n*   为军事或执法目的收集的秘密情报\n*\
  \   刑事调查中获得的证据的描述和存储位置\n*   任何可用于后续攻击的秘密信息\n\n鉴于军事和情报机构收集和使用的信息具有高度敏感性，其计算机系统往往成为经验丰富的攻击者的诱人目标。为了防御数量更多、手段更复杂的攻击者，您通常会在这些存放此类信息的系统上发现更正式的安全策略。正如您在第\
  \ 1 章“通过原则和策略进行安全治理”中所学，数据可根据敏感度进行分类，并存储在支持所需安全级别的系统上。在军事和情报机构的系统上，通常会发现严格的边界安全以及限制对机密文档访问的内部控制。\n\
  \n您可以确信，旨在获取军事或情报信息的严重攻击是由专业人士实施的。专业攻击者通常会非常彻底地掩盖踪迹。此类攻击发生后，通常几乎没有证据可供收集。这类攻击者在无人知晓攻击发生时最为成功、也最为满意。\n\
  \n#### 商业攻击\n\n**商业攻击**侧重于非法获取组织的机密信息。这可能是对组织运营至关重要的信息（如秘密配方），也可能是一旦泄露会损害组织声誉的信息（如员工个人信息）。收集竞争对手的机密信息，也称为**商业间谍活动**或**工业间谍活动**，并非新鲜事物。多年来，企业一直利用非法手段获取竞争情报。或许变化的是间谍活动的来源，因为国家资助的间谍活动已成为一项重大威胁。窃取竞争对手商业秘密的诱惑，加上精明的攻击者能轻松攻破某些计算机系统，使得这种攻击类型极具吸引力。\n\
  \n商业攻击的目标仅在于提取机密信息。攻击期间收集的信息被利用时，通常造成的破坏比攻击行为本身更大。遭受此类攻击的企业可能会陷入永难恢复的境地。作为安全专业人员，您有责任确保包含机密数据的系统是安全的。此外，还必须制定相应策略，以便在发生此类入侵时进行处理。（有关安全策略的更多信息，请参阅第\
  \ 2 章“人员安全与风险管理概念”。）\n\n#### 金融攻击\n\n**金融攻击**是为非法获取金钱或服务而实施的。它们是您在新闻中最常听到的计算机犯罪类型。金融攻击的目标可能是窃取信用卡号、增加银行账户余额，或拨打“免费”长途电话。\n\
  \n商店行窃和入室盗窃都是金融攻击的例子。您通常可以通过损失金额判断攻击者的复杂程度。技术不成熟的攻击者寻找更容易得手的目标，虽然损失通常很小，但随着时间的推移会累积起来。\n\
  \n由复杂攻击者发起的金融攻击可能导致巨额损失。即使是每笔交易只转移少量资金的攻击，累积起来也可能演变成严重的金融攻击，导致高达数百万美元的损失。与前面描述的攻击一样，您检测攻击和追踪攻击者的难易程度，很大程度上取决于攻击者的技术水平。\n\
  \n#### 恐怖主义攻击\n\n**恐怖主义攻击**是现代社会的现实。我们对信息系统的日益依赖使其对恐怖分子的吸引力越来越大。此类攻击不同于军事和情报攻击。恐怖主义攻击的目的是扰乱正常生活并制造恐惧，而军事或情报攻击旨在窃取秘密信息。情报收集通常先于任何类型的恐怖主义攻击。成为恐怖主义攻击受害者的系统，很可能在早期的攻击中已被攻破以收集情报。您在检测任何类型攻击方面越勤奋，就越能做好准备，在更严重的攻击发生前进行干预。\n\
  \n计算机恐怖主义攻击的潜在目标可能是调节发电厂、控制电信或电力分配的系统。许多此类控制和调节系统实现了计算机化，且容易受到恐怖主义行动的威胁。事实上，同时发生物理和计算机化恐怖主义攻击的可能性是存在的。如果物理攻击与旨在瘫痪电力和通信的计算机攻击同时发动，我们对此类攻击的响应能力将大打折扣。\n\
  \n大多数大型电力和通信公司都配备了专门的安全团队以确保其系统安全，但许多连接互联网的中小企业系统更容易受到攻击。您必须勤奋地监控系统以识别任何攻击，并在发现攻击时迅速响应。\n\
  \n### 怨恨攻击\n\n\n\n\n### 怨恨攻击\n\n*怨恨攻击*是指旨在损害组织或个人的攻击。这种损害可能表现为信息丧失、信息处理能力受损，或对组织或个人声誉造成伤害。怨恨攻击背后的动机通常是怨恨情绪，攻击者可能是现任或前任员工，或是对组织怀有恶意的人。攻击者对受害者心怀不满，并以怨恨攻击的形式发泄其挫败感。\n\
  \n最近被解雇的员工是可能实施怨恨攻击以向组织“报复”的典型例子。另一个例子是与另一名员工的私人关系遭拒绝的人。被拒绝者可能会发起攻击，破坏受害者系统上的数据。\n\
  \n您的安全策略应涵盖离职员工实施攻击的可能性。例如，一旦员工被解雇，应立即终止该员工的所有系统访问权限。此举可降低怨恨攻击的可能性，并移除未使用的访问账户，防止其在未来的攻击中被利用。\n\
  \n尽管大多数怨恨攻击者只是心怀不满且黑客技术有限的人员，但也有一些人具备造成重大损害的技能。一个不满的破解者会给安全专业人员带来极大麻烦。当已知具备破解能力的人员离开您的公司时，务必采取极端谨慎的措施。至少，您应对该人员曾可访问的所有系统进行漏洞评估。您可能会惊讶地在系统中发现一个或多个“后门”。（有关后门的更多信息，请参见第\
  \ 21 章。）但即使不存在任何后门，熟悉组织技术架构的前员工也可能知道如何利用其弱点。\n\n如果任由怨恨攻击不受控制地发生，后果可能是毁灭性的。勤勉的监控和评估系统漏洞是抵御大多数怨恨攻击的最佳保护措施。\n\
  \n#### 娱乐性攻击\n\n*娱乐性攻击*是仅为了寻求刺激而发起的攻击。缺乏自行设计攻击能力的攻击者通常会下载现成的程序来为其“效力”。这些攻击者常被称为*脚本小子*，因为他们仅运行他人的程序或脚本来发起攻击。\n\
  \n这些攻击的主要动机是成功入侵系统带来的“快感”。如果您成为娱乐性攻击的受害者，最常见的后果是服务中断。尽管此类攻击者可能会破坏数据，但其主要动机是攻陷系统，并可能利用该系统向其他受害者发起攻击。\n\
  \n一种常见的娱乐性攻击涉及网页篡改，攻击者攻陷 Web 服务器，并用其他页面替换组织的合法网页内容，这些页面通常在炫耀攻击者的技术。例如，攻击者在 2017\
  \ 年发起了一系列自动化网页篡改攻击，利用了广泛使用的 WordPress 网络发布平台中的漏洞。这些攻击在一周内成功篡改了超过 180 万个网页。\n\n近年来，世界见证了“黑客行动主义”领域的兴起。这些攻击者被称为*黑客行动者*（*hacker*\
  \ 和 *activist* 的组合），他们通常将政治动机与黑客的快感相结合。他们松散地组织成名为“匿名者”和“Lulzsec”等名称的团体，并使用低轨道离子炮等工具，在几乎不需要专业知识的情况下创建大规模拒绝服务攻击。\n\
  \n### 职业道德\n\n安全专业人员对自己和彼此都要求极高的行为标准，因为他们占据着敏感的信任职位。管辖个人行为的规则统称为*职业道德*规则。多个组织已认识到标准职业道德规则或准则的必要性，并制定了道德行为准则。\n\
  \n我们将在以下章节介绍两套职业道德准则。这些规则不是法律。它们是职业行为的最低标准。它们应为您提供合理、合乎道德的判断基础。我们期望所有安全专业人员遵守这些准则，无论其专业领域或雇主为何。请确保您理解并认同以下章节概述的职业道德准则。除了这些准则外，所有信息安全专业人员还应支持其组织的职业道德准则。\n\
  \n#### (ISC)² 职业道德准则\n\n管理 CISSP 认证的管理机构是国际信息系统安全认证联盟，即 (ISC)²。(ISC)² 职业道德准则的制定旨在为\
  \ CISSP 的行为提供依据。这是一份包含前言和四条准则的简明准则。以下是职业道德准则主要概念的简要总结。\n\n##### 职业道德准则前言\n\n职业道德准则前言如下：\n\
  \n*   社会的安全与福祉、公共利益、对我们委托人的责任以及对彼此的责任，要求我们遵守并被视为遵守最高的道德行为标准。\n*   因此，严格遵守本准则是认证的条件。\n\
  \n##### 职业道德准则正文\n\n职业道德准则包含以下准则：\n\n**保护社会、公共利益、必要的公众信任和信心以及基础设施。** 安全专业人员肩负重大的社会责任。我们有责任确保我们的行为造福公共利益。\n\
  \n**行为荣誉、诚实、公正、负责且合法。** 诚信是履行我们职责的关键。如果我们组织内部的人员、安全社区或公众对我们提供的指导的准确性或我们行动背后的动机存有疑虑，我们就无法有效地履行职责。\n\
  \n**为委托人提供勤勉且称职的服务。** 虽然我们对整个社会负有责任，但我们也对聘请我们保护其基础设施的人员负有特定责任。我们必须确保自己处于能够为组织提供公正、称职服务的位置。\n\
  \n**促进和保护专业。** 我们选择的专业在持续变化。作为安全专业人员，我们必须确保知识保持最新，并将自己的知识贡献给社区的通用知识体系。\n\n### 职业道德与互联网\n\
  \n1989 年 1 月，互联网架构委员会 (IAB) 认识到互联网正在迅速扩展，超出了创建它的最初受信任社区的范围。考虑到随着互联网的增长可能出现滥用行为，IAB\
  \ 发布了一份关于互联网正确使用的政策声明。该声明的内容至今仍然有效。您了解名为“职业道德与互联网”、编号为 RFC 1087 的征求意见文档的基本内容非常重要，因为大多数职业道德准则都可追溯到该文档。\n\
  \n该声明简要列出了被视为不道德的行为。职业道德准则规定了您*应该*做什么，而该文档则概述了您*不应该*做什么。RFC 1087 指出，具有以下目的的任何活动均属不可接受且不道德：\n\
  \n*   寻求未经授权访问互联网资源\n*   干扰互联网的预期用途\n*   通过此类行为浪费资源（人员、容量、计算机）\n*   破坏基于计算机的信息的完整性\n\
  *   危害用户隐私\n\n### 摘要\n\n\n\n\n\n### 信息安全调查流程\n\n信息安全专业人员必须熟悉调查流程。这涉及收集和分析进行调查所需的证据。安全专业人员应熟悉主要的证据类别，包括实物证据、书面证据和证人证言。电子证据通常通过对硬件、软件、存储介质和网络的分析来收集。必须使用适当的程序收集证据，以确保不篡改原始证据并保持证据保管链。\n\
  \n### 计算机犯罪类别\n\n计算机犯罪被归类为几大类，每一类中的犯罪具有共同的动机和预期结果。了解攻击者的意图有助于妥善保护系统。\n\n例如，军事和情报攻击旨在获取无法通过合法途径获得的秘密信息。商业攻击与此类似，不同之处在于它们针对民用系统。其他类型的攻击包括金融攻击（电话欺诈是金融攻击的一个例子）和恐怖主义攻击（在计算机犯罪背景下，指旨在破坏正常生活的攻击）。最后，还有怨恨攻击，其目的是通过破坏数据或利用信息使组织或个人难堪来造成损害，以及刺激攻击，由缺乏经验的破解者发起，旨在攻破或瘫痪系统。虽然通常不够复杂，但刺激攻击可能令人恼火且代价高昂。\n\
  \n### 职业道德与专业操守\n\n规范你个人行为的一套准则称为职业道德准则。安全专业人员可以遵循若干职业道德准则，其性质从一般到具体不等。`(ISC)²`\
  \ 将接受其职业道德准则作为认证的要求。\n\n### 考试要点\n\n**了解计算机犯罪的定义。** 计算机犯罪是指针对计算机或直接涉及计算机的犯罪（或违反法律法规的行为）。\n\
  \n**能够列举并解释计算机犯罪的六大类别。** 计算机犯罪分为六类：军事和情报攻击、商业攻击、金融攻击、恐怖主义攻击、怨恨攻击和刺激攻击。能够解释每种攻击类型的动机。\n\
  \n**了解收集证据的重要性。** 一旦发现事件，你必须立即开始收集证据以及尽可能多的关于该事件的信息。证据可用于后续的法律诉讼或查明攻击者身份。证据还有助于确定损害程度。\n\
  \n**理解电子取证流程。** 预期将成为诉讼目标的组织有责任通过称为电子取证或 eDiscovery 的流程来保存数字证据。eDiscovery 流程包括信息治理、识别、保存、收集、处理、审查、分析、生成和呈现等活动。\n\
  \n**知道如何调查入侵以及如何从设备、软件和数据中收集足够的信息。** 你必须掌握设备、软件或数据才能对其进行分析并将其作为证据使用。你必须在不修改证据且不允许他人修改的情况下获取证据。\n\
  \n**了解扣押证据的三种基本替代方案及其各自适用的场景。** 首先，证据持有者可自愿移交。其次，可使用传票强制当事人移交证据。第三，当你需要在不给当事人篡改证据机会的情况下扣押证据时，搜查令最为有用。\n\
  \n**了解保留调查数据的重要性。** 因为你可能在事件发生后才发现它们，除非你确保关键日志文件在合理的时间内得到保留，否则你将失去宝贵的证据。你可以就地或在归档中保留日志文件和系统状态信息。\n\
  \n**了解证据在法庭上被采纳的基本要求。** 要被采纳，证据必须与案件中的争议事实相关，该事实必须对案件实质性，且证据必须是合格的或合法收集的。\n\n**解释刑事或民事审判中可能使用的各种证据类型。**\
  \ 实物证据由可带入法庭的实际物品组成。书面证据由提供事实洞察的书面文件组成。证人证言由证人作出的口头或书面陈述组成。\n\n**理解职业道德对安全人员的重要性。**\
  \ 安全从业者被授予极高的权限和责任来执行其工作职能。滥用权力的可能性存在，如果没有严格的个人行为准则，安全从业者可能被视为拥有不受约束的权力。遵守职业道德准则有助于确保此类权力不被滥用。\n\
  \n**了解 `(ISC)²` 职业道德准则和 RFC 1087 “互联网伦理”。** 所有 CISSP 候选人都应熟悉完整的 `(ISC)²` 职业道德准则，因为他们必须签署协议承诺遵守它。此外，还应熟悉\
  \ `RFC 1087` 的基本声明。\n\n### 书面实验\n\n1. 计算机犯罪的主要类别有哪些？\n2. 刺激攻击的主要动机是什么？\n3. 面谈和审讯有什么区别？\n\
  4. 证据要在法庭上被采纳，必须满足哪三项基本要求？\n\n### 复习题\n\n1. 什么是计算机犯罪？\n   1. 安全策略中专门列出的任何攻击\n  \
