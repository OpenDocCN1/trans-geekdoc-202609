  \n14. 传输层安全性 (TLS) 流量使用哪个 TCP/IP 通信端口？\n\n    1. 80\n    2. 220\n    3. 443\n  \
  \  4. 559\n\n15. 哪种类型的密码学攻击使得双重 DES (2DES) 不比标准 DES 加密更有效？\n\n    1. 生日攻击\n    2.\
  \ 选择密文攻击\n    3. 中间相遇攻击\n    4. 中间人攻击\n\n16. 以下哪种工具可用于提高暴力密码破解攻击的有效性？\n\n    1.\
  \ 彩虹表\n    2. 分层筛选\n    3. TKIP\n    4. 随机增强\n\n17. 以下哪个链路会受到 WPA 加密的保护？\n\n   \
  \ 1. 防火墙到防火墙\n    2. 路由器到防火墙\n    3. 客户端到无线接入点\n    4. 无线接入点到路由器\n\n18. 使用证书吊销列表\
  \ (CRL) 的主要缺点是什么？\n\n    1. 密钥管理\n    2. 延迟\n    3. 记录保存\n    4. 易受暴力攻击\n\n19. 以下哪种加密算法现在被认为是不安全的？\n\
  \n    1. El Gamal\n    2. RSA\n    3. 椭圆曲线密码学\n    4. Merkle-Hellman Knapsack (Merkle-Hellman\
  \ 背包)\n\n20. IPsec 定义了什么？\n\n    1. 特定配置的所有可能安全分类\n    2. 建立安全通信通道的框架\n    3. Biba\
  \ 模型中的有效转换状态\n    4. TCSEC 安全类别\n\n## 第 8 章\n\n安全模型、设计与能力原则\n\n**本章涵盖的 CISSP 考试主题包括：**\n\
  \n*   **领域 3：安全架构与工程**\n\n    *   3.1 使用安全设计原则实施和管理工程流程\n    *   3.2 理解安全模型的基本概念\n\
  \    *   3.3 根据系统安全需求选择控制措施\n    *   3.4 理解信息系统的安全能力\n\n理解安全解决方案背后的理念有助于缩小寻找特定安全需求的最佳控制措施的范围。在本章中，我们将讨论安全模型，包括状态机模型、Bell-LaPadula\
  \ 模型、Biba 模型、Clark-Wilson 模型、Take-Grant 模型以及 Brewer 和 Nash 模型。本章还描述了通用准则以及政府和企业用于从安全角度评估信息系统的其他方法，特别强调美国国防部和国际安全评估标准。最后，我们将讨论常见的设计缺陷和其他可能使信息系统易受攻击的问题。\n\
  \n\n\n\n### 使用安全设计原则实施和管理工程流程\n\n安全性应在系统开发的每个阶段都予以考量。程序员应致力于将安全性构建到他们开发的每个应用程序中，为关键应用程序以及处理敏感信息的应用程序提供更高级别的安全性。从开发项目的早期阶段就考虑其安全影响至关重要，因为将安全性构建*进*系统比向现有系统*添加*安全性要容易得多。以下各节将讨论几项基本的安全设计原则，这些原则应在硬件或软件项目的工程流程早期实施和管理。\n\
  \n#### 对象和主体\n\n在安全系统中控制对任何资源的访问涉及两个实体。*主体* 是发出请求以访问资源的用户或进程。访问可以指从资源读取或向资源写入。*对象*\
  \ 是用户或进程想要访问的资源。请记住，主体和对象是指某个特定的访问请求，因此同一资源在不同的访问请求中既可以充当主体，也可以充当对象。\n\n例如，进程 A\
  \ 可能会向进程 B 请求数据。为了满足进程 A 的请求，进程 B 必须向进程 C 请求数据。在该示例中，进程 B 是第一个请求的对象，也是第二个请求的主体：\n\
  \n| 第一个请求 | | 进程 A (主体) | | 进程 B (对象) |\n| --- | --- | --- | --- | --- |\n| 第二个请求\
  \ | | 进程 B (主体) | | 进程 C (对象) |\n\n这也是*传递信任*的一个示例。*传递信任* 是指如果 A 信任 B 且 B 信任 C，则\
  \ A 通过传递性继承了对 C 的信任——这就像在数学方程中一样：如果 a = b，且 b = c，则 a = c。在前面的示例中，当 A 向 B 请求数据，然后\
  \ B 向 C 请求数据时，A 接收到的数据实质上来自 C。传递信任是一个严重的安全问题，因为它可能导致绕过 A 和 C 之间的限制，特别是当 A 和 C 都支持与\
  \ B 交互时。一个例子是组织为提高员工工作效率而屏蔽对 Facebook 或 YouTube 的访问。因此，员工 (A) 无法访问特定互联网站点 (C)。然而，如果员工能够访问\
  \ Web 代理、虚拟专用网络 (VPN) 或匿名化服务，则这可以作为绕过本地网络限制的手段。换句话说，如果员工 (A) 正在访问 VPN 服务 (B)，而 VPN\
  \ 服务 (B) 可以访问被屏蔽的互联网服务 (C)；那么 A 就能通过利用传递信任，经由 B 访问 C。\n\n#### 闭源系统和开源系统\n\n系统的设计和构建遵循两种不同的理念：*闭源系统*\
  \ 旨在与有限范围的其他系统良好协作，这些系统通常均来自同一制造商。闭源系统的标准通常是专有的，且不公开披露。另一方面，*开源系统* 是使用商定的行业标准进行设计的。开源系统更容易与支持相同标准的不同制造商的系统集成。\n\
  \n闭源系统较难与异构系统集成，但可能更安全。闭源系统通常由不包含行业标准的专有硬件和软件组成。这种缺乏集成便利性的特性意味着，针对许多通用系统组件的攻击要么无效，要么必须经过定制才能成功。在许多情况下，攻击闭源系统比攻击开源系统更难。许多已知存在漏洞的软件和硬件组件可能不存在于闭源系统中。除了闭源系统缺乏已知易受攻击的组件外，通常还需要具备针对特定目标系统更深入的知识才能发动成功的攻击。\n\
  \n开源系统通常更容易与其他开源系统集成。例如，用一台 Microsoft Windows Server 机器、一台 Linux 机器和一台 Macintosh\
  \ 机器创建局域网 (LAN) 非常容易。尽管这三台计算机使用不同的操作系统，且可能代表多达三种不同的硬件架构，但每台都支持行业标准，使得网络通信（或其他通信）变得容易。然而，这种便利性是有代价的。因为标准通信组件被纳入了这三个开源系统中的每一个，所以存在更多可预测的入口点和攻击方法。总体而言，它们的开放性使其更容易受到攻击，而其广泛的可用性使得攻击者能够找到（甚至练手）大量潜在目标。此外，开源系统比闭源系统更流行，吸引了更多关注。掌握了基本攻击技能的攻击者会在开源系统上发现比闭源系统更多的目标。这个更大的潜在目标“市场”通常意味着更重视以开源系统为攻击目标。不可否认，关于如何攻击开源系统的共享经验和知识库比闭源系统大得多。\n\
  \n#### 确保机密性、完整性和可用性的技术\n\n为保证数据的机密性、完整性和可用性，必须确保所有有权访问数据的组件都是安全且行为良好的。软件设计师使用不同的技术来确保程序仅执行所需操作，不做多余操作。假设一个程序对另一个程序正在使用的内存区域进行写入和读取。第一个程序可能会破坏所有三大安全原则：机密性、完整性和可用性。如果受影响的程序正在处理敏感或机密数据，则无法再保证该数据的机密性。如果数据以不可预测的方式被覆盖或篡改（当多个读取者和写入者无意中访问同一共享数据时，这是常见问题），则无法保证完整性。而且，如果数据修改导致损坏或彻底丢失，则可能导致数据无法在未来使用。虽然以下各节讨论的概念都与软件程序相关，但它们也常用于安全领域的各个方面。例如，物理隔离可确保对硬件的所有物理访问均受到控制。\n\
  \n#### 隔离\n\n\n\n\n\n### 软件设计师使用进程限制\n\n软件设计师使用进程限制来限制程序的行为。简单来说，进程 `confinement`\
  \ 允许进程仅对特定的内存位置和资源进行读写。这也被称为 `sandboxing`（沙箱隔离）。操作系统或其他安全组件会禁止非法的读/写请求。如果进程尝试发起超出其授权权限的操作，该操作将被拒绝。此外，还可能采取进一步的措施，例如记录违规尝试。必须符合更高安全等级的系统通常会记录所有违规行为，并以某种切实的方式做出响应。通常，违规进程会被终止。限制可以在操作系统本身中实现（例如通过进程隔离和内存保护），通过使用限制应用程序或服务来实现（例如\
  \ `www.sandboxie.com` 上的 Sandboxie），或者通过虚拟化或 Hypervisor 解决方案来实现（例如 VMware 或 Oracle\
  \ 的 VirtualBox）。\n\n#### 边界\n\n在系统上运行的每个进程都会被分配一个授权级别。授权级别告诉操作系统该进程可以做什么。在简单的系统中，可能只有两个授权级别：用户和内核。授权级别告诉操作系统如何为进程设置边界。进程的\
  \ `bounds`（边界）由对其可访问的内存地址和资源设置的限制组成。边界规定了进程被限制或包含在其中的区域。在大多数系统中，这些边界为每个进程划分出逻辑内存区域供其使用。操作系统负责强制执行这些逻辑边界，并禁止访问其他进程。更安全的系统可能需要物理边界的进程。物理边界要求每个受限进程在物理上与其他受限进程分离的内存区域中运行，而不仅仅是在同一内存空间中逻辑上受限。物理边界内存成本可能非常高，但它也比逻辑边界更安全。\n\
  \n#### 隔离\n\n当进程通过强制执行访问边界而被限制时，该进程将在隔离环境中运行。进程隔离确保任何行为仅影响与该隔离进程相关的内存和资源。`Isolation`（隔离）用于保护操作环境、操作系统（OS）内核以及其他独立应用程序。隔离是稳定操作系统的基本组成部分。无论出于善意还是恶意，隔离都能防止应用程序访问另一个应用程序的内存或资源。操作系统可能提供中介服务，例如剪切粘贴和资源共享（如键盘、网络接口和存储设备访问）。\n\
  \n这三个概念（限制、边界和隔离）使设计安全程序和操作系统变得更加困难，但它们也使实施更安全的系统成为可能。\n\n#### 控制\n\n为确保系统安全，你需要允许主体仅访问授权的客体。`control`（控制）使用访问规则来限制主体对客体的访问。访问规则规定了哪些客体对每个主体是有效的。此外，一个客体可能对一种访问类型有效，但对另一种访问类型无效。一种常见的控制是文件访问控制。可以通过将文件设置为大多数用户只读、仅对拥有修改权限的一小部分用户可读写，来保护文件免遭修改。\n\
  \n既有强制访问控制，也有自主访问控制，通常分别称为强制访问控制（MAC）和自主访问控制（DAC）（有关访问控制的深入讨论，请参见第 14 章“控制和监控访问”）。对于强制控制，会考虑主体和客体的静态属性来确定访问的允许性。每个主体拥有定义其访问资源的许可或权限的属性。每个客体拥有定义其分类的属性。不同类型的安全方法以不同方式对资源进行分类。例如，如果安全系统能找到一条规则，允许具有主体\
  \ A 许可的主体访问具有客体 B 分类的客体，则授予主体 A 访问客体 B 的权限。\n\n自主控制与强制控制的不同之处在于，主体有一定能力定义要访问的客体。在限制范围内，自主访问控制允许主体根据需要定义要访问的客体列表。此访问控制列表充当主体可修改的动态访问规则集。施加在修改上的约束通常与主体的身份有关。基于身份，主体可能被允许添加或修改定义对客体访问的规则。\n\
  \n强制和自主访问控制都通过主体限制对客体的访问。控制的主要目标是通过禁止授权或未授权主体的未授权访问，来确保数据的机密性和完整性。\n\n#### 信任与保证\n\
  \n适当的安全概念、控制和机制必须在设计和架构阶段之前及期间集成，以生成可靠的安全产品。安全问题不应作为事后补充添加；这会导致疏忽、成本增加和可靠性降低。一旦安全集成到设计中，就必须对其进行工程化、实施、测试、审计、评估、认证，最后授权。\n\
  \n`trusted system`（可信系统）是指所有保护机制协同工作，为多类用户处理敏感数据，同时保持稳定安全的计算环境的系统。`Assurance`（保证）简单定义为对安全需求满足程度的信心度。保证必须持续维护、更新和重新验证。如果可信系统经历已知变更，或已过相当长一段时间，均属实。无论哪种情况，都发生了某种层面的变更。变更往往是安全的对立面；它常会削弱安全。因此，每当发生变更时，都需要重新评估系统，以验证其先前提供的安全级别是否仍然完好。保证因系统而异，必须在单个系统上建立。然而，可以跨同类型的众多系统、支持相同服务的系统或部署在相同地理位置的系统，建立保证等级或级别。因此，信任可以通过实施特定安全功能构建到系统中，而保证则是在现实场景中对这些安全功能的可靠性和可用性的评估。\n\
  \n### 理解安全模型的基本概念\n\n在信息安全领域，模型提供了一种将安全策略形式化的方法。此类模型可以是抽象的或直观的（有些是明确数学化的），但所有模型旨在提供一组显式规则，计算机可遵循这些规则来实现构成安全策略的基本安全概念、过程和程序。这些模型提供了一种途径，加深你对计算机操作系统应如何设计和开发以支持特定安全策略的理解。\n\
  \n`security model`（安全模型）为设计师提供了一种将抽象陈述映射为安全策略的方法，该策略规定了构建硬件和软件所需的算法和数据结构。因此，安全模型给软件设计师提供了一个衡量其设计和实现的标准。当然，该模型必须支持安全策略的每个部分。这样，开发人员可以确信其安全实现支持安全策略。\n\
  \n\n\n\n#### 安全模型概述\n\n您将在以下章节中探索多种安全模型；所有这些模型都能阐明安全性是如何融入计算机体系结构和操作系统设计中的：\n\n\
  *   可信计算基\n*   状态机模型\n*   信息流模型\n*   非干扰模型\n*   Take-Grant 模型\n*   访问控制矩阵\n*   Bell-LaPadula\
  \ 模型\n*   Biba 模型\n*   Clark-Wilson 模型\n*   Brewer 和 Nash 模型（也称为中墙模型）\n*   Goguen-Meseguer\
  \ 模型\n*   Sutherland 模型\n*   Graham-Denning 模型\n\n尽管不存在绝对安全的系统，但我们可以设计和构建合理安全的系统。事实上，如果一个安全系统符合一组特定的安全标准，就可以说它表现出一定级别的信任度。因此，信任可以构建到系统中，随后进行评估、认证和授权。但在讨论每个安全模型之前，我们必须建立一个大多数安全模型赖以构建的基础。这个基础就是可信计算基。\n\
  \n##### 可信计算基\n\n美国国防部的一项旧标准，俗称橙皮书/可信计算机系统评价标准（`TCSEC`）（DoD 标准 5200.28，本章后面“彩虹系列”部分将详细介绍）将*可信计算基（`TCB`）*描述为硬件、软件和控制措施的组合，它们协同工作以形成一个可信基础，从而强制执行您的安全策略。`TCB`\
  \ 是完整信息系统的一个子集。它应尽可能小，以便通过详细分析合理地确保系统满足设计规范和要求。`TCB` 是该系统中唯一可被信任以遵循并强制执行安全策略的部分。系统的每个组件不一定都要受信。但每当您从安全角度考虑系统时，评估都应包括定义该系统\
  \ `TCB` 的所有受信组件。\n\n一般来说，系统中的 `TCB` 组件负责控制对系统的访问。`TCB` 必须提供方法来访问 `TCB` 内部和外部的资源。`TCB`\
  \ 组件通常限制 `TCB` 外部组件的活动。`TCB` 组件有责任确保系统在所有情况下都能正常运行，并在任何情况下都遵守安全策略。\n\n### 安全边界\n\
  \n系统的*安全边界*是一条虚构的边界，它将 `TCB` 与系统的其余部分分隔开（图 8.1）。该边界确保 `TCB` 与计算机系统其余元素之间不发生不安全的通信或交互。为了使\
  \ `TCB` 与系统其余部分通信，它必须创建安全通道，也称为*可信路径*。可信路径是按严格标准建立的通道，允许必要的通信发生，同时不将 `TCB` 暴露于安全漏洞之下。可信路径还保护系统用户（有时称为主体）免受\
  \ `TCB` 交互导致的妥协。正如您稍后在本章中将了解到的关于正式安全准则和评估标准的内容，可信路径是寻求为用户提供高级别安全性的系统所必需的。根据 `TCSEC`\
  \ 准则，高信任级别的系统（如 `TCSEC` 的 B2 级或更高级别）需要可信路径。\n\n![FIGURE 8.1 The TCB, security perimeter,\
  \ and reference monitor](img/c08f001.jpg)\n\n**图 8.1** TCB、安全边界和参考监视器\n\n######\
  \ 参考监视器和内核\n\n当需要实施安全系统时，开发 `TCB` 的某部分以对系统资产和资源（有时称为客体）实施访问控制至关重要。`TCB` 中在授予访问请求前验证对每个资源访问的部分称为*参考监视器*（图\
  \ 8.1）。参考监视器位于每个主体和客体之间，在允许任何请求继续之前，验证请求主体的凭据是否满足客体的访问要求。如果不满足此类访问要求，则拒绝访问请求。实际上，参考监视器是\
  \ `TCB` 的访问控制执行者。因此，授权且安全的动作和活动被允许发生，而未授权和不安全的活动和动作被拒绝并阻止发生。参考监视器根据期望的安全模型（无论是自主的、强制的、基于角色的，还是其他形式的访问控制）来强制执行访问控制或授权。参考监视器可以是\
  \ `TCB` 的一个概念部分；它不需要是一个实际的、独立的或单独工作的系统组件。\n\n`TCB` 中协同工作以实现参考监视器功能的组件集合称为*安全内核*。参考监视器是一个概念或理论，通过在软件和硬件中实现安全内核付诸实践。安全内核的目的是启动适当的组件以强制执行参考监视器功能，并抵御所有已知攻击。安全内核使用可信路径与主体通信。它还中介所有资源访问请求，仅授予符合系统所用适当访问规则的请求。\n\
  \n参考监视器需要其所保护的每个资源的描述性信息。此类信息通常包括其分类和标识。当主体请求访问客体时，参考监视器会查阅客体的描述性信息，以判断应授予还是拒绝访问（有关其工作原理的更多信息，请参阅侧边栏“令牌、能力和标签”）。\n\
  \n##### 状态机模型\n\n*状态机模型*描述了一个无论处于何种状态始终是安全的系统。它基于计算机科学中*有限状态机（`FSM`）*的定义。`FSM` 将外部输入与内部机器状态相结合，以建模各种复杂系统，包括解析器、解码器和解释器。给定一个输入和一个状态，`FSM`\
  \ 会转换到另一个状态并可能产生输出。从数学上讲，下一个状态是当前状态和输入的函数；即 `next state = F(input, current state)`。同样，输出也是输入和当前状态的函数；即\
  \ `output = F(input, current state)`。\n\n许多安全模型基于安全状态概念。根据状态机模型，*状态*是系统在特定时刻的快照。如果状态的所有方面都满足安全策略的要求，则该状态被视为安全。转换发生在接受输入或产生输出时。转换总是导致一个新状态（也称为*状态转换*）。必须评估所有状态转换。如果每个可能的状态转换都导致另一个安全状态，则该系统可称为*安全状态机*。安全状态机模型系统总是启动进入安全状态，在所有转换中保持安全状态，并且仅允许主体以符合安全策略的安全方式访问资源。安全状态机模型是许多其他安全模型的基础。\n\
  \n### 信息流模型\n\n\n\n\n### 信息流模型\n\n**信息流模型**侧重于信息的流动。信息流模型基于状态机模型。本章稍后将详细讨论的 **Bell-LaPadula**\
  \ 和 **Biba** 模型都是信息流模型。Bell-LaPadula 关注防止信息从高安全级别流向低安全级别。Biba 关注防止信息从低安全级别流向高安全级别。信息流模型不仅处理信息流动的方向，还可以处理流动的类型。\n\
  \n信息流模型旨在防止未经授权、不安全或受限的信息流动，通常发生在不同安全级别之间（这些通常被称为多级模型）。信息流可以发生在相同分类级别的主体和客体之间，也可以发生在不同分类级别的主体和客体之间。信息流模型允许所有授权的信息流，无论是在同一分类级别内还是跨分类级别。它阻止所有未经授权的信息流，无论是在同一分类级别内还是跨分类级别。\n\
  \n信息流模型的另一个有趣视角是，它用于建立同一对象在不同时间点存在的两个版本或状态之间的关系。因此，信息流决定了对象从一个时间点的一个状态转换到另一个时间点的另一个状态。信息流模型还通过明确排除所有未定义的流路径来解决隐蔽信道问题。\n\
  \n#### 非干扰模型\n\n**非干扰模型**大致基于信息流模型。然而，非干扰模型关注的不是信息流动，而是高安全级别主体的行为如何影响系统状态或低安全级别主体的行为。基本上，主体\
  \ A（高）的行为不应影响主体 B（低）的行为，甚至不应被主体 B 察觉。真正的关注点是防止高安全分类级别的主体 A 的行为影响较低级别的系统状态。如果发生这种情况，主体\
  \ B 可能会被置于不安全状态，或能够推断出关于更高分类级别的信息。这是一种信息泄露，并隐式地创建了一个隐蔽信道。因此，可以实施非干扰模型，以提供一种防止木马等恶意程序造成损害的保护形式。\n\
  \n#### Take-Grant 模型\n\n**Take-Grant 模型**采用有向图（图 8.2）来规定权限如何从一个主体传递给另一个主体，或从主体传递给客体。简单来说，拥有\
  \ `grant` 权限的主体可以将其拥有的任何其他权限授予另一个主体或客体。同样，拥有 `take` 权限的主体可以从另一个主体获取权限。除了这两条主要规则外，Take-Grant\
  \ 模型还可以采用 `create` 规则和 `remove` 规则来生成或删除权限。该模型的关键在于，使用这些规则可以推断出系统中权限何时会发生变化，以及泄露（即权限的非预期分发）可能发生在何处。\n\
  \n![图 8.2 Take-Grant 模型的有向图](img/c08f002.jpg)\n\n**图 8.2** Take-Grant 模型的有向图\n\n\
  | 规则 | 说明 |\n| --- | --- |\n| Take 规则 | 允许主体获取对客体的权限 |\n| Grant 规则 | 允许主体授予客体权限\
  \ |\n| Create 规则 | 允许主体创建新权限 |\n| Remove 规则 | 允许主体移除其拥有的权限 |\n\n### 访问控制矩阵\n\n**访问控制矩阵**是一个主体和客体的表格，指示每个主体可以在每个客体上执行的操作或功能。矩阵的每一列是一个访问控制列表（ACL）。矩阵的每一行是一个**能力列表**。ACL\
  \ 与客体绑定；它列出了每个主体可以执行的有效操作。能力列表与主体绑定；它列出了可以在每个客体上采取的有效操作。从管理角度来看，仅使用能力列表进行访问控制是一场管理噩梦。基于能力列表的访问控制方法可以通过在每个主体上存储其对每个客体拥有的权限列表来实现。这实际上为每个用户提供了一串钥匙，包含对安全域内对象的访问权限。要移除对特定客体的访问，必须单独操作每个拥有访问权限的用户（主体）。因此，在每个用户账户上管理访问比在每个客体上管理访问（即通过\
  \ ACL）要困难得多。\n\n实施访问控制矩阵模型通常涉及以下步骤：\n\n*   构建一个可以创建和管理主体及客体列表的环境\n*   编写一个函数，该函数能返回作为输入提供给该函数的任何客体相关联的类型（这很重要，因为客体的类型决定了可以对其应用什么样的操作）\n\
  \n表 8.1 中所示的访问控制矩阵用于自主访问控制系统。只需将主体名称替换为分类或角色，即可构建强制或基于规则的矩阵。系统使用访问控制矩阵快速确定主体对客体请求的操作是否被授权。\n\
  \n**表 8.1** 访问控制矩阵示例\n\n| 主体 | 文档文件 | 打印机 | 网络文件夹共享 |\n| --- | --- | --- | --- |\n\
  | Bob | 读取 | 无访问权限 | 无访问权限 |\n| Mary | 无访问权限 | 无访问权限 | 读取 |\n| Amanda | 读取、写入 |\
  \ 打印 | 无访问权限 |\n| Mark | 读取、写入 | 打印 | 读取、写入 |\n| Kathryn | 读取、写入 | 打印、管理打印队列 | 读取、写入、执行\
  \ |\n| Colin | 读取、写入、更改权限 | 打印、管理打印队列、更改权限 | 读取、写入、执行、更改权限 |\n\n### Bell-LaPadula\
  \ 模型\n\n美国国防部（DoD）在 20 世纪 70 年代开发了 **Bell-LaPadula 模型**，以解决保护机密信息的问题。DoD 管理多级机密资源，Bell-LaPadula\
  \ 多级模型源自 DoD 的多级安全策略。DoD 使用的分类众多；然而，CISSP 通用知识体系（CBK）中对分类的讨论通常仅限于非机密、敏感但非机密、机密、秘密和绝密。多级安全策略规定，具有任何级别许可的主体可以访问其许可级别或以下的资源。然而，在较高许可级别内，访问仅基于“需知”原则授予。换句话说，仅当特定工作任务需要时，才向机密级别授予对特定客体的访问权限。例如，任何拥有秘密安全许可的人都可以访问秘密、机密、敏感但非机密和非机密文档，但不能访问绝密文档。此外，要访问秘密级别的文档，寻求访问的人员还必须对该文档有“需知”需求。\n\
  \n\n\n\n\n### Bell-LaPadula 模型\n\n根据设计，Bell-LaPadula 模型防止机密信息泄露或传输到较低安全许可级别。这是通过阻止较低分级的主体访问较高分级的客体来实现的。有了这些限制，Bell-LaPadula\
  \ 模型专注于维护客体的机密性。因此，确保文档机密性所涉及的复杂性在 Bell-LaPadula 模型中得到了解决。然而，Bell-LaPadula 并未涉及客体的完整性或可用性方面。Bell-LaPadula\
  \ 也是多级安全策略的第一个数学模型。\n\n该模型建立在状态机概念和信息流模型之上。它还采用了强制访问控制和格状结构概念。格状层级是组织安全策略所使用的`分类级别`。状态机支持多个状态，并支持任意两个状态之间的显式转换；使用这一概念是因为机器的正确性以及文档机密性的保证可以用数学方法证明。该状态机有三个基本属性：\n\
  \n*   `简单安全属性`规定主体不得读取比其自身敏感级别更高的信息（不允许上读）。\n*   `*（星号）安全属性`规定主体不得将信息写入比其自身敏感级别更低的客体（不允许下写）。这也被称为`限制属性`。\n\
  *   `自主安全属性`规定系统使用访问矩阵来实施自主访问控制。\n\n前两个属性定义了系统可以转换进入的状态。不允许其他转换。通过这两条规则可访问的所有状态均为安全状态。因此，基于\
  \ Bell-LaPadula 建模的系统提供状态机模型安全性（参见图 8.3）。\n\n![图 8.3 Bell-LaPadula 模型](img/c08f003.jpg)\n\
  \n**图 8.3** Bell-LaPadula 模型\n\nBell-LaPadula 属性旨在保护数据机密性。主体无法读取分类级别高于其自身许可级别的客体。因为某一级别的客体包含的数据比较低级别客体中的数据更敏感或更机密，所以主体（如果不是可信主体）不能将某一级别的数据写入较低级别的客体。该操作类似于将一份绝密备忘录粘贴到非密文档文件中。第三个属性强制要求主体具有“需知”权限才能访问客体。\n\
  \nBell-LaPadula 模型仅解决数据的机密性问题。它不解决数据的完整性或可用性问题。因为它设计于 20 世纪 70 年代，所以不支持当今常见的许多操作，例如文件共享和网络。它还假设安全层之间的转换是安全的，并且不解决隐蔽信道问题（第\
  \ 9 章“安全漏洞、威胁和对策”中介绍）。Bell-LaPadula 能很好地处理机密性，因此常与提供完整性和可用性机制的其他模型结合使用。\n\n####\
  \ Biba 模型\n\n对于某些非军事组织而言，完整性比机密性更重要。基于这一需求，开发了多种以完整性为重点的安全模型，例如 Biba 和 Clark-Wilson\
  \ 开发的模型。`Biba 模型`是在 Bell-LaPadula 模型之后设计的。Bell-LaPadula 模型解决机密性问题，而 Biba 模型解决完整性问题。Biba\
  \ 模型同样建立在状态机概念之上，基于信息流，也是一个多级模型。事实上，Biba 看起来与 Bell-LaPadula 模型非常相似，只是倒置了。两者都使用状态和转换。两者都有基本属性。最大的区别在于它们的主要关注点：Biba\
  \ 主要保护数据完整性。以下是 Biba 模型状态机的基本属性或公理：\n\n*   `简单完整性属性`规定主体不能读取较低完整性级别的客体（不允许下读）。\n\
  *   `*（星号）完整性属性`规定主体不能修改较高完整性级别的客体（不允许上写）。\n\n图 8.4 说明了这些 Biba 模型公理。\n\n![图 8.4\
  \ Biba 模型](img/c08f004.jpg)\n\n**图 8.4** Biba 模型\n\n当你将 Biba 与 Bell-LaPadula 进行比较时，你会注意到它们看起来像是相反的。这是因为它们关注安全的不同领域。Bell-LaPadula\
  \ 模型确保数据机密性，而 Biba 确保数据完整性。\n\nBiba 的设计旨在解决三个完整性问题：\n\n*   防止未授权主体修改客体。\n*   防止授权主体未授权地修改客体。\n\
  *   保护内部和外部客体一致性。\n\n与 Bell-LaPadula 一样，Biba 要求所有主体和客体都具有分类标签。因此，数据完整性保护依赖于数据分类。\n\
  \n考虑 Biba 的属性。Biba 模型的第二个属性非常直观。主体不能写入较高完整性级别的客体。这很合理。那第一个属性呢？为什么主体不能读取较低完整性级别的客体？答案需要稍加思考。可以将完整性级别想象为空气的纯净度。你不会想将吸烟区的空气泵入洁净室环境。数据也是如此。当完整性很重要时，你不希望未经验证的数据被读入已验证的文档。数据污染的可能性太大，不允许这种访问。\n\
  \n对 Biba 模型的评价揭示了一些缺点：\n\n*   它仅解决完整性问题，不涉及机密性或可用性。\n*   它侧重于保护客体免受外部威胁；它假设内部威胁由程序处理。\n\
  *   它不解决访问控制管理问题，也不提供分配或更改客体或主体分类级别的方法。\n*   它不能防止隐蔽信道。\n\n因为 Biba 模型专注于数据完整性，所以它比\
  \ Bell-LaPadula 模型更常被用作商业安全模型。一些商业组织更关心其数据的完整性而非机密性。更关注完整性而非机密性的商业组织可以选择实施 Biba\
  \ 模型，但大多数组织需要在机密性和完整性之间取得平衡，这要求它们实施比单一模型更复杂的解决方案。\n\n### Clark-Wilson 模型\n\n虽然 Biba\
  \ 模型适用于商业应用，但另一个模型于 1987 年专门为商业环境设计。`Clark-Wilson 模型`采用多方面的方法来实施数据完整性。Clark-Wilson\
  \ 模型不定义正式的状态机，而是定义每个数据项，并仅允许通过一小组程序进行修改。\n\nClark-Wilson 模型不要求使用格状结构；相反，它使用主体/程序/客体（或主体/事务/客体）的三方关系，称为`三元组`或`访问控制三元组`。主体不能直接访问客体。客体只能通过程序访问。通过使用两个原则——格式良好的事务和职责分离——Clark-Wilson\
  \ 模型提供了一种保护完整性的有效手段。\n\n\n\n\n\n### Clark-Wilson 模型\n\n格式良好的事务采用程序的形式。主体只能通过使用程序、接口或访问门户来访问对象（图\
  \ 8.5）。每个程序都对其能对对象（如数据库或其他资源）执行的操作和不能执行的操作有特定的限制。这实际上限制了主体的能力。这被称为**受限接口**。如果程序设计得当，那么这种三元关系提供了一种保护对象完整性的手段。\n\
  \n![图 8.5 Clark-Wilson 模型](img/c08f005.jpg)\n\n**图 8.5** Clark-Wilson 模型\n\nClark-Wilson\
  \ 定义了以下项目和过程：\n\n*   **受限数据项（CDI）** 是指其完整性受安全模型保护的任何数据项。\n*   **非受限数据项（UDI）** 是指不受安全模型控制的任何数据项。任何待输入且未经验证的数据，或任何输出数据，都将被视为非受限数据项。\n\
  *   **完整性验证程序（IVP）** 是一种扫描数据项并确认其完整性的程序。\n*   **转换过程（TP）** 是被允许修改 CDI 的唯一过程。通过 TP\
  \ 对 CDI 的有限访问构成了 Clark-Wilson 完整性模型的骨干。\n\nClark-Wilson 模型使用安全标签来授予对对象的访问权限，但仅限通过转换过程和**受限接口模型**。受限接口模型利用基于分类的限制，仅提供特定主体授权的信息和功能。处于某一分类级别的主体将看到一组数据并有权访问一组功能，而处于不同分类级别的另一个主体将看到不同的数据集并有权访问不同的功能集。向不同级别或类别的用户提供不同功能，可以通过向所有用户显示所有功能但禁用特定用户未获授权的功能来实现，也可以通过仅显示授予特定用户的功能来实现。通过这些机制，Clark-Wilson\
  \ 模型确保数据免受任何用户的未授权更改。实际上，Clark-Wilson 模型强制实施了职责分离。Clark-Wilson 的设计使其成为商业应用的常用模型。\n\
  \n#### Brewer 和 Nash 模型（又称中墙模型）\n\n**Brewer 和 Nash 模型**的创建是为了允许访问控制根据用户的先前活动动态变化（这也使其成为一种状态机模型）。该模型适用于单个集成数据库；它旨在创建对利益冲突概念敏感的安全域（例如，在\
  \ C 公司工作且有权访问 A 公司专有数据的人，如果 A 公司和 B 公司相互竞争，则不应被允许访问 B 公司的类似数据）。该模型被称为**中墙模型**，因为它创建了一类数据，用于定义哪些安全域可能存在冲突，并防止任何有权访问属于特定冲突类的一个域的主体访问属于同一冲突类的任何其他域。从隐喻上讲，这在任何冲突类中的所有其他信息周围筑起了一道墙。因此，该模型还利用每个冲突类内部的数据隔离原则，使用户免受潜在的利益冲突情况影响（例如公司数据集的管理）。由于公司关系不断变化，对冲突类成员及定义的动态更新非常重要。\n\
  \n审视或思考 Brewer 和 Nash 模型的另一种方式是：管理员根据其分配的工作职责和任务，拥有对系统中广泛数据的完全控制访问权。然而，在对任何数据项采取行动的那一刻，管理员对任何冲突数据项的访问将被暂时阻断。在操作期间，只能访问与初始数据项相关的数据项。任务完成后，管理员的访问权限恢复为完全控制。\n\
  \n#### Goguen-Meseguer 模型\n\n**Goguen-Meseguer 模型**是一种完整性模型，虽然不如 Biba 和其他模型知名。事实上，该模型被认为是非干扰概念理论的基础。通常当有人提到非干扰模型时，实际上指的就是\
  \ Goguen-Meseguer 模型。\n\nGoguen-Meseguer 模型基于预先确定主体可访问的对象集合或域——即列表。该模型基于自动化理论和域分离。这意味着主体只被允许对预定对象执行预定操作。当相似用户被分组到他们自己的域（即集合）中时，一个主体域的成员无法干扰另一个主体域的成员。因此，主体无法相互干扰彼此的活动。\n\
  \n#### Sutherland 模型\n\n**Sutherland 模型**是一种完整性模型。它专注于防止干扰以支持完整性。它正式基于状态机模型和信息流模型。然而，它并不直接指示保护完整性的具体机制。相反，该模型基于定义一组系统状态、初始状态和状态转换的思想。通过仅使用这些预定的安全状态，可维护完整性并禁止干扰。\n\
  \nSutherland 模型的一个常见示例是用于防止隐蔽信道被用来影响过程或活动的结果。（关于隐蔽信道的讨论，请参见第 9 章。）\n\n#### Graham-Denning\
  \ 模型\n\n**Graham-Denning 模型**专注于主体和对象的安全创建与删除。Graham-Denning 是一组八条主要保护规则或动作的集合，它们定义了某些安全动作的边界：\n\
  \n*   安全地创建对象。\n*   安全地创建主体。\n*   安全地删除对象。\n*   安全地删除主体。\n*   安全地提供读访问权限。\n*   安全地提供授予访问权限。\n\
  *   安全地提供删除访问权限。\n*   安全地提供转移访问权限。\n\n通常，主体对一组对象的具体能力或权限是在访问矩阵（又称访问控制矩阵）中定义的。\n\n\
  ### 基于系统安全需求选择控制措施\n\n那些为特定类型的应用采购信息系统的人——例如，考虑一下国家安全机构，那里的敏感信息可能极其宝贵（或落入坏人手中极其危险），又如中央银行或证券交易商，某些数据可能价值数十亿美元——通常希望了解其安全优势和劣势。此类买方通常只愿考虑那些经过正式评估流程并获得某种安全评级的系统。买方想知道他们买的是什么，以及通常需要采取哪些步骤来使此类系统尽可能安全。\n\
  \n当进行正式评估时，系统通常要经过两步流程：\n\n1.  对系统进行测试并执行技术评估，以确保系统的安全能力满足其预期用途规定的标准。\n2.  将系统的设计和安全标准与其实际能力和性能进行正式比较，负责此类系统安全性和真实性的个人必须决定是采纳它们、拒绝它们，还是修改其标准并重试。\n\
  \n\n\n\n\n### 彩虹系列\n\n自 20 世纪 80 年代以来，各国政府、机构、组织以及各类商业组织都面临着采用和使用信息系统所带来的风险。这促使了一系列历史性的信息安全标准的诞生，这些标准试图为各类用途规定最低可接受的安全标准。这些分类非常重要，因为采购方试图获取并部署能够保护和保存其内容的系统，或者满足各种强制性安全要求的系统（例如承包商为与政府开展业务而必须例行满足的要求）。第一套此类标准促成了\
  \ 20 世纪 80 年代*可信计算机系统评估标准* 的创建，当时美国国防部 致力于为其采购和使用的系统开发和实施安全标准。这进而导致了 20 世纪 90 年代中期前整整一系列此类出版物的出现。由于这些出版物通常通过其封面颜色来识别，因此它们统称为*彩虹系列*。\n\
  \n在美国国防部的带领下，其他政府或标准机构创建了计算机安全标准，这些标准在彩虹系列要素的基础上进行构建和改进。该组别中的重要标准包括一个名为*信息技术安全评估标准*\
  \ 的欧洲模型，它于 1990 年开发，并使用至 1998 年。最终，TCSEC 和 ITSEC 被所谓的通用准则 所取代，该准则于 1998 年被美国、加拿大、法国、德国和英国采纳，但其更正式的名称为“信息技术安全领域通用准则证书互认协定”。ITSEC\
  \ 和通用准则将在后续章节中讨论。\n\n当政府或其他注重安全的机构评估信息系统时，它们会使用各种标准评估准则。1985 年，国家计算机安全中心 开发了 TCSEC，通常称为*橙皮书*\
  \ ，因为该出版物的封面是橙色的。TCSEC 确立了从安全角度评估独立计算机时使用的指南。这些指南涉及基本安全功能，并允许评估人员衡量和评定系统的功能性和可信度。事实上，在\
  \ TCSEC 中，功能性和安全保证是结合在一起的，不像后来开发的安全准则那样被分离开来。TCSEC 指南旨在用于评估供应商产品，或由供应商用于确保他们在新产品中构建了所有必要的功能性和安全保证。在继续阅读本节其余部分时请记住，TCSEC\
  \ 已于 2005 年被通用准则取代（本章后面将讨论）。\n\n接下来，我们将看一下橙皮书本身的一些细节，然后讨论彩虹系列中的其他一些重要要素。\n\n####\
  \ TCSEC 类别与所需功能\n\nTCSEC 将系统提供的机密性保护的功能性和保证评级结合起来，分为四大类别。这些类别进一步细分为用数字标识的子类别，例如\
  \ `C1` 和 `C2`。此外，TCSEC 的类别是通过对目标系统的评估来分配的。适用的系统是非网络连接的独立系统。TCSEC 定义了以下主要类别：\n\n\
  **A 类** 验证保护。最高安全级别。\n\n**B 类** 强制保护。\n\n**C 类** 自主保护。\n\n**D 类** 最低保护。保留给那些已评估但不符合属于任何其他类别要求的系统。\n\
  \n以下列表包含 A 类到 C 类的简要讨论，以及代表任何适用子类别的数字后缀（图 8.6）。\n\n![图 8.6 TCSEC 的级别](img/c08f006.jpg)\n\
  \n**图 8.6** TCSEC 的级别\n\n##### 自主保护（C1、C2 类）\n\n自主保护系统提供基本的访问控制。此类别中的系统确实提供了一些安全控制，但缺乏针对安全系统特定需求的更复杂和严格的控制。`C1`\
  \ 和 `C2` 系统提供基本控制以及系统安装和配置的完整文档。\n\n> **自主安全保护 (C1)** 自主安全保护系统通过用户 ID 和/或组来控制访问。虽然有一些控制措施限制对象访问，但此类别中的系统仅提供弱保护。\n\
  >\n> **受控访问保护 (C2)** 受控访问保护系统比 `C1` 系统更强。用户必须单独标识才能获得对象访问权限。`C2` 系统还必须强制执行介质清除。通过介质清除，任何被其他用户重复使用的介质必须首先被彻底清除，以确保先前数据的任何残留都不再可供检查或使用。此外，必须强制执行严格的登录程序，以限制无效或未授权用户的访问。\n\
  \n##### 强制保护（B1、B2、B3 类）\n\n强制保护系统提供比 `C` 类或 `D` 类系统更多的安全控制。要求更细粒度的控制，以便安全管理员可以应用特定控制，仅允许非常有限的主体/客体访问集合。这类系统基于\
  \ Bell-LaPadula 模型。强制访问基于安全标签。\n\n> **标记安全 (B1)** 在标记安全系统中，每个主体和每个客体都有一个安全标签。`B1`\
  \ 系统通过匹配主体和客体标签并比较其权限兼容性来授予访问权限。`B1` 系统支持足够的安全性来存放机密数据。\n>\n> **结构化保护 (B2)** 除了要求安全标签（如\
  \ `B1` 系统）外，`B2` 系统必须确保不存在隐蔽信道。操作员和管理员功能被分离，并保持进程隔离。`B2` 系统足以应对需要比 `B1` 系统提供更多安全功能的机密数据。\n\
  >\n> **安全域 (B3)** 安全域系统通过进一步增加无关进程的分离和隔离来提供更安全的功能。管理功能被明确定义并与其他用户可用的功能分离。`B3` 系统的重点转向简洁性，以减少因未使用或额外代码中的漏洞而导致的风险。`B3`\
  \ 系统的安全状态在初始引导过程中也必须得到保障。`B3` 系统难以被成功攻击，并为非常敏感或秘密数据提供足够的安全控制。\n\n\n\n\n\n### 验证保护（A1\
  \ 类）\n\n验证保护系统在结构和采用的控制方面与 B3 系统相似。区别在于开发周期。开发周期的每个阶段都使用形式化方法进行控制。设计的每个阶段都会在进入下一步之前被记录、评估和验证。这迫使在开发和部署的所有步骤中都保持极高的安全意识，也是正式保证强大系统安全性的唯一途径。\n\
  \n经过验证的设计系统始于一份设计文档，该文档说明了生成的系统将如何满足安全策略。从那时起，每个开发步骤都在安全策略的背景下进行评估。功能至关重要，但保证比在较低安全类别中更重要。A1\
  \ 系统代表最高安全级别，旨在处理绝密数据。从设计一直到交付和安装，每一步都经过记录和验证。\n\n#### 彩虹丛书中的其他颜色\n\n总的来说，DoD 文档集合中共有近\
  \ 30 个标题，它们要么增加了橙皮书的内容，要么进一步详细阐述了橙皮书。虽然颜色不一定有特定含义，但它们被用来识别该系列中的出版物。\n\n该文档集合中的其他重要要素包括以下内容：\n\
  \n##### 红皮书\n\n由于橙皮书仅适用于未连接网络的独立计算机，而许多系统都用于网络中（即使在 1980 年代），因此开发了*红皮书*以在网络环境下解释\
  \ TCSEC。事实上，红皮书的正式标题是《TCSEC 可信网络解释》，因此它可以被视为侧重于网络的橙皮书解释。红皮书迅速比橙皮书更受系统买方和建造者的关注和重视。以下列表包含红皮书的其他一些功能：\n\
  \n*   对机密性和完整性进行分级\n*   解决通信完整性问题\n*   解决拒绝服务保护问题\n*   解决妥协（换句话说，入侵）保护和预防问题\n* \
  \  仅限于一类有限的网络，这些网络被标记为“具有单一认证授权机构的集中式网络”\n*   仅使用四个评级级别：无、C1（最低）、C2（一般）和 B2（良好）\n\
  \n##### 绿皮书\n\n*绿皮书*，即《国防部密码管理指南》，提供密码创建和管理指南；这对配置和管理可信系统的人员非常重要。\n\n表 8.2 列出了彩虹丛书中更完整的书籍清单。如需更多信息和下载书籍，请访问此处的彩虹丛书网页：\n\
  \n*   <https://csrc.nist.gov/publications/detail/white-paper/1985/12/26/dod-rainbow-series/final>\n\
  *   <https://fas.org/irp/nsa/rainbow.htm>\n\n##### 表 8.2 部分彩虹丛书要素\n\n| 发布编号 | 标题\
  \ | 书名 |\n| --- | --- | --- |\n| 5200.28-STD | *DoD Trusted Computer System Evaluation\
  \ Criteria* | 橙皮书 |\n| CSC-STD-002-85 | *DoD Password Management Guidelines* | 绿皮书\
  \ |\n| CSC-STD-003-85 | *Guidance for Applying TCSEC in Specific Environments* |\
  \ 黄皮书 |\n| NCSC-TG-001 | *A Guide to Understanding Audit in Trusted Systems* | 棕皮书\
  \ |\n| NCSC-TG-002 | *Trusted Product Evaluation: A Guide for Vendors* | 亮蓝皮书 |\n\
  | NCSC-TG-002-85 | *PC Security Considerations* | 浅蓝皮书 |\n| NCSC-TG-003 | *A Guide\
  \ to Understanding Discretionary Access Controls in Trusted Systems* | 荧光橙皮书 |\n\
  | NCSC-TG-004 | *Glossary of Computer Security Terms* | 青皮书 |\n| NCSC-TG-005 | *Trusted\
  \ Network Interpretation* | 红皮书 |\n| NCSC-TG-006 | *A Guide to Understanding Configuration\
  \ Management in Trusted Systems* | 琥珀皮书 |\n| NCSC-TG-007 | *A Guide to Understanding\
  \ Design Documentation in Trusted Systems* | 紫红皮书 |\n| NCSC-TG-008 | *A Guide to\
  \ Understanding Trusted Distribution in Trusted Systems* | 薰衣草皮书 |\n| NCSC-TG-009\
  \ | *Computer Security Subsystem Interpretation of the TCSEC* | 威尼斯蓝皮书 |\n\n考虑到制定\
  \ TCSEC 所投入的大量时间和精力，人们很自然会想知道为什么评估标准会演变为更新、更先进的标准。除了时间的无情流逝和技术的不断进步之外，以下是对 TCSEC\
  \ 的主要批评；它们有助于解释为什么较新的标准现在在全球范围内得到使用：\n\n*   虽然 TCSEC 非常强调控制用户对信息的访问，但一旦授予访问权限，它并不控制用户对信息的处理。这在军事和商业应用中都可能成为一个问题。\n\
  *   鉴于评估标准起源于美国国防部，TCSEC 将关注点完全集中在机密性上，这是可以理解的。这假设控制用户如何访问数据是最重要的，而对数据准确性或完整性的关注无关紧要。这在商业环境中行不通，因为在商业环境中，对数据准确性和完整性的关注可能比对机密性的关注更重要。\n\
  *   除了评估标准自身对访问控制的强调外，TCSEC 并未仔细解决必须采取哪些人员、物理和程序政策事项或保障措施才能全面实施安全策略。它们也不太涉及此类事项如何影响系统安全。\n\
  *   橙皮书本身不处理网络问题（尽管后来于 1987 年开发的红皮书确实处理了这些问题）。\n\n在某种程度上，这些批评反映了开发 TCSEC 的军方独特的安全关注点。此外，当时（1985\
  \ 年网络技术刚刚起步）广泛可用的主流计算工具和技术也产生了影响。当然，组织内部对安全日益复杂和整体的看法，有助于解释 TCSEC 在程序和政策方面不足的原因和所在。但由于\
  \ ITSEC 已很大程度上被通用准则取代，下一节将把 ITSEC 解释为通往通用准则（在再下一节中介绍）道路上的一个步骤。\n\n#### ITSEC 类别及所需的保证和功能\n\
  \nITSEC 代表欧洲创建安全评估标准的最初尝试。它是作为 TCSEC 指南的替代方案而开发的。ITSEC 指南使用各自独立的评级来评估系统的功能性和保证性。在此背景下，系统的功能性是衡量系统对用户效用价值的指标。系统的功能性评级说明了系统基于其设计和预期目的执行所有必要功能的程度。保证评级代表了系统将以一致方式正常工作的信心程度。\n\
  \nITSEC 将任何被评估的系统称为*评估对象 (TOE)*。所有评级均以两个类别中的 TOE 评级表示。ITSEC 使用两个量表来评定功能性和保证性。\n\n\
  系统的功能性评级范围为 F-D 到 F-B3（没有 F-A1）。系统的保证性评级范围为 E0 到 E6。大多数 ITSEC 评级通常与 TCSEC 评级相对应（例如，TCSEC\
  \ C1 系统对应 ITSEC F-C1、E1 系统）。请参阅表 8.4（位于“通用准则结构”部分末尾）以获取 TCSEC、ITSEC 和通用准则评级的对比。\n\
  \nTCSEC 和 ITSEC 之间的差异多种多样。以下是这两个标准之间一些最重要的差异：\n\n\n\n\n虽然 TCSEC 几乎完全专注于机密性，但 ITSEC\
  \ 除了机密性外，还解决了关于完整性和可用性丧失的担忧，从而涵盖了维护完整信息安全至关重要的这三个要素。\n\nITSEC 不依赖 TCB 的概念，也不要求系统的安全组件必须隔离在\
  \ TCB 内部。\n\n与 TCSEC 不同，TCSEC 要求任何更改过的系统都必须重新评估——无论是操作系统升级、补丁或修复；应用程序升级或更改；等等——ITSEC\
  \ 包含在发生此类更改后维护评估目标的内容，而无需进行新的正式评估。\n\n有关 ITSEC 的更多信息（现已基本被通用准则取代，见下一节），请参阅以下站点：\n\
  \n<https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Zertifizierung/ITSicherheitskriterien/itsec-en_pdf.pdf?__blob=publicationFile>\n\
  \n<https://www.sogis.org/documents/itsec/itsec-en.pdf>\n\n或者您可以在此处查看原始 ITSEC 规范：\n\
  \n<http://www.ssi.gouv.fr/uploads/2015/01/ITSEC-uk.pdf>\n\n#### 通用准则\n\n**通用准则**\
  \ 代表了一项或多或少的全球性努力，涉及所有曾致力于 TCSEC 和 ITSEC 工作的人员以及其他全球参与者。最终，它使得购买经过 CC 评估的产品成为可能（其中\
  \ CC 当然代表通用准则）。通用准则定义了测试和确认系统安全能力的各个级别，级别数字表明执行了何种测试和确认。尽管如此，明智的做法是注意到即使是最高的 CC\
  \ 评级也不等同于保证此类系统完全安全，也不代表它们完全没有漏洞或易受攻击。通用准则被设计为产品评估模型。\n\n##### 通用准则的认可\n\n尽管有警告和免责声明，但一份题为“关于在\
  \ IT 安全领域认可通用准则证书的安排”的文件于 1998 年由加拿大、法国、德国、英国和美国的政府组织代表签署，使其成为一项国际标准。ISO 将该文件转换为正式标准：**ISO\
  \ 15408**，信息技术安全评估准则。CC 准则的目标如下：\n\n*   增强买家对经过评估、分级的信息技术 (IT) 产品安全性的信心\n*   消除重复评估（除其他外，这意味着如果一个国家、机构或验证组织遵循\
  \ CC 对特定系统和配置进行评级，其他地方无需重复这项工作）\n*   使安全评估和认证过程更具成本效益和效率\n*   确保 IT 产品的评估遵循高标准且一致\n\
  *   促进评估并增加经过评估、分级的 IT 产品的可用性\n*   评估 TOE 的功能性（即系统做什么）和保证性（即你能在多大程度上信任该系统）\n\n通用准则文档可在\
  \ <www.niap-ccevs.org/cc-scheme/> 获取。访问该站点可获取 CC 准则当前版本的信息、关于使用 CC 的指南以及许多其他有用的相关信息。\n\
  \n通用准则流程基于两个关键要素：保护剖面和安全目标。**保护剖面 (PP)** 为待评估产品（即 TOE）指定安全需求和保护，这些被视为安全需求或客户的“我想要”。**安全目标\
  \ (ST)** 指定供应商内置于 TOE 中的安全声明。ST 被视为已实施的安全措施或供应商的“我将提供”。除了提供安全目标外，供应商还可能提供额外安全功能的包。包是安全需求组件的中间分组，可添加到\
  \ TOE 中或从中移除（就像购买新车时的选装包）。\n\n将 PP 与选定供应商 TOE 的各种 ST 进行比较。最接近或最佳匹配即为客户购买的内容。客户最初根据发布或营销的**评估保证级\
  \ (EAL)** 选择供应商（有关 EAL 的更多详细信息，请参阅下一节），针对当前可用的系统。使用通用准则选择供应商允许客户根据安全需求准确请求所需内容，而不必使用静态固定的安全级别。它还允许供应商在设计和创建方面拥有更大的灵活性。一组定义良好的通用准则支持主观性和通用性，并能自动适应不断变化的技术和威胁条件。此外，EAL\
  \ 提供了一种比较供应商系统的方法，该方法更加标准化（类似于旧的 TCSEC）。\n\n##### 通用准则的结构\n\nCC 准则分为三个领域，如下所示：\n\
  \n**第 1 部分** 简介和通用模型 描述了用于评估 IT 安全的一般概念和底层模型，以及指定评估目标所涉及的内容。它包含对安全评估过程运作不熟悉或需要帮助阅读和解释评估结果的人员有用的介绍性和解释性材料。\n\
  \n**第 2 部分** 安全功能需求 从安全审计、通信安全、安全加密支持、用户数据保护、识别和鉴别、安全管理、TOE 安全功能 (TSF)、资源利用、系统访问和可信路径等方面描述了各种功能需求。涵盖了\
  \ CC 评估过程中设想的完整安全功能范围，并附有附录（称为*附件*）来解释每个功能领域。\n\n**第 3 部分** 安全保证 涵盖了 TOE 在配置管理、交付和运行、开发、指导文档和生命周期支持以及保证测试和漏洞评估等领域的保证需求。涵盖了\
  \ CC 评估过程中设想的完整安全保证检查和保护剖面，并包含描述系统如何设计、检查和测试的评估保证级信息。\n\n最重要的是，这些各种 CC 文档中出现的信息（至少值得粗略浏览一遍）是通常称为\
  \ EAL 的评估保证级。表 8.3 总结了 EAL1 到 EAL7。有关 EAL 的完整描述，请查阅托管在 <https://www.niap-ccevs.org/>\
  \ 的 CC 文档并查看最新修订版的第 3 部分。\n\n**表 8.3** **CC 评估保证级**\n\n| 级别 | 保证级 | 说明 |\n| ---\
  \ | --- | --- |\n| EAL1 | 功能测试 | 适用于需要对正确操作有一定信心，但安全威胁不严重的情况。当需要独立保证已尽到保护个人信息的应有注意义务时，这很有价值。\
  \ |\n| EAL2 | 结构测试 | 适用于设计信息和测试结果的交付符合良好商业实践的情况。当开发人员或用户需要低到中等级别的独立保证安全时，这很有价值。在评估遗留系统时尤其相关。\
  \ |\n\n\n\n\n| EAL3 || 系统地测试和检查 || 适用于安全工程始于设计阶段且贯彻始终、无重大后续变更的情况。当开发人员或用户需要中等级别的独立保证安全性（包括对\
  \ TOE 及其开发过程的彻底调查）时，这具有价值。 |\n\n| EAL4 || 系统地设计、测试和评审 || 适用于采用严格、积极的安全工程和良好的商业开发实践时。这不需要大量的专业知识、技能或资源。它涉及对所有\
  \ TOE 安全功能的独立测试。 |\n\n| EAL5 || 半形式化设计和测试 || 采用严格的安全工程和商业开发实践，包括专业的安全工程技术，用于半形式化测试。这适用于开发人员或用户在计划开发方法中需要高级别的独立保证安全性，随后进行严格开发的情况。\
  \ |\n\n| EAL6 || 半形式化验证、设计和测试 || 在设计、开发和测试的所有阶段使用直接、严格的安全工程技术，以生产优质 TOE。这适用于高风险情况下所需的\
  \ TOE，此时受保护资产的价值足以证明额外成本的合理性。广泛的测试降低了渗透风险、隐蔽信道的可能性以及受攻击的脆弱性。 |\n\n| EAL7 || 形式化验证、设计和测试\
  \ || 仅用于最高风险情况或涉及高价值资产的场合。这仅限于安全功能紧密聚焦、需接受大量形式化分析和测试的 TOE。 |\n\n尽管 CC 准则足够灵活和包容，能够涵盖大多数安全需求和要求，但它们绝非完美。与其他评估标准一样，CC\
  \ 准则无法确保用户对数据的操作也是安全的。CC 准则也不涉及安全特定职权范围之外的管理问题。与其他评估标准一样，CC 准则不包括对安全性的*实地*评估——即它们不涉及与人员、组织实践和程序或物理安全相关的控制。同样，电磁辐射控制未被涉及，密码算法强度评级的标准也未明确规定。尽管如此，CC\
  \ 准则代表了对系统进行安全性评级的最佳技术之一。为结束对安全评估标准的讨论，表 8.4 总结了 TCSEC、ITSEC 和 CC 各项评级的对比情况。表 8.4\
  \ 显示，每个标准的评级具有相似但不完全相同的评估标准。\n\n**表 8.4** **安全评估标准对比**\n\n| TCSEC || ITSEC || CC\
  \ 描述 ||   |\n\n| --- | --- | --- | --- |\n\n| D || F-D+E0 || EAL0, EAL1 || 最小/无保护\
  \ |\n\n| --- | --- | --- | --- |\n\n| C1 || F-C1+E1 || EAL2 || 自主安全机制 |\n\n| C2\
  \ || F-C2+E2 || EAL3 || 受控访问保护 |\n\n| B1 || F-B1+E3 || EAL4 || 标记安全保护 |\n\n| B2\
  \ || F-B2+E4 || EAL5 || 结构化安全保护 |\n\n| B3 || F-B3+E5 || EAL6 || 安全域 |\n\n| A1 ||\
  \ F-B3+E6 || EAL7 || 经验证的安全设计 |\n\n##### 行业与国际安全实施指南\n\n除了通用准则等整体安全访问模型外，还有许多其他更具体或更聚焦的安全标准，适用于存储、通信、事务等各个方面。其中有两个标准你应该熟悉，它们是\
  \ `Payment Card Industry Data Security Standard (PCI DSS)` 和 `International Organization\
  \ for Standardization (ISO)`。\n\n`PCI DSS` 是一套旨在提高电子支付交易安全性的要求集合。这些标准由 `PCI Security\
  \ Standards Council` 成员定义，成员主要为信用卡银行和金融机构。`PCI DSS` 定义了安全管理、策略、程序、网络架构、软件设计及其他关键防护措施的要求。有关\
  \ `PCI DSS` 的更多信息，请访问 [www.pcisecuritystandards.org](http://www.pcisecuritystandards.org)。\n\
  \n`ISO` 是一个由各国标准组织代表组成的全球标准制定团体。`ISO` 为工业和商业设备、软件、协议、管理等制定标准。它发布六大主要产品：国际标准、技术报告、技术规范、公开可用规范、技术勘误和指南。`ISO`\
  \ 标准被广泛接受于许多行业，甚至被各国政府采纳为要求或法律。有关 `ISO` 的更多信息，请访问 [www.iso.org](http://www.iso.org)。\n\
  \n##### 认证与认可\n\n需要安全系统的组织需要一种或多种方法来评估系统在多大程度上满足其安全要求。正式评估过程分为两个阶段，称为 `certification`（认证）和\
  \ `accreditation`（认可）。每个阶段所需的实际步骤取决于组织选择的评估标准。`CISSP` 候选人必须理解每个阶段的必要性以及评估系统常用的标准。接下来两节将讨论这两个评估阶段，随后我们将介绍评估系统安全性时必须解决的各种评估标准和考量因素。认证和认可过程用于评估应用安全性、操作系统安全性以及硬件安全性的有效性。\n\
  \n评估过程提供了一种方法，用以评判系统在多大程度上达到期望的安全级别。由于每个系统的安全级别取决于许多因素，评估期间必须将所有因素纳入考量。即使系统最初被描述为安全，安装过程、物理环境和通用配置细节都会影响其真实的整体安全性。由于配置或安装差异，两个相同的系统可能被评估为不同的安全级别。\n\
  \n认证和认可是软件和 IT 系统开发过程中的额外步骤，通常是国防承包商和在军事环境中工作的人员所必需的。这些术语的官方定义（由美国政府使用）源自国防部指令 5200.40，附件\
  \ 2。\n\n##### 认证\n\n完整评估过程的第一阶段是 `certification`（认证）。认证是对 IT 系统的技术和非技术安全特性及其他防护措施进行的全面评估，旨在支持认可过程，以确定特定设计和实现满足一组特定安全要求的程度。\n\
  \n系统认证是对计算机系统各部分进行的技术评估，以判定其与安全标准的一致性。首先，你必须选择评估标准（我们将在后续章节介绍备选标准）。一旦选定使用的标准，你就需分析每个系统组件，以确定其是否满足期望的安全目标。认证分析包括测试系统的硬件、软件和配置。此阶段评估所有控制措施，包括管理控制、技术控制和物理控制。\n\
  \n\n\n\n在评估整个系统后，您可以评估结果以确定系统在其当前环境中支持的安全级别。系统的环境是认证分析的关键部分，因此系统的安全程度可能因其周围环境而异。您将安全系统连接到网络的方式可能会改变其安全状况。同样，系统周围的物理安全也会影响整体安全评级。在认证系统时，您必须考虑所有因素。\n\
  \n当您评估了所有因素并确定了系统的安全级别时，即完成了认证阶段。请记住，认证仅对特定环境和配置下的系统有效。任何变更都可能导致认证失效。一旦您为特定配置认证了安全评级，就可以寻求系统的认可。管理层通过认可流程接受系统经认证的安全配置。\n\
  \n###### 认可\n\n在认证阶段，您会测试并记录系统在特定配置下的安全能力。掌握这些信息后，组织的管理层会将系统的能力与组织的需求进行比较。安全策略必须明确陈述安全系统的要求，这至关重要。管理层审查认证信息，并决定该系统是否满足组织的安全需求。如果管理层认为系统的认证满足其需求，则该系统即被`认可`。`认可`是由`指定批准机构\
  \ (DAA)` 正式声明：某 IT 系统获批在特定安全模式下运行，使用规定的一组防护措施，在可接受的风险水平上。一旦完成认可，管理层即可正式接受经过评估系统的整体安全性能的充分性。\n\
  \n认证和认可的过程通常是迭代的。在认可阶段，要求更改配置或增加控制以解决安全顾虑的情况并不罕见。请记住，每当您更改配置时，都必须对新配置重新认证。同样，当特定时间段过去或您进行任何配置更改时，都需要对系统重新认证。您的安全策略应规定哪些条件要求重新认证。一项合理的策略会列出认证的有效期限，以及要求您重新启动认证和认可流程的任何变更。\n\
  \n###### 认证和认可系统\n\n目前有两项政府标准用于计算系统的认证和认可。当前的 DoD 标准是`风险管理框架 (RMF)` ([`www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodi/855101p.pdf`](http://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodi/855101p.pdf))，它最近取代了\
  \ `DoD 信息保障认证和认可过程 (DIACAP)`，后者本身取代了 `国防信息技术安全认证和认可过程 (DITSCAP)`。所有其他美国政府行政部门、机构及其承包商和顾问的标准是`国家安全系统委员会\
  \ (CNSS) 政策 (CNSSP)` ([`www.cnss.gov/CNSS/issuances/Policies.cfm`](https://www.cnss.gov/CNSS/issuances/Policies.cfm);\
  \ 向下滚动至 CNSSP 22 链接)，它取代了 `国家信息保障认证和认可过程 (NIACAP)`。然而，CISSP 可能会参考当前标准或之前的标准。这两个过程都分为四个阶段：\n\
  \n**第 1 阶段：定义** 涉及分配适当的项目人员；记录任务需求；以及注册、协商和创建系统安全授权协议 (SSAA)，该协议指导整个认证和认可过程\n\n\
  **第 2 阶段：验证** 包括完善 SSAA、系统开发活动和认证分析\n\n**第 3 阶段：确认** 包括进一步完善 SSAA、对集成系统的认证评估、制定向\
  \ DAA 的建议，以及 DAA 的认可决定\n\n**第 4 阶段：认可后** 包括 SSAA 的维护、系统运行、变更管理和合规性验证\n\n由美国国家安全局信息系统安全组织管理的\
  \ NIACAP 流程，概述了可能授予的三种认可类型。这些认可类型的定义（来自国家安全电信和信息系统安全指令 1000）如下：\n\n*   对于系统认可，将对主要应用程序或通用支持系统进行评估。\n\
  *   对于场地认可，将对特定、独立地点的应用程序和系统进行评估。\n*   对于类型认可，将对分发到多个不同地点的应用程序或系统进行评估。\n\n#### 了解信息系统的安全能力\n\
  \n信息系统的安全能力包括内存保护、虚拟化、可信平台模块 (TPM)、接口和容错。仔细评估基础设施的各个方面以确保其充分支持安全性非常重要。如果不了解信息系统的安全能力，就无法对其进行评估，也无法正确实施它们。\n\
  \n##### 内存保护\n\n内存保护是必须设计并实施到操作系统中的核心安全组件。无论系统中执行何种程序，都必须强制执行它。否则，不稳定、完整性违规、拒绝服务和泄露很可能会发生。内存保护用于防止活动进程与未专门分配或分配给它的内存区域进行交互。\n\
  \n第 9 章在涉及隔离、虚拟内存、分段、内存管理和保护环等主题时，均讨论了内存保护。\n\n### 虚拟化\n\n`虚拟化` 技术用于在单台主机计算机的内存中托管一个或多个操作系统。此机制允许几乎任何操作系统在任何硬件上运行。它还允许多个操作系统在同一硬件上同时工作。常见示例包括\
  \ VMware Workstation Pro、VMware vSphere 和 vSphere Hypervisor、VMware Fusion for Mac、Microsoft\
  \ Hyper-V、Oracle VirtualBox、XenServer 和 Parallels Desktop for Mac。\n\n虚拟化有几个优势，例如能够根据需要启动单个服务器或服务的实例、实时可扩展性，以及能够运行特定应用程序所需的确切操作系统版本。从用户的角度来看，虚拟化的服务器和服务与传统的服务器和服务无法区分。此外，从损坏、崩溃或损坏的虚拟系统中恢复通常很快，只需将虚拟系统的主硬盘文件替换为干净的备份版本，然后重新启动它即可。（第\
  \ 9 章还将介绍虚拟化及其相关风险，以及云计算。）\n\n##### 可信平台模块\n\n`可信平台模块 (TPM)` 既是主板上密码处理器芯片的规范，也是该规范实现的统称。TPM\
  \ 芯片用于存储和处理加密密钥，以实现硬件支持/实现的硬盘加密系统。通常，硬件实现被认为比仅靠软件实现的硬盘加密更安全。\n\n\n\n\n### 基于 TPM\
  \ 的全盘加密\n\n当使用基于 TPM 的全盘加密时，用户/操作员必须向计算机提供密码或物理通用串行总线 (USB) 令牌设备，以进行身份验证并允许 TPM\
  \ 芯片将硬盘加密密钥释放到内存中。虽然这看起来与软件实现相似，但关键区别在于：如果硬盘从其原始系统中移除，则无法解密。只有配合原始的 TPM 芯片，才能解密并访问加密数据。而对于仅靠软件的硬盘加密，硬盘可以移动到另一台计算机上，没有任何访问或使用限制。\n\
  \n### 硬件安全模块 (HSM)\n\n`硬件安全模块 (HSM)` 是一种密码处理器，用于管理/存储数字加密密钥、加速加密操作、支持更快的数字签名并改进身份验证。HSM\
  \ 通常是一个附加适配器或外设，也可以是一个传输控制协议/互联网协议 (TCP/IP) 网络设备。HSM 包含防篡改保护，即使攻击者获得了物理访问权限，也能防止其被滥用。TPM\
  \ 只是 HSM 的一个例子。\n\nHSM 为大型（2,048+ 位）非对称加密计算提供加速解决方案，并为密钥存储提供安全保管库。许多证书颁发机构系统使用 HSM\
  \ 存储证书；ATM 和 POS 银行终端通常采用专有 HSM；硬件 SSL 加速器可包含 HSM 支持；域名系统安全扩展 (DNSSEC) 兼容的域名系统 (DNS)\
  \ 服务器使用 HSM 进行密钥和区域文件存储。\n\n#### 接口\n\n`受限或限制性接口` 在应用程序内实现，根据用户的权限限制其能做什么或看到什么。拥有完全权限的用户可以访问应用程序的所有功能。受限权限的用户只有有限的访问权。\n\
  \n应用程序使用不同的方法来限制界面。一种常见方法是，如果用户没有使用某功能的权限，则隐藏该功能。命令可能通过菜单或右键单击项目提供给管理员，但如果普通用户没有权限，该命令将不显示。其他时候，命令会显示但变灰或禁用。普通用户可以看到它，但无法使用它。\n\
  \n受限接口的目的是限制或约束授权和未授权用户的行为。使用此类接口是克拉克-威尔逊安全模型的一种实际实现。\n\n#### 容错\n\n`容错` 是指系统在发生故障时仍能继续运行的能力。通过添加冗余组件（如廉价冗余磁盘阵列\
  \ (RAID) 阵列中的额外磁盘，或故障转移集群配置中的额外服务器）来实现容错。容错是安全设计的基本要素。它也被视为避免单点故障和实施冗余的一部分。有关容错、冗余服务器、RAID\
  \ 和故障转移解决方案的更多详细信息，请参阅第 18 章“灾难恢复规划”。\n\n### 摘要\n\n安全系统不仅仅是组装而成的；它们是为支持安全而设计的。必须保证安全的系统，将根据其支持和强制执行安全策略的能力进行评判。评估计算机系统有效性的这一过程称为认证。认证过程是对系统满足其设计目标能力的技术评估。一旦系统满意地通过了技术评估，组织的管理层便开始对系统进行正式验收。正式验收过程称为认可。\n\
  \n整个认证和认可过程依赖于标准评估准则。存在多种用于评估计算机安全系统的准则。最早的 TCSEC 由美国国防部开发。TCSEC 也称为《橙皮书》，提供了评估系统安全组件功能性和保证性的准则。ITSEC\
  \ 是 TCSEC 准则的替代方案，在欧洲国家使用更多。2005 年，TCSEC 被通用准则取代。无论使用哪种准则，评估过程都包括审查每个安全控制措施对安全策略的合规性。系统强制主体对客体访问的良好行为程度越高，安全等级就越高。\n\
  \n在设计安全系统时，创建一个安全模型来表示系统将用于实施安全策略的方法，这通常很有帮助。本章讨论了几种安全模型。贝尔-拉帕杜拉模型仅支持数据机密性。它是为军事设计的，满足军事关注点。比巴模型和克拉克-威尔逊模型以不同方式解决数据完整性问题。这些模型在为商业应用设计安全基础设施时，常被用作基础之一。\n\
  \n所有这些理解必须最终汇聚为一种有效的系统安全实施，体现在预防性、检测性和纠正性控制方面。这就是为什么你还必须了解访问控制模型及其功能。这包括状态机模型、贝尔-拉帕杜拉、比巴、克拉克-威尔逊、信息流模型、非干扰模型、获取-授予模型、访问控制矩阵模型以及布鲁尔-纳什模型。\n\
  \n### 考试要点\n\n**了解每种访问控制模型的细节。** 了解访问控制模型及其功能。状态机模型确保主体访问客体的所有实例都是安全的。信息流模型旨在防止未经授权、不安全或受限的信息流。非干扰模型防止一个主体的行为影响系统状态或另一个主体的行为。获取-授予模型规定了权限如何从一个主体传递给另一个主体，或从主体传递给客体。访问控制矩阵是一个主体和客体的表格，指示每个主体可以在每个客体上执行的动作或功能。贝尔-拉帕杜拉模型中的主体具有许可级别，仅允许其访问具有相应分类级别的客体。这强制执行了机密性。比巴模型阻止较低安全级别的主体写入较高安全级别的客体。克拉克-威尔逊是一种完整性模型，依靠审计来确保未授权主体无法访问客体，且授权用户正确访问客体。比巴和克拉克-威尔逊强制执行完整性。戈根-梅塞格尔和萨瑟兰关注完整性。格雷厄姆-德宁侧重于主体和客体的安全创建和删除。\n\
  \n**了解认证和认可的定义。** 认证是对计算机系统的每个部分进行技术评估，以评估其与安全标准的一致性。认可是指定机构正式接受经过认证的配置的过程。\n\n\
  **能够描述开放系统和封闭系统。** 开放系统是使用行业标准设计的，通常易于与其他开放系统集成。封闭系统通常是专有硬件和/或软件。其规范通常不公开，且通常较难与其他系统集成。\n\
  \n**了解限制、边界和隔离。** 限制将进程限制在只能读取和写入特定内存位置。边界是进程在读取或写入时不能超过的内存限制。隔离是进程在通过内存边界进行限制时运行的模式。\n\
  \n**能够从访问角度定义 `对象` 和 `主体`。** 主体是发出请求以访问资源的用户或进程。客体是用户或进程想要访问的资源。\n\n\n\n### 知识点总结\n\
  \n**了解安全控制的工作原理及其功能。** 安全控制使用访问规则来限制主体对客体的访问。\n\n**能够列出 TCSEC、ITSEC 和通用准则的类别。**\
  \ TCSEC 的类别包括经验证保护、强制保护、自主保护和最低保护。表 8.4 涵盖并对比了 TCSEC、ITSEC 和 CC 的等效及适用排名（请记住，ITSEC\
  \ 中 F7 到 F10 的功能性等级在 TCSEC 中没有对应的等级）。\n\n**定义可信计算基（TCB）。** TCB 是形成可信基础的硬件、软件和控制的组合，用于实施安全策略。\n\
  \n**能够解释什么是安全边界。** 安全边界是将 TCB 与系统其余部分分隔开的假想边界。TCB 组件通过可信路径与非 TCB 组件通信。\n\n**了解参考监视器和安全内核。**\
  \ 参考监视器是 TCB 的逻辑部分，在授予访问权限前确认主体是否有权使用资源。安全内核是实现参考监视器功能的 TCB 组件的集合。\n\n**理解信息系统的安全能力。**\
  \ 常见的安全能力包括内存保护、虚拟化和可信平台模块 (TPM)。\n\n### 书面实验\n\n1.  列举至少七种安全模型。\n2.  描述 TCB 的主要组件。\n\
  3.  Bell-LaPadula 安全模型的两条主要规则或原则是什么？此外，Biba 的两条规则是什么？\n4.  开放系统与封闭系统、开源与闭源有何区别？\n\
