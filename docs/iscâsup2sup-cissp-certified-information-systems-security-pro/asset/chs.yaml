  \n1. 基于主机\n2. 基于网络\n3. **基于知识**\n4. 基于行为\n\n# 评估测试答案\n\n1. **C. 检测性访问控制**用于发现（并记录）不需要的或未授权的活动。\n\
  \n2. **D. 强密码选择**难以猜测、不可预测，且具有指定的最小长度，以确保密码条目无法通过计算确定。它们可能是随机生成的，并利用所有字母、数字和标点字符；绝不应记录或共享；不应存储在公开可访问或通常可读的位置；且不应以明文传输。\n\
  \n3. **B. 基于网络的 IDS**通常能够检测攻击的发起或正在进行的攻击尝试（包括拒绝服务，即 `DoS`）。然而，它们无法提供关于攻击是否成功或哪些特定系统、用户账户、文件或应用程序受到影响的信息。基于主机的\
  \ IDS 在检测和追踪 `DoS` 攻击方面有一定困难。漏洞扫描器不检测 `DoS` 攻击；它们测试可能的漏洞。渗透测试可能导致 `DoS` 或测试 `DoS`\
  \ 漏洞，但它不是检测工具。\n\n4. **B. 并非所有 `DoS` 实例都是恶意攻击的结果。** 操作系统、服务和应用程序中的编码错误导致了 `DoS`\
  \ 状况。例如包括进程未能释放 CPU 控制权，或服务消耗系统资源的比例与其处理的服务请求不成比例。社会工程学和嗅探通常不被视为 `DoS` 攻击。\n\n5.\
  \ **A. 网络硬件设备（包括路由器）在第三层（即网络层）运行。**\n\n6. **D. 动态包过滤防火墙**支持根据流量内容实时修改过滤规则。\n\n7.\
  \ **D. `VPN` 链路**可在任何其他网络通信连接上建立。这可能是典型的 `LAN` 电缆连接、无线 `LAN` 连接、远程访问拨号连接、`WAN` 链路，甚至是客户端用于访问办公室\
  \ `LAN` 的互联网连接。\n\n8. **C. 特洛伊木马**是一种利用社会工程学策略诱骗受害者安装的恶意软件——诀窍在于让受害者相信他们下载或获得的只是宿主文件，而实际上它隐藏着恶意载荷。\n\
  \n9. **D. CIA 三要素的组成部分**是机密性、可用性和完整性。\n\n10. **B. 隐私**不是提供问责制所必需的。\n\n11. **C. 组用户账户**允许多人使用单一用户账户登录。这导致串通，因为它阻止了个人问责制。\n\
  \n12. **B. 数据所有者**必须先为资源分配安全标签，数据管理员才能适当地保护该资源。\n\n13. **C. `SW-CMM` 的受控阶段**涉及使用定量开发度量。软件工程协会（`SEI`）将该级别的关键过程领域定义为定量过程管理和软件质量管理。\n\
  \n14. **B. 第 1 层和第 2 层包含设备驱动程序，但在实践中通常不实现。** 第 0 层始终包含安全内核。第 3 层包含用户应用程序。第 4 层不存在。\n\
  \n15. **B. `SYN` 数据包**首先从发起主机发送到目标主机。目标主机随后响应 `SYN/ACK` 数据包。发起主机发送 `ACK` 数据包，连接随即建立。\n\
  \n16. **B. 参数检查**用于防止缓冲区溢出攻击的可能性。\n\n17. **A. `~` OR 符号**表示 OR 函数，当一个或两个输入位为真时结果为真。\n\
  \n18. **C. 置换密码**使用加密算法重新排列明文消息的字母以形成密文消息。\n\n19. **B. `MD5` 算法**为任何输入生成 128 位的消息摘要。\n\
  \n20. **C. 任何接收者**都可使用 Mike 的公钥来验证数字签名的真实性。\n\n21. **C. 迭代**不是与安全模型相关的合成理论之一。级联、反馈和挂钩是三种合成理论。\n\
  \n\n\n\n# 22. B. TCB 中协同工作以实现参考监视器功能的组件集合称为安全内核。\n\n# 23. B. 系统越复杂，其提供的保证程度越低。复杂性增加意味着存在漏洞的区域更多，必须针对威胁进行防护的区域也更多。漏洞越多、威胁越多，意味着系统提供的后续安全性越不可信。\n\
  \n# 24. D. 0 环对资源拥有最直接的访问权限；因此用户模式不是合适的标签，因为用户模式需要限制来限制对资源的访问。\n\n# 25. C. 侦测型控制的示例包括审计追踪、日志、闭路电视\
  \ (CCTV)、入侵检测系统、防病毒软件、渗透测试、密码破解工具、性能监控和循环冗余校验 (CRC)。\n\n# 26. B. 保证是指你对计算机、网络、解决方案等安全需求得到满足所抱有的信心程度。运维保证侧重于系统有助于支持安全性的基本特性和架构。\n\
  \n# 27. C. 渗透测试是尝试绕过安全控制以测试整体系统安全性的行为。\n\n# 28. A. 审计是维持和强制执行问责制所必需的因素。\n\n# 29.\
  \ A. 年化损失期望值 (ALE) 的计算公式为资产价值 (AV) 乘以暴露因子 (EF) 再乘以年化发生率 (ARO)。这是公式 `ALE = SLE *\
  \ ARO` 的长格式。此处显示的其他公式不能准确反映这一计算。\n\n# 30. A. 优先级识别是业务影响评估过程的第一步。\n\n# 31. D. 可能威胁组织的自然事件包括地震、洪水、飓风、龙卷风、野火以及其他自然灾害。因此选项\
  \ A、B 和 C 都是正确的，因为它们属于自然事件而非人为事件。\n\n# 32. A. 热站点提供持续保持正常工作状态、完全能够接管业务运营的备份设施。温站点由可运行业务的预配置硬件和软件组成，但两者都不具备关键业务信息。冷站点仅是配备了电力和环境支持系统的设施，没有配置好的硬件、软件或服务。灾难恢复服务可以代表公司促成并实施上述任一站点。\n\
  \n# 33. C. 商标用于保护代表公司及其产品或服务的文字、标语和徽标。\n\n# 34. C. 提交法庭以证明案件事实的书面文件被称为书证。\n\n# 35.\
  \ A. 军事和情报攻击的目的是获取机密信息。若此类信息落入敌手，其有害影响几乎是无限的。此类攻击由极其复杂的攻击者发起。通常很难确定成功获取了哪些文件。因此，当发生此类违规时，有时无法知晓损害的全貌。\n\
  \n# 36. D. 扫描事件通常属于侦察攻击。对系统的真正破坏来自后续攻击，因此如果能及早发现扫描攻击，可能会有一些反应时间。\n\n# 37. B. 转闸是一种闸门，可防止一次有多个人进入，且通常将移动限制为单向。它用于控制入口而非出口，或反之亦然。\n\
  \n# 38. D. 次要验证机制旨在建立一种验证检测系统和传感器正确性的方法。这通常意味着结合多种类型的传感器或系统（闭路电视、热感和动作传感器等），以提供更完整的检测事件图景。\n\
  \n# 39. B. 垃圾邮件攻击（发送大量未经请求的电子邮件）可用作一种拒绝服务攻击。它不使用窃听方法，因此不是嗅探。暴力破解方法尝试破解密码。缓冲区溢出攻击向系统发送数据字符串，试图导致其故障。\n\
  \n# 40. D. 基于行为的 IDS 可被称为专家系统或伪人工智能系统，因为它能够学习并对事件做出假设。换句话说，IDS 可以像人类专家一样，通过将当前事件与已知事件进行对比来评估。基于知识的\
  \ IDS 使用已知攻击方法的数据库来检测攻击。基于主机和基于网络的系统都可以是基于知识的、基于行为的，或两者的结合。\n\n#### 第 1 章：通过原则和策略进行安全治理\n\
  \n## 本章涵盖的 CISSP 考试主题包括：\n\n*   **领域 1：安全与风险管理**\n    *   1.1 理解并应用机密性、完整性和可用性的概念\n\
  \    *   1.2 评估并应用安全治理原则\n        *   1.2.1 安全职能与业务战略、目标、使命和目的的对齐\n        *   1.2.2\
  \ 组织流程\n        *   1.2.3 组织角色与职责\n        *   1.2.4 安全控制框架\n        *   1.2.5 尽职照料/尽职调查\n\
  \    *   1.6 制定、记录并实施安全策略、标准、程序和指南\n    *   1.10 理解并应用威胁建模概念和方法论\n        *   1.10.1\
  \ 威胁建模方法论\n        *   1.10.2 威胁建模概念\n    *   1.11 将基于风险的管理概念应用于供应链\n        * \
  \  1.11.1 与硬件、软件和服务相关的风险\n        *   1.11.2 第三方评估与监控\n        *   1.11.3 最低安全要求\n\
  \        *   1.11.4 服务级别要求\n\n![images/clogo.jpg](img/clogo.jpg) CISSP 认证考试通用知识体系\
  \ (CBK) 中的安全与风险管理领域涉及安全解决方案的许多基础要素。这些要素包括设计、实施和管理安全机制所必需的内容。该领域的其他要素分散在各章节中讨论：第\
  \ 2 章“个人安全与风险管理概念”；第 3 章“业务连续性规划”；第 4 章“法律、法规与合规”；以及第 19 章“调查与伦理”。请务必复习所有这些章节，以对该领域的主题有完整的视角。\n\
  \n## 理解并应用机密性、完整性和可用性的概念\n\n安全管理概念和原则是安全策略和解决方案部署中固有的要素。它们定义了安全环境所需的基本参数。它们还定义了策略设计者和系统实施者必须实现的目标和目的，以创建安全解决方案。对于现实世界的安全专业人士以及\
  \ CISSP 考生来说，彻底理解这些项目非常重要。本章包含一系列与全球企业及中小企业安全治理相关的主题。\n\n安全必须有一个起点。通常这个起点是最重要的安全原则列表。在这样的列表中，机密性、完整性和可用性\
  \ (CIA) 通常都在场，因为这些通常被视为安全基础设施的主要目标和目的。它们作为安全要素太过常见，以至于被称为 *CIA 三要素*（参见 图 1.1）。\n\
  \n![图 1.1 CIA 三要素](img/c01f001.jpg)\n\n**图 1.1** CIA 三要素\n\n\n\n\n### CIA 三要素：安全原则\n\
  \n安全控制通常根据其解决这三大核心信息安全原则的效果来评估。总体而言，完整的安全解决方案应充分解决这些原则中的每一个。漏洞和风险也是根据它们对 CIA 三要素原则中的一个或多个构成的威胁来评估的。因此，熟悉这些原则并将其作为判断所有安全相关事务的指南是个好主意。\n\
  \n这三个原则被认为是安全领域中最重要的。然而，每个特定原则对特定组织的重要程度取决于该组织的安全目标和要求，以及组织安全可能受到威胁的程度。\n\n####\
  \ 机密性\n\nCIA 三要素的第一原则是机密性。`机密性` 是指用于确保数据、对象或资源的秘密性得到保护的措施概念。机密性保护的目标是防止或最小化对数据的未授权访问。机密性将安全措施的重点放在确保除预期接收者外，无人能收到或读取消息。机密性保护为授权用户提供访问和交互资源的途径，但会主动阻止未授权用户这样做。广泛的安全控制可为机密性提供保护，包括但不限于加密、访问控制和隐写术。\n\
  \n如果安全机制提供机密性，则它能提供高度保证，即数据、对象或资源受限于未授权主体。如果存在针对机密性的威胁，可能会发生未授权披露。对象是安全关系中的被动元素，如文件、计算机、网络连接和应用程序。主体是安全关系中的主动元素，如用户、程序和计算机。主体作用于对象或针对对象采取行动。主体和对象之间关系的管理称为访问控制。\n\
  \n一般来说，要在网络上维持机密性，数据在存储、处理和传输过程中都必须受到保护，防止未授权访问、使用或披露。维持机密性需要针对数据、资源和对象的这些状态，分别采用独特且特定的安全控制。\n\
  \n许多攻击专注于违反机密性。这些攻击包括捕获网络流量、窃取密码文件，以及社会工程学、端口扫描、肩窥、窃听、嗅探、权限提升等。\n\n机密性违规不仅限于有针对性的故意攻击。许多敏感或机密信息未授权披露的实例是人为错误、疏忽或无能的结果。导致机密性泄露的事件包括：未能正确加密传输、在传输数据前未能完全认证远程系统、留下原本受保护的访问点敞开、访问打开后门的恶意代码、传真发错位置、文档遗留在打印机上，甚至在数据显示在显示器上时离开访问终端。机密性违规可能源于最终用户或系统管理员的行为，也可能源于安全策略的疏漏或安全控制的错误配置。\n\
  \n许多对策有助于确保机密性以抵御潜在威胁。这些包括加密、网络流量填充、严格的访问控制、严格的认证程序、数据分类和广泛的人员培训。\n\n机密性和完整性相互依赖。没有对象完整性（换句话说，未经许可无法修改对象），就无法维持机密性。与机密性相关的其他概念、条件和方面包括以下内容：\n\
  \n##### 敏感性\n`敏感性` 是指信息的一种属性，一旦披露可能造成危害或损失。维护敏感信息的机密性有助于防止危害或损失。\n\n##### 裁量权\n\
  `裁量权` 是一种决策行为，操作员可通过影响或控制披露来将危害或损失降至最低。\n\n##### 关键性\n信息对任务的关键程度即为其 `关键性` 的衡量标准。关键性级别越高，越有可能需要维护该信息的机密性。高关键性级别对组织的运作或职能至关重要。\n\
  \n##### 隐藏\n`隐藏` 是隐瞒或防止披露的行为。隐藏常被视为一种掩护、混淆或转移注意力的手段。与隐藏相关的概念是靠隐蔽求安全，即试图通过隐藏、沉默或保密来获得保护的概念。虽然靠隐蔽求安全通常不被视为有效的安全措施，但在某些情况下仍可能有价值。\n\
  \n##### 保密\n`保密` 是保守秘密或防止信息泄露的行为。\n\n#### 隐私\n`隐私` 是指保护可识别个人身份的信息，或一旦泄露可能对某人造成伤害、尴尬或耻辱的信息保持机密。\n\
  \n##### 隔离存放\n`隔离存放` 涉及将某物存放在偏僻的位置。该位置也可提供严格的访问控制。隔离存放有助于执行机密性保护。\n\n#### 隔离\n`隔离`\
  \ 是将某物与其他事物分离的行为。隔离可用于防止信息混合或信息泄露。\n\n每个组织都需要评估其希望实施的机密性细微差别。实现一种形式机密性的工具和技术可能不支持或不允许其他形式。\n\
  \n#### 完整性\n\nCIA 三要素的第二原则是完整性。`完整性` 是保护数据可靠性和正确性的概念。完整性保护防止对数据的未授权修改。它确保数据保持正确、未被篡改且得以保存。正确实施的完整性保护为授权更改提供途径，同时防范蓄意和恶意的未授权活动（如病毒和入侵）以及授权用户的错误（如失误或疏忽）。\n\
  \n为维持完整性，对象必须保持其真实性，且仅由授权主体有意修改。如果安全机制提供完整性，则它能提供高度保证，即数据、对象和资源未从其原始受保护状态被篡改。无论对象处于存储、传输还是处理状态，均不应发生篡改。因此，维护完整性意味着对象本身未被篡改，且管理和操作该对象的操作系统和编程实体未被攻破。\n\
  \n完整性可从三个角度进行审视：\n\n*   防止未授权主体进行修改\n*   防止授权主体进行未授权修改，如失误\n*   维护对象的内部和外部一致性，使其数据能正确、真实地反映现实世界，且与任何子对象、对等对象或父对象的关系均为有效、一致且可验证的\n\
  \n为在系统上维持完整性，必须实施控制以限制对数据、对象和资源的访问。此外，应采用活动日志记录，以确保只有授权用户才能访问其各自的资源。跨存储、传输和处理维护和验证对象完整性需要多种变体的控制和监督。\n\
  \n\n\n\n许多攻击侧重于破坏完整性。这些攻击包括病毒、逻辑炸弹、未授权访问、编码和应用程序错误、恶意修改、故意替换以及系统后门。\n\n与机密性一样，完整性违规不仅限于故意攻击。人为错误、疏忽或无能导致了许多未授权篡改敏感信息的实例。导致完整性破坏的事件包括：修改或删除文件；输入无效数据；更改配置，包括命令、代码和脚本中的错误；引入病毒；以及执行恶意代码（如特洛伊木马）。完整性违规可能由任何用户（包括管理员）的行为引起。它们也可能由安全策略中的疏忽或安全控制的错误配置导致。\n\
  \n许多对策可以确保完整性以抵御潜在威胁。这些措施包括严格的访问控制、严格的认证程序、入侵检测系统、对象/数据加密、哈希总值验证（参见第 6 章“密码学和对称密钥算法”）、接口限制、输入/功能检查以及广泛的人员培训。\n\
  \n完整性依赖于机密性。与完整性相关的其他概念、条件和方面包括以下内容：\n\n*   **准确性**：正确且精确\n*   **真实性**：真实反映现实\n\
  *   **真实性**：真实或真诚（注：原文此处有两个 Authenticity，译文根据语境区分为“真实性”与“可验证性/真实性”，此处建议译为“可验证性”或保留“真实性”并加注，但通常对应\
  \ Authenticity 译“真实性”，对应 Nonrepudiation 相关语境下的 Authenticity 有时译“可验证性”，此处列表中两者并列，建议第二个译为“可验证性”或“确真性”，为避免歧义，此处译为“真实性”并加注或按标准术语译“可验证性”。标准术语中\
  \ Authenticity 通常译“真实性”，Nonrepudiation 译“不可否认性”。此处列表第二项 Truthfulness 译“真实性”，第三项\
  \ Authenticity 应译“可验证性”或“确真性”。采用“可验证性”。）\n*   **有效性**：在事实上或逻辑上站得住脚\n*   **不可否认性**：无法否认已执行某操作或活动，或能够验证通信或事件的来源\n\
  *   **问责制**：对行动和结果负责或有义务\n*   **责任**：负责或控制某事或某人\n*   **完整性**：拥有所有必需的组件或部分\n*   **全面性**：范围完整；包含所有必需元素\n\
  \n#### 可用性\n\nCIA 三要素的第三项原则是**可用性**，这意味着授权主体能及时、不间断地访问对象。通常，可用性保护控制支持组织或情况认为必要的足够带宽和处理及时性。如果安全机制提供可用性，它就能高度保证数据、对象和资源可供授权主体访问。可用性包括对对象的高效不间断访问以及防止拒绝服务攻击。可用性还意味着支持基础设施（包括网络服务、通信和访问控制机制）功能正常，并允许授权用户获得授权访问。\n\
  \n要在系统上维持可用性，必须采取控制措施以确保授权访问和可接受的性能水平，快速处理中断，提供冗余，维护可靠的备份，并防止数据丢失或破坏。\n\n存在许多针对可用性的威胁。这些威胁包括设备故障、软件错误和环境问题（高温、静电、洪水、断电等）。还有一些形式的攻击侧重于破坏可用性，包括\
  \ DoS 攻击、对象破坏和通信中断。\n\n与机密性和完整性一样，可用性违规不仅限于故意攻击。许多未授权篡改敏感信息的实例是由人为错误、疏忽或无能引起的。导致可用性破坏的事件包括：意外删除文件、过度使用硬件或软件组件、资源分配不足、错误标记或错误分类对象。可用性违规可能由任何用户（包括管理员）的行为引起。它们也可能由安全策略中的疏忽或安全控制的错误配置导致。\n\
  \n许多对策可以确保可用性以抵御潜在威胁。这些措施包括妥善设计中间传递系统、有效使用访问控制、监控性能和网络流量、使用防火墙和路由器防止 DoS 攻击、为关键系统实施冗余，以及维护和测试备份系统。大多数安全策略以及业务连续性规划（BCP）都侧重于在各个访问/存储/安全级别（即磁盘、服务器或站点）使用容错功能，目标是消除单点故障，以维持关键系统的可用性。\n\
  \n可用性依赖于完整性和机密性。没有完整性和机密性，就无法维持可用性。与可用性相关的其他概念、条件和方面包括以下内容：\n\n*   **易用性**：易于使用或学习，或能被主体理解和控制的状态\n\
  *   **可访问性**：确保最广泛范围的主体能够与资源交互，无论其能力或限制如何\n*   **及时性**：迅速、准时、在合理的时间范围内，或提供低延迟响应\n\
  \n### 其他安全概念\n\n除了 CIA 三要素，在设计安全策略和部署安全解决方案时，还需要考虑大量其他与安全相关的概念和原则。\n\n您可能听说过**AAA\
  \ 服务**的概念。该缩写中的三个 A 分别代表认证、授权和审计（有时指核算）。然而，不太清楚的是，尽管首字母缩略词中有三个字母，但实际上它指的是五个要素：标识、认证、授权、审计和核算。这五个要素代表了以下安全过程：\n\
  \n*   **标识**：在尝试访问安全区域或系统时声称拥有某身份\n*   **认证**：证明您就是该身份\n*   **授权**：定义特定身份对资源和对象访问的权限（即允许/授予和/或拒绝）\n\
  *   **审计**：记录与系统和主体相关的事件和活动日志\n*   **核算**（又称**问责制**）：审查日志文件以检查合规性和违规情况，以便让主体对其行为负责\n\
  \n尽管 AAA 通常与认证系统相关联，但它实际上是安全的一个基础概念。缺少这五个要素中的任何一个都可能导致安全机制不完整。以下各节将讨论标识、认证、授权、审计和问责制（参见图\
  \ 1.2）。\n\n![图 1.2 AAA 服务的五个要素](img/c01f002.jpg)\n\n**图 1.2** AAA 服务的五个要素\n\n####\
  \ 标识\n\n标识是主体声称身份并启动问责制的过程。**主体**必须向系统提供身份，以启动认证、授权和问责（AAA）过程。提供身份可以涉及输入用户名、刷智能卡、挥动近距离设备、说出一句短语，或将面部、手或手指置于摄像头或扫描设备前进行扫描。提供进程\
  \ ID 号也代表标识过程。没有身份，系统就无法将认证因子与主体关联起来。\n\n\n\n一旦确定了主体（即识别并验证了主体的身份），该身份即对该主体的任何后续行为负责。IT\
  \ 系统通过身份而非主体本身来追踪活动。计算机无法区分不同的人类，但它知道你的用户账户与所有其他用户账户不同。主体的身份通常被标记为或被视为公开信息。然而，仅仅声称一个身份并不意味着拥有访问权或权限。必须证明该身份（认证）或对其进行验证（确保不可否认性），然后才允许访问受控资源（验证授权）。这一过程即为认证。\n\
  \n##### 认证\n\n验证或测试所声称的身份是否有效的过程即为认证。认证要求主体提供与其声称的身份相对应的附加信息。最常见的认证形式是使用密码（这包括个人识别号码（PIN）和口令等密码变体）。认证通过将一个或多个因素与有效身份数据库（即用户账户）进行比较，来验证主体的身份。用于验证身份的`认证因子`通常被标记为或被视为私密信息。主体和系统保持身份认证因子机密性的能力，直接反映了该系统的安全级别。如果非法获取并使用目标用户认证因子的过程相对容易，则该认证系统是不安全的。如果该过程相对困难，则该认证系统是合理安全的。\n\
  \n识别和认证通常作为单一的两步过程一起使用。提供身份是第一步，提供认证因子是第二步。如果没有这两者，主体无法获得对系统的访问权——单独任何一个元素在安全方面都没有用处。在某些系统中，可能看起来你只提供了一个元素却获得了访问权，例如输入\
  \ ID 码或 PIN 码时。然而，在这些情况下，识别要么由其他方式处理（如物理位置），要么通过你物理访问系统的能力来假定认证。识别和认证都发生了，但你可能不像手动同时输入用户名和密码时那样清楚地意识到它们。\n\
  \n主体可以提供多种类型的认证——例如，你知道的东西（如密码、PIN）、你拥有的东西（如钥匙、令牌、智能卡）、你本身的东西（如生物特征，例如指纹、虹膜或语音识别）等。每种认证技术或因子都有其独特的优缺点。因此，结合其将要部署的环境来评估每种机制以确定其可行性非常重要。（我们将在第\
  \ 13 章“管理身份和认证”中详细讨论认证。）\n\n##### 授权\n\n一旦主体通过认证，必须对其访问进行授权。授权过程确保根据分配给已认证身份的权利和`特权`，请求的活动或对对象的访问是被允许的。在大多数情况下，系统会评估一个`访问控制矩阵`，该矩阵对主体、对象和预期活动进行比较。如果允许特定操作，则主体被授权。如果不允许特定操作，则主体未被授权。\n\
  \n请记住，主体已被识别和认证，并不意味着他们已被授权在受控环境中执行任何功能或访问所有资源。主体可能已登录到网络（即已识别和认证），但被阻止访问文件或打印到打印机（即未被授权执行该活动）。大多数网络用户仅被授权在特定资源集合上执行有限数量的活动。识别和认证是访问控制的全有或全无方面。授权对于环境中的每个对象都具有从全有到全无的广泛变化范围。用户可能能够读取文件但不能删除它，打印文档但不能更改打印队列，或登录系统但不能访问任何资源。授权通常使用访问控制模型之一定义，如`自主访问控制\
  \ (DAC)`、`强制访问控制 (MAC)` 或 `基于角色的访问控制 (RBAC 或 role-BAC)`；请参阅第 14 章“控制和监控访问”。\n\n\
  ##### 审计\n\n审计或`监控`，是通过程序化手段追踪和记录主体的行为，旨在让主体在系统上认证期间对其行为负责。它也是检测系统上未经授权或异常活动的过程。审计记录主体及其对象的活动，以及维护操作环境和安全机制的核心系统功能的活动。通过将系统事件记录到日志中创建的审计跟踪，可用于评估系统的健康状况和性能。系统崩溃可能表明程序故障、驱动程序损坏或入侵尝试。崩溃前的事件日志通常可用于发现系统故障的原因。日志文件为重现事件、入侵或系统故障的历史提供了审计跟踪。审计对于检测主体的恶意行为、入侵尝试和系统故障，以及重建事件、提供起诉证据、生成问题报告和分析至关重要。审计通常是操作系统和大多数应用程序及服务的原生功能。因此，配置系统以记录特定类型事件的信息相当简单。\n\
  \n##### 问责制\n\n只有保持问责制，组织的安全策略才能得到正确实施。换句话说，只有让主体对其行为负责，才能维护安全。有效的问责制依赖于证明主体身份并追踪其活动的能力。问责制通过安全服务和机制（审计、授权、认证和识别），将人类与在线身份的活动联系起来而建立。因此，人类的问责制最终取决于认证过程的强度。如果没有强有力的认证过程，就无法确定与特定用户账户关联的人类，是否是在发生不良行为时实际控制该用户账户的实体。\n\
  \n要具有可行的问责制，你可能需要能够在法庭上支持你的安全决策及其实施。如果你无法在法律上支持你的安全工作，则不太可能让人类对与用户账户关联的行为负责。仅凭密码作为认证，存在巨大的怀疑空间。密码是最不安全的认证形式，有数十种不同的方法可用来破解它们。然而，通过使用多因素认证，如密码、智能卡和指纹扫描的组合，几乎不存在其他人类能够破坏认证过程以冒充用户账户负责人的可能性。\n\
  \n#### 保护机制\n\n\n\n\n### 理解并应用机密性、完整性和可用性概念：保护机制\n\n理解并应用机密性、完整性和可用性概念的另一个方面是**保护机制**（Protection\
  \ Mechanisms）或**保护控制**（Protection Controls）的概念。保护机制是安全控制的共同特征。并非所有`security controls`都必须具备它们，但许多控制通过使用这些机制来为机密性、完整性和可用性提供保护。一些常见示例包括使用多层或多级访问、采用抽象、隐藏数据以及使用加密。\n\
  \n#### 分层\n\n**分层**（Layering），也称为**纵深防御**（Defense in Depth），简单来说就是串联使用多种控制。没有任何单一控制能防范所有可能的威胁。使用多层解决方案可使众多不同的控制防范可能发生的任何威胁。当安全解决方案采用分层设计时，单个控制的失效不应导致系统或数据暴露。\n\
  \n采用串联而非并联的方式使用层非常重要。以串联方式执行安全限制意味着按线性方式依次执行。只有通过串联配置，每次攻击才会被每个安全控制扫描、评估或缓解。在串联配置中，单个安全控制的失效不会导致整个解决方案失效。如果安全控制以并联方式实施，威胁可能通过单个未针对其特定恶意活动进行防范的检查点。\n\
  \n串联配置非常窄但非常深，而并联配置非常宽但非常浅。并联系统在分布式计算应用中很有用，但并行性在安全领域通常不是一个有用的概念。\n\n请设想建筑物的物理入口。购物中心采用并联配置，在商场整个周边的许多位置设有许多门。银行或机场最可能采用串联配置。仅提供单一入口，而该入口实际上是必须按顺序通过的若干关口或检查点，才能进入建筑物的活动区域。\n\
  \n分层还包含这样一个概念：网络由许多独立实体组成，每个实体都有其自己独特的安全控制和漏洞。在有效的安全解决方案中，所有联网系统之间存在协同效应，从而形成单一的安全前沿。使用独立的安全系统可创建分层安全解决方案。\n\
  \n#### 抽象\n\n**抽象**（Abstraction）用于提高效率。将相似元素放入组、类或角色中，并将安全控制、限制或权限作为一个整体分配给它们。因此，在对对象进行分类或向主体分配角色时，会用到抽象概念。抽象概念还包括对象和主体类型的定义，或对象本身的定义（即用于定义一类实体模板的数据结构）。抽象用于定义对象可包含的数据类型、可在该对象上或由该对象执行的函数类型，以及该对象拥有的能力。抽象通过使您能够将安全控制分配给按类型或功能收集的一组对象，从而简化了安全性。\n\
  \n#### 数据隐藏\n\n**数据隐藏**（Data Hiding）顾名思义，就是通过将数据置于主体无法访问或看不见的逻辑存储区中，防止数据被主体发现或访问。数据隐藏的形式包括：防止未经授权的访问者访问数据库，限制较低分级的主体访问较高分级的数据。阻止应用程序直接访问硬件也是一种数据隐藏形式。数据隐藏通常是安全控制以及编程中的关键要素。\n\
  \n术语**通过隐匿实现安全**（Security through Obscurity）在此处可能看起来相关。然而，该概念是不同的。数据隐藏是有意定位数据，使其对未经授权的主体不可见或不可访问；而通过隐匿实现安全是指不告知主体某对象的存在，从而希望主体不会发现该对象。通过隐匿实现安全并未真正实施任何形式的保护，它只是试图通过保守秘密来希望重要事物不被发现。通过隐匿实现安全的一个例子是：程序员知道其软件代码中存在缺陷，但仍发布产品，希望没人发现并利用该问题。\n\
  \n### 加密\n\n**加密**（Encryption）是向非预期接收者隐藏通信含义或意图的艺术与科学。加密可以采取多种形式，并可应用于每种类型的电子通信，包括文本、音频和视频文件以及应用程序本身。加密是安全控制中的重要元素，特别是在系统间数据传输方面。加密有多种强度，每种强度均为特定用途或目的而设计和/或适用。弱或差的加密可被视为仅是混淆，甚至可能是通过隐匿实现安全。加密将在第\
  \ 6 章“密码学和对称密钥算法”和第 7 章“PKI 和密码学应用”中详细讨论。\n\n### 评估并应用安全治理原则\n\n**安全治理**（Security\
  \ Governance）是与支持、定义和指导组织安全工作相关的实践集合。安全治理原则通常与企业治理和 IT 治理密切相关且交织在一起。这三种治理议程的目标通常相同或相互关联。例如，组织治理的一个共同目标是确保组织持续存在并随时间增长或扩展。因此，治理的共同目标是在追求增长和弹性的同时维持业务流程。\n\
  \n治理的某些方面因立法和法规遵从性需求而被强加给组织，而其他方面则由行业指南或许可要求强加。所有形式的治理（包括安全治理）都必须不时进行评估和验证。由于政府法规或行业最佳实践，可能存在各种审计和验证要求。治理合规问题往往因行业和国家而异。随着许多组织扩展并适应全球市场，治理问题变得更加复杂。当不同国家的法律存在差异甚至冲突时，这尤其成问题。组织作为一个整体，应获得方向、指导和工具，以提供充分的监督和管理，重点消除停机时间，将潜在损失或损害降至最低。\n\
  \n正如您所见，安全治理的定义通常相当生硬且高层。归根结底，安全治理是紧密互联的安全解决方案和管理方法的实施。安全治理直接监督并介入安全的所有层面。安全不应也不能仅被视为\
  \ IT 问题。相反，安全影响组织的各个方面。它不再仅仅是 IT 员工能自行处理的事情。安全是业务运营问题。安全是组织流程，而不仅仅是 IT 极客在幕后做的事。使用“安全治理”一词旨在强调这一观点，即安全需要在整个组织中进行管理和治理，而不仅仅是在\
  \ IT 部门。\n\n\n\n\n\n### 安全治理\n\n安全治理通常由治理委员会或至少由董事会管理。这是一群有影响力的知识专家，其主要任务是监督和指导组织的安全与运营行动。安全是一项复杂的任务。组织通常规模庞大，从单一视角难以全面理解。让一群专家共同朝着可靠安全治理的目标努力，是一项可靠的策略。\n\
  \n存在许多安全框架和治理指南，包括 `NIST 800-53` 或 `NIST 800-100`。虽然 NIST 指南侧重于政府和军事用途，但也可被其他类型的组织采纳和调整。许多组织采用安全框架，旨在标准化和组织可能变得复杂且令人困惑不已的活动，即尝试实施合理的安全治理。\n\
  \n##### 安全职能与业务战略、目标、使命和客观的对齐\n\n安全管理规划确保 `安全策略` 的正确创建、实施和强制执行。安全管理规划将安全职能与组织的战略、目标、使命和客观相对齐。这包括基于业务案例、预算限制或资源稀缺性来设计和实施安全。`业务案例`\
  \ 通常是一种有文档记录的论证或陈述立场，旨在定义需求以做出决策或采取某种形式的行动。制作业务案例是为了证明修改现有流程或选择某种业务任务方法的业务特定需求。业务案例通常用于证明启动新项目（尤其是与安全相关的项目）的合理性。考虑可分配给基于业务需求的安全项目的预算也很重要。安全可能成本高昂，但通常比缺乏安全的成本要低。因此，安全成为可靠且长期业务运营的基本要素。在大多数组织中，资金和资源（如人员、技术和场地）都是有限的。鉴于这些资源限制，需要从任何工作中获得最大收益。\n\
  \n解决安全管理规划最有效的方法之一是采用 `自上而下的方法`。高层或资深管理层负责发起并定义组织的策略。安全策略为组织层级的所有层面提供方向。中层管理层的责任是将安全策略细化为标准、基线、指南和程序。运营管理人员或安全专业人员随后必须实施安全管理文档中规定的配置。最后，最终用户必须遵守组织的所有安全策略。\n\
  \n安全管理是高层管理的责任，而非 IT 员工的责任，被视为业务运营问题而非 IT 管理问题。组织内负责安全的团队或部门应当是自主的。`信息安全团队` 应由指定的首席信息安全官（CISO）领导，且\
  \ CISO 必须直接向高层管理汇报。将 CISO 及其团队的自主权置于组织典型的层级结构之外，可以改善整个组织的安全管理。这也有助于避免跨部门和内部政治问题。`首席安全官（CSO）`\
  \ 一词有时用作 `CISO` 的替代称呼，但在许多组织中，CSO 职位是 CISO 下的从属职位，专注于物理安全。CISO 的另一个潜在术语是 `信息安全官（ISO）`，但这也可能被用作\
  \ CISO 下的从属职位。\n\n安全管理规划的要素包括：定义安全角色；规定安全如何管理、谁负责安全以及如何测试安全有效性；制定安全策略；执行风险分析；以及要求员工接受安全教育。这些工作通过制定管理计划来指导。\n\
  \n最好的安全计划若缺少一个关键因素也将毫无用处：`高层管理的批准`。没有高层管理对安全策略的批准和承诺，该策略将不会成功。策略开发团队有责任对高层管理进行充分教育，使其理解即使部署了策略中规定的安全措施，仍然存在的风险、责任和暴露。制定和实施安全策略是高层管理尽到应有注意义务和应有勤勉义务的证据。如果公司不履行应有注意义务和应有勤勉义务，管理者可能因疏忽被追究责任，并对资产和财务损失负责。\n\
  \n安全管理规划团队应制定三种类型的计划，如 图 1.3 所示。\n\n![图 1.3 战略、战术和操作计划时间线对比](img/c01f003.jpg)\n\n\
  **图 1.3** 战略、战术和操作计划时间线对比\n\n###### 战略计划\n\n`战略计划` 是一项相当稳定的长期计划。它定义了组织的安全目的。它还有助于理解安全职能，并将其与组织的目标、使命和客观相对齐。如果每年维护和更新一次，其有效期约为五年。战略计划也作为规划远景。战略计划中讨论了长期目标和未来愿景。战略计划应包含风险评估。\n\
  \n###### 战术计划\n\n`战术计划` 是一项中短期计划，旨在为战略计划中设定的目标提供更多实现细节，或可根据不可预见的事件临时制定。战术计划通常有效期约为一年，且通常规定并安排实现组织目标所需的任务。战术计划的例子包括项目计划、采购计划、招聘计划、预算计划、维护计划、支持计划和系统开发计划。\n\
  \n###### 操作计划\n\n`操作计划` 是一项基于战略和战术计划的短期、高度详细的计划。其有效或有用时间较短。操作计划必须经常更新（如每月或每季度），以保持与战术计划的合规性。操作计划详细说明如何实现组织的各项目标。它们包括资源分配、预算要求、人员安排、进度安排以及分步或实施程序。操作计划包含实施过程如何符合组织安全策略的细节。操作计划的例子包括培训计划、系统部署计划和产品设计计划。\n\
  \n安全是一个持续的过程。因此，安全管理规划活动可能有一个明确的起点，但其任务和工作永远不会完全完成。有效的安全计划将关注点集中在具体且可实现的目标上，预测变化和潜在问题，并作为整个组织决策的基础。安全文档应具体、定义明确且表述清晰。为了使安全计划有效，必须对其进行开发、维护并实际使用。\n\
  \n##### 组织流程\n\n\n\n\n\n### 安全治理\n\n安全治理需要涵盖组织的各个方面。这包括收购、剥离和治理委员会等组织流程。收购和合并会使组织面临更高水平的风险。此类风险包括不当的信息披露、数据丢失、停机或无法实现足够的投资回报率（ROI）。除了合并和收购中所有典型的业务和财务方面外，适度的安全监督和加强审查往往对于降低此类转型期间发生损失的可能性至关重要。\n\
  \n同样，剥离或任何形式的资产或员工裁减也是风险增加的时期，因此需要更加专注的安全治理。资产需要经过清理以防止数据泄露。存储介质应被移除并销毁，因为介质清理技术无法保证防止数据残留恢复。离职员工需要接受离职简报。此过程通常称为离职面谈。此过程通常涉及审查任何保密协议，以及雇佣关系终止后仍将继续生效的任何其他具有约束力的合同或协议。\n\
  \n对强大的安全治理至关重要的组织流程还有两个例子：变更控制/变更管理和数据分类。\n\n##### 变更控制/管理\n\n安全管理的另一个重要方面是对变更的控制或管理。在安全环境中，变更可能会引入漏洞、重叠、缺失对象和疏忽，从而导致新的脆弱性。面对变更，维持安全的唯一方法是系统地管理变更。这通常涉及与安全控制和机制相关的活动的大量规划、测试、记录、审计和监控。环境变更记录随后被用于识别变更因子，无论这些因子是对象、主体、程序、通信路径，甚至是网络本身。\n\
  \n`变更管理`的目标是确保任何变更都不会导致安全性降低或受损。变更管理还负责使任何变更都能回滚到之前的安全状态。无论安全级别如何，变更管理都可以在任何系统上实施。归根结底，变更管理通过保护已实施的安全免受无意的、间接的或受影响的安全降低，从而提高环境的安全性。虽然变更管理的一个重要目标是防止安全性的意外降低，但其主要目的是使所有变更都接受详细的文档记录和审计，从而能够被管理层审查和监督。\n\
  \n变更管理应用于监督系统各方面的变更，包括硬件配置、操作系统（OS）和应用软件。变更管理应包含在设计、开发、测试、评估、实施、分发、演进、增长、持续运行和修改中。它需要每个组件和配置的详细清单。它还要求收集和维护每个系统组件的完整文档，从硬件到软件，从配置设置到安全功能。\n\
  \n配置管理或变更管理的变更控制流程有若干目标或要求：\n\n*   以受监控且有序的方式实施变更。变更始终受到控制。\n*   包含正式的测试流程，以验证变更是否产生预期结果。\n\
  *   所有变更均可逆转（也称为回退或回滚计划/程序）。\n*   在变更发生前通知用户，以防止生产力损失。\n*   系统地分析变更的影响，以确定安全或业务流程是否受到负面影响。\n\
  *   将变更对能力、功能和性能的负面影响降至最低。\n*   变更由`变更咨询委员会 (CAB)`审查和批准。\n\n变更管理流程的一个例子是并行运行，这是一种新系统部署测试，其中新系统和旧系统并行运行。在每个系统上同时执行每个主要或重要的用户流程，以确保新系统支持旧系统所支持或提供的所有必需业务功能。\n\
  \n### 数据分类\n\n`数据分类`或分级，是根据数据对保密性、敏感性或机密性的需求来保护数据的主要手段。在设计和实施安全系统时，如果对所有数据一视同仁，则效率低下，因为某些数据项需要比其他数据更多的安全保护。以低安全级别保护所有内容意味着敏感数据易于访问。以高安全级别保护所有内容成本过高，且会限制对非机密、非关键数据的访问。数据分类用于确定为保护数据和控制访问而分配多少精力、资金和资源。数据分类或分级，是将项目、对象、主体等按相似性组织成组、类别或集合的过程。这些相似性可能包括价值、成本、敏感度、风险、脆弱性、权限、特权、可能的损失或损害程度，或知情需求。\n\
  \n数据分类方案的主要目标是，根据分配的重要性和敏感度标签，将保护数据的过程正式化和分层化。数据分类用于为数据的存储、处理和传输提供安全机制。它还涉及如何从系统中移除和销毁数据。\n\
  \n使用数据分类方案有以下好处：\n\n*   它证明了组织致力于保护有价值的资源和资产。\n*   它有助于识别对组织最关键或最有价值的资产。\n*   它为选择保护机制提供了依据。\n\
  *   它通常是法规遵从性或法律限制所要求的。\n*   它有助于定义访问级别、授权使用类型，以及不再有价值的资源的解密和/或销毁参数。\n*   它有助于数据生命周期管理，这部分包括数据的存储长度（保留期）、使用和销毁。\n\
  \n数据分类的标准因执行分类的组织而异。然而，您可以从通用或标准化的分类系统中归纳出许多共性：\n\n*   数据的有用性\n*   数据的时效性\n*   数据的价值或成本\n\
  *   数据的成熟度或期限\n*   数据的生命周期（或过期时间）\n*   与人员的关联\n*   数据披露损害评估（即数据披露将如何影响组织）\n*   数据修改损害评估（即数据修改将如何影响组织）\n\
  *   数据的国家安全影响\n*   数据的授权访问（即谁有权访问数据）\n*   数据的访问限制（即谁被限制访问数据）\n*   数据的维护和监控（即谁应维护和监控数据）\n\
  *   数据的存储\n\n使用适合组织的任何标准，对数据进行评估，并分配适当的数据分类标签。在某些情况下，标签会被添加到数据对象上。在其他情况下，当数据被放入存储机制或置于安全保护机制后时，标签会自动生成。\n\
  \n要实施分类方案，必须执行七个主要步骤或阶段：\n\n\n\n\n\n##### 数据分类流程\n\n1.  确定管理员，并定义其职责。\n2.  规定信息分类和标记的评估标准。\n\
  3.  对每个资源进行分类和标记。（所有者执行此步骤，但主管应对其进行审查。）\n4.  记录发现的分类策略例外情况，并将其整合到评估标准中。\n5.  选择将应用于每个分类级别的安全控制，以提供必要的保护级别。\n\
  6.  规定资源解密的程序以及将资源监管权移交给外部实体的程序。\n7.  创建全企业范围的意识培训计划，指导所有人员了解分类系统。\n\n##### 解密\n\
  \n*解密* 在设计分类系统和记录使用程序时常被忽视。一旦资产不再需要其当前分配的分类或敏感度级别所提供的保护，就需要进行解密。换句话说，如果该资产是新的，它将被分配比当前更低的敏感度标签。当资产未能按需解密时，安全资源会被浪费，且更高敏感度级别的价值和保护会降低。\n\
  \n##### 分类方案\n\n常见的分类方案有两种：政府/军事分类（参见图 1.4）和商业/私营部门分类。\n\n![FIGURE 1.4 Levels of\
  \ government/military classification](img/c01f004.jpg)\n\n**图 1.4 政府/军事分类级别**\n\n\
  政府/军事分类共有五个级别（按从高到低顺序列出）：\n\n##### 绝密\n\n**绝密** 是最高分类级别。绝密数据的未经授权披露将产生剧烈影响，并对国家安全造成严重损害。绝密数据基于“需知”原则进行隔离，即用户可能拥有绝密许可，但在有“需知”需求之前无法访问任何数据。\n\
  \n##### 机密\n\n**机密** 用于限制性数据。机密数据的未经授权披露将产生重大影响，并对国家安全造成关键性损害。\n\n##### 秘密\n\n**秘密**\
  \ 用于敏感、专有或高价值数据。秘密数据的未经授权披露将产生明显影响，并对国家安全造成严重损害。此分类用于介于机密与敏感但未分类之间的所有数据。\n\n######\
  \ 敏感但未分类\n\n**敏感但未分类** 用于仅供内部使用或仅限办公室使用的数据。通常用于保护可能侵犯个人隐私权的信息。这在技术上不是分类标签；而是用于指示使用或管理的标记或标签。\n\
  \n###### 未分类\n\n**未分类** 用于既不敏感也不分类的数据。未分类数据的披露不会损害机密性，也不会造成任何明显损害。这在技术上不是分类标签；而是用于指示使用或管理的标记或标签。\n\
  \n标记为秘密、机密和绝密的项目统称为**已分类**数据。通常，向未经授权的个人透露数据的实际分类级别即构成对该数据的违规。因此，术语*已分类*通常用于指代等级高于未分类级别的任何数据。所有已分类数据均豁免于《信息自由法》及许多其他法律法规。美国军事分类方案最关注数据的敏感度，侧重于保护机密性（即防止披露）。大致可以根据违反机密性时造成的损害程度来定义每个分类级别或标签。绝密级数据会对国家安全造成严重损害，而未分类级数据不会对国家或局部安全造成任何严重损害。\n\
  \n商业/私营部门分类系统差异很大，因为它们通常不必遵守标准或法规。CISSP 考试重点关注四种常见或可能的商业分类级别（按从高到低顺序列出，如图 1.5 所示）：\n\
  \n![FIGURE 1.5 Commercial business/private sector classification levels](img/c01f005.jpg)\n\
  \n**图 1.5 商业/私营部门分类级别**\n\n##### 机密\n\n**机密** 是最高分类级别。用于极其敏感且仅限内部使用的数据。如果机密数据泄露，可能对公司造成重大负面影响。有时标签*专有*\
  \ 可替代*机密*。有时专有数据被视为机密信息的一种特定形式。如果专有数据泄露，会对组织的竞争优势产生剧烈影响。\n\n###### 私有\n\n**私有**\
  \ 用于私人或个人性质、仅限内部使用的数据。如果私有数据泄露，可能对公司或个人造成重大负面影响。\n\n##### 敏感\n\n**敏感** 用于比公开数据分类更高的数据。如果敏感数据泄露，可能对公司造成负面影响。\n\
  \n##### 公开\n\n**公开** 是最低分类级别。用于所有不符合更高分类的数据。其披露不会对组织造成严重负面影响。\n\n##### 所有权\n\n与数据分类或分类相关的另一个考量因素是**所有权**。*所有权*\
  \ 是将责任正式分配给个人或群体。所有权可以在操作系统中明确区分，因为文件或其他类型的对象可以被分配所有者。通常，所有者对其拥有的对象拥有完全的能力和特权。获取所有权的能力通常授予操作系统中权限最大的账户，例如\
  \ Windows 中的 `administrator` 或 Unix/Linux 中的 `root`。在大多数情况下，创建新对象的主体默认是该对象的所有者。在某些环境中，安全策略要求创建新对象时，必须将所有权从最终用户正式变更给管理员或管理用户。在这种情况下，管理员账户只需获取新对象的所有权即可。\n\
  \n正式 IT 结构之外的对象所有权通常不那么明显。公司文档可以为设施、业务任务、流程、资产等定义所有者。然而，此类文档并不总能在现实世界中“强制执行”这种所有权。文件对象的所有权由操作系统和文件系统强制执行，而物理对象、无形资产或组织概念（如研究部门或开发项目）的所有权仅在纸面上定义，更容易被破坏。必须实施额外的安全治理，以在物理世界中提供所有权的强制执行。\n\
  \n##### 组织角色与职责\n\n\n\n\n\n#### 安全角色与框架\n\n### 安全角色\n\n`security role`（安全角色）是指个人在组织内部安全实施和管理的整体方案中所扮演的角色。安全角色不一定在职位描述中规定，因为它们并不总是截然不同或静态的。熟悉安全角色将有助于在组织内建立通信和支持结构。该结构将实现安全策略的部署和执行。以下六个角色按其在安全环境中出现的逻辑顺序呈现：\n\
  \n###### 高级管理者\n\n组织所有者（`senior manager`，高级管理者）角色分配给对组织维护的安全负最终责任、且最应关注其资产保护的人员。高级管理者必须对所有策略问题签署批准。事实上，所有活动必须经高级管理者批准并签署后方可执行。如果高级管理者不授权和支持，就不存在有效的安全策略。高级管理者对安全策略的背书表明组织接受所实施安全的所有权。高级管理者是对安全解决方案的整体成败负责的人员，并负责在为组织建立安全时履行应有的注意义务和尽职调查。\n\
  \n尽管高级管理者对安全负最终责任，但他们很少亲自实施安全解决方案。在大多数情况下，该责任委派给组织内的安全专业人员。\n\n###### 安全专业人员\n\n\
  `security professional`（安全专业人员）、`information security (InfoSec) officer`（信息安全官）或\
  \ `computer incident response team (CIRT)`（计算机事件响应小组）角色分配给受过培训且经验丰富的网络、系统和安全工程师，他们负责遵循高级管理层授权的指令。安全专业人员对安全负有职能责任，包括编写安全策略并实施它。安全专业人员的角色可被标记为\
  \ IS/IT 职能角色。安全专业人员角色通常由一个团队担任，负责根据批准的安全策略设计和实施安全解决方案。安全专业人员不是决策者；他们是执行者。所有决策必须留给高级管理者。\n\
  \n#### 数据所有者\n\n`data owner`（数据所有者）角色分配给负责对信息进行分类，以便在安全解决方案中进行放置和保护的人员。数据所有者通常是高层管理人员，对数据保护负最终责任。然而，数据所有者通常将实际数据管理任务的责任委派给数据管理员。\n\
  \n###### 数据管理员\n\n`data custodian`（数据管理员）角色分配给负责实施安全策略和高级管理层规定的保护措施的用户。数据管理员执行所有必要的活动，以充分保护数据的\
  \ CIA 三要素（机密性、完整性和可用性），并履行上级管理层委派的要求和职责。这些活动可以包括执行和测试备份、验证数据完整性、部署安全解决方案以及根据分类管理数据存储。\n\
  \n#### 用户\n\n`user`（用户，`end user` 最终用户或 `operator` 操作员）角色分配给任何有权访问受保护系统的人员。用户的访问权限与其工作任务相关联，并受到限制，使其仅拥有执行其职位所需任务所必需的访问权限（最小权限原则）。用户负责理解并维护组织的安全策略，方法是遵循规定的操作程序并在定义的安全参数内操作。\n\
  \n###### 审计员\n\n`auditor`（审计员）负责审查和验证安全策略是否正确实施，以及衍生的安全解决方案是否充分。审计员角色可分配给安全专业人员或受过培训的用户。审计员生成合规性和有效性报告，由高级管理者审查。通过这些报告发现的问题将转化为由高级管理者分配给安全专业人员或数据管理员的新指令。然而，审计员被列为最后一个角色，因为审计员需要一个活动源头（即在环境中工作的用户或操作员）来进行审计或监控。\n\
  \n所有这些角色在安全环境中都发挥着重要作用。它们对于识别责任和义务，以及识别分层管理和委派方案非常有用。\n\n##### 安全控制框架\n\n为组织制定安全立场通常不仅仅是写下几个崇高的理想。在大多数情况下，制定可靠的安全策略需要大量的规划。许多《呆伯特》漫画的粉丝可能认识“开会计划开会，为未来的开会做准备”这一看似荒诞的概念。但事实证明，安全规划必须从“计划规划”开始，然后转入标准和合规规划，最后进入实际的计划开发和设计。跳过这些“计划规划”中的任何步骤，都可能在组织的安全解决方案启动之前就使其偏离轨道。\n\
  \n最重要的安全规划步骤之一是考虑组织期望的安全解决方案的整体 `security control framework`（安全控制框架）或结构。关于安全概念基础设施，您可以从多个选项中进行选择；然而，更广泛使用的安全控制框架之一是\
  \ **Control Objectives for Information and Related Technology (COBIT，信息及相关技术控制目标)**。COBIT\
  \ 是由 **Information Systems Audit and Control Association (ISACA，信息系统审计与控制协会)** 制定的一套记录在案的\
  \ IT 安全最佳实践。它规定了安全控制的目标和要求，并鼓励将 IT 安全理想映射到业务目标。COBIT 5 基于企业 IT 治理和管理的五大核心原则：\n\n\
  *   **原则 1**：满足利益相关者需求\n*   **原则 2**：覆盖企业端到端\n*   **原则 3**：应用单一集成框架\n*   **原则 4**：实现整体方法\n\
  *   **原则 5**：将治理与管理分离\n\nCOBIT 不仅用于规划组织的 IT 安全，还作为审计员的指南。COBIT 是一个广泛认可和受尊重的安全控制框架。\n\
  \n幸运的是，考试中仅适度引用 COBIT，因此无需了解更多细节。但是，如果您对这一概念感兴趣，请访问 ISACA 网站（[www.isaca.org](http://www.isaca.org)），或者如果您想要一个总体概览，请阅读维基百科上的\
  \ COBIT 条目。\n\n还有许多其他 IT 安全标准和指南。其中一些包括：\n\n*   **开源安全测试方法手册 (OSSTMM)**（[www.isecom.org/research/](http://www.isecom.org/research/)）：一份经过同行评审的指南，用于安全基础设施的测试和分析\n\
  *   **ISO/IEC 27002**（取代了 ISO 17799）（[`www.iso.org/standard/54533.html`](https://www.iso.org/standard/54533.html)）：一项国际标准，可作为实施组织安全和相关管理实践的基础\n\
  *   **信息技术基础设施库 (ITIL)**（[www.itlibrary.org](http://www.itlibrary.org)）：最初由英国政府制定，ITIL\
  \ 是一套核心 IT 安全和运营流程的推荐最佳实践，常被用作定制 IT 安全解决方案的起点\n\n##### 应有的注意义务与尽职调查\n\n\n\n\n\n\
  ### 为什么计划安全如此重要？\n\n其中一个原因是对 `due care`（应有注意）和 `due diligence`（应有勤勉）的要求。`Due care`\
  \ 是指运用合理的注意来保护组织的利益。`Due diligence` 是指执行维持应有注意工作的活动。例如，应有注意是开发一个包含安全策略、标准、基线、指南和程序的正式安全架构。应有勤勉是将这一安全架构持续应用到组织的\
  \ IT 基础设施上。运营安全是组织内所有责任方对应有注意和应有勤勉的持续维护。\n\n在当今的商业环境中，审慎是强制性的。展示应有注意和应有勤勉是发生损失时证明无过失的唯一途径。高级管理层必须展示应有注意和应有勤勉，以在损失发生时降低其责任和法律义务。\n\
  \n### 制定、记录并实施安全策略、标准、程序和指南\n\n对于大多数组织而言，维护安全是持续业务的重要组成部分。如果其安全受到严重威胁，许多组织将面临倒闭。为了降低安全故障的可能性，实施安全的过程已通过文档的层级化组织而某种程度上正式化。每一层级侧重于特定类型或类别的信息和问题。制定并实施文档化的安全策略、标准、程序和指南，可构建可靠坚实的安全基础设施。这种正式化极大地减少了为\
  \ IT 基础设施设计和实施安全解决方案时的混乱与复杂性。\n\n#### 安全策略\n\n正式化的顶层称为安全策略。`security policy`（安全策略）是一份定义组织所需安全范围的文档，论述需要保护的资产，以及安全解决方案为提供必要保护应达到的程度。安全策略是组织安全需求的概览或概括。它定义了主要安全目标，并概述了组织的安全框架。它还确定了数据处理的主要功能领域，并阐明和定义了所有相关术语。它应明确界定安全为何重要以及哪些资产有价值。它是实施安全的战略计划。它应广泛概述为保护组织关键利益而应采用的安全目标和实践。该文档论述了安全对日常业务运营各方面的重要性，以及高级管理层对安全实施的支持的重要性。安全策略用于分配职责、定义角色、指定审计要求、概述执行流程、表明合规要求，并定义可接受的风险级别。该文档常作为高级管理层已履行应有注意义务、保护自身免受入侵、攻击和灾害的证据。安全策略是强制性的。\n\
  \n许多组织采用多种类型的安全策略来定义或概述其整体安全战略。`organizational security policy`（组织安全策略）关注与组织各方面相关的问题。`issue-specific\
  \ security policy`（特定议题安全策略）关注某个特定的网络服务、部门、职能或其他有别于整个组织的方面。`system-specific security\
  \ policy`（特定系统安全策略）关注单个系统或系统类型，规定批准的硬件和软件，概述系统加固方法，甚至强制要求防火墙或其他特定安全控制。\n\n除了这些聚焦类型的安全策略外，还有三大总体类别的安全策略：监管类、建议类和信息类。`regulatory\
  \ policy`（监管策略）在行业或法律标准适用于您的组织时是必需的。该策略论述必须遵守的法规，并概述用于实现合规的程序。`advisory policy`（建议策略）论述可接受的行为和活动，并定义违规后果。它解释了高级管理层对组织内安全与合规的期望。大多数策略属于建议类。`informative\
  \ policy`（信息策略）旨在提供关于特定主题的信息或知识，例如公司目标、使命宣言，或组织如何与合作伙伴和客户互动。信息策略提供与整体策略特定要素相关的支持、研究或背景信息。\n\
  \n从安全策略中衍生出许多其他文档或子要素，这些是完整安全解决方案所必需的。策略是宽泛的概览，而标准、基线、指南和程序则包含关于实际安全解决方案更具体、更详细的信息。标准是安全策略的下一层级。\n\
  \n#### 安全标准、基线和指南\n\n一旦确定了主要安全策略，其余安全文档即可在策略指导下编写。`Standards`（标准）定义了硬件、软件、技术和安全控制统一使用的强制性要求。它们提供了一种行动方针，使技术和程序在整个组织中统一实施。标准是战术文档，定义了为实现安全策略所定目标和总体方向而采取的步骤或方法。\n\
  \n下一层级是基线。`baseline`（基线）定义了组织内每个系统必须达到的最低安全级别。所有不符合基线的系统应停止投入生产，直到其达到基线要求。基线建立了一个通用的基础安全状态，所有额外的、更严格的安全措施均可在此基础上构建。基线通常针对特定系统，且常参考行业或政府标准，如可信计算机系统评价标准（TCSEC）、信息技术安全评估标准（ITSEC）或美国国家标准与技术研究院（NIST）标准。\n\
  \n指南是正式化安全策略结构的下一个要素。`guideline`（指南）提供关于如何实施标准和基线的建议，并作为安全专业人员和用户的操作指南。指南具有灵活性，可针对每个独特的系统或条件进行定制，并可用于创建新程序。它们陈述应部署哪些安全机制，而非规定特定产品或控制及详细配置设置。它们概述方法论，包含建议行动，且非强制性。\n\
  \n#### 安全程序\n\n程序是正式化安全策略结构的最后要素。`procedure`（程序）或 `standard operating procedure\
  \ (SOP)`（标准操作程序）是一份详细的分步操作指南文档，描述实施特定安全机制、控制或解决方案所需的确切行动。程序可以论述整个系统部署操作，也可以聚焦于单个产品或方面，例如部署防火墙或更新病毒定义。在大多数情况下，程序针对特定系统和软件。随着系统软硬件的演进，程序必须更新。程序的目的是确保业务流程的完整性。如果所有工作都遵循详细程序执行，则所有活动应符合策略、标准和指南。程序有助于确保所有系统安全的标准化。\n\
  \n\n\n\n很多时候，策略、标准、基线、指南和程序仅仅是在顾问或审计师的敦促下作为事后诸葛亮般的产物被制定出来的。如果这些文档不被使用和更新，安全环境的管理将无法将它们作为指南。如果没有这些文档提供的规划、设计、结构和监督，任何环境都无法保持安全，也无法体现应有的尽职调查。\n\
  \n将所有这些要素的各个方面整合到单个文档中也是常见的做法。这应该避免。这些结构中的每一个都必须作为一个独立的实体存在，因为每一个都执行不同的专门功能。在正式安全策略文档结构的顶层，文档较少，因为它们包含对概览和目标的宏观概括讨论。在正式结构的较低层（即指南和程序）有更多的文档，因为它们包含针对有限数量的系统、网络、部门和领域的具体细节。\n\
  \n将这些文档作为独立实体保存可带来多项优势：\n\n*   并非所有用户都需要知道所有安全分级层面的安全标准、基线、指南和程序。\n*   当变更发生时，仅更新和重新分发受影响的材料，比更新整体庞大的策略并将其在整个组织中重新分发要容易得多。\n\
  \n编写安全策略的全部内容及所有支持文档可能是一项艰巨的任务。许多组织光是定义其安全的基础参数就已捉襟见肘，更别提详述其日常活动的每一个方面。然而，理论上，详细且完整的安全策略能以指导性、高效且具体的方式支持现实世界的安全。一旦安全策略文档合理完善，它就可用于指导决策、培训新用户、响应问题，并预测未来扩展的趋势。安全策略不应是事后诸葛亮，而应是建立组织的关键部分。\n\
  \n关于构成完整安全策略的文档，还有几个额外的视角需要理解。图 1.6 展示了这些组件的依赖关系：策略、标准、指南和程序。安全策略定义了有组织的安全文档的整体结构。然后，标准基于这些策略，同时也由法规和合同强制要求。由此衍生出指南。最后，程序基于其他三个组件。倒金字塔用于表示这些文档各自的体量或规模。在一个完整的安全策略中，程序的数量通常远多于任何其他要素。相比之下，指南比程序少，标准比指南更少，而全局性或组织级的安全策略通常最少。\n\
  \n![图 1.6 安全策略组件的比较关系](img/c01f006.jpg)\n\n**图 1.6** 安全策略组件的比较关系\n\n#### 理解并应用威胁建模概念和方法论\n\
  \n威胁建模是识别、分类和分析潜在威胁的安全过程。`威胁建模` 可在设计和开发阶段作为主动措施执行，也可在产品部署后作为被动措施执行。无论哪种情况，该过程都会识别潜在危害、发生概率、关注优先级，以及消除或降低威胁的手段。本节将介绍各种威胁建模概念示例以及几种威胁建模方法论。\n\
  \n威胁建模不应是一次性事件。相反，组织通常在系统设计过程早期就开始威胁建模，并贯穿其整个生命周期。例如，微软使用 `安全开发生命周期 (SDL)` 流程，在产品开发的每个阶段考虑并实施安全。这支持“设计安全、默认安全、部署和通信安全”（也称为\
  \ `SD3+C`）的座右铭。该流程有两个目标：\n\n*   减少与安全相关的设计和编码缺陷数量\n*   降低任何剩余缺陷的严重程度\n\n换句话说，它试图减少漏洞，并降低任何残留漏洞的影响。总体结果是风险降低。\n\
  \n`主动方法` 威胁建模发生在系统开发的早期阶段，具体是在初始设计和规格建立期间。这种类型的威胁建模也称为防御性方法。该方法基于预测威胁并在编码和构建过程中设计特定防御，而不是依赖部署后的更新和补丁。在大多数情况下，集成的安全解决方案比事后强行塞入的解决方案更具成本效益且更成功。不幸的是，并非所有威胁都能在设计阶段预测到，因此仍需要被动方法威胁建模来解决不可预见的问题。\n\
  \n`被动方法` 威胁建模发生在产品创建并部署之后。这种部署可能是在测试或实验室环境中，也可能面向大众市场。这种类型的威胁建模也称为对抗性方法。这种威胁建模技术是道德黑客、渗透测试、源代码审查和模糊测试的核心概念。虽然这些过程在发现需要解决的缺陷和威胁方面通常很有用，但它们不幸的是会导致额外的编码工作来添加新的对策。回归设计阶段从长远来看可能会产生更好的产品，但从头开始的成本极高，且会导致产品发布显著延迟。因此，捷径是在部署后制作更新或补丁添加到产品中。这导致安全改进效果较差（相对于主动威胁建模），代价是潜在的功能性和用户友好度降低。\n\
  \n##### 识别威胁\n\n威胁的可能性几乎是无限的，因此使用结构化方法准确识别相关威胁非常重要。例如，一些组织使用以下三种方法中的一种或多种：\n\n**聚焦资产**\
  \ 此方法利用资产估值结果，尝试识别针对有价值资产的威胁。例如，可评估特定资产以确定其是否易受攻击。如果资产托管数据，可评估访问控制以识别可绕过身份验证或授权机制的威胁。\n\
  \n**聚焦攻击者** 某些组织能够识别潜在攻击者，并根据攻击者的目标识别其代表的威胁。例如，政府通常能够识别潜在攻击者并认识到攻击者想要实现的目标。然后，他们可以利用这些知识来识别和保护其相关资产。这种方法的一个挑战是，可能会出现以前不被视为威胁的新攻击者。\n\
  \n**聚焦软件** 如果组织开发软件，它可以考虑针对软件的潜在威胁。虽然多年前组织不常开发自己的软件，但如今这很常见。具体来说，大多数组织都有网络业务，许多组织创建自己的网页。花哨的网页能带来更多流量，但也需要更复杂的编程，并带来额外的威胁。\n\
  \n\n\n\n### 威胁建模\n\n如果威胁被识别为攻击者（而非自然威胁），威胁建模会尝试识别攻击者可能试图完成的目标。某些攻击者可能想要使系统瘫痪，而其他攻击者可能想要窃取数据。一旦识别出此类威胁，就会根据其目标或动机对其进行分类。此外，将威胁与漏洞配对以识别可利用漏洞并对组织构成重大风险的威胁也是一种常见做法。威胁建模的最终目标是针对组织的宝贵资产对潜在威胁进行优先级排序。\n\
  \n在尝试清点和分类威胁时，使用指南或参考通常很有帮助。微软开发了一种称为 `STRIDE` 威胁模型的威胁分类方案。`STRIDE` 常用于评估针对应用程序或操作系统的威胁。不过，它也可用于其他场景。`STRIDE`\
  \ 是以下单词的首字母缩写：\n\n#### 欺骗\n\n一种旨在通过使用伪造身份获取对目标系统访问权限的攻击。欺骗可用于互联网协议（`IP`）地址、`MAC`\
  \ 地址、用户名、系统名称、无线网络服务集标识符（`SSIDs`）、电子邮件地址以及许多其他类型的逻辑标识。当攻击者将其身份伪装成有效或授权实体时，往往能够绕过针对未授权访问的过滤器和封锁。一旦欺骗攻击成功授予攻击者对目标系统的访问权限，后续的滥用、数据窃取或权限提升攻击就可以发起。\n\
  \n#### 篡改\n\n导致数据（无论是在传输中还是在存储中）发生未授权更改或操纵的任何行为。篡改用于伪造通信或更改静态信息。此类攻击违反了完整性以及可用性。\n\
  \n#### 抵赖\n\n用户或攻击者否认执行过某项动作或活动的能力。攻击者通常实施抵赖攻击，以保持合理的否认性，从而不为其行为负责。抵赖攻击还可能导致无辜的第三方被归咎于安全违规。\n\
  \n#### 信息泄露\n\n向外部或未授权实体透露或分发私密、机密或受控信息。这可能包括客户身份信息、财务信息或专有业务运营细节。信息泄露可能利用系统设计和实现错误，例如：未能移除调试代码、保留示例应用程序和账户、未从客户可见内容中清理编程注释（如超文本标记语言（`HTML`）文档中的注释）、使用隐藏表单字段，或允许向用户显示过于详细的错误消息。\n\
  \n#### 拒绝服务\n\n一种试图阻止授权使用资源的攻击。这可以通过漏洞利用、连接过载或流量泛洪来实现。`DoS` 攻击不一定会导致资源完全中断；它可能会降低吞吐量或引入延迟，从而阻碍资源的生产性使用。虽然大多数\
  \ `DoS` 攻击是暂时的，仅持续攻击者维持攻击的时间，但也存在一些永久性的 `DoS` 攻击。永久性 `DoS` 攻击可能涉及数据集的销毁、将软件替换为恶意替代品，或强制执行可能被中断或安装错误固件的固件刷新操作。这些\
  \ `DoS` 攻击中的任何一种都会导致系统永久损坏，无法通过简单重启或等待攻击者停止来恢复正常操作。恢复需要进行完整的系统修复和备份还原。\n\n#### 权限提升\n\
  \n一种将受限用户账户转变为拥有更高权限、权力和访问权限的账户的攻击。这可能通过窃取或利用更高级别账户（如管理员或 root 账户）的凭证来实现。也可能通过系统或应用程序漏洞利用来实现，该漏洞暂时或永久地授予原本受限账户额外的权力。\n\
  \n尽管 `STRIDE` 通常用于关注应用程序威胁，但它也适用于其他情况，例如网络威胁和主机威胁。其他攻击可能更具体地针对网络和主机问题，例如网络的嗅探和劫持，以及主机的恶意软件和任意代码执行，但\
  \ `STRIDE` 的六个威胁概念具有相当广泛的适用性。\n\n#### 攻击模拟与威胁分析流程\n\n`攻击模拟与威胁分析流程（PASTA）` 是一种七阶段（图\
  \ 1.7）威胁建模方法论。`PASTA` 是一种以风险为中心的方法，旨在根据待保护资产的价值选择或开发对策。以下是 `PASTA` 的七个步骤：\n\n* \
  \  **第一阶段**：风险分析的目标定义（`DO`）\n*   **第二阶段**：技术范围定义（`DTS`）\n*   **第三阶段**：应用分解与分析（`ADA`）\n\
  *   **第四阶段**：威胁分析（`TA`）\n*   **第五阶段**：弱点与漏洞分析（`WVA`）\n*   **第六阶段**：攻击建模与模拟（`AMS`）\n\
  *   **第七阶段**：风险分析与管理（`RAM`）\n\n`PASTA` 的每个阶段都有具体的目标清单和交付成果，必须完成这些才能完成该阶段。有关 `PASTA`\
  \ 的更多信息，请参阅 Tony UcedaVelez 和 Marco M. Morana 合著的《以风险为中心的威胁建模：攻击模拟与威胁分析流程》第一版。（您可以在线查看该书的附录，其中探讨了\
  \ `PASTA`，网址为 <http://www.isaca.org/chapters5/Ireland/Documents/2013%20Presentations/PASTA%20Methodology%20Appendix%20-%20November%202013.pdf>。）\n\
  \n#### Trike\n\n`Trike` 是另一种威胁建模方法论，它专注于基于风险的方法，而不依赖于 `STRIDE` 和灾害、可重现性、可利用性、受影响用户、可发现性（`DREAD`）（请参阅本章后面的“优先级与响应”部分）中使用的聚合威胁模型。`Trike`\
  \ 提供了一种以可靠且可重复的程序执行安全审计的方法。它还为安全人员之间的沟通和协作提供了一个一致的框架。`Trike` 用于为每类资产制定可接受的风险水平评估，随后用于确定适当的风险响应行动。\n\
  \n![图 1.7 揭示威胁关注点的绘图示例](img/c01f007.jpg)\n\n**图 1.7** 揭示威胁关注点的绘图示例\n\n#### 可视化、敏捷与简单威胁\n\
  \n`可视化、敏捷与简单威胁（VAST）` 是一种基于敏捷项目管理和编程原则的威胁建模概念。`VAST` 的目标是以可扩展的方式将威胁和风险管理集成到敏捷编程环境中。\n\
  \n这些只是社区团体、商业实体、政府机构和国际协会提供的大量威胁建模概念和方法论中的一小部分。\n\n一般来说，`STRIDE` 和其他威胁建模方法论的目的是考虑妥协担忧的范围，并关注攻击的目标或最终结果。试图识别每一种具体的攻击方法和技术是不可能完成的任务——新的攻击不断被开发出来。尽管攻击的目标或目的可以被大致分类和归类，但它们随时间推移保持相对恒定。\n\
  \n\n\n\n### 您的企业面临的潜在威胁\n\n企业面临的潜在威胁广泛且多样。公司面临来自自然、技术和人的威胁。大多数企业在应对威胁的准备工作中侧重于自然灾害和\
  \ IT 攻击，但也必须考虑来自个人的威胁潜力。始终要考虑组织活动、决策和交互可能导致的最佳和最坏结果。识别威胁是设计防御措施以帮助减少或消除停机、妥协和损失的第一步。\n\
  \n#### 确定并绘制潜在攻击图\n\n一旦了解了面临的开发项目或已部署基础设施的威胁，威胁建模的下一步就是确定可能实现的潜在攻击概念。这通常通过创建事务涉及元素的图表来完成，图表需标明数据流和权限边界（图\
  \ 1.8）。该图示是一个数据流图示例，展示了系统的每个主要组件、安全区域之间的边界，以及信息和数据的潜在流向或移动。通过为每个环境或系统绘制此类图表，可以更仔细地检查每个可能发生妥协的点点。\n\
  \n此类数据流图有助于通过可视化表示，更好地理解资源关系和数据移动。该绘图过程也称为制作架构图。创建图表有助于详述业务任务、开发流程或工作活动中每个元素的功能和用途。重要的是要包含用户、处理器、应用程序、数据存储以及执行特定任务或操作所需的所有其他基本元素。这是一个高层概览，而非对编码逻辑的详细评估。然而，对于更复杂的系统，可能需要在不同关注点和不同详细程度上创建多个图表。\n\
  \n![图 1.8 通过绘图揭示威胁关注点的示例](img/c01f008.jpg)\n\n**图 1.8** 通过绘图揭示威胁关注点的示例\n\n绘制完图表后，识别其中涉及的所有技术。这包括操作系统、应用程序（网络服务和基于客户端的）以及协议。务必具体说明正在使用的版本号和更新/补丁级别。\n\
  \n接下来，识别可能针对图表中每个元素的攻击。请记住要考虑所有形式的攻击，包括逻辑/技术、物理和社会工程。例如，务必包含欺骗、篡改和社会工程学。此过程将迅速引导您进入威胁建模的下一阶段：缩减分析。\n\
  \n#### 执行缩减分析\n\n威胁建模的下一步是执行缩减分析。**缩减分析**也称为对应用程序、系统或环境的**分解**。此任务的目的是更深入地了解产品的逻辑及其与外部元素的交互。无论是应用程序、系统还是整个环境，都需要将其划分为更小的容器或隔间。如果您关注软件，这些可能是子程序、模块或对象；如果关注系统或网络，这些可能是协议；如果关注整个业务基础设施，这些可能是部门、任务和网络。应评估每个已识别的子元素，以了解输入、处理、安全性、数据管理、存储和输出。\n\
  \n在分解过程中，您必须识别五个关键概念：\n\n**信任边界** 信任级别或安全级别发生变化的任何位置\n\n**数据流路径** 数据在不同位置之间的移动\n\
  \n**输入点** 接收外部输入的位置\n\n**特权操作** 任何需要比标准用户账户或进程更高权限的活动，通常用于进行系统更改或更改安全设置\n\n**关于安全态势和方法的详细信息**\
  \ 安全策略、安全基础和安全假设的声明\n\n将系统分解为其组成部分，使识别每个元素的基本组件以及发现漏洞和攻击点变得容易得多。您越了解程序、系统或环境的确切运行方式，就越容易识别对其的威胁。\n\
  \n#### 优先级排序与响应\n\n随着威胁建模过程识别出威胁，规定了其他活动以完善该过程。接下来是全面记录威胁。在该文档中，您应定义威胁的手段、目标和后果。考虑包含实施利用所需的技术，以及列出潜在的对策和防护措施。\n\
  \n记录文档后，对威胁进行排序或评级。这可以通过多种技术来完成，例如概率 × 损害潜力排序、高/中/低评级或 DREAD 系统。\n\n概率 × 损害潜力排序技术在\
  \ 1 到 100 的范围内生成一个风险严重性数字，其中 100 代表最严重的风险。这两个初始值均可分配 1 到 10 之间的数字，1 为最低，10 为最高。这些排序在一定程度上可能是任意和主观的，但由于同一人或团队将为其自己的组织分配数字，因此在相对基础上仍应产生准确的评估值。\n\
  \n高/中/低评级过程甚至更简单。每个威胁被分配这三个优先级标签之一。被赋予高优先级标签的威胁需要立即处理。被赋予中优先级标签的威胁最终应予以处理，但不需要立即采取行动。被赋予低优先级的威胁可能会被处理，但如果与整个项目相比，它们需要付出太多努力或费用，则可被视为可选项。\n\
  \n**DREAD** 评级系统旨在提供一个灵活的评级解决方案，该方案基于针对每个威胁的五个主要问题的答案：\n\n*   **损害潜力**：如果威胁成为现实，损害可能有多严重？\n\
  *   **可重现性**：攻击者重现利用有多复杂？\n*   **可利用性**：执行攻击有多难？\n*   **受影响用户**：可能有多少用户受到攻击影响（百分比）？\n\
  *   **可发现性**：攻击者发现弱点有多难？\n\n通过提出这些问题以及潜在的其他定制问题，并为答案分配 H/M/L 或 3/2/1 值，您可以建立详细的威胁优先级排序。\n\
  \n一旦设定了威胁优先级，就需要确定针对这些威胁的响应。应考虑修复威胁的技术和流程，并根据其成本和有效性进行权衡。响应选项应包括调整软件架构、改变操作和流程，以及实施防御和检测组件。\n\
  \n#### 将基于风险的管理概念应用于供应链\n\n\n\n\n\n### 将基于风险的管理应用于供应链\n\n将基于风险的管理概念应用于供应链，是确保各种规模组织拥有更稳健、更成功的安全策略的一种手段。**供应链**的概念在于：大多数计算机、设备、网络和系统并非由单一实体构建。事实上，我们熟知的大多数计算机和设备制造商，如戴尔、思科、Extreme\
  \ Networks、瞻博网络、华硕、宏碁和苹果，通常只执行最终组装，而非制造所有单个组件。通常，CPU、内存、驱动控制器、硬盘、固态硬盘和显卡是由其他第三方供应商制造的。即使是这些大宗商品供应商，也不太可能开采自己的金属、加工用于塑料的石油或蚀刻芯片的硅。因此，任何成品系统都有一段漫长而复杂的历史，即其**供应链**，正是这段历史使其得以诞生。\n\
  \n#### 安全供应链\n\n安全供应链是指链条中的所有供应商或环节均为可靠、值得信赖、声誉良好的组织，它们向业务合作伙伴披露其做法和安全要求（尽管不一定向公众披露）。链条中的每个环节都对下一个环节负责且可被追责。从原材料到精炼产品、电子零件、计算机组件，再到成品的每一次交接，都经过妥善组织、记录、管理和审计。安全供应链的目标是确保成品质量达标、满足性能和运营目标、提供既定安全机制，并且在整个过程中没有任何元素被伪造，或遭受未经授权或恶意的篡改或破坏。要了解关于供应链风险的更多观点，请查看\
  \ NIST 案例研究，网址为 <https://www.nist.gov/sites/default/files/documents/itl/csd/NIST_USRP-Boeing-Exostar-Case-Study.pdf>。\n\
  \n#### 收购风险\n\n如果在未考虑安全因素的情况下进行收购和合并，这些产品固有的风险将贯穿其整个部署生命周期。最大程度减少所获资产中的固有威胁，将降低安全管理成本，并有望减少安全违规事件。\n\
  \n评估与硬件、软件和服务相关的风险非常重要。具有弹性集成安全性的产品和解决方案，通常比缺乏安全基础的产品更昂贵。然而，与在设计不良的产品生命周期内解决安全需求相比，这笔额外的初始支出通常是一项更具成本效益的投资。因此，在考虑合并/收购成本时，重要的是考虑产品部署生命周期内的总拥有成本，而不仅仅是初始采购和实施成本。\n\
  \n收购不仅限于硬件和软件。外包、与供应商签约以及聘请顾问也是收购的要素。在与外部实体合作时整合安全评估，与确保产品在设计时就考虑到安全同等重要。\n\n####\
  \ 持续安全监控\n\n在许多情况下，可能需要持续的安全监控、管理和评估。这可能是行业最佳实践，也可能是法规要求。此类评估和监控可以由组织内部执行，也可能需要聘请外部审计师。在聘请第三方评估和监控服务时，请记住，外部实体需要在其业务运营中表现出安全意识。如果一个外部组织无法在安全基础上管理其自身的内部运营，他们如何能为您提供可靠的安全管理职能？\n\
  \n#### 评估第三方\n\n在评估第三方以进行安全整合时，请考虑以下流程：\n\n##### 现场评估\n访问该组织的现场，面谈人员并观察其操作习惯。\n\n\
  ##### 文档交换与审查\n调查数据集和文档的交换方式，以及它们执行评估和审查的正式流程。\n\n##### 流程/策略审查\n索取其安全策略、流程/程序以及事件记录和响应文档的副本以供审查。\n\
  \n#### 第三方审计\n聘请独立的第三方审计师（由美国注册会计师协会 [AICPA] 定义），可以基于服务组织控制 (SOC) 报告，对实体的安全基础设施提供无偏见的审查。证明业务准则声明\
  \ (SSAE) 是一项规定，定义了服务组织如何使用各种 SOC 报告报告其合规性。2011 年 6 月 15 日生效的 SSAE 16 版本已于 2017 年\
  \ 5 月 1 日被 SSAE 18 取代。SOC1 和 SOC2 审计框架值得为安全评估目的而考虑。SOC1 审计侧重于安全机制的描述，以评估其适用性。SOC2\
  \ 审计侧重于已实施的安全控制，涉及可用性、安全性、完整性、隐私和保密性。有关 SOC 审计的更多信息，请参阅 <https://www.aicpa.org/interestareas/frc/assuranceadvisoryservices/socguidesandpublications.html>。\n\
  \n#### 最低安全要求\n\n对于所有收购，建立最低安全要求。这些要求应以您现有的安全策略为蓝本。新硬件、软件或服务的安全要求应始终满足或超过现有基础设施的安全性。在使用外部服务时，请务必审查任何**服务级别协议\
  \ (SLA)**，以确保安全是合同服务的规定组成部分。这可能包括针对您特定需求的服务级别要求定制。\n\n#### 资源\n\n以下是一些与收购相结合的安全相关的优秀资源：\n\
  \n*   通过收购改善网络安全和弹性。美国国防部和总务管理局最终报告，2013 年 11 月发布 (<http://www.gsa.gov/portal/getMediaData?mediaId=185371>)\n\
  *   NIST 特别出版物 800-64 修订版 2：系统开发生命周期中的安全考虑 (<http://csrc.nist.gov/publications/nistpubs/800-64-Rev2/SP800-64-Revision2.pdf>)\n\
  \n### 摘要\n\n安全治理、管理概念和原则是安全策略和解决方案部署中固有的要素。它们定义了安全环境所需的基本参数。它们还定义了策略设计者和系统实施者必须实现的目标和目的，以创建安全解决方案。\n\
  \n安全的主要目标和目的包含在 CIA 三要素中：机密性、完整性和可用性。这三项原则被认为是安全领域中最重要的。它们对组织的重要性取决于组织的安全目标和要求，以及其环境中存在多大的安全威胁。\n\
  \nCIA 三要素中的第一项原则是机密性，即对象不向未授权主体披露的原则。提供机密性的安全机制，能高度保证数据、对象或资源不暴露给未授权主体。如果存在针对机密性的威胁，就存在未经授权披露的可能性。\n\
  \n\n\n\n\n### CIA 三要素原则\n\n#### 完整性\n\nCIA 三要素中的第二个原则是**完整性**，即对象保持其真实性，且仅由授权主体有意修改的原则。提供完整性的安全机制能高度保证数据、对象和资源未从其原始受保护状态被篡改。这包括对象在存储、传输或处理过程中发生的篡改。维护完整性意味着对象本身未被篡改，且管理和操作该对象的操作系统和编程实体未被攻破。\n\
  \n#### 可用性\n\nCIA 三要素中的第三个原则是**可用性**，即授权主体被授予及时且不间断的对象访问权的原则。提供可用性的安全机制能高度保证数据、对象和资源可被授权主体访问。可用性包括对对象的高效不间断访问以及防止拒绝服务攻击。它还意味着支持基础设施功能正常，并允许授权用户获得授权访问。\n\
  \n### 其他安全概念\n\n设计安全策略和部署安全解决方案时，应考虑并解决其他与安全相关的概念和原则，包括**隐私**、**标识**、**认证**、**授权**、**审计追踪**、**不可否认性**和**审计**。\n\
  \n安全解决方案概念和原则的其他方面是保护机制的要素：**分层**、**抽象**、**数据隐藏**和**加密**。这些是安全控制的常见特征，虽然并非所有安全控制都必须具备它们，但许多控制利用这些机制来保护机密性、完整性和可用性。\n\
  \n### 安全角色\n\n安全角色决定了谁对组织资产的安全负责。\n\n- **高级管理层**：对任何资产损失承担最终责任和法律责任；定义安全策略。\n- **安全专业人员**：负责实施安全策略。\n\
  - **用户**：负责遵守安全策略。\n- **数据所有者**：负责对信息进行分类。\n- **数据管理员**：负责维护安全环境和备份数据。\n- **审计员**：负责确保安全环境妥善保护资产。\n\
  \n### 安全策略结构\n\n正式的安全策略结构由**策略**、**标准**、**基线**、**指南**和**程序**组成。这些单独的文档是任何环境中安全设计和实施的基本要素。\n\
  \n### 变更管理\n\n变更的控制或管理是安全管理实践的一个重要方面。当安全环境发生变更时，漏洞、重叠、缺失对象和疏忽可能导致新的漏洞。然而，您可以通过系统地管理变更来维护安全。这通常涉及与安全控制和安全机制相关的活动的大量日志记录、审计和监控。生成的数据随后用于识别变更因素，无论是对象、主体、程序、通信路径，甚至是网络本身。\n\
  \n### 数据分类\n\n数据分类是根据数据的机密性、敏感性或保密性来保护数据的主要手段。因为某些数据项比其他数据项需要更多的安全性，所以在设计和实施安全系统时，将所有数据同等对待是低效的。如果所有内容都在低安全级别下受到保护，敏感数据很容易被访问；但如果所有内容都在高安全级别下受到保护，成本太高且会限制对非机密、非关键数据的访问。数据分类用于确定分配多少精力、资金和资源来保护数据并控制对其的访问。\n\
  \n### 安全管理规划\n\n安全管理规划的一个重要方面是安全策略的正确实施。要有效，安全管理的方法必须是**自上而下的方法**。\n\n- **高级管理层**：负责发起和定义安全策略。\n\
  - **中层管理层**：将安全策略细化为标准、基线、指南和程序。\n- **运营管理者/安全专业人员**：实施安全管理文档中规定的配置。\n- **最终用户**：遵守组织的所有安全策略。\n\
  \n安全管理规划包括定义安全角色、制定安全策略、执行风险分析，并要求员工接受安全教育。这些职责由管理计划的发展指导。安全管理团队应制定**战略**、**战术**和**操作计划**。\n\
  \n### 威胁建模\n\n**威胁建模**是识别、分类和分析潜在威胁的安全过程。威胁建模可以在设计和开发期间作为主动措施执行，也可以在产品部署后作为被动措施执行。无论哪种情况，该过程都会识别潜在危害、发生概率、关注优先级，以及消除或减轻威胁的手段。\n\
  \n### 供应链集成\n\n将网络安全风险管理与供应链、采购策略和业务实践相结合，是确保各种规模组织拥有更强大、更成功的安全策略的一种途径。如果在采购时不考虑安全因素，这些产品固有的风险将贯穿其整个部署生命周期。\n\
  \n### 考试要点\n\n#### 理解 CIA 三要素\n\n**机密性**：对象不向未授权主体披露的原则。\n**完整性**：对象保持其真实性，且仅由授权主体有意修改的原则。\n\
  **可用性**：授权主体被授予及时且不间断的对象访问权的原则。\n\n了解这些为何重要、支持它们的机制、针对每一项的攻击以及有效的对策。\n\n#### 解释标识\n\
  \n**标识**是主体声称身份并启动问责制的过程。主体必须向系统提供身份，以启动认证、授权和问责的过程。\n\n#### 理解认证\n\n**认证**是验证或测试所声称身份是否有效的过程。认证要求主体提供的信息必须与所指示的身份完全对应。\n\
  \n#### 了解授权\n\n主体经过认证后，必须对其访问进行授权。**授权**过程确保根据分配给已认证身份的权利和特权，请求的活动或对象访问是可行的。\n\n\
  #### 理解安全治理\n\n**安全治理**是与支持、定义和指导组织安全工作相关的实践集合。\n\n#### 解释审计\n\n**审计**（或监控）是主体在系统上认证期间对其行为负责的程序化手段。审计也是检测系统上未授权或异常活动的过程。审计对于检测主体的恶意行为、入侵尝试和系统故障、重建事件、为起诉提供证据以及生成问题报告和分析至关重要。\n\
  \n\n\n\n\n#### 理解问责制的重要性\n\n只有保持问责制，组织的安全策略才能得到正确实施。换句话说，只有对主体的行为进行问责，才能维护安全。有效的问责依赖于证明主体身份并追踪其活动的能力。\n\
  \n#### 能够解释不可抵赖性\n\n不可抵赖性确保活动或事件的主体无法否认该事件的发生。它防止主体声称未发送消息、未执行某项操作，或不是导致某事件的原因。\n\
  \n#### 理解安全管理规划\n\n安全管理基于三类计划：战略、战术和操作。战略计划是一项相当稳定的长期计划。它定义了组织的目标、使命和目的。战术计划是一项中短期计划，旨在为完成战略计划中设定的目标提供更多细节。操作计划是基于战略和战术计划的短期、高度详细的计划。\n\
  \n#### 掌握正式安全策略结构的要素\n\n要制定全面的安全计划，需要具备以下要素：安全策略、标准、基线、指南和程序。此类文档明确陈述了安全要求，并使相关责任方履行应尽的注意义务。\n\
  \n#### 理解关键安全角色\n\n主要安全角色包括高级经理、组织所有者、高层管理人员、安全专业人员、用户、数据所有者、数据管理员和审计员。通过建立安全角色层级，可以从总体上限制风险。\n\
  \n#### 掌握如何实施安全意识培训\n\n在实际培训开始之前，必须先为用户建立对安全作为一个公认实体的意识。一旦完成这一点，培训——即教授员工执行其工作任务并遵守安全策略——便可以开始。所有新员工都需要一定程度的培训，以便他们能够遵守安全策略强制规定的所有标准、指南和程序。教育是一项更详细的工作，学生/用户学到的知识远超其执行工作任务所需。教育通常与追求认证或寻求晋升的用户相关联。\n\
  \n#### 理解分层如何简化安全\n\n分层是指串联使用多种控制措施。采用多层解决方案可使众多控制措施协同防御威胁。\n\n#### 能够解释抽象的概念\n\n\
  抽象用于将相似元素收集到组、类或角色中，并将安全控制、限制或权限作为一个整体分配给它们。它提高了执行安全计划的效率。\n\n#### 理解数据隐藏\n\n数据隐藏正如其名：防止数据被主体发现或访问。它通常是安全控制以及编程中的关键要素。\n\
  \n#### 理解加密的必要性\n\n加密是隐藏通信含义或意图、使非预期接收者无法理解的艺术与科学。它可以采取多种形式，并应用于各类电子通信，包括文本、音频和视频文件，以及程序本身。加密是安全控制中的重要要素，特别是在系统间数据传输方面。\n\
  \n#### 能够解释变更控制和变更管理的概念\n\n安全环境中的变更可能引入漏洞、重叠、缺失对象和疏忽，从而导致新的脆弱性。面对变更，维护安全的唯一途径是系统地管理变更。\n\
  \n#### 了解为何以及如何对数据进行分类\n\n对数据进行分类是为了简化将安全控制分配给对象组而非单个对象的过程。两种常见的分类方案是政府/军事分类和商业/私营部门分类。了解政府/军事分类的五个级别和商业/私营部门分类的四个级别。\n\
  \n#### 理解解密的重要性\n\n一旦资产不再需要其当前分配的分类或敏感级别所提供的保护，就需要进行解密。\n\n#### 掌握 COBIT 基础知识\n\n\
  信息及相关技术控制目标（COBIT）是一种安全概念基础设施，用于组织公司复杂的安全解决方案。\n\n#### 掌握威胁建模基础知识\n\n威胁建模是识别、分类和分析潜在威胁的安全过程。威胁建模可在设计和开发阶段作为主动措施执行，也可在产品部署后作为被动措施执行。关键概念包括资产/攻击者/软件、STRIDE、PASTA、Trike、VAST、绘图、简化/分解以及\
  \ DREAD。\n\n#### 理解将基于风险的管理概念应用于供应链的必要性\n\n将基于风险的管理概念应用于供应链，是确保各种规模组织拥有更稳健、更成功的安全策略的一种手段。如果在采购和收购时未考虑安全因素，这些产品固有的风险将贯穿其整个部署生命周期。\n\
