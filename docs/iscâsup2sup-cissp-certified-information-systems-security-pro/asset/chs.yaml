  \n## 第 9 章：安全漏洞、威胁和对策\n\n**本章涵盖的 CISSP 考试主题包括：**\n\n*   **领域 3：安全架构与工程**\n    *\
  \   3.5 评估并缓解安全架构、设计和解决方案要素的漏洞\n        *   3.5.1 基于客户端的系统\n        *   3.5.2 基于服务器的系统\n\
  \        *   3.5.3 数据库系统\n        *   3.5.5 工业控制系统 (ICS)\n        *   3.5.6 基于云的系统\n\
  \        *   3.5.7 分布式系统\n        *   3.5.8 物联网\n    *   3.6 评估并缓解基于 Web 系统的漏洞\n\
  \    *   3.7 评估并缓解移动系统的漏洞\n    *   3.8 评估并缓解嵌入式设备的漏洞\n\n\n\n\n\n![images](img/clogo.jpg)\n\
  \n在本书前几章中，我们介绍了基本安全原则以及为防止违反这些原则而设立的保护机制。我们还研究了恶意人员为绕过这些保护机制而采用的特定攻击类型。直到现在，在讨论预防措施时，我们主要关注策略措施和在系统上运行的软件。然而，安全专业人员还必须密切关注系统本身，确保其高层保护控制不是建立在动摇的基础之上。毕竟，如果运行防火墙的计算机存在根本性安全缺陷，允许恶意人员完全绕过防火墙，那么世界上最安全的防火墙配置也毫无用处。\n\
  \n在本章中，我们将通过简要探讨*计算机体系结构*这一领域来涵盖这些底层安全顾虑：即计算机由各种组件构成的物理设计。我们将从安全角度审视计算系统的每个主要物理组件——硬件和固件。显然，由于资源和时间限制，对系统硬件组件的详细分析并非总是可行。然而，所有安全专业人员至少应对这些概念有基本的了解，以防遇到涉及系统设计层面的安全事件。\n\
  \n安全工程领域涉及广泛的关注点和问题，包括安全设计要素、安全架构、漏洞、威胁及相关对策。该领域的其他要素分别在不同章节中讨论：第 6 章“密码学和对称密钥算法”，第\
  \ 7 章“PKI 和密码学应用”，第 8 章“安全模型、设计和能力原则”，以及第 10 章“物理安全要求”。请务必复习所有这些章节，以获得对该领域主题的完整视角。\n\
  \n### 评估和缓解安全漏洞\n\n*计算机体系结构*是一门工程学科，关注计算系统在逻辑层面的设计与构建。许多大学级别的计算机工程和计算机科学专业发现，在一个学期内涵盖计算机体系结构的所有基本原则颇具挑战，因此这些内容通常被分为两门一学期的本科课程。计算机体系结构课程深入探讨`中央处理单元\
  \ (CPU)`组件、存储设备、设备通信及类似主题在比特层面的设计，为构成简单“0 或 1”决策的单个逻辑设备定义处理路径。大多数安全专业人员不需要这种深度的知识，这远超出了本书和\
  \ CISSP 考试的范围。然而，如果你将参与计算系统在此层面的设计安全工作，建议你对该领域进行更深入的研究。\n\n最初对计算机体系结构的讨论乍看之下似乎与\
  \ CISSP 无关，但大多数安全架构和设计要素都建立在对计算机硬件的扎实理解和实现之上。\n\n#### 硬件\n\n任何计算专业人员都熟悉硬件的概念。正如建筑行业一样，硬件是构成计算机的物理“东西”。术语*硬件*涵盖了计算机中你能实际伸手触摸到的任何有形部分，从键盘和显示器到其`CPU`、存储介质和内存芯片。请仔细注意，虽然存储设备（如硬盘或闪存）的物理部分可被视为硬件，但这些设备的内容——构成其中存储的软件和数据的\
  \ 0 和 1 的集合——则不属于硬件。毕竟，你无法伸手进计算机内部抓出一把比特和字节！\n\n##### 处理器\n\n*中央处理单元 (CPU)*，通常称为*处理器或微处理器*，是计算机的神经中枢——它是管理所有主要操作并直接执行或协调复杂计算交响乐的芯片（或多处理器系统中的多个芯片），使计算机能够执行其预期任务。令人惊讶的是，尽管\
  \ CPU 让计算机能够执行复杂的任务，但它本身只能执行有限的计算和逻辑操作集。将用于设计软件的高级编程语言翻译成 CPU 能理解的简单汇编语言指令，是操作系统和编译器的责任。这种有限的功能范围是有意为之——它使\
  \ CPU 能够以极快的速度执行计算和逻辑操作。\n\n###### 执行类型\n\n随着计算机处理能力的提升，用户要求更高级的功能，以使这些系统能以更快的速度处理信息并同时管理多个功能。计算机工程师设计了多种方法来满足这些需求：\n\
  \n**多任务处理** 在计算中，*多任务处理*意味着同时处理两个或更多任务。过去，大多数系统并不真正支持多任务处理，因为它们依赖操作系统通过精心安排发送给 CPU\
  \ 执行的命令序列来模拟多任务处理。当处理器以多吉赫兹的速度运行时，很难察觉它是在任务间切换，而不是同时处理两个任务。单核多任务系统能够在任何给定时间同时处理多个任务或进程。\n\
  \n**多核** 如今，大多数 CPU 都是多核的。这意味着过去单个的 CPU 或微处理器芯片，现在变成了一个包含两个、四个、八个，甚至潜在数十个独立执行核心的芯片，这些核心可以同时运行。\n\
  \n**多处理** 在*多处理*环境中，多处理器计算系统（即拥有多个 CPU 的系统）利用多个处理器的力量来完成多线程应用程序的执行。例如，数据库服务器可能运行在一个包含四个、六个或更多处理器的系统上。如果数据库应用程序同时接收多个独立查询，它可能会将每个查询发送给单独的处理器执行。\n\
  \n现代多 CPU 系统中最常见的两种多处理类型是：刚才描述的场景，即单台计算机包含多个地位平等、由单一操作系统控制的处理器，称为*对称多处理 (SMP)*。在\
  \ SMP 中，处理器不仅共享一个公共操作系统，还共享公共数据总线和内存资源。在这种安排中，系统可能使用大量处理器。幸运的是，这种计算能力足以驱动大多数系统。\n\
  \n\n\n\n### 处理类型\n\n许多高安全系统控制分配给不同安全级别的信息处理，例如美国政府分配给与国防相关的信息的非密、敏感、机密、秘密和绝密等分类级别。计算机的设计必须使其不会——理想情况下是不能——无意中向未授权接收者泄露信息。\n\
  \n计算机架构师和安全策略管理员已在处理器级别通过两种不同方式解决此问题。一种是通过策略机制，另一种是通过硬件解决方案。以下列表探讨了这两种选项：\n\n####\
  \ 单态系统\n\n**单态系统**需要使用策略机制来管理不同级别的信息。在这种安排中，安全管理员批准处理器和系统一次仅处理一个安全级别。例如，系统可能被标记为仅处理秘密信息。该系统的所有用户必须经过批准才能处理秘密级别的信息。这将保护系统上处理的信息的负担从硬件和操作系统转移到了控制系统访问的管理员身上。\n\
  \n#### 多态系统\n\n**多态系统**能够实现更高级别的安全。这些系统通过使用专用安全机制（如下一节“保护机制”中所述）获得认证，可同时处理多个安全级别。这些机制旨在防止信息在安全级别之间跨越。一位用户可能正在使用多态系统处理秘密信息，而另一位用户同时在处理绝密信息。技术机制防止信息在两个用户之间跨越，从而防止其在安全级别之间跨越。\n\
  \n在实际应用中，多态系统相对少见，因为实施必要技术机制的成本较高。然而，当您处理非常昂贵的资源（如大规模并行系统）时，这种费用有时是合理的；获取多个系统的成本远超在单个此类系统上实施启用多态操作所需的额外安全控制的成本。\n\
  \n#### 保护机制\n\n\n\n如果计算机未运行，它只是一块惰性的塑料、硅和金属，什么也不做。当计算机运行时，它会操作一个运行时环境，该环境代表操作系统以及可能处于活动状态的任何应用程序的组合。运行时，计算机还具备访问文件和其他数据的能力，前提是用户的安全权限允许。在该运行时环境中，必须集成安全信息和控制，以保护操作系统本身的完整性，管理允许哪些用户访问特定数据项，授权或拒绝针对这些数据的操作请求，等等。运行中的计算机在运行时实现和处理安全的方式，可以广泛地描述为一组保护机制的集合。以下将描述各种保护机制，如保护环、操作状态和安全模式。\n\
  \n#### 保护环\n\n环保护方案由来已久但依然有效。它可以追溯到 Multics 操作系统的研究工作。这个实验性操作系统于 1963 年至 1969 年间由贝尔实验室、麻省理工学院和通用电气公司合作设计和构建。它在霍尼韦尔的实现中得到了商业应用。Multics\
  \ 在计算界留下了两大不朽遗产。首先，它激发了一个更简单、结构更清晰的操作系统 Unix（谐音 *multics*）的诞生；其次，它将保护环的概念引入了操作系统设计。\n\
  \n从安全角度来看，**保护环** 将操作系统中的代码和组件（以及在操作系统控制下运行的应用程序、实用程序或其他代码）组织成同心环，如 图 9.1 所示。越靠近圆心，占据特定环的代码所关联的特权级别越高。虽然最初的\
  \ Multics 实现允许多达七个环（编号 0 到 6），但大多数现代操作系统使用四环模型（编号 0 到 3）。\n\n作为最内层的环，环 0 拥有最高特权，基本上可以访问任何资源、文件或内存位置。操作系统中始终驻留在内存中的部分（以便随时按需运行）称为\
  \ **内核**。它占据环 0，并可以抢占在任何其他环运行的代码。操作系统的其余部分——随着各种任务被请求、操作被执行、进程被切换等而来去不定——占据环 1。环\
  \ 2 也具有一定特权，I/O 驱动程序和系统实用程序驻留于此；它们能够访问外围设备、特殊文件等，而应用程序和其他程序无法直接访问这些资源。那些应用程序和程序占据最外层的环，即环\
  \ 3。\n\n![图 9.1 在常用的四环模型中，保护环将操作系统隔离为环 0 到 2 中的内核、组件和驱动程序，而应用程序和程序在环 3 运行。](img/c09f001.jpg)\n\
  \n**图 9.1** 在常用的四环模型中，保护环将操作系统隔离为环 0 到 2 中的内核、组件和驱动程序，而应用程序和程序在环 3 运行。\n\n环模型的本质在于优先级、特权和内存分段。任何想要执行的进程都必须排队（待处理进程队列）。关联环号最低的进程总是比关联较高编号环的进程先运行。较低编号环中的进程可以访问更多资源，并比较高编号环中的进程更直接地与操作系统交互。运行在较高编号环中的进程通常必须向较低编号环中的处理程序或驱动程序请求所需服务；这有时称为\
  \ **中介访问模型**。在其最严格的实现中，每个环都有其关联的内存段。因此，来自较高编号环的进程对较低编号环中地址的任何请求，都必须调用与该地址关联的环中的辅助进程。在实践中，许多现代操作系统仅将内存分为两个段：一个用于系统级访问（环\
  \ 0 到 2），通常称为 **内核模式** 或 **特权模式**；另一个用于用户级程序和应用程序（环 3），通常称为 **用户模式**。\n\n从安全角度来看，环模型使操作系统能够保护并隔离自己，防止用户和应用程序的侵害。它还允许在高度特权的操作系统组件（如内核）和较低特权的操作系统部分（如操作系统的其他部分、驱动程序和实用程序）之间强制执行严格的边界。在此模型中，仅在特定环内才能直接访问特定资源；同样，某些操作（如进程切换、终止和调度）也仅允许在特定环内进行。\n\
  \n进程所占据的环决定了其对系统资源的访问级别（并决定了它必须从较低编号、更高特权的环中的进程请求哪些类型的资源）。进程只有在资源驻留在其自己的环内，或驻留在其当前边界之外的某个环内（按数字术语，例如，环\
  \ 1 的进程可以直接访问其自己的资源，以及与环 2 和 3 关联的资源，但无法访问仅与环 0 关联的资源）时，才能直接访问对象。实现中介访问的机制——即前面提到的驱动程序或处理程序请求——通常称为\
  \ **系统调用**，通常涉及调用特定的系统或编程接口，旨在将请求传递给内层环以获取服务。然而，在任何此类请求得到满足之前，被调用的环必须检查以确保调用进程拥有正确的凭据和授权，以访问数据并执行满足请求所涉及的操作。\n\
  \n### 进程状态\n\n也称为 **操作状态**，**进程状态** 是进程可能运行的各种执行形式。就操作系统而言，在任何给定时刻，它可以处于两种模式之一：在称为\
  \ **管理员状态** 的特权全访问模式下运行，或在称为 **问题状态** 的用户模式下运行，在该模式下特权较低，所有访问请求在被授予或拒绝前都必须根据凭据进行授权检查。之所以称后者为问题状态，并非因为问题一定会发生，而是因为用户访问的非特权性质意味着问题可能发生，系统必须采取适当措施来保护安全性、完整性和机密性。\n\
  \n进程在操作系统的处理队列中排队等待执行，当处理器可用时，它们将被调度运行。由于许多操作系统仅允许进程以固定增量或块消耗处理器时间，当创建新进程时，它首次进入处理队列；如果进程在未完成的情况下消耗了其整个处理时间块（称为\
  \ **时间片**），它将在下一次轮到它时返回处理队列以获取另一个时间片。此外，进程调度程序通常选择最高优先级的进程执行，因此排到队首并不总能保证获得 CPU\
  \ 访问权（因为进程可能在最后一刻被另一个优先级更高的进程抢占）。\n\n根据进程是否正在运行，它可以在以下几种状态之一中运行：\n\n\n\n### 进程状态\n\
  \n#### Ready\n在**就绪状态**下，进程已准备好在被调度执行后立即恢复或开始处理。如果进程到达此状态时 CPU 可用，它将直接转入运行状态；否则，它将停留在就绪状态直到轮到它。这意味着进程拥有立即开始执行所需的所有内存和其他资源。\n\
  \n#### Waiting\n**等待状态**也可以理解为“等待资源”——即进程已准备好继续执行，但正在等待设备或访问请求（某种中断）得到服务后才能继续处理（例如，请求从文件读取记录的数据库应用程序必须等待该文件被定位、打开，并找到正确的记录集）。某些参考资料将此状态标记为阻塞状态，因为进程可被认为因外部事件未发生而无法继续执行。\n\
  \n#### Running\n运行中的进程在 CPU 上执行，并持续运行直到完成、时间片用尽，或因某些原因被阻塞（通常是因为它产生了一个访问设备或网络的中断，并正在等待该中断得到服务）。如果时间片结束而进程未完成，它将返回就绪状态（和队列）；如果进程因等待资源可用而阻塞，它将进入等待状态（和队列）。\n\
  \n#### Supervisory\n当进程必须执行需要高于问题状态特权集的操作时，将使用**监管状态**，包括修改系统配置、安装设备驱动程序或修改安全设置。基本上，任何不在用户模式（Ring\
  \ 3）或问题状态下发生的功能都在监管模式下进行。\n\n#### Stopped\n当进程完成或必须终止（因错误发生、所需资源不可用或资源请求无法满足）时，它将进入**停止状态**。此时，操作系统可以回收分配给该进程的所有内存和其他资源，并根据需要将其重用于其他进程。\n\
  \n图 9.2 展示了这些各种状态如何相互关联的示意图。新进程总是转入就绪状态。从那里，就绪进程总是转入运行状态。在运行时，进程可以转入停止状态（如果完成或被终止）、返回就绪状态以获取另一个时间片，或转入等待状态直到其挂起的资源请求得到满足。当操作系统决定下一个运行哪个进程时，它会检查等待队列和就绪队列，并选取优先级最高的、准备好运行的作业（因此只有那些挂起请求已被服务、或已准备好被服务的等待作业才有资格参与考量）。内核的一个特殊部分，称为*程序执行体*或*进程调度器*，始终驻留在内存中（等待中），以便在必须发生进程状态转换时，能介入并处理相关机制。\n\
  \n![图 9.2 进程调度器](img/c09f002.jpg)\n\n**图 9.2** 进程调度器\n\n在图 9.2 中，进程调度器管理处于就绪和等待状态、等待执行的进程，并决定运行中的进程在转入另一状态（就绪、等待或停止）时会发生什么。\n\
  \n### 安全模式\n\n美国政府为处理机密信息的系统指定了四种批准的**安全模式**。下文将进行描述。在第 1 章“通过原则和策略进行安全治理”中，我们回顾了联邦政府使用的分类系统以及安全许可和访问批准的概念。此语境下唯一的新术语是*need\
  \ to know*（需知原则），它指的是一种访问授权方案，其中主体访问客体的权利不仅考虑特权级别，还考虑涉及数据与主体所扮演角色（或执行的工作）的相关性。这表明主体需要访问该客体以正确执行其工作或履行某特定角色。没有需知权的人不得访问该客体，无论其持有何种特权级别。如果您需要复习这些概念，请在继续之前回顾第\
  \ 1 章。在部署安全模式本身之前，必须存在三个特定要素：\n\n*   分层强制访问控制（MAC）环境\n*   对可访问计算机控制台的主体的完全物理控制\n\
  *   对可进入计算机控制台所在房间的主体的完全物理控制\n\n#### Dedicated Mode\n**专用模式**系统基本等同于本章前面“处理类型”部分所述的单状态系统。专用系统的用户有三项要求：\n\
  \n*   每个用户必须具有允许访问系统处理的所有信息的安全许可。\n*   每个用户必须具有对系统处理的所有信息的访问批准。\n*   每个用户必须对系统处理的所有信息具有有效的需知权。\n\
  \n#### System High Mode\n**系统高模式**系统的用户必须满足略有不同的要求：\n\n*   每个用户必须具有允许访问系统处理的所有信息的有效安全许可。\n\
  *   每个用户必须具有对系统处理的所有信息的访问批准。\n*   每个用户必须对系统处理的*某些*信息具有有效的需知权，但不一定是*所有*信息。\n\n请注意，专用模式和系统高模式的主要区别在于：系统高模式计算设备上的所有用户不一定对系统处理的所有信息都有需知权。因此，虽然同一用户可以同时访问专用模式系统和系统高模式系统，但该用户可以访问前者的所有数据，却可能被限制访问后者的某些数据。\n\
  \n#### Compartmented Mode\n**分区模式**系统进一步放宽了这些要求：\n\n*   每个用户必须具有允许访问系统处理的所有信息的有效安全许可。\n\
  *   每个用户必须具有对其将在系统上访问的任何信息的访问批准。\n*   每个用户必须对其将在系统上访问的所有信息具有有效的需知权。\n\n请注意，分区模式系统与系统高模式系统的主要区别在于：分区模式系统的用户不一定具有对系统上所有信息的访问批准。然而，与系统高模式和专用系统一样，系统的所有用户仍必须具有适当的安全许可。在一种称为**分区模式工作站（CMW）**的特殊实现中，具有必要许可的用户可以同时处理多个分区的数据。\n\
  \nCMW 要求在对象上放置两种形式的安全标签：敏感度级别和信息标签。敏感度级别描述对象必须受保护的级别。这些在所有四种模式中通用。信息标签防止数据过度分类，并将附加信息与对象关联，这有助于进行不涉及访问控制的正确、准确的数据标记。\n\
  \n#### Multilevel Mode\n政府对**多级模式**系统的定义与前一节给出的技术定义基本平行。然而，为保持一致性，我们将用许可、访问批准和需知权来表述它：\n\
  \n\n\n\n##### 安全模式要求\n\n*   部分用户没有有效的安全许可来访问系统处理的所有信息。因此，访问控制取决于主体的许可级别是否主导客体的敏感度标签。\n\
  *   每个用户必须拥有其将在系统上访问的所有信息的访问批准。\n*   每个用户必须拥有其将在系统上访问的所有信息的有效“知悉必要性”。\n\n当你浏览联邦政府批准的各种操作模式的要求时，你会注意到，随着从专用系统过渡到多级系统，控制访问系统的用户类型的管理要求会减少。然而，这并不降低限制个人访问的重要性，以便用户只能获取他们合法有权访问的信息。正如上一节所讨论的，这只是将执行这些要求的负担从行政人员（他们物理上限制对计算机的访问）转移到硬件和软件（它们控制多用户系统中每个用户可以访问的信息）的问题。\n\
  \n表 9.1 根据所需的安全许可、“知悉必要性”以及处理来自多个许可级别数据的能力（简写为 PDMCL）总结并比较了这四种安全模式。在比较所有四种安全模式时，通常认为多级模式面临最高级别的风险。\n\
  \n**表 9.1** **安全模式比较**\n\n| 模式 | 许可 | 知悉必要性 | PDMCL |\n| --- | --- | --- | --- |\n\
  | 专用 | 相同 | 无 | 无 |\n| 系统高 | 相同 | 是 | 无 |\n| 分区 | 相同 | 是 | 是 |\n| 多级 | 不同 | 是 |\
  \ 是 |\n\n如果所有用户必须具有相同的安全许可，则许可为**相同**；否则为**不同**。\n\n如果“知悉必要性”不适用且未被使用，或者虽然被使用但所有用户都有知悉系统上所有数据的必要性，则为**无**；如果访问受“知悉必要性”限制，则为**是**。\n\
  \n如果使用了 CMW 实现，则适用 PDMCL（**是**）；否则 PDMCL 为**无**。\n\n##### 操作模式\n\n现代处理器和操作系统旨在支持多用户环境，在这种环境中，单个计算机用户可能不会被授予访问系统所有组件或存储在其中的所有信息的权限。因此，处理器本身支持两种操作模式：用户模式和特权模式。\n\
  \n###### 用户模式\n\n**用户模式** *用户模式*是 CPU 在执行用户应用程序时使用的基本模式。在此模式下，CPU 仅允许执行其完整指令集的一部分。这旨在防止用户因执行设计不良的代码或无意中误用代码而意外损坏系统。它还可以保护系统及其数据免受恶意用户的侵害，后者可能会尝试执行旨在绕过操作系统安全措施的指令，或错误地执行可能导致未经授权的访问或对系统或有价值的信息资产造成损害的操作。\n\
  \n通常，用户模式下的进程在称为*虚拟机 (VM)* 的受控环境中执行。虚拟机是由操作系统创建的模拟环境，为程序执行提供安全高效的场所。每个 VM 都与所有其他\
  \ VM 隔离，并且每个 VM 都有自己的分配内存地址空间，可供托管的应用程序使用。特权模式（又称内核模式）中的元素负责创建和支持 VM，并防止一个 VM 中的进程干扰其他\
  \ VM 中的进程。\n\n###### 特权模式\n\n**特权模式** CPU 还支持*特权模式*，旨在授予操作系统访问 CPU 支持的完整指令范围的权限。此模式有多种名称，具体术语因\
  \ CPU 制造商而异。一些更常见的名称包括在以下列表中：\n\n*   特权模式\n*   监督模式\n*   系统模式\n*   内核模式\n\n无论使用哪个术语，基本概念保持不变——此模式授予在\
  \ CPU 上执行的进程广泛的权限。因此，设计良好的操作系统不允许任何用户应用程序在特权模式下执行。出于安全性和系统完整性的目的，只有操作系统本身的组件进程才被允许在此模式下执行。\n\
  \n#### 内存\n\n系统的第二个主要硬件组件是*内存*，即计算机需要保持随时可用的信息的存储库。有许多不同种类的内存，每种都适用于不同的目的，我们将在后续章节中逐一介绍。\n\
  \n##### 只读存储器\n\n*只读存储器 (ROM)* 顾名思义——它是 PC 可以读取但无法更改的内存（不允许写入）。标准 ROM 芯片的内容在出厂时被“烧录”进去，最终用户根本无法更改。ROM\
  \ 芯片通常包含计算机在从磁盘加载操作系统之前启动时使用的“引导”信息。这包括熟悉的*加电自检 (POST)* 诊断系列，每次启动 PC 时都会运行。\n\n\
  ROM 的主要优势在于它无法被修改。用户或管理员错误绝无可能意外擦除或修改此类芯片的内容。这一属性使 ROM 成为协调计算机最内部工作原理的极佳选择。\n\n\
  有一种 ROM 管理员可以在一定程度上修改。它称为可编程只读存储器 (PROM)，其几种子类型将在下文描述：\n\n###### 可编程只读存储器 (PROM)\n\
  \n**可编程只读存储器 (PROM)** 基本的*可编程只读存储器 (PROM)* 芯片在功能上类似于 ROM 芯片，但有一个例外。在制造过程中，PROM 芯片的内容不像标准\
  \ ROM 芯片那样在工厂被“烧录”。相反，PROM 结合了特殊功能，允许最终用户稍后烧录芯片的内容。然而，烧录过程有着类似的结果——一旦数据被写入 PROM\
  \ 芯片，就无法进行进一步更改。烧录后，PROM 芯片基本上就像 ROM 芯片一样运行。\n\nPROM 芯片为软件开发人员提供了在高速、定制化内存芯片上永久存储信息的机会。PROM\
  \ 常用于需要某些自定义功能但一旦编程后很少更改的硬件应用中。\n\n###### 可擦除可编程只读存储器 (EPROM)\n\n**可擦除可编程只读存储器 (EPROM)**\
  \ 将 PROM 芯片相对较高的成本与软件开发人员编写代码后不可避免地想要修改代码的愿望相结合，便得出了开发*可擦除 PROM (EPROM)* 的基本原理。EPROM\
  \ 有两个主要子类别，即 UVEPROM 和 EEPROM（见下一项）。*紫外线 EPROM (UVEPROM)* 可以用光擦除。这些芯片有一个小窗口，当用特殊的紫外线照射时，会导致芯片内容被擦除。此过程完成后，最终用户可以将新信息烧录到\
  \ UVEPROM 中，就像它从未被编程过一样。\n\n###### 电可擦除可编程只读存储器 (EEPROM)\n\n**电可擦除可编程只读存储器 (EEPROM)**\
  \ 一种比 UVEPROM 更灵活、更友好的替代方案是*电可擦除 PROM (EEPROM)*，它利用传送到芯片引脚的电压来强制擦除。\n\n\n\n\n\n\
  ### 闪存\n\n**闪存** 是 EEPROM 的衍生概念。它是一种非易失性存储介质，可以被电子擦除和重写。EEPROM 和闪存的主要区别在于，EEPROM\
  \ 必须完全擦除才能重写，而闪存可以以块或页为单位进行擦除和写入。最常见的闪存类型是 NAND 闪存。它广泛应用于存储卡、U 盘、移动设备和 SSD（固态硬盘）。\n\
  \n#### 随机存取存储器\n\n**随机存取存储器 (RAM)** 是可读可写的内存，包含计算机在处理过程中使用的信息。只有在持续供电的情况下，RAM 才能保留其内容。与\
  \ ROM 不同，当计算机断电时，存储在 RAM 中的所有数据都会消失。因此，RAM 仅适用于临时存储。关键数据绝不应仅存储在 RAM 中；应始终在另一存储设备上保留备份副本，以防止因突然断电导致数据丢失。以下是\
  \ RAM 的类型：\n\n##### 实存\n\n**实存**（也称为**主存**或**主存储器**）通常是计算机可用的最大 RAM 存储资源。它通常由若干动态\
  \ RAM 芯片组成，因此必须由 CPU 定期刷新（有关更多信息，请参阅侧边栏“动态 RAM 与静态 RAM”）。\n\n##### 高速缓存 RAM\n\n\
  计算机系统包含许多缓存，当数据可能被重复使用时，它们通过从较慢的设备获取数据并暂时存储在较快的设备中来提高性能；这就是**高速缓存 RAM**。处理器通常包含一个板载极高速内存缓存，用于存放其将要操作的数据。这可以称为\
  \ L1、L2、L3 甚至 L4 缓存（L 代表 level，即级别）。许多现代 CPU 包含多达三级片上缓存，其中一些缓存（通常是 L1 和/或 L2）专用于单个处理器核心，而\
  \ L3 可能是核心间共享的缓存。某些 CPU 可能涉及 L4 缓存，它可能位于主板上或 GPU（图形处理单元）上。同样，实存通常也包含存储在磁性介质或 SSD\
  \ 上的信息的缓存。这一链条沿着内存/存储层级向下延伸，使计算机能够通过将可能接下来要用到的数据保存在更近的地方（无论是用于 CPU 指令、数据获取、文件访问还是其他用途）来提高性能。\n\
  \n许多外设也包含板载缓存，以减轻它们给 CPU 和操作系统带来的存储负担。例如，许多高端打印机包含大容量 RAM 缓存，以便操作系统能快速将整个打印作业脱机输出到打印机。之后，处理器就可以不再理会该打印作业；它无需等待打印机实际生成请求的输出、一次次地喂给它数据块。打印机可以从其板载缓存预处理信息，从而释放\
  \ CPU 和操作系统去处理其他任务。许多存储设备，如硬盘驱动器 (HDD)、固态驱动器 (SSD) 和某些 U 盘，都包含缓存以帮助提高读写速度。然而，在断开连接或断电之前，这些缓存必须刷新到永久或辅助存储区，以避免驻留在缓存中的数据丢失。\n\
  \n#### 寄存器\n\nCPU 还包含少量板载内存，称为**寄存器**，它们为 CPU 提供直接可访问的内存位置，CPU 的大脑——**算术逻辑单元 (ALU)**——在执行计算或处理指令时会使用这些位置。事实上，除非数据作为指令的一部分直接提供，否则\
  \ ALU 要操作的任何数据都必须加载到寄存器中。这种内存的主要优势在于它是 ALU 本身的一部分，因此以典型的 CPU 速度与 CPU 同步运行。\n\n####\
  \ 内存寻址\n\n在使用内存资源时，处理器必须有某种方法来引用内存中的各个位置。解决此问题的方法称为**寻址**，根据不同情况会使用多种不同的寻址方案。以下是五种较常见的寻址方案：\n\
  \n##### 寄存器寻址\n\n正如您在上一节所学，寄存器是 CPU 中直接的小内存位置。当 CPU 需要从其寄存器之一获取信息以完成操作时，它使用**寄存器地址**（例如，“寄存器\
  \ 1”）来访问其内容。\n\n##### 立即寻址\n\n**立即寻址** 本身并非一种内存寻址方案，而是一种将作为指令一部分提供给 CPU 的数据的引用方式。例如，CPU\
  \ 可能会处理“将 2 加到寄存器 1 中的值”这一命令。该命令使用了两种寻址方案。第一种是立即寻址——CPU 被告知要加上值 2，不需要从内存位置检索该值——它作为命令的一部分被提供。第二种是寄存器寻址；它被指示从寄存器\
  \ 1 检索值。\n\n##### 直接寻址\n\n在**直接寻址**中，CPU 获得要访问的内存位置的实际地址。该地址必须位于与正在执行的指令相同的内存页上。直接寻址比立即寻址更灵活，因为内存位置的内容比立即寻址的硬编码数据更容易修改。\n\
  \n##### 间接寻址\n\n**间接寻址** 使用的方案类似于直接寻址。然而，作为指令一部分提供给 CPU 的内存地址不包含 CPU 要用作操作数的实际值。相反，该内存地址包含另一个内存地址（可能位于不同的页上）。CPU\
  \ 读取间接地址以得知所需数据所在的地址，然后从该地址检索实际的操作数。\n\n##### 基址+偏移量寻址\n\n**基址+偏移量寻址** 使用存储在 CPU\
  \ 寄存器之一中的值作为开始计数的基址位置。CPU 然后将指令提供的偏移量加到该基址上，并从计算出的内存位置检索操作数。\n\n#### 辅助存储器\n\n**辅助存储器**\
  \ 通常用来指代磁性、光学或基于闪存的介质，或其他包含 CPU 不能立即访问的数据的存储设备。为了让 CPU 访问辅助存储器中的数据，操作系统必须先读取数据并将其存储在实存中。然而，辅助存储器比主存便宜得多，可用于存储海量信息。在此背景下，硬盘、闪存驱动器和光学介质（如光盘\
  \ (CD)、数字多功能光盘 (DVD) 和蓝光光盘）都可以作为辅助存储器发挥作用。\n\n虚拟内存是一种特殊的辅助存储器，操作系统对其进行管理，使其外观和行为就像实存一样。最常见的虚拟内存类型是大多数操作系统作为其内存管理功能一部分来管理的页面文件。这个特殊格式的文件包含之前存储在内存中但近期未被使用的数据。当操作系统需要访问存储在页面文件中的地址时，它会检查该页面是否驻留在内存中（如果是，可以立即访问），或者它是否已被换出到磁盘，在这种情况下，它会将数据从磁盘读回实存（这个过程称为**换页**）。\n\
  \n\n\n\n### 使用虚拟内存\n\n使用虚拟内存是一种低成本的方法，可让计算机运行起来就好像它拥有的真实内存比实际安装的物理内存更多。其主要缺点是，当数据在主存和辅存之间交换时发生的分页操作相对较慢（内存功能以纳秒为单位，磁盘系统以微秒为单位；通常这意味着三个数量级的差异！）并消耗大量的计算机开销，从而拖慢整个系统。随着实际物理\
  \ RAM 容量的增加，对虚拟内存的需求会减少，并且可以通过使用闪存卡或 SSD 来托管虚拟内存分页文件，以减轻虚拟内存带来的性能损失。\n\n#### 内存安全问题\n\
  \n内存存储并处理您的数据——其中一些可能极其敏感。您必须了解各种类型的内存，并知晓它们如何存储和保留数据。任何可能保留敏感数据的内存设备，在允许其因任何原因离开您的组织之前，都应进行清除。对于设计为断电后仍能保留数据的辅助内存以及\
  \ `ROM`/`PROM`/`EPROM`/`EEPROM` 设备，这一点尤为重要。\n\n然而，内存数据保留问题并不局限于那些设计用于保留数据的内存类型。请记住，静态和动态\
  \ RAM 芯片通过电容器和触发器存储数据（参见侧边栏“动态 RAM 与静态 RAM”）。从技术上讲，这些电气元件在断电后可能会在有限的时间内保留部分电荷。技术娴熟的个人理论上可以对这些元件进行电学测量，并检索存储在这些设备上的部分数据。然而，这需要相当深厚的技术专长，除非您的对手拥有令人难以置信的深厚资金，否则这不太可能构成威胁。\n\
  \n存在一种攻击会冻结内存芯片，以便在系统关闭或 RAM 从主板上拔出时延缓驻留数据的衰减。请参阅 <http://en.wikipedia.org/wiki/Cold_boot_attack>。甚至还有针对内存镜像转储或系统崩溃转储以提取加密密钥的攻击。请参阅\
  \ <http://www.lostpassword.com/hdd-decryption.htm>。\n\n围绕内存最重要的安全问题之一，是在计算机使用期间控制谁可以访问存储在内存中的数据。这主要是操作系统的责任，也是本章前几节中描述的各种处理模式所涉及的主要内存安全问题。在本章后面的“基本安全保护机制”部分，您将了解进程隔离原则如何用于确保进程无法访问读取或写入未分配给它们的内存空间。如果您在多级安全环境中操作，确保采取足够的保护措施以防止内存内容在安全级别之间发生意外泄露（无论是通过直接内存访问还是隐蔽信道）就显得尤为重要（隐蔽信道的完整讨论将在本章后面出现）。\n\
  \n#### 存储\n\n*数据存储设备*构成了我们将要讨论的计算机系统组件的第三大类。这些设备用于存储信息，以便计算机在数据写入后的任何时间使用。我们将首先探讨一些与存储设备相关的常用术语，然后介绍与数据存储相关的一些安全问题。\n\
  \n##### 主存与辅存\n\n主存储和辅存储的概念可能会让人有些困惑，尤其是在与主存和辅存进行比较时。有一个简单的方法可以理清它们——它们是同一回事！*主内存*，也称为*主存储*，是计算机在运行时用于保持必要信息随时可供\
  \ CPU 使用的 RAM。*辅助内存*（或*辅助存储*）包括您每天使用的所有熟悉的长期存储设备。辅助存储由磁性和光学介质组成，例如 `HDD`、`SSD`、闪存驱动器、磁带、`CD`、`DVD`、闪存卡等。\n\
  \n##### 易失性与非易失性\n\n您已经从我们之前关于内存的讨论中熟悉了易失性的概念，尽管您可能以前没有听说过用该术语来描述它。存储设备的易失性仅仅是衡量其在断电时丢失数据的可能性有多大。设计用于保留数据的设备（如磁性介质）被归类为*非易失性*，而设计用于丢失数据的设备（如静态或动态\
  \ RAM 模块）被归类为*易失性*。回顾前一节的讨论，复杂的技术有时可能能够在断电后从易失性内存中提取数据，因此两者之间的界限有时可能会变得模糊。\n\n#####\
  \ 随机与顺序\n\n存储设备可以通过两种方式之一进行访问。*随机访问存储*设备允许操作系统通过某种寻址系统，立即从设备内的任意点进行读取（有时也可写入）。几乎所有主存储设备都是随机访问设备。您可以使用内存地址访问\
  \ RAM 芯片中任意位置存储的信息，而无需读取其之前物理存储的数据。大多数辅助存储设备也是随机访问的。例如，硬盘驱动器使用可移动磁头系统，允许您直接移动到磁盘上的任意点，而无需旋转经过先前磁道上存储的所有数据；同样，CD\
  \ 和 DVD 设备使用光学扫描仪，可将自身定位在盘片表面的任何位置。\n\n另一方面，*顺序存储*设备不提供这种灵活性。它们要求您读取（或跳过）物理存储在所需位置之前的所有数据。顺序存储设备的一个常见示例是磁带驱动器。为了访问存储在磁带中间的数据，磁带驱动器必须物理扫描整个磁带（即使在快进模式下不一定处理其经过的数据），直到到达所需位置。\n\
  \n显然，顺序存储设备的运行速度比随机访问存储设备慢得多。然而，您再次面临成本/收益的决策。许多顺序存储设备可以在相对廉价的介质上存储海量数据。这一特性使磁带驱动器成为与灾难恢复/业务连续性计划相关的备份任务的独特选择（请参阅第\
  \ 3 章“业务连续性规划”和第 18 章“灾难恢复规划”）。在备份场景中，您通常有极大量的数据需要存储，且极少需要访问这些存储的信息。这种情况非常适合使用顺序存储设备！\n\
  \n##### 存储介质安全\n\n我们在上一节中讨论了围绕主存储设备的安全问题。对于辅助存储设备的安全性，有三个主要关注点；它们都反映了针对主存储设备提出的担忧：\n\
  \n*   数据可能即使在被擦除后仍保留在辅助存储设备上。这种情况称为*数据残留*。大多数精通技术的计算机用户都知道，即使文件已被删除，也有可用的实用程序可以从磁盘中检索文件。从技术上讲，从已重新格式化的磁盘中检索数据也是可能的。如果您真的想从辅助存储设备中移除数据，必须使用专门设计用于销毁设备上所有数据痕迹的实用程序，或将其损坏或销毁到无法修复的程度（通常称为*清理*）。\n\
  \n\n\n\n\n### SSD 与清除\n\nSSD 在清除方面存在独特问题。SSD 的磨损均衡意味着通常存在一些未标记为“活动”的数据块，但它们在数据被复制到磨损程度较低的块时保存了数据的副本。这意味着传统的零擦除作为\
  \ SSD 的数据安全措施是无效的。\n\n### 辅助存储设备盗窃\n\n辅助存储设备也容易被盗。经济损失并非主要因素（毕竟，备份磁带或硬盘值多少钱？），但机密信息的丢失构成巨大风险。如果有人将你的商业机密复制到可移动介质光盘上并带出大门，其价值远超光盘本身的成本。因此，使用全盘加密以降低未经授权实体访问数据的风险至关重要。由于\
  \ SSD 的磨损均衡技术，在存储任何数据之前对其进行加密是良好的安全实践。这将最大程度地减少明文数据驻留在休眠块中的可能性。幸运的是，许多 HDD 和 SSD\
  \ 设备提供设备原生加密功能。\n\n### 辅助存储的访问控制\n\n对存储在辅助存储设备上的数据的访问，是计算机安全专业人员面临的最关键问题之一。对于硬盘，数据通常可以通过操作系统访问控制的组合来保护。可移动介质构成更大的挑战，因此保护它们通常需要加密技术。\n\
  \n### 介质保留与淘汰\n\n由于可用性也是安全三要素的一部分，因此选择能在所需时间长度内保留数据的介质至关重要。例如，备份磁带可能在数据保留期结束前就已降解。此外，用于辅助存储的技术可能会过时，导致难以恢复/读取数据。\n\
  \n#### 输入和输出设备\n\n输入和输出设备通常被视为基本、原始的外设，通常在它们停止正常工作前不会受到太多关注。然而，即使这些基本设备也可能给系统带来安全风险。安全专业人员应了解这些风险，并确保采取适当的控制措施来缓解它们。接下来的四节将探讨特定输入和输出设备带来的一些风险。\n\
  \n##### 显示器\n\n显示器看起来相当无害。毕竟，它们只是显示操作系统呈现的数据。当你关闭它们时，数据从屏幕上消失且无法恢复。然而，名为 `TEMPEST`\
  \ 的程序技术可能会危及显示器上显示数据的安全。通常，阴极射线管（CRT）显示器更容易产生显著辐射，而液晶显示器（LCD）泄露的辐射少得多（有人声称不足以泄露关键数据）。\n\
  \n`TEMPEST` 是一种技术，允许从远处读取每个显示器产生的电子辐射（称为 `Van Eck 辐射`）（此过程称为 `Van Eck 窃听`），甚至可以从另一个位置读取。该技术也可用于防范此类活动。各种演示表明，你可以轻松读取办公楼内显示器的屏幕内容，只需使用停在街边货车内的设备即可。不幸的是，防止\
  \ `Van Eck 辐射` 所需的保护控制（大量的铜！）实施成本高昂且使用笨重。可以说，任何显示器最大的风险仍然是肩窥或相机长焦镜头。有人用肉眼或摄像机看到你屏幕内容的概念称为\
  \ `肩窥`。不要忘记 `肩窥` 适用于台式机显示器、笔记本显示器、平板电脑和手机。\n\n##### 打印机\n\n打印机也可能代表安全风险，尽管相对简单。取决于组织采用的物理安全控制，带走纸质形式的敏感信息可能比带走闪存驱动器或磁性介质容易得多。如果打印机是共享的，用户可能忘记取走敏感打印件，使其暴露在窥视之下。许多现代打印机还在本地存储数据，通常在硬盘上，有些甚至无限期保留打印副本。打印机通常在网络上暴露以便访问，且通常未设计为安全系统。但根据打印机型号，可能有许多配置设置可提供合理级别的安全网络打印服务。这些可以包括加密数据传输和打印机交互前的身份验证。这些问题最好由组织的安全策略来解决。\n\
  \n##### 键盘/鼠标\n\n键盘、鼠标和类似的输入设备也无法免疫安全漏洞。所有这些设备都容易受到 `TEMPEST` 监控。此外，键盘还容易受到不那么复杂的窃听。一个简单的装置可以放置在键盘内部或其连接线上，以拦截所有按键并利用无线电信号传输给远程接收器。这具有与\
  \ `TEMPEST` 监控相同的效果，但可以用成本低得多的设备完成。此外，如果你的键盘和鼠标是无线的，包括蓝牙，它们的无线电信号可能被拦截。\n\n#####\
  \ 调制解调器\n\n随着普遍宽带和无线连接的出现，调制解调器正成为稀缺的遗留计算机组件。如果你的组织仍在使用旧设备，调制解调器可能是硬件配置的一部分。用户系统上存在调制解调器，往往是安全管理员最大的烦恼之一。调制解调器允许用户在你的网络中创建不受控制的接入点。在最坏的情况下，如果配置不当，它们会造成极其严重的安全漏洞，允许外部人员绕过所有边界保护机制，直接访问网络资源。在最好的情况下，它们创建了一个替代的出口通道，内部人员可用来将数据输送到组织外部。但请记住，只有当调制解调器连接到正在运行的电话固定线路时，这些漏洞才能被利用。\n\
  \n除非确实有业务需求，否则你应在组织的安全策略中认真考虑全面禁止调制解调器。在这些情况下，安全官员应知晓网络上所有调制解调器的物理和逻辑位置，确保它们配置正确，并确保采取适当的保护措施以防止其非法使用。\n\
  \n#### 固件\n\n`固件`（在某些领域也称为 `微代码`）是用于描述存储在 ROM 芯片中的软件的术语。这种类型的软件不经常更改（实际上，如果存储在真正的\
  \ ROM 芯片上而非 EPROM/EEPROM 上，则永不更改），且通常驱动计算设备的基本操作。固件有两种类型：主板上的 BIOS 以及通用的内部和外部设备固件。\n\
  \n##### BIOS 和 UEFI\n\n`基本输入/输出系统 (BIOS)` 包含计算机启动并从磁盘加载操作系统所需的、与操作系统无关的原始指令。BIOS\
  \ 包含在固件设备中，计算机在启动时立即访问它。在大多数计算机中，BIOS 存储在 EEPROM 芯片上以便于版本更新。更新 BIOS 的过程称为“`刷新` BIOS”。\n\
  \n已有少数恶意代码嵌入 BIOS/固件的案例。还有一种称为 `phlashing` 的攻击，即安装官方 BIOS 或固件的恶意变体，在设备中引入远程控制或其他恶意功能。\n\
  \n\n\n\n自 2011 年以来，大多数系统制造商已将其主板上的传统 BIOS 系统替换为统一可扩展固件接口 (UEFI)。UEFI 是硬件与操作系统之间更高级的接口，它保持对传统\
  \ BIOS 服务的支持。\n\n###### 设备固件\n\n许多硬件设备（如打印机和调制解调器）也需要一定的有限处理能力来完成其任务，同时将对操作系统本身造成的负担降至最低。在许多情况下，这些“微型”操作系统完全包含在其所服务设备上的固件芯片中。与计算机的\
  \ BIOS 类似，设备固件通常存储在 EEPROM 设备上，以便在必要时进行更新。\n\n#### 基于客户端的系统\n\n基于客户端的漏洞将用户、其数据及其系统置于被攻破和破坏的风险之中。客户端攻击是指任何能够危害客户端的攻击。通常在讨论攻击时，默认主要目标是服务器或服务器端组件。客户端攻击或以客户端为中心的攻击，是指客户端本身或客户端上的某个进程成为目标。客户端攻击的一个常见例子是：恶意网站将恶意移动代码（如小程序）传输到客户端上运行的易受攻击的浏览器中。客户端攻击可通过任何通信协议发生，不仅限于超文本传输协议\
  \ (HTTP)。另一个基于客户端的潜在漏洞是本地缓存投毒的风险。\n\n##### 小程序\n\n回顾一下，代理是从用户系统发送的代码对象，用于查询和处理存储在远程系统上的数据。`Applets`\
  \ 执行相反的功能；这些代码对象从服务器发送到客户端以执行某些操作。事实上，小程序实际上是独立的微型程序，独立于发送它们的服务器而执行。万维网领域正处于持续变化之中。如今小程序的使用不如\
  \ 2010 年代初期那样普遍。然而，小程序并未从网络中消失，大多数浏览器仍然支持它们（或仍安装有支持它们的插件）。因此，即使您的组织在内部或公共网页设计中不使用小程序，您的网页浏览器在浏览公共网络时仍可能遇到它们。\n\
  \n设想一台向网络用户提供各种金融工具的 Web 服务器。其中一种工具可能是抵押贷款计算器，它处理用户的财务信息，并根据贷款本金、期限和借款人的信用信息提供每月抵押贷款付款额。远程\
  \ Web 服务器不是处理这些数据并将结果返回给客户端系统，而是可能向本地系统发送一个小程序，使其能够自行执行这些计算。这为远程服务器和最终用户都提供了许多好处：\n\
  \n*   处理负担转移给了客户端，释放了 Web 服务器上的资源以处理来自更多用户的请求。\n*   客户端能够使用本地资源生成数据，而无需等待远程服务器的响应。在许多情况下，这会使对输入数据变化的响应更快。\n\
  *   在编写得当的小程序中，Web 服务器不会接收提供给小程序作为输入的任何数据，从而保持用户财务数据的安全性和隐私性。\n\n然而，正如代理一样，小程序也引入了许多安全顾虑。它们允许远程系统发送代码到本地系统执行。安全管理员必须采取措施，确保发送到其网络上系统的代码是安全的，并经过适当筛查以防恶意活动。此外，除非逐行分析代码，否则最终用户永远无法确定小程序不包含特洛伊木马组件。例如，抵押贷款计算器可能确实会在最终用户不知情或未经同意的情况下，将敏感财务信息传输给\
  \ Web 服务器。\n\n小程序类型的两个历史示例是 Java 小程序和 ActiveX 控件。\n\n###### Java 小程序\n\n`Java` 是由\
  \ Sun Microsystems（现归 Oracle 所有）开发的一种与平台无关的编程语言。Java 在很大程度上已被现代应用程序取代，且在大多数浏览器中不再直接受支持。然而，您仍应对\
  \ Java 有基本的了解，因为它可能仍在内部使用，或受贵组织实施的特定浏览器支持。虽然现代网页设计已摒弃 Java，但这并不意味着 Java 已从互联网上彻底清除。大多数编程语言使用编译器生成针对特定操作系统定制的应用程序。这需要使用多个编译器为单个应用程序生成不同版本，以支持每个平台。Java\
  \ 通过引入 `Java 虚拟机 (JVM)` 克服了这一限制。每个运行 Java 代码的系统都会下载其操作系统支持的 JVM 版本。然后 JVM 获取 Java\
  \ 代码并将其转换为该特定系统可执行的格式。这种安排的巨大好处是代码可以在操作系统之间共享而无需修改。Java 小程序就是通过互联网传输的简短 Java 程序，用于在远程系统上执行操作。\n\
  \n安全性是 Java 平台设计期间的重中之重，Sun 的开发团队创建了“沙箱”概念，对 Java 代码施加权限限制。沙箱将 Java 代码对象与操作系统的其余部分隔离开来，并强制执行关于这些对象可访问资源的严格规则。例如，沙箱会禁止\
  \ Java 小程序从未专门分配给它的内存区域检索信息，防止小程序窃取该信息。不幸的是，虽然沙箱减少了可通过 Java 发起的恶意事件形式，但仍有许多其他漏洞被广泛利用。\n\
  \n###### ActiveX 控件\n\n`ActiveX` 控件是微软针对 Sun 的 Java 小程序推出的对应产品。它们的运作方式类似，但使用多种语言实现，包括\
  \ Visual Basic、C、C++ 和 Java。Java 小程序和 ActiveX 控件之间有两个关键区别。首先，ActiveX 控件使用微软专有技术，因此只能在运行微软浏览器的系统上执行。其次，ActiveX\
  \ 控件不受 Java 小程序所受沙箱限制的约束。它们拥有对 Windows 操作环境的完全访问权，并可执行许多特权操作。因此，在决定下载和执行哪些 ActiveX\
  \ 控件时，必须采取特别预防措施。一些安全管理员采取了相当严厉的立场，禁止从极少数受信任站点之外的任何站点下载 ActiveX 内容。\n\nActiveX 仍受\
  \ Internet Explorer 11 支持，但随 Windows 10 发布的微软最新浏览器 Edge 不包含对 ActiveX 的支持。这表明微软正在逐步淘汰\
  \ ActiveX。\n\n##### 本地缓存\n\n\n\n\n### 本地缓存攻击与防御\n\n#### 本地缓存概述\n\n**本地缓存** 是指临时存储在客户端以供将来重用的任何内容。典型客户端上存在许多本地缓存，包括地址解析协议（`ARP`）缓存、域名系统（`DNS`）缓存和\
  \ Internet 文件缓存。\n\n#### ARP 缓存投毒\n\n**ARP 缓存投毒** 是由攻击者响应 ARP 广播查询并发回伪造回复而导致的。如果客户端在收到有效回复之前先收到了虚假回复，则该虚假回复将被用于填充\
  \ ARP 缓存，而有效回复会被丢弃（视为超出开放查询范围）。**ARP 缓存** 的动态内容（无论是被投毒的还是合法的）将保留在缓存中，直到发生超时（通常在\
  \ 10 分钟以内）。ARP 用于将 Internet 协议（`IP`）地址解析为适当的 MAC 地址，以便为数据传输构建以太网帧头。一旦 IP 到 MAC 的映射从缓存中失效，当客户端重新执行\
  \ ARP 广播查询时，攻击者便获得了另一次投毒 ARP 缓存的机会。\n\nARP 缓存投毒的第二种形式是创建静态 ARP 条目。这通过 `ARP` 命令完成，且必须在本地执行。但通过在客户端上执行脚本（通过木马、缓冲区溢出或社会工程学攻击），这很容易实现。静态\
  \ ARP 条目是永久的，甚至跨系统重启依然有效。一旦发生 ARP 投毒（无论是针对永久条目还是动态条目），客户端发送的流量将被发送到非预期的系统。这是由于将错误的或不同的硬件地址（即\
  \ MAC 地址）与某个 IP 地址关联所致。ARP 缓存投毒或简称 ARP 投毒是建立中间人攻击的一种手段。\n\n#### DNS 缓存投毒\n\n实施中间人攻击的另一种流行手段是\
  \ **DNS 缓存投毒**。与 ARP 缓存类似，一旦客户端收到来自 DNS 的响应，该响应将被缓存以供将来使用。如果能向 **DNS 缓存** 注入虚假信息，则误导通信就变得轻而易举。实施\
  \ DNS 缓存投毒的方法有很多，包括 `HOSTS` 文件投毒、授权 DNS 服务器攻击、缓存 DNS 服务器攻击、DNS 查找地址篡改和 DNS 查询欺骗。\n\
  \n##### HOSTS 文件投毒\n\n**HOSTS 文件** 是支持传输控制协议/Internet 协议（`TCP/IP`）的系统上发现的静态文件，包含域名及其关联\
  \ IP 地址的硬编码引用。HOSTS 文件用于当今基于动态查询的 DNS 系统之前，但它作为一种后备措施或强制解析的手段而保留。管理员或黑客可以向 HOSTS\
  \ 文件添加内容，在 **FQDN（完全合格域名）** 与自选 IP 地址之间建立映射关系。如果攻击者能在 HOSTS 文件中植入虚假信息，则系统启动时 HOSTS\
  \ 文件的内容将被读入内存并生效。与最终会超时并从缓存过期的动态查询不同，来自 HOSTS 文件的条目是永久的。\n\n##### 授权 DNS 服务器攻击\n\
  \n授权 DNS 服务器攻击旨在篡改 FQDN 在其原始宿主系统（即主要授权 DNS 服务器）上的主记录。**主要授权 DNS 服务器** 托管区域文件或域数据库。如果该原始数据集被篡改，这些变更最终将传播至整个\
  \ Internet。然而，针对授权 DNS 服务器的攻击通常会被迅速发现，因此很少导致大规模利用。因此，大多数攻击者将目标集中在缓存 DNS 服务器上。\n\n\
  ##### 缓存 DNS 服务器攻击\n\n**缓存 DNS 服务器** 是指部署用于缓存来自其他 DNS 服务器的 DNS 信息的任何 DNS 系统。大多数公司和\
  \ ISP 为其用户提供缓存 DNS 服务器。托管在缓存 DNS 服务器上的内容不受全球安全社区监控，仅由本地运营商监管。因此，针对缓存 DNS 服务器的攻击可能在相当长的一段时间内不被察觉。有关缓存\
  \ DNS 服务器攻击如何发生的详细信息，请参阅“Kaminsky DNS 漏洞图解指南”：[`unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html`](http://unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html)。尽管这两种攻击都针对\
  \ DNS 服务器，但它们最终影响的是客户端。一旦客户端执行动态 DNS 解析，从授权 DNS 服务器或缓存 DNS 服务器接收到的信息将临时存储在客户端的本地\
  \ DNS 缓存中。如果该信息是虚假的，则客户端的 DNS 缓存就被投毒了。\n\n##### DNS 查找地址篡改\n\n第四种 DNS 投毒示例侧重于向客户端发送一个备用\
  \ IP 地址，使其作为客户端用于解析查询的 DNS 服务器。DNS 服务器地址通常通过动态主机配置协议（`DHCP`）分发给客户端，但也可以静态分配。即使所有其他\
  \ IP 配置元素均由 DHCP 分配，本地修改也可以轻松地静态指定 DNS 服务器地址。篡改客户端 DNS 服务器查找地址的攻击可通过脚本（类似于前面提到的\
  \ ARP 攻击）或通过攻破 DHCP 来实施。一旦客户端使用了错误的 DNS 服务器，它们将把查询发送给黑客控制的 DNS 服务器，后者将响应投毒的结果。\n\
  \n##### DNS 查询欺骗\n\n第五种 DNS 投毒示例是 DNS 查询欺骗。当黑客能够窃听客户端向 DNS 服务器发出的查询时，就会发生这种攻击。攻击者随后发回包含虚假信息的回复。如果客户端接受该虚假回复，就会将该信息放入其本地\
  \ DNS 缓存中。当真正的回复到达时，由于原始查询已被应答，它将被丢弃。无论采用这五种 DNS 攻击中的哪一种，虚假条目都将存在于客户端的本地 DNS 缓存中。因此，所有\
  \ IP 通信都将被发送到错误的端点。这使得黑客可以通过操作该虚假端点并将流量转发至正确目的地来建立中间人攻击。\n\n#### Internet 文件缓存投毒\n\
  \n关于本地缓存的第三个关注领域是临时 Internet 文件或 Internet 文件缓存。这是从 Internet 站点下载的文件的临时存储，由客户端的工具程序保留以供当前和将来可能的使用。该缓存主要包含网站内容，但其他\
  \ Internet 服务也可以使用文件缓存。多种攻击手段（如拆分响应攻击）可导致客户端下载并缓存非请求网页预期元素的内容。移动代码脚本攻击也可用于在缓存中植入虚假内容。一旦缓存中的文件被投毒，即使合法的\
  \ Web 文档调用缓存项，恶意项目也会被激活。\n\n#### 缓解与防御\n\n缓解或解决这些攻击并不总是简单或直接的。没有简单的补丁或更新能防止这些攻击针对客户端发起。这是因为这些攻击利用了内置于各种协议、服务和应用程序中的正常且正确的机制。因此，防御不仅仅是修补缺陷的补丁，而更多的是一种检测和预防的工作。总体而言，作为起点，请保持操作系统和应用程序通过其各自供应商的补丁保持最新。接下来，部署基于主机的\
  \ IDS（`host-IDS`）和基于网络的 IDS（`network-IDS`）工具，以监控此类滥用行为。定期审查 DNS 和 DHCP 系统的日志，以及本地客户端系统日志，并可能包括防火墙、交换机和路由器日志，以查找指示异常或可疑事件的条目。\n\
  \n\n\n\n### 组织应使用*拆分 DNS*系统\n\n组织应使用 `split-DNS` 系统（也称为拆分视界 DNS、拆分视图 DNS 和拆分大脑 DNS）。`split-DNS`\
  \ 是部署一台供公众使用的 DNS 服务器和一台供内部使用的独立 DNS 服务器。公共 DNS 服务器上区域文件中的所有数据均可通过查询或探测被公众访问。然而，内部\
  \ DNS 仅供内部使用。只有内部系统被授予访问权限以与内部 DNS 服务器交互。通过阻止传输控制协议 (TCP) 和用户数据报协议 (UDP) 的入站端口 53，禁止外部人员访问内部\
  \ DNS 服务器。`TCP 53` 用于区域传输（包括大多数 DNS 服务器到 DNS 服务器的通信），而 `UDP 53` 用于查询（即任何非 DNS 系统向\
  \ DNS 服务器发送查询）。内部系统可配置为仅与内部 DNS 服务器交互，也可允许其向外部 DNS 服务器发送查询（这需要防火墙为状态检测防火墙，并配置为允许响应从经批准的出站查询返回到内部系统）。\n\
  \n#### 基于服务器的系统\n\n一个重要的基于服务器的关注领域（可能也包括客户端）是 `data flow control`（数据流控制）问题。数据流是指数据在进程之间、设备之间、跨网络或跨通信通道的移动。数据流的管理不仅确保了高效传输，延迟或延迟最小化，还确保了使用哈希的可靠吞吐量和使用加密的机密性保护。数据流控制还确保接收系统不会因流量过载而不堪重负，特别是不会达到丢弃连接或遭受恶意甚至自我造成的拒绝服务的地步。当发生数据溢出时，数据可能会丢失或损坏，或触发重传需求。这些结果是不可取的，因此通常会实施数据流控制以防止这些问题发生。数据流控制可由网络设备（包括路由器和交换机）以及网络应用程序和服务提供。\n\
  \n负载均衡器用于将网络流量负载分散或分布到多个网络链路或网络设备上。负载均衡器可能能够提供对数据流更多的控制。负载均衡的目的是获得更优化的基础设施利用率，最小化响应时间，最大化吞吐量，减少过载，并消除瓶颈。虽然负载均衡可用于各种情况，但常见的实现是将负载分散到服务器场或集群的多个成员上。负载均衡器可能会使用多种技术来执行负载分发，包括随机选择、轮询、负载/利用率监控和优先级偏好。\n\
  \n拒绝服务攻击可能会严重损害数据流控制。监控 DoS 攻击并实施缓解措施非常重要。请参阅第 12 章和第 17 章，了解这些攻击和潜在防御的讨论。\n\n####\
  \ 数据库系统安全\n\n`Database security`（数据库安全）是任何将大量数据集作为核心资产的组织的重要组成部分。如果没有数据库安全工作，业务任务可能会中断，机密信息可能会泄露。对于\
  \ CISSP 考试，重要的是你要了解与数据库安全相关的几个主题。这些包括聚合、推理、数据挖掘、数据仓库和数据分析。\n\n##### 聚合\n\nSQL 提供了许多函数，可将来自一个或多个表的记录组合起来，生成潜在有用的信息。此过程称为\
  \ `aggregation`（聚合）。聚合并非没有安全漏洞。聚合攻击用于收集大量低级安全项目或低价值项目，并将它们组合起来，创建出具有更高安全级别或价值的东西。\n\
  \n尽管这些函数极其有用，但它们也对数据库中信息的安全构成风险。例如，假设一名低级军事记录职员负责在人员和装备从一个基地调往另一个基地时更新记录。作为其职责的一部分，该职员可能被授予查询和更新人员表所需的数据库权限。\n\
  \n军方可能不认为单个调动请求（即琼斯中士从 X 基地调往 Y 基地）属于机密信息。记录职员有权访问该信息，因为他需要它来处理琼斯中士的调动。然而，借助聚合函数的访问权限，记录职员可能能够统计全球每个军事基地分配的部队数量。这些兵力水平通常是严格保密的军事机密，但这名低级别的记录职员可以通过跨大量非机密记录使用聚合函数来推断出它们。\n\
  \n因此，数据库安全管理员严格控制对聚合函数的访问，并充分评估其可能向未经授权的个人泄露的潜在信息，这一点尤为重要。\n\n##### 推理\n\n推理攻击带来的数据库安全问题与数据聚合的威胁类似。`Inference`（推理）攻击涉及将多条非敏感信息组合起来，以获取本应被归类为更高级别的信息。然而，推理利用的是人类思维的演绎能力，而非现代数据库平台的原始数学能力。\n\
  \n推理攻击的一个常见例子是大型企业的会计职员，他们被允许检索公司用于高层报告的工资总额，但不被允许访问个别员工的工资。会计职员经常需要准备过去生效日期的报告，因此被允许访问过去一年内任何一天的工资总额。例如，假设该职员还必须知道各员工的雇佣和解雇日期，并有权访问此信息。这为推理攻击打开了方便之门。如果某员工是某特定日期唯一被雇佣的人，会计职员现在可以检索该日期和前一天的工资总额，从而推断出该特定员工的工资——这是用户无权直接访问的敏感信息。\n\
  \n与聚合一样，防御推理攻击的最佳方法是持续监控授予个别用户的权限。此外，可使用有意模糊数据来防止推断敏感信息。例如，如果会计职员只能检索四舍五入到最近一百万的工资信息，他们可能无法获得关于个别员工的任何有用信息。最后，您可以使用数据库分区（本章前面已讨论）来帮助挫败这些攻击。\n\
  \n##### 数据挖掘和数据仓库\n\n许多组织使用称为 `data warehouses`（数据仓库）的大型数据库，从各种数据库存储大量信息，以供专门的分析技术使用。这些数据仓库通常包含详细的历史信息，由于存储限制或数据安全顾虑，这些信息通常不存储在生产数据库中。\n\
  \n`data dictionary`（数据字典）通常用于存储关于数据的关键信息，包括用法、类型、来源、关系和格式。数据库管理系统 (DBMS) 软件读取数据字典，以确定试图访问数据的用户的访问权限。\n\
  \n\n\n\n### 数据挖掘与分析\n\n**数据挖掘**技术允许分析师梳理数据仓库并寻找潜在的相关信息。例如，分析师可能会发现灯泡的需求总是在冬季月份增加，然后在规划定价和促销策略时利用这一信息。数据挖掘技术会产生数据模型，可用于预测未来活动。\n\
  \n数据挖掘活动会产生**元数据**。**元数据**是关于数据的数据或关于数据的信息。元数据不仅仅是数据挖掘操作的结果；其他功能或服务也可以产生元数据。可以将数据挖掘操作产生的元数据视为数据的浓缩。它也可以是超集、子集或较大数据集的表示。元数据可以是数据集中重要的、显著的、相关的、异常的或离群的元素。\n\
  \n元数据的一个常见安全示例是安全事件报告。事件报告是通过使用安全审计数据挖掘工具，从审计日志数据仓库中提取的元数据。在大多数情况下，元数据比仓库中的大量数据具有更高的价值或敏感性（由于披露原因）。因此，元数据存储在一个称为**数据集市**的更安全的容器中。\n\
  \n数据仓库和数据挖掘对安全专业人员至关重要，主要有两个原因。首先，如前所述，数据仓库包含大量潜在敏感信息，容易受到聚合和推理攻击，安全从业者必须确保已采取适当的访问控制和其他安全措施来保护这些数据。其次，当数据挖掘用于为基于统计异常的入侵检测系统开发基线时，它实际上可以作为一种安全工具。数据挖掘用于在大量安全相关数据中“搜寻”异常事件，这些事件可能表明正在进行的攻击、失陷或违规。\n\
  \n#### 数据分析\n\n**数据分析**是检查原始数据的科学，其重点是从海量信息集中提取有用信息。数据分析的结果可能侧重于重要的离群值或偏离正常或标准项目的异常值、所有数据项的摘要，或对有趣信息的某种聚焦提取和组织。随着越来越多的组织从其客户和产品中收集惊人的数据量，数据分析正成为一个不断发展的领域。待处理的海量信息催生了一整类新的数据库结构和分析工具。它甚至获得了“大数据”的绰号。\n\
  \n**大数据**指的是数据集合变得如此之大，以至于传统的分析或处理手段变得无效、低效且不足。大数据涉及许多棘手的挑战，包括收集、存储、分析、挖掘、传输、分发和结果展示。如此大量的数据有可能揭示更平凡的数据集无法解决的细微差别和特性。从大数据中学习的潜力巨大，但处理大数据的负担同样巨大。随着数据量的增加，数据分析的复杂性也随之增加。大数据分析需要在大规模并行或分布式处理系统上运行高性能分析。就安全而言，组织正致力于收集越来越详细和详尽的事件数据和访问数据。收集这些数据的目的是评估合规性、提高效率、提高生产力和检测违规行为。\n\
  \n#### 大规模并行数据系统\n\n**并行数据系统**或**并行计算**是一种设计用于同时执行大量计算的计算系统。但并行数据系统通常远不止基本的多处理能力。它们通常包含将大任务分解为较小元素，然后将每个子元素分发到不同的处理子系统进行并行计算的概念。这种实现基于这样一种思想：如果将某些问题分解为可以并发处理的较小任务，就能高效地解决。并行数据处理可以通过使用不同的\
  \ CPU 或多核 CPU、使用虚拟系统，或这些方式的任意组合来实现。大规模并行数据系统还必须关注性能、功耗和可靠性/稳定性问题。\n\n在多处理或并行处理领域，存在几个分支。第一个分支是**非对称多处理\
  \ (AMP)** 和**对称多处理 (SMP)** 之间的区别。在 AMP 中，处理器通常相互独立运行。通常每个处理器都有自己的操作系统和/或任务指令集。在\
  \ AMP 下，处理器可被配置为仅执行特定代码或操作特定任务（或特定代码或任务仅允许在特定处理器上运行；在某些情况下这可能称为**亲和性**）。在 SMP 中，处理器共享一个通用的操作系统和内存。处理器集合也共同协作处理单个任务、代码或项目。AMP\
  \ 的一种变体是**海量并行处理 (MPP)**，即将多个 SMP 系统链接在一起，以便跨多个链接系统中的多个进程处理单个主要任务。传统上 MPP 涉及多个机箱，但现代\
  \ MPP 通常实现在同一芯片上。\n\n大规模并行数据系统领域仍在不断发展。很可能还有许多管理问题有待发现，而已知问题的解决方案仍在探索中。大规模并行数据管理很可能是管理大数据的关键工具，并通常涉及云计算、网格计算或对等计算解决方案。这三个概念将在以下章节中介绍。\n\
  \n#### 分布式系统与端点安全\n\n随着计算从**主机/终端模型**（用户可物理分布，但所有功能、活动、数据和资源驻留在单个集中式系统上）演变为**客户端-服务器模型**（用户操作独立、功能齐全的台式计算机，但也访问网络服务器上的服务和资源），安全控制和概念也必须随之演变以适应变化。这意味着客户端具备计算和存储能力，通常多台服务器也是如此。客户端-服务器模型网络的概念也称为分布式系统或分布式架构。因此，安全必须无处不在，而不仅仅针对单个集中式主机。从安全角度来看，这意味着由于处理和存储分布在多个客户端和服务器上，所有这些计算机都必须得到适当的保护和安全防护。这也意味着客户端和服务器之间的网络链路（在某些情况下，这些链路可能并非纯粹是本地的）也必须得到保护和安全防护。在评估安全架构时，务必包含对分布式架构相关需求和风险的评估。\n\
  \n\n\n\n\n### 分布式架构的安全性\n\n分布式架构容易遭受单体主机/终端系统中无法想象的漏洞攻击。桌面系统可能包含敏感信息，这些信息面临泄露风险，因此必须得到保护。个人用户可能缺乏通用的安全知识或意识，因此底层架构必须弥补这些不足。台式机、工作站和笔记本电脑可能成为分布式环境中其他关键信息系统的访问入口，因为用户需要访问网络服务器和服务来完成工作。通过允许用户机器访问网络及其分布式资源，组织也必须认识到，如果这些用户机器被滥用或攻破，它们可能成为威胁。必须对这类软件和系统漏洞及威胁进行妥善评估和处理。\n\
  \n通信设备也可能为分布式环境提供不必要的入口点。例如，连接在同时接入组织网络的台式机上的调制解调器，会使该网络容易遭受拨号攻击。客户端系统上的无线适配器也存在被用来创建开放网络的风险。同样，从互联网下载数据的用户会增加其自身及其他系统感染恶意代码、特洛伊木马等的风险。台式机、笔记本电脑、平板电脑、手机和工作站——及其关联的磁盘或其他存储设备——可能无法防范物理入侵或盗窃。最后，当数据仅驻留在客户端机器上时，可能无法通过适当的备份来保护（通常服务器会定期备份，但客户端计算机往往不会）。\n\
  \n上述分布式架构中潜在漏洞的罗列表明，此类环境需要大量防护措施来实施适当的安全性，并确保消除、缓解或补救这些漏洞。客户端必须遵守对其内容和用户活动施加防护的策略。这些措施包括：\n\
  \n*   必须对电子邮件进行筛选，使其无法成为恶意软件感染的载体；电子邮件还应遵守管控适当使用和限制潜在责任的策略。\n*   必须制定下载/上传策略，对进出数据进行筛选并拦截可疑材料。\n\
  *   系统必须实施强健的访问控制，这可能包括多因素认证和/或生物识别技术，以限制对最终用户设备的访问，并防止未经授权访问服务器和服务。\n*   应安装并强制使用受限的用户界面机制和数据库管理系统，以限制和管理对关键信息的访问，确保用户仅拥有对敏感资源最小但必要的访问权限。\n\
  *   对存储在客户端机器上的文件和数据进行文件加密可能是适当的（实际上，对于易在组织场外丢失或被盗的笔记本电脑和其他移动计算设备，驱动器级加密是个好主意）。\n\
  *   必须将运行在用户模式和管理模式下的进程分离隔离，以防止未经授权和不必要的访问高权限进程和功能。\n*   应创建保护域，以便客户端被攻破不会自动导致整个网络被攻破。\n\
  *   磁盘和其他敏感材料应明确标注其安全分级或组织敏感度；程序化流程和系统控制应相结合，帮助保护敏感材料免受不必要或未经授权的访问。\n*   台式机上的文件应进行备份，服务器上的文件亦然——理想情况下，使用某种集中式备份工具，配合客户端代理软件，从客户端识别并捕获文件，存储在安全的备份存储归档中。\n\
  *   桌面用户需要定期接受安全意识培训以保持适当的安全意识；他们还需要了解潜在威胁，并接受如何妥善应对的指导。\n*   台式计算机及其存储介质需要防范环境危害（温度、湿度、断电/波动等）。\n\
  *   台式计算机应纳入灾难恢复和业务连续性规划，因为它们对于让用户在其他系统上恢复工作而言，可能与其他系统和服务同等重要（甚至更重要）。\n*   在分布式环境中构建的定制软件开发人员也需要考虑安全性，包括使用正式的开发和部署方法，如代码库、变更控制机制、配置管理、补丁和更新部署。\n\
  \n总的来说，保护分布式环境意味着了解其面临的漏洞并应用适当的防护措施。这些措施可以（也确实）从技术解决方案和控制，到管理风险并寻求限制或避免损失、损害、意外泄露等的策略和程序。\n\
  \n### 防护对策原则\n\n在应对漏洞和威胁时，合理理解对策原则始终很重要。一些具体的对策原则在第 2 章“人员安全与风险管理概念”的“风险管理”节中讨论。但一个通用的一般原则是**纵深防御**。`Defense\
  \ in depth` 是一种常见的安全策略，用于提供多层防护屏障，抵御各种形式的攻击。可以合理地假设，通过由防火墙、入侵检测系统（`IDS`）和勤勉的管理人员组成的严密防御网络传递恶意流量或数据，比仅通过防火墙的网络要困难得多。为什么不加强防御呢？纵深防御（又称\
  \ `multilayered defense` 和 `diversity of defense`）是在字面上或理论上的同心圆中使用多种类型的访问控制。这种分层安全形式有助于组织避免\
  \ `monolithic security stance`。`monolithic security stance` 或 `fortress mentality`\
  \ 是指认为单一安全机制足以提供充分安全的信念。不幸的是，每个单独的安全机制都存在缺陷或变通方法，只待被黑客发现并滥用。只有通过对对策的智能组合，才能构建出能抵御重大且持续的攻击尝试的防御体系。\n\
  \n#### 基于云的系统与云计算\n\n`Cloud computing` 是一个通用术语，指一种计算概念，即处理和存储通过网络连接在别处执行，而非在本地。云计算通常被认为是基于互联网的计算或远程虚拟化。归根结底，处理和存储仍在某处的计算机上进行，但区别在于本地操作员不再需要在本地具备该容量或能力。这也允许更大群体的用户按需利用云资源。从最终用户的角度来看，所有计算工作现在都在“云端”执行，因此复杂性对他们而言是隔离的。\n\
  \n\n\n\n\n### 云计算概述\n\n云计算是虚拟化、互联网、分布式架构以及对数据和资源无处不在的访问需求的自然延伸和演进。然而，它也存在一些问题，包括隐私担忧、法规合规困难、开源与闭源解决方案的使用、开放标准的采用，以及基于云的数据是否真正安全（甚至是否可被保护）。\n\
  \n#### 虚拟机监视器\n\n`hypervisor`（虚拟机监视器），也称为 `virtual machine monitor (VMM)`，是虚拟化中负责创建、管理和运行虚拟机的组件。运行虚拟机监视器的计算机称为宿主操作系统，而在虚拟机监视器支持的虚拟机中运行的操作系统称为客户操作系统。\n\
  \n##### I 型虚拟机监视器（裸金属）\n\n`type I hypervisor`（I 型虚拟机监视器）是原生或裸金属虚拟机监视器。在此配置中，没有宿主操作系统；相反，虚拟机监视器直接安装在硬件上，即通常宿主操作系统所在的位置。I\
  \ 型虚拟机监视器常用于支持服务器虚拟化。这使得硬件资源得到最大化利用，同时消除了由宿主操作系统引起的任何风险或资源损耗。\n\n##### II 型虚拟机监视器（托管型）\n\
  \n`type II hypervisor`（II 型虚拟机监视器）是托管型虚拟机监视器。在此配置中，标准的常规操作系统存在于硬件上，然后虚拟机监视器作为另一个软件应用程序被安装。II\
  \ 型虚拟机监视器常用于桌面部署，其中客户操作系统提供安全的沙箱区域以测试新代码、允许执行遗留应用程序、支持来自备选操作系统的应用程序，并为用户提供对宿主操作系统功能的访问。\n\
  \n#### 云存储\n\n`Cloud storage`（云存储）是指利用云供应商提供的存储容量作为托管组织数据文件的一种手段。云存储可用作备份形式或在线数据服务的支持。云存储可能具有成本效益，但并不总是高速或低延迟。大多数人尚不认为云存储是物理备份介质解决方案的替代品，而是将其视为组织数据保护的补充。此外，使用云存储可能涉及额外风险，因为组织的数据驻留在另一设施的设备上，并处于第三方控制之下。\n\
  \n#### 弹性\n\n`Elasticity`（弹性）是指虚拟化和云解决方案根据需求进行扩展或收缩的灵活性。就虚拟化而言，`host elasticity`（宿主弹性）意味着在需要时可以启动额外的硬件宿主，并利用它们将虚拟化服务的工作负载分发到新可用的容量上。随着工作负载变小，可以将虚拟化服务从不需要的硬件上移除，以便将其关闭从而节约电力并减少发热。\n\
  \n#### 云服务模型\n\n此处列出了云计算中的一些概念：\n\n##### 平台即服务\n\n**Platform as a service (PaaS)**（平台即服务）是将计算平台和软件解决方案栈作为虚拟或基于云的服务提供的概念。本质上，这种类型的云解决方案提供了平台的所有方面（即操作系统和完整的解决方案包）。PaaS\
  \ 的主要吸引力在于避免了在本地购买和维护高端硬件和软件。\n\n##### 软件即服务\n\n**Software as a service (SaaS)**（软件即服务）是\
  \ PaaS 的衍生形式。SaaS 提供对特定软件应用程序或套件的按需在线访问，无需本地安装。在许多情况下，几乎没有本地硬件和操作系统的限制。SaaS 可以作为订阅服务（例如\
  \ Microsoft Office 365）、按量付费服务或免费服务（例如 Google Docs）来实施。\n\n##### 基础设施即服务\n\n**Infrastructure\
  \ as a service (IaaS)**（基础设施即服务）在 PaaS 模型的基础上更进一步，不仅提供按需操作解决方案，还提供完整的外包选项。这可以包括效用或计量计算服务、管理任务自动化、动态扩展、虚拟化服务、策略实施和管理服务，以及托管/过滤的互联网连接。最终，IaaS\
  \ 允许企业通过云系统快速扩展新的软件或基于数据的服务/解决方案，而无需在本地安装大量硬件。\n\n市场上还有许多其他“X 即服务”产品，每种都有其自身潜在的漏洞和优势。不同的云计算公司可能以不同于其他公司的方式定义或标记其服务。因此，仔细比较和对比提供商以及每个提供商可用的功能和选项非常重要。\n\
  \n#### 部署模型\n\n##### 本地部署解决方案\n\n`on-premise solution`（本地部署解决方案）是传统的部署概念，即组织拥有硬件、授权软件，并通常在自己的建筑内自行运营和维护系统。本地部署解决方案不像云服务那样有持续的月度订阅成本，但由于获取硬件和授权的初始前期成本以及持续的运营管理成本，可能成本更高。本地部署解决方案提供完全定制、提供对安全性的本地控制、不需要互联网连接，并提供对更新和更改的本地控制。然而，它们也需要大量的管理参与来进行更新和更改，需要本地备份和管理，并且扩展更具挑战性。\n\
  \n##### 托管解决方案\n\n`hosted solution`（托管解决方案）是一种部署概念，组织必须授权软件，然后运营和维护该软件。托管提供商拥有、运营和维护支持组织软件的硬件。\n\
  \n##### 云解决方案\n\n`cloud solution`（云解决方案）是一种部署概念，组织与第三方云提供商签订合同。云提供商拥有、运营和维护硬件和软件。组织支付月费（通常基于每用户乘数）以使用云解决方案。大多数本地环境都可以被设计或重新创建为纯云解决方案。\n\
  \n##### 云部署选项\n\n云服务还可以通过多种部署选项提供，包括以下内容：\n\n###### 私有云\n\n`private cloud`（私有云）是企业网络内的云服务，与互联网隔离。私有云仅供内部使用。虚拟私有云是公共云提供商提供的一项服务，它提供公共或外部云的一个隔离子区供组织内部专用。换句话说，组织将其私有云外包给外部提供商。\n\
  \n###### 公有云\n\n`public cloud`（公有云）是可供公众访问的云服务，通常通过互联网连接。公有云服务可能需要某种形式的订阅或按使用付费，也可能免费提供。尽管组织或个人的数据在公有云中通常与其他客户的数据保持分离和隔离，但云的总体目的或用途对所有客户都是相同的。\n\
  \n###### 混合云\n\n`hybrid cloud`（混合云）是私有云和公有云组件的混合。例如，组织可以托管一个私有云供内部专用，但将一些资源分发到公有云供公众、业务合作伙伴、客户、外部销售团队等使用。\n\
  \n###### 社区云\n\n`community cloud`（社区云）是由一群用户或组织为其共同利益（如协作和数据交换）而维护、使用和付费的云环境。与独立访问私有云或公有云相比，这可能节省一些成本。\n\
  \n### 总结\n\n云计算是虚拟化、互联网、分布式架构以及对数据和资源无处不在的访问需求的自然延伸和演进。然而，它也存在一些问题，包括隐私担忧、法规合规困难、开源/闭源解决方案的使用、开放标准的采用，以及基于云的数据是否真正安全（甚至是否可被保护）。\n\
  \n\n\n\n\n### 云解决方案：优势、风险与考量\n\n云解决方案通常具有较低的前期成本、较低的维护成本、由供应商维护安全性以及可扩展的资源，并且通常能从任何地方（通过互联网）提供高水平的正常运行时间和可用性。然而，云解决方案不提供客户对操作系统和软件（如更新和配置更改）的控制权；仅提供最少的定制化；且在没有互联网连接的情况下通常无法访问。此外，云提供商的安全策略可能与组织的策略不匹配。\n\
  \n云计算和虚拟化，尤其是在云中进行虚拟化时，伴随着严重的相关风险。一旦敏感、机密或专有数据离开组织的管辖范围，也就离开了组织安全策略及其所产生的基础设施施加的保护。云服务及其人员可能不会遵守与贵组织相同的安全标准。许多云供应商实际上提供的环境比大多数组织自行维护的环境更安全。云提供商通常拥有资源投资于安全工程师、运营和测试人员，而许多中小型（甚至大型）组织根本负担不起这些费用。在采用云服务之前，调查其安全性至关重要。\n\
  \n随着行业法规负担的增加，例如 2002 年的《萨班斯-奥克斯利法案》(SOX)，《健康保险流通与责任法案》(HIPAA) 以及《支付卡行业数据安全标准》(PCI\
  \ DSS)，必须确保云服务提供足够的保护以维持合规性。此外，云服务提供商可能不会将您的数据保存在靠近您主要物理位置的地方。事实上，他们可能会将您的数据分布在许多位置，其中一些可能位于您原籍国之外。可能有必要在云服务合同中添加一项条款，将您的数据仅限制在特定的逻辑和地理边界内存放。\n\
  \n调查云服务采用的加密解决方案非常重要。您是发送预加密的数据给他们，还是数据只有在到达云端后才被加密？加密密钥存储在哪里？您的数据与其他云用户的数据之间是否存在隔离？加密错误可能会向世界泄露您的机密，或导致您的信息无法恢复。\n\
  \n从云端恢复或还原的方法和速度如何？如果您在本地发生系统故障，如何让环境恢复正常？还要考虑云服务是否有自己的灾难恢复解决方案。如果它遭遇灾难，其恢复和还原服务及访问您云资源的计划是什么？\n\
  \n其他问题包括调查取证的困难、对数据销毁的担忧，以及如果当前的云计算服务倒闭或被另一组织收购会发生什么。\n\n#### 虚拟化与安全\n\n**快照** 是虚拟机的备份。它们提供了一种从错误或糟糕的更新中快速恢复的方法。备份整个虚拟系统通常比备份同等的原生硬件安装系统更容易、更快捷。\n\
  \n虚拟化并不会减轻操作系统的安全管理要求。因此，补丁管理仍然至关重要。修补或更新虚拟化操作系统的过程与传统硬件安装的操作系统相同，但额外的好处是您可能能够在不使服务停机的情况下修补系统（或替换活动系统）。此外，不要忘记您也需要保持虚拟化主机的更新。\n\
  \n使用虚拟化系统时，保护主机的稳定性非常重要。这通常意味着避免将主机用于托管虚拟化元素以外的任何目的。如果主机可用性受到威胁，虚拟系统的可用性和稳定性也会受到威胁。\n\
  \n虚拟化系统应进行安全测试。虚拟化操作系统可以像硬件安装的操作系统一样进行测试，例如进行漏洞评估和渗透测试。然而，虚拟化产品可能会引入额外且独特的安全顾虑，因此测试过程需要进行调整以包含这些特性。\n\
  \n#### 云安全模型与服务\n\n**云访问安全代理 (CASB)** 是一种安全策略执行解决方案，可以部署在本地，也可以基于云。CASB 的目标是强制执行并确保在云解决方案和客户组织之间实施适当的安全措施。\n\
  \n**安全即服务 (SECaaS)** 是一种云提供商概念，即通过或由一个在线实体向组织提供安全性。SECaaS 解决方案的目的是降低在本地实施和管理安全性的成本和开销。SECaaS\
  \ 通常实现基于软件的安全组件，不需要专用的本地硬件。SECaaS 安全组件可以包括广泛的安全产品，包括认证、授权、审计/核算、反恶意软件、入侵检测、合规性和漏洞扫描、渗透测试以及安全事件管理。\n\
  \n**云共享责任模型** 是这样一个概念：当组织使用云解决方案时，提供商和客户之间存在安全和稳定性责任的划分。不同形式的云服务（如 SaaS、PaaS 和 IaaS）可能各自具有不同的共享责任级别或划分点。SaaS\
  \ 解决方案将大部分管理负担放在云提供商肩上，而 IaaS 管理则更倾向于客户。在选择使用云服务时，重要的是要考虑管理、故障排除和安全管理的具体细节，以及这些责任如何在云提供商和客户之间分配、划分或共享。\n\
  \n### 网格计算\n\n**网格计算** 是一种并行分布式处理形式，它松散地将大量处理节点组合在一起，以实现特定的处理目标。网格成员可以随机加入和离开网格。通常，网格成员仅在其处理能力未被本地工作负载占用时才加入网格。当系统处于空闲状态时，它可以加入网格组，下载一小部分工作，并开始计算。当系统离开网格时，它会保存其工作，并可能将完成或部分完成的工作元素上传回网格。已经开发出许多有趣的网格计算用例，范围涵盖从搜寻外星智慧生命、执行蛋白质折叠、预测天气、模拟地震、规划财务决策到求解素数。\n\
  \n网格计算最大的安全顾虑在于每个工作包的内容可能暴露给全世界。许多网格计算项目面向全球开放，因此对谁可以运行本地处理应用程序并参与网格项目没有限制。这也意味着网格成员可能会保留每个工作包的副本并检查其内容。因此，网格项目不太可能保持机密性，不适用于私密、机密或专有数据。\n\
  \n网格计算的计算能力也可能随时大幅变化。工作包有时不会被返回、返回延迟或返回损坏。这需要大量的重新工作，并导致项目整体以及各个网格成员的速度、进度、响应能力和延迟出现不稳定。对时间敏感的项目可能无法获得足够的计算时间在特定的时间截止日期前完成。\n\
  \n\n\n\n\n### 网格计算\n\n网格计算通常使用中央主服务器核心来管理项目、跟踪工作包并整合返回的工作片段。如果中央服务器过载或离线，可能会导致网格完全失效或崩溃。然而，通常当中央网格系统无法访问时，网格成员会完成其当前的本地任务，然后定期轮询以发现中央服务器何时重新上线。还存在一种潜在风险，即中央网格服务器遭到攻破可能被利用来攻击网格成员，或诱骗网格成员执行恶意操作，而非网格社区的预期用途。\n\
  \n#### 对等网络\n\n**对等网络**技术是一种网络和分布式应用解决方案，可在对等节点之间共享任务和工作负载。这与网格计算类似；主要区别在于没有中央管理系统，且提供的服务通常是实时的，而非计算能力的集合。常见的\
  \ P2P 示例包括许多 VoIP 服务，如 Skype、BitTorrent（用于数据/文件分发）和 Spotify（用于流式音频/音乐分发）。\n\nP2P\
  \ 解决方案的安全顾虑包括：被认为会诱导盗版受版权保护的材料、能够窃听分发的内容、缺乏中央控制/监督/管理/过滤，以及服务可能消耗所有可用带宽的潜在风险。\n\n\
  #### 物联网\n\n**智能设备**是一系列移动设备，通过安装应用程序等方式为用户提供大量定制选项，并可利用设备端或云端的人工智能（AI）处理。可被标记为“智能设备”的产品范围在不断扩大，目前已包括智能手机、平板电脑、音乐播放器、家庭助手、极限运动相机和健身追踪器。\n\
  \n**物联网**是智能设备的一个新子类别，甚至是一个新类别，这些设备连接互联网，旨在为家庭或办公室环境中的传统或新型设备/电器提供自动化、远程控制或 AI 处理。IoT\
  \ 设备有时是对您可能已在本地手动执行了数十年的功能或操作的革命性改良，让您从此离不开它们。另一些 IoT 设备则不过是昂贵的花哨小工具，使用最初几分钟后就被遗忘和/或丢弃。与\
  \ IoT 相关的安全问题关乎访问控制和加密。IoT 设备往往在设计时未将安全作为核心概念，甚至未作为事后考量。这已经导致了大量家庭和办公室网络安全漏洞。此外，一旦攻击者获得对\
  \ IoT 设备的远程访问权限或通过其进行访问，他们可能能够访问受损网络上的其他设备。在决定安装 IoT 设备时，应评估设备的安全性以及供应商的安全声誉。如果新设备无法满足或接受您现有的安全基线，则不要仅为了一时新奇的小工具而妥协您的安全。\n\
  \n一种可能的安全实施方案是为 IoT 设备部署一个独立的网络，使其与主网络保持分离和隔离。这种配置通常被称为**三台傻瓜路由器**（参见 [`www.grc.com/sn/sn-545.pdf`](https://www.grc.com/sn/sn-545.pdf)\
  \ 或 [`www.pcper.com/reviews/General-Tech/Steve-Gibsons-Three-Router-Solution-IOT-Insecurity`](https://www.pcper.com/reviews/General-Tech/Steve-Gibsons-Three-Router-Solution-IOT-Insecurity)）。\n\
  \n虽然我们通常将智能设备和 IoT 与家庭或个人使用联系在一起，但它们也是每个组织关注的问题。这部分是因为员工在公司设施内甚至在组织网络上使用移动设备。网络专业人员关注的另一个方面是，许多\
  \ IoT 或网络自动化设备正被添加到业务环境中。这包括环境控制，如供暖、通风和空调（HVAC）管理、空气质量控制、碎屑和烟雾检测、照明控制、门禁自动化、人员和资产追踪，以及耗材库存管理和自动补货（如咖啡、零食、打印机碳粉、纸张和其他办公用品）。因此，智能设备和\
  \ IoT 设备都是现代业务网络的潜在组成部分，需要适当的安全管理和监督。有关智能设备和 IoT 设备进行适当安全管理重要性的更多阅读材料，请参阅“NIST Initiatives\
  \ in IoT”，网址为 [`www.nist.gov/itl/applied-cybersecurity/nist-initiatives-iot`](https://www.nist.gov/itl/applied-cybersecurity/nist-initiatives-iot)。\n\
  \n#### 工业控制系统\n\n**工业控制系统**是一种计算机管理设备，用于控制工业过程和机器。ICS 广泛应用于制造、加工、发电和配电、配水、污水处理和石油炼制等众多行业。ICS\
  \ 有多种形式，包括**分布式控制系统**、**可编程逻辑控制器**和**数据采集与监视控制系统**。\n\nDCS 单元通常用于工业过程工厂，在这些场所从单一位置收集数据并对大规模环境实施控制至关重要。DCS\
  \ 的一个重要方面是控制元件分布在受监控的环境中，例如制造车间或生产线，而集中监控位置向这些局部控制器发送命令，同时收集状态和性能数据。根据执行的任务或受控设备的不同，DCS\
  \ 可能是模拟或数字性质的。例如，液体流量阀 DCS 将是模拟系统，而电压调节器 DCS 很可能是数字系统。\n\nPLC 单元实际上是专用或特定用途的数字计算机。它们通常部署用于各种工业机电操作的管理和自动化，例如控制装配线上的系统或大规模数字灯光显示（如体育场的巨型显示系统或拉斯维加斯大道招牌上的显示屏）。\n\
  \nSCADA 系统可以作为独立设备运行，与其他 SCADA 系统联网，或与传统信息技术（IT）系统联网。大多数 SCADA 系统设计有极简的人机界面。通常，它们使用机械按钮和旋钮或简单的\
  \ LCD 屏幕界面（类似于商务打印机或 GPS 导航设备上的界面）。然而，联网的 SCADA 设备可能具有更复杂的远程控制软件界面。\n\n理论上，SCADA、PLC\
  \ 和 DCS 单元的静态设计及其极简的人机界面应使系统相当能抵抗攻破或修改。因此，这些工业控制设备内置的安全性很少，尤其是在过去。但近年来发生过几起著名的工业控制系统攻破事件；例如，Stuxnet\
  \ 向位于核设施的 SCADA 系统投递了首个根工具包。许多 SCADA 供应商已开始在其解决方案中实施安全改进，以防止或至少减少未来的攻破。然而，在实践中，SCADA\
  \ 和 ICS 系统通常仍然安全防护薄弱、漏洞众多且更新不频繁，未针对安全设计的旧版本仍广泛使用。\n\n### 评估和缓解基于 Web 的系统中的漏洞\n\n\
  \n\n\n\n### Web 安全评估与 SQL 注入攻击\n\n#### Web 应用漏洞与 OWASP\n\n在基于 Web 的系统中，存在各种各样的应用和系统漏洞及威胁，且范围在不断扩大。漏洞包括与可扩展标记语言（XML）和安全断言标记语言（SAML）相关的问题，以及由专注于开放社区的\
  \ Web 项目 **Open Web Application Security Project (OWASP)** 讨论的许多其他问题。\n\nOWASP 是一个非营利性安全项目，专注于改进在线或基于\
  \ Web 的应用程序的安全性。OWASP 不仅仅是一个组织，它还是一个庞大的社区，大家共同努力，自由分享与更好的编码实践和更安全的部署架构相关的信息、方法论、工具和技术。有关\
  \ OWASP 的更多信息以及参与社区，请访问 [www.owasp.org](http://www.owasp.org)。\n\nOWASP 组织维护了一份评估\
  \ Web 服务安全性的建议指南，地址为 [`www.owasp.org/index.php/Web_Application_Security_Testing_Cheat_Sheet`](https://www.owasp.org/index.php/Web_Application_Security_Testing_Cheat_Sheet)。OWASP\
  \ 还维护了一份十大最关键 Web 应用攻击清单，地址为 [`www.owasp.org/images/7/72/OWASP_Top_10-2017_%28en%29.pdf.pdf`](https://www.owasp.org/images/7/72/OWASP_Top_10-2017_%28en%29.pdf.pdf)。这两份文档都是规划组织\
  \ Web 服务安全评估或渗透测试的合理切入点。\n\n#### 安全评估流程\n\n任何安全评估都应从侦察或信息收集开始。此步骤旨在收集尽可能多的目标信息，供后续步骤使用。这通常包括查看每个托管的\
  \ Web 页面、发现正在使用的自动化技术、查找不应发布的信息，以及检查配置和安全泄露。\n\n随后进行站点配置管理评估（如文件处理、使用的扩展、备份、在客户端代码中查找敏感数据），并评估站点的传输安全性（如检查安全套接字层（SSL）/传输层安全性（TLS）版本支持、评估密码套件、Cookie/会话\
  \ ID/令牌管理，以及对伪造请求的易感性）。\n\nWeb 安全评估的下一步是评估身份认证和会话管理。随后评估站点的加密技术以及用于数据验证和清理的方法。Web\
  \ 安全评估还应涉及检查 DoS 防御、评估风险响应，并测试错误处理。\n\n这只是 Web 安全评估概念的简要概述，因为 CISSP 考试不要求你成为专业的渗透测试人员，但你应该大致了解安全评估的概念。如果你对这个主题感兴趣，欢迎从\
  \ OWASP 指南中探索更多关于 Web 安全评估的细节。\n\n> **注意**：你可能想了解的 OWASP 十大 Web 风险包括注入、XML 利用、跨站脚本（XSS）和\
  \ XSRF。\n\n#### 注入攻击\n\n**注入攻击**是指允许攻击者向目标系统提交代码，以修改其操作和/或污染和破坏其数据集的任何利用行为。存在各种潜在的注入攻击。通常，注入攻击以其利用的后端系统类型或投递（注入）到目标上的有效载荷类型命名。示例包括结构化查询语言（SQL）注入、轻量级目录访问协议（LDAP）、XML\
  \ 注入、命令注入、超文本标记语言（HTML）注入、代码注入和文件注入。本节将详细介绍其中几种。\n\n###### SQL 注入攻击\n\n从组织的角度来看，**SQL\
  \ 注入攻击**比 XSS 攻击（见下节）风险更大，因为 SQL 注入攻击的目标是组织资产，而 XSS 攻击的目标是网站的客户或访问者。SQL 注入攻击利用意外输入来更改或破坏\
  \ Web 应用程序。然而，SQL 注入攻击不是利用此输入试图欺骗用户，而是利用它来获得对底层数据库及相关资产的未授权访问。\n\n##### Web 应用演进背景\n\
  \n在 Web 早期，所有网页都是**静态**的，即不变的。网站管理员创建包含信息的网页并将其放置在 Web 服务器上，用户可使用其 Web 浏览器检索这些页面。Web\
  \ 迅速超越了这一模式，因为用户希望能够根据个人需求访问定制信息。例如，银行网站的访问者不仅对包含银行位置、营业时间和服务信息的静态页面感兴趣，他们还想检索包含其个人账户信息的**动态**内容。显然，网站管理员不可能在\
  \ Web 服务器上为每个用户创建包含该用户个人账户信息的页面。在大型银行中，这将要求维护数百万个包含最新信息的页面。这就是动态 Web 应用程序发挥作用的地方。\n\
  \nWeb 应用程序利用数据库在用户发出请求时按需创建内容。在银行示例中，用户登录 Web 应用程序，提供账号和密码。Web 应用程序随后从银行数据库检索当前账户信息，并利用它即时创建包含用户当前账户信息的网页。如果该用户一小时后返回，Web\
  \ 服务器将重复该过程，从数据库获取更新的账户信息。\n\n##### 安全架构影响\n\n作为安全专业人员，这对你意味着什么？Web 应用程序增加了传统安全模型的复杂性。Web\
  \ 服务器作为公共可访问服务器，属于独立的网络区域，通常称为**非军事区（DMZ）**，与其他服务器分离。另一方面，数据库服务器不面向公众访问，因此属于内部网络，或至少是与\
  \ DMZ 隔离的安全子网。Web 应用程序需要访问数据库，因此防火墙管理员必须创建一条规则，允许从 Web 服务器访问数据库服务器。这条规则为互联网用户访问数据库服务器创建了一条潜在路径。\n\
  \n如果 Web 应用程序运行正常，它只允许对数据库进行授权请求。然而，如果 Web 应用程序存在缺陷，它可能会让个人通过 **SQL 注入攻击**以意想不到且未授权的方式篡改数据库。这些攻击允许恶意个人直接针对底层数据库执行\
  \ SQL 事务。SQL 注入攻击可能使攻击者绕过身份认证、从数据库表中泄露机密数据、更改现有数据、向数据库添加新记录、销毁整个表或数据库，甚至通过某些数据库功能（如命令\
  \ Shell 存储过程）获得类命令行访问权限。\n\n### 防御 SQL 注入的两种技术\n\n你可以使用两种技术来保护 Web 应用程序免受 SQL 注入攻击。\n\
  \n#### 1. 执行输入验证\n\n输入验证可让你限制用户在表单中提供的数据类型。存在许多输入注入或操纵攻击的变体，需要广谱防御方法，包括白名单和黑名单过滤器。应采用的主要输入清理形式包括限制输入长度、基于已知恶意内容模式进行过滤，以及转义**元字符**。\n\
  \n#### 2. 限制账户权限\n\nWeb 服务器使用的数据库账户应拥有尽可能小的权限集。如果 Web 应用程序只需检索数据，则应仅具备该能力。\n\n\n\
  \n\n\n### SQL 注入及相关攻击\n\n归根结底，SQL 注入是处理前端（通常是 Web 服务器）与后端数据库交互的脚本的漏洞。如果脚本编写时采取了防御措施，并包含转义（使无效或拒绝）元字符的代码，则\
  \ SQL 注入将不可能发生。\n\n#### LDAP 注入\n\n**LDAP 注入**是输入注入攻击的一种变体；然而，攻击的焦点在于 LDAP 目录服务的后端，而非数据库服务器。如果\
  \ Web 服务器前端使用脚本根据用户输入构建 LDAP 语句，则 LDAP 注入可能构成威胁。正如 SQL 注入一样，输入清理和防御性编码对于消除此威胁至关重要。\n\
  \n#### XML 注入\n\n**XML 注入**是 SQL 注入的另一种变体，其后端目标是 XML 应用程序。同样，输入清理对于消除此威胁是必要的。\n\n\
  #### XML 利用\n\n**XML 利用**是一种编程攻击形式，用于伪造发送给访问者的信息，或导致其系统在未经授权的情况下泄露信息。关于 XML 攻击，一个日益令人担忧的领域是**安全断言标记语言\
  \ (SAML)**。SAML 滥用通常集中在基于 Web 的身份认证上。SAML 是一种基于 XML 的约定，用于在安全域之间组织和交换通信身份认证和授权详细信息，通常通过\
  \ Web 协议进行。SAML 常用于提供基于 Web 的 SSO（单点登录）解决方案。如果攻击者能够伪造 SAML 通信或窃取访问者的访问令牌，他们可能能够绕过身份认证并获得对站点的未授权访问。\n\
  \n#### 跨站脚本 (XSS)\n\n**跨站脚本 (XSS)** 是一种恶意代码注入攻击形式，攻击者能够攻破 Web 服务器，并将其自己的恶意代码注入发送给其他访问者的内容中。黑客已经发现了许多巧妙的方法，通过通用网关接口\
  \ (CGI) 脚本、Web 服务器软件漏洞、SQL 注入攻击、框架利用、DNS 重定向、Cookie 劫持以及许多其他形式的攻击，将恶意代码注入网站。成功的\
  \ XSS 攻击可能导致身份盗窃、凭证窃取、数据窃取、财务损失，或在访问客户端上植入远程控制软件。\n\n对于网站管理员而言，防御 XSS 的措施包括维护已修补的\
  \ Web 服务器、使用 Web 应用防火墙、运行基于主机的入侵检测系统 (HIDS)、审计可疑活动，最重要的是执行服务器端输入验证，包括长度检查、恶意内容检查和元字符过滤。作为\
  \ Web 用户，您可以通过保持系统已修补、运行防病毒软件、避免访问非主流网站来防御 XSS。某些 Web 浏览器有插件，例如 Firefox 的 NoScript\
  \ 和 Chrome 的 uBlock Origin，它们仅允许执行您选择的脚本。\n\n#### 跨站请求伪造 (XSRF)\n\n**跨站请求伪造 (XSRF)**\
  \ 是一种性质类似于 XSS 的攻击。然而，XSRF 的攻击焦点更多地在于访问用户的 Web 浏览器，而非被访问的网站。XSRF 的主要目的是诱骗用户或用户的浏览器执行其未打算或未授权的操作。这可能包括注销会话、上传站点\
  \ Cookie、更改账户信息、下载账户详情、进行购买等。XSRF 的一种形式会用恶意软件感染受害者的系统，该软件保持休眠状态，直到访问特定网站。然后恶意软件以用户身份伪造请求，以欺骗\
  \ Web 服务器并对 Web 服务器和/或客户端执行恶意操作。\n\n利用 XSRF 的一个此类漏洞示例是 Zeus，它会隐藏在受害者的系统中，直到用户访问其网上银行站点；随后，在检查其账户余额并确定其银行账号后，这些详细信息会被发送给控制攻击者，后者会发起\
  \ ACH 转账到另一家银行。因此，这是恶意软件协助直接从受害者账户窃取资金的一个示例。\n\n网站管理员可以通过在连接的客户端请求敏感或高风险操作时要求确认或重新认证，来实施针对\
  \ XSRF 的预防措施。这可能包括要求用户重新输入密码、通过短信或电子邮件向用户发送必须提供回网站的代码、触发基于电话的验证，或解决全自动区分计算机和人类的图灵测试\
  \ (CAPTCHA)（一种区分人类和软件机器人的机制）。另一种潜在的保护机制是向每个 URL 请求和会话建立添加一个随机字符串（称为**一次性数 (nonce)**），并检查客户端\
  \ HTTP 请求头引用页是否存在欺骗。最终用户可以养成更安全的习惯，例如运行反恶意软件扫描器；使用 HIDS；运行防火墙；避免访问非主流网站；始终从网站注销，而不是关闭浏览器、关闭标签页或转到另一个\
  \ URL；保持浏览器已修补；并定期清理临时文件和缓存的 Cookie。\n\n关于 XSS 和 XSRF 的更多内容，请参见第 21 章“恶意代码和应用程序攻击”。\n\
  \n### 评估和缓解移动系统中的漏洞\n\n随着智能手机和其他**移动设备**越来越多地具备与互联网以及企业网络交互的能力，它们带来的安全风险也日益增加。当个人拥有的设备被允许在没有限制、监督或控制的情况下进出安全设施时，潜在危害是巨大的。\n\
  \n恶意内部人员可以通过各种存储设备从外部带入恶意代码，包括手机、音频播放器、数码相机、存储卡、光盘和通用串行总线 (USB) 驱动器。这些相同的存储设备可用于泄露或窃取内部机密和私人数据，以便向外界披露。（您认为\
  \ WikiLeaks 上的大部分内容来自哪里？）恶意内部人员可以执行恶意代码、访问危险网站，或故意执行有害活动。\n\n移动设备通常包含敏感数据，如联系人、短信、电子邮件，以及可能的笔记和文档。任何带有摄像头功能的移动设备都可以拍摄敏感信息或地点的照片。移动设备的丢失或被盗可能意味着个人和/或企业机密的泄露。\n\
  \n移动设备是黑客和恶意代码的常见目标。重要的是要将非必要信息保留在便携设备之外，运行防火墙和防病毒产品（如果可用），并保持系统锁定和/或加密（如果可能）。\n\
  \n许多移动设备还支持 USB 连接，以便与台式机和/或笔记本电脑同步通信和联系人，以及传输文件、文档、音乐、视频等。\n\n此外，移动设备也无法免疫窃听。借助合适类型的复杂设备，大多数移动电话通话都可能被窃听——更不用说任何\
  \ 15 英尺范围内的人都能听到您在说话。通过手机讨论事情时要小心，尤其是在公共场所。\n\n移动设备上提供了广泛的安全功能。然而，支持某项功能并不等同于该功能已正确配置并启用。只有当安全功能生效时，才能获得安全收益。请务必检查设备上所有期望的安全功能是否按预期运行。\n\
  \n### 设备安全\n\n\n\n\n### 设备安全\n\n设备安全是指移动设备可能提供的各种潜在安全选项或功能。并非所有`便携式电子设备 (PEDs)`都具备良好的安全功能。但即使设备拥有安全功能，除非启用并正确配置，否则它们毫无价值。在做出购买决定前，请务必考虑新设备的安全选项。\n\
  \n#### 全设备加密\n\n某些移动设备（包括便携式计算机、平板电脑和手机）可能提供设备加密。如果设备的大部分或全部存储介质均可加密，这通常是一项值得启用的功能。然而，加密并不能保证数据绝对安全，特别是当设备在解锁状态下被盗，或系统本身存在已知的后门攻击漏洞时。\n\
  \n当使用网络电话协议 (VoIP) 服务时，移动设备上可能实现语音加密。计算机类设备之间的 VoIP 服务比连接传统固定电话或普通手机的 VoIP 连接更有可能提供加密选项。当语音通话被加密后，窃听将变得毫无意义，因为通话内容无法解读。\n\
  \n#### 远程擦除\n\n如果设备丢失或被盗，执行`远程擦除`或`远程清理`正变得越来越普遍。远程擦除允许你从远处删除设备上的所有数据，甚至可能包括配置设置。擦除过程可通过移动电话服务触发，有时也可通过任何互联网连接触发。然而，远程擦除并不能保证数据安全。窃贼可能足够聪明，在导出数据的同时阻断会触发擦除功能的连接。此外，远程擦除主要是一种删除操作。使用取消删除或数据恢复工具，通常可以恢复已擦除设备上的数据。为确保远程擦除能销毁数据使其无法恢复，设备应当加密。这样，取消删除操作恢复的仅是加密数据，攻击者将无法解读。\n\
  \n#### 锁定\n\n移动设备上的锁定类似于公司工作站上的账户锁定。当用户在反复尝试后未能提供凭据时，账户或设备将被禁用（锁定）一段时间，或直到管理员清除锁定标志。\n\
  \n移动设备可能提供锁定功能，但仅在配置了屏幕锁定时才会生效。否则，简单的屏幕滑动解锁无法提供足够的安全性，因为未发生认证过程。某些设备会随着认证失败次数的增加，触发越来越长的访问尝试延迟。某些设备允许设定尝试次数（如三次），超限后触发持续数分钟的锁定。其他设备则触发持久锁定，要求使用不同的账户或主密码/代码才能重新获得设备访问权。\n\
  \n#### 屏幕锁定\n\n屏幕锁定旨在防止他人随意拿起你的手机或移动设备即可使用。然而，大多数屏幕锁定可通过滑动图案或在键盘显示上输入数字来解锁。这两者都不是真正安全的操作。屏幕锁定可能存在变通方法，例如通过紧急呼叫功能访问电话应用程序。而且，如果黑客通过蓝牙、无线网络或\
  \ USB 线缆连接设备，屏幕锁定不一定能保护设备。\n\n屏幕锁定通常在非使用超时期后触发。如果系统闲置几分钟，大多数 PC 会自动触发受密码保护的屏幕保护程序。同样，许多平板电脑和手机会在\
  \ 30-60 秒后触发屏幕锁定，并调暗或关闭显示屏。锁定功能确保当你离开设备、设备丢失或被盗时，其他人将难以访问你的数据或应用程序。要解锁设备，你必须输入密码、代码或\
  \ PIN；绘制图案；提供虹膜或面部进行识别；扫描指纹；或使用近距离设备，如近场通信 (NFC) 或射频识别 (RFID) 戒指或标签。\n\n#### GPS\n\
  \n许多移动设备包含全球定位系统 (GPS) 芯片，以支持并受益于基于位置的服务（如导航），因此可以追踪这些设备。GPS 芯片本身通常只是来自轨道 GPS 卫星信号的接收器。然而，移动设备上的应用程序可以记录设备的\
  \ GPS 位置，然后将其上报给在线服务。你可以使用 GPS 追踪来监控自己的移动，追踪他人（如未成年人或送货人员）的移动，或追回被盗设备。但要使 GPS 追踪生效，移动设备必须具备互联网或无线电话服务，以便通信其位置信息。\n\
  \n#### 应用程序控制\n\n`应用程序控制`是一种设备管理解决方案，用于限制可安装到设备上的应用程序。它也可用于强制安装特定应用程序，或强制执行某些应用程序的设置，以支持安全基线或维护其他形式的合规性。使用应用程序控制通常可以通过限制用户安装来自未知来源或提供非工作相关功能的应用程序的能力，从而降低遭遇恶意应用程序的风险。\n\
  \n#### 存储分段\n\n`存储分段`用于在存储介质上人为地隔离各种类型或价值的数据。在移动设备上，设备制造商和/或服务提供商可能使用存储分段，将设备的操作系统和预装应用与用户安装的应用和用户数据隔离开。某些移动设备管理系统进一步实施存储分段，以将公司数据和应用与用户数据和应用分离。\n\
  \n#### 资产追踪\n\n资产追踪是用于维护库存（如已部署的移动设备）监管的管理流程。资产追踪系统可以是被动或主动的。被动系统依赖资产本身定期向管理服务签到，或在员工每次到岗时检测到设备在场。主动系统使用轮询或推送技术向设备发送查询以引出响应。\n\
  \n你可以使用资产追踪来验证设备是否仍在指派的授权用户手中。某些资产追踪解决方案可以定位丢失或被盗的设备。\n\n某些资产追踪解决方案超越了硬件库存管理，可监管设备上安装的应用、应用使用情况、存储的数据和数据访问。你可以使用此类监控来验证是否遵守安全准则，或检查机密信息是否暴露给未授权实体。\n\
  \n#### 库存控制\n\n术语`库存控制`可能描述硬件资产追踪（如前一主题所述）。然而，它也可以指利用移动设备作为在仓库或储物柜中追踪库存的手段。大多数移动设备都有摄像头。利用移动设备摄像头，可拍照或扫描条形码的应用程序可用于追踪实物商品。那些具备\
  \ RFID 或 NFC 功能的移动设备，可能能够与已电子标记的物体或其容器进行交互。\n\n#### 移动设备管理\n\n\n\n\n### 移动设备管理 (MDM)\n\
  \n*移动设备管理 (MDM)* 是一种软件解决方案，旨在应对管理员工用于访问公司资源的海量移动设备这一极具挑战性的任务。MDM 的目标是提高安全性、提供监控、启用远程管理并支持故障排除。许多\
  \ MDM 解决方案支持多种设备，并可跨多个服务提供商运行。您可以使用 MDM 通过空中接口（跨运营商网络）和 Wi-Fi 连接来推送或移除应用、管理数据以及强制执行配置设置。MDM\
  \ 可用于管理公司自有设备以及个人自有设备（例如在自带设备 [BYOD] 环境中）。\n\n#### 设备访问控制\n\n如果锁定手机能提供真正的安全性，那么在手机或其他移动设备上设置强密码将是个好主意。但许多移动设备并不安全，因此即使设置了强密码，设备仍可通过蓝牙、无线网络或\
  \ USB 线缆访问。如果某个特定移动设备在启用系统锁时会阻止对设备的访问，那么将其设置为在一段时间不活动后或手动初始化后自动触发，将是一项值得拥有的功能。通常只有当您同时启用设备密码和存储加密时，才能获得这一益处。\n\
  \n您应考虑任何能减少未经授权访问移动设备的手段。许多 MDM 解决方案可以强制配置屏幕锁定，并防止用户禁用该功能。\n\n#### 可移动存储\n\n许多移动设备支持可移动存储。某些设备支持\
  \ microSD 卡，可用于扩展移动设备上的可用存储空间。然而，大多数手机需要拆卸后盖，有时甚至需要取出电池，才能添加或移除存储卡。较大的手机、平板电脑和笔记本电脑可能支持设备侧面易于访问的卡槽。\n\
  \n许多移动设备还支持外部 USB 存储设备，如闪存驱动器和外置硬盘。这些设备可能需要特殊的随插即用 (OTG) 线缆。\n\n此外，还有移动存储设备，它们通过内置无线接口提供基于蓝牙或\
  \ Wi-Fi 的存储数据访问。\n\n#### 禁用未使用的功能\n\n尽管启用安全功能对于发挥其有益作用至关重要，但移除非业务任务或常见个人使用所必需的应用并禁用非必需功能同样重要。启用的功能范围越广、安装的应用越多，利用漏洞或软件缺陷导致设备及/或其所含数据受损的可能性就越大。遵循加固等通用安全实践，可减少移动设备的攻击面。\n\
  \n#### 应用安全\n\n除了管理移动设备的安全性外，您还需要关注这些设备上使用的应用和功能。桌面或笔记本系统上的大多数软件安全顾虑，同样适用于移动设备，正如常识性安全实践一样。\n\
  \n##### 密钥管理\n\n涉及加密时，密钥管理始终是一个关注点。加密系统的大多数故障源于密钥管理，而非算法本身。良好的密钥选择取决于随机数的质量和可用性。大多数移动设备必须在本地依赖劣质的随机数生成机制，或通过无线链路访问更强健的随机数生成器\
  \ (RNG)。密钥创建后，需要以最大程度降低丢失或泄露风险的方式进行存储。密钥存储的最佳选择通常是可移动硬件或使用可信平台模块 (TPM)，但这些在手机和平板电脑上很少见。\n\
  \n##### 凭据管理\n\n在中心位置存储凭据称为凭据管理。考虑到互联网站点和服务种类繁多，每个都有其特定的登录要求，使用唯一的用户名和密码可能会成为一种负担。*凭据管理解决方案*\
  \ 提供了一种安全存储大量凭据集的方法。这些工具通常采用一组主凭据（首选多因素认证）在需要时解锁数据集。某些凭据管理选项甚至可以为应用和网站提供自动登录功能。\n\
  \n##### 认证\n\n对移动设备进行认证或通过移动设备进行认证通常相当简单，尤其是对于手机和平板电脑。然而，滑动或图案解锁不应被视为真正的认证。只要可能，请使用密码、提供个人识别码\
  \ (PIN)、提供虹膜或面部进行识别、扫描指纹，或使用近场设备，如 NFC 或 RFID 戒指/贴片。如果正确实施，这些设备认证方式对窃贼来说更难绕过。如前所述，将设备认证与设备加密相结合，以阻止通过连接线缆访问存储信息，也是明智之举。\n\
  \n##### 地理标记\n\n支持 GPS 的移动设备可将地理位置（以纬度和经度形式）以及日期/时间信息嵌入到使用这些设备拍摄的照片中。这使得潜在攻击者（或愤怒的前任）可以查看社交网络或类似网站上的照片，并准确判断照片拍摄的时间和地点。这种*地理标记*可能被用于不法目的，例如确定某人通常何时进行例行活动。\n\
  \n一旦带有地理标记的照片被上传到互联网，潜在的网络跟踪者可能获取的信息比上传者预期的更多。这是最终用户安全意识简报的主要素材。\n\n### 加密\n\n加密通常是防止未经授权访问数据（无论是存储中还是传输中）的有用保护机制。大多数移动设备提供某种形式的存储加密。如果可用，应予以启用。某些移动设备原生支持通信加密，但大多数可以运行附加软件（应用），为数据会话、语音通话和/或视频会议添加加密。\n\
  \n##### 应用白名单\n\n*应用白名单* 是一种安全选项，可禁止未经授权的软件执行。白名单也称为*默认拒绝*或*隐式拒绝*。在应用安全中，白名单可防止任何及所有软件（包括恶意软件）执行，除非它位于预先批准的例外列表（即白名单）中。这与典型的设备安全立场（即默认允许、例外拒绝，也称为黑名单）有显著不同。\n\
  \n由于恶意软件的增长，应用白名单方法是为数不多的仍显示出真正保护设备和数据希望的选项之一。然而，没有任何安全解决方案是完美的，白名单也不例外。所有已知的白名单解决方案都可能通过内核级漏洞和应用配置问题被绕过。\n\
  \n#### BYOD 顾虑\n\n*自带设备 (BYOD)* 是一项允许员工将个人移动设备带入工作场所，并使用这些设备连接到（或通过）公司网络以访问业务资源和/或互联网的政策。虽然\
  \ BYOD 可能提高员工士气和工作满意度，但它增加了组织的安全风险。如果 BYOD 政策是开放式的，则允许任何设备连接到公司网络。并非所有移动设备都具备安全功能，因此此类政策允许不合规设备进入生产网络。强制规定特定设备的\
  \ BYOD 政策可能会降低这种风险，但反过来可能要求公司为无法自行购买合规设备的员工采购设备。许多其他 BYOD 顾虑将在以下章节中讨论。\n\n除了 BYOD\
  \ 政策外，还有几种替代方案，包括 COPE、CYOD、公司自有和 VDI。\n\n\n\n\n\n### 移动设备策略与管理\n\n#### 设备所有权模式\n\
  \n**公司拥有、个人启用 (COPE)** 的概念是指组织购买设备并提供给员工。每个用户随后能够自定义设备，并将其用于工作活动和个人活动。COPE 允许组织精确选择允许接入组织网络的设备——具体而言，仅限那些可配置为符合安全策略的设备。\n\
  \n**自选设备 (CYOD)** 的概念为用户提供了一份经批准的设备清单供其选择。CYOD 可通过两种方式实施：员工从批准清单中自行购买设备（BYOD 变体），或公司为员工购买设备（COPE\
  \ 变体）。\n\n**企业拥有的移动策略** 是指公司购买可支持符合安全策略的安全合规性的移动设备。这些设备专供公司业务使用，用户不应在设备上执行任何个人任务。这通常要求工作人员携带第二台设备供个人使用。\n\
  \n**虚拟桌面基础设施 (VDI)** 通过在中央服务器上托管虚拟机并由用户远程访问，以降低终端设备的安全风险和性能要求。VDI 已应用于移动设备，并广泛用于平板电脑和笔记本电脑。它是一种在中央服务器上保留存储控制权、获取更高级别的系统处理能力及其他资源、并允许低端设备访问其硬件容量之外的软件和服务的手段。\n\
  \n这催生了 **虚拟移动基础设施 (VMI)**，即移动设备的操作系统在中央服务器上虚拟化。因此，传统移动设备的大多数操作和活动不再发生在移动设备本身上。这种远程虚拟化使组织拥有比使用标准移动设备平台更大的控制权和安全性。它还能使个人拥有的设备与\
  \ VDI 交互，而不增加风险配置。该概念需要专用的隔离无线网络，以限制 BYOD 设备直接与公司资源交互，仅允许通过 VDI 解决方案进行交互。\n\n用户需要了解在工作中使用自有设备的益处、限制和后果。阅读并签署\
  \ BYOD、COPE、CYOD 等策略，并参加概述或培训计划，可能足以实现合理的安全意识。\n\n#### 数据所有权\n\n当个人设备用于业务任务时，个人数据和业务数据很可能会混合存储。部分设备支持存储分段，但并非所有设备都能提供数据类型隔离。确立数据所有权可能很复杂。例如，如果设备丢失或被盗，公司可能希望触发远程擦除，清除设备上的所有有价值信息。然而，员工通常会抵制这一点，特别是如果设备有找回或归还的希望时。擦除可能会移除所有业务和个人数据，这对个人可能是重大损失——尤其是设备被找回时，擦除似乎就成了过度反应。应建立明确的数据所有权策略。部分\
  \ MDM 解决方案可提供数据隔离/分段，并支持在不影响个人数据的情况下清理业务数据。\n\n移动设备策略中关于数据所有权的部分应涵盖移动设备备份。业务数据和个人数据均应受备份解决方案保护——要么是针对设备上所有数据的单一解决方案，要么是针对每种数据类型或类别的独立解决方案。这可降低因远程擦除事件以及设备故障或损坏导致数据丢失的风险。\n\
  \n#### 支持所有权\n\n当员工的移动设备发生故障、错误或损坏时，谁负责设备的维修、更换或技术支持？移动设备策略应明确公司将提供何种支持，以及由个人（及其服务提供商，如相关）承担何种支持。\n\
  \n#### 补丁管理\n\n移动设备策略应定义个人拥有的移动设备的补丁管理方式和机制。用户是否负责安装更新？用户是否应安装所有可用更新？组织是否应在设备安装前测试更新？更新是通过空中下载（通过服务提供商）还是通过\
  \ Wi-Fi 处理？是否有不可使用的移动操作系统版本？需要什么补丁或更新级别？\n\n#### 杀毒软件管理\n\n移动设备策略应规定是否在移动设备上安装杀毒、反恶意软件和反间谍软件扫描器。策略应指明推荐使用的产品/应用，以及这些解决方案的设置。\n\
  \n#### 取证\n\n移动设备策略应涉及与移动设备相关的取证和调查。用户需知晓，在发生安全违规或犯罪活动时，其设备可能涉案。这将强制要求从这些设备收集证据。某些取证过程可能具有破坏性，某些法律调查要求没收设备。\n\
  \n#### 隐私\n\n移动设备策略应涉及隐私和监控。当个人设备用于业务任务时，用户通常会失去在工作中使用移动设备前享有的部分或全部隐私。工作人员可能需要同意在其移动设备上被追踪和监控，即使不在公司财产上和非工作时间也是如此。在\
  \ BYOD 下使用的个人设备应被个人视为准公司财产。\n\n#### 入职/离职\n\n移动设备策略应涵盖个人移动设备的入职和离职程序。移动设备入职包括安装安全、管理和生产力应用，以及实施安全高效的配置设置。移动设备离职包括正式擦除业务数据并移除任何业务专用应用。在某些情况下，可能规定完全擦除设备并恢复出厂设置。\n\
  \n#### 遵守公司策略\n\n移动设备策略应明确指出，将个人移动设备用于业务活动并不免除工作人员遵守公司策略的责任。工作人员应将移动设备视为公司财产，因此即使在非工作场所和非工作时间也应遵守所有限制。\n\
  \n#### 用户接受\n\n移动设备策略需对在工作中使用个人设备的所有要素进行清晰具体的规定。对许多用户而言，公司策略下实施的限制、安全设置和 MDM 追踪将比他们预期的更为繁重。因此，组织应努力在允许个人设备进入生产环境前，充分解释移动设备策略的细节。仅当员工表示同意并接受（通常通过签名）后，其设备才应进行入职。\n\
  \n#### 架构/基础设施考量\n\n\n\n\n### 实施移动设备策略时\n\n在实施移动设备策略时，组织应评估其网络和安全设计、架构及基础设施。如果每位员工都自带个人设备，网络上的设备数量可能会翻倍。这需要规划来处理\
  \ IP 地址分配、通信隔离、数据优先级管理，以及入侵检测系统 (IDS)/入侵防御系统 (IPS) 监控负载的增加，还有内部和跨互联网链路带宽消耗的增加。大多数移动设备都支持无线功能，因此这很可能需要更强大的无线网络，并应对\
  \ Wi-Fi 拥塞和干扰。移动设备策略需结合其将引发的额外基础设施成本予以考量。\n\n#### 法律顾虑\n\n公司律师应评估移动设备的法律顾虑。在执行业务任务时使用个人设备，可能意味着责任负担加重和数据泄露风险增加。移动设备或许能让员工满意，但对组织而言，可能并非一项值得或具有成本效益的举措。\n\
  \n#### 可接受使用策略\n\n移动设备策略应引用公司的可接受使用策略，或包含一个专注于独特问题的移动设备专用版本。随着个人移动设备在工作中使用，信息泄露、分心和访问不当内容的风险增加。员工应时刻铭记，在工作时的首要目标是完成生产力任务。\n\
  \n#### 载入相机/摄像头\n\n移动设备策略需涉及带有载入相机的移动设备。某些环境禁止任何类型的相机。这将要求移动设备不得带有相机。如果允许使用相机，应明确记录并向员工解释何时可以使用、何时不得使用。移动设备可充当存储设备，提供通往外部提供商或服务的备用无线连接路径，还可用于采集泄露机密信息或设备的图像和视频。\n\
  \n### 评估并缓解嵌入式设备和网络物理系统中的漏洞\n\n**嵌入式系统** 是作为大型系统一部分实现的计算机。嵌入式系统通常围绕一组有限的特定功能进行设计，这些功能与其作为组件的大型产品相关。它可能由典型计算机系统中相同的组件组成，也可能是一个\
  \ **微控制器** (一种带有板载内存和外设端口的集成芯片)。嵌入式系统的示例包括网络连接打印机、智能电视、暖通空调 (HVAC) 控制器、智能家电、智能恒温器、车载娱乐/驾驶辅助/自动驾驶系统以及医疗设备。\n\
  \n与嵌入式系统类似的另一个概念是 **静态系统** (又称 **静态环境**)。**静态环境** 是一组不变的条件、事件和周围环境。理论上，一旦被理解，静态环境不会提供新的或令人惊讶的元素。**静态\
  \ IT 环境** 是指旨在保持不变、不被用户和管理员更改的任何系统。其目标是防止，或至少减少用户实施可能导致安全性或功能操作降低的变更的可能性。\n\n在技术领域，静态环境是指为特定需求、能力或功能配置的应用程序、操作系统、硬件集合或网络，随后设置为保持未改变状态。然而，尽管使用了\
  \ **静态** 一词，但不存在真正的静态系统。硬件故障、硬件配置变更、软件漏洞、软件设置变更或漏洞利用始终有可能改变环境，导致不期望的操作参数或实际的安全入侵。\n\
  \n#### 嵌入式系统和静态系统的示例\n\n**网络启用设备** 是指具有原生网络功能的任何类型的便携式或非便携式设备。这通常假设相关网络为无线网络，主要指移动电信公司提供的网络。不过，它也可以指连接\
  \ Wi-Fi 的设备（尤其是能自动连接的设备）、从无线电信服务共享数据连接的设备（如 **移动热点**），以及带有用于接收标准以太网电缆进行有线连接的 RJ-45\
  \ 接口的设备。网络启用设备包括智能手机、移动电话、平板电脑、智能电视、机顶盒、或 HDMI 棒状流媒体播放器（如 **Roku Player**、**Amazon\
  \ Fire TV** 或 **Google Android TV/Chromecast**）、网络连接打印机、游戏系统等。\n\n**网络物理系统** 是指提供计算手段来控制物理世界中事物的设备。过去这些可能被称为嵌入式系统，但网络物理系统这一类别似乎更侧重于物理世界的结果，而非计算方面。网络物理设备和系统本质上是机器人技术和传感器网络中的关键元素。基本上，任何能导致现实世界中发生运动的计算设备都被视为机器人元件，而任何能检测物理状况（如温度、光线、运动和湿度）的此类设备则是传感器。网络物理系统的示例包括提供人体增强或辅助的假肢、车辆防撞系统、空中交通管制协调、机器人手术的精准操作、危险环境下的远程操作，以及车辆、设备、移动设备和建筑中的节能系统。\n\
  \n网络物理系统、嵌入式系统和网络启用设备的另一个延伸是 **物联网** 。如前所述，物联网是指能够通过互联网相互通信或与控制台通信，以影响和监控现实世界的设备集合。物联网设备可能被标记为智能设备或智能家居设备。办公楼中工业环境控制的许多理念，正逐渐进入面向小型办公室或个人家庭的消费级解决方案。物联网不限于固定位置设备，也可用于陆地、空中或水上载具，或移动设备上。物联网设备通常属于静态系统，因为它们可能仅运行制造商提供的固件。\n\
  \n**大型机** 是用于执行高度复杂计算和提供大量数据处理的高端计算机系统。较老的大型机可被视为静态环境，因为它们通常围绕单一任务设计，或支持单一关键任务应用程序。这些配置没有提供显著的灵活性，但确实提供了高稳定性和长期运行能力。许多大型机能够运行数十年。\n\
  \n现代大型机灵活得多，常用于提供高速计算能力以支持众多虚拟机。每个虚拟机可用于托管独特的操作系统，进而支持广泛的应用程序。如果现代大型机被实施为为某个操作系统或应用程序提供固定或静态支持，则可被视为静态环境。\n\
  \n**游戏主机**，无论是家用系统还是便携式系统，都可能是静态系统的示例。游戏主机的操作系统通常是固定的，仅在供应商发布系统升级时才会更改。此类升级通常是操作系统、应用程序和固件改进的混合体。尽管游戏主机的功能通常专注于玩游戏和媒体，但现代主机可能支持一系列经过筛选的第三方应用程序。应用程序支持越灵活、开放，它作为静态系统的特性就越弱。\n\
  \n\n\n### 车载计算系统\n\n车载计算系统可包含用于监控发动机性能并优化制动、转向和悬架的组件，还可包含与驾驶、环境控制和娱乐相关的仪表盘元素。早期的车载系统是静态环境，几乎没有或完全没有调整或更改的能力，尤其是车主/驾驶员无法更改。现代车载系统可能提供更广泛的功能，包括连接移动设备或运行自定义应用程序。\n\
  \n### 保护嵌入式和静态系统的方法\n\n关于嵌入式和静态系统的安全顾虑在于，大多数系统的设计重点是尽量降低成本和非必要功能。这往往导致缺乏安全性，且难以进行升级或打补丁。由于嵌入式系统控制着物理世界中的机制，安全漏洞可能会对人员和财产造成伤害。\n\
  \n静态环境、嵌入式系统以及其他受限或单一用途的计算环境需要安全管理。尽管它们的攻击面可能不如通用计算机广泛，面临的风险也不那么多，但它们仍然需要适当的安全治理。\n\
  \n#### 网络分段\n\n**网络分段**涉及控制网络设备之间的流量。当网络与所有外部通信隔离时，会发生完全或物理网络分段，因此事务只能在分段网络内的设备之间发生。您可以使用虚拟局域网（VLAN）通过交换机实施逻辑网络分段，或通过其他流量控制手段，包括\
  \ MAC 地址、IP 地址、物理端口、TCP 或 UDP 端口、协议、应用程序过滤、路由和访问控制管理。网络分段可用于隔离静态环境，以防止更改和/或漏洞利用到达它们。\n\
  \n#### 安全层\n\n**安全层**存在于将具有不同分类级别或敏感度的设备分组在一起，并将它们与其他不同级别的组隔离开的地方。这种隔离可以是绝对的，也可以是单向的。例如，较低级别可能无法发起与较高级别的通信，但较高级别可以发起与较低级别的通信。隔离也可以是逻辑的或物理的。逻辑隔离要求在数据和数据包上使用分类标签，网络管理、操作系统和应用程序必须尊重并强制执行这些标签。物理隔离要求在不同安全级别的网络之间实施网络分段或空气间隙。\n\
  \n#### 应用防火墙\n\n**应用防火墙**是一种设备、服务器插件、虚拟服务或系统过滤器，它为某项服务及其所有用户定义了一组严格的通信规则。它旨在成为一种特定于应用程序的服务器端防火墙，以防止针对特定应用程序协议和载荷的攻击。\n\
  \n**网络防火墙**是一种硬件设备，通常称为设备，专为通用网络过滤而设计。网络防火墙旨在为整个网络提供广泛的保护。\n\n这两种类型的防火墙都很重要，并且在许多情况下都适用。每个网络都需要一个网络防火墙。许多应用服务器需要一个应用防火墙。然而，使用应用防火墙通常不能消除对网络防火墙的需求。您应该串联使用这两种防火墙，以使它们相互补充，而不是将它们视为竞争性解决方案。\n\
  \n#### 手动更新\n\n在静态环境中应使用手动更新，以确保仅实施经过测试和授权的更改。使用自动更新系统会允许未经测试的更新引入未知的安全隐患。\n\n####\
  \ 固件版本控制\n\n与手动软件更新类似，在静态环境中严格控制固件非常重要。固件更新应在测试和审查后手动实施。**固件版本控制**的监管应侧重于维护稳定的运行平台，同时将停机或妥协的风险降至最低。\n\
  \n#### 包装器\n\n**包装器**是用于封装或容纳其他事物的工具。包装器在安全社区中因特洛伊木马恶意软件而广为人知。此类包装器用于将良性宿主与恶意载荷结合在一起。\n\
  \n包装器也可用作封装解决方案。某些静态环境可能被配置为拒绝更新、更改或软件安装，除非它们是通过受控通道引入的。该受控通道可以是一个特定的包装器。该包装器可能包含完整性和身份验证功能，以确保仅将预期的和授权的更新应用到系统。\n\
  \n### 监控\n\n即使是嵌入式和静态系统，也应对其性能、违规行为、合规性和运行状态进行监控。这类设备中的一些可以执行设备端监控、审计和日志记录，而另一些可能需要外部系统来收集活动数据。组织内的任何和所有设备、设施和计算机都应受到监控，以确保高性能、最小停机时间，并检测和阻止违规和滥用行为。\n\
  \n#### 控制冗余性和多样性\n\n与任何安全解决方案一样，依赖单一安全机制是不明智的。纵深防御在字面上或理论上使用同心圆或分层的多种访问控制类型。这种分层安全形式有助于组织避免单一的安全立场。单一思维认为单一安全机制足以提供充分的安全性。通过拥有安全控制冗余性和多样性，静态环境可以避免单一安全功能失效的陷阱；该环境拥有多次机会来偏转、拒绝、检测和威慑任何威胁。不幸的是，没有任何安全机制是完美的。每个单独的安全机制都存在缺陷或变通方法，只待黑客发现并滥用。\n\
  \n### 基本安全保护机制\n\n操作系统中对安全机制的需求归结为一个简单事实：软件不应被信任。第三方软件本质上是不可信的，无论其来源是谁或何处。这并非说所有软件都是邪恶的。相反，这是一种防护立场——因为所有第三方软件都是由操作系统创建者以外的人编写的，该软件可能会导致问题。因此，将所有非操作系统软件视为潜在有害软件，允许操作系统通过使用软件管理保护机制来防止许多灾难性事件的发生。操作系统必须采用保护机制来保持计算环境稳定，并使进程相互隔离。如果没有这些努力，数据的安全性就永远无法可靠，甚至不可能实现。\n\
  \n计算机系统设计人员在设计安全系统时应遵守许多通用保护机制。这些原则是管辖安全计算实践的更通用安全规则的具体实例。在开发的最早阶段将安全性设计到系统中，将有助于确保整体安全架构拥有最大的成功和可靠性机会。在以下章节中，我们将讨论分为两个领域：技术机制和策略机制。\n\
  \n#### 技术机制\n\n技术机制是系统设计人员可以直接构建到其系统中的控制措施。我们将介绍五种：分层、抽象、数据隐藏、进程隔离和硬件分段。\n\n####\
  \ 分层\n\n\n\n\n### 安全架构与设计\n\n#### 分层\n\n通过对进程进行`layering`（分层），你可以实现一种类似于用于操作模式的环模型（本章前面已讨论过）的结构，并将其应用于每个操作系统进程。它将进程中最敏感的功能置于核心位置，周围环绕着一系列同心圆，圆环越大，敏感度相应越低（采用略有不同的方法，这有时也用上层和下层来解释，即当从下层向上层攀爬时，安全性和特权逐渐降低）。在操作系统架构的讨论中，受保护环的概念很常见，但并非唯一。还有其他方式用层级而非环来表示相同的基本思想。在这样的系统中，最高层级拥有最高特权，而最低层级特权最低。\n\
  \n层间通信仅通过定义明确的特定接口进行，以提供必要的安全性。来自外层（敏感度较低）的所有入站请求，在被允许继续之前，都要经过严格的身份验证和授权检查（如果检查失败则被拒绝）。将分层用于安全，类似于使用安全域和基于格的安全模型，即某些主体和客体上的安全性和访问控制与特定层和特权相关联，并且随着从外层向内层移动，访问权限增加。\n\
  \n事实上，独立的层只能通过旨在维护系统安全性和完整性的特定接口相互通信。尽管安全性较低的外层依赖于更安全的内层的服务和数据，但它们只知道如何与这些层进行接口交互，而不知晓这些内层的内部结构、特性或其他细节。为维护层的完整性，内层既不知晓也不依赖外层。无论任意两层之间存在何种安全关系，双方均无法篡改对方（从而使每一层都免受任何其他层的篡改）。最后，外层无法违反或覆盖内层强制执行的任何安全策略。\n\
  \n#### 抽象\n\n`Abstraction`（抽象）是被称为`object-oriented programming`（面向对象编程）领域背后的基本原则之一。它是“黑盒”原则，即对象（或操作系统组件）的使用者不必知道对象如何工作的细节；他们只需知道使用对象的正确语法以及将返回的数据类型（即如何发送输入和接收输出）。这非常类似于对数据或服务的中介访问，例如用户模式应用程序使用系统调用来请求管理员模式的服务或数据（此类请求可能会根据请求者的凭证和权限被授予或拒绝），而不是获得直接的、非中介的访问。\n\
  \n抽象应用于安全的另一种方式是引入对象组，有时称为`classes`（类），即将访问控制和操作权限分配给对象组，而非逐个对象分配。这种方法允许安全管理员轻松定义和命名组（名称通常与工作角色或职责相关），并有助于简化权限和特权的管理（当你将一个对象添加到一个类时，你就赋予了它权利和特权，而不必单独管理每个对象的权利和特权）。\n\
  \n#### 数据隐藏\n\n`Data hiding`（数据隐藏）是多级安全系统的一项重要特征。它确保存在于某一安全级别的数据对运行在不同安全级别的进程不可见。数据隐藏背后的关键概念是：确保那些无需知晓在某一级别访问和处理数据的细节的人，无法通过隐蔽或非法手段获知或观察这些细节。从安全角度来看，数据隐藏依赖于将对象放置在与主体所处的安全容器不同的安全容器中，以向那些无需知情者隐藏对象细节。\n\
  \n#### 进程隔离\n\n`Process isolation`（进程隔离）要求操作系统为每个进程的指令和数据提供独立的内存空间。它还要求操作系统强制执行这些边界，防止一个进程读取或写入属于另一个进程的数据。使用此技术有两大优势：\n\
  \n*   它防止未经授权的数据访问。进程隔离是多级安全模式系统的基本要求之一。\n*   它保护进程的完整性。没有此类控制，设计不良的进程可能会失控，并将数据写入分配给其他进程的内存空间，导致整个系统变得不稳定，而不仅仅是影响该失控进程的执行。从更恶意的角度来看，进程可能会尝试（甚至可能成功）读取或写入其作用域之外的内存空间，从而侵入或攻击其他进程。\n\
  \n许多现代操作系统通过在每用户或每进程的基础上实现虚拟机来满足进程隔离的需求。虚拟机为用户或进程呈现一个处理环境——包括内存、地址空间和其他关键系统资源及服务——使该用户或进程表现得就像拥有对整台计算机的唯一、独占访问权一样。这使得每个用户或进程能够独立运行，而无需考虑可能同时在同一台机器上活动的其他用户或进程。作为操作系统提供的对系统中介访问的一部分，它将用户模式下的虚拟资源和访问进行映射，以便它们使用监督模式调用来访问相应的真实资源。这不仅使程序员的工作更轻松，还保护了各个用户和进程免受彼此干扰。\n\
  \n#### 硬件分段\n\n`Hardware segmentation`（硬件分段）在目的上类似于进程隔离——它防止访问属于不同进程/安全级别的信息。主要区别在于，硬件分段通过使用物理硬件控制来强制执行这些要求，而不是由操作系统施加的逻辑进程隔离控制。此类实现很少见，通常仅限于国家安全实现，在这些场景中，额外的成本和复杂性会被所涉及信息的敏感性以及未经授权访问或泄露固有的风险所抵消。\n\
  \n#### 安全策略与计算机架构\n\n正如安全策略指导组织的日常安全操作、流程和程序一样，它在系统设计和实施中也发挥着重要作用。无论系统是完全基于硬件、完全基于软件，还是两者的结合，这一点都同样适用。在这种情况下，安全策略的作用是指导和规范特定系统的设计、开发、实施、测试和维护。因此，这种安全策略紧密聚焦于单一的实施工作。（尽管它可能改编自其他类似的工作，但应尽可能准确、完整地反映目标系统。）\n\
  \n\n\n\n### 对于系统开发人员而言，安全策略最好以文档的形式呈现，该文档定义了一组规则、实践和程序，描述系统应如何管理、保护和分发敏感信息。防止信息从较高安全级别流向较低安全级别的安全策略称为多级安全策略。随着系统的开发，安全策略应在设计、构建、实施和测试时，关联所有适用的系统组件或要素，包括以下任何或所有内容：物理硬件组件、固件、软件，以及组织如何与系统交互和使用系统。总体要点是，安全需求必须贯穿项目的整个生命周期。如果仅在最后阶段才应用安全措施，通常会失败。\n\
  \n#### 策略机制\n\n与任何安全计划一样，策略机制也应到位。这些机制是基本计算机安全原则的延伸，但本节所述的应用专门针对计算机体系结构和设计领域。\n\n\
  ##### 最小权限原则\n\n第 13 章“管理身份和认证”讨论了通用安全*最小权限原则*及其如何应用于计算系统的用户。该原则对于计算机和操作系统的设计也至关重要，特别是在应用于系统模式时。设计操作系统进程时，应始终确保它们在可能的情况下运行在用户模式下。在特权模式下执行的进程越多，恶意人员可利用以获取系统监管访问权限的潜在漏洞就越多。通常，最好使用\
  \ API 请求监管模式服务，或在用户模式应用程序需要时将控制权传递给受信任、受良好保护的监管模式进程，而不是将此类程序或进程整体提升到监管模式。\n\n#####\
  \ 特权分离\n\n*特权分离*原则建立在最小权限原则之上。它要求使用细粒度的访问权限；即针对每种类型的特权操作设置不同的权限。这使设计人员能够授予某些进程执行特定监管功能的权限，而无需授予它们对系统的无限制访问权限。它还允许对服务的单个请求或资源访问请求进行检查，根据提出请求的用户身份、用户所属的组或用户占据的安全角色，将其与访问控制进行核对，并予以批准或拒绝。\n\
  \n可将职责分离视为将最小权限原则应用于管理员。在大多数中大型组织中，有许多管理员，各自承担不同的分配任务。因此，通常很少或没有个别管理员完全需要访问整个环境或基础设施的权限。例如，用户管理员不需要重新配置网络路由、格式化存储设备或执行备份功能的特权。\n\
  \n职责分离也是一种工具，用于防止在分配访问特权和工作任务时产生利益冲突。例如，负责编写代码的人员不应被指派测试和实施该代码。同样，从事应付账款工作的人员也不应同时承担应收账款职责。通过正确实施职责分离，可以安全地管理许多此类工作或任务冲突。\n\
  \n##### 问责制\n\n*问责制*是任何安全设计中必不可少的组成部分。许多高安全系统包含物理设备（如纸笔访客日志和不可修改的审计跟踪），以强制执行个人对特权功能的问责。然而，总体而言，此类功能依赖于系统监控系统资源和配置数据上的活动与交互，并保护生成的日志免受未经授权的访问或篡改，从而提供准确可靠的活动和交互记录，记录每个用户（包括管理员或其他拥有高级特权的受信任人员）在该系统上的历史。除了需要可靠的审计和监控系统来支持问责制外，还必须具备弹性的授权系统和无懈可击的认证系统。\n\
  \n#### 常见架构缺陷和安全问题\n\n没有任何安全架构是完整且完全安全的。每个计算机系统都存在弱点和漏洞。安全模型和架构的目标是解决尽可能多的已知弱点。基于这一事实，必须采取纠正措施来解决安全问题。以下部分介绍了一些与安全架构漏洞相关的、影响计算机系统的更常见的安全问题。您应了解每个问题以及它们如何降低系统的整体安全性。某些问题和缺陷相互重叠，并被创造性地用于攻击系统。虽然以下讨论涵盖了最常见的缺陷，但列表并非详尽无遗。攻击者非常狡猾。\n\
  \n##### 隐蔽信道\n\n*隐蔽信道*是一种通过正常不用于通信的路径传递信息的方法。因为该路径正常不用于通信，所以可能不受系统正常安全控制的保护。使用隐蔽信道提供了一种未被检测到地违反、绕过或规避安全策略的手段。隐蔽信道是安全架构漏洞的重要示例之一。\n\
  \n正如您所想象的，隐蔽信道与*公开信道*相反。公开信道是一种已知的、预期的、授权的、设计的、受监控的和受控的通信方法。\n\n隐蔽信道有两种基本类型：\n\n\
  **隐蔽定时信道** 隐蔽定时信道通过改变系统组件的性能或以可预测的方式修改资源的时序来传递信息。使用隐蔽定时信道通常是一种秘密传输数据的方法，且非常难以检测。\n\
  \n**隐蔽存储信道** 隐蔽存储信道通过将数据写入另一个进程可读取的公共存储区域来传递信息。在评估软件安全性时，应警惕任何向另一个进程可读取的内存区域写入数据的进程。\n\
  \n这两种类型的隐蔽信道都依赖通信技术，与其他未授权主体交换信息。因为隐蔽信道位于正常数据传输环境之外，所以检测它可能很困难。最好的防御是实施审计并分析日志文件，以查找任何隐蔽信道活动。\n\
  \n##### 基于设计或编码缺陷和安全问题的攻击\n\n某些攻击可能源于不良的设计技术、可疑的实施实践和程序，或不充分的测试。某些攻击可能源于故意的设计决策，即在开发过程中为绕过访问控制、登录或其他安全检查而内置在代码中的特殊入口点，在代码投入生产时未被移除。出于显而易见的原因，此类出口点恰当地称为后门，因为它们通过设计避开了安全措施（本章后面的“维护钩子和特权程序”中将介绍）。需要进行广泛的测试和代码审查，以发现此类隐蔽访问手段，这些手段在开发的最后阶段很容易移除，但在测试和维护阶段却极难检测。\n\
  \n\n\n\n尽管功能测试是商业代码和应用程序的常规做法，但针对安全问题的单独测试仅在过去几年才开始受到关注并获得认可，这要归功于广泛宣传的病毒和蠕虫攻击、SQL\
  \ 注入攻击、跨站脚本攻击，以及广泛使用的公共在线站点偶尔遭到篡改或中断。您可以参考 OWASP Top 10 Web Application Security\
  \ Risks 报告，网址为 `https://www.owasp.org/images/7/72/OWASP_Top_10-2017_%28en%29.pdf.pdf`。\n\
  \n在后续章节中，我们将介绍常见的攻击源或安全架构漏洞，这些漏洞可归因于设计失败、实现失败、发布前代码清理失败或彻头彻尾的编码错误。虽然这些缺陷是可以避免的，但发现和修复此类缺陷要求从开发项目一开始就进行严格的安全意识设计，并在测试和分析上投入额外的时间和精力。这有助于解释软件安全常常令人遗憾的现状，但绝不为其开脱！\n\
  \n人类永远无法编写完全安全（无瑕疵）的代码。在整个应用开发生命周期中实施源代码分析工具将最大程度地减少生产版本中的缺陷数量，而在生产发布前发现的缺陷，其修复成本要低得多。代码审查和测试的概念在第\
  \ 15 章“安全评估与测试”中介绍。\n\n### 可信恢复\n\n当未做好准备的系统崩溃并随后恢复时，可能会出现两个危及其安全控制的机会。许多系统会在关机过程中卸载安全控制。`可信恢复`\
  \ 确保在发生崩溃时所有安全控制保持完好。在可信恢复期间，系统确保在安全控制被禁用时不存在访问机会。即使是恢复阶段，也在所有控制完好无损的情况下运行。\n\n\
  例如，假设系统在将数据库事务写入磁盘时崩溃，该数据库被分类为绝密级。无防护的系统可能允许未授权用户在数据写入磁盘前访问该临时数据。支持可信恢复的系统确保即使在崩溃期间也不会发生数据机密性违规。此过程需要周密的计划和处理系统故障的详细程序。尽管自动恢复程序可能构成整个恢复过程的一部分，但仍可能需要人工干预。显然，如果需要此类人工操作，对执行恢复的人员进行适当的身份标识和认证同样至关重要。\n\
  \n##### 输入和参数检查\n\n最臭名昭著的安全违规之一是 `缓冲区溢出`。当程序员未能充分验证输入数据时，特别是当他们未对软件接受的输入数据量施加限制时，就会发生此违规。由于此类数据通常存储在输入缓冲区中，当超过缓冲区的正常最大尺寸时，多余的数据称为溢出。因此，当有人试图将恶意指令或代码作为程序输入的一部分提供时，由此产生的攻击类型称为缓冲区溢出。不幸的是，在许多系统中，此类溢出数据通常会在高权限级别下，或以接受此类输入的进程所附带的任何权限级别，直接被受攻击系统执行。对于几乎所有类型的操作系统（包括\
  \ Windows、Unix、Linux 等），缓冲区溢出暴露了任何已知安全漏洞中最明显、最深刻的妥协和攻击机会。\n\n导致缓冲区溢出漏洞的责任方始终是允许未清理或未消毒输入的程序员的代码。程序员的尽职调查可以彻底根除缓冲区溢出，但前提是程序员在将所有输入和参数存储到任何数据结构之前对其进行检查（并限制可作为输入提供的数据量）。适当的数据验证是消除缓冲区溢出的唯一途径。否则，缓冲区溢出的发现会导致一个熟悉的模式：必须向受影响的系统应用关键安全更新以关闭攻击入口。\n\
  \n##### 维护钩子和特权程序\n\n`维护钩子` 是仅系统开发人员知晓的系统入口点。此类入口点也称为 `后门`。尽管维护钩子的存在明显违反安全策略，但它们仍出现在许多系统中。后门的初衷是为维护原因或常规访问意外禁用时提供对系统的保证访问。问题在于，这种访问方式绕过了所有安全控制，并向知晓后门存在的任何人提供自由访问。必须明确禁止此类入口点，并监控审计日志以发现可能表明未授权管理员访问的任何活动。\n\
  \n另一个常见的系统漏洞是在执行期间以提升的安全级别运行程序。此类程序必须经过仔细编写和测试，以确保它们不允许任何会使主体保留更高安全级别的退出和/或入口点。确保所有在高安全级别下运行的程序仅对适当用户可访问，并已针对滥用进行加固。一个很好的例子是\
  \ Unix/Linux 操作系统环境中 root 拥有的全局可写可执行脚本。这一重大安全缺陷经常被忽视。任何人都可以修改该脚本，它将在 root 上下文中执行，允许创建用户，从而导致后门访问。\n\
  \n##### 增量攻击\n\n某些攻击形式是以缓慢、渐进的增量发生的，而非通过明显或可识别的企图来破坏系统安全或完整性。此类攻击的两种形式是数据篡改和萨拉米攻击。\n\
  \n`数据篡改` 是指攻击者获得系统访问权限，在存储、处理、输入、输出或事务过程中对数据进行微小的、随机的或增量的更改，而不是明显地更改文件内容或损坏/删除整个文件。除非文件和数据受到加密保护，或者每次读写文件时都例行执行并应用某种完整性检查（如校验和或消息摘要），否则此类更改很难被检测到。加密文件系统、文件级加密技术或某种形式的文件监控（包括由\
  \ Tripwire 等应用程序和其他文件完整性监控 [FIM] 工具执行的完整性检查）通常能提供充分保证，确保没有正在进行的数据篡改。数据篡改通常被认为是内部人员而非外部人员（即外部入侵者）更常实施的攻击。显而易见，既然数据篡改是一种更改数据的攻击，它就被视为一种主动攻击。\n\
  \n\n\n\n### 香肠攻击\n\n根据所有公开报告，`香肠攻击` 更多属于传说色彩。该攻击名称指的是对账户资产或其他具有财务价值记录的系统性侵蚀，即定期、例行地从余额中扣除极小金额。打个比方，这种攻击就像在顾客付费使用切片机切香肠时，每次都偷偷切走一片极薄的香肠。然而，尽管没有此类攻击的文档化案例，大多数安全专家都承认香肠攻击是可能发生的，尤其是当组织内部人员参与其中时。只有通过适当的职责分离和对代码的适当控制，组织才能完全防止或消除此类攻击。设置财务交易监控以追踪极小额的资金转移或其他价值物品的转移，有助于检测此类活动；定期通知员工此类做法，有助于阻止此类攻击尝试。\n\
  \n#### 编程\n\n我们已经提到过编程中最大的缺陷：缓冲区溢出，如果程序员未能检查或清理输入数据的格式和/或大小，就会发生这种情况。程序还有其他潜在缺陷。任何无法优雅处理异常的程序都有以不稳定状态退出的危险。在程序提升安全级别以执行正常任务后，有人可能巧妙地使其崩溃。如果攻击者成功在恰当的时机使程序崩溃，他们就能获得更高的安全级别，并破坏系统的机密性、完整性和可用性。\n\
  \n所有直接或间接执行的程序都必须经过全面测试，以符合您的安全模型。请确保安装了任何软件的最新版本，并了解任何已知的安全漏洞。由于每个安全模型和每个安全策略都不同，您必须确保所执行的软件不会超出您允许的权限。编写安全代码很难，但绝对可行。请确保您使用的所有程序在设计时都考虑到了安全问题。更多关于代码审查和测试的信息，请参阅第\
  \ 15 章。\n\n#### 时序、状态变更与通信中断\n\n计算机系统以严格的精度执行任务。计算机擅长可重复的任务。攻击者可以根据任务执行的可预测性开发攻击。算法的常见事件序列是：先检查资源是否可用，如果被允许则访问它。`检查时间\
  \ (TOC)` 是主体检查对象状态的时间。在返回访问对象之前，可能需要做出几个决定。当决定访问对象时，过程会在 `使用时间 (TOU)` 访问它。TOC 和\
  \ TOU 之间的差异有时足够大，以便攻击者用另一个符合其需求的对象替换原始对象。`检查时间到使用时间攻击 (TOCTOU)` 通常被称为 `竞争条件`，因为攻击者正在与合法进程竞争，试图在对象被使用前将其替换。\n\
  \nTOCTTOU 攻击的一个经典例子是在数据文件身份验证通过后、数据读取前替换该文件。通过将一个真实的数据文件替换为攻击者精心挑选和设计的另一个文件，攻击者可以潜在地以多种方式控制程序的行为。当然，攻击者必须对被攻击的程序和系统有深入了解。\n\
  \n同样，攻击者可能试图在资源状态或整个系统状态发生变化时，利用两个已知状态之间的间隙采取行动。通信中断也提供了攻击者可能试图利用的小时间窗口。任何时候资源的状态检查先于对资源的操作，在检查和操作的短暂间隔中就存在潜在攻击的机会窗口。这些攻击必须在您的安全策略和安全模型中加以应对。TOCTTOU\
  \ 攻击、竞争条件利用和通信中断被称为 `状态攻击`，因为它们攻击的是时序、数据流控制以及从一种系统状态到另一种系统状态的转换。\n\n#### 技术与流程集成\n\
  \n评估和理解系统架构中的漏洞非常重要，特别是关于技术与流程集成方面。当多种技术和复杂流程在打造新的独特业务功能时相互交织，新的问题和安全隐患往往会浮现。随着系统集成，应关注潜在的单点故障，以及\
  \ `面向服务架构 (SOA)` 中出现的弱点。SOA 利用现有但独立且独特的软件服务构建新的应用程序或功能。由此产生的应用程序通常是新的；因此，其安全问题未知、未经测试且无防护。所有新部署，特别是新应用程序或功能，在被允许上线到生产网络或公共互联网之前，都需要经过彻底的审查。\n\
  \n#### 电磁辐射\n\n仅仅因为构建它们的电子元件种类，许多计算机硬件设备在正常运行期间都会发射电磁 (EM) 辐射。与其他机器或外围设备通信的过程会产生可被拦截的辐射。甚至可以通过拦截和处理来自键盘和计算机显示器的电磁辐射，还原键盘输入或显示器输出。您还可以在网络数据包沿网段传输时，被动地（即不实际接入电缆）检测和读取它们。这些辐射泄露可能导致严重的安全问题，但通常易于解决。\n\
  \n消除电磁辐射拦截最简单的方法是通过电缆屏蔽或管道减少辐射，并通过实施物理安全控制，阻止未经授权的人员和设备过于接近设备或线缆。通过降低信号强度并增加敏感设备周围的物理缓冲区，可以大幅降低信号被拦截的风险。\n\
  \n如前所述，几种 TEMPEST 技术可提供针对电磁辐射窃听的防护。这些包括法拉第笼、干扰器或噪声发生器以及控制区。`法拉第笼` 是一种特殊的外壳，充当电磁电容器。使用法拉第笼时，没有电磁信号能进入或离开封闭区域。`干扰`\
  \ 或 `噪声发生器` 利用这样一个原理：当干扰过大时，很难或不可能恢复信号。因此，通过广播自己的干扰，可以防止不必要的电磁拦截。该概念唯一的问题是，必须确保干扰不会影响您设备的正常操作。确保这一点的一种方法是使用\
  \ `控制区`，即用于阻挡故意广播干扰的法拉第笼。例如，如果您想在办公室的几个房间内使用无线网络，但不允许在其他地方使用，您可以用一个法拉第笼将这些房间封闭起来，然后在控制区外部放置几个噪声发生器。这将允许在指定房间内正常使用无线网络，但完全阻止这些指定区域外的正常使用和窃听。\n\
  \n### 总结\n\n\n\n\n\n### 设计安全计算系统\n\n设计安全计算系统是一项复杂的任务，许多安全工程师将其整个职业生涯都致力于理解信息系统的内部运作，并确保它们支持在当前环境中安全运行所需的核心安全功能。许多安全专业人员不一定需要深入了解这些原则，但他们至少应对驱动该过程以增强其自身组织安全性的基本原理有广泛的理解。\n\
  \n这种理解始于对硬件、软件和固件的调查，以及这些组件如何融入安全拼图中。理解通用计算机和网络组织、架构及设计的原则非常重要，包括寻址（物理寻址和符号寻址）、地址空间与内存空间的区别，以及机器类型（实机、虚拟机、多状态、多任务、多道程序、多处理、多处理器和多用户）。\n\
  \n此外，安全专业人员必须对操作状态（单状态、多状态）、操作模式（用户态、监督态、特权态）、存储类型（主存、辅存、实存、虚拟存、易失性、非易失性、随机存取、顺序存取）以及保护机制（分层、抽象、数据隐藏、进程隔离、硬件分段、最小权限原则、特权分离、问责制）有扎实的理解。\n\
  \n无论安全模型多么复杂，都存在攻击者可利用的缺陷。某些缺陷（如缓冲区溢出和维护钩子）是由程序员引入的，而其他缺陷（如隐蔽信道）则是架构设计问题。理解此类问题的影响并在适当的时候修改安全架构以进行补偿非常重要。\n\
  \n### 考试要点\n\n**能够解释多任务、多线程、多处理和多道程序之间的区别。** 多任务是指在一台计算机上同时执行多个应用程序，由操作系统管理。多线程允许在单个进程内执行多个并发任务。多处理是指使用多个处理器来增加计算能力。多道程序与多任务类似，但在大型机系统上进行，并需要特定的编程。\n\
  \n**理解单状态处理器和多状态处理器之间的区别。** 单状态处理器一次只能在一个安全级别下运行，而多状态处理器可以同时在多个安全级别下运行。\n\n**描述联邦政府批准的用于处理机密信息的四种安全模式。**\
  \ 专用模式要求所有用户对系统上存储的所有信息都具有适当的许可、访问权限和知悉必要性。系统高模式去除了知悉必要性的要求。分区模式去除了知悉必要性要求和访问权限要求。多级模式去除了所有三项要求。\n\
  \n**解释大多数现代处理器使用的两种分层操作模式。** 用户应用程序在称为用户模式的受限指令集环境中运行。操作系统在特权模式下执行受控操作，特权模式也称为系统模式、内核模式和监督模式。\n\
  \n**描述计算机使用的不同类型的内存。** `ROM` 是非易失性的，最终用户无法向其写入数据。最终用户只能向 `PROM` 芯片写入一次数据。`EPROM`/`UVEPROM`\
  \ 芯片可通过紫外线擦除，然后写入新数据。`EEPROM` 芯片可通过电流擦除，然后写入新数据。`RAM` 芯片是易失性的，计算机断电时会丢失其内容。\n\n\
  **了解内存组件相关的安全问题。** 内存组件存在一些安全问题：断电后数据可能残留在芯片上，以及在多用户系统中对内存访问的控制。\n\n**描述计算机使用的存储设备的不同特性。**\
  \ 主存储器即内存。辅助存储器由磁性、闪存和光学介质组成，数据必须先读入主存储器，CPU 才能使用。随机存取存储设备可在任意点读取，而顺序存取设备需要扫描物理存储在前面的所有数据才能到达目标位置。\n\
  \n**了解辅助存储设备相关的安全问题。** 辅助存储设备存在三个主要安全问题：可移动介质可被用来窃取数据，必须应用访问控制和加密来保护数据，以及数据即使在文件删除或介质格式化后仍可能残留在介质上。\n\
  \n**理解输入和输出设备可能带来的安全风险。** 输入/输出设备可能遭受窃听和监听，被用来将数据偷运出组织，或被用来创建未经授权的、不安全的入口点进入组织的系统和网络。要做好识别和缓解此类漏洞的准备。\n\
  \n**了解固件的用途。** 固件是存储在 `ROM` 芯片上的软件。在计算机层面，它包含启动计算机所需的基本指令。固件还用于在打印机等外围设备中提供操作指令。\n\
  \n**能够描述进程隔离、分层、抽象、数据隐藏和硬件分段。** 进程隔离确保各个进程只能访问自己的数据。分层在进程内创建不同的安全领域并限制它们之间的通信。抽象为程序员创建“黑盒”接口，使其无需了解算法或设备的内部工作原理即可使用。数据隐藏防止信息从不同安全级别被读取。硬件分段通过物理控制强制执行进程隔离。\n\
  \n**理解安全策略如何驱动系统设计、实施、测试和部署。** 安全策略的作用是指导和规范特定系统的设计、开发、实施、测试和维护。\n\n**理解云计算。** 云计算是一个通用术语，指一种计算概念，即处理和存储通过网络连接在别处执行，而非在本地。云计算通常被认为是基于互联网的计算。\n\
  \n**理解云计算和虚拟化相关的风险。** 云计算和虚拟化，尤其是两者结合时，存在严重的相关风险。一旦敏感、机密或专有数据离开组织的范围，也就离开了组织安全策略及其所产生的基础设施施加的保护。云服务及其人员可能不遵守与贵组织相同的安全标准。\n\
  \n**理解管理程序。** 管理程序，也称为虚拟机监视器（`VMM`），是虚拟化中负责创建、管理和运行虚拟机的组件。\n\n**了解 I 型管理程序。** I\
  \ 型管理程序是原生或裸金属管理程序。在此配置中，没有宿主操作系统；相反，管理程序直接安装在硬件上，即宿主操作系统通常驻留的位置。\n\n**了解 II 型管理程序。**\
  \ II 型管理程序是宿主型管理程序。在此配置中，硬件上存在标准的常规操作系统，然后将管理程序作为另一个软件应用程序安装。\n\n**定义 CASB。** 云访问安全代理（`CASB`）是一种安全策略执行解决方案，可以本地部署，也可以基于云部署。\n\
  \n\n\n\n\n### 理解 SECaaS\n\n安全即服务（SECaaS）是一种云服务提供商概念，即安全性通过在线实体提供给组织，或由在线实体提供。\n\n\
  ### 理解智能设备\n\n智能设备是一系列移动设备，为用户提供大量自定义选项，通常通过安装应用程序实现，并可能利用设备端或云端的人工智能（AI）处理能力。\n\
  \n### 理解物联网\n\n物联网（IoT）是连接互联网的设备的一个新子类别，甚至可能是一个新类别，旨在为家庭或办公室环境中的传统或新型设备/电器提供自动化、远程控制或\
  \ AI 处理功能。\n\n### 理解移动设备安全\n\n设备安全涉及移动设备可能具备的各种潜在安全选项或功能。并非所有便携式电子设备（PED）都具备良好的安全功能。PED\
  \ 安全功能包括全设备加密、远程擦除、锁定、屏幕锁、GPS、应用控制、存储分段、资产追踪、库存控制、移动设备管理、设备访问控制、可移动存储以及禁用未使用的功能。\n\
  \n### 理解移动设备应用安全\n\n移动设备上使用的应用程序和功能需要得到保护。相关概念包括密钥管理、凭据管理、认证、地理标记、加密、应用程序白名单以及传递信任/认证。\n\
  \n### 理解 BYOD\n\n自带设备（BYOD）是一项允许员工携带个人移动设备上班，并使用这些设备连接公司网络以访问业务资源和/或互联网的政策。虽然 BYOD\
  \ 可能提高员工士气和工作满意度，但会增加组织的安全风险。相关问题包括数据所有权、支持所有权、补丁管理、防病毒管理、取证、隐私、入职/离职管理、遵守企业政策、用户接受度、架构/基础设施考量、法律顾虑、可接受使用政策以及机载摄像头/视频。\n\
  \n### 理解嵌入式系统和静态环境\n\n嵌入式系统通常是围绕一组有限的特定功能设计的，这些功能与其作为组件的更大产品相关。静态环境是指为特定需求、能力或功能配置的应用程序、操作系统、硬件集合或网络，配置完成后设定为保持不变。\n\
  \n### 理解嵌入式系统和静态环境的安全顾虑\n\n静态环境、嵌入式系统以及其他受限或单一用途的计算环境需要安全管理。这些技术可能包括网络分段、安全层、应用防火墙、手动更新、固件版本控制、包装器，以及控制冗余和多样性。\n\
  \n### 理解最小权限原则、权限分离和问责制如何应用于计算机体系结构\n\n最小权限原则确保只有最少数量的进程被授权在监督模式下运行。权限分离增加了安全操作的粒度。问责制确保存在审计追踪，以便将操作追溯到其源头。\n\
  \n### 能够解释什么是隐蔽信道\n\n隐蔽信道是指任何用于传递信息但通常不用于信息传递的方法。\n\n### 理解什么是缓冲区溢出和输入检查\n\n当程序员在将数据写入特定内存位置之前，未能检查输入数据的大小，就会发生缓冲区溢出。事实上，任何未能验证输入数据的行为都可能导致安全违规。\n\
  \n### 描述安全架构的常见缺陷\n\n除了缓冲区溢出，程序员在系统部署后可能还会在系统上留下后门和特权程序。即使编写良好的系统也可能容易受到分时检查到分时使用（TOCTTOU）攻击。任何状态变更都可能成为攻击者攻破系统的潜在机会窗口。\n\
  \n### 书面实验\n\n1. 说出三种标准的基于云的“X 即服务”选项，并简要描述它们。\n2. 处理机密信息的系统有哪四种安全模式？\n3. 说出用于描述存储的三对方面或特性。\n\
  4. 列举分布式架构中发现的一些漏洞。\n\n### 复习题\n\n1. 许多 PC 操作系统提供功能，使它们能够支持在单处理器系统上同时执行多个应用程序。用来描述这种能力的术语是什么？\n\
  \    1. 多道程序设计\n    2. 多线程\n    3. 多任务处理\n    4. 多处理\n\n2. 什么技术能为组织提供对 BYOD 设备的最佳控制？\n\
  \    1. 应用程序白名单\n    2. 移动设备管理\n    3. 加密可移动存储\n    4. 地理标记\n\n3. 你有三个应用程序正在一个支持多任务处理的单核单处理器系统上运行。其中一个应用程序是文字处理程序，正在同时管理两个线程。其他两个应用程序各仅使用一个执行线程。在任何给定时间，有多少个应用程序线程正在处理器上运行？\n\
  \    1. 一个\n    2. 两个\n    3. 三个\n    4. 四个\n\n4. 哪种类型的联邦政府计算系统要求访问该系统的所有个人都需知晓该系统处理的所有信息？\n\
  \    1. 专用模式\n    2. 系统高模式\n    3. 分区模式\n    4. 多级模式\n\n5. 嵌入式系统特有的安全风险（标准 PC 中不常见）是什么？\n\
  \    1. 软件缺陷\n    2. 互联网访问\n    3. 对物理世界中机制的控制\n    4. 断电\n\n6. 以下哪项描述了社区云？\n  \
  \  1. 由一群用户或组织维护、使用和付费的云环境，以造福其共同利益，如协作和数据交换\n    2. 企业网络内与互联网隔离的云服务\n    3. 通常通过互联网连接供公众访问的云服务\n\
  \    4. 部分托管在组织内部供私有使用，并利用外部服务向外部人员提供资源的云服务\n\n7. 什么概念描述了作为大型系统一部分实现的计算机，通常围绕一组有限的特定功能（如管理、监控和控制）设计，与其作为组件的更大产品相关？\n\
  \    1. IoT\n    2. 应用设备\n    3. SoC\n    4. 嵌入式系统\n\n8. 以下哪种类型的内存在从计算机移除后可能保留信息，因此构成安全风险？\n\
  \    1. 静态 RAM\n    2. 动态 RAM\n    3. 辅助存储器\n    4. 实内存\n\n9. 降低移动设备（如笔记本电脑）数据丢失风险的最有效方法是什么？\n\
  \    1. 定义强登录密码\n    2. 将存储在移动设备上的敏感数据最小化\n    3. 使用线缆锁\n    4. 加密硬盘驱动器\n\n10. 哪种电气元件是动态\
  \ RAM 芯片的主要构建模块？\n     1. 电容器\n     2. 电阻器\n     3. 触发器\n     4. 晶体管\n\n11. 在网络环境中，以下哪种存储设备最可能需要加密技术来维护数据安全？\n\
  \     1. 硬盘\n     2. 备份磁带\n     3. 可移动驱动器\n     4. RAM\n\n\n\n\n\n# 12. 在以下哪种安全模式下，你可以确信所有用户都拥有系统处理的所有信息的访问权限，但不一定需要知道所有这些信息？\n\
  \n1.  专用模式\n2.  系统高模式\n3.  分区模式\n4.  多级模式\n\n# 13. 手机窃听最常被忽视的方面与以下哪项有关？\n\n1.  存储设备加密\n\
  2.  屏幕锁定\n3.  偷听对话\n4.  无线网络\n\n# 14. 通常使用哪种类型的存储设备来包含计算机的主板 BIOS？\n\n1.  PROM\n\
  2.  EEPROM\n3.  ROM\n4.  EPROM\n\n# 15. 哪种类型的内存直接可供 CPU 使用，且通常是 CPU 的一部分？\n\n1.\
  \  RAM\n2.  ROM\n3.  寄存器内存\n4.  虚拟内存\n\n# 16. 你是一家零售商组织的 IT 安全经理，该组织刚刚上线了一个电子商务网站。你雇佣了几名程序员来编写新\
  \ Web 销售系统核心代码。然而，你担心虽然新代码功能良好，但可能不安全。你开始审查代码、系统设计和服务架构以追踪问题和隐患。为了防止或防御 XSS，你希望在以下哪项中发现相关措施？\n\
  \n1.  输入验证\n2.  防御性编码\n3.  允许脚本输入\n4.  转义元字符\n\n# 17. 哪种攻击形式利用了程序对接收数据长度缺乏限制，在将输入存入内存前未进行检查，从而可能导致任意代码执行？\n\
  \n1.  ARP 投毒\n2.  XSS\n3.  域名劫持\n4.  缓冲区溢出\n\n# 18. 哪项安全原则有助于防止用户访问由其他用户运行的应用程序所分配的内存空间？\n\
  \n1.  特权分离\n2.  分层\n3.  进程隔离\n4.  最小权限\n\n# 19. 哪项安全原则要求只有最少数量的操作系统进程应在监督模式下运行？\n\
  \n1.  抽象\n2.  分层\n3.  数据隐藏\n4.  最小权限\n\n# 20. 哪项安全原则采用进程隔离的概念，并使用物理控制来实现它？\n\n1.\
  \  硬件分段\n2.  数据隐藏\n3.  分层\n4.  抽象\n\n## 第 10 章：物理安全要求\n\n**本章涵盖的 CISSP 考试主题包括：**\n\
  \n*   **领域 3：安全架构与工程**\n    *   3.10 将安全原则应用于站点和设施设计\n    *   3.11 实施站点和设施安全控制\n\
  \        *   3.11.1 线缆间/中间配线设施\n        *   3.11.2 服务器机房/数据中心\n        *   3.11.3\
  \ 媒体存储设施\n        *   3.11.4 证据存储\n        *   3.11.5 受限区域和工作区安全\n        *   3.11.6\
  \ 公用设施和供暖、通风与空调 (HVAC)\n        *   3.11.7 环境问题\n        *   3.11.8 火灾预防、探测和抑制\n\
  *   **领域 7：安全运营**\n    *   7.15 实施和管理物理安全\n        *   7.15.1 外围安全控制\n        *\
  \   7.15.2 内部安全控制\n\n物理和环境安全主题在多个领域中均有涉及。主要出现在领域 3“安全架构与工程”和领域 7“安全运营”中。CISSP 认证考试通用知识体系\
  \ (CBK) 这两个领域的多个子章节涉及与设施安全相关的主题和问题，包括基础原则、设计与实施、火灾防护、外围安全、内部安全等。\n\n物理安全的目的是防范物理威胁。以下是最常见的物理威胁：火灾和烟雾、水灾（内涝/外溢）、地质运动（地震、滑坡、火山）、风暴（大风、闪电、雨、雪、冰雹、冰冻）、蓄意破坏/恶意损坏、爆炸/毁坏、建筑物倒塌、有毒物质、公用设施中断（电力、供暖、制冷、空气、水）、设备故障、盗窃和人员损失（罢工、疾病、通行、交通）。\n\
  \n本章探讨这些问题，并讨论防范它们的保障措施和对策。在许多情况下，如果发生严重的物理威胁（如爆炸、蓄意破坏或自然灾害），你将需要灾难恢复计划或业务连续性计划。第\
  \ 3 章“业务连续性规划”和第 18 章“灾难恢复规划”详细涵盖了这些主题。\n\n### 将安全原则应用于站点和设施设计\n\n此时应该显而易见，如果无法控制物理环境，任何管理、技术或逻辑访问控制的集合都无法提供充分的安全性。如果恶意人员能够获得对你设施或设备的物理访问权限，他们几乎可以为所欲为，从破坏、泄露到篡改。物理控制是你的第一道防线，而人员是最后一道防线。\n\
  \n实施和维护物理安全有许多方面。核心要素之一是选择或设计用于容纳你的信息技术 (IT) 基础设施和组织运营的设施。选择或设计设施安全的过程总是从计划开始。\n\
  \n#### 安全设施计划\n\n*安全设施计划* 概述了组织的安全需求，并强调了为提供安全所采用的方法或机制。此类计划通过称为关键路径分析的过程来制定。*关键路径分析*\
  \ 是一项系统性工作，旨在识别关键任务应用程序、流程和操作与所有必要支持要素之间的关系。例如，一台用于通过网络销售产品的电子商务服务器依赖于互联网接入、计算机硬件、电力、温度控制、存储设施等。\n\
  \n当关键路径分析正确执行时，会生成维持组织运作所需的相互依赖关系和交互作用的完整图景。一旦分析完成，其结果将作为一份待保护项目的清单。设计安全 IT 基础设施的第一步是为组织及其计算机的基本需求提供安全保障。这些基本需求包括电力、环境控制（换句话说，建筑物、空调、供暖、湿度控制等）以及水/污水处理。\n\
  \n在检查关键路径时，评估已完成或潜在的技术融合也很重要。*技术融合* 是指各种技术、解决方案、公用设施和系统随时间推移而演变和合并的趋势。这通常会导致多个系统执行相似或冗余的任务，或者一个系统接管另一个系统的功能和能力。虽然在某些情况下这可以提高效率和节省成本，但它也可能代表单点故障，并成为黑客和入侵者更有价值的目标。例如，如果语音、视频、传真和数据流量共享单一连接路径而不是各自独立的路径，一次针对主连接的蓄意破坏行为就足以让入侵者或窃贼切断外部通信。\n\
  \n\n\n\n\n### 安全人员参与场地与设施设计\n\n安全人员应参与场地与设施的设计考量。否则，对于逻辑安全存在至关重要的许多物理安全重要方面可能会被忽视。让安全人员参与物理设施设计，可以确保您组织的长期安全目标不仅得到策略、人员和电子设备的支持，也得到建筑本身的支持。\n\
  \n#### 场地选择\n\n场地选择应基于组织的安全需求。成本、位置和规模固然重要，但满足安全要求应始终优先。在选择建设设施的场地或挑选预存结构时，务必仔细审视其位置的方方面面。\n\
  \n资产安全在很大程度上取决于场地安全，这涉及众多考量因素和情境要素。场地位置和建筑结构在整体场地选择过程中起着关键作用。易受骚乱、抢劫、非法闯入和破坏影响，或位于高犯罪率区域，显然都是不佳的选择，但并不总能由我们决定或控制。环境威胁如断层线、龙卷风/飓风多发区，以及靠近其他自然灾害区域，在场地选择过程中也构成重大问题，因为您并不总能规避这些威胁。\n\
  \n与其他建筑和企业的邻近程度是另一项关键考量。它们会吸引什么样的关注，这又如何影响您的运营或设施？如果附近的企业吸引过多访客、产生大量噪音、造成震动或处理危险材料，都可能危害您的员工或建筑。与应急响应人员的距离也是一个考量因素，此外还有其他要素。一些公司有能力购买或建设自己的园区，以将周边因素排除在外，并实施更严格的访问控制和监控。然而，并非每家公司都能行使这一选项，只能利用现有且负担得起的条件。\n\
  \n至少，应确保建筑设计能承受相当极端的天气条件，并能阻止或抵御公然的非法闯入企图。窗户和门等脆弱入口点往往主导此类分析，但您还应评估可能遮挡非法闯入企图的物体（树木、灌木或人造物品）。\n\
  \n#### 可视性\n\n可视性至关重要。周围地形如何？是否容易在不被发现的情况下，乘车或步行接近设施？周围区域的构成也很重要。它是位于住宅区、商业区还是工业区附近？当地犯罪率如何？最近的应急服务（消防、医疗、警察）位于何处？附近可能存在哪些独特隐患（化工厂、无家可归者收容所、大学、建筑工地等）？\n\
  \n可视性的另一个要素与安全摄像头监控的区域有关。务必确保安全摄像头的位置和性能与设施的内部和外部设计相协调。摄像头的部署应确保对所有外墙、出入口以及内部走廊拥有清晰的视线。\n\
  \n#### 自然灾害\n\n另一个关注点是自然灾害可能对该区域造成的潜在影响。该区域是否易发地震、泥石流、塌陷、火灾、洪水、飓风、龙卷风、落石、暴雪、暴雨、结冰、潮湿、高温、极寒等？您必须为自然灾害做好准备，并配置\
  \ IT 环境，使其能在事件中幸存或易于替换。如前所述，业务连续性和灾难规划主题分别在第 3 章和第 18 章中介绍。\n\n#### 设施设计\n\n在设计设施建设时，您必须了解组织所需的安全级别。适当的安全级别必须在施工开始前进行规划和设计。\n\
  \n需考虑的重要问题包括：可燃性、耐火等级、建筑材料、承重等级、布局，以及对墙壁、门、天花板、地板、`HVAC`（暖通空调）、电力、水、污水、燃气等项目的控制。强行闯入、应急通道、抗进入能力、出入口朝向、报警器的使用、导电性等也是需要评估的重要方面。设施内的每个元素都应从其如何被用于保护或危害\
  \ IT 基础设施和人员的角度进行评估（例如，从设施内部向边界外部的气流和水流正压）。\n\n还有一套成熟的“安全建筑”思想流派，常被称为*环境设计预防犯罪*。其指导思想是构建物理环境和周边，以影响潜在犯罪者在实施犯罪行为前的决策。国际\
  \ CPTED 协会是获取该主题信息的绝佳来源（[www.cpted.net](http://www.cpted.net)），Oscar Newman 所著、由\
  \ HUD 政策发展与研究办公室出版的《创造可防御空间》也是如此（您可以在 [www.defensiblespace.com/book.htm](http://www.defensiblespace.com/book.htm)\
  \ 免费下载 PDF）。\n\n### 实施场地与设施安全控制\n\n为管理物理安全而实施的安全控制可分为三类：管理类、技术类和物理类。由于这些是描述访问控制所使用的相同类别，因此必须专注于这些控制的物理安全层面。*管理类物理安全控制*包括设施建设与选择、场地管理、人员控制、意识培训、应急响应和程序。*技术类物理安全控制*包括访问控制；入侵检测；报警；闭路电视（`CCTV`）；监控；供暖、通风和空调（`HVAC`）电源；以及火灾探测和抑制。*物理安全的物理控制*包括围栏、照明、锁具、建筑材料、人员闸、警犬和警卫。\n\
  \n在为环境设计物理安全时，应关注控制措施应按何种功能顺序使用。顺序如下：\n\n1.  威慑\n2.  拒绝\n3.  检测\n4.  延迟\n\n安全控制的部署应使得最初对物理资产的访问企图受到*威慑*（边界限制即实现此目的）。若威慑失败，则应*拒绝*对物理资产的直接访问（例如，上锁的金库门）。若拒绝失败，系统需*检测*入侵（例如，使用运动传感器），并使入侵者在访问尝试中受到足够的*延迟*，以便当局做出响应（例如，资产上的钢缆锁）。部署物理安全控制时，请务必记住此顺序：先威慑，后拒绝，再检测，最后延迟。\n\
  \n#### 设备故障\n\n无论组织选择购买和安装的设备质量如何，最终都会发生故障。理解并为这一必然情况做好准备，有助于确保 IT 基础设施的持续可用性，并应有助于保护资源的完整性和可用性。\n\
  \n\n\n\n### 为设备故障做准备\n\n为设备故障做准备可以采取多种形式。在某些非关键任务场景中，仅仅知道在哪里可以购买替换部件以实现 48 小时的更换时间线就足够了。在其他场景中，维护现场备件是强制性的。请记住，将系统恢复到完全运行状态的响应时间与维护此类解决方案所涉及的成本成正比。成本包括存储、运输、预先采购，以及维护现场安装和恢复专业知识。在某些情况下，维护现场替换部件是不可行的。对于这些情况，与硬件供应商建立\
  \ `service-level agreement (SLA)`（服务级别协议）至关重要。`SLA` 明确定义了供应商在发生设备故障紧急情况时将提供的响应时间。\n\
  \n老化的硬件应安排更换和/或维修。此类操作的时间表应基于为每个设备确定的 `mean time to failure (MTTF)`（平均故障前时间）和 `mean\
  \ time to repair (MTTR)`（平均修复时间）估算值，或基于管理硬件生命周期的通行组织最佳实践。`MTTF` 是指在特定操作环境下设备的预期典型功能寿命。`MTTR`\
  \ 是指对设备执行维修所需的平均时间。在预期发生灾难性故障之前，设备通常可以经历多次维修。请务必在设备的 `MTTF` 到期前安排所有设备进行更换。一项额外的度量指标是\
  \ `mean time between failures (MTBF)`（平均故障间隔时间）。这是对首次故障与任何后续故障之间时间的估算。如果 `MTTF`\
  \ 和 `MTBF` 值相同或相当相似，制造商通常只列出 `MTTF` 来代表这两个值。\n\n当设备被送出维修时，你需要有一个替代解决方案或备用设备来填补维修期间的空缺。通常，在发生轻微故障后再进行维修是可以接受的，但在发生完全故障后再进行更换则是一种不可接受的安全做法。\n\
  \n#### 线缆间\n\n线缆间过去是一个小壁橱，用于使用配线架整理建筑物的电信电缆。如今，线缆间仍用于组织目的，但也发挥着重要的基础设施作用。现代 `wiring\
  \ closet`（线缆间）是整栋建筑或仅一层楼的网络电缆连接到其他关键设备的地方，例如配线架、交换机、路由器、局域网 (`LAN`) 扩展器和骨干通道。线缆间的其他更专业的名称包括\
  \ `premises wire distribution room`（楼内线缆配线间）和 `intermediate distribution facilities\
  \ (IDF)`（中间配线设施）。在线缆间放置一个或多个机架的互连设备是相当常见的（参见 图 10.1）。\n\n较大的建筑物可能需要多个线缆间，以保持在最大电缆布线长度限制内。对于常见的铜质双绞线布线，最大布线长度为\
  \ 100 米。然而，在电气噪声环境中，此布线长度可能会显著减少。线缆间也作为连接多个楼层的便利位置。在这样的多层配置中，线缆间通常位于各自楼层的正上方或正下方。\n\
  \n![图 10.1 典型的线缆间  ¶ 来源：https://www.flickr.com/photos/clonedmilkmen/4390901323/](img/c10f001.jpg)\n\
  \n**图 10.1** 典型的线缆间  ¶ 来源：[`www.flickr.com/photos/clonedmilkmen/4390901323/`](https://www.flickr.com/photos/clonedmilkmen/4390901323/)\n\
  \n线缆间也常用于容纳和管理建筑物许多其他重要元素的布线，包括报警系统、断路器面板、电话配线架、无线接入点和视频系统（包括监控摄像头）。\n\n线缆间安全极其重要。线缆间的大多数安全措施侧重于防止物理未授权访问。如果未授权入侵者获得访问权限，他们可能会窃取设备、拔除或切断电缆，甚至植入窃听设备。因此，线缆间的安全策略应包含一些基本规则，例如：\n\
  \n*   切勿将线缆间用作通用存储区。\n*   配备足够的锁具，可能包括生物识别元素。\n*   保持区域整洁。\n*   切勿在该区域存放易燃物品。\n\
  *   设置视频监控以监控线缆间内部活动。\n*   使用门开传感器记录进入日志。\n*   除授权管理员外，切勿将钥匙交给任何人。\n*   定期对线缆间的安全性和内容进行物理检查。\n\
  *   将线缆间纳入组织的环境管理和监控中，以确保适当的环境控制和监控，并检测水淹或火灾等有害状况。\n\n通知建筑物管理部门你的线缆间安全策略和访问限制也很重要。这将进一步减少未授权访问尝试。\n\
  \n线缆间只是 `cable plant management policy`（布线系统管理策略）的一个要素。`cable plant`（布线系统）是建立物理网络的相互连接的电缆和中间设备（如交叉连接、配线架和交换机）的集合。布线系统的要素包括：\n\
  \n*   `Entrance facility`（入户设施）：也称为分界点，这是电缆进入建筑物的入口点，供应商的电缆在此连接内部布线系统。\n*   `Equipment\
  \ room`（设备间）：这是建筑物的主线缆间，通常与入户设施相连或相邻。\n*   `Backbone distribution system`（骨干配线系统）：这提供设备间与电信间之间的有线连接，包括跨楼层连接。\n\
  *   `Telecommunications room`（电信间）：也称为线缆间，通过提供网络设备和布线系统的空间，满足楼层或大型建筑物一部分的连接需求。它还作为骨干配线系统和水平配线系统之间的互连点。\n\
  *   `Horizontal distribution system`（水平配线系统）：这提供电信间与工作区之间的连接，通常包括布线、交叉连接块、配线架和支持硬件基础设施（如电缆托架、电缆挂钩和管道）。\n\
  \n#### 服务器机房/数据中心\n\n`Server rooms`（服务器机房）、`data centers`（数据中心）、通信室、线缆间、`server\
  \ vaults`（服务器保险库）和 `IT closets`（IT 间）是封闭的、受限的和受保护的房间，用于放置你的关键任务服务器和网络设备。集中式服务器机房不必适合人类工作。事实上，服务器机房越不适合人类，它对偶然和蓄意攻击提供的保护就越多。可以通过引入\
  \ Halotron、PyroGen 或其他卤代烷替代氧气置换灭火系统、低温、微光或无光、以及设备堆叠留有极小操作空间来实现人类不适宜性。服务器机房的设计应支持\
  \ IT 基础设施的最佳运行，并阻止未授权的人员访问或干预。\n\n服务器机房应位于建筑物的核心位置。应尽量避免将这些房间设在底层、顶层和地下室。此外，服务器机房应远离水管、燃气管和污水管。这些管道存在过大的泄漏或水淹风险，可能导致严重损坏和停机。\n\
  \n\n\n\n### 数据中心和服务器机房物理安全\n\n对于许多组织而言，其数据中心和服务器机房是同一场所。对于某些组织，数据中心是一个外部场所，用于存放其大部分后端计算机服务器、数据存储设备和网络管理设备。这可能是一座位于主要办公室附近的独立建筑，也可能是一个远程站点。数据中心可能由组织独家拥有和管理，也可能是从数据中心提供商租赁的服务。数据中心可能采用单租户配置，也可能采用多租户配置。无论采用何种形式，除了服务器机房的考量因素外，许多其他概念也可能相关。\n\
  \n在许多数据中心和服务器机房中，采用各种技术控制作为访问控制机制来管理物理访问。这些包括但不限于：智能/哑卡、邻近读卡器、生物识别、入侵检测系统（`IDSs`）以及基于纵深防御的设计。\n\
  \n##### 智能卡\n\n**智能卡**是嵌有磁条、条形码或集成电路芯片的信用卡大小的身份证、工牌或安全通行证。它们包含经授权持卡人的信息，可用于识别和/或认证目的。某些智能卡甚至能处理信息或在存储芯片中存储相当数量的数据。智能卡可能有多种称呼或术语：\n\
  \n*   包含集成电路（`ICs`）的身份令牌\n*   处理器 `IC` 卡\n*   具有 `ISO 7816` 接口的 `IC` 卡\n\n智能卡常被视为完整的安全解决方案，但不应单独视为完整方案。与任何单一安全机制一样，智能卡也存在弱点和漏洞。智能卡可能遭受物理攻击、逻辑攻击、木马攻击或社会工程学攻击。在大多数情况下，智能卡用于多因素配置。因此，智能卡的丢失或被盗不会导致轻易被冒充。与智能卡相关的最常见多因素形式是要求输入\
  \ `PIN`。您可在第 13 章“管理身份和认证”中找到关于智能卡的更多信息。\n\n**存储卡**是带有磁条的机器可读身份证。与信用卡、借记卡或 ATM 卡类似，存储卡能保留少量数据，但无法像智能卡那样处理数据。存储卡通常作为一种双因素控制发挥作用：卡片是“您拥有的东西”，其个人识别码（`PIN`）是“您知道的东西”。然而，存储卡易于复制或伪造，不足以用于安全环境中的认证目的。\n\
  \n#### 邻近读卡器\n\n除了智能/哑卡外，邻近读卡器也可用于控制物理访问。**邻近读卡器**可以是无源设备、场供电设备或应答器。邻近设备由授权持有者佩戴或手持。当其经过邻近读卡器时，读卡器能识别持有者身份及其是否拥有授权访问权限。无源设备反射或以其他方式改变读卡器产生的电磁场。读卡器检测到这种变化。\n\
  \n无源设备没有有源电子元件；它只是一个具有特定属性的小磁铁（如常见于 DVD 上的防盗设备）。场供电设备具有电子元件，当设备进入读卡器产生的电磁场时会被激活。此类设备实际上从\
  \ `EM` 场产生电能以自我供电（如仅需将门禁卡在读卡器几英寸范围内挥动即可开门的读卡器）。应答器设备自带电源并发射供读卡器接收的信号。这可以持续进行，也可以仅在按下按钮时发生（如车库门开启器或汽车报警钥匙扣）。\n\
  \n除了智能/哑卡和邻近读卡器外，物理访问还可通过**射频识别（`RFID`）**或生物识别访问控制设备进行管理。生物识别设备的描述请参见第 13 章。这些设备及其他设备（如线缆锁）可支持设备的保护和安全固定。\n\
  \n#### 入侵检测系统\n\n**入侵检测系统（`IDSs`）**是旨在检测入侵企图、违规或攻击；未经授权的入口/点的使用；或在未经授权或异常时间发生特定事件的系统——无论是自动化还是人工。用于监控物理活动的入侵检测系统可能包括保安人员、自动化访问控制、运动探测器以及其他专业监控技术。这些将在后续章节“运动探测器”和“入侵报警”中详细讨论。\n\
  \n物理入侵检测系统，也称为**防盗报警器**，可检测未经授权的活动并通知当局（内部安保或外部执法部门）。最常见的系统类型使用简单电路（即干接点开关），由入口处的箔带组成，用于检测门或窗何时被打开。\n\
  \n入侵检测机制只有在连接到入侵报警器时才有用。（请参阅本章后面的“入侵报警”。）入侵报警器会向当局通报物理安全漏洞。\n\n任何入侵检测和报警系统有两个方面可能导致其失效：电源获取方式和通信方式。如果系统断电，报警器将无法工作。因此，可靠的检测和报警系统配有电池备份，存储的电量足以支持\
  \ 24 小时运行。\n\n如果通信线路被切断，报警器可能无法工作，安保人员和应急服务部门将不会收到通知。因此，可靠的检测和报警系统包含用于线路监督的**心跳传感器**。心跳传感器是一种机制，通过测试信号持续或定期检查通信路径。如果接收站检测到心跳信号失败，报警器将自动触发。这两项措施旨在防止入侵者规避检测和报警系统。\n\
  \n#### 访问滥用\n\n无论使用何种形式的物理访问控制，都必须部署保安人员或其他监控系统以防止滥用、冒名顶替和尾随。物理访问控制滥用的例子包括撬开安全门和绕过锁具或访问控制。**冒名顶替**是指使用他人的安全证件进入设施。**尾随**是指在未被识别或授权的情况下，跟随他人通过安全闸门或门口。可通过创建审计跟踪和保留访问日志来检测此类滥用行为。\n\
  \n审计跟踪和访问日志甚至对物理访问控制也是有用的工具。它们可能需要由保安人员手动创建。或者，如果使用了足够的自动化访问控制机制（如智能卡和某些邻近读卡器），它们可以自动生成。主体请求进入的时间、认证过程的结果以及安全闸门保持开启的时长，是审计跟踪和访问日志中应包含的重要要素。除了使用电子或纸质记录外，还应考虑使用**闭路电视（`CCTV`）**或监控摄像头监控入口点。`CCTV`\
  \ 使您能够将审计跟踪和访问日志与事件的视觉记录进行比对。此类信息对于重构入侵、违规或攻击事件至关重要。\n\n#### 射频辐射安全\n\n\n\n\n\n\
  ### TEMPEST 对策与物理安全\n\n许多电气设备会发射电信号或辐射，这些信号可能被未经授权的个人截获。这些信号可能包含机密、敏感或私密数据。显而易见的发射设备示例包括无线网络设备和移动电话，但许多其他设备也容易被截获。其他示例包括显示器、调制解调器，以及内部或外部介质驱动器（硬盘驱动器、USB\
  \ 闪存驱动器、CD 等）。利用合适的设备，未经授权的用户可以截获这些设备发出的电磁或射频信号（统称为*发射信号*），并对其进行解读以提取机密数据。\n\n显然，如果设备发出的信号可以被组织外部的人员截获，则需要某种安全防护。用于防范发射攻击的对策和保护措施类型被称为\
  \ **TEMPEST 对策**。*TEMPEST* 最初是一项政府研究项目，旨在保护电子设备免受核爆炸期间发出的电磁脉冲（EMP）影响。此后，其范围已扩展到对发射信号的监控及防止其被截获的通用研究。因此，TEMPEST\
  \ 现在成为一大类活动的正式名称。\n\nTEMPEST 对策包括法拉第笼、白噪声和控制区。\n\n#### 法拉第笼\n\n*法拉第笼* 是一种箱体、移动房间或整栋建筑，其设计包含外部金属外皮，通常是完全包围某区域各面（即前、后、左、右、上、下）的金属网。这种金属外皮充当电磁干扰（EMI）吸收电容器（这也是以电磁学先驱迈克尔·法拉第命名的原因），防止电磁信号（发射信号）逸出或进入笼子所包围的区域。法拉第笼在阻挡电磁信号方面非常有效。事实上，在激活的法拉第笼内，移动电话无法工作，也无法接收广播电台或电视台的信号。\n\
  \n#### 白噪声\n\n*白噪声* 简单来说就是持续广播虚假通信流量，以掩盖和隐藏真实发射信号的存在。白噪声可以由来自另一个非机密源的真实信号、特定频率的恒定信号、随机变化的信号（如收音机或电视台频道之间听到的白噪声），甚至是导致截获设备失效的干扰信号组成。当在区域周边产生白噪声并向外广播，以保护内部可能需要发射信号进行正常操作的区域时，白噪声最为有效。\n\
  \n#### 控制区\n\n第三种 TEMPEST 对策是*控制区*，它只是在环境中实施法拉第笼、白噪声生成或两者兼施，以保护特定区域；环境的其余部分不受影响。控制区可以是一个房间、一层楼或整栋建筑。控制区是指那些发射信号被必要设备（如无线网络、移动电话、收音机和电视）支持和使用的区域。在控制区之外，通过使用各种\
  \ TEMPEST 对策，可以阻挡或防止发射信号被截获。\n\n### 介质存储设施\n\n介质存储设施的设计应能安全地存储空白介质、可重复使用介质和安装介质。无论是硬盘驱动器、闪存设备、光盘还是磁带，介质都应受到控制以防止盗窃和损坏。新的空白介质应得到保护，防止被盗或被植入恶意软件。\n\
  \n可重复使用的介质（如拇指驱动器、闪存卡或便携式硬盘驱动器）应受到保护，防止盗窃和数据残留恢复。*数据残留* 是指在标准删除或格式化过程后，存储设备上留下的剩余数据元素。此类过程会清除目录结构并将簇标记为可用，但会将原始数据保留在簇中。简单的取消删除工具或数据恢复扫描程序通常可以恢复对这些文件的访问。限制对介质的访问并使用安全擦除解决方案可以降低此风险。\n\
  \n安装介质需要受到保护，防止盗窃和恶意软件植入。这将确保在需要执行新安装时，介质可用且安全。\n\n以下是实施安全介质存储设施的一些方法：\n\n*   将介质存放在带锁的柜子或保险箱中。\n\
  *   指定一名管理员或保管员管理对带锁介质柜的访问。\n*   使用登记/签出流程来追踪谁从存储中取出、使用和归还介质。\n*   对于可重复使用的介质，当设备归还时，运行安全驱动器清理或*归零*（一种通过用无意义数据（如零）替换数据来擦除数据的过程）流程，以移除所有数据残留。\n\
  *   还可以使用基于哈希的完整性检查机制来验证介质，以确保有效文件保持有效，或者介质已被正确且完全清理，不保留任何先前使用的残留。\n\n对于安全要求更高的组织，可能有必要在介质上贴上安全通知标签以指示其使用分类，或在介质上使用\
  \ RFID/NFC 资产追踪标签。使用更像保险箱而非办公用品架的存储柜也可能很重要。更高级别的防护还可能包括火灾、洪水、电磁场和温度的监控与防护。\n\n###\
  \ 证据存储\n\n证据存储正迅速成为所有企业的必需品，而不仅仅是执法相关组织。随着网络犯罪事件持续增加，保留日志、审计跟踪和其他数字事件记录变得至关重要。也可能需要保留驱动器的镜像副本或虚拟机的快照以供将来比对。这可能与内部企业调查或执法部门的取证分析有关。无论哪种情况，保存可能用作证据的数据集对于企业内部调查或执法部门对网络犯罪的调查得出有利结论至关重要。\n\
  \n安全的证据存储可能涉及以下内容：\n\n*   一个独立于生产网络的专用存储系统\n*   在不主动传输新数据集时，可能让存储系统保持离线状态\n*   阻断存储系统与互联网的连接\n\
  *   追踪证据存储系统上的所有活动\n*   为系统上存储的所有数据集计算哈希值\n*   仅限安全管理员和法律顾问访问\n*   加密系统上存储的所有数据集\n\
  \n根据您的当地法规、行业或合同义务，证据存储解决方案可能还有额外的安全要求。\n\n### 受限区域与工作区域安全\n\n内部安全的设计和配置，包括工作区域和访客区域，应经过仔细考虑。设施内的所有位置不应具有同等访问权限。包含价值更高或重要性更大资产的区域应具有更严格的访问限制。例如，进入设施的任何人都应能在不进入敏感区域的情况下使用洗手间和公用电话，但只有网络管理员和安全人员才能进入服务器机房。贵重和机密资产应位于设施提供的核心或中心防护区域内。实际上，您应专注于部署同心圆式的物理防护。这种配置需要更高级别的授权才能进入设施内更敏感的区域。\n\
  \n\n\n\n\n### 用于工作区域隔离的墙壁或隔断\n\n墙壁或隔断可用于分隔相似但不同的工作区域。此类隔离可防止随意的**肩窥**或窃听（`shoulder\
  \ surfing` 是指通过观察显示器或操作员使用键盘，从系统中收集信息的行为）。应使用落地至天花板的墙壁来分隔具有不同敏感度和机密级别的区域（如果存在假天花板或吊顶，墙壁也应将其隔断，以在安全级别较高和较低的区域之间提供不间断的物理屏障）。\n\
  \n每个工作区域都应进行评估并分配分类，就像对 IT 资产进行分类一样。只有持有与工作区域分类相对应的许可或分级的人员，才应被允许进入。用途或目的不同的区域应分配不同的访问级别或限制。区域内的设备提供的资产访问权限越多，用于控制谁进入这些区域以及他们被允许执行什么活动的限制就越重要。\n\
  \n您的设施安全设计流程应支持内部安全的实施和运行。除了对合适工作空间内员工的管理外，还应解决访客和访客控制问题。是否应要求访客由人员陪同？还应实施哪些其他形式的访客控制？除了钥匙和锁等基本物理安全工具外，还应实施人员锁、摄像头、书面日志、安保人员和\
  \ RFID ID 标签等机制。\n\n#### 敏感隔间信息设施 (SCIF)\n\n安全或受限工作区域的一个示例是敏感隔间信息设施 (SCIF)。政府和军事承包商通常使用\
  \ SCIF 为高度敏感的数据存储和计算提供安全环境。SCIF 的目的是存储、查看和更新敏感隔间信息 (SCI)，这是一种机密信息。SCIF 实施受限访问，将入场人员限制在具有特定业务需求并获授权访问其中数据的个人范围内。这通常由个人的许可等级和\
  \ SCI 批准等级决定。在大多数情况下，SCIF 限制在安全区域内使用或携带摄影、录像或其他录音设备。SCIF 可以建立在地面设施、飞机或浮动平台上。SCIF\
  \ 可以是永久性设施，也可以是临时设施。SCIF 通常位于建筑物内部，尽管整个建筑物也可以作为 SCIF 实施。\n\n#### 公用设施和 HVAC 注意事项\n\
  \n电力公司供应的电力并不总是稳定洁净的。大多数电子设备需要洁净电源才能正常运行。因电力波动导致的设备损坏是常见现象。许多组织选择通过各种方式自行管理电力。`不间断电源\
  \ (UPS)` 是一种自充电电池，可用于向敏感设备提供稳定洁净的电力。UPS 的工作原理是：从墙壁插座引入电力，将其存储在电池中，再从电池中取出电力，然后输送给连接的设备。通过让电流流经电池，它能够维持稳定洁净的电力供应。这一概念称为双变换\
  \ UPS。UPS 还有一个功能，常作为卖点：在主电源故障后仍能提供持续供电。取决于其容量和连接设备的功耗，UPS 可继续供电数分钟或数小时。从市电切换到电池供电是瞬间完成的，对设备供电无中断。\n\
  \n另一种形式的 UPS 是线互动式 UPS。该系统在市电电源和设备之间配备了浪涌保护器、电池充电器/逆变器和稳压器。在正常情况下，电池不在线路中。如果市电故障，电力将从电池逆变器和稳压器获取，以向设备提供不间断电力。\n\
  \n电池备份或故障切换电池不属于 UPS 的一种，因为当市电故障并发生切换事件以从电池获取电力时，设备通常会经历一段（即使只是瞬间）完全断电的时间。\n\n确保设备不受电力波动损害的另一种方法是使用带浪涌保护器的电源插座。浪涌保护器包含一个保险丝，它会在电力电平变化到足以损坏设备之前熔断。然而，一旦浪涌保护器的保险丝或电路跳闸，电流流动将完全中断。仅当电力瞬间中断不会导致设备损坏或数据丢失时，才应使用浪涌保护器。否则，应改用\
  \ UPS。\n\n如果在电压降或停电情况下维持长时间运行是必要条件，则需要现场发电机。此类发电机在检测到电力故障时会自动启动。大多数发电机使用液体或气体燃料箱运行，必须对其进行维护以确保可靠性。发电机被视为备用或后备电源。\n\
  \n电力问题多种多样。以下是您应了解的与电力问题相关的术语列表：\n\n*   `故障`：瞬时断电\n*   `停电`：完全断电\n*   `电压跌落`：瞬时低电压\n\
  *   `电压降`：持续低电压\n*   `尖峰`：瞬时高电压\n*   `浪涌`：持续高电压\n*   `涌入电流`：通常与连接电源（无论是主电源还是备用/辅助电源）相关的初始电流浪涌\n\
  *   `噪声`：稳态干扰性电力扰动或波动\n*   `瞬态`：短时线路噪声扰动\n*   `洁净电源`：无波动的纯净电力\n*   `地线`：电路中接地的导线\n\
  \n发生电力问题时，确定故障发生位置非常重要。如果问题发生在电表外侧，则由电力公司负责维修；而任何内部问题均由您自行负责。\n\n##### 噪声\n\n噪声不仅会导致设备运行出现问题，还会干扰通信、传输和回放的质量。电流产生的噪声会影响依赖电磁传输机制的任何数据传输方式，如电话、蜂窝网络、电视、音频、无线电和网络机制。\n\
  \n`电磁干扰 (EMI)` 有两种类型：共模和横模（串模）。`共模噪声` 由电源或运行中电气设备的火线与地线之间的电位差产生。`横模噪声` 由电源或运行中电气设备的火线与零线之间的电位差产生。\n\
  \n`射频干扰 (RFI)` 是另一种噪声和干扰源，可影响许多与 EMI 相同的系统。各种常见电器都会产生 RFI，包括日光灯、电缆、电暖器、计算机、电梯、电机和电磁铁，因此在部署\
  \ IT 系统和基础设施元素时，定位所有此类设备非常重要。\n\n保护电源和设备免受噪声影响，是维护 IT 基础设施高效运行环境的重要组成部分。采取的保护措施包括：提供充分的电源调节、建立良好的接地、屏蔽所有电缆，以及限制暴露于\
  \ EMI 和 RFI 源。\n\n##### 温度、湿度和静电\n\n\n\n\n\n### 环境控制：HVAC 与湿度\n\n除了电源考量外，维护环境还涉及对\
  \ HVAC（供暖、通风与空调）机制的控制。主要用于放置计算机的机房，温度通常应保持在 60 至 75 华氏度（15 至 23 摄氏度）之间。不过，也存在一些极端环境：有的将设备运行温度降至\
  \ 50 华氏度，有的则高于 90 华氏度。计算机机房的湿度应维持在 40% 至 60% 之间。湿度过高会导致腐蚀；湿度过低会产生静电。即使铺设了防静电地毯，若环境湿度过低，仍可能产生\
  \ 20,000 伏的静电放电。正如 表 10.1 所示，即使是极低水平的静电放电也能损毁电子设备。\n\n#### 表 10.1 静电电压与损害\n\n| 静电电压\
  \ | 可能造成的损害 |\n| :--- | :--- |\n| 40 V | 破坏敏感电路及其他电子元件 |\n| 1,000 V | 扰乱显示器画面 |\n\
  | 1,500 V | 破坏硬盘上存储的数据 |\n| 2,000 V | 导致系统突然关机 |\n| 4,000 V | 打印机卡纸或元件损坏 |\n| 17,000\
  \ V | 永久性电路损坏 |\n\n### 水患问题（如泄漏、洪水）\n\n水患问题（如泄漏和洪水）应在环境安全策略和程序中予以处理。管道泄漏虽非日常高发事件，但一旦发生，可能造成严重损害。\n\
  \n水电不相容。若计算机系统接触水，尤其是在运行状态下，必然导致损坏。此外，水和电还会给附近人员带来严重的触电风险。尽可能将服务器机房、数据中心和关键计算机设备安置在远离任何水源或输水管道的位置。您也可以在任务关键型系统周围的地板上安装水检测电路。一旦水逼近设备，水检测电路会发出警报并通知您。\n\
  \n为将紧急情况降至最低，应熟悉关断阀和排水口的位置。除了监控管道泄漏外，还应评估设施应对周边暴雨或洪水的能力。设施是位于山顶还是山谷？排水是否充足？是否有洪水或积水历史？服务器机房是设在地下室还是一楼？\n\
  \n### 火灾预防、探测与抑制\n\n火灾预防、探测和抑制绝不可忽视。保护人员免受伤害，应始终是任何安全或防护系统的首要目标。除了保护人员，火灾探测和抑制旨在将火灾、烟雾、高温及抑制材料造成的损害降至最低，尤其是对\
  \ IT 基础设施的损害。\n\n标准的火灾预防和处理培训涉及火灾三角（参见 图 10.2）的知识。三角形的三个顶点分别代表燃料、热量和氧气。三角形中心代表这三种元素间的化学反应。火灾三角的要旨在于：若能从火灾三角中移除任一项（三要素加化学反应共四项），火灾即可被扑灭。不同的灭火介质针对火灾三角的不同方面：\n\
  \n*   **水**：降低温度。\n*   **苏打酸及其他干粉**：抑制燃料供应。\n*   **CO₂**：抑制氧气供应。\n*   **卤代烷替代品及其他不燃气体**：干扰燃烧化学反应和/或抑制氧气供应。\n\
  \n![图 10.2 火灾三角](img/c10f002.jpg)\n\n**图 10.2 火灾三角**\n\n选择灭火介质时，应考虑其针对火灾三角的哪个方面、实际代表何意、通常灭火效果如何，以及对环境将产生何种影响。\n\
  \n除了理解火灾三角，还应了解火灾发展阶段。火灾会经历多个阶段，图 10.3 展示了最关键的四个阶段。\n\n![图 10.3 火灾的四个主要阶段](img/c10f003.jpg)\n\
  \n**图 10.3 火灾的四个主要阶段**\n\n**阶段 1：初期阶段** 此阶段仅有空气电离，无烟雾产生。\n\n**阶段 2：冒烟阶段** 起火点冒出可见烟雾。\n\
  \n**阶段 3：明火阶段** 肉眼可见火焰。\n\n**阶段 4：高热阶段** 火势显著发展，热量剧烈积聚，区域内一切物品均开始燃烧。\n\n火灾探测越早，扑灭越容易，其及灭火介质造成的损害也越小。\n\
  \n火灾管理的基础之一是人员意识培训。所有人员应彻底熟悉所在设施的灭火机制。每个人还应熟悉从主要工作区撤离的至少两条疏散路线，并知晓如何在设施其他位置寻找疏散路线。人员应接受灭火器位置和使用方法的培训。火灾或一般应急响应培训的其他内容包括：心肺复苏术（CPR）、紧急关机程序，以及预先设定的集合地点或安全核实机制（如语音信箱）。\n\
  \n#### 灭火器\n\n灭火器有多种类型。了解在各类火灾中应使用哪种灭火器，对有效灭火至关重要。若使用不当或选错类型，火势不但不会熄灭，反而可能蔓延加剧。灭火器仅适用于火灾仍处于初期阶段的情况。表\
  \ 10.2 列出了三种常见类型的灭火器。\n\n#### 表 10.2 灭火器分类\n\n| 类别 | 火灾类型 | 灭火剂 |\n| :--- | :---\
  \ | :--- |\n| A 类 | 普通可燃物 | 水、苏打酸（干粉或液体化学剂） |\n| B 类 | 液体 | CO₂、卤代烷*、苏打酸 |\n| C\
  \ 类 | 电气设备 | CO₂、卤代烷* |\n| D 类 | 金属 | 干粉 |\n\n* 卤代烷或 EPA 批准的卤代烷替代品\n\n#### 火灾探测系统\n\
  \n要妥善保护设施免受火灾侵害，必须安装自动探测和抑制系统。火灾探测系统类型繁多：\n\n*   **定温探测系统**：当温度达到特定值时触发灭火。触发装置通常是喷头中的金属或塑料部件，在特定温度下熔化。另一种版本包含装有化学药剂的小玻璃管，药剂在特定温度下汽化产生超压使容器破裂。\n\
  *   **升温速率探测系统**：当温度变化速率达到特定水平时触发灭火。\n*   **火焰驱动系统**：基于火焰的红外能量触发灭火。\n*   **烟雾驱动系统**：使用光电或放射性电离传感器作为触发器。\n\
  *   **初期烟雾探测系统**（又称吸气式传感器）：能在火灾通过其他手段被发现之前，探测到燃烧极早期通常伴随的化学物质。\n\n大多数火灾探测系统可连接消防部门通报机制。触发灭火时，此类联动系统会通过自动消息或警报联系当地消防部门请求救援。\n\
  \n\n\n\n为了有效，火灾探测器需要进行策略性部署。不要忘记将它们放置在吊顶内、架空地板下、服务器机房、私人办公室和公共区域、暖通空调风口、电梯井、地下室等位置。\n\
  \n关于使用的灭火机制，可以基于水，也可以基于气体灭火系统。水常用于适合人类生存的环境，而气体系统更适合通常无人员常驻的计算机机房。\n\n##### 水灭火系统\n\
  \n水灭火系统主要有四种类型：\n\n*   **湿式管道系统**（*wet pipe system*，也称为*闭式系统* / *closed head system*）始终充满水。触发灭火时，水立即喷出。\n\
  *   **干式管道系统**（*dry pipe system*）内充有压缩空气。触发灭火时，空气逸出，打开水阀，水随之充满管道并喷向环境。\n*   **淋喷系统**（*deluge\
  \ system*）是另一种干式管道系统，使用更大口径的管道，因此能输送大得多的水量。淋喷系统不适用于包含电子设备和计算机的环境。\n*   **预作用系统**（*preaction\
  \ system*）是干式管道系统和湿式管道系统的组合。系统平时作为干式管道存在；一旦探测到火灾初期阶段（烟雾、热量等），管道就会注满水。只有当喷头触发装置被足够的热量熔化后，水才会释放。如果在喷头触发前火势被扑灭，管道可手动排空并复位。这也允许在喷头触发前进行人工干预以阻止放水。\n\
  \n预作用系统是同时容纳计算机和人员环境最合适的水基灭火系统。\n\n##### 气体释放系统\n\n**气体释放系统**（*Gas discharge systems*）通常比水释放系统更有效。然而，气体释放系统不应用于有人员所在的环境。气体释放系统通常通过移除空气中的氧气来灭火，因此对人员有害。它们采用加压气体灭火介质，如\
  \ `CO2`、卤代烷（`halon`）或 `FM-200`（一种卤代烷替代品）。\n\n卤代烷是一种有效的灭火化合物（它通过破坏氧气与可燃材料之间的化学反应，使火灾窒息），但在\
  \ 900 华氏度（约 482 摄氏度）下会降解为有毒气体。此外，它不环保（属于消耗臭氧层物质）。1994 年，美国环保署（`EPA`）禁止在美国生产卤代烷。进口\
  \ 1994 年后生产的卤代烷也是非法的。（发达国家于 2003 年 12 月 31 日停止生产卤代烷 1301、卤代烷 1211 和卤代烷 2403。）不过，根据《蒙特利尔议定书》，您可以通过联系卤代烷回收机构获得卤代烷。`EPA`\
  \ 致力于耗尽现有卤代烷库存，使该物质退出流通。\n\n鉴于卤代烷的问题，它通常被更环保、毒性更低的介质所替代。以下列出了各种 `EPA` 批准的卤代烷替代品（详见\
  \ <http://www.epa.gov/ozone/snap/fire/halonreps.html>）：\n\n*   `FM-200` (HFC-227ea)\n\
  *   `CEA-410` 或 `CEA-308`\n*   `NAF-S-III` (HCFC Blend A)\n*   `FE-13` (HCFC-23)\n\
  *   `Argon` (IG55) 或 `Argonite` (IG01)\n*   `Inergen` (IG541)\n*   `Aero-K`（气溶胶形式的微观钾化合物）\n\
  \n您也可以用低压水雾替代卤代烷替代品，但此类系统通常不用于计算机机房或电气设备存储设施。低压水雾是一种蒸汽云，用于快速降低区域温度。\n\n##### 损害\n\
  \n处理火灾探测和灭火包括应对火灾可能造成的污染和损害。火灾的破坏性因素包括烟雾和热量，也包括灭火介质，如水或苏打酸。烟雾会损坏大多数存储设备。热量会损坏任何电子或计算机组件。例如，100\
  \ 华氏度（约 38 摄氏度）可损坏存储磁带，175 华氏度（约 79 摄氏度）可损坏计算机硬件（即中央处理器 `CPU` 和随机存取存储器 `RAM`），350\
  \ 华氏度（约 177 摄氏度）可损坏纸制品（导致翘曲和变色）。\n\n灭火介质可能导致短路、引发腐蚀，或以其他方式使设备报废。设计火灾响应系统时必须解决所有这些问题。\n\
  \n### 实施和管理物理安全\n\n可以在环境中部署多种物理访问控制机制，以控制、监控和管理对设施的访问。这些机制范围从威慑手段到探测机制。站点或设施内的各个部分、区域应明确指定为公共、私有或受限区域。每个区域都需要独特且针对性的物理访问控制、监控和预防机制。以下章节讨论了许多可用于分隔、隔离和控制对站点各区域访问的机制，包括外围和内部安全。\n\
  \n#### 外围安全控制\n\n建筑或园区位置的可访问性也很重要。单一入口利于安全，但多个入口更利于紧急疏散。附近有什么类型的道路？有哪些易达的交通方式（火车、高速公路、机场、航运）？全天的交通流量如何？\n\
  \n请记住，可访问性也受外围安全需求的制约。访问和使用的需求应与外围安全的实施和操作相融合并相互支持。使用物理访问控制、监控人员和设备的进出，以及审计/记录所有物理事件，是维护组织整体安全的关键要素。\n\
  \n##### 围栏、大门、转闸门和人员夹持间\n\n**围栏**（*fence*）是一种界定外围的设备。围栏用于清晰区分处于特定安全保护级别下的区域和未受保护的区域。围栏可包含多种组件、材料和施工方法。它可以是地面上的油漆条纹、铁丝网围栏、刺铁丝、混凝土墙，甚至是使用激光、运动或热探测器的隐形外围。不同类型的围栏对不同类型的入侵者有效：\n\
  \n*   高 3 至 4 英尺（约 0.9 至 1.2 米）的围栏可阻吓偶尔闯入者。\n*   高 6 至 7 英尺（约 1.8 至 2.1 米）的围栏难以轻易攀爬，可阻吓大多数入侵者，但无法阻止坚定的入侵者。\n\
  *   高 8 英尺（约 2.4 米）以上且带有三股刺铁丝的围栏甚至能阻吓坚定的入侵者。\n\n**大门**（*gate*）是围栏上的受控出入口。大门的威慑级别必须等同于围栏的威慑级别，以维持围栏整体的有效性。铰链和锁定/关闭机制应经过加固，以防篡改、破坏或拆除。大门关闭时，不应提供任何额外的访问漏洞。应将大门数量保持在最少。可由警卫监控。无警卫保护时，建议使用犬只或\
  \ `CCTV`（闭路电视监控系统）。\n\n**转闸门**（*turnstile*，参见图 10.4）是一种大门形式，可防止一次有多人进入，且通常限制单向移动。它用于入场而非出场，或反之。转闸门基本上是围栏版的安全旋转门。\n\
  \n![图 10.4 带有人员夹持间和转闸门的安全物理边界](img/c10f004.jpg)\n\n**图 10.4** 带有人员夹持间和转闸门的安全物理边界\n\
  \n\n\n\n### 内部安全控制\n\n如果设施采用限制区域来控制物理安全，则需要一种处理访客的机制。通常会为访客指派一名护送人员，并密切监控他们的访问权限和活动。当允许外部人员进入受保护区域时，若未能追踪其行为，可能导致针对最核心资产的恶意活动。访客控制还可以通过使用钥匙、组合锁、工牌、运动探测器、入侵报警器等手段获益。\n\
  \n#### 钥匙和组合锁\n\n锁具能让关闭的门保持关闭状态。它们的设计和部署旨在阻止所有未经授权的人员进入。`lock`（锁）是一种粗糙的识别和授权机制。如果你持有正确的钥匙或组合密码，即视为已授权并允许进入。基于钥匙的锁是最常见且廉价的物理访问控制设备。这些通常被称为\
  \ `preset locks`（预置锁/固定密钥锁）。这类锁容易被技术开启，这通常被归类为一类称为 `shimming`（插片开锁/垫片攻击）的锁具机制攻击。\n\
  \n可编程锁或组合锁比预置锁提供更广泛的控制范围。某些可编程锁可配置多个有效的访问组合，或包含采用小键盘、智能卡或密码设备的数字/电子控制。例如，`electronic\
  \ access control (EAC) lock`（电子访问控制锁）包含三个要素：一个用于保持门关闭的电磁铁，一个用于验证主体身份并断开电磁铁的凭证读取器，以及一个在门关闭时重新接合电磁铁的传感器。\n\
  \n锁具可作为安全警卫的替代方案，充当外围入口访问控制设备。大门或门可由安保人员在核实你的身份后开启或关闭以允许通行，或者锁具本身可作为验证设备，同时授予或限制进入权限。\n\
  \n#### 工牌\n\n`Badges`（工牌/证章）、`identification cards`（身份证件）和 `security IDs`（安全证件）是物理识别和/或电子访问控制设备的形式。工牌可以简单到只是一个指明你是正式员工还是访客的姓名标签。也可以复杂到是一种采用多因素认证来验证和证明你身份、并提供认证授权以访问设施、特定房间或安全工作站的智能卡或令牌设备。工牌通常包含照片、存有编码数据的磁条以及个人详细信息，以协助安保人员核实身份。\n\
  \n在主要由安保人员控制物理访问的环境中，可以使用工牌。在此条件下，工牌作为安保人员的可视化识别工具。他们可通过将你的照片与本人对比，并查阅授权人员的纸质或电子名册，来确定你是否拥有有效访问权限。\n\
  \n\n\n\n\n### 扫描设备环境中的徽章\n\n徽章也可用于由扫描设备而非保安把守的环境中。在此类条件下，徽章可用于**识别**或**认证**。当徽章用于识别时，需在设备上刷卡，随后徽章持有者必须提供一个或多个认证因素，例如密码、口令或生物特征（如果使用生物识别设备）。当徽章用于认证时，徽章持有者提供\
  \ ID、用户名等，然后刷卡进行认证。\n\n#### 运动探测器\n\n`motion detector`（运动探测器）或 `motion sensor`（运动传感器）是一种能感知特定区域内移动或声音的设备。运动探测器类型繁多，包括红外、热感、波形、电容、光电和无源音频等。\n\
  \n*   `infrared motion detector`（红外运动探测器）监控受监区域红外光照模式的显著或有意义变化。\n*   `heat-based\
  \ motion detector`（热感运动探测器）监控受监区域热度水平和模式的显著或有意义变化。\n*   `wave pattern motion detector`（波形运动探测器）向受监区域发射一致的低频超声波或高频微波信号，并监控反射模式的显著或有意义变化或干扰。\n\
  *   `capacitance motion detector`（电容运动探测器）感知受监物体周围电场或磁场的变化。\n*   `photoelectric\
  \ motion detector`（光电运动探测器）感知受监区域可见光照度的变化。光电运动探测器通常部署在无窗且保持黑暗的内部房间中。\n*   `passive\
  \ audio motion detector`（无源音频运动探测器）监听受监区域内的异常声音。\n\n#### 入侵报警器\n\n每当运动探测器记录到环境中的显著或有意义变化时，就会触发报警。`alarm`（报警器）是一种独立机制，可触发威慑、驱赶和/或通知。\n\
  \n##### 威慑型报警器\n\n触发威慑措施的报警器可能会启动额外的锁、关闭门等。此类报警器的目标是使进一步的入侵或攻击变得更加困难。\n\n##### 驱赶型报警器\n\
  \n触发驱赶措施的报警器通常会拉响音频警笛或警铃并打开灯光。这类报警器用于阻止入侵者或攻击者继续其恶意或非法闯入活动，并迫使其离开现场。\n\n##### 通知型报警器\n\
  \n触发通知的报警器从入侵者/攻击者的角度来看通常是静默的，但会记录事件数据并通知管理员、保安和执法部门。事件记录可以采取日志文件和/或闭路电视（CCTV）录像带的形式。静默报警的目的是将授权安保人员引至入侵或攻击现场，以期抓获实施非法或未授权行为的人员。\n\
  \n报警器也可按其安装位置分类：本地、中心/专有或辅助。\n\n##### 本地报警系统\n\n`Local alarm systems`（本地报警系统）必须广播可听见的（高达\
  \ 120 分贝 [db]）报警信号，且在 400 英尺（约 122 米）范围内清晰可闻。此外，它们必须受到防篡改和防禁用保护，通常由保安负责。为了使本地报警系统有效，必须有安保团队或保安驻守在附近，以便在报警触发时做出响应。\n\
  \n##### 中心站系统\n\n报警器在本地通常是静默的，但异地监控代理会收到通知，以便他们对安全漏洞做出响应。大多数住宅安防系统属于此类。大多数中心站系统为知名或国家级安保公司，如\
  \ Brinks 和 ADT。`proprietary system`（专有系统）类似于中心站系统，但宿主组织拥有自己的现场安保人员，随时待命响应安全漏洞。\n\
  \n##### 辅助站\n\n`Auxiliary alarm systems`（辅助报警系统）可添加到本地或中心报警系统中。当安全边界被突破时，会通知紧急服务部门响应事件并抵达现场。这可能包括消防、警察和医疗服务。\n\
  \n两种或多种类型的入侵和报警系统可整合在单一解决方案中。\n\n#### 二次验证机制\n\n当使用运动探测器、传感器和报警器时，应部署二次验证机制。随着这些设备灵敏度的提高，误触发的频率也会增加。动物、鸟类、昆虫或授权人员的出现等无害事件均可能触发误报。部署两个或多个检测和传感器系统，并要求在报警发出前在短时间内连续发生两次或多次触发，可显著减少误报，并增加报警指示实际入侵或攻击的可能性。\n\
  \n闭路电视（CCTV）是一种与运动探测器、传感器和报警器相关的安全机制。然而，CCTV 并非自动化的检测与响应系统。CCTV 需要人员观看捕获的视频以检测可疑和恶意活动并触发报警。安防摄像头可扩大保安的有效可视范围，从而增加监管范围。在许多情况下，CCTV\
  \ 不用作主要检测工具，因为雇佣专人盯着视频屏幕的成本过高。相反，它被用作辅助或后续机制，在自动化系统触发后进行复查。事实上，用于审计和审计追踪的逻辑同样适用于\
  \ CCTV 和录制事件。CCTV 是一种预防措施，而复查录制事件则是一种侦查措施。\n\n#### 环境与生命安全\n\n物理访问控制和维护设施安全的一个重要方面是保护环境基本要素和人身安全。在任何情况下和所有条件下，安全最重要的方面都是保护人员。因此，防止人员受到伤害是所有安全解决方案的首要目标。\n\
  \n维护人员安全的部分工作是维护设施的基本环境。在短时间内，人员可以在无水、无食物、无空调和无电力的情况下生存。但在某些情况下，这些要素的丧失可能导致灾难性后果，或成为更直接、更危险问题的征兆。洪水、火灾、有毒物质泄漏和自然灾害均威胁人类生命及设施稳定性。物理安全程序应重点关注保护人身安全，其次是恢复环境安全，并恢复\
  \ IT 基础设施运行所需的公用设施。\n\n人员安全应始终是您的首要任务。只有在人员安全得到保障后，才能考虑处理业务连续性问题。许多组织采用人员应急预案（OEP）来指导和协助在灾难发生后维持人员安全。OEP\
  \ 提供了关于如何将生命威胁降至最低、预防伤害、应对胁迫、处理出行、提供安全监控以及保护财产免受破坏性物理事件损害的指导。OEP 不涉及 IT 问题或业务连续性，仅关注人员和一般财产。业务连续性计划（BCP）和灾难恢复计划（DRP）解决\
  \ IT 和业务连续性及恢复问题。\n\n#### 隐私责任与法律要求\n\n任何组织的安全策略中也必须涉及个人信息的安全。此外，安全策略必须符合其所在行业和司法管辖区的监管要求。\n\
  \n\n\n\n\n### 隐私与物理安全\n\n*隐私* 是指保护个人信息不被泄露给任何未经授权的个人或实体。在当今的在线世界中，公共信息与私人信息之间的界限往往模糊不清。例如，关于您网络浏览习惯的信息是私人的还是公共的？未经您同意收集该信息是否合法？收集机构能否将该信息出售获利而不与您分享？此外，您的个人信息不仅包括在线习惯信息，还包括您的身份信息（姓名、地址、电话、种族、宗教、年龄等）、健康和医疗记录、财务记录，甚至犯罪或法律记录。通常，此类信息属于个人可识别信息（PII）范畴，美国国家标准与技术研究院（NIST）出版物《保护个人可识别信息（PII）机密性指南》（在线地址：<https://csrc.nist.gov/publications/detail/sp/800-122/final>）对此进行了描述。\n\
  \n处理隐私问题是任何拥有员工的组织的必然要求。因此，隐私是所有组织的核心问题。隐私保护应成为任何组织安全策略中规定的核心使命或目标。\n\n《通用数据保护条例》（GDPR）法规（EU）2016/679\
  \ 是一项欧盟法规，侧重于保护公民及其对个人数据的权利和控制权。虽然美国没有保护美国公民的同等法律体系，但许多美国公司采纳了 GDPR 的某些要素，以吸引和留住员工及客户，并获得在欧盟国家开展业务的资格。\n\
  \nGDPR 和许多其他人员隐私问题将在第 4 章“法律、法规与合规”中进行更详细的讨论。\n\n### 法规要求\n\n每个组织都在特定的行业和司法管辖区内运营。这两个实体（以及可能的其他实体）都会对其管辖范围内的组织实践施加法律要求、限制和法规。这些*法律要求*\
  \ 可适用于软件许可使用、招聘限制、敏感材料处理以及安全法规合规性。\n\n遵守所有适用的法律要求是维持安全的关键部分。某行业和某国家（通常还包括州和城市）的法律要求必须被视为构建其余安全基础设施的基线或基础。\n\
  \n### 总结\n\n如果您无法控制物理环境，任何数量的管理或技术/逻辑访问控制都无法提供充分的安全性。如果恶意人员获得了对您设施或设备的物理访问权限，他们就拥有了它。\n\
  \n实施和维护物理安全涉及多个要素。一个核心要素是选择或设计用于容纳 IT 基础设施和组织运营的设施。您必须从一个计划着手，该计划概述组织的安全需求，并强调提供此类安全性所采用的方法或机制。此类计划是通过关键路径分析过程制定的。\n\
  \n为管理物理安全而实施的安全控制可分为三类：管理、技术和物理。物理安全的管理控制包括设施建设与选择、场地管理、人员控制、安全意识培训以及应急响应和程序。物理安全的技术控制包括访问控制、入侵检测、警报、闭路电视（CCTV）、监控、暖通空调（HVAC）、电源供应、火灾探测和灭火。物理安全的物理控制示例包括围栏、照明、锁具、建筑材料、人员闸（mantraps）、警犬和警卫。\n\
  \n可部署在环境中以控制、监控和管理设施访问的物理访问控制机制有多种类型。这些机制范围从威慑手段到检测机制。它们可以是围栏、大门、转闸、人员闸、照明、保安、警犬、钥匙锁、组合锁、工牌、运动探测器、传感器和警报器。\n\
  \n最常用作管理物理访问的访问控制机制的技术控制包括智能/非智能卡和生物识别技术。除了访问控制，物理安全机制还可以采取审计追踪、访问日志和入侵检测系统的形式。\n\
  \n布线间和服务器室是需要保护的重要基础设施要素。它们通常容纳核心网络设备和其他敏感设备。保护措施包括足够的锁具、监控、访问控制和定期物理检查。\n\n介质存储安全应包括资料库借阅系统、存放在上锁的柜子或保险柜中，以及可重复使用介质的清理。\n\
  \n物理访问控制和维护设施安全的一个重要方面是保护环境的基本要素和保护人员生命。在任何情况下和所有条件下，安全最重要的目标都是保护人员。防止伤害是所有安全解决方案的最高目标。提供洁净电源和管理环境也很重要。\n\
  \n火灾探测和灭火绝不能忽视。除了保护人员，火灾探测和灭火旨在将火灾、烟雾、高温和灭火材料造成的损害降至最低，特别是针对 IT 基础设施。\n\n人员应始终是您的首要任务。只有在人员安全得到保障后，才能考虑处理业务连续性问题。\n\
  \n### 考试要点\n\n**理解为何没有物理安全就没有安全。** 如果无法控制物理环境，任何数量的管理或技术/逻辑访问控制都无法提供充分的安全性。如果恶意人员能够获得对您设施或设备的物理访问权限，他们几乎可以为所欲为，从破坏、泄露到篡改。\n\
  \n**能够列举物理安全的管理控制。** 物理安全管理控制的示例包括设施建设与选择、场地管理、人员控制、安全意识培训以及应急响应和程序。\n\n**能够列举物理安全的技术控制。**\
  \ 物理安全技术控制可以是访问控制、入侵检测、警报、闭路电视（CCTV）、监控、暖通空调（HVAC）、电源供应、火灾探测和灭火。\n\n**能够说出物理安全的物理控制。**\
  \ 物理安全的物理控制包括围栏、照明、锁具、建筑材料、人员闸、警犬和警卫。\n\n**了解控制的功能顺序。** 顺序为：威慑、拒绝、检测、延迟。\n\n**了解场地选择和设施建设设计的关键要素。**\
  \ 场地选择的关键要素包括能见度、周边区域构成、区域可达性以及自然灾害的影响。设计施工设施的一个关键要素是了解组织所需的安全级别，并在施工开始前对此进行规划。\n\
  \n**了解如何设计和配置安全工作区域。** 设施内的所有位置不应具有同等访问权限。包含更高价值或重要性资产的区域应实施受限访问。贵重和机密资产应位于设施提供的保护核心或中心位置。此外，集中式服务器或计算机室不必适合人员工作。\n\
  \n\n\n\n#### 理解布线间的安全顾虑\n\n布线间是整栋建筑或某一楼层的网络线缆连接至其他关键设备（如配线架、交换机、路由器、局域网扩展器和骨干通道）的场所。布线间的大多数安全措施侧重于防止未经授权的物理访问。如果未经授权的入侵者进入该区域，他们可能会窃取设备、拔除或切断线缆，甚至安装窃听装置。\n\
  \n#### 理解如何处理安全设施中的访客\n\n如果设施采用受限区域来控制物理安全，则需要一套处理访客的机制。通常会为访客指派陪同人员，并密切监控其访问权限和活动。未能追踪获准进入受保护区域的外来人员的行为，可能导致针对受保护程度最高的资产的恶意活动。\n\
  \n#### 掌握管理物理安全的三类安全控制及各类示例\n\n用于管理物理安全的安全控制可分为三组：管理控制、技术控制和物理控制。理解何时以及如何使用每一类，并能列举各类示例。\n\
  \n#### 理解介质存储的安全需求\n\n介质存储设施的设计应能安全地存储空白介质、可重复使用介质和安装介质。关注点包括盗窃、损坏和数据残留恢复。介质存储设施的防护措施包括上锁的柜子或保险柜、指定管理员/保管员、实施签入/签出流程以及使用介质清理技术。\n\
  \n#### 理解证据存储的顾虑\n\n证据存储用于保留日志、驱动器镜像、虚拟机快照和其他数据集，以供恢复、内部调查和取证调查使用。防护措施包括专用/隔离存储设施、离线存储、活动追踪、哈希管理、访问限制和加密。\n\
  \n#### 掌握物理访问控制的常见威胁\n\n无论采用何种形式的物理访问控制，都必须部署保安人员或其他监控系统，以防止滥用、冒名顶替和尾随。物理访问控制的滥用包括支撑安全门敞开、绕过锁具或访问控制。冒名顶替是指使用他人的安全\
  \ ID 进入设施。尾随是指未经个人识别或授权，跟随他人通过安全闸门或门口。\n\n#### 理解审计追踪和访问日志的必要性\n\n审计追踪和访问日志即使对于物理访问控制也是有用的工具。它们可能需要由保安人员手动创建。或者，如果部署了足够自动化的访问控制机制（即智能卡和某些邻近读卡器），它们可以自动生成。您还应考虑使用闭路电视监控入口点。通过闭路电视，您可以将审计追踪和访问日志与事件的可视化记录历史进行比较。此类信息对于重建入侵、违规或攻击事件至关重要。\n\
  \n#### 理解洁净电源的必要性\n\n电力公司供应的电力并不总是稳定洁净的。大多数电子设备需要洁净电源才能正常运行。因电源波动导致的设备损坏是常见现象。许多组织选择通过多种方式自行管理电源。`UPS`\
  \ 是一种自充电电池，可用于向敏感设备提供稳定洁净的电源。`UPS` 在主电源故障后仍能提供持续供电。根据其容量和设备负载，`UPS` 可继续供电数分钟或数小时。\n\
  \n#### 掌握与电源问题相关的常用术语\n\n掌握以下术语的定义：故障、停电、电压跌落、电压不足、尖峰、浪涌、浪涌冲击、噪声、瞬态、洁净、接地。\n\n####\
  \ 理解如何控制环境\n\n除了电源考量外，维护环境还涉及对暖通空调（`HVAC`）机制的控制。主要包含计算机的房间温度应保持在 60 至 75 华氏度（15\
  \ 至 23 摄氏度）。计算机房的湿度应维持在 40% 至 60% 之间。湿度过高会导致腐蚀。湿度过低会导致静电。\n\n#### 了解静电\n\n即使在防静电地毯上，如果环境湿度低，仍可能产生\
  \ 20,000 伏的静电放电。即使是极低水平的静电放电也可能损坏电子设备。\n\n#### 理解管理漏水和洪水的必要性\n\n漏水和洪水应在您的环境安全策略和程序中得到解决。管道泄漏虽非日常事件，但一旦发生往往造成重大损害。水电不相容。如果计算机系统接触水，尤其是在运行时，必然会造成损坏。尽可能将服务器机房和关键计算机设备安置在远离任何水源或输水管道的地方。\n\
  \n#### 理解火灾探测和抑制的重要性\n\n火灾探测和抑制绝不能忽视。保护人员免受伤害应始终是任何安全或防护系统的首要目标。除了保护人员，火灾探测和抑制旨在将火灾、烟雾、高温和抑制介质造成的损害降至最低，特别是针对\
  \ IT 基础设施。\n\n#### 理解火灾和抑制可能造成的污染和损害\n\n火灾的破坏性因素包括烟雾和高温，还包括抑制介质，如水或苏打酸。烟雾会损坏大多数存储设备。高温会损坏任何电子或计算机组件。抑制介质可能导致短路、引发腐蚀或以其他方式使设备报废。设计火灾响应系统时必须解决所有这些问题。\n\
  \n#### 理解人员隐私和安全\n\n在任何情况下和所有条件下，安全最重要的方面是保护人员。因此，防止人员受到伤害是所有安全解决方案的最重要目标。\n\n###\
  \ 书面实验\n\n1. 什么设备有助于界定组织的周界，同时也能阻止随意闯入？\n\n2. 基于卤烷的灭火技术有什么问题？\n\n3. 消防部门的紧急来访可能会留下哪些潜在问题？\n\
  \n### 复习题\n\n1. 以下哪项是安全最重要的方面？\n\n    1. 物理安全\n    2. 入侵检测\n    3. 逻辑安全\n    4.\
  \ 意识培训\n\n2. 可使用哪种方法规划新设施的组织需求？\n\n    1. 日志文件审计\n    2. 关键路径分析\n    3. 风险分析\n \
  \   4. 资产清单\n\n3. 哪个基础设施组件通常位于多层楼的相同位置，以便于将各楼层网络链接在一起？\n\n    1. 服务器机房\n    2. 布线间\n\
  \    3. 数据中心\n    4. 介质柜\n\n4. 以下哪项*不是*设施或场地的安全导向设计要素？\n\n    1. 工作区与访客区分离\n   \
  \ 2. 对高价值或高重要性区域实施受限访问\n    3. 机密资产位于设施的核心或中心位置\n    4. 对设施内所有位置提供平等访问权限\n\n5. 以下哪项*不*需要为真，以维护最高效和最安全的服务器机房？\n\
  \n    1. 必须适合人员工作。\n    2. 必须使用非水基灭火剂。\n    3. 湿度必须保持在 40% 至 60% 之间。\n\n\n\n\n##\
  \ 第 11 章：安全网络架构与网络组件安全防护\n\n## 本章涵盖的 CISSP 考试主题\n\n**领域 4：通信与网络安全**\n\n*   4.1 在网络架构中实施安全设计原则\n\
  \    *   4.1.1 开放系统互连 (OSI) 与传输控制协议/互联网协议 (TCP/IP) 模型\n    *   4.1.2 互联网协议 (IP)\
  \ 网络\n    *   4.1.3 多层协议的影响\n    *   4.1.4 融合协议\n    *   4.1.5 软件定义网络\n    *   4.1.6\
  \ 无线网络\n*   4.2 网络组件安全防护\n    *   4.2.1 硬件操作\n    *   4.2.2 传输介质\n    *   4.2.3\
  \ 网络准入控制 (NAC) 设备\n    *   4.2.4 端点安全\n    *   4.2.5 内容分发网络\n\n计算机和网络源于通信设备、存储设备、处理设备、安全设备、输入设备、输出设备、操作系统、软件、服务、数据和人员的集成。本章将开放系统互连\
  \ (OSI) 模型作为网络、布线、无线连接、传输控制协议/互联网协议 (TCP/IP) 及相关协议、网络设备和防火墙的指导原则进行讨论。\n\nCISSP 认证考试的通信与网络安全领域涉及与网络组件（即网络设备和协议）相关的主题，具体而言，即它们如何运作以及如何与安全相关联。本领域将在本章和第\
  \ 12 章“安全通信与网络攻击”中进行讨论。请务必阅读并学习这两章的材料，以确保全面覆盖 CISSP 认证考试所需的核心内容。\n\n### OSI 模型\n\
  \n计算机之间通过网络进行通信是由协议实现的。`protocol`（协议）是一组规则和限制，定义了数据如何通过网络介质（例如双绞线、无线传输）进行传输。在网络发展的早期，许多公司拥有自己的专有协议，这意味着不同供应商的计算机之间进行交互通常很困难，甚至不可能。为了消除这一问题，*国际标准化组织\
  \ (ISO)* 于 20 世纪 80 年代初为协议开发了*开放系统互连 (OSI) 参考模型*。具体而言，ISO 7498 定义了 OSI 参考模型（更常被称为\
  \ OSI 模型）。理解 OSI 模型及其与网络设计、部署和安全的关系，对于备考 CISSP 考试至关重要。\n\n为了在网络架构中正确实施安全设计原则，全面了解计算机通信中涉及的所有技术非常重要。从硬件和软件到协议和加密等，有许多细节需要了解、标准需要理解、程序需要遵循。此外，安全网络架构和设计的基础是对\
  \ OSI 和 TCP/IP 模型以及互联网协议 (IP) 网络的总体深入了解。\n\n#### OSI 模型的历史\n\nOSI 模型并非简化网络协议或建立通用通信标准的首次或唯一尝试。事实上，当今使用最广泛的协议\
  \ TCP/IP（基于 *DARPA 模型*，现也称为 *TCP/IP 模型*）开发于 20 世纪 70 年代初。OSI 模型直到 20 世纪 70 年代末才开发出来。\n\
  \nOSI 协议的开发旨在为所有计算机系统建立通用的通信结构或标准。实际的 OSI 协议从未被广泛采用，但 OSI 协议背后的理论——即 OSI 模型——却被迅速接受。OSI\
  \ 模型作为一个抽象框架或理论模型，用于说明协议在理想世界中理想硬件上应如何运作。因此，OSI 模型已成为一个通用的参考点，所有协议都可以据此进行比较和对比。\n\
  \n#### OSI 功能\n\n### 练习题\n\n4. 温度必须保持在 60 到 75 华氏度之间。\n\n6. 以下哪项*不是*针对包含可重复使用可移动介质的介质存储设施通常实施的安全措施？\n\
