  \ 13 章“管理身份与认证”介绍了与 CISSP 认证考试的身份与访问管理 (IAM) 领域相关的几个重要主题。本章在该基础上进一步拓展，包含了一些常见访问控制模型的关键信息。此外还介绍了如何预防或缓解访问控制攻击。请务必阅读并学习这些章节中的材料，以确保完整覆盖该领域的核心内容。\n\
  \n### 比较访问控制模型\n\n第 13 章重点关注识别和认证。在对主体进行认证后，下一步是授权。授权主体访问客体的方法因 IT 系统所使用的访问控制方法而异。\n\
  \n#### 比较权限、权利和特权\n\n在学习访问控制主题时，你会经常遇到*权限*、*权利*和*特权*这些术语。有些人会交替使用这些术语，但它们并不总是意味着同一件事。\n\
  \n**权限** 通常情况下，权限是指授予客体的访问权，它决定了你可以对该客体做什么。如果你对某个文件拥有读取权限，就能打开并读取它。你可以授予用户在文件服务器上创建、读取、编辑或删除文件的权限。同样，你也可以授予用户访问文件的访问权，因此在这种情况下，访问权和权限是同义词。例如，你可能被授予某应用程序文件的读取和执行权限，这赋予了你运行该应用程序的权利。此外，你可能被授予数据库中的数据权利，允许你检索或更新数据库中的信息。\n\
  \n**权利** 权利主要是指对客体执行操作的能力。例如，用户可能拥有修改计算机系统时间的权利，或恢复备份数据的权利。这是一个微妙的区别，并不总是被强调。然而，你很少会看到将对系统执行操作的权利称为权限。\n\
  \n**特权** *特权*是权利和权限的组合。例如，计算机的管理员将拥有完全特权，授予管理员对计算机的完全权利和权限。管理员将能够执行任何操作并访问计算机上的任何数据。\n\
  \n#### 理解授权机制\n\n访问控制模型使用多种不同类型的授权机制或方法来控制谁可以访问特定客体。以下是一些常见机制和概念的简要介绍。\n\n### 复习题\n\
