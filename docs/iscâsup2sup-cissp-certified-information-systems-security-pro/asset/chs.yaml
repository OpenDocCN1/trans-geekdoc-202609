  \    1.  你所拥有的东西\n    2.  你的生理特征\n    3.  你的行为特征\n    4.  你所知晓的东西\n\n10. 你的组织向员工发放设备。这些设备每\
  \ 60 秒生成一次一次性密码。组织内部托管的服务器在任何给定时间都知道该密码是什么。这是什么类型的设备？\n\n    1.  同步令牌\n    2.  异步令牌\n\
  \    3.  智能卡\n    4.  通用访问卡\n\n11. 以下哪项基于主体的物理特征提供认证？\n\n    1.  账户 ID\n    2. \
  \ 生物识别\n    3.  令牌\n    4.  PIN 码\n\n12. 生物识别设备的 CER（交叉错误率）表示什么？\n\n    1.  它表示灵敏度过高。\n\
