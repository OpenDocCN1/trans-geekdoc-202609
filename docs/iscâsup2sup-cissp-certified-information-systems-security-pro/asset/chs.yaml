  \     1.  业务连续性计划\n     2.  业务影响评估\n     3.  灾难恢复计划\n     4.  脆弱性评估\n\n19. 计算风险场景单次损失期望值（SLE）的公式是什么？\n\
  \     1.  `SLE = AV × EF`\n     2.  `SLE = RO × EF`\n     3.  `SLE = AV × ARO`\n\
