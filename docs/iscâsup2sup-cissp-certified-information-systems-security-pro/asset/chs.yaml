  \     4. 围栏\n\n12. 哪种运动探测器能感知受监控物体周围电场或磁场的变化？\n\n     1. 微波\n     2. 光电\n     3.\
  \ 热能\n     4. 电容\n\n13. 以下哪项*不是*物理安全中可触发的典型警报类型？\n\n     1. 预防性\n     2. 威慑性\n \
  \    3. 驱赶性\n     4. 通知性\n\n14. 无论使用何种形式的物理访问控制，都必须部署保安或其他监控系统以防止以下所有情况，*除*：\n\n\
  \     1. 尾随\n     2. 间谍活动\n     3. 伪装\n     4. 滥用\n\n15. 所有安全解决方案最重要的目标是什么？\n\n\
  \     1. 防止泄露\n     2. 保持完整性\n     3. 人身安全\n     4. 维持可用性\n\n16. 计算机机房的理想湿度范围是多少？\n\
  \n     1. 20–40%\n     2. 40–60%\n     3. 60–75%\n     4. 80–95%\n\n17. 静电在多少伏特电压下会导致硬盘上存储的数据被破坏？\n\
  \n     1. 4,000\n     2. 17,000\n     3. 40\n     4. 1,500\n\n18. B 类灭火器除以下哪种灭火介质外均可使用？\n\
  \n     1. 水\n     2. CO[2]\n     3. 哈龙或可接受的哈龙替代品\n     4. 碳酸钠/苏打酸\n\n19. 哪种基于水的火灾抑制系统最适合计算机设施？\n\
  \n     1. 湿式管道系统\n     2. 干式管道系统\n     3. 预作用系统\n     4. 淋喷系统\n\n20. 在发生火灾并触发抑制系统的情况下，以下哪项通常*不是*导致计算机设备损坏的罪魁祸首？\n\
  \n     1. 热\n     2. 抑制介质\n     3. 烟\n     4. 光\n\n\n\n\n### OSI 模型\n\nOSI 模型将网络任务划分为七个不同的层。每一层负责执行特定的任务或操作，最终目标是支持两台计算机之间的数据交换（换句话说，即网络通信）。层的编号始终是从下到上（请参见\
  \ 图 11.1）。它们可以通过名称或层号来引用。例如，第 3 层也称为网络层。层的排序专门用于指示信息如何通过各个通信级别流动。每一层都直接与其上层和下层通信，以及通信伙伴系统上的对等层通信。\n\
  \n![图 11.1 OSI 模型的表示](img/c11f001.jpg)\n\n**图 11.1** OSI 模型的表示\n\nOSI 模型是面向网络产品供应商的开放网络架构指南。该标准或指南为新协议、网络服务甚至硬件设备的开发提供了通用基础。通过基于\
  \ OSI 模型进行工作，供应商能够确保其产品将与其他公司的产品集成，并受到广泛操作系统的支持。如果所有供应商都开发自己的网络框架，不同供应商产品之间的互操作性几乎是不可能的。\n\
  \nOSI 模型真正的益处在于它表达了网络实际运作的方式。从最具体的意义上讲，网络通信发生在物理连接之上（无论该物理连接是铜线上的电子、光纤上的光子，还是空气中的无线电信号）。物理设备建立通道，电子信号可通过该通道从一台计算机传递到另一台计算机。这些物理设备通道只是\
  \ OSI 模型定义的七种逻辑通信类型中的一种。OSI 模型的每一层都通过一个逻辑通道与另一台计算机上的对等层进行通信。这使得基于 OSI 模型的协议能够支持一种认证类型，因为它们能够识别远程通信实体，并验证接收数据的来源。\n\
  \n#### 封装/解封装\n\n基于 OSI 模型的协议采用一种称为封装的机制。**封装** 是指在将数据从上层接收并传递给下层之前，每一层向数据添加一个头部，并可能添加一个尾部。随着消息在每一层被封装，上一层的头部和载荷结合成为当前层的载荷。封装发生在数据从应用层向下移动到物理层的过程中。当数据从物理层向上移动到应用层时，发生的逆向动作称为**解封装**。封装/解封装过程如下：\n\
  \n1.  应用层创建一条消息。\n2.  应用层将消息传递给表示层。\n3.  表示层通过向消息添加信息来对其进行封装。信息通常仅添加在消息的开头（称为头部）；然而，某些层也会在消息末尾添加内容（称为尾部），如\
  \ 图 11.2 所示。\n4.  向下传递消息并添加特定于层的信息的过程持续进行，直到消息到达物理层。\n5.  在物理层，消息被转换为代表比特的电脉冲，并通过物理连接进行传输。\n\
  6.  接收计算机从物理连接捕获比特，并在物理层重新创建消息。\n7.  物理层将消息从比特转换为数据链路帧，并将消息向上发送给数据链路层。\n8.  数据链路层剥离其信息，并将消息向上发送给网络层。\n\
  9.  此解封装过程一直执行，直到消息到达应用层。\n10. 当消息到达应用层时，消息中的数据被发送给预期的软件接收者。\n\n![图 11.2 OSI 模型封装的表示](img/c11f002.jpg)\n\
  \n**图 11.2** OSI 模型封装的表示\n\n每一层移除的信息包含指令、校验和等，这些只能被最初添加或创建该信息的对等层理解（请参见 图 11.3）。正是这些信息创建了逻辑通道，使不同计算机上的对等层能够通信。\n\
  \n![图 11.3 OSI 模型对等层逻辑通道的表示](img/c11f003.jpg)\n\n**图 11.3** OSI 模型对等层逻辑通道的表示\n\n\
  在应用层（第 7 层）发送到协议栈的消息称为数据流。它保留“数据流”的标签（有时也应用**协议数据单元 [PDU]** 标签），直到到达传输层（第 4 层），在那里它被称为**段**（TCP\
  \ 协议）或**数据报**（用户数据报协议 [UDP] 协议）。在网络层（第 3 层），它被称为**包**。在数据链路层（第 2 层），它被称为**帧**。在物理层（第\
  \ 1 层），数据已被转换为**比特**，以便在物理连接介质上传输。图 11.4 展示了每一层如何通过此过程更改数据。\n\n![图 11.4 OSI 模型数据名称](img/c11f004.jpg)\n\
  \n**图 11.4** OSI 模型数据名称\n\n#### OSI 层\n\n了解 OSI 模型每一层的功能和职责将有助于你理解网络通信如何运作、如何对网络通信发起攻击，以及如何实施安全措施以保护网络通信。我们将在以下章节中讨论每一层，从最底层开始。\n\
  \n> **记住 OSI** 要充分利用 OSI，你首先必须能够按正确顺序记住七层的名称。一种常见的记忆方法是利用层名称的首字母创建一个助记符，以便于记忆。我们最喜欢的一个是\
  \ **Please Do Not Teach Surly People Acronyms**（请不要教脾气坏的人首字母缩略词）。请注意，这个记忆助记符是从物理层向上到应用层的。一个从应用层向下的助记符是\
  \ **All Presidents Since Truman Never Did Pot**（自杜鲁门以来的所有总统从未做过锅/大麻）。还有许多其他的 OSI\
  \ 记忆方案；只需确保你知道它们是自顶向下还是自底向上。\n\n##### 物理层\n\n**物理层（第 1 层）** 从数据链路层接收帧，并将帧转换为比特，以便在物理连接介质上传输。物理层还负责从物理连接介质接收比特，并将它们转换为供数据链路层使用的帧。\n\
  \n物理层包含设备驱动程序，它们告诉协议如何利用硬件进行比特的发送和接收。物理层内部包含电气规范、协议和接口标准，例如：\n\n*   `EIA/TIA-232`\
  \ 和 `EIA/TIA-449`\n*   `X.21`\n*   `高速串行接口 (HSSI)`\n*   `同步光网络 (SONET)`\n*   `V.24`\
  \ 和 `V.35`\n\n通过设备驱动程序和这些标准，物理层控制吞吐率、处理同步、管理线路噪声和介质访问，并确定是使用数字或模拟信号还是光脉冲通过物理硬件接口传输或接收数据。\n\
  \n\n\n\n### 物理层的网络硬件设备\n\n在物理层（第 1 层）工作的网络硬件设备包括网络接口卡（`NICs`）、集线器、中继器、汇聚器和放大器。这些设备执行基于硬件的信号操作，例如将信号从一个连接端口发送到所有其他端口（集线器），或放大信号以支持更远的传输距离（中继器）。\n\
  \n#### 数据链路层\n\n**数据链路层（第 2 层）**负责将来自网络层的数据包格式化为适合传输的正确格式。正确的格式由硬件和网络技术决定。可能性有很多，例如**以太网（IEEE\
  \ 802.3）**、**令牌环（IEEE 802.5）**、**异步传输模式（ATM）**、**光纤分布式数据接口（FDDI）**和**铜缆分布式数据接口（CDDI）**。然而，只有以太网仍是现代网络中常用的数据链路层技术。在数据链路层内部，驻留着将数据包转换为格式正确的帧的特定技术协议。一旦帧格式化完成，它就会被发送到物理层进行传输。\n\
  \n以下列表包含数据链路层中的一些协议：\n\n*   串行线路互联网协议（`SLIP`）\n*   点对点协议（`PPP`）\n*   地址解析协议（`ARP`）\n\
  *   第二层转发（`L2F`）\n*   第二层隧道协议（`L2TP`）\n*   点对点隧道协议（`PPTP`）\n*   综合业务数字网（`ISDN`）\n\
  \n在数据链路层对数据执行的部分处理包括向帧添加硬件源地址和目的地址。硬件地址是**介质访问控制（MAC）地址**，它是一个 6 字节（48 位）的二进制地址，以十六进制表示法书写（例如，`00-13-02-1F-58-F5`）。地址的前\
  \ 3 字节（24 位）表示物理网络接口的供应商或制造商。这被称为**组织唯一标识符（OUI）**。OUI 在电气和电子工程师协会（`IEEE`）注册，由其控制发放。可以通过\
  \ `IEEE` 网站 <http://standards.ieee.org/regauth/oui/index.shtml> 上的 OUI 查询 `NIC`\
  \ 的制造商。后 3 字节（24 位）代表由制造商分配给该接口的唯一编号。在同一个本地以太网广播域中，任意两台设备不能拥有相同的 MAC 地址；否则会发生地址冲突。确保私有企业网络中所有\
  \ MAC 地址唯一也是一种良好的实践。虽然 MAC 地址的设计初衷是保证唯一性，但供应商错误曾导致出现重复的 MAC 地址。发生这种情况时，必须更换 `NIC`\
  \ 硬件，或将 MAC 地址修改（即欺骗）为一个不冲突的替代地址。\n\n在 OSI 模型数据链路层（第 2 层）的协议中，你应该熟悉**地址解析协议（ARP）**。`ARP`\
  \ 用于将 IP 地址解析为 MAC 地址。网段上的流量是使用 MAC 地址从源系统导向目的系统的。\n\n`ARP` 作为以太网帧的载荷进行传输。由于以太网属于第\
  \ 2 层，因此认为 `ARP` 属于第 3 层是合理的。然而，`ARP` 并不作为一个真正的第 3 层协议运行，因为它不在其头部使用源/目的寻址方案来指导通信（类似于\
  \ IP 头部）。相反，它依赖于以太网的源和目的 MAC 地址。因此，`ARP` 不是一个真正的第 3 层协议。`ARP` 也不是一个完全的第 2 层协议，因为它依赖以太网作为其传输宿主。因此，充其量它是一个依赖性的第\
  \ 2 层协议。OSI 模型是一个概念模型，而非对真实协议如何运行的精确描述。因此，`ARP` 并不完全符合 OSI 的分类体系。\n\n数据链路层包含两个子层：逻辑链路控制（`LLC`）子层和\
  \ MAC 子层。关于这些子层的细节对于 CISSP 考试并不关键。\n\n在数据链路层（第 2 层）工作的网络硬件设备是交换机和网桥。这些设备支持基于 MAC\
  \ 的流量路由。交换机在一个端口接收帧，并根据目的 MAC 地址将其从另一个端口发送出去。MAC 地址目的地用于确定帧是否通过网桥从一个网络传输到另一个网络。\n\
  \n#### 网络层\n\n**网络层（第 3 层）**负责向数据添加路由和寻址信息。网络层接收来自传输层的段，并向其添加信息以创建数据包。数据包包含源和目的\
  \ IP 地址。\n\n路由协议位于此层，包括以下内容：\n\n*   互联网控制消息协议（`ICMP`）\n*   路由信息协议（`RIP`）\n*   开放最短路径优先（`OSPF`）\n\
  *   边界网关协议（`BGP`）\n*   互联网组管理协议（`IGMP`）\n*   互联网协议（`IP`）\n*   互联网协议安全（`IPSec`）\n\
  *   互联网包交换（`IPX`）\n*   网络地址转换（`NAT`）\n*   互联网协议简单密钥管理（`SKIP`）\n\n网络层负责提供路由或投递信息，但不负责验证保证投递（这是传输层的责任）。网络层还管理错误检测和节点数据流量（换句话说，流量控制）。\n\
  \n路由器和网桥路由器（`brouters`）是工作在第 3 层的网络硬件设备。路由器根据速度、跳数、偏好等确定数据包传输的最佳逻辑路径。路由器使用目的 IP\
  \ 地址来指导数据包的传输。`brouter` 主要工作在第 3 层，但在必要时也工作在第 2 层，它是一种尝试先路由，如果失败则默认进行网桥连接的设备。\n\n\
  #### 传输层\n\n**传输层（第 4 层）**负责管理连接的完整性和控制会话。它接收一个 PDU（可拼写为 Protocol Data Unit、Packet\
  \ Data Unit 或 Payload Data Unit——即在网络层之间传递的信息或数据容器）。来自会话层的 PDU 被转换为段。传输层控制网络上设备的寻址或引用方式，在节点（也称为**设备**）之间建立通信连接，并定义会话的规则。会话规则指定每个段可包含多少数据、如何验证传输数据的完整性，以及如何确定数据是否丢失。会话规则通过握手过程建立，以便通信设备就规则达成一致。（请参阅本章后面“传输层协议”部分中关于\
  \ TCP 的 SYN/ACK 三次握手的讨论。）\n\n传输层在两个设备之间建立逻辑连接，并提供端到端的传输服务以确保数据投递。该层包括分段、排序、错误检查、控制数据流、错误纠正、复用和网络服务优化的机制。以下协议在传输层中运行：\n\
  \n*   传输控制协议（`TCP`）\n*   用户数据报协议（`UDP`）\n*   顺序包交换（`SPX`）\n*   安全套接字层（`SSL`）\n*\
  \   传输层安全性（`TLS`）\n\n#### 会话层\n\n\n\n\n\n### 会话层（第 5 层）\n\n`会话层（第 5 层）`负责在两台计算机之间建立、维护和终止通信会话。它管理对话规程或对话控制（单工、半双工、全双工），建立检查点以进行分组和恢复，并重传自上一个已验证检查点以来失败或丢失的\
  \ PDU。以下协议在会话层运行：\n\n*   网络文件系统 (NFS)\n*   结构化查询语言 (SQL)\n*   远程过程调用 (RPC)\n\n通信会话可以在三种不同的规程或控制模式下运行：\n\
  \n**单工** 单向通信\n\n**半双工** 双向通信，但同一时间只能有一个方向发送数据\n\n**全双工** 双向通信，数据可同时在两个方向发送\n\n\
  ### 表示层（第 6 层）\n\n`表示层（第 6 层）`负责将从应用层接收的数据转换为任何遵循 OSI 模型的系统都能理解的格式。它在数据上强制实施通用或标准化的结构和格式规则。表示层还负责加密和压缩。因此，它充当网络与应用程序之间的接口。正是这一层允许各种应用程序通过网络进行交互，它通过确保数据格式被两个系统同时支持来实现这一点。大多数文件或数据格式都在此层运行。这包括图像、视频、声音、文档、电子邮件、网页、控制会话等的格式。以下列表包含存在于表示层中的一些格式标准：\n\
  \n*   美国信息交换标准代码 (ASCII)\n*   扩展二进制编码十进制交换模式 (EBCDICM)\n*   标记图像文件格式 (TIFF)\n* \
  \  联合图像专家组 (JPEG)\n*   运动图像专家组 (MPEG)\n*   音乐设备数字接口 (MIDI)\n\n### 应用层（第 7 层）\n\n\
  `应用层（第 7 层）`负责将用户应用程序、网络服务或操作系统与协议栈进行接口连接。它允许应用程序与协议栈通信。应用层确定远程通信伙伴是否可用且可访问。它还确保有足够的资源可用以支持请求的通信。\n\
  \n应用程序本身并不位于此层；相反，传输文件、交换消息、连接到远程终端等所需的协议和服务位于此处。此层中包含大量特定于应用程序的协议，例如以下各项：\n\n*\
  \   超文本传输协议 (HTTP)\n*   文件传输协议 (FTP)\n*   行式打印机守护进程 (LPD)\n*   简单邮件传输协议 (SMTP)\n\
  *   Telnet\n*   简单文件传输协议 (TFTP)\n*   电子数据交换 (EDI)\n*   邮局协议版本 3 (POP3)\n*   因特网消息访问协议\
  \ (IMAP)\n*   简单网络管理协议 (SNMP)\n*   网络新闻传输协议 (NNTP)\n*   安全远程过程调用 (S-RPC)\n*   安全电子交易\
  \ (SET)\n\n有一种网络设备（或服务）工作在应用层，即网关。然而，应用层网关是一种特定类型的组件。它充当协议转换工具。例如，IP 到 IPX 网关接收来自\
  \ `TCP/IP` 的入站通信，并将其转换为 `IPX/SPX` 以进行出站传输。应用层防火墙也在此层运行。其他网络设备或过滤软件可能会在此层观察或修改流量。\n\
  \n### TCP/IP 模型\n\n`TCP/IP 模型`（也称为 `DARPA` 或 `DOD 模型`）仅包含四层，而 OSI 参考模型有七层。TCP/IP\
  \ 模型的四层分别是应用层（也称为进程层）、传输层（也称为主机到主机层）、网际层（有时称为互联网层）和链路层（尽管有时也使用网络接口和网络接入）。图 11.5\
  \ 展示了它们与 OSI 模型七层的对比。TCP/IP 协议套件是在 OSI 参考模型创建之前开发的。OSI 参考模型的设计者小心确保 TCP/IP 协议套件适配他们的模型，因为该套件已在网络中广泛部署。\n\
  \n![图 11.5 OSI 模型与 TCP/IP 模型的对比 ](img/c11f005.jpg)\n\n**图 11.5** OSI 模型与 TCP/IP\
  \ 模型的对比\n\nTCP/IP 模型的应用层对应 OSI 模型的第 5、6 和 7 层。TCP/IP 模型的传输层对应 OSI 模型的第 4 层。TCP/IP\
  \ 模型的网际层对应 OSI 模型的第 3 层。TCP/IP 模型的链路层对应 OSI 模型的第 1 和 2 层。\n\n由于混淆、误解，或许还有懒惰，现在通行的做法是用\
  \ OSI 模型对应层的名称来称呼 TCP/IP 模型的层。TCP/IP 模型的应用层已经使用了从 OSI 借来的名称，所以这一点很容易。TCP/IP 模型的主机到主机层有时被称为传输层（OSI\
  \ 模型的第 4 层）。TCP/IP 模型的网际层有时被称为网络层（OSI 模型的第 3 层）。而 TCP/IP 模型的链路层有时被称为数据链路层或网络接入层（OSI\
  \ 模型的第 2 层）。\n\n#### TCP/IP 协议套件概述\n\n最广泛使用的协议套件是 `TCP/IP`，但它不仅仅是单个协议；而是一个由数十个单独协议组成的协议栈（参见图\
  \ 11.6）。TCP/IP 是一个基于开放标准的、与平台无关的协议。然而，这既是优势也是劣势。TCP/IP 几乎存在于所有可用的操作系统中，但它消耗大量资源，且相对容易被攻击，因为它的设计初衷是易用性而非安全性。\n\
  \n![图 11.6 TCP/IP 的四层及其组成协议 ](img/c11f006.jpg)\n\n**图 11.6** TCP/IP 的四层及其组成协议\n\n\
  可以使用系统间的虚拟专用网络 (VPN) 链路来保护 TCP/IP。VPN 链路经过加密，以增加隐私性、机密性和认证性，并维护数据完整性。用于建立 VPN 的协议包括\
  \ `点对点隧道协议 (PPTP)`、`第 2 层隧道协议 (L2TP)`、`安全外壳协议 (SSH)`、`OpenVPN`（SSL/TLS VPN）和 `IP\
  \ 安全协议 (IPSec)`。另一种提供协议级安全性的方法是使用 TCP 包装器。`TCP 包装器`是一种应用程序，可通过根据用户 ID 或系统 ID 限制对端口和资源的访问，充当基本防火墙。使用\
  \ TCP 包装器是一种基于端口的访问控制形式。\n\n##### 传输层协议\n\nTCP/IP 的两个主要传输层协议是 `TCP` 和 `UDP`。`传输控制协议\
  \ (TCP)` 是一种全双工面向连接的协议，而 `用户数据报协议 (UDP)` 是一种单工无连接协议。当在两个系统之间建立通信连接时，是通过端口完成的。TCP\
  \ 和 UDP 各有 65,536 个端口。由于端口号是 16 位二进制数，端口总数为 `2¹⁶`，即 65,536，编号从 0 到 65,535。端口只不过是通信链路两端在传输层传输数据时约定使用的一个地址编号。端口允许单个\
  \ IP 地址支持多个同时进行的通信，每个通信使用不同的端口号。IP 地址和端口号的组合称为 `套接字`。\n\n\n\n\n\n### TCP 端口与传输控制协议\n\
  \n#### 熟知端口（0–1,023）\n\n这前 1,024 个端口（0–1,023）被称为*熟知端口*或*服务端口*。这是因为它们具有标准化的分配，对应其所支持的服务。例如，端口\
  \ 80 是 Web（HTTP）流量的标准端口，端口 23 是 Telnet 的标准端口，端口 25 是 SMTP 的标准端口。这些端口保留专供服务器使用（换句话说，它们不能被请求客户端用作源端口）。您可以在本章后面的“常见应用层协议”部分找到考试值得了解的端口列表。\n\
  \n#### 注册软件端口（1,024–49,151）\n\n端口 1,024 到 49,151 称为*注册软件端口*。这些端口有一个或多个网络软件产品专门向国际互联网号码分配局（IANA,\
  \ `www.iana.org`）注册，以便为试图连接其产品的客户端提供标准化的端口编号系统。\n\n#### 动态/临时端口（49,152–65,535）\n\
  \n端口 49,152 到 65,535 称为*随机、动态或临时端口*，因为它们经常被客户端随机且临时地用作源端口。当在初始服务端口或注册端口之外，在客户端和服务器之间协商数据传输管道时，这些随机端口也被多种网络服务使用，例如常见的\
  \ FTP 所执行的操作。\n\n#### 传输控制协议 (TCP)\n\n传输控制协议 (TCP) 在 OSI 模型的第 4 层（传输层）运行。它支持全双工通信，面向连接，并采用可靠会话。TCP\
  \ 之所以面向连接，是因为它采用两个系统之间的握手过程来建立通信会话。完成此握手过程后，即建立了一个可支持客户端和服务器之间数据传输的通信会话。\n\n#####\
  \ 三次握手\n\n三次握手过程（**图 11.7**）如下：\n\n1.  客户端向服务器发送一个标记了 `SYN`（同步）标志的数据包。\n2.  服务器响应一个标记了\
  \ `SYN/ACK`（同步和确认）标志的数据包回复给客户端。\n3.  客户端响应一个标记了 `ACK`（确认）标志的数据包回复给服务器。\n\n![图 11.7\
  \ TCP 三次握手](img/c11f007.jpg)\n\n**图 11.7** TCP 三次握手\n\n##### 会话终止\n\n当通信会话完成时，有两种方法可以断开\
  \ TCP 会话：\n\n1.  **FIN（完成）标志数据包**：最常用的方法。每一方在其所有数据传输完毕后发送一个标记了 `FIN` 标志的数据包，触发对方用一个标记了\
  \ `ACK` 标志的确认数据包进行确认。因此，优雅地拆除一个 TCP 会话需要四个数据包。\n2.  **RST（复位）标志数据包**：导致会话立即且突然地终止。（请参阅本节后面关于\
  \ TCP 头部标志的讨论。）\n\n##### 排序、确认与流量控制\n\nTCP 传输的段被标记上序列号。这使得接收方能够通过将接收到的段重新排序回其正确的排列来重建原始通信，而不管它们的接收顺序如何。\n\
  \n通过 TCP 会话传输的数据会定期通过确认进行验证。确认由接收方发回发送方，方法是将 TCP 头部的确认序列值设置为在传输窗口内从发送方接收到的最后一个序列号。在发送确认数据包之前传输的数据包数量称为**传输窗口**。\n\
  \n数据流通过一种称为**滑动窗口**的机制进行控制。TCP 能够在发送确认之前使用不同大小的窗口（换句话说，不同数量的传输数据包）。\n\n- **较大的窗口**：允许更快的数据传输，但应仅用于丢失或损坏数据极少的可靠连接上。\n\
  - **较小的窗口**：应在通信连接不可靠时使用。\n\n当需要数据交付时应采用 TCP。滑动窗口允许此大小动态变化，因为 TCP 会话的可靠性在使用过程中会发生变化。如果传输窗口的所有数据包未全部被接收，则不发送确认。超时后，发送方将重新发送整个传输窗口的数据包集合。\n\
  \n### TCP 头部结构\n\n与另一种常见的传输层协议 UDP 相比，TCP 头部相对复杂。TCP 头部长度为 20 到 60 字节。该头部划分为多个部分或字段，详见**表\
  \ 11.1**。\n\n**表 11.1** **TCP 头部构造（按头部开始到结束顺序）**\n\n| 位大小 | 字段 |\n| :--- | :---\
  \ |\n| 16 | 源端口 |\n| 16 | 目的端口 |\n| 32 | 序列号 |\n| 4 | 数据偏移 |\n| 4 | 保留供将来使用 |\n\
  | 8 | 标志（见**表 11.2**） |\n| 16 | 窗口大小 |\n| 16 | 校验和 |\n| 16 | 紧急指针 |\n| 可变 | 各种选项；必须是\
  \ 32 位的倍数 |\n\n所有这些字段都有独特的参数和要求，其中大多数超出了 CISSP 考试的范围。但是，您应该熟悉标志字段的详细信息。标志字段可以包含一个或多个标志（或控制位）的指定。这些标志指示\
  \ TCP 数据包的功能，并请求接收方以特定方式响应。标志字段长 8 位。每个位位置代表单个标志或控制设置。每个位置可以设置为 1（开）或 0（关）。在某些条件下，可以同时启用多个标志（例如，TCP\
  \ 三次握手中的第二个数据包，此时 `SYN` 和 `ACK` 标志均被设置）。**表 11.2** 详细列出了标志控制位。\n\n**表 11.2** **TCP\
  \ 头部标志字段值**\n\n| 标志位指示符 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| CWR | 拥塞窗口减小 | 用于管理拥塞链路上的传输；见\
  \ RFC 3168 |\n| ECE | ECN 回显（显式拥塞通知） | 用于管理拥塞链路上的传输；见 RFC 3168 |\n| URG | 紧急 | 指示紧急数据\
  \ |\n| ACK | 确认 | 确认同步或关闭请求 |\n| PSH | 推送 | 指示需立即将数据推送给应用程序 |\n| RST | 复位 | 导致 TCP\
  \ 会话立即断开 |\n| SYN | 同步 | 请求使用新序列号进行同步 |\n| FIN | 完成 | 请求优雅关闭 TCP 会话 |\n\n### IP\
  \ 头部协议字段\n\n一个额外的重要细节是，TCP 的 IP 头部协议字段值为 `6` (`0x06`)。协议字段值是每个 IP 数据包头部中发现的标签或标志，它告诉接收系统数据包的类型。IP\
  \ 头部的协议字段指示下一个封装协议的标识（换句话说，当前协议层载荷中包含的协议，如 ICMP 或 IGMP，或上一层协议，如 TCP 或 UDP）。可以把它想象成你从冰箱里拿出的、用白纸包裹的神秘肉包装上的标签。没有标签，你必须打开并检查才能弄清它是什么。但有了标签，你就可以快速搜索或筛选以找到感兴趣的项目。有关其他协议字段值的列表，请访问\
  \ `www.iana.org/assignments/protocol-numbers`。\n\n\n\n\n\n### 用户数据报协议 (UDP)\n\n\
  用户数据报协议 (UDP) 也工作在 OSI 模型的第 4 层（传输层）。它是一种无连接的“尽力而为”通信协议。它不提供错误检测或纠正，不使用排序，不使用流量控制机制，不使用预建立的会话，因此被认为是不可靠的。UDP\
  \ 开销极低，因此可以快速传输数据。然而，UDP 应仅在数据交付非关键时使用。UDP 常被实时或流式通信用于音频和/或视频。UDP 的 IP 头部协议字段值为\
  \ 17 (0x11)。\n\n如前所述，与 TCP 头部相比，UDP 头部相对简单。UDP 头部长 8 字节（64 位）。该头部分为四个部分，或字段（每个长\
  \ 16 位）：\n\n*   `Source port`（源端口）\n*   `Destination port`（目标端口）\n*   `Message length`（消息长度）\n\
  *   `Checksum`（校验和）\n\n### 网络层协议和 IP 网络基础\n\nTCP/IP 协议套件中的另一个重要协议工作在 OSI 模型的网络层，即互联网协议\
  \ (IP)。IP 为数据包提供路由寻址。正是这种路由寻址构成了全球互联网通信的基础，因为它提供了一种标识手段并规定了传输路径。与 UDP 类似，IP 是无连接的，是一种不可靠的数据报服务。IP\
  \ 不保证数据包会被交付，不保证数据包会按正确顺序交付，也不保证数据包仅被交付一次。因此，必须在 IP 上使用 TCP 以获得可靠且受控的通信会话。\n\n####\
  \ IP 类别\n\nIP 寻址和 IP 类别的基础知识是任何安全专业人员的必修课。如果你对寻址、子网划分、类别及其他相关主题生疏了，请花时间复习一下。表 11.3\
  \ 和 表 11.4 提供了类别和默认子网关键细节的快速概览。完整的 A 类子网支持 16,777,214 台主机；完整的 B 类子网支持 65,534 台主机；完整的\
  \ C 类子网支持 254 台主机。D 类用于组播，而 E 类保留供将来使用。\n\n**表 11.3** **IP 类别**\n\n| 类别 | 首位二进制数字\
  \ | 首个八位字节的十进制范围 |\n| --- | --- | --- |\n| A | 0 | 1–126 |\n| B | 10 | 128–191 |\n\
  | C | 110 | 192–223 |\n| D | 1110 | 224–239 |\n| E | 1111 | 240–255 |\n\n**表 11.4**\
  \ **IP 类别的默认子网掩码**\n\n| 类别 | 默认子网掩码 | CIDR 等效值 |\n| --- | --- | --- |\n| A | 255.0.0.0\
  \ | /8 |\n| B | 255.255.0.0 | /16 |\n| C | 255.255.255.0 | /24 |\n\n请注意，整个 127 类\
  \ A 网络被预留用于 `loopback address`（回环地址），尽管实际上仅需一个地址即可实现该目的。\n\n子网划分的另一种选择是使用 `Classless\
  \ Inter-Domain Routing (CIDR)`（无类别域间路由）表示法。CIDR 使用掩码位而非完整的点分十进制子网掩码表示法。因此，CIDR 会在\
  \ IP 地址后加上斜杠，例如 `172.16.1.1/16`，而不是使用 255.255.0.0。CIDR 相较于传统子网掩码技术的一个显著优势是能够将多个不连续的地址集合合并为单个子网。例如，可以将多个\
  \ C 类子网合并为一个更大的子网组。如果你对 CIDR 感兴趣，请参阅维基百科上的 CIDR 条目，或访问 IETF 的 CIDR RFC 文档：[`tools.ietf.org/html/rfc4632`](http://tools.ietf.org/html/rfc4632)。\n\
  \nICMP 和 IGMP 是 OSI 模型网络层的其他协议：\n\n**ICMP** `Internet Control Message Protocol (ICMP)`（互联网控制消息协议）用于确定网络或特定链路的健康状况。`ping`、`traceroute`、`pathping`\
  \ 和其他网络管理工具均使用 ICMP。`ping` 实用程序使用 ICMP 回显数据包并将其反弹至远程系统。因此，你可以使用 `ping` 来确定远程系统是否在线、远程系统是否及时响应、中间系统是否支持通信，以及中间系统通信的性能效率水平。`ping`\
  \ 实用程序包含重定向功能，允许将回显响应发送到不同于源系统的目标。\n\n不幸的是，ICMP 的特性常被利用于各种基于带宽的拒绝服务 (DoS) 攻击，例如死亡之\
  \ Ping、Smurf 攻击和 Ping 洪水攻击。这一事实塑造了当今网络处理 ICMP 流量的方式，导致许多网络限制 ICMP 的使用，或至少限制其吞吐率。死亡之\
  \ Ping 发送一个大于 65,535 字节（大于最大 IPv4 数据包大小）的畸形 Ping 给计算机，试图使其崩溃。Smurf 攻击通过伪造广播 Ping\
  \ 在目标网络上产生巨大流量，而 Ping 洪水则是一种基本的 DoS 攻击，依赖于耗尽目标可用的所有带宽。\n\n你应该了解关于 ICMP 的几个重要细节。首先，ICMP\
  \ 的 IP 头部协议字段值为 1 (0x01)。其次，ICMP 头部中的类型字段定义了 ICMP 有效载荷中所含消息的类型或用途。已定义了 40 多种类型，但只有\
  \ 7 种常用（见 表 11.5）。你可以在 [www.iana.org/assignments/icmp-parameters](http://www.iana.org/assignments/icmp-parameters)\
  \ 找到 ICMP 类型字段值的完整列表。值得注意的是，列出的许多类型可能也支持代码。代码只是提供关于 ICMP 消息有效载荷功能或用途的更多细节的额外数据参数。会导致\
  \ ICMP 响应的一个事件示例是：尝试连接到一个 UDP 服务端口，但该服务和端口实际上并未在目标服务器上使用；这将导致向源发送 ICMP 类型 3 响应。由于\
  \ UDP 没有发回错误的机制，协议栈会为此目的切换到 ICMP。\n\n**表 11.5** **常见 ICMP 类型字段值**\n\n| 类型 | 功能 |\n\
  | --- | --- |\n| 0 | 回显应答 |\n| 3 | 目标不可达 |\n| 5 | 重定向 |\n| 8 | 回显请求 |\n| 9 | 路由器通告\
  \ |\n| 10 | 路由器请求 |\n| 11 | 超时 |\n\n**IGMP** `Internet Group Management Protocol\
  \ (IGMP)`（互联网组管理协议）允许系统支持组播。组播是将数据传输给多个特定接收者。（RFC 1112 讨论了执行 IGMP 组播的要求。）IGMP 由\
  \ IP 主机用于注册其动态组播组成员身份。连接的路由器也使用它来发现这些组。通过使用 IGMP 组播，服务器可以为整个组最初仅传输单个数据信号，而不是为每个预期接收者分别传输初始数据信号。使用\
  \ IGMP 时，如果存在通往预期接收者的分歧路径，单个初始信号会在路由器处被复制。IGMP 的 IP 头部协议字段值为 2 (0x02)。\n\n**ARP**\
  \ `Address Resolution Protocol (ARP)`（地址解析协议）对于逻辑和物理寻址方案的互操作性至关重要。ARP 用于将 IP 地址（用于逻辑寻址的\
  \ 32 位二进制数）解析为媒体访问控制 (MAC) 地址（用于物理寻址的 48 位二进制数）——或 EUI-48 甚至 EUI-64。网段上的流量（例如，跨集线器的电缆）使用\
  \ MAC 地址从源系统定向到目标系统。\n\n\n\n\n### ARP 缓存与广播机制\n\nARP 使用缓存和广播来执行其操作。将 IP 地址解析为 MAC\
  \ 地址（或反之）的第一步是检查本地 ARP 缓存。如果所需信息已存在于 ARP 缓存中，则直接使用。此活动有时会被一种称为 **ARP 缓存投毒** 的技术滥用，攻击者会将虚假信息插入\
  \ ARP 缓存。如果 ARP 缓存不包含必要信息，则会以广播形式发送 ARP 请求。如果被查询地址的所有者在本地子网中，它可以响应必要信息。如果不在，系统将默认使用其默认网关来传输通信。然后，默认网关（即路由器）需要执行其自己的\
  \ ARP 过程。\n\n### 常见应用层协议\n\n在 TCP/IP 模型的应用层（包含 OSI 模型的会话层、表示层和应用层）中存在许多特定于应用程序或服务的协议。了解这些协议及其相关服务端口对于\
  \ CISSP 考试很重要：\n\n*   **Telnet**，`TCP` 端口 `23`：这是一个终端仿真网络应用程序，支持远程连接以执行命令和运行应用程序，但不支持文件传输。\n\
  *   **文件传输协议 (FTP)**，`TCP` 端口 `20`（被动数据）/ 临时端口（主动数据）和 `21`（控制连接）：这是一个支持文件交换的网络应用程序，需要匿名或特定身份验证。\n\
  *   **简单文件传输协议 (TFTP)**，`UDP` 端口 `69`：这是一个支持文件交换的网络应用程序，不需要身份验证。\n*   **简单邮件传输协议\
  \ (SMTP)**，`TCP` 端口 `25`：这是一种用于将电子邮件从客户端传输到电子邮件服务器，以及从一个电子邮件服务器传输到另一个电子邮件服务器的协议。\n\
  *   **邮局协议 (POP3)**，`TCP` 端口 `110`：这是一种用于将电子邮件服务器收件箱中的电子邮件拉取到电子邮件客户端的协议。\n*   **互联网消息访问协议\
  \ (IMAP)**，`TCP` 端口 `143`：这是一种用于将电子邮件服务器收件箱中的电子邮件拉取到电子邮件客户端的协议。IMAP 比 POP3 更安全，并提供从电子邮件服务器拉取邮件头以及直接在电子邮件服务器上删除消息的功能，而无需先下载到本地客户端。\n\
  *   **动态主机配置协议 (DHCP)**，`UDP` 端口 `67` 和 `68`：DHCP 使用端口 `67` 作为服务器上的目标端口以接收客户端通信，使用端口\
  \ `68` 作为客户端请求的源端口。它用于在系统启动时分配 TCP/IP 配置设置。DHCP 实现了网络寻址的集中控制。\n*   **超文本传输协议 (HTTP)**，`TCP`\
  \ 端口 `80`：这是用于将网页元素从 Web 服务器传输到 Web 浏览器的协议。\n*   **安全套接字层 (SSL)**，`TCP` 端口 `443`（用于\
  \ HTTP 加密）：这是一种在传输层运行的类 VPN 安全协议。SSL 最初设计用于支持安全的 Web 通信 (HTTPS)，但能够保护任何应用层协议通信。\n\
  *   **行式打印机守护进程 (LPD)**，`TCP` 端口 `515`：这是一种用于打印作业缓存和将打印作业发送到打印机的网络服务。\n*   **X Window**，`TCP`\
  \ 端口 `6000–6063`：这是命令行操作系统的 GUI API。\n*   **网络文件系统 (NFS)**，`TCP` 端口 `2049`：这是一种用于支持异构系统间文件共享的网络服务。\n\
  *   **简单网络管理协议 (SNMP)**，`UDP` 端口 `161`（`UDP` 端口 `162` 用于 Trap 消息）：这是一种通过从中央监控站轮询监控设备来收集网络健康和状态信息的网络服务。\n\
  \n### 多层协议的影响\n\n从前面几节可以看出，TCP/IP 作为一个协议套件，包含分布在各个协议栈层中的数十个单独协议。因此，TCP/IP 是一个 **多层协议**。TCP/IP\
  \ 从其多层设计中获得了几项益处，特别是与其封装机制有关。例如，当通过典型网络连接在 Web 服务器和 Web 浏览器之间通信时，`HTTP` 封装在 `TCP`\
  \ 中，后者又封装在 `IP` 中，后者又封装在 `Ethernet` 中。这可以表示如下：\n\n```\n[ Ethernet [ IP [ TCP [ HTTP\
  \ ] ] ] ]\n```\n\n然而，这并不是 TCP/IP 封装支持的全部。还可以添加额外的封装层。例如，向通信添加 `SSL/TLS` 加密会在 `HTTP`\
  \ 和 `TCP` 之间插入一个新的封装：\n\n```\n[ Ethernet [ IP [ TCP [ SSL [ HTTP ] ] ] ] ]\n```\n\
  \n这反过来还可以进一步用网络层加密（如 `IPSec`）进行封装：\n\n```\n[ Ethernet [ IPSec [ IP [ TCP [ SSL [\
  \ HTTP ] ] ] ] ] ]\n```\n\n然而，封装并不总是用于良性目的。有许多隐蔽信道通信机制利用封装来隐藏或隔离另一个授权协议内部的未授权协议。例如，如果网络阻止使用\
  \ `FTP` 但允许 `HTTP`，则可以使用 `HTTP Tunnel` 等工具绕过此限制。这可能导致如下的封装结构：\n\n```\n[ Ethernet\
  \ [ IP [ TCP [ HTTP [ FTP ] ] ] ] ]\n```\n\n通常，`HTTP` 承载其自身的 Web 相关负载，但使用 `HTTP\
  \ Tunnel` 工具时，标准负载会被替换为替代协议。这种虚假封装甚至可能发生在协议栈的较低层。例如，`ICMP` 通常用于网络健康测试，而非一般通信。然而，使用\
  \ `Loki` 等实用程序，`ICMP` 可转换为隧道协议以支持 `TCP` 通信。`Loki` 的封装结构如下：\n\n```\n[ Ethernet [\
  \ IP [ ICMP [ TCP [ HTTP ] ] ] ] ]\n```\n\n由无界封装支持引起的另一个关注领域是跨虚拟局域网 (VLAN) 跳转的能力。VLAN\
  \ 是通过标签逻辑分离的网段。这种攻击称为 **VLAN 跳转**，通过创建双重封装的 **IEEE 802.1Q VLAN 标签** 来执行：\n\n```\n\
  [ Ethernet [ VLAN1 [ VLAN2 [ IP [ TCP [ HTTP ] ] ] ] ] ]\n```\n\n通过这种双重封装，第一个遇到的交换机将剥离第一个\
  \ VLAN 标签，然后下一个交换机会被内部的 VLAN 标签欺骗，将流量移动到另一个 VLAN。\n\n多层协议提供下列益处：\n\n*   可以在高层使用各种协议。\n\
  *   可以在各层加入加密。\n*   支持复杂网络结构中的灵活性和弹性。\n\n多层协议有几个缺点：\n\n*   允许隐蔽信道。\n*   过滤器可被绕过。\n\
  *   逻辑施加的网络段边界可能被跨越。\n\n### TCP/IP 漏洞\n\nTCP/IP 的漏洞众多。各种操作系统中实现不当的 TCP/IP 协议栈容易受到缓冲区溢出、`SYN`\
  \ 洪水攻击、各种拒绝服务 (DoS) 攻击、碎片攻击、超大数据包攻击、欺骗攻击、中间人攻击、劫持攻击和编码错误攻击。\n\nTCP/IP（以及大多数协议）还容易受到通过监控或嗅探进行的被动攻击。网络监控是监控流量模式以获取网络信息的行为。数据包嗅探是从网络捕获数据包，希望从数据包内容中提取有用信息的行为。有效的数据包嗅探器可以提取用户名、密码、电子邮件地址、加密密钥、信用卡号、IP\
  \ 地址、系统名称等。\n\n数据包嗅探和其他攻击将在第 13 章中详细讨论。\n\n### 域名系统\n\n\n\n### 寻址与命名\n\n寻址与命名是实现网络通信的重要组成部分。如果没有寻址方案，联网计算机将无法区分彼此，也无法指定通信的目标。同样，如果没有命名方案，人类将不得不依靠记忆和编号系统来标识计算机。记住\
  \ [Google.com](http://Google.com) 比记住 `64.233.187.99` 容易得多。因此，大多数命名方案的设立是为了人类使用，而非计算机使用。\n\
  \n掌握基于 TCP/IP 网络中寻址和编号的基本概念非常重要。需要了解三个不同的层次。此处按逆序呈现，因为第三层是最基础的：\n\n*   **第三层，即底层，是\
  \ MAC 地址。** MAC 地址，或称硬件地址，是一个“永久”的物理地址。\n*   **第二层，即中间层，是 IP 地址。** IP 地址是一个“临时”的逻辑地址，分配在\
  \ MAC 地址之上。\n*   **顶层是域名。** 域名或计算机名是一个“临时”的、面向人类的约定，分配在 IP 地址之上。\n\n这一命名与寻址系统赋予每个网络组件所需的信息，同时使其对这些信息的使用尽可能简单。人类获得便于记忆的域名，网络协议获得便于路由的\
  \ IP 地址，网络接口获得物理地址。然而，这三种方案必须关联在一起，以实现互操作性。因此，开发了 `域名系统 (DNS)` 和 `ARP` 系统，分别用于在域名与\
  \ IP 地址之间、IP 地址与 MAC 地址之间进行互换或解析。`DNS` 将便于人类记忆的域名解析为其对应的 IP 地址。然后，`ARP` 将 IP 地址解析为其对应的\
  \ MAC 地址。如果定义了 `PTR` 记录，也可以通过 `DNS` 反向查找将 IP 地址解析为域名（详见本章后面的“域名系统”）。\n\n`DNS` 是公共网络和私有网络中使用的分层命名方案。`DNS`\
  \ 将 IP 地址与便于人类记忆的 `完全合格域名 (FQDN)` 关联起来。一个 `FQDN` 由三个主要部分组成：\n\n*   **顶级域 (TLD)**—[www.google.com](http://www.google.com)\
  \ 中的 `com`\n*   **注册域名**—[www.google.com](http://www.google.com) 中的 `google`\n*\
  \   **子域或主机名**—[www.google.com](http://www.google.com) 中的 `www`\n\n`TLD` 可以是任意数量的官方选项，包括最初七个\
  \ TLD 中的六个——`com`、`org`、`edu`、`mil`、`gov` 和 `net`——以及许多较新的选项，如 `info`、`museum`、`telephone`、`mobi`、`biz`\
  \ 等。还有被称为**国家代码**的国家变体。（有关当前 TLD 和国家代码的详细信息，请参阅 [www.iana.org/domains/root/db/](http://www.iana.org/domains/root/db/)。）请注意，第七个原始\
  \ TLD 是 `int`（代表 international，国际），已被双字母国家代码取代。\n\n注册域名必须在经批准的域名注册商处正式注册，例如 Network\
  \ Solutions 或 1and1.com。\n\n`FQDN` 最左侧的部分可以是单个主机名，如 `www`、`ftp` 等，也可以是多节的子域名标识，如\
  \ [server1.group3.bldg5.mycompany.com](http://server1.group3.bldg5.mycompany.com)。\n\
  \n`FQDN` 的总长度不能超过 253 个字符（包括点）。任何单个部分不能超过 63 个字符。`FQDN` 只能包含字母、数字和连字符。\n\n每个注册域名都有一个指定的权威名称服务器。**主权威名称服务器**托管该域的原始区域文件。**辅助权威名称服务器**可用于托管区域文件的只读副本。**区域文件**是**资源记录**的集合，包含特定域的详细信息。有几十种可能的资源记录（详见\
  \ [`en.wikipedia.org/wiki/List_of_DNS_record_types`](http://en.wikipedia.org/wiki/List_of_DNS_record_types)）；最常见的记录列在表\
  \ 11.6 中。\n\n#### 表 11.6：常见资源记录\n\n| 记录 | 类型 | 说明 |\n| :--- | :--- | :--- |\n| `A`\
  \ | 地址记录 | 将 `FQDN` 映射到 `IPv4` 地址 |\n| `AAAA` | 地址记录 | 将 `FQDN` 映射到 `IPv6` 地址 |\n\
  | `PTR` | 指针记录 | 将 IP 地址映射到 `FQDN`（用于反向查找） |\n| `CNAME` | 规范名称 | 将 `FQDN` 别名映射到另一个\
  \ `FQDN` |\n| `MX` | 邮件交换 | 将与邮件和消息相关的 `FQDN` 映射到 IP 地址 |\n| `NS` | 名称服务器记录 | 指定授权名称服务器的\
  \ `FQDN` 和 IP 地址 |\n| `SOA` | 起始授权记录 | 指定关于区域文件的权威信息，如主名称服务器、序列号、超时时间和刷新间隔 |\n\n\
  最初，`DNS` 由一个称为 **HOSTS 文件** 的静态本地文件处理。该文件仍然存在，但动态 `DNS` 查询系统已在很大程度上取代了它，尤其是在大型私有网络和互联网中。当客户端软件指向一个\
  \ `FQDN` 时，协议栈会发起一个 `DNS` 查询，以将该名称解析为可用于构建 IP 头部的 IP 地址。解析过程首先检查本地 `DNS` 缓存，以查看答案是否已知。`DNS`\
  \ 缓存由本地 **HOSTS 文件** 的预加载内容以及当前启动会话期间执行的 `DNS` 查询（尚未超时的）组成。如果缓存中没有所需答案，则会向本地 IP\
  \ 配置中指定的 `DNS` 服务器发送 `DNS` 查询。解析查询的过程既有趣又复杂，但其中大部分与 `(ISC)² CISSP` 考试无关。\n\n`DNS`\
  \ 在 `TCP` 和 `UDP` 端口 `53` 上运行。`TCP` 端口 `53` 用于区域传输。这些是 `DNS` 服务器之间的区域文件交换，用于特殊的手动查询，或当响应超过\
  \ 512 字节时。`UDP` 端口 `53` 用于大多数典型的 `DNS` 查询。\n\n**域名系统安全扩展 (DNSSEC)** 是对现有 `DNS` 基础设施的安全改进。`DNSSEC`\
  \ 的主要功能是在 `DNS` 操作期间为设备之间提供可靠的身份验证。`DNSSEC` 已在 `DNS` 系统的很大一部分中实施。每个 `DNS` 服务器都会被颁发一个数字证书，随后用于执行相互证书认证。`DNSSEC`\
  \ 的目标是防止一系列 `DNS` 滥用行为，即虚假数据被注入解析过程。一旦完全实施，`DNSSEC` 将显著减少针对服务器的 `DNS` 滥用行为。\n\n\
  ### DNS 投毒\n\n**DNS 投毒** 是伪造客户端用于访问目标系统的 `DNS` 信息的行为。它可以通过多种方式发生。每当客户端需要将 `DNS`\
  \ 名称解析为 IP 地址时，可能会经历以下过程：\n\n1.  检查本地缓存（其中包含 **HOSTS 文件** 的内容）。\n2.  向已知的 `DNS`\
  \ 服务器发送 `DNS` 查询。\n3.  向任何可能的本地子网 `DNS` 服务器发送广播查询。（此步骤并未得到广泛支持。）\n\n如果客户端无法从上述任何步骤获得\
  \ `DNS` 到 IP 的解析，则解析失败，通信无法发送。`DNS` 投毒可能发生在上述任何步骤中，但最简单的方法是破坏 **HOSTS 文件** 或 `DNS`\
  \ 服务器查询。\n\n攻击或利用 `DNS` 有多种方法。攻击者可能会使用以下技术之一：\n\n\n\n\n### DNS 攻击与防御\n\n#### 部署流氓\
  \ DNS 服务器（DNS 欺骗/药水攻击）\n\n**部署流氓 DNS 服务器（也称为 DNS 欺骗或 DNS 药水攻击）。** *流氓 DNS* 服务器可以监听网络流量中的任何\
  \ DNS 查询或与目标站点相关的特定 DNS 查询。然后，流氓 DNS 服务器向客户端发送包含虚假 IP 信息的 DNS 响应。此攻击要求流氓 DNS 服务器在真实\
  \ DNS 服务器响应之前将其响应返回给客户端。一旦客户端收到来自流氓 DNS 服务器的响应，客户端就会关闭 DNS 查询会话，这会导致来自真实 DNS 服务器的响应被丢弃并作为会话外数据包被忽略。\n\
  \nDNS 查询未经过身份验证，但它们确实包含一个称为 *查询 ID* (QID) 的 16 位值。DNS 响应必须包含与查询相同的 QID 才会被接受。因此，流氓\
  \ DNS 服务器必须在虚假回复中包含请求的 QID。\n\n#### 执行 DNS 投毒\n\n**执行 DNS 投毒。** *DNS 投毒* 涉及攻击真实\
  \ DNS 服务器并在其区域文件中放置不正确的信息。这会导致真实 DNS 服务器向客户端发回虚假数据。\n\n#### 篡改 HOSTS 文件\n\n**篡改\
  \ HOSTS 文件。** 通过在客户端的 HOSTS 文件中放置虚假 DNS 数据来修改该文件，可将用户重定向到虚假位置。\n\n#### 损坏 IP 配置\n\
  \n**损坏 IP 配置。** 损坏 IP 配置可能导致客户端拥有虚假的 DNS 服务器定义。这可以直接在客户端上完成，也可以在网络的 DHCP 服务器上完成。\n\
  \n#### 使用代理伪造\n\n**使用代理伪造。** 此方法仅对 Web 通信有效。此攻击在客户端浏览器中植入虚假 Web 代理数据，然后攻击者运行流氓代理服务器。流氓代理服务器可以修改\
  \ HTTP 流量数据包，将请求重定向到黑客想要的任何站点。\n\n尽管存在多种 DNS 投毒方法，但以下是一些基本安全措施，可大大降低其威胁：\n\n*  \
  \ 限制从内部 DNS 服务器到外部 DNS 服务器的区域传送。这通过阻止入站 TCP 端口 53（区域传送请求）和 UDP 端口 53（查询）来实现。\n*\
  \   限制内部 DNS 服务器拉取区域传送的外部 DNS 服务器。\n*   部署 *网络入侵检测系统 (NIDS)* 以监视异常 DNS 流量。\n*  \
  \ 妥善加固专用网络中的所有 DNS、服务器和客户端系统。\n*   使用 DNSSEC 保护 DNS 基础设施。\n*   要求内部客户端通过内部 DNS 解析所有域名。这将要求您阻止出站\
  \ UDP 端口 53（用于查询），同时保持出站 TCP 端口 53（用于区域传送）开放。\n\n*与 DNS 投毒和/或 DNS 欺骗密切相关的另一种攻击是\
  \ DNS 药水攻击。* *药水攻击* 是将有效网站的 URL 或 IP 地址恶意重定向到托管原始有效站点虚假版本的假网站。这通常是网络钓鱼攻击的一部分，攻击者试图诱骗受害者泄露其登录凭据。如果潜在受害者不小心或不注意，他们可能会被诱骗向虚假的药水网站提供其登录信息。药水攻击通常通过修改系统上的本地\
  \ HOSTS 文件，或通过投毒或欺骗 DNS 解析来发生。药水攻击是一个日益严重的问题，因为黑客已经发现了利用 DNS 漏洞对大量目标用户进行各种域名药水攻击的方法。\n\
  \n#### 域名劫持\n\n*域名劫持*，或 *域名盗窃*，是指未经合法所有者授权，恶意更改域名注册信息的行为。这可以通过窃取所有者的登录凭据、使用 XSRF、劫持会话、使用\
  \ MitM（有关这些攻击的介绍，请参见第 21 章“恶意代码和应用程序攻击”），或利用域名注册商系统中的缺陷来实现。\n\n有时，当另一个人在原所有者注册过期后立即注册该域名时，这被称为\
  \ *域名劫持*，但这并不准确。这是一种潜在的不道德行为，但并非实际的黑客攻击或攻击。这是利用了原所有者未能手动延长注册或配置自动续费的疏忽。如果原所有者因未能维护注册而失去域名，通常别无选择，只能联系新所有者并询问能否重新获得控制权。许多注册商对过期注册采取“先到先得”政策。\n\
  \n当组织失去域名且其他人接管控制权时，这对组织及其客户和访问者来说都是毁灭性的事件。原网站或在线内容将不再可用（或至少无法在同一域名下访问）。新所有者可能会托管完全不同的内容，或托管前一个站点的虚假副本。这种后一种活动可能会欺骗访问者，类似于网络钓鱼攻击，从而提取和收集个人身份信息\
  \ (PII)。\n\n域名劫持的一个例子是 2017 年 9 月 Fox-IT.com 域名被盗；您可以在 [`www.fox-it.com/en/insights/blogs/blog/fox-hit-cyber-attack/`](https://www.fox-it.com/en/insights/blogs/blog/fox-hit-cyber-attack/)\
  \ 阅读有关此次攻击的信息。\n\n### 融合协议\n\n*融合协议* 是将专用或专有协议与标准协议（如 TCP/IP 套件中的协议）合并。融合协议的主要优势是能够使用现有的支持\
  \ TCP/IP 的网络基础设施来托管特殊或专有服务，而无需部署替代网络硬件的独特部署。这可以带来显著的成本节约。然而，并非所有融合协议都能提供与其专有实现相同级别的吞吐量或可靠性。此处介绍了一些常见的融合协议示例：\n\
  \n#### 以太网光纤通道 (FCoE)\n\n**以太网光纤通道 (FCoE)** *光纤通道* 是一种网络数据存储解决方案（*存储区域网络 [SAN]*\
  \ 或 *网络附属存储 [NAS]*），允许高达 128 Gbps 以上的高速文件传输。它设计为在光纤电缆上运行；后来增加了对铜缆的支持以提供成本较低的选项。光纤通道通常需要自己的专用基础设施（单独的电缆）。但是，可以使用\
  \ *以太网光纤通道 (FCoE)* 在现有网络基础设施上支持它。FCoE 用于在以太网网络上封装光纤通道通信。它通常需要 10 Gbps 以太网才能支持光纤通道协议。使用此技术，光纤通道作为网络层或\
  \ OSI 第 3 层协议运行，取代 IP 作为标准以太网网络的有效载荷。\n\n#### MPLS (多协议标签交换)\n\n**MPLS (多协议标签交换)**\
  \ *MPLS (多协议标签交换)* 是一种高吞吐量、高性能的网络技术，它根据短路径标签而非较长的网络地址跨网络传输数据。与可能非常复杂的传统基于 IP 的路由过程相比，此技术可节省大量时间。此外，MPLS\
  \ 设计用于通过封装处理各种协议。因此，网络不限于 TCP/IP 和兼容协议。这使得许多其他网络技术得以使用，包括 T1/E1、ATM、帧中继、SONET 和数字用户线路\
  \ (DSL)。\n\n#### 互联网小型计算机系统接口 (iSCSI)\n\n**互联网小型计算机系统接口 (iSCSI)** *互联网小型计算机系统接口\
  \ (iSCSI)* 是一种基于 IP 的网络存储标准。此技术可用于在 LAN、WAN 或公共互联网连接上实现位置无关的文件存储、传输和检索。iSCSI 通常被视为光纤通道的低成本替代方案。\n\
  \n\n\n\n\n#### 互联网协议语音 (VoIP)\n\n**互联网协议语音 (VoIP)** 是一种隧道机制，用于通过 TCP/IP 网络传输语音和/或数据。VoIP\
  \ 有潜力取代或替代 PSTN（公共交换电话网），因为它通常成本更低，并提供更多种类的选项和功能。VoIP 既可用作计算机网络上的直接电话替代品，也可用于移动设备。然而，VoIP\
  \ 能够支持视频和数据传输，以实现视频会议和项目远程协作。VoIP 有商业版和开源版两种选择。某些 VoIP 解决方案需要专用硬件，以替代传统电话听筒/基站，或允许这些设备连接到\
  \ VoIP 系统并在此系统上运行。某些 VoIP 解决方案仅基于软件，例如 `Skype`，允许用户现有的扬声器、麦克风或耳机替代传统电话听筒。其他解决方案则更多基于硬件，例如\
  \ `magicJack`，它允许将现有的 PSTN 电话设备插入通用串行总线 (USB) 适配器，以利用互联网上的 VoIP。通常，VoIP 到 VoIP 的通话是免费的（假设使用相同或兼容的\
  \ VoIP 技术），而 VoIP 到固定电话的通话通常按分钟收费。\n\n### 软件定义网络 (SDN)\n\n**软件定义网络 (SDN)** 是一种独特的网络运行、设计和管理方法。其概念基于这样一种理论：传统网络依赖设备上的配置（即路由器和交换机），其复杂性往往迫使组织坚持使用单一设备供应商（如\
  \ `Cisco`），并限制了网络响应不断变化的物理和业务条件的灵活性。SDN 旨在将基础设施层（即硬件和基于硬件的设置）与控制层（即数据传输管理的网络服务）分离。此外，这还消除了传统网络概念（如\
  \ IP 寻址、子网、路由等）需要被编程到托管应用程序中或由其解析的需求。\n\nSDN 提供了一种新的网络设计，可从中心位置直接编程，具有灵活性、供应商中立性，并基于开放标准。使用\
  \ SDN 使组织无需从单一供应商采购设备。相反，它允许组织根据需要混合搭配硬件，例如选择最具成本效益或吞吐量评级最高的设备，而不受供应商限制。然后通过集中管理界面控制硬件的配置和管理。此外，应用于硬件的设置可根据需要动态更改和调整。\n\
  \n理解 SDN 的另一种方式是将其视为网络虚拟化。它允许数据传输路径、通信决策树和流控制在 SDN 控制层中虚拟化，而不是在硬件上按设备单独处理。\n\n####\
  \ 内容分发网络\n\n**内容分发网络 (CDN)**，或内容交付网络，是部署在互联网上众多数据中心中的一组资源服务，旨在为托管内容提供低延迟、高性能和高可用性。CDN\
  \ 通过分布式数据主机的概念，提供客户所需的多媒体性能质量。媒体内容不再存储在单一位置并传输到互联网的各个部分，而是分发到互联网上的众多位置。这导致了一种地理和逻辑负载均衡。没有单个服务器或服务器集群会因所有资源请求的负载而紧张，且托管服务器位于更靠近请求客户的位置。总体结果是更低的延迟和更高质量的吞吐量。有许多\
  \ CDN 服务提供商，包括 `CloudFlare`、`Akamai`、`Amazon CloudFront`、`CacheFly` 和 `Level 3 Communications`。\n\
  \n虽然大多数 CDN 侧重于服务器的物理分发，但基于客户端的 CDN 也是可能的。这通常被称为 `P2P`（对等网络）。最广为人知的 P2P CDN 是 `BitTorrent`。\n\
  \n### 无线网络\n\n**无线网络** 是连接企业和家庭系统的一种流行方法，因为它易于部署且成本相对较低。它使网络比以往任何时候都更通用。工作站和便携式系统不再受线缆束缚，而是可以在部署的无线接入点的信号范围内自由移动。然而，这种自由也带来了额外的漏洞。历史上，无线网络一直相当不安全，主要是因为最终用户和组织缺乏知识，以及设备制造商设置的不安全默认配置。无线网络面临与任何有线网络相同的漏洞、威胁和风险，此外还面临远程窃听、数据包嗅探以及新形式的\
  \ DoS 和入侵。为可靠访问和安全性妥善管理无线网络并不总是一件简单或直接的事情。本节将探讨各种无线安全问题。\n\n**数据辐射** 是通过电磁信号传输数据。计算机内部或网络中的几乎所有活动都使用某种形式的数据辐射来执行。然而，该术语通常用于关注不需要的辐射，或因辐射而面临风险的数据。\n\
  \n电子移动时就会发生辐射。电子的运动会产生磁场。如果你能读取该磁场，就可以在别处重现它，以复现电子流。如果原始电子流用于通信数据，那么重现的电子流也是原始数据的重现。这种形式的电子窃听听起来像科幻小说，但却是科学事实。美国政府自\
  \ 20 世纪 50 年代起就在 `TEMPEST` 项目下研究辐射安全。\n\n防范窃听和数据窃取需要多管齐下的努力。首先，你必须对所有电子设备保持物理访问控制。其次，在未经授权的人员仍可能获得物理访问或接近的情况下，你必须使用屏蔽设备和介质。第三，你应始终使用安全加密协议传输任何敏感数据。\n\
  \n#### 保护无线接入点\n\n**无线小区** 是物理环境中无线设备可以连接到无线接入点的区域。无线小区可能泄漏到安全环境之外，允许入侵者轻松访问无线网络。你应该调整无线接入点的强度，以最大化授权用户的访问并最小化入侵者的访问。这可能需要独特的无线接入点放置、屏蔽和噪声传输。\n\
  \n**802.11** 是无线网络通信的 IEEE 标准。该标准的各个版本（技术上称为修正案）已在无线网络硬件中实现，包括 `802.11a`、`802.11b`、`802.11g`\
  \ 和 `802.11n`。`802.11x` 有时用于统称所有这些特定实现；然而，首选使用 `802.11`，因为 `802.11x` 容易与 `802.1x`\
  \ 混淆，后者是一种独立于无线的认证技术。`802.11` 标准的每个版本或修正案都提供了略微更好的吞吐量：分别为 2 MB、11 MB、54 MB 和 200\
  \ MB+，如表 11.7 所述。`b`、`g` 和 `n` 修正案都使用相同的频率；因此，它们保持向后兼容性。\n\n##### 表 11.7：802.11\
  \ 无线网络修正案\n\n| 修正案 | 速度 | 频率 |\n| --- | --- | --- |\n| 802.11 | 2 Mbps | 2.4 GHz\
  \ |\n| 802.11a | 54 Mbps | 5 GHz |\n| 802.11b | 11 Mbps | 2.4 GHz |\n\n\n\n\n\n\
  ### 无线网络标准\n\n| 标准 | 速度 | 频率 |\n| :--- | :--- | :--- |\n| 802.11g | 54 Mbps | 2.4\
  \ GHz |\n| 802.11n | 200+ Mbps | 2.4 GHz 或 5 GHz |\n| 802.11ac | 1 Gbps | 5 GHz\
  \ |\n\n在部署无线网络时，你应该部署配置为使用 `infrastructure mode`（基础架构模式）而非 `ad hoc mode`（自组网模式）的无线接入点。自组网模式意味着任意两个无线网络设备（包括两个无线网络接口卡\
  \ [NIC]）可以在没有中央控制机构的情况下进行通信。基础架构模式意味着需要一个无线接入点，系统上的无线 NIC 无法直接交互，并且会强制执行无线接入点针对无线网络访问的限制。\n\
  \n在基础架构模式的概念中，存在几种变体，包括独立模式、有线扩展模式、企业扩展模式和桥接模式。当无线接入点将无线客户端相互连接，但不连接到任何有线资源时，会出现\
  \ `stand-alone`（独立）模式基础架构。无线接入点专门充当无线集线器。当无线接入点充当连接点，将无线客户端链接到有线网络时，会出现 `wired extension`（有线扩展）模式基础架构。当使用多个无线接入点\
  \ (WAP) 将大型物理区域连接到同一个有线网络时，会出现 `enterprise extended`（企业扩展）模式基础架构。每个无线接入点将使用相同的 `extended\
  \ service set identifier (ESSID)`（扩展服务集标识符），以便客户端可以在该区域漫游，同时保持网络连接，即使其无线 NIC 将关联从一个无线接入点更改为另一个。当无线连接用于链接两个有线网络时，会出现\
  \ `bridge`（桥接）模式基础架构。这通常使用专用无线网桥，并在有线网桥不方便时使用，例如在楼层之间或建筑物之间链接网络。\n\n#### 保护 SSID\n\
  \n无线网络被分配一个服务集标识符 (SSID)（BSSID 或 ESSID），以将一个无线网络与另一个区分开来。如果同一个无线网络涉及多个基站或无线接入点，则会定义一个扩展站集标识符\
  \ (ESSID)。SSID 类似于工作组的名称。如果无线客户端知道 SSID，他们就可以将其无线 NIC 配置为与相关的 WAP 通信。不过，了解 SSID\
  \ 并不总能获得访问权限，因为 WAP 可以使用多种安全功能来阻止未经授权的访问。SSID 由供应商默认定义，由于这些默认 SSID 广为人知，标准安全实践要求在部署前将\
  \ SSID 更改为唯一的内容。\n\nSSID 通过一种称为 `beacon frame`（信标帧）的特殊传输由 WAP 广播。这允许范围内的任何无线 NIC\
  \ 看到无线网络，并使连接变得尽可能简单。然而，应禁用这种默认的 SSID 广播，以保持无线网络的隐蔽性。即便如此，攻击者仍可使用无线嗅探器发现 SSID，因为\
  \ SSID 仍必须用于无线客户端与 WAP 之间的传输中。因此，禁用 SSID 广播并非真正的安全机制。相反，应使用 WPA2 作为可靠的身份验证和加密解决方案，而不是试图隐藏无线网络的存在。\n\
  \n#### 进行现场勘测\n\n发现物理环境中可能存在未经授权无线访问区域的一种方法是执行现场勘测。`site survey`（现场勘测）是调查环境中部署的无线接入点的存在性、强度和覆盖范围的过程。此任务通常涉及携带便携式无线设备四处走动，记录无线信号强度，并将其绘制在建筑物的平面图或示意图上。\n\
  \n应进行现场勘测，以确保所有可能使用无线设备的位置都有足够的信号强度，同时将不应允许无线访问的位置（公共区域、跨楼层、其他房间内或建筑物外部）的无线信号最小化或消除。现场勘测对于评估现有无线网络部署、规划当前部署的扩展以及规划未来部署非常有用。\n\
  \n#### 使用安全加密协议\n\nIEEE 802.11 标准定义了无线客户端在正常网络通信跨无线链路发生之前，可用于向 WAP 进行身份验证的两种方法。这两种方法是\
  \ `open system authentication (OSA)`（开放系统认证）和 `shared key authentication (SKA)`（共享密钥认证）。OSA\
  \ 意味着不需要真正的身份验证。只要客户端和 WAP 之间可以传输无线电信号，就允许通信。同样，使用 OSA 的无线网络通常以明文传输所有内容，因此不提供任何保密性或安全性。SKA\
  \ 意味着在网络通信发生之前必须进行某种形式的身份验证。802.11 标准为 SKA 定义了一种可选技术，称为有线等效保密 (WEP)。对原始 802.11 标准的后续修正增加了\
  \ WPA、WPA2 和其他技术。\n\n##### WEP\n\n`Wired Equivalent Privacy (WEP)`（有线等效保密）由 IEEE\
  \ 802.11 标准定义。它旨在为无线网络提供与有线或缆线网络相同级别的安全性和加密。WEP 可防止针对无线传输的数据包嗅探和窃听。\n\nWEP 的一个次要好处是，它可以配置为防止未经授权访问无线网络。WEP\
  \ 使用预定义的共享密钥；然而，它不是典型的动态对称加密解决方案，而是共享密钥是静态的，并在所有无线接入点和设备接口之间共享。该密钥用于在通过无线链路传输之前加密数据包，从而提供机密性保护。哈希值用于验证接收到的数据包在传输过程中未被修改或损坏；因此\
  \ WEP 也提供完整性保护。知晓或持有该密钥不仅允许加密通信，还充当一种基本的身份验证形式，因为没有它，将禁止访问无线网络。\n\nWEP 发布后不久即被破解。如今，破解\
  \ WEP 只需不到一分钟，因此它成为一种毫无价值的安全预防措施。幸运的是，有 WEP 的替代方案，即 WPA 和 WPA2。WPA 是对 WEP 的改进，因为它不使用相同的静态密钥来加密所有通信。相反，它与每个主机协商一组唯一的密钥。然而，使用单个密码短语来授权与基站的关联（即允许新客户端建立连接）。如果密码短语不够长，可能会被猜测。通常建议密码短语为\
  \ 14 个字符或更长。\n\nWEP 加密采用 Rivest Cipher 4 (RC4)，一种对称流密码（有关加密的更多一般信息，请参见第 6 章“密码学和对称密钥算法”以及第\
  \ 7 章“PKI 和密码学应用”）。由于其设计缺陷和 RC4 的实现问题，WEP 在几个方面很薄弱，其中两个是使用静态公共密钥和 IV（初始化向量）的糟糕实现。由于这些弱点，WEP\
  \ 破解可以在发现足够多的被不当使用的 IV 后揭示 WEP 密钥。这种攻击现在可以在 60 秒内完成。发现 WEP 密钥后，攻击者可以加入网络，然后监听所有其他无线客户端的通信。因此，不应使用\
  \ WEP。它不提供真正的保护，并可能导致错误的安全感。\n\n##### WPA\n\n\n\n\n\n### Wi-Fi Protected Access\
  \ (WPA) 和无线安全\n\n*Wi-Fi Protected Access (WPA)* 旨在取代 WEP；它是一个临时修复方案，直到新的 802.11i\
  \ 修正案完成。制定新修正案的过程耗时数年，因此 WPA 在市场上站稳了脚跟，至今仍被广泛使用。此外，WPA 可用于大多数设备，而 802.11i 的功能则排除了某些低端硬件。\n\
  \n802.11i 是定义取代 WEP 的加密解决方案的修正案。然而，当 802.11i 最终确定时，WPA 解决方案已被广泛使用，因此他们无法按原计划使用 WPA\
  \ 名称；因此它被命名为 WPA2。但这并不表示 802.11i 是 WPA 的第二个版本。事实上，它们是两套完全不同的技术。802.11i（即 WPA2）实现了类似于\
  \ IPSec 的概念，为无线通信带来了迄今为止最好的加密和安全性。\n\nWi-Fi Protected Access 基于 LEAP 和临时密钥完整性协议（TKIP）密码系统，并通常采用秘密口令进行身份验证。不幸的是，使用单一静态口令是\
  \ WPA 的致命弱点。攻击者只需对 WPA 网络运行暴力猜测攻击即可发现口令。如果口令长达 14 个字符或更多，这通常是一个耗时过长以至于不可行的尝试，但并非不可能。此外，WPA\
  \ 的 LEAP 和 TKIP 两种加密选项现在均可通过多种破解技术被破解。虽然比攻破 WEP 更复杂，但 WPA 不再提供长期可靠的安全性。\n\n####\
  \ WPA2\n\n最终，一种新的无线安全保护方法被开发出来，至今仍普遍被认为是安全的。这就是称为 *802.11i* 或 *Wi-Fi Protected Access\
  \ 2 (WPA2)* 的修正案。它是一种称为 *Counter Mode Cipher Block Chaining Message Authentication\
  \ Code Protocol (CCMP)* 的新加密方案，基于 AES 加密方案。2017 年底，一种称为 KRACK（密钥重装攻击）的攻击概念被披露，它能破坏客户端与\
  \ WAP 之间最初的四次握手，迫使其重用先前使用的密钥，在某些情况下甚至使用仅由零组成的密钥。大多数易受攻击的无线设备已更新或有可用更新来解决此问题。更多信息请见\
  \ [`www.krackattacks.com/`](https://www.krackattacks.com/)。\n\n#### 802.1X/EAP\n\
  \nWPA 和 WPA2 均支持称为 *802.1X/EAP* 的企业级身份验证，这是一种基于端口的标准网络访问控制，确保客户端在完成适当身份验证之前无法与资源通信。实际上，802.1X\
  \ 是一种移交系统，允许无线网络利用现有网络基础设施的身份验证服务。通过使用 802.1X，远程认证拨入用户服务（RADIUS）、终端访问控制器访问控制系统（TACACS）、证书、智能卡、令牌设备和生物识别等其他技术和解决方案可集成到无线网络中，提供相互认证和多因素认证的技术。\n\
  \n*可扩展认证协议 (EAP)* 不是一种特定的认证机制；而是一个认证框架。实际上，EAP 允许新的认证技术与现有的无线或点对点连接技术兼容。超过 40 种不同的\
  \ EAP 认证方法被广泛支持。这些包括 LEAP、EAP-TLS、EAP-SIM、EAP-AKA 和 EAP-TTLS 等无线方法。并非所有 EAP 方法都是安全的。例如，EAP-MD5\
  \ 和一种称为 LEAP 的预发布 EAP 也可被破解。\n\n#### PEAP\n\n*受保护的可扩展认证协议 (PEAP)* 将 EAP 方法封装在一个提供认证和潜在加密的\
  \ TLS 隧道中。由于 EAP 最初设计用于物理隔离的信道，因此假设路径是安全的，EAP 通常不加密。因此 PEAP 可以为 EAP 方法提供加密。\n\n\
  #### LEAP\n\n*轻量级可扩展认证协议 (LEAP)* 是思科专有的 WPA 替代方案，用于替代 TKIP。这是在 802.11i/WPA2 系统被批准为标准之前，为解决\
  \ TKIP 的缺陷而开发的。2004 年发布了一款名为 Asleap 的攻击工具，可利用 LEAP 提供的最终薄弱保护。应尽可能避免使用 LEAP；建议改用\
  \ EAP-TLS 作为替代，但如果必须使用 LEAP，强烈建议使用复杂密码。\n\n#### MAC 过滤\n\n*MAC 过滤* 是授权无线客户端接口 MAC\
  \ 地址的列表，由无线接入点用于阻止所有未授权设备的访问。虽然是一个有用的功能，但管理起来可能比较困难，且倾向于仅用于小型、静态环境。此外，拥有基本无线黑客工具的黑客可以发现有效客户端的\
  \ MAC 地址，然后将该地址伪造到他们的攻击无线客户端上。\n\n#### TKIP\n\n*临时密钥完整性协议 (TKIP)* 旨在取代 WEP，且无需更换传统无线硬件。TKIP\
  \ 在 WPA（Wi-Fi Protected Access）名称下被实施到 802.11 无线网络中。TKIP 的改进包括：一个密钥混合功能，在将初始化向量（IV）（即随机数）与秘密根密钥结合后，再将该密钥与\
  \ RC4 配合使用以执行加密；使用序列计数器防止数据包重放攻击；以及使用一个名为 Michael 的强完整性检查。\n\nTKIP 和 WPA 于 2004\
  \ 年正式被 WPA2 取代。此外，针对 WPA 和 TKIP 的特定攻击（即 coWPAtty 和基于 GPU 的破解工具）已使 WPA 的安全性变得不可靠。\n\
  \n#### CCMP\n\nCCMP（带有密码分组链接消息认证码协议的计数器模式）被创建用于取代 WEP 和 TKIP/WPA。CCMP 使用带有 128 位密钥的\
  \ AES（高级加密标准）。CCMP 是 802.11i 指定的 802.11 无线网络的首选标准安全协议。迄今为止，尚无成功针对 AES/CCMP 加密的攻击。\n\
  \n### 确定天线放置位置\n\n部署无线网络时，天线放置位置应是一个考虑因素。在进行适当的现场勘测之前，不要固守特定位置。将无线接入点及/或其天线放置在一个可能的位置；然后测试不同位置的信号强度和连接质量。只有在确认潜在的天线放置位置提供令人满意的连接性后，才应将其固定下来。\n\
  \n寻求最佳天线放置位置时，请考虑以下准则：\n\n- 使用中心位置。\n- 避免实体物理障碍物。\n- 避免反射性或其他平坦金属表面。\n- 避免电气设备。\n\
  \n如果基站具有外置全向天线，通常应将其垂直向上放置。如果使用定向天线，将焦点指向期望使用的区域。请记住，无线信号会受到干扰、距离和障碍物的影响。在设计安全无线网络时，工程师可能会选择定向天线，以避免在不希望提供信号的区域进行广播，或用更强的信号专门覆盖某个区域。\n\
  \n### 天线类型\n\n无线客户端和基站可使用多种天线类型。许多设备可将其标准天线替换为更强（即增强信号）的天线。\n\n标准的直杆或极化天线是*全向天线*，可在垂直于天线本身线路的所有方向上发送和接收信号。这是大多数基站和某些客户端设备上常见的天线类型。这种天线有时也称为基站天线或胶棒天线（因为大多数都覆盖着柔性橡胶涂层）。\n\
  \n\n\n\n\n### 无线天线与安全\n\n大多数其他类型的天线是定向的，意味着它们将发送和接收能力集中在一个主要方向上。`定向天线` 的一些示例包括八木天线、罐头天线、面板天线和抛物面天线。八木天线的结构类似于传统的屋顶电视天线。八木天线由一根带有横截面的直杆制成，用于捕捉主杆方向上的特定无线电频率。罐头天线由一端密封的管子制成。它们沿着管子开口端的方向聚焦。最早的一些罐头天线是用\
  \ Pringles 薯片罐制作的。面板天线是扁平设备，仅从面板的一侧聚焦。抛物面天线用于聚焦来自极远距离或微弱信号源的信号。\n\n#### 调整功率电平控制\n\
  \n某些无线接入点提供物理或逻辑方式的天线功率电平调整。功率电平控制通常由制造商设置为适合大多数情况的设置。然而，如果在执行现场勘测和调整天线位置后，无线信号仍然不令人满意，则可能需要进行功率电平调整。但请记住，更改信道、避开反射面和信号散射面以及减少干扰，在提高连接可靠性方面通常更为重要。\n\
  \n调整功率电平时，应进行微调，而不是试图将设置最大化或最小化。此外，请记下初始/默认设置，以便需要时可以恢复到该设置。每次调整功率电平后，在重新执行现场勘测和质量测试之前，请重置/重启无线接入点。有时降低功率电平可以提高性能。重要的是要记住，某些无线接入点能够提供高于其销售国家/地区法规允许的功率电平。\n\
  \n#### WPS\n\n`Wi-Fi Protected Setup (WPS)` 是无线网络的安全标准。其目的是简化将新客户端添加到安全性良好的无线网络所涉及的工作。它通过在管理员按下基站上的\
  \ WPS 按钮触发该功能后，自动将第一个寻找网络的新无线客户端连接到网络来运作。然而，该标准还要求提供一个代码或个人识别号 (PIN)，该代码或 PIN 可以远程发送到基站，以触发\
  \ WPS 协商，而无需物理按下按钮。这导致了一种暴力猜测攻击，黑客可在数小时内（通常少于六小时）猜出 WPS 代码，进而将其自己的未授权系统连接到无线网络。\n\
  \nWPS 是大多数无线接入点上默认启用的功能，因为它是设备通过 Wi-Fi 联盟认证的要求。作为以安全为重点的预部署流程的一部分，禁用它非常重要。如果设备不提供关闭\
  \ WPS 的功能（或关闭开关不起作用），请升级或更换基站的固件，或更换整个设备。\n\n通常，请保持 WPS 关闭。每次升级固件时，请再次执行以安全为重点的预部署流程，以确保所有设置（包括\
  \ WPS）均已正确设置。如果您需要向网络添加大量客户端，可以暂时重新启用 WPS —— 只需确保事后立即将其禁用即可。\n\n#### 使用捕获门户\n\n\
  `捕获门户` 是一种身份验证技术，它将新连接的无线 Web 客户端重定向到门户访问控制页面。门户页面可能要求用户输入付款信息、提供登录凭据或输入访问代码。捕获门户还用于向用户显示可接受使用策略、隐私策略和跟踪策略，用户必须同意这些策略才能跨网络进行通信。捕获门户最常位于为公共用途实施的无线网络上，例如酒店、餐厅、酒吧、机场、图书馆等。不过，它们也可用于有线以太网连接。\n\
  \n#### 常规 Wi-Fi 安全程序\n\n基于无线安全和配置选项的详细信息，以下是在部署 Wi-Fi 网络时应遵循的常规指南或程序。这些步骤按考虑和应用/安装的顺序排列。此外，此顺序并不意味着哪个步骤提供更多安全性。例如，使用\
  \ WPA2 是一项真正的安全功能，而禁用 SSID 广播则不是。以下是步骤：\n\n1.  更改默认管理员密码。\n2.  根据您的部署要求，决定是否禁用 SSID\
  \ 广播。\n3.  将 SSID 更改为唯一的名称。\n4.  如果无线客户端池相对较小（通常少于 20 个）且静态，则启用 MAC 地址过滤。\n5.  考虑使用静态\
  \ IP 地址，或配置带有预留的 DHCP（仅适用于小型部署）。\n6.  开启支持的最高形式的身份验证和加密，目前为 WPA2，未来可能是 WPA3（一种正在开发中的新安全模式，截至\
  \ 2018 年初：[`www.networkworld.com/article/3247658/wi-fi/wi-fi-alliance-announces-wpa3-to-secure-modern-networks.html`](https://www.networkworld.com/article/3247658/wi-fi/wi-fi-alliance-announces-wpa3-to-secure-modern-networks.html)）。如果您的设备上没有\
  \ WPA2 或更新/更强的解决方案，则需要获取新的无线设备。\n7.  将无线视为远程访问，并使用 802.1X 管理访问。\n8.  将无线视为外部访问，并使用防火墙将\
  \ WAP 与有线网络隔离。\n9.  将无线视为攻击者的入口点，并使用入侵检测系统 (IDS) 监控所有 WAP 到有线网络的通信。\n10. 要求无线客户端与\
  \ WAP 之间的所有传输均经过加密；换句话说，要求建立 VPN 链路。\n\n#### 无线攻击\n\n无线通信是网络、连接、通信和数据交换技术领域快速扩张的领域。成千上万种协议、标准和技术可被标记为无线。这些包括手机、蓝牙、无绳电话和无线网络。随着无线技术的持续普及，您组织的安全必须超越锁定其本地网络。安全应是一种端到端的解决方案，解决所有形式、方法和技术的通信问题。\n\
  \n无线网络已成为企业和家庭网络的常态。为可靠访问和安全性而妥善管理无线网络并不总是一件简单的事。即使存在无线安全措施，无线攻击仍可能发生。针对网络的攻击种类日益增多，其中许多对有线和无线环境均有效。少数攻击专门针对无线网络。本节探讨各种无线安全问题。\n\
  \n##### 战争驾驶\n\n`战争驾驶` 是使用检测工具寻找无线网络信号的行为。通常，战争驾驶指某人寻找其未获授权访问的无线网络。从某种意义上说，战争驾驶是为可能恶意或至少未经授权的目的执行现场勘测。该名称源于遗留的攻击概念“战争拨号”，后者用于通过拨打某区号或前缀下的所有号码来发现活动的计算机调制解调器。\n\
  \n战争驾驶可使用专用手持探测器、具有 Wi-Fi 功能的 `个人电子设备 (PED) 或移动设备`，或装有无线网卡的笔记本电脑来执行。它可以使用操作系统的原生功能或使用专用扫描和检测工具来执行。\n\
  \n\n\n\n\n### 无线网络安全威胁\n\n一旦检测到无线网络，下一步就是确定该网络是开放的还是封闭的。开放网络对可连接的设备没有技术限制，而封闭网络则有技术限制以防止未授权的连接。如果网络是封闭的，攻击者可能会尝试猜测或破解阻止连接的技术。通常，使无线网络封闭（或至少隐藏）的设置是禁用服务集标识符（SSID）广播。使用无线\
  \ SSID 扫描器即可轻松绕过此限制。之后，黑客会确定是否使用了加密、加密类型是什么以及是否可以被破解。随后，攻击者可以获取专用破解工具，尝试闯入连接或尝试实施中间人攻击。你的保护措施越陈旧、越薄弱，此类攻击成功的速度就越快、可能性就越大。\n\
  \n#### 战争粉笔标记\n\n*战争粉笔标记* 是一种极客涂鸦，一些无线黑客在无线技术的早期（1997–2002 年）曾使用过。这是一种用信息在物理上标记区域以指示无线网络存在的方式。一个闭合的圆圈表示封闭或受保护的无线网络，两个背靠背的半圆表示开放网络。战争粉笔标记常被用来向他人透露无线网络的存在，以共享发现的互联网链接。然而，如今互联网连接几乎无处不在，我们大多数人都随身携带联网设备（通常是智能手机），便携式\
  \ Wi-Fi 热点普及，许多零售场所提供免费 Wi-Fi 作为吸引顾客的诱因，因此战争粉笔标记的需求和出现已逐渐消退。当攻击者使用战争拨号来定位要攻破的无线目标时，他们不会用特殊符号标记区域来告知他人其意图。\n\
  \n#### 重放\n\n*重放攻击* 是重新传输捕获的通信，企图获得对目标系统的访问权限。与无线环境相关的重放攻击可能仍会集中在初始认证滥用上。然而，存在许多其他无线重放攻击变体。它们包括捕获典型客户端的新连接请求，然后重放该连接请求，以欺骗基站做出响应，仿佛另一个新的客户端连接请求已发起。无线重放攻击也可能专注于\
  \ DoS，通过重新传输基站的连接请求或资源请求，使其忙于管理新连接，而无法维护和为现有连接提供服务。\n\n通过保持基站固件更新以及运行专注于无线的网络入侵检测系统（NIDS），可以缓解无线重放攻击。`W-IDS`\
  \ 或 `W-NIDS` 能够检测此类滥用行为，并及时通知管理员有关情况。\n\n#### IV\n\n*IV* 代表 *初始化向量*，这是一个数学和加密术语，指随机数。大多数现代加密功能使用\
  \ IV 来通过降低可预测性和可重复性来增强安全性。当 IV 太短、以明文交换或选择不当时，它就会成为弱点。因此，IV 攻击是对 IV 处理（或处理不当）方式的利用。破解有线等效保密（WEP）加密就是\
  \ IV 攻击的一个例子。\n\nWEP 是 802.11 无线网络的原始加密选项。它基于 RC4。然而，由于其设计和实现中的错误，WEP 的主要缺陷与其 IV\
  \ 有关。WEP IV 只有 24 位长，且以明文传输。这加上 WEP 不检查数据包新鲜度的事实，使得实时 WEP 破解可在 60 秒内成功（请参阅 Aircrack-ng\
  \ 套件中的 Wesside-ng 工具，网址：[www.aircrack-ng.org](http://www.aircrack-ng.org)）。\n\n\
  #### 非法接入点\n\n站点勘测期间常见的一个安全问题是 *非法无线接入点* 的存在。非法 WAP 可能是员工为方便而私自安装的，也可能是攻击者在外部运行的。\n\
  \n员工私自安装的无线接入点可以连接到任何开放的网络端口。此类未授权接入点通常未配置安全性，或者即使配置了，也未正确配置或符合组织批准的接入点标准。应发现并移除非法无线接入点，以消除进入你原本安全网络的非受管访问路径。\n\
  \n攻击者通常会想方设法进入公司（通过认识的员工、参加公司参观、冒充维修技术人员或早餐卷饼推销员，甚至夜间闯入），以植入非法接入点。非法接入点就位后，攻击者即可从你家门口不远处轻松进入网络。\n\
  \n非法 WAP 也可由攻击者在外部部署，以针对你现有的无线客户端或未来的访问无线客户端。针对现有无线客户端的攻击要求非法 WAP 配置为复制有效 WAP 的\
  \ SSID、MAC 地址和无线信道，尽管功率等级更高。这可能导致保存了无线配置文件的客户端无意中选择或倾向于连接到非法 WAP，而不是有效的原始 WAP。\n\
  \n第二种方法侧重于吸引新的访问无线客户端。这种类型的非法 WAP 通过社会工程学技巧进行配置，将 SSID 设置为一个看起来合法甚至比原始有效无线网络 SSID\
  \ 更优选的替代名称。例如，如果原始 SSID 是“ABCcafe”，则非法 WAP 的 SSID 可能是“ABCcafe-2”、“ABCcafe-LTE”或“ABCcafe-VIP”。非法\
  \ WAP 的 MAC 地址和信道无需克隆原始 WAP。这些替代名称对新访客来说可能看起来像更好的网络选项，从而诱骗他们选择连接到虚假网络，而不是合法网络。\n\
  \n防御非法 WAP 的方法是知晓正确有效的 SSID。组织运行无线 IDS 以监控无线信号中的滥用行为（如新出现的 WAP，尤其是那些使用模仿或相似 SSID\
  \ 和 MAC 值的 WAP）也将大有裨益。\n\n#### 邪恶双胞胎\n\n*邪恶双胞胎* 是一种攻击，黑客操作一个虚假接入点，该接入点将根据客户端设备的连接请求，自动克隆或“双胞胎”某个接入点的身份。每当设备成功连接到无线网络时，它都会在其历史记录中保留一个无线配置文件。这些无线配置文件用于在设备处于相关基站范围内时自动重新连接到网络。每当设备上的无线适配器启用时，它都想连接到网络，因此会向其无线配置文件历史记录中的每个网络发送重新连接请求。这些重新连接请求包含原始基站的\
  \ MAC 地址和网络的 SSID。邪恶双胞胎攻击系统会窃听无线信号以捕获这些重新连接请求。一旦邪恶双胞胎发现重新连接请求，它就会使用这些参数伪造其身份，并向客户端提供明文连接。客户端接受该请求并与虚假的邪恶双胞胎基站建立连接。这使黑客能够通过中间人攻击窃听通信，这可能导致会话劫持、数据篡改、凭证窃取和身份盗窃。\n\
  \n\n\n\n此攻击之所以有效，是因为认证和加密由基站管理，而非由客户端强制执行。因此，即使客户端的无线配置文件包含认证凭据和加密信息，客户端也会接受基站提供的任何类型的连接，包括明文连接。\n\
  \n为了防御邪恶双生攻击，请注意设备连接的无线网络。如果您连接到一个您知道不在附近的网络，这很可能是您正遭受攻击的迹象。请断开连接并前往其他地方获取互联网接入。您还应从历史记录列表中修剪不必要和旧的无线配置文件，以减少攻击者的目标选择。\n\
  \n#### 安全网络组件\n\n互联网承载着无数的信息服务和众多应用程序，包括 Web、电子邮件、FTP、Telnet、新闻组、聊天等。互联网也是恶意人员的温床，他们的主要目标是定位您的计算机并从中提取有价值的数据、利用它发起进一步攻击，或以某种方式破坏它。您应熟悉互联网，并能根据自身的上网经历轻松辨别其利弊。由于互联网的成功和全球普及，其许多技术被改编或集成到了私有业务网络中。这创造了两种新形式的网络段：内部网和外联网。\n\
  \n**内部网** 是一种私有网络，旨在托管互联网上常见的信息服务。依赖外部服务器（即位于公共互联网上的服务器）在内部提供信息服务的网络不被视为内部网。内部网为用户提供对内部服务器上\
  \ Web、电子邮件和其他服务的访问，这些服务器对私有网络外部的任何人均不可访问。\n\n**外联网** 是互联网和内部网的混合体。外联网是组织网络中被隔离的一部分，它对私有网络充当内部网的角色，同时也向公共互联网提供信息服务。外联网通常保留给特定合作伙伴或客户使用。它极少位于公共网络上。面向公众的外联网通常被称为\
  \ **非军事区 (DMZ)** 或边界网络。\n\n网络通常不配置为单一的大型系统集合。通常网络会被分段或细分为较小的组织单元。这些较小的单元、分组、段或子网可用于改善网络的各个方面：\n\
  \n**提升性能** 网络分段可通过组织方案提升性能，即将经常通信的系统置于同一段中，而很少或从不通信的系统置于其他段中。通常会使用路由器来划分广播域，这能显著提高大型网络的性能。\n\
  \n**减少通信问题** 网络分段通常能减少拥塞，并将广播风暴等通信问题限制在网络的各个子区域内。\n\n**提供安全性** 网络分段还可通过隔离流量和用户访问权限（仅限其被授权的段）来提高安全性。\n\
  \n段可通过基于交换机的 VLAN、路由器或防火墙单独或组合创建。私有 LAN 或内部网、DMZ 和外联网都是网络段的类型。\n\n在设计安全网络（无论是私有网络、内部网还是外联网）时，您必须评估众多网络设备。并非所有这些组件对安全网络都是必需的，但它们都是可能影响网络安全的常见网络设备。\n\
  \n##### 网络访问控制\n\n**网络访问控制 (NAC)** 是一种通过严格遵守和实施安全策略来控制对环境访问的概念。NAC 的目标如下：\n\n* \
  \  防止/减少零日攻击\n*   在整个网络中强制执行安全策略\n*   使用身份标识执行访问控制\n\n可通过使用强大且详细的安全策略来实现 NAC 目标，这些策略定义了从客户端到服务器的每个设备，以及每个内部或外部通信的所有安全控制、过滤、预防、检测和响应方面。NAC\
  \ 充当自动检测和响应系统，能实时做出反应，在威胁发生时及在其造成损害或泄露之前将其阻止。\n\n最初，`802.1X`（提供基于端口的 NAC）被认为体现了\
  \ NAC，但大多数支持者认为 `802.1X` 只是 NAC 的一种简单形式，或是完整 NAC 解决方案中的一个组件。\n\nNAC 可采用准入前理念、准入后理念，或两者结合的方式实施：\n\
  \n*   **准入前理念** 要求系统在被允许与网络通信前，满足所有当前的安全要求（如补丁应用和防病毒更新）。\n*   **准入后理念** 根据用户活动允许或拒绝访问，该活动基于预定义的授权矩阵。\n\
  \n围绕 NAC 的其他问题包括客户端/系统代理与整体网络监控（无代理）；带外与带内监控；以及解决任何补救、隔离或强制门户策略。这些及其他 NAC 顾虑必须在实施前予以考虑和评估。\n\
  \n#### 防火墙\n\n**防火墙** 是管理和控制网络流量的重要工具。防火墙是一种用于过滤流量的网络设备。它通常部署在私有网络和互联网链路之间，但也可部署在组织内部的各部门之间。没有防火墙，就无法阻止来自互联网的恶意流量进入私有网络。防火墙基于一组定义的规则（也称为过滤器或访问控制列表）过滤流量。它们本质上是一组指令，用于区分授权流量与未授权和/或恶意流量。只有授权流量被允许跨越防火墙提供的安全屏障。\n\
  \n防火墙可用于阻止或过滤流量。它们对未请求的流量和来自私有网络外部的连接尝试最为有效，也可基于内容、应用程序、协议、端口或源地址阻止已知的恶意数据、消息或数据包。它们能够向公众隐藏私有网络的结构和寻址方案。大多数防火墙提供广泛的日志记录、审计和监控功能，以及报警和基本的入侵检测系统\
  \ (IDS) 功能。\n\n防火墙通常无法阻止通过其他授权通信通道传输的病毒或恶意代码（即防火墙通常不像防病毒扫描器那样扫描流量），无法防止用户无意或故意泄露信息，无法防止已在防火墙内部的恶意用户发起的攻击，也无法保护数据在传出或传入私有网络后的安全。不过，您可以通过特殊的附加模块或配套产品（如防病毒扫描器和\
  \ IDS 工具）添加这些功能。有些防火墙设备预配置为原生执行所有（或大多数）此类附加功能。\n\n除了记录网络流量活动外，防火墙还应记录以下几类事件：\n\n\
  *   防火墙重启\n*   代理或依赖项无法启动或未启动\n*   代理或其他重要服务崩溃或重启\n*   防火墙配置文件更改\n*   防火墙运行时的配置或系统错误\n\
  \n\n\n\n### 安全解决方案中的防火墙\n\n防火墙只是整体安全解决方案的一部分。有了防火墙，许多安全机制都集中在一个地方，因此防火墙可能成为单点故障。防火墙故障最常见的原因是人为错误和配置错误。防火墙仅为跨越防火墙从一个子网传输到另一个子网的流量提供保护。它们无法为子网内部的流量（换句话说，位于防火墙后面的流量）提供保护。\n\
  \n#### 防火墙的类型\n\n防火墙有几种基本类型，包括静态包过滤防火墙、应用层网关防火墙、电路层网关防火墙和状态检测防火墙。还可以通过将两种或多种防火墙类型组合到单一防火墙解决方案中，来创建混合或复杂的网关防火墙。在大多数情况下，多级防火墙能提供对流量过滤更强的控制。无论如何，我们将介绍各种防火墙类型，并讨论防火墙部署架构：\n\
  \n##### 静态包过滤防火墙\n\n`静态包过滤防火墙`通过检查消息头中的数据来过滤流量。通常，规则涉及源地址、目的地址和端口地址。使用静态过滤时，防火墙无法提供用户身份验证，也无法判断数据包源自内部还是外部私有网络，且容易被欺骗数据包愚弄。静态包过滤防火墙被称为第一代防火墙；它们在\
  \ OSI 模型的第 3 层（网络层）运行。它们也被称为`筛选路由器`。\n\n##### 应用层网关防火墙\n\n`应用层网关防火墙`也称为代理防火墙。`代理`是一种将数据包从一个网络复制到另一个网络的机制；复制过程还会更改源地址和目的地址，以保护内部或私有网络的身份。应用层网关防火墙根据用于传输或接收数据的互联网服务（换句话说，即应用程序）来过滤流量。每种类型的应用程序都必须有其自己独特的代理服务器。因此，应用层网关防火墙由许多单独的代理服务器组成。这种类型的防火墙会对网络性能产生负面影响，因为每个数据包在通过防火墙时都必须被检查和处理。应用层网关被称为第二代防火墙，它们在\
  \ OSI 模型的应用层（第 7 层）运行。\n\n##### 电路层网关防火墙\n\n`电路层网关防火墙`用于在受信任的合作伙伴之间建立通信会话。它们在 OSI\
  \ 模型的会话层（第 5 层）运行。`SOCKS`（源自 `Socket Secure`，即 TCP/IP 端口）是电路层网关防火墙的常见实现。电路层网关防火墙也称为`电路代理`，它们根据电路而非流量内容来管理通信。它们仅根据通信电路的端点标识（即源地址和目的地址以及服务端口号）来允许或拒绝转发决策。电路层网关防火墙被视为第二代防火墙，因为它们代表了应用层网关防火墙概念的一种修改。\n\
  \n##### 状态检测防火墙\n\n`状态检测防火墙`（也称为`动态包过滤防火墙`）评估网络流量的状态或上下文。通过检查源地址和目的地址、应用程序用法、来源以及当前数据包与同一会话中前序数据包之间的关系，状态检测防火墙能够为授权用户和活动授予更广泛的访问权限，并主动监视和阻止未授权用户和活动。状态检测防火墙的运行效率通常高于应用层网关防火墙。它们被称为第三代防火墙，并在\
  \ OSI 模型的网络层和传输层（第 3 层和第 4 层）运行。\n\n##### 深度包检测防火墙\n\n`深度包检测 (DPI) 防火墙`是一种通常在应用层运行的过滤机制，旨在根据通信的有效载荷内容进行过滤，而不仅仅基于头部值。DPI\
  \ 也称为完全包检测和信息提取 (IX)。DPI 过滤能够阻止通信有效载荷中的域名、恶意软件、垃圾邮件或其他可识别元素。DPI 通常与应用层防火墙和/或状态检测防火墙集成。\n\
  \n##### 下一代防火墙\n\n下一代防火墙是一种多功能设备 (MFD)，除防火墙外还包含多种安全功能；集成组件可包括 IDS、入侵防御系统 (IPS)、TLS/SSL\
  \ 代理、Web 过滤、QoS 管理、带宽限制、NAT、VPN 终结和防病毒。\n\n#### 多宿主防火墙\n\n某些防火墙系统拥有多个接口。例如，`多宿主防火墙`必须至少有两个接口来过滤流量（它们也被称为双宿主防火墙）。所有多宿主防火墙都应禁用\
  \ IP 转发，IP 转发会自动将流量发送到另一个接口。这将强制过滤规则控制所有流量，而不是允许一个接口与另一个接口之间通过软件支持的捷径进行通信。`堡垒主机`是一台暴露在互联网上并已加固的计算机或设备，加固方式是移除所有不必要的元素，如服务、程序、协议和端口。`屏蔽主机`是受防火墙保护的系统，在逻辑上位于私有网络内部。所有入站流量都被路由到屏蔽主机，后者反过来充当私有网络内所有受信任系统的代理。它负责过滤进入私有网络的流量，以及保护内部客户端的身份。\n\
  \n屏蔽子网的概念与屏蔽主机类似，不同之处在于子网被置于两个路由器或防火墙之间，而堡垒主机位于该子网内。所有入站流量都被定向到堡垒主机，只有授权流量才能通过第二个路由器/防火墙进入私有网络。这创建了一个子网，允许某些外部访问者与网络提供的资源进行通信。这就是\
  \ DMZ 的概念，DMZ 是一个网络区域（通常是一个子网），设计为允许外部访问者访问，但仍与组织的私有网络隔离。DMZ 通常托管公共 Web、电子邮件、文件和其他资源服务器。\n\
  \n#### 防火墙部署架构\n\n有三种常见的防火墙部署架构：单层、双层和三层（也称为多层）。\n\n正如您在图 11.8 中所见，单层部署将私有网络置于防火墙之后，防火墙再通过路由器连接到互联网（或其他不受信网络）。单层部署仅对通用攻击有用。这种架构仅提供最低限度的保护。\n\
  \n双层部署架构可能采用两种不同的设计之一。一种使用具有三个或更多接口的防火墙。另一种使用两个串联的防火墙。这允许设置 DMZ 或公开可访问的外联网。在第一种设计中，DMZ\
  \ 位于主防火墙的其中一个接口上；而在第二种设计中，DMZ 位于两个串联防火墙之间。DMZ 用于托管外部用户应有权访问的信息服务器系统。防火墙根据其严格的过滤规则将流量路由到\
  \ DMZ 或受信网络。这种架构引入了中等程度的路由和过滤复杂性。\n\n\n\n\n\n![图 11.8 单层、双层和三层防火墙部署架构](img/c11f008.jpg)\n\
  \n**图 11.8** 单层、双层和三层防火墙部署架构\n\n三层部署架构是指在私有网络和互联网之间部署多个由防火墙隔开的子网。每个后续防火墙都有更严格的过滤规则，以将流量限制为仅来自受信任的源。最外层的子网通常是\
  \ DMZ（非军事区）。中间子网可作为事务子网，用于放置支持 DMZ 中复杂 Web 应用程序所需的系统。第三层，即后端子网，可支持私有网络。这种架构是这些选项中最安全的；然而，它也是设计、实施和管理起来最复杂的。\n\
  \n#### 端点安全\n\n*端点安全* 是指每个单独的设备都必须维护本地安全，无论其网络或电信信道是否也提供安全。有时这被表述为“终端设备对其自身的安全负责”。然而，更清晰的观点是，网络中的任何弱点，无论是在边界、服务器还是客户端上，都会给组织内的所有要素带来风险。\n\
  \n传统安全依赖于网络边界哨兵，如设备防火墙、代理、集中式病毒扫描器，甚至 IDS/IPS/IDP 解决方案，来为网络的所有内部节点提供安全。这不再被视为最佳商业实践，因为威胁既来自内部也来自外部。网络的安全性仅取决于其最薄弱的环节。\n\
  \n当远程访问服务（包括拨号、无线和 VPN）可能允许外部实体（无论是否授权）在不经过边界安全关卡的情况下访问私有网络时，缺乏内部安全就显得更加棘手。\n\n\
  因此，端点安全应被视为在每个单独主机上提供充分安全工作的一个方面。每个系统都应具备适当的组合，包括本地主机防火墙、反恶意软件扫描器、认证、授权、审计、垃圾邮件过滤器和\
  \ IDS/IPS 服务。\n\n#### 硬件安全运行\n\n构建网络时，您将使用许多硬件设备。对这些安全网络组件有深入了解，可以帮助您设计避免单点故障并为可用性提供强有力支持的\
  \ IT 基础设施。\n\n以下是网络中的一些硬件设备：\n\n##### 中继器、集线器和放大器\n\n`Repeaters`、`concentrators`\
  \ 和 `amplifiers` 用于增强电缆段上的通信信号，以及连接使用相同协议的网段。这些设备可通过在长距离电缆布线中部署一个或多个中继器，来延长特定电缆类型的最大长度。中继器、集线器和放大器在\
  \ OSI 第 1 层运行。位于中继器、集线器或放大器任一侧的系统属于同一个冲突域和广播域。\n\n##### 集线器\n\n`Hubs` 过去用于连接多个系统，以及连接使用相同协议的网段。集线器是一种多端口中继器。集线器在\
  \ OSI 第 1 层运行。位于集线器任一侧的系统属于同一个冲突域和广播域。这确保了流量将到达其目标主机，但代价是同一冲突域和广播域的所有成员也将收到该通信。大多数组织都有禁止使用集线器的安全策略，以限制或减少嗅探攻击的风险，因为它们是过时的技术，首选交换机。\n\
  \n##### 调制解调器\n\n传统固定电话 `modem`（调制解调器）是一种通信设备，它在模拟载波信号和数字信息之间进行调制或解调，以支持公共交换电话网（PSTN）线路上的计算机通信。从\
  \ 1960 年代左右到 1990 年代中期，调制解调器是广域网通信的常用手段。调制解调器通常已被数字宽带技术取代，包括 ISDN、有线调制解调器、DSL 调制解调器、802.11\
  \ 无线以及各种形式的无线调制解调器。\n\n##### 网桥\n\n`bridge`（网桥）用于将两个网络连接在一起——即使是不同拓扑、布线类型和速度的网络——以连接使用相同协议的网段。网桥将流量从一个网络转发到另一个网络。连接不同传输速度网络的网桥可能具有缓冲区，用于存储数据包，直到它们能被转发到较慢的网络。这被称为\
  \ `store-and-forward`（存储转发）设备。网桥在 OSI 第 2 层运行。位于网桥任一侧的系统属于同一个广播域，但处于不同的冲突域中。\n\n\
  ##### 交换机\n\n您可以考虑使用交换机（或智能集线器）来代替集线器。`Switches`（交换机）知道连接在每个出站端口上的系统的地址。交换机不是在每个出站端口上重复流量，而是仅将流量重复发送到已知目标存在的那个端口。交换机为流量传递提供更高的效率，创建独立的冲突域，并提高数据的整体吞吐量。当用于创建\
  \ VLAN 时，交换机还可以创建独立的广播域。在这样的配置中，广播允许在单个 VLAN 内进行，但不允许无阻碍地从一个 VLAN 跨越到另一个 VLAN。交换机主要在\
  \ OSI 第 2 层运行。当交换机具有路由等附加功能时，它们也可以在 OSI 第 3 层运行（例如在 VLAN 间路由时）。位于第 2 层运行的交换机任一侧的系统属于同一个广播域，但处于不同的冲突域中。位于第\
  \ 3 层运行的交换机任一侧的系统属于不同的广播域和不同的冲突域。交换机用于连接使用相同协议的网段。\n\n##### 路由器\n\n`Routers`（路由器）用于控制网络上的流量，并常用于连接相似的网络和控制它们之间的流量。它们可以使用静态定义的路由表，也可以采用动态路由系统。有许多动态路由协议，如\
  \ RIP、OSPF 和 BGP。路由器在 OSI 第 3 层运行。位于路由器任一侧的系统属于不同的广播域和不同的冲突域。路由器用于连接使用相同协议的网段。\n\
  \n##### 网桥路由器\n\n`Brouters`（网桥路由器）是由路由器和网桥组成的组合设备。网桥路由器首先尝试路由，如果失败，则默认为桥接。因此，网桥路由器主要在第\
  \ 3 层运行，但必要时可在第 2 层运行。位于第 3 层运行的网桥路由器任一侧的系统属于不同的广播域和不同的冲突域。位于第 2 层运行的网桥路由器任一侧的系统属于同一个广播域，但处于不同的冲突域中。网桥路由器用于连接使用相同协议的网段。\n\
  \n##### 网关\n\n`gateway`（网关）连接使用不同网络协议的网络。网关负责通过将流量格式转换为与每个网络使用的协议或传输方法兼容的形式，将流量从一个网络传输到另一个网络。网关也称为\
  \ `protocol translators`（协议转换器），可以是独立的硬件设备，也可以是软件服务（例如 IP 到 IPX 的网关）。位于网关任一侧的系统属于不同的广播域和不同的冲突域。网关用于连接使用不同协议的网段。网关有多种类型，包括数据、邮件、应用、安全和互联网网关。网关通常在\
  \ OSI 第 7 层运行。\n\n\n\n\n\n### 代理\n\n`proxy`（代理）是一种网关形式，它不跨协议进行转换。相反，代理充当网络的中介、过滤器、缓存服务器，甚至是\
  \ NAT/PAT 服务器。代理代表另一个系统执行功能或请求服务，并连接使用相同协议的网段。代理最常用于为私有网络上的客户端提供互联网访问，同时保护客户端的身份。代理接受来自客户端的请求，更改请求者的源地址，维护请求到客户端的映射，并发送更改后的请求数据包。这种机制通常称为网络地址转换（NAT）。收到回复后，代理服务器通过查看其映射来确定该回复是发给哪个客户端的，然后将数据包转发给该客户端。代理两侧的系统属于不同的广播域和不同的冲突域。\n\
  \n### LAN 扩展器\n\n`LAN extender`（局域网扩展器）是一种远程访问、多层交换机，用于通过 WAN 链路连接远程网络。这是一种奇怪的设备，因为它创建的是\
  \ WAN，但该设备的营销人员避而不谈 WAN 这个术语，仅使用 LAN 和扩展 LAN。该设备背后的理念是使术语更易于理解，从而使产品比带有复杂概念和术语的普通\
  \ WAN 设备更容易销售。归根结底，它与 WAN 交换机或 WAN 路由器是同一产品。\n\n### 布线、无线、拓扑、通信和传输介质技术\n\n在网络上建立安全性不仅仅涉及管理操作系统和软件。您还必须解决物理问题，包括布线、无线、拓扑和通信技术。\n\
  \n#### 传输介质\n\n网络中采用的连接介质类型对网络的设计、布局和能力至关重要。如果没有合适的布线或 `transmission media`（传输介质），网络可能无法覆盖整个企业，或者可能无法支持必要的流量。事实上，网络故障（换句话说，可用性违规）最常见的原因是电缆故障或配置错误。重要的是要了解，不同类型的网络设备和技术配合不同类型的布线使用。每种电缆类型都有独特的有效长度、吞吐率和连接要求。\n\
  \n##### 同轴电缆\n\n`Coaxial cable`（同轴电缆），也称为 `coax`，是 20 世纪 70 年代和 80 年代广泛使用的一种流行网络电缆类型。在\
  \ 90 年代初，由于双绞线布线（稍后将详细解释）的普及和能力，其使用迅速减少。在 21 世纪 00 年代，您不太可能遇到将同轴电缆用作网络电缆的情况，但仍可能看到它被用作音频/视频连接线（例如某些有线电视设备或卫星天线设备，尽管从服务设备到电视的最终连接如今最可能是\
  \ HDMI）。\n\n同轴电缆中心有一根铜芯线，外围包裹一层绝缘层，绝缘层外又包裹一层导电编织屏蔽层，最外层是一层绝缘护套。\n\n中心铜芯和编织屏蔽层充当两个独立的导体，从而允许通过同轴电缆进行双向通信。同轴电缆的设计使其对\
  \ `electromagnetic interference (EMI)`（电磁干扰）具有相当强的抵抗力，并能支持高带宽（与同时期的其他技术相比），且提供比双绞线更长的可用长度。它最终未能保持其作为流行网络电缆技术的地位，是因为双绞线的成本低得多且易于安装。同轴电缆需要使用段终端器，而双绞线布线则不需要。同轴电缆更笨重，且最小弧半径比双绞线大。（弧半径是指电缆在损坏内部导体前所能弯曲的最大距离。）此外，随着交换网络的广泛部署，由于实现了分层布线模式，电缆距离的问题变得不再重要。\n\
  \n同轴电缆主要有两种类型：细缆和粗缆。`Thinnet`（细缆），也称为 `10Base2`，通常用于将系统连接到粗缆主干干线。细缆可跨越 185 米的距离，提供高达\
  \ 10 Mbps 的吞吐量。`Thicknet`（粗缆），也称为 `10Base5`，可跨越 500 米，提供高达 10 Mbps（兆比特/秒）的吞吐量。\n\
  \n同轴电缆最常见的问题如下：\n\n*   将同轴电缆弯曲超过其最大弧半径，从而导致中心导体断裂\n*   部署的同轴电缆长度大于其最大推荐长度（10Base2\
  \ 为 185 米，10Base5 为 500 米）\n*   未使用 50 欧姆电阻正确终止同轴电缆的末端\n*   未对终止的同轴电缆至少一端进行接地\n\n\
  ##### 基带和宽带电缆\n\n用于标记大多数网络电缆技术的命名约定遵循 `XXyyyyZZ` 语法。`XX` 表示电缆类型提供的最大速度，例如 10Base2\
  \ 电缆为 10 Mbps。接下来的一系列字母 `yyyy` 表示电缆的基带或宽带特性，例如 10Base2 电缆为基带。`Baseband`（基带）电缆一次只能传输单个信号，而\
  \ `broadband`（宽带）电缆可以同时传输多个信号。大多数网络电缆都是基带电缆。然而，在特定配置下，同轴电缆可用作宽带连接，例如有线调制解调器。`ZZ`\
  \ 要么表示电缆可使用的最大距离，要么作为电缆技术的简写表示，例如 10Base2 电缆约 200 米（实际为 185 米，但向上取整为 200），或 10BaseT\
  \ 或 100BaseTX 中代表双绞线的 T 或 TX。（注意，100BaseTX 使用两根 Cat 5 UTP 或 STP 电缆实现——一根用于接收，另一根用于发送。）\n\
  \n表 11.8 显示了最常见网络布线类型的重要特性。\n\n**表 11.8** **常见网络布线类型的重要特性**\n\n| 类型 | 最大速度 | 距离\
  \ | 安装难度 | 易受 EMI 影响程度 |\n| --- | --- | --- | --- | --- |\n| 10Base2 | 10 Mbps |\
  \ 185 米 | 中 | 中 |\n| 10Base5 | 10 Mbps | 500 米 | 高 | 低 |\n| 10BaseT (UTP) | 10 Mbps\
  \ | 100 米 | 低 | 高 |\n| STP | 155 Mbps | 100 米 | 中 | 中 |\n| 100BaseT/100BaseTX |\
  \ 100 Mbps | 100 米 | 低 | 高 |\n| 1000BaseT | 1 Gbps | 100 米 | 低 | 高 |\n| 光纤 | 2+\
  \ Gbps | 2+ 千米 | 高到中 | 无 |\n\n##### 双绞线\n\n与同轴电缆相比，`Twisted-pair cabling`（双绞线布线）极细且灵活。它由四对相互缠绕的导线组成，外层包裹\
  \ PVC 绝缘护套。如果在外护套下导线周围有一层金属箔包裹层，则称为 `shielded twisted-pair (STP)`（屏蔽双绞线）。该箔层提供额外的保护以抵御外部\
  \ EMI。没有箔层的双绞线布线称为 `unshielded twisted-pair (UTP)`（非屏蔽双绞线）。UTP 最常用于指代 10BaseT、100BaseT\
  \ 或 1000BaseT。\n\n\n\n\n\n组成 UTP 和 STP 的导线是细小、纤细的铜线，它们成对绞合。导线的绞合可防止外部射频以及电和磁干扰，并减少线对之间的串扰。串扰是指由于电流产生的辐射电磁场，导致在一组导线上传输的数据被另一组导线拾取。电缆内的每对导线都以不同的速率绞合（换句话说，即每英寸绞合次数）；因此，在一对导线上传输的信号无法跨越到另一对导线上（至少在同一根电缆内）。绞合越紧密（每英寸绞合次数越多），电缆对内部和外部干扰及串扰的抵抗力就越强，因此吞吐量容量（即更高带宽）也就越大。\n\
  \nUTP 布线有多个类别。这些不同类别是通过使用更紧密的线对绞合、导体质量的差异以及外部屏蔽质量的差异来创建的。表 11.9 显示了最初的 UTP 类别。\n\
  \n**表 11.9** **UTP 类别**\n\n| UTP 类别 | 吞吐量 | 说明 |\n| --- | --- | --- |\n| Cat 1 |\
  \ 仅语音 | 不适用于网络，但可供调制解调器使用 |\n| Cat 2 | 4 Mbps | 不适用于大多数网络；常用于大型机上的主机到终端连接 |\n| Cat\
  \ 3 | 10 Mbps | 主要用于 10BaseT 以太网网络（用于令牌环网络时仅提供 4 Mbps）和电话线缆 |\n| Cat 4 | 16 Mbps\
  \ | 主要用于令牌环网络 |\n| Cat 5 | 100 Mbps | 用于 100BaseTX、FDDI 和 ATM 网络 |\n| Cat 6 | 1,000\
  \ Mbps | 用于高速网络 |\n| Cat 7 | 10 Gbps | 用于 10 千兆位速度网络 |\n\n以下问题是双绞线布线最常见的问题：\n\n\
  *   为高吞吐量网络使用了错误类别的双绞线电缆\n*   部署的双绞线电缆长度超过其建议的最大长度（即 100 米）\n*   在具有显著干扰的环境中使用 UTP\n\
  \n###### 导体\n\n基于导体的网络布线的距离限制源于用作导体的金属的电阻。铜是最常用的导体，是可用的最佳且最便宜的室温导体之一。然而，它仍然阻碍电子流动。这种电阻会导致信号强度和质量随电缆长度而衰减。\n\
  \n为每种电缆类型定义的最大长度表示衰减程度可能开始干扰数据高效传输的临界点。这种信号衰减称为衰减。虽然有时可以使用比额定长度更长的电缆段，但该电缆段上的错误和重传次数将会增加，最终导致网络性能下降。随着传输速度的增加，衰减会更加明显。建议随着传输速度的增加，使用更短的电缆长度。\n\
  \n长电缆长度通常可以通过使用中继器或汇聚器来补充。中继器是一种信号放大设备，非常类似于汽车或家用立体声的放大器。中继器增强传入数据流的信号强度，并通过其第二个端口重新广播。汇聚器执行相同的功能，只是它拥有两个以上的端口。但是，不建议连续使用四个以上的中继器（或集线器）（请参阅侧边栏“5-4-3\
  \ 规则”）。\n\n##### 网络拓扑\n\n计算机和网络设备的物理布局和组织称为网络拓扑。逻辑拓扑是将联网系统分组为受信任的集合体。物理拓扑并不总是与逻辑拓扑相同。网络物理布局有四种基本拓扑：环形、总线型、星型和网状。\n\
  \n**环形拓扑** *环形拓扑*将每个系统作为圆上的点进行连接（请参阅图 11.9）。连接介质充当单向传输环路。同一时间只能有一个系统传输数据。流量管理由令牌执行。令牌是一种数字通行证，它在环路上传递，直到某个系统获取它。持有令牌的系统可以传输数据。数据和令牌被传输到特定目标。随着数据在环路上传输，每个系统检查它是否为数据的预期接收者。如果不是，它传递令牌。如果是，它读取数据。数据接收后，令牌被释放并返回环路继续传输，直到另一个系统获取它。如果环路的任何一个段断裂，环路上的所有通信将停止。某些环形拓扑的实现采用容错机制，例如反方向运行的双环路，以防止单点故障。\n\
  \n![图 11.9 环形拓扑 ](img/c11f009.jpg)\n\n**图 11.9** 环形拓扑\n\n**总线型拓扑** *总线型拓扑*将每个系统连接到一根主干线或骨干电缆。总线上的所有系统可以同时传输数据，这可能导致冲突。冲突发生在两个系统同时传输数据时；信号相互干扰。为避免这种情况，系统采用冲突避免机制，基本上是“监听”当前是否有其他通信发生。如果检测到通信，系统等待片刻再次监听。如果未检测到通信，系统传输其数据。当数据在总线型拓扑上传输时，网络上的所有系统都能收到数据。如果数据未寻址给特定系统，该系统会忽略该数据。总线型拓扑的优点是，如果单个段发生故障，所有其他段上的通信将继续不受中断。然而，中央主干线仍然是一个单点故障。\n\
  \n总线型拓扑有两种类型：线性和树型。线性总线型拓扑采用单根主干线，所有系统直接连接到其上。树型拓扑采用单根主干线，带有可支持多个系统的分支。图 11.10 说明了这两种类型。总线型拓扑如今极少甚至从不使用的主要原因是，它必须在两端进行终端匹配，且任何断开连接都可能导致整个网络瘫痪。\n\
  \n![图 11.10 线性总线型拓扑和树型总线型拓扑 ](img/c11f010.jpg)\n\n**图 11.10** 线性总线型拓扑和树型总线型拓扑\n\n\
  **星型拓扑** *星型拓扑*采用中心连接设备。该设备可以是简单的集线器或交换机。每个系统通过专用段连接到中心集线器（请参阅图 11.11）。如果任何一个段发生故障，其他段可以继续运行。然而，中心集线器是一个单点故障。通常，星型拓扑比其他拓扑使用的布线更少，且使损坏电缆的识别更容易。\n\
  \n逻辑总线和逻辑环可以作为物理星型来实现。以太网是一种基于总线的技术。它可以部署为物理星型，但集线器或交换机设备实际上是一个逻辑总线连接设备。同样，令牌环是一种基于环的技术。它可以使用多站点接入单元\
  \ (MAU) 部署为物理星型。MAU 允许电缆段部署为星型，而在内部，该设备建立逻辑环连接。\n\n![图 11.11 星型拓扑 ](img/c11f011.jpg)\n\
  \n**图 11.11** 星型拓扑\n\n\n\n\n\n### 网格拓扑\n\n**网格拓扑** 使用多条路径将系统连接到其他系统（请参见 图 11.12）。全网格拓扑将每个系统连接到网络上的所有其他系统。部分网格拓扑将许多系统连接到许多其他系统。网格拓扑为系统提供冗余连接，允许多个线段发生故障而不会严重影响连通性。\n\
  \n![图 11.12 网格拓扑](img/c11f012.jpg)\n\n**图 11.12** 网格拓扑\n\n### 无线通信与安全\n\n无线通信是网络、连接、通信和数据交换技术领域中一个快速扩展的领域。有成千上万种协议、标准和技术可被归类为无线技术。这些包括手机、蓝牙、无绳电话和无线网络。随着无线技术的持续普及，贵组织的安全工作必须超越锁定其本地网络的范畴。安全应是一种端到端的解决方案，涵盖所有形式、方法和技术的通信。\n\
  \n#### 通用无线概念\n\n无线通信利用无线电波在一定距离内传输信号。无线电波频谱是有限的；因此，必须对其进行妥善管理，以允许多个同时使用且几乎不产生干扰。无线电频谱通过频率进行测量或区分。频率是特定时间内波振荡次数的度量，使用单位\
  \ **赫兹**，即每秒振荡次数。无线电波的频率范围在 `3 Hz` 到 `300 GHz` 之间。不同频率范围被指定用于特定用途，例如 AM 和 FM 广播、VHF\
  \ 和 UHF 电视等。目前，`900 MHz`、`2.4 GHz` 和 `5 GHz` 频率是无线产品中最常用的，因为它们属于免许可频段。然而，为了管理有限无线电频率的同时使用，开发了若干频谱使用技术。这些包括扩频、FHSS、DSSS\
  \ 和 OFDM。\n\n扩频意味着通信同时发生在多个频率上。因此，消息被分解成多个片段，每个片段同时发送但使用不同的频率。实际上这是一种并行通信，而非串行通信。\n\
  \n**跳频扩频** 是扩频概念的早期实现。然而，它不是以并行方式发送数据，而是在不断改变使用频率的情况下以串行方式传输数据。会使用整个可用频率范围，但一次只使用一个频率。当发送方从一个频率跳变到下一个频率时，接收方必须遵循相同的跳频模式才能接收信号。FHSS\
  \ 的设计初衷是通过不使用单一频率（单一频率可能受到干扰）来帮助最小化干扰。相反，通过不断变换频率，它将干扰降至最低。\n\n**直接序列扩频** 以并行方式同时使用所有可用频率。这比\
  \ FHSS 提供更高的数据吞吐率。DSSS 还使用一种称为扩频码的特殊编码机制，允许接收方即使在信号因干扰而部分失真的情况下也能重建数据。这与 RAID-5\
  \ 的奇偶校验允许重建缺失驱动器上的数据的方式非常相似。\n\n**正交频分复用** 是频率利用的另一种变体。OFDM 采用数字多载波调制方案，允许进行更紧凑的传输。调制后的信号是垂直（正交）的，因此不会相互造成干扰。最终，OFDM\
  \ 所需的频率集合更小（也称为信道带宽），但可以提供更大的数据吞吐量。\n\n#### 手机\n\n手机无线通信是指使用便携设备通过一组特定的无线电波频率，与手机运营商的网络以及其他手机设备或互联网进行交互。手机运营商使用的技术众多且往往令人困惑。一个困惑点在于\
  \ `2G` 和 `3G` 等术语的使用。这些术语并不特指具体技术，而是指手机技术的代际。因此，`1G` 是第一代（主要为模拟），`2G` 是第二代（主要为数字，`3G`\
  \ 和 `4G` 也是如此），以此类推。当系统集成了第二代和第三代技术时，甚至还有 `2.5G` 的说法。表 11.10 试图澄清其中一些令人困惑的问题（这只是技术的部分列表）。\n\
  \n**表 11.10** **移动服务技术**\n\n| 技术 | 代际 |\n| --- | --- |\n| NMT | 1G |\n| AMPS | 1G\
  \ |\n| TACS | 1G |\n| GSM | 2G |\n| iDEN | 2G |\n| TDMA | 2G |\n| CDMA | 2G |\n\
  | PDC | 2G |\n| HSCSD | 2.5G |\n| GPRS | 2.5G |\n| W-CDMA | 3G |\n| TD-CDMA | 3G\
  \ |\n| UWC | 3G |\n| EDGE | 3G |\n| DECT | 3G |\n| UMTS | 3G |\n| HSPDA | 3.5G |\n\
  | WiMax – IEEE 802.16 | 4G |\n| XOHM (WiMax 品牌名) | 4G |\n| 移动宽带 – IEEE 802.20 |\
  \ 4G |\n| LTE (长期演进) | 4G |\n| 使用毫米波频段（28、38 和 60 GHz）的 4G/IMT-Advanced 标准 | 5G\
  \ |\n\n表中列出的某些技术被标记并作为 `4G` 进行营销，但实际上并不满足被归类为 `4G` 的技术要求。国际电信联盟无线电通信部门 (ITU-R) 于\
  \ 2008 年定义了 `4G` 的要求，但在 2010 年默许运营商可以将其不合规的技术称为 `4G`，前提是这些技术能通向未来的合规服务。`5G` 技术正在开发中，2018\
  \ 年已部署了一些测试网络。\n\n关于手机无线传输，有几个关键问题需要牢记。首先，并非所有手机流量都是语音；手机系统常被用来传输文本甚至计算机数据。其次，通过手机运营商网络进行的通信，无论是语音、文本还是数据，不一定是安全的。第三，利用特定的无线嗅探设备，您的手机传输可能被拦截。事实上，您运营商的基站可以被模拟以实施中间人攻击。第四，使用手机连接访问互联网或办公网络，为攻击者提供了另一条潜在的攻击、访问和入侵途径。许多此类设备可能充当网桥，从而在您的网络中创建不安全的入口。\n\
  \n#### 蓝牙 (802.15)\n\n\n\n\n\n### Bluetooth、IEEE 802.15 和个人区域网络 (PAN)\n\n*Bluetooth*（即\
  \ *IEEE 802.15* *个人区域网络 (PAN)*）是无线安全关注的另一个领域。手机耳机、鼠标、键盘、全球定位系统 (GPS) 设备以及许多其他接口设备和外设均通过\
  \ Bluetooth 连接。这些连接中的许多都是使用一种称为配对的技术建立的，主设备会扫描 2.4 GHz 射频以寻找可用设备，一旦发现设备，即使用四位数 PIN\
  \ 码来“授权”配对。此过程确实减少了意外配对的数量；然而，四位数 PIN 码并不安全（更不用说默认 PIN 码通常是 `0000`）。此外，针对支持 Bluetooth\
  \ 设备的攻击也存在。其中一种技术称为蓝杰克攻击 (*bluejacking*)，允许攻击者向您的设备传输类似短消息服务 (SMS) 的消息。蓝牙窃取 (*Bluesnarfing*)\
  \ 允许黑客在您不知情的情况下连接您的 Bluetooth 设备并从中提取信息。这种攻击形式可让攻击者访问您的联系人列表、数据，甚至您的通话内容。蓝牙漏洞攻击\
  \ (*Bluebugging*) 是一种授予黑客对 Bluetooth 设备功能和特性远程控制权的攻击。这可能包括开启麦克风，将手机用作音频窃听器的能力。幸运的是，Bluetooth\
  \ 通常具有 30 英尺的有限范围，但某些设备的功能范围可达 100 米以上。Bluetooth 收发器和天线按其最大允许功率分类。类别如 表 11.11 所示。\n\
  \n#### 表 11.11 Bluetooth 设备类别\n\n| 类别 | 最大允许功率 | 典型范围 |\n| --- | --- | --- |\n|\
  \ 1 | 100 mW | 100 m |\n| 2 | 2.5 mW | 10 m |\n| 3 | 1 mW | 1 m |\n| 4 | 0.5 mW\
  \ | 0.5 m |\n\nBluetooth 设备有时会采用加密，但这种加密不是动态的，通常只需付出适度的努力即可破解。请将 Bluetooth 用于非敏感或非机密的活动。只要可能，请更改设备上的默认\
  \ PIN 码。不要让设备处于发现模式，并在不主动使用时始终关闭 Bluetooth。\n\n#### RFID\n\n*射频识别 (RFID)* 是一种跟踪技术，基于当天线置于磁场中时产生的电流为无线电发射器供电的能力。RFID\
  \ 可以在相当远的距离（通常为数百米）外被触发/供电并读取。RFID 可以附着在设备上或集成到其结构中，例如笔记本电脑、平板电脑、路由器、交换机、USB 闪存驱动器、便携式硬盘驱动器等。这使得在无需直接物理接近设备的情况下即可快速进行库存跟踪。只需携带\
  \ RFID 读取器走进房间，即可收集该区域内激活芯片传输的信息。\n\n有人担心 RFID 可能是一种侵犯隐私的技术。如果您持有带有 RFID 芯片的设备，则任何持有\
  \ RFID 读取器的人都可以记录您芯片的信号。当 RFID 芯片被唤醒或响应靠近读取器时，芯片（也称为 RFID 标签）会传输唯一代码或序列号。如果没有将该号码与特定对象（或人员）关联的相应数据库，该唯一号码毫无意义。然而，如果在读取器检测到您的\
  \ RFID 芯片代码时，您被记录为现场唯一的人员，则他们可以将您和/或您的设备与该代码关联，以便在未来所有对该相同代码的检测中进行识别。\n\n#### NFC\n\
  \n*近场通信 (NFC)* 是一种标准，用于在极近距离（如几英寸，而被动 RFID 为几英尺）的设备之间建立无线电通信。它通过将设备触碰在一起或将它们置于几英寸范围内，让您执行一种设备间的自动同步和关联。NFC\
  \ 是源自 RFID 的衍生技术，本身也是一种场供电或触发设备。\n\nNFC 通常见于智能手机和许多移动设备配件。它常用于执行设备间数据交换、建立直接通信，或通过\
  \ NFC 与无线接入点链接来访问更复杂的服务（如 WPA2 加密无线网络）。由于 NFC 是一种基于无线电的技术，因此它也存在漏洞。NFC 攻击可能包括中间人攻击、窃听、数据篡改和重放攻击。\n\
  \n#### 无绳电话\n\n无绳电话代表了一个经常被忽视的安全问题。无绳电话设计为使用非授权频段中的任意一个，即 900 MHz、2.4 GHz 或 5 GHz。这三个非授权频段被许多不同类型的设备使用，从无绳电话、婴儿监视器到\
  \ Bluetooth 和无线网络设备。经常被忽视的问题是，由于其信号很少加密，任何人都可以轻松窃听无绳电话上的通话。使用频率扫描仪，任何人都可以监听您的通话。\n\
  \n#### 移动设备\n\n智能手机和其他移动设备随着其与互联网以及企业网络交互能力的增强，呈现出日益增加的安全风险。移动设备通常支持存储卡，可用于将恶意代码偷偷带入组织或将机密数据偷偷带出组织。许多移动设备还支持\
  \ USB 连接，以便与台式机和/或笔记本电脑同步通信和联系人，以及传输文件、文档、音乐、视频等。设备本身通常包含敏感数据，如联系人、短信、电子邮件，甚至笔记和文档。\n\
  \n移动设备的丢失或被盗可能意味着个人和/或企业机密的泄露。\n\n移动设备也正成为黑客和恶意代码的攻击目标。重要的是要将非必要信息保留在便携设备之外，运行防火墙和防病毒产品（如果可用），并保持系统锁定和/或加密（如果可能）。\n\
  \n许多移动设备还支持 USB 连接，以便与台式机和/或笔记本电脑同步通信和联系人，以及传输文件、文档、音乐、视频等。\n\n此外，移动设备也无法免疫窃听。借助合适的复杂设备，大多数移动电话通话都可能被窃听——更不用说任何在\
  \ 15 英尺范围内的人都能听到您的通话内容。应指导员工在公共场所使用移动电话时谨慎讨论内容。\n\n移动设备上提供了广泛的安全功能。然而，支持某项功能并不等同于该功能已正确配置并启用。只有当安全功能生效时，才能获得安全收益。请务必检查允许连接到组织网络的任何设备上所有期望的安全功能是否按预期运行。\n\
  \n有关管理移动设备安全的更多信息，请参阅第 9 章“安全漏洞、威胁和对策”，特别是“评估和缓解移动系统中的漏洞”部分。\n\n### LAN 技术\n\n主要有三种\
  \ LAN 技术：以太网、令牌环和 FDDI。还有少量其他 LAN 技术可用，但它们不如这三种广泛使用。CISSP 考试仅涉及这主要的三种。LAN 技术之间的大多数差异存在于数据链路层及以下。\n\
  \n### 以太网\n\n\n\n\n\n### 以太网\n\n**以太网** 是一种共享介质的局域网技术（也称为广播技术）。这意味着它允许多个设备通过同一介质进行通信，但要求设备轮流通信并执行冲突检测和避免。以太网采用广播域和冲突域。**广播域**\
  \ 是一组系统的物理分组，其中组内的所有系统都会接收到由组内单个系统发送的广播。**广播** 是发送到特定地址的消息，该地址表明所有系统均为预期接收者。\n\n\
  **冲突域** 由一组系统组成，如果两个系统同时传输，则会在这些系统内发生数据冲突。**数据冲突** 发生在两条传输消息试图同时使用网络介质时。它会导致一条或两条消息损坏。\n\
  \n以太网可以支持全双工通信（换句话说，完全双向），通常采用双绞线布线。（最初使用同轴电缆布线。）以太网最常部署在星型或总线拓扑上。以太网基于 IEEE 802.3\
  \ 标准。以太网数据的单个单元称为帧。快速以太网支持 100 Mbps 吞吐量。千兆以太网支持 1,000 Mbps（1 Gbps）吞吐量。10 千兆以太网支持\
  \ 10,000 Mbps（10 Gbps）吞吐量。\n\n#### 令牌环\n\n**令牌环** 采用令牌传递机制来控制哪些系统可以通过网络介质传输数据。令牌在局域网的所有成员之间按逻辑环路传输。令牌环可用于环型或星型网络拓扑。由于其性能限制、比以太网成本更高以及部署和管理难度增加，如今很少使用。十多年来，大多数网络中都未见令牌环的踪影。\n\
  \n令牌环可以使用 **多站点接入单元 (MAU)** 部署为物理星型。MAU 允许将电缆段部署为星型，而在内部，该设备建立逻辑环连接。\n\n#### 光纤分布式数据接口\
  \ (FDDI)\n\n**光纤分布式数据接口 (FDDI)** 是一种高速令牌传递技术，采用两个环，数据流在其中以相反方向流动。FDDI 常用作大型企业网络的骨干。其双环设计允许通过从环路中移除故障段并利用剩余的内外环段创建单个环路来实现自愈。FDDI\
  \ 成本高昂，但在快速以太网和千兆以太网开发之前，常用于校园环境。一种成本较低、距离受限且速度较慢的版本称为 **铜缆分布式数据接口 (CDDI)**，使用双绞线电缆。CDDI\
  \ 也更容易受到干扰和窃听。\n\n#### 子技术\n\n大多数网络由多种技术组成，而非单一技术。例如，以太网不仅仅是一项单一技术，而是支持其通用且预期的活动和行为的子技术的超集。以太网包含数字通信、同步通信和基带通信技术，并支持广播、组播和单播通信以及\
  \ **带冲突检测的载波侦听多路访问 (CSMA/CD)**。许多局域网技术（如以太网、令牌环和 FDDI）可能包含以下各节所述的许多子技术。\n\n#####\
  \ 模拟与数字\n\n许多形式的网络通信共有的一种子技术是用于通过物理介质（如电缆）实际传输信号的机制。主要有两种类型：模拟和数字。\n\n*   **模拟通信**\
  \ 通过频率、振幅、相位、电压等不断变化的连续信号进行。连续信号的这些变化产生波形（与数字信号的方波形状相反）。实际通信是通过恒定信号的变化来实现的。\n\n\
  *   **数字通信** 通过不连续的电信号和状态变化或开-关脉冲进行。\n\n与模拟信号相比，数字信号在长距离传输或存在干扰时更可靠。这是因为数字信号采用直流电压的明确信息存储方法，有电压代表值\
  \ 1，无电压代表值 0。这些开-关脉冲产生二进制数据流。模拟信号因长距离衰减和干扰而发生改变和损坏。由于模拟信号可用于信号编码的变化无限多，而数字信号只有两种状态，因此随着退化加剧，对信号的意外改动会使数据提取变得更加困难。\n\
  \n##### 同步与异步\n\n某些通信通过某种时钟或定时活动进行同步。通信要么是同步的，要么是异步的：\n\n*   **同步通信** 依赖基于独立时钟或嵌入数据流中的时间戳的定时或时钟机制。同步通信通常能够支持极高的数据传输速率。\n\
  \n*   **异步通信** 依赖停止和起始定界位来管理数据传输。由于使用定界位及其传输的停止和起始特性，异步通信最适合少量数据。公共交换电话网 (PSTN)\
  \ 调制解调器是异步通信设备的典型例子。\n\n##### 基带与宽带\n\n电缆段上可同时进行多少通信，取决于您使用的是基带技术还是宽带技术：\n\n*  \
  \ **基带技术** 仅支持单个通信信道。它使用施加在电缆上的直流电流。较高电平的电流代表二进制信号 1，较低电平的电流代表二进制信号 0。基带是一种数字信号形式。以太网是一种基带技术。\n\
  \n*   **宽带技术** 可支持多个同时进行的信号。宽带使用调频来支持多个信道，每个信道支持一个独立的通信会话。宽带适用于高吞吐率，特别是当多个信道被复用时。宽带是一种模拟信号形式。有线电视和有线调制解调器、ISDN、DSL、T1\
  \ 和 T3 是宽带技术的例子。\n\n##### 广播、组播和单播\n\n广播、组播和单播技术决定了单次传输可以到达多少个目的地：\n\n*   **广播**\
  \ 技术支持与所有可能接收者的通信。\n\n*   **组播** 技术支持与多个特定接收者的通信。\n\n*   **单播** 技术仅支持与特定单个接收者的通信。\n\
  \n##### 局域网介质访问\n\n至少有五种局域网介质访问技术用于避免或防止传输冲突。这些技术定义了同一冲突域内的多个系统如何进行通信。其中一些技术主动防止冲突，而另一些则响应冲突。\n\
  \n###### 载波侦听多路访问 (CSMA)\n\n这是一种局域网介质访问技术，通过以下步骤执行通信：\n\n1.  主机监听局域网介质以确定其是否正在被使用。\n\
  2.  如果局域网介质未被使用，主机发送其通信。\n3.  主机等待确认。\n4.  如果在超时期间未收到确认，主机返回步骤 1 重新开始。\n\nCSMA 不直接处理冲突。如果发生冲突，通信将不成功，因此不会收到确认。这导致发送系统重新传输数据并再次执行\
  \ CSMA 过程。\n\n\n\n\n\n### 带冲突避免的载波侦听多路访问 (CSMA/CA)\n\n这是一种 LAN 媒体访问技术，通过以下步骤执行通信：\n\
  \n1.  主机与 LAN 媒体有两个连接：入站和出站。主机在入站连接上监听以确定 LAN 媒体是否正在使用。\n2.  如果 LAN 媒体未被使用，主机请求传输许可。\n\
  3.  如果在超时期限后未授予许可，主机返回步骤 1 重新开始。\n4.  如果获得许可，主机通过出站连接传输其通信。\n5.  主机等待确认。\n6.  如果在超时期限后未收到确认，主机返回步骤\
  \ 1 重新开始。\n\nAppleTalk 和 802.11 无线网络是采用 `CSMA/CA` 技术的网络示例。`CSMA/CA` 通过在任何给定时间仅授予单个通信许可来尝试避免冲突。该系统需要指定一个主系统或主系统，它响应请求并授予发送数据传输的许可。\n\
  \n### 带冲突检测的载波侦听多路访问 (CSMA/CD)\n\n这是一种 LAN 媒体访问技术，通过以下步骤执行通信：\n\n1.  主机监听 LAN 媒体以确定其是否正在使用。\n\
  2.  如果 LAN 媒体未被使用，主机传输其通信。\n3.  传输时，主机监听冲突（即两个或多个主机同时传输）。\n4.  如果检测到冲突，主机发送干扰信号。\n\
  5.  如果收到干扰信号，所有主机停止传输。每个主机等待一段随机时间，然后返回步骤 1 重新开始。\n\n以太网网络采用 `CSMA/CD` 技术。`CSMA/CD`\
  \ 通过让冲突域中的每个成员在重新开始该过程前等待一段短暂但随机的时间来响应冲突。不幸的是，允许冲突发生然后响应或反应冲突会导致传输延迟以及所需的重复传输。这导致潜在吞吐量约\
  \ 40% 的损失。\n\n### 令牌传递\n\n这是一种使用数字令牌执行通信的 LAN 媒体访问技术。拥有令牌允许主机传输数据。传输完成后，它将令牌释放给下一个系统。令牌传递用于令牌环网络，例如\
  \ `FDDI`。令牌环通过仅允许拥有令牌的系统传输数据来防止冲突。\n\n### 轮询\n\n这是一种使用主从配置执行通信的 LAN 媒体访问技术。一个系统被标记为主系统。所有其他系统被标记为从系统。主系统依次轮询或询问每个从系统它们是否有传输数据的需求。如果从系统表明有需求，则授予其传输许可。传输完成后，主系统继续轮询下一个从系统。同步数据链路控制（`SDLC`）使用轮询。\n\
  \n轮询通过尝试使用许可系统防止冲突来解决冲突问题。轮询是 `CSMA/CA` 方法的逆过程。两者都使用主从（或主和从）系统，但 `CSMA/CA` 允许从系统请求许可，而轮询由主系统提供许可。轮询可配置为授予一个（或多个）系统优于其他系统的优先级。例如，如果标准轮询模式是\
  \ 1, 2, 3, 4，则要给系统 1 优先级，轮询模式可更改为 1, 2, 1, 3, 1, 4。\n\n### 总结\n\n设计、部署和维护网络安全的任务需要对网络中涉及的技术有深入了解。这包括协议、服务、通信机制、拓扑、布线、端点和网络设备。\n\
  \n`OSI` 模型是评估所有协议的标准。理解 `OSI` 模型如何使用以及如何应用于实际协议，可以帮助系统设计人员和系统管理员提高安全性。`TCP/IP` 模型直接源自该协议，大致映射到\
  \ `OSI` 模型。\n\n大多数网络采用 `TCP/IP` 作为主要协议。然而，在 `TCP/IP` 网络中可以找到许多子协议、支持协议、服务和安全机制。对这些实体的基本了解有助于您设计和部署安全网络。\n\
  \n除了路由器、集线器、交换机、中继器、网关和代理外，防火墙也是网络安全的重要组成部分。防火墙有几种类型：静态包过滤、应用层网关、电路级网关、状态检测、深度包检测和下一代。\n\
  \n汇聚协议在现代网络中很常见，包括 `FCoE`、`MPLS`、`VoIP` 和 `iSCSI`。软件定义网络和内容分发网络扩展了网络的定义以及其用例。可使用各种硬件组件构建网络，其中不乏将所有设备连接在一起的布线。了解每种布线类型的优缺点是设计安全网络的一部分。\n\
  \n无线通信以多种形式发生，包括蜂窝电话、蓝牙（`802.15`）、`RFID`、`NFC` 和网络（`802.11`）。无线通信更容易受到干扰、窃听、拒绝服务和中间人攻击。\n\
  \n最常见的 LAN 技术是以太网。还有几种常见的网络拓扑：环形、总线、星形和网状。\n\n### 考试要点\n\n#### 了解 OSI 模型层及每层所在的协议\n\
  \n`OSI` 模型的七层及每层支持的协议如下：\n\n*   **应用层**：`HTTP`、`FTP`、`LPD`、`SMTP`、`Telnet`、`TFTP`、`EDI`、`POP3`、`IMAP`、`SNMP`、`NNTP`、`S-RPC`\
  \ 和 `SET`\n*   **表示层**：加密协议和格式类型，如 `ASCII`、`EBCDICM`、`TIFF`、`JPEG`、`MPEG` 和 `MIDI`\n\
  *   **会话层**：`NFS`、`SQL` 和 `RPC`\n*   **传输层**：`SPX`、`SSL`、`TLS`、`TCP` 和 `UDP`\n*\
  \   **网络层**：`ICMP`、`RIP`、`OSPF`、`BGP`、`IGMP`、`IP`、`IPSec`、`IPX`、`NAT` 和 `SKIP`\n\
  *   **数据链路层**：`SLIP`、`PPP`、`ARP`、`L2F`、`L2TP`、`PPTP`、`FDDI`、`ISDN`\n*   **物理层**：`EIA/TIA-232`、`EIA/TIA-449`、`X.21`、`HSSI`、`SONET`、`V.24`\
  \ 和 `V.35`\n\n#### 透彻了解 TCP/IP\n\n了解 `TCP` 和 `UDP` 的区别；熟悉四个 `TCP/IP` 层（应用层、传输层、网际层和链路层）及其如何对应\
  \ `OSI` 模型。此外，了解知名端口的用法并熟悉子协议。\n\n#### 了解不同的布线类型及其长度和最大吞吐率\n\n这包括 `STP`、`10BaseT`（`UTP`）、`10Base2`（细缆）、`10Base5`（粗缆）、`100BaseT`、`1000BaseT`\
  \ 和光纤。您还应熟悉 `UTP` 1 类到 7 类。\n\n#### 熟悉常见的 LAN 技术\n\n最常见的 LAN 技术是以太网。还应熟悉模拟与数字通信；同步与异步通信；基带与宽带通信；广播、组播和单播通信；`CSMA`、`CSMA/CA`\
  \ 和 `CSMA/CD`；令牌传递；和轮询。\n\n#### 理解安全网络架构和设计\n\n网络安全应考虑 `IP` 和非 `IP` 协议、网络访问控制、使用安全服务和设备、管理多层协议以及实施端点安全。\n\
  \n#### 理解各种网络分段的类型和目的\n\n网络分段可用于管理流量、提高性能和实施安全。网络段或子网的示例包括内联网、外联网和 `DMZ`。\n\n\n\n\
  \n#### 理解不同的无线技术\n手机、蓝牙（802.15）和无线网络（802.11）都被称为无线技术，尽管它们各不相同。请注意它们的差异、优势和劣势。理解保护\
  \ 802.11 网络的基础知识。\n\n#### 理解光纤通道\n光纤通道是一种网络数据存储解决方案（即 SAN（存储区域网络）或 NAS（网络附属存储）），允许高速文件传输。\n\
  \n#### 理解 FCoE\nFCoE（基于以太网的光纤通道）用于在以太网网络上封装光纤通道通信。\n\n#### 理解 iSCSI\niSCSI（互联网小型计算机系统接口）是一种基于\
  \ IP 的网络存储标准。\n\n#### 理解 802.11 及 802.11a、b、g、n 和 ac\n802.11 是无线网络通信的 IEEE 标准。版本包括\
  \ 802.11（2 Mbps）、802.11a（54 Mbps）、802.11b（11 Mbps）、802.11g（54 Mbps）、802.11n（600\
  \ Mbps）和 802.11ac（1.3+ Gbps）。802.11 标准还定义了有线等效隐私（WEP）。\n\n#### 理解现场勘测\n*现场勘测* 是调查特定环境中部署的无线接入点的存在性、强度和覆盖范围的过程。此任务通常涉及携带便携式无线设备走动，记录无线信号强度，并将其绘制在建筑物的平面图或示意图上。\n\
  \n#### 理解 WPA2\nWPA2 是一种新的加密方案，称为带有密码块链消息认证码协议的计数器模式（CCMP），基于 AES 加密方案。\n\n####\
  \ 理解 EAP\nEAP（可扩展认证协议）不是一种特定的认证机制；而是一个认证框架。实际上，EAP 允许新的认证技术与现有的无线或点对点连接技术兼容。\n\n\
  #### 理解 PEAP\nPEAP（受保护的可扩展认证协议）在 TLS 隧道中封装 EAP 方法，该隧道提供认证和潜在的加密。\n\n#### 理解 LEAP\n\
  LEAP（轻量级可扩展认证协议）是思科专有的 TKIP 替代方案，用于 WPA。它的开发是为了在 802.11i/WPA2 系统被批准为标准之前解决 TKIP\
  \ 中的缺陷。\n\n#### 理解 MAC 过滤\nMAC 过滤器是授权无线客户端接口 MAC 地址的列表，无线接入点使用它来阻止所有未授权设备的访问。\n\n\
  #### 理解 SSID 广播\n无线网络传统上会在信标帧（beacon frame）这一特殊数据包中定期广播其 SSID。当广播 SSID 时，任何具有自动检测和连接功能的设备不仅能看到该网络，还能发起与该网络的连接。\n\
  \n#### 理解 TKIP\nTKIP（临时密钥完整性协议）被设计为 WEP 的替代品，且不需要更换传统无线硬件。TKIP 在 802.11 无线网络中以 WPA（Wi-Fi\
  \ Protected Access）的名称实现。\n\n#### 理解 CCMP\nCCMP（带有密码块链消息认证码协议的计数器模式）被创建用于替代 WEP\
  \ 和 TKIP/WPA。CCMP 使用带有 128 位密钥的 AES（高级加密标准）。\n\n#### 理解网络门户\n网络门户是一种认证技术，它将新连接的无线\
  \ Web 客户端重定向到门户访问控制页面。\n\n#### 理解天线类型\n无线客户端和基站可使用多种天线类型。这些包括全向极化天线以及多种定向天线，如八木天线、罐装天线、平板天线和抛物面天线。\n\
  \n#### 了解标准网络拓扑\n标准网络拓扑包括环形、总线形、星形和网状。\n\n#### 了解常见网络设备\n常见网络设备包括防火墙、路由器、集线器、网桥、调制解调器、中继器、交换机、网关和代理。\n\
  \n#### 理解不同类型的防火墙\n防火墙有多种类型：静态包过滤、应用层网关、电路级网关、状态检测、深度包检测和下一代防火墙。\n\n#### 了解用于连接\
  \ LAN 和 WAN 通信技术的协议服务\n这些协议服务包括帧中继、SMDS、X.25、ATM、HSSI、SDLC、HDLC 和 ISDN。\n\n### 书面实验\n\
  \n1.  从上到下列出 OSI 模型各层的名称及其编号。\n2.  列出布线的三个常见问题及应对这些问题的方法。\n3.  无线设备采用哪些技术来最大化利用可用无线电频率？\n\
  4.  讨论用于保护 802.11 无线网络的方法。\n5.  列出 LAN 共享介质访问技术及其使用示例（如已知）。\n\n### 复习题\n\n1.  OSI\
