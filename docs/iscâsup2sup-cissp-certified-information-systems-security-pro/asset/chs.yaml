  \   1. 在给屏幕拍照之前不要关闭计算机。\n   2. 列出收集证据时在场的所有人员。\n\n\n\n\n\n### 第 20 章：软件开发安全\n\n\
  ## 本章涵盖的 CISSP 考试主题\n\n**领域 8：软件开发安全**\n\n*   8.1 理解并在软件开发生命周期 (SDLC) 中集成安全\n  \
  \  *   8.1.1 开发方法论\n    *   8.1.2 成熟度模型\n    *   8.1.3 运行与维护\n    *   8.1.4 变更管理\n\
  \    *   8.1.5 集成产品团队\n*   8.2 识别并在开发环境中应用安全控制\n    *   8.2.1 软件环境的安全\n    *   8.2.2\
  \ 作为安全编码一个方面的配置管理\n    *   8.2.3 代码仓库的安全\n*   8.3 评估软件安全的有效性\n    *   8.3.1 变更的审计与日志记录\n\
  \    *   8.3.2 风险分析与缓解\n*   8.4 评估获取软件的安全影响\n*   8.5 定义并应用安全编码指南和标准\n    *   8.5.2\
  \ 应用程序编程接口的安全\n    *   8.5.3 安全编码实践\n\n软件开发是一项复杂且充满挑战的任务，由技能水平参差不齐、安全意识各异的开发人员承担。这些开发人员创建和修改的应用程序通常处理敏感数据并与公众交互。这给企业安全带来了重大风险，信息安全专业人员必须了解这些风险，在业务需求与之之间取得平衡，并实施适当的风险缓解机制。\n\
  \n### 系统开发控制简介\n\n许多组织使用定制开发的软件来实现其独特的业务目标。这些定制解决方案可能会因恶意和/或粗心的开发人员创建后门、缓冲区溢出漏洞或其他弱点而带来巨大的安全漏洞，这些弱点可能使系统面临被恶意人员利用的风险。\n\
  \n为了防范这些漏洞，至关重要的是要在整个系统开发生命周期中引入安全控制。有组织、有条理的流程有助于确保解决方案同时满足功能需求和安全准则。以下章节将从安全角度探讨系统开发活动的全谱系，这些安全关注点应是从事解决方案开发的任何信息安全专业人员首要关注的重点。\n\
  \n#### 软件开发\n\n安全应在系统开发的每个阶段予以考虑，包括软件开发过程。程序员应努力在开发的每个应用程序中构建安全性，为关键应用程序和处理敏感信息的应用程序提供更高级别的安全性。从早期阶段就考虑软件开发项目的安全影响极为重要，因为将安全性构建到系统中比向现有系统添加安全性容易得多。\n\
  \n##### 编程语言\n\n正如您可能知道的，软件开发人员使用编程语言来开发软件代码。您可能不知道的是，同一个系统可以同时使用多种类型的语言。本节简要介绍不同类型的编程语言及其各自的安全含义。\n\
  \n计算机理解二进制代码。它们使用由 1 和 0 组成的语言，仅此而已！计算机遵循的指令由一长串二进制数字组成，这种语言称为*机器语言*。每个中央处理单元 (CPU)\
  \ 芯片组都有其自己的机器语言，如果没有专用软件的协助，人类几乎不可能解读除最简单的机器语言代码之外的任何内容。汇编语言是一种更高级的替代方案，它使用助记符来表示\
  \ CPU 的基本指令集，但仍然需要特定硬件的知识，且语言相对晦涩。它还需要大量繁琐的编程工作；像将两个数字相加这样简单的任务，在汇编代码中可能需要五六行！\n\
  \n### 练习题\n\n### 3. 在收集过程中切勿修改证据。\n\n### 4. 将所有设备转移到安全的存储位置。\n\n### 9. 发现事件时，不立即切断机器电源的有效理由是什么？\n\
  \n1.  所有损害已造成。关机不会阻止额外损害。\n2.  没有其他系统可以在其关机时替代它。\n3.  太多用户已登录并正在使用该系统。\n4.  **内存中的宝贵证据将会丢失。**\n\
  \n### 10. 骇客活动家受以下哪些因素驱动？（选择所有适用项。）\n\n1.  经济利益\n2.  刺激/快感\n3.  技术\n4.  **政治信仰**\n\
  \n### 11. 以下哪种调查类型对证据的要求标准最高？\n\n1.  行政调查\n2.  民事调查\n3.  **刑事调查**\n4.  监管调查\n\n\
  ### 12. 在运营调查期间，组织可能会进行哪种类型的分析以防止未来发生类似事件？\n\n1.  取证分析\n2.  **根因分析**\n3.  网络流量分析\n\
  4.  Fagan 分析\n\n### 13. 电子证据开示参考模型 (EDRM) 的哪个步骤确保可能接受证据开示的信息不被篡改？\n\n1.  **保全**\n\
  2.  生成\n3.  处理\n4.  提交\n\n### 14. Gary 是一名系统管理员，正在法庭上就一起网络犯罪事件作证。他带来了服务器日志来支持其证词。服务器日志属于哪种类型的证据？\n\
  \n1.  实物证据\n2.  **文书证据**\n3.  口头证据\n4.  证人证言\n\n### 15. 如果您需要从一名不为您组织工作的疑似攻击者处没收一台\
  \ PC，哪种法律途径最为合适？\n\n1.  员工签署的同意协议。\n2.  **搜查令。**\n3.  无需法律途径。\n4.  自愿同意。\n\n###\
  \ 16. 为什么应避免每天删除日志文件？\n\n1.  **事件可能在数天后才被发现，宝贵的证据可能会丢失。**\n2.  磁盘空间便宜，且日志文件使用频繁。\n\
  3.  日志文件受保护，无法被篡改。\n4.  日志文件中的任何信息在几小时后都将变得毫无用处。\n\n### 17. 电子证据开示参考模型 (EDRM) 的哪个阶段会检查信息以移除受律师-委托人特权保护的信息？\n\
  \n1.  识别\n2.  收集\n3.  处理\n4.  **审查**\n\n### 18. 什么是道德规范？\n\n1.  履行工作要求所必须采取的行动\n\
  2.  职业行为法\n3.  专业组织制定的法规\n4.  **个人行为准则**\n\n### 19. 根据 (ISC)² 职业道德准则，CISSP 应如何行事？\n\
  \n1.  诚实、勤勉、负责、合法\n2.  **荣誉、诚实、公正、负责、合法**\n3.  维护安全策略并保护组织\n4.  值得信赖、忠诚、友好、礼貌\n\n\
  ### 20. 根据 RFC 1087《互联网伦理》，以下哪些行为被视为不可接受和不道德的？\n\n1.  危害机密信息隐私的行为\n2.  **危害用户隐私的行为**\n\
  3.  **扰乱组织活动的行为**\n4.  **以与既定安全策略不一致的方式使用计算机的行为**\n\n\n\n\n\n### 编程语言与面向对象编程\n\n\
  程序员不希望用机器语言或汇编语言编写代码。他们更倾向于使用高级语言，如 `Python`、`C++`、`Ruby`、`R`、`Java` 和 `Visual Basic`。这些语言允许程序员编写更接近人类交流的指令，减少开发应用程序所需的时间，可能减少项目所需的程序员数量，并且允许在不同操作系统和硬件平台之间实现一定的可移植性。一旦程序员准备好执行程序，有两个选项可供选择：编译和解释。\n\
  \n#### 编译型语言\n\n某些语言（如 `C`、`Java` 和 `FORTRAN`）是编译型语言。使用编译型语言时，程序员使用称为**编译器**的工具将高级语言转换为专为特定操作系统设计的可执行文件。然后将此可执行文件分发给最终用户，由他们自行决定如何使用。一般来说，无法直接查看或修改可执行文件中的软件指令。然而，逆向工程领域的专家可能借助称为**反编译器**的工具逆转编译过程。当进行恶意软件分析或竞争情报分析且无法访问底层源代码时，这对于确定可执行文件的工作原理特别有用。\n\
  \n#### 解释型语言\n\n其他语言（如 `Python`、`R`、`JavaScript` 和 `VBScript`）是解释型语言。使用这些语言时，程序员分发包含高级语言指令的源代码。最终用户随后使用解释器在其系统上执行该源代码。他们能够查看程序员编写的原始指令。\n\
  \n每种方法都有安全优势和劣势。编译后的代码通常不太容易被第三方篡改。然而，恶意（或不熟练）的程序员也更容易在代码中植入后门和其他安全缺陷并逃避检测，因为最终用户无法查看原始指令。然而，解释型代码不太容易受到原始程序员未被发现的恶意代码插入的影响，因为最终用户可以查看代码并检查其准确性。另一方面，接触软件的每个人都有能力修改程序员的原始指令，并可能在解释型软件中植入恶意代码。您将在第\
  \ 21 章“恶意代码和应用程序攻击”的“应用程序攻击”部分了解更多攻击者用于破坏软件的漏洞利用。\n\n#### 面向对象编程\n\n许多现代编程语言，如 `C++`、`Java`\
  \ 和 `.NET` 语言，支持面向对象编程（OOP）的概念。较旧的编程风格（如函数式编程）关注程序本身的流程，并试图将期望的行为建模为一系列步骤。面向对象编程关注交互中涉及的对象。您可以将其视为一组对象，它们可以被请求执行特定操作或表现出特定行为。对象协同工作以提供系统的功能或能力。OOP\
  \ 有潜力做到更可靠，并能减少程序变更错误的传播。作为一种编程方法，它更适合对现实世界进行建模或模拟。例如，银行程序可能有三个对象类，分别对应账户、账户持有人和员工。当向系统添加新账户时，会创建相应对象的新实例（或副本）以包含该账户的详细信息。\n\
  \nOOP 模型中的每个对象都有对应于可对该对象执行的特定操作的方法。例如，账户对象可以有添加资金、扣除资金、关闭账户和转移所有权的方法。\n\n对象也可以是其他对象的子类，并从其父类继承方法。例如，账户对象可能有对应特定账户类型的子类，如储蓄、支票、抵押贷款和汽车贷款。子类可以使用父类的所有方法，并拥有额外的特定类方法。例如，支票对象可能有一个名为\
  \ `write_check()` 的方法，而其他子类则没有。\n\n从安全角度来看，面向对象编程为抽象提供了一种黑盒方法。用户需要知道对象接口的细节（通常是对应于对象每个方法的输入、输出和操作），但不一定需要知道对象的内部工作原理即可有效使用它。为了提供面向对象系统所需的特性，对象被封装（自包含），并且只能通过特定消息（即输入）访问。对象还可以表现出替换属性，允许提供兼容操作的不同对象相互替换。\n\
  \n以下是您在工作中可能遇到的一些常见面向对象编程术语：\n\n**消息** 消息是发送给对象的通信或输入。\n\n**方法** 方法是定义对象响应消息所执行操作的内部代码。\n\
  \n**行为** 对象表现出的结果或输出是一种行为。行为是消息通过方法处理后的结果。\n\n**类** 一组对象的公共方法的集合，定义了这些对象的行为，称为类。\n\
  \n**实例** 对象是包含其方法的类的实例或示例。\n\n**继承** 当一个类（父类或超类）的方法被另一个子类（子类）继承时，就会发生继承。\n\n**委托**\
  \ 委托是对象将请求转发给另一个对象或代理。如果对象没有处理消息的方法，它就会进行委托。\n\n**多态** 多态是对象的一种特性，允许它因外部条件的变化而对同一消息或方法做出不同行为的响应。\n\
  \n**内聚** 内聚描述同一类中各方法目的之间关系的强度。\n\n**耦合** 耦合是对象之间交互的程度。耦合度越低意味着交互越少。耦合度越低提供更好的软件设计，因为对象更独立。耦合度越低越容易排查故障和更新。内聚度低的对象需要其他对象的大量协助来执行任务，并且具有高耦合。\n\
  \n#### 保证\n\n为确保内置于新应用程序中的安全控制机制在系统的整个生命周期中正确实施安全策略，管理员使用**保证程序**。保证程序只是将信任构建到系统生命周期中的正式化过程。通用准则提供了一种在政府环境中使用的标准化保证方法。\n\
  \n#### 避免和缓解系统故障\n\n无论您的开发团队多么先进，您的系统在某个时间点可能会发生故障。在部署软件和硬件控制时，您应该为这种类型的故障做计划，确保系统做出适当的响应。您可以采用许多方法来避免故障，包括使用输入验证和创建故障安全或故障开放程序。让我们更详细地讨论这些内容。\n\
  \n\n\n\n### 输入验证\n\n当用户与软件交互时，他们通常以输入的形式向应用程序提供信息。这可能包括键入稍后由程序使用的值。开发人员通常期望这些值落在特定参数范围内。例如，如果程序员要求用户输入月份，程序可能期望看到\
  \ 1 到 12 之间的整数值。如果用户输入的值超出该范围，编写不当的程序在最好的情况下可能会崩溃，在最坏的情况下可能允许用户控制底层系统。\n\n**输入验证**在允许进一步处理之前，验证用户提供的值是否与程序员的预期相符。例如，输入验证会检查月份值是否为\
  \ 1 到 12 之间的整数。如果该值超出该范围，程序将不会尝试将该数字作为日期处理，并会告知用户输入要求。这种代码检查以确保数字落在可接受范围内的输入验证类型，称为**限制检查**。\n\
  \n输入验证还可能检查异常字符，例如文本字段中的引号，这可能表明正在发生攻击。在某些情况下，输入验证例程可以转换输入以移除有风险的字符序列，并用安全值替换它们。此过程称为**转义输入**。\n\
  \n输入验证应始终发生在事务的服务器端。发送到用户浏览器的任何代码都可能被用户操纵，因此很容易被绕过。\n\n### 认证和会话管理\n\n许多应用程序，特别是\
  \ Web 应用程序，要求用户在访问敏感信息或修改应用程序中的数据之前进行认证。开发人员面临的核心安全任务之一是确保这些用户经过适当认证、仅执行授权操作，并且其会话从开始到结束都被安全地跟踪。\n\
  \n应用程序所需的认证级别应直接与该应用程序的敏感度级别挂钩。例如，如果应用程序为用户提供对敏感信息的访问权限，或允许用户执行关键业务应用程序，则应要求使用强多因素认证。\n\
  \n在大多数情况下，开发人员应寻求将其应用程序与组织现有的认证系统集成。利用现有的、经过强化的认证系统通常比尝试为特定应用程序开发认证系统更安全。如果无法做到这一点，请考虑使用外部开发并经过验证的认证库。\n\
  \n同样，开发人员应使用成熟的方法进行会话管理。这包括确保用于 Web 会话管理的任何 Cookie 仅通过安全的加密通道传输，并且这些 Cookie 中使用的标识符应当又长又随机生成。会话令牌应在指定时间段后过期，并要求用户重新认证。\n\
  \n### 错误处理\n\n开发人员喜欢详细的错误消息。这些错误中返回的深度信息对于调试代码至关重要，并使技术人员更容易诊断用户遇到的问题。\n\n然而，这些错误消息也可能向攻击者暴露敏感的内部信息，包括数据库表的结构、内部服务器的地址，以及可能有助于攻击前侦察工作的其他数据。因此，开发人员应在任何公开可访问的服务器和应用程序上禁用详细错误消息（也称为**调试模式**）。\n\
  \n### 日志记录\n\n虽然面向用户的详细错误消息可能构成安全威胁，但这些消息包含的信息非常有用，不仅对开发人员，对网络安全分析师也是如此。因此，应用程序应配置为将错误和其他安全事件的详细日志发送到集中式日志存储库。\n\
  \n开放 Web 应用程序安全项目 (OWASP) 安全编码指南建议记录以下事件：\n\n- 输入验证失败\n- 认证尝试，特别是失败\n- 访问控制失败\n\
  - 篡改尝试\n- 使用无效或过期的会话令牌\n- 操作系统或应用程序引发的异常\n- 使用管理权限\n- 传输层安全性 (TLS) 失败\n- 加密错误\n\n\
  这些信息可用于诊断安全问题和调查安全事件。\n\n### 故障安全与故障开放\n\n尽管程序员、产品设计师和项目经理尽了最大努力，开发的应用程序仍会以意想不到的方式被使用。其中一些情况会导致故障。由于故障不可预测，程序员应在代码中设计一种通用的响应和处理故障的机制。\n\
  \n在规划系统故障时，有两种基本选择：\n\n- **故障安全故障状态**将系统置于高安全级别（甚至可能完全禁用系统），直到管理员能够诊断问题并将系统恢复正常运行。\n\
  - **故障开放状态**允许用户绕过失败的安全控制，倾向于宽容。\n\n在绝大多数环境中，故障安全是适当的故障状态，因为它可以防止未经授权访问信息和资源。\n\n\
  软件应恢复到故障安全状态。这可能意味着仅关闭应用程序，也可能意味着停止整个主机系统的运行。Windows 操作系统 (OS) 中臭名昭著的蓝屏死机 (BSOD)\
  \ 就是这种故障响应的一个例子，它指示发生了 STOP 错误。当 OS 尽力阻止但仍发生不良活动时，就会发生 STOP 错误。这可能包括应用程序获得对硬件的直接访问、尝试绕过安全访问检查，或一个进程干扰另一个进程的内存空间。一旦发生这些条件之一，环境就不再可信。因此，OS\
  \ 不会继续支持不可靠且不安全的操作环境，而是发起 STOP 错误作为其故障安全响应。\n\n一旦发生故障安全操作，程序员应考虑之后发生的活动。选项是保持故障安全状态或自动重启系统。前者需要管理员手动重启系统并监督该过程。此操作可通过使用启动密码来强制执行。后者无需人工干预即可使系统恢复到运行状态，但也有其自身的独特问题。例如，它必须限制系统重启进入非特权状态。换句话说，系统不应重启并执行自动登录；相反，它应提示用户输入授权访问凭据。\n\
  \n即使安全性在软件中经过适当设计和嵌入，为了支持更轻松的安装，该安全性通常会被禁用。因此，IT 管理员通常有责任开启并配置安全性，以满足其特定环境的需求。维护安全性通常是在用户友好性和功能性之间进行权衡，如图\
  \ 20.1 所示。此外，随着安全性的增加或增强，成本、管理开销也会增加，而生产力/吞吐量会降低。\n\n![图 20.1 安全性 vs. 用户友好性 vs.\
  \ 功能性](img/c20f001.jpg)\n\n**图 20.1** 安全性 vs. 用户友好性 vs. 功能性\n\n### 系统开发生命周期\n\n\n\
  \n\n### 安全生命周期管理\n\n如果在系统或应用程序的整个生命周期内进行规划和管理，安全性将最为有效。管理员采用项目管理来使开发项目保持在正轨上，并朝着完成产品的目标前进。通常，项目管理使用生命周期模型来构建结构，以指导开发过程。使用形式化的生命周期模型有助于确保良好的编码实践，并在产品开发的每个阶段嵌入安全性。\n\
  \n所有系统开发过程都应包含若干共同活动。尽管它们的名称不一定相同，但这些核心活动对于开发可靠、安全的系统至关重要：\n\n*   概念定义\n*   功能需求确定\n\
  *   控制规范开发\n*   设计评审\n*   代码走查评审\n*   系统测试评审\n*   维护与变更管理\n\n本章后面的“生命周期模型”部分将探讨两种生命周期模型，并展示这些活动如何应用于现实世界的软件工程环境中。\n\
  \n#### 概念定义\n\n系统开发的概念定义阶段涉及创建系统的基本概念声明。这是一个由所有相关利益相关者（开发人员、客户和管理层）达成一致的简单声明，阐述了项目的目的以及总体系统需求。概念定义是一个非常高层级的目的陈述，长度不应超过一到两段。如果您正在阅读项目的详细摘要，您可能会期望将概念声明作为摘要或介绍，使外部人员能在短时间内获得对项目的顶层理解。\n\
  \n在系统开发过程的所有阶段参考概念声明非常有帮助。通常，开发过程的复杂细节往往会掩盖项目的总体目标。定期阅读概念声明有助于使开发团队重新聚焦。\n\n####\
  \ 功能需求确定\n\n一旦所有利益相关者就概念声明达成一致，开发团队就该坐下来开始功能需求流程。在此阶段，会列出具体的系统功能，开发人员开始思考系统的各部分应如何互操作以满足功能需求。此开发阶段的交付成果是一份功能需求文档，列出了具体的系统需求。这些需求应以软件开发人员可理解的形式表达。功能需求具有以下三个主要特征：\n\
  \n*   **输入**：提供给函数的数据\n*   **行为**：描述系统针对不同输入应采取何种行动的业务逻辑\n*   **输出**：函数提供的数据\n\n\
  与概念声明一样，重要的是在工作进入下一阶段之前，确保所有利益相关者都同意功能需求文档。文档最终完成后，不应只是搁置在架子上积灰——整个开发团队应在所有阶段持续参考此文档，以确保项目按计划进行。在测试和评估的最后阶段，项目经理应将此文档作为清单，以确保满足所有功能需求。\n\
  \n#### 控制规范开发\n\n注重安全的组织还会确保从开发的最早阶段起，就将适当的安全控制设计进每个系统中。在生命周期模型中设置控制规范开发阶段通常很有用。该阶段通常在功能需求开发后不久进行，并常随着设计和设计评审阶段的推进而持续。\n\
  \n在控制规范开发期间，从多个安全视角分析系统非常重要。首先，必须在每个系统中设计适当的访问控制，以确保仅允许授权用户访问系统，且不允许其超越授权级别。其次，系统必须通过使用适当的加密和数据保护技术来维护关键数据的机密性。接下来，系统应同时提供审计跟踪以强制执行个人问责制，以及用于检测非法活动的侦测机制。最后，根据系统的关键性，应将可用性和容错问题作为纠正措施加以解决。\n\
  \n请记住，将安全性设计进系统不是一次性过程，必须主动进行。很多时候，系统在没有安全规划的情况下进行设计，随后开发人员试图为系统改装适当的安全机制。不幸的是，这些机制是事后诸葛亮，无法与系统设计完全集成，从而留下了巨大的安全漏洞。此外，每当设计规范发生重大变更时，都应重新审视安全需求。如果系统的主要组件发生变化，安全需求也很可能随之改变。\n\
  \n#### 设计评审\n\n功能规范和控制规范完成后，让系统设计师大显身手吧！在这个通常漫长的过程中，设计师确定系统各部分如何确切地互操作，以及模块化系统结构将如何布局。此外，在此阶段，设计管理团队通常会为各个团队设定具体任务，并制定完成编码里程碑的初步时间表。\n\
  \n设计团队完成正式设计文档后，应召开利益相关者评审会议，以确保所有人都同意该流程仍按计划顺利进行，朝着成功开发出具有所需功能的系统的目标前进。\n\n####\
  \ 代码走查评审\n\n利益相关者批准软件设计后，软件开发人员便开始编写代码。项目经理应在编码过程的各个里程碑安排多次代码走查评审会议。这些技术会议通常仅涉及开发人员，他们带着特定模块的代码副本坐下来，逐行走查，寻找逻辑流程或其他设计/安全缺陷。这些会议在确保各开发团队生成的代码按规范执行方面发挥着关键作用。\n\
  \n#### 用户验收测试\n\n经过多次代码评审和许多个长夜的工作，总会有那么一个时刻，开发人员敲入最后一个分号，宣布系统完成。正如任何经验丰富的软件工程师所知，系统永远不会真正完成。现在是开始用户验收测试阶段的时候了。最初，大多数组织使用开发人员执行初始系统测试，以寻找任何明显的错误。随着测试的推进，开发人员和实际用户根据预定义场景验证系统，这些场景模拟常见和不寻常的用户活动。\n\
  \n此阶段完成后，代码可进入部署阶段。与任何关键开发过程一样，重要的是您要保留一份书面测试计划和测试结果的副本，以供将来审查。\n\n#### 维护与变更管理\n\
  \n\n\n\n系统投入运行后，需要执行各种维护任务，以确保在不断变化的运营、数据处理、存储和环境需求面前持续运行。必须配备一支熟练的支持团队来处理任何例行或意外的维护工作。同样重要的是，任何代码变更都必须通过正式的变更管理流程来处理，如第\
  \ 1 章“通过原则和政策进行安全治理”所述。\n\n### 生命周期模型\n\n从更成熟的工程学科（如土木、机械和电气工程）的从业者那里，你将听到的主要抱怨之一是软件工程根本不是一门工程学科。事实上，他们认为，它只是混乱过程的简单组合，只是偶尔设法拼凑出可行的解决方案。确实，当今开发环境中进行的某些“软件工程”只不过是用“胶带和铁丝”勉强拼凑在一起的引导式编码。\n\
  \n然而，随着行业的成熟，主流软件工程中采用了更加正式的生命周期管理流程。毕竟，将历史悠久的学科（如土木工程）的流程与仅有几十年历史的行业进行比较，几乎是不公平的。在\
  \ 20 世纪 70 年代和 80 年代，温斯顿·罗伊斯和巴里·博姆等先驱提出了几种软件开发生命周期（SDLC）模型，以帮助指导实践走向正式化流程。1991 年，软件工程研究所推出了能力成熟度模型，描述了组织在将可靠的工程原则融入其软件开发流程时所经历的过程。在以下章节中，我们将探讨这些研究成果。建立管理模型应能改进最终产品。然而，如果\
  \ SDLC 方法论不充分，项目可能无法满足业务和用户需求。因此，验证 SDLC 模型是否正确实施且适合您的环境非常重要。此外，实施 SDLC 的初始步骤之一应包括管理层批准。\n\
  \n#### 瀑布模型\n\n瀑布模型最初由温斯顿·罗伊斯于 1970 年开发，旨在将系统开发生命周期视为一系列迭代活动。如图 20.2 所示，传统瀑布模型有七个开发阶段。随着每个阶段的完成，项目进入下一阶段。正如反向箭头所示，现代瀑布模型确实允许开发返回上一阶段，以修正在后续阶段发现的缺陷。这通常被称为瀑布模型的*反馈回路特性*。\n\
  \n![图 20.2 瀑布生命周期模型 ](img/c20f002.jpg)\n\n**图 20.2** 瀑布生命周期模型\n\n瀑布模型是最早尝试对软件开发过程进行全面建模的模型之一，同时考虑到了返回上一阶段以修正系统故障的必要性。然而，该模型的主要批评之一是它只允许开发人员在流程中后退一步。它没有为在开发周期后期发现错误做出规定。\n\
  \n#### 螺旋模型\n\n1988 年，TRW 的巴里·博姆提出了一种替代生命周期模型，允许对瀑布式流程进行多次迭代。图 20.3 说明了该模型。因为螺旋模型封装了另一种模型（瀑布模型）的多次迭代，所以它被称为*元模型*，或“模型的模型”。\n\
  \n![图 20.3 螺旋生命周期模型 ](img/c20f003.jpg)\n\n**图 20.3** 螺旋生命周期模型\n\n请注意，螺旋的每一次“循环”都会导致一个新系统原型的开发（由图\
  \ 20.3 中的 P1、P2 和 P3 表示）。理论上，系统开发人员会将整个瀑布流程应用于每个原型的开发，从而以增量方式逐步构建一个成熟的系统，以完全验证的方式包含所有功能需求。博姆的螺旋模型为瀑布模型的主要批评提供了解决方案——它允许开发人员在不断变化的技术需求和客户要求需要系统演进时，返回规划阶段。\n\
  \n#### 敏捷软件开发\n\n最近，敏捷软件开发模型在软件工程界越来越流行。从 20 世纪 90 年代中期开始，开发人员越来越多地采用软件开发方法，摒弃了过去僵化的模型，转而采用强调客户需求并以迭代方式快速开发满足这些需求的新功能的方法。\n\
  \n2001 年，十七位敏捷开发方法的先驱聚在一起，编写了一份题为《敏捷软件开发宣言》（[`agilemanifesto.org`](http://agilemanifesto.org)）的文件，阐述了敏捷方法的核心理念：\n\
  \n> 我们通过实践并帮助他人实践，正在发掘更好的软件开发方法。通过这项工作，我们开始重视：\n>\n> **个体和互动** 高于 流程和工具\n>\n> **可工作的软件**\
  \ 高于 详尽的文档\n>\n> **客户合作** 高于 合同谈判\n>\n> **响应变化** 高于 遵循计划\n>\n> 也就是说，虽然右项也有价值，但我们更重视左项的价值。\n\
  \n《敏捷宣言》还定义了支撑该理念的 12 条原则，可在此查看：[`agilemanifesto.org/principles.html`](http://agilemanifesto.org/principles.html)。\n\
  \n正如《敏捷宣言》所述，这 12 条原则如下：\n\n*   我们的最高优先级是通过尽早且持续地交付有价值的软件来满足客户。\n*   欢迎需求变更，即使是在开发后期。敏捷流程利用变更为客户创造竞争优势。\n\
  *   频繁交付可工作的软件，从几周到几个月不等，倾向于更短的时间尺度。\n*   业务人员和开发人员必须在整个项目期间每天共同工作。\n*   围绕有动力的个体构建项目。给他们提供所需的环境和支持，并信任他们能完成工作。\n\
  *   向开发团队内部和外部传递信息最高效、最有效的方法是面对面交谈。\n*   可工作的软件是进度的主要度量标准。\n*   敏捷流程提倡可持续开发。发起人、开发人员和用户应能无限期地保持恒定的步调。\n\
  *   持续关注技术卓越和良好设计增强敏捷性。\n*   简洁——即最大化未完成工作量的艺术——是必不可少的。\n*   最好的架构、需求和设计源自自组织团队。\n\
  *   团队定期反思如何变得更有效，然后相应地调整和优化其行为。\n\n敏捷开发方法在软件界迅速获得动力，并有许多变体，包括 Scrum、敏捷统一过程（AUP）、动态系统开发模型（DSDM）和极限编程（XP）。\n\
  \n#### 软件能力成熟度模型\n\n\n\n\n### 软件能力成熟度模型 (SW-CMM)\n\n卡内基梅隆大学的软件工程研究所 (SEI) 推出了软件能力成熟度模型，也称为软件能力成熟度模型\
  \ (缩写为 SW-CMM、CMM 或 SCMM)，该模型主张所有从事软件开发的组织都会按顺序经历各种成熟阶段。SW-CMM 描述了软件过程成熟度的原则和实践。其旨在帮助软件组织通过实施一条从临时性、混乱的过程演进到成熟、规范的软件过程的路径，来提高其软件过程的成熟度和质量。SW-CMM\
  \ 背后的理念是软件的质量取决于其开发过程的质量。\n\n#### SW-CMM 的阶段\n\n##### 1 级：初始级\n在此阶段，你通常会发现勤奋的人员以一种无序的方式冲锋陷阵。通常几乎没有或根本没有定义软件开发过程。\n\
  \n##### 2 级：可重复级\n在此阶段，引入了基本的生命周期管理过程。开始以有组织的方式重用代码，并期望从类似项目中获得可重复的结果。SEI 将该级别的关键过程领域定义为：需求管理、软件项目计划、软件项目跟踪与监督、软件分包管理、软件质量保证和软件配置管理。\n\
  \n##### 3 级：已定义级\n在此阶段，软件开发人员按照一套正式的、文档化的软件开发过程进行操作。所有开发项目都在新的标准化管理模型的约束内进行。SEI\
  \ 将该级别的关键过程领域定义为：组织过程聚焦、组织过程定义、培训计划、集成软件管理、软件产品工程、组间协调和同行评审。\n\n##### 4 级：已管理级\n\
  在此阶段，软件过程管理进入下一层次。利用定量度量来获得对开发过程的详细理解。SEI 将该级别的关键过程领域定义为：定量过程管理和软件质量管理。\n\n#####\
  \ 5 级：优化级\n在优化型组织中，会发生持续改进的过程。建立了复杂的软件开发过程，确保来自某一阶段的反馈能传达到前一阶段，以改进未来的结果。SEI 将该级别的关键过程领域定义为：缺陷预防、技术变更管理和过程变更管理。有关软件能力成熟度模型的更多信息，请访问软件工程研究所网站\
  \ [www.sei.cmu.edu](http://www.sei.cmu.edu)。\n\n### IDEAL 模型\n\n软件工程研究所还开发了用于软件开发的\
  \ IDEAL 模型，该模型实现了许多 SW-CMM 属性。IDEAL 模型有五个阶段：\n\n#### I：启动\n在 IDEAL 模型的启动阶段，会概述变更背后的业务原因，建立对变更计划的支持，并建立适当的基础设施。\n\
  \n#### 2：诊断\n在诊断阶段，工程师分析组织的当前状态并提出总体变更建议。\n\n#### 3：确立\n在确立阶段，组织采纳诊断阶段的总体建议，制定具体的行动计划以帮助实现这些变更。\n\
  \n#### 4：行动\n在行动阶段，是时候停止“空谈”并“付诸行动”了。组织开发解决方案，然后对其进行测试、完善和实施。\n\n#### 5：学习\n与任何质量改进过程一样，组织必须持续分析其工作，以确定是否已达到预期目标，并在必要时提出新的行动，使组织重回正轨。\n\
  \nIDEAL 模型如 图 20.4 所示。\n\n![图 20.4 IDEAL 模型](img/c20f004.jpg)\n\n**图 20.4** IDEAL\
  \ 模型\n\n### 甘特图和 PERT\n\n甘特图是一种条形图，显示项目和进度之间随时间变化的相互关系。它提供了进度的图形化说明，有助于规划、协调和跟踪项目中的特定任务。图\
  \ 20.5 显示了一个甘特图示例。\n\n![图 20.5 甘特图](img/c20f005.jpg)\n\n**图 20.5** 甘特图\n\n项目评估审查技术\
  \ (PERT) 是一种项目进度安排工具，用于判断正在开发的软件产品的规模并计算标准差 (SD) 以进行风险评估。PERT 关联每个组件的估计最小可能规模、最可能规模和最大可能规模。PERT\
  \ 用于指导项目管理和软件编码的改进，以生产更高效的软件。随着编程和管理能力的提高，实际生产的软件规模应当更小。\n\n### 变更与配置管理\n\n一旦软件发布到生产环境中，用户必然会请求添加新功能、修复错误以及对代码进行其他修改。正如组织制定了开发软件的规范化过程一样，他们也必须建立一个程序，以有组织的方式管理变更。然后应将这些变更记录到中央存储库中，以支持未来的审计、调查和分析需求。\n\
  \n#### 变更管理过程\n\n变更管理过程有三个基本组成部分：\n\n##### 请求控制\n请求控制过程提供了一个有组织的框架，用户可在其中请求修改，管理者可进行成本/收益分析，开发人员可确定任务优先级。\n\
  \n##### 变更控制\n变更控制过程由开发人员用于重现用户遇到的情况，并分析补救该情况的适当变更。它还提供了一个有组织的框架，多个开发人员可在其中创建和测试解决方案，然后再将其推广到生产环境中。变更控制包括遵守质量控制限制、开发用于更新或变更部署的工具、妥善记录任何代码变更，以及限制新代码的影响以最大程度减少安全性的降低。\n\
  \n##### 发布控制\n变更最终确定后，必须通过发布控制程序批准发布。发布控制过程的一个基本步骤是复查并确保在变更过程中作为编程辅助插入的任何代码（如调试代码和/或后门）在将新软件发布到生产环境前已被移除。发布控制还应包括验收测试，以确保对最终用户工作任务的任何更改都被理解且功能正常。\n\
  \n### 配置管理\n\n除了变更管理过程外，安全管理员还应了解配置管理的重要性。此过程用于控制整个组织使用的软件版本，并正式跟踪和控制软件配置的变更。它有四个主要组成部分：\n\
  \n#### 配置标识\n在配置标识过程中，管理员记录组织内受管软件产品的配置。\n\n#### 配置控制\n配置控制过程确保根据变更控制和配置管理策略对软件版本进行更改。更新只能根据这些策略从授权分发渠道进行。\n\
  \n#### 配置状态记账\n使用正式化的程序来跟踪发生的所有授权变更。\n\n\n\n\n\n### 配置审计\n\n应定期进行配置审计，以确保实际生产环境与会计记录一致，且未发生未经授权的配置变更。\n\
  \n变更管理和配置管理技术共同构成了软件工程师武器库的重要组成部分，并保护组织免受开发相关的安全问题影响。\n\n### DevOps 方法\n\n最近，许多技术专业人员认识到软件开发、质量保证和技术运维这三大主要\
  \ IT 职能之间存在脱节。这些职能通常由截然不同类型的人员组成，且位于独立的组织孤岛中，彼此经常发生冲突。这种冲突导致代码创建、测试和部署到生产系统的过程出现漫长延迟。当问题出现时，团队往往不是协作解决问题，而是将问题“扔过墙头”甩给对方，导致官僚主义的来回推诿。\n\
  \nDevOps 方法旨在通过将这三大职能融合在一个统一的运营模型中来解决这些问题。*DevOps* 一词是 Development（开发）和 Operations（运维）的组合，象征着这些职能必须融合协作以满足业务需求。图\
  \ 20.6 中的模型展示了软件开发、质量保证和 IT 运维的重叠性质。\n\n![图 20.6 DevOps 模型](img/c20f006.jpg)\n\n\
  **图 20.6** DevOps 模型\n\nDevOps 模型与敏捷开发方法紧密契合，旨在大幅缩短开发、测试和部署软件变更所需的时间。虽然传统方法通常导致主要软件部署非常不频繁（可能一年一次），但使用\
  \ DevOps 模型的组织通常每天部署代码数次。有些组织甚至以持续部署为目标，代码每天可能推出数十次甚至数百次。\n\n### 应用程序编程接口\n\n虽然早期的\
  \ Web 应用程序通常是独立系统，处理用户请求并提供输出，但现代 Web 应用程序要复杂得多。它们通常包含多个不同 Web 服务之间的交互。例如，零售网站可能会使用外部信用卡处理服务，允许用户在社交媒体上分享购买记录，与物流提供商网站集成，并在其他网站上提供推荐计划。\n\
  \n为了使这些跨站点功能正常工作，网站之间必须相互交互。许多组织为此提供*应用程序编程接口 (API)*。API 允许应用程序开发人员绕过传统网页，通过函数调用直接与底层服务交互。例如，社交媒体\
  \ API 可能包含以下一些 API 函数调用：\n\n*   `Post status`（发布状态）\n*   `Follow user`（关注用户）\n*\
  \   `Unfollow user`（取消关注用户）\n*   `Like/Favorite a post`（点赞/收藏帖子）\n\n提供和使用 API 为服务提供商创造了巨大的机遇，但也带来了一些安全风险。开发人员在创建和使用\
  \ API 时必须意识到这些挑战并加以解决。\n\n首先，开发人员必须考虑身份验证要求。某些 API（如允许查询天气预报或产品库存的 API）可能面向公众开放，使用时不需要任何身份验证。其他\
  \ API（如允许修改信息、下单或访问敏感信息的 API）可能仅限特定用户使用，并依赖安全的身份验证。API 开发人员必须知道何时需要身份验证，并确保验证每次\
  \ API 调用的凭据和授权。这种身份验证通常通过向授权 API 用户提供复杂的 API 密钥来实现，该密钥随每次 API 调用传递。后端系统在处理请求前验证此\
  \ API 密钥，确保发起请求的系统已获授权进行特定的 API 调用。\n\nAPI 还必须像任何 Web 应用程序一样经过彻底的安全缺陷测试。您将在下一节了解更多相关内容。\n\
  \n### 软件测试\n\n作为开发过程的一部分，您的组织应在内部分发软件（或将其发布到市场）之前对其进行彻底测试。解决测试问题的最佳时机是在模块设计阶段。换句话说，您用于测试产品的机制和用于探索产品的数据集，应与产品本身并行设计。您的编程团队应开发特殊的测试数据套件，以最大程度地覆盖软件的所有路径，并预先知道正确的输出结果。\n\
  \n您应执行的测试之一是*合理性检查*。合理性检查确保软件返回的值符合指定标准，且在合理范围内。例如，一个计算人类最佳体重的程序如果返回 612 磅的值，肯定无法通过合理性检查！\n\
  \n此外，在进行软件测试时，您应检查产品如何处理正常有效的输入数据、错误的数据类型、超范围值以及其他边界和/或条件。实际工作负载提供了最佳的压力测试。但是，您不应使用实时或实际现场数据进行测试，尤其是在早期开发阶段，因为缺陷或错误可能导致测试数据的完整性或机密性遭到破坏。\n\
  \n测试软件时，您应适用与组织其他方面相同的职责分离规则。换句话说，您应将软件测试分配给开发代码的程序员以外的人员，以避免利益冲突，并确保成品更安全、功能更完善。当第三方测试您的软件时，您更有可能获得客观、无偏见的审查。第三方测试允许进行更广泛、更彻底的测试，并防止程序员的偏见和倾向影响测试结果。\n\
  \n您可以使用三种软件测试方法：\n\n#### 白盒测试\n\n白盒测试检查程序的内部逻辑结构，逐行分析代码，以发现潜在错误。\n\n#### 黑盒测试\n\n\
  黑盒测试从用户角度检查程序，通过提供各种输入场景并检查输出来进行。黑盒测试人员无法访问内部代码。交付前进行的最终验收测试是黑盒测试的常见示例。\n\n####\
  \ 灰盒测试\n\n灰盒测试结合了上述两种方法，常用于软件验证。在此方法中，测试人员从用户角度检查软件，分析输入和输出。他们也可以访问源代码，并利用它来帮助设计测试。然而，他们在测试过程中并不分析程序的内部运作。\n\
  \n除了评估软件质量外，程序员和安全专业人员还应仔细评估其软件的安全性，以确保满足组织的安全要求。对于面向公众的 Web 应用程序，这一点尤为关键。有两类测试专门用于评估应用程序安全性：\n\
  \n\n\n\n\n### 静态测试\n\n静态测试通过分析源代码或编译后的应用程序，在不运行软件的情况下评估其安全性。静态分析通常涉及使用自动化工具，旨在检测常见的软件缺陷，例如缓冲区溢出。（有关缓冲区溢出的更多信息，请参阅第\
  \ 21 章“恶意代码与应用攻击”。）在成熟的开发环境中，应用程序开发人员可使用静态分析工具，并在设计/构建/测试过程中全程使用它们。\n\n### 动态测试\n\
  \n动态测试在运行时环境中评估软件的安全性，对于部署他人编写的应用程序的组织来说，这往往是唯一的选择。在这些情况下，测试人员通常无法访问底层源代码。动态软件测试的一个常见示例是使用\
  \ Web 应用程序扫描工具，以检测 Web 应用程序中是否存在跨站脚本、结构化查询语言 (SQL) 注入或其他缺陷。在生产环境上进行的动态测试应始终经过仔细协调，以避免无意中导致服务中断。\n\
  \n正确的软件测试实施是项目开发过程中的关键要素。商业软件和内部软件中常见的许多错误和疏漏都可以被消除。将测试计划和结果作为系统永久文档的一部分予以保存。\n\n\
  ### 代码仓库\n\n软件开发是一项协作工作，大型软件项目需要开发人员团队，他们可能同时在代码的不同部分工作。更复杂的是，这些开发人员可能分布在世界各地。\n\
  \n*代码仓库* 提供了支持这些协作的几项重要功能。主要而言，它们充当开发人员存放源代码的中心存储点。此外，`GitHub`、`Bitbucket` 和 `SourceForge`\
  \ 等代码仓库还提供版本控制、缺陷跟踪、Web 托管、发布管理和通信功能，以支持软件开发。\n\n代码仓库是促进软件开发的协作神器，但它们本身也存在安全风险。首先，开发人员必须适当控制对其仓库的访问。某些仓库（如支持开源软件开发的仓库）可能允许公共访问。而其他仓库（如托管包含商业机密信息代码的仓库）可能受到更多限制，仅限授权开发人员访问。仓库所有者必须仔细设计访问控制，仅允许适当的用户拥有读和/或写访问权限。\n\
  \n### 服务级别协议\n\n使用服务级别协议 (SLA) 是一种日益流行的方式，旨在确保向内部和/或外部客户提供服务的组织维持服务提供商和供应商双方商定的适当服务水平。为任何数据电路、应用程序、信息处理系统、数据库或对组织持续生存能力至关重要的其他关键组件制定\
  \ SLA 是明智之举。SLA 中通常涉及以下问题：\n\n*   系统正常运行时间（占总运行时间的百分比）\n*   最大连续停机时间（以秒/分钟等为单位）\n\
  *   峰值负载\n*   平均负载\n*   诊断责任\n*   故障切换时间（如果已部署冗余）\n\n服务级别协议通常还包含财务和其他合同补救措施，如果未能维持协议，这些措施将生效。例如，如果关键电路中断超过\
  \ 15 分钟，服务提供商可能同意免除该电路一周的所有费用。\n\n### 软件采购\n\n企业使用的大多数软件并非内部开发，而是从供应商处购买。其中一些软件是购买后在组织管理的服务器上运行，无论是本地部署还是在基础设施即服务\
  \ (IaaS) 环境中。其他软件则是通过互联网经由 Web 浏览器购买并交付，采用软件即服务 (SaaS) 的方式。大多数组织根据业务需求和软件可用性，结合使用这些方法。\n\
  \n例如，组织可能通过两种方式处理电子邮件服务。他们可能购买物理或虚拟服务器，然后在其上安装电子邮件软件，如 `Microsoft Exchange`。在这种情况下，组织从微软购买\
  \ Exchange 许可证，然后安装、配置和管理电子邮件环境。\n\n作为替代方案，组织可能选择将电子邮件完全外包给 `Google`、`Microsoft`\
  \ 或其他供应商。用户随后通过其 Web 浏览器或其他工具访问电子邮件，直接与供应商管理的电子邮件服务器交互。在这种情况下，组织仅负责创建账户和管理某些应用级设置。\n\
  \n无论哪种情况，安全都是重中之重。当组织自行购买和配置软件时，安全专业人员必须了解该软件的正确配置以满足安全目标。他们还必须时刻关注安全公告和补丁，以修复新发现的漏洞。未能履行这些义务可能导致环境不安全。\n\
  \n在 SaaS 环境中，大部分安全责任在于供应商，但组织的安全人员并未完全免责。虽然他们可能不负责那么多配置工作，但现在他们承担了监控供应商安全的责任。这可能包括审计、评估、漏洞扫描和其他措施，旨在验证供应商是否保持适当的控制。根据法规的性质和与服务提供商达成的协议，组织可能还保留全部或部分法律合规义务的责任。\n\
  \n### 建立数据库与数据仓库\n\n几乎每个现代组织都维护着某种包含对运营至关重要的信息的数据库——无论是客户联系信息、订单跟踪数据、人力资源和福利信息，还是敏感商业机密。这些数据库中很可能包含用户保密的个人信息，例如信用卡使用活动、出行习惯、杂货店购买记录和电话记录。由于对数据库系统的依赖日益增加，信息安全专业人员必须确保存在足够的安全控制，以防止未经授权的访问、篡改或数据破坏。\n\
  \n在以下章节中，我们将讨论数据库管理系统 (DBMS) 架构，包括各种 DBMS 类型及其特性。然后我们将讨论数据库安全注意事项，包括多实例化、开放数据库互连\
  \ (ODBC)、聚合、推理和数据挖掘。\n\n#### 数据库管理系统架构\n\n尽管目前有多种数据库管理系统 (DBMS) 架构可用，但绝大多数现代系统都实施了一种称为关系数据库管理系统\
  \ (RDBMS) 的技术。因此，以下章节主要关注关系数据库。不过，首先我们将讨论另外两种重要的 DBMS 架构：层次型和分布式。\n\n##### 层次型和分布式数据库\n\
  \n层次型数据模型将以逻辑树结构相关联的记录和字段组合在一起。这导致了一种一对多的数据模型，其中每个节点可能有零个、一个或多个子节点，但只有一个父节点。层次型数据模型的示例见\
  \ 图 20.7。\n\n![图 20.7 层次型数据模型](img/c20f007.jpg)\n\n**图 20.7** 层次型数据模型\n\n\n\n\n\
  图 20.7 中的层次模型是一个公司组织架构图。请注意，一对多的数据模型在此例中成立。每位员工仅有一位经理（即一对多中的“一”），但每位经理可能有一名或多名（即一对多中的“多”）员工。层次数据模型的其他示例包括\
  \ NCAA 疯狂三月锦标赛系统，以及互联网上用于域名系统 (DNS) 记录的层次化分发。层次数据库以这种层次化方式存储数据，适用于符合该模型的专业应用。例如，生物学家可能会使用层次数据库，根据该领域使用的界/门/纲/目/科/属/种层次模型来存储标本数据。\n\
  \n分布式数据模型将数据存储在多个数据库中，但这些数据库在逻辑上是相连的。用户将数据库视为一个单一实体，尽管它由通过网络互联的众多部分组成。每个字段可以有多个子项，也可以有多个父项。因此，分布式数据库的数据映射关系是多对多。\n\
  \n##### 关系数据库\n\n关系数据库由由行和列组成的扁平二维表构成。事实上，每个表看起来类似于电子表格文件。行和列的结构提供了一对一的数据映射关系。关系数据库的主要构建模块是表（也称为*关系*）。每个表包含一组相关记录。例如，销售数据库可能包含以下表：\n\
  \n*   **客户表**，包含组织所有客户的联系信息\n*   **销售代表表**，包含组织销售团队的身份信息\n*   **订单表**，包含每位客户下达的订单记录\n\
  \n每个表包含若干属性，或称为*字段*。每个属性对应表中的一列。例如，**客户表**可能包含公司名称、地址、城市、州、邮政编码和电话号码等列。每位客户都有自己的记录，或称为*元组*，由表中的一行表示。关系中的行数称为*基数*，列数称为*度*。属性的*域*是该属性可取的允许值集合。图\
  \ 20.8 展示了一个来自关系数据库的**客户表示例**。\n\n![图 20.8 来自关系数据库的客户表 ](img/c20f008.jpg)\n\n**图\
  \ 20.8** 来自关系数据库的客户表\n\n在此例中，该表的基数为 3（对应表中的三行），度为 8（对应八列）。在正常业务过程中，表的基数发生变化是常见的，例如当销售代表添加新客户时。表的度通常不会频繁变化，且通常需要数据库管理员介入。\n\
  \n表之间的关系被定义用于识别相关记录。在此例中，**客户表**和**销售代表表**之间存在关系，因为每位客户被分配一位销售代表，而每位销售代表被分配给一位或多位客户。该关系体现在图\
  \ 20.8 所示的**客户表**中的**销售代表**字段/列中。该列中的值引用了**销售代表表**（未显示）中包含的**销售代表 ID** 字段。此外，**客户表**和**订单表**之间也可能存在关系，因为每个订单必须与一位客户关联，而每位客户与一个或多个产品订单关联。**订单表**（未显示）可能包含一个**客户**字段，其中包含图\
  \ 20.8 中所示的**客户 ID** 值之一。\n\n记录通过各种键来识别。简单来说，*键*是表字段的一个子集，用于唯一标识记录。它们也用于在需要交叉引用信息时连接表。你应该熟悉三种类型的键：\n\
  \n**候选键** *候选键*是可用于唯一标识表中任意记录的属性子集。同一表中的任意两条记录，其组成候选键的所有属性值绝不会完全相同。每个表可能有一个或多个候选键，这些候选键从列标题中选出。\n\
  \n**主键** *主键*是从表的候选键集合中选出，用于唯一标识表中记录的键。每个表仅有一个主键，由数据库设计者从候选键集合中选定。RDBMS 通过禁止插入具有相同主键的多条记录来强制主键的唯一性。在图\
  \ 20.8 所示的**客户表**中，**客户 ID** 很可能是主键。\n\n**外键** *外键*用于强制执行两个表之间的关系，也称为*参照完整性*。参照完整性确保如果一个表包含外键，它对应于关系中另一个表中仍然存在的主键。它确保没有记录/元组/行包含对不存在的记录/元组/行的主键的引用。在前面描述的示例中，图\
  \ 20.8 中所示的**销售代表**字段是引用**销售代表表**主键的外键。\n\n所有关系数据库都使用标准语言结构化查询语言 (SQL)，为用户提供一致的接口，用于数据的存储、检索和修改，以及对\
  \ DBMS 的管理控制。每个 DBMS 供应商实现的 SQL 版本略有不同（如 Microsoft 的 Transact-SQL 和 Oracle 的 PL/SQL），但都支持一组核心功能。SQL\
  \ 的主要安全特性是其授权的粒度。这意味着 SQL 允许你在非常精细的层面上设置权限。你可以按表、行、列，甚至在某些情况下限制到单个单元格来限制用户访问。\n\n\
  SQL 为管理员、开发人员和最终用户提供了与数据库交互所需的完整功能。事实上，当今流行的图形化数据库界面仅仅是在标准 SQL 接口外包装了一些额外的花哨功能来连接\
  \ DBMS。SQL 本身分为两个不同的组件：数据定义语言 (DDL)，允许创建和修改数据库的结构（称为*模式*）；以及数据操作语言 (DML)，允许用户与该模式中包含的数据进行交互。\n\
  \n##### 数据库事务\n\n关系数据库支持显式和隐式使用事务以确保数据完整性。每个事务是一组离散的 SQL 指令，将作为一个整体要么成功要么失败。事务的某一部分成功而另一部分失败是不可能的。考虑银行两个账户之间转账的例子。你可能会使用以下\
  \ SQL 代码，先给账户 1001 增加 250 美元，然后从账户 2002 扣除 250 美元：\n\n```\nBEGIN TRANSACTION\nUPDATE\
  \ accounts\nSET balance = balance + 250\nWHERE account_number = 1001;\n\nUPDATE\
  \ accounts\nSET balance = balance – 250\nWHERE account_number = 2002\n\nEND TRANSACTION\n\
  ```\n\n\n\n### 数据库事务与安全机制\n\n#### 事务处理的重要性\n\n假设这两条语句不是作为事务的一部分执行，而是分别单独执行。如果数据库在第一个事务完成和第二个事务完成之间的时刻发生故障，`$250`\
  \ 将会被添加到账户 `1001`，但账户 `2002` 没有相应的扣除。这 `$250` 将凭空出现！交换这两条语句的顺序也无济于事——如果被中断，这会导致\
  \ `$250` 凭空消失！这个简单的例子凸显了面向事务处理的重要性。\n\n当事务成功完成时，称其已**提交**到数据库，且无法撤销。事务提交可以是显式的，使用\
  \ SQL 的 `COMMIT` 命令；也可以是隐式的，即成功到达事务末尾。如果必须中止事务，可以使用 `ROLLBACK` 命令显式回滚，或在发生硬件或软件故障时隐式回滚。事务回滚时，数据库会恢复到事务开始前的状态。\n\
  \n所有数据库事务都具有四个必需特征：原子性、一致性、隔离性和持久性。这些属性统称为 **ACID 模型**，是数据库管理系统开发中的关键概念。让我们简要了解一下每个要求：\n\
  \n##### 原子性\n数据库事务必须是原子的——即要么全做，要么全不做。如果事务的任何部分失败，整个事务必须回滚，就像从未发生过一样。\n\n##### 一致性\n\
  所有事务必须在一个与数据库所有规则一致的环境中开始操作（例如，所有记录都有唯一的主键）。事务完成时，数据库必须再次与规则保持一致，无论这些规则在事务处理过程中是否被违反。任何其他事务都不应能使用另一个事务执行过程中可能生成的不一致数据。\n\
  \n##### 隔离性\n隔离性原则要求事务彼此独立操作。如果数据库接收到两个修改相同数据的 SQL 事务，必须在允许另一个事务修改相同数据之前，完成其中一个事务的全部过程。这可以防止一个事务使用另一个事务作为中间步骤生成的无效数据。\n\
  \n##### 持久性\n数据库事务必须是持久的。即一旦提交到数据库，就必须被保留。数据库通过备份机制（如事务日志）来确保持久性。\n\n在以下章节中，我们将讨论数据库开发人员和管理员关注的各种具体安全问题。\n\
  \n### 多级数据库安全\n\n正如您在第 1 章所学，许多组织使用数据分类方案，根据分配给数据对象和个别用户的安全标签来实施访问控制限制。当组织的安全策略强制要求时，这一分类概念也必须扩展到组织的数据库中。\n\
  \n多级安全数据库包含不同分类级别的信息。它们必须验证分配给用户的标签，并根据用户请求，仅提供适当的信息。然而，在考虑数据库安全时，这一概念变得更加复杂。\n\n\
  当需要多级安全时，管理员和开发人员必须努力将具有不同安全要求的数据分开。混合不同分类级别和/或“需知”要求的数据被称为**数据库污染**，这是一个重大的安全挑战。通常，管理员会部署可信前端，为遗留或不安全的\
  \ DBMS 增加多级安全功能。\n\n#### 并发控制\n\n**并发控制**（或编辑控制）是一种预防性安全机制，旨在确保数据库中存储的信息始终正确，或者至少保护其完整性和可用性。此功能可用于单级或多级数据库。\n\
  \n未能正确实现并发控制的数据库可能会遭受以下问题：\n\n*   **丢失更新**：当两个不同的进程在不知晓对方活动的情况下对数据库进行更新时发生。例如，设想一个仓库的库存数据库，有不同的接收站。仓库目前可能有\
  \ `10` 本《CISSP 学习指南》库存。如果两个不同的接收站同时各收到一本《CISSP 学习指南》，它们都可能检查当前库存水平，发现是 `10`，将其加\
  \ `1`，并将表更新为 `11`，而实际值应为 `12`。\n\n*   **脏读**：当一个进程读取未成功提交的事务的记录时发生。回到仓库示例，如果一个接收站开始向数据库写入新库存记录，但在更新中途崩溃，如果事务未完全回滚，可能会在数据库中留下部分不正确的信息。\n\
  \n并发控制使用“锁”功能允许一个用户进行更改，但拒绝其他用户同时访问视图或更改数据元素。然后，更改完成后，“解锁”功能恢复其他用户访问所需数据的能力。在某些情况下，管理员会将并发控制与审计机制结合使用，以跟踪文档和/或字段更改。当审查这些记录数据时，并发控制就变成了一种侦查型控制。\n\
  \n#### 其他安全机制\n\n使用 DBMS 时，管理员可以部署其他几种安全机制。这些功能相对容易实现，在行业中很常见。例如，与语义完整性相关的机制是 DBMS\
  \ 的常见安全功能。语义完整性确保用户操作不违反任何结构规则。它还检查所有存储的数据类型是否在有效域范围内，确保只存在逻辑值，并确认系统符合所有唯一性约束。\n\
  \n管理员可以使用时间和日期戳来维护数据完整性和可用性。时间和日期戳常出现在分布式数据库系统中。当时间戳被放置在所有更改事务上，并且这些更改被分发或复制到其他数据库成员时，所有更改都会应用到所有成员，但会按正确的时间顺序实施。\n\
  \nDBMS 的另一个常见安全功能是数据库内的对象可以被细粒度控制；这也可以改进安全控制。**基于内容的访问控制** 是细粒度对象控制的一个例子。基于内容的访问控制基于被访问对象的内容或有效载荷。因为必须逐个对象做出决策，基于内容的控制会增加处理开销。另一种细粒度控制形式是**单元抑制**。单元抑制是隐藏单个数据库字段或单元，或对它们施加更多安全限制的概念。\n\
  \n**基于上下文的访问控制** 常与基于内容的访问控制一起讨论，因为术语相似。基于上下文的访问控制从大局出发做出访问控制决策。基于上下文的访问控制的关键因素是每个对象、数据包或字段如何与整体活动或通信相关联。任何单个元素单独看可能都无害，但在更大的上下文中，该元素可能被揭示为良性或恶性。\n\
  \n\n\n\n### 数据库分区与多实例化\n\n管理员可能会采用**数据库分区**来规避聚合和推理漏洞，这些漏洞将在本章后面的“聚合”部分讨论。数据库分区是将单个数据库拆分为多个部分的过程，每个部分具有唯一且不同的安全级别或内容类型。\n\
  \n**多实例化**，在数据库上下文中，是指同一关系数据库表中的两行或多行似乎具有相同的主键元素，但包含供不同分类级别使用的不同数据。它常被用作防御某些类型推理攻击的手段（参见第\
  \ 9 章中的“推理”）。\n\n考虑一个包含多艘巡逻海军舰艇位置的数据库表。通常，该数据库在机密级别存储每艘舰艇的确切位置。然而，有一艘特定的舰艇——`USS\
  \ UpToNoGood`——正在执行一项前往绝密地点的秘密任务。军事指挥官不希望任何人知道该舰艇偏离了其正常巡逻路线。如果数据库管理员仅将 `USS UpToNoGood`\
  \ 的位置分类更改为绝密，拥有机密许可的用户在无法查询该舰艇位置时，就会知道发生了异常情况。但是，如果使用多实例化，可以向表中插入两条记录。第一条记录在绝密级别，反映舰艇的真实位置，仅对具有相应绝密安全许可的用户可用。第二条记录在机密级别，表明该舰艇正在执行例行巡逻，并将返回给拥有机密许可的用户。\n\
  \n最后，管理员可以将虚假或误导性数据插入 DBMS，以重定向或挫败信息机密性攻击。这是一个称为**噪声和扰动**的概念。使用此技术时必须极其小心，以确保插入数据库的噪声不影响业务操作。\n\
  \n### 开放数据库互连\n\n**开放数据库互连 (ODBC)** 是一项数据库功能，允许应用程序与不同类型的数据库通信，而无需为与每种类型的直接交互进行编程。ODBC\
  \ 作为应用程序和后端数据库驱动程序之间的代理，使应用程序程序员在创建解决方案时拥有更大的自由度，而无需担心后端数据库系统。图 20.9 说明了 ODBC 与后端数据库系统之间的关系。\n\
  \n![图 20.9 ODBC 作为应用程序和后端数据库系统之间的接口](img/c20f009.jpg)\n\n**图 20.9** ODBC 作为应用程序和后端数据库系统之间的接口\n\
  \n### NoSQL\n\n随着数据库技术的发展，许多组织在需要提高速度或其数据不适合整齐地放入表格形式的情况下，开始放弃关系模型。NoSQL 数据库是一类使用除关系模型以外的模型来存储数据的数据库。\n\
  \nNoSQL 数据库主要有三大类：\n\n*   **键/值存储** 或许是数据库最简单的形式。它们以键/值对的形式存储信息，其中键本质上是一个用于唯一标识记录的索引，记录由一个数据值组成。键/值存储适用于高速应用程序和超大数据集。\n\
  \n*   **图数据库** 以图格式存储数据，使用节点表示对象，使用边表示关系。它们适用于表示任何类型的网络，例如社交网络、地理位置以及其他适合图表示的数据集。\n\
  \n*   **文档存储** 与键/值存储类似，它们使用键来存储信息，但存储的信息类型通常比键/值存储中的更复杂，且以文档形式存在。文档存储中常用的文档类型包括可扩展标记语言\
  \ (XML) 和 JavaScript 对象表示法 (JSON)。\n\nNoSQL 数据库使用的安全模型可能与关系数据库有显著差异。使用此技术的组织中的安全专业人员应熟悉其所用解决方案的安全功能，并与数据库团队协商设计适当的安全控制。\n\
  \n### 存储数据和信息\n\n数据库管理系统帮助利用数据的力量，并对谁可以访问数据以及他们可以对数据执行什么操作获得一定程度的控制。然而，安全专业人员必须记住，DBMS\
  \ 安全仅涵盖通过传统“前门”渠道访问信息的情况。数据还通过计算机的存储资源进行处理——包括内存和物理介质。必须采取预防措施，确保这些基本资源也受到保护，免受安全漏洞的影响。毕竟，你永远不会花费大量时间和金钱保护家里的前门，却把后门大敞四开，对吧？\n\
  \n#### 存储类型\n\n现代计算系统使用多种类型的存储来维护系统和用户数据。系统在各种存储类型之间取得平衡，以满足组织的计算需求。有几种常见的存储类型：\n\
  \n*   **主存储（或“实”存储）** 由直接可用于系统 CPU 的主内存资源组成。主存储通常由易失性随机存取存储器 (RAM) 组成，通常是系统可用的最高性能存储资源。\n\
  \n*   **辅助存储** 由价格较低、非易失性的存储资源组成，可供系统长期使用。典型的辅助存储资源包括磁性和光学介质，如磁带、磁盘、硬盘驱动器、闪存驱动器和光盘/数字多功能光盘\
  \ (CD/DVD) 存储。\n\n*   **虚拟内存** 允许系统通过使用辅助存储来模拟额外的主内存资源。例如，一个昂贵 RAM 资源不足的系统可能会将一部分硬盘用于直接\
  \ CPU 寻址。\n\n*   **虚拟存储** 允许系统通过使用主存储来模拟辅助存储资源。虚拟存储最常见的例子是 RAM 磁盘，它向操作系统呈现为辅助存储设备，但实际上是用易失性\
  \ RAM 实现的。这为各种应用程序提供了极快的文件系统，但不提供恢复能力。\n\n*   **随机存取存储** 允许操作系统从介质内的任意点请求内容。RAM\
  \ 和硬盘驱动器是随机存取存储资源的例子。\n\n*   **顺序存取存储** 要求从头开始扫描整个介质以到达特定地址。磁带是顺序存取存储资源的常见例子。\n\n\
  *   **易失性存储** 在电源从资源移除时丢失其内容。RAM 是最常见的易失性存储资源类型。\n\n*   **非易失性存储** 不依赖电源的存在来维护其内容。磁性/光学介质和非易失性\
  \ RAM (NVRAM) 是典型的非易失性存储资源示例。\n\n#### 存储威胁\n\n\n\n\n### 数据存储系统的信息安全威胁\n\n信息安全专业人员应了解针对数据存储系统的两大主要威胁。首先，无论使用何种类型的存储，非法访问存储资源的威胁始终存在。如果管理员未实施足够的文件系统访问控制，入侵者可能仅通过浏览文件系统就偶然发现敏感数据。在更敏感的环境中，管理员还应防范绕过操作系统控制并直接访问物理存储介质以检索数据的攻击。这最好通过使用加密文件系统来实现，该文件系统仅可通过主操作系统访问。此外，在多级安全环境中运行的系统应提供足够的控制，以确保共享内存和存储资源设置了失效安全控制，使得某一密级的数据在较低密级下不可读。\n\
  \n隐蔽通道攻击构成了针对数据存储资源的第二大主要威胁。隐蔽存储通道允许通过直接或间接操纵共享存储介质，在密级之间传输敏感数据。这可能仅仅是将敏感数据写入无意中共享的内存部分或物理存储中。更复杂的隐蔽存储通道可能被用来操纵磁盘上的可用空间大小或文件的大小，以隐蔽地在安全级别之间传递信息。有关隐蔽通道分析的更多信息，请参见第\
  \ 8 章“安全模型、设计与能力原则”。\n\n### 理解基于知识的系统\n\n自计算机诞生以来，工程师和科学家一直致力于开发能够执行常规操作的系统，这些操作会让人类感到厌烦并消耗大量时间。该领域的大多数成就都集中在减轻计算密集型任务的负担上。然而，研究人员在开发具有“人工智能”且能模拟（某种程度上）纯人类推理能力的系统方面也取得了巨大进展。\n\
  \n以下部分将探讨两种基于知识的人工智能系统：专家系统和神经网络。我们还将了解它们在计算机安全问题上的潜在应用。\n\n#### 专家系统\n\n专家系统旨在体现特定主题专家的积累知识，并以一致的方式将其应用于未来的决策。多项研究表明，当专家系统得到妥善开发和实施时，在面对常规决策时，其决策往往优于部分人类对应者。\n\
  \n每个专家系统都有两个主要组件：知识库和推理引擎。\n\n知识库包含专家系统已知的规则。知识库旨在将人类专家的知识编纂为一系列“如果/那么”语句。让我们考虑一个简单的专家系统，旨在帮助房主决定当飓风来袭时是否应撤离该区域。知识库可能包含以下语句（这些语句仅为示例）：\n\
  \n* 如果飓风为 4 级或更高，则洪水通常会达到海平面以上 20 英尺的高度。\n* 如果飓风风速超过 120 英里/小时 (mph)，则木结构建筑将被摧毁。\n\
  * 如果处于飓风季节末期，则飓风在逼近海岸时往往会变得更强。\n\n在实际的专家系统中，知识库将包含数百或数千条类似上述的断言。\n\n专家系统的第二个主要组件——推理引擎——分析知识库中的信息以得出适当的决策。专家系统用户通过某种用户界面向推理引擎提供当前情况的详细信息，推理引擎结合逻辑推理和模糊逻辑技术，基于过去的经验得出结论。继续以飓风为例，用户可能会告知专家系统一个\
  \ 4 级飓风正以平均 140 英里/小时的风速逼近海岸。推理引擎将分析知识库中的信息，并基于这些过往知识做出撤离建议。\n\n专家系统并非万无一失——它们的优劣取决于知识库中的数据和推理引擎中实现的决策算法。然而，它们在压力情境下有一个主要优势——其决策不涉及被情绪模糊的判断。专家系统可在分析紧急事件、股票交易及其他情感投入有时会妨碍逻辑决策的场景中发挥重要作用。因此，许多贷款机构现在使用专家系统做出信贷决策，而不依赖可能会想“吉姆虽未按时还款，但他看起来是个挺好的人”的贷款官员。\n\
  \n#### 机器学习\n\n机器学习技术利用分析能力从数据集中开发知识，而无需直接应用人类洞察。机器学习的核心方法是允许计算机直接分析数据并从中学习，开发和更新活动模型。\n\
  \n机器学习技术分为两大类。\n\n* **监督学习** 技术使用标记数据进行训练。创建机器学习模型的分析师提供数据集及正确答案，并允许算法开发可应用于未来案例的模型。例如，如果分析师想开发恶意系统登录的模型，分析师将提供一段时间内系统登录信息的数据集，并标明哪些是恶意的。算法将利用这些信息开发恶意登录的模型。\n\
  * **无监督学习** 技术使用未标记数据进行训练。提供给算法的数据集不包含“正确”答案；相反，算法被要求独立开发模型。在登录案例中，算法可能被要求识别相似登录的群组。分析师随后可查看算法开发的群组，并尝试识别可能为恶意的群组。\n\
  \n#### 神经网络\n\n在神经网络中，计算单元链被用来尝试模仿人类大脑的生物推理过程。在专家系统中，一系列规则存储在知识库中；而在神经网络中，则建立了一条长长的计算决策链，它们相互馈送并最终求和以产生所需输出。神经网络是机器学习技术的延伸，也常被称为*深度学习*或认知系统。\n\
  \n请记住，迄今为止设计的任何神经网络都远未达到人类思维的推理能力。尽管如此，神经网络显示出巨大潜力，可将人工智能领域推向当前状态之外。神经网络的优势包括线性、输入输出映射和自适应性。这些优势在语音识别、人脸识别、天气预测以及思维和意识模型探索的神经网络实现中显而易见。\n\
  \n\n\n\n典型的神经网络涉及多层求和运算，每一层都需要对信息进行加权，以反映该计算在整体决策过程中的相对重要性。权重必须根据神经网络预期要做出的每种决策类型进行定制。这是通过训练期来实现的，在训练期内，网络会被提供已知正确决策的输入。然后算法从这些决策反向推导，以确定计算链中每个节点的适当权重。此活动使用所谓的\
  \ `Delta rule`（增量规则）或 `learning rule`（学习规则）来执行。通过使用 `Delta rule`，神经网络能够从经验中学习。\n\
  \n##### 安全应用\n\n基于知识的分析技术在计算机安全领域有着广泛的应用。这些系统提供的主要优势之一是其快速做出一致决策的能力。计算机安全中的一个主要问题是，系统管理员无法始终如一且彻底地分析海量的日志和审计追踪数据以查找异常。这简直是天作之合！\n\
  \n### 摘要\n\n数据是许多组织拥有的最有价值的资源。因此，信息安全从业者必须理解保护数据本身以及协助处理该数据的系统和应用程序的必要性。每个技术感知型组织都必须实施针对恶意代码、数据库漏洞以及系统/应用程序开发缺陷的防护措施。\n\
  \n恶意代码对象对组织的计算资源构成威胁。这些威胁包括病毒、逻辑炸弹、特洛伊木马和蠕虫。\n\n到此，你无疑已经认识到，在这些宝贵的信息资源上设置适当的访问控制和审计追踪的重要性。数据库安全是一个快速发展的领域；如果数据库在你的安全职责中扮演重要角色，请花时间与数据库管理员坐下来交流，研读课程和教材，学习其底层理论。这是一项有价值的投资。\n\
  \n最后，在系统和应用程序开发过程中可以实施各种控制，以确保这些过程的最终产品能够在安全环境中运行。此类控制包括进程隔离、硬件分段、抽象，以及服务级别协议（SLA）等合同安排。安全应始终在任何开发项目的早期规划阶段引入，并在设计、开发、部署和维护等生产阶段持续受到监控。\n\
  \n### 考试要点\n\n**解释关系数据库管理系统（RDBMS）的基本架构。** 了解关系数据库的结构。能够解释表（关系）、行（记录/元组）和列（字段/属性）的功能。了解表之间关系是如何定义的以及各种键的作用。描述聚合和推理带来的数据库安全威胁。\n\
  \n**了解各种存储类型。** 解释主存储器和虚拟内存、辅助存储和虚拟存储、随机存取存储和顺序存取存储、易失性存储和非易失性存储之间的区别。\n\n**解释专家系统、机器学习和神经网络的工作原理。**\
  \ 专家系统由两个主要组件组成：一个包含一系列“如果/那么”规则的知识库，以及一个利用该信息对其他数据得出结论的推理引擎。机器学习技术试图通过算法从数据集中发现知识。神经网络通过安排一系列分层计算来解决问题，在有限程度上模拟人类思维的运作。神经网络在能够提供解决方案之前，需要针对特定问题进行大量训练。\n\
  \n**理解系统开发模型。** 了解 `waterfall model`（瀑布模型）描述了一个顺序开发过程，最终产出成品。如果发现错误，开发人员在该过程中最多只能回退一个阶段。`spiral\
  \ model`（螺旋模型）使用多次 `waterfall model` 迭代来生成多个规格完整且经过测试的原型。`Agile development models`（敏捷开发模型）强调客户需求，并以迭代方式快速开发满足这些需求的新功能。\n\
  \n**描述软件开发成熟度模型。** 了解成熟度模型通过实施一条从临时性、混乱过程演进到成熟、规范化软件过程的路径，帮助软件组织提高其软件过程的成熟度和质量。能够描述\
  \ `SW-CMM` 和 `IDEAL` 模型。\n\n**理解变更和配置管理的重要性。** 了解变更控制的三个基本组成部分——请求控制、变更控制和发布控制——以及它们如何促进安全。解释配置管理如何控制组织中使用的软件版本。\n\
  \n**理解测试的重要性。** 软件测试应作为开发过程的一部分进行设计。测试应被用作一种管理工具，以改进设计、开发和生产过程。\n\n### 书面实验\n\n\
  1.  数据库表中主键的主要目的是什么？\n\n2.  什么是多实例化？\n\n3.  解释应用程序代码静态分析和动态分析的区别。\n\n4.  当发现开发缺陷时，`waterfall\
  \ model`（瀑布模型）允许开发人员回退多远？\n\n### 复习题\n\n1.  以下哪一项*不是* DevOps 模型的组成部分？\n\n    1.\
  \  信息安全\n\n    2.  软件开发\n\n    3.  质量保证\n\n    4.  IT 运维\n\n2.  Bob 正在开发一个软件应用程序，其中有一个字段供用户输入日期。他想确保用户提供的值是准确的日期，以防止安全问题。Bob\
  \ 应该使用什么技术？\n\n    1.  多实例化\n\n    2.  输入验证\n\n    3.  污染\n\n    4.  筛选\n\n3.  变更管理过程的哪一部分允许开发人员确定任务优先级？\n\
  \n    1.  发布控制\n\n    2.  配置控制\n\n    3.  请求控制\n\n    4.  变更审计\n\n4.  哪种故障管理方法将系统置于高安全级别？\n\
  \n    1.  故障开放\n\n    2.  故障缓解\n\n    3.  故障安全\n\n    4.  故障清除\n\n5.  哪种软件开发模型采用七阶段方法，并带有一个允许后退一步的反馈回路？\n\
  \n    1.  Boyce-Codd\n\n    2.  瀑布\n\n    3.  螺旋\n\n    4.  敏捷\n\n6.  哪种访问控制形式主要关注字段存储的数据？\n\
  \n    1.  基于内容的\n\n    2.  基于上下文的\n\n    3.  语义完整性机制\n\n    4.  扰动\n\n7.  以下哪种键类型用于强制执行数据库表之间的参照完整性？\n\
  \n    1.  候选键\n\n    2.  主键\n\n    3.  外键\n\n    4.  超键\n\n8.  Richard 认为一位数据库用户正在滥用其特权，通过发出结合大量记录数据的查询来获取有关公司整体业务趋势的信息。该数据库用户利用了什么过程？\n\
  \n    1.  推理\n\n    2.  污染\n\n    3.  多实例化\n\n    4.  聚合\n\n9.  可以使用什么数据库技术，防止未授权用户通过注意到正常可用信息的缺失来确定机密信息？\n\
  \n    1.  推理\n\n    2.  操纵\n\n    3.  多实例化\n\n    4.  聚合\n\n10.  以下哪一项*不是*敏捷开发的原则？\n\
  \n\n\n\n### 第 21 章：恶意代码与应用攻击\n\n## 本章涵盖的 CISSP 考试主题\n\n**领域 3：安全架构与工程**\n\n*   3.5\
  \ 评估并缓解安全架构、设计和解决方案要素的漏洞\n*   3.6 评估并缓解基于 Web 系统中的漏洞\n\n**领域 8：软件开发安全**\n\n*   8.2\
  \ 识别并应用开发环境中的安全控制\n    *   8.2.1 软件环境的安全性\n*   8.5 定义并应用安全编码指南和标准\n    *   8.5.1\
  \ 源代码级别的安全弱点和漏洞\n\n在前几章中，您了解了许多通用安全原则，以及帮助安全从业者开发针对恶意个人的充分保护措施的策略和程序机制。本章将深入探讨现场管理员每天面临的一些具体威胁。\n\
  \n这些材料不仅对 CISSP 考试至关重要，也是计算机安全专业人员要有效开展工作必须了解的最基本信息之一。我们将首先审视恶意代码对象（病毒、蠕虫、逻辑炸弹和特洛伊木马）带来的风险。然后我们将了解一些其他的安全漏洞利用手段，这些手段被用于尝试获得对系统的未授权访问，或阻止合法用户获得此类访问。\n\
  \n### 恶意代码\n\n恶意代码对象包括一系列广泛的程序化计算机安全威胁，它们利用各种网络、操作系统、软件和物理安全漏洞，将恶意载荷传播到计算机系统。某些恶意代码对象（如计算机病毒和特洛伊木马）依赖人类不负责任的计算机使用，才能成功地在系统间传播。其他对象（如蠕虫）则凭借自身力量在脆弱系统间迅速蔓延。\n\
  \n所有信息安全从业者都必须熟悉各类恶意代码对象带来的风险，以便制定充分的对策保护其管辖的系统，并在系统遭到入侵时实施适当的响应。\n\n#### 恶意代码的来源\n\
  \n恶意代码从何而来？在计算机安全的早期，恶意代码编写者是极其熟练（尽管方向错误）的软件开发人员，他们以精心设计创新的恶意代码技术为荣。事实上，他们通过揭露流行软件包和操作系统中的安全漏洞，提高了计算机社区的安全意识，实际上起到了某种有用的作用。有关此类代码编写者的示例，请参阅本章后面的侧边栏“RTM\
  \ 与互联网蠕虫”。\n\n现代催生了*脚本小子*——这类恶意个人不理解安全漏洞背后的技术，但从互联网下载现成的软件（或脚本）并用它们对远程系统发起攻击。这一趋势催生了一类新的病毒创建软件，让任何具备最低技术水平的人都能创建病毒并将其释放到互联网上。这反映在迄今为止防病毒专家记录的大量病毒中。业余恶意代码开发者通常只是在尝试他们下载的新工具，或试图给一两个敌人制造麻烦。不幸的是，恶意软件有时会迅速蔓延，给广大互联网用户带来麻烦。\n\
  \n此外，脚本小子使用的工具也可被怀有更邪恶犯罪意图的人自由获取。事实上，国际有组织犯罪集团已知参与恶意软件扩散。这些犯罪分子位于执法薄弱的国家，利用恶意软件窃取世界各地人们的钱财和身份，尤其是美国居民。事实上，Zeus\
  \ 特洛伊木马被广泛认为是东欧有组织犯罪集团的产物，旨在感染尽可能多的系统以记录按键并收集网上银行密码。Zeus 于 2007 年首次出现，但至今仍在不断更新，并不断发现新变种。\n\
  \n\n\n\n### 恶意软件开发的最新趋势伴随着高级持续性威胁（APT）的兴起\n\nAPT 是拥有高超技术技能和大量资金资源的复杂对手。这些攻击者通常是军事单位、情报机构或可能与政府机构有关联的神秘组织。APT\
  \ 攻击者与其他恶意软件作者的主要区别之一在于，这些恶意软件开发者通常能接触到软件供应商尚不知情的零日漏洞。由于供应商不知道该漏洞，因此没有补丁，且该漏洞利用极其有效。APT\
  \ 构建的恶意软件具有高度针对性，旨在仅影响极少数的敌对系统（通常少至一个！），且难以防御。您将在本章后面阅读到 Stuxnet，它是 APT 开发恶意软件的一个例子。\n\
  \n#### 病毒\n\n计算机病毒或许是困扰安全管理员的最早形式的恶意代码。事实上，病毒如今如此普遍，以至于大规模爆发会受到大众媒体的关注，并在普通计算机用户中引发轻度恐慌。据主要杀毒软件供应商赛门铁克称，2016\
  \ 年全球网络上游荡着超过 3.57 亿种恶意代码，且这一趋势仍在继续，一些来源表明每天有 20 万个新的恶意软件变体出现在互联网上！每天有成百上千种病毒变体袭击毫无防备的计算机用户。许多病毒携带恶意载荷，造成的损害范围从在屏幕上显示亵渎性信息，到导致本地硬盘上存储的所有数据彻底销毁不等。\n\
  \n正如生物病毒一样，计算机病毒有两大主要功能——繁殖和破坏。创建病毒的不法分子精心设计代码，以新颖创新的方法实现这些功能，希望能逃避检测并绕过日益复杂的杀毒技术。可以说，病毒编写者和杀毒技术人员之间已经形成了一场军备竞赛，双方都希望开发出比对方领先一步的技术。繁殖功能定义了病毒如何在系统之间传播，感染其经过的每一台机器。病毒的载荷通过实施病毒编写者设想的任何恶意活动来释放破坏力。这可能是任何对系统或数据的机密性、完整性或可用性产生负面影响的行为。\n\
  \n##### 病毒繁殖技术\n\n根据定义，病毒必须包含使其能够在系统之间传播的技术，这需要毫无戒心的计算机用户通过交换磁盘、共享网络资源、发送电子邮件或使用其他方式来共享数据从而提供协助。一旦它们“接触”到一个新系统，就会使用几种繁殖技术之一来感染新受害者并扩大其影响范围。在本节中，我们将介绍四种常见的繁殖技术：主引导记录感染、文件感染、宏感染和服务注入。\n\
  \n###### 主引导记录病毒\n\n`主引导记录 (MBR) 病毒` 是已知最早的病毒感染形式之一。这些病毒攻击 MBR——可启动介质（如硬盘、通用串行总线\
  \ (USB) 或光盘/数字多功能光盘 (CD/DVD)）中计算机在启动过程中用于加载操作系统的那部分。由于 MBR 非常小（通常为 512 字节），它无法容纳实现病毒繁殖和破坏功能所需的所有代码。为了绕过这一空间限制，MBR\
  \ 病毒将其大部分代码存储在存储介质的另一部分上。当系统读取受感染的 MBR 时，病毒会指示它读取并执行存储在该备用位置的代码，从而将整个病毒加载到内存中，并可能触发病毒载荷的释放。\n\
  \n大多数 MBR 病毒通过用户无意中共享的受感染介质在系统之间传播。如果受感染的介质在启动过程中留在驱动器中，目标系统会读取受感染的 MBR，病毒加载到内存中，感染目标系统硬盘上的\
  \ MBR，并将其感染传播到另一台机器。\n\n###### 文件感染型病毒\n\n许多病毒感染不同类型的可执行文件，并在操作系统尝试执行它们时触发。对于基于\
  \ Windows 的系统，这些文件的名称以 `.exe` 和 `.com` 扩展名结尾。`文件感染型病毒` 的繁殖例程可能会轻微修改可执行程序的代码，从而植入病毒复制和破坏系统所需的技术。在某些情况下，病毒实际上可能会用受感染的版本替换整个文件。不使用隐藏技术（如隐身或加密，请参阅本章后面的“病毒技术”部分）的标准文件感染型病毒，通常可以通过比较感染前后的文件特征（如大小和修改日期）或比较哈希值来轻松检测。“杀毒机制”部分提供了这些技术的技术细节。\n\
  \n文件感染型病毒的一个变种是 `伴随病毒`。这些病毒是独立的可执行文件，它们通过使用与合法操作系统文件相似但略有不同的文件名来逃避检测。它们依赖基于 Windows\
  \ 的操作系统在执行程序文件时默认追加的文件名扩展名（按顺序为 `.com`、`.exe` 和 `.bat`）。例如，如果您的硬盘上有一个名为 `game.exe`\
  \ 的程序，伴随病毒可能会使用名称 `game.com`。如果您随后打开命令工具并仅输入 `GAME`，操作系统将执行病毒文件 `game.com`，而不是您实际想要执行的文件\
  \ `game.exe`。这是避免使用快捷方式并完整指定要执行的文件名的一个很好的理由。\n\n###### 宏病毒\n\n许多常见的软件应用程序实现了某种脚本功能，以协助自动化重复性任务。这些功能通常使用简单但强大的编程语言，如\
  \ Visual Basic for Applications (VBA)。虽然宏确实为计算机用户提供了巨大的生产力提升机会，但它们也使系统面临另一种感染途径——宏病毒。\n\
  \n`宏病毒` 于 1990 年代中期首次出现，利用粗糙的技术感染流行的 Microsoft Word 环境中创建的文档。尽管它们相对不复杂，但这些病毒传播迅速，因为杀毒社区未曾预料到它们，因此杀毒应用程序未提供任何针对它们的防御。宏病毒迅速变得司空见惯，供应商争相修改其杀毒平台以扫描应用程序文档中的恶意宏。1999\
  \ 年，Melissa 病毒通过利用 Microsoft Outlook 中的安全漏洞进行复制，借助 Word 文档进行传播。臭名昭著的“我爱你”病毒紧随其后，于\
  \ 2000 年初利用类似的漏洞，向我们展示了快速传播的病毒已困扰我们近 20 年。\n\n在 20 世纪末期宏病毒爆发后，生产力软件开发商对宏开发环境进行了重要更改，限制了不受信任的宏在未获得明确用户许可的情况下运行的能力。这导致宏病毒的流行程度大幅下降。\n\
  \n\n\n\n\n### 服务注入病毒\n\n最近爆发的恶意代码使用了另一种技术来感染系统并逃避检测——将自身注入到操作系统的受信任运行时进程中，例如 `svchost.exe`、`winlogin.exe`\
  \ 和 `explorer.exe`。通过成功破坏这些受信任的进程，恶意代码能够绕过主机上运行的任何防病毒软件的检测。防范服务注入的最佳技术之一，是确保所有允许查看\
  \ Web 内容的软件（浏览器、媒体播放器、辅助应用程序）都接收最新的安全补丁。\n\n#### 易受病毒攻击的平台\n\n正如大多数宏病毒感染运行流行的 Microsoft\
  \ Office 套件应用程序的系统一样，大多数计算机病毒旨在破坏运行世界上最流行的操作系统——Microsoft Windows 各版本的系统的活动。根据 av-test.org\
  \ 2017 年的一项分析，研究人员估计现存恶意软件中有 77% 以 Windows 平台为目标。与过去几年超过 95% 的恶意软件以 Windows 系统为目标相比，这是一个重大变化；这反映了恶意软件开发的转变，开始以移动设备和其他平台为目标。\n\
  \n值得注意的是，2016 年针对 Mac 系统的恶意软件数量增加了两倍（即变为原来的三倍），而针对 Android 设备的恶意软件变体数量在同年翻了一番。底线是，所有操作系统的用户都应意识到恶意软件威胁，并确保已采取足够的防护措施。\n\
  \n#### 防病毒机制\n\n如今投入使用的几乎每台台式计算机都运行着某种防病毒软件包。流行的桌面产品包括 Microsoft Security Essentials、McAfee\
  \ AntiVirus、Avast Antivirus、Trend Micro Antivirus、ESET NOD32 Antivirus、Sophos Antivirus\
  \ 和 Symantec Norton AntiVirus，但市场上还有大量其他产品，提供从单个系统到整个企业的防护；其他软件包旨在防范特定的常见病毒入侵载体，例如入站电子邮件。\n\
  \n绝大多数此类软件包利用一种称为 `signature-based detection`（基于特征码的检测）的方法来识别系统上的潜在病毒感染。本质上，防病毒软件包维护一个极大的数据库，其中包含所有已知病毒的明显特征。根据防病毒软件包和配置设置，它会定期扫描存储介质，检查是否有任何文件包含与这些标准匹配的数据。如果检测到任何匹配项，防病毒软件包将采取以下行动之一：\n\
  \n*   如果软件能够根除病毒，它会对受影响的文件进行消毒，并将计算机恢复到安全状态。\n*   如果软件识别出病毒但不知道如何对文件进行消毒，它可能会隔离这些文件，直到用户或管理员能够手动检查它们。\n\
  *   如果安全设置/策略不允许隔离，或者文件超过了预定义的危险阈值，防病毒软件包可能会删除受感染的文件，以试图保持系统完整性。\n\n使用 `signature-based`（基于特征码的）防病毒软件包时，必须记住：该软件包的有效性仅取决于其所基于的病毒定义文件。如果您不经常更新病毒定义（通常需要年度订阅费），您的防病毒软件将无法检测新创建的病毒。每天都有数以千计的病毒出现在互联网上，过时的定义文件将迅速使您的防线失效。\n\
  \n许多防病毒软件包还使用 `heuristic-based`（基于启发式的）机制来检测潜在的恶意软件感染。这些方法分析软件的行为，寻找病毒活动的明显迹象，例如试图提升权限级别、掩盖电子踪迹以及修改无关或操作系统文件。这种方法过去并未广泛使用，但现在已成为许多组织使用的高级端点保护解决方案的主流。一种常见的策略是让系统隔离可疑文件并将其发送到恶意软件分析工具，在隔离但受监控的环境中执行它们。如果软件在该环境中表现出可疑行为，它将被添加到整个组织的黑名单中，从而快速更新防病毒特征码以应对新威胁。\n\
  \n现代防病毒软件产品能够检测和清除多种类型的恶意代码，然后清理系统。换句话说，防病毒解决方案很少仅限于病毒。这些工具通常还能防范蠕虫、特洛伊木马、逻辑炸弹、Rootkit、间谍软件以及各种其他形式的电子邮件或\
  \ Web 传播代码。如果您怀疑新的恶意代码正在互联网上蔓延，您最好的应对措施是联系您的防病毒软件供应商，询问您针对新威胁的防护状态。不要等到下一次计划内或自动的特征码字典更新。此外，切勿轻信任何第三方关于防病毒解决方案提供的防护状态的说法。请始终直接联系供应商。大多数负责任的防病毒供应商会在发现新的重大威胁后立即向客户发送警报，因此请务必注册此类通知。\n\
  \n其他安全软件包，如流行的 Tripwire 数据完整性保证软件包，也提供辅助防病毒功能。Tripwire 旨在向管理员发出未经授权的文件修改警报。它常用于检测\
  \ Web 服务器篡改和类似攻击，但如果关键系统可执行文件（如 `command.com`）意外被修改，它也可能提供病毒感染的某些预警。这些系统通过维护系统上存储的所有文件的哈希值数据库来工作（有关用于创建这些值的哈希函数的完整讨论，请参见第\
  \ 6 章“密码学和对称密钥算法”）。然后将这些存档的哈希值与当前计算的值进行比较，以检测两个时期之间被修改的任何文件。在最基本的层面上，哈希是一个用于汇总文件内容的数字。只要文件保持不变，哈希值就会保持不变。如果文件被修改，哪怕只是轻微修改，哈希值也会发生巨大变化，表明文件已被修改。除非该操作似乎可以解释（例如，发生在安装新软件、应用操作系统补丁或类似更改之后），否则可执行文件的突然变化可能是恶意软件感染的迹象。\n\
  \n#### 病毒技术\n\n随着病毒检测和根除技术的发展以应对恶意开发者编写的新威胁，旨在击败这些系统的新型病毒也不断涌现。本节将探讨四种使用隐蔽技术试图逃避检测的特定类型病毒——多重病毒、隐形病毒、多态病毒和加密病毒。\n\
  \n##### 多重病毒\n\n`Multipartite viruses`（多重病毒）使用多种传播技术，试图渗透仅针对一种方法进行防御的系统。例如，1993\
  \ 年发现的 Marzia 病毒通过向每个文件添加 2,048 字节的恶意代码来感染关键的 COM 和 EXE 文件，最著名的是 `command.com` 系统文件。这一特征使其成为文件感染型病毒。此外，在感染系统两小时后，它会将恶意代码写入系统的主引导记录，使其也成为引导扇区病毒。\n\
  \n\n\n\n\n### 隐形病毒\n\n**隐形病毒** 通过实际篡改操作系统来隐藏自身，从而欺骗防病毒软件包，使其误以为一切运行正常。例如，隐形引导扇区病毒可能会用恶意代码覆盖系统的主引导记录，但随后也会修改操作系统的文件访问功能以掩盖踪迹。当防病毒软件包请求一份\
  \ MBR 副本时，被修改的操作系统代码会提供给它防病毒软件包所期望看到的内容——一个干净的、不含任何病毒特征码的 MBR 版本。然而，当系统启动时，它会读取被感染的\
  \ MBR 并将病毒加载到内存中。\n\n### 多态病毒\n\n**多态病毒** 在从系统传播到系统的过程中，实际上会修改自身的代码。病毒的传播和破坏技术保持不变，但病毒的特征码在每次感染新系统时都会有所不同。多态病毒创建者希望这种不断变化的特征码能使基于特征码的防病毒软件包失效。然而，防病毒软件供应商已经“破解”了许多多态技术的“代码”，因此当前版本的防病毒软件能够检测已知的多态病毒。不过，供应商生成阻止多态病毒所需的特征文件往往需要更长的时间，这意味着病毒可以在互联网上肆意传播更长一段时间。\n\
  \n### 加密病毒\n\n**加密病毒** 使用加密技术（如第 6 章所述）来避免被检测。从外观上看，它们实际上与多态病毒非常相似——每个被感染的系统上的病毒都有不同的特征码。然而，它们并非通过改变代码来生成这些修改后的特征码；相反，它们改变的是自身在磁盘上的存储方式。加密病毒使用一段非常短的代码，称为\
  \ **病毒解密程序**，其中包含加载和解密存储在磁盘其他位置的主病毒代码所需的加密信息。每次感染都使用不同的加密密钥，导致主代码在每个系统上看起来完全不同。然而，病毒解密程序通常包含明显的特征码，这使得它们容易被更新后的防病毒软件包检测到。\n\
  \n#### 病毒骗局\n\n如果不提及病毒 **骗局** 造成的麻烦和资源浪费，关于病毒的讨论就不算完整。几乎每个电子邮件用户都曾在某个时候收到过朋友或亲戚转发的消息，警告互联网上出现了最新的病毒威胁。这种所谓的“病毒”总是被描述为有史以来破坏力最强的病毒，且没有任何防病毒软件包能够检测和/或清除它。一个著名的骗局例子是“Good\
  \ Times”病毒警告，它最早于 1994 年在互联网上出现，至今仍在流传。\n\n社交媒体格局的变化只是改变了这些骗局的传播方式。除了电子邮件，恶意软件骗局现在还通过\
  \ Facebook、Twitter、WhatsApp、Snapchat 以及其他社交媒体和即时通讯平台传播。\n\n有关此主题的更多信息，辟谣网站 Snopes\
  \ 在 <https://www.snopes.com/tag/virus-hoaxes-realities/> 维护着一个病毒骗局列表。\n\n#### 逻辑炸弹\n\
  \n**逻辑炸弹** 是感染系统并潜伏的恶意代码对象，直到由一个或多个条件（如时间、程序启动、网站登录等）的发生而触发。绝大多数逻辑炸弹是由软件开发人员编入定制应用程序中的，旨在确保如果他们意外离职，其工作成果会被销毁。\n\
  \n与所有恶意代码对象一样，逻辑炸弹形式多样。事实上，许多病毒和特洛伊木马都包含逻辑炸弹组件。著名的“米开朗基罗”病毒于 1991 年被发现时引起了媒体轰动，因为它包含一个逻辑炸弹触发器。该病毒通过共享受感染的软盘感染系统的主引导记录，然后隐藏起来，直到\
  \ 3 月 6 日——著名意大利艺术家米开朗基罗·博那罗蒂的生日。到了那天，它就会发作，重新格式化受感染系统的硬盘驱动器，销毁其中包含的所有数据。\n\n最近，2013\
  \ 年 3 月，一枚逻辑炸弹针对韩国的组织。该恶意软件渗透了韩国媒体公司和金融机构的系统，导致系统瘫痪和数据丢失。在这种情况下，恶意软件攻击触发了军事警报，因为韩国政府怀疑该逻辑炸弹是朝鲜发动攻击的前奏。\n\
  \n#### 特洛伊木马\n\n系统管理员时刻警告计算机用户，除非绝对确定来源可信，否则不要从互联网下载和安装软件。事实上，许多公司严格禁止安装任何未经 IT\
  \ 部门预先审核的软件。这些政策旨在最大限度地降低组织网络被 **特洛伊木马** 攻破的风险——特洛伊木马是一种表面上看似无害，实则携带恶意后台载荷的软件程序，有可能对系统或网络造成严重破坏。\n\
  \n特洛伊木马的功能差异很大。有些会销毁系统上存储的所有数据，试图在尽可能短的时间内造成最大程度的破坏。有些则相对无害。例如，2002 年中，互联网上出现了一系列特洛伊木马，声称能让\
  \ PC 用户在电脑上运行专为微软 Xbox 游戏系统设计的游戏。当用户运行该程序时，它根本无法工作。然而，它还会向 Windows 注册表插入一个值，导致每次计算机启动时都会打开一个特定的网页。特洛伊木马创建者希望通过\
  \ Xbox 特洛伊木马带来的大量页面浏览量产生的广告收入获利。不幸的是，防病毒专家迅速识破了他们的真实意图，该网站被关闭。\n\n近年来对安全社区产生重大影响的一类特洛伊木马是流氓防病毒软件。这种软件通过声称自己是防病毒软件包，往往以模仿安全警报外观的弹窗广告形式，诱骗用户安装。一旦用户安装了该软件，它要么窃取个人信息，要么提示用户付费“更新”流氓防病毒软件。“更新”仅仅是禁用该特洛伊木马！\n\
  \n另一种变体 **勒索软件** 尤为阴险。勒索软件感染目标机器，然后利用加密技术，用仅恶意软件创建者知道的密钥，加密系统上存储的文档、电子表格和其他文件。用户随后无法访问其文件，并会收到一条不祥的弹窗消息，警告除非在短时间内支付赎金，否则文件将被永久删除。用户往往会支付赎金以恢复对文件的访问。最著名的勒索软件变种之一是名为\
  \ Cryptolocker 的程序。\n\n#### 蠕虫\n\n**蠕虫** 对网络安全构成重大风险。它们具有与其他恶意代码对象相同的破坏潜力，但有一个额外的特点——它们无需任何人工干预即可自我传播。\n\
  \n互联网蠕虫是互联网上发生的第一起重大计算机安全事件。自那时以来，数百种新蠕虫（包含数千个变种）在互联网上释放了其破坏力。以下章节将探讨一些具体的蠕虫。\n\n\
  ##### Code Red 蠕虫\n\n\n\n\nCode Red 蠕虫在 2001 年夏季因在运行未修补版本的微软 Internet Information\
  \ Server (IIS) 的 Web 服务器中迅速传播而受到媒体的广泛关注。Code Red 在渗透的系统上执行了三项恶意操作：\n\n*   它随机选择数百个互联网协议\
  \ (IP) 地址，然后探测这些地址，查看它们是否被运行易受攻击版本 IIS 的主机使用。它发现的任何系统都会被迅速攻破。这极大地扩大了 Code Red 的影响范围，因为它感染的每个主机都会寻找许多新目标。\n\
  *   它篡改了本地 Web 服务器上的 HTML 页面，将正常内容替换为以下文本：\n\n```\nWelcome to http://www.worm.com!\n\
  Hacked By Chinese!\n```\n\n*   它植入了一个逻辑炸弹，将针对 IP 地址 `198.137.240.91` 发起拒绝服务攻击，该地址当时属于托管白宫主页的\
  \ Web 服务器。反应迅速的政府网络管理员在攻击真正开始前更改了白宫的 IP 地址。\n\n蠕虫的破坏力对现代互联网构成了极端风险。系统管理员必须确保在软件供应商发布安全补丁时，及时将其应用到连接互联网的系统上。一个典型的例子是，微软在\
  \ Code Red 蠕虫攻击互联网前一个多月就已提供了针对其利用的 IIS 漏洞的安全修复程序。如果安全管理员及时应用了该补丁，Code Red 将会彻底失败。\n\
  \n##### Stuxnet\n\n2010 年中，一款名为 Stuxnet 的蠕虫出现在互联网上。这种高度复杂的蠕虫使用多种先进技术进行传播，包括多个此前未公开的漏洞。Stuxnet\
  \ 使用以下传播技术：\n\n*   搜索本地网络上系统的未受保护管理共享\n*   利用 Windows Server 服务和 Windows 打印后台处理程序服务中的零日漏洞\n\
  *   使用默认数据库密码连接到系统\n*   通过共享受感染的 USB 驱动器进行传播\n\n虽然 Stuxnet 可以肆无忌惮地在系统间传播，但它实际上在寻找一种非常特定类型的系统——使用西门子制造的控制器、据称用于生产核武器材料的系统。当它发现此类系统时，会执行一系列旨在破坏连接到西门子控制器的离心机的操作。\n\
  \nStuxnet 似乎始于中东地区，具体是伊朗境内的系统。据称它是由西方国家设计，意图破坏伊朗的核武器计划。根据《纽约时报》的一篇报道，以色列的一个设施包含用于测试该蠕虫的设备。报道称：“以色列拥有与伊朗几乎相同的核离心机”，并指出“那里的行动，以及美国的相关努力，……是该病毒被设计为美以合作项目以破坏伊朗计划的线索。”\n\
  \n如果这些指控属实，Stuxnet 标志着恶意代码领域的两大演变：利用蠕虫对设施造成重大物理破坏，以及在国家间战争中使用恶意代码。\n\n##### 间谍软件和广告软件\n\
  \n另外两种不需要的软件会干扰你正常使用计算机的方式。*间谍软件* 监视你的操作，并将重要详细信息传输给监视你活动的远程系统。例如，间谍软件可能会等待你登录银行网站，然后将你的用户名和密码传输给间谍软件的创建者。或者，它可能会等待你在电子商务网站上输入信用卡号，然后将其传输给欺诈者以便在黑市上转售。\n\
  \n*广告软件* 虽然在形式上与间谍软件非常相似，但目的不同。它使用多种技术在受感染的计算机上显示广告。最简单形式的广告软件会在你浏览网页时在屏幕上显示弹窗广告。更恶劣的版本可能会监视你的购物行为，并将你重定向到竞争对手的网站。\n\
  \n##### 零日攻击\n\n许多形式的恶意代码利用*零日漏洞*，即由黑客发现但安全社区尚未彻底解决的安全缺陷。系统受这些漏洞影响主要有两个原因：\n\n*\
  \   发现新类型恶意代码与发布补丁和防病毒更新之间必要的延迟。这被称为*脆弱性窗口*。\n*   系统管理员应用更新的迟缓\n\n零日漏洞的存在使得采用纵深防御网络安全方法至关重要，该方法应包含一套多样化的重叠安全控制。这些控制应包括强大的补丁管理计划、最新的防病毒软件、配置管理、应用程序控制、内容过滤和其他防护措施。当这些重叠控制结合使用时，能增加至少有一个控制检测并阻止恶意软件安装尝试的可能性。\n\
  \n### 密码攻击\n\n攻击者用于获取系统非法访问权限的最简单技术之一，是获取授权系统用户的用户名和密码。一旦他们以普通用户身份获得访问权，就获得了系统的立足点。此时，他们可以使用其他技术（包括自动化\
  \ Rootkit 包）来获取系统的更高访问权限（请参阅本章后面的“权限提升和 Rootkit”部分）。他们还可能将受损系统作为跳板，对同一网络上其他更有价值的目标发起攻击。\n\
  \n以下部分将探讨攻击者用于获取合法用户密码并访问系统的三种方法：密码猜测攻击、字典攻击和社会工程学攻击。许多此类攻击依赖于薄弱的密码存储机制。例如，网站可能会在单个文件中存储消息摘要算法\
  \ 5 (MD5) 密码哈希值。如果攻击者能够操纵 Web 服务器软件或操作系统以获取该文件副本，他们就可以利用它进行攻击。\n\n#### 密码猜测\n\n\
  在最基本的密码攻击类型中，攻击者只是简单地尝试猜测用户的密码。无论用户接受多少安全教育，他们往往都会使用极其薄弱的密码。如果攻击者能够获取授权系统用户列表，他们通常能迅速弄清正确的用户名。（在大多数网络中，用户名由用户名字的首字母加上姓氏的一部分组成。）有了这些信息，他们就可以开始对用户的密码进行一些有根据的猜测。最常用的密码是用户姓氏、名字或用户名的某种形式。例如，用户\
  \ `mchapple` 可能会使用薄弱密码 `elppahcm`，因为它容易记忆。不幸的是，它也很容易被猜到。\n\n如果尝试失败，攻击者会转向互联网上广泛可用的最常用密码列表。其中一些如“最常用密码”栏所示。\n\
  \n最后，对一个人稍微了解一些就能为其密码提供极好的线索。许多人使用配偶、孩子、宠物、亲戚或喜爱的艺人名字。常见密码还包括生日、纪念日、社会安全号码、电话号码和自动取款机\
  \ (ATM) 个人识别码 (PIN)。\n\n#### 字典攻击\n\n\n\n\n### Unix 密码存储与攻击\n\n如前所述，许多 Unix 系统将用户密码的加密版本存储在所有系统用户均可访问的\
  \ `/etc/shadow` 文件中。为了提供一定程度的安全性，该文件不包含实际的用户密码；它包含的是通过单向哈希函数获得的哈希版本（关于哈希函数的讨论请参见第\
  \ 7 章“PKI 和加密应用”）。当用户尝试登录系统时，访问验证程序使用相同的哈希函数对用户输入的密码进行哈希处理，然后将其与 `/etc/shadow` 文件中存储的实际密码的哈希版本进行比较。如果数值匹配，则允许用户访问。\n\
  \n密码攻击者使用 `John the Ripper` 等自动化工具运行自动化字典攻击，利用该机制中的一个简单漏洞。它们获取一个包含数千个单词的大型字典文件，然后对所有这些单词运行加密函数以获得其加密等效值。`John\
  \ the Ripper` 随后会在密码文件中搜索任何在加密字典中有匹配项的加密值。找到匹配项时，它会报告用户名和密码（明文），攻击者便获得了系统访问权限。\n\
  \n听起来简单的安全机制和教育本可防止用户使用容易被 `John the Ripper` 猜到的密码，但该工具在攻破实际运行的系统方面却出奇地有效。随着破解工具新版本的发布，引入了更多高级功能来击败用户用于绕过密码复杂性规则的常见技巧。其中一些列举如下：\n\
  \n*   重新排列字典单词的字母\n*   在字典单词后附加数字\n*   将字典单词中每次出现的字母 `O` 替换为数字 `0`（或将字母 `l` 替换为数字\
  \ `1`）\n*   以某种形式组合两个字典单词\n\n彩虹表攻击是字典攻击的一种变体，旨在减少对哈希密码进行暴力攻击所需的时间。在此攻击中，攻击者获取一份常用密码列表，然后通过系统使用的相同哈希函数运行它们，以创建这些密码的哈希版本。生成的哈希值列表称为*彩虹表*。在密码哈希的简单实现中，攻击者随后只需在哈希值列表中搜索彩虹表中包含的值，即可确定用户密码。第\
  \ 7 章讨论的加盐技术解决了此问题。详情请参阅该章中的侧边栏“加盐保护密码”。\n\n#### 社会工程学\n\n*社会工程学*是攻击者用于获取系统访问权限的最有效工具之一。其最基本的形式，就是简单地给用户打电话并索要密码，冒充技术支持代表或其他需要立即获取该信息的权威人物。幸运的是，大多数现代计算机用户都知晓这些骗局，直接向用户索要密码的有效性在今天已有所降低。取而代之的是，这些攻击依赖于网络钓鱼邮件，提示用户使用其实际用户名和密码登录到一个伪造网站，随后攻击者捕获这些凭据并用于登录实际网站。网络钓鱼攻击通常以金融服务网站为目标，因为用户凭据可用于快速转移现金。除了诱骗用户交出密码外，网络钓鱼攻击还常被用于诱使用户安装恶意软件或提供其他敏感个人信息。\n\
  \n网络钓鱼消息正变得日益复杂，旨在极度类似合法通信。例如，图 21.1 所示的网络钓鱼消息被发送给数千名收件人，伪装成社会保障局的官方通信。点击链接的用户被重定向到一个恶意网站，该网站窃取了他们的敏感信息。\n\
  \n网络钓鱼还有许多常见变体。其中一些包括：\n\n*   *鱼叉式网络钓鱼* 攻击基于攻击者的调查研究，专门针对特定个人。它们可能包含旨在使消息显得更真实的个人信息。\n\
  *   *鲸钓* 攻击是鱼叉式网络钓鱼攻击的一个子集，针对高价值目标，如高级管理人员。\n*   *语音钓鱼* 攻击通过语音通信（如电话）使用网络钓鱼技术。\n\
  \n![图 21.1 社会保障局网络钓鱼消息  ¶ 图片来源：美国社会保障局](img/c21f001.jpg)\n\n**图 21.1** 社会保障局网络钓鱼消息\
  \  ¶ 图片来源：美国社会保障局\n\n尽管用户越来越精明，社会工程学仍对密码安全（以及网络安全整体）构成重大威胁。攻击者往往可以通过与计算机用户、爱说闲话的办公室职员和行政人员“套近乎”来获取敏感个人信息。这些信息在发起密码猜测攻击时可提供极佳的“弹药”。此外，攻击者有时还能获取敏感的网络拓扑或配置数据，这些数据在策划针对组织的其他类型电子攻击时非常有用。\n\
  \n*垃圾箱搜寻* 是社会工程学的一种变体，攻击者字面意义上地翻找目标公司的垃圾，搜寻敏感信息。该技术很容易通过粉碎纸质文件和擦除电子介质来防范，但垃圾箱搜寻者在其努力中仍出奇地成功。\n\
  \n#### 对策\n\n任何安全计划的基石都是教育。安全人员应不断提醒用户选择安全密码并保密的重要性。用户初入组织时应接受培训，并应定期接受复习培训，即使只是来自管理员提醒威胁的一封电子邮件。\n\
  \n为用户提供创建安全密码所需的知识。告知他们攻击者猜测密码时使用的技巧，并给出关于如何创建强密码的建议。最有效的技巧之一是使用一个非常长的短语，例如“My son\
  \ Richard likes to eat four pies”（我儿子理查德喜欢吃四个馅饼），而不是短密码。如果系统不允许使用长通行短语，可考虑使用记忆辅助工具，如用一个长短语中每个单词的首字母组成密码。例如，“My\
  \ son Richard likes to eat four pies”将变为 `MsRlte4p`——一个极其强壮的密码。您可能还希望考虑为用户提供一个安全工具，允许存储这些强密码。`Password\
  \ Safe` 和 `LastPass` 是两个常用示例。这些工具允许用户为他们使用的每个服务创建独特、强壮的密码，而无需承担记住所有密码的负担。\n\n过度热心的安全管理员犯的一个错误是创建一系列强密码，然后分配给用户（并阻止用户更改密码）。乍一看，这似乎是一个合理的安全策略。然而，用户收到像\
  \ `1mf0A8flt` 这样的密码时，第一件事就是把它写在便利贴上，贴在键盘底下。哎呀！安全就这么飞出窗外了（或藏在键盘底下）！\n\n### 应用攻击\n\
  \n在第 20 章中，您了解了在开发操作系统和应用程序时利用可靠的软件工程流程的重要性。在以下章节中，您将简要了解攻击者用于利用粗糙编码实践留下的漏洞的一些具体技术。\n\
  \n#### 缓冲区溢出\n\n\n\n\n### 缓冲区溢出漏洞\n\n当开发人员未能正确验证用户输入以确保其大小合适时，就会存在*缓冲区溢出*漏洞。过大的输入可能会“溢出”数据结构，从而影响计算机内存中存储的其他数据。例如，如果一个\
  \ Web 表单包含一个字段，该字段关联到一个允许 10 个字符的后端变量，但表单处理器未验证输入的长度，操作系统可能会尝试直接将数据写入该变量预留内存空间的末尾之后，从而可能破坏内存中存储的其他数据。在最坏的情况下，这些数据可被用于覆盖系统命令，允许攻击者利用缓冲区溢出漏洞在服务器上执行任意命令。\n\
  \n在创建软件时，开发人员必须特别注意允许用户输入的变量。许多编程语言本身并不强制限制变量的大小——它们依赖程序员在代码中执行边界检查。这是一种固有的漏洞，因为许多程序员认为参数检查是一种不必要的负担，会拖慢开发进程。作为安全从业者，你有责任确保组织中的开发人员了解缓冲区溢出漏洞带来的风险，并采取适当措施保护代码免受此类攻击。\n\
  \n每当程序变量允许用户输入时，程序员都应采取措施确保满足以下每个条件：\n\n*   用户无法输入长度超过将容纳该输入的任何缓冲区大小的值（例如，将一个 10\
  \ 字母的单词输入到一个 5 字母的字符串变量中）。\n*   用户无法输入将容纳该输入的变量类型所不允许的无效值（例如，向数字变量输入字母）。\n*   用户无法输入会导致程序在其指定参数之外运行的值（例如，对一个“是”或“否”的问题回答“也许”）。\n\
  \n未能执行简单的检查以确保满足这些条件，可能会导致缓冲区溢出漏洞，这可能导致系统崩溃，甚至允许用户执行 Shell 命令并获取系统访问权限。缓冲区溢出漏洞在使用\
  \ `Common Gateway Interface (CGI)` 或其他允许非熟练程序员快速创建交互式网页的语言快速开发的 Web 代码中尤为普遍。大多数缓冲区溢出漏洞可通过软件和操作系统供应商提供的补丁来缓解，这凸显了保持系统和软件最新的重要性。\n\
  \n#### 检查时间到使用时间\n\n*检查时间到使用时间 (TOCTOU or TOC/TOU)* 问题是一种时序漏洞，当程序在资源请求发生前过早地检查访问权限时就会发生。例如，如果操作系统在用户登录时构建一份详尽的访问权限列表，然后在整个登录会话期间查阅该列表，则存在\
  \ TOCTOU 漏洞。如果系统管理员撤销了特定权限，该限制直到用户下次登录时才会生效。如果用户在访问权限被撤销时已登录，他们将无限期地保留对该资源的访问权。用户只需保持会话打开数天，新的限制就永远不会被应用。\n\
  \n#### 后门\n\n*后门* 是未记录的命令序列，允许知晓后门的人绕过正常的访问限制。它们通常在开发和调试过程中使用，以加快工作流程，避免强制开发人员持续向系统进行身份验证。有时，开发人员会在系统达到生产状态后意外地或为了能在系统处理他们本不应有权访问的敏感数据时“窥探一下”而将这些后门留在系统中。除了开发人员植入的后门外，许多类型的恶意代码会在受感染系统上创建后门，允许恶意代码的开发者远程访问受感染系统。\n\
  \n无论它们以何种方式出现在系统上，后门的未记录性质使其成为任何包含它们的系统安全的重大威胁。知晓后门的个人可能利用它访问系统、检索机密信息、监控用户活动或从事其他邪恶行为。\n\
  \n#### 权限提升和 Rootkit\n\n一旦攻击者在系统上站稳脚跟，他们通常会迅速转向第二个目标——将访问权限从可能已被攻破的普通用户账户扩展到更全面的管理访问权限。他们通过实施*权限提升攻击*来实现这一点。\n\
  \n攻击者发动权限提升攻击最常见的方式之一是通过使用*Rootkit*。Rootkit 在互联网上免费提供，并利用各种操作系统中的已知漏洞。攻击者通常通过密码攻击或社会工程学获得标准系统用户账户的访问权限，然后使用\
  \ Rootkit 将其访问权限提升到 root（或管理员）级别。这种从标准权限到管理权限的访问权限增加被称为权限提升攻击。\n\n管理员可以采取一个简单的预防措施来保护其系统免受权限提升攻击，这并非什么新鲜事。管理员必须及时了解其环境中使用的操作系统发布的新安全补丁，并始如一地应用这些补救措施。这一简单直接的步骤将使网络能够抵御几乎所有的\
  \ Rootkit 攻击以及大量其他潜在漏洞。\n\n### Web 应用程序安全\n\nWeb 让你足不出户就能购买机票、查收邮件、支付账单和购买股票。如今几乎每个企业都运营着一个网站，许多网站允许你通过该站点进行敏感交易。\n\
  \n除了 Web 应用程序带来的便利性优势外，还伴随着一系列新的漏洞，这些漏洞可能使支持 Web 的组织面临安全风险。在接下来的几节中，我们将介绍一些常见的 Web\
  \ 应用程序攻击。关于 Web 应用程序安全的更多详细信息，请参阅第 9 章“安全漏洞、威胁和对策”。\n\n#### 跨站脚本\n\n当 Web 应用程序包含某种类型的*反射输入*时，会发生*跨站脚本\
  \ (XSS) 攻击*。例如，考虑一个简单的 Web 应用程序，它包含一个文本框，要求用户输入姓名。当用户点击提交时，Web 应用程序加载一个新页面，显示“Hello,\
  \ *name*。”\n\n在正常情况下，此 Web 应用程序按设计运行。然而，恶意个人可能利用此 Web 应用程序欺骗不知情的第三方。正如你所知，可以通过使用超文本标记语言\
  \ (HTML) 标签 `<SCRIPT>` 和 `</SCRIPT>` 在网页中嵌入脚本。假设你不在“姓名”字段中输入 *Mike*，而是输入以下文本：\n\n\
  ```\nMike<SCRIPT>alert('hello')</SCRIPT>\n```\n\n当 Web 应用程序以网页形式“反射”此输入时，你的浏览器会像处理任何其他网页一样处理它：显示网页的文本部分并执行脚本部分。在本例中，脚本只是打开一个弹出窗口，其中显示“hello”。然而，你可以更恶意地包含一个更复杂的脚本，要求用户提供密码并将其传输给恶意第三方。\n\
  \n\n\n\n\n此时，你可能会问自己，怎么会有人落入这种攻击的圈套。毕竟，你不会通过在提供给执行反射的 Web 应用程序的输入中嵌入脚本来攻击自己。这种攻击的关键在于：可以在链接中嵌入表单输入。恶意人员可以创建一个网页，其中包含一个标题为“查看您在第一银行的账户”的链接，并在该链接中编码表单输入。当用户访问该链接时，网页看起来像是一个真实的第一银行网站（因为它确实是！），工具栏中显示着正确的地址，且拥有有效的数字证书。然而，该网站随后会执行恶意用户在输入中包含的脚本，该脚本看起来是有效网页的一部分。\n\
  \n跨站脚本攻击的对策是什么？当你创建允许任何类型用户输入的 Web 应用程序时，必须确保执行 `input validation`（输入验证）。在最基本的层面上，你绝不应允许用户在反射输入字段中包含\
  \ `<SCRIPT>` 标签。然而，这并不能完全解决问题；对于勤奋的 Web 应用程序攻击者来说，还有许多巧妙的替代手段可用。最佳解决方案是确定你 `will`（将）允许的输入类型，然后验证输入以确保其符合该模式。例如，如果你有一个允许用户输入年龄的文本框，你应该只接受一到三位数字作为输入。你的应用程序应拒绝任何其他输入作为无效输入。\n\
  \n##### 跨站请求伪造\n\n`Cross-site request forgery`（跨站请求伪造）攻击，缩写为 XSRF 或 CSRF 攻击，与跨站脚本攻击相似，但利用的是不同的信任关系。XSS\
  \ 攻击利用用户对网站的信任，在用户的计算机上执行代码。XSRF 攻击利用远程站点对用户系统的信任，代表用户执行命令。\n\nXSRF 攻击的原理是基于一个合理的假设：用户通常同时登录到许多不同的网站。攻击者随后在一个网站中嵌入代码，该代码向第二个网站发送命令。当用户点击第一个网站上的链接时，他或她会在不知情的情况下向第二个网站发送命令。如果用户碰巧登录了第二个网站，该命令可能会成功。\n\
  \n例如，考虑一个在线银行网站。如果攻击者想从用户账户窃取资金，攻击者可能会去一个在线论坛发布一条包含链接的消息。该链接实际上是一个直接指向资金转账网站的链接，会发出一条将资金转入攻击者账户的命令。攻击者随后将该链接留在论坛上，等待毫无戒心的用户点击该链接。如果用户碰巧登录了银行网站，转账就会成功。\n\
  \n开发人员应保护其 Web 应用程序免受 XSRF 攻击。一种方法是创建使用安全令牌的 Web 应用程序，攻击者无法知道该令牌以将其嵌入链接中。另一种防护措施是网站检查从最终用户接收到的请求中的引用\
  \ URL，并且只接受源自其自身站点的请求。\n\n##### SQL 注入\n\n从组织的角度来看，`Structured Query Language (SQL)\
  \ injection attacks`（结构化查询语言 [SQL] 注入攻击）比 XSS 攻击风险更大。与 XSS 攻击一样，SQL 注入攻击利用 Web 应用程序的意外输入。然而，SQL\
  \ 注入攻击不是利用此输入试图欺骗用户，而是利用它来获得对底层数据库的未授权访问。\n\n###### 动态 Web 应用程序\n\n在 Web 早期，所有网页都是\
  \ `static`（静态）的，即不变的。网站管理员创建包含信息的网页并将其放置在 Web 服务器上，用户可以使用其 Web 浏览器检索这些网页。Web 迅速超越了这一模式，因为用户希望能够根据其个人需求访问定制信息。例如，银行网站的访问者不仅对包含银行位置、营业时间和服务信息的静态页面感兴趣。他们还想检索包含其个人账户信息的\
  \ `dynamic`（动态）内容。显然，网站管理员不可能在 Web 服务器上为每个用户创建包含该用户个人账户信息的页面。对于一家大型银行来说，这将需要维护数百万个包含最新信息的页面。这就是动态\
  \ Web 应用程序发挥作用的地方。\n\n当用户发出请求时，Web 应用程序利用数据库按需创建内容。在银行示例中，用户登录 Web 应用程序，提供账号和密码。然后，Web\
  \ 应用程序从银行数据库检索当前账户信息，并利用它即时创建一个包含用户当前账户信息的网页。如果该用户一小时后返回，Web 服务器将重复该过程，从数据库获取更新的账户信息。图\
  \ 21.2 说明了此模型。\n\n![图 21.2 典型的数据库驱动网站架构 ](img/c21f002.jpg)\n\n**图 21.2** 典型的数据库驱动网站架构\n\
  \n作为安全专业人员，这对你意味着什么？Web 应用程序增加了我们传统安全模型的复杂性。如图 21.2 所示，Web 服务器作为一台公开可访问的服务器，属于与其他服务器分离的网络区域，通常称为非军事区\
  \ (DMZ)。另一方面，数据库服务器不打算供公众访问，因此它属于内部网络。Web 应用程序需要访问数据库，因此防火墙管理员必须创建一条规则，允许从 Web 服务器访问数据库服务器。这条规则为互联网用户访问数据库服务器创建了一条潜在路径。（有关防火墙和\
  \ DMZ 的更多信息，请参见第 11 章“安全网络架构和保护网络组件”。）如果 Web 应用程序功能正常，它将只允许对数据库进行授权请求。然而，如果 Web\
  \ 应用程序存在缺陷，它可能会允许个人通过使用 SQL 注入攻击，以意想不到且未经授权的方式篡改数据库。\n\n###### SQL 注入攻击\n\nSQL 注入攻击允许恶意个人直接对底层数据库执行\
  \ SQL 事务，这违反了图 21.2 所示的隔离模型。\n\n在前面使用的示例中，银行客户可能会输入账号以访问一个检索当前账户详细信息的动态 Web 应用程序。Web\
  \ 应用程序必须使用 SQL 查询来获取该信息，其形式可能如下，其中 `<number>` 是用户在 Web 表单上提供的账号：\n\n```\nSELECT\
  \ *\nFROM transactions\nWHERE account_number = '<number>'\n```\n\n还有一个重要事实你需要知道：数据库将同时处理多条\
  \ SQL 语句，前提是每条语句都以分号结尾。\n\n如果 Web 应用程序不执行适当的输入验证，用户可能会将自己的 SQL 代码插入由 Web 服务器执行的语句中。例如，如果用户的账号是\
  \ 145249，他们可以输入以下内容：\n\n```\n145249'; DELETE * FROM transactions WHERE 'a' = 'a\n\
  ```\n\n然后 Web 应用程序会顺从地将其插入前面 SQL 语句中的 `<number>` 字段，导致如下结果：\n\n```\nSELECT *\nFROM\
  \ transactions\nWHERE account_number ='145249'; DELETE * FROM transactions WHERE\
  \ 'a' = 'a'\n```\n\n稍微重新格式化该命令，得到如下内容：\n\n```\nSELECT *\nFROM transactions\nWHERE\
  \ account_number ='145249';\nDELETE *\nFROM transactions\nWHERE 'a' = 'a'\n```\n\
  \n\n\n\n\n### 防范 SQL 注入\n\n这是一个包含两条语句的有效 SQL 事务。第一条语句从数据库检索请求的信息。第二条语句删除数据库中存储的所有记录。糟糕！\n\
  \n您可以使用三种技术来保护 Web 应用程序免受 SQL 注入攻击：\n\n#### 使用预处理语句\n\nWeb 应用程序开发人员应利用预处理语句来限制应用程序执行任意代码的能力。预处理语句（包括参数化查询和存储过程）将\
  \ SQL 语句存储在数据库服务器上，只有拥有适当访问权限的数据库管理员和开发人员才能对其进行修改。调用预处理语句的 Web 应用程序可以向其传递参数，但无法更改\
  \ SQL 语句的底层结构。\n\n#### 执行输入验证\n\n正如本章前面在讨论跨站脚本时所述，输入验证允许您限制用户在表单中提供的数据类型。就我们在上一节提供的\
  \ SQL 注入示例而言，从输入中移除单引号字符（`'`）将防止该攻击成功实施。最强且最安全的输入验证形式是白名单验证，即开发人员指定预期输入的确切性质（例如，小于\
  \ 1024 的整数或少于 20 个字符的字母数字字符串），然后代码在将用户提供的输入提交给数据库之前验证其是否与预期模式匹配。\n\n### 限制账户权限\n\
  \nWeb 服务器使用的数据库账户应仅拥有尽可能小的权限集。如果 Web 应用程序仅需检索数据，则应仅赋予其该能力。在该示例中，如果账户仅具有 `SELECT`\
  \ 权限，`DELETE` 命令将会失败。\n\n### 侦察攻击\n\n虽然恶意代码通常依赖于诱骗用户打开或访问恶意软件，但其他攻击则直接针对机器。执行侦察可让攻击者发现弱点，以便直接用其攻击代码进行瞄准。为协助这种定位，攻击工具开发者创建了许多执行网络侦察的自动化工具。在以下章节中，我们将介绍其中三种自动化技术——IP\
  \ 探测、端口扫描和漏洞扫描——然后解释这些技术如何通过更费力的垃圾箱翻找技术得到补充。\n\n#### IP 探测\n\n**IP 探测**（也称为 **IP\
  \ 扫描** 或 **Ping 扫描**）通常是针对目标网络进行的第一种网络侦察类型。使用此技术时，自动化工具只是尝试 Ping 指定范围内的每个地址。响应 Ping\
  \ 请求的系统会被记录下来以供进一步分析。不产生响应的地址被假定为未使用而被忽略。\n\nIP 探测在当今的互联网上极为普遍。事实上，如果您为系统配置了公共 IP\
  \ 地址并将其连接到互联网，您可能会在启动后几小时内收到至少一次 IP 探测。这种技术的广泛使用为禁用 Ping 功能（至少针对网络外部用户）提供了有力的理由。\n\
  \n#### 端口扫描\n\n攻击者执行 IP 探测后，会得到网络上活动系统的列表。下一个任务是选择一个或多个系统作为目标，对其发动进一步的攻击。通常，攻击者心中已有目标类型；Web\
  \ 服务器、文件服务器和支持关键操作的其他服务器是主要目标。\n\n为缩小搜索范围，攻击者使用 **端口扫描** 软件探测网络上所有活动系统，以确定每台机器上运行的公共服务。例如，如果攻击者想以\
  \ Web 服务器为目标，他们可能会运行端口扫描以定位运行在端口 80（超文本传输协议 (HTTP) 服务的默认端口）上的服务的系统。管理员应利用此信息禁用其控制下系统上不必要的服务。这会减少系统的攻击面，使攻击者更难找到发起攻击的立足点。\n\
  \n#### 漏洞扫描\n\n第三种技术是 **漏洞扫描**。一旦攻击者确定了要攻击的特定系统，他们需要发现该系统中可被利用以获取所需访问权限的特定漏洞。互联网上有各种工具可协助完成此任务。用于此目的的较流行工具包括\
  \ Nessus、OpenVAS、Qualys、Core Impact 和 Nexpose。这些工具包含已知漏洞的数据库，并探测目标系统以定位安全缺陷。随后，它们会生成非常详尽的报告，详细列出检测到的每个漏洞。从那时起，只需找到利用特定漏洞的脚本并针对受害者发动攻击即可。\n\
  \n重要的是要注意，漏洞扫描器是高度自动化的工具。它们可用于针对特定系统发动攻击，但攻击者同样可能使用一系列 IP 探测、端口扫描和漏洞扫描来缩小潜在受害者名单。然而，入侵者很有可能会针对整个网络运行漏洞扫描器，以探测任何可被利用的弱点。\n\
  \n再次强调，只需将操作系统更新至最新的安全补丁级别，即可修复漏洞扫描器报告的几乎所有弱点。此外，明智的系统管理员会学会像敌人一样思考——他们下载并针对自己的网络运行这些漏洞扫描器（在获得高层管理许可的情况下），以查看潜在攻击者可能会发现哪些安全漏洞。这使他们能够迅速将资源集中在加固网络中最薄弱的环节上。\n\
  \n### 伪装攻击\n\n获取您原本无权使用的资源的最简单方法之一，是冒充拥有适当访问权限的人。在现实世界中，青少年经常借用年长兄弟姐妹的驾照购买酒精，计算机安全领域也会发生同类事情。攻击者借用合法用户和系统的身份来获取第三方的信任。在以下章节中，我们将介绍两种常见的伪装攻击——IP\
  \ 欺骗和会话劫持。\n\n#### IP 欺骗\n\n在 **IP 欺骗攻击** 中，恶意人员只需重新配置其系统，使其拥有受信任系统的 IP 地址，然后尝试访问其他外部资源。在许多未安装足够过滤器以防止此类流量的网络上，这出奇地有效。系统管理员应在每个网络的边界配置过滤器，以确保数据包至少满足以下标准：\n\
  \n*   具有内部源 IP 地址的数据包不从外部进入网络。\n*   具有外部源 IP 地址的数据包不从内部离开网络。\n*   具有私有 IP 地址的数据包不向任何方向通过路由器（除非作为内部网配置的一部分被特别允许）。\n\
  \n这三条简单的过滤规则可以消除绝大多数 IP 欺骗攻击，并极大地增强网络安全。\n\n#### 会话劫持\n\n当恶意人员拦截授权用户与资源之间通信的一部分，然后使用劫持技术接管会话并假冒授权用户身份时，就会发生会话劫持攻击。以下列表包含一些常见技术：\n\
  \n*   捕获客户端与服务器之间认证的详细信息，并使用这些详细信息假冒客户端身份\n\n\n\n\n*   诱骗客户端误以为攻击者的系统是服务器，在客户端与服务器建立合法连接时充当中间人，然后断开客户端的连接\n\
  *   使用未正确关闭连接的用户的 Cookie 数据访问 Web 应用程序\n\n所有这些技术都可能给最终用户带来灾难性后果，必须通过管理控制（如防重放认证技术）和应用程序控制（如在合理时间内使\
  \ Cookie 过期）来加以解决。\n\n### 概要\n\n应用程序开发人员有很多操心的事！随着黑客工具和技术日益复杂，应用层因其复杂性和多个脆弱点，正日益成为攻击的焦点。\n\
  \n恶意代码（包括病毒、蠕虫、特洛伊木马和逻辑炸弹）利用应用程序和操作系统中的漏洞，或利用社会工程学感染系统，并获取其资源和机密信息的访问权。\n\n应用程序本身也可能包含许多漏洞。缓冲区溢出攻击利用缺乏适当输入验证的代码来影响系统内存的内容。后门为前开发人员和恶意代码作者提供了绕过正常安全机制的能力。Rootkit\
  \ 为攻击者提供了一种简便的方式来实施提权攻击。\n\n许多应用程序正在转向 Web，这创造了新的暴露和脆弱性层面。跨站脚本攻击允许黑客诱骗用户向不安全的网站提供敏感信息。SQL\
  \ 注入攻击允许绕过应用程序控制，直接访问和操纵底层数据库。\n\n侦察工具为攻击者提供了自动化工具，可用于识别稍后可能被攻击的脆弱系统。IP 探测、端口扫描和漏洞扫描都是检测组织安全控制薄弱点的自动化方法。伪装攻击使用隐蔽技术，允许冒充用户和系统。\n\
  \n### 考试要点\n\n**理解病毒使用的传播技术。** 病毒使用四种主要传播技术——文件感染、服务注入、引导扇区感染和宏感染——来渗透系统并传播其恶意载荷。你需要理解这些技术，以有效保护网络上的系统免受恶意代码侵害。\n\
  \n**了解杀毒软件包如何检测已知病毒。** 大多数杀毒程序使用基于特征码的检测算法来查找已知病毒的明显模式。这使得定期更新病毒定义文件以维持对新出现病毒的防护变得至关重要。基于行为的检测也越来越普遍，杀毒软件监控目标系统的异常活动，并将其阻止或标记以供调查，即使该软件不匹配已知的恶意软件特征码。\n\
  \n**解释攻击者用于破坏密码安全的技术。** 密码是当今最常用的访问控制机制，理解如何防范试图破坏其安全性的攻击者至关重要。了解密码破解工具、字典攻击和社会工程学攻击（如网络钓鱼）如何被用来击败密码安全。\n\
  \n**熟悉攻击者用于利用编写糟糕的软件的各种应用程序攻击类型。** 应用程序攻击是现代计算面临的最大威胁之一。攻击者利用缓冲区溢出、后门、检查时间到使用时间\
  \ (TOCTOU) 漏洞和 Rootkit 来获取对系统的非法访问。安全专业人员必须清楚地了解这些攻击中的每一种及相关的对策。\n\n**理解常见的 Web\
  \ 应用程序漏洞和对策。** 随着许多应用程序转移到 Web，开发人员和安全专业人员必须了解此环境中存在的新型攻击以及如何防范它们。最常见的两个例子是跨站脚本\
  \ (XSS) 和 SQL 注入攻击。\n\n**了解攻击者在准备攻击网络时使用的网络侦察技术。** 在发起攻击前，攻击者使用 IP 扫描搜寻网络上的活动主机。然后对这些主机进行端口扫描和其他漏洞探测，以定位可能被攻击以破坏网络的薄弱点。你应该了解这些攻击，以帮助保护你的网络免受其害，限制攻击者可能获取的信息量。\n\
