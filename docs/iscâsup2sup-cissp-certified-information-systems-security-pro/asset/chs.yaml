  \        *   1.12.3 计划有效性评估\n*   **领域 6：安全评估与测试**\n    *   6.3.5 培训与意识\n\n![images](img/clogo.jpg)\
  \ `CISSP` 认证考试通用知识体系 (`CBK`) 中的安全与风险管理领域涉及安全解决方案的许多基础要素。这些包括设计、实施和管理安全机制所必需的要素。\n\
  \n本领域的其他要素在不同章节中讨论：第 1 章“通过原则和政策进行安全治理”；第 3 章“业务连续性规划”；第 4 章“法律、法规与合规性”。请务必复习所有这些章节，以对本领域的主题有完整的了解。\n\
  \n由于硬件和软件控制的复杂性和重要性，员工的安全管理在整体安全规划中常被忽视。本章探讨安全的人的因素，从建立安全的招聘实践和职位描述到开发员工基础设施。此外，我们还将探讨员工培训、管理和离职实践如何被视为创建安全环境的组成部分。最后，我们将研究如何评估和管理安全风险。\n\
  \n## 人员安全政策和程序\n\n人是任何安全解决方案中最薄弱的环节。无论部署了什么物理或逻辑控制，人都能发现避开、规避、颠覆或禁用它们的方法。因此，在为环境设计和部署安全解决方案时，必须考虑到用户的人性因素。要理解和应用安全治理，必须解决安全链中最薄弱的环节——即人。\n\
  \n与人相关的问题、故障和妥协发生在安全解决方案开发的所有阶段。这是因为人参与了任何解决方案的开发、部署和持续管理的全过程。因此，必须评估用户、设计师、程序员、开发人员、管理者和实施者对该过程的影响。\n\
  \n招聘新员工通常涉及几个不同的步骤：创建 `职位描述`，设定职位分类，筛选求职候选人，以及招聘和培训最适合该职位的人选。没有职位描述，就无法就应聘用何种类型的人员达成共识。因此，编写职位描述是定义与人员相关的安全需求并寻找新员工的第一步。一些组织认识到角色描述和职位描述的区别。角色通常与等级或权限级别对齐，而职位描述映射到具体分配的职责和任务。\n\
  \n人员应因组织需要其特定技能和经验而被录用。组织内任何职位的职位描述都应涉及相关安全问题。必须考虑的事项包括该职位是否需要处理敏感材料或访问机密信息。实际上，职位描述定义了员工执行工作任务所需分配的角色。职位描述应定义该职位在安全网络上所需的访问类型和程度。一旦解决了这些问题，为职位描述分配安全分类就相当标准了。\n\
  \n\n\n\n\n### 构建职位描述的重要要素\n\n符合组织流程的职位描述构建要素包括职责分离、工作职责和轮岗制度。\n\n#### 职责分离\n\n**职责分离**是一种安全概念，即将关键、重要和敏感的工作任务分配给多个独立的管理员或高级操作员（图\
  \ 2.1）。这可以防止任何单个人拥有破坏或颠覆关键安全机制的能力。可以将职责分离视为将最小权限原则应用于管理员。职责分离也是一种防止串通的保护措施。**串通**是指两人或多人为欺诈、盗窃或间谍活动等目的而进行的负面活动。通过限制个人的权限，职责分离要求员工必须与他人合作才能实施更大规模的违规行为。寻找他人协助违规以及实施违规的行为更有可能留下证据并被发现，从而直接减少了串通的发生（通过威慑力，即他们可能被抓住的机会）。因此，串通难以实施，且在实施行为前增加了发起者的风险。\n\
  \n![FIGURE 2.1 An example of separation of duties related to five admin tasks and\
  \ seven administrators](img/c02f001.jpg)\n\n**图 2.1** 与五项管理任务和七名管理员相关的职责分离示例\n\n\
  #### 工作职责\n\n**工作职责**是员工需要定期执行的具体工作任务。根据其职责，员工需要访问各种对象、资源和服务。在安全网络中，必须根据员工的工作任务授予其相关要素的访问权限。为保持最高安全性，访问权限应根据最小权限原则进行分配。**最小权限原则**规定，在安全环境中，用户应仅被授予完成其所需工作任务或工作职责所必需的最低访问权限。真正应用这一原则需要对所有资源和功能进行低层级的细粒度控制。\n\
  \n#### 轮岗制度\n\n**轮岗制度**，即在多个职位间轮换员工，是组织提升整体安全性的一种手段（图 2.2）。轮岗具有两大功能。首先，它提供了一种知识冗余。当多名员工都能胜任多个职位所需的工作任务时，即使一名或多名员工因疾病或其他事件长期无法工作，组织也不太可能遭遇严重的停机或生产力损失。\n\
  \n![FIGURE 2.2 An example of job rotation among management positions](img/c02f002.jpg)\n\
  \n**图 2.2** 管理职位间轮岗的示例\n\n其次，人员流动可以降低欺诈、数据篡改、盗窃、破坏和信息滥用的风险。一个人在特定职位上工作的时间越长，越有可能被分配额外的工作任务，从而扩大其特权和访问权限。随着一个人对其工作任务越来越熟悉，他们可能会滥用特权谋取私利或出于恶意。如果一名员工实施了滥用或误用行为，另一名了解该职位和工作职责的员工将更容易发现。因此，轮岗也提供了一种同行审计的形式，并防止串通。\n\
  \n轮岗要求审查安全特权和访问权限，以维持最小权限原则。轮岗、交叉培训和长期任职员工的一个顾虑在于他们持续积累特权和访问权限，其中许多是他们不再需要的。特权、权限、权利、访问权限等的分配应定期审查，以检查是否存在特权蔓延或与工作职责不符的情况。**特权蔓延**是指随着工作职责的变化，员工随着时间的推移积累特权。最终结果是，根据该员工当前的工作职责，其拥有的特权超出了最小权限原则的规定。\n\
  \n当数人合谋犯罪时，称为串通。采用职责分离、受限工作职责和轮岗原则，可以降低同事因被发现风险较高而愿意合作实施非法或滥用计划的可能性。通过严格监控特殊特权（如管理员、备份操作员、用户管理员等的特权），可以减少串通和其他特权滥用。\n\
  \n职位描述不仅用于招聘流程；它们应在组织的整个生命周期内得到维护。只有通过详细的职位描述，才能将一个人*应该*负责的内容与他们*实际*负责的内容进行比较。确保职位描述尽可能少地重叠，且一名员工的职责不发生偏移或侵占他人的职责，是一项管理任务。同样，管理者应审计特权分配，确保员工不会获得完成工作任务并不严格要求的访问权限。\n\
  \n### 候选人筛选与招聘\n\n特定职位的应聘候选人筛选基于职位描述定义的敏感性和分级。特定职位的敏感性和分级取决于该职位人员因意外或故意违反安全规定可能造成的危害程度。因此，筛选过程的彻底程度应反映待填补职位的安全级别。\n\
  \n应聘候选人筛选、背景调查、推荐人核查、学历验证和安全许可验证，是证明候选人胜任、合格且值得信赖、可担任安全职位的基本要素。**背景调查**包括获取候选人的工作和教育经历；核查推荐人；验证学历；面谈同事、邻居和朋友；查阅警方和政府记录以了解是否有被捕或违法活动；通过指纹、驾照和出生证明验证身份；以及进行面谈。此过程还可能包括测谎测试、药物测试和性格测试/评估。\n\
  \n执行在线背景调查和审查申请人的社交网络账户，已成为许多组织的标准做法。如果潜在员工在其照片分享网站、社交网络简介或公共即时通讯服务上发布了不当材料，那么与那些没有发布此类材料的人相比，他们就不是那么有吸引力的候选人。当我们在公众视野中的行为以文本、照片或视频形式被记录并发布到网上时，它们就变成了永久记录。通过查看一个人的在线身份，可以快速了解其态度、智力、忠诚度、常识、勤奋、诚实、尊重、一致性以及对社会规范和/或企业文化的遵守情况的总体画像。\n\
  \n### 雇佣协议与政策\n\n\n\n\n当聘用新员工时，他们应签署雇佣协议。此类文件概述了组织的规则和限制、安全策略、可接受的使用和活动策略、职位描述的详细信息、违规行为及后果，以及员工担任该职位的时长。这些项目可能是单独的文件。在这种情况下，雇佣协议用于核实应聘者已阅读并理解其意向职位的相关文档。\n\
  \n除了雇佣协议外，可能还有其他必须处理的安全相关文档。一种常见的文档是 `保密协议 (NDA)`。NDA 用于保护组织内的机密信息不被前员工泄露。当一个人签署\
  \ NDA 时，即表示同意不向组织外的任何人泄露任何被定义为机密的信息。违反 NDA 通常会面临严厉的处罚。\n\n在员工的整个雇佣生命周期中，管理者应定期审核每位员工的职位描述、工作任务、特权和职责。工作任务和特权随时间推移而发生偏移是常见现象。这可能导致某些任务被忽视，而其他任务被重复执行多次。偏移或特权蔓延也可能导致安全违规。定期审查每个职位描述的边界与实际发生情况的关系，有助于将安全迷违规降至最低。\n\
  \n此审查过程的一个关键部分是强制执行强制休假。在许多安全环境中，会利用为期一到两周的强制休假来审核和验证员工的工作任务和特权。休假将员工从工作环境中移开，并安排另一名员工顶替其职位，这使得更容易发现原员工的滥用职权、欺诈或疏忽行为。\n\
  \n#### 入职与离职流程\n\n`入职` 是将新员工添加到组织身份与访问管理 (IAM) 系统的过程。当员工的角色或职位发生变化，或被授予额外的特权或访问权限时，也会使用入职流程。\n\
  \n`离职` 是这一过程的逆向操作。它是指员工离开组织后，将其身份从 IAM 系统中移除。这可能包括禁用和/或删除用户账户、吊销证书、取消访问代码，以及终止其他特别授予的特权。这还可能包括通知保安和其他物理访问管理人员，今后禁止该人员进入大楼。\n\
  \n入职和离职的程序应有明确的文档记录，以确保应用的一致性，并遵守法规或合同义务。\n\n入职也可以指组织社会化。这是通过培训新员工，使其做好充分准备以履行工作职责的过程。它可以包括培训、职业技能获取和行为适应，旨在高效地将员工融入现有的组织流程和程序中。设计良好的入职流程可带来更高的工作满意度、更高的生产力、更快地与现有员工融合、增强组织忠诚度、减轻压力，并降低离职率。在职责分离和工作责任的背景下，设计良好的入职流程的另一个好处是，它应用了前文讨论的最小权限原则。\n\
  \n当必须解雇或离职一名员工时，必须处理许多问题。安全部门与人力资源部 (HR) 之间的紧密关系对于在解雇过程中保持控制和将风险降至最低至关重要。员工解雇流程或程序策略对于在必须将不满的员工从组织中移除时维护安全环境至关重要。被解雇员工的反应可能从冷静、理解的接受，到暴力、破坏性的愤怒不等。必须设计并实施一项明智的处理解雇的程序，以减少事故。\n\
  \n员工的 `解雇` 应以私密且尊重的方式处理。但这并不意味着不应采取预防措施。解雇时应至少有一名证人在场，最好是高层管理人员和/或保安。一旦告知员工其被解雇，应护送其离开场所，且不允许其在无人陪同的情况下以任何理由返回工作区域。在员工离开前，应收回所有组织专用的识别证件、访问或安全徽章以及卡片、钥匙和访问令牌（图\
  \ 2.3）。通常，解雇员工的最佳时间是工作周中段的下班时分。工作周前半段解雇可给前员工时间申请失业救济和/或在周末前开始寻找新工作。此外，下班时分解雇允许员工与其他员工一起自然离开，从而减轻压力。\n\
  \n![图 2.3 前员工必须归还所有公司财产](img/c02f003.jpg)\n\n**图 2.3** 前员工必须归还所有公司财产\n\n在可能的情况下，应进行\
  \ `离职面谈`。但这通常取决于员工获释时的精神状态和许多其他因素。如果离职面谈在解雇后无法立即进行，应尽快进行。离职面谈的主要目的是根据雇佣协议、保密协议和任何其他安全相关文档，审查前员工所承担的责任和限制。\n\
  \n以下清单列出了应尽快处理的一些其他问题：\n\n*   确保员工归还其车辆或家中存放的任何组织设备或物资。\n*   移除或禁用员工的网络用户账户。\n*\
  \   通知人力资源部发放最后一笔工资、支付未使用的假期工资，并终止福利覆盖。\n*   安排安全部门成员陪同被解雇员工从工作区域收集个人物品。\n*   通知所有安保人员以及监控任何入口点的其他人员，确保前员工在无人陪同的情况下不得尝试重新进入大楼。\n\
  \n在大多数情况下，您应在通知员工被解雇的同时，或就在通知之前，禁用或移除其系统访问权限。如果该员工能够访问机密数据，或拥有修改或破坏数据或服务的专业知识或访问权限，这一点尤为重要。未能限制被解雇员工的活动，会使您的组织面临各种漏洞，包括物理财产和逻辑数据的盗窃与破坏。\n\
  \n#### 供应商、顾问和承包商协议与控制\n\n供应商、顾问和承包商控制用于定义外部实体、个人或组织的绩效水平、期望、薪酬和后果。这些控制通常在称为 `服务级别协议\
  \ (SLA)` 的文档或策略中定义。\n\n\n\n### 使用 SLA\n\n使用 SLA（服务级别协议）是一种日益流行的方式，旨在确保向内部和/或外部客户提供服务的组织，维持服务提供商与供应商双方商定的适当服务水平。为任何数据电路、应用程序、信息处理系统、数据库或其他对组织持续生存能力至关重要的关键组件制定\
  \ SLA，是一个明智之举。在使用任何类型的第三方服务提供商（包括云服务）时，SLA 显得尤为重要。SLA 通常涉及以下问题：\n\n*   系统正常运行时间（占总运行时间的百分比）\n\
  *   最大连续停机时间（以秒/分钟等为单位）\n*   峰值负载\n*   平均负载\n*   诊断责任\n*   故障切换时间（如果已部署冗余）\n\nSLA\
  \ 通常还包含财务及其他合同补救措施，一旦协议未被遵守，这些措施即刻生效。例如，如果关键电路中断超过 15 分钟，服务提供商可能同意免除该电路一周的所有费用。\n\
  \nSLA 以及供应商、顾问和承包商控制是风险降低和风险规避的重要组成部分。通过明确界定对外部方的期望和惩罚措施，所有相关方都知道对他们的要求是什么，以及未能满足这些期望时将面临什么后果。尽管使用外部提供商执行各种业务功能或服务可能非常具有成本效益，但这会通过扩大潜在攻击面和漏洞范围而增加潜在风险。除了确保以合理价格提供优质及时的服务外，SLA\
  \ 还应重点关注保护和改善安全性。有些 SLA 是固定不可调整的，而另一些则允许您对其内容有重大影响。您应确保 SLA 支持您的安全策略和基础设施原则，而不是与之冲突，否则可能会引入弱点、漏洞或例外情况。\n\
  \n### 合规策略要求\n\n**合规** 是遵守或坚守规则、策略、法规、标准或要求的行为。合规是 **安全治理** 的一项重要关注点。在人员层面，合规关乎个别员工是否遵循公司策略，并按照既定程序执行工作任务。许多组织依赖员工合规来维持高水平的质量、一致性、效率和成本节约。如果员工不保持合规，可能会在利润、市场份额、认可度和声誉方面给组织造成损失。员工需要接受培训，了解他们需要做什么（即遵守安全策略中定义的公司标准，并遵守诸如\
  \ `Payment Card Industry Data Security Standard (PCI DSS)` 之类的合同义务，以维持执行信用卡处理的能力）；只有在此之后，才能让他们对违规或不合规行为负责。\n\
  \n### 隐私策略要求\n\n**隐私** 是一个难以定义的概念。该术语在许多语境中频繁使用，却缺乏量化或限定。以下是关于隐私的一些部分定义：\n\n*  \
  \ 积极防止未经授权访问可识别个人身份的信息（即可直接关联到个人或组织的数据点）\n*   免受未经授权访问被视为个人或机密的信息\n*   在未经同意或不知情的情况下，免受被观察、监控或审查\n\
  \n在 IT 领域处理隐私问题时，通常需要在个人权利与组织的权利或活动之间进行平衡。有人主张个人有权控制是否可以收集关于他们的信息以及如何使用这些信息。也有人主张，任何在公众视野中进行的活动——例如通过\
  \ `LC internet` 进行的大多数活动，或在公司设备上进行的活动——都可以在被监视者不知情或未获许可的情况下进行监控，且从这种监控中收集的信息可用于组织认为适当或理想的任何目的。\n\
  \n保护个人免受不必要的观察、直复营销以及私人、个人或机密细节的泄露，通常被认为是一项值得的努力。然而，一些组织声称人口统计研究、信息收集和聚焦营销能改善商业模式、减少广告浪费，并为所有当事方节省资金。\n\
  \n关于隐私，存在许多立法和监管合规问题。许多美国法规——如 `Health Insurance Portability and Accountability\
  \ Act (HIPAA)`《健康保险流通与责任法案》、`Sarbanes-Oxley Act of 2002 (SOX)》《2002 年萨班斯-奥克斯利法案》、`Family\
  \ Educational Rights and Privacy Act (FERPA)》《家庭教育权利和隐私法案》以及 `Gramm-Leach-Bliley\
  \ Act`《格雷姆-里奇-比利雷法案》——以及欧盟的 `Directive 95/46/EC`（即 `Data Protection Directive》《数据保护指令》）、`General\
  \ Data Protection Regulation (GDPR)`《通用数据保护条例》（`Regulation (EU) 2016/679`）和合同要求\
  \ `Payment Card Industry Data Security Standard (PCI DSS)`《支付卡行业数据安全标准》——均包含隐私要求。了解组织必须遵守的所有政府法规并确保合规非常重要，尤其是在隐私保护领域。\n\
  \n无论您个人或组织对在线隐私问题持何种立场，都必须在组织安全策略中加以解决。隐私问题不仅关乎您在线服务的外部访问者，还关乎您的客户、员工、供应商和承包商。如果您收集任何关于任何个人或公司的信息类型，就必须处理隐私问题。\n\
  \n在大多数情况下，特别是当隐私被侵犯或受到限制时，必须告知相关个人和公司；否则，您可能面临法律后果。在允许或限制个人使用电子邮件、保留电子邮件、记录电话通话、收集上网或消费习惯信息等情况下，也必须处理隐私问题。\n\
  \n### 安全治理\n\n**安全治理** 是与支持、定义和指导组织安全工作相关的实践集合。安全治理与企业治理和 IT 治理密切相关，且常相互交织。这三种治理议程的目标通常相互关联或相同。例如，组织治理的一个共同目标是确保组织持续存在并随时间增长或扩展。因此，这三种治理形式的目标都是在追求增长和弹性的同时维持业务流程。\n\
  \n**第三方治理** 是可能由法律、法规、行业标准、合同义务或许可要求强制规定的监督体系。实际的治理方式可能各异，但通常涉及外部调查员或审计员。这些审计员可能由管理机构指定，也可能是目标组织聘请的顾问。\n\
  \n第三方治理的另一个方面是对组织所依赖的第三方实施安全监督。许多组织选择将业务运营的各个方面外包。外包运营可包括安保、维护、技术支持和会计服务。这些第三方需要遵守主要组织的安全立场。否则，它们会给主要组织带来额外的风险和漏洞。\n\
  \n\n\n\n\n### 第三方治理\n\n第三方治理侧重于验证是否遵守既定的安全目标、要求、法规和合同义务。现场评估可提供对某地点所采用安全机制的第一手了解。执行现场评估或审计的人员需要遵循审计协议（如信息及相关技术控制目标\
  \ [COBIT]），并拥有一份待调查的具体需求清单。\n\n在审计和评估过程中，目标组织和治理机构都应参与充分且公开的文档交换与审查。组织需要了解其必须遵守的所有要求的完整细节。组织应将安全策略和自我评估报告提交回治理机构。这种公开的文档交换确保所有相关方就所有关注的问题达成一致。它降低了未知需求或不切实际期望的可能性。文档交换并不随着文书或电子文件的传输而结束，而是引入文档审查流程。\n\
  \n**文档审查** 是阅读交换材料并根据标准和期望对其进行验证的过程。文档审查通常在任何现场检查发生之前执行。如果交换的文档充分且符合期望（或至少满足要求），那么现场审查将能够专注于对既定文档的合规性验证。然而，如果文档不完整、不准确或以其他方式不充分，则现场审查将推迟，直到文档得到更新和修正。这一步骤很重要，因为如果文档不合规，该地点极有可能也不合规。\n\
  \n在许多情况下，特别是涉及政府或军事机构或承包商时，未能提供满足第三方治理要求的充分文档，可能导致**运行授权 (ATO)** 丧失或失效。完整且充分的文档通常可以维持现有的\
  \ ATO 或提供临时 ATO (TATO)。然而，一旦 ATO 丧失或被撤销，通常需要进行完整的文档审查和现场审查并展示全面合规，才能重新建立 ATO。\n\n\
  文档审查的一部分是对业务流程和组织策略进行逻辑和实践层面的调查。此审查确保既定和已实施的业务任务、系统及方法切实可行、高效、具有成本效益，最重要的是（至少在安全治理方面）它们支持通过减少漏洞以及避免、减少或缓解风险来实现安全目标。风险管理、风险评估和应对风险都是执行流程/策略审查所涉及的方法和技术。\n\
  \n### 理解并应用风险管理概念\n\n安全旨在防止数据丢失或泄露，同时维持授权访问。某事物可能发生并导致数据或其他资源遭到破坏、销毁或泄露的可能性称为风险。理解风险管理概念不仅对\
  \ CISSP 考试很重要，对于建立充分的安全态势、适当的安全治理，以及尽职照管和尽职调查的法律证明也至关重要。\n\n因此，管理风险是维持安全环境的一个要素。**风险管理**\
  \ 是一个详细的过程，包括识别可能损害或泄露数据的因素，结合数据价值和对策成本评估这些因素，并实施具有成本效益的解决方案以缓解或降低风险。风险管理的整体过程用于制定和实施信息安全策略。这些策略的目标是降低风险并支持组织的使命。\n\
  \n风险管理的主要目标是将风险降低到可接受的级别。该级别实际是什么，取决于组织、其资产价值、预算规模以及许多其他因素。一个组织可能认为某事属于可接受风险，而另一个组织可能认为同一事物属于不可接受的高风险。无法设计和部署一个完全无风险的环境；然而，显著降低风险是可能的，且通常只需付出很少努力。\n\
  \nIT 基础设施面临的风险并非全都是基于计算机的。事实上，许多风险来自非计算机源。在为组织执行风险评估时，考虑所有可能的风险非常重要。未能妥善评估和应对所有形式的风险将使公司处于脆弱状态。请记住，IT\
  \ 安全（通常称为逻辑或技术安全）只能针对逻辑或技术攻击提供保护。要保护 IT 免受物理攻击，必须建立物理防护措施.\n\n实现风险管理目标的过程称为**风险分析**。它包括检查环境中的风险，评估每个威胁事件发生的可能性及其造成损害的成本，评估各种风险对策的成本，并为高层管理人员创建保护措施的成本/效益报告。除了这些以风险为中心的活动外，风险管理还要求对组织内的所有资产进行评估、估价和价值分配。如果没有适当的资产估值，就无法对风险进行优先级排序并将其与可能的损失进行比较。\n\
  \n#### 风险术语\n\n风险管理采用大量术语，必须清晰理解这些术语，尤其是针对 CISSP 考试。本节定义并讨论所有重要的风险相关术语：\n\n#####\
  \ 资产\n\n**资产** 是环境中应受保护的任何事物。它是业务流程或任务中使用的任何事物。它可以是计算机文件、网络服务、系统资源、进程、程序、产品、IT 基础设施、数据库、硬件设备、家具、产品配方/公式、知识产权、人员、软件、设施等。如果组织对其控制下的某项物品赋予任何价值，并认为该物品重要到足以保护，则出于风险管理和分析的目的，该物品被标记为资产。资产的丢失或泄露可能导致整体安全受损、生产力下降、利润减少、额外支出、组织终止以及许多无形后果。\n\
  \n##### 资产估值\n\n**资产估值** 是基于实际成本和非货币性支出分配给资产的美元价值。这些成本可能包括开发、维护、管理、宣传、支持、修理和更换资产的成本；也可能包括更难以捉摸的价值，如公众信心、行业支持、生产力提升、知识权益和所有权收益。资产估值将在本章后面详细讨论。\n\
  \n\n\n\n\n#### 威胁\n\n任何可能导致组织或特定资产产生不良或意外结果的潜在事件都是*威胁*。威胁是指任何可能导致资产损坏、破坏、篡改、丢失或泄露，或者可能阻断访问或妨碍资产维护的行为或不作为。威胁可以是大是小，导致的后果也可以是大是小。它们可以是有意的，也可以是意外的。它们可能源于人员、组织、硬件、网络、结构或自然。威胁主体会有意地利用漏洞。威胁主体通常是人员，但也可能是程序、硬件或系统。威胁事件是对漏洞的意外和有意利用。它们也可以是自然的或人为的。威胁事件包括火灾、地震、洪水、系统故障、人为错误（由于缺乏培训或疏忽）和停电。\n\
  \n#### 漏洞\n\n资产中的弱点，或防护措施/对策的缺失或薄弱，即为*漏洞*。\n\n换句话说，漏洞是 IT 基础设施或组织任何其他方面存在的缺陷、漏洞、疏忽、错误、局限性、脆弱性或易感性。如果漏洞被利用，可能会导致资产损失或损坏。\n\
  \n#### 暴露\n\n*暴露*是指因威胁而易遭受资产损失；存在漏洞被威胁主体或事件利用的可能性。暴露并不意味着已实现的威胁（导致损失的事件）正在实际发生（对已实现威胁的暴露称为经历暴露）。它只是意味着如果存在漏洞且有能利用它的威胁，就存在威胁事件或潜在暴露发生的可能性。理解暴露的另一种方式是回答“最坏的结果会是什么？”这个问题。你并不是陈述危害已经发生或必将发生，而只是说明存在危害的可能性，以及这种危害可能有多广泛或严重。定量风险分析中的暴露因子（EF）值即源于此概念。\n\
  \n#### 风险\n\n*风险*是威胁利用漏洞对资产造成危害的可能性或几率。它是对概率、可能性或机会的评估。威胁事件发生的可能性越大，风险就越高。每一个暴露实例都是一种风险。用公式表示时，风险可定义为：\n\
  \n```\nrisk = threat * vulnerability\n```\n\n因此，减少威胁主体或漏洞中的任何一个都会直接导致风险降低。\n\n当风险成为现实时，*威胁主体*、*威胁行为体*或*威胁事件*已利用漏洞，导致一个或多个资产遭受损害或泄露。安全的全部目的是通过消除漏洞、阻断威胁主体和威胁事件对资产的危害，防止风险成为现实。作为一种风险管理工具，安全是防护措施的实施。\n\
  \n#### 防护措施\n\n*防护措施*、*安全控制*或*对策*是指任何能消除或减少漏洞、或针对一个或多个特定威胁提供保护的事物。防护措施可以是安装软件补丁、进行配置变更、雇佣安保人员、变更基础设施、修改流程、完善安全策略、更有效地培训人员、给周界围栏通电、安装照明等。它是指组织内任何能通过消除或减轻威胁或漏洞来降低风险的行动或产品。防护措施是缓解或消除风险的唯一手段。重要的是要记住，防护措施、安全控制或对策不一定非要购买新产品；重新配置现有元素，甚至从基础设施中移除元素，也是有效的防护措施。\n\
  \n#### 攻击\n\n*攻击*是威胁主体对漏洞的利用。换句话说，攻击是指任何试图利用组织安全基础设施漏洞以造成资产损坏、丢失或泄露的有意行为。攻击也可以被视为任何违反或未能遵守组织安全策略的行为。\n\
  \n#### 违规\n\n*违规*是指安全机制被威胁主体绕过或挫败的事件。当违规与攻击相结合时，可能导致渗透或入侵。渗透是指威胁主体通过绕过安全控制获得了对组织基础设施的访问权限，并能直接威胁资产的状态。\n\
  \n资产、威胁、漏洞、暴露、风险和防护措施这些要素是相互关联的，如图 2.4 所示。威胁利用漏洞，从而导致暴露。暴露即风险，风险通过防护措施来缓解。防护措施保护受威胁危害的资产。\n\
  \n![图 2.4 风险要素 ](img/c02f004.jpg)\n\n**图 2.4** 风险要素\n\n#### 识别威胁和漏洞\n\n风险管理的一个基本部分是识别和检查威胁。这涉及为组织已识别的资产创建一份详尽的所有可能威胁清单。该清单应包括威胁主体和威胁事件。重要的是要记住，威胁可能来自任何地方。IT\
  \ 威胁不局限于 IT 来源。在编制威胁清单时，请务必考虑以下因素：\n\n*   病毒\n*   级联错误（一系列不断升级的错误）和依赖性故障（由依赖不存在的事件或项目引起）\n\
  *   授权用户的犯罪活动（间谍活动、知识产权窃取、挪用公款等）\n*   移动（振动、震动等）\n*   故意攻击\n*   重组\n*   授权用户患病或流行病\n\
  *   恶意黑客\n*   不满的员工\n*   用户错误\n*   自然灾害（地震、洪水、火灾、火山、飓风、龙卷风、海啸等）\n*   物理损坏（挤压、抛射物、电缆切断等）\n\
  *   数据、资源或服务的滥用\n*   数据分类或安全策略的变更或妥协\n*   政府、政治或军事的入侵或限制\n*   处理错误、缓冲区溢出\n*   人员特权滥用\n\
  *   温度极端\n*   能量异常（静电、电磁脉冲、射频 [RF]、断电、电压浪涌等）\n*   数据丢失\n*   信息战\n*   破产或业务活动的变更/中断\n\
  *   编码/编程错误\n*   入侵者（物理和逻辑）\n*   环境因素（气体、液体、生物体的存在等）\n*   设备故障\n*   物理盗窃\n*   社会工程学\n\
  \n在大多数情况下，风险评估和分析应由团队而非单个个人执行。此外，团队成员应来自组织内的不同部门。通常不要求所有团队成员都是安全专业人员，甚至不要求是网络/系统管理员。基于组织人口统计特征的团队多样性将有助于详尽地识别和应对所有可能的威胁和风险。\n\
  \n#### 风险评估/分析\n\n风险管理/分析主要是高层管理人员的工作。他们有责任通过定义工作的范围和目的，发起并支持风险分析和评估。执行风险分析的实际过程通常委托给安全专业人员或评估团队。然而，所有风险评估、结果、决策和结果都必须被高层管理人员理解并批准，作为提供审慎应有照顾的一个要素。\n\
  \n\n\n\n### 所有 IT 系统都存在风险\n\n所有 IT 系统都存在风险。无法消除 100% 的所有风险。相反，高层管理人员必须决定哪些风险是可接受的，哪些是不可接受的。确定哪些风险是可接受的，需要进行详细且复杂的资产和风险评估。\n\
  \n一旦你制定了威胁清单，就必须单独评估每个威胁及其相关风险。有两种风险评估方法：定量和定性。**定量风险分析**为资产损失分配实际的美元数字。**定性风险分析**为资产损失分配主观且无形的价值。这两种方法对于完整的风险分析都是必要的。大多数环境采用这两种风险评估方法的混合体，以获得对其安全顾虑的平衡视角。\n\
  \n#### 定量风险分析\n\n定量方法产生具体的概率百分比。这意味着最终结果是一份报告，其中包含风险等级、潜在损失、对策成本和保护措施价值的美元数字。这份报告通常相当容易理解，尤其是对于熟悉电子表格和预算报告的人来说。可以将定量分析视为给风险分配数量的行为——换句话说，就是为每个资产和威胁标上价格。然而，纯粹的定量分析是不够的；并非分析的所有要素和方面都可以量化，因为其中一些是定性的、主观的或无形的。\n\
  \n定量风险分析的过程始于资产估值和威胁识别。接下来，你需要估算每种风险的潜在程度和频率。然后利用这些信息计算各种成本函数，用于评估保护措施。\n\n定量风险分析的六个主要步骤或阶段如下（图\
  \ 2.5）：\n\n1.  盘点资产，并分配价值（资产价值，即 `AV`）。（资产价值将在本章后面名为“资产估值”的部分进一步详述。）\n2.  调查每项资产，并列出每个单独资产的所有可能威胁。对于列出的每个威胁，计算暴露因子（`EF`）和单次损失期望值（`SLE`）。\n\
  3.  执行威胁分析，计算每个威胁在一年内实现的可能性——即年化发生率（`ARO`）。\n4.  通过计算年化损失期望值（`ALE`）得出每个威胁的总体损失潜力。\n\
  5.  针对每个威胁研究对策，然后根据应用的对策计算 `ARO` 和 `ALE` 的变化。\n6.  对每个资产的每个威胁的每个对策执行成本/效益分析。为每个威胁选择最合适的响应。\n\
  \n![图 2.5 定量风险分析的六大要素](img/c02f005.jpg)\n\n**图 2.5** 定量风险分析的六大要素\n\n与定量风险分析相关的成本函数包括暴露因子、单次损失期望值、年化发生率和年化损失期望值：\n\
  \n##### 暴露因子\n\n**暴露因子（`EF`）** 代表如果特定资产因已实现的风险而受到侵害，组织将经历的损失百分比。`EF` 也称为损失潜力。在大多数情况下，已实现的风险不会导致资产的完全损失。`EF`\
  \ 仅表示因单一已实现风险而导致的预期总体资产价值损失。对于易于替换的资产（如硬件），`EF` 通常较小。对于不可替代或专有的资产（如产品设计或客户数据库），`EF`\
  \ 可能非常大。`EF` 以百分比表示。\n\n##### 单次损失期望值\n\n计算 `SLE` 需要 `EF`。**单次损失期望值（`SLE`）** 是针对特定资产的单一已实现风险所关联的成本。它表明如果资产因特定威胁发生而受损，组织将经历的确切损失金额。\n\
  \n`SLE` 使用以下公式计算：\n\n*   `SLE = 资产价值 (AV) * 暴露因子 (EF)`\n*   或者更简单地：\n*   `SLE =\
  \ AV * EF`\n\n`SLE` 以美元价值表示。例如，如果一项资产价值 200,000 美元，且针对特定威胁的 `EF` 为 45%，则该资产针对该威胁的\
  \ `SLE` 为 90,000 美元。\n\n##### 年化发生率\n\n**年化发生率（`ARO`）** 是特定威胁或风险在一年内发生（即实现）的预期频率。`ARO`\
  \ 的范围可以从 0.0（零），表示该威胁或风险永远不会实现，到一个非常大的数字，表示该威胁或风险频繁发生。计算 `ARO` 可能很复杂。它可以源自历史记录、统计分析或猜测。`ARO`\
  \ 计算也称为概率确定。某些威胁或风险的 `ARO` 是通过将单次发生的可能性乘以可能发起该威胁的用户数量来计算的。例如，塔尔萨市发生地震的 `ARO` 可能为\
  \ .00001，而旧金山发生地震的 `ARO` 可能为 .03（针对 6.7 级以上），或者你可以将塔尔萨市地震的 `ARO` .00001 与塔尔萨市某办公室电子邮件病毒的\
  \ `ARO` 10,000,000 进行比较。\n\n##### 年化损失期望值\n\n**年化损失期望值（`ALE`）** 是特定已实现威胁针对特定资产的所有实例可能产生的年度成本。\n\
  \n`ALE` 使用以下公式计算：\n\n*   `ALE = 单次损失期望值 (SLE) * 年化发生率 (ARO)`\n*   或者更简单地：\n*   `ALE\
  \ = SLE * ARO`\n\n例如，如果一项资产的 `SLE` 为 90,000 美元，且特定威胁（如完全断电）的 `ARO` 为 .5，则 `ALE`\
  \ 为 45,000 美元。另一方面，如果特定威胁（如用户账户泄露）的 `ARO` 为 15，则 `ALE` 将为 1,350,000 美元。\n\n为每个资产和每个威胁/风险计算\
  \ `EF`、`SLE`、`ARO` 和 `ALE` 是一项艰巨的任务。幸运的是，定量风险评估软件工具可以简化并自动化这一过程的大部分工作。这些工具生成带有估值的资产清单，然后利用预定义的\
  \ `ARO` 以及一些自定义选项（即行业、地理位置、IT 组件等），生成风险分析报告。通常涉及以下计算：\n\n##### 计算实施保护措施后的年化损失期望值\n\
  \n除了确定保护措施的年成本外，还必须计算实施保护措施后该资产的 `ALE`。这需要针对该保护措施特定的新 `EF` 和 `ARO`。在大多数情况下，即使应用了保护措施，资产的\
  \ `EF` 保持不变。（回想一下，`EF` 是风险实现时所遭受的损失金额。）换句话说，如果保护措施失效，资产会受到多大损害？可以这样考虑：如果你穿了防弹衣，但防弹衣未能阻止子弹穿透你的心脏，你仍然会遭受与未穿防弹衣时相同的伤害。因此，如果保护措施失效，资产上的损失通常与没有保护措施时相同。然而，某些保护措施*确实*能减少由此产生的损害，即使它们未能完全阻止攻击。例如，虽然火灾仍可能发生，且设施可能因火灾和喷淋系统的水而受损，但总损失可能比整栋楼烧毁要小。\n\
  \n\n\n即使 EF 保持不变，保护措施也会改变 ARO。事实上，保护措施的全部意义在于降低 ARO。换句话说，保护措施应减少攻击成功造成资产损害的次数。最理想的保护措施会将\
  \ ARO 降至零。虽然存在一些完美的保护措施，但大多数并非如此。因此，许多保护措施的应用后 ARO 比未防护时的 ARO 要小（希望是小得多），但通常不为零。有了新的\
  \ ARO（以及可能的新 EF），即可计算应用保护措施后的新 ALE。\n\n计算出实施保护措施前的 ALE 和实施后的 ALE 后，执行成本/收益分析还需要一个值：保护措施的年成本。\n\
  \n##### 计算保护措施成本\n\n对于每个特定风险，必须从成本/收益角度评估一种或多种保护措施（或对策）。为执行此评估，必须先为每个威胁编制保护措施清单。然后为每个保护措施分配一个部署值。实际上，必须衡量保护措施的部署值或成本与受保护资产的价值。因此，受保护资产的价值决定了保护机制的最大支出。安全应具有成本效益，因此用于保护资产的现金或资源不应超过该资产对组织的价值。如果对策成本大于资产价值（即风险成本），则应接受该风险。\n\
  \n计算对策价值涉及众多因素：\n\n*   采购、开发和许可成本\n*   实施和定制成本\n*   年度运营、维护、管理等成本\n*   年度维修和升级成本\n\
  *   生产力提升或损失\n*   环境变更\n*   测试和评估成本\n\n了解保护措施的潜在成本后，即可评估其应用于基础设施后的收益。如前所述，保护措施的年成本不应超过预期的资产年损失成本。\n\
  \n##### 计算保护措施成本/收益\n\n此过程中的最终计算之一是*成本/收益计算*或*成本/收益分析*，以确定保护措施是否在不过高成本的前提下真正提高了安全性。为判断保护措施是否在财务上合理，请使用以下公式：\n\
  \n> 实施保护措施前的 ALE – 实施保护措施后的 ALE – 保护措施年成本（ACS）= 保护措施对公司的价值\n\n如果结果为负，则该保护措施在财务上不是负责任的选择。如果结果为正，则该值代表组织部署该保护措施可能获得的年节省额，因为发生率不等于发生保证。\n\
  \n评估保护措施时，不应仅考虑其带来的年节省或损失。还应考虑法律责任和审慎尽职调查问题。在某些情况下，部署保护措施亏损比冒资产泄露或损失时的法律责任风险更合理。\n\
  \n回顾一下，要执行保护措施的成本/收益分析，必须计算以下三个要素：\n\n*   资产-威胁组合的实施对策前 ALE\n*   资产-威胁组合的实施对策后 ALE\n\
  *   ACS（保护措施的年成本）\n\n有了这些要素，即可得出此特定保护措施针对特定风险、特定资产的成本/收益公式值：\n\n*   （实施对策前 ALE –\
  \ 实施对策后 ALE）– ACS\n\n或更简单地表示为：\n\n*   （ALE1 – ALE2）– ACS\n\n成本/收益公式计算结果值最大的对策，针对特定的资产-威胁组合部署最具经济意义。\n\
  \n表 2.1 展示了定量风险分析相关的各种公式。\n\n###### 表 2.1 定量风险分析公式\n\n| 概念 | 公式 |\n| --- | --- |\n\
  | 暴露因子 (EF) | % |\n| 单次损失期望值 (SLE) | `SLE = AV * EF` |\n| 年化发生率 (ARO) | # / 年 |\n\
  | 年化损失期望值 (ALE) | `ALE = SLE * ARO` 或 `ALE = AV * EF * ARO` |\n| 保护措施年成本 (ACS) |\
  \ $ / 年 |\n| 保护措施的价值或收益 | `(ALE1 – ALE2) – ACS` |\n\n必须认识到，定量风险评估过程中所有计算得出的最终值，用于优先级排序和选择。这些值本身并不真正反映现实世界中因安全漏洞造成的损失或成本。这显而易见，因为该过程需要大量的猜测、统计分析和概率预测。\n\
  \n为影响每项资产的每项风险的每项保护措施计算出成本/收益后，必须对这些值进行排序。在大多数情况下，成本/收益值最高的保护措施是针对特定风险、特定资产的最佳实施选择。但如同现实世界中的所有事物，这只是决策过程的一部分。虽然非常重要且通常是主要指导因素，但它不是唯一的数据要素。其他因素包括实际成本、安全预算、与现有系统的兼容性、IT\
  \ 人员的技能/知识储备、产品可用性，以及政治因素、合作伙伴关系、市场趋势、时尚、营销、合同和偏袒。作为高级管理层甚至 IT 人员，您有责任获取或利用所有可用数据和信息，为组织做出最佳安全决策。\n\
  \n大多数组织的预算有限且极其紧张。因此，以最低成本获得最佳安全性是安全管理的关键部分。要有效管理安全职能，必须评估预算、每项安全控制的收益和性能指标以及必要资源。只有经过彻底评估，才能确定哪些控制不仅对安全有益，而且对利润也有益。\n\
  \n#### 定性风险分析\n\n定性风险分析更多基于场景而非计算器。您不给可能的损失分配确切的美元数字，而是按等级对威胁进行排序，以评估其风险、成本和影响。由于纯定量风险评估不可能实现，平衡定量分析结果至关重要。将定量和定性分析结合成最终组织风险评估的方法称为混合评估或混合分析。执行定性风险分析的过程涉及判断、直觉和经验。可使用多种技术执行定性风险分析：\n\
  \n*   头脑风暴\n*   德尔菲法\n*   故事板\n*   焦点小组\n*   调查\n*   问卷\n*   清单\n*   一对一会议\n*  \
  \ 面谈\n\n采用哪种机制取决于组织文化以及涉及的风险和资产类型。通常会同时采用多种方法，并在最终提交给高层管理的风险分析报告中对比其结果。\n\n#####\
  \ 场景\n\n\n\n\n### 基本流程\n\n所有这些机制的基本流程都涉及场景的创建。**场景** 是对单一主要威胁的书面描述。该描述侧重于威胁如何被引发，以及其发生可能对组织、IT\
  \ 基础设施和特定资产产生什么影响。通常，场景限制在一页文本以内，以保持其可管理性。对于每个场景，都会描述一种或多种防护措施，这些措施可以完全或部分地防范场景中讨论的主要威胁。分析参与者随后为场景分配威胁级别、损失潜力以及每种防护措施的优势。这些分配可以非常简单——例如高、中、低，或基本的\
  \ 1 到 10 数字等级——也可以是详细的论述式回答。所有参与者的回答随后被汇编成一份单一报告，提交给高层管理人员。有关参考评级和级别的示例，请参阅美国国家标准与技术研究院\
  \ (NIST) 特别出版物 (SP) 800-30 中的表 3-6 和表 3-7：\n\n[`csrc.nist.gov/publications/nistpubs/800-30/sp800-30.pdf`](http://csrc.nist.gov/publications/nistpubs/800-30/sp800-30.pdf)\n\
  \n定性风险分析的有效性和效度会随着参与评估的人员数量和多样性的增加而提高。只要可能，应包含组织层级中每个层面的一名或多名人员，从高层管理人员到最终用户。同样重要的是，要包含每个主要部门、处、办公室或分支机构的横截面人员。\n\
  \n#### Delphi 技术\n\nDelphi 技术可能是前面列表中唯一一种不能立即被识别和理解的机制。**Delphi 技术** 只是一种匿名的反馈与响应过程，用于使群体达成匿名共识。其主要目的是引出所有参与者诚实且不受影响的回答。参与者通常聚集在一个会议室中。针对每次反馈请求，每位参与者匿名在纸上写下他们的回答。结果被汇总并呈现给小组进行评估。该过程重复进行，直到达成共识。\n\
  \n定量和定性风险分析机制都能提供有用的结果。然而，每种技术都涉及评估同一组资产和风险的独特方法。审慎的应有注意义务要求同时采用这两种方法。**表 2.2**\
  \ 描述了这两种系统的优缺点。\n\n**表 2.2 定量与定性风险分析的比较**\n\n| 特征 | 定性 | 定量 |\n| :--- | :--- | :---\
  \ |\n| 采用复杂函数 | 否 | 是 |\n| 使用成本/效益分析 | 否 | 是 |\n| 产生具体数值 | 否 | 是 |\n| 需要猜测 | 是 |\
  \ 否 |\n| 支持自动化 | 否 | 是 |\n| 涉及大量信息 | 否 | 是 |\n| 客观 | 否 | 是 |\n| 使用意见 | 是 | 否 |\n\
  | 需要大量时间和精力 | 否 | 是 |\n| 提供有用且有意义的结果 | 是 | 是 |\n\n### 风险响应\n\n风险分析的结果有很多：\n\n* \
  \  所有资产的完整详细估值\n*   详尽的威胁和风险清单、发生率以及实现时的损失程度\n*   特定威胁的防护措施和对策清单，标识其有效性和 ALE\n*\
  \   每种防护措施的成本/效益分析\n\n这些信息对于管理层做出关于防护措施实施和安全策略变更的明智、理智的决策至关重要。\n\n一旦风险分析完成，管理层必须处理每个特定风险。对风险有几种可能的响应：\n\
  \n*   降低或缓解\n*   转移或分担\n*   接受\n*   威慑\n*   规避\n*   拒绝或忽略\n\n您需要了解以下关于可能风险响应的信息：\n\
  \n#### 风险缓解\n\n**降低风险**，或 **风险缓解**，是实施防护措施和对策以消除漏洞或阻断威胁。选择最具成本效益或最有益的对策是风险管理的一部分，但不是风险评估的要素。事实上，对策选择是风险评估后或风险分析后的活动。风险缓解的另一种潜在变体是风险规避。通过消除风险原因来规避风险。一个简单的例子是从服务器中移除文件传输协议\
  \ (FTP) 以避免 FTP 攻击，一个更大的例子是搬到内陆位置以避免飓风风险。\n\n#### 风险转移\n\n**分配风险** 或 **转移风险** 是将风险所代表的损失成本转嫁给另一个实体或组织。购买保险和外包是分配或转移风险的常见形式。\n\
  \n#### 风险接受\n\n**接受风险**、风险容忍度或风险接受，是成本/效益分析显示对策成本会超过因风险导致的可能损失成本后的结果。这也意味着管理层已同意在风险实现时承担后果和损失。在大多数情况下，接受风险需要一份清晰的书面声明，说明为何未实施防护措施、谁对该决策负责，以及风险实现时谁将对损失负责，通常以免责函的形式呈现。组织接受风险的决定基于其风险容忍度。这也称为风险容忍度或风险偏好，即组织吸收已实现风险相关损失的能力。\n\
  \n#### 风险威慑\n\n**风险威慑** 是实施威慑措施以阻止潜在的安全和策略违规者的过程。示例包括实施审计、安全摄像头、保安、指示标牌、警告横幅、运动探测器、强认证，以及让人知晓组织愿意与当局合作并起诉参与网络犯罪的人员。\n\
  \n#### 风险规避\n\n**风险规避** 是选择风险较低的替代方案或活动，而非默认、常见、权宜或廉价的选项。例如，选择飞往目的地而不是开车前往，就是一种风险规避。另一个例子是将企业选址在亚利桑那州而非佛罗里达州，以避免飓风。\n\
  \n#### 风险拒绝\n\n对风险的最后一种但不可接受的可能响应是 **拒绝风险** 或 **忽略风险**。否认风险存在并希望它永远不会实现，都不是对风险有效或审慎的应有注意义务响应。\n\
  \n一旦实施了对策，剩余的风险称为剩余风险。**剩余风险** 包含高层管理人员选择不实施防护措施的针对特定资产的威胁。换句话说，剩余风险是管理层选择接受而非缓解的风险。在大多数情况下，剩余风险的存在表明成本/效益分析显示可用的防护措施不是具有成本效益的威慑手段。\n\
  \n**总风险** 是组织在未实施任何防护措施时将面临的风险总量。总风险的公式如下：\n\n```\n威胁 * 漏洞 * 资产价值 = 总风险\n```\n(注意，此处的\
  \ `*` 并不意味着乘法，而是组合函数；这不是一个真正的数学公式。) 总风险与剩余风险之间的差额称为控制差距。控制差距是通过实施防护措施所降低的风险量。剩余风险的公式如下：\n\
  \n```\n总风险 - 控制差距 = 剩余风险\n```\n\n\n\n\n与一般风险管理一样，处理风险不是一次性过程。相反，安全必须持续维护并不断重申。事实上，重复风险评估和分析过程是一种机制，用于随时间评估安全计划的完整性和有效性。此外，它有助于定位缺陷和发生变更的领域。由于安全会随时间变化，定期重新评估对于维持合理的安全至关重要。\n\
  \n#### 对策选择与实施\n\n在风险管理领域，选择对策或控制措施（`security control` 的简称）很大程度上依赖于成本/收益分析结果。但是，在评估安全控制的价值或相关性时，还应考虑其他几个因素：\n\
  \n*   对策的成本应低于资产的价值。\n*   对策的成本应低于对策的收益。\n*   应用对策的结果应使攻击者的攻击成本高于其从攻击中获得的收益。\n*\
  \   对策应为真实且已识别的问题提供解决方案。（不要仅仅因为对策可用、有广告宣传或听起来很酷就安装它们。）\n*   对策的收益不应依赖于其保密性。这意味着“通过隐晦实现安全”不是可行的对策，任何可行的对策都能经受住公开披露和审查。\n\
  *   对策的收益应可测试且可验证。\n*   对策应在所有用户、系统、协议等方面提供一致且统一的保护。\n*   对策应极少或没有依赖关系，以减少级联故障。\n\
  *   对策在初始部署和配置后应只需最少的人工干预。\n*   对策应防篡改。\n*   对策的覆盖/重置功能应仅对特权操作员可访问。\n*   对策应提供故障安全和/或故障保密选项。\n\
  \n请记住，安全的设计应旨在支持和实现业务任务与功能。因此，需要在业务任务的背景下评估对策和防护措施。\n\n安全控制、对策和防护措施可通过管理、逻辑/技术或物理方式实施。这三类安全机制应以纵深防御方式实施，以提供最大效益（参见图\
  \ 2.6）。\n\n![图 2.6 纵深防御实施中的安全控制类别](img/c02f006.jpg)\n\n**图 2.6** 纵深防御实施中的安全控制类别\n\
  \n##### 技术控制\n\n*技术或逻辑控制*涉及用于管理访问并为资源和系统提供保护的硬件或软件机制。顾名思义，它使用技术手段。逻辑或技术控制的示例包括身份验证方法（如用户名、密码、智能卡和生物识别）、加密、受限接口、访问控制列表、协议、防火墙、路由器、入侵检测系统（`IDS`）和剪裁级别。\n\
  \n##### 管理控制\n\n*管理控制*是由组织的安全策略及其他法规或要求定义的政策和程序。它们有时被称为管理控制。这些控制侧重于人员和业务实践。管理控制的示例包括政策、程序、招聘实践、背景调查、数据分类和标记、安全意识和培训工作、休假记录、报告和审查、工作监督、人员控制和测试。\n\
  \n#### 物理控制\n\n*物理控制*是你可以亲身接触的项目。它们包括部署的物理机制，用于防止、监控或检测与设施内系统或区域的直接接触。物理控制的示例包括警卫、围栏、运动探测器、上锁的门、密封的窗户、灯光、线缆保护、笔记本电脑锁、工牌、刷卡、护卫犬、摄像头、人员闸和警报器。\n\
  \n### 适用的控制类型\n\n术语*安全控制*指的是一系列广泛的控制，它们执行诸如确保只有授权用户可以登录、防止未授权用户访问资源等任务。*控制*可缓解各种信息安全风险。\n\
  \n只要可能，你都希望预防任何类型的安全问题或事件。当然，这并不总是可能的，意外事件仍会发生。一旦发生，你希望尽快检测到这些事件。检测到事件后，你希望对其进行纠正。\n\
  \n在阅读控制描述时，请注意有些控制被列为多种访问控制类型的示例。例如，建筑物周围的围栏（或周界界定设备）可以是一种预防性控制（物理上阻止某人进入建筑物院落）和/或一种威慑性控制（劝阻某人尝试进入）。\n\
  \n#### 威慑控制\n\n*威慑控制*的部署是为了阻止违反安全策略的行为。威慑控制和预防控制相似，但威慑控制通常取决于个人决定不采取不当行动。相比之下，预防控制实际上会阻止该行动。示例包括政策、安全意识培训、锁、围栏、安全工牌、警卫、人员闸和安全摄像头。\n\
  \n#### 预防控制\n\n*预防控制*的部署是为了阻止或停止发生不需要的或未授权的活动。预防控制的示例包括围栏、锁、生物识别、人员闸、照明、报警系统、职责分离、轮岗、数据分类、渗透测试、访问控制方法、加密、审计、安全摄像头或闭路电视（`CCTV`）的存在、智能卡、回叫程序、安全策略、安全意识培训、防病毒软件、防火墙和入侵防御系统（`IPS`）。\n\
  \n#### 检测控制\n\n*检测控制*的部署是为了发现或检测不需要的或未授权的活动。检测控制在事后运行，只能在活动发生后发现它。检测控制的示例包括保安、运动探测器、安全摄像头或\
  \ `CCTV` 捕获事件的记录和审查、轮岗、强制休假、审计追踪、蜜罐或蜜网、入侵检测系统（`IDS`）、违规报告、用户监督和审查以及事件调查。\n\n####\
  \ 补偿控制\n\n*补偿控制*的部署是为其他现有控制提供各种选项，以协助安全策略的执行和支持。它们可以是除另一控制外额外使用的控制，或代替另一控制使用的控制。例如，组织政策可能规定所有\
  \ `PII` 必须加密。审查发现一种预防控制正在加密数据库中的所有 `PII` 数据，但通过网络传输的 `PII` 却以明文形式发送。可以添加补偿控制来保护传输中的数据。\n\
  \n#### 纠正控制\n\n\n\n\n### 安全控制类型\n\n#### 纠正控制\n\n`corrective control`（纠正控制）会修改环境，以便在发生不需要或未授权的活动后将系统恢复正常。它试图纠正因安全事件而导致的任何问题。纠正控制可以很简单，例如终止恶意活动或重启系统。它们还包括能够移除或隔离病毒的防病毒解决方案、用于确保丢失数据可恢复的备份和恢复计划，以及能够修改环境以阻止正在进行的攻击的主动\
  \ IDS。该控制部署用于在违反安全策略后修复或恢复资源、功能和能力。\n\n#### 恢复\n\n`Recovery controls`（恢复控制）是纠正控制的延伸，但具有更高级或更复杂的能力。恢复控制的示例包括备份和恢复、容错驱动器系统、系统镜像、服务器集群、防病毒软件，以及数据库或虚拟机影子复制。就业务连续性和灾难恢复而言，恢复控制可以包括热站点、温站点、冷站点、备用处理设施、服务局、互惠协议、云提供商、移动滚动运营中心和多站点解决方案。\n\
  \n#### 指令控制\n\n`directive control`（指令控制）部署用于指导、限制或控制主体的行为，以强制或鼓励其遵守安全策略。指令控制的示例包括安全策略要求或标准、张贴的通知、逃生路线出口标志、监控、监督和程序。\n\
  \n### 安全控制评估\n\n`security control assessment (SCA)`（安全控制评估）是对安全基础设施的各个机制依据基线或可靠性预期进行的正式评估。SCA\
  \ 可以作为完整安全评估（如渗透测试或漏洞评估）的补充，也可以独立执行。\n\nSCA 的目标是确保安全机制的有效性，评估组织风险管理流程的质量和彻底性，并生成一份报告，说明已部署安全基础设施的相对优势和劣势。\n\
  \n通常，SCA 是联邦机构基于 NIST 特别出版物 800-53A《联邦信息系统安全控制评估指南》（[`csrc.nist.gov/publications/detail/sp/800-53a/rev-4/final`](https://csrc.nist.gov/publications/detail/sp/800-53a/rev-4/final)）实施的一个过程。然而，虽然它被定义为一个政府流程，但评估安全控制可靠性和有效性的概念应被每个致力于维持成功安全工作的组织所采用。\n\
  \n### 监控与度量\n\n安全控制应提供可被监控和度量的效益。如果安全控制的效益无法量化、评估或比较，那么它实际上并不提供任何安全性。安全控制可能提供原生或内部监控，或者可能需要外部监控。在进行初始对策选择时，应将此纳入考量。\n\
  \n衡量对策的有效性并不总是一个绝对值。许多对策提供的是改进的程度，而不是阻止了多少次入侵或挫败了多少次攻击尝试等具体的硬性数字。通常，为了获得对策成功或失败的度量，有必要在安装防护措施前后对事件进行监控和记录。只有已知起点（即正常点或初始风险水平），效益才能被准确度量。成本/效益方程式的一部分要考虑对策的监控和度量。仅仅因为安全控制提供了某级别的安全性提升，并不一定意味着获得的效益具有成本效益。应确定显著的安全性改进，以明确证明部署新对策的费用是合理的。\n\
  \n### 资产估值与报告\n\n风险分析中的一个重要步骤是评估组织资产的价值。如果资产没有价值，则无需为其提供保护。风险分析的主要目标是确保仅部署具有成本效益的防护措施。花费\
  \ 100,000 美元保护仅值 1,000 美元的资产是毫无意义的。资产的价值直接影响并指导为保护它而部署的防护措施和安全级别。原则上，防护措施的年成本不应超过资产预期年损失成本。\n\
  \n评估资产成本时，有许多方面需要考虑。资产估值的目标是为资产分配一个特定的美元价值，该价值涵盖有形成本和无形成本。确定确切价值通常很难，甚至不可能，但尽管如此，必须建立一个具体的价值。（请注意，下一节关于定性与定量风险分析的讨论可能会阐明此问题。）不当地分配资产价值可能导致无法妥善保护资产，或实施财务上不可行的防护措施。以下列表包括一些影响资产估值的有形和无形因素：\n\
  \n- 采购成本\n- 开发成本\n- 行政或管理成本\n- 维护或保养成本\n- 资产获取成本\n- 保护或维持资产的成本\n- 对所有者和用户的价值\n-\
  \ 对竞争对手的价值\n- 知识产权或权益价值\n- 市场估值（可持续价格）\n- 替换成本\n- 生产力提升或降低\n- 资产存在和丢失的运营成本\n- 资产丢失的责任\n\
  - 实用性\n\n为组织分配或确定资产价值可以满足多种需求。它是通过部署防护措施进行资产保护成本/效益分析的基础。它是选择或评估防护措施和对策的一种手段。它为保险目的提供价值，并确立组织的总体净值。它帮助高级管理层准确了解组织内部有哪些资产处于风险之中。了解资产价值还有助于防止尽职照管的疏忽，并鼓励遵守法律要求、行业法规和内部安全策略。\n\
  \n#### 风险报告\n\n`Risk reporting`（风险报告）是在风险分析结束时执行的一项关键任务。风险报告涉及制作风险报告并向相关利益方/相关方汇报该报告。对许多组织而言，风险报告只是内部关注的事项，而其他组织可能有法规强制要求向第三方或公众报告其风险发现。\n\
  \n风险报告应准确、及时、涵盖整个组织、清晰精确以支持决策，并定期更新。\n\n### 持续改进\n\n执行风险分析是为了向高层管理人员提供必要的细节，以决定哪些风险应缓解、哪些应转移、哪些应威慑、哪些应规避、哪些应接受。结果是资产预期损失成本与针对威胁和漏洞部署防护措施成本之间的成本/效益比较。风险分析识别风险、量化威胁影响，并协助安全预算编制。它有助于将安全策略的需求和目标与组织的业务目标和意图相结合。风险分析/风险评估是一个“时间点”指标。威胁和漏洞不断变化，风险评估需要定期重新进行，以支持持续改进。\n\
  \n\n\n\n安全性始终在变化。因此，任何已实施的安全解决方案都需要随着时间的推移进行更新和变更。如果所选对策未提供持续改进路径，则应将其替换为提供可扩展安全性改进的对策。\n\
  \n#### 风险框架\n\n`风险框架` 是关于如何评估、解决和监控风险的指南或配方。CISSP 考试引用的风险框架的主要示例是 NIST 在特别出版物 800-37\
  \ ([`nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-37r1.pdf`](http://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-37r1.pdf))\
  \ 中定义的框架。我们鼓励您完整阅读该出版物，但以下是与 CISSP 相关的几段摘录：\n\n> 本出版物提供了将 `风险管理框架 (RMF)` 应用于联邦信息系统的指南。六步\
  \ RMF 包括安全分类、安全控制选择、安全控制实施、安全控制评估、信息系统授权和安全控制监控。RMF 通过实施稳健的持续监控流程，推广近实时风险管理和持续信息系统授权的概念，为高级领导提供必要信息，以便就支持其核心任务和业务职能的组织信息系统做出具有成本效益、基于风险的决策，并将信息安全集成到企业架构和系统开发生命周期\
  \ (SDLC) 中。在企业内应用 RMF 通过风险执行（职能）将信息系统层面的风险管理流程与组织层面的风险管理流程联系起来，并确立了在组织信息系统中部署并由这些系统继承（即通用控制）的安全控制的责任和问责制。RMF\
  \ 具有以下特征：\n>\n> *   通过实施稳健的持续监控流程，推广近实时风险管理和持续信息系统授权的概念；\n> *   鼓励使用自动化为高级领导提供必要信息，以便就支持其核心任务和业务职能的组织信息系统做出具有成本效益、基于风险的决策；\n\
  > *   将信息安全集成到企业架构和 SDLC 中；\n> *   强调安全控制的选择、实施、评估和监控，以及信息系统的授权；\n> *   通过风险执行（职能）将信息系统层面的风险管理流程与组织层面的风险管理流程联系起来；以及\n\
  > *   确立对部署在组织信息系统中并由这些系统继承（即通用控制）的安全控制的责任和问责制\n>\n> RMF 步骤包括 [(参见图 2.7)]：\n>\n\
  > *   **分类** 信息系统以及由该系统处理、存储和传输的信息，依据为影响分析。\n> *   **选择** 信息系统的一组初始基线安全控制，依据为安全分类；根据组织风险评估和本地条件，根据需要调整和补充安全控制基线。\n\
  > *   **实施** 安全控制，并描述控制如何在信息系统及其运行环境中采用。\n> *   **评估** 安全控制，使用适当的评估程序确定控制实施的正确程度、是否按预期运行，以及是否产生了满足系统安全要求方面的预期结果。\n\
  > *   **授权** 信息系统运行，依据为对组织运营和资产、个人、其他组织以及国家因信息系统运行而产生的风险的判断，并决定该风险是可接受的。\n> *  \
  \ **监控** 信息系统中的安全控制，持续进行，包括评估控制有效性、记录系统或其运行环境的变更、对相关变更进行安全影响分析，并向指定的组织官员报告系统的安全状态。\n\
  >\n> ***[源自 NIST SP 800-37]***\n\n![图 2.7 风险管理框架的六个步骤](img/c02f007.jpg)\n\n**图 2.7**\
  \ 风险管理框架的六个步骤\n\nNIST 出版物中有关于 RMF 更多的详细信息；请查阅该文档以获取关于风险框架的完整视角。\n\nNIST RMF 是 CISSP\
  \ 考试的主要关注点，但在实际工作中，您可能需要查看其他风险管理框架。请考虑运作关键威胁、资产和漏洞评估 (OCTAVE)、信息风险因素分析 (FAIR) 以及威胁主体风险评估\
  \ (TARA)。如需进一步研究，您可以在此处找到一篇有用的文章：[www.csoonline.com/article/2125140/metrics-budgets/it-risk-assessment-frameworks–real-world-experience.html](http://www.csoonline.com/article/2125140/metrics-budgets/it-risk-assessment-frameworks–real-world-experience.html)。理解存在许多公认的框架，并选择一个适合您组织需求和风格的框架非常重要。\n\
  \n#### 建立并维护安全意识、教育和培训计划\n\n安全解决方案的成功实施需要改变用户行为。这些变化主要包含为遵守安全策略强制规定的标准、指南和程序而对正常工作活动进行的调整。`行为矫正`\
  \ 涉及用户一定程度的学习。为了开发和管理安全教育、培训和意识，必须明确确定所有相关的知识传递项目，并设计演示、接触、协同和实施计划。\n\n安全培训的前提是\
  \ `意识`。建立意识的目标是将安全置于首要位置，使其成为用户公认的实体。意识在整个组织中建立了安全理解的通用基线或基础，重点关注所有员工必须理解和领会的与安全相关的关键或基本主题和问题。意识的建立不仅限于课堂类型的练习，还通过工作环境进行。可以使用许多工具来建立意识，例如海报、通告、时事通讯文章、屏幕保护程序、T\
  \ 恤、管理层的动员讲话、公告、演示、鼠标垫、办公用品和备忘录，以及传统的讲师授课培训课程。\n\n意识建立了安全理解的最低标准共同分母或基础。所有人员都应充分了解其安全责任和义务。他们应接受培训，知道该做什么和不该做什么。\n\
  \n\n\n### 用户需知问题\n\n用户需知的问题包括避免浪费、欺诈和未经授权的活动。组织中的所有成员（从高级管理层到临时实习生）都需要同等程度的认知。组织中的认知计划应与其安全策略、事件处理计划、业务连续性和灾难恢复程序相结合。要使认知建设计划有效，必须保持其新颖性、创造性，并经常更新。认知计划还应与对企业文化如何影响个人及整个组织安全的理解相结合。如果员工看不到安全策略和标准的执行（尤其是在认知层面），他们可能就不会觉得有义务遵守这些规定。\n\
  \n### 培训\n\n**培训**是指教导员工执行其工作任务并遵守安全策略。培训通常由组织主办，面向具有相似工作职能的员工群体。所有新员工都需要一定程度的培训，以便能够遵守安全策略强制规定的所有标准、指南和程序。新用户需要知道如何使用\
  \ IT 基础设施、数据存储在何处，以及资源分类的方式和原因。许多组织选择在授予新员工网络访问权限之前对其进行培训，而其他组织则会授予新用户有限的访问权限，直到其特定职位的培训完成。培训是一项持续的活动，必须在组织的整个生命周期内为每位员工持续进行。它被视为一种管理类安全控制。\n\
  \n呈现认知和培训的方法和技术应随时间修订和改进，以最大化收益。这要求收集和评估培训指标。这可能包括培训后测试，以及监控工作一致性的改进、停机时间、安全事件或错误的减少。这可以视为计划有效性评估。\n\
  \n认知和培训通常在内部提供。这意味着这些教学工具由组织内部创建和部署。然而，下一层级的知识分发通常来自外部第三方来源。\n\n### 教育\n\n**教育**是一项更详细的工作，学生/用户学到的知识远超其执行工作任务所需。教育通常与追求认证或寻求晋升的用户相关。它通常是寻求安全专业职位人员的要求。安全专业人员需要具备整个组织的安全和本地环境的广泛知识，而不仅仅是其特定的工作任务。\n\
  \n组织内所需的认知、培训和教育的适当水平评估应通过定期内容审查定期修订。随着组织随时间演变，培训工作需要更新和调整。此外，还应实施新的大胆且微妙的认知手段，以保持内容的新鲜感和相关性。如果没有针对内容相关性的定期审查，材料将变得陈旧，员工可能会诉诸于制定自己的指南和程序。安全治理团队有责任制定安全规则，并提供培训和教育以推动这些规则的实施。\n\
  \n### 管理安全职能\n\n要管理安全职能，组织必须实施适当且充分的安全治理。执行风险评估以驱动安全策略，是管理安全职能最清晰、最直接的例子。\n\n安全必须具有成本效益。组织没有无限的预算，因此必须适当分配资金。此外，组织预算中包含专门用于安全的资金比例，就像大多数其他业务任务和流程需要资本一样，更不用说员工薪资、保险、退休金等支出。安全应足以抵御组织面临的典型或标准威胁，但前提是这种安全的成本不应超过所保护资产的价值。正如本章前面“理解并应用风险管理概念”所述，成本超过资产价值本身的对策通常不是有效的解决方案。\n\
  \n安全必须可度量。可度量的安全意味着安全机制的各个方面能够发挥作用、提供明确的收益，并拥有一个或多个可记录和分析的指度量标准。类似于性能指标，安全指标是与安全功能操作相关的性能、功能、操作、动作等的测量。实施对策或保护措施时，安全指标应显示不想要事件的减少或尝试检测的增加。否则，安全机制就没有提供预期的收益。测量和评估安全指标的行为，即评估安全计划的完整性和有效性的实践。这还应包括根据通用安全指南进行衡量，并跟踪其控制措施的成功情况。跟踪和评估安全指标是有效安全治理的一部分。然而，值得注意的是，选择不正确的安全指标可能会导致严重问题，例如选择监控或衡量安全人员几乎无法控制的事物，或基于外部驱动因素的事物。\n\
  \n资源既会被安全机制本身消耗，也会被安全治理流程消耗。显然，安全机制应尽可能少地消耗资源，并将对系统生产力或吞吐量的影响降至可行的最低水平。然而，每个硬件和软件对策以及用户必须遵循的每个策略和程序都会消耗资源。在对策选择、部署和调优前后，了解并评估资源消耗是安全治理和管理安全职能的重要组成部分。\n\
  \n管理安全职能包括信息安全策略的开发和实施。CISSP 考试的大部分内容（因此也是本书的大部分内容）都涉及信息安全策略开发和实施的各个方面。\n\n### 总结\n\
  \n在规划安全解决方案时，重要的是要考虑到人类往往是组织安全中最薄弱的环节。无论部署了何种物理或逻辑控制，人类都能发现避免、规避、颠覆或禁用它们的方法。因此，在为您的环境设计和部署安全解决方案时，必须将用户纳入考量。安全招聘实践、角色、策略、标准、指南、程序、风险管理、认知培训和管理规划等方面共同有助于保护资产。使用这些安全结构可以为您的安全解决方案提供一定程度的保护，以抵御人类带来的威胁。\n\
  \n安全招聘实践需要详细的职位描述。职位描述用作选择候选人并对其进行适当评估的指南。通过职位描述维护安全包括职责分离、工作职责和工作轮换的使用。\n\n需要终止策略来保护组织及其现有员工。终止程序应包括见证人、归还公司财产、禁用网络访问、离职面谈和护送离开场所。\n\
  \n\n\n\n### 第三方治理\n\n第三方治理是一种监督体系，有时由法律、法规、行业标准或许可要求强制规定。治理方式可能各不相同，但通常涉及外部调查员或审计员。审计员可能由管理机构指定，也可能是目标组织聘请的顾问。\n\
  \n### 风险管理\n\n识别、评估以及预防或降低风险的过程称为风险管理。风险管理的主要目标是将风险降低到可接受的水平。确定该水平取决于组织、其资产的价值以及预算的规模。尽管无法设计和部署一个完全无风险的环境，但只需付出很少的努力就能显著降低风险。\n\
  \n风险分析是实现风险管理的过程，包括分析环境中的风险，评估每个风险发生的可能性及由此造成的损失成本，评估针对每个风险的各种对策成本，并为高层管理人员创建一份保护措施的成本/效益报告。\n\
  \n### 用户行为与学习\n\n要成功实施安全解决方案，必须改变用户行为。这种改变主要表现为调整正常工作活动，以遵守安全策略强制规定的标准、指南和程序。行为矫正涉及用户一定程度的学习。有三个公认的学习层次：意识、培训和教育。\n\
  \n### 考试要点\n\n#### 理解雇佣新员工的安全隐患\n\n为了妥善规划安全，您必须针对职位描述、职位分类、工作任务、工作职责、防止串通、候选人筛选、背景调查、安全许可、雇佣协议和保密协议制定相应标准。通过部署此类机制，您可以确保新员工了解所需的安全标准，从而保护组织的资产。\n\
  \n#### 能够解释职责分离\n\n职责分离是将关键、重要、敏感的工作任务分配给多个个人的安全概念。通过以这种方式分离职责，您可以确保没有单个人能够危害系统安全。\n\
  \n#### 理解最小权限原则\n\n最小权限原则规定，在安全环境中，用户应仅被授予完成其所需工作任务或职责所必需的最低访问权限。通过将用户访问权限仅限于完成工作任务所需的项目，您可以限制敏感信息的脆弱性。\n\
  \n#### 了解工作轮换和强制休假的必要性\n\n工作轮换有两大功能。它提供了一种知识冗余，而人员流动可降低欺诈、数据篡改、盗窃、破坏和信息滥用的风险。为期一到两周的强制休假用于审核和核实员工的工作任务和权限。这往往能轻松发现滥用职权、欺诈或疏忽行为。\n\
  \n#### 理解供应商、顾问和承包商控制\n\n供应商、顾问和承包商控制用于定义外部实体、个人或组织的绩效水平、期望、薪酬和后果。这些控制通常在称为服务级别协议（`SLA`）的文档或策略中定义。\n\
  \n#### 能够解释适当的解雇政策\n\n解雇政策定义了解雇员工的程序。它应包括始终安排见证人、禁用员工的网络访问权限以及进行离职面谈等事项。解雇政策还应包括护送被解雇员工离开场所，并要求其归还安全令牌、工牌和公司财产。\n\
  \n#### 了解隐私如何融入 IT 安全领域\n\n了解隐私的多种含义/定义、保护隐私的重要性以及围绕隐私的问题，尤其是在工作环境中。\n\n#### 能够讨论安全的第三方治理\n\
  \n第三方治理是一种监督体系，可能由法律、法规、行业标准或许可要求强制规定。\n\n#### 能够定义整体风险管理\n\n识别可能损害或泄露数据的因素，结合数据价值和对策成本评估这些因素，并实施具有成本效益的解决方案以减轻或降低风险，这一过程称为风险管理。通过执行风险管理，您为整体降低风险奠定了基础。\n\
  \n#### 理解风险分析及其关键要素\n\n风险分析是向高层管理人员提供详细信息以便其决定减轻哪些风险、转移哪些风险以及接受哪些风险的过程。要全面评估风险并随后采取适当的预防措施，您必须分析以下内容：资产、资产估值、威胁、漏洞、暴露、风险、已实现风险、保护措施、对策、攻击和违规。\n\
  \n#### 知道如何评估威胁\n\n威胁可能源自多种来源，包括 IT、人为因素和自然因素。威胁评估应作为团队工作进行，以提供最广泛的视角。通过从各个角度全面评估风险，您可以降低系统的脆弱性。\n\
  \n#### 理解定量风险分析\n\n定量风险分析侧重于硬性数值和百分比。由于风险的无形方面，完全的定量分析是不可能的。该过程涉及资产估值和威胁识别，然后确定威胁的潜在频率和由此造成的损害；结果是保护措施的成本/效益分析。\n\
  \n#### 能够解释暴露因子（EF）的概念\n\n暴露因子是定量风险分析的一个要素，代表如果特定资产因已实现的风险而受到侵害，组织将经历的损失百分比。通过计算暴露因子，您能够实施合理的风险管理策略。\n\
  \n#### 了解什么是单次损失期望值（SLE）及其计算方法\n\n`SLE` 是定量风险分析的一个要素，代表针对特定资产的单次已实现风险所关联的成本。公式为\
  \ `SLE = 资产价值 (AV) * 暴露因子 (EF)`。\n\n#### 理解年化发生率（ARO）\n\n`ARO` 是定量风险分析的一个要素，代表特定威胁或风险在一年内发生（即变为已实现）的预期频率。理解\
  \ `ARO` 可进一步使您能够计算风险并采取适当的预防措施。\n\n#### 了解什么是年化损失期望值（ALE）及其计算方法\n\n`ALE` 是定量风险分析的一个要素，代表特定已实现威胁针对特定资产的所有实例可能产生的年度成本。公式为\
  \ `ALE = 单次损失期望值 (SLE) * 年化发生率 (ARO)`。\n\n#### 了解保护措施评估公式\n\n除了确定保护措施的年度成本外，您还必须计算实施保护措施后资产的\
  \ `ALE`。使用公式：`实施保护措施前的 ALE – 实施保护措施后的 ALE – 保护措施的年度成本 = 保护措施对公司的价值`，或 `(ALE1 – ALE2)\
  \ – ACS`。\n\n#### 理解定性风险分析\n\n定性风险分析更多地基于场景而非计算。它不为可能的损失分配确切的美元数字，而是根据等级对威胁进行排序，以评估其风险、成本和影响。此类分析协助相关责任人制定适当的风险管理策略。\n\
  \n\n\n\n\n#### 理解德尔菲技术\n\n德尔菲技术简单来说是一种匿名的反馈与响应过程，用于达成共识。这种共识使责任方有机会妥善评估风险并实施解决方案。\n\
  \n#### 了解风险处理选项\n\n降低风险，或风险缓解，是实施保障措施和对策。转移风险将风险所代表的损失成本转嫁给另一个实体或组织。购买保险是转移或分配风险的一种形式。接受风险意味着管理层已评估可能保障措施的成本/效益分析，并确定对策成本远超因风险导致的可能损失成本。这也意味着管理层同意在风险成真时承担后果和损失。\n\
  \n#### 能够解释总风险、剩余风险和控制差距\n\n总风险是指组织在未实施任何保障措施时将面临的风险量。计算总风险请使用以下公式：\n\n```\n威胁 *\
  \ 脆弱性 * 资产价值 = 总风险\n```\n\n剩余风险是指管理层选择接受而非缓解的风险。总风险与剩余风险之间的差额即为控制差距，它是通过实施保障措施所降低的风险量。计算剩余风险请使用以下公式：\n\
  \n```\n总风险 – 控制差距 = 剩余风险\n```\n\n#### 理解控制类型\n\n术语 `control` 是指一系列广泛的控制措施，它们执行诸如确保仅授权用户能够登录、防止未授权用户访问资源等任务。控制类型包括预防性、检测性、纠正性、威慑性、恢复性、指令性和补偿性。控制也可按其实施方式分类：管理类、逻辑类或物理类。\n\
  \n#### 了解如何实施安全意识培训与教育\n\n在实际培训开始前，必须使用户建立起对安全作为一个公认实体的意识。一旦完成这一点，便可开始培训，即教授员工执行其工作任务并遵守安全策略。所有新员工都需要一定程度的培训，以便他们能够遵守安全策略强制规定的所有标准、指南和程序。教育是一项更深入的工作，学员/用户学到的知识远超其执行工作任务所需。教育通常与追求认证或寻求晋升的用户相关联。\n\
  \n#### 理解如何管理安全职能\n\n要管理安全职能，组织必须实施适当且充分的安全治理。执行风险评估以驱动安全策略，是管理安全职能最清晰、最直接的例子。这也涉及预算、度量指标、资源、信息安全策略，以及评估安全计划的完整性和有效性。\n\
  \n#### 了解风险管理框架的六个步骤\n\n风险管理框架的六个步骤为：分类、选择、实施、评估、授权和监控。\n\n### 书面实验\n\n1.  列举六种用于保障人员安全的不同管理控制。\n\
  2.  定量风险评估中使用的基本公式有哪些？\n3.  描述在定性风险评估期间用于达成匿名共识的过程或技术。\n4.  论述执行平衡风险评估的必要性。可以使用哪些技术？为什么这是必要的？\n\
  \n### 复习题\n\n1.  以下哪项是任何安全解决方案中最薄弱的环节？\n    1. 软件产品\n    2. 互联网连接\n    3. 安全策略\n\
  \    4. 人员\n\n2.  招聘新员工时，第一步是什么？\n    1. 编写职位描述。\n    2. 设定职位分类。\n    3. 筛选候选人。\n\
  \    4. 索要简历。\n\n3.  以下哪项是离职面谈的主要目的？\n    1. 归还离职员工的个人物品\n    2. 审查保密协议\n    3.\
  \ 评估离职员工的绩效\n    4. 注销离职员工的网络访问账户\n\n4.  当员工即将被解雇时，应采取以下哪项措施？\n    1. 在正式解雇前几小时通知员工。\n\
  \    2. 在通知员工解雇的同时，禁用其网络访问权限。\n    3. 发送广播邮件通知所有人某特定员工即将被解雇。\n    4. 等到大楼里只剩下你和该员工两人时再宣布解雇决定。\n\
  \n5.  如果组织与外部实体签约以提供关键业务职能或服务（如会计或技术支持），用于确保这些实体提供充分安全性的过程称为什么？\n    1. 资产识别\n \
  \   2. 第三方治理\n    3. 离职面谈\n    4. 定性分析\n\n6.  `文档审查` 的一部分是对业务流程和组织策略进行合理且实用的调查。此过程/策略审查确保陈述并实施的业务任务、系统和方法切实可行、高效且具成本效益，但最重要的是（至少就安全治理而言）它们通过减少漏洞以及避免、降低或缓解风险来支持安全。\n\
  \    1. 混合评估\n    2. 规避风险过程\n    3. 对策选择\n    4. 文档审查\n\n7.  以下哪项陈述不正确？\n    1.\
  \ IT 安全只能防范逻辑或技术攻击。\n    2. 实现风险管理目标的过程称为风险分析。\n    3. IT 基础设施面临的风险全都是基于计算机的。\n\
  \    4. 资产是指业务流程或任务中使用的任何事物。\n\n8.  以下哪项不是风险分析过程的要素？\n    1. 分析环境中的风险\n    2. 为保障措施编制成本/效益报告以提交高层管理人员\n\
  \    3. 选择合适的保障措施并实施它们\n    4. 评估每个威胁事件发生的可能性及造成损失的成本\n\n9.  以下哪项通常不被视为风险分析中的资产？\n\
  \    1. 开发流程\n    2. IT 基础设施\n    3. 专有系统资源\n    4. 用户的个人文件\n\n10. 以下哪项代表对漏洞的意外或故意利用？\n\
  \     1. 威胁事件\n     2. 风险\n     3. 威胁主体\n     4. 违规\n\n11. 当保障措施或对策不存在或不充分时，剩下的是什么？\n\
  \     1. 脆弱性\n     2. 暴露\n     3. 风险\n     4. 渗透\n\n12. 以下哪项不是风险的有效定义？\n     1.\
  \ 对概率、可能性或机会的评估\n     2. 消除脆弱性或针对一个或多个特定威胁进行保护的任何事物\n     3. `Risk = threat * vulnerability`\n\
  \     4. 每一次暴露实例\n\n13. 评估保障措施时，在大多数情况下应遵循什么原则？\n     1. 预期年度资产损失成本不应超过保障措施的年度成本。\n\
  \     2. 保障措施的年度成本应等于资产价值。\n     3. 保障措施的年度成本不应超过预期年度资产损失成本。\n     4. 保障措施的年度成本不应超过安全预算的\
  \ 10%。\n\n14. 单次损失期望值 (SLE) 如何计算？\n     1. 威胁 + 脆弱性\n\n\n\n\n\n2. 资产价值 ($) \\* 暴露因子\n\
  \n3. 年化发生率 \\* 脆弱性\n\n4. 年化发生率 \\* 资产价值 \\* 暴露因子\n\n15. 保护措施对公司的价值如何计算？\n\n    \
  \ 1. 实施保护措施前的 ALE – 实施保护措施后的 ALE – 保护措施的年成本\n\n     2. 实施保护措施前的 ALE \\* 保护措施的 ARO\n\
  \n     3. 实施保护措施后的 ALE + 保护措施的年成本 – 控制差距\n\n     4. 总风险 – 控制差距\n\n16. 哪项安全控制直接专注于防止串通？\n\
  \n     1. 最小权限原则\n\n     2. 职位描述\n\n     3. 职责分离\n\n     4. 定性风险分析\n\n17. 通常由组织主办，并面向具有相似工作职能的员工群体的过程或活动是什么？\n\
  \n     1. 教育\n\n     2. 意识培训\n\n     3. 培训\n\n     4. 解雇\n\n18. 以下哪项与管理组织的安全职能*没有*具体或直接关系？\n\
  \n     1. 员工工作满意度\n\n     2. 度量指标\n\n     3. 信息安全策略\n\n     4. 预算\n\n19. 在执行风险分析时，你识别出火灾威胁，以及因没有灭火器而存在的漏洞。基于此信息，以下哪项是可能的风险？\n\
  \n     1. 病毒感染\n\n     2. 设备损坏\n\n     3. 系统故障\n\n     4. 未经授权访问机密信息\n\n20. 你已对特定的威胁/漏洞/风险关系执行了基本的定量风险分析。你选择了一种可能的对策。在重新进行计算时，以下哪个因素会发生变化？\n\
  \n     1. 暴露因子\n\n     2. 单次损失期望值 (SLE)\n\n     3. 资产价值\n\n     4. 年化发生率\n\n## 第\
  \ 3 章  \n\n业务连续性规划\n\n**本章涵盖的 CISSP 考试主题包括：**\n\n*   **领域 1：安全与风险管理** \n\n    *\
  \   1.7 识别、分析并确定业务连续性 (BC) 需求的优先级 \n\n        *   1.7.1 制定并记录范围与计划\n\n        *\
  \   1.7.2 业务影响分析 (BIA)\n\n*   **领域 7：安全运营** \n\n    *   7.14 参与业务连续性 (BC) 规划与演练\n\
  \n尽管我们尽最大努力，但各种形式的灾难最终都会袭击每一个组织。无论是飓风或地震等自然灾害，还是建筑火灾或水管爆裂等人为灾难，每个组织都会遇到威胁其运营甚至生存的事件。\n\
  \n有韧性的组织已制定计划和程序，以帮助减轻灾难对其持续运营的影响，并加速恢复正常运营。认识到业务连续性 (BC) 和灾难恢复 (DR) 规划的重要性，国际信息系统安全认证联盟\
  \ (ISC)² 将这两个流程纳入了 CISSP 认证的通用知识体系 (CBK) 中。掌握这些基础主题将帮助你备考，也能帮助你为组织应对意外事件做好准备。\n\n\
  在本章中，我们将探讨业务连续性规划 (BCP) 背后的概念。第 18 章“灾难恢复规划”将继续这一讨论，并深入探讨组织可采取的技术控制措施的具体细节，以便在灾难发生后尽快恢复运营。\n\
  \n### 业务连续性规划\n\n*业务连续性规划* (BCP) 涉及评估组织流程面临的风险，并制定政策、计划和程序，以将这些风险一旦发生可能对组织造成的影响降至最低。BCP\
  \ 用于在紧急情况下维持业务的持续运营。BCP 规划者的目标是实施政策、程序和流程的组合，使潜在的破坏性事件对业务的影响尽可能小。\n\nBCP 专注于在基础设施能力或资源受限、受限的情况下维持业务运营。只要保持组织执行其关键任务工作任务的能力的连续性，BCP\
  \ 就可用于管理和恢复环境。\n\nBCP 的总体目标是在紧急情况下提供快速、冷静且高效的响应，并增强公司从破坏性事件中迅速恢复的能力。BCP 流程包含四个主要步骤。\n\
  \n*   项目范围与规划\n*   业务影响评估\n*   连续性规划\n*   批准与实施\n\n本章接下来的四节将详细介绍这些阶段。本章最后一部分将介绍编制组织业务连续性计划文档时应考虑的一些关键要素。\n\
  \n### 项目范围与规划\n\n与任何正式的业务流程一样，制定一份强有力的业务连续性计划需要使用经过验证的方法论。这要求：\n\n*   从危机规划的角度对业务组织进行结构化分析\n\
  *   在高级管理层批准下成立 BCP 团队\n*   评估可用于参与业务连续性活动的资源\n*   分析管辖组织对灾难性事件响应的法律和法规环境\n\n你使用的确切流程将取决于组织的规模、性质及其业务。不存在适用于所有业务连续性项目规划的“一刀切”指南。你应该咨询组织内的项目规划专业人员，并确定最适合你组织文化的方法。\n\
  \n#### 业务组织分析\n\n负责业务连续性规划的个人的首要职责之一，是对业务组织进行分析，以识别在 BCP 流程中拥有利益关系的所有部门和个人。以下是一些考虑领域：\n\
  \n*   负责为客户提供核心服务的运营部门\n*   关键支持服务，如信息技术 (IT) 部门、设施和维护人员，以及其他负责维护支持运营部门系统的群体\n*\
  \   负责物理安全的企业安全团队，因为他们往往是事件的第一响应者，同时也负责主要设施和备用处理设施的物理保护\n*   对组织持续生存至关重要的高级管理人员和其他关键人员\n\
  \n此识别过程至关重要，原因有二。首先，它为帮助识别潜在 BCP 团队成员提供了必要的基础（见下一节）。其次，它为 BCP 流程的其余部分奠定了基础。\n\n\n\
  \n\n通常，业务组织分析是由主导 BCP（业务连续性计划）工作的个人执行的。这是可以接受的，因为他们通常利用分析输出来协助选择其余的 BCP 团队成员。然而，当\
  \ BCP 团队正式召集时，对该分析进行彻底审查应是分配给完整 BCP 团队的首要任务之一。这一步至关重要，因为执行原始分析的个人可能忽略了代表组织其他部门的\
  \ BCP 团队成员所了解的关键业务职能。如果团队在未修订组织分析的情况下继续推进，整个 BCP 流程可能会受到负面影响，导致制定出的计划无法完全满足组织整体的应急响应需求。\n\
  \n### BCP 团队选择\n\n在许多组织中，IT 和/或安全部门被赋予 BCP 的唯一责任，且未安排其他运营和支持部门提供输入。事实上，这些部门甚至可能在灾难发生或迫在眉睫之前都不知道该计划的存在。这是一个严重缺陷！孤立地开发业务连续性计划会以两种方式导致灾难性后果。首先，计划本身可能未考虑到仅由负责日常业务运营的个人所掌握的知识。其次，它让运营要素对计划细节“蒙在鼓里”，直到实施变得必要时才知晓。这降低了运营要素同意计划条款并有效实施计划的可能性。同时，也使组织失去了通过结构化培训和测试计划所能获得的收益。\n\
  \n为防止这些情况对 BCP 流程产生不利影响，负责该工作的个人在选择 BCP 团队时应格外小心。团队至少应包含以下人员：\n\n*   负责企业核心服务的各部门代表\n\
  *   组织分析中确定的职能领域的业务单元团队成员\n*   在 BCP 涵盖领域拥有技术专长的 IT 专家\n*   了解 BCP 流程的网络安全团队成员\n\
  *   负责物理场所的物理安全和设施管理团队\n*   熟悉企业法律、法规和合同责任的律师\n*   能够解决人员配置问题及对个人员工影响的人力资源团队成员\n\
  *   需要针对中断事件如何与利益相关者和公众沟通进行类似规划的公共关系团队成员\n*   拥有设定愿景、定义优先级和分配资源能力的高级管理层代表\n\n上述名单中的每个人都为\
  \ BCP 流程带来了独特的视角，并会有个人偏见。例如，各运营部门的代表通常会认为自己的部门对组织的持续生存能力最为关键。尽管这些偏见乍看之下似乎具有分裂性，但\
  \ BCP 工作的负责人应接纳并善加利用它们。如果有效利用，这些偏见将有助于在最终计划中实现健康的平衡，因为每位代表都会为其部门的需求发声。另一方面，如果缺乏适当的领导，这些偏见可能会演变成破坏性的领地之争，从而使\
  \ BCP 工作脱轨并损害组织整体利益。\n\n### 资源需求\n\n团队验证业务组织分析后，应转向对 BCP 工作所需资源的评估。这涉及三个不同 BCP 阶段所需的资源。\n\
  \n*   BCP 团队将需要一些资源来执行 BCP 流程的四个要素（项目范围与规划、业务影响评估、连续性规划、审批与实施）。此 BCP 阶段消耗的主要资源极有可能是\
  \ BCP 团队成员及其调用的支持人员为制定计划所付出的精力。\n*   BCP 的测试、培训和维护阶段将需要一些硬件和软件投入，但同样，此阶段的主要投入将是参与这些活动的员工的精力。\n\
  *   当灾难发生且 BCP 团队认为有必要全面实施业务连续性计划时，该实施将需要大量资源。这包括大量精力（BCP 很可能会成为组织大部分甚至全部人员的关注焦点）和硬性资源的利用。因此，团队必须审慎且果断地行使\
  \ BCP 实施权力。\n\n一个有效的业务连续性计划需要投入大量资源，范围从购买和部署冗余计算设施，到团队成员起草计划初稿所用的铅笔和纸张。然而，正如您之前所见，人员是\
  \ BCP 流程消耗的最重要资源之一。许多安全专业人员忽视了核算人工成本的重要性，但您可以放心，高级管理层不会忽视。业务领导者敏锐地意识到耗时的副业活动对组织运营生产力的影响，以及人员在薪资、福利和机会成本方面的真实成本。当您请求高级管理人员投入时间时，这些顾虑显得尤为重要。\n\
  \n您应预期负责资源利用管理的领导者会将您的 BCP 提案置于显微镜下审视，您应准备好用连贯、合乎逻辑的论据来捍卫计划的必要性，以回应 BCP 的商业理由。\n\
  \n### 法律和法规要求\n\n许多行业可能受联邦、州和地方法律或法规的约束，要求其实施不同程度的 BCP。本章已讨论过一个例子——上市公司的高管和董事有受托责任，在履行业务连续性职责时必须尽到应有的勤勉。在其他情况下，要求（及失败的后果）可能更为严重。警察、消防和紧急医疗救援等应急服务有责任在灾难发生时维持社区运营。事实上，当公共安全受到威胁时，他们的服务变得更为关键。他们未能实施可靠的\
  \ BCP 可能导致生命和/或财产损失，并降低民众对政府的信心。\n\n在许多国家，银行、证券公司及处理其数据的公司等金融机构受到严格的政府和国际银行及证券法规约束。这些法规之所以严格，是因为它们旨在确保作为经济关键组成部分的机构持续运营。当制药制造商在灾难后必须在非最佳条件下生产产品时，他们需要向政府监管机构证明其产品的纯度。还有无数其他行业的例子，根据各种法律法规，它们被要求在紧急情况下维持运营。\n\
  \n\n\n即使你不受上述任何因素的约束，你可能仍负有对客户的合同义务，要求你实施可靠的业务连续性规划（BCP）实践。如果你的合同包含以*服务级别协议*（SLA）形式表达的对客户的承诺，一旦灾难中断了你为客户提供服务的能力，你可能会被视为违约。许多客户可能会同情你并希望继续使用你的产品/服务，但他们自身的业务需求可能会迫使他们终止关系并寻找新的供应商。\n\
  \n另一方面，制定一份强有力的、有文档记录的业务连续性计划可以帮助你的组织赢得新客户，并从现有客户那里获得更多业务。如果你能向客户展示你已建立的完善程序，以确保在灾难发生时继续为他们服务，他们将对你的公司更有信任，并可能更倾向于选择你作为首选供应商。这可不是个坏位置！\n\
  \n所有这些顾虑都指向同一个结论——必须让组织的法律顾问参与 BCP 流程。他们熟悉适用于你组织的法律、法规和合同义务，并能帮助你的团队实施一份在满足这些要求的同时，确保组织持续生存能力的计划，使所有相关方——员工、股东、供应商和客户——均受益。\n\
  \n### 业务影响评估\n\n一旦你的 BCP 团队完成了创建业务连续性计划前的四个准备阶段，就该深入核心工作——*业务影响评估*（BIA）了。BIA 识别出对组织持续生存能力至关重要的资源，以及这些资源面临的威胁。它还评估每种威胁实际发生的可能性，以及这些事件对业务造成的影响。BIA\
  \ 的结果提供了定量指标，可帮助你确定业务连续性资源投入的优先级，以应对组织面临的各种本地、区域和全球风险敞口。\n\n重要的是要意识到，业务规划者在面临决策时会使用两种不同类型的分析。\n\
  \n*   **定量决策** 定量决策涉及使用数字和公式来做出决策。此类数据通常以对业务的美元价值来表达选项。\n\n*   **定性决策** 定性决策将非数值因素纳入考量，例如声誉、投资者/客户信心、员工队伍稳定性及其他关切。此类数据通常产生优先级类别（如高、中、低）。\n\
  \n本章所述的 BIA 流程从定量和定性两个角度切入问题。然而，BCP 团队很容易“只看数字”，只进行定量评估，而忽视了稍微困难一些的定性评估。BCP 团队对影响\
  \ BCP 流程的因素进行定性分析非常重要。例如，如果你的业务高度依赖少数几个重要客户，你的管理团队很可能愿意承受巨大的短期财务损失，以在长期内留住这些客户。BCP\
  \ 团队必须坐下来讨论（最好有高级管理层参与）定性关切，以制定一种能满足所有利益相关者的综合方法。\n\n#### 确定优先级\n\n摆在 BCP 团队面前的首个\
  \ BIA 任务是确定业务优先级。根据你的业务领域，当灾难发生时，某些活动将是你日常运营中最关键的。优先级识别任务，或称关键性优先级排序，涉及创建一份详尽的业务流程清单，并按重要性对其进行排序。虽然这项任务看起来有些令人生畏，但其实没那么难。\n\
  \n在团队成员间分配这项工作量的一个好方法是，指派每位参与者负责起草一份涵盖其部门职责范围内业务功能的优先级清单。当整个 BCP 团队召开会议时，团队成员可以利用这些优先级清单创建一份面向整个组织的主优先级清单。采用此法需注意一点——如果你的团队不能真正代表整个组织，你可能会遗漏关键优先级。务必收集组织各部门的意见，即使某些领域未在团队中得到代表。\n\
  \n此过程有助于从定性角度识别业务优先级。回顾一下，我们正在描述一种同时开发定性和定量 BIA 的尝试。为开始定量评估，BCP 团队应坐下来列出组织资产清单，然后以货币形式为每项资产分配*资产价值*（AV）。这些数字将在后续的\
  \ BIA 步骤中用于开发基于财务的 BIA。\n\n团队必须制定的第二个定量指标是*最大可容忍停工时间*（MTD），有时也称为*最大可容忍中断时间*（MTO）。MTD\
  \ 是指业务功能在不对业务造成不可挽回损害的情况下，能够保持不可操作状态的最长时间。MTD 在进行 BCP 和灾难恢复规划（DRP）时提供了宝贵的信息。\n\n\
  这引出了另一个指标，即每个业务功能的*恢复时间目标*（RTO）。这是你认为在发生中断事件时，可行恢复该功能所需的时间。一旦你定义了恢复目标，就可以设计和规划完成恢复任务所需的程序。\n\
  \nBCP 流程的目标是确保你的 RTO 小于 MTD，从而形成一种局面：功能永远不会在最大可容忍停工时间之外处于不可用状态。\n\n#### 风险识别\n\n\
  BIA 的下一阶段是识别对组织构成的风险。此特定于组织的清单中的一些要素可能立刻浮现在脑海中。而识别其他更隐蔽的风险，可能需要 BCP 团队发挥一些创造力。\n\
  \n风险分为两种形式：自然风险和人为风险。以下清单列出了一些构成自然威胁的事件：\n\n*   暴风/飓风/龙卷风/暴风雪\n*   雷击\n*   地震\n\
  *   泥石流/雪崩\n*   火山爆发\n\n人为威胁包括以下事件：\n\n*   恐怖袭击/战争/内乱\n*   盗窃/破坏\n*   火灾/爆炸\n* \
  \  长时间停电\n*   建筑物倒塌\n*   交通瘫痪\n*   互联网中断\n*   服务提供商中断\n\n请记住，这些绝非详尽无遗的清单。它们仅列出了许多组织面临的一些常见风险。你可能想将它们作为起点，但组织面临的完整风险清单将需要\
  \ BCP 团队所有成员的投入。\n\n该过程的风险识别部分纯粹是定性的。此时，BCP 团队不应关心每种风险实际发生的可能性，也不应关心此类事件对业务持续运营会造成多大损害。此分析的结果将驱动剩余\
  \ BIA 任务的定性和定量两个部分。\n\n#### 可能性评估\n\n\n\n\n### 业务影响评估：可能性与影响\n\n前一步骤包括 BCP 团队列出一份可能威胁组织的事件的综合清单。您可能已经注意到，某些事件发生的可能性比其他事件大得多。例如，对于位于加利福尼亚南部的企业来说，地震比热带风暴更有可能构成风险。而位于佛罗里达州的企业，这两种风险发生的可能性可能恰好相反。\n\
  \n为了说明这些差异，业务影响评估的下一阶段是确定每种风险发生的可能性。为了保持计算的一致性，该评估通常以 `annualized rate of occurrence`（ARO，年化发生率）来表示，反映企业预计每年经历特定灾难的次数。\n\
  \nBCP 团队应坐下来，为上一节中确定的每项风险确定一个 ARO。这些数字应基于企业历史、团队成员的专业经验以及专家（如气象学家、地震学家、消防专业人员和其他顾问）的建议（视情况而定）。\n\
  \n在许多情况下，您可能能够免费找到专家针对某些风险编制的可能性评估。例如，美国地质调查局（USGS）开发了 图 3.1 所示的地震危险图。该图展示了美国各地区地震的\
  \ ARO。同样，联邦应急管理局（FEMA）协调开发了美国各地社区的详细洪水地图。这些资源可在线获取，为执行业务影响评估的组织提供了丰富的信息。\n\n![图\
  \ 3.1 美国地震危险图](img/c03f001.jpg)\n\n**图 3.1** 美国地震危险图\n\n#### 影响评估\n\n正如您根据其名称所推测的那样，影响评估是业务影响评估中最关键的部分之一。在此阶段，您将分析在风险识别和可能性评估期间收集的数据，并尝试确定每个已识别风险一旦发生会对业务产生什么影响。\n\
  \n从定量角度来看，我们将介绍三个具体指标：暴露因子、单次损失期望值和年化损失期望值。这些值中的每一个都是针对前几个阶段评估的每个特定风险/资产组合计算得出的。\n\
  \n`exposure factor`（EF，暴露因子）是风险对资产造成的损害程度，以资产价值的百分比表示。例如，如果 BCP 团队咨询消防专家并确定建筑火灾将导致建筑物\
  \ 70% 被毁，则该建筑对火灾的暴露因子为 70%。\n\n`single loss expectancy`（SLE，单次损失期望值）是风险每次发生时预期的货币损失。您可以使用以下公式计算\
  \ SLE：\n\n```\nSLE = AV × EF\n```\n\n继续以上例，如果建筑价值 500,000 美元，则单次损失期望值为 500,000 美元的\
  \ 70%，即 350,000 美元。您可以理解为：建筑物发生一场火灾预计会造成 350,000 美元的损失。\n\n`annualized loss expectancy`（ALE，年化损失期望值）是企业预计因风险损害资产而在一年内发生的货币损失。您已经拥有执行此计算所需的所有数据。SLE\
  \ 是您预计每次灾难发生时的损失金额，而 ARO（来自可能性分析）是您预计每年发生灾难的次数。只需将这两个数字相乘即可计算 ALE：\n\n```\nALE =\
  \ SLE × ARO\n```\n\n回到我们的建筑示例，如果消防专家预测该建筑每 30 年发生一次火灾，则 ARO 约为 1/30，即 0.03。ALE 即为\
  \ 350,000 美元 SLE 的 3%，即 10,500 美元。您可以理解为：企业每年预计因建筑火灾损失 10,500 美元。\n\n显然，火灾不会每年都发生——此数字代表两次火灾间隔\
  \ 30 年内的平均成本。它对于预算考虑并无特别用处，但在尝试确定 BCP 资源分配给特定风险的优先级时却极其宝贵。这些概念在第二章“人员安全与风险管理概念”中也有涉及。\n\
  \n从定性角度来看，您必须考虑中断可能对您的业务造成的非货币影响。例如，您可能需要考虑以下因素：\n\n*   客户群中的商誉损失\n*   长时间停工导致员工流失至其他工作岗位\n\
  *   对社区的社会/道德责任\n*   负面宣传\n\n很难为这些项目赋予美元价值以将其纳入影响评估的定量部分，但它们同等重要。毕竟，如果您的客户基础被摧毁，当您准备恢复运营时，将没有业务可供恢复！\n\
  \n#### 资源优先级排序\n\nBIA 的最后一步是根据在 BIA 先前任务中识别和评估的各种风险，确定业务连续性资源分配的优先级。\n\n从定量角度来看，此过程相对简单。您只需列出在\
  \ BIA 过程中分析的所有风险，并根据影响评估阶段计算出的 ALE 以降序排列。这将为您提供一份应优先处理的风险优先级列表。从列表顶部开始，选择您愿意并能够同时处理的尽可能多的项目，然后依次向下处理。最终，您将到达一个节点：要么风险列表已耗尽（不太可能！），要么所有可用资源已耗尽（更有可能！）。\n\
  \n回顾上一节，我们还强调了解决定性重要问题的重要性。在之前关于 BIA 的章节中，我们将定量和定性分析视为主要独立但分析上有一定重叠的功能。现在是合并这两个优先级列表的时候了，这更多是一门艺术而非科学。您必须与\
  \ BCP 团队和高级管理团队的代表坐下来，将这两个列表合并为一个单一的优先级列表。\n\n定性考量可能证明提高或降低 ALE 排序定量列表上已有风险的优先级是合理的。例如，如果您经营一家消防公司，尽管地震可能造成更大的物理损害，但您的首要任务可能仍是防止主要营业场所发生火灾。因火灾导致消防公司毁灭而在商业界造成的潜在声誉损失可能太难挽回，并导致企业最终倒闭，这足以证明提高该风险优先级的合理性。\n\
  \n### 连续性规划\n\n\n\n\n\n### 业务连续性规划：连续性规划阶段\n\nBCP 流程的前两个阶段（项目范围与规划以及业务影响评估）侧重于确定\
  \ BCP 流程如何运作，并对必须防止中断的业务资产进行优先级排序。BCP 开发的下一阶段——连续性规划，侧重于制定和实施连续性策略，以最大限度地降低已实现的风险对受保护资产可能造成的影响。\n\
  \n在本节中，您将了解连续性规划中涉及的子任务。\n\n*   策略制定\n*   条款与流程\n*   计划批准\n*   计划实施\n*   培训与教育\n\
  \n#### 策略制定\n\n策略制定阶段填补了业务影响评估与 BCP 开发的连续性规划阶段之间的空白。BCP 团队现在必须获取定量和定性资源优先级排序练习所提出的优先关注事项列表，并确定哪些风险将由业务连续性计划来应对。全面应对所有应急情况将要求实施条款和流程，以在面对所有可能的风险时保持零停机状态。显而易见，实施如此全面的政策根本不可能。\n\
  \nBCP 团队应回顾 `BIA` 早期阶段创建的 `MTD` 估算，并确定哪些风险被视为可接受，哪些必须通过 BCP 连续性条款来缓解。其中一些决定显而易见——暴风雪袭击埃及运营设施的风险微乎其微，会被视为可接受风险。而孟买的季风风险足够严重，必须通过\
  \ BCP 条款来缓解。\n\n一旦 BCP 团队确定了哪些风险需要缓解以及将为每项缓解任务投入何种级别的资源，他们就可以进入连续性规划的条款与流程阶段。\n\n\
  #### 条款与流程\n\n条款与流程阶段是整个业务连续性计划的核心。在此任务中，BCP 团队设计具体的程序和机制，以缓解在策略制定阶段被认定为不可接受的风险。必须通过\
  \ BCP 条款和流程保护三类资产：人员、建筑/设施和基础设施。在接下来的三节中，我们将探讨一些可用于保护这些类别的技术。\n\n#### 人员\n\n首先，您必须确保组织内的人员在紧急情况发生前、期间和之后的安全。实现这一目标后，您必须制定条款，使员工能够在环境允许的情况下，以尽可能正常的方式执行其\
  \ BCP 和运营任务。\n\n应为人员提供完成其分配任务所需的所有资源。同时，如果环境要求人员在工作场所停留较长时间，必须安排好住所和食物。任何要求这些条款的连续性计划都应包含针对灾难事件的\
  \ BCP 团队详细指示。组织应在易于获取的位置维持足以供运营和支持团队长期食用的物资储备。计划应规定定期轮换这些储备以防止变质。\n\n##### 建筑与设施\n\
  \n许多企业需要专用设施才能开展关键运营。这些设施可能包括标准办公设施、制造工厂、运营中心、仓库、配送/物流中心和维修/保养站等。当您执行 `BIA` 时，将识别出在组织持续生存能力中发挥关键作用的设施。您的连续性计划应针对每个关键设施解决两个方面的问题。\n\
  \n###### 加固条款\n\n您的 BCP 应概述可采取的机制和程序，以保护现有设施免受策略制定阶段所定义风险的侵害。这可能包括像修补漏雨屋顶这样简单的步骤，也可能包括安装加固的防飓风百叶窗和防火墙这样复杂的工程。\n\
  \n###### 备用站点\n\n如果无法对设施进行加固以抵御风险，您的 BCP 应确定备用站点，以便业务活动能立即恢复（或至少在比所有受影响关键业务功能的 `maximum\
  \ tolerable downtime`（最大可容忍停机时间）更短的时间内恢复）。第 18 章描述了在此阶段可能有用的几种设施类型。\n\n##### 基础设施\n\
  \n每个企业都依赖某种基础设施来进行关键流程。对许多企业而言，该基础设施的关键部分是一个 IT 骨干网，由处理订单、管理供应链、处理客户交互并执行其他业务功能的通信和计算机系统组成。该骨干网由若干服务器、工作站以及站点间的关键通信链路组成。BCP\
  \ 必须解决如何保护这些系统免受策略制定阶段识别出的风险侵害。与建筑和设施一样，提供这种保护主要有两种方法。\n\n###### 物理加固系统\n\n您可以通过引入保护措施来保护系统免受风险侵害，例如计算机安全灭火系统和不间断电源。\n\
  \n###### 替代系统\n\n您还可以通过引入冗余（无论是冗余组件，还是依赖不同设施的完全冗余系统/通信链路）来保护业务功能。\n\n这些相同的原则适用于为您的关键业务流程提供服务的任何基础设施组件——交通系统、电力网、银行和金融系统、供水系统等。\n\
  \n### 计划批准与实施\n\n一旦 BCP 团队完成了 BCP 文档的设计阶段，就该争取高层管理人员对计划的认可了。如果您有幸在整个计划开发阶段都有高级管理层的参与，这应该是一个相对简单的过程。另一方面，如果这是您第一次向管理层提交\
  \ BCP 文档，您应该准备好对计划的目的和具体条款进行详尽的解释。\n\n#### 计划批准\n\n如果可能，您应该争取企业最高行政长官——首席执行官、董事长、总裁或类似的企业领导者——对计划的认可。此举向整个组织展示了该计划的重要性，并彰显了企业领导者对业务连续性的承诺。此类人员在计划上的签名也会使其在其他高级管理人员眼中具有更大的分量和可信度，否则他们可能会将其视为一个必要但微不足道的\
  \ IT 举措。\n\n#### 计划实施\n\n一旦获得高级管理层的批准，就该全身心投入并开始实施您的计划了。BCP 团队应聚在一起，制定一个实施时间表，利用专门用于该计划的资源，在修改范围和组织氛围允许的情况下，尽快实现既定的流程和条款目标。\n\
  \n所有资源全面部署后，BCP 团队应监督实施适当的 BCP 维护计划，以确保计划始终能响应不断变化的业务需求。\n\n#### 培训与教育\n\n培训与教育是\
  \ BCP 实施的基本要素。所有将参与该计划的人员（无论直接还是间接）都应接受关于整体计划及其个人职责的某种形式的培训。\n\n\n\n\n组织中的每个人都应至少接受一次计划概述简报，使他们确信业务领导者已考虑到对业务持续运营构成的潜在风险，并已制定计划以减轻业务中断对组织的影响。\n\
  \n负有直接 BCP 职责的人员应接受其特定 BCP 任务的培训和评估，以确保他们能在灾难发生时高效完成这些任务。此外，每个 BCP 任务至少应有一名受过培训的备份人员，以确保在人员受伤或紧急情况下无法到达工作场所时仍有冗余保障。\n\
  \n#### BCP 文档\n\n文档编写是业务连续性规划过程中的关键步骤。将 BCP 方法论记录在案可带来多项重要益处。\n\n*   它确保 BCP 人员在紧急情况下拥有书面的连续性文档可供参考，即使高级\
  \ BCP 团队成员不在场指导工作。\n*   它提供了 BCP 过程的历史记录，这将有助于未来人员理解各项程序背后的理由，并在计划中实施必要的变更。\n* \
  \  它迫使团队成员将想法记录在纸上——这一过程往往有助于发现计划中的缺陷。将计划文档化还允许将草稿分发给非 BCP 团队成员进行“合理性检查”。\n\n在以下章节中，我们将探讨书面业务连续性计划的一些重要组成部分。\n\
  \n##### 连续性规划目标\n\n首先，计划应描述 BCP 团队和高级管理层制定的连续性规划目标。这些目标应在第一次 BCP 团队会议之前或期间确定，并且在\
  \ BCP 的整个生命周期内很可能保持不变。\n\nBCP 最常见的目标非常简单：确保业务在紧急情况下持续运营。文档的此部分也可根据组织需求添加其他目标。例如，您可能会设定目标：客户呼叫中心连续停机时间不超过\
  \ 15 分钟，或备份服务器能在激活后 1 小时内处理 75% 的处理负载。\n\n##### 重要性声明\n\n重要性声明反映了 BCP 对组织持续生存能力的关键性。该文档通常以致组织员工的一封信的形式出现，说明组织投入大量资源进行\
  \ BCP 开发过程的原因，并请求所有人员在 BCP 实施阶段予以配合。\n\n这正是高级管理层支持发挥作用的地方。如果能由首席执行官（CEO）或同级别高管签署并发布此信，该计划在您尝试在整个组织中推行变革时将具有极大的分量。如果只有低级别经理签名，当您尝试与该个人直接控制范围之外的组织部门合作时，可能会遇到阻力。\n\
  \n##### 优先级声明\n\n优先级声明直接源自业务影响评估的识别优先级阶段。它仅涉及将对持续业务运营至关重要的功能按优先顺序列出。在列出这些优先级时，还应包含一份声明，说明它们是作为\
  \ BCP 过程的一部分制定的，仅反映这些功能在紧急情况下对持续业务运营的重要性，别无其他含义。否则，优先级列表可能被用于非预期目的，导致竞争部门之间为争夺地盘而展开政治斗争，从而损害业务连续性计划。\n\
  \n##### 组织责任声明\n\n组织责任声明同样来自高级管理层，可合并到与重要性声明同一封信中。其基本含义是“业务连续性是每个人的责任！”组织责任声明重申了组织对业务连续性规划的承诺，并告知员工、供应商和关联方，他们每个人都应尽一切努力协助\
  \ BCP 过程。\n\n##### 紧迫性与时限声明\n\n紧迫性与时限声明表达了实施 BCP 的关键性，并概述了 BCP 团队决定并经高层管理同意的实施时间表。该声明的措辞将取决于组织领导层赋予\
  \ BCP 过程的实际紧迫程度。如果该声明包含在与优先级声明和组织责任声明同一封信中，则时间表应作为单独的文件包含在内。否则，时间表和此声明可放在同一文档中。\n\
  \n##### 风险评估\n\nBCP 文档的风险评估部分本质上是对业务影响评估期间进行的决策过程的回顾。它应包括 BIA 期间考虑的所有风险，以及为评估这些风险而执行的定量和定性分析的讨论。对于定量分析，应包含实际的\
  \ AV、EF、ARO、SLE 和 ALE 数值。对于定性分析，应向读者提供风险分析背后的思维过程。重要的是要注意，风险评估必须定期更新，因为它反映的是某一时间点的评估结果。\n\
  \n##### 风险接受/缓解\n\nBCP 文档的风险接受/缓解部分包含 BCP 过程策略开发部分的结果。它应涵盖文档风险分析部分中识别的每个风险，并概述以下两种思维过程之一。\n\
  \n*   对于被认为可接受的风险，应说明该风险被视为可接受的理由，以及可能导致重新考虑这一决定的潜在未来事件。\n*   对于被认为不可接受的风险，应说明为降低对组织持续生存能力的风险而采取的风险管理规定和流程。\n\
  \n##### 关键记录计划\n\nBCP 文档还应为组织概述一项关键记录计划。该文档说明关键业务记录的存储位置，以及制作和存储这些记录备份副本的程序。\n\n\
  实施关键记录计划的最大挑战之一，往往在于首先识别出哪些是关键记录！随着许多组织从基于纸质的工作流程转向数字化工作流程，它们往往失去了围绕创建和维护正式文件结构的严谨性。关键记录现在可能分布在各种\
  \ IT 系统和云服务中。有些可能存储在供群组访问的中央服务器上，而另一些可能位于分配给个人员工的数字存储库中。\n\n\n\n如果这种混乱的局面听起来像是你当前的现实，你可能想要通过识别对业务真正至关重要的记录，来启动你的关键记录计划。与职能部门负责人坐下来询问：“如果我们今天需要在一个完全陌生的新地点重建组织，且无法访问任何计算机或文件，你们需要哪些记录？”以这种方式提问，迫使团队将重建运营的实际过程可视化，当他们在脑海中走完这些步骤时，就会生成一份组织关键记录的清单。随着时间的推移，随着人们想起其他重要的信息来源，这份清单可能会不断演变，因此你应该考虑通过多次交流来最终确定它。\n\
  \n一旦你识别出组织认为至关重要的记录，下一项任务将是一项艰巨的任务：找到它们！你应该能够识别出关键记录清单中每条记录的存储位置。完成这项任务后，你便可以利用这份关键记录清单来指导你业务连续性规划工作的其余部分。\n\
  \n#### 应急响应指南\n\n应急响应指南概述了组织和个人在紧急情况下立即响应的职责。该文档为最先发现紧急情况的员工提供了他们应采取的步骤，以激活那些不会自动激活的\
  \ BCP 条款。这些指南应包含以下内容：\n\n*   即时响应程序（安保与安全程序、灭火程序、通知相关应急响应机构等）\n*   应被通知事件的个人名单（高管、BCP\
  \ 团队成员等）\n*   首批响应人员在等待 BCP 团队集结期间应采取的次级响应程序\n\n你的指南应易于组织中可能成为危机事件首批响应者的每个人获取。每当中断发生时，时间就是生命。激活业务连续性程序的延迟可能会导致业务运营出现不可取的停机时间。\n\
  \n##### 维护\n\nBCP 文档和计划本身必须是**活文档**。每个组织都面临近乎持续不断的变化，这种动态性质确保了企业的连续性需求也将随之演变。BCP\
  \ 团队不应在计划制定后解散，而应定期开会讨论计划，并审查计划测试的结果，以确保其持续满足组织需求。\n\n显然，对计划的微小更改不需要从头进行完整的 BCP\
  \ 开发流程；只需在 BCP 团队的非正式会议上经全体一致同意即可做出。但请记住，组织使命或资源的剧烈变化可能需要回到 BCP 绘图板前，重新开始。\n\n每当你对\
  \ BCP 进行更改时，必须实施良好的版本控制。所有旧版本的 BCP 应被物理销毁，并由最新版本取代，以免对 BCP 的正确实施产生任何混淆。\n\n将 BCP\
  \ 组件纳入职位描述也是一种良好的做法，以确保 BCP 保持新鲜并被正确执行。在员工的职位描述中包含 BCP 职责，也使其成为绩效考核过程的合理依据。\n\n\
  #### 测试与演练\n\nBCP 文档还应概述一个正式的演练计划，以确保计划保持最新，且所有人员都经过充分培训，能够在灾难发生时履行其职责。测试过程与灾难恢复计划所用的过程非常相似，因此我们将把具体测试类型的讨论留到第\
  \ 18 章。\n\n### 概要\n\n每个依赖技术资源生存的组织都应制定一份全面的业务连续性计划，以确保在不可预见的紧急情况发生时，组织能持续生存。支撑可靠业务连续性规划实践的重要概念有很多，包括项目范围与规划、业务影响评估、连续性规划，以及批准与实施。\n\
  \n每个组织都必须制定计划和程序，以帮助减轻灾难对持续运营的影响，并加速恢复正常运营。为了确定你的企业面临的、需要缓解的风险，你必须与一个跨职能团队合作，从定量和定性两个角度进行业务影响评估。你必须采取适当的步骤为组织制定连续性策略，并知道如何应对未来的灾难。\n\
  \n最后，你必须创建所需的文档，以确保计划能有效地传达给当前和未来的 BCP 团队参与者。此类文档应包含连续性规划指南。业务连续性计划还必须包含重要性声明、优先级、组织责任、紧迫性和时限。此外，文档还应包括风险评估、接受和缓解计划；关键记录计划；应急响应指南；以及维护和测试计划。\n\
  \n第 18 章将把这种规划推进到下一步——制定和实施灾难恢复计划，其中包括在面对灾难时维持业务运行所需的技术控制。\n\n### 考试要点\n\n**理解业务连续性规划过程的四个步骤。**\
  \ 业务连续性规划包含四个不同的阶段：项目范围与规划、业务影响评估、连续性规划，以及批准与实施。每项任务都为确保业务运营在紧急情况下不中断这一总体目标做出贡献。\n\
  \n**描述如何执行业务组织分析。** 在业务组织分析中，负责领导 BCP 流程的个人确定哪些部门和个人在业务连续性计划中拥有利益相关。该分析用作 BCP 团队选择的基础，并经\
  \ BCP 团队验证后，用于指导 BCP 开发的后续阶段。\n\n**列出业务连续性规划团队的必要成员。** BCP 团队至少应包含每个运营和支持部门的代表；IT\
  \ 部门的技术专家；具备 BCP 技能的物理和 IT 安全人员；熟悉企业法律、法规和合同责任的法律代表；以及高级管理层的代表。额外的团队成员取决于组织的结构和性质。\n\
  \n**了解业务连续性规划师面临的法律和法规要求。** 企业领导者必须尽职尽责，以确保在灾难发生时股东利益得到保护。某些行业还受联邦、州和地方法规的约束，这些法规强制规定了特定的\
  \ BCP 程序。许多企业还对客户负有合同义务，这些义务必须在灾难发生前后得到履行。\n\n**解释业务影响评估过程的步骤。** 业务影响评估过程的五个步骤是：优先级识别、风险识别、可能性评估、影响评估和资源优先级排序。\n\
  \n\n\n\n### 描述制定连续性策略所采用的过程\n\n在策略制定阶段，BCP 团队确定将缓解哪些风险。在条款与流程阶段，设计将缓解风险的机制和程序。随后，计划必须经高级管理层批准并付诸实施。人员还必须接受关于其在\
  \ BCP 流程中角色的培训。\n\n### 解释为何必须将组织的业务连续性计划完整记录在案的重要性\n\n将计划以书面形式固定下来，能为组织提供一份灾难发生时应遵循程序的书面记录。它能防止“都记在我脑子里”这一弊端，并确保在紧急情况下事件能有序推进。\n\
  \n### 书面实验\n\n1.  为什么要在业务连续性规划团队中加入法律代表？\n2.  “拍脑袋”式的业务连续性规划方法有什么弊端？\n3.  定量风险评估与定性风险评估有何区别？\n\
  4.  业务连续性培训计划应包含哪些关键组成部分？\n5.  业务连续性规划流程的四个主要步骤是什么？\n\n### 复习题\n\n1.  负责制定业务连续性计划的人员应执行的第一步是什么？\n\
