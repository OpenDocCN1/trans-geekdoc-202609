  | 科罗拉多州 | 亚利桑那州 | 加利福尼亚州 |\n| 康涅狄格州 | 阿肯色州 | 关岛 |\n| 特拉华州 | 伊利诺伊州 | 夏威夷州 |\n| 佐治亚州\
