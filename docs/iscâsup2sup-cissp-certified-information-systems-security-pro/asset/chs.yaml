  \    2.  认证\n    3.  审计\n    4.  授权\n\n7.  可以使用什么来防止用户在两个密码之间轮换使用？\n\n    1.  密码复杂度\n\
  \    2.  密码历史\n    3.  密码使用期限\n    4.  密码长度\n\n8.  以下哪项*最能*说明口令的优势？\n\n    1.  它很短。\n\
