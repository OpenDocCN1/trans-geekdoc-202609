  \     1. 补丁管理流程\n     2. 漏洞管理流程\n     3. 配置管理流程\n     4. 变更管理流程\n\n19. 以下哪项*不*属于补丁管理流程的一部分？\n\
  \     1. 评估补丁。\n     2. 测试补丁。\n     3. 部署所有补丁。\n     4. 审核补丁。\n\n20. 您组织内的服务器最近遭到攻击，导致过度停机。您被要求检查系统的已知问题，攻击者可能利用这些问题攻击您网络中的其他系统。以下哪项是满足此需求的最佳选择？\n\
  \     1. 版本跟踪器\n     2. 漏洞扫描器\n     3. 安全审计\n     4. 安全审查\n\n### 第 17 章：预防和响应事件\n\
  \n**本章涵盖的 CISSP 考试主题包括：**\n\n*   **领域 7：安全运营**\n    *   7.3 进行日志记录和监控活动\n      \
  \  *   7.3.1 入侵检测和预防\n        *   7.3.2 安全信息和事件管理 (SIEM)\n        *   7.3.3 持续监控\n\
  \        *   7.3.4 出站监控\n    *   7.7 进行事件管理\n        *   7.7.1 检测\n        *   7.7.2\
  \ 响应\n        *   7.7.3 缓解\n        *   7.7.4 报告\n        *   7.7.5 恢复\n       \
  \ *   7.7.6 补救\n        *   7.7.7 经验教训\n\n\n\n### 7.8 操作和维护检测性和预防性措施\n\n*   7.8.1\
  \ 防火墙\n*   7.8.2 入侵检测和防御系统\n*   7.8.3 白名单/黑名单\n*   7.8.4 第三方提供的安全服务\n*   7.8.5 沙箱技术\n\
  *   7.8.6 蜜罐/蜜网\n*   7.8.7 反恶意软件\n\n![images](img/clogo.jpg) CISSP 认证考试的安全运营领域包含几个直接与事件管理相关的目标。有效的事件管理有助于组织在攻击发生时做出适当响应，以限制攻击范围。组织实施预防措施以防范和检测攻击，本章涵盖了许多此类控制和对策。日志记录、监控和审计提供保证，确保安全控制到位并提供所需的保护。\n\
  \n### 管理事件响应\n\n任何安全计划的主要目标之一是预防安全事件。然而，尽管信息技术 (IT) 和安全专业人员竭尽全力，事件仍会发生。一旦发生，组织必须能够做出响应以限制或遏制事件。事件响应的主要目标是将对组织的影响降至最低。\n\
  \n#### 定义事件\n\n在深入探讨事件响应之前，了解事件的定义非常重要。虽然这看似简单，但你会发现根据上下文不同，存在不同的定义。\n\n`事件` 是指对组织资产的机密性、完整性或可用性产生负面影响的任何事件。信息技术基础设施库第\
  \ 3 版 (ITILv3) 将事件定义为“IT 服务的非计划中断或 IT 服务质量的下降”。请注意，这些定义涵盖的事件类型多种多样，包括直接攻击、自然灾害（如飓风或地震），甚至意外事故（如有人意外切断了活动网络的电缆）。\n\
  \n相比之下，`计算机安全事件`（有时简称为 `安全事件`）通常指由攻击引起的事件，或由用户恶意或故意行为导致的事件。例如，征求意见稿 (RFC) 2350《计算机安全事件响应期望》将安全事件和计算机安全事件均定义为“危及计算机或网络安全某方面的任何不利事件”。美国国家标准与技术研究院\
  \ (NIST) 特别出版物 (SP) 800-61《计算机安全事件处理指南》将计算机安全事件定义为“违反或即将违反计算机安全策略、可接受使用策略或标准安全实践的行为。”（NIST\
  \ 文档，包括 SP 800-61，可从 NIST 出版物页面访问：[`csrc.nist.gov/Publications`](https://csrc.nist.gov/Publications)）。\n\
  \n在事件响应的语境中，事件是指计算机安全事件。不过，你经常会看到它仅被列为事件。例如，在 CISSP 安全运营领域中，“实施事件管理”目标显然是指计算机安全事件。\n\
  \n组织通常在其安全策略或事件响应计划中定义计算机安全事件的含义。该定义通常为一两句话，并包含组织归类为安全事件的常见事件示例，例如：\n\n*   任何企图的网络入侵\n\
  *   任何企图的拒绝服务攻击\n*   任何恶意软件的检测\n*   任何未经授权的数据访问\n*   任何违反安全策略的行为\n\n#### 事件响应步骤\n\
  \n有效的事件响应管理通过若干步骤或阶段来处理。图 17.1 显示了 CISSP 目标中概述的管理事件响应所涉及的七个步骤。重要的是要认识到，事件响应是一项持续的活动，经验教训阶段的结果可用于改进检测方法或帮助防止事件重复发生。以下各节将更深入地描述这些步骤。\n\
  \n![图 17.1 事件响应](img/c17f001.jpg)\n\n**图 17.1** 事件响应\n\n必须强调的是，事件响应不包括对攻击者的反击。对他人发动攻击适得其反且通常是非法的。如果技术人员能识别攻击者并发动攻击，极有可能导致攻击者升级攻击。换句话说，攻击者可能将其视为私人恩怨，并定期发动报复性攻击。此外，攻击者很可能隐藏在一个或多个无辜受害者背后。攻击者常使用欺骗手段隐藏身份，或利用僵尸网络中的僵尸主机发动攻击。反击可能针对的是无辜受害者，而非攻击者。\n\
  \n##### 检测\n\nIT 环境包含多种检测潜在事件的方法。以下列表列出了许多用于检测潜在事件的常用方法，并说明了这些方法如何报告事件：\n\n*   入侵检测和防御系统（本章后面介绍）在发生关注事件时向管理员发送警报。\n\
  *   反恶意软件在检测到恶意软件时通常会显示弹出窗口进行指示。\n*   许多自动化工具定期扫描审计日志，查找预定义事件，例如特权的使用。当它们检测到特定事件时，通常会向管理员发送警报。\n\
  *   最终用户有时会检测到异常活动，并联系技术人员或管理员寻求帮助。当用户报告无法访问网络资源或更新系统等事件时，会提醒 IT 人员注意潜在事件。\n\n请注意，仅仅因为\
  \ IT 专业人员收到自动化工具的警报或用户的投诉，并不总意味着事件已发生。入侵检测和防御系统经常发出误报，最终用户也容易犯简单的操作错误。IT 人员会调查这些事件以确定它们是否为事件。\n\
  \n许多 IT 专业人员被归类为事件的首批响应者。他们是最先到达现场的人员，并具备将典型 IT 问题与安全事件区分开来的知识。他们类似于医疗急救人员，后者拥有出色的技能和能力，可在事故现场提供医疗援助，并在必要时帮助将患者送往医疗机构。医疗急救人员接受过特定培训，以帮助他们判断轻伤与重伤的区别。此外，他们知道遇到重伤时该怎么做。同样，IT\
  \ 专业人员需要特定培训，以便判断需要排查的典型问题与需要升级处理的安全事件之间的区别。\n\n在调查事件并确定其为安全事件后，IT 人员将进入下一步：响应。在许多情况下，进行初步调查的个人会升级事件，引入其他\
  \ IT 专业人员进行响应。\n\n##### 响应\n\n\n\n### 事件响应\n\n在检测并验证事件后，下一步是响应。响应方式因事件严重程度而异。许多组织都设有专门的事件响应团队——有时称为计算机事件响应小组（`CIRT`），或计算机安全事件响应小组（`CSIRT`）。组织会在重大安全事件期间激活该团队，但通常不会针对轻微事件激活。正式的事件响应计划会记录谁会在什么条件下激活该团队。\n\
  \n团队成员会接受事件响应和组织事件响应计划的培训。通常，团队成员协助调查事件、评估损失、收集证据、报告事件以及执行恢复程序。他们还参与补救和经验总结阶段，并协助进行根因分析。\n\
  \n组织响应事件的速度越快，限制损失的机会就越大。反之，如果事件持续数小时或数天，损失可能会更大。例如，攻击者可能试图访问客户数据库。快速响应可以阻止攻击者获取任何有意义的数据。然而，如果攻击者在数小时或数天内持续获得对数据库的无阻碍访问，他们可能会窃取整个数据库副本。\n\
  \n调查结束后，管理层可能决定起诉责任人。因此，在调查期间将所有数据作为证据加以保护至关重要。第 19 章“调查与伦理”涵盖了支持调查背景下的事件处理与响应。如果存在起诉的可能性，团队成员会采取额外措施保护证据，以确保证据可用于法律程序。\n\
  \n#### 缓解\n\n缓解措施旨在遏制事件。有效事件响应的主要目标之一是限制事件的影响或范围。例如，如果受感染的计算机正通过其网络接口卡（`NIC`）向外发送数据，技术人员可以禁用\
  \ `NIC` 或拔掉连接 `NIC` 的网线。有时遏制涉及将一个网络与其他网络断开，以将问题限制在单个网络内。问题隔离后，安全人员即可处理，而无需担心其扩散到网络的其他部分。\n\
  \n在某些情况下，响应人员会采取措施缓解事件，但不让攻击者知晓攻击已被发现。这使安全人员能够监控攻击者的活动并确定攻击范围。\n\n#### 报告\n\n报告是指在组织内部以及向组织外部的组织和个人报告事件。虽然无需向公司首席执行官（`CEO`）报告轻微的恶意软件感染，但高层管理人员确实需要了解严重的安全漏洞。\n\
  \n例如，2017 年的 `WannaCry` 勒索软件攻击在一天内感染了 150 多个国家的 230,000 多台计算机。恶意软件显示“Ooops your\
  \ files have been encrypted”消息。据报道，该攻击感染了英国国家医疗服务体系（`NHS`）的部分系统，迫使一些医疗服务仅能以紧急模式运行。随着\
  \ IT 人员了解攻击的影响，他们开始向主管报告，这些报告极有可能在攻击发生当天就传达给了高管。\n\n组织通常有法律义务向组织外部报告某些事件。大多数国家（以及许多较小的司法管辖区，包括州和市）都颁布了监管合规法律来管辖安全漏洞，特别是涉及信息系统中保留的敏感数据时。这些法律通常包括报告事件的要求，尤其是安全漏洞暴露了客户数据时。法律因地区而异，但都旨在保护个人记录和信息的隐私、保护消费者身份，并建立金融实践和公司治理标准。每个组织都有责任了解适用于自身的法律并遵守这些法律。\n\
  \n许多司法管辖区都有管辖个人身份信息（`PII`）保护的具体法律。如果数据泄露暴露了 `PII`，组织必须报告。不同法律的报告要求不同，但大多数都包括通知受事件影响个人的要求。换句话说，如果系统遭受攻击导致攻击者获取了关于你的\
  \ `PII`，系统所有者有责任告知你攻击发生的事实以及攻击者访问了哪些数据。\n\n针对严重安全事件，组织应考虑向官方机构报告。在美国，这可能意味着通知联邦调查局（`FBI`）、地方检察官办公室和/或州和地方执法机构。在欧洲，组织可能会根据事件和所在位置向国际刑警组织（`INTERPOL`）或其他实体报告。这些机构可能协助调查，且它们收集的数据可能有助于防止未来针对其他组织的攻击。\n\
  \n许多事件未被报告，因为它们未被识别为事件。这通常是培训不足的结果。显而易见的解决方案是确保人员接受相关培训。培训应教授个人如何识别事件、初始响应该做什么以及如何报告事件。\n\
  \n#### 恢复\n\n调查人员从系统收集所有适当证据后，下一步是恢复系统，即将其恢复到完全正常运行的状态。对于轻微事件，这可能非常简单，可能只需重启即可。然而，重大事件可能需要完全重建系统。重建系统包括从最近的备份中恢复所有数据。\n\
  \n当从头重建受损系统时，重要的是确保其配置正确，且安全性至少不低于事件发生前。如果组织拥有有效的配置管理和变更管理计划，这些计划将提供必要的文档，以确保重建的系统配置正确。需要复查的事项包括：访问控制列表（`ACLs`）、确保禁用或移除不必要的服务和协议、安装所有最新补丁、修改默认用户账户，以及逆转任何妥协。\n\
  \n#### 补救\n\n在补救阶段，人员会审视事件，试图找出导致事件发生的原因，并实施方法防止其再次发生。这包括执行根因分析。\n\n根因分析会检查事件以确定是什么原因导致其发生。例如，如果攻击者成功通过网站访问了数据库，人员会检查系统的所有要素以确定攻击者成功的原因。如果根因分析识别出可缓解的漏洞，此阶段将建议进行变更。\n\
  \n\n\n可能是 Web 服务器没有应用最新补丁，导致攻击者获得了服务器的远程控制权。补救措施可能包括实施补丁管理计划。也许 Web 应用程序没有使用足够的输入验证技术，从而导致成功的结构化查询语言\
  \ (SQL) 注入攻击。补救措施将涉及更新应用程序以包含输入验证。也许数据库位于 Web 服务器上，而不是位于后端数据库服务器中。补救措施可能包括将数据库移至额外防火墙后面的服务器上。\n\
  \n##### 经验教训\n\n在经验教训阶段，人员会检查事件及响应过程，以了解是否有任何经验教训可供汲取。事件响应团队将参与此阶段，但其他了解事件情况的员工也将参与。\n\
  \n在检查事件响应过程时，人员会寻找任何可以改进响应的领域。例如，如果响应团队花费很长时间才遏制住事件，检查将尝试确定原因。可能是人员没有接受足够的培训，缺乏有效响应所需的知识和专业技能。他们可能在收到首次通知时未能识别出该事件，导致攻击持续时间比必要时间更长。第一响应者可能未能识别出保护证据的必要性，并在响应过程中无意中破坏了证据。\n\
  \n请记住，此阶段的输出可以反馈给事件管理的检测阶段。例如，管理员可能会意识到攻击在未被检测到的情况下突破了防线，从而增强其检测能力，并建议对其入侵检测系统进行更改。\n\
  \n事件响应团队在完成经验教训回顾后创建报告是常见做法。根据调查结果，团队可能会建议更改程序、增加安全控制，甚至更改策略。管理层将决定实施哪些建议，并对其拒绝的任何建议所带来的剩余风险负责。\n\
  \n### 实施检测和预防措施\n\n理想情况下，组织可以通过实施预防性对策来完全避免事件。本节介绍了几种可以防止许多攻击的预防性安全控制，并描述了许多常见的知名攻击。当事件确实发生时，组织希望尽快检测到它。入侵检测和预防系统是组织检测事件的方式之一，也包含在本节中，此外还包括组织可以采取的一些具体措施来检测和防止成功攻击。\n\
  \n#### 基本预防措施\n\n虽然没有单一步骤可以防范所有攻击，但您可以采取一些基本步骤，这些步骤在防范多种类型的攻击方面大有裨益。其中许多步骤在本书的其他区域有更深入的描述，但此处将它们列出作为本节的介绍。\n\
  \n**保持系统和应用程序为最新状态。** 供应商会定期发布补丁以修复错误和安全缺陷，但只有应用这些补丁才有帮助。补丁管理（第 16 章“管理安全运营”中介绍）可确保系统和应用程序通过相关补丁保持最新状态。\n\
  \n**移除或禁用不需要的服务和协议。** 如果系统不需要某项服务或协议，则不应运行它。攻击者无法利用系统上未运行的服务或协议中的漏洞。作为一个极端的对比，想象一下一台\
  \ Web 服务器运行着所有可用的服务和协议。它容易受到这些服务和协议上潜在攻击的威胁。\n\n**使用入侵检测和预防系统。** 入侵检测和预防系统会观察活动、尝试检测攻击并提供警报。它们通常可以阻止或停止攻击。这些系统将在本章后面更深入地描述。\n\
  \n**使用最新的反恶意软件。** 第 21 章“恶意代码和应用程序攻击”介绍了病毒和蠕虫等各种类型的恶意代码。主要对策是反恶意软件，本章后面将介绍。\n\n\
  **使用防火墙。** 防火墙可以防止多种不同类型的攻击。基于网络的防火墙保护整个网络，基于主机的防火墙保护单个系统。第 11 章“安全网络架构和网络组件安全”包含有关在网络中使用防火墙的信息，本章也包含一节描述防火墙如何防止攻击。\n\
  \n**实施配置和系统管理流程。** 配置和系统管理流程有助于确保系统以安全方式部署，并在其整个生命周期内保持安全状态。第 16 章介绍了配置和变更管理流程。\n\
  \n#### 了解攻击\n\n安全专业人员需要了解常见的攻击方法，以便采取主动措施加以预防、在发生时识别它们，并在面对攻击时做出适当响应。本节概述了许多常见攻击。以下各节将讨论用于挫败这些及其他攻击的许多预防措施。\n\
  \n##### 僵尸网络\n\n僵尸网络如今非常普遍。僵尸网络中的计算机就像机器人（称为 `bots`，有时称为 `zombies`）。网络中的多个 bot 形成一个僵尸网络，并将执行攻击者指示的任何操作。Bot\
  \ herder（牧羊人/控制者）通常是控制僵尸网络中所有计算机的犯罪分子，他们通过一个或多个命令与控制服务器进行控制。Bot herder 在服务器上输入命令，僵尸会与命令与控制服务器联系以接收指令。僵尸可以被编程为定期联系服务器，或保持休眠状态，直到特定的编程日期和时间，或响应某个事件（例如检测到特定流量时）。Bot\
  \ herder 通常指示僵尸网络中的 bot 发起各种攻击、发送垃圾邮件和网络钓鱼邮件，或将僵尸网络出租给其他犯罪分子。\n\n计算机通常在感染某种恶意代码或恶意软件后加入僵尸网络。一旦计算机被感染，通常会给\
  \ bot herder 提供对系统的远程访问权限，并安装额外的恶意软件。在某些情况下，僵尸会安装搜索包含密码或其他攻击者感兴趣信息的文件的恶意软件，或包含键盘记录器以捕获用户按键。Bot\
  \ herder 经常向僵尸发出命令，导致它们发起攻击。\n\n拥有超过 40,000 台计算机的僵尸网络相对常见，控制数百万系统的僵尸网络在过去也曾活跃。一些\
  \ bot herder 控制不止一个僵尸网络。\n\n有许多方法可以保护系统不被加入僵尸网络，因此最好采用纵深防御策略，实施多层安全防护。由于系统通常在感染恶意软件后被加入僵尸网络，因此重要的是要确保系统和网络受到最新反恶意软件的保护。一些恶意软件利用操作系统和应用程序中未修补的缺陷，因此通过补丁保持系统最新有助于保护它们。然而，攻击者越来越多地创建新的恶意软件来绕过反恶意软件（至少暂时绕过）。他们还在发现尚无可用补丁的漏洞。\n\
  \n\n\n教育用户是防范僵尸网络感染的极其重要的对策。在全球范围内，攻击者几乎持续不断地发送恶意钓鱼邮件。部分邮件包含恶意附件，用户一旦打开，系统就会被纳入僵尸网络。另一些邮件包含指向恶意网站的链接，试图下载恶意软件，或诱骗用户自行下载恶意软件。还有一些试图诱骗用户泄露密码，攻击者随后利用这些窃取的密码渗透系统和网络。对用户进行此类攻击的培训并保持高度的安全意识，往往有助于预防许多攻击。\n\
  \n许多恶意软件感染基于浏览器，当用户浏览网页时，用户系统就会被感染。保持浏览器及其插件更新是一项重要的安全实践。此外，大多数浏览器内置了强大的安全功能，这些功能不应被禁用。例如，大多数浏览器支持沙箱技术以隔离\
  \ Web 应用程序，但某些浏览器允许禁用沙箱。这或许能略微提升浏览器性能，但风险显著。\n\n### 拒绝服务攻击\n\n**拒绝服务（`DoS`）攻击**是指阻止系统处理或响应合法流量或资源/对象请求的攻击。常见的\
  \ `DoS` 攻击形式会向服务器发送海量数据包，导致其无法全部处理。其他形式的 `DoS` 攻击则专注于利用操作系统、服务或应用程序中的已知故障或漏洞。利用该故障通常会导致系统崩溃或\
  \ `CPU` 占用率达到 100%。无论实际攻击由何种内容组成，任何导致受害者无法执行正常活动的攻击均属于 `DoS` 攻击。`DoS` 攻击可能导致系统崩溃、系统重启、数据损坏、服务阻塞等后果。\n\
  \n另一种形式是**分布式拒绝服务（`DDoS`）攻击**。`DDoS` 攻击是指多个系统同时攻击单一系统。例如，一群攻击者可对单一系统发起协同攻击。如今更常见的是，攻击者入侵多个系统，将其作为攻击受害者的跳板。攻击者通常利用僵尸网络发起\
  \ `DDoS` 攻击。\n\n**分布式反射拒绝服务（`DRDoS`）攻击**是 `DoS` 的一种变体。它采用反射方式发动攻击，即不直接攻击受害者，而是操纵流量或网络服务，使攻击从其他源反射回目标。域名系统（`DNS`）投毒攻击（第\
  \ 12 章介绍）和 Smurf 攻击（本章后文介绍）均属于此类。\n\n#### SYN 洪水攻击\n\n**SYN 洪水攻击**是一种常见的 `DoS` 攻击。它破坏传输控制协议（`TCP`）用于发起通信会话的标准三次握手。正常情况下，客户端向服务器发送\
  \ `SYN`（同步）包，服务器回复 `SYN/ACK`（同步/确认）包，客户端再回复 `ACK`（确认）包。此三次握手建立通信会话，双方用于数据传输，直到会话以\
  \ `FIN`（结束）或 `RST`（重置）包终止。\n\n然而，在 SYN 洪水攻击中，攻击者发送大量 `SYN` 包但从不发送 `ACK` 完成连接。这类似于恶作剧者伸出手想握手，对方伸手回应时，恶作剧者却缩回手，让对方尴尬地悬在半空。\n\
  \n图 17.2 展示了一个示例。该例中，单个攻击者发送了三个 `SYN` 包，服务器对每个包均作出响应。针对每个请求，服务器都预留了系统资源等待 `ACK`。服务器通常会等待长达三分钟才中止尝试会话，管理员可调整此时间。\n\
  \n```\n![FIGURE 17.2 SYN flood attack](img/c17f002.jpg)\n```\n\n**图 17.2** SYN 洪水攻击\n\
  \n三个未完成的会话不会造成问题。然而，攻击者会向受害者发送成百上千个 `SYN` 包。每个未完成会话都会消耗资源，最终受害者不堪重负，无法响应合法请求。攻击会耗尽可用内存和处理能力，导致受害者运行缓慢甚至直接崩溃。\n\
  \n攻击者通常会伪造源地址，每个 `SYN` 包具有不同的源地址。这使得基于源互联网协议（`IP`）地址封锁攻击者变得困难。攻击者还会协同发动攻击，对单一受害者同时发起\
  \ `DDoS` 攻击。限制允许的打开会话数量并非有效防御，因为一旦达到上限，合法用户的会话请求也会被阻断。增加服务器允许的会话数只会导致攻击消耗更多系统资源，而服务器的\
  \ `RAM` 和处理能力是有限的。\n\n使用 `SYN cookies` 是阻止此类攻击的一种方法。这些小记录消耗极少的系统资源。系统收到 `ACK` 时，会检查\
  \ `SYN cookies` 并建立会话。防火墙通常包含检查 SYN 攻击的机制，入侵检测和入侵防御系统亦是如此。\n\n另一种阻止方法是减少服务器等待 `ACK`\
  \ 的时间。默认通常为三分钟，但正常操作中，合法系统极少需要三分钟发送 `ACK` 包。缩短等待时间可使半开会话更快从系统内存中清除。\n\n#### Smurf\
  \ 攻击与 Fraggle 攻击\n\nSmurf 攻击和 Fraggle 攻击均属于 `DoS` 攻击。**Smurf 攻击**是另一种洪水攻击，但它用互联网控制消息协议（`ICMP`）回显包而非\
  \ `TCP SYN` 包淹没受害者。具体而言，它是一种伪造的广播 `ping` 请求，使用受害者的 `IP` 地址作为源 `IP` 地址。\n\n`Ping`\
  \ 使用 `ICMP` 检查与远程系统的连通性。正常情况下，`ping` 向单个系统发送回显请求，系统回复回显应答。但在 Smurf 攻击中，攻击者将回显请求作为广播发送给网络上所有系统，并伪造源\
  \ `IP` 地址。所有这些系统均向伪造的 `IP` 地址回复回显应答，从而用海量流量淹没受害者。\n\nSmurf 攻击利用放大网络（亦称 Smurf 放大器），通过路由器发送定向广播。放大网络上的所有系统随即攻击受害者。然而，1999\
  \ 年发布的 `RFC 2644` 更改了路由器的标准默认设置，使其不转发定向广播流量。管理员若按 `RFC 2644` 正确配置路由器，网络就无法成为放大网络。这将\
  \ Smurf 攻击限制在单一网络内。此外，在防火墙、路由器甚至许多服务器上禁用 `ICMP` 以防止任何基于 `ICMP` 的攻击也是常见做法。采用标准安全实践时，Smurf\
  \ 攻击如今鲜少构成问题。\n\n**Fraggle 攻击**与 Smurf 攻击类似。但它不使用 `ICMP`，而是通过 `UDP` 端口 7 和 19 发送\
  \ `UDP` 数据包。Fraggle 攻击会使用受害者的伪造 `IP` 地址广播 `UDP` 数据包。网络上的所有系统随即向受害者发送流量，原理同 Smurf\
  \ 攻击。\n\n#### Ping 洪水攻击\n\n\n\n\n### 网络攻击类型详解\n\n#### Ping 洪水攻击\n\n**Ping 洪水攻击**会向受害者发送大量\
  \ Ping 请求。当僵尸网络中的数万个系统同时向目标系统发送 Ping 请求时，这种攻击作为 DDoS 攻击非常有效。目标系统会因试图响应海量 Ping 请求而不堪重负，无法处理合法请求。目前常见的防御方式是阻断\
  \ ICMP 流量。主动入侵检测系统能够检测到 Ping 洪水，并在攻击期间自动修改环境以阻断 ICMP 流量。\n\n#### 死亡之 Ping\n\n**死亡之\
  \ Ping 攻击**使用超大的 Ping 数据包。正常的 Ping 包通常为 32 或 64 字节（不同操作系统可能使用其他大小），而该攻击将包大小修改为超过\
  \ 64 KB，远超许多系统的处理能力。接收到超大 Ping 包会导致系统崩溃或缓冲区溢出错误。由于补丁和更新已修复该漏洞，此类攻击在今天很少成功。\n\n####\
  \ 泪滴攻击\n\n在**泪滴攻击**中，攻击者以特定方式分片流量，导致系统无法重组数据包。正常情况下大包会被分片传输，接收端负责重组。但泪滴攻击会破坏分片结构，使系统无法重组。旧系统无法处理此情况而崩溃，补丁已解决该问题。虽然现代系统不再易受泪滴攻击，但这强调了保持系统更新的重要性。此外，入侵检测系统可检查畸形数据包。\n\
  \n#### Land 攻击\n\n**Land 攻击**发生在攻击者发送伪造的 SYN 包给受害者，且将受害者的 IP 地址同时作为源和目的 IP 地址。这会欺骗系统不断自回复，导致系统冻结、崩溃或重启。该攻击于\
  \ 1997 年首次发现，后多次针对不同端口重现。保持系统更新并过滤检测源目的地址相同的流量，有助于防御 Land 攻击。\n\n#### 零日漏洞利用\n\n\
  **零日漏洞利用**指攻击者利用未被他人知晓的漏洞发动攻击。安全专业人员在不同语境下使用该术语，含义略有差异，示例如下：\n\n##### 攻击者首次发现漏洞\n\
  \n攻击者发现漏洞后可轻易利用，因其为唯一知情者。此时厂商不知情，未开发或发布补丁。这是零日漏洞利用的常见定义。\n\n##### 厂商得知漏洞\n\n厂商得知漏洞后会评估威胁严重性并确定补丁开发优先级。补丁开发复杂且需大量测试以确保不引入新问题。严重威胁可能在数天内发布补丁，非严重问题可能需数月。此期间利用该漏洞的攻击常被称为零日漏洞利用，因公众不知情。\n\
  \n##### 厂商发布补丁\n\n补丁发布后，已修补系统不再受该漏洞影响。但组织通常需时间评估测试补丁再应用，导致补丁发布与管理员应用之间存在时间差。微软通常在每月第二个周二（“补丁周二”）发布补丁。攻击者常逆向工程补丁以了解细节，次日（“漏洞利用周三”）即发动攻击。有人将补丁发布次日的攻击称为零日攻击，但此用法不常见。多数安全专业人员视其为针对未修补系统的攻击。\n\
  \n防御零日漏洞利用的方法包括多种基础预防措施：\n- 确保系统不运行不必要的服务和协议，以**减少攻击面**\n- 启用网络和主机防火墙，限制潜在恶意流量\n\
  - 使用入侵检测和预防系统，帮助检测和阻断潜在攻击\n- 蜜罐和垫圈系统让管理员有机会观察攻击，可能发现利用零日漏洞的攻击（详见本章后续内容）\n\n### 恶意代码\n\
  \n**恶意代码**是指在计算机系统上执行不需要、未授权或未知活动的任何脚本或程序。形式包括病毒、蠕虫、特洛伊木马、带破坏性宏的文档和逻辑炸弹。常称为**恶意软件**，较少称为**恶意代码**。攻击者不断为几乎所有类型的计算设备或联网设备编写和修改恶意代码。第\
  \ 21 章详细介绍恶意代码。\n\n病毒传播方式持续演变：早期通过软盘手工传播；后期以电子邮件附件或嵌入脚本为主，至今仍流行；许多专业人士认为**路过式下载**是最流行的方法之一。\n\
  \n**路过式下载**指用户不知情下代码被下载安装到系统。攻击者修改网页代码，用户访问时恶意代码在用户不知情或未同意情况下下载安装恶意软件。攻击者有时入侵合法网站植入恶意代码，或自建恶意网站通过钓鱼或重定向诱导用户访问。多数路过式下载利用未修补系统的漏洞，保持系统更新可防范。\n\
  \n攻击者有时利用**恶意广告**传播恶意软件。他们冒充合法公司付费在合法网站投放广告，用户点击后被重定向到恶意站点，通常尝试路过式下载。\n\n另一种流行的恶意软件安装方式采用**按装付费**模式。犯罪分子付费让网站运营商托管恶意软件（常为伪反恶意软件程序，即**流氓软件**），按每次成功安装付费。付费标准不一，但美国电脑上的成功安装通常报酬更高。\n\
  \n虽然大多数恶意软件来自互联网，但部分通过 USB 闪存驱动器传播。许多病毒能检测用户插入 USB 驱动器并感染它，当用户插入另一系统时恶意软件感染该系统。\n\
  \n### 中间人攻击\n\n\n\n\n\n### 中间人攻击\n\n*中间人攻击* 是指恶意用户在逻辑上处于正在进行的通信的两个端点之间。中间人攻击有两种类型。一种涉及复制或嗅探双方之间的流量，这基本上是第\
  \ 14 章所述的嗅探器攻击。另一种类型涉及攻击者将自己置于通信线路中，充当存储转发或代理机制，如 图 17.3 所示。客户端和服务器认为它们直接相连。然而，攻击者会捕获并转发两个系统之间的所有数据。攻击者可以收集登录凭据和其他敏感数据，并更改两个系统之间交换的消息内容。\n\
  \n![图 17.3 中间人攻击](img/c17f003.jpg)\n\n**图 17.3** 中间人攻击\n\n中间人攻击比许多其他攻击需要更高的技术复杂性，因为攻击者需要从客户端的角度成功冒充服务器，并从服务器的角度冒充客户端。中间人攻击通常需要多种攻击的组合。例如，攻击者可能会篡改路由信息和\
  \ DNS 值，获取并安装加密证书以闯入加密隧道，或伪造地址解析协议 (ARP) 查找作为攻击的一部分。\n\n通过及时为系统打补丁，可以挫败某些中间人攻击。入侵检测系统通常无法检测中间人攻击或劫持攻击，但它可以检测通信链路上发生的异常活动，并对可疑活动发出警报。许多用户通常使用虚拟专用网络\
  \ (VPN) 来避免这些攻击。一些 VPN 由员工所在组织托管，但也有几种商业 VPN 任何人都可以使用，通常需要付费。\n\n#### 破坏\n\n员工*破坏*\
  \ 是指员工针对组织实施的破坏或扰乱犯罪行为。如果员工对组织的资产知之甚深，拥有足够的访问权限来操纵环境的关键方面，且已变得不满，这就会成为一种风险。员工破坏最常发生在员工怀疑自己将被无故解雇，或员工在被解雇后仍保留访问权限时。\n\
  \n这也是员工解雇应迅速处理，且账户访问权限应在解雇后尽快禁用的另一个重要原因。防范员工破坏的其他保障措施包括密集审计、监控异常或未经授权的活动、保持员工与管理者之间的沟通渠道畅通，以及对员工的贡献给予适当的补偿和认可。\n\
  \n#### 间谍活动\n\n*间谍活动* 是指恶意收集组织的专有、秘密、私密、敏感或机密信息的行为。攻击者实施间谍活动通常意在向竞争对手或其他感兴趣的组织（如外国政府）泄露或出售信息。攻击者可能是不满的员工，在某些情况下，也可能是被组织外部人员勒索的员工。\n\
  \n这也可能由安插在组织内部的内奸或卧底实施，他们为主要的秘密雇主窃取信息。在某些情况下，间谍活动发生在远离工作场所的地方，如会议或活动中，由专门针对员工移动资产的人实施。\n\
  \n防范间谍活动的对策是严格控制对所有非公开数据的访问，彻底筛选新员工候选人，并高效追踪所有员工活动。\n\n许多报告的间谍活动案例被追溯到由民族国家资助的高级持续性威胁\
  \ (APT)。APT 在本书的多个章节中有所讨论，例如第 14 章。检测这些攻击的方法之一是出口监控，即监控流出网络的流量。\n\n### 入侵检测和防御系统\n\
  \n上一节描述了许多常见攻击。攻击者不断修改其攻击方法，因此攻击通常会随时间演变。同样，检测和防御方法也会随之改变以适应新攻击。入侵检测系统 (IDS) 和入侵防御系统\
  \ (IPS) 是组织通常实施的用于检测和防御攻击的两种方法。\n\n当攻击者能够绕过或挫败安全机制并获得对组织资源的访问权限时，就会发生*入侵*。*入侵检测*\
  \ 是一种特定形式的监控，它监控记录的信息和实时事件，以检测指示潜在事件或入侵的异常活动。*入侵检测系统 (IDS)* 可自动检查日志和实时系统事件，以检测入侵尝试和系统故障。由于\
  \ IPS 包含检测功能，您经常会看到它们被称为入侵检测和防御系统 (IDPS)。\n\nIDS 是检测许多 DoS 和 DDoS 攻击的有效方法。它们可以识别来自外部连接的攻击（如来自互联网的攻击）以及内部传播的攻击（如恶意蠕虫）。一旦检测到可疑事件，它们会通过发送警报或触发警报来响应。在某些情况下，它们可以修改环境以阻止攻击。IDS\
  \ 的主要目标是为及时、准确地响应入侵提供手段。\n\n入侵防御系统 (IPS) 包含 IDS 的所有功能，但也可以采取额外措施来阻止或防御入侵。如果需要，管理员可以禁用\
  \ IPS 的这些额外功能，使其基本作为 IDS 运行。\n\n您经常会看到这两个术语合并为入侵检测和防御系统 (IDPS)。例如，NIST SP 800-94《入侵检测和防御系统指南》全面涵盖了入侵检测和入侵防御系统，但为简洁起见，全文使用\
  \ IDPS 同时指代两者。在本章中，我们将描述 IDS 用于检测攻击的方法、它们如何响应攻击以及可用的 IDS 类型。然后我们将在适当的地方补充关于 IPS\
  \ 的信息。\n\n#### 基于知识和基于行为的检测\n\nIDS 通过监控网络流量和检查日志来主动监视可疑活动。例如，IDS 可以拥有监控网络中关键设备（如路由器和防火墙）的传感器或代理。这些设备拥有可记录活动的日志，传感器可将这些日志条目转发给\
  \ IDS 进行分析。某些传感器将所有数据发送给 IDS，而其他传感器则根据管理员如何配置传感器来检查条目并仅发送特定的日志条目。\n\nIDS 对数据进行评估，并可使用两种常见方法检测恶意行为：基于知识的检测和基于行为的检测。简而言之，基于知识的检测使用类似于反恶意软件所用签名定义的签名。基于行为的检测不使用签名，而是将活动与正常性能的基线进行比较，以检测异常行为。许多\
  \ IDS 结合使用这两种方法。\n\n\n\n\n### 基于知识库的检测\n\n最常见的检测方法是**知识库检测**（也称为*特征库检测*或*模式匹配检测*）。它使用由\
  \ IDS 厂商开发的已知攻击数据库。例如，一些自动化工具可用于发起 SYN 洪水攻击，这些工具具有在特征数据库中定义的已知模式和特征。实时流量与数据库进行匹配，如果\
  \ IDS 发现匹配项，则会发出警报。基于知识库的 IDS 的主要缺点是它仅对已知攻击方法有效。新攻击或已知攻击的轻微变体通常无法被 IDS 识别。\n\nIDS\
  \ 上的基于知识库的检测类似于反恶意软件应用程序使用的基于特征库的检测。反恶意软件应用程序拥有已知恶意软件的数据库，并根据数据库检查文件以查找匹配项。正如反恶意软件必须定期使用来自供应商的新特征库进行更新一样，IDS\
  \ 数据库也必须定期使用新的攻击特征库进行更新。大多数 IDS 厂商提供自动更新特征库的方法。\n\n### 基于行为的检测\n\n第二种检测类型是**行为检测**（也称为*统计入侵检测*、*异常检测*和*启发式检测*）。行为检测首先创建系统上正常活动和事件的基线。一旦积累了足够的基线数据来确定正常活动，它就可以检测可能表明恶意入侵或事件的异常活动。\n\
  \n此基线通常在有限的时间段（如一周）内创建。如果网络被修改，则需要更新基线。否则，IDS 可能会对其识别为异常的正常行为发出警报。某些产品会持续监控网络以了解更多关于正常活动的信息，并将根据观察结果更新基线。\n\
  \n基于行为的 IDS 使用基线、活动统计和启发式评估技术将当前活动与以前的活动进行比较，以检测潜在的恶意事件。许多产品可以执行有状态数据包分析，类似于有状态检查防火墙（第\
  \ 11 章介绍）根据网络流量的状态或上下文检查流量的方式。\n\n异常分析通过允许 IDS 识别并对流量或活动的突然增加、多次登录失败、正常工作时间之外的登录或程序活动，或错误或故障消息的突然增加做出反应，从而增加了\
  \ IDS 的功能。所有这些都可能表明基于知识库的检测系统可能无法识别的攻击。\n\n基于行为的 IDS 可以被标记为专家系统或伪人工智能系统，因为它可以学习并对事件做出假设。换句话说，IDS\
  \ 可以通过评估当前事件与已知事件来充当人类专家。向基于行为的 IDS 提供的关于正常活动和事件的信息越多，它检测异常的准确性就越高。基于行为的 IDS 的一个显著优势是它可以检测没有特征库且无法用基于特征库的方法检测到的较新攻击。\n\
  \n基于行为的 IDS 的主要缺点是它经常引发大量误报，也称为误警报或假阳性。用户和系统活动的模式在正常操作期间可能会有很大差异，这使得准确定义正常和异常活动的边界变得困难。\n\
  \n#### SIEM 系统\n\n许多 IDS 和 IPS 将收集的数据发送到安全信息和事件管理（SIEM）系统。SIEM 系统还收集网络中许多其他来源的数据。它提供流量的实时监控、分析和潜在攻击的通知。此外，它提供数据的长期存储，允许安全专业人员分析数据。\n\
  \nSIEM 通常包含多项功能。因为它从不同设备收集数据，所以包含一个关联和聚合功能，将这些数据转换为有用的信息。SIEM 内部的高级分析工具可以分析数据并根据预配置的规则引发警报和/或触发响应。这些警报和触发器通常独立于\
  \ IDS 和 IPS 发送的警报，但可能会发生一些重叠。\n\n#### IDS 响应\n\n虽然基于知识库和基于行为的 IDS 检测事件的方式不同，但它们都使用警报系统。当\
  \ IDS 检测到事件时，它会触发警报。然后它可以使用被动或主动方法进行响应。被动响应记录事件并发送通知。主动响应除了记录和发送通知外，还会更改环境以阻止活动。\n\
  \n##### 被动响应\n\n通知可以通过电子邮件、短信或寻呼消息、弹出消息发送给管理员。在某些情况下，警报可以生成一份报告，详细说明事件发生前的活动，如果需要，管理员可以查看日志以获取更多信息。许多\
  \ 24 小时网络运营中心（NOC）都有主支持中心所有人都能看到的中央监控屏幕。例如，一面墙上可以有多个大屏幕显示器，提供 NOC 不同要素的数据。IDS 警报可以显示在这些屏幕之一上，以确保人员了解事件。这些即时通知有助于管理员快速有效地响应不需要的行为。\n\
  \n##### 主动响应\n\n主动响应可以使用多种不同的方法修改环境。典型的响应包括修改 ACL 以根据端口、协议和源地址阻止流量，甚至禁用特定电缆段上的所有通信。例如，如果\
  \ IDS 检测到来自单个 IP 地址的 SYN 洪水攻击，IDS 可以更改 ACL 以阻止来自该 IP 地址的所有流量。同样，如果 IDS 检测到来自多个 IP\
  \ 地址的 ping 洪水攻击，它可以更改 ACL 以阻止所有 ICMP 流量。IDS 还可以阻止可疑或行为不当的用户访问资源。安全管理员预先配置这些主动响应，并可以根据环境中不断变化的需求对其进行调整。\n\
  \n#### 基于主机和基于网络的 IDS\n\nIDS 类型通常分为基于主机和基于网络两类。*基于主机的 IDS (HIDS)* 监控单台计算机或主机。*基于网络的\
  \ IDS (NIDS)* 通过观察网络流量模式来监控网络。\n\n一种不太常用的分类是基于应用程序的 IDS，它是一种特定类型的基于网络的 IDS。它监控两台或多台服务器之间的特定应用程序流量。例如，基于应用程序的\
  \ IDS 可以监控 Web 服务器和数据库服务器之间的流量，以查找可疑活动。\n\n##### 基于主机的 IDS\n\nHIDS 监控单台计算机上的活动，包括进程调用以及记录在系统、应用程序、安全和基于主机的防火墙日志中的信息。它通常比\
  \ NIDS 能更详细地检查事件，并能确定攻击中受损的特定文件。它还可以跟踪攻击者使用的进程。\n\nHIDS 相对于 NIDS 的一个优势是 HIDS 可以检测\
  \ NIDS 无法检测到的主机系统上的异常。例如，HIDS 可以检测到入侵者渗透系统并远程控制它的感染。您可能会注意到这听起来类似于反恶意软件在计算机上所做的事情。确实如此。许多\
  \ HIDS 包含反恶意软件功能。\n\n\n\n尽管许多供应商建议在所有系统上安装基于主机的 IDS，但由于 HIDS 的一些缺点，这种做法并不普遍。相反，许多组织选择仅在关键服务器上安装\
  \ HIDS，作为一种额外的保护层。HIDS 的一些缺点与成本和易用性有关。HIDS 的管理成本高于 NIDS，因为它们需要对每个系统进行单独的管理关注，而 NIDS\
  \ 通常支持集中管理。HIDS 无法检测针对其他系统的网络攻击。此外，它通常会消耗大量的系统资源，从而降低主机系统的性能。虽然通常可以限制 HIDS 使用的系统资源，但这可能导致其错过正在进行的攻击。此外，HIDS\
  \ 更容易被入侵者发现并禁用，且其日志保存在系统上，一旦攻击成功，日志就容易被篡改。\n\n### 基于网络的 IDS\n\nNIDS 监控并评估网络活动，以检测攻击或事件异常。单个\
  \ NIDS 可以通过使用远程传感器在关键网络位置收集数据，并将数据发送到中央管理控制台和/或 SIEM，从而监控大型网络。这些传感器可以监控路由器、防火墙、支持端口镜像的网络交换机以及其他类型的网络分流器上的流量。\n\
  \n中央控制台通常安装在一台专用计算机上，该计算机经过加固以抵御攻击。这减少了 NIDS 中的漏洞，并使其能够近乎隐形地运行，从而使攻击者更难发现并禁用它。NIDS\
  \ 对整体网络性能的负面影响微乎其微，当部署在专用系统上时，它不会对任何其他计算机的性能产生不利影响。在流量巨大的网络上，单个 NIDS 可能无法跟上数据流，但可以通过添加额外的系统来平衡负载。\n\
  \n通常，NIDS 可以通过执行反向地址解析协议 (RARP) 或反向域名系统 (DNS) 查找来发现攻击源。然而，由于攻击者经常欺骗 IP 地址或通过僵尸网络利用僵尸主机发起攻击，因此需要进一步调查以确定实际来源。这可能是一个繁琐的过程，且超出了\
  \ IDS 的范围。不过，通过一定的调查，有可能发现欺骗 IP 的来源。\n\nNIDS 通常能够检测攻击的发起或正在进行的攻击，但并不总能提供关于攻击是否成功的信息。它无法知晓攻击是否影响了特定系统、用户账户、文件或应用程序。例如，NIDS\
  \ 可能会发现缓冲区溢出漏洞利用代码通过网络发送，但不一定知道该漏洞利用是否成功渗透了系统。然而，管理员收到警报后可以检查相关系统。此外，调查人员可以将 NIDS\
  \ 日志作为审计追踪的一部分，以了解发生了什么。\n\n#### 入侵防御系统\n\n入侵防御系统 (IPS) 是一种特殊类型的主动 IDS，它试图在攻击到达目标系统之前检测并阻止攻击。它有时被称为入侵检测与防御系统\
  \ (IDPS)。IDS 和 IPS 之间的一个显著区别在于 IPS 部署在流量的直通路径上，如图 17.4 所示。换句话说，所有流量都必须经过 IPS，IPS\
  \ 在分析后可以选择转发哪些流量、阻止哪些流量。这使得 IPS 能够防止攻击到达目标。\n\n![图 17.4 入侵防御系统](img/c17f004.jpg)\n\
  \n**图 17.4** 入侵防御系统\n\n相比之下，未部署在直通路径上的主动 IDS 只能在活动到达目标后进行检查。主动 IDS 可以在攻击开始后采取措施进行阻止，但无法预防攻击。\n\
  \nIPS 可以使用基于知识的检测和/或基于行为的检测，就像其他任何 IDS 一样。此外，它还可以记录活动并向管理员提供通知，就像 IDS 所做的那样。\n\n\
  ### 具体预防措施\n\n尽管入侵检测和防御系统在保护网络方面发挥了巨大作用，但管理员通常还会实施额外的安全控制来保护其网络。以下几节将介绍其中几种作为额外的预防措施。\n\
  \n#### 蜜罐/蜜网\n\n*蜜罐* 是作为诱捕入侵者陷阱而创建的单个计算机。*蜜网* 是两个或多个联网的蜜罐，它们协同工作以模拟一个网络。它们看起来并表现得像合法系统，但不存放对攻击者有任何真实价值的数据。管理员通常会配置带有漏洞的蜜罐，以引诱入侵者攻击它们。它们可能未打补丁，或者管理员故意留下安全漏洞。目的是吸引入侵者的注意力，使其远离托管宝贵资源的合法网络。合法用户不会访问蜜罐，因此对蜜罐的任何访问极有可能是未经授权的入侵者。\n\
  \n除了将攻击者隔离在生产环境之外，蜜罐还为管理员提供了一个在不危及实时环境的情况下观察攻击者活动的机会。在某些情况下，蜜罐的设计目的是拖延入侵者足够长的时间，以便自动化\
  \ IDS 检测到入侵并尽可能多地收集关于入侵者的信息。攻击者在蜜罐上花费的时间越长，管理员调查攻击并潜在识别入侵者的时间就越多。一些安全专业人员（如从事安全研究的人员）认为蜜罐是针对零日漏洞利用的有效对策，因为它们可以观察攻击者的行为。\n\
  \n管理员通常在虚拟系统上托管蜜罐和蜜网。攻击发生后，这些系统更容易重建。例如，管理员可以配置蜜罐，然后对蜜罐虚拟机进行快照。如果攻击者修改了环境，管理员可以将机器恢复到快照时的状态。使用虚拟机\
  \ (VM) 时，管理员应密切监控蜜罐或蜜网。攻击者通常能检测出自己身处 VM 中，并可能尝试 VM 逃逸攻击以突破 VM。\n\n蜜罐的使用引发了诱惑与诱捕的问题。如果入侵者是在蜜罐所有者没有任何外部努力的情况下自行发现蜜罐，组织可以合法地将蜜罐作为诱惑装置使用。将一个带有开放安全漏洞和已知漏洞利用的活动服务的系统放置在互联网上属于诱惑。被诱惑的攻击者会自行决定实施非法或未经授权的行为。诱捕是非法的，当蜜罐所有者主动招揽访问者访问该站点，然后指控其未经授权的入侵时，就会发生诱捕。换句话说，当你欺骗或鼓励某人实施非法或未经授权的行为时，这就是诱捕。不同国家的法律各异，因此了解当地关于诱惑和诱捕的相关法律非常重要。\n\
  \n##### 理解伪缺陷\n\n\n\n### 伪缺陷\n\n**伪缺陷** 是有意植入系统中的虚假漏洞或明显的漏洞，旨在引诱攻击者。它们常用于蜜罐系统，以模拟众所周知的操作系统漏洞。试图利用已知缺陷的攻击者可能会偶然发现伪缺陷，并误以为已成功渗透系统。更复杂的伪缺陷机制实际上会模拟渗透过程，使攻击者信服他们已获得系统的额外访问权限。然而，当攻击者正在探索系统时，监控和警报机制会触发并向管理员发出威胁警报。\n\
  \n#### 理解填充单元\n\n**填充单元** 系统类似于蜜罐，但它采用不同的方法执行入侵隔离。当 IDPS 检测到入侵者时，该入侵者会被自动传送到填充单元。填充单元具有实际网络的外观和感觉，但攻击者无法从填充单元内执行任何恶意活动或访问任何机密数据。\n\
  \n填充单元是一个模拟环境，提供虚假数据以保持入侵者的兴趣，这点与蜜罐相似。然而，IDPS 在未通知入侵者变更已发生的情况下，将入侵者传送到填充单元。相比之下，攻击者会直接选择攻击蜜罐，而不会被\
  \ IDPS 传送到蜜罐。管理员会密切监控填充单元，并利用它们来检测和观察攻击。安全专业人员可利用它们来检测攻击手法，并收集证据以便可能对攻击者提起诉讼。填充单元如今不常用，但考试中可能仍会涉及。\n\
  \n#### 警告横幅\n\n警告横幅告知用户和入侵者基本的安全策略准则。它们通常提及在线活动会被审计和监控，并经常提供关于受限活动的提醒。在大多数情况下，从法律角度来看，横幅中的措辞很重要，因为这些横幅可以在法律上约束用户遵守允许的行为、举止和流程。\n\
  \n以某种方式设法登录系统的未授权人员也会看到警告横幅。在这种情况下，你可以将警告横幅视为“禁止入内”标志的电子等效物。当警告明确声明禁止未授权访问，且任何活动都将被监控和记录时，大多数入侵和攻击都可以被起诉。\n\
  \n#### 反恶意软件\n\n防范恶意代码最重要的保护措施是使用具有最新签名文件和启发式功能的反恶意软件。攻击者定期发布新的恶意软件，并经常修改现有恶意软件以防止被反恶意软件检测到。反恶意软件供应商会寻找这些变化，并开发新的签名文件来检测新的和修改过的恶意软件。多年前，反恶意软件供应商建议每周更新一次签名文件。然而，如今大多数反恶意软件都包含每天多次自动检查更新的功能，无需用户干预。\n\
  \n许多组织采用多管齐下的方法来阻止恶意软件并检测任何进入系统的恶意软件。具有内容过滤功能的防火墙（或专用内容过滤设备）通常部署在互联网与内部网络的边界，以过滤掉任何类型的恶意代码。专用反恶意软件安装在邮件服务器上，以检测和过滤通过电子邮件传递的任何类型的恶意软件。此外，反恶意软件安装在每个系统上，以检测和阻止恶意软件。组织通常使用中央服务器部署反恶意软件、下载更新的定义，并将这些定义推送到客户端。\n\
  \n在每个系统上安装反恶意软件并过滤互联网内容的多管齐下方法，有助于保护系统免受来自任何来源的感染。例如，在每个系统上使用最新的反恶意软件将检测并阻止员工 USB\
  \ 闪存驱动器上的病毒。\n\n反恶意软件供应商通常建议在任何系统上仅安装一个反恶意软件应用程序。当系统上安装了多个反恶意软件应用程序时，这些应用程序可能会相互干扰，有时会导致系统问题。此外，拥有多个扫描程序会消耗过多的系统资源。\n\
  \n遵循最小权限原则也有帮助。用户将没有系统的管理权限，也无法安装可能是恶意的应用程序。如果病毒确实感染了系统，它通常会冒充登录用户。当该用户拥有有限权限时，病毒的能力也会受到限制。此外，随着额外应用程序的增加，与恶意软件相关的漏洞也会增加。每个额外的应用程序都为恶意代码提供了另一个潜在的攻击点。\n\
  \n教育用户了解恶意代码的危险、攻击者如何诱骗用户安装恶意代码，以及他们可以采取什么措施来降低风险，是另一种保护方法。很多时候，用户只需不点击链接或不打开通过电子邮件发送的附件，就能避免感染。\n\
  \n第 14 章涵盖了社会工程学战术，包括网络钓鱼、鱼叉式网络钓鱼和鲸钓。当用户了解这些类型的攻击时，他们不太可能上当受骗。尽管许多用户接受过关于这些风险的教育，但网络钓鱼邮件仍然充斥互联网并进入用户的收件箱。攻击者之所以继续发送它们，唯一的原因是它们仍然能欺骗一些用户。\n\
  \n##### 白名单与黑名单\n\n应用程序白名单和黑名单可以是一种有效的预防措施，防止用户运行未授权的应用程序。它们也有助于防止恶意软件感染。白名单标识获授权在系统上运行的应用程序列表，而黑名单标识未获授权在系统上运行的应用程序列表。\n\
  \n白名单不包含恶意软件应用程序，因此会阻止它们运行。某些白名单使用哈希算法创建哈希值来标识应用程序。然而，如果应用程序感染了病毒，病毒会有效地改变哈希值，因此这种类型的白名单也会阻止受感染的应用程序运行。（第\
  \ 6 章“密码学和对称密钥算法”更深入地介绍了哈希算法。）\n\n运行在 iPhone 和 iPad 上的 Apple iOS 是白名单极端版本的一个示例。用户只能安装\
  \ Apple App Store 上提供的应用。Apple 人员会审核并批准 App Store 上的所有应用，并迅速移除行为不当的应用。虽然用户可以绕过安全措施并越狱其\
  \ iOS 设备，但大多数用户不会这样做，部分原因是这会导致保修失效。\n\n如果管理员知道要阻止哪些应用程序，黑名单是一个不错的选择。例如，如果管理层希望确保用户不在系统上运行游戏，管理员可以启用工具来阻止这些游戏。\n\
  \n#### 防火墙\n\n防火墙通过过滤流量为网络提供保护。正如第 11 章所讨论的，防火墙多年来经历了许多变化。\n\n基本防火墙根据 IP 地址、端口和一些协议（使用协议编号）过滤流量。防火墙在\
  \ ACL 中包含允许特定流量的规则，并以一条隐式拒绝规则结束。隐式拒绝规则会阻止前一条规则未允许的所有流量。例如，防火墙可以通过分别允许使用 TCP 端口 80\
  \ 和 443 的流量来允许 HTTP 和 HTTPS 流量。（第 11 章更深入地介绍了逻辑端口。）\n\n\n\n\n### ICMP 与防火墙基础\n\n\
  ICMP 使用协议编号 1，因此防火墙可以通过允许协议编号为 1 的流量来允许 ping 流量。同样，防火墙可以通过分别允许协议编号 50 和 51，来允许 IPsec\
  \ 封装安全载荷（ESP）流量和 IPsec 认证头（AH）流量。\n\n### 防火墙代际演进\n\n第二代防火墙增加了额外的过滤功能。例如，应用层网关防火墙基于特定应用程序要求过滤流量，而`电路级网关防火墙`基于通信电路过滤流量。第三代防火墙（也称为`状态检测防火墙`和动态包过滤防火墙）基于流量在流中的状态进行过滤。\n\
  \n`下一代防火墙`充当`统一威胁管理（UTM）`设备，并结合了多种过滤功能。它包含防火墙的传统功能，如包过滤和状态检测。然而，它能够执行包检测技术，从而识别并阻止恶意流量。它可以使用定义文件和/或白名单和黑名单过滤恶意软件。它还包含入侵检测和/或入侵防御功能。\n\
  \n### Sandboxing\n\nSandboxing 为应用程序提供安全边界，防止应用程序与其他应用程序交互。反恶意软件应用程序使用 sandboxing\
  \ 技术测试未知应用程序。如果应用程序显示可疑特征，sandboxing 技术会防止该应用程序感染其他应用程序或操作系统。\n\n应用程序开发人员通常使用虚拟化技术测试应用程序。他们创建一个虚拟机，然后将其与主机和网络隔离。然后他们能够在此沙箱环境中测试应用程序，而不影响虚拟机外部的任何内容。同样，许多反恶意软件供应商使用虚拟化作为\
  \ sandboxing 技术来观察恶意软件的行为。\n\n### 第三方安全服务\n\n一些组织将安全服务外包给第三方，即组织外部的个人或组织。这可以包括许多不同类型的服务，如审计和渗透测试。\n\
  \n在某些情况下，组织必须向外部实体提供保证，证明第三方服务提供商符合特定的安全要求。例如，处理主要信用卡交易的组织必须遵守支付卡行业数据安全标准（PCI DSS）。这些组织通常会外包部分服务，PCI\
  \ DSS 要求组织确保服务提供商也遵守 PCI DSS 要求。换句话说，PCI DSS 不允许组织外包其责任。\n\n一些软件即服务（SaaS）供应商通过云提供安全服务。例如，Barracuda\
  \ Networks 包含类似于下一代防火墙和 UTM 设备的基于云的解决方案。例如，他们的 Web Security Service 充当 Web 浏览器的代理。管理员配置代理设置以访问基于云的系统，并根据组织需求执行\
  \ Web 过滤。同样，他们拥有基于云的 Email Security Gateway，可执行入站垃圾邮件和恶意软件过滤。它还可以检查出站流量，以确保其符合组织的数据丢失防护策略。\n\
  \n### 渗透测试\n\n`渗透测试`是组织用来应对攻击的另一种预防措施。渗透测试（通常简称为`pentest`）模拟实际攻击，试图识别攻击者可用于绕过应用程序、系统、网络或组织安全性的技术。它可能包括漏洞扫描、端口扫描、数据包嗅探、DoS\
  \ 攻击和社会工程学技术。\n\n安全专业人员在执行渗透测试时会尽量避免停机。然而，渗透测试具有侵入性，可能会影响系统的可用性。因此，安全专业人员在执行任何测试之前，获得高级管理层的书面批准极为重要。\n\
  \n定期进行的渗透测试是评估组织内部安全控制有效性的好方法。渗透测试可能会揭示补丁或安全设置不足的领域、新漏洞出现或暴露的领域，以及安全策略无效或未被遵循的领域。攻击者可以利用这些漏洞中的任何一个。\n\
  \n渗透测试通常包括漏洞扫描或漏洞评估以检测弱点。然而，渗透测试更进一步，尝试利用这些弱点。例如，漏洞扫描器可能会发现一个带有后端数据库的网站未使用输入验证技术，容易受到\
  \ SQL 注入攻击。渗透测试随后可能会使用 SQL 注入攻击来访问整个数据库。同样，漏洞评估可能会发现员工未接受过社会工程学攻击教育，渗透测试可能会使用社会工程学方法进入安全区域或从员工处获取敏感信息。\n\
  \n以下是渗透测试的一些目标：\n\n*   确定系统承受攻击的能力\n*   识别员工实时检测和响应攻击的能力\n*   识别可实施的额外控制措施以降低风险\n\
  \n#### 渗透测试的风险\n\n渗透测试的一个重大危险是某些方法可能导致停机。例如，如果漏洞扫描发现基于互联网的服务器易受缓冲区溢出攻击，渗透测试利用该漏洞可能导致服务器关闭或重启。\n\
  \n理想情况下，渗透测试应在造成实际损害前停止。不幸的是，测试人员通常直到采取该步骤才知道哪一步会造成损害。例如，模糊测试器向应用程序或系统发送无效或随机数据以检查响应。模糊测试器可能会发送导致缓冲区溢出并锁定应用程序的数据流，但测试人员直到运行模糊测试器才会知道会发生这种情况。经验丰富的渗透测试人员可以最大限度地降低测试造成损害的风险，但无法消除风险。\n\
  \n只要可能，测试人员会在测试系统上而非实时生产系统上执行渗透测试。例如，在测试应用程序时，测试人员可以在沙箱等隔离环境中运行和测试应用程序。如果测试造成损害，仅影响测试系统，而不影响实时网络。挑战在于测试系统通常无法提供生产环境的真实视图。测试人员可能能够在测试环境中测试不与其他系统交互的简单应用程序。然而，大多数需要测试的应用程序并不简单。当使用测试系统时，渗透测试人员通常会限定其分析，并声明测试是在测试系统上完成的，因此结果可能无法提供对生产环境的有效分析。\n\
  \n#### 获取渗透测试许可\n\n渗透测试应仅在仔细考虑并获得高级管理层批准后执行。许多安全专业人员坚持以书面形式获得此批准，并明确列出风险。执行未经批准的安全测试可能导致生产力损失并触发应急响应团队。\n\
  \n\n\n\n\n### 恶意员工与渗透测试\n\n意图破坏 IT 环境安全的恶意员工可依据现有法律受到惩罚。同样，如果内部员工在未经授权的情况下对系统进行非正式的未授权测试，组织可能会将其行为视为非法攻击，而非渗透测试。这些员工极有可能失去工作，甚至面临法律后果。\n\
  \n#### 渗透测试技术\n\n组织聘请外部顾问执行渗透测试是常见做法。组织可以控制提供给这些测试人员的信息，而提供给他们的知识水平决定了他们执行的测试类型。\n\
  \n##### 零知识团队的黑盒测试\n\n`zero-knowledge team`（零知识团队）除了公开可用的信息（如域名和公司地址）外，对目标站点一无所知。这就像他们透过黑盒观察目标，在开始探测之前完全不知道盒子里有什么。零知识团队的攻击非常类似于真实的外部攻击，因为关于环境的所有信息都必须从头获取。\n\
  \n##### 全知识团队的白盒测试\n\n`full-knowledge team`（全知识团队）拥有对目标环境所有方面的完全访问权限。他们知道安装了哪些补丁和升级，以及所有相关设备的确切配置。如果目标是应用程序，他们将拥有源代码访问权限。全知识团队执行白盒测试（有时称为水晶盒测试或透明盒测试）。白盒测试普遍被认为在定位漏洞方面更高效、更具成本效益，因为所需的发现时间更少。\n\
  \n##### 部分知识团队的灰盒测试\n\n拥有目标部分知识的 `partial-knowledge team`（部分知识团队）执行灰盒测试，但他们并未获得所有信息的访问权限。他们可能会被提供网络设计和配置详情等信息，以便他们将重点放在针对特定目标的攻击和漏洞上。\n\
  \n常规负责保护渗透测试目标的安全管理人员可被视为全知识团队。然而，他们并不是执行渗透测试的最佳人选。他们在对某些安全主题的理解、评估或能力方面往往存在盲点或差距。如果他们知道某个可被利用的漏洞，他们很可能早已建议采取控制措施将其降至最低。全知识团队知道什么已被保护，因此可能会因依赖错误假设而无法妥善测试所有可能性。零知识或部分知识测试人员不太可能犯这些错误。\n\
  \n渗透测试可能采用自动化攻击工具或套件，也可能使用常见网络实用工具手动执行。自动化攻击工具范围广泛，从专业漏洞扫描器和渗透测试工具，到攻击者在互联网上共享的地下工具。有多种开源和商业工具（如\
  \ `Metasploit`）可用，安全专业人员和攻击者都在使用这些工具。\n\n社会工程学技术常用于渗透测试中。根据测试目标，测试人员可能会使用技术突破组织的物理边界，或诱导用户泄露信息。这些测试有助于确定员工对熟练社会工程师的脆弱程度，以及他们对旨在挫败此类攻击的安全策略的熟悉程度。\n\
  \n### 保护报告\n\n渗透测试人员将提供一份记录其结果的报告，该报告应作为敏感信息受到保护。报告将概述具体漏洞以及如何利用这些漏洞。报告通常还会包含关于如何缓解漏洞的建议。如果这些结果在组织实施建议之前落入攻击者手中，攻击者可利用报告中的细节发动攻击。\n\
  \n同样重要的是要认识到，渗透测试团队提出建议并不意味着组织就会实施该建议。管理层可以选择实施建议以缓解风险，或者如果认为建议控制措施的成本无法得到合理解释，则选择接受风险。换句话说，一年前的报告可能列出了一个至今未缓解的特定漏洞。这份一年前的报告应像昨天刚完成的报告一样受到严密保护。\n\
  \n### 道德黑客\n\n`Ethical hacking`（道德黑客）常被用作渗透测试的另一个名称。`ethical hacker`（道德黑客）是指了解网络安全和突破安全的方法，但不将此知识用于个人谋利的人。相反，道德黑客利用这些知识帮助组织了解其漏洞并采取行动防范恶意攻击。道德黑客始终在法律范围内行事。\n\
  \n第 14 章提到了破解者、黑客和攻击者之间的技术区别。黑客的原始定义是无恶意的技术爱好者，而破解者或攻击者则是恶意的。由于“hacker”一词常被用作“attacker”的同义词，其原始含义已变得模糊。换句话说，大多数人将黑客视为攻击者，给人的印象是道德黑客是一个自相矛盾的术语。然而，“ethical\
  \ hacking”一词中的“hacker”使用的是其原始含义。\n\n道德黑客将学习并经常使用攻击者使用的相同工具和技术。然而，他们不使用这些工具攻击系统。相反，他们仅在组织明确授予许可后，使用这些工具测试系统的漏洞。\n\
  \n### 日志记录、监控与审计\n\n日志记录、监控和审计程序有助于组织预防事件，并在事件发生时提供有效响应。以下部分涵盖日志记录和监控，以及用于评估访问控制有效性的各种审计方法。\n\
  \n### 日志记录与监控\n\n日志记录将事件记录到各种日志中，监控则审查这些事件。二者结合使组织能够跟踪、记录和审查活动，提供整体问责制。\n\n这有助于组织检测可能对系统的机密性、完整性或可用性产生负面影响的不良事件。它在事件发生后重建活动以确定发生了什么，有时还能起诉责任人方面也很有用。\n\
  \n##### 日志记录技术\n\n`Logging`（日志记录）是将有关事件的信息记录到日志文件或数据库的过程。日志记录捕获事件、更改、消息和其他描述系统上发生的活动的数据。日志通常会记录诸如发生了什么、何时发生、在哪里发生、谁做的，有时还包括如何发生的等详细信息。当你需要查找近期发生的事件信息时，日志是一个很好的起点。\n\
  \n例如，图 17.5 显示了 Microsoft 系统上的事件查看器，其中选中并展开了一条日志条目。该日志条目显示名为 Darril Gibson 的用户访问了位于名为\
  \ `C:\\\\Payroll` 的文件夹中名为 `PayrollData (Confidential).xlsx` 的文件。它显示用户于 11 月 10 日下午\
  \ 4:05 访问了该文件。\n\n![图 17.5 查看日志条目](img/c17f005.jpg)\n\n**图 17.5** 查看日志条目\n\n\n\n\
  \n只要识别和身份验证过程是安全的，这就足以让 Darril 对访问该文件负责。另一方面，如果组织不使用安全的身份验证过程，且很容易让某人冒充另一位用户，Darril\
  \ 可能会被错误指控。这加强了这样一个要求：安全的识别和身份验证实践是问责制的先决条件。\n\n###### 常见日志类型\n\n有许多不同类型的日志。以下是\
  \ IT 环境中可用的常见日志简要列表。\n\n**安全日志** 安全日志记录对资源（如文件、文件夹、打印机等）的访问。例如，它们可以记录用户何时访问、修改或删除了文件，如前文\
  \ 图 17.5 所示。许多系统会自动记录对关键系统文件的访问，但要求管理员在其他资源上启用审核后才记录访问。例如，管理员可能会为专有数据配置日志记录，但不对网站上发布的公共数据进行记录。\n\
  \n**系统日志** 系统日志记录系统事件，例如系统何时启动或关闭，或服务何时启动或停止。如果攻击者能够关闭系统并使用 CD 或 USB 闪存驱动器重新启动，他们可以在没有任何数据访问记录的情况下窃取系统数据。同样，如果攻击者能够停止监控系统的服务，他们可能会在日志未记录其行为的情况下访问系统。记录系统重启或服务停止时间的日志可以帮助管理员发现潜在的恶意活动。\n\
  \n**应用程序日志** 这些日志记录特定应用程序的信息。应用程序开发人员选择在应用程序日志中记录什么内容。例如，数据库开发人员可以选择记录任何人何时访问特定的数据对象，如表或视图。\n\
  \n**防火墙日志** 防火墙日志可以记录与到达防火墙的任何流量相关的事件。这包括防火墙允许的流量和防火墙阻止的流量。这些日志通常记录关键数据包信息，如源和目标\
  \ IP 地址、源和目标端口，但不记录数据包的实际内容。\n\n**代理日志** 代理服务器可以提高用户的互联网访问性能，并能控制用户可以访问的网站。代理日志包括记录详细信息的能力，例如特定用户访问了哪些网站以及在这些网站上花费了多少时间。它们还可以记录用户何时尝试访问已知的禁止网站。\n\
  \n**变更日志** 变更日志记录变更请求、批准以及作为整体变更管理过程一部分的系统实际变更。变更日志可以手动创建，也可以通过内部网页在人员记录与变更相关的活动时创建。变更日志可用于跟踪已批准的变更。它们作为灾难恢复计划的一部分也很有帮助。例如，灾难发生后，管理员和技术人员可以使用变更日志将系统恢复到最后已知状态，包括所有已应用的变更。\n\
  \n日志记录通常是操作系统以及大多数应用程序和服务的原生功能。这使得管理员和技术人员配置系统以记录特定类型的事件变得相对容易。应在任何日志记录计划中包含来自管理员和\
  \ root 用户账户等特权账户的事件。这有助于防止恶意内部人员的攻击，并在必要时为起诉记录活动。\n\n###### 保护日志数据\n\n组织内部人员可以使用日志重现事件发生前和发生期间的情况，但前提是日志未被修改。如果攻击者可以修改日志，他们可以抹除自己的活动，从而有效地使数据失去价值。这些文件可能不再包含准确信息，并且可能无法作为起诉攻击者的可采纳证据。考虑到这一点，防止未经授权的访问和未经授权的修改来保护日志文件非常重要。\n\
  \n通常会在中央系统（如 `SIEM`）上存储日志副本以保护它们。即使攻击修改或损坏了原始文件，人员仍可使用副本查看事件。保护日志文件的一种方法是分配权限以限制其访问。\n\
  \n组织通常有严格的政策，强制要求备份日志文件。此外，这些政策还定义了保留时间。例如，组织可能会保留归档日志文件一年、三年或任何其他时长。某些政府法规要求组织无限期保留归档日志。安全控制措施（如将日志设置为只读、分配权限和实施物理安全控制）可保护归档日志免受未经授权的访问和修改。在日志不再需要时销毁它们很重要。\n\
  \n美国国家标准与技术研究院（`NIST`）发布了大量关于 IT 安全的信息，包括*联邦信息处理标准（`FIPS`）出版物*。*联邦信息和信息系统的最低安全要求（`FIPS\
  \ 200`）* 将以下内容指定为审计数据的最低安全要求：\n\n> 创建、保护和保留信息系统审计记录，程度应足以支持对非法、未经授权或不当的信息系统活动进行监控、分析、调查和报告。\n\
  \n> 确保能将各个信息系统用户的行为唯一地追溯到这些用户，以便让他们对自己的行为负责。\n\n##### 监控的作用\n\n监控为组织提供多种益处，包括增加问责性、协助调查和基本故障排除。以下部分将更深入地描述这些益处。\n\
  \n###### 审计跟踪\n\n*审计跟踪* 是当有关事件和发生情况的信息存储在一个或多个数据库或日志文件中时创建的记录。它们提供系统活动的记录，并可重现安全事件发生前和发生期间的活动。安全专业人员从审计跟踪中提取有关事件的信息，以证明或反驳过错等。审计跟踪允许安全专业人员按正序或逆序检查和追踪事件。这种灵活性在追踪问题、性能问题、攻击、入侵、安全漏洞、编码错误和其他潜在策略违规时很有帮助。\n\
  \n使用审计跟踪是一种被动的侦察型安全控制。它们的威慑作用方式与闭路电视（`CCTV`）或保安相同。如果人员知道他们正被监视且其活动正被记录，他们就不太可能从事非法、未经授权或恶意活动——至少在理论上是这样。有些罪犯过于粗心或无知，导致这并不总是一致适用。然而，越来越多的高级攻击者会花时间定位并删除可能记录其活动的日志。这已成为许多高级持续性威胁的标准做法。\n\
  \n审计跟踪作为起诉罪犯的证据也至关重要。它们提供资源、系统和资产状态的前后对比图景。这反过来有助于确定某项更改或变更是用户、操作系统（`OS`）或软件的行为导致的，还是由其他来源（如硬件故障）导致的。由于审计跟踪中的数据非常有价值，因此确保日志受到保护以防止修改或删除非常重要。\n\
  \n###### 监控与问责制\n\n\n\n### 监控\n\n监控是一项必要的功能，旨在确保主体（如用户和员工）对其行为和活动负责。用户声明身份（如使用用户名）并证明其身份（通过认证），审计追踪记录他们在登录期间的活动。监控和审查审计追踪日志可为这些用户提供问责制。\n\
  \n这直接促进了积极的用户行为和对组织安全策略的遵守。知晓日志正在记录其 IT 活动的用户，不太可能试图绕过安全控制或执行未经授权或受限的活动。\n\n一旦发生安全策略违规或违规事件，应确定违规的来源。如果能够识别出责任人，应根据组织的安全策略追究其责任。严重案例可能导致解雇或法律起诉。\n\
  \n立法通常要求特定的监控和问责实践。这包括《2002 年萨班斯-奥克斯利法案》、《健康保险流通与责任法案》（HIPAA）以及许多组织必须遵守的欧盟（EU）隐私法。\n\
  \n#### 监控与调查\n\n审计追踪赋予调查人员在事件发生很久之后重构事件的能力。它们可以记录访问滥用、特权违规、入侵尝试以及多种不同类型的攻击。在检测到安全违规后，安全专业人员可以通过仔细检查审计追踪，重构事件发生前、发生期间和发生后的条件及系统状态。\n\
  \n一个重要的考量因素是确保日志具有准确的时间戳，并且这些时间戳在整个环境中保持一致。一种常用方法是设置一个内部网络时间协议（NTP）服务器，并将其与受信任的时间源（如公共\
  \ NTP 服务器）同步。然后，其他系统可以与此内部 NTP 服务器同步。\n\nNIST 运营多台支持认证的时间服务器。一旦 NTP 服务器正确配置，NIST\
  \ 服务器将响应加密且经过认证的时间消息。该认证提供了响应来自 NIST 服务器的保证。\n\n#### 监控与问题识别\n\n审计追踪提供了关于已记录事件的详细信息，这对管理员很有用。除了恶意攻击外，它们还可以记录系统故障、操作系统漏洞和软件错误。某些日志文件甚至可以在应用程序或系统崩溃时捕获内存内容。这些信息有助于确定事件原因，并排除其作为可能攻击的嫌疑。例如，如果系统因内存故障频繁崩溃，转储文件有助于诊断问题。\n\
  \n将日志文件用于此目的通常称为问题识别。一旦识别出问题，执行问题解决所涉及的工作仅仅是跟进所披露的信息。\n\n#### 监控技术\n\n**监控**是审查信息日志以查找特定内容的过程。人员可以手动审查日志，或使用工具实现自动化。监控对于检测主体的恶意行为、入侵尝试和系统故障至关重要。它有助于重构事件、为起诉提供证据并创建分析报告。\n\
  \n重要的是要理解监控是一个持续的过程。持续监控确保记录所有事件，以便日后必要时进行调查。许多组织在发生事件或疑似事件后会增加日志记录，以收集关于攻击者的更多情报。\n\
  \n**日志分析**是一种详细且系统的监控形式，其中对记录的信息进行分析以发现趋势和模式，以及异常、未经授权、非法和违反策略的活动。日志分析不一定是对事件的响应，而是一项定期任务，可检测潜在问题。\n\
  \n在手动分析日志时，管理员只需打开日志文件并查找相关数据。这可能非常繁琐且耗时。例如，即使使用内置搜索工具，在 10 个不同的归档日志中搜索特定事件或 ID\
  \ 代码也需要一些时间。\n\n在许多情况下，日志会产生大量信息，导致重要细节淹没在海量数据中，因此管理员通常使用自动化工具分析日志数据。例如，入侵检测系统（IDS）主动监控多个日志，以实时检测恶意入侵并做出响应。IDS\
  \ 可帮助检测和追踪来自外部攻击者的攻击，向管理员发送警报，并记录攻击者对资源的访问。\n\n多家供应商销售运维管理软件，该软件主动监控网络中各系统的安全性、健康状况和性能。该软件自动查找表明存在问题（如攻击或未经授权的访问）的可疑或异常活动。\n\
  \n##### 安全信息与事件管理\n\n许多组织使用集中式应用程序来自动监控网络上的系统。有多个术语用于描述这些工具，包括安全信息与事件管理（SIEM）、安全事件管理（SEM）和安全信息管理（SIM）。这些工具提供对组织内各系统发生事件的实时分析。它们包括安装在远程系统上的代理，用于监控称为警报触发器的特定事件。触发器发生时代理将事件报告回中央监控软件。\n\
  \n例如，SIEM 可以监控一组邮件服务器。每当某台邮件服务器记录一个事件，SIEM 代理就会检查该事件以确定其是否为关注项。如果是，SIEM 代理会将事件转发给中央\
  \ SIEM 服务器，并根据事件类型，可为管理员触发警报。例如，如果邮件服务器的发送队列开始积压，SIEM 应用程序可在问题变得严重之前检测到该问题并提醒管理员。\n\
  \n大多数 SIEM 可配置，允许组织内部人员指定哪些项目是关注项并需要转发给 SIEM 服务器。SIEM 几乎为任何类型的服务器或网络设备提供代理，在某些情况下，它们还监控网络流量以进行流量和趋势分析。这些工具还可以收集目标系统的所有日志，并使用数据挖掘技术检索相关数据。安全专业人员随后可以创建报告并分析数据。\n\
  \nSIEM 通常包含复杂的关联引擎。这些引擎是收集数据并对其进行聚合以查找共同属性的软件组件。然后，它们使用高级分析工具检测异常并向安全管理员发送警报。\n\n\
  某些监控工具也用于资产清单和状态监控。例如，工具可以查询所有可用系统并记录详细信息，如系统名称、IP 地址、操作系统、已安装的补丁、更新和已安装的软件。然后，这些工具可根据组织需求创建任意系统的报告。例如，它们可以识别有多少系统处于活动状态、识别缺少补丁的系统，并标记安装了未经授权软件的系统。\n\
  \n软件监控会留意未经批准软件的尝试或成功安装、未经授权软件的使用，或对已批准软件的未经授权使用。这降低了用户无意中安装病毒或特洛伊木马的风险。\n\n###\
  \ 采样\n\n\n\n\n### 采样\n\n*采样*，或称*数据提取*，是指从大量数据集合中提取特定元素，以构建整体的有意义表征或摘要的过程。换句话说，采样是一种数据缩减形式，它允许某人通过仅查看审计追踪中的一小部分数据样本，就能获取有价值的信息。\n\
  \n统计采样使用精确的数学函数，从海量数据中提取有意义的信息。这类似于民意测验员用来在不采访所有人口的情况下了解大众意见的科学方法。采样数据永远存在无法准确代表整体数据的风险，而统计采样可以识别误差范围。\n\
  \n#### 截断水平\n\n截断是一种非统计采样形式。它仅选择超过*截断水平*的事件，截断水平是事件的预定义阈值。系统会忽略事件，直到它们达到此阈值。\n\n\
  例如，失败的登录尝试在任何系统中都很常见，因为用户很容易输错一两次密码。与其为每一次失败的登录尝试都发出警报，不如设置一个截断水平，仅当在 30 分钟内检测到五次失败的登录尝试时才发出警报。许多账户锁定控制使用类似的截断水平。它们不会在一次登录失败后就锁定账户。相反，它们会统计失败登录的次数，仅当达到预定义阈值时才锁定账户。\n\
  \n截断水平广泛用于审计事件的过程中，以建立常规系统或用户活动的基线。仅当超过基线时，监控系统才会发出警报以示异常事件。换句话说，截断水平使系统忽略常规事件，仅在检测到严重入侵模式时才发出警报。\n\
  \n一般来说，非统计采样是自由裁量采样，即由审计员自行决定进行的采样。它无法提供整体数据的准确表征，并会忽略未达到截断水平阈值的事件。然而，当用于聚焦特定事件时，它是有效的。此外，非统计采样比统计采样成本更低、更易于实施。\n\
  \n#### 其他监控工具\n\n尽管日志是审计中使用的主要工具，但组织内还有一些值得一提的额外工具。例如，闭路电视（CCTV）可以自动将事件录制到磁带上以供后续审查。安全人员还可以实时监控实时\
  \ CCTV 系统，以发现不需要的、未经授权的或非法的活动。该系统可以独立工作，也可以与安保人员配合使用，而安保人员本身也可以受到 CCTV 监控，并对任何非法或不道德的活动负责。其他工具包括击键监控、流量分析监控、趋势分析监控以及防止数据丢失的监控。\n\
  \n##### 击键监控\n\n**击键监控**是记录用户在物理键盘上执行的击键行为。监控通常通过技术手段完成，例如硬件设备或称为键盘记录器的软件程序。不过，视频录像机也可以执行可视化监控。在大多数情况下，攻击者将击键监控用于恶意目的。在极端情况下和高度受限的环境中，组织可能会实施击键监控以审计和分析用户活动。\n\
  \n击键监控常被比作窃听。关于击键监控是否应像电话窃听一样受到限制和控制，存在一些争议。许多采用击键监控的组织会通过雇佣协议、安全策略，或登录/注册区域的警告横幅，通知授权和未授权用户正在进行此类监控。\n\
  \n##### 流量分析和趋势分析\n\n**流量分析**和**趋势分析**是监控的形式，它们检查数据包的流向，而不是实际的数据包内容。这有时被称为网络流监控。它可以推断出大量信息，例如主备通信路由、主服务器的位置、加密流量的来源和网络支持的流量大小、典型的流量流向、通信频率等。\n\
  \n这些技术有时可以揭示可疑的流量模式，例如当某员工的账户向其他人发送大量电子邮件时。这可能表明该员工的系统是僵尸网络的一部分，受远程位置的攻击者控制。同样，流量分析可能检测到不道德的内部人员是否通过电子邮件将内部信息转发给未授权方。这类事件通常会留下可检测的特征。\n\
  \n### 出站监控\n\n*出站监控*是指监控传出流量以防止数据渗漏，数据渗漏是指未经授权将数据传输到组织外部。防止数据渗漏的一些常用方法包括使用数据丢失防护技术、查找隐写术尝试，以及使用水印来检测流出的未授权数据。\n\
  \n高级攻击者（如国家资助的高级持续性威胁）通常会在将数据发送出网络之前对其进行加密。这可以挫败一些试图检测数据渗漏的常用工具。不过，也可以部署监控发出网络的加密数据量的工具。\n\
  \n#### 数据丢失防护\n\n*数据丢失防护（DLP）*系统旨在检测并阻止数据渗漏尝试。这些系统具备扫描未加密数据以查找关键字和数据模式的能力。例如，假设某组织使用机密、专有、私密和敏感等数据分类。DLP\
  \ 系统可以扫描文件中的这些词汇并将其检测出来。\n\n模式匹配 DLP 系统查找特定模式。例如，美国社会安全号码具有 `nnn-nn-nnnn` 的模式（三个数字、一个连字符、两个数字、一个连字符和四个数字）。DLP\
  \ 可以查找此模式并将其检测出来。管理员可以根据需要设置 DLP 系统以查找任何模式。\n\nDLP 系统主要有两种类型：基于网络的和基于端点的。\n\n#####\
  \ 基于网络的 DLP\n\n基于网络的 DLP 扫描所有传出数据以查找特定数据。管理员会将其部署在网络边缘，以扫描离开组织的所有数据。如果用户发送包含受限数据的文件，DLP\
  \ 系统将检测到并阻止其离开组织。DLP 系统会发送警报，例如发送电子邮件给管理员。\n\n##### 基于端点的 DLP\n\n基于端点的 DLP 可以扫描存储在系统上的文件以及发送到外部设备（如打印机）的文件。例如，组织的基于端点的\
  \ DLP 可以防止用户将敏感数据复制到 USB 闪存驱动器，或将敏感数据发送到打印机。管理员会配置 DLP 使用适当的关键字扫描文件，如果检测到包含这些关键字的文件，它将阻止复制或打印作业。也可以配置基于端点的\
  \ DLP 系统定期扫描文件（如文件服务器上的文件），查找包含特定关键字或模式的文件，甚至未经授权的文件类型，如 MP3 文件。\n\nDLP 系统通常具备执行深度检查的能力。例如，如果用户将文件嵌入压缩的\
  \ zip 文件中，DLP 系统仍能检测到关键字和模式。但是，DLP 系统没有解密数据的能力。\n\n\n\n\n\n### 网络型 DLP 系统与审计评估\n\
  \n基于网络的 DLP 系统过去可能阻止了一些重大泄露事件。例如，在 2014 年的索尼攻击事件中，攻击者窃取了超过 25 GB 的敏感未加密数据，涉及索尼员工的社会安全号码、医疗和薪资信息。如果攻击者在检索数据前未对其加密，DLP\
  \ 系统本可检测到将数据传出网络的尝试。\n\n然而，值得注意的是，高级持续性威胁（如第 14 章讨论的 Fancy Bear 和 Cozy Bear）通常在将流量传出网络前对其进行加密。\n\
  \n#### 隐写术\n\n**隐写术** 是将消息嵌入文件中的做法。例如，个人可以修改图片文件中的比特位来嵌入消息。这种变化肉眼观察图片时无法察觉，但如果其他人知道要寻找该消息，他们就可以将其提取出来。\n\
  \n如果你拥有原始文件和一个疑似包含隐藏消息的文件，就有可能检测出隐写术尝试。如果你使用哈希算法（如安全哈希算法 3，`SHA-3`），可以为这两个文件分别创建哈希值。如果哈希值相同，则文件不包含隐藏消息。但是，如果哈希值不同，则表明第二个文件已被修改。取证分析技术可能能够检索该消息。\n\
  \n在出站监控的背景下，组织可以定期获取极少变动的内部文件的哈希值。例如，`JPEG` 和 `GIF` 等图形文件通常保持不变。如果安全专家怀疑恶意内部人员在这些文件中嵌入额外数据并将其通过电子邮件发送到组织外部，他们可以将原始哈希值与恶意内部人员发送出去的文件哈希值进行比较。如果哈希值不同，则表明文件不同，可能包含隐藏消息。\n\
  \n#### 水印技术\n\n**水印技术** 是在纸张中嵌入不易察觉的图像或图案的做法。它常用于货币以防止伪造。同样，组织经常在文档中使用水印。例如，敏感文档的作者可以使用适当的分类标记，如“机密”或“专有”。任何处理该文件或其打印副本的人都能轻松看到分类标记。\n\
  \n从出站监控的角度来看，DLP 系统可以检测未加密文件中的水印。当 DLP 系统通过这些水印识别出敏感数据时，它可以阻止传输并向安全人员发出警报。这可以防止文件传出组织。\n\
  \n水印技术的一种高级实现是**数字水印**。数字水印是秘密嵌入数字文件中的标记。例如，一些电影制片厂会对发送给不同分销商的电影副本进行数字标记。每个副本都有不同的标记，制片厂会追踪哪个分销商收到了哪个副本。如果任何分销商发布了电影的盗版副本，制片厂就能识别出是哪个分销商泄露的。\n\
  \n#### 审计以评估有效性\n\n许多组织已制定了强有力且有效的安全策略。然而，策略到位并不意味着人员知晓或遵守它们。很多时候，组织希望通过审计环境来评估其安全策略及相关访问控制的有效性。\n\
  \n**审计** 是对环境进行有条理的检查或审查，以确保符合法规并检测异常、未经授权的事件或犯罪。它验证环境中部署的安全机制是否为环境提供了足够的安全性。测试过程确保人员遵守安全策略或其他法规规定的要求，且部署的安全解决方案中不存在重大漏洞或弱点。\n\
  \n**审计员** 负责测试和验证流程和程序是否到位以实施安全策略或法规，以及它们是否足以满足组织的安全要求。他们还验证人员是否遵循这些流程和程序。换句话说，审计员执行审计工作。\n\
  \n##### 检查审计\n\n安全的 IT 环境高度依赖审计作为一种侦察型安全控制，以发现和纠正漏洞。在访问控制的背景下，两项重要的审计是访问审查审计和用户权利审计。\n\
  \n明确定义并遵守审查频率非常重要。组织通常根据风险来确定安全审计或安全审查的频率。人员评估针对组织宝贵资产的漏洞和威胁，以确定总体风险水平。这有助于组织证明审计费用的合理性，并确定他们希望多久进行一次审计。\n\
  \n与部署和维护安全的许多其他方面一样，安全审计通常被视为尽职调查的关键要素。如果高级管理层未能强制执行定期安全审查的合规性，利益相关者可以追究他们的责任，并让他们为因安全漏洞或策略违规导致的任何资产损失承担法律责任。不执行审计会造成管理层未尽到尽职调查的印象。\n\
  \n##### 访问审查审计\n\n许多组织执行定期访问审查和审计，以确保对象访问和账户管理实践支持安全策略。这些审计验证用户没有过度特权，且账户得到适当管理。它们确保安全流程和程序到位、人员遵循这些流程和程序，且这些流程和程序按预期工作。\n\
  \n例如，对高价值数据的访问应仅限于需要它的用户。访问审查审计将验证数据已分类，且数据分类对用户清晰明了。此外，它将确保任何有权授予数据访问权限的人都了解什么条件使有资格获得该访问权限。例如，如果服务台专业人员可以授予对高度机密数据的访问权限，该专业人员需要知道什么条件使有资格获得该级别的访问权限。\n\
  \n在检查账户管理实践时，访问审查审计将确保根据最佳实践和安全策略禁用和删除账户。例如，如果员工被解雇，应尽快禁用其账户。典型的解雇程序策略通常包括以下要素：\n\
  \n*   离职面谈期间至少有一名见证人在场。\n*   面谈期间禁用账户访问权限。\n*   面谈期间或面谈后立即收回员工识别徽章和其他物理凭证（如智能卡）。\n\
  *   面谈后立即护送员工离开现场。\n\n访问审查验证策略存在且人员正在遵循。当解雇的员工在离职面谈后仍持续拥有网络访问权限时，他们很容易造成破坏。例如，管理员可以创建一个单独的管理员账户，并使用它访问网络，即使该管理员的原始账户已被禁用。\n\
  \n##### 用户权利审计\n\n用户权利是指授予用户的特权。用户需要权利和权限（特权）来执行其工作，但他们只需要有限数量的特权。在用户权利的背景下，最小权限原则确保用户仅拥有执行其工作所需的特权，不多不少。\n\
  \n\n\n\n\n### 用户权利审查与安全审计\n\n尽管访问控制试图强制执行最小权限原则，但有时用户会被授予过多的特权。用户权利审查可以发现用户何时拥有过多特权，这违反了与用户权利相关的安全策略。\n\
  \n#### 特权组审计\n\n许多组织将组作为基于角色的访问控制模型的一部分。限制具有高级别特权的组（如管理员组）的成员资格非常重要。确保组成员仅在必要时使用其高特权账户也同样重要。审计有助于确定人员是否遵守这些策略。\n\
  \n##### 高级管理员组\n\n许多操作系统都有特权组，例如 Administrators 组。Administrators 组通常被授予系统的完全特权，当用户账户被放入\
  \ Administrators 组时，该用户即拥有这些特权。考虑到这一点，用户权利审查通常会审查任何特权组的成员资格，包括不同的管理员组。\n\n某些组拥有极高的特权，即使在拥有数万用户的组织中，其成员也仅限于极少数人。例如，Microsoft\
  \ 域包含一个称为 Enterprise Admins 的组。该组中的用户可以在 Microsoft 林（一组相关域）内的任何域上执行任何操作。该组权力极大，因此成员资格通常仅限于两三名高级管理员。监控和审计该组的成员资格可以发现被未授权添加到这些组中的个人。\n\
  \n可以使用自动化方法来监控特权账户的成员资格，使得添加未授权用户的尝试自动失败。审计日志也会记录此操作，权利审查可以检查这些事件。审计员可以检查审计追踪以确定是谁试图添加未授权账户。\n\
  \n人员还可以创建具有提升特权的额外组。例如，管理员可能会为 IT 部门的某些用户创建一个 `ITAdmins` 组。他们会根据这些管理员的工作要求授予该组适当的特权，并将\
  \ IT 部门管理员的账户放入 `ITAdmins` 组。只有 IT 部门的管理员应该在该组中，用户权利审计可以验证其他部门的用户不在该组中。这是检测权限蔓延的一种方法。\n\
  \n##### 双重管理员账户\n\n许多组织要求管理员维护两个账户。他们使用一个账户进行日常常规工作。第二个账户拥有额外的特权，用于管理工作。这降低了与该特权账户相关的风险。\n\
  \n例如，如果用户登录时系统感染了恶意软件，恶意软件通常可以承担用户账户的特权。如果用户使用特权账户登录，恶意软件将从这些提升的特权开始运行。但是，如果管理员仅在\
  \ 10% 的时间使用管理员账户执行管理操作，这将降低在管理员使用管理员账户登录的同时发生感染的潜在风险。\n\n审计可以验证管理员是否适当地使用了特权账户。例如，组织可能估计管理员在典型的一天中只需约\
  \ 10% 的时间使用特权账户，其余时间应使用其常规账户。日志分析可以显示该估计是否准确，以及管理员是否遵守了该规则。如果管理员持续使用管理员账户而很少使用常规用户账户，审计可将其标记为明显的策略违规。\n\
  \n### 安全审计与审查\n\n安全审计和审查有助于确保组织已正确实施安全控制。访问审查审计（本章前面介绍过）评估访问控制的有效性。这些审查确保账户得到适当管理、不具有过多特权，并在需要时被禁用或删除。在安全运营领域的背景下，安全审计有助于确保管理控制到位。以下列表包含一些常见的检查项目：\n\
  \n*   **补丁管理** 补丁管理审查确保补丁在可用后尽快得到评估。它还确保组织遵循既定程序来评估、测试、批准、部署和验证补丁。漏洞扫描报告在任何补丁管理审查或审计中都很有价值。\n\
  *   **漏洞管理** 漏洞管理审查确保根据既定指南定期执行漏洞扫描和评估。例如，组织可能有一份策略文件，规定至少每周执行一次漏洞扫描，审查将验证是否执行了此操作。此外，审查将验证扫描中发现的漏洞是否已得到解决和缓解。\n\
  *   **配置管理** 可以定期审计系统，以确保原始配置未被修改。通常可以使用脚本工具检查系统的特定配置，并识别何时发生了更改。此外，可以为许多配置设置启用日志记录以记录配置更改。配置管理审计可以检查日志中的任何更改，并验证它们是否经过授权。\n\
  *   **变更管理** 变更管理审查确保变更按照组织的变更管理策略实施。这通常包括对中断事故的审查以确定原因。由未授权变更导致的中断清楚地表明变更管理计划需要改进。\n\
  \n### 报告审计结果\n\n组织用于生成审计报告的实际格式各不相同。然而，报告应涉及一些基本或核心概念：\n\n*   审计的目的\n*   审计的范围\n\
  *   审计发现或揭示的结果\n\n除了这些基本概念外，审计报告通常还包含许多特定于环境的详细信息，如时间、日期和受审系统列表。它们还可以包含广泛的内容，重点关注：\n\
  \n*   问题、事件和状况\n*   标准、准则和基线\n*   原因、理由、影响和效果\n*   推荐的解决方案和保障措施\n\n审计报告应具有清晰、简洁且客观的结构或设计。尽管审计员通常会包含意见或建议，但他们应明确标识它们。实际发现应基于审计期间从审计追踪和其他来源收集的事实和证据。\n\
  \n#### 保护审计结果\n\n审计报告包含敏感信息。应为其分配分类标签，只有具有足够特权的人员才能访问审计报告。这包括参与报告创建或负责纠正报告中提到的项目的高级管理人员和安全人员。\n\
  \n\n\n\n\n### 审计报告与安全运营\n\n#### 定制审计报告\n\n审计人员有时会为其他人员创建一份包含有限数据的单独审计报告。这种修改后的报告仅提供与目标受众相关的详细信息。例如，高级管理层无需了解审计报告的所有细枝末节。因此，面向高级管理层的审计报告更加简洁，并提供发现情况的概览或摘要。而面向负责修正问题的安全管理员的审计报告则应非常详细，并包含其所涵盖事件的所有可用信息。\n\
  \n另一方面，审计人员正在执行审计这一事实通常是公开的。这能让人员知晓高级管理层正在积极采取措施以维护安全。\n\n#### 分发审计报告\n\n审计报告完成后，审计人员会将其提交给指定的接收者，具体名单由安全策略文档定义。通常要求接收方签署收据确认。当审计报告包含有关严重安全违规或性能问题的信息时，人员会将其上报至更高层级的管理部门进行审查、通知，并指派响应以解决这些问题。\n\
  \n#### 使用外部审计人员\n\n许多组织选择聘请外部安全审计人员来进行独立审计。此外，某些法律法规也要求进行外部审计。外部审计提供了内部审计无法提供的客观性，并为内部策略、实践和程序带来了全新的外部视角。\n\
  \n外部审计人员将获得公司安全策略的访问权限，并被授权检查 IT 和物理环境的相关方面。因此，审计人员必须是受信任的实体。审计活动的目标是获得一份最终报告，详细记录发现情况，并在适当的时候提出对策建议。\n\
  \n外部审计的完成可能需要相当长的时间——在某些情况下长达数周或数月。在审计过程中，审计人员可能会发布临时报告。`临时报告` 是向组织提交的书面或口头报告，内容涉及任何观察到的安全弱点或策略/程序不匹配项，这些问题需要立即关注。当某个问题或事项过于重要，不能等到最终审计报告发布时，审计人员就会发布临时报告。\n\
  \n审计人员完成调查后，通常会召开退出会议。在此会议上，审计人员展示并讨论其发现，并与相关方讨论解决方案。然而，只有在退出会议结束且审计人员离开现场后，他们才会撰写并提交最终审计报告给组织。这使得最终审计报告不受办公室政治和胁迫的影响。\n\
  \n组织收到最终审计报告后，内部审计人员会对其进行审查，并根据报告向高级管理层提出建议。高级管理层负责决定采纳哪些建议，并将实施要求委派给内部人员。\n\n###\
  \ 摘要\n\nCISSP 安全运营领域列出了六个具体的事件响应步骤。检测是第一步，可以来自自动化工具或员工观察。人员调查警报以确定是否发生了实际事件，如果是，下一步就是响应。在缓解阶段，遏制事件至关重要。在事件响应的所有阶段中，保护证据也同样重要。根据管辖法律或组织的安全策略，可能需要进行报告。在恢复阶段，系统将恢复全面运行，重要的是要确保其恢复到至少与攻击前同等安全的状态。补救阶段包括根因分析，并通常包含防止再次发生的建议。最后，经验教训阶段会审视事件及响应过程，以确定是否有经验教训可供吸取。\n\
  \n几个基本步骤可以预防许多常见攻击。它们包括：使用当前补丁保持系统和应用程序的最新状态，移除或禁用不需要的服务和协议，使用入侵检测和防御系统，使用具有最新特征库的反恶意软件，以及同时启用基于主机和基于网络的防火墙。\n\
  \n拒绝服务攻击会阻止系统处理或响应合法的服务请求，并通常针对可通过互联网访问的系统。SYN 洪水攻击会破坏 TCP 三次握手，有时会消耗资源和带宽。虽然 SYN\
  \ 洪水攻击至今仍很常见，但其他攻击通常是旧攻击方法的变种。僵尸网络常被用于发起分布式拒绝服务攻击。零日漏洞利用是指先前未知的漏洞。遵循基本预防措施有助于防止零日漏洞利用攻击成功。\n\
  \n自动化工具（如入侵检测系统）使用日志来监控环境，并在攻击发生时检测攻击。其中一些工具可以自动阻断攻击。IDS 采用两种检测方法：基于知识和基于行为。基于知识的\
  \ IDS 使用攻击特征数据库来检测入侵尝试，但无法识别新的攻击方法。基于行为的系统以正常活动的基线为起点，然后根据基线衡量活动以检测异常活动。被动响应会记录活动，并可能就关注项发送警报。主动响应会改变环境以阻断正在进行的攻击。基于主机的系统安装在单个主机上并对其进行监控，而基于网络的系统安装在网络设备上并监控整体网络活动。入侵防御系统部署在流量直通路径上，可在恶意流量到达目标系统之前将其阻断。\n\
  \n蜜罐、蜜网和垫圈单元可以作为有用的工具，防止恶意活动发生在生产网络上，同时引诱入侵者停留。它们通常包含伪缺陷和伪造数据，用于诱捕攻击者。管理员和安全人员也利用这些工具收集针对攻击者的证据，以便可能的起诉。\n\
  \n最新的反恶意软件可以预防许多恶意代码攻击。反恶意软件通常安装在互联网与内部网络的边界、电子邮件服务器上以及每个系统上。限制用户的软件安装权限有助于防止用户意外安装恶意软件。此外，教育用户了解不同类型的恶意软件以及犯罪分子如何欺骗用户，有助于他们避免高风险行为。\n\
  \n渗透测试是检查已部署安全措施的强度和有效性以及组织安全策略的有用工具。它从漏洞评估或扫描开始，然后尝试利用漏洞。渗透测试只能在获得管理层批准的情况下进行，且应尽可能在测试系统而非生产系统上进行。组织通常聘请外部顾问执行渗透测试，并可以控制这些顾问掌握的知识量。零知识测试通常称为黑盒测试，全知识测试通常称为白盒或水晶盒测试，部分知识测试通常称为灰盒测试。\n\
  \n\n\n\n\n### 日志记录与监控\n\n日志记录与监控若与有效的身份识别和认证实践相结合，可提供整体的问责性。\n\n### 日志记录\n\n日志记录涉及在日志和数据库文件中记录事件。安全日志、系统日志、应用日志、防火墙日志、代理日志和变更管理日志都是常见的日志文件。日志文件包含有价值的数据，应受到保护以确保它们不被修改、删除或损坏。如果得不到保护，攻击者通常会尝试修改或删除它们，并且它们将无法作为起诉攻击者的证据被采纳。\n\
  \n### 监控\n\n监控涉及实时审查日志，以及稍后作为审计一部分进行审查。审计追踪是通过将有关事件和发生情况的信息记录到一个或多个数据库或日志文件中而创建的记录，可用于重建事件、提取事件相关信息，以及证明或反驳过错。审计追踪提供了一种被动形式的侦查型安全控制，并以与闭路电视（CCTV）或保安相同的方式起到威慑作用。此外，它们在起诉罪犯时可作为关键证据。日志可能非常大，因此会使用不同的方法来分析它们或减小其大小。抽样是一种用于分析日志的统计方法，而使用截断水平是一种非统计方法，涉及关注项的预定义阈值。\n\
  \n### 访问控制审计\n\n可使用不同类型的审计和评估来评估访问控制的有效性。审计是对环境进行的有条不紊的检查或评估，以确保符合法规并检测异常、未经授权的事件或彻头彻尾的犯罪行为。访问评审审计确保对象访问和账户管理实践支持组织的安全策略。用户权利审计确保人员遵循最小权限原则。\n\
  \n### 审计报告\n\n审计记录文档记录审计的结果。这些报告应受到保护，且分发应仅限于组织内的特定人员。高级管理层和安全专业人员需要访问安全审计的结果，但如果攻击者获得审计报告的访问权限，他们可利用该信息识别可利用的漏洞。\n\
  \n### 安全审计与评估\n\n安全审计和评估通常用于保证控制措施按指示实施并按预期运行。通常会包含审计和评估来检查补丁管理、漏洞管理、变更管理和配置管理项目。\n\
  \n### 考试精要\n\n#### 了解事件响应步骤\n\nCISSP 安全运营领域将事件响应步骤列为：检测、响应、缓解、报告、恢复、补救和经验教训。在检测并验证事件后，首要响应是在保护证据的同时限制或遏制事件的范围。根据管辖法律，组织可能需要向官方机构报告事件，如果个人身份信息（PII）受到影响，则需要通知相关个人。补救和经验教训阶段包括根因分析，以确定原因并推荐解决方案以防止再次发生。\n\
  \n#### 了解基本预防措施\n\n基本预防措施可防止许多事件的发生。这些措施包括：保持系统最新、移除或禁用不需要的协议和服务、使用入侵检测和防御系统、使用具有最新特征库的反恶意软件，以及同时启用基于主机和基于网络的防火墙。\n\
  \n#### 了解拒绝服务（DoS）攻击\n\nDoS 攻击会阻止系统响应合法的服务请求。常见的 DoS 攻击是 SYN 洪水攻击，它会破坏 TCP 三次握手。尽管由于基本防范措施能阻止它们，较旧的攻击如今不那么常见，但你仍可能会被测试这些内容，因为许多较新的攻击通常是旧方法的变体。Smurf\
  \ 攻击利用放大网络向受害者发送大量响应数据包。Ping-of-death 攻击（死之 Ping 攻击）向受害者发送大量超大 Ping 数据包，导致受害者冻结、崩溃或重启。\n\
  \n#### 了解僵尸网络、僵尸网络控制器和牧羊人\n\n僵尸网络因可发起攻击的海量计算机而构成重大威胁，因此了解它们是什么很重要。僵尸网络是由被称为“僵尸网络牧羊人”的犯罪分子控制的、被攻陷的计算设备集合（通常称为僵尸或肉鸡），并组织成一个网络。牧羊人使用命令与控制服务器远程控制僵尸，并经常利用僵尸网络对其他系统发起攻击，或发送垃圾邮件或钓鱼邮件。牧羊人还将僵尸网络的访问权限出租给其他犯罪分子。\n\
  \n#### 了解零日漏洞利用\n\n零日漏洞利用是一种利用漏洞的攻击，该漏洞要么仅攻击者知晓，要么仅为数不多的一小群人知晓。表面上听起来似乎无法防范未知漏洞，但基本安全实践在防止零日漏洞利用方面大有裨益。移除或禁用不需要的协议和服务可减少攻击面，启用防火墙可阻断许多访问点，使用入侵检测和防御系统有助于检测和阻止潜在攻击。此外，使用蜜罐和加固单元等工具有助于保护生产网络。\n\
  \n#### 了解中间人攻击\n\n当恶意用户能够获得通信链路两个端点之间的逻辑位置时，就会发生中间人攻击。尽管攻击者完成中间人攻击需要相当高的技术水平，但从攻击中获得的数据量可能非常巨大。\n\
  \n#### 了解破坏与间谍活动\n\n如果内部人员因某些原因变得不满，他们可能会对组织实施破坏。间谍活动是指竞争对手试要窃取信息，他们可能会利用内部员工。基本安全原则，如实施最小权限原则并立即禁用离职员工的账户，可限制这些攻击造成的损害。\n\
  \n#### 了解入侵检测与入侵防御\n\nIDS 和 IPS 是针对攻击的重要侦查型和预防型措施。了解基于知识的检测（使用类似于反恶意软件特征库的数据库）和基于行为的检测之间的区别。基于行为的检测以基线为起点以识别正常行为，并将活动与基线进行比较以检测异常活动。如果网络被修改，基线可能会过时，因此环境变更时必须更新基线。\n\
  \n#### 识别 IDS/IPS 响应\n\nIDS 可以通过记录日志和发送通知被动响应，或通过改变环境主动响应。有些人将主动 IDS 称为 IPS。但重要的是要认识到，IPS\
  \ 部署在流量的直通路径上，并包含在恶意流量到达目标之前将其阻断的能力。\n\n#### 了解 HIDS 与 NIDS 的区别\n\n基于主机的 IDS（HIDS）只能监控单个系统上的活动。一个缺点是攻击者可能会发现并禁用它们。基于网络的\
  \ IDS（NIDS）可以监控网络上的活动，且 NIDS 对攻击者的可见性不高。\n\n#### 了解蜜罐、加固单元和伪缺陷\n\n蜜罐是一个通常具有伪缺陷和假数据以引诱入侵者的系统。管理员可以在攻击者身处蜜罐时观察其活动，只要攻击者在蜜罐中，他们就不在生产网络中。一些\
  \ IDS 在检测后具有将攻击者转移到加固单元的能力。虽然蜜罐和加固单元相似，但请注意：蜜罐引诱攻击者，而攻击者被转移到加固单元。\n\n\n\n\n\n###\
  \ 理解阻止恶意代码的方法\n\n恶意代码是通过多种工具的组合来阻止的。显而易见的工具是在每个系统、网络边界和电子邮件服务器上安装了具有最新定义的反恶意软件。然而，强制执行基本安全原则（如最小权限原则）的策略，可以防止普通用户安装潜在的恶意软件。此外，教育用户了解风险以及攻击者传播病毒的常用手段，有助于用户理解并避免危险行为。\n\
  \n### 理解渗透测试\n\n渗透测试始于发现漏洞，然后模拟攻击以识别哪些漏洞可被利用。重要的是要记住，未经管理层明确同意和知情，不应进行渗透测试。此外，由于渗透测试可能导致损害，因此应尽可能在隔离系统上进行。你还应识别黑盒测试（零知识）、白盒测试（完全知识）和灰盒测试（部分知识）之间的区别。\n\
  \n### 了解日志文件的类型\n\n日志数据记录在数据库和不同类型的日志文件中。常见的日志文件包括安全日志、系统日志、应用程序日志、防火墙日志、代理日志和变更管理日志。日志文件应通过集中存储并使用权限限制访问来保护，归档日志应设置为只读以防止修改。\n\
  \n### 理解监控及监控工具的用途\n\n监控是一种侧重于主动审查日志文件数据的审计形式。监控用于让主体对其行为负责，并检测异常或恶意活动。它也被用于监控系统性能。监控工具（如\
  \ `IDSs` 或 `SIEMs`）实现监控自动化，并提供事件的实时分析。\n\n### 理解审计跟踪\n\n审计跟踪是通过将有关事件和发生情况的信息记录到一个或多个数据库或日志文件中而创建的记录。它们用于重构事件、提取有关事件的信息，以及证明或反驳过错。使用审计跟踪是一种被动的侦查型安全控制形式，且审计跟踪是起诉罪犯的关键证据。\n\
  \n### 理解抽样\n\n抽样，或数据提取，是从大量数据中提取元素以构建整体的有意义表示或摘要的过程。统计抽样使用精确的数学函数从大量数据中提取有意义的信息。截断是一种非统计抽样形式，仅记录超过阈值的事件。\n\
  \n### 理解如何维持问责制\n\n通过审计的使用，可为各个主体维持问责制。日志记录用户活动，用户需对其记录在案的行为负责。这直接促进了良好的用户行为和对组织安全策略的遵从。\n\
  \n### 理解安全审计和评审的重要性\n\n安全审计和评审有助于确保管理计划有效且正被遵循。它们通常与账户管理实践相关联，以防止违反最小权限或需知原则。然而，它们也可被执行以监督补丁管理、漏洞管理、变更管理和配置管理计划。\n\
  \n### 理解审计及频繁安全审计的必要性\n\n审计是对环境进行的有条理的检查或评审，以确保符合法规并检测异常、未经授权的事件或彻头彻尾的犯罪。安全的 IT\
  \ 环境高度依赖审计。总体而言，审计在安全环境中作为一种主要的侦查型控制手段。IT 基础设施安全审计或安全评审的频率基于风险。组织决定是否存在足够的风险以证明安全审计的费用和中断是合理的。风险程度也影响审计的执行频率。明确定义并遵守审计评审的频率非常重要。\n\
  \n### 理解审计是尽职照管的一个方面\n\n安全审计和有效性评审是展示尽职照管的关键要素。高级管理层必须强制遵守定期的定期安全评审，否则他们很可能会对发生的任何资产损失负责并承担法律责任。\n\
  \n### 理解控制对审计报告访问的必要性\n\n审计报告通常涉及审计目的、审计范围以及审计发现或揭示的结果等常见概念。它们通常还包括特定于环境的其他详细信息，并可能包含敏感信息，如问题、标准、原因和建议。包含敏感信息的审计报告应分配分类标签并妥善处理。只有具有足够特权的人员才应有权访问它们。审计报告可为不同的目标受众准备不同版本，仅包含特定受众所需的详细信息。例如，高级安全管理员可能拥有包含所有相关细节的报告，而给高管的报告则仅提供高层信息。\n\
  \n### 理解访问评审和用户权利审计\n\n访问评审审计确保对象访问和账户管理实践支持安全策略。用户权利审计确保遵循最小权限原则，且通常侧重于特权账户。\n\n\
  ### 审计访问控制\n\n对访问控制流程的定期评审和审计有助于评估访问控制的有效性。例如，审计可以跟踪任何账户的登录成功与失败。入侵检测系统可以监控这些日志，并轻松识别攻击并通知管理员。\n\
  \n### 书面实验\n\n1. 列出 CISSP 安全运营领域中确定的事件响应的不同阶段。\n2. 描述入侵检测系统的主要类型。\n3. 描述审计与审计跟踪之间的关系。\n\
  4. 组织应采取什么措施来验证账户是否得到妥善管理？\n\n### 复习题\n\n1. 在检测并验证事件后，以下哪项是最佳响应？\n    1. 遏制它。\n\
  \    2. 上报它。\n    3. 修复它。\n    4. 收集证据。\n\n2. 在事件响应的修复阶段，安全人员会执行以下哪项操作？\n    1.\
  \ 遏制事件\n    2. 收集证据\n    3. 重建系统\n    4. 根因分析\n\n3. 以下哪些是 DoS 攻击？（选择三项。）\n    1.\
  \ 泪滴攻击\n    2. Smurf 攻击\n    3. 死亡之 Ping\n    4. 欺骗\n\n4. SYN 洪水攻击是如何工作的？\n    1.\
  \ 利用 Windows 系统中的数据包处理故障\n    2. 使用放大网络向受害者发送大量数据包\n    3. 破坏 TCP 使用的三次握手\n    4.\
  \ 向受害者发送超大 Ping 数据包\n\n5. 托管在互联网上的 Web 服务器最近遭到攻击，利用了操作系统中的漏洞。操作系统供应商协助了事件调查，并证实该漏洞此前未被发现。这是哪种类型的攻击？\n\
  \    1. 僵尸网络\n    2. 零日漏洞利用\n    3. 拒绝服务\n    4. 分布式拒绝服务\n\n6. 在以下选项中，哪种是分发恶意软件最常见的方法？\n\
  \    1. 驱动下载\n    2. USB 闪存驱动器\n    3. 勒索软件\n    4. 未经批准的软件\n\n7. 在以下选项中，什么指示了入侵检测系统（IDS）的主要目的？\n\
  \    1. 检测异常活动\n    2. 诊断系统故障\n\n\n\n\n3. 评估系统性能\n\n4. 测试系统漏洞\n\n8. 以下哪项关于基于主机的入侵检测系统（HIDS）的描述是正确的？\n\
  \n    1. 它监控整个网络。\n    2. 它监控单个系统。\n    3. 它对攻击者和授权用户不可见。\n    4. 它无法检测恶意代码。\n\n\
  9. 以下哪项是一种伪造网络，旨在利用未修补、无防护的安全漏洞和虚假数据来引诱入侵者？\n\n    1. IDS\n    2. 蜜网\n    3. 防护单元\n\
  \    4. 伪缺陷\n\n10. 在以下选项中，哪种是最佳的反恶意软件保护形式？\n\n    1. 每个系统上部署多种解决方案\n    2. 整个组织部署单一解决方案\n\
  \    3. 在多个位置部署反恶意软件保护\n    4. 在所有边界网关进行 100% 内容过滤\n\n11. 当使用渗透测试来验证安全策略的强度时，以下哪项是*不*推荐的？\n\
  \n    1. 模仿之前针对您系统实施的攻击\n    2. 在管理层不知情的情况下执行攻击\n    3. 使用手动和自动攻击工具\n    4. 重新配置系统以解决发现的任何漏洞\n\
  \n12. 当主体经过认证访问系统时，什么用于使其对其行为负责？\n\n    1. 认证\n    2. 监控\n    3. 账户锁定\n    4. 用户权利审查\n\
  \n13. 审计追踪属于哪种类型的安全控制？\n\n    1. 管理类\n    2. 检测类\n    3. 纠正类\n    4. 物理类\n\n14.\
  \ 以下哪个选项是对环境进行有条理的检查或审查，以确保符合法规并检测异常、未经授权的事件或彻头彻尾的犯罪？\n\n    1. 渗透测试\n    2. 审计\n\
  \    3. 风险分析\n    4. 诱捕\n\n15. 什么可用于通过非统计方法减少记录或审计的数据量？\n\n    1. 裁剪级别\n    2. 抽样\n\
  \    3. 日志分析\n    4. 警报触发器\n\n16. 以下哪项更关注数据的模式和趋势，而非实际内容？\n\n    1. 击键监控\n    2.\
  \ 流量分析\n    3. 事件日志记录\n    4. 安全审计\n\n17. 什么能检测出用户拥有超出必要范围的特权？\n\n    1. 账户管理\n\
  \    2. 用户权利审计\n    3. 日志记录\n    4. 报告\n\n回答第 18 至 20 题时请参考以下场景。\n\n某组织有一份事件响应计划，要求在验证事件后进行报告。出于安全考虑，该组织未公开该计划。只有事件响应团队成员知晓该计划及其内容。最近，一名服务器管理员发现他管理的一台\
  \ Web 服务器运行速度比正常情况慢。经过快速调查，他意识到有一场攻击正从某个特定 IP 地址发起。他立即重启了 Web 服务器以重置连接并阻止攻击。随后，他使用在互联网上找到的一个工具，针对该\
  \ IP 地址发动了持续数小时的长时间攻击。由于该 IP 地址的攻击停止了，他没有报告该事件。\n\n18. 在重启 Web 服务器*之前*应该做什么？\n\n\
  \    1. 审查事件\n    2. 执行补救步骤\n    3. 采取恢复步骤\n    4. 收集证据\n\n19. 以下哪项表明服务器管理员在此事件中犯下的最严重错误？\n\
  \n    1. 重启服务器\n    2. 未报告事件\n    3. 攻击该 IP 地址\n    4. 重置连接\n\n20. 此事件中完全缺失的是什么？\n\
  \n    1. 经验教训\n    2. 检测\n    3. 响应\n    4. 恢复\n\n## 第 18 章  \n\n灾难恢复规划\n\n**本章涵盖的\
  \ CISSP 考试主题包括：**\n\n*   **领域 6：安全评估与测试** \n    *   6.3 收集安全流程数据 \n        *   6.3.5\
  \ 培训与意识\n        *   6.3.6 灾难恢复（DR）与业务连续性（BC）\n\n*   **领域 7：安全运营** \n    *   7.11\
  \ 实施恢复策略 \n        *   7.11.1 备份存储策略\n        *   7.11.2 恢复站点策略\n        *   7.11.3\
  \ 多处理站点\n        *   7.11.4 系统弹性、高可用性、服务质量（`QoS`）和容错\n\n    *   7.12 实施灾难恢复（DR）流程\
  \ \n        *   7.12.1 响应\n        *   7.12.2 人员\n        *   7.12.3 通信\n      \
  \  *   7.12.4 评估\n        *   7.12.5 恢复\n        *   7.12.6 培训与意识\n\n    *   7.13\
  \ 测试灾难恢复计划（DRP） \n        *   7.13.1 通读/桌面演练\n        *   7.13.2 演练\n        * \
  \  7.13.3 模拟\n        *   7.13.4 并行测试\n        *   7.13.5 全面中断测试\n\n在第 3 章“业务连续性规划”中，您学习了业务连续性规划（BCP）的基本要素——即帮助组织评估优先级并设计弹性流程的艺术，以便在灾难发生时能够维持持续运营。\n\
  \n灾难恢复规划（DRP）是以业务为中心的 BCP 练习的技术补充。它包含防止中断的技术控制，并促进在中断发生后尽快恢复服务。\n\n灾难恢复计划和业务连续性计划共同生效，并指导应急响应人员的行动，直到达到最终目标——即看到业务在其主要运营设施中恢复到全负荷运行能力。\n\
  \n在阅读本章时，您可能会注意到 BCP 和 DRP 流程之间有许多重叠领域。我们对特定灾难的讨论提供了从 BCP 和 DRP 两个角度处理它们的信息。尽管（ISC）²\
  \ CISSP 教程在这两个领域之间划清了界限，但大多数组织只有一个团队和一个计划来同时解决业务连续性和灾难恢复问题。在许多组织中，被称为业务连续性管理（BCM）的单一学科将\
  \ BCP、DRP 和危机管理纳入同一保护伞之下。\n\n### 灾难的本质\n\n灾难恢复规划为组织正常活动中断所带来的混乱带来了秩序。从其本质上讲，*灾难恢复计划*旨在应对局势已经紧张、冷静思考可能不再自然占上风的情况。设想一下您可能需要实施\
  \ DRP 措施的情形——飓风摧毁了您的主要运营设施；大火毁坏了您的主数据处理中心；恐怖活动切断了通往大都市区的通道。任何阻止、妨碍或中断组织执行工作任务能力的事件（或威胁要这样做）都被视为灾难。信息技术（IT）无法支持关键任务流程的那一刻，就是\
  \ DRP 介入管理恢复和修复程序的时刻。\n\n灾难恢复计划的建立应使其几乎能自动运行。DRP 还应设计为在灾难期间尽可能减少决策活动。关键人员应在灾难发生后充分接受其职责和任务的培训，并知晓使组织尽快恢复运行所需采取的步骤。我们将首先分析可能袭击您组织的一些潜在灾难及其构成的特定威胁。其中许多在第\
  \ 3 章中已提及，但我们将在此进一步详细探讨。\n\n\n\n\n### 为了规划工作场所中的自然灾害和非自然灾害，您首先必须了解它们的各种形式，如下节所述。\n\
  \n#### 自然灾害\n\n*自然灾害*反映了我们栖息地偶尔的暴怒——源于地球表面或大气变化、超出人类控制范围的剧烈事件。在某些情况下，例如飓风，科学家已经开发出复杂的预测模型，可在灾害发生前提供充足的预警。而另一些，例如地震，可能在瞬间造成毁灭性后果。灾难恢复计划应提供应对这两类灾害的机制，无论是逐步集结响应力量，还是对迅速出现的危机做出即时反应。\n\
  \n##### 地震\n\n地震是由地震板块移动引起的，几乎可能在世界任何地方毫无预警地发生。然而，它们更有可能发生在世界许多地区已知的断层带沿线。一个著名的例子是圣安德烈亚斯断层，它对美国西部部分地区构成重大风险。如果您居住在断层带沿线、地震频发的地区，您的\
  \ DRP 应涵盖地震事件中断正常业务活动时，贵企业将实施的程序。\n\n您可能会对世界上某些被认为可能发生地震的地区感到惊讶。表 18.1 显示了美国（及美国领土）中联邦应急管理局（FEMA）认定为中等、高或极高地震危险度的部分地区。请注意，表中列出的州包括\
  \ 50 个州中的 82%（41 个），这意味着该国大部分地区至少面临中等程度的地震活动风险。\n\n**表 18.1** **按美国州或领土划分的地震危险度**\n\
