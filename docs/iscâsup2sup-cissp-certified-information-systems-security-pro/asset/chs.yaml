  # 简介\n\n《*(ISC)2 CISSP：注册信息系统安全专家官方学习指南（第八版）*》为注册信息系统安全专家（CISSP）考试提供了坚实的基础。购买本书表明您渴望学习，并希望培养获得该认证所需的技能。本简介将为您提供本书及\
  \ CISSP 考试的基本概览。\n\n本书专为想要备考 CISSP 认证考试的读者和学生而设计。如果您的目标是成为一名认证安全专业人员，那么 CISSP 认证和本学习指南适合您。本书的目的是充分准备您参加\
  \ CISSP 考试。\n\n在深入阅读本书之前，您需要自行完成一些任务。您需要对 IT 和安全有一般性的了解。您应当具备在 CISSP 考试涵盖的八大领域中至少两个领域内五年全职带薪工作经验（或拥有大学学位者为四年）的必要条件。如果您根据\
  \ (ISC)² 的规定有资格参加 CISSP 考试，那么您已做好充分准备，可以使用本书进行学习。有关 (ISC)² 的更多信息，请参阅下一节。\n\n如果您获得了\
  \ (ISC)² 先决条件路径批准的认证之一，(ISC)² 还允许将五年经验要求减少一年。这些认证包括 CAP、CISM、CISA、CCNA Security、Security+、MCSA、MCSE\
  \ 以及许多 GIAC 认证。有关合格认证的完整列表，请访问 <https://www.isc2.org/Certifications/CISSP/Prerequisite-Pathway>。注意：您只能使用一种经验减免措施，即大学学位或认证二者择一，不可兼得。\n\
  \n## (ISC)²\n\nCISSP 考试由国际信息系统安全认证联盟 (ISC)² 管理。(ISC)² 是一个全球性的非营利组织。它有四大主要使命目标：\n\
  \n* 维护信息系统安全领域的通用知识体系（CBK）。\n* 为信息系统安全专业人员和从业者提供认证。\n* 开展认证培训并管理认证考试。\n* 通过持续教育监督合格认证候选人的持续认证。\n\
  \n(ISC)² 由从其认证从业者中选举产生的董事会运营。\n\n(ISC)² 支持并提供多种认证，包括 CISSP、SSCP、CAP、CSSLP、CCFP、HCISPP\
  \ 和 CCSP。这些认证旨在验证跨所有行业的 IT 安全专业人员的知识和技能。您可以从其网站 <http://www.isc2.org> 获取有关 (ISC)²\
  \ 及其其他认证的更多信息。\n\n注册信息系统安全专家（CISSP）资质面向负责在组织内设计和维护安全基础设施的安全专业人员。\n\n## 主题领域\n\n\
  CISSP 认证涵盖来自八个主题领域的内容。这八大领域如下：\n\n* 安全与风险管理\n* 资产安全\n* 安全架构与工程\n* 通信与网络安全\n* 身份与访问管理（IAM）\n\
  * 安全评估与测试\n* 安全运营\n* 软件开发安全\n\n这八大领域为通用安全框架提供了一个与厂商无关的概览。该框架是探讨可在全球各类组织中得到支持的安全实践的基础。\n\
  \n最近一次主题领域修订将反映在 2018 年 4 月 15 日开始的考试中。要全面了解 CISSP 考试涵盖的八大领域分组中的主题广度，请访问 (ISC)²\
  \ 网站 <http://www.isc2.org> 索取候选人信息手册。该文件包含完整的考试大纲以及关于认证的其他相关事实。\n\n## 预备资格\n\n(ISC)²\
  \ 定义了您必须满足的成为 CISSP 的资格要求。首先，您必须是一名执业安全专业人员，拥有至少五年全职带薪工作经验，或拥有四年经验加上近期的 IT 或 IS\
  \ 学位。专业经验被定义为在八大 CBK 领域中至少两个领域内为薪水或佣金从事的安全工作。\n\n其次，您必须同意遵守正式的职业道德准则。CISSP 职业道德准则是\
  \ (ISC)² 希望所有 CISSP 候选人遵循的一套准则，旨在维护信息系统安全领域的专业性。您可以在 (ISC)² 网站 <http://www.isc2.org>\
  \ 的“信息”部分找到它。\n\n(ISC)² 还提供了一个称为 (ISC)² 会员的入门项目。该项目允许没有任何或足够经验符合 CISSP 资格的人员仍可参加\
  \ CISSP 考试，随后再获取经验。会员被授予六年时间来获得五年的安全经验。只有在提供此类经验的证明（通常通过背书和简历），个人才能被授予 CISSP 认证。\n\
  \n# CISSP 考试概述\n\nCISSP 考试从 30,000 英尺的高度（即宏观战略层面）关注安全；它更多地涉及理论和概念，而非实现和程序。它非常广泛但不太深入。要成功通过此考试，您需要熟悉每个领域，但不一定要精通每个领域。\n\
  \n自 2017 年 12 月 18 日起，CISSP 考试采用自适应格式。(ISC)² 称新版本为 CISSP-CAT（计算机化自适应测试）。有关这种新考试呈现版本的完整详情，请参阅\
  \ <https://www.isc2.org/certifications/CISSP/CISSP-CAT>。\n\n\n\n\n# CISSP-CAT 考试概述\n\
  \nCISSP-CAT 考试最少包含 100 道题，最多 150 道。呈现给你的题目并非全部计入分数或通过状态。这些不计分的题目由 (ISC)² 称为 `pretest\
  \ questions`（预测试题），而计分题目称为 `operational items`（正式题目）。考试中不会标明题目是计分还是不计分。无论考生在第 100\
  \ 道题达到通过等级，还是看完所有 150 道题，考试中都将包含 25 道不计分题目。\n\nCISSP-CAT 考试最长允许三小时。如果你在达到通过等级前用完时间，将自动判定为不通过。\n\
  \nCISSP-CAT 不允许返回上一题修改答案。一旦离开某道题，你的答案选择即为最终确定。\n\nCISSP-CAT 没有公开或固定的及格分数线。相反，你必须证明自己有能力在最后\
  \ 75 道正式题目（即计分题）中达到 (ISC)² 设定的通过门槛，称为 `passing standard`（通过标准，该标准不公开）。\n\n如果计算机判定你在已答\
  \ 75 道正式题目后，达到通过标准的概率低于 5%，考试将自动结束并判定为不通过。系统只会呈现必要数量的题目，以 95% 的置信度确定你是否有能力达到通过标准或未能达到通过标准；你不保证会看到比这更多的题目。\n\
  \n## 重考政策\n\n如果你首次参加 CISSP 考试未通过，可在以下条件下重考：\n\n*   每 12 个月内最多可参加 CISSP 考试 3 次。\n\
  *   首次考试后须等待 30 天方可进行第二次尝试。\n*   第二次考试后须再等待 90 天方可进行第三次尝试。\n*   第三次考试后须再等待 180 天方可再次尝试，或等待至首次考试之日起满\
  \ 12 个月（以较长者为准）。\n\n每次额外的考试尝试均需支付全额费用。\n\n## 考试形式可用性\n\n无法再参加之前的纸质考试或 CBT（计算机化考试）固定\
  \ 250 道题的版本。CISSP 现仅提供 CBT CISSP-CAT 形式。\n\n更新后的 CISSP 考试将提供英语、法语、德语、巴西葡萄牙语、西班牙语、日语、简体中文和韩语版本。\n\
  \n自 2017 年 12 月 18 日起，认证信息系统安全专家 (CISSP) 考试（仅限英语版）将仅通过 (ISC)² 授权的 Pearson VUE 考试中心在授权市场以\
  \ CAT 形式提供。除英语以外其他语言版本的 CISSP 考试以及所有其他 (ISC)² 认证考试将继续以固定形式、线性考试的方式提供。\n\n# CISSP\
  \ 考试题型\n\nCISSP 考试中的大多数题目为四选项单选题，仅有一个正确答案。部分题目较为直接，如要求选择定义。部分稍复杂，要求选择恰当的概念或最佳实践。还有一些题目会呈现场景或情境，要求选择最佳应对措施。示例如下：\n\
  \n1.  安全解决方案最重要的目标和首要任务是什么？\n    1.  防止泄露\n    2.  保持完整性\n    3.  维护人身安全\n    4.\
  \  维持可用性\n\n你必须选择唯一正确或最佳的答案并标记。在某些情况下，正确答案对你来说显而易见。在其他情况下，多个答案可能看似正确。此时，你必须针对所提问题选择最佳答案。注意观察答案选项中的概括性、特定性、普遍性、超集与子集关系。在另一些情况下，所有答案似乎都不正确。此时，你需要选择最不错误的答案。\n\
  \n除了标准单选题格式外，(ISC)² 还增加了几种高级题型，称为 `advanced innovative questions`（高级创新题型）。这些包括拖放题和热点题。这些题型要求你按操作顺序、优先级偏好或针对所需解决方案的正确定位，对主题或概念进行排序。具体而言，拖放题要求考生移动标签或图标以标记图像上的项目。热点题要求考生用十字准星标记图像上的特定位置。这些题型概念易于理解和操作，但请注意拖放或标记的准确性。\n\
  \n# 参加考试的建议\n\nCISSP 考试包含两个关键要素。首先，你需要掌握八大域的知识。其次，你必须具备良好的应试技巧。你最多有 3 小时时间在最多 150\
  \ 道题中达到通过标准。因此，平均每道题仅略多于一分钟。因此，快速作答很重要，但切勿匆忙，也不要浪费时间。\n\n根据 (ISC)² 对 CISSP-CAT 形式的描述，蒙题在所有情况下是否为好策略尚不明确，但似乎比跳过题目要好。我们建议你在蒙题前尽量排除尽可能多的选项，仅在无法排除任何选项时才考虑跳过题目而非随机猜测。从缩减后的选项中做出有根据的猜测，以增加答对的几率。\n\
  \n另请注意，(ISC)² 未披露多部分题目若仅答对部分要素是否给予部分分数。因此，请留意带有复选框而非单选按钮的题目，并务必选择所有必要的项目以妥善回答问题。\n\
  \n你将获得一块可擦写板和一支记号笔用于记录思路和做笔记。但板上书写的内容不会用于调整分数。且考试结束前必须将板子归还给考试管理员。\n\n为最大化应试效果，以下是一些通用指导原则：\n\
  \n*   先读题，再读选项，然后重读题目。\n*   先排除错误答案，再选择正确答案。\n*   警惕双重否定。\n*   确保理解问题在问什么。\n\n管理好时间。考试期间可休息，但这可能会消耗考试时间。你可以考虑自带饮料和零食，但食物和饮料会存放在离考场较远的地方，休息时间会计入考试时限。务必携带所需药品或其他必需品，但将所有电子设备留在家中或车内。避免佩戴任何腕部物品，包括手表、健身追踪器和首饰。不允许携带任何形式的降噪耳机或耳塞，但可使用泡沫耳塞。我们还建议穿着舒适的衣物并携带一件薄外套（部分考场温度较低）。\n\
  \n如果英语非你的母语，你可以报考其他语言版本的考试。或者，如果你选择使用英语版，允许使用翻译字典。（请务必提前联系考场安排此事。）你必须能证明自己需要此类字典；通常可通过出生证明或护照来证明。\n\
  \n# 学习与考试准备技巧\n\n我们建议为 CISSP 考试规划一个月左右的夜间强化学习时间。以下是一些最大化学习效果的建议；你可根据自己的学习习惯进行调整：\n\
  \n\n\n\n\n# 学习建议\n\n*   花一两个晚上阅读本书的每一章并完成其复习材料。\n*   回答所有复习问题并参加书中和测试引擎提供的模拟考试。完成每章的书面实验，并利用每章的复习问题来帮助你确定需要更多学习或花更多时间钻研关键概念和策略的主题。\n\
  *   复习 (ISC)² 的考试大纲：[www.isc2.org](http://www.isc2.org)。\n*   使用学习工具附带的闪存卡来加强你对概念的理解。\n\
  \n## 完成认证流程\n\n一旦你收到通知，告知你已成功通过 CISSP 认证考试，在你真正获得 CISSP 认证之前还有一个最后的步骤。该步骤称为**背书**。基本上，这需要一位持有\
  \ CISSP 或其他 (ISC)² 认证、信誉良好且熟悉你工作经历的人代表你提交背书表格。背书表格可通过通知你通过考试的邮件访问。背书人必须审查你的简历，确保你在八个\
  \ CISSP 领域拥有足够的经验，然后将签名表格以数字形式或通过传真/邮政邮寄提交给 (ISC)²。你必须在收到通过确认邮件后的 90 天内向 (ISC)²\
  \ 提交背书文件。一旦 (ISC)² 收到你的背书表格，认证流程将完成，你将通过 USPS 收到欢迎包。\n\n## CISSP 专业方向\n\n(ISC)²\
  \ 仅向 CISSP 持证人提供三个专业方向。(ISC)² 将 CISSP 考试中引入的概念聚焦于特定领域，即架构、管理和工程。这三个专业方向如下：\n\n**信息系统安全架构专家\
  \ (ISSAP)** 面向专注于信息安全架构的人员。涵盖的关键领域包括访问控制系统和方法论；密码学；物理安全集成；需求分析以及安全标准、指南和准则；业务连续性规划和灾难恢复规划的技术相关方面；以及电信和网络安全。这是为设计安全系统或基础设施，或审计和分析此类结构的人员准备的凭证。\n\
  \n**信息系统安全管理专家 (ISSMP)** 面向专注于信息安全策略、实践、原则和程序管理的人员。涵盖的关键领域包括企业安全管理实践；企业级系统开发安全；法律、调查、取证和伦理；运营安全合规监督；以及理解业务连续性规划、灾难恢复规划和运营连续性规划。这是为负责安全基础设施的专业人员准备的凭证，特别是在强制合规发挥作用的场景中。\n\
  \n**信息系统安全工程专家 (ISSEP)** 面向专注于安全硬件和软件信息系统、组件或应用的设计与工程的人员。涵盖的关键领域包括认证和授权、系统安全工程、技术管理，以及美国政府信息保障规则和法规。大多数\
  \ ISSEP 为美国政府或管理政府安全许可的政府承包商工作。\n\n有关这些专业方向考试和认证的更多详细信息，请访问 (ISC)² 网站：[www.isc2.org](http://www.isc2.org)。\n\
  \n## 本书组织说明\n\n本书旨在以足够的深度涵盖八个 CISSP 通用知识体系 (CBK) 领域，为你提供清晰的理解。本书主体包含 21 章。领域/章节细分如下：\n\
  \n*   第 1、2、3、4 章：安全与风险管理\n*   第 5 章：资产安全\n*   第 6、7、8、9、10 章：安全架构与工程\n*   第 11、12\
  \ 章：通信与网络安全\n*   第 13、14 章：身份与访问管理 (IAM)\n*   第 15 章：安全评估与测试\n*   第 16、17、18、19\
  \ 章：安全运营\n*   第 20、21 章：软件开发安全\n\n每章都包含帮助你集中学习和测试知识的要素，详见以下各节。注意：请参阅目录和章节介绍，了解每章涵盖的领域主题详细列表。\n\
  \n### 本学习指南的要素\n\n阅读本学习指南时，你会看到许多反复出现的要素。以下是其中一些要素的说明：\n\n**考试要点** 考试要点强调了可能以某种形式出现在考试中的主题。虽然我们显然不知道特定考试中确切会包含什么内容，但本节强化了理解通用知识体系\
  \ (CBK) 领域和 CISSP 考试规范的关键重要概念。\n\n**章节复习问题** 每章包含旨在衡量你对章节中讨论的关键思想掌握程度的练习题。读完每章后，请回答这些问题；如果某些答案不正确，则表明你需要花更多时间学习相应主题。练习题的答案位于每章末尾。\n\
  \n**书面实验** 每章包含综合该章出现的各种概念和主题的书面实验。这些实验提出的问题旨在帮助你将章节中单独遇到的各个拼图拼凑起来，以提出或描述潜在的安全策略或解决方案。\n\
  \n**真实场景** 在学习每章的过程中，你会发现典型且合理的工作场景描述，在这些场景中，理解与章节内容相关的安全策略和方法可能在解决问题或防范潜在困难方面发挥作用。这让读者有机会了解特定的安全策略、指南或实践应如何或可能应用于工作场所。\n\
  \n**总结** 总结是对章节的简要回顾，概括了所涵盖的内容。\n\n### 附加学习工具包含的内容\n\n本书读者可以访问多种附加学习工具。我们努力提供一些必要的工具来帮助你完成认证过程。学习备考时，以下所有装备都应加载到你的工作站上。\n\
  \n#### Sybex 考试准备软件\n\n由 Sybex 专家制作的考试准备软件可帮助你备考 CISSP 考试。在该测试引擎中，你将找到书中的所有复习和评估问题，以及学习工具附带的额外奖励模拟考试。你可以参加评估测试、按章测试自己、参加模拟考试，或参加包含所有问题的随机生成考试。\n\
  \n#### 电子闪存卡\n\nSybex 的电子闪存卡包含数百个问题，旨在进一步挑战你应对 CISSP 考试。结合复习问题、模拟考试和闪存卡，你将拥有充足的考试练习！\n\
  \n#### PDF 格式术语表\n\nSybex 提供 PDF 格式的健全术语表。这份综合术语表以可搜索的格式包含了你应为 CISSP 理解的所有关键术语。\n\
  \n#### 奖励模拟考试\n\n\n\n\n\n# Sybex 赠送的模拟练习考试\n\nSybex 包含赠送的模拟练习考试，每套试题旨在考察您对 CISSP\
  \ CBK（通用知识体系）关键要素的理解。本书提供六套赠送考试，每套包含 150 道题目，以匹配真实考试可能的最长长度。这些考试可在 [`www.wiley.com/go/sybextestprep`](http://sybextestbanks.wiley.com)\
  \ 以数字形式获取。\n\n## 如何使用本书的学习工具\n\n本书具有多项功能，旨在指导您为 CISSP 认证考试的学习工作。它通过在每章开头列出本章涵盖的\
  \ CISSP 通用知识体系领域主题，并确保每个主题在章节内得到充分讨论，来为您提供帮助。每章末尾的复习题和模拟考试旨在测试您对所读材料的掌握程度，以确保您了解需要花费额外学习时间的领域。以下是使用本书和学习工具（位于\
  \ [www.wiley.com/go/cissptestprep](http://sybextestbanks.wiley.com)）的一些建议：\n\n*\
  \   在开始阅读材料前参加评估测试。这将让您了解需要在哪些领域花费额外学习时间，以及哪些领域可能只需要简要复习。\n*   阅读完每章后回答复习题；如果答错任何题目，请返回该章复习该主题，或在需要更多信息时利用额外资源。\n\
  *   将闪存卡下载到您的移动设备，在白天有几分钟空闲时复习它们。\n*   抓住一切机会测试自己。除了评估测试和复习题外，随附的额外学习工具中还包含赠送的模拟练习考试。在不参考章节内容的情况下参加这些考试，看看您的表现如何——返回复习您错过的任何主题，直到您完全理解并能应用这些概念。\n\
