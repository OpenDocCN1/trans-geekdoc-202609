  15. 要在 10 个参与者中完全实现对称算法，需要多少个密钥？\n\n    1.  10\n    2.  20\n    3.  45\n    4. \
  \ 100\n\n16. **高级加密标准** 使用的分组大小是多少？\n\n    1.  32 位\n    2.  64 位\n    3.  128 位\n\
  \    4.  可变\n\n17. 哪种攻击使 **凯撒密码** 实际上变得不可用？\n\n    1.  中间相遇攻击\n    2.  托管攻击\n  \
  \  3.  频率分析攻击\n    4.  置换攻击\n\n18. 哪种密码系统通常使用知名书籍中的一段作为加密密钥？\n\n    1.  Vernam 密码\n\
  \    2.  运行密钥密码\n    3.  Skipjack 密码\n    4.  Twofish 密码\n\n19. 哪个 **AES** 入围算法使用了预白化和后白化技术？\n\
  \n    1.  Rijndael\n    2.  Twofish\n    3.  Blowfish\n    4.  Skipjack\n\n20. 要在\
  \ 10 个参与者中完全实现非对称算法，需要多少个加密密钥？\n\n    1.  10\n    2.  20\n    3.  45\n    4.  100\n\
  \n## 第 7 章：PKI 和加密应用\n\n## 本章涵盖的 CISSP 考试主题包括：\n\n*   **领域 3：安全架构与工程**\n\n    *\
  \   3.9 应用密码学\n        *   3.9.1 密码生命周期（如密钥管理、算法选择）\n        *   3.9.2 密码方法\n  \
  \      *   3.9.3 公钥基础设施 (PKI)\n        *   3.9.4 密钥管理实践\n        *   3.9.5 数字签名\n\
  \        *   3.9.6 不可否认性\n        *   3.9.7 完整性\n        *   3.9.8 理解密码分析攻击方法\n\
  \        *   3.9.9 数字版权管理 (DRM)\n\n\n\n\n\n![images](img/clogo.jpg) 在第 6 章“密码学与对称密钥算法”中，我们介绍了基本的密码学概念，并探讨了多种私钥密码体制。这些对称密码体制提供了快速、安全的通信，但也带来了先前无关联的各方之间密钥交换的重大挑战。\n\
  \n本章将探讨非对称（或公钥）密码学的世界，以及支持全球各方之间安全通信的公钥基础设施（`PKI`），这些各方在通信前不一定相互认识。非对称算法提供了便捷的密钥交换机制，且可扩展至极大数量的用户，这两点都是对称密码体制用户面临的挑战。\n\
  \n本章还探讨了非对称密码学的几个实际应用：保护电子邮件、Web 通信、电子商务、数字版权管理和网络。本章最后将考察恶意个人可能用来攻破弱密码体制的各种攻击手段。\n\
  \n### 非对称密码学\n\n第 6 章中的“现代密码学”部分介绍了私钥（对称）和公钥（非对称）密码学背后的基本原理。您了解到，对称密钥密码体制要求通信双方拥有相同的共享密钥，从而产生了安全密钥分发的问题。您还了解到，非对称密码体制通过使用公钥和私钥对来促进安全通信，避免了复杂密钥分发系统的开销，从而绕过了这一障碍。这些系统的安全性依赖于逆转单向函数的难度。\n\
  \n在以下章节中，我们将更详细地探讨公钥密码学的概念，并了解当今使用的三种较常见的公钥密码体制：Rivest–Shamir–Adleman（`RSA`）、El\
  \ Gamal 和椭圆曲线密码学（`ECC`）。\n\n#### 公钥和私钥\n\n回顾第 6 章可知，`公钥密码体制` 依赖于分配给密码体制每个用户的一对密钥。每个用户都维护一个公钥和一个私钥。顾名思义，公钥密码体制用户将其公钥免费提供给任何他们想要通信的人。第三方仅持有公钥并不会给密码体制带来任何弱点。另一方面，私钥仅供拥有密钥的个人单独使用。它绝不与任何其他密码体制用户共享。\n\
  \n公钥密码体制用户之间的正常通信非常简单直接。图 7.1 展示了通用流程。\n\n![FIGURE 7.1 Asymmetric key cryptography\
  \ ](img/c07f001.jpg)\n\n**图 7.1** 非对称密钥密码学\n\n请注意，该过程不需要共享私钥。发送方使用接收方的公钥加密明文消息（`P`）以创建密文消息（`C`）。当接收方打开密文消息时，他们使用自己的私钥对其进行解密，以重新创建原始明文消息。\n\
  \n一旦发送方使用接收方的公钥加密了消息，如果不知道接收方的私钥（用于生成消息的公私钥对的另一半），任何用户（包括发送方）都无法解密该消息。这就是公钥密码学的精妙之处——公钥可以通过不安全的通信自由共享，然后用于在先前互不相识的用户之间创建安全通信通道。\n\
  \n您在上一章中还了解到，公钥密码学涉及更高程度的计算复杂性。公钥系统中使用的密钥必须比私钥系统中使用的密钥更长，才能产生具有同等强度的密码体制。\n\n####\
  \ RSA\n\n最著名的公钥密码体制以其创建者的名字命名。1977 年，Ronald Rivest、Adi Shamir 和 Leonard Adleman\
  \ 提出了 `RSA 公钥算法`，该算法至今仍是全球标准。他们为该算法申请了专利，并成立了一个名为 RSA Security 的商业企业，以开发其安全技术的主流实现。如今，RSA\
  \ 算法已发布到公共领域，并被广泛用于安全通信。\n\nRSA 算法依赖于分解大素数所固有的计算难度。密码体制的每个用户都使用以下步骤中描述的算法生成一对公钥和私钥：\n\
  \n1.  选择两个大素数（每个约 200 位），标记为 `p` 和 `q`。\n\n2.  计算这两个数的乘积：`n = p * q`。\n\n3.  选择一个数\
  \ `e`，满足以下两个要求：\n\n    1.  `e` 小于 `n`。\n\n    2.  `e` 和 `(p – 1)(q – 1)` 互质——即这两个数除了\
  \ 1 之外没有其他公因数。\n\n4.  找到一个数 `d`，使得 `(ed – 1) mod (p – 1)(q – 1) = 1`。\n\n5.  将 `e`\
  \ 和 `n` 作为公钥分发给所有密码体制用户。保密 `d` 作为私钥。\n\n如果 Alice 想要向 Bob 发送加密消息，她会使用以下公式从明文（`P`）生成密文（`C`）（其中\
  \ `e` 是 Bob 的公钥，`n` 是密钥生成过程中创建的 `p` 和 `q` 的乘积）：\n\n```\nC = Pe mod n\n```\n\n当 Bob\
  \ 收到消息时，他执行以下计算以检索明文消息：\n\n```\nP = Cd mod n\n```\n\n#### El Gamal\n\n在第 6 章中，您了解了\
  \ Diffie–Hellman 算法如何利用大整数和模运算，促进在不安全通信信道上安全交换密钥。1985 年，T. El Gamal 博士发表了一篇文章，描述了如何将\
  \ Diffie–Hellman 密钥交换算法背后的数学原理扩展为支持用于加密和解密消息的完整公钥密码体制。\n\n在发布时，El Gamal 相对于 RSA\
  \ 算法的主要优势之一是它被发布到了公共领域。El Gamal 博士没有为其对 Diffie-Hellman 的扩展申请专利，因此它可自由使用，这与当时已获专利的\
  \ RSA 技术不同。（RSA 于 2000 年将其算法发布到了公共领域。）\n\n然而，El Gamal 也有一个主要缺点——该算法会使其加密的任何消息长度加倍。在加密长消息或将通过窄带宽通信线路传输的数据时，这构成了一个主要困难。\n\
  \n#### 椭圆曲线\n\n同样在 1985 年，两位数学家——来自华盛顿大学的 Neal Koblitz 和来自 IBM 的 Victor Miller——独立提出了将\
  \ `椭圆曲线密码学`（`ECC`）理论应用于开发安全密码系统。\n\n任何椭圆曲线都可以由以下方程定义：\n\n```\ny2 = x3 + ax + b\n\
  ```\n\n在该方程中，`x`、`y`、`a` 和 `b` 均为实数。每条椭圆曲线都有一个对应的 `椭圆曲线群`，由椭圆曲线上的点以及位于无穷远处的点 `O`\
  \ 组成。同一椭圆曲线群内的两个点（`P` 和 `Q`）可以通过椭圆曲线加法算法相加。该运算非常简单地表示如下：\n\n```\nP + Q\n```\n\n\
  通过假设 `Q` 是 `P` 的倍数，即以下情况，可以将此问题扩展为涉及乘法：\n\n```\nQ = xP\n```\n\n\n\n\n计算机科学家和数学家认为，即使已知\
  \ *P* 和 *Q*，找到 *x* 也极其困难。这个被称为椭圆曲线离散对数问题的难题，构成了椭圆曲线密码学的基础。人们普遍认为，该问题比 RSA 密码系统所依赖的大整数分解难题，以及\
  \ Diffie-Hellman 和 El Gamal 所利用的标准离散对数问题更难求解。侧边栏“密钥长度的重要性”中的表格数据直观地说明了这一点：1,024\
  \ 位的 RSA 密钥在密码学强度上等同于 160 位的椭圆曲线密码系统密钥。\n\n### 哈希函数\n\n本章后面将介绍密码系统如何实现数字签名，以证明消息源自特定用户，并确保消息在双方传输过程中未被篡改。在完全理解该概念之前，我们必须先解释*哈希函数*的概念。我们将探讨哈希函数的基础知识，并了解现代数字签名算法中使用的几种常见哈希函数。\n\
  \n哈希函数的目的非常简单——它们接收一个可能很长的消息，并根据消息内容生成一个唯一的输出值。该值通常称为*消息摘要*。消息发送者可以生成消息摘要，并将其与完整消息一起传输给接收者，主要出于以下两个原因。\n\
  \n首先，接收者可以使用相同的哈希函数，从完整消息中重新计算消息摘要。然后将计算出的摘要与传输的摘要进行比较，以确保发送者发送的消息与接收者收到的消息完全一致。如果两个摘要不匹配，则意味着消息在传输过程中被篡改。重要的是，消息必须*完全*相同，摘要才会匹配。如果消息在空格、标点或内容上哪怕只有细微差别，摘要值也会完全不同。无法通过比较摘要来判断两条消息的差异程度。即使是微小的差异，也会生成完全不同的摘要值。\n\
  \n其次，消息摘要可用于实现数字签名算法。本章后面的“数字签名”部分将介绍这一概念。\n\n在大多数情况下，消息摘要为 128 位或更长。不过，单个数字值可用于执行奇偶校验功能，这是一种低级的或单数字的校验和值，用于提供单个验证点。在大多数情况下，消息摘要越长，其完整性验证就越可靠。\n\
  \n根据 RSA Security 的说法，加密哈希函数有五项基本要求：\n\n*   输入可以是任意长度。\n*   输出具有固定长度。\n*   对于任何输入，哈希函数计算相对容易。\n\
  *   哈希函数是单向的（即在给定输出的情况下，极难确定输入）。单向函数及其在密码学中的用途将在第 6 章中介绍。\n*   哈希函数无冲突（即极难找到产生相同哈希值的两条消息）。\n\
  \n在以下章节中，我们将介绍四种常见的哈希算法：安全哈希算法（SHA）、消息摘要算法 2（MD2）、消息摘要算法 4（MD4）和消息摘要算法 5（MD5）。本章后面还将讨论基于哈希的消息认证码（HMAC）。\n\
  \n#### SHA\n\n安全哈希算法（SHA）及其后继者 SHA-1、SHA-2 和 SHA-3，是由美国国家标准与技术研究院（NIST）推广的政府标准哈希函数，并在一份官方政府出版物——安全哈希标准（SHS），也称为联邦信息处理标准（FIPS）180\
  \ 中规定。\n\nSHA-1 接受几乎任意长度的输入（实际上，该算法的上限约为 2,097,152 TB），并生成 160 位的消息摘要。SHA-1 算法以\
  \ 512 位分块处理消息。因此，如果消息长度不是 512 的倍数，SHA 算法会用额外数据填充消息，直到长度达到下一个 512 的倍数。\n\n密码分析攻击表明\
  \ SHA-1 算法存在弱点。这促使了 SHA-2 的诞生，SHA-2 有四个变体：\n\n*   SHA-256 使用 512 位分块大小，生成 256 位消息摘要。\n\
  *   SHA-224 使用 SHA-256 哈希的截断版本，配合 512 位分块大小，生成 224 位消息摘要。\n*   SHA-512 使用 1,024\
  \ 位分块大小，生成 512 位消息摘要。\n*   SHA-384 使用 SHA-512 哈希的截断版本，配合 1,024 位分块大小，生成 384 位摘要。\n\
  \n密码学界普遍认为 SHA-2 算法是安全的，但它们理论上存在与 SHA-1 相同的弱点。2015 年，联邦政府发布了 Keccak 算法作为 SHA-3 标准。SHA-3\
  \ 套件的开发旨在作为 SHA-2 哈希函数的直接替代品，使用更安全的算法提供相同的变体和哈希长度。\n\n#### MD2\n\n消息摘要算法 2（MD2）由\
  \ Ronald Rivest（RSA 中的 Rivest）于 1989 年开发，旨在为 8 位处理器提供安全的哈希函数。MD2 对消息进行填充，使其长度成为\
  \ 16 字节的倍数。然后计算一个 16 字节的校验和并将其追加到消息末尾。最后使用原始消息连同追加的校验和生成 128 位消息摘要。\n\n针对 MD2 算法存在密码分析攻击。具体而言，Nathalie\
  \ Rogier 和 Pascal Chauvaud 发现，如果在摘要计算前未将校验和追加到消息中，可能会发生冲突。Frederic Mueller 后来证明\
  \ MD2 不是单向函数。因此，不应再使用该算法。\n\n#### MD4\n\n1990 年，Rivest 改进了其消息摘要算法以支持 32 位处理器并提高安全级别。该增强算法称为\
  \ MD4。它首先填充消息，确保消息长度比 512 位的倍数小 64 位。例如，16 位消息将填充 432 位额外数据，使其成为 448 位，比 512 位消息小\
  \ 64 位。\n\nMD4 算法随后在三轮计算中处理消息的 512 位分块。最终输出为 128 位消息摘要。\n\n多位数学家发表论文记录了完整版 MD4 以及错误实现的\
  \ MD4 存在的缺陷。特别是 Hans Dobbertin 于 1996 年发表论文，阐述了如何利用现代个人电脑在一分钟内找到 MD4 摘要的冲突。因此，MD4\
  \ 不再被视为安全的哈希算法，如果可能，应避免使用。\n\n#### MD5\n\n1991 年，Rivest 发布了其消息摘要算法的下一个版本，称为 MD5。它同样处理消息的\
  \ 512 位分块，但使用四轮不同的计算生成摘要，长度与 MD2 和 MD4 相同（128 位）。MD5 的填充要求与 MD4 相同——消息长度必须比 512\
  \ 位的倍数少 64 位。\n\n\n\n\n### MD5 安全局限性\n\nMD5 实现了额外的安全特性，但会显著降低消息摘要的生成速度。不幸的是，最近的密码分析攻击表明\
  \ MD5 协议容易发生碰撞，这使其无法用于确保消息完整性。具体而言，Arjen Lenstra 等人在 2005 年证明了可以从不同的公钥创建两个具有相同 MD5\
  \ 哈希值的数字证书。\n\n表 7.1 列出了知名的哈希算法及其生成的哈希值长度（以位为单位）。请标记此页以便记忆。\n\n#### 表 7.1：哈希算法记忆图表\n\
  \n| 名称 | 哈希值长度 |\n| :--- | :--- |\n| 可变长度哈希值 (HAVAL) —— 一种 MD5 变体 | 128、160、192、224\
  \ 和 256 位 |\n| 哈希消息认证码 (HMAC) | 可变 |\n| 消息摘要 2 (MD2) | 128 |\n| 消息摘要 4 (MD4) | 128\
  \ |\n| 消息摘要 5 (MD5) | 128 |\n| 安全哈希算法 (SHA-1) | 160 |\n| SHA2-224/SHA3-224 | 224\
  \ |\n| SHA2-256/SHA3-256 | 256 |\n| SHA2-384/SHA3-384 | 384 |\n| SHA2-512/SHA3-512\
  \ | 512 |\n\n### 数字签名\n\n一旦你选择了一个密码学上可靠的哈希算法，就可以用它来实现*数字签名*系统。数字签名基础设施有两个不同的目标：\n\
  \n*   数字签名消息向接收者保证消息确实来自声称的发送者。它们强制执行**不可抵赖性**（即防止发送者事后声称消息是伪造的）。\n*   数字签名消息向接收者保证消息在发送者和接收者之间传输时未被篡改。这可以防止恶意修改（第三方更改消息含义）和无意修改（由于通信过程中的故障，如电气干扰）。\n\
  \n数字签名算法依赖于本章已介绍的两个主要概念的组合——公钥密码学和哈希函数。\n\n如果 Alice 想要对发送给 Bob 的消息进行数字签名，她会执行以下操作：\n\
  \n1.  Alice 使用一种密码学上可靠的哈希算法（如 `SHA3-512`）生成原始明文消息的消息摘要。\n2.  Alice 然后仅使用她的私钥加密该消息摘要。这个加密后的消息摘要就是数字签名。\n\
  3.  Alice 将签名后的消息摘要附加到明文消息后。\n4.  Alice 将附加后的消息发送给 Bob。\n\n当 Bob 接收到数字签名消息时，他会反向执行该过程，步骤如下：\n\
  \n1.  Bob 使用 Alice 的公钥解密数字签名。\n2.  Bob 使用相同的哈希函数基于从 Alice 接收到的完整明文消息创建一个消息摘要。\n\
  3.  Bob 然后将从 Alice 处收到的解密后的消息摘要与他自己计算的消息摘要进行比较。如果两个摘要匹配，他可以确信收到的消息是由 Alice 发送的。如果不匹配，则消息不是由\
  \ Alice 发送的，或者消息在传输过程中被修改过。\n\n请注意，数字签名过程本身并不提供任何保密性。它仅确保满足完整性、认证和不可抵赖性这些密码学目标。然而，如果\
  \ Alice 想要确保她发给 Bob 的消息的保密性，她可以在消息创建过程中增加一个步骤。在将签名后的消息摘要附加到明文消息后，Alice 可以使用 Bob\
  \ 的公钥加密整个消息。当 Bob 收到消息时，他会先用自己的私钥解密，然后再执行上述步骤。\n\n#### HMAC\n\n哈希消息认证码 (HMAC) 算法实现了一种部分数字签名——它保证消息在传输过程中的完整性，但不提供不可抵赖性。\n\
  \nHMAC 可以通过使用共享密钥与任何标准消息摘要生成算法（如 `SHA-3`）结合使用。因此，只有知道该密钥的通信双方才能生成或验证数字签名。如果接收者解密消息摘要但无法将其与从明文消息生成的消息摘要成功比较，则意味着消息在传输过程中被篡改了。\n\
  \n因为 HMAC 依赖于共享密钥，所以它不提供任何不可抵赖性功能（如前所述）。然而，它的运行效率比下一节描述的数字签名标准更高，可能适用于对称密钥密码学适用的场景。简而言之，它代表了未加密使用消息摘要算法与基于公钥密码学的计算成本高昂的数字签名算法之间的一个折中点。\n\
  \n#### 数字签名标准\n\n美国国家标准与技术研究院在联邦信息处理标准 (FIPS) 186-4 中规定了联邦政府可用的数字签名算法，该标准也称为数字签名标准\
  \ (DSS)。该文档规定，所有联邦批准的数字签名算法必须使用 SHA-3 哈希函数。\n\nDSS 还规定了可用于支持数字签名基础设施的加密算法。目前有三种批准的标准加密算法：\n\
  \n*   FIPS 186-4 中规定的数字签名算法 (DSA)\n*   ANSI X9.31 中规定的 Rivest–Shamir–Adleman (RSA)\
  \ 算法\n*   ANSI X9.62 中规定的椭圆曲线 DSA (ECDSA)\n\n### 公钥基础设施\n\n公钥加密的主要优势在于其能够促进相互未知的各方之间的通信。这得益于*公钥基础设施\
  \ (PKI)* 信任关系层级。这些信任关系允许将非对称密码学与对称密码学相结合，并配合哈希和数字证书，从而实现混合密码学。\n\n在以下章节中，你将学习公钥基础设施的基本组件以及使全球安全通信成为可能的密码学概念。你将了解数字证书的组成、证书颁发机构的角色，以及生成和销毁证书的过程。\n\
  \n#### 证书\n\n数字*证书*为通信双方提供保证，确认他们正在通信的人确实是他们声称的那个人。数字证书本质上是个人公钥的背书副本。当用户验证证书是由受信任的证书颁发机构\
  \ (CA) 签名时，他们就知道该公钥是合法的。\n\n数字证书包含特定的标识信息，其构建遵循一项国际标准——X.509。符合 X.509 标准的证书包含以下数据：\n\
  \n*   证书遵循的 X.509 版本\n*   序列号（来自证书创建者）\n*   签名算法标识符（指定证书颁发机构用于对证书内容进行数字签名的技术）\n\
  *   颁发者名称（颁发证书的证书颁发机构的标识）\n*   有效期（指定证书有效期间的日期和时间——开始日期/时间和结束日期/时间）\n*   主体名称（包含拥有证书中公钥的实体的可分辨名称，即\
  \ DN）\n*   主体公钥（证书的核心——证书所有者用于建立安全通信的实际公钥）\n\n当前版本的 X.509（版本 3）支持证书扩展——由证书颁发机构插入证书中以支持证书跟踪或各种应用的包含数据的自定义变量。\n\
  \n#### 证书颁发机构\n\n\n\n\n\n### 证书颁发机构和 PKI\n\n*证书颁发机构*（CAs）是将公钥基础设施粘合在一起的关键。这些中立组织为数字证书提供公证服务。要从信誉良好的\
  \ CA 获得数字证书，您必须向 CA 证明您的身份，令其满意。以下列表包含一些提供广泛接受的数字证书的主要 CA：\n\n*   Symantec\n*  \
  \ IdenTrust\n*   Amazon Web Services\n*   GlobalSign\n*   Comodo\n*   Certum\n*\
  \   GoDaddy\n*   DigiCert\n*   Secom\n*   Entrust\n*   Actalis\n*   Trustwave\n\n\
  没有任何东西能阻止任何组织直接开张当 CA。然而，CA 颁发的证书只有在该 CA 受到信任的情况下才可靠。当从第三方接收数字证书时，这是一个需要考虑的重要事项。如果您不认识也不信任颁发证书的\
  \ CA 的名称，则完全不应信任该证书。PKI 依赖于信任关系的层级结构。如果您将浏览器配置为信任某个 CA，它将自动信任该 CA 颁发的所有数字证书。浏览器开发商预先将浏览器配置为信任主要\
  \ CA，以避免将此负担强加给用户。\n\n*注册机构*（RAs）协助 CA 在颁发数字证书之前验证用户身份的负担。它们不直接颁发证书，但在认证过程中发挥着重要作用，允许\
  \ CA 远程验证用户身份。\n\n#### 证书生成和销毁\n\n公钥基础设施背后的技术概念相对简单。在以下章节中，我们将介绍证书颁发机构用于创建、验证和撤销客户端证书的过程。\n\
  \n##### 注册\n\n当您想要获取数字证书时，首先必须以某种方式向 CA 证明您的身份；这个过程称为*注册*。如前一节所述，这有时涉及携带适当的身份证明文件亲自出现在认证机构代理人面前。一些证书颁发机构提供其他验证方式，包括使用信用报告数据和由受信任的社区领袖进行身份验证。\n\
  \n一旦您让证书颁发机构对您的身份感到满意，您就向他们提供您的公钥。CA 接下来创建一个包含您身份信息和公钥副本的 X.509 数字证书。然后，CA 使用 CA\
  \ 的私钥对证书进行数字签名，并向您提供一份已签名的数字证书副本。然后，您可以安全地将此证书分发给任何您想要安全通信的人。\n\n##### 验证\n\n当您收到某人提供的数字证书并想与其通信时，您可以通过使用\
  \ CA 的公钥检查 CA 的数字签名来*验证*该证书。接下来，您必须检查并确保该证书未被撤销，方法是使用*证书吊销列表*（CRL）或*在线证书状态协议 (OCSP)*。此时，如果满足以下要求，您可以假设证书中列出的公钥是真实的：\n\
  \n*   CA 的数字签名是真实的。\n*   您信任该 CA。\n*   该证书未列在 CRL 上。\n*   证书实际包含您所信任的数据。\n\n最后一点是一个微妙但极其重要的项目。在您信任关于某人的身份识别信息之前，请确保它实际包含在证书内。如果证书包含电子邮件地址（`billjones@foo.com`）但不包含个人姓名，您只能确定其中包含的公钥与该电子邮件地址相关联。CA\
  \ 对 `billjones@foo.com` 电子邮件账户的实际身份不做任何断言。但是，如果证书包含姓名 Bill Jones 以及地址和电话号码，CA 也在为该信息担保。\n\
  \n数字证书验证算法内置于许多流行的 Web 浏览和电子邮件客户端中，因此您通常不需要深入了解该过程的细节。然而，对幕后发生的技术细节有扎实的理解对于为您的组织做出适当的安全判断非常重要。这也是为什么在购买证书时，您要选择一个广受信任的\
  \ CA。如果一个 CA 不在主流浏览器信任的 CA 列表中，或稍后被从中移除，将极大地限制您证书的用处。\n\n2017 年，数字证书行业发生了一起重大安全故障。Symantec\
  \ 通过一系列关联公司颁发了几个不符合行业安全标准的数字证书。作为回应，Google 宣布 Chrome 浏览器将不再信任 Symantec 证书。结果，Symantec\
  \ 最终将其证书颁发业务出售给了 DigiCert，后者同意在颁发前妥善验证证书。这证明了妥善验证证书请求的重要性。一系列看似微小的程序疏忽可能会摧毁一个 CA\
  \ 的业务！\n\n##### 撤销\n\n有时，证书颁发机构需要*撤销*证书。这可能由于以下原因之一发生：\n\n*   证书被泄露（例如，证书所有者意外泄露了私钥）。\n\
  *   证书被错误颁发（例如，CA 在未进行适当验证的情况下错误地颁发了证书）。\n*   证书详细信息发生变更（例如，主体名称已更改）。\n*   安全关联发生变更（例如，主体不再受雇于赞助该证书的组织）。\n\
  \n您可以使用两种技术来验证证书的真实性并识别已撤销的证书：\n\n###### 证书吊销列表\n\n证书吊销列表（CRL）由各个证书颁发机构维护，包含已由 CA\
  \ 颁发并已被撤销的证书的序列号，以及撤销生效的日期和时间。证书吊销列表的主要缺点是必须定期下载和交叉引用，这在证书被撤销的时间和最终用户收到撤销通知的时间之间引入了一段延迟期。然而，CRL\
  \ 仍然是目前最常用的检查证书状态的方法。\n\n###### 在线证书状态协议 (OCSP)\n\n该协议通过提供实时证书验证的手段，消除了使用证书吊销列表固有的延迟。当客户端收到证书时，它向\
  \ CA 的 OCSP 服务器发送 OCSP 请求。服务器随后响应有效、无效或未知的状态。\n\n### 非对称密钥管理\n\n在公钥基础设施中工作时，遵守若干最佳实践要求以维护通信安全非常重要。\n\
  \n首先，明智地选择您的加密系统。正如您之前所学，“通过隐匿实现安全”不是一种合适的方法。选择一种算法处于公共领域且已由行业专家彻底审查的加密系统。警惕那些使用“黑盒”方法并坚持其算法的保密性对密码系统的完整性至关重要的系统。\n\
  \n\n\n\n\n### 密钥管理最佳实践\n\n您还必须以适当的方式选择密钥。使用一种在安全需求与性能考量之间取得平衡的密钥长度。此外，确保您的密钥真正随机。密钥中的任何模式都会增加攻击者破解您加密的可能性，并降低密码系统的安全性。\n\
  \n使用公钥加密时，请务必保管好您的私钥！在任何情况下，都不允许其他人访问您的私钥。请记住，即使仅允许他人访问一次，也会永久性地危害使用该密钥进行的所有通信（过去、现在或未来）的安全，并允许第三方成功冒充您。\n\
  \n在密钥完成其使用寿命后将其弃用。许多组织都有强制性的密钥轮换要求，以防止未被发现的密钥泄露。如果您没有必须遵循的正式策略，请根据您使用密钥的频率选择一个合适的间隔。如果切实可行，您可能希望每隔几个月更换一次密钥对。\n\
  \n备份您的密钥！如果您因数据损坏、灾难或其他情况丢失了包含私钥的文件，您肯定希望有可用的备份。您可以自行创建备份，也可以使用由第三方为您维护备份的密钥托管服务。无论哪种情况，都要确保以安全的方式处理备份。毕竟，它与您的主密钥文件同等重要！\n\
  \n`硬件安全模块 (HSM)` 也提供了一种管理加密密钥的有效方式。这些硬件设备以安全的方式存储和管理加密密钥，防止人类需要直接处理密钥。HSM 的范围和复杂程度各不相同，从非常简单的设备（如\
  \ `YubiKey`，将加密密钥存储在 USB 驱动器上供个人使用）到驻留在数据中心的更复杂的企业级产品。云服务提供商（如 Amazon 和 Microsoft）也提供基于云的\
  \ HSM，为 IaaS 服务提供安全的密钥管理。\n\n### 应用密码学\n\n到目前为止，您已经学习了大量关于密码学基础、各种加密算法内部工作原理，以及利用公钥基础设施通过数字证书分发身份凭据的知识。您现在应该对密码学基础感到得心应手，并准备好继续学习这项技术的更高层级应用，以解决日常通信问题。\n\
  \n在以下章节中，我们将探讨使用密码学保护静态数据（如存储在便携设备上的数据）以及传输中的数据，所用技术包括安全电子邮件、加密 Web 通信和网络加密。\n\n\
  #### 便携设备\n\n笔记本电脑、上网本、智能手机和平板电脑现在无处不在，这给计算领域带来了新的风险。这些设备通常包含高度敏感的信息，一旦丢失或被盗，可能会给组织及其客户、员工和关联方造成严重损害。因此，许多组织转向使用加密来保护这些设备上的数据，以防设备遗失。\n\
  \n当前版本的主流操作系统现在都包含磁盘加密功能，使得在便携设备上应用和管理加密变得容易。例如，Microsoft Windows 包含 `BitLocker`\
  \ 和 `加密文件系统 (EFS)` 技术，Mac OS X 包含 `FileVault` 加密，而 `VeraCrypt` 开源套件允许在 Linux、Windows\
  \ 和 Mac 系统上对磁盘进行加密。\n\n有各种各样的商业工具可用，它们提供额外的功能和管理能力。这些工具的主要区别在于它们如何保护存储在内存中的密钥、是提供全盘加密还是仅卷加密，以及是否与基于硬件的\
  \ `可信平台模块 (TPM)` 集成以提供额外的安全性。任何选择加密软件的工作都应包括对备选方案在这些特性上竞争表现的分析。\n\n#### 电子邮件\n\n\
  我们多次提到安全应具有成本效益。就电子邮件而言，简单性是最具成本效益的选择，但有时密码学功能提供了您不得不使用的特定安全服务。既然确保安全也是具有成本效益的，以下是关于加密电子邮件的一些简单规则：\n\
  \n*   如果您发送电子邮件时需要**机密性**，请加密该消息。\n*   如果您的消息必须保持**完整性**，您必须对消息进行哈希处理。\n*   如果您的消息需要**认证**、**完整性**和/或**不可抵赖性**，您应该对消息进行数字签名。\n\
  *   如果您的消息要求**机密性**、**完整性**、**认证**和**不可抵赖性**，您应该对消息进行加密并数字签名。\n\n发送方始终有责任采取适当机制，以确保消息或传输的安全性（即机密性、完整性、真实性和不可抵赖性）得以维持。\n\
  \n密码学最热门的应用之一是电子邮件的加密和签名。直到最近，加密电子邮件还需要使用复杂、笨拙的软件，而这些软件又需要人工干预和复杂的密钥交换过程。近年来对安全性的重视程度提高，导致主流电子邮件软件包中实现了强加密技术。接下来，我们将了解一些当今广泛使用的安全电子邮件标准。\n\
  \n##### 优良隐私协议\n\nPhil Zimmerman 的优良隐私协议 (PGP) 安全电子邮件系统于 1991 年出现在计算机安全领域。它将本章前面描述的\
  \ CA 层级结构与“信任网”概念相结合——也就是说，您必须获得一个或多个 PGP 用户的信任才能开始使用该系统。然后您接受他们对其他用户有效性的判断，并由此延伸，信任一个从您最初的信任判断衍生出的多层级用户“网络”。\n\
  \nPGP 最初遇到了广泛使用的许多障碍。最难克服的阻碍是美国政府的出口管制，该管制将加密技术视为军火，并禁止向美国境外分发强加密技术。幸运的是，这一限制现已废除，PGP\
  \ 可自由分发给大多数国家。\n\nPGP 有两个版本。商业版使用 `RSA` 进行密钥交换，使用 `IDEA` 进行加密/解密，使用 `MD5` 生成消息摘要。免费版（基于极其相似的\
  \ OpenPGP 标准）使用 `Diffie-Hellman` 密钥交换、Carlisle Adams/Stafford Tavares (CAST) 128\
  \ 位加密/解密算法和 `SHA-1` 哈希函数。\n\n许多商业提供商还提供基于 PGP 的电子邮件服务，形式包括基于 Web 的云电子邮件产品、移动设备应用程序或\
  \ Webmail 插件。这些服务吸引管理员和最终用户，因为它们消除了配置和维护加密证书的复杂性，并为用户提供托管的安全电子邮件服务。此类产品包括 `StartMail`、`Mailvelope`、`SafeGmail`\
  \ 和 `Hushmail`。\n\n### S/MIME\n\n安全/多用途互联网邮件扩展 (S/MIME) 协议已成为加密电子邮件的事实标准。S/MIME\
  \ 使用 `RSA` 加密算法，并获得了包括 RSA Security 在内的主要行业参与者的支持。S/MIME 已被纳入大量商业产品中，包括：\n\n*  \
  \ Microsoft Outlook 和 Office 365\n*   Mozilla Thunderbird\n*   Mac OS X Mail\n*\
  \   GSuite 企业版\n\n\n\n\n### S/MIME\n\nS/MIME 依赖 X.509 证书来交换加密密钥。这些证书中包含的公钥用于数字签名，以及用于较长通信会话的对称密钥交换。`RSA`\
  \ 是 S/MIME 支持的唯一公钥加密协议。该协议支持 `AES` 和 `3DES` 对称加密算法。\n\n尽管业界对 S/MIME 标准有强有力的支持，但技术限制阻碍了其广泛采用。虽然主流桌面邮件应用程序支持\
  \ S/MIME 邮件，但主流基于 Web 的电子邮件系统并不原生支持它（需要使用浏览器扩展）。\n\n#### Web 应用程序\n\n加密被广泛用于保护 Web\
  \ 事务。这主要是因为电子商务的强劲发展，以及电子商务供应商和消费者都希望通过 Web 安全地交换财务信息（如信用卡信息）。我们将介绍两项技术，它们是 Web\
  \ 浏览器中小锁图标的由来——安全套接字层（`SSL`）和传输层安全性（`TLS`）。\n\n`SSL` 由 Netscape 开发，旨在为 Web 流量提供客户端/服务器加密。超文本传输安全协议（`HTTPS`）使用端口\
  \ `443` 在 Web 服务器和浏览器客户端之间协商加密通信会话。虽然 `SSL` 起源于 Netscape 浏览器的标准，但 Microsoft 也将其作为其流行的\
  \ Internet Explorer 浏览器的安全标准予以采纳。这两款产品都纳入了 `SSL`，使其成为事实上的互联网标准。\n\n`SSL` 依赖服务器数字证书的交换，在浏览器和\
  \ Web 服务器之间协商加密/解密参数。`SSL` 的目标是创建安全通信通道，在整个 Web 浏览会话期间保持打开状态。它依赖对称和非对称加密的组合。涉及以下步骤：\n\
  \n1.  当用户访问网站时，浏览器检索 Web 服务器的证书并从中提取服务器的公钥。\n2.  然后浏览器创建一个随机对称密钥，使用服务器的公钥对其进行加密，并将加密的对称密钥发送给服务器。\n\
  3.  服务器随后使用其自己的私钥解密对称密钥，两个系统使用对称加密密钥交换所有未来的消息。\n\n这种方法使 `SSL` 能够利用非对称加密的高级功能，同时使用更快的对称算法加密和解密交换的绝大多数数据。\n\
  \n1999 年，安全工程师提出 `TLS` 作为 `SSL` 标准的替代品，当时 `SSL` 处于第三版。与 `SSL` 一样，`TLS` 使用 TCP 端口\
  \ `443`。基于 `SSL` 技术，`TLS` 结合了许多安全增强功能，并最终在大多数应用程序中被采纳为 `SSL` 的替代品。早期版本的 `TLS` 支持在双方均不支持\
  \ `TLS` 时将通信降级到 `SSL v3.0`。然而，在 2011 年，`TLS v1.2` 取消了这种向后兼容性。\n\n2014 年，一种称为填充神谕攻击降级遗留加密（`POODLE`）的攻击演示了\
  \ `TLS` 的 `SSL 3.0` 回退机制中存在的重大缺陷。为了修补此漏洞，许多组织完全放弃了 `SSL` 支持，现在仅依赖 `TLS` 安全性。\n\n\
  ##### 隐写术和水印\n\n`隐写术` 是利用加密技术将秘密消息嵌入另一条消息中的艺术。隐写算法通过更改构成图像文件的众多位中最低有效位来工作。这些更改非常微小，以至于对查看的图像没有可感知的影响。该技术允许通信双方在显而易见的地方隐藏消息——例如，他们可能将秘密消息嵌入到一个原本无害的网页的插图中。\n\
  \n隐写者通常将秘密消息嵌入图像或 `WAV` 文件中，因为这些文件通常非常大，即使是最敏锐的检查员也容易忽略秘密消息。隐写术技术常用于非法或可疑活动，如间谍活动和儿童色情。\n\
  \n然而，隐写术也可用于合法目的。通过隐写术向文档添加数字水印以保护知识产权。隐藏信息仅为文件创建者所知。如果有人稍后创建了内容的未授权副本，水印可用于检测该副本（如果向每个原始接收者提供唯一水印的文件），并将违规副本追溯到源头。\n\
  \n隐写术是一种极其简单易用的技术，互联网上公开提供免费工具。图 7.2 显示了此类工具 `iSteg` 的整个界面。它只要求您指定一个包含秘密消息的文本文件和一个您希望用来隐藏消息的图像文件。图\
  \ 7.3 显示了一个嵌入秘密消息的图片示例；该消息肉眼无法察觉。\n\n![图 7.2 隐写术工具](img/c07f002.jpg)\n\n**图 7.2**\
  \ 隐写术工具\n\n![图 7.3 嵌入消息的图像](img/c07f003.jpg)\n\n**图 7.3** 嵌入消息的图像\n\n#### 数字版权管理\n\
  \n`数字版权管理`（`DRM`）软件使用加密来对数字媒体强制执行版权限制。在过去十年中，出版商尝试在各种媒体类型中部署 `DRM` 方案，包括音乐、电影和书籍。在许多情况下，特别是音乐方面，反对者对\
  \ `DRM` 部署尝试进行了强烈抵制，认为使用 `DRM` 侵犯了他们自由享受和制作合法授权媒体文件备份副本的权利。\n\n##### 音乐 DRM\n\n\
  音乐行业多年来一直在与盗版作斗争，可以追溯到自制磁带复制的时代，并延续到光盘和数字格式。音乐分发公司尝试使用各种 `DRM` 方案，但大多数在消费者压力下放弃了该技术。\n\
  \n当苹果公司面对这种反对意见，撤回了通过 iTunes Store 销售的音乐所使用的 `FairPlay DRM` 时，购买音乐使用 `DRM` 的情况大幅放缓。苹果联合创始人史蒂夫·乔布斯在\
  \ 2007 年致音乐行业的一封公开信中预示了这一举措，呼吁他们允许苹果销售无 DRM 音乐。信中部分写道：\n\n> 第三种选择是彻底废除 DRM。想象一个世界，每个在线商店都销售采用开放可授权格式编码的无\
  \ DRM 音乐。在这样的世界里，任何播放器都可以播放从任何商店购买的音乐，任何商店都可以销售可在所有播放器上播放的音乐。这显然是对消费者最好的选择，苹果会毫不犹豫地接受。如果四大音乐公司愿意在不要求\
  \ DRM 保护的情况下将音乐授权给苹果，我们将在 iTunes 商店只销售无 DRM 音乐。每一款 iPod 都能播放这种无 DRM 音乐。\n\n完整文章不再在苹果网站上提供，但可在\
  \ [`bit.ly/1TyBm5e`](http://bit.ly/1TyBm5e) 找到存档副本。\n\n目前，`DRM` 技术在音乐中的主要用途是基于订阅的服务，如\
  \ Napster 和 Kazaa，它们使用 `DRM` 在用户订阅期结束时撤销用户对已下载音乐的访问权限。\n\n##### 电影 DRM\n\n电影行业多年来使用了各种\
  \ `DRM` 方案来遏制全球性的电影盗版问题。用于保护大规模分发媒体的两项主要技术如下：\n\n\n\n\n### 高带宽数字内容保护 (HDCP)\n\n\
  为通过数字连接（包括 HDMI、DisplayPort 和 DVI 接口）发送的内容提供 DRM 保护。虽然该技术仍广泛应用于许多实现中，但黑客于 2010 年发布了\
  \ HDCP 主密钥，使该保护完全失效。\n\n### 高级访问内容系统 (AACS)\n\n保护存储在蓝光和 HD DVD 媒体上的内容。黑客已演示了检索 AACS\
  \ 加密密钥并将其发布到互联网上的攻击手段。\n\n行业出版商与黑客之间的“猫鼠游戏”至今仍在继续；媒体公司试图保护其内容，而黑客则寻求持续获取未加密副本的途径。\n\
  \n#### 电子书 DRM\n\n或许 DRM 技术最成功的部署领域在于图书和文档出版。如今提供的大多数电子书都采用某种形式的 DRM，这些技术也保护具有 DRM\
  \ 功能的企业所生产的敏感文档。\n\nAdobe Systems 提供 Adobe 数字体验保护技术 (ADEPT)，为以多种格式销售的电子书提供 DRM 技术。ADEPT\
  \ 结合使用 AES 技术加密媒体内容和 RSA 加密保护 AES 密钥。除 Amazon Kindle 外，许多电子书阅读器都使用此技术来保护其内容。Amazon\
  \ 的 Kindle 电子阅读器使用多种格式进行图书分发，每种格式都包含其自身的加密技术。\n\n#### 视频游戏 DRM\n\n许多视频游戏实施的 DRM\
  \ 技术依赖于游戏机使用活动的互联网连接，通过基于云的服务验证游戏许可证。这些技术（如 Ubisoft 的 Uplay）曾通常需要持续的互联网连接以支持游戏运行。如果玩家失去连接，游戏将停止运行。\n\
  \n2010 年 3 月，Uplay 系统遭受拒绝服务攻击，全球 Uplay 启用游戏的玩家均无法玩那些原本运行正常的游戏，因为他们的游戏机无法访问 Uplay\
  \ 服务器。这引发了公众强烈抗议，Ubisoft 随后取消了“始终在线”要求，转而采用仅需在游戏机上进行初始激活，随后允许无限制使用的 DRM 方案。\n\n\
  #### 文档 DRM\n\n尽管 DRM 技术最常见的用途是保护娱乐内容，组织也可使用 DRM 来保护存储在 PDF 文件、办公文档和其他格式中的敏感信息安全。商业\
  \ DRM 产品（如 Vitrium 和 FileOpen）使用加密保护源内容，并使组织能够精细控制文档权限。\n\n以下是文档 DRM 解决方案常见的受限权限：\n\
  \n*   阅读文件\n*   修改文件内容\n*   从文件中移除水印\n*   下载/保存文件\n*   打印文件\n*   对文件内容截屏\n\nDRM\
  \ 解决方案允许组织在需要时授予这些权限、在不再需要时撤销权限，甚至在指定时间段后自动使权限过期。\n\n### 网络\n\n本章将探讨的密码学最终应用是使用密码算法提供安全网络服务。在以下章节中，我们将简要介绍两种用于保护通信电路的方法。我们还将了解\
  \ IPsec 和互联网安全关联与密钥管理协议 (ISAKMP)，以及无线网络安全相关的一些问题。\n\n#### 电路加密\n\n安全管理员使用两种加密技术来保护网络上传输的数据：\n\
  \n*   **链路加密** 通过使用硬件解决方案或软件解决方案在两点之间创建安全隧道，加密进入隧道一端的所有流量并在另一端解密所有流量，从而保护整个通信电路。例如，通过数据电路连接的两个办公室的公司可能会使用链路加密来防范位于两办公室中间位置的攻击者进行监控。\n\
  \n*   **端到端加密** 保护双方（例如客户端和服务器）之间的通信，独立于链路加密执行。端到端加密的一个例子是使用 TLS 保护用户与 Web 服务器之间的通信。这可以防范可能监控加密链路安全一侧流量或非加密链路上传输流量的入侵者。\n\
  \n链路加密与端到端加密的关键区别在于：在链路加密中，包括报头、报尾、地址和路由数据在内的所有数据也会被加密。因此，每个数据包必须在每一跳进行解密以便正确路由到下一跳，然后再重新加密后才能继续发送，这会降低路由速度。端到端加密不加密报头、报尾、地址和路由数据，因此点-to-point\
  \ 传输更快，但更容易受到嗅探器和窃听者的攻击。\n\n当加密发生在 OSI 模型的高层时，通常是端到端加密；如果加密在 OSI 模型的低层进行，通常是链路加密。\n\
  \n安全外壳协议 (SSH) 是端到端加密技术的一个很好的例子。这套程序为常见的互联网应用程序（如文件传输协议 (FTP)、Telnet 和 rlogin）提供了加密替代方案。SSH\
  \ 实际上有两个版本。SSH1（现已被认为不安全）支持数据加密标准 (DES)、三重 DES (3DES)、国际数据加密算法 (IDEA) 和 Blowfish\
  \ 算法。SSH2 取消了对 DES 和 IDEA 的支持，但增加了对其他多种算法的支持。\n\n#### IPsec\n\n目前有多种安全架构在使用，每种都旨在解决不同环境中的安全问题。支持安全通信的一种架构是互联网协议安全\
  \ (IPsec) 标准。IPsec 是互联网工程任务组 (IETF) 制定的标准架构，用于建立安全通道以在两个实体之间交换信息。\n\n通过 IPsec 通信的实体可以是两个系统、两个路由器、两个网关，或任意实体组合。虽然通常用于连接两个网络，但\
  \ IPsec 也可用于连接单个计算机，例如服务器和工作站或一对工作站（可能是发送方和接收方）。IPsec 并未规定所有实现细节，而是一个开放的模块化框架，允许多个制造商和软件开发商开发能与其他供应商产品良好协作的\
  \ IPsec 解决方案。\n\nIPsec 使用公钥密码学提供加密、访问控制、不可抵赖性和消息认证，均基于基于 IP 的协议。IPsec 的主要用途是虚拟专用网络\
  \ (VPN)，因此 IPsec 可以在传输模式或隧道模式下运行。IPsec 通常与第 2 层隧道协议 (L2TP) 配对使用，即 L2TP/IPsec。\n\n\
  IP 安全 (IPsec) 协议为安全网络通信提供了完整的基础设施。IPsec 已获得广泛认可，现已在许多商业操作系统中开箱即用。IPsec 依赖安全关联，主要包含两个组件：\n\
  \n*   **认证头 (AH)** 提供消息完整性和不可抵赖性保证。AH 还提供认证和访问控制，并防止重放攻击。\n\n*   **封装安全载荷 (ESP)**\
  \ 提供数据包内容的机密性和完整性。它提供加密和有限的认证，并防止重放攻击。\n\n\n\n\n### IPsec 运行模式\n\nIPsec 提供两种离散的运行模式。当\
  \ IPsec 用于 `transport mode`（传输模式）时，仅对数据包载荷进行加密。此模式专为点对点通信设计。当其用于 `tunnel mode`（隧道模式）时，包括报头在内的整个数据包都会被加密。此模式专为网关到网关的通信设计。\n\
  \n在运行时，您通过创建 `security association`（安全关联，SA）来建立 IPsec 会话。SA 代表通信会话，并记录关于连接的任何配置和状态信息。SA\
  \ 代表一个单工连接。如果您想要一个双向信道，则需要两个 SA，每个方向一个。此外，如果您想要使用 AH 和 ESP 同时支持双向信道，则需要建立四个 SA。\n\
  \nIPsec 的一些最大优势源于能够按 SA 为基础过滤或管理通信，以便存在安全关联的客户端或网关可以严格管理哪些类型的协议或服务可以使用 IPsec 连接。此外，如果没有定义有效的安全关联，用户对或网关对就无法建立\
  \ IPsec 链路。\n\nIPsec 算法的更多细节请参见第 11 章“安全网络架构和保护网络组件”。\n\n### ISAKMP\n\n互联网安全关联和密钥管理协议通过协商、建立、修改和删除安全关联，为\
  \ IPsec 提供后台安全支持服务。正如您在上一节所学，IPsec 依赖于安全关联 (SA) 系统。这些 SA 通过 ISAKMP 的使用进行管理。根据互联网\
  \ RFC 2408 的规定，ISAKMP 有四项基本要求：\n\n*   验证通信对等体的身份\n*   创建和管理安全关联\n*   提供密钥生成机制\n\
  *   防御威胁（例如，重放攻击和拒绝服务攻击）\n\n### 无线网络\n\n无线网络的广泛快速采用带来了巨大的安全风险。许多传统网络不会为本地网络上主机之间的常规通信实施加密，而是假设攻击者难以在安全地点内物理接触网络线缆以窃听网络。然而，无线网络通过空气传输数据，使其极易受到拦截。主要有两种类型的无线安全：\n\
  \n##### 有线等效保密\n\n有线等效保密 (WEP) 提供 64 位和 128 位加密选项，以保护无线局域网内的通信。WEP 在 IEEE 802.11\
  \ 中被描述为无线网络标准的一个可选组件。\n\n##### Wi-Fi 保护访问\n\nWi-Fi 保护访问 (WPA) 通过实施临时密钥完整性协议 (TKIP)\
  \ 改进了 WEP 加密，消除了破坏 WEP 的加密弱点。该技术的进一步改进被称为 WPA2，增加了 AES 加密。WPA2 提供适合现代无线网络使用的安全算法。\n\
  \n另一个常用的安全标准 IEEE 802.1x，为有线和无线网络中的身份验证和密钥管理提供了一个灵活的框架。要使用 802.1x，客户端运行一段称为 `supplicant`（申请者/客户端软件）的软件。申请者与认证服务器通信。成功认证后，网络交换机或无线接入点允许客户端访问网络。WPA\
  \ 设计为与 802.1x 认证服务器交互。\n\n### 密码学攻击\n\n与任何安全机制一样，恶意个人已经发现许多攻击手段来破解密码系统。重要的是您要了解各种密码学攻击构成的威胁，以将对系统的风险降至最低：\n\
  \n#### 分析攻击\n\n这是一种代数操作，试图降低算法的复杂性。分析攻击关注算法本身的逻辑。\n\n#### 实现攻击\n\n这是一种利用密码系统实现中的弱点的攻击类型。它专注于利用软件代码，不仅是错误和缺陷，还包括用于编程加密系统的方法论。\n\
  \n#### 统计攻击\n\n统计攻击利用密码系统中的统计弱点，例如浮点错误和无法生成真正的随机数。统计攻击试图寻找托管密码学应用程序的硬件或操作系统中的漏洞。\n\
  \n#### 暴力破解\n\n暴力破解攻击非常直接。此类攻击尝试密钥或密码的每一种可能的有效组合。它们涉及使用海量的处理能力，有条不紊地猜测用于保护加密通信的密钥。\n\
  \n对于无缺陷的协议，通过暴力破解攻击发现密钥所需的平均时间与密钥长度成正比。给予足够的时间，暴力破解攻击总会成功。密钥长度每增加一位，执行暴力破解攻击所需的时间就会翻倍，因为潜在密钥的数量翻倍了。\n\
  \n攻击者可以进行两种修改来增强暴力破解攻击的有效性：\n\n*   彩虹表为加密哈希提供预计算值。这些通常用于破解系统上以哈希形式存储的密码。\n*   专门设计用于实施暴力破解攻击的专用、可扩展计算硬件可能会极大地提高这种方法的效率。\n\
  \n#### 频率分析和仅密文攻击\n\n在许多情况下，您手头唯一的信息是加密的密文消息，这种情况称为 `ciphertext only attack`（仅密文攻击）。在这种情况下，一种对简单密码有帮助的技术是频率分析——统计密文中每个字母出现的次数。利用您知道\
  \ `E`、`T`、`A`、`O`、`I`、`N` 是英语中最常见的字母这一知识，您可以测试几种假设：\n\n*   如果这些字母在密文中也是最常见的，则该密码很可能是置换密码，它重新排列了明文字符的顺序而不改变字符本身。\n\
  *   如果密文中其他字母最常见，则该密码可能是某种形式的替换密码，它替换了明文字符。\n\n这是频率分析的简单概述，该技术有许多复杂的变体可用于多表密码和其他复杂的密码系统。\n\
  \n#### 已知明文\n\n在已知明文攻击中，攻击者拥有加密消息的副本，以及用于生成密文（副本）的明文消息。这一知识极大地帮助攻击者破解较弱的密码。例如，如果您同时拥有第\
  \ 6 章所述凯撒密码的明文副本和密文副本，您能有多大轻松地破解它。\n\n#### 选择密文\n\n在选择密文攻击中，攻击者有能力解密密文消息的选定部分，并利用解密后的消息部分来发现密钥。\n\
  \n#### 选择明文\n\n在选择明文攻击中，攻击者有能力加密其选择的明文消息，然后可以分析加密算法的密文输出。\n\n### 中间相遇攻击\n\n攻击者可能会使用中间相遇攻击来破解使用两轮加密的加密算法。这种攻击是双重\
  \ DES (2DES) 迅速被摒弃作为 DES 加密的可行增强方案的原因（它被三重 DES，即 3DES 所取代）。\n\n\n\n\n\n### 中间相遇攻击\n\
  \n在中间相遇攻击中，攻击者使用一个已知的明文消息。然后使用每一个可能的密钥（`k1`）对明文进行加密，并使用所有可能的密钥（`k2`）对等效的密文进行解密。当找到匹配时，相应的密钥对（`k1`，`k2`）即代表双重加密的两个部分。这种攻击通常只需要破解单轮加密所需时间的两倍（即\
  \ `2^n` 而非预期的 `2^n * 2^n`），因此双重加密提供的额外保护微乎其微。\n\n### 中间人攻击\n\n在中间人攻击中，恶意个体位于两个通信方之间并拦截所有通信（包括加密会话的建立过程）。攻击者响应发起方的初始化请求，并与发起方建立一个安全会话。随后，攻击者使用不同的密钥并冒充发起方，与预期的接收方建立第二个安全会话。这样攻击者就可以“处于通信中间”位置，读取双方之间传递的所有流量。\n\
  \n### 生日攻击\n\n生日攻击，也称为*碰撞攻击*或*反向哈希匹配*（参见第 14 章“控制和监控访问”中关于暴力破解和字典攻击的讨论），旨在寻找哈希函数一对一特性中的缺陷。在此攻击中，恶意个体试图在数字签名通信中替换一条不同的消息，使其产生相同的消息摘要，从而保持原始数字签名的有效性。\n\
  \n#### 重放攻击\n\n重放攻击针对的是未包含时间保护机制的加密算法。在此攻击中，恶意个体拦截双方之间的加密消息（通常是认证请求），随后“重放”捕获的消息以建立新会话。通过在每条消息中加入时间戳和有效期，可以抵御此类攻击。\n\
  \n### 概要\n\n非对称密钥密码学，即公钥加密，提供了一种极其灵活的基础设施，便于不一定在通信前相互认识的双方进行简单、安全的通信。它还为消息的数字签名提供了框架，以确保不可抵赖性和消息完整性。\n\
  \n本章探讨了公钥加密，它为大量用户提供了可扩展的加密架构。我们还介绍了一些流行的加密算法，如链路加密和端到端加密。最后，我们向您介绍了公钥基础设施，它利用证书颁发机构（CA）生成包含系统用户公钥的数字证书，以及数字签名，后者依赖于公钥密码学和哈希函数的结合。\n\
  \n我们还研究了加密技术在解决日常问题中的一些常见应用。您了解了如何利用密码学保护电子邮件（使用 PGP 和 S/MIME）、Web 通信（使用 SSL 和 TLS）、点对点和网关到网关的网络（使用\
  \ IPsec 和 ISAKMP）以及无线通信（使用 WPA 和 WPA2）。\n\n最后，我们介绍了恶意个体试图干扰或拦截双方加密通信时常用的一些攻击手段。此类攻击包括生日攻击、密码分析攻击、重放攻击、暴力破解、已知明文攻击、选择明文攻击、选择密文攻击、中间相遇攻击、中间人攻击和生日攻击。了解这些攻击对于提供针对它们的充分安全防护至关重要。\n\
  \n### 考试要点\n\n#### 理解非对称密码学中使用的密钥类型\n\n公钥在通信双方之间自由共享，而私钥必须保密。加密消息时，使用接收方的公钥。解密消息时，使用自己的私钥。签名消息时，使用自己的私钥。验证签名时，使用发送方的公钥。\n\
  \n#### 熟悉三大主要公钥密码系统\n\nRSA 是最著名的公钥密码系统；由 Rivest、Shamir 和 Adleman 于 1977 年开发。其安全性依赖于大整数分解（质数乘积）的困难性。El\
  \ Gamal 是 Diffie-Hellman 密钥交换算法的扩展，依赖于模算术。椭圆曲线算法依赖于椭圆曲线离散对数问题，在密钥长度相同的情况下，比其他算法提供更高的安全性。\n\
  \n#### 掌握哈希函数的基本要求\n\n优秀的哈希函数有五项要求。它们必须允许任意长度的输入，提供固定长度的输出，使得为任意输入计算哈希值相对容易，提供单向功能，并且必须无碰撞。\n\
  \n#### 熟悉主要哈希算法\n\n安全哈希算法（SHA）的后继者 SHA-1 和 SHA-2 构成了政府标准的消息摘要函数。SHA-1 生成 160 位的消息摘要，而\
  \ SHA-2 支持可变长度，最高可达 512 位。SHA-3 在安全性上改进了 SHA-2，并支持相同的哈希长度。\n\n#### 了解加密盐如何提高密码哈希的安全性\n\
  \n当直接使用哈希在密码文件中存储密码时，攻击者可能利用预计算值的彩虹表来识别常用密码。在哈希前向密码添加盐值，可降低彩虹表攻击的有效性。使用密钥延伸进一步增加攻击难度的常见密码哈希算法包括\
  \ PBKDF2、bcrypt 和 scrypt。\n\n#### 理解数字签名的生成和验证过程\n\n要对消息进行数字签名，首先使用哈希函数生成消息摘要。然后用自己的私钥加密该摘要。要验证消息上的数字签名，用发送方的公钥解密签名，然后将解密得到的消息摘要与自己生成的摘要进行比较。如果两者匹配，则消息是真实的。\n\
  \n#### 掌握数字签名标准（DSS）的组成部分\n\n数字签名标准使用 SHA-1、SHA-2 和 SHA-3 消息摘要函数，结合以下三种加密算法之一：数字签名算法（DSA）；Rivest、Shamir、Adleman（RSA）算法；或椭圆曲线\
  \ DSA（ECDSA）算法。\n\n#### 理解公钥基础设施（PKI）\n\n在公钥基础设施中，证书颁发机构（CA）生成包含系统用户公钥的数字证书。用户随后将这些证书分发给他们想要通信的对象。证书接收方使用\
  \ CA 的公钥来验证证书。\n\n#### 了解密码学保护电子邮件的常见应用\n\n加密消息的新兴标准是 S/MIME 协议。另一个流行的电子邮件安全工具是\
  \ Phil Zimmerman 的 Pretty Good Privacy（PGP）。大多数电子邮件加密用户依赖于内置在其电子邮件客户端或基于 Web 的电子邮件服务中的这项技术。\n\
  \n#### 了解密码学保护 Web 活动的常见应用\n\n安全 Web 流量的事实标准是通过传输层安全性（TLS）或较旧的安全套接字层（SSL）使用 HTTP。大多数\
  \ Web 浏览器同时支持这两种标准，但由于安全顾虑，许多网站正在放弃对 SSL 的支持。\n\n#### 了解密码学保护网络的常见应用\n\nIPsec 协议标准为加密网络流量提供了一个通用框架，并内置于许多常见操作系统中。在\
  \ IPsec 传输模式下，数据包内容被加密用于点对点通信。在隧道模式下，包括头部信息在内的整个数据包被加密，用于网关到网关的通信。\n\n\n\n\n**能够描述\
  \ IPsec。** IPsec 是一种安全架构框架，支持通过 IP 进行安全通信。IPsec 以传输模式或隧道模式建立安全通道。它可用于建立计算机之间的直接通信，或在网络之间建立\
  \ VPN。IPsec 使用两种协议：认证头 (AH) 和封装安全载荷 (ESP)。\n\n**能够解释常见的密码学攻击。** 暴力攻击是尝试随机寻找正确的加密密钥。已知明文攻击、选择密文攻击和选择明文攻击要求攻击者除了拥有密文外，还掌握一些额外信息。中间相遇攻击利用了使用两轮加密的协议。中间人攻击欺骗双方与攻击者通信，而不是直接相互通信。生日攻击是尝试在哈希函数中寻找碰撞。重放攻击是尝试重用身份验证请求。\n\
  \n**理解数字版权管理 (DRM) 的用途。** 数字版权管理 (DRM) 解决方案允许内容所有者强制执行他人对其内容使用的限制。DRM 解决方案通常保护娱乐内容，如音乐、电影和电子书，但偶尔也会在企业中发现，用于保护存储在文档中的敏感信息。\n\
  \n### 书面实验\n\n1. 解释 Bob 如果想使用非对称加密向 Alice 发送机密消息，应使用的流程。\n\n2. 解释 Alice 解密 Bob 在问题\
  \ 1 中发送的消息所使用的流程。\n\n3. 解释 Bob 对发送给 Alice 的消息进行数字签名所应使用的流程。\n\n4. 解释 Alice 验证问题\
  \ 3 中来自 Bob 的消息上的数字签名所应使用的流程。\n\n### 复习题\n\n1. 在 RSA 公钥密码体制中，以下哪个数字始终最大？\n\n   1.\
