  \ 便可以开始使用 `®` 符号。\n\n### 10. A\n1974 年《隐私法》限制了政府机构在特定情况下使用私人公民向其披露的信息的方式。\n\n###\
  \ 11. B\n由美国商务部和联邦贸易委员会管理的“隐私盾”框架，允许美国公司认证其符合欧盟数据保护法。\n\n### 12. A\n《儿童在线隐私保护法案》（COPPA）对未经父母同意收集幼童信息的公司规定了严厉的处罚。COPPA\
  \ 规定，在收集任何信息（获取该同意所需的基本信息除外）之前，必须获得 13 岁以下儿童父母的同意。\n\n### 13. A\n《数字千年版权法》在“暂时性活动”豁免的保护要求中，不包含任何地理位置要求。其他选项是五项强制性要求中的三项。另外两项要求是：服务提供商不得确定材料的接收者，且材料的传输不得对其内容进行任何修改。\n\
  \n### 14. C\n《美国爱国者法案》是在 2001 年 9 月 11 日恐怖袭击发生后通过的。它扩大了政府监控私人公民通信的权力，从而实际上削弱了消费者和互联网用户的隐私权。文中提到的其他法律都包含旨在加强个人隐私权的条款。\n\
  \n### 15. B\n收缩包装许可协议在用户打开软件包装时生效。点击包装协议要求用户在安装过程中点击按钮以接受许可协议条款。标准许可协议要求用户在使用软件前签署书面协议。口头协议通常不用于软件许可，但也需要软件用户的某种主动参与。\n\
  \n### 16. B\n《格雷姆-里奇-比利雷法案》除其他内容外，还规定了金融机构处理其客户私人信息的方式的相关法规。\n\n### 17. C\n美国专利法规定了自专利申请提交给专利商标局之日起\
  \ 20 年的独占期。\n\n### 18. C\n《通用数据保护条例》（GDPR）是一项全面的数据隐私法律，保护全球欧盟居民的个人信息。该法律计划于 2018\
  \ 年生效。\n\n### 19. C\n《支付卡行业数据安全标准》（PCI DSS）适用于涉及存储、传输和处理信用卡信息的组织。\n\n### 20. A\n\
  2009 年《健康信息技术经济与临床健康法案》（HITECH）修订了 HIPAA 的隐私和安全要求。\n\n### 第 5 章：保护资产安全（问题 1-10）\n\
  \n### 1. A\n信息分类过程的主要目的是识别敏感数据的安全分类，并定义保护敏感数据的要求。信息分类过程通常包括保护静态敏感数据（在备份中和存储在介质上）的要求，但不包括备份和存储所有数据的要求。同样，信息分类过程通常包括保护传输中敏感数据的要求，但不一定包括保护传输中所有数据的要求。\n\
  \n### 2. B\n数据根据其对组织的价值进行分类。在某些情况下，根据未经授权的人员访问它可能造成的潜在负面影响进行分类。它不是基于处理系统进行分类的，而是处理系统基于其处理的数据进行分类。同样，存储介质基于数据分类进行分类，但数据不是基于其存储位置进行分类的。可访问性受分类影响，但可访问性不决定分类。人员实施控制以限制对敏感数据的访问。\n\
  \n### 3. D\n发布在网站上的数据不敏感，但 PII、PHI 和专有数据都是敏感数据。\n\n### 4. D\n分类是标记介质最重要的方面，因为它明确标识了介质的价值，用户知道如何根据分类来保护它。包含日期和内容描述等信息不如标记分类重要。可以使用电子标签或标记，但它们应用于文件，而非介质，并且在使用时，标记介质仍然很重要。\n\
  \n### 5. C\n清除介质通过多次覆盖现有数据来移除所有数据，以确保数据无法使用任何已知方法恢复。已清除的介质随后可在安全要求较低的环境中重复使用。擦除介质执行删除操作，但数据仍然保留且易于恢复。清零（或覆盖）用非机密数据覆盖现有数据，但某些复杂的取证技术可能能够恢复原始数据，因此不应使用此方法来降低介质的分类级别。\n\
  \n### 6. C\n清理可能不可靠，因为人员可能不当地执行清除、消磁或其他过程。如果操作得当，已清除的数据无法使用任何已知方法恢复。无法从已焚烧的介质中检索数据。数据并非物理蚀刻在介质上。\n\
  \n### 7. D\n在给定选项中，清除是最可靠的方法。清除通过多次用随机位覆盖介质，并包含额外步骤以确保数据被移除。虽然不是可选答案，但销毁驱动器是一种更可靠的方法。擦除或删除过程很少从介质中移除数据，而是将其标记为待删除。固态硬盘（SSD）没有磁通量，因此对\
  \ SSD 进行消磁不会销毁数据。\n\n### 8. C\n物理销毁是删除 DVD 等光学介质上数据的最安全方法。格式化和删除过程很少从任何介质中移除数据。DVD\
  \ 没有磁通量，因此对 DVD 进行消磁不会销毁数据。\n\n### 9. D\n数据残留是指以残余磁通量形式保留在硬盘驱动器上的数据残余。清零、清除和覆盖都是擦除数据的有效方法。\n\
  \n### 10. C\nLinux 系统使用 `bcrypt` 加密密码，而 `bcrypt` 基于 Blowfish。`bcrypt` 增加 128 位额外的盐值以防止彩虹表攻击。高级加密标准（AES）和三重\
  \ DES（或 3DES）是单独的对称加密协议，两者均不基于 Blowfish，也与防止彩虹表攻击无直接关系。安全复制（SCP）使用安全外壳（SSH）加密通过网络传输的数据。\n\
  \n\n\n\n\n### 练习题解析\n\n### 11. D\nSSH 是一种通过网络安全连接到远程服务器的方法，因为它会加密网络上传输的数据。相比之下，Telnet\
  \ 以明文传输数据。SFTP 和 SCP 是通过网络传输敏感数据的好方法，但不用于管理目的。\n\n### 12. D\n数据管理员执行日常任务以保护数据的完整性和安全性，这包括备份数据。用户访问数据。所有者对数据进行分类。管理员分配数据的权限。\n\
  \n### 13. A\n管理员根据最小权限原则和需知原则分配权限。管理员保护数据的完整性和安全性。所有者对数据负最终责任，并确保其被正确分类，所有者向管理员提供关于谁可以拥有访问权限的指导，但所有者不分配权限。用户只是访问数据。\n\
  \n### 14. C\n行为准则规定了数据适当使用和保护的规则。最小权限确保用户仅被授予他们所需的访问权限。数据所有者决定谁有权访问系统，但这不属于行为准则。行为准则适用于用户，而不适用于系统或安全控制。\n\
  \n### 15. A\n欧盟（EU）《通用数据保护条例》（GDPR）将数据处理者定义为：“代表数据控制者单独处理个人数据的自然人或法人、公共机构、机关或其他实体。”数据控制者是控制数据处理并指导数据处理者的实体。在欧盟\
