  \   3. 3DES\n   4. AES\n\n9. Richard 收到了一条从 Sue 发送给他的加密消息。他应该使用哪个密钥来解密该消息？\n\n \
  \  1. Richard 的公钥\n   2. Richard 的私钥\n   3. Sue 的公钥\n   4. Sue 的私钥\n\n10. Richard\
  \ 想要对发送给 Sue 的消息进行数字签名，以便 Sue 确信消息来自他且在传输过程中未被修改。他应该使用哪个密钥来加密消息摘要？\n\n    1. Richard\
  \ 的公钥\n    2. Richard 的私钥\n    3. Sue 的公钥\n    4. Sue 的私钥\n\n11. 以下哪种算法不受数字签名标准\
  \ (DSS) 支持？\n\n    1. 数字签名算法\n    2. RSA\n    3. El Gamal DSA\n    4. 椭圆曲线 DSA\n\
  \n12. 哪个国际电信联盟 (ITU) 标准管辖用于安全电子通信的数字证书的创建和背书？\n\n    1. X.500\n    2. X.509\n  \
  \  3. X.900\n    4. X.905\n\n13. 哪种密码系统为 Phil Zimmerman 的商业版 Pretty Good Privacy\
