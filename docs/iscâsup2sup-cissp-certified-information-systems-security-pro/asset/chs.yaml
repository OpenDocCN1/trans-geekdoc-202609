  \ RBAC 模型相关是正确的？\n\n1.  **RBAC 模型允许用户隶属于多个组。**\n2.  RBAC 模型允许用户仅隶属于单个组。\n3.  RBAC\
  \ 模型是非层级的。\n4.  RBAC 模型使用标签。\n\n### 9. 对于使用 RBAC 模型的组织，以下哪项是角色的*最佳*选择？\n\n1.  Web\
  \ 服务器\n2.  应用程序\n3.  数据库\n4.  **程序员**\n\n### 10. 以下哪项*最好地*描述了基于规则的访问控制模型？\n\n1.\
