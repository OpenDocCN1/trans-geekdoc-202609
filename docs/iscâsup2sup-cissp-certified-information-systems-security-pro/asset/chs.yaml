  \ | | |\n| 罗德岛州 | | |\n| 德克萨斯州 | | |\n| 佛蒙特州 | | |\n| 弗吉尼亚州 | | |\n| 西弗吉尼亚州 | |\
  \ |\n\n##### 洪水\n\n洪水几乎可能在世界任何地方、一年中的任何时间发生。一些洪水源于雨水在河流、湖泊和其他水体中逐渐积聚，随后漫溢堤岸淹没社区。另一些洪水被称为*山洪*，当突如其来的强风暴在短时间内向某地区倾泻的雨水超过地面吸收能力时发生。大坝决堤也会导致洪水。由地震活动引起的大浪，即*海啸*，将水的巨大威力和重量与洪水结合在一起，正如我们在\
  \ 2011 年日本海啸中所见。那次海啸充分展示了水的巨大破坏力，以及它在引发福岛前所未有的核灾难时，给各类企业和经济造成的浩劫。\n\n根据政府统计数据，洪水每年在美国给企业和家庭造成的损失约为\
  \ 80 亿美元（那是 *b*illion，十亿！）。您的 DRP 必须为洪水可能袭击您设施这一情况制定适当的响应计划，这至关重要。\n\n虽然理论上洪水可能发生在世界几乎任何地区，但在某些特定区域发生的可能性要大得多。FEMA\
  \ 的国家洪水保险计划负责对全美进行洪水风险评估，并以图形形式向公众提供这些数据。您可以在以下网址在线查看洪水地图：\n\n<http://msc.fema.gov/portal>\n\
  \n该网站还提供有关已记录的地震、飓风、风暴、冰雹风暴和其他自然灾害的宝贵信息，帮助您准备组织的风险评估。\n\n查看洪水地图时（如图 18.1 所示示例），您会发现分配给某区域的两个常见风险是“百年一遇洪泛区”和“五百年一遇洪泛区”。这些评估分别意味着政府估计在任何给定年份发生洪水的几率为\
  \ 1/100 或 1/500。如需了解阅读洪水地图和当前地图信息的更详细教程，请访问 <http://www.fema.gov/media/fhm/firm/ot_firm.htm>。\n\
  \n![图 18.1 佛罗里达州迈阿密-戴德县洪水危险图 ](img/c18f001.jpg)\n\n**图 18.1** 佛罗里达州迈阿密-戴德县洪水危险图\n\
  \n##### 风暴\n\n风 storm 形式多样，给企业带来多种风险。长时间的强降雨带来了上一节所述的山洪风险。飓风和龙卷风伴随时速超过 100 英里的大风，破坏建筑物的结构完整性，将树木、庭院家具甚至车辆等日常物品变成致命的飞射物。冰雹风暴带来破坏性的冰块从天而降。许多风暴还带来雷击风险，这可能对敏感电子元件造成严重损坏。因此，您的业务连续性计划应详述防范雷击损害的适当机制，而您的灾难恢复计划应包含针对雷击可能导致的停电和设备损坏的充分预案。切勿低估单次风暴可能造成的破坏。\n\
  \n2017 年，四级大西洋飓风“哈维”标志着有史以来登陆美国大陆的代价最高、致死人数最多、强度最强的飓风之一。它在德克萨斯州开辟出一条毁灭之路，摧毁了自然和人造设施。哈维造成的损失带来的总经济影响估计超过\
  \ 1250 亿美元，并直接导致至少 63 人死亡。\n\n###### 火灾\n\n火灾可能因多种原因引起，无论是自然原因还是人为原因，两者破坏力均不相上下。在\
  \ BCP/DRP 过程中，您应评估火灾风险，并实施至少基本的措施来降低该风险，为企业从关键设施的灾难性火灾中恢复做好准备。\n\n世界上某些地区在温暖季节易发生野火。这些火灾一旦发生，蔓延模式具有一定的可预测性，消防专家与气象学家合作可对野火的潜在路径做出相对准确的预测。\n\
  \n##### 其他区域性事件\n\n世界上某些地区易发生局部类型的自然灾害。在 BCP/DRP 过程中，您的评估团队应分析贵组织的所有运营地点，并评估此类事件可能对您的业务造成的影响。例如，世界许多地区会发生火山爆发。如果您在活火山或休眠火山附近开展业务，您的\
  \ DRP 很可能需要应对这一情况。其他局部性自然事件包括亚洲的季风、南太平洋的海啸、山区的雪崩以及美国西部的泥石流。\n\n\n\n\n如果您的业务在地理上具有多样性，则明智的做法是让当地的应急响应专家加入您的规划团队。至少，应利用当地资源，如政府应急准备团队、民防组织和保险理赔办公室来帮助指导您的工作。这些组织拥有丰富的知识，通常非常乐意帮助您为组织应对意外情况做好准备——毕竟，每个成功度过自然灾害的组织，都是灾后不再需要消耗其宝贵恢复资源的组织。\n\
  \n##### 人为灾难\n\n我们先进的文明越来越依赖技术、物流和自然系统之间的复杂相互作用。正是这些使我们复杂社会成为可能的相互作用，也带来了许多来自有意和无意*人为灾难*的潜在脆弱性。在以下章节中，我们将探讨一些更常见的灾难，以帮助您在制定业务连续性计划和灾难恢复计划时分析组织的脆弱性。\n\
  \n###### 火灾\n\n本章前面我们解释了世界上某些地区在暖季容易发生野火，这类火灾可被描述为自然灾害。许多小规模火灾是由人为行为引起的——无论是疏忽大意、电气线路故障、不当的消防实践还是其他原因。保险信息研究所的研究表明，美国每天至少发生\
  \ 1,000 起建筑火灾。如果发生此类火灾袭击您的组织，您是否采取了适当的预防措施以迅速将其控制？如果火灾摧毁了您的设施，您的灾难恢复计划能多快让您在别处恢复运营？\n\
  \n###### 恐怖主义行为\n\n自 2001 年 9 月 11 日的恐怖袭击以来，企业越来越关注恐怖主义威胁带来的风险。这些袭击导致许多小企业倒闭，因为它们没有制定足以确保其持续生存能力的业务连续性/灾难恢复计划。许多大型企业遭受了重大损失，造成了严重的长期损害。袭击发生一年后，保险信息研究所发布的一项研究估计，纽约市因袭击造成的总损失达\
  \ 400 亿美元（是的，又是以 *b* 为单位！）。\n\n恐怖主义行为因其不可预测的性质，给 DRP 团队带来了独特的挑战。在 2001 年 9 月 11\
  \ 日恐怖袭击之前，很少有 DRP 团队认为飞机撞击其企业总部的威胁足够大，值得采取缓解措施。许多公司正在就恐怖主义活动向自己提出许多“如果……会怎样”的问题。总体而言，这些问题是健康的，因为它们促进了业务要素之间关于潜在威胁的对话。另一方面，灾难恢复规划者必须强调可靠的风险管理原则，并确保资源不会过度分配给恐怖主义威胁，从而损害其他针对更可能发生的威胁的\
  \ DRP/BCP 活动。\n\n###### 爆炸/炸弹袭击\n\n爆炸可能由各种人为事件引起。泄漏的爆炸性气体可能充满房间/建筑物，随后被点燃并造成破坏性爆炸。在许多地区，炸弹袭击也是令人担忧的原因。从灾难规划的角度来看，炸弹袭击和爆炸的影响类似于大规模火灾造成的影响。然而，规划避免炸弹袭击的影响要困难得多，这依赖于我们在第\
  \ 10 章“物理安全要求”中介绍的物理安全措施。\n\n###### 断电\n\n即使是最基本的灾难恢复计划也包含应对短时断电威胁的规定。关键业务系统通常由不间断电源（UPS）设备保护，以使其至少运行足够长的时间以关闭系统，或足够长的时间以启动应急发电机并使其工作。即便如此，您的组织能否在持续断电期间维持运营？\n\
  \n2017 年飓风哈维登陆后，德克萨斯州数百万人断电。您的业务连续性计划是否包含在如此长时间无电情况下维持业务生存的规定？即使商业电网仍然不可用，您的灾难恢复计划是否为及时恢复供电做好了充分准备？\n\
  \n当今技术驱动的组织越来越依赖电力，因此您的 BCP/DRP 团队应考虑配置可无限期运行业务系统的替代电源。一台足够的备用发电机在您的业务生存受到威胁时可能会产生巨大影响。\n\
  \n###### 网络、公用设施和基础设施故障\n\n当规划者考虑公用设施中断对其组织的影响时，他们自然会首先考虑断电的影响。然而，也要牢记其他公用设施。您的任何关键业务系统是否依赖水、下水道、天然气或其他公用设施？还要考虑区域基础设施，如高速公路、机场和铁路。这些系统中的任何一个都可能发生故障，而这些故障可能与本章所述的天气或其他条件无关。许多企业依赖这些基础设施要素中的一个或多个来运送人员或材料。它们的故障可能会使您的业务失去继续运作的能力。\n\
  \n您还必须将互联网连接视为一种公用事业服务。您的连接选项是否具有足够的冗余，以在灾难中生存或快速恢复？如果您有冗余提供商，它们是否存在任何单点故障？例如，它们是否都通过单个光纤管道进入您的大楼，而该管道可能被切断？如果没有替代的光纤入口点，您能否用无线连接来补充光纤连接？您的备用处理站点是否拥有足够的网络容量，以便在发生灾难时承担全部运营负担？\n\
  \n###### 硬件/软件故障\n\n无论您喜欢与否，计算机系统都会发生故障。硬件组件会直接磨损并拒绝继续执行，或遭受物理损坏。软件系统包含 Bug 或因不当或意外输入而失效。因此，BCP/DRP\
  \ 团队必须在其系统中提供足够的冗余。如果零停机时间是强制性要求，最佳解决方案是使用完全冗余的故障转移服务器，这些服务器位于不同位置，连接到独立的通信链路和基础设施（也设计为以故障转移模式运行）。如果一台服务器损坏或被毁，另一台将立即接管处理负载。有关此概念的更多信息，请参阅本章后面的“远程镜像”部分。\n\
  \n由于财务限制，并不总是能够维护完全冗余的系统。在这种情况下，BCP/DRP 团队应解决如何快速获取和安装替换部件的问题。尽可能多的部件应保存在本地部件库存中以便快速更换；对于难以寻找且必须从外地运来的部件，这一点尤为重要。毕竟，有多少组织能在等待关键专用交换机（PBX）组件从海外运抵并现场安装的三天里没有电话可用？\n\
  \n###### 罢工/纠察\n\n\n\n\n### 业务连续性与灾难恢复：人为因素与系统弹性\n\n#### 应急规划中的人为因素\n\n在设计您的业务连续性和灾难恢复计划时，不要忘记应急规划中人为因素的重要性。一种常被忽视的人为灾难形式是罢工或其他劳资危机的可能性。如果大量员工同时离岗，会对您的业务产生什么影响？在没有某一领域的正式全职员工配备的情况下，您能维持运营多久？您的\
  \ BCP 和 DRP 团队应解决这些问题，并为劳资危机发生时提供替代计划。\n\n#### 盗窃/破坏\n\n前面我们讨论了恐怖活动对组织构成的威胁。盗窃和破坏代表了同类威胁，只是规模小得多。然而在大多数情况下，您的组织受到盗窃或破坏影响的可能性远大于恐怖袭击。保险为这些事件提供了一定的财务保护（受限于免赔额和保险范围限制），但这类行为可能对您的业务造成严重损害，无论是短期还是长期。您的业务连续性和灾难恢复计划应包含充分的预防措施，以控制这些事件的发生频率，以及应急计划以减轻盗窃和破坏对持续运营的影响。\n\
  \n#### 理解系统弹性与容错\n\n增加系统弹性和容错能力的技术控制直接影响可用性，这是 CIA 安全三要素（机密性、完整性和可用性）的核心目标之一。系统弹性和容错的主要目标是消除单点故障。\n\
  \n`单点故障 (SPOF)` 是指任何可能导致整个系统失效的组件。如果计算机的数据存储在单个磁盘上，磁盘故障会导致计算机失效，因此该磁盘就是一个单点故障。如果一个依赖数据库的网站包含多台\
  \ Web 服务器，但都由单台数据库服务器提供服务，则该数据库服务器就是一个单点故障。\n\n`容错` 是指系统在发生故障时仍能继续运行的能力。通过添加冗余组件（如廉价磁盘冗余阵列\
  \ `RAID` 中的额外磁盘，或故障转移集群配置中的额外服务器）可实现容错。\n\n`系统弹性` 是指系统在逆境事件期间维持可接受服务水平的能力。这可能是由容错组件处理的硬件故障，也可能是由入侵检测和防御系统等其他控制措施处理的攻击。在某些语境下，它指系统在逆境事件后恢复到先前状态的能力。例如，如果故障转移集群中的主服务器发生故障，容错确保系统故障转移到另一台服务器。系统弹性意味着在原服务器修复后，集群可以故障回切到原服务器。\n\
  \n##### 保护硬盘驱动器\n\n为计算机增加容错和系统弹性的常用方法是使用 `RAID` 阵列。`RAID` 阵列包含两个或更多磁盘，大多数 `RAID`\
  \ 配置在其中一个磁盘发生故障后仍能继续运行。一些常见的 `RAID` 配置如下：\n\n**RAID-0** 这也称为条带化。它使用两个或更多磁盘，可提高磁盘子系统性能，但*不*提供容错能力。\n\
  \n**RAID-1** 这也称为镜像。它使用两个磁盘，两者存储相同的数据。如果一个磁盘发生故障，另一个磁盘包含数据，因此系统在单个磁盘故障后仍可继续运行。根据所用硬件及故障磁盘的不同，系统可能无需干预即可继续运行，也可能需要手动配置以使用未故障的驱动器。\n\
  \n**RAID-5** 这也称为带奇偶校验的条带化。它使用三个或更多磁盘，其中相当于一个磁盘的空间存储奇偶校验信息。如果任意单个磁盘发生故障，`RAID` 阵列将继续运行，尽管速度会变慢。\n\
  \n**RAID-10** 这也称为 `RAID 1 + 0` 或镜像条带化，配置为两个或更多镜像 (`RAID-1`) 以条带化 (`RAID-0`) 方式组合。它至少使用四个磁盘，但只要添加偶数个磁盘即可支持更多。只要每个镜像中至少有一个驱动器继续工作，即使多个磁盘发生故障，它仍能继续运行。例如，如果有三组镜像（本例称为\
  \ M1、M2 和 M3），则总共有六个磁盘。如果 M1 中一个驱动器、M2 中一个驱动器和 M3 中一个驱动器全部故障，阵列仍将继续运行。但是，如果任一镜像中的两个驱动器都发生故障（如\
  \ M1 中的两个驱动器），整个阵列将失效。\n\n既有基于软件的 `RAID` 解决方案，也有基于硬件的解决方案。基于软件的系统需要操作系统管理阵列中的磁盘，可能会降低整体系统性能。它们成本相对较低，因为除额外磁盘外不需要任何额外硬件。硬件\
  \ `RAID` 系统通常更高效、更可靠。虽然硬件 `RAID` 更昂贵，但当用于提高关键组件的可用性时，其收益大于成本。\n\n基于硬件的 `RAID` 阵列通常包含备用驱动器，可逻辑添加到阵列中。例如，基于硬件的\
  \ `RAID-5` 可包含五个磁盘，其中三个磁盘组成 `RAID-5` 阵列，两个作为备用磁盘。如果一个磁盘发生故障，硬件会检测到故障，并用良好的备用磁盘在逻辑上替换故障驱动器。此外，大多数基于硬件的阵列支持热插拔，允许技术人员在不关闭系统电源的情况下更换故障磁盘。冷插拔\
  \ `RAID` 则需要关闭系统电源才能更换故障驱动器。\n\n##### 保护服务器\n\n可通过故障转移集群为关键服务器增加容错能力。故障转移集群包含两个或更多服务器，如果其中一台服务器发生故障，集群中的另一台服务器可通过称为\
  \ `故障转移` 的自动过程接管其负载。故障转移集群可包含多台服务器（不仅限于两台），也可为多项服务或应用程序提供容错能力。\n\n以图 18.2 所示的故障转移集群为例。它展示了多个组件的组合，为一个使用数据库且访问量大的网站提供可靠的\
  \ Web 访问。DB1 和 DB2 是配置为故障转移集群的两台数据库服务器。在任何给定时间，只有一台服务器作为活动数据库服务器运行，第二台服务器处于非活动状态。例如，如果\
  \ DB1 是活动服务器，它将为网站执行所有数据库服务。DB2 监控 DB1 以确保其正常运行，如果 DB2 检测到 DB1 故障，将导致集群自动故障转移到 DB2。\n\
  \n![图 18.2 带网络负载均衡的故障转移集群](img/c18f002.jpg)\n\n**图 18.2** 带网络负载均衡的故障转移集群\n\n在图 18.2\
  \ 中，您可以看到 DB1 和 DB2 都能访问数据库中的数据。这些数据存储在 `RAID` 阵列上，为磁盘提供容错能力。\n\n\n\n\n此外，这三台 Web\
  \ 服务器配置在一个网络负载均衡集群中。负载均衡器可以基于硬件或软件，它将客户端负载分散到这三台服务器上。这使得添加额外的 Web 服务器以应对增加的负载变得容易，同时也能在所有服务器之间平衡负载。如果任何一台服务器发生故障，负载均衡器能感知到该故障并停止向该服务器发送流量。虽然网络负载均衡主要用于提高系统的可扩展性以便处理更多流量，但它也提供了一定程度的容错能力。\n\
  \n如果你在云中运行服务器，可能可以利用云服务商提供的容错服务。例如，许多 IaaS 提供商提供负载均衡服务，可根据需求自动扩展资源。这些服务还包含健康检查功能，可自动重启运行不正常的服务器。\n\
  \n同样，在设计云环境时，请务必考虑世界不同地区数据中心的可用性。如果你已经在对多台服务器进行负载均衡，可能可以将这些服务器放置在不同的地理区域及这些区域内的不同可用区中，以在可扩展性之外增加弹性。\n\
  \n### 保护电源\n\n可以通过 `uninterruptible power supply`（UPS，不间断电源）、发电机或两者结合来为电源增加容错能力。一般来说，UPS\
  \ 可提供 5 到 30 分钟的电池供电，而发电机提供长期供电。UPS 的目标是提供足够长的电力以完成系统的逻辑关机，或维持到发电机启动并提供稳定电力为止。\n\
  \n理想情况下，电力应持续稳定且无任何波动，但现实中，商用电力存在各种各样的问题。`spike`（尖峰/电压尖峰）是电压瞬间升高的情况，而 `sag`（跌落/电压跌落）是电压瞬间降低的情况。如果电压长时间保持在高位，称为\
  \ `surge`（浪涌/电压浪涌）而非尖峰。如果长时间保持在低位，称为 `brownout`（电压不足/欠压）。偶尔，电力线上会出现称为 `transients`（瞬态/电压瞬变）的噪声，来源多种多样。所有这些问题都可能给电气设备带来麻烦。\n\
  \n最基本的 UPS（也称为离线或备用 UPS）提供浪涌防护和电池备份。它插在商用电源上，关键系统插在 UPS 系统上。如果电源故障，电池备份将在短时间内为系统提供持续供电。线互动式\
  \ UPS 正变得流行，它们提供基本 UPS 之外的额外服务。它们包含一个可变电压变压器，可在不消耗电池电量的情况下调节过压和欠压事件。当电源丢失时，电池将为系统供电一小段时间。\n\
  \n发电机在长期停电期间为系统供电。发电机供电的时长取决于燃料，只要有燃料且发电机保持功能正常，现场就有可能长期依靠发电机供电。在 2017 年飓风“厄玛”袭击波多黎各后的漫长恢复期中，发电机被要求长时间运行，并在连续运行数周数月后开始出现故障。\n\
  \n发电机还需要稳定的燃料供应——通常使用柴油、天然气或丙烷。除了确保手头有足够的燃料外，还应采取措施确保在发生长期紧急情况时能定期获得燃料供应。请记住，如果灾难范围广泛，有限的燃料供应将面临巨大需求。如果你与供应商签订了合同，就更有可能及时获得燃料。\n\
  \n### 可信恢复\n\n可信恢复确保系统在发生故障或崩溃后，其安全性与故障或崩溃发生前一样。根据故障类型，恢复可能是自动的，也可能需要管理员进行手动干预。然而，无论哪种情况，系统都可以设计为支持可信恢复。\n\
  \n系统可以设计为在故障时进入故障安全状态或故障开放状态。`fail-secure`（故障安全）系统在发生故障时将默认进入安全状态，阻止所有访问。`fail-open`（故障开放）系统将在开放状态下故障，允许所有访问。选择取决于故障发生后安全性还是可用性更重要。\n\
  \n例如，防火墙通过控制进出网络的访问提供大量安全性。它们配置为隐式拒绝策略，仅根据规则显式允许的流量通过。防火墙通常设计为故障安全，支持隐式拒绝策略。如果防火墙故障，所有流量都会被阻断。虽然这消除了通过防火墙的通信可用性，但却是安全的。相反，如果流量的可用性比安全性更重要，防火墙可配置为故障开放状态，允许所有流量通过。这不安全，但网络不会失去流量可用性。\n\
  \n恢复过程的两个要素被用于实现可信解决方案。第一个要素是故障准备。这包括系统弹性和容错方法，以及可靠的备份解决方案。第二个要素是系统恢复过程。系统应被强制重启进入单用户、非特权状态。这意味着系统应重启到可使用普通用户账户登录的程度，且系统不授予用户未经授权的访问权限。系统恢复还包括恢复故障或崩溃时系统上正在活跃使用的所有受影响文件和服务。任何丢失或损坏的文件将被恢复，分类标签的任何更改将被纠正，然后验证所有安全关键文件上的设置。\n\
  \n通用准则（在第 8 章“安全模型、设计和能力原则”中介绍）包含与系统弹性和容错相关的可信恢复部分。具体而言，它定义了四种类型的可信恢复：\n\n**手动恢复**\
  \ 如果系统故障，它不会进入安全状态。相反，需要管理员在故障或系统崩溃后手动执行实施安全或可信恢复所需的操作。\n\n**自动恢复** 系统能够执行可信恢复活动，以针对至少一种故障类型恢复自身。例如，硬件\
  \ RAID 提供针对硬盘故障的自动恢复，但不提供针对整个服务器故障的恢复。某些类型的故障将需要手动恢复。\n\n**无过度损失的自动恢复** 这类似于自动恢复，即系统能针对至少一种故障类型自行恢复。然而，它包含确保特定对象受到保护以防止其丢失的机制。一种防止过度损失的自动恢复方法将包括恢复数据或其他对象的步骤。它可能包含额外的保护机制来恢复损坏的文件、从事务日志重建数据，并验证关键系统和安全组件的完整性。\n\
  \n**功能恢复** 支持功能恢复的系统能够自动恢复特定功能。此状态确保系统能成功完成功能恢复，或能回滚更改以返回安全状态。\n\n### 服务质量\n\n\n\
  \n\n### 服务质量\n\n服务质量控制可保护数据网络在负载下的完整性。许多不同因素都会影响最终用户体验的质量，QoS 试图管理所有这些因素，以创建满足业务要求的体验。\n\
  \n影响 QoS 的部分因素如下：\n\n- **带宽**：可用于承载通信的网络容量。\n- **延迟**：数据包从源传输到目的地所需的时间。\n- **抖动**：不同数据包之间延迟的变化。\n\
  - **丢包**：某些数据包可能在源和目的地之间丢失，需要重新传输。\n- **干扰**：电气噪声、设备故障和其他因素可能会破坏数据包的内容。\n\n除了控制这些因素外，QoS\
  \ 系统通常还会为某些流量类型分配优先级，这些流量类型对干扰的容忍度低和/或具有较高的业务要求。例如，QoS 设备可能会被编程为优先处理来自高管会议室的视频会议流量，而非来自实习生电脑的视频流媒体流量。\n\
  \n### 恢复策略\n\n当灾难中断您的业务时，您的灾难恢复计划应近乎自动地启动，并开始为恢复操作提供支持。灾难恢复计划的设计应使首批到达现场的员工能够立即以有组织的方式开始恢复工作，即使官方\
  \ DRP 团队成员尚未抵达现场。在以下章节中，我们将介绍制定有效灾难恢复计划所涉及的关键子任务，该计划可指导常规业务流程的快速恢复以及在主要营业地点恢复活动。\n\
  \n除了提高响应能力外，购买保险还可以降低财务损失的风险。选择保险时，请务必购买足够的保障，以便您能从灾难中恢复。简单的价值保障可能不足以涵盖实际的重置成本。如果您的财产保险包含实际现金价值\
  \ (ACV) 条款，则您受损的财产将根据损失当天物品的公平市场价值减去自购买以来的所有累计折旧进行赔偿。这里的关键在于，除非您的保险保障中包含重置成本条款，否则您的组织很可能因遭受的任何损失而自掏腰包。许多保险提供商提供专门承保机密性、完整性和可用性泄露的网络安全责任保单。\n\
  \n贵重文件保险保障为铭文、印刷品、手写文件和手稿及其他印刷业务记录提供保护。但是，它不承保纸币和印刷有价证券的损坏。\n\n#### 业务单元和职能优先级\n\
  \n为了以最高可能的效率恢复您的业务运营，您必须设计灾难恢复计划，使优先级最高的业务单元首先得到恢复。您还必须识别关键业务职能并确定其优先级，以便定义灾难或故障后要恢复哪些职能以及恢复的顺序。\n\
  \n为实现这一目标，DRP 团队必须首先识别这些业务单元并就优先级顺序达成一致，同时也必须对业务职能做同样的工作。（请注意：并非所有关键业务职能都一定在关键业务单元中执行，因此该分析的最终结果极有可能包含关键业务单元的超集以及其他选定的单元。）\n\
  \n如果这个过程听起来耳熟，那应该是因为它很熟悉！这非常类似于 BCP 团队在第 3 章讨论的业务影响评估期间执行的优先级排序任务。事实上，大多数组织将完成业务影响评估\
  \ (BIA) 作为其业务连续性规划过程的一部分。该分析识别漏洞，制定策略以最小化风险，并最终生成一份 BIA 报告，描述组织面临的潜在风险并识别关键业务单元和职能。BIA\
  \ 还识别与故障相关的成本，包括现金流损失、设备更换、为清理工作积压而支付的薪资、利润损失、因无法吸引新业务而产生的机会成本等。这些故障从财务、人员、安全、法律合规、合同履行和质量保证等方面的潜在影响进行评估，最好以货币形式表示，以便使影响具有可比性并设定预算预期。掌握所有这些\
  \ BIA 信息后，您应将生成的文档作为该优先级排序任务的基础。\n\n该任务的输出至少应是一份按优先级排序的业务单元简单清单。然而，一份按优先级排列的具体业务流程的更详细清单将是更有用的交付成果。这种面向业务流程的清单更能反映现实情况，但需要付出大量额外努力。然而，它将极大地协助恢复工作——毕竟，优先级最高的业务单元执行的并非每项任务都具有最高优先级。您可能会发现，最好将最高优先级的单元恢复到\
  \ 50% 的产能，然后转向优先级较低的单元，在尝试全面恢复之前，先在整个组织中实现一定的最低运营产能。\n\n同理，必须对关键业务流程和职能完成相同的练习。这些事项不仅可能涉及多个业务单元并跨越它们之间的界限，而且还定义了灾难或其他业务中断后必须恢复的运营要素。这里同样，最终结果应是一份按优先级排序的清单，每项都有自己的风险和成本评估，以及相应的平均恢复时间\
  \ (MTTR) 和相关恢复目标及里程碑。这些指标包括一个称为最大可容忍中断时间 (MTO) 的指标。这是业务在不经历重大中断的情况下能够承受服务不可用的最长时间。业务连续性规划人员可以比较\
  \ MTTR 和 MTO 值，以识别需要干预和额外控制的情况。\n\n#### 危机管理\n\n如果灾难袭击您的组织，恐慌很可能会蔓延。对抗恐慌的最佳方式是制定有组织的灾难恢复计划。您企业中最有可能首先注意到紧急情况的人员（即保安、技术人员等）应充分接受灾难恢复程序培训，并知晓正确的通知程序和即时响应机制。\n\
  \n许多平时看似常识的事情（例如发生火灾时拨打 911）可能会从惊慌失措、寻求逃离紧急情况的员工脑海中溜走。对抗这种情况的最佳方式是持续开展灾难恢复职责培训。回到火灾的例子，所有员工都应接受培训，在发现火灾时拉响火警警报或联系紧急救援官员（当然，前提是先采取适当措施保护自己）。毕竟，消防部门接到\
  \ 10 个报告贵单位失火的电话，总比所有人都假设别人已经处理了要好。\n\n危机管理是一门科学，也是一门艺术。如果您的培训预算允许，为关键员工投资危机培训是个好主意。这能确保您至少有一些员工知道如何妥善处理紧急情况，并能为惊恐的同事提供至关重要的“现场”领导力。\n\
  \n#### 紧急通信\n\n\n\n\n\n### 灾难恢复通信与备用处理站点\n\n当灾难发生时，组织能够进行内部沟通以及与外界联系至关重要。任何重大灾难都容易被察觉，但如果组织无法让外界了解其恢复状况，公众往往会恐慌并假定该组织无法恢复。组织在灾难期间能够进行内部沟通同样必不可少，以便员工知晓对他们的要求——例如他们是否应返回工作岗位或前往另一地点报到。\n\
  \n在某些情况下，导致灾难的原因可能也损坏了部分或全部正常通信手段。猛烈的风暴或地震可能也会瘫痪电信系统；此时再去想办法寻找其他内部和外部通信手段已为时过晚。\n\
  \n#### 工作组恢复\n\n在设计灾难恢复计划时，牢记目标非常重要——将工作组恢复到能够在其常规工作地点恢复活动的程度。很容易跑题，误以为灾难恢复纯粹是 IT\
  \ 工作，专注于将系统和流程恢复正常运行。\n\n为促进这项工作，有时最好为不同的工作组开发单独的恢复设施。例如，如果您有多家位于不同地点的子公司，它们执行的任务与您办公室工作组的任务相似，您可以考虑暂时将这些工作组迁移到其他设施，并让它们通过电子方式和电话与其他业务单元通信，直到它们准备好返回主运营设施。\n\
  \n大型组织可能难以找到能够处理整个业务运营的恢复设施。这是另一个适合对不同工作组进行独立恢复的情形示例。\n\n#### 备用处理站点\n\n灾难恢复计划中最重要的要素之一，是在主站点不可用时选择备用处理站点。在考虑恢复设施时有许多可选方案，仅受限于灾难恢复规划师和服务提供商的创造性思维。在以下章节中，我们将介绍灾难恢复规划中常用的几种站点类型：冷站点、温站点、热站点、移动站点、服务局和多站点。\n\
  \n##### 冷站点\n\n**冷站点** 是足以承担组织处理负载的备用设施，并配备了适当的电力和环境支持系统。它们可能是大型仓库、空置的办公楼或其他类似结构。然而，冷站点没有预装计算设施（硬件或软件），也没有激活的宽带通信链路。许多冷站点至少有几条铜质电话线，有些站点可能有待命链路，只需极短的通知即可激活。\n\
  \n冷站点的主要优势是其成本相对较低——站点闲置时无需维护计算基础设施，也无每月电信账单。然而，此类站点的缺点显而易见——从决定激活站点到该站点准备好支持业务运营之间存在巨大的时间滞后。服务器和工作站必须搬入并配置。数据必须从备份磁带恢复。通信链路必须被激活或建立。激活冷站点的时间通常以周为单位计算，这使得及时恢复几乎不可能，且往往产生虚假的安全感。还值得一提的是，激活冷站点并转移运营所需的大量时间、精力和费用，使这种方法成为最难测试的方案。\n\
  \n##### 热站点\n\n**热站点** 与冷站点截然相反。在这种配置中，备用设施始终保持正常工作状态，拥有全套服务器、工作站和通信链路，随时准备承担主要运营职责。服务器和工作站均已预配置，并加载了适当的操作系统和应用软件。\n\
  \n主站点服务器上的数据会定期或持续复制到热站点的相应服务器，确保热站点拥有最新数据。视站点间可用带宽而定，热站点数据可能会即时复制。如果是这种情况，操作人员可随时将运营切换到热站点。如果不是，灾难恢复管理者有三种激活热站点的选项：\n\
  \n*   如果在主站点必须关闭前有足够时间，他们可以在运营控制权移交前强制两个站点间进行复制。\n*   如果无法复制，管理者可将主站点的事务日志备份磁带带至热站点，并手动重新应用自上次复制以来发生的任何事务。\n\
  *   如果没有可用备份且无法强制复制，灾难恢复团队可能只能接受部分数据丢失。\n\n热站点的优势显而易见——这种站点提供的灾难恢复保护级别无与伦比。然而，成本**极高**。维护热站点基本上会使组织在硬件、软件和服务方面的预算翻倍，并需要额外员工来维护该站点。\n\
  \n如果组织想维护热站点但又想降低设备和维护费用，可以选择使用由外部承包商管理的共享热站点设施。然而，这些设施固有的风险在于，在大范围灾难发生时，它们可能负荷过重，无法同时为所有客户提供服务。如果贵组织考虑此类安排，请务必在签约前和合同期内定期彻底调查这些问题。\n\
  \n降低热站点费用的另一种方法是将其用作开发或测试环境。开发人员可实时将数据复制到热站点，既用于测试目的，也提供生产环境的实时副本。这通过让热站点在非灾难运营期间也为组织提供有用服务来降低成本。\n\
  \n#### 温站点\n\n**温站点** 在灾难恢复专家眼中处于热站点和冷站点的中间地带。它们始终包含迅速建立运营所需的设备和数据电路。与热站点一样，这些设备通常已预配置，可运行适当的应用程序以支持组织运营。然而，与热站点不同的是，温站点通常不包含客户数据的副本。将温站点带入全面运行状态的主要要求是将适当的备份介质运送到现场，并在备用服务器上恢复关键数据。\n\
  \n激活温站点通常需要从宣布灾难时起至少 12 小时。但这并不意味着任何能在 12 小时内激活的站点都符合热站点资格；大多数热站点的切换时间通常以秒或分钟计算，完全切换很少超过一两个小时。\n\
  \n\n\n\n\n### 灾难恢复站点选项\n\n#### 温站点\n\n温站点避免了维护运营数据环境的近实时副本所固有的巨大电信和人员成本。与热站点和冷站点一样，温站点也可以基于共享设施的方式获得。如果您选择此选项，请务必在合同中写入“无锁定”政策，保证您即使在需求高峰期也能使用合适的设施。更进一步，亲自检查设施和承包商的运营计划，以确信该设施确实能够兑现“无锁定”担保，这在关键时刻至关重要。\n\
  \n#### 移动站点\n\n*移动站点*是传统恢复站点的非主流替代方案。它们通常由独立的拖车或其他易于搬迁的单元组成。这些站点包含维护安全计算环境所需的所有环境控制系统。大型企业有时会以“飞行部署”的方式维护这些站点，随时准备通过航空、铁路、海运或陆运将其部署到世界各地的任何运营地点。小型公司可能会与其所在地区的移动站点供应商签约，按需提供这些服务。\n\
  \n移动站点通常配置为冷站点或温站点，具体取决于它们设计支持的灾难恢复计划。也可以将移动站点配置为热站点，但这不太常见，因为您很少能提前知道移动站点将需要部署在何处。\n\
  \n#### 服务局\n\n*服务局*是出租计算机时间的公司。服务局拥有大型服务器场，通常还拥有工作站阵列。任何组织都可以从服务局购买合同，以使用其部分处理能力。访问方式可以是现场或远程。\n\
  \n服务局通常可以在灾难发生时为您的所有 IT 需求提供支持——甚至包括供员工使用的台式机。您与服务局的合同通常将包括测试和备份，以及响应时间和可用性。然而，服务局经常通过赌注并非所有合同会同时生效的方式，超售其实际容量。因此，在重大灾难发生后，存在资源争用的可能性。如果您的公司位于行业密集区，这可能是一个重要问题。您可能需要同时选择一家本地和一家远程的服务局，以确保在真正的灾难期间能够访问处理设施。\n\
  \n#### 云计算\n\n许多组织现在将云计算作为其首选的灾难恢复选项。基础设施即服务（IaaS）提供商，如 Amazon Web Services、Microsoft\
  \ Azure 和 Google Compute Cloud，以低成本提供按需服务。希望维护自有数据中心的公司可以选择将这些 IaaS 选项作为备份服务提供商。在云提供商处存储即时可运行的镜像通常非常具有成本效益，并允许组织避免承担大部分运营成本，直到灾难发生时云站点被激活。\n\
  \n#### 互助协议\n\n*互助协议*（MAAs），也称为*互惠协议*，在灾难恢复文献中很流行，但在实际操作中很少实施。理论上，它们提供了一个极佳的替代处理选项。根据\
  \ MAA，两个组织承诺在灾难发生时通过共享计算设施或其他技术资源来互相协助。乍一看，它们似乎极具成本效益——双方组织都不需要维护昂贵的备用处理站点（如前几节所述的热站点、温站点、冷站点和移动处理站点）。确实，许多\
  \ MAA 的结构旨在提供上述服务级别之一。在冷站点的情况下，每个组织可能只是在其处理设施中保留一些开放空间，供另一组织在灾难发生时使用。在热站点的情况下，组织可能会为彼此托管完全冗余的服务器。\n\
  \n然而，MAA 固有的许多缺点阻碍了其广泛应用：\n\n*   **MAA 难以强制执行。** 双方可能信任彼此在灾难发生时提供支持。然而，当关键时刻来临，非受灾方可能会毁约。受灾方可能有法律救济途径，但这无助于当下的灾难恢复工作。\n\
  *   **合作组织应位于相对近邻的位置**，以便于员工在站点间往返。然而，近邻意味着双方组织可能面临相同的威胁。如果地震夷平了您的城市，并摧毁了*双方*参与组织的处理站点，MAA\
  \ 将对您毫无用处。\n*   **保密顾虑**常阻止企业将数据交由他人保管。这些可能是法律顾虑（如处理医疗或财务数据时），或商业顾虑（如商业机密或其他知识产权问题）。\n\
  \n尽管存在这些顾虑，MAA 可能是组织的一个良好灾难恢复解决方案，特别是当成本是决定性因素时。如果您根本无法承担实施任何其他类型备用处理的费用，MAA 可能在局部灾难袭击您的业务时提供一定程度的宝贵保护。\n\
  \n#### 数据库恢复\n\n许多组织依赖数据库来处理和跟踪运营、销售、物流及其他对其持续生存至关重要的活动。因此，在您的灾难恢复计划中纳入数据库恢复技术至关重要。让数据库专家加入\
  \ DRP 团队，就各种想法的技术可行性提供意见，这是明智之举。毕竟，如果在不到半天的时间内无法完成恢复，您就不应该分配数小时来恢复数据库备份！\n\n在以下章节中，我们将介绍创建数据库内容异地副本的三种主要技术：电子保管、远程日志记录和远程镜像。每种技术都有特定的优缺点，因此您需要分析组织的计算需求和可用资源，以选择最适合贵公司的方案。\n\
  \n##### 电子保管\n\n在*电子保管*场景中，数据库备份通过批量传输移动到远程站点。远程位置可以是专用的备用恢复站点（如热站点），也可以是由公司内部管理或由承包商管理的异地位置，旨在维护备份数据。\n\
  \n如果您使用电子保管，请记住，在您宣布灾难发生与数据库准备好使用当前数据投入运行之间，可能存在显著延迟。如果您决定激活恢复站点，技术人员将需要从电子保管库中检索适当的备份，并将其应用于恢复站点即将投入生产的服务器上。\n\
  \n与任何类型的备份场景一样，请务必定期测试您的电子保管设置。测试备份解决方案的一个好方法是给灾难恢复人员一个“突击测试”，要求他们恢复某一天的数据。\n\n\
  ### 远程日志记录\n\n通过*远程日志记录*，数据传输以更快捷的方式执行。数据传输仍以批量传输模式进行，但频率更高，通常每小时一次，有时甚至更频繁。与电子保管场景传输整个数据库备份文件不同，远程日志记录设置传输包含自上次批量传输以来发生的事务的数据库事务日志副本。\n\
  \n\n\n\n\n### 远程日志记录\n\n远程日志记录与电子保管库类似，因为传输到远程站点的事务日志不会应用到实时数据库服务器，而是保留在备份设备中。当宣布发生灾难时，技术人员检索相应的事务日志并将其应用到生产数据库，使数据库恢复到当前的生产状态。\n\
  \n#### 远程镜像\n\n*远程镜像*是最先进的数据库备份解决方案。毫不奇怪，它也是最昂贵的！远程镜像超越了远程日志记录和电子保管库所使用的技术；通过远程镜像，备份站点维护着一台实时数据库服务器。远程服务器在主站点的生产服务器应用数据库修改的同时，接收这些修改的副本。因此，镜像服务器随时准备接管操作角色。\n\
  \n远程镜像是寻求实施热站点的组织常用的数据库备份策略。然而，在权衡远程镜像解决方案的可行性时，务必考虑到支持镜像服务器所需的基础设施和人员成本，以及将添加到镜像服务器上每个数据库事务的处理开销。\n\
  \n### 恢复计划制定\n\n一旦您确立了业务单元的优先级，并对组织合适的备用恢复站点有了很好的了解，就该动笔起草一份真正的灾难恢复计划了。不要指望坐下来一次性写完整个计划。DRP\
  \ 团队很可能会经历许多草稿文档，才能最终形成一份满足关键业务单元运营需求，且符合灾难恢复预算和可用人员的资源、时间及费用限制的最终书面文档。\n\n在以下章节中，我们将探讨一些应包含在灾难恢复计划中的重要项目。根据组织的规模和参与\
  \ DRP 工作的人数，维护多种面向不同受众的计划文档类型可能是个好主意。以下列表包含值得考虑的各类文档：\n\n*   提供计划高层概览的执行摘要\n*  \
  \ 特定部门计划\n*   面向负责实施和维护关键备份系统的 IT 人员的技术指南\n*   面向灾难恢复团队成员的核对清单\n*   面向关键灾难恢复团队成员的计划完整副本\n\
  \n当灾难发生或迫在眉睫时，使用定制化文档变得尤为重要。需要复习影响组织各部分灾难恢复程序的人员将能够参考其特定部门计划。关键灾难恢复团队成员将拥有核对清单，以帮助指导他们在灾难的混乱氛围中的行动。IT\
  \ 人员将拥有技术指南，帮助他们启动并运行备用站点。最后，管理人员和公共关系人员将拥有一份简单的文档，引导他们从高层了解正在进行的灾难恢复工作这一协调交响乐，而无需忙于直接相关任务的团队成员进行解读。\n\
  \n#### 紧急响应\n\n灾难恢复计划应包含简单而全面的指令，供关键人员在识别出灾难正在进行或迫在眉睫时立即遵循。这些指令将因灾难性质、响应事件的人员类型以及在需要疏散设施和/或关闭设备前的可用时间而大相径庭。例如，大规模火灾的指令将比针对距离预计登陆运营站点还有\
  \ 48 小时的飓风的准备指令简洁得多。紧急响应计划通常以提供给响应者的核对清单形式编制。在设计此类核对清单时，请牢记一项基本设计原则：按优先级顺序排列核对清单任务，最重要的任务排在第一位！\n\
  \n必须记住，这些核对清单将在危机中执行。响应者极有可能无法完成整个核对清单，尤其是在短通知灾难发生时。因此，您应将最基本的任务（即“激活大楼警报”）放在核对清单的首位。项目在列表中的位置越低，在疏散/关机发生前完成它的可能性就越低。\n\
  \n#### 人员与通信\n\n灾难恢复计划还应包含灾难发生时需联系的人员名单。通常，这包括 DRP 团队的关键成员以及在整个组织中执行关键灾难恢复任务的人员。此响应核对清单应包括备用联系方式（即寻呼机号码、手机号码等），以及每个角色的备用联系人，以防主要联系人无法联系或因某种原因无法到达恢复站点。\n\
  \n#### 评估\n\n当灾难恢复团队到达现场时，他们的首要任务之一是评估形势。这通常以滚动方式进行，首批响应者执行非常简单的评估以分诊活动并启动灾难响应。随着事件发展，将进行更详细的评估，以衡量灾难恢复工作的有效性并确定资源分配的优先级。\n\
  \n#### 备份与异地存储\n\n您的灾难恢复计划（尤其是技术指南）应充分阐述组织采取的备份策略。确实，这是任何业务连续性计划和灾难恢复计划中最重要的要素之一。\n\
  \n许多系统管理员已经熟悉各种类型的备份，因此，将一名或多名在该领域具有特定技术专长的人员纳入 BCP/DRP 团队以提供专家指导，将大有裨益。主要有三种备份类型：\n\
  \n##### 完全备份\n\n顾名思义，*完全备份*存储受保护设备上所含数据的完整副本。无论存档位的设置如何，完全备份都会复制系统上的每个文件。完全备份完成后，每个文件上的存档位将被重置、关闭或设置为\
  \ 0。\n\n##### 增量备份\n\n*增量备份*仅存储自最近一次完全备份或增量备份以来已修改的文件。仅复制存档位开启、启用或设置为 1 的文件。增量备份完成后，所有复制文件上的存档位将被重置、关闭或设置为\
  \ 0。\n\n##### 差异备份\n\n*差异备份*存储自最近一次完全备份以来已修改的所有文件。仅复制存档位开启、启用或设置为 1 的文件。然而，与完全备份和增量备份不同，差异备份过程不会更改存档位。\n\
  \n\n\n\n\n### 备份策略与最佳实践\n\n增量备份与差异备份最重要的区别在于紧急情况下恢复数据所需的时间。如果你采用全量备份与差异备份相结合的方式，只需恢复两个备份——最近的全量备份和最近的差量备份。另一方面，如果你的策略结合了全量备份与增量备份，则需要恢复最近的全量备份以及自该全量备份以来执行的所有增量备份。权衡之处在于创建备份所需的时间——差异备份恢复时间较短，但创建时间比增量备份长。\n\
  \n备份介质的存储同样至关重要。将备份介质存放在主运营中心内或附近或许很方便，便于轻松满足用户对备份数据的请求，但你绝对需要在至少一个异地位置保存介质副本，以便在主运营场所突然遭破坏时提供冗余。许多组织采用的一种常见策略是将备份存储在本身具有地理冗余的云服务中。这使得组织能在灾难发生后从任何位置检索备份。请注意，使用地理位置分散的站点可能会在信息驻留于不同司法管辖区时引入新的合规要求。\n\
  \n大多数组织采用的备份策略会结合使用三种备份类型中的多种，并配合介质轮换方案。这两者都能让备份管理员访问足够大范围的备份，以完成用户请求并提供容错能力，同时将必须花费在备份介质上的资金降至最低。一种常见策略是在周末执行全量备份，在每晚按夜\
  \ ly 基础执行增量或差异备份。具体的备份方法及备份程序的所有细节均取决于组织的容错要求。如果你无法承受少量数据丢失，则你的容错能力较低。然而，如果数小时或数天的数据丢失不会造成严重后果，则你的容错能力较高。你应据此设计备份解决方案。\n\
  \n#### 备份磁带格式\n\n物理特性和轮换周期是一个有价值的备份解决方案应当跟踪和管理的两个因素。物理特性涉及所用磁带驱动器的类型。这决定了介质承受的物理磨损。轮换周期是备份频率和受保护数据的保留时长。通过监管这些特性，你可以确保宝贵数据保留在可用的备份介质上。备份介质有最大使用次数限制；在通过磁带驱动器读/写磁头数千次后，介质开始失去可靠性。\n\
  \n#### 磁盘到磁盘备份\n\n过去十年间，磁盘存储变得日益廉价。随着驱动器容量现在以 TB 计量，磁带和光学介质已无法应对数据量需求。许多企业现在对其灾难恢复策略的某些部分采用磁盘到磁盘（D2D）备份解决方案。\n\
  \n许多备份技术是围绕磁带范式设计的。`虚拟磁带库（VTL）`通过使用软件使磁盘存储在备份软件中呈现为磁带，从而支持在该模型中使用磁盘。\n\n一个重要提示：寻求采用完全磁盘到磁盘方法的组织必须记住保持地理多样性。其中一些磁盘必须位于异地。许多组织通过聘请托管服务提供商来管理远程备份位置以解决此问题。\n\
  \n#### 备份最佳实践\n\n无论备份解决方案、介质或方法如何，你都必须解决备份中的几个常见问题。例如，备份和恢复活动可能庞大且缓慢。此类数据移动会显著影响网络性能，尤其是在常规生产时段。因此，备份应安排在低峰期（例如夜间）进行。\n\
  \n备份数据量随时间增长。这导致备份（和恢复）过程每次耗时更长，并在备份介质上占用更多空间。因此，你需要在备份解决方案中构建足够的容量，以在合理的时间内应对合理数量的增长。何为合理，完全取决于你的环境和预算。\n\
  \n对于定期备份（即每 24 小时运行一次的备份），始终存在丢失长达一个周期长度数据的可能性。墨菲定律表明，服务器从不会在成功备份后立即崩溃。相反，总是在下一次备份开始前才崩溃。为避免周期性问题，你需要部署某种形式的实时持续备份，如\
  \ RAID、集群或服务器镜像。\n\n最后，请记住测试组织的恢复流程。组织往往依赖备份软件报告备份成功这一事实，而直到为时已晚无法发现问题时才尝试恢复。这是导致备份失败的最大原因之一。\n\
  \n#### 磁带轮换\n\n有几种常用的备份磁带轮换策略：祖父-父-子（GFS）策略、汉诺塔策略和六盒磁带每周备份策略。这些策略可能相当复杂，尤其是在磁带集较大时。它们可以通过铅笔和日历手动实现，也可以通过商业备份软件或全自动分层存储管理（HSM）系统自动实现。HSM\
  \ 系统是一种自动化的机器人备份点唱机，由 32 或 64 个光学或磁带备份设备组成。HSM 系统内的所有驱动器元件均配置为单个驱动器阵列（有点像 RAID）。\n\
  \n### 软件托管安排\n\n`软件托管安排`是一种独特的工具，用于保护公司免受软件开发商无法为其产品提供足够支持，或开发商倒闭导致产品无技术支持可用的风险。\n\
  \n如果你的组织依赖定制开发的软件或小公司生产的软件产品，你可能需要考虑将此类安排作为灾难恢复计划的一部分进行制定。根据软件托管协议，开发商将应用程序源代码副本提供给独立的第三方组织。该第三方随后以安全的方式维护源代码的更新备份副本。最终用户与开发商之间的协议规定了“触发事件”，例如开发商未能满足服务级别协议（SLA）条款或开发商公司清算。当触发事件发生时，第三方将应用程序源代码副本发布给最终用户。最终用户随后可以分析源代码以解决应用程序问题或实施软件更新。\n\
  \n### 外部通信\n\n\n\n\n在灾难恢复过程中，需要与组织外部的各种实体进行沟通。您需要联系供应商，以便在需要时提供物资来支持灾难恢复工作。您的客户会想联系您，以确信您仍在运营。公共关系官员可能需要联系媒体或投资公司，管理人员可能需要与政府部门沟通。基于这些原因，您的灾难恢复计划必须包含通往外部世界的适当沟通渠道，且数量要足以满足您的运营需求。通常，在灾难期间让首席执行官（CEO）担任发言人并非明智的商业或恢复做法。应聘用、培训并准备一名媒体联络员来承担这一责任。\n\
  \n#### 公用设施\n\n正如本章前几节所讨论的，您的组织依赖多种公用设施来提供基础设施的关键要素——电力、水、天然气、污水处理服务等。如果在灾难期间这些服务出现问题，您的灾难恢复计划应包含联系信息和故障排除程序。\n\
  \n#### 后勤与物资\n\n灾难恢复行动周围的后勤问题极其庞大。您将突然面临将大量人员、设备和物资转移到备用恢复站点的问题。人员也有可能在这些站点居住较长一段时间，而灾难恢复团队将负责为他们提供食物、水、住所和适当的设施。如果这属于您预期运营需求的范围，您的灾难恢复计划应包含此类行动的规定。\n\
  \n#### 恢复与重建\n\n有时将灾难恢复任务与灾难重建任务分开是有用的。当恢复工作预计需要大量时间时，这一点尤其正确。灾难恢复团队可被指派在恢复站点实施和维护运营，而抢救团队则被指派将主站点恢复到运营能力。应根据组织的需求和面临的灾难类型做出这些分配。\n\
  \n恢复团队成员的操作时间框架非常短。他们必须将 DRP 付诸行动，并尽快恢复 IT 能力。如果恢复团队未能在 MTD/RTO 内恢复业务流程，则公司将面临倒闭。\n\
  \n一旦原站点被认定人员可以安全进入，抢救团队成员便开始工作。他们的工作是将公司恢复到完全的原始能力，并在必要时恢复到原始位置。如果原始位置不复存在，则会选择一个新的主站点。抢救团队必须重建或修复\
  \ IT 基础设施。由于这项活动基本上与建设新 IT 系统相同，因此从备用/恢复站点返回主/原始站点的活动本身就是一项有风险的活动。幸运的是，抢救团队的工作时间比恢复团队更充裕。\n\
  \n抢救团队必须确保新 IT 基础设施的可靠性。这是通过将最不关键的任务流程返回到恢复后的原始站点来对重建的网络进行压力测试来完成的。随着恢复站点显示出弹性，更重要的流程会被转移。当任务关键型流程返回原始站点时，存在严重的脆弱性。返回原始站点的行为本身可能引发灾难。因此，在完全正常的运营返回恢复后的原始站点之前，不能宣布紧急状态结束。\n\
  \n在任何灾难恢复工作结束时，最终将到来恢复主站点运营并终止在灾难恢复协议下运行的任何处理站点的时候。您的 DRP 应规定用于确定何时适合返回主站点的标准，并指导\
  \ DRP 恢复团队和抢救团队进行有序过渡。\n\n#### 培训、意识与文档\n\n与业务连续性计划一样，为所有参与灾难恢复工作的人员提供培训至关重要。所需培训的程度将根据个人在工作中的角色及其在公司中的职位而有所不同。在设计培训计划时，请考虑包含以下要素：\n\
  \n*   面向所有新员工的入职培训\n*   面向首次承担灾难恢复角色的员工的初始培训\n*   面向灾难恢复团队成员的详细复训培训\n*   面向所有其他员工的简短意识复训（可作为其他会议的一部分完成，并通过发送给所有员工的电子邮件简报等媒介进行）\n\
  \n灾难恢复计划也应有完整的文档记录。本章前面我们讨论了几种可用的文档选项。请务必实施必要的文档计划，并随计划的变更修改文档。考虑到灾难恢复和业务连续性计划快速变化的性质，您可以考虑在组织内部网的安全区域发布。\n\
  \n您的 DRP 应被视为极其敏感的文件，仅按分隔、需知原则提供给相关人员。参与计划的个人应充分了解其角色，但无需知晓或访问整个计划。当然，必须确保关键 DRP\
  \ 团队成员和高级管理层能够访问整个计划并了解高层实施细节。您肯定不希望这些知识仅存在于某一个人的脑海中。\n\n#### 测试与维护\n\n每个灾难恢复计划都必须定期进行测试，以确保计划条款切实可行，并满足组织不断变化的需求。您进行的测试类型将取决于您可用的恢复设施类型、组织的文化以及灾难恢复团队成员的可用性。本章剩余部分将讨论五种主要测试类型——核对表测试、结构化演练、模拟测试、并行测试和全面中断测试。\n\
  \n##### 通读测试\n\n`通读测试` 是最简单的测试之一，但也是最关键的测试之一。在此测试中，您将灾难恢复计划的副本分发给灾难恢复团队成员进行审查。这可让您同时实现三个目标：\n\
  \n*   确保关键人员了解其职责，并定期刷新这些知识。\n*   为个人提供审查计划以查找过时信息的机会，并更新因组织变更而需要修改的任何项目。\n*   在大型组织中，有助于识别关键人员已离职但无人重新分配其灾难恢复职责的情况。这也是将灾难恢复职责纳入职位描述的充分理由。\n\
  \n##### 结构化演练\n\n`结构化演练` 将测试推进了一步。在此类测试中，通常称为 `桌面演练`，灾难恢复团队成员聚集在一个大型会议室中，对灾难场景进行角色扮演。通常，确切场景仅测试主持人知晓，由其在会议上向团队展示细节。然后团队成员参考其灾难恢复计划副本，讨论针对该特定类型灾难的适当响应。\n\
  \n##### 模拟测试\n\n\n\n*模拟测试* 类似于结构化演练。在模拟测试中，灾难恢复团队成员会面对一个场景，并被要求制定适当的响应措施。与前面讨论的测试不同，这些响应措施中的一些会被实际测试。这可能涉及中断非关键业务活动，并使用部分运营人员。\n\
  \n##### 并行测试\n\n*并行测试* 代表了测试的下一个层级，涉及将人员转移到备用恢复站点并实施站点激活程序。被转移到该站点的员工执行其灾难恢复职责，就像应对实际灾难一样。唯一的区别是主设施的运营不会中断。该站点保留全权负责组织的日常业务运作。\n\
  \n##### 全中断测试\n\n*全中断测试* 的运作方式类似于并行测试，但涉及实际关闭主站点的运营并将其转移到恢复站点。这些测试涉及重大风险，因为它们要求关闭主站点的运营并转移到恢复站点，随后再执行反向过程以恢复主站点的运营。因此，全中断测试极难安排，且往往会遇到管理层的抵制。\n\
  \n##### 维护\n\n请记住，灾难恢复计划是一个动态文档。随着组织需求的变化，您必须调整灾难恢复计划以满足这些变化的需求。您将通过使用组织良好且协调一致的测试计划来发现许多必要的修改。次要变更通常可通过一系列电话会议或电子邮件完成，而重大变更可能需要召开一次或多次全体灾难恢复团队会议。\n\
  \n灾难恢复规划师应参考组织的业务连续性计划，将其作为恢复工作的模板。该计划及所有支持材料必须符合联邦法规，并反映当前的业务需求。薪资发放和订单生成等业务流程应包含映射到相关\
  \ IT 系统和基础设施的指定指标。\n\n大多数组织采用正式的变更管理流程，以便每当 IT 基础设施发生变更时，所有相关文档都会被更新并核查以反映这些变更。定期安排的消防演习和空跑演练，旨在确保\
  \ DRP 的所有要素都被正确使用以保持员工受训状态，这为将变更整合到常规维护和变更管理程序中提供了绝佳机会。每次经历这些流程和演练时，都要设计、实施并记录变更。了解所有资源的位置，并保持\
  \ DRP 每个要素正常运行。紧急情况下，使用您的恢复计划。最后，确保员工持续受训以保持技能敏锐——针对现有支持人员——并利用模拟演练让新员工迅速上手。\n\n\
  ### 摘要\n\n灾难恢复规划是全面信息安全计划的关键。DRP 作为业务连续性计划的宝贵补充，确保适当的技术控制到位，以维持业务运作并在中断后恢复服务。\n\n\
  在本章中，您了解了可能影响您业务的不同类型的自然灾害和人为灾害。您还探讨了增强恢复能力的恢复站点类型和备份策略。\n\n组织的灾难恢复计划是安全专业人员职责范围内最重要的文档之一。它应为负责在灾难面前确保业务连续性的人员提供指导。DRP\
  \ 提供了一系列有序的事件，旨在激活备用处理站点，同时将主站点恢复到运行状态。一旦您成功制定了 DRP，就必须培训人员使用它，确保维护准确的文档，并定期进行测试，以使响应人员对计划记忆犹新。\n\
  \n### 考试要点\n\n**了解可能威胁组织的常见自然灾害类型。** 常见威胁组织的自然灾害包括地震、洪水、风暴、火灾、海啸和火山爆发。\n\n**了解可能威胁组织的常见人为灾害类型。**\
  \ 爆炸、电气火灾、恐怖袭击、停电、其他公用设施故障、基础设施故障、硬件/软件故障、劳资纠纷、盗窃和破坏行为都是常见的人为灾害。\n\n**熟悉常见的恢复设施类型。**\
  \ 常见的恢复设施包括冷站点、温站点、热站点、移动站点、服务局和多站点。务必了解每种设施的优缺点。\n\n**解释互助协议的潜在优势，以及它们为何在当今企业中不常被实施。**\
  \ 互助协议 (MAA) 为灾难恢复站点提供了一种低成本的替代方案，但由于难以强制执行，因此不常被使用。参与 MAA 的组织也可能因同一场灾难而关闭，且 MAA\
  \ 引发了保密性担忧。\n\n**了解可能协助数据库备份的技术。** 数据库受益于三种备份技术。电子保管库用于将数据库备份作为批量传输的一部分传送到远程站点。在远程日志记录中，数据传输以更频繁的频率发生。使用远程镜像技术，数据库事务会在备份站点实时镜像。\n\
  \n**了解灾难恢复计划测试的五种类型及每种类型对正常业务运营的影响。** 灾难恢复计划测试的五种类型是通读测试、结构化演练、模拟测试、并行测试和全中断测试。核对表测试纯粹是文书工作，而结构化演练涉及项目团队会议。这两者均不影响业务运营。模拟测试可能会关闭非关键业务单元。并行测试涉及人员转移，但不影响日常运营。全中断测试涉及关闭主系统并将责任转移给恢复设施。\n\
  \n### 书面实验\n\n1.  企业在考虑采用互助协议时有哪些主要顾虑？\n\n2.  列出并解释灾难恢复测试的五种类型。\n\n3.  解释本章讨论的三种备份策略之间的区别。\n\
