  \n## 第 10 章：物理安全要求\n\n## 1. A. 物理安全是整体安全最重要的方面。没有物理安全，其他任何安全方面都不再充分。\n\n## 2. B.\
  \ 关键路径分析可用于规划组织对新设施的需求。关键路径分析是识别关键任务应用程序、流程和操作与所有支持要素之间关系的过程。\n\n## 3. B. 布线间是一种基础设施组件，通常位于多层楼的相同位置，以便为将各楼层网络链接在一起提供便捷途径。\n\
  \n## 4. D. 对设施内所有位置的平等访问并非以安全为中心的设计要素。每个包含不同重要性、价值和机密性的资产或资源的区域，都应施加相应级别的安全限制。\n\
  \n## 5. A. 计算机机房无需适合人类工作即可实现高效和安全。拥有人类不适宜的服务器机房能提供更高级别的防攻击保护。\n\n## 6. C. 哈希并非针对包含可重复使用可移动介质的介质存储设施所实施的典型安全措施。哈希用于在必要时验证数据集的完整性，而可重复使用可移动介质上的数据应被移除而非保留。通常，介质存储设施的安全特性包括使用管理员或保管员、使用签入/签出流程，以及对归还的介质使用清理工具。\n\
  \n## 7. C. 访问控制门禁区（人员锁/夹心层）是一组双重门，通常由警卫看管，用于在验证对象的身份和认证之前将其控制在内部。\n\n## 8. D. 照明是最常见的周界安全设备或机制。您的整个场地应光线充足。这便于识别人员，并使发现入侵更加容易。\n\
  \n## 9. A. 安全警卫通常不了解设施内业务操作的范围，这支持了这些操作的机密性，从而有助于降低安全警卫卷入机密信息泄露的可能性。\n\n\n\n\n\n\
  # 练习题答案与解析\n\n## 物理安全与环境安全（第 10-20 题）\n\n### 10. B\n基于水的灭火系统最常见的故障原因是人为错误。如果你在火灾后关闭水源却忘记重新打开，将来会遇到麻烦。此外，在无火灾情况下拉响警报会触发破坏性的水释放，波及整个办公室。\n\
  \n### 11. C\n钥匙锁是最常见且最廉价的物理访问控制设备形式。照明、保安和围栏的成本都高得多。\n\n### 12. D\n电容式运动探测器可感应受监控物体周围电场或磁场的变化。\n\
  \n### 13. A\n不存在预防性警报这一说法。警报总是响应检测到的入侵或攻击而触发。\n\n### 14. B\n无论使用何种形式的物理访问控制，都必须部署保安或其他监控系统以防止滥用、伪装和尾随。间谍活动无法通过物理访问控制来预防。\n\
  \n### 15. C\n人员安全是所有安全解决方案最重要的目标。\n\n### 16. B\n计算机机房的湿度理想范围应为 40% 至 60%。\n\n###\
  \ 17. D\n存储在硬盘上的数据可能因 1,500 伏特的静电而被破坏。\n\n### 18. A\n水绝不是 B 类灭火器的灭火介质，因为 B 类灭火器用于扑灭液体火灾。\n\
  \n### 19. C\n预作用系统是计算机设施最佳的基于水的火灾抑制系统类型。\n\n### 20. D\n光线通常不会损坏大多数计算机设备，但火灾、烟雾和灭火介质（通常是水）具有极强的破坏性。\n\
  \n---\n\n## 第 11 章：安全网络架构与网络组件安全\n\n### 1. D\n传输层是第 4 层。表示层是第 6 层，数据链路层是第 2 层，网络层是第\
  \ 3 层。\n\n### 2. B\n封装是指数据在 OSI 协议栈向下移动时添加首部和尾部。\n\n### 3. B\n第 5 层（会话层）管理单工（单向）、半双工（双向，但同一时间只能单向发送数据）和全双工（双向，数据可同时双向发送）通信。\n\
  \n### 4. B\n`UTP`（非屏蔽双绞线）对 `EMI`（电磁干扰）的抵抗能力最弱，因为它未屏蔽。`Thinnet`（`10Base2`）是一种屏蔽同轴电缆，可抵抗\
  \ `EMI`。`STP`（屏蔽双绞线）是抗 `EMI` 的屏蔽双绞线形式。光纤不受地源 `EMI` 影响。\n\n### 5. D\n`VPN`（虚拟专用网）是一种安全隧道，用于跨潜在不安全的中介网络建立连接。内联网、外联网和\
  \ `DMZ` 是网络分段的示例。\n\n### 6. B\n`RFID`（射频识别）是一种追踪技术，基于当天线置于磁场中时产生的电流为无线电发射器供电的能力。`RFID`\
  \ 可在相当远的距离（通常数百米）外被触发/供电并读取。\n\n### 7. C\n`Bluejacking` 攻击（蓝牙劫持）是针对蓝牙的无线攻击，`Bluejacking`\
  \ 攻击中最常见的受害设备是手机。\n\n### 8. A\n以太网基于 `IEEE 802.3` 标准。\n\n### 9. B\n`TCP Wrapper`（TCP\
  \ 包装器）是一种应用程序，可通过基于用户 ID 或系统 ID 限制访问，充当基本防火墙。\n\n### 10. B\n封装既是多层协议的优势，也是其潜在的有害影响。\n\
  \n### 11. C\n状态检测防火墙能为授权用户和活动授予更广泛的访问权限，并主动监视和阻止未授权用户和活动。\n\n### 12. B\n状态检测防火墙被称为第三代防火墙。\n\
  \n### 13. B\n大多数防火墙提供广泛的日志记录、审计和监控功能，以及警报甚至基本的 `IDS`（入侵检测系统）功能。防火墙无法阻止通过其他授权通信通道传输的病毒或恶意代码，无法防止用户未授权的意外或故意信息泄露，无法防止已在防火墙内部的恶意用户发动攻击，也无法保护数据在传出或进入私有网络后的安全。\n\
  \n### 14. C\n存在多种动态路由协议，包括 `RIP`、`OSPF` 和 `BGP`，但 `RPC` 不是路由协议。\n\n### 15. B\n交换机是一种智能集线器。之所以称为智能，是因为它知道连接在每个出站端口上的系统地址。\n\
  \n### 16. A\n`WAP`（无线应用协议）是与手机接入互联网相关的技术，而非 `802.11` 无线网络。\n\n### 17. C\n`OFDM`（正交频分复用）以最小的干扰提供高吞吐量。`OSPF`\
  \ 是路由协议，而非无线频率接入方法。\n\n### 18. A\n端点安全是一种安全理念，鼓励管理员在每台主机上安装防火墙、恶意软件扫描器和 `IDS`。\n\
  \n### 19. B\n`ARP`（地址解析协议）将 `IP` 地址（逻辑地址）解析为 `MAC` 地址（物理地址）。\n\n### 20. C\n企业扩展基础设施模式是指无线网络设计为通过单个\
  \ `SSID` 但众多接入点来支持大型物理环境。\n\n---\n\n## 第 12 章：安全通信与网络攻击\n\n### 1. B\n`Frame Relay`（帧中继）是一种第\
  \ 2 层连接机制，使用分组交换技术在通信端点之间建立虚拟电路。`Frame Relay` 网络是一种共享介质，跨其创建虚拟电路以提供点对点通信。所有虚拟电路相互独立且不可见。\n\
  \n### 2. D\n独立系统无需隧道技术，因为系统间不存在通信，也不存在中介网络。\n\n### 3. C\n`IPsec`（IP 安全）是一种基于标准的机制，用于为点对点\
  \ `TCP/IP` 流量提供加密。\n\n### 4. B\n`169.254.x.x` 子网属于 `APIPA` 范围，不属于 `RFC 1918`。`RFC\
  \ 1918` 定义的地址为：`10.0.0.0–10.255.255.255`、`172.16.0.0–172.31.255.255` 和 `192.168.0.0–192.168.255.255`。\n\
  \n### 5. D\n建立 `VPN` 链路需要中介网络连接。\n\n### 6. B\n需要静态模式 `NAT` 以允许外部实体发起与 `NAT` 代理后内部系统的通信。\n\
  \n### 7. A, B, D\n`L2F`、`L2TP` 和 `PPTP` 均缺乏原生数据加密。只有 `IPsec` 包含原生数据加密。\n\n### 8.\
  \ D\n`IPsec` 在网络层（第 3 层）运行。\n\n### 9. B\n`VoIP`（IP 语音）允许通过现有 `TCP/IP` 网络和互联网连接进行电话通话。\n\
  \n### 10. D\n`NAT` 无法防范或阻止暴力破解攻击。\n\n### 11. B\n当透明性是服务、安全控制或访问机制的特征时，它对用户不可见。\n\
  \n### 12. B\n虽然可用性是安全的关键方面，但它是面向互联网交付的电子邮件安全系统中最不重要的方面。\n\n### 13. D\n备份方法不是与最终用户讨论电子邮件保留时的重要因素。\n\
  \n### 14. B\n邮件炸弹是将电子邮件作为攻击机制。向系统发送大量消息会导致拒绝服务。\n\n### 15. B\n垃圾邮件往往难以阻止，因为消息来源通常被伪造。\n\
  \n### 16. B\n永久虚拟电路（`PVC`）可描述为始终存在并等待客户发送数据的逻辑电路。\n\n### 17. B\n更改 `PBX` 系统的默认密码能带来最有效的安全性提升。\n\
  \n### 18. C\n社会工程学常可绕过即使是最有效的物理和逻辑控制。攻击者说服受害者执行的任何活动，通常旨在打开一个后门，供攻击者用以获取网络访问权限。\n\
  \n### 19. C\n暴力破解攻击不被视为 `DoS`（拒绝服务）攻击。\n\n\n\n\n\n# 20. A. 密码认证协议 (PAP)\n\n密码认证协议\
  \ (PAP) 是一种用于 PPP 的标准化认证协议。PAP 以明文形式传输用户名和密码。它不提供任何形式的加密。它仅提供一种将登录凭据从客户端传输到认证服务器的方法。\n\
  \n## 第 13 章：管理身份与认证\n\n## 1. E. 资产保护\n\n所有答案都包含在组织尝试使用访问控制进行保护的资产类型中。\n\n## 2. C.\
  \ 主体与客体\n\n主体是主动的，始终是接收关于客体的信息或来自客体的数据的实体。主体可以是用户、程序、进程、文件、计算机、数据库等。客体始终是提供或托管信息或数据的实体。在两个实体通信以完成任务时，主体和客体的角色可以互换。\n\
  \n## 3. A. 预防性访问控制\n\n预防性访问控制有助于阻止不想要的或未经授权的活动发生。检测性控制在活动发生后发现它，纠正性控制尝试反转活动造成的任何问题。权威性不是一种有效的访问控制类型。\n\
  \n## 4. B. 逻辑/技术访问控制\n\n逻辑/技术访问控制是用于管理对资源和系统的访问并为这些资源和系统提供保护的硬件或软件机制。管理控制是管理层面的控制，物理控制使用物理项目来控制物理访问。预防性控制试图防止安全事件。\n\
  \n## 5. A. 访问控制目标\n\n控制对资产访问的一个主要目标是防止损失，包括机密性丧失、可用性丧失或完整性丧失。主体在系统上进行认证，但客体不进行认证。主体访问客体，但客体不访问主体。标识和认证作为访问控制的第一步很重要，但保护资产还需要更多措施。\n\
  \n## 6. D. 标识、认证、授权、审计\n\n用户通过登录 ID 宣称身份。登录 ID 和密码的组合提供认证。主体在认证后被授权访问客体。日志记录和审计提供审计追踪（问责制）。\n\
  \n## 7. D. 审计追踪（问责制）\n\n审计追踪（问责制）不包含授权。审计追踪需要适当的标识和认证。认证后，审计追踪需要日志记录以支持审计。\n\n##\
  \ 8. B. 密码历史\n\n密码历史可以防止用户在两个密码之间轮换使用。它记录之前使用过的密码。密码复杂度和密码长度有助于确保用户创建强密码。密码使用期限确保用户定期更改密码。\n\
  \n## 9. B. 密码短语\n\n密码短语是一串易于记忆的长字符，例如 `IP@$$edTheCISSPEx@m`。它不短，且通常包含所有四种字符类型。它强壮且复杂，难以破解。\n\
  \n## 10. A. 类型 2 认证因子\n\n类型 2 认证因子基于你拥有的东西，例如智能卡或令牌设备。类型 3 认证基于你是谁，有时也基于你做什么，使用物理和行为生物识别方法。类型\
  \ 1 认证基于你知道的东西，例如密码或 PIN 码。\n\n## 11. A. 同步令牌\n\n同步令牌生成并显示一次性密码，这些密码与认证服务器同步。异步令牌使用质询-响应过程生成一次性密码。智能卡不生成一次性密码，通用访问卡是包含用户照片的一种智能卡。\n\
  \n## 12. B. 物理生物识别\n\n物理生物识别方法（如指纹和虹膜扫描）为主体提供认证。账户 ID 提供标识。令牌是你拥有的东西，它创建一次性密码，但与物理特征无关。个人识别号\
  \ (PIN) 是你知道的东西。\n\n## 13. C. 交叉错误率 (CER)\n\n生物识别误拒率和误纳率相等的点称为交叉错误率 (CER)。它不表示灵敏度过高或过低。较低的\
  \ CER 表示质量更高的生物识别设备，较高的 CER 表示准确性较低的设备。\n\n## 14. A. 误拒 (I 类错误)\n\n误拒，有时称为假阴性认证或\
  \ I 类错误，发生在有效主体（本例中的 Sally）未被认证时。II 类错误（误纳，有时称为假阳性认证或 II 类错误）发生在无效主体被认证时。交叉错误和等错误不是与生物识别相关的有效术语。然而，交叉错误率（也称为等错误率）将误拒率与误纳率进行比较，并为生物识别系统提供准确性度量。\n\
  \n## 15. C. Kerberos 主要目的\n\nKerberos 的主要目的是认证，因为它允许用户证明其身份。它还使用对称密钥加密提供一定程度的机密性和完整性，但这些不是主要目的。Kerberos\
  \ 不包含日志记录功能，因此不提供审计追踪（问责制）。\n\n## 16. D. SAML\n\nSAML 是一种基于 XML 的框架，用于在联合身份管理系统中组织之间交换用户信息以实现单点登录\
  \ (SSO)。Kerberos 支持单个组织内的 SSO，而非联合。HTML 仅描述数据如何显示。XML 也可使用，但需要重新定义 SAML 中已定义的标签。\n\
  \n## 17. B. RADIUS 架构\n\n网络接入服务器是 RADIUS 架构中的客户端。RADIUS 服务器是认证服务器，提供认证、授权和审计 (AAA)\
  \ 服务。网络接入服务器可能启用了主机防火墙，但这不是其主要功能。\n\n## 18. B. Diameter\n\nDiameter 基于远程认证拨号用户服务\
  \ (RADIUS)，并支持移动 IP 和 IP 语音 (VoIP)。分布式访问控制系统（如联合身份管理系统）不是特定协议，且不一定提供认证、授权和审计。TACACS\
  \ 和 TACACS+ 是认证、授权和审计 (AAA) 协议，但它们是 RADIUS 的替代方案，而非基于 RADIUS。\n\n## 19. D. 最小权限原则\n\
  \n最小权限原则被违反，因为他保留了在不同部门担任的所有前任管理员职位的特权。隐式拒绝确保仅允许明确授予的访问，但该管理员被明确授予了特权。虽然管理员的行为可能导致可用性丧失，但可用性丧失不是基本原则。防御性特权不是有效的安全原则。\n\
  \n## 20. D. 账户审查\n\n账户审查可以发现用户拥有的权限超出其需求，本可用于发现该员工拥有来自多个职位的权限。强认证方法（包括多因素认证方法）无法防止此场景中的问题。日志记录可记录活动，但需要审查才能发现问题。\n\
  \n# 第 14 章：控制与监控访问\n\n## 1. B. 隐式拒绝\n\n隐式拒绝原则确保除非明确允许（或显式授予）主体访问，否则拒绝对客体的访问。它不允许所有未被拒绝的操作，也不要求拒绝所有操作。\n\
  \n## 2. C. 最小权限原则\n\n最小权限原则确保用户（主体）仅被授予执行其工作任务和职能所需的最严格权限。用户不执行系统进程。最小权限原则不强制执行最宽松的权限，而是最严格的权限。\n\
  \n\n\n\n\n## 3. B\n访问控制矩阵包含多个对象，并列出主体对每个对象的访问权限。访问控制矩阵中任一特定对象的主体单一列表即为访问控制列表（ACL）。联邦是指共享联合身份管理系统以实现单点登录的一组公司。权限蔓延是指主体随时间积累的过度权限。\n\
  \n## 4. D\n在自主访问控制（DAC）模型中，数据保管员（或所有者）向用户授予权限。管理员仅为其拥有的资源授予权限，而非 DAC 模型中的所有资源。基于规则的访问控制模型使用访问控制列表。强制访问控制（MAC）模型使用标签。\n\
  \n## 5. A\n自主访问控制（DAC）模型是一种基于身份的访问控制模型。它允许资源所有者（或数据保管员）根据所有者的意愿授予权限。基于角色的访问控制（RBAC）模型基于角色或组成员身份。基于规则的访问控制模型基于\
  \ ACL 中的规则。强制访问控制（MAC）模型使用分配的标签来标识访问权限。\n\n## 6. D\n非自主访问控制模型使用中央权威机构来确定用户（及其他主体）可访问哪些对象（如文件）。相反，自主访问控制（DAC）模型允许用户授予或拒绝对其拥有的任何对象的访问。ACL\
  \ 是基于规则的访问控制模型的一个示例。访问控制矩阵包含多个对象，并列出主体对每个对象的访问权限。\n\n## 7. D\n基于角色的访问控制（RBAC）模型可根据组织层级将用户分组为角色，它是一种非自主访问控制模型。非自主访问控制模型使用中央权威机构来确定主体可访问哪些对象。相反，自主访问控制（DAC）模型允许用户授予或拒绝对其拥有的任何对象的访问。ACL\
  \ 是一种基于规则而非角色的基于规则的访问控制模型示例。\n\n## 8. A\n基于角色的访问控制（RBAC）模型基于角色或组成员身份，用户可以是多个组的成员。用户不限于单一角色。RBAC\
  \ 模型基于组织层级，因此它们是基于层级的。强制访问控制（MAC）模型使用分配的标签来标识访问权限。\n\n## 9. D\n程序员是基于角色的访问控制（RBAC）模型中的有效角色。管理员将程序员的用户账户放入“程序员”角色，并向该角色分配权限。角色通常用于组织用户，其他选项均非用户。\n\
  \n## 10. D\n基于规则的访问控制模型使用全局规则，平等地应用于所有用户和其他主体。它不在本地应用规则，也不针对单个用户应用规则。\n\n## 11.\
  \ C\n防火墙使用基于规则的访问控制模型，规则在访问控制列表中表达。强制访问控制（MAC）模型使用标签。自主访问控制（DAC）模型允许用户分配权限。基于角色的访问控制（RBAC）模型将用户组织在组中。\n\
  \n## 12. C\n强制访问控制（MAC）模型依赖于对主体和对象使用标签。自主访问控制（DAC）模型允许对象所有者控制对该对象的访问。非自主访问控制具有集中管理，例如部署在防火墙上的基于规则的访问控制模型。基于角色的访问控制（RBAC）模型基于与工作相关的角色定义主体的访问权限。\n\
  \n## 13. D\n强制访问控制（MAC）模型是禁止性的，它使用隐式拒绝理念（而非显式拒绝理念）。它不是宽容性的，并且使用标签而非规则。\n\n## 14.\
  \ D\n基于合规的访问控制模型不是有效的访问控制模型类型。其他选项列出了有效的访问控制模型。\n\n## 15. C\n漏洞分析识别弱点，可包括定期漏洞扫描和渗透测试。资产估值确定资产价值，而非弱点。威胁建模试图识别威胁，但不识别弱点。访问审查审核账户管理和对象访问实践。\n\
  \n## 16. B\n账户锁定策略会在用户输入错误密码次数过多后锁定账户，从而阻止在线暴力破解攻击。攻击者在离线密码攻击中使用彩虹表。密码盐值降低彩虹表的有效性。加密存储的密码可保护密码，但若无账户锁定，对暴力破解攻击无效。\n\
  \n## 17. B\n哈希密码时同时使用盐值和胡椒值可提供强大的防彩虹表攻击保护。MD5 不再被视为安全，因此不适合用于哈希密码。账户锁定有助于阻止在线密码暴力破解攻击，但彩虹表攻击属于离线攻击。基于角色的访问控制（RBAC）是一种访问控制模型，与密码攻击无关。\n\
  \n## 18. C\n鲸钓攻击是针对高层管理人员的一种网络钓鱼形式。鱼叉式网络钓鱼针对特定人群，但不一定是高层管理人员。语音钓鱼是一种常用语音过 IP（VoIP）的网络钓鱼形式。\n\
  \n## 19. B\n威胁建模有助于识别、理解和分类潜在威胁。资产估值识别资产价值，漏洞分析识别可被威胁利用的弱点。访问审查和审计确保账户管理实践支持安全策略。\n\
  \n## 20. A\n资产估值识别资产的实际价值，以便对其进行优先级排序。例如，它会识别公司因客户数据丢失而导致的声誉价值，与恶意员工窃取的秘密数据价值相比。其他选项均不专注于高价值资产。威胁建模结果识别潜在威胁。漏洞分析识别弱点。审计跟踪有助于重现事件发生前的过程。\n\
  \n### 第 15 章：安全评估与测试\n\n## 1. A\n`Nmap` 是一种网络发现扫描工具，用于报告远程系统上的开放端口。\n\n## 2. D\n\
  仅开放端口代表潜在的重大安全风险。Web 服务器上预期会开放 80 和 443 端口。1433 端口是数据库端口，绝不应暴露在外部网络中。\n\n## 3. C\n\
  系统上存储信息的敏感性、执行测试的难度以及攻击者以该系统为目标的可能性，都是规划安全测试计划时的有效考量因素。尝试新测试工具的愿望不应影响生产环境测试计划。\n\
  \n## 4. C\n安全评估包含多种类型的测试，旨在识别漏洞，评估报告通常包含缓解建议。然而，评估本身不包括对这些漏洞的实际缓解。\n\n## 5. A\n\
  安全评估报告应提交给组织管理层。因此，报告应使用通俗易懂的英语编写，避免使用技术术语。\n\n## 6. B\n使用 8 位子网掩码意味着 IP 地址的第一个八位字节代表网络地址。在本例中，这意味着\
  \ `10.0.0.0/8` 将扫描以 10 开头的任何 IP 地址。\n\n## 7. B\n服务器可能正在 80 端口运行网站。使用 Web 浏览器访问该站点可能提供关于站点用途的重要信息。\n\
  \n## 8. B\n`SSH` 协议使用 22 端口接受对服务器的管理连接。\n\n## 9. D\n经过认证的扫描可从目标系统读取配置信息，并减少误报和漏报的实例。\n\
  \n\n\n\n\n# 练习题答案与解析\n\n## 10. C\nTCP SYN 扫描发送 SYN 数据包并接收 SYN ACK 数据包作为响应，但它不会发送完成三次握手所需的最后一个\
  \ ACK。\n\n## 11. D\nSQL 注入攻击属于 Web 漏洞，Matthew 最好使用 Web 漏洞扫描器。网络漏洞扫描器也可能发现此漏洞，但 Web\
  \ 漏洞扫描器是专门为该任务设计的，更有可能成功。\n\n## 12. C\nPCI DSS 要求 Badin 至少每年对应用程序进行一次重新扫描，并在应用程序发生任何更改后进行扫描。\n\
  \n## 13. B\nMetasploit 是一种自动化漏洞利用工具，允许攻击者轻松执行常见的攻击技术。\n\n## 14. C\n变异模糊测试使用位翻转和其他技术轻微修改程序的先前输入，以尝试检测软件缺陷。\n\
  \n## 15. A\n误用用例测试识别攻击者可能利用系统的已知方式，并显式测试这些攻击是否在拟议代码中可行。\n\n## 16. B\n用户界面测试包括对软件程序的图形用户界面（GUI）和命令行界面（CLI）进行评估。\n\
  \n## 17. B\n在白盒渗透测试期间，测试人员可以访问待测系统的详细配置信息。\n\n## 18. B\n未加密的 HTTP 通信默认通过 TCP 80\
  \ 端口进行。\n\n## 19. C\nFagan 检查流程以跟进阶段结束。\n\n## 20. B\n备份验证过程确保备份正常运行，从而满足组织的数据保护目标。\n\
  \n### 第 16 章：管理安全运营\n\n## 1. C\n“需知”原则是指执行特定工作任务所需的访问权限、知识获取或数据持有，且不得超出此范围。`最小权限原则`\
  \ 包括权利和权限，但“最小许可原则”在 IT 安全中不是有效术语。`职责分离` 确保单个人不控制流程的所有要素。`基于角色的访问控制（RBAC）` 根据角色授予资源访问权限。\n\
  \n## 2. D\n默认访问级别应为无访问权限。`最小权限原则` 规定用户应仅被授予其工作所需的访问级别，题目未表明新用户需要任何数据库访问权限。读取访问、修改访问和完全访问都会授予用户一定级别的访问权限，这违反了最小权限原则。\n\
  \n## 3. C\n`职责分离` 策略防止单个人控制流程的所有要素，应用于安全设置时，可防止个人在无协助情况下进行重大安全更改。`工作轮换` 有助于确保多人能胜任同一工作，并在单个人离职时防止组织信息流失。让员工专注于特长与职责分离无关。\n\
  \n## 4. B\n`工作轮换` 和 `职责分离` 策略有助于防止欺诈。`串通` 是指多人达成协议实施未经授权或非法行为，实施这些策略无法防止串通，也不会鼓励员工串通对抗组织。它们有助于威慑和预防事件，但无法纠正事件。\n\
  \n## 5. A\n`工作轮换` 策略让员工轮换工作或职责，有助于发现串通和欺诈事件。`职责分离` 策略确保单个人不控制特定功能的所有要素。`强制休假` 策略确保员工长时间离岗，由他人履行其职责，从而增加发现欺诈的可能性。`最小权限`\
  \ 确保用户仅拥有执行工作所需的权限，不多不少。\n\n## 6. B\n`强制休假` 策略有助于发现欺诈。它要求员工长时间离岗，由他人履行其职责，从而增加发现欺诈的可能性。它不轮换工作职责。虽然强制休假可能帮助员工降低整体压力水平，进而提高生产力，但这些不是强制休假策略的主要原因。\n\
  \n## 7. A, B, C\n`工作轮换`、`职责分离` 和 `强制休假` 策略都有助于减少欺诈。`基线化` 用于配置管理，无助于减少串通或欺诈。\n\n\
  ## 8. B\n不应平等地向管理员和操作员授予特殊权限。相反，人员应仅被授予执行其工作所需的特权。`特殊权限` 是指需要特殊访问或提升权限来执行管理和敏感工作任务的活动。这些特权的分配和使用应受到监控，且仅授予受信任的员工。\n\
  \n## 9. A\n`服务级别协议（SLA）` 标识第三方（如供应商）的责任，并可在供应商未履行规定责任时包含金钱罚则。`谅解备忘录（MOU）` 是非正式协议，不包含金钱罚则。`互连安全协议（ISA）`\
  \ 定义建立、维护和断开连接的要求。`SaaS` 是云服务模型之一，不规定供应商责任。\n\n## 10. C\n系统在生命周期结束时应进行清理，以确保不包含任何敏感数据。移除\
  \ CD 和 DVD 是清理过程的一部分，但系统的其他要素（如磁盘驱动器）也应检查以确保不包含敏感信息。除非组织的清理流程要求，否则移除软件许可证或安装原始软件并非必须。\n\
  \n## 11. A\n贵重资产需要多层物理安全防护，将数据中心置于建筑物中心有助于提供这些额外的安全层。将贵重资产放置在外墙旁（包括建筑物后部）会消除某些安全层。\n\
  \n## 12. D\nVM 需要单独更新，就像它们运行在物理服务器上一样。物理服务器的更新不会更新托管的 VM。同样，更新一个 VM 不会更新所有 VM。\n\
  \n## 13. A\n租用基础设施即服务（IaaS）云资源时，组织对维护和安全承担最大责任。云服务提供商在平台即服务（PaaS）模型中承担更多责任，在软件即服务（SaaS）模型中承担最多责任。`混合云`\
  \ 指云部署模型（而非服务模型），表示使用两种或多种部署模型（如私有云、公有云和/或社区云）。\n\n## 14. C\n`社区云` 部署模型向两个或多个组织提供基于云的资产。`公有云`\
  \ 模型包含可供任何消费者租赁或租用的资产。`私有云` 部署模型包含专属于单个组织的基于云的资产。`混合模型` 包含两种或多种部署模型的组合。无论是软件即服务（SaaS）模型还是其他服务模型均不影响此分类。\n\
  \n## 15. B\n应对磁带进行清除，确保数据无法通过任何已知手段恢复。即使磁带已达生命周期末期，它们仍可能保存数据，在丢弃前应进行清除。擦除无法从介质中移除所有可用数据，但清除可以。如果磁带已达生命周期末期，无需存储。\n\
  \n\n\n\n\n## 16. B\n镜像可以是一种使用基线的有效配置管理方法。镜像可确保系统以相同的已知配置进行部署。变更管理流程有助于防止因未经授权的更改而导致中断。漏洞管理流程有助于识别漏洞，补丁管理流程有助于确保系统保持最新状态。\n\
  \n## 17. A\n为应对紧急情况，可能需要暂时绕过变更管理流程，但不应仅仅因为有人认为这样可以提高性能就绕过它们。即使变更是为应对紧急情况而实施的，事后仍应对其进行记录和审查。请求变更、创建回滚计划和记录变更都是变更管理流程中的有效步骤。\n\
  \n## 18. D\n变更管理流程将确保在实施前对变更进行评估，以防止意外中断或无谓地削弱安全性。补丁管理确保系统是最新的，漏洞管理检查系统是否存在已知漏洞，配置管理确保系统以类似方式部署，但这些其他流程无法防止由未经授权的变更引起的问题。\n\
  \n## 19. C\n只应部署必需的补丁，因此组织不会部署`all`（所有）补丁。相反，组织会评估补丁以确定需要哪些补丁，对其进行测试以确保不会导致意外问题，部署已批准且经过测试的补丁，并审计系统以确保补丁已应用。\n\
  \n## 20. B\n漏洞扫描器用于检查系统的已知问题，是整体漏洞管理计划的一部分。版本控制用于跟踪软件版本，与检测漏洞无关。安全审计和评审有助于确保组织遵循其策略，但不会直接检查系统的漏洞。\n\
  \n### 第 17 章：预防和响应事件\n\n## 1. A\n遏制是在检测和验证事件后的第一步。这限制了事件的影响或范围。组织根据策略和管辖法律报告事件，但这不是第一步。补救旨在确定事件的原因并采取措施防止再次发生，但这不是第一步。在试图遏制事件时保护证据很重要，但收集证据将在遏制之后进行。\n\
  \n## 2. D\n安全人员在补救阶段执行根因分析。根因分析旨在发现问题的根源。发现原因后，评审通常会确定解决方案，以帮助防止未来发生类似事件。遏制事件和收集证据是在事件响应流程的早期完成的。重建系统可能在恢复阶段需要进行。\n\
  \n## 3. A, B, C\nTeardrop（泪滴攻击）、smurf（斯莫夫攻击）和 ping of death（死亡之 Ping）都是拒绝服务攻击的类型。攻击者在各种攻击中使用欺骗来隐藏其身份，但欺骗本身不是一种攻击。请注意，此问题很容易改为否定类型的问题，例如“以下哪项`not`（不）是\
  \ DoS 攻击？”\n\n## 4. C\nSYN 洪水攻击通过从不发送第三个数据包来破坏 TCP 三次握手过程。它不专属于任何特定操作系统（如 Windows）。Smurf\
  \ 攻击使用放大网络向受害者发送大量数据包。Ping-of-death 攻击（死亡之 Ping 攻击）使用超大的 Ping 数据包。\n\n## 5. B\n\
  零日漏洞利用利用了先前未知的漏洞。僵尸网络是由牧羊人控制的一组计算机，可用于发起攻击，但它们可以利用已知漏洞和先前未知的漏洞。同样，拒绝服务和分布式拒绝服务 (DDoS)\
  \ 攻击可能使用零日漏洞利用，也可能使用已知方法。\n\n## 6. A\n在提供的选项中，路过式下载是恶意软件最常见的分发方法。USB 闪存驱动器可用于分发恶意软件，但这种方法不如路过式下载常见。勒索软件是一种恶意软件感染，而不是分发恶意软件的方法。如果用户可以安装未经批准的软件，他们可能会无意中安装恶意软件，但并非所有未经批准的软件都是恶意软件。\n\
  \n## 7. A\nIDS（入侵检测系统）自动检查审计日志和实时系统事件，以检测指示未经授权的系统访问的异常活动。虽然 IDS 可以检测系统故障和监控系统性能，但它们不包括诊断系统故障或评估系统性能的能力。漏洞扫描器用于测试系统的漏洞。\n\
  \n## 8. B\nHIDS（基于主机的入侵检测系统）监控单个系统，寻找异常活动。基于网络的 IDS (NIDS) 监视网络上的异常活动。HIDS 通常作为系统上的运行进程可见，并向授权用户提供警报。HIDS\
  \ 可以检测恶意代码，类似于反恶意软件如何检测恶意代码。\n\n## 9. B\n蜜罐是单个计算机，蜜网是专门创建用作入侵者陷阱的整个网络。它们看起来像合法网络，用未修补和无防护的安全漏洞以及吸引人且诱人但虚假的数据来引诱入侵者。入侵检测系统\
  \ (IDS) 将检测攻击。在某些情况下，IDS 可以将攻击者引导至隔离环境，这是一个包含假数据的模拟环境，旨在保持攻击者的兴趣。伪缺陷（被许多蜜罐和蜜网使用）是故意植入系统中的虚假漏洞，用以引诱攻击者。\n\
  \n## 10. C\n多管齐下的方法提供了最佳解决方案。这涉及在多个位置部署反恶意软件，例如互联网与内部网络之间的边界、电子邮件服务器上以及每个系统上。不建议在单个系统上安装多个反恶意软件应用程序。组织的单一解决方案通常无效，因为恶意软件可以通过多种方式进入网络。边界网关（互联网与内部网络之间的边界）上的内容过滤是一个很好的部分解决方案，但无法捕获通过其他方式带入的恶意软件。\n\
  \n## 11. B\n渗透测试应仅在管理人员知情并同意的情况下进行。未经批准的安全测试可能导致生产力损失、触发应急响应团队，并导致对测试人员采取法律行动，包括失去工作。渗透测试可以模仿以前的攻击，并使用手动和自动攻击方法。渗透测试后，可能会重新配置系统以解决发现的漏洞。\n\
  \n## 12. B\n问责制通过监控主体和客体的活动以及维护操作环境和安全机制的核心系统功能来维持。有效监控需要身份验证，但身份验证本身不提供问责制。账户锁定可在密码输入错误次数过多时阻止登录账户。用户权利审查可以识别过度的特权。\n\
  \n## 13. B\n审计跟踪是一种被动的侦查型安全控制。管理控制是管理实践。纠正控制可以纠正与事件相关的问题，物理控制是你可以亲自接触的控制。\n\n\n\n\
  \n\n## 14. B\n审计是对环境进行的有条不紊的检查或审查，以确保符合法规并检测异常、未经授权的事件或彻头彻尾的犯罪行为。渗透测试试图利用漏洞。风险分析试图根据已识别的威胁和漏洞来分析风险。诱捕是诱骗某人执行非法或未经授权的行为。\n\
  \n## 15. A\n截断是一种非统计抽样形式，它根据截断级别阈值减少记录的数据量。抽样是一种统计方法，从审计日志中提取有意义的数据。日志分析审查日志信息，寻找趋势、模式以及异常或未经授权的事件。警报触发器是在发生特定事件或达到阈值时发送给管理员的通知。\n\
  \n## 16. B\n流量分析更关注数据的模式和趋势，而非实际内容。击键监控记录特定的击键以捕获数据。事件日志记录特定事件以记录数据。安全审计记录安全事件和/或审查日志以检测安全事件。\n\
  \n## 17. B\n用户权利审计可以检测用户何时拥有超出必要范围的特权。账户管理实践旨在确保正确分配特权。审计检测管理实践是否被遵循。日志记录活动，但需要审查日志才能确定实践是否被遵循。报告是审计的结果。\n\
  \n## 18. D\n安全人员本应收集证据，以便可能对攻击者进行起诉。然而，事件响应计划未发布，因此服务器管理员不知道这一要求。检测并验证事件后的首要响应是遏制事件，但本可以在不重启服务器的情况下遏制事件。经验教训阶段包括审查，且是最后阶段。补救包括根因分析以确定是什么导致了事件，但这在流程后期进行。在此场景中，重启服务器执行了恢复操作。\n\
  \n## 19. C\n攻击 IP 地址是最严重的错误，因为在大多数地区这是非法的。此外，由于攻击者经常使用欺骗技术，那很可能不是攻击者的真实 IP 地址。在未收集证据的情况下重启服务器以及未报告事件也是错误，但不会对组织产生潜在的长期负面影响。重置连接以隔离事件本应是一个好的步骤，前提是不重启服务器的情况下进行。\n\
  \n## 20. A\n管理员未报告事件，因此没有机会执行经验教训步骤。事件可能是由服务器漏洞引起的，但如果不进行检查，除非攻击重演，否则无法知晓确切原因。管理员检测到了事件并做出了响应（尽管响应不当）。重启服务器是一个恢复步骤。值得一提的是，事件响应计划被保密，服务器管理员无法访问，因此很可能不知道正确的响应应该是什么。\n\
  \n### 第 18 章：灾难恢复规划\n\n## 1. C\n一旦灾难中断业务运营，DRP 的目标是尽快恢复正常业务活动。因此，灾难恢复规划从业务连续性规划结束的地方继续开始。\n\
  \n## 2. C\n停电是人为灾难的一个例子。列出的其他事件——海啸、地震和雷击——都是自然发生的事件。\n\n## 3. D\n美国 50 个州中有 41\
  \ 个州被认为面临中等、高或极高的地震活动风险。这约占 80%，即选项 D 给出的数值。\n\n## 4. B\n大多数普通商业保险和房主保险单不提供任何针对洪水或山洪风险的保障。如果洪水对您的组织构成风险，您应考虑在\
  \ FEMA 的国家洪水保险计划下购买补充洪水保险。\n\n## 5. B\n廉价磁盘冗余阵列（RAID）是容错控制，允许组织的存储服务承受一个或多个单独磁盘的损失。负载均衡、集群和\
  \ HA 对都是为服务器设计的容错服务，而非存储。\n\n## 6. C\n云计算服务为备份存储提供了绝佳位置，因为它们可从任何位置访问。\n\n## 7. B\n\
  *百年一遇洪水区* 一词用于描述预计每 100 年发生一次洪水的区域。然而，从数学上更准确的说法是，该标签表明在任何给定年份发生洪水的概率为 1%。\n\n##\
  \ 8. D\n当使用远程镜像时，数据库的精确副本将保持在备用位置。您通过同时在主站点和远程站点执行所有事务来保持远程副本的最新状态。\n\n## 9. C\n\
  冗余系统/组件可防止特定硬件发生故障。\n\n## 10. B\n在业务影响评估阶段，您必须确定组织的业务优先级，以协助分配 BCP 资源。您可以使用相同的信息来驱动\
  \ DRP 业务单元的优先级排序。\n\n## 11. C\n冷站点不包含恢复运营所需的任何设备。所有设备必须搬入并配置，数据必须恢复到其中，然后才能开始运营。这通常需要数周时间。\n\
  \n## 12. C\n暖站点通常需要约 12 小时才能从宣布灾难时刻激活。这与热站点相对即时的激活以及使冷站点达到运行状态所需的漫长时间（至少一周）形成对比。\n\
  \n## 13. D\n暖站点和热站点都包含工作站、服务器和实现运行状态所需的通信线路。两者的主要区别在于热站点包含近实时的运营数据副本，而暖站点需要从备份中恢复数据。\n\
  \n## 14. D\n远程镜像是唯一一种备份选项，其中远程站点的实时备份服务器维护主服务器内容的逐位副本，同步程度仅受主系统和远程系统之间链路延迟的限制。\n\
  \n## 15. A\n执行摘要提供了整个组织灾难恢复工作的高层视图。该文档对公司的管理者和领导者以及需要对这一复杂工作有非技术视角的公共关系人员很有用。\n\n\
  ## 16. D\n软件托管协议将应用程序源代码交由独立第三方保管，从而在开发商倒闭或未能履行服务协议条款时，为公司提供“安全网”。\n\n## 17. A\n\
  差异备份涉及始终存储自最近一次完全备份以来所有已修改文件的副本，无论期间创建了多少增量或差异备份。\n\n## 18. C\n任何备份策略在流程的某个时刻都必须包含完全备份。增量备份的创建速度比差异备份快，因为每次需要备份的文件数量较少。\n\
  \n## 19. A\n任何备份策略在流程的某个时刻都必须包含完全备份。如果使用完全备份和差异备份的组合，最多只需恢复两个备份。如果选择完全备份和增量备份的组合，所需的恢复次数可能是无限的。\n\
  \n## 20. B\n并行测试涉及将人员移至恢复站点并启动运营，但负责日常业务运营的责任仍保留在主运营中心。\n\n\n\n\n\n## 第 19 章：调查与伦理\n\
