  \ UTP\n    3.  STP\n    4.  光纤\n\n5.  以下哪项不是网络分段的示例？\n    1.  内部网\n    2.  DMZ\n\
  \    3.  外部网\n    4.  VPN\n\n6.  什么是一种场供电技术，可用于库存管理而无需直接物理接触？\n    1.  IPX\n   \
  \ 2.  RFID\n    3.  SSID\n    4.  SDN\n\n7.  如果你是蓝牙劫持攻击的受害者，什么被攻破了？\n    1.  你的防火墙\n\
  \    2.  你的交换机\n    3.  你的手机\n    4.  你的 Web Cookie\n\n8.  哪种网络技术基于 IEEE 802.3 标准？\n\
  \    1.  以太网\n    2.  令牌环\n    3.  FDDI\n    4.  HDLC\n\n9.  什么是 TCP 包装器？\n    1.\
  \  交换机使用的一种封装协议\n    2.  一种应用程序，可作为基本防火墙，根据用户 ID 或系统 ID 限制访问\n    3.  一种用于保护 WAN\
  \ 链路上 TCP/IP 流量的安全协议\n    4.  一种通过非 IP 网络隧道传输 TCP/IP 的机制\n\n10.  多层协议的优点和潜在有害影响是什么？\n\
  \     1.  吞吐量\n     2.  封装\n     3.  哈希完整性检查\n     4.  逻辑寻址\n\n11.  通过检查源地址和目的地址、应用程序用途、来源以及当前数据包与同一会话前一个数据包之间的关系，\\\
  _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 防火墙能够为授权用户和活动授予更广泛的访问权限，并主动监视和阻止未授权用户和活动。\n\
  \     1.  静态包过滤\n     2.  应用层网关\n     3.  状态检测\n     4.  电路级网关\n\n12.  \\_\\_\\\
  _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 防火墙被称为第三代防火墙。\n     1.  应用层网关\n     2.  状态检测\n\
  \     3.  电路级网关\n     4.  静态包过滤\n\n13.  关于防火墙，以下哪项描述不正确？\n     1.  它们能够记录流量信息。\n\
  \     2.  它们能够阻止病毒。\n     3.  它们能够根据疑似攻击发出警报。\n     4.  它们无法防止内部攻击。\n\n14.  以下哪项不是路由协议？\n\
  \     1.  OSPF\n     2.  BGP\n     3.  RPC\n     4.  RIP\n\n\n\n# 15.  \\_\\_\\\
  _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 是一种智能集线器，因为它知道连接在每个出站端口上的系统的地址。它不是在每个出站端口上重复流量，而是仅将流量从已知目的地存在的那个端口重复发送出去。\n\
  \n1.  中继器\n2.  交换机\n3.  网桥\n4.  路由器\n\n# 16.  以下哪项不是专门与 802.11 无线网络相关的技术？\n\n1.\
  \  WAP\n2.  WPA\n3.  WEP\n4.  802.11i\n\n# 17.  哪种无线频率接入方法在干扰最小的情况下提供最大的吞吐量？\n\n\
  1.  FHSS\n2.  DSSS\n3.  OFDM\n4.  OSPF\n\n# 18.  什么安全概念鼓励管理员在每台主机上安装防火墙、恶意软件扫描器和\
  \ IDS？\n\n1.  端点安全\n2.  网络准入控制 (NAC)\n3.  VLAN\n4.  RADIUS\n\n# 19.  ARP 执行什么功能？\n\
  \n1.  它是一种路由协议。\n2.  它将 IP 地址解析为 MAC 地址。\n3.  它将物理地址解析为逻辑地址。\n4.  它管理多路复用流。\n\n\
  # 20.  哪种基础设施模式无线网络部署形式通过使用单个 SSID 但众多接入点来支持大型物理环境？\n\n1.  独立型\n2.  有线扩展\n3.  企业扩展\n\
  4.  网桥\n\n## 第 12 章：安全通信与网络攻击\n\n**本章涵盖的 CISSP 考试主题包括：**\n\n*   **领域 4：通信与网络安全**\n\
  \    *   4.3 根据设计实施安全通信信道\n        *   4.3.1 语音\n        *   4.3.2 多媒体协作\n     \
  \   *   4.3.3 远程访问\n        *   4.3.4 数据通信\n        *   4.3.5 虚拟化网络\n\n静态驻留在存储设备上的数据相当容易保护。只要维持物理访问控制并实施合理的逻辑访问控制，存储的文件就能保持机密性、保持完整性，并可供授权用户使用。然而，一旦数据被应用程序使用或通过网络连接传输，保护它的过程就会变得困难得多。\n\
  \n通信安全涵盖了与电子信息从一处传输到另一处相关的广泛问题。这种传输可能发生在星球两端的系统之间，也可能发生在同一企业网络上的系统之间。一旦涉及任何传输手段，数据就会面临大量针对其机密性、完整性和可用性的威胁。幸运的是，通过适当的对策，可以减少或消除许多此类威胁。\n\
  \n通信安全旨在检测、预防甚至纠正数据传输错误（即提供完整性保护以及机密性）。这是为了在支持数据交换和共享需求的同时维持网络安全。本章涵盖了通信安全的多种形式、漏洞和对策。\n\
  \nCISSP 认证考试的通信与网络安全领域涉及与网络组件（即网络设备和协议）相关的主题，具体包括它们如何工作以及它们与安全的相关性。本领域在本章和第 11 章“安全网络架构与网络组件安全”中进行了讨论。请务必阅读并学习这两章的内容，以确保全面覆盖\
  \ CISSP 认证考试所需的核心材料。\n\n### 网络与协议安全机制\n\n`传输控制协议/互联网协议 (TCP/IP)` 是大多数网络和互联网上使用的主要协议套件。它是一个健壮的协议套件，但存在许多安全缺陷。为了改进\
  \ `TCP/IP` 的安全性，已经开发了许多子协议、机制或应用程序，以保护传输数据的机密性、完整性和可用性。重要的是要记住，即使有了 `TCP/IP` 这个基础协议套件，互联网上仍在使用成百上千个单独的协议、机制和应用程序。其中一些旨在提供安全服务。一些保护完整性，另一些保护机密性，还有一些提供认证和访问控制。在接下来的章节中，我们将讨论一些更常见的网络和协议安全机制。\n\
  \n#### 安全通信协议\n\n为特定应用程序通信信道提供安全服务的协议称为安全通信协议。以下列表包含部分可用选项：\n\n*   **`IPsec`**：互联网协议安全\
  \ (`IPsec`) 使用公钥密码学来提供加密、访问控制、不可抵赖性和消息认证，所有这些均使用基于 IP 的协议。`IPsec` 的主要用途是虚拟专用网络 (`VPNs`)，因此\
  \ `IPsec` 可以在传输模式或隧道模式下运行。`IPsec` 在第 7 章“PKI 与密码学应用”中有进一步讨论。\n*   **`Kerberos`**：`Kerberos`\
  \ 为用户提供单点登录解决方案，并为登录凭据提供保护。现代 `Kerberos` 实现使用混合加密来提供可靠的认证保护。`Kerberos` 在第 13 章“密码学与对称密钥算法”中有进一步讨论。\n\
  *   **`SSH`**：安全外壳 (`SSH`) 是端到端加密技术的一个很好的例子。此安全工具可用于加密多种明文实用程序（如 `rcp`、`rlogin`、`rexec`），充当协议加密器（如用于\
  \ `SFTP`），并可用作 `VPN`。\n*   **`Signal 协议`**：这是一种加密协议，为语音通信、视频会议和文本消息服务提供端到端加密。`Signal\
  \ 协议` 是非联邦制的，是名为 Signal 的即时通讯应用的核心要素。\n*   **`安全远程过程调用 (S-RPC)`**：这是一种认证服务，仅仅是一种防止在远程系统上未经授权执行代码的手段。\n\
  *   **`安全套接字层 (SSL)`**：这是由 Netscape 开发的一种加密协议，用于保护 Web 服务器和 Web 浏览器之间的通信。`SSL` 可用于保护\
  \ Web、电子邮件、文件传输协议 (`FTP`) 甚至 Telnet 流量。它是一种面向会话的协议，提供机密性和完整性。`SSL` 使用 40 位密钥或 128\
  \ 位密钥部署。`SSL` 已被传输层安全 (`TLS`) 取代。\n*   **`传输层安全 (TLS)`**：`TLS` 的运作方式与 `SSL` 大体相同，但它使用更强的认证和加密协议。\n\
  \n`SSL` 和 `TLS` 都具有以下特性：\n\n*   支持跨不安全网络的安全客户端-服务器通信，同时防止篡改、欺骗和窃听。\n*   支持单向认证。\n\
  *   支持使用数字证书的双向认证。\n*   通常作为 `TCP` 数据包的初始载荷实现，允许其封装所有高层协议载荷。\n*   可在较低层实现，如第 3 层（网络层）以作为\
  \ `VPN` 运行。这种实现称为 `OpenVPN`。\n\n此外，`TLS` 可用于加密用户数据报协议 (`UDP`) 和会话发起协议 (`SIP`) 连接。(`SIP`\
  \ 是与 IP 语音 [`VoIP`] 相关的协议。)\n\n#### 认证协议\n\n在远程系统与服务器或网络之间建立初始连接后，应进行的第一项活动是验证远程用户的身份。此活动称为认证。有几种认证协议控制登录凭据的交换方式以及这些凭据在传输过程中是否加密：\n\
  \n\n\n\n### 挑战握手认证协议 (CHAP)\n\n这是用于点对点协议 (PPP) 链路的认证协议之一。CHAP 对用户名和密码进行加密。它使用无法重放的质询-响应对话来执行认证。CHAP\
  \ 还会在整个已建立的通信会话期间定期重新认证远程系统，以验证远程客户端的持久身份。此活动对用户是透明的。\n\n### 密码认证协议 (PAP)\n\n这是一种用于\
  \ PPP 的标准化认证协议。PAP 以明文形式传输用户名和密码。它不提供任何形式的加密；它仅提供一种将登录凭据从客户端传输到认证服务器的手段。\n\n###\
  \ 可扩展认证协议 (EAP)\n\n这是一个认证框架，而非实际协议。EAP 允许定制化的认证安全解决方案，例如支持智能卡、令牌和生物识别技术。（有关基于 EAP\
  \ 的其他协议的信息，请参阅侧边栏“EAP、PEAP 和 LEAP”。）\n\n这三种认证协议最初用于拨号 PPP 连接。如今，这些协议以及许多其他较新的认证协议（如\
  \ openID、OAuth 和 Shibboleth）和概念（如认证联合和 SAML）被用于各种远程连接技术，包括宽带和虚拟专用网络 (VPN)，同时还扩展了对传统认证服务的支持和使用，如\
  \ Kerberos、远程认证拨号用户服务 (RADIUS)，甚至终端访问控制器访问控制系统 Plus (TACACS+)。\n\n### 安全语音通信\n\n\
  语音通信的脆弱性与信息技术 (IT) 系统安全间接相关。然而，随着语音通信解决方案通过采用数字设备和 VoIP 迁移到网络上，保障语音通信安全变得日益重要。当语音通信发生在\
  \ IT 基础设施上时，实施提供认证和完整性的机制非常重要。应通过采用加密服务或协议来保护传输中的语音通信，以维护机密性。\n\n普通的 `专用分组交换机 (PBX)`\
  \ 或 `POTS/公共交换电话网 (PSTN)` 语音通信容易遭到拦截、窃听、监听和其他利用。通常，需要物理安全来控制组织物理场所内的语音通信。组织外部语音通信的安全性通常由您租用服务的电话公司负责。如果语音通信漏洞是维持您安全策略的重要问题，您应该部署加密通信机制并专门使用它。\n\
  \n#### 互联网协议语音 (VoIP)\n\n`VoIP` 是一种将音频封装进 IP 数据包以支持通过 TCP/IP 网络连接进行电话通话的技术。VoIP\
  \ 已成为全球公司和个人流行且廉价的电话解决方案。\n\n在选择 VoIP 解决方案时，牢记安全性非常重要，以确保其提供您期望的隐私和安全性。一些 VoIP 系统本质上是明文通信，容易被拦截和窃听；另一些则高度加密，任何干扰或窃听尝试都会被阻止和挫败。\n\
  \nVoIP 并非没有问题。黑客可以对 VoIP 解决方案发动各种潜在攻击：\n\n*   `来电显示` 可使用任意数量的 VoIP 工具轻易伪造，因此黑客可实施\
  \ `语音钓鱼 (vishing)` 或 `互联网电话垃圾信息 (SPIT)` 攻击。\n*   呼叫管理系统和 VoIP 电话本身可能容易受到主机操作系统 (OS)\
  \ 攻击和 DoS 攻击。如果设备或软件的主机操作系统或固件存在漏洞，则被利用的风险会增加。\n*   攻击者可能通过欺骗呼叫管理器或端点连接协商和/或响应来实施中间人\
  \ (MitM) 攻击。\n*   根据部署情况，将 VoIP 电话与桌面和服务器系统部署在同一交换机上也存在风险。这可能允许 802.1X 认证伪造以及虚拟局域网\
  \ (VLAN) 和 VoIP 跳跃（即跨越已认证信道）。\n*   由于 VoIP 流量只是网络流量，当 VoIP 流量未加密时，通常可以通过解码 VoIP\
  \ 流量来窃听 VoIP 通信。\n\n`安全实时传输协议` 或 `SecureRTP (SRTP)` 是对许多 VoIP 通信中使用的 `实时传输协议 (RTP)`\
  \ 的安全改进。SRTP 旨在通过强大的加密和可靠的认证来最大限度地降低 VoIP DoS 的风险。\n\n#### 社会工程学\n\n恶意个人可以通过一种称为\
  \ `社会工程学` 的技术利用语音通信。社会工程学是一种未知、不受信任或至少未经授权的人获取组织内部人员信任的手段。老练的个人可以让员工相信他们与高层管理、技术支持、服务台等有关联。一旦被说服，受害者通常会被鼓励更改其系统上的用户帐户，例如重置密码。其他攻击包括指示受害者打开特定的电子邮件附件、启动应用程序或连接到特定的统一资源定位符\
  \ (URL)。无论实际活动是什么，通常都是为了打开一个后门，以便攻击者用来获取网络访问权限。\n\n组织内部的人员使其容易受到社会工程学攻击。只需少量信息或几个事实，通常就能让受害者泄露机密信息或从事不负责任的活动。社会工程学攻击利用了人类的特性，如对他人的基本信任、提供帮助的愿望或炫耀的倾向。忽视差异、分心、服从命令、假设他人比实际知道的更多、想帮助他人以及害怕训斥也可能导致攻击。攻击者往往能够绕过广泛的物理和逻辑安全控制，因为受害者从内部打开了一条访问路径，实际上在安全边界上打了一个洞。\n\
  \n防范社会工程学攻击的唯一方法是教导用户如何应对和处理任何形式的通信，无论是纯语音、面对面、即时消息、聊天还是电子邮件。以下是一些指导原则：\n\n*   每当语音通信看起来奇怪、不合时宜或意外时，始终倾向于谨慎行事。\n\
  *   始终要求提供身份证明。这可以是驾照号码、社会安全号码、员工工号、客户号码，或案件/参考号码，所有这些都可以轻松验证。也可以采取让办公室里能识别来电者声音的人接听电话的形式。例如，如果来电者声称是部门经理，您可以让他们的行政助理接听电话以确认身份。\n\
  *   要求对所有纯语音的网络变更或活动请求进行 `回拨` 授权。回拨授权是指初始客户端连接被断开，然后某人或一方拨打存储在企业目录中预定号码给客户，以验证客户身份。\n\
  *   对信息进行分类（用户名、密码、IP 地址、经理姓名、拨入号码等），并明确标示哪些信息可以通过语音通信讨论甚至确认。\n\n\n\n\n\n### 语音通信安全\n\
  \n#### 电话通信安全策略\n\n*   如果个人通过电话请求特权信息，而该个人本应知晓通过电话提供该特定信息违反公司安全策略，请询问为何需要该信息并再次验证其身份。此事件还应报告给安全管理员。\n\
  *   切勿仅通过语音通信提供或更改密码。\n*   处置办公文档时（根据策略和法规合规要求），始终使用安全的处置或销毁流程，特别是对于包含 IT 基础设施或其安全机制信息的任何文书或介质。\n\
  \n#### 欺诈与滥用\n\n另一个语音通信威胁是专用交换机（`PBX`）欺诈与滥用。许多 `PBX` 系统可能被恶意人员利用以逃避话费并隐藏身份。被称为 **phreakers**\
  \ 的恶意攻击者滥用电话系统，其方式与攻击者滥用计算机网络非常相似。Phreakers 可能会未经授权访问个人语音信箱、重定向消息、阻断访问，以及重定向来电和去电。\n\
  \n`PBX` 欺诈与滥用的对策包括许多用于保护典型计算机网络的相同预防措施：逻辑或技术控制、管理控制和物理控制。在设计 `PBX` 安全解决方案时，请记住以下几个要点：\n\
  \n*   考虑用信用卡或电话卡系统替代通过 `PBX` 进行的远程访问或长途呼叫。\n*   将拨入和拨出功能限制为因工作任务需要此类功能的授权人员。\n*\
  \   如果仍有拨入调制解调器，请使用位于语音号码前缀块范围之外的未发布电话号码。\n*   保护 `PBX` 的管理接口。\n*   阻止或禁用任何未分配的接入代码或账户。\n\
  *   制定可接受使用策略，并培训用户如何正确使用系统。\n*   记录并审计 `PBX` 上的所有活动，并审查审计日志以查找安全和使用违规行为。\n*   禁用维护调制解调器（即供应商用于远程管理、更新和调整已部署产品的远程访问调制解调器）和/或任何形式的远程管理访问。\n\
  *   更改所有默认配置，特别是与管理或特权功能相关的密码和能力。\n*   阻止远程呼叫（即允许远程来电者拨入您的 `PBX` 然后再拨出，从而将所有话费转嫁给\
  \ `PBX` 主机）。\n*   部署 **Direct Inward System Access (DISA)** 技术以减少外部人员的 `PBX` 欺诈。（但请务必正确配置；请参阅侧边栏“DISA:\
  \ A Disease and the Cure。”）\n*   通过供应商/服务提供商更新保持系统最新。\n\n此外，对所有 `PBX` 连接中心、电话入口和布线间保持物理访问控制，可防止现场攻击者的直接入侵。\n\
  \n`DISA` 与任何其他安全功能一样，必须正确安装、配置和监控，才能获得预期的安全改进。仅拥有 `DISA` 是不够的。请务必禁用组织不需要的所有功能，设置复杂且难以猜测的用户代码/密码，并开启审计以监控\
  \ `PBX` 活动。**Phreaking** 是针对电话系统的一种特定攻击类型。Phreakers 使用各种技术绕过电话系统，以进行免费长途通话、更改电话服务功能、窃取专业服务，甚至导致服务中断。一些\
  \ phreaker 工具是实际设备，而另一些只是使用普通电话的特定方式。无论工具或技术实际是什么，phreaker 工具被称为彩盒（黑盒、红盒等）。多年来，许多盒技术已被开发并广泛用于\
  \ phreakers，但只有少数对基于分组交换的现代电话系统有效。以下是一些常用于攻击电话服务的 phreaker 工具：\n\n*   **Black boxes**\
  \ 用于操纵线路电压以窃取长途服务。它们通常只是带有电池和夹子的定制电路板。\n*   **Red boxes** 用于模拟硬币投入公用电话的音调。它们通常只是小型录音机。\n\
  *   **Blue boxes** 用于模拟 2600 Hz 音调以直接与电话网络干线系统（即骨干）交互。这可能是一个哨子、录音机或数字音调发生器。\n* \
  \  **White boxes** 用于控制电话系统。White box 是一种双音多频（`DTMF`）发生器（即键盘）。它可以是定制设备，也可以是大多数电话维修人员使用的设备之一。\n\
  \n### 多媒体协作\n\n多媒体协作是指使用各种支持多媒体的通信解决方案来增强远程协作（人们远程共同完成项目）。通常，协作允许工作人员同时工作，也可跨不同时间框架工作。协作还可用于跟踪变更和包含多媒体功能。协作可以包含电子邮件、聊天、`VoIP`、视频会议、白板使用、在线文档编辑、实时文件交换、版本控制和其他工具。它通常是高级远程会议技术的一项功能。\n\
  \n#### 远程会议\n\n远程会议技术用于允许远程各方之间进行交互的任何产品、硬件或软件。这些技术和解决方案还有许多其他名称：数字协作、虚拟会议、视频会议、软件或应用程序协作、共享白板服务、虚拟培训解决方案等。任何使人们能够通信、交换数据、协作处理材料/数据/文档并共同执行工作任务的服务，均可视为远程会议技术服务。\n\
  \n无论实施何种形式的多媒体协作，都必须评估其伴随的安全隐患。该服务是否使用强身份验证技术？通信是通过开放协议还是加密隧道进行？该解决方案是否允许真正删除内容？用户活动是否经过审计和记录？多媒体协作和其他形式的远程会议技术可以改善工作环境，并允许来自全球更广泛、更多样化的工作人员提供输入，但这只有在通信解决方案的安全性得到保障时才是一种优势。\n\
  \n#### 即时通讯\n\n**Instant messaging (IM)** 是一种机制，允许位于互联网上任意位置的两个用户之间进行实时基于文本的聊天。一些\
  \ `IM` 实用程序允许文件传输、多媒体、语音和视频会议等。一些形式的 `IM` 基于点对点服务，而另一些则使用集中式控制服务器。基于点对点的 `IM` 易于最终用户部署和使用，但从企业角度来看难以管理，因为它通常不安全。它存在许多漏洞：易受数据包嗅探攻击，缺乏真正的原生安全功能，且无法提供隐私保护。\n\
  \n许多传统即时通讯形式缺乏常见的安全功能，如加密或用户隐私。许多独立 `IM` 客户端因其文件传输功能而易受恶意代码植入或感染。此外，`IM` 用户经常遭受多种形式的社会工程攻击，例如冒充或诱使受害者泄露应保密的信息（如密码）。\n\
  \n\n\n\n\n### 现代即时通讯解决方案\n\n有几种现代即时通讯解决方案可供考虑，既适用于人与人之间的互动，也适用于群组之间的协作与沟通。有些是公共服务，例如\
  \ Twitter、Facebook Messenger 和 Snapchat。其他则专为私有或内部使用而设计，例如 Slack、Google Hangouts、Cisco\
  \ Spark、Workplace by Facebook 和 Skype。这些消息服务大多将安全性作为关键特性进行设计，通常采用多因素认证和传输加密。\n\n\
  ### 管理电子邮件安全\n\n电子邮件是互联网上应用最广泛、最常用的服务之一。互联网上采用的电子邮件基础设施主要由使用 `Simple Mail Transfer\
  \ Protocol (SMTP)`（简单邮件传输协议）的电子邮件服务器组成，用于接收来自客户端的消息、将这些消息传输到其他服务器，并将其存入用户基于服务器的收件箱。除了电子邮件服务器，基础设施还包括电子邮件客户端。客户端使用\
  \ `Post Office Protocol version 3 (POP3)`（邮局协议版本 3）或 `Internet Message Access Protocol\
  \ (IMAP)`（互联网消息访问协议）从基于服务器的收件箱中检索电子邮件。客户端使用 `SMTP` 与电子邮件服务器通信。许多兼容互联网的电子邮件系统依赖 X.400\
  \ 标准进行寻址和消息处理。\n\nSendmail 是 Unix 系统上最常见的 `SMTP` 服务器，而 Exchange 是 Microsoft 系统上最常见的\
  \ `SMTP` 服务器。除了这三款流行产品外，还有许多替代方案，但它们都具有相同的基本功能，并遵守互联网电子邮件标准。\n\n如果你部署 `SMTP` 服务器，必须为入站和出站邮件正确配置认证，这至关重要。`SMTP`\
  \ 被设计为邮件中继系统。这意味着它将邮件从发件人中继给预期收件人。但是，你应避免将 `SMTP` 服务器变成 `open relay`（开放中继，也称为开放中继代理或\
  \ `relay agent`），即一种在接受和中继邮件前不认证发件人的 `SMTP` 服务器。开放中继是垃圾邮件发送者的主要目标，因为它们允许垃圾邮件发送者通过搭便车利用不安全的电子邮件基础设施发送大量邮件。随着开放中继被锁定，变为封闭或认证中继，越来越多的\
  \ `SMTP` 攻击是通过劫持的已认证用户账户发生的。\n\n企业电子邮件的另一个选择是 SaaS 电子邮件解决方案。云或托管电子邮件的示例包括 Gmail（Google\
  \ Apps for Business）和 Outlook/Exchange Online。SaaS 电子邮件使你能够利用一些最大型的互联网导向型组织的安全经验和管理专长来支持公司的通信。SaaS\
  \ 电子邮件的优势包括高可用性、分布式架构、易于访问、标准化配置和物理位置独立性。然而，使用托管电子邮件解决方案也存在一些潜在风险，包括黑名单问题、速率限制、应用/插件限制，以及你可以部署什么（如果有）额外的安全机制。\n\
  \n#### 电子邮件安全目标\n\n对于电子邮件，互联网上使用的基本机制提供了高效的消息传递，但缺乏提供机密性、完整性甚至可用性的控制。换句话说，基本电子邮件是不安全的。但是，你可以通过多种方式为电子邮件添加安全性。为电子邮件添加安全性可能满足以下一个或多个目标：\n\
  \n* 提供不可抵赖性\n* 将消息访问权限限制在其预期收件人范围内（即隐私和机密性）\n* 维护消息的完整性\n* 对消息来源进行认证和验证\n* 验证消息的投递\n\
  * 对消息内或附件中的敏感内容进行分类\n\n与 IT 安全的任何方面一样，电子邮件安全始于高层管理批准的安全策略。在安全策略中，你必须解决以下几个问题：\n\n\
  * 电子邮件的可接受使用策略\n* 访问控制\n* 隐私\n* 电子邮件管理\n* 电子邮件备份和保留策略\n\n可接受使用策略定义了可以和不可以通过组织的电子邮件基础设施执行哪些活动。通常规定可以发送和接收专业的、面向业务的电子邮件以及有限数量的个人电子邮件。通常会对从事个人业务（即为另一个组织工作，包括自雇）以及发送或接收非法、不道德或冒犯性通信，以及从事任何其他会对生产力、盈利能力或公共关系产生不利影响的活动施加具体限制。\n\
  \n应对电子邮件保持访问控制，以便用户仅能访问其特定的收件箱和电子邮件归档数据库。这条规则的延伸意味着没有其他用户（无论是否授权）可以访问个人的电子邮件。访问控制应同时提供合法访问和一定级别的隐私，至少要防止其他员工和未经授权的入侵者访问。\n\
  \n用于实施、维护和管理组织电子邮件的机制和流程应予以明确。最终用户可能不需要了解电子邮件管理的具体细节，但他们需要知道电子邮件是否被视为私密通信。电子邮件最近成为许多法庭案件的焦点，其中归档的消息被用作证据——这往往让这些消息的作者或收件人感到懊恼。如果要保留电子邮件（即备份并存储在归档中以供将来使用），则需让用户知情。如果要由审计员审查电子邮件以查找违规行为，也需告知用户。一些公司选择仅保留最近三个月的电子邮件归档然后销毁，而另一些公司则选择保留电子邮件数年。根据你所在的国家和行业，通常会有法规规定保留策略。\n\
  \n#### 了解电子邮件安全问题\n\n部署电子邮件安全的第一步是识别电子邮件特有的漏洞。用于支持电子邮件的标准协议（即 `SMTP`、`POP` 和 `IMAP`）本身不采用加密。因此，所有消息都以提交给电子邮件服务器时的形式进行传输，这通常是明文。这使得拦截和窃听变得容易。然而，缺乏原生加密只是与电子邮件相关的最不重要的安全问题之一。\n\
  \n电子邮件是病毒、蠕虫、特洛伊木马、带有破坏性宏的文档和其他恶意代码的常见传播机制。对各种脚本语言、自动下载功能和自动执行功能的广泛支持，已将电子邮件内容和附件中的超链接转变为对每个系统的严重威胁。\n\
  \n电子邮件在来源验证方面几乎没有提供任何保障。即使是新手攻击者，伪造电子邮件的源地址也是一个简单的过程。电子邮件头可以在其源头或传输过程中的任何一点被修改。此外，通过直接连接到电子邮件服务器的\
  \ `SMTP` 端口，也可以将电子邮件直接投递到电子邮件服务器上用户的收件箱中。再说传输过程中的修改，没有原生的完整性检查来确保消息在源和目的地之间未被篡改。\n\
  \n此外，电子邮件本身也可被用作攻击机制。当大量消息被定向发送到单个用户的收件箱或通过特定的 `STMP` 服务器时，可能会导致拒绝服务 (DoS) 攻击。这种攻击通常称为邮件炸弹攻击，就是通过向系统倾倒大量消息来实施的\
  \ DoS 攻击。DoS 可能是存储容量耗尽或处理能力耗尽的结果。无论哪种方式，结果都是一样的：合法消息无法投递。\n\n\n\n\n与电子邮件泛滥和恶意代码附件一样，垃圾邮件也可被视为一种攻击。发送不需要的、不适当的或无关的消息称为垃圾邮件发送。垃圾邮件发送通常只是一种骚扰，但它确实会浪费本地和互联网上的系统资源。由于消息来源通常被伪造，因此往往很难阻止垃圾邮件。\n\
  \n#### 电子邮件安全解决方案\n\n对电子邮件实施安全防护是可行的，但所付出的努力应与所交换消息的价值和机密性相匹配。您可以使用多种协议、服务和解决方案为电子邮件添加安全性，而无需对整个基于互联网的\
  \ `SMTP` 基础设施进行彻底改造。这些包括 `S/MIME`、`MOSS`、`PEM` 和 `PGP`。我们将在第 7 章“PKI 和加密应用”中讨论 `S/MIME`。\n\
  \n##### 安全/多用途互联网邮件扩展 (S/MIME)\n\n`安全多用途互联网邮件扩展` 是一种电子邮件安全标准，通过公钥加密和数字签名为电子邮件提供身份验证和机密性。身份验证通过\
  \ `X.509` 数字证书提供。隐私通过使用 `公钥加密标准 (PKCS)` 加密来提供。使用 `S/MIME` 可以形成两种类型的消息：签名消息和安全加密信封消息。签名消息提供完整性、发件人身份验证和不可抵赖性。加密信封消息提供完整性、发件人身份验证和机密性。\n\
  \n##### MIME 对象安全服务 (MOSS)\n\n`MIME 对象安全服务` 可为电子邮件消息提供身份验证、机密性、完整性和不可抵赖性。`MOSS`\
  \ 采用 `消息摘要 2 (MD2)` 和 `MD5` 算法、`Rivest-Shamir-Adleman (RSA)` 公钥以及 `数据加密标准 (DES)`\
  \ 来提供身份验证和加密服务。\n\n##### 隐私增强邮件 (PEM)\n\n`隐私增强邮件` 是一种电子邮件加密机制，提供身份验证、完整性、机密性和不可抵赖性。`PEM`\
  \ 使用 `RSA`、`DES` 和 `X.509`。\n\n##### 域名标识邮件 (DKIM)\n\n`DKIM` 是一种通过验证域名身份来断言有效邮件由某组织发送的手段。请参阅\
  \ [`www.dkim.org`](http://www.dkim.org)。\n\n##### 优良隐私协议 (PGP)\n\n`优良隐私协议 (PGP)`\
  \ 是一种公私钥系统，使用多种加密算法来加密文件和电子邮件消息。`PGP` 的第一个版本使用 `RSA`，第二个版本使用 `国际数据加密算法 (IDEA)`，但后续版本提供了一系列算法选项。`PGP`\
  \ 不是一个标准，而是一个独立开发的产品，拥有广泛的互联网草根支持。\n\n##### SMTP 网关的机会式 TLS (RFC 3207)\n\n如今许多组织正在使用\
  \ `基于 TLS 的安全 SMTP`；然而，由于缺乏认知，其普及程度尚不足。`SMTP 的机会式 TLS` 将尝试与每个其他电子邮件服务器建立加密连接（前提是对方支持）。否则，它将降级为明文传输。使用\
  \ `SMTP 网关的机会式 TLS` 可减少电子邮件被随意窃听的机会。\n\n##### 发件人策略框架 (SPF)\n\n为了防范垃圾邮件和电子邮件欺骗，组织还可以为其\
  \ `SMTP` 服务器配置 `发件人策略框架`。`SPF` 通过检查入站消息是否源自经 `SMTP` 发件域所有者授权的主机来运作。例如，如果我收到一条来自\
  \ `mark.nugget@abccorps.com` 的消息，`SPF` 会在入站消息被接受并投递到收件人收件箱之前，向 `smtp.abccorps.com`\
  \ 的管理员核实 `mark.nugget` 是否获授权通过其系统发送消息。使用它有利有弊，因此在引入 `SPF` 之前，您需要权衡这项广泛服务的需求。\n\n\
  通过将这些及其他安全机制用于电子邮件和通信传输，您可以减少或消除电子邮件的许多安全漏洞。数字签名有助于消除冒充行为。消息加密可减少窃听。而使用电子邮件过滤器可将垃圾邮件和邮件炸弹攻击降至最低。\n\
  \n在网络的电子邮件网关系统层面阻止附件，可以缓解恶意附件带来的威胁。您可以实施 100% 禁止附件的策略，也可以仅阻止已知或疑似恶意的附件，例如具有可执行文件和脚本文件扩展名的附件。如果附件是您电子邮件通信的重要组成部分，您将需要培训用户并使用防病毒工具进行防护。培训用户避免接触可疑或意外的附件，可大大降低通过电子邮件传播恶意代码的风险。防病毒软件通常对已知病毒有效，但对新出现或未知的病毒几乎无法提供保护。\n\
  \n垃圾邮件可能是一种麻烦、安全风险和资源消耗。无论是垃圾邮件、恶意邮件还是批量广告，都有多种方法可以减轻其对基础设施的影响。黑名单服务提供已知电子邮件滥用来源列表的订阅服务。您可以将黑名单集成到电子邮件服务器中，以便自动丢弃源自已知滥用域或\
  \ IP 地址的任何消息。另一种选择是使用质询/响应过滤器。在这些服务中，当收到来自新/未知发件人地址的电子邮件时，自动回复程序会发送确认请求。垃圾邮件发送者和自动邮件程序不会响应这些请求，但真实的人类会。一旦他们确认自己是人类并同意不向目标地址发送垃圾邮件，其发件人地址就会被添加到白名单中，以便未来通信。\n\
  \n也可以通过电子邮件信誉过滤来管理垃圾邮件。多个服务维护电子邮件服务的评级系统，以确定哪些用于标准/正常通信，哪些用于垃圾邮件。这些服务包括 [senderscore.org](http://senderscore.org)、[senderbase.org](http://senderbase.org)、[ReputationAuthority.org](http://ReputationAuthority.org)、[trustedsource.org](http://trustedsource.org)\
  \ 和 Barracuda Central。这些及其他机制作为多种垃圾邮件过滤技术的一部分被使用，例如 `Apache SpamAssassin` 和 `spamd`。\n\
  \n### 远程访问安全管理\n\n远程办公已成为商务计算的常见特征。远程办公通常需要远程访问，即远程客户端与网络建立通信会话的能力。远程访问可以采取以下形式（以及其他形式）：\n\
  \n*   使用调制解调器直接拨号连接到远程访问服务器\n*   通过互联网使用 `VPN` 连接到网络\n*   通过瘦客户端连接连接到终端服务器系统\n*\
  \   使用远程桌面服务连接到办公室的个人计算机 (`PC`)，例如 `Microsoft Remote Desktop`、`TeamViewer`、`GoToMyPC`、`Citrix\
  \ XenDesktop` 或 `VNC`\n*   使用基于云的桌面解决方案，例如 `Amazon WorkSpaces`\n\n前两个示例使用功能完整的客户端。它们建立连接的方式就像直接连接到局域网\
  \ (`LAN`) 一样。在最后一个示例中，所有计算活动都发生在终端服务器系统上，而不是远程客户端上。\n\n电话业务是指向组织提供电话服务的方法集合，或组织用于语音和/或数据通信的电话服务机制。传统上，电话业务包括普通老式电话服务\
  \ (`POTS`)，也称为公用交换电话网 (`PSTN`)，并结合调制解调器。然而，专用交换机 (`PBX`)、`VoIP` 和 `VPN` 也常用于电话通信。\n\
  \n\n\n\n### POTS 和 PSTN\n\nPOTS 和 PSTN 是指传统的固定电话连接。在高速、高性价比且普及的接入方式出现之前，POTS/PSTN\
  \ 连接曾是许多企业唯一或主要的远程网络链路。随着宽带和无线服务的广泛普及，POTS/PSTN 在家庭用户互联网接入方面的使用也随之减少。当宽带方案失效时，POTS/PSTN\
  \ 连接有时仍被用作远程连接的备份选项，用作农村互联网和远程连接，以及在 ISDN、VoIP 或宽带方案不可用或不具成本效益时，用作标准语音线路。\n\n###\
  \ 远程访问安全注意事项\n\n在任何环境中部署远程访问功能时，必须考虑并实施安全措施，以保护专用网络免受远程访问带来的复杂问题影响：\n\n*   远程访问用户在获得访问权限前应经过严格认证。\n\
  *   只有那些因分配的工作任务而特别需要远程访问的用户，才应被授予建立远程连接的权限。\n*   所有远程通信都应受到保护，防止被拦截和窃听。这通常需要一种加密解决方案，为认证流量以及所有数据传输提供强有力的保护。\n\
  \n在传输敏感、有价值或个人信息之前，建立安全通信通道至关重要。如果缺乏充分的保护和监控，远程访问可能会带来多种潜在的安全隐患：\n\n*   如果任何拥有远程连接的人都能尝试突破组织的安全防线，物理安全的效益就会降低。\n\
  *   远程办公人员可能使用不安全或安全性较低的远程系统来访问敏感数据，从而使其面临更大的丢失、泄露或暴露风险。\n*   远程系统可能暴露于恶意代码，并被用作将恶意软件带入专用局域网的载体。\n\
  *   远程系统的物理安全性可能较差，因此面临被未授权实体使用或被盗的风险。\n*   远程系统可能更难排查故障，特别是当问题围绕远程连接本身时。\n*   由于远程系统可能连接不频繁或吞吐量链路较慢，因此可能不易进行升级或打补丁。不过，当存在高速可靠的宽带链路时，此问题会有所缓解。\n\
  \n#### 规划远程访问安全\n\n在制定远程访问安全管理策略时，务必解决以下问题：\n\n##### 远程连接技术\n\n每种连接类型都有其独特的安全问题。必须全面审视连接选项的各个方面。这可能包括蜂窝/移动服务、调制解调器、`数字用户线路\
  \ (DSL)`、`综合业务数字网 (ISDN)`、无线网络、卫星和有线调制解调器。\n\n##### 传输保护\n\n存在多种加密协议、加密连接系统以及加密网络服务或应用程序。应针对远程连接需求使用适当的安全服务组合。这可能包括\
  \ `VPN`、`SSL`、`TLS`、`安全外壳协议 (SSH)`、`IPsec` 和 `第 2 层隧道协议 (L2TP)`。\n\n##### 认证保护\n\
  \n除了保护数据流量外，还必须确保所有登录凭据得到妥善保护。这要求使用认证协议，并可能强制要求使用集中式远程访问认证系统。这可能包括 `密码认证协议 (PAP)`、`质询握手认证协议\
  \ (CHAP)`、`可扩展认证协议 (EAP，或其扩展 PEAP 或 LEAP)`、`远程认证拨入用户服务 (RADIUS)` 和 `终端访问控制器访问控制系统\
  \ Plus (TACACS+)`。\n\n##### 远程用户协助\n\n远程访问用户可能会定期需要技术协助。必须建立一种机制，以尽可能高效地提供这种协助。这可能包括（例如）解决软硬件问题和用户培训问题。如果组织无法为远程用户技术支持提供合理的解决方案，可能会导致生产力损失、远程系统受损或组织整体安全遭到破坏。\n\
  \n如果难以或无法在远程系统上维护与专用局域网相同级别的安全性，则应考虑到其代表的安全风险，重新评估远程访问方案。`网络准入控制 (NAC)` 可对此提供帮助，但可能会因大量更新和补丁传输而给较慢的连接带来负担。\n\
  \n使用远程访问或建立远程连接的能力应受到严格控制。可以通过基于用户身份、工作站身份、协议、应用程序、内容和时间段的过滤器、规则或访问控制来控制和限制远程连接的使用。\n\
  \n为将远程访问限制为仅授权用户，可以使用回拨和来电显示。回拨是一种机制，它在初次联系时断开远程用户的连接，然后使用预定义的电话号码（即用户账户安全数据库中定义的号码）立即尝试重新连接。回拨确实有一种用户定义模式。然而，该模式并非用于安全目的；而是用于将话费由公司承担，而非向远程客户端收费。来电显示验证可用于与回拨相同的目的——通过电话号码潜在地验证授权用户的物理位置。\n\
  \n安全策略中应包含一项标准规定：不得在任何连接到专用网络的系统上存在未授权的调制解调器。可能还需要进一步明确该策略，规定携带便携式系统的人员必须在连接到网络前移除其调制解调器，或使用禁用调制解调器设备驱动程序的硬件配置文件启动。\n\
  \n### 拨号协议\n\n建立远程连接链路时，必须使用一种协议来管辖链路的实际创建方式，并建立一个通用的通信基础，以便其他协议能在其上运行。只要可能，选择支持安全性的协议非常重要。至少需要一种保护认证的方法，但最好也具备数据加密选项。两种主要的拨号协议示例\
  \ `PPP` 和 `SLIP` 提供链路管辖，不仅适用于真正的拨号链路，也适用于某些 VPN 链路：\n\n#### 点对点协议 (PPP)\n\n这是一种全双工协议，用于通过各种非局域网连接（如调制解调器、`ISDN`、VPN、帧中继等）传输\
  \ `TCP/IP` 数据包。`PPP` 应用广泛，是拨号互联网连接的首选传输协议。`PPP` 认证通过使用各种协议（如 `CHAP` 和 `PAP`）得到保护。`PPP`\
  \ 是 `SLIP` 的替代品，可支持任何局域网协议，而不仅仅是 `TCP/IP`。\n\n#### 串行线路互联网协议 (SLIP)\n\n这是一种较早的技术，旨在支持通过异步串行连接（如串行电缆或调制解调器拨号）进行\
  \ `TCP/IP` 通信。`SLIP` 很少使用，但许多系统仍支持它。它仅支持 `IP`，需要静态 IP 地址，不提供错误检测或纠正，也不支持压缩。\n\n\
  ### 集中式远程认证服务\n\n\n\n\n\n### 远程访问安全\n\n随着远程访问成为组织业务功能的关键要素，在远程客户端与私有网络之间增加安全层往往显得至关重要。集中式远程认证服务（如\
  \ `RADIUS` 和 `TACACS+`）提供了这一额外的保护层。这些机制将远程客户端的认证和授权进程与局域网或本地客户端的进程分离开来。这种分离对安全性很重要，因为如果\
  \ `RADIUS` 或 `TACACS+` 服务器遭到破坏，则仅会影响远程连接，而不会影响网络的其余部分。\n\n#### 远程认证拨号用户服务 (RADIUS)\n\
  \n它用于集中管理远程拨号连接的认证。采用 `RADIUS` 服务器的网络会被配置为：远程访问服务器将拨号用户的登录凭据传递给 `RADIUS` 服务器进行认证。此过程类似于域客户端将登录凭据发送给域控制器进行认证的过程。`RADIUS`\
  \ 在多个端口上运行；你应该识别出原始的 `UDP 1812` 端口，以及 `RADIUS` over `TLS` 所使用的 `TCP 2083` 端口。`RADIUS`\
  \ 的 `TCP` 版本设计于 2012 年，旨在利用 `TLS` 加密（参见 RFC 6614，网址：<https://tools.ietf.org/html/rfc6614>）。\n\
  \n#### 终端访问控制器访问控制系统 (TACACS+)\n\n这是 `RADIUS` 的一种替代方案。`TACACS` 有三个版本：原始 `TACACS`、扩展\
  \ `TACACS` (`XTACACS`) 和 `TACACS+`。`TACACS` 将认证和授权进程集成在一起。`XTACACS` 将认证、授权和审计进程分开。`TACACS+`\
  \ 通过增加双因素认证改进了 `XTACACS`。`TACACS+` 是该产品线中最新且最相关的版本。`TACACS+` 的主要端口是 `TCP 49`。\n\n\
  ### 虚拟专用网络\n\n`虚拟专用网络 (VPN)` 是一种通信隧道，它在中间不受信任的网络上提供认证流量和数据流量的点对点传输。大多数 `VPN` 使用加密来保护封装的流量，但加密并非\
  \ `VPN` 连接的必要条件。\n\n`VPN` 最常与通过互联网在两个远程网络之间建立安全通信路径联系在一起。然而，它们可以存在于任何地方，包括私有网络内部，或连接到\
  \ `ISP` 的终端用户系统之间。`VPN` 可以连接两个网络或两个独立系统。它们可以连接客户端、服务器、路由器、防火墙和交换机。`VPN` 对于为依赖高风险或易受攻击的通信协议或方法的遗留应用程序提供安全性也很有帮助，尤其是在跨网络通信时。\n\
  \n`VPN` 可以在不安全或不受信任的中间网络上提供机密性和完整性。它们不提供或保证可用性。`VPN` 也被相对广泛地用于绕过 `Netflix` 和 `Hulu`\
  \ 等服务的地区限制，从而提供一定程度的（有时存疑的）匿名性。\n\n#### 隧道技术\n\n在真正理解 `VPN` 之前，必须先理解隧道技术。`隧道技术`\
  \ 是一种网络通信过程，它通过将协议数据包封装在另一种协议的数据包中来保护其内容。这种封装在不可信的中间网络上创造了通信隧道的逻辑假象。此虚拟路径存在于通信两端的封装实体和解封装实体之间。\n\
  \n事实上，给祖母寄一封平信就涉及隧道系统的使用。你写好私人信件（主要内容协议数据包）并将其放入信封（隧道协议）中。信封通过邮政服务（不可信的中间网络）投递给预期收件人。你可以在许多情况下使用隧道技术，例如绕过防火墙、网关、代理或其他流量控制设备。绕过是通过将受限内容封装在被授权传输的数据包内来实现的。隧道过程阻止流量控制设备阻断或丢弃通信，因为这些设备不知道数据包实际包含什么。\n\
  \n隧道技术常用于实现原本不连通的系统之间的通信。如果两个系统因缺乏网络连接而分离，可以通过调制解调器拨号链路或其他远程访问或广域网 (`WAN`) 网络服务建立通信链路。实际的\
  \ `LAN` 流量被封装在临时连接所使用的任何通信协议中，例如调制解调器拨号情况下的 `点对点协议`。如果两个网络由采用不同协议的网络连接，分离网络的协议通常可以封装在中间网络的协议内以提供通信路径。\n\
  \n无论实际情况如何，隧道技术通过将内部协议和流量数据包置入（或包裹在）中间网络或连接所使用的授权协议中来保护其内容。如果主协议不可路由，或者为了将网络上支持的协议总数保持在最低限度，可以使用隧道技术。\n\
  \n如果封装协议的行为涉及加密，隧道技术可以提供一种手段，在不担心丢失机密性和完整性的情况下，跨不受信任的中间网络传输敏感数据。\n\n隧道技术并非没有问题。它通常是一种低效的通信方式，因为大多数协议都包含自己的错误检测、错误处理、确认和会话管理功能，因此同时使用多个协议会增加传输单条消息所需的开销。此外，隧道技术会产生更大的数据包或额外的数据包，从而消耗额外的网络带宽。如果带宽不足，隧道技术会迅速使网络饱和。另外，隧道技术是一种点对点通信机制，并非设计用于处理广播流量。在某些情况下，隧道技术也使得监控流量内容变得困难，甚至不可能，给安全从业者带来了问题。\n\
  \n#### VPN 如何工作\n\n`VPN` 链路可以在任何其他网络通信连接上建立。这可以是典型的 `LAN` 电缆连接、无线 `LAN` 连接、远程访问拨号连接、`WAN`\
  \ 链路，甚至是客户端使用互联网连接访问办公室 `LAN`。`VPN` 链路的表现就像典型的直接 `LAN` 电缆连接；唯一可能的区别在于基于中间网络以及客户端系统与服务器系统之间的连接类型的速度差异。通过\
  \ `VPN` 链路，客户端可以执行相同的活动并访问相同的资源，就像直接通过 `LAN` 电缆连接一样。\n\n`VPN` 可以连接两个独立系统或两个完整网络。唯一的区别在于，传输的数据仅在\
  \ `VPN` 隧道内受到保护。网络边界上的远程访问服务器或防火墙充当 `VPN` 的起点和终点。因此，流量在源 `LAN` 内不受保护，在边界 `VPN` 服务器之间受保护，到达目标\
  \ `LAN` 后再次变为不受保护。\n\n用于连接远程网络的通过互联网的 `VPN` 链路通常是专线或租用线路的低成本替代方案。两条连接到本地 `ISP` 的高速互联网链路以支持\
  \ `VPN` 的成本，通常远低于任何其他可用连接方式的成本。\n\n#### 常见 VPN 协议\n\n\n\n\n\nVPN 可以使用软件或硬件解决方案来实现。无论哪种情况，都有四种常见的\
  \ VPN 协议：`PPTP`、`L2F`、`L2TP` 和 `IPsec`。`PPTP`、`L2F` 和 `L2TP` 在 OSI 模型的数据链路层（第 2\
  \ 层）运行。`PPTP` 和 `IPsec` 仅限于在 IP 网络上使用，而 `L2F` 和 `L2TP` 可用于封装任何 LAN 协议。\n\n#####\
  \ 点对点隧道协议\n\n**点对点隧道协议 (PPTP)** 是一种从拨号点对点协议开发而来的封装协议。它在 OSI 模型的数据链路层（第 2 层）运行，并用于\
  \ IP 网络。`PPTP` 在两个系统之间创建点对点隧道并封装 `PPP` 数据包。它通过 `PPP` 支持的相同认证协议为认证流量提供保护：\n\n*  \
  \ Microsoft 质询握手认证协议 (`MS-CHAP`)\n*   质询握手认证协议 (`CHAP`)\n*   密码认证协议 (`PAP`)\n* \
  \  可扩展认证协议 (`EAP`)\n*   Shiva 密码认证协议 (`SPAP`)\n\n`PPTP` 使用的初始隧道协商过程未加密。因此，包含发送方和接收方\
  \ IP 地址的会话建立数据包——可能还包括用户名和哈希密码——可能会被第三方拦截。`PPTP` 用于 VPN，但通常会被 `L2TP` 取代，后者可以使用 `IPsec`\
  \ 为 VPN 提供流量加密。大多数现代 `PPTP` 用法都采用了 Microsoft 定制实现，该实现支持使用 Microsoft 点对点加密 (`MPPE`)\
  \ 进行数据加密，并支持各种安全认证选项。\n\n`PPTP` 不支持 `TACACS+` 和 `RADIUS`。\n\n##### 第 2 层转发协议和第 2\
  \ 层隧道协议\n\nCisco 开发了自己的 VPN 协议，称为第 2 层转发 (`L2F`)，这是一种相互认证隧道机制。然而，`L2F` 不提供加密。`L2F`\
  \ 未被广泛部署，很快就被 `L2TP` 取代了。顾名思义，两者都在第 2 层运行。两者都可以封装任何 LAN 协议。\n\n**第 2 层隧道协议 (L2TP)**\
  \ 是通过结合 `PPTP` 和 `L2F` 的元素而衍生出来的。`L2TP` 在通信端点之间创建点对点隧道。它缺乏内置加密方案，但通常依赖 `IPsec` 作为其安全机制。`L2TP`\
  \ 还支持 `TACACS+` 和 `RADIUS`。`IPsec` 通常用作 `L2TP` 的安全机制。\n\n##### IP 安全协议\n\n目前最常用的\
  \ VPN 协议是 `IPsec`。**IP 安全 (IPsec)** 既是一种独立的 VPN 协议，也是 `L2TP` 的安全机制，并且只能用于 IP 流量。`IPsec`\
  \ 由 `IPv6` 的安全元素组成，被打包成 `IPv4` 的附加包。`IPsec` 仅在 IP 网络上工作，并提供安全认证以及加密数据传输。`IPsec`\
  \ 有两个主要组件或功能：\n\n###### 认证头 (AH)\n\n`AH` 提供认证、完整性和不可抵赖性。\n\n###### 封装安全载荷 (ESP)\n\
  \n`ESP` 提供加密以保护传输数据的机密性，但也可以执行有限的认证。它在网络层（第 3 层）运行，可用于传输模式或隧道模式。在传输模式下，IP 数据包的数据被加密，但数据包的头部不被加密。在隧道模式下，整个\
  \ IP 数据包被加密，并向数据包添加新头部以控制通过隧道的传输。\n\n表 12.1 说明了 VPN 协议的主要特征。\n\n**表 12.1** **VPN\
  \ 特征**\n\n| VPN 协议 | 原生认证保护 | 原生数据加密 | 支持的协议 | 支持拨号链路 | 同时连接数 |\n| :--- | :---:\
  \ | :---: | :---: | :---: | :---: |\n| `PPTP` | 是 | 否 | `PPP` | 是 | 单点对点 |\n| `L2F`\
  \ | 是 | 否 | `PPP`/`SLIP` | 是 | 单点对点 |\n| `L2TP` | 是 | 否（可使用 `IPsec`） | `PPP` | 是\
  \ | 单点对点 |\n| `IPsec` | 是 | 是 | 仅 IP | 否 | 多个 |\n\n封装 `PPP` 的 VPN 协议能够支持任何与 `PPP`\
  \ 兼容的子协议，包括 `IPv4`、`IPv6`、`IPX` 和 `AppleTalk`。\n\nVPN 设备是一种网络附加设备，用于独立于服务器或客户端操作系统创建\
  \ VPN 隧道。VPN 设备的使用对网络系统是透明的。\n\n### 虚拟局域网\n\n**虚拟局域网 (VLAN)** 是由交换机创建的硬件强制网络分段。默认情况下，交换机上的所有端口都属于\
  \ `VLAN 1`。但随着交换机管理员逐端口更改 `VLAN` 分配，各个端口可以被分组在一起，并与其他 `VLAN` 端口指定区分开。`VLAN` 也可以基于设备\
  \ `MAC` 地址分配或创建，镜像 IP 子网划分，围绕指定协议，或基于认证。`VLAN` 管理最常用于区分用户流量和管理流量。而 `VLAN 1` 通常被指定为管理流量\
  \ `VLAN`。\n\n`VLAN` 用于流量管理。同一 `VLAN` 成员之间的通信无障碍进行，但 `VLAN` 之间的通信需要路由功能，该功能可由外部路由器或交换机的内部软件提供（这是\
  \ **L3 交换机** 和 **多层交换机** 术语出现的原因之一）。`VLAN` 被视为子网，但不是子网。`VLAN` 由交换机创建。子网由 IP 地址和子网掩码分配创建。\n\
  \n**VLAN 管理** 是利用 `VLAN` 出于安全或性能原因控制流量。`VLAN` 可用于隔离网络段之间的流量。这可以通过不定义不同 `VLAN` 之间的路由，或通过在特定\
  \ `VLAN` 之间（或 `VLAN` 的特定成员之间）指定拒绝过滤器来实现。任何不需要与另一个网段通信以完成工作任务/功能的网段都不应能够这样做。使用 `VLAN`\
  \ 允许必要的内容，并阻止/拒绝任何不必要的内容。请记住，“默认拒绝；例外允许”不仅是防火墙规则的指导原则，也是安全的一般原则。\n\n`VLAN` 的运作方式与传统子网非常相似。为了使通信从一个\
  \ `VLAN` 传输到另一个 `VLAN`，交换机执行路由功能以控制和过滤其 `VLAN` 之间的流量。\n\n`VLAN` 用于在不改变物理拓扑的情况下对网络进行逻辑分段。它们易于实施，管理开销小，且是基于硬件的解决方案（具体来说是第\
  \ 3 层交换机）。随着网络在虚拟环境或云中构建，通常会使用软件交换机。在这些情况下，`VLAN` 不是基于硬件的，而是基于交换机软件的实现。\n\n`VLAN`\
  \ 让你能够控制和限制广播流量，并降低网络对嗅探器的脆弱性，因为交换机将每个 `VLAN` 视为一个单独的网络分区。要在段之间通信，交换机必须提供路由功能。正是路由功能阻止了子网和\
  \ `VLAN` 之间的广播，因为路由器（或任何执行第 3 层路由功能的设备，如第 3 层交换机）不会转发第 2 层以太网广播。交换机的这一特性阻止了 `VLAN`\
  \ 之间的以太网广播，从而有助于防止广播风暴。**广播风暴** 是不需要的以太网广播网络流量的洪流。\n\n\n\n\n\n#### VLAN 部署中的端口隔离\n\
  \nVLAN 部署的另一个要素是端口隔离或私有端口。这些是配置为使用专用或保留上行端口的私有 VLAN。私有 VLAN 或端口隔离 VLAN 的成员只能相互交互，并通过预定的出口端口或上行端口进行通信。端口隔离的常见实现场景出现在酒店中。酒店网络可配置为使每个房间或套房中的以太网端口在唯一的\
  \ VLAN 上隔离，以便同一单元内的连接可以通信，但单元之间的连接无法通信。然而，所有这些私有 VLAN 都有一条通往互联网的路径（即上行端口）。\n\n###\
  \ 虚拟化\n\n**虚拟化** 技术用于在单台主机计算机的内存中托管一个或多个操作系统。此机制允许几乎任何操作系统在任何硬件上运行。这种操作系统也称为客户操作系统。从直接安装在计算机硬件上存在原始或主机操作系统的角度来看，由管理程序系统托管的额外操作系统是客户机。它还允许多个操作系统在同一硬件上同时工作。常见示例包括\
  \ `VMware/vSphere`、`Microsoft Hyper-V`、`VirtualBox`、`XenServer` 和 `Apple Parallels`。\n\
  \n从用户角度来看，虚拟化服务器和服务与传统服务器和服务无法区分。\n\n虚拟化有几个优势，例如能够根据需要启动单个服务器或服务实例、实时可扩展性，以及能够运行所需应用程序所需的确切操作系统版本。此外，从损坏、崩溃或损坏的虚拟系统中恢复通常很快：只需将虚拟系统的主硬盘文件替换为干净的备份版本，然后重新启动它即可。\n\
  \n在安全方面，虚拟化提供了几个优势。与同等的原生硬件安装系统相比，备份整个虚拟系统通常更容易、更快。此外，当发生错误或问题时，虚拟系统可在几分钟内通过备份替换。恶意代码对虚拟系统的入侵或感染很少影响主机操作系统。这允许进行安全的测试和实验。\n\
  \n**VM 逃逸** 是指客户操作系统中的软件能够突破管理程序提供的隔离保护，从而侵犯其他客户操作系统的容器或渗透主机操作系统。近期已发现多个逃逸漏洞。幸运的是，供应商迅速发布了补丁。例如，虚拟化环境被忽视的操作操纵\
  \ (`VENOM`) 能够突破采用受损开源虚拟软盘驱动程序的众多 VM 产品，允许恶意代码在 VM 之间跳转，甚至访问主机。\n\nVM 逃逸可能是一个严重问题，但可以采取措施将风险降至最低。首先，将高度敏感的系统和数据保留在单独的物理机器上。组织本应关注过度整合导致的单点故障，因此运行多台硬件服务器，使每台仅支持少量客户操作系统，有助于降低此风险。保持足够的物理服务器以维持高度敏感客户操作系统之间的物理隔离，将进一步防范\
  \ VM 逃逸。其次，保持所有管理程序软件为供应商发布的最新补丁（特别是与 VM 逃逸漏洞相关的更新）。第三，监控攻击、暴露和滥用指数，以发现针对您环境的新威胁。\n\
  \n虚拟化用于各种新架构和系统设计解决方案。云计算终究是一种虚拟化形式（有关云计算的更多信息，请参见第 9 章“安全漏洞、威胁和对策”）。在本地（或至少在组织的私有基础设施内），虚拟化可用于托管服务器、客户操作系统、受限用户界面（即虚拟桌面）、应用程序等。\n\
  \n##### 虚拟软件\n\n**虚拟应用程序** 是以一种方式部署的软件产品，使其误以为正在与完整的主机操作系统交互。虚拟（或虚拟化）应用程序已打包或封装，使其具有可移植性，并能在无需完全安装其原始主机操作系统的情况下运行。虚拟应用程序在其封装气泡（技术上称为虚拟机，或\
  \ `VM`）中包含了足够的原始主机操作系统组件，使其运行/功能如同传统安装一般。某些形式的虚拟应用程序用作 USB 驱动器上的便携式应用（应用程序的简称）。其他虚拟应用程序设计为在替代主机操作系统平台上执行——例如，在\
  \ `Linux` 操作系统中运行 `Windows` 应用程序。\n\n术语**虚拟桌面** 指至少三种不同类型的技术：\n\n*   一种远程访问工具，通过允许远程查看和控制远程桌面的显示器、键盘、鼠标等，授予用户访问远程计算机系统的权限。\n\
  *   虚拟应用程序概念的延伸，封装多个应用程序和某种形式的“桌面”或 Shell，以实现可移植性或跨操作系统操作。此技术将一个平台的某些功能/优势/应用程序提供给另一个平台的用户，而无需多台计算机、双重启动或虚拟化整个操作系统平台。\n\
  *   一种比所用显示器更大的扩展或扩充桌面，允许用户采用多种应用程序布局，使用按键或鼠标移动在它们之间切换。\n\n有关虚拟化作为安全架构和设计一部分的更多信息，请参见第\
  \ 8 章“安全模型、设计和能力原则”和第 9 章“安全漏洞、威胁和对策”。\n\n##### 虚拟网络\n\n操作系统虚拟化的概念催生了其他虚拟化主题，例如虚拟化网络。虚拟化网络或**网络虚拟化**\
  \ 是将硬件和软件网络组件组合成单个集成实体。生成的系统允许通过软件控制所有网络功能：管理、流量整形、地址分配等。单个管理控制台或界面可用于监督网络的各个方面，而过去这项任务需要亲临每个硬件组件现场。虚拟化网络已成为全球企业进行基础设施部署和管理的流行手段。它们允许组织实施或调整其他有趣的网络解决方案，包括软件定义网络、虚拟\
  \ SAN、客户操作系统和端口隔离。\n\n**软件定义网络 (`SDN`)** 是一种独特的网络操作、设计和管理方法。该概念基于这样一种理论：具有设备上配置（即路由器和交换机）的传统网络的复杂性，往往迫使组织坚持使用单一设备供应商（如\
  \ `Cisco`），并限制网络适应不断变化的物理和业务条件的灵活性。`SDN` 旨在将基础设施层（即硬件和基于硬件的设置）与控制层（即数据传输管理的网络服务）分离。此外，这还消除了传统网络概念（如\
  \ `IP` 寻址、子网、路由等）被编程到托管应用程序中或需要由其解读的必要性。\n\n\n\n\n### SDN\n\nSDN 提供了一种新的网络设计，该设计可从中心位置直接编程，具有灵活性、供应商中立性，并基于开放标准。使用\
  \ SDN 使组织无需从单一供应商处采购设备。相反，它允许组织根据需要混合搭配硬件，例如选择最具成本效益或吞吐量评级最高的设备，而不受供应商限制。然后通过集中式管理界面控制硬件的配置和管理。此外，应用于硬件的设置可根据需要动态更改和调整。\n\
  \n#### 静态和动态 NAT\n\nNAT 可在两种模式下使用：静态和动态。\n\n##### 静态 NAT\n\n当特定内部客户端的 IP 地址被分配了到特定外部公共\
  \ IP 地址的永久映射时，请使用静态模式 NAT。即使您正在使用 `RFC 1918` IP 地址，这也允许外部实体与您网络内的系统进行通信。\n\n#####\
  \ 动态 NAT\n\n使用动态模式 NAT 可授予多个内部客户端访问少量租用公共 IP 地址的权限。因此，大型内部网络无需租用大量公共 IP 地址块即可访问互联网。这将公共\
  \ IP 地址使用滥用降至最低，并有助于将互联网接入成本保持在最低水平。\n\n在动态模式 NAT 实现中，NAT 系统维护一个映射数据库，以便将来自互联网服务的所有响应流量正确路由到最初发起请求的内部客户端。NAT\
  \ 通常与代理服务器或代理防火墙结合使用，以提供额外的互联网接入和内容缓存功能。\n\nNAT 与 IPsec 不直接兼容，因为它会修改数据包头部，而 IPsec\
  \ 依赖数据包头部来防止安全违规。但是，存在专门设计用于支持 IPsec over NAT 的 NAT 代理版本。具体而言，`NAT-Traversal` (`RFC\
  \ 3947`) 旨在通过 UDP 封装 IKE 来支持 IPsec VPN。IP 安全 (IPsec) 是一种基于标准的机制，用于为点对点 TCP/IP 流量提供加密。\n\
  \n### 自动专用 IP 寻址\n\n`自动专用 IP 寻址 (APIPA)`，又称链路本地地址分配（定义于 `RFC 3927`），在动态主机配置协议 (DHCP)\
  \ 分配失败时为系统分配 IP 地址。APIPA 主要是 Windows 的一项功能。APIPA 为每个失败的 DHCP 客户端分配 `169.254.0.1`\
  \ 到 `169.254.255.254` 范围内的 IP 地址，以及默认的 B 类子网掩码 `255.255.0.0`。这允许系统与同一广播域内的其他 APIPA\
  \ 配置客户端通信，但无法跨路由器与任何系统或正确分配了 IP 地址的系统通信。\n\n\n\n\n### APIPA\n\nAPIPA 通常不直接涉及安全问题。然而，它仍然是一个需要理解的重要问题。如果你发现某个系统被分配了\
  \ APIPA 地址而不是有效的网络地址，这表明存在问题。这可能只是像坏线缆或 DHCP 服务器断电这样平常的原因，但也可能是 DHCP 服务器遭受恶意攻击的症状。你可能会被要求在给出\
  \ IP 地址的场景中判断问题。你应该能够辨别某个地址是公网地址、RFC 1918 私有地址、APIPA 地址还是环回地址。\n\n### 交换技术\n\n当两个系统（单个计算机或局域网）通过多个中间网络连接时，将数据包从一个传输到另一个的任务是一个复杂的过程。为了简化这一任务，开发了交换技术。第一种交换技术是电路交换。\n\
  \n#### 电路交换\n\n**电路交换**最初是为在公用交换电话网上管理电话呼叫而开发的。在电路交换中，会在两个通信方之间创建一条专用的物理路径。一旦呼叫建立，双方之间的链路在整个通话过程中保持不变。这提供了固定或已知的传输时间、统一的质量水平，以及极少或没有信号丢失或通信中断。电路交换系统采用永久的物理连接。然而，*永久*一词仅适用于每个通信会话。该路径在单次通话期间是永久的。一旦路径断开，如果双方再次通信，可能会组装一条不同的路径。在单次通话期间，相同的物理或电子路径贯穿整个通信过程，且仅用于该次通信。电路交换授予当前通信伙伴对通信路径的独占使用权。只有在会话关闭后，路径才能被其他通信重用。\n\
  \n#### 分组交换\n\n最终，随着计算机通信的增加超过了语音通信，开发了一种新形式的交换。**分组交换**发生在消息或通信被分解成小段（通常是固定长度的分组，具体取决于所采用的协议和技术）并通过中间网络发送到目的地时。每个数据段都有自己的头部，其中包含源和目的地信息。每个中间系统读取头部，并用它将每个分组路由到其预期目的地。每个信道或通信路径仅在分组实际在其上传输时被保留使用。一旦分组发送完毕，该信道即可供其他通信使用。\n\
  \n分组交换不强制通信路径的独占性。它可以被视为一种逻辑传输技术，因为寻址逻辑决定了通信如何在通信伙伴之间穿越中间网络。表 12.2 对比了电路交换与分组交换。\n\
  \n##### 表 12.2：电路交换 vs. 分组交换\n\n| 电路交换 | 分组交换 |\n| --- | --- |\n| 恒定流量 | 突发流量 |\n\
  | 固定已知延迟 | 可变延迟 |\n| 面向连接 | 无连接 |\n| 对连接丢失敏感 | 对数据丢失敏感 |\n| 主要用于语音 | 用于任何类型的流量 |\n\
  \n就安全而言，有几个潜在问题需要考虑。分组交换系统将来自不同源的数据放在同一物理连接上。这可能导致泄露、篡改或窃听。需要适当的连接管理、流量隔离，通常还需要加密，以防范共享物理路径带来的担忧。分组交换网络的一个优势是，它们不像电路交换那样依赖特定的物理连接。因此，当物理路径损坏或离线时，可以使用备用路径继续数据/分组传输。电路交换网络经常因物理路径故障而中断。\n\
  \n#### 虚电路\n\n**虚电路**（也称为通信路径）是在分组交换网络上两个特定端点之间创建的逻辑路径或电路。分组交换系统中有两种类型的虚电路：\n\n\
  *   **永久虚电路 (PVC)**\n*   **交换虚电路 (SVC)**\n\nPVC 类似于专用租用线路；逻辑电路始终存在并等待客户发送数据。PVC\
  \ 是一种预定义的虚电路，始终可用。虚电路在不使用时可能会关闭，但需要时可即时重新打开。SVC 更像拨号连接，因为必须使用当前可用的最佳路径创建虚电路后才能使用，传输完成后再将其拆除。在任一类型的虚电路中，当数据包进入虚电路连接的\
  \ A 点时，该数据包会被直接发送到 B 点或虚电路的另一端。然而，同一传输中一个数据包的实际路径可能不同于另一个数据包的路径。换句话说，作为虚电路两端的 A\
  \ 点和 B 点之间可能存在多条路径，但进入 A 点的任何数据包最终都会到达 B 点。\n\nPVC 就像双向无线电或对讲机。每当需要通信时，你按下按钮开始说话；无线电会自动重新打开预定义的频率（即虚电路）。SVC\
  \ 更像短波或业余无线电。每次想与某人通信时，你都必须将发射机和接收机调谐到新频率。\n\n### WAN 技术\n\n广域网链路用于连接远程的网络、节点或单个设备。这可以改善通信和效率，但也可能使数据面临风险。为了确保连接安全，尤其是在公共网络链路上，需要适当的连接管理和传输加密。WAN\
  \ 链路和长距离连接技术可分为两大类：\n\n**专用线路**（也称为**租用线路**或点对点链路）是无限期且持续为特定客户保留使用的线路（参见表 12.3）。专用线路始终开启并等待传输流量。客户局域网与专用\
  \ WAN 链路之间的链接始终是开放且已建立的。专用线路连接两个特定端点，且仅连接这两个端点。\n\n#### 表 12.3：专用线路示例\n\n| 技术 |\
  \ 连接类型 | 速度 |\n| --- | --- | --- |\n| 数字信号级别 0 (DS-0) | 部分 T1 | 64 Kbps 至 1.544\
  \ Mbps |\n| 数字信号级别 1 (DS-1) | T1 | 1.544 Mbps |\n| 数字信号级别 3 (DS-3) | T3 | 44.736\
  \ Mbps |\n| 欧洲数字传输格式 1 | E1 | 2.108 Mbps |\n| 欧洲数字传输格式 3 | E3 | 34.368 Mbps |\n\
  | 电缆调制解调器或电缆路由器 | | 10+ Mbps |\n\n**非专用线路**是指在数据传输发生前需要建立连接的线路。非专用线路可用于连接任何使用相同类型非专用线路的远程系统。\n\
  \n标准调制解调器、DSL 和 ISDN 是非专用线路的示例。数字用户线路 (DSL) 是一种利用升级后的电话网络为消费者提供 144 Kbps 至 20 Mbps（或更高）速度的技术。DSL\
  \ 有多种格式，如 ADSL、xDSL、CDSL、HDSL、SDSL、RASDSL、IDSL 和 VDSL。每种格式在具体提供下行和上行带宽方面有所不同。\n\n\
  \n\n\nDSL 线路距离中心局（即电话网络的一种特定类型的分发节点）的最大距离约为 5,000 米。\n\n*综合业务数字网 (ISDN)* 是一种完全数字化的电话网络，同时支持语音和高速数据通信。ISDN\
  \ 服务有两种标准类别或格式：\n\n*   **基本速率接口 (BRI)** 为客户提供包含两个 B 信道和一个 D 信道的连接。B 信道支持 64 Kbps\
  \ 的吞吐量，用于数据传输。D 信道用于呼叫建立、管理和拆除，带宽为 16 Kbps。尽管 D 信道并非设计用于支持数据传输，但 BRI ISDN 被称为可为用户提供总计\
  \ 144 Kbps 的总吞吐量。\n\n*   **主速率接口 (PRI)** 为用户提供包含多个 64 Kbps B 信道（2 到 23 个）和一个 64\
  \ Kbps D 信道的连接。因此，PRI 可部署的带宽范围从 192 Kbps 到 1.544 Mbps。但请记住，这些数字是带宽而非吞吐量，因为它们包含了不能用于实际数据传输的\
  \ D 信道（至少在大多数正常的商业实现中不能）。\n\n#### WAN 连接技术\n\n对于需要多个地点之间甚至外部合作伙伴之间通信服务的公司，有许多可用的\
  \ WAN 连接技术。这些 WAN 技术在成本和吞吐量方面差异很大。然而，大多数共享一个共同特性：对连接的 LAN 或系统是透明的。WAN 交换机、专用路由器或边界连接设备提供了网络运营商服务与公司\
  \ LAN 之间所需的所有接口。边界连接设备称为 *信道服务单元/数据服务单元 (CSU/DSU)*。这些设备将 LAN 信号转换为 WAN 运营商网络使用的格式，反之亦然。CSU/DSU\
  \ 包含 *数据终端设备/数据电路终接设备 (DTE/DCE)*，它为 LAN 的路由器（DTE）和 WAN 运营商网络的交换机（DCE）提供实际的连接点。CSU/DSU\
  \ 充当转换器、存储转发设备和链路调节器。WAN 交换机只是针对特定类型的运营商网络、内置 CSU/DSU 的 LAN 交换机的专用版本。有许多类型的运营商网络或\
  \ WAN 连接技术，例如 `X.25`、`Frame Relay`、`ATM` 和 `SMDS`。\n\n##### X.25 WAN 连接\n\n*X.25*\
  \ 是一种较老的分组交换技术，曾在欧洲广泛使用。它使用永久虚拟电路在两个系统或网络之间建立特定的点对点连接。它是 Frame Relay 的前身，运作方式大致相同。由于与\
  \ Frame Relay 或 ATM 相比，其性能和吞吐率较低，X.25 的使用正在减少。然而，即使是 Frame Relay 和 ATM 也计划退役，因为它们正被光纤和无线解决方案取代。\n\
  \n##### Frame Relay 连接\n\n与 X.25 类似，*Frame Relay* 也是一种分组交换技术，也使用 PVC（参见虚拟电路的讨论）。然而，与\
  \ X.25 不同的是，Frame Relay 支持在单个 WAN 运营商服务连接上建立多个 PVC。Frame Relay 是一种第 2 层连接机制，它使用分组交换技术在通信端点之间建立虚拟电路。与专线或租用线（其成本主要基于端点间的距离）不同，Frame\
  \ Relay 的成本主要基于传输的数据量。Frame Relay 网络是一种共享介质，通过在其上创建虚拟电路来提供点对点通信。所有虚拟电路彼此独立且不可见。\n\
  \n与 Frame Relay 相关的一个关键概念是 *承诺信息速率 (CIR)*。CIR 是服务提供商向客户保证的最小带宽。它通常远低于提供商网络的实际最大能力。每个客户可能会在其合同中建立并定义不同的\
  \ CIR。当有额外带宽可用时，服务网络提供商可能允许客户在短时间内超过其 CIR。这称为按需带宽。（尽管乍一听这似乎是一项杰出的福利，但现实是客户需为额外消耗的带宽支付溢价。）Frame\
  \ Relay 作为一种面向连接的分组交换传输技术，在 OSI 模型的第 2 层（数据链路层）运行。\n\nFrame Relay 要求在每个连接点使用 DTE/DCE。客户拥有\
  \ DTE，它充当路由器或交换机，为客户网络提供对 Frame Relay 网络的访问。Frame Relay 服务提供商拥有 DCE，它执行数据在 Frame\
  \ Relay 上的实际传输，以及为客户建立和维护虚拟电路。然而，Frame Relay 现在是一种较老的技术，正在被更快的光纤解决方案逐步淘汰。\n\n#####\
  \ ATM\n\n*异步传输模式 (ATM)* 是一种单元交换 WAN 通信技术，不同于像 Frame Relay 这样的分组交换技术。它将通信分片为固定长度的\
  \ 53 字节单元。固定长度单元的使用使 ATM 能够非常高效并提供高吞吐量。ATM 可以使用 PVC 或 SVC。与 Frame Relay 提供商一样，ATM\
  \ 提供商可以为其租用服务保证最小带宽和特定的服务质量等级。当服务网络上有可用带宽时，客户通常可以按需消耗额外带宽，并按使用付费。ATM 是一种面向连接的分组交换技术。然而，ATM\
  \ 现在是一种较老的技术，正在被更快的光纤解决方案逐步淘汰。\n\n##### SMDS\n\n*交换多兆位数据服务 (SMDS)* 是一种无连接的分组交换技术。通常，SMDS\
  \ 用于连接多个 LAN 以形成城域网 (MAN) 或广域网 (WAN)。SMDS 曾是连接通信不频繁的远程 LAN 的首选连接机制。SMDS 支持高速突发流量和按需带宽。它将数据分片为小的传输单元。\n\
  \n##### 同步数字体系和同步光网络\n\n同步数字体系 (SDH) 和同步光网络 (SONET) 是光纤高速网络标准。SDH 由国际电信联盟 (ITU)\
  \ 标准化，SONET 由美国国家标准协会 (ANSI) 标准化。SDH 和 SONET 主要是硬件或物理层标准，定义基础设施和线路速率要求。SDH 和 SONET\
  \ 使用同步时分复用 (TDM) 实现高速双工通信，且只需极少的控制和管理开销。\n\n这两个标准只有细微差别，并使用相同的带宽级别层次结构。传输服务支持 51.48\
  \ Mbps 的基础速度级别，该级别支持 SDH 的同步传输信号 (STS) 和/或 SONET 的同步传输模块 (STM)。光载波 (OC) 一词也可替代 STS。SDH\
  \ 和 SONET 的主要带宽级别如 表 12.4 所示。\n\n**表 12.4 SDH 和 SONET 的带宽级别**\n\n| SONET | SDH |\
  \ 数据速率 |\n| :--- | :--- | :--- |\n| STS-1 / OC-1 | STM-0 | 51.84 Mbps |\n| STS-3\
  \ / OC-3 | STM-1 | 155.52 Mbps |\n| STS-12 / OC-12 | STM-4 | 622.08 Mbps |\n| STS-48\
  \ / OC-48 | STM-16 | 2.488 Gbps |\n| STS-96 / OC-96 | STM-32 | 4.876 Gbps |\n| STS-192\
  \ / OC-192 | STM-64 | 9.953 Gbps |\n| STS-768 / OC-768 | STM-256 | 39.813 Gbps |\n\
  \n\n\n\n### SDH 和 SONET 拓扑\n\nSDH 和 SONET 均支持网状和环状拓扑。这些光纤解决方案通常作为电信服务的骨干网实施，并将容量的划分或部分租赁给客户。SDH\
  \ 和 SONET 的互连点或节点通常是加/析复用器（ADM），它允许将低速比特流连接或产品添加到主干线中或从中移除。\n\n#### 专用协议\n\n某些 WAN\
  \ 连接技术需要额外的专用协议来支持各种类型的专用系统或设备。其中三种协议是 SDLC、HDLC 和 HSSI：\n\n##### 同步数据链路控制（SDLC）\n\
  \n**同步数据链路控制**用于专用租用线的永久物理连接，为大型主机（如 IBM 系统网络架构 [SNA] 系统）提供连接。SDLC 使用轮询，工作在 OSI\
  \ 第 2 层（数据链路层），是一种面向比特的同步协议。\n\n##### 高级数据链路控制（HDLC）\n\n**高级数据链路控制**是 SDLC 的改进版本，专为串行同步连接设计。HDLC\
  \ 支持全双工通信，并支持点对点和多点连接。与 SDLC 一样，HDLC 使用轮询并工作在 OSI 第 2 层（数据链路层）。HDLC 提供流量控制，并包含错误检测和纠正功能。\n\
  \n#### 拨号封装协议\n\n点对点协议（PPP）是一种封装协议，旨在支持 IP 流量通过拨号或点对点链路传输。PPP 允许支持串行链路的 WAN 设备实现多厂商互操作性。所有拨号连接和大多数点对点连接本质上都是串行的（而非并行）。PPP\
  \ 包含广泛的通信服务，包括 IP 地址的分配和管理、同步通信的管理、标准化封装、复用、链路配置、链路质量测试、错误检测，以及功能或选项协商（如压缩）。\n\n\
  PPP 最初设计用于支持 CHAP 和 PAP 进行认证。然而，PPP 的新版本还支持 MS-CHAP、EAP 和 SPAP。PPP 还可用于支持 Internetwork\
  \ Packet Exchange（IPX）和 DECnet 协议。PPP 是一项记录在 RFC 1661 中的互联网标准。它取代了串行线路互联网协议（SLIP）。SLIP\
  \ 不提供认证、仅支持半双工通信、无错误检测能力，且需要手动建立和拆除链路。\n\n### 杂项安全控制特性\n\n当您为网络通信选择或部署安全控制时，需要结合您的环境、能力和安全策略评估众多特性。我们将在以下章节讨论这些问题。\n\
  \n#### 透明性\n\n顾名思义，*透明性*是服务、安全控制或访问机制的一种特性，确保其对用户不可见。透明性通常是安全控制的理想特性。安全机制越透明，用户绕过它甚至察觉其存在的可能性就越小。透明性意味着缺乏直接证据证明某项功能、服务或限制的存在，且其对性能的影响微乎其微。\n\
  \n在某些情况下，透明性可能需要作为可配置功能而非永久运行特性发挥作用，例如管理员在排查故障、评估或调整系统配置时。\n\n#### 验证完整性\n\n要验证传输的完整性，可以使用称为哈希总和的校验和。在消息或数据包通过通信路径发送前，对其执行哈希函数。获得的哈希总和被添加到消息末尾，称为消息摘要。消息接收后，目标系统执行哈希函数，并将结果与原始哈希总和进行比较。如果两个哈希总和匹配，则可以高度确定消息在传输过程中未被篡改或损坏。哈希总和与循环冗余校验（CRC）类似，二者均作为完整性工具。在大多数安全事务系统中，使用哈希函数来保证通信完整性。\n\
  \n记录序列检查类似于哈希总和检查；不过，它验证的是数据包或消息序列的完整性，而非内容完整性。许多通信服务采用记录序列检查，以验证消息的任何部分均未丢失，且消息的所有元素均按正确顺序排列。\n\
  \n#### 传输机制\n\n传输日志记录是一种专注于通信的审计形式。传输日志记录记录有关源、目的地、时间戳、识别码、传输状态、数据包数量、消息大小等详细信息。这些信息可用于排查故障、追踪未经授权的通信，或被用作提取系统运作数据的手段。\n\
  \n传输错误纠正是内置于面向连接或面向会话的协议和服务中的一项能力。如果确定消息（整体或部分）已损坏、篡改或丢失，可请求源端重发全部或部分消息。重传控制决定在传输错误纠正系统发现通信问题时，是重发全部还是部分消息。重传控制还可决定是否发送多份哈希总和或\
  \ CRC 值，以及是否采用多条数据路径或通信通道。\n\n### 安全边界\n\n*安全边界*是指具有不同安全要求或需求的任意两个区域、子网或环境之间的交界线。安全边界存在于高安全区域和低安全区域之间，例如\
  \ LAN 和互联网之间。识别网络和物理世界中的安全边界至关重要。一旦识别出安全边界，就需要部署机制来控制跨越这些边界的信息流。\n\n安全区域之间的划分可以采取多种形式。例如，对象可能具有不同的分类。每个分类定义了哪些主体可以对哪些对象执行哪些功能。分类之间的区别即构成安全边界。\n\
  \n安全边界也存在于物理环境和逻辑环境之间。为提供逻辑安全，必须提供不同于物理安全所用的安全机制。两者均须到位以提供完整的安全架构，且均须在安全策略中予以阐述。然而，二者不同，必须作为安全解决方案的独立要素进行评估。\n\
  \n安全边界（如受保护区域与非受保护区域之间的边界）应始终清晰定义。在安全策略中说明控制开始或结束的点，并在物理和逻辑环境中标识该点非常重要。逻辑安全边界是电子通信与贵组织依法负责的设备或服务进行接口的点。在大多数情况下，该接口有明确标识，并告知未经授权的主体其无访问权限，且尝试获取访问权将导致起诉。\n\
  \n\n\n\n物理环境中的安全边界通常是逻辑环境安全边界的反映。在大多数情况下，组织依法负责的区域决定了安全策略在物理领域的覆盖范围。这可以是办公室的墙壁、建筑物的墙壁，或是校园周围的围栏。在安全环境中，会张贴警示标志，表明禁止未经授权的访问，且企图获取访问权限的行为将被阻止并追究法律责任。\n\
  \n将安全策略转化为实际控制措施时，必须分别考虑每个环境和安全边界。只需推断可用的安全机制中，哪些能为特定环境和情况提供最合理、最具成本效益且最高效的解决方案。然而，所有安全机制都必须与其所保护对象的价值进行权衡。部署成本超过受保护对象价值的对策是不合理的。\n\
  \n#### 预防或缓解网络攻击\n\n通信系统容易遭受攻击，这与 IT 基础设施的任何其他方面容易受到攻击的方式大致相同。了解威胁和可能的对策是保护环境安全的重要组成部分。任何可能对数据、资源或人员造成危害的活动或状况都必须得到处理，并在可能的情况下加以缓解。请记住，危害不仅包括破坏或损坏，还包括泄露、访问延迟、拒绝访问、欺诈、资源浪费、资源滥用和丢失。针对通信系统安全的常见威胁包括拒绝服务、窃听、冒充、重放和篡改。\n\
  \n##### DoS 和 DDoS\n\n`拒绝服务 (DoS)` 攻击是一种资源消耗攻击，其主要目标是阻止合法活动在受害系统上进行。`DoS` 攻击会导致目标无法响应合法流量。\n\
  \n拒绝服务有两种基本形式：\n\n*   利用硬件或软件漏洞的攻击。这种对弱点、错误或软件标准功能的利用，旨在导致系统挂起、冻结、耗尽所有系统资源等。最终结果是受害计算机无法处理任何合法任务。\n\
  *   用垃圾网络流量淹没受害者通信管道的攻击。这些攻击有时被称为流量生成攻击或洪水攻击。最终结果是受害计算机无法发送或接收合法的网络通信。\n\n无论哪种情况，受害者都被剥夺了执行正常操作（服务）的能力。\n\
  \n`DoS` 不是单一攻击，而是一整类攻击。一些攻击利用操作系统软件中的缺陷，而另一些则针对已安装的应用程序、服务或协议。一些攻击利用特定协议，包括 `Internet\
  \ Protocol (IP)`、`Transmission Control Protocol (TCP)`、`Internet Control Message\
  \ Protocol (ICMP)` 和 `User Datagram Protocol (UDP)`。\n\n`DoS` 攻击通常发生在一名攻击者和一名受害者之间。然而，情况并不总是那么简单。大多数\
  \ `DoS` 攻击都采用某种形式的中间系统（通常是不情愿且不知情的参与者）来向受害者隐藏攻击者。例如，如果攻击者直接向受害者发送攻击数据包，受害者有可能发现攻击者是谁。通过使用欺骗（本章其他地方有更详细的描述），这变得更加困难，尽管并非不可能。\n\
  \n许多 `DoS` 攻击始于攻破或渗透一个或多个中间系统，这些系统随后充当发起点或攻击平台。这些中间系统通常被称为次级受害者。攻击者在这些系统上安装远程控制工具，通常称为\
  \ `bots`、`zombies` 或 `agents`。然后，在约定的时间或响应攻击者的发起命令时，对受害者发动 `DoS` 攻击。受害者可能能够发现导致\
  \ `DoS` 攻击的僵尸系统，但很可能无法追踪到实际的攻击者。涉及僵尸系统的攻击称为 `分布式拒绝服务 (DDoS)` 攻击。跨多个不知情的次级受害者部署大量\
  \ bots 或 zombies 的行为被称为 `botnets`。\n\n以下是针对这些攻击的一些对策和防护措施：\n\n*   添加能够检测 `DoS` 流量并根据源地址或目标地址自动阻断端口或过滤数据包的防火墙、路由器和入侵检测系统\
  \ (`IDSs`)。\n*   与服务提供商保持良好联系，以便在发生 `DoS` 时请求过滤服务。\n*   在外部系统上禁用回显应答。\n*   在边界系统上禁用广播功能。\n\
  *   阻止欺骗数据包进入或离开您的网络。\n*   使用供应商提供的最新安全更新为所有系统打补丁。\n*   考虑商业 `DoS` 防护/响应服务，如 `CloudFlare's\
  \ DDoS mitigation` 或 `Prolexic`。这些服务可能很昂贵，但通常很有效。\n\n关于 `DoS` 和 `DDoS` 的进一步讨论，请参见第\
  \ 17 章“预防和响应事件”。\n\n##### 窃听\n\n顾名思义，`窃听` 就是监听通信流量以复制它。复制可以采取将数据记录到存储设备的形式，也可以使用提取程序动态尝试从流量流中提取原始内容。一旦通信内容的副本落入攻击者手中，他们通常可以提取多种形式的机密信息，如用户名、密码、流程程序、数据等。\n\
  \n`窃听` 通常需要物理访问 IT 基础设施，以便将物理记录设备连接到开放端口或电缆接头，或在系统上安装软件记录工具。`窃听` 通常通过使用网络流量捕获或监控程序或协议分析系统（通常称为\
  \ `sniffer`）来实施。`窃听` 设备和软件通常难以检测，因为它们用于被动攻击。当 `窃听` 或窃听演变为篡改或注入通信时，该攻击被视为主动攻击。\n\n\
  您可以通过维护物理访问安全来防止未经授权的人员访问您的 IT 基础设施，从而对抗 `窃听`。至于保护发生在您网络外部的通信，或防范内部攻击者，在通信流量上使用加密（如\
  \ `IPsec` 或 `SSH`）和一次性认证方法（即一次性密码本或令牌设备）将大大降低 `窃听` 的有效性和时效性。\n\n常见的 `窃听` 威胁是维护可靠通信安全的主要动机之一。数据在传输过程中往往比在存储时更容易被拦截。此外，通信线路可能位于组织控制范围之外。因此，在数据传输离开内部基础设施时采取可靠手段保护其安全至关重要。一些常见的网络健康和通信可靠性评估及管理工具（如\
  \ `sniffers`）可能被用于不法目的，因此需要严格的控制和监督以防止滥用。\n\n##### 冒充/伪装\n\n\n\n\n### 冒充\n\n**冒充**，或**伪装**，是指假装成你不是的某人或某物，以获取对系统的未授权访问。这通常意味着认证凭据已被窃取或伪造，以满足（即成功绕过）认证机制。这与欺骗不同，欺骗是指实体提出虚假身份但不提供任何证明（例如虚假使用\
  \ IP 地址、MAC 地址、电子邮件地址、系统名称、域名等）。冒充通常通过捕获用户名和密码或网络服务的会话建立过程来实现。\n\n防止冒充的一些解决方案包括使用一次性密码本和令牌认证系统、使用\
  \ Kerberos，以及使用加密来增加从网络流量中提取认证凭据的难度。\n\n#### 重放攻击\n\n**重放攻击**是冒充攻击的一种衍生形式，通过窃听捕获网络流量而成为可能。重放攻击试图通过向系统重放捕获的流量来重新建立通信会话。你可以通过使用一次性认证机制和排序的会话标识来防止它们。\n\
  \n#### 修改攻击\n\n在**修改攻击**中，捕获的数据包被篡改后再针对系统重放。修改后的数据包旨在绕过改进的认证机制和会话排序的限制。针对修改重放攻击的对策包括使用数字签名验证和数据包校验和验证。\n\
  \n#### 地址解析协议欺骗\n\n**地址解析协议 (ARP)** 是 **TCP/IP** 协议套件的一个子协议，在数据链路层（第 2 层）运行。ARP\
  \ 用于通过使用 IP 地址进行轮询来发现系统的 MAC 地址。ARP 通过广播一个包含目标 IP 地址的请求数据包来工作。拥有该 IP 地址的系统（或已有其\
  \ ARP 映射的其他系统）将回复相关联的 MAC 地址。发现的 IP 到 MAC 映射存储在 ARP 缓存中，并用于指导数据包转发。\n\nARP 映射可能通过欺骗受到攻击。**ARP\
  \ 欺骗**为请求的 IP 地址系统提供虚假 MAC 地址，以将流量重定向到备用目标。ARP 攻击通常是中间人攻击的一个要素。此类攻击涉及入侵者的系统将其 MAC\
  \ 地址针对目标 IP 地址伪装到源系统的 ARP 缓存中。从源系统接收的所有数据包会被检查，然后转发给实际的预期目标系统。你可以采取措施来对抗 ARP 攻击，例如为关键系统定义静态\
  \ ARP 映射、监控 ARP 缓存中的 MAC 到 IP 地址映射，或使用 IDS 检测系统流量中的异常和 ARP 流量的变化。\n\n#### DNS 投毒、欺骗和劫持\n\
  \n**DNS 投毒**和 **DNS 欺骗**也称为解析攻击。**域名系统 (DNS)** 投毒发生在攻击者篡改 DNS 系统中的域名到 IP 地址映射时，以将流量重定向到恶意系统，或仅仅是对系统执行拒绝服务。DNS\
  \ 欺骗发生在攻击者向请求系统发送虚假回复，抢在有效 DNS 服务器的真实回复之前到达时。这在技术上也是一种竞争条件的利用。防止由投毒和欺骗导致的虚假 DNS\
  \ 结果的保护措施包括：仅允许授权的 DNS 更改、限制区域传输，以及记录所有特权 DNS 活动。\n\n2008 年，Dan Kaminsky 发现并向世界披露了一个相当重大的漏洞。该漏洞在于本地或缓存\
  \ DNS 服务器从根服务器获取特定域权威服务器身份信息的方法。通过向缓存 DNS 服务器发送针对不存在子域的伪造回复，攻击者可以劫持整个域的解析详细信息。有关\
  \ DNS 如何工作以及此漏洞如何威胁当前 DNS 基础设施的详细图解说明，请访问“Kaminsky DNS 漏洞图解指南”，网址为 [`unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html`](http://unixwiz.net/techtips/iguide-kaminsky-dns-vuln.html)。\n\
  \n另一个 DNS 问题是同形异义攻击。这些攻击利用字符集的相似性来注册虚假的国际化域名 (IDN)，肉眼看上去却是合法的。例如，西里尔字母中的某些字母看起来像拉丁字符；例如，拉丁字母中的\
  \ *p* 看起来像西里尔字母 Palochka。因此，[apple.com](http://apple.com) 和 [paypal.com](http://paypal.com)\
  \ 等域名看起来像有效的拉丁字符，但实际包含西里尔字符，解析时会将你导向到一个不同于你预期的站点。有关同形异义攻击的详尽讨论，请参阅 [`blog.malwarebytes.com/101/2017/10/out-of-character-homograph-attacks-explained/`](https://blog.malwarebytes.com/101/2017/10/out-of-character-homograph-attacks-explained/)。\n\
  \n解决此 DNS 劫持漏洞的唯一真正解决方案是将 DNS 升级为 **域名系统安全扩展 (DNSSEC)**。详情请访问 [dnssec.net](http://dnssec.net)。\n\
  \n#### 超链接欺骗\n\n另一种相关攻击是**超链接欺骗**，它类似于 DNS 欺骗，用于将流量重定向到恶意或冒充系统，或仅仅是将流量从其预期目的地转移开。超链接欺骗可以采取\
  \ DNS 欺骗的形式，也可以简单地篡改发送给客户端的文档 HTML 代码中的超链接 URL。超链接欺骗攻击通常之所以成功，是因为大多数用户不会通过 DNS 验证\
  \ URL 中的域名；相反，他们假设超链接是有效的，直接点击它。\n\n防范超链接欺骗的措施包括针对 DNS 欺骗采取的相同预防措施，以及保持系统打补丁和谨慎使用互联网。\n\
  \n### 总结\n\n远程访问安全管理要求安全系统设计师解决实施中的硬件和软件组件，以及策略问题、工作任务问题和加密问题。这包括部署安全通信协议。对本地和远程连接进行安全认证是整体安全的重要基础要素。\n\
  \n保持对通信路径的控制对于支持网络、语音和其他形式通信的机密性、完整性和可用性至关重要。许多攻击都集中在拦截、阻塞或以其他方式干扰数据从一个位置传输到另一个位置。幸运的是，也有合理的对策来减少甚至消除许多此类威胁。\n\
  \n隧道技术，或封装，是一种将一种协议中的消息使用第二种协议通过另一个网络或通信系统传输的方法。隧道技术可以与加密结合，为传输的消息提供安全性。VPN 基于加密隧道技术。\n\
  \n**VLAN** 是由交换机创建的硬件强制的网络分段。VLAN 用于在不改变物理拓扑的情况下对网络进行逻辑分段。VLAN 用于流量管理。\n\n远程办公，或远程连接，已成为商务计算的常见功能。当在任何环境中部署远程访问能力时，必须考虑并实施安全性，以保护私有网络免受远程访问并发症的影响。远程访问用户在获得访问权限前应接受严格认证；这可以包括使用\
  \ **RADIUS** 或 **TACACS+**。远程访问服务包括 **IP 语音 (VoIP)**、应用程序流式传输、**VDI**、多媒体协作和即时消息传递。\n\
  \n\n\n\n\n### NAT\n\nNAT 用于隐藏私有网络的内部结构，并使多个内部客户端能够通过少量公共 IP 地址访问互联网。NAT 通常是边界安全设备的原生功能，例如防火墙、路由器、网关和代理。\n\
  \n### 电路交换与分组交换\n\n在电路交换中，会在两个通信方之间创建一条专用的物理路径。分组交换是指将消息或通信分割成小段（通常是固定长度的分组，具体取决于所采用的协议和技术），并通过中间网络发送到目的地。在分组交换系统中，有两种通信类型：路径和虚拟电路。虚拟电路是在分组交换网络上两个特定端点之间创建的逻辑路径或电路。虚拟电路有两种类型：永久虚拟电路（PVC）和交换虚拟电路（SVC）。\n\
  \n### WAN 链路\n\nWAN 链路，或长距离连接技术，可分为两大类：专用线路和非专用线路。专用线路连接两个特定端点，且仅连接这两个端点。非专用线路是在数据传输发生前需要建立连接的线路。非专用线路可用于连接任何使用相同类型非专用线路的远程系统。WAN\
  \ 连接技术包括 X.25、帧中继、ATM、SMDS、SDLC、HDLC、SDH 和 SONET。\n\n### 网络通信的安全控制\n\n在为网络通信选择或部署安全控制时，您需要结合您的环境、能力和安全策略评估众多特性。安全控制应对用户透明。哈希总计和\
  \ CRC 校验可用于验证消息完整性。记录序列用于确保传输的序列完整性。传输日志记录有助于检测通信滥用行为。\n\n### 虚拟化\n\n虚拟化技术用于在单台主机计算机的内存中托管一个或多个操作系统。此机制允许几乎任何操作系统在任何硬件上运行。它还允许多个操作系统在同一硬件上同时工作。虚拟化提供多种优势，例如能够根据需要启动服务或服务的单独实例、实时可扩展性，以及能够运行应用程序所需的确切操作系统版本。\n\
  \n### 电子邮件安全\n\n除非您采取措施保护，否则基于互联网的电子邮件是不安全的。要保护电子邮件，您应提供不可抵赖性，限制授权用户访问，确保完整性得以维护，验证消息来源，确认投递，甚至对敏感内容进行分类。这些问题必须在安全策略中得到解决，然后才能在解决方案中实施。它们通常以可接受使用策略、访问控制、隐私声明、电子邮件管理程序以及备份和保留策略的形式出现。\n\
  \n电子邮件是恶意代码的常见传播机制。过滤附件、使用防病毒软件和教育用户是针对此类攻击的有效对策。电子邮件垃圾邮件或邮件轰炸是一种拒绝服务形式，可通过过滤器和\
  \ IDS 予以阻止。可以使用 S/MIME、MOSS、PEM 和 PGP 来提高电子邮件安全性。\n\n### 传真和语音安全\n\n通过使用加密来保护文档传输并防止窃听，可以提高传真和语音安全性。有效培训用户是防范社会工程学攻击的有用对策。\n\
  \n### 安全边界\n\n安全边界可以是一个安全区域与另一个安全区域之间的划分，也可以是一个安全区域与一个非安全区域之间的划分。这两者都必须在安全策略中予以解决。\n\
  \n### 通信系统漏洞\n\n通信系统容易受到多种攻击，包括分布式拒绝服务（DDoS）、窃听、冒充、重放、篡改、欺骗，以及 ARP 和 DNS 攻击。幸运的是，针对这些攻击中的每一种都存在有效的对策。PBX\
  \ 欺诈和滥用以及电话破解也是必须解决的问题。\n\n### 考试要点\n\n#### 理解远程访问安全管理相关问题\n\n远程访问安全管理要求安全系统设计人员解决实现过程中的硬件和软件组件问题，以及与策略、工作任务和加密相关的问题。\n\
  \n#### 熟悉可用于 LAN 和 WAN 进行数据通信的各种协议和机制\n\n这些包括 `SKIP`、`SWIPE`、`SSL`、`SET`、`PPP`、`SLIP`、`CHAP`、`PAP`、`EAP`\
  \ 和 `S-RPC`。它们还可以包括 `VPN`、`TLS/SSL` 和 `VLAN`。\n\n#### 了解什么是隧道技术\n\n隧道技术是将协议可传递消息封装在第二个协议中。第二个协议通常执行加密以保护消息内容。\n\
  \n#### 理解 VPN\n\nVPN 基于加密隧道技术。它们可以作为点对点解决方案提供身份验证和数据保护。常见的 VPN 协议有 `PPTP`、`L2F`、`L2TP`\
  \ 和 `IPsec`。\n\n#### 能够解释 NAT\n\nNAT 保护私有网络的寻址方案，允许使用私有 IP 地址，并使多个内部客户端能够通过少量公共\
  \ IP 地址获得互联网访问权限。NAT 受许多安全边界设备支持，例如防火墙、路由器、网关和代理。\n\n#### 理解分组交换与电路交换的区别\n\n在电路交换中，会在两个通信方之间创建一条专用的物理路径。分组交换是指将消息或通信分割成小段，并通过中间网络发送到目的地。在分组交换系统中，有两种通信路径或虚拟电路：永久虚拟电路（PVC）和交换虚拟电路（SVC）。\n\
  \n#### 理解专用线路与非专用线路的区别\n\n专用线路始终处于开启状态，并为特定客户保留。专用线路的示例包括 `T1`、`T3`、`E1`、`E3` 和有线调制解调器。非专用线路在数据传输发生前需要建立连接。它可用于连接任何使用相同类型非专用线路的远程系统。标准调制解调器、`DSL`\
  \ 和 `ISDN` 是非专用线路的示例。\n\n#### 了解与远程访问安全相关的各种问题\n\n熟悉远程访问、拨号连接、屏幕抓取器、虚拟应用程序/桌面以及一般远程办公安全顾虑。\n\
  \n#### 了解各种 WAN 技术\n\n了解大多数 WAN 技术需要信道服务单元/数据服务单元（CSU/DSU），有时称为 WAN 交换机。存在多种类型的载波网络和\
  \ WAN 连接技术，例如 `X.25`、`帧中继`、`ATM`、`SMDS`、`SDH` 和 `SONET`。某些 WAN 连接技术需要额外的专用协议来支持各种类型的专用系统或设备。\n\
  \n#### 理解 PPP 与 SLIP 的区别\n\n点对点协议（`PPP`）是一种封装协议，旨在支持通过拨号或点对点链路传输 IP 流量。`PPP` 包括广泛的通信服务，包括\
  \ IP 地址的分配和管理、同步通信的管理、标准化封装、复用、链路配置、链路质量测试、错误检测，以及功能或选项协商（如压缩）。`PPP` 最初设计用于支持 `CHAP`\
  \ 和 `PAP` 进行身份验证。然而，`PPP` 的最新版本也支持 `MS-CHAP`、`EAP` 和 `SPAP`。`PPP` 取代了串行线路互联网协议（`SLIP`）。`SLIP`\
  \ 不提供身份验证，仅支持半双工通信，没有错误检测功能，且需要手动建立和拆除链路。\n\n\n\n\n\n#### 理解安全控制的通用特征\n\n安全控制应对用户透明。哈希总计和\
  \ CRC 校验可用于验证消息完整性。记录序列用于确保传输的序列完整性。传输日志记录有助于检测通信滥用行为。\n\n#### 理解电子邮件安全的工作原理\n\n\
  互联网电子邮件基于 `SMTP`、`POP3` 和 `IMAP`。它本质上是不安全的。虽然可以对其进行保护，但所使用的方法必须在安全策略中加以规定。电子邮件安全解决方案包括使用\
  \ `S/MIME`、`MOSS`、`PEM` 或 `PGP`。\n\n#### 了解传真安全的工作原理\n\n传真安全主要基于使用加密传输或加密通信线路来保护传真资料。主要目标是防止截获。活动日志和异常报告可用于检测传真活动中的异常，这些异常可能是攻击的症状。\n\
  \n#### 了解与 PBX 系统相关的威胁以及应对 PBX 欺诈的对策\n\n应对 PBX 欺诈和滥用的对策包括许多用于保护典型计算机网络的相同预防措施：逻辑或技术控制、管理控制和物理控制。\n\
  \n#### 理解与 VoIP 相关的安全问题\n\nVoIP 面临来电显示欺骗、语音钓鱼、SPIT（垃圾互联网电话）、呼叫管理器软件/固件攻击、电话硬件攻击、`DoS`、`MitM`、欺骗和交换机跳转的风险。\n\
  \n#### 识别什么是“电话破解者”\n\n电话破解是一种特定类型的攻击，攻击者利用各种技术绕过电话系统，以拨打免费长途电话、更改电话服务功能、窃取专用服务，甚至导致服务中断。电话破解者常用的工具包括黑盒、红盒、蓝盒和白盒。\n\
  \n#### 理解语音通信安全\n\n语音通信容易受到多种攻击，尤其是随着语音通信成为网络服务的重要组成部分。您可以通过使用加密通信来获得机密性。必须部署对策以防止截获、窃听、监听和其他类型的利用。请熟悉语音通信主题，如\
  \ `POTS`、`PSTN`、`PBX` 和 `VoIP`。\n\n#### 能够解释什么是社会工程学\n\n社会工程学是一种手段，陌生人通过说服员工相信其与高层管理人员、技术支持或帮助台有关联，从而获得您组织内部人员的信任。受害者通常会被诱导更改其系统上的用户帐户，例如重置密码，以便攻击者利用它访问网络。针对此类攻击的主要对策是用户培训。\n\
  \n#### 解释安全边界的概念\n\n安全边界可以是一个受保护区域与另一个受保护区域之间的划分。它也可以是一个受保护区域与一个未受保护区域之间的划分。这两者都必须在安全策略中加以规定。\n\
  \n#### 理解与通信安全相关的各种网络攻击和对策\n\n通信系统容易受到多种攻击，包括分布式拒绝服务 (`DDoS`)、窃听、冒充、重放、篡改、欺骗以及 `ARP`\
  \ 和 `DNS` 攻击。请能够为每种攻击提供有效的对策。\n\n### 书面实验\n\n1.  描述 `IPsec` 传输模式和隧道模式的区别。\n2.  讨论\
  \ `NAT` 的优势。\n3.  电路交换和分组交换的主要区别是什么？\n4.  电子邮件有哪些安全问题以及防范它们的选项有哪些？\n\n### 复习题\n\n\
  1.  \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 是一种第 2 层连接机制，它使用分组交换技术在通信端点之间建立虚拟电路。\n\
