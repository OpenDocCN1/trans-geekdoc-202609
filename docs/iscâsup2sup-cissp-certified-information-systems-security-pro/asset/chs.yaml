  \  1.  机密性\n    2.  完整性\n    3.  认证\n    4.  审计/问责\n\n15. 以下哪项是支持联合身份管理 (FIM) 系统的最佳选择？\n\
  \n    1.  Kerberos\n    2.  超文本标记语言 (HTML)\n    3.  可扩展标记语言 (XML)\n    4.  安全断言标记语言\
  \ (SAML)\n\n16. 在 RADIUS 架构中，网络访问服务器的功能是什么？\n\n    1.  认证服务器\n    2.  客户端\n    3.\
  \  AAA 服务器\n    4.  防火墙\n\n17. 以下哪种 AAA 协议基于 RADIUS 并支持移动 IP 和 VoIP？\n\n    1. \
  \ 分布式访问控制\n    2.  Diameter\n    3.  TACACS+\n    4.  TACACS\n\n#### 第 18 和 19 题场景\n\
  \n一名管理员在一个组织工作了 10 多年。他在公司内部不同的 IT 部门之间流动，并保留了他在任职期间担任的每份工作的特权。最近，主管因他对系统进行未经授权的更改而训斥他。他再次进行了一次未经授权的更改，导致意外停机，管理层决定终止他的雇佣关系。第二天，他回到公司清理办公桌和个人物品，在此期间他安装了一个恶意脚本，该脚本计划在下个月的第一天作为逻辑炸弹运行。该脚本将更改管理员密码、删除文件，并关闭数据中心的\
  \ 100 多台服务器。\n\n18. 在该管理员的受雇期间，违反了以下哪项基本原则？\n\n    1.  默认拒绝\n    2.  可用性丧失\n   \
  \ 3.  防御性特权\n    4.  最小权限\n\n19. 在他受雇期间，什么本可以发现该用户账户的问题？\n\n    1.  要求强认证的策略\n \
  \   2.  多因素认证\n    3.  日志记录\n    4.  账户审查\n\n\n\n\n### 隐性拒绝\n\n访问控制的一项基本原则是*隐性拒绝*，大多数授权机制都采用该原则。隐性拒绝原则确保除非已明确授予主体访问权限，否则将拒绝对对象的访问。例如，设想管理员明确授予\
  \ Jeff 对某文件的“完全控制”权限，但未明确授予其他任何人权限。即使管理员未明确拒绝 Mary 的访问，Mary 也无法访问该文件。相反，隐性拒绝原则会拒绝除\
  \ Jeff 之外的 Mary 及其他所有人的访问。\n\n### 访问控制矩阵\n\n*访问控制矩阵*是一个包含主体、对象和分配特权的表格。当主体尝试执行某项操作时，系统会检查访问控制矩阵，以确定该主体是否拥有执行该操作所需的适当特权。例如，访问控制矩阵可以包含一组文件作为对象，一组用户作为主体。它将显示每个用户针对每个文件被授权的确切权限。请注意，这涵盖的范围远不止单个*访问控制列表*（ACL）。在该示例中，矩阵中列出的每个文件都有一个单独的\
  \ ACL，其中列出了授权用户及其分配的权限。\n\n### 能力表\n\n*能力表*是标识分配给主体特权的另一种方式。它们与 ACL 的区别在于，能力表关注的是主体（如用户、组或角色）。例如，为会计角色创建的能力表将包含会计角色可访问的所有对象列表，并包含分配给会计角色针对这些对象的特定特权。相反，ACL\
  \ 关注的是对象。某文件的 ACL 将列出所有被授权访问该文件的用户和/或组，以及授予每个用户/组的具体访问权限。\n\n### 受限界面\n\n应用程序使用*受限界面*或受限制界面，根据用户的特权限制其能执行的操作或查看的内容。拥有完全特权的用户可以访问应用程序的所有功能。拥有受限特权的用户只有有限的访问权限。应用程序通过不同方法来约束界面。一种常见方法是：如果用户没有使用某功能的权限，则隐藏该功能。例如，命令可能通过菜单或右键单击项目提供给管理员，但如果普通用户没有权限，该命令将不显示。其他时候，应用程序会显示菜单项但将其显示为灰色或禁用状态。普通用户可以看到菜单项，但无法使用它。\n\
  \n### 基于内容的控制\n\n*基于内容的访问控制*根据对象内的内容限制对数据的访问。数据库视图是一种基于内容的控制。视图从一个或多个表中检索特定列，创建一个虚拟表。例如，数据库中的客户表可能包含客户姓名、电子邮件地址、电话号码和信用卡数据。基于客户的视图可能仅显示客户姓名和电子邮件地址，而不显示其他内容。被授予视图访问权限的用户可以查看客户姓名和电子邮件地址，但无法访问底层表中的数据。\n\
  \n### 基于上下文的控制\n\n*基于上下文的访问控制*在授予用户访问权限前要求特定的活动。例如，考虑在线销售数字产品的交易数据流程。用户将产品加入购物车并开始结账流程。结账流程的第一页显示购物车中的产品，下一页收集信用卡数据，最后一页确认购买并提供下载数字产品的说明。如果用户未先完成购买流程，系统将拒绝其访问下载页面。也可以使用日期和时间控制作为基于上下文的控制。例如，可以根据当前日期和/或时间限制对计算机和应用程序的访问。如果用户尝试在允许时间范围之外访问资源，系统将拒绝其访问。\n\
  \n### 需知原则\n\n该原则确保主体仅被授予其工作任务和职能所*需知*的内容访问权限。主体可能拥有访问机密或受限数据的许可，但除非他们实际需要这些数据来执行工作，否则不会被授予对该数据的授权。\n\
  \n### 最小权限\n\n*最小权限原则*确保主体仅被授予执行其工作任务和职能所需的特权。这有时会与需知原则归为一类。唯一的区别在于，最小权限还包括对系统执行操作的权利。\n\
  \n#### 职责分离\n\n*职责分离*原则确保敏感职能被拆分为由两名或更多员工执行的任务。它通过建立制衡机制来帮助防止欺诈和错误。\n\n### 使用安全策略定义需求\n\
  \n*安全策略*是定义组织安全需求的文档。它标识需要保护的资产，以及安全解决方案应在何种程度上保护它们。一些组织创建单一的安全策略文档，而其他组织创建多个安全策略，每个策略专注于一个单独的领域。\n\
  \n策略是访问控制的重要要素，因为它们帮助组织内部人员了解哪些安全需求很重要。高级领导批准安全策略，并以此提供组织安全需求的广泛概述。然而，安全策略通常不会详细说明如何满足安全需求或如何实施策略。例如，它可能声明需要实施并强制执行职责分离和最小权限原则，但不会说明如何做到这一点。组织内的专业人员将安全策略作为指南来实施安全需求。\n\
  \n### 实施纵深防御\n\n组织使用*纵深防御*策略实施访问控制。这使用多层或多级访问控制来提供分层安全。例如，请参考图 14.1。它显示了两台服务器和两个磁盘，代表组织想要保护的资产。入侵者或攻击者需要克服多层防御才能到达这些受保护的资产。\n\
  \n![图 14.1 具有分层安全的纵深防御](img/c14f001.jpg)\n\n**图 14.1** 具有分层安全的纵深防御\n\n组织使用多种方法实施控制。不能仅依赖技术来提供安全；还必须使用物理访问控制和管理访问控制。例如，如果服务器具有强身份验证但放置在无人看管的桌子上，小偷可以轻易将其偷走并花时间破解系统。同样，用户可能有强密码，但社会工程师可以欺骗未受教育的用户交出密码。\n\
  \n纵深防御的概念强调了几个重要点：\n\n*   组织的安全策略（属于管理访问控制之一）通过定义安全需求，为资产提供了一层防御。\n*   人员是防御的关键组成部分。然而，他们需要适当的培训和教育，以实施、遵守并支持组织安全策略中定义的安全要素。\n\
  *   管理、技术和物理访问控制的组合提供了强得多的防御。仅使用管理、仅使用技术或仅使用物理控制会导致弱点，攻击者可发现并利用这些弱点。\n\n### 访问控制模型总结\n\
  \n\n\n\n### 访问控制模型\n\n以下章节描述了五种访问控制模型，在备考 CISSP 认证考试时你应当理解这些模型。作为简介，此处对这五种访问控制模型进行了总结：\n\
  \n### 自主访问控制\n\n**自主访问控制（DAC）**模型的一个关键特征是每个对象都有一个所有者，且所有者可以授予或拒绝任何其他主体的访问权限。例如，如果你创建了一个文件，你就是所有者，可以授予任何其他用户访问该文件的权限。Microsoft\
  \ Windows 操作系统使用的**新技术文件系统（NTFS）**采用了 DAC 模型。\n\n#### 基于角色的访问控制\n\n**基于角色的访问控制（RBAC）**模型的一个关键特征是使用角色或组。管理员不是直接将权限分配给用户，而是将用户账户放入角色中，并向角色分配特权。这些角色通常由工作职能来标识。如果用户账户在某个角色中，该用户就拥有分配给该角色的所有特权。Microsoft\
  \ Windows 操作系统通过使用组来实现此模型。\n\n#### 基于规则的访问控制\n\n**基于规则的访问控制**模型的一个关键特征是它应用适用于所有主体的全局规则。例如，防火墙使用规则平等地允许或阻断所有用户的流量。基于规则的访问控制模型中的规则有时被称为\
  \ `restrictions`（限制）或 `filters`（过滤器）。\n\n#### 基于属性的访问控制\n\n**基于属性的访问控制（ABAC）**模型的一个关键特征是其使用的规则可以包含多个属性。这使其比将规则平等地应用于所有主体的基于规则的访问控制模型灵活得多。许多软件定义网络使用\
  \ ABAC 模型。此外，ABAC 允许管理员使用通俗语言语句在策略中创建规则，例如 `Allow Managers to access the WAN using\
  \ a mobile device.`（允许管理员使用移动设备访问广域网）。\n\n#### 强制访问控制\n\n**强制访问控制（MAC）**模型的一个关键特征是使用同时应用于主体和对象的标签。例如，如果用户拥有“绝密”标签，则可以授予该用户访问绝密文档的权限。在该示例中，主体和对象都具有匹配的标签。当以表格形式记录时，MAC\
  \ 模型有时类似于晶格（如用于攀爬玫瑰灌木的架子），因此被称为基于晶格的模型。\n\n### 自主访问控制\n\n采用 `discretionary access\
  \ controls`（自主访问控制）的系统允许对象的所有者、创建者或数据管理员控制并定义对该对象的访问。所有对象都有所有者，访问控制基于所有者的自由裁量或决定。例如，如果用户创建了一个新的电子表格文件，该用户既是文件的创建者，也是文件的所有者。作为所有者，用户可以修改文件的权限，以授予或拒绝其他用户的访问。数据所有者还可以将处理数据的日常任务委托给数据管理员，赋予数据管理员修改权限的能力。**基于身份的访问控制**是\
  \ DAC 的一个子集，因为系统基于用户身份识别用户，并将资源所有权分配给身份。\n\nDAC 模型通过在对象上使用**访问控制列表（ACL）**来实现。每个\
  \ ACL 定义授予或拒绝主体的访问类型。它不提供集中控制的管理系统，因为所有者可以随意更改其对象上的 ACL。与强制访问控制的静态特性相比，对象的访问很容易更改。\n\
  \nMicrosoft Windows 系统使用 DAC 模型来管理文件。每个文件和文件夹都有一个 ACL，标识授予任何用户或组的权限，且所有者可以修改权限。\n\
  \n在 DAC 环境中，管理员可以轻松暂停外出用户（如休假）的特权。同样，当用户离开组织时，也很容易禁用其账户。\n\n### 非自主访问控制\n\n自主访问控制与\
  \ `nondiscretionary access controls`（非自主访问控制）的主要区别在于它们的控制和管理方式。管理员集中管理非自主访问控制，并可以做出影响整个环境的更改。相比之下，DAC\
  \ 模型允许所有者自行更改，且其更改不会影响环境的其他部分。\n\n在非 DAC 模型中，访问控制不关注用户身份。相反，一组管理整个环境的静态规则来管理访问。非\
  \ DAC 系统是集中控制且更易于管理的（尽管灵活性较低）。一般来说，任何非自主模型都是非自主访问控制模型。\n\n#### 基于角色的访问控制\n\n采用基于角色或基于任务的访问控制的系统，根据主体的角色或分配的任务来定义主体访问对象的能力。**基于角色的访问控制（RBAC）**通常通过使用组来实现。\n\
  \n例如，一家银行可能有贷款专员、出纳员和经理。管理员可以创建一个名为“贷款专员”的组，将每位贷款专员的用户账户放入该组，然后为该组分配适当的特权，如图 14.2\
  \ 所示。如果组织聘用了一名新的贷款专员，管理员只需将新贷款专员的账户添加到“贷款专员”组中，新员工就会自动拥有与该组中其他贷款专员相同的所有权限。管理员会为出纳员和经理采取类似的步骤。\n\
  \n![图 14.2 基于角色的访问控制](img/c14f002.jpg)\n\n**图 14.2** 基于角色的访问控制\n\n这有助于通过防止特权蔓延来强制执行最小权限原则。**特权蔓延**是指用户随着其角色和访问需求的变化，随着时间的推移而积累特权的倾向。理想情况下，当用户在组织内换岗时，管理员应撤销其用户特权。然而，当特权直接分配给用户时，要识别并撤销用户所有不需要的特权具有挑战性。\n\
  \n管理员只需将用户账户从组中移除，即可轻松撤销不需要的特权。一旦管理员将用户从组中移除，该用户不再拥有分配给该组的特权。例如，如果一名贷款专员调往另一个部门，管理员只需将该贷款专员的账户从“贷款专员”组中移除。这会立即从用户账户中移除“贷款专员”组的所有特权。\n\
  \n管理员通过职位描述或工作职能来识别角色（和组）。在许多情况下，这遵循组织架构图中记录的组织层级。担任管理职位的用户将比临时工拥有更多的资源访问权限。\n\n\
  RBAC 在人员变动频繁的动态环境中非常有用，因为管理员只需将新用户添加到适当的角色中，即可轻松授予多项权限。值得注意的是，用户可以属于多个角色或组。例如，使用相同的银行场景，经理可能同时属于“经理”角色、“贷款专员”角色和“出纳员”角色。这使得经理能够访问其员工所能访问的所有资源。\n\
  \nMicrosoft 操作系统通过使用组来实现 RBAC。某些组（如本地 Administrators 组）是预定义的。但是，管理员可以创建额外的组，以匹配组织中使用的工作职能或角色。\n\
  \n\n\n\n\n### 访问控制模型对比\n\n#### DAC 与 RBAC 的区别\n\n很容易混淆 `DAC` 和 `RBAC`，因为它们都可以使用组将用户组织成可管理的单元，但它们在部署和使用上有所不同。在\
  \ `DAC` 模型中，对象有所有者，所有者决定谁有访问权限。在 `RBAC` 模型中，管理员确定主体权限并将适当的权限分配给角色或组。在严格的 `RBAC`\
  \ 模型中，管理员不直接将权限分配给用户，而是仅通过将用户账户添加到角色或组来授予权限。\n\n#### 基于任务的访问控制 (TBAC)\n\n与 `RBAC`\
  \ 相关的另一种方法是基于任务的访问控制 (`TBAC`)。`TBAC` 与 `RBAC` 类似，但用户不是被分配到一个或多个角色，而是被分配一系列任务。这些项目都与用户账户关联人员的指定工作任务相关。在\
  \ `TBAC` 下，重点是通过分配的任务控制访问，而不是通过用户身份。\n\n#### 基于规则的访问控制\n\n*基于规则的访问控制* 模型使用一组规则、限制或过滤器来确定系统上可以和不可以发生什么。它包括授予主体对对象的访问权限，或授予主体执行操作的能力。基于规则的访问控制模型的一个显著特征是它们拥有适用于所有主体的全局规则。\n\
  \n基于规则的访问控制模型的一个常见示例是防火墙。防火墙包含管理员定义的 `ACL` 中的一组规则或过滤器。防火墙检查通过它的所有流量，并仅允许符合规则之一的流量。\n\
  \n防火墙包含一条最终规则（称为隐式拒绝规则），拒绝所有其他流量。例如，最后一条规则可能是 `deny all all`，表示防火墙应阻止所有未被另一条规则明确允许的进出网络的流量。换句话说，如果流量不满足任何先前显式定义的规则的条件，则最终规则确保阻止该流量。此最终规则有时可在\
  \ `ACL` 中查看。其他时候，隐式拒绝规则作为最终规则被暗示，但未在 `ACL` 中明确说明。\n\n#### 基于属性的访问控制\n\n传统的基于规则的访问控制模型包含平等适用于所有主体（如用户）的全局规则。然而，基于规则的访问控制的一种高级实现是\
  \ *基于属性的访问控制 (`ABAC`)* 模型。`ABAC` 模型使用包含多个属性的策略作为规则。许多软件定义网络应用程序使用 `ABAC` 模型。\n\n\
  属性可以是用户、网络和网络设备的几乎任何特征。例如，用户属性可以包括组成员身份、工作部门以及他们使用的设备，如台式电脑或移动设备。网络可以是本地内部网络、无线网络、内联网或广域网\
  \ (`WAN`)。设备可以包括防火墙、代理服务器、Web 服务器、数据库服务器等。\n\n例如，`CloudGenix` 创建了一个实施策略以允许或阻止流量的软件定义广域网\
  \ (`SD-WAN`) 解决方案。管理员使用通俗语言语句创建 `ABAC` 策略，例如“允许管理员使用平板电脑或智能手机访问 WAN”。这允许 `Managers`\
  \ 角色中的用户使用平板设备或智能手机访问 `WAN`。请注意这如何改进了基于规则的访问控制模型。基于规则的访问控制适用于所有用户，但 `ABAC` 可以更具体。\n\
  \n#### 强制访问控制\n\n*强制访问控制 (`MAC`)* 模型依赖于分类标签的使用。每个分类标签代表一个安全 *域*，或一个安全领域。安全域是共享通用安全策略的主体和对象的集合。例如，一个安全域可以有\
  \ `Secret` 标签，`MAC` 模型将以相同的方式保护所有带有 `Secret` 标签的对象。主体只有在拥有匹配的 `Secret` 标签时才能访问带有\
  \ `Secret` 标签的对象。此外，主体获得 `Secret` 标签的要求对所有主体都是相同的。\n\n用户根据其许可级别分配标签，这是一种特权形式。同样，对象也有标签，指示其分类级别或敏感度。例如，美军使用\
  \ `Top Secret`、`Secret` 和 `Confidential` 标签对数据进行分类。管理员可以向具有 `Top Secret` 许可的用户授予\
  \ `Top Secret` 数据的访问权限。但是，管理员无法向具有较低级别许可（如 `Secret` 和 `Confidential`）的用户授予 `Top\
  \ Secret` 数据的访问权限。\n\n私营部门组织通常使用 `confidential`（或 `proprietary`）、`private`、`sensitive`\
  \ 和 `public` 等标签。虽然政府使用法律强制规定的标签，但私营部门组织可以自由选择任何标签。\n\n`MAC` 模型通常被称为基于晶格的模型。图 14.3\
  \ 显示了基于晶格的 `MAC` 模型示例。它让人联想到花园中的晶格，例如用于训练攀爬玫瑰的玫瑰花架。标记为 `Confidential`、`Private`、`Sensitive`\
  \ 和 `Public` 的水平线标记分类级别的上界。例如，`Public` 和 `Sensitive` 之间的区域包含标记为 `Sensitive`（上边界）的对象。拥有\
  \ `Sensitive` 标签的用户可以访问 `Sensitive` 数据。\n\n![FIGURE 14.3 A representation of the\
  \ boundaries provided by lattice-based access controls](img/c14f003.jpg)\n\n**图\
  \ 14.3** 基于晶格的访问控制提供的边界表示\n\n`MAC` 模型还允许标签识别更明确的安全域。在 `Confidential` 部分（`Private`\
  \ 和 `Confidential` 之间），有四个单独的安全域，标记为 `Lentil`、`Foil`、`Crimson` 和 `Matterhorn`。这些都包含\
  \ `Confidential` 数据，但为了增加一层保护，它们被维护在单独的隔间中。拥有 `Confidential` 标签的用户还需要额外的标签才能访问这些隔间中的数据。例如，要访问\
  \ `Lentil` 数据，用户需要同时拥有 `Confidential` 标签和 `Lentil` 标签。\n\n同样，标记为 `Domino`、`Primrose`、`Sleuth`\
  \ 和 `Potluck` 的隔间包含 `Private` 数据。用户需要 `Private` 标签和该隔间中的一个标签才能访问该隔间内的数据。\n\n图 14.3\
  \ 中的标签是第二次世界大战军事行动的名称，但组织可以使用任何名称作为标签。关键是这些部分为数据等对象提供了额外的隔离级别。请注意，`Sensitive` 数据（`Public`\
  \ 和 `Sensitive` 边界之间）没有任何额外标签。拥有 `Sensitive` 标签的用户可以被授予访问任何带有 `Sensitive` 标签数据的权限。\n\
  \n组织内部人员确定标签并定义其含义以及获取标签的要求。然后管理员将标签分配给主体和对象。标签到位后，系统根据分配的标签确定访问权限。\n\n将隔离与 `MAC`\
  \ 模型结合使用强制执行 *need to know* 原则。拥有 `Confidential` 标签的用户不会自动获得 `Confidential` 部分内隔间的访问权限。但是，如果他们的工作要求他们访问特定数据（如带有\
  \ `Crimson` 标签的数据），管理员可以为他们分配 `Crimson` 标签以授予他们访问该隔间的权限。\n\n`MAC` 模型是禁止性的而非允许性的，并使用隐式拒绝理念。如果未特别授予用户访问数据的权限，系统将拒绝他们访问相关数据。`MAC`\
  \ 模型比 `DAC` 模型更安全，但不如 `DAC` 模型灵活或可扩展。\n\n\n\n\n### 安全分类与访问控制攻击\n\n#### 安全分类\n\n\
  安全分类表示敏感程度的层级。例如，如果考虑军事安全标签——绝密、机密、秘密和非密，绝密标签包含最敏感的数据，而非密则是最不敏感的。由于这种层级关系，获得绝密数据许可的人员也自动获得机密及更低敏感度数据的许可。然而，分类并不一定要包含较低级别。可以使用\
  \ MAC 标签，使得较高级别标签的许可不包含较低级别标签的许可。\n\nMAC 模型中的分类使用以下三种环境类型之一：\n\n##### 分层环境\n**分层环境**将各种分类标签按从低安全到中安全再到高安全的有序结构关联起来，例如分别为秘密、机密和绝密。结构中的每个级别或分类标签都是相关联的。某一级别的许可授予主体访问该级别对象以及所有较低级别对象的权限，但禁止访问所有较高级别的对象。例如，拥有绝密许可的人员可以访问绝密数据和机密数据。\n\
  \n##### 隔离环境\n在**隔离环境**中，一个安全域与另一个安全域之间没有关系。每个域代表一个独立的隔离隔间。要访问某个对象，主体必须拥有该安全域的特定许可。\n\
  \n##### 混合环境\n**混合环境**结合了分层和隔离的概念，因此每个分层级别可能包含许多与安全域其余部分隔离的细分区域。主体必须拥有正确的许可，并且需要知道特定隔间内的数据，才能访问隔离的对象。混合\
  \ MAC 环境提供了对访问的细粒度控制，但随着规模扩大，管理难度会越来越大。图 14.3 展示了一个混合环境的示例。\n\n#### 理解访问控制攻击\n\n\
  正如第 13 章所述，访问控制的目标之一是防止未经授权访问对象。这包括访问任何信息系统，包括网络、服务、通信链路和计算机，以及未经授权访问数据。除了控制访问外，IT\
  \ 安全方法还旨在防止未经授权的泄露和未经授权的篡改，并提供资源的持续可用性。换句话说，IT 安全方法试图防止机密性丧失、完整性丧失和可用性丧失。\n\n安全专业人员需要了解常见的攻击方法，以便采取主动措施预防它们，在攻击发生时识别它们，并做出适当响应。以下章节将快速回顾风险要素，并介绍一些常见的访问控制攻击。\n\
  \n虽然本节重点关注访问控制攻击，但重要的是要意识到还有许多其他类型的攻击，这些将在其他章节中介绍。例如，第 6 章“密码学与对称密钥算法”涵盖了各种密码分析攻击。\n\
  \n##### 风险要素\n\n第 2 章“人员安全与风险管理概念”更深入地介绍了风险和风险管理，但在访问控制攻击的背景下，重申一些术语是有必要的。**风险**是指威胁利用漏洞导致损失（如资产受损）的可能性或几率。**威胁**是指可能导致不良后果的潜在事件。这包括罪犯或其他攻击者的潜在攻击，也包括洪水或地震等自然事件，以及员工的意外行为。**漏洞**是指任何类型的弱点。这种弱点可能源于硬件或软件的缺陷或局限性，也可能源于安全控制的缺失，例如计算机上未安装防病毒软件。\n\
  \n**风险管理**试图通过实施控制或对策来减少或消除漏洞，或降低潜在威胁的影响。完全消除风险是不可能的，也是不可取的。相反，组织专注于降低那些可能对组织造成最大危害的风险。安全专业人员在风险管理过程早期完成的关键任务如下：\n\
  \n*   识别资产\n*   识别威胁\n*   识别漏洞\n\n##### 识别资产\n\n**资产估值**是指识别资产的实际价值，目的是对其进行优先级排序。风险管理关注价值最高的资产，并确定控制措施以减轻这些资产面临的风险。\n\
  \n资产的价值不仅仅是采购价格。例如，考虑一台托管电子商务网站的 Web 服务器，每天产生 10,000 美元的销售额。它的价值远高于硬件和软件的成本。如果这台服务器故障导致电子商务网站不可用，将导致直接销售收入的损失和客户信誉的丧失。\n\
  \n了解资产价值也有助于成本效益分析，后者旨在确定不同类型安全控制的成本效益。例如，如果一项资产价值数十万美元，一项花费 100 美元的有效安全控制就是合理的。相反，花费几百美元来防止一只\
  \ 10 美元的鼠标被盗则不是合理的开支。相反，组织通常会接受与低价值资产相关的风险。\n\n在访问控制攻击的背景下，评估数据的价值很重要。例如，如果攻击者攻破数据库服务器并下载包含隐私数据和信用卡信息的客户数据库，这代表了公司的重大损失。这并不总是容易量化，但\
  \ Equifax 遭受的攻击提供了一些视角。（请参阅侧边栏“Equifax 数据泄露事件。”）\n\nEquifax 数据泄露事件可能在未来几年内对数千万个人的财务状况和信用评级产生负面影响。它也直接影响着\
  \ Equifax。在 9 月 Equifax 官方公开宣布数据泄露事件后的一周内，股价下跌了 35%。这实际上抹去了公司约 60 亿美元的市值。一起集体诉讼寻求\
  \ 700 亿美元的赔偿。据报道，美国国税局 (IRS) 在 10 月攻击后暂停了与 Equifax 的一份 720 万美元的合同。此外，联邦贸易委员会 (FTC)\
  \ 报告称正在调查 Equifax，立法者敦促其他联邦机构也调查该公司。\n\n##### 识别威胁\n\n在识别并确定优先级资产后，组织会尝试识别对有价值系统的任何可能威胁。**威胁建模**是指识别、理解和分类潜在威胁的过程。目标是识别这些系统的潜在威胁列表并分析这些威胁。\n\
  \n威胁建模不应是一次性事件。相反，组织通常在系统设计过程早期就开始威胁建模，并贯穿其整个生命周期。例如，Microsoft 使用其安全开发生命周期流程，在产品开发的每个阶段考虑并实施安全性。这支持“安全设计、安全默认、安全部署和通信”（也称为\
  \ SD3+C）的座右铭。Microsoft 通过此流程主要有两个目标：\n\n*   减少与安全相关的设计和编码缺陷数量\n*   降低任何剩余缺陷的严重性\n\
  \n\n\n\n\n### 威胁建模与访问控制攻击\n\n#### 高级持续性威胁\n\n任何威胁模型都应考虑已知威胁的存在，这包括**高级持续性威胁（APT）**。APT\
  \ 是一群协同工作、动机高度强烈、技术娴熟且极具耐心的攻击者。他们拥有先进的知识和多种技能，用于检测和利用漏洞。他们具有持续性，专注于利用一个或多个特定目标，而非单纯的机会目标。国家（或政府）通常为\
  \ APT 提供资金。然而，一些有组织的犯罪集团也会资助并运营 APT。\n\n如果组织将攻击者识别为潜在威胁（而非自然威胁），威胁建模将尝试识别攻击者的目标。某些攻击者可能旨在瘫痪系统，而另一些则意在窃取数据，每个目标都代表一个独立的威胁。一旦组织识别出这些威胁，会根据底层资产的优先级对其进行分类。\n\
  \n过去，保护网络安全只需比其他网络更安全即可。攻击者会瞄准容易得手的目标，避开安全防护完善的网络。你可能记得那句老话：“被灰熊追赶时你需要跑多快？” 答案：“只需比你小组里最慢的人跑得稍微快一点。”\n\
  \n然而，如果你手里拿着熊想要的蜂蜜罐，它可能会无视其他人，专门追着你跑。这正是 APT 的行为模式。它根据想从目标身上获取的利益，专门针对特定目标发动攻击。如果想了解更多案例，可使用常用搜索引擎搜索“cozy\
  \ bear attacks”（舒适熊攻击）和“fancy bear attacks”（花哨熊攻击）。\n\n#### 威胁建模方法\n\n威胁的可能性近乎无限，因此难以使用结构化方法识别相关威胁。相反，许多组织采用以下三种方法之一（或多种组合）来识别威胁：\n\
  \n**以资产为中心** 此方法利用资产估值结果，尝试识别针对高价值资产的威胁。人员评估特定资产以确定其遭受攻击的易感性。如果资产托管数据，人员将评估访问控制，以识别可绕过身份验证或授权机制的威胁。\n\
  \n**以攻击者为中心** 部分组织识别潜在攻击者，并根据攻击者的目标识别其构成的威胁。例如，政府通常能识别潜在攻击者并洞悉其意图。随后可利用这些知识识别并保护相关资产。不过，随着众多由外国民族国家资助的\
  \ APT 出现，这变得愈发困难。\n\n**以软件为中心** 若组织开发软件，可考虑针对软件的潜在威胁。多年前组织自行开发软件并不常见，但如今已司空见惯。具体而言，大多数组织都有网络业务，许多还自建网站。花哨的网站能吸引更多流量，但也需要更复杂的编程，并带来额外威胁。第\
  \ 21 章“恶意代码与应用攻击”涵盖了应用攻击和 Web 应用安全。\n\n### 识别漏洞\n\n在识别出有价值的资产和潜在威胁后，组织将执行**漏洞分析**。换言之，它试图发现这些系统针对潜在威胁的弱点。在访问控制背景下，漏洞分析旨在识别不同访问控制机制的优劣势，以及威胁利用弱点的潜在可能性。\n\
  \n漏洞分析是一个持续过程，可包含技术和管理步骤。在大型组织中，特定人员可能全职从事漏洞分析。他们定期执行漏洞扫描，查找各类漏洞，并汇报结果。在小型组织中，网络管理员可能按周期（如每周或每月）运行漏洞扫描。\n\
  \n风险分析通常包含漏洞分析，通过针对已知威胁和漏洞评估系统和环境，随后进行渗透测试以利用漏洞。第 16 章“管理安全运营”详细介绍了如何将漏洞扫描和漏洞评估作为整体漏洞管理的一部分使用。\n\
  \n### 常见访问控制攻击\n\n访问控制攻击旨在绕过或规避访问控制方法。正如第 13 章所述，访问控制始于标识和授权，访问控制攻击往往试图窃取用户凭证。攻击者窃取用户凭证后，可发起在线**冒充**攻击，以该用户身份登录并访问其资源。在其他情况下，访问控制攻击可绕过身份验证机制直接窃取数据。\n\
  \n本书涵盖多种攻击，以下章节介绍一些直接与访问控制相关的常见攻击。\n\n#### 访问聚合攻击\n\n**访问聚合**指收集多条非敏感信息并将其组合（即聚合）以获取敏感信息。换言之，个人或团体可收集关于系统的多个事实，再利用这些事实发动攻击。\n\
  \n侦察攻击属于访问聚合攻击，它结合多种工具识别系统的多个要素，如互联网协议（IP）地址、开放端口、运行中的服务、操作系统等。攻击者也对数据库使用聚合攻击。第\
  \ 20 章“软件开发安全”涵盖了聚合和推理攻击，这些攻击通过聚合和推理技术间接允许未授权个人访问数据。\n\n结合纵深防御、最小知情权限和最小权限原则有助于防范访问聚合攻击。\n\
  \n### 密码攻击\n\n密码是最薄弱的身份验证形式，存在多种密码攻击手段。若攻击者在密码攻击中得逞，即可访问该账户及其授权资源。若攻击者发现 `root`\
  \ 或管理员密码，便可访问任何其他账户及其资源。若攻击者在高安全环境中获取了特权账户密码，该环境的安全性将永远无法完全恢复信任。攻击者可能已创建其他账户或后门访问系统。组织可能选择从头重建整个系统，而非接受该风险。\n\
  \n**强密码**有助于防范密码攻击。它长度足够且包含多种字符类型。“长度足够”是一个动态目标，取决于用途和环境。第 13 章讨论了密码策略、强密码及口令的使用。关键在于：较长的密码比较短的密码更强。\n\
  \n\n\n\n### 密码安全与常见攻击\n\n虽然安全专业人员通常知道什么样的密码才算强壮，但许多用户并不知情，用户创建仅包含单一字符类型的短密码是常态。2015\
  \ 年 Ashley Madison 数据泄露事件有力地说明了这一点。Ashley Madison 是一个面向已婚人士或有伴侣人士的在线约会服务，其口号是“人生苦短，及时行乐”。攻击者泄露了超过\
  \ 60 GB 的客户记录，对密码的分析显示，有超过 120,000 名用户的密码是 `123456`。排名前 10 位的其他密码包括 `12345`、`1234567`、`12345678`、`123456789`、`password`\
  \ 和 `abc123`。用户想要出轨，却仍在使用极其简单的密码。\n\n密码不应以明文形式存储。相反，通常使用强哈希函数（如 `SHA-3`）对其进行哈希处理，并存储密码的哈希值。当用户进行身份验证时，系统会对提供的密码进行哈希处理，并通常以加密格式将哈希值发送给身份验证服务器。身份验证服务器解密接收到的哈希值，然后将其与该用户存储的哈希值进行比较。如果哈希值匹配，系统即认证该用户通过。\n\
  \n在对密码进行哈希处理时，使用强哈希函数非常重要。许多密码攻击之所以得逞，是因为组织使用了弱哈希函数，例如消息摘要算法 5（`MD5`）。\n\n修改默认密码也很重要。虽然\
  \ IT 专业人员知道给计算机修改默认密码，但这方面的知识并未很好地延伸到嵌入式系统。嵌入式系统是指任何具有专用功能并包含计算系统以执行该功能的设备。例如，考虑一个操作网络并收集客户水表数据的嵌入式系统。如果默认密码未被修改，任何知道该密码的人都可以登录并制造麻烦。\n\
  \n以下章节将介绍使用字典、暴力破解、彩虹表和嗅探方法的常见密码攻击。其中一些攻击可能针对在线账户。然而，攻击者更常见的做法是窃取账户数据库，然后使用离线攻击破解密码。\n\
  \n#### 字典攻击\n\n*字典攻击* 是指使用预定义数据库或常见/预期密码列表中的每一个可能密码，来尝试发现密码。换句话说，攻击者从字典中常见单词的数据库开始着手。字典攻击数据库还包含常用作密码但字典中没有的字符组合。例如，你很可能会在许多密码破解字典中看到前文提到的已泄露\
  \ Ashley Madison 账户数据库中的密码列表。\n\n此外，字典攻击通常会扫描“在原密码基础上修改单个字符”构造的密码。这类密码是指之前使用过的密码，但只有一个字符不同。例如，`password1`\
  \ 是在 `password` 基础上修改而来，`Password`、`1password` 和 `passXword` 也是如此。攻击者在生成彩虹表（本章后面将讨论）时，经常使用这种方法。\n\
  \n#### 暴力破解攻击\n\n*暴力破解攻击* 是指通过系统性地尝试字母、数字和符号的所有可能组合，来尝试发现用户账户的密码。攻击者通常不会手动输入这些组合，而是使用程序以编程方式尝试所有组合。*混合攻击*\
  \ 先尝试字典攻击，然后使用“在原密码基础上修改单个字符”构造的密码执行一种暴力破解攻击。\n\n更长、更复杂的密码比简单密码需要更多破解时间和成本。随着可能性的增加，执行穷举攻击的成本也会上升。换句话说，密码越长、包含的字符类型越多，它对暴力破解攻击的抵抗力就越强。\n\
  \n密码和用户名通常存储在安全系统的账户数据库文件中。然而，系统和应用程序通常不会以明文形式存储它们，而是对密码进行哈希处理，仅存储哈希值。\n\n当用户使用哈希密码进行身份验证时，会发生以下三个步骤：\n\
  \n1.  用户输入凭据，如用户名和密码。\n2.  用户的系统对密码进行哈希处理，并将哈希值发送给认证系统。\n3.  认证系统将此哈希值与密码数据库文件中存储的哈希值进行比较。如果匹配，则表明用户输入了正确的密码。\n\
  \n这提供了两项重要保护。密码不会以明文形式遍历网络，从而避免了遭受嗅探攻击。密码数据库不以明文形式存储密码，因此即使攻击者获得了对密码数据库的访问权限，也更难发现密码。\n\
  \n然而，密码攻击工具会寻找能够生成与账户数据库文件中存储条目相同哈希值的密码。如果成功，他们就可以使用该密码登录账户。例如，假设密码 `IPassed` 的存储哈希值为十六进制的\
  \ `1A5C7G`（实际哈希值会长得多）。暴力破解密码工具将执行以下步骤：\n\n1.  猜测一个密码。\n2.  计算该密码的哈希值。\n3.  将计算出的哈希值与离线数据库中存储的哈希值进行比较。\n\
  4.  重复步骤 1 至 3，直到某个猜测的密码拥有与存储密码相同的哈希值。\n\n这也称为比较分析。当密码破解工具找到匹配的哈希值时，表明猜测的密码极有可能是原始密码。攻击者现在可以使用此密码冒充用户。\n\
  \n如果两个不同的密码生成了相同的哈希值，就会发生碰撞。碰撞是不可取的，理想情况下不应发生碰撞，但某些哈希函数（如 `MD5`）并非无碰撞。这允许攻击者创建一个不同的密码，其产生的哈希值与账户数据库文件中存储的哈希密码相同。这也是为什么今天不建议使用\
  \ `MD5` 对密码进行哈希处理的原因之一。\n\n凭借现代计算机的速度和利用分布式计算的能力，暴力破解攻击甚至能攻破某些强密码。实际发现密码所需的时间取决于对其进行哈希处理所用的算法和计算机的算力。\n\
  \n许多攻击者在暴力破解攻击中使用图形处理单元（`GPU`）。一般来说，`GPU` 的处理能力比台式电脑中的大多数 `CPU` 更强。在互联网上快速搜索即可发现，如何以不到\
  \ 10,000 美元的成本、在购买零件后短短几小时内组装一台多 `GPU` 计算机的在线指南。\n\nMandylion Research Labs 创建了一个\
  \ Excel 电子表格，展示了密码被破解的速度。随着 `CPU` 和 `GPU` 性能越来越强，系统每秒能尝试的密码数量是一个不断变化的目标。我们将工作表设定为假设系统每秒可尝试\
  \ 3500 亿个密码，以下列表显示了破解不同密码组合所需的计算时间：\n\n*   **8 个字符（6 个小写字母，1 个大写，1 个数字）**：不到一秒\n\
  *   **10 个字符（8 个小写字母，1 个大写，1 个数字）**：1.29 小时\n*   **12 个字符（10 个小写字母，1 个大写，1 个数字）**：约\
  \ 36 天\n*   **15 个字符（13 个小写字母，1 个大写，1 个数字）**：约 1,753 年\n\n随着处理器变得更好、更便宜，攻击者将更容易将更多处理器集群到单个系统中。这使得系统每秒能尝试更多密码，从而减少破解较长密码所需的时间。\n\
  \n### 生日攻击\n\n\n\n\n\n### 生日攻击\n\n*生日攻击*专注于寻找碰撞。其名称源于一种称为生日悖论的统计现象。生日悖论指出，如果一个房间里有\
  \ 23 个人，那么其中任意两人的生日相同（指月份和日期相同，如 3 月 30 日，而非同年）的概率为 50%。\n\n考虑到闰年的 2 月 29 日，一年只有\
  \ 366 种可能的日期。如果房间里有 367 个人，那么至少有两人生日相同的概率为 100%。将人数减少到仅 23 人，任意两人生日相同的概率仍为 50%。\n\
  \n这类似于寻找具有相同哈希值的任意两个密码。如果一个哈希函数只能生成 366 个不同的哈希值，那么拥有仅 23 个哈希样本的攻击者就有 50% 的几率发现两个产生相同哈希值的密码。哈希算法能生成的不同哈希值远多于\
  \ 366 个，但关键在于生日攻击方法不需要遍历所有可能的哈希值就能找到匹配项。\n\n从另一个角度来看，假设你是房间里的人之一，想找一个和你生日相同的人。在这个例子中，房间里需要有\
  \ 253 人，才能达到找到另一个与你生日相同的人的概率为 50%。\n\n同样，某些工具也可以找出另一个能产生给定哈希值相同哈希值的密码。例如，如果你知道管理员账户密码的哈希值是\
  \ `1A5C7G`，某些工具可以识别出一个能产生相同哈希值 `1A5C7G` 的密码。这不一定是同一个密码，但如果它能产生相同的哈希值，它就和原密码一样有效。\n\
  \n你可以通过使用具有足够位数以使碰撞在计算上不可行的哈希算法，以及使用盐值（在下一节“彩虹表攻击”中讨论）来降低生日攻击的成功率。曾有一段时间，安全专家认为\
  \ `MD5`（使用 128 位）是无碰撞的。然而，算力持续提升，`MD5` 已不再无碰撞。`SHA-3`（安全哈希算法版本 3 的简称）最多可使用 512 位，目前被认为能抵御生日攻击和碰撞——至少目前如此。算力持续提升，因此未来\
  \ `SHA-3` 终将被另一种具有更长哈希值和/或更强密码学方法创建哈希的哈希算法所取代。\n\n#### 彩虹表攻击\n\n通过猜测密码、对其进行哈希运算，然后将其与有效的密码哈希进行比较来寻找密码，这需要很长时间。然而，*彩虹表*通过使用预计算哈希值的大型数据库来缩短这一时间。攻击者猜测密码（使用字典法或暴力破解法），对其进行哈希运算，然后将猜测的密码及其哈希值同时存入彩虹表中。\n\
  \n密码破解工具随后可以将彩虹表中的每个哈希值与被盗密码数据库文件中的哈希值进行比较。传统的密码破解工具必须先猜测密码并对其进行哈希运算，然后才能比较哈希值，这需要时间。然而，使用彩虹表时，密码破解工具不需要花费任何时间去猜测和计算哈希值。它只需比较哈希值直到找到匹配项。这可以显著缩短破解密码所需的时间。\n\
  \n许多系统通常会对密码进行*加盐*，以减弱彩虹表攻击的效果。盐值是在对密码进行哈希运算前添加的一组随机位。加密方法在哈希前添加这些额外的位，使得攻击者难以利用彩虹表攻击密码。`Bcrypt`\
  \ 和 `基于密钥派生函数 2 (PBKDF2)` 是两种常用的给密码加盐的算法。\n\n然而，给予足够的时间，攻击者仍可使用暴力破解攻击破解加盐密码。在加盐密码中添加胡椒值可增加安全性，使其更难破解。盐值是存储在保存哈希密码的同一数据库中的随机数，因此如果攻击者获取了数据库，也就获得了密码的盐值。*胡椒值*是一个存储在别处的大常数，例如服务器上的配置值或存储在应用程序代码中的常量。\n\
  \n虽然加盐做法最初是专门为了挫败彩虹表攻击而引入的，但它也阻碍了离线字典攻击和暴力破解攻击的有效性。这些离线攻击必须计算猜测密码的哈希值，如果存储的密码包含盐值，除非攻击者也发现了盐值，否则攻击就会失败。同样，将胡椒值存储在保存加盐哈希密码的数据库之外，会使所有这些攻击变得更加困难。\n\
  \n#### 嗅探攻击\n\n*嗅探*是指捕获网络上发送的数据包以分析这些数据包。嗅探器（也称为数据包分析器或协议分析器）是一种捕获网络上传输流量的软件应用程序。管理员使用嗅探器分析网络流量并排查问题。\n\
  \n当然，攻击者也可以使用嗅探器。*嗅探攻击*（也称为窥探攻击或偷听攻击）发生在攻击者使用嗅探器捕获网络上传输的信息时。他们可以捕获并读取以明文形式通过网络发送的任何数据，包括密码。\n\
  \n`Wireshark` 是一款流行的协议分析器，可免费下载。图 14.4 展示了一个相对较小的捕获内容的 `Wireshark` 界面，演示了攻击者如何捕获并读取通过网络以明文发送的数据。\n\
  \n![图 14.4 Wireshark 捕获](img/c14f004.jpg)\n\n**图 14.4** Wireshark 捕获\n\n顶部窗格显示选中了数据包\
  \ 260，您可以在底部窗格中看到该数据包的内容。其中包含文本 `User: DarrilGibson Password: IP@$$edCi$$P`。如果您查看顶部窗格中的第一个数据包（数据包编号\
  \ 250），可以看到打开的文件名为 `CISSP Secrets.txt`。\n\n以下技术可以防止成功的嗅探攻击：\n\n*   加密通过网络发送的所有敏感数据（包括密码）。攻击者无法轻易使用嗅探器读取加密数据。例如，`Kerberos`\
  \ 对票据进行加密以防止攻击，攻击者无法轻易使用嗅探器读取这些票据的内容。\n*   当无法或不可行进行加密时，使用一次性密码。一次性密码可防止嗅探攻击成功，因为它们仅使用一次。即使攻击者捕获了一次性密码，也无法使用它。\n\
  *   使用物理安全保护网络设备。控制对路由器和交换机的物理访问，可防止攻击者在这些设备上安装嗅探器。\n*   监控网络中的嗅探器特征。入侵检测系统可监控网络中的嗅探器，并在检测到网络上有嗅探器时发出警报。\n\
  \n#### 欺骗攻击\n\n*欺骗*（也称为伪装）是指假装成其他事物或他人。欺骗攻击种类繁多。例如，攻击者可以使用他人的凭证进入建筑物或访问 IT 系统。某些应用程序会伪造合法的登录屏幕。有一次攻击弹出了一个与操作系统登录屏幕完全相同的登录屏幕。当用户输入凭证时，虚假应用程序捕获了用户的凭证，攻击者稍后加以利用。某些网络钓鱼攻击（本节后面将介绍）通过伪造网站模仿这种手法。\n\
  \n\n\n\n\n### IP 欺骗攻击\n\n在 IP 欺骗攻击中，攻击者将有效的源 IP 地址替换为虚假地址，以隐藏其身份或冒充受信任的系统。访问控制攻击中使用的其他类型的欺骗包括电子邮件欺骗和电话号码欺骗。\n\
  \n#### 电子邮件欺骗\n\n垃圾邮件发送者通常会欺骗 `From` 字段中的电子邮件地址，使电子邮件看起来像是来自另一个来源。网络钓鱼攻击经常这样做，以诱使用户认为该电子邮件来自受信任的来源。`Reply\
  \ To` 字段可以是不同的电子邮件地址，电子邮件程序通常不会显示此字段，直到用户回复该电子邮件。到那时，他们往往会忽略它或没有注意到它。\n\n#### 电话号码欺骗\n\
  \n来电显示服务允许用户识别来电者的电话号码。电话号码欺骗允许来电者将此号码替换为另一个号码，这是互联网协议语音 (VoIP) 系统上常用的一种技术。攻击者最近一直在使用的一种技术是，将实际来电号码替换为包含与被叫号码相同区号的电话号码。这使其看起来像是一个本地来电。\n\
  \n#### 社会工程学攻击\n\n有时，获取某人密码最简单的方法就是直接询问，这是社会工程师常用的手段。**社会工程学** 是指攻击者试图通过欺骗手段（如虚假奉承或冒充身份）或奸诈行为，获取某人的信任。攻击者试图诱骗人们泄露他们通常不会透露的信息，或执行他们通常不会执行的操作。通常，社会工程师的目标是获取对\
  \ IT 基础设施或物理设施的访问权限。\n\n例如，熟练的社会工程师可以说服一名未受过安全教育的服务台员工，声称他们与高层管理人员有关联且正在远程工作，但忘记了密码。如果被骗，该员工可能会重置密码并将新密码提供给攻击者。其他时候，社会工程师会诱骗普通用户泄露自己的密码，从而让攻击者获得对用户账户的访问权限。教育员工了解常见的社会工程学战术，可以降低此类攻击的有效性。\n\
  \n社会工程学攻击可能通过电话、当面或电子邮件发生。当面攻击时，恶意人员通常冒充维修技术人员（如电话维修技术人员）以获取物理访问权限。如果他们获得了对网络基础设施的访问权限，随后可以安装嗅探器来捕获敏感数据。在提供访问权限前验证访客身份，可以缓解此类冒充攻击。\n\
  \n有时，社会工程师只是试图从个人肩膀上方窥视，以读取计算机屏幕上的信息，或观察用户打字时的键盘。这通常被称为**肩窥**。放置在显示器上的屏幕滤光片可以限制攻击者的视线。此外，密码掩码（显示星号等替代字符，而不是实际的密码字符）常用于缓解肩窥。\n\
  \n##### 网络钓鱼\n\n**网络钓鱼** 是一种社会工程学形式，旨在诱骗用户泄露敏感信息、打开附件或点击链接。它通常通过伪装成合法公司，试图获取用户凭证或个人身份信息\
  \ (PII)，如用户名、密码或信用卡详细信息。攻击者将网络钓鱼邮件作为垃圾邮件无差别发送，不知道谁会收到，但希望有些用户会做出回应。网络钓鱼邮件有时会告知用户一个虚假的问题，并声称如果用户不采取行动，公司将锁定用户的账户。例如，邮件可能声称公司检测到账户上有可疑活动，除非用户验证用户名和密码信息，否则公司将锁定该账户。\n\
  \n简单的网络钓鱼攻击会告知用户存在问题，并要求收件人通过电子邮件回复其用户名、密码和其他详细信息。`From` 电子邮件地址通常被欺骗得看起来合法，但 `Reply\
  \ To` 电子邮件地址是攻击者控制的账户。复杂的攻击包含指向虚假网站的链接，这些网站看起来很合法。例如，如果网络钓鱼邮件描述了 PayPal 账户的问题，该虚假网站看起来就会像\
  \ PayPal 网站。如果用户输入凭证，该网站会捕获它们并传递给攻击者。\n\n其他时候，发送网络钓鱼邮件的目的是在用户系统上安装恶意软件。邮件可能包含受感染的文件（如附件），并鼓励用户打开它。邮件可能包含指向网站的链接，该网站会在用户不知情的情况下安装恶意的**路过式下载**。\n\
  \n一些恶意网站试图诱骗用户下载并安装软件。例如，近年来勒索软件在攻击者中变得非常流行。勒索软件是一种控制用户系统或数据并阻止用户访问的恶意软件，直到用户支付费用或赎金。攻击者通过恶意附件和路过式下载投放它，并通过鼓励用户下载并安装软件来传播它。\n\
  \n攻击者在制作网络钓鱼邮件时，经常利用社交媒体来识别人与人之间的友谊或关系。例如，假设你有一个在社交媒体网站上非常活跃的妹妹，并且你与她建立了联系。攻击者会注意到这种联系，然后发送带有欺骗性电子邮件地址的邮件给你，使其看起来像是你妹妹发的。这些邮件通常只有一行字，如“看看这个”或“我觉得你可能会喜欢这个”。点击链接会将你带到一个恶意网站，该网站会尝试进行路过式下载。\n\
  \n人员可以通过遵循一些简单的规则来避免一些与网络钓鱼相关的常见风险：\n\n*   对意外的电子邮件或来自未知发件人的电子邮件保持怀疑。\n*   切勿打开意外的电子邮件附件。\n\
  *   切勿通过电子邮件共享敏感信息。\n*   对电子邮件中的任何链接保持怀疑。\n\n网络钓鱼攻击有几种变体，包括鱼叉式网络钓鱼、鲸钓和语音钓鱼。\n\n\
  ###### 鱼叉式网络钓鱼\n\n**鱼叉式网络钓鱼** 是一种针对特定用户群体的网络钓鱼形式，例如特定组织内的员工。它可能看起来源自组织内的同事或同事，或来自外部来源。\n\
  \n例如，攻击者利用 Adobe PDF 文件中的零日漏洞，该漏洞允许他们嵌入恶意代码。如果用户打开该文件，它会在用户系统上安装恶意软件。攻击者将该 PDF 文件命名为类似“合同指南”的名称，并在邮件中说明它提供了关于合同授标流程的更新信息。他们将邮件发送给知名政府承包商（如洛克希德·马丁公司）的目标电子邮件地址。如果任何承包商打开了该文件，它就会在他们的系统上安装恶意软件，使攻击者能够远程访问受感染的系统。\n\
  \n###### 鲸钓\n\n**鲸钓** 是一种针对高级管理人员（如公司首席执行官 (CEO) 和总裁）的网络钓鱼变体。一次著名的鲸钓攻击以姓名标识了约 20,000\
  \ 名高级企业高管，并声称他们被传唤出席大陪审团。邮件包含一个链接以获取有关传票的更多信息。如果高管点击了该链接，网站上的消息会提示高管需要安装浏览器插件才能阅读该文件。\n\
  \n批准安装该插件的高管在其系统上安装了恶意软件，该软件记录他们的击键，捕获他们访问的不同网站的登录凭证。它还给了攻击者对高管系统的远程访问权限，允许攻击者安装额外的恶意软件，或读取系统上的所有数据。\n\
  \n\n\n\n\n##### Vishing\n\n虽然攻击者主要通过电子邮件发起网络钓鱼攻击，但他们也利用其他手段欺骗用户，例如即时通讯（IM）和 VoIP。\n\
  \n**Vishing** 是一种网络钓鱼变体，利用电话系统或 VoIP。常见的攻击方式是通过自动呼叫告知用户信用卡账户出现问题，诱导用户验证或确认信用卡号、有效期以及卡背面的安全码等信息。Vishing\
  \ 攻击通常会伪造来电显示号码，以冒充合法的银行或金融机构。\n\n###### 智能卡攻击\n\n智能卡提供比密码更好的身份验证，尤其是当它们与另一个认证因素（如个人识别号\
  \ `PIN`）结合使用时。然而，智能卡也容易受到攻击。**侧信道攻击** 是一种被动的、非侵入式攻击，旨在观察设备的运行。一旦攻击成功，攻击者可以获取卡内的宝贵信息，例如加密密钥。\n\
  \n智能卡包含一个微处理器，但没有内部电源。相反，当用户将卡插入读卡器时，读卡器为卡提供电力。读卡器有一个电磁线圈，激发卡上的电子元件，从而为智能卡向读卡器传输数据提供足够的电力。\n\
  \n侧信道攻击分析发送给读卡器的信息。有时它们可以测量芯片的功耗，利用功耗监控攻击或差分功耗分析攻击来提取信息。在时序攻击中，它们可以监控处理时序，根据不同计算所需的时间获取信息。故障分析攻击试图制造故障（例如向卡提供过少的电力）以获取有价值的信息。\n\
  \n### 保护方法总结\n\n以下列表总结了许多防范访问控制攻击的安全预防措施。但重要的是要认识到，这并不是针对所有类型攻击的综合防护清单。本书其他章节还将介绍有助于防止攻击的其他控制措施。\n\
  \n**控制对系统的物理访问。** 关于安全有一句老话：如果攻击者获得了对计算机的无限制物理访问权限，那么攻击者就拥有了这台计算机。如果攻击者能物理接触到认证服务器，他们可以在极短时间内窃取密码文件。一旦攻击者拥有密码文件，他们就可以离线破解密码。如果攻击者成功下载密码文件，应视所有密码均已泄露。\n\
  \n**控制对文件的电子访问。** 严格控制并监控对所有重要数据（包括包含密码的文件）的电子访问。最终用户和非账户管理员无需为日常工作任务访问密码数据库文件。安全专业人员应立即调查任何对密码数据库文件的未授权访问。\n\
  \n**制定强密码策略。** 密码策略通过程序强制使用强密码，并确保用户定期更换密码。攻击者需要更多时间才能使用多种字符类型破解更长的密码。给予足够的时间，攻击者可以在离线暴力破解攻击中发现任何密码，因此定期更换密码是维护安全所必需的。更安全或敏感的环境要求更强的密码，并要求用户更频繁地更换密码。许多组织为管理员账户等特权账户实施单独的密码策略，以确保它们拥有更强的密码，并且管理员比普通用户更频繁地更换密码。\n\
  \n**对密码进行哈希和加盐。** 使用 `bcrypt` 和 `PBKDF2` 等协议对密码进行加盐，并考虑使用外部加胡椒进一步保护密码。结合强密码的使用，加盐和加胡椒的密码极难通过彩虹表或其他方法破解。\n\
  \n**使用密码掩码。** 确保应用程序绝不在任何屏幕上以明文显示密码。相反，通过显示替代字符（如星号 `*`）来掩盖密码显示。这可以减少肩窥攻击，但用户应意识到攻击者可能通过观察用户在键盘上敲击按键来获知密码。\n\
  \n**部署多因素认证。** 部署多因素认证，例如使用生物识别或令牌设备。当组织使用多因素认证时，攻击者仅发现密码无法访问网络。许多在线服务（如 Google）现在提供多因素认证作为额外的保护措施。\n\
  \n**使用账户锁定控制。** 账户锁定控制有助于防止在线密码攻击。它们在输入错误密码达到预定义次数后锁定账户。账户锁定控制通常使用截断级别，忽略一些用户错误，但在达到阈值后采取行动。例如，通常允许用户最多输入五次错误密码才锁定账户。对于不支持账户锁定控制的系统和服务（如大多数文件传输协议\
  \ `FTP` 服务器），大量的日志记录结合入侵检测系统可以保护服务器。\n\n**使用最后登录通知。** 许多系统显示一条消息，包含上次成功登录的时间、日期和位置（如计算机名称或\
  \ IP 地址）。如果用户注意此消息，可能会发现其他人是否登录过其账户。例如，如果用户上周五登录了账户，但最后登录通知显示有人在周六访问了该账户，则表明存在问题。怀疑他人登录自己账户的用户可以更改密码或向系统管理员报告问题。如果发生在组织账户上，用户应遵循组织的安全事件报告程序进行报告。\n\
  \n**教育用户了解安全。** 经过适当培训的用户对安全有更好的理解，也更懂得使用更强密码的好处。告知用户切勿共享或记录他们的密码。管理员可能会为最高敏感度的账户（如管理员或\
  \ `root` 账户）记录长而复杂的密码，并将这些密码存放在保险库或保险箱中。向用户提供关于如何创建强密码（如使用密码短语）以及如何防止肩窥的提示。此外，让用户了解对所有在线账户（如银行账户和游戏账户）使用相同密码的危险。当用户对所有这些账户使用相同密码时，游戏系统遭受的成功攻击可能让攻击者访问用户的银行账户。用户还应了解常见的社会工程学战术。\n\
  \n### 总结\n\n本章涵盖了许多与访问控制模型相关的概念。权限是指授予对象的访问权，决定了用户（主体）可以对对象执行什么操作。权利主要是指对对象执行操作的能力。特权包含权利和权限。隐式拒绝确保除非已明确授予主体访问权限，否则拒绝对对象的访问。\n\
  \n访问控制矩阵是一个以对象为中心的表，包含对象、主体和分配给主体的特权。表中的每一行代表单个对象的 `ACL`。`ACL` 以对象为中心，标识授予主体针对特定对象的访问权限。能力表以主体为中心，标识主体可以访问的对象。\n\
  \n\n\n\n受限接口根据用户的权限限制他们能做或看到的内容。基于内容的控制根据对象内的内容限制访问。基于上下文的控制要求在授予用户访问权限前进行特定活动。\n\
  \n最小权限原则确保主体仅被授予执行其工作任务和职能所需的特权。职责分离通过确保敏感功能被拆分为由两名或更多员工执行的任务来帮助防止欺诈。\n\n书面安全策略定义了组织的安全要求，安全控制实施并强制执行安全策略。纵深防御策略在多个层面实施安全控制以保护资产。\n\
  \n在自主访问控制中，所有对象都有一个所有者，且所有者对对象拥有完全控制权。管理员集中管理非自主控制。基于角色的访问控制使用通常与组织层级匹配的角色或组。管理员将用户分配到角色，并根据工作或任务向角色分配特权。基于规则的访问控制使用对所有主体平等适用的全局规则。强制访问控制要求所有对象都有标签，且访问基于主体拥有匹配的标签。\n\
  \n在评估访问控制攻击可能造成的潜在损失时，了解基本风险要素非常重要。风险是指威胁利用漏洞导致损失的可能性或概率。资产评估确定资产的价值，威胁建模识别潜在威胁，漏洞分析识别漏洞。这些都是在实施控制以防止访问控制攻击时需要理解的重要概念。\n\
  \n常见的访问控制攻击试图绕过认证机制。访问聚合是指收集和聚合非敏感信息以尝试推断敏感信息的行为。\n\n密码是一种常见的认证机制，多种类型的攻击试图破解密码。密码攻击包括字典攻击、暴力破解攻击、生日攻击、彩虹表攻击和嗅探攻击。侧信道攻击是针对智能卡的被动攻击。\n\
  \n### 考试要点\n\n**识别常见的授权机制。** 授权确保根据分配给已认证身份的特权，请求的活动或对象访问是可行的。例如，它确保具有适当特权的用户可以访问文件和其他资源。常见的授权机制包括隐式拒绝、访问控制列表、访问控制矩阵、能力表、受限接口、基于内容的控制和基于上下文的控制。这些机制强制执行安全原则，如需知原则、最小权限原则和职责分离。\n\
  \n**了解各种访问控制模型的细节。** 在自主访问控制（`DAC`）模型中，所有对象都有所有者，且所有者可以修改权限。管理员集中管理非自主控制。基于角色的访问控制（`RBAC`）模型使用基于任务的角色，当管理员将用户账户放入角色时，用户获得特权。基于规则的访问控制模型使用一组规则、限制或过滤器来确定访问。强制访问控制（`MAC`）模型使用标签来标识安全域。主体需要匹配的标签才能访问对象。\n\
  \n**理解基本风险要素。** 风险是指威胁利用漏洞并对资产造成损害的可能性或概率。资产评估确定资产的价值，威胁建模识别针对这些资产的威胁，漏洞分析识别组织宝贵资产中的弱点。访问聚合是一种将非敏感信息组合或聚合以获取敏感信息的攻击类型，用于侦察攻击。\n\
  \n**了解暴力破解和字典攻击的工作原理。** 暴力破解和字典攻击针对被盗的密码数据库文件或系统的登录提示进行。它们旨在发现密码。在暴力破解攻击中，会使用所有可能的键盘字符组合，而字典攻击则使用预定义的可能密码列表。账户锁定控制可防止其对在线攻击生效。\n\
  \n**理解强密码的必要性。** 强密码使密码破解工具的成功率降低。强密码包含多种字符类型，且不包含字典中的单词。密码策略确保用户创建强密码。密码存储时应加密，通过网络发送时也应加密。通过使用除密码之外的额外因素可以增强认证强度。\n\
  \n**理解盐值和胡椒值如何阻止密码攻击。** 盐值在哈希前向密码添加额外的位，有助于阻止彩虹表攻击。某些算法（如 `bcrypt` 和基于密钥的派生函数 2（`PBKDF2`））添加盐值并重复哈希函数多次。盐值与哈希后的密码存储在同一数据库中。胡椒值是一个用于进一步增加哈希密码安全性的大常数，它存储在保存哈希密码的数据库之外。\n\
  \n**理解嗅探攻击。** 在嗅探攻击（或窃听攻击）中，攻击者使用数据包捕获工具（如嗅探器或协议分析仪）来捕获、分析和读取通过网络发送的数据。攻击者可以轻松读取以明文形式通过网络发送的数据，但对传输中的数据进行加密可阻止此类攻击。\n\
  \n**理解欺骗攻击。** 欺骗是指假装成其他事物或他人，它被用于多种类型的攻击，包括访问控制攻击。攻击者经常试图获取用户的凭据，以便欺骗用户的身份。欺骗攻击包括电子邮件欺骗、电话号码欺骗和\
  \ `IP` 欺骗。许多网络钓鱼攻击使用欺骗方法。\n\n**理解社会工程学。** 社会工程学攻击是攻击者试图说服某人提供信息（如密码）或执行其通常不会执行的操作（如点击恶意链接），从而导致安全妥协。社会工程师通常试图获取对\
  \ IT 基础设施或物理设施的访问权限。用户教育是防止社会工程学攻击成功的有效工具。\n\n**理解网络钓鱼。** 网络钓鱼攻击通常用于诱骗用户泄露个人信息（如用户账户和密码）、点击恶意链接或打开恶意附件。定向钓鱼针对特定用户群体，而鲸钓针对高级管理人员。语音钓鱼使用\
  \ `VoIP` 技术。\n\n### 书面实验\n\n1.  描述自主访问控制模型和非自主访问控制模型之间的主要区别。\n\n2.  列出在尝试识别和预防访问控制攻击时需要识别的三个要素。\n\
  \n3.  列举至少三种用于发现密码的攻击类型。\n\n4.  识别盐值和胡椒值（哈希密码时使用）之间的区别。\n\n### 复习题\n\n1.  以下哪项*最好*地描述了隐式拒绝原则？\n\
  \n    1.  所有未明确拒绝的操作均被允许。\n\n    2.  所有未明确允许的操作均被拒绝。\n\n    3.  所有操作必须明确拒绝。\n\n\
  \    4.  以上都不是。\n\n2.  最小权限的意图是什么？\n\n    1.  强制执行用户运行系统进程所需的最严格权限。\n\n    2.  强制执行用户运行系统进程所需的最宽松权限。\n\
  \n\n\n\n### 第 15 章：安全评估与测试\n\n## 本章涵盖的 CISSP 考试主题\n\n**领域 6：安全评估与测试**\n\n*   6.1\
  \ 设计并验证评估、测试和审计策略\n    *   6.1.1 内部\n    *   6.1.2 外部\n    *   6.1.3 第三方\n*   6.2\
  \ 实施安全控制测试\n    *   6.2.1 漏洞评估\n    *   6.2.2 渗透测试\n    *   6.2.3 日志审查\n    *  \
  \ 6.2.4 综合事务\n    *   6.2.5 代码审查与测试\n    *   6.2.6 误用案例测试\n    *   6.2.7 测试覆盖率分析\n\
  \    *   6.2.8 接口测试\n*   6.3 收集安全流程数据\n    *   6.3.1 账户管理\n    *   6.3.2 管理层审查与批准\n\
  \    *   6.3.3 关键绩效与风险指标\n    *   6.3.4 备份验证数据\n*   6.4 分析测试输出并生成报告\n*   6.5 实施或协助安全审计\n\
  \    *   6.5.1 内部\n    *   6.5.2 外部\n    *   6.5.3 第三方\n\n---\n\n通读本书，您已了解到信息安全专业人员实施的许多不同控制措施，以保护数据的机密性、完整性和可用性。其中，技术控制在保护服务器、网络和其他信息处理资源方面发挥着重要作用。安全专业人员构建并配置这些控制措施后，必须定期对其进行测试，以确保它们持续有效地保护信息。\n\
  \n安全评估与测试计划执行定期检查，以确保已建立充分的安全控制措施，且这些措施能有效执行其指定功能。在本章中，您将了解全球安全专业人员使用的许多评估与测试控制措施。\n\
  \n### 建立安全评估与测试计划\n\n信息安全团队的基石维护活动是其安全评估与测试计划。该计划包含测试、评估和审计，定期验证组织拥有充分的安全控制措施，且这些安全控制措施运行正常，有效保护信息资产。\n\
  \n在本节中，您将了解安全评估计划的三大主要组成部分：\n\n*   安全测试\n*   安全评估\n*   安全审计\n\n#### 安全测试\n\n*安全测试*\
  \ 验证控制措施是否正常运行。这些测试包括自动化扫描、工具辅助渗透测试和手动破坏安全的尝试。安全测试应按固定时间表定期进行，并关注保护组织的每项关键安全控制。在安排安全控制审查时，信息安全经理应考虑以下因素：\n\
  \n*   安全测试资源的可用性\n*   受测试控制保护的系统和应用程序的关键性\n*   受测试系统和应用程序上所含信息的敏感性\n*   实施控制的机制发生技术故障的可能性\n\
  \n---\n\n### 练习题\n\n### 3. 强制执行用户完成分配任务所需的最严格权限。\n\n### 4. 强制执行用户完成分配任务所需的最宽松权限。\n\
