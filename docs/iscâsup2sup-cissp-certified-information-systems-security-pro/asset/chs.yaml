- "# CISSP 认证信息系统安全专家官方学习指南\n\n\n\n![](img/cover.jpg)\n\n---\n\n*献给 Dewitt Latimer，我的导师、朋友和同事。我深深怀念你。*\n\
  \n*—Mike Chapple*\n\n*献给 Cathy，你对世界和生活的看法常让我惊讶、受到挑战，并让我更加爱你。*\n\n*—James Michael\
  \ Stewart*\n\n*献给 Nimfa，感谢你过去 26 年与我共度人生，也让我与你分享我的人生。*\n\n*—Darril Gibson*\n\n---\n\
  \n# 致未来的 (ISC)² 会员\n\n![images](img/ffirsg001.jpg)\n\n恭喜你踏上 CISSP^® 认证之旅。获得 CISSP\
  \ 认证是你网络安全职业生涯中一个令人振奋且富有回报的里程碑。它不仅证明了你开发和管理组织网络安全运营几乎所有方面的能力，还向雇主展示了你对终身学习的承诺，以及积极履行\
  \ (ISC)² “激励打造安全可靠的网络世界”这一愿景的决心。\n\n本书的学习材料基于 (ISC)² CISSP 通用知识体系 (Common Body of\
  \ Knowledge)。它将帮助你备考，该考试将评估你在以下八个领域的胜任力：\n\n*   安全与风险管理\n*   资产安全\n*   安全架构与工程\n\
  *   通信与网络安全\n*   身份与访问管理 (IAM)\n*   安全评估与测试\n*   安全运营\n*   软件开发安全\n\n虽然本书将助你备考，但能否通过\
  \ CISSP 考试取决于你对各领域的掌握程度，以及你将这些概念结合实际经验加以应用的能力。\n\n祝你在成为 CISSP 和 (ISC)² 认证会员的道路上一切顺利。\n\
  \n谨致问候，\n\n![images](img/ffirsg002.jpg)\n\n**David Shearer, CISSP**\n\n**首席执行官**\n\
  \n**(ISC)²**\n\n---\n\n# 致谢\n\n我们要感谢 Sybex 对该项目的持续支持。特别感谢第八版开发编辑 Kelly Talbot 以及技术编辑\
  \ Jeff Parker、Bob Sipes 和 David Seidl，他们在指导我们完善本书方面做出了卓越贡献。也感谢我们的代理人 Carole Jelen，感谢她持续协助推进这些项目。\n\
  \n——Mike、James 和 Darril\n\n特别感谢圣母大学（University of Notre Dame）的信息安全团队，他们提供了数小时有趣的对话和关于安全问题的辩论，这些启发并丰富了本书的大量内容。\n\
  \n我要感谢 Wiley 团队在本书开发过程中提供的宝贵帮助。我还要感谢我的文学代理人、Waterside Productions 的 Carole Jelen。我的合著者\
  \ James Michael Stewart 和 Darril Gibson 是出色的合作者。我们勤奋且渊博的技术编辑 Jeff Parker、Bob Sipes\
  \ 和 David Seidl 在我们将此版本付梓的过程中提供了宝贵的见解。\n\n我也要感谢许多参与本书制作但我从未有机会谋面的人员：美工团队、制作人员以及所有参与将本书付梓的人。\n\
  \n——Mike Chapple\n\n感谢 Mike Chapple 和 Darril Gibson 继续为该项目做出贡献。也感谢我所有的 CISSP 课程学员，他们提供的见解和建议改进了我的培训教材，并最终完善了这部巨著。献给我深爱的妻子\
  \ Cathy：与你共同建立生活和家庭比我所能想象的更加美好。献给 Slayde 和 Remi：你们成长得如此之快，学习速度惊人，每天都让我感到欣喜和钦佩。你们正成长为了不起的个体。献给我的母亲\
  \ Johnnie：能有你在身边真好。献给 Mark：无论时光流逝多久，无论我们见面多少，我一直是、也永远将是你的朋友。最后，一如既往地献给 Elvis：你用花生酱/香蕉/培根三明治早早走在了当前培根狂热的前面；我想这是你穿越了时空的证明！\n\
  \n——James Michael Stewart\n\n\n\n\n感谢 Jim Minatel 和 Carole Jelen 在 (ISC)² 发布考试大纲之前帮助完成了此次更新。这让我们对新版本有了先发优势，我们感谢你们的付出。能与\
  \ James Michael Stewart 和 Mike Chapple 这样才华横溢的人共事是一种荣幸。感谢你们二位为该项目付出的所有工作和协作努力。技术编辑\
  \ Jeff Parker、Bob Sipes 和 David Seidl 为我们提供了极佳的反馈，正是由于他们的努力，本书才更加完善。感谢 Sybex 团队（包括项目经理、编辑和美工）为帮助我们将本书付梓所做的所有工作。最后，感谢我的妻子\
  \ Nimfa，包容我在撰写本书期间不规律的作息时间。\n\n——Darril Gibson\n\n# 关于作者\n\n**Mike Chapple**，CISSP、PhD、Security+、CISA、CySA+，是圣母大学\
  \ IT、分析与运营副教学教授。过去，他曾担任 Brand Institute 首席信息官，以及美国国家安全局和美国空军的信息安全研究员。他的主要专长领域包括网络入侵检测和访问控制。Mike\
  \ 是 TechTarget SearchSecurity 网站的常驻撰稿人，著有 25 余本书籍，包括本书的配套书籍：*CISSP Official (ISC)²\
  \ Practice Tests*、*CompTIA CSA+ Study Guide* 和 *Cyberwarfare: Information Operations\
  \ in a Connected World*。Mike 在其网站 [www.certmike.com](http://www.certmike.com) 上为\
  \ CISSP、SSCP、Security+ 和 CSA+ 认证提供学习小组。\n\n**James Michael Stewart**，CISSP、CEH、ECSA、CHFI、Security+、Network+，从事写作和培训工作已超过\
  \ 20 年，目前专注于安全领域。自 2002 年起他一直教授 CISSP 培训课程，更不用说其他关于互联网安全和道德黑客/渗透测试的课程了。他是 75 余本书籍以及关于安全认证、微软主题和网络管理的大量课件的作者和贡献者，包括\
  \ *Security+ (SY0-501) Review Guide*。关于 Michael 的更多信息，请访问他的网站 [www.impactonline.com](http://www.impactonline.com)。\n\
  \n**Darril Gibson**，CISSP、Security+、CASP，是 YCDA（You Can Do Anything 的缩写）的 CEO，已撰写或合著\
  \ 40 余本书籍。Darril 定期就各种技术和安全主题进行写作、咨询和教学，并持有多项认证。他定期在 [`blogs.getcertifiedgetahead.com/`](http://blogs.getcertifiedgetahead.com/)\
  \ 发布关于认证主题的博客文章，并利用该网站帮助人们了解认证考试的变化。他喜欢收到读者的反馈，尤其是当他们在使用他的书籍后通过了考试，你可以通过博客网站联系他。\n\
  \n# 关于技术编辑\n\n**Jeff T. Parker**，CISSP，是跨信息安全多个领域的技术编辑和审阅者。Jeff 定期为书籍做贡献，在需要的地方增添经验和实用知识。Jeff\
  \ 的经验源于在波士顿与惠普咨询的 10 年，以及在捷克共和国布拉格与 Deutsche-Post 共事的 4 年。现居加拿大，Jeff 教导他的和其他中学生关于构建（和摧毁）家庭实验室的知识。他最近合著了\
  \ *Wireshark for Security Professionals*，目前正在撰写 *CySA+ Practice Exams*。持续学习！\n\n\
  **Bob Sipes**，CISSP，是 DXC Technology 的企业安全架构师和账户安全官，为 DXC 客户提供战术和战略领导力。他持有多项认证，积极参与包括\
  \ ISSA 和 Infragard 在内的安全组织，并在网络安全、通信和领导力等主题上拥有丰富的公开演讲经验。业余时间，Bob 是一位热衷的古籍收藏家，拥有大量\
  \ 19 世纪和 20 世纪初的少年文学藏书。你可以在 Twitter 上关注 Bob，账号为 @bobsipes。\n\n**David Seidl**，CISSP，是圣母大学校园技术服务高级总监，他也曾在门多萨商学院教授网络安全和网络课程。David\
  \ 撰写了多本关于网络安全认证和网络战的书籍，并担任了 *CISSP Study Guide* 第六、七、八版的技术编辑。David 拥有东密歇根大学信息安全硕士学位和通信技术学士学位，以及\
