  \  5.  以上都不是\n\n2.  以下哪项关于主体的描述是正确的？\n    1.  主体始终是用户账户。\n    2.  主体始终是提供或托管信息或数据的实体。\n\
  \    3.  主体始终是从对象接收信息或数据的实体。\n    4.  单个实体永远不能在主体和对象角色之间切换。\n\n3.  以下哪种类型的访问控制使用围栏、安全策略、安全意识培训和防病毒软件来阻止不需要或未授权的活动发生？\n\
  \    1.  预防性\n    2.  检测性\n    4.  纠正性\n    5.  权威性\n\n4.  什么类型的访问控制是用于管理对资源和系统的访问、并为这些资源和系统提供保护的硬件或软件机制？\n\
