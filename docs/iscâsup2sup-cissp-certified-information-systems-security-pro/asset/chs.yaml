  \n1.  `<H1>`\n2.  `<HEAD>`\n3.  `<XSS>`\n4.  `<SCRIPT>`\n\n### 问题 20：在设计防火墙规则以防止\
  \ IP 欺骗时，应遵循以下哪项原则？\n\n1.  具有内部源 IP 地址的数据包不从外部进入网络。\n2.  具有内部源 IP 地址的数据包不从内部退出网络。\n\
  3.  具有公共 IP 地址的数据包不向任何方向通过路由器。\n4.  具有外部源 IP 地址的数据包不从外部进入网络。\n\n## 附录 A\n\n### 复习题答案\n\
  \n#### 第 1 章：通过原则和策略进行安全治理\n\n1.  **B**。安全的主要目标是机密性、完整性和可用性，通常称为 **CIA Triad**。\n\
  2.  **A**。漏洞和风险是根据它们对 **CIA Triad** 原则的威胁来评估的。\n3.  **B**。可用性意味着授权主体被授予及时且不间断的对象访问权限。\n\
  4.  **C**。硬件销毁违反了可用性，也可能违反完整性。违反机密性的行为包括：捕获网络流量、窃取密码文件、社会工程学、端口扫描、肩窥、窃听和嗅探。\n5.\
  \  **C**。违反机密性不仅限于直接的故意攻击。许多未经授权的敏感或机密信息泄露事件是由于人为错误、疏忽或无能造成的。\n6.  **D**。Disclosure\
  \ 不是 **STRIDE** 的要素。**STRIDE** 的要素包括：欺骗、篡改、抵赖、信息泄露、拒绝服务和权限提升。\n7.  **C**。数据、对象和资源的可访问性是可用性的目标。如果安全机制提供可用性，则数据、对象和资源极有可能可被授权主体访问。\n\
  8.  **C**。隐私是指保持可识别个人身份的信息机密，或防止可能造成伤害、尴尬或耻辱的信息泄露。隔离是将某物存放在偏僻位置。隐藏是隐瞒或防止泄露的行为。信息的任务关键程度是其关键性的衡量标准。\n\
  9.  **D**。用户应知晓电子邮件会被保留，但用于执行此操作的备份机制无需向其披露。\n10. **D**。所有权授予实体对其拥有的对象的完全能力和特权。获取所有权的能力通常授予操作系统中最强大的账户，因为它可用于绕过其他已实施的访问控制限制。\n\
  11. **C**。不可抵赖性确保活动或事件的主体无法否认该事件的发生。\n12. **B**。分层是按顺序部署多种安全机制。当安全限制按顺序执行时，它们会以线性方式依次执行。因此，单个安全控制的失效不会使整个解决方案无效。\n\
  13. **A**。防止对象的授权读取者删除该对象只是访问控制的一个例子，而非数据隐藏。如果你能读取一个对象，它就对你不是隐藏的。\n14. **D**。防止安全妥协是变更管理的主要目标。\n\
  15. **B**。数据分类方案的主要目标是根据分配的重要性和敏感度标签，将保护数据的过程正式化和分层化。\n16. **B**。大小不是建立数据分类的标准。对对象进行分类时，应考虑价值、生命周期和安全影响。\n\
  17.  **A**。军事（或政府）和私营部门（或商业）是两种常见的数据分类方案。\n18.  **B**。在列出的选项中，Secret 是最低级别的军事数据分类。请注意，标记为\
