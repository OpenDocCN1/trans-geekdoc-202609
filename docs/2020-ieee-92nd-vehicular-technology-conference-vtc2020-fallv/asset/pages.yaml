- pgno: 0
  md: '# # An-to-end Intelligent Network Resource Allocation in IoV: A Machine Learning
    Approach


    Afaq Muhammad, Tahla Ahmed Khan, Khizar Abbass, and Wang-Cheol Song *

    Department of Computer Engineering, Jeju National University, Jeju, South Korea

    phloio@jejunu.ac.kr *Corresponding Author


    **Abstract—** The increasing number of communicating vehicles every year brings
    changes for efficient resource allocation in IoV (Internet of Vehicles). With
    additions, many new services have been added to the vehicles, each requiring a
    unique set of resources. These services include live video streaming, navigation,
    and safety critical services for driving. Thus, vehicle technology is rapidly
    shifting towards the electric and green energy. Furthermore, due to the complexity
    of the service requirements in IoV, an efficient and intelligent resource allocation
    system is essential. To this end, this paper proposes a solution based on deep
    learning for resource orchestration while considering edge-computing infrastructure.
    Machine Learning (ML) has been used to manage network traffic at the edge, and
    IoV resource allocation is a core challenge.


    +   **Keywords—** Network Resource Allocation, Machine Learning, Orchestration,
    Edge, Core.


    # ## I. INTRODUCTION


    In recent years, many advancements in the field of IoV under the umbrella of 5G
    have been seen. It is not only limited to providing Quality of Service (QoS),
    but also includes providing service for a variety of services including vehicle
    communications. Shortly due to an increase in the number of vehicles and IoV devices,
    the amount of traffic is growing significantly. Furthermore, the traffic, device,
    and service is highly dependent on time and location [1]–3. Similarly, networking
    applications also follow a pattern of usage, so it must design networks that ensure
    optimized and efficient orchestration. However, we have to deal with each service
    efficiently and provide prioritized demands on location. Network slicing was introduced
    to meet such dynamic environment requirements and provides optimized resource
    allocation for every type of service [1].


    SDN (Software Defined Network) and NFV (Network Function Virtualization) were
    served to implement network orchestration. Firstly, virtualization was introduced
    and after cloud computing emerged, which resulted in NFV. SDN enabled programming
    for network and NFV allowed deployment of network services by running VNF (virtual
    function) technology. Hence, using such advancements can be orchestrated using
    software platforms to control and manage network resources [8].


    Section II of the paper covers related work in the field of networking and application
    of Machine Learning. Section III describes system design. Section IV presents
    components and Section V concludes the proposed work.


    # ## II. LITERATURE REVIEW


    This work covers aspects of the network framework to the physical layer. In the
    era of next-generation network new caused by demand for orchestration engine design
    and various approaches. Network automation is a hot topic and many methods have
    been proposed to it. This section elaborates related work on SDN, NFV for automated
    and optimized resource orchestration in next generations. This will also discuss
    researches on how ML can be effectively used to optimize resource allocation in
    networking using SDN and NFV. Besides Network slicing for serving services is
    the most prominent approach to manage multiple virtual resources over a single/generic
    physical infrastructure. Also, with advancements in networking technology, energy
    efficiency and optimization of resources is possible [12]'
