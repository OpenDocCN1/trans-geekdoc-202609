- pgno: 2
  md: '# Automated Slice Resource Control and Update Management System


    ![](img/61852a644a5d8f129e30aa26b234d145_2_0.png)


    The system considers management and update section for one-edge resource prediction
    and second for core network resource prediction and update. It is three-layered
    architecture where the top layer AS-CUMS manages the cross-domain resource orchestration.
    As it integrates ML, it has many benefits including proactive resource allocation,
    automatic scale-out, and dynamic update management.


    The second layer consists of orchestration mechanisms between edge orchestrator
    and core orchestrator. The third layer is the physical layer that contains hardware
    resources VNFs (Virtual Network Functions), and PNFs (Physical Network Functions)


    The working of the system is as follows, AS-CUMS is a central management system
    where End-to-end resource prediction can be automatically generated. The system
    uses three ML models, the first model is used for future prediction at edges based
    on the user stream traffic. At a central edge, the second model decides the resources
    that should be initiated at any physical resource location. Also, the third model
    is used to predict resource demand on time factor.


    The ML Model is based on resource utilization of the VMF and it predicts future
    demand to decide the scaling of specific types of VNF and answer service availability[25].


    The VM workload-prediction data set is used for this purpose. The configuration
    of resources is provided to both models and they deify future after the AS-CUMS
    updates


    resource templates for both the edge and core orchestrators. The new slices can
    be created, removed, or updated using the prediction results.


    The proposed system enhances the existing infrastructures by proposing the use
    of Machine Learning. By applying the system, the dynamic fluctuating requirements
    of resources can be catered more effectively. Also, resources are installed only
    when they are needed which avoids a lot of over-provisioning, thereby enabling
    energy efficiency. Besides, the ML model segment tracks the traffic and detects
    the types of applications used. The network slices in the case of NFV environment
    especially require a mechanism that can orchestrate network service template with
    the dynamic optimization. This mechanism means dynamic orchestration and scaling
    of network services with automation[25][28][33].


