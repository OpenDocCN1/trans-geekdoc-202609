    # III. SYSTEM ARCHITECTURE AND WORKING


    The development of SDN and NFV based platforms enables configuration of networks.
    The proposed system takes full leverage of SDN and NFV platform and enables the
    resource orchestration. The system shown in figure 1 illustrates the ML-based
    architecture and resource allocation for both the edge and core networks in IoV
    traffic. Where Automated Slice Control and resource management system (AS-CURMS)
    from the top layer controls End-to-end resource provisioning through the template
    generation [25].'
