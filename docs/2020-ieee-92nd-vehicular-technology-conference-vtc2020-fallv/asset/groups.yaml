    | ARIMA | 0.71 | 0.60 |


    # VI. CONCLUSION AND FUTURE WORK


    The ASR-CUMS contains two ML models, the first model is for the edge based on
    user traffic traffic prediction and it can identify if any type of traffic can
    be cached in the future and hence enhancing the service quality. The second model
    is for the cloud which shows the design of this model and it working. This model
    taking traffic as input and predicts future traffic utilization. It also uses
    the input of traffic-traffic samples from each edge to predict the future traffic
    to be enabled at the edge network due to unreliability of services at an edge
    location [18]–20].


    The second model for core based on the RNN works which predicts workload prediction
    and future utilization. Since data is available we use open cloud data our goal
    is to predict VM resource utilization and it. Table 1 describes the dataset used
    collected from an operation environment named Materna 3. This Data-set belongs
    to a core located from a German cloud provider and it has three traces that were
    collected over three months and each trace has data of VM values on [25].


    This paper proposes an automated resource management mechanism for an edge and
    cloud-based IoT. The goal is to optimize the resource allocation using the ML
    approach, which the model retrieves current resource utilization and updates systems
    for the future. The results of ML models are used by ASR-CUMS to decide the placement
    of architecture and predict future resources. Hence, due to the architecture and
    nature of traffic inherits many features to the system, including energy-efficient
    resource allocation, better service providing out of edge services that have challenges,
    especially in case of IoT scaling. Future work includes the creation of a dataset
    from a real-time test-bed for the ML model, and demonstration of the optimization
    achieved through the proposed implementation.


