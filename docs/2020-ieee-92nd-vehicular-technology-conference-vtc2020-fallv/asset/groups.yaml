    # Automated Slice Resource Control and Update Management System


    ![](img/61852a644a5d8f129e30aa26b234d145_2_0.png)


    The system considers management and update section for one-edge resource prediction
    and second for core network resource prediction and update. It is a three-layered
    architecture where the top layer AS-CUMS manages the cross-domain resource orchestration.
    As it integrates ML, it has many benefits including proactive resource allocation,
    automatic scale-out, and dynamic update management.


    The second layer consists of orchestration mechanisms between edge orchestrator
    and core orchestrator. The third layer is the physical layer that contains hardware
    resources VNFs (Virtual Network Functions), and PNFs (Physical Network Functions).


    The working of the system is as follows: AS-CUMS is a central management system
    where End-to-end resource prediction can be automatically generated. The system
    uses three ML models: the first model is used for future prediction at edges based
    on the user stream traffic. At a central edge, the second model decides the resources
    that should be initiated at any physical resource location. Also, the third model
    is used to predict resource demand on time factor.


    The ML Model is based on resource utilization of the VMF and it predicts future
    demand to decide the scaling of specific types of VNF and answer service availability
    [25].


    The VM workload-prediction data set is used for this purpose. The configuration
    of resources is provided to both models and they define future after the AS-CUMS
    updates resource templates for both the edge and core orchestrators. The new slices
    can be created, removed, or updated using the prediction results.


    The proposed system enhances the existing infrastructures by proposing the use
    of Machine Learning. By applying the system, the dynamic fluctuating requirements
    of resources can be catered more effectively. Also, resources are installed only
    when they are needed which avoids a lot of over-provisioning, thereby enabling
    energy efficiency. Besides, the ML model segment tracks the traffic and detects
    the types of applications used. The network slices in the case of NFV environment
    especially require a mechanism that can orchestrate network service template with
    the dynamic optimization. This mechanism means dynamic orchestration and scaling
    of network services with automation [25][28][33].


    ## IV. SYSTEM COMPONENTS


    ## A. AS-CUMS


    Figure 1 illustrates the architecture of AS-CUMS as it has three major components:
    the Machine Learning Models for edge and core, the architecture and resource template.


    Figure 1: The architecture in an abstract view.


    As different NFV orchestrators are available where each requires its template
    for providing and updating resource definitions. In our system, we have to create
    and update resource templates that are responsible for the requirements. Figure
    2 shows the internal mechanism of the template generator, a template database
    that stores template design and resources which requires templates [25]. Secondly,
    we have two modules for core and one for the edge based on the predictions which
    request the template generator to update the system.


    Firstly, data we preprocessed applied averaging window to minimize redundancy
    with a window size of 30.


    ## V. RESULTS AND DISCUSSION


    Many machine learning works the VM workload prediction and each has its merits
    and demands. ARIMA is the most famous model, but in this case, we found review
    of ML approaches and their effectiveness for VM prediction is given in [16:17].
    In this case, comparison of RNN (recursive neural network) and ARIMA are as follows:


    ![](img/61852a644a5d8f129e30aa26b234d145_3_0.png)


    Figure 2: It illustrates the design of the Template Generator.


    | Model | Train Accuracy | Test Accuracy |

    |---|---|---|

    | RNN | 0.891 | 0.876 |

    | ARIMA | 0.71 | 0.60 |


    ## VI. CONCLUSION AND FUTURE WORK


    The ASR-CUMS contains two ML models: the first model is for the edge based on
    user traffic prediction and it can identify if any type of traffic can be cached
    in the future and hence enhancing the service quality. The second model is for
    the cloud which shows the design of this model and its working. This model taking
    traffic as input and predicts future traffic utilization. It also uses the input
    of traffic-traffic samples from each edge to predict the future traffic to be
    enabled at the edge network due to unreliability of services at an edge location
    [18]–20].


    The second model for core based on the RNN works which predicts workload prediction
    and future utilization. Since data is available we use open cloud data our goal
    is to predict resource utilization. Table 1 describes the dataset used from an
    operation environment named Materna, which has three traces that were collected
    over three months [25]. This paper proposes an automated resource management mechanism
    for edge and cloud-based IoT. The results of ML models are used by ASR-CUMS to
    decide the placement of services. Hence, due to the architecture and nature of
    traffic, future work includes the creation of a real-time testbed and demonstration
    of optimization achieved through proposed implementation.


