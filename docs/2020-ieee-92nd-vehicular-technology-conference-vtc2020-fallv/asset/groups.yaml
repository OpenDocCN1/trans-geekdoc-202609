    # 自动化切片资源控制与更新管理系统


    ![](img/61852a644a5d8f129e30aa26b234d145_2_0.png)


    该系统考虑了边缘资源预测的管理与更新部分，以及核心网络资源的预测与更新部分。它采用三层架构，顶层 AS-CUMS 负责跨域资源编排。由于它集成了机器学习（ML），因此具有许多优势，包括主动资源分配、自动扩缩容和动态更新管理。


    第二层由边缘编排器与核心编排器之间的编排机制组成。第三层是物理层，包含了硬件资源 VNFs（虚拟网络函数）和 PNFs（物理网络函数）。


    系统的工作原理如下：AS-CUMS 是一个中央管理系统，可以自动生成端到端的资源预测。系统使用了三个机器学习模型：第一个模型用于根据用户流流量对边缘进行未来预测；在中央边缘，第二个模型决定在任何物理资源位置应该启动资源；此外，第三个模型用于预测随时间变化的资源需求。


    该机器学习模型基于 VMF 的资源利用率，并预测未来需求以决定特定类型 VNF 的扩展规模，并回答服务可用性问题 [25]。


    虚拟机（VM）负载预测数据集用于此目的。资源配置被提供给两个模型，在 AS-CUMS 更新边缘和核心编排器的资源模板后，它们定义了未来的状态。可以使用预测结果创建、删除或更新新的切片。


    所提出的系统通过引入机器学习增强了现有基础设施。通过应用该系统，可以更有效地应对动态波动的资源需求。此外，资源仅在需要时才安装，这避免了大量的过度配置，从而实现了能源效率。此外，机器学习模型部分跟踪流量并检测所使用的应用程序类型。在
    NFV 环境中，网络切片特别需要一种能够动态优化编排网络服务模板的机制。这种机制意味着通过自动化实现网络服务的动态编排和扩缩容 [25][28][33]。


    ## IV. 系统组件


    ## A. AS-CUMS


    图 1 展示了 AS-CUMS 的架构，它包含三个主要部分：用于边缘和核心的机器学习模型、架构和资源模板。


    图 1：抽象视图下的架构。


    由于存在不同的 NFV 编排器，每个编排器都需要其模板来提供和更新资源定义。在我们的系统中，我们必须创建并更新负责这些要求的模板。图 2 显示了模板生成器的内部机制、存储模板设计和需要模板资源的模板数据库
    [25]。其次，我们有两个基于预测的边缘模块和一个边缘模块，它们请求模板生成器更新系统。


    首先，我们对预处理的数据应用平均窗口，窗口大小为 30，以最小化减少冗余。


    ## V. 结果与讨论


    许多机器学习工作涉及虚拟机负载预测，每个工作都有其优点和要求。ARIMA 是最著名的模型，但在情况下，我们发现关于机器学习方法及其对虚拟机预测有效性的综述见
    [16:17]。在这种情况下，RNN（递归神经网络）和 ARIMA 的比较如下：


    ![](img/61852a644a5d8f129e30aa26b234d145_3_0.png)


    图 2：它说明了模板生成器的设计。


    | 模型 | 训练准确率 | 测试准确率 |

    |---|---|---|

    | RNN | 0.891 | 0.876 |

    | ARIMA | 0.71 | 0.60 |


    ## VI. 结论与未来工作


    ASR-CUMS 包含两个机器学习模型：第一个模型是基于用户流量预测的边缘模型，它可以识别未来是否有任何类型的流量可以缓存，从而提高服务质量。第二个模型用于云端，展示了该模型的设计及其工作。该模型将流量作为输入并预测未来的流量利用率。它还利用来自每个边缘的流量流量样本输入，由于边缘位置服务的不可靠性，预测在边缘网络中开启的未来流量
    [18]–20]。


    核心的第二个模型基于 RNN 工作，预测负载预测和未来利用率。由于数据可用，我们使用开源云数据，目标是预测资源利用率。表 1 描述了来自名为 Materna
    的运行环境的数据集，该环境包含了三个月的三个轨迹 [25]。本文提出了一种基于边缘和云的 IoT 自动化资源管理机制。ASR-CUMS 使用机器学习模型的结果决定服务的部署。因此，由于架构和流量的性质，未来工作包括建立实时测试平台，并演示通过提议实现的优化。


