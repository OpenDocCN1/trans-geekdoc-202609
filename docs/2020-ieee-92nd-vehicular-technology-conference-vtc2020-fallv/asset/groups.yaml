    Firstly, Data we preprocessed we applied averaging window to minimize redundancy
    with a window size of 30.


    # V. RESULTS AND DISCUSSION


    Many Machine learning works the VM workload prediction and each has its merits
    and demands. ARIMA is the most famous models, but in this case, we found review
    of ML approaches and their effectiveness for VM prediction is given in [16:17].
    In this case, comparison of RNN (recursive neural network) and ARIMA are as follows:


