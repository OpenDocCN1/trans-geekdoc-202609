    ## 一种基于红外成像和机器学习的气溶胶喷射打印传感器新型质量检测方法


    Seung Ki Moon^a, Nicholas Poh Huat Ng^a, Lequn Chen^a, Dong-Gyu Ahn (2)^b,*


    a 南洋理工大学机械与航空航天工程学院，639793，新加坡

    b 朝鲜大学机械工程系，朝鲜大吉146号（世宿洞），东区，光州，61452，大韩民国


    ## 文章信息


    文章历史：

    可在线获取 2023年4月26日


    关键词：

    - 增材制造

    - 气溶胶喷射

    - 红外成像

    - 机器学习

    - 质量检测


    ## 摘要


    气溶胶喷射打印（AJP）工艺打印的电子传感器的质量由于AJP工艺再现性不足而难以保证。本文提出了一种新型质量检测方法，利用红外成像和机器学习识别AJP工艺打印传感器上的缺陷。在施加电流时，通过红外成像估计打印线路上具有高温分布的潜在缺陷区域。需要修复的区域由机器学习算法识别。最后，通过修复实验验证了所提方法的适用性。

    © 2023 CIRP. 由Elsevier Ltd出版。保留所有权利。


    ## 1. 引言


    气溶胶喷射打印（AJP）工艺，也称为气溶胶喷射沉积工艺，是一种非接触式增材制造技术 [1]。AJP工艺利用气体中悬浮颗粒的细雾，即气溶胶，在基底上沉积精确均匀的材料层
    [1]。该工艺可生产分辨率高、特征尺寸小至10 µm的三维（3D）结构 [2]。AJP具有广泛的应用，包括微机电系统（MEMS）、电路板、太阳能电池的生产，以及在多种材料中创建复杂图案和结构，包括有机半导体、陶瓷和碳纳米管
    [3–7]。它还被用于PCB走线和平板显示器的修复 [8]。


    尽管AJP具有优势，工艺漂移阻碍了该技术的采用。工艺漂移是指在工艺参数未改变的情况下，打印线形貌随时间变化的现象。在本例中，它是由打印过程操作条件逐渐变化引起的。这种条件变化可归因于多种因素。例如，在打印过程中，墨水颗粒在被载气携带时与壁面碰撞。这些颗粒粘附在壁面上且未沉积，影响沉积速率。此类颗粒的堆积可能导致喷嘴堵塞，进一步导致沉积速率偏差
    [9]。工艺漂移影响气溶胶喷射打印工艺的可重复性。因此，尽管使用相同的材料和工艺参数，打印电子传感器的厚度仍可能沿其几何形状随机变化，影响其电性能。


    机器学习（ML）方法目前正被用于评估不同AM工艺中的质量。例如，基于视觉的在线监测系统可用于检查表面质量和检测

    选择性激光熔化（SLM）和定向能量沉积（DED）中的内部缺陷 [10–13]。由机器学习驱动的自动检测系统消除了耗时的人工检测需求，同时为闭环质量保证铺平了道路。然而，由于AJP系统中可捕获的工艺信息有限，在AJP中实施自动质量检测系统具有挑战性。然而，针对AJP工艺打印传感器的机器学习辅助自动质量检测系统的研究几乎尚未开展。


    本研究利用热特性和电流研究打印传感器的质量。本研究的目的是提出一种新型质量检测方法，利用红外成像和机器学习方法识别AJP工艺打印传感器上的缺陷。在施加电流时，通过红外成像估计打印线路上具有高温分布的潜在缺陷区域。需要修复的区域由机器学习算法识别。最后，通过修复实验验证了所提方法的适用性。


    ## 2. 方法与特征


    所提气溶胶喷射打印传感器质量检测与修复方法的整体流程如图1和图2所示。传感器由Optomec的AJ5X气溶胶喷射打印机打印，如图1(a)示意图所示。墨水由水浴和冷却器保持在25
    °C。超声波换能器将墨水颗粒雾化成气溶胶云。载气流，即氮气，夹带气溶胶化墨水并将其输送至虚拟冲击器，其中多余的载气被分流，从而浓缩墨水颗粒。气溶胶流随后流向打印头。在那里，鞘气包裹墨水，形成墨水颗粒的准直流。聚焦的气溶胶墨水会撞击基底并沉积墨水颗粒。基底为聚酰亚胺薄膜，所用喷嘴的孔径为200
    µm。AJP工艺的可调参数包括鞘气流量、载气流量、雾化器电流、打印速度（即平台移动速度，因为打印头是静止的）。打印线特征还受墨水粘度、基底特性、打印头配置等因素的影响。


    传感器打印后，在实验室炉中烧结


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_1_0.png)


    图1. 利用热成像和机器学习的气溶胶喷射打印传感器质量检测与修复方法框架：（a）AJP的工作原理，（b）利用热图像进行质量检测的设置，（c）利用热图像分析和SVM识别缺陷点，（d）重新沉积材料修复缺陷点。


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_1_1.png)


    图2. 基于热成像的气溶胶喷射打印传感器所提质量检测与修复方法流程图。


    30分钟，温度为180 °C。然后涂覆银导电环氧树脂将一些导线连接到传感器的接触焊盘。这些导线随后连接到直流电源，在该电源上向传感器施加0.1 A电流，如图1(b)所示。InfraTec的VarioCAM
    HD Head 600热成像相机用作热成像相机，用于捕获电流通过传感器引起的加热过程中的热数据。通过打印传感器的电流可产生热量，受以下方程支配：


    ```

    P = I²R

    ```


    其中P、I和R分别为打印传感器中产生的功率、通过打印传感器的电流和传感器的局部电阻。功率增加时，会产生额外的热能，温度升高。表现出电阻增加的缺陷区域会比正常线路更快地被加热。因此，它可以通过红外热成像观察到。图1(c)描绘了红外相机记录的所提热成像图，显示了潜在的缺陷点和线路。为了进一步评估打印传感器的质量，随后将其置于共聚焦显微镜下以检查打印线的形貌。可以从显微镜图像中获取关键质量指标，如线宽、高度和横截面积。然后利用机器学习（ML）将其与热成像图像中相关区域的温度值关联起来。


    同时，共聚焦显微镜用于检查打印线的实际质量。热成像图像被发送到监督机器学习模型以预测缺陷点的位置，后续由显微镜质量检测结果确认。预测的缺陷位置将反馈给AJP机器进行缺陷校正，如图1(d)所示。整个过程持续进行，直至零件完成。


    在本研究中，支持向量机（SVM）算法用于区分缺陷热图像和非缺陷图像，如图3所示。SVM算法是一种监督机器学习算法，可用于分类和回归任务。SVM背后的主要思想是在特征空间中找到最佳边界，即超平面，以分离不同类别。为实现此目的，SVM将输入数据映射到更高维空间，即核空间，在该空间中可找到线性边界。映射使用称为核的数学函数完成，核可以是线性、多项式或径向基函数（RBF）。


    在利用温度值预测气溶胶喷射打印线高度的背景下，SVM用作分类器。该过程涉及在包含温度值和对应线高度的数据集上训练模型，然后使用训练好的模型根据新数据点的温度值预测其线高度。预测的准确性可使用精确率、召回率和F1分数等指标进行评估。使用SVM完成此任务的预期结果是高准确性以及对噪声和高维数据的鲁棒性。此外，SVM是处理非线性可分数据的强大工具，这在许多现实世界数据集中很常见。选择合适的核函数，如RBF，可通过捕捉特征之间复杂的非线性关系来改善模型结果。因此，SVM是利用温度值预测气溶胶喷射打印线质量的合适选择，因为它可以提供准确且鲁棒的预测。其处理非线性可分数据和对噪声的鲁棒性使其非常适合此任务。此外，使用合适的核函数可以提高模型性能。


    应用SVM分类模型区分缺陷热成像与非缺陷热成像的整个工作流程如图3所示。训练数据由从整幅图像中提取的热图像的小段组成。SVM分类器预测质量结果。质量标签的真实值通过前面提到的共聚焦显微镜图像获得，其中打印线的高度指示电


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_1_2.png)


    图3. 应用SVM算法进行缺陷预测的工作流程。（有关本图图例中颜色引用的解释，请参阅文章的网络版。）

