    # ABSTRACT


    The quality of printed electronic sensors by aerosol jet printing (AJP) process
    is hard to guarantee due to an insufficient reproducibility of the AJP process.
    This paper proposes a novel quality inspection method to identify defects on the
    printed sensor by AJP process using infrared imaging and machine learning. Potentially
    defective regions with high temperature distributions on printed lines are estimated
    from the infrared imaging when the current is applied. Demanded regions for the
    repair are identified by a machine learning algorithm. Finally, the applicability
    of the proposed method has been demonstrated by repair experiments.

    © 2023 CIRP. Published by Elsevier Ltd. All rights reserved.


    # 1. Introduction


    Aerosol jet printing (AJP) process, also known as aerosol jet deposition process,
    is a non-contact additive manufacturing technique [1]. The AJP process utilizes
    a fine mist of suspended particles in a gas, called an aerosol, to deposit precise
    and uniform layers of material onto a substrate [1]. This process can produce
    high resolution, three-dimensional (3D) structures with feature sizes as small
    as 10 µm [2]. AJP has a wide range of applications, including the production of
    microelectromechanical systems (MEMS), circuit boards, solar cells, as well as
    for the creation of intricate patterns and structures in a variety of materials,
    including organic semiconductors, ceramics, and carbon nanotubes [3–7]. It has
    also been used for the repair of PCB traces and flat panel displays [8].


    Despite the advantages of AJP, adoption of the technology is hindered by process
    drift. The process drift is a phenomenon where the printed line morphology can
    vary over time, despite no change in the process parameters. In this case, it
    is caused by a gradual shift in operating conditions of the printing process.
    Such a shift in conditions can be attributed to several factors. For example,
    ink particles collide with the walls while being carried by the carrier gas during
    printing. These particles adhere to the walls and do not get deposited, affecting
    the deposition rate. Buildup of such particles can lead to clogging of the nozzle,
    causing further deviation of the deposition rate [9]. Process drift affects the
    repeatability of the aerosol jet printing process. Thus, despite using the same
    materials and process parameters, the thickness of a printed electronic sensor
    can vary stochastically along its geometry, affecting its electrical properties.


    Machine learning (ML) approaches are currently being used to assess quality in
    different AM processes. A vision-based online monitoring system, for example,
    can be used to examine surface quality and detect


    internal defects in selective laser melting (SLM) and directed energy deposition
    (DED) [10–13]. The ML-powered automated inspection system eliminates the need
    for time-consuming human inspections while also paving the way for closed-loop
    quality assurance. However, because of the limited process information that can
    be captured in the AJP system, implementing an automated quality inspection system
    in AJP is challenging. However, the research on ML-assisted automated quality
    inspection system for the printed sensor by AJP process has hardly been performed
    yet.


    This research investigates the quality of printed sensors using thermal properties
    and a current. The objective of this research is to propose a novel quality inspection
    method for identifying defects on the printed sensor by AJP process using infrared
    imaging and a machine learning approach. Potentially defective regions with high
    temperature distributions on printed lines are estimated from the infrared imaging
    when the current is applied. Demanded regions for the repair are identified by
    a machine learning algorithm. Finally, the applicability of the proposed method
    has been demonstrated by repair experiments.


    # 2. Methodology and features


    A whole procedure of the proposed quality inspection and repair method for aerosol
    jet printed sensor is shown in Figs. 1 and 2. The sensor is printed by the AJ5X
    aerosol jet printer from Optomec, as illustrated by the schematic diagram in Fig.
    1(a). The ink is maintained at 25 °C by the water bath and a cooler. The ultrasonic
    transducer atomizes the ink particles into an aerosol cloud. The carrier gas stream,
    which is nitrogen gas, entrains the aerosolized ink and carries it to the virtual
    impactor, where excess carrier gas is diverted away, concentrating the ink particles.
    The aerosol stream then travels to the print head. There, the sheath gas enwraps
    the ink, forming a collimated stream of ink particles. The focused ink aerosol
    would impact the substrate and deposit the ink particles. The substrate is a polyimide
    film and the nozzle used has a 200 µm diameter orifice. The'
