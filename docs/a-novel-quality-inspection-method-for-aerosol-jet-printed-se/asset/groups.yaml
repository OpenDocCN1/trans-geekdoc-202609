    a hyperplane, that separates the different classes in the feature space. To achieve
    this, SVM maps the input data into a higher dimensional space, called the kernel
    space, where a linear boundary can be found. The mapping is done using a mathematical
    function called a kernel, which can be linear, polynomial, or radial basis functions
    (RBF).


