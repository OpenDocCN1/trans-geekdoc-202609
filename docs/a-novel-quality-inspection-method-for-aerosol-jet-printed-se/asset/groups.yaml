    AJP 机器进行修复过程。修复完成后，可实现理想质量，受损传感器可恢复与非缺陷传感器相同的功能，节省时间和制造成本。此外，采用所提出的机器学习辅助缺陷检测方法，整个过程以闭环方式进行，而非传统的开环设置。采用所提出的方法，可通过迭代检查、修复和改进来保证质量，效率大幅提高，浪费减少（例如，缺陷传感器无需丢弃）。预测缺陷的位置由显微镜图像确认。印刷线的异常高度指示缺陷点。传感器将被送回机器进行修复。AJP
    将重新沉积材料以校正受损区域。


    图 3 中，印刷传感器上观察到相对温度分布较高的热点，如图 5 所示。这归因于对应热点的印刷传感器电电阻局部增大。


    图 6 显示了附近的印刷线形成


    ## 3. 实验程序


    用于实验的 AJP 工艺印刷传感器为典型的应变计，如图 4 所示。图 4(a) 和 4(b) 分别显示了印刷传感器的设计和制造形状。


    传感器使用 Optomec 的 AJ5X 气溶胶喷射打印机打印。


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_2_0.png)


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_2_1.png)


    图 4. AJP 工艺印刷应变计：（a）传感器设计和（b）印刷传感器。


    所用墨水为 NovaCentrix Metalon JS-B25P，即水性溶剂中银纳米颗粒的悬浮液。墨水由水浴和冷却器保持在 25 °C。超声波换能器将墨水颗粒雾化成气溶胶云。载气流为氮气，夹带气溶胶化墨水并将其带到虚拟冲击器，在那里多余的载气被分流，浓缩墨水颗粒。气溶胶流随后流向打印头。鞘气包裹墨水形成准直的墨水颗粒流。聚焦的墨水气溶胶会撞击基底并沉积墨水颗粒。基底为聚酰亚胺薄膜，所用喷嘴的孔径为
    200 μm。传感器打印后，在实验室炉中于 180 °C 下烧结 30 分钟。然后涂覆银导电环氧树脂以将一些导线连接到传感器的接触焊盘。这些导线随后连接到直流电源，其中向传感器施加
    0.1 A 电流。


    InfraTec 的 VarioCAM HD Head 600 热成像相机用作热成像相机，用于在电流通过传感器引起的加热过程中捕获热数据。然后将传感器置于
    Keyence 的共聚焦显微镜下以检查印刷线的形貌。


    ## 4. 结果与讨论


    ### 4.1. 缺陷区域预测


    图 5 显示了电流流入传感器期间印刷传感器的热成像图。该图像由红外相机捕获。与非缺陷传感器的热图像不同


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_2_2.png)


    图 5. 具有缺陷区域的传感器的热成像图。


    热点。图像由共聚焦显微镜获得。通过比较图 5 和图 6(a)，注意到三个不同的印刷线包含在热点中。图 6(b) 和 (c) 显示了包括热点在内的三个不同印刷线的高度分布。不同印刷线的高度在
    8.0–10.0 μm 范围内。不同印刷线的高度小于其他区域的高度。从该结果推断，热点的横截面积低于其他区域。基于上述结果，认为由不同印刷线横截面积减小引起的电电阻增大，会增加热点附近的温度。


    在本研究中，热点被假定为潜在的缺陷区域。具有缺陷区域的热图像可用于评估印刷传感器的质量，然后转移到 SVM 的训练数据以识别缺陷区域。


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_2_3.png)


    图 6. 使用共聚焦显微镜对缺陷区域的印刷线成像：（a）光学图像（50 倍），（b）激光扫描图像和（c）印刷线的高度分布。


    ### 4.2. 缺陷区域修复


    为修复具有缺陷区域的印刷传感器，使用 AJP 工艺在传感器的缺陷区域沉积额外材料。在电流流入修复后的传感器期间，传感器的温度分布由热成像相机研究。图 7 显示了修复后传感器的热成像图。先前具有相对较高温度分布的缺陷区域已修复，显示出均匀的温度分布。缺乏热点表明没有来自材料低电阻的局部热生成，表明缺陷区域的横截面积已增大。均匀的温度分布表明印刷线具有均匀的横截面积和电电阻。从该结果可知，印刷传感器的缺陷区域已通过所提出的检查和修复方法得到适当修复。


    修复后的传感器由共聚焦显微镜观察，如图 8 所示。通过比较图 6(c) 和图 8(b)，观察到印刷传感器的线平均高度通过印刷传感器的修复从 8.0 至 10.0
    μm 增加到 14–16 μm。印刷线中缺陷区域高度的增加导致这些区域的横截面积增加，从而修复缺陷区域。从这些结果可以看出，通过修复传感器额外沉积的材料降低了印刷传感器的电电阻。


    实验结果表明，所提出的方法具有识别缺陷区域以通过修复印刷传感器提高印刷传感器质量的能力。


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_3_0.png)


    图 7. 无任何缺陷区域的修复后传感器的热成像图。（为了解释本文中对该图图例中颜色的引用，请参阅本文的网络版。）


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_3_1.png)


    图 8. 使用共聚焦显微镜对无任何缺陷区域的修复后传感器的印刷线成像：（a）激光扫描图像和（b）印刷线的高度。（为了解释本文中对该图颜色的引用，请参阅本文的网络版。）


    ## 5. 结论


    提出了一种使用红外成像和机器学习方法的新型质量检查方法，以识别 AJP 工艺印刷传感器中的缺陷区域。通过对共聚焦显微镜图像的分析，发现由缺陷区域横截面积减小引起的电电阻增大导致热点温度升高。热点被假定为潜在的缺陷区域。采用支持向量机算法区分缺陷和非缺陷区域。通过使用
    AJP 工艺在缺陷区域沉积额外材料修复了缺陷印刷传感器。对修复后传感器的温度分布和形成进行了检查。从检查结果来看，具有相对较高温度分布的缺陷区域被消除。此外，还发现修复区域的高度和横截面积恢复到非缺陷印刷线的水平。基于上述结果，表明
    ML 辅助质量检查和闭环质量增强框架可以提高 AJP 工艺印刷传感器的质量。


    未来需要收集额外数据以改进所应用的机器学习算法，所收集的数据将被纳入 AJP 装置中的反馈控制系统，以便检测和自动修复缺陷。


