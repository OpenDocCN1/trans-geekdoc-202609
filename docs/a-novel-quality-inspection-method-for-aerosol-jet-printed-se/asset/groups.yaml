    ## 5. Conclusions


    A novel quality inspection method using infrared imaging and a machine learning
    approach was proposed to identify the defective regions in the printed sensor
    by AJP process. From the analysis of the confocal microscope images, it was revealed
    that the increased electric resistance, which was induced by the reduced cross-sectional
    area of the defective region, causes increase in temperature at the hot spots.
    The hot spots were assumed to be potentially defective regions. A support vector
    machine algorithm was adopted to differentiate defective and non-defective regions.
    The defective printed sensor was repaired through the deposition of additional
    material on the defective region using the AJP process. The temperature distribution
    and formation of the repaired sensor were examined. From the results of the examination,
    it was demonstrated that the defective region with a relatively higher temperature
    distribution was eliminated. In addition, it is revealed that the height and the
    cross-sectional area of the repaired region were recovered to those of non-defective
    printed lines. Based on the above results, it was shown that ML-assisted quality
    inspection and closed-loop quality enhancement framework can improve the quality
    of the printed sensor by the AJP process.


    In the future, additional data collection is needed to improve the applied machine
    learning algorithm, and the data collected will be incorporated into a feedback
    control system in the AJP apparatus, such that defects can be detected and automatically
    repaired.


