    # 4. Results and discussion


    # 4.1. Prediction of defective regions


    Figure 5 shows the thermographic image of the printed sensor during flowing current
    into the sensor. The image is captured from the infrared camera. Unlike thermal
    images of non-defective sensors


    ![](img/66c56d2f673c4ec909c972f118c5aaf4_2_2.png)


    Fig. 5. Thermographic image of the sensor with defective regions.


    hot spots. The images are obtained from a conformal microscope. Through the comparison
    of Fig. 5 and Fig. 6(a), it is noted that three distinct printed lines are included
    in the hot spot. Fig. 6(b) and (c) show the height distributions of the three
    distinct printed lines including the hot spot. The height of the distinct printed
    lines lies in the range of 8.0–10.0 μm. The height of the distinct printed lines
    is smaller than that of the other regions. From this result, it is analogized
    that the cross-sectional area of the hot spot is lower than that of the other
    regions. Based on the above results, it is considered that the increased electric
    resistance, which is induced by the reduced cross-sectional area of the distinct
    printed lines, augments the temperature in the vicinity of the hot spot.


