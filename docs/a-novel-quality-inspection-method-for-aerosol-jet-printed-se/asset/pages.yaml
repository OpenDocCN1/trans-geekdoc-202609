    camera. Fig. 7 shows thermographic images for the repaired sensor. The previously
    defective regions with relatively higher temperature distributions are repaired,
    displaying uniform temperature distribution. The lack of hot spots shows that
    there is no localized heat generation from low resistance of the material, indicating
    the cross-sectional area of the defective region has increased. The uniform temperature
    distribution shows that the printed lines have uniform cross-sectional area and
    electric resistance. From this result, it is revealed that the defective region
    of the printed sensor is properly repaired by the proposed inspection and repair
    method.


