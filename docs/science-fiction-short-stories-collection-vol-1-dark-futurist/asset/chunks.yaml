  trans: '


    夜色迅速笼罩了城市，但恐惧依然挥之不去，宛如一层浓重的雾雾，让人无法呼吸。天空中的明光已经消失，但它们存在过的回响仍在街道上、在人们的脑海中、在他们的交谈中回荡。早已在恐慌与着迷之间挣扎的人群开始无目的地移动，仿佛他们的脚正被拉向那个未知的领域。


    ### 混沌爆发


    第一声尖叫很快接而至。混乱在城市的一个主要广场爆发了。人群中，有些人脸色苍白，双眼惊恐地张大着，他们开始奔跑，毫无缘故地互相推搡。恐惧在不确定性的助长下，像干地上的火一样蔓延开。那些曾惊奇注视天空的人，现在转过头寻找着，或许是在寻找一个躲避的地方，一个能让他们避开从地平线降临的任何东西的避难所。


    警察警报声开始回响，那声音听起来很遥远，仿佛整个世界都与它所知的一切隔绝了。然而，在这一切之中，仍有人没有动弹。最勇敢的或最天真的那些——他们自己还不知道——但他们都有着同样的感受：一种贪婪的好奇心将他们定在原地。仿佛通过仰望天空，他们就能揭示即将发生什么。也许是答案。也许是某种完全不同的东西。


    ### 崩塌的世界


    这座城市通常是持续活动的繁杂织体，现在感觉却像一个即将爆炸的压力锅。当一些人跑回家里关上门窗时，另一些人留下来凝视着，仿佛被催眠了一样。街道上聚集成群——有的拿着手机，有的拿着相机——都在试图捕捉某种东西，捕捉某种尽管他们并不理解，但似乎重要到无法忽视的东西。空气中弥漫着恐惧与着迷交织的奇特氛围，仿佛是一场没有人都无法移开视线的恐怖电影。


    随着夜色加深，科技开始失效。最先发现问题的是那些最依赖设备的人：年轻人、工人、以及那些手机不离手的人。曾经充斥着各种理论、信息和目击视频的社交媒体开始崩溃。应用程序停止运行，信息发送失败，贴文被困在冻结服务器的
    limbo 状态中。在街道上，手机——这些让我们与世界保持连接的设备——开始一个接一个，仿佛某种无形的力量决定让它们沉默。


    ### 偏执症与不确定性


    但最令人不安的是接下来发生的事情。


    随着技术中断，偏执症开始涌动。此前被屏幕分散注意力的人们开始说更多，辩论得更加激烈。阴谋论倍数增加，这场风暴无法阻挡。“无疑是政府。他们在控制我们；他们不想让我们知道发生了什么，”一个男人焦躁地说道，指着城市里漆黑的灯光。其他人眼中闪烁着恐惧，推测着外星人的意图：“它们在观察我们。它们来是为了征服我们。这只是时间问题。”在低声细语中，许多人小声重复着每个人心中都在想的一件事，尽管没有人敢大声说：如果它们正在等我们呢？


    官方新闻现在变得匮乏，试图维持冷静，但即使是他们——记者们——似乎也所不从心。唯一的确定就是不确定。灯光没有停止，但它们的意义仍然是一个谜。紧急热线被满了；为潜在灾难做好准备的医院，现在接收着陷入恐慌的个体——他们是恐惧的受害者，而非任何身体受伤。没有人知道是否真的存在威胁。唯一的确定是恐惧——那种迫使我们向天空仰望，并好奇我们生活之外存在着什么的原始恐惧。


    随着恐惧的倍增，好奇心依然完好无损。在混乱之中，仍有人靠近窗户，从阳台探出身来，望向天空，寻找着他们无法识别的东西。在那片留下的虚空中带有一种磁性，某种东西以一种不可阻拒的力量将他们吸引。而正是那片虚空，悖论地让他们留在了那儿，站着，观察着，寻找答案。他们无法移开眼睛，因为在脑海深处的某个黑暗角落里，他们知道天空正在挑战着他们。


    ### 降临


    突然，在寂静的深夜，城市分成了了。有些人恐惧地躲起来，等待最坏的情况发生。另一些人留在外面，抬起目光，寻找迹象，寻找某种能够解释不可解释之物的东西。每个人在地方都在想同一件事：有些事情快要发生了。而那件事虽然令他们恐惧，但也让他们活了下来——带着一种奇异的希望，也许这次与未知的遭遇并非终结，而是某种远大事物的开始。


    时钟指向晚上 11:47，事情发生了。第一艘船出现在地平线上，缓慢从云层中浮现，像一头捕食者冷静地接近猎物。没有预警，没有声音，空气中没有移动的痕迹。它就那样悬浮在那里，带着一种无法忽视的存在感。


    它是如此巨大。其巨大的体积无法一眼估量，但它似乎笼罩了好几个街区。表面是金属性的，黑色且闪烁着光，仿佛是为了吸收它现在正观察的世界的光。刻在外部的几何线条似乎拥有自己的生命，脉动着蓝、白间交替的微弱光芒。这是一个同样恐怖又着迷的景象，仿佛它的被创造不仅是为了威慑，还为了炫目。


    在街道上，混沌凝固了。奔跑、尖叫、争论——这一切停止了。那些在歇斯底里和混乱之间徘了几小时的人群停下来看，仿佛某种无形的力量强迫他们抬起目光。尽管恐惧，他们也无法移开视线。


    不久后，更多的过来了。其他船开始下降——虽然较小，但并不逊色——在城市的关键点上方定位。金融区、火车站、主广场。每一艘似乎都占据一个位置，像棋盘上小心放置的棋子。人群开始在这些区域聚集，脸被上方观察着它们的物体的光芒所照亮。


    ### 相遇


    一种被困在历史时刻的真实感清晰可见，仿佛每个人都知道世界已经永远改变了。没有人能判断这是入侵的前奏，还是完全不同的事情。所有的眼睛都盯着 `UFOs`，但气氛是分裂的。有些人在恐惧中僵住，颤抖的双唇在不发言的情况下说明了一切。另人在非理性好奇心的驱动下移动得近了一点，试图用手机捕捉每一个细节，或仅仅用自己的肉眼见证。


    然后，事情发生了变化。


    从最大的船散发出一道光。一道光束开始缓慢降落在地面，以近乎神性的强度照亮了周围的一切。人群本能地向后退，在主广场光芒触地的地方形成了一个圆圈。沉默是绝对的，只有那些无法停止评论所见之事的低声细语打破它。


    光束消失后，它留下了一个东西。一个身影。


    它是高大的，呈人形形状，但显然不是人类。它的皮肤带有金属质的光泽，反射着船只的光芒，仿佛它是它们的一部分。它的眼睛很大且呈椭圆形，闪烁着内在的光芒，那深邃的蓝色似乎能直视人心。它没有可见的嘴巴，但它的存在本身带着一种压倒性的重量，仿佛它的存在本身就承载着每个人都能内心深处感受到的信息。


