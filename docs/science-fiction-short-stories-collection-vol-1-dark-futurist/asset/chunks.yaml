  trans: '

    太阳刚刚开始拨开穿过城市街道的迷雾时，第一批报告传了进来。起初，没有人太在意。这看起来像是社交媒体上流传的那些故事之一：“郊区发现 UFO”，标题上写道。对于怀疑论者来说，这又是一个转瞬即逝的瞬间，对于好奇的人来说，这又是一个有趣的趣闻。我们以前听过多少次这类了？


    但那个早晨有些不同。空气中弥漫着某种气息。随着交通开始拥堵，人们短暂地停下脚步，盯着手机，不敢相信自己所看到的。“外星人”这个词以我们以前无法想象的速度扩散开来。警报的第一个信号出现了：恐惧在民众中蔓延，比任何普通传言来得更快、更疯狂。


    当地广播电台在清晨一直播放着常规节目，但现在开始用愈发令人困惑的报告中断广播。来自市郊的一通紧急电话描述了空中漂浮着奇异的光芒，散发着非地球的色彩，还有一种无人能识别但却令人脊骨悚然的声音。


    “这是一个虚假警报。可能是脱轨的卫星，或者科学可以解释的现象，”一位出现在新闻频道上的技术专家说道。他自信的语气未能平复那些聚集在广场和街道上的人的心。与此同时，城市的喧嚣如既常地持续。孩子们来到学校，上班族前往岗位，地铁在地下轰隆而过。


    然而，某些东西已经变了。空气中有一种震动，那是言语无法捕捉的。城市的节奏仍在继续，但肉体能感受到它——某种不可否认的事物。阳光似乎散发着不同的强度，风也像这条新闻一样，带着神秘的低语吹过。


    在咖啡馆里，谈话发生了变化。一些比较轻信的人已经开始理论化：“也许是政府在为某些事情做准备，”几个人建议道。另一些更有想象力的人指着他们在电影中看过的无数次的外星入侵，仿佛巨大的飞船和激光束会突然出现在天空。更理性的头脑保持冷静，坚信这只是一场骗局或一个精心设计的恶作剧，就像以前出现过的许多编造的故事那样。


    然而，它依然挥之不去。在天平线上，天空似乎在等待着什么。然后，在`9:45 a.m.`，一系列不自然的闪光打破了单调。在几秒钟内，天空被涂成了前所未见的色彩，而曾经沉重而平静的云层诡异地散开了，仿佛被某种无形的力量所移动。


    立刻，手机开始嗡嗡响。关于天空的警报——在此之前，那只存在于那些相信不可能之人的幻想中。在每个屏幕上，图像涌入：静止悬浮的发光圆圈、转瞬即逝的光芒、在蓝色广阔背景映托出的奇异轮廓。


    然而，城市的大部分人并没有意识到正在发生的事情的真实规模。随着一天天的过去，街道没有停歇地运转。员工进入办公室，商店继续按惯常营业，机器的噪音从未停止。还没有人知道，但时间正被拉得很薄。时钟的滴答声变得毫无意义，仿佛在为某种比常日活动大得多的事情做准备。


    对某些人来说，这不过是一个分心、一个笑话，或者又一个几小时内就会消失的自然现象。但在内心深处，某些东西即将打破沉默。某些东西即将改变我们所知的世界。


    而天空在它无限的平静中，继续注视。


    ## 第一次闪光


    这一天结束得与其他任何时候无异。太阳开始在建筑后落下，将天空染成橙色和金色，而城市为夜晚的宁静做准备。然而，一种不寻常的寂弥漫在空气中。通常充满鸣笛声和交谈声的街道显得空空如荡。人们没有在走路——他们是在看着。看着天空，仿佛有人告诉过他们天空值得关注。


    就在`7:32 PM` 时，第一道闪光打破了平静。


    一道强光划破天空，穿透了整天隐匿而未被察觉的云层。那抹电蓝色的、致目的刺眼的光芒照亮了城市几秒钟，仿佛天空本身爆发了。被困在日常事务中的人们同时抬头。没有人知道该想什么。一些女性紧紧抓住伴侣的手臂，孩子们既兴奋又困惑地指着手指，口袋和包里的手机在信息涌入时嗡嗡作响：“你看到那个吗？那是什么？”


    光芒消失得像出现时一样快，留下一连串未回答的问题。


    ## 升级


    在那一刻，这变得无法忽视了。那些光不是自然的。没有人能想起以前见过任何类似它的东西。在新闻中，恐慌开始浮现。主播们努力掩饰声音中的不安。气象学家试图安慰观众，但他们的话只加深了困惑。是卫星吗？大气现象吗？对某些人来说，最合逻辑的解释是军方正在测试某种先进技术。


    但随后，发生了某些消除了所有疑虑的事情。


    五分钟后，光再次出现，这次强度更强。在天平线上，一群发光的形状缓慢地横跨天空。它们不是飞机、流星，或其他任何我们熟悉的事物。它们是光，但它们并没有沿着直线移动。相反，它们在漂浮，在没有明显逻辑的情况下变换位置。有些聚集成完美的三角形；另一些则散开后又以令人不安的敏捷动作重新结合。


    这种现象是不容置疑的。这既不是大自然的作品，也不是人类手工制造的东西。光不断变换颜色——从明亮的黄色到深蓝色，从鲜艳的绿色到强烈的红色——仿佛它们正在玩弄可见光谱中的每种颜色。这是……外星的。


    低语声越来越大，手机震动得更加疯狂。社交媒体充斥着理论、图像和摇抖的视频片段，试图捕捉正在发生的一切。“骗局？没可能，”一条评论写道。“这是世界末日！”另一人惊呼道。这座曾经繁忙的城市，现在是一片凝固在震惊中的脸，全都望向天空。


    ## 降临


    但最糟糕的还没有到来。


    最后的光束像能量爆炸一样照亮了地平线。当它向市中心移动时，光汇聚在一起，形成了违背所有逻辑的几何形状。然后，一切突然停止了。沉的寂笼罩了空气。光连同交通和声音完全消失了。整个城市似乎悬浮在那个不确定的时刻。


    人们开始低语，仿佛真相大到无法说出口。某些东西已经了。某些东西降临了，而且不会离开。


    紧张感显而易见，厚得可以用刀切开。空气中有一种东西——某种无法描述的东西。没有人知道该做什么、想什么，或向谁求助。最荒诞的阴谋论与深处的恐惧交织在一起：“这是入侵，”有人喃喃道，“他们肯定在监视我们。”其他谨慎的人低声说：“这没什么。也许这是一个征兆。也许他们只是想交流……”


    分钟被拉成了小时。在城市的每个角落，人们都紧盯着天空。没有人知道该预料什么。没有人知道接下来会发生什么。


    但有一点是肯定的：平静已经结束了。他们所知的现实已经消失了。而即将发生的事情，将超越任何理论或想象，将永远改变人类。

