    based Co-OODA loop as $\pi$. The policy $\pi$ can be defined as a set of sub-policies
    of role nodes: $\pi = \{ \pi_1, \pi_2, \dots, \pi_i \}$, where $\pi_i$ is the
    policy of each role layer. In the learning process, different role layers need
    different AI technologies to learn their target policies. The observation layer
    requires image recognition algorithms, natural language processing, and other
    technologies to process the perceived environmental information. The orientation
    layer needs to leverage big data analytics and knowledge graph technology to perform
    data analysis, knowledge extraction, knowledge fusion, and knowledge processing
    on multi-dimensional environmental observations to obtain aggregated information.
    The decision layer needs intelligent reasoning and planning algorithms to complete
    the mapping of aggregated information to actions. The action layer act to the
    environment to obtain the reward that feedback to each layer node. Thus, IUS needs
    a new RL framework to use different AI to learn sub-policies and provide feedback
    to train policies. It is important to improve an effective role-based deep reinforcement
    learning algorithm in the subsequent work, which enables each role node to learn
    its task sub-policies separately by using various methods for AI so as to build
    a global policy that can complete the role-based Co-OODA system.


    In the role-based Co-OODA system, there is apparent information dependency between
    each role layer. In Fig. 4, the dotted line indicates the flow of information
    between nodes. Nodes rely on advanced data links to transmit high-fidelity and
    high-quality information flow to guarantee a continuous OODA loop. Therefore,
    efficient information sharing between nodes is also an important factor in supporting
    and accelerating the Co-OODA cycle. The information sharing mechanism of the role-based
    Co-OODA system is also one of the issues that need to be solved urgently. At the
    information sharing level, the nodes of the same role and different roles need
    to formulate information communication protocols in different aspects.


    We propose a preliminary information sharing mechanism. For the same role layer,
    nodes need to use a hierarchical communication topology to share information by
    way of enhancing complimentary local information. Nodes are divided into different
    groups, and each group needs to elect a group leader dynamically. The same group
    nodes need to learn what message to send and when to communicate to the leader.
    For example, Fig. 4 shows that there are several observation nodes in the observation
    layer, and these nodes form different groups.


    The sub-center node collects the information from other nodes and integrates the
    information to be transmitted between different layers. The sub-center node is
    the bridge for information transmission of different role layers. The information
    sharing in different role layers, After the observation node perceives environmental
    state in a specific unit time, needs to learn to identify and distill important
    information and determine whether it needs to be sent to the which orientation
    node. The orientation node needs to learn to interpret, sort, aggregate and evaluate
    the received information, transform information into aggregate information to
    obtain the multi-dimensional environmental perception that decision nodes can
    use. The decision node makes decisions based on the environmental situation information
    obtained by the orientation node and transmits the information command to the
    action node that needs to be activated to perform the task. Therefore, we need
    to optimize further an effective information sharing mechanism for the continuous
    and circular operation of the role-based Co-OODA system in subsequent research.


    # V. CONCLUSION


    This paper analyzes a development trend of intelligent unmanned systems and describes
    a role-based Co-OODA system. To better use intelligent algorithms to solve the
    cooperation problem of IUS, we preliminary propose a role-based DRL framework
    and information sharing mechanism. They guarantee the learning of each role node
    and information flow to ensure the continuous cyclic execution of OODA.


