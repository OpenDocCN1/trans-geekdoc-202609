    RL enables agents to perform a complete OODA cycle to learn their global policy.
    However, this learning method cannot fully use this new Co-OODA system with various
    node roles. To tackle this problem, we first describe the role-based Co-OODA system.
    Secondly, we need to focus on preliminarily proposing a new role-based deep reinforcement
    learning framework for this pattern, where individuals learn their role policies
    at different levels and time abstraction scales, to make full use of this new
    role-based Co-OODA system and realize the cooperation control of the IUSs effectively.
    Finally, according to this system, it is also necessary to propose an information
    sharing mechanism based on different role tasks, so that information can be transferred
    between different role nodes and ensure the completion of a continuous flow Co-OODA
    cycle.


    # II. RELATED WORK


    Entities in the IUss can be treated as agents with considerable autonomous capabilities.
    Therefore, the IUss system can be regarded as a multi-agent system. In recent
    years RL has made extraordinary progress on many sequential decision-making problems,
    such as playing the game of [1], robotic control [2], and autonomous driving [3].
    With the effective application of RL in some complex single-agent tasks, many
    researchers have transferred RL''s research results to a multi-agent system.


    The current research on multi-agent reinforcement learning can be divide into
    three groups, fully cooperative, fully competitive, and a mix of the two, which
    depend on the types of task settings [4]. In particular, in the cooperative setting,
    the cooperation process of agents has been divided into two stages: “information
    sharing” and “collaborative decision-making” [5]. In recent years, with the outstanding
    ability of deep learning (DL) in complex data-driven tasks, a learning paradigm
    – deep reinforcement learning (DRL) that combines the powerful feature representation
    of DL and efficient strategy search of RL is applied to the cooperation task of
    a multi-agent system.


    To maximize the utility of the team, information sharing is the fundamental function
    of a multiagent system. Learning communication in multi-agent learning is an emerging
    sub-area in which agents can learn communication even from scratch under a distributed,
    partially observable environment. The agent’s communication protocols can determine
    when to


    communicate, what kind of message to send, and who to send them to. In [6], Each
    agent is modeled by a deep feed-forward network, and the agent modeled can be
    trained to extract hidden state h from the state to learn what message to send.
    [7] designs an attention unit that enables agents to learn when to communicate
    for the rst time.


    # III. ROLE-BASED CO-OODA SYSTEM


    The OODA cycle theory was proposed by Air Force Col John R. Boyd’s in 1987. It
    describes the behavioral process of agents [8]. Agents gather information from
    the environment and then orients themselves to the environment to decide the action
    to be selected from the action set, and then act. If IUSs want to win in a hyper-competitive
    environment, these four steps must cycle quickly and continuously, completing
    decision-making and actions faster than the opponent. In August 2017, DARPA proposed
    the operational concept of mosaic warfare, which integrates the other ideas and
    operational concepts of the US military in recent years and has become the top-level
    core concept of the DARPA military combat system. Mosaic Warfare decomposes complex
    integrated systems into various functional units such as sensor systems, command
    and control systems, weapon platform systems. Through dynamic communication networks,
    various units are linked to form a highly distributed and flexible operational
    network. Mosaic warfare has lots of characteristics. One of the most important
    characteristics is that battle resources are abstracted into capability nodes
    that undertake different functions of OODA, which are connected by communication
    networks into a Co-OODA system. On the one hand, there is no critical node or
    small set of nodes whose loss will collapse the entire system. On the other hand,
    the OODA cycle has a high agility degree, flexibly combining various functional
    units according to available resources.


    The idea of mosaic warfare has advantages in dealing with military tasks, and
    this idea can also be applied to non-military fields. With this trend, IUS in
    the future will perform tasks based on advancements in processing, computing,
    and networking, having the ability to seamlessly share information when and where
    needed, and use the most advanced communication network to achieve connecting
    of various functional roles in the mission area. Fig. 1 shows the idea that the
    node functional role of the IUS is constructed based on the loop of OODA, which
    is divided into observation nodes, orientation nodes, decision nodes, action nodes,
    and comprehensive nodes with multiple functions. Information flow between nodes
    through advanced data links. Observation nodes cooperate and provide multi-dimensional
    observations to orientation nodes. The orientation node aggregates the current
    observation information with the existing knowledge base, database, and historical
    experience information to form environmental state information. Based on this
    orientation, decision nodes or comprehensive nodes active multiple action nodes.
    This way can form multiple OODA cycles, developing a more unstructured operating
    manner in a role-based Co-OODA system. For instance, in the search and rescue
    of victims'
