    # IV. DEEP REINFORCEMENT LEARNING FRAMEWORK AND INFORMATION SHARING MECHANISM
    IN ROLE-BASED CO-OODA SYSTEM


    Role-based Co-OODA can speed up the OODA cycle from two aspects. On the one hand,
    Fig. 2 shows that IUS compose of multiple agents with different task roles to
    perform tasks. Instead of being sequential and linear, the OODA cycles are far
    more integrated including multiple interlinked and nested procedures. The observation
    node, the orientation node, the decision node, and the action node can perform
    their role tasks in parallel, thereby accelerating the OODA loop. In Fig. 3, assume
    that the time interval for the individual to perform the sub-steps of the OODA
    cycle is τ that can be a real number or an integer. Here we assume that τ is a
    unit time. In the role-based OODA system, the observation node observes the environment
    at time t and provides the observation information flow to the orientation node.
    At time t+2, the orientation node processes the received information. At this
    time, the observation node can enter the next OODA cycle’s observation phase at
    t+2 and continues to perceive the environment. Using the role-based Co-OODA cycle
    can speed up the execution of tasks, and the entire Co-OODA cycle is more integrated.
    On the other hand, appropriate artificial intelligence technology is applied to
    each role layer to accelerate the operation of the sub-elements of Co-OODA, which
    gives impetus to run the whole Co-OODA cycle.


    The intelligence in the unmanned system is reflected in using artificial intelligence
    technology (AI) to accelerate the OODA loop’s speed in a complex environment,
    shorten the responding time for unknown threats. In IUSs with role-based, agents
    undertake different role tasks according to the sub-steps of the OODA cycle so
    that several role nodes are required to cooperate complete the Co-OODA cycle during
    task execution. Agents need to learn their policy from different temporal abstractions
    based on their roles and tasks. Multi-agent deep reinforcement learning (MADRL)
    is one of the fundamental technologies to realize the intelligence of unmanned
    systems, and information sharing is the basis for the efficient exchange of information
    between different role nodes. Currently, MADRL cannot enable agents to learn role-related
    information sharing policy and behavioral decision-making policy at different
    times. Therefore, it is very significant to study the innovative learning framework
    and information sharing mechanism to make full use of this role-based system.


    To make full use of the role-based Co-OODA system features, designing a role-based
    DRL framework is the basis for the learning and training on the role-based Co-OODA
    system. Role nodes need various AI to finish their tasks. Thus, different AI methods
    need to be added to the DRL framework. Upon this frame, each individual learns
    its role task policy. At present, the method of hierarchical reinforcement learning
    (HRL) can decompose the task into some subtasks at different levels of abstraction
    to learn each subtask’s policy and combine the policy of multiple subtasks to
    form an effective global policy. The learning process can abstract and expand
    the action set based on different temporal abstraction, and the agent realizes
    hierarchical control by learning on different temporal scale levels. The learning
    process can abstract and expand the action set based on different temporal abstraction,
    and the agent realizes hierarchical control by learning on different levels of
    the layer. The idea of HRL’s task layering can be applied to the new DRL framework
    of the role-based Co-OODA system. Different nodes describe their action sets and
    perform policy learning on different time scales according to their role tasks.


    As shown in Fig. 4, we propose a preliminary role-based DRL framework. We regard
