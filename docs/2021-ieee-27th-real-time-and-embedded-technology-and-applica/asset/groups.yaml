    ## Work in Progress: Role-based Deep Reinforcement Learning with Information Sharing
    for Intelligent Unmanned Systems


    1st Qingshuang Sun, 2nd Yuan Yao, 3rd Peng Yi, 4th Xingshe Zhou, 5th Gang Yang

    School of Computer Science

    Northwestern Polytechnical University

    Xi’an, China

    {1st sunqsh, 3rd yipeng}@mail.nwpu.edu.cn, {2nd yaoyuan, 4th zhousx, 5th yeungg}@nwpu.edu.cn


    Abstract—Intelligent unmanned systems (IUSs) are distributed systems composed
    of multiple agents that share information or cooperate to accomplish specific
    complex tasks. Agents of the IUS are capable of perception, cognition, control,
    decision-making, and action. In some cases, the environmental situation and task
    objectives faced by the IUSs are constantly changing with time. Thus, IUSs are
    time-sensitive systems. To accelerate the task execution time and response speed,
    IUSs use artificial intelligence technology to increase the speed and quality
    of the “observation-orientation-decision-action” (OODA) cycle of task execution.
    IUSs will tend to decompose the system into different functional units in the
    future, and individuals take different task roles from the functional perspective
    of OODA. The system is evolving from a linear OODA cycle of individuals to a cooperative
    OODA (Co-OODA) with different node roles. At present, the reinforcement learning
    (RL) algorithm is the mainstream method to solve IUSs cooperation problems. However,
    it does not adapt to the Co-OODA with different roles, and cannot maximize the
    Co-OODA system’s potential. This paper introduces the role-based Co-OODA system.
    Furthermore, we propose and design a role-based deep reinforcement learning framework
    and its corresponding information sharing mechanism.


    Index Terms—intelligent unmanned systems, OODA, role, reinforcement learning,
    information sharing


    ## I. INTRODUCTION


    With the complexity and diversity of the environment and tasks, agents, such as
    Unmanned Aerial Vehicles (UAVs), Unmanned Ground Vehicles (UGVs), and mobile robots,
    are constrained by the software and hardware conditions, which have some limitation
    in the complex tasks. For example, when a single agent performs an exploration
    task, it cannot achieve multi-dimensional and a wide range of coverage of the
    task area. To make up the limitation of individual resources, intelligent unmanned
    systems (IUSs) have become the mainstream trend, helping humans complete some
    dangerous or difficult missions, such as reconnaissance and surveillance in military
    tasks and search and rescue missions in civilian task. IUSs have some technical
    superiorities such as efficient information sharing, supporting the decomposition
    and collaboration of complex tasks, and individual low-cost. They have more widespread
    application prospects, which has been a hot spot of concern.


    With the artificial intelligence (AI) development, intelligent cooperation control
    is the core technology of IUSs research and application. Intelligent cooperation
    control refers to selecting and coordinating multiple agents’ behavior in a centralized
    or distributed manner to achieve a common goal without human intervention. Reinforcement
    learning (RL) is an important method of intelligent control, where agents interact
    with a dynamic environment to learn an optimal policy to adapt to complex environmental
    problems.


    IUS leverages RL to learn policies, each agent run the linear loop of ‘observation-orientation-decisions-action’
    (OODA) at a regular time step to achieve the purpose of cooperation. This approach
    requires individuals to integrate sensors, mission computers, and task executors.
    The individual that aggregates multiple functions has two disadvantages. One is
    that the collision and drop of integrated functional agents will cause the loss
    of high-value assets when performing tasks. The second is that each agent needs
    to run a complete OODA cycle before entering the next OODA loop, which will extend
    the task completion time. However, IUS is a time-sensitive system. The environmental
    situation and task goals are constantly changing over time. When the original
    task plan does not necessarily meet the tasks, the system needs to analyze and
    decide about individual behavior within a limited time frame. For example, in
    the case of confrontation, if one party completes the cycle of OODA faster and
    enter the opponent’s decision-making cycle, the opponent will be forced to react
    to new situations, resulting in errors in decision-making and actions. The OODA
    loop should therefore be accelerated.


    Today, the trend of IUS development is that different roles of agents are constructed
    according to task demands. As shown in Fig. 1, there are observation nodes, orientation
    nodes, decision nodes, and action nodes based on OODA in the system, allowing
    individuals to active one or more role functions. This pattern divides the complex
    system into multiple minimum units with a single function and good interoperability.
    Therefore, role agents’ cooperation can form multiple cooperative OODA (Co-OODA)
    sub-cycles in the functionally decomposed IUS. The independent individual OODA
    cycle of IUS becomes an integrated Co-OODA cycle jointly finished by agents.


    RL enables agents to perform a complete OODA cycle to learn their global policy.
    However, this learning method cannot fully use this new Co-OODA system with various
    node roles. To tackle this problem, we first describe the role-based Co-OODA system.
    Secondly, we need to focus on preliminarily proposing a new role-based deep reinforcement
    learning framework for this pattern, where individuals learn their role policies
    at different levels and time abstraction scales, to make full use of this new
    role-based Co-OODA system and realize the cooperation control of the IUSs effectively.
    Finally, according to this system, it is also necessary to propose an information
    sharing mechanism based on different role tasks, so that information can be transferred
    between different role nodes and ensure the completion of a continuous flow Co-OODA
    cycle.


    ## II. RELATED WORK


    Entities in the IUSs can be treated as agents with considerable autonomous capabilities.
    Therefore, the IUSs system can be regarded as a multi-agent system. In recent
    years RL has made extraordinary progress on many sequential decision-making problems,
    such as playing the game of [1], robotic control [2], and autonomous driving [3].
    With the effective application of RL in some complex single-agent tasks, many
    researchers have transferred RL''s research results to a multi-agent system.


    The current research on multi-agent reinforcement learning can be divided into
    three groups, fully cooperative, fully competitive, and a mix of the two, which
    depend on the types of task settings [4]. In particular, in the cooperative setting,
    the cooperation process of agents has been divided into two stages: “information
    sharing” and “collaborative decision-making” [5]. In recent years, with the outstanding
    ability of deep learning (DL) in complex data-driven tasks, a learning paradigm
    – deep reinforcement learning (DRL) that combines the powerful feature representation
    of DL and efficient strategy search of RL is applied to the cooperation task of
    a multi-agent system.


    To maximize the utility of the team, information sharing is the fundamental function
    of a multiagent system. Learning communication in multi-agent learning is an emerging
    sub-area in which agents can learn communication even from scratch under a distributed,
    partially observable environment. The agent’s communication protocols can determine
    when to communicate, what kind of message to send, and who to send them to. In
    [6], Each agent is modeled by a deep feed-forward network, and the agent modeled
    can be trained to extract hidden state h from the state to learn what message
    to send. [7] designs an attention unit that enables agents to learn when to communicate
    for the first time.


