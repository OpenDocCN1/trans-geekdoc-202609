- pgno: 320
  md: 'In order to use backpropagation, the sampling is moved to the input neurons,
    where a vector $\boldsymbol{\eta}=(\eta_1,\dots\eta_{M_{L/2}})^T$ is sampled from
    the standard normal distribution in $M_{L/2}$ dimensions. With this,


    ```

    $z^{(L/2)} = \mu(\\mathbf{x}) + \mathbf{\Sigma}^{1/2}(\mathbf{x}) = \begin{pmatrix}
    \mu_1(\mathbf{x}) + \sigma_1(\mathbf{x})\eta_1 \ \vdots \ \mu_{M_{L/2}}(\mathbf{x})
    + \sigma_{M_{L/2}}(\mathbf{x})\eta_{M_{L/2}} \end{pmatrix}$

    ```


    The schematics are


    ![](img/c6c76bf52016db7e78a5e30d4766ef81_320_0.png)


    For clarity the input neurons are shaded. As before, the dotted lines indicate
    that any combination of hidden neurons, layers and transfer functions is possible,
    making use of the capacity of neural networks to model any function.


    The error function is the sum over all training data $\mathbf{x}_n$ of $-\log
    p(\mathbf{x}_n)$ and the KL divergence $p_0^{(L/2)}|\mathbf{x}_n)$ and $p(z^{(L/2)}|\mathbf{x}_n)$.
    One term of this is given by


    ```

    $E_n = - \log p(\mathbf{x}_n) + D_{KL}(p_0^{(L/2)}|\mathbf{x}_n) || p(z^{(L/2)}|\mathbf{x}_n))
    \n= \int p_0(z^{(L/2)}|\mathbf{x}_n) [ - \log p(\mathbf{x}_n) - \log \frac{p(z^{(L/2)}|\mathbf{x}_n)}{p_0(z^{(L/2)}|\mathbf{x}_n)}]
    dz^{(L/2)}$

    ```


    By Bayes'' rule


    ```

    $p(z^{(L/2)}|\mathbf{x}_n) = \frac{p(\mathbf{x}_n|z^{(L/2)})p(z^{(L/2)})}{p(\mathbf{x}_n)}$

    ```'
