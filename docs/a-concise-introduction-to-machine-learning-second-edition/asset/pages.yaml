  md: "![](img/c6c76bf52016db7e78a5e30d4766ef81_114_0.png)\n\nFigure 3.7: Random walk\
    \ generated by Gibbs sampling.\n\nTo determine the acceptance probability, we\
    \ need to calculate\n\n```\n$$f(x^*)g(x^*,x) = \\frac{f(x^*)p(x_d|x^*_{-d})}{p(x_d|x_{-d})}\
    \ = \\frac{f(x_1,\\dots,x_{d-1},x_d,x_{d+1},\\dots,x_D)p(x_d|x_{-d})}{p(x_d|x_{-d})}$$\n\
    ```\n\nNow using the product rules\n\n```\n$$f(x) = p(x|x_{-d})p(x_{-d})\\n f(x_1,\\\
    dots,x_{d-1},x_d,x_{d+1},\\dots,x_D) = p(x_d|x_{-d})p(x_{-d})$$$\n```\n\nwe see\
    \ that the fraction is given by. Thus every sample in the intermediate steps is\
    \ accepted.\n\nReturning to the binary example\n\n```\n$$\\mu = \\begin{pmatrix}\
    \ \\mu_1 \\ \\mu_2 \\end{pmatrix}, \\quad \\Sigma = \\begin{pmatrix} \\Sigma_{11}\
    \ & \\Sigma_{12} \\ \\Sigma_{21} & \\Sigma_{22} \\end{pmatrix}$$$\n```\n\nthe\
    \ conditional probabilities are given\n\n```\n$$p(x_1|x_2) = \\mathcal{N}(\\mu_1\
    \ + \\frac{\\Sigma_{12}}{\\Sigma_{22}}(x_2-\\mu_2), \\frac{\\Sigma_{11}}{\\Sigma_{22}}-\f\
    rac{\\Sigma_{12}^2}{\\Sigma_{22}}\\n p(x_2|x_1) = \\mathcal{N}(\\mu_2 + \\frac{\\\
    Sigma_{21}}{\\Sigma_{11}}(x_1-\\mu_1), \\frac{\\Sigma_{22}}{\\Sigma_{11}}-\frac{\\\
    Sigma_{21}^2}{\\Sigma_{11}})$$$\n```\n\nFigure 3.7 shows the random walk generated\
    \ by the steps of the Gibbs algorithm for the same normal distribution as in the\
    \ examples in Figure 3.6. To approximate independence between samples thinning\
    \ can be used. Another technique is blocking; when not the conditional probabilities\
    \ of individual components are used, but of sets of several components, which\
    \ can be overlapping."
