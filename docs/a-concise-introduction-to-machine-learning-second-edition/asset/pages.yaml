  md: '# # Regression


    In regression, we try to find the relationship between variables. Regression is
    related to curve fitting, interpolation, and data prediction. As an example, we
    consider colour vision. Spectral colours, as seen in Figure 8.1, are evoked by
    a single wavelength. Colours change continuously as the wavelength changes. A
    physical colour is a combination of pure spectral colours. Hence there are infinitely
    many possibilities.


    ![](img/c6c76bf52016db7e78a5e30d4766ef81_248_0.png)


    Figure 8.1: Spectral colours.


    Around 1854, James Clerk Maxwell Campbell & Garnett (2010) showed that all colours
    can be mixed by different coinations of the three primary colours, red, green
    and blue. He did so by using a colour-mixing top which can be seen in Figure 8.2
    consisting of three paper discs overlapping by different amounts. A smaller disc
    contained a wedge of the sample. The brightness could be adjusted by the width
    of the wedge. When the top spin, the other colours would mix and one could adjust
    how each colour contributed until it matched the colour in the centre.


    There is a biological reason for this. The human eye has only three measuring
    devices to perceive colour the cones. Figure 8.3 shows to which wavelengths different
    type of cones are sensitive. The blue peak is well separated from the red and
    green peaks. It is believed that the separation is evolutionarily new and that
    the curves will move further apart with time. Colour blindness is in most cases
    due to one of cone missing or malfunctioning. With three measurements, the human
    eye can distinguish ten million colours. This is an example of regression, shows
    how powerful our brain is. From only three measurements our brain is able to infer
    millions of colours.'
