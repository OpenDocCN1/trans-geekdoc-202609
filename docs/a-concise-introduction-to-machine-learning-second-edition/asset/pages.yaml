    \ of data can be described as:\n\n```\n$$\\mathbf{v}_n \\sim \\mathcal{N}(\\mu_k,\
    \ \\boldsymbol{\\Sigma}_k)$$\n$\\pi \\sim \\text{Dir}(\\alpha)$$\n$\\mu_k, \\\
    boldsymbol{\\Sigma}_k \\sim G.$\n```\n\nThe base distribution $G_0$ is indirectly\
    \ part of the distribution $G$, since the points where $G$ is nonzero are drawn\
    \ from $G_0$, while the probability masses at these points are drawn from $\t\
    ext{Dir}(\\alpha)$.\n\nHaving explored the way the dataset is generated, we now\
    \ look at inferring the cluster membership from the data. First, let $\\mathcal{D}=\\\
    {\\mathbf{v}_1, \\dots, \\mathbf{v}_N\\}$ be a set of data samples drawn from\
    \ a multivariate distribution with mean $\boldsymbol{\\mu}$ and covariance matrix\
    \ $\boldsymbol{\\Sigma}$, where $\boldsymbol{\\mu}$ and $\boldsymbol{\\Sigma}$\
    \ are themselves drawn from a normal-inverse-Wishart distribution. We assume a\
    \ prior normal-inverse-Wishart distribution with parameters $\\mathbf{m}, \\boldsymbol{\\\
    Psi}$ and $\nu$. The posterior is also a normal-inverse-Wishart distribution.\
    \ Let\n\n```\n$$\\mathbf{\\bar{v}} = \\frac{1}{N} \\sum_{n=1}^N \\mathbf{v}_n$$\n\
    ```\n\nbe the sample mean and\n\n```\n$$\\boldsymbol{\\S} = \\frac{1}{N} \\sum_{n=1}^N\
