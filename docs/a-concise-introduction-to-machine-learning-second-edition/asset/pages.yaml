- pgno: 221
  md: '# # Dimensionality Reduction


    In the previous chapters, the features were taken as given. The kernel trick was
    introduced through a mapping of the feature space to a higher dimensional space,
    where the data samples are more easily separable. This higher dimensional space
    can be viewed as creating new features from the given, combining them in space.
    Often, the data samples lie in a dimensional set of the feature space. So there
    is opportunity to go down this dimension.


    For example in an 8-bit gray scale image, each pixel has a value between 0 (black)
    and 255 (white). A standard sized image of 1280 by 720 pixels therefore encoded
    in 921,600 bytes or approaching one megabyte. In other words, humans are quite
    well adapted to interpret misprinted information in an image. The Joint Photographic
    Experts group (JPEG) used this in 1992 to create a standard for lossless image
    compression.


    The image is first divided into nx blocks. For the example size above, this results
    in 14,000 blocks. Instead of storing 64 pixel values for each block, each block
    is built by overlapping blocks from Figure 7.1 with appropriate weights. Weights
    are only allowed to have integer values. Many weights will be zero, because few
    blocks in the image will have high variations, which will have a moderate variation
    between pixels, some will be mostly one smooth shade of gray. By changing the
    focus away from the individual pixel to groups of pixels, i.e. few bytes are needed
    to encode the image.


    In mathematical terms, this is a change of basis. When storing the values for
    each pixel in a block, this is equivalent to using a basis where all values are
    zero, but one, and the position of this nonzero pixel traverses the block. The
    weights for this basis are the individual pixel values, and will not be nonzero.
    The other basis is shown in Figure 7.1. When representing the block in this basis,
    only a few nonzero weights are necessary.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/c6c76bf52016db7e78a5e30d4766ef81_222_0.png)


    Figure 7.1: Discrete Cosine Transform basis of the JPEG standard.


    In this chapter, we introduce techniques to find representations of the data samples
    with different, but fewer features.


    # 7.1 Principal Component Analysis


    Principal Component Analysis seeks a subspace of a given dimension $K$ of the
    feature space such that projections of the data samples onto that subspace are
    spread out as possible. If there is space between groups of data samples, this
    has advantages when clustering or classifying. This subspace is known as the principal
    subspace.


    Let $D = \{v_1, \dots, v_n\}$ be a set of data samples. We first consider the
    projection onto a one-dimensional subspace defined by the vector $w$. Just as
    in the case of linear classification, only the direction of the vector is important,
    not its length. The length is chosen to be $\|w\| = 1$, so that the projection
    of the sample $v_n$ is calculated as $w^T v_n$.


    The sample mean is given by


    ```

    $$\mu = \frac{1}{N} \sum_{n=1}^N v_n$$

    ```


    while the sample covariance matrix


    ```

    $$\Sigma = \frac{1}{N} \sum_{n=1}^N (v_n - \mu)(v_n - \mu)^T \quad (7.1)$

    ```


    which is symmetric.'
