- pgno: 308
  md: '```

    clear;

    x = -5:0.1:5;

    # True function;

    t = x .* sin(x);

    # Construct two layer neural network with 3 hidden neurons.

    net = fitnet(3);

    # Remove normalization and de-normalization.

    net.input.processFcns = {};

    net.output.processFcns = {};

    # Train the neural network.

    [net,~~] = train(net,x,t);

    # Weights in the first layer.

    LW = net.W{1};

    # Bias weights in the first layer.

    b1 = net.b{1};

    # Bias weight in the second layer.

    b2 = net.b{2};

    # Weights in the second layer.

    LW = net.W{2};

    X = -5:0.1:5;

    T = X .* sin(X);

    # Predictions

    Y = b2 + LW .* tansig(bl + ones(1,length(X)) + IW * X );

    # Constructed bias functions.

    Z = tansig(bl + ones(1,length(X)) + IW * X);

    figure;

    # True function

    plot(X,T,''r-'');

    hold on

    # Predictions.

    plot(X,Y,''b-'');

    # Bias.

    plot(X,b2ones(1,length(X)),''k-'');

