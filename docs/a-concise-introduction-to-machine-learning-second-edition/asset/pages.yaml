  md: '# 252 A Concise Introduction to Machine Learning


    α. To this end, we separate the contribution of a single hyperparameter out. First
    note that since **A is a diagonal matrix, **C** can be rewritten as


    ```

    C = \sigma^2 I + \sum_{m=1}^{M} \frac{1}{\alpha_m} d_m d_m^T

    ```


    Let


    ```

    C_{-i} = \sigma^2 I + \sum_{m \neq i}^{M} \frac{1}{\alpha_m} d_m d_m^T = C - \frac{1}{\alpha_i}
    d_i d_i^T

    ```


    and $\alpha_{-i} = (\alpha_1,\dots,\alpha_{i-1},\\alpha_{i+1},\dots,\alpha_M)^T$.
    Using the Sherman-Morrison formula in A.1.4, we have


    ```

    C_{-i}^{-1} = C^{-1} - \frac{C^{-1} d_i d_i^T C^{-1}}{\alpha_i + d_i^T C^{-1}
    d_i}

    ```


    The matrix determinant lemma in A.1.5 on the other hand gives


    ```

    |C| = |C_{-i}| (\alpha_i + d_i^T C_{-i}^{-1} d_i) \frac{1}{\alpha_i}

    ```


    Combining these two, we can write


    ```

    \mathcal{L}(\alpha) = \frac{1}{2}(N\log(2) + \log|C_{-i}| + t^T C_{-i}^{-1} t)
    - \alpha_i \log \alpha_i - \frac{t^T C_{-i}^{-1} d_i d_i^T C_{-i}^{-1} t}{\alpha_i
    + d_i^T C_{-i}^{-1} d_i}\n= \mathcal{L}(\alpha_{-i}) + \frac{1}{2}\frac{\log|\alpha_i|
    - \log(\alpha_i + d_i^T C_{-i}^{-1} d_i)}{\alpha_i + d_i^T C_{-i}^{-1} d_i} +
    \frac{(d_i^T C_{-i}^{-1} t)^2}{\alpha_i + d_i^T C_{-i}^{-1} d_i}}\n= \mathcal{L}(\alpha_{-i})
    + \ell(\\alpha_{-i}))

    ```


    We have separated the dependencies on $\alpha_i$ into $\ell(\\alpha_{-i})$, while
    $\mathcal{L}(\alpha_{-i})$ contains the portion of the log independent of $\alpha_i$.


    We define the quantities


    ```

    $s_i = d_i^T C_{-i}^{-1} d_i$ and $q_i = d_i^T C_{-i}^{-1} t$,

    ```


    which are independent of $\alpha_i$. With this definition


    ```

    \ell(\alpha_i) = \frac{1}{2}\frac{1}{\alpha_i} \log(\alphaalpha_i + s_i) + \frac{q_i^2}{\alpha_i
    + s_i}

    ```


    The derivative of the log with respect to $\alpha_i$ is given


    ```

    \frac{\partial\ell(\\alpha_i)}{\partial\alpha_i} = \frac{\partial\ell(\\alpha_i)}{\partial\alpha_i}
    = \frac{1}{2}\frac{-1}{\alpha_i^2} \frac{1}{\alpha_i + s_i} + \frac{1}{(\alpha_i
    + s_i)^2} - \frac{q_i^2}{(\alpha_i + s_i)^2}\n= \frac{1}{2}(\alpha_i + s_i)^{-2}
    (s_i - q_i^2 + \frac{s_i^2}{\alpha_i}), (8.9)

    ```


    $\mathcal{L}(\alpha_{-i})$ is independent of $\alpha_i$.'
