- pgno: 270
  md: '# ## 8.10 Regularization


    Recall, we are trying to find suitable coefficients $c$ minimizing $\|t - Dc\|^2$
    where $t$ is the target and $D$ is the design matrix, while avoiding unnecessary
    complexity which leads to overfitting. Often, this can be achieved by introducing
    a penalty term $\Omega(c)$ and minimizing


    ```

    $\frac{1}{2}\|t - Dc\|^2 + \lambda\Omega(c),$

    ```


    $\Omega(c) \geq 0$ for all $c$ and $\Omega(0) = 0$.

    The penalty $\Omega(c)$ is also known as *entropy measure*. The parameter $\lambda$
    controls the trade-off between fitting the data and reducing complexity which
    has been chosen. Often, a model is obtained for different choices of $\lambda$,
    and the goodness of the model is assessed on a *validation set*. If $\lambda =
    0$, we obtain the OLS solution. If the other hand $\lambda = \infty, c = 0$, since
    the zero vector of coefficients is the least complex one. For $\lambda$ in these
    two extremes, we are balancing between fitting a linear model and keeping the
    model complexity small. Note that we still explain the same model space as before,
    the inclusion of $\Omega(c)$ gives preference to certain areas of the model space.
    The parameter controls how strong this preference is.


    In the following, norms different from the Euclidean norm ($L_2$) are distinguished
    by subscripts, which we continue to denote the Euclidean norm by $|\cdot\$. The
    choices for $\Omega(c)$ are numerous:


    | $\Omega(c)$ | Regression method |

    | :--- | :--- |

    | $\|c\|_0$ | number of nonzero elements in $c$ | $L_0$ regularization |

    | $\|c\|_1 = \sum |c_m|$ | $L_1$ regularization | Least Absolute Shrinkage and
    Selection Operator (LASSO) |

    | $\frac{1}{2}\|c\|^2 = \frac{1}{2}\sum c_m^2$ | $L_2$ regularization Ridge regression
    |

    | $\lambda\|c\|_1 + (1 - \lambda)\|c\|^2$ | Elastic net regularization |


    $L_0$ regularization is an NP-hard problem. This means there is no known algorithm
    to solve this in polynomial time. The aim of $L_0$ regularization is to arrive
    at a *sparse* vector of coefficients, i.e. a vector where many entries are zero.
    That is only a few components of $c$ are nonzero. If it is known that $c$ is 1-sparse,
    i.e. only one component is nonzero, we have $\binom{n}{1}$ possibilities and each
    needs to be checked whether it is the minimum.'
