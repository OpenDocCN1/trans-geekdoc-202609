  md: 'A well-known example of a probability density function is the bell curve of
    the normal distribution or also known as the Gaussian distribution $x \sim \mathcal{N}(\mu,
    \sigma^2)$, where $\mu$ means "is distributed as". It''s probability density function
    is given by


    ```

    $$\mathcal{N}(x|\mu, \sigma^2) = \frac{1}{\sqrt{2\pi}\sigma} \exp\left(-\frac{(x-\mu)^2}{2\sigma^2}\right),
    \quad (2.4)$

    ```


    Its position and shape are determined by the parameters $\mu$, called the mean,
    and $\sigma^2$, called the variance. The square root of the variance, $\sigma$,
    is the standard deviation. Figure 2.2 illustrates the shapes of the bell curve
    for values of the mean and variance. When $\mu=0$ and $\sigma^2=1$, it is known
    as the standard normal distribution.


    There is a common misconception that "normal" means common. Gauss introduced the
    naming with "normal" referring to a norm in the method of Ordinary Least Squares
    in Section 8.4. One technique to minimize is to solve the "normal" equations and
    these where Gauss in his choice of words referred to. Over the tools used on the
    meaning of "normal".


    Normal distributions are indeed quite common. Lyon (2014) elaborates that if $x_1,
    \dots, x_n$ is an independent and identically distributed (i.i.d) random variables
    with mean zero and variance $\sigma^2$, then the distribution of the normalized
    sum


    ```

    $S_n = \frac{x_1 + \dots + x_n}{\sqrt{n}}$

    ```


    is close to a normal distribution for large enough $n$. As $n$ tends to infinity
    and $S_n \to S$, it approaches the normal distribution $\mathcal{N}(S[0,\sigma^2)$.
    This holds whatever distribution of $x_1, \dots, x_n$ looked like in the first
    place, as long as they are independent and identically distributed. This, however,
    is the crux of this explanation.


    While some phenomena we want to describe with probability density functions might
    be the result of independent and identically distributed sums, may be influenced
    by different factors, all of which have their distinct distributions. For example
    a person''s height. There is the potential for growth determined by their genetic
    makeup. This is the nurture part. Nutrition, pollution, diseases, etc. are all
    factors. All are not independent and identically distributed, but height is still
    normally distributed.


    To show that the normal distribution integrates to one, we consider


    ```

    $$\int_{-\infty}^{\infty} \frac{1}{\sqrt{2\pi}\sigma} \exp\left(-\frac{(x-\mu)^2}{2\sigma^2}\right)
    dx$

    ```


    Let $x-\\mu = \sigma y$, we have $dx = \sigma dy$. The range of integration does
    not change with this change of variables. We arrive at


    ```

    $$\frac{1}{\sqrt{2\pi}} \int_{-\infty}^{\infty} \exp\left(-\frac{y^2}{2}\right)
    dy$

    ```'
