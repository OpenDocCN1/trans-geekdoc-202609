    and 3.2 give examples of the probability density and cumulative distribution,
    respectively. For some choices of parameters the shape becomes close to a normal
    distribution.


    For $k=1$, the Weibull distribution becomes the exponential distribution. The
    Weibull distribution is used in reliability engineering and failure analysis.
    The parameter $k$ is interpreted in the following way: if $k>1$, then the failure
    rate increases with time as parts are more likely to fail as time goes on. If
    $k=1$, the failure rate is constant, the system is stable and there is no aging
    process. If $k < 1$, the failure rate decreases with time. Colloquially, this
    means that if it has not failed by now, it is less likely to fail in the future.
