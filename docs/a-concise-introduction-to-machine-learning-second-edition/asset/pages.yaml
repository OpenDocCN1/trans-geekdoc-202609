  md: "# Non-Linear Classification\n\n```\n# Simple two layer Neural Network class.\n\
    class NeuralNetworks:\n    def __init__(self,\n                 output,\n    \
    \             hidden,\n                 tol,\n                 epoch):\n     \
    \   # number of input neurons\n        # number of output neurons\n        # number\
    \ of hidden neurons\n        # tolerance\n        # number of epochs\n       \
    \ # learning rate\n        self.in_size = input\n        self.nout = output\n\
    \        self.hidden = hidden\n        self.tol = tol\n        self.epoch = epoch\n\
    \        self.learning_rate = rate\n        self.weights_in = np.random.randn(self.in_size,\
    \ hidden) initialization\n\n        self.weights_out = np.random.randn(hidden,\
    \ self.nout)\n\n    def forward(self, X):\n        # Add bias and multiply with\
    \ weights\n        self.weights_in += np.random.randn(*self.weights_in.shape)\n\
    \        # Activation function\n        Y = np.tanh(np.dot(X, self.weights_in))\n\
    \        # Add bias and multiply with weights\n        self.weights_out += np.random.randn(*self.weights_out.shape)\n\
    \        # Activation function\n        Y = np.sigmoid(np.dot(Y, self.weights_out))\n\
    \        return Y\n\n    def train(self, X, target):\n        # Propagate the\
    \ training data\n        perm = np.random.permutation(X.shape[0])\n        X =\
    \ X[perm]\n        target = target[perm]\n        Z = np.dot(X, self.weights_in)\n\
    \        Y = np.tanh(Z)\n        # Activation function\n        Y = np.dot(Y,\
    \ self.weights_out)\n        # Errors for all training samples\n        errors\
    \ = Y - target\n        cost = 0.5 * np.sum(errors**2)\n        epoch = 0\n  \
    \      while epoch < self.epoch and cost < self.tol:\n            # Propagate\
    \ errors\n            # For matrix multiplication component\n            # Using\
    \ property of sigmoid derivative\n            delta = errors * Y * (1 - Y)\n \
    \           # Update weights in layer\n            self.weights_out -= np.dot(Y.T,\
    \ delta) * self.learning_rate\n            # Update weights in layer\n       \
    \     delta = np.dot(delta, self.weights_out.T) * (1 - Y**2)\n            self.weights_in\
    \ -= np.dot(X.T, delta) * self.learning_rate\n            # Permute the data\n\
    \            perm = np.random.permutation(X.shape[0])\n            X = X[perm]\n\
    \            target = target[perm]\n            # Add bias, multiply with weights\
    \ and apply\n            # Activation function\n            Z = np.dot(X, self.weights_in)\n\
    \            Y = np.tanh(Z)\n            Y = np.dot(Y, self.weights_out)\n   \
