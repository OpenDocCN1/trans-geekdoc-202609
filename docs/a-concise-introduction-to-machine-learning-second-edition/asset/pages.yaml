  md: "matrix $\\mathbf{\\Sigma}_m$ are drawn from this cluster distribution. $N_m$\
    \ is increased by one. This completes the cluster reassignment for $\\mathbf{v}_n$.\n\
    \nAn iteration is complete, if all samples have been considered in a random order.\
    \ The process is repeated for a fixed number of iterations. Sometimes this form\
    \ of Gibbs sampling is called collapsed Gibbs sampling, since the assignments\
    \ of the other clusters are explicitly encoded when sampling $\\mathbf{z}_n$ for\
    \ $\\mathbf{v}_n$. They are directly encoded in the parameters of the cluster,\
    \ normal-inverse-Wishart distribution for each cluster and thereafter when calculating\
    \ the cluster membership probabilities for $\\mathbf{v}_n$. This reduces the parameters\
    \ sampling to a multiple of $K$.\n\nListings 6.5a is a function implementing this\
    \ clustering algorithm. Other implementations do not draw from the posterior,\
    \ instead set $\boldsymbol{\\mu}_m = \\mathbf{m}_m$ and $\\mathbf{\\Sigma}_m =\
    \ \\mathbf{\\Psi}_m$.\n\nFigure 6.9 shows the results of the method applied to\
    \ the same data as in Figures 6.3a and 6.3b. The algorithm was initialized with\
    \ $\\alpha = K, \\lambda = 1, \nu = 2$. The parameter $m$ was set to the sample\
    \ mean of all, while $\\Psi$ was set to the average squared distance of all samples\
    \ divided by the number of dimensions identity matrix.\n\nFigure 6.9a shows the\
    \ initial cluster assignments. The clusters start to separate after five iterations\
    \ in 6.9. 35 samples are given (up to relabel). With more iterations this number\
    \ reduces. After a hundred iterations 5 samples belong to the wrong cluster. A\
    \ perfect result is generally not possible, since for some samples the posterior\
    \ probabilities $p(z_n=1|\\mathbf{v}_n, \\mathcal{D}(\\mathbf{v}_n), \\alpha,\
    \ \\mathbf{\\lambda}, \nu)$ might be very similar for two clusters, with being\
    \ no near maximal probability. In these cases, it is more useful to return the\
    \ vector of posterior probabilities instead of a cluster assignment.\n\nEven the\
    \ number of clusters is specified, this does not mean that this number of clusters\
    \ is correct. It is an upper bound. Figure 6.10 shows that the algorithm combined\
    \ two clusters into one. Everything, the generation of data as well as the inference\
    \ of clusters, is governed by probabilities, there is always the chance for the\
    \ algorithm to get it right.\n\n# 6.6 The Chinese Restaurant Process\n\nIn all\
    \ above, the number of clusters was fixed at the start of the algorithm. This\
    \ is, however, undesirable, since in general it is not known beforehand, how many\
    \ clusters there are. Ideally, the number of clusters should be determined by\
