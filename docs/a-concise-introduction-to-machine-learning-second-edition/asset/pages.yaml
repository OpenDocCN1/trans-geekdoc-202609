    We can now motivate the *change-of-variables technique*. If $g : \mathbb{R}^K
    \to \mathbb{R}^K$ is an invertible and differentiable function, and $x \in \mathbb{R}^K$
    is also a random variable with probability density function $f_x(x)$, then $y
    = \mathbf{g}(x) \in \mathbb{R}^K$ is also a random variable and its probability
    density function


    $f_y(y) = f_x(g^{-1}(y))|det g^{-1}(y)|$.


    Returning to our example of $y_1 = g_1(x_1, x_2) = x_1 + x_2$ and $y_2 = g_2(x_1,
    x_2) = x_1 - x_2$, the inverse $g^{-1}$ is given by Equation (2.19). The matrix
    of partial derivatives is


    $$\begin{pmatrix} 1 & 1 \ 1/2 & -1/2 \end{pmatrix}$


    and the modulus of its determinant is $1/2$. Both $x_1$ and $x_2$ were assumed
    to be independent and follow the standard normal distribution. Hence,


    $f_y(y) = \frac{1}{\sqrt{2\pi}} \exp\left(-\frac{(y_1+y_2)^2}{2}\right) \frac{1}{\sqrt{2\pi}}
    \exp\left(-\frac{(y_1-y_2)^2}{2}\right)$


    $= \frac{1}{4\pi} \exp\left(-\frac{y_1^2+y_2^2}{4}\right)$


    $= \frac{1}{\sqrt{2\pi}} \exp\left(-\frac{(y_1/\sqrt{2})^2}{2}\right) \frac{1}{\sqrt{2\pi}}
    \exp\left(-\frac{(y_2/\sqrt{2})^2}{2}\right)$'
