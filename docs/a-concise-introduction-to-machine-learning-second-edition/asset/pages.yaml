    # 8.7 Cross-validation


    The analysis of the subset relied on the fact that experiments are repeatable,
    and thus data can easily be generated. However, often the acquisition of data
    is associated with substantial costs, and it is essential to use data well. If
    data are partitioned into complete subsets, one for training and one validation
    set. Multiple rounds of cross-validation are performed, and the results are averaged
    over the rounds. This way the goodness of the model can be assessed. There are
    two types of cross-validation: exhaustive and non-exhaustive. The former employs
    all possible ways to divide the original data into a training and a validation
    set.


    Leave-p out cross-validation all possibilities to choose $p$ validation samples
    from $n$ samples are considered. This means the regression algorithm has to run
    $n^p$ times even for moderate $n$ and $p$ become computationally prohibitive.
    Leave-one out cross-validation is a special case of leave-p out cross-validation
    with $p=1$. In this case the algorithm is run $n$ times.


    In $k$-fold cross-validation the dataset is randomly subdivided into $k$ sized
    subsets. One of these is used as the validation set while the other $k-1$ form
    the training set. The model generation is repeated $k$ times (the folds) with
    each of the subsets used once. The results are then averaged for assessment. All
    data samples are used for both training and validation, and each sample is used
    exactly once for validation. When $k=n$, k-fold cross-validation is the same as
    leave-one out cross-validation.


    # 8.8 Multicollinearity and Principal Component Regression


    Multicollinearity is a problem which arises when one or more predictor variables
    are highly correlated. In this case, one of the basis functions can be modelled
    by the others. One dimension of the model space is redundant. A high degree of
    correlation increases the variance in the coefficients, since different models
    are equivalent. They all model the measurements, but differ in the coefficients.
    As a consequence, small changes in the input data can lead to large changes in
    the model. Perfect multicollinearity means the regressors are linearly dependent,
    that is, one can be expressed by the others. In this case $(\mathbf{D}^T\mathbf{D})^{-1}$
    does not exist, the matrix is singular.'
