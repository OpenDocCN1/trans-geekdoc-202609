    # ### 8.3  Polynomial Regression


    Polynomial regression dates back to Lagrange (1805) and Gauss (1809). Fitting
    a line to the data is a special case of polynomial regression, where the polynomial
    is a linear one. Here $t$ is modelled as a polynomial of degree $M-1$. The dictionary
    is $d_1(x) = d_2(x) = \dots, d_{M-1}(x) = x^{M-2}, d_M(x) = x^{M-1}$ forms a basis
    of polynomials of degree $M-1$. The design matrix is


    $$ D = \begin{pmatrix} 1 & x_1 & \dots & x_1^{M-2} & x_1^{M-1} \ & & \ddots &
    & \ \vdots \ 1 & x_N & \dots & x_N^{M-2} & x_N^{M-1} \end{pmatrix} $$


    Assuming noise, the solution is unique if $N=M$. For various degrees of polynomials
    and numbers of measurements (which are equally spaced in $[0, 2\pi]$), Figure
    8.4 shows polynomial regression for $y=\sin(x)$ and Figure 8.4a shows the regression
    solution is a horizontal line through zero. This is because the locations of measurements
    are all chosen. It is important to ask where to measure to obtain the most information.
    For $N=1$ the measurement point is $\pi$ in the middle of the interval where $\sin(x)=0$
    while for $N=2$ the measurements are at the ends of the interval and for $N=3$
    the points and the middle of the interval are used. With more measurement points
    and higher degrees of polynomials the reconstructions improve. It seems that a
    fifth degree polynomial describes the sine adequately, even though this is an
    infinite sum of powers and lies in an infinite model:


    ```

    $$ \sin(x) = \sum_{n=0}^{\infty} \frac{(-1)^n}{(2n+1)!} x^{2n+1} $$

    ```


    However, this is only the case, because we are considering the interval $[0, 2\pi]$,
    where the convergence properties of the infinite sum are very good, because the
    terms in the sum small quickly due to the factor in the denominator. After three
    terms the approximation to the true value $\sin(x)$ is adequate. If, however,
    when $x=20$ for example, the powers grow much faster than the first. The $20^{th}$
    term in the sum is the first with an absolute value less than one. The solution
    here is to use the identity $\sin(x\pm2\pi) = \sin(x)$ to shift the argument into
    the area of good convergence. However, this uses knowledge about the underlying
    process, which in many'
