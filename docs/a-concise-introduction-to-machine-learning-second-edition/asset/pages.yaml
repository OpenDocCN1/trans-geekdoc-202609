    The dual maximization problem becomes


    ```

    $L(\alpha) = \sum_{n=1}^N \alpha_n - \frac{1}{2}\sum_{i=1}^N\sum_{j=1}^N \alpha_i
    \alpha_j c_i c_j (1 + \mathbf{v}_i^T \mathbf{v}_j)..$

    ```'
