    of $x_1$ and $\sigma$ and the 95% *confidence ellipse* of the target distribution.
    The confidence ellipse gives the area where 95% of the samples of the target distribution
    are expected to lie.


    Figure 3.6a used $x_1 = \mu$ and $\sigma = \sigma_{min}$. The state space is well
