    the entry $D_{ij}$ of $D$ is


    ```

    $$\frac{\partial E(D)}{\partial D_{ij}} = \sum_{n=1}^{N} ((D^T D)^{-1} D^T t_n)_j
    ((D^T D)^{-1} D^T t_n - t_n)_i,$

