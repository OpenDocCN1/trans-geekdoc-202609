    Having $k_m$, we differentiate the last line of 5.7 with respect to $\alpha_m$
    and set to zero, solving for $\alpha_m$. This results in


    ```

    $$\alpha_m = \frac{1}{2} \log \frac{\sum_{i \in C_m} e^{k_m(v_i)} W_{i,m}}{\sum_{j
    \in C_m} e^{k_m(v_j)} W_{j,m}}$

    ```


    The more samples with large weights the correctly the larger $\alpha_m$ and the
    confidence in $k_m$. On the other hand, $k_m$ classifying a sample with incorrect
    weight has little effect, since a small weight indicates that $C_{m-1}$ classifies
    this sample correctly.


    The above relies on the fact that classes are balanced. Imbalanced classes have
    their own challenges. For example, if there are nine times more samples of one
    class than the other class, a classifier which assigns the first class, will be
    correct 90% of the time. However, He & Ma (2013) show how to tackle imbalanced
    classes.


    So far we have not considered the cost of acquiring features. The sources of cost
    can be quite varied. For example, when considering the computational cost, it
    may be the low cost associated with a simple algorithm. At the other end of the
    scale are computationally intensive algorithms which require large storage. There
    is also the difference between cheap and expensive diagnostic tools. It is expensive
    to check the oil level in one''s car, which goes beyond, often a mechanic is required,
    however hourly rate is a considerable cost. Invasive procedures put much more
    strain on a patient than a simple medical test.


    A cascade is a procedure which takes into account the cost. Each stage of a cascade
    of classifiers uses features with predictive power and increasing cost. For example,
    in medical diagnosis a general practitioner does a simple inexpensive test which
    can exclude a diagnosis. Should the test, however, reveal the possibility of an
    underlying health problem, the patient may be referred for further tests.


    Let $C_0$ be the negatives and class $C_1$ be the positives. The number of samples
    in $C_0$ is commonly denoted $N$, while the number of samples in $C_1$ is denoted
    $P$.


    A confusion matrix visualizes the goodness of a classifier by listing the number
    of samples of $C_0$ correctly classified, known as *true negatives*, TN, the number
    of samples of $C_0$ misclassified, which are the *false positives*, FP, on one
    hand, and on the other the number of samples of $C_1$ correctly classified, the
    *true positives*, TP, and the number of samples of $C_1$ misclassified, the *false
    negatives*, FN:


    ```

    $$\begin{pmatrix} TN & FN \ FP & TP \end{pmatrix}$

    ```


    This concept can be easily extended to multiple classes. The $(i,j)$ entry in'
