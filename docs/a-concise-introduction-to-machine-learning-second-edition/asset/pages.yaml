- pgno: 336
  md: '$k = 1, 2, \dots, K$. That is,


    ```

    $M = \sum_{k=1}^{\kappa} m_k.$

    ```


    The number of possible equivalences in relabelling is


    ```

    $$\prod_{k=1}^{K} m_k!$,

    ```


    Hence the number of different ways the same data can have been generated


    ```

    $$\frac{M!}{\prod_{k=1}^{K} m_k!}$

    ```


    The describes a prior distribution $p(Z)$. Also a prior distribution for $\mathbf{W}$
    needs to be specified. This is done by specifying distributions for the elements
    of $\mathbf{W}$. Possible choices are, for example, the normal distribution as
    seen in Figure 2.2 the Laplace distribution in Figure 2.17. Lastly, prior distributions
    for each of the columns of $\mathbf{D}$ need to be defined.


    The learning process updates the parameters of these distributions according to
    the data, and specific instances are sampled. More specifically, $\mathbf{D}$
    is kept fixed while the distributions of $\mathbf{Z}$ and $\mathbf{W}$ are updated.
    After instances of $\mathbf{Z}$ and $\mathbf{W}$ are sampled, they are kept fixed
    and the distributions of $\mathbf{D}$ are updated. Variational passes through
    the data as necessary.


    The process is similar to the Dirichlet process described in Section 6.7. The
    exact workings are however, beyond the scope of this book. Griffiths & Ghahramani
    (2011) provides an introduction and review. Zhou et al. (2012) provides an example
    in image processing, where the blocks building up the image are inferred from
    the image itself in contrast to engineered blocks as shown in Figure 7.1.


    When we infer the underlying process from data, a data sample which does not fit
    in the probabilistic description of the data so far, is interpreted as a new draws
    from the base distribution. Outliers can be dealt with in this way.


