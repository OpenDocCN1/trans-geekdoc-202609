    # 5.4 Decision Trees


    Another intuitive way to classify is using decision trees. These are binary trees
    consisting of nodes and leaves, also known as terminal nodes. Each nonterminal
    node has two branches. A sample enters the tree at the root node of the top. At
    each node, a decision is made on the value of a single feature. If the feature
    is continuous, the decision is based on the question of whether the value is larger
    or smaller than a threshold. The sample traverses the tree down to a leaf. Each
    leaf is associated with a class. Hence, the sample is assigned the class of the
