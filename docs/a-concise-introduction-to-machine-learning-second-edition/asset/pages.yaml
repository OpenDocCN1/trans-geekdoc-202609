  md: 'For the extractive autoencoder, the penalty term


    ```

    $$\Omega_F = \frac{1}{2} \sum_{n=1}^N ||J_{\theta}(\mathbf{x}_n)||^2 = \frac{1}{2}
    \sum_{n=1}^N \text{tr}(J_{\theta}(\mathbf{x}_n)^T J_{\theta}(\mathbf{x}_n)) =
    \sum_{n=1}^N \sum_{m=1}^M \frac{M_{L/2,m}}{2} (\frac{\partial\phi_m}{\partial\mathbf{x}_d})^2$

    ```


    is added to the error function, multiplied by a weight $\lambda$.


    Once trained, the autoencoders produce latent variables $\chi^{(L/2)}$ deterministically
    from which the output is calculated in a deterministic way. The *variational autoencoder*
    takes a different approach. The assumption is that the data $\mathbf{x}_1,\dots,\mathbf{x}_N$
    are sampled from some distribution $p(\mathbf{x})$,


    ```

    $p(\mathbf{x}) = \int p(\mathbf{x}|\chi^{(L/2)}) p(\chi^{(L/2)}) dx\chi^{(L/2)}$

    ```


    Further, it is assumed that $p(\chi^{(L/2)})$ follows a normal distribution with
    mean $\chi$ and variance $\sigma^2 I$, where I is the $D \times D$ identity matrix.
    The prior probability distribution of it is the standard multivariate normal distribution.
    The overall probability $p(\mathbf{x})$ can be estimated by sampling many variables
    $\chi_1^{(L/2)},\dots,\chi_K^{(L/2)}$ and then calculating


    ```

    $p(\mathbf{x}) = \frac{1}{K} \prod_{k=1}^K p(\mathbf{x}|\chi_k^{(L/2)}) = \frac{1}{K}
    \prod_{k=1}^K (2\pi\sigma^2)^{-D/2} \exp\left(-\frac{1}{2\sigma^2} ||\mathbf{x}
    - \chi_k^{(L/2)}||^2\right)$

    ```


    The complete likelihood is estimated as


    ```

    $L = \prod_{n=1}^N \prod_{k=1}^K (2\pi\sigma^2)^{-D/2} \exp\left(-\frac{1}{2\sigma^2}
    ||\mathbf{x}_n - \chi_k^{(L/2)}||^2\right)$

    ```


    Maximizing $L$ is equivalent to minimizing the negative logarithm. However, this
    does not result in a convenient sum of squares as before because of the sum resulting
    from the $p(\mathbf{x})$. Another computational difficulty is that $K$ need to
    be large (in high dimensions) to obtain a good estimate. In addition, sampling
    is not a continuous operation and thus differentiable. So error backpropagation
    cannot be applied.


    Variational autoencoders address these problems in the following way. The first
    step is to reduce $K$ to one $p\phi(\mathbf{x})$, such that only values of $\chi^{(L/2)}$
    are sampled which are samples of $\mathbf{x}$. For this other words, the encoder
    is used. To make this clear in notation the encoder gives an estimate $p\phi(\chi^{(L/2)}|\mathbf{x})$
    as a normal multivariate distribution. The function $\phi$ does not return $\chi^{(L/2)}$,
    but a mean and variance for the distribution of it


    ```

    $$\mu(\mathbf{x}), \Sigma(\mathbf{x}) = \phi(\mathbf{x})$

    ```


    To keep the number of variables manageable, $\Sigma(\mathbf{x})$ is restricted
    to diagonal, that is, $\Sigma(\mathbf{x}) = \text{diag}(\sigma_1^2,\dots,\sigma_{M_{L/2}}^2)$.
    Hence, $\phi$ calculates $2M_{L/2}$ latent variables.'
