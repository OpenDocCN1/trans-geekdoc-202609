    The following idea leads us to maximize the algorithm of the data likelihood:


    +   1. Initialize all parameters of $p_k(v) = p(v|z_k=1)$ and mixing coefficients
    $\pi_k(z_k=1)$.

    2. Evaluate the responsibilities $p(z_{n,k} = 1|v_n)$ for $n=1, \dots, N$ and
    $k=1, \dots, K$.

    3. Maximize:


    ```

    $\sum_{k=1}^K \sum_{n=1}^N p(z_{n,k}=1|v_n) \log(p(z_{n,k}=1)p(v|z_{n,k}=1))$

    ```


    with respect to the parameters of $p_k(v) = p(v|z_k=1)$ and mixing coefficients
    $\pi_k = p(z_k=1)$.


    +   5. Terminate, if all changes are before the convergence threshold. Otherwise
    return step 3


    This method is known as the *Expectation-Maximization* algorithm or EM for short.
    Each step increases the logarithm of the data likelihood. Listing 6.3 uses the
    internal implementation of the EM algorithm in MATLAB-LAB to fit a Gaussian mixture.
    We revisit the Expectation-Maximization technique in the context of regression
    where we consider latent variables. The EM algorithm is widely used and has many
    extensions. McLachlan & Krishna (2007) gives an overview of this.


