- pgno: 120
  md: '![](img/c6c76bf52016db7e78a5e30d4766ef81_120_0.png)


    Figure 4.3: Projection onto the coordinate axes.


    Naive, one could move the separation threshold to the intersection of the confidence
    ellipses. However, this is subjective and a different value of the confidence,
    e.g. 99%, would move this point. Also, since the two ellipses have their axes
    at different angles, it means that the projections of samples of one class are
    more spread out than the projections of the samples of the other class.


    The goal is to find a line of projection such that:


    +   * The projected means of each class are as far apart as possible.

    * The projected samples of each class are as close together as possible.


    In the next section we see how Fisher (1936) tackled this problem.


    # 4.3 Fisher''s and Linear Discriminant Analysis


    Recall, the *sample mean* of $C_i$ is


    ```

    $$\mu_i = \frac{1}{N_i} \sum_{v \in C_i} \mathbf{v}$

    ```


    To take into account the variation of the samples, we define the *sample variance*
    of $C_i$ as


    ```

    $$\Sigma_i = \frac{1}{N_i} \sum_{v \in C_i} (\mathbf{v} - \mathbf{\mu}_i)(\mathbf{v}
    - \mathbf{\mu}_i)^T.$ \quad (4.2)

    ```'
  merge: -1
  img_proc: true
