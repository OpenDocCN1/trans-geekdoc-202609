  md: 'the noise $\epsilon$, which leads to


    ```

    $$\begin{aligned} E[(t-f(x))^2] &= E[t^2 + f(x)^2 - 2tf(x)] \ &= E[t^2] + E[f(x)^2]
    - 2E[tf(x)] \ &= var[t] + var[f(x)] + E[f(x)]^2 - 2E[tf(x)] \ &= \sigma^2 + t(x)^2
    + var[f(x)] + (E[f(x)] - t(x))^2 \ \ &= \sigma^2 + var[f(x)] + (E[f(x)] - t(x))^2
    \end{aligned}$

    ```


    The first term is the irreducible error due to the noise in the data. It is also
    the minimum achievable error. The second term is the *variance*. It varies around
    their mean arising from different snapshots of data vary. In other words, how
    sensitive the model is to a particular dataset. The last term is the square of
    the *bias*. The bias represents the extent to which the average prediction over
    all snapshots differs from the true process. In others, a small bias indicates
    that the generated models are robust to perturbations in the data. In general,
    making one of them smaller, increases the other. This is called the *bias-variance
    trade-off*.


    Note that the analysis so far was only concerned with one particular unseen data
    point $x$. To make a general statement about the model, we need to take the expectation
    with respect to $x$.


    ```

    $E[(t-f(x))^2] p(x)dx = \int \left( \sigma^2 + var[f(x)] + (E[f(x)] - t(x))^2
    \right) p(x)dx$.

    ```


    This simplifies greatly, if $p(x)$ is a uniform distribution. Then, measurements
    $E[f(x)]$ and $var[f(x)]$ are equally likely taken everywhere.


    In general, it is not possible to calculate $E[f(x)]$ and $var[f(x)]$. But it
    can be estimated, if example multiple runs of the experiment are possible. For
