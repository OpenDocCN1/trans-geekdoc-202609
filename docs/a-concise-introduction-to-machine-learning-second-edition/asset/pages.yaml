  md: '# 96 A Concise Introduction to Machine Learning


    ![](img/c6c76bf52016db7e78a5e30d4766ef81_124_0.png)


    Figure 4.5: Fisher''s Discriminant Analysis.


    We are only interested in the direction of $w$, which can be chosen freely. Thus,
    the separation is maximal, if $w$ is a multiple of $(\Sigma_0 + \Sigma_1)^{-1}(\mu_0
    - \mu_1)$. With this choice for $w$ the fraction, which is a scaling factor in
    the formula for $w$, is $1$.


    Listing 4.1 calculates Fisher''s discriminant as specified above, and the resulting
    projection and separation lines are illustrated in Figure 4.5. All samples are
    correctly separated with the exception of one outlier.


    The calculations simplify under the assumption $\Sigma_0 = \Sigma_1 = \Sigma$.
    This is known as *Linear Discriminant Analysis* (LDA). The vector $w$ is set to
    $\Sigma^{-1}(\mu_0 - \mu_1)$, since scaling can be neglected and the separation
    threshold is the projection of the midpoint between the means:


    ```

    $b = w^T\frac{1}{2}(\mu_0 + \mu_1) = \frac{1}{2}(\mu_0^T\Sigma^{-1}\mu_0 - \mu_1^T\Sigma^{-1}\mu_1)$.

    ```


    In this example, which we considered so far, the classes do not have the same
    covariance.




    We now consider more than two classes, while we continue to assume that they have
    the same sample covariance matrix $\Sigma$. Let $K$ be the number of classes.
    For each class $C_i$ we calculate the mean $\mu_i$. Let $\mu_i$ be the mean of
    the'
