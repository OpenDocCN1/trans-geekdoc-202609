  md: "```\nfor i = 1:l\n    % Consider the data in a random order.\n    for n = randperm(n)\n\
    \        v = V(n,:);\n        idx = n;\n        % Remove this sample from the\
    \ data set and update the cluster\n        % it was assigned to:\n        priorlambda\
    \ = LAMBDA(l-1);\n        % Rank one on the Cholesky factorization to preserve\n\
    \        update = sqrt(LAMBDA(l)/priorlambda) + (v' - M(l,:));\n        PSI(:,l)\
    \ = cholputate(PSI(:,l),update,'*');\n        M(l,:) = mvnrnd(M(l,:) + v(:)/priorlambda);\n\
    \        NU(l,:) = NU(l-1);\n        LAMBDA(l) = (LAMBDA(l-1)*M(l,:))/priorlambda;\n\
    \        SIGMA(:,l) = iwishrnd(PSI(:,l)'*PSI(:,l),NU(l));\n        MU(l,:) = mvnrnd(MU(l,:),SIGMA(:,l),LAMBDA(l));\n\
    \        nk(l) = nk(l-1);\n        % Calculate cluster assignment probabilities.\n\
    \        for k = 1:K\n            p(k) = (nk+alpha/K)/(N-1+alpha)...\n       \
    \     mvnpdf(v,MU(k,:),SIGMA(k,:));\n        end\n    end\n        p = sum(p);\n\
    \        % New indicator variable.\n        l = randsample(1:K,1,p);\n       \
    \ idx = l;\n        % Update the cluster the sample is now assigned to.\n    \
    \    postlambda = LAMBDA(l);\n        % Rank one on the Cholesky factorization\
    \ to preserve\n        % definiteness.\n        update = sqrt(LAMBDA(l)/postlambda)\
    \ + (v' - M(l,:));\n        PSI(:,l) = cholputate(PSI(:,l),update,'*');\n    \
    \    M(l,:) = mvnrnd(M(l,:) + v(:)/postlambda);\n        NU(l,:) = NU(l-1);\n\
    \        LAMBDA(l) = postlambda;\n        SIGMA(:,l) = iwishrnd(PSI(:,l)'*PSI(:,l),NU(l));\n\
    \        MU(l,:) = mvnrnd(MU(l,:),SIGMA(:,l),LAMBDA(l));\n        nk(l) = nk(l-1)+1;\n\
    \    end\n```\n\nListing 6.5: Bayes': Gibbs sampling determining the mixture model\
    \ for a fixed number of clusters in MATLAB - iterations. For Python go to https://github.com/ACFaul/Clustering-Python."
