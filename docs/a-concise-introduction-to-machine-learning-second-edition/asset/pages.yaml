  md: "# # Matrix Formulae\n\n\n\n\n\nFor an $m \times m$ invertible, square matrix\
    \ $A$, an $n \times n$ invertible square matrix $D$, an $m \times n$ matrix $B$\
    \ and an $n \times m$ matrix $C$, we we have\n\n```\n$$\nbegin{pmatrix} A & B\
    \ \\ C & D \\end{pmatrix}^{-1} = \\begin{pmatrix} A^{-1} + A^{-1}BE^{-1}CA^{-1}\
    \ & -A^{-1}BE^{-1} \\ -E^{-1}CA^{-1} & E^{-1} \\end{pmatrix} - \\begin{pmatrix}\
    \ F^{-1} & -F^{-1}BD^{-1} \\ -D^{-1}CF^{-1} & D^{-1} + D^{-1}CF^{-1}BD^{-1} \\\
    end{pmatrix}$$\n```\n\nwhere $E = D - CA^{-1}B$ and $F = A - BD^{-1}C$ need to\
    \ be non-singular.\n\n\n\nFor matrices as above,\n\n```\n$$\nbegin{pmatrix} A\
    \ & B \\ C & D \\end{pmatrix} = |A||D - CA^{-1}B| = |A - BD^{-1}C||D|$$\n```\n\
    \n\n\nFor an $m \times m$ invertible, square matrix $A$, an $n \times n$ invertible\
    \ square matrix $C$, an $m \times n$ matrix $B$ and an $n \times m$ matrix $D$,\
    \ we have\n\n```\n$$(A+BCD)^{-1} = A^{-1} - A^{-1}B(C^{-1} - DA^{-1}B)^{-1}DA^{-1}$$\n\
    ```\n\n\n\nIn particular, if $n=1$ in the above Woodbury identity, then $C=c$\
    \ is a scalar and $B=\\mathbf{b}$ and $D=\\mathbf{d}^T$ are vectors. The identity\
    \ becomes\n\n```\n$$(A+c\\mathbf{bd}^T)^{-1} = A^{-1} - \\frac{1}{c-\\mathbf{d}^T\
    \ A^{-1} \\mathbf{b}} A^{-1}\\mathbf{bd}^T A^{-1}$$\n```"
