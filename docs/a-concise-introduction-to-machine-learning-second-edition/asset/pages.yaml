- pgno: 108
  md: "# 80 A Concise Introduction to Machine Learning\n\nsatisfies $fP = f = (1/10,2/5,1/2)$.\
    \ All entries have to be valid probabilities thus $\\alpha, \beta, \\gamma \\\
    in [0, 1]$ and $\\alpha+\beta \\le 1, \\alpha+4\\gamma \\le 4$ and $\beta+4\\\
    gamma \\le 5$.\n\nIf any two of $\\alpha, \beta$ and $\\gamma$ are both on the\
    \ diagonal, meaning that it is impossible to leave that state. This state is called\
    \ *absorbing*. If there is a nonzero probability of every state to reach that\
    \ state, then the Markov chain is an *absorbing Markov chain*. This is not the\
    \ case here, since the other two states change between each other but not to the\
    \ absorbing state. This also means that the chain is not irreducible, since the\
    \ absorbing state cannot be reached from the other two states. Thus in this case,\
    \ the distribution of $x_n$ not converge to the invariant distribution, and the\
    \ Markov chain cannot be used to generate approximate samples.\n\nIf, on the other\
    \ hand, at most one of $\\alpha$ and $\\gamma$ is zero, the Markov chain is irreducible\
    \ and can be used to generate approximate samples for the invariant distribution.\n\
    \nAn example of a Markov chain on the state space of integers is the *dunkard's\
    \ walk*, where the drunkard starts at zero and when taking a step, steps forward\
    \ $x_{n+1} = x_n+1$ with probability $1/2$, or steps backwards $x_{n+1} = x_n-1$\
    \ also with probability $1/2$, independent of how he got in the previous step.\
    \ The probabilities of all states greater than one are zero. This is an example\
    \ of a *random walk*. The transition matrix would be infinite with zero on the\
    \ diagonal and 1/2 on the sub-diagonal and super-diagonal. The state diagram is\n\
    \n![](img/c6c76bf52016db7e78a5e30d4766ef81_108_0.png)\n\nThe expectation $E[x_n]$\
    \ is zero, since the expectation of each individual step is that the drunkard\
    \ stays put. On the other hand, $E[x_n^2] = n$, which implies that the distance\
    \ traveled from the pub is of order of $\\sqrt{n}$. The drunkard's partner will\
    \ find them the pub. It also shows that this random walk is relatively ineffective\
    \ in exploring the state space of the integers.\n\nHowever, if the random walk\
    \ carries on indefinitely, it will reach each infinite number of times. This property\
    \ is known as the *level-crossing phenomenon, recurrence*. A gambler with finite\
    \ money playing a fair game against a bank with an infinite amount of money will\
    \ eventually lose, because the amount he has follows a random walk, and will be\
    \ at some point cross the (zero crossing) level and the game is over.\n\nThe aim\
    \ is to construct a Markov chain, for a given distribution with probability mass\
    \ function or probability density function $f$ is invariant, such that the elements\
    \ of the Markov chain for $n$ large enough are samples of the given distribution."
