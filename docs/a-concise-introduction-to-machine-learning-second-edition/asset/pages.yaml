    subject to the constraints $\alpha_n \geq 0$ and $(\alpha_n\mathbf{w}^T\mathbf{v}_n-1)
    = 0, n = 0, 1, \dots, N.$ This is the **dual representation** of the maximum margin
    problem.


    The samples for $\alpha_n \neq 0$ in the linear combination to form the weight
    vector $\mathbf{w}$ are called the support vectors. This shaped the name under
    which the technique is known. Vapnik & Lerner (1963) invented this in 1964 as
    the *Generalized Primal Method*. The term generalized portrait refers to the centre
    of a sphere which contains patterns belonging to a certain class, but no other
    class. That is, it is a representation of this class.


    Recall that $\mathbf{w} = -b\mathbf{w}$ and $v = \sum_{n=1}^N \alpha_n c_n \mathbf{v}_n$.
