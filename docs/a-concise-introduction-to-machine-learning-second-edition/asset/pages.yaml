- pgno: 1
  md: '“Artificial intelligence technologies will be transformational for our society,
    but not in the manner that the confident proclaimers of utopia and dystopia suggest.
    The changes we expect are sociotechnical; they require careful understanding from
    both the societal and technical perspectives. This is where Anita Faul’s Concise
    Introduction to Machine Learning comes in. With comprehensive coverage of the
    mathematical principles of machine learning, Anita’s book provides the foundation
    of principled choices that students need to make good decisions when we develop
    the beneficial aspects of the technology while curtailing the damaging outcomes.
    This foundation is critical to ensuring that we develop the beneficial aspects
    of the technology. This can only occur through comprehensive understanding of
    the capabilities and limitations of these techniques.”


    Welcome to Anita’s world: a concise introduction to machine learning that builds
    on solid foundations, practical real-world experience and a long experience of
    sharing these principles with students.


    - Neil Lawrence, The DeepMind Professor of Machine Learning. University of Cambridge.
    Senior AI Fellow, The Alan Turing Institute. Visiting Professor of Machine Learning,
    University of Sheffield'
  merge: -1
  img_proc: true
