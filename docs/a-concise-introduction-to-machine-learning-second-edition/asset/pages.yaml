  md: 'In the following sections, we will use different techniques of maximizing with
    respect to the parameters. A note of caution is however appropriate at this point,
    and this is in relation to outliers. Assume that $K=2$ and all data samples are
    roughly grouped together apart one outlier. In the maximization process $p_1$
    will tend to $(N-1)$ while $p_2$ will tend to $1/N$, $p_1(v)$ will roughly degenerate
    the distribution of $N-1$ samples. The likelihood can be increased again and again
    by concentrating the probability mass of $p_1(v)$ more and tightly around the
    outlier. Hence, the likelihood of $p_2(v)$ at the outlier will tend to infinity,
    where the region where $p_2(v)$ is nonzero becomes smaller and its area tends
    to zero. In this leads to the likelihood tending to infinity. Heuristics are used
    to identify such degenerate cases. For example, such outliers could be identified
    and removed from the dataset during the maximization procedure. Or $K$ reduced
    such that it is not possible for outliers to assign their own cluster.


    Something else to be aware of that any solution has $K!$ equivalent solutions.
    These arise by just labelling clusters by permutations of $1,\dots,K$. This equivalence
    is known as *identifiability*, and is important when comparing and interpreting
    models. In this context, however, this is of no importance, since just one of
    the equivalent solutions needs to be found.


    # 6.3 Gaussian Mixture Models


    It is common to choose the distributions $p_k(v), k=1,\dots,K$ in the mixture
    model given in (6.2) from the same family of distributions. As an example we consider
    normal distributions $\mathcal{N}(\mu_k, \mathbf{\Sigma}_k)$. That is


    ```

    $p_k(v) = \frac{1}{\sqrt{(2\pi)^k}}\exp\left(-\frac{1}{2}(v-\mu_k)^T\mathbf{\Sigma}_k^{-1}(v-\mu_k)\right),
    \quad (6.7)$

    ```


    $|\cdot|$ denotes the matrix determinant. The derivative of $p_k(v)$ with respect
    to $\mu_k$ is given by


    ```

    $\frac{\partial}{\partial\mu_k}p_k(v)\mathbf{\Sigma}_k^{-1}(v-\mu_k)$

    ```


    where we use the chain rule, A.2.3 and the symmetry of $\mathbf{\Sigma}_k$. Differentiating
    (6.4) with respect to $\mu_k$ results in


    ```

    $\frac{\partial}{\partial\mu_k}\mathcal{C} = \sum_{n=1}^N\frac{1}{p(v_n)}\pi_k\frac{\partial}{\partial\mu_k}p_k(v)\\n
    \sum_{n=1}^N\frac{1}{p(v_n)}\pi_k p_k(v_n)\mathbf{\Sigma}_k^{-1}(v_n-\mu_k)\\n
    \sum_{n=1}^N p(z_{n,k}=1|v_n)\mathbf{\Sigma}_k^{-1}(v_n-\mu_k)$

    ```'
