  md: 'We see, the mapping $\phi$ never has to be evaluated, only the kernel $k$ rate
    objective function to be maximized becomes


    ```

    $L(\alpha) = \sum_{n=1}^{N} \alpha_n - \frac{1}{2}\sum_{i=1}^{N}\sum_{j=1}^{N}
    \alpha_i \alpha_j c_{ij} \, (1 + k(\mathbf{v}_i, \mathbf{v}_j))$$

    ```


    subject to $\alpha_i \ge 0, i = 1, \dots, N$. The classification is according
    to the sign of


    ```

    $$-b + \sum_{n=1}^{N} \alpha_n c_n \phi(\mathbf{v}_n)^T \mathbf{v} = -b + \sum_{n=1}^{N}
    \alpha_n c_n k(\mathbf{v}_n, \mathbf{v})$$$

    ```


    The kernel trick can be applied to all linear classification methods to separate
    data which are not linearly separable. All methods reduce evaluations of the kernel
    function $k$.


    The kernel function was derived from a higher dimensional inner product. In the
    previous chapter, we viewed the inner product as a measure of the relationship
    between samples. For example, a new sample is classified by whether it is more
    related to the weighted inner product with the support vectors of one than the
    other. The kernel function gives a numeric value describing the relationship between
    two samples.


    Such functions describing samples not need to be solely derived from higher dimensional
    inner product. A necessary and sufficient condition that such a function is suitable
    for our purposes is that the $N \times N$ matrix **K** with $(m,n)$ entry equal
    to $k(\mathbf{x}_m, \mathbf{x}_n)$ is *positive-definite* for any $N$ and for
    any sample $\{\mathbf{x}_1, \dots, \mathbf{x}_N\}$. This means $\mathbf{v}^T K
    \mathbf{v} \ge 0$ for all $\mathbf{v}$. The matrix is called *Gram* or *Gramian
    matrix*. The constant function $k(\mathbf{x}, \mathbf{y}) = c$ for positive $c$
    is a valid kernel, then for any $\mathbf{v} = (\mathbf{v}_1, \dots, \mathbf{v}_N)$


    ```

    $$\mathbf{v}^T K \mathbf{v} = \left(\sum_{n=1}^{N} \mathbf{v}_n\right)^2 \ge 0.$

    ```


    We also have positive semi-definiteness of **K**, if the kernel function is defined
    via an higher dimensional space, because this


    ```

    $$\mathbf{v}^T K \mathbf{v} = \left(\sumsum_{m=1}^{N} \mathbf{v}_m \phi(\mathbf{x}_m)
    \right)^T \left(\sumsum_{n=1}^{N} \mathbf{v}_n \phi(\mathbf{x}_n) \right)$\\

    \nn= \leftleft(\sumsum_{n=1}^{N} \mathbf{v}_n \phi(\mathbf{x}_n) \right\|^2 \ge
    0.$

    ```


    Therefore the inner product itself is a valid kernel.'
