    $$\mu = \left( \frac{2}{3} \right), \quad \Sigma = \left( \begin{array}{cc} 1
    & 3/2 \ 3/2 & 3 \end{array} \right).$


    Listing 3.3 implements Metropolis algorithm for this example. The question is


    Also the start of the Markov chain needs to be chosen carefully to ensure the
    state space is explored in relatively few steps. The technique known as *burn-in*
    discards the first elements of a Markov chain and restarts the chain from the
    state it reached. Strictly speaking, this is not necessary. The elements of a
    Markov chain will be a good set of samples as much as the chain is long enough.
    Listing 3.3 sets the first element $x_1$ to the mean $\mu$ of the target distribution.
