    # 3.4 Markov Chains


    Markov chains are important building blocks for a class of sampling algorithms
    which can be applied to many different distributions and also scale with dimensionality.


    *A Markov chain* is a series of random variables $x_1, \dots, x_N$ *called states*.
    The indices are associated with a sequence in time. A Markov chain of order $m$
    satisfies the following


    > $p(x_n|x_{n-1}, \dots, x_1) = p(x_n|x_{n-1}, x_{n-2}, \dots, x_{n-m})$


    for $n = m+1, \dots, M$. In particular, the $n^{th}$ random variable only depends
    on the $m$ previous variables. A first-order Markov chain satisfies


    > $p(x_n|x_{n-1}, x_{n-2}, \dots, x_1) = p(x_n|x_{n-1})$.


    Each random variable depends only on its predecessor. We will only consider first-order
    Markov chains, since any Markov chain of order $m$ can be transcribed into a first-order
    Markov chain by the tuple $(y_n, \dots, y_{n-m+1})$, where $p(y_n|y_{n-1}, \dots,
    y_k) = p(y_n|y_{k-1})$.


    The probability distribution of the variable $x_1$ needs to be specified. The
    probabilities $T_n(x_n|x_{n-1})$ are called transition probabilities from state
    $n-1$ to state $n$. If they are the same for all $n$, i.e. $T_n(x_n|x_{n-1}) =
    T(x_n|x_{n-1})$ for all, then the Markov chain is called homogeneous.


    Graphically, a first-order Markov chain can be represented as


    ![](img/c6c76bf52016db7e78a5e30d4766ef81_102_0.png)


