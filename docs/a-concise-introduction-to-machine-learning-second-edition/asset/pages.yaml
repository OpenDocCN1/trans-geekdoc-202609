    \ fails to take into account the *variance* within each class, which is how and\
    \ in what way the samples differ from the mean. In Figure 4.5, we have also drawn\
    \ the 95% *confidence ellipse* and its *axes*. This means that 95% of the samples\
    \ lie within the ellipses. The shorter axis is the direction of most variation\
    \ among the samples. The long axis of the confidence ellipse of the iris setosa\
    \ is nearly parallel to the separation line, meaning that the data will be bunched\
    \ together when projected onto the line through the means. The axes of the confidence\
    \ ellipse of the iris versicolor are roughly diagonal to the separation line,\
    \ meaning the projected data is spread out."
