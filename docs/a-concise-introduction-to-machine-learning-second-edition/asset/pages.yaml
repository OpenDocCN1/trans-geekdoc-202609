  md: '![](img/c6c76bf52016db7e78a5e30d4766ef81_32_0.png)


    Figure 1.1: The connected ramps experiment.


    This is an instance of *unsupervised learning*. Galileo realized by himself that
    all the experiments belong to the same class, independent of the angles of the
    two ramps,


    Returning to the experiment with one ramp, Galileo showed that balls of different
    weights would travel the same distance in the same amount of time. He proved that
    weight was not a parameter influencing the experiment. However the times of descent
    for the same distance depend on the inclinations of the plane. The steeper the
    plane, the sooner the experiment is over. Thus this is an example of *feature
    detection* where the inclination angle is a parameter influencing the outcome.
    This is how we try to find which parameters, or in other words features, relevant.


    Human learning is a combination of all these:


    +   **Feature detection**: Our senses experience the world around us. The cat
    in the Blakemore and Cooper experiments never experienced the feature of a vertical
    line.


    +   **Unsupervised learning**: Here we try to make sense of our experiences.


    +   **Deep learning**: We put our experiences in a wider context and draw conclusions.


    +   **Supervised learning**: Here we have external input, but we are also allowed
    to discover things by ourselves.


    +   **Teaching**: This is completely governed by external input.


    Once we have learned something, we can recognize *anomalies*. A child below a
    certain age, will not be impressed by a levitation act. However, once it has discovered
    gravity (though in a rudimentary way than Galileo), it wants to experiment on
    it again and again and again as any parent picking up the toy the child has dropped
    from its high-chair for the thousandth time will testify.


    Machine Learning is all about transferring the various modes of learning we have
    identified here to machines. We are already very good at writing'
