  md: 'Let **V** be the matrix with columns $\mathbf{v}_1, \dots, \mathbf{v}_K$. Then
    $\mathbf{D} = \mathbf{DV}$. The predictions are


    $f = (\mathbf{D}^T\mathbf{D})^{-1}\mathbf{D}^T t = \mathbf{DV}(\mathbf{V}^T\mathbf{D}^T\mathbf{D})^{-1}\mathbf{V}^T)\mathbf{D}^T
    t.$


    Now $\mathbf{D}^T\mathbf{D}$ is the matrix with columns $\lambda_1\mathbf{v}_1,
    \dots, \lambda_K\mathbf{v}_K$, since $\mathbf{v}_1, \dots, \mathbf{v}_K$ are eigenvectors
    of $\mathbf{D}^T\mathbf{D}$. It follows from the orthogonality of $\mathbf{v}_1,
    \dots, \mathbf{v}_K$ that


    $(\mathbf{V}^T\mathbf{D}^T\mathbf{D})^{-1} = \begin{pmatrix} 1/\lambda_1 & 0 &
    \dots & 0 \ 0 & \dots & & \ \vdots & & & \vdots \ 0 & \dots & \dots & 1/\lambda_K
    \end{pmatrix}$


    With this result, we obtain the predicted values $f = (f_1, \dots, f_N)^T:$


    $\mathbf{f} = \begin{pmatrix} 1/\lambda_1 & 0 & \dots & 0 \ 0 & \dots & & \vdots
    \ \vdots & & & \vdots \ 0 & \dots & \dots & 1/\lambda_K \end{pmatrix} \begin{pmatrix}
    (\mathbf{Dv}_1)^T \ \vdots \ \vdots \ (\mathbf{Dv}_K)^T \end{pmatrix} \mathbf{t}$


    $f = \sum_{k=1}^K \frac{(\mathbf{Dv}_k)^T t}{\\lambda_k}\mathbf{Dv}_k,$


    where $f_i = f(\mathbf x)$ is the constructed model. Geometrically, this is the
    projection of the regressor $\mathbf{t}$ onto the space spanned by the columns
    of the new design matrix $\mathbf{D}$. The coefficient for the new regressor $c_i
    = (\mathbf{Dv}_i)^T t/\lambda_i$ in this model.


    To analyse, we decompose the regressor $\mathbf{Dv}_1, \dots, \mathbf{Dv}_K$ into
    one portion lying in the subspace spanned by the columns $a_k$ and a remainder
    $\mathbf{a}$,


    $\mathbf{t} = \sum_{k=1}^K a_k\mathbf{Dv}_k + \mathbf{a},$


    where $\mathbf{a}$ is orthogonal to $\mathbf{Dv}_1, \dots, \mathbf{Dv}_K$. We
    then have


    $c_i = \frac{1}{\\lambda_i}(\mathbf{Dv}_i)^T (\sum_{k=1}^K a_k\mathbf{Dv}_k +
    \mathbf{a}) = \frac{1}{\lambda_i}\sum_{k=1}^K a_k\mathbf{v}_i^T\mathbf{D}^T\mathbf{Dv}_k
    = a_i,$


    as expected because of the orthogonality of $\mathbf{v}_i, \dots, \mathbf{v}_K$.'
