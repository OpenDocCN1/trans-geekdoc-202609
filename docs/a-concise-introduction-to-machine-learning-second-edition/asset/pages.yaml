    While the length of $d_i$ is known, the length of **Da** and **b**, are unknown.

    Consider


    ```

    $$\sigma^2 S_i = \sigma^2 d_i^T \mathbf{C}^T d_i = d_i^T (I - \sigma^{-2}\mathbf{D}\Sigma\mathbf{D}^T)
    d_i$\n = $(\mathbf{a}^T + \mathbf{b}^T) (I - \sigma^{-2}\mathbf{D}\Sigma\mathbf{D}^T)
    (\mathbf{Da} + \mathbf{b})$$\n = \mathbf{a}^T \mathbf{D}^T (I - \sigma^{-2}\mathbf{D}\Sigma\mathbf{D}^T)
    \mathbf{a} + \mathbf{b}$.$

