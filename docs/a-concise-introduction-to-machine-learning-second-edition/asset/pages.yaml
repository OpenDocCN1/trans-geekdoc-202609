  md: 'This is implemented in MATLAB as ClassificationDiscriminant.fit. While sklearn.discriminant_analysis.LinearDiscriminantAnalysis
    is the implementation in Python.


    As can seen in Figure 4.6 some features are more useful than others. We examine
    this further when discussing feature selection. Where classes overlap, it needs
    to be considered whether the samples straying into the region of another class
    are outliers, or whether the classes cannot be separated using these features.


    # 4.5 Online Learning and the Perceptron


    So far we considered learning tasks where the training data is available upfront.
    This is known as batch learning or offline learning. In contrast, in online learning
    the training data becomes available sequentially.


    Recall that we seek a direction vector $\mathbf{w}$ and separation threshold $b$
    such that for sample $\mathbf{v}$


    +   - $\mathbf{w}^T\mathbf{v} < b$ $\Rightarrow$ $\mathbf{v} \in C_0$,

    - $\mathbf{w}^T\mathbf{v} > b$ $\Rightarrow$ $\mathbf{v} \in C_1$.


    By extending the vectors $\mathbf{w}$ to $\mathbf{\hat{w}}=\mathbf{w}-b$ and to
    $\mathbf{\hat{v}}=(1,\mathbf{v})$ this can be rephased to


    +   - $\mathbf{\hat{w}}^T\mathbf{\hat{v}} - b < 0$ $\Rightarrow$ $\mathbf{\hat{v}}
    \in C_0$,

    - $\mathbf{\hat{w}}^T\mathbf{\hat{v}} - b > 0$ $\Rightarrow$ $\mathbf{\hat{v}}
    \in C_1$.


    This way the bias $b$ becomes part of the vector of weights.

    We define the function


    ```

    sgn(x) = \begin{cases} -1 & \text{if } x < 0 \ 0 & \text{if } x = 0 \ 1 & \text{if
    } x > 0 \end{cases}

    ```'
