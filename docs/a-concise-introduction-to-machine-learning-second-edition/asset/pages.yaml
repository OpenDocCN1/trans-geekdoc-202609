  md: '![](img/c6c76bf52016db7e78a5e30d4766ef81_250_0.png)


    bytes taking values between 0 and 255: $[r, g, b]$, where red = $(255, 0, 0)$,
    green = $(0, 255, 0)$, and blue = $(0, 0, 255)$. Linear


    number and additions are allowed. For example


    +   * red + green = (255, 255, 0) = yellow,

    * red + 0.5*green = (255, 128, 0) = orange,

    * red + 0.5*blue = (255, 0, 128) = pink,

    * 0.6*red + 0.8*blue = (153, 0, 204) = purple.


    In regression we estimate the relationship between variables. Or in others, given
    the intensity of red, green, and blue for some samples, is the relationship between
    intensity values and the colour? Can we predict the colour given intensity values,
    as our eyes and brain do?

    Regression has its applications in:


    +   * Computer Vision: e.g. image compression and restoration.

    * Engineering: e.g. machine degradation.

    * Medicine: e.g. epidemiology, mammography.

    * Finance: e.g. volatility prediction, pricing models.

    * Econometrics: e.g. cost and benefit optimization.

    * Hydrology: e.g. flow prediction, ground water level forecasting.

    * Seismology: e.g. soil liquefaction, seismic zones.


    # 8.1 Problem description


    Given scalar measurements $t_1, \dots, t_n$, each measurement depends on parameters
    we know $x_1, \dots, x_n$. In the previous example, these are the intensities
    of red, green, blue. These are quantities which can be measured with more or less
    effort. For example by photocells, geophones, hydrophones, PET and'
