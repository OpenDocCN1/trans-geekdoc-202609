  md: 'Schematically, this can be visualized as


    ![](img/c6c76bf52016db7e78a5e30d4766ef81_331_0.png)


    This is reminiscent of a three layer neural network with sets of hidden neurons
    and the linear activation function, which is the identity, each neuron. The weights
    of the synapses from the input to the first set of hidden neurons, the weights
    of the synapses from the first to the second set of hidden neurons are given by
    the entries of the matrix $D^T$, while the weights of the synapses from the second
    set of hidden neurons to the output neurons are given by the entries of the matrix
    $(D^T D)^{-1}$. Lastly, the weights from the second set of hidden neurons to the
    output neurons are given by the coefficients $c_1,\dots,c_D$. In a neural network,
    however, the weights of the synapses are updated iteratively in a learning process,
    until the output is similar enough to the input. In ordinary least squares, all
    is entirely determined by the matrix $D$, which only depends on the basis functions,
