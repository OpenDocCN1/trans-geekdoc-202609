- pgno: 304
  md: 'If the activation function in neurons is the logistic sigmoid, then the neural
    network is commonly known as multilayer perceptron. However, this is a misnomer,
    since the original perceptron uses the discontinuous step function as activation.
    In the section on backpropagation, we will see the advantages continuity brings.
    To add to the confusion, the term multilayer perceptron is now being used, when
    arbitrary architectures are employed, and for both classification or regression
    tasks. Because of this dilution of the definition, the form of the neural network
    cannot be deduced, the term perceptron is used.


    The neural network is a function mapping the input $x = (x_1, \dots, x_D)^T$ to
    the output $y = (y_1, \dots, y_D)^T$. This mapping is a composition of functions
    with each layer being a linear function composed with an activation function.
    The number of layers can be hundreds or thousands giving rise to the deep learning.
    These many possibilities are powerful; however, there is a case for simplicity,
    because insight into the underlying processes can be gained.


    The input passing through the network is known as forward propagation. Cycles,
    where information could be passed backwards, are not allowed. The architecture
    is strictly feed-forward.


    As the latent variables can be relabeled, which means that neurons are exchanged
    with each other, there are $\prod_{M_l!}$ equivalent neural networks, which give
    the same mapping from input to output. Another equivalence arises from the activation
    functions of the hidden neurons being even, i.e. $h(-x) = h(x)$, or odd, i.e.
    $h(-x) = -h(x)$. If the weights of all synapses going into a particular hidden
    neuron are flipped, then the activation remains the same. On the other hand, if
    the activation is odd, flipping the sign for all synapses going out of this hidden
    neuron also keeps the same. If such flips are possible for all hidden neurons,
    then there are $\prod_{M_l!}$ equivalent neural networks. These are known as weight
    space symmetries.


    ![](img/c6c76bf52016db7e78a5e30d4766ef81_304_0.png)


    Not all synapses need to be present. If the number of synapses is small, the network
    is known as sparse. Excluding certain synapses is a design decision. As are convolutional
    neural networks, if the weight of a synapse becomes zero during the learning process,
    that is, it does not contribute to the final output, this means that the information
    carried by this synapse is deemed unimportant. While the resulting mapping is
    the same excluding the synapse, one is by design, the other is determined from
    the data by learning. It is also possible for a synapse to stretch over two layers.
    This is known as a skip-connection.'
  merge: -1
  img_proc: true
- pgno: 305
  md: "The larger number of synapses, the more training data is necessary to train\
    \ the network, since we need enough information to decide the values of the weights.\n\
    \nThe training of the neural network consists of adjusting the output for the\
    \ training data is deemed good enough. Again, the measure of goodness depends\
    \ on the task at hand.\n\n+   Recall that for regression, we assume that the data\
    \ are under proceeding with normally distributed noise with mean zero and variance\
    \ $\\sigma^2$. In this context, the process is modeled by the neural network.\
    \ That is, it normally distributed with the mean being the output $y$ for input\
    \ $x$ and $\\sigma^2$, where $I$ is the $K \times K$ identity matrix. The mean\
    \ depends on the weights of all the synapses in the network, which we denote by\
    \ the vector $w$, in short $y(x, w)$. The likelihood of the data can be calculated\
    \ as\n\n```\n$\\mathcal{L} = \\prod_{n=1}^N (2\\pi\\sigma^2)^{-K/2} \\exp\\left(-\\\
    frac{1}{2\\sigma^2}\\|t_n - y(x_n, w)\\|^2\\right)$\n```\n\nThe weights are determined\
    \ by maximizing the likelihood. This is equivalent to minimizing the negative\
    \ logarithm of the likelihood\n\n```\n$-\\log\\mathcal{L} = \\frac{N}{2}\\log\\\
    sigma^2 + \\frac{N}{2}\\log(2\\pi) + \\frac{1}{2\\sigma^2}\\sum_{n=1}^N \\|t_n\
    \ - y(x_n, w)\\|^2$\n```\n\nIt is conventional to state this minimizing the error\
    \ function\n\n```\n$E(w) = \\frac{1}{2}\\sum_{n=1}^N \\|y(x_n, w) - t_n\\|^2$\n\
    ```\n\nRecall that this is a sum of squares.\n\n+   For binary classification,\
    \ $t_n$ is zero, if the sample with features $x_n$ belongs to the negative class,\
    \ and one otherwise. Since the single output of the neural network is interpreted\
    \ as the probability of belonging to the positive class, the likelihood function\
    \ in this is given by\n\n```\n$\\mathcal{L} = \\prod_{n=1}^N y(x_n, w)^{t_n}(1\
    \ - y(x_n, w))^{1-t_n}$\n```\n\nTaking the negative logarithm gives the cross-entropy\
    \ error function\n\n```\n$E(w) = -\\sum_{n=1}^N t_n\\log y(x_n, w) + (1 - t_n)\\\
    log(1 - y(x_n, w))$\n```"
  merge: -1
  img_proc: true
- pgno: 306
  md: '+   If the network tackles K separate, binary classification tasks on the same
    data, the error function is


    ```

    $E(\mathbf{w}) = -\sum_{k=1}^{K} \sum_{n=1}^{N} t_{n,k} \log y_k(\mathbf{x}_n,
    \mathbf{w}) + (1 - t_{n,k}) \log (1 - y_k(\mathbf{x}_n, \mathbf{w}))$$

    ```


    where $t_{n,k}$ is the $k^{th}$ component of $\mathbf{t}_n$ and $y_k(\mathbf{x}_n,
    \mathbf{w})$ is the output of the $K^{th}$ neuron, when $\mathbf{x}_n$ is the
    input. It is the sum of the errors of the $K$ individual binary classification
    tasks.


    +   For multiple classes, $y_k(\mathbf{x}_n, \mathbf{w})$ is taken as the probability
    of the sample with features $\mathbf{x}_n$ belonging to the $k^{th}$ class and
    $\mathbf{t}_n$ is a 1-of-$K$ representation. The likelihood of the data is


    ```

    $$\mathcal{L} = \prod_{n=1}^{N} \prod_{k=1}^{K} y_k(\mathbf{x}_n, \mathbf{w})^{t_{n,k}}$

    ```


    As before, the negative logarithm leads to the error function


    ```

    $E(\mathbf{w}) = -\sum_{k=1}^{K} \sum_{n=1}^{N} t_{n,k} \log y_k(\mathbf{x}_n,
    \mathbf{w})$$$

    ```


    This looks very similar to the one above, but now only one of $t_{n,k}$, $k=1,
    \dots, K$ is nonzero.


    We illustrate the capability of neural networks by training a two layer neural
    network with three hidden neurons to represent the function $1+x+\sin x$. The
    biases are modelled explicitly with dummy neurons which always have the value.
    The network diagram is


