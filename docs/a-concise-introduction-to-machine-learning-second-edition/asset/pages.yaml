    \ = -\\frac{ND}{2}\\log(2\\pi) - \\frac{N}{2}\\log|\\mathbf{C}| - \\frac{1}{2}\\\
    sum_{n=1}^N \text{tr}(\\mathbf{C}^{-1}(\\mathbf{v}_n - \\mu)(\\mathbf{v}_n - \\\
    mu)^T)$\n```\n\nsince the sum of traces is the trace of the sum of matrices. With\
    \ the definition (7.1) for the sample covariance matrix, this becomes\n\n```\n\
    $\\mathcal{L} = -\\frac{N}{2}[D(2\\pi) + \\log|\\mathbf{C}| + \text{tr}(\\mathbf{C}^{-1})]$\n\
    ```\n\nThis needs to be maximized with respect to $\\mathbf{W}$. Let $\\mathbf{w}_1,\
    \ \\dots, \\mathbf{w}_K$, then\n\n```\n$\\mathbf{C} = \\sigma^2\\mathbf{I} + \\\
    sum_{k=1}^K \\mathbf{w}_k\\mathbf{w}_k^T$.\n```\n\nThe inverse of $\\mathbf{C}$\
    \ is\n\n```\n$\\mathbf{C}^{-1} = \\sigma^{-2}(I - \\sum_{k=1}^K \\frac{\\mathbf{w}_k\\\
    mathbf{w}_k^T}{\\sigma^2 + \\mathbf{w}_k^T\\mathbf{w}_k})$ (7.3)\n```\n\nThis\
    \ can easily be by multiplying the two expressions and using the fact that the\
    \ columns of $\\mathbf{W}$ are mutually orthogonal. We consider the derivative\
    \ with respect to the $j^{th}$ column $\\mathbf{w}_j$. To this end\n\n```\n$\\\
    mathbf{C}_{-j} = \\sigma^2\\mathbf{I} + \\sum_{k=1, k\neq j}^K \\mathbf{w}_k\\\
    mathbf{w}_k^T$.\n```\n\nThen $\\mathbf{C} = \\mathbf{C}_{-j} + \\mathbf{w}_j\\\
