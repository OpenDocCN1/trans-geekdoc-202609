- pgno: 334
  md: 'to this data sample, the columns of the $D \times M$ matrix $\mathbf{D}$ represent
    latent features, and $\mathbf{c}_n$ is the sample specific vector of coefficients.


    Commonly, this is represented as


    $\mathbf{T} = \mathbf{CD}^T + \mathbf{E},$


    where $\mathbf{T}$ is the $N \times D$ matrix of data samples with each row containing
    one sample, $\mathbf{C}$ is the $N \times M$ matrix of coefficients, and $\mathbf{E}$
    is a $N \times D$ matrix with each entry being drawn from a normal distribution
    with zero mean and variance $\sigma^2$. In this context, $\mathbf{D}$ is the *factor
    loading matrix* and its columns are the factor loadings, while $\mathbf{C}$ is
    the *coordinate matrix*.


    From the data viewpoint, we allow the number of columns in $\mathbf{D}$, where
    $M$ is $M$, to be infinite. Infinity is conceptually a difficult concept, it can
    be dealt with by imposing that only a finite, small number of entries in each
    row of $\mathbf{C}$ are nonzero. In practical terms, this means that we represent
    the amount of data and each data sample as a finite linear combination of features.
    Other features from the infinite set are those we have not yet encountered in
    our data.


    To this end, $\mathbf{C}$ is written in terms of a *binary indicator matrix* $\mathbf{Z}$
    and a *weight matrix* $\mathbf{W}$. That is,


    $\mathbf{C} = \mathbf{Z} \odot \mathbf{W},$


    where $\odot$ denotes the element-wise Hadamard product. Choosing dishes from
    an Indian buffet, hence the Indian Buffet Process (IBP). The customers are indexed
    by $1, \dots, N$. There are infinitely many dishes, but not all have been chosen
    yet. These are the latent features indexed by $m$. $M$ is the number of different
    dishes chosen so far. The number of dishes the first customer chooses is drawn
    from a Poisson distribution with rate $\lambda$, which is the expected number
    of dishes each customer chooses. In $\mathbf{Z}$, the first entry of the first
    row is set to one and $M = i_1$, where $i_1$ is the number of distinct dishes
    chosen so far. The amount he takes from each dish is drawn from the first row
    of $\mathbf{W}$.


    The $n^{th}$ customer chooses from $\mathbf{M}$ any of which the previous customers
    have already chosen with probability $j_m/n$, if dish m $j_m$ times. In other
    words, $j_m$ is the number of entries in column $m$ above row $n$ in $\mathbf{Z}$.
    If there is a particular dish $m$, then one is placed in the $m^{th}$ column of
    the $n^{th}$ row of $\mathbf{Z}$, new dishes, where $i_n$ is drawn from a Poisson
    distribution with rate $\lambda/n$. These are indicated by ones in columns with
    numbers $M+1, \dots, M+i_n$, in the $n^{th}$ row. $M$ is updated to $M+i_n$. Again,
    the amount of each dish is drawn from the $n^{th}$ row of $\mathbf{W}$.


    Since $\lambda/n$ decreases with every new customer, the $n^{th}$ probability
    that he will choose even just one new dish decreases, but does not become zero.
    This means that if our model does not have enough features to explain the data,
    there is nonzero probability to create a feature which will help explain the data.'
