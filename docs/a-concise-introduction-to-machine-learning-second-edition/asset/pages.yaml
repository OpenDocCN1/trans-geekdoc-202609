  md: "# 8.4 Ordinary Least Squares\n\nRecall that we assume the dictionary of basis\
    \ functions is fixed. How best to solve t = Dc + ε generally? One approach is\
    \ to consider the probabilistic nature of the noise. Remember, the $\\epsilon_i$\
    \ are independent and identically distributed random variables with zero mean\
    \ and variance $\\sigma^2$. The likelihood of observing t the model specified\
    \ by D, and $\\sigma^2$ is\n\n```\n$\\mathcal{L}(t|D, \\sigma^2) = (2\\pi\\sigma^2)^{-N/2}\\\
    exp\\left(-\\frac{1}{2\\sigma^2}(t-Dc)^T(t-Dc)\\right).$\n```\n\nThe likelihood\
    \ quantifies the difference between the predictions Dc and the targets t be explained\
    \ by the noise.\nSince the formula involves the exponential function, it makes\
    \ sense to consider the logarithm of the likelihood known as log likelihood:\n\
    \n```\n$\\log L(t|D, \\sigma^2) = -\\frac{N}{2}\\log 2\\pi\\sigma^2-\\frac{1}{2\\\
    sigma^2}(t-Dc)^T(t-Dc).$\n```\n\nA suitable choice for c is the one which maximizes\
    \ the log likelihood. The first term is $\\|c\\|^2$, which is equivalent to minimizing\n\
    \n```\n$(t-Dc)^T(t-Dc) = ||t-Dc||^2 = \\sum_{n=1}^N (t_n-d(x_n)^T c)^2,$\n```\n\
    \nsince this positive is subtracted. Here $|\\cdot||$ denotes the Euclidean norm\
    \ or $L_2$ norm and $t_n-d(x_n)^T c$ is called the $n^{th}$ residual. It is the\
    \ difference between the $n^{th}$ target and the prediction for it. Note that\
    \ $d(x_n)^T$ is the $n^{th}$ row of D. The sum is known as sum of squared residual\
    \ (SSR), error sum of squares (ESS), or residual sum of squares (RSS). The technique\
    \ is known as Ordinary Least Squares (OLS), since we use squares of\n\nWriting\n\
    \n```\n$(t-Dc)^T(t-Dc) = D^TDc - 2c^TD^Tt + t^Tt,$\n```\n\nwe can differentiate\
    \ with respect to c using. A.2.3 and set to zero to find the extremum,\n\n```\n\
    $D^TDc = D^Tt.$\n```\n\nSince $D$ is an $N \times M$ matrix, $D^T D$ is an $M\
    \ \times M$ matrix. If the inverse $(D^TD)^{-1}$ exists, then the choice for c\
    \ is\n\n```\n$c = (D^TD)^{-1}D^Tt.$\n```\n\nHowever, even if the inverse exists,\
    \ the inversion might be ill-conditioned leading to large numerical errors. Numerical\
    \ analysis provides many methods to Solve Equation (8.2) safely, for example see\
    \ (2016)."
  merge: -1
