    #  6.4 Expectation-Maximization


    In this section we introduce a general technique to maximize


    ```

    $$\mathcal{L} = \sum_{n=1}^N \log p(\mathbf{v}_n) = \sum_{n=1}^N \log (\sum_{k=1}^K
    \pi_k p_k(\mathbf{v}_n))$

    ```


    We start by introducing the formula (6.8), (6.9) and (6.6) for $\mu_k$, $\Sigma_k$
    and $\pi_k$ of Gaussian mixtures. Maximizing a different function


    ```

    $$\sum_{n=1,k=1}^N p(z_{n,k}|mathbf{v}_n) [\log \pi_k + \log p_k(\mathbf{v}_n)]\n=
    \sum_{n=1}^N \sum_{k=1}^K p(z_{n,k}|\mathbf{v}_n) [\log \frac{1}{2}|2\pi\Sigma_k|
    - \frac{1}{2}(\mathbf{v}_n-\mu_k)^T\Sigma_k^{-1}(\mathbf{v}_n-\mu_k)]$

    ```


    with respect to $\mu_k$, $\Sigma_k$ and $\pi_k$ to the constraint that the mixing
    coefficients to zero, arrives at exactly the same update formula.


    To see this, we first derive the derivatives


    ```

    $$\frac{\partial}{\partial\mu_k} = \sum_{n=1}^N p(z_{n,k}|\mathbf{v}_n)\Sigma_k^{-1}(\mathbf{v}_n-\\mu_k)$,\n$$\frac{\partial}{\partial\Sigma_k}
    = \frac{1}{2}\sum_{n=1}^N p(z_{n,k}|\mathbf{v}_n)[\Sigma_k^{-1}-\Sigma_k^{-1}(\mathbf{v}_n-\\mu_k)(\mathbf{v}_n-\\mu_k)\Sigma_k^{-1}]$

    ```


    employing A.2.3, A.2.4 and A.2.8. Setting these to zero and solving for $\mu_k$
    and $\Sigma_k$, respectively, gives the update formula for $\pi_k$, we need to
    introduce a Lagrange multiplier:


    ```

    $$\frac{\partial}{\partial\pi_k} [\mathcal{L} + \lambda(\sum_{k=1}^K\pi_k-1)]
    = \sum_{n=1}^N p(z_{n,k}|\mathbf{v}_n)\frac{1}{\pi_k} + \lambda$

    ```'
