  md: 'Applying this to the setting at hand,


    ```

    $$p(\mathbf{c}|\mathbf{D}) = \frac{p(\mathbf{t}|\mathbf{c})p(\mathbf{c})}{p(\mathbf{t})}$$

    ```


    In other words, we answer the question: What is the probability of the coefficients
    given the mean observed data?


    Since the noise is i.i.d. with mean 0 and variance $\sigma^2$, we can write for
    the probability of $t$ given the design matrix $\mathbf{D}$, coefficients $\mathbf{c}$
    and noise variance $\sigma^2$


    ```

    $$p(\mathbf{c}|\mathbf{D}, \sigma^2) = (2\pi)^{-N/2}\sigma^{-N}\exp\left(-\frac{\{\mathbf{t}-\mathbf{Dc}\|^2}{2\sigma^2}\right)$$

    ```


    We define a *prior* distribution for $c$ using all information apart from the
    data itself, quantifying our belief about the coefficients. For example, a simple
    assumption is that each coefficient $\alpha$ is *a priori* normally distributed
    with mean zero and variance $\alpha^{-1}$. The multivariate distribution of $c$
    is given by


    ```

    $$p(\alpha) = \frac{\alpha^{M/2}}{(2\pi)^{M/2}}\exp\left(-\frac{\alpha}{2}c^2\right)$$

    ```


    In the absence of any other knowledge, this is one possible assumption. $\alpha$
    is a *hyperparameter* and known as the *precision* of the distribution. If $\alpha$
    becomes very large, the distribution becomes peaked at its mean and we have more
    confidence in the value than $\alpha$ is small and the width of the distribution
    large.


    After observing $N$ samples of the dependent variable $t$, the *posterior distribution*
    of the coefficients $c$ is given by


    ```

    $$p(\mathbf{c}|\mathbf{D}, \alpha, \sigma^2) \propto p(\mathbf{t}|\mathbf{D},
    \sigma^2)p(\mathbf{c})$$

    ```


    An estimate of $c$ could be obtained by choosing the $c$ where the posterior distribution
    or equivalently its logarithm is maximal,


    ```

    $$log p(\mathbf{c}|\mathbf{D}, \sigma^2) \propto \log p(\mathbf{t}|\mathbf{D},
    \sigma^2) + \log p(\mathbf{c})$$$

    ```


    The first term is exactly the log likelihood (8.1), which is maximized when $|\mathbf{t}-\mathbf{Dc}\|^2$
    is minimal. The second term is


    ```

    $$-\frac{\alpha}{2}\|c\|^2 + \frac{M}{2}(\log \alpha - \log(2\pi))$$$

    ```


    and can be regarded as the negative of a penalty term. In fact, taking the negative
    logarithm of the posterior distribution and minimizing instead of maximizing,
    recreate regression.


    For a more general prior distribution of $c$, let $\alpha$ contain all parameters
    governing the joint distribution $p(\mathbf{c}|\mathbf{D}, \alpha, \sigma^2)$.
    We remove the dependency on the latent variables by integrating over the coefficients
    $c$. Thus averaging'
