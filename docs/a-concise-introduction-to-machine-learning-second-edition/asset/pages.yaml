  md: "![](img/c6c76bf52016db7e78a5e30d4766ef81_213_0.png)\n\n![](img/c6c76bf52016db7e78a5e30d4766ef81_213_1.png)\n\
    \n![](img/c6c76bf52016db7e78a5e30d4766ef81_213_2.png)\n\n(a) Initial cluster\n\
