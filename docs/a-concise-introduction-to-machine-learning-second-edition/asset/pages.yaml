    # 9.5 Relationship to Other Techniques


    In this section, we examine how neural networks relate to some of the techniques
    we have seen before. We already touched on this in Section 5.5 with regards to
    classification where a neural network describes different regions as sets of points
    lying on different sides of a set of lines.


    In Chapter 8, the assumption is that all samples are generated by an underlying
    process of the form


    ```

    t = Dc + \epsilon

    ```


    where $\epsilon$ is additive Gaussian noise with zero mean and variance $\sigma^2$,
    the $D \times M$ matrix **D** is the design matrix, **c** is the vector of coefficients,
    which depends on both **D** and **t**.


    Recall the prediction of the ordinary least squares solution, where **D** is chosen
    beforehand,


    ```

    Dc = D(D^T D)^{-1}D^T t

    ```'
