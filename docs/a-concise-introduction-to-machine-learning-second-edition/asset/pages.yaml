    However, as the centres move, the indicator vectors $z_n$ have to be adjusted.
    This is by minimizing $J$ with respect to all $z_n$. This will cause the centres
    to move again. The algorithm alternates between moving the centres $\mu_k$ and
    recalculating $z_n$. It terminates, after moving the centres, none of the indicator
    vectors changes.


    Looking at (6.1), note that $\sum_{n=1}^{N} z_{n,k}$ gives the number of samples
    for $\mu_k$ which is the closest centre, while $\sum_{n=1}^{N} z_{n,k}v_n$ is
    the sum of those samples. $\mu_k$ is the mean of the samples assigned to this
    cluster. The algorithm arrives at a local minimum of $J$. However, the solution
    is highly dependent on the initialization of the cluster centres. These can be
    the samples be randomly assigned clusters and the initial cluster centres be calculated
    as the mean of these random assignments. This dependency on initial values, the
    algorithm is run (possibly in parallel) with different initializations. After
    convergence, the result with the lowest value of $J$ is chosen.


