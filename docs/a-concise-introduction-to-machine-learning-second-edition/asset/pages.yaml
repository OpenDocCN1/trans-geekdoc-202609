  md: '![](img/c6c76bf52016db7e78a5e30d4766ef81_137_0.png)


    Figure 5.1: Quadratic Discriminant Analysis.


    Taking the logarithm, we arrive at


    ```

    $$\mathcal{L}(v \in C_0(v)) = \frac{1}{2}\log|\Sigma_0|-\frac{1}{2}(v-\mu_0)^T\Sigma_0^{-1}(v-\mu_0)$$

    $\mathcal{L}(v \in C_1(v)) = \frac{1}{2}(v-\mu_1)^T\Sigma_1^{-1}(v-\mu_1) +\frac{1}{2}(\log|\Sigma_1|
    + \mu_1^T\Sigma_1^{-1}\mu_1 - \mu_0^T\Sigma_0^{-1}\mu_0)$$

    +v^T(\Sigma_0^{-1}-\Sigma_1^{-1}) + \frac{1}{2}v^T(\Sigma_1^{-1}-\Sigma_0^{-1})v
    = 0.$

    ```


    Thus the boundary between classes is given by a quadratic form of


    ```

    $$\mathbf{A} = \frac{1}{2}(\Sigma_1^{-1}-\Sigma_0^{-1})$$\$

    $\mathbf{b} = \Sigma_0^{-1}\mu_0-\\Sigma_1^{-1}\mu_1$$$

    $\c = \frac{1}{2}\log|\Sigma_0| + \mu_1^T\Sigma_1^{-1}\mu_1 - \mu_0^T\Sigma_0^{-1}\mu_0$$

    ```


    ```

    $$\mathbf{v}^T\mathbf{A}\mathbf{v} + \mathbf{b}^T\mathbf{v} + c = 0.$

    ```


    with


    This is the *Quadratic Discriminant Analysis* (QDA).\nIn the special case of two
    features, the boundaries are conic sections, that is, a line, circle, ellipse,
    parabola or hyperbola. Listing 5.1 applies the Quadratic Discriminant Analysis
    to Fisher’s iris data and the result can be seen in Figure 5.1.'
