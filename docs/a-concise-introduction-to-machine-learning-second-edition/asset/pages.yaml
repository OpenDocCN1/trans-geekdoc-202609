  md: "```\ndef CRP(size,alpha0,mean0,lambda0,scale,df):\n    ***Input:\n    size:\
    \      number of data points to be generated,\n    alpha0:    concentration parameter,\n\
    \    mean0:     location vector,\n    lambda0:   mean fraction,\n    scale:  \
    \   scale matrix,\n    df:        degree of freedom.\n    Output:    data vector,\n\
    \    idx:       index vector which process generated the sample,\n    means: \
    \    array of the means of all processes,\n    covs:     array of the covariance\
    \ matrices of all processes***\n    # Generate distribution of first process.\n\
    \    covs = ss.iwishart.rvs(df=df, scale=scale)\n    mean = np.multivariate_normal(mean=mean0,\
    \ cov=lambda0)\n    # Generate first sample and reshape so that features match\n\
    \    # hyperparameters can be combined.\n    data = np.multivariate_normal(mean=means,\
    \ cov=covs)\n    idx = np.array([0])\n    comp_size = np.array([2,1])\n    cov\
    \ = np.reshape(covs,(2,1))\n    mean = np.reshape(means,(1,2))\n    # Initialize\
    \ the vector of probabilities which process generates\n    # sample or where a\
    \ new process is generated.\n    for i in range(size):\n        # Sample from\
    \ which the next data point is taken or\n        comp_idx = np.random.choice(len(p),p)\n\
    \        if comp_idx < len(p):\n            # Generate new sample from existing\
    \ process.\n            sample = np.reshape(np.multivariate_normal(mean=mean[comp_idx],\
    \ cov=covs[comp_idx]),(1,2))\n            data = np.concatenate((data,sample),(1,2))\n\
    \            mean = np.concatenate((means,data[comp_idx]),(1,2))\n        else:\n\
    \            # Generate new mean and covariance of new process.\n            cov\
    \ = ss.iwishart.rvs(df=df, scale=scale)\n            mean = np.multivariate_normal(mean=mean0,\
    \ cov=lambda0)\n            # Append to the means and covariances.\n         \
    \   covs = np.concatenate((covs,np.reshape(cov,(2,2,1,1))),1)\n            mean\
    \ = np.concatenate((means,np.reshape(mean,(2,1,1))),1)\n            # Generate\
    \ new sample.\n            sample = np.reshape(np.multivariate_normal(mean=mean[idx],\
    \ cov=covs[idx]),(1,2))\n            data = np.concatenate((data,sample),(1,2))\n\
    \            comp_size = np.concatenate((comp_size,[1]))\n            # Update\
    \ vector of probabilities.\n            p = np.concatenate((comp_size/(n+2+alpha0),alpha0/(n+2+alpha0))\n\
    \    return data, idx, means, covs\n```\n\nListing 6.2: Generating data from a\
