    # 9.3 Autoencoders


    In this section, we examine a group of neural networks known as autoencoders (AE).
    Their main feature is that the number of output neurons $K$ equals the number
    of input neurons $D$, i.e. $K = D$, and the purpose is the reconstruction of the
    input data, i.e. $\mathbf{y} \approx \mathbf{x}$. The number of layers $L$ is
    even, meaning the number of sets of hidden neurons is odd. The first $L/2$ layers
    encode the data. The latent variables of the set of hidden neurons numbered $L/2$
    represent the'
