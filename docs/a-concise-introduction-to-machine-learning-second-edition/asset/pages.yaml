    distribution are given as $\alpha,\mu$,


    ```

    $$\alpha = \alpha_0 = \sum_{k=1}^K \alpha_k$,$

    $$\$\mu = \left(\frac{\alpha_1}{\alpha_0}, \dots, \frac{\alpha_K}{\alpha_0}\right)^T$\quad
    (2.16)

    ```


    In this case, $\alpha$ is known as the (single) concentration parameter, where
    $\mu$ is the base distribution. It is also the expectation of the distribution
    and satisfies the constraint


    ```

    $$\mu_k = 1. \text{ for } k=1,\dots,K$

    ```


    With this notation,


    ```

    $var[x_j, x_k] = \frac{1}{\alpha+1}\mu_j(1-\\mu_j)$,$

