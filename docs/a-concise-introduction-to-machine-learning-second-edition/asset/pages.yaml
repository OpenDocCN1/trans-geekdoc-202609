- pgno: 323
  md: "# Feature Learning ■ 295\n\nActivation function sigmoid function.\n\n```\n\
    def sigmoid(a):\n    return 1 / (1 + np.exp(-a))\n\n# derivative of activation\
    \ function\ndef sigmoid_deriv(y):\n    return y * (1 - y)\n\nclass NeuralNetwork:\n\
    \    def __init__(self, nin, nout, children, epochs, learning_rate):\n       \
    \ self.nin = nin # number of input neurons\n        self.nout = nout # number\
    \ of output neurons\n        self.children = children # number of hidden neurons\n\
    \        self.epochs = epochs # number of epochs\n        self.learning_rate =\
    \ learning_rate\n        self.weights = []\n        self.biases = []\n       \
    \ for i in range(self.children):\n            # We et al. (2015) initialization\n\
    \            self.weights.append(np.random.randn(self.nin, self.children)) # i\
    \ is the bias neuron\n            self.biases.append(np.zeros(self.children))\n\
    \        for i in range(self.nout):\n            self.weights.append(np.random.randn(self.children,\
    \ self.nout))\n            self.biases.append(np.zeros(self.nout))\n\n    def\
    \ forward(self, x):\n        # Blend bias with weights\n        h1 = np.dot(x,\
    \ self.weights[0]) + self.biases[0]\n        a1 = sigmoid(h1)\n        # Blend\
    \ bias with weights\n        h2 = np.dot(a1, self.weights[1]) + self.biases[1]\n\
    \        a2 = sigmoid(h2)\n        return a2\n\n    def train(self, x, y):\n \
    \       # train the data.\n        perm = np.random.permutation(x.shape[0])\n\
    \        for epoch in range(self.epochs):\n            for i in perm:\n      \
    \          # Blend bias with weights, apply activation function.\n           \
    \     h1 = np.dot(x[i], self.weights[0]) + self.biases[0]\n                a1\
    \ = sigmoid(h1)\n                # Blend bias with weights\n                h2\
    \ = np.dot(a1, self.weights[1]) + self.biases[1]\n                a2 = sigmoid(h2)\n\
    \                # Errors for all training samples.\n                err = a2\
    \ - y[i]\n                # Errors for all samples.\n                cost = 0.5\
    \ * np.sum(err**2)\n                # First multiplication component, second matrix\n\
    \                d2 = err * sigmoid_deriv(a2)\n                d1 = np.dot(d2,\
    \ self.weights[1].T)\n                # Update weights in second layer\n     \
    \           self.weights[1] -= self.learning_rate * np.dot(a1.T, d2)\n       \
    \         self.biases[1] -= self.learning_rate * np.sum(d2, axis=0)\n        \
    \        # Update weights in first layer\n                self.weights[0] -= self.learning_rate\
    \ * np.dot(x.T, d1)\n                self.biases[0] -= self.learning_rate * np.sum(d1,\
    \ axis=0)\n        return epoch\n```\n\nListing 9.2: Two layer autoencoder in\
    \ Python. MATLAB to get\n\nhttps://github.com/ACFaul/Feature-Learning-Matlab."
