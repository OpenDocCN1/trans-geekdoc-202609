    \ determinant lemma, the determinant of $\\mathbf{C}$ is\n\n```\n$|\\mathbf{C}|\
    \ = |\\mathbf{C}_{-j}|(1 + \\sigma^{-2}\\mathbf{w}_j^T\\mathbf{C}_{-j}^{-1}\\\
