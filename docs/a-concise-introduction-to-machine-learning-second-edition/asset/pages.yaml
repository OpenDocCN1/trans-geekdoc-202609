  md: 'The posterior distribution of $\mathbf{\Sigma}$ is proportional to the product
    of the likelihood and the prior probability density function given in (6.11) by
    Bayes'' rule. Because of the proportionality, we drop all multiplicative constants
    in both. These are the factors $(2\pi)^{nd/2}$, $|\Psi|^{p/2}$, $

    u^{-d/2}$ and $1/\Gamma_d(

    u)$. Hence, the posterior is proportional to


    ```

    $|\mathbf{\Sigma}|^{N/2} \exp \left(-\frac{1}{2} \sum_{n=1}^N \mathbf{v}_n^T \mathbf{\Sigma}^{-1}
    \mathbf{v}_n\right) |\mathbf{\Sigma}|^{-(v+d)/2} \exp \left(-\frac{1}{2} \text{tr}(\mathbf{\Sigma}^{-1})\right)$

    ```


    To simplify this, we use properties of determinants and traces of matrices. The
    product of determinants of two matrices is the determinant of product of matrices.
    Therefore, $|\mathbf{\Sigma}|^{N/2}|\mathbf{\Sigma}|^{-(v+d)/2} = |\mathbf{\Sigma}|^{-(N+v+d)/2}$.
    The expression $\sqrt{\sum_{n=1}^N \mathbf{v}_n^T \mathbf{\Sigma}^{-1} \mathbf{v}_n}$
    is a scalar and the trace of a scalar is the scalar itself. Further the trace
    is invariant to a cyclic permutation of the order of multiplication. Hence, $\sum_{n=1}^N
    \mathbf{v}_n^T \mathbf{\Sigma}^{-1} \mathbf{v}_n = \text{tr}(\mathbf{\Sigma}^{-1}
    \sum_{n=1}^N \mathbf{v}_n \mathbf{v}_n^T)$. Using these identities, the posterior
    is proportional to


    ```

    $|\mathbf{\Sigma}|^{-(N+v+d)/2} \exp \left(-\frac{1}{2} \sum_{n=1}^N \mathbf{v}_n^T
    \mathbf{\Sigma}^{-1} \mathbf{v}_n + \text{tr}(\mathbf{\Sigma}^{-1})\right)$

    ```


    ```

    $|\mathbf{\Sigma}|^{-(N+v+d)/2} \exp \left(-\frac{1}{2} \text{tr}\left((\mathbf{\Psi}
    + \sum_{n=1}^N \mathbf{v}_n \mathbf{v}_n^T\right) \mathbf{\Sigma}^{-1}\right)\right)$

    ```


    since the sum of traces is the trace of sum of matrices. Apart the normalizing
    constant, this is exactly the probability density function


    ```

    $$\mathbf{\Psi}^{-1}(\mathbf{\Psi} + \sum_{n=1}^N \mathbf{v}_n \mathbf{v}_n^T
    + \mathbf{N})$

    ```


