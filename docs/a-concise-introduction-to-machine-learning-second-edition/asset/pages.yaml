    \ ellipses.\n\nThe last expression in the above is an *outer product*. The outer\
    \ product is the matrix multiplication of a column vector with a row vector, while\
    \ the inner product is row vector times column vector. In two dimensions between\
    \ vectors $v_1$ and $v_2$ that this is\n\n```\n$v_1 v_2^T = \begin{pmatrix} v_{11}\
    \ \\ v_{12} \\end{pmatrix} \\begin{pmatrix} v_{21} & v_{22} \\end{pmatrix} = \\\
    begin{pmatrix} v_{11}v_{21} & v_{11}v_{22} \\ v_{12}v_{21} & v_{12}v_{22} \\end{pmatrix}$.\n\
    ```\n\nA $2 \\times 1$ matrix is a $2 \\times 2$ matrix. The outer product is\
    \ the simplest form of a *tensor product*. The use of tensors in Machine Learning\
    \ is different from the use of tensors in, for example, physics. Textbooks on\
    \ tensors in Machine Learning are tied to particular programming languages and\
    \ implementations. We therefore refrain from a recommendation here. This text\
    \ will continue with the use of matrices.\n\nIf $M$ is the number of features\
    \ (in which example $M=2$), then $\\mu_i$ is a vector with $M$ elements and the\
    \ $j^{th}$ entry is the $j^{th}$ feature of samples in class $C_i$. On the other\
    \ hand, $\\Sigma$ is an $M \\times M$ matrix. The $(j, j)$ diagonal entry is the\
    \ variance of the $j^{th}$ feature of samples in class $C_i$. The variance describes\
    \ how spread the values of feature are are. The $(j, k)$ off-diagonal entry is\
    \ the covariance between the $j^{th}$ and $k^{th}$ feature of samples in class\
    \ $C_i$. The covariance describes how much different features influence each other."
