- pgno: 322
  md: '# 9.4 Autoencoder Example


    We apply a sparse autoencoder to the MNIST dataset of handwritten digits as gathered
    by LeCun et al. (1998) and compare and link this method to the techniques we have
    already encountered. For this data, D = 784, and the components of x are the individual
    pixel values.


    The simplest autoencoder has two layers. Schematically, it is represented as


    ![](img/c6c76bf52016db7e78a5e30d4766ef81_322_0.png)


    In this simple case, the encoder and decoder functions are


    $\phi(\mathbf{x}) = h^{(1)}(\mathbf{W}^{(1)}\mathbf{x} + \mathbf{b}^{(1)})$ and
    $\psi(\mathbf{z}) = h^{(2)}(\mathbf{W}^{(2)}\mathbf{z} + \mathbf{b}^{(2)})$.


    If $\mathbf{W}^{(2)}=\mathbf{W}^{(1)T}$, then the weights are tied. However, in
    this example we do not enforce this, let them be independent from each other.


    Both $h^{(1)}$ and $h^{(2)}$ are chosen to be the logistic sigmoid elementwise.
    Since the output of logistic sigmoid is $[0, 1]$ and autoencoders reconstruct
    the pixel values of the input images needed to be scaled to lie between zero and
    one as a pre-processing step.


    Listing 9.2 is a minimal implementation with no regularization of this network.
    Of course, the native implementations of MATLAB and Python are preferable, especially
    for efficiency and regularization. However, it is also good practice to experiment
    with different algorithms directly. Listing 9.3 applies to a range of digits in
    the MNIST dataset.


    Valuable insight can be gained from visualizing the activations and latent variables
    are separated spatially. This is easily possible for $M=1, 2$ or $3$. In the following,
    we show one technique that this can be done for larger $M$. The activations in
    the output layer are given by


    ```

    $\mathbf{z} + \mathbf{b} = z_1\mathbf{w}_1^{(2)} + \dots + z_M\mathbf{w}_M^{(2)}
    + \mathbf{b},$

    ```'
