  md: 'Schematically, this can be drawn as


    # Changing dynamically with the addition and deletion of basis functions


    ![](img/c6c76bf52016db7e78a5e30d4766ef81_333_0.png)


    Again, it can be viewed as a neural network with two sets of hidden neurons. As
    before, the weights from the input neurons to the first set of hidden neurons
    are given by the entries of **D^T**, and from the second set of hidden neurons
    to the output neurons of **D**. The weights between the two sets of hidden neurons
    are given by the entries of $\sigma^{-2}\Sigma$. **$\Sigma = (A + \sigma^{-2}D^TD)^{-1}$**
    and since the entries of A are determined by maximizing the evidence of design
    D and $t_1, \dots, t_M$. The number of hidden neurons in each set, $M$, can change
    dynamically which is equivalent to the addition and deletion of basis functions.
    Equally, the number of input and output neurons increases, if samples are taken
    at previously unseen locations.




    In the last section of latent features was fixed by the number of neurons in hidden
    layers. What about a technique of inferring a model with variable dimension? In
    this section, we consider the data generation process similar to the Chinese Restaurant
    Process in Section 6.6 where the number of clusters is unknown. Now the dimension
    of the latent feature space is unknown.


    Let $t_1, \dots, t_M$ be a set of data samples in a $D$-dimensional space. We
    assume that for $n=1, \dots, N$


    ```

    $t_n = Dc_n + \epsilon_n$,

    ```


    where $\epsilon_n$ is additive Gaussian noise with zero mean and variance $\sigma^2I$
    specific'
