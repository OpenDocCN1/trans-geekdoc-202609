    can be added to the model. We also want to avoid near linear dependency, or in
    other words small values of $||b||$.

    Since the decomposition was orthogonal,


    ```

    $||d_i||^2 = ||\mathbf{Da}||^2 + ||\mathbf{b}||^2$.

