- pgno: 109
  md: '# 3.5 Markov Chain Monte Carlo


    Let


    $$f(\mathbf{x}) = \frac{f(\mathbf{x})}{c_f}$


    Duplicating the chain we want to sample from, where value of the normalizing constant
    $c_f$ is not necessarily known. We construct a Markov chain by using a proposal
    distribution $g(\mathbf{x}, \mathbf{x})$, which describes the probability of drawing
    $\mathbf{x}$ when $\mathbf{x}$ is given. That is, the next element in the Markov
    chain $\mathbf{x}_{n+1}$ is drawn from the distribution $g(\mathbf{x}_n, \mathbf{x})$
    where $\mathbf{x}_n$ is the current element in the Markov chain, which are only
    homogeneous if $g(\mathbf{x}, \mathbf{x})$ is independent of $\mathbf{x}$.


    If, addition, the proposal distribution is symmetric, i.e. $g(\mathbf{x}, \mathbf{x})
    = g(\mathbf{x}, \mathbf{x})$ for all, a candidate $\mathbf{x}^*$ is drawn from
    the proposal distribution and accepted with probability


    $$\min(1, \frac{f(\mathbf{x}^*)}{f(\mathbf{x})}) = \min(1, \frac{f(\mathbf{x})}{f(\mathbf{x}^*)})$


    Note if $f(\mathbf{x}^*) \geq f(\mathbf{x})$, the candidate is certain to be kept.
    If the candidate sample is accepted, then $\mathbf{x}_{n+1} = \mathbf{x}^*$, otherwise
    $\mathbf{x}_{n+1} = \mathbf{x}_n$. This is known as the \Metropolis algorithm.


    Duplicating the chain is in contrast to rejection sampling. In practical implementations,
    no extra copies of sample are stored. Instead a counter of how often the sample
    was is updated. This counter acts as weighting, for example; the expectation is
    calculated. As long as $f$ is nonzero over the entire state space, there is always
    a nonzero probability of $\mathbf{x}_{n+1} = \mathbf{x}_n$ and thus the Markov
    chain is aperiodic. If, addition, $g(\mathbf{x}, \mathbf{x})$ is nonzero over
    the entire state space, the Markov chain is obviously irreducible.


    The elements of the Markov chain, $\mathbf{x}_1, \mathbf{x}_2, \dots$, are not
    independent samples in most cases, because successive samples are highly correlated
    if $g(\mathbf{x}, \mathbf{x})$ depends on $\mathbf{x}$. In fact, the chain represents
    a random walk through the state space. For practical purposes, taking every $m^{th}$
    element from the chain approximates for $m$ sufficiently large. This is known
    as thinning.


    Symmetry of $g(\mathbf{x}, \mathbf{x})$ can be achieved by letting $g(\mathbf{x},
    \mathbf{x})$ describe the normal distribution with mean $\mu$ and variance which
    is $\sigma^2$ times the identity matrix, in this case


    $$\g(\mathbf{x}, \hat{\mathbf{x}}) = \frac{1}{\sqrt{2\pi\sigma^2}} \exp(\mathbf{x}-\hat{\mathbf{x}})^T(\mathbf{x}-\hat{\mathbf{x}}))
    = g(\hat{\mathbf{x}}, \mathbf{x})$


    This choice for the proposal distribution is common, since techniques to generate
    samples from the standard normal distribution such as the Box-Muller transform
    are readily available, and these samples only have to be scaled by $\sigma^2$
    and translated by $\mathbf{x}$.'
