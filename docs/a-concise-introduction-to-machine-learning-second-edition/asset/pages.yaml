  md: 'multivariate distributions of **f**. Defining $\mathbf{d}(\mathbf{x}_i)^T =
    (d_1(\mathbf{x}_i), \dots, d_M(\mathbf{x}_i))$ as the vector of all basis functions
    evaluated at a specific point $\mathbf{x}_i$, the $(i, j)$ entry of the covariance
    matrix is


    $$\alpha^{-1}\mathbf{d}(\mathbf{x})^T\mathbf{d}(\mathbf{x}) \quad \quad \quad
    \mathbf{d}(\mathbf{x})^T\mathbf{A}^{-1}\mathbf{d}(\mathbf{x})$


    We have seen Section 5.2 that these expressions define kernels. Consider the case,
    in our model $d_1(\mathbf{x}) = 1$ and $d_{d+1}(\mathbf{x}) = x_d$, the $d^{th}$
    component of $\mathbf{x}$ for $d=1, \dots, D$. This means the kernel is linear
    polynomial. In this case,


    $$\alpha^{-1}\mathbf{d}(\mathbf{x})^T\mathbf{d}(\mathbf{x}) = \alpha^{-1}(1 +
    \mathbf{x}^T\mathbf{y})$


    Thus is this linear kernel. If we modify this


    $$\mathbf{k}(\mathbf{x}, \mathbf{y}) = \sigma_0^2 + \mathbf{x}^T\mathbf{y}$


    where $\sigma_0$ controls the inhomogeneity of the kernel, we arrive at the **product
    kernel**. On the other hand, if the kernel is the square of the inner product,


    $$\mathbf{k}(\mathbf{x}, \mathbf{y})^2 = (\mathbf{x}^T\mathbf{y})^2 = \sum_{d=1}^D
    x_{i,d}x_{j,d} \sum_{e=1}^D x_{i,e}x_{j,e} \\ \sum_{d,e=1}^D (x_{i,d}x_{i,e})(x_{j,d}x_{j,e})
    = \sum_{d=1}^D d_d(\mathbf{x}_i)d_d(\mathbf{x}_j) = \mathbf{d}(\mathbf{x})^T\mathbf{d}(\mathbf{y})$


    if we define $M = D^2$ basis functions as the product of any two components, $d_{d,e}(\mathbf{x})
    = x_d x_e$. In other words, the functions are all $D$-dimensional **monomials
    of degree** 2.


    More generally, including a term of the inner product to the power of $p$ means
    that monomials of degree $p$ are part of the model space. As the number of monomials
    increases quickly with degree, the kernel is a compact way to write this. A correspondence
    between kernels and basis functions is not straightforward in general.


    In general, covariance matrices arising in a Gaussian process are completely specified,
    if the $(i, j)$ entry is given by evaluating a kernel function at $\mathbf{x}_i$
    and $\mathbf{x}_j$. The covariance matrix is then the Gram matrix and positive
    definite. The above are specific choices of kernels. This choice of kernel depends
    on the application. Other possibilities are:


    **Gaussian kernel** $\mathbf{k}(\mathbf{x}, \mathbf{y}) = \exp (-\frac{\{\{\mathbf{x}-\mathbf{y}\|^2}{2l^2})\)$,
    where $l > 0$ is the **length scale**. This kernel is infinitely differentiable.'
