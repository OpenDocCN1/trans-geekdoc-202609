    times and each resulting network evaluated on a validation set. The one performing
    best on the validation is then chosen. The final network is assessed on a test
    set. In Chapter 7 we see how their performance is enhanced when continuous, non-linear
    activation functions are used.


    The results of neural networks are sensitive to the choice of


    +   - the number of layers,

    - the connection pattern,

    - the initialization of weights and

    - the activation functions and their parameters.'
