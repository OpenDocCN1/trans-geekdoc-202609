    distribution for process. We now take the view that there is a chance the sample
    is generated by a completely new process, which is different to the processes
    which generated the previous samples.


    When considering distributions of distributions, we imagined a distribution $G$
    over the set of all possible pairs $(\mu, \Sigma)$ which can be generated from
    the base distribution $G_0$. Since there is only a finite number of clusters,
    $G$ is zero everywhere apart from the specific pairs $(\mu_k, \Sigma_k)$ where
    it has a point probability mass $\pi_k$. This view is now changed so that the
    point probability masses are situated in a set of low locality. In this sea a
    new probability point can appear, lowering all other probabilities.


    It is more convenient to take a sequential view of the generation of samples.
    For the first sample, a process and its distribution are generated. The second
    sample can either be generated from the same distribution as the first sample
    or from a new process. We need to define a probability for these two cases. It
    is known as dispersion, concentration. Let $\alpha$ be an additional parameter
    governing this process strength. The probability that the second sample is generated
    by the first process is $1/(1+\alpha)$, while the probability that it is generated
    by a new process is $\alpha/(1+\alpha)$. If $\alpha = 1$, then a new process is
    generated, while for $\alpha < 1$ the already existing process is more likely
    to be used to generate the second sample.


    When generating the $n^{th}$ sample, it is generated by


    ```

    $$\begin{aligned} k \text{ with probability} &= \frac{n}{n-1+\alpha} \ a \text{
    with probability} &= \frac{\alpha}{n-1+\alpha} \end{aligned}$

    ```


    where $n_k$ denotes the number of samples generated by process $k$ so far. When
    summing the samples generated by each process over all processes, the result is
    $n-1$. Therefore these probabilities sum to 1.'
