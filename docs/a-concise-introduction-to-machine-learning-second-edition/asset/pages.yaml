- pgno: 335
  md: 'In each row, the expected number of nonzero entries is $\lambda$. This is true
    for the first row, since the expectation of a Poisson distribution is given by
    the rate $\lambda$. Assume that the expected number of nonzero entries for rows
    $1, \dots, n-1$ is $\lambda$. The expected number of nonzero entries in the $n^{th}$
    row is


    ```

    $$\mathbb{E}\left[\sum_{m=1}^{M} \frac{j_{m}}{n} + \frac{\lambda}{n}\right] =
    \mathbb{E}\left[\sum_{m=1}^{M} \frac{m-1}{n} + \frac{\lambda}{n}\right]$\n = \mathbb{E}\left[\sum_{k=1}^{n-1}
    \sum_{m=1}^{M} Z_{km}\right] + \frac{(n-1)\lambda}{n} = \lambda$

    ```


    where $Z_{km}$ denotes the $(k, m)$ entry in $Z$. By induction, this proves that
    the expected number of nonzero entries in each row is $\lambda$.

    Since the probability of choosing a particular dish depends on the number of times
    it has been the choice of previous customers, we encounter the rich-get-richer
    phenomenon. Since the number of customers $N$ is finite, so is the number of possible
    dishes $M$. Chosen by many customers these relate to features which are common
    in most of the data samples. These are sometimes referred to as *global features*,
    while those chosen only by a few customers indicate *local features*, which can
    be used to distinguish between samples.


    This process of generating the data is independent of the order in which the customers
    arrive. A different order of customers multiplying $Z$ by a permutation matrix
    from the left changes the row order. We follow this up with a permutation matrix
    from the right which swaps columns so that the number of leading zeros in each
    column is increasing from left to right, because each subsequent customer can
    choose new dishes. Such a permutation is equivalent to relabeling the dishes.
    The weights of $W$ is multiplied by the same permutation matrices from left and
    $Z$. These permutations are not performed explicitly, but to explain that the
    choice of order in which samples are generated does not affect the final outcome.
    It is known as


    left-ordering of binary matrices. More specifically, given an order of customers
    (rows of $Z$), the columns of $Z$ are ordered by their binary nature. Each column
    is interpreted as a binary number with the most significant bit in the first row
    and the least significant one in the last. The columns are ordered in decreasing
    magnitude of these binary numbers. Two columns might represent exactly the same
    binary. This means two dishes were chosen by exactly the same set of customers.
    In this case, we have freedom of choice in the order of columns representing the
    same binary number.


    There are $M!$ possible labellings of the dishes. We need to divide this by the
    number of possible equivalences. Let $K$ be the number of distinct columns and
    $m_{k}$ be the number of occurrences of the distinct column $k$ for'
