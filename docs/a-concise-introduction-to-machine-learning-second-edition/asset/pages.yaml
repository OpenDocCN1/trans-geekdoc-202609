  md: 'Summing this over all samples and dividing by N gives the average squared distance
    by which a sample is moved, when restricting the representation to the principal
    subspace,


    ```

    \sum_{n=1}^N \sum_{d=K+1}^D (v_n^T w_d)^2 = \sum_{d=K+1}^D w_d^2 \left( \frac{1}{N}
    \sum_{n=1}^N v_n^T v_n \right)

    = \sum_{d=K+1}^D w_d^T (S + \mu\mu^T) w_d\n= \sum_{d=K+1}^D \lambda_d d + \sum_{d=K+1}^D
    (\mu^T w_d)^2

    ```


    where we used Equation (2.10) as an alternative calculation of the covariance
    matrix. The first part is the sum over the D - K smallest eigenvalues of Σ, while
    the second part is the squared distance between the mean and its projection. As
    more eigenvectors are used as principal components, the average-squared distance
    between samples and their projection becomes smaller. This means the reconstructions
    become more accurate. We will revisit this, when covering principal component
    regression in Section 8.8.


    The eigenvalues and eigenvectors of Σ can be used to perform a technique as whitening
    or sphering the data. This transforms the data to a different feature space where
    the samples have zero mean and the covariance is the identity matrix. If measurements
    of different features differ in magnitude or the variability of features is disparate,
    this can become necessary. However, after such a transformation eigenvalues of
    the covariance matrix are one. Principal Component Analysis and any other technique
    which relies on distinct eigenvectors of the sample covariance matrix are no longer
    applicable.


    After whitening the transformed value for v_n,


    ```

    v_n = \Lambda^{-1/2}W^T(v_n - \mu)

    ```


    where W is the orthogonal matrix formed from the eigenvectors w_d as columns and
    \Lambda^{-1/2} is the matrix with \lambda_d^{1/2} on the diagonal. This is well
    defined, if Σ has no zeros, which is the case, if the samples are distinct and
    N > D. The mean of the subtraction of v_1,...,v_N is zero. On the other hand,
    the covariance matrix of the transformed data is


    ```

    \sum_{n=1}^N v_n v_n^T = \sum_{n=1}^N \Lambda^{-1/2}W^T(v_n - \mu)(v_n - \mu)^T
    \Lambda^{-1/2}\n= \Lambda^{-1/2}W^T\Sigma\Lambda^{-1/2} = \Lambda^{-1/2}\Lambda\Lambda^{-1/2}
    = \mathbf{I}.

    ```


    All this relies on stable and efficient methods to find eigenvalues and eigenvectors.
    Faul (2016) describes some algorithms as examples. It is important to keep the
    dimensionality and size of the dataset in mind. To illustrate this,'
