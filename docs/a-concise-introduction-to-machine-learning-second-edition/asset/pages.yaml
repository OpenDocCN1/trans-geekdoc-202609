    fall in the shaded area between the curves of $cg$ and $f$. The $x$-position of
    the retained points are samples from the distribution governed by $f$. To keep
    the number of discarded points low, the area of the areas has to be as small as
    possible. In other words, the ratio of $cg$ and $f$ needs to be as close to one
    as possible. This ratio is $c$, since both'
