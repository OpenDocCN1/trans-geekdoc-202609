- pgno: 21
  md: '# Foreword


    In the panic and excitement around the advent of chat bots based on generative
    AI, it can be difficult to understand how to react. But this technology is not
    really artificial intelligence; it is a reflection of our natural intelligence
    delivered by machine learning. It is an emulation of our intelligence. The field
    of machine learning has its fundamental roots in the technologies of the Second
    World War when radar detection of planes. In that domain operators struggled to
    separate the responses they received into signal and the noise. Today''s reader
    may also be forgiven for feeling they face the same challenge when it comes to
    understand AI.


    So how should we proceed? One way of cutting the noise is to return to first principles.
    The character of the noise can be exposed when we remind ourselves of mathematical
    and statistical foundations of the methods, and we use those principles to support
    us when we are being distracted by the shifters, grifters, and changers that emerge
    in the wake of such exciting new technology.


    Artificial intelligence technologies will be transformed for our society, but
    not in the manner that the confident proclaimers of utopia and dystopia suggest.
    The changes we expect require careful understanding from both the societal and
    technical perspectives. This is where Anita''s Concise Introduction to Machine
    Learning comes in. With comprehensive coverage of the mathematical principles
    of machine learning, Anita''s book provides the foundation of principled choices
    that students need to make good decisions when we the noise noise the signal.
    This foundation is critical to ensuring that we develop beneficial aspects of
    the technology while curtailing the damaging outcomes. This can only occur through
    comprehensive understanding of the capabilities and limitations of these techniques.


    Welcome to Anita''s world: a concise introduction to Machine Learning that builds
    on solid foundations, practical real-world experience and a long experience of
    sharing these principles with students.


    Neil Lawrence

    DeepMind Professor of University of Cambridge

