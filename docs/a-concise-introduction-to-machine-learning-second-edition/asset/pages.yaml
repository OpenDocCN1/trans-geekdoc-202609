  md: '# # Introduction


    When thinking about Machine Learning, it seems prudent to start thinking about
    how we learn. King Frederick II (1194 – 1250) was Holy Roman Emperor and King
    of Sicily in the 13th century. King Frederick was a passionate patron of the sciences
    and arts. He spoke six languages which were Latin, Sicilian, German, French, Greek
    and Arabic. He desired to determine the “God given” language, as translated by
    Bairde et al. (1986), that Frederick bade


    > > ...foster-mothers and nurses to suckle and bathe and wash the children, but
    in no ways to practice or speak with them; for he would have learned whether they
    would speak the Hebrew language (which had been first), or Greek, or Latin, or
    Arabic, or perchance the tongue of their parents whom they had born. But he laboured
    in vain, for the children could not live without clappings of the hands, and gestures,
    and gladness of countenance,


    In other words the physical needs of the children were satisfied, but they were
    raised without any human interaction. It is doubtful whether this is a true account,
    since this is the only account and Salimbene was a political opponent of Frederick
    II. Nevertheless, nobody doubts that sensory stimulation and experiences are essential
    for learning in any respect.


    Blemore & Cooper (1970) experimented with kittens. The kittens were brought up
    in a dark room and only brought out at certain times and placed in an environment
    with either only horizontal or vertical lines. Kittens brought up in the horizontal
    environment showed no reaction to vertical lines. There was no brain activity.
    Indeed, when the inclination of horizontal line was changed gradually towards
    a vertical line the brain activity became less and less.


    The experiment showed that only the environment presents to the brain is learned.
    This is an efficient preparation for the future. This is also true for human vision.
    Australian aborigines the sharpest vision ever'
