  md: 'Its solution depends solely on the inner product between samples. The classification
    is according to the sign of


    ```

    $\mathbf{w}^T \tilde{\mathbf{v}} = \sum_{n=1}^{N} \alpha_{c_n} \mathbf{v}_n^T
    = \sum_{n=1}^{N} \alpha_{c_n} (1 + \mathbf{v}_n)^T = -b + \sum_{n=1}^{N} \alpha_{c_n}
    \mathbf{v}_n^T = -b+\mathbf{w}^T\mathbf{v}$.

    ```


    Again, this only depends on the inner products between the training samples and
    the new sample we weighted by $\alpha_n$. The inner product can be viewed as measuring
    the relationship between the two samples. Through the multiplication by $c_n$,
    the inner products from one class are added, and the others are subtracted. Depending
    on where the samples are tipped (Figure 4.10), the new sample is deemed more related
    to the samples of one class than the other, and classified accordingly.


    Since $c_n$ is only nonzero for the support vectors, it is important how the new
    sample relates to the support vectors. This is a major advantage of the Support
    Vector Machine, since it results in a *sparse* model of the classes. Only the
    support vectors are necessary for future classifications.


    We will see the advantages of recaptasing the problem by examining the relationships
    between samples when considering non-linear classification and the *kernel*. Here
    the inner product between samples assigns a numeric value to the relationship.
    The inner product is a counterintuitive measure. For a given fixed sample, samples
    lying on the line orthogonal to it are given the value zero in this relation.
    Samples lying on the same side of this line as the given sample are a positive
    value, while samples on the other side are a negative value. The absolute values
    increase with the distance from this line. So the numeric value assigned to the
    relationship increases with the distance.


    As we will later, different measures for the relationship can be chosen. Listing
    4.3 uses the Support Vector Machine implementation to calculate the support vectors
    and plot the separation line. The result can be seen in Figure 4.11.


