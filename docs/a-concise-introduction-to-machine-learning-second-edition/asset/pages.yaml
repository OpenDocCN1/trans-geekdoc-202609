    From these numbers we can calculate the *sensitivity*, also known as *recall*,
    *true positive rate (TPR)* and *probability of detection*, as the fraction of
    positive samples correctly classified.


    ```

    TPR = \frac{TP}{P}

    ```


    The specificity or true negative rate (TNR) is the fraction of negative samples
    correctly identified:


    ```

    TNR = \frac{TN}{N}

    ```


    The false negative rate, also known as *miss rate* is given by


    ```

    FPR = \frac{FN}{P} = 1 - TPR$.

    ```


    It quantifies the percentage of time a positive sample is overlooked. Not identifying
    a patient who has an underlying health problem, can have disastrous consequences
    for that patient. Another commonly used term is the *fall-out* or false positive
    rate (FPR):


    ```

    FPR = \frac{FP}{N} = 1 - TNR$.

    ```'
