  md: "Similarly, the probability distributions $p_k$ are drawn themselves from a\
    \ probability distribution. It is a distribution over distributions, known as\
    \ base distribution $G_0$. For example, if each process is a normal distribution\
    \ with its own mean $\\mu_k$ and covariance matrix $\\Sigma_k$, these can be drawn\
    \ from the normal-inverse-Wishart distribution, which has four parameters:\n\n\
    +   * The location fraction $m$ lying in the feature space.\n* The mean fraction\
    \ $\\lambda$.\n* The inverse scale matrix $\\Psi$, which has to be symmetric and\
    \ positive definite.\n* Finally, $\nu$ has to be at least the number of dimensions\
    \ $d$ of the feature space and regulates the degrees of freedom.\n\nThe notation\
    \ is $(\\mu_k, \\Sigma_k) \\sim \text{NIW}(m, \\lambda, \\Psi, \nu)$.\nThis way\
    \ of generating the data can be represented graphically as\n\n![](img/c6c76bf52016db7e78a5e30d4766ef81_198_0.png)\n\
    \nThe covariance matrices $\\Sigma_k$ follow the *inverse Wishart distribution*\
    \ given by $\nu$ and $\\Sigma_k \\sim \\mathcal{W}^{-1}(\\Psi, \nu)$. It has the\
    \ probability density function\n\n```\n$$\\mathcal{W}^{-1}(\\Sigma_k, \\Psi) =\
    \ \\frac{\\Psi^{\\|\\Psi||/2}}{2^{\nu d/2}\\Gamma(\\nu d/2)}} \\Sigma_k^{-(\\\
    nu+d+1)/2} \\exp\\left(-\\frac{1}{2}\\text{tr}(\\Psi\\Sigma_k^{-1})\\right), \\\
    quad (6.11)$\n```\n\nwhere $|cdot|$ denotes the determinant and $tr(\\cdot)$ denotes\
    \ the trace of a matrix. $\\Gamma_d$ is the multivariate gamma function\n\nThe\
    \ expectation of the inverse Wishart distribution is given by\n\n```\n$E[\\Sigma_k]\
    \ = \\frac{\\Psi}{\\nu-d-1}$\n```"
