- pgno: 154
  md: 'where we used $N_L + N_R = N_P$, inserting (5.2) gives


    ```

    $$\Delta i = \frac{K}{N_P}p_{PR}^2 + \frac{K}{N_P}p_{LK}^2 - \frac{(N_{PLk} +
    N_{RK})^2}{N_P^2}$$

    $$\frac{1}{N_P^2}N_R(N_L+N_R)p_{PR}^k + N_L(N_L+N_R)p_{Lk}^2 - N_{PLk}^2 - 2N_{PLk}N_{Rk}
    + N_{RK}^2$$$

    $$\Delta i = \frac{K}{N_P}\sum_{k=1}^K(p_{PLk} - p_{Rk})^2$$

    ```


    We see that, if the proportions in the child nodes are similar to each other,
    then the change in impurity will be small. If, however, the proportions are quite
    different, then $\Delta i$ will be large.


    Similar to this, another possibility known as *choosing* the split which maximizes


    ```

    $$\Delta i = \frac{N_L N_R}{N_P^2} \sum_{k=1}^K |p_{PLk} - p_{Rk}|^2$$

    ```


    It is commonly used when there are many classes, $K$ is large. Another choice
    for $i(t)$ is the *deviance*, also known as *cross-entropy* or log loss,


    ```

    $$\i(t) = -\sum_{k=1}^K p_{tk} \log p_{tk}$.$$

    ```


    It is also plotted in **Figure 5.9**. In this case, we have


    ```

    $$\Delta i = -\frac{K}{N_P}\sum p_{tk} \log p_{tk} - (\frac{N_L}{N_P}\sum p_{PLk}
    \log p_{PLk} + \frac{N_R}{N_P}\sum p_{Rk} \log p_{Rk})$$$

    ```


    Using $p_{tk} = N_{tk}/N_P$ and $N_{tk} = N_L + N_R$, this can be rewritten as


    ```

    $$\Delta i = -\frac{1}{N_P}\sum N_{Lk} \log \frac{p_{Lk}}{p_{tk}} + N_{Rk} \log
    \frac{p_{Rk}}{p_{tk}}$$$

    ```


    If the proportions remain similar to the proportions in the parent node, then
    the change in impurity will be small, if the fractions are close to zero and the
    logarithms evaluates to zero. If, however, the proportions are dissimilar to the
    ones in its parent node, and especially if they are close to zero in one of the
    nodes, then $\Delta i$ is larger. Here we used the property that if $p_{tk} =
    0$, then $N_{tk} = 0$ and $0\log(0) = 0$.


    One might consider the node error as a possibility for $i(t)$. If a node is assigned
    the class with the largest proportion of training samples at that node, the node
    error is the fraction of misclassified samples:


    ```

    $$\i(t) = 1 - \max_k p_{tk}$.$$

    ```'
