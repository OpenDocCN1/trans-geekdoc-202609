  md: '# # Probability Theory




    In the introduction we have seen that learning is not possible without experiences
    which can be obtained from repeating experiments. To formalize this we need to
    quantify the different outcomes of the experiments, and probability theory lends
    to that. Ross (2008) gives a very good introduction. An example is given by a
    fair die: each number is equally probable with probability being 1/6. The probabilities
    for getting heads or tails when flipping a coin are 1/2. Here the die and coin
    are random variables. They are discrete variables. To describe more complex situations,
    probabilities are combined. For example, the probability of getting heads and
    also rolling the number 3, is 1/2 $\times$ 1/6 = 1/12. This is called the joint
    probability of the coin and die and can be expressed in a grid.


    | | | | | | | |

    |---|---|---|---|---|---||

    | heads | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 |

    | tails | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 | 1/12 |


    Note that the rows sum to 1/2, which are the marginal probabilities of the coin,
    while the columns sum to 1/6, the marginal probabilities of the die. The term
    comes from marginalizing, which is rendering the other random variable unimportant.


    When learning, we can repeat an experiment with random variables $N$ times and
    record the number of experiments where the random variables take a certain value.
    For example let $X$ and $Y$ be two random variables where $X$ can take the values
    $x_1, \dots, x_M$ and $Y$ can take the values $y_1, \dots, y_L$. The probabilities
    are denoted


    $p(X = x)$ and $p(Y = y)$,


    the joint probability is denoted by


    $p(X = x, Y = y)$.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'However, this notation is cumbersome, and we write instead $p(x), p(y)$ and
    $p(x, y)$. In the above example $X$ is the coin and $Y$ is the die with $p(heads)=1/2,
    p(3)=1/6$ and $p(heads,3)=1/12$ for example.


    The coin and die cannot influence each other, but other random variables can,
    for example the height and weight of a person. We expect a very tall person to
    not be heavy. Of course, there are also examples proving this expectation wrong.
    When two random variables do not influence each other, they are called *independent*
    or *dependent*. Two random variables $X$ and $Y$ are independent, if and only
    if


    $p(X, Y)=p(X)p(Y) \quad (2.1)$


    When learning from experiments, instead of recording probabilities in the grid
    we record how often a particular outcome occurs. Let the outcome is $X=x_i$ and
    $Y=y_j$. We denote $m_i$ the number of occurrences of $X=x_i$ disregarding $Y$,
    and $l_j$ the number of occurrences where $Y=y_j$ whatever $X$ is. The grid then
    looks like


    | | $y_1$ | ... | $y_j$ | ... | $y_L$ |

    |---|---|---|---|---||}{

    | $x_1$ | $n_{11}$ | | $n_{1L}$ | | $m_1$ |

    | | | | | | | |

    | $X$ | $x_i$ | ... | $n_{ij}$ | ... | $m_i$ |

    | | | | | | | |

    | $x_M$ | $n_{M1}$ | | $n_{ML}$ | | $m_M$ |

    | | $l_1$ | ... | $l_j$ | ... | $l_L$ |


    We see that


    $m_i=\sum_{j=1}^L n_{ij}$ and $l_j=\sum_{i=1}^M n_{ij}, \quad (2.2)$


    since marginalizing over one random variable summing over all possible outcomes
    of the other.


    We can now estimate the probabilities as fractions of the total number of experiments
    N:


    $p(x_i)=\frac{m_i}{N}, p(y_j)=\frac{l_j}{N}$ and $p(x_i, y_j)=\frac{n_{ij}}{N}$.


    Combining with this (2.2), we see that


    $p(x_i)=\sum_{j=1}^L p(x_i, y_j). \quad (2.3)$'
