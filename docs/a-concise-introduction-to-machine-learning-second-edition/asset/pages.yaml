  img_proc: true
- pgno: 223
  md: 'The variance of the projected samples is


    ```

    $$\sum_{n=1}^{N}(\mathbf{w}^T\mathbf{v}_n - \mathbf{w}^T\mu)^2 = \frac{1}{N} \sum_{n=1}^{N}
    \mathbf{w}^T\mathbf{v}_n\mathbf{v}_n^T\mathbf{w} - 2\mathbf{w}^T\mu\mathbf{w}^T
    + \mathbf{w}^T\mu\mathbf{w}^T = \mathbf{w}^T[\frac{1}{N} \sum_{n=1}^{N}(\mathbf{v}_n
    - \mu)(\mathbf{v}_n - \mu)^T]\mathbf{w}$

    ```


    The objective is to maximize this, because we want the data to be as much stretched
    as possible, subject to the constraint $|\mathbf{w}||^2 = \mathbf{w}^T\mathbf{w}
    = 1$. The Lagrangian is given by


    ```

    $L(\mathbf{w},\lambda) = \mathbf{w}^T\mathbf{\Sigma} - \lambda(\mathbf{w}^T\mathbf{w}
    - 1)$

    ```


    A stationary point of $L(\mathbf{w},\lambda)$ is a maximum of the constraint optimization.
    Using A.2.3 and A.2.2, the derivative of $L(\mathbf{w},\lambda)$ with respect
    to $\mathbf{w}$ is


    ```

    $$\frac{\partial}{\partial\mathbf{w}}L(\mathbf{w},\lambda) = 2\mathbf{\Sigma}\mathbf{w}
    - 2\lambda\mathbf{w}$

    ```


    Setting this to zero, gives


    ```

    $$\mathbf{\Sigma}\mathbf{w} = \lambda\mathbf{w}$

    ```


    and thus $\mathbf{w}^T\mathbf{w} = 1$, the eigenvalue is


    ```

    $$\lambda = \mathbf{w}^T\mathbf{\Sigma}\mathbf{w}$

    ```


    which is the variance of the projected data. Then, the data will be as spread
    out as possible, if $\mathbf{w}$ is chosen to be the eigenvector of $\mathbf{\Sigma}$
    with the largest eigenvalue.


    Being a covariance matrix, $\mathbf{\Sigma}$ has nonnegative eigenvalues. Since
    $\mathbf{\Sigma}$ is symmetric, its eigenvectors are orthogonal to each other.
    Therefore the principal space of dimension $K$, where the projected data has the
    largest variance, is the subspace spanned by the eigenvectors of the $K$ largest
    eigenvalues. These are known as principal components.


    We illustrate on this MNIST dataset of handwritten digits LeCun et al. (1998)
    gathered. This dataset contains 60000 of handwritten digits of size $28\times28$.
    We concentrate on distinguishing between the zeros and ones. Figures 7.2b and
    7.2c shows the representations of the same digits using two or three principal
    components. 7.2b the original digits can be vaguely discerned in most cases, but
    in 7.2c there seems to be little resemblance to the original digits. Figures 7.2d
    and 7.2e, however, display the location of samples in the space spanned by two
    or three principal components, respectively. Note that the sets of zeros and ones
    are separated. The objective was not the reconstruction of the images, but the
    separation of digits. To reconstruct the images perfectly in all cases $28\times28
    = 784$ pixels or principal'
