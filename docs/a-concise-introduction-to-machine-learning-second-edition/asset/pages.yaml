    \ of $\\mathbf{x}_{n+1}$ converges to\n\n$\\mathbf{p}^T = (f_1(p_1 + p_2 + p_3),\
    \ f_2(p_1 + p_2 + p_3), f_3(p_1 + p_2 + p_3)) = \\mathbf{f}^T$,\n\nsince $p_1\
    \ + p_2 + p_3 = 1$. Thus we can generate approximate samples for a given distribution\
    \ $f$, by generating samples using a Markov chain for which $f$ is invariant irrespective\
    \ of the starting distribution.\n\nConvergence is due to the ergodic theorem,\
    \ which is beyond the scope of this text, Norris (1998) gives a thorough treatment\
    \ of Markov chains. If a finite Markov chain is irreducible and aperiodic, then\
    \ the distribution of $\\mathbf{x}_n$ converges to the invariant distribution\
    \ $f$ irrespective of the initial distribution. The invariant distribution is\
    \ then the equilibrium.\n\nMore generally, with any matrix of the form\n\n```\n\
    $P = \\begin{pmatrix} 1-\\frac{\\alpha+\beta}{2} & \\alpha & \\beta \\ \\frac{\\\
    alpha}{4} & 1-\\frac{\\alpha+4\\gamma}{4} & \\gamma \\ \\frac{\beta}{5} & \\frac{\\\
