    For a homogeneous Markov chain, a distribution specified by $f$ is invariant,


    ```

    $$f(\mathbf{x}) = \sum_{\mathbf{x}} T(\mathbf{x},\mathbf{x})f(\mathbf{x}) \quad
    \text{or} \quad f(\mathbf{x}) = \int_{\mathbf{x}} T(\mathbf{x},\mathbf{x})f(\mathbf{x})d\mathbf{x}.$$

    ```


    where the sum or integral is over the state space.

    is is possible to construct a Markov chain with transition probabilities that
    a given $f$ is invariant. To achieve this, the transition probabilities need to
    satisfy the property of *detailed balance*, for all pairs of states $\mathbf{x}$
    and $\mathbf{\mathbf{x}}$.


    ```

    $$T(\mathbf{x},\mathbf{y})f(\mathbf{y}) = T(\mathbf{y},\mathbf{x})f(\mathbf{x}).$$

    ```


    Note that for $\mathbf{x} = \mathbf{x}$, the above equation is naturally true.
    If detailed balance is satisfied, the Markov chain is *reversible*. Invariance
    is shown by


    ```

    $$$\sum_{\mathbf{x}} T(\mathbf{x},\mathbf{y})f(\mathbf{x}) = \sum_{\mathbf{x}}
    T(\mathbf{y},\mathbf{x})f(\mathbf{x}) = f(\mathbf{y}).$$

    ```'
