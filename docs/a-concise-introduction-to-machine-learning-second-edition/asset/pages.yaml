    The change in the logarithm of the population size is a sum of independent and
    identically distributed variables, the $\log z_n$. By the central limit theorem,
    such a sum tends to be normally distributed, irrespective of the distribution
    of $\log z_n$. The addition of $\mu$ only shifts the mean of this distribution.
    However the logarithm of the population size $y$ is normally distributed. Thus
    the population size $x$ is log-normally distributed.


    Growth plays a major role in areas such as biology, medicine and economics. There
    are many other areas, where a log-normal distribution is used. For example the
    dwell time on online content and the length of comments online or chess games.
    The Black-Scholes model for option pricing assumes that the returns of a stock
    are normally distributed. However, this assumption is flawed, because extreme
    price changes such as in the event of a stock market crash, need a log-normal
    distribution. In practice, such extreme events are more likely than the log-normal
    distribution indicates.


    If $\mu$ and $\sigma^2$ are the mean and variance of the associated normal distribution,
    the log-normal density function for $x \sim N(\mu, \sigma^2)$ is given by


    ```

    $$\log N(x\mu,\sigma^2) = \frac{1}{x\sigma\sqrt{2\pi}}\exp(-\frac{(\log x-\mu)^2}{2\sigma^2})$

    ```


    It is shown in Figure 2.12, while Figure 2.13 depicts the cumulative distribution
    function for various values of $\mu$ and $\sigma$. For $\mu=0$ and $\sigma=2$,
    the density is peaked very close to zero. It is not visible that it is zero at
    the origin.'
