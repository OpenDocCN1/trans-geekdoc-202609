- pgno: 301
  md: '# # Feature Learning


    In the previous chapter, the choice of model space was still largely governed
    by the user, making a choice on basis functions or kernels to be used. The data
    can inform these choices or optimize parameters of the basis functions or kernels.
    If the basis functions are kernels centred at the data, the data has influence
    also that. However, the space is still very much up to user.


    In this chapter, we explore the possibility of the data deciding the model space.
    To do so, many examples of data generated from the same process are necessary.
    For example, LeCun et al. (1998) gathered the MNIST dataset, where the generating
    process was writing digits. It contains 60,000 images of size 28x28 pixels of
    handwritten digits. We will use this dataset in this chapter. The objective is
    a technique that generates a model space where all samples are equally represented,
    if reconstruction is the objective, or separated for classification.


    One drawback is that this is only possible, where reliable data are seen. While
    it is possible to have some samples where some features are not given or given
    with non-negligible error, there need to be sufficiently many samples where these
    features have reliable values. This is known as veracity and is one of the four
    V''s of Big Data. The other three are volume, velocity and variety.


    On one hand, large volumes of data are necessary to cover with missing or corrupted
    parts of the data. On the other hand, processing such large volumes of data is
    a challenge in itself. The Copernicus missions of the European Space Agency celebrated
    its 25th anniversary in 2023. It gathers 16 terabytes of data every day. These
    are some of over 9,000 active satellites orbiting earth at that time.


    The Large Hadron Collider at CERN creates 20,000 collisions per second. Thus new
    data arrives at extraordinary velocity. Only 400 per second are recorded as interesting.
    In 2023 CERN disk storage capacity passed the threshold of one million terabytes.


    The Electronic Control Units (ECUs) in a car record several thousands of signals
    approximately every quarter of a second. These relate to many different'
  merge: -1
