- pgno: 136
  md: '# # Non-Linear

    Classification




    So far we assumed that the data can be separated by a straight line. However,
    this assumption made for linear classification is very restrictive. Before we
    go into this however, we need to recall the subtle difference between two key
    concepts: *probability* and *likelihood*. Probability answers the question: How
    probable is it that a sample of class $C_i$ has these features? Likelihood, on
    the other hand, answers the question: How likely is it a sample with these features
    belongs to class $C_i$?


    There are $M$ features. Let the features of samples in class $C_i$ be normally
    distributed with mean $\mu_i$, and variance $\Sigma_i$, $i=0, 1$. Let $\mathbf{v}$
    be a feature vector. The probability density of $\mathbf{v}$ given that it is
    in class $C_i$ is


    ```

    $p(\mathbf{v} \in C_i) = \frac{1}{\sqrt{(2\pi)^M|\Sigma_i|}} \exp\left(-\frac{1}{2}(\mathbf{v}-\mu_i)^T\Sigma_i^{-1}(\mathbf{v}-\mu_i)\right)$

    ```


    The likelihood of $\mathbf{v}$ given that its features is


    ```

    $L(\mathbf{v} \in C_i) = \frac{1}{\sqrt{(2\pi)^M|\Sigma_i|}} \exp\left(-\frac{1}{2}(\mathbf{v}-\mu_i)^T\Sigma_i^{-1}(\mathbf{v}-\mu_i)\right)$

    ```


    It is the same formula, but a different interpretation.


    A classifier can be built by assigning $\mathbf{v}$ to class $C_0$ if the likelihood
    of belonging to $C_0$ is larger than the likelihood of belonging to $C_1$. The
    boundary between classes is given by


    ```

    $L(\mathbf{v} \in C_0) = L(\mathbf{v} \in C_1)$

    ```


    This is expressed as likelihood ratio


    ```

    $\frac{L(\mathbf{v} \in C_0)}{L(\mathbf{v} \in C_1)} = \frac{\sqrt{(2\pi)^M|\Sigma_1|}}{\sqrt{(2\pi)^M|\Sigma_0|}}
    \exp\left(-\frac{1}{2}(\mathbf{v}-\mu_0)^T\Sigma_0^{-1}(\mathbf{v}-\mu_0)\right)
    / \exp\left(-\frac{1}{2}(\mathbf{v}-\mu_1)^T\Sigma_1^{-1}(\mathbf{v}-\mu_1)\right)
    = 1.$

    ```'
  merge: -1
