    # 3.2 Rejection Sampling


    We now consider the case where the probability density function $f$ is available
    and can be evaluated, the cumulative distribution function $F$ is not, and inverse
    sampling is not option. Let $g$ be a probability density function such that $f(x)
    \leq cg(x)$ for all $x$ for some finite $c > 1$. Let $G$ be the cumulative distribution
    function. We now assume that we have a method to draw samples from the distribution
    given by $G$. That is $g(x)$ is a simpler probability density function and $cg(x)$
    is an envelope of $f(x)$. $f$ has two modes. The first choice is a uniform distribution
    over the support of $f$. That is the range of $x$ where $f(x)$ is nonzero. The
    other two, $g$ is normally distributed. For the second choice the mean of $g$
    is at the same location as one of the modes of $f$, and for the third choice the
    mean lies between the two modes. We see that there are infinitely many possibilities
    for $g$.


    > *Rejection sampling*, also known as the acceptance-rejection method, proceeds
    as:


    +   1. Draw a random variable $x$ following the distribution given by $g$;n2.
    Draw a random variable $u$ from the uniform distribution over $(0,1)$;

    3. If $u \leq \frac{f(x)}{cg(x)}$, accept $x$ as a sample from the distribution
    given by $f$. Otherwise return to 1.


    ```

    $u \leq \frac{f(x)}{cg(x)} \quad (3.3)$

