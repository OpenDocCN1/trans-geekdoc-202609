- pgno: 235
  md: 'involving hidden latent variables following the standard normal multivariate
    distribution. The solution in the previous section effectively calculated the
    marginal distribution from which the $\mathbf{v}_n$ are drawn by marginalizing
    the latent variables. The likelihood of the dataset was then maximized with respect
    to $\mathbf{m}$ and $\sigma^2$. The likelihood takes a maximum with respect to
    $\mathbf{m}$, when $\mathbf{m} = \mu$, which is the sample mean and can be computed.
    The maximization with respect to $\mathbf{W}$ and $\sigma^2$, involves finding
    the $K$ largest eigenvalues and eigenvectors of the sample covariance matrix is
    in itself computationally expensive problem. Calculating the covariance matrix,
    the computational complexity of finding the $K$ largest eigenvalues is $\mathcal{O}(ND^2)$
    (see for example [2016]).


    In the following, we will use the result $m = \mu$ and we employ the Expectation-Maximization
    technique introduced in Section 6.4 to find $\mathbf{W}$ and $\sigma^2$, making
    use of the joint distribution of $\mathbf{u}, \mathbf{a}$ and the distribution
    of $\mathbf{W}$ conditioned on $\mathbf{v}$. Note that in 6.4 the latent variables
    are discrete, here they are continuous. The principles remain the same.


    By the product rule, the joint probability is


    ```

    $p(v, \mathbf{u}) = p(u)p(v|u) \times (2\pi)^{-K/2} \exp(-\frac{1}{2}\mathbf{u}^T\mathbf{u})
    \times (2\pi\sigma^2)^{-D/2} \exp(-\frac{1}{2}\sigma^{-2}(v-\mathbf{W}u-\mu)^T(v-\mathbf{W}u-\mu))$

    ```


    Combining the exponential terms gives exponent


    ```

    $-\frac{1}{2}\sigma^{-2}(v-\mathbf{W}\mu)^T(v-\mathbf{W}\mu)^T\mathbf{W}-\mathbf{u}^T\mathbf{W}^T(v-\mu)+\mathbf{u}^T(\mathbf{W}^T\mathbf{W\|+\sigma^2\mathbf{I})$
    (7.5)

    ```


    This can be written as


    ```

    $-\frac{1}{2}(\begin{pmatrix} v \ \mu \end{pmatrix})^T \sigma^{-2} \begin{pmatrix}
    \mathbf{I} & -\mathbf{W} \ -\mathbf{W}^T & \mathbf{W}^T\mathbf{W\|+\sigma^2\mathbf{I}
    \end{pmatrix} \begin{pmatrix} v \ \mu \end{pmatrix}$

    ```


    Hence the mean of the joint distribution is $(\mu, 0)^T$, while the variance with
    scalar factor $\sigma^{-2}$ is the precision matrix, the inverse of the covariance
    matrix. Therefore, using the inversion formula for a block matrix in A.1.1, the
    covariance matrix of the joint distribution is


    ```

    $\begin{pmatrix} \mathbf{I} & \mathbf{W} \ \mathbf{W}^T & \mathbf{W}^T\mathbf{W\|+\sigma^2\mathbf{I}
    \end{pmatrix}$

    ```


    Using the formula for the calculation of the determinant of a block matrix in
    A.1.2, the determinant of the joint covariance matrix is $(\sigma^2)^D$ which
    agrees with the factor of the joint probability distribution.'
