    this case the patient worries needlessly. However, this is acceptable in some
    cases as long as subsequent tests avoid needless procedures.


    A perfect classifier would be 100% sensitive (all positives are correctly identified)
    and 100% specific (no negatives are incorrectly classified). In a cascade we all
    stages have high sensitivity so that as many possible patients with a health problem
    are detected. High specificity is desirable so that patients are not subjected
    to costly (both financial and human cost) procedures. However, in early stages
    a lower specificity is acceptable. Samples classified as negative at a stage are
    not considered in the following stages, thus decreasing the overall cost.


