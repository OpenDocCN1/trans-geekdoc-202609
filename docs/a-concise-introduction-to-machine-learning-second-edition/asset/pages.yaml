- pgno: 256
  md: 'We now have a model of the data specified by **D** and **c**. For $x_1, \dots,
    x_N$ the predicted values $f = (f_1, \dots, f_N)^T$ are given


    ```

    $\mathbf{f} = \mathbf{Dc} = \mathbf{D}(\mathbf{D}^T\mathbf{D})^{-1}\mathbf{D}^T\mathbf{t}$.

    ```


    Geometrically, this is the projection of $\mathbf{t}$ onto the space spanned by
    the columns of **D**. If $\mathbf{t}$ lies in that space, then $\mathbf{f} = \mathbf{t}$.
    In this case, the regressors are perfectly suited to predict the data. For the
    minimal value of **c** the error sum of squares takes value


    ```

    $\sum_{n=1}^N r_n^2 = (\mathbf{t} - \mathbf{D}(\mathbf{D}^T\mathbf{D})^{-1}\mathbf{D}^T\mathbf{t})^T(\mathbf{t}
    - \mathbf{D}(\mathbf{D}^T\mathbf{D})^{-1}\mathbf{D}^T\mathbf{t}) = \mathbf{t}^T\mathbf{t}
    - \mathbf{t}^T\mathbf{D}(\mathbf{D}^T\mathbf{D})^{-1}\mathbf{D}^T\mathbf{t} =
    \mathbf{t}^T\mathbf{t} - (\mathbf{c}^T\mathbf{c})$.

    ```


    The inner product between t and the error can be viewed as finding an approximate
    solution in a finite dimensional space spanned by the basis functions, which is
    in some sense closest to the true solution in a possibly infinite dimensional
    space. Projection projects the closest solution with the *Euclidean norm* $||\cdot||$,
    also known as the $L_2$ norm.


    # ## 8.5. Over and Underfitting


    Figure 8.5 shows polynomial reconstructions of various degrees using data generated
    from the line $y=x-0.5$ on $[0,1]$ with added noise. The noise is modelled as
    a mixture of two probabilities, in order to generate outliers. The code in Listing
    8.1 details how the data was generated.


    The technique employed to fit the polynomials is OLS. The training data points
