  md: 'Or, by defining $\mathbf{d}(\mathbf{x})^T = (d_1(\mathbf{x}), \dots, d_M(\mathbf{x}))$,


    $$t = \mathbf{d}(\mathbf{x})^T.$$


    In the following we assume that the dictionary of functions and the design matrix
