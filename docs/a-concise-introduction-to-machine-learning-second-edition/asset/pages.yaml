    function. Then the integral of the denominator is $(2\pi)^{M/2}\Sigma^{1/2}$.


    To summarize, the posterior distribution is normal with


    ```

    $$\mu(c|mathbf{t}, \mathbf{D}, \mathbf{\alpha}, \sigma^2) \sim \mathcal{N}(\mu,
    \Sigma)$$

    ```


    with $\mu$ and $\Sigma$ given by (8.7) and (8.6).


    Recall that Ordinary Least Squares calculates the coefficients as


    ```

    $$\mathbf{c} = (mathbf{D}^T\mathbf{D})^{-1}\mathbf{D}^T\mathbf{t},$$

    ```


    while regression determines them as


    ```

    $$\mathbf{c} = (\mathbf{I} + \mathbf{D}^T\mathbf{D})^{-1}\mathbf{D}^T$$

    ```


    where $\lambda$ is a parameter which needs to be suitably chosen. Inserting (8.6)
    into (8.7) gives


    ```

    $$\mu =(\sigma^2\mathbf{A}^T + \mathbf{D}^T\mathbf{D})^{-1}\mathbf{D}^T$$

    ```


    The addition of $\sigma^2$ $\mathbf{A}$ against $\mathbf{D}$ being being possibly
    singular. The main distinguishing feature of Bayesian methods is firstly, learning
    of a specific vector of coefficients, a multivariate posterior probability distribution
    is given for $c$, from which $c$ could be derived. It is also common to let $c
    = \mathbf{\mu}$. Secondly, the hyperparameters $\alpha_1, \dots, \alpha_M$ are
    optimized by maximizing the marginal likelihood as we will see below.


    Once the posterior distribution of the coefficients is found, the measurement
    $t_n$, for data $\mathbf{x}_n$, can be interpreted probabilistically. When we
    recall that $t_n$ is generated by a process,


    ```

    $t_n =(\mathbf{x}_n)^T\mathbf{c} + \epsilon_n,$$

    ```


    where $(\mathbf{x}_n)^T$ is the $n^{th}$ row of $\mathbf{D}$, i.e. all the basis
    functions evaluated at $\mathbf{x}_n$. Now, $(mathbfmathbf{x}_n)^T\mathbf{c}$
    is a linear transformation of the normally distributed variable $\mathbf{c}$ and
    thus is normally distributed. The other, $\epsilon_n$, is normally distributed
    noise with mean zero and variance $\sigma^2$. Hence, $t_n$ is the sum of two normally
    distributed variables. The probabilistic interpretation of $t_n$ is that it is
    drawn from a univariate normal distribution


    ```

    $$\text{mean} \quad =(\mathbf{x}_n)^T\mathbf{\mu}$\n$\text{variance} \quad \sigma_n^2
    =\sigma^2 +(\mathbf{x}_n)^T\Sigma\mathbf{d}(\mathbf{x}_n).$$

    ```'
