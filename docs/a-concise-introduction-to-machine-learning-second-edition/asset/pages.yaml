    which is of the required form.


    The errors $\delta_{ji}^{(s)}$ are defined in terms of $\delta_{mr}^{(s)}$, as
    well as the weights in the $s^{th}$ layer and the derivative of the activation
    function in layer $s-1$ which is evaluated at the activations of this layer. They
    can be calculated by propagating backwards through the network from one set of
    neurons to the next. This is known as **backpropagation**.


    Once we reach the $l^{th}$ layer, we have


    ```

    $$\frac{\partial}{\partial w_{ji}^{(l)}}E_n(\mathbf{w}) = \sum_{m=1}^{M_l} \delta_m^{(l)}a_m^{(l)}(\mathbf{X}_n,
    \mathbf{w})$

    ```


    and directly dependent on $u_{ji}^{(l)}$ via


    ```

    $a_m^{(l)} = \sum_{s=1}^{M_{l-1}} w_{sm}^{(l-1)}x_s^{(l-1)}$

    ```


    Differentiation is straightforward and we arrive at


    ```

    $$\frac{\partial}{\partial w_{ji}^{(l)}}a_m^{(l)}(\mathbf{X}_n, \mathbf{w}) =
    \begin{cases} 0 & m \neq j \ 1 & m = j \end{cases}$

    ```


    The derivative of the $n^{th}$ contribution to the error becomes


    ```

    $$\frac{\partial}{\partial w_{ji}^{(l)}}E_n(\mathbf{w}) = \delta_j^{(l)}u_{ji}^{(l-1)}$

    ```


    It is the error $\delta_j^{(l)}$ in the $j^{th}$ neuron of the $l^{th}$ set of
    neurons (letting the output neurons be the $L^{th}$ set) multiplied by the $i^{th}$
    variable in the previous set of neurons, if the synapse connects neuron $i$ to
    neuron $j$. Note that, if $l=1$, those variables are the input variables, while
    when $l>1$, they are the latent variables.'
