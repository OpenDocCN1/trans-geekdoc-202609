  md: '# A Concise Introduction to Machine Learning


    **If A** is a symmetric, positive semi-definite, $M \times M$ matrix, then the
    function defined by


    $k(\mathbf{x}, \mathbf{y}) = \mathbf{x}^T \mathbf{y}$


    is a valid kernel function, in this case


    ```

    $$\mathbf{v}^T \mathbf{K} \mathbf{v} = \sum_{m,n}^N v_m \mathbf{x}_m^T \mathbf{A}
    \mathbf{x}_n = \left(\ \sum_{m=1}^N v_m \mathbf{x}_m \right)^T \mathbf{A} \left(\
    \sum_{n=1}^N v_n \mathbf{x}_n \right) \geq 0.$

    ```


    Similarly, if $f: \mathbb{R}^M \to \mathbb{R}$ is any function, and $k: \mathbb{R}^M
    \times \mathbb{R}^M \to \mathbb{R}$ is a valid kernel, then


    ```

    $$\sum_{m,n}^N k(\mathbf{x}_m, \mathbf{x}_n) k(\mathbf{x}_n, \mathbf{y}) v_m v_n
    = \mathbf{w}^T \mathbf{K} \mathbf{w} \geq 0, \eqno (5.1)$

    ```


    where $w=(f(\mathbf{x}_1)v_1, \dots, f(\mathbf{x}_N)v_N)^T$. Therefore, the function
    defined by $f(\mathbf{x})k(\mathbf{x}, \mathbf{y})f(\mathbf{y})$ is a valid kernel.


    Multiplying a valid by a positive constant and the sum of two valid kernels is
    ever a kernel. Let $\{\mathbf{x}_1, \dots, \mathbf{x}_N\}$ be an arbitrary set.
    Let $\mathbf{K}$ denote the Gram matrix of the product of kernels. Since the Gram
    matrices of the two factors are symmetric and positive semi-definite, they can
    be written as $A^T A$ and $B^TB$ respectively. Thus, their $(m,n)$ entries are
    given by


    ```

    $$\sum_{i=1}^N A_{mi} A_{ni} \quad \text{and} \quad \sum_{j=1}^N B_{mj} B_{nj}$

    ```


    respectively. For an arbitrary vector $\mathbf{v} = (v_1, \dots, v_N)^T$,


    ```

    $$\mathbf{v}^T \mathbf{K} \mathbf{v} = \sum_{m,n}^N v_m K_{mn} v_n = \sum_{m=1}^N
    v_m \left(\\sum_{i=1}^N A_{mi} v_i\right) \left(\\sum_{j=1}^N B_{mj} v_j\right)
    \\n = \sum_{m=1}^N \left(v_m \sum_{i=1}^N A_{mi} v_i\right) \left(v_m \sum_{j=1}^N
    B_{mj} v_j\right) \geq 0.$

    ```


    Here $\mathbf{K}$ is positive semi-definite, and the product of two kernels is
    a kernel. From this we can deduce that if $p$ is a polynomial with nonnegative
    coefficients, $p(k(\mathbf{x}, \mathbf{y}))$ is a valid kernel, if $k(\mathbf{x},
    \mathbf{y})$ is a valid kernel function. Also $\exp(k(\mathbf{x}, \mathbf{y}))$
    is a valid kernel as it is the limit of a polynomial with positive coefficients.'
