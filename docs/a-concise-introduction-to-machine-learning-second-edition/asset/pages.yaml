    # 7.5 Kernel Principal Component Analysis


    The previous sections relied on the assumption that the data samples are related
    to latent variables in a lower dimensional space via a **linear** mapping as defined
    in (7.2). Geometrically, this means that the dataset lies close to a plane, line
    or hyperplane as illustrated in Figures 7.5 and 7.6. This assumption is, however,
    unrealistic in many practical applications.


    The data samples lie close to a *K-dimensional manifold*. A manifold is a two-dimensional
    manifold is the sphere. Flat-earthers succumb to the impression that locally the
    Earth is a sphere which represents a plane. Globally, however, it does not, because
    traveling continuously in one direction will return to the starting point. Figure
    7.7a gives an example of data close to the unit sphere. Lighter shaded points
    lie beyond the surface of the sphere.


    It is possible to choose a mapping $\phi: \mathbb{R}^D \to \mathbb{R}^D$ into
    a higher dimensional space such that the dataset then lies related to latent variables
    in a *K-dimensional subspace*. In Figure 7.7, the dataset was first mapped to
    a four-dimensional space, where the fourth component is the sum of squares of
    the other three. Since the dataset lies approximately on the unit sphere, the
    fourth component will be close to one for all data samples. Thus the dataset lies
    on a hyperplane. After finding the first two principal components, the dataset
    is projected onto the plane given by these two principal components. This is shown
    in Figure 7.7b. Thus the datasets are grouped towards the top or bottom, that
    they can be separated along one principal component.


    However, like the kernel trick in Section 5.2, performing the mapping explicitly
    is avoided. Instead, all steps in the calculation use the *kernel function* or
    *kernel* for $k: \mathbb{R}^D \times \mathbb{R}^D \to \mathbb{R}$ defined as


    ```

    $$k(x,y) = \phi(x)^T\phi(y)$.$

    ```


    Let **E** be the $N \times N$ matrix with each entry equal to the *mean center*
    a vector $\mathbf{a} = (a_1, \dots, a_N)$ by


    ```

    $$$\mathbf{a}^T(\mathbf{I} - \frac{1}{N}\mathbf{E}) = (a_1^T - \frac{1}{N}\sum_{n=1}^N
    a_n, \dots, a_N^T - \frac{1}{N}\sum_{n=1}^N a_n).$$

    ```


    It also be used to shift data samples so that their mean is zero. Let $\phi(v_1),\dots,
    \phi(v_N) \in \mathbb{R}^D$ be the images under the mapping $\phi$ of the data'
