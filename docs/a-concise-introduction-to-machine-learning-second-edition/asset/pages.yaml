- pgno: 3
  md: '# # A Concise Introduction to Machine Learning


    A Concise Introduction to Machine Learning uses mathematics as the common language
    to explain a variety of machine learning concepts from basic principles and illustrates
    every concept using examples in both Python and MATLAB®, which are available on
    GitHub and can be run from there in Binder in a web browser. Each chapter concludes
    with exercises to explore the content.


    The emphasis of the book is on the question of Why—only if "why" an algorithm
    is successful is it be properly applied and can the results trusted. Standard
    techniques are treated rigorously, including an introduction to the necessary
    probability theory. This book addresses the commonalities of methods, aims to
    give a thorough and in-depth treatment and develop intuition for the inner workings
    of algorithms, while remaining concise.


    This useful reference should be essential on the bookshelf of anyone employing
    machine learning techniques, since it is born out of strong experience in university
    teaching and research on algorithms, while remaining approachable and readable.


    **A.C. Faul** is a passionate educator believing that only with deep understanding
    of the underlying connecting principles of algorithms can progress be made. She
    obtained an MAST and PhD in Mathematics at the University of Cambridge. She has
    worked on a variety of algorithms both in industry and academic settings.'
  merge: -1
  img_proc: true
