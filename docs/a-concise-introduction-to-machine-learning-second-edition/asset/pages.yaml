- pgno: 23
  md: '# Preface


    Machine Learning is known under many other names such as Artificial Intelligence
    (AI), Pattern Recognition, Data Mining, Data Assimilation, and Big Data, to list
    but a few. It developed in many areas of science, for example physics, engineering,
    computer science, and mathematics in parallel and independently. Optical Character
    Recognition (OCR), search engines, computer vision, Natural Language Processing
    (NLP), discovery, fraud detection, robotics, data prediction, and drug discovery,
    makes it sometimes difficult to find a solution for a particular problem in the
    future, simply because of the fact that different words and phrases are used for
    the concept.


    This book aims to alleviate this. A common concept, but known in sciences under
    different names, is described using the common language. Readers will find the
    index useful to find a particular topic as it is known to them. The index is comprehensive,
    making it easy to find the required information. Hopefully, this will prove the
    book useful as a reference and make it essential on the bookshelves of anybody
    Machine Learning techniques.


    Often, in teaching Machine Learning, the emphasis is on the questions "What?”
    and "How?”, and the question "Why?” is neglected. In my opinion, this is the most
    important question. If it is understood why an algorithm is successful it can
    be properly applied. On the other hand, if it is not understood why it arrived
    at its results, these results cannot be trusted. A more recent reason, is the
    necessary processing power, and energy consumption, of very large models such
    as Large Language Models (LLMs). Here algorithmic improvements can reduce the
    size and cost. These are only possible, if the inner workings are understood.


    Algorithms are often taught by side by showing the similarities and differences
    between them. This book addresses this by introducing the commonalities. Most
    techniques to find an approximate model modeling the data in a finite, low-dimensional
    space. They differ in how a solution to this approximate model is chosen. This
    approach helps to keep the book concise while still giving a thorough and in-depth
    treatment. In some places, where further detail was felt to be out of the scope
    of this book, the reader is referred to further reading. Figure 1 illustrates
    how different sections of the book are related to each other based on key terminology.'
  merge: -1
  img_proc: true
