  md: 'variable of the $j^{th}$ neuron in the second of hidden neurons with the error
    in the $i^{th}$ output neuron, when the $n^{th}$ training sample passes through
    the network. The thus obtained gradient can be used to update the entries of **D**.
    Note that this means only updating the weights in the final layer giving a new
    matrix **D**, since the weights of the other layers are given by $D^T$ and $(DD^T)^{-1}$.
    This inverse might not exist, which is an inherent problem of ordinary squares,
    which can be addressed by ridge regression as seen in equation 8.3.


    The matrix $DD^T$ is symmetric and positive semi-definite. It can be diagonalized
    by an orthogonal **Q** such that $DD^T = QPQ^T$, where $P$ is a diagonal matrix
    with nonnegative entries. Thus the predictions are


    ```

    $\begin{aligned} D(DD^T)^{-1}D^T &= \mathbf{D}(QP^{1/2}P^{1/2}Q^T)^{-1}\mathbf{D}^T
    \ &= (\mathbf{D}P^{-1/2})(P^{-1/2}Q^T\mathbf{D})\mathbf{t} \ &= (\mathbf{D}P^{-1/2})(\mathbf{D}P^{-1/2})^T\mathbf{t}
    \end{aligned}$

    ```


    since the inverse of an orthogonal matrix **Q** is $Q^T$.


    This is a tied two-layer autoencoder with the linear function as activation function.
    The weights of the first layer are given by the entries of $(DQP^{-1/2})^T$ and
    those of the weights of an autoencoder to the model space which was originally
    defined as the columns of **D**^{-1/2}$. This illustrates the link of the weights
    of **D** being functions evaluated at the points, where data samples are taken.
    The application of $P^{-1/2}$ are different scalings of the hidden variables,
    while **Q** is either a rotation or a reflection, since it is an orthogonal matrix.


    Continuing in this vein, the mean of the predictive distribution for **t** in
    Section 8.13 which introduces the Relevance Vector Machine is given by


    ```

    $\mathbf{\mu} = \sigma^{-2}\mathbf{D}\Sigma\mathbf{D}^T\mathbf{t}$

    ```'
