    into the Lagrangian function, we seek $\alpha$ that maximizes the dual function
    given by


    $L(\alpha) = \sum_{n=1}^N \alpha_n - \frac{1}{2}\sum_{i=1}^N\sum_{j=1}^N \alpha_i
