  md: "Equation (2.3) is as *sum rule* of probability. The random variable $Y$ is\
    \ marginalized.\n\nIf we only consider experiments where the outcome for $X$ is\
    \ $x_i$, then the fraction of those, where the outcome for $Y$ is $y_j$, is written\
    \ as $p(y_j|x_i)$ and is called the *conditional probability* of $y_j$ given $x_i$.\
    \ Looking at the $i^{th}$ row of the grid, it can be calculated as\n\n```\n$p(y_j|x_i)\
    \ = \frac{n_{ij}}{m_i}$\n```\n\nOn the other hand, we have\n\n```\n$p(x, y) =\
    \ \frac{n_{ij}}{N} = \frac{n_{ij}}{m_i} \frac{m_i}{N} = p(y|x)p(x).\n```\n\nThis\
    \ is known as the *product rule* of probability. Written in terms of the random\
    \ variables, the *sum* and *product rule* of probability are\n\n```\n$p(X) = \\\
    sum_{Y} p(X, Y) = p(Y|X)p(X),\\n$$\n```\n\nwhere the sum is all possible instances\
    \ of $Y$.\n\nFrom the definition of independence in (2.1), we see that $Y$ is\
    \ independent of $X$, if the conditional probability $p(Y|X)$ equals the marginal\
    \ probability $p(Y)$ for all outcomes. Then, the outcome of $X$ does not influence\
    \ the outcome of $Y$ at all.\n\nThe joint probability of random variables is symmetric.\n\
    \n```\n$p(X, Y) = p(Y, X).\n```\n\nCombining with the product rule gives $p(Y|X)p(X)\
    \ = p(X|Y)p(Y)$. Dividing by $p(X)$ leads to Bayes' *rule*, also known as *Bayes'\
    \ theorem* which relates conditional probabilities of random variables to each\
    \ other:\n\n```\n$p(Y|X) = \\frac{p(X|Y)p(Y)}{p(X)}$\n```\n\nBayes' rule plays\
    \ an important role within Machine Learning, sparking Bayesian subscribers. A\
    \ very good account of its historic influence is given by McGraine (2011).\n\n\
    Within Machine, the random variable $X$ is often the available data, which has\
    \ either gathered or generated by experiments. $X$ can be multidimensional, since\
    \ different kinds of information are given for one data point. The random variable\
    \ $Y$ on the other hand encompasses the variables we believe influence the data.\
    \ Again this can be multidimensional. The probability $p(Y)$ gives our *prior*\
    \ belief. This can be experience or the opinion of experts, or derived from other\
    \ experiments. The prior has a controversial role, since it quantifies a subjective\
    \ opinion. The conditional probability $p(X|Y)$"
