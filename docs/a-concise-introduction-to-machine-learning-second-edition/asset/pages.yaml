  md: 'Using the definition for the expectation this becomes


    ```

    var[x] = \int_{-\infty}^{\infty} (x^2 - 2E[x] + E[x]^2)f(x)dx\n= \int_{-\infty}^{\infty}
    x^2f(x)dx - 2E[x]\int_{-\infty}^{\infty} xf(x)dx + \int_{-\infty}^{\infty} f(x)dx\n=
    E[x^2] - E[x]^2,

    ```


    since f(x) integrates to one and \int_{-\infty}^{\infty} xf(x)dx = E[x]. This
    formula also holds for discrete probability distributions with point masses. The
    square root of the variance is the **standard deviation.


    We see that this formula involves the expectation of $x$. This is known as the
    *second raw* or *crude moment*. The $i^{th}$ raw (crude) moment is defined as


    ```

    \int_{-\infty}^{\infty} f(x)ixdx,

    ```


    while the $i^{th}$ central moment is given by


    ```

    \int_{-\infty}^{\infty} f(x - E[x])^idx,

    ```


    The normalized $i^{th}$ central moment is the $i^{th}$ central moment divided
    by $i^{th}$ power of the standard deviation, var[x]^{i/2}. The normalized central
    moments are invariant to any linear change of the random variable $x$. If $y =
    ax + b$, the normalized central moments of $x$ and $y$ are the same. The normalized
    central moments are used to quantify the shape of a probability density.


    The third central moment is known as *skewness* and measures the asymmetry around
    the mean of a probability distribution. If the distribution is symmetric, the
    skewness is zero. If more probability lies to the left of the mean, the skewness
    is negative. It is positive, if more probability is to the right of the mean.


    The fourth central moment is the *kurtosis* and measures how heavily tailed the
    probability distribution is. It is derived from the Greek word for "arching".
    Often of the other distributions is compared to the kurtosis of the normal distribution.
    If it is larger, the distribution is known as *leptokurtic*. It means that it
    has extreme values are more likely. If it is smaller, it is *platykurtic*. In
    this case, outliers are rare. Both present their own difficulties, if an underlying
    normal distribution is assumed, the data does not support this. In case of leptokurtic
    distributions, the risk of extreme events is underestimated and is not sufficiently
    prepared for. Extreme events are rare in platykurtic distributions. However, if
    these events are catastrophic, dismissing their possibility can be lethal. The
    global Covid-19 pandemic exposed the preparedness for extreme events of governments
    across the world.'
