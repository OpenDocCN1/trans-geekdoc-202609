  md: "since the sum over the state space of the conditional probabilities is one.\
    \ The calculation for a continuous probability density function $f$ uses integrals\
    \ and is analogous.\n\nThe transition probabilities can be constructed as linear\
    \ combinations of transition probabilities $B_1, \\dots, B_M$,\n\n```\n$T(\\mathbf{x})\
    \ = \\sum_{m=1}^{M} b_m B_m(\\mathbf{x}),$\n```\n\nwhere $b_1, \\dots, b_M$ are\
    \ known as mixing coefficients and satisfy $b_m \\ge 0$ and $\\sum_{m=1}^{M} b_m\
    \ = 1$. If each of the transitions details detailed balance, so does the linear\
    \ combination of components in $\\mathbf{x}$.\n\nIf the state space is finite,\
    \ then it can be represented by a $l$-of-$K$ vector. That is the random vector\
    \ representing the $k^{th}$ state is a $K$-dimensional vector, where each element,\
    \ $x_{i,k}$, equals one and all the others are zero. The transition probabilities\
    \ $p_{lk}=p(x_{n+1}=l|x_n=k)$, which is $x_0$ in state $k$ generates $x_{n+1}$\
    \ in state $l$, are represented in matrix form\n\n```\n$P = \begin{pmatrix} p_{11}\
    \ & \\dots & p_{1K} \\ \\vdots & \\ddots & \\vdots \\ p_{K1} & \\dots & p_{KK}\
    \ \\end{pmatrix},$\n```\n\nwhich is called the transition matrix. Each row of\
    \ $P$ sums to one. It is therefore a right stochastic matrix, as opposed to a\
    \ left stochastic matrix where each column sums to one. A doubly stochastic matrix\
    \ is one where both columns and rows sum to one. If $P$ is symmetric, then the\
    \ probability of transitioning from state $k$ to $l$ is the same as from state\
    \ $l$ to $k$, the matrix is doubly stochastic. The probability of transitioning\
    \ from stage $k$ to $l$ in $m$ steps is the $(k,l)$ entry in $P^m$.\n\nA state\
    \ $k$ has period $m$ if the period $m$ is the greatest common denominator of all\
    \ numbers $n$ such that the probability $p(x_{n+1,k}=1|x_{n,k}=1)$ is nonzero.\
    \ If $m=1$, the state is called aperiodic. This happens, for example, if the probability\
    \ of transitioning to itself is nonzero. A Markov chain is aperiodic, if every\
    \ state is aperiodic. An irreducible Markov chain, i.e., where every state can\
    \ be reached from any other state, needs only one aperiodic state, to be aperiodic.\
    \ This is because using one aperiodic state, one can return to any state in a\
    \ number of steps which is any prime number and the greatest common denominator\
    \ of prime numbers is one.\n\nIf the initial distribution $p(\\mathbf{x}_1)$ is\
    \ given by $\\mathbf{p} = \\{p_1, \\dots, p_K\\}$, then the distribution of $\\\
    mathbf{x}_{n+1}$ is given by $\\mathbf{p}P^n$."
