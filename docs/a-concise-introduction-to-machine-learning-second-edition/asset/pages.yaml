    \ to cyclic permutations. Therefore,\n\n```\n$\\mathcal{L} = -\\frac{ND}{2}\\\
    log(2\\pi) - \\frac{N}{2}\\log|\\mathbf{C}| - \\frac{1}{2}\\sum_{n=1}^N \text{tr}(\\\
