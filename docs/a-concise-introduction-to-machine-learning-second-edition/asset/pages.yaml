  md: 'Let $i$ be any index in $\{1, \dots, K\}$. We incorporate the first constraint
    noting


    $$$\mu_i = 1 - \sum_{k \neq i} \mu_k.$$


    With this modification, the log likelihood is


    $$$\log p(D|\mu) = \sum_{k} m_k \log \mu_k + m_j \log \mu_j \left( 1 - \sum_{k
    \neq j} \mu_k \right).$$


    Let $j \neq i$ be any other index. The parameter $\mu_j$ appears in both sums,
    and the derivative with respect to $\mu_j$ is


    $$$\frac{d \log p(D|\mu)}{d \mu_j} = \frac{m_j}{\mu_j} - \frac{m_i}{1 - \sum_{k
    \neq j} \mu_k} \frac{\mu_i}{\mu_j}.$$


    Setting this to zero, we find that the ratio of $\mu_j$ to $\mu_i$ to be the same
    as the ratio of $m_j$ to $m_i$. Since $i$ and $j$ are freely chosen, the ratio
    of any pair of components of $\mu$ must be the ratio of the corresponding pair
    in $\mathbf{m} = (m_1, \dots, m_K)$. The only possible choice for $\mu_k$, which
    satisfies the second constraint that to lie between zero and one, is the MLE.


    $$$\mu_k = \frac{m_k}{m_1 + \dots + m_K}, \quad k = 1, \dots, K.$$


    As this could be a poor estimate if $N$ is not large enough. Constraint optimization
    problems often occur in Machine Learning. A general technique uses *Lagrange multipliers*,
    which we will encounter in Section 4.6. For more background knowledge on optimization
    see Bertsimas & Tsitsikis (1997).


    The vector $\mu$ of the probabilities of different outcomes needs to be estimated.
    The Dirichlet distribution $\text{Dir}(\mu|\alpha)$ is chosen as conjugate prior
    for $\mu$, where $\alpha$ is suitably chosen. The posterior density function is
    proportional to the product of the likelihood and the prior (which is the joint
    distribution):


    $$$f(\mu|\alpha) \propto \prod_{k=1}^K \mu_k^{\alpha_k - 1},$$


    where all constants were dropped due to the proportional sign. The posterior has
    again functional form of a Dirichlet distribution. Incorporating the factor such
    that the posterior integrates to, leads to


    $$$f(\mu|\alpha, \alpha) = \frac{\Gamma(\alpha_0 + N)}{\Gamma(\\alpha_1 + m_1)
    \dots \Gamma(\\alpha_K + m_K)} \prod_{k=1}^K \mu_k^{\alpha_k - 1} = \text{Dir}(\mu|\alpha),$$'
