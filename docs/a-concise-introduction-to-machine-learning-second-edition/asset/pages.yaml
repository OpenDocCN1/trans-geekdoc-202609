- pgno: 116
  md: '# # Linear Classification




    Distinguishing between objects is called *classification*. Already before we are
    born to learn to distinguish between different sounds in the womb, and we continue
    to learn and distinguish easily between different objects, different situations
    and different concepts. In fact, we differ or are similar to others is fundamental
    to our sense of self. Humans have an uncanny ability in the area of classification.
    For example, despite the variety of dog breeds and Domestic cats are visually
    much similar to each other. We identify a dog as a dog. A child is not what is
    different between a cat and a dog. It is a cat and that is a dog. At most it is,
    this dog meows and that goes woof. On these examples it to work by itself how
    to distinguish between them. What are features and what are dog features?


    More formally, there are three categories of features. *Boolean* or *binary* features
    can only have two values. They relate to questions answered yes or no. Is it red?
    Is the person tall? Do we have a storm? *Discrete* features took categorical also
    known as *ordinal values*. What colour is it? Is the person short, medium built
    or tall? What is the wind force on the Beaufort scale? Lastly there are *continuous*-
    that is, *real-valued* features. Here the questions are answered for example:
    What is the wavelength of the colour? What is the person''s height? What is the
    wind speed?


    There are many examples of classification in every life. Spam filtering is an
    application of text categorization. Face detection in images and optical character
    recognition are examples from the field of machine vision. For businesses, market
    segmentation is of great importance, while every one of us hopes that the fraud
    detection algorithms of our credit card company are effective.


    Classification is not that new. One of the most used examples dates back to 1936
    when Fisher (1936) measured the petal length and width and the sepal length and
    width of three different species of irises, iris setosa, iris'
  merge: -1
  img_proc: true
