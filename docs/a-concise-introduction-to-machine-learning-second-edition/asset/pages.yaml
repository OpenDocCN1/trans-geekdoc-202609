    boldsymbol{\\alpha})=\\min_w L(\\mathbf{w}, \\boldsymbol{\\alpha})$\n\nis the\
    \ *dual* function of the primal optimization problem. Note that in the feasible\
    \ set, $L(\\boldsymbol{\\alpha})$ is always a lower bound of $\\|\\mathbf{w}\\\
    |^2/2$. We find the largest lower bound by maximizing the minimization problem\
    \ with respect to $\boldsymbol{\\alpha}$.\n\nWe recover the original minimization\
    \ problem when the multiplier $\\alpha_n$ is zero if the constraint is inactive,\
    \ and otherwise positive. Formally, this is written as\n\n$\\alpha_n(c_n^T\\mathbf{v}_n\
    \ - 1) = 0$.\n\nThis property is known as *complementarity*. If this is the case,\
    \ the maximum lower bound and the constrained minimum are the same. The solution\
    \ is a stationary point of $L(\\mathbf{w}, \\boldsymbol{\\alpha})$, whose derivatives\
    \ vanish. Using A.2.1 and A.2.2, the derivative of $L(\\mathbf{w}, \\boldsymbol{\\\
    alpha})$ with respect to $\\mathbf{w}$ is\n\n```\n$$\\frac{d}{d\\mathbf{w}}L(\\\
    mathbf{w}, \\boldsymbol{\\alpha}) = \\sum_{n=1}^N \\alpha_n c_n\\mathbf{v}_n$.\n\
    ```\n\nSetting this to zero is equivalent to the gradient of the objective function\
    \ being a linear combination of the gradients of the constraints.\n\nInserting\n\
    \n```\n$$\\mathbf{w} = \\sum_{n=1}^N \\alpha_n c_n\\mathbf{v}_n,\\quad(4.4)$\n\
    ```"
