    Figure 2.15: The exponential probability density function for various values of
    $\beta=1/\lambda$ in accordance with Figure 2.9 of the Poisson distribution.


    It is important that underlying assumptions are clear and documented as the following
    example illustrates. In 2G mobile networks, each mobile is assigned its own frequency,
    and served by an antenna. It might hop to another frequency, if it travels away
    from the coverage area of this antenna and might get a new frequency from another
    antenna further away, if the antenna which is connected to currently needs to
    serve more mobiles. To assess the coverage of the mobile network of a large area,
    mobile phone usage would be simulated in this area, including between. When the
    simulations were first coded, programmers did not include code paths for cases
    which were possible, but improbable. With increased mobile phone usage, the probabilities
    changed. Inserting these necessary code paths into large, often undocumented pieces
    of code caused some time-consuming problems. The problem of the story is that
    all cases, even the improbable ones, need to be coded and documented. It is even
    wise to include the impossible ones, because somewhere will change the code and
    they will become possible.


    The exponential distribution, $x \sim Exp(\beta)$, has probability density function


    ```

    $Exp(x|\beta) = \begin{cases} \frac{1}{\beta} \exp(-\frac{x}{\beta}) & x \geq
    0, \ 0 & x < 0, \end{cases} \quad (2.13)$

    ```


    is parametrized by the scale parameter $\beta$. Its inverse, $\lambda=1/\beta$,
    is the rate parameter. It is related to the Poisson distribution defined in Equation
    (2.8) with rate parameter $\lambda=1/\beta$ in that it describes the time between
    occurrences of events described by the Poisson distribution.'
