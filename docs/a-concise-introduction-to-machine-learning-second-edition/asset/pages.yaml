    Figure 4.7: Perceptron.


    Then sample v


    ```

    $$\nsgn(w^T v) = -1 \Rightarrow v \in C_0$,$

    sgn(w^T v) = 1 \Rightarrow v \in C_1$.$\quad (4.3)

    ```


    Rosenblatt (1958) invented the perceptron. It was a physical machine for image
    recognition. It contained 400 photo cells, and the weights were implemented by
    potentiometers which were updated by electric motors.

    Specifically, the perceptron initializes $w_0 = 0$, and updates the weights $w_{i-1}$
    with each new training sample $v_i$


    ```

    $$\mathbf{w}_i = \mathbf{w}_{i-1} + (c_i - \nsgn(\mathbf{w}_{i-1}^T v_i)) \mathbf{v}_i$.$

    ```


    where $c_i$ is the class label of $v_i$, that $c_i = -1$ if $v_i \in C_0$ and
    $c_i = 1$ if $v_i \in C_1$.

    The parameter $0 < \alpha \leq 1$ is the learning rate and is set by the user.
    If the learning rate is chosen too big, any changes are radical and oscillations
    occur.

    Note that $\mathbf{w}_i$ is the same as $\mathbf{w}_{i-1}$. If the class label
    was determined incorrectly, the separation line is pulled in direction such that
    it is more likely that the sample is labelled correctly. The sign of $c_i - \nsgn(\mathbf{w}_{i-1}^T
    v_i)$ determines in direction the separation line is pulled. At any stage, the
    vector of weights, $\mathbf{w}_i$, is a linear combination of samples seen so
    far.


    The perceptron is implemented as a single layer network within the neural framework
    in MATLAB (Figure 4.7 and Listing 4.2). We take a closer look at neural networks,
    when considering non-linear classification.

    The perceptron needs to see examples for the separation line to set. An epoch
    is one complete presentation of the data to the algorithm.

    Figure 4.8 shows the different separation lines after a certain amount of data
    has been seen by the perceptron. The unseen data are marked with $\times$. The
    learning rate is set to 1. Because of this large value, the separation line position
    changes dramatically between seeing 90% and the complete dataset.

    After 100 epochs the perceptron classifies all samples apart from one outlier.
    It takes several hundred epochs for the perceptron to also classify this sample
    correctly. Giving a different seed to random number'
