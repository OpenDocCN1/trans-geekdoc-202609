- pgno: 206
  md: "```\nfunction [idx,MU,SIGMA] = InferBaysianMixture(V, K,alpha,m, ...\n    lambda,Psi,nu,iter)\n\
    \  # Input:\n  V: data,\n  K: number of clusters\n  alpha: prior concentration\
    \ parameter,\n  m: prior location vector,\n  lambda: prior mean fraction,\n  Psi:\
    \ prior inverse scale matrix,\n  prior degrees of freedom,\n  iter: number of\
    \ iterations\n  idx: index vector of cluster assignments,\n  MU: array of the\
    \ means sampled from the posterior normal-inverse-Wishart distributions for each\
    \ cluster,\n  SIGMA: array of the covariances sampled from the posterior normal-inverse-Wishart\
    \ distributions for each cluster.\n\nN = size(V,1);\n# Start with random cluster\
    \ assignments.\nidx = randi(1,N);\n# For each cluster its size, prior location\
    \ vector,\n# prior mean fraction, posterior inverse scale matrix,\n# posterior\
    \ degrees of freedom.\nnk = randi(1,K);\nLAMBDA = randi(2,K);\nPSI = randi(2,K);\n\
    # For each cluster initialize a draw from the posterior normal-\n# Inverse-Wishart\
    \ distribution.\nSTOMA = randi(2,K);\nMU = randi(2,K);\n# For each cluster initialize\
    \ these for the initial random cluster\n# assignments and draw MU and SIGMA from\
    \ that posterior-\n# distribution.\nfor k=1:K\n  Vk = V(idx==k,:);\n  nk = size(Vk,1);\n\
    \  sampleM = mean(Vk);\n  sampleC = inv(Vk) + cov(Vk);\n  M(k) = (lambda + nk*(sampleM(:)-m(:)))\
    \ / (lambda + nk);\n  LAMBDA(k) = lambda + nk;\n  PSI(k) = sampleC + lambda +\
    \ nk*(sampleM(:)-m(:))'/(lambda + nk);\n  # Cholesky factorization to maintain\
    \ positive definiteness.\n  PSI(k) = chol(PSI(k));\n  NU(k) = nk;\n  SIGMA(:,k)\
    \ = iwishrnd(PSI(:,k)',k*PSI(:,(:,k),NU(k));\n  MU(:,k) = mvnrnd(M(k),SIGMA(:,k)/LAMBDA(k));\n\
    end\n```\n\nListing 6.5a: Bayes' rule and Gibbs sampling generating the mixture\
    \ model for a fixed number of clusters in MATLAB - initialization. For Python\
    \ go to\nhttps://github.com/ACFaul/Clustering-Python."
