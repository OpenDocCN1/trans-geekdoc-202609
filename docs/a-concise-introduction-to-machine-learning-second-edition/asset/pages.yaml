    ```

    $p(\mathbf{t},\mathbf{D},\boldsymbol{\alpha},\sigma^2) = \frac{p(\boldsymbol{\alpha})\mathcal{L}(\mathbf{t}|\mathbf{D},\sigma^2)}{\int
    p(\boldsymbol{\alpha})\mathcal{L}(\mathbf{t}|\mathbf{D},\sigma^2)d\mathbf{t}}$
