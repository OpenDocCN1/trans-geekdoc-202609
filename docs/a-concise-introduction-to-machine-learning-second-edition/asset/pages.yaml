  md: 'is $k$-sparse, $(M k)$ possibilities need to be checked. However, we do not
    know beforehand, how many components are nonzero. Hence, all $M$ possible values
    for $k$ need to be checked. The resulting complexity is


    ```

    $$\sum_{k=1}^M \binom{M}{k} = 2^M - 1.$

    ```


    Since the size of the input, $M$, appears in the exponent, the complexity of the
    input is exponential. We encounter a difficult method to get a sparse solution
    when looking at Bayesian Learning in Section 8.13.


    The $L_0$ regularization is related to the Bayesian Information Criterion (BIC)
    and the Akaike Information Criterion (AIC). These criteria are used to select
    the model structure and parameter to be selected. For see Chen et al. (2013).


    The $L_1$ regularization has the disadvantage that in the case of multicollinearity
    there is not a unique minimum, but a continuum of minima. If two columns $d_i$
    and $d_j$ are the same $c_i$ and $c_j$ are nonzero coefficients in the minimum
    solution, then for any $a \in [0,1]$ replacing $c_i$ by $a(c_i+c_j)$ and replacing
    $c_j$ by $(1-a)(c_i+c_j)$ is also minimal.


    If the columns of $D$ are orthogonal, then they are orthogonal, since we assume
    they are orthogonal. $D^TD$ is the identity matrix. In this case, the solution
    to $L_1$ regularization can be found by soft thresholding.


    ```

    $\frac{1}{2} ||\mathbf{t} - D\mathbf{c}||_2^2 + \lambda ||\mathbf{c}||_1 = \frac{1}{2}
    \mathbf{c}^T D^TD\mathbf{c} - \mathbf{c}^T D^T\mathbf{t} + \lambda ||\mathbf{c}||_1.$

    ```


    minimize


    Since $\mathbf{tt}$ is independent of the variables of interest, the first term
    can be dropped. Furthermore, let $\mathbf{c}^{OLS}$ be the Ordinary Least Squares
    solution


    ```

    $\mathbf{c}^{OLS} = (D^TD)^{-1}D^T\mathbf{t}.

    ```


    The minimization is equivalent to minimizing


    ```

    $-c_m c_m^{OLS} + \frac{1}{2}c_m^2 + \lambda |c_m| = \sum_{m=1}^M -c_m c_m^{OLS}
    + \frac{1}{2}c_m^2 + \lambda |c_m|,$

    ```


    where each summand can be minimized individually. That is, for each $m$, we minimize


    ```

    $-c_m c_m^{OLS} + \frac{1}{2}c_m^2 + \lambda |c_m| = -c_m c_m^{OLS} + \frac{1}{2}c_m^2
    + \lambda sgn(c_m)c_m,$

    ```


    where


    ```

    $sgn(c_m) = \begin{cases} +1 & \text{if } c_m > 0, \ 0 & \text{if } c_m = 0, \
    -1 & \text{if } c_m < 0. \end{cases}$

    ```'
