    # 7.2 Related Works


    In their exploration of the growing integration of artificial intelligence (AI)
    in urban settings and their skillful delivery of AI applications in smart cities,
    Luusua et al. [1] investigate how technology might improve efficiency, sustainability,
    and urban living in general. The topics covered include AI-powered approaches
    to energy optimization, traffic control, public services, and other areas fostering
    the growth of intelligent urban environments. The essay also discusses possible
    obstacles, moral dilemmas, and how the use of AI will affect how cities develop
    in the future. The study conducted by Lv and Gao [2] investigates how smart city
    efforts affect employment in China. It makes use of difference-in-differences
    analysis and data at the municipal level to determine the total impact of Demand
    and supply balance mechanisms in smart city building support urban employment,
    especially in secondary and tertiary industries. The study stresses the total
    employment creation fueled by smart city development, while acknowledging the
    possibility of job displacement owing to automation in some areas. It emphasizes
    how crucial it is to upskill and adapt the workforce in order to take advantage
    of smart city opportunities and traverse the shifting terrain.


    Ullah and Al-Turjman’s research [3] offers a framework for using blockchain smart
    contracts to handle real estate transactions in smart cities. It draws attention
    to how disruptive this technology can be in the smart real estate market. The
    framework highlights that for blockchain smart contracts to be successfully adopted
    in smart city real estate, all six layers must be taken into account. It can streamline
    procedures, improve transparency, cut costs, and help a number of stakeholders,
    including government agencies, buyers,'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'sellers, agents, and property owners. In their study, Kumar et al. [4] presented
    a novel framework for traffic sign detection and forecasting in smart cities automatically.
    This is essential for effective traffic management as well as autonomous driving.
    Techniques like the Kalman Filter and Goat-based Convolutional Neural Network
    are included in the GbCN-KF framework that is being suggested. Combining these
    methods allows GbCN-KF to achieve high classification and detection accuracy for
    traffic signs, surpassing 99.8% on benchmark datasets. It is therefore appropriate
    for practical uses in smart city applications.


    A multi-joint optimization technique is proposed by Liu [5] for the allocation
    of edge computing resources in Internet of Things (IoT)-filled smart cities. The
    approach met latency requirements for jobs produced by the aforementioned devices
    and tackled the problem of energy efficiency. For IoT systems in smart cities,
    traditional cloud computing designs may result in significant energy consumption
    and network latency. By putting networking, memory, and processor closer to the
    data source, edge computing provides an answer. For IoT-based smart cities, the
    authors suggested a four-layer network architecture. Next, in order to guarantee
    effective computation, they present a multi-joint optimization strategy that makes
    use of an auction-based technique to distribute edge resources for activities
    that are sensitive to delays. A digital model that extracts properties from waste
    materials, including color, texture, and shape, is presented by Mohammed et al.
    [6]. Following that, these attributes are passed into various ANNs, each of which
    is taught to recognize a particular kind of garbage (paper, plastic, glass, etc.).
    To arrive at a final classification judgment, the outputs of each of these distinct
    ANNs are subsequently integrated using feature fusion techniques. Using a dataset
    of 2,400 photos of waste products, the model was tested and found to be 91.7%
    accurate. This shows that the waste can be efficiently sorted and classified by
    the model, which could lead to a more sustainable circular economy and higher
    recycling rates.


    The paper by Homer [7] explores how people understand the idea of “smart sustainable
    cities.” Given that many cities throughout the world are attempting to become
    both smart and sustainable, it emphasizes how crucial it is to comprehend these
    viewpoints. The paper highlights the significance of having a nuanced understanding
    of people’s perceptions of smart, sustainable cities, taking into consideration
    both the advantages and disadvantages of this kind of urban planning. The study
    by Khurana and Dutta [8] explores the ways in which smart cities support the development
    of resilient entrepreneurial ecosystems. It makes the case that these ecosystems
    undergo a “place-to-space” transition, beginning with locally focused resources
    and solutions and developing into more scaled and spatially adaptable models later
    on. The article offers numerous instances of sustainable entrepreneurial ecosystems
    found in smart cities across the globe, including the smart grid projects in Barcelona
    and the circular economy initiatives in Amsterdam. These examples show how various
    towns take advantage of their own advantages and difficulties to foster creative
    and long-lasting enterprises. It emphasizes how crucial it is to support place-based
    networks and promote spatial flexibility in order to ensure these ecosystems’
    long-term viability. Using a novel approach known as dynamic factor analysis,
    Vanli [9] evaluates and ranks 33 global cities over the period of 2005–2019. This
    method goes beyond static rankings, accounting for how cities progress and change
    over time in various dimensions of smart cities. The study deals with dimensions
    like digital inclusion, innovation, economy, human capital, sustainability, and
    quality of life. The study emphasizes the importance of'
