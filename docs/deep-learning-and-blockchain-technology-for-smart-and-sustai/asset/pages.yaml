    # 10.4.1 Peat


    Peat, characterized by its soft, crumbly, and dark-brown composition, consists
    of partially decomposed and deceased organic material. Serving as the initial
    stage in coal formation, peat undergoes transformation into lignite as pressure
    and temperature increase and sediment accumulates atop the partially decomposing
    organic elements. To complete its evolution into coal, peat necessitates burial
    at depths ranging from 4 to 10 km beneath the surface by sedimentary processes.
    Peat boasts the lowest carbon content, measuring below 60%, and the highest energy
    density, registering at 15 MJ/kg (Figure 10.4).


