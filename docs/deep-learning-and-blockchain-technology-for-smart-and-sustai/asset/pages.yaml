  md: '# 2.5 Conclusion


    Numerous methods exist for filtering internet spam. Offering efficient processes
    and putting in place capable software packages to control spam is crucial, given
    the daily rise in spam and spammers. Email classification can be done using a
    variety of machine learning-based classification algorithms. In order to categorise
    the emails as spam or ham, this study uses four classification algorithms: SVM,
    Multinomial Naive Bayes, Gaussian Naive Bayes, and Bernoulli Naive Bayes. The
    subject and substance of the emails are used to build the classification model.
    Using RBSA and SBFS, a classification model is constructed based on the email
    subject and content attributes. It has been suggested to use RBSA to determine
    spam term weight and determine if spam phrases are present in the subject. To
    minimise features, SBFS has been used. The algorithms SVM, Multinomial Naive Bayes,
    Gaussian Naive Bayes, and Bernoulli Naive Bayes are used to evaluate this suggested
    methodology, and their respective performances are compared. The same classification
    algorithms were also used, but without the use of RBSA and SBFS algorithms, on
    the Enron dataset. The accuracy of the suggested approach was contrasted with
    that of the conventional approach. The findings highlight the potential of integrated
    RBSA and SBFS approaches in enhancing the efficiency of email categorization within
    smart city frameworks, thereby facilitating more streamlined communication and
    decision-making processes. According to the study, RBSA and SBFS with SVM provide
    the maximum accuracy (97%), while also reducing false positives. When compared
    to the suggested methodology, the accuracy level is lowest when RBSA and SBFS
    are not used.


