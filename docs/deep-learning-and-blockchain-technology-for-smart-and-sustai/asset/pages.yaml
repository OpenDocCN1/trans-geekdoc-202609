  md: '# **Key Objectives:**


    +   - Investigate the vulnerabilities and threats in smart city setups.

    +   - Explain the basics of blockchain technology and how it can enhance smart
    city security.

    +   - Explore practical ways to integrate blockchain into different aspects of
    smart city living.

    +   - Propose a tool called the *smartVAST framework* to make smart cities more
