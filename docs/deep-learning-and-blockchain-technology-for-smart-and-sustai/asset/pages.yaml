    # 9.6 Literature Survey


    The authors of this study, Gai et al. [1], suggested a unique method for enhancing
    healthcare in smart cities by fusing federated deep learning and edge computing.
    The MDP-FDRNN method is the central concept; it combines Federated Deep Recurrent
    Neural Networks with Markovian Decision Processes to achieve effective resource
    allocation at the network edge. This methodology offers significant advantages
    for healthcare applications in intelligent urban environments, as it facilitates
    real-time data processing with minimal latency and processing time. The article
    emphasizes the value of edge computing in overcoming processing and bandwidth
    constraints, and it shows how the MDP-FDRNN algorithm successfully overcomes these
    obstacles to improve the standard of healthcare services for urban residents.
    The growing popularity of the IoT and IIoT has been addressed in this article
    by Bansal and Singhrova et al. [2]. IoT and IIoT provide convenience and security
    problems. Intrusion Detection Systems (IDS) provide a way to defend these systems
    against many types of attacks. The present status of IDS research in relation
    to IoT and IIoT is reviewed in this article. It examines several methods of detection,
    such as hybrid, anomaly,'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'and signature-based techniques. The paper emphasizes the need for advancement
    in areas such as real-time performance, scalability, and accuracy. It also recognizes
    scientific trends, such as the application of deep learning and machine learning
    methods. In conclusion, it suggests unresolved issues and potential paths for
    IDS research in the IoT/IIoT space.


    A novel authentication methodology was presented in the paper by Jain et al. [3]
    to secure communication between IIoT devices and servers. Because of its straightforward,
    lightweight, and secure architecture, this protocol is appropriate for IIoT devices
    with little resources. It does this by utilizing hash functions and XOR, two fundamental
    cryptographic procedures. According to the protocol, the server receives an authentication
    request from the IIoT device. Session keys are then returned by the server and
    are used to encrypt any further communications. Periodically, the session keys
    are changed to ensure security. The authors assert that their protocol is immune
    to man-in-the-middle, replay, and guessing attacks, among other types of assaults.
    To bolster their arguments, they also conducted a formal verification tool analysis
    of the procedure. A flexible and secure edge computing strategy for AI-driven
    Industrial IoT (AIoT) was presented by Zhao et al. [4]. It uses distributed computing
    and a software-defined industrial control architecture to overcome the security
    and flexibility issues in edge systems. Through industrial modeling and virtualization,
    the architecture decouples hardware from software, increasing programmability
    and flexibility. The use of resources and real-time performance are enhanced via
    distributed computing. Data availability, integrity, confidentiality, and privacy
    are further guaranteed by a security domain-based task offloading method and a
    decentralized service discovery and distribution paradigm. Experiments show that
    the suggested plan is effective. All in all, this plan presents a viable strategy
    for adaptable and safe edge computing for the IoT. Gateways serve as vital links
    between devices and the larger network in the context of the IIoT. But these gateways
    are also easy targets for cyberattacks, which can take down the entire system
    if they are compromised. The authors of the paper, Fröhlich et al. [5], suggested
    a unique Secure IIoT Gateway Architecture that makes use of Trusted Execution
    Environments (TEEs) in order to address this. To improve security, TEEs—secure
    sections inside processors—isolate sensitive functions from the rest of the system.
    In order to protect the TEE from outside threats, this architecture assigns crucial
    responsibilities like device onboarding, data encryption, and authentication to
    them. The approach is also more adaptable because it doesn’t require prior trust
    between devices.


    Using a K-harmonic clustering algorithm and BCT, Baalamurugan et al. [6] established
    a new framework for safe data sharing and storage in IIoT systems. Ineffective
    sharing and data breaches are two problems with traditional IIoT'
