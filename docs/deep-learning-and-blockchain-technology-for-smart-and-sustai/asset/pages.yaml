    by up to 20%.

    +   2. **Reduced Greenhouse Gas Emissions**: By using sustainable energy and mobility,
    smart city projects can help meet climate targets.

    +   3. **Better Quality of Air and Water**: Intelligent monitoring and control
    systems can lower pollution levels in urban areas.


    # Social Impact:


    +   1. **Enhanced Citizen Engagement**: Transparency and involvement in decision-making
    can be increased with the help of open data platforms and citizen apps.

    +   2. **Greater Equity in Service Accessibility**: Intelligent technologies have
    the potential to close the digital gap and improve access to vital services like
    healthcare and education.

    +   3. **Enhanced Public Safety**: Intelligent monitoring and emergency response
    systems can lower crime rates and improve security.


    # 7.5 National Impact of Smart City


    India’s Smart City Mission was introduced in 2015 with the goal of converting
    100 cities into thriving metropolitan areas with better sustainable practices,
    infrastructure, and quality of life for their citizens. Although the program is
    still in its early phases, it has started to have good effects in a number of
    areas:


    # Economic Impact:


    +   1. **Investments**: As of July 2023, the Ministry of Housing and Urban Affairs
    (MoHUA) reported that over `2.05 lakh crore (US$26 billion) had been invested
    in smart city projects.

    +   2. One million new jobs are expected to be produced in smart cities by 2025.

    +   3. **Enhanced GDP**: By 2030, it is anticipated to contribute 1% of India’s
    GDP (Smart Cities Mission Report, 2020).


    # Environmental Impact:


    +   1. **Lower Energy Consumption**: The installation of LED street lighting in
    100 cities resulted in an annual electricity savings of 75 million kWh.

    +   2. **Better Air Quality**: According to MoHUA (2023), smart traffic management
    solutions in 42 cities resulted in a 6% decrease in air pollution.

    +   3. **Enhanced Water Efficiency**: According to MoHUA (2023), smart water meters
    in 45 cities reduced water losses by 15%.


    # Social Impact:


    +   1. **Better City Services**: According to 51% of residents in smart cities,
    public transportation is easier to access (Smart Cities Mission Survey, 2022).

    +   2. **Improved Healthcare**: Over 8.5 million patients benefited from telemedicine
    projects in 83 cities (MoHUA, 2023).

    +   3. **E-Governance Adoption**: According to the Smart Cities Mission Survey
    (2022), 62% of residents in smart cities used the internet to obtain government
    services.'
