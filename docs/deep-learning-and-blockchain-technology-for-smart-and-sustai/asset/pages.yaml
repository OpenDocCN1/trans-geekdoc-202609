    # 17.1 Introduction


    Parkinson''s disease (PD) exists as a prevalent neurological disorder profoundly
    impacting motor functions, speech, and posture as neurons die off, and there''s
    a decrease in dopamine levels in the brain, resulting in dopamine levels within
    the brain [1]. This deficiency disrupts synaptic communication, resulting in impaired
    motor functions marked by tremors, muscle rigidity, and bradykinesia. The progression
    of symptoms varies among individuals, but balance issues and tremors remain widespread
    manifestations of dopaminergic neuron degeneration. Regrettably, no cure for PD
    exists, necessitating patients with Parkinson''s (PWP) to rely on early identification
    and personalized treatments to alleviate the disease''s advancement. The disease
    is categorized into five stages, with vocal cord injuries emerging as a prevalent
    symptom in stage 0 for approximately 90% of PWP [2]. Severe lesions were observed
    in key brain regions, including the nucleus of the stria terminalis, components
    of the hypothalamus, and non-thalamic nuclei projecting to the cerebral cortex.
    Vocal impairment, being easily measurable, offers an avenue for telemedicine or
    remote diagnostics, allowing patients to record audio at home for assessment.
    Severe lesions are evident in the'
