    # 10.1 Introduction


    Coal is the world’s primary source of energy. The development of society and industry
    has led to coal’s analytical quality that has become increasingly important in
    terms of production efficiency and pollution. The economic viability of coal-based
    industries depends on the availability of high-quality coal. Accurate classification
    supports economic assessments, cost-effectiveness analyses, and investment decisions
    in coal-related projects. Coal classification provides important guidance for
    production planning and resource assessment in the coal mining and production
    process. The classic categorization of coal approach, on the other hand, relies
    heavily on artificial experience categorization in the current mining operation.
    This necessitates a large amount of people and material resources, and automation
    is challenging to do. As a result, one of the most important research topics in
    coal mining and use is how to detect many types of coal fast, correctly, and in
    real time. Coal is categorized into three groups based on the degree of coalification:
    lignite, bituminous coal, and anthracite. Different varieties of coal are used
    in different ways at different times. Coal usage is differed based on their types
    and quality. The places where coals are used are thermal power plants, as well
    as boiler design and manufacturing. There are two standard conventional methods
    for classifying coal: the first is human'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'classification, which is relatively rapid but has low classification accuracy
    and is challenging to automate; and the second is chemical analysis, which has
    high recognition accuracy but is difficult to automate. The downsides of this
    approach include its high cost and extended detection time. The ability to accurately
    and efficiently determine the kind of coal is critical for lowering classification
    costs and increasing classification efficiency. As a result, determining the type
    of coal fast and properly is a pressing issue that current mineral processing
