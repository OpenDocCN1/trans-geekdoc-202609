    +   1. In a direct link between IoT and BC infrastructure, IoT devices are able
    to access BC data kept at servers at the edge co-located with IoT gateways, small
    BSs, or Macro BSs (MBSs).

    +   2. Direct communication between IoT nodes, allowing them to share or access
    partial BC data through device-to-device connections.

    +   3. IoT devices can interconnect with blockchain data using hybrid interaction,
    which combines cloud and edge servers.


    # 4.2 5G Beyond in IOT Using Blockchain


    IoT maintains huge potential for blockchain technology, but before blockchain
    is fully integrated with IoT, many research issues want to be resolved. This is
    particularly true for next-generation networks that is 5G-beyond or 6G networks,
    which are vital for building the infrastructure needed for blockchains. The opportunities
    that blockchain offers to 5G-beyond networks are shown in Figure 4.1 from the
    lookouts of computation management, network management, and communications. We
    provide more detail about them in the following sections.


    ![](img/96b9fa3db3bfeef3ca6e7362a69b2849_83_0.png)


    Figure 4.1 5G beyond in IOT using blockchain.'
