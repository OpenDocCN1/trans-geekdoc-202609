    Linköping, Sweden; Lund, Sweden; Oulu, Finland; Tampere, Finland; and Umeå, Sweden—the
    writers carried out a document analysis of mobility projects. According to the
    report, the cities are pursuing sustainable mobility in a number of ways, such
