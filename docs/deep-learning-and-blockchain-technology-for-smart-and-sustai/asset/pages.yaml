    In the research, Alam [10] presented a novel method for limiting access to IoT
    device communication in smart city settings. This method takes advantage of the
    difficulties associated with access control in IoT connectivity, as well as the
    advantages of big data and blockchain technologies. Blockchain technology is used
    in the suggested approach to provide transparent and safe access control. To efficiently
    process and evaluate access control data, it also makes use of big data analytics.
    A potential solution to the problems with access control in IoT connectivity for
    smart cities is presented in this article. The suggested method aims to provide
    safe, transparent, and effective data exchange between IoT devices by merging
    the advantages of big data with blockchain technology. A methodology and optimization
    strategy for assessing the life cycle cost (LCC) of photovoltaic (PV) systems
    in Indian smart cities were proposed in the paper by Beniwal et al. [11]. The
    authors optimize the system architecture and compute the LCC using the Artificial
    Bee Colony (ABC) method, taking into account variables including energy generation,
    savings, efficiency, and carbon credits obtained. Four smart cities—Srinagar,
    Jaipur, Pune, and Chennai—that reflect various climatic conditions and energy
    demands are examined in the study. According to the data, Srinagar has the lowest
    LCC (INR 4,125 million) and the highest energy production (435 MWh), with an 8.9%
    return on investment. The suggested methodology exhibits a 50.24% decrease in
    LCC in contrast to conventional techniques [19].


