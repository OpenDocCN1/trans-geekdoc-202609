    has 12 years of teaching experience. He has also served as an assistant professor
    at Galgotias University, Greater Noida, from July 2019 to December 2020. He worked
    for 7 years as an assistant professor in the Department of Computer Science and
    Engineering, SNS College of Engineering, Coimbatore. He obtained his B.E. in Computer
    Science and Engineering from Selvam College of Technology in 2010 and received
    his M.E. in Software Engineering from Anna University Regional Center, Coimbatore,
    in 2012. He received his Ph.D. degree from Anna University, Chennai, in 2019.
    His areas of interest include Cloud Computing, Security, IoT, and Machine Learning.


