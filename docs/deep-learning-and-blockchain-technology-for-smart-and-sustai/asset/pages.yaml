- pgno: 310
  md: '![](img/96b9fa3db3bfeef3ca6e7362a69b2849_310_0.png)


    # Figure 14.2 Classification of sensors.


    The sensors are classified into in-body sensors, on-body sensors, wearable and
    implant sensors. In-body sensors are positioned inside the body, whereas on-body
    sensors are placed on the skin surface [10]. The LM35 is a type of temperature
    sensor that is used to measure temperature. The operating frequency is 1 Hz, which
    supports a low bit rate, i.e., less than 100 bps [11]. The heart rate sensor,
    blood pressure sensor, oximeter and blood glucose sensors are operated at the
    frequency of 1 Hz and a bit rate of less than 100. These are used to measure heart
    activities, pressure oxygen level and glucose level from the human body. The electrocardiogram
    signals are sampled at high frequency, i.e., 1,000 Hz with a precision of 24 bits,
    resulting in a dataflow of 24 kbps [12]. The motion sensors like gyroscope, accelerometers
    and magnetometer are operated at different sampling frequencies ranging from 10
    to 2,000 Hz and bit rates ranging from 1 to 200 kbps.


    # 14.3.1.1 Requirements for Sensors


    The sensors should satisfy the following requirements [13]:'
