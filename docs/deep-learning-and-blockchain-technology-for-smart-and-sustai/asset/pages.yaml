    analysis helps understand how rainfall patterns evolve over time, enabling predictions
    about seasonal variations and climate trends. Through probabilistic models, algorithms
    assess the risk of extreme rainfall events, offering crucial information for disaster
    preparedness and response planning. He et al. [10] developed a data-driven multi-step
    prediction model for monthly rainfall using explainable deep learning, achieving
    high accuracy.


    Algorithmic analysis facilitates the identification of long-term trends, helping
