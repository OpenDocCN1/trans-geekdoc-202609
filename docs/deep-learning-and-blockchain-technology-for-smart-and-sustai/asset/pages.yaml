    The national air quality monitoring network in our nation periodically measures
    these air contaminants. The outcome AQI is posted frequently on this center’s
    website. The main contributors to air pollution are heating, industry, traffic,
    and transportation pollutants (Li et al., 2021). Furthermore, the development
    of urbanization negatively impacts the quality of the air. There are several suggestions
    to protect the public from extreme pollution. Some of these include (i) limiting
    public outdoor activity and (ii) encouraging patients with serious illnesses like
    cardiovascular diseases, respiratory conditions, pregnancy, and children to spend
    more time at home (Almetwally et al., 2020). Anticipating air pollution is essential
    for both alerting people to pollution and minimizing it in their daily lives.'
