    # 19.1.1 System Modules


    The system flow of the gesture language translator will be carried out through
    three modules:


    +   1. Labeling images for object detection.

    +   2. Training tensor flow for sign language.

    +   3. Translating sign language in real time.


    # 19.1.2 Literature Survey


    Sunitha et al., in their paper, cover the elucidation for the deaf-mute communication
    interpreter [7]. As of now for the deaf-mute communication, there are two methods:
    one is physically wearable hearing aids and the other is learning system through
    internet. In wearable device, the user wears a glove with keypad with a micro-controller
    or a touch screen [8]. But in this method, an external device is utilized for
    communication between the deaf/non-deaf people. In learning systems, the usage
    of an extra device can be eliminated. Learning system based on online has five
    subdivided methods: SLIM module, TESSA, WI-See Technology, SWI_PELE System, and
    Web-Sign Technology [9]. Anand et al. devised an ISLR system that uses a pattern
    recognition and classification with the use of Discrete Wavelet Transform (DWT),
    and the nearest neighbor classifier recognizes the hand gesture with a 92.23%
    accuracy. Another model by Mandeep Kaur Ahuja and Amardeep Singh uses the skin
    color and template matching for recognizing the hand signs [1]. The hand is first
    segmented by the difference in skin color, and thresholding is used to separate
    the foreground and the'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'background. Finally, it is compared with the templates to recognize the hand
    sign [10]. The system used here applies digital image processing to recognize
    the hand gestures, using the SIFT algorithm at the edges that are invariant to
    scaling, rotation, addition of noise. Nagpal et al. proposed a system to communicate
    with the computer that can recognize 36 different hand gestures given by the user.
    Shirbhate et al. used a system to aid the communication between deaf and dumb
    people with others by using Indian Sign language (ISL) [11]. Khandge has presented
    their gesture language recognition consisting of three steps: preprocessing, feature
    extraction, and classification with neural network (NN) and Support Vector Machine
    (SVM) as some of the methods. Pratibha Pandey and Vinay Jain have presented application
    that helps the communication by a gesture to text conversion. The processing steps
    include gesture extraction, gesture matching, and conversion to speech [12]. Yun,
    in his paper, segmented the data of each sign into sub-words having three sub-divisions
    with shape, color, and orientation. Delliraj and Vijayakumar proposed a system
    with a flex sensor to give a voice output for the recognized sign gesture. Choudhury
    et al. presented a Conditional Random Field (CRF) for complex backgrounds based
    on ISL. Hee-Deok proposed an additional hand appearance-based verification method
    and a subsign reasoning method to increase the accuracy of spotting rate to 87.0%
    and recognition rate of 93.5%. Chao et al. proposed the Microsoft kinetic system
    that spots the hand gestures using the hand-tracking feature of the device.


