    will monitor the movement of people and vehicles and ensure that all citizens
    are safe and secure. Starting from small theft like pickpocketing to mass lynching
    can be avoided. People can lead happy, peaceful lives in smart cities.


    # 1.4 Waste Management


    In smart cities, waste that cannot be reused or recycled is collected from other
    waste, and a thin layer of waste is dumped over soil, followed by another thin
    layer of waste. Finally, the area is declared as unfit for constructing any buildings
    for next 20 years. This process is called as landfill.


    Incineration is a process that will burn garbage and turn into gas and ashes.
    Releasing gas is not eco-friendly because it may contain carbon dioxide or carbon
    monoxoide. However, it will reduce the amount of garbage in a larger size.


    Tin containers may also be compressed so that they occupy less amount of space.
    This can also be recycled.


    Organic waste can also be used as nutrient-rich manure. Food items which we throw
    daily can be left decayed after burial under a thin layer of compost, which is
    the best alternate solution for chemical fertilizers. All smart cities are adopting
    thousands of ways to manage waste management (Figure 1.1).'
