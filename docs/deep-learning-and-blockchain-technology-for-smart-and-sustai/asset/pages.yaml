  md: '# Chapter 14


    # Enhancing Healthcare in Smart Cities: The Fusion of MCPS and IoT


    P. Vimala Devi and V. Kalaichelvi


    DOI: 10.1201/9781003476047-14


    # 14.1 Introduction


    A cyber-physical system is a means of integrating processes from the physical
    world into the virtual one. CPS uses sensors to measure signals from different
    settings, and then networks are used to transfer and process these signals. The
    use of cyber-physical systems is growing in a number of industries, including
    healthcare, smart grid, aerospace and automotive systems, thanks to recent technological
    breakthroughs. Among these, healthcare is crucial to day-to-day living. Medical
    Cyber-Physical System (MCPS) refers to the cyber-physical system used in healthcare
    applications. The integration of cyber-physical system with Internet of Things
    (IoT) creates a new dimension in healthcare applications, which is called Internet
    of cyber- physical systems [1]. The services in healthcare system consist of physical
    information, networking and computation. The services offered for healthcare using
    Internet of Things (IoT) are divided into six categories [2]. The categories are
    services provided during an emergency, services to help people with disabilities,
    services for medical professionals, personalized medical advisor, services for
    sports persons and medication management. The method used to process healthcare
    information is known as electronic health records (EHR) [3]. EHR is a structured
    information that includes image, text or both. It increases the interoperability
    between patient information and healthcare organizations, even though the system
    is suffered from security and privacy issues.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 14.2 Background


    Ashish Singh and Kakali Chatterjee introduced a model for healthcare to ensure
    the privacy of the data [4]. They also explained to avoid unauthorized access.
    The most important problem in the rural area is a lack of healthcare centers and
    specialists''. People in the rural area are not aware of the medical facilities,
    which causes different issues. To avoid this, a cloud-based healthcare system
    is developed by Kashfia Sailunaz et al. [5]. The patient''s age, weight, height,
    blood pressure and temperature are collected by sensors and analyzed. After analysis,
    patients are classified into any of the three categories such as emergency, healthy
    and alarming. Identity-based encryption is proposed for secure storage in the
    cloud.


    Yosef Ashibani and Qusay H. Mahmoud proposed a three-layer architecture for cyber-physical
    systems [6]. The layers are perception layer, transmission layer and application
    layer. These layers are responsible for data collection, transfer and analysis.
    They also explained possible attacks in each layer and measures. During data transmission,
    it is necessary to ensure that the data is transmitted from the proper node or
    device. The methods used to provide authentication for devices are encryption
    algorithms and biometric techniques. Abdullah Alhayajneh et al. explained the
    biometric authentication techniques for wireless body area networks [7]. Based
    on the availability of devices, the methods are categorized into hand wearable
    devices, body portable devices and implantable medical devices. The methods are
    compared in terms of sample size, accuracy and requirements. Syed Taha Ali et
    al. highlighted a scheme to authenticate the data in WBAN using hash tree and
    digital signature [8]. The hash tree is formulated using the samples collected
    from the sensor and then signed using ARQ protocol. The simulation shows that
    the 99% of data is authenticated with fewer transmission overheads.


    # 14.3 Medical Cyber-Physical System


    The architecture of cyber-physical systems is designed using components and layers.
    There are two types of components, one is for sensing and the other is for controlling.
    Sensors, actuators and aggregators are used as sensing components. It consists
    of a four-layer architecture [9]. The group of sensors present in the first layer,
    typically known as wireless body area network, is used to capture information.
    Because the sensors have minimum power for computation, a'
  merge: -1
  img_proc: true
