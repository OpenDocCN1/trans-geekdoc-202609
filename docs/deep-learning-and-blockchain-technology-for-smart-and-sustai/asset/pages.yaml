    # 14.3.3 Challenges


    Cyber-physical system enables the continuous and non-expansive monitoring of health
    data by using WBAN sensors, networks and cloud.


    # 14.3.3.1 Sensitivity


    In harsh environments like fire situation, the device sensitivity is considered
    as an important one. Sweat and water droplets also affect the performance of the
    sensors. Care should be given for designing high sensitivity and requiring less
    maintenance devices.


    # 14.3.3.2 Energy


    Sensors are battery-powered and energy consumption devices. It is very difficult
    to recharge the batteries. The design requires low power and green energy enabled
    devices.'
