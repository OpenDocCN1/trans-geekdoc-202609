  md: '# 14.3.3.3 Problems in Compatibility


    Wireless body area networks consist of multiple sensors, working in different
    frequency levels. The integration of these devices requires different bandwidths
    and protocols, which creates compatibility problem. So, the design of healthcare
    systems should ensure compatibility between the devices.


    # 14.3.3.4 Scalable


    The system offers efficient migration among networks and uninterrupted service.


    # 14.3.3.5 Device and System Level Security


    Security algorithms are used to ensure device safety, although it is the main
    challenge in cyber-physical systems.


    # 14.4 Attacks


    The attacks are divided into two categories known as physical and cyberattacks.
    The physical attack causes damage to the system components. Table 14.2 describes
    the attacks occurring in various layers of cyber-physical system.


    # Table 14.2 Attacks in CPS Layers


    | Layer | Equipments | Function | Attacks |

    |---|---|---|---|

    | Perception layer | Sensors<br>RFID<br>GPS<br>Actuator | Collecting physiological
    signals from patient''s body and aggregating the signals | Capturing the nodes
    and leaks information<br>Passing malicious data to the nodes<br>Flooding more
    packets causes disruption in network<br>False measurements |'
