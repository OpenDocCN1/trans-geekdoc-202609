    # 18.2 Literature Survey


    In the realm of agriculture, where uncertainties abound, reliable and timely forecasts
    are indispensable for informed planning and decision-making [4]. The contemporary
    agricultural landscape, characterized by its high input and cost intensiveness,
    demands judicious use of resources like fertilizers and plant protection measures
    to maintain profitability [4]. However, factors such as weather variability, production
    uncertainties, policy changes, and market prices pose significant challenges,
    often resulting in losses for farmers [4].


    The impact of weather and climate on food production cannot be overstated, with
    weather variables influencing crops differently at various stages of development
    [4]. As such, developing statistically sound forecasting models based on weather
    variables is crucial for obtaining reliable predictions of crop yields. While
    earlier approaches mainly relied on regression models, discriminant'
