    Using the Interpretive Structural Modeling (ISM) technique, Malhotra et al. [17]
    developed a hierarchical framework to assess the difficulties of deploying the
    IIoT in manufacturing. The framework finds and groups problems into technical,
    organizational, and social categories. It then examines how these categories relate
    to one another and creates a hierarchical structure. Important conclusions include
    the following: (1) the most significant technical constraints are insufficient
    resources and high investment costs; (2) the most significant organizational obstacles
    are insufficient resources and a skilled labor force; and (3) the most significant
    social barriers are privacy and data security concerns. With the purpose of successfully
    implementing IIoT in manufacturing, the hierarchical structure aids in the prioritization
    of problems and the design of focused solutions.


    In order to improve data security in IIoT, Mathew et al. [18] investigated the
    intriguing combination of BCT and collaborative intrusion detection systems (CIDS).
    It draws attention to the shortcomings of conventional, centralized security techniques
    in the intricate world of IIoT and underscores the necessity of a more decentralized
    strategy. The immutability, transparency, and trustless collaboration of BCT are
