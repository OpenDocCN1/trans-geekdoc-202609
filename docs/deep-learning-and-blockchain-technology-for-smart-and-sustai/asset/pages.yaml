    robust cybersecurity measures. The global landscape is witnessing the emergence
    of smart cities, driven by advancements of information technology, while these
    innovations offer new economic and social prospects, they also present security
    challenges and raise concerns regarding privacy expectations (Elmaghraby & Losavio,
    2014). This has led to a multitude of security challenges, ranging from unauthorized
    access to critical infrastructure to data breaches compromising citizen privacy.
    The centralized nature of many smart city systems amplifies these challenges,
    creating single points of failure that can be exploited by malicious actors. Moreover,
    the sheer volume of data generated by smart city components poses challenges in
    terms of secure storage, transmission, and analysis. There are five major security
    challenges in smart cities, which encompass maintaining privacy amidst complex
    datasets, securing expansive networks, fostering trust in data sharing, effectively
    deploying artificial intelligence, and addressing cascading failures within the
    smart network (Braun et al., 2018).


    # 12.2.3 Introduction to Blockchain Technology


    Blockchain technology, originally created as the foundational structure for digital
    currencies such as Bitcoin, has attracted interest due to its potential beyond
    financial uses. Essentially, a blockchain functions as a decentralized and distributed
    database that securely records transactions across a network of computers in a
    transparent and tamper-proof manner.

    A blockchain, alternatively referred to as a Chain of Blocks, links each block
    to its precursor by retaining the hash data of the preceding block. This hash
    is derived from the data within the block, and any adjustments made to the block
    result in a new hash. As a result, even slight modifications within a block disrupt
    the entire chain because subsequent blocks are unable to pinpoint the tampered
    block due to inconsistencies in the hash. In these instances, the longest chain
    is recognized as the most legitimate, resulting in the eventual disregard of the
    altered blockchain (Imteaj et al., 2021).


