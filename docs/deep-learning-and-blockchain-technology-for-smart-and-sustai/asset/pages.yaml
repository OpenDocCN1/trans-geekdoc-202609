    [12] presented a novel technique for detecting cyberattacks in IoT/IIoT devices.
    This method examines the values in the registers of the device, as opposed to
    conventional approaches that depend on network traffic analysis. In order to enable
    the model to characterize the sort of attack as well as determine whether an attack
    has happened, the authors incorporate an embedding layer into a neural network
    design. Deep learning has the potential to improve IoT/IIoT security at the device
    level, as this technology outperforms previously published models in terms of
    performance. The “Smart Collaborative Framework” (SCF) was presented in the paper
    by Ai et al. [13] in order to solve the problem of multi-task offloading in IIoT-MEC
    networks. This system makes use of a two-part model: the Fine-grained Resource
    Scheduling (FRS) module allocates resources taking into account aspects such as
    game theory and queuing theory, while the Hierarchical Spatial-Temporal Monitoring
    (HSTM) module predicts task urgency based on historical data. Through the integration
    of strategic resource allocation and deep learning for prediction, SCF seeks to
    accomplish effective and dynamic multi-task offloading in IIoT environments. A
    novel safety-as-a-service (Safe-aaS) plan for IIoT that makes use of federated
    machine learning and blockchain was proposed by Hasan et al. [14]. This plan seeks
    to enable efficient safety decision-making while simultaneously addressing privacy
    and security issues. The solution guarantees the openness and immutability of
    safety-related data by utilizing blockchain, while federated learning permits
    machine learning models to be trained on local data without jeopardizing privacy.
    Increased confidence among members of the IIoT ecosystem, lower costs, and enhanced
    safety are just a few advantages of this combination. MeAEG-Net is a revolutionary
    technique that was proposed by Wang et al. [15] for identifying anomalous traffic
    in –IIoT networks. This approach uses a generative adversarial network (GAN) that
    has only been trained on normal traffic to address the problem of limited labeled
    aberrant data. The generator of the GAN makes an effort to reconstruct typical
    traffic, and anomalies are found by analyzing its reconstruction mistakes for
    real traffic. A “memory'
