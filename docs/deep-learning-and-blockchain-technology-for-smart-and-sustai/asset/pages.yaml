    # 12.3.5 Critical Infrastructure Resilience (CIR)


    Smart cities depend on interconnected and interdependent critical infrastructure
    systems, including communication, water, power, sanitation, and healthcare, to
    deliver vital services and improve the well-being of their residents. However,
    these CI are also exposed to various vulnerabilities and threats, such as cyberattacks,
    natural disasters, climate change, and human errors, which can disrupt their normal
    functioning and cause cascading impacts across sectors and scales. Therefore,
    enhancing the resilience of CI in smart cities is a key challenge and opportunity
    for urban planners, policymakers, and researchers. Resilience refers to a system’s
    capacity to endure, adjust, and bounce back from various disruptions and pressures,
    all while preserving its fundamental operations and essence. Resilience can be
    achieved through a combination of technical, organizational, and social measures,
    such as risk assessment, contingency planning, redundancy, diversity, flexibility,
    learning, and collaboration (Ali et al., 2018). Smart cities need to adopt a comprehensive
    and proactive approach to CIR, which involves developing and promoting an organizational
    resilience culture, identifying and managing cross-sectoral dependencies, providing
    timely and high-quality policy advice, implementing effective cybersecurity measures,
    and supporting collaboration and coordination among various stakeholders. By enhancing
    CIR, smart cities can improve their operational efficiency, social and economic
    well-being, and national security.


    # 12.4 Blockchain Technology: An Overview


    # 12.4.1 Fundamental Principle of Blockchain


    Blockchain technology serves as the foundational framework for secure and transparent
    decentralized transactions. At its essence, a blockchain functions as a decentralized
    record-keeping system that logs transactions across a network of computers, termed
    nodes. Transactions are organized into blocks and connected to preceding ones,
    creating a continuous chain of information. The fundamental principles of blockchain
    includes the following:'
