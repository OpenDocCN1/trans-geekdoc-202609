  md: '| Layer | Equipments | Function | Attacks |

    |---|---|---|---|

    | Transmission layer | Network devices | Transmitting data to cloud for analysis
    | Data leakage Delay in transmission Jams wireless channel to introduce noise
    Selective forwarding |

    | Application layer | End-user devices | Monitoring the application Decision-making
    | Overflow occurs in buffer Malicious code |


    Some attacks affect all layers such as eavesdropping, man-in-the-middle, denial
    of service, spoofing and replay attack. Spoofing is the process by which attackers
    read the data and then modify it by adding or deleting the data. Denial of service
    makes the network unavailable by blocking the traffic.


    Vulnerability is a condition that can be exploited by an adversary to damage systems.
    A vulnerability assessment involves identifying weaknesses and finding solutions
    to reduce the vulnerability. These are classified into three types such as management,
    network and platform. A lack of security policies introduces management vulnerability.
    Network vulnerability includes hardware, configuration and monitoring vulnerabilities.
    Platform vulnerability involves database and hardware vulnerabilities. The reason
    for these vulnerabilities is the use of USB, poor programming skills, the inclusion
    of third-party components, and the increase in connections.


    Cyber-physical systems not only suffered from vulnerabilities and threats, but
    also affected by failures in the system. The failures occur due to inaccurate
    information, delay in transmission, sensor node fault, lack of messages to transfer,
    increased implementation cost and errors in service upgrades.


