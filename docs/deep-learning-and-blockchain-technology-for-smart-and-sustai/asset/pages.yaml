  md: '# 4.2.1 Computing Management


    As IoT devices are resource-constrained, a lot of data has usually been sent to
    distant cloud servers for additional processing. But the IoT’s scalability is
    limited by the pure cloud-based computing paradigm, which also results in network
    traffic bottlenecks, prolonged latency, privacy exposure, and context unawareness
    [13]. By transferring computational workloads between remote cloud servers and
    MEC servers, which are usually placed at Small BS, Macro BS, Wi-Fi APs, and IoT
    gateways that are nearby users, MEC [14] is becoming a more and more essential
    part of cloud computing. Then, the response, privacy preservation, and context
    awareness can all be enhanced by moving the less computationally demanding, context-aware,
    and latency-critical workloads between distant cloud servers and nearby MEC servers.


    # 4.2.2 Network Management


    Nowadays, distributed IoT can benefit from the flexibility and scalability provided
    by software-defined networking (SDN) technology [15]. But Kalkan and Zeadally
    [16] demonstrate that the single point of failure locates from the centralization
    of SDN. Additionally, current SDN devices (such gateways) are unable to analyze
    data stream computationally intensively. SDN’s drawbacks can be mitigated by integrating
    blockchain technology with SDN. A safe blockchain-based SDN framework for IoT,
    for instance, is suggested by the work of Sharma et al. [17]. To update the flow
    rule table securely and eliminate the need for an intermediary, a blockchain-based
    system has been built. Moreover, blockchain technology has the potential to enhance
    network security for network function visualization (NFV) management. Specifically,
    Alvarenga et al. [18] demonstrate that NFV configurations may be made anonymous,
    consistent, auditable, non-repudiable, and immutable by integrating blockchain
    technology.


    # 4.2.3 Communications Management


    The 5G communication systems’ increased resource management is being driven by
    the rising demands of mobile data traffic. For example, the most important resource
    is radio spectrum and its components are Spectrum sharing and auction [19]. Secure
    and dynamic spectrum management in 5G and 6G communication systems could be accomplished
    through the use of BC technology in Federal Communications Commission [20,21,22].'
  merge: -1
  img_proc: true
