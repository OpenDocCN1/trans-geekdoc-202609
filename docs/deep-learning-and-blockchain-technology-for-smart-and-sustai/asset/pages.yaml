    # 18.1 Introduction


    In farming, choosing the correct crop at the right time plays a crucial role for
    getting better yields. But in the present period due to unusual weather conditions,
    it is getting hard to choose day by day, and both the farmers and civilians are
    affected due to such problems. Farmers are affected due to the loss of the crops
    and their hard work over the period of growth of the crops. Civilians are affected
    by getting those crops in a higher price than the regular price due to the lack
    in availability of new stock in market. So, there must be steps taken to reduce
    the loss of crops or mitigate the risks of decision-making.


    So, this model is for making decision-making more easier for farmers. This model
    will use the past historical data along a period of more than a century to track
    the weather patterns over certain locations and will undergo specific machine
    learning algorithm that will predict the crop that can be yielded in a higher
    rate. This prediction will be displayed as a pie chart using certain python modules,
    and this pie chart can be displayed on a mobile app, which can be operated on
    any smartphone. In this manner, the farmers can get necessary help to take wise
    decisions before sowing.'
