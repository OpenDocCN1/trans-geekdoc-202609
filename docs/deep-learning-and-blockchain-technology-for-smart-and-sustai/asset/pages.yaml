    # 20.3 Material and Methods


    The dataset and methodology utilized in this research study are described in depth
    in this section.


    # 20.3.1 YOLOv5


    In this process, the model is exposed to the entire training dataset multiple
    times in batches during each epoch. Monkeypox images are analyzed by the model
    within a batch, as well as their corresponding labels. After that, it predicts
    bounding boxes around potential lesions and determines the probability of them
    being monkeypox. A loss function measures how wrong these predictions were compared
    to what they should have been, i.e., these errors provide a measure of error for
    models. With this information on errors, an optimizer can adjust its internal
    parameters accordingly in order to detect monkeypox better in future images. Periodically,
    its performance is tested using a separate test dataset so that it does not learn
    too much from the training examples, which may cause overfitting. This leads to
    continuous learning and improvement on how accurately it can identify monkeypox
    by modeling such processes.


    # 20.3.2 Blockchain


    The blockchain technology implemented by this code allows for the safe transfer
    of data, including maybe the prognostic outcomes of a medical diagnosis. Envision
    an impenetrable chain where every link is dependent upon every other link. This
    is how it operates:'
  merge: -1
  img_proc: true
- pgno: 435
  md: '+   1. **Blocks and Security**: A timestamp, a unique fingerprint produced
    by a hashing function, and data (results) are all contained in each block that
    makes up the system. This fingerprint—or hash—is very important. The hash might
    be absolutely altered through any change to the information, making manipulation
    clean to spot.


    +   2. **Building the Chain**: Predefined information is used to build the genesis
    block, which is the initial block within the chain. The additional data chunk
    is delivered to subsequent blocks with the aid of referencing the hash of the
    preceding block. Because of this, a sequence is shaped wherein every block depends
    on the integrity of the one before it.


    +   3. **Transfer and Verification**: The code divides the data (anticipated outcomes)
    into digestible portions for transfer. Every segment gets a separate block, creating
    a blockchain unique to this record. By ensuring that the hash of each block accurately
    refers to the hash of the previous block, the recipient may also confirm the integrity
    of the contents. A break in the chain would suggest manipulation.


    Sensitive information, such as test results, can be transferred securely thanks
    to this method. Building confidence and transparency in the process is achieved
    by guaranteeing that data has not been tampered with during transmission. Figure
    20.1 shows the workplan of the proposed work.


    ![](img/96b9fa3db3bfeef3ca6e7362a69b2849_435_0.png)


    # Figure 20.1 Workplan.


    Measuring the correctness of a blockchain system, probably in healthcare, is step-by-step.
    It begins with a collection of information. This data is prepared. Then, it is
    split into a training set and a test set. The precision of the blockchain system
    is then measured using the testing data. The system involves the encryption process
    that takes place in each node of the blockchain network.'
