    # 5.1 Introduction to Blockchain


    A blockchain is essentially a series of blocks, each of which has a collection
    of data or transactions. These pieces are joined to make a chain in the order
    in which they occur. This is a condensed description of how blockchain functions:


    +   1. **Decentralization**: Blockchain functions in a decentralized fashion as
    opposed to conventional centralized systems, which store data in a single location
    or under the supervision of a central authority. This indicates that rather than
    being handled by a single entity, data is stored and managed by a network of nodes
    or computers.


    +   2. **Transparency and Immutability**: Data on a blockchain cannot be removed
    or changed once it is recorded there. The whole chain is tamper-evident as each
    block includes a cryptographic hash of the one before it. This guarantees the
    data stored on the blockchain to be transparent and unchangeable. Consensus techniques
    are employed by blockchain networks to verify and reach a consensus over the contents
    of every block. Delegated Proof of Stake (DPoS), Proof of Work (PoW), and Proof
    of Stake (PoS) are a few examples of popular consensus procedures [1].'
  merge: -1
  img_proc: true
- pgno: 102
  md: '3. Smart Contracts: These are self-executing contracts that have the conditions
    of the deal encoded directly into the code. When specified criteria are satisfied,
    they automatically implement and enforce the agreement''s contents. Ethereum and
    other blockchain systems are popular places to implement smart contracts.


    # 5.1.1 Key Features of Blockchain


    +   1. Security: Data on blockchain is encrypted using cryptographic techniques,
    making transactions immune to fraud and illegal access.

    +   2. Transparency: Because blockchain technology is transparent, all users can
    see and validate transactions, which encourages responsibility and confidence.

    +   3. Decentralization: Peer-to-peer transactions are made possible by blockchain,
    which eliminates the need for middlemen and lowers costs while boosting efficiency.

    +   4. Immutability: Data cannot be altered or removed once it is entered into
    the blockchain, making it a trustworthy and auditable record of transactions.

    +   5. Interoperability: Blockchain technology possesses the capability to function
    in conjunction with many platforms and systems, enabling smooth data transfer
    and network integration [2].


    # 5.2 Introduction to Deep Learning


    In a number of fields, including computer vision, natural language processing,
    speech recognition, healthcare, and finance, deep learning has shown impressive
    promise. AI applications have advanced significantly as a result of its capacity
    to automatically learn hierarchical representations of data from large-scale datasets.
    This has made tasks like picture classification, object recognition, language
    translation, sentiment analysis, and medical diagnosis possible.


