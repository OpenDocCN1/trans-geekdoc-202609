    # 20.3.4 Existing Methodology


    Polymerase Chain Reaction, or PCR, has been a total game-changer in molecular
    biology and all sorts of other scientific fields. It lets researchers copy and
    amplify specific DNA sequences, which is super useful for studying genes and all
    kinds of other genetic stuff. But even though it’s super helpful, PCR isn’t perfect.
    A couple of obstacles occur when matched with it.


    First off, PCR can be expensive. It requires fancy equipment, special chemicals,
    and other materials that cost a pretty penny. This can be a real barrier for scientists
    who work in places with limited resources. And that suggests they could not have
    access to PCR technology, which can limit the kinds of research they can conduct.'
