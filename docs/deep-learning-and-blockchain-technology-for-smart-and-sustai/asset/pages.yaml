    # 13.3.3 Feature Selection


    The process of limiting the number of input parameters or attributes by removing
    unnecessary features is known as feature selection. Reducing the number of factors
    is vital to improve model performance and lowering the computational cost of the
    modelling process. One crucial function that aids in reducing the number of input
    attributes or variables in forecasting is the “feature importance score,” which
    offers knowledge and insight into the working dataset.


    The methods used to rate each input feature for a particular model are referred
    to as “feature importance,” and the scores only represent the “importance” of
    each feature. A higher score denotes a greater influence of that specific property
    on the model predicting the target attribute. In this research, the random forest
    algorithm is used to determine the feature importance score.


    # 13.3.4 Data Normalization


    It is necessary to scale variables that comprise multiple qualities with disparate
    units to a particular scale to guarantee that each attribute is given equal weight.
    Data normalization is the term for this procedure. This keeps a less significant
    characteristic with a larger range of values from overshadowing a possible more
    significant trait. In this instance, we use the mean-standard deviation scaling
    or Z-score normalization to rescale all of the attributes. The set has been standardized
    through the incorporation of the computational formula, which is expressed in
    the following equation:


    \( X_{norm} = \frac{X - X_{mean}}{X_{std}} \) (13.4)


    where X_norm is the feature value after normalization, X is the feature value,
    X_mean is the mean of the population, and X_std is the standard deviation of the
    population.


    # 13.3.5 AQI Calculation


    After testing with a normalized dataset using a minmax scale with a range of 0–1,
    the AQI values are determined. The formula to convert each concentration of a
    pollutant to the Air Quality Index is indicated as follows:'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'AQI = \frac{CB_{high}-CB_{low}}{C_{high}-C_{low}}(C - C_{low}) + CB_{low} (13.5)


    where AQI is the Air Quality Index, CBhigh is the breakpoint concentration to
    Chigh, CBlow is the breakpoint concentration to Clow, Chigh is the concentration
    breakpoint ≥ C, Clow is the concentration breakpoint ≤ C, and C is the recorded
    pollutant concentration. The final air quality level can be calculated by taking
    into account the pollutant''s maximum AQI value. There are six different categories
    of air quality: Severe (401–500), Very Poor (301–400), Poor (201–300), Moderate
    (101–200), Satisfactory (51–100), and Good (0–50). After AQI calculation, the
    number of samples for each range (0 indicates Good, 5 indicates Severe) is illustrated
    in Figure 13.3.


