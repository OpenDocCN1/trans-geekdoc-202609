    # 2.3 Proposed Methodology


    The proposed work consists of five modules namely Dataset collection, Preprocessing,
    Applying RBSA and SBFS, Applying BOW model, and Email classification using ML
    algorithms. In this work, the publicly available Enron email dataset has been
    used for comparing the efficiency of ML algorithms with RBSA and SBFS and ML algorithms
    without RBSA'
