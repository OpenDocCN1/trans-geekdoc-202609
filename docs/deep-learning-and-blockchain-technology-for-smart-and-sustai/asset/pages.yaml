    for optimizing urban processes and enhancing the overall day-to-day life for residents.
    In essence, object detection represents a convergence of cutting-edge technologies
    that enable machines to perceive and interpret urban visual data with remarkable
    accuracy and efficiency [6]. As smart cities continue to evolve, the integration
