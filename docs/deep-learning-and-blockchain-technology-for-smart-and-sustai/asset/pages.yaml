  md: 'learning algorithm SVM is appropriate. This approach performs admirably in
    both high- and low-dimensional spaces. Drawing a line or plane is necessary to
    divide the data points. This technique works well for prediction, text categorization,
    and pattern recognition. We employ it in our proposed strategy to classify the
