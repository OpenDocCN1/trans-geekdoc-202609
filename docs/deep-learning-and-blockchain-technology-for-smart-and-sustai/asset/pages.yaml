    and variability of earthquake magnitudes. Understanding the frequency and intensity
    of earthquakes in a particular area is made easier by analyzing the magnitude
    distribution, which supports risk assessment and disaster preparedness initiatives.


    # 15.3.2 LSTM


    An RNN architecture called LSTM models was created to overcome the shortcomings
    of conventional RNNs in identifying long-range dependencies in sequential data.
    In contrast, conventional RNNs have trouble during training with the vanishing
    gradient issue. Because of their distinctive design, LSTMs are ideally suited
    for time series prediction because they can efficiently identify temporal patterns
    and correlations in sequential data.


    **Data Preprocessing:** When preparing data for training a LSTM model, there are
    usually several preprocessing steps to ensure that the data is in an appropriate
    format so that the model can learn effectively. Here is a step-by-step description
    of the preprocessing methods used on the dataset.


    **Random Sampling Imputation:** This method substitutes observed values from the
    same feature that are randomly sampled for missing values. It preserves the variable’s
    distribution and is helpful when data is absent arbitrarily. The mean of the corresponding
    feature is used to fill in missing values in numerical features. Although the
    procedure is straightforward, bias may be introduced if data is not missing randomly.


    **Outlier Detection and Removal:** The distribution of continuous data can be
    seen and outliers can be found using boxplots. Observations that lie above the
    third quartile plus 1.5 times the IQR or below the first quartile minus 1.5 times
    the IQR are considered outliers. Next, outliers are set to a threshold value and
    capped or winsorized.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '**Feature Scaling**: This technique involves scaling characteristics to a comparable
    scale. Because it uses the median and interquartile range rather than the mean
    and standard deviation, it is resistant to outliers. It can thus be applied to
    data that contains outliers.


    **One-Hot Encoding**: Using a binary vector representation, each category in a
    set of categorical variables is transformed into a binary feature (0 or 1). This
    is helpful for algorithms (like linear regression) that may understand categories
    as ordered values but are unable to operate directly with categorical data.


    **Train–Test Split**: Training and testing sets make up the dataset. The model
    is trained on the training set, and its performance is assessed on the testing
    set. The trained model’s ability to generalize to new data is estimated using
    this.


    # 15.3.3 Composite LSTM-Proposed Model


    A suggested architecture called the composite LSTM model consists of two layers
    of LSTM networks. Each LSTM layer in this model processes the input data in parallel.
    The model is more successful than a single-layer LSTM in capturing intricate temporal
    correlations and patterns in the data. When compared to single-layer LSTM, the
    composite LSTM model provides better performance and versatility. The composite
    LSTM uses the same data processing methods as the LSTM model. The preprocessed
    data is trained for a composite LSTM with trimmed sequences from the first and
    second halves of the dataset. The proposed algorithm for composite LSTM is briefed
    in Figure 15.1.'
