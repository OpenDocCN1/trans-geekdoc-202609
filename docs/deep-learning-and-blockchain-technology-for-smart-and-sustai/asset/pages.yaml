  md: 'and SBFS. Subject and Text features of the emails have been extracted from
    the email dataset. Based on various rules framed on RBSA algorithm, the words
    of subject are analysed. The existence of spam words is also found in order to
    compute the weight of email. The Bag of Words model has been applied on body of
    email to find the frequency of words in body text. This BOW model produces sparse
    matrix as output, and it is augmented with the output of RBSA and SBFS algorithms.
    The machine learning algorithms such as SVM, Multinomial Naive Bayes, Gaussian
    Naive Bayes, and Bernoulli Naive Bayes have been applied for classifying emails
    into spam or ham. The performance of the proposed methodology has been compared
    with traditional method without using RBSA and SBFS.


    # 2.3.1 Dataset Collection


    The Enron email dataset [18] is used in this suggested work. There are 5,643 emails
    in total in dataset D. Since we only focus on subject and body features of email,
    unnecessary columns have been deleted from the dataset. In a data frame, the columns
    Label, Subjects, Text, and Weight are kept for later processing.


    # 2.3.2 Preprocessing


    In text processing and natural language processing [19,20], preprocessing is a
    crucial step. Preprocessing is used in email contents in order to minimise the
    amount of features. Text typically includes extraneous words, URLs, HTML elements,
    meaningless words, several words with the same meaning, special characters, and
    digits. These are eliminated from the provided input text to increase machine
    learning algorithms’ accuracy. Ham is encoded as 0, but spam is 1. The class labels
    can be made normal by using these encodings. Text labels should be changed to
    numeric labels since they are not comparable.


    The Subject and Text columns are then subjected to tokenization. Word tokenization
    is used to represent the content in the Subject and Text columns. Words like “in,”
    “the,” “this,” “that,” “is,” etc. are stop words. Prior to using machine learning
    techniques, these terms should be disregarded because they are more common and
    do not help with the'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'classification process. Eliminating stop words increases classification accuracy
    because ML algorithms process fewer tokens.


    # 2.3.3 Applying RBSA and SBFS on Subject


    Finding spam phrases in the subject area of emails is the primary goal of RBSA.
    The most popular phrases used in spam are gathered from online resources. This
    method that is suggested follows a few rules. Several spam emails are cited in
    the formulation of these guidelines. Based on these guidelines, the weight is
    calculated for every email in the sample. The RBSA method that has been presented
    aids in the effective identification of spam emails.


    **Algorithm:** Rule-Based Subject Analysis

    **Input:** Words of subject

    **Output:** Spam_term_weight


    +   1. Words are compared with collection of spam words.

    +   2. If a word is spam word then it checks for various conditions

    +      2.1 If word has ‘?’ Or Capitalized Or Alphanumeric Or length > Max then
    increase number of spam terms of the email

    +   3. Spam_term_weight=spam_term/No. of emails

    +   4. Finally, computed spam term is assigned to spam_term_weight for each email


    After analysing subject feature of emails, the body features are analysed for
    feature reduction. This is achieved by combining the words with similar meaning
    in each email. The SBFS algorithm finds the synonym of each word and combines
    the words with the same synonym. The main objective of this module is reducing
    the number of features, which improves the classification accuracy.


    **Algorithm:** SBFS

    **Input:** Words in the body of emails

    **Output:** Reduced feature set'
