- pgno: 206
  md: '# # Addressing


    The high cost of new infrastructure and regulatory issues are two of the major
    issues that cities now face. Smart city innovation and growth are hampered by
    these issues.


    Government managers should understand that significant expenditures in infrastructure
    and technology will be required to make the transition to smart cities in order
    to stay up with the rapidly expanding trend of smart cities.


    It could be challenging to swiftly adopt changes for smart cities and keep up
    with urban growth due to financial limitations and conflicting goals. Technological
    advancement frequently surpasses municipal resources, and when it does arrive,
    it might not be fully utilized.


    Given their current communications infrastructure, the electric, gas, and water
    utilities are the industries best positioned to provide smart city services. Utility
    infrastructure could be used to lower deployment costs dramatically and hasten
    the rollout of smart city services. Existing laws governing public utilities,
    however, could occasionally function as a significant barrier. Restrictions imposed
    by regulations and worries about utility returns on investment (and the corresponding
    costs of electricity distribution) may force cities to invest large sums of money
    in developing their own infrastructure instead of utilizing the public utilities’
    existing infrastructure, increasing costs and slowing down innovation.


    Public utility regulation frameworks may also operate as roadblocks to urban modernization.
    For instance, Public Utility Commissions and other regulatory authorities must
    approve a specific tariff before a public utility can begin building out its infrastructure
    [11]. The influence on the electric consumer is the main concern of these regulatory
    agencies, which typically concentrate on the operations of public utilities. It
    is difficult to determine how a public utility’s smart city services should affect
    the rate base, which makes infrastructure investments even more difficult. The
    optimal way to deliver services for smart cities needs coordination between utilities,
    regulators, and governments. If local governments cannot afford to invest in the
    infrastructure and technology required to raise the standard of living for their
    residents, smart cities will not be able to expand and thrive.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 9.4 Exploring Technological Advances


    The right technologies, such as broadband mesh, public or private LTE, and Internet
    of Things (IoT) sensors, will depend on the specific requirements of each city
    and create the ideal smart city. In the IoT world, innovation is happening very
    quickly. IoT sensors have several uses in smart city applications, and the technology
    has the potential to change urban living. By using sensors in trash cans to track
    the weight of the bins, for instance, waste management expenses, traffic congestion,
    and air pollution can be decreased by only using trucks to remove bins when and
    where they are needed. IoT sensors can also be used to detect noise pollution
    and changes in air quality, warning city managers of possible problems before
    they become significant issues and detecting changes in environmental conditions
    before people could.


    Broadband mesh can enable video monitoring of passing autos for better traffic
    control and public safety, among other essential municipal enhancements like lowering
    traffic congestion. 5G technology may make it possible for smart cities to communicate
    among devices more quickly, improving safety and communication overall. In particular,
    5G can help ensure resilience and energy efficiency by enhancing system-to-system
    communication and alerting network operators to malfunctioning equipment in advance
    of possible outages. In the majority of cities that can accommodate 5G infrastructure,
    implementation is particularly effective. However, 5G’s novelty is one of its
    drawbacks. Large urban locations and more rural places might not have the same
    infrastructure available to serve these use cases just yet. This will alter as
    time goes on and 5G usage becomes widespread. Standardization organizations will
    then shift their attention to the following generation of communication. Controlling
    the lifespan of the services offered and the communication infrastructure that
    underpins them is crucial for governments and utilities. Even though city planners
    continue to face numerous obstacles, technology has the power to enhance city
    life overall and make the realization of more practical, effective smart cities
    a reality, and the evolution of the Smart Cities with IIoT and Blockchain technology
    (BCT) is stated in Figure 9.1. All BCT-related transactions connect the IIoT applications
    with the applications of smart city.'
