- pgno: 311
  md: '# 14.3.1.1.1 Wearable


    Growth in technology reduces the size of batteries and integrated circuits that
    makes the sensors small in size, less weight and easy to wear. The weight and
    size of the battery determine the size of the sensor.


    # 14.3.1.1.2 Reliable


    Reliable communication is enabled by processing sensor signals throughout the
    network. It depends on communication standards, battery life and energy consumption.


    # 14.3.1.1.3 Security


    Safe and secure communication is an important requirement for body sensors. This
    can be achieved using encryption algorithms. The devices are also protected using
    authentication schemes.


    # 14.3.1.1.4 Interoperability


    Medical devices will communicate with other devices. It allows users to build
    a robust application.


    The sensor nodes are organized in different topologies like tree, mesh and star
    topology [14]. The wireless standards are responsible for communication between
    various layers in WBAN. Near-field communication is a low-frequency standard that
    operates at 13.56 MHz, transmits from 0.1 to 1 m and supports narrowband modulation,
    making it suitable for short-range networks. The data rate is 423.75 kbps. Zigbee
    is a widely used standard in WBAN that operates at 0.9/2.4 GHz and transmits in
    the range 10–20 m. Zigbee accommodates large number of nodes, organized in either
    a tree or mesh topology with low data rates, i.e., 20–250 kbps. Bluetooth operates
    at 2.4 GHz frequency, designed using a star topology and transmits up to 100 m.
    Wi-Fi supports data rates of 11 and 54 Mbps, transmits up to 10 m and is organized
    in point-hub topology. Wi-Fi is suitable for fast networking and is inexpensive
    [15].


