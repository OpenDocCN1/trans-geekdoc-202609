  md: '# Editors


    ![](img/96b9fa3db3bfeef3ca6e7362a69b2849_16_0.png)


    Dr. V. Subramaniyaswamy is currently working as a professor at the School of Computer
    Science and Engineering, Vellore Institute of Technology, Vellore, India. He received
    a Ph.D. degree from Anna University, in 2013, and continued his extension work
    with the Department of Science and Technology Support as a Young Scientist award
    holder. With experience of more than 18 years as an academician and a researcher,
    he has contributed more than 200 articles and chapters to many high-quality technology
    journals and books that are being edited by internationally acclaimed professors
    and professionals. He is a research supervisor and successfully guided six research
    scholars. He is also a visiting expert at various universities in India and abroad.
    He has received government funded and consultancy projects from DST-SERB, ICSSR-IMPRESS,
    DST-CSRI, MHRD, TVS MOTORS, MHI, Royal Society, UK, and SERB-MATRICS. He is on
    the review boards of several international journals and has been a program committee
    member for several international/national conferences and workshops. He serves
    as the guest editor for various special issues of reputed international journals.
    His technical competencies lie in recommender systems, blockchain network, artificial
    intelligence,'
  merge: -1
  img_proc: true
