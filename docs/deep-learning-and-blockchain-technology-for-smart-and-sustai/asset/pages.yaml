  md: 'nucleus of the stria terminalis, components of the hypothalamus, non-thalamic
    nuclei projecting diffusely to the cerebral cortex, and the majority of centers
    that regulate autonomic functions. Common voice modulation symptoms, such as dysphonia
    and dysarthria, can be evaluated through sustained phonation or running speech
    tests, providing a realistic measure of impairment and facilitating early diagnosis
    at stage 0 [3]. Once detected early, physicians can implement therapeutic solutions
    or deep brain stimulation to reactivate dopamine-producing neurons, thereby slowing
    PD progression. Despite its complexity, a cure for Parkinson''s remains elusive;
    however, timely identification followed by appropriate medication can alleviate
    tremors and imbalance symptoms, enabling patients to lead a relatively normal
    life. The project delves into the realm of early PD detection through audio recordings
    of PWP in smart cities, utilizing machine learning (ML) techniques. This innovative
    approach underscores the significance of audio as a non-invasive biomarker for
    PD detection. Preliminary results indicate that a random forest classifier model,
