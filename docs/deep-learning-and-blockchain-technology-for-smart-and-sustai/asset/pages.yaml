  md: 'device, either concentrator or cloudlet, is required to aggregate the data
    (Figure 14.1).


    ![](img/96b9fa3db3bfeef3ca6e7362a69b2849_309_0.png)


    # Figure 14.1 Architecture of medical cyber-physical system.


    A concentrator is designed for weak functionality devices, and a cloudlet is aimed
    to collect from high power devices also. Since the medical data is sensitive and
    significant, it requires careful monitoring and processing. The cloud is responsible
    for secure processing, storage and computation. The fourth layer is the action
    layer, which converts the results into action. The communication between the devices
    creates a three-tier architecture: Tier1—Intra BAN communication, Tier 2—inter
    Ban Communication and Tier 3—beyond BAN communication. The functions of these
    layers are data collection, transmission and computation.


    # 14.3.1 Sensors


    Sensors play a vital role in collecting signals from patients. These are operated
    by battery, memory limited, small size and low-cost devices. Figure 14.2 classifies
    the sensors used for medical applications in wireless body area networks.'
