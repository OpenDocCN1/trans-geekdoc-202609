    A two-phase model was presented by Ikram et al. [16] to forecast both regular
    and anomalous IIoT traffic. A random forest classifier is used in the second phase
    to forecast traffic patterns based on the features that were picked in the first
    phase, which used a modified whale optimization method to identify the most significant
