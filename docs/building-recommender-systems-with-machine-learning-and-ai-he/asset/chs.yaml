  \ MovieLens 数据集以便我们将电影 ID 转换为对你有意义的标题、想要获取推荐的 `user_id`，以及想要获取的推荐数量。\n\n对于每个推荐器，让我们看看发生了什么。首先我们使用完整的训练集训练推荐算法，因为我们在这里没有做训练/测试——我们只想要获得最好的推荐。我们接下来做的是为感兴趣的用户获取“反测试集”。这所做的只是产生该用户尚未评分过的所有电影的测试集，因为我们不想推荐用户已经看过的电影。接下来我们为该用户未见的每部电影生成评分预测，然后根据预测评分对它们进行排序。我们提取前\
  \ N 个结果并将其打印出来。再次，这不是最高效的方法，但为了评估目的，这是一个很好的方法。\n\n### EvaluatedAlgorithm 模块\n\n\
