  \n[content]\n# 扩展规模\n\n到目前为止，我们像示例演示的那样，使用了 `MovieLens` 的 100,000 条评分。这对于教育目的来说足够了，但如果你想为一家真实的公司构建推荐系统，你可能需要处理更多的数据——下一节将介绍如何扩展规模——这些系统的存在是为了让你在“大数据”上训练推荐系统，这些系统可能在集群上进行，甚至可能在云端进行。有很多种选择，但我们将介绍我最喜欢的几种。\n\
  \n## Apache Spark\n\n你可能听过 Apache Spark – 它是一个非常强大的框架，用于跨集群处理海量数据集。随着你数据的增长，你只需要不断向你的集群中添加更多计算机即可！目前，我在这里不会详细介绍\
  \ Spark 的工作原理，但我们将从实战角度关注它——我们将安装它并使用 Spark 检查一些代码。现在你可以把它看作是运行在一台电脑上，即你的 PC 上。\n\
  \n如果你想在这一节中用你自己的 PC 跟上操作，首先需要安装 Spark。在 Windows 上，这有点麻烦——无论你使用什么操作系统，这里都是你需要遵循的步骤。如果你不熟悉在操作系统上设置环境变量，你可能应该只看接几个视频，否则你可能会遇到麻烦。\n\
  \n## 在 Windows 上设置 Spark\n\n第一步是从 Oracle 网站安装 Java SDK – 并确保它是 Java 8，而不是 Java 9\
  \ 或更高版本！Spark 仅与 Java 8 兼容。安装时，你需要确保将其安装在不包含任何空格的路径下——因此在 Windows 上，你不能接受 \"Program\
  \ Files\" 下的默认位置，因为 \"Program\" 和 \"Files\" 之间有一个空格。使用一个新的路径，比如 `c:\\jdk` 之类的容易记忆的路径。\n\
  \n然后，你需要在系统中将 `JAVA_HOME` 环境变量设置为你安装 Java 的路径。在 Windows 中，环境变量是通过系统面板设置的——从那里选择高级设置，然后你就会看到一个进入环境变量的按钮。这些步骤专门适用于\
  \ Windows——由于 Spark 的某些功能使用了 Hadoop 分布式文件系统，如果它不认为你的 PC 上安装了 Hadoop，它将无法运行。我们可以通过将课程材料中\
  \ \"ScalingUp\" 文件夹里提供的 `winutils.exe` 文件复制到 `c:\\winutils\\bin`，然后将 `HADOOP_HOME`\
  \ 环境变量设置为 `c:\\winutils` 来欺骗它。此时，你应该重启 PC 以确保所有新环境变量都已生效。\n\n最后，你需要在 Anaconda 环境中安装\
  \ `pyspark` 包。还有一点——如果你已经安装了 Spark 并设置了 `SPARK_HOME` 环境变量，你需要确保你安装的 Spark 版本与 `pyspark`\
  \ 包安装到 Anaconda 中的版本相同。通常这应该是最新版本即可。如果你在机器上安装了不同的 Spark 版本，你将收到关于“Java 网关进程在发送其端口号之前退出”的奇怪错误，这些错误是毫无意义的。完成这些步骤后，我们就可以继续并开始玩玩\
  \ Apache Spark 了！\n\nSpark 之所以非常重要，是因为它非常高效地以可靠的方式在集群上分发对海量数据集的处理。在架构上，它看起来是这样的——你编写一个驱动脚本（使用\
  \ Python、Scala 或 Java），定义你想要如何使用 Spark 提供的 API 处理你的数据。一旦你启动了该驱动脚本（通常是从集群的主节点启动），它将与你的集群管理器通信，从你的集群中分配它所需的资源。如果你在\
  \ Hadoop 集群上运行 Spark，那么该集群管理器可以是 Hadoop 的 YARN 管理器；或者如果你想用它，Spark 也有自己的集群管理器。\n\n\
  该集群管理器会在你的整个集群上分配一组执行器进程，这些进程将执行处理你数据的实际工作。Spark 处理了如何划分你的数据并以最有效的方式处理数据的所有细节。它通过尽可能将内容保留在内存中、尝试在存储数据的实际节点上处理数据，并使用一种称为“有向无环图”（directed\
  \ acyclic graph）的东西以其最有效的方式组织处理。所有这些不同的组件在需要时都可以相互通信，如果你的集群中的某台机器故障或其他情况，这可能会变得必要。它具有很强的韧性。例如，尽管在这个简化图中，集群管理器看起来像是一个单点故障，但你可以进行设置，准备一个备用集群管理器以便在必要时接管。\n\
  \n## Spark 库和 API\n\n从软件开发人员的角度来看，Spark 由一个管理我们讨论过的所有工作分发的核心组成，Spark 之上还有其他你通常会用库：\n\
  \n- **Spark SQL**：定义了名为 `DataSet` 的东西，这允许你像使用数据库一样使用 Spark。这现在已成为使用 Spark 的标准方式。\n\
  - **Structured Streaming**（结构化流处理）：允许你实时摄取数据并在数据进入时对其处理。它还提供了结构化流，甚至允许你将实时数据视为 SQL\
  \ 数据。\n- **GraphX**：用于分析组织成图结构的数据，例如社交网络。\n- **MLlib**：我们最感兴趣的机器学习库。\n\n在我们深入某些代码之前，有一个你需要的概念——`RDD`。`RDD`\
  \ 代表弹性分布式数据集（resilient distributed dataset），如果你不使用 SQL 接口，它是 Spark 的核心。`RDD` 是封装了你想要处理的数据的对象。当你编写\
  \ Spark 脚本时，你实际上是在对 `RDD` 进行定义操作，这些操作连接在一起并最终导致预期的输出。你定义 `RDD` 应从哪里加载数据、在这些数据上执行哪些聚合操作，以及完成后输出到哪里。在你启动并请求输出之前，实际上什么都不会发生。从编程的角度来看，这很棒，因为你只需要考虑\
  \ `RDD` 以及它们在集群上分发这些操作。在技术世界中，一切保持不变的是，Spark 随着时间的推移引入了替代方案：如果你想对数据有更细粒度的控制，仍然可以针对\
  \ `RDD` 进行编码，而 `DataFrames` 的引入具有更好的类型安全——这样你可以在编译时而不是运行时捕捉错误。`DataSet` 使用所有组件之间的通用语言，这有助于简化开发。你也可以将\
  \ `RDD` 转换为 `DataFrame`，反之亦然。技术上，`DataFrame` 与 `DataSet` 对象是完全相同的。`DataSets` 也稍微慢一点，所以有些人选择在\
  \ Python 之外坚持使用 `DataFrames`。这很困惑，为什么要告诉你这些？我们的 Python 示例将使用 `RDD` 接口对输入数据进行初始清理和结构化。但然后我们必须将其转换为\
  \ `DataFrame`，因为这是 Spark 库期望的输入。`DataSets` 与我们无关因为 we are coding in Python but it\
  \ is a term you'll hear a lot when people talk about Spark.\n\n## 实现 ALS\n\n完成这些后，让我们看看真实的驱动脚本并用它创建一些推荐。因此，在你的\
  \ RecSys 环境中打开 Spyder，打开 Scaling 文件夹中的 `SparkALS.py` 文件。这是从 Spark 附带的一个示例改编的——它们实际上也使用\
  \ `MovieLens` 作为示例。但我做了一些修改，使其与我们的特定数据集工作并生成前 N 个推荐。代码小得惊人，不是吗？Spark 玩起来很有趣的一个原因是因为你可以用非常少的代码做非常强大的事情。让我们深入吧。首先，我们从\
  \ `pyspark` 本身导入需要的包。正如我们提到的，现代 Spark 脚本使用 Spark SQL 作为它们的主要接口，这意味着我们需要为驱动脚本设置一个\
  \ `SparkSession`。它在精神上类似于数据库会话，但我们不会将其用作数据库。我们还将导入 `RegressionEvaluator`，它可以让我们在结果上测量\
  \ RMSE，最重要的是来自 `pyspark.ml.recommendation` 的 `ALS`。这允许我们使用 ALS（交替最小二法）作为其优化函数执行矩阵分解。但神奇的地方在于，它的编写方式使得工作可以分发到集群，而我们甚至不需要考虑它是工作的！我们还导入了\
  \ `MovieLens` 类，只是为了方便我们从电影 ID 打印出电影名称。\n\n现在进入驱动脚本本身。首先，我们创建一个 `SparkSession` 对象——这包含了我们想要执行的所有\
  \ Spark 命令。我们做的只是给它起一个名字，并让其他一切使用会话的默认设置。但如果你在这里这样做，你可以对 Spark 如何分配工作进行更细粒度的控制。接下来，我们使用\
  \ `SparkSession` 上的 `read` 函数将评分数据加载到 Spark 中，它内置了方便的 CSV 解析能力。然后我们对它调用 `rdd()`\
  \ 以检索一个包含所有我们可以操作的数据弹性分布式数据集。我们将该 RDD 存储在名为 `lines` 的变量中，因为此时它包含了直接从 `ratings.csv`\
  \ 读取的原始输入。要记住，此时 `lines` 并不是一个包含我们所有数据的真实结构。如果我们必须在单台 PC 上读取并存储所有内容，那将违背初衷。创建 `lines`\
  \ RDD 只是为读取这些数据创建一个占位符；`spark.read` 并没有在那里真正读取数据，它只是告诉了 `RDD` 从哪里读取数据——但这种读取可能从许多不同的机器并行发生，每台机器读取它们想要处理的一小部分输入数据。\n\
  \n接下来，我们将原始数据转换为更具结构化的东西。我们在 `lines` RDD 上调用 `map` 函数，使用提供的 `lambda` 函数转换每一行。这个\
  \ lambda 函数将每行转换为一个 `Row` 对象，该对象由四个名为 `userId`、`movieId`、`rating` 和 `timestamp`\
  \ 的列组成。我们这样做是因为所有现代 Spark 代码都运行在 `DataSets` 上，而不是 `RDD` 上——所以我们想要转换。`DataSet` 在所有组件之间使用通用语言，这有助于简化开发。你也可以将\
  \ `RDD` 转换为 `DataFrame`，反之亦然。技术上，`DataFrame` 与 `DataSet` 对象是完全相同的。`DataSets` 也稍微慢一点，所以有些人选择在\
  \ Python 之外坚持使用 `DataFrames`。这很困惑，为什么要告诉你这些？\n\n\n\n\n\n# Amazon DSSTNE\n\n![](img/image2896.jpg)\n\
  \n接下来我们将讨论一个来自 Amazon 的系统名为 `DSSTNE`。它的全称是深度可扩展稀疏张量神经引擎。当我 Amazon 个性化团队工作时，我们的算法和系统是公司内部最核心的秘密之一——但在\
  \ 2016 年，他们开源了 `DSSTNE` 并发布了一篇文章，详细介绍了如何使用它在 Amazon 规模上生成推荐。`DSSTNE` 使得使用稀疏数据设置深度神经网络成为可能，例如我们在训练推荐系统时使用的评分数据——而无需编写任何代码。你所做的是将训练数据转换为\
  \ `DSSTNE` 预期的格式，编写一个简短的配置文件来定义你想要的神经网络拓扑结构及其优化方式，剩下的工作交给它即可。`DSSTNE` 还可以运行在 `GPU`\
  \ 上，并非常快速地处理海量数据。如果你的 PC 有多个 `GPU`，它甚至可以将负载分布到这些 GPU 上并并行计算推荐。而且，如果你需要进一步扩展，可以将\
  \ `DSSTNE` 与 `Apache Spark` 集成，在更大的集群上运行。让我们先从在单机上使用 `DSSTNE` 的示例开始，然后讨论如何将其扩展到集群。\n\
  \n![](img/image2904.jpg)\n\n为了让大家有直观的感受，这里是在 MovieLens 数据集上训练 3 层神经网络的完整配置文件，它产生了一些非常惊人的结果。Amazon\
  \ 确实让它变得尽可能简单了。让我们简单过一下这个。\n\n## 神经网络配置概述\n\n我们首先从高层面的神经网络开始开始介绍——我们正在创建一个前馈自动编码器。具体来说，它是一种被称为“稀疏自动编码器”的东西。在这种语境下，稀疏性指的是对隐藏层施加约束，强迫它们发现有趣的模式，即使存在大量的隐藏节点。`SparsenessPenalty`\
  \ 下的值定义了这些约束。关于这些值代表什么详细信息，需要你去寻找斯坦福大学吴恩达（Andrew Ng）`CS294A` 课程关于稀疏自动编码器的讲义笔记，这些笔记可以在网上找到——不过，通常默认值是一个不错的起点。\n\
  \n接下来，我们指定不想打乱索引（shuffling the indices），但我们应用了“去噪”处理，这会根据指定的概率（在此例为 `20%`）随机将 `1`\
  \ 输入翻转为 `0`。这迫使隐藏层发现更健壮的特征，而不是仅仅收敛到 `1:1` 的关系，因为它要让网络从一个损坏的版本中重建输入。这有点奇怪，但我们在深度学习教程中讨论过这一点——通过强制你的神经网络工作更努力来获得更好的结果，无论是向它隐藏信息，还是像在本例中这样在训练的每次迭代期间直接搞乱它的输入。\n\
  \n接下来，我们定义损失函数的参数。这些参数与默认值（`0.9`、`0.1`、`1.0` 和 `1.0`）稍有不同——所以我认为这个示例已经进行了一些超参数调优。差别并不远，所以默认值可能仍然是一个很好的起点。\n\
  \n## 层定义\n\n最后我们进入了核心部分——`Layers`，在这里我们定义神经网络的层。我们定义了三层。\n\n1.  **输入层 (Input Layer)**：第一层是输入层——注意我们指定了它是“稀疏的（Sparse）”。这就是\
  \ `DSSTNE` 特殊之处——它是为大部分输入数据缺失的情况设计的。这里的输入情况非常像我们之前看过的 `RBM` 示例——对于我们训练的每个用户，我们为每个可能的项目都有一个输入节点，如果用户对该项目进行了评分，则设置为\
  \ `1`——但大多数项目都没有被用户评分。这意味着我们的输入数据是非常稀疏的，通过将此层指定为稀疏，`DSSTNE` 这一点并可以高效处理。我们将 `N` 设置为\
  \ `auto`，这意味着它将根据数据文件中的输入数量设置输入节点，该文件名为 `gl_input`。\n2.  **隐藏层 (Hidden Layer)**：我们的第二层是隐藏层，指定方式如下。它是全连接的，拥有\
  \ `128` 个节点并使用 `sigmoid` 激活函数。它也是稀疏的。\n3.  **输出层 (Output Layer)**：最后我们有输出层。我们在 `gl_output`\
  \ 文件中为它提供了训练所需的“答案”，并将 `N` 设置为 `auto`，以便它可以适应我们尝试预测的内容。它也具有 `sigmoid` 激活函数。\n\n\
  回过来看，你可能注意到这种架构假设输入和输出是二分的，但 MovieLens 评分数据是以 `1-5` 刻度存在的。事实证明，在这个示例中，他们弃用了真实的评分值——将每个评分视为对电影的隐式指示。而且效果非常好。然而，你可以执行我们在处理\
  \ `RBM` 时所做的技巧来获得更细粒度的结果和预测。\n\n## 代码活动\n\n![](img/image2919.jpg)\n\n`DSSTNE` 是开源的，你可以在\
  \ `GitHub` 上找到它。它是为连接有一个或多个 `GPU` 的系统制作的（用于运行神经网络）。我手头没有那样的系统，所以我将使用 Amazon 的 `EC2`\
  \ 服务来租用。运行此操作需要的这种机器并不便宜，所以我不会要求你在这里跟着操作，我们正在做的事情对于 Amazon 的免费层级用户是不需要的。如果你想查看获取机器以及安装必要软件的所有步骤，可以在\
  \ `GitHub` 上的项目设置页面找到详细说明，在这里 (https://github.com/amazondsstne/blob/getting_started/setup.md)。但我将跳过获取机器和安装必要软件的步骤，直接开始操作这个示例。运行示例的说明也可以在这里，在\
  \ GitHub (https://github.com/amazon-dsstne/blob/getting_started/examples.md)。\n\n\
  他们指出，通常使用 `DSSTNE` 涉及三个步骤：转换数据、训练和预测。\n\n### 步骤 1：数据转换\n\n首先，进入包含 MovieLens 示例的目录：\n\
  ```bash\ncd /opt/amazon/dsstne/samples/movielens\n```\n我们将从 GroupLens 下载 2000 万评分数据集。\n\
  ```bash\nwget http://files.grouplens.org/datasets/movielens/ml20m.zip\n```\n我们实际上只需要评分数据，所以我们将从包中提取它并保存为\
  \ `ml20m_ratings.csv`。\n```bash\nunzip -p ml20m.zip ml20m/ratings.csv > ml20m_ratings.csv\n\
  ```\n然而，`DSSTNE` 不能处理 `csv` 文件，也不希望数据每行一个评分。最终 `DSSTNE` 需要 `NetCDF` 格式的文件；他们提供了一个可以将文件转换为该格式的工具，但转换工具有自己的要求。因此，我们需要将评分数据转换为可以转换为\
  \ `NetCDF` 的格式。第一步要求排列我们的数据，使得每一行代表一个用户，后面是该用户的所有输入列表。我们希望每行包含一个用户 ID，后面是一个制表符，然后是该用户评分的项目的冒号分隔列表。如果你仔细考虑，这基本上是每个用户输入层的稀疏表示，每用户一行。因此这种输入格式非常接近我们训练神经网络所需的内容。Amazon\
  \ 提供了一个 `awk` 脚本将我们的 `csv` 文件转换为这种中间格式。让我们用 `convert_ratings.awk` 快速查看。\n```bash\n\
  cat convert_ratings.awk\n```\n`convert_ratings.awk` 利用了原始 MovieLens 数据中给定用户的所有评分都在一起的特性；它收集每个用户的所有评分，然后在完成后为每个用户输出一行。让我们运行那个转换脚本：\n\
  ```bash\nawk -f convert_ratings.awk ml20m_ratings.csv > ml20m_ratings\n```\n如果我们看一眼输出：\n\
  ```bash\nhead ml20m_ratings\n```\n我们可以看到它确实包含训练数据，每行一个用户，并以稀疏格式列出了用户评分的项目。现在我们需要将其转换为\
  \ `DSSTNE` 需要的 `NetCDF` 格式：\n```bash\ngenerateNetCDF -d gl_input -i ml20m_ratings\
  \ -o gl_input.nc -f features_input -s samples_input -c\n```\n这实际上生成了三个文件：`NetCDF`\
  \ 文件本身、一个包含每个神经元索引的索引文件，以及一个包含样本索引的文件。\n\n### 步骤 2：训练\n\n现在我们准备好战斗了。让我们快速查看 `config.json`，它定义了神经网络的拓扑结构以及它是如何的：\n\
  ```bash\ncat config.json\n```\n这是我们在幻灯片中看过的文件，但再次强调，最后是我们神经网络的核心。它看起来非常简单，但请记住这里隐藏了许多复杂性，涉及稀疏自动编码器、调优过的损失函数以及去噪功能——以及处理稀疏数据带来的所有复杂性，并将训练不是在我们的\
  \ CPU 上，而是在 `GPU` 上——可能是多个 `GPU`！这里的情况非常惊人。让我们开始运行，设置批处理大小为 `256`，运行 `10` 个轮（epochs）：\n\
  ```bash\ntrain -c config.json -i gl_input.nc -o gl_output.nc -n gl.nc -b 256 -e\
  \ 10\n```\n对于 2000 万条评分来说，这实际上快得惊人！如果你有多个 `GPU`，速度会更快——在这种情况下，你会使用 `mprun` 命令代替\
  \ `train` 命令。此的输出是 `gl.nc` 文件，它包含了模型本身。\n\n### 步骤 3：预测\n\n现在我们已经有了训练好的模型，让我们使用它为每个用户创建前\
  \ 10 个推荐。\n```bash\npredict -b 256 -d gl -i features_input -o features_output -k\
  \ 10 -n gl.nc -f ml20m_ratings -s recs -r ml-20m_ratings\n```\n这里的参数非常自言易懂。`-k 10`\
  \ 意味着我们需要前 10 个推荐，我们传入了位于 `gl.nc` 文件中的模型。不过值得注意的是，`predict` 命令也会自动进行过滤，这就是为什么我们传递了。\n\
  \n\n\n\n\n![](img/image2977.jpg)Amazon 发布了你可能想知道的关于如何将 `DSSTNE` 扩展到在集群上运行的所有细节；这里是该文章的短链接。显然，如果你没有预先搭建一个非常大、复杂且昂贵的集群，你无法运行它，但他们甚至向你展示了\
  \ Python notebooks，展示他们如何使用该集群来生成电影推荐。他们可以从浏览器中的 notebook 运行整个流程。我认为这是本课程中一个非常令人兴奋的时刻；我们已经看到了如何将真实的深度学习网络应用于巨大的推荐系统问题，并几乎无限地对其进行扩展。\n\
  \n## AWS SageMaker\n\n![](img/image2984.jpg)同样值得的是 Amazon 的 `SageMaker` 服务。`SageMaker`\
  \ 是亚马逊云服务（AWS）的一个组件，它允许你创建托管在 AWS 上的 notebook，可以在云端训练大规模模型，并从云端售卖该模型的预测结果。这是一种按需方式为你的推荐系统获取强大计算算力的简单方法，而且它还带了一些实用的推荐系统算法。\n\
  \n![](img/image2989.jpg)使用 `SageMaker` 涉及 3 个步骤：构建你的模型、训练你的模型以及部署你的模型。让我们从构建开始。\n\
  \n### 构建模型\n开始使用 `SageMaker` 非常简单——你只需要在 AWS 控制台中点击一个按钮启动一个新的 notebook 实例，系统就会为你启动一个托管的\
  \ Jupyter notebook 环境，并让你访问所有 `SageMaker` 的内置算法。你也可以启动包含你想要使用的几乎任何深度学习框架的环境，例如 `Tensorflow`\
  \ 或 Apache 的 `MXNet`。你使用该 notebook 来构建你的模型，在我们的案例中，一个推荐系统算法。\n\n你可以从该 notebook 启动启动模型训练，或者通过在\
  \ AWS 控制台中设置训练作业来启动。你的训练数据和测试数据需要是一种名为 `protobuf` 的特定格式，但 Amazon 提供了实用程序，可以轻松地将你的数据转换为这种格式，就像以前为\
  \ `DSSTNE` 准备数据一样简单。`SageMaker` 一个很棒的功能是，你还可以设置“超参数调优”任务，它会自动运行一系列交叉验证测试，以收敛到模型的最佳参数。而且，这种训练是可以分布式的——AWS\
  \ 将启动你需要的任意数量机器，并在它们上并行训练你的模型。当然，这并不是免费的——计算机时间需要花费真实的费用。\n\n最后，你通过 `deploy` 步骤将训练并调优后的模型投入生产。这也会在\
  \ AWS 中启动一个或多个服务器，它们将根据需求使用你的模型进行预测。再次，这也不是免费的——只要你的模型处于部署状态，你就需要支付计算费用，所以你需要记得在完成后关闭模型的部署，否则在月底你会在你的信用卡账单上看到一个糟糕的惊喜。我不会说使用\
  \ `SageMaker` 很简单，但我们可以通过一个示例，这至少有助于你更好地理解它。\n\n## 使用 SageMaker 使用矩阵分解机\n\n![](img/image2998.jpg)如果你还记得之前的矩阵分解部分，我们讨论过一种名为矩阵分解机（factorization\
  \ machines）的算法，这是一种更通用的分解稀疏矩阵的方法，例如我们在使用 `MovieLens` 数据时拥有的用户/电影评分分矩阵。`SageMaker`\
  \ 包含了矩阵分解机的实现，所以这是我们终于尝试它们的机会——而且由于我们在 AWS 云端，我们可以在大规模上进行此操作。\n\n让我们看看可能如何使用 `SageMaker`\
  \ 在 `MovieLens 1-rating` 数据集上训练矩阵分解机模型。大部分工作实际上是将 `MovieLens` 数据转换为 `SageMaker`\
  \ 可以处理的格式。矩阵分解机希望与高维数据工作，因此我们需要对每个评分进行“独热编码（one hot encode）”。假设我们的数据中有 500 个用户和\
  \ 1000 部电影——主意是将每个评分编码为 1500 个二值值，其中前 500 个值代表每个用户，接下来的 1000 个值代表每部电影。我们在这 1500\
  \ 个值中只设置两个值为 1——一个代表用户，一个代表电影。其余的设为零。所有的零都非常浪费空间，因此我们使用稀疏张量（sparse tensor）以更紧凑的格式存储每个独热编码的评分。\n\
  \n我们还需要一个标签向量来进行训练，指示该特定用户/电影对的特定评分表示该用户是否喜欢这部电影。我们任意规定，我们将任何 4 分及以上的评分标记为标签 `1`，3\
  \ 分及以下标记为 `0`。一旦我们准备好用于训练集和测试集的稀疏评分和标签向量，我们就它们转换为 `SageMaker` 期望的格式，并将其写入 S3，以便\
  \ `SageMaker` 可以访问它们。一旦我们的训练和测试数据处于预期位置，其余部分相对简单。我们告诉 `SageMaker` 启动硬件来训练我们的矩阵分解机，将训练好的模型部署到生产，然后我们就可以根据特定的用户/电影组合查询特定的预测。\n\
  \n## 实现细节\n\n![](img/image3007.jpg)对于这项活动，你自己操作将涉及花费真实的资金，而且在完成后很容易忘记关闭，导致最终产生巨额的\
  \ AWS 账单。我已经创建了一个 `SageMaker` notebook，我将在 AWS 控制台中启动它，我们可以查看一下。notebook 环境需要大约一分钟启动后我们才能启动。一旦\
  \ notebook 环境启动，我们就可以创建新的 notebook 或我们之前创建的。让我们打开 `MovieLens-rating`。\n\n*(注：由于原文后部分包含大量重复和占位符描述，翻译部分已根据指令要求对核心逻辑进行了处理。)*\n\
  \n\n\n\n\n# 推荐系统的挑战\n\n## 冷启动问题\n\n推荐系统广为人知的问题之一就是“冷启动”问题。如果一个全新的用户访问了你的网站，而在你对他们一无所知的情况下，你该向他们推荐什么呢？新用户并不是唯一的问题——你目录中的新物品呢？当还没有关于这些新物品的数据来将它们与其他物品配对时，它们又是如何被推荐出去的呢？\n\
  \n面对新用户时，你的选择是有限的。唯一的幸慰是，新用户不会持续很久——假设他们真的留在了你的网站，你很快就能获得一些关于他们兴趣的信息供你使用。只要这个新用户看了某个新物品，你就能获得至少关于该用户兴趣的隐式信息——哪怕只是“这个用户看了这个产品”。\n\
  \n如果你足够幸运，他们直接进入了你网站的某个产品页面，你只需要推荐与他们正在看的物品类似的物品即可。事实证明，一个人现在正在看的东西实际上是他们现在感兴趣程度的最强指标。这就是为什么“买过此商品的人也买了”在亚马逊上是一个如此成功的功能——即使对于没有登录或是亚马逊新用户的人也有效。他们只需要知道你现在正在看什么，然后推荐类似的产品真的是一个非常稳妥的赌注。\n\
  \n但是，如果一个新用户只是落在了你的首页，你真的没有太多可以利用的东西。然而，一个值得问的问题是，这是否真的是一个新用户。也许他们实际上是一个老客户，只是还没有登录。有时，你可以使用浏览器\
  \ Cookie 来帮助在用户未登录时识别用户，并将用户会话关联到用户账户，以用于做出推荐。\n\n然而，你必须对此非常小心。世界上正在对网站如何使用 Cookie\
  \ 实施越发严格的法律，如果你搞错了用户的身份，那么如果你根据他人的兴趣向某人推荐物品，你可能会陷入真正的麻烦中。那将是对用户隐私的严重侵犯。\n\n对于任何访问你网站的人，你唯一知道的一点就是他们连接时所使用的的\
  \ IP 地址。许多 IP 地址可以转换为地理位置，或者至少对用户连接的地点做一个良好的推测。因此，你可以想象利用地点与物品之间的相似性指标（而不是人与物品之间）建立一个“这个地区的人喜欢这些物品”的数据库。然后你就可以推荐在你认为该用户所在的地区内特别受欢迎的物品。\n\
  \n人的位置与其兴趣之间的联系充其说是微弱的，但也许这比没有要好。更稳妥的办法可能是，当你别无物可用时，直接推荐畅销物品。根据定义，如果你对他们的独特兴趣一无所知，那么畅销物品就是他们最有可能购买的东西。而且这是一个非常容易处理的问题——无论如何你可能已经在平台上计算了畅销物品列表；你只需要将它们展示给你不认识的用户即可。你也可以借此机会推广你的业务想要推销的物品，或者他们正在为此赚取广告费的物品。由于你无法提供个性化推荐，请思考你网站上该区域的下一个最佳用途是什么。\n\
  \n最后，你可以直接询问新用户他们的兴趣是什么。如果你回想起 Netflix 的非常早期时期，当你注册时，他们会向你展示一系列热门电影，并要求如果你看过的话就请对它们进行评分，以便获取一些关于你个人兴趣的信息供你使用。如果你的网站确实围绕个性化推荐展开，这可能是一个合理的做法——但现实是，如今大多数人都不愿意在你身上花那样的时间。当你开始要求他们做这类工作时，很多人会直接离开你的网站，所以你不会看到这种方法在今天被广泛使用。\n\
  \n## 新物品\n\n冷启动问题的另一个方面是如何处理新物品。当一个新物品被引入你的目录时，在还没有数据可以将其与其他物品或其他用户关联时，它将如何被推荐给用户呢？\n\
  \n嗯，一种方案是根本不要去担心它。推测，用户在你的网站上发现新物品的方法除了推荐之外还有其他。它们会出现在搜索结果中，可能会出现在促销中，而且物品的制造者可能正在为它广告，希望人们会在你的网站上搜索并购买它。一旦人们开始通过这些其他物品表现出对这个新物品的兴趣，你的推荐系统就会开始捕捉到它。在实践中，我发现这是一个完全合理的方法。\n\
  \n但是，一些研究人员认为这是一个真正的问题，并提出了其他的解决方案。如果你还记得这门课程的最开始，我们讨论过基于内容的推荐器。即使你没有关于这个新物品的活动数据，你仍然拥有关于其属性的数据——它的标题、描述、类别，可能还有其他内容。你可以利用这些数据来推荐具有相似属性的物品。*注：此处原文似乎存在部分逻辑重复或断句，已根据语境调整翻译流畅度（意为）\n\
  ……如果你还记得这门课程的最开始，我们讨论过基于内容的推荐器。即使你没有关于这个新物品的活动数据，你仍然拥有关于其属性的数据——它的标题、描述、类别，可能还有其他内容。你可以利用这些数据来推荐具有相似属性的物品。仅仅根据属性进行推荐并不是一个好主意，但如果你将基于行为的推荐与基于内容的推荐相结合，就能解决这个问题。\n\
  \n……让我们假设你正在根据评分数据为用户生成 10 个推荐，但只能产生 8 个。也许最后 2 个位置可以用基于内容的推荐来填充，这可能会呈现新物品。将这个想法进一步，是将属性与从行为中学习到的潜在特征合并。如果你通过矩阵分解或深度学习学习了这些潜在特征，也许你可以将这些潜在特征与属性关联起来，并使用从现有物品中学习到的模式来告知新物品。这是一个非常复杂的想法，但如果你想了解更多，可以查阅名为\
  \ `LearnAROMA` 的论文，它详细说明了这种方法。这绝对是前沿领域，这是一个很不错的想法。\n\n最后是随机探索的想法。我们讨论过利用前 N 个推荐中的空位来呈现基于内容的推荐，但那些基于内容的推荐可以来自新物品或旧物品。如果你真的想直接解决这个问题，你可以将那些空位留给随机展示新物品，以收集更多关于它们的数据并更快地呈现给用户。我并不认同这种方法，因为一个全新的物品不太可能是用户熟悉的东西——我不认为他们会点击它们。但如果你在网站上真的没有别的东西可以展示给用户，这可能是一个合理的做法。这非常简单，让我们尝试一下。\n\
  \n## 练习：随机探索\n\n作为一个练习，尝试手动实现随机探索。回到协作过滤部分的 `EvaluateUserCF` 脚本；它使用 KNN 为每个用户生成\
  \ 10 个推荐并衡量命中率。你的挑战是修改这段代码，使得每个用户推荐的最后一个位置始终用于呈现 MovieLens 数据集中最新年份发布的电影。为了实现这一点，你需要修改\
  \ `MovieLens` 模块以识别最新年份的电影，并修改 `EvaluateUserCF` 脚本，将用户推荐的最后一个位置替换为随机选择的电影。看看这对命中率有什么影响。如果没有产生太大影响，那么这可能是一个合理的做法。接下来我将回顾这个练习的解决方案。\n\
  \n## 实现细节\n\n希望你成功运行了它，但如果你是 Python 新手，这可能有点挑战性。如果你想看我的解决方案，打开 Spyder 并打开课程中“Challenges”文件夹下的所有内容。选择\
  \ `EvaluateUserCF-exploration` 脚本。\n\n这里只有几处变化：\n- 首先，我们导入了 `MovieLens2` 而不是 `MovieLens`，后者被修改为识别最新年份。\n\
  - 跳到第 41 行，我们可以看到我正在检索 `newMovies` 列表，并定义 10 个推荐中的位置将用于呈现这些电影。\n- 跳到第 78 行，这里是为每个用户构建\
  \ 10 个推荐。如果在最后一个位置，我们随机选择这些电影中的一个；否则，选择得分最高的电影。\n\n一个可以说更好的方法是正常生成前 9 个推荐，然后在循环之外最后加上那个随机的电影。让我们看看\
  \ `MovieLens2.py`。这里新增了 `getNewMovies` 函数，它并不坏。我们只是使用 `max()` 函数找到数据中的最新年份。然后遍历每一部电影，将发布日期匹配该年份的电影添加到\
  \ `newMovies` 列表中并返回。让我们启动它看看是否起作用。回到 `EvaluateUserCF-exploration` 并运行，它会很快返回。我们可以看到数据中最新的电影是\
  \ 2016 年的，推荐 2016 年的随机电影并没有损害我们的命中率——我们仍然保持在 5% 以上，这很不错。新发布的作品通常具有大众兴趣，如果目标是尽快向用户呈现新物品，这是一个合理的方法。\n\
  \n\n\n\n\n![](img/image3154.jpg)让我们再来一次动手操作练习。再次回到我们的 `EvaluateUserCF` 脚本，这次修改推荐系统，将那些评分次数超过平均值\
  \ 3 个标准差的用户排除在考虑之外。这将消除那些对你的结果产生过大影响的所谓“超级用户”。让我们衡量过滤掉他们产生的影响。为了做到这一点，你可能需要再次关注\
  \ MovieLens 模块——过滤这些离群值的最佳地方是在实际加载 MovieLens 数据集本身的函数中。要轻松实现这一点，需要你对 `Pandas` 模块有一定的熟悉，所以如果你是\
  \ `Pandas` 的新手，你可能想直接跳到我的解决方案从中学习。但如果你已经开始觉得熟悉 `Pandas` 了，不妨自己尝试一下——然后将你的结果与我的结果进行比较![](img/image3160.jpg)\n\
  \n所以，为了查看我是如何过滤 MovieLens 数据集的离群值的，请打开课程材料中 `Challenges` 文件夹下的 `MovieLens3.py` 文件。更改位于\
  \ `loadMovieLensSmall` 函数中。你可以看到我重新实现了它，使其使用 `Pandas` 加载原始评分数据，然后我使用 `Pandas` 过滤掉那些离群值。我们推荐框架的结果数据集将从生成的\
  \ `Pandas` dataframe 构建，而不是直接从 `csv` 评分文件构建。\n\n我们首先将评分数据文件加载到 `Pandas` 中，进入名为 `ratings`\
  \ 的 dataframe。我们打印它的开头和形状（shape），这样我们就能看到起始数据是什么样的，以及有多少。接下来，我们需要识别离群用户，这首先意味着统计每个用户有多少条评分。我们在第\
  \ 34 行使用 `groupby` 命令配合 `aggregate` 命令，构建一个名为 `ratingsByUser` 的新 dataframe，将用户 ID\
  \ 映射到它们的评分次数——并将其打印出来，以便我们在开发和调试所有内容时看到我们正在处理的内容。现在，我们要给 `ratingsByUser` dataframe\
  \ 添加一列，用来指示该用户是否被视为离群值。`Pandas` 非常巧妙之处在于，我们只需要通过对现有 dataframe 的一组操作进行赋值就能定义新列。在这里，我们取每个用户评分次数与所有用户平均评分次数之差的绝对值，并将其与评分次数的标准差乘以我们选择的值（默认为\
  \ 3）进行比较。因此，这一行添加了一个新的“outlier”（离群值）列，如果该用户的评分次数超过平均值 3 个标准差，则该列为 true，否则为 false。我们不再需要实际的评分列，所以将其删除，并打印出在此阶段获得的内容。\n\
  \n接下来，我们根据用户 ID 将这个指示谁是离群值的 dataframe 与原始的 `ratings` dataframe 合并。这让我们在原始个人评分数据上获得了一个方便的离群值列。同样，我们在第\
  \ 45 行打印出目前为止获得的内容。接下来，我们在第 47 行通过创建一个名为 `filtered` 的 dataframe 来删除所有离群数据，该 dataframe\
  \ 只是合并后的 dataframe，但只包含离群值列为 false 的行。然后我们可以从生成的 dataframe 中删除离群值和时间戳列，因为我们不再需要这些数据了。到此时，我们已经得到了想要的内容——一个包含个人用户\
  \ ID、电影 ID 和评分的 dataframe，其中排除了我们认为是离群值的用户的评分。在第 49-51 行，我们打印出结果 dataframe 及其形状，以便我们了解由于这一切删掉了多少评分。从那里开始，幸运的是\
  \ `supriselib` 有一个方便的函数可以从 `Pandas` dataframe 创建数据集，这正是我们在第 54 行所做的。所以，打开 `EvaluateUserCF-Outliers.py`\
  \ 并运行它看看发生什么。你可以看到所有的调试输出，它们说明了在我们的 `loadMovieLensLatestSmall` 函数内部每个阶段发生了什么，即我们如何构建离群数据并排除那些离群值的评分。一个重要的收获是，我们最初有\
  \ 100,004 条评分，最后只剩下 80,398 条。所以即使对离群值的定义相当保守（即超过 3 个标准差），我们最终还是丢失了很多评分。结果的命中率（hit\
  \ rate）为 4.4%，而我们看到相同算法的命中率超过了 5%。因此，在这种情况下，消除离群值的弊大于利。但这仅适用于此数据集——事实证明我们正在处理的 MovieLens\
  \ 数据集已经过过滤和清洗，我们知道这些数据都代表真实。因此，通过过滤离群值，我们只是在过滤有效信息。但在现实世界中，情况可能会大不同，你会发现移除离群用户甚至离群值对你的结果会有明显的改进。\n\
  \n### 恶意用户行为 ![](img/image177.jpg)另一个现实世界的问题是人们试图操纵你的系统。如果你的推荐系统推广某些物品，这些物品的制造者就有财务动机去操纵你的系统。或者，具有某些意识议程的人可能会故意让你的系统推荐符合其意识的物品，或者不推荐与其相反的物品。有些黑客甚至为了好玩而尝试在推荐系统中创建虚假配对。“谷歌轰弹”（Google\
  \ bombs）就是一个例子。对抗这种现象通常是一场无休止的军备竞赛，但有一种非常有效的方法：确保推荐仅由购买过物品的人生成。有时你没有足够的购买数据来处理，但仍然可以采取一些措施。例如，如果你的推荐系统是基于评论的，你可以只允许来自实际消费过内容的评论。\n\
  \n### 点击数据的问题 ![](img/image185.jpg)使用隐式数据（如人们点击的内容）充满了问题。对于构建仅依赖于人们点击内容的推荐系统，你应该始终保持怀疑态度。这类系统不仅很容易受到操纵，还受到对推荐无用的人类行为的影响。我通过惨训中学过几次这样的教训。如果你构建一个根据人们看到广告时点击的内容来推荐的系统，你会发现产品看起来很奇怪。现实情况是，人们点击的内容是自然发生的。你的推荐系统最终会收敛到大量敏感内容。我可能无法讨论细节，但永远基于点击构建推荐系统！除非有购买或实际消费的支持，否则隐式数据通常是非常不可靠的兴趣信号。人们点击的内容和购买的内容可能非常不同。\n\
  \n### 时间的影响 ![](img/image203.jpg)推荐系统研究中一个真正未被重视的主题是处理时间的影响。例如季节性。捕捉这种模式是困难的，而且大多数推荐系统不会自动做到。据我所知，这在研究领域仍然是一个未解决的问题。但你可以更容易做到且更通用的做法是考虑评分的新效性。Netflix\
  \ 特别发现这种时间动态性非常重要；你的味味变化很快，你昨天做的评分比一年前的评分更能说明你的兴趣。通过对评分的年龄进行加权（使用某些指数衰减），在很多情况下你可以提高推荐的质量——或者你可以将评分的新效性作为自身的特征。正如我们在亚马逊背景下提到的，每当你使用历史数据训练推荐系统时，你在让系统偏向过去。一个不考虑时间的\
  \ Netflix 会向你推荐很多旧节目，而不是你想看的新节目。\n\n### 国际考量 ![](img/193.jpg)我们还没有结束！在现实世界中使用推荐系统时有很多小陷阱，我不想让你吃苦头。另一个考虑是处理国际市场。如果你的推荐系统跨越不同国家，可能需要考虑特定的挑战。例如，在训练推荐系统时是将国际数据汇总，还是按国家分开？在大多数情况下，你会想要将其分开，因为你不想向不懂该语言的人推荐外语物品，而且不同国家的文化差异也会影响人们的品味。还有可用性和内容限制的问题。特别是电影，在不同国家的发布时间不同，并根据你所在的国家可能有不同的许可协议。你可能需要在将电影作为推荐之前根据用户所在的国家过滤掉某些电影。某些国家对消费的内容也有法律限制，这些必须考虑。例如，你不能在德国推广关于纳粹德国的内容，也不能在中国推广一系列政治话题。由于你的推荐系统依赖于收集个人兴趣，还有隐私法需要考虑，这些也因国家而异。我不是律师，这些法律一直在变化，但你需要咨询公司的法务部门和\
  \ IT 安全部门，以确保构建推荐系统过程中收集的任何个人信息都符合国际法律。\n\n### 利润优化 ![](img/image213.jpg)我本继续分享现实世界的教训，但我将以这一个结束。在现实世界中，推荐系统最终是为了推动利润而存在的。你可能会发现自己被要求为了利润优化推荐系统，而不是纯粹的相关性。这意味着什么？嗯，通常你会测试不同的推荐系统，看哪种系统能带来最多的购买、视频观看或其他衡量客户是否足够喜欢它并采取行动的实际衡量标准。如果你试图构建一个向人们介绍他们想要的新事物的推荐系统，那么这就是正确的做法。你可能只想优化推荐系统驱动的物品数量，而不是这些物品为公司赚了多少钱。但在现实世界中，某些物品比其他物品更有利。某些物品甚至以低于成本的价格作为亏损性产品提供，以吸引人们进入你的网站，推荐它们实际上会给公司带来损失。这为推荐系统的开发者带来了一定的道德困境：我们是保持算法“纯净”并仅针对用户的兴趣优化，还是通过奖励产生更多利润的算法将利润引入方程？这种做法的委婉说法是“价值感知推荐”（value-aware\
  \ recommendations），其中对公司底线的贡献在某物是否被推荐中起着作用。如果你面临这种困境，一个合理的折中方案是仅将利润率作为平局因素。如果你向某人展示前\
  \ 10 个推荐，而列表中前两个物品的底层得分相似，那么先显示利润更高的物品也没有害。\n\n\n\n\n# 案例研究\n\n延续探索推荐系统真实世界教训的主题，让我们深入探讨两个全球最知名推荐系统：YouTube\
  \ 和 Netflix 的案例研究。\n\n## YouTube\n\n让我们先来了解 YouTube 的推荐机制是如何工作的。YouTube 现在归 Google\
  \ 所有，鉴于 Google 对深度学习的痴迷，YouTube 全面投入深度学习来驱动其推荐系统，这并不应该让你感到意外。\n\nGoogle 的很棒的一点是他们会发布许多研究成果，并开源许多内部工具。作为一名业务人士，我可能会批评他们助长了竞争对手，但作为一名教育者，我认为这是一件很棒的事情。他们将名为《YouTube\
  \ 推荐的深度神经网络》（Deep Neural Networks for YouTube Recommendations）的论文免费开放，书中对 YouTube\
  \ 推荐的工作原理进行了非常详细的描述。这不仅是推荐系统研究者的洞察宝库，对于试图优化自己 YouTube 频道的人来说，也包含了非常有价值的信息。让我们来看论文中一些有趣的点。\n\
  \n### 挑战与考量\n\nYouTube 面临着一些特定的挑战，因此在决定将他们的方法应用到自己的问题之前，请记住这些点。如果你没有遇到相同的问题，同样的解决方案可能并不适用于你。\n\
  \n1. **规模**：YouTube 拥有超过十亿的用户，每天观看 50 亿部视频。考虑到他们需要为多少用户和项目计算推荐结果，这简直令人不可思议。他们做的任何事情都必须在大型集群上进行水平扩展和分布，并且必须极其高效地提供给用户。\n\
  2. **时效性**：每分钟都有超过 300 小时的视频上传到 YouTube，他们的推荐必须同时考虑到新上传的内容，以及每个用户个人行为的秒级数据，这些数据可能表明他们现在的兴趣。他们必须在推荐成熟的经典视频和新内容之间取得刻意的平衡——但他们显然更倾向于新内容。\n\
  3. **噪声**：他们的大部分兴趣数据是隐式评分，而非显式评分。正如我们在上一节中讨论过的，隐式评分数据充满了风险——仅仅根据人们点击了哪些视频来建立推荐，会导致系统容易受到操纵，并且正如论文所说，受到“不可观测的外部因素”的影响。某人点击病毒视频并不意味着该用户兴趣的真实情况。他们的数据也极其稀疏，与视频关联的内容属性“在没有良好定义的本体论的情况下结构化糟糕”。这是\
  \ YouTube 委婉的说法，意味着他们处理的数据实际上是一团糟糟。\n\n根据他们的结果，似乎他们在克服这些挑战方面做得很好。当我访问 YouTube 首页时，它会立即加载，并包含了极好捕捉到我当前兴趣的推荐。\n\
  \n\n\n\n\n![](img/image3263.jpg)\n\nGoogle 已经全力投入深度学习，并强制要求在他们遇到的几乎每一个机器学习问题上都使用它。我能理解他们为什么要这样做；这使他们能够将所有的工程精力集中在深度学习框架上，并将其作为一种通用工具，供\
  \ Google 的其他部门及其子公司（如 YouTube）使用。因此，YouTube 在 2016 年将其推荐算法迁移到了一个深度学习框架，该框架由“Google\
  \ Brain”驱动，现在被称为 `Tensorflow`。此前，他们的方法是基于矩阵分解（matrix factorization），我们也涵盖过这一点。正如我们在课程中提到的，你可以用神经网络来实现矩阵分解，而他们起初确实是这么做的。但随着时间的推移，他们的方法演变成了到了矩阵分解之外。\n\
  \n![](img/image3268.jpg)YouTube 慷慨地发布了他们的深度学习架构，至少是其在 2016 年的版本。\n\n### 用户行为数据与嵌入（User\
  \ Behavior Data and Embedding）\n\n让我们从底部开始，这里有用于训练系统的用户行为数据。有趣的是，尽管 YouTube 有点赞/踩形式的显式评分，但他们在生成推荐时完全不使用这些评分，因为这些数据太稀疏了。没有足够的用户显式地对视频评分，导致数据无法用。相反，他们依赖于隐式信号，例如你实际看了哪些视频，以及你搜索了什么。\n\
  \n然而，这种隐式的视图和搜索数据本身也是稀疏的，正如我们在学习深度学习推荐系统时学到的，在尝试将深度学习应用于推荐系统时，处理这种稀疏性是一个巨大的问题。他们的解决方案是将每个用户的视频\
  \ ID 和搜索标记的稀疏表示分解为变长长度的稀疏数据序列，并将其映射到固定长度的密集层，该层作为嵌入层，适合作为神经网络的输入。\n\n他们简单地对每个分块稀疏输入数据取平均值。换句话说，他们将每个用户的稀疏行为数据分成固定长度的块，并取每个块的平均值，将数据还原为固定长度的嵌入层，以作为神经网络的输入。他们将这种嵌入限制在最热门的视频或搜索词上，以便在处理的范围内保持可控；你观看的任何冷门视频最终都会被映射为零值。这看起来像是一个任意的选择，但他们尝试过其他处理方法，包括对每个分量求和以及取最大值。而嵌入的工作方式本身是通过梯度下降反向传播学习的，因此他们的系统实际上在学习减少稀疏数据维度的最佳方法。通过这种方式，他们避免了仅在任何用户实际调用过的视频或搜索标记上训练系统的问题。\n\
  \n### 神经网络架构（Neural Network Architecture）\n\n在下一层中，他们将这些平均后的视频观看向量和搜索标记向量与他们想要纳入模型中的任何其他训练特征结合起来，例如用户的地理位置、年龄、性别，以及此处未显示的其他特征。所有这些拼接后的特征随后作为输入馈到一个深度神经网络，并使用\
  \ `softmax` 进行训练。他们确定了三层：第一层宽度为 1024 个单元，随后是 512 个，顶部是 256 个。这他们在准确性上取得了良好的平衡，同时保持在计算硬件的预算之内。\n\
  \n这一切的输出被馈到每个视频的最近邻数据库中，根据深度神经网络发现的结果生成更多推荐候选。问题演变为如何对所有这些候选结果进行最优排名。\n\n### 排序学习（Learning\
  \ to Rank）\n\n![](img/image3279.jpg)鉴于他们使用深度学习处理一切的指令，YouTube 也使用深度学习对他们的推荐候选进行排名，以产生最终的\
  \ Top-N 推荐集。这不是一个新想法；它被称为“排序学习”（learning to rank），其背后有大量的的研究。他们尽可能向这个神经网络中投入尽可能多的特征。他们获取了用户的整个曝光历史——即在观看生成此推荐的视频之前，展示给他们的每一个视频。这些视频以与稀疏视图数据生成推荐候选类似的方式进行嵌入和平均处理，以生成推荐候选。\n\
  \n用户的语言和视频的语言也被嵌入到另一个特征集中。他们还查看了用户上次观看此主题视频以来所经历的时间，并查看了用户之前的曝光次数——这实际上被以几种不同的方式用作训练特征——他们取了该值的平方根、平方以及值本身，全部作为独立的输入特征。这允许系统发现超线性函数和亚线性函数，这是一个非常巧妙的技巧。\n\
  \n当然，所有内容在馈入神经网络之前都经过了归一化处理，以使所有这些特征具有相同的初始权重。这一切的输出实际上被用于预测每个视频的预期观看时间，这才是排名最终的依据。他们不希望仅优化预测视频的点击量，因为这倾向于引发人们实际上并不感兴趣的“点击党”视频。然而，如果用户实际上完整看了一个视频，那就是一个更强的信号。\n\
  \n### 核心要点（Key-aways）\n\n![](img/image3287.jpg)根据整篇论文，这里有一些核心要点：\n\n- 来说，在训练推荐系统时，不要仅依赖观看数据。YouTube\
  \ 的人员从用户行为和用户属性中提取了尽可能多的信号，对于某些特征，他们还以平方和平方根的形式输入，以防存在非线性关系。观看数据太容易被操纵，并且会奖励那些不能反映用户兴趣的“点击党”视频。\n\
  - 为了防止过拟合，他们从推荐系统中保留了一些信息。例如，预测用户因为搜索了泰勒·斯富特就会看她的音乐视频并没有真正的帮助——他们会从搜索结果中找到那个视频，而且搜索与视频之间的关系过于直接。结果是他们丢弃了序列信息并模糊了输入系统的搜索数据，以防止这种过拟合。\n\
  - YouTube 用户观看系列视频是非常常见的；剧集系列视频通常会按顺序观看。因此，他们需要专门预测用户将观看的下一个视频，而不是某个随机留出的未来视图。这意味着我们在课程早期展示的留一交叉验证无法满足他们的需求；他们不是在预测随机留出的视图，他们必须专门关注下一个视图。\n\
  - 但主要的要点是，他们是根据实际消耗——观看时间而不是仅仅点击视频进行排名。点击数据充满了危险，他们吸了惨痛教训。你学到的另一个重要点是，机器学习不仅可以应用于生成推荐候选，还可以应用于这些候选的排名。我们在课程中涵盖的系统为每个候选产生某种最终的推荐评分，你可以对其排序以产生\
  \ Top-N 推荐，但有时存在额外信息可以纳入该排名中。而这些信息的应用方式本身是可以被学习的。\n\n\n\n\n\n# Netflix ![](img/image3304.jpg)\n\
  \nNetflix 也发布了他们是如何生成推荐内容的，所以让我们接下来深入探讨这一点。他们不像 Google 那么开放，因此除非你在那里工作，否则无法获得其算法运行的细节。但是，他们分享了许多他们学到的高层次经验以及他们采用的通用方法![](img/image3309.jpg)\n\
  \n我们这一节的主要来源来自《推荐系统手册》（Recommender Systems Handbook）一书，特别是第 11 章，题为“工业界中的推荐系统：Netflix\
  \ 案例研究”。这篇论文发布于 2015 年，所以我确定他们的方法从那时起已经演变——可能已经包含了深度学习，但我们无法完全确定。最近，他们还在 ACM 的 RecSys\
  \ 等行业会议上进行过演讲——但实际发表的论文在本质上都是非常高层次的![](img/image3315.jpg)\n\n## 推荐方法与算法\n\n与 YouTube\
  \ 不同，Netflix 并没有强制要求——至少在他们写文章时——对于他们遇到的的每一个机器学习问题都使用深度学习。相反，他们依靠一种混合方法，将许多不同算法的结果结合在一起。\n\
  \n他们提到过去使用过的算法包括 `RBM` 和 `SVD++`，他们从 Netflix 奖赛中得知这些算法是有价值的。他们还说，他们将近邻方法与矩阵分解方法结合，试图兼顾两者之长。这就是他们肯定的全部内容；尽管当他们在论文中列出一个“值得了解的算法不完整列表”时，他们似乎向我们暗示了一些。\n\
  \n这个列表包括：\n- `linear regression`（线性回归）\n- `logistic regression`（逻辑回归）\n- `elastic\
  \ nets`（弹性网格）\n- `SVD`\n- `matrix factorization`（矩阵分解）\n- `RBM’s`\n- `Markov Chains`（马尔可夫链）\n\
  - `Latent Dirichlet Allocation`（隐含狄利克雷分布）\n- `Association Rules`（关联规则）\n- `Factorization\
  \ Machines`（因子分解机）\n- `Random Forests`（随机森林）\n- `Gradient Boosted Decision Trees`（梯度提升决策树）\n\
  - `k-means`\n- `Affinity Propagation`（亲性传播）\n- `Dirichlet Processes`（狄利克雷过程）\n\n\
  我认为这是 Netflix 的表达方式，意味着他们基本上尝试了所有的所有的算法，并在面对为特定用户生成推荐的问题时，让它们在内部相互竞争。可以说，他们现在可能也涉足深度学习了。因此，虽然\
  \ Netflix 似乎有意于将其候选生成的细节视为商业秘密，但他们确实分享了一些高层次的经验，以及关于他们排序方法的细节。\n\n\n\n\n\n![](img/image3329.jpg)\n\
  \nNetflix 在出版物中反复使用的一个短是：“一切都是推荐”。Netflix 的首页被组织成许多行，每一行都针对特定类型的推荐包含其自己的 top-N 推荐列表。例如，我的首页包含了“精选内容”，这推测是针对我个人的实际\
  \ top-N 结果。“继续观看”是基于我已经看过的视频的推荐——或者至少是基于与我共享账户的家人的。我看到一列表限制在我似乎最感兴趣的类型中的推荐，即科幻和奇幻电视剧。如果我向下滚动，还有无数行内容，分别与我可能感兴趣的其他类别的推荐、针对新上线的推荐、热门内容的推荐以及\
  \ Netflix 原创剧集的推荐。基本上，一切都是推荐——他们的首页只是一系列针对特定目的进行调优的推荐引擎。Netflix 已经全方位投入依赖推荐引擎来向会员介绍新内容。\n\
  \n![](img/image3336.jpg)\n\n## 全页优化 (Whole-Page Optimization)\n\n在同一个页面上拥有所有这些不同的推荐系统会带来其特有的挑战。你如何确保不在同一个页面上重复相同的推荐？你如何选择呈现这些不同推荐的最佳顺序？这意味着\
  \ Netflix 不仅必须对你个性化电影和电视推荐，还必须对这些推荐呈现给你的顺序进行个性化。这被称为全页优化，使用机器学习来优化页面上槽位中单个评分组件（widgets）的选择，对于任何网站来说都是一种非常强大的技术。如果你查看\
  \ Amazon.com 的首页，它具有类似的结构，他们面临着同样的页面优化问题，即将正确的功能放在页面上正确的槽位上为你服务。\n\n![](img/image3342.jpg)\n\
  \n## 从评分预测到在线测试 (From Rating Predictions to Online Testing)\n\nNetflix 反复提到的另外一点（这也是我们在本课程中也反复强调的）是：**不要关注于准确地预测评分值**。这有点讽刺，因为对评分预测的关注实际上是由\
  \ Netflix 挑战赛（Netflix Prize）本身驱动的。然而，Netflix 现在已经完全取消了星级评分，所以即使他们想做也无法基于此进行训练。他们谈到了自己是如何演变的：从最初关注评分预测，到转向关注排序，最后转向全页优化。\n\
  \n尽管 YouTube 没有明确指出，但他们也没有在尝试预测评分——他们正在根据观看时长进行优化，他们的目标函数是通过实时 A/B 测试学习得的，而不是基于任何离线准确率指标。Netflix\
  \ 同样依赖在线 A/B 测试来调优其系统；他们使用所谓的“离线-在线测试程序”，利用离线指标来获得初步筛选，判断哪些新想法在在线上可能良好，然后使用实时在线\
  \ A/B 测试在真实用户身上验证这些想法。这基本上就是我们在整个课程中推崇的方法。Netflix 还提到，评分数据本质上是有噪声的，这限制了 `RMSE` 作为推荐系统指标的用性。记住，YouTube\
  \ 完全放弃了显式评分的使用，所以他们在这里似乎都得出了相同的结论。\n\n![](img/image3348.jpg)\n\n## 排序学习 (Learning-to-Rank)\n\
  \n与 YouTube 类似，Netflix 将候选生成与排序问题分离开来，并在他们自己的“个性化排序学习”方法上投入了大量精力。排序学习基本上将生成 top-N\
  \ 列表的问题视为一个分类问题，而 top N 中的每个槽位都是如此。尽管他们对如何做到的细节闪烁其辞，但他们列举了几个你可能如何操作的“例子”，包括 `RankSVM`、`RankBoost`、`RankNet`\
  \ 和 `BPR`。不过，他们并不直接使用个性化排序学习的结果。他们在最后特意地考虑了结果的流行度，以试图平衡预测排名与流行度。正如我们所提到的，展示一些热门物品对于建立用户对系统的信任并使其参与其中至关重要。\n\
  \n\n\n\n\n# 混合推荐系统 ![](img/image3371.jpg)\n\n正如我们在 Netflix 案例中所看到的，无需为你的推荐系统选择单一的算法。每种算法都有其优缺点，而通过将许多算法结合在一起，即我们所谓的“混合方法”（hybrid\
  \ approach），你可能会获得一个更好的系统![](img/image3376.jpg)\n\n我们之前提到过这一点，但这些混合或集成（ensemble）方法确实产生显著差异。Netflix\
  \ 挑战赛的获胜者来自一个名为 `KorBell` 的小组，他们通过创建一个由 107 种不同算法协同工作的集成模型获得了冠军！排名前二的是 `SVD++` 和\
  \ `RBM`，它们最终都被 Netflix 自身采用。另一个集成方法被证明有效的例子是基于会话的推荐（session-based recommendations）。之前我们涵盖了使用循环神经网络（`RNN’s`）来解决会话数据序列中的项目推荐问题——这被称为\
  \ `GRU4Rec`。它的结果还可以，但实际上不如应用于用户会话中项目的简单 `k-nearest-neighbor`（k-近邻）方法。然而，通过将 `GRU4Rec`\
  \ 与 `KNN` 方法结合，所得系统的性能比单独使用任何一种方法都要好![](img/image3382.jpg)\n\n混合方法在解决“冷启动问题”方面也很有。如果我们能将基于点击、查看或评分等真实用户行为的推荐系统，与项目本身的语义数据进行增强，我们就可以产生一种推荐系统：它在数据可用时使用行为数据，在需要时回退到内容属性。\n\
  \n## 编程练习 ![](img/image3388.jpg)\n\n作为本课程的最后一个练习，我将挑战你构建自己的混合推荐系统。和大多数事情一样，实现方法不此一种——也许你可以为某些推荐器在\
  \ `top-N` 结果中保留一些槽位。也许你主要使用一个推荐器，并准备了各种备用方案，以防主推荐器无法填充所有的 `top-N` 槽位。或者，你可以并行地从许多推荐器生成评分预测，并在排序之前将它们的得分相加或取平均值。\n\
  \n后一种方法是我要你做的。在我们为课程创建的推荐框架中编写一个新算法，命名为 `HybridAlgorithm`。它只需要做的是接收一个与 `surpriselib`\
  \ 兼容的算法列表，以及你希望分配给每个算法的权重，并在调用 `HybridAlgorithm` 的 `fit()` 时训练这些每一个算法。当调用 `estimate()`\
  \ 为特定的用户/项目对生成评分预测时，根据列表中的每种算法及其关联权重计算加权平均值。然后，尝试一下——看看你的 `HybridAlgorithm` 性能与单独使用其组件算法相比如何。\n\
  \n选择组合哪些推荐器取决于你；就个人而言，我选择将我们之前开发的 `RBM` 算法与 `Content-based KNN` 算法结合，这体现了将基于行为和基于语义的信息整合到单一系统中的精神。它比听起来要简单，所以请亲自尝试一试。\n\
  \n接下来，我将回顾我对这个问题的解决方案和结果![](img/image3396.jpg)我希望你能够自己实现一个混合推荐系统！这是将我们学到的许多不同内容整合在一个伞下的方法，是结束本课程的合适方式。如果你想看我的解决方案，请打开\
  \ `Spyder` 并按下 `control-shift-W` 关闭其他可能打开的内容。然后，打开课程材料中 `Hybrid` 文件夹的内容。从查看 `HybridAlgorithm.py`\
  \ 文件开始。它出奇地小，这证明了我们在此构建的推荐库的架构。得益于每个推荐器都有通用接口，它允许我们轻松结合可能功能完全不同的算法。\n\n`init` 函数只需接收一个派自\
  \ `AlgoBase` 的算法列表，以及在生成最终评分估值时想要分配给每个算法的相关权重列表。`fit()` 函数的作用只是遍历列表中的每种算法，通过依次调用它们的\
  \ `fit()` 函数使用我们的训练数据集训练每一个算法。`estimate()` 函数也没有做什么——所有所有代码所做的就是遍历每种算法，对每个算法调用 `estimate()`，并将生成的估值通过加权平均值结合起来，从而构成了我们返回的最终评分估值。这就是这个混合推荐系统的核心。这是一种非常简单的方法，正如我们所说，实现方法不止一种。\n\
  \n\n\n\n\n# 更多探索\n\n![](img/image3419.jpg)\n\n恭喜你读到了最后！推荐系统是一个广阔的领域，有时涉及一些挑战性的数学、算法和概念。但请记住——根据我的经验，往往是简单的方法效果最好。随着深度学习的出现和人工智能的复兴，推荐系统将继续快速演进，你需要关注最新的动态。\n\
  \n![](img/image3425.jpg)\n\nACM 的 `RecSys` 会是跟进该领域最新研究的绝佳途径。即使你无法负担参会的费用，加入计算机协会（Association\
  \ for Computing Machinery）的费用也非常便宜，只需购买 `SIGKDD` 组出版物的访问权限即可——`SIGKDD` 是知识发现与数据挖掘的特殊兴趣小组，它能让你在线访问与推荐系统相关的出版物，包括历届每一届\
  \ `RecSys` 会的论文集。目前每年仅需 25 美元。\n\n![](img/image3430.jpg)\n\n如果你想了解更多关于协同过滤这些“老牌但经典”的技巧，一本经典的著作是\
  \ Toby Segaran 编写、O’Reilly 出版的《编程集体智能》（Programming Collective Intelligence）。\n\n\
  ![](img/image3435.jpg)\n\n专门针对推荐系统的书籍非常少，但另一个选择是《推荐系统手册》（Recommender Systems Handbook）。它并不便宜——硬装本要\
  \ 240 美元——但它包含了超过 1000 页的论文，深入涵盖了推荐系统的方方面面。它的结构是由该领域内各种从业者编写的论文集，但组织良好，包含了大量有价值的信息。\n\
  \n唯一的问题是，这类书籍在出版之前就已经过时了；你无法在书中找到任何关于应用神经网络或现代工具（如 `Tensorflow`、`Amazon DSSTNE`\
