  \        pass\n\n    def get_test_data(self, user_id):\n        pass\n\n    def\
  \ get_anti_test_set(self, user_id):\n        pass\n```\n\n\n\n\n\n# 基于内容的过滤\n\n\
  终于是时候开始讨论真正的推荐算法了！我们将从最简单的方法开始——仅根据物品本身的属性来推荐物品，而不是尝试使用聚合后的用户行为数据。例如，仅推荐与我们知道某人喜欢的电影相同类型的电影就可能是有效的。即使对于基于机器学习的更高级的推荐系统，在其中加入一些关于内容本身的知识也可以让它们表现得更好。\n\
  \n## 基于属性的推荐\n\n那么，让我们考虑一下仅根据电影本身的属性来推荐电影。MovieLens 数据集并没有提供我们太多可以操作的内容，但它告诉我们的一点是每部电影属于哪些电影类型。对于每部电影，我们都会得到一个类型列表，例如科幻、恐怖、浪漫、儿童片、西部片等可能适用于该部电影的类型。因此，如果我们知道某个用户喜欢科幻电影，那么向该用户推荐其他科幻电影是合理的。\n\
  \nMovieLens 还将发行年份编码在电影标题中，因此我们也可以使用这些信息。所以，我们不必仅仅向喜欢科幻电影的用户推荐所有科幻电影，而是进一步缩小范围到与该用户喜欢的电影发行年份相的科幻电影。你可以做得更高级一些，将\
  \ MovieLens 中的每部电影与 IMDb 等其他数据集关联，以获取每部电影的导演、演员信息或影评人评分。你可以利用各种关于电影的属性，对于你可能想要推荐的其他事物（如产品或音乐）也是如此。\n\
  \n所以，这就是基于内容的过滤的一个非常简单的例子——我们只需推荐与每个用户喜欢的电影类型和年份相似的电影。这看起来足够合理。但我们具体应该怎么做呢？让我们先考虑如何仅根据类型来衡量两部电影之间的相似性。这里是\
  \ MovieLens 原始数据的样式——对于每部电影，我们都会得到一个用管道分隔的适用于该电影的类型列表。总而言之，每部电影共有 18 种可能的类型。因此，我们可以想象某种相似性度量，查看任意两个电影共有多少共同类型。那么在数学上实现这种操作的好方法是什么？\n\
  \n## 余弦相似度\n\n在许多不同情况下都非常有效的方法是余弦相似度指标。它可能有点难以理解，但一旦你理解了，它非常简单。而且不仅适用于基于内容的过滤，也适用于各种其他推荐方法。\n\
  \n为了便于可视化，假设我们只有每部电影可能属于的两种类型：喜剧和冒险。我们可以将每部电影绘制在 2D 图表上，如果电影不属于某个类型，则赋值为 0，如果属于，则赋值为\
  \ 1。让我们先画出《玩具总动员》——它被认为既是喜剧也是冒险片。所以这给了我们坐标 `(1,1)`。让我们把它画出来。接下来看看《闹闹的老头》——根据 MovieLens\
  \ 的说法，它是一部喜剧但不是冒险片。所以这给了我们坐标 `(1, 0)`。\n\n在这里注意。我们可以通过从图表原点到每部电影画一条线，将这些位置视为向量。就像这样。现在看这些向量之间的角度——它告诉了我们这两部电影在类型上的相似程度。我们称该角度为\
  \ `theta`。在这种情况下，它是 45 度。但“45 度”并不是一个实用的相似性指标——理想情况下，我们想要一个介于 0 和 1 之间的度，0 表示“完全不相似”，1\
  \ 表示“完全相同”。\n\n嗯，事实证明角度的余弦值可以做到这一点。记住角度的余弦值是这样工作的：当 `theta` 接近 90 度时，它变为 0，当它接近\
  \ 0 度时，它变为 1。45 度的余弦值约为 0.7。所以我们可以说，《玩具总动员》和《闹闹的老头》之间的余弦相似性得分是 0.7，基于它们都是喜剧。\n\n\
  让我们再看几个例子。假设我们把《蒙提圣杯》加进来，它像《玩具总动员》一样既是冒险又是喜剧。它与《闹闹的老头》之间的角度是 45 度，所以它的相似性得分是 0.7。但它与《玩具总动员》的相似性是多少呢？嗯，《玩具总动员》和《蒙提圣杯》向量之间的角度\
  \ `theta` 是什么？在这种情况下，这两部电影的向量是完全相同的。所以如果角度是 0 度，它们之间没有任何共同之处。而 0 度的余弦值是 1.0——这正是我们预期的。因为由于这些电影在类型上是完全相同的，它们得到了\
  \ 1.0 的相似性得分。\n\n如果某部电影与另一个完全不同呢？加入《印第纳·琼斯》，它是冒险片但不是喜剧。所以它与《闹闹的老头》在类型上没有任何共同点。在这种情况下，《印第纳·琼斯》和《闹闹的老头》之间的角度是\
  \ 90 度——90 度的余弦值是零！所以我们得到《印第纳·琼斯》和《闹闹的老头》之间零的余弦相似性得分。使用余弦还有其他属性，因为它是平滑函数。也有其他衡量相似性的方法；例如，欧几里得距离查看的是项目之间的实际距离，而皮尔逊相关系数与余弦相似度相似，但它考虑了平均值。在电影类型的情况下，余弦相似度已经很好。\n\
  \n## 指标缩放\n\n那么我们如何将其扩展到 18 个类型呢？嗯，我们必须将每个类型视为图上的一个维度。你实际上无法在脑海中想象这一点，所以不要尝试了。但概念与我们在二维空间中完全一样。18\
  \ 个坐标，如果电影不属于给定类型，则为 0，如果是则为 1。例如，《玩具总动员》是冒险、动画、儿童、喜剧和奇幻，所以如果我们按照所示顺序分配类型，《玩具总动员》的坐标为\
  \ `0, 1, 1, 1, 0, 0, 1`，等等。这并不难对吧？我们可以很容易编写代码将这些类型列表转换为 18 维坐标。\n\n我们的下一个问题是在多维空间中计算向量之间的余弦值。事实证明，余弦另一个优点是这样做也很简单。这里是计算任意维度之间余弦相似度的复杂数学方程。让我们拆解一下。回到我们的用例，看看我们想要计算余弦相似度的两部电影。我们将把这两部电影称为\
  \ `X` 和 `Y`。所以 `X` 和 `Y` 的余弦相似性由右边的公式给出。不要被符号吓到，它非常简单。让我们从分子的顶部开始。它要求跨 `i` 维度对每个维度中\
  \ X 和 Y 的乘积求和。所以我们逐个遍历所有 18 个维度，只查看在该维度上有数据的电影。假设我们从动作维度开始，取动作维度上 `X` 和 `Y` 的乘积。加上冒险维度上\
  \ `X` 和 `Y` 的乘积。以此此类推。在底部，我们对电影 `X` 的每个维度的平方求和，对电影 `Y` 的每个维度的平方求和。对于每个，我们对得到的结果开根。因此，通过取\
  \ `X` 和 `Y` 之间乘积的和，除以每部独立电影类型乘积和的平方根，我们得到了余弦相似度得分。这很完美，因为这是易于编码且计算机非常擅长的这类算法。\n\n\
  事实上，这里是实际计算我们很快将使用的类型相似度的代码。此函数接收两个电影 ID 和一个将 ID 映射到类型空间中 18 维坐标的字典。它逐个遍历每个类型，提取电影\
  \ `X` 和 `Y` 的类型值，并对 `X squared`、`Y squared` 和 `X` 乘以 `Y` 进行累加。然后，余弦相似性就只是将它们所有整合在一起的问题。注意，我们在代码中稍微简化了方程以避免进行两次平方根运算，因为那样计算开销很大。\n\
  \n## 发行年份\n\n我们说想考虑的另一个是每部电影的发行年份。从 MovieLens 数据中提取这些有点复杂，但我们需要的信息就在电影标题中——发行年份在标题的末尾。所以我们只需要在代码中进行一些字符串处理来提取数据。\n\
  \n我们如何仅根据发行年份分配相似性得分？嗯，这就是推荐系统的艺术所在。你必须考虑你拥有的数据本质。两部电影的差异要有多大才意味着它们本质不同？嗯，一个十年似乎是一个合理的起点。我的意思是，例如，70\
  \ 年代的科幻电影与 80 年代的科幻电影看起来很不同。所以，我们从年份差异的绝对值开始——不管哪部先出。现在我们需要某种数学函数来平滑地将其缩放到 0 到 1\
  \ 的范围。我选择了一个指数衰减函数——它看起来像这样。看图表的右侧，因为我们取了差异的绝对值，它们都是正数。在年份差异为 0 时，我们得到 1 的相似性得分，这正是我们想要的。而且这个相似性得分会指数级衰减，在\
  \ 20 年时变得很小。这个函数的选择是任意的，但它似乎是一个合理的起点。\n\n\n\n\n\n![](img/image1015.jpg)编码活动 ![](img/image1020.jpg)\n\
  \n让我们将该转换为代码。这是我们预测函数的核心部分，它接收一个用户 `u` 和我们想要预测评分的物品 `I`。我们从一个名为 `neighbors` 的列表开始，遍历用户评分过的每一部电影，并根据每部电影与我们尝试预测的电影之间的基于内容的相似性评分填充该列表。我们已经在\
  \ `self.similarities` 数组中预计算了这些相似性评分。接下来，我们使用 `heapq.nlargest` 快速地将该列表排序为与目标电影相似性评分最高前\
  \ K 部电影。之后，只需要计算这前 K 部相似电影的加权平均值即可，权重为用户给它们打出的评分。假设我们那里有一些数据可以使用，我们将其返回作为对该用户和物品的评分预测值。\n\
  \n所以，让我们实际操作并运行这个程序，并仅使用基于内容的过滤来生成一些真实的推荐——我们将仅仅根据电影的类型（genre）和发布日期，推荐与每个用户喜欢的电影相似的电影。让我们看看实际效果如何。\n\
  \n### Setup\n\n如果你还没有打开 Spyder，请打开它。让我们打开课程材料中的“ContentBased”文件夹。它包含了我们在上一节中开发的相同框架的副本，因此无需再过一遍。相反，只需打开\
  \ `ContentRecs.py` 文件和 `ContentKNNAlgorithm.py` 文件。\n\n### Analyzing ContentRecs.py\
  \ and ContentKNNAlgorithm\n\n让我们先看 `ContentRecs.py`。它看起来和我们在测试推荐评估框架时编写的“RecsBakeoff”文件非常；唯一的区别是，我们不是让\
  \ `SVD` 算法与随机算法进行对比，而是让新的 `ContentKNNAlgorithm` 与随机推荐进行对比。编写该框架的工作已经初见成效。\n\n出于时间考虑，我们不会计算前-N\
  \ 推荐指标，只看准确率（accuracy）——但我们将对用户 85 的前-N 推荐进行采样，以便直观感受一下。\n\n那么 `ContentKNNAlgorithm`\
  \ 中有什么呢？打开它看看。架构上的主要点是，我们将 `ContentKNNAlgorithm` 创建为 `surpriselib’s AlgoBase` 类的派生类，就在这里的第\
  \ 15 行。如果你还记得，我们可以通过只需实现自己的 `estimate` 函数来实现自定义的推荐算法，这正是我们在这里做的。\n\n但在做出那些预测之前，我们必须做一些工作。你可以看到，我们通过传递在\
  \ k 近邻算法中想要使用的 `k` 值来初始化此类。默认值是 40；在实践中找到完美的 `K` 值是你必须通过实验来完成的。接下来，我们实现了一个 `fit`\
  \ 函数，它会在我们训练算法时由 `surpriselib` 调用。我们在这里做的是构建一个 2D 数组，用作任何两部电影之间基于内容的相似性评分的查找表。这运行需要一段时间，所以每当我们处理每\
  \ 100 部电影时就会打印一次进度。\n\n这里的代码非常直观，你可以看到我们将用户 ID 和物品 ID 转换为它们的内部 ID，因为这正是我们的 `predict`\
  \ 函数将要处理的内容，然后我们为每一对可能的组合计算基于类型和基于发布年份的相似性评分，并将它们相乘以生成组合的基于内容的相似性评分。这里有一个小技巧，利用了该相似性评分\
  \ 2D 数组的对称性——我们知道电影 A 和 B 之间的评分与电影 B 和 A 之间的评分是相同的，所以我们只计算一次并将其复制到数组的两种情况下。\n\n\
  我们的 `fit` 函数依赖于 `computeSimilarity` 和 `computeYearSimilarity`，我们已经在幻灯片中审查了这些代码。再次，类型相似性是基于电影之间的余弦相似性，代表了所有可能的类型的空间。`computeYearSimilarity`\
  \ 只是使用指数衰减函数来给同一时期发布的电影更高的权重。我们稍后会回到场景相似性函数；我们还没有使用它。\n\n### The Estimate Function\n\
  \n接下来我们进入推荐器的主要目的：`estimate()` 函数。这是我们之前看过的代码，再次，这是 k 近邻算法发生的地方。我们根据类型和发布年份，选择用户对我们尝试预测的电影评分过的\
  \ k 近邻电影。然后我们根据它们的相似性评分和用户评分计算加权平均值。\n\n### Results and Evaluation\n\n所以，让我们看看它是否有效！回到\
  \ `ContentRecs.py`，点击播放按钮运行它。再次，你可能需要去喝杯咖啡之类的——它需要几分钟才能完成。如果你在跟着操作，请暂停，完成后恢复。\n\n\
  所以，你可以看到我们确实优于随机推荐——`RMSE` 和 `MAE` 都比随机推荐低得多。向下滚动，我们可以对比基于内容的推荐和随机推荐对用户 85 的前 10\
  \ 个推荐。从定性上，很难判断对于这个人来说哪种更好，尽管我们知道这个用户不喜欢专门针对儿童的电影——所以“宝贝”（Babe）可能是随机推荐给出的一个待疑结果。\n\
  \n然而，值得注意的是，我们基于内容的推荐器的最高预测评分明显低于随机推荐器。这只是我们计算这些预测的方式产生的副作用；对于前-N 推荐器，重要的是预测评分的相对顺序，而不是预测评分本身——所以我们不应该为此过度担心。但如果你真的追求评分预测准确率，有方法可以归一化我们的预测评分以进入我们想要的范围——例如，你可以查询对数分布归一化（log-quantile\
  \ normalization）。再次，在现实世界中，没有人关心评分预测——他们关心你的前 N 结果。尽管如此，从纯粹定性和主观角度来看，这些对测试用户的推荐并不令人兴奋。我个人选择用户\
  \ 85 是因为是因为他的评分概况反映了我自己的品味，而这些推荐并不是我感到必须采取的。\n\n\n\n\n\n# 前沿警报！场调度（Mise en Scène）相似性\n\
  \n![](img/image1049.jpg)\n\n这是我们的第一个前沿警报！在这里，我们将重点介绍一些看起来有趣或有前景，但尚未真正进入推荐系统主流领域的新型研究。我们希望你在这门课程中获取所有最新、最棒的信息！如果你不熟悉这个术语，我们通常将当前先进的技术称为“前沿”（leading\
  \ edge）——但那些由于太新而在现实世界中尚未得到验证的技术，使用起来是有风险的，因此我们称之为“血血前沿”（bleeding edge）。![](img/image1055.jpg)\n\
  \n## 理解场调度数据（Mise en Scene Data）\n\n基于内容的过滤的一些近期研究围绕着“场调度”（mise en scene）数据的使用。从技术上讲，场调度指的是场景中对象的放置，但研究人员使用这个术语稍微宽泛一些，指的是电影或电影预告片场景的属性。其理念是从电影本身中提取可以量化和分析的属性，通过逐个场景地检查电影内容，看看我们是否能提供更好的电影推荐。\n\
  \n我们谈论的是什么样的属性呢？![](img/image1062.jpg)\n\n这里是研究团队为 `movielens` 数据集相关的电影预告片提取的属性列表。它包括平均镜头长度、颜色差异、每个场景中的运动量、场景照明等。从原则上讲，这些属性应该让我们对电影本身的节奏和氛围有一个直观感受。问题是，这些数据对于我们已经为每部电影使用的生成的类型分类更有用还是更没用。让我们来看看![](img/image1068.jpg)\n\
  \n## 使用 ContentKNNAlgorithm 实现\n\n让我们再次查看 `ContentKNNAlgorithm.py`，并观察这里的 `computeMiseEnSceneSimilarity`\
  \ 函数。就像根据类型和发行年份计算相似性一样，我们也可以根据这些场调度数据计算相似性。我们选择这样做的方法有点随机；我们只是取了每对电影这些属性之间的绝对差并将它们相乘。可能有更好的方法，但在我们花时间进行微调之前，让我们先尝试一下，看看使用这些数据是否利大于弊。\n\
  \n实际上加载并解析场调度数据的代码在 `MovieLens.py` 模块中；工作原理并不重要，但如果你好奇可以查看它。现在，记住我们使用类型时的 RMSE 为\
  \ `.9375`，而我们的样本前-N 推荐相当平淡。让我们把场调度数据加入进来看看会发生什么。要做到这一点，只需取消第 45 行来计算场调度相似性，并在第 46\
  \ 行将其相乘。保存 `ContentRecs.py` 并运行它。如果你在跟着操作，在几分钟后完成后点击暂停并恢复。\n\n好的，这很有趣——我们的 RMSE\
  \ 实际上变差了，到了 `1.0` 以上。这可能只是我们计算场调度相似性的方法导致的；我们真正关心的不是准确性。但从定性的角度来看，前-N 推荐看起来更好吗？我不知道……它似乎在推荐更多冷门的内容，尽管考虑到这个用户对《星际迷航》的兴趣，“火星任务”的新推荐看起来还可以。\n\
  \n再次，开发推荐系统有时是艺术而非科学；你无法真正预测人们对他们见过的新推荐会有什么反应。我个人很想通过 A/B 测试来测试它的表现。如果你查看与场调度推荐相关的文献，它们指出这对于准确性没有帮助，但增加了多样性。但再次，在推荐方面，增加多样性并不总是是好事——它可能意味着你正在推荐与用户的实际兴趣无关的随机内容。尽管如此，对它进行实验很有趣——使用这些人进行实验会更有趣![](img/image1080.jpg)\n\
  \n为了对我们使用的场调度数据给予应有的感谢，并提供更多学习提示，这里是关于它的原始论文的引用，以及你可以更深入探索数据集的链接。你可以看到这是非常最近的研究；目前属于血血前沿的内容，但我希望你作为本课程的一部分，了解推荐系统中最有趣的进展——这不会是我们要探索的最后一个。\n\
  \n## 编程练习 ![](img/image1087.jpg)\n\n作为一项练习，尝试修改 `ContentKNNRecommender.py`，独立地使用类型、发行年份和场调度数据。哪种产生的准确性最高，哪种结果产生主观上最让你满意的结果？如果你有大量时间，可以向\
  \ `ContentRecs.py` 中的 `Evaluate` 函数传递 `True`，以计算更多的评估指标。我将在下一节介绍我的结果![](img/image1094.jpg)\n\
  \n所以，这些是我通过独立尝试每种内容属性得到的结果。就准确性而言，类型是胜者；从定性的角度来看，我认为类型也是胜者。你可以看到发行年份最终找到了该用户最喜欢的年份，并推荐了该年份能找到的任何内容。由于我们只有到年份层级的发行日期，这里实际上发生的情况是\
  \ 1994 年的所有电影都并列第一，所以哪些电影进入前 10 名是随机的。这并不能很好推荐。场调度找出了一些冷门的内容，其中很多是外语片。该用户实际上可能喜欢外语片——我只认出其中的几部，但它们是我个人喜欢的。再次，将你自己的品味投射到他人的推荐结果上是危险的，但我特意选择我们的测试用户为一位根据评分历史与我品味相似的人员，这样我就可以对他们获得的结果的质量有一个定性的感受。所以，这些内容本身没有都不特别令人兴奋，尽管我会说类型是明显的胜者。但将这些属性结合在一起会带来更有趣的结果，在通常情况下也是如此——最成功的推荐系统是那些结合许多数据源甚至许多不同算法的系统，产生一个不仅仅是部分之和的系统。\n\
  \n根据你目前所学的知识，你会如何让这些结果更好？嗯，我们手头有流行度排名数据——很想用流行度至少作为一个打破平局的工具。我打赌，如果我们有一个基于流行度的二次排序，例如基于发行年份的推荐会好得多。如果你愿意接受更多挑战，尝试一下！看看通过对给定年份内的\
  \ `k nearest neighbors` 按照流行度进行排序，是否能改进基于发行年份的推荐。这就是开发推荐系统的核心；只需尝试新想法，并看看什么对你工作的特定用户和物品有效。这绝不是一成不变的。在进入下一页之前，请准备好查看我是如何通过流行度对那些基于年份的推荐进行二次排序的。\n\
  \n\n\n\n\n![](img/image1109.jpg)\n\n我做的第一件事是回到 `ContentKNNAlgorithm.py` 并修改它，使其仅使用发布年份作为标准，别忘记这一点，否则你将浪费大量时间！因此，要在你的\
  \ top-N 结果中进行二次排序，我们需要做的只是修改 `Evaluator.py` 中的 `SampleTopNRecs` 函数，那里是我们在测试框架中显示\
  \ top-N 推荐的地方。我们已经为该函数提供了 MovieLens 数据，因此我们可以在构建推荐列表时，提取每个推荐候选的流行度数据。\n\n你可以在这里的\
  \ `recommendations.append` 调用中看到这一点。然后为了进行二次排序，我们首先按流行度对列表进行排序，让最流行的项目位于列表顶部。这恰好是在我们推荐元组中索引为\
  \ 2 的元素。然后我们可以根据元素 1（即预估评分）进行排序。这样，当我们根据预估评分排名时出现平局，那么之前的基于流行度的原始排序仍然有效。在 Python\
  \ 中进行二次排序有其他方法，但当你需要对不同的方向进行排序时，情况会变得复杂，所以我们将采用这种方法。我们最终得到的推荐可能稍微好一点——老实说，1994 年并没有很多大片，而且这个用户已经评价了其中的大部分电影。但这些结果比我们开始时的结果更具识别度，一些非常冷门的标题被剔除了。\n\
  \n现在，通过使用流行度数据，从技术上讲，我们不再将推荐限制在内容属性——流行度是基于行为的数据。但这次练习的重点在于不要受不同算法和方法所提供的桶限制——始终愿意对新想法进行实验，以及结合不同想法的方法。这才是真正创新的来源，在这种情况下，它让我们的结果稍微好了一些。\n\
  \n## 基于社区的协同过滤\n\n![](img/image1125.jpg) 在下一节中，我们将介绍基于社区的协同过滤。这种思想是利用他人的行为来为你可能喜欢的内容提供参考。从高层次来说，这意味着寻找与你相似的人并推荐他们喜欢的东西。或者，它可能意味着寻找与你喜欢的东西相似的东西；即推荐那些买过你喜欢的东西的人买的东西。无论哪种方式，核心都是从与你相似的人（也就是你的“社区”）那里获取线索，并根据他们喜欢而你还没有尝试过的东西进行推荐。这就是为什么我们称之为“协同”过滤——它是基于他人的协同行为进行推荐的。\n\
  \n## Top-N 架构\n\n![](img/image1137.jpg) 我们将首先回顾课程之前介绍的第一个 top-N 推荐系统架构。我们最初在亚马逊进行协同过滤的方法是这样的：你从某种类型的数据存储开始，其中包含了用户的评分信息（无论是隐式的还是显式的）。然后，通过查找与每个用户喜欢的项目相似的其他物品，生成待推荐的候选项目。接下来，对这些候选项目进行评分和排名，过滤掉用户已经看过的内容，并生成最终的\
  \ top-N 推荐列表。\n\n你可以看到这种方法的核心实际上在于那个物品相似性数据库。在其他方法中，你可能会使用用户之间的相似性数据库。但无论如何，生成这些相似物品或相似人员的列表都是问题的核心，所以让我们花时间谈谈衡量相似性的不同方法。(image143.jpg)\
  \ 基于社区的协同过滤的核心在于能够找到与你相似的人，或与你喜欢的内容相似的项目。就像我们用基于内容的过滤衡量电影之间的相似性一样，我们可以应用相同的技术来衡量基于行为数据的相似性。协同过滤的第一步是衡量事物或人之间的相似性，以便找到与你相似的人。有很多方法可以做到这一点。\n\
  \n## 余弦相似性\n\n![](image154.jpg 余弦相似性指标在大多数情况下都非常好用。回顾一下，如果你有一组关于人或事物的属性，可以将每个属性看作维度，并将相似性看作在多维空间中不同事物之间的角度。计算角度的余弦值被证明非常直观，即使它不是一个容易可视化的事物。\n\
  \n这与我们使用内容属性进行时的唯一区别在于，我们的维度将是类似于“这个用户是否喜欢这个东西”或“这个东西是否被这个用户喜欢”。因此，每个用户或每个物品都可能构成自己的维度。而且维度是基于用户行为的，而不是内容属性。基于行为数据衡量这些相似性的巨大挑战在于我们所处理的数据的稀疏性。世界上有这么多电影，以至于个人可能看过某部特定电影是不可能的——没有人看过所有的电影。嗯，我在\
  \ IMDb 的老老板确实看过所有，但他绝对是一个离群值！通常情况下，我们处理的数据是非常稀疏的——大多数电影没有被特定个人看过，反之，通常来说大多数人没有看过某部特定的电影。这意味着，除非你有大量的用户行为数据来处理，否则协同过滤很难很好工作。当两个人之间没有任何共同点时，你无法计算出有意义的余弦相似性；当两个物品之间没有共同的人时也是如此。\n\
  \n\n\n\n\n# 稀疏性 ![](img/image1168.jpg)\n\n这是一个协同过滤算法可能处理的数据示例。我们通常从像这样的一个二维矩阵开始，，其中包含了物品、人物以及他们之间的评分。问题是，在实践中，这个矩阵大部分都是空缺。在我们在这个示例中列出的四部电影中，Bob\
  \ 只看过了其中一部，Alice 只看了一部，而 Ted 一部都没看过。没有足够的数据来处理，这就是为什么我们说数据是稀疏的。\n\n我到底该如何描述 Ted\
  \ 和 Alice 之间有多相似呢？我所知道的只是 Alice 喜欢《无敌陆动员》，而 Ted 出于原因没看它。我该如何说明《星球大战》和《卡萨布兰卡》之间的相似性呢？关于这两者，我根本完全没有任何数据。这些都是稀疏数据带来的问题。\n\
  \n这就是为什么协同过滤对于 Amazon 和 Netflix 这样的大公司效果很好——他们有数百万用户，因此尽管数据具有稀疏性，他们也有足够的数据来生成有意义的关系。但即使对于我们课程中的示例，我们正在处理的\
  \ 100,000 条评分也不足以生成非常好的相似性数据。\n\n稀疏性也引入了一些计算挑战——你不想浪费时间去存储和处理所有缺失数据，因此在底层，我们最终使用像“稀疏数组”之类的结构，以避免存储矩阵中所有的空隙。这提醒了我们，你必须处理的数据量和质量往往比你选择的算法重要得多。如果你从一开始就没有足够的数据，使用什么方法来衡量相似性其实并不重要。但让我们假设你有足够的数据，并讨论一些你可能使用的替代相似性衡量方法。\n\
  \n# 调整余弦 ![](img/image1177.jpg)\n\n现在，在解决了关于数据稀疏性的警示之后，让我们讨论一些计算相似性的其他方法。一种是调整余弦度量，它主要用于根据用户的评分来衡量用户之间的相似性。它基于这样一个观点：不同的人可能有他们不同的工作基准——Bob\
  \ 认为的 3 星电影可能与 Alice 认为的 3 星电影不同。\n\n也许 Bob 只是除非事情真的非常棒，否则就不倾向于给 5 星好评，而 Alice 则会尽量表现友好，除非她真的不喜欢，否则就会给\
  \ 5 星好评。这种真实效应不仅出现在不同个人之间，也出现在不同的文化之间。某些国家的评分比其他国家更严苛。因此，调整余弦试图归一化这些差异。\n\n我们不是根据原始评分值衡量人之间的相似性，而是根据用户对某个物品的评分与其对所有物品的平均评分之间的差异来衡量相似性。如果你看这个方程，我们将\
  \ `X` 替换为 `Xsub-I` 减去 `x-bar`，并将 `Y` 替换为 `y-sub-I` 和 `y-bar`。`X-bar` 表示用户 `X` 所有评分的平均值，`Y-bar`\
  \ 表示用户 `Y` 所有评分的平均值。所以这里与传统余弦相似性的区别在于，我们看的是每个用户评分相对于平均值的波动，而非评分本身。\n\n现在，这听起来很好，但在实践中，数据稀疏性真的会困扰你。只有当人们看过很多东西时，你才能获得个人评分的有意义的平均值（基准）。我们正在使用的\
  \ MovieLens 数据集有点小作弊，因为他们只包含了评分至少 20 次的人的数据。\n\n# 皮尔逊相似性 ![](img/image188.jpg)\n\
  \n调整余弦的一种稍微变体是皮尔逊相似性度量。唯一的区别在于，我们不是看评分与用户平均评分之间的差异，而是看评分与所有用户对该物品的平均评分之间的差异。因此，在这个方程中，我们将\
  \ `x-bar` 和 `y-bar` 替换为 `i-bar`，即所有用户对问题物品的平均评分。因此，我们不再试图考虑个人对特定评分的个人定义，在数据稀疏的真实情况下，这可能是一件好事。\n\
  \n但你可以将皮尔逊相似性理解为通过人们偏离平均行为的方式来衡量人之间的相似性。想象一部大多数人都喜欢的电影，比如《星球大战》。讨厌《星球大战》的人将获得非常高的皮尔逊相似性分数，因为他们拥有非主流的观点。注意，这与调整余弦唯一的区别在于我们讨论的是用户还是物品。我们在课程中使用的\
  \ Surprise 库将调整余弦称为“基于用户的皮尔逊相似性”，因为它们基本上是一回事，这可能有点让人困惑。我们在这张幻灯片中讨论的皮尔逊相似性是他们所谓的“基于物品的皮尔逊相似性”。\n\
  \n\n\n\n\n# 斯皮尔曼等级系数 ![](img/image1202.jpg)\n\n为了完整起见，我也将简要提到斯皮尔曼等级系数。在概念层，它与皮尔逊相似性的原理相同，但我们使用的不是直接的评分分数，而是使用排名。也就是说，我们不是使用电影的平均评分值，而是使用它根据平均评分在所有电影中的排名。同样，我们不是使用某部电影的个人评分，而是将该部电影在所有个人评分中对其进行排名。我不会深入探讨这些细节，因为这会让你困惑。其数学原理非常复杂，计算量巨大，而且通常不值得这样做。\n\
  \n斯皮尔曼的主要优势是它可以有效处理定序数据，例如，如果你有一个评分量表，其中不同评分值之间的意义差异并不相同。我本人从未在实际应用中见过这种用法，但你可能会在学术文献中遇到它。\n\
  \n# 均方差 ![](img/image1209.jpg)\n\n另一种衡量相似性的方法是均方差相似性指标，顾名其实义。例如，你查看两个用户评分中共同的所有项目，并计算每个用户对每个项目评分之间的平方差的平均值。这更容易理解，因为它不涉及多维空间中的角度——你只是直接比较两个个人对同一组物品的评分情况。这与我们在衡量整个推荐系统的准确性时衡量平均绝对误差（mean\
  \ absolute error）的原理非常相似。\n\n所以，如果我们拆解上面的方程，它表示用户 `X` 和 `Y` 之间的均方差（简称为 `MSD`）由以下公式给出。在分子的顶部，我们对用户\
  \ `X` 和 `Y` 都评分过的每一个项目 `I`，计算两个用户评分差的平方求和。然后，我们除以这些用户共同评分的项目总数，以得到平均值（或均值）。\n\n\
  现在问题是，我们计算的是用户 `x` 和 `y` 之间差异的指标，而我们想要衡量的是他们有多相似，而不是有多不同。为了实现这一点，我们只需取 `MSD` 的倒数，将其除以\
  \ 1——我们必须在分母上加上“+1”，以避免在这两个用户评分行为完全相同的情况下出现除零的情况。顺便说一下，你可以反转我们所说的内容，将其应用于项目而不是用户。因此，`x`\
  \ 和 `y` 可以指两个不同的事物而不是两个不同的人，那么我们看的就是这些项目共同拥有的人的评分差异，而不是人们共同拥的项目。正如我们很快看到的，协同过滤有两种不同的实现方式——基于项目的和基于用户的，重要的是记住，大多数相似性指标都适用于这任何一种方法。这就是\
  \ `MSD`。它比余弦相似性指标更容易理解，但在实践中，你通常会发现余弦相似性的效果更好。\n\n# 雅卡德相似性 ![](img/image1226.jpg)\n\
  \n我们将最后一个相似性衡量方法是雅卡德相似性指标。幸运的是，非常好理解。假设有两个用户 `A` 和 `B`。这两个用户之间的雅卡德相似性仅仅是这两个用户评分交集的大小，除以这两个用户评分并集的大小。所以例如，我们会统计两个用户都表示对某种兴趣感兴趣的所有电影，并将其除以任一用户表示感兴趣的电影总数。\n\
  \n由于我们只是在进行计数，在这里我们完全没有考虑实际的评分值——你可能会认为丢弃了一些非常重要的信息。但如果你处理的是隐式评分（implicit ratings），例如，某人看了某东西或买了某东西，你可能根本没有真实的评分值可以处理——你只知道他们要么对某个项目表达了兴趣，要么没有。在这种情况下，雅卡德算法可以是一个合理的选择，而且计算非常快。![](img/1232.jpg)\n\
  \n# 相似性指标回顾\n\n在继续之前，我们简要回顾一下不同的相似性指标：\n- **余弦相似性（Cosine similarity）**是一个很好的全能手。它几乎总是一个合理的起点。\n\
  - **调整余弦系数（Adjusted cosine）和皮尔逊（Pearson）**是基本上同一件事的两个不同术语——归结底它们是均值中心的余弦相似性。因此，它可以适用于用户所有项目评分的平均评分行为，或者一个项目跨所有用户的平均评分，取决于你如何反转它。其思想是处理偏离平均值的异常评分行为，但在实践中，它有时适得其反。\n\
  - **斯皮尔曼等级系数（Spearman rank correlation）**与皮尔逊的原理相同，使用排名而不是原始评分，这不是你可能在实践中使用的东西。\n\
  - **MSD（均方差）**比余弦相似性指标更容易理解的相似性指标，但在实践中它的效果通常并不更好。\n- **雅卡德相似性（Jaccard similarity）**查看两个用户共同拥的项目数量，或两个项目共同拥的用户数量，除以它们之间所有的项目或用户数量。它非常简单，非常适合隐式评分，例如购买或观看某物品等二进制行为，你要么做了要么没做。但归根结底，余弦相似性仍然是我默认的首选相似性指标。\n\
  \n\n\n\n\n# 基于用户的协同过滤\n\n让我们聊聊基于邻域的协同过滤的一种特定实现方式——基于用户的协同过滤。它是这类方法中最容易理解的一种，所以似乎是一个很好的起点。\n\
  \n## 核心思想\n基于用户的协同过滤背后的想法非常简单：首先根据用户的评分历史找到与你相似的其他用户，然后向你推荐他们喜欢但你还没有看过的内容。\n\n假设\
  \ Ann 和 Bob 都喜欢第一部《星际大战》。Ann 接着看了第二部《星际大战》《帝国反击战》——但 Bob 像生活在世隔绝的环境一样，还没看那部。所以，向\
  \ Bob 推荐《帝国反击战》似乎是理所易见的。如果 Ann 喜欢和 Bob 喜相同的电影，而且 Ann 也喜欢《帝国反击战》，那么 Bob 很有可能也会喜欢。\n\
  \n## 数据收集与表示\n我们如何做到这一点？嗯，第一步是收集我们需要的数据——即一张包含系统中所有用户评分的表格。我们可以将其想象为一个 `2D array`，其中一个轴是电影，另一个轴是用户，每个单元格是评分值。\n\
  \n从这里我们可以看到，Ann 非常喜欢前两部《星际大战》电影，Bob 只看了第一部并很喜欢，而且他们还看了其他互不共同的内容。从上看，Ann 也许也喜欢《印第亚纳·琼斯》，因为她通过《星际大战》与\
  \ Bob 建立了联系。\n\n现在，将这些数据想象成描述物品空间中每个用户的向量也并不太牵强。如果这个世界上只存在这五部电影，我们可以用一个 `5-dimensional\
  \ vector` `(4, 5, 0, 0, 0)` 来描述 Bob，用 `(0, 5, 5, 5, 0)` 来描述 Ann，其中 `0` 表示缺失值。这就为我们计算任何两个用户之间的\
  \ `cosine similarity score` 提供了支持。当然，我们也可以对不同的相似性指标进行实验，但让我们从 `cosine` 开始吧。\n\n\
  ## 相似性矩阵\n现在我们可以构建另一个 `2D matrix`——它映射系统中任意两个用户之间的 `cosine similarity score`。如果我们只有三个用户\
  \ Bob、Ted 和 Ann，它看起来可能像这样。仔细观察，以理解这里发生了什么。这些都将通过衡量 `cosine similarity` 的算法自动得出，但从结果来看，你可以发现它是符合直觉的。\n\
  \n每个人与自己都是 100% 相似的，所以如果我们查看 Bob 与 Bob 的相似性，会得到 `1.0`，这对于任何评分过至少一个东西的人都是如此。Bob 和\
  \ Ted 没有任何共同的评分过的电影，所以他们的最终相似性分数为 `0`。注意这里存在某种对称性——Bob 和 Ted 的组合可以与 Ted 和 Bob 分开查询，但无论如何得分都是一样的。我们可以利用这种对称性来避免计算表中一半的值。\n\
  \nBob 和 Ann 是一个更有趣的例子——虽然他们评分的电影集合不同，但在衡量相似性时，我们只看他们共同的电影。在这种情况下，他们只有一部共同的电影——《星际大战》——而且由于他们都给出了\
  \ `5 stars` 的相同评分，他们也得到了 `1.0` 的相似性分数，即 100%。\n\n我想指出，说两个用户 100% 相似并不意味着他们喜欢相同的东西——它也意味着他们讨厌相同的东西。如果\
  \ Bob 和 Ann 都给《星际大战》打了 `1 star`，他们仍然是 100% 相似的。事实上，`cosine similarity` 背后的数学逻辑决定了，如果你只有一部共同的电影，无论如何最终得到\
  \ 100% 的相似性——即使 Bob 喜欢《星际大战》而 Ann 讨厌它，在数据稀疏的情况下，他们最终都会 100% 相似。我只是在强调，数据稀疏是通常协同过滤的一个巨大问题，它会导致奇怪的结果，有时在考虑这些用户之前，你需要对他们共同的电影数量强制执行最小阈值，以避免那种奇怪的情况。\n\
  \n## 生成推荐\n现在假设我们要为 Bob 生成推荐。我们可以使用预先计算的这个方便矩阵来快速查找他与其他人的相似程度。然后我们可以根据相似性分数对该列表进行排序，并从列表中选出前\
  \ `N neighbors`。在这种情况下，Ann 位于列表顶端，我们可能会在这一阶段通过强制执行最小相似性分数阈值来舍弃 Ted。我们还跳过了 Bob 与自身比较的情况。在数据不那么稀疏的情况下，除了\
  \ Ann 之外，你会有更多良好的结果可以参考。\n\n现在，我们可以从 Bob 的前 N 个用户相似性结果中提取 Ann 以及其他人的所有电影，并将这些视为推荐候选。在这个简单的例子中，Ann\
  \ 是唯一与 Bob 相似的用户，但如果发现了其他用户，我们也会把他们的评分丢进这个堆中。\n\n## 候选评分\n接下来，我们需要确定这些推荐候选中哪些最适合给\
  \ Bob，所以我们需要以某种方式对它们进行评分。有不同的方法，但将给每个候选的评分考虑在内是合理的。我们想推荐相似用户喜欢的东西，而不是相似用户讨厌的东西。\n\
  \n因此，其中一个组件可以是某种归一化的评分分——也许我们将 `5-star rating` 转换为 `1.0`，以保持所有内容处于同一尺度上。我们可能应该考虑生成这些评分的用户相似性，所以也许我们可以将\
  \ `1.0` 的评分分乘以 Ann 与 Bob 的相似性，后者也是 `1.0`。因此，我们为这两项物品分配了 `1.0` 的候选分数。\n\n你可能会多次遇到同一部电影，如果有多个相似用户都评价过它。在这种情况下，你可能可能想通过再次将其加入该电影的最终评分计算中来加强与该电影的关系。再次，这样做的方法有多种变体。也许不需要将评分分归一化到\
  \ `0-1 scale`，你实际上可以为评分为 `1` 或 `2 stars` 的东西分配负分，以主动在最终结果中压低它们的排名。\n\n\n\n\n\n![](img/image1310.jpg)\n\
  接下来，我们只需根据推荐候选的最终得分进行排序即可。在我们简单的示例中，有一个分数为 1.0 的并列情况。![](img/image1315.jpg)\n\n\
  最后一步是过滤掉 Bob 已经评分过的内容，因为推荐他已经看过的电影没有意义。你也可以通过其他方式来过滤内容——也许存在某个最低候选分数，低于该分数的无论如何你都不会向用户展示结果；或者你可能想根据内容过滤掉可能具有冒犯性的结果。剩下的就是《帝国大击战》，希望这能让\
  \ Bob 成为我们基于用户的协同过滤系统的满意用户！![](img/image1321.jpg)\n\n总结一下，基于用户的协同过滤涉及的步骤如下：\n\n\
  1. 首先，构建一个查找表，记录用户到他们评分过的所有项目以及相应的评分值。\n2. 然后，构建另一个包含每对用户之间相似性评分的二维 D 矩阵。\n3. 此时，你已经完成了所有计算密集型的工作，可以只需复用这些表来为任何人快速生成推荐。\n\
  4. 当我们需要某个特定用户的推荐时，可以查找该用户的所有最相似用户。\n5. 接下来，我们通过汇总这些相似用户评分的所有内容来生成推荐候选。\n6. 随后，我们通过查看相似用户如何给这些内容评分、这些评分与你评分的相似程度以及任何你需要的其他，对所有候选内容进行评分。\n\
  7. 最后，我们过滤掉用户已经看的内容，就完成了！\n\n## 编程活动\n![](img/image1333.jpg)\n现在，让我们把这些话变得具体化，运行一些真实的代码对\
  \ MovieLens 数据集执行基于用户的协同过滤。打开 Spyder，关闭任何不再需要的旧内容。现在，打开课程材料中的 `CollaborativeFiltering`\
  \ 文件夹，并加载其中的所有内容。\n\n我们现在感兴趣的文件是 `SimpleUserCF.py`，所以点击该标签页，我们来过一遍。它小得令人惊讶，对吧？噢，发现我的梗了吗？惊讶？那是因为我们正在使用\
  \ `Surprise` 库来完成这里的大部分繁重工作。所以这个脚本只是执行了我们在幻灯片中讨论过的步骤。它并没有真正集成到我们之前开发的评估框架中，因为我们所描述的基于用户的协同过滤严格用于生成\
  \ Top-N 推荐；我们从未尝试过预测用户评分，所以我们无法真正将此算法硬塞进 `Surprise` 框架，因为该框架是围绕预测评分展开的。没关系，我们很快就会回到自己的框架，而且仍然会使用\
  \ `Surprise` 的某些组件。\n\n第一步是加载数据，这是此脚本执行的第一件事——加载 MovieLens 评分数据集并构建一个完整的训练集。我们不需要划分测试集，因为再次，我们在这里并不是衡量准确率，我们只是在做\
  \ Top-N 推荐并看看它们长什么样。\n\n接这段代码构建了每对可能的用户之间的相似性矩阵。为了快速方便地完成这一点，我们使用了 `SurpriseLib`\
  \ 的 `KNNBasic` 算法，作为其功能的一部分，它会构建一个我们可以用于自己目的相似性矩阵。请特别注意这里的 `sim_options` 参数——我们指定要使用\
  \ `cosine` 作为相似性度量。你也可以指定 `msd` 或 `pearson`，`suriselib` 会直接执行。\n\n接在第 33-34 行，我们提取了与我们的用户相似的所有用户，并保留其副本。我们使用\
  \ Python 的 `defaultdict` 是为了确保每个项目开始都有一个默认值 0。接下来，我们构建一个用于最终过滤阶段的字典，以便快速查找某项推荐是否已经被评分。最后一步是根据最终得分对推荐候选进行排序，并处理排名前\
  \ N 个，跳过我们已经看过的结果。在此过程中，我们查找电影名称并人类可读的格式打印出来。现在，让我们运行它看看会发生什么吧！\n\n\n\n\n\n# 基于物品的协同过滤\
  \ ![](img/image1359.jpg)\n\n另一种进行协同过滤的方法是将问题反过过来考虑——与其寻找与你相似的人并推荐他们喜欢的东西，不如看你喜欢过的东西，并推荐与这些东西相似的物品。我们将这种方法称为基于物品的协同过滤，而不是基于用户的![](img/image1364.jpg)\n\
  \n有几个原因解释了为什么使用物品之间的相似性可能比人之间的相似性更好。\n\n其之一是物品的属性通常比人更具永久性。一本数学书永远是数学书，但一个个人的口味在生命周期中可能会变化非常快。因此，关注不改变的对象之间的相似性，比观察那些上周还喜欢某东西、本周又喜欢完全不同东西的人之间的相似性能产生更好的结果。你的数学书始终与其他数学书相似，但一个喜欢数学书的人在几个月后可能会对数学感到厌倦。因此，你计算物品相似性矩阵的频率可以比用户相似性更低，因为它不会变化得那么快。\n\
  \n构建物品相似性的另一个非常重要的优势是，你需要处理的物品通常远少于用户。无论你为哪家公司开发推荐系统，其产品目录与其客户数量相比可能都小得多——在大多数情况下，人比要推荐给他们的东西多得多。这意味着，一个映射目录中每个物品之间相似性评分的二维矩阵，将比映射访问你网站的每个用户之间相似性的二维矩阵要小得多。这不仅使得存储该矩阵变得更简单，也让计算速度更快。当你处理像\
  \ Amazon 或 Netflix 这样的大型系统时，计算效率非常重要。这不仅需要更少的资源，意味着你可以更频繁地重新生成物品之间的相似性，在引入新物品时让系统更有响应性。\n\
  \n使用物品相似性还能为新用户提供更好的体验。当新用户来到你的网站时，只要他们对某件事表现出兴趣，你就可以向他们推荐与该物品相似的物品。使用基于用户的协同过滤，在他们用户进入你的用户相似性矩阵的下次构建之前，你无法为其提供任何推荐![](img/image372.jpg)\n\
  \n所以，基于物品的协同过滤的通用过程与基于用户的非常相同；区别在于我们颠倒了用户和物品的使用。因此，我们不是从用户为行、物品为列的矩阵开始，而是从物品为行、用户为列的矩阵开始。这让我们能够快速查找给定物品的所有用户评分，以便根据评价这些物品的用户来衡量物品之间的相似性。\n\
  \n之前，我们认为用户存在于一个每个物品为一个维度的空间中，并找到这些用户向量之间的余弦相似性。但现在，我们只是把这反转过来——我们认为物品存在于一个每个用户为一个维度的空间中，并找到这些物品向量之间的余弦相似性。当然，余弦相似性只是衡量物品相似性的许多方法之一——可能还有其他对这些物品评分的方法，它们完全不是基于相似性的。但在不违反保密协议（NDA）的情况下，我无法深入这些![](img/image380.jpg)\n\
  \n所以现在我们可以根据每个物品的共同评分用户，计算每对可能的物品之间的余弦相似性评分。再次，在这个例子中，我们所有的得分都是 1 或 0，因为我们要处理的数据太少，但在现实世界中你会看到更有趣更有意义的数字。你可能还会注意到我们最终得到的矩阵比查看用户相似性时要大，但这再次只是我们数据的特性——通常用户比物品多，而不是反过来，这意味着你的物品相似性矩阵将比用户相似性矩阵要小![](img/image386.jpg)\n\
  \n让我们回到我们的朋友 Bob 身上。关于 Bob 我们只知道他喜欢《星球大战》——也许他是一个新用户，这是我们目前知道关于他的唯一信息。我们现在可以查询我们的物品到物品相似性矩阵，根据看过该电影的其他用户的评分查找与《星球大战》相似的其他电影。有趣的是，这种技术不仅选出了《帝国反击》，还选出了《印第亚纳·琼斯》和《超级总动员》，因为他也喜欢这些。所以即使在极小的示例集中，我们得到的结论也比基于用户的协同过滤更有趣。\n\
  \n## 编码活动\n\n让我们尝试一下基于物品的协同过滤。打开 `SimpleItemCF.py` 并查看。正如你预期的那样，它看起来非常像 `SimpleUserCF.py`，因为通用方法与基于用户的协同过滤相同——我们只是关注物品之间的关系而不是用户之间的。\n\
  \n你将看到的第一个区别是，我们在设置时为“基于用户（user based）”传递了 `false`。这告诉 surprise 库使用 `cosine` 作为相似性指标生成物品到物品的相似性矩阵，而不是用户到用户的相似性矩阵。接下来，我们为测试用户提取评分最高的物品，然后查找所有与这些物品相似的物品。这些成为我们的推荐候选，当我们构建列表时，根据它们与用户评分过的物品的相似性评分对其进行评分。代码的其他部分是相同的——我们构建用户已经看过的东西的字典，并在打印高分结果时，将它们从最终结果中过滤掉。如果你是\
  \ Python 新手，在这里停一下并仔细学习这段代码可能是个好主意。但一旦你理解了——让我们运行它看看会发生什么。\n\n\n\n\n\n![](img/image1444.jpg)\n\
  \n现在，我将给你们出一个稍微更有挑战性的练习。我们的直觉是，对于我们特定的这个数据集，基于用户的（user-based）结果看起来比基于物品（item-based）的结果更精彩，后者似乎侧重于更老、更冷门的电影标题。但我们并不确定这些真的是更糟糕的推荐，还是在我们的测试用户评分那个时期，它们实际上是更好的推荐。\n\
  \n所以，让我们来衡量一下。尝试修改 `EvaluateUserCF.py` 函数，衡量基于物品的协同过滤而不是基于用户的，并看看命中率（hit rate）对比如何。通过查看我们之前使用的\
  \ `SimpleItemCF.py` 文件，你应该能够完成任务。如果你愿意的话，就尝试一下，我将在接下来的幻灯片中向你们展示我是做的。\n\n![](img/image1451.jpg)\n\
  \n所以，将我们的代码从衡量基于用户的协同过滤调整为基于物品的应该非常容易。只需要更改两处代码块：\n\n1. 第一处是在 `sim_options` 结构中为\
  \ user-based 传递 `False`，告诉 Surprise 生成项目与项目之间的相似性。\n2. 接下来，我们只需要将 `SimpleItemCF.py`\
  \ 中的核心代码适配，使其在我们遍历每个用户的循环中运行，而不仅仅是单个测试用户。\n\n代码的其他部分保持不变。当我们运行它时，结果有点震惊——基于物品的协同过滤的命中率仅为\
  \ 0.5%，而基于用户的为 5.5%！\n\n这是为什么呢？我们一直说服自己基于物品应该是一种更优的方法，而且这在工业界已经得到了证明！这很难证明，但我认为这只是我们正在使用的数据集的一个特性。MovieLens\
  \ 数据集最初创建于大约 20 年前，它包含的那个时代的数据比现在的电影数据多。我们看到，结果是基于物品的方法似乎关注了那些旧电影，这可能导致我们在查看数据集中更现代的用户时，命中率很低。\n\
  \n这只是一个假设，但故事的寓意又是：要真正离线评估推荐系统是非常困难的，尤其是当你使用历史性的、较小的数据集进行测试时。如果我们根据最后这次练习的结果来决定方法，我们将得出基于用户的协同过滤远优的结论并拒绝基于物品的方法——但如果我们通过\
  \ A/B 测试使用真实世界的数据对真实人物测试这两种算法，结果可能会完全不同。\n\n事实上的，，协同过滤对稀疏和噪声数据很敏感，而我们在这里使用的是一个较小的数据集，这并没有让情况好起来。但如果说这门课程有一个主题的话，那就是你不应该过度信任推荐系统的离线准确性测量。你系统的真实用户根本不在乎你对他们已经看过的电影评分预测有多准，而这正是所有这些离线指标所衡量的内容。\n\
  \n\n\n\n\n# KNN 推荐系统\n\n![KNN Image](img/image1469.jpg)\n\n正如我们所见，如果不对真实世界中的用户运行昂贵的实验，要评估协同过滤是非常困难的。由于它们不是基于预测评分的，我们无法在离线状态下真正衡量它们的准确性。因此，协同过滤的概念被应用于那些确实进行评分预测的推荐系统中，这些系统在文献中通常被称为“KNN\
  \ 推荐系统”。让我们来看看它们是如何工作的。![](img/image1475.jpg)\n\n让我们重新回顾基于评分预测的推荐系统架构。在这类系统中，我们通过预测用户尚未评分过的所有物品的评分来生成推荐候选列表，并选择预测评分最高的\
  \ `K` 个物品。从那里开始，其他所有工作方式大体都相同。这显然不是一种非常高效的方法，但由于我们预测的是评分值，因此可以使用训练/测试集或交叉验证来衡量系统的离线准确性，这在研究领域非常有用。\n\
  \n那么，我们的挑战就是，如何利用关于物品或用户相似性的数据来预测评分，以便我们仍然称其为协同过滤。一种方法是基于相似性评分最好的前 `K` 个物品或用户来进行这些预测，这就是为什么我们把这种方法称为“K\
  \ 近邻算法”。让我们深入了解它的原理。![](img/image1482.jpg)\n\n## 基于用户的 KNN\n\n对于基于用户的 KNN 方法，其工作原理如下：由于我们正尝试预测给定用户和物品的评分，我们首先寻找与目标用户相似的用户——但我们需要将其限制在也评分过目标物品的用户范围内。将其限制为数量\
  \ `K` 的相似用户。因此，我们得到了来自 `K` 个相似用户对该物品的评分集合——这些就是我们的“K 近邻”，以及这些用户与我们要预测的用户之间的相似度量。\n\
  \n接下来，我们对每个相关评分的用户相似性评分进行加权平均，权重为评分本身。这让我们根据同样评分过该物品的相似用户，对该用户可能给该物品出的评分出一个合理的预测。看到这与我们之前描述的基于用户的协同过滤方法本质相似，但在工作机制上完全不同。它的核心仍然使用用户间的相似性矩阵，但我们不仅仅是推荐与你相似的人喜欢的东西。相反，我们正在深入挖掘数据，尝试对每个可能的用户的每个可能的物品进行评分预测。这是一种更复杂的方法，通常是件坏事。image1490.jpg)\n\
  \n### 数学原理\n\n这里是对我们刚才内容的复杂数学描述，使用了与 `SurpriseLib` 文档相同的符号。它表示用户 `u` 对物品 `I` 的预测评分等于\
  \ `k` 个近邻用户的之和，我们将这 k 个近邻用户每一个称为 `v`。在过程中，我们对用户 `u` 和 `v` 之间的相似性评分的乘积乘以用户 `v` 给该物品的评分。然后我们除以这些用户相似性评分的总和，得到一个可以作为评分预测的加权平均值。image1495.jpg)\n\
  \n## 基于物品的 KNN\n\n基于物品的 KNN 工作原理完全一样，我们只是交换了“用户”和“物品”这两个词。因此，为了预测用户 `u` 对物品 `I`\
  \ 的评分，我们从该用户也评分过的、与物品 `i` 最相似的 `k` 个物品集合开始。从那里开始也是一样——根据评分计算相似性评分的加权平均，你就得到了一个可以使用的评分预测。image1501.jpg)\n\
  \n数学原理是相同的，只是我们在这里看的是物品 `I` 和 `j` 之间的相似性，而不是用户 `u` 和 `v`。因此，预测评分是基于该用户也评分过的、与目标物品最相似的\
  \ `K` 个物品。我们将所有根据评分加权的物品相似性评分相加，并除以相似性评分的和。这有点像是将协同过滤的概念强行塞进围绕评分预测构建的框架中，但正如我们所看到的，作为一个评分预测器它并不糟糕。然而，如果你的目标是创建\
  \ Top-N 推荐，可能更好使用我们之前描述的更简单、更直接的方法。幸运的是，`KNN` 是 `SurpriseLib` 内置的算法，因此我们不需要写太多代码就可以对其进行实验。让我们来看看。\n\
  \n## 编程活动\n\nimage1509.jpg)\n\n让我们回到 Spyder，这次看一眼 `CollaborativeFiltering` 文件夹中的\
  \ `KNNBakeOff.py` 文件。正如我所说，`SurpriseLib` 会在这里为完成大部分工作——我们只需要告诉它想让它做什么。\n\n\n\n\n\
  \n# 基于模型的方法\n\n![](img/image1591.jpg)\n\n正如我们所看到的，协同过滤可以产生非常优秀的结果，并且已被证明在真实的大规模场景中效果非常好。那么，为什么我们还要寻找更更好的方法呢？协同过滤被批评为扩展性有限，因为在非常大的物品或用户集上计算相似性矩阵需要大量的计算能力。\n\
  \n然而，我并不真正认同这种观点——正如我们看到的，使用基于物品的协同过滤大幅降低了这种复杂度，至于你可以在单台机器上为极大的产品目录计算整个相似性矩阵。即使你做不到，诸如\
  \ `Apache Spark` 等技术也允许你在需要时将该矩阵的构建分布到集群中进行。\n\n不过，协同过滤确实存在一个合理的问题，就是它对噪声数据和稀疏数据敏感。只有当你拥有一个大型且干净的数据集时，才能获得非常理想的结果。因此，让我们探索其他一些生成推荐的方法。我们将这些方法归类为“基于模型的方法”，因为我们不再尝试于寻找相互相似的物品或用户，而是应用数据科学和机器学习技术从我们的评分数据中提取预测结果。\n\
  \n机器学习的核心是训练模型以做出预测，因此我们将以相同的方式处理推荐问题——我们将利用用户评分数据训练模型，并使用这些模型来预测用户对新物品的评分。这使我们恰好处于\
  \ `SurpriseLib` 构建核心的评分预测架构领域，尽管我们已经证明这并不总是最高的方法，但它允许我们重新利用机器学习算法来构建推荐系统——其中某些算法非常擅长预测评分。这些算法是否能产生良好的\
  \ Top-N 推荐，我们还需要进一步发现。\n\n## 矩阵分解\n\n![](img/image1606.jpg)\n\n有很多种技术属于矩阵分解这一范畴。这些算法可能会有点“细思极恐”——它们能够自动发现用户和物品的更广泛的特征，例如“动作电影”或“浪漫”——尽管数学上并不知道如何称呼它们，但它们只是通过描述从数据中提取出的属性的矩阵来描述。\n\
  \n![](img/image1617.jpg)\n\nget 的想法是将用户和电影描述为不同特征不同数量的组合。例如，Bob 可能被定义为 80% 的动作片迷和\
  \ 20% 的喜剧片迷——那么我们就知道要将他与大约 80% 动作片和 20% 喜剧片的混合电影进行匹配。这就是大体的想法；让我们深入研究它的工作原理。\n\n\
  从我们想要实现的目标反推通常是一个很好的方法，那么在预测用户评分时，我们在尝试做什么呢？嗯，你可以将其想象为填充一个非常稀疏的矩阵。我们可以将所有的评分视为存在于\
  \ 2D 矩阵中，行代表用户，列代表物品——在我们的案例中是电影。问题是该矩阵中的大多数单元格都是未知的；我们的挑战是用预测值来填充这些未知的单元格。那么，如果我们最终的目的是为了创建一个矩阵，也许我们可以看看某些可以应用于矩阵的机器学习技术。其中一种技术被称为主成分分析，或称\
  \ `PCA`。\n\n## 主成分分析\n\n![](img/image1631.jpg)\n\n主成分分析通常被描述为一个“降维”问题。也就是说，我们希望将存在于许多维度中的数据（例如一个用户可能评分的所有电影）转换为较小的维度集合，这些维度可以准确地描述电影，例如它的类型。\n\
  \n那么，为什么屏幕上有一朵花呢？嗯，起初很难想象这在电影上是如何工作的——但有一个关于鸢尾花（Iris flowers）的数据集可以作为 `PCA` 运行的良好示例。仔细观察鸢尾花，你会发现它外面有一大片大花瓣，内部有一些较小的花瓣。那些内部的花瓣根本不被称为花瓣，它们被称为花萼片（sepals）。因此，描述特定鸢尾花形状的一种方法是通过其花瓣的长度和宽度，以及花萼的长度和宽度。\n\
  \n\n\n\n\n![](img/image1643.jpg)\n\n如果我们观察正在处理的鸢尾花（Iris）数据集，对于我们测量的每朵鸢尾花都有花瓣和花片的长度与宽度——也就是说总共有四个维度的数据。我们人类弱人类的大脑无法想象\
  \ 4 维数据的散点图，所以让我们先考虑花瓣的长度和宽度。这里绘制了数据集中所有鸢尾花的长度和宽度。在不涉及其工作原理的数学细节的情况下，那些黑色箭头被称为数据的“特征向量”（eigenvectors）。基本上，它是能够最好地描述数据方差的向量，以及与之正交的向量。它们共同定义了一个新的向量空间（或基），该基能更好地拟合数据。这些特征向量就是我们数据的“主成分”（principal\
  \ components）。这就是它被称为主成分分析（PCA）的原因——我们正试图找到这些描述我们数据的主成分，而这些成分是由这些特征向量提供的。\n\n##\
  \ 为什么主成分有用\n\n让我们思考为什么这些主成分是有用的。首先，我们可以直接从该特征向量观察数据的方差。到该特征向量的距离是一个数值；一个单一维度，它可以很好地重建我们在这里开始的花瓣长度和花瓣宽度的二维数据。所以，你可以看到识别这些主成分如何让我们能够比开始时更少的维度来表示数据。\n\
  \n此外，这些特征向量有一种发现数据中固有的有趣特征的方法。在这种情况下，我们基本上发现了鸢尾花花瓣的总尺寸对于分类它是哪种鸢尾花至关重要，而宽度与长度的比例或多是恒定的。因此，沿着这个特征向量的距离基本上是在衡量花的“大程度”。数学并不知道“大”意味着什么，但它找到了定义数据中某些隐藏特征的向量，这个特征似乎在描述数据时很重要——而且它恰好对应于我们所谓的“大程度”。\n\
  \n因此，我们也可以将 PCA 视为一种特征提取工具。我们将它发现的特征称为潜特征（latent features）。这里是 PCA 在我们完整的 4 维鸢尾花数据集上的最终结果——我们使用\
  \ PCA 识别出该 4 维空间内最能代表数据的两个维度，并在这两个维度上进行了绘图。PCA 本身会返回与你开始相同数量的维度，但你可以选择丢弃信息最少的维度。因此，通过丢弃\
  \ PCA 中关于我们数据信息最少的两个维度，我们可以从 4 维减少到 2 维。我们无法真正说这两个维度代表什么。图中的 X 轴意味着什么？Y 轴意味着什么？我们唯一确定的是，它们代表了\
  \ PCA 从数据中提取的某种潜在因子或特征。它们是有意义的，但只有通过检查数据，我们才能尝试为它们贴上某种人类标签。\n\n![](img/image1657.jpg)\n\
  \n## 电影评分的 PCA\n\n就像我们可以在对 4 维鸢尾花数据集运行 PCA 一样，我们也可以在我们的多维电影评分数据集上运行 PCA，其中每个维度都是一部电影。我们将这个以用户为行的评分矩阵称为\
  \ `R`。就像对我们的鸢尾花数据集做的那样，PCA 可以将其简化为更少数量的维度，以最好地描述方差。\n\n通常，它找到的维度对应于人类学习到的与电影关联的特征，例如，一部电影有多“动作感”？有多浪漫？有多幽默？电影中任何任何导致个人评分不一的因素，PCA\
  \ 都会找到这些潜特征并从数据中提取出它们。PCA 并不知道它们意味着什么，但它仍然找到了它们。因此，我们可以要求 PCA 在此示例中将其提炼为例如 3 个维度，它会将我们的评分简化为\
  \ 3 个潜特征。\n\n## 矩阵分解与 SVD\n\n所以，就像我们可以对 4 维鸢尾花数据集运行 PCA 一样，我们也可以在我们的多维电影评分数据集上运行它，其中每个维度都是一部电影。我们将这个以用户为行的矩阵称为\
  \ `R`。就像对我们的鸢尾花数据集做的那样，PCA 可以将其简化为更少数量的维度，以最好地描述方差。\n\n通常，它找到的维度对应于人类学习到的与电影关联的特征，例如，一部电影有多“动作感”？有多浪漫？有多幽默？电影中任何任何导致个人评分不一的因素，PCA\
  \ 都会找到这些潜特征并从数据中提取出它们。PCA 并不知道它们意味着什么，但它仍然找到了它们。因此，我们可以要求 PCA 在此示例中将其提炼为例如 3 个维度，它会将我们的评分简化为\
  \ 3 个潜特征。\n\n最后，我们假设我们对给定的 `U` 和 `M-T` 有某些已知评分。我们可以将这视为一个最小化问题，我们试图找到使 `R` 中已知误差最小的完整行和列。有很多机器学习技术可以做到这一点，例如随机梯度下降，简称\
  \ `SGD`。基本上，它以给定的学习率不断迭代，直到达到最小误差值。\n\n再次，`SGD` 只是这种方法的一种——例如 Apache Spark 使用了不同的技术，称为交替最小二乘法（`ALS`）。你可能会在这里感到困惑，因为突然之间我们就在讨论学习\
  \ `M` 和 `U` 的值，而不是直接计算它们，这正是 `SVD` 所做的。SVD 指的是奇异值分解。知道它是做什么的吗？`SVD` 所做的就是同时对用户和物品运行\
  \ PCA，并带给我们需要的 `U`、`Sigma` 和 `M-T` 矩阵，这非常高效。\n\n但是，当我们的矩阵 `R` 大部分缺失时，我们如何计算 `U`\
  \ 和 `M-T` 呢？你可以只用某些默认值来填充缺失值，比如平均值——这是人们最初的做法。\n\n但是有更好的方法。记住，每个评分都可以描述为 `U` 中的行与\
  \ `M-T` 中的列的乘积。例如，如果我们想预测 Bob 对《星球大战大战》的评分，我们可以将其计算为 `U` 中的 Bob 行与 `M-T` 中的《星球大战》列的乘积。\n\
  \n所以，让我们假设对给定的 `U` 和 `M-T` 有某些已知评分。我们可以将这视为一个最小化问题，我们试图找到使 `R` 中已知误差最小的完整行和列。有很多机器学习技术可以做到这一点，例如随机梯度下降（`SGD`）。\n\
  \n## 编码活动：SVD\n\n![](img/image1697.jpg)\n\n所以打开 Spyder，关闭所有打开的窗口以防混淆。打开课程材料中 `MatrixFactorization`\
  \ 文件夹下的所有内容。让我们先查看 `SVDBakeOff.py`。`Surprise` 包含了两种实现；一种是 `SVD`，另一个被称为 `SVD++`。\n\
  \n准确性结果是我们为止看到的最好的，RMSE 实际上低于了 0.9。从准确性来说，这非常令人深刻。但前 N 个推荐看起来是什么样的？让我们先向下滚动查看。好的，这些看起来还不错。《角斗士》、《月球》、《华力士和鼠》——这些都是我喜欢的电影。\n\
  \n这就是提取潜特征算法的特点——它们能以一种有点惊悚的方式，很好地提炼出用户的基本兴趣，并很好地将电影提炼为它们的独特性。使用 `SVD` 将两者匹配起来是一个强大的想法。这是一个需要大量理解的理论，但我们在这里得到了非常不错的回报！\n\
  \n\n\n\n\n# 前沿警报！（Bleeding Edge Alert!）\n\n又是发布前沿警报的时候了！在这里，我们将讨论一些取得了前景成果，但尚未进入推荐系统主流领域的最新研究。\n\
  \n在这次的前沿警报中，我们实际上将回到 2011 年，回顾稀疏线性方法，简称为 `SLIM`。该方法源于明尼苏达大学，该校从起初就是推荐系统领域的先驱。`SLIM`\
  \ 的结果非常令人兴奋，我不知道为什么在工业界没有听到更多关于它的应用。这绝对是值得关注和持续追踪的。\n\n这篇论文引起我注意的是，`SLIM` 在各种数据集上一如既往地优于多种竞争算法。尽管他们在对比中没有包含\
  \ SVD++，但他们确实与许多相似算法对比了比较。此外，他们通过命中率（hit rate）来衡量成功率，因此他们的重点非常集中在 Top-N 推荐上，而不是评分预测准确性，这同样是正确的关注点。`SLIM`\
  \ 不仅在 Netflix 数据集上完胜其他所有方法，在书店、雅虎音乐、信用卡购买数据以及几个邮购零售商数据集上赢胜了。讽刺的是，唯一一个没有获得首名的数据集是\
  \ MovieLens，但它位列第二。\n\n## SLIM 背后的逻辑\n\n`SLIM` 的核心思想是：通过对该用户评分过的其他项目进行稀疏聚合，乘以权重的稀疏聚合，为特定的用户和物品生成推荐评分，这正是魔法所在的地方。\n\
  \n论文中的符号如下——`tilde a sub i-j` 代表特定用户对特定项目的未知评分，它等于该用户评分过的所有内容的整行（此处用下标 `I T` 表示），再乘以与该行相关的某些预计算权重。由于用户只评价了某些项目，且权重仅存在于这些项目中，这就是该方法中使用“稀疏（sparse）”一词的由来。\n\
  \n所以，如果你将这个想法扩展到整个用户/物品评分矩阵，它看起来是这样的：很简单，对吧？为了预测评分，我们只需要将已知的评分乘以名为 `W` 的魔法权重矩阵。`A`\
  \ 和 `W` 都是稀疏矩阵，意味着它们包含不完整的数据——即实际存在的评分。\n\n## 实现挑战\n\n秘诀在于 `W` 是如何计算的，而这正是变得复杂的地方。它复杂到许多人在实现它时都会遇到困难，这可能解释了为什么它没有被更广泛使用。这只是论文中描述如何操作的前几个段落。\n\
  \n从本质上讲，这是一个优化问题，就像使用随机梯度下降来学习 `SVD` 中的矩阵一样。但你真的需要更高程度的数学才能理解这里发生了什么。如果像“矩阵 Frobenius\
  \ 范数（matrix Frobenius norm）”和“L1 范数正则化（l1-norm regularization）”之类的短语对你来说很有意义，那么你尽管去尝试。否则，我会去\
  \ `Github` 上搜寻找已经成功实现此并分享代码的人。我确实找到了一个，但那个家伙在规模化运行时遇到了困难。这可完全不是什么容易的事。\n\n## 结论\n\
  \n尽管如此，你无法反驳 `SLIM` 的结果，所以如果你在你正在使用的机器学习库中看到它，它绝对值得你花时间去实验。研究社区已经注意到了这一点，并出现了一些\
  \ `SLIM` 的扩展，例如上下文 `SLIM` 和高阶 `SLIM`（或 `HOSLIM`）。即使在原始论文中，也描述了一种名为 `fsSLIM`（特征选择\
  \ `SLIM`）的扩展，它限制 `SLIM` 仅使用与你目标最相似的列——这会微提高命中率。所以，如果一个 `SLIM` 的实现出现在你面前，请再看一眼。这是很有前景的东西。\n\
  \n\n\n\n\n# 深度学习推荐系统 ![](img/image1795.jpg)\n\n我们都知道，人工智能和基于人工神经网络的“深度学习”现在非常火热，因此，许多关于将深度学习应用于推荐系统的研究并不令人意外。不过，你们知道某些事情吗？矩阵分解可以通过神经网络来实现，因此我们已经实现了许多通过深度学习可以获得相同的结果——这只是实现相同内容的另一种方式。`SVD`\
  \ 的效果之好，令人感到不可思议，就像深度学习往往给人这种不可思议的感觉。这有一个非常充分的原因——这两种技术可以产生相同的结果。但是，深度学习也为实现推荐开启了全新的方法，非常值得探索。其中许多内容仍然处于前沿阶段，但它们是目前的发展趋势——因此，理解它们至关重要。\n\
  \n# 深度学习简介 ![](img/image1803.jpg)\n\n在理解如何将深度学习和人工神经网络应用于推荐系统之前，我们首先需要了解深度学习和人工神经网络是如何工作的。如果你已经熟悉深度学习，特别是\
  \ `Tensorflow`，你可能可以跳过接下来的章节。但如果 `Tensorflow` 和神经网络对你来说是新领域，或者你已经生疏了，我鼓励你阅读下一节，以便在我们尝试将这些工具应用于推荐系统之前，你理解其工作原理。本节节自我在\
  \ YouTube 上提供的一门关于深度学习和神经网络的大型免费课程的一部分，如果你想深入研究，只需在 YouTube 上搜索 `Sundog Education`\
  \ 就能找到。在这一节中，我们不会讨论推荐系统；我们将用更通用的术语涵盖深度神经网络的概念。然后，在随后的章节中，我们将把所学的知识应用于推荐系统问题。\n\n\
  # 深度学习准备知识 ![](img/image1811.jpg)\n\n在深入深度学习之前，有几个算法你需要先理解，因为它们是深度学习工作机制的重要组成部分。这些准备知识之一是随机梯度下降，或\
  \ `SGD`——这就是我们在讲解矩阵分解时谈过的同一个 `SGD`。正如我提到的，可以使用神经网络来实现矩阵分解，因此你发现可以使用相同的技术来训练这两种方法并不算意外。我们还将谈论\
  \ `autodiff`（自动微分），这是 `SGD` 在神经网络中依赖的某种数学技巧。我们还将涵盖 `softmax`，它被用于神经网络的输出端，将它们的原始输出转换为更有用的评分分类。![](img/image1818.jpg)\n\
  \n## 梯度下降\n\n我们想要谈论的第一点是 `Gradient Descent`（梯度下降）。这基本上是一种机器学习优化技术，用于尝试为给定问题找到最优的参数集。所以我们在这里绘制的基本上是某种代价函数，即你学习系统误差的某种衡量——这适用于一般的机器学习。你会有某种函数来定义你的预测值与实际观测值之间的接近程度。因此在监督学习的语境下，我们将为算法（或模型）输入一组参数。这些参数定义了我们调整模型的方式，我们需要识别出产生最优结果的这些参数的不同值。\n\
  \n所以 `gradient descent` 的想法是，你只需随机选择一个点，这些点中的每一个都代表你模型的一组参数。可能是我们之前讨论过的某些模型的各种参数，也可能是你神经网络内部的精确权重。无论是什么，我们都会先尝试一组参数，然后测量它在我们的系统上产生的任何误差。然后，我们沿着曲线向下移动。在这里我们将尝试另一组参数，再次就像在给定方向上移动不同的参数值，然后我们测量得到的误差，在这种情况下，通过尝试这组新参数，我们实际上实现了更小的误差。所以我们说：“好的，我认为我们正在朝着正确的方向前进。让我们以相同的方式进一步改变它们，”并不断在不同的步骤上这样做，直到最后我们到达曲线的底部，从该点起误差开始增加。在那个点上，我们就知道实际上触及了这个梯度的底部——这就是“梯度下降”这个术语的本质。基本上，我们根据给定的参数随机选择一个点并测量其误差，并一直向给定方向推动这些参数，直到误差最小化并开始回升到其他值。这就是梯度下降的简要原理。我不会涉及其中所有的硬核数学原理；在这里概念才是重要的，因为梯度下降是我们实际上训练神经网络以寻找最优解的方法。现在你可以看到这个想法有一些改进空间。首先，你实际上可以将这比作一个下山滚动的球，所以我们稍后会的一种优化方法是使用\
  \ `momentum`（动量）的概念。你实际上可以让这个球在下山时加速，并在到达底部时减速。这种方法让你在操作时更快地收敛，并可以让你神经网络的实际训练更快。\n\
  \n我们谈论的另一个点是 `local minima`（局部最小值）的概念。如果我随机选取了一个点，结果落在了这条曲线最左侧的凹处处呢？我可能会停留在这里的最小值处，而这个最小值并不是误差最小的点。这个图中误差最小的点在右侧。这是梯度下降的一个普遍问题。你如何确保自己不会陷入局部最小值？因为如果你只是看图中这个看起来像最优解的部分，如果我恰好从这里开始，我就会卡住。处理这个问题有很多方法。显然你可以从不同的位置开始，但在实践中，对于训练神经网络来说，局部最小值并不是大问题。这种情况并不经常发生，所以不需要太担心它。这是一件好事，因为长期以来人们认为\
  \ AI 会受到局部最小值的限制，但在实践中![](img/image1826.jpg)\n\n## Aut 微分\n\n另一个我们需要熟悉的概念是 `autodiff`（自动微分）。我们不需要深入研究\
  \ `autodiff` 工作的数学原理，只需要知道它是什么以及它为什么重要。所以当你进行梯度下降时，你需要知道梯度是什么，对吧？我们需要沿着代价函数测量斜率，如果你处理多个参数，那么讨论的就是计算偏导数，这对于计算机来说非常耗费且效率低下，因此通过暴力方法进行梯度下降是非常困难的。\n\
  \n具体来说，我们使用所谓的 `reverse-mode autodiff`（反向模式自动微分）。你需要知道的是，它通过多次遍历你的图就可以计算所有偏导数，这在神经网络中效果很好，因为神经网络往往有很多输入但可能只有一个输出。这是一个非常棒的技巧。Autodiff`\
  \ 是 `Tensorflow` 库在底层用于实现梯度下降的。你永远不需要从头实现梯度下降或 `autodiff`；但至少知道它们是什么以及为什么很重要。总结一下，梯度下降是一种在多个步骤上最小误差的算法；`autodiff`\
  \ 是一种加速该过程的方法，这样我们不需要做很多数学![](img/image1833.jpg)\n\n## Softmax\n\n我们需要讨论的另一个事情是\
  \ `softmax`。这里的数学原理并不复杂，但再次，重要的是理解它是什么以及它的用途。当你得到神经网络的结果时，你会得到一组权重。我们如何利用这些最终权重呢？这就是\
  \ `softmax` 起作用的地方。基本上，它将你神经网络的每个最终输出转换为概率。所以如果你尝试对你的网络进行分类，例如给定几种分类类型，你只需选择概率最高的类别即可。`softmax`\
  \ 只是我们在神经网络最后应用的一种东西，用于将最终输出转换为实际的分类。\n\n# 人工神经网络 ![](img/image1846.jpg)\n\n让我们深入人工神经网络以及它们在高层层面上是如何工作的。稍后我们实际上会亲自动手创建一些，但首先我们需要理解它们是如何工作的以及它们从何而来![](img/image1851.jpg)\
  \ 它是非常不起的东西。整个人工智能领域都基于对我们大脑如何工作的理解。在数百万年的进化中，大自然出了一种让我们思考的方法——如果我们只要逆向工程我们大脑的工作方式，就能获得关于制造思考机器的见解。在你的脑中，特别是在发生所有思考的大皮层内，你有一组神经元。这些是单个神经细胞，它们通过轴突和树突相互连接。你可以将这些视为连接——如果可以的话——将不同的轴突连接在一起。现在，当足够的输入信号被激活时，单个神经元会向它连接的所有神经元发射或发送信号。在单个神经元层面，这是一个非常简单的机制：你只有一个有很多输入信号进入的神经元，如果足够信号达到某个阈值，它就会向同样连接的神经元发射一组信号。\n\
  \n但当你开始让许多许多许多神经元以许多不同的方式连接在一起，每个连接之间有不同的强度时，事情就会变得非常复杂。这是“涌现行为”的完美例子——你有一个非常简单的概念，一个非常简单的模型，但当你把足够多的堆在一起时，你就可以创建出产生学习行为的复杂行为。这确实有效。它不仅在你的脑中有效，在我们的计算机中同样有效。现在想一下你大脑的规模。你有数十亿个神经元，每个都有数千个连接。这才是真正创建一个人类心灵所需的。而这种规模，我们在深度学习和人工智能领域仍然只能梦想以及，但它是同样的基本概念。你只有一组神经元和一组连接，它们个体的行为都非常简单，但一旦你把足够多的它们以足够复杂的方式连接在一起，你实际上可以创建出非常复杂的思想——甚至是意识。你大脑的塑性基本上是在调节这些连接去向何以及每个连接有多强，那里就是魔法发生的地方![](img/image1859.jpg)\n\
  \n此外，如果我们深入研究你的大脑，至少知道它们是什么以及它们为什么是很重要的。总结一下，梯度下降是一种在多个步骤上最小化误差的算法；基本上我们从一组随机参数开始，测量误差，向给定方向移动这些参数，看看是产生了更多误差还是更小误差，并一直朝着最小误差的方向移动，直到我们找到曲线的实际底部。那个点就是我们拥有一组使你尝试做的任何事情的误差最小的参数。Autodiff\
  \ 只是为了加速梯度下降的一种计算技巧；它通过使用某些计算技巧更容易找到梯度下降中的梯度。所以这些就是你在谈论人工神经网络时需要的基础数学或算法术语。\n\n\n\
  \n\n\n![](img/image1877.jpg)\n然后我们开始在这个想法的基础上进行构建。1957 年，我们创建了名为`线性阈值单元`（Linear\
  \ Threshold Unit，简称`LTU`）的东西。这只是通过给这些输入分配权重来改进，所以现在不再是简单的`ON`和`OFF`开关，而是引入了每个输入上都有权重的概念。这更符合我们对生物学的理解；不同神经元之间的连接可能具有不同的强度，我们可以通过进入人工神经元的每个输入的权重来对这些强度进行建模。我们还将让输出由阶跃函数给出。因此，这在精神上与我们之前的使用方式相似，但它不是说当特定数量的输入激活时就会触发，而是现在已经不再有“激活”或“不激活”的概念了，而是有权重进入，这些权重可以是正的也可以是负的。如果这些权重的和大于零，我们就会发射信号。如果小于零，我们什么都不做。这只是对人工神经元概念的微小调整，我们引入了权重，而不是简单的二进制`ON`和`OFF`开关。\n\
  \n![](img/image1882.jpg)\n### 感感知器 (Perceptron)\n让我们更进一步，创建一个名为`感知器`（perceptron）的东西。一个`感知器`只是由多个线性阈值单元组成的层。现在，我们开始触及实际上可以学习的东西了！通过强化产生我们想要的行为的这些`LTU`之间的权重，我们可以创建一个随时间推移而学习如何产生所需输出的系统。这同时也更符合我们对大脑工作原理日益增长的理解。在神经科学领域，有一种说法是“一起放电的细胞会连接在一起（cells\
  \ that fire together wire together）”，这正描述了我们人工`感知器`中发生的学习机制，即我们有引导我们所需结果的权重。我们可以将这些权重看作神经元之间连接的强度，随着时间的推移强化这些权重，并奖励产生我们想要的行为的连接。\n\
  \n你在这里看到我们的输入进入权重的方式，就像我们之前在`LTU`中做的那样，但现在我们将多个`LTU`分组在一个层中。这里的每一个输入都连接到该层中的每一个单独神经元。然后我们对每一个输入应用阶跃函数，这将产生一组最终输出，用于分类某些东西，例如这个`感知器`正在看的是哪种图像。我们在这里引入的另一个东西是右边的`偏置神经元`（Bias\
  \ Neuron）。它是为了让数学计算能够成立；有时我们需要添加一个小小的固定常数值，让神经元在正确的值上触发，而且这个偏置量在感知器训练时也可以被学习。\n\n\
  所以，这就是`感知器`。我们将人工神经网络移动到线性阈值单元，现在我们又将多个线性阈值单元组合在一个层中，以创建一个`感知器`。我们现在拥有了一个实际上可以学习的系统，当你优化每层中神经元之间的所有权重时，你可以看到此时已经有很多这样的权重可以捕捉相当复杂的信息。\n\
  \n![](img/image1891.jpg)\n\n### 深度学习与复杂性\n如果你让每一个输入都进入你所在层中的每一个`LTU`，它们就会迅速累加，这就是深度学习的复杂性所在。让我们再进一步一步，建立多层`感知器`。所以现在我们不再是单层`LTU`组成的单层`感知器`，而是多个。我们实际上在中间有一个隐藏层。你可以看到我们的输入进入底部的的一层，输出在顶部分层，在中间我们有一个由额外的`LTU`（线性阈值单元）组成的隐藏层，它们可以执行我们所说的深度学习。现在训练这些东西面临着挑战，因为它们更复杂，但我们稍后会讨论这一点。这里真正值得欣赏的是，尽管我们只有你可以在那里看到的少数几个人工神经元，但你可以看到它们之间有非常多的连接，这就是多层`感知器`的工作原理。单个线性阈值单元是一个相当简单的概念，但当你把它们在多个层中组合在一起时，你可以获得非常复杂的行为。\n\
  \n![](img/image1897.jpg)\n\n### 激活函数与训练\n最后，我们将讨论现代深度神经网络。实际上这就是全部了——这一节的其余部分将只是讨论实现此类东西的方法。我们在这里所做的只是将阶跃函数替换为更好的东西。我们将讨论替代的激活函数；其中一个是`ReLU`，我们将更深入地研究它。关键点是，阶跃函数有很多糟糕的属性，特别是当你试图计算它们的导数时，所以其他函数效果更好，并让你更快地收敛。我们还会在输出上应用`softmax`，这是我们在上一节课中讨论过的。这只是将我们神经网络的最终输出转换为概率的方法，从中选择概率最高的一个。\n\
  \n我们还将使用`梯度下降`或其变体来训练这个神经网络。也许我们会使用`autodiff`（这也是我们之前讨论过的）来实际上让训练变得更高效。在过去的五分钟左右，我们已经向你介绍了神经网络和深度学习的整个历史。它并不复杂！这正是它的美之处。这是一种涌现行为，你拥有非常简单的构建块，但当你以有趣的方式将这些构建块组合在一起时，就会发生非常复杂、有时甚至是神秘的事情。让我们进一步了解它的工作原理。\n\
  \n![](img/image1904.jpg)\n\n### 使用 TensorFlow Playground\n现在我们理解了人工神经网络和深度学习的概念，让我们玩玩它吧！这出奇地简单。`TensorFlow`背后的人们创建了一个名为`playground.tensorflow.org`的漂亮网站，它让我们实验创建自己的神经网络，而不需要编写代码来完成。它是获取深度学习如何工作的实践感受的好方法，让我们深入吧。前往`playground.tensorflow.org`并让它加载。我绝对鼓励你自己去玩玩，获得深度学习如何工作的实践感受；这是一个非常强大的工具，如果你能理解这个页面。我们在这里尝试做的是根据位置对一组点进行分类，这就是我们的训练数据集。我们有一组点，中间的分类为蓝色，外围的分类为橙色。我们的目标是创建一个神经网络，能够判断给定的点应该是蓝色还是橙色。由于我们预先知道了每个点的正确分类，我们将使用这些信息来训练我们的神经网络。现在这里我们有神经网络的图表，我们可以玩玩它。我们可以添加层，删除层——取决于你想做什么。首先，我们选择我们想要的数据集，它是圆形（circle）。输入仅仅是`X`和`Y`坐标（水平位置和垂直位置）。然后是两个神经元的层，最终会产生一个二进制输出。我认为它快了。在这里。所以从技术上讲，它仍然在自我完善，但它确实这样做，对吧？这就是我们在某种程度上说的“过拟合”。显然它有这些穿过的触角，那并不是我们寻找的模式的一部分。但它仍在继续。那些触角变得越来越弱。它仍然没有足够的神经元来精确执行这件事。\n\
  \n处理过拟合的方法有一种一种叫做`早停`（early stopping），所以一旦你看到性能开始下降，那可能是自然在告诉你可能该停止学习了。在训练期间还可以向代价函数中添加`正则化项`（regularization\
  \ terms），它们就像我们之前讨论的偏置项。那也有帮助。一种出奇地有效的技术叫做`丢弃`（dropout）。这是一个非常简单但非常有效的想法例子。这个想法仅仅是在每个训练步骤中随机忽略例如一半的神经元。假装它们完全不存在。这种方法有效是因为它强制你的模型分散其学习。如果你在每个训练步骤中拿走一半的大脑，你就会迫使剩下的一半神经元尽可能多工作。这防止了单个神经元承担比它们应该承担的工作。你甚至看到了我们在\
  \ TensorFlow Playground 中运行的一些示例。\n\n我们还将使用`梯度下降`或类似的机制来训练这个神经网络。我们将继续喂给它数据，如果我们这样做足够次数，它应该收敛到一个能够可靠分类东西的神经网络。注意这一点。你可以再次看到这种涌现行为。线性阈值单元是一个很简单的概念，但当你把它们在多个层中组合在一起时，你可以获得非常复杂的行为，因为有很多可能性。\n\
  \n![](img/image1897.jpg)\n\n### 激活函数\n最后，我们将讨论现代深度神经网络。实际上这就是全部了——这一节的其余部分将只是讨论实现此类东西的方法。我们在这里所做的只是将阶跃函数替换为更好的东西。我们将讨论替代的激活函数；其中一个是`ReLU`，我们将更深入地研究它。关键点是，阶跃函数有很多糟糕的属性，特别是当你试图计算它们的导数时，所以其他函数效果更好，并让你更快地收敛。我们还会在输出上应用`softmax`，这是我们在上一节课中讨论过的。这只是将我们神经网络的最终输出转换为概率的方法，从中选择概率最高的一个。我们还将使用`梯度下降`或其变体来训练这个神经网络。也许我们会使用`autodiff`（这也是我们之前讨论过的）来实际上让训练更高效。在过去的五分钟左右，我们已经向你介绍了神经网络和深度学习的整个历史。它并不复杂！这正是它的美之处。这是一种涌现行为，你拥有非常简单的构建块，但当你以有趣的方式将这些构建块组合在一起时，就会发生非常复杂、有时神秘的事情。\n\
  \n### 过拟合与正则化\n我们也谈谈过拟合。你可以看到你经常得到这样的模式，你并没有得到一个干净的解决方案。你会得到这些奇怪的尖峰，有时如果你让它运行太久，它最终会强化那些尖峰——那些过拟合的区域，你并不是在拟合你寻找的模式，你只是在正合给你的训练数据。\n\
  \n然后是两个神经元的层，最终会产生一个二进制输出。我认为它快了。在这里。所以，从技术上讲，它仍然像在自我完善，但它确实这样做了，对吧？这就是我们在某种程度上说的“过拟合”。显然它有这些穿过的触角，那并不是我们寻找的模式的一部分。但它仍在继续。那些触角正在变得越来越弱。它仍然没有足够的神经元来精确执行这件事。\n\
  \n处理过拟合的方法有一种一种叫做`早停`（early stopping），所以一旦你看到性能开始下降，那可能是自然在告诉你可能该你停止学习了。在训练期间还可以向代价函数中添加`正则化项`（regularization\
  \ terms），它们就像我们之前讨论的偏置项。那也有帮助。一种出奇地有效的技术叫做`丢弃`（dropout）。这是一个非常简单但非常有效的想法例子。这个想法仅仅是在每个训练步骤中随机忽略例如一半的神经元。假装它们完全不存在。这种方法有效是因为它强制你的模型分散其学习。如果你在每个训练步骤中拿走一半的大脑，你就会迫使剩下的一半神经元尽可能多工作。这防止了单个神经元承担比它们应该承担的工作。你甚至看到了我们在\
  \ TensorFlow Playground 中运行的一些示例。\n\n\n\n\n\n# 使用 TensorFlow\n\n如果你之前进行过任何深度学习的研究，你可能听过\
  \ `TensorFlow` 库。这是一个由 Google 团队开发的非常流行的框架，他们慷慨地将其开源并供全球免费使用。现在让我们聊聊 `TensorFlow`\
  \ 的本质，以及它如何帮助你构建人工神经网络。\n\n当我第一次遇到 `TensorFlow` 时，令我惊讶的是，它并不是专门为深度学习、甚至不是专门为神经网络量身定制的。它是\
  \ Google 开发的一个更通用的工具，恰好可以用于开发深度学习和神经网络。更广泛地说，它是一个用于执行数值操作图的架构。它不仅仅关乎神经网络；你可以拥有任何操作序列，并定义这些操作是如何组合在一起的图结构。`TensorFlow`\
  \ 实际做的工作是确定如何将这些处理分布到你 PC 上的各个 `GPU` 核心上，或者网络上的各种机器上，并确保你能以分布式的方式处理大规模计算问题。在这方面，它听起来非常像\
  \ `Apache Spark`。如果你上过我的其他课程，可能听过我谈论 `Spark`；它是一项非常激动的技术，`Spark` 也在开发自己的机器学习、AI\
  \ 和深度学习能力。因此，在某些方面，`TensorFlow` 是 `Apache Spark` 的竞争对手，但它们之间有一些讨论的关键区别。它不仅仅是将计算图分布在集群或你的\
  \ `GPU` 上，它还可以运行在几乎任何设备上。`TensorFlow` 的特殊之处之一在于，如果我需要，我甚至可以在手机上运行它；它并不限于运行在数据中心的某些集群计算机上。这很重要，因为在现实世界中，你可能希望将处理推送到终端用户的设备。以自动驾驶汽车为例，你不会希望汽车仅仅因为失去了与云端的网络连接就突然撞上墙，对吧？其实的工作原理是，你可能将实际训练好的神经网络推送到汽车本身，并在嵌入汽车内的计算机上实际执行该神经网络，因为深度学习的重头工作是训练那个网络，对吧？所以你可以离线进行这一操作，将网络的权重推送到相对较小的汽车上，然后在汽车内部完全运行该神经网络。通过在各种设备上运行\
  \ `TensorFlow`，它开启了在边缘实际进行深度学习的许多可能——在你尝试使用它的实际设备上。`Tensorflow` 的底层是用 `C++` 编写的，而\
  \ `Spark` 是用 `Scala` 编写的，最终运行在 `JVM` 之上。通过 `Tensorflow` 进入 `C++` 层，你将获得更高的效率。但同时，它拥有\
  \ `Python` 接口，所以你可以像使用其他 `Python` 库一样与它交互。这使得开发者易于编程和使用，但在底层又非常高效、快速。`TensorFlow`\
  \ 与 `Spark` 等工具的另一个关键区别是它可以在 `GPU` 上运行。`GPU` 就是你的显卡，就是你用来玩《使命召唤》或其他你玩游戏的同一张显卡。你实际上可以将工作分布到\
  \ PC 上的 `GPU` 核心上，即使在单台计算机上安装多块显卡也是非常常见的配置，并利用它在专为深度学习设计的集群上获得性能。此外，`Tensorflow`\
  \ 是免费的，并且由 Google 制造。仅仅是由 Google 制造这一事实就导致了大量的采用。虽然有与 `TensorFlow` 竞争的库，但到目前 `TensorFlow`\
  \ 仍然是最流行的。\n\n## 安装 TensorFlow\n\n安装 `TensorFlow` 非常简单。你只需要在你的 `Python` 环境中使用 `pip`\
  \ 命令进行安装，或者可以使用 `Anaconda Navigator` 通过图形界面完成所有操作。如果你想利用 `GPU` 加速，可以安装 `tensorflow-gpu`\
  \ 包。如果你在 `Windows` 上运行此内容，我在尝试让 `tensorflow-gpu` 在我的系统上运行时遇到过麻烦。你会发现这些许多技术主要是为运行在集群上的\
  \ `Linux` 系统开发的，因此如果你在 `EC2` 或专为深度学习设计的集群上运行，请尽管安装 `tensorflow-gpu`。\n\n```bash\n\
  pip install --ignore-installed --upgrade tensorflow\n```\n\n## 什么是张量 (Tensor)？\n\
  \n让我们聊聊 `TensorFlow` 的核心。什么是张量？嗯，这又是另一种为了让自己看起来很聪明而使用的花哨术语。根结底，张量只是数值数组或矩阵的雅称。它仅仅是一个结构化的数字集合。使用\
  \ `TensorFlow` 可能会有点反直觉，但它与 `Spark` 的工作方式类似。你并不会立即执行操作；相反，你构建一个你想要执行操作的图，当你准备好执行它时，你说：“好的\
  \ TensorFlow，执行这个。” `Tensorflow` 然后将去寻找最优方式，将该工作跨越你的整个 `GPU` 集合和集群中的计算机进行并行。\n\n\
  ## 最简单的 TensorFlow 应用\n\n让我们来看看这个 `Python` 中最简单的 `TensorFlow` 应用。这段代码所做的只是计算 1 加\
  \ 2。但它是对底层发生了什么一个很好的插例。我们首先导入 `TensorFlow` 库，并将其简写为 `tf`。\n\n```python\nimport tensorflow\
  \ as tf\n\na = tf.variable(1, name=\"a\")\nb = tf.variable(2, name=\"b\")\nf = a\
  \ + b\n\ninit = tf.global_variables_initializer()\ns = tf.Session()\ns.run(init)\n\
  print(f.eval())\n```\n\n我们首先从 `a = tf.variable(1, name=\"a\")` 开始，它所做的是在 `TensorFlow`\
  \ 中设置一个变量，一个包含单个值 1 的变量对象，如果你使用类似的视觉化工具，这个名称将显示出来。在内部，我们将它赋值给 `Python` 中一个名为 `a`\
  \ 的变量。然后我们也设置一个变量 `b`，将其赋值为 2，并命名为 `b`。这就是魔法发生的地方。我们说 `f = a + b`。\n\n## 扩展到神经网络\n\
  \n那么，我们如何将这个想法扩展到神经网络呢？嗯，`TensorFlow` 的特点在于它并不是真正专门为神经网络设计的，但它可以执行矩阵乘法等操作。如果你考虑在单层神经网络中应用所有的权重和和，你可以仅将其建模为矩阵乘法。你可以获取前一个一层的输出，并与描述每个神经元之间权重的矩阵进行矩阵乘法。然后你还可以添加包含偏置项的向量。通过使用\
  \ `TensorFlow` 这种底层的方法，但高层的 API 使定义神经网络变得更加简单直观。\n\n## MNIST 分类\n\n为了让我们能够创建一个端到端的完整神经网络，不仅仅是计算神经元层之间的权重。我们首先需要的是加载包含我们想要训练的特征和目标标签的训练数据。要训练神经网络，你需要一组已输入和一组正确答案。我们将像之前一样构建一个图，就像我们之前有\
  \ `a` 和 `b` 变量一样。让我们引入一个新概念 `placeholder`（占位符）。它在图中为我们提供了一个各种数据的 `placeholder`，允许我们在训练和测试中使用同一个占位符。完成后，我们可以使用不同的数据集并将其馈给这些\
  \ `placeholders`，并在从未见过的数据上实际测试训练网络的结果。我们将像之前看到的那样使用变量来跟踪每个连接的学习权重，并在我们的神经网络上迭代不同的训练步骤。之后，我们需要为网络关联某些优化器。`TensorFlow`\
  \ 让这变得非常容易。它可以是梯度下降或其变体，例如 `Adam`。然后我们将使用训练数据运行优化器，同样，`TensorFlow` 让这变得非常容易。最后，我们将使用测试数据集评估训练网络的结果。\n\
  \n从高层次总结一下：我们将创建一个网络，使用梯度下降拟合训练数据，以收敛到网络中每个神经元之间的最优权重。完成后，我们可以使用从未见过的测试数据集评估该网络的性能，看看它是否能正确分类那些未训练过的数据。\n\
  \n另一个陷阱是：当你使用神经网络时，确保你的输入数据经过归一化的非常重要，这意味着它们都被缩放到相同的范围。通常情况下，你希望确保你的输入数据均值为 0 且方差为单位。这是各种激活函数在数学上正常运行的最佳方法。真正重要的是你的输入特征在量级上是可比的，否则很难以有意义的方式组合这些权重。你的输入都在神经网络底部的相同水平，在拟合该底层时，它们在量级上是可以比的很重要。例如，如果我已经创建一个根据年龄和收入对人们进行分类的神经网络，年龄范围可能是\
  \ 0 到 100，但收入范围可能是 0 到一百万。这些范围差异巨大，这会导致问题。幸运的是，Python 的 `scikit_learn` 库有 `StandardScaler`\
  \ 包，你可以使用它来自动完成缩放到正确范围的操作。\n\n\n\n\n\n![](img/image2134.jpg)\n\n另一种类型的分类问题是二分类。也许你正在尝试判断一个人的照片是男性还是女性。也许你正在尝试判断某人的政党是民主党还是共和党。如果你面对的是一种“非此即彼”的问题，那就是我们所说的二分类问题。你可以看到这里，他们的建议是在末尾使用\
  \ `sigmoid` 激活函数，而不是 `softmax`。如果你只是想在 0 和 1 之间进行选择，你并不需要 `softmax` 的复杂性。`Sigmoid`\
  \ 是二分类情况的首选激活函数。他们还推荐了 `RMSprop` 优化器。在这种情况下，损失函数将特别是 `binary crossentropy`（二分类交叉熵）。所以，这些是二分类与多分类相比的几个特殊之处。\n\
  \n![](img/image2139.jpg)\n\n最后，我想再多聊一下如何将 `Keras` 与 `scikit-learn` 使用。这让交叉验证等操作变得简单得多。这里有一段这样的代码示例。这个小函数创建了一个可以与\
  \ `scikit-learn` 使用的模型。这个 `create_model` 函数创建了我们的实际神经网络。我们使用的是一个 `sequential model`（序列模型），放入了一个具有四个输入和六个神经元的\
  \ `dense`（密集）层。这连接到另一个具有四个神经元的层。最后，它在末尾将是一个二分类器，带有一个 `sigmoid` 激活函数。所以我们又有一个设置二分类神经网络的小例子。我们我们可以在那里使用\
  \ `Keras classifier` 函数设置一个估计器，这允许我们获取一个与 `scikit-learn` 兼容的估计器。所以你可以看到最后，我们实际上是将该估计器传递到\
  \ `scikit-learn` 的 `cross_val_score` 函数中，这将允许 `scikit-learn` 运行你的神经网络，就像运行 `scikit-learn`\
  \ 内的任何其他机器学习模型一样。这意味着 `cross_val_score` 可以自动使用 `k-fold cross-validation`（k 折交叉验证）训练你的模型，然后评估其结果，并为你提供关于其准确性以及对未见数据进行正确预测分类能力的非常有意义的结果。\n\
  \n![](img/image2146.jpg)\n\n掌握了这些代码片段，让我们尝试一个更有趣的例子。让我们最后跳出 `MNIST` 样本。我们将尝试使用 `Keras`\
  \ 库，仅根据议员在国会的投票情况来预测他们的政党。所以让我们试一下吧，再玩玩 `Keras`。确保你处于 Anaconda 导航器中的 `RecSys` 环境中，我们首先需要向我们的\
  \ `RecSys` 环境添加“Pandas”包。选择“Not Installed（未安装）”，搜索 `Pandas`，选择它并点击应用进行安装。我们还需要安装\
  \ `scikit_learn` 包，所以也按照相同的程序安装它。然后打开你的 `J notebook`，从课程材料中的 `DeepLearningIntro`\
  \ 文件夹中上传 `PoliticsExercise.ipynb` 文件。一旦导入，在列表中找到它并点击打开。我们需要的众议院投票数据文件也包含在课程材料中。\n\
  \n这个例子实际上是我想让你自己尝试的练习。我会帮助你加载并清理这些数据，但之后，我将实际实现神经网络的工作留给你。所以总结一下，我们将加载一些关于一群政治家和各种投票的数据。我们将看看是否能根据他们在\
  \ 17 个不同问题上的投票情况，预测某个政治家是共和党人还是民主党人。这是 1984 年的旧数据，所以你绝对需要记住这些问题是什么。如果你来自美国境外，这里给你简要介绍一下，美国政治中有两个主要政党：倾向于保守的共和党和倾向于进步的民主党。他们的立场多年来一直在变化，这就是现状。\n\
  \n所以让我们加载样本数据。我们将使用我们环境中的 `Pandas` 库来加载这些 `CSV` 文件。它们只是逗号分隔的值。我们将对数据进行一些清理，并将其转换为\
  \ `Keras` 可以接受的格式。如果你是 `Pandas` 的新手并想了解一下它，你会在课程材料中找到 `PandasTutorial.ipynb`。让我们从导入\
  \ `pandas` 库开始；我们将其简称为 `pd`。我们需要告诉笔记本数据存储在哪里，所以你需要更改这一行以指向你课程材料中的 `DeepLearningIntro`\
  \ 文件夹。我已经构建了这些列名，因为它们在这个 `CSV` 文件的表头：政党（共和党或民主党），以及他们在每个问题上的投票情况。所以我们将使用 `pandas`\
  \ 的 `read_csv` 函数读取该 `CSV` 文件。我们将任何缺失值填充为 `NaN`，并使用 `head()` 显示结果数据框。直接按回车键获取它，你应该看到我们数据框的前五行。对于数据开头的五位议员，我们可以看到每个人所属的政党、我们要尝试预测的已知标签以及他们在每个问题上的投票。那些\
  \ `NaN` 值代表该议员完全没有投票。\n\n现在我们还可以对结果数据框使用 `describe()` 函数来获取数据性质的高级概述。例如，你可以看到有很多缺失数据。尽管有\
  \ 435 人有关政党，但只有 387 人实际上对每个问题进行了投票。所以我们必须以某种方式处理缺失数据。最简单的方法就是丢弃带有缺失数据的行。在现实世界中，你可能担心这样做会引入某种无意的偏差，也许共和党比民主党更倾向于不投票，反之亦然。但让我们假设，我们可以直接去掉这些缺失值。这就是这里这一行代码的作用：`dropna(inplace=True)`。这意味着我们将删除投票数据框中任何缺失数据的行。我们再次描述它，应该看到每一列的计数都是相同的，因为现在没有缺失数据了。我们将范围缩小到了\
  \ 232 位议员。这并不理想，但嘿，这就是我们必须处理的。\n\n接下来我们需要做的一件事是实际上将这些数据转换为 `Keras` 可以读取的形式。`Keras`\
  \ 不处理 Y 和 N，它处理数字。所以让我们使用 `replace` 函数将所有的 Y 和 N 替换为 1 和 0。同样，我们将把字符串 `Democrat`\
  \ 和 `Republican` 也替换为数字 `1` 和 `0`。所以这将转化为一个二分类问题。如果我们把某人分类为标签 `1`，将表示他们是民主党；而标签\
  \ `0` 将表示他们是共和党。所以让我们运行它来清理这些数据。现在如果我们再次对该数据框运行 `head()`，应该能看到一切都转换成了 0 到 1 之间的数值数据，这正是我们神经网络输入所需要的。\n\
  \n好了，最后，让我们将这些数据提取到可以实际提供给 `Keras` 的 `numpy` 数组中。为了这一点，我们只需对关心的列调用 `values`。我们将所有的特征列提取到\
  \ `all_features` 数组中，并将所有实际标签（实际政党）提取到 `all_classes` 数组中。让我们按回车键获取它。到这里，我将暂时交给你。你进行二分类所需的代码片段实际上在进入此笔记本之前的幻灯片中已经涵盖了，只需参考那里即可获得你需要的内容。\n\
  \n### 卷积神经网络\n\n到为止，我们已经看到了仅用一个简单的多层感知器就能解决各种问题的威力。但你可以更上一层楼——你可以将更复杂的神经网络组合在一起，并用它们处理更复杂的问题。让我们先谈谈卷积神经网络，简称\
  \ `CNNs`。\n\n通常你会在图像分析的背景下听到 `CNNs`。它们的整个意义是在你的数据中寻找可能并不正处于你预期位置的东西。技术上，我们称这为“特征位置不变性”（feature\
  \ location invariant）”，这意味着如果你在数据中寻找某些模式或某些特征，但你不知道它具体可能在数据的哪个位置，`CNN` 可以扫描你的数据并找到这些模式。例如，在\
  \ във图中，`CNN` 能够找到无论在任何地方的东西。现在，它不仅限于图像分析，还可以用于任何类型的问题，即使你不知道特征在数据中的具体位置。自然语言处理也想到了这些：翻译、文本、动词、短语或句子。\n\
  \n那么，它们是如何工作？在这里，`CNNs`（卷积神经网络）是如何工作的？它们灵感源于你视觉皮层的生物学。它们从你的视网膜中获取信息。这是另一个迷人的例子。它们工作的方式是这些神经元组服务于你视野的特定部分。我们称这些为“局部感受野”（local\
