  \n我们称这些为“局部感受野”。\n\n在卷积神经网络中，我们称这些为“过滤器”（filters）。\n\n事实上，这些局部感受野相互重叠以覆盖你的整个视觉视野，这被称为“卷积”（convolution）。它们工作的方式是这些神经元组服务于你视野的特定部分。我们称这些为“局部感受野”。它们工作的方式是这些神经元组服务于你视野的特定部分。我们称这些为“局部感受野”。它们工作的方式是这些神经元组服务于你视野的特定部分。我们称这些为“局部感受野”。\n\
  \n\n\n\n\n![](img/image2328.jpg)\n所以，这是一次对深度学习基础的相当长的插曲，但在我们讨论如何将深度学习应用于推荐系统之前，我必须让你们理解循环神经网络。事实证明，深度学习特别适合预测事件序列，例如你接下来可能要观看的视频——因此它在处理事件顺序至关重要的推荐系统中具有广泛应用价值。所以，在当前将深度学习应用于推荐系统的研究中，RNN\
  \ 充着着重要作用。不过，也有许多更简单的神经网络可以用于推荐物品，所以我们不必直接跳到最难的内容上。听我的——我们现在要回到推荐系统，以及如何将你刚刚学到的深度学习知识应用于它们中。如果你确实想继续学习更多关于深度学习的知识，可以在\
  \ YouTube 上找到我剩下的深度学习免费课程——只需搜索 Sundog Education 就能找到。\n\n## 深度学习推荐方案\n![](img/image2341.jpg)\n\
  现在你已经理解了深度学习和神经网络背后的理论，让我们最终来谈谈如何将这些技术应用于推荐系统。你可以想象，随着近期人工智能的热潮，目前有许多关于将神经网络应用于推荐系统的研究。但，这些真的都是炒作吗？\n\
  \n![](img/image2351.jpg)\n让我们先明确一点————仅仅因为一项新技术很火，并不意味着它是解决每个问题的正确方案。你可以使用用户评分或购买记录来训练神经网络并用它来做推荐，但你应该这样做吗？正如我们看到的，深度学习非常擅长识别模式，其方式类似于我们大脑的方式——它擅长图像识别和预测事件序列等任务。但推荐真的是一个模式识别问题吗？回想一下我们讨论\
  \ `Tensorflow` 的时候——它本身对神经网络并不了解多少，你实际上是通过对代表人工神经元、其权重和偏置的 `tensors` 进行矩阵乘法和加法来使用它的。神经网络本质上是矩阵运算，而推荐系统已经有了成熟的矩阵分解技术，这些技术在原理上做着类似的事情。例如在\
  \ `SVD` 中，我们找到并利用随机梯度下降学习到的权重进行相乘的矩阵。这几乎是一回事，只是思考方式不同。所以是的，你可以将推荐系统看作寻找模式——只是基于他人行为的非常复杂的模式。因此，矩阵分解可以被建模为神经网络。我认为尝试将神经网络应用于推荐系统的主要原因在于，它让我们能够利用\
  \ AI 和深度学习领域的所有快速进展。例如，亚马逊开源了一个名为“Destiny”的系统（即 `DSSTNE`），它允许你在集群上高效地运行处理稀疏数据的巨型神经网络。他们声称在内部的推荐系统中使用了该系统。还有方法可以在集群上使用\
  \ `Tensorflow` 并利用整个 GPU 队列。此外，关于神经网络新拓扑的研究一直存在，这可以为如何利用它们做出更好的推荐提供新见解。在某些情况下，使用神经网络的方法已经显示出优于\
  \ `SVD`，即使优势很小。所以，让我们深入探讨一些将神经网络应用于推荐问题的方法。\n\n\n\n\n\n# 受限玻尔兹曼机\n\n推荐系统中，神经网络的鼻祖是受限玻尔兹曼机，简称为\
  \ `RBM`。它自 2007 年起就被使用了，远在 AI 大复兴之前——但它现在仍然是一篇被频繁引用的论文和仍在使用的技术。回溯 Netflix 挑战赛，Netflix\
  \ 学到的主要的一点是，矩阵分解和 `RBM` 在 `RMSE` 的衡量下表现最佳，两者的得分几乎相同。同样，这并不会让我们太惊讶，因为我们知道可以将矩阵分解建模为神经网络。但他们发现，通过将矩阵分解与\
  \ `RBM` 结合，两者协同工作提供了更好的结果——他们的 `RMSE` 从 8.9 降到了 8.8。几年前，Netflix 证实他们仍在投入产的推荐系统中使用\
  \ `RBM` 作为其一部分。让我们来学习它是如何工作的。\n\n## 核心概念\n\n首先，如果你打算认真使用 `RBM` 进行推荐，我建议你找出这篇论文，以便在你理解了通用概念后对其进行研究。它源自多伦多大学的一个团队，发表于\
  \ 2007 年的第 24 届国际机器学习会议论文。如果你直接在 Google 上搜索论文标题：“Restricted Boltzmann Machines for\
  \ Collaborative Filtering”，你应该能在多伦多大学网站的作者页面找到免费的 PDF 副本，我认为那里对你来说是合法免费的。\n\n`RBM`\
  \ 是最简单的神经网络之一——它只有两层：一个可见层和一个隐藏层。我们通过在前向传播过程中将训练数据输入到可见层来训练它，并在反向传播期间训练它们之间的权重和偏置。使用如\
  \ `ReLU` 等激活函数来产生每个隐藏神经元的输出。为什么它们被称为受限玻尔兹曼机呢？嗯，它们之所以被称为“受限”，是因为同一层内的神经元之间不能直接通信；只有两个不同层之间存在连接。这正是如今现代神经网络的常态，但在\
  \ AI 尚处于领域蹒摸阶段时期，早期的玻尔兹曼机中并没有这种限制。\n\n而且 `RBM` 并不是由一个叫玻尔兹曼（Boltzmann）的人发明的；这个名字指的是他们采样函数使用的玻尔兹曼分布函数。`RBM`\
  \ 实际上归功于杰弗里·辛顿（Geoffrey Hinton），他当时是卡内基梅隆大学的教授；这个想法实际上可以追溯到 1985 年。因此，`RBM` 的训练通过执行前向传播（我们刚刚描述过的）然后是反向传播（重构输入）来完成。我们在许多“轮次”（epochs）中迭代此操作，就像训练深度神经网络一样，直到收敛到一组误差最小的权重和偏置。\n\
  \n## 反向传播\n\n在反向传播期间，我们试图通过将前向传播的输出传回隐藏层来重构原始输入，并查看可见层最终得到的值。由于这些权重最初是随机的，我们开始的输入与重构的输入之间存在巨大差异。在这个过程中，我们得到了另一组偏置项，这次是在可见层上。因此，我们在前向和反向传播之间共享权重，但我们有两组偏置——在前向传播中使用的隐藏偏置和在反向传播中使用的可见偏置。然后我们可以测量得到的误差，并利用这些信息在下一次迭代中微调权重，试图最小化该误差。\n\
  \n从概念上讲，你可以看到它与我们在更现代术语中所谓的线性阈值单元没有太大区别。你也可以构建类似于现代深度学习架构的多层 `RBM`。主要区别在于，我们在反向传播期间读取的是较低层\
  \ `RBM` 的输出，而不是像现代神经网络那样处理输出。因此，当你有一个完整的训练数据集时，这种方法效果良好；例如，将 `RBM` 应用于 MNIST 手写识别问题时也是如此。\n\
  \n## 适配推荐系统\n\n当你将 `RBM` 或通用的神经网络应用于推荐系统时，情况会变得奇怪。问题在于，我们拥有的是稀疏数据——在大多数情况下，你的输入节点没有数据。该如何训练神经网络呢？\n\
  \n为了给定的 5 星评分数据适配一个 `RBM` 用于推荐系统，需要一些我们刚刚描述的通用架构。通常的想法是将训练数据中的每个用户作为 `RBM` 的输入来训练它。因此，我们在训练期间按批次（batch）处理每个用户，查看他们评分过的电影。我们的可见节点代表了每个用户对每部电影的评分，我们尝试重构那些未知的用户/电影对。\n\
  \n首先，我们的可见单元并不是简单地接收单个输入。评分实际上是类别数据，所以我们实际上想要将每个可能的评分视为节点。例如，我们在训练数据中的第一个评分是 5 星；它会被表示为一个值为\
  \ 0 的节点，另一个值为 1。\n\n## 实现细节\n\n让我们看看一些在 MovieLens 数据上实现 `RBM` 的代码。我们使用 `RBM.py`\
  \ 文件。这实现了受限玻尔兹曼机本身，带有适用于推荐系统的特定技巧。它使用 `Tensorflow` 来利用 GPU 加速。这看起来可能有点复杂，但我们在这里基本上构建一个可以跟踪数百人并猜测他们可能喜欢的电影的模型。这超过了人类的能力。\n\
  \n我们的 `init` 函数接受几个不同的参数——即超参数——它们控制着 `RBM` 的学习：\n- `visible_dimensions`：电影数量与不同评分值的乘积。\n\
  - `epochs`：在前向和反向传播中进行的迭代次数。\n- `hidden_dimensions`：系统中的隐藏神经元数量。\n- `distinct_rating_values`：10（用于评分值）。\n\
  - `learning_rate`：我们尝试收敛的速度。\n- `batch_size`：训练时一次处理多少用户。\n\n`Train` 函数是我们想要创建一个带有权重和偏置的\
  \ `RBM` 时调用的。它接收一个名为 `X` 的二维数组。`MakeGraph` 函数设置了模型。然后我们创建一个 `Tensorflow` 会话来运行 `RBM`，遍历每个\
  \ `epoch`。\n\n`GetRecommendations` 是我们使用已经训练好的 `RBM` 获取给定用户预测的方法。\n\n## 吉尔布采样与对比散度\n\
  \n梯度下降需要一个高效的期望函数进行优化，称为 `contrastive divergence`。基本思想是在训练期间使用称为 `Gibbs sampler`\
  \ 的东西采样概率分布。\n\n在前向传播（第 66 行），`hProb0` 是一个新张量，表示前向传播结束时隐藏节点的值。我们将 `X` 中的可见节点乘以权重，加上\
  \ `hidden_bias`，并应用 `sigmoid` 激活函数。\n\n对于吉尔布采样（第 68 行），我们有一个新张量 `hSample`，它对减去了一个随机值的隐藏概率应用了\
  \ `ReLU` 激活函数。这选择了隐藏节点完整集合的随机样本。\n\n在反向传播（第 74 行），张量 `v` 接收我们来自前向传播的采样输出（位于 `hSample`\
  \ 张量中），乘以权重并加上 `visible_bias`。\n\n## 调优与结果\n\n为了处理稀疏数据，我们创建一个 `mask`。我们使用具有 3 维的\
  \ `vMask3D`：每个用户一个，每个电影一个，评分是否存在一个。我们在第 79 行使用 `reduce_max` 寻找最大值。在第 82 行，我们将重构的可见层乘以\
  \ `mask`。在第 84 行，我们将评分展回到 `RBM` 期望的格式。然后我们对结果应用 `softmax` 以得到 `vProb`。\n\n在第 86\
  \ 行，我们根据重构的数据计算一组新的隐藏偏置。在第 91 行，我们更新权重。在第 93 行，我们更新隐藏偏置。在第 95 行，我们更新可见偏置。我们将所有这些都放在\
  \ `self.update` 中。\n\n## RBMAlgorithm 封装\n\n`RBMAlgorithm.py` 文件是 `RBM` 模块的封装。`initializer`\
  \ 接受相同的超参数。我们有一个名为 `softmax` 的实用函数，可以将原始结果转换为和为 1 的值。\n\n`fit` 函数（第 38 行）创建 `predictedRatings`\
  \ 数组。它使用 `reshape` 将数据组织成 2D 数组。在第 41 行，我们遍历每个用户。在第 45 行，我们填充 `predictedRatings`\
  \ 数组。`estimate` 函数（第 48 行）查找由 `fit` 函数计算的预测评分。\n\n## 代码练习\n\n挑战在于看你是否拥有 `RBM` 的正确拓扑结构和参数。隐藏节点数量、`learning_rate`、`batch_size`\
  \ 和 `epochs` 取决于训练数据的量和性质。使用 `surpriselib.GridSearchCV` 选择几个超参数。我建议从默认值开始并倍增。如果倍增提高了准确性，尝试中间值；如果变差了，尝试减半该值。\n\
  \n\n\n\n\n# 用于推荐的深度神经网络\n\n我们之前提到过受限玻尔兹曼机是一种非常早期的神经网络，从那以后，深度学习领域已经发生了巨大的变化。如果我们把更现代的神经网络应用于这个问题，会发生什么呢？嗯，正如我们将看到的，这是可行的，但并非没有挑战。\n\
  \n## 自动编码器 (Autoencoders)\n\n人们从 2015 年开始在推荐系统中使用更深层的神经网络。来自澳大利亚国立大学的一个小组发表了一篇名为《AutoRec:\
  \ 自动编码器遇上协同过滤》的论文，他们使用的拓扑结构与我们在深度学习介绍中涵盖的网络类型要熟悉得多。你有三层：底部是一个包含单个评分的输入层，一个隐藏层，以及一个给出预测结果的输出层。在该网络的每个实例中，层与层之间都维护着权重矩阵，隐藏层和输出层都有一个偏置节点。\n\
  \n在论文中，他们为每个项目训练一次网络，在输入层中输入每个用户对该项目的评分。输出端使用了 sigmoid 激活函数。总而言之，这是一个非常直接的方法——而且他们报告的结果比使用\
  \ RBM 稍微好一点。但实现方式上略有不同——RBM 在每次通过时只有独立的偏置项，而这里我们还有一整套完全独立的权重可以使用。这种架构的优点是，在 `Tensorflow`\
  \ 或 `Keras` 等现代框架中实现要容易得多。\n\n但仍然存在一个问题——我们处理的数据的稀疏性。在论文中，他们简要提到“我们只考虑观测到的评分的贡献”。因此，他们小心地单独处理通过该神经网络的每条路径，仅传播训练数据中实际存在的评分信息，并忽略了对应于未评分的用户/项目对的缺失数据的输入节点的贡献。这在\
  \ `Tensorflow` 中仍然是一件困难的事；虽然 `Tensorflow` 有“稀疏张量”，但没有简单的方法可以将实现神经网络所需的矩阵乘法和加法链限制在仅具有实际数据的输入节点上。你发现的任何使用\
  \ `Tensorflow` 或 `Keras` 的实现都忽略了这个问题，并将缺失的评分视为零。只要足够努力，你仍然可以获得不错的结果，但这是将深度学习应用于推荐系统时一个非常基础的问题。\n\
  \n这种架构被称为“自动编码器”。在输入层和隐藏层之间构建权重和偏置的行为被称为对输入进行编码——我们正在将输入中的模式作为一组权重编码到该隐藏层中。然后，当我们通过隐藏层和输出层之间的权重重构输出时，我们正在对其进行解码。所以，第一组权重是编码阶段，第二组是解码阶段。从概念上讲，这与我们之前对\
  \ RBM 所的操作并没有什么不同——在 RBM 中，我们在正向传播时编码，在反向传播时解码。\n\n然而，这个问题并没有阻止人们进行尝试。我见过使用几次的想法包括使用具有更多隐藏层的更深神经网络，以及将用户和项目数据一起进行独热编码（one-hot-encoding）到单个输入层。这就是你在从\
  \ `Keras` 输出的这种架构中看到的；项目在左侧嵌入，用户在右侧。两者都被扁平化，并应用了丢弃层（dropout layer）以防止过拟合，然后在将它们全部输入深度神经网络之前将它们拼接在一起。但它仍然存在无法区分缺失评分和分值为\
  \ 0 的评分的问题。从根本上说，它将缺失评分建模为用户真的、非常讨厌给定项目的信号，这并不是对现实的准确表示。最终，这个特定网络在 ml-100k 数据集上无法优于矩阵分解。部分原因是因为数据的稀疏性，另一个原因也是因为\
  \ 100,000 条评分不足以训练如此复杂的网络。当我们在课程后面讨论在云端扩展内容时，我们会谈到名为 `DSSTNE`（或简称 \"Destiny”）的系统，它们实际上解决了处理缺失评分的问题，而且结果非常好。所以，现在不要对深度神经网络放弃希望——一旦有了正确的工具，它们实际上可以运行得很好。但是，在\
  \ `Tensorflow` 中实现自动编码器并不困难，它只是将缺失评分视为零值，所以让我们试一下，看看效果如何。\n\n## 编码活动\n\n所以让我们回到\
  \ Spyder，如果你还打开着 `DeepLearning` 文件夹的内容，你应该能找到 `AutoRec.py` 文件。和我们的 RBM 示例一样，我们使用\
  \ `Tensorflow` 的自动编码器实现结构非常相似。提醒一下，自动编码器只是一个具有输入层、隐藏层和输出层的神经网络。学习输入层和隐藏层之间的权重被称为编码，而使用隐藏层和输出层之间的权重重构预测被称为解码。但从根本上说，它只是一个有一个隐藏层的神经网络。跳到\
  \ `MakeGraph` 函数，因为那里与 RBM 示例有本质不同。这并不复杂。你可以看到我们在编码和解码处随机初始化这些权重。我们还为两个层设置了偏置。这与原始“autorec”论文提出的有点不同——他们只有一个跨整个层的偏置节点，而我们为每个节点学习偏置，这更符合现代做法。接下来，我们设置层本身。我们的输入层接收每个给定用户的评分。我们通过输入层乘以编码权重并加上偏置来构建隐藏层，然后对它们应用\
  \ sigmoid 激活函数。我们的输出层应用学习到的解码权重和偏置，并对最终结果应用 sigmoid 激活函数——这构成了每个给定用户的实际预测评分。为了衡量误差，我们需要将这些预测评分与实际评分进行比较，我们在原始输入层中这样做，所以在这里使用损失函数。我们定义预测评分和实际评分之间的\
  \ `MSE` 损失函数，并使用 `RMS` 优化器来最小化该误差。如果你想调优，可以尝试使用更现代的优化函数如 `Adam`。这基本上就是这里要说的；`Train`\
  \ 函数以我们之前的方式启动了它。\n\n让我们注意力转向 `AutoRec` 文件。这里有几点与 RBM 示例不同的值得讨论。首先，我们没有将此建模为分类问题（将\
  \ 0 到 5 之间的每个评分值视为不同的输入和输出节点）。相反，我们在这里第 31 行将输入归一化到 0-1 的范围，然后在第 45 行恢复到原始范围。这样我们不需要处理\
  \ `softmax` 之类的。因此，我们在第 35 行传递给 `Train` 的输入矩阵只是用户和项目之间的二维数组。顺便说，这与原始 autorec 论文不同——他们反转了内容，所以针对项目而不是用户训练网络，而我们输入每个用户对给定项目的所有评分。再次，如果你想调优，可以尝试另一种方法，看看是否获得更好的结果。让我们启动它并看看效果如何。打开这里的\
  \ `AutoRec` 文件——它的功能没什么好说的，它只是使用我们的框架将 `AutoRec` 与随机进行比较，就像我们之前做的那样。点击播放，它需要几分钟时间来完成所有工作，因为我们将其设置为生成一些\
  \ `top-N` 推荐。\n\n现在完成了，让我们看看结果。滚动到指标表格。结果……嗯，非常令人失望。`RMSE` 和 `MAE` 都比随机差。尽管我们已经看到高估评分可以产生这种影响而不影响\
  \ `top-N` 推荐的质量，所以现在不必恐慌。但命中率也更差。平均倒数命中率稍微高一点，所以结果似乎不值得这些精力。多样性和新颖性与随机相当——而且我们的“随机”推荐实际上在使用正态分布来稍微倾向热门物品，所以至少我们没有向用户推荐完全随机的东西。\n\
  \n让我们定性地观察结果，看看用户 85 的 `top-N` 推荐。这些推荐对我来说并不糟糕，但考虑到我们对这个用户的了解，它们确实并不令人振奋。唯一似乎与这个用户相关的结果是兴趣。那么，哪里出问题了？我自己花了很多时间研究这个问题。如果你开始调查实际生成的预测，你会发现大多数都非常接近零。这告诉我我们矩阵中代表缺失评分的零真的搞了事情。我们没有足够的实际评分来防止神经网络学习到对于大多数物品，最佳预测是零。\n\
  \n## 使用 RNN 进行基于会话的推荐\n\n如果你记得我们的深度学习介绍，循环神经网络或 `RNNs` 擅长在序列中发现模式，并预测接下来发生什么。嗯，有些推荐问题可以从这些角度考虑。我们称之为会话式推荐。让我们给你几个例子。假设你在亚马逊或类似的网站购物。如果你没有登录，那么对你进行推荐非常困难！我们不知道你是谁，所以我们不知道你的历史。但我们可以在使用同一个浏览器窗口跟踪你的会话。也许你决定学习克林林语，因为某些原因你认为那是项实用的技能。事实上它不是。也许你查看的第一本书是《How\
  \ to Speak》，所以这就是你会话流中的第一个项。所以在这个点，我们的推荐系统关于你所唯一知道的就是你看过《How to Speak》。但至少那是些东西。也许你不喜欢这本书的评论，或者你转向了另一本发现的书——莎士比亚的《哈姆莱特》，克林林语版（是的，这真的存在）。所以在这个点，我们可以说你的会话流由这两个物品组成——这是一个点击序列，第一次是《How\
  \ to Speak》，第二次是《克林林哈姆莱特》。如果你想在这个点做一个推荐，合理的做法是尝试预测按顺序查看了这两个物品的人接下来可能会看什么。也就是说，你想根据之前看过的物品序列做出推荐。预测序列正是\
  \ `RNNs` 擅长的，这就是为什么它们是这类问题的自然选择。也许用户最可能点击下一个是《克林林语词典》，这无疑是克林林语的权威参考。也许用户点击了它是因为我们的\
  \ RNN 推荐了它，并希望他们随后购买了该物品并继续生活。所以这个特定的会话结束了，这个会话的会话流由这三本书组成。有一个名为 RecSys Challenge\
  \ 2015 的数据集，包含了完全这样的数据，你可以尝试。\n\n\n\n\n\n![](img/image2572.jpg)基于点击流的会话推荐另一个应用是流媒体网站，例如\
  \ YouTube 或 Vimeo。同样，如果你没有登录，我们所知道的只是你观看视频序列——但我们仍然可以使用该序列来推荐你接下来应该看什么。这正是 `RNN’s`\
  \ 的用武之地。也许你正在观看 Sundog Education 超棒 YouTube 频道的视频，毕竟谁不想看呢？无论如何，你从我们频道观看的视频序列都可以被视为“点击流”的一部分，而且根据你在会话中之前看过的视频来推荐下一个观看内容的问题，与电子商务点击流问题的操作方式完全相同。\n\
  \n![](img/image2583.jpg)那篇描述如何使用 `RNN’s` 进行会话推荐的论文标题非常有创意，译为“基于循环神经网络的会话推荐”。你可能会在作者列表中注意到\
  \ Netflix，但作者实际上是在完成这项工作与发表期间在 Netflix 任职的——Netflix 实际上与此并没有太大关系，但它是一个很好的例子，说明了在推荐系统领域进行有趣的研究如何让你进入你喜爱的公司工作。如果你想深入研究，可以在互联网上找到这篇论文的合法免费副本。这篇论文是\
  \ 2016 年的，我曾考虑将其作为一个“前沿”警示主题，因为它非常新——但实际上，它只是对目前已被证明的技术的 `RNN’s` 进行了一些细微调整。深度学习领域的发展如此迅速，2016\
  \ 年的研究现在真的不能被认为是前沿，甚至不是领先边缘了。我们正处于一个令人兴奋的时代。\n\n![](img/image2594.jpg)该论文主要关注如何调整\
  \ `RNN’s` 以良好地处理会话点击流数据。如果你记得，`RNN’s` 是相当复杂的家伙——它们不是简单的神经元，而是依赖于更复杂的结构，例如 `LSTM`，或者在我们的案例中是\
  \ `GRU’s`——门控循环单元。这使得网络在每个单元内部有一个必须维护的内部隐藏状态。`GRU` 门学习何时以及更新多少每个单元内的该隐藏状态。由于论文依赖于针对推荐问题进行自定义的\
  \ `GRU’s`，其技术有时被称为 `GRU4Rec`。\n\n![](img/image2605.jpg)架构的简化视图所示——这代表了点击流中单个事件的处理。我们从刚刚被查看的物品开始，编码为\
  \ `1-of-N`，然后进入嵌入层，接着进入多个 `GRU` 层。为了节省空间，我们在这里将其表示为一个区块，但在实践中，中间可以有很多 `GRU` 层。在\
  \ `GRU` 层之后还可以有许多前馈层——这些只是不涉及复杂的 `GRU’s` 的更传统的神经网络层。最后，我们得到所有物品的评分，从这些评分中我们可以挑选出深度网络认为点击流中下一个可能被查看的物品。\n\
  \n![](img/image2616.jpg)作者针对推荐用例对 `RNN’s` 进行了其他一些改进。他们向网络输入数据的方式与你所采用的方式不同，例如，不是输入句子中的单词。基本上，他们将多个会话分组在一起，并将它们的所有第一个物品一起输入，然后是所有它们的所有第二个物品，依此类推。他们将此称为“会话并行小批次（session-parallel\
  \ mini-batches）”。他们还对输出进行了采样，因为在大多数推荐系统中都有大量物品，基于用户刚刚点击的内容，每次想要获得推荐时都查看每一个物品，在计算上是不可行的。最后，他们实验了用于训练的特定损失函数，并确定了其中两个：贝叶斯个性化排序（`Bayesian\
  \ Personalized Ranking`，简称 `BPR`）以及 `TOP1`，这是作者专门为该应用开发的新损失函数。\n\n\n\n\n\n![](img/image2629.jpg)\n\
  \n现在，我在职业生涯中反复学到的一点是，简单的解决方案往往更好。而 `GRU4Rec` 远非简单。在采用这种技术之前，我必须真正被说服它提供的结果比更简单的替代方案要好得多。还有其他基于会话数据（session\
  \ data）进行推荐的方法；这个问题在 `RNN` 出现之前很久就已经存在了。你只需要将某人会话中的物品看作是某人过去的电影评分或类似的内容，并使用基于物品的\
  \ `KNN` 或协同过滤来推荐与他们已经点击过的内容相似的物品。这没有考虑到点击的顺序，但在实践中，这些信息并不总是那么重要。\n\n如果你深入研究论文的结果——他们从\
  \ `RNN` 中获得的结果比基于物品的 `KNN` 稍微好一点，但差异并不显著。而且，它没有在在线真实用户身上进行评估，因此还需运行更多实验来判断它是否真的是一种优越的方法。将此类东西部署到生产系统中是有真实成本的。如果它开始产生糟糕的推荐，谁能足够熟悉该算法以便进行调优和纠正？运行如此庞大且复杂的系统需要多少硬件？当硬件坏了会发生什么？为给定的会话生成推荐需要多久？这又如何影响集成到该网站的页面渲染时间？最后一个担心可能就足以扼杀项目本身了。\n\
  \n我的观点是，这样的系统绝对值得学习和评估，特别是由于深度学习似乎是目前所有研究的发展方向，而我们希望利用这一点。但必须进行实际的考量，一个复杂的系统永远不应该取代一个效果同样良好的更简单的系统。记住，当它出现问题时，那个在凌晨\
  \ 2 点被叫醒的人将是你。\n\n### 编码练习\n\n![](img/image2640.jpg)\n\n`GRU` `RNN`s 是复杂的猛兽，构建一个基于\
  \ `GRU` 的循环神经网络实际上也是一项非常复杂的任务。如果不需要，尝试从零开始编写它将是疯狂的。和大多数科学进步一样，你尽可能在别人的人的工作基础上进行构建——只要不要越越抄窃他人工作并据为己有的底即可。所以你的挑战就是准确做到这一点——在别人的工作基础上构建，在我们的\
  \ `MovieLens` 数据上运行一个 `GRU` `RNN`。\n\n论文作者在发布论文的同时发布了代码，但它是用 `Theano` 写的——它有点像 `Tensorflow`，但最终流行起来的是\
  \ `Tensorflow` 而不是 `Theano`。尽管论文才过了几年，但在那段时间里已经发生了很多变化！如果你想将论文中的想法适配到 `Tensorflow`，你可能需要先学习\
  \ `Theano` 并将一切迁移到 `Tensorflow`。但事实证明已经有人做过这件事了——这个 bit.ly 链接将带你到达那里。这是一个由一位明亮的中国研究人员\
  \ `Weiping Song 博士` 编写的 `GitHub` 项目。它与我们在 `Anaconda` 环境中使用现代 `Python` 和 `Tensorflow`\
  \ 安装来运行它的需求非常接近——但尽管这个项目还不到一年的，它已经过时了！\n\n所以，你的挑战是从 `GitHub` 下载该项目的副本并让它运行起来。要做到这一点，你需要处理几件事：\n\
  \n1. 第一个问题是它是为 `Python 2.7` 编写的，但世界早已转向了 `Python 3`。你需要解决一些细小的语法问题才能让代码编译，例如将对 `xrange`\
  \ 的调用替换为 `range`，将 `sort` 替换为 `sort_values`。\n2. 该项目在使用 `Pandas` 和 `scikit-learn`\
  \ 库，如果你跳过了“深度学习简介”部分，你可能还没有安装它们。因此，你可能需要使用 `Anaconda Navigator` 在你的 `RecSys` 环境中导入\
  \ `Pandas` 和 `scikit-learn` 模块，以便此代码运行。\n3. 接下来，你需要修改读取 `MovieLens` 数据的代码，因为它是为具有不同格式的数据编写的。你需要更改列名、路径和分隔符。特别注意列名，因为它们出现在代码的多个地方。\n\
  4. 代码假设你已经将数据拆分为训练集和测试集并作为单独文件，而我们没有。所以你还需要修改这段代码来创建训练/测试划分。\n5. 在工作时，请注意每次运行时都创建一个新的内核（kernels）。关闭\
  \ `Spyder` 中的控制台窗口，并且每次都使用新的窗口。否则，你将遇到一些困惑的错误信息，这些信息只是由于上一次运行留下的状态。试一一下，看看你是否能让它运行。在下一节中，我将让你看看我自己的结果。\n\
  \n![](img/image2655.jpg)\n\n你让它运行了吗？我希望如此——在现实世界中，你做的大部分工作都是尝试让你读到的算法在你自己的开发环境限制内运行，因此下一步是将其集成到任何在现实世界中提供数据并产生推荐的系统中。我还应该提醒你，仅仅因为代码在\
  \ `GitHub` 上并不意味着你可以随心所欲地使用它。如果不是，那么你所做的只是对其进行实验并从中学习——但你在生产系统中的自己的实现必须从头重写。或者更好，给写代码的人士表示感谢！总之，让我们快速看看我做的修改并看它运行。\n\
  \n![](img/image2662.jpg)\n\n所以，如果你解压上一幻灯片上 URL 中的压缩包，你将得到我对 `GRU4Rec` 的适配版本，它可以适用于\
  \ `MovieLens 100K` 数据集以及最新版本的 `Python`。让我们先退一步，思考一下这段代码实际上在做什么。`GRU4Rec` 将循环神经网络应用于基于会话的数据，并尝试推荐你可能点击的内容。但是，`MovieLens`\
  \ 数据并不是真正的点击流数据——为了我们的目的，我们只是假装它是。`MovieLens` 数据包含时间戳，所以我们实际上可以将评分排序成序列——并假装评分实际上是事件。正如我们将看到的，尽管数据并不是我们预期的处理类型，该算法仍然运行得惊地好。`MovieLens`\
  \ 数据集只包含对大量物品评分的用户，所以每个用户都有相当数量的点击流数据。总之，我必须做的第一件事是将 `pandas` 和 `scikit-learn` 包安装到我的\
  \ `RecSys` 环境中。我通过进入 `Anaconda Navigator`，选择我的 `RecSys` 环境并安装它们来实现这一点。下一步工作是将一切从\
  \ `Python 2.7` 迁移过来。大部分情况下这都是直接的，但这里真正的教训是机智是你的朋友。回到顶部的第 20 行，`Args()` 函数也必须根据我数据中的列名进行修改，因此\
  \ `session key`、`item key` 和 `time key` 都必须更改以反映我们拥有的数据文件。遗憾的是这些变量在代码的其他部分并不总是使用，因此在代码的几其他地方也必须更改列名。\n\
  \n查看 `model.py`……一个特定问题是原始代码多次使用 `xrange` 函数。我必须搜索所有 `xrange` 出现的地方并替换为 `range`，例如这里第\
  \ 113 行和下面的第 182 行。我还在整个代码中将 `sort` 替换为 `sort_values`，例如这里第 169 行。进入 `main.py`。下一步工作是将代码适配到我们手头的评分数据\
  \ `MovieLens 100K` 数据。从第 17 行开始，可以看到原始代码具有独立的训练和测试数据文件，包含 `Recsys Challenge 2015`\
  \ 数据。我们没有独立的训练和测试文件，所以我将训练数据文件重定向到 `ratings.csv`，并删除了测试文件路径。显然，这个路径取决于你将其存储在系统的位置。跳转到第\
  \ 62 行，我加载我们的训练数据，在此过程中告诉它物品标识符的列名，以确保它是代码预期的类型。然后我将其划分为训练和测试集，只需划分 90,000 行之后的所有评分并将其作为测试（或验证）数据。回到第\
  \ 20 行，`Args()` 函数也必须根据我们数据中的列名进行修改。当你运行时，如果不这样做，，收到的错误将毫无意义。关闭控制台窗口并允许一个新的出现可以解决这个问题。此外，代码会在\
  \ `checkpoint` 和 `__pycache__` 文件夹中存储状态——当其他一切失败时，你可以尝试删除这些文件夹让它从空白状态开始。总的来说，让它运行起来并不困难——这比你自己从零开始在课程中运行\
  \ `GRU4Rec` 要快得多。让我们运行它——运行得非常快。遗憾的是，输出并不有趣——我们没有看到任何实际的推荐示例，只有结果的测量值。但考虑到我们使用的数据集并非为此设计的，主观评估结果将很困难。\n\
  \n\n\n\n\n![](img/image2711.jpg)\n这张论文中的图给出了他们架构的概述。你可以看到这是一种非常直接的混合方法；来自你训练集的相同特征数据被并行输入到分解因机（factorization\
  \ machine）和深度神经网络中——在这个示例中，神经网络有两个隐藏层。分解因机和深度神经网络的输出被组合到最后的 sigmoid 单元中，用于预测点击、购买或你正尝试预测的任何操作。你可以在这里直观地看到分解因机是“宽”的，因此擅长发现低阶特征关系；而神经网络是“深”的，擅长发现高阶关系。其核心思想是它们结合在一起的效果更好，但当然，具体效果如何取决于你的数据的性质，以及特征之间真实存在什么样的潜关系![](img/image2717.jpg)\n\
  \nDeepFM 可能会让你觉得是一种过于复杂的方法，但它实际上只是推荐系统中集成学习方法（ensemble approach）的一个例子。它将两种本身就很强大的不同算法结合在一起：分解因机和深度神经网络。将它们想象成两种不同的乐器，组合在一起时听起来会更好听！你可以通过组合许多更简单的系统来创建一个复杂的系统，通常最终结果比孤立使用任何单一算法都要好。集成系统如果如果合理，可以通过保持其组件系统在很大程度上隔离并并行运行，最后仅组合它们的结果，使这种复杂性变得可控。这样，如果任何一个组件出现故障，你只需要禁用它，系统将继续使用其他组件运行。\n\
  \n那么 DeepFM 真的处于前沿领先端吗？嗯，它实际上只是结合了两种已经过证明的技术，这让我对这个想法更有信心。尽管它在现实世界场景中是否能产生意义的收益还有待证明，但我认为它值得尝试。记得\
  \ Netflix 挑战赛是通过一种非常相似的混合方法赢得的。Netflix 发现将 `SVD` 与 `RBM` 结合效果非常好，而 DeepFM 实际上只是在此基础上提升了一个台阶——它用更通用的分解因机模型替换了\
  \ `SVD`，用更通用的深度神经网络替换了 `RBM`。这与在 Netflix 处被证明的概念完全相同，这使得 DeepFM 更有吸引力。所以请密切关注 DeepFM，如果你已经是行业研究人员，请尝试一下。\n\
  \n![](img/image2731.jpg)\n在我们继续处于“前沿警报”状态时，让我们简要介绍几个值得关注的近期研究课题。\n\n### Word2Vec\n\
  ![](img/image2737.jpg)\n有些人已经将一种名为 `word2vec` 的神经网络模型应用于推荐问题。如果你有文本数据可以处理，它可以是一个非常有趣的工具。其核心思想是，从某些代表上下文或用户历史的单词开始，用这些词为你的推荐提供信息，但为了更容易理解，让我们从补全句子的问题开始。我们可以对该句子中的所有单词进行编码，将其通过嵌入层和进行学习的隐藏层，并在隐藏层的输出上运行\
  \ softmax 分类器，以找到与你输入的单词可能相关的每个词的概率。\n\n在这个示例中，我们输入了与“to boldly go where no one\
  \ has”这些词相关的信号，一个训练得良好的 `word2vec` 网络可能会将单词“gone”归类为与这些词关联最可能的单词。将此技术应用于推荐系统的例子是，根据其他餐厅主主的菜单，向餐厅主推荐菜品。也许你可以使用大量的菜单以及它们上出现的单词来训练\
  \ `word2vec`。然后，通过输入特定餐厅菜单中的单词，你可以推荐与他们可能想在菜单上提供的其他菜肴相关的术语。你可能会观察到这也是循环神经网络（或 `RNN`s）所擅长的问题类型，你是正确的。还有关于使用\
  \ `RNN` 进行基于文本的推荐的研究，例如我们刚刚提到的菜品推荐系统。\n\n\n\n\n\n![](img/image2751.jpg)\n\n当你将 `word2vec`\
  \ 应用于完全不是单词的内容时，事情就变得有趣了。在一个有趣的例子中，一家名为 `Anghami` 的流媒体音乐服务使用了 `word2vec`，但将其应用于根据用户之前的流播放历史来推荐歌曲的问题。它的工作方式与处理句子中的单词完全相同，但它处理的不是句子中的单词，而是某人播放流中的单首歌曲。输出不是对单词的预测，而是符合该用户过去歌曲流流“句子”的其他歌曲。这是一个非常棒的例子说明了如何对既有理念的用途提出质疑，从而获得一个完全全新的系统。\n\
  \n## 3D CNN’s\n\n![](img/image2759.jpg)\n\n2017 年 RecSys（推荐系统）会议上的一篇有趣的论文提出使用 3D\
  \ 卷积神经网络进行基于会话（session-based）的推荐。我们之前讨论过使用循环神经网络生成基于会话的推荐；这个想法基本上是额外增加两个维度，除了考虑用户在点击流中的消费数据外，这两个维度可以用来考虑被推荐物品的特征数据。所有的特征数据都经过字符编码，然后我们像在使用\
  \ `CNN` 尝试进行图像识别时处理图像数据一样处理它们。\n\n![](img/image2765.jpg)\n\n你可以想象，这会很快变得非常复杂。唯一的幸运是\
  \ `CNN` 本身在如今的其他领域已广泛应用，因此 `CNN` 本身的复杂性在某种程度上是一个解决的问题。然而，将其应用于点击流会话时涉及到许多细小的调整，例如如何处理不同长度的会话。`CNN`\
  \ 倾向于处理大小相同的数据块，这正是该论文必须解决的问题。抛开复杂性不谈，很难对它们的结果产生意见——在他们的论文中，其表现明显优于 `RNN`，但我们必须记住，这是针对一种非常特定的问题的解决方案——即在点击流会话中推荐物品，并同时考虑内容属性。\n\
  \n![](img/image2771.jpg)\n\n如果你想了解更多信息，该想法的论文可以在网上免费获取。再次强调，这只是目前需要先记在脑里的东西——你目前在网上还找不到如何编写这些代码的示例，因为它还太新了。\n\
  \n![](img/image2776.jpg)\n\n`cnn` 在推荐系统领域更直接的应用是使用它们从你尝试推荐的物品本身提取特征数据。例如，就像你可以使用卷积神经网络将图像分类为（比如）鸭子一样，你也可以使用\
  \ `CNN` 将音频波分类为特定的音乐流派。如果你正在构建一个音乐推荐系统，你可能没有关于需要推荐歌曲的良好元数据——但你可以使用 `CNN` 自动提取这些元数据，例如流派。这些流派信息可以进入某种基于内容的推荐方案，这种方案可能可以增强协同过滤或矩阵分解模型。你甚至可以想象使用\
  \ `CNN` 对绘画进行分类，并根据人们过去喜欢的绘画类型向他们推荐绘画。你仍然需要训练你的 `CNN`，所以你不能用它们创建它从未见过的新分类——但它可以作为填充新物品或数据缺失物品属性信息的有用工具。我们关于推荐系统中深度学习的“前沿警报”到此结束，但该领域的研究进展非常迅速——当你看这段视频时，其中一些想法可能已经成为主流了！我们知道\
  \ `YouTube` 和 `Amazon` 已经投入生产了使用深度学习进行推荐的系统，并开始发表它们从中中学的经验。推荐系统领域是一个令人兴奋的时代——但请记住，不要为了追热点而盲目陷入其中——对于许多问题，旧的、简单的解决方案仍然是更好的选择。\n\
  \n\n\n\n\n# 扩展规模\n\n到目前为止，我们像示例演示的那样，使用了 `MovieLens` 的 100,000 条评分。这对于教育目的来说足够了，但如果你想为一家真实的公司构建推荐系统，你可能需要处理更多的数据——下一节将介绍如何扩展规模——这些系统的存在是为了让你能够在“大数据”上训练推荐系统，这些系统可能在集群上进行，甚至可能在云端进行。有很多种选择，但我们将介绍我最喜欢的几种。\n\
  \n## Apache Spark\n\n你可能听过过 Apache Spark – 它是一个非常强大的框架，用于跨集群处理海量数据集。随着你数据的增长，你只需要不断向你的集群中添加更多计算机即可！目前，我在这里不会详细介绍\
  \ Spark 的工作原理，但我们将从实战角度关注它——我们将安装它并使用 Spark 检查一些代码。现在你可以把它看作是运行在一台电脑上，即你的 PC 上。\n\
  \n如果你想在这一节中用你自己的 PC 跟上操作，首先需要安装 Spark。在 Windows 上，这有点麻烦——但无论你使用什么操作系统，这里都是你需要遵循的步骤。如果你不熟悉在操作系统上设置环境变量，你可能应该只看接几个视频，否则你可能会遇到麻烦。\n\
  \n## 在 Windows 上设置 Spark\n\n第一步是从 Oracle 网站安装 Java SDK – 并确保它是 Java 8，而不是 Java 9\
  \ 或更高版本！Spark 仅与 Java 8 兼容。安装时，你需要确保将其安装在不包含任何空格的路径下——因此在 Windows 上，你不能接受 \"Program\
  \ Files\" 下的默认位置，因为 \"Program\" 和 \"Files\" 之间有一个空格。使用一个新的路径，比如 `c:\\jdk` 之类的容易记忆的路径。\n\
  \n然后，你需要在系统中将 `JAVA_HOME` 环境变量设置为你安装 Java 的路径。在 Windows 中，环境变量是通过系统面板设置的——从那里选择高级设置，然后你就会看到一个进入环境变量的按钮。这些步骤专门适用于\
  \ Windows——由于 Spark 的某些功能使用了 Hadoop 分布式文件系统，如果它不认为你的 PC 上安装了 Hadoop，它将无法运行。我们可以通过将课程材料中\
  \ \"ScalingUp\" 文件夹里提供的 `winutils.exe` 文件复制到 `c:\\winutils\\bin`，然后将 `HADOOP_HOME`\
  \ 环境变量设置为 `c:\\winutils` 来欺骗它。此时，你应该重启 PC 以确保所有新环境变量都已生效。\n\n最后，你需要在你的 Anaconda\
  \ 环境中安装 `pyspark` 包。还有一点——如果你已经安装了 Spark 并设置了 `SPARK_HOME` 环境变量，你需要确保你安装的 Spark\
  \ 版本与 `pyspark` 包安装到 Anaconda 中的版本相同。通常这应该是最新版本即可。如果你在机器上安装了不同的 Spark 版本，你将收到关于“Java\
  \ 网关进程在发送其端口号之前退出”的奇怪错误，这些错误是毫无意义的。完成这些步骤后，我们就可以继续并开始玩玩 Apache Spark 了！\n\nSpark\
  \ 之所以非常重要，是因为它非常高效地以可靠的方式在集群上分发对海量数据集的处理。在架构上，它看起来是这样的——你编写一个驱动脚本（使用 Python、Scala\
  \ 或 Java），定义你想要如何使用 Spark 提供的 API 处理你的数据。一旦你启动了该驱动脚本（通常是从集群的主节点启动），它将与你的集群管理器通信，从你的集群中分配它所需的资源。如果你在\
  \ Hadoop 集群上运行 Spark，那么该集群管理器可以是 Hadoop 的 YARN 集群管理器；或者如果你想用它，Spark 也有自己的集群管理器。\n\
  \n该集群管理器会在你的整个集群上分配一组执行器进程，这些进程将执行处理你数据的实际工作。Spark 处理了如何划分你的数据并以最有效的方式处理数据的所有细节。它通过尽可能将内容保留在内存中、尝试在存储数据的实际节点上处理数据，并使用一种称为“有向无环图”（directed\
  \ acyclic graph）的东西以其最有效的方式组织处理。所有这些不同的组件在需要时都可以相互通信，如果你的集群中的某台机器故障或其他情况，这可能就会变得必要。它具有很强的韧性。例如，尽管在这个简化图中，集群管理器看起来像是一个单点故障，但你可以进行设置，准备一个备用集群管理器以便在必要时接管。\n\
  \n## Spark 库和 API\n\n从软件开发人员的角度来看，Spark 由一个管理我们讨论过的所有工作分发的核心组成，Spark 之上还有其他你通常会用库：\n\
  \n- **Spark SQL**：定义了名为 `DataSet` 的东西，这允许你像使用数据库一样使用 Spark。这现在已成为使用 Spark 的标准方式。\n\
  - **Structured Streaming**（结构化流处理）：允许你实时摄取数据并在数据进入时对其处理。它还提供了结构化流，甚至允许你将实时数据视为 SQL\
  \ 数据。\n- **GraphX**：用于分析组织成图结构的数据，例如社交网络。\n- **MLlib**：我们最感兴趣的机器学习库。\n\n在我们深入某些代码之前，有一个你需要的概念——`RDD`。`RDD`\
  \ 代表弹性分布式数据集（resilient distributed dataset），如果你不使用 SQL 接口，它是 Spark 的核心。`RDD` 是封装了你想要处理的数据的对象。当你编写\
  \ Spark 脚本时，你实际上是在对 `RDD` 进行定义操作，这些操作连接在一起并最终导致预期的输出。你定义 `RDD` 应从哪里加载数据、在这些数据上执行哪些聚合操作，以及完成后输出到哪里。在你启动并请求输出之前，实际上什么都不会发生。从编程的角度来看，这很棒，因为你只需要考虑\
  \ `RDD` 以及它们在集群上分发这些操作。在技术世界中，一切保持不变的是，Spark 随着时间的推移引入了替代方案：如果你想对数据有更细粒度的控制，仍然可以针对\
  \ `RDD` 进行编码，而 `DataFrames` 的引入具有更好的类型安全——这样你可以在编译时而不是运行时捕捉错误。`DataSet` 使用了所有组件之间的通用语言，这有助于简化开发。你也可以将\
  \ `RDD` 转换为 `DataFrame`，反之亦然。技术上，`DataFrame` 与 `DataSet` 对象是完全相同的。`DataSets` 也稍微慢一点，所以有些人选择在\
  \ Python 之外坚持使用 `DataFrames`。这很困惑，为什么要告诉你这些？我们的 Python 示例将使用 `RDD` 接口对输入数据进行初始清理和结构化。但我们我们将其转换为\
  \ `DataFrame`，因为这是 Spark 库期望的输入。`DataSets` 与我们无关\n\n## 实现 ALS\n\n完成这些后，让我们看看真实的驱动脚本并用它创建一些推荐。因此，在你的\
  \ RecSys 环境中打开 Spyder，打开 Scaling 文件夹中的 `SparkALS.py` 文件。这是从 Spark 附带的一个示例改编的——它们实际上也使用\
  \ `MovieLens` 作为示例。但我做了一些修改，使其与我们的特定数据集工作并生成前 N 个推荐。代码小得惊人，不是吗？Spark 玩起来很有趣的一个原因是因为你可以用非常少的代码做非常强大的事情。让我们深入吧。首先，我们从\
  \ `pyspark` 本身导入需要的包。正如我们提到的，现代 Spark 脚本使用 Spark SQL 作为它们的主要接口，这意味着我们需要为驱动脚本设置一个\
  \ `SparkSession`。它在精神上类似于数据库会话，但我们不会将其用作数据库。我们还将导入 `RegressionEvaluator`，它可以让我们在结果上测量\
  \ RMSE，最重要的是来自 `pyspark.ml.recommendation` 的 `ALS`。这允许我们使用 ALS（交替最小二法）作为其优化函数执行矩阵分解。但神奇的地方在于，它的编写方式使得工作可以分发到集群，而我们甚至不需要考虑它是工作的！我们还导入了\
  \ `MovieLens` 类，只是为了方便我们从电影 ID 打印出电影名称。\n\n现在进入驱动脚本本身。首先，我们创建一个 `SparkSession` 对象——这包含了我们想要执行的所有\
  \ Spark 命令。我们做的只是给它起一个名字，并让其他一切使用会话的默认设置。但如果你在这里这样做，你可以对 Spark 如何分配工作进行更细粒度的控制。接下来，我们使用\
  \ `SparkSession` 上的 `read` 函数将评分数据加载到 Spark 中，它内置了方便的 CSV 解析能力。然后我们对它调用 `rdd()`\
  \ 以检索一个包含所有我们可以操作的数据的弹性分布式数据集。我们将该 RDD 存储在名为 `lines` 的变量中，因为此时它包含了直接从 `ratings.csv`\
  \ 读取的原始输入。要记住的是，此时 `lines` 并不是一个包含我们所有数据的真实结构。如果我们必须在单台 PC 上读取并存储所有内容，那将违背初衷。创建\
