- "# 机器学习与人工智能构建推荐系统：利用深度学习、神经网络和机器学习推荐帮助用户发现新产品和内容\n\n\n\n![](img/image8.jpg)\n![](img/image8.jpg)\n\
  \n\n\n\n\n\n# 入门介绍\n\n![image](img/image143.jpg)\n\n你好！如果你正在阅读这些内容，说明你已经以 PDF 或纸质的形式购买了这门推荐系统课程。感谢！如果你对视频版感兴趣，可以在\
  \ `www.sundog-education.com` 找到。\n\n我是 Frank Kane，Sundog Education 的首席执行官。我在 `Amazon.com`\
  \ 工作了九年，在那里我将职业生涯的大部分时间用于构建其推荐系统的各个部分，并管理负责这些部分的团队。你知道“买过此商品的人也买了”吧？是的，我曾运行过这个功能一段时间，还负责过他们的“个性化平台”团队。我有许多实战经验可以与你分享，结合我离开\
  \ Amazon 之后对该领域新进展的最新研究。\n\n推荐是机器学习最着迷的应用之一，也是利润最丰厚的领域之一——推荐产品是 `Amazon` 成功的核心，推荐电影是\
  \ `YouTube` 和 `Netflix` 的核心，你甚至可以将 `Google` 仅仅看作向人们推荐网页和广告的平台。\n\n这本书读起来不像一本典型的书。你在这里看到的是我在视频或直播中用于演示这些信息的幻灯片，以及我为配合这些幻灯片准备的脚本。因此，对于每个主题，你都会看到相关的幻灯片图片，以及我为解释每张幻灯片而写的文字。但它的效果意外非常好——它包含了你在典型书中获得的所有文本信息，但提供了更多的视觉辅助，而且语气比教科书更随意、更口语化。对于那些发现阅读材料比听别人在视频里朗读效率得多的视觉学习者来说，这是理想的选择。\n\
  \n我在编写此脚本时考虑了这门文字版课程，并试图确保一切在打印版和视频演示中的效果同样出色。你会发现，这种格式下的代码演练与你在其他技术书籍中习惯的略有不同。在课程早期，你会被引导下载所有配套代码。当我们看到回顾这些代码的幻灯片时，你需要按照课程中的指示，在电脑上打开这些代码，并结合这些解释代码各部分功能的书面笔记进行查阅。实际上，没有其他实用的方法了——推荐系统涉及大量的代码，在大多数情况下，这些代码无法完全呈现在一页上。我保证在讲解过程中，我会非常具体地说明我在谈论代码的哪些部分，所以你不会迷路。\n\
  \n噢，如果 `Amazon` 的律师正在读这个——别担心。我非常小心，只涵盖了已公开、已出版物的算法和技术。我在这里没有透露任何内部机密信息——尽管如此，我们在\
  \ `Amazon` 做的大部分工作现在已经发表了。我知道你迫不及待想亲自动手生成一些推荐结果了，所以让我们直接开始，安装你所需的所有软件和数据吧！\n\n\n\
  \n\n\n# 环境搭建\n\n在接下来的几分钟里，如果你电脑上还没有 Python 开发环境，你将为你安装一个。然后，我们将安装一个名为 `Surprise`\
  \ 的 Python 包，它可以让开发推荐系统变得简单。最后，我们将下载课程材料（包括一些真实的电影评分数据），并将在第 1 节课中为真实的人进行电影推荐。\n\
  \n那么，让我们开始吧！你首先需要的是某种支持 `Python 3` 的科学 Python 环境。这意味着一个为数据科学家设计的 Python 环境，比如 `Anaconda`\
  \ 或 `Enthought Canopy`。如果你已经有了，那太好了——你可以跳过这一步。但如果没有，让我们在你的系统上安装 `Anaconda`，顺便把你需要的课程材料也准备好。\n\
  \n现在，如果你是那种倾向于按照书面指令完成此类操作的人，可以前往这里显示的 URL 访问我的网站。无论如何先打开它，因为我们在视频中进行设置时会引用这个页面。请记住注意大小写——`RecSys`\
  \ 中的“R”和“S”需要大写。你还有机会加入本课程的 Facebook 群组，可以在那里与同学交流，你你会有机会与我保持联系。\n\n## 安装环境\n\n\
  在本课程中，我们将使用 `Python` 编程语言，因为它非常容易上手。所以，如果你还没有安装 `Python 3` 的开发环境，你就需要安装一个。我推荐 `Anaconda`——它是免费且被广泛使用的。让我们访问\
  \ `www.anaconda.com/download`，选择你正在使用的操作系统的安装程序。对于我来说，是 `Windows 64-bit`——并务必选择\
  \ `Python 3` 版本，而不是 `Python 2`。\n\n下载完成后，运行安装程序，确保将其安装在空间充足的驱动器上——至少 `3 GB`。现在 `Anaconda`\
  \ 安装好了，你可以启动它……并点击这里的“environments”选项卡。为了保持整洁，让我们为本课程专门创建一个环境。点击“create”，并将其命名为\
  \ `RecSys`——顺便说一下，这是 recommender systems 的缩写。我们需要一个 `Python` 环境，对应你提供的任何当前 `Python3`\
  \ 版本。创建该环境需要几分钟。\n\n## 安装 Surprise\n\n接下来，我们需要安装一个让开发推荐系统更简单的 Python 包，名为 `Surprise`。要做到这一点，点击你刚刚创建的\
  \ `RecSys` 环境旁边的箭头，并从中打开一个终端。现在在终端中运行：\n\n```bash\nconda install -c conda-forge\
  \ scikit-surprise\n```\n\n如果系统提示，按 `y` 继续，并让它运行。完成后，我们可以关闭这个终端窗口。\n\n## 下载材料\n\n\
  接下来，我们需要下载在本课程中使用的脚本和数据。从我们在 `sundog-education.com/RecSys` 的课程设置页面上，你会找到一个指向材料的链接。让我们下载它吧。完成后，我们将将其解压，并存放在合适的地方，比如你的“文档”文件夹。\n\
  \n在整个课程中，我们将构建一个以许多不同方式推荐电影的大型项目。因此，我们需要数据来处理——回到我们的课程设置页面，你将找到一个指向 `MovieLens`\
  \ 数据集的链接。它包含了 100,000 条来自真实用户的真实电影评分子集，以及关于电影本身的的一些信息。下载它并解压。解压后，将生成的 `ml-latest-small`\
  \ 文件夹移动到你之前创建的材料文件夹中。现在，我们拥有了所需的一切！\n\n## 运行推荐\n\n回到 Anaconda Navigator，确保我们创建的\
  \ `RecSys` 环境仍被选中，现在点击主页图标。我们将使用的代码编辑器名为 `Spyder`，所以在 `Spyder` 下点击安装，并等待完成。`Spyder`\
  \ 安装完成后，点击启动。\n\n现在，打开课程材料中的 `GettingStarted` 文件夹，并打开 `GettingStarted.py` 脚本文件。快速看一下代码——稍后我们会回来详细讲解，但目前有趣的是，我们仅用大约\
  \ 60 行代码就能将一种名为奇异值分解（Singular Value Decomposition，简称 `SVD`）的高级推荐技术应用于 100,000 条电影评分。这酷吗？\n\
  \n从编程的角度来看，这并不难。点击绿色的“播放”按钮，这将启动脚本。它从选择一个任意用户开始，在我们案例中是 85 号用户——我们将深入深入了解他——并总结他喜欢的电影和讨厌的电影，让你对他的口味有所了解。他看起来很典型——一个喜欢优秀的动作片和科幻片的人，讨厌那些非常不格的电影，比如《超级玛丽兄弟》。如果你没看过那部电影，那会很痛苦，尤其是如果你是\
  \ `Nintendo` 粉丝的话！\n\n\n\n\n\n# 课程概述\n\n![](img/()\n\n这是一门非常庞大的课程，因此有必要先介绍一下课程中不同部分是如何紧密结合的。首先，我们将讨论不同类型的推荐系统、它们试图解决的问题，以及它们通常遵循的通用架构。接着，对于具有某些编程经验但对\
  \ `Python` 语言可能较新的人来说，我们将简要介绍 `Python`。\n\n下一个主题是评估推荐系统；定义什么是“好”的推荐本身就是一个复杂的问题，而且决定你正在优化的目标至关重要。随后，我们将使用真实数据和不同的算法，构建一个用于生成和评估推荐的软件框架。在课程的剩余部分中，我们将使用这个框架来快速实现新想法。\n\
  \n`基于内容的过滤`(Content-based filtering）将向我们展示如何仅根据物品属性向人们推荐物品。`基于邻的协同过滤`(Neighborhood-based\
  \ collaborative filtering）将深入探讨 Amazon 开创的经典基于行为的方法，这种方法在今天仍被广泛使用。随后进入更现代的基于模型的方法，这些方法通常依赖于矩阵分解来生成推荐。\n\
  \n然后是时候祭出神经网络了。如果你是`深度学习`(deep learning）的新手，我们有一个章节可以带你快速上手。之后，我们将通过几个使用`深度学习`生成推荐的示例，以及推荐系统特定的挑战。接下来，我们将规模扩大到海量数据集。我们将学习如何使用\
  \ `Web Services`、`Apache Spark` 以及一些令人的新技术，为包含数百万件物品的目录中的数百万用户生成推荐。\n\n随后我们将讨论在部署推荐系统时会遇到的一些现实世界挑战，并通过查看\
  \ `YouTube` 和 `Netflix` 推荐系统如何运作的案例来保持贴近实际。最后，我们将研究混合解决方案，将许多不同的推荐系统结合成一个更强大的系统，并在领域不断演进的同时，通过提供关于你如何继续教育和研究的建议来为课程收尾。\n\
  \n这是一门非常全面的课程，涵盖了该领域的一些最新研究和实践实现。在整个课程中，你将通过实操示例看到所学知识的实际应用，并通过个人练习来巩固所学。\n\n##\
  \ 如何使用这门课程\n\n关于根据你之前的经验如何使用这门课程有一点简要说明：本课程旨在供任何具有计算机科学背景的人使用，但不要求必须已经熟悉 `Python`，或具有神经网络和`深度学习`的先验经验。如果你已经在这些领域拥有经验，可以跳过课程的这些章节。`Python\
  \ 入门`(intro to Python)或`深度学习简介`(intro to deep learning)章节中的任何内容都不是后续章节构建的基础。如果你已经认识\
  \ `Python`，你可以跳过整个章节并顺利继续学习课程的其他部分。如果你已经熟悉神经网络、`Tensorflow`和循环神经网络，你可以跳过`深度学习简介`章节——至少跳过你已经熟悉的部分。\n\
  \n## 推荐系统概述\n\n![](img/()\n\n在开始深入代码和算法之前，让我们先从高层面上讨论一下推荐系统。你每天都会遇到它们，可能甚至没有意识到。它们可以以许多不同的形式存在，并服务许多目的。\n\
  \n## 推荐系统的应用\n\n![](img/()\n\n我个人的成名之战是推荐——我曾参与过 `Amazon` 早期的推荐系统，这些系统通过分析你过去的购买行为来推荐你可能喜欢的其他产品。例如，我最近买了一台汽油发电机，`Amazon`\
  \ 就会自动向我推荐启动液和机油等物品。你会惊讶于这些推荐是多么有效——它们已经带来了数十亿美元的收益，并帮助人们找到了他们需要的东西。其妙之处在于，这一切都是数据驱动的——推荐系统仅根据行为发现用户与用户、物品与物品之间的关系——通常没有任何人工干预。它从统计上上知道购买发电机的人也会购买启动液——它可以利用这些历史模式，在人们甚至知道自己想要之前就向他们展示他们想要的东西。\n\
  \n但你不必局限于推荐物品——你也可以推荐内容。《纽约时时报》(New York Times) 所使用的推荐系统会查看你过去阅读过的文章，以推荐你可能喜欢阅读的其他文章。原理是一样的，只是在观察人们阅读的文章的模式，而不是人们购买的物品的模式。\n\
  \n音乐推荐是一个特殊的案例。当然，你可以把它们看作是任何其他内容，并根据口味推荐与你口味相似的人所听过的音乐。但像 `Pandora` 这样的服务更进了一步，它们分析音乐本身的波形，以寻找节奏、音乐风格和歌曲结构之间的相似性。这是基于内容的推荐示例，你的推荐不仅基于用户行为，还基于你所推荐的物品本身的属性——在这种情况下，就是你喜欢的歌曲的音乐属性。如果你对这方面的深度内容感兴趣，可以搜索\
  \ `Pandora 音乐基因组项目`(Pandora’ss music genome project)。\n\n何止产品、内容和音乐——你甚至可以推荐人！这基本上就是在线约会网站做的——它们也是推荐系统。不过作为一名已婚男性，这并不是我的专业领域！\n\
  \n搜索引擎和推荐系统之间甚至存在一条微妙的界限。现代搜索结果往往是个性化的；它不仅仅是在进行信息检索，而是查看你作为个人的过去行为，以确定哪些搜索结果对你最相关。将其看作是推荐网页，就像你推荐书籍、音乐或报纸一样。在这个例子中，我输入了我最喜欢的寿司店的名字——尽管这个名字对不同的人有许多含义，`Google`\
  \ 知道我住在哪里、我去过哪里以及我过去访问过的网站——它可以利用这些信息调出我住街街餐厅的搜索结果，而不是关于花雪（日语翻译为“雪花”）的页面。\n\n\n\n\
  \n\n# 获取兴趣数据\n\n那么，推荐系统是如何工作的呢？简单来说，它归结于对用户的理解。这不仅是针对你个人，而是针对每个访问网站的客户。推荐系统从某些关于用户的数据开始，利用这些数据找出用户的个人兴趣。然后，它可以将其数据与其他人的行为相结合，从而推荐你可能喜欢的内容。但这些关于兴趣的数据是从哪里来的呢？\n\
  \n## 显式反馈\n\n理解用户的一种方法是通过显式反馈。例如，要求用户对在线课程进行评分，或者在他们看到内容时给出一个“点赞”或“踩”。在这些情况下，你是在明确地询问用户“你喜欢这个吗”。\n\
  \n显式评分或反馈的问题在于，它需要用户付出额外付出——因为并不是每个人都愿意为他们看到的每样东西评分，所以这种数据往往非常稀疏。当数据过于稀疏时，会导致推荐质量低下。显式评分的另一个问题是每个人的标准不同——四星好评在不同人眼中可能不同。我甚至注意到不同国家的人对物品的评分也存在差异。不过，有方法可以补偿这一点。\n\
  \n## 隐式行为\n\n理解个人喜好的另一种方法是通过隐式行为。这是观察你所做的事情，并将其解释为兴趣或无兴趣。例如，如果你点击了网页上的某个链接，我们可以将其视为对该链接及其内容的隐式评分。或者，如果你点击了一个广告，这可能会告诉广告网络你可能对类似的广告感兴趣。\n\
  \n点击数据非常棒，因为它数量巨大，所以你不需要担心数据稀疏的问题。但点击并不总是兴趣的可靠指标。人们经常无意点击某些东西，或者仅仅因为某些图片吸引了他们点击。我发现仅依靠点击数据构建推荐系统是不可行的！点击数据也非常容易受到欺诈，因为互联网上有大量的机器人会污染你的数据。\n\
  \n购买物品是兴趣的更好指标，因为实际上掏腰包钱是你对某物感兴趣的信号。将购买作为隐式评分也是非常好的，因为它非常抗欺诈——因为想要操纵推荐系统的人会发现成本极其高昂。亚马逊的推荐之所以如此优秀，很大是因为他们有大量的购买数据可以使用，这对于用户的兴趣是一个很好的信号。他们甚至不需要完美的推荐算法，因为他们处理的数据就已经很棒了。\n\
  \n另一个隐式兴趣来源是你消费的内容。例如，YouTube 可以根据你观看视频时长作为对其喜爱程度的指标。消费数据不需要像购买数据那样消耗资金，但它需要消耗时间——所以与点击数据相比，它也是非常可靠的兴趣指标。这就是为什么\
  \ YouTube 在推荐算法中大量使用观看时长，以及为什么 YouTube 会尽力让你看完整个视频。总之，如果你能说服用户提供显式评分，那是非常好的。这也是我们在课程中通过\
  \ MovieLens 数据集处理的内容——电影评分。但隐式数据可以为你提供更多可处理的数据，在购买数据的情况下，从那里开始可能更好。\n\n## Top-N\
  \ 推荐器\n\n在设计推荐系统时，重要的是考虑你拥有的用户兴趣数据来源，并从那里开始——正如我们将看到的，即使是最好的推荐系统如果没有良好的数据也产生良好的结果。让我们明确一些术语——到目前为止看到的所有推荐系统被称为\
  \ Top-N 推荐器。这意味着它们的工作是为特定人员生成一份优质内容的有限列表。这是一个 Amazon 音乐推荐的截图，每页由 20 个结果——这是一个 Top-N\
  \ 推荐器，其中 `N` 是 100。\n\n正如你将看到的，很多推荐研究倾向于预测用户对他们未评分的所有物品（无论好坏）的评分，但这与推荐系统在现实世界中需要做的非常不同。通常，用户并不关心他们会给新物品打多少分——他们只想看到他们喜欢的东西！在整个课程中，重要的是记住，我们的最终目标是将我们找到最好的内容以\
  \ Top-N 列表的形式呈现给用户。我们的成功取决于我们找到人们喜欢的东西的能力，而不是预测人们讨厌的物品的能力。这听起来显而易见，但很多研究人员忽略了这一点。\n\
  \n这里是 Top-N 推荐系统工作的一种方式——有很多方法可以。但通常，你从一个代表每个用户个人兴趣的数据存储开始，例如他们对看过的电影的评分，或者过去购买的物品等隐式评分。在实践中，这通常是一个大型的分布式\
  \ NoSQL 数据存储，如 Cassandra、MongoDB 或 memcache，因为它必须处理大量数据但查询非常简单。理想情况下，这些兴趣数据使用均值中心化或\
  \ z 分数技术进行归一化，以确保用户之间的数据具有可比性，但在现实世界中，你的数据通常太稀疏而无法进行有效的归一化。\n\n第一步是生成推荐候选——根据用户的过去行为，我们认为用户可能感兴趣的物品。因此，候选生成阶段可能会获取用户表示感兴趣的所有物品，并咨询另一个基于聚合行为与这些物品类似的物品的数据存储。举个例子——假设你正在为我做推荐。你可能会查询我的个人兴趣数据库，看到我喜欢《星际迷航》。我们可能会通过评分对候选进行排序，找出用户感兴趣的物品。\n\
  \n接下来，我们进入排名阶段。很多候选会重复出现，需要合并，因为哪些是显式评分。\n\n\n\n\n\n![](img/image346.jpg)\n这里唯一的显式评分示例是星级评分，即你明确地要求用户对某事发表意见。购买、查看和点击都属于隐式评分——我们可以根据你选择以某种方式与之进行互动，推断出你喜欢某个物品。虽然显式评分为推荐系统提供了非常优质的数据，但它们需要用户付出额外努力，因此很难获取足够的数据来投入使用。然而，隐式数据只是用户自然行为的副产品——因此很容易获取大量数据。对于一个良好的推荐系统来说，你既需要兴趣数据的质量，也需要数量。\n\
  \n![](img/image356.jpg)\n以下哪些项是推荐系统的示例？其中某些有些棘手，但请问问自己，这些体验中，哪些是根据你个人过去的兴趣表达（无论是显式的还是隐式的）而个性化的？我们有你可能在\
  \ Netflix 主页上看到的电影推荐组件、使用 Google 时的搜索结果、在查看产品时 Amazon 上的“购买过此商品的人也购买了”组件、Pandora\
  \ 的音乐流媒体系统、你可能在听广播电台直播的在线电台、YouTube 以及你从维基百科得到的搜索结果。![](img/image362.jpg)\n\nNetflix\
  \ 在为你推荐观看内容时绝对考虑了你过去的观看和评分行为，YouTube 也是如此。你的 Google 搜索结果是根据 Google 对你的了解而进行个性化的，因此它也属于推荐系统——但维基百科给所有人提供相同的搜索结果，所以它真的只是信息检索系统，而不是推荐系统。我们知道\
  \ Pandora 根据你的显式评分来为你选择歌曲，因此它是推荐系统——但如果你是在线收听本地广播电台，那并不是个性化体验，因此它不涉及推荐技术。Amazon\
  \ 的“购买过此商品的人也购买了”也属于推荐系统，因为它虽然不涉及显式评分，但它确实包含了你通过查看该功能所显示的物品时所给出的隐式兴趣指示。正如你所看到的，这里存在一些灰色地带——但重要点是，你学到的关于构建推荐系统的知识可以应用于现实世界中的各种问题。即使对于那些我们没有选为“正确答案”的项，你也可以想象构建一个推荐系统来决定你应该听哪一个在线电台——也许使用推荐系统来个性化维基百科搜索并不是一个坏主意。![](img/image368.jpg)\n\
  \n以下哪些是“top-N”推荐系统的示例？我们的目标仅仅是为给用户生成一份我们能提供的最佳推荐短列表？\n\n![](img/image378.jpg)\n\
  Netflix 或 Amazon 的推荐组件通常最多只显示 20 个左右的结果，因此它们符合“top-N”推荐系统的定义。然而，Google 可以返回你想要的任何数量的结果，因此它需要为你对更多页面进行排名。尽管如此，如果你将\
  \ Google 限制为只显示一两页个性化搜索结果，你也可以将其构化为 top-N 推荐器。所以，这仍然是一个灰色地带——但我们使用“top-N”推荐器的想法是为了将工作集中在重要的事情上；在\
  \ top-N 的情况下，这意味着我们只想关注每个用户的顶端结果，而不是我们为所有人预测所有物品评分的能力。image383.jpg)\n\n回想我们关于 top-N\
  \ 推荐系统的架构幻灯片，以下哪些是该图表中的框？\n\n![](img/image393.jpg)\n嗯，候选者洗牌（candidate shuffling）是我刚刚编造的——尽管我们实际上会构建只推荐随机、洗牌内容的推荐系统，作为基准进行比较。其他都是我们在\
  \ top-N 推荐器中必须做的事情——我们需要根据用户的兴趣生成推荐候选者，我们需要对这些候选者进行排序，然后将它们筛选为我们想要的 N 个结果。这个测验就此结束，课程的这个初始章节也到此了！你已经对推荐系统的概念、挑战和架构学习了许多。继续加油吧，后面还有很多细节和实践操作等待着你。\n\
  \n\n\n\n\n# Python 简介 ![](img/image405.jpg)\n\n在本课程中，我们将使用 Python 编程语言，因为它很容易学习和使用，并且在数据科学和机器学习领域被广泛使用。在现实世界中，使用\
  \ `Java` 或 `C++` 等语言你将获得更好的性能，但我不想排斥那些不熟悉这类低级语言的同学。无论如何，如果你已经了解 Python，完全可以跳过这一节。但如果你是\
  \ Python 新手，或者需要复习，我在这里为你准备了一门非常快速的突击课程。你需要具备一些编程或脚本经验才能理解这些内容——我无法在课程的一个章节中教你从零开始编程。所以，如果你从未编写过任何程序，最好先去找一门更深入的\
  \ Python 入门课程并完成它，然后再回到本课程。否则，让我们继续前进，学习 Python 的基础吧！![](img/image412.jpg)\n\n在\
  \ Python 介绍中，我们将使用一种称为 Notebook 的格式——这允许我们在代码中穿插格式化良好的文本，以解释正在发生什么，并让我们一次运行一小块代码代码。因此，我们需要做的第一件事是在\
  \ Anaconda 中安装一个名为 `Jupyter Notebook` 的组件。要这样做，只需打开 Anaconda Navigator，点击“Environments”，并选择我们的\
  \ `RecSys` 环境。现在，点击 Home，在 `Jupyter Notebook` 下，点击 install。完成后，点击“Launch”，它应该会在你的网络浏览器中打开一个页面。现在，点击上传按钮，导航到课程材料中的\
  \ Getting Started 文件夹。在里面选择 `Python101.ipynb` 文件。它现在应该出现在文件列表的顶部；点击它旁边的“upload”按钮。上传完成后，在文件列表中找到它并选择打开它。如果你以前没见过\
  \ Jupyter notebook，它的工作原理是你可以点击这些代码块中的任何一个，点击“run”按钮（或按 `shift-enter`），它就会直接在你的网络浏览器中执行该代码。让我们先尝试这个第一个代码块；点击它内部选中它，然后按\
  \ `shift-enter`。\n\n现在，我们在这里介绍 Python 的语法以及它与其他语言的主要区别。让我们仔细观察一下这段代码。Python 的一个特点是空白字符非常重要；任何代码的嵌套（例如迭代或条件表达式）都依赖于制表符（tabs）的数量将代码分组，而不是像其他语言那样使用大括号。所以，这里我们有一个“数字列表”——在\
  \ Python 中，列表就像其他语言中的数组或向量。我们通过将数字 1-6 放在方括号之间并用逗号隔开来定义一个数字列表。在 Python 中，不需要任何字符来结束一行；你只需要完成后按回车键即可。让我们给列表添加\
  \ 7，以证明运行这段代码确实起了某种作用。（按 `shift-enter`）——是的，我们现在有了 1 到 7 的结果。\n\n接下来，我们有一个 Python\
  \ 中“for”循环的示例。该语句遍历名为 `listOfNumbers` 的列表，每次将当前迭代的内容存储在变量 `number` 中。`for` 语句必须以冒号结尾，像这样。但现在我们使用缩进来指示哪些代码位于此\
  \ `for` 块中。在这里，我们有一个“if / else”子句的示例——如果数字能被 2 整除，我们就打印它是偶数，否则我们打印它是奇数。再次，我们在这里使用缩进来指示每个\
  \ if 或 else 子句中包含了哪些代码。我们移除所有缩进以退出 `for` 循环，并在最后打印“all done”。\n\n注意，我们从未预先声明任何变量，也不需要定义它们的类型。Python\
  \ 是所谓的动态类型语言。它会尝试根据你最初使用变量的方式来推断变量的数据类型，但在内部它们确实是有类型的。如果你需要，你也可以显式地将变量转换为不同的类型，但变量不会像弱类型语言中那样自动重新转换。有时这会导致意料之外的错误，我们在课程过程中会看到一些这种情况。\n\
  \n让我们进入下一个代码块，它展示了如何将外部模块导入到你的 Python 脚本中。你只需使用 `import` 命令即可，如果你想少打几个字，也可以为模块定义一个别名。所以，在这里我们导入了\
  \ `numpy` 模块以便在脚本中引用它，并且我们以 `np` 的名称导入它。这让我们只需通过输入 `np.random` 就可以使用 `numpy` 的随机函数——在这种情况下，我们要求\
  \ `numpy` 提供具有给定均值和标准差的十个正态分布随机值。\n\n\n\n\n\n# 推荐系统评估\n\n推荐系统之所以是一门艺术又是一门科学，很大程度上是因为很难衡量它们的优劣。它们给出的结果具有某种美学特征，而且很难判断一个人是否认为某项推荐是好的——尤其是当你离线开发算法时。人们已经想出了许多不同的方法来衡量推荐系统的质量，而且不同的衡量标准之间往往是相互冲突的。但让我们来看看推荐系统最常用的指标，因为它们都有各自的用处。\n\
  \n## 测试方法论\n\n首先，我们来谈谈离线测试推荐系统的方法论。如果你以前做过机器学习，可能对训练集/测试集划分（train/test splits）的概念并不陌生。推荐系统是一种机器学习系统——你使用先前的用户行为对其进行训练，然后用它来对新用户可能喜的物品进行预测。因此，至少在纸面上，你可以像评估任何其他机器学习系统一样评估推荐系统。\n\
  \n它的工作原理是：你衡量推荐系统预测人们过去对某些事物评分的能力。但为了保持诚实，你首先将评分数据分成训练集和测试集。通常，训练集更大，比如占所有数据的 80%\
  \ 或 90%——你将评分随机分配到其中一个。因此，你只使用训练数据来训练你的推荐系统。这就是它学习物品之间或用户之间之间所需关系的地方。一旦训练完成，你就可以要求它预测新用户可能会对他们从未见过的物品给出多少分。所以，为了衡量它的表现如何，我们使用预留的用于测试的数据。这些是我们的推荐系统从未见过的评分，这样就防止了它“作弊”。\n\
  \n假设我们测试集中某一个评分显示用户实际上给电影《上个总员》（Up）打了 5 星。我们只需要询问推荐系统它认为这个用户会给《上个总员》打多少分，而不告诉它答案，然后就可以衡量它与真实评分有多接近。如果你对足够的人进行这种操作，你就能得到一个有意义的数字，告诉你的推荐系统推荐物品的能力有多强——更具体地说，推荐人们已经看过并评价过的东西。如果你无法在在线系统中进行测试，这真的是你能做的全部。\n\
  \n如果你真的想做得复杂一点，可以使用一种名为 `k-折交叉验证`（k-fold cross validation）的技术来改进单一的训练/测试划分。它的思想与训练/测试相同，但不是创建一个单一的训练集，而是创建许多随机分配的训练集。每个单独的训练集（或“折”）被独立地用于训练你的推荐系统，然后我们根据你的测试集衡量结果生成的准确性。因此，我们最终得到了每个折预测用户评分的准确性得分，并对它们取平均值。这显然需要更多的计算能力，但优势在于你不会对单一训练集产生“过拟合”（overfitting）。如果你的训练数据较少，你可能会面临针对训练集中的特定评分而非测试集评分进行优化的风险——因此\
  \ `k-fold cross validation` 为这种情况提供了一些保障，并确保你创建的推荐系统适用于任何一组评分，而不仅仅是你恰好选择的训练集中的评分。\n\
  \n## 准确率衡量\n\n重申一下，`train/test` 和 `k-fold cross validation` 是衡量推荐系统准确率的方法。也就是说，你多多准确地预测用户对他们看过的电影的评分。但是，从根本上说，在\
  \ Netflix 或其他地方离线对真实的人测试新算法是不可能的，所以让我们介绍几种实际实现这一目标的不同方法。\n\n### 平均绝对误差 (MAE)\n\n\
  最直观的指标是平均绝对误差，或 `MAE`。这里是计算它的花哨数学方程——它看起来并没有那么复杂，让我们来拆解一下。假设我们在测试集中有 `n` 个想要评估的评分。对于每个评分，我们可以把系统预测的评分称为\
  \ `y`，用户实际给出的评分称为 `x`。取两者之差的绝对值来衡量该评分的误差——我们将测试集中所有 `n` 个评分的误差相加，并除以 `n` 得到平均值（或均值）。所以，平均绝对误差就是这样——每个误差预测绝对值的平均值。记住，误差是坏的，所以你想要尽可能低的\
  \ `MAE` 分数。让我们来看一个简单的例子。假设我们的测试集中只有 4 个评分。在第一个评分上，我们的推荐系统预测评分为 5，而实际评分为 3。在这种情况下，绝对误差是\
  \ 2。我们对每个评分执行此操作，将它们全部加起来，然后除以 4。因此，这种情况下的 `MAE` 分分为 1.5。就是简单。\n\n### 均方根误差 (RMSE)\n\
  \n衡量准确率的另一种稍微高级的方法是均方根误差，或 `RMSE`。这是一种更常用的指标，因为它有几个原因：它在预测偏差较大时惩罚更重，而在预测接近时惩罚较小。`Root`\
  \ 意味着我们对结果取平方根，`mean` 指平均值，而 `square` 指我们对误差进行平方。`error` 是预测值与真实值之间的差。通过平方，我们放大了较大误差的影响。\n\
  \n\n\n\n\n![](img/image545.jpg)\n# 命中率指标\n\n命中率的一种变体是平均倒数命中率，简称 `ARHR`。该指标与命中率相似，但它考虑了命中项出现在\
  \ `top-N` 列表中的位置。因此，在列表顶部的位置成功推荐一个物品，你获得的加分会比在底部位置要多。同样，这是一种更关注视用户的指标，因为用户倾向于关注列表的开头。\n\
  \n唯一的区别在于，我们不再累加命中次数的总数，而是累加每个命中项的倒数排名。因此，如果我们成功预测了第 3 槽位的推荐，那么它只计为 `1/3`。但在 `top-N`\
  \ 推荐中第 1 槽位的命中则会获得 `1.0` 的全权重。这个指标对你是否有意义，很大程度上取决于你的 `top-N` 推荐是如何展示的。如果用户必须滚动页面或分页才能看到\
  \ `top-N` 列表下方的项目，那么对那些出现在列表靠后位置的优质推荐进行惩罚就是合理的，因为用户需要花费精力才能找到它们。\n\n![](img/image556.jpg)\n\
  \n## 累积命中排名\n\n另一种变体是累积命中排名。听起来很高级，但它的意思是：如果我们预测的评分低于某个阈值，就会丢弃这些命中项。其理念是，我们不应该向用户推荐我们认为他们不会真正喜欢的物品而获得功劳。因此在在示例中，如果我们设置了\
  \ `3` 星的阈值，我们将丢弃测试结果中第二个和第四个物品的命中，我们的命中率指标将完全不计算它们。\n\n![](img/image567.jpg)\n\n\
  ## 评分命中率\n\n查看命中率的另一种方法是根据预测的评分值进行拆分。这可以让你直观地了解算法认为实际命中的电影，其质量的分布情况。理想情况下，你希望推荐用户真正喜欢的电影，而通过拆分分布，可以让你更详细地了解自己的表现如何。这被称为评分命中率，简称\
  \ `rHR`。\n\n所以，这些都是离线衡量 `top-N` 推荐系统有效性的不同方法。如果 Netflix 颁发的 Netflix 奖项是基于命中率而不是\
  \ `RMSE`，那么推荐系统的世界可能会有所不同！事实证明，`RMSE` 的微小改进实际上可以带来命中率的巨大提升，这才是真正关重要的——但事实证明，你也可以构建命中率极高但\
  \ `RMSE` 评分很差的推荐系统——我们将在课程后面的部分看到一些例子。因此，`RMSE` 和命中率并不总是关联的。\n\n\n\n\n![](img/image579.jpg)\n\
  \n对于推荐系统来说，准确率（Coverage Accuracy）并不是唯一的衡量标准；如果其他指标对我们很重要，我们也可以进行衡量。例如，覆盖率（Coverage）。它指的是你的系统能够提供的所有可能推荐内容的百分比。想想我们在课程中使用的\
  \ MovieLens 电影评分数据集；它包含了数千部电影的评分，但现实中存在大量电影它并没有评分。如果你使用这些数据在像 IMDb 这样的平台上生成推荐，那么这个推荐系统的覆盖率就会很——因为\
  \ IMDb 的目录中有数百万部电影，而不是几千部。值得注意的是，覆盖率可能与准确率产生冲突。如果你对所做的推荐内容执行更高的质量阈值，那么你可能会以牺牲覆盖率为代价提高准确率。找到“在什么情况下完全不推荐反而更好”的精确平衡点是非常微妙的。覆盖率也是一个重要的观察指标，因为它能让你感觉到目录中的新物品多快开始出现在推荐中。当\
  \ Amazon 上出一本新书时，至少要有几个人购买并与其他物品建立购买模式后，它才会出现在推荐中。在这些模式出现之前，本新书会降低 Amazon 的覆盖率指标。\n\
  \n### 多样性（Diversity）\n![](img/image589.jpg)\n另一个指标被称为多样性。你可以将其理解为衡量你的推荐系统向人们展示的物品种类有多广泛。低多样性的一典型例子是：一个推荐系统只推荐你已经开始阅读的系列丛中的下一本书，但不推荐不同作者的书，或与你读过的内容相关的电影。这可能看起来像是一个主观问题，但它是可衡量的。许多推荐系统从计算物品之间的某种相似性指标开始，因此我们可以使用这些相似性评分来衡量多样性。如果我们查看\
  \ `top-N` 推荐列表中每一对组合的相似性评分，可以对它们取平均值，从而得到列表中推荐物品之间彼此相似程度的衡量标准。我们将该衡量标准命名为 `S`。多样性基本上是平均相似性的反面，因此我们从\
  \ `1` 中减去它，得到一个与多样性相关的数值。要意识到，至少在推荐系统的语境下，多样性并不总是是好事。你可以通过推荐完全随机的物品来实现极高的多样性——但从任何角度来说，那些都不是好的推荐！异常高的多样性评分通常意味着你大多数情况下提供的都是糟糕的推荐。你总是需要结合衡量推荐质量的指标来观察多样性。\n\
  \n### 新颖性（Novelty）\n![](img/image597.jpg)\n同样，新颖性听起来像是一件好事，但往往并非如此。新颖性衡量你所推荐物品的受欢迎程度。再次，仅仅推荐随机的东西就会产生非常高的新颖性评分，因为绝大多数物品都不是畅销品。虽然新颖性是可以衡量的，但如何处理它在很多方面都是主观的。推荐系统中存在一个“用户信任”的概念——人们希望在推荐中至少看到几个熟悉的物品，让他们感叹：“是的，这是给我的一个很不错的推荐。这个系统看起来很不错。”如果你只推荐人们从未听过的东西，他们可能会认为你的系统并不真正了解他们，并且对你推荐内容的参与度可能会更低。此外，热门物品通常有其受欢迎的原因——深受大部分人群的喜爱，因此你可以预期它们对于尚未读过或看过这些内容的大部分人群来说是很好的推荐。如果你没有推荐某些物品，你可能应该怀疑你的推荐系统是否真的在起。这是一个重要的点——你需要在熟悉的、热门物品与我们所说的用户从未听过的新物品的“意外发现（serendipitous\
  \ discovery）”之间取得平衡。熟悉的物品与用户建立了信任，而新物品则允许用户发现他们可能喜欢的完全新的事物。\n\n![](img/604.jpg)尽管如此，新颖性是很重要的，因为推荐系统的核心在于挖掘我们所谓的“长尾”中的物品。想象这是你目录中每个物品的销售情况图，按销售额排序。因此，销售数量或流行程度位于\
  \ `Y` 轴上，所有产品沿 `X` 轴分布。你几乎总是看到像这样的指数分布……大多数销售额来自极少数物品，但合在一起，“长尾”也占据了大量的销售额。那个“长尾”中的物品——图中的黄色部分——是迎合小众兴趣人群的物品。推荐系统可以帮助人们发现长尾中与其自身小众兴趣相关的物品。如果你能成功做到这一点，那么你的系统做出的推荐就可以帮助新作者被发现，帮助人们探索自己的热情，并为你构建系统的客户赚到钱。如果操作得当，具有良好新颖性的推荐系统实际上可以让世界变得更好。但再次，你需要在新颖性和信任之间取得平衡——正如我所说，构建推荐系统是一门艺术，这就是原因之一。\n\
  \n### 流失（Churn）\n![](img/612.jpg)\n我们可以衡量的另一件事是流失。用户的推荐内容变化多频繁？在某种程度上，流失可以衡量推荐系统对新用户行为的敏感程度。如果用户给某部新电影评分，这是否会大幅改变他们的推荐内容？如果是，那么你的流失分将很高。也许向某人多次展示相同的推荐本身就是个坏主意。如果用户一直看到同一个推荐但没有点击，在某个时刻你是否应该停止尝试推荐它，并向用户展示其他内容？有时在你的\
  \ `top-N` 推荐中加入一点随机性可以保持它们的新鲜感，并让用户看到比他们通常看到的更多的物品。但是，和多样性和新颖性一样，高流失本身并不是好事。你可以通过推荐完全随机的物品使流失指标最大化，当然，那些不是好的推荐。所有这些指标都需要结合来看，你需要理解它们之间的权衡。\n\
  \n### 响应性（Responsiveness）\n![](img/621.jpg)\n最后一个指标是响应性——推荐内容的变化多快？在某种程度上，响应性衡量新用户行为对推荐的影响有多快。如果用户给某部新电影评分，这是否会实质性地改变他们的推荐？如果是，那么你的流失分将会很高。也许向某人多次展示相同的推荐本身就是个坏主意。如果用户一直看到同一个推荐但没有点击，在某个时刻你是否应该停止尝试推荐它，并向用户展示其他内容？有时在你的\
  \ `top-N` 推荐中加入一点随机性可以保持它们的新鲜感，并让用户看到比他们通常看到的更多的物品。但是，和多样性和新颖性一样，高流失本身并不是好事。你可以通过推荐完全随机的物品使流失指标最大化，当然，那些不是好的推荐。所有这些指标都需要结合来看，你需要理解它们之间的权衡。\n\
  \n![](img/627.jpg)我们涵盖了衡量推荐系统的许多方法——`MAE`、`RMSE`、`命中率（Hit Rate）`的各种形式、覆盖率、多样性、流失和响应性。那么，我们如何知道该关注什么？嗯，答案是取决于情况。它甚至取决于文化因素——某些文化可能希望推荐中有更多多样性和新颖性，而另一些文化可能更倾向于熟悉的东西。它还取决于你业务想要实现的目标。通常，业务就是为了赚钱——这引出了另一种评估推荐系统的方法，它可能是最重要的……\n\
  \n### A/B 测试\n![](img/633.jpg)那就是通过对真实客户进行在线 A/B 测试来调优你的推荐系统，并衡量他们对推荐内容的反应。你可以将不同算法的推荐展示给不同的用户组，并衡量他们是否真的购买、观看或对你展示的推荐表示兴趣。通过使用对照在线实验对推荐系统进行更改——你可以观察这些更改是否真的让人们发现了比以往更多的新物品。这最终对你的业务至关重要，对你的用户也是如此。在我们讨论过的所有指标中，没有任何比真实客户在现实世界中对你生成的推荐反应更重要。你可以拥有世界上准确的评分预测，但如果客户无法从你的系统中找到要购买或观看的新物品，那么从实践角度来说它是毫无用处的。\n\
  \n\n\n\n\n![](img/image651.jpg)\n\n你可以做的另一件事是直接询问用户他们是否认为特定的推荐是好的。就像你可以对带有评分的物品请求显式反馈一样，你也可以要求用户对你的推荐进行评分！这被称为衡量推荐的“感知质量”，在理论上这似乎是一个好主意，因为正如你所学到的，定义什么是“好”推荐绝非易事。但在实践中，这是一件很难做的事情。用户可能会困惑于你到底是让他们对项目本身评分，还是对推荐评分，因此你实际上无法知道该如何解释这些数据。这还需要你的客户付出额外工作，且对他们来说没有明确的回报，因此你不太可能获得足够的推荐评分来产生价值。最好的办法还是坚持在线\
  \ A/B 测试，通过客户如何用钱包“投票”来衡量你推荐的质量。\n\n## 测验\n\n![](img/image657.jpg)\n到目前为止，我们在这一节涵盖了大量内容——但在尝试构建推荐系统之前，理解什么是良好的推荐系统至关重要。所以，让我们通过另一个短测验来巩固我们学到的知识。\n\
  \n![](img/image667.jpg)\n你的第一个问题是：使用了什么指标来评估 Netflix 挑战赛？通过为改进特定指标提供一百万美元的奖金，Netflix\
  \ 重塑了全球的推荐系统研究领域，使其专注于该指标（无论结果好坏）。它是什么？\n\n![](img/image677.jpg)\n答案是均方根误差，即 `RMSE`。但正如我们所说，在现实世界中，准确性并不是一切。用户不在乎你能多准确地预测他们对看过的电影的评分，他们在乎的是你向他们展示他们喜欢的新事物的能力。可以说，Netflix\
  \ 应该关注一个更注重 Top-N 推荐的指标——这引出了我们的下一个问题……\n\n![](img/image687.jpg)\n哪种指标是考虑到预测项目排名的\
  \ Top-N 推荐指标？事实上，指标不止一个——但到目前为止，我们在课程中只提到过一个。\n\n![](img/image697.jpg)\n答案是平均倒数排名排名，简称为\
  \ `ARHR`。它衡量了我们推荐真正出现在用户前-N 高分电影列表中的物品的能力，并且当这些“命中项”出现在 Top-N 列表顶部时，给予它们更高的权重。\n\
  \n![](img/image707.jpg)\n我们讨论了“长尾效应”，以及推荐相对冷门但与某人独特的小众兴趣相关的物品具有真正的社会价值。哪种指标告诉我们我们推荐的内容有多流行或多冷门？\n\
  \n![](img/image718.jpg)\n答案是 `novelty`（新颖性），它只是对我们推荐的物品整体流行排名的衡量。再次，必须在推荐能够建立推荐系统信任的流行物品与推荐可能导致用户产生意外发现的更冷门的物品之间取得平衡。\n\
  \n![](img/image728.jpg)\n哪种指标告诉我们我们是否总是在推荐相同类型的东西？例如，因为我看过其中一部《星球大战》，就推荐每一部《星球大战》电影，这对用户来说可能不是一种很好的惊喜体验。\n\
  \n![](img/image738.jpg)\n答案是 `diversity`（多样性），它是 1 减去你给每个用户的推荐物品之间的平均相似性评分。再次，你需要谨慎对待这个指标。永远不要只看多样性，因为你只需向人们推荐随机东西就可以获得最高的多样性得分——但这并不是一个好的推荐系统。高多样性往往只是推荐糟糕的象。\n\
  \n![](img/image748.jpg)\n最后，哪种指标比任何事情都重要？值得重申！\n\n![](img/image758.jpg)\n那是在线 A/B\
  \ 测试的结果。我们讨论过的任何离线指标都无法取代衡量真实用户对呈现在他们面前的推荐所出的反应。你无法模拟真人在看到新事物时脑子里在想——你必须在现实世界中以受控的方式对他们进行你的更改，看看哪些有效，哪些无效。\n\
  \n\n\n\n\n# 使用 Python 衡量推荐系统 ![](img/image769.jpg)\n\n是时候开始写代码了！我们已经讨论了评估推荐系统的许多不同方法，所以让我们从编写代码来让这些指标变为现实吧。将其看作测试驱动开发——我们在编写任何实际的推荐系统之前先编写测试，这通常是一个好主意，因为可以让你专注于你想要实现的结果。我们将使用一个名为\
  \ `Surprise` 的开源 Python 库来让工作变得更轻松——你们在第一节课上应该已经安装了它。让我们看看它是如何工作的。首先，查看一下 `SurpriseLib`\
  \ 的在线文档。`Surprise` 是围绕衡量推荐系统的准确性构建的，尽管我反复强调过这不是应该关注的重点，但在没有自己的真实大规模网站的情况下，这确实是我们能做的最好的。它还能为我们提供关于将要处理的算法属性的信息。它还为我们节省了大量工作——例如，它可以为我们计算\
  \ `MAE` 和 `RMSE` 等。让我们看看 `SurpriseLib` 提供的准确性指标文档。现在，在我们的推荐系统环境中启动 `Spyder`。现在在课程材料的“Evaluating”（评估）文件夹下，打开\
  \ `RecommenderMetrics.py`，看看它是做什么的。`RecommenderMetrics` 是一个 Python 包，其中包含了我们可以在其他代码中使用的函数。因此，我们正在构建一个用于评估推荐系统的实用函数库。从\
  \ `SurpriseLib` 网站，我们可以深入 Github 查看他们 `MAE` 和 `RMSE` 的实际实现。既然已经有人为我们完成并测试了这些，我们就没有必要自己再写一遍。\n\
  \n回到我们的 `RecommenderMetrics` 包。首先，我想再次强调，这门课程并不是为了教你如何编写 Python 代码。因此，我们不会逐行解释每一行代码并讨论它的作用，我也不会让你们看着我输入数千行代码并让跟着操作。这些是学习编程的极佳技巧，但我假设你已经熟悉\
  \ Python，所以我们可以只专注于算法和架构。如果这对你来说完全没有意义，你真的应该先去上一门 Python 入门课程。尽管如此，让我们深入了解这个包中的内容。由于\
  \ `Surprise` 主要关注评分预测，我们必须写一些代码从中提取 Top-N 推荐。这就是 `GetTopN()` 函数的作用。它接收来自推荐系统返回的完整评分预测列表，并返回一个将用户\
  \ ID 映射到其前 N 个评分的字典。我们还可以传入最小评分阈值，以防止推荐我们认为用户并不会真正喜欢的物品。我们返回的字典实际上是一个 `defaultdict`\
  \ 对象，它就像普通的 Python 字典，但当你尝试访问尚未使用过的键时，它有一个默认空值的概念。要计算命中率（hit rate），我们需要传入每个用户 ID\
  \ 的 Top-N 电影字典，以及从训练集中留出的测试电影评分集合。\n\n如果你还记得，我们正在使用一种名为“留一验证”（leave one out validation）的技术，为每个用户留出一个评分，并测试我们在\
  \ N 列表中推荐该留出电影的能力。累积命中率（或 `CHR`）的工作原理完全相同，只是我们现在有了评分截断，除非预测评分高于某些阈值，否则我们不计算命中。你可以在第\
  \ 57 行看到该截断的位置，否则这与命中率函数相同。我们还将实现评分命中率（或 `RHR`），因为我们也讨论到了这个。它的工作方式与命中率一样，但我们记录每个唯一评分值的命中率。因此，我们不是用一个变量来跟踪命中次数和总用户数，而是用另一个字典来跟踪每种类型的命中次数和总数。最后，我们将它们全部打印出来。另一种命中率指标是平均倒数排名（average\
  \ reciprocal rank），它再次类似于命中率——区别在于我们通过命中排名的倒数进行计数，以便为出现在 N 列表顶部的命中给予更多加分。\n\n接下来我们可以衡量覆盖率（coverage），在这里我们将覆盖率定义为至少有一个高于某些阈值的“好”推荐的用户占百分比。在现实世界中，你可能有一个比你推荐集更大的物品目录，并根据该更大的集合来计算覆盖率。但对于我们在\
  \ MovieLens 中必须处理的数据，这是我能出的最有趣的覆盖率衡量。代码本身非常直观。接下来我们将处理多样性（diversity）。为了衡量多样性，我们不仅需要系统提供的所有\
  \ N 个推荐，还需要数据集中每对物品之间的相似性评分矩阵。虽然多样性很容易解释，但编写代码有点棘手。我们首先检索相似性矩阵——这基本上是一个包含数据中所有可能的物品组合的相似性评分的数组，我们可以快速查找。然后我们一个接一个地遍历每个用户的\
  \ N 个推荐。`itertools.combinations` 为我们提供了 N 列表中所有物品的组合。我们然后遍历每一对并查找物品之间的相似性。这里是时候提到，`Surprise`\
  \ 为用户和物品维护了内部 ID，这些与原始 ID 不同。相似性矩阵使用了这些内部 ID，所以在查找相似性评分之前，我们需要将原始 ID 转换为内部 ID。我们汇总所有相似性评分，取平均值，然后减\
  \ 1 以得到多样性指标。你可以想象，在数据的每个可能的推荐组合上运行这段代码是非常耗时的。在现实世界的大数据集上，计算时进行采样是合理的。最后我们将处理新颖性（Novelty），这要简单得多。我们将每个物品的流行排名字典作为参数，然后只需遍历每个用户的\
  \ N 个推荐并计算所有推荐物品的流行排名平均值。好了，现在我们有了评估推荐系统的工具。让我们在真实的推荐系统上尝试它们！![](img/788.jpg)\n\n\
  所以我们创建了一个包含许多评估推荐系统函数的 Python 包。让我们使用真实的 MovieLens 数据运行它们。再次，我们使用课程材料中的“Evaluating”文件夹。这一部分让我们打开\
  \ `TestMetrics.py` 和 `MovieLens.py`。在 `TestMetrics` 中，我们通过导入所需的模块开始查看它是做什么的以及如何工作。快速查看\
  \ `MovieLens.py`，它负责加载包含评分信息的原始 MovieLens 文件。它还包含一些稍后将用于快速查找电影标题的实用函数。\n\n好的，我们要做的的是围绕\
  \ SVD 算法创建一个推荐系统，并在我们设计的许多指标上对其评估。SVD 如何工作现在并不重要，我们只是在看看我们的指标是否有效。我们首先加载 MovieLens\
  \ 数据和流行排名，以便我们之后可以计算新颖性。接这个块构建了物品到物品的相似性评分。事实证明，SVD 没有计算这些，所以为了多样性，我们将训练一种名为 `KNN`\
  \ 的不同推荐系统。我们从 MovieLens 获取完整数据集，设置一些关于如何计算这些相似性评分的参数，并在 `Surprise` 中拟合一个 `KNNBaseline`\
  \ 推荐到 MovieLens 数据。为了保持运行时间合理，我们不会进行全交叉验证——只需进行训练/测试划分。在示例中，我们将随机留出 25% 的数据进行测试，并使用剩余的\
  \ 75% 来训练我们的 SVD 推荐。我们这样做——创建一个具有固定随机种子的新 SVD 推荐算法以获得一致的结果，然后使用这里的 `fit` 函数训练算法。我们然后在这个算法上处理我们的测试集，它为我们返回整个测试集的评分预测。\n\
  \n现在我们有了用于评估推荐系统的工作代码，并且已经学会了如何使用它。我们的 `MAE` 约为 0.7，`RMSE` 约为 0.9。这意味着平均来说我们偏差了\
  \ 0.7 星。`RMSE` 较高，意味着我们出错比比预期的要频繁。再次，你希望这些值越低越好。我们的命中率约为 3%，考虑到只留了一部电影，这其实并不坏。如果按评分值细分，你可以看到我们的命中率在较高预测上更好，这正是我们想要的。4.0\
  \ 阈值的累积命中率没有原始命中率低多少，这意味着我们很好地推荐了我们认为好的物品。`ARHR` 是 0.1，再次，这只是一个数字。它考虑了这些命中的排名，但老实说对于如此小的数据集，我们可能需要比实际存在更多的数据才能让这个数字非常有意义。再次，在有其他推荐系统进行比较之前，它没有真实价值。最后我们查看用户覆盖率，我们至少有一个\
  \ 4 星评分预测，而且非常高——这很好。但让我们看看我们的多样性和新颖性得分。多样性非常高，达到 0.96，新颖性似乎很高，平均流行排名为 491。记得我们的数据集中最初只有几千部电影。这告诉我们我们的算法正在深入进入“长尾”部分来获取推荐，这在现实世界中可能是一个问题。所以，尽管我们的准确性指标看起来还可以，但多样性和新颖性告诉我们我们正在推荐很多非常冷门的东西，这在尝试建立用户对系统的信任时可能是一个问题。人们通常希望看到一些看起来熟悉的东西，所以我预计这个特定算法在在线\
  \ A/B 测试中表现不会良好。但在你实际尝试之前，你永远不知道。无论如何，我们现在有了评估真实推荐系统的工作代码，并且已经学会了如何使用它。这将是我们在此基础上构建课程其余内容的重要基础。大家我们才刚刚开始，继续努力吧。\n\
  \n\n\n\n\n# 推荐引擎设计\n\n![](img/image828.jpg)\n\n所以，我们有了一段非常棒的评估推荐系统的代码，并打算在课程的剩余时间里尝试许多不同的模型。我们现在需要一个框架，让我们方便地实验新的推荐系统算法、对其进行评估，并将它们相互进行比较。SurpriseLib\
  \ 为我们提供了一些所需的内容，但我们将在此基础上进行构建。让我向你们展示我们将要使用的各种组件以及它们是如何整合在一起的。\n\n![](img/image834.jpg)\n\
  \nSurpriselib 有一个名为 `AlgoBase` 的 Python 基类。如果你不知道什么是基类，那么你可能是面向对象设计的新手。不过这个概念很容易理解。从根本上说，类只是组织在某个名称下的函数集合。该类还可以关联关联的变量。而且，你可以实例化一个类对象的实例，这让你能够以一个你可以操作的单一名称保留类函数及其变量中数据的副本。相信我，当我们看一些代码时，这会变得更有意义。\n\
  \n面向对象设计允许我们拥有基类，例如 `AlgoBase`，它包含了可以被继承该基类的其他类共享的函数和变量。例如，这里有一个继承自 `AlgoBase` 基类的\
  \ `SVD` 类。这意味着我们的 `SVD` 类可能有特定于 `SVD` 推荐算法的函数和数据，但它也可以访问 `AlgoBase` 基类定义的函数和数据。这只是保持我们所有不同推荐算法接口一致的一种方法。\n\
  \n例如，`AlgoBase` 基类定义了函数 `fit` 和 `test`，用于训练和测试每个算法。因此，无论实际算法是什么，我们都知道始终可以对它调用 `fit`\
  \ 或 `test`。`SVD`、`KNNBasic`、`SVDpp` 以及我们可能开发的任何继承自 `AlgoBase` 的自定义算法都可以以相同的方式使用。当在你尝试训练和评估许多不同的算法时，这会让事情变得简单得多，因为你可以使用相同的代码来完成。\n\
  \n这些只是内置在 surpriselib 中的推荐算法。`Custom` 并不是他们提供的，但这只是我用来说明的一种方式，即你可以编写自己的推荐算法并使其成为\
  \ surpriselib 框架的一部分——你不局限于他们提供的那些。\n\n![](img/image842.jpg)\n\n## 实现自定义算法\n\n那么，如何编写一个与\
