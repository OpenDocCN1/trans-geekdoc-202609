  ![](img/image852.jpg)\n\n## 评估框架\n\n现在，我们想要的不仅仅是预测评分。我们希望能够我们将之前在 `RecommenderMetrics`\
  \ 类中实现的所有评估指标应用到我们使用的算法上。为了实现这一点，我们将创建一个名为 `EvaluateAlgorithm` 的新类。它包含来自 surpriselib\
  \ 的算法，但引入了一个新函数 `evaluate`，对该算法运行 `RecommenderMetrics` 中的所有指标。这个类使得衡量给定算法的准确性、覆盖率等所有指标变得容易。它使用了我们写的\
  \ `RecommenderMetrics` 函数，这样我们就不重写所有这些。\n\n现在，为了以不同的方式评估推荐系统，我们需要将数据划分成训练集和测试集。这就是我们的\
  \ `EvaluationData` 类的作用——它接收一个可能来自 MovieLens 的数据集，并创建 `EvaluateAlgorithm` 类所需的所有训练/测试划分。我们可以通过为给定数据集创建一个\
  \ `EvaluationData` 实例开始，这将切分数据。然后我们可以通过用 `EvaluateAlgorithm` 包装这些算法，使用相同的评估数据测试许多不同的算法。我们随后在\
  \ `EvaluateAlgorithm` 上调用 `evaluate` 函数，传入我们的 `EvaluationData` 来衡量该算法的性能。看到是如何连接的了吗？使用数据集创建一个\
  \ `EvaluationData` 实例，为我们要评估的每个算法创建一个 `EvaluateAlgorithm`，使用相同的 `EvaluationData`\
  \ 对每个算法调用 `evaluate`。在底层，`EvaluateAlgorithm` 将使用我们在 `RecommenderMetrics` 中定义的所有函数来衡量准确性、命中率、新性和覆盖率。\n\
  \n![](img/image860.jpg)\n\n由于我们通常想要比较推荐算法，我们可以通过写一个类来处理所有的比较。理想情况下，我们把想要相互比较的算法提交到这个类中，让它处理所有事情。这就是我们的\
  \ `Evaluator` 类的功能。\n\n```python\nclass Evaluator:\n    def __init__(self, dataset):\n\
  \        self.evaluated_dataset = EvaluatedDataset(dataset)\n        self.algorithms\
  \ = []\n\n    def add_algorithm(self, algorithm):\n        # 这在 Evaluator 内部创建一个\
  \ EvaluatedAlgorithm\n        # 并将其添加到内部名为 \"algorithms\" 的列表中。\n        self.algorithms.append(EvaluatedAlgorithm(algorithm,\
  \ self.evaluated_dataset))\n\n    def evaluate(self):\n        # 它评估每个 EvaluatedAlgorithm\
  \ 并以\n        # 整洁的表格形式打印每一个的结果。\n        for algo in self.algorithms:\n       \
  \     algo.evaluate()\n```\n\n所以这种方法的迷在于，当你想要开始尝试新算法并相互测试时，你完全不需要使用 `EvaluatedAlgorithm`\
  \ 或 `EvaluationData` 类。你只需要使用这个 `Evaluator` 类，它的接口非常简单。\n\n![](img/image867.jpg)\n\
  \n我们费尽心思开发这个框架是因为我们可以这样做——这就是比较 `SVD` 算法和 `Random` 算法所需的全部代码，对两者运行我们拥有的每一个评估指标并进行比较。我们所做的只是加载\
  \ MovieLens 数据集，并将其传递给我们的 `Evaluator`。然后我们对 `SVD` 和 `Random` 算法调用 `add_algorithm`，调用\
  \ `evaluate()`，就完成了！\n\n![](img/image873.jpg)\n\n## 代码深度解析\n\n让我们深入代码以便更详细地看到它在做什么，并运行它看看它是如何工作的！\n\
