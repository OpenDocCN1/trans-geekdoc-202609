  md: '# Continuous Optimization for Data Science


    This section deals with such cases where computing the MLE is a hard task. However,
    assume for now that there exists another variable $x$, such that with $y$ and
    given $\theta$, has a joint likelihood function. Denote by $L(y, x; \theta)$ the
    resulting likelihood function, in this context as the complete likelihood function.
    Assume now that finding the MLE, given $(y, x)$, is easy; that is,


    ```

    arg max L(y, x; \theta),

    ```


    which is a function of both $y$ and $x$, is a doable task, which, for example,
    can be done by a straightforward differentiation. The snag here is that this is
    not the maximization problem we are facing since the realized $x$ is not given.
    The only thing that we know is the conditional of $x$ given $y$ (which in turn
    is a function of $\theta$), where $y$ is the data and $x$ is the missing data.
    The variables that correspond to the missing data are called latent variables.


    The solution is to use the expectation-maximization (EM) algorithm. It is not
    an off-the-shelf algorithm, due to the fact that it admits freedom in the latent
    random variables, denoted by $X$. It is sometimes more question of art, and common
    sense than a question of science.


    The algorithm itself runs as follows. Start with some $\theta_0$, and generate
    the following sequence $\theta_j, j \ge 1$, until convergence is achieved:


    ```

    $$\theta_{j+1} = \arg max_{\theta} \int x L(y, x;\theta) f_{X|Y=y,\theta_j}(dx),
    \quad j \ge 0$

    ```


    or, put differently,


    ```

    $$\theta_{j+1} = \arg max_{\theta} E_{X|Y=y,\theta_j}(\log L(y, X;\theta)). \quad
    (2.37)

    ```


    In the procedure, we describe in the following steps. First, let $y$ be the given
    data and assume that they do not change during the run of the procedure. Second,
    write the log of the complete likelihood function for any arbitrary value of the
    parameter $\theta$. Third, and this is the expectation part, find the expected
    value of this function (again, for any value of the parameter $\theta$) with respect
    to the latent variables given the data and the current value of the parameter
    $\theta_j$. Note that you still get a function of the parameter $\theta$. Finally,
    and this is the maximization part, derive the value of the parameter $\theta$
    that maximizes this function. Thus, $\theta_{j+1}$.


