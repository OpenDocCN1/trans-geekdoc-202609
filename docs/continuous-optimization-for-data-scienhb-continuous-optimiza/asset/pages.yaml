    Taking the derivatives with respect to $x$ and setting them to zero, we get that
    the FOCs are


    ```

    $$A^T Ax - A^T b = 0$$

    ```


    Observe that solving the least squares problem has been reduced to solving a problem
    of a system of linear equations with $n$ equations and $n$ decision variables.
    With the help of the full-rank assumption, we infer that they are solved by, and
    only by,


    ```

    $$x^* = (A^T A)^{-1} A^T b. \quad (2.13)$$

    ```


    Why is this a minimum point, and not, for example, a maximum point, is discussed
    in Section 2.4 below. Note that $^TA$ (which is free of $x$) is the Hessian of
    the objective function, and it is also a positive matrix. The optimal objective
    value, as can be seen after some algebra, is equal to


    ```

    $||(A^T A)^{-1} A^T b - b|| = |b^T (I - A(A^T A)^{-1} A^T)b|. \quad (2.14)$$

    ```


    The vector


    ```

    $$Ax^* = A(A^T A)^{-1} A^T b \quad (2.15)$$

    ```


    is the closest vector to $b$ out of all vectors that are in the linear subspace
    spanned by the columns of $A$, and it is referred to as the *projection* of $b$
    on this subspace. Naturally, $b - Ax^*$ is called the *residual*, while the optimal
    objective function value in (2.14) is the norm of the residual. This norm can
    be regarded as the distance between $b$ and the above-mentioned linear subspace.
    It is also possible to see, with some algebra, the projection and its residual
    are orthogonal, namely $(b - Ax^*)^T Ax^* = 0$. For more projections and residuals,
    e.g., Section 7.1 in [14]. In particular, see the alternative proof of (2.13),
    which does not use derivatives.


    **Remark.** The $(A^T A)^{-1} A^T$ is called in the literature *Moore-Penrose
    pseudo-inverse* of the matrix $A$, and it is usually denoted by $A^\dagger$:


    ```

    $$(A^T A)^{-1} A^T. \quad (2.16)$$

    ```


    This inverse exists for a full-rank tall matrix (namely a matrix for which the
    number of columns does not exceed the number of its rows). For more on this inverse,
    e.g., Chapter 7 of [14].


