    $\lambda\sum_{i=1}^m |x_i|$, known as the LASSO (least absolute shrinkage and
    selection operator).


    # 2.3.4 Logistic regression


    Looking again the regression analysis done above, we can see that for a future
    sampled individual, we will have input data of variables similar to any of the
    $A \in R^{n \times m}$ above, while using the regression to predict its $b$ value.
    But suppose that the $b$ variable is discrete, or to more specific, a binary yes
    or no variable. Now, the input on the right-hand side is, without loss of generality,
    $b_i \in \{-1, 1\}, 1 \le i \le m$. one possibility is to look whether $A_ix <
    0$ or $A_ix > 0$ and determine the value of $b_i, 1 \le i \le m$. A possible criterion
    to judge whether or $x$ is a good solution is to look at $\sum_{i=1}^m b_i sn(A_ix)$.
    The larger its value, the better. Indeed, any time that the model is correct for
    a given individual $i$, we get $x \in R^n, -n \le \sum_{i=1}^m b_i sn(A_ix) \le
    n$. This leads to a discrete optimization problem that is hard to solve and is
    also beyond the scope of this text.


    Another option is to optimize $f(\sum_{i=1}^m b_i A_ix)$ for some monotone and
    increasing continuous function $f: R^1 \to R^1$. Possible functions are $e^x$
    or $\log(1+e^x)$. The latter is quite popular among practitioners and called logistic
    regression. In summary, the optimization problem we face


