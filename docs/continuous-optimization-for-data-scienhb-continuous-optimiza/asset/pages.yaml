    Let $x_1^*, x_2^*$, and $x^*$ be the optimal solutions for the above three LPs
    and that order. By way of contradiction, assume that $c^T x^* > c_1^T x_1^* +
    c_2^T x_2^*$. This implies that $c_1^* x^* + c_2^* x^* > c_1^* x_1^* + c_2^* x_2^*$,
