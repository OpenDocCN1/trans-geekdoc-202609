    ```\n\n$A_i$ is the $i$th row of $A$, $1 \\leq i \\leq m$. Then, there are two\
    \ possibilities. The first is that $\\sum_{i=1}^{m-1} \\alpha_i b_i = b_m$ for\
    \ at least one of the series $\\alpha_i$, $1 \\leq i \\leq m-1$, which obeys (7.1),\
    \ in which case, the $m$th row is redundant: Any $x \\in R^n$ that meets the first\
    \ $m-1$ equality constraints also meets the mth. The second is that $\\sum_{i=1}^{m-1}\
    \ \\alpha_i b_i \\neq b_m$ for at least one of the series $\\alpha_i$, $1 \\leq\
    \ i \\leq m-1$, which obeying (7.1). In this case the program is not feasible.\n\
    \n> Definition\n**Definition 7.3.** Let $B \\in R^{m \times m}$ be a (square)\
    \ submatrix of $A$. Without loss of generality, assume that $B$ represents the\
    \ first $m$ columns of $A$. It is called a *basis* if $B^{-1}$ exists. The variables\
    \ associated with the basis $B$ are called the *basic variables*, and they are\
    \ denoted by $x_B \\in R^m$. The rest of the matrix $A$ is denoted by $N$, and\
    \ the associated variables are called the *non-basic variables*. Denote them by\
    \ $x_N \\in R^{n-m}$. Note that $x=(x_B, x_N)$. The *basic solution* associated\
    \ with the basis $B$ is $x_N = 0$ and $x_B = B^{-1}b$. The basis is called *feasible*\
    \ if $B^{-1}b \\geq 0$. Otherwise, it is called an *infeasible basis*.\n\n$^a$This\
    \ selection for $x_N$ and $x_B$ is in order to guarantee that $Ax = b$.\n\n$^b$Then\
    \ $x \\geq 0$.\n\nNote that the set of equality constraints can be written as\
    \ $Bx_b + Nx_N = b$. The following theorem is now immediate."
