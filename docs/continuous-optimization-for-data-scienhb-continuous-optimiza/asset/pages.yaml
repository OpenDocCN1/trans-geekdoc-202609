- pgno: 19
  md: '# Single-Variable Optimization


    2. Assume that $Y_i > 0, 1 \le i \le n$. Prove that the geometric mean of the
    series minimizes with respect to $y$, the function


    ```

    $$\sum_{i=1}^{n} (\log Y_i - \log y)^2$$

    ```


    3. Prove that the harmonic mean of the series minimizes, with respect to $y$,
    the function


    ```

    $$\sum_{i=1}^{n} \left(\frac{1}{Y_i} - \frac{1}{y}\right)^2$$

    ```


    **Example 3 (Cubic functions, see Figure 1.3).** $f(x) = \frac{1}{2}ax^3 + bx^2
    + cx + d$ for some constants $a \neq 0, b, c$, and then. $f''(x) = ax^2 + bx +
    c$ and $f''''(x) = 2ax + b$. There are three possibilities. The first is when
    $b^2 < 4ac$ and then no point satisfies the FOC for optimality, the second is
    when $b^2 = 4ac$ and then only one point, $-b/2a$, does. In this case, $f''''(-b/2a)
    = 0$, and therefore is not clear whether this is a minimum, a maximum, or neither.
    Yet, some algebra shows that this


    case


    ```

    $f''(x) = a \left(x + \frac{b}{2a}\right)^2$,

    ```


    and hence the function is monotone, either non-increasing or non-decreasing, depending
    on the sign of $a$. Thus, this is neither a minimum nor a maximum point, and in
    particular, we infer that the FOCs are not sufficient for proving the existence
    of either of these extreme points. Points that satisfy the FOCs but are not extreme
    points are referred to as *reflection points*. The third and final possibility
    is when $b^2 > 4ac$ and then two points satisfy the FOCs $f''(x) = 0$. They are,,


    ```

    $x_{1,2} = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

    ```


    It is easy to see that


    ```

    $f''''(x_{1,2}) = \pm\sqrt{b^2 - 4ac}$,

    ```


    where one of them is a local minimum while the other is a local maximum. If $a
    > 0$, the minimum is at the positive root, while if $a < 0$, the minimum is at
    the negative root.'
