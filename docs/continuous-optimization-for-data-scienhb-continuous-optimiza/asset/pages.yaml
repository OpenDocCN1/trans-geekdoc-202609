    # 1.3.4 Maximum likelihood estimators (MLE)


    Maximum likelihood estimation is a commonly used technique for estimating parameters
    defining a distribution. Specifically, one first assumes that the distribution
    of a random variable belongs to some family of distributions, each of which is
    characterized by a specific value for a parameter (or parameters). In reality,
    this parameter (or parameters) is not known, but nevertheless one is interested
    in estimating it. To this end, a random sample from the underlying distribution
    is collected, and based on the observed realizations, one estimates the parameter
    under question. A number of estimation techniques exist, one of which is maximum
    likelihood estimator. The idea and the practice behind it are explained in the
    following two examples


    **Example 1 (Bernoulli distribution).** Let $X_i, 1 \leq i \leq n, be n$ independent
    and identically distributed random variables, sometimes referred to as a random
    sample. Suppose that the common distribution of these random variables belongs
    to some family of distributions, each of which is characterized by a single-variable
    parameter. For example, suppose that $X_i \sim Ber(p)$, namely $X_i$ can take
    either the value of 1 or 0 with probability $p$ or $1-p$, respectively, $1 \leq
    i \leq n, 0 \leq p \leq 1$. Then, for any sequence of $x_i, x_i \in \{0,1\}, 1
    \leq i \leq n$,


    ```

    $P(X_1 = x_1, \dots, X_n = x_n) = \prod_{i=1}^n p^{x_i}(1-p)^{1-x_i} = p^{\sum_{i=1}^n
    x_i}(1-p)^{n-\sum_{i=1}^n x_i}.$

    ```


    In this setting, the focus is on the parameter defining the probability. This
    parameter is called the likelihood function and the likelihood function is the
    same as the one stated in (1.8), except that the possible realizations $x_i$ are
    replaced with $X_i, 1 \leq i \leq n$, making these probabilities random variables
    themselves.'
