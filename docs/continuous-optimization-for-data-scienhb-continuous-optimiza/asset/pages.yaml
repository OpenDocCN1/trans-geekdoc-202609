  md: '# The Simplex Method


    # 7.2 On Bases and Basic Solutions


    The notions of a basis and a basic solution were defined in the previous section.
    The simplex method, to be defined in the next section, will show that, one way
    or another, everything there is to know about a linear program can be derived
    from examining only its basic solutions. The following theorem is no exception.


    Theorem

    **Theorem 7.4.** A linear program is feasible if and only if it has a basic solution.


    **Proof.** The “if” part is of course trivial. What we next show is how to construct
    a basic solution from some other feasible solution. Specifically, let $x \neq
    0$ be a feasible solution, and without loss of generality, assume its first few
    entries are positive and the rest are zero. In particular, let $p \ge 1$ be such
    that $x_i > 0, i = 1, 2, \dots, p$, and $x_i = 0, i = p+1, \dots, n$. If the first
    $p$ columns of $A$ are linearly independent, we are done. Note that if $p \le
    m$, then by Assumption 1, some other columns of $A$ can be added to the first
    $p$ in order to form a basis. Otherwise, namely where $p > m$, let $\alpha_i,
