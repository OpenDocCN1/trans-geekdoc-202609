  md: 'might be helpful in refuting an optimality conjecture on a point that is not
    optimal, as well as leading to algorithms for finding the optimal solution.


    +   **Finite vs. infinite algorithms.** One usually wishes to have an algorithm
    that takes its function $f(x)$ and yields a point $x^* \in \arg\min_{x\in\mathbb{R}^n}
    f(x)$ as its output. As we have seen in the previous chapter where $n$ was assumed
    to be 1, this is usually too much to ask. A modest request is that the algorithm
    generate a series of points with $x^*$ as its limit. As an algorithm, it is assumed
    to be *iterative*, and the generated points are looked at as *approximations*
    to $x^*$. Again, having a finite convergence is too good to be true, and convergence
    is usually reached only at the limit, at infinity. Possessing a convergence property
    or not is, of course, not a question that the algorithm can answer. Hence, this
    issue needs to be resolved theoretically, i.e., in a mathematical way, normally
    prior to running the algorithm. Once the answer is positive, we can halt the algorithm
    somewhere in the process of generating points. This termination takes place once
    some *tolerance* criterion is met. By, we mean that not much change has taken
    place during the few iterations in the generated series of points and/or the values
    of the objective function. The hope is that if the tolerance criterion is met,
    then the current point is close enough to the optimal. In a general and priori,
    there is no guarantee that this is the case. However, it might be the case for
    some specific algorithms. An alternative approach is to limit a priori number
    of iterations in order to minimize the level of uncertainty. This was done above
    in the Fibonacci search and will not be considered again.


    +   **Local vs. global optimization.** Ideally, one is looking for $\arg\min_{x\in\mathbb{R}^n}
    f(x)$. Yet, what we have learned from the previous section is given, a point that
    is a candidate for the optimal, what one usually checks for local optimization,
    namely whether the point is in the (possibly immediate) vicinity of the point.
    As the saying goes, "All politics is local.\^d$ The same is the case here, and
    unless some strong assumptions are imposed, one cannot deduce that a point was
    discovered to be locally optimal is also globally optimal. The same can be said
    about convergence: At times convergence can be proved only for local optimization,
    not for global optimization.


    > $d$Attributed to Tip O''Neill, who was the speaker of the US House of Representatives
    in 1977–1987.'
