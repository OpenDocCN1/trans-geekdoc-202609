  md: '# Definition


    Definition 7.2.

    1. Any vector $x$ in $R^n$ is called a solution. If $Ax = b$ and $x \geq 0$, then
    it is called a *feasible solution*. Finally, $x^*$ is called an *optimal solution*
    if it is feasible and if $c^Tx^* \leq c^Tx$ for any feasible solution $x$.

    2. A linear program is called *feasible* if it has a feasible solution. Otherwise,
    it is called *infeasible*.

    3. A linear program is called *unbounded* if it is feasible and if an optimal
    solution does not exist.


    **Remark.** Logic dictates that a fourth option is missing from the above set
    of definitions, namely that the LP is feasible and bounded but does not have an
    optimal solution. We will show later that if a linear program is feasible and
    has no optimal solution, then one can find a feasible solution whose objective
    value is as low as one wishes. In other words, is *unbounded*. Also note that
    a necessary condition for unboundedness is that the feasible set $X \subseteq
    R^n$ is said to be bounded if there exists a finite (positive) constant $b$ such
    that $|x_i| \leq b$, $1 \leq i \leq n$, for any $x \in X$. Otherwise, it is said
    to be unbounded.


    # Theorem


    **Theorem 7.1.** *For a standard linear program, the following conditions must
    be satisfied*

    1. The set of feasible solutions is convex.

    2. The set of optimal solutions is convex.

    3. The set of right-hand side vectors for which $x$ is feasible (respectively,
    optimal) is convex.

    4. The set of cost vectors for which $x$ is feasible (respectively, optimal) is
    convex.


    # Exercise 7.1


    Prove Theorem 7.1.

    The main purpose of this chapter is to introduce the simplex method for solving
    LPs. To this end, we impose some technical assumptions.'
