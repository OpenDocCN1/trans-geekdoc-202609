  md: 'duality approach, is to deal first with the new variables, called the dual
    variables.


    To this end, define the function $\phi(\lambda) : R^m \rightarrow R$, called the
    dual function:


    ```

    $\phi(\lambda) = \min_{x \in R^n} L(x, \lambda) = \min_{x \in R^n} \{f(x) - \lambda^T
    g(x)\}$.

    ```


    Note that this function is defined via an unconstrained optimization problem.


    Lemma

    Lemma 4.1. The dual function is concave.


    Proof. For $\alpha$ with $0 \leq \alpha \leq 1$,


    ```

    $\phi(\alpha\lambda_1 + (1 - \alpha)\lambda_2)$\

    $= \min_{x \in R^n} \{f(x) - (\alpha\lambda_1 + (1 - \alpha)\lambda_2)^T g(x)\}$$\n$=
    \min_{x \in R^n} {\alpha f(x) - \lambda_1^T g(x) + (1 - \alpha)(f(x) - \lambda_2^T
    g(x))}$

    $\geq \min_{x \in R^n} \{f(x) - \lambda_1^T g(x)\} + (1 - \alpha) \min_{x \in
    R^n} \{f(x) - \lambda_2^T g(x)\}$

    $= \alpha\phi(\lambda_1) + (1 - \alpha)\phi(\lambda_2)$.

    ```


    The dual optimization problem is


    ```

    $\max_{\lambda \in R^m} \phi(\lambda)$.

    ```


    The following theorem is known as the weak duality theorem.


    Theorem

    Theorem 4.6. For any $\lambda \in R^m$ and for any feasible $x \in R^n$, $\phi(\lambda)
    \leq f(x)$.


    Proof. Denote by $x^*$ the globally optimal solution to the primal problem. For
    any $\lambda \in R^m$ and for primal feasible $x \in R^n$,


    ```

    $\phi(\lambda) = \min_{x \in R^n} \{f(x) - \lambda^T g(x)\} \leq f(x^*) - \lambda^T
    g(x^*) = f(x^*)$.

    ```'
