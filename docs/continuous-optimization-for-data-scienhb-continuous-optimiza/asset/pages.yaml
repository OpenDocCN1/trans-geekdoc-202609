    # 7.7 The Representation Theorem


    Combining Theorem 7.4 leads to the conclusion that an LP is feasible if and only
    if it possesses at least one extreme point. On the other hand, as the number of
    feasible bases is finite, the same is the case with the number of extreme points.
    Consider the (non-empty) set of extreme points. Clearly, any convex combination
    of them is also a feasible solution. Now comes the question of whether other feasible
    solutions exist. We claim, without proof, that no other solutions exist if and
    only if the feasible set is bounded.


    To determine the actual case of an unbounded feasible set, we need to define the
    concept of a ray. Specifically, a non-zero vector $d\in R^n$ is said to be a ray
    if $dge0$ and $Ad=0$. It is easy to see that if $x$ is feasible and $d$ is a ray
    then $x+\alpha d$ is feasible for any scalar $\alphage0$. See Exercise 7.7. It
    is also easy to see that the set of rays is a convex set. It is not a bounded
    set (for, example, that $d$ is a ray, then $Ad$ is also a ray for any $\alphage0$),
    but since it is only the direction of $d$ that matters (and not its magnitude),
    we can make it bounded by imposing the constraint $\sum_{i=1}^n d_i=1\u2084d_i=1$.
    This newly bounded set contains a finite number of extreme points, which are called
    extreme rays.


    This leads us to the *representation theorem*, which we state without proof. A
    detailed proof can be found in [2].


    Theorem


    **Theorem 7.11.** Let $x^i, 1\le i\le l^x$, the set of extreme points of the feasible
    set of an LP and let $d^i, 1\le i\le l^d$, be the set of extreme rays. Then, $l^x\ge1$
    and $l^d\ge0$. Also, for any LP feasible solution $x$, there exist non-negative
    vectors $\alpha\in R^{l^x}$ and $\mu\in R^{l^d}$ with $\sum_{i=1}^{l^x}\alpha_i=1$
    such that


    ```

    $x=\sum_{i=1}^{l^x}\alpha_ix^i+\sum_{i=1}^{l^d}\mu_id^i$$

    ```'
