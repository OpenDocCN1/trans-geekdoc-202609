  md: '# Solutions to Exercises


    +   - $a + b = 1.01$,

    - $a + b \le 1$,

    - $a + b \ge 1$.


    Describe in words, without doing any further analysis, what you can infer from
    these three cases from the original version of the program.


    # Solution:


    (a) The Lagrangian function is


    ```

    $L(a, b, \lambda) = \int_{0}^{1} (x^2 - ax - b)^2 dx - \lambda(a + b - 1).

    ```


    For a given $x$, let $f(a, b) = (x^2 - ax - b)^2$. Then,


    ```

    $$\nabla f(a, b) = \begin{bmatrix} -2x(x^2 - ax - b) \ -2(x^2 - ax - b) \end{bmatrix}$.

    ```


    Due to the possibility of interchanging the order of derivatives and integrals
    here, the FOCs are


    ```

    $\int_{0}^{1} (-2x^3 + 2ax^2 + 2bx) dx - \lambda = 0$,

    ```


    and


    ```

    $\int_{0}^{1} (-2x^2 + 2ax + 2b) dx - \lambda = 0$,

    ```


    which, coupled with the equality constraint, are


    ```

    $-\frac{1}{2} + \frac{2}{3}a - \lambda = 0$,

    $-\frac{2}{3} + a + 2b - \lambda = 0$,

    ```


    ```

    $a + b = 1$.

    ```


    The Hessian of $f(a, b)$ is


    ```

    $$\nabla^2 f(a, b) = \begin{bmatrix} 2x^2 & 2x \ 2x & 2 \end{bmatrix}$.

    ```


    which is a positive matrix.'
