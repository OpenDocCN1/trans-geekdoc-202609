  md: '# Single-Variable Optimization


    # Theorem


    Theorem 1.4. Let $X$ be a random variable. Denote by $M_X(s)$ its moment-generating
    function, namely $M_X(s) = E(e^{sX})$. Then, for any $a$,


    $P(X \geq a) \leq e^{-\phi(a)}$,


    where


    $\phi(a) = \max_{s \geq 0} \{sa - \log M_X(s)\}$.


    Proof. Let $s \geq 0$ and define the random variable $Y_a$, which can only receive
    the following values:


    $Y_a = \begin{cases} 0, & X < a, \ e^{sa}, & X \geq a. \end{cases}$


    Clearly, $E(Y_a) = e^{sa}P(X \geq a)$. Since $Y_a \leq e^{sX}$, we get that $E(Y_a)
    \leq M_X(s)$. Combining all of the value, we can conclude that


    $P(X \geq a) \leq e^{-sa}M_X(s) = e^{-(sa-\log M_X(s))}$,


    Since the above holds for any $s$, it holds for its minimum value with respect
    to $s$. In other words,


    $P(X \geq a) \leq \min_{s \geq 0}\{e^{-(sa-\log M_X(s))\} = e^{-\max_{s \geq 0}\{sa-\log
    M_X(s)\}}$


    as required.


    **Example (Standard normal distribution).** In the case where $X$ follows a standard
    normal distribution, $M_X(s) = e^{s^2/2}$. See, e.g., [19, p. 109]. Then, $\phi(a)
    = \max_{s \geq 0}\{sa - s^2/2\}$. It is easily seen that for $a \geq 0$, $\phi(a)
    = a^2/2$ as the maximization defining it is attained at $s = a$. Hence,


    $P(X \geq a) \leq e^{-a^2/2}, \quad a \geq 0$.


    As we see from the example, Chernoff bound is useful in those cases where there
    is no explicit expression for the cumulative distribution function, as is the
    case with normally distributed random variables, while the corresponding moment
    generating function is readily accessible.'
