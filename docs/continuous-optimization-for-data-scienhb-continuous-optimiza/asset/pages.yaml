  md: '# Single-Variable Optimization


    **Remark.** The third property given above can be generalized as follows. Let
    $x_1, x_2, \dots, x_n$ be a series of real numbers and let $\alpha_1, \alpha_2,
    \dots, \alpha_n$ be nonnegative numbers that sum up to 1. If $f(x)$ is convex,


    ```

    $f\left(\sum_{i=1}^{n} \alpha_i x_i\right) \leq f\left(\sum_{i=1}^{n} \alpha_i
    f(x_i)\right). \quad (1.3)$

    ```


    **Proof.** This can be proved by induction. It, holds for the case of $n$ (by
    definition). Then, using the already known case when two point involve, where
    the two points are $\sum_{i=1}^{n-1} \frac{\alpha_i}{1-\alpha_n}x_i$ and $x_n$,
    we have


    ```

    $f\left(\sum_{i=1}^{n} \alpha_i x_i\right) = f\left((1-\alpha_n) \sum_{i=1}^{n-1}
    \frac{\alpha_i}{1-\alpha_n}x_i + \alpha_n x_n\right)\n\leq (1-\alpha_n) f\left(\sum_{i=1}^{n-1}
    \frac{\alpha_i}{1-\alpha_n}x_i\right) + \alpha_n f(x_n).$

    ```


    As $\sum_{i=1}^{n-1} \frac{\alpha_i}{1-\alpha_n} = 1$, we invoke the induction
    hypothesis, and hence conclude that right-hand side of the inequality is less
    than equal to


    ```

    $(1-\alpha_n) \sum_{i=1}^{n-1} \frac{\alpha_i}{1-\alpha_n} f(x_i) + \alpha_n f(x_n)
    = \sum_{i=1}^{n-1} \alpha_i f(x_i) + \alpha_n f(x_n) = \sum_{i=1}^{n} \alpha_i
    f(x_i),$

    ```


    as required.


    The inequality in (1.3) is known in probability theory as the Jensen inequality,
    and it states the following: Let $X$ be a random variable. Then, for a convex
    function $f: R \to R, f(E(X)) \leq E(f(X))$, where the operation $E(\cdot)$ returns
    the expected value. In this case, $\alpha_i$ stands for the probability that the
    random variable $X$ takes the value of $x_i$, $1 \leq i \leq n$.


    **Remark.** The fourth property stated above for convex functions is usually referred
    to as increasing marginal costs or diseconomies of scale. Indeed, for such functions,
    the larger the original quantity one possesses, the greater the effect that adding
    a constant to the input has on total cost.


    **Example.** For some positive constant $a$, consider the cost function $f(x)
    = 1/(a-x), 0 \leq x < a$. It is easy to see that $f''(x) = 1/(a-x)^2$ and that
    $f''''(x) = 2/(a-x)^3, 0 \leq x < a$. Thus, we have a monotone increasing function.
    One can observe as $x$ approaches the bound of $a$, the total cost increases.
    More than that: The rate of this increases, increases.'
