  md: '# Continuous Optimization for Data Science


    # 2.3 Examples


    # 2.3.1 Maximum likelihood estimators for normal distributions


    X $\sim N(\mu, \sigma^2)$ and suppose that one looks for an MLE for the parameters
    $\mu$ and $\sigma^2$ based on a random sample $X_i, 1 \le i \le n$. Specifically,
    the likelihood function equals


    ```

    $$\prod_{i=1}^n \frac{1}{\sqrt{2\pi}\sigma} e^{-\frac{(X_i-\\mu)^2}{2\sigma^2}}
    = \left(\frac{1}{2\pi\sigma^2}\right)^{n/2} e^{-\frac{1}{2\sigma^2}\sum_{i=1}^n(X_i-\\mu)^2}$

    ```


    Its logarithm, we ignore the two terms that are not functions of $\mu$ and/or
    $\sigma^2$, equals


    ```

    $-\frac{n}{2} \log \sigma^2 - \frac{1}{2\sigma^2}\sum_{i=1}^n(X_i-\\mu)^2$

    ```


    Taking derivatives, once with respect to $\mu$ and once with respect to $\sigma^2$
    (note that the derivative is not with respect to $\sigma^2$),


    ```

    $$\frac{1}{\sigma^2}\sum_{i=1}^n(X_i-\\mu) = (2.10)$

    ```


    and


    ```

    $-\frac{n}{2} \sigma^2 + \frac{1}{2(\sigma^2)^2}\sum_{i=1}^n(X_i-\\mu)^2 = (2.11)$

    ```


    The MLEs are derived by setting the above two expressions with zero. It is immediate
    that $\hat{\mu} = \overline{X}$, which is the sample mean, and that $\sigma^2
    = \frac{1}{n}\sum_{i=1}^n(X_i-\\overline{X})^2 = \frac{1}{n}\sum_{i=1}^n(X_i-\\overline{X})^2$.
    Note that if $\sigma^2$ given, the MLE for $\mu$ would have been the same. On
    the other hand, if $\mu$ given, the MLE for $\sigma^2$ would have been $\frac{1}{n}\sum_{i=1}^n(X_i-\\mu)^2$.
    In Section 2.4, it is proved that this stationary point is a local maximum point.


