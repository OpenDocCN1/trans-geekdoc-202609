    # 4.2 First-Order Conditions (FOCs): Theory and Examples


    Recall the definition for a stationary point $x$ for the function $f: R^n \to
    R$; $

    abla f(x)^T d = 0$. The point of departure was the requirement that $

    abla f(x)^T d = 0$ for any direction $d \in R^n$ (which is met if and only if
    $

    abla f(x)= 0$). When switched to optimization under constraints, this requirement
    is relaxed to only feasible directions, namely for directions $d \in R^n$ that
    satisfy $

    abla g_i(x)^T d=0, 1 \le i \le m$. An equivalent condition is stated in Theorem
    4.1 Below. But first, we need the following definition.


    Definition

    Definition 4.1. A feasible point is said to be regular if the $m$ vectors $

    abla g_i(x^*) \in R^n, 1 \le i \le m$, are linearly independent.


    Theorem

    Theorem 4.1. Consider the following optimization problem:

    $$

    min_{x \in R^n} f(x)\ns.t. \quad g_i(x) = 0, \quad 1 \le i \le m,

    $$

    for some $m \le n$. Assume $x^*$ to be a feasible point, namely $g_i(x^*) = 0,
    1 \le i \le m$. Also, assume that $x^*$ is regular. Then, a necessary condition
    for the stationarity of $x^*$ is that there exists a vector $\lambda \in R^m$
    such that

    $$\nabla f(x^*) - \sum_{i=1}^m \lambda_i \nabla g_i(x^*) = 0 \in R^n. \quad (4.2)$$

    In words, $\nabla f(x^*)$ lies in the linear subspace spanned by $\nabla g_i(x^*),
    1 \le i \le m$.


    Proof. An informal explanation of this theorem appears in the previous section.
    A rigorous proof appears in Section 4.2.2.'
