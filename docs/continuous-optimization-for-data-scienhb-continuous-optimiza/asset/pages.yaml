    # 3.3 Queueing Examples


    Under certain assumptions that we will not state here (for details, e.g., [13,
    p. 61]), it is well-known that the mean queue length in a single-server queue
    with a Poisson arrival process with a rate of $\lambda$ and exponential service
    times with mean $\mu^{-1}$, where $\lambda < \mu$, equals


    ```

    $$\frac{\lambda}{\mu - \lambda}$. (3.4)$

    ```


    This value includes the cumner service in $\lambda$. Note that $\lambda/(\mu-\lambda)$
    is a convex function in both $\lambda$ and $\mu$. Moreover, it is monotone increasing
    in $\lambda$ and monotone decreasing in $\mu$. Also, $1/(\mu-\lambda)$ is the
    mean time in the system (service inclusive) for an individual customer. This is
    a convex function in each of its two variables. In the next two subsections, we
    consider optimization problems regarding multi-server queues.


    # 3.3.1 Optimal distribution of the service rate


    Suppose that there exists a set of $n$ servers. The arrival rate at server $i$
    is known to be $\lambda_i$, $1 \leq i \leq n$. Suppose the total service rate
    of $\mu$ needs to be split among the $n$ servers. For stability, it is required
    that $\mu > \sum_{i=1}^n \lambda_i$. Denote by $x_i$, the decision variable of
    the service rate which is dedicated for server $i$, $1 \leq i \leq n$. The optimization
    problem of minimizing the sum of the $n$ queue lengths is then


    ```

    $$\min_{x_1,\dots,x_n} \sum_{i=1}^n \frac{\lambda_i}{x_i - \lambda_i}$,$\ns.t.
    $\sum_{i=1}^n x_i = \mu$,$\nx_i > \lambda_i, \quad 1 \leq i \leq n.$$$

    ```


