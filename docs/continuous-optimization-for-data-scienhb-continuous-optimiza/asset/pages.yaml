    \ $x_2 = 1/7$, and $x_3 = 0$. The corresponding optimal objective value is 29/7.\n\
    \n# 7.5 Updating $B^{-1}$\n\nThe Simplex procedure calls for a matrix inversion\
    \ iteration. Usually, the inversion of an $m \times m$ matrix needs a number of\
    \ numerical operations that are proportional to $m^3$. However, basic matrices\
    \ differ only in one column. Next, it will be shown that the previous $B^{-1}$\
    \ is given, the computational effort needed in order to compute the new $B^{-1}$\
    \ is proportional to $m^2$. We show this in two equivalent ways. The first is\
    \ what is usually referred to as a pivot step. The second is the *Sherman-Morrison\
    \ formula* for rank-one updates. Details on both procedures are given next.\n\n\
    # 7.5.1 Pivot steps\n\nInversion of matrices is sometimes performed by applying\
    \ *elementary row operations*. In short, $(B, I) \rightarrow (I, B^{-1})$. Apply\
    \ the same operations on the rows of the matrix $N$ and get $(B, I, N) \rightarrow\
    \ (I, B^{-1}, B^{-1}N)$. Since one is interested in the inversion of the new basic\
    \ matrix, interchange the columns $i^* \\in B$ and $j \\in N$ (but apply the same\
    \ operations as before). This procedure will change the identity matrix to $B^{-1}N^j$\
    \ where $N^j$ is the column corresponding to the previously nonbasic variable\
    \ $x_j$. But otherwise, the identity matrix stays intact. To get the inversion\
    \ of the new basis, we have to apply the needed row operations in order to make\
    \ this non-unit column a unit-one column. We then check $(B^{-1}N)_{*,j}$, which\
    \ appears on the diagonal of the leftmost $m \times m$ entry in the matrix $B^{-1}$.\
    \ In particular, since it has a non-zero value, the operations will lead to the\
    \ desired unit vector.$^1$ Then, we perform $m$ elementary row operations, each\
    \ requiring a computational effort\n\n> $^hThere are more sophisticated algorithms\
    \ with reduced complexity but they are beyond the scope of this book.\n\n> $^1$The\
    \ fact that a pivot entry has a non-zero value proves that the new set of columns\
    \ is invertible, hence it constitutes a basis."
