    \ = $\\min_\\alpha f(x_k - \\alpha\nabla f(x_k))$. In particular,\n\n```\n$\\\
    frac{d}{d\\alpha}f(x_k - \\alpha\nabla f(x_k))|_{\\alpha=\\alpha^*} = 0$.\n```\n\
    \nBut the chain rule,\n\n```\n$\\frac{d}{d\\alpha}f(x_k - \\alpha\nabla f(x_k))\
    \ = -\nabla f(x_k)^T\nabla f(x_k - \\alpha x_k)$,\n```\n\nwhich as $\\alpha =\
    \ \\alpha^*$ equals zero. Hence,\n\n```\n$\nabla f(x_k)^T\nabla f(x_k - \\alpha\
    \ x_k) = \nabla f(x_k)^T\nabla f(x_{k+1}) = 0$.\n```\n\nSuppose $\\alpha^* > 0$\
