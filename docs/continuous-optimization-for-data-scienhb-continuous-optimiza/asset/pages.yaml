  md: '# Solutions to Exercises


    # Solution:


    (a) $\omega_i^T Q \omega_i = \omega_i^T \lambda_i \omega_i = \lambda_i \|\omega_i\|^2$.
    Note that $||\omega_i|| > 0$. The whole term is therefore positive if and only
    if $\lambda_i > 0$.


    (b) Suppose, without loss of generality, that only $k \leq n$ eigenvectors are
    positively shaped, indexed by $\omega_1, \dots, \omega_k$. We need to show that


    ```

    $$\left(\sum_{i=1}^k \alpha_i \omega_i\right) Q \left(\sum_{i=1}^k \alpha_i \omega_i\right)
    \geq 0$

    ```


    for any set of coefficients $\alpha_1, \dots, \alpha_k$. Indeed,


    ```

    $$\left(\sum_{i=1}^k \alpha_i \omega_i\right)^T \left(\sum_{i=1}^k \alpha_i \omega_i\right)
