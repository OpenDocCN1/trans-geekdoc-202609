  md: 'Remark. Since final value $\alpha$ is 0.5, we get that at the final iteration

    the two mid-points, $c$ and $d$, coincide. Thus, in order to proceed to the

    terminal iteration, one of the mid points needs to be perturbed by a bit.


    We state the following procedure formally.


    # Fibonacci search algorithm


    **Input:** $[a, b]$ (original uncertainty interval) and $N$ (number of function
    val-uations.)


    **Output:** The terminal uncertainty interval.


    **Initialization:** $\alpha = F_{N-1}/F_N, c = a+(1-\alpha)(b-a)$, and $d = a+\alpha(b-a)$.


    **Iterative part:** For $k=2$ until $k=N-2$ do


    Let $\alpha = F_{N-k}/F_{N-k+1}$.

    If $f(c) > f(d)$, $a \leftarrow c, c \leftarrow d$ and $b \leftarrow b$ (the right
    subinterval), and $d \leftarrow a+\alpha(b-a)$.nOtherwise, $a \leftarrow b, b
    \leftarrow d$ and $d \leftarrow c$ (the left subinterval), and $c \leftarrow a+(1-\alpha)(b-a)$
    (the midpoint).

    $k \leftarrow k+1$, REPEAT.


    **Print:** "The terminal uncertainty interval is $[a, b]$ and the minimum com-puted
    value is $min\{f(a), f(c), f(d), f(b)\"."


    # A numerical example


    Consider the function $f(x)=x^6+2x^5-3x^4+4x^3-5x^2-6x$ with an initial uncertainty
    interval $[0, 5]$. Note that $f(x)$ is quasi-convex in this interval. Suppose
    that one has a budget for $N=6$ function valuations.

    Since $F_6=8$, this will lead to a terminal uncertainty interval with a width
    of $(5-0)/8=0.625$. We get details on the procedure.


    +   (1) The original value of $\alpha$ is $F_5/F_6=5/8=0.625$. The four points
    considered are $a=0, c=0+(1-0.625)(5-0)=1.875, d=0+0.625(5-0)=3.125$, and $b=5$.
    The corresponding function values are $f(c)=f(1.875)=50.261$ and $f(d)=f(3.125)=1295.759$.
    Observe that $f(c)<f(d)$.


    +   (2) Since $f(c)<f(d)$, the next uncertainty interval is the left subinterval,
    named $[a,d]=[0,3]$. Also, $\alpha=F_4/F_5=3/5=0.6$. Then, $a=0, c=0+(1-0.6)(3.125-0)=1.25,
    d=1.875$, and $b=3.125$. The new computed function value is $f(c)=f(1.25)=-4.906$.
    Observe that $f(c)<f(d)$.


    +   (3) Since $f(c)<f(d)$, the next uncertainty interval is the left subinterval,
    named $[a,d]=[0,1.8]$. Also, $\alpha=F_3/F_4=2/3=0.666$. Then, $a=0, c=0+(1-0.666)(1.875-0)=0.625,
    d=1.25$, and $b=1.875.'
