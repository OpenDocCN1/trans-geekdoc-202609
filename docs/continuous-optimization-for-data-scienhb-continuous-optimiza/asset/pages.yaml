- pgno: 268
  md: '2. The derivative with respect to $x_i$ of the objective function with respect
    to $x_i$ equals


    $$\frac{\mu_i^2}{(x_i+\mu_i)^2}, \quad 1 \leq i \leq n. \quad (3.15)$


    The second derivative of the objective function with respect to $x_i$ equals


    $$-2\cdot\frac{\mu_i^2}{(x_i+\mu_i)^3}, \quad 1 \leq i \leq n.$


    Since we have a separable function, the mixed derivatives are zero. Hence, the
    Hessian matrix is negative, implying that the objective function is concave.


    3. Joining a queue for a cluster server leads to a probability of one receiving
    service, which is better than joining the queue of any open server.


    4. Denote by $\alpha$ the common derivative. Then, from (3.15), we get that


    $x_i = \frac{\mu_i}{\sqrt{\alpha}} - \mu_i, \quad 1 \leq i \leq n.$


    Plugging this in the equality constraint leads to an equation in $\sqrt{\alpha}$.
    Solving this equation yields


    $$\alpha = \left(\frac{\sum_{i=1}^n \mu_i}{\lambda + \sum_{i=1}^n \mu_i}\right)^2.
    \quad (3.16)$


    Therefore,


    $x_i = \mu_i \left(\frac{\lambda + \sum_{j=1}^n \mu_j}{\mu_j} - 1\right) = \mu_i
    \frac{\lambda}{\sum_{j=1}^n \mu_j}, \quad 1 \leq i \leq n.$


    5. Plugging this into the objective function, and we get that the optimal value
    equals


    $$\frac{\sum_{i=1}^n \mu_i}{\lambda + \sum_{i=1}^n \mu_i}.$


    6. The derivative of the above optimal objective value is easily seen to be equal
    to


    $$\left(\frac{\sum_{i=1}^n \mu_i}{\lambda + \sum_{i=1}^n \mu_i}\right)^2,$


    which in fact, as can be seen from (3.16), is equal to common derivative. As we
    will see in the sensitivity analysis section, this is not a coincidence.'
