    A straightforward generalization of (1.4) for the case where $n=2$ is that for
    any two non-negative numbers $x$ and $y$,


    ```

    $x^ay^{1-\alpha} \leq ax + (1-\alpha)y, \quad 0 \leq \alpha \leq 1. \quad (1.6)$

    ```


    Assume now $a_i, b_i, 1 \leq i \leq n$, are two series each consists of $n$ non-negative
    numbers. Also, suppose $p > 1$ and $q > 1$ satisfy $1/p+1/q=1$. For some $i, 1
    \leq i \leq n$, take


    ```

    $x = \frac{a_i^p}{\sum_{j=1}^n a_j^p} \quad \text{and} \quad y = \frac{b_i^q}{\sum_{j=1}^n
    b_j^q}$

    ```


    and invoke it in (1.6) with $\alpha=1/p$ and $1-\alpha=1/q$. We get that


    ```

    $$\left(\\frac{a_i^p}{\sum_{j=1}^n a_j^p}\right)^{\frac{1}{p}} \left(\\frac{b_i^q}{\sum_{j=1}^n
    b_j^q}\right)^{\frac{1}{q}} \leq \frac{1}{p} \frac{a_i^p}{\sum_{j=1}^n a_j^p}
    + \frac{1}{q} \frac{b_i^q}{\sum_{j=1}^n b_j^q}$

    ```


    Summing up the above with respect to $i$ yields


    ```

    $$\sum_{i=1}^n a_i b_i \leq \left(\\sum_{i=1}^n a_i^p\right)^{\frac{1}{p}} \left(\\sum_{i=1}^n
    b_i^q\right)^{\frac{1}{q}}$

    ```


    which is Hölder’s inequality. For the case $p=2$, we get the well-known Cauchy-Schwarz
    inequality:


    ```

    $$\sum_{i=1}^n a_i b_i \leq \sqrt{\sum_{i=1}^n a_i^2} \sqrt{\sum_{i=1}^n b_i^2}.
