    \nThe analysis is simple if the change takes place in a non-basic variable: There\
    \ is no limit on how much its coefficient can increase, while its (non-negative)\
    \ reduced cost coincides with the amount by which this coefficient decreases.\
    \ Indeed, decreasing the cost coefficient further makes the reduced cost negative,\
    \ and hence as a result, this variable is now added to the basis, and the basis\
    \ changes.\n\nIf the change is in a basic variable, the analysis should follow\
    \ the same lines of our above analysis regarding a change in the right-hand side\
    \ vector: Specifically, a change from $c_B^T$ to $c_B^T + \beta e_i$, with $\b\
    eta > 0$, does not affect the optimality of the basis if and only for **all**\
    \ non-basic variables, the reduced cost stays non-negative,\n\n```\n$c_j - (c_B^T\
