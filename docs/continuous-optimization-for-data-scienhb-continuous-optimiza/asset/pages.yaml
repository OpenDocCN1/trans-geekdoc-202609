    point $i$ is said to be above (respectively, below) the hyperplane if $a^T x_i
    - b > 0$ (respectively, $a^T x_i - b = 0, 1 \le i \le m$). In the former case,
    let $y_i = 1$, and in the latter, let $y_i = -1, 1 \le i \le m$. Reversing the
    search, suppose that the values of $y_i, 1 \le i \le m$, are given, and one looks
    for such a hyperplane. In most cases, when the data is random, a hyperplane does
    not exist. However, it does exist when the $m$ points can be decomposed into two
    classes. In such cases, the hyperplane separates one class of points from the
    other. Admittedly, this is a tautology. See Figure 5.1 for the case where $n=2$.


    Once such a hyperplane exists, it is normal that many, in infinitely many, such
    hyperplanes exist. The focus is on the one that separates them the most in a sense
    that will be made precise shortly. Of course, this concept calls for a definition,
    first note that $a^T x_i - b \ge C_1$ for all points in the first class, with
    $C_1 > 0$. Likewise, $a^T x_i - b \le -C_2$ for $C_2 > 0$ for all points in the
    second class. This can be stated as $y_i(a^T x_i - b) \ge \min(C_1, C_2), 1 \le
    i \le m$. Without loss of generality, we can replace the right-hand side value
    without (otherwise, we divide all entries in $a$ and $b$ by the right-hand side
    without changing the hyperplane). Minding this constant, we find in fact we get
    two parallel hyperplanes. One is $a^T x - b - 1 = 0$, where all points from the
    first class are on or above it. The other hyperplane is $a^T x - b + 1 = 0$, where
    all points from the second class are on or below it.


    Our objective is to find the pair of $a \in \mathbb{R}^n$ and $b \in \mathbb{R}^1$,
