    The choice we suggest here is optimal for the minimax criterion: In the worst
    case, we are guaranteed that the uncertainty interval is not longer than $1/(n+1)$.


    This search for optimal points is an offline (or predetermined) search due to
    the fact that all points looked for are decided in advance. But perhaps an online
    search would be better. By that, we mean that for a given $n$, we evaluate the
