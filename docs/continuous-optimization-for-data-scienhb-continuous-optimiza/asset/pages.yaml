    returns $-\infty$.


    To summarize, the dual problem is the following linear program (LP):


    ```

    $$\max_{\lambda \in R^m} b^T \lambda, \quad (4.13)\n$\text{s.t.} \ \lambda^T A
    \leq c^T.$

    ```


    This is the dual linear problem of the now called primal standard LP. In the final
    remark in Section 7.3.4 below, we show that no duality gap exists. It is possible
    to see that, in this special case, the dual problem of the dual problem is the
    primal LP.$^1$ This analysis leads to the dual theorem of linear programming which
    says the following:


    +   1. An LP has an optimal solution if only its dual LP has an optimal solution.
    Moreover, in this case the objective values coincide.

    2. Any feasible solution of one yields a bound on any feasible objective function
    value of the other. In particular, if one of the LPs (the primal or the dual)
    is unbounded, then the other is infeasible.

    3. If one of the two LPs is infeasible, then the other is either infeasible or
    unbounded.


