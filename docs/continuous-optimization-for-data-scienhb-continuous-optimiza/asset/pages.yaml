    # 2.3.3 Least squares solutions and regression


    The following problem is studied at length in [14]. Details on some of the concepts
    used in this section can be found. Let $A \in R^{m \times n}$, where $m > n$.
    Assume that $A$ is a full-rank matrix, namely $rank(A)=n$. In this case, the matrix
    $A^TA \in R^{m \times m}$ (which is clearly symmetric and positive) is invertible.


    For a given $b \in R^m$, the least squares problem


    ```

    $$\min_{x \in R^n} ||Ax - b|. \quad (2.12)$

    ```


    This optimization problem is sometimes referred to as an overdetermined system
    of linear equations. The reason behind this terminology is that under the condition
    stated here, the system of linear equations $Ax=b$ usually has no solution: There
    are too many equations (i.e., conditions to be met) and not enough variables (i.e.,
    degrees of freedom). Thus, solving (2.12) is second best. In real life, solving
    $Ax=b$ is too much to ask, and solving for $\min_{x \in R^n} ||Ax-b||$ is a good
    compromise.


    > **Remark.** Think of $A_{ij}$ as the value of observation $i$ possesses, $1
    \le i \le m, 1 \le j \le n$. Likewise, $b_i$ is the numerical value of $n+1$ for
    individual $i$, $1 \le i \le m$. Thus, for a fixed $j$, all $A_{ij}$, $1 \le i
    \le m$, must be measured using the units of measurement; call the units of column
    $j$, $1 \le j \le n$. Likewise, $b_i$, $1 \le i \le m$, share the same units of
    measurement, call the units of the right-hand side vector $b$. Since $A_{ij}$
    should have the units of measurement as that of $b_i$, $1 \le i \le m$, $1 \le
    j \le n$ (as the expression $\sum_{j=1}^n A_{ij}x_j - b_i$ would be meaningless),
    we conclude that $x_j$ is measured by the units of the vector $b$ divided by the
    units of column $j$, $1 \le j \le n$.


    ```

    $$\frac{1}{2}||Ax-b||^2 = \frac{1}{2}(Ax-b)^T(Ax-b) = \frac{1}{2}x^TA^TAx - b^TAx
    + \frac{1}{2}||b||^2$

    ```


    Proof. For $x \in R^n, A^TA=0 \in R^n$ only if $x^TAx=0$, that is only if $||Ax||=0$.
    Since $A$ is a full-rank matrix, this condition is met only when $x=0$.'
