- pgno: 15
  md: '# Chapter 1


    # Single-Variable Optimization


    # 1.1 Introduction $f(x) : R \rightarrow R$


    Let $f(x) : R$ be some function. We are interested in solving the problem $\min_{x\in
    R} f(x)$ and, in particular, finding the argument where this minimization is attained
    (if it exists), denoted by $\arg \min_{x\in R} f(x)$. In principle, $\arg \min_{x\in
    R} f(x)$ is a set, and hence can be either empty, a single point, a finite number
    of points, or an infinite number of points. Since maximizing $f(x)$ is equivalent
    to minimizing $-f(x)$, for convenience, we deal mainly with the minimization problem.


    Unless some mild conditions exist, this is a very hard problem. Specifically,
    even if one has a good guess at the optimal point, how can one be sure there is
    not a better point somewhere along the real-number axis? Thus, in many cases,
    an optimal solution, called a global solution, is too much to ask for, and one
    must resort to a search for local solution:


    > Definition

    Definition 1.1. A point $x^*$ is said to be a local minimal point for $f(x)$ if
    there exists some $\epsilon > 0$ such that $f(x^*) \leq f(x)$ for any $x$ satisfying
    $|x-x^*| \leq \epsilon$.


    Of course, a global minimum is also a local minimum, but not the way around. The
    snag in this definition is of course that we say nothing about $\epsilon$, which
    in principle can be (very) small. Moreover, it is possible that there are many
    local minima but no global minimum exists. In Figure 1.1, for example, a global
    maximum does not exist. Yet, in practice, things are'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/43a33a7168dda1ff982229fda531b9d7_16_0.png)


    usually better. Normally, there are only a few local minima, each of which is
    a candidate to be the global minimum. Of course, the focus will be on the point
    that receives the lowest value when the function $f(x)$ is applied to it.


    The rest of this chapter deals with characterizing local minima and developing
    algorithms for finding them, or at least for finding good approximations of them.
    The importance of this search is twofold. Firstly, there are many single-variable
    optimization functions that emerge in real life. Secondly, such functions are
    used as subroutines when multi-variable functions are optimized. Details on this
    approach are given in the next chapter. Note that the functions we deal with are
    differentiable: The fact that we refer to their derivatives by default assumes
    their differentiability.


    # 1.2 First- and Second-Order Conditions


    Using a Taylor series expansion for a function $f(x)$ around an arbitrary $x_0$,
    we know that for $x$,


    ```

    $f(x) = f(x_0) + f''(x_0)(x - x_0) + \frac{1}{2}(x - x_0)^2f''''(y),\quad(1.1)$

    ```


    for $y$ that is a function of $x$ and lies between $x_0$ and $x_0$. From this,
    we infer that a necessary condition for $x_0$ to be a local minimum is that $f''(x_0)
    = 0$. Indeed, assume without loss of generality that $f(x_0) = 0$.'
  merge: -1
  img_proc: true
- pgno: 17
  md: "# Single-Variable Optimization\n\nThen, $f'(x_0) > 0$, it is possible to find\
    \ $x < x_0$ that is close enough to $x_0$, note that this is the case regardless\
    \ of the right-hand side of the equality is negative. Note that this the sign\
    \ of $f''(y)$, since $x_0, x-x_0$ is, relatively, much larger than $(x-x_0)^2$.\
    \ A similar argument holds for $x > x_0$, where $f'(x_0) < 0$. Note also that\
    \ the same necessary condition holds for the case where maximization is looked\
    \ for. The condition $f'(x^*) = 0$ is known as the first-order condition (FOC)\
    \ for optimization. At times, such a point is called stationary due to the fact\
    \ that the function at $x^*$ and higher powers in the Taylor series expands, does\
    \ not change in any direction as one moves away from $x^*$.\n\nClearly, this is\
    \ not a sufficient condition for local optimization. In particular, it does not\
    \ distinguish between minimum and maximum points. Inspect (1.1) again and assume\
    \ $x_0$ meets the FOC. Now the question of whether or not boils down to inspecting\
    \ the sign of $f''(y)$. This sign coincides with the sign of $f''(x)$ if $x$ is\
    \ close enough to $x_0$ (unless $f'(x_0) = 0$, where the sign of $f''(x)$ is unknown).\
    \ Thus, clearly the requirement $f'(x_0) \\geq 0$ is a necessary condition for\
    \ local minimization, while $f'(x_0) > 0$ is a sufficient one (once the FOCs are\
    \ met, of course). This condition is called the second-order condition (SOC) for\
    \ minimization. Note that the last inequalities are reversed for maximization.\
    \ To reiterate: SOCs are considered only at points that satisfy the FOCs.\n\n\
    **Example 1 (Affine functions).** Let $f(x) = ax + b$ for some constants $a \n\
    eq 0$ and $b$. As $f'(x) = a$, neither minimum nor maximum points exists.\n\n\
    **Example 2 (Quadratic functions, see Figure 1.2).** Let $f(x) = \\frac{1}{2}ax^2\
    \ - bx + c$ for some constants $a \neq 0$ and $b$. Clearly, $f'(x) = ax - b$.\
    \ Then, a single point, $x = b/a$, satisfies the FOCs. Finally, $f''(x) = a$ for\
    \ any $x$, in particular, $f''(b/a) = a$. Hence, $b/a$ is a local minimum (maximum,\
    \ respectively) if $a > 0$ ($a < 0$, respectively).\n\nIn a special case of the\
    \ above, $y_i$, $1 \\leq i \\leq n$, be a sequence of real numbers.\n\nWhat is\
    \ the value of $x^*$, where\n\n```\n$x^* = \\arg\\min_x \\sum_{i=1}^{n} (y_i -\
    \ x)^2?\n```\n\nLet $f(x) = \\sum_{i=1}^{n} (y_i - x)^2$. Then,\n\n```\n$f(x)\
    \ = \\sum_{i=1}^{n} y_i^2 - 2x \\sum_{i=1}^{n} y_i + nx^2$.\n```"
  merge: -1
  img_proc: true
