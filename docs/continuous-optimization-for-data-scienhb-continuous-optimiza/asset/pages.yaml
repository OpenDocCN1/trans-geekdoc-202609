    # ## 7.6 Degeneracy and Cycling


    We have invoked the assumption of non-degeneracy. Let us ask ourselves what might
    happen otherwise. The first thing to observe is that in the case where a variable
    $i^*$ was selected to be removed from the basis currently has a value of zero,
    and where $(B^{-1}N)_{i^*,j} > 0$, the entrant variable $(x_N)_j$ cannot be removed
    from zero. The basis can be changed regardless, but and this is the key point
    here both the old and the new bases have the same basic solution. It is the roles
    of the variables $j$ and $i^*$, the former as a non-basic variable and the latter
    as a basic variable, that are swapped. In particular, the value of the objective
    function stays unchanged. The main danger is when we move from one basis to another,
    to a third and so on, without the objective function, a cycle might be formed.
    By this, we mean that a basis will be repeated, and from then on, the algorithm
    will enter an infinite loop. For, no convergence is guaranteed in the case of
    degeneracy. Indeed, examples in which cycling occurs have been constructed. Note,
    however, that this is an unlikely event, even in the presence of degeneracy.


    There is another threat in the case of degeneracy: It is possible that the optimality
    criterion will not be satisfied in an optimal basis. In other words, it is possible
    that, in spite of the fact that a given basic solution is optimal, a non-basic
    variable whose corresponding reduced cost is strictly negative will be detected.


    Can cycling be avoided? The answer is “yes”. Note that in the definition of the
    Simplex method there is no clear-cut prescription on what to do, first, when more
    than one non-basic variable can be added to the basis, and second, when more than
    one basic variable can be removed due to a tie in the ratio test. We ask how to
    select the added/or removed variables in a way that guarantees no cycles. A few
    rules have been designed. The simplest one (due to [7]) prescribes always selecting
    the variable with the lowest index (in both cases of adding and removing variables).
    Note that


    > $k$In the latter case, the degeneracy of the new basis is guaranteed, as the
    non-basic variable in the tie receives a value of zero under the new basic solution.'
