  md: 'Remark. It is well known that it is possible to construct an $n-1$ polynomial
    that crosses $n$ points, none of which share the same $x$ value. In fact, there
    is a unique polynomial with this property. Thus, if $f(x)$ is known for $n$ values
    of $x$, then one can approximate it (and then optimize the approximation) by the
