    that the next subinterval is $[0, \alpha_k]$. Thus, looking ahead, we would like
    to know where the next (relative) $\alpha_{k+1}$ point is placed, namely we would
    like it to be at the previous $1-\alpha_k$ point. This means that we require that


    ```

    $$\alpha_{k+1} = \frac{1-\alpha_k}{\alpha_k} \ (1.12)$

    ```


    Note that this shrinks the uncertainty level by a factor of $\alpha_k$.\nFourth,
    if an integer $N\ge3$ and let $F_1, F_2, \dots, F_N$ be the first Fibonacci numbers.
    Denote $F_k/F_{k+1}$ by $\alpha_k$, $1\le k\le N-2$. For example, $\alpha_{N-2}=F_2/F_3=1/2$,
    $\alpha_{N-3}=F_3/F_4=2/3$ and $\alpha_1=F_{N-1}/F_N$. It is left to the reader
    to show that this choice for $\alpha_k$, $1\le k\le N-2$, meets (1.12). As said,
    at iteration $k$, the uncertainty interval shrinks by a factor of $\alpha_k$.
    Thus, after $N-2$ iterations, we get a shrinkage of


    ```

    $$\prod_{k=1}^{N-2} \alpha_k = \prod_{k=1}^{N-2} \frac{F_{N-k}}{F_{N-k+1}} = \frac{1}{F_N}$

    ```


    Reversing the point of view, if one wants the terminal uncertainty interval to
    be less than $\epsilon$ (the so-called tolerance level), then one should look
    for the minimum $N$ with $(b_1-\alpha_1)/F_N\le \epsilon$ and conduct $N$ valuations
    of the function.


    Last, suppose that one has a budget for $N$ searches. The first two will be the
    edges of the original uncertainty interval. The question then is, what value for
    $\alpha_k$, $1\le k\le N-2$, is optimal—again in the sense that it makes the worst
    possible uncertainty interval as short as possible. The answer is that it is the
    one suggested in the previous paragraph. The interested reader is referred to
    [17] for a proof. Thus, this choice leads to the so-called Fibonacci search algorithm.
    Of course, when $N$ goes to infinity we are back to the golden search.'
