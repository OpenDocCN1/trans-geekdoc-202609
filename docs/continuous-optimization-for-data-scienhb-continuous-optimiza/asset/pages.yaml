    \ of $\\alpha_i = 1/n, 1 \\le i \\le n$, by inequality (1.3), we get\n\n$-\\log\
    \ \\prod_{i=1}^n x_i \\le \\frac{1}{n} \\sum_{i=1}^n \\log x_i$.\n\nInvoking exponents\
    \ on both sides concludes the proof of (1.4). Finally, by the definition of strong\
    \ convexity, the inequality is strict in the case where all the entries are not\
    \ equal. In the converse case $x_i = c, 1 \\le i \\le n$, for some constant $c$,\
    \ it is easy to see that both sides of (1.4) equal to c.\n\nInvoking (1.4) above,\
    \ but now for $1/x_i$ instead of $x_i, 1 \\le i \\le n$, leads to\n\n$$\\sum_{i=1}^n\
    \ \\frac{1}{x_i} \\ge \\frac{n^n}{\\left(\\prod_{i=1}^n x_i\right)}$}$\n\nThe\
    \ left-hand side here is known as the *harmonic mean* of the series $x_i, 1 \\\
    le i \\le n$. In summary,\n\n$$\\frac{n}{\\sum_{i=1}^n 1/x_i} \\le \\left(\\prod_{i=1}^n\
    \ x_i\right)^{\\frac{1}{n}} \\le \\frac{1}{n} \\sum_{i=1}^n x_i. \\quad (1.5)$\n\
