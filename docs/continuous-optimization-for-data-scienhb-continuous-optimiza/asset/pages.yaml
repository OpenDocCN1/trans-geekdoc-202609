  md: 'Note that min $c^T x$ is equivalent to $-c^T x$. By rewriting the constraint
    $Ax = b$ as $Ax \leq b$ and $-Ax \leq -b$, we obtain the canonical form:


    ```

    $-\max_{x} c^T x,\ns.t. \quad Ax \leq b,\n$-Ax \leq -b,\nx \geq \underline{0}.$.

    ```


    For the other direction, consider the slack variables $s \in R^n$. Then, rewrite
    $Ax \leq b$ as $Ax + s = b$ for $x \geq 0$ and $s \geq 0$. The standard linear
    program is thus


    ```

    $$\min_{x} c^T x,\ns.t. \quad Ax + s = b,\nx \geq \underline{0}, \quad s \geq
    \underline{0}.$

    ```


    # 9.7 Chapter 7


    # Exercise 7.1


    Prove Theorem 7.1.


    Solution:


    +   1. Consider the two feasible solutions $x, x'' \in S = \{x \mid Ax = b, x
    \geq 0\}$, and the convex combination $\hat{x} = \lambda x + (1 - \lambda)x'',
    0 \leq \lambda \leq 1$:


    ```

    $$\hat{x} = A(\lambda x) + A((1 - \lambda)x'') = \lambda Ax + (1 - \lambda)Ax''
    = \lambda b + (1 - \lambda)b$.$

    ```


    Hence, $\hat{x} \in S$.


    +   2. Consider the two optimal solutions $x^*, x^{*''} \in O=\{x^* \mid c^T x^*
    \leq c^T x, \forall x \in S\}$, and the convex combination $\hat{x}^* = \lambda
    x^* + (1 - \lambda)x^{*''}, 0 \leq \lambda \leq 1:$


    ```

    $c^T \hat{x}^* = \lambda c^T x^* + (1 - \lambda)c^T x^{*''} \leq \lambda c^T x
    + (1 - \lambda)c^T x = c^T x, \quad \forall x \in S$.$

    ```


    Thus, $\hat{x}^* \in O$.'
