  md: "# Optimization Under Equality Constraints: Special Cases\n\nThe argument suggests\
    \ that the case of linear constraints is relatively easy, and we should move to\
    \ the more general case. This is true. But first, let us go through the following\
    \ analysis of the linear case as it sheds light on the general case where the\
    \ constraints are not necessarily linear.\n\nFor $f(x) : R^n \rightarrow R$, consider\
    \ the following problem:\n\n```\n$$\\min_{x \\in R^n} f(x)\\n\\text{s.t. } Ax\
    \ = b$\n```\n\nwhere $A \\in R^{m \\times n}$ is the *constraint matrix* and $b\
    \ \\in R^m$ is the right-hand side vector. Assume that $m < n$ and that $A$ is\
    \ a full-rank matrix. In particular, $rank(A)=m$. This assumption implies that\
    \ there exists a square submatrix $B \\in R^{m \\times m}$ of $A$ that is invertible.\
    \ Without loss of generality, assume $B$ is the first $m$ columns of $A$. Denote\
    \ the subset of $m$ decision variables by $x_B \\in R^m$ and the rest of the decision\
    \ variables by $x_N \\in R^{n-m}$. Finally, any feasible solution $x \\in R^n$\
    \ satisfies\n\n```\n$Bx_B + Nx_N = b$\n```\n\nThis leads to $Bx_B = b - Nx_N$\
    \ and then to $x_B = B^{-1}(b-Nx_N)$. For example, if $x_N=0$ then $x_B = B^{-1}b$.\
    \ Thus, the entries of $x_N$ are determined, there is no free freedom in selecting\
    \ $x_B$ as it must obey the constraint equality. Put differently, the $n$-variable\
    \ constrained optimization problem reduces to $n-m$ unconstrained optimization\
    \ problem. Finally, observe that the full-rank assumption implies that a feasible\
    \ solution exists and that it is not unique. Note that $m > n$, then the main\
    \ issue would have been the existence of a feasible solution, and usually there\
    \ are no such solutions.\n\nReturning to the above example, suppose that $B$ corresponds\
    \ to the first two decision variables. Then,\n\n```\n$$\\begin{pmatrix} x_1 \\\
    \ x_2 \\end{pmatrix} = \\left(\\begin{pmatrix} 1 & 2 \\ -1 & 3 \\end{pmatrix}\\\
    right)^{-1} \\left(\\begin{pmatrix} 5 \\ -3 \\end{pmatrix}\\right) - x_3$\n```\n\
    \nIn particular, both $x_1$ and $x_2$ can be expressed as affine functions of\
    \ $x_3$. Plugging these two expressions into the original objective function,\
    \ we can see that the original three-variable constrained optimization is now\
    \ reduced to a single-variable unconstrained optimization, where the decision\
    \ variable is $x_3$."
