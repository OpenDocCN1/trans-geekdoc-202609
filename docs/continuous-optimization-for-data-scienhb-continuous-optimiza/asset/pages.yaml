    # 8.2 Changes in the Right-Hand Side Vector


    So far, the right-hand side vector has been considered as fixed (like the rest
    of the data defining the LP). Suppose now we change the right-hand side vector
    in one way another, while keeping the rest of the data fixed. Course, the optimal
    value of the LP can change accordingly. To show this, denote by $f(b)$ the optimal
    value when $b$ is the right-hand sidevector. Note that $b$ is the vector of variables
    in the function $f$. In other words, $f : R^m \rightarrow R$.


    > **Theorem 8.2.** *The set of right-hand side vectors for which $B$ is a feasible
    basis is convex. Moreover


    **Proof.** It is easy to see if $B^{-1}b^1 \geq \mathbf{Q}$ and $B^{-1}b^2 \geq
    \mathbf{Q}$, then $B^{-1}(\alpha b^1 + (1-\alpha)b^2) \geq \mathbf{Q}$ for any
    $\alpha \in [0,1]$. Finally, if the optimality condition holds for one $b$, it
    holds for any other $b$, as the right-hand side vector is not considered in this
    condition.


    The conclusion from the above theorem is that once an LP is solved, and you then
    look for some other right-hand side vectors under which the optimal basis does
    not vary, there is no need to look far: they are nearby. In fact, $B^{-1}b \gg
    b$, you can move away from $b$, at least for a while, in any direction and stay
    feasible. However, once you cross the barrier and continue in the same direction,
    you will never again get a right-hand side for which $B$ is optimal, as this would
    contradict convexity. The next result is now immediate.'
