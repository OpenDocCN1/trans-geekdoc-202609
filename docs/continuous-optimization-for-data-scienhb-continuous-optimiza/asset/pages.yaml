    # Sensitivity Analysis


    # 8.1 Introduction


    Sensitivity analysis deals with the question of what happens to the optimal solution
    and/or to the optimal objective value when one or more of the entries in the data
    defining the LP change. Changes can be in the cost coefficients, the right-hand
    side entries, or the constraint matrix itself. Usually the changes are not so
    large, and hence we try to infer the new problem once the previous one has been
    solved. Moreover, by a continuity argument, we believe that the changes in the
    results will not be huge.


    The following theorem states the shape of the objective function as a function
    of the right-hand side vector or the cost coefficient.


    > **Theorem**


    Theorem 8.1.** *The following two statements hold for a standard LP:*

    * *Denote by $f(b)$ the optimal objective value as a function of the right-hand
    side vector $b$. Then, $f(b)$ is a convex function.*

    * *Denote by $g(c)$ the optimal objective value as a function of the cost coefficient
    vector $c$. Then, $g(c)$ is a concave function.*


    Proof.


    +   Denote by $x(b)$ the optimal solution when the right-hand side is $b$ (assuming
    it exists). Also, let $\alpha$ be with $0 \le \alpha \le 1$. It is easy to see
    that $\alpha x(b^1) + (1-\alpha)x(b^2)$ is a feasible solution for the right-hand
    side'
