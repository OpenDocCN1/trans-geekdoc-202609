    \n# 8.2.1 A note on the case of degeneracy\n\nAll of the above breaks down in\
    \ the presence of degeneracy. In particular, in this case, it is possible that\
    \ a few bases, say two, are optimal in the same right-hand side vector $b$. Note,\
    \ however, that the optimal solution is the same under both: The only change is\
    \ the classification of (usually two) variables, whose values in this solution\
    \ equal zero, swapping the roles of basic and non-basic variables. Yet, despite\
    \ the fact that the optimums are the same under both, the derivatives in (8.1)\
    \ are different. Still, it is possible that a small perturbation in the right-hand\
    \ side vector will break the tie between these. Consider, for example, the case\
    \ where increasing $b_i$ by a bit makes one uniquely optimal, while decreasing\
    \ $b_i$ makes the other one uniquely optimal. Loosely speaking, the question becomes:\
    \ Which of the two derivatives should be taken? The answer is none of the above,\
    \ or better put, at $b, f(b)$ is not differentiable. This should not be confused\
    \ with the fact that $f(b)$ is still continuous in $b$.\n\n# 8.3 Changes in the\
    \ Cost Coefficients\n\nSuppose that an LP is solved for some given data. In particular,\
    \ an optimal basis is found. Suppose now that the coefficients are undergoing\
    \ a change. The question we pose here is whether the original optimal basis maintains\
    \ its optimality. We need to consider only the optimality condition, as the feasibility\
    \ condition is guaranteed to be met as no changes were performed at the right-hand\
    \ side. As importantly, note that the change is in the coefficients, then if the\
    \ basis stays optimal, the optimal solution $x_B = B^{-1}b$ does not change. Only\
    \ the objective function value, $c_B^T B^{-1}b$, will change in the case where\
    \ the change in effects $c_B^T$.\n\nThe first thing to observe is that, here too,\
    \ the set of cost vectors under which a given basis is optimal is convex. Hence,\
    \ we proceed to the question"
