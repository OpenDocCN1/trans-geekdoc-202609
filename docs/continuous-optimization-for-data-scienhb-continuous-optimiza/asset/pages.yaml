  md: '# Chapter 5


    # Optimization Under Equality

    and Inequality Constraints


    # 5.1 Introduction


    Let us take a bird''s-eye view of the issue of the optimization under equality-ity
    constraints. Clearly, each added constraint makes the problem more restrictive,
    and any given point needs to meet more conditions in order to be feasible. Yet,
    once a point is feasible, it has less competition for optimality. This is due
    to the fact that those previously feasible points that do not meet the new constraints
    are not feasible and are eliminated from the set of feasible points. Note that
    when constraints are added, the gradient of the objective function needs to lie
    in a larger dimension linear subspace that contains the previous gradients. The
    gradient of the added constraint joins the gradients of the previous constraints
    to form a basis. Hence, it is more likely that the gradient of the point under
    consideration lies in this larger linear subspace.


    Suppose now that an inequality constraint $h(x) \leq 0$ is added, suppose that
    a point $x$ obeys this and the previous constraints. Does this help us in terms
    of increasing the subspace in which $\nabla f(x)$ needs to lie? In order to answer
    this question, we need to consider two exhaustive and mutually exclusive cases:
    $h(x) < 0$, when the added constraint is not binding (sometimes referred to as
    an inactive constraint) at $x$, and the case where $h(x) = 0$, when the constraint
    is binding (or active) at $x$.'
