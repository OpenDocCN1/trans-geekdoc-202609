  md: '# Continuous Optimization for Data Science


    $f(x) = \frac{1}{2}ax^2 - bx + c$


    ![](img/43a33a7168dda1ff982229fda531b9d7_18_0.png)


    **Figure 1.2.** Local minimum and local maximum of quadratic functions.


    Hence, $f''(x) = -2\Sigma_{i=1}^n y_i + 2nx$, and it equals zero at


    ```

    $x = \frac{\Sigma_{i=1}^n y_i}{n}. \quad (1.2)$

    ```


    namely, at the arithmetic mean of the sequence $y_i, 1 \le i \le n$, usually denoted
    by $\bar{Y}$. Finally, $f''''(x) = 2n > 0$. Hence, this is a minimum point. For
    some other optimization problems of this type, which lead to other solutions,
    see Exercise 1.1 and Section 6.2.1 below.


    # Exercise 1.1


    Let $Y_1, Y_2, \dots, Y_n$ be a series of $n$ numbers. Let $\frac{1}{\Sigma_{i=1}^n
    Y_i}, (\Pi_{i=1}^n Y_i)^{1/n}$, and $n/\Sigma_{i=1}^n Y_i$ be their arithmetic,
    geometric, and harmonic means, respectively. Note that for the existence of the
    geometric mean, one needs to assume further that $Y_i \ge 0, 1 \le i \le n$.


    +   1. Prove that the arithmetic mean of the series minimizes, with respect to
    $y$, the function

    $\Sigma_{i=1}^n(Y_i - y)^2$.'
