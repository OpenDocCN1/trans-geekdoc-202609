  md: '# Exercise 4.7


    Consider the following optimization problem:


    ```

    $\max_{x_1,x_2,x_3} x_1x_2 + x_1x_3 + x_2x_3, \quad \text{s.t.} \quad x_1 + x_2
    + x_3 = 3.$

    ```


    (a) Convert the problem of finding a stationary point into solving a system of
    equations.


    (b) Replace 3 in the right-hand side with $b$. For any $b$ in the neighborhood
    of 3, derive $x_i^*(b), 1 \le i \le 3$, and the optimal objective value as a function
    of $b$. What is the derivative of this function when $b=3$?


    # Solution:


    (a) Using $x_3 = 3 - x_2 - x_1$, we can rewrite the objective as


    ```

    $\max_{x_1,x_2} x_1x_2+(x_1+x_2)(3-x_2-x_1) \implies \max_{x_1,x_2} 3x_1+3x_2-x_1^2-x_2^2-x_1x_2.$

    ```


    Deriving the gradient and setting it to zero, we obtain the following set of equations:


    ```

    $3 - 2x_1 - x_2 = 0, \quad 3 - 2x_2 - x_1 = 0.$

    ```


    The obvious solution is $x_1 = x_2 = 1$, which implies that $x_3 = 1$ too. We
    can also solve this using Lagrange multipliers as follows:


    ```

    $L(x_1, x_2, x_3, \lambda) = x_1x_2 + x_1x_3 + x_2x_3 - \lambda(x_1 + x_2 + x_3
    - 3).$

    ```


    Deriving the gradient and setting it to zero, we obtain the following set of equations:


    ```

    $x_2 + x_3 - \lambda = 0, \\ x_1 + x_3 - \lambda = 0, \\ x_2 + x_1 - \lambda =
    0, \\ x_1 + x_2 + x_3 = 3.$

    ```


    where the last equation is the constraint. The solution of the system of equations
    above is $x_1 = x_2 = x_3 = 1$, and $\lambda = 2$.'
