    answer here. Note that if $p$ is too large, the limit will be infinity. Thus,
    very small values of $p$ lead to a limit of zero, while very large values lead
    to a limit of $\infty$. Thus we look for this knife-edge value where the limit
    is some number strictly between zero and infinity. This leads to the following
    definition.


    **Definition 1.4.** The rate of convergence of the series $a_n, n \geq 1$, is
    the (not necessarily unique) real number $p$ that for some $0 < C < \infty$,


    $$0 < \lim_{n\to\infty} \frac{a_{n+1}}{a_n^p} < C.$


    Note that the value of $C$ is irrelevant here; although our instincts tell us
    that the smaller (positive) value is, the faster the rate of convergence. **Example.**
    Let $a_n = 1/n^q$ for some $q > 0$. Then,


    $$1/(n+1)^q = \frac{n^q}{(n+1)^q}$


    and its limit equals 1. Thus, we get a rate of convergence of 1, regardless of
    the value of $q$. This rate is called a *linear rate of convergence*. Slower rates
    are called *sublinear*, while faster are *superlinear.*


