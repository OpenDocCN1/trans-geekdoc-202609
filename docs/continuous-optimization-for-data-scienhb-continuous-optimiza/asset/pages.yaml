  md: 'A constant infinitesimal step size, this is the best direction in the sense
    of improving the approximation to $x^*$ per unit step. For obvious reasons, it
    is called the steepest descent direction. The next issue is what should the optimal
    step size be. Here, we not restrict ourselves to small steps, and hence an underlying
    assumption is that this optimization, known as a line search (where “line” here
    a reference to “direction”), can be done in an efficient way. Needless to say,
    $f(x+t^*d) < f(x)$, $t^*$ is the optimal step size.


    Thus, the steepest descent algorithm, sometimes referred as the gradient descent
    algorithm, is as follows:


    +   **Input:** An approximation to $x^*$.


    +   **Initialization:** $i = 0$.


    +   **Iterations:** Let $t_i^* = \arg\min_{t\geq0} f(x_i - t

    abla f(x_i))$.


    +   Let $x_{i+1} = x_i - t_i^*

    abla f(x_i)$.


    +   If $\|x_{i+1} - x_i\| \leq \epsilon$ STOP


    +   $i \leftarrow i + 1$ REPEAT


    In the above algorithm, we have suggested terminating the procedure when there
    is little change in the approximation in the current iteration. As the single-variable
    optimization problem, another criterion is to stop when there is not much improvement
    in the corresponding objective function value, namely when $f(x_{i+1}) - f(x_i)
    \geq -\epsilon$. Finally, the choice of the step sizes, $t_i^*$, $i > 0$. Yet,
    this choice may come with much effort per iteration for selecting the step size,
    but they are beyond the scope of this text. A possible source on this is [5, p.
    34–46].


    The steepest descent converges to a local minimum point in the (typical) case
    where the sequence of generated approximations is bounded. See [5, p. 54], for
    a sufficient condition for the choice of a step size that guarantees convergence
    (under some mild conditions that the function needs to obey). The convergence
    is to a point where the FOCs are, namely to a stationary point where $\nabla f(x)
    = \mathbf{0}$. Note that the set of points meeting the FOCs is the fixed points
    of the algorithm. In other words, $x_{i+1} = x_i$ if and only if $\nabla f(x_i)
    = \mathbf{0}$. Finally, note that the tolerance criterion $\|x_{i+1} - x_i\| \leq
    \epsilon$ can be replaced with $|\|\nabla f(x_i)\| \leq \epsilon$ or any combination
    of the two versions.'
