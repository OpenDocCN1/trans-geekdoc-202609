- pgno: 170
  md: 'Let us deal with the first case. Given that the constraint is not binding,
    then changing $x$ in any direction does not lead to a violation of this constraint.
    Hence, the directions we need to consider in order to check for local optimality
    at $x$ is not reduced under this additional constraint. Put differently, $

    abla h(x)$ cannot be added to the basis that spans the subspace in which $

    abla f(x)$ needs to belong. It may look odd to mention this, but this is the equivalent
    of insisting on imposing $

    abla h(x)$ to the basis, forcing the coefficient of $

    abla h(x)$ in $

    abla f(x)$s expression of a linear combination of said basis, to equal zero. Put
    differently, this is equivalent to imposing the Lagrange multiplier of $

    abla h(x)$ to equal zero. The question of looking for Lagrange multipliers $\mu$
    has back to the case where the original constraints are considered.


    Now consider the second case, where $h(x) = 0$. First, add this constraint to
    the previous set of constraint but now as an equality constraint. Note that if
    $x$ is optimal for the case with the constraint $h(x) \le 0$, then it is also
    optimal for the case where the constraint is $h(x) = 0$. In particular, for optimality,
    it should meet the FOCs for the case of only equality constraints. Finally, and
    this is the crucial part, consider the sign of $\mu$, denoted by $\mu$. Recall
    from Section 4.4 that $\mu$ is the derivative of the objective function with respect
    to the corresponding entry on the right-hand side (currently at zero). Thus, if
    we decrease this by an infinitesimal $\epsilon > 0$, the optimal value will go
    down by $\mu\epsilon$. If $\mu > 0$, then from the optimality point of view, it
    would be worthwhile to make this decrease. Note that given the inequality constraint
    optimization we face, this decrease is possible. Hence, in order not to make it
    worthwhile, still having a chance that $x$ is optimal, we need $\mu \le 0$. Note
    that a possible way to combine the two cases is to require that $\mu \cdot h(x)
    = 0$ and $\mu \le 0$ (on top of $h(x)\le 0$).


    Finally, note that in the case where the maximization of an objective function
    is considered, all of the above applies verbatim with one (crucial) exception:
    It must be the case that $\mu \ge 0$.


