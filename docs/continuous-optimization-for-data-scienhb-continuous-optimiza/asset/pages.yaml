    right)x \\le b, \\quad x \\ge \\mathbf{0}.$\n```\n\nIt is given that $A_1x^* =\
    \ b_1$ and $A_2x^* < b_2$. Now, consider the LP with a modified constraint set:\n\
    \n```\n$\\min_x c^T x$\n```\n\nsubject to\n\n```\n$A_1x \\le b_1, \\quad x \\\
    ge \\mathbf{0}.$\n```\n\nFor feasibility, $x^*$ is obviously feasible under the\
    \ modified constraints since it was feasible under the stricter constraints. For\
    \ optimality, assume by way of contradiction that there exists an $x'$ in the\
    \ feasible region of the modified LP where $cx' \\le cx^*$. If $A_1x' \\ge b_2$,\
    \ then $x'$ would also be feasible for the original LP, contradicting the optimality\
    \ of $x^*$. Therefore, $x'$ must satisfy $A_2x' > b_2$. Given that for $x^*, A_2x^*\
    \ < b_2$ and $A_2x^* = b_2$, making $x^*$ a feasible point, it follows that the\
    \ constraints associated with $b_2$ are not binding. Consequently, all basic variables\
    \ related to $b_1$ have slack variables for $b_2$. Imposing the new set of constraints\
    \ is effectively the same as increasing all entries of $b_2$ in the original LP\
    \ to $\\infty$. The allowable increase $\theta_i^+$ to maintain optimality is\n\
