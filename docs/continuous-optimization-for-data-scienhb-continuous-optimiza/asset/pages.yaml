    # 2.4 The Steepest Descent Method


    In this subsection, we discuss a procedure for deriving the optimal point. Denote
    by $x^*$ the optimal point one is after. Then, any point $x$ can be looked at
    as an approximation to it, no matter how good or bad the approximation is. Next,
    we use $x$ as a starting point (in fact, an input to some operation) and derive
    a better approximation for $x^*$ (the output of this operation). Then, we use
    the output as the new input to the operation in each successive iteration, until
    we achieve a good approximation to $x^*$. The key challenge is how to design this
    procedure. Some suggestions are stated in this chapter.


    Consider the affine function $x(t) : \mathbb{R}^n \to \mathbb{R}^n, x(t) = x+td$,
    for some point $x \in \mathbb{R}^n$ and some direction $d \in \mathbb{R}^n$. Note
    that $x(0)=0$. The function can be understood as a movement from an initial point
    $x$ in direction $d$, where $t$ is the step size. This function is called a *path*.
    True and $2d$ move in the same direction, and so it makes sense to normalize $d$
    by assuming $||d||=1$. Also, assume without loss of generality that $t \geq 0$.
    Otherwise, one could replace $d$ with $-d$.


    Consider the second Taylor polynomial expansion for $f(x(t))$ as a function of
    $t$ around the point $t=0$, where the third and higher terms are ignored:


    ```

    $f(0)+\nabla f(0)^T d + t^2d^T\nabla^2 f(0)d$

    =f(x)+\nabla f(x)^T d + t^2d^T\nabla^2 f(x).d$

    ```'
