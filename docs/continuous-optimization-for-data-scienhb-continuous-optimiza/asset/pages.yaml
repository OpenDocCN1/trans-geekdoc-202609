  md: "# Continuous Optimization for Data Science\n\n# 4.3 Second-Order Conditions\
    \ (SOCs)\n\nWhen we consider the unconstrained optimization of $f(x) : R^n \r\
    ightarrow R$, once a point $x$ was observed to be stationary, namely $\nabla f(x)\
    \ = 0$, the next question is whether or not the Hessian $\nabla^2 f(x)$ is positive,\
    \ negative, or one of the above, which should lead to the conclusion that $x$\
    \ is a local minimum, a local maximum, or undecided, respectively. What is the\
    \ corresponding condition in the case of constrained optimization? It is tempting\
    \ to jump to the conclusion that a similar condition to the one used for the unconstrained\
    \ optimization case holds here too, but it will be less severe in the sense that\
    \ such a positive or negative requirement is required for all directions, one\
    \ needs to check the sign of $d^T\\nabla^2 f(x)d$ for all $d \\neq \\mathbf{0}$\
    \ with $\\nabla g_i(x)d=0, 1 \\leq i \\leq m$. But as it turns out, $d^T\\nabla^2\
    \ f(x)d$ needs to be replaced with\n\n```\n$d^T\\left(\\nabla^2 f(x) - \\sum_{i=1}^m\
    \ \\lambda_i \\nabla^2 g_i(x)\\right)d,$$\n```\n\nwhere $\\lambda =(\\lambda_1,\
    \ \\dots, \\lambda_m)$ is the vector of Lagrange multipliers associated with $x$.\n\
    \n> **Theorem 4.3.** Let $x^*$ and $\\lambda$ be a pair consisting of a feasible\
    \ solution and a vector of Lagrange multipliers that make the regularity condition\
    \ and SOCs stated in Theorem 4.1. Then, a necessary condition for local minimum\
    \ at $x^*$ is\n\n```\n$d^T\\left(\\nabla^2 f(x^*) - \\sum_{i=1}^m \\lambda_i \\\
    nabla^2 g_i(x^*)\\right)d \\geq 0, \\quad (4.7)$\n```\n\nfor feasible directions\
    \ $d \\neq \\mathbf{0}$ at $x^*$. Moreover, for sufficiency, one needs to replace\
    \ \"non-negative\" with \"positive\".\n\n**Proof.** Recall the definition of $f(x(t))$\
    \ over a feasible path $x(t)$ that crosses $x^*$ (where $t=0$). A necessary condition\
    \ for a local minimum is that the second derivative of $f(x(t))$(with respect\
    \ to $t$) is non-negative when $t=0$; however, it needs to be positive to be a\
    \ sufficient condition for optimality. By the chain rule,\n\n```\n$$\\frac{d^2\
    \ f(x(t))}{dt^2} = \\dot{x}(t)^T\\nabla^2 f(x(t))\\dot{x}(t) + \\nabla f(x(t))^T\\\
