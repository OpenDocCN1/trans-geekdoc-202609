  md: '# Solutions to Exercises


    # 9.3 Chapter 3


    # Exercise 3.1


    The following problem appears in [1]. First, we define a queueing loss system.
    The arrival process and the service process are as defined in the queueing examples
    previously discussed, except now a customer that finds a busy server leaves the
    system forever. In the case where the arrival rate equals $\lambda$ and the service
    rate equals $\mu$, the customers find server idle with a probability of $\mu/(\lambda+\mu)$.
    Second, assume $n$ servers exist, where $i$ serves with a rate of $\mu_i$, $1
    \leq i \leq n$. Third, assume a common arrival rate of $\lambda$. The question
    here is how to split the arrival stream among the $n$ servers so as to maximize
    the expected number of successes per unit of time. Note that if $x_i$ is the arrival
    rate to server $i$, then


    ```

    $x_i \cdot \frac{\mu_i}{x_i+\mu_i}$

    ```


    is the successes rate due to server $i$, $1 \leq i \leq n$. One wishes to maximize
    the sum of these values.


    +   1. State formally the problem described above as a constrained optimization
    problem with one equality constraint.

    2. Show that the objective function is concave in any of the $n$ decision variables.

    3. Argue why in this model all servers are open, namely at the optimal solution
    $x_i > 0, 1 \leq i \leq n$.

    4. Use the condition of equal derivatives in order to derive the optimal splitting
    of arrival rate.

    5. What is the value of the objective function?

    6. What is the derivative of the value stated at the previous item with respect
    to $\lambda$?


    Solution:


    +   1.


    ```

    $\max_{x_i, 1\leq i\leq n} \sum_{i=1}^n x_i \frac{\mu_i}{x_i+\mu_i}$$

    $\text{s.t. } \sum_{i=1}^n x_i = \lambda$,$$

    $\x_i \geq 0$.

    ```'
