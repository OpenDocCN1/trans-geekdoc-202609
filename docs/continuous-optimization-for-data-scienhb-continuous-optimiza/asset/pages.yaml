    ```

    min_{x\in R^n, g(x)=0} f(x^*) \leq L(x^*, \lambda^*) = max_{x\in R^n} L(x, \lambda^*)\n=
    \phi(\lambda^*) \leq max_{\lambda\in R^m} \phi(\lambda).

