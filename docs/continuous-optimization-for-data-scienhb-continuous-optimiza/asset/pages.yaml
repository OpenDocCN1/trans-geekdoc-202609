  md: "# The Simplex Method\n\n# Theorem\n\nTheorem 7.10. Let $A \\in R^{n \times\
    \ n}$ be an invertible matrix and let $z, x \\in R^n$. Then, $A+xz^T$ is invertible\
    \ if and only if $x^T A^{-1}z \neq -1$.\nover, in this case,\n\n```\n$(A+xz^T)^{-1}\
    \ = A^{-1} - \\frac{1}{1+x^T A^{-1}z}A^{-1}xz^T A^{-1}. \\quad (7.10)\n```\n\n\
    In particular, once $A^{-1}$ is given, computing $(A+xz^T)^{-1}$ is an $O(n^2)$\
    \ computational task.\n\n**Proof.** Identity (7.10) can be proved by a straightforward\
    \ matrix multiplication, which is omitted. In the case where $x^T A^{-1}z = -1$,\
    \ it is trivial that $z \neq 0$. However, $(A+xz^T)A^{-1}z = 0$. Since $A^{-1}z\
    \ \neq 0$, the previous equation implies that $A+xz^T$ is not invertible.\n\n\
    As for the computational complexity associated with the use of Sherman–Morrison\
    \ formula, note that when we multiply a number of matrices, the order of multiplication\
    \ is irrelevant for the end result, i.e., $ABC=(AB)C=A(BC)$. This is not the case\
    \ in terms of computational effort. In particular, an efficient way to compute\
    \ the updating term $A^{-1}zx^T A^{-1}$ is via $(A^{-1}z)(x^T A^{-1})$, the task\
    \ in each parenthesis is of order $O(n^2)$, and the same is with the final column-by-row\
    \ multiplication.\n\nThe Sherman–Morrison identity basically says that if a matrix\
    \ is updated by an additive term that is a rank-one matrix (which can be represented\
    \ as an outer product between a column vector and a row vector), the inverse of\
    \ the new matrix can be computed with an effort proportional to $O(n^2)$ (once\
    \ the inverse of the original matrix is given). This is more efficient than inverting\
    \ the new matrix from scratch. Note that the correction term in (7.10) is also\
    \ a rank-one matrix.\n\nThe application of the Simplex method is now straightforward.\
    \ If $B$ is the old basis and $ith$ column is updated, then the new basis $B+ze^T$,\
