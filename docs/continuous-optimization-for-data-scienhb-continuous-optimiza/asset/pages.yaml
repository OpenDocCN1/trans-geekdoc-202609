    # ## Optimization Under Equality Constraints:

    ## Special Cases


    # ### 3.1 Introduction


    The simplest optimization problem with one equality constraint is


    ```

    $$\min_{x \in R^n} \sum_{i=1}^n a_i x_i$,$

    $\text{s.t.} \sum_{i=1}^n b_i x_i = c$,$

    x_i \ge 0, \quad 1 \le i \le n.$

    ```


    Assume that $a_i > 0$ and $b_i > 0, 1 \le i \le n$, and $c > 0$. Look at this
    as an allocation problem in which an amount $c$ of some resource has to be allocated
    among $n$ activities. One unit of activity $i$ consumes $b_i$ units of the resource
    and adds $b_i$ to the common cost, $1 \le i \le n$. The index $i^* = \arg\min_{i=1}^n
    a_i/b_i$, and for simplicity, assume that this index is uniquely defined. It is
    easy to see that one wishes to increase as much as possible, at the expense of
    the other variables. Yet, $n-1$ variables are bounded from below by zero. Thus,
    the optimal solution is


    ```

    $x_i = \frac{c}{b_{i^*}} \text{ and} \quad x_i = 0 \quad 1 \le i \neq i^* \le
    n.$

    ```


    # ### 3.2 Allocation Problems


    Let $f_i(x) : R^1 \to R^1, 1 \le i \le n$, be $n$ single-variable functions. Assume
    that they are monotone increasing and strictly convex, namely $f''_i(x) > 0$'
