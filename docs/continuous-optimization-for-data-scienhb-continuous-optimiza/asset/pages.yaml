  md: '# 1.5.2 The false position method


    Recall that the false position curve fitting was similar to Newton''s curve fitting
    with the exception that the second derivative of the focal point (in our case,
    the point $x_k$) is replaced by an approximation to it. As was said above, a possible
    approximation to it, a sequence of points $x_1, x_2, \dots$ is generated, $k=\frac{f''(x_k)-f''(x_{k-1})}{x_k-x_{k-1}}$.
    The algorithm, which is also known as the secant method, now follows.

    Input: $x_{-1}, x_0 \in R, \epsilon > 0$.


    Output: an approximation to the minimum point.

    Initialization: $k=0, x_{k-1}=x_{-1}, x_k=x_0$.


    Iterative procedure:


    ```

    $x_{k+1} = x_k - \frac{f''(x_k)x_k-x_{k-1}}{f''(x_k)-f''(x_{k-1})}$

    ```


    If $|x_{k+1}-x_k| < \epsilon$ STOP

    $k\leftarrow k+1$.

    Finally, what was said above on Newton''s method in the last two paragraphs of
    the previous section holds verbatim.


    # 1.5.3 The quadratic and cubic methods


    The quadratic and cubic methods are basically the same as the above two methods,
