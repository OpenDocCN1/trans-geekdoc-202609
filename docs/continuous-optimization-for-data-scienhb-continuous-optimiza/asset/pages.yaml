  md: '# Optimization Under Equality Constraints: The General Case


    **Remark.** The above duality theorem appears in its “full” version in the sense
    that all constraints are put in the objective function. It is possible to show
    that it also holds in its partial version. For example, it is possible to partition
    the set of constraints into two classes: those with indices from 1 up to $k$,
    and those with indices $k+1$ up to $m$. Then, for $\lambda \in R^k$, the dual


    ```

    $$\phi(\lambda) = \min_{x \in R^n, g(x)=0, k+1 \le i \le m} \{f(x) - \sum_{i=1}^k
    \lambda_i g_i(x),},\}$

    ```


    and, as before, the dual optimization problem is


    ```

    $$\max_{\lambda \in R^k} \phi(\lambda)$.$

    ```


    In fact, the original version of the dual theorem is a special case of this version
    where $k = m$.


    Set $\lambda^* = \max_{\lambda \in R^k} \phi(\lambda)$. It is immediate by the
    weak duality theorem that $\phi(\lambda^*) \le f(x^*)$. In the case where the
    inequality is strict, we say that a duality gap exists. In this case, the solution
    of the dual problem leads only to a lower bound on the value of the primal objective
    function. Of course, much interest exists in the case where there is no duality
    gap. In particular, if one finds a feasible primal solution $x$ and a dual solution
    $\lambda$ with $f(x) = \phi(\lambda)$, then both solutions are optimal, $x$ for
    the primal and $\lambda$ for the dual. Moreover, $f(x)$ is the optimal value for
    both. Also, if one of the optimization problem is unbounded, then the other is
    infeasible.


    Next, we state a case in which no duality gap exists.


    # Theorem


    **Theorem 4.7.** *Suppose that $x^*$ is feasible for (4.10) and, coupled with
    $\lambda^*$, it meets the FOCs. Suppose further that*


    ```

    $$x^* = \arg_{x \in R^n} L(x, \lambda^*), \quad (4.11)$

    ```


    then, $x^*$ is primal optimal, $\lambda^*$ is dual optimal, and no duality gap
    exists.'
