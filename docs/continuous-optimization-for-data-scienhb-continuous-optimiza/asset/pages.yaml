  md: "# Solutions to Exercises\n\nany change, this condition is met. Now, consider\
    \ a change $\\Delta n$ in the $kj$th entry of the matrix $N$. Then\n\n$c_j - c_B^T\
    \ B^{-1}(N_{j + \\Delta n_k}) \\ge 0 \\implies \tilde{c}_j - \\Delta n \\cdot\
    \ (c_B^T B^{-1})_k = \tilde{c}_j - \\Delta n \\cdot \\pi_k \\ge 0$.\n\nFor $\\\
    pi_k < 0$, the allowable increase is Similarly, allowable decrease (when $\\Delta\
    \ n < 0$) is $\\Delta n = c_j/(-\tilde{c}_j/\\pi_k)$.\n\nNote that if $\\pi_k\
    \ < 0$, and $\tilde{c}_j \\ge 0$, the inequality remains positive for all $\\\
    Delta n \\in R_+$. Therefore, the allowable increase is infinite. The same logic\
    \ applies to the allowable decrease when $\\pi_k > 0$. If $\\pi_k = 0$, indicating\
    \ that the $k$th constraint is not binding, both the allowable increase and decrease\
    \ are infinite.\n\n+   3. Consider the resulted cost in the case of simultaneous\
    \ changes in the entries of $N^j$\n\n$c_j - c_B^T B^{-1}(N^j + \\Delta N^j) =\
    \ \tilde{c}_j - \\pi \\cdot \\Delta N^j$.\n\nThe requirement that these value\
    \ must be non-negative implies that $\tilde{c}_j \\ge \\sum_{i=1}^m \\pi_i \\\
    Delta N_j^i$, which in turn implies that\n\n$1 \\ge \\sum_{i=1}^m \\frac{\\pi_i\
    \ \\Delta N_j^i}{\tilde{c}_j} = \\sum_{i=1}^m \\frac{\\Delta N_j^i}{\theta_i}$,\n\
    \nwhere $\theta_i$ represents the allowable increase (or decrease, corresponding\
    \ to the sign of $\\pi_i$). In other words, the current basis remains optimal\
    \ if and only if the sum of all the relative changes in the entries of $N^j$,\
    \ as a proportion of their allowable changes, is less than 1. This condition means\
    \ that the 100-percent rule holds."
