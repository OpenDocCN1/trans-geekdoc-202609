    width will then be $(0.5 + \epsilon)/2 + \epsilon$. Repeating the computation
    will lead to an interval width of $0.25 + \epsilon/4 + \epsilon/2 + \epsilon$.
    It can be seen that $n/2$ repetitions (consisting of two function evaluations)
    lead to an interval with width


    > $$(1/2)^{n/2} + 2(1 - 0.5^{n/2})\epsilon.$$


    By ignoring the $\epsilon$ term here, we can see that for each computation of
    a function value, the uncertainty interval shrinks by a factor of $\sqrt{1/2}
    \approx 0.707$. As we will see below, the golden search yields better results.
    As we have already noted above, the lack of efficiency of binary search is due
    to the fact that two nearby function values are computed at each iteration.'
