  md: '# Exercise 2.8


    Consider the following unconstrained quadratic program:


    $$\min_{x \in R^n} \frac{1}{2}x^T Qx - b^T x$


    for some square, symmetric, and positive matrix $Q$. Let $v_1, \dots, v_n$ be
    a set of orthogonal eigenvectors of $Q$. Suppose that for some given $x_0$, the
    gradient at that point belongs to the subspace spanned by $v_1, \dots, v_m$: $Sp\{v_1,
    \dots, v_m\}$ for some $m < n$. Suppose that an iteration of the steepest descent
    method was executed on $x_0$. Denote by $x''$ the resulting vector.


    +   (a) Show that the gradient of the objective function at the new point $x''$
    also belongs to the subspace $Sp\{v_1, \dots, v_m\}$.


    +   (b) State whether this is a strong or a weak property of the steepest descent
    algorithm.


    # Solution:


    +   (a) The gradient at the point $x_0$ is $Qx_0 + b$. Thus, the point reached
    at the end of the current iteration


    $x'' = x_0 - \alpha^*(Qx_0 + b). (2.3)


    In the next iteration, we take the gradient $Qx'' + b$ at $x''$, which equals


    $Qx_0 + b - \alpha^*(Qx_0 + b) (2.4)


    (obtained by inserting the term in (2.3)). This term includes $Qx_0 + b$, which
    is assumed to lie in the subspace spanned by $v_1, \dots, v_m$. Since $v_1, \dots,
    v_m$ are the eigenvectors of $Q$, it and in particular $Q(Qx_0 + b) \in Sp\{v_1,
    \dots, v_m\}$ as we have assumed that $Qx_0 + b \in Sp\{v_1, \dots, v_m\}$. Thus,
    the gradient at $x''$ (see (2.4)) is the sum of two vectors in $Sp\{v_1, \dots,
    v_m\}$. Hence, the point lies in the same subspace as well.


    +   (b) This is actually a weak property, since in this case, the steepest descent
    path is limited to a mere subspace. Denote by $x^*$ the optimal solution. As there
    is no guarantee that $x^* - x_0$ belongs to this subspace (and usually it does
    not) then the path will not lead to the desired point.'
