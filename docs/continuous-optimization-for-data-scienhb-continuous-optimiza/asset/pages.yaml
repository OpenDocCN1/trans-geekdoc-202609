- pgno: 252
  md: '# Solution:


    +   1. $$\sum_{i=1}^n (Y_i - y)^2 = \sum_{i=1}^n Y_i^2 - 2y \sum_{i=1}^n Y_i +
    ny^2.$$


    This is a quadratic function in $y$, and its minimum (as shown in the text) is
    attained at the point


    $$\frac{2 \sum_{i=1}^n Y_i}{2n} = \overline{Y},$


    where $\overline{Y}$ is the arithmetic mean of the series.


    +   2. From the previous item, we infer that the log $y$ that minimizes $$\sum_{i=1}^n
    (log Y_i - \log y)^2$$


    is

    $$\log y = \log \overline{Y}.$$


    Hence, the optimizer $y$

    $$y = e^{\log \overline{Y}} = e^{\frac{1}{n} \sum_{i=1}^n \log Y_i} = (e^{\sum_{i=1}^n
    \log Y_i})^{1/n}$

    $$(log \Pi_{i=1}^n Y_i)^{1/n} = (\prodprod_{i=1}^n Y_i)^{1/n},$$


    which is the geometric mean.


    +   3. Using the solution of (1) but for the series $1/Y$, we conclude that the
    minimum of $$\sum_{i=1}^n (\frac{1}{Y_i} - \frac{1}{y})^2$$


    is attained when

    $$$\frac{1}{y} = \frac{\overline{T}}{Y}.$$


    In other words,

    $$$\frac{1}{y} = \frac{1}{n} \sum_{i=1}^n \frac{1}{\overline{Y}_i}.$$'
