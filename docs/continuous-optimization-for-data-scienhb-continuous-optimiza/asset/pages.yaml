  md: '# Multi-Variable Unconstrained Optimization


    +   **Minimization vs. maximization.** In multi-variable optimization, as in single-variable
    optimization, the corresponding FOCs are shared by both minimum and maximum points.
    Thus, meeting these conditions is a necessary condition for optimization, and
    once they are met, we cannot distinguish between a local minimum and maximum.
    Towards this end, we look for SOCs. Then, we can establish sufficient conditions,
    which, once coupled with the FOCS that are met, guarantee that the point is a
    local minimum or maximum. Of course, maximizing $f(x)$ is equivalent to minimizing
    $-f(x)$.


    +   **Computational complexity.** Each algorithm, given its input, has a running
    time. True, this depends on the code written and the computer used, but we can
    get around this objection by thinking of the running time as the number of simple
    algebraic calculations the algorithm has to perform, as a function of the size
    of the input (measured by how many numbers it contains), to get the desired result.
    Of course, we prefer an algorithm that requires the shortest possible running
    time. When we look at an iterative algorithm, one that generates a series of approximations
    to $x^*$, we want it to be one that requires less running time at each iteration.
    However, this is not the only criterion. Another criterion is much much improvement
    in approximation (called *rate of convergence*) we get at each iteration. Thus,
    there may be a trade-off between the two criteria. One might prefer an algorithm
    that converges slowly to one that does faster, if the former significantly reduces
    the computational burden per iteration.


    +   **Line search.** In mathematics, we usually reduce a complicated problem to
    one we already know to solve. Unconstrained optimization is no exception: We will
    apply our skills in solving one-dimensional optimization problems to solving multidimensional
    ones. The approach is as follows. Let $x$ be a point that is looked at as an approximation
    to $x^*$. The issue is in which *direction* $d$ should move away from $x$. Once
    the *direction* $d$ is decided, we are back to a single-variable optimization
    problem. Specifically, we are looking for an optimal, or at least a good, value
    for $t$, called the *step size*, such that $x + td$ is a (hopefully substantial)
    improvement on $x$. Finding such a $t$ is a single-variable optimization problem.
    We have revealed the


    > $^e$ machine learning circles, a step size is called the **learning rate**.'
