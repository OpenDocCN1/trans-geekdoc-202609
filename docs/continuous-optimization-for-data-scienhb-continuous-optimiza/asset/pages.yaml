    The weak duality theorem (see Theorem 4.6) points to the reverse inequality. Hence,
    the inequality stated above is in fact an equality.


    Note that the extra assumption (4.11) is not strong: It requires that $x^*$ (which
    already meets the FOCs which are necessary for optimality) is a maximum point
    with respect to Lagrangian (but with the specific value for the dual variables,
    namely $\lambda^*$). Also note that Theorem 4.4 completes in the sense that global
    optimization is established in both without the need to resort to the SOCs.


    Remark. The solution $(x^*, \lambda^*)$ for the optimization problem


    ```

    max_{\lambda\in R^m} min_{x\in R^n} {f(x)-\lambda^Tg(x)}

    ```


    is called a saddle point as it is the minimum in one direction, namely in $x$,
    and the maximum in another direction, namely, in $\lambda$. The notation is clear.
    When you sit on a saddle on a horse, in one direction, where the roads lie, you
    are at the bottom, while in the orthogonal direction, where your legs lie, you
    are at the top. See Figure 4.2.


    Remark. An iterative primal algorithm would be based on the idea of guessing for
    the optimal solution and then checking whether it leads to the existence of Lagrange
    multipliers (namely if it is dual feasible?). Usually, the answer is "no", and
    then another feasible solution should be derived, the corresponding multipliers
    are sought for; the dual approach does the opposite. Specifically, one starts
    with $\lambda$. Then one solves the unconstrained optimization problem $x(\lambda)
    = argmin_{x\in R^n}\{f(x)-\lambda^Tg(x)\}$ and checks whether $x(\lambda)$ is
    feasible, namely whether $h(x(\lambda))=0$. If this is the case, one is done because
    the optimal solution is attained. However, usually one is not so lucky and needs
    to try for a better $\lambda$, say $\lambda$ such that $\phi(\lambda)>\phi(\lambda^*)$.
    How this can be done, namely how a better dual solution is found, is another matter.
    For that, one constructs a sequence of approximations $\lambda_1, \lambda_2, \dots$
    for $\lambda^*$. By the monotonicity of $\phi(\lambda_i)$, convergence is guaranteed,
    and the hope is that the limit is $\phi(\lambda^*)$.'
