    that the functions $f_i(x)$, $1 \le i \le n$, are concave, namely $f''''_i(x)
    < 0, 1 \le i \le n$ (but they are still increasing). Here, the rate of growth
    is negative, so $f_1(x_1)$ is set to a higher value than $x_i = 0$, it is now
    more worthwhile to increase it, in comparison with setting any of the values to
    be larger than 0. In this case, the optimal solution is $x_1 = 1$ and $x_i = 0,
    2 \le i \le n$. In other words, the nature of the problem dictates that one of
    the variables dominates the others.


    # 3.2.2 Selecting the active variables


    The above procedure leads to the conclusion that the optimal solution possesses
    the following property: there exists some $i$, $1 \le i \le n$, such that $f''_j(x_j)
    = \lambda, 1 \le j \le i$, for some $\lambda$, with $\sum x_i = 1$. Had the value
    of $i$ were known in advance, the problem would have been reduced to solving a
    set of $i$ non-linear equations with $i$ variables, $x_j,1 \le j \le i$. Note
    that one of the equations is $\sum_{j=1}^i x_j = 1$. How do we find the value
    of $i$? The procedure in the previous section hints for the following algorithm.
    First try $i=1$. Clearly, $x_1=1$. Then, check whether or not $f''_1(1) \le f''_2(0)$.
    If it does, the optimal solution has been reached. Otherwise, look for $x_1$ and
    $x_2$, such that $f''_1(x_1) = f''_2(x_2)$ and $x_1+x_2=1$. Then, check whether
    or not $f''_1(x_1) < f''_3(0)$. In case, the optimal solution is obtained. Otherwise,
    introduce $x_3$, where $x_n$ is introduced, the optimal solution is when all $f''_j(x_j)$
    are equal, $1 \le j \le n$. Of course, one still needs to minimize the constraint
    $\sum_{j=1}^n x_j = 1$. This leads to a unique optimal solution.


