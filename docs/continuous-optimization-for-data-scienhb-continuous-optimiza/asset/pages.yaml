  md: '# Continuous Optimization for Data Science


    which is known as the *first-order* or *linear* approximation of the function
    $f(x)$ around the point $x_0$. In a similar fashion,


    ```

    $f(x_0) + \nabla^T f(x_0)(x-x_0) + \frac{1}{2}(x-x_0)\nabla^2 f(x_0)(x-x_0) \quad
    (2.3)$

    ```


    is the *second-order* or *quadratic* approximation of the function $f(x)$ around
    the point $x_0$.

    For a set of $n$ functions $x_i(t) : R \to R, 1 \le i \le n$, the function $x(t)=(x_1(t),
    \dots, x_n(t)) : R \to R^n$ is called a *path*. We denote by $\dot{x}(t) \in R^n$
    the vector $(\frac{dx_1(t)}{dt}, \dots, \frac{dx_n(t)}{dt})$. Similarly, $\dot{x}(t)=(\frac{\dot{x}_1(t)}{dt},
    \dots, \frac{\dot{x}_n(t)}{dt})$. The well-known rule says that,


    ```

    $\frac{df(x)}{dt} = \sum_{i=1}^n f(x(t))\frac{dx_i(t)}{dt} = \nabla f(x(t))^T\dot{x}(t).
    \quad (2.4)$

    ```


    Also, if $f(x) : R^m \to R^1$ and $A \in R^{m \times n}$, then for $g(x) = f(Ax)$
    (and $g(x) : R^n \to R^1$), the gradient is


    ```

    $\nabla g(x) = A^T\nabla f(Ax). \quad (2.5)$

    ```


    Finally, a symmetric matrix $A \in R^{n \times n}$ is said to be *non-negative*
    (respectively, *positive*) if for any $x \in R^n$ (respectively, $x \in R^n, x
    \neq \underline{0}$) $x^T Ax \ge 0$ (respectively, $x^T Ax > 0$). Such matrices
    have $n$ real eigenvalues, and all of them are non-negative (respectively, positive).
    For details see e.g., Chapter 10 in [14] or Example 6 in Section 4.2.1.$^a$


    # 2.1.2 Convex sets and convex functions


    We briefly define convex functions. While the assumption that a function is convex
    makes our task easier, it does not mean that we are looking for keys lost in a
    dark alley under streetlight: In many applications, the assumption that a function
    is convex is not a severe limitation. Before getting to definition:


    | Definition | Definition 2.1. A set $X \subseteq R^n$ is said to be convex for
    any pair $x^1, x^2 \in X, \alpha x^1 + (1-\alpha)x^2 \in X$ for any $\alpha$ with
    $0 \le \alpha \le 1$. |


    > $^a$In most texts the term "non-negativity" is replaced with the term "non-negative
    semi-definiteness", while "positivity" is replaced with "positive definiteness".'
