  md: '# Theorem


    **Theorem 5.1.** *Consider the following constrained optimization problem:*


    ```

    $$\min_x f(x), \quad (5.1)\ns.t. \quad g_i(x) = 0, \quad 1 \le i \le m,\\nh_j(x)
    \le 0, \quad 1 \le j \le k.$$$

    ```


    *Assume $x^*$ is a feasible solution. Also, assume that the gradients of the binding
    constraints are linearly independent at $x^{*,^a}$ Then, a necessary condition
    for $x^*$ to be a local minimum is the existence of $\lambda_i, 1 \le i \le m$,
    and $\mu_j \le 0, 1 \le j \le k$, such that*


    ```

    $$\nabla f(x^*) - \sum_{i=1}^m \lambda_i \nabla g_i(x^*) - \sum_{j=1}^k \mu_j
    \nabla h_j(x^*) = \mathbf{0} \in \mathbb{R}^n$$

    ```


    and


    ```

    $$\sum_{j=1}^k \mu_j h_j(x^*) = 0.$$$

    ```


    > ^aThe equality constraints are binding by definition.


    Note that the condition $\mu_j h_j(x^*) = 0, 1 \le j \le k$, follows logically
    from the conditions stated in the above theorem. These are known as the *complementary
    slackness conditions*. In particular, the Lagrange multipliers associated with
    the non-binding constraints are zero. On the other hand and although unlikely,
    that zero is a possible value for the Lagrange multiplier for a binding constraint.


    Note that the generalization of Theorem 4.5 holds verbatim. In particular, as
    expected, the derivative of the objective function with respect to the right-hand
    side entry of a non-binding constraint equals zero, which is the value of the
    corresponding Lagrange multiplier.


