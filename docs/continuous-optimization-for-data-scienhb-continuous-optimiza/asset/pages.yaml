    # 6.1 Linear Programming Formulation


    It was already noted in Section 3.4.4 that equality-constrained optimization is
    rather trivial when both the objective function and the constraints are linear.
    This implies a model with some depth, where all functions involved are linear,
    and calls for some inequality constraints. We indeed impose the constraints that
    all decision variables are required to be non-negative. Thus, a standard linear
    program (LP), as was introduced in Example 2 in Section 4.5.2, is as follows:


    ```

    $$\begin{aligned} \min c^T x, \ \text{s.t.} & Ax = b, \ & x \ge \underline{0}.
    \end{aligned}$ (6.1)$

    ```


    where the input is $c \in R^n$ (the price vector), $b \in R^m$ (the right-hand
    side), and $A \in R^{m \times n}$ (the constraint matrix). Note that the choice
    of $\underline{0}$ is without loss of generality and practical, due to many operations
    research models where this non-negativity constraint is a common feature. For
    example, see Chapter 3 in [23] for many examples of real-life optimization problems
    formulated as LPs.


    Linear programming is an area of optimization in which one needs to optimize a
    linear function over a feasible set that is defined as a set of vectors that satisfy
    a finite number of linear constraints. The linear constraints are defined as the
    requirement that a linear function of the decision variables will be less than
