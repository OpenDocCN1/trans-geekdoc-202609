    \n```\n$\\tau_j - \\beta(B^{-1}N)_{ij} \\geq 0, \\quad j \\in N,$\n```\n\nwhere\
    \ $\tau_j$ is the reduced cost of the non-basic variable $j \\in N$. In other\
    \ words, the allowable increase is\n\n```\n$\\beta_i^+ = \\min_{j\n```\n\nNote\
    \ that the allowable increase is unbounded in the case where the above minimization\
    \ is over an empty set. It is notable that if the allowable increase is infinite,\
    \ no matter how costly becomes, this variable still needs to be in the optimal\
    \ basis. In particular, it needs to be positive. Of course, we are not satisfied\
    \ with this outcome and would like to remove this variable from the optimal basis\
    \ once its cost is high. Yet, this seems impossible. The conclusion is that the\
    \ current value of this variable (recall it does not vary with $c$) is the lowest\
    \ possible value among all feasible solutions.^a\n\n> $^a$It is possible to put\
