- pgno: 269
  md: '# 9.4 Chapter 4


    Exercise 4.1


    Solve the following constrained constrained optimization problem


    ```

    $\min_{x\in R^n} \frac{1}{2} \sum_{i=1}^n x_i^2$,$

    $\text{s.t.} \sum_{i=1}^n x_i = c$.

    ```


    From the solution, deduce that


    ```

    $\frac{1}{n} \sum_{i=1}^n x_i^2 \geq \left(\frac{1}{n} \sum_{i=1}^n x_i\right)^2$,

    ```


    with equality if and only if $x_1 = x_2 = \cdots = x_n$.


    # Solution:


    Note that the Lagrangian function is given by


    ```

    $L(x_1, \dots, x_n, \lambda) = \frac{1}{2} ||x||_2^2 - \lambda \left(\sum_{i=1}^n
    x_i - c\right)$.

    ```


    By Theorem 4.1, the optimal solution $x^*$ satisfies the first-order conditions
    (FOC):


    ```

    $\nabla f(x^*) - \lambda g(x^*) = x^* - \lambda \cdot \underline{1} = \underline{0}
    \Rightarrow x^* = \lambda \cdot \underline{1}$.

    ```


    This implies $x^*_i, 1 \leq i \leq n$. Substituting this into the constraint yields:


    ```

    $\sum_{i=1}^n \lambda = c \Rightarrow n \cdot \lambda = c \Rightarrow \lambda
    = \frac{c}{n} \Rightarrow x^* = \frac{c}{n}$.

    ```'
