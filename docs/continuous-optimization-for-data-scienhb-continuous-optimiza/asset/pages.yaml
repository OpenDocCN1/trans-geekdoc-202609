  md: '# Chapter 4


    # Optimization Under Equality Constraints:

    The General Case


    # 4.1 An Informal Introduction to First-Order

    Conditions (FOCs)


    We start with a reminder. Let $f(x)$ be a function from $R^n$ to $R$. A point

    x \in R^n$ is called a stationary point if $\nabla f(x) = \underline{0} \in R^n$.
    A necessary condi-

    ton a point $x_0$ to be a local extreme point, be it a minimum or maxi-

    mpoint, is that it is a stationary point. The reason for this is as follows:

    Without loss of generality, assume that $x_0 = \underline{0}$ and $f(\underline{0})
    = 0$. Then, the

    linear approximations for $f(x)$ and $f(-x)$ around $x_0 = \underline{0}$ (see
    (2.2)) are


