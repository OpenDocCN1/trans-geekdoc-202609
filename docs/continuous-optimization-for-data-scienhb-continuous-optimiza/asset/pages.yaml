- pgno: 254
  md: "# Solution:\n\n+   1. For a random sample $X_i, 1 \\le i \\le n$, whose members\
    \ follow an exponential distribution with parameter $\\lambda$, the likelihood\
    \ function equals\n\n$$L(X_1, \\dots, X_n; \\lambda) = \\prod_{i=1}^n \\lambda\
    \ e^{-\\lambda X_i} = \\lambda^n e^{-\\lambda \\sum_{i=1}^n X_i}$$\n\n+   2. The\
    \ logarithm of the likelihood function is\n\n$$log L(X_1, \\dots, X_n; \\lambda)\
    \ = n \\log \\lambda - \\lambda \\sum_{i=1}^n X_i.$$\n\nTaking the derivative\
    \ with respect to $\\lambda$ and setting it to zero implies that the maximum likelihood\
    \ estimator for $\\lambda$, denoted by $\\hat{\\lambda}$, satisfies\n\n$$\\frac{n}{\\\
    lambda} - \\sum_{i=1}^n X_i = 0.$$\n\nHence,\n\n> $$\\hat{\\lambda} = \\frac{n}{\\\
    sum_{i=1}^n X_i} = \\frac{1}{\\overline{X}}$\n\nwhere $\\overline{X}$ is the sample\
    \ mean.\n\n# 9.2 Chapter 2\n\n# Exercise 2.1\n\nLet $Q \\in R^{n \times n}$ be\
