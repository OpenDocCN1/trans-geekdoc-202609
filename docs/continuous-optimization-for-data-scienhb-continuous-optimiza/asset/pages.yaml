    The first-order conditions, coupled with the feasibility conditions, can be put
    in a concise form as $\nabla L(x, \lambda)=0 \in R^{n+m}$. Moreover, by (4.2),
    we can see that this part of the FOCs, for a given $\lambda \in R^m$, deals with
    the unconstrained optimization problem


    ```

    $$optimize_{x\in R^n} \left\{ f(x) - \sum_{i=1}^m \lambda_i g_i(x) \right\$$

    ```


    Put differently, the FOCs for optimality in the case of equality constraints imply
    that if somehow, miraculously, the vector of $m$ Lagrange multipliers is known,
    solving a constrained optimization problem reduces to solving an unconstrained
    optimization problem.


    # 4.2.1 Examples


    A number of problems involving optimization under equality constraints are stated
    below. For all of them, using the FOCs defined above, we derive what turns out
    to be the unique stationary point coupled with the corresponding Lagrange multipliers.
    We claim, at this stage without a proof, that they indeed solve the stated optimization
    problem, be one of minimization or maximization.


    **Example 1.** Consider the following constrained optimization:


    ```

    $$$\min_{x_1,x_2,x_3} (x_1^2 + x_2^2 + x_3^2),$\n\text{s.t.} \quad x_1 + x_2 =
    1,$\n\quad x_2 + x_3 = 1.$$$

    ```


    We now prove that $(1/3, 2/3, 1/3)$ is a stationary point. Firstly, it is easy
    to check that this is a feasible point. Secondly, the gradient of the objective
    function at this point is $(1/3, 2/3, 1/3)$. Thirdly, the gradient of the first
    constraint at this point (or, in fact, at any other point) is $(1, 1, 0)$, and
    the gradient of the second constraint is $(0, 1, 1)$. Note that these gradients
    are linearly independent. Finally, note that


    ```

    $$\begin{pmatrix} 2 \ 2 \ 2 \end{pmatrix} = \frac{1}{3}\begin{pmatrix} 1 \ 1 \
    0 \end{pmatrix} + \frac{1}{3}\begin{pmatrix} 0 \ 1 \ 1 \end{pmatrix}.$$

    ```


    In other words, $\lambda_1 = 1/3$ and $\lambda_2 = 1/3$ are the unique Lagrange
    multipliers. Note that the key point here is not their uniqueness but their existence.'
