    The KKT conditions are


    $2w_i\sigma_i^2 - \lambda = 1, \quad 1 \le i \le n,$


    and


    $$\sum_{i=1}^n w_i = 1.$


    By the first condition, we get that $w_i = \frac{\lambda}{2\sigma_i^2}$, and therefore
    the weights are proportional to $1/\sigma_i^2$. Since the decision variables need
    to sum up to 1, the optimal solution is


    $w_i = \frac{1/\sigma_i^2}{\sum_{j=1}^n 1/\sigma_j^2}, \quad 1, \dots, n.$


    Since we face a convex optimization problem, this is the global optimal solution.


    Finally, this solution meets the constraints $w_i \ge 0, 1 \le i \le n$, it is
    also optimal when this set of constraints is considered.


    +   (B) Substituting our result in the objective function, we get that


    $$\sum_{i=1}^n w_i^2\sigma_i^2 = \sum_{i=1}^n \left( \frac{1/\sigma_i^2}{\sum_{j=1}^n
    1/\sigma_j^2} \right)^2 \sigma_i^2 = \left( \frac{1}{\sum_{j=1}^n 1/\sigma_j^2}
    \right)^2 \sum_{i=1}^n 1/\sigma_i^2,$


    which simplifies to


    $$\frac{1}{\sum_{i=1}^n 1/\sigma_i^2},$


    which is the harmonic mean of the variances divided by $n$.


    +   (C) The objective value we get is of course smaller than the objective value
    for $w_i = 1/n, 1 \le i \le n,$ (the arithmetic mean) because the former is optimal.
    For this set of weights, the objective function equals


    $$\sum_{i=1}^n \sigma_i^2,$


    which is the $nth$ fraction of the arithmetic mean of the individual variances.


