    # 1.7 Quasi-Convex Functions and Non-Derivative Based Procedures


    Definition


    **Definition 1.5.** Consider a function $f : [a, b] \rightarrow R$ for some finite
    $a$ and $b$ with $a < b$. We say that the function $f$ is unimodal, single-peak,
    or quasi-concave in the interval $[a, b]$ if it has a unique local maximum point.
    It is called quasi-convex if $-f(x)$ is quasi-concave.


    Of course, an assumption of quasi-convexity $[a, b]$ implies that the local minimum
    point is also the global minimum among them. Note that if this, to be called $x^*$,
    in the interior of $[a, b]$, namely it is attained at $x^*$ with $a < x^* < b$,
    then the FOCs and the SOCs need to be met. However, this is not necessarily the
    case if $x^*=a$ or $x^*=b$. Of course, an alternative definition for quasi-convexity
    is the existence of $x^* \[a, b]$ such that the function is strictly decreasing
    along $[a, x^*]$ and is strictly increasing in $[x^*, b]$. Note that $x^*=a$ or
    $x^*=b$ is not ruled out. Finally, note that the key part of the definition of
    quasi-convexity is the uniqueness, the existence of a global, and here local,
    minimum point in any closed and bounded (i.e., compact) interval is a well-known
    fact.'
