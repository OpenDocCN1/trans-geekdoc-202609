    # Exercise 1.2


    Suppose that $X$ follows a Poisson distribution with parameter $\lambda$, namely
    $P(X=i) = e^{-\lambda}$ for any integer $i, i \geq 0$.


    +   1. Show that $M_X(s) = e^{\lambda(e^s-1)}$.


    +   2. Use the Chernoff bound to show that for $a > \lambda, P(X \geq a) \leq
    e^{-a-\lambda}(\frac{\lambda}{a})^a$.


    Solution:


    +   1.


    $M_X(s) = \sum_{k=0}^{\infty} e^{sk} e^{-\lambda} \frac{\lambda^k}{k!} = e^{-\lambda}
    \sum_{k=0}^{\infty} \frac{(\lambda e^s)^k}{k!} = e^{-\lambda} e^{\lambda e^s}
    = e^{\lambda(e^s-1)}$


    as required.


    +   2. Using the moment-generating function just derived, and invoking the Chernoff
    bound, we infer that


    $P(X > a) \leq \min_{s>0} e^{\lambda(e^s-1)-sa}$


    By taking the derivative of the exponent and setting it to zero, we observe that
    the above inequality is minimized at $s = \log(a/\lambda)$, which is positive
    as $a > \lambda$. Inserting this value for $s$ in the above inequality, we conclude
    that


    $P(X > a) \leq e^{-a-\lambda}(\frac{\lambda}{a})^a$.


