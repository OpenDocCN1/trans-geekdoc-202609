    Suppose that have solved a feasible LP (regardless of whether you end up with
    an indication that the LP is unbounded). Then suppose you are asked to solve a
    LP but with a different cost vector. What should you do? First, you can check
    the signs of the reduced costs in the new vector. If all of them are non-negative,
    you are done: Whatever your conclusion on the previous LP was, it stays for the
    new LP. Specifically, if it was an unbounded LP before, it is still unbounded,
    or if it has an optimal basis, the same optimal basis stays optimal (maybe with
    a new value for the objective function). Otherwise, namely if one of the new reduced
    costs becomes negative, you have least in hand a feasible basis (terminating the
    one from simplex algorithm) and you can restart the application of the simplex
    algorithm to the new LP.


    Our final application of this sensitivity analysis deals with the introduction
    of a new variable. Denote by $c_j$ the variable''s cost coefficient and $A^j$
    its constraint column. Suppose that the original LP without this variant solved.
    This implies that we currently have the best solution, out of which the new variable
    receives a value of zero. Suppose that we decide to introduce this variable by
    a bit, say by $\epsilon$. The value of objective function changes not only by
    $c_j\epsilon$ (which is immediate) but also by $-\sum_{i=1}^m \pi_i A_{ij}$, where
    $\pi_i = c_B^T B^{-1}i$ is the shadow price that corresponds to constraint $i$,
    $1 \le i \le m$. Indeed, by the change to the other basic variables, some of the
    right-hand side is consumed by the new variable. In a summary, gain (in terms
    of reducing in the resulting optimal LP) can be realized if and only $c_j - \sum_{i=1}^m
    \pi_i A_{ij} < 0$. Thus, this is the criterion with which we decide whether not
    to introduce this new variable. But reconsider the definition of the shadow price
