  md: '# Continuous Optimization for Data Science


    # 7.4 Phase I: Finding an Initial Feasible Basic Solution


    Recall that the Simplex method initializes with a feasible basic solution. We
    next deal with the question of how such a feasible solution is found (whenever
    the program is indeed feasible) and how it is discovered that the program is not
    feasible. Interestingly, this is achieved by applying the Simplex itself to another
    (related) LP.


    Assume, without loss of generality, $b \ge 0$; otherwise, replace any row whose
    right-hand side is a negative value by its negative. Consider the linear program
    that stems from $P$:


    ```

    $\min_{x \in R^n, w \in R^m} \sum w_i$\n$\text{s.t. } Ax + Iw = b$\n$\x \ge 0,
    \quad w \ge 0$

    ```


    The set of $x = \underline{0}$ and new variables $w \in R^m$ are known as *artificial*
    variables. Note that over, it is a basic solution where $w = (w_1, w_2, \dots,
    w_m)$ are the basic variables (with $I$ the corresponding basis) and the variables
    $x = (x_1, x_2, \dots, x_n)$ are the non-basic part. Hence, the simplex method
    stated above is well-defined for this program as we have an initial feasible solution
    for this program as well. However, we still need to assume that the no-degeneracy
    assumption holds for this program. Note that a necessary condition for this to
    hold is that all entries of $b$ are positive. Also, and clearly, this program
    is bounded zero. Hence, once applied, the Simplex method terminates with an optimal
    solution. There are two possible options for the value of the optimal function:


    +   - It is strictly positive. Then, $P$ is infeasible (if one exists), coupled
    with all artificial variables having the value of zero, yields a better objective
    function.

    - It is zero. Then, all the artificial variables $w$ ought to have a value of
    zero. for the original program. It is likely that this is a basic solution, but
    this is not always the case. However, this is not an issue, since in those cases
    where it is not a basic solution, one can apply the procedure described in Theorem
    7.2, which yields a feasible solution with which the Simplex can be initialized
    for the original program.'
