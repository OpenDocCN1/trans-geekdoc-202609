  md: '# # Chapter 9


    # # Solutions to Exercises


    # ## 9.1 Chapter 1


    ### Exercise 1.1


    Let $Y_1, Y_2, \dots, Y_n$ be a series of $n$ numbers.


    +   1. Prove that the arithmetic mean of the series minimizes the function


    sum_{i=1}^n (Y_i - y)^2

    with respect to $y$.


    +   2. Assume further that $Y_i > 0, 1 \le i \le n$. Prove that the geometric
    mean of the series minimizes the function


    sum_{i=1}^n (\log Y_i - \log y)

    with respect to $y$.


    +   3. Prove that the harmonic mean of the series minimizes the function


    sum_{i=1}^n (\frac{1}{Y_i} - \frac{1}{y})^2

    with respect to $y$.'
  merge: -1
