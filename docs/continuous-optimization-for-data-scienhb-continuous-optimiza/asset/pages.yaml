  md: 'we can say that only a sample of the data is used in each iteration during
    the training procedure.


    There are various strategies for selecting the sample. In the case where $m$ is
    a mid-size number of functions and the sample size is $k$, then one can arrange
    $m!/(m-k)!$ possible samples in some order and go through all of them in order
    a number of times. However, when $m$ is large, it is not ruled out that the number
    of iterations is larger than the possible samples. Here, the strategy is to collect
    random samples, each of size $k$, and hence the terminology of stochastic steepest
    descent method or stochastic gradient descent method. Note that there is nothing
    wrong with the choice of $k=1$. Usually, we give all samples equal probabilities,
    and consecutive samples are drawn independently. Note that the sampled gradient
    $m/k$ is a multidimensional random variable whose expected value coincides with
    the gradient of the original function. Obviously, the improvement gained at each
    iteration is usually smaller than the one achieved by the original method as indeed
    the progress is not along the steepest descent direction. However, for a given
    computational budget, one can do more iterations, and hence one can be better
    off at the end of the day.


    # 2.6 Minimum, Maximum, or Neither: Second-Order Conditions


    Suppose that $x^*$ does not meet the FOCs for optimality for the function $f(x):
    R^n \rightarrow R$. Then, it is not a local minimum or maximum point. Thus, in
    our search for optimal points, we limit ourselves to points $x^*$ that are stationary,
    namely $\nabla f(x^*) = 0$. There are two clear cases: If $\nabla^2 f(x^*)$ is
    positive (respectively, negative), then it is a local minimum (respectively, maximum)
    point. Otherwise, we cannot say anything definite. This is stated as follows:


    > Theorem


    **Theorem 2.7.** Let $X$ be a set in which $x^*$ is an internal point. Also, let
    $f(x): X \rightarrow R$. Assume that $x^*$ meets the FOCs for optimality. Then
    a sufficient condition for a local minimum (respectively, maximum) point at $x^*$
    is that $\nabla^2 f(x^*)$ is positive (respectively, negative).'
