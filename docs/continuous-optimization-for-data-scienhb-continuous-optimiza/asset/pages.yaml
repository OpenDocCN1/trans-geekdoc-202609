    theory and in prediction, there is an interest in the following optimization problem:


    ```

    \min_{w_i, \dots, w_n} \frac{1}{\text{Var}} \left( \sum_{i=1}^n w_i X_i \right),
    \n\text{s.t. } \sum_{i=1}^n w_i = 1.

    ```


    Indeed, the solution yields the minimum variance unbiased estimator for their
    common mean. The objective function is easily seen to equal $\frac{1}{2}\sum_{i=1}^n
    w_i^2\sigma_i^2$. This is a separable objective function for which all single-variable
    functions are convex. Moreover, these single-variable functions share the same
    derivative of zero at zero. Hence, as argued in the previous section, the optimal
    solution is attained when all derivatives, $w_i\sigma_i^2$, $1 \le i \le n$, have
    the same value. This means that the optimal weights $w_i$, $1 \le i \le n$, are
    inversely proportional to the variance. Thus, for some constant $C, w_i = C/sigma_i^2,
    1 \le i \le n$. The constant $C$ is derived from the equality constraint that
    requires $\sum_{n=1}^n w_i = 1$. It is now straightforward that


    ```

    w_i = \frac{\sigma_i^2}{\sum_{j=1}^n \sigma_j^2}, \quad 1 \le i \le n.

    ```


    Note that the non-negativity constraint is redundant. Finally, it is easy to see
    that the optimal variance equals


    ```

    \sum_{i=1}^n \frac{1}{\sigma_i^2}

    ```


    namely it equals the harmonic mean of the $n$ variances divided by $n$. This is
    better, by the definition of optimality, $\frac{1}{n}\sum_{i=1}^n \sigma_i^2$
    which is the corresponding arithmetic mean of the $n$ variances divided by $n$,
    a value we would have gotten had we gave weight to all $n$ estimators. This fact
    exemplifies the inequality between various types of means (see (1.5)).


