- pgno: 272
  md: '# Solution:


    (a) Since the columns of $W$ are orthonormal, we have $W^TW = I$.


    (b) We first show that $\|x\|_2=1=x^TA = \lambda_n$. Every vector $x$ can be written
    as a linear combination $x = \sum_{i=1}^n \alpha_i w_i$. Orthonormality of $w_i$,
    $1 \le i \le n$, implies: $x^TAx = \sum_{i=1}^n \alpha_i^2 \lambda_i$. Thus,


    ```

    $x^TAx = \sum_{i=1}^n \alpha_i^2 \lambda_i \le \sum_{i=1}^n \alpha_i^2 \lambda_n.
    \quad (4.18)$

    ```


    On the other hand, we have the constraint $\|x\|_2=1$, and thus $\|x\|_2^2=x^Tx=1$.
    Together with the orthonormality assumption on $w_i$, $1 \le i \le n$, we have:


    ```

    $x^Tx = \left(\sum_{i=1}^n \alpha_i w_i\right)^T \left(\sum_{i=1}^n \alpha_i w_i\right)
    = \sum_{i=1}^n \alpha_i^2 \|w_i\|^2 = 1.$

    ```


    By (4.18), we can conclude that $x^TAx \le \lambda_n$. This can be reached by
    the point $w_n$ (i.e., all $\alpha_i,1 \le i \le n$, zero except the last, which
    equals 1). From the fact that $\|x\|=x^Tx = \lambda_n$, it can easily see that
    $x^TDx = \sum_{i=1}^n \alpha_i^2 \lambda_i \le \lambda_n \lambda_n$, where the
    last equation follows from the constraint $\|x\|=1$ (and thus $\|x\|^2=1$).


    (c) Follow the same steps as previously described, this with $\lambda_1$, reversing
    the direction of the inequality.


    Using some algebra, we obtain an equivalent expression for (4:17):


    ```

    $(\lambda_1\lambda_n)/(\alpha\lambda_1+(1-\alpha)\lambda_n)^2. \quad \cdot $

    ```


    Since only the denominator depends on the variable $\alpha$, we want to maximize
    it. Substituting


    ```

    $x = \alpha\lambda_1 + (1-\alpha)\lambda_n \quad (4.19)$

    ```


    above, we see that the denominator becomes $x(\lambda_1 + \lambda_n - x)$, which
    is maximized at the point $x = \frac{\lambda_1+\lambda_n}{2}$. By (4.19), this
    is equivalent to $\alpha = \frac{1}{2}$. Now, use $\alpha = \frac{1}{2}$ in (4.17)
    to obtain the minimum value of


    ```

    $$\frac{4\lambda_1\lambda_n}{4}$

    ```'
