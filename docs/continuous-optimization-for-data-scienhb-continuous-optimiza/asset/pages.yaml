    For simplicity, we allow $w$ to have negative entries. Since $\Sigma$ is a positive,
    $\Sigma = U^T\Lambda U$, with diagonal $\Lambda$ (containing the eigenvalues of
    $\Sigma$, which are positive) and an orthonormal $U$ (containing the corresponding
    eigenvectors). See, e.g., [14, p. 141]. The problem then becomes


    ```

    $\min_{w\in R^n} w^T\Lambda w, \quad \text{s.t.} \quad 1^T w = 1.$

