    (Caratheodory theorem) Let $x^1, x^2, \dots, x^k$ be a set of $k$ points in $R^n$.
    Let $C$ be the convex hull of these points, namely


    ```

    $C = \left\{ x \in R^n, x = \sum_{i=1}^k \alpha_i x^i \\middle| \sum_{i=1}^k \alpha_i
    = 1, \alpha_i \ge 0, 1 \le i \le k \right\$

    ```


    In other words


    # Solution:


    Proof. Fix some $x \in C$. We are looking for the set of $k$ decision variables
    $\alpha_i, 1 \le i \le n$ that satisfy


    ```

    $$\sum_{j=1}^k \alpha_j x_i^j = x_i, \quad 1 \le i \le n,$

    ```


    ```

    $$\sum_{j=1}^n \alpha_j = 1,$\n\alpha_j \ge 0, \quad 1 \le j \le k.$

    ```


    This set of constraints is the same as that of a standard LP, with an objective
    that is not relevant to our discussion. This set is known to be feasible. Hence,
    it has at least one basic solution. Since the number of equality constraints is
    $n+1$, it is also the number of basic variables. The rest are non-basic variables
    and their values in this solution are zero.


