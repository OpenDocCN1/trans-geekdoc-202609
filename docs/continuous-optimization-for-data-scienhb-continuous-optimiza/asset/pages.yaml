    that there is an entry $j$ such that $d_j < 0$. However, we can choose $\hat{\lambda}
    = -(x_j/d_j + \varepsilon)$ for a sufficiently large $\varepsilon > 0$, leading
    to $x_j + \hat{\lambda}d_j < 0$, which is a contradiction.


    Assume that $Ad = 0$ and $d \geq 0$. Then $A(x+\lambda d) = Ax + \lambda Ad =
    b$, and $x + \lambda d$ is non-negative for all $\lambda \geq 0$, which implies
    $x + \lambda d \in X$.


