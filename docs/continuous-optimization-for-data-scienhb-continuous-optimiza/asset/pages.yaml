  md: '# Optimization Under Equality Constraints: The General Case


    The goal is to estimate $a$ and $b$ with some linear functions of the random variables
    $Y_i$, $1 \le i \le n$, namely functions of the type $\sum_{i=1}^n w_i Y_i$ from
    some constants $w_i$, $1 \le i \le n$. It is assumed that $\sigma^2$ is given.
    Note each of the desired coefficients $w_i$, $1 \le i \le n$, can be a function
    of $x_j$, $1 \le j \le n$, but not of the $n$ random variables $Y_i$, $1 \le i
    \le n$. As each of the terms $ax_i+b$, $1 \le i \le n$, is not random, half variance
    of the estimator is


    ```

    $$\frac{\sigma^2}{2} \sum_{i=1}^n w_i^2. \quad (4.5)$

    ```


    Of course, one wishes to minimize this variance. Are there any constraints on
    $w_i$, $1 \le i \le n$, as otherwise making them all equal to zero would have
    been optimal (the estimator meaningless?) Indeed there is, and it is called the
    unbiased requirement. Specifically, consider an estimator for $b$. It is an unbiased
    estimator (UBE) if $E(\sum_{i=1}^n w_i Y_i) = b$. To this end, it is needed that
    there exist a pair a and b


    ```

    $b = E(\sum_{i=1}^n w_i Y_i) = \sum_{i=1}^n w_i E(Y_i) = \sum_{i=1}^n w_i(ax_i+b)
    = \sum_{i=1}^n w_i x_i + b \sum_{i=1}^n w_i.$

    ```


    Thus, it is required that


    ```

    $$\sum_{i=1}^n w_i = 1 \quad \text{and} \quad \sum_{i=1}^n w_ix_i = 0.$

    ```


    In other words, we face the problem of minimizing the separable quadratic function
    under two linear constraints. Note that the factor $\sigma^2$ in the objective
    function can be ignored. The resulting estimator is known as the best unbiased
    estimator (BLUE). We next derive this estimator for $b$.


    The Lagrangian function is


    ```

    $L(w_1, \dots, w_n; \lambda_1, \lambda_2) = \frac{1}{2} \sum_{i=1}^n w_i^2 - \lambda_1(\sum_{i=1}^n
    (w_i - 1)) - \lambda_2 \sum_{i=1}^n w_ix_i.$

    ```


    Taking derivatives with respect to $w_i$, $1 \le i \le n$, and setting them to
    zero yields


    ```

    $w_i - \lambda_1 - \lambda_2x_i = 0, \quad 1 \le i \le n. \quad (4.6)$

    ```


    Summing up these $n$ equations, and remembering that $\sum_{i=1}^n w_i = 1$, yields


    ```

    $1 = n\lambda_1 + \lambda_2 \sum_{i=1}^n x_i.$

    ```'
