- pgno: 278
  md: 'Continuous Optimization for Data Science


    (e) Solve the dual optimization problem.


    (f) Compare the objective values of both the primal and dual problems.

    Do they coincide?


    # Solution:


    (a) First,


    ```

    $L(x, \lambda) = \frac{1}{2}x^T Ax-\lambda^T(Ax-b).$

    ```


    Second, the KKT conditions (4.2) are


    ```

    $x-A^T\lambda = \underline{0} \in R^n$,

    Ax-b = \underline{0} \in R^m$.

    ```


    These equations can be merged into $b=AA^T\lambda$, which becomes $\lambda=(AA^T)^{-1}b$.
    The optimal objective value becomes $\frac{1}{2}x^Tx=\frac{1}{2}\lambda^T(AA^T)^{-1}b$.
    The KKT FOCs are sufficient because the problem is convex.


    (b) The dual function $\phi(\lambda): R^m \rightarrow R$ is therefore


    ```

    $$\phi(\lambda) = \min_x \frac{1}{2}x^Tx-\lambda^T(Ax-b).$.

    ```


    (c) Differentiating the objective value with respect to $x$, we get that $x-A^T\lambda=0$,
    which yields $x=AA^T\lambda$. Inserting into the objective value, we obtain the
    dual function


    ```

    $$\frac{1}{2}\lambda^T AA^T\lambda-\lambda^T(AA^T\lambda-b)=-\frac{1}{2}\lambda^T
    AA^T\lambda+\lambda^T b$.

    ```


    (d) The dual problem is


    ```

    $$\max_\lambda \frac{1}{2}\lambda^T AA^T\lambda+\lambda^T b$. (4.22)

    ```


    (e) Differentiating the above with respect to $\lambda$,


    ```

    $$-AA^T\lambda+b=\underline{0} \rightarrow \lambda=(AA^T)^{-1}b$.

    ```


    (f) The maximum objective value is then


    ```

    $-\frac{1}{2}b^T(AA^T)^{-1}b+b^T(AA^T)^{-1}b=-\frac{1}{2}b^T(AA^T)^{-1}b$,

    ```


