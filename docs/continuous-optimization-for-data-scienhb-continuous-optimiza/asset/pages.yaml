    duality theorem.


    The dual function


    ```

    $$\phi(\lambda) = \min_{x \in R^m} \left\ \frac{1}{2}x^T Qx - \lambda^T(Ax - b)
    \right\$

    ```


    where $\lambda \in R^m$. Deriving the value of the dual function is an easy task
    as it is an unconstrained quadratic optimization function. In particular, from
    (2.9), it follows that the minimization defining the dual function is attained
    at


    ```

    $x^*(\lambda) = Q^{-1}A^T\lambda,$ \quad (4.14)

    ```


    and, by minimal algebra, we get that


    ```

    $$\phi(\lambda) = -\frac{1}{2}\lambda^T AQ^{-1}AT\lambda + \lambda^Tb$

    ```


    Using (2.9) again and noticing that we are solving a maximization problem, namely
    minimizing $-\phi(\lambda)$, we get that


    ```

    $$\lambda^* = \arg \max_{\lambda \in R^m} \phi(\lambda) = (AQ^{-1}A^T)^{-1}b$

    ```


    and


    ```

    $$\phi(\lambda^*) = \frac{1}{2}b^T(AQ^{-1}A^T)^{-1}b$

    ```


    which is the value of the objective function (of both the primal and dual problems).
    Finally, the optimal solution of the primal problem is, by (4.14),


    ```

    $x(\lambda^*) = Q^{-1}A^T\lambda^* = Q^{-1}A^T(AQ^{-1}A^T)^{-1}b$

    ```


    It is easy to check that $x(\lambda^*)$ is primal feasible, namely $Ax=b$ and
    that the value of its objective function equals


    ```

    $$\frac{1}{2}x^T(\lambda^*)Qx(\lambda^*) = \frac{1}{2}b^T(AQ^{-1}A^T)^{-1}b$

    ```


    In other words, there is no duality gap.'
