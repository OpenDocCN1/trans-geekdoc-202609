  md: '# Chapter 2


    # Multi-Variable Unconstrained Optimization


    2.1 Introduction


    2.1.1 Notation and preliminaries


    Single-variable functions were studied at length in the previous chapter. We now
    consider the more general case of multi-variable functions. Admittedly, from a
    technical point of view, the single-variable case is subsumed by as many times
    as needed. The multivariable. Yet, we believe some intuition on single-variable
    functions is lost in the more general case.


    Let $f(x): R^n \rightarrow R$ be some function. Then it is differentiable as many
    times as needed. Denote by $

    abla f(x) \in R^n$ the vector with its $n$ partial derivatives, called the *gradient*
    of the function at $x$, and by $

    abla^2 f(x) \in R^{n\times n}$ the symmetric matrix with $n\times n$ mixed partial
    derivatives, called the *Hessian matrix* of the function at point $x$. We use
    the notation $\nabla_yf(x)$ for the case where only the partial derivatives of
    a subset of variables, denoted by $y$, are taken. The notation $

    abla^2_{yz}f(x)$ is used similarly. Of course, $\nabla^2_{zy}f(x) = (\nabla_yf(x))^T$.
    Finally, for $x \in R^n$ we denote $\sqrt{\sum_{i=1}^n x_i^2}$ by $||x||$, which
    is referred to as the $\ell_2$-norm of $x$.


    The Taylor theorem tells us that the multi-variable version of (1.1) is


    ```

    $f(x) = f(x_0) + (x-x_0)^T\nabla f(x_0) + \frac{1}{2}(x-x_0)^T\nabla^2 f(y)(x-x_0),
    \quad (2.1)$

    ```


    for some $y \in R^n$ in the line connecting $x_0$ and $x$. Truncating the quadratic
    term in the Taylor expansion results in the function


    ```

    $f(x_0) + \nabla^T f(x_0)(x-x_0), \quad (2.2)$

    ```'
