- pgno: 11
  md: '# Preface


    Continuous optimization, sometimes referred to as nonlinear programming (NLP),
    is an old topic that deals with optimizing continuous functions. It has two main
    branches: unconstrained and constrained optimization. This text presents both
    theory and algorithms for solving such problems. Both branches are now more popular
    than ever and are being used in statistics, data science, and machine learning.
    Indeed, many of the examples given in the text are from the theory of statistics.


    The text is suitable for third-year bachelor and first-year master students in
    statistics and data science, computer science, operations research, engineering,
    and mathematics. I believe that anyone who is interested in optimization should
    acquire the material given in the text. For those who wish to specialize in NLP,
    it can be used mainly as an introductory text, prior to moving to more advanced
    and more detailed texts as [5].


    A course in multi-variable calculus is a prerequisite for this text. The same
    can be for linear algebra. A possible linear algebra text is [14], where Chapters
    1–10 are required. On the other hand, no prior knowledge of linear programming
    is required. Sections 1.3.2, 1.3.3, 2.3.1, 2.3.2, and Example 7 in Section 4.2.1
    require previous exposure to parametric statistics, but they can be skipped without
    loss of continuity.


    The text is comprised of three parts and in the following order: unconstrained
    optimization, constrained optimization, and linear programming (LP). Part 1 on
    unconstrained optimization is covered in Chapters 1 and 2. Chapter 1 examines
    single-variable functions, where conditions for optimality are set and algorithms
    for finding the optimal points are designed. In Chapter 2 we examine multi-variable
    functions, tackling similar problems. In particular, we introduce the steepest
    descent, Newton, and quasi-Newton algorithms. This chapter ends with the Expectation-Optimization'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Continuous Optimization for Data Science


    (EM) algorithm for parameter estimations in probabilistic models, and it can be
    skipped without continuity.


    Part II on constrained optimization is covered in Chapters 3 and 4. Chapter 3
    deals with equality constraints, where the objective function is separable in
    the decision variables. Some illuminating examples dealing with queueing models
    are given. We end this chapter by deriving solutions cases where all constraints
    are linear. The assumption of linear equality constraints simplifies the analysis
    considerably. Moreover, it paves the way for formulating a constrained optimization
    problem, now that the constraints are not necessarily linear. The approach taken
    here is quite different from those taken in most textbooks that usually do not
    deal separately with linear. Chapter 4 discusses the case where no further assumptions
    are made on the objective and the constraint functions, but still under the assumption
    of equality constraints. In particular, conditions for optimality are stated.
    Sensitivity analysis is dense, and a duality theorem of nonlinear programming
    is stated and proved. In Chapter 5, we add inequality constraints. After, the
    optimality conditions are set, where the analysis stems from the case of equality
    constraints and uses the sensitivity analysis done for this case. Finally, a number
    of algorithms for solving constrained optimization problems are provided.


    Part III on linear programming is covered in Chapters 6, 7, and 8. This part is
    self-contained and can be read independently of the rest of the text. It is put
    as Part III I believe that, educationally, it is better to first study NLP and
    then switch to the special features of LP. Chapter 6 formulates the LP problem,
    while Chapter 7 gives basic solutions, states the simplex algorithm, and proves
    its convergence to the required optimal solution. Chapter 8, the concluding chapter,
    discusses sensitivity analysis. Other algorithms, as those based on interior points,
    are beyond the scope of this book.


    I was not in this project. Many thanks are to those who assisted me. Yonatan Woodbridge
    was in charge of the solution sets of the first four chapters. Nir Brosh went
    through the text and spotted many points that called for correction. He also took
    care of the solution set for the exercises of Chapter 5. Zheng Wen and Ruohang
    created the illuminating graphics. Mor Ben Ari, Anat Cohen and Yoseph Joffe were
    very helpful at the final stages of editing this book. Finally, Doron Haviv gave
    me a few ideas on what to include, as well as what not to include, in the book.
    Financial support by ISF 1512/19 is acknowledged.'
