  md: '# Optimization Under Equality Constraints: Special Cases


    First, consider the case where $n = 1$ and hence remove the reference to the index
    of the class. In this case, one maximizes the single-value function


    ```

    $f(x) = Rx - C_x\frac{1}{\mu - x}, \quad 0 \leq x \leq \mu.$

    ```


    This is a concave function, and by checking the FOCs, it is easy to see that maximization
    is attained at


    ```

    $x^* = \mu - \sqrt{\frac{C_mu}{R}}.$ (3.11)

    ```


    Moreover,


    ```

    $f(x^*) = (\sqrt{R\mu} - \sqrt{C_x})^2.$ (3.12)

    ```


    Second, and back to the general case, suppose that the total arrival rate is fixed
    to $\lambda < \mu$. Then, the problem we face is that


    ```

    $\max_{x_i, 1 \leq i \leq n} \left\\{\sum_{i=1}^n x_i \left( R_i - C_i \frac{1}{\mu
    - \lambda} \right) \right\$

    \text{s.t. } \sum_{i=1}^n x_i = \lambda,\nx_i \geq 0, \quadquad 1 \leq i \leq
    n.$

    ```


    The solution for this problem is immediate: Let


    ```

    $i^* = \arg\max_{i=1}^n \left\{\lambda \left( R_i - C_i \frac{1}{\mu - \lambda}
    \right) \right\$\.$

    ```


    Then, $x_*} = \lambda$ and $x_i = 0, 1 \leq i \neq i^* \leq n$. This is a typical
    $class-dominance$ result: those who are eventually demanded to service belong
    to a single class, while all others are refused entry. This fact also implies
    the optimal choice for $\lambda$.


    Finally combining with (3.12), we conclude that the optimal value of the function
    equals


    ```

    $\max_{i=1}^n(\sqrt{R_i\mu} - \sqrt{C_i})^2,$

    ```


    where the optimal solution (see (3.11)) is $x_*} = \mu - \sqrt{\frac{C_mu}{R_{i^*}}}$
    and $x_i = 0, 1 \leq i \neq i^* \leq n$, with


    ```

    $i^* = \arg\max_{i=1}^n(\sqrt{R_i\mu} - \sqrt{C_i})^2.$

    ```'
