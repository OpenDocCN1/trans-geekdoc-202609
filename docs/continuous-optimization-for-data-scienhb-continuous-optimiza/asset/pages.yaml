    We are interested in a special case of the above problem, namely


    ```

    $$\min_{x \in R^n} ||x-c||^2,\n$\text{s.t.} \quad a^T x = b,$$

    ```


    where $a, c \in R^n$, and $b \in R$. The set of points $x \in R^n$ that satisfy
    $a^T x = b$ is called a *hyperplane*. Thus, we want to identify the closest point
    in this hyperplane to some given point $c$. Based on (3.21) and the change of
    scale where the scalar $b$ is replaced with $b-a^T c$, we can see that this point


    ```

    $x^* = \frac{b-a^Tc}{||a||^2}a+c,$

    ```


    while the distance itself equals


    ```

    $||b-a^Tc||/||a||.$ (3.22)

    ```


    This distance is referred to as the (orthogonal) *distance between* $c$ and the
    hyperplane.

    A specific case of this is when we consider the distance between two parallel
    hyperplanes. two hyperplanes $a_i^T x = b_i, i=1,2$, are said to be parallel if
    $a_1=a_2$, which are accordingly denoted by $a$. From (3.22), we infer that in
    this case the distance between the two hyperplanes $||b_1-b_2||/||a||$. An alternative
    argument is as follows. Suppose for $x_0 \in R^n, a^T x_0=b_1$. Then, consider
    the following optimization problem:


    ```

    $$\min_{x \in R^n} ||x-x_0||^2,\n$\text{s.t.} \quad a^T x = b_2.$

    ```


    Finally, the distance itself equals


    ```

    $||b_2-a^Tx_0||/||a|| = ||b_2-b_1||/||a||.$ (3.23)

    ```


    Note that, as expected, the choice of $x_0$ does not matter (as long as it is
    on the first hyperplane).


