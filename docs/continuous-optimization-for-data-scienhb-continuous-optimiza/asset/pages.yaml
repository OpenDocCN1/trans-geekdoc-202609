    \ \\frac{-(B^{-1}b)_j}{B_{ji}^{-1}} \\right\\}$\n```\n\nsince we have slack in\
    \ these constraints, the minimization is over an empty set, indicating that the\
    \ allowable increase is infinite. Thus, $x^*$ remains optimal for the modified\
    \ LP as well."
