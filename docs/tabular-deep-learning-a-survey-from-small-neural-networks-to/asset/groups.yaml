    SSL 中，模型通过创建自己的标签从未标记数据中进行学习。换句话说，它从数据本身生成“监督信号”，而不需要标签。例如，它使用前置任务（预测序列中的下一个 token、图像的一部分、数据的掩码等）。通过这种方法，模型学习到了数据的表示，该表示可用于后续任务。SSL
