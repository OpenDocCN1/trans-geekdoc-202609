    of data and then applied to a smaller dataset by tuning. Transfer learning allows
    skills learned from a large pre-training to be transferred to a dataset where
    there are many fewer examples.


    # 6. From machine learning to tabular deep learning


    Tabular data is the oldest form of data that has been analyzed (long before images
    and text) and therefore the focus of early machine-learning approaches. Techniques
    such as linear regression, logistic regression, and decision trees were the preferred
    choice for tabular data. These approaches have been shown effective with small
    datasets (most initial datasets), especially for regression. These systems showed
    limitations, sometimes in some cases as noisy data, many correlated features,
    and low-frequency categorical variables. On the other hand, many specialized models
    such as Support Vector Machines (SVM) have shown effectiveness in the presence
    of many correlated (non-convex optimization, increased computational cost), but
    these problems could be solved with good feature engineering [42]. These methods
    were also interpretable, capable of handling both numerical and categorical variables,
    and easy to implement. Although neural networks were not the beginning on tabular
    data, the focus quickly shifted to homogeneous data (given the successes with
    convolutional networks).


    The explosion of e-commerce led to a renewed interest in tabular data, especially
    for models that could handle heterogeneous data. This also led to renewed interest
    precisely for the ability of neural networks to identify complex relationships
    and reduce feature engineering. During the same time, neural networks have become
    increasingly popular, especially in other applications such as computer vision
    and natural language processing. This has motivated researchers to modify classical
    MLPs to make them more suitable for tabular data than simply importing architectures
    from other data types. As many time these were computationally expensive and inefficient
    inference for large datasets [91], XGBoost has turned into the new standard, especially
    for small tabular datasets. At the same time research on making neural networks
    more suitable for tabular data.

