    此外，并非所有模态都存在，而是存在一种对最常见模态的普遍偏向。这可能导致模型只关注最频繁的模态。多模态元素是最频繁的前沿领域之一，但对于表格数据，我们能对齐低维表格数据和高维图像/文本嵌入之间的特征吗？我们能创建集成非结构化模态（图像或文本）与结构化数据的架构吗？我们如何通过策略（早期、中期或后期融合）处理缺失数据或冲突？如何确保模型是完美的？我们能创建可靠的基准吗？


    遇到新任务。学习并增长 [204] 建议在保留原始模型的同时显式学习任务特定的结构。假设不同任务可能从模型学习不同的结构。正则化技术的使用同样流行 [60]。在神经网络中，可以通过调节塑性来防止知识被遗忘。额外的正则项尝试模仿这一点。TRIL3（表格数据回放增量学习）方法通过设计向新数据添加旧数据来防止遗忘。[214]
    提出使用特征提取来解决引入变化的特征问题。在任何情况下，必须考虑临床环境、金融和工业应用中的数据集。通常认为使用持续学习重新训练模型更经济。随着在动态环境中使用增加，持续学习本身可能是一个非常有前景的方向。有很多有趣的问题，例如：我们如何设计平衡塑性（对新知识的适应性）和稳定性（保留先前的知识）的算法？这些可以通过浅神经网络解决吗？对于新任务（或任务），使用这些算法还是从头训练一个新的神经网络更有效？我们能对所有类型的数据泛化吗？我们如何处理特征漂移和架构变化？我们如何构建评估随时间变化的模型？


    持续学习和终身学习是人工智能的开放问题之一。人类能够感知外部刺激，能够学习并适应环境的变化，并在新情况下积累知识 [343]。一些算法认为模型应该捕捉静态数据分布，而动态数据分布。分布的变化以异构的方式给出：灾难性（模型丢失已得知识或技能）或缺乏塑性（模型无法适应、获取新知识）。通过使用正则化方法解决这些问题。


    因果推理


    相关性与因果关系经常被混用，但它们实际上含义不同。相关性定义了两者之间的关系'
