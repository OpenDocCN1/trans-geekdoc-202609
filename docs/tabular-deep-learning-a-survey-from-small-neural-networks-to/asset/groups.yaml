    MLP 主要依赖于加法变换后接激活，但 PNNs 整合了特征之间的乘法交互。MLP 难以捕捉表格数据中常见的复杂特征交互（即高阶交互）。因此，PNNs 使用特征之间的加法和乘法交互来更好地捕捉局部交互（特别是类别性的）。Kolmogorov-Arnold
