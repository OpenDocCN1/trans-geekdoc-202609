    [12, 167]。这种方法能更好地保持分布的形状，并且在特定的机器学习算法中，这些算法用于预测条件：


    传统上，梯度提升决策树（GBDT）模型在表格数据上的表现优于深度学习（DL）模型。架构的最新进展缩小了差距，使得深度学习模型能够与 GBDT 竞争，，特别是在有效处理分类变量时。虽然深度学习模型在分类和回归方面具有强大的性能，但在回归任务中，神经网络往往无法有效地对复杂的目标函数建模。调优良好的神经网络可以在特定的现实场景或领域特定应用中与
    GBDT 竞争。值得注意的是，即使是较小的网络也可以具有竞争力，减少了通过数据增强和正则化技术来缓解过拟合的需求。然而，GBDT 模型只需要较少的数据就能表现良好。LightGBM
    仍然是性能最好的 GBDT 模型。在深度学习方面，MLP、SAINT、NOTE 和 Transformer 的改进版本显示了良好的前景。总而言之，没有单一的最优选择，选择取决于特征和特定的数据集。许多先前的基准测试受到数据泄露、过时数据集或过采样数据集的影响，这凸显了对更具代表性的基准测试的需求。此外，许多在有限数据集上的评估重复了相同的局限性，而没有考虑新的架构。


