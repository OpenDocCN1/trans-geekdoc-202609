    深度学习模型不仅在性能上应该与基于树的算法相当甚至更好，而且应该同样保持高效 [287]。


    此外，决策树没有可靠的概率估计，不支持端端优化，而是采用贪心和局部优化。


    - **可解释性**：深度学习模型应该是透明的，或者其预测应该是可解释的。如果它被用于医疗保健或金融等敏感应用，这一点尤为重要 [287]。此外，还有诸如《加州隐私法案》（CPA）、欧盟
    AI 法案和欧洲通用数据保护条例（GDPR）等法规要求算法合规 [107, 106, 85]。这些法规可能会使这些标准更加严苛，或者变得更加重要。


    ### 5.1. 深度学习的需求

    尽管备受关注，但深度学习模型在表格学习中必须在某些方面具有竞争力（图 2）：


    - **性能等同或优于基于模型的模型**：第一个评估标准是保持深度学习模型的性能。拥有能够在性能上与 GBDT 模型竞争的模型将是理想的。


    - **效率**：深度学习模型通常计算开销大，参数可能包含数百万甚至数十亿个。


    - **数据表示**：深度学习模型应该学习数据的高效表示。深度学习模型在其他领域的优势在于通过学习复杂的（且层次化的）关系来捕捉数据和数据关系，这种关系可以用于其他任务。例如，在一个数据集上训练的模型可以通过迁移学习应用到其他数据集上。


    - **自监督学习**：自监督学习是在没有无标签数据的情况下，通过利用大型原始数据集进行学习的能力，尽管这不是必要要求，或者会带来不便的缺点。模型对无关特征和过拟合更具鲁棒性。许多模型通过添加正则项或将神经网络组合成集成模型来实现。某些数据集很小，因此人们一直在尝试创建生成额外数据的方法（数据增强）。其他创新使得与传统模型缩小差距成为可能。例如，嵌入（embeddings）的使用改进了对类别变量的处理以及从中提取信息。正则化技术显著减少了过拟合并使模型更加稳定。在
    ImageNet 和 Transformer 成功之后，人工智能社区发生了范式转移。模型在其他领域已成为标准，尽管它们在小量数据上训练，然后通过调优应用于较小的数据集。迁移学习允许从大型预训练中学到的技能转移到示例少得多的数据集上。


    # 6. 从机器学习到表格深度学习


    表格数据是被分析的最早的数据形式（早于图像和文本），因此是早期机器学习方法的重点。线性回归、逻辑回归和决策树等技术是表格数据的首选。这些方法被证明在小数据集（大多数初始数据集）上是有效的，特别是对于回归任务。这些系统显示了局限性，有时在某些情况下表现为噪声数据大、许多相关特征和低频类别变量。另一方面，许多专门的模型（如支持向量机
    SVM）在存在许多相关特征的情况下显示出有效性（非凸优化，计算成本增加），但这些问题可以通过良好的特征工程来解决 [42]。这些方法也具有可解释性，能够处理数值型和类别变量，并且易于实现。尽管神经网络不是处理表格数据的起点，但重点很快转移到了同质数据上（鉴于卷积神经网络的成功）。


    电子商务的爆炸导致了人们对表格数据的重新关注，特别是对于能够处理异构数据的模型。这也导致了人们对神经网络识别复杂关系和减少特征工程的能力的重新关注。在此期间，神经网络变得日益流行，特别是在计算机视觉和自然语言处理等其他应用中。这促使研究人员修改经典的多层感知机（MLP），使其比直接从其他数据类型导入架构更适用于表格数据。由于许多时候这些模型的计算开销大且在大型数据集上的推理效率低下
    [91]，XGBoost 已经成为新的标准，特别是对于小型表格数据集。与此同时，关于使神经网络更适用于表格数据的研究也在进行。


