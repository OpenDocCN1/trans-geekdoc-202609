    自动机器学习（AutoML）是一种新的 ML 范式，自动化特征工程、模型选择和超参数调优。AutoML 允许处理结构化数据集（电子表格、数据库、CSV 文件）作为输入，生成模型并将结果给用户。AutoML
    自动搜索数据填充、类别编码、特征选择、异常值识别）、特征处理（特征选择、创建和转换）、模型选择（为特定任务选择模型）、模型优化（寻找最佳超参数）和可视化。特别是对于对数据科学不熟悉的用户，AutoML
    有助于节省时间、工作量并找到最佳模型和超参数。然而，AutoML 仍然缺乏定制化，实现了一些通用模型，全过程控制对于复杂数据集和任务效果并不理想。至少，针对表格数据的
    AutoML 需要专业领域，因为数据具有特殊复杂性，社交模型也可能出错（表 14）。AutoGAN 是 AutoML 库的一个示例，它处理多种模型。它最好的功能之一是允许对许多模型进行多层堆叠/集成。AutoGAN
    处理整个过程，从特征工程到训练。H2O AutoML 训练不同类型的模型（例如基于梯度的方法、随机森林、GLM 以及神经网络），并进行搜索以识别顶尖模型。H2O
    AutoML 设计用于处理大型数据集，并启用分布式和多线程支持。PyCat 是另一个低代码库，旨在简化模型训练过程，并与其他库兼容（可以在其他库之上使用）。FLAM（快速轻量级自动机器学习）引入了自适应策略来优化超参数选择。FLAM
    支持不同类型的任务（分类、回归、时间序列预测等），返回最佳。


    ### 联邦学习

    联邦学习（FL）是一种备受关注的方法，具有前景。联邦学习是有前景的，但仍留有不同的问题：我们如何开发为表格数据定制的算法？选择架构（例如浅层与深层、表格专用与通用型）对联邦学习的影响是什么？我们可以将联邦学习与自监督学习（SSL）和合成数据生成结合吗？

