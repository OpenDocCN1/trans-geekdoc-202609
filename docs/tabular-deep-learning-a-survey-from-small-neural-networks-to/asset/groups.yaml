    collection in the real-world data during the training data). Deep learning methods
    assume i.i.d. and can overfit to the specific feature-label relationships present
    in data. In comparison to tree-based models, deep learning models are more robust
    when they encounter unfamiliar or dissimilar patterns.


    # 3.9. Bias in tabular models


    As machine learning are increasingly deployed in high-stakes settings (such as
    credit scoring, healthcare, justice), fairness has become a fundamental requirement
    [239, 191, 97]. Tabular data are not one of the main formats used in these domains,
    and they present unique issues that have been less explored than other datasets
    [239, 191]. Specifically, fairness in machine learning refers to the absence of
    unfair direct or indirect treatment of individuals or groups based on attributes
    such as gender, race, age, socioeconomic status. In tabular data, these attributes
    are explicit in the contexts of the datasets (for example, names indicating race
    or include of a group of people), allowing one to observe (and then correct) but
    at the same time making it to train models. Bias in tabular models can manifest
    itself in different ways such as for certain datasets (e.g., zip code) with sensitive
    features, or through historical bias. In contrast to images and text, it is much
    easier to define such features. In addition, the lack of inductive bias makes
    deep learning models at risk of learning unintended correlations.


