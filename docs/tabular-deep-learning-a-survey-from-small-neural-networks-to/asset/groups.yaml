    Gradient Boosting Decision Trees (GBDT). Pretraining can be seen as a form of
    regularization that enables better localization, reducing the risk of overfitting
    and improving generalization capabilities. [14] introduces harmonic loss as an
    alternative to cross-entropy loss for training neural networks.

