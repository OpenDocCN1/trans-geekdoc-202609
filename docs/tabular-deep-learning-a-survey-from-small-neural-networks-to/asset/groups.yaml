    # 表格数据深度学习：从小型神经网络到大模型的综述


    Salvatore Raieli¹


    ¹Oncodesign Precision Medicine, 18 rue Jean Mazen, Dijon, 21000, France

    通讯作者：salvatore.raiei@gmail.com


    # 摘要


    表格数据在多个现实领域中无处不在，包括金融、医疗、网络安全和电子商务。尽管深度学习在同质数据（如计算机视觉和自然语言处理）中占据主地位，但梯度提升决策树（GBDT）仍然是表格数据任务的最先进技术。多年来，研究人员开发了多种模型，试图解决深度学习的缺点，并缩小与
    GBDTs 之间的差距。本综述对用于表格数据的深度学习进行了全面回顾，涵盖了系统性的分类法和一系列资源。我们讨论了最新模型的优点和局限性，探讨了自监督学习、预训练策略和自动机器学习在表格数据深度学习中的作用。除了架构之外，我们还讨论了实际考虑因素，包括可解释性、可扩展性、模型选择建议，并讨论了开放问题和未来趋势。本综述对于研究人员和从业者来说是一项实用的资源，提供了关于表格数据深度学习现状和轨迹的见解。


    **关键词：**表格数据，深度学习，神经网络，Transformer，大语言模型


    # 1. 引言


    表格数据是现实应用中的主要数据格式，包括金融、医疗、电子商务和网络安全。深度学习在图像和语言等结构化领域的主导地位并没有有效地扩展到表格数据，而在后者传统方法仍然占据主导地位。事实上，对于长期而言，基于树的模型（如
    XGBoost、GBM 和 CatBoost）在大多数表格数据任务中的表现优于深度学习。这是由于表格数据的复杂性（特征数量、小规模多样性、所需的预处理、缺乏归纳偏差或过拟合），这些因素为深度学习定义了一个获胜的架构。然而，多年来，已经开发出许多专门针对表格数据的架构，提升了深度学习模型的性能。本综述对表格数据学习提供了全面且最新的回顾，涵盖了以下点：


    - 神经网络和决策树的挑战与局限性。

    - 考虑到近期发展（包括新架构和为其他领域开发的模型的适配）的深度学习模型分类法。

    - 表格数据内部发生的趋势以及模型对比综述。

    - 挑战和开放性问题。

    - 针对表格数据深度学习的资源。


    我们在此提供代码和其他资源。


    # 2. 表格数据的定义


    表格数据可以定义为结构化数据的一个分支。根据惯例，任何可以定义为表格的数据，其行代表样本，列代表特征。与非结构化数据不同，在现实应用中，大多数数据都是表格格式（它们在金融、医学、气候科学和制造业中占据主导地位）。


    与图像、文本或音频（这些都是同质的，因为它们只有一种特征类型）不同，表格数据是异质的（因为它们可以包含多种类型的特征）：


    - 分类值：一种特殊的特征类型，包含定性（或离散）值，代表有限的术语，没有内在顺序。示例包括性别、类别和产品类别。

    - 二值值：分类特征的一种特例，该特征可能只有两个值（通常为 0 或 false）。例如患者的生存状态，可以是存活也可以是死亡。

    - 序数值：分类特征的一种特殊类型，其值是离散的，具有内在顺序。示例包括健身活动的频率（有时是 > 很少）或在离散值中的高表达（年龄 > 较短）。

    - 连续值：包含连续值的特征。


    对于线性模型，关系通常由给出：


    ```

    $f(X) = WX + \mathbf{b}$

    ```


    其中 $W \in \mathbb{R}^{d \times n}$ 是权重矩阵，$\mathbf{b} \in \mathbb{R}^d$ 是偏置。


    在具有单隐藏层的神经网络（多层感知器）中，引入了非线性函数 $\sigma$：


    ```

    $f(X) = \sigma(WX + \mathbf{b})$

    ```


    其中 $W \in \mathbb{R}^{d \times n}$ 且代表隐藏层中神经元的数量。


    在具有多层的多层感知器（MLP）中，第 $l+1$ 层的表示为：


    ```

    $H^{(l+1)} = \sigma(W^{(l)}H^{(l)} + \mathbf{b}^{(l)})$

    ```


    对于神经网络训练，通过损失函数使预测值与标签之间的差异最小化：


    ```

    $\min_{\theta} \sum_{i=1}^{N} L(f(x_i; \theta), y_i)$

    ```


    在某些情况下，训练中可能会添加正则化项（$\theta$ 是一个通用函数）：


    ```

    $\min_{\theta} \sum_{i=1}^{N} L(f(x_i; \theta), y_i) + \lambda \Omega(\theta)$

    ```


    $\hat{y}$ 和 $y$ 的定义取决于任务，例如分类的交叉熵和回归的均方误差。


