    Some datasets are small, so efforts have been made to create methods for generating
    additional data (data augmentation). Other innovations have made it possible to
    close the gap with traditional models. For example, the use of embeddings has
    improved the treatment of categorical variables, and the extraction of information
    from them. Regularization techniques have significantly reduced overfitting and
    made the norm more robust. These techniques can be used in combination with deep
    neural networks becoming popular, after the success of ImageNet and Transformer,
    there has been a paradigm shift in the artificial intelligence community. Models
