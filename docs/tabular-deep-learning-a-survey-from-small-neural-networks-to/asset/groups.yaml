    试图平衡准确性与速度。TPOT（基于树的流水线优化）使用遗传算法优化 scikit-learn 组合（预处理步骤、选择器）种群并最大化得分。然后可以使用 Python
    对基准进行增强。尽管该系统具有大量流水线的优势，但对于复杂数据集来说可能很慢。MLAuto 针对特定需求允许不同的运行模式，例如优先考虑解释性、准确性以及平衡速度与准确性。它默认会执行参数查找、模型集成，并附带解释（SHAP、重要性检测、文本可视化）。Auto-sklearn
    是一种基于贝叶斯的 AutoML，可以作为 scikit-learn 的封装器。它快速且简单，但它们在方法上有所不同，且文档详备并活跃。Pyaret 被认为是最适合初学者的，其次是具有自身缺点的框架，并不是说它们无法达到准确性，而是需要投入努力但学习曲线仍然平缓的框架，集成是成功的关键之一。TPOT
    消耗的资源最多（在时间方面），其次是 sk-learn，而 HAutoML 则针对并行处理进行了优化。AutoML 在几个应用中特别有趣，但仍留有几个开放性问题：我们能降低
    AutoML 的计算成本吗，特别是在大数据集上？AutoML 如何处理不同类型的任务，如多模态数据、时间序列数据集？我们能实现高性能、可靠且可解释的 AutoML
    流水线吗？我们能获得交互式的、人类参与的 AutoML 过程吗？


    多模态表格学习。深度学习模型的优势之一是它们可以集成到多模态系统中，其中表格数据和图像可以使用单一深度学习架构。深度学习模型的另一个优势是它们可以学习未见过的数据的表示。通过使用多模态模型，模型可以关联不同模态中存在的信息以获得更好的性能。这些模态有几种集成方式（早期融合、后期融合或混合融合）（图
    17）。最广泛的方法是从从就开始将原始数据合并到单一表示空间中。这可以通过分类器的嵌入来实现 [180]。相反，后期融合涉及独立地处理每个模态，并在最后一步进行组合（每个模态对应一个模型，然后由元学习器学习组合后的表示）。后期融合可以看作是每个模态都有一个独立的专家，并找到通过平均或另一个元专家的方法将它们结合。混合融合是一种折中方案，编码器之间的公共层是共享的。例如，对于基于
    Transformer 的模型使用交叉注意力机制。早期提出的早期融合方法是将来自表格和文本模态的特征相结合的方法（例如，将 DocV2 或 BERT 与多个特征结合并输入共享网络
    [40]）。然而，早期融合的劣势在于模态特征处于非常不同的潜空间中，导致了不同的融合方法。后期融合的额外优势是可以使用预训练的编码器（例如，我们使用 BERT
    处理文本数据，使用 ResNet 或 Vision Transformer 处理图像，使用 Transformers 处理表格数据）。这捕捉了信息并整合了表示。


    后期融合的另一个额外优势是编码器允许了跨其他模态学习信息的可能。另一个例子是 LISTER，通过各种编码器（例如，文本 Transformer、Transformer
    和表格 Transformer）集成表格数据，其输出通过多模态编码器生成并连接（该编码器使用交叉注意力进行共享）。[111] 使用 LSTM 同时捕捉无条件和多模态数据。ModFuse
    专门为模态未配对且需要处理某些模态数据的情况而设计。融合 [83] 则使用注意力机制通过使用表格数据处理缺失数据，将 CNN 添加到 EHR 特征中。这在性能上显示出优势，如医学应用综述
    [190] 所示。多模态模型优于单态模型 [83]。这在价值信息任务中已得到证明，结合表格和文本数据导致与基准相比持续增加 [194]。这在股票价格预测、信用评分和推荐等应用中得到了证明
    [344, 344]。因此，模态集成仍然重要，尽管对齐结构化和非结构化数据仍然是一个挑战，因为数据的异构性以及模态之间的尺度差异（例如，患者的表格数据可能是几列，而文本也处于
    51 维空间）。


    | 库 | 说明 |

    | --- | --- |

    | AutoGluon | 专注于准确性，参数的贝叶斯搜索，大量模型，返回集成模型 |

    | H20 AutoML | 自动预处理和特征工程，对不同模型进行随机搜索，返回集成模型 |

    | PyCare | 执行广泛预处理，对不同模型进行深层超参数优化，返回集成模型 |

    | FLAML | 针对速度优化，对最佳参数进行自适应低成本搜索，返回单个模型 |

    | TPOT | 通过遗传演化超参数以评估不同模型，返回最佳流水线 |

    | MLJAR AutoML | 执行广泛的数据处理、不同的超参数优化方法、以及丰富的模型库并返回集成模型 |

    | AutoSklearn | 基于 scikit-learn 的自动化机器学习工具包 |


