    encoding）、序数编码（ordinal encoding）和函数。例如，标签编码为每个可能的类别分配一个整数：(意大利 Italy, 法国 France,
    德国 Germany)将被映射为 [0:2]。由于简单性，如果这些特征不是序数特征，它会继承非顺序的顺序细节，对高基数（不同类别过多）处理得不佳，且可能缺乏活性。独热编码（One-hot
    encoding）是一种将类别值转换为二进制表示（独热向量）的技术。每个类别编码由代表单个类别的元素向量表示，该向量对应特定类别的索引：意大利、法国、德国将被映射为
    [[1,0],[0,1],[0,1]]。独热编码并不意味着相似性，解决了标签编码的一个问题，并与机器学习模型良好结合，因为它不暗示特征之间的关系，并且显式地表示每个类别，保持了区分度（变量也更具解释性）。独热编码的可扩展性差，它会增加数据集的维度，并导致稀疏矩阵（高基数会导致过拟合风险、训练缓慢和推理缓慢）。当有新数据和需要添加新列时，处理非常复杂，需要重新训练。哑变编码（Dummy
    encoding）是一种避免重复类别的技术：(意大利,法国,德国)将被映射为 [[0,0],[1,0],[0,1]]。另一种，始终编码（Ever Encoding）是一种非常相似的技术（也称为决策编码），使用
    0 和 1 来表示类别。二进制编码（Binary encoding）则使用二进制表示，每个类别都被分配一个数值（如表格编码），然后将其转换为单独的一列。（意大利、法国、德国将被分配一个数值（意大利=1,
    法国=2, 德国=3），转换为二进制（n 列）。优点是，考虑到 n 列的数量（更高效且可扩展），它不暗示顺序关系，并能与许多算法良好工作。另一方面，它的可解释性较差，会创建相关特征，无法处理新类别，且在小数据集上无效。频率编码（Frequency
    encoding）将每个类别替换为在数据集中出现的频率。这种技术是可扩展的，如果存在不平衡的算法技术，它可以很简单。输出取决于统计计算或应用于数据的机器学习。输出取决于数据分布、方差或其他属性。目标编码（Target
    encoding）则将类别替换为统计值（如平均值），允许将目标变量的信息纳入编码中。这种方法容易导致过拟合，因为它从目标变量中学习类别变量。目标编码是一种在考虑权重考虑目标全局值的方法，旨在减少过拟合风险。频率编码将每个类别替换为该类别的目标值，计算时排除当前数据。它的优点是避免数据泄露并降低过拟合风险（除非是极小数据集），在类别间产生统一的尺度，并可以提高模型性能。


