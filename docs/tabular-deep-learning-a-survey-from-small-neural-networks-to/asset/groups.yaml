    ## 2.1. 背景


    更正式地，表格数据集被描述为由 $n$ 个实例和 $d$ 个特征组成，分别记为 $X \in \mathbb{R}^{n \times d}$（有时记为 $X
    \in \mathbb{R}^d$），$x_j$ 表示第 $i$ 个示例的第 $j$ 个特征。此定义适用于无监督学习和监督学习。在监督学习中，每个案例关联一个标签
    $y$。目标值是一个如下单值（向量）：


    - 二分类，

    - 多分类：$[C] = [1, 2, \dots, C]$，

    - 回归。


    ## 2.2 表格数据


    回归和分类任务是独特的。分类任务最简单但常见的案例是二分类。分类评估的起点是混淆矩阵（表示真实标签所有可能组合的矩阵）。接下来，通过聚合统计从混淆矩阵中获得单一值。然而，将混淆矩阵简化为单一指标是有用的
    [25]。精度、曲线下面积（AUC）和 F1 分数是最广泛使用的指标，因为它们可以被认为是测试中观察到正确预测的概率。另一方面，错误率（对假阴性和假阳性进行同等对待）对不平衡敏感（如果一个类别占据主导地位，可以通过预测多数类来获得高精度），并且不反映模型置信度（一个不确定但正确的预测）。


