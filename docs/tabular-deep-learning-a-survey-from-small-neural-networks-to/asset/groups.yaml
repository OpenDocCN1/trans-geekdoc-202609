    for deep learning. However, over the years, several architectures have developed
    specifically for tabular data that have improved the performance of deep learning
    models. This survey provides a comprehensive and up-to-date review of learning
    for tabular data, covering the following points:


    - Challenges and limitations of both neural networks and decision trees.

    - A taxonomy of deep learning models that takes into account recent developments,
    both new architectures and adaptation of models previously developed for others.

    - Trends that are occurring within the tabular data and surveys comparing models.

    - Challenges and open research questions.

    - Resources specific to tabular deep learning.


    We provide code and other resources here.


    # 2. A definition of tabular data


    Tabular data can be defined as a sub-branch of structured data. Any data that
    can be defined as a table in, by convention, the rows represent examples and the
    columns represent features. Unlike unstructured data, in their real-world applications,
    most data are in tabular format (they are dominant in finance, medicine, climate
    science, and manufacturing).


    In contrast to images, text, or audio (all homogeneous because they have only
    one type of feature, since they can contain multiple types of features, tabular
    data is heterogeneous (fig: 1):


    - Categorical values: A particular type of feature that contains qualitative (or
    discrete) values, which represent a limited set of terms, without an intrinsic
    order. Examples include gender, class, and product class.

    - Binary values: A special case of categorical features, where the feature can
    have only two values (generally 0 or false). An example is the vital status of
    a patient, which can be either alive or dead.

    - Ordinal values: A special type of categorical feature, where the values are
    discrete, there is an intrinsic order. Examples include the frequency of gym activity
    (sometimes > rarely) or highly expressed in discrete values (age > short).

    - Continuous values: A feature that contains continuous values.


    For a linear model, the relationship is typically given by:


    ```

    $f(X) = WX + \mathbf{b}$

    ```


    where $W \in \mathbb{R}^{d \times n}$ is a matrix of weights, and $\mathbf{b}
    \in \mathbb{R}^d$ is the bias.


    In the case of a neural network with a single hidden layer (a multilayer perceptron),
    a non-linear function $\sigma$ is introduced:


    ```

    $f(X) = \sigma(WX + \mathbf{b})$

    ```


    where $W \in \mathbb{R}^{d \times n}$ and represents the number of neurons in
    the hidden layer.


    In a multilayer perceptron (MLP) with multiple layers, the representation at layer
    $l+1$ is:


    ```

    $H^{(l+1)} = \sigma(W^{(l)}H^{(l)} + \mathbf{b}^{(l)})$

    ```


    For a neural network training, the difference between the predictions and the
    labels is minimized by a loss function:


    ```

    $\min_{\theta} \sum_{i=1}^{N} L(f(x_i; \theta), y_i)$

    ```


    In some cases, a regularization term (where $\theta$ is a generic function) may
