    Early stopping and dropout can also be seen as another form of regularization
    to reduce variance and make the model more robust to rare events ([264]. Label
    smoothing or noise injection is another way to make the model more resistant to
    noise, with the advantage of improving the calibration of the model ([417, 245].


    Dropout is the most widely used form of regularization. Dropout randomly drops
