    Another Imputation (NAIM) [38] uses random masking training to generalize over
    unseen data. ReMarker also used random masking and reconstruction of masked sets,
    demonstrating robust imputation capabilities [81, 39]. The transformer handles
    sequential data, as it was successfully used to impute missing values in sequences.
    Not only for text, but also LLMs have been used for imputation, especially for
    health data (psychology or biology) [251, 215, 73].


