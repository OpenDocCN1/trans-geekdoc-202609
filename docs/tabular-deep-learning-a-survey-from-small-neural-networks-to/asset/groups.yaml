    # Tabular Deep Learning: A Survey from Small Neural Networks to Large Language
    Models


    Salvatore Raiei¹¹


    ¹Oncodesign Precision Medicine, 18 rue Jean Mazen, Dijon, 21000, France

    Corresponding author: salvatore.raiei@gmail.com


    # Abstract


    Tabular data are ubiquitous in several real-world domains, including finance,
    healthcare, cybersecurity, and ecommerce. In spite of the dominance of deep learning
    for homogeneous data (such computer vision and natural language processing), gradient-boost
    decision trees (GBDT) remain the state of the art for tabular data tasks. Several
    models have been developed over the years that have attempted to address the shortcomings
    of deep learning, narrowing the gap with GBDTs. This survey provides a comprehensive
    review of deep learning for tabular data, covering a systematic taxonomy and a
    set of resources. We discuss the strengths and limitations of the most recent
    models, we examine the role of self-supervised learning, pretraining strategies,
    and AutoML in tabular deep learning. In addition to architectures, we discuss
    practical considerations including interpretability, scalability, suggestions
    for model choice and discuss open issues and future trends. This survey is a practical
    resource for researchers and practitioners, offering insights into the current
    landscape and trajectory of deep learning for tabular data.


    **Keywords:** tabular data, deep learning, deep learning, neural networks, transformers,
    large language models


    # 1. Introduction


    Tabular data is the dominant data format in real-world applications, including
    finance, healthcare, Ecommerce, and cybersecurity. Deep learning''s dominance
    in structured domains like images and language has not extended as effectively
    to tabular data, where traditional methods still prevail. In fact, for long-term,
    tree-based models (such as XGBoost, GBM, and CatBoost) have outperformed deep
    learning in most tabular data tasks. This is due to the complexity of tabular
    data (number of features, small size diversity, required preprocessing, lack of
    inductive bias, or overfitting), which has allowed them to define a winning architecture
    for deep learning. However, over the years, several architectures have developed
    specifically for tabular data that have improved the performance of deep learning
    models. This survey provides a comprehensive and up-to-date review of learning
    for tabular data, covering the following points:


    +   - Challenges and limitations of both neural networks and decision trees.


    +   - A taxonomy of deep learning models that takes into account recent developments,
    both new architectures and adaptation of models previously developed for others.


    +   - Trends that are occurring within the tabular data and surveys comparing
    models


    +   - Challenges and open research questions.


    +   - Resources specific to tabular deep learning.


    We provide code and other resources here.


    # 2. A definition of tabular data


    Tabular data can be defined as a sub-branch of structured data. Any data that
    can be defined as a table in, by convention, the rows represent examples and the
    columns represent features. Unlike unstructured data, in their real-world applications,
    most data are in tabular format (they are dominant in finance, medicine, climate
    science, and manufacturing).


    In contrast to images, text, or audio (all homogeneous because they have only
    one type of feature, since they can contain multiple types of features, tabular
    data is heterogeneous (fig: 1):


    +   - Categorical values: A particular type of feature that contains qualitative
    (or discrete) values, which represent a limited set of terms, without an intrinsic
    order. Examples include gender, class, and product class.'
