    # 3.1. Handling noisy and incomplete data


    Tabular data generally requires extensive processing since it cannot be directly
    fit into a model. Data may originate from missing (and be found randomly) missing
    in the dataset. Other cases may be derived from some data collection. For example,
    in a survey, some people might forget to fill out certain questions or individuals
    under 25 may not have been included to answer specific questions. There are different
    methods of imputation, the different origins, deciding how to treat it as not
    easy. For reason, the input of missing data comes from the data solutions for
    each type of data have [297, 89, 221].


    Another problem of tabular data is outliers. An outlier is a value that is different
    from all others in the dataset [23, 137]. These can originate from errors in a
    calibrated sensor, a near clear (for example, a temperature sensor may show a
    much higher value than today). Not all models are robust to outliers, and evaluation
    metrics can also be altered by outliers (e.g., a large error can significantly
    increase mean squared error). Thus, outliers are exactly what we are looking for
    (adversarial attacks, network intrusion, and credit fraud). This sub-branch of
    tabular learning is exactly: anomaly detection.


    Another challenge is the scale of dimensionality. When a dataset has many features
    which makes it complex for the model to learn. This is common in some fields,
    as datasets obtained in machine learning from various sources are often classes-unbalanced.
    Or it can result from the nature of the data itself: most emails are spam, there
    is less credit from legitimate transactions, and so on. With models with unbalanced
