    ## 3.7. Lack of a foundation model


    Recent advances in computer vision (CV) and natural language processing (NLP)
    have benefited from large volumes of data and available architectures to learn
    from. For example, ImageNet (with images) has been instrumental in being able
    to develop efficient architectures that learn at scale. Similarly, the transformer
    used for NLP models trained on these datasets learn general patterns that can
    be transferred, providing a paradigm for transferring knowledge gained from one
    model to another. A new paradigm has emerged, where a large model can be fine-tuned
    even when data is scarce.


    To date, a foundation model for tabular data is limited due to the lack of generalizing
    patterns among tabular data. In fact, for homogeneous data, it is possible to
    define a set of patterns that can be generalized by a model (e.g., angles, textures,
    and objects in vision). Given the heterogeneous nature, a model struggles to identify
    patterns in small amounts of data, and patterns in one dataset are not generable
    to another [404, 154]. In fact, the architectures used for other data, where their
    high number of parameters is an advantage, are disadvantaged and experience overfitting
    when applied to tabular data.


    ## 3.8. Robustness to distribution shifts and domain drift


    In real-world applications, tabular data are rarely stable. Models trained on
    a distribution often encounter difficulties resulting in performance degradation
    [101, 175]. The source of this shift is called distribution drift. This problem
    can result from temporal changes (e.g., evolving consumer behavior), geographical
    variation, policy updates, and or data acquisition biases. Tabular models are
    particularly vulnerable to this challenge since they lack structural priors (like
    spatial location in images or sequential order in text) that could anchor generalization.
    In addition, even small changes in co-variates (such as change in income or age
    distribution) can impact decision boundaries. In addition, labels can be outdated
    or used inconsistently across domains (nomenclature problems, changing in name,
    and so on). Another determinant that may be changes in the target variable, such
    as changes in proportions or collection in the real-world data during the training
    data). Deep learning methods assume i.i.d. and can overfit to the specific feature-label
    relationships present in data. In comparison to tree-based models, deep learning
    models are more robust when they encounter unfamiliar or dissimilar patterns.


    ## 3.9. Bias in tabular models


    As machine learning models are increasingly deployed in high-stakes settings (such
    as credit scoring, healthcare, justice), fairness has become a fundamental requirement
    [239, 191, 97]. Tabular data are not one of the main formats used in these domains,
    and they present unique issues that have been less explored than other datasets
    [239, 191]. Specifically, fairness in machine learning refers to the absence of
    unfair direct or indirect treatment of individuals or groups based on attributes
    such as gender, race, age, socioeconomic status. In tabular data, these attributes
    are explicit in the contexts of the datasets (for example, names indicating race
    or include of a group of people), allowing one to observe (and then correct) but
    at the same time making it difficult to train models. Bias in tabular models can
    manifest itself in different ways such as for certain datasets (e.g., zip code)
    with sensitive features, or through historical bias. In contrast to images and
    text, it is much easier to define such features. In addition, the lack of inductive
    bias makes deep learning models at risk of learning unintended correlations.


    ## 3.10. High dimensionality and scalability


    Scalability of tabular models for high dimensionality is a common overlooked problem.
    Many tabular datasets (generic, expression, clinical data, advertising, finance,
    or enterprise analytics) can be particularly wide (have thousands of features).
    Many of these datasets have thousands of columns. These cases are particularly
    difficult for deep learning models [26, 232]. Unlike image or text data, where
    structure arises from structured sequences or grids, tabular data typically presents
    independent and heterogeneous features; as the number of features grows, some
    of these features may be sparse or missing values, some may be predictive or irrelevant,
    multicollinearity phenomena emerge. These phenomena lead to distorting the signal
    the model has to learn during training. For example, gradient-based learning becomes
    unstable in models where the weight scales change quadratically with the size
    of the input (as in case of transformers). Overfitting is also a likely risk,
    especially when dealing with many features and examples. These datasets are problematic
