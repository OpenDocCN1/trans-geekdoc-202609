    ```

    $\min_{\theta} \sum_{i=1}^{N} L(f(x_i; \theta), y_i) + \lambda \Omega(\theta)$

    ```


    The specific definition of $\hat{y}$ and $y$ depends on the task, such as cross-entropy
    for classification and mean squared error for regression.


