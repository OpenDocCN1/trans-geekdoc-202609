    ## 12.3. 为表格任务选择模型


    考虑到表格数据的异构性，没有一种适用于所有任务的最优架构。实用的指南是根据任务和需求（如鲁棒性、可解释性、领域以及可用数据量）来选择模型（见 16）。对于需要快速训练、推理和低延迟的应用，GBDT
    更受青睐。这些模型因为能够高效处理类别变量而表现良好。它们在中小规模数据集以及回归任务中也表现出色。神经网络在大型数据集、复杂特征、自动交互、自动化特征工程和可扩展性方面具有竞争力。Transformer
    网络也与 GBDT 和更大规模的模型相竞争。此外，对于某些任务，某些模型被证明优于其他模型（例如，用于某些某些生物学任务的 sTabNet、基于 GNN 的模型），并被视为首选候选。


