    Deep learning model should not only have performance comparable if not superior
    to tree-based algorithms but also be efficient in a similar way [287].


    In addition, decision trees do not have a reliable probability estimation, do
    not allow end-optimization, and instead employ greedy and local optimization.


    - **Interpretability**: A deep learning model should be transparent or its predictions
    should be explainable. This is particularly important if it is used for sensitive
    applications such as healthcare or finance [287]. In addition, there are regulations
    such as the California Privacy Act (CPA), EU AI and European General Data Protection
    Regulation (GDPR) that require algorithms to be compliant [107, 106, 85]. These
    regulations will likely make these criteria even more stringent or will even more
    important.


    ### 5.1. Desiderata for deep learning

    Despite the interest, there are particular aspects that a deep learning model
    must be competitive for tabular learning (fig. 2):


    - **Performance comparable or superior to based models**: The first evaluation
    criterion maintains the performance of deep learning models. It would be desirable
    to have models that are able to compete in terms of performance with GBDT models.


    - **Efficiency in**: Deep learning models are often computationally expensive
    and can consist of millions if billions of parameters.


    - **Data representation**: Deep learning models should learn an efficient representation
    of data. The advantage of deep learning models in other fields is to capture data
    and data relationships by learning a complex (and hierarchically) relationship
    that can be used for other tasks. For example, models trained on one dataset could
    then be used on other datasets through transfer learning.


    - **Self-supervised learning**: Self-supervised learning is the ability to learn
    without unlabeled data and by exploiting a large dataset of raw data, although
    this is not a necessity requirement, or would have inconvenient disadvantages.
    models more robust to irrelevant features and overfitting. A number of models
