    # Research Question


    # Description


    When we use GDBTs or tabular DL?


    DL methods are often part with GDBTs for many datasets, but still lack a general
    rule.


    How can we define inductive biases suitable for tabular data?


    Most deep learning borrow biases from vision or language. However for tabular
    data, we do not have a biological counterpart to import.


    Can we have a universal foundation model for tabular data?


    Unlike NLP or CV, tabular datasets lack shared structure, and feature engineering
    is fundamental, making across domains difficult.


    Can we use synthetic data to train a foundation model?


    Synthetic data does not cover domain-specific data and can lead to model shift.


    How can we design data augmentation techniques for tabular data?


    Data augmentation has brought breakthroughs in CV and NLP, but it is limited in
    tabular data due to feature scarcity and sensitivity.


    Can we develop benchmarks that reflect real-world tabular challenges?


    We need more real-world data (domain-specific data included) benchmarks with noise,
    skew, and stress-test models under deployment-link constraints.


    How can we interpret the interpretability of deep models without losing performance?


    Many of the best DL models are still black boxes in high-stakes domains (e.g.,
    healthcare, finance).


    Can tabular data be effectively combined with structured domain knowledge (e.g.,
    rules, ontologies)?


    Encoding tabular data effectively is still an open question.


    Integrating expert knowledge remains unexplored. In healthcare and finance, we
    still need this.


