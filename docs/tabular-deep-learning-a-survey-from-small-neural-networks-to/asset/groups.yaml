    # 14. Conclusions


    Tabular data remain dominant in real-world applications (finance, healthcare,
    cybersecurity, ecommerce). However, this remains the last domain where neural
    models have not achieved dominance over traditional machine learning. This stems
    from several challenges that make it complex to design a winning architecture.
    Our various models have attempted to address the limitations of neural networks
    in the tabular domain, significantly narrowing the gap between neural and traditional
    models. To no doubt, unlike computer vision, tabular data is difficult to process.
    Furthermore, large-scale preprocessing techniques that generalize across different
    datasets are one of the most interesting areas of research. At the same time the
    dominance of small/medium datasets is often explored. Since these datasets come
    from sensitive fields, there is a strong interest in terms of their interpretability.
    Additionally, unsupervised and undersupervised learning for tabular data remains
    underrepresented, presenting a promising direction for future updates of this
    field. As such, the tabular domain is still evolving, and there remains room for
    improvement and research. Some open questions remain, such as better inductive
    biases, efficiency and interpretability, which may be intriguing research questions
    for future studies.


