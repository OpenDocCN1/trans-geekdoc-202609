    ## 晚期融合


    ![](img/0cec9fcef02c2a21e786b62cd9d2c596_46_0.png)


    图 17：多模态数据策略整合


    当两个变量显示相同趋势时，它们具有相关性。相比之下，当存在因果关系时，即可理解因果关系，后者至少依赖于前者。相关性并不意味着因果关系，因果推断是关于效应发生条件的导出因果关系的过程
    [372]。因果推断过程之所以复杂，是因为某些非可能的情况也可能是因果性的。考虑一个目标变量时，可能存在潜在变量（原因）和依赖变量（结果），它们通常被称为混杂因素（如果我们想衡量运动对减轻体重的影响，饮食就是一个潜在的混杂因素）。我们的想法是比较已经发生的情况与在其他情况下会发生的情况，或者进行反事实思考（对于患者，本该接受什么治疗？）。在医学中，使用随机对照试验来建立因果关系。我们必须能够确认原因（例如新药）确实是原因（在减轻症状方面）。因果
    ML 试图在无法进行随机试验的地方寻找关联。因果 ML 尝试回答这些问题：如果我们改变特征会发生什么？观察到的效应是什么？如果情况不同会发生什么（反事实结果）。因果
    ML 面临着若干挑战，例如收集偏偏（观测不是随机的）、隐藏混杂因素（某些混杂因素可能无法测量）、泛化问题和计算成本（ML 通常需要大型数据集）。在任何情况下，因果
    ML 在医疗保健、营销、金融领域中都具有相关性，因果树 [11] 是因果 ML 的示例，侧重于将数据划分为子组以更准确地估计治疗效果（决策树最小化误差）。在深度学习方面，有一些示例，如因果感知的非对称自动编码器
    CAT-MIWAE 更具可解释性，并且在 MCAR 和 MAR 机制下表现更好。Miracle [18] 是另一种用于插值的方法，这些策略不仅使用变量进行插值，还尝试推导出变量之间的因果链路。因果结构学习
    (CASTLE) [19] 学习最优因果结构并尝试在主任务（例如分类）中执行。贝叶斯网络 [23] 是一种用于表示变量之间依赖关系的神经网络，这种依赖关系通过条件概率表示。因果学习是一个有趣的视角，允许我们了解因果
    ML 和表格数据中仍然开放的一些问题：当数据集规模较小时，我们如何高效地进行选择和计算？如何可靠地识别和调整混杂因素？如何将这些方法整合到 ML 流水线以保持性能，特别是在医疗保健等高风险领域？对于表格数据，我们该如何设计保护措施（例如不确定性量化、置信区间、专家验证）以确保决策的可靠性？


    - DNF: 析取范式

