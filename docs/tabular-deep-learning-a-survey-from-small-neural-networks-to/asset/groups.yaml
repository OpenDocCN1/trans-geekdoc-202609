    ## 9.2. Tabular data generation


    Tabular data generation is essentially for several types of objects. It can be
    used as a form of regularization (data augmentation) and to prevent overfitting.
    Or it can be used for anonymization, where the model is trained only on synthetic
    data. If a dataset is unbalanced, synthetic data has been used to train models
    in self-supervised learning [11].

