    which can be regarded as a stochastic estimate of the actual entire gradient.
    SGD typically achieves fast iterations due to its reduced computational demand
    in exchange for a lower convergence rate [197]. However, in practice nowadays,
    often neither purely stochastic nor purely batch optimization methods are used,
