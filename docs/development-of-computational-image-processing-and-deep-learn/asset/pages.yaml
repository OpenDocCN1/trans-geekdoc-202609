    of lower-order moments [201]. While there are many different definitions of the
    ADAM optimizer [202], the original algorithm as in [201] is introduced in the
    pseudocode (Algorithm 1) below.


    Empirical results show that the ADAM optimizer outperforms many other known optimizers
    like "AdaGrad" or SGD both in logistic regression as well as in multilayer fully
    connected neural networks and deep convolutional neural networks [201] concerning
    its training cost. Its local convergence has been proven [202]. For further information,
