    # ## 2.3.2 Specific challenges of CT scans of CFRP


    # ### 2.3.2.1 Low contrast between constituents


    Both carbon fibers and polyamide 6 are mainly composed of C elements. Therefore,
    they have similar densities and even the density independent attenuation coefficient
    values are very close. For a photon energy of 400 keV, carbon has a mass attenuation
    coefficient \( \mu_m \) of 9.546e\(^{-2}\) [150] and polyamide 6 has an experimentally
    measured mass attenuation coefficient of 10.86e\(^{-2}\) at 356 keV [156]. This
    chemical similarity leads to poor contrast between the two materials in the CT
    scans, which impedes the determination of fiber-dependent microstructure quantities.


