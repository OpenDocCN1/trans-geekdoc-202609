    # ### 2.3.4.2 Thresholding approaches


    Thresholding refers to the selection of one or more intensity values/limits that
    divide the histogram into two or more areas in each of which only the pixels/voxels
    of a specific object/material appear. These groups are often called classes. This
    subdivision of the image can be highlighted by binarization:


    $o(x, y) = \left\{ \begin{array}{ll} 1, & \text{if } i(x, y) > T \\ 0, & \text{if
    } i(x, y) \le T \end{array} \right. . \quad (2.77)$


    If more than two threshold values would be necessary for the segmentation problem
    at hand, one oftentimes has to switch to alternative methods. Furthermore, the
    successful application of certain thresholding methods requires in particular
    clear separation of the intensity peaks and low noise content, which makes it
    clear why this method can also cause difficulties when used for the CT scans in
    this work. However, due its (computational) simplicity, thresholding is still
    highly relevant to this day. There are different subcategories of thresholding.
    The basic case of a constant threshold across an entire image is called *global
    thresholding*. Conversely, there is *variable thresholding*. If the threshold
    at a point is dependent on its neighborhood, this variable thresholding is also
    called *local or regional thresholding*. The term *dynamic* or *adaptive thresholding*,
    on the other hand, is used when the threshold $T$ depends directly on the spatial
    coordinates $x$ and $y$. However, Gonzalez and Woods point out the inconsistent
    use of these terms in the image processing literature. [160]'
