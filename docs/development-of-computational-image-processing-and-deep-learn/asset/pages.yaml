    detected by the algorithm, where Figure 4.17-3(b) shows the orientation of the
    glass fibers and Figure 4.17-3(c) that of the carbon fibers of the hybrid reinforced
    sample. If one compares the colors in 2(b) and 3(b) with the resulting angles
    in the HSV color circle in subgraph 4, the recognition of the algorithm corresponds
    very well to the optical impression of the angles in the CT scan. Especially in
    the purely CF reinforced case, however, it becomes clear that in areas of quite
    uniform fiber bundle orientation, slight speckle patterns'
