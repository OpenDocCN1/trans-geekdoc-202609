  md: '\(v_f = \frac{\frac{m_f}{\rho_f}}{\frac{m_f}{\rho_f} + \frac{m_m}{\rho_m}}.\)
    (2.33)


    # 2.2.1.2 Determination of FVC through consideration of composite density


    With the density of the composite \(\rho_c\) defined as


    \(\rho_c = w_f \rho_f + (1 - w_f) \rho_m,\) (2.34)


    the fiber weight content \(w_f\) can be determined as


    \(w_f = \frac{\rho_c - \rho_m}{\rho_f - \rho_m}.\) (2.35)


    The density of the two constituents (fiber and matrix) is usually known from data
    sheets. The density of the composite can be determined by using Archimedes’ principle
    - provided the material is non-porous. Otherwise, the volume of the composite
    sample can also be determined very accurately by CT measurement and the mass can
    be weighed.


    # 2.2.1.3 Computational non-destructive methods for FVC determination


    There are multiple reasons why a non-destructive determination of the fiber volume
    content is desirable. Firstly, CT scans are used for every holistic characterization
    of FRP, as the fiber orientation, for example, cannot really be determined well
    locally in another way (apart from using the method of ellipses on micro sections
    [5]). The non-destructive determination of any additional'
  merge: -1
