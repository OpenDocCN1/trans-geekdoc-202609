    # ## 2.3.1.3 Functionality of a computed tomography system


    CT devices consist of the X-ray tube with its anode and cathode that create the
    effective target area, which is also called the optical X-ray focus. In a CT system,
    X-rays are created from a nearly point-like source, as bigger diameters result
    in a so-called penumbra (shadow area, that is reached by only a part of the light)
    fringe (for details, the reader is referred to Buzug [144]). After passing the
    object to be scanned, it impinges on a detector, which in modern CT devices typically
    consists of a scintillator medium and a photon detector (for details cf. [144])
    as shown in Figure 2.12. An image of the geometry and material composition of
    the object can be generated by the detector based on the difference between the
    initially transmitted beam intensity and the intensity received due to attenuation
    by the object material. This difference is converted to a spectrum of different
    gray values. Before the scan, the initial transmitted beam intensity is typically
    measured in a so-called correction step, where the tube is raised to nearly the
    uppermost position in order to irradiate onto the detector with no object interference.


    The platform on which the object is placed and the detector can be moved in horizontal
    direction. Thereby, the image region and the resolution can be adjusted [52].
    The object platform rotates 360° in the beam path. The CT user can set a number
    of projections, \(n_\text{projections}\). Projections are the singular 2D scans
    taken during a stop of the rotation. Hence, the object rotates in steps of \(\varphi
    = 360^\circ/n_\text{projections}\). All of the 2D projections then have to be
    reconstructed by an algorithm to create the required 3D image of the object. Many
    different'
