    by dendrites of a biological neuron) are weighted based on their relative importance
    by the weights {_w_1, _w_2, ..., _w__n_} and subsequently summed up by a linear
    aggregator. A lower threshold value _b_, also known as the bias, determines whether
    an output signal is afterwards triggered. The activation function σ(_u_) depends
