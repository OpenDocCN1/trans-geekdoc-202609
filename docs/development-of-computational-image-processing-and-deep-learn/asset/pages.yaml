  md: 'structural material simulation [33] as well as for a mesoscale simulation of
    the mold filling process [34].


    # Microstructure generation for RVEs


    In this context, the creation of an RVE that can be used discretely in simulations
    is an entirely new issue. There are programs that can basically automatically
    create a discrete RVE model from a CT image. However, this only works for very
    high-resolution and high-contrast CT images and comes with certain limitations
    in accuracy. Classically, image analysis of CT images and experimental procedures
    are used to determine quantities such as fiber orientation, fiber length distribution,
    fiber volume content and pores for the size of the intended RVE and then an attempt
    is made to recreate the microstructure from this information. Therefore, microstructure
    generators are programmed. These are typically based on so-called sphere-packing
    algorithms. Therein, one attempts to pack particles or fibers into a cell in a
    non-overlapping manner and to match the specified properties such as fiber volume
    content, fiber orientation and fiber lengths as precisely as possible. In order
    to achieve the packing, scientist have relied on a wide variety of approaches,
    such as mechanical compression or more chemically influenced ideas of molecular
    dynamics, right up to a shrinking RVE cell. Typical examples are random sequential
    adsorption (RSA) [35], the approaches by Lubachevsky and Stillinger [36] or Torquato
    and Jiao [37] and mechanical contraction [38]. These packing algorithms have limitations.
    Particularly high fiber volume contents are a problem for them, but curvature
    of the fibers is also difficult to incorporate. However, both effects were observed
    in the material used in this work. In particular, the visible mixture of fiber
    bundles and individual fibers cannot be covered, even with newer, improved or
    extended approaches. Therefore, this topic will be addressed again in Section
    2.2.4 in the State of the Art. With the use of AI to generate CT images of microstructures,
    a completely new direction of microstructure generation and possibly eventually
    RVE generation will be opened up.'
  merge: -1
