    # Closure approximations


    A closure approximation \(\mathcal{C}\) is a mapping \(\mathbb{A} = \mathcal{C}(\boldsymbol{A})\)
    [92]. The need for closure approximations descends from process simulations of
    fiber suspensions. The orientation evolution can be described by approaches like
    Jeffery’s model [95] or the model by Folgar and Tucker [96] who included the FODF
    and added a diffusion term to the former equation [86]. When expressing the aforementioned
    models in terms of FOT, the fourth-order tensor \(\mathbb{A}\) is required in
    order to solve the transport problem.


    Many different closure approximations have developed over time with varying complexity
    and accuracy. The quadratic closure can be considered the simplest analytical
    closure and is given by


    ```

    \(\mathbb{A}^Q = \boldsymbol{A} \otimes \boldsymbol{A}\) (2.55)

    ```


    and is only exact for a unidirectional FRP [43, 86, 97]. Contrarily, the linear
    closure [43, 98] gives correct results for isotropic fiber orientations [86].
    Then, there are hybrid closures combining these ideas [99, 100] and more advanced
    orthotropic fitted closures [101, 102] working with fitting of eigenvalues. The
    widely used invariant-based optimal fitting (IBOF) closure [103, 104] is also
    a physically more consistent approach [92] and was used, e.g., by Meyer'
