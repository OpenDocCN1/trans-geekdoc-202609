  md: 'have been used notwithstanding, and the final averaged tensor could have been
    converted into a fourth-order, tensor by a closure approximation. Nevertheless,
    closures introduce a non-negligible inaccuracy into the method. Consequently,
    a direct interpolation of fourth-order tensors was developed instead. As the decomposition
    method proved to be particularly useful, this idea was also used for the interpolation
    of fourth-order tensors. However, a simplification was chosen in this case. The
    transformation to quaternions and orthogonal invariants was not considered as
    the transformation is not straightforward. Hence, the rotation matrix and the
    eigenvalues of the tensors of fourth-order are used directly. Therefore, the tensors
    were read into Python in Mandel notation and subsequently decomposed into eigenvalues
    (6 × 1) and the rotation matrix (6 × 6) using NumPy’s linalg library [277]. Subsequently,
    the eigenvalues were sorted by magnitude. The fact that portraying a 3D tensor
    in 2D using Mandel notation and thus receiving a 6 × 6 matrix, allowed the author
    to apply the spectral decomposition. Afterwards, the distance-dependent weights
    applied to each measured tensor for each tensor position to be determined were
    also calculated with Shepard’s inverse distance weighting [297] as explained before.
    Reassembling the newly weighted rotation matrix and eigenvalues leads to a then
    interpolated tensor for a specific point.


