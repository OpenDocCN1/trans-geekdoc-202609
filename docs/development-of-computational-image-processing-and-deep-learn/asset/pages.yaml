  md: '# 3.7.4 Artificial neural network¹¹


    The artificial neural network used in this study is based on the idea and implementation
    of Sabiston et al. [133]. Just like for the other two methods, the goal of the
    neural network is to determine a FOT for each specified point of the 160 missing
    positions within the plate. For the ANN, the nine x, y (and z) coordinates of
    the given FOT were normalized (divided by 14 since there are 13 rows and columns
    of FOT). These \(\tilde{x}\), \(\tilde{y}\), and \(\tilde{z}\) represent the input
    data. The output data for the ANN are the respective components of the nine given
    orientation tensors of second-order. Since these components are already between
    -1 and 1, this data does not need to be normalized. The coordinates were read
    in as one .csv file as input and the components separated by \(A_{11}\), \(A_{33}\),
    \(A_{12}\), \(A_{13}\) and \(A_{23}\) as five separate .csv files as output.


    There are only five independent components instead of the usual six independent
    ones for symmetric tensors, since orientation tensors are subject to an additional
    condition that the trace of the tensor must add up to 1:


    \(\sum_{i=1}^{3} A_{ii} = 1.\) (3.15)


    Therefore, only \(A_{11}\) and \(A_{33}\) were fed into the network as output
    parameters and \(A_{22}\) was determined via \(A_{22} = 1 - A_{11} - A_{33}\).
    The choice was made explicitly, according to the findings of Sabiston et al. [133],
    to use only one in-plane coordinate and the through-thickness coordinate (\(A_{22}\)
    and \(A_{33}\) would have worked analogously as well) in order to reduce the error
    and to satisfy equation (3.15). This is due to the two in-plane coordinates being
    significantly larger than the through-thickness coordinate, which in turn meant
    that \(A_{11}\) and \(A_{22}\) alone could get above 1 if they were both predicted.


    ¹¹ This section is extracted from the author''s publication [17] with only slight
