    # 2.4.2.1 Basic theory


    **The Nash equilibrium** The original idea of GANs derives from a central concept
    of game theory [235]. It is based on a two-player zero-sum game with two independently
    acting, non-communicating players trying to improve, while the gain of one player
    is exactly the loss of the other player resulting in a total sum of zero for the
    interests of both sides [235, 236]. In this optimization process, which is also
    called a minimax game [143, 235], the goal is to reach the so-called Nash equilibrium,
    which was shown to exist in any infinite game following these criteria by John
    Nash in 1950 [236]. At this equilibrium point, a one-sided change of strategy
    would be of no benefit to neither of the players.


    Inspired by this concept, the traditional GAN as described by Goodfellow et al.
    [143] consists of two competing neural networks, one so-called *generator* and
    one *discriminator*. The generator makes an effort to capture the distribution
    of real, given training data and tries to create new samples that mimic the real
    ones. Meanwhile, the discriminator, which is often a binary classifier, aims at'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'differentiating the real samples from the generated samples as accurately as
    possible. Driven by their competition, constant improvement is required by both
    generator and discriminator in order to win the game [143, 237]. In the original
    paper, the process is compared to counterfeiters (generator) producing fake currency
    and police (discriminator) trying to detect the counterfeit currency [143]. Once
    the saddle point of the Nash equilibrium is reached, this adversarial training
    ends and the generator is considered to have correctly estimated the real data
    distribution [222]. In reality, reaching the Nash equilibrium is very challenging
    considering the objective functions being non-convex, the parameters being continuous
    and the parameter space being high-dimensional [238]. Nevertheless, outstanding
    results have been achieved with GANs, and they are particularly impressive due
    to the possibility of generating theoretically infinite data once properly trained.


    # The traditional GAN structure


    Figure 2.29 shows the structure of the basic GAN (also called vanilla GAN) as
    a flowchart. Therein, a generator G is fed with noise samples z from a prior defined
    noise function such as a Gaussian distribution and outputs generated samples G(z).
    Those are provided alongside samples from the real data distribution to the discriminator
    D, which tries to classify the data by assigning a label of zero for data that
    it detects as generated and one for data that it detects as real. With this discriminator
    feedback and the actual true labels, a loss function can be calculated, based
    on which the weights of the generator and discriminator network are updated using
    backpropagation.


    ![](img/332d06e0447dbfd85ea7d2fb553468f3_136_0.png)


    Figure 2.29: Flowchart diagram of the basic structure of the vanilla GAN as proposed
    by Goodfellow et al. Based on [235].'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'In the vanilla GAN, both generator and discriminator are normal MLPs with trainable
    parameters \(\theta\) [143]. A value function \(V(G, D)\) is used to evaluate
    the cost of the training. During the training process, only the parameters of
    one model are updated, while the parameters of the other are fixed [239].


    The MLP representing the generator \(G\) is a differentiable function with parameters
    \(\theta_G\). In order to learn the distribution \(p_g\) over real data \(\boldsymbol{x}\),
    a mapping of the input noise variables \(p_z(\boldsymbol{z})\) to the data space,
    \(G(\boldsymbol{z}, \theta_G)\), is required. The second MLP representing the
    discriminator, \(D(\boldsymbol{x}, \theta_D)\) outputs a single scalar. \(D(\boldsymbol{x})
    \in [0, 1]\) describes the probability that \(\boldsymbol{x}\) came from the training
    data and not the distribution of the generator \(p_g\). [143] Hence, the generator
    is trained to maximize the probability \(D(G(\boldsymbol{z}))\) or to minimize
    \(\log(1 - D(G(\boldsymbol{z}))\) leading to the following equation for the training
    of the generator, while the discriminator is fixed:


    \(\min_G V(D, G) = \mathbb{E}_{\boldsymbol{z} \sim p_z(\boldsymbol{z})} [\log(1
    - D(G(\boldsymbol{z})))] \ [143]. \quad (2.121)\)


    The expectation operator \(\mathbb{E}\) denotes the expected value of the specific
    distribution function [179]. The parameters \(\theta_G\) are updated by calculating
    and subsequently descending the stochastic gradients based on this equation. [143]


    The discriminator is provided with samples from the unknown input distribution
    \(p_{\text{data}}(\boldsymbol{x})\) and the (at the training time of the discriminator)
    fixed generator samples. Hence, the value function is given by


    \(\max_D V(D, G) = \mathbb{E}_{\boldsymbol{x} \sim p_{\text{data}}(\boldsymbol{x})}
    [\log D(\boldsymbol{x})] + \mathbb{E}_{\boldsymbol{z} \sim p_z(\boldsymbol{z})}
    [\log(1 - D(G(\boldsymbol{z})))] \ [143]. \quad (2.122)\)


    The discriminator parameters get updated analogously by ascending the stochastic
    gradient based on this equation.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Goodfellow et al. further proved that global optimality is only reached for
    \( p_{data} = p_G \), so if the input data distribution matches the distribution
    learned by the generator. In this case, \( D(x) = \frac{1}{2} \) holds, which
    results in regression in the training process. [143]


    Combining Equation (2.121) and Equation (2.122) results in the following minimax
    game for GAN optimization:


    ```

    \(\min_G \max_D V(D, G)\)

    \(= \mathbb{E}_{x \sim p_{data}(x)} [\log D(x)] + \mathbb{E}_{z \sim p_z(z)} [\log
    (1 - D(G(z)))] .\)

    (2.123)

    ```


    \(\log (1 - D(G(z)))\) gives the cross-entropy between \([0 \ 1]^T\) and \([D(G(z))
    \ 1 - D(G(z))]^T\). Proposed by Rubinstein [240] in 1997, the cross-entropy is
    a measure of the quality of a model for a probability distribution. As the name
    already implies, it uses the cross entropy or Kullback–Leibler divergence as a
    measure for the closeness of two sampling distributions [241]. Analogously, \(\log
    D(x)\) gives the cross-entropy between \([1 \ 0]^T\) and \([D(x) \ 1 - D(x)]^T\).
    Hence, the value function \(V(G, D)\) is a Binary Cross Entropy (BCE) function,
    which is commonly used in binary classification problems [238]. In fact, any monotonically
    increasing function could be used instead of a logarithmic function [242].


    After introducing the equations, the training procedure ought to have become evident:
    The discriminator receives a mini-batch of the generator samples and a mini-batch
    of the true samples. Then, the stochastic gradient of the discriminator equation
    is ascended to update the discriminator. The generator receives noise samples
    and the stochastic gradient of the generator equation is descended, and so on.
    A corresponding pseudocode can be taken from [143]. Theoretically, the discriminator
    could be updated \(k\) times and the generator only once per iteration, but in
    the original paper they use the least expensive and meanwhile most used option
    with \(k = 1\).'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'If the discriminator is too good in early stages of learning, log (1 – D(G(z)))
    saturates. This issue can be solved by training the generator to maximize log
    D(G(z)) instead, which provides much stronger gradients in early learning. [143]


    The already mentioned familiar difficulty in training GANs stems from the fact
    that due to the minimax game in Equation (2.123), the optimal weights for an adversarial
    network correspond to saddle points of the loss functions and not minima thereof,
    which is the case for conventional ANNs [242]. This issue is visualized in Figure
    2.30.


    ![](img/332d06e0447dbfd85ea7d2fb553468f3_139_0.png)


    **(a) Standard ANN**   **(b) Adversarial networks**


    **Figure 2.30:** Schematic illustration of gradient methods for a standard neural
    network (a) and adversarial networks (b). Classical loss functions are bounded
    from below, which means that following the gradients normally leads to a minimum,
    where the method is stopped. As opposed to this, loss functions of adversarial
    networks may be unbounded from below and the training alternates between minimization
    and maximization steps. If those two are unbalanced, the solution path might “slide
    off” the loss surface and never reaches the desired saddle point, making the algorithm
    unstable and resulting in a sudden “collapse” of the network. Based on [242].


    The solution for the saddle point problem is determined using the alternating
    stochastic gradient method, changing between the descent and ascent step. Typically,
    the gradients are updated by an automated solver like the already introduced ADAM
    optimizer. [242]'
  merge: -1
