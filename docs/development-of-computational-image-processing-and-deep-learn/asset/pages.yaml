    # 5.5 Microstructure generation through generative adversarial network 8


    First of all, it should be mentioned that the use of the GAN for the generation
    of artificial CT images of the material of this work should be considered as a
    kind of feasibility study. Although there is no immediate application of the generated
    images, it was important to be able to assess the enormous potential of these
    networks in relation to the generation of rather irregular structures such as
    the DicoFRP. With the help of some further developments, which will be discussed
    below, they could be of great help.


    # 5.5.1 Assessment of generated images


    After much optimization of the network, generated images of the final network
    architecture look surprisingly convincing. While some images show either an unusually
    large number or barely any structures recognizable as fibers and some images seem
    to combine attributes of different images in an unsuitable way, there are also
    images that are difficult to distinguish from the original even for the trained
    eye. This variance is also evident in the quantitative evaluation methods. First,
    the signal-to-noise ratio of the output images was considered, which, with a value
    of 3.70, was lower than that of the input images, but still clearly above 1, indicating
    the presence of meaningful signals in comparison to the background noise.'
