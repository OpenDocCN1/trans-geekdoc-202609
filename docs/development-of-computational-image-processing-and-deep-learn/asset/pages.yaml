- pgno: 10
  md: '# Abstract


    Discontinuous fiber reinforced polymers such as long fiber reinforced thermoplastics
    are valued for their good density-specific mechanical properties, relatively low
    costs, fast cycle times and possible function integration in lightweight design
    relevant sectors such as automotive engineering. However, their complex microstructure
    exacerbates the modeling and design of components. To characterize the micro-
    and mesostructure, the acquisition of three-dimensional computed tomography scans
    and subsequent image analysis has established itself as a non-destructive method.
    Especially carbon fiber reinforced polymers pose challenges for this approach:
    Their small diameter combined with a low image contrast to the surrounding matrix
    (due to similar attenuation coefficients) complicates the application of previously
    developed methods for the evaluation of mechanical parameters such as fiber volume
    contents. Therefore, two novel methods for determining the fiber volume content
    from scans of this material are presented in this thesis, one of which is an artificial
    intelligence-based convolutional neural network approach. Furthermore, even in
    the case of quantities that can be determined using already implemented methods,
    such as fiber orientation tensors, computed tomography images pose the problem
    that a high resolution is associated with a small specimen geometry. In turn,
    this reduces the cross-scale significance of a quantity determined from that small
    specimen. Three different methods (two algebraic and one artificial neural network)
    for the interpolation of fiber orientation tensors were therefore tested in order
    to obtain orientation information across an entire plate from a few support points
    of tensors that were determined from small specimens. The orientation distribution
    of the plastificate and thus of the initial state, on which the compression molding
    process is based, was also investigated. In addition, the problem arose that the
    acquisition of CT'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Abstract


    scans is energy-intensive and time-consuming. Artificial microstructures could
    reduce this scanning effort. However, artificial microstructures of carbon long
    fiber reinforced material generated with conventional packing algorithms do not
    sufficiently resemble the real ones. As a result, the rather novel approach of
    generative neural networks was successfully used to generate two-dimensional images
    that are as similar as possible to the layers of the computer tomography scans.
    The investigations in this dissertation show the potential of image evaluation
    and especially the use of approaches based on artificial intelligence for the
    investigation of computed tomography images of carbon long fiber reinforced polymers
    despite the physically unfavorable initial situation.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Kurzfassung


    Diskontinuierlich faserverstärkte Kunststoffe wie langfaserverstärkte Thermoplaste
    werden in leichtbaurelevanten Branchen, wie dem Automobilbau, aufgrund ihrer guten
    dichtespezifischen mechanischen Eigenschaften, verhältnismäßig geringen Kosten,
    schnellen Zykluszeiten und möglicher Funktionsintegration geschätzt. Deren komplexe
    Mikrostruktur ist allerdings der Modelierung und Auslegung von Bauteilen hinderlich.
    Zur Charakterisierung der Mikro- und Mesostruktur hat sich das Anfertigen von
    dreidimensionalen Computertomographiescans und anschließende Bildauswertung als
    zerstörungsfreies Prüfverfahren etabliert. Die Verwendung von Kohlenstofffasern
    sorgt allerdings für Herausforderungen bei dieser Herangehensweise: Ihr geringer
    Durchmesser verbunden mit niedrigem Kontrast im Bild zur umgebenden Matrix erschweren
    durch hohes Bildrauschen die Anwendung bereits entwickelter Verfahren zur Auswertung
    mechanischer Kenngrößen, wie Faservolumenanteilen. Aus diesem Grund werden in
    dieser Thesis zwei neuartige Methoden zur Bestimmung des Faservolumengehalts aus
    Scans dieses Materials aufgezeigt, wovon eines ein auf künstlicher Intelligenz
    basierter Ansatz eines convolutional neural networks ist. Weiterhin ergibt sich
    selbst bei mit bereits implementierten Verfahren bestimmbaren Größen, wie Faserorientierungstensoren,
    bei Computertomographieaufnahmen die Problematik, dass eine hohe Auflösung mit
    einer kleinen Probengeometrie eingehergeht. Kleine Probengrößen reduzieren wiederum
    die skalenübergreifende Aussagekraft einer daraus bestimmten Größe. Um aus wenigen
    Stützpunkten an Tensoren, die aus kleinen Proben bestimmt wurden, Orientierungsinformationen
    über eine ganze Platte hinweg zu erhalten, werden daher drei verschiedene Verfahren
    (zwei algebraische und erneut ein'
  merge: -1
  img_proc: true
- pgno: 13
  md: künstliches neuronales Netzwerk) zur Interpolation von Faserorientierungstensoren
    implementiert und evaluiert. Auch die Orientierungsverteilung des Plastifikats
    und damit des dem Pressprozess zugrundliegenden Ausgangszustands wurde untersucht.
    Darüber hinaus ergab sich die Problematik, dass die Anfertigung von CT-Scans energieintensiv
    und zeitaufwändig ist. Künstliche Mikrostrukturen könnten diesen Scanaufwand verringern.
    Allerdings ähneln die mit konventionellen Packungsalgorithmen erzeugten künstlichen
    Mikrostrukturen von kohlenstofflangfaserverstärktem Material den realen nicht
    ausreichend. Infolgedessen wurde der recht neuartige Ansatz von generativen neuronalen
    Netzen erfolgreich verwendet, um - trainiert auf den Schichten der Computertomographiescans
    - möglichst ähnliche zweidimensionale Bilder zu erzeugen. Durch die Untersuchungen
    in dieser Dissertation zeigt sich das Potential der Bildauswertung und speziell
    auch der Nutzung von Ansätzen basierend auf künstlicher Intelligenz zur Untersuchung
    von Computertomographieaufnahmen kohlenstofflangfaserverstärkter Polymere trotz
    der physikalisch ungünstigen Ausgangssituation.
  merge: -1
