    Lastly, \(\psi(\boldsymbol{p})\) fulfills the continuity condition [86]


    \(\dot{\psi} = -\text{grad}_\zeta(\psi(\boldsymbol{p})\dot{\boldsymbol{p}}). \qquad
    (2.48)\)


    This equation describes the change of the fiber orientation distribution function
