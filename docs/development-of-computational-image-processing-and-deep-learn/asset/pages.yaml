    # 2.2.3.3 Necessity of fiber orientation tensor interpolation


    The fiber orientation in a sample of FRP material can accordingly be determined
    by a CT scan and the subsequent application of the method presented above. The
    question of the size of the sample volume is not insignificant here. This question
    is discussed in more detail in Section 3.1.6. However, it is trivial that a fiber
    orientation tensor of a rather small sample may represent very locally occurring
    fiber orientation behavior (e.g. a strong anisotropic orientation of a single
    fiber bundle). In contrast, a very large sample would on the one hand make it
    impossible for the algorithm to detect small fiber bundles because the resolution
    would then be too poor. On the other hand, a fiber orientation tensor obtained
    in this way would mean a massive averaging of a large range of different fiber
    orientations, which would probably result in very isotropic FOT that are not representative.


    In this work, specimen sizes with an edge length between 10 mm and 30 mm were
    used depending on the application (see Section 3.1.6) at a plate size of 400 mm
    \(\times\) 400 mm \(\times\) 3 mm. It is immediately clear that a specific orientation
    tensor of such a sample represents only a fraction of the entire fiber orientation
    behavior of the pressed plate (cf. Figure 2.11).


