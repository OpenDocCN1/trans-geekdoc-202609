    \ research contributions of these fields are studied, classified and partially\
    \ reproduced. Chapter 3 focuses on the distinct description and derivation of\
    \ the self-developed methods. Chapter 4 is dedicated to the detailed and objective\
    \ presentation of the results of the applied methods. The assessment and quality\
    \ analysis of these results"
