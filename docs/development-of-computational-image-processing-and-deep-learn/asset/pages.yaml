    # ## 2.3 Computed tomography


    After Wilhelm Conrad Röntgen famously discovered a radiation with the ability
    to penetrate optically opaque objects at the end of the 19th century, called X-rays
    [144], the first computerized computed tomography (CT) system was realized by
    Hounsfield [145] in 1972. Together with Cormack, he won a Nobel Prize in 1979
    for this development, as did Röntgen previously for the discovery of X-rays. With
    time, micro-computed tomography (μCT) systems developed that increased the range
    of CT applications from medical use towards non-destructive material testing.


    # ### 2.3.1 Theoretical principles


    # #### 2.3.1.1 X-ray generation


    X-ray radiation is on the electromagnetic spectrum and is generated through the
    deceleration of fast electrons that are emitted from a heated filament and then
    enter a solid metal anode [144]. Thereby emitted wavelengths range between approximately
    10⁻⁸ m and 10⁻¹³ m. The electron velocity v determines the radiation energy. The
    velocity depends on the acceleration voltage Ua between cathode and anode. Energy
    conservation leads to the following equation,


    \( eU_{\mathrm{a}} = \frac{1}{2}m_{\mathrm{e}}v^{2}, \) (2.64)


    with the charge of an electron e and the mass of an electron me, with which the
    electron velocity can be determined. Typical ranges of acceleration voltages can
    lie between 25 kV and 500 kV, whereas the smaller values are typically'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'chosen for medical diagnostics and higher values are rather relevant for material
    testing, where radiation exposure hazards can be neglected. [144]


    # 2.3.1.2 Photon-matter interaction


    When X-rays enter a material, the amount of photons, i.e., the radiation density,
    decreases exponentially due to absorption and scattering. This attenuation of
    the radiation intensity is material-dependent. The correlation is expressed in
    the Beer–Lambert law [146–148]


    \( I(\eta) = I_0 e^{-\mu \eta}, \) (2.65)


    with the radiation intensity \( I \), a distance variable \( \eta \), the attenuation
    coefficient \( \mu \) and the initial condition \( I(0) = I_0 \). The linear attenuation
    coefficient \( \mu \) is thereby the sum of a scatter coefficient \( \mu_s \)
    and an absorption coefficient \( \alpha \) [144]:


    \( \mu = \mu_s + \alpha. \) (2.66)


    The unit of \( \mu \) is m\(^{-1}\). Apart from being influenced by the photon
    energy, the attenuation coefficient is also dependent on the type of irradiated
    material and more specific on its effective atomic number and its mass density
    \( \rho \) [25, 149]. As a result, the mass attenuation coefficient \( \mu_m \)
    gives a density invariant attenuation coefficient and is hence defined as


    \( \mu_m = \frac{\mu}{\rho}. \) (2.67)


    Mass attenuation coefficients are often given in \(\frac{\text{cm}^2}{\text{g}}\)
    and tabular collocations of values for different elements and compound materials
    can be found, e.g., in [150] or in [151] [25].'
