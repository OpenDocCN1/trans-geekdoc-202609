    # ## 3.1.5 The LFT-D manufacturing process


    The long fiber thermoplastic direct (LFT-D) process is depicted schematically
    in Figure 2.1. The polyamide 6 granulate is compounded in an extruder along with
    the master batch at temperatures between 260 °C - 280 °C. In a second, mixing
    extruder with a twin screw, the fiber rovings are introduced to the polymer melt
    uncut and are chopped up irregularly by the shearing motion of the extruder. The
    resulting initial charge, also called plastificate in this work, of which two
    kinds can be seen on top in Figure 3.2(a) and Figure 3.2(b), is ejected through
    a specific nozzle. Subsequently, it is directly inserted in a press (Dieffenbacher),
    preventing a reheating of semi-finished products, which is necessary in other
    known LFT production processes.


    In the press, the plastificate is transformed into a plate or part (depending
    on the inserted mold) and simultaneously cooled down (cf. Figure 3.3) in a so-called
    compression molding process. The press has a temperature of about 80 °C - 90 °C.
    The mold for the plates commonly used in this work has dimensions of 400 mm ×
    400 mm and the height of the plates was fixed at 3 mm using spacers. An image
    of both front and back of these plates can be seen on the left in Figure 3.3.
    The insertion area of the plastificate at the left is clearly visible.


    It shall be noted that both the amount and geometry of the plastificates as well
    as the insertion position in the mold severely influence the mold filling behavior.
    This in turn influences the macroscopic quality of the component, but in particular
    also the microstructure and therefore anisotropies and weak points in the mechanical
    properties. These investigations are not part of this work and are carried out
    by process developers and process simulants. However, the aim of this work is
    to be able to draw conclusions about the behavior in the process and in subsequent
    mechanical tests through targeted characterization'
  merge: -1
  img_proc: true
