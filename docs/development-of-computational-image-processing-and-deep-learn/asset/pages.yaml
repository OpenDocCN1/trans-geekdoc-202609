  md: 'number and obtain a fiber volume content. The difficulty with this method is
    that the determined FVC depends directly on the threshold value. However, the
    threshold cannot be determined even with high-resolution CT images with good contrast.
    Pinter [52] has applied a large number of different threshold techniques to GF-LFT
    and GF-SMC and compared them with TGA measurements, but cannot find one that fits
    perfectly and advises that these values should be treated with caution and that
    high contrast between fiber and matrix is required. Gandhi et al. [5] introduce
    a new μCT procedure that attempts to get rid of the ambiguity of selecting the
    true threshold. They chose the midpoint between the mean value that represents
    the glass fibers in the histogram and the mean value that represents the matrix
    as the threshold value. Although this does not represent the true threshold, small
    adjustments to higher or lower values only results in the FVC distribution being
    slightly shifted up or down, but its course remains the same. They then normalize
    the values of the distribution by dividing them by the average fiber concentration
    of the entire data set. This shifts the curves back to approximately the same
    values, regardless of which threshold was originally used. However, this approach
    only works if two clear peaks are recognizable in the histogram of the CT images.
    This is not the case for carbon fibers with a diameter of 5 µm - 7 µm, which show
    a low contrast to polymers in CT due to their similar densities. This challenge
    will be elaborated on in Section 2.3 about computed tomography.


    After reviewing further literature, it becomes apparent that a simple threshold
    between fiber and matrix is clearly too imprecise [53–55]. They are still widely
    used in the case of pores and voids as air inclusions are usually easy to detect
    [56]. Even in that case though, deep learning (DL) solutions have outperformed
    thresholding in specific cases like small voids or low porosity [57]. Combinations
    of DL and thresholding have been explored for low contrast and noisy X-ray images
    as well [58]. For the specific problem of reliable determination of the FVC of
    carbon fiber reinforced polymers (CFRP) through image segmentation of CT images,
    DL presents a promising opportunity. Convolutional neural networks (CNN) in particular
    have proven to be able to handle low contrast images and improve statements resulting
    from them [59–64]. It seems especially'
