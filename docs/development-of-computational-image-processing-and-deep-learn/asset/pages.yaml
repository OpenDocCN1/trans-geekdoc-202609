    # 4.7.2 Loss plot and FID ⁸


    The loss value of the generator and discriminator network can be analyzed to get
    information on the stability of the training process. This plot is shown in Figure
    4.35. It can be seen that both losses approach each other after only a few epochs.
    However, while the loss of the discriminator stays on a very small value for the
    rest of the training process, the generator loss increases slightly and oscillations
    grow bigger. The smallest possible loss values for both generator and discriminator
    would be zero, but they cannot simultaneously reach this value. Hence, ideally,
    both losses should converge to approximately the same value resulting in a balance
    of generator and discriminator or decrease monotonously on average towards different
    values indicating a stable training process. This is based on game theory and
    the aim to reach the Nash equilibrium. Even though the generator loss in Figure
    4.35 does not decrease monotonously (not taking oscillations into account), the
    DCGAN in this paper still resulted in a stable training process and the generation
    of meaningful images. In fact, similar shapes of loss plots have been observed
    for other GANs as well [323–326]. The behavior of the loss plot and its influence
    on the quality of the generated images and the need for a different metric to
    assess them is elaborated on in the Discussion (Section 5.5).


    8 This section is extracted from the author''s publication with only slight linguistic
    changes [275].'
  merge: -1
