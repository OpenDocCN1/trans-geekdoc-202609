- pgno: 140
  md: '# 2.4.2.2 Common challenges when training GANs


    Apart from the general problem of non-convergence, there are specific typical
    challenges when training GANs, two of which will be elaborated on in the following
    paragraphs. Those issues mainly occur due to each model trying to negate the effect
    of the other one [243]. Solving one of the issues does not necessarily lead to
    success as these different challenges may occur parallel or at different stages
    of the training process [244].


    **Mode collapse** The first common challenge is the so-called mode collapse, also
    called catastrophic collapse, which signifies the creation of very similar looking
    output data lacking variety by the generator [244]. Mode collapse occurs when
    the discriminator is stuck in a local optimum [244]. Typically, the generator
    can then produce one realistic data sample, which the discriminator recognizes
    as real, and will stick with it; sacrificing the goal of generating a data distribution
    similar to the training data distribution. Alternatively, only a particular, limited
    subset of modes is learned by the generator, which is sometimes called partial
    mode collapse [238, 245]. The discriminator function often shows sharp gradients
    around real data points in local equilibria [246] and hence the discriminator
    gradients point to similar directions for many similar points (discriminator overfitting)
    (cf. Figure 2.31). As the discriminator processes every generated image independently,
    there is no interaction between the gradients (also called catastrophic forgetting
    [247]). The generator is therefore not told to diversify its outputs. [248]


    One possible solution to avoid mode collapse is the use of previously mentioned
    minibatch discrimination, where the discriminator is fed with multiple images
    at the same time rather than single images [248]. In addition, multiple further
    developments of GANs, like deep convolutional GANs [250], were proposed to tackle
    this issue by using different network structures, new objective functions or different
    training algorithms. Some important specific types are mentioned in Section 2.4.2.3.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '![](img/332d06e0447dbfd85ea7d2fb553468f3_141_0.png)


    **Vanishing gradients** If the discriminator becomes too good at its job of assigning
    zero to fake images and one to real ones, the generator gradients approach zero.
    This behavior is called vanishing gradients and prevents training progress. It
    typically appears when the discriminator is already close to the optimal solution.
    [238, 244] It can be addressed, e.g., by using the Wasserstein distance as an
    alternative method to calculate the loss of a GAN (see Section 2.4.2.3) [251].


    # 2.4.2.3 Other types of GANs


    In this section, a short, by no means comprehensive list of popular adaptions
    of the original GAN idea is presented.


    First described by Arjovsky et al. [251], the Wasserstein GAN (WGAN) has the same
    structure as the vanilla GAN [143] but uses the Wasserstein distance, also known
    as Earth Mover distance, to calculate the generator and discriminator loss [235,
    252]. It was intended to solve the problem of vanishing gradients [235], but can
    also itself show problems of bad image quality of the generated'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'samples or convergence failure. This was improved by Gulrajani et al. [253]
    by adding a gradient penalty, introducing the WGAN-GP.


    DCGANs as introduced by Radford et al. [250] in 2016, do not only consist of fully
    connected layers, but obtain deconvolutional (more precisely known as transposed
    or fractionally strided convolutions) layers in the generator and convolutional
    layers in the discriminator. This is the kind of GAN that was used in this work
    as well. While the basic structure is the same, DCGANs typically include batch
    normalization in the hidden layers allowing for a deeper gradient propagation
    as the risk of generator collapse is decreased. In order to avoid sparse selection
    of gradients, ReLU activation is used in the generator (except for the output
    layer, which uses tanh) and Leaky ReLU activations are selected for the discriminator
    with the sigmoid activation in the output layer. [179]


    Conditional GANs (cGANs) described by Mirza et al. in 2014 [254] condition the
    generator and discriminator on discrete auxiliary information by adding this information,
    normally a corresponding label, as another input layer. This enables the trained
    generator to output a result based on a requested label instead of generating
    random outputs. [254] In the case of continuous variables, the given additional
    input information can be divided into separate classes. The further development
    of a Continuous conditional GAN (CcGAN) by Ding et al. might be another option
    in that case [255].


    Another extension of the cGAN would be the information maximizing GAN (InfoGAN)
    as introduced by Chen et al. in 2016 [256].


    # 2.4.3 Neural networks in materials science


    AI is making its way into all scientific fields; materials science is no exception.
    Apart from classical ML algorithms, which have been used for a while, neural networks
    are increasingly used and classified as DL at more complex scales (multiple layers).
    They can be used to predict mechanical properties [257], weld characteristics
    [258], crack propagation [259], and crystal structures [260] as'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'well as to classify surface defects [261], fracture surfaces [261, 262] and
    microstructures [263, 264], or to segment phase fractions [265], grain boundaries
    [266], or precipitates [267]. Deep learning can also play a role in materials
    science for object recognition [263], crack detection [25], feature extraction
    from transmission electron microscopy (TEM) or scanning electron microscopy (SEM)
    images [268], or the creation of digital twins [269]. Another technique is increasing
    image resolution through super resolution (SR) networks, which has been used sporadically
    in materials science [270], but is also emerging in commercially available software.
    The use of GANs in materials science was already elaborated on in the prior Section
    2.4.2.


    In this work, three neural networks are implemented and evaluated. One rather
    classical ANN for tensor interpolation, one CNN for the determination of FVC from
    3D scans and one DCGAN for the generation of realistic 2D CT images.'
