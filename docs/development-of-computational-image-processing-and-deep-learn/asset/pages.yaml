  md: 'The complex Riemannian interpolation is another "global" interpolation method
    [126]. However, if more than two input arguments are used, the underlying computations
    can only be solved implicitly, which requires an iterative and therefore computationally
    expensive calculation. Since this thesis explicitly seeks an application-oriented
    method that is as fast and simple as possible while maintaining the highest possible
    quality, Riemannian interpolation will not be discussed further. Another logarithmic,
    but explicitly solvable approach was introduced by Arsigny et al. [122]: the Log-Euclidean
    tensor interpolation method. This method was already considered for FOT by Krauß
    and Kärger [125]. As it showed similar behavior in [125] as the basic Euclidean
    interpolation (component averaging), it will not be used in this work.


    A completely different approach are so-called decomposition methods. These methods
    make use of the fact that SPD tensors can be decomposed into eigenvalues and eigenvectors
    in spectral decomposition (cf. Equation (2.56)). In terms of tensor glyphs, the
    eigenvalues are responsible for the shape, while the eigenvectors are responsible
    for the orientation of the tensor in space. Thus, shape and orientation can be
    weighted (according to various possible distance measures) and interpolated separately
    and then recomposed into a tensor. This can be done directly via the eigenvalues
    and eigenvectors, or via detours with the help of other invariants and, for example,
    quaternions. This method allows in particular the resolution of the swelling effect
    [123, 125]. It should be mentioned here that there is not only one decomposition
    method, but this must be understood as a kind of umbrella term, which can be executed
    very differently in the individual steps. The only previous use of this concept
    for FOT by Krauß and Kärger [125] differs from the one implemented in this work,
    for example. The exact concepts used for the decomposition method will be explained
    in detail in the Methods chapter (cf. Section 3.7.3) and have been previously
    summarized by the authors in [17, 127], but basic considerations about the decomposition
    method will be elaborated in the following paragraph.


    As far as the shape is concerned, a direct interpolation of the eigenvalues would
    be conceivable. There are also approaches which handle it this way [128]. But'
