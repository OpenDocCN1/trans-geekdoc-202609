  md: '# 3.1.3 Carbon fibers


    Carbon fibers are a long and thin (usually about 5 μm - 7 μm in diameter) material
    composed mostly of carbon atoms. They owe their high strength and Young''s modulus
    to their graphite-like arranged carbon structure in planes that get aligned parallel
    to the fiber direction during manufacturing. When producing carbon fibers, the
    raw material, also called precursor, is in most cases polyacrylonitrile (PAN),
    or more rarely rayon or pitch, which all exhibit long strings of carbon bound
    molecules. After thermally stabilizing the long strands of precursor by heating
    the fibers in air at 200 °C - 300 °C, the so-called carbonizing step follows.
    While heating the fibers for several minutes at a temperature between 1,000 °C
    and 3,000 °C in an atmosphere without oxygen, the non-carbon atoms leave the fibers.
    After treating the surface to slight oxidization, the fibers are finally coated
    in a material compatible with matrix material. This process is also called sizing.
    [273]


    For this work, high-tenacity (HT) carbon fibers PX 35 with sizing for PA6 were
    acquired from ZOLTEK Corporation, St. Louis, United States. In the respective
    data sheet, the manufacturer states a carbon content of 95 %, a density of 1.81
    g/cm³, a diameter of 7.2 μm, a Young''s modulus of 242 GPa, a tensile strength
    of 4,137 MPa and an elongation at break of 1.7 %. The tex number is 3750.


    # 3.1.4 Glass fibers


    The glass fibers were provided by Johns Manville Corp, Denver, United States.
    The type is StarRov © 895 2400 with a tex number of 2400. However, they will only
    play a subordinate role in this work, which is why no further mechanical parameters
    will be given.'
