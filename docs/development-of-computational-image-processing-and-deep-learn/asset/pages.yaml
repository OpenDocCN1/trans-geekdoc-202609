    # 4.5 Fiber orientation


    In the following section, all results relating to fiber orientations are presented.
    First, validation results of the application of the structure tensor based method
    for fiber orientation evaluation for the material of this thesis are shown. Subsequently,
    special features of the evaluated fiber orientation tensors over the thickness
    (z-axis) are addressed. The behavior of the fiber orientation tensors considering
    the x-y-plane will be taken up in the following Section 4.6 dealing with the interpolation
    of FOT.'
