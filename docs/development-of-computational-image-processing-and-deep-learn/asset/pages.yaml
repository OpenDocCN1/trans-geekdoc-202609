    # 2.4.1.2 Multi-layer perceptron (MLP)


    A standard neural network normally consists of multiple layers of perceptrons,
    more precisely an input layer, some number of hidden layers and an output layer;
    so at least three layers. The input layer is often not counted in the amount of
    layers as it performs no processing and only has a distribution function towards
    the next layer [177]. These kinds of neural networks are often referred to as
    "vanilla" neural networks emphasizing their simplicity and them being the first
    of their kind [178]. A simple fully connected MLP with one hidden layer can be
    seen schematically in Figure 2.16.


    The input values \(\boldsymbol{x} = \{x_1, x_2, ..., x_n\}\) are often referred
    to as "features" in the context of neural networks making \(\boldsymbol{x}\) the
    feature vector [174]. Following, one or multiple layers of hidden notes \(h_i\)
    process the input until it reaches the final output layer, where the results are
    given out in the output vector \(\boldsymbol{y}\). An activation function maps
    the weights to the following layer [179]. The name multi-layer perceptron is misleading
    or incorrect in that contrary to the step function used as activation function
    by the original perceptron, modern neural networks rely on nonlinear kinds of
    activation functions providing them the ability to distinguish data that is not
    linearly separable [180]. Different kinds of activation functions will be shortly
    outlined in Section 2.4.1.5. In this simple case, connections are only permitted
    between nodes in consecutive layers and in a forward direction, which is why they
    are also called *feedforward* networks [175].'
