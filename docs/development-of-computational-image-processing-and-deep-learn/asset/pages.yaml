    the fact that an attempt was made to insert the plastificate rotated by 180° and
    a downward drift was detected. It therefore appears to have been caused by the
    plastificate itself, which seems to be inhomogeneous in some way. Tröster comes
    to the same conclusion: In addition to the insertion position of the plastificate,
    the direction of the plastificate is also decisive for the resulting fiber orientation
    and, in particular, deviations from the flow direction. However, he does not investigate
    further why this is the case. Radtke [321] investigates the cause by using thermographic
    images. He records a temperature difference of approx. 10 K - 30 K between the
    front and back ends of the plastificate strand. As a result of the plastificate
    being discharged from the plastificate nozzle, the plastificate cools slightly
    more at the end that is discharged first. The tunnel heater at the outlet of the
    discharge nozzle partially, but not completely, compensates for this heat loss.
    He claims that this temperature gradient in the plastificate strand results in
    a difference in viscosity in the strand. This could lead to a slightly rotated
    orientation of the flow front relative to the mold edges. [321] However, a clear
    temperature difference could not be detected in measurements in this case. In
    turn, it is assumed that the geometry and/or the porosity of the plastificate
    could play a decisive role. Corresponding investigations have already been shown
    in Section 5.1. Radtke also mentions the so-called lofting (expansion of'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'the strand due to the recovery of the relatively rigid fibers, which are not
    fixed in the molten matrix) at the front end of the plastificate [321]. However,
    since the fibers are quite short, the lofting could also be caused by the matrix.
    The short dwell time in the extrusion die subsequently leads to strand expansion.
    This lofting leads to increased deviation of the cross-section across the extrusion
    direction and the geometry itself (elongation of the front end in the extrusion
    direction) and to increased porosity of the front end. These effects could enable
    such a skewed flow front and thus lead to a deviation of the main orientation
    and hence to material anisotropy.


    # 5.4.4 Interpolation of fiber orientation tensors


    In the following, the fiber orientation tensor interpolation methods are discussed
    and evaluated.


    # 5.4.4.1 Component averaging method 3


    The weighted, arithmetic averaging of the components based on the Euclidean distance
    is a linear approach and by far the simplest. It impresses with its calculation
    speed and is superior in terms of simplicity of implementation and general complexity.
    It is therefore still frequently used. The problem of tensor swelling already
    discussed in the State of the Art [122–125] was also evident in this work. Tensor
    characteristics were therefore not monotonically interpolated, which is considered
    a disadvantage. In the course of this, the scientific question of distinguishing
    between interpolation and averaging also arose (cf. [338]). This type of component
    averaging can certainly be used with a clear conscience when it comes to determining
    the mean value of a set of tensors. Interpolation, however, searches for values
    between given ones, which this method cannot provide in the author’s opinion.


    3 This section is based on the author’s publication [17].'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# 5.4.4.2 Decomposition method 4


    The decomposition method impresses with its monotonic behavior. This is also visually
    appealing in the agile rotational behavior of the tensors and meaningful changes
    in shape, which was also observed by other authors [123, 125]. Although mathematically
    more complex, the calculation is still extremely fast, at least for the smaller
    scopes tested. It was impressive to see how equally good the interpolation was
    when the same nine given tensors were provided in different coordinate systems
    (rotated by angles). An alternative to the method, which already works very well
    as it is, would be to use projectors instead of quaternions for rotation interpolation,
    as implemented by Krauß and Kärger [125]. These projectors have the decisive advantage
    that they are unique for a given tensor.


    # 5.4.4.3 ANN 5


    The ANN obviously requires the most time to output the interpolated tensors. With
    training times of less than an hour on an office laptop (Intel(R) Core(TM) i5-10210U
    CPU @ 1.60 GHz, 2.11 GHz and 16.0 GB RAM) with the subsequent output of 160 tensors,
    this is nevertheless still fast compared to around two hours for a single scan
    and tensor. However, the increased implementation effort for such a network must
    be taken into account. In this case, it was actually low, as a network already
    developed for a similar application was adapted. The interpolation of the ANN
    is not very convincing with non-monotonic behavior similar to component averaging.
    With further development, nonetheless, a better result could be expected. A more
    general question is of course whether a neural network, which relies on a lot
    of training data, is at all useful for an application with a data set this small.
    Presumably, the network would have to be given additional input for better performance.
    Working with scarce (or sparse) data


