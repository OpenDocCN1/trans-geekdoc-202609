    is penetrated by pores cannot be delimited by thresholding methods, as air is
    on the outside and inside, and also cannot be delimited by region growing approaches
    or similar due to its branched shape. The solution is morphological approaches.
    These apply a structuring element, which can have any shape or size, usually a
    square or circle, to an input image and generate an output image. These have the
    advantage that they cannot only remove noise but isolate individual elements and
    especially join disparate elements in an image, which is needed to capture the
    plastificate as a whole. The most basic and well-known morphological operations
