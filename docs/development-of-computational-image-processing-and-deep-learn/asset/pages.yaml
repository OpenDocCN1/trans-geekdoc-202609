- pgno: 277
  md: 'While this effect is also a kind of shell-core effect, it is not the shell-core
    effect known in injection molding, which occurs due to the fountain flow [5].
    Because the mass has to flow from the center to the edge, the fibers in the core
    layer are mainly directed against the flow and in the shell layers rather in the
    direction of the flow [5]. This is not the case here. Instead, the observed courses
    are due to a different phenomenon: The plastificate is inserted in the charge
    area and the fibers in its outer layer there are mainly oriented in the extrusion
    direction, i.e. e22 direction. On contact with the "cold" tool surface, the orientation
    there freezes directly as it appears in the plastificate. In the flow area, however,
    the orientation of the material flow in the e11 direction naturally dominates.
    This is consistent with the results of Radtke [321]. He also claims that the longitudinal
    orientation prevailing in the outer layers of the plastificate remains unchanged
    in the test plates in the insertion area, as it freezes immediately on contact
    with the mold [321].


    # 5.4.3 Skewed flow front


    As already seen, the expected main flow direction also developed in the plates.
    Due to the fact that the length of the plastificate does not extend completely
    over one side of the plate, a slight widening of the flow in the direction of
    the upper and lower edge of the plate at the end is to be expected, as shown in
    Figure 5.5.


    In fact, this phenomenon can also be seen, e.g. in the tensors of the plates on
    the left-hand side in Figure 4.33. In addition, however, the averaged tensors
    of these plates (see middle column in Figure 4.33) are never completely oriented
    in the e11 direction (or also 0° direction). Instead, they all point slightly
    upwards. This was already evident in the tensors of second-order of Plate 1 with
    the smaller specimens, which was used for the interpolation method evaluation
    (see e.g. Figure 4.24). This deviation from the extrusion direction has already
    been partially observed in literature [320, 321]. The reasons for this could be
    manifold. An uneven tool in the press would immediately come to mind, but this
    was checked and did not appear to be the case. This is also contradicted by'
  merge: -1
