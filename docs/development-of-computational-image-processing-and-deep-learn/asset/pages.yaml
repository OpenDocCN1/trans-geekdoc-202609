  md: '# ## 3.3 Investigations of the initial charge/plastificate


    It appears obvious that the microstructure of the final plates is particularly
    dependent on the initial structure of the inserted plastificate. For this reason,
    a CT image-based investigation of the microstructure of the plastificate was initially
    of interest in order to understand the overall flow and material behavior in the
    pressing process.


    # ### 3.3.1 Initial orientation state


    First of all, the initial fiber orientation in the plastificate appears to be
    particularly decisive for the fiber orientation and microstructure of the plate.
    It could basically be determined using the same procedure for determining the
    fiber orientation tensors as for the samples from the plates, which is presented
    in Section 3.6 and which is based on the principles explained in Section 2.2.3.2.
    Therefore, CT images were acquired from plastificates, which can be seen for CF-PA6
    in Figure 3.5 and for GF-PA6 in Figure 3.6.


    The two swirls in the center of the plastificate can be clearly seen in image
    (a) of both figures. However, no real distinction between fiber and matrix is
    possible, especially with the CF plastificate, but also with the GF plastificate.
    This is due to the poor resolution, which is required by the size of the plastificate,
    and the fact that there is a lot of air in the material mixture, which has such
    a clear difference in gray value that the small difference between fiber and matrix
    is hardly recognizable. A classic fiber orientation analysis is therefore hardly
    possible. However, the gradient-based method can still be used and simply determine
    the gradients between air and material. This would then determine the overall
    material orientation. One can make the reasonable assumption that the fibers move
    along the matrix flow and should therefore be oriented in a similar or the same
    way as the overall material.'
