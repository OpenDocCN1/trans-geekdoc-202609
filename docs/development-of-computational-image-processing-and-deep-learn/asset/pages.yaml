- pgno: 272
  md: 'CF-PA6 plates were only produced with the same mean FVC. The fluctuation of
    the FVCs is therefore purely due to the fluctuations of the FVC across the plates.
    These were not small, which in turn demonstrates the necessity of such a local
    investigation. Another way to increase performance would be to use a higher resolution
    for the scans. The reduction to 100 px × 100 px × 100 px was necessary due to
    the limitation of computational resources. Any higher resolution led to memory
    issues in the bwHPC cluster, which was used for the calculation. A higher resolution
    would allow a better inclusion of single fibers or smaller fiber bundles and improve
    the distinction between fibers and irrelevant gray value deviations of the matrix.
    However, it should also be mentioned that this resolution is quite competitive
    when compared to other CNNs [332–334]. Of course, an originally higher resolution
    of the CT scans could also improve this further, but this brings us back to one
    of the basic dilemmas of this thesis, namely that this would result in very small
    specimens whose informative value with regard to mechanical characterization parameters
    such as the FVC is low (not to mention the fact that a corresponding device quality
    is also required for this). The aforementioned increase in noise at low resolutions
    further complicates the evaluation, so that even small, high resolution samples
    in combination with corresponding larger but lower resolution scans is not an
    optimal solution.


    The direct use of 3D scans should be emphasized as a unique selling point compared
    to other CNNs in the field of materials science that work with CT scans as training
    data [334, 335]. No prior slicing is required. The complete evaluation of the
    3D scan, of course, slows down the calculation enormously. With regard to the
    above-mentioned point of computational resource scarcity, the use of 2D slices
    instead is of course very helpful. It also simplifies the use of pre-implemented
    methods from tensorflow (but also pytorch), as most of them are designed for 2D
    images. In general, the development effort and also the training effort compared
    to the AOA thresholding must of course be emphasized negatively. However, once
    trained, the effort required to determine the FVC is considerably less than the
    experimental effort.'
