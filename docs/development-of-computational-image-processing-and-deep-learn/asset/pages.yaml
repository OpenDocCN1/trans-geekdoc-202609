- pgno: 296
  md: '# # 6 Final remarks


    # ## 6.1 Summary


    In this work, investigations into the plastificates were first presented. It was
    shown that both the rotational speed during extrusion and the lofting of the plastificates
    have an influence on their porosity. As expected, the orientation results show
    double circular structures in the cross-section due to the twin-screw extruder
    and almost perpendicular orientation to the extrusion direction.


    To determine fiber volume contents from the scans, a slightly adapted thresholding
    method and a convolutional neural network were developed and validated using experimentally
    obtained data. While the network performed well, the AOA thresholding was sample-wise
    better. Further development and inclusion of samples with more variable fiber
    volume contents would be useful. The second research question formulated in the
    introduction aimed at how quantities such as fiber volume content can be reliably
    extracted from CFRP scans, which are more difficult to process. This work shows
    that adaptation of known methods, but above all AI-based methods, can certainly
    provide a remedy for low-contrast or noisy images. However, eliminating the cause
    and generating better images in the first place would of course be an even better
    measure, but this was not possible within the scope of this dissertation.


    With regard to the interpolation of second-order fiber orientation tensors, three
    different methods were tested, whereby the decomposition method based on spectral
    decomposition was the most convincing. It was then applied in simplified form
    to fourth-order fiber orientation tensors. The resulting averaged'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'tensors could in turn be used without closure approximation in Mori-Tanaka
    homogenization and the resulting modeled stiffnesses could be compared with experimentally
    determined stiffnesses. Concerning the orientation, the results were largely in
    agreement. This tensor interpolation provides initial answers to the first research
    question formulated at the beginning, namely how information from smaller specimens
    can be transferred to larger dimensions. First of all, it should be noted that
    the consideration of information from smaller specimens instead of purely macroscopic
    observations makes sense considering the fluctuations of mechanical variables
    over, e.g., such a plate as in this work. In order to obtain a reference to a
    macroscopic behavior, interpolation methods such as the ones described above are
    suitable. Even for the more complex case of tensors, there are methods that can
    generate realistic interpolations. However, the resolution problem of CT scans
    for materials with such small constituents as carbon fibers greatly complicates
    the processing of medium-sized samples. Samples that are too small also exacerbate
    these methods though, as the information obtained can be so local and deviate
    so strongly from the global material behavior that a corresponding interpolation
    is again difficult. The problem has therefore not been conclusively clarified
    and would have to be checked in particular by interpolating fiber volume contents
    or fiber length distributions too.


    Finally, the development and successful use of a generative adversarial network
    for the generation of artificial two-dimensional CT images was demonstrated. From
    the author’s point of view, the third research question of this thesis can therefore
    be clearly answered in the affirmative. Realistic images could be generated by
    the GAN and there is also potential for future use to generate three-dimensional
    RVEs. However, the second part must be answered positively with reservations and
    caution, as this must be preceded by a great deal of further development work.


    To address the final research question of the thesis: The enormous potential of
    AI-based methods, especially neural networks, for the application to such material
    science characterization questions could be clearly demonstrated.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'The networks showed particularly good results especially for image evaluation/generation
    questions, where convolutional layers proved to be powerful. In the case of tensor
    interpolation, more complex algebraic approaches proved to be the better solution.
    However, the risks of AI-based methods should also be pointed out here. While
    the GAN generated very realistic images, their objective assessment was difficult.
    Still, the use of such generated images to co-train networks (as an extension
    of a "real" data set) should not be problematic and can certainly improve the
    performance of other networks. The overtraining that presumably occurred in the
    case of the CNN, which only output fiber volume contents in the area in which
    it was trained, should also be viewed critically. However, the conclusion that
    a bias in the training dataset leads to a bias in the results is straight-forward
    and therefore a lot of prior knowledge and work should be put into the creation
    of the training dataset. The argument concerning the unscientific nature of the
    "black box" of a neural network remains, as the depth of layers, branches and
    weightings are usually not comprehensible.


    # 6.2 Conclusion


    This dissertation shows how image analysis methods and especially neural networks
    can be used to determine micro- and mesomechanical parameters from CT scans of
    long carbon fiber reinforced polymers. This enables comprehensive characterization
    and scale-bridging of mechanical quantities in addition to classical macroscopic
    characterization.


    The following conclusions can be drawn from this work:


    Neural networks with convolutional layers are a powerful tool for image processing
    or image generation even of slightly noisy CT images. However, prior knowledge
    of materials science must be taken into account when selecting training data and
    network architecture. Interpolation methods can help to close the gap between
    microstructural variables that can be evaluated from small samples and macroscopic
    material behavior. However, it does not solve the'
  merge: -1
  img_proc: true
- pgno: 299
  md: dilemma between resolution and sample size and the poor CT image quality due
    to the small size of the fibers and their low contrast to the matrix. A fundamental
    improvement of the images would of course still be desirable for all evaluation
    and processing methods. Furthermore, it can be concluded that the process - as
    expected - has an enormous influence on the final workpiece quality and that an
    increased understanding of the process is essential in order to improve it. There
    is still a great deal of research to be done on the LFT-D process in particular.
    In principle, image processing, whether AI-based or not, opens up enormous possibilities
    for fast, statistical microstructure analysis, even beyond the field of fiber
    reinforced polymers, and will sooner or later find its way into all aspects of
    materials science.
  merge: -1
  img_proc: true
