    # ## 2.4.1 Theoretical principles of ANNs


    # ### 2.4.1.1 Single layer perceptrons


    The smallest sub-unit of an ANN is a so-called single layer perceptron (SLP).
    Based on the original neuron model by McCulloch and Pitts in 1943, it was first
    introduced as perceptron by Rosenblatt in 1957 and is a linear classifier whose
    structure resembles that of a biological neuron (cf. Figure 2.14). [171, 172]


    ![](img/332d06e0447dbfd85ea7d2fb553468f3_113_0.png)


