    # ## 2.2.3 Fiber orientation distribution


    Most fibers in short and long fiber reinforced polymers do not have a uniform
    orientation. A necessary description of the orientation distribution can be given
    by a probability distribution function of the orientation, ψ, [43], sometimes
    called orientation distribution function (ODF) [85] or fiber orientation density'
