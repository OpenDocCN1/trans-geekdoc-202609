    # 2.4.2 Generative adversarial networks


    Generative adversarial networks, or GANs for short, were introduced by Goodfellow
    et al. [143] in 2014, and have since been considered one of the biggest findings
    in AI science [222], which is underlined by the over 78,000 citations of the original
    paper to date [223]. In 2020 alone, about 28,500 papers related to GANs were published,
    corresponding to approximately 78 papers every day, which are more than three
    per hour [222]. The main function of GANs is the generation of realistically looking
    images after being trained on a given training image data set [143]. Possible
    areas of application range from 3D object generation via medicine, pandemics (mostly
    during COVID19), image processing, face detection and text transferring to traffic
    control and many more [224]. In these application fields, the function of a GAN
    is not limited to the generation of images per se, but includes noise reduction,
    classification, detection of human motion, the generation of 3D images from 2D
    images, face recognition or super-resolution of images [224]. After a slow start,
    GANs have also established themselves in materials science. They have been used
    among others'
  merge: -1
