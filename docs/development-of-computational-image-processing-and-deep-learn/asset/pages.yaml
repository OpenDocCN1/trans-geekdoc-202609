- pgno: 172
  md: 'by the computing power available at the bwHPC cluster. Iterative trials showed
    that it was capable of executing the script stably up to a cube size of \( 100
    \times 100 \times 100 \) voxels, which was thus selected as array dimension.


    # 3. Augmentation


    Neural networks require extensive amounts of data to improve their training process.
    Since only a small amount of scans are available (14), multiple stages of 3D-image
    augmentations were used to enlarge the input data set.


    In the first step, every scan was rotated by \( 90^\circ \) and added to the data
    set with the same FVC as its original. Since the cuboid shape of the transformed
    data allows for rotation about three independent axes, the process was repeated
    for the remaining two orthogonal axes. Solely rotating by multiples of \( 90^\circ
    \) ensures that no data is lost at the edges by leaving the scope of the arrays.
    Furthermore, it is computationally much more efficient than a rotation by a random
    angle since only the array indexes need to be interchanged.


    After multiplying the data set by a factor of 4 by adding rotations of the original
    scans, all scans are then flipped in a second step. Similarly to the first step,
    copies of the original scans are mirrored at one plane and then added to the data
    set with the same FVC as their originals. The process is repeated for the two
    remaining normal planes, further multiplying the data set by a factor of 8.


    Overall, by combining three rotations and three mirroring steps, the amount of
    input data can be multiplied by a factor of \( (1 + n_{\text{rotations}}) \cdot
    2^{n_{\text{reflections}}} = (1 + 3) \cdot 2^3 = 32 \). Therefore, the 14 original
    scans multiply to a data set of 448 samples. More combinations are possible but
    they lead to exact duplicates of arrays which can be obtained using the method
    above, i.e. two consecutive \( 90^\circ \) rotations about one axis equal two
    reflections about two different planes.'
