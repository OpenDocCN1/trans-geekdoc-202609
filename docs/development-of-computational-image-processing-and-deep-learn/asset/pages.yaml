  md: '# 2.1.2.4 Mean field homogenization


    Mean field homogenization can be regarded as a middle ground between the homogenization
    approaches mentioned so far. The aim is to determine mean material parameters
    for a certain volume, which is supposed to represent the microstructure of the
    composite. The important assumption here is that each fiber is an ellipsoid in
    the matrix and the aspect ratio of the ellipse represents the aspect ratio \(\left(\frac{l}{d}\right)\)
    of the fiber. It is further assumed that the fibers are straight and well distributed
    and that there is no fiber-fiber interaction. The homogenized material properties
    are then to be determined for this RVE with the simplified structure. [5, 39,
    40]


    In the context of mean field homogenization, the analytical solution for stress
    and strain in an infinite linear-elastic body with an ellipsoidal inclusion by
    Eshelby in 1957 was decisive [41]. He found that there is a uniform strain \(\epsilon_{\text{inclusion}}\)
    in the inclusion when it is exposed to eigen-strain \(\epsilon_{\text{m}}\), related
    by


    ```

    \(\epsilon_{\text{inclusion}} = \mathbb{N}\epsilon_{\text{m}}.\)

    (2.27)

    ```


    The strain in the infinite elastic body and the ellipsoidal inclusion are therefore
    not equal. \(\mathbb{N}\) is a fourth-order tensor that is a function of the fourth-order
    stiffness tensors of matrix \(\mathbb{C}_{\text{m}}\) and inclusion \(\mathbb{C}_{\text{f}}\)
    defined by


    ```

    \(\mathbb{N} = \left[ \mathbb{I} - \mathbb{E}\mathbb{C}_{\text{m}}^{-1}(\mathbb{C}_{\text{f}}
    - \mathbb{C}_{\text{m}}) \right]^{-1},\)

    (2.28)

    ```


    with \(\mathbb{I}\) as the fourth-order identity tensor and \(\mathbb{E}\) being
    the fourth-order Eshelby tensor, whose components are defined as a function of
    the aspect ratio of the inclusion (with which the average fiber length is taken
    into account) and the Poisson ratio of the elastic body around it. The exact definitions
    of the components can be retrieved from the original paper [41]. [5] An overview
    of the different options of homogenizing a composite can be seen in Figure 2.5.'
