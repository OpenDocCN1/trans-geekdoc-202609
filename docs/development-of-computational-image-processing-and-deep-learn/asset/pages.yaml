  img_proc: true
- pgno: 68
  md: '# 2.2.2.1 Experimental destructive methods for FLD determination


    There are several ways to determine the fiber length destructively, all of which
    are connected to the matrix removal, which is also used to determine the fiber
    volume content. Secondly, in most cases, a certain representative proportion of
    the fibers is selected first, as there are usually too many in a sample to be
    able to measure them meaningfully. Gandhi et al. [5] recommend a sample size of
    1000 to 2000 fibers. After some kind of method for the dispersion of fibers is
    applied, the fibers are separated. The fibers can be dispersed either manually
    or by air on a scanner. As this causes difficulties, most current methods are
    based on dispersion in liquid and subsequent mixing either manually or using ultra-sound
    [46, 69], including the two commercial methods described briefly below. The fiber
    lengths could be determined subsequently, for example, by progressive filtering,
    a fast, mechanical but rather imprecise process. Direct optical methods are more
    common. Therefore, a digital image is created either through microscopy or an
    optical document scanner and the image is afterwards analyzed. The individual
    length of each fiber can be detected either manually by selecting respective endpoints
    or with the support of image processing algorithms. Hybrid approaches are also
    used. [5]


    # FASEP


    With the commercially available system FASEP (IDM Systems, Darmstadt, Germany)
    [70] fiber lengths up to a theoretical length of 25 mm and also bent or crossed
    fibers of fiber reinforced thermoplastic materials can be detected. In a first
    step, as already mentioned, a sample is either pyrolised or dissolved in acid
    in order to remove the matrix. After the fibers are separated, they must be dispersed.
    This is done by adding the remaining fibers to distilled water to which glycerine
    has been added. The mixture is gently stirred and multiple of these diluting steps
    are carried out by adding more water and glycerine [5]. A small amount of this
    mixture is then pipetted into a 90 mm diameter Petri dish.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'A digital image of the fiber mixture is obtained using a customized dark-field
    imaging approach. The optical resolution of 1700dpi corresponds to a pixel size
    of 14.9µm. The tracking in the image itself is carried out using an ALF algorithm
    developed in-house by the FASEP company. [52, 69] Typically, several of these
    subsets of the sample are examined in succession to obtain a set of at least 3000
    fibers and the results are combined into a histogram of the frequencies.


    # FibreShape FiVer


    The sample preparation can be performed analogously to the FASEP approach. Distilled
    water and a little detergent are then added together with the fibers to a sample
    container measuring 6 cm × 12 cm. The fibers are distributed as evenly as possible
    with a spatula without breaking them. The sample vessel holder is then placed
    in the so-called FiVer scanner. An image is scanned using the Silverfast software.
    The real optical resolution corresponds to 8 µm, which is why fiber lengths between
    30 µm and 5 cm can be detected. Depending on the inhomogeneity of the sample,
    five to seven of such images are taken per sample, which can correspond to over
    10,000 elements after the measurement. In particular, the high resolution also
    makes it possible to measure fibers with a thinner diameter, such as carbon fibers.
    The FibreShape (IST AG, Vilters, Switzerland) program is then used to measure
    the corresponding lengths from the images. The exact length detection algorithm
    of the company is not known to the author. The output is the geodetic length,
    as the fibers that are measured are often curved. The geodetic length indicates
    the corresponding length that would be measured if the fiber was straight. The
    program calculates the value on the basis of the equality of the area or circumference
    of the bent and the curved fiber image. The procedure complies with the specifications
    of ISO 9276-1 and ISO 13322. [52]'
