    # 2.3.2.3 Blur and noise


    As Sprawls describes in [159], the main characteristics of CT imaging exacerbating
    the detection of structures are blur and noise. The former reduces the visibility
    of small objects and hence decreases image detail. The latter reduces the visibility
    of low-contrast objects. Fibers fit both of these descriptions. While small voxels
    and edge-enhancing filters can reduced blurring, small voxels absorb fewer photons
    and therefore increase noise, which is caused by the variation in attenuation
    coefficients between voxels. Noisy images can be improved by large voxels, increasing
    the radiation dose or using smoothing filters. The latter, however, increases
    blurring again. [159] Since the measures for reduced blur and noise are partially
    mutually exclusive, the focus of the work was on the reduction of noise, since
    single-fiber detection was excluded anyway. Hence, larger voxels, increased radiation
    dose and smoothing filters were used for image improvement.


