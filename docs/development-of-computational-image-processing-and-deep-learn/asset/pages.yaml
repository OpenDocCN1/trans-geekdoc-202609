- pgno: 92
  md: 'Ennis et al. [124] developed the concept of orthogonal invariants, which seem
    to perform very well for physical problems. Each set of invariants decomposes
    the tensor shape with an orthogonal basis so that the derivatives of these invariants
    \( I_i \) with respect to the (fiber orientation) tensor \( \boldsymbol{A} \)
    behave as follows:


    ```

    \frac{\partial I_i}{\partial \boldsymbol{A}} \cdot \frac{\partial I_j}{\partial
    \boldsymbol{A}} = 0, i \neq j. \qquad (2.62)

    ```


    Ennis et al. established the so-called K- and R-invariants, which are also used
    in this paper. They argue that while eigenvalues form a set of orthogonal invariants
    as well, they have the disadvantage of not isolating essential attributes of tensor
    shape like size and anisotropy which the sets of K- and R-invariants provide instead.
    A direct interpolation of the eigenvalues has still been performed as a test but
    indeed seemed to distort the results and will not be considered in more detail
    in this work.


    When it comes to the interpolation of the orientation of the tensors, there are
    multiple works which focus on the interpolation of rotations in 3D, i.e., elements
    in the 3D rotation group, which is also called \( SO(3) \), as a separate mathematical
    problem independent of tensors or the shape of the same [129–132]. However, many
    of these papers focus on the smooth rotation between two or few different orientation
    states. These methods do not necessarily perform just as well for multiple and
    spreaded orientation tensors. Typically, the orientation of a general basis in
    3D linear algebra is described by Euler angles with respect to a fixed coordinate
