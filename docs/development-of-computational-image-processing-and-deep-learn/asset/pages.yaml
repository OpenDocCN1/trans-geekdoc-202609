  md: '# 3 Materials and Methods


    The Methods chapter first discusses the material and the CT scans, which serve
    as the basis for all investigations in this thesis. The methods used to examine
    the plastificates are then explained. This is followed by descriptions of the
    methods for determining fiber volume content, fiber length distribution and fiber
    orientation distribution. After the interpolation of the fiber orientation tensors
    has also been explained, the chapter concludes with an elaboration of the generative
    adversarial network used for artificial image generation.


    # 3.1 Materials and processes


    In the following, the material constituents are presented, as well as the process
    used to produce the final composites, the sizes and extraction points of the specimens
    and the considerations behind these.


    # 3.1.1 Polyamide 6


    PA6, sometimes also referred to as polycaprolactam, Perlon or Nylon 6, is a thermoplastic,
    semicrystalline polymer from the group of polyamides. The number 6 was assigned
    because of the six carbon atoms between the nitrogen atoms in the molecule chain.
    The chemical formula is (C₆H₁₁NO)ₙ. In contrast to other polyamides, which are
    mostly formed by condensation, PA6 is synthesized by ring-opening polymerization
    of ε-caprolactam (compare Figure 3.1).'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/332d06e0447dbfd85ea7d2fb553468f3_145_0.png)


    Figure 3.1: Schematic depiction of the synthesis of polyamide 6 by ring-opening
    polymerization of ε-caprolactam. The ε-caprolactam is heated at about 533 K -
    553 K in an inert atmosphere of nitrogen for multiple hours until the ring breaks
    and polymerization takes place. Small amounts of water are initially required,
    which is why this synthesis process is also known as hydrolytic polymerization.
    However, alternative synthesis processes are also possible. Based on [271].


    PA6 has a melting temperature of approximately 222 °C, a glass transition temperature
    between 50 °C and 60 °C and a density of 1.14 g/cm³. With 3 % moisture absorption
    at 50 % relative humidity and even 9.5 % moisture absorption in water, PA6 can
    uptake particularly high amounts of water. [271] Water acts as a plasticizer in
    PA, decreasing the glass transition temperature by about 50 °C between completely
    dry and maximum water absorption [272]. In addition, the shear modulus and modulus
    of elasticity depend on the temperature, as typical for thermoplastics. [272]
    These dependencies on climatic and environmental conditions exacerbate the work
    of engineers when designing with PA6 and characterizing the material behavior
    of it.


    In this specific work, the PA6 matrix material used was the TECHNYLSTAR XS 1352
    BL NATURAL with a master batch. It was generously provided by the company DOMO
    Chemicals GmbH, Leuna, Germany.


    # ## 3.1.2 Polycarbonate


    In order to take into account the differences that the choice of matrix system
    has, in particular on the structure of the plastificate, polycarbonate is sometimes
    used as a reference system in this thesis. The polycarbonate material is a Makrolon
    2405 PC provided by Covestro AG, Leverkusen, Germany.'
  merge: -1
