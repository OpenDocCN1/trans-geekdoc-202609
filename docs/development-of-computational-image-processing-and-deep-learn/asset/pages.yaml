- pgno: 204
  md: '# ## 3.8.4.1 Fréchet inception distance (FID) 14


    The Fréchet inception distance [313], as an advancement of the inception score
    [314], is a metric to determine the difference between feature vectors of generated
    samples and real training images. It is based on the Inception v3 Network [315]
    that is pre-trained on the ImageNet [316]. The FID compares the activations from
    the penultimate layer of the inception network of real \( p_r(x) \) and generated
    \( p_g(x) \) images [317]. The distributions of these real and generated images
    are thereby modeled as multi-dimensional Gaussians that are defined by their mean
    \( \mu \) and covariance \( cov(x, y) \). The distance is hence defined by


    \( d^2((\mu_r, cov_r)(\mu_g, cov_g)) = |\mu_r - \mu_g|^2 + \text{tr}(cov_r + cov_g
    - 2(cov_r cov_g)^{1/2}). \) (3.18)


    Thus, a lower FID value corresponds to a smaller distance between the two distributions
    of real and generated data. The FID values are dependent on the corresponding
    resize or compression operations and can even improve for higher compressed images
    (i.e. poorer resolution) [318]. The FID values must therefore be regarded as a
    benchmark for the quality of images created using the same network in different
    epochs and are of limited suitability for comparing different networks. The FID
    was calculated of 128 generated images per epoch.


    # ## 3.8.4.2 Nearest neighbor procedures 15


    A question that arises quite naturally is whether a network reproduces only the
    training data, which involves overfitting. To address this, a k-nearest neighbor
    search is performed, which calculates the k nearest neighbors from the entire
    training data set to a given generated image. This is equivalent to finding the'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'images in the training data set that have the smallest distance to the generated
    image based on a suitable distance measure. In the following, we briefly introduce
    the Euclidean distance and the computationally more expensive structural similarity
    index measure (SSIM), as these serve as the basis of the k-nearest neighbor search
    in the results of this paper.


    +   • Euclidean distance (ED)

    +   The Euclidean distance being one of the simplest ways to determine the similarity
    between two arrays and the most common distance measure for nearest neighbor search
    [319] can be calculated for two gray scale images \(\boldsymbol{x} = (x_1, x_2,
    ..., x_{MN})\) and \(\boldsymbol{y} = (y_1, y_2, ..., y_{MN})\) of size \(M\)
    px \(\times\) \(N\) px as:


    ```

    \(d^2_{\text{E}}(\boldsymbol{x}, \boldsymbol{y}) = \sum_{k=1}^{MN} (x_k - y_k)^2
    \quad (3.19)\)

    ```


    with the gray levels at the location \((k, l)\) given as \(x_{kN+l}\) and \(y_{kN+l}\).
    The smaller the calculated value, the higher the similarity. As there are major
    limitations like the non-consideration of spatial relationships, the nearest neighbors
    found through the calculation of the ED sometimes do not match human perception.
    Therefore, a second distance metric is considered. The ED is still calculated
    due to its computational simplicity.


    +   • Structural similarity index measure (SSIM)

    +   Another option for the evaluation of nearest neighbors of GANs is the SSIM
    [312] introduced by Wang et al. in 2005 [319]. It focuses especially on factors
    that are also relevant to human perception through evaluating luminance L, contrast
    C and structure S. Those three aspects are separately mathematically defined through
    means \(\mu_x\) and \(\mu_y\), standard deviations \(\sigma_x\) and \(\sigma_y\)
    and cross-correlation coefficient \(\sigma_{xy}\) of the two images \(\boldsymbol{x}\)
    and \(\boldsymbol{y}\). The detailed formulas can be found in the paper by Wang
    et al. [319]. In order to avoid instabilities for small values, constants \(C_i\)
    are added.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'The product of these three quantities relatively weighted through three power
    parameters \(\alpha > 0\), \(\beta > 0\) and \(\gamma > 0\) results in the \(SSIM(x,
    y)\). Choosing \(\alpha = \beta = \gamma = 1\) and \(C_3 = C_2/2\) leads to the
    following SSIM formula:


    \(SSIM(x, y) = \frac{(2\mu_x\mu_y + C_1)(2\sigma_{xy} + C_2)}{(\mu_x^2 + \mu_y^2
    + C_1)(\sigma_x^2 + \sigma_y^2 + C_2)}.\) (3.20)


    The values range between (-1, 1] with a value of one corresponding to optimal
    similarity, hence equality of the images. It shall be mentioned that the SSIM
    is usually not calculated globally but instead inside of a Gaussian window covering
    a local square patch which slides pixel by pixel across the entire image. In the
    so-called mean-SSIM or MSSIM all local values are summed up and divided by the
    total number of windows \(m\) in order to obtain one single quality measure. Conventionally,
    the MSSIM is often referred to as just the SSIM, which will be handled similarly
    in this work.


