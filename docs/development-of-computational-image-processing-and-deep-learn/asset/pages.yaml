    # **Rectified Linear Unit (ReLU) and Leaky Rectified Linear Unit**


    Inspired by neuroscience, Nair et al. [208] presented the ReLU as a piecewise
    linear activation function in 2010 initially for the use in restricted Boltzmann
    machines, which has since become one of the most used activation functions [207].
    In contrast to the previously shown functions, ReLU is a non-saturated function
    resulting in high convergence speed and the avoidance of vanishing gradients [209].
    The function can be expressed by


    \( h^{(l)} = \max(w^{(l)\tau} x, 0) = \begin{cases} w^{(l)\tau} x & \text{if }
    w^{(l)\tau} x \ge 0, \\ 0 & \text{if } w^{(l)\tau} x < 0, \end{cases} \quad (2.116)
    \)


    and can be seen on the left in Figure 2.23. Disadvantages include the death of
    neuron units that were not initially activated as their weights will not be updated
    and a slow training process for gradients constantly being zero [204, 206].'
