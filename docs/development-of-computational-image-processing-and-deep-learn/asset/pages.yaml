    In addition, there are of course further points for discussion. It is certainly
    important to mention the unusually complex initial state with very different rotations
    of the measured tensors, which does not represent the typical fiber course that
    occurs in this process. It became clear in the course of the dissertation that
    the chosen sample size of 10 mm × 10 mm was quite small and reflects very local
    effects. For the comparison with experimental values, which will follow in this
    discussion, significantly larger samples were therefore chosen to better represent
    the process behavior. As already mentioned, however, this allowed the methods
    to be tested in a kind of worst-case scenario, which in turn was not undesirable.
    Many mathematically motivated methods for tensor interpolation are often not even
    tested with more than two tensors, let alone more complex initial states, which
    makes realistic or non-academic use rather difficult. This was hence intended
    to be avoided in this work.


    The general challenge is the use of methods to solve an algebraic problem for
    an application that is actually subject to physical boundary conditions and flow
    phenomena. This naturally raises the question of whether physical conditions (e.g.,
    insertion of the plastificate or orientation information of the plastificate)
    should be added to such a method. Nevertheless, the decision was made not to pursue
    this, as it was perceived to be an unnatural means of achieving the desired outcome.
    For the same reason, a restriction of the possible angles was not implemented,
    which, e.g., Krauß and Kärger have done [125]. Brannon even argues that methods
    for mixing rotations must be selected according to the physical application [343].
    This speaks against the existence of a universally valid procedure.


    There are many possibilities for improvement. First of all, adjustments to the
    methods implemented here are conceivable. The aforementioned restriction of the
    possible angles could be achieved by comparing the scalar products of the possible
    quaternions involved. By choosing the combination with the maximum scalar product,
    the smallest angle is obtained. Normalization of the quaternions'
