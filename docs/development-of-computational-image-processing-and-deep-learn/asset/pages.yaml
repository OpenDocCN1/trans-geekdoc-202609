  md: 'Radford et al. [250]. For multi-GPU parallelization and therefore a faster
    training, NVIDIA CUDA with the "DataParallel" method of PyTorch is used [310].


    The actual training process follows this scheme: First, one batch of generated
    images is created based on random noise vectors and associated with the corresponding
    labels (0 for generated). These images are then fed to the discriminator together
    with one batch containing only real images from the training data set (labeled
    1 for real). Based on the average of the calculated losses (following Equation
    (2.123)) on both batches, the discriminator biases are updated. As a next step,
    again Gaussian sampled random noise vectors are passed to the generator which
    outputs one batch of generated images. Based on the discriminator feedback on
    these images, the generator is then updated. Every epoch consists of multiple
    iterations and ends if the whole input data set was processed this way. It shall
    be mentioned that the losses were saved after every single iteration, whereas
    the Fréchet inception distance (FID) was only calculated after every epoch in
    order to avoid slowing down the training too much. Additionally, after every epoch
    a number of generated images based on fixed noise vectors was saved in order to
    visually analyze the training progress later on. Due to the computational effort
    needed, the image quality assessment was performed in a subsequent step.


