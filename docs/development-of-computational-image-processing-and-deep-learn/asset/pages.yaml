  md: '# ## 4.7 Microstructure image generation through generative adversarial network


    In the following, the results of the final DCGAN network are presented - from
    the actually generated images to quality evaluations of the network in the form
    of the loss plot to quality evaluations of the generated images in the form of
    FID calculations and nearest neighbor considerations with the two different metrics
    of ED and SSIM. The results of the following sections have all already been published
    in a paper [275].


    # ### 4.7.1 Generated images 7


    The DCGAN was trained for 75 epochs on 29,280 input images (cf. Section 3.8.2)
    with 128 images per batch corresponding to 228 iterations per epoch when dropping
    the last non-full batch (cf. Section 3.8.5). A comparison of randomly chosen real
    and generated images is shown in Figure 4.34.


    It can be observed that every generated microstructure is different. Generated
    images look mostly realistic (cf. orange-rimmed images in Figure 4.34) including
    fibers and fiber bundles. The overall fiber orientation resulting from the flow
    in the compression molding process (cf. Section 4.5) is visible and the contrast
    and brightness varies between the images just as in the training images. There
    are, however, few images which show characteristics that are not represented in
    the input data set such as two dark border regions on opposite sides of the image
    (cf. violet-rimmed image in Figure 4.34). This phenomenon has to be a result of
    the combination of features from different images as in the original ones, at
    most one side displays this artifact related to the scan process. In general,
    the observed occurrence of dark border regions in the generated images can, for
    the most part, not be traced back to the DCGAN structure but is subject to the
    quality of the training data set. On the other hand, it should be'
