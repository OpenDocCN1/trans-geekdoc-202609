    # 2.2.2 Fiber length distribution


    The fiber length distribution (FLD) describes the amount of fibers as a function
    of their length in a sample volume. It plays an important role for the mechanical
    properties as described in Section 2.1, especially when including damage mechanisms
    [52]. Young’s modulus, strength, and impact behavior all improve with rising fiber
    length with the effect saturating at very high lengths or even decreasing in the
    case of high fiber volume contents [5]. It can be given as a probability density
    function f_l(l). Analogous to classical probability density functions, f_l is
    non-negative, integrable and normalized in such a way that the total integral
    takes the value one:


    ```

    \int_0^\infty f_l(l)dl = 1. \quad (2.36)

    ```


    A two-parameter Weibull distribution is mostly used for modeling the fiber length
    distribution [65–68], which is defined as


    ```

    f_l(L) = \frac{m}{n} \left( \frac{l}{n} \right)^{m-1} \exp\left[-\left( \frac{l}{n}
    \right)^m \right]; \quad l > 0, \quad (2.37)

    ```


    with n and m as scale and shape parameters and l as the fiber length.


    Alternatively, length histograms are used in practice, in which fibers inside
    of defined intervals of length are summed up.'
