    a non-linear filter used to blur images while preserving object edges. The filter
    owes the preservation of edges to the fact that, unlike the Gaussian blur, the
    weights depend not only on the Euclidean distance of the pixels so not only on
    their geometric closeness but also on their photometric similarity (e.g., range
    differences, such as color intensity, depth distance, etc.). It prefers near values
    to distant values in both domain and range. Different filter kernels can be used
    for both the closeness function \(c(\xi, x)\) and the similarity function \(s(\phi,
    i)\). Gaussian functions of the Euclidean distance between their arguments are
    widely used for both. So bilateral filtering denotes the combined domain and range
    filtering and delivers an output image \(o(x)\) for an input image \(I(x)\) as


    ```

    o(x) = k^{-1}(x) \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} I(\xi)c(\xi,
