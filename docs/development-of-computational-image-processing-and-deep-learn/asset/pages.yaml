    # ## 2.3.3 Artifacts


    CT images are subject to a variety of artifacts originating from different reasons
    [144]. There are, e.g., partial volume artifacts, appearing when an object boundary
    is not located exactly at the edge of a detector element leading to an averaged
    intensity in these elements and a blurred object boundary. Another well-known
    artifact is that of beam-hardening. This effect refers to the non-monochromatic
    energy spectrum of the radiation changing along the path. Low-energy, i.e., soft
    X-rays are absorbed more than high-energy, hard X-rays, so that the beam hardens
    while going through the object. This can result in streaking artifacts or cupping
    artifacts that will cause the middle of the image, which is normally the area
    around the rotation axis, to decrease in gray value and hence appear darker. Often
    objects are set in the beam in slight angular offset to the rotation axis due
    to this artifact. There are various other artifacts like ring artifacts, motion
    artifacts, etc. which shall not be explained in detail here as this work is not
    centered around the making of CT scans but rather around their FRP-specific analysis
    and evaluation but can be explored in appropriate literature, like [144].


