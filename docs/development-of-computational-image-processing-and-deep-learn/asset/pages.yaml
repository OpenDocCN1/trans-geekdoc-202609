  md: '# 5.3 Fiber length distributions


    The results of the fiber length evaluation in Figure 4.15 and Figure 4.16 show
    an average fiber length of just over one millimeter. While this does not sound
    like much for a long fiber reinforced material, it corresponds to an aspect ratio
    of a good 150 for carbon fibers of 7 µm, which can certainly be counted as long
    fibers. However, the fact that the median is less than half as large as around
    half a millimeter raised the question of the correct means of a distribution function.
    In fact, depending on the choice of the mean value in a model, significant differences
    can be achieved. This would be a separate mathematical topic that shall not be
    addressed here.


    It was also noticeable that the average fiber lengths in the charge area appeared
    to be smaller than in the flow area. This is consistent with the results of Radtke
    [321]. He also found that the fiber length distribution at the end of the flow
    path showed a shift towards longer fibers. Such an effect is also observed directly
    behind the insertion area, which corresponds more to the position of the specimens
    FLD10 - FLD12 in this study. According to Radtke, the proportion of fine fibers
    at the end of the flow path is lower than in the charge area, which means that
    greater average fiber lengths are observed towards the end of the flow path. Longer
    fibers offer more interaction with the melt and are therefore entrained for longer.
    This is consistent with the fiber length distributions in Figure 4.15.


    It is also noticeable that the average lengths increase with the size of the specimens.
    This is not surprising, as longer fibers are cut off at the edge of smaller specimens
    and it is therefore statistically more likely to have fewer long fibers in the
    specimen. These long fibers have a strong influence on the average fiber length
    and therefore raise the average. As this was no longer quite so clearly visible
    between the medium-sized and large specimens, it was assumed that this effect
    is saturated at around 25 mm side length (due to the fact that hardly any fibers
    are longer than this side length). For this reason (and also because, for example,
    the diameter of the round samples for commercial FVC determination'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'by ashing was also 25 mm), this size was used for the FVC investigation and
    retained for the microstructure GAN.


    In principle, the average fiber lengths are rather short compared to the results
    of Radtke [321] and Tröster [320]. However, both used glass fibers and it is assumed
    that the thin and fragile carbon fibers are cut/destroyed much more easily by
    the screw extruder and the shearing. Tröster also explains that a maximum stiffness
    of 95 % is already achieved with a fiber length of approximately 1 mm [320], see
    also [5, 336]. In systematic studies of the influence of fiber length, Thomas
    and Vlug even found no dependence of stiffness on fiber length above 0.5 mm as
    long as FVC and FOT are the same [337]. However, the influence on the strength
    is still existent, otherwise there would be no need for long fibers.


    # ## 5.4 Fiber orientation distributions


