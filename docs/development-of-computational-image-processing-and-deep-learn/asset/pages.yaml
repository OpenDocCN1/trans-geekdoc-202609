- pgno: 90
  md: '# Current state of research on tensor interpolation 1


    The problem of tensor interpolation can be theoretically avoided for fiber orientation
    tensors, compared to, for example, stress and strain tensors, by switching to
    the scalar distribution function. It must be mentioned, that this switching is
    not unique, as the second order FOT contains too little information. Nevertheless,
    the function can be recovered under assumptions and a subdivision into discrete
    directions and subsequent interpolation would equal a Euclidean interpolation
    of the scalar-valued function $\bar{\Psi}$. In fact, this corresponds exactly
    to averaging the tensor components (with weights depending on distance). This
    can be explained by the fact that an integral is a linear mapping. However, this
    standard method led to a kind of "artificial" isotropy, which is shown by a change
    of shape in the manner of a rounding in the representation form of tensor glyphs.
    This does not necessarily seem to represent a useful averaging, as this issue
    of so-called tensor swelling arose both in the field of medical technology when
    interpolating diffusion tensors from MRI images [122–124] and in the case of FOT
    mapping in process simulation applications [125]. This swelling effect is due
    to non-monotonic interpolation of the tensor determinant and the Euclidean method
    does not preserve the positive definiteness. It was part of scientific discussions
    whether a more isotropic tensor as an interpolation between two anisotropic tensors
    that point in different directions still constitutes a reasonable behavior of
    fibers. It would imply that in a region of changing flow direction first some
    fibers turn and others stay in the original direction until most are turned in
    the end. The opposite idea that most turn first a bit and later completely into
    the new direction would rather be indicative of tensors in the center to be not
    significantly less anisotropic than the two next to it. As a reference solution,
    the first method for tensor interpolation implemented and used in this thesis
    is this Euclidean interpolation, which will be called component averaging (CA)
    from now on.'
  merge: -1
  img_proc: true
