- pgno: 130
  md: 'ones used in the networks in this work are briefly explained below. In some
    cases, the use of a certain type of layer also determines the name of the network,
    for example, an ANN that has one or more convolutional layers becomes a CNN.


    **Dropout layers** Introduced by Hinton et al. in 2012, dropout layers can be
    used in ANNs to prevent overfitting and achieve improved robustness against choices
    of network architecture [210]. Dropout layers refer to a defined percentage of
    randomly selected neurons being ignored in an epoch, removing all connections
    from and to other units temporarily. The approach was partly motivated or at least
    linked to the fact that more advanced organisms have evolved due to the breaking
    up of sets of co-adapted genes during sexual reproduction compared to asexual
    reproduction increasing the robustness of the remaining units over time [211].
    An example is given in Figure 2.24.


    ![](img/332d06e0447dbfd85ea7d2fb553468f3_130_0.png)


    Figure 2.24: Model of a thinned dropout neural network, where crossed out single
    units are dropped. Based on [212].


    One drawback of dropout is the two to three times increased training time due
    to its stochasticity. It mainly stems from training a different random architecture
    each time as the dropped out units change every iteration. As for every network,
    ANNs with dropout layers require extensive hyperparameter tuning with increased
    demands for network size, hence layers, higher learning rate, etc. [212]'
