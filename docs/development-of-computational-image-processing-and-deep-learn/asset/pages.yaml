    # 2.1.2.3 Microscale/Multiscale modeling


    When modeling on the microscale, on the other hand, every fiber, the matrix, each
    void and the geometric arrangement has to be considered. For this purpose, RVEs
    are used at the micro level (µm). While this is possible on a small scale, with
    glass fibers being between 14 µm and 20 µm in diameter and carbon fibers between
    5 µm and 7 µm, there can be so many fibers in just one square millimeter that
    this is hardly a realistic approach computationally when considered at the component
    level. If an RVE is used for homogenization and coupled with macroscale modeling
    (mm), this is considered multiscale modeling. These unit cells in microscale modeling
    should be chosen to be as small as possible but as large as necessary. This means
    that they should optimally represent the global, effective material behavior and
    not only local features, while at the same time being small enough for efficient
    computations. The choice of the size of this RVE is therefore challenging, especially
    for DiocoFRP. The material properties can then be homogenized within the RVE.
    The macroscopic material behavior can be obtained by assembling a component in
    a finite element (FE) model recurrently from copies of this RVE. [5]


    Depending on the microstructure, multiscale modeling can also mean using a material
    unit discretely on the mesoscale. Using the example of SMC, which has a typical
    bundle structure, the fiber bundles can be segmented as a unit from CT images
    [14]. This bundle-matrix structure can then be the basis for'
