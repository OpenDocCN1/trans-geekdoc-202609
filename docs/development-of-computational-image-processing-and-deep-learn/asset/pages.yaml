- pgno: 174
  md: 'The subsequent convolutional layer that extracts features from the input data
    is followed by a max-pooling layer that downsamples the output of the convolutional
    layers to reduce the dimensionality of the data and capture the most important
    features. In this case, a 2 x 2 x 2 max-pooling layer follows the convolution,
    where out of the 2^3 = 8 voxels only the largest value is passed on to the next
    layer. This way, an 87.5 % reduction of data is achieved without a major loss
    of relevant information since for feature extraction, the precise location of
    certain features is less relevant. Furthermore, the strongest features are enhanced
    more as only the highest value inside the kernel area is passed on.


    After the convolutional and max-pooling layers, the output is passed through several
    dense layers with ReLU activation function. In the case of this study, where FVC
    percentages are evaluated, any negative values are implausible and get filtered
    out automatically this way. These layers enable the model to learn complex relationships
    between the input and output. Dropout layers are added after each dense layer
    to prevent overfitting.


    The further one advances into the network during the analysis, the less relevant
    spacial information becomes, since the ultimate objective is to compute a single
    scalar, that describes the entirety of a scan. A Global Average Pooling Layer
    transforms the 3D output of the dense layers into a single-row vector. Its dimensionality
    corresponds to the amount of feature maps which the feature extraction stage feeds
    forward. This technique and the choice of Global Average vs. Global Max Pooling
    was inspired by Zunair et al. [290] and improved the performance of the CNN.


    Finally, the output layer is a dense layer with a sigmoid activation function.
    Its output represents the predicted FVC of the CT scan.


    The final network architecture can be seen in Figure 3.17. The parameters that
    define the shape of all layers used were determined using parameter sweeps, which
    are discussed in the Network optimization paragraph below. The graphic was made
    with the help of the latex code published in [291].'
