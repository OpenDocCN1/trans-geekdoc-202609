  md: 'Described by van Ginkel [121] as a way to analyze orientation in 3D images,
    Krause et al. [80] used a structure tensor based approach first for orientation
    analysis of FRP in 2010. The structure tensor $S$ is composed of the dyadic product
    of the so-called Gaussian derivative $\nabla I_\sigma(x)$ [80] defined as


    ```

    \nabla I_\sigma(x) = \nabla(K_\sigma * I)(x),\n(2.60)

    ```


    which can already be seen in Equation (2.41). It consists of the partial derivatives
    of the function $I$ combined with a Gaussian blur $K_\sigma$ in a fixed window
    with width of $\sigma$. The Gaussian derivative is a regularization, as the computation
    of gradients without it is ill-posed [80]. The application of a Gaussian blur
    is the same as convolving the image with a Gaussian function and will be revisited
    in Section 2.3.4.1 on filters. Subsequently, both Krause and Pinter use an additional,
    not mandatory Gaussian smoothing $K_{\rho_1}$ with the standard deviation $\rho_1$
    as additional regularization leading to the final structure tensor $J_{\rho_1}$:


    ```

    $J_{\rho_1}(x) = K_{\rho_1} * (\nabla I_\sigma \nabla I_\sigma(x)^T)(x). \quad
    (2.61)$

    ```


    Pinter et al. [81] point out that the second blurring parameter $\rho_1$ has to
    be larger than the first one, $\sigma$, that is used for the derivative. The resulting
    structure tensors are flat ellipsoids in the case of fiber-like structures that
    are aligned perpendicular to the local fiber orientation, see Figure 2.10. The
    fiber orientation vector is finally calculated by evaluating the smallest eigenvalue
    of the structure tensor and its corresponding eigenvector.


    The resulting fiber orientation vectors are further processed in MATLAB to orientation
    tensors, pseudocolor images, etc., which will be explained in the Methods (cf.
    Section 3.6).'
