  md: '# Mori-Tanaka


    As Eshelby deduced the above expressions only for a single ellipsoidal inclusion,
    no interactions between those inclusions are allowed for and hence the stress
    in the inclusion can be caused by the matrix only. As this is not the case in
    a composite, Mori and Tanaka [42] extended this model to a two-phase system with
    interactions between the inclusions, resulting in one of the most well-known mean
    field homogenizations. [5]


    A new tensor of fourth-order T is introduced as an adaption of N, leading to


    ```

    ε_inclusion = Tε_m. (2.29)

    ```


    T is given depending on N and the volume fraction vf as


    ```

    N = [(1 - vf)I + vfT]⁻¹T. (2.30)

    ```


    If the volume content of the fibers is zero, T and N are equal. The stiffness
    tensor of the composite can then be calculated as


    ```

    C_c = C̄ = C_m + vf((C_f - C_m)T). (2.31)

    ```


    The fiber volume content and the aspect ratio are already taken into account in
    this expression. There are subsequently two options for also taking the fiber
    orientation into account if it is not a unidirectional material. The reference
    tensor H^0 (see Section 2.2.3.1 and [43]) can either be multiplied subsequently
    after the stiffness determination. This corresponds to a linear dependency. Alternatively,
    the orientation determination can already be coupled directly to the tensor T,
    which no longer complies with linearity in the dependency and, to the author''s
    knowledge, was introduced for the first time by Benveniste [44]. More details
    can be found in the works of Bauer and Böhlke [45] and Benveniste [44]. The'
  merge: -1
