- pgno: 40
  md: '# 2 State of the Art


    The State of the Art first describes fiber reinforced polymers in general and
    their mechanical description. Then, the possibilities for the quantitative description
    of the microstructure of discontinuous fiber reinforced polymers are shown. After
    a section on computed tomography (CT) and known possibilities for processing CT
    images, the final section introduces artificial intelligence, and in particular
    artificial neural networks (ANNs), convolutional neural networks (CNNs) and generative
    adversarial networks (GANs).


    # 2.1 Fiber reinforced polymers


    Composites are a class of materials characterized by the combination of two components
    that typically differ decisively in their properties. The desired optimum result
    is a synergy effect resulting in the composite material to perform better than
    the sum of the individual constituents.[5] For quite some time now, there have
    been various examples of composite materials that are used on a daily basis, such
    as ferroconcrete in construction or laminated composites such as plywood. In this
    context, FRP represent a special group whose further scientific development was
    mainly sparked by their enormous potential in lightweight design. Owing to their
    high density-specific strength and stiffness, FRP are used in the transport industry
    (automotive, aeronautical), sports industry as well as in the energy sector, e.g.,
    in wind turbine blades. They consist of fibers with high strength and stiffness
    embedded in a typically low-density polymer matrix which gives the fibers a position
    structurally, transfers the load to them [5] and protects them from environmental
    influences [6]. Typical fiber materials'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'include glass with relatively low cost and high strength, carbon, which is
    even stronger and stiffer, but also significantly more expensive, or Aramid, and
    now increasingly natural fibers such as flax or hemp [5]. The thin fiber shape
    is not chosen arbitrarily. According to the weakest link theory, the so-called
    size effect describes the statistical decrease of strength-reducing defects in
    a smaller material volume [7, 8], as well as the reduction of the size of these
    defects, which is also the basis of the statistical theory of brittle fracture
    dating back to Weibull [9]. The matrix material can either be a thermoset or a
    thermoplastic material (in rare cases also elastomers). While the former was used
    more often in engineering, load-bearing applications in the past due to their
    high strength and stiffness and their minor sensitivity towards environmental
    aspects, the use of the latter is increasing in recent years [10]. Without covalent
    bonds between the chains, thermoplastics exhibit lower effective mechanical properties
    [5]. Furthermore, they are susceptible to temperature and - dependent on the exact
    substance - also to moisture, albeit to a more varying degree [11]. However, they
    are meltable, which enables them to have superior recycling potential, and they
    can be manufactured rapidly, which reduces production costs [10].


    # ## 2.1.1 Fiber reinforcement architectures


    Fibers can be incorporated into the matrix in a variety of ways. The dimension
    and shape of the reinforcing phase is decisive for the mechanical properties,
    and each type of reinforcement is also directly related to the process developed
    for it. [5]


    # ### 2.1.1.1 Continuous (Co) fiber reinforcement


    Continuous fiber reinforcement signifies the deliberate insertion of fiber rovings
    in a specific direction, where the length of the fibers usually exceeds or equals
    that of the part. For the latter reason, it is often also referred to as endless
    fiber reinforcement. Continuous fiber reinforced polymers (CoFRP) are normally'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'made up of different single layers, each with a defined orientation. There
    are pre-impregnated semi-finished products, which are usually available in sheet,
    tape or strand form. These include prepregs such as unidirectional (UD) tapes,
    which, apart from layers with a 0° orientation, also always have layers with a
    45° or 90° orientation. There are also pure fiber semi-finished products, so-called
    textiles (sometimes also referred to as fabrics), which are not pre-impregnated.
    In the latter case, a distinction is made between the widespread non-crimp fabrics
    and woven, braided and knitted fabrics. Both types of semi-finished products can
    ultimately be stacked in so-called laminates. By selecting the arrangement of
    plies, the material behavior can be tailored to the main load directions. As a
    result, it can range from almost unidirectional to quasi planarisotropic properties.
    [5] All continuously reinforced polymers have in common that they exhibit outstandingly
    good specific mechanical properties in comparison to DicoFRP and a less complex
    and thus easy-to-characterize microstructure, but in return they offer little
    design freedom [12].


    # 2.1.1.2 Discontinuous (Dico) fiber reinforcement


    In the case of discontinuous fibers, either a cut to a defined length below the
    component length takes place in the process, or the fibers are cut by shearing
    in extruders to a length distribution that tends to be dominated by relatively
    short fibers compared to CoFRP. They therefore typically have a more complex,
    heterogeneous microstructure, while both single fibers [13] and fiber bundles
    [14] may be encountered. In general, DicoFRP exist with thermoplastics and thermosets.
    The best known type of the latter are so-called sheet molding compounds (SMC).
    SMC is a typical representative of a bundle structure [14]. Discontinuous fiber
    reinforcement can be further subdivided into short fiber and long fiber reinforced
    polymers, abbreviated as SFT and LFT for thermoplastics [5]. The distinction is
    made on the basis of the aspect ratio $a_r = \frac{l}{d}$ (length to diameter),
    with a value below 100 still considered a short fiber material and a value above
    100 a long fiber material [15].'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Long fiber reinforced thermoplastics (LFT)


    LFTs are characterized by their good processability and the possibility of economical
    production of larger batches compared to CoFRP, as well as typically better mechanical
    properties than SFT due to their longer fibers [5]. Together with the possibility
    of recyclability by melting down the thermoplastic, this group presents a particularly
    interesting combination of challenges and opportunities, which is why they are
    subject of this work. They are typically produced in extrusion compression molding
    processes. These start with the plastification of the polymer-fiber mixture in
    an extruder and the subsequent placement of the produced plastificate/initial
    charge in a mold cavity in a press. It is then followed by the closure of the
    mold resulting in the final product, e.g., in the shape of a plate, which was
    mostly used in this work. There is another distinction between the so-called LFT-G
    (granulate) and LFT-D (direct) process. The two processes differ in that semi-finished
    products, i.e. pellets containing thermoplastic matrix and long fibers, are processed
    in the LFT-G process. The LFT-D process, on the contrary, which is the production
    method of the material used in this dissertation, is characterized by the in-line
    processing of thermoplastic granulate and the direct introduction of continuous
    fiber rovings into the polymer melt (cf. Figure 2.1).


    The advantages of the LFT-D process are the independence of prefabricated semi-finished
    products and the associated cost benefits, high output capacities and flexibility
    in fiber and polymer adaptations [18]. Thermoplastics like polyethylenerephthalat
    (PET), polycarbonate (PC), polypropylene (PP) or acrylonitrile butadiene styrene
    (ABS) can be used in this process. In this work, polyamide 6 (PA6) was the thermoplastic
    matrix material used.


    # 2.1.1.3 Continuous discontinuous (CoDico) fiber reinforcement


    In order to profitably exploit the contrasting advantages of continuous and discontinuous
    fiber reinforced polymers (cf. Table 2.1), the idea of continuous'
