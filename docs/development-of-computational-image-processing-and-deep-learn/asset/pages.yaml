- pgno: 131
  md: '**Batch normalization** Batch normalization, as proposed by Ioffe and Szegedy
    in 2015 [213], refers to the normalization of the input of every layer (and repeating
    so for every mini-batch) in a network as opposed to only the input layer. It can
    be included in backpropagation [213]. Batch normalization allows the use of higher
    learning rates, accelerating the training process up to 14 times [213], as one
    gets rid of the changing distribution of each layer’s inputs. It also decreases
    the importance of careful choice of initial hyperparameters. While being comparable
    to the impact of dropout layers, for which they can serve as substitute, its additional
    regularization effect may eliminate the need of dropout layers altogether in some
    cases. [213, 214]


    **Convolutional layers** Convolution is continuously defined as follows:


    ```

    $(f * g)(t) := \int_{-\infty}^{\infty} f(x)g(t-x)dx \quad \text{[215].} \quad
    (2.118)$

    ```


    The convolution of two functions $f$ and $g$ can be understood as mirroring of
    function $g$ along the y-axis, subsequently adding a time offset $x$ and lastly
    sliding function $g$ from $-\infty$ to $\infty$. It passes function $f$ on the
    way. Wherever the two functions intersect, the integral of their product, so the
    area under function $f$ weighted by function $g$, is evaluated. Convolution is
    commutative.


    In the context of neural networks, convolutional layers, as fundamental component
    of any CNN, introduced by Le Cun et al. [216], are used to perform so-called feature
    extractions. They often consist of a combination of linear convolution and nonlinear
    activation functions. In this regard, a discrete definition of convolution is
    applied (changing the integral to a sum and working on finite sequences). It can
    be understood as a small array of numbers, called kernel or filter, sliding across
    the input tensor. By multiplying every entry of the kernel and the input element-wise
    and subsequently summing up these products, one obtains the so-called feature
    map (cf. Figure 2.25).'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/332d06e0447dbfd85ea7d2fb553468f3_132_0.png)


    Figure 2.25: Schematic description of a convolutional layer in a neural network.
    A filter of a specific kernel size, in this case 3 x 3 is applied on the original
    image to obtain a so-called feature map. The feature map carries its name due
    to the fact that the most important features of an image are kept or even enhanced
    with this method, while the dimensions decrease compared to the original image.


    Especially if this is repeated for different filter kernels, the characteristics
    or features of the input image are enhanced and captured. The output of the convolutional
    layer typically has decreased dimensions. In the case that this is unwanted, so-called
    padding, typically zero padding, which signifies the addition of rows and columns
    of zeros on each side of the input tensor, is applied in order to keep the same
    in-plane dimension throughout the convolution operation. If in contrast, the size
    reduction is desired, another parameter influencing the final output size, the
    stride parameter, comes in play, which defines the distance between two consecutive
    kernel positions. [217] While setting a stride larger than one can reduce overlap,
    it can also lead to checkerboard artifacts, especially if the size of the output
    window and kernel are not a multiple of the stride [218]. The alternative of applying
    pooling layers for the further reduction of output size will be discussed in the
    next paragraph.


    The final output size can be calculated by


    ```

    O = 1 + \frac{N + 2P - F}{S}, \quad (2.119)

    ```


    with the image dimension $N \times N$, the filter dimension $F \times F$, stride
    $S$ and thickness of padding $P$ [219]. As an example, in the case in Figure 2.25,
    with $N = 6, P = 0, F = 3$ and $S = 1$, the output size of 4 results.'
