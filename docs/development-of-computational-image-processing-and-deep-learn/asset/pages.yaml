  md: 'The output vector $\boldsymbol{h}^{(l)}$ of a hidden convolutional layer can
    be calculated analogously to the equations for MLPs and using the discrete definition
    of convolution (cf. Equation (2.103)) by


    ```

    $$h_i^{(l)} = \sigma \left( \sum_{i \in M_j} h_i^{(l-1)} * W_{ij}^{(l)} + b_j^{(l)}
    \right), \quad (2.120)$$

    ```


    with a selection of input maps $M_j$ [220, 221]. The weights $W_{ij}$ are updated
    through backpropagation and stochastic gradient descent just like the previously
    introduced fully connected layers [221] and the kernel values are the only parameters
    to be learned (while their size, padding, stride, etc. are hyperparameters that
    are set in advance) [217]. The inverse operation is used in some CNNs and also
    in deep convolutional generative adversarial networks (DCGANs); the layers are
    then called deconvolutional layer.


    **Pooling layers** Pooling layers are used to decrease the in-plane dimensionality.
    They further introduce a higher translation invariance concerning small shifts
    and distortions in images, and decrease the number of subsequent learnable parameters.
    It shall be stressed that in contrast to a convolutional layer there are no learnable
    parameters in any of the pooling layers. [217] Some common, self-explanatory pooling
    operations that were used in the CNN in this work are depicted in Figure 2.26,
    Figure 2.27 and Figure 2.28.


