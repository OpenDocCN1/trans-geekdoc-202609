    # 2.2 Quantitative metrics of DicoFRP microstructures and their determination


    Over time, various parameters have been developed for the quantitative description
    of the complex, heterogeneous microstructure of discontinuous fiber reinforced
    polymers. These are outlined below and established methods - whether destructive
    or non-destructive, experimental or by image evaluation - that lead to the determination
    of these quantities are described.


    # 2.2.1 Fiber volume content


    The fiber volume content (FVC), often also referred to as fiber volume fraction
    (FVF) and in this work denoted as $v_f$, determines the proportion of fibers in
    the total volume of the material. In general, a higher fiber concentration implies
    a higher elastic modulus, as well as higher strength and better impact behavior,
    although the effect on the latter two typically inverses at some point (at least
    for DicoFRP) due to the formation of non-impregnated bundles [5].


    # 2.2.1.1 Experimental destructive methods for FVC determination


    A first starting point to get an approximate FVC of a plate/part is, of course,
    the value nominally set in the process during fiber feeding. However, since this
    information is quite inaccurate and the fiber content varies across a plate due
    to the process, a measurement of the FVC of the finished material is of interest.
    Typically, a smaller sample is cut out of a part and the fiber volume content
    is'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'measured destructively by removing the matrix and then measuring the fiber
    weight compared to the total weight of the sample. This method is also known as
    thermogravimetric analysis (TGA). The polymer is most commonly removed by incineration,
    also known as pyrolysis, as it is the most straightforward approach [5]. The temperature
    and time profile of the incineration process must be adjusted individually for
    each polymer, exemplified by Rohde et al. [46] for polypropylene. The decisions
    also depend on the time available and whether the fibers are measured further
    afterwards and therefore may not become more brittle or sintered. For glass fibers,
    this works well in principle, but for carbon fibers, which are the most frequently
    treated in this work, problems arose because the carbon fibers can be attacked
    by the burning process. If the specimens were incinerated too short or at too
    low a temperature, the matrix was not yet completely dissolved and the fibers
    were therefore still attached to each other. However, if the specimens were processed
    longer or at higher temperatures, the fibers were already visibly attacked. Due
    to the experienced difficulties of pyrolysis for CFRP, this method was not applied
    further after initial tests. Alternatively, the matrix can be dissolved using
    acid. Here too, experience for certain polymers plays a role in the exact test
    procedure (choice of different acids, their concentration, time periods and temperatures).
    The exact method and the parameter values will follow in the Methods section.
    Subsequently, when the fibers are separated, they are weighed with a high-precision
    scale and divided by the total mass \(m_{tot}\) of the sample to obtain the fiber
    mass content:


    ```

    \(w_f = \frac{m_f}{m_{tot}}.\) \quad (2.32)

    ```


    To determine the fiber volume content on this basis, the densities of the constituents
    and the trivial relationship \(m_m = m_{tot} - m_f\) must be used, leading to'
