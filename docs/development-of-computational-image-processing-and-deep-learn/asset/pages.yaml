- pgno: 65
  md: 'parameter from a 3D CT image makes the investigation more efficient instead
    of going to the further expense of pyrolysis/acid dissolution. Furthermore, in
    case of an experimental FVC determination, a round or rectangular sample between
    10 mm and 30 mm is usually processed as a whole. This does not provide any information
    about the course of the fiber volume content along different axes. However, there
    is good reason to suspect that this is of particular interest with regard to the
    thickness of flat samples, e.g., to investigate the shell-core effect appearing
    in injection molding [5]. A low FVC on the outer surfaces of the specimen and
    thus a lower stiffness and strength could be decisive, especially for bending
    loads with maximum bending stress as tension or compression at the outermost edge
    of the cross-section. Theoretically, it is also possible to obtain 3D information
    on the FVC destructively by milling off thin layers and subsequent pyrolysis,
    which has already been done [5]. However, this procedure requires a lot of effort
    and measurement inaccuracies are particularly serious given the small amount of
    material and the potential fiber shortening due to the milling process. In addition,
    neither pyrolysis nor chemical dissolution are possible if natural fibers are
    involved, which are attacked by both.


    The method of choice from classical image evaluation would be global thresholding.
    One makes use of the different attenuation coefficients of the fibers and the
    matrix, which cause them to appear with different gray values in the CT image.
    Hence, a gray value as threshold is sought which divides the histogram of all
    gray values in the image exactly at the point, where the material, that the voxels
    represent, changes. The location of these voxels is not taken into account in
    the case of thresholding procedures. One can simply search for a threshold manually
    in commercial software such as ImageJ by creating a threshold and visually estimating
    how many fibers are detected. However, there is also a large number of so-called
    automatic thresholds that are calculated based on analytical considerations, like
    the Otsu threshold [47], the moment-preserving method by Tsai [48] or the mean
    threshold [49–51]. They are pre-implemented both in ImageJ as well as in image
    processing packages available for Python or C++. The computation of the most known
    ones are explained in Section 2.3.4.2. You can then divide the number of pixels/voxels
    detected as fibers by the total'
