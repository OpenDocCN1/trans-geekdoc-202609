    definite (SPD) tensors by glyphs (often ellipsoids) was used, which is a well-known
    concept in scientific visualization and could be found mostly for diffusion tensors
    [112–114] in the beginning. It is especially helpful for tensor field visualization,
    where a tensor is available at different points in a grid. The glyphs (sometimes
    also called icons) portrayed at each grid point are a symbolic parametric object
    to visually represent the features of the tensor it portrays [115]. Hence, the
    attributes of the tensors somehow have to be mapped to the parameters (or degrees
