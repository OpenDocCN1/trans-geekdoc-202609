  md: 'The loss function chosen is the MAE, which is defined as follows:


    ```

    $MAE = \frac{1}{n} \sum_{i=1}^{n} = \left| A_{jk(i)} - \hat{A}_{jk(i)} \right|,
    \quad (3.16)$

    ```


    with n being the number of samples, \( A_{jk(i)} \) being the value of the orientation
    tensor component at the sample location and \( \hat{A}_{jk(i)} \) being the predicted
    value of the orientation tensor component at that sample location. MAE was preferred
    as error metric over percentage error since many values (especially the off-axis
    and \( A_{33} \) components) are close to zero. Therefore percentage errors tend
    to become quite large. Additionally, outliers seem to be filtered out better by
    using MAE than by a quadratic error metric like root mean squared error which
    is more likely to result in overfitting and being biased towards outliers respectively.
    Additionally, a soft sign activation function is used in the model as it is able
    to calculate negative numbers and behaves differently in terms of saturation (compared
    to, e.g., the hyperbolic tangent) because of its smoother asymptotes (polynomial
    instead of exponential) [298]. However, this of course impacts the amount of epochs
    required for training as it does not saturate as quickly. The soft sign activation
    function is given as


    ```

    $o = \frac{i}{1 + |i|}, \quad (3.17)$

    ```


    where i is the input to the function and o is the output of the function. Furthermore,
