    # 2.2.2.2 Computational non-destructive methods for FLD determination


    Multiple algorithms have been developed for the non-destructive measurement of
    fiber lengths from µCT images. To the author''s knowledge all of them have been
    developed for the example of glass fiber reinforced polymers.


    A method for the measurement of the length of short fiber reinforced polymers
    has been introduced by Salaberger et al. [71] in 2011, where they present two
    concepts. The first procedure works by accurately detecting a starting point and
    an end point of every fiber. Therefore, an anisotropic diffusion filter was applied
    first to reduce noise without blurring any edges. The image is then binarized
    by applying the Otsu threshold in order to isolate the fibers from the matrix.
    In order reduce the information per fiber to their medial axis and therefore only
    a single line of voxels, a binary thinning is conducted. This process is also
    called skeletonization [72]. In the following, a cluster analysis is performed,
    which has the purpose of dividing touching fibers, i.e. regions with clustered
    fiber-associated voxels, into individual objects. This method was introduced by
    Pfeifer [73]. Clusters are defined as a voxel that has more than two neighbors.
    They are recognized morphologically. The cluster information is then used for
    the fiber tracing, where the fibers are followed to their endpoint or until a
    cluster is reached. If detected segments fall below a user-defined length, they
    are assigned to image noise and are not evaluated as fibers. Subsequently, all
    detected segments are analyzed and identified as fibers or merged into fibers
    in the event of a cluster encounter. The joining decision is made by analyzing
    the angles of all segments in a cluster. Salaberger et al. chose a kink angle
    of 160° and a cluster distance of 14 µm, which corresponds to the approximate
    fiber'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'diameter as parameters of this algorithm. Subsequently, when all fiber paths
    are found, the length determination itself can be performed.


    Since straight fibers can be assumed in the case of short fibers, the length of
    the $i$th fiber is simply determined by the Euclidean distance of the start point
    $x_{i1}, y_{i1}, z_{i1}$ and end point $x_{i2}, y_{i2}, z_{i2}$ of the fiber as


    $l_i = \sqrt{(x_{i2} - x_{i1})^2 + (y_{i2} - y_{i1})^2 + (z_{i2} - z_{i1})^2}$.
    [13] (2.38)


    As the second concept presented by Salaberger et al. [71] is similar to the approach
    by Teßmann et al. [74] presented in the next paragraph, it will not be described
    in detail in this work. It works directly on the gray value image without binarization
    and requires the detour via the determination of the fiber orientation by calculating
    the Hessian matrix and analyzing their eigenvalues. The Hessian matrix is a measure
    of the local curvature of a 2D/3D image. While originally being used in order
    to detect valleys and ridges in topology problems [52], Daniels et al. [75] first
    implemented a 3D Hessian matrix for the evaluation of local orientations in volumetric
    images in 2006. Mathematically it is defined as the square matrix of the second
    order partial derivative of the image $I(x)$:


    $$H(x) = \nabla^2 I(x) = \begin{bmatrix} \frac{\partial^2 I}{\partial x^2} & \frac{\partial^2
    I}{\partial x \partial y} & \frac{\partial^2 I}{\partial x \partial z} \\ \frac{\partial^2
    I}{\partial y \partial x} & \frac{\partial^2 I}{\partial y^2} & \frac{\partial^2
    I}{\partial y \partial z} \\ \frac{\partial^2 I}{\partial z \partial x} & \frac{\partial^2
    I}{\partial z \partial y} & \frac{\partial^2 I}{\partial z^2} \end{bmatrix}.$$
    (2.39)


    In addition to the local orientation, the gray value distribution across the cross
    section of a fiber is taken into account. It should roughly match a Gaussian distribution
    perpendicular to the axial direction and hence show the highest gray value in
    the center of the fiber. Thereby, one can reduce the fibers to their center voxels.
    This dataset can then be examined analogously to the'
