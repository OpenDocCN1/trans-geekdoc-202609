  md: 'However, if you look at the tensors of Plate 1 (cf., e.g., blue tensors in
    Figure 4.24), you can see that the A22 component is also dominant in some cases
    and not all tensors are strongly aligned in the direction of flow. This difference
    is caused by the different specimen sizes. The 10 mm × 10 mm large specimens of
    Plate 1 cover very small, local areas where a fiber bundle part can sometimes
    be oriented against the flow direction and this is not compensated by enough other
    fibers and fiber bundles that are oriented "normally". An A11-dominant orientation
    can therefore certainly be assumed, as the results of Plate 3 (and 4 and the hybrid
    one) are to be regarded as more generally valid. However, as a starting scenario
    for the tensor interpolation, this rather complex state of Plate 1 was not undesirable
    in order to test the methods for difficult cases.


    It is also noticeable that all the orientation tensors/distributions measured
    over an entire specimen are almost planar states. The A33 component is always
    below 0.1 (in the case of Plate 3 even below 0.01, cf. Figure 5.4). This was also
    to be expected due to the thicker plastificate, the thinness of the final plate
    and the resulting flow path.


    # 5.4.2 Orientation behavior across thickness


    Figure 4.19 shows curves of the main components of the fiber orientation tensors
    over the thickness of different specimens. For the carbon fiber reinforced specimens,
    similar plots of the main components were found for the same specimen positions
    as for the glass fiber reinforced specimens. Slight differences at the edge of
    the thickness may also be due to slightly different cuts of the scans of the samples.
    Cutting away the unevenness at the edges correctly without taking away too much
    of the specimen is challenging. In contrast, what clearly differs are the curves
    of different specimen positions; especially the curves of charge specimens and
    flow specimens. The curves of flow specimens were relatively predictable with
    constant values across the thickness and a strong A11 component. In contrast,
    the A11 component of the specimens in the charge region drops sharply at both
    edges and the A22 component increases there.'
