    A much-investigated method is the orientation interpolation via quaternion. Quaternions
    as described by Hamilton extend the complex number system and are usually represented
    in the following form:


    ```

    q = a + bi + cj + dk with (2.63)

    i^2 = j^2 = k^2 = ijk = -1 (compare complex numbers).

    ```


    The result is a four-dimensional number system (mathematically: a vector space)
    with a real part consisting of one real component and an imaginary part consisting
    of three components, which is also called the vector part. Multiplication of quaternions
    is noncommutative. Quaternions allow in many cases a computationally elegant description
    of three-dimensional Euclidean space, especially in the context of rotations.
    By using quaternions instead of Euler angles the problem of Gimbal lock can be
    avoided and they are simpler to compose. Compared to the rotation matrices, quaternions
    are more compact, efficient, and numerically stable. Regardless, not all ambiguities
    can be circumvented. The unit quaternions q and -q represent the same rotation.
