  md: 'distribution function [86], which all describe the same property. First of
    all, it is assumed that the orientation of a fiber in any coordinate system can
    be described by a unit vector \(\boldsymbol{p} \in \mathcal{S}\), where \(\mathcal{S}
    = \{ \boldsymbol{p} \in \mathbb{R}^3 \mid \| \boldsymbol{p} \| = 1 \}\). \(\mathcal{S}\)
    denotes the two-dimensional unit sphere as the set of all possible directions
    of \(\boldsymbol{p}\). The components of \(\boldsymbol{p}\) can be determined
    using the angles that the fiber makes with the axes of the coordinate system (cf.
    Figure 2.6) using trigonometric functions as follows:


    ```

    p_1 = \sin \theta \cos \phi

    p_2 = \sin \theta \sin \phi

    p_3 = \cos \theta.

    (2.42)

    ```


    ![](img/332d06e0447dbfd85ea7d2fb553468f3_75_0.png)


    Figure 2.6: Coordinate system and fiber with angles to the coordinate axes. Based
    on a TikZ library [87] but changed for the case at hand.


    The length of the vector is fixed, fulfilling


    ```

    p_i p_i = 1.

    (2.43)

    ```'
