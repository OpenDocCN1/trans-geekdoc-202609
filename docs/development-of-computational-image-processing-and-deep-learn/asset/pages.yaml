- pgno: 34
  md: '# # 1 Introduction


    At the beginning of this thesis, the motivation for the topic under discussion
    will be addressed, followed by the objectives of this work and a brief outline
    of the thesis structure. Subsequently, the indication of the usage of texts/graphics
    from the author''s own publications is clarified.


    # ## 1.1 Motivation


    The European Green Deal obliges all EU member states to become climate-neutral
    by 2050 [1]. To this end, Germany has set an interim target of a 55 % reduction
    in greenhouse gas emissions by 2030 compared to 1990 levels in a federal climate
    protection law [2]. The transport sector makes a significant contribution to emissions
    through automobile traffic and aviation, which makes reducing emissions in these
    areas correspondingly important. In recent years, research has therefore been
    carried out in a wide variety of scientific fields, with lightweight design in
    particular contributing to this end in the field of materials science. This is
    due to the fact that the vehicle mass enters linearly into four of the five types
    of driving resistance and therefore plays a decisive role in fuel consumption
    [3]. This makes material classes that are relatively light, but at the same time
    offer convincing structural rigidity and strength for the safety of vehicle occupants
    and functional maintenance, particularly relevant. Fiber reinforced polymers are
    arguably the best known, relatively new material system in this context of weight-specific
    excellent mechanical properties [4], which is why a lot of research funding has
    been invested in their characterization and modelling.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'So-called continuous (Co) fiber reinforced components have higher stiffness
    and strength due to their microstructure (high anisotropy and high fiber volume
    content), whereas discontinuous (Dico) fiber reinforced components are faster
    and easier to manufacture and offer a high degree of design freedom. The combination
    of both Co and Dico to synergistically exploit the advantages of both material
    classes is the central topic of the International Research Training Group (IRTG)
    2078, within the framework of which this doctoral thesis was written. It was funded
    by the German Research Foundation (DFG). Dico material shows a heterogeneous microstructure,
    the characterization of which is essential for understanding and simulating the
    material behavior. Therefore, the project C2 of the IRTG 2078, in the context
    of which this work was created, aimed to analyze the microstructure of the Dico
    material used in each generation in more detail; in this third generation of carbon
    fiber reinforced polyamide 6. In addition to conventional macroscopic and microscopic
    destructive testing methods, computed tomography (CT) has emerged as probably
    the most important non-destructive, imaging characterization option. The 3D images,
    which allow the spatial differentiation of the constituents of the composites
    through different gray values, can provide important microstructure characterization
    parameters through image processing algorithms, such as fiber volume contents,
    fiber length distributions or fiber orientation distributions.


    While the development of evaluation methods for CT images of glass fiber reinforced
    polymers has progressed quite far, new challenges arise when using the stiffer,
    stronger but also more expensive carbon fibers as reinforcement material. Since
    polymers and carbon fibers are chemically quite similar and hence their attenuation
    coefficients differ little, the contrast in the images is comparatively low. In
    addition, carbon fibers usually have a diameter of 5 µm - 7 µm, which is below
    the image resolution when scanning reasonable sizes of specimens and also often
    below the possible image resolution of conventional CT devices in general. This
    makes it impossible to identify individual fibers and results in significantly
    higher noise in the images. Several problems arise from these conditions for this
    work leading to the research objectives described in the next section.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 1.2 Objectives of the thesis


    First of all, the choice of an appropriate specimen size for the CT investigations
    is not trivial. A sample that is too large limits the maximum possible image resolution
    accordingly, while a sample that is too small represents microstructural phenomena
    that are too localized and difficult to transfer to an entire macroscopic plate
    of this material. In addition, the image quality is reduced in the latter case.
    Assuming that a suitable specimen size was chosen, there are procedures such as
    gradient-based fiber orientation determination that are usable despite the fact
    that individual fiber segmentation is not feasible. Fiber orientation information
    is then obtained, for example in the form of fiber orientation tensors at discrete,
    small areas across such a plate. This provides one of the first major questions
    of this work: How to obtain a continuous fiber orientation tensor field from these
    fiber orientation tensors at specific points, which is suitable for comparison
    with orientation courses resulting from process simulations or for use in stiffness
    modeling for comparison with experimental results? This tensorial interpolation
    problem entails different properties and requires alternative methods compared
    to scalar interpolation. Regarding this issue, three different methods are tested
    that differ both in their basic concept (linear algebra vs. artificial intelligence
    (AI)) as well as in their implementation and computational/human effort.


    The evaluation of some variables, on the other hand, requires thresholding methods
    that do not work effectively for the scans of carbon fiber reinforced polymers,
    such as the determination of the fiber volume content. It is an open question
    whether thresholding methods can be adapted appropriately in order to work for
    low-contrast and non single fiber resolving images or whether switching to AI
    is a sensible option.


    Furthermore, the creation of artificial microstructures, intended to mimic these
    materials and often used in material modeling in the form of representative volume
    elements (RVE), is challenging with conventional packing algorithms.'
  merge: -1
  img_proc: true
- pgno: 37
  md: "Again, the suitability of AI in the form of so-called generative adversarial\
    \ networks is to be assessed.\n\nIn addition, the influence of the microstructure\
    \ of the initial charge/plasticate as the basis of the pressing process is also\
    \ to be evaluated. Specifically, the porosity and material orientation will be\
    \ investigated. Summing up, the following open research questions were assessed\
    \ in this work:\n\n+   1. How does information on small specimens relate to large\
    \ dimensions (cf. scale-bridging, up- and down-scaling), especially in relation\
    \ to the interpolation of fiber orientation tensors?\n+   \n+   2. How can characteristic\
    \ quantities like the fiber volume content (that require thresholding) be extracted\
    \ reliably from µCT images of carbon fiber reinforced polymers?\n+   \n+   3.\
    \ Can realistic µCT images be generated with generative adversarial networks in\
    \ order to save scan resources and do they have potential in the creation of representative\
    \ volume elements?\n+   \n+   4. Underlying all of those points is the question\
    \ as to whether conventional methods (linear algebra or classical image processing)\
    \ are superior or inferior to artificial intelligence based solutions.\n\n# ##\
    \ 1.3 Outline of the thesis\n\nIn Chapter 2 fundamental basics of fiber reinforced\
    \ polymer (FRP) material, their modeling, characteristic microstructure quantities,\
