    # Network training process


    The CNN described so far is initialized with random weights in all of its layers.
    Therefore, the initial predictions for the scans of the training set will also
    be random and are unlikely to show any causal relation to their actual FVC values.
    In order to tune the weights in a way that enables the network to make reasonable
    predictions, a training algorithm is used. The training can be divided into two
    main steps: model compilation and model fitting. During the model compilation
    step, the configuration parameters are set up. The chosen loss function for this
    task is Binary Cross Entropy (BCE). The BCE loss, also referred to as log loss
    or negative log probability, is defined as follows


    ```

    l(y, \hat{y}) = - \left( y \log(\hat{y}) + (1 - y) \log(1 - \hat{y}) \right),
    (3.7)

    ```


    with y being the true term (0 or 1) and \hat{y} being the predicted probability
    (between 0 and 1) [292, 293]. In the perfect case of the model exactly predicting
    0 or 1 correctly, the loss amounts to zero. However, in this work the true term
    y is not only zero or one, but a continuous value in between. While this is not
