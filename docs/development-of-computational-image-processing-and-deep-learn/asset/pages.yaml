    # 2.1.2 Basic elastic mechanics of FRP


    In this section, elastic mechanics of FRP are presented, starting with the basic
    homogenization equations and followed by macroscale modeling approaches like the
    rule of mixture and corresponding Reuss and Voigt bounds as well as the Halpin-Tsai
    model. The concept of critical fiber length for DicoFRP is also explained in this
    context. After outlining the idea of microscale and RVE models as well as mean
    field models, the Mori-Tanaka model is given as a typical representative of the
    latter.


    # 2.1.2.1 Homogenization


    In continuum mechanics, homogenization is understood as the attempt to describe
    a heterogeneous material by means of a model that represents this complex structure
    in a highly simplified way and yet leads to a plausible deformation behavior,
    i.e., macroscopically equivalent as the heterogeneous material, for the load cases
    investigated. Hence, there are a local stress \(\sigma(x)\) and a local strain
    \(\varepsilon(x)\) that are heterogeneously distributed in the material. They
    are related to'
