  md: '# KARLSRUHER INSTITUT FÜR TECHNOLOGIE (KIT)

    SCHRIFTENREIHE DES INSTITUTS FÜR ANGEWANDTE MATERIALIEN


    Discontinuously fiber reinforced polymers exhibit complex microstructures. Quantities
    to characterize the latter have been developed over time, such as the fiber volume
    content or fiber orientation distributions, which can be acquired through computed
    tomography images and subsequent image processing. This work deals with the development
    of both deterministic and AI based methods in this context, especially considering
    challenges of contrast and resolution with carbon fibers and scale-bridging issues.


    ISSN 2192-9963

    ISBN 978-3-7315-1396-4


