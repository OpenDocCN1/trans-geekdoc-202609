    # 3.8.3 Network architecture 12


    The code provided in the official PyTorch tutorial [310] served as a starting
    point for the DCGAN structure and was gradually adjusted to work with the given
    training data set. For larger image resolutions, the DCGAN structure by Milad
    Hasani [311] was found to work well. Inspired by this, a network structure for
    even larger resolutions was developed (cf. Figure 3.28). The generator takes a
    Gaussian sampled noise vector with 100 entries and uses a combination of transposed
    convolutional layers, batch normalization and ReLU activation to output images
    with a resolution of 256 px × 256 px. Tanh was used as final activation. In the
    discriminator, convolutional layers, batch normalization and Leaky ReLU activations
    were used. The latter was replaced by a Sigmoid activation in the final layer.
    The entire code can be found in the according GitHub repository linked in Chapter
    9.


