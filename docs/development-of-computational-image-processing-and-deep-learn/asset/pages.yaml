  md: 'the overall global behavior, so that the effective stress $\bar{\sigma}$ and
    effective strain $\bar{\varepsilon}$ are given by so-called localization tensors
    $\mathbb{L}$ and $\mathbb{M}$ in the following way:


    $$ \boldsymbol{\varepsilon}(\boldsymbol{x}) = \mathbb{L}(\boldsymbol{x})[\bar{\boldsymbol{\varepsilon}}],
    $$ $$ \boldsymbol{\sigma}(\boldsymbol{x}) = \mathbb{M}(\boldsymbol{x})[\bar{\boldsymbol{\sigma}}].
    $$ (2.1)


    The following applies to the localization tensors


    $$ \langle \mathbb{L}(\boldsymbol{x}) \rangle = \mathbb{I}^S \quad \text{and}
    \quad \langle \mathbb{M}(\boldsymbol{x}) \rangle = \mathbb{I}^S. $$ (2.2)


    Applying the Hill-Mandel condition [19, 20], which states that the work of an
    entire system does not change viewing it from the microscale or the macroscale,
    the effective stress $\bar{\sigma}$ and effective strain $\bar{\varepsilon}$ can
    be given by a volume averaging $\langle \cdot \rangle$ over the representative
    volume $V$:


    $$ \bar{\boldsymbol{\sigma}} = \langle \boldsymbol{\sigma}(\boldsymbol{x}) \rangle
    = \frac{1}{V} \int_V \boldsymbol{\sigma}(\boldsymbol{x}) \ dV, $$ $$ \bar{\boldsymbol{\varepsilon}}
    = \langle \boldsymbol{\varepsilon}(\boldsymbol{x}) \rangle = \frac{1}{V} \int_V
    \boldsymbol{\varepsilon}(\boldsymbol{x}) \ dV. $$ (2.3)


    Assuming linear elastic behavior, the relation between effective stress $\bar{\sigma}$
    and effective strain $\bar{\varepsilon}$ is given by the generalized Hooke''s
    law


    $$ \bar{\boldsymbol{\sigma}} = \bar{\mathbb{C}}[\bar{\boldsymbol{\varepsilon}}]
    = \langle \mathbb{C}(\boldsymbol{x})[\boldsymbol{\varepsilon}(\boldsymbol{x})]
    \rangle, $$ (2.4)


    with the local stiffness tensor $\mathbb{C}(\boldsymbol{x})$ and the effective
    stiffness tensor $\bar{\mathbb{C}}$. The effective stiffness tensor $\bar{\mathbb{C}}$
    analogously is defined by


    $$ \bar{\mathbb{C}} = \langle \mathbb{C}(\boldsymbol{x})\mathbb{L}(\boldsymbol{x})
    \rangle. $$ (2.5)'
