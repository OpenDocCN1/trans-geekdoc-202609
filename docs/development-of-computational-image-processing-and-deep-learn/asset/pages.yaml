- pgno: 228
  md: '# 4.5.1 Validation of the application of the structure tensor method


    The validation of methods for fiber orientation determination is limited, as it
    cannot be measured directly by experiment. Pinter et al. [81] created artificial
    microstructures with given properties and used them to validate their structure
    tensor approach (also applied in this work). In this respect, the method has already
    been validated for similar microstructures. However, an exact validation is not
    possible for the material in this work for the reason that the generation of a
    microstructure that truly corresponds to the CF-PA6 with its mixture of bundles
    and single fibers is currently not possible or implementable. There are two further
    possibilities for validation, one qualitative and one indirect, quantitative.
    The qualitative approach will be discussed here first. After applying the structure
    tensor algorithm, a vector-valued image (3 channels) is created that maps the
    proportion of the orientation in the three spatial directions in each pixel, respectively
    a large number of orientation vectors that can be derived from this. The detected
    orientations of the algorithm can in turn be made visible by false colors in the
    HSV space and placed on the original slices. If the visual impression of the orientation
    corresponds well with the detected colors/angles, the detection appears to have
    been successful as shown in Figure 4.17.


    Figure 4.17-1(a) shows an exemplary slice from the center of a CF-PA6 scan (in
    this case sample CF2 from Plate 3, cf. Figure 3.4), Figure 4.17-2(a) of a GF-PA6
    scan (CF2 from Plate 4) and Figure 4.17-3(a) of a hybrid reinforced CF-GF scan
    (also CF2, i.e. the middle sample, analogous slice pattern to Plate 3 and Plate
