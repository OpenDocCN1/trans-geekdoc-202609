  img_proc: true
- pgno: 291
  md: 'Upon examination of the grey value histograms, it becomes evident that the
    output images exhibit a flatter profile and a darker maximum value compared to
    the input images (cf. Figure 5.11).


    ![](img/332d06e0447dbfd85ea7d2fb553468f3_291_0.png)


    Figure 5.11: Global histogram of gray value intensities of all input images without
    median filter and with median filter as well as of the batch of 128 output images.
    Extracted from Blarr et al. [275].


    The underlying cause of this deviation is challenging to ascertain, as are potential
    corrective measures. One potential solution to achieve a more accurate match between
    the histograms is to incorporate the mean value of the histograms or even the
    entire distribution as additional input (cf. the following explanation of conditional
    GANs (cGANs) and InfoGANs). In the context of neural networks, evaluation is typically
    based on loss plots, which provide insights into the convergence and accuracy
    of the network’s predictions. However, the loss plot of this GAN exhibited significant
    oscillations and did not demonstrate a continuous decrease (cf. Figure 4.35).
    Nevertheless, the training was sufficiently stable. It is assumed that the oscillating
    behavior of the generator loss is due to the fact that the discriminator becomes
    very good very quickly and thus later outputs very similar probabilities. The
    generator therefore receives little meaningful feedback. Both vanishing gradients
    and general convergence problems could be responsible for this failure mode. This
    behavior of the loss is also not unusual, which has already been mentioned in
    the Results (cf. Section 4.7). The State of the Art (Section 2.4.2) also elucidated
    that it is nearly impossible to'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'attain an optimal equilibrium between the generator and discriminator, as the
    optimal point is a saddle point and not a minimum as for most other types of neural
    networks [242]. Nevertheless, since the generator loss does not increase exponentially,
    a kind of metastable state is assumed here. However, it is also evident that further
    metrics must be employed to assess the quality of the network. Subsequently, quantitative
    metrics were employed to directly evaluate performance on the generated images,
    which will be discussed hereinafter.


    The FID plot (cf. Figure 4.36) illustrates the mean FID of 128 generated images
    per epoch. The improvement in the generated images can be observed as the distance
    decreases. However, this decrease plateaus after a certain point, which suggests
    that there is no further improvement in the images. To investigate this in more
    detail, the development of a single generated image was assessed over the epochs.
    In the initial example (cf. Figure 4.37), it is not possible to determine whether
    the image "improves" in the final 30 epochs. This suggests that an earlier termination
    of the training would also be possible. In contrast, in other examples (cf. Figure
    4.38), it appears that the final image is the best. It is evident that the structures
    within the image continue to undergo significant alterations in the final epochs,
    which can be attributed to the fluctuations observed in the loss plot. However,
    the inability to make an absolute assessment of which image represents the optimal
    outcome precludes the formulation of a clear recommendation regarding the optimal
    training duration. Nevertheless, these examples illustrate that the images do
    not suddenly deteriorate with further training. Additionally, it is unlikely that
    any discernible improvement will be observed beyond the 75th epoch in comparison
    to the computational effort. Returning to the FID plot, it can be observed that
    the final value is relatively high possibly indicating bad final image results.
    However, it is important to note that the FID is highly dependent on the number
    of samples. In fact, the fewer the samples, the higher the score [312]. Therefore,
    it is essential to exercise caution when assessing absolute values and comparing
    them with those of other networks. This is particularly relevant when considering
    CT images, which present a completely different set of conditions than those encountered
    with most images generated by such networks. A comparison of the ImageNet'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'dataset, on which the FID is pre-trained, with the gray scale images reveals
    that the former contains everyday, coloured photos with clearly definable objects,
    people, etc., which cannot be compared with the stochastically distributed fibers
    in the latter. Furthermore, similar FID values can also be found in other papers
    with good results [345].


    The capacity of the DCGAN to generate novel images was investigated by searching
    for nearest neighbors in the training dataset for each generated image. Two different
    metrics, ED and SSIM, were employed as a basis for this investigation (cf. Figure
    4.39). Both metrics demonstrated an ability to select appropriate images as nearest
    neighbors and both were able to demonstrate that the network generates images
    that differ significantly from training images. The ED metric, despite being the
    more straightforward and faster method to calculate, was unable to find suitable
    nearest neighbors in some instances for highly novel images. This is because the
    ED is not capable of recognizing similar structures that are offset slightly in
    spatial location as similar [319]. As a result, it is often the case that neighbors
    determined using SSIM are perceived to be closer to those visually observed. The
    values of the ED to the nearest neighbor and the SSIM were also plotted for the
    two single image developments (cf. Figure 4.40 and Figure 4.41 for the first one
    in Figure 4.37 and Figure 4.42 and Figure 4.43 for the second one in Figure 4.38).
    All plots exhibited a decrease at the beginning, followed by an increase in the
    first example or a period of relatively constant performance apart from fluctuations.
    This corroborates the difficulty previously identified in the context of the FID
    in determining when an image has reached a point of no further improvement. Apparently,
    after just a few epochs, images are generated to which similarly close neighbors
    can be found as to the final generated image. It is noticeable that low distance
    values, i.e. high correspondence with a training image, often occur for images
    with few structures recognizable as fibers. Presumably, these are then structurally
    so homogeneous that an image with equally few fibers in the training data set
    simply shows a high degree of correspondence. However, since there are even more
    images with many fibers in the training data set, but their distance to similar
    generated images is typically greater, it is recommended'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'that these nearest neighbor determinations are not primarily used to assess
    the development of a single generated image. The FID is probably more suitable
    for this purpose. In principle, however, both the nearest neighbor method itself
    and the two metrics ED and SSIM proved to be quite helpful for assessing the network.
    ED is particularly useful for quick comparisons and SSIM for more precise ones.


    # 5.5.2 Further development


    Further developments of this network are conceivable and recommended. One option
    would be to provide the network with additional information about the training
    images. Various quantities are possible here. In addition to purely image-based
    information such as the Haralick entropy from the Haralick features [346], which
    provide information on the heterogeneity of the images, the mechanical parameters
    mentioned in this paper, FVC, FLD and FOD/FOT, would be of particular interest.
    This physical information would ensure that the network is able to recognize and
    reproduce superordinate structural relationships between individual voxels. The
    network would have to be modified accordingly. In literature, a so-called conditional
    GAN, or cGAN for short, was first introduced, which enables the assignment of
    a specific label to each training image [254]. This was tested for this problem
    by assigning a value of its Haralick entropy to each image. However, the significance
    of such a single value is low, and accordingly this did not improve the network.
    Instead, it would be more beneficial to evaluate several values of entropy across
    the image in a grid. Alternatively, the mechanical parameters previously mentioned
    should definitely be employed. Subsequent developments, such as the continuous
    conditional GAN (CcGAN) [255] or the so-called InfoGAN [256], are more suitable
    for this purpose. A further development (to a continuous conditional DCGAN, CcDCGAN)
    with mechanical parameters could be used to develop a true microstructure generator
    that can generate images with a specific FVC, FLD or FOD requested by the user.
    Furthermore, the development of a network'
  merge: -1
  img_proc: true
- pgno: 295
  md: that can process and generate 3D images must be pursued in the long term in
    order to exploit the potential for the creation of RVEs.
  merge: -1
