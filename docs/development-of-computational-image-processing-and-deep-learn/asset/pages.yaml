  md: '# 3.7.1 General notes on the interpolation methods


    In general, all interpolation methods were mainly implemented in Python 3.8.


    SPD tensors can be visualized as tensor glyphs [116, 117]. This method will be
    used in this work as it constitutes a descriptive and interpretable way of assessing
    the success of the different implemented interpolation methods. The visualization
    was implemented in Matlab R2020b with the help of the "plotDTI" function of the
    fanDTasia ToolBox by Barmporntis et al. [118].


    The overall idea of all three implemented interpolation methods is to get FOT
    values for the 160 positions in the plate that are missing, from calculations
    with the measured nine FOT at the given grid positions. Determining values between
    a set of measured values, here the set \(\mathcal{T}_m = \{\text{UL, UM, UR, ML,
    MM, MR, LL, LM, LR}\}\) (respectively denoting "Upper Left", "Upper Middle", "Upper
    Right", "Middle Left", ..., "Lower Left", "Lower Right", etc.) of measured FOT
    computationally, based on the set of measured values, describes a classical interpolation
    problem. An interpolation scheme \(\bar{\phi}\) is defined as a mapping \(f\),
    which connects its arguments, on the one hand a set of \(N \ge 1\) discrete values
    \(\phi_i\) and on the other hand their associated weights \(w_i \in [0; 1]\):


    ```

    \(\bar{\phi} = f(\phi_i, w_i).\)

    ```


    As a weight function, multiple options are conceivable with the possibly simplest
    being Shepard’s inverse distance weighting (IDW) [297]


    ```

    \(w_i(\boldsymbol{x}) = \frac{1}{d(\boldsymbol{x}, \boldsymbol{x}_i)^p},\)

    ```'
