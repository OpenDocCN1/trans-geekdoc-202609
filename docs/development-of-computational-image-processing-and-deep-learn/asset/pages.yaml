  md: '\(\mathbf{R} = \begin{bmatrix} a^2 + b^2 - c^2 - d^2 & 2(bc - ad) & 2(bd +
    ac) \\ 2(bc + ad) & a^2 - b^2 + c^2 - d^2 & 2(cd - ab) \\ 2(bd - ac) & 2(cd +
    ab) & a^2 - b^2 - c^2 + d^2 \end{bmatrix} . \quad (3.13)\)


    # Shape


    For the interpolation of the shape, three linear independent invariants are formed
    of each tensor and interpolated separately. Of the already mentioned K- and R-invariants
    [124] \(K_1, R_2\), and \(R_3\) will be used (comparable to [123]):


    \(K_1 = \text{tr}(\mathbf{A}), \quad R_2 = \sqrt{\frac{3}{2}} \frac{|\mathbf{A}''|}{|\mathbf{A}|}
    \text{ and } R_3 = 3\sqrt{6} \frac{\text{det}(\mathbf{A}'')}{|\mathbf{A}''|}.
    \quad (3.14)\)


    **A**’ is the deviatoric part of **A**.


    Even though \(K_1\) and \(R_2\) are not orthogonal [124], the use of \(K_1\) can
    be justified by ensuring that the trace of the orientation tensor is one. It is
    not necessarily essential to have orthogonal invariants for this specific case
    of application.


    The invariants are then interpolated individually: \(K_{1,\text{ges}} = \sum_i
    w_i K_{1i}\), \(R_{2,\text{ges}} = \sum_i w_i R_{2i}\) and \(R_{3,\text{ges}}
    = \sum_i w_i R_{3i}\). The weights stay the same: \(\sum_i w_i = 1\).


    From the interpolated invariants, the following formula was used to calculate
    the associated eigenvalues (cf. [123]):


    For \(i = 1, 2, 3\) holds: \(\lambda_i = \frac{1}{3} K_1 + \frac{2 K_1 R_2}{3
    \sqrt{3 - 2 R_2^2}} \cos \left( \frac{\cos^{-1}(R_3) + P_i}{3} \right), \quad
    \text{with } P_i = 0, 2\pi, -2\pi\)


    With these eigenvalues, \(\mathbf{\Lambda}\) can then be created again.'
