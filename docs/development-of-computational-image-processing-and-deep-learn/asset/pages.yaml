  md: 'The Gaussian smoothing is supposed to deliver a more natural blur and better
    preserve edges in the image compared to the average blur.


    A *median filter*, as a representative of order-statistic, nonlinear filters,
    does not compute a new value from the values present in the kernel but instead
    replaces the central pixel value with the median value existent in the mask, as
    demonstrated in the following Figure 2.13.


    ![](img/332d06e0447dbfd85ea7d2fb553468f3_107_0.png)


    **Figure 2.13:** Graphical demonstration of the principle of the median blur filter.


    It is highly effective against so-called salt and pepper noise and robust against
    outliers. Unlike in the case of the average blur filter, a rectangular kernel
    dimension is impossible; it must be square.


