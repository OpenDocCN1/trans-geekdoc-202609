    # 3.8.2.4 Image augmentation


    As most neural networks, GANs require a large training data set to be able to
    detect reoccurring image features. Figures of 10⁵–10⁶ images are suggested for
    modern, high-resolution GANs [308]. The high number of images is particularly
    relevant to reduce overfitting [309], which leads to the discriminator feedback
    becoming meaningless for the generator and finally the training diverging [308].
    As reaching such a high amount of original training data is cumbersome and at
    times impossible, image augmentation has developed as the default solution to
    multiply the dataset [308, 309]. Augmentation refers to a deliberate, slight change
    to existing training images in order to create new training images that expand
    the original images within a meaningful scope to increase input dataset variety
    and improve training. Augmentation strategies for gray value images include but
    are not limited to rotation, flipping, translation, scaling and modifications
    of brightness and contrast [308]. In the case of the GAN presented in this thesis,
    every cutout image was rotated by 180° (corresponding to a point reflection) and
    additionally mirrored both horizontally and vertically, which can be seen in Figure
    3.27.


    A simultaneous mirroring at the horizontal and vertical axis was omitted due to
    being a duplicate to the 180° rotation. Furthermore, rotations by ± 90° were also
    left out to preserve the preferred fiber orientation resulting from the compression
    molding material flow. After all cutting and augmentation steps, this results
    in a total of 29,280 2D training images that are fed into the network as input.'
