- pgno: 260
  md: '# 5 Discussion


    In the following, the results of the plastificate investigations are discussed
    as well as the fiber volume contents, the methods for their evaluation, and the
    fiber lengths. The other sections deal with the results of the fiber orientation
    and the fiber orientation tensor interpolation as well as the microstructure generation
    by the GAN.


    # 5.1 Investigations of plastificate


    As a preliminary point, it should be noted that the plastificate investigations
    were more of a phenomenological investigation than a statistically verified one.
    In many cases, visual observations (material orientation around screw vortices,
    expansion of the plastificate) or results from another type of examination by
    colleagues in the International Research Training Group (IRTG) (volume detection
    via GOM Atos 3D scanner, weighting, density calculation) should be confirmed or
    new procedures were to be motivated. However, the plastificate investigations
    were included in this dissertation because the majority of research is still concerned
    with the characterization of the finished part after compression molding and not
    the plastificate.


    The fairly evenly rounded structure around the screw vortices was expected and
    was already visually detectable from the scans. This double helix structure in
    the cross section was, e.g., described by McLeod et al. [322]. Furthermore, Radtkle
    claims that there is a pre-orientation of the fibers in the plastificate strand
    as a result of the discharge from the twin-screw device as well in his dissertation'
  merge: -1
  img_proc: true
- pgno: 261
  md: '[321]. He confirms the observation in this work that in the outer layers, the
    fibers are arranged parallel to the extrusion direction, as they are aligned by
    the polymer adhering to the extruder walls and the discharge nozzle wall. Inside
    of the strand, the alignment of the fibers are predominantly influenced by the
    rotation of the screw and the feed of the material according to Radtke, which
    also coincides with the author''s findings.


    In contrast, the relatively constant alignment of the fibers perpendicular to
    the extrusion direction in the plastificate was more surprising. Radtke also determined
    pre-orientations in 2009 using computed tomography of a plastificate strand [321].
    He examined five layers separately across the thickness. Even though the work
    unfortunately does not show a planar evaluation on the extrusion plane (x-y plane),
    which makes a direct comparison with the findings in this work more complicated,
    a plot with the frequency of occurrence of certain angles also shows a clear tendency
    towards 0°, but then drops quite linearly towards 90° in both positive and negative
    direction, so that angles not perpendicular to the extrusion direction also occur
    frequently. This behavior appears quite regularly regardless of the layer examined
    across the thickness. [321] This confirms findings of Tröster''s earlier dissertation
    [320]. He also discovered the symmetry of the fiber orientation across the thickness
    of the plastificate and the surface layer oriented in extrusion direction observed
    in this work and by Radtke. In addition, he confirms the finding of the orientation
    being similar along the length of the plastificate, which was also shown in this
    work. In particular, he found the same course of angles as Radtke though, with
    its mirror-symmetric orientation regarding the length axis of the plastificate.
    Specifically, he shows a similar broad and flat frequency distribution with a
    low maximum value indicating a small degree of preferred orientation in extrusion
    direction. In fact, he schematically depicts the fibers being oriented in -60°
    (left of the middle length axis of the plastificate) and +60° (right of the middle
    length axis of the plastificate) to the extrusion direction. [320] This result
    of Tröster and Radtke is the only one that is clearly not congruent to the findings
    in this work. However, both Radtke and Tröster examined polypropylene with glass
    fibers. The one polycarbonate scan in Figure 4.3 alone shows how strongly'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'the matrix system influences the plastificate. Furthermore, the fiber volume
    content and the speed of extrusion certainly influence the orientation as well
    and multiple of these parameter combinations would need to be investigated in
    order to make a definite statement on this. Anyway, the evaluated orientation
    behavior of the polyamide plastificates in this work is consistent with the visual
    impression of the scans and physical plastificate sections.


    Pre-orientation in the plastificate is crucial for correctly predicting the fiber
    orientation of the final part in process simulations. This non-uniform, local
    fiber orientation state, which is influenced by the extruder geometry, has so
    far typically either been neglected by assuming an isotropic or planar-isotropic
    orientation state or has been measured through image-processing of scans similar
    as in this work, which is then mapped to the finite element model of the charge
    used in the simulation [5]. The regularity of both the vortex orientation and
    the orientation in the extrusion direction in turn allowed considerations to generate
    these initial fiber orientation states in a different way instead of determining
    them each time in a time-consuming manner by CT scans. Schreyer therefore developed
    a novel approach to determine the initial fiber orientation state with the help
    of the tensors determined by the author and based on geometric assumptions [276].
    Depending on the extruder type and the dimensions of the plastificate, the tool
    can generate a three-dimensional data set that outputs the mesh information together
    with the tensorial representation of the initial fiber orientation state. With
    the help of this simplified generation, the influence of different geometric variations
    of the plastificate, different extruder variations and different insertion positions
    of the plastificate in the press on the final product of the compression molding
    process can be estimated without any experimental effort. An example of such a
    generation (right) and the corresponding original state (left) of a CF-PA6 plastificate
    is shown in Figure 5.1. [276]


    As far as the porosity and the expansion of the plastificates are concerned, observations
    and results of alternative methods were able to confirm the results of this work.
    When systematically measuring the volume via GOM Atos 3D scanner, the weight and
    calculating the consequential density of the old and'
  merge: -1
  img_proc: true
- pgno: 263
  md: '![](img/332d06e0447dbfd85ea7d2fb553468f3_263_0.png)


    Figure 5.1: Section of a scan of a CF-PA6 plastificate with their measured orientation
    tensors plotted at the left swirl and the geometrically generated ones at the
    right swirl - superimposed as tensor glyphs. Extracted from the publication [276],
    co-authored by the author.


    new ends of various plastificates, colleague Christoph Schelleis was able to determine
    a higher porosity (and thus a lower density) of the front end in each case. Using
    the identical method, the same correlation between higher porosity and higher
    screw speed was also demonstrated by Sven Löwe in his Bachelor’s thesis [327].
    He consistently showed that higher rotation speed led to smaller densities and
    therefore higher porosities both for high and low fiber volume content. He furthermore
    showed that higher fiber volume contents lead to lower densities and higher porosities
    compared to plastificates with lower fiber volume content. [327]


    # 5.2 Determination of fiber volume content


    The precise determination of fiber volume content is of particular interest for
    discontinuous fiber reinforced polymers. This allows both checking the set process
    parameters to achieve the desired fiber volume content and providing exact values
    for modeling.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'Motivation for the development of recognition from CT images instead of the
    exclusive use of experimental methods was already given in the State of the Art
    (Section 2.2.1.3). In the following, the results of all methods used are evaluated
    and possible improvements are suggested.


    # ## 5.2.1 Chemical method


    As for the method itself, chemical acid-based dissolution of the matrix is the
    standard for determining the fiber volume content of CFRP, but it is more complex
    and labor-intensive than TGA [328, 329]. There are no comparative values and no
    better or similarly good methods - therefore the quality of the results cannot
    be checked. Nevertheless, the measurements are used as ground truth because, according
    to current knowledge, there is no superior method.


    As far as the FVC results are concerned, initially the low values at the borders
    of the specimens and the higher values towards the middle of the thickness are
    striking. The so-called "shell-core effect" known from injection molding signifies
    changing fiber volume content and fiber orientation between shell and core layer
    of the plate [5, 17]. While the fiber orientation effect is only visible in the
    area of the initial charge (and will still be discussed in Section 5.4) and non-existent
    in the flow area, the effect of the compression molding process on the through-thickness
    FVC is clearly visible.


    In general, the measured mean values (24.2 % for Plate 2 and 23.6 % for Plate
    3) deviate from the target value of 25 %. It is difficult to answer why the true
    values are slightly below the values actually set via the process parameters.
    This is likely to be a measurement error, although the cause may be of various
    kinds. The calculation made for the process may not have been accurate enough
    or the feeding speed of the fibers may have deviated slightly from the calculated
    one. Fiber losses in the extruder are also conceivable.


    Furthermore, the clear increase in values when using larger samples is surprising.
    Although the six samples of course do not provide sufficient statistical certainty,'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'the effect seems clearly pronounced. While an increase in mean fiber length
    with increasing specimen sizes due to the cutting off of longer fibers in small
    specimens makes sense, there is no obvious reason why the pure fiber content should
    be lower in small specimens. A literature search on this did not yield any results;
    while mechanical tests are often performed with different sample sizes, most authors
    determine FVC with only one sample size. Two possible explanations are discussed
    in the following. Firstly, the significance of the FVC value of a smaller sample
    is generally lower, as it is statistically more likely to catch a spot in the
    panel that happens to be particularly rich in fibers or matrix. In the cases measured,
    however, it would then have to be a very matrix-rich area in each case. Another
    possible explanation is the fact that fibers can be pulled out of the material
    at the cut surfaces when the sample is cut and removed from the plate. As the
    small samples have a higher surface-to-volume ratio, this effect is more significant
    for them. Now, the fibers could also get stuck in the specimen and be detached
    from the plate, potentially increasing the FVC. However, the probability that
    the larger part of the fibers is stuck in the plate is particularly high for small
    specimens, which in turn could lead to the shorter piece in the specimen being
    torn out. The probability that the longer part is not in the specimen is lower
    for larger specimens. The idea is illustrated graphically in Figure 5.2. Furthermore,
    a similar effect to the problem with incineration is conceivable as a possible
    cause: Larger specimens have to be exposed to the acid for longer to dissolve
    the matrix due to the poorer surface-to-volume ratio. However, since the same
    treatment time was selected for the smaller specimens, the matrix could be removed
    more quickly and the fibers subsequently attacked, as sulphuric acid is in fact
    oxidizing and reacts with graphite. This could also lead to the lower measured
    fiber volume content.


    There is also a recognizable difference between the charge and flow areas. The
    three samples in the charge area of Plate 2, FLD1 - FLD3, have on average a higher
    FVC than the samples in the flow area, FLD10 - FLD12, and C1 - C3 of Plate 3 also
    have on average more fibers than F1 - F3. However, the central samples of Plate
    3, which have an even higher FVC than the charge samples, do not quite fit the
    picture. Since the differences in the mean values are on average'
  merge: -1
  img_proc: true
- pgno: 266
  md: '![](img/332d06e0447dbfd85ea7d2fb553468f3_266_0.png)


    less than 1 % between the different areas of Plate 3, the possibility that these
    differences are due to measurement errors or general plate fluctuations must also
    be taken into account. Overall, the number of samples is too small to be able
    to make valid statements. What is also noticeable is that the values in the center
    of all three columns, i.e. the values of samples C2, CF2 and F2, are the smallest.
    Considering the flow of the plastificate depicted in Figure 5.5, it makes sense
    that most fibers are pushed towards primarily the upper and partly also the lower
    area of the plate. The results of Plate 3 are summarized comprehensively as boxplots
    in Figure 5.3.


    In his dissertation, Radtke carried out similar measurements of the fiber volume
    content in the different plate areas [321]. He found that greater fluctuations
    were observed in the results across the width of the plate than along the flow
    path. This observation is consistent with our results: The standard deviation
    within areas C and CF is large (see Figure 5.3). However, the fluctuations in
    the flow area over the height of the plate are small. In contrast, the FVC values
    along the flow path in the area of the 3-sample (bottom) and the 2-sample (center)
    are quite constant. Only along the 1-samples (top) is the deviation similar to
    that within the charge and transition region of the plate. The upper samples (top,
    1-samples) generally show a high FVC. However, this corresponds very well with
    the skewed flow front discovered, which will be explained in the context of'
  merge: -1
  img_proc: true
- pgno: 267
  md: '![](img/332d06e0447dbfd85ea7d2fb553468f3_267_0.png)


    Figure 5.3: Boxplots for the fiber volume content results of Plate 3 categorized
    into charge, transition area and flow area (a) and top (1), center (2) and bottom
    (3) specimens (b). Data first published by Scheuring et al. [274].


    the determined fiber orientations, according to which a slightly upward-pointing
    fiber orientation and thus flow front could also lead to an increased fiber volume
    content at the upper end of the plate. The flow area shows the smallest average
    FVC along the flow front; presumably not too many fibers arrive there.


    # 5.2.2 "Average or above" (AOA) thresholding 1


    With regard to the two computational methods for determining fiber volume contents,
    the novel thresholding method AOA will be discussed first. It shall be noted here
    directly that this method was born out of necessity, so to speak, as conventional
    thresholding methods did not work, as can be seen from the Appendix, and alternative
    methods such as Gandhi''s [5] were not possible.


    The average of the FVC values determined by chemical dissolution was 24.2 % and
    the AOA method determined an average value of 26.5 %. The absolute mean deviation
    of 2.7 % is therefore greater than that of the CNN with about 1.5 % (cf. Table
    4.3). The deviation was mainly increased by the two outliers, which


    1 This section is based on the author''s publication [188].'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'were included in the result because there was no explanation as to why those
    scans should differ (similar histograms to other scans, similar visual perception,
    etc.). Without these two outliers, however, the average deviation of the AOA thresholding
    would only be 0.6 %, which is more than twice as good as the CNN. In addition,
    the results in Figure 4.11 of the AOA appear more reliable and plausible than
    the results in Figure 4.14 of the CNN. The fact that the average value of the
    CNN fits well is due to the average of the training data or is a coincidence.
    Sample by sample, the agreement is much worse than with AOA thresholding. So if
    the FVC of a new sample had to be determined, AOA thresholding could probably
    be used with more confidence than the CNN.


    If the method is to be evaluated as such, the general validity of the approach
    must be critically examined. There is no guarantee that it will also work for
    alternative material systems or scans of a different quality. It is fundamentally
    based on the fact that the samples have fewer fiber bundles at the border of the
    sample (in relation to the thickness) and many fiber bundles in the middle of
    the sample. This changed the histograms per slice, which generally did not show
    two clear peaks. The meaningful determination of a threshold was therefore difficult
    with these changing histograms across the thickness. For all materials/scans that
    do not exhibit this peculiarity, the approach will not be of interest, at least
    not in exactly the same way. Regarding the adjustment of the threshold determination
    across the thickness, alternative/more complex methods could be used than the
    binary decision between the Otsu threshold of a single slice and the average Otsu
    threshold of the whole stack chosen in this work. Instead, another non-constant
    adjustment of the threshold could be developed. A mathematical determination of
    the variation of the histograms over the thickness and a corresponding continuous
    adjustment of the threshold values would be possible. Theoretically, it would
    still be possible to locally enhance the CT scans with the low resolution (i.e.
    single fibers and matrix mixed as mean gray value) with small CT scans of higher
    resolution in order to be able to better interpret the gray values. However, the
    aforementioned difficulty that an increase in stochastic noise occurs at higher
    resolutions makes segmentation even more difficult. In addition, the sample would
    then have to'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'be cut into smaller pieces so that the sample fills the entire field of view,
    as otherwise even more noise would occur. This in turn creates different boundary
    conditions if the FVC is still to be determined destructively and was no longer
    possible in the case of this work anyway.


    The previous application of the filters had a non-negligible influence on the
    quality of the results. Nevertheless, it should be emphasized that the main factor
    is thresholding. When looking at Figure 3.15, for example, it becomes clear that
    although the median filter was applied to both images, the amount of fibers is
    still greatly overestimated by the normal Otsu threshold. The correct choice of
    filter is an additional finetuning factor. Considering that neural networks are
    essentially just a series of filters, the importance of filter selection should
    not be underestimated, especially in the case of noisy images with low contrast.


    The AOA thresholding method is by no means optimal, but simple global thresholding
    turned out not to be an option. The literature was also surprisingly sparse, especially
    for discontinuous fiber reinforced polymers. Apart from a few sources already
    mentioned in the State of the Art, Yu et al. [55] investigated fiber volume contents,
    for example, using a method that combines scanning electron microscopy and micro-computed
    tomography; however, for yarns in textile composites, which in turn has a completely
    different structure. Wintiba et al.’s work [330] also deals with woven composites.
    For these reasons, various approaches were tested, including a normalization of
    the threshold values in relation to the mean grey value/brightness of a scan,
    but none of them worked as convincingly as the AOA method. It is a quick and simple
    method with sample-wise even better results compared to the high development and
    training effort of the CNN. However, it was particularly convincing that the FVC
    values calculated by the method increased or decreased with the experimental values,
    apart from the two outliers, so that the trend was mostly correct.


    The possibility of easily investigating the course of the FVC over the thickness
    of the sample, which was already mentioned in the motivation, should of course
    be emphasized. As can be seen in Figure 4.12, the material examined in this work
    shows a strong decrease in fiber concentration towards the edges, with a'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'maximum in the middle of the sample. Gandhi et al. [5] showed similar results
    for LFT processed by injection molding (see also [331]). They also showed that
    the core layer width and maximum concentration increases with higher nominal fiber
    concentrations. This fiber distribution across the thickness is of course particularly
    important in bending tests, where most of the load falls on the outer areas.


    # 5.2.3 CNN 2


    At first glance, the CNN was convincing with the prediction of a mean FVC of 24.3
    % (compared to the experimental value of 24.2 %) and a mean absolute deviation
    of only 1.5 % (see Table 4.3). However, as already mentioned in the previous section,
    this is probably due to the average of the training data or is a coincidence.
    The good agreement of the mean values should not be given great importance if
    the individual values are usually not correct. It is noticeable that, as with
    the thresholding approach, some samples are predicted very well, while others
    deviate by well over one percent. Apart from the two outliers of the AOA thresholdings,
    however, the CNN predictions are worse than those of the AOA method. So while
    the maximum error is lower with CNN, the logical relationship (increasing experimental
    FVC leads to increasing predicted FVC) is found less frequently with the thresholding
    approach (as seen in Figure 4.14). Since the CNN uses the experimental data as
    a training basis, while the AOA does not, and the CNN nevertheless makes relatively
    weak predictions, this clearly speaks in favor of AOA thresholding.


    There are various possible reasons for the loss behavior mentioned in the Results,
    according to which the validation loss is smaller than the training loss. The
    first possibility is the influence of so-called regularization methods (such as
    dropout). This deliberate, random omission of neuronal connections is used in
    the training process in order to better generalize the training, as explained'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 5 Discussion


    in the State of the Art. This often sacrifices some of the training accuracy.
    However, dropout is not used in the validation process, which is also the default
    setting in Keras. As a result, the validation loss may be better than the training
    loss. It would be possible to determine this regularization loss by manually applying
    dropout in the validation phase, for example, in which case the curves would probably
    look different. Another reason could be the timing of the loss calculation. The
    training loss is normally reported continuously as an average of the losses of
    a batch within an epoch. The validation loss, on the other hand, is determined
    once at the end of an epoch, after the model has already been updated throughout
    the epoch, allowing it to benefit from the full extent of the epoch’s learning.
    If the validation loss were shifted to the left by half an epoch, which would
    correspond to the mean report time difference, the graphs would also already look
    different. The last and probably worst reason would be that the validation set
    is too simple. This would be conceivable because the training data (original and
    augmented scans) of a sample did not strictly belong to the training or validation
    set in this work. Adjusting this would be a necessary improvement.


    There are several further ways to improve the CNN. Perhaps the most obvious would
    be more diverse input training data. Although 448 scans were used for training,
    these came from only 14 original scans that were augmented. Not using more original
    scans was due to the fact that experimental FVCs were only available from the
