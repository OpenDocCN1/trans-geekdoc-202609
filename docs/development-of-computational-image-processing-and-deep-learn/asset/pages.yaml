    # ## 2.4 Artificial intelligence


    The term artificial intelligence describes the intelligence of machines or software.
    It is a field of study in computer science and its technologies have spread across
    various applications throughout industry, governments, science and entertainment.
    Initiated by Alan Turing in the 1950s [167], AI rose to its initial promise only
    in the last decade as large computational power and big data storage and handling
    possibilities emerged [168]. This led to the AI boom, sometimes called AI Spring
    [169], in the later 2010s and early 2020s.


    The large field of AI is further differentiated. Machine learning (ML) is probably
    the largest sub-category [168]. It refers to algorithms that can automatically
    improve the execution of a specific task [170]. Hong et al. [168] emphasize that
    the major difference between conventional programming and machine learning programming
    is ML working through induction. In the former, a programmer has to formulate
    general rules and the algorithm is able to deduce the result for specific observations,
    while in ML the algorithm itself finds general rules from the given observations
    [168]. The programmer''s work lies in the development of the structure and environment
    of the algorithm for it to reliably induce those rules. Either another subcategory
    of ML or a mixture of AI and ML concepts (depending on the definition), is the
    so-called deep learning (DL) [168]. Deep learning refers to processing the observations
    through ANNs that are inspired by biological neural networks. The adjective "deep"
    stresses the use of multiple'
