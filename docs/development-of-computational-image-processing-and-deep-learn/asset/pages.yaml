    are then shuffled and divided into individual batches. The last non-full batch
    is dropped, i.e. the images are not used for training. Unlike in the original
    DCGAN paper [250], no initial weights were defined as this was found to increase
    the likelihood of a stable training process for this particular configuration.
    The training loss is calculated with the ADAM optimizer based on the commonly
