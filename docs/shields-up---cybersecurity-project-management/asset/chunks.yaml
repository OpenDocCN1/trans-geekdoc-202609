    “The book Shields Up: Cybersecurity Project Management covers a broad spectrum
    of a reader’s possible role within an IT department, especially in managing strategic
    and operational projects, including cybersecurity. The book will be appreciated
    by those who perform roles like project management, quality management, risk management,
    cybersecurity, IT operations support, strategic planning, and more. I was surprised
    to see its perfect alignment with `NIST`, `ITIL`, `PMBOK®Guide`, even `ISO Risk
    Management`. I advocate for a risk-based approach to managing cybersecurity, a
    central theme in Shields Up This book shares essential knowledge and expertise,
    and Greg nailed these and many more.”—Irene Corpuz, PMP, `ITIL`, CISA, CEH, `ISO
    27001`, Lead Implementer and Auditor, Manager—Projects, Federal Higher Education,
    United Arab Emirates


    ## “Outstanding Project Management Practice”


    “Dr. Skulmoski’s book is a metaphor for outstanding project management practice.
    It delivers content that’s critical for the fast-developing business climate,
    and it does so with a precision of timeliness that is commendable. Shields Up
    will prepare project managers to successfully deliver technology and cybersecurity
    projects.”—Professor Alan Patching, PhD, Project Management, Associate Dean External
    Engagement, Bond University, Australia


    ## “Clearly and Succinctly Guides Cybersecurity Professionals”


    “In Shields Up, Skulmoski clearly and succinctly guides cybersecurity professionals
    on how to incorporate project management techniques and principles into their
    work to enhance both their projects and careers. He is clearly in tune with the
    struggles of cybersecurity professionals and the significant demands on their
    time. By providing expert advice on managing projects, which includes the latest
    thoughts and developments in the field, he gives cybersecurity professionals the
    critical tools they’ll need to be successful.”—Derek Molnar, PMP, IT Project Manager,
    Colorado State University, United States


