- raw: '“The book Shields Up: Cybersecurity Project Management covers a broad spectrum
    of a reader’s possible role within an IT department, especially in managing strategic
    and operational projects, including cybersecurity. The book will be appreciated
    by those who perform roles like project management, quality management, risk management,
    cybersecurity, IT operations support, strategic planning, and more. I was surprised
    to see its perfect alignment with NIST, ITIL, PMBOK®Guide, even ISO Risk Management.
    I advocate for a risk-based approach to managing cybersecurity, a central theme
    in Shields Up This book shares essential knowledge and expertise, and Greg nailed
    these and many more.”—Irene Corpuz, PMP, ITIL, CISA, CEH, ISO 27001, Lead Implementer
    and Auditor, Manager—Projects, Federal Higher Education, United Arab Emirates


    “Outstanding Project Management Practice”


    “Dr. Skulmoski’s book is a metaphor for outstanding project management practice.
    It delivers content that’s critical for the fast-developing business climate,
    and it does so with a precision of timeliness that is commendable. Shields Up
    will prepare project managers to successfully deliver technology and cybersecurity
    projects.”—Professor Alan Patching, PhD, Project Management, Associate Dean External
    Engagement, Bond University, Australia


    “Clearly and Succinctly Guides Cybersecurity Professionals”


    “In Shields Up, Skulmoski clearly and succinctly guides cybersecurity professionals
    on how to incorporate project management techniques and principles into their
    work to enhance both their projects and careers. He is clearly in tune with the
    struggles of cybersecurity professionals and the significant demands on their
    time. By providing expert advice on managing projects, which includes the latest
    thoughts and developments in the field, he gives cybersecurity professionals the
    critical tools they’ll need to be successful.”—Derek Molnar, PMP, IT Project Manager,
    Colorado State University, United States


    “A Solid Guide”


    “Shields Up is a solid guide covering all the stages and standards commonly found
    in cybersecurity projects, future demands, and a deep dive into why the IT delivery
    gap will only worsen due to skills shortage and increased demand for projects.
    The book perfectly covers standards, measurement practices (KPIs/SLAs), and guiding
    principles around cybersecurity project management from an end-to-end project
    perspective. Overall, the book richly describes the whole picture around technical
    project management at an enjoyable and great pace.”—Thiago Santos, Senior Technical
    Architect, Mulesoft, Canada


    “Pragmatic, Informative, and an Enjoyable Read”


    “I begin by giving kudos to the author for writing this book. I found it very
    pragmatic, informative, and an enjoyable read. Shields Up is well-structured and
    easy to read. The author provides a solid introduction to the cybersecurity and
    project management specialties supplemented with exercises and micro-learning
    opportunities. Additionally, I found the illustrations very helpful as they summarize
    the knowledge and aids learning retention, especially for each guiding framework
    (e.g., NIST, ITIL 4, and PMBOK® Guide).


    The book has the right balance between technical and project management content
    and is well suited for cybersecurity professionals and most technical roles. Shields
    Up will also appeal to those who work in project management offices (PMOs).


    A vital benefit of this book is it can guide technical professionals to transition
    to a project management career. This book can be a quick reference guide to bridge
    the knowledge gap between technical and project management areas of practice.
    Overall, I enjoyed reading Shields Up and recommend it to technical professionals
    interested in advancing their careers.”—Israa Abulawi, BEng, ISACA, Enterprise
    Project Manager, Healthcare Care Technology and Data Management, United Arab Emirates


    “Unique Resource”


    “Shields Up is a truly unique resource. It explores the important domain of cybersecurity
    through a project management lens I have not seen a book like this that is so
    comprehensive in scope and rich in advice while also being extremely practical.
    I believe this is mandatory reading for anyone wanting to make a career in our
    increasingly digital world of business transformation.”—Professor Craig Langston,
    PhD, Project Management, Bond University, Australia


    [Foreword](#index_split_004.html#filepos5958)


    It was late July of 2012, and I had just landed in Abu Dhabi, having accepted
    a role with IBM in Middle East and Africa. I had been hired to set up and execute
    the learning function for a greenfield digital hospital, Cleveland Clinic Abu
    Dhabi. Recruited into IBM on the basis of my success implementing training programs
    for clinicians, I arrived at the temporary offices of Cleveland Clinic my first
    day of work sweating and jet-lagged, and met my key client, Dr. Gregory Skulmoski.


    Greg was keen and cheerful, impeccably dressed, and energetic with a spring in
    his step. He greeted me enthusiastically. Though I already possessed almost 15
    years of IT project management experience at that point, the subsequent weeks,
    months, and years working alongside Greg were an education. Some of my new colleagues
    loathed submitting deliverables (e.g., detailed requirements) to Greg as his reviews
    were exhaustive. Indeed, Greg insisted on the highest levels of quality, and in
    his exigence demonstrated deep familiarity with the theory and practice of project
    management.


    I later learned that Greg’s focus on quality assurance (preventing mistakes) rather
    than on quality control (fixing defects) was a team-building effort where the
    goal was to reinforce the attention to details skill and to get the technology
    right the first time, a very lean approach. Greg’s teams delivered all their projects
    on time, and the go-live monitoring phase was exceptionally quiet indicating successful
    technology adoption. Greg’s projects were closed out early because the new technology
    was predictable, reliable, and fit-for-purpose: technology characteristics that
    bring confidence to end users. When the project finished, vendors were able to
    cleanly depart because poor quality was never an issue; I appreciate that Greg
    took care of his vendors too.


    Dr. Skulmoski also proved himself well-equipped and conversant in adult learning
    and training theory (andragogy), program and subject learning outcomes, instructional
    design, and many other components required for successful learning. Forward to
    March 2015, and we opened the doors of Cleveland Clinic Abu Dhabi on time, and
    all caregivers could use the best-in-class systems to provide compassionate care.
    Greg would go on to accept a professorship at Bond University after a few years,
    and I subsequently carried forward what I learned working with Greg into a dozen
    other contexts in four countries, experimenting, relearning, yet much of the time
    standing on a foundation of certainties forged during my time working alongside
    Greg.


    Throughout all these engagements I have participated in since leaving the site
    of Cleveland Clinic Abu Dhabi, several themes continue to emerge: How can project
    teams simultaneously combine the best of Agile and waterfall delivery methods?
    How can organizations address the “skills gap” in mission-critical fields such
    as cybersecurity? And how can large groups of clients and vendors come together
    to achieve results quickly and amicably?'
