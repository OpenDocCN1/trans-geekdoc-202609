    # UAT 与设计管理


    在 UAT（用户验收测试）期间，最终用户首次看到系统运行，并可能提出设计变更，尽管设计已经过过。如果最终用户提出的重大变更可能挑战完成进度或其他方面的问题，项目经理可能会提出测试可能会延迟的风险。有时，要求的设计变更可以推迟到项目后的优化阶段，而不会延迟你的项目。对重大变更的请求通常可以追溯到设计阶段以及最终用户参与的质量。因此，项目经理确保最终用户充分参与设计工作坊和设计文档评审是审慎的。如果最终用户没有充分参与设计阶段，项目经理可能会在设计阶段提出风险，即由于对已批准设计提出的变更请求，测试阶段可能需要更长时间才能完成。


    为了完成设计阶段，一些项目经理会在为期两小时的会议上与批准方案的用户一起审查设计文档，以降低不理解设计的风险。在“Shields Up”中，我们关注于预防风险而非解决问题（例如，强调质量保证工作）。一旦最终用户完成
    UAT 测试并给予批准，将更新需求追溯矩阵，并将批准记录在会议纪要或电子邮件中。然后，项目经理完成测试报告；这是离开测试阶段的最后一个阶段门。


    ## 测试报告


    测试报告包含测试结果，由项目经理编制（表 11.2）。测试报告的目的是记录测试策略和测试计划概述的测试结果，以确定是否存在足够的质量，以及产品或服务是否准备好发布。在编写测试报告时，参考测试策略和计划以确保完整性是审慎的。


    在线搜索可以许多测试报告示例和模板，这些可以指导项目经理和团队根据其项目和受众定制测试报告。测试报告开发后发送给项目利益相关者审批。一旦获得批准，测试阶段即完成，开始过渡到生产阶段。


    最后，在进入生产过渡阶段（`T2P`）之前，某些网络安全项目并不适合技术测试，例如审计或培训项目；然而，质量保证和质量控制仍然有其作用。例如，可以使用同行评审来发现网络安全审计中的缺陷；同事可以审查审计结果以发现任何缺陷。在开发网络安全培训课程后，最佳实践是对培训进行试点测试，以确定是否达到了学习成果（例如，完成质量控制检查）。


    ### 表 11.2 测试报告内容


    | 内容 | 注释 |

    | :--- | :--- |

    | 正文 | |

    | 测试报告概述 | 说明测试目的和整体结果（例如，测试成功），这是读者在测试报告中查找的首要内容。你可以添加 UAT 已成功、最终用户已验证系统质量并已准备好发布等信息
    |

    | 测试结果 | 列出测试指标并突出关注感兴趣的重点或异常情况 | |

    | 缺陷 | 列出已遇到并解决的缺陷，以及任何未未决的缺陷。引导读者查阅附录——待办事项——获取缺陷解决计划 |

    | 结论 | 重申整体结果并强调测试已完成 |

    | 附录 | |

    | 应用概述 | 如果读者对其功能不熟悉，请提供软件应用程序的简要概述。识别集成点、云存储、安全性等 |

    | 测试环境、数据和工具概述 | 对用于测试应用程序的测试环境、数据和工具提供概述和评估 |

    | 测试范围 | 识别范围内和范围外的测试。说明任何未执行的测试及其理由。完整的需求追溯矩阵可以显示测试范围和执行的测试类型 |

    | 待办事项 | 列出完成测试或修复缺陷所需的任何待办事项。某些操作会每个任务提交服务工单，并设定未来的完成日期以配合资源可用性或补丁发布以修复缺陷 |

    | 经验教训 | 识别关于测试环境、测试数据、工具、测试过程等的经验教训 | |


    ## 测试阶段：结语


    与规划一样，测试阶段对项目的成功至关重要。随着项目关键性和重要性的增加，测试的全面和正式性也随之增加。测试是一项质量控制活动；如果需求定义执行得当（质量保证），那么测试阶段的缺陷应该很少。测试计划和策略指导测试，而测试报告记录了结果和下一步。这些文档可以形成一套供未来测试的模板。我们首先测试系统以发现并修复缺陷，然后邀请最终用户参与
    UAT。他们验证需求是否已满足以及服务是否已准备好运行。如果有任何未完成的测试或待办事项，我们会记录它们，并可能为未来的行动提交工单。


    ## 微学习


    测试技术在测试流程和技术方面已经取得了进展。在线搜索并发现：


    *   ITIL 服务验证和测试是如何运作的？

    *   技术缺陷管理是如何运作的？

    *   你如何跟踪测试缺陷？

    *   什么是最好的测试软件？

    *   自动化测试是如何运作的？

    *   下载测试策略、测试计划和测试报告模板以供未来使用。


    ## 第 12 章


    ### 过渡到生产](#index_split_004.html#filepos7864)


    过渡到生产阶段（`T2P`）包括将通过项目交付方法产生的产品或服务交由运营团队的活动。ITIL 的发布管理（`Limited, AXELOS 2019, 125–127`）指导了广泛的活动，例如：


    1. 使用瀑布式或敏捷交付方法交付服务。

    2. 确保新发布可以被跟踪、验证、卸载并在并在时从生产环境中回滚。

    3. 证明偏差、风险和问题可以被管理和控制。

    4. 完成向运营的知识和技能转移。


    向此列表添加网络安全活动，以将服务或产品引入生产环境，例如将新产品或服务添加到安全信息事件管理（`SIEM`）系统中、进行渗透测试以及撤销供应商密码。


    生产过渡的规划可以在规划阶段开始，并在 `T2P` 阶段完成。例如，网络安全应设计到产品或服务中，以满足网络安全需求并确保上线路径平顺（`ISO 2018a,
    7`）。ITIL 发布和部署的关键在于管理成功是新服务在项目和运营之间的无缝过渡（`Limited, AXELOS 2019, 143–145`）。因此，我们制定正式计划向最终用户安全地发布服务，以提高成功概率并符合“一次到位”的思想。


    成功的项目经理会创建并复用 T2P 检查表，以指导产品或服务上线的最终项目行动。


    '
