    will arrive four months late, resulting in a delay to the build phase ([Table
    A3.2](#index_split_029.html#filepos422336)). The procuring SME has spoken with
    the vendor, and there is high certainty that the servers will arrive on or before
    August 14, 2020. The project team has reviewed the schedule and will bring forward
    work such as working on the design, testing, and `T2P` documents to minimize the
    impact of the delay.


