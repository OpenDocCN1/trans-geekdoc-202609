    Indeed, project management is the implied delivery vehicle for many cybersecurity
    projects: “Information security shall be addressed in project management, regardless
    of the type of the project” (ISO 2018a, 10). Information security in the ISO cybersecurity
    standard is intertwined with project management language such as “to ensure information
    security is designed and implemented within the development life cycle of information
    systems” (ISO 2018a, 18). Information systems go through a systems life cycle:
    they are initiated, specified, designed, developed, tested, implemented, used,
    maintained, and eventually retired from service and disposed of (ISO 2018a, vii).
    The “initiate” through to “implemented” mirrors the project life cycle, whereas
    “used” through to “disposed of” reflects operations. We see both the project and
    operations life cycles in the ISO standard. Since project management is inherent
    in the `ISO 27000` Information Security Management suite of standards, one will
    be more successful in implementing cybersecurity projects when one becomes proficient
    with project management.


    The `ISO 27000` family of cybersecurity standards is comprehensive but lacks a
    maturity model; instead, the ISO cybersecurity standard can be considered the
    top level of a maturity model—level five (Leal 2015, 2). One finds traditional,
    waterfall project management firmly embedded in the `ISO 27000` information security
    standard with only a cursory review of the standard. Delivering cybersecurity
    projects using the traditional project management delivery approach and tools
    will align your project with the `ISO 27000` family of cybersecurity standards
    and improve the probability of project success.


    # Information Technology Infrastructure Library (Limited, AXELOS)


    IT departments provide IT services like e-mails, human resource applications,
    productivity applications, and security for the IT ecosystem for their organizations.
    IT leadership establishes policies and procedures to guide life-cycle management
    of the technology ecosystem. Often, IT leadership relies on external standards
    and frameworks to guide their actions. The promise is that if an organization
    follows a framework, business activities can become more predictable and stable
    while maintaining the desired level of quality. One of the significant IT frameworks
    followed by organizations is the `ITIL`. While other IT frameworks exist (e.g.,
    `COBIT` and `ISO IEC 20000`), `ITIL` might be the most popular and widely adopted.


    # ITIL Overview


    ### What is ITIL?

    It is a framework of best practices to deliver and manage IT services like threat
    detection, e-mail, and project management. `ITIL` provides a comprehensive, holistic,
    and systematic approach to delivering value, managing risks and quality, implementing
    lean practices, and building a predictable and stable technical ecosystem supporting
    growth and resilience. `ITIL` can guide teams to automate processes, improve IT
    services, and integrate technology into business practices. The `ITIL` way of
    delivering and managing technology is one of the most popular globally (Berger,
    Shashidhar, and Varol 2020, 1) and therefore is considered the global de facto
    standard (Tsunoda and Kino 2018, 1). The `ITIL` way of technology management is
    the theoretical foundation in Shields Up upon which we build a hybrid project
    management approach to cybersecurity projects.


    `ITIL` prominence has attracted research interest (Berger et al. 2020, 1–6; Göbel
    and Cronholm 2015, 1–22; Marrone and Kolbe 2011, 363–380; Ramakrishnan 2014, 159–168),
    and the following benefits of `ITIL` have been identified:


    * Improved IT services by following proven best practices and processes (Göbel
    and Cronholm 2015, 6).

    * Improved benefits realization as `ITIL` adoption matures (Marrone and Kolbe
    2011, 377).

    * Improved customer satisfaction by delivering services that meet business needs
    (Marrone, Kiessling, and Kolbe 2010, 381).

    * Improved productivity such as first call resolution gains (Marrone et al. 2010,
    378; Berger et al. 2020, 1).

    * Improved communications through common terminology (Göbel and Cronholm 2015,
    6).

    * Improved return on investment (Marrone et al. 2010, 378).

    * Reduced IT costs (Göbel and Cronholm 2015, 6).


    `ITIL` is widely adopted and growing in part due to the potential benefits; indeed,
    we see statements like “ITIL Foundation is the most widely held certification
    this year” (Global Knowledge 2021, 22). Even if your organization has not formally
    implemented `ITIL`, you may be following `ITIL` practices such as incident management
    because `ITIL` practices are considered best practices (Zaydi and Nassereddine
    2020, 1; Sliep and Marnewick 2020, 4).


    `ITIL v4`, released in 2019, is a major departure from the previous versions.
    It reshapes the relationship with customers, processes, and value and embraces
    new ways of working like lean management and agile project management. `ITIL 4`
    takes a strategic and holistic approach to meeting organizational needs through
    the Service Value Chain to deliver value to the user of the `ITIL` service (Limited,
    AXELOS 2019, 66). `ITIL 4` focuses on the entire life cycle of the service called
    the Service Value Chain.


    # ITIL Service Value Chain


    Organizations begin their `ITIL` journey by considering the `ITIL` Service Value
    Chain (`[Figure 4.7](#index_split_013.html#filepos120271)`). The value stream
    is a process to create and deliver products and services to consumers (Limited,
    AXELOS 2019, 66). Simply, the Service Value Chain process begins when an opportunity
    or need triggers a new service.


    ![](images/00040.jpg)


    Figure 4.7 ITIL service value chain


    The six Service Value Chain activities include the following (Limited, AXELOS
    2019, 66):


    1. Plan: Arrive at a shared understanding of the project scope and the four dimensions.

    2. Improve: Continuously improve the products, services, and processes across
    the value chain and four dimensions.

    3. Engage: Develop good relationships with stakeholders to understand their requirements
    better.

    4. Design and transition: Implement products and services that meet the stakeholders’
    expectations for quality, costs, and time to market.

    5. Obtain/build: Provide the service or product when and where each is required.

    6. Deliver and support: Support the products and services to the agreed requirements
    and performance specifications.


    While these Service Value Chain activities appear to be sequential, the planning,
    continuous improvement, and engaging stakeholders activities occur throughout
    the Service Value Chain process.


    These Service Value Chain activities occur within the context of four dimensions
    of service management that offer insight into different perspectives of service
    management. These dimensions of service management need to be planned and managed
    at a micro (project) level through to a macro (organization) level of service
    (Limited, AXELOS 2019, 36):


    * Organizations and people: The Service Value Chain activities occur in an organizational
    setting and through the effort of people. The organization’s governance and communications
    systems must be considered when planning and executing activities (e.g., a cybersecurity
    project).

    * Information and technology: The required information, knowledge, and technology
    are considered when planning and delivering Service Value Chain activities. One
    considers the feasibility and impact of the information, knowledge, and technology
    dimension to manage and deliver the service. The information and technology dimension
    is central to most cybersecurity projects.

    * Partners and suppliers: The relationship with other organizations is considered
    when planning and executing Service Value Chain activities. Outsourcing, partnering,
    and other relationships with external SMEs are common in cybersecurity projects
    and are considered in cybersecurity projects.

