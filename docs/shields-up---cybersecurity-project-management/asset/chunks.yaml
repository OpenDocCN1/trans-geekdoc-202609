    \ “Organizations are increasingly investing in AI capabilities to expedite and\
    \ personalize customer service, reduce human bias, and increase productivity”\
    \ \n\n || \n\n> These business requirements sound good, but that is a lot of technology\
    \ to be secured! \n\n |\n\n| \n\n> Blackburn, LaBerge, O’Toole, and Schneider\
    \ (2020, 3) \n\n || \n\n> “Bold, tightly integrated digital strategies are the\
    \ most effective approach to digital transformation” \n\n || \n\n> Bold! I’m already\
    \ working overtime to keep our data and systems safe and secure \n\n |\n\n| \n\
    \n> Gonzalo, Harreis, Altable, and Villepelet (2020, 5) \n\n || \n\n> “Companies\
    \ must accelerate their online capabilities in both demand generation and operations\
    \ management” \n\n || \n\n> Accelerate? I already stated I am working overtime!\
    \ \n\n |\n\n| \n\n> Skilton and Hovsepian (2018, 60) \n\n || \n\n> “The near to\
    \ longer-term impact of artificial intelligence and the fusion of intelligent\
    \ systems into industries, individuals, and societies will have a profound impact\
    \ on the role of the human at work and human experience” \n\n || \n\n> I knew\
    \ this 10 years ago! I live the profound impact systems have every day! \n\n |\n\
    \n| \n\n> PMI (2018, 6) \n\n || \n\n> A PMI report found 85% of the jobs that\
    \ will be available by 2030 haven’t even been invented yet! \n\n || \n\n> I can\
    \ barely keep current technologies safe, let alone technologies required to support\
    \ jobs that don’t yet exist \n\n |\n\n| \n\n> Scheibenreif and Raskino (2021,\
    \ 1) \n\n || \n\n> “Machine customers represent the biggest new growth opportunity\
    \ of the decade. In fact, by 2030, at least 25% of all purchasing decisions will\
    \ be delegated to machines” \n\n || \n\n> Now, I need to think about machines\
    \ being hacked, resulting in machine customers illegally using our credit cards!\
    \ \n\n |\n\nDisruptive Technologies Acceleration\n\nInnovation and technology\
    \ adoption is accelerating, and there is a feeling that if organizations do not\
    \ implement a digital transformation strategy, it may be too late for laggards\
    \ to catch up to technology early adopters (Aaldering and Song 2021, 12). Indeed,\
    \ Covid-19 triggered a massive acceleration of digitization (Scholtz 2021, 2).\
    \ These technologies need to be secured as they can present new vulnerabilities.\
    \ However, as the pace of technology adoption accelerates, so will the need to\
    \ secure technologies also accelerate. Thus, early adopters will likely continue\
    \ to implement technology at an accelerated pace, and laggards will try to catch\
    \ up. The result will be more technology projects and more cybersecurity work\
    \ at an accelerated cadence.\n\nNew Technologies to Protect\n\nThe specific technologies\
    \ and trends are less important here; the general trends related to technology\
    \ adoption are of greater interest. We see the rollout of 5G technologies leading\
    \ to a new era of connectivity, complexity, and opportunity for organizations\
    \ and bad actors. The World Economic Forum (Creese et al. 2020, 6) predicts the\
    \ following transformative technologies will be increasingly important: ubiquitous\
    \ connectivity, AI and machine learning, quantum computing and next-generation\
    \ identify, and access management. Combining technologies like IoT and sensors\
    \ will bring new opportunities and assets to protect. Organizations will increasingly\
    \ move components of their technology ecosystem to the cloud, thereby adding additional\
    \ complexity to cybersecurity efforts.\n\nWe can expect transformative change\
    \ with next-generation computing like computational collaboration, distributed\
    \ computing, and quantum computing resulting in increased computing speed and\
    \ efficiency. Early adopters will have a disruptive advantage and can transform\
    \ strategy, operations, supply chains, and markets (Corbo and Ostojic 2021, 2).\
    \ It is no surprise that our organizations have early adopters who will propose\
    \ new technologies to help us innovate. Expect more proposals that include AI\
    \ technologies. However, these emerging technologies change the risk equation\
    \ with increased and evolving threats, widening attacks, continued structural\
    \ weaknesses, and grave consequences due to cyberattacks (Creese et al. 2020,\
    \ 13).\n\nAI Technologies Become Mainstream\n\nAI is the next big thing (PMI 2019,\
    \ 2). We see AI early adopters in several industries, including advertising, automotive,\
    \ banking, electronics, financial services, health care, insurance, media, pharmaceuticals,\
    \ telecommunications, and transportation (Corbo and Ostojic 2021, 2). We can expect\
    \ AI to be widely applied to:\n\n> 1\\. Automation and productivity improvements\
    \ across the value chain; \n\n> 2\\. Next-generation customer experience; \n\n\
    > 3\\. Transformation in research and product development; \n\n> 4\\. New business\
    \ models, products, and services (Corbo and Ostojic 2021, 2). \n\nTherefore, we\
    \ will see more AI-related projects implementing applied AI applications and services.\
    \ These AI-supported applications and services will need cybersecurity involvement."
