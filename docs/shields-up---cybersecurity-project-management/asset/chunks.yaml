    \ are all rock solid and extensively researched. He has also taken great care\
    \ to engage his readers by creating exercises that will help them adapt their\
    \ reading of this book and apply it to the cybersecurity project management conundrums\
    \ they face today.\n\nShields Up is well-balanced, including meaningfully deep\
    \ summaries of waterfall, Agile, and lean project management approaches, while\
    \ keeping a pace crisp enough to prevent you from ever putting the book down.\
    \ I found myself drawn to continue reading. Greg includes just the right amount\
    \ of detail but includes numerous useful references, making it a suitable guide\
    \ without ever becoming heavy reading.\n\nHybrid project management is a must-have\
    \ ability in today’s business environment, and Greg has elegantly detailed a flexible\
    \ approach to mixing and matching the best of predictive and adaptive project\
    \ management disciplines and allowing the reader to match techniques to suit the\
    \ context of their own cybersecurity project.\n\nFor seasoned professionals in\
    \ project management, Shields Up offers exceptionally clear and succinct explanations\
    \ of critically important practices such as project initiation document structure,\
    \ three-point estimation, risk and issue framework, and quality management. I\
    \ found myself going back to review the text several times, capturing notes and\
    \ slides, and then immediately putting many of Greg’s hybrid project management\
    \ practices into play in my latest project!\n\nAs you will observe in your reading\
    \ of this work, Shields Up is lightweight and eminently practical. I find the\
    \ approach refreshing and uplifting in its directness and simplicity. Like an\
    \ authentically prepared “sugo” or a properly performed press-up, many of the\
    \ fundamentals of project management are superficially understood by many yet\
    \ poorly executed by most. Getting them right, while elusive, can mean obtaining\
    \ extraordinarily results. In this book, Dr. Gregory Skulmoski presents you with\
    \ tangible and effective methods to produce extraordinary results in your cybersecurity\
    \ projects.\n\n—Chris Walker, SHRM-SCP\n\n[Preface](#index_split_004.html#filepos6062)\n\
    \n> Digital business transformation and emerging cyber-physical systems create\
    \ unprecedented security risk \n\n> —Gartner 2020a, 1 \n\nShields Up: Cybersecurity\
    \ Project Management meets the demand for cyber-security professionals to develop\
    \ project management competencies to lead and succeed in their cybersecurity projects.\
    \ Technology adoption and pervasiveness are increasing and perhaps accelerating,\
    \ driven by Fourth Industrial Revolution innovations, and Covid-19 triggered digital\
    \ transformation projects. Shields Up is designed to provide cybersecurity and\
    \ other technology professionals a guide to plan, develop, manage, and implement\
    \ cybersecurity projects.\n\nShields Up is divided into two parts: (i) Rising\
    \ Demand for Technology and Cybersecurity and (ii) Hybrid Project Management.\
    \ [Part 1](#index_split_009.html#filepos39824) frames project management in the\
    \ context of an innovation delivery method; that is, to achieve strategic objectives,\
    \ organizations increasingly initiate projects. The technology forecast is an\
    \ increased demand for technology and cybersecurity. What is driving the demand\
    \ for technology? What is the future foresight (examining possible future scenarios)?\n\
    \n[Part 1](#index_split_009.html#filepos39824): Increasing Demand for Cybersecurity\
    \ Projects\n\nOrganizations that are agile and responsive to changing expectations\
    \ and fleeting opportunities look to technology to gain a competitive advantage.\
    \ They may implement technology to deliver new products and services or make processes\
    \ more efficient by removing waste. By making processes lean and reducing materials\
    \ or the time in the process, organizations attempt to satisfy customers. Satisfied\
    \ customers purchase goods and services and make repeat purchases. Therefore,\
    \ optimization and digitization are common business goals. Organizations also\
    \ collaborate and connect people, systems, and data with technology; we see hyperconnectivity\
    \ increasing and extended digital ecosystems forming. Once digital transformation\
    \ projects are implemented, organizations desire analytics-based decision-making\
    \ capabilities; more technology projects with shortened delivery expectations\
    \ are done right the first time!\n\nIn response to the increased demand for technology,\
    \ organizations also see amplified demand for cybersecurity services ranging from\
    \ protecting data assets to adding the new technology to the organization’s threat\
    \ monitoring systems. Business partners become collaborators in innovation, value\
    \ cybersecurity services, and support increased cybersecurity budgets to secure\
    \ their technology-driven innovations. However, with larger cybersecurity budgets,\
    \ IT leadership is held accountable to meet business expectations. An issue facing\
    \ the profession is a severe cybersecurity skills gap; organizations struggle\
    \ to meet the demand for cybersecurity services due to a shortage of qualified\
    \ cybersecurity professionals, including project managers. Many organizations\
    \ have unfilled cybersecurity positions with long recruitment times. A consequence\
    \ of these dynamics is cybersecurity professionals are asked to lead routine cybersecurity\
    \ projects, leaving more complex cybersecurity projects for experienced project\
    \ managers.\n\nOrganizations not only face challenges of implementing and managing\
    \ more technologies, keeping systems and information secure, and completing work\
    \ despite unfilled cybersecurity positions, they may also see more cybersecurity\
    \ regulation. Governments and regulatory bodies are introducing cybersecurity\
    \ regulations, and some organization are obligated to comply. Cybersecurity maturity\
    \ models provide a pathway and guidance toward compliance and maturity targets,\
    \ such as the Cybersecurity Capability Maturity Model (C2M2). Cybersecurity regulatory\
    \ compliance drives more cybersecurity projects such as internal and external\
    \ audits.\n\nOrganizations leverage cybersecurity and related standards and frameworks\
    \ to fulfill cybersecurity expectations and requirements. There are two prominent\
    \ cybersecurity standards to guide organizations to optimize their services: the\
    \ Framework for Improving Critical Infrastructure Cybersecurity by the National\
    \ Institute of Standards and Technology (NIST) and ISO 27001 Information Security\
    \ Management (National Institute of Standards and Technology 2018, 1–55). IT departments\
    \ may follow the Infrastructure Technology Information Library (ITIL) standard\
    \ to meet the demand for a service or product through planning, designing, developing,\
    \ testing, implementing, operating, and optimizing phases to deliver value to\
    \ the end user. While project management is explicitly embedded in ITIL, project\
    \ management standards guide delivering value through a continuum of delivery\
    \ approaches ranging from the predictive traditional (waterfall) project management\
    \ delivery approach to adaptive agile techniques like Scrum and Kanban. The Guide\
    \ to the Project Management Body of Knowledge (PMBOK® Guide) and PRINCE2 are two\
    \ prominent project management standards supported with professional certifications.\
    \ Central to cybersecurity, ITIL service management, and project management is\
    \ quality management and the ISO 9001 quality management standard that guides\
    \ organizations along a continuous improvement path."
