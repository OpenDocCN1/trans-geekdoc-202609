    Thus far, we have met and planned in small groups with the sponsor and contributing
    SMEs. Our goal is to create a project plan to present to our project sponsor and
    leadership for approval to proceed with our project and leave the planning phase.
    We used the `project charter/PID` (project priority, scope, rationale, out of
    scope, `WBS`, `Gantt chart`, etc.) to orient and align our project team. We have
    a good understanding of our risks and issues and documented risks and issues in
    the risk register, and our project plan reflects a foundation of risk and issue
    management. Once we have a high-level plan, we schedule our first all-hands team
    meeting to “endorse” our project plan in a project planning workshop (`PPW`).


    # Project Planning Workshop


    We exit the planning phase and begin the design phase when the project plan is
    approved (also known as the baselined project plan). The project plan contents
    vary according to the complexity and importance of the project, the audience who
    approves the project plan, and the reputation of the project manager. New project
    managers delivering complex and critical projects may need to develop more comprehensive
    plans.


    The `PPW` brings together contributing stakeholders and the project sponsor. The
    high-level plan is presented for their endorsement before submitting it to leadership
    for formal approval (`[Figure 8.1](#index_split_018.html#filepos235407)`).


    1. **Background**: Begin by welcoming the `PPW` participants to the workshop and
    giving an overview of the workshop, to endorse the project plan. You can explain
    the delivery approach (e.g., predictive) and the governing stage gates.

    2. **Scope**: Confirm the project scope, `WBS`, rationale, and out of scope items.
    The results of the three questions (`Done–Won–Who`) can be summarized, and the
    approved project priority using the `Priority Triangle` can also be presented.
    Ask if any key stakeholders have been missed. Some use an infographic project
    charter to align the stakeholders.

    3. **Schedule**: Present the project schedule next. The goal is to get commitment
    from the stakeholders to contribute to the project according to the schedule.
    Show the high-level `Gantt chart` to orient the workshop attendees to the project
    timelines and see if it needs to be revised. Next, show the high-level network
    diagram that illustrates the schedule logic and critical path. The project manager
    discusses key activities where broad involvement is required (e.g., design workshops,
    user acceptance testing, and training) and conveys that the project can be delayed
    if there is insufficient attendance. It is a perennial risk to get project participants
    to attend design workshops, training, and testing events when their operational
    tasks need to be completed, especially if that work is tracked to a service level
    agreement (e.g., incident resolution time). Therefore, it is beneficial to set
    expectations that the project can fail without their assistance. Again, we welcome
    stakeholder feedback.

    4. **Budget**: The high-level project budget is presented for comments. However,
    the budget is sensitive in some projects and organizations and not presented in
    the `PPW`. (Your finance and procurement colleagues can assist you with procurement
    [e.g., vendor selection] if it has not already been completed.)

    5. **People**: Project communications and resource management are presented. Effective
    communications will align with the project milestones, phases, and project priority.
    We communicate through meeting minutes and status reports. We use templates to
    guide content development (e.g., schedule and budgets) to share project information.
    The `RACI chart` can be used but might be too detailed for the project.

    6. **Risks and issues**: Finally, the main risks and issues are presented. The
    focus is on prevention and mitigation. We describe how we use the risk register
    and status reports.

    7. **Next steps**: We conclude the meeting with the next steps: the project manager
    updates the plan and schedules the meeting with the approvers.


    The `PPW` is an early milestone where the project plan is presented presented.
    Presenting the project plan to others can be intimidating; however, a systematic
    approach will position you well. There is a common risk in meetings that the discussion
    could be side-tracked and take the meeting in an unintended direction. One technique
    to keep the meeting on track is setting up a flowchart to “park” important items
    out of scope. With the project feedback, attention to design, content flow, and
    messaging will pay future dividends.


    # Project Change Management


    We use the project change process `([2](#index_split_018.html#filepos31841))`
    (`[Figure 8.10](#index_split_018.html#filepos312335)`) to approve the project
    plan and later to approve changes. Change management is fundamental to ITIL service
    management and is reflected in change enablement (Limited, AXELOS 2019, 112–115)
    and organizational change management practices (Limited, AXELOS 2019, 90–91).
    Managing project changes using a management process is best practice.


    The change management process begins with a request for a new project or a change
    to an existing project (e.g., change the schedule). The project manager analyzes
    the requested change (e.g., assesses feasibility and impact to the project and
    program) or develops a project plan. The project manager then presents the change
    or project plan to the decision makers. If the change or project plan is denied,
    the project manager informs the requester. If approved, the project manager implements
    the change. Not seen in the process diagram is the option for the approvers to
    require more information or request a change, and the project manager goes into
    an iterative cycle. These iterations can waste time; therefore, we want to avoid
    iterations and get approval the first time the change or project plan is presented.


    While the project manager develops the project plan, he periodically updates the
    approvers, so their input also guides project plan development. Therefore, when
    the project plan is endorsed by the project contributors (e.g., SMEs), the approvers
    are already familiar with the project plan. Before the change control meeting
    where the approvers will approve or reject the project plan, the project manager
    informally previews the high-level plan with the committee approvers and revises
    where necessary. The result is the approvers will be ready to approve the project
    plan in the change control meeting and you will avoid revision iterations.

