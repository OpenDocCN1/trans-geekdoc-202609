    A common approach to documenting the project requirements and design is to meet
    with the end users in a series of design workshops. The basic process is to meet
    in a workshop setting to elicit the design from stakeholders, document the required
    design in a design document(s), and then approve the design. Once approved, the
    design phase ends, and the build phase begins. A common risk is that the workshops
    might not be fully attended, resulting in a flawed or incomplete design being
    approved and then built. During testing, the users will inform the technical team
    that the design is “defective.” Therefore, one needs to prevent and mitigate poor
    workshop attendance. One prevention measure is to invite managers to the workshop.
    Their attendance conveys the workshop’s importance. If one’s boss attends, the
    worker is more likely to attend the workshop. One mitigation action is to repeat
    workshops for critical SMEs who may miss a design workshop. While repeating workshops
    can be resource intensive, adding additional workshops to accommodate principal
    SME’s input is sometimes unavoidable to progress according to the schedule.


    The project manager may use a design template from the PMO to document the design.
    Templates are a quality assurance aid and are used to develop a design document
    expediently. (You can find ITIL compliant design templates and workshop agendas
    online if your organization does not have its own.) The design document(s) needs
    to be approved as with the project plan. We can take a similar approval approach
    as we did in the planning phase. We inform the approvers of our progress, listen,
    incorporate their feedback, and then circulate the design document to the approvers
    for their approval. Once the design document is approved, the design phase ends.
    The technical team begins the build phase by building the product or service according
    to the specification in the design document(s).


    ## Design Phase: Final Thoughts


    The design phase produces a design that can be built and tested that meets the
    end-user’s expectations. Value is designed with the end users in design workshops.
    Business analysts specialize in elaborating and documenting the design, requirements,
    reports, and other elements. Our goal is to produce a design that accurately reflects
    the end-user’s and sponsors’ expectations from a project management perspective.
    The project manager schedules a series of design workshops and invites different
    team members to complete designs like a detailed application design, an integration
    design, and a low-level infrastructure design. There is a potentially high impact
    risk that not all required SMEs may attend the scheduled workshop due to other
    priorities. Therefore, one may mitigate representation gaps by scheduling additional
    workshops. Once the design is documented, it is circulated to the SMEs for their
    feedback. The feedback is used to update the design documents and is circulated
    for approval.


    ### Microlearning


    Critical work is completed in the design phase, and there have been many advances
    related to improving design. Prior to searching online, review the microlearning
    activities in the “Technology Analysis” section in [Chapter 7](#index_split_017.html#filepos215214)
    as they may relate to design phase activities. Search online for:


    > • What are the steps in systems analysis and design?


    > • How does ITIL work?


    > • How does ITIL 3 service design work?


    > • What is service catalog management? Capacity management? Availability management?
    Service continuity management? and so on


    > • How does the ITIL 4 business analysis practice work?


    > • What is design thinking?


    > • What is business process design?


    > • What is a design workshop agenda?


    > • How do we document a design?


    > • “ITIL service design templates”


    ## [CHAPTER 10](#index_split_004.html#filepos7643)


    ### [Build Phase](#index_split_004.html#filepos7643)


    The focus of the build phase is to follow the requirements in the design document(s)
    and build the product or service. Building is a technical effort, and it often
    requires minimal overview from the project manager other than to track and control
    progress according to the schedule. The ITIL Service Value System guides the build
    phase, where the project team works together as a system to build the service
    for the user (Limited, AXELOS 2019, 17–18). Some organizations document the build
    in an “as-built” document. Once the product or service has been built, and the
    build stage gate criteria are satisfied, the project moves to the test phase.


    ### Microlearning


    Following are some exercises to enhance your understanding of the build phase:


    > • How does as-built documentation work?


    > • What are the best practices for as-built documentation?


    > • Search for “build phase templates.”


    ## [CHAPTER 11](#index_split_004.html#filepos7754)


    ### [Test Phase](#index_split_004.html#filepos7754)


    Now that the product or service is built, we move to the test phase and plan testing
    ([Figure 6.2](#index_split_016.html#filepos202976)). Testing is a quality control
    activity: find and fix defects. We are fortunate to have consistent and broad
    guidance from quality, service, and project management specialties to apply to
    testing activities. (The NIST cybersecurity framework is operationally focused,
    and testing during a cybersecurity project is not directly addressed.) For example,
    the ISO `9001:2000` quality management standard guides the user on how to deliver
    products and services: “In planning product realization, the organization shall
    determine the following, as appropriate: … c) required verification, validation,
    monitoring, inspection, and test activities specific to the product and the criteria
    for product acceptance; …” (ISO 2000, 30). We are guided to test and involve our
    stakeholders to verify the value we are delivering. Testing is critical to quality
    management and is a critical success factor in Shields Up.


    Testing during a project is directly addressed in ITIL’s Service Value System
    in its General Management Practices—Testing (Limited, AXELOS 2019, 24). Shields
    Up is aligned with the ITIL approach to delivering capability and includes the
    build, test, and deliver (T2P) phases ([Figure 6.2](#index_split_016.html#filepos202976),
    the project delivery approach—project phases). However, you can begin developing
    the test strategy and plan earlier in the project if you have spare capacity.
    Again, you can use templates or a previous test strategy and plan as a starting
    point.


    Testing is an integral part of project management; for example, testing is part
    of the PMBOK® Guides. “During the planning phase, the project manager and team
    determine how to test or inspect the product, deliverable, or service to meet
    the stakeholders’ needs and expectations…” (PMI 2017a, 285). The PMI standard
    frames testing as a phase within the project life cycle: “Test. Final quality
    review and inspection of deliverables are carried out before transition, go-live
    or acceptance by the customer” (PMI 2021, 105). Thus, testing is a critical quality
    control activity embedded in quality management, service management, and project
    management standards and a central component in the Shields Up hybrid project
    management approach. We can begin developing a test strategy and plan as early
    as the planning phase on some projects and continue its development through to
    the test phase.


    #### Test Strategy


    Begin test planning by developing a test strategy and test plan. The test strategy
    may include a diagram of the testing process ([Figure 11.1](#index_split_021.html#filepos331839))
    to illustrate the process and participants.

