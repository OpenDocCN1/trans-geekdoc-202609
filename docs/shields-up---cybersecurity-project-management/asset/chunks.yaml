  trans: '


    为了提高变更控制过程的成功率，尝试理解你的受众的期望；审批者想要什么？我们可以讲述这样一个故事：项目计划是与利益相关者共同制定并获得认可的。审批者对关键风险、问题以及你的处理计划感兴趣。他们想知道你如何在整个项目期间让他们知晓进展。因此，你可以通过协作、在风险管理的基础上制定项目计划，并遵循混合项目管理方法来增加获得批准的概率。某些组织遵循“审批链”，从业务/赞助人的审批开始，以高级
    IT 领导的审批结束。其逻辑是让业务代表首先批准项目计划；一旦他们批准，IT 部门就会批准。项目计划获得批准后，归档提供你继续执行的会议纪要。


    ## 无处不在的网络安全规划


    将网络安全构建到项目中是一种良好的做法，而不是在项目准备上线时才添加网络安全。有很多资源可以指导包含网络安全的项目规划，包括 ``ISO 27002` 信息技术-安全技术-信息安全控制实践规范（`ISO
    2018a`, `1–90`）：


    > 1. 确保开发环境和测试环境是安全的。

    > 2. 在设计中添加安全需求。

    > 3. 在里程碑中包含安全。


    系统性的项目规划可以转变信息曲线，提高网络安全项目的成功概率。


    ## 计划阶段：结语


    项目规划是项目的一个基础部分，对成功至关重要。当人们评估项目失败的根本原因时，规划和风险管理不足以及测试不当经常被提及。因此，请为项目规划留充足的时间。遵循集成且精益的规划过程可以增加项目成功的概率。我们的目标是尽早了解更多项目，以避免项目后期出现昂贵的变更。我们可以通过
    `Project Management Gizmo`、`Priority Triangle`、`Done–Won–Who` 和 `PLOs` 等项目规划工具来转变信息曲线。这些工具揭示了风险和问题等基本信息；遵循风险管理过程可以将风险和问题纳入控制范围。


    我们应用重用模板等质量保证和控制技术来降低风险。我们在安全方面进行规划和设计，以便我们交付的技术更有可能符合我们的技术生态系统。我们需要传达的一个信息是，我们的项目可能会失败。然而，通过利益相关者、赞助人和领导层的参与，我们更有可能成功。最后，我们将项目计划封装成一份带有品牌标识、吸引人的布局和设计的专业报告。全面且具有吸引力的设计让读者确信他们选择了正确的项目经理。


    ## 微学习


    项目规划是一项随着使用而提高的技能。以下主题可以提高你对项目管理的理解和应用，并提高项目成功的概率。在网上搜索以下主题以深对项目规划的理解：


    > • 如何制定项目沟通计划？

    > • 如何使用风险登记册？

    > • 搜索“项目规划模板”。

    > • 搜索“项目规划软件”。


    我领导过一个项目，欧洲供应商在 12 月和 1 月关闭了办公室，因为他公司 75% 的人员（总共 18 人）患了流感。老板照顾他的团队并关闭了公司一个月来帮助大家恢复。我们的供应商在
    1 月中回到项目，我们的项目延迟了三周。我们使用变更控制过程重新制定了项目进度表。


    带有“泳道”的跨部门流程图是说明流程和任务所有权的有效方法。我们在精益六西格玛流程优化项目中使用跨部门流程图来记录现状及其“痛点”。我们通过优化来重绘流程，以说明步骤和痛点的减少。使用跨部门流程图绘制流程对于项目参与者来说是一项实用技能。


    ## 第 9 章


    ### 设计阶段


    项目的启动是为了交付产品或服务。设计阶段是根据用户需求为产品或服务开发设计。技术项目通常有多个设计文档，例如应用程序详细设计、低级基础设施设计和集成设计。目标是记录与产品或服务用户共同开发的设计，然后批准该设计。因此，终端用户和技术团队共同工作开发一个提交审批的设计。某些组织设有业务分析师协助设计活动以及需求引导和文档编制。一旦设计获得批准，项目团队将移动到下一个阶段，技术团队将根据批准的设计来构建产品或服务。系统分析和设计是高等教育水平信息系统课程的核心课题，超出了我们项目管理的视角范围。然而，项目经理负责设计阶段，并应该熟悉系统分析和设计的基础。


    ## 设计阶段最佳实践


    `ITIL 4` 为设计服务提供了详细的指导，并引导读者采取整体设计方法。质量、风险和项目管理共同促成了令终端用户愉悦的设计。然而，如果不遵循这种整体方法，则可能无法交付全部价值（`Limited,
    AXELOS 2019, 34`）。还可以通过设计思维技术（`Defossez, McMillan, and Vuppala 2020`, `4`）和精益六西格玛方法来优化流程。例如，我们可以通过设计网络安全功能来改进设计，而不是在过渡生产环境阶段后期才考虑网络安全。


    项目团队需要考虑整个项目中的风险，并受 `ITIL` 风险管理实践指导（`Limited, AXELOS 2019`, `95–97`）。将风险管理应用于设计的示例是应用网络安全黄金法则：不要构建你无法充分保护的东西（`Skilton
    and Hovsepian 2018`, `207`）。我们还被提醒，如果没有彻底的项目计划且不遵循良好的设计实践，我们可能会失败（`Limited, AXELOS
    2019`, `132–134`）。如果你正确地设计并遵循精益方法实施设计，你更有可能优化价值。


    '
