    | `CIS CSC 10`, `COBIT 5 APO12.06`, `DSS02.05`, `DSS03.04`, `ISO/IEC 27001:2013
    A.16.1.5`, `NIST SP 800-53 Rev. 4`, `CP-10`, `IR-4`, `IR-8` |

    | | `改进 (RC.IM)`：通过将教训整合到未来的活动中，改进恢复计划和过程 | `RC.IM-1`：恢复计划包含了教训 | `COBIT 5 APO12.06`,
