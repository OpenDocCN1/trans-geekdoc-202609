    Some cybersecurity professionals add business-related skills by taking courses
    in effective communications, conflict resolution, emotional intelligence, budgeting,
    time management, and so on, depicted in forming a horizontal bar over the I-shape,
    transforming the shape into the T-shape. T-shape professionals have both technical
    and business skills and have expanded opportunities such as managerial roles;
    they can provide more value to their organizations and have improved career sustainability.
    Those who rise to chief information security officers (`CISOs`) have a foundation
    of technical skills, capped with a broad and deep business skill set. Conduct
    your job search for `CISO` positions, and you will find job requirements that
    emphasize the business skill set, such as:


    ![](images/00016.jpg)


    Figure A4.1 Competence development journey


    1. Provide guidance to the `CIO` and the `C-Suite` leadership team and define
    and deliver strategic objectives while building goodwill and positive relationships.

    2. Lead information security strategic planning and budgeting cycles supported
    with security and compliance targets, strategies, metrics, and reporting dashboards.

    3. Create education and awareness programs that improve cybersecurity hygiene.


    The `CISO` needs a foundation of technical skills with a greater emphasis on business
    skills to manage the entire `ITIL` Service Value System that includes projects
    and operations to deliver value for the organization. These three examples of
    `CISO` job requirements all involve project management: the foundation of delivering
    innovation, digital transformation, and sustained value. Therefore, understanding
    your career targets and the type of role you aspire to can help you with effective
    career planning.


    ## Career Planning Process


    If done correctly, career planning is a regular occurrence, such as during annual
    performance assessments so that your organization can support your development
    goals (Oltsik 2020, 6). Your career planning can be input into the performance
    appraisal. Some consider annual performance assessments an administrative burden;
    however, career planning can propel one’s career with a strategic approach. Like
    project success, great careers do not happen by accident; great careers are planned,
    managed, and controlled. Career planning can be completed in three steps:


    1. **Self-assessment**: Hiring managers use various “inventories” to assess capabilities
    and aptitudes in the new hire selection process. Many of these inventories are
    available to gain additional insight during career planning (e.g., search online
    for career and career planning inventories for more formal self-assessment methods).
    These often can help identify strengths and areas to develop. Where are you in
    your competence development? Is your career development shape an I, or are you
    forming a T-shape career for balanced development (`[Figure A4.1](#index_split_030.html#filepos435178))`)?

    2. **Exploration**: Think about the type of position you would like in 5 to 10
    years. Search online for job descriptions for those target positions to understand
    the ideal competency set. For example, if you aim to become a cybersecurity manager,
    search online for this position to understand better the types of experiences
    and competencies that people in these target positions possess.

    3. **Career action plan**: Conduct a gap analysis between your competencies and
    your target job (e.g., cybersecurity manager) competencies. Then, develop a plan
    to acquire the related experience, knowledge, and skills.


    Notice the similarity with cybersecurity maturity best practices? Complete a self-assessment,
    identify gaps, and develop an action plan to reach your targets. We follow this
    process in our organizations, and we can use it in our career planning.


    ## Technical Competence Development


    We are offered a wide array of career development opportunities, but we should
    be strategic: think about the skills needed today and in the future. Continue
    your technical development and add skills in emerging technologies such as collaborative
    AI, multimodal interfaces (e.g., seeing, hearing, and touching), and secure distributed
    ledgers (e.g., blockchain). Think about preparing for tomorrow’s technical opportunities.
    Identify future technical skill shortages and begin learning about solutions such
    as machine learning. Create a plan to acquire these skills and knowledge; certifications
    are a natural pathway to technical competence. However, many certifications have
    a short-value period; some certifications can become obsolete as emerging technologies
    surpass the underlying technology. For example, Microsoft planned the retirement
    of `MCSA`, `MCSD`, and `MCSE` certifications as the cloud gains prominence and
    `Azure` certifications emerge (Foley 2021, 1). The crux is that maintaining competence
    through technical certifications is a never-ending pursuit.


    ## Nontechnical Competence Development


    The pathway to senior IT roles is through a combination of technical and nontechnical
    excellence. When you search online for “what skills do CISOs need?” notice that
    the lists include very few technical skills! Most of the `CISO` skills are soft
    skills like effective communications, collaboration, and negotiation. Indeed,
    these are the types of skills robots lack! We discover that strategic planning
    and delivering innovation are frequently listed as essential skills; CISOs use
    project management tools and processes to bring strategy and other innovations
    to life. Therefore, your development journey through project management can bring
    you closer to the `CISO` and other senior roles.


    Many nontechnical growth opportunities range from formal studies in a Master of
    Business Administration (`MBA`) degree to training and certification opportunities
    like Lean Six Sigma and project management certifications (Ottmann and Skulmoski
    2020, 3). Certifications take less time to complete than university degrees and
    can fill in competencies gaps. The `MBA` degree is also variable where one can
    do a general `MBA` degree or an applied degree (e.g., `MBA` with Project Management
    Specialization or `MBA` in Innovation Management). Universities are improving
    their service value streams by offering many learning pathways like part-time
    studies, stackable degrees, and microcredentials to tailor learning to the individual
    student.


    Approach your nontechnical training from a holistic perspective; think about the
    service value stream and how organizations approve projects to deliver innovations
    to the end user. Organizations follow the project management process and then
    hand over the product or service to operations to manage and optimize the service
    (`[Figure 1.1](#index_split_010.html#filepos43335)`). Therefore, a well-rounded
    cybersecurity professional will have training and education in both the project
    and operations side. A project-oriented certification like the `PMP` or `PRINCE`
    with an `MBA` degree or Lean Six Sigma credential will help prepare oneself for
    leadership roles. Again, look at the competencies of managerial and leadership
    positions listed by recruiters to understand the desired/target skill set.

