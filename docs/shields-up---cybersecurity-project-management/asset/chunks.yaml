- raw: "[Hybrid Project Management](#index_split_004.html#filepos7050)\n\n[CHAPTER\
    \ 6](#index_split_004.html#filepos7179)\n\n[Cybersecurity Project Management](#index_split_004.html#filepos7179)\n\
    \nThe purpose of [Part 2](#index_split_015.html#filepos198404) is to provide practical\
    \ guidance to plan and implement cybersecurity projects. This hybrid project management\
    \ approach originates from theory and standards and has proven best practices\
    \ for implementing technologies like cybersecurity. The intent is that your adaptation\
    \ of the Shields Up approach will also be lean and tailored to your project’s\
    \ and organization’s distinct needs. This hybrid project management approach is\
    \ aligned with leading project management, ISO 9001 Quality Management, ISO 3100\
    \ Risk Management, ITIL, and NIST Frameworks and will help you successfully implement\
    \ cybersecurity and other technology projects. Indeed, delivering new technical\
    \ services valued by our organizations depends on effective project management\
    \ throughout the value chain activities (Limited, AXELOS 2019, 95). Berger et\
    \ al. (2020, 5) recommended that ITIL 4 “is more than capable” of integrating\
    \ service management, risk management, ISO 27001 information security management,\
    \ and the NIST cybersecurity framework. One can bring together the key frameworks\
    \ to deliver cybersecurity projects ([Figure 5.8](#index_split_014.html#filepos197457)).\n\
    \nHybrid Project Management\n\nHybrid project management combines predictive and\
    \ adaptive processes (PMI 2021, 100). One uses a hybrid project management approach\
    \ to adapt to the organizational setting and project; one recognizes that “one\
    \ size does not fit all.”\n\nThe 7th Edition of the PMBOK® Guide emphasizes “tailoring”\
    \ to select the right processes, tools, techniques, and inputs to deliver one’s\
    \ projects (PMI 2021, 131–132). One works from a macro to a micro perspective\
    \ with a quality improvement cycle ([Figure 6.1](#index_split_016.html#filepos201005),\
    \ after PMI 2021, 137).\n\n![](images/00035.jpg)\n\nFigure 6.1 Tailoring your\
    \ project\n\nTherefore, hybrid project management allows the project manager to\
    \ fine-tune the project delivery approach (processes, tools, techniques, and inputs,\
    \ including personnel) to the organization’s needs and project using a tailoring\
    \ approach.\n\nThe first step in the tailoring process is to choose a project\
    \ management approach; most cybersecurity projects can be implemented using hybrid\
    \ project delivery ([Figure 6.2](#index_split_016.html#filepos202976)). Indeed,\
    \ the ITIL framework is flexible and allows organizations to fine-tune the Service\
    \ Value Chain to meet the unique demands of their projects (Limited, AXELOS 2019,\
    \ 18). Most project managers use the traditional project management approach and\
    \ begin their careers by leading routine or less complex projects with low ambiguity.\
    \ One predictably progresses through the project phases, primarily when stage\
    \ gates govern progress. Stage gates (also known as control gates) are decision\
    \ points where leadership can approve or terminate projects. Stage gates are beneficial\
    \ if the project manager is new to managing projects and leadership wants to provide\
    \ guide rails to help the new project manager successfully deliver their project.\
    \ Stage gates are improved if they are measurable, objective, and published in\
    \ advance. For example, we can leave the design phase and enter the build phase\
    \ if the following documents are approved: (i) application detailed design, (ii)\
    \ low-level design for infrastructure, and (iii) integration specification. One\
    \ can also complete a project review at these project inflexion points where project\
    \ status, project feasibility, and perhaps continued relevancy of the business\
    \ case are reviewed.\n\n![](images/00001.jpg)\n\nFigure 6.2 Hybrid project delivery\
    \ approach\n\nA key benefit of stage gates is poorly performing projects can be\
    \ terminated or rescued with replanning and approval. Stage gates are widely used\
    \ to improve rigor, governance, and quality and reduce risk. Stage gates are easy\
    \ to understand, use, and implement. Include stage gates in your cybersecurity\
    \ projects to document what you need to deliver, including terminating the project\
    \ after completing the monitoring period.\n\nShould your organization lack formal\
    \ stage gates, you can establish stage gates and success criteria with your manager\
    \ and sponsor. Aligned with the ITIL Service Value Chain, there are milestone\
    \ documents that the project manager develops, such as an approved project plan\
    \ that completes the planning phase or the test report that completes the test\
    \ phase ([Table 6.1](#index_split_016.html#filepos205263)). In line with lean\
    \ project management, we minimize the amount of documentation our projects produce;\
    \ with experience, the quality of our documentation improves and becomes leaner.\n\
    \nThe hybrid project delivery approach includes the risk management process (identify,\
    \ analyze, treat, and control) in each project phase ([Figure 6.2](#index_split_016.html#filepos202976)).\
    \ Risk management is critical to delivering successful projects (see the Risk\
    \ Management section) and underlies most project management efforts and decisions.\
    \ Finally, the hybrid project delivery approach accommodates iterations when required\
    \ ([Figure 6.2](#index_split_016.html#filepos202976)). For example, we might go\
    \ through an iteration to fine-tune the project scope to initiate the right project.\
    \ Later, we may face design challenges, especially if the technology we implement\
    \ is leading edge. We may complete multiple design iteration cycles to finalize\
    \ the technical design. Likewise, when we test our application, we may encounter\
    \ defects that require multiple attempts to find a feasible and implementable\
    \ solution. These iterations may closely or loosely follow the Scrum method ([Figure\
    \ 5.4](#index_split_014.html#filepos189348)) depending upon the purpose and capability\
    \ of the team.\n\nTable 6.1 Stage gate criteria example\n\n| Stage gate criteria\
    \ |\n\n| --- |\n\n| \n\n> Initiate \n\n || \n\n> Business endorses the project\
    \ (meeting minutes) \n\n> Funding is provided (meeting minutes) \n\n> Feasibility\
    \ is endorsed (presentation to Change Control Board) \n\n> Leadership provides\
    \ approval to proceed (meeting minutes) \n\n |\n\n| \n\n> Plan \n\n || \n\n> Project\
    \ Planning Workshop(s) is completed (meeting minutes) \n\n> budget is baselined\
    \ \n\n> Schedule is baselined \n\n> Project Planning Document is approved (links\
    \ to minutes, schedule, and budget) \n\n |\n\n| \n\n> Design \n\n || \n\n> Design\
    \ Workshop(s) is completed (minutes) \n\n> Project Design Document(s) is approved\
    \ \n\n |\n\n| \n\n> Build \n\n || \n\n> Build Workshop(s) is completed (meeting\
    \ minutes) \n\n> Project Build Document(s) is approved \n\n |\n\n| \n\n> Test\
    \ \n\n || \n\n> Test Strategy Document(s) is approved \n\n> Testing Workshop(s)\
    \ is completed (meeting minutes) \n\n> Test Report Document(s) is approved \n\n\
    \ |\n\n| \n\n> T2P \n\n || \n\n> T2P Workshop(s) is completed (meeting minutes)\
    \ \n\n> T2P Checklist is completed \n\n> Go Live Plan is approved \n\n> Change\
    \ Request is raised \n\n |\n\n| \n\n> Close Out \n\n || \n\n> Close Out Report\
    \ is approved \n\n> Change Control Board approves project closeout \n\n> Project\
    \ and team disbandment are documented and archived \n\n |\n\nThus, hybrid project\
    \ management in Shields Up uses the traditional waterfall project management delivery\
