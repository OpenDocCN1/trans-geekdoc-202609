- raw: "During UAT, the end user sees the system perform for the first time and may\
    \ request design changes, even though the design has been approved. Should the\
    \ end user request significant changes that may challenge the completion schedule\
    \ or otherwise, the project manager may raise a risk that testing may be late.\
    \ Sometimes the requested design changes can be deferred to a postproject optimization\
    \ phase and not delay your project. Requests for significant changes are often\
    \ traced back to the design phase and the quality of the end user involvement.\
    \ Therefore, the project manager is prudent to ensure that end users are fully\
    \ engaged in design workshops and design document review. Should the end user\
    \ not be fully engaged in the design phase, then the project manager may raise\
    \ a risk during the design phase that the test phase may take longer to complete\
    \ due to requests for changes to the approved design.\n\nTo complete the design\
    \ phase, some project managers review the design document with the approving end\
    \ user during a two-hour meeting and reduce the risk of not understanding the\
    \ design. In Shields Up, we focus on preventing risks rather than resolving issues\
    \ (e.g., quality assurance efforts are emphasized). Once the end users complete\
    \ UAT testing and give their approval, the requirements traceability matrix is\
    \ updated, and the approvals are recorded in meeting minutes or in an e-mail.\
    \ The project manager then completes the test report; the last stage gate to leave\
