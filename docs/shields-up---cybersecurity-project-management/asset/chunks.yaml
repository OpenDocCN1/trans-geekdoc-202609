    ## 4. 价值流与流程


    组织的价值流和流程是我们为交付用户认可的服务和产品而遵循的活动和流程。在这一维度上，我们被要求变得精益并对变化保持敏锐。


    从整体角度管理这些 ITIL 4 维度中的工作，将提高项目的成功率，因为我们并不是孤立地工作；这些维度会影响我们的网络安全项目。在规划网络安全项目时，我们可能会考虑这四个维度——风险、问题、假设和约束。


    与其他标准和框架一样，ITIL 4 包含了一些原则，用于指导我们在完成服务价值链中的工作时做出决策和行动。当组织采用这些原则时，它们增加了在交付和服务产品时采用统一方法的机率。这些原则适用于大多数服务价值链活动（Limited,
    AXELOS 2019, 47–48）：


    1. **关注价值**：确保所有活动都能直接或间接地为组织、用户和/或其他利益相关者创造价值。

    2. **从现状开始**：将精益思维应用于价值链活动中，在抛弃现有内容并引入新项目之前，先优化现有的产品和服务。我们寻求利用可用资源，通过系统化的衡量、观察和改进流程来减少浪费（精益六格玛方法与这一原则完美契合）。

    3. **通过反馈迭代推进**：如果可能，增量地交付服务，而不是一次性交付，以降低风险并提高成功交付预期价值的概率。因此，寻找机会将你的网络安全项目拆分为多个较小的项目（例如第
    1 和第 2 阶段）。建立定期的反馈机会以确保价值正在交付。

    4. **协作并提高透明度**：我们通过服务价值链交付服务，通常以团队形式进行，协作可以提高参与度、支持、承诺、持久成果、理解、信任和合作。共享透明度也有助于这些积极结果的产生。

    5. **整体思考和工作**：当作为完整的服务或产品概念进行交付而非单个组件时，价值就会得到提升。当服务价值系统 (`SVS`)、服务管理的四个维度以及这些原则得到协调和整合时，价值就会增加。整个服务价值流的透明化有助于理解、管理和控制。整体思考和整体工作的原则是良好的网络安全实践。

    6. **保持简单实用**：我们力求以最少的步骤完成服务价值链活动。鼓励使用精益思维。

    7. **优化与自动化**：我们寻找改进服务价值链的机会，以最大化我们交付的服务和产品的价值。我们越来越多地使用技术、自动化以及精益六格 DMAIC 过程等质量改进方法来指导改进。


    这些原则是基础性的，因为它们应该在任何情况下指导组织，即使组织目标、人员、项目类型等发生了变化。ITIL 原则旨在贯穿服务价值链的所有活动（例如项目和运营），来塑造组织文化（Limited,
    AXELOS 2019, 17–18）。


    ITIL 4 包含了代表在服务价值链中创建价值的能力的实践（`Table 4.1`）。ITIL 4 发布了实践指南来为服务管理提供资源；可以将这些实践看作你在服务管理中用于交付价值的工具箱。ITIL
    实践可以映射到技术项目中使用的传统项目管理交付方法中，以说明它们之间的关系，包括向生产的过渡 (`T2P`)。


    因此，ITIL 4 拥有一个全面且整体的框架，用于管理网络安全项目等技术服务。ITIL 4 支持根据组织、背景和项目对框架进行定制；支持混合项目管理：“ITIL
    `SVS` 支持许多方法，如敏捷、DevOps 以及传统的流程和项目管理，并具有灵活的以价值为导向的模式”（Limited, AXELOS 2019, 44）。


    ### 信息系统生命周期


    如果你觉得 ITIL 熟悉，可能是因为 ITIL 与我们在大学和学院课程中学到的系统开发生命周期 (`SDLC`) 保持一致。该周期以过程为基础且是迭代的，旨在交付高质量的系统以支持业务和客户预期，与
    ITIL 类似。因此，`SDLC` 采取了面向过程的方法，并具有迭代改进周期（`Figure 4.8`）。`SDLC` 包含了项目活动（从规划到实施）和运营活动（维护和优化）。


    这种传统的系统开发方法也被称为瀑布模型。它经过修改，提供了开发系统的其他替代方法，例如螺旋模型、V 模型、快速应用开发、理性统一过程和敏捷方法（2015,
    52）。


