    \ in Shields Up upon which we build a hybrid project management approach to cybersecurity\
    \ projects.\n\nITIL prominence has attracted research interest (Berger et al.\
    \ 2020, 1–6; Göbel and Cronholm 2015, 1–22; Marrone and Kolbe 2011, 363–380; Ramakrishnan\
    \ 2014, 159–168), and the following benefits of ITIL have been identified:\n\n\
