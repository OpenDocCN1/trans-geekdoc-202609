- raw: "Working in the IT field, we see constant technological change. I am reminded\
    \ that “change is certain in everything except vending machines”; soon, vending\
    \ machines will become digital payment only. The changes underway are detailed\
    \ in the Fourth Industrial Revolution: World Economic Forum where the researchers\
    \ describe the Fourth Industrial Revolution as a digital revolution fusing digital,\
    \ biological, and physical entities (Schwab 2016, 7). A distinguishing characteristic\
    \ is the exponential speed at which these technologies emerge, bringing significant\
    \ impact: “The scale of the impact and the speed of the changes taking place have\
    \ made the transformation that is playing out so different from any other industrial\
    \ revolution in human history” (Schwab 2016, 109). Data processing and communications\
    \ are proceeding at ever-accelerating speed, which stresses data volumes, storage\
    \ capacity, processing, and knowledge created (Creese, Saunders, Axon, and Dixon\
    \ 2020, 10) and can trigger new projects (e.g., upgrade the infrastructure). We\
    \ see some organizations embracing a continuous flow of digital transformation\
    \ projects (Creese et al. 2020, 10), as seen in overall increases in IT budgets\
    \ (Columbus 2020, 1).\n\nWe see people connecting with mobile technologies with\
    \ unprecedented computing power, storage capacity, and functionality to access\
    \ broad knowledge databases. Transformational technologies are emerging like artificial\
    \ intelligence (AI), data modeling, 3D printing, nanomanufacturing, quantum computing,\
    \ large-scale energy storage, and so forth. The popular literature trumpets the\
    \ new age of digital acceleration and change ([Table 1.1](#index_split_010.html#filepos48737)).\n\
    \nOur managers read these articles from digital thought leaders, expecting continued\
    \ and accelerated technological advances. These bring digital opportunities to\
    \ leverage and vulnerabilities to secure. These influential reports now drive\
    \ business strategy, and new technologies change our customer expectations. These\
    \ emerging technological promises are often translated into requests for new projects\
    \ and secure systems. More cybersecurity projects are coming our way!\n\nTable\
    \ 1.1 Digital acceleration and change\n\n| Source || Message || Comment |\n\n\
    | --- | --- | --- |\n\n| \n\n> McHugh (2020, 1) \n\n || \n\n> “The pace of automation\
    \ is accelerating, with more organizations creating fully automated value chains”\
    \ \n\n || \n\n> Now I have to worry about keeping our systems secure and the security\
