    一些网络安全专业人员通过参加有效沟通、冲突解决、情感智能、预算管理、时间管理等课程来增加业务相关技能，这被描述为在“I”型形状上方形成一条水平线，将形状转变为“T”型型。“T”型专业人才既具备技术技能又具备业务技能，并拥有如管理岗位等扩展机会；他们能为自己的组织提供更多价值，并提高职业的可持续性。晋升首席信息安全官（`CISOs`）的人拥有技术技能基础，并辅以宽广而深厚的业务技能组合。在寻找
    `CISO` 职位的机会时，你会发现职位要求强调业务技能组合，例如：


    ![](img/00016.jpg)


    图 A4.1 能力发展历程


    1.  为 `CIO` 和高管领导团队提供指导，在建立良好信誉和积极关系的同时，定义并交付战略目标。

    2.  领导信息安全战略规划和预算周期，并辅以安全和合规目标、策略、指标和报告仪表板的支持。

    3.  创建教育和意识计划以提高网络安全卫生水平。


    `CISO` 需要技术技能基础，但更强调业务技能，以管理整个 `ITIL` 服务价值系统，该系统包括项目和运营，旨在为组织交付价值。这三个 `CISO` 职位要求的示例都涉及项目管理：这是交付创新、数字转型和持续价值的基石。因此，理解你的职业目标和向往的角色类型将帮助你进行有效的职业规划。


    ## 职业规划流程


    如果操作得当，职业规划是一项经常发生，例如在年度绩效考核期间，这样你的组织就可以支持你的发展目标（Oltsik 2020, 6）。你的职业规划可以纳入绩效评估中。有些人认为年度绩效考核是一项行政负担；然而，职业规划可以用战略方法推动个人的职业发展。就像项目的成功一样，伟大的职业不会偶然发生；伟大的职业是经过规划、管理和控制的。职业规划可以通过三个步骤完成：


    1.  **自评估**：招聘经理在招聘入职过程中使用各种“清单”来评估能力和资质。在职业规划期间，可以使用这些清单中的许多来获得额外的见解（例如，在网上搜索职业和职业规划清单，以获取更正式的自评估方法）。这些通常可以帮助识别优势和待发展领域。你在能力发展中处于什么位置？你的职业发展形状是“I”型，还是你正在为了平衡发展而形成“T”型职业（`图
    A4.1`）？

    2.  **探索**：理解你的职业目标和你向往的角色类型可以帮助你进行有效的职业规划。

    3.  **行动计划**：根据你的目标进行差距分析并制定计划。


