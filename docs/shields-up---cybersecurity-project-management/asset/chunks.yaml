    网络安全项目经理的短缺导致了目前强劲的需求，且这种需求在未来将会持续（Oltsik 2020, 36）。与其等待项目经理空缺来领导常规的网络安全项目，不如将网络安全项目经理分配到更具挑战性和关键性的项目中，而将常规的网络安全项目留给非项目经理角色的人员。事实上，一些人建议
    IT 部门为技术人员提供培训，范围涵盖“业务、沟通、领导力和管理技能”（例如，管理项目和倡议）(Oltsik 2020, 45)。


    ## 危机中的职业


    我们的网络安全行业正面临着危机。不仅是因为需要保护的技术越来越多，而且技术也变得日益复杂，导致对网络安全服务的的需求增加（图 3.2）。在新的网络安全技术中，技能缺口尤为严峻（Howard
    2020, 5）。


    此外，还有其他技能缺口的驱动因素，例如组织战略规划不力以及个人职业规划不足。最后，网络安全角色正在从侧重技术转向更广泛的业务伙伴角色，这需要更广泛的技能组合。因此，网络安全技能缺口的驱动因素有很多。


    网络安全技能缺口的影响是多方面且深远的。由于网络安全职位未填以及对网络安全服务的的需求增加，分配给网络安全专业人员的工作量非常重，且压力很大（Oltsik
    2020, 21）。工作量增加的直接结果是网络安全专业人员难以跟上对新技术的学习，也难以充分利用现有网络安全工具的潜力，从而增加了组织的风险（Oltsik
    2020, 37）。网络安全技能缺口持续阻碍着组织的网络安全。


    ## 组织角色


    组织有很多方法可以缓解网络安全技能缺口的挑战。由于网络安全专业人员面临着保持专业能力和网络安全知识的持续压力，他们很难找到时间来开发新技能（Claus 2017,
    8）。因此，组织可以预见技能短缺，并支持现有人员规划他们的网络安全职业，提供培训和发展机会（Howard 2020, 6; Oltsik 2020, 20）。具有远见的网络安全专业人士将积极利用这些知识，与经理和导师一起规划他们的职业。


    ![](img/00013.jpg)


    图 3.2 网络安全技能缺口模型模型


    > **机会**：建议组织为技术人员提供更多支持，例如培训和发展机会；因此，请与您的经理或人力资源部门讨论职业发展。他们可能会提供高质量的培训和教育资金，并帮助提供如外派和横向调动等职业路径。你的组织希望你成功！


    ## 网络安全职业规划


    忙碌的网络安全专业人员在经常进行长时间且高压工作时，往往忽视职业规划，这并不令人意外。相反，网络安全专业人员通常采取非正式且随意的职业管理方法；然而，鼓励网络安全专业人员与转型教练合作，采取系统的方法进行职业规划，并进行整体性发展（Oltsik
    2020, 45）。网络安全专业人员往往侧重于战术（Oltsik 2020, 45），并追逐认证以在技术上进行发展。当 47% 的安全专业人员（样本量 N
    = 327）报告他们渴望成为 `CISO`（首席信息安全官）时——这更多是一个业务职位而非技术职位——那么仅专注于开发技术专业知识似乎是反直觉的（Oltsik
    2020, 17）。因此，作为持续改进的一部分，网络安全专业人员可以从职业规划以及项目管理等非技术领域的更广泛发展中获益。（参见附录 4


    ## 技术框架对齐


    很少组织孤立地提供 IT 和网络安全服务；也就是说，他们通常遵循最佳实践和框架来提供优质的服务和产品。组织遵循外部框架来指导质量、网络安全和项目交付（参见图
    4.1）。


    所有框架都专注于通过可预测地交付高质量的产品和服务来满足客户，持续质量改进驱动创新；交付和优化是这些框架和标准的共同目标。


    ### 质量管理：合的基石


    什么是质量管理？根据国际标准化组织（ISO）9004，通过质量规划、质量保证、控制和持续改进来建立质量政策和流程以实现目标（ISO 2000, 10）。持续改进是为用户提供价值的服务的基础，如果所有项目利益相关者采取持续改进的心态，这种效果将达到最大（Limited,
    AXELOS 2019, 71）。项目管理包括计划、管理和控制项目及其产品或服务以满足利益相关者的目标的流程（例如，提供价值）。项目质量管理还包括过程持续改进（PMI
    2017a, 271）。信息技术基础库（ITIL）、ISO 和项目管理协会（PMI）的质量管理指南密切相关；PMI 侧重于项目背景下的质量管理，而 ISO
    质量管理则更通用。因此，这些标准是对齐的，符合其中一个标准就接近符合其他关于质量管理的标准。


    ![](img/00016.jpg)


    图 4.1 外部框架对齐


    质量管理支撑着与项目管理、服务管理和网络安全服务相关的最佳实践和标准。在规划项目如何管理质量之后，质量管理可以被视为一个三步骤的过程：（a）质量保证、（b）执行工作和（c）质量控制（图
    4.2）。


