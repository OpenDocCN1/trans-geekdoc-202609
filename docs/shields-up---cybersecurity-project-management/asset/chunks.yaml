- raw: "Risk management is a critical success factor for technology projects and is\
    \ a recommended ITIL general management practice (Limited, AXELOS 2019, 95–97);\
    \ get risk management right, and the probability of project success exponentially\
    \ increases. Risk management in Shields Up is aligned with ISO 31000:2018 Risk\
    \ management—Guidelines (ISO 2018b); therefore, when you follow risk management\
    \ in Shields Up, you are aligned with ISO 27000 Risk Management. Lean risk management\
    \ centers on the risk management process supported by a risk register, quality\
    \ management, and simple techniques that can be used on most projects, most of\
    \ the time. Risk management is the process of planning, identifying, analyzing,\
    \ treating, and controlling risks and issues. Risks and issues may be negative\
    \ (e.g., delays) or positive (e.g., opportunities to crash an activity) and can\
    \ be managed with the risk management process and risk register.\n\nThe risk management\
    \ process ([Figure 8.7](#index_split_018.html#filepos287002)) is simple and effective;\
    \ you can use this approach on most projects, most of the time. All project plans\
    \ should include a section about risk and issue management. The project manager\
    \ provides an overview of how risks and issues will be managed and communicated,\
    \ the tools and processes used, and so on. For example, the project manager may\
    \ schedule weekly risk management meetings ([Table 8.1](#index_split_018.html#filepos269497))\
    \ to review the risk register and include risks and issues on the status reports.\
    \ The risk management process is a step-by-step approach. Once a risk is identified,\
    \ it is analyzed qualitatively (high, medium, or low), then treated (risk prevention\
    \ and actions), followed by documenting the risk in the risk register. ITIL and\
    \ project management standards (e.g., PMBOK® Guide and PRINCE2) have common purposes\
    \ and are naturally aligned. Following the risk management process complies with\
    \ international standards and dramatically improves the probability of project\
    \ success. The risk management process appears in [Figure 8.7](#index_split_018.html#filepos287002),\
    \ where the project team uses risk management throughout all the project phases.\n\
    \n![](images/00039.jpg)\n\nFigure 8.7 Risk management process\n\nThe project manager\
    \ and team follow the risk management process and identify risks. Risk identification\
    \ includes the risk cause, event, and effect ([Table 8.3](#index_split_018.html#filepos287865))\
    \ and is documented following risk syntax. The important concept is the risk event\
    \ is written with words that convey uncertainty that the risk may or may not occur;\
    \ for example, we use words like may, could, and might to indicate the risk event\
    \ has not yet occurred but could occur. When the proper risk syntax is used, understanding\
    \ improves and communication risks are reduced. Thus, when we identify a risk,\
    \ we frame the risk as a risk cause, event, and effect to aid effective and efficient\
    \ analysis and treatment.\n\nTable 8.3 Risk management framework and syntax\n\n\
    | Element || Description || Syntax || Analysis || Treatment |\n\n| --- | --- |\
    \ --- | --- | --- |\n\n| \n\n> Risk cause \n\n || \n\n> Risks arise due to a cause\
    \ or reason \n\n || \n\n> Due to manufacturing delays \n\n || \n\n> The probability\
    \ the risk may occur: high, medium, or low probability of occurrence \n\n || \n\
    \n> Actions that can prevent this risk from occurring \n\n |\n\n| \n\n> Risk event\
    \ \n\n || \n\n> Something that may affect your project (positively or negatively)\
    \ \n\n || \n\n> There is a risk that the servers may arrive late \n\n || — ||\
    \ — |\n\n| \n\n> Risk effect \n\n || \n\n> The consequence of the risk event occurring\
    \ \n\n || \n\n> Resulting in a delay in completing the build phase \n\n || \n\n\
    > If the risk occurs, the impact the risk event will have on the project: high,\
    \ medium, or low impact \n\n || \n\n> Actions that can mitigate (soften) the impact\
    \ of the effect of the risk if the risk occurs \n\n |\n\nOnce we identify and\
    \ document the risk event (cause-event-effect), we can complete a qualitative\
    \ risk analysis. First, we assess the probability of occurrence: the likelihood\
    \ the risk cause may occur ([Figure 8.7](#index_split_018.html#filepos287002)).\
    \ Qualitative risk analysis assesses the probability of occurrence as high, medium,\
    \ or low. There are quantitative techniques (e.g., Monte Carlo Simulation) that\
    \ indicate that the probability of occurrence could be an 84.88 percent chance\
    \ of occurring (high) or 24.116 percent chance of occurring (low). However, quantitative\
    \ techniques are more cumbersome (e.g., risk modeling with statistical techniques),\
    \ and the software can be expensive.\n\nAdditionally, many quantitative techniques\
    \ take significant time to model and require large data sets. Instead, in Shields\
    \ Up, qualitative techniques (high, medium, or low probability of occurrence)\
    \ are used since they are easy to generate and understand. The project manager\
    \ and contributing SME analyze the risk and agree upon the probability of occurrence.\n\
    \nSecond, we analyze the effect the risk event will have on the project (e.g.,\
    \ a delay) if it occurs: we assess the impact (positive or negative) the effect\
    \ will have on the project (high, medium, or low impact). Together the project\
    \ manager and the SME analyze and agree upon the impact and then add their analysis\
    \ to the risk register. The risk register is the primary tool the project team\
    \ uses to manage risks and issues ([Appendix 3](#index_split_029.html#filepos412155));\
    \ even though it is called a risk register, it is also used to manage issues (risks\
    \ that have been realized and are project issues).\n\nOnce we identified the risk,\
    \ understood the cause and effect, and analyzed the probability of occurrence\
    \ and impact, we examine ways to treat the risk. First, we explore ways to prevent\
    \ the risk from occurring. In our example about the server being delivered late\
    \ due to manufacturing shortages, we can prevent the late delivery by ensuring\
    \ the servers leave the factory on time, such as negotiating to pay a premium\
    \ for the server or finding an alternative supplier. We can avoid the risk by\
    \ purchasing a server model in stock and delivering it to meet our project schedule\
    \ and not delay our build phase. Second, we look at mitigation actions to soften\
    \ the impact if the risk occurs (e.g., we could not prevent the risk, and the\
    \ risk becomes an issue). For example, we can complete other project activities\
    \ to continue to progress. We might begin developing our test strategy, plan,\
    \ and test scripts. At the same time, we wait for the servers to arrive (e.g.,\
    \ we may agree upon the contents and people responsible for their development).\
    \ Again, we update the risk register of our mitigation actions; we delegate prevention\
    \ and mitigation actions with a completion date. If we cannot prevent the risk\
    \ by the risk resolution date, then the risk is converted into an issue.\n\nIssues\
    \ are risks that have been realized; the risk event cause was not prevented, the\
    \ risk event occurred, and the project is affected. We analyze issues similarly\
    \ to risks; however, the cause of the issue is the risk event. Since the issue\
    \ has occurred, there is no probability of occurrence to consider: only the impact\
    \ (high, medium, or low) and the issue’s effect on the project. The issue syntax\
    \ uses terms like will and has that convey 100 percent certainty the risk occurred\
    \ and resulting in an issue (e.g., there is an issue that the servers will arrive\
    \ late). We delegate the actions to resolve the issue and provide an issue resolution\
    \ deadline. Thus, we have a risk register that supports how we manage risks and\
    \ issues, who is responsible for preventing, mitigating, and resolving risks and\
    \ issues."
