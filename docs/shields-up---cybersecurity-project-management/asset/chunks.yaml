  trans: '


    > • 在未来二到五年内，你对所在的行业和网络安全监管调查会有何预期？了解行业可能面临的趋势有助于你主动为新的网络安全法规做好准备。


    > • 搜索“如何进行网络安全审计”。考虑让你的经理领导审计项目。


    > • 寻找网络安全审计工具和清单。


    ## 网络安全成熟度提升


    网络安全成熟度模型允许组织评估其当前能力并将其置于不同的水平。通过制定网络安全能力基准，组织可以识别差距和需要实现的目标。目前，许多网络安全成熟度模型（表
    3.1）得到了比较和分析（Payette, Anegbe, Caceres, and Muegge 2015, 1–9; Rea-Guamán, San Feliu,
    Calvo-Manzano, and Sanchez-Garcia 2017, 1–15; Garba, Siraj, and Othman 2020, 1–8）。


    存在许多网络安全成熟度模型，例如 NIST（参见第 4 章）和网络安全能力成熟度模型（C2M2）。C2M2 可供任何规模或类型的组织评估其网络安全状况并进行改进（U.S.
    Department of Energy 2021, 12）。C2M2 模型包含 5 个目标、10 个领域和 3 个成熟级别，组织可以使用这些来评估其网络安全成熟度（图
    3.1）。


    可以通过审计来评估组织在 10 个领域中每个领域的成熟水平。通过分析审计结果，领导层可以确定优先事项领域的成熟度改进目标。实现这些改进目标可能会触发新的网络安全项目。


    ![](img/00006.jpg)


    图 3.1 C2M2 结构


    ## 组织网络安全认证


    由于日益增长且持续的网络安全威胁以及配套的监管努力，某些组织可能需要在网络安全成熟度模型中获得认证。例如，超过 300,000 名承包商和分包商与美国国防部合作；大多数承包商需要
    CMMC 3 级认证才能获得合同资格（Horan 2020, 1; Fox 2021, 2）。与美国能源部工作的承包商很快也需要通过 C2M2 认证（Schwartz
    2019, 1）。为了向美国联邦政府销售产品，某些技术制造商必须符合 NIST 标准（Allied Telesis 2021, 1）。因此，预计组织将越来越多地遵守框架及随后的审计；这两个网络安全项目来源正向我们走来！


    ## 网络安全人才短缺


    由于“技能转型革命”，工作的本质正在发生变化，人们技能的有效期正在缩短，需要定期进行技能提升（Skulmoski, Langston, Patching,
    and Ghanbaripour 2020, 3）。组织报告称，在寻找合格人才方面面临挑战（World Economic Forum 2020, 11）。数字转型导致了普遍的数字技能缺口，使项目经理在实施数字项目时面临困难。


    表 3.1 网络安全模型


    | 模型 | 重点 |

    | :--- | :--- |

    | 国家标准与技术研究院网络安全框架 (`NIST CSF`) | `NIST CSF` 于 2014 年发布，包含五个功能和五个“等级” |

    | `C2M2` | 1996 年由美国能源部首次发布，具有五个成熟级别 |

    | `ES-CM2` | `ES-CM2` 专注于能源领域，包含 10 个领域和五个级别 |

    | `ONG-CM2` | `ONG-CM2` 专为油气行业设计，具有五个成熟级别 |

    | `CCSMM` | `CCSMM` 于 2006 年发布，包含三个领域 |

    | `NICE`-能力成熟度模型 | `NICE`-能力成熟度模型建立于 2008 年 |

    | `FFIEC-CMM` | `FFIEC-CMM` 有五个成熟级别 |

    | `AUMMCS` | `AUMMCS` 于 2014 年引入，包含三个领域 |

    | `SSE-CMM` | 2014 年发布的 `SSE-CMM` 包含 10 个领域 |

    | `CSIRT` | `CSIRT` 模型具有三个等级和四个类别 |

    | `CMMC` | `CMMC` 有 5 个级别、43 项能力和 171 项实践措施 |

    | `CERT-RMM` | `CERT-RMM` 引导组织评估业务连续性、安全和 IT |


    寻找合格的网络安全专业人士是所有技术职业中最挑战性的任务之一（Morgan 2019, 4–6）。“简单来说，今天招聘安全专业人员比三或四年前还要困难”（Scholtz
    2021, 13）；事实上，网络安全行业被描述为正处于深层次的“危机”中（Oltsik 2020, 5）。网络安全专业人士的失业率为零，自 2011 年以来一直如此（Morgan
    2019, 6）。对网络安全专业人士的高需求吸引了不合格的申请者，其中合格的人数不足四分之一（Morgan 2019, 2）。


    加网络安全技能缺口问题的是，网络安全角色正在发生变化，以适应不断的技术和利益相关者的预期（Scholtz 2021, 14）。


    缓解网络安全人才短缺的一种策略是将某些网络安全功能委托给业务、公司和其他 IT 团队（Scholtz 2021, 15）。一种新兴的企业价值观是，由于技术生态系统高度互联且复杂，每个人在网络安全中都自己的责任（Morgan
    2019, 2）。


