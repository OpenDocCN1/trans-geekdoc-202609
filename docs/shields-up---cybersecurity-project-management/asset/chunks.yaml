  trans: "\n\n# 变更能力的悖论 (图 7.1) 面临所有项目经理，并且如果管理不当，可能会影响项目的成功 (Hartman 1999a, np)。在项目启动时，人们对项目的了解非常少。然而，随着项目的进行，我们掌握的信息量不断增加（例如，我们知道哪些风险变成了问题，哪些项目人员持续准时交付，以及哪些采购延迟是不可避免的）。随着时间的推移，我们进行变更的能力会降低；与后期相比，在项目的第一周增加范围或更改测试方法容易得多（例如，在测试结束时更改设计是非常困难的）。而且，如果我们想进行变更，在项目初期的执行成本要比后期阶段低。因此，在启动和计划阶段，如果我们能利用\
    \ `变更能力的悖论` 提供的机会，与正确的利益相关者合作，并遵循混合项目管理流程和原则，我们的分析就可以改变信息曲线。\n\n## 变更能力的悖论\n在项目初期，变更成本最低且最容易实施时，我们缺乏信息；然而，当我们项目后期拥有了更好的信息时，这些变更往往是复杂且昂贵的。\n\
    \n如果在项目后期才发现风险，它们可能会变成问题，导致项目无法成功，出现如错过里程碑、预算超支和质量妥协等问题。我们可以通过移动信息曲线来缓解这个问题：提前引入信息\
    \ (图 7.1)，以便在项目更早而不是更增加信息的质量和数量。`项目可行性 Gizmo` 是一个引导项目经理更早地更好地理解项目的工具，从而移动信息曲线。项目经理学习更多关于项目的知识，以制定更好的计划，并有更充足的时间来管理项目风险并避免后期昂贵的变更；这是前端加载（front-end\
    \ loading）的基础。\n\n![](img/00009.jpg)\n\n图 7.1 变更能力的悖论\n\n## 启动阶段：结语\n在启动阶段，项目经理努力获得正式批准以启动项目。项目经理与项目赞助者合作制定一份\
    \ `PID`，赋予项目经理进入计划阶段的权限。`Gizmo` 可能用于对项目进行更深入的理解，以移动信息曲线，从而避免项目后期昂贵的变更。\n\n###\
    \ 微学习\n以下是一些在线学习活动，旨在加深你对启动阶段的理解；请搜索：\n\n> • 如何制作信息图？ \n\n> • 项目管理中使用了哪些 `KPIs`？规划和使用项目管理\
    \ `KPIs` 以及项目评估标准可以帮助你交付恰当的项目管理质量。 \n\n> • ITIL 4 变更控制实践是如何运作的？ \n\n检查你的组织：\n\n\
    > • 识别你的组织跟踪和报告的项目管理 `KPIs`。这些是衡量进展的最佳 `KPIs` 吗？ \n\n> • 调查你的组织是如何启动项目的。\n\n#\
    \ 第 8 章\n\n## 计划阶段](#index_split_004.html#filepos7423)\n计划阶段的目的是制定一份计划，定义并预测项目将如何执行、成本是多少、工作将在何时执行和完成、会遇到哪些风险和问题等。项目经理识别需要完成的工作以及由谁来完成工作。项目经理将制定一份扩展了\
    \ `PID` 的计划，可能包括详细的进度表和预算。目标是批准项目计划以退出计划阶段。\n\n### 精益项目计划流程\n精益项目计划侧重于减少浪费和满足利益相关者。我们可以遵循精益项目计划流程\
    \ (图 8.1) 来快速规划并移动信息曲线，从而产生更好的项目计划。此阶段旨在制定一份精益项目计划供领导层批准。我们通过与项目赞助者会面并开始规划：\n\n\
    > 1\\. 任务声明：验证与赞助者合作制定的任务声明（范围声明），使其具有可衡量性和客观性。（例如：在 2023 年 6 月之前完成所有 IT 服务的审计；由于是内部项目，因此没有预算。）\
    \ \n\n> 2\\. 项目优先级：识别项目优先级（优先级三角形，后文将讨论）以实现对齐。 \n\n> 3\\. 成功标准：记录项目成功标准（Done–Won–Who，后文将讨论），这也有助于对齐。\
    \ \n\n> 4\\. 工作分解结构：使用任务声明来开发一个高层工作分解结构 (`WBS`)，识别出主要的工作包。 \n\n![](img/00012.jpg)\n\
    \n图 8.1 混合项目计划流程\n\n> 5\\. 进度：使用 `WBS` 开发一个高层甘特图（条形图），如果你的项目足够大，则开发一个详细说明关键路径和浮时间的进度表。较小的项目通常可以使用任务列表和完成日期来管理。\
    \ \n\n> 6\\. 预算：某些项目不需要预算，因为它们是只需要少量资源的内部项目。然而，某些项目需要大量的外部资源（例如技术知识和新设备）来完成并从项目预算和成本管理。\
    \ \n\n> 7\\. 风险和问题：识别关键风险和问题（我总是包含“我们的可能会失败，但在您的支持下，我们更有可能成功！”以鼓励赞助者的参与）。 \n\n\
    > 8\\. 治理：约定治理和报告（例如：项目赞助者和其他利益相关者想要哪些信息？是否有每月或每周的状态会议？）。 \n\n> 9\\. 项目角色和职责：约定项目赞助者和项目经理。\
    \ \n\n> 10\\. 教训：在项目开始时进行教训总结。询问赞助者之前的项目中哪些做得好，哪些具有挑战性，以便你可以在项目开始时从教训中受益。你的赞助者会感谢你愿意将他们的想法纳入项目；你已经开始了有效的团队建设。\n\
    \n接下来，在与项目赞助者规划之后，与 `SMEs` 会面以完成 `WBS` 中识别的工作。我们重复与项目赞助者完成的大工作：审查任务声明和项目优先级（我们可以使用\
    \ `PID` 信息图开始规划）。我们检查 `WBS` 以查看是否有遗漏。因此，我们对项目规划采取了迭代且包容的方法，从项目赞助者和关键项目参与者开始。我们制定了一个高层项目计划并在项目计划研讨会\
    \ (`PPW`) 上向关键利益相关者展示（参见项目计划研讨会章节）。研讨会上收集额外的反馈，团队认可项目计划。然后将计划提交给领导层批准（例如：项目计划基准化）。\n\
    \n### 微学习\n在 Shields Up 中，我们使用许多传统的项目管理工具和流程（例如预算和进度），因为它们有成功的成功历史。因此，我们引导学生在线搜索以提高对核心项目管理工具和流程的理解。你可以在线搜索详细的说明和模板来完成项目计划的以下部分。\n\
    \n"
