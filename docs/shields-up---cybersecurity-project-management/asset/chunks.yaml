    在 *Shields Up: Cybersecurity Project Management* 一书中，Greg 以巧妙且科学的方式开辟当代项目管理丛林中的一条道路，为所有可能在现代项目管理中挣扎的人士提供了全实功能的路线图。但他的涵盖范围远不止于这些领域。他对业务合作伙伴期望、技术变化速度以及网络安全日益增长的重要性等当前问题的构框架和分析都是稳如磐石并经过了广泛的研究。他还花了很大精力通过设计练习来吸引读者，帮助他们调整对本书的阅读方式，并将其应用到他们今天面临的网络安全项目管理难题中。


    `Shields Up` 均衡得很好，包含了对瀑布式、`Agile`（敏捷）和 `lean`（精益）项目管理方法的深度总结，同时保持了足够快的节奏，让你欲不释手。我发现自己被读下去。Greg
    包含的细节恰到好处，并提供了许多实用的参考文献，使其成为一份完美的指南，而绝不会变得枯燥。


    `Hybrid project management`（混合项目管理）是当今商业环境中必不可少的能力，Greg 优雅地详细阐述了一种灵活的方法，将预测型和适应型项目管理学科的优点进行混合匹配，允许读者根据自己自己的网络安全项目背景来匹配技术。


    对于项目管理的资深人士，`Shields Up` 对至关重要的实践提供了极其清晰且简洁的解释，例如 `project initiation document
    structure`（项目启动文档结构）、`three-point estimation`（三点估算）、`risk and issue framework`（风险和问题框架）以及质量管理。我发现多次回顾文本，记录笔记和幻灯片，然后立即将
    Greg 的许多混合项目管理实践应用到我最新的项目中！


    正如你在阅读本书时会观察到的，`Shields Up` 轻量且极具实用性。我觉得这种方法的直接和简单令人目一新并令人振奋。就像一份正宗的“sugo”或一次执行标准的俯卧撑一样，项目管理的基础知识许多人仅停留在表面理解，但大多数人执行得很糟糕。正确掌握这些知识虽然很难，但可能意味着获得卓越的结果。在书中，Gregory
    Skulmoski 博士向你展示了切实有效的方法，以便在你的网络安全项目中取得卓越成果。


    —Chris Walker，`SHRM-SCP`


    ## 前言


    > 数字业务转型和新兴的跨物理系统创造了前所未有的安全风险

    > > —Gartner 2020a, 1


    `Shields Up: Cybersecurity Project Management` 满足了网络安全专业开发项目管理能力的需求，以便领导并在网络安全项目中取得成功。在第四次工业革命创新和新冠肺炎引发的数字化转型项目的推动下，技术的采纳和普及正在增加并可能正在加速。`Shields
    Up` 旨在为网络安全和其他技术专业人员提供一份计划、开发、管理和实施网络安全项目的指南。


    `Shields Up` 分两部分：(i) 技术和网络安全需求增长以及 (ii) 混合项目管理。`Part 1` 在创新交付方法的背景下构建了项目管理；即，为了实现战略目标，组织越来越多地启动项目。技术预测显示对技术和网络安全的需求在增加。是什么驱动了技术需求？未来的预见是什么（审查可能的未来情景）？


    ### 第一部分：网络安全项目需求增加


    敏捷且对变化的预期和转瞬即逝的机会做出反应的组织依靠技术来获得竞争优势。他们可能实施技术来交付新产品或通过消除浪费来满足客户。`ISO 9001` 质量管理标准引导组织沿着持续改进的路径。虽然网络安全、ITIL
    服务管理和项目管理是质量管理的核心，组织也看到对网络安全服务的的需求激增。


    响应技术需求的增加，IT 部门可能会遵循 `Infrastructure Technology Information Library`（`ITIL`）标准，通过规划、设计、开发、测试、实施、运行和优化阶段来对服务或产品的需求，为最终用户交付价值。虽然项目管理被明确嵌入到
    ITIL 中，但项目管理标准通过一系列交付方法引导价值交付，从传统的预测型（瀑布式）项目管理交付方法到如 `Scrum` 和 `Kanban`（看板）之类的适应型敏捷技术。《项目管理知识体系指南》（`PMBOK®
    Guide`）和 `PRINCE2` 是两种由专业认证支持的著名项目管理标准。


    敏捷且对变化的预期和转瞬即逝的机会做出反应的组织依靠技术来获得竞争优势。他们可能实施技术来交付新产品或通过消除浪费来满足客户。`ISO 9001` 质量管理标准引导组织沿着持续改进的路径。虽然网络安全、ITIL
    服务管理和项目管理是质量管理的核心，组织也看到对网络安全服务的的需求激增。


    组织面临实施和管理更多技术、保持系统和信息安全以及在网络安全职位空缺的情况下完成工作的挑战，他们还可能看到更多的网络安全监管。某些组织有义务合规。网络安全成熟度模型提供了通合规和成熟目标的路径和指导，例如
    `Cybersecurity Capability Maturity Model`（`C2M2`）。网络安全监管合规驱动了更多网络安全项目，例如内部和外部审计。


    组织利用网络安全相关标准和框架来满足网络安全期望和要求。有两个著名的网络安全标准可以引导组织优化其服务：由美国标准与技术研究所（`NIST`）发布的《改进关键基础设施网络安全框架》以及
    `ISO 27001 信息安全管理》（National Institute of Standards and Technology 2018, 1–55）。


