  trans: '


    可以将瀑布式项目管理方法叠加到 Scrum 方法上（图 5.4），从而发现敏捷方法和瀑布方法在项目工作方面是相似的（例如：计划、设计和构建）。良好的项目管理活动在任何方法中——无论是适应性还是预测性项目管理——都是有效的。因此，项目管理的基础知识可以转移到其他项目管理和管理方法。


    敏捷项目工作受《敏捷宣言》（图 5.5）的指导：包括 4 个价值观和 12 条原则（[`AgileManifesto.org`](http://AgileManifesto.org)
    2001, 1)）。Scrum 项目管理交付方法旨在与《敏捷宣言》结合；如果没有敏捷宣言作为行动和决策的指导，使用 Scrum 方法交付项目将具有挑战性。


    ![](img/00017.jpg)


    图 5.4 使用 Scrum 的敏捷项目管理


    ![](img/00021.jpg)


    图 5.5 敏捷宣言


    使用 Scrum 交付方法进行敏捷项目管理也许是开发、交付和维护“复杂项目”最流行的适应性项目管理方法之一（Schwaber and Sutherland
    2017, 3）。在网上搜索可以让你看到其他适应性/敏捷方法，如看板（Kanban）、DevOps 和极端编程。


    虽然大多数网络安全项目不需要 Scrum 敏捷交付方法（例如，它们通常具有较低的模糊度），但 Shields Up 混合项目管理方法在与敏捷宣言的原则和价值观结合时效果良好。还有其他与敏捷项目管理相关的项目管理方法可以加入到我们的混合项目管理工具箱中：精益项目管理和精益六西格玛（Lean
    Six Sigma）。


    ## 精益项目管理


    精益运营和管理是媒体和本书中反复出现的主题；我们希望项目中的工作不要超过必要的。精益的核心在于效率：正确地做正确的事。我们努力减少项目中的浪费，并为利益者交付价值。我们包含一个持续改进循环以变得更加精益、更高效。我们实施的许多技术项目日益具有精益目标：例如，我们自动化业务流程以减少客户的步骤。精益原则已应用于项目和信息系统管理，这并不令人感到意外。


    ### 微学习


    以下是增强你的职业发展之旅的一些活动：


    > • 搜索“精益运营”和“精益管理”，看看我们的客户在读什么，以及他们通过技术和自动化变得更精益的期望。IT 是实现精益的解决方案，而网络安全专家负责保护这些精益解决方案。


    > • 关注精益运营或管理博客以掌握业务趋势。


    什么是精益项目管理？我们使用项目管理方法来减少浪费、取悦客户并寻找改进机会。精益项目管理有时在敏捷项目管理中被提到，因为两者都是某种新颖且兼容的技术。然而，精益项目管理并不是像敏捷或瀑布那样的另一种项目管理方法。精益项目管理结合了多种方法，通过优化项目资源为赞助人创造价值。


    ## 精益六西格玛


    对最佳实践感兴趣的 IT 专业人员发现精益六西格玛是与敏捷项目管理相关的改进方法。精益六西格玛将精益管理与六西格玛目标相结合（图 5.6）。精益六西格玛旨在通过减少浪费和提高质量来改进流程：


    1. 为赞助人交付最大价值。

    2. 改进流程。

    3. 减少浪费。


    ![](img/00025.jpg)


    图 5.6 精益六西格玛


    ### 练习


    > 图 5.8 列出的这些框架中哪些用于你的组织？在网上搜索任何你不熟悉的框架。


    ![](img/00028.jpg)


    图 5.7 DMAIC 循环


    ## 项目管理：结语


    项目管理有助于计划和交付成功的项目。多种项目交付方法从预测性（传统）到适应性（敏捷）不等。传统项目管理通常是基于过程的，我们启动项目、计划、设计、构建、交付并结束项目。领先的项目管理标准和框架遵循相似的过程，具有共同的理论（例如：范围、质量和风险管理）。由于项目因行业而异，可以使用混合项目管理方法（图
    5.8）来结合不同标准和方法的元素（Skmoski and Brendolan，出版中）。


    通过混合项目管理方法，项目经理可以在计划和交付网络安全项目方面变得精益。项目经理结合并定制正确的项目管理相关标准、框架、流程和工具，以交付他们的网络安全项目（图
    5.8）。


    ![](img/00031.jpg)


    图 5.8 网络安全混合项目管理


    '
