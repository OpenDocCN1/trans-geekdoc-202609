    estimates in the detailed and high-level budgets. We complete the budget exercise
    by looking for wide-range estimates, identifying risks, and updating our risk
    register for budget-related risks and issues.


    ## Project Communications


    A lean approach to project management is to consider project human resources and
    communications management at the same time since our communications focus on people.
    Human resources management is the process of leading, coordinating, and managing
    the project team and determining your team’s roles and responsibilities. Project
    communications management involves ensuring that the right people receive the
    right project information at the right time. Effective communications do not just
    happen; they need to be planned, managed, and monitored. There are many forms
    of project communication like e-mails, risk registers, schedules, budgets, status
    reports, and application design documents; many of these forms of communication
    result from project meetings.


    Projects are collaborative efforts often supported with meetings to progress execution
    ([Table 8.1](#index_split_018.html#filepos269497)). Meetings can be in a workshop
    format to develop a schedule, document the design, and test the product. The project
    manager sets up workshops according to the project schedule. The project manager
    also sets up recurring meetings to support the communication process with status
    reports to leadership as part of their governance role. In this example of a monthly
    project meeting schedule, the focus is to report to the project director weekly
    and executive leadership for a monthly project review. The schedule allows the
    project manager and team to meet throughout the week in standup meetings to plan
    the project activities for the day. There is also a weekly risk management meeting.
    These daily standups and risk management meetings help the project manager monitor
    and control project activities and relate the project status to leadership. The
    project manager needs to set up a similar meeting and communications schedule
    to support project activities. Often, a key challenge is to find a meeting space
    if the meetings are face-to-face. Setting up the meeting schedule and booking
    the meeting rooms is a project activity that can be front-end loaded; teams appreciate
    meetings that recur in the same room, which can be achieved with early scheduling.


