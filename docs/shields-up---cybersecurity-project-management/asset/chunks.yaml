    # Transition to Production


    Transition to production checklists act like a quality assurance guide to ensure
    that the tail end of the project is “tight, rather than loose.” That is, the final
    go-live activities to transition from a project phase to operations are planned,
    managed, and controlled to improve the probability of a successful implementation
    and adoption. T2P checklists vary by project and organization; however, common
    tasks must be completed to smooth service transition. Involve the deployment manager
    early in the project to plan your release and deployment actions and to create
    a lean T2P checklist:


    1. Inform the change authorization board (`CAB`) that a new service is preparing
    to go live. Astute project managers add an agenda item to the `CAB` meeting as
    as much as two to three months or more prior to going live to raise the visibility
    of their project. They also inform the `CAB` that they use a T2P checklist to
    manage and control go-live activities to improve confidence in a methodical release.

    2. Test the backup/restore capabilities.

    3. Remove vendor access as appropriate.

    4. Add the new service to the information systems management system.

    5. Develop and add an `FAQ` for the new service to the service operations manual.

    6. Train the support desk.

    7. Train the end users.

    8. Perform a vulnerability assessment and remediation.

    9. Complete a system hardening review.

    10. Conduct an information system risk review.

    11. Complete a disaster recovery test.

    12. Develop a go-live communications plan including prepared communications to
    address risks (e.g., an unsuccessful implementation requiring an uninstall from
    the production environment).

    13. Set up a go-live command center for critical and priority projects.

    14. And so on.


    In line with best practices, the project manager completes only the T2P actions
    required to release the service to the end users. The services are valued and
    optimized; tailoring is applied to project planning and service transition activities.


    ## CAB Approval and Process


    One of the final T2P actions is getting `CAB`s approval to release the new service
    into the production environment. (Some projects do not involve systems released
    into the production environment like cybersecurity audits but may require a report
    or presentation.) Using the change management process is essential since system
    misconfigurations are a prominent attack vector and can be better managed with
    a systematic and formal review before being released into the production environment
    (Microsoft 2020, 74). The project manager coordinates the release date with the
    project schedule and a `CAB` meeting. Some projects benefit from the project manager
    discussing the release with `CAB` approving members before the meeting to provide
    detailed answers to any questions.


    When your release is ready to be discussed during the `CAB` meeting, begin by
    explaining the T2P process you followed (e.g., checklist and raising tickets for
    T2P services) to win confidence that your service is ready to be released and
    that the stakeholders endorse the release. Your message is “good process, good
    result.” For more critical and impactful projects, consider using an infographic
    or a dashboard ([Table 12.1](#index_split_022.html#filepos361485)) to explain
    that the release is ready to be deployed, the organization is ready for the release,
    and you have a plan to monitor and control the release. You strive to make approval
    easy by providing information `CAB` approvers desire.


    Once permission to proceed is provided by the `CAB`, it is time to follow your
    go-live plan. Some projects benefit from practicing their go-live, including restore
    backout, and escalation procedures. Quality is improved with checklists to guide
    go-live activities supported with short “standup” meetings. These T2P procedures
    contribute to a smooth and predictable go live.


    ## T2P: Final Thoughts


    Our goal is to seamlessly transfer the product or service produced by the project
    into operations with the intended outcomes. We complete the T2P actions identified
    as early as the planning phase to release the service into the production environment,
    including backout plans. We include training and communications to ensure a seamless
    transition. We work with the `CAB` and the release manager to plan and release
    the service into the production environment.


    ### Table 12.1 CAB go-live status report


    | Release elements | Status | Comments |

    | --- | --- | --- |

    | Cyber security readiness | Green | List the security actions that have been
    completed and the state of readiness |

    | Systems readiness | Green | Ready |

    | New service readiness | Green | Ready |

    | Operational readiness | Green | Some training is outstanding; however, the sponsor
    confirms the organization is ready |

    | Training status | Amber | 11% of the organization has not completed training;
    additional training is being provided. 95% of the organization will be trained
    by Week 2 (post go-live) |

    | Communications readiness | Green | Ready—including backout communications |

    | Reporting readiness | Green | Ready—escalation procedures distributed |

    | Support readiness | Green | Ready—simulation exercises complete |

    | Risks | Green | No high severity risks; under control |

    | Issues | Green | No high severity issues; under control |

    | Other | — | None |


    ## Microlearning


    Following are some practical exercises to enhance your learning. Search online
    for:


    * ITIL release management

    * ITIL release management templates

    * ITIL release management practice

    * Release strategies (e.g., canary/dark release)

    * Change authorization board


