    质量保证旨在让人们对满足质量要求充满信心。大多数标准（例如 `ISO`、`NIST` 和 `C2M2`）都指导组织包含质量保证和控制活动。组织提供培训、模板、检查清单和流程来交付正确的质量。然后，我们根据检查清单执行工作，例如配置虚拟服务器。工作执行完成后，我们进行质量控制：发现并修复缺陷。同样，我们依赖于培训、模板和检查清单，并遵循流程来确定是否交付了正确的质量。我们对质量管理有一套
    A-B-C 方法：`quality Assurance`（质量保证）、`Before`（之前/准备阶段）、`quality Control`（质量控制）。这种质量管理流程在各行业的领先标准中随处可见；因此，应用这种简单的质量管理方法，你很可能在大多数时间内符合大多数标准中的大多数质量领域。预计监管机构和保险公司会要求对网络安全特别是通用技术进行定期审计。审计可以是质量控制项目的一种（例如，`NIST
    Framework` 审计和合规流程）。领导审计项目有利于开发新的项目管理能力，并增加对技术生态系统的整体理解。


    ![](img/00020.jpg)

    图 4.2 质量管理流程


    ## 网络安全框架


    网络安全框架是一系列用于管理网络安全风险的标准、指南和最佳实践。框架可以提高可靠性和可预测性。这里简要介绍了两个领先的网络安全标准，并将它们与项目管理在满足这些标准方面的关键作用联系起来：


    > 1. 用于改进关键基础设施网络安全的 `NIST Framework`；


    > 2. 用于信息安全控制的 `ISO 27000 Series`。这些标准被广泛采用，其影响力日益增长。它们包含了从项目到运营的整个策略生命周期，并以持续改进为导向，带来了新项目、新机会和新服务。组织利用框架来识别需要加强的领域或需要实施的新流程。遵循这些框架的组织通过持续改进实践，可能更好地应对日益增长的网络安全项目需求。


    ## 美国标准技术研究院网络安全框架


    备受推崇的改进关键基础设施网络安全的 `NIST Framework` 旨在保护交通、医疗、能源、食品、水、通信、银行和金融等关键基础设施（National
    Institute of Standards and Technology 2018, 5）。`NIST Framework` 指导关键基础设施的网络安全工作。它可以被任何追求更好网络安全的组织使用：“虽然本文档的制定是为了改进关键基础设施的网络安全风险管理，但该框架可以适用于任何行业或社区的组织。该框架使组织无论规模、网络安全风险程度或网络安全专业水平如何，都能应用风险管理原则和最佳实践来提高安全性和韧性”（National
    Institute of Standards and Technology 2018, 5）。


    网络安全防御的基础是通过五个功能和相关类别来保护组织的资产（见 图 4.3）。你可能会被要求参与并领导这些领域任何一个领域的项目；网络安全项目的来源是极其广泛的。


    ![](img/00024.jpg)

    图 4.3 NIST 网络安全框架：功能与类别


    类别揭示了网络安全目标的范围，并由 108 个子类别支持（请参见 附录 1 框架核心的示例）。在这个功能、类别和子类别的框架内，我们能更好地了解我们目前的处境以及我们组织的改进目标所在。`NIST
    Framework` 包含了实施层，旨在提供通往网络安全成熟度和实现目标的路径（见 图 4.4，参考 National Institute of Standards
    and Technology 2018, 15–17）。


    ![](img/00027.jpg)

    图 4.4 NIST 网络安全能力成熟等级


    组织使用 `NIST Framework` 来记录其当前的网络安全概况（见 图 4.5，参考 PMI 2021, 6)），然后启动项目以达到目标配置（例如，针对
    `Tier 3`，从 `Tier 3` 进展到 `Tier 4` 以符合外部机构的指南，通过 `NIST` 的层级）。


    ![](img/00030.jpg)

    图 4.5 通过项目改进网络安全


    `NIST Framework` 与项目管理对齐，遵循正式的项目管理方法有助于你符合框架。`NIST Framework` 包含一个面向项目的章节——建立或改进网络安全计划——使组织达到目标配置（National
    Institute of Standards and Technology 2018, 21–22）。本书帮助你计划和实施与 `NIST` 相关的网络安全项目。


    ## ISO 27001 信息安全管理


    `ISO 27000` (ISO 2013b)是一系列用于计划、实施、维护和改进组织信息安全的标准（见 图 4.6 的 `ISO 27000` 标准概述）。通常，组织最初采用非正式且混乱的方法处理网络安全，然后采用
    `ISO 27000` 等标准来系统地管理信息安全（ISO 2013a, 1–32）。


    `ISO 27001` 要求被分为 114 项控制，每项控制解决特定的网络安全风险（例如保护公共网络上的应用服务）。这些控制被分为 14 个附件/组（从附录
    5 开始），见 图 4.6。这些控制指导组织改进其网络安全。组织可以在持续改进努力的一部分确定当前和目标配置。


    ![](img/00034.jpg)

    图 4.6 ISO 信息安全标准


    特别值得关注的是控制 `A.14 系统采购、开发和维护`，因为它包含了项目管理活动，例如：


    > A.14.2 开发和支持过程中的安全性：设计中引入网络安全；


    > A.14.2.7 外包开发：管理外包项目以确保正确的网络安全质量；


    > A.14.2.8 系统安全测试：测试安全功能；


    > A.14.2.9 系统验收测试：测试系统是否按照设计构建，包括信息安全测试对对实践的遵循。


    本书与该标准中与项目管理相关的控制对齐。因此，遵循这种项目管理方法将帮助你符合 `ISO 27001` 信息安全管理。


    '
