    * How to tell a great story?

    * How to create a design and layout?


    Since baselining the project plan involves gaining the trust of your team, you
    might consider any approval process in the project life cycle to be a selling
    exercise. Therefore, “how to sell anything” and “storytelling” are added since
    they are powerful techniques to help you get approval to proceed. Design and layout
    considerations, graphics, and other creative considerations will give your project
    plan a professional look. You are likely to use selling, storytelling, layout,
    and design skills throughout your career.


    While `Shields Up` is more strategically focused, we include project management
    tools and methods that are lesser known but effective. These tools help us shift
    the information curve to learn more about your project sooner rather than later
    when changes are challenging to make and expensive.


    ## Priority Triangle


    Project alignment is an early goal project managers work toward since it helps
    to shift the information curve for the project team. Misalignment increases risks
    and issues like scope creep, delays, and cost overruns. However, when the project
    team is aligned, the team is more likely to become lean, and project success is
    more likely. We saw that the `Project Feasibility Gizmo` helps shift the information
    curve; the `Gizmo` also aligns the project team. The `Priority Triangle` (Skulmoski
    and Hartman 2000, 33–37) is another project management tool contributing to team
    alignment and risk reduction.


    The `Priority Triangle` ([Figure 8.2](#index_split_018.html#filepos242290)) is
    adapted from Martin Barnes classical iron triangle, also known as the triple constraint
    theory (Kerzner 2013, 869). Project teams are constrained by scope, time, cost,
    and quality; a change in one constraint will affect the others. For example, if
    our client asks to increase the scope, we may face increased costs and schedule
    overruns due to the extra work to deliver the increased scope.


    ![](images/00019.jpg)


    Figure 8.2 Priority triangle and alignment


    In practice, we can use the triple constraint theory to help identify the project
    priority. We begin by drawing the `Priority Triangle` (Skulmoski and Hartman 2000,
    35). Time is shown to the left of the `Priority Triangle` since we wish to minimize
    the duration of our project. Cost is at the bottom of the `Priority Triangle`
    because we try to minimize costs. Finally, quality and scope are to the right
    since we wish to optimize scope and quality. We try to minimize delivery time;
    therefore, time is to the left (earlier rather than later) on the `Priority Triangle`.
    We wish to maximize value; therefore, quality and scope are to the right on the
    `Priority Triangle`. However, if we ask the project sponsor to identify the priority,
    the project sponsor will likely choose all constraints as the priority. Therefore,
    we have added a `No-Go zone` in the middle to force project stakeholders to identify
    the two most essential project priorities.


    Let’s look at the `Priority Triangle` in use. Our project is to add collaborative
    robots to a manufacturing process. We have three main stakeholders for our IT
    automation project: marketing, engineering, and finance ([Figure 8.2](#index_split_018.html#filepos242290)).
    We explain the exercise, and marketing places their `X` in the triangle to indicate
    that delivering on time is the project priority, with quality and scope being
    the second priority. Their rationale is that marketing wants to start selling
    the product the project will produce. They also desire high quality since quality
    products are easier to sell. Engineering has prioritized quality since high-quality
    components are easier to maintain and have less frequent breakdowns. Finance prioritizes
    finishing according to budget, followed by finishing on schedule. Finance is responsible
    for maximizing the use of resources and therefore supports finishing according
    to the approved budget. They also want to finish on time to generate revenue once
    the collaborative robot automation is operational.


    You can see that the three stakeholders are misaligned with different project
    priorities ([Figure 8.2](#index_split_018.html#filepos242290)). We become aligned
    by getting project priority direction from the project sponsor using the `Priority
    Triangle`. In this case, let us assume that finishing on time with the right quality/scope
    are the sponsor’s two project priorities. The project manager has flexibility
    over the budget to deliver the other two priorities.

