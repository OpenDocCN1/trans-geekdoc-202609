    \ time to market. \n\n> 5\\. Obtain/build: Provide the service or product when\
    \ and where each is required. \n\n> 6\\. Deliver and support: Support the products\
    \ and services to the agreed requirements and performance specifications. \n\n\
    While these Service Value Chain activities appear to be sequential, the planning,\
    \ continuous improvement, and engaging stakeholders activities occur throughout\
    \ the Service Value Chain process.\n\nThese Service Value Chain activities occur\
    \ within the context of four dimensions of service management that offer insight\
    \ into different perspectives of service management. These dimensions of service\
    \ management need to be planned and managed at a micro (project) level through\
