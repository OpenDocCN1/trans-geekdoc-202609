    风险管理是技术项目成功的关键因素，也是一项推荐的 ITIL 通用管理实践（有限，`AXELOS 2019`，95–97）；做好风险管理，项目成功的概率将呈指数级增长。Shields
    Up 中的风险管理与 `ISO 31000:2018 风险管理—准则`（`ISO 2018b`）一致；因此，当你遵循 Shields Up 中的风险管理时，你同时也符合
    `ISO 27000 风险管理`。精益风险管理专注于由风险清单支持的风险管理过程、质量管理以及可以在大多数项目、在大多数时间内使用的简单技术。风险管理是计划、识别、分析、处理和控制风险及问题的过程。风险和问题可能是负面的（例如，延迟），也可能是正面的（例如，缩短活动的机会），并可以通过风险管理过程和风险清单进行管理。


    ## 风险管理过程


    风险管理过程（图 8.7）简单且有效；你可以在大多数项目、在大多数时间使用这种方法。所有项目计划都应该包含关于风险和问题管理的章节。项目经理应提供有关如何管理和沟通风险与问题的概述、所使用的工具和流程等。例如，项目经理可能会安排每周风险管理会议（表
    8.1）来审查风险清单，并在状态报告中包含风险和问题。风险管理过程是一个循步就进的方法。一旦识别出风险，就会对其进行定性分析（高、中、或低），然后进行处理（风险预防和行动），最后在风险清单中记录该风险。ITIL
    和项目管理标准（例如 `PMBOK® Guide` 和 `PRINCE2`）具有共同的目标，并且天然是一致的。遵循风险管理过程符合国际标准，并极大提高了项目成功的概率。风险管理过程出现在
    图 8.7 中，项目团队在整个项目阶段都使用风险管理。


    ![](img/00039.jpg)


    图 8.7 风险管理过程


    项目经理和团队遵循风险管理过程并识别风险。风险识别包括风险原因、事件和影响（表 8.3），并按照风险语法进行记录。重要的概念是，风险事件的词汇应传达风险可能发生也可能不发生的确定性；例如，我们使用
    `may`、`could` 和 `might` 等词风险风险尚未发生但可能发生。当使用正确的风险语法时，理解力会提高，风险沟通也会减少。因此，当我们识别出一个风险时，我们将风险构建为风险原因、事件和影响，以有助于高效的分析和处理。


    ## 风险管理框架和语法


    表 8.3 风险管理框架和语法


    | 元素 | 描述 | 语法 | 分析 | 处理 |

    | --- | --- | --- | --- | --- |

    | `Risk cause` | `风险由于某种原因或理由产生` | `由于制造延迟` | `风险发生的概率` | `可以防止风险的行动` |

    | `Risk event` | `可能发生的事情` | `may, could, might` | — | `可以减轻风险的行动` |

    | `Risk effect` | `风险的后果` | `will, has` | — | `可以响应风险的行动` |


    当我们识别出一个风险时，我们将风险构建为风险原因、事件和影响，以有助于高效的分析和处理。


    '
