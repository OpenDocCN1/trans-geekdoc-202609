- raw: "The Ability to Change Paradox ([Figure 7.1](#index_split_017.html#filepos231299))\
    \ faces all project managers and can affect project success if not properly managed\
    \ (Hartman 1999a, np). At the start of the project, one has very little information\
    \ about the project. However, the amount of information we have increased throughout\
    \ the project (e.g., we know which risks became issues, which project personnel\
    \ delivered consistently on time, and which procurement delays were unavoidable).\
    \ Over time, our ability to make changes decreases; it is easy to add scope or\
    \ change the testing approach in the first week of the project compared to the\
    \ later stages (e.g., changing design when testing is finishing up is difficult).\
    \ And if we wish to make changes, they are less costly to make at the beginning\
    \ of the project than during later phases. Therefore, during the initiating and\
    \ planning phases, our analysis can shift the information curve if we leverage\
    \ the opportunity provided by the Ability to Change Paradox, work with the right\
    \ stakeholders, and follow the hybrid project management processes and principles.\n\
    \nAbility to Change Paradox: When changes are least costly and easiest to make\
    \ at the beginning of the project, we lack information; however, when we have\
    \ better information later in the project, those changes are often complicated\
    \ and expensive.\n\nIf risks are discovered later in the project, they may become\
    \ issues resulting in a less than successful project with issues like missed milestones,\
    \ overbudget expenditures, and quality compromises. We can mitigate this problem\
    \ by shifting the information curve: bringing forward information ([Figure 7.1](#index_split_017.html#filepos231299))\
    \ to increase the quality and quantity of information sooner rather than later\
    \ in the project. The Project Feasibility Gizmo is a tool that guides the project\
    \ manager to understand the project better sooner, thereby shifting the information\
    \ curve. The project manager learns more about the project to develop better plans,\
    \ with greater lead time to manage project risks and avoid costly changes later;\
    \ the foundation of front-end loading.\n\n![](images/00009.jpg)\n\nFigure 7.1\
    \ Ability to change paradox\n\nInitiate Phase: Final Thoughts\n\nDuring the initiation\
    \ phase, the project manager strives to get formal approval to initiate the project.\
    \ The project manager works with the project sponsor to develop a PID that gives\
    \ authority to the project manager to proceed to the planning phase. The Gizmo\
    \ might be used to develop a deeper understanding of the project to shift the\
    \ information curve to avoid costly changes later in the project.\n\nMicrolearning\n\
    \nFollowing are some online learning activities to deepen your understanding of\
    \ the initiate phase; search for:\n\n> • How to create an infographic? \n\n> •\
    \ What KPIs are used in project management? Planning and using project management\
    \ KPIs and project assessment criteria can help you deliver the right amount of\
    \ project management quality. \n\n> • How does the ITIL 4 change control practice\
    \ work? \n\nExamine your organization:\n\n> • Identify the project management\
    \ KPIs your organization tracks and reports. Are these the best KPIs to measure\
    \ progress? \n\n> • Investigate how your organization initiates projects. \n\n\
    [CHAPTER 8](#index_split_004.html#filepos7423)\n\n[Plan Phase](#index_split_004.html#filepos7423)\n\
    \nThe purpose of the planning phase is to develop a plan that defines and predicts\
    \ how the project will be executed, how much the project will cost, when the work\
    \ will be executed and completed, the risks and issues encountered, and so on.\
    \ The project manager identifies the work to be completed and who will complete\
    \ the work. The project manager will produce a plan that expands the PID and may\
    \ include a detailed schedule and budget. The goal is to approve the project plan\
    \ to exit the planning phase.\n\nLean Project Planning Process\n\nLean project\
    \ planning focuses on reducing waste and satisfying our stake-holders. We can\
    \ follow a lean project planning process ([Figure 8.1](#index_split_018.html#filepos235407))\
    \ to expeditiously plan and shift the information curve resulting in better project\
    \ plans. This phase aims to develop a lean project plan for leadership approval.\
    \ We begin the process by meeting with our project sponsor and begin planning:\n\
    \n> 1\\. Mission statement: Validate the mission statement (scope statement) developed\
    \ with the sponsor and make it measurable and objective. (e.g., complete an audit\
    \ of all IT services by June 2023; there is no budget as this is an internal project.)\
    \ \n\n> 2\\. Project priority: Identify the project priority (Priority Triangle,\
    \ discussed later) to achieve alignment. \n\n> 3\\. Success criteria: Document\
    \ project success criteria (Done–Won–Who, discussed later) which also contribute\
    \ to alignment. \n\n> 4\\. Work breakdown structure: Use the mission statement\
    \ to develop a high-level work breakdown structure (WBS) that identifies the main\
    \ work packages. \n\n![](images/00012.jpg)\n\nFigure 8.1 Hybrid project planning\
    \ process\n\n> 5\\. Schedule: Use the WBS to develop a high-level Gantt chart\
    \ (bar chart), and if your project is sufficiently large, develop a schedule detailing\
    \ the critical path and float. Smaller projects can often be managed with a task\
    \ list and completion dates aligned with the Gantt chart. \n\n> 6\\. Budget: Some\
    \ projects do not require a budget as they are internal projects requiring minimal\
    \ external resources. However, some projects require significant external resources\
    \ (e.g., technical expertise and new equipment) to complete and benefit from following\
    \ project budget and cost management processes. \n\n> 7\\. Risks and issues: Identify\
    \ critical risks and issues (I always include the message “our project can fail,\
    \ but with your support, we are more likely to succeed!” to encourage buy-in from\
    \ the sponsor). \n\n> 8\\. Governance: Agree on governance and reporting (e.g.,\
    \ What information does the project sponsor and other stakeholders desire? Will\
    \ there be monthly or weekly status meetings?). \n\n> 9\\. Project roles and responsibilities:\
    \ Agree on the project sponsor and project manager. \n\n> 10\\. Lessons learned:\
    \ Conduct a lessons learned exercise at the start of your project. Ask the sponsor\
    \ about what went well and what was challenging on previous projects, so you can\
    \ benefit from the lessons learned at the start of the project. Your sponsor will\
    \ appreciate your willingness to incorporate their ideas into your project; you\
    \ have started effective team building. \n\nNext, after planning with the project\
    \ sponsor, meet with the SMEs to complete the work identified in the WBS. We repeat\
    \ much of what we have completed with the project sponsor: review the mission\
    \ statement and project priority (we can use the PID infographic to begin planning\
    \ meetings). We examine the WBS to see if anything is missing. Thus, we have an\
    \ iterative and inclusive approach to project planning, beginning with the project\
    \ sponsor and main project contributors.\n\nWe take an iterative and inclusive\
    \ approach to develop the project plan. We begin planning with the sponsor and\
    \ key project participants. We develop a high-level project plan to be presented\
    \ to key stakeholders in a project planning workshop (PPW) (see Project Planning\
    \ Workshop section). Additional feedback is gathered in the workshop, and the\
    \ team endorses the project plan. The plan is then presented to leadership for\
    \ approval (e.g., baseline the project plan).\n\nMicrolearning\n\nIn Shields Up,\
    \ we use many traditional project management tools and processes (e.g., budgeting\
    \ and scheduling) because they have a long history of success. Therefore, we direct\
    \ the students to search online to improve their understanding of the essential\
    \ project management tools and processes. You can search online for detailed instructions\
    \ and templates to complete the following components of a project plan.\n\n> •\
    \ How to create a project charter? \n\n> • How to write a project mission statement?\
    \ \n\n> • How to create a WBS? "
