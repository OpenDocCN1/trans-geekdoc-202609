    To improve the probability of success with the change control process, try to
    understand your audience’s expectations; what do the approvers want? We can tell
    the story the project plan was developed collaboratively with the stakeholders
    and endorsed. The approvers are interested in key risks and issues and your treatment
    plans. They also want to know how you will keep them informed throughout the project.
    Therefore, you can increase the likelihood of approval through collaboration,
    develop your project plan on a risk management foundation, and follow a hybrid
    project management approach. Some organizations follow an “approval chain,” beginning
    with business/sponsor approvals and ending with senior IT leadership approvals.
    The rationale is to have the business representatives approve the project plan
    first; once they approve, IT will approve. After the project plan is approved,
    archive the meeting’s minutes that provide your approval to proceed.


    ## Ubiquitous Cybersecurity Planning


    It is good practice to build cybersecurity into our projects rather than adding
    cybersecurity as the project prepares to go live. There are many resources to
    guide project planning to include cybersecurity, including the `ISO 27002` Information
    Technology-Security Techniques-Code of Practice for Information Security Controls
    (`ISO 2018a`, `1–90`):


    > 1. Ensure the development and test environments are secure.

    > 2. Add security requirements to the design.

    > 3. Include security within the milestones.


    Systematic project planning can shift the information curve and improve the probability
    of cybersecurity project success.


    ## Plan Phase: Final Thoughts


    Project planning is a fundamental part of the project and critical to success.
    When one assesses the root cause of project failure, insufficient planning and
    risk management are often cited along with inadequate testing. Therefore, allow
    sufficient time to plan your project. Following an integrated and lean planning
    process can increase the probability of project success. We aim to learn more
    about the project sooner to avoid costly changes later in the project. We can
    shift the information curve with project planning tools like the `Project Management
    Gizmo`, `Priority Triangle`, `Done–Won–Who`, and `PLOs`. These tools reveal essential
    information like risks and issues; following the risk management process brings
    risks and issues under control.


    We apply quality assurance and control techniques like reusing templates to reduce
    risks. We plan and design in security so that the technology we deliver is more
    likely to fit within our technology ecosystem. One message we need to give is
    that our project can fail. However, we are more likely to succeed with stakeholder,
    sponsor, and leadership engagement. Finally, we package the project plan as a
    professional report with branding, attractive layout, and design. A comprehensive
    and appealing design gives the reader confidence that they have chosen the right
    project manager.


    ## Microlearning


    Project planning is a skill that improves with use. The following topics can improve
    your understanding and application of project management and improve the probability
    of project success. Search online for the following topics to deepen your understanding
    of project planning:


    > • How to make a project communications plan?

    > • How to use a risk register?

    > • Search for “project planning templates.”

    > • Search for “project planning software.”


    I lead a project where the European vendor closed his office for a month in December
    and January when 75% of his company (18 people in total) were sick with the Flu.
    The owner looked after his team and shut down the company for a month to help
    everyone recover. Our vendor returned to the project in mid-January, and our project
    was delayed three weeks. We rebaselined our project schedule using the change
    control process.


    Cross-functional flowcharts with “swim lanes” are an effective way to illustrate
    processes and task ownership. We use cross-functional flowcharts with Lean Six
    Sigma process optimization projects to document the as-is process and its “pain
    points.” We optimize to re-draw the process to illustrate the reduction in steps
    and pain points. Drawing processes with cross-functional flowcharts is a useful
    skill for project participants.


    ## CHAPTER 9


    ### Design Phase


    Projects are initiated to deliver a product or service. The design phase is to
    develop a design for the product or service based on user requirements. Technology
    projects often have multiple design documents, such as the application detailed
    design, low-level infrastructure design, and integration design. The goal is to
    document the design collaboratively developed with the product or service users
    and then approve the design. Thus, end users and the technical team work together
    to develop a design that is submitted for approval. Some organizations have business
    analysts to assist with design activities and requirements elicitation and documentation.
    Once the design is approved, the project team moves to the next phase, where the
    technical team works to build the product or service according to the approved
    design. Systems analysis and design is a core topic in information systems programs
    at the postsecondary level and outside our project management perspective scope.
    However, project managers oversee the design phase and should be familiar with
    systems analysis and design basics.


    ### Design Phase Best Practices


    The `ITIL 4` provides detailed guidance on designing a service and guides the
    reader to take a holistic design approach. Quality, risk, and project management
    contribute to a design that delights the end user. However, full value is unlikely
    to be delivered if such a holistic approach is not followed (`Limited, AXELOS
    2019, 34`). The design can also be improved by using design thinking techniques
    (`Defossez, McMillan, and Vuppala 2020`, `4`) and the Lean Six Sigma approach
    to optimize a process. For example, we can improve our design by designing-in
    cybersecurity functionality rather than addressing cybersecurity as an afterthought
    during the transition to the production environment phase.


    The project team needs to consider the risks throughout the project and are guided
    by `ITIL`’s risk management practice (`Limited, AXELOS 2019`, `95–97`). An example
    of applying risk management to design is to apply the Cybersecurity Golden Rule:
    don’t build what you cannot adequately protect (`Skilton and Hovsepian 2018`,
    `207`). We are also reminded that we can fail without a thorough project plan
    and not following good design practices (`Limited, AXELOS 2019`, `132–134`). If
    you get the design right and follow a lean approach to implement the design, you
    are more likely to optimize value.

