    ## 4. Value streams and processes


    The organization’s value streams and processes are those activities and processes
    we follow to deliver services and products valued by the user. In this dimension,
    we are guided to become lean and responsive to change.


    Managing work within these ITIL 4 dimensions from a holistic perspective will
    improve project success since we do not work in isolation; these dimensions impact
    our cybersecurity projects. When planning our cybersecurity projects, we may consider
    these four dimensions—risks, issues, assumptions, and constraints.


    Like other standards and frameworks, ITIL 4 includes principles to guide our decisions
    and actions when completing work in the Service Value Chain. When organizations
    adopt these principles, they increase the likelihood of a common approach to delivering
    services and products. These principles apply to most Service Value Chain activities
    (Limited, AXELOS 2019, 47–48):


    1. **Focus on value**: Ensure all activities create value, directly or indirectly,
    to the organization, users, and/or other stakeholders.

    2. **Start where you are**: Apply lean thinking to value chain activities, optimizing
    existing products and services before throwing away what exists and introducing
    a new project. We look to leverage what is available to reduce waste through a
    systematic process to measure, observe, and improve (the Lean Six Sigma method
    aligns neatly with this principle).

    3. **Progress iteratively with feedback**: Deliver services incrementally, if
    possible, rather than all at once to reduce risk and improve the probability of
    successfully delivering the intended value. Therefore, look for opportunities
    to break up your cybersecurity projects into multiple, smaller projects (e.g.,
    phases 1 and 2). Build-in regular feedback opportunities to ensure value is being
    delivered.

    4. **Collaborate and promote visibility**: We deliver services through the Service
    Value Chain, often in teams where collaboration can lead to improved engagement,
    support, commitment, lasting outcomes, understanding, trust, and cooperation.
    Sharing visibility also contributes to these positive outcomes.

    5. **Think and work holistically**: Value is improved when delivered conceptually
    as a full service or product, rather than individual components. Value is increased
    when the Service Value System (`SVS`), four dimensions of service management,
    and these principles are coordinated and integrated. Visibility into the entire
    service value stream improves understanding, management, and control. The think-and-work
    holistically principle is good cybersecurity practice.

    6. **Keep it simple and practical**: We endeavor to complete Service Value Chain
    activities with a minimum number of steps. Lean thinking is encouraged.

    7. **Optimize and automate**: We look for opportunities to improve the Service
    Value Chain to maximize the value of services and products we deliver. Increasingly,
    we use technology and automation and quality improvement methods like the Lean
    Six Sigma DMAIC process to guide improvements.


    These principles are foundational in that they should guide the organization in
    all circumstances, even if there are changes to organizational goals, personnel,
    project type, and so on. The ITIL principles are intended to shape organizational
    culture in all activities (e.g., projects and operations) along the Service Value
    Chain (Limited, AXELOS 2019, 17–18).


    ITIL 4 includes practices representing capabilities used to create value in the
    Service Value Chain (`Table 4.1`). ITIL 4 has published practice guides to provide
    resources for service management; think of the practices as a toolkit you use
    in the service management to deliver value. The ITIL practices can be mapped to
    traditional project management delivery method used in technology projects to
    illustrate their relationship including Transition to Production (`T2P`).


    Thus, ITIL 4 has a comprehensive and holistic framework to manage technology services
    such as cybersecurity projects. ITIL 4 supports tailoring the framework to the
    organization, context, and project; hybrid project management is supported: “the
    ITIL `SVS` supports many approaches such as agile, DevOps, as well as traditional
    process and project management, with a flexible value-oriented operating model”
    (Limited, AXELOS 2019, 44).


    ### Information Systems Life Cycle


    If ITIL looks familiar to you, it may be due to ITIL being aligned with systems
    development cycle (`SDLC`) that we learn about in university and college subjects.
    The cycle is process-based and iterative, designed to deliver quality systems
    to support business and customer expectations, much like ITIL. Thus, `SDLC` takes
    a process-oriented approach with an iterative improvement cycle (`Figure 4.8`).
    `SDLC` includes project activities (planning through implementing) and operational
    activities (maintenance, and optimization).


    This traditional approach to systems development is also known as the waterfall
    model. It has been modified to provide alternative ways to develop systems such
    as the spiral model, V-model, rapid application development, rational unified
    process, and agile methods (2015, 52).


