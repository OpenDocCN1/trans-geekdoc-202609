    # NIST 网络安全框架核心示例


    美国国家标准与技术研究所（`NIST`）的《改进关键基础设施网络安全框架》是全球领先的网络安全框架。因此，所有 IT 专业人员（包括网络安全专业人员）都应该意识到
    `NIST` 框架的重要性，因为每个人在网络安全中都扮演着角色。`NIST` 标准根据功能、类别、子类别和参考文献进行排列（参见表 A1.1）；美国国家标准与技术研究所
    2018, 50）。


    `NIST` 框架帮助组织审计其网络安全能力、识别差距并为改进设定目标（更多项目）。主导网络安全审计或更广泛的技术审计是良好的职业发展项目，因为它们是非技术性的，并且能够提供对系统和服务的概览。


    ## 表 A1.1 NIST 网络安全框架核心示例


