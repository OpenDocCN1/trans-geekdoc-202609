    \ 软件开发与管理\n\n![](img/00003.jpg)\n图 4.8 系统开发生命周期\n\n### 练习\n回顾 ITIL 服务价值链，并比较你的组织与该框架的对齐程度。你使用了哪些实践？哪些可以加入你的简历中？\n\
    \n当遵循信息系统生命周期方法时，结果更具预测性，因为利益相关者理解流程中的步骤并可以相应计划。我们鼓励在 `SDLC` 中构建网络安全，包括威胁建模、设计评审以及环境中的静态和动态测试。顶级网络安全框架（以及\
    \ ISO 质量管理）暗示了传统的或预测性的项目管理方法。因此，本书强调传统的项目管理交付方法，以帮助读者交付常规的网络安全项目。\n\n## 项目管理框架\n\
    \n项目管理框架分为两类：针对个人的能力框架和针对组织的成熟度模型。类似于网络安全能力模型，也有项目管理能力模型，例如 `PMI` 的`项目管理成熟度模型`\
    \ (`ProMMM`）。由于网络安全专业人员不太可能领导项目管理项目，`ProMMM` 超出了本书的范围。相反，我们关注针对个人的项目管理框架（例如《项目管理知识体系指南》（`PMBOK\
    \ Guide`）和 `PRINCE2`），旨在引导他们进行项目管理。\n\n多个项目管理框架可以在从预测性到适应性交付的连续体上解释（图 5.1）。我们可以使用预测性项目管理交付方法，通过进度表、预算和其他工具来计划项目，分阶段预测任务完成情况。这种传统方法有时被称为瀑布式项目管理，因为它是顺序且线性的；在上一个阶段完成之前，新阶段不会开始。大多数专业组织（例如\
    \ `PMI` 和 `国际项目管理协会`）都支持预测性的项目管理方法。\n\n然而，随着敏捷项目管理的日益流行，项目管理协会已在他们的标准中接纳了如 `Scrum`\
    \ 方法等适应性项目管理方法。当存在以下情况时，敏捷交付方法是合适的：(i) 项目团队交付的产品或服务存在模糊性，或 (ii)交付方式存在模糊性。复杂模糊的项目可以从适应性交付方法中受益；但此类方法不在本书的范围内，因为\
    \ (i) 大多数网络安全项目的模糊性较低（例如安装新软件或进行审计），以及 (ii) 顶级网络安全框架暗示了传统的或预测性的项目管理方法。然而`Shields\
    \ Up` 中的混合项目管理方法在遇到足够的模糊性或复杂性时（例如设计挑战），能够兼顾适应性工作需求。\n\n![](img/00008.jpg)\n图 5.1\
    \ 项目交付连续体\n\n《项目管理知识体系指南》\n\n"
