- raw: "> 1\\. Deliverable handover: Formally transfer the deliverables to the sponsor\
    \ and verify acceptance in meeting minutes or an e-mail. The requirements traceability\
    \ matrix can be used ([Figure 11.2](#index_split_021.html#filepos342455)), and\
    \ columns include links to confirming meeting minutes or e-mails. \n\n> 2\\. Project\
    \ completion notice: Inform all stakeholders that the requirements have been delivered\
    \ and the project is completed. Direct the stakeholders to contact the service\
    \ desk if they need assistance. \n\n> 3\\. Contract closeout: Review the contracts\
    \ to ensure that all contractual obligations have been met. Some project managers\
    \ use the requirements traceability matrix to document whether contract obligations\
    \ have been met. \n\n> 4\\. Resources: Release resources (people and equipment)\
    \ and celebrate with your team. \n\n> 5\\. Lessons learned: Complete a lessons\
    \ learned exercise with the project stakeholders considering what went well and\
    \ what can be improved. \n\nDocument these actions in a closeout report and archive\
    \ project documents for future reference. Inform the sponsor by e-mail that the\
    \ project is closed out (terminated) and add the notification to the project archives.\n\
    \nLessons learned is a common practice in many organizations. What went well?\
    \ What did we struggle with? What should we stop doing? What should we continue\
    \ to do? And other questions help to learn, which is a cornerstone in all frameworks\
    \ that guide good practice and hybrid project management in Shields Up. Closeout\
    \ reports often include a lessons learned section. However, the lessons are often\
    \ collected but not always learned; why do we have dismal and recurring project\
    \ failure rates? Therefore, my recommendation is to complete lessons learned at\
    \ the beginning of the project and the start of each project phase. During team\
    \ meetings, these can be short discussions to apply the wisdom and knowledge developed\
    \ on previous projects. Not only can we apply previous learnings, but the team\
    \ values having their input implemented. Lessons learned can be implemented more\
    \ effectively when the lessons are prioritized and assigned to a person to complete\
    \ with a tracked and reported deadline.\n\nMicrolearning\n\nSearch online for\
    \ more information about the tail end of projects; a strong finish is the preferred\
    \ way to terminate projects:\n\n> • How to terminate a project? \n\n> • How to\
    \ complete a lessons learned exercise? \n\n> • Locate contract closeout templates\
    \ and contract closeout letters? \n\n> • Find project closeout best practices?\
    \ \n\n[CHAPTER 14](#index_split_004.html#filepos8124)\n\n[Operations and Optimize](#index_split_004.html#filepos8124)\n\
    \nWhen the project is closed out, operations manage the service delivered through\
    \ your project. ITIL provides a framework, tools, and processes to manage and\
    \ optimize the service. Remnants of the project may remain; there may be tickets\
    \ on hold to complete outstanding project actions. For example, a requirement\
    \ might not have been satisfied due to a defect fixed with a future patch. Vendors\
    \ have their release strategy and schedule for patches and upgrades. The outstanding\
    \ ticket can remind operations to look for the patch and plan its release to satisfy\
    \ outstanding functionality.\n\nThe Lean Six Sigma approach to optimization coupled\
    \ with ITIL’s and ISO 9001’s continual improvement provides frameworks and tools\
    \ to optimize products and services to deliver more value. Optimization will be\
    \ more successful if proven processes are followed, like the Lean Six Sigma DMAIC\
    \ problem solving and optimization process. Optimization proposals can result\
    \ in new projects and initiatives along the Service Value Chain.\n\nSome projects\
    \ take an iterative and phased approach (endorsed by ITIL), beginning with a minimum\
    \ install. Once the basics are installed (“vanilla install”) and used, end users\
    \ better understand what should be optimized and extended. Optimization can trigger\
    \ new projects that can be considered using the change control process to provide\
    \ approval to proceed with the new project.\n\n[CHAPTER 15](#index_split_004.html#filepos8247)\n\
    \n[Conclusion](#index_split_004.html#filepos8247)\n\nWhen we read about digital\
    \ transformation, we see evidence we are entering a period of colossal digital-driven\
    \ change such as quantum computing and AI leveraged research in health care (IBM\
    \ 2021, 1–2). The way we live and work is quickly changing due to an increased\
    \ pace of technology adoption. Businesses are forging strategies enabled with\
    \ technology and innovation. One implication of this uptake in technology is the\
    \ demand and priority for cybersecurity services have increased. The threat landscape\
    \ and associated vulnerabilities have greatly expanded. Businesses are increasing\
    \ their technology and cybersecurity budgets but require the CISO to justify and\
    \ demonstrable a return on investment.\n\nWith increased cybersecurity work and\
    \ larger budgets, organizations actively recruit cybersecurity professions ranging\
    \ from entry-level roles to specialized roles like cloud security specialists\
    \ and cybersecurity project managers. Unfortunately, the demand for cybersecurity\
    \ talent far exceeds the supply. The cybersecurity skill gap creates problems\
    \ for businesses, such as delaying cybersecurity projects until a cybersecurity\
    \ project manager is available to complete the project. The skill gap also creates\
    \ opportunities for cybersecurity professionals to lead their first project. With\
    \ leadership comes the responsibility for outcomes: project success. Therefore,\
    \ project managers are more likely to deliver successful projects following a\
    \ structured rather than an ad hoc project management delivery approach.\n\nOrganizations\
    \ increasingly rely on technology to deliver products and services and keep our\
    \ information confidential, private, and secure. Organizations adapt best practices\
    \ and frameworks to provide a structured approach to delivering products and services\
    \ that meet approved requirements and service level agreements. Organizations\
    \ rarely apply the standards and frameworks as designed; instead, they pick and\
    \ choose the elements required to meet their requirements (e.g., they tailor the\
    \ framework to their specific situation). We see tailoring guidance in project\
    \ management standards like the PMBOK® Guide and ITIL to pick the essential project\
    \ management tools and processes required to deliver a successful project ([Figure\
    \ 15.1](#index_split_025.html#filepos378256)). The focus of hybrid project management\
    \ documented in Shields Up is to follow a structured approach to meet stakeholder\
    \ needs and leverage opportunities to deliver value to the end users. The traditional\
    \ project management delivery approach is appropriate for most projects. It has\
    \ a foundation of risk management to improve the probability that value will be\
    \ delivered to the service users. We may include iterative work to determine the\
    \ best design or fix a defect found during testing. However, most cybersecurity\
    \ projects can be implemented with the traditional project management delivery\
    \ approach with iterations when required. While our project management approach\
    \ may vary from project to project, our hybrid project management principles do\
    \ not; we have a sense of urgency, encourage collaboration, and focus on delivering\
    \ value.\n\n![](images/00010.jpg)\n\nFigure 15.1 Shields Up hybrid project management\n\
    \nCongratulations for making it thus far! You may want to review specific chapters,\
    \ review the exercises, and complete the microlearning actions. Project management\
    \ is a dynamic specialty attracting new practitioners and researchers each year,\
    \ resulting in best practice maturity and new ways of work. Couple the advances\
    \ in technology and cybersecurity with project management, we have a dynamic environment\
    \ to plan, implement, and sustain value. Our journey to learn about project management\
    \ continues.\n\n[PART III](#index_split_004.html#filepos8357)\n\n[Appendixes](#index_split_004.html#filepos8357)\n\
    \n[APPENDIX 1](#index_split_004.html#filepos8472)"
