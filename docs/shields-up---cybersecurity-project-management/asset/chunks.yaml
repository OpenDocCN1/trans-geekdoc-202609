    “《Shields Up：网络安全项目管理》涵盖了读者在 IT 部门中可能的所有广泛领域，包括网络安全、战略和运营项目。这本书将深受那些执行项目管理、质量管理、风险管理、网络安全、IT
    支持、战略规划等职位人士的喜爱。我惊讶地发现它与 `NIST`、`ITIL`、`PMBOK Guide` 甚至 `ISO Risk Management`
    完美契合。我提倡一种基于风险的方法来管理网络安全，《Shields Up》这本书分享了核心知识和专业知识，等等。”——Irene Corpuz, PMP,
    `ITIL`, CISA, CEH, `ISO 27001`, 首席实施与审计师，项目，联邦教育，阿联酋


    “卓越的项目实践”


    “Skulmoski 博士的这本书是卓越项目实践的典范。它所交付的内容对于快速发展的业务环境至关重要，并且以值得赞誉的及时性完成了任务。《Shields Up》将使项目经理成功交付技术和网络安全项目。”——Alan
    Patching, PhD, 项目管理, 外部事务，邦德大学，澳大利亚


    “清晰且简洁地指导网络安全专业人士”


    “在《Shields Up》中，Skulmoski 清晰且简洁地指导网络安全专业人士如何将项目管理技术和原则融入工作中，以提升他们的项目和职业。他非常了解网络安全专业人士的困境以及对时间的巨大需求。通过提供项目管理的专家建议（其中包括最新的见解和发展），他为网络安全专业人士提供了成功所需的关键工具。”——Derek
    Molnar, PMP, IT 项目经理，科罗拉州立大学，美国


    “可靠的指南”


    “《Shields Up》是一本可靠的指南，它涵盖了网络安全项目中常见的所有阶段和未来需求。由于技能短缺和项目需求的增加，IT 交付只会恶化。这本书完美地涵盖了标准、衡量实践（`KPIs/SLAs`）以及从端到端视角对网络安全项目管理的指导原则。总体而言，我的项目提前结束了，因为新技术可预测、可靠且符合用途：这些技术特征为终端用户带来了信心。当项目结束时，供应商能够干利地离开，因为质量问题从来不是问题；我很感谢
    Greg 同样照顾了他的供应商。”——Thiago Santos, 高级技术架构师，Mulesoft，加拿大


    “务实、信息丰富且读起来愉快的书籍”


    “首先，感谢作者写了这本书。我发现它非常务实、信息丰富且是一本读起来愉快的书籍。《Shields Up》结构良好且易读。作者对网络安全和项目管理专业提供了坚实的介绍，并辅以练习和微学习机会。此外，我觉得图表非常有帮助，它们总结了知识并有助于记忆，特别是每个指导框架（例如
    `NIST, ITIL 4, 和 PMBOK Guide`）。这本书在技术和项目管理内容之间取得了很好的平衡，非常适合网络安全专业人士和大多数技术职位。《Shields
    Up》也会吸引那些在项目管理办公室（`PMOs`）工作的人。这本书的一个重要优势是，它可以引导技术专业人士转型到项目管理职业。这本书可以作为技术与项目管理实践领域知识差距的快速参考指南。总体而言，我很喜欢阅读《Shields
    Up》，并将其推荐给对职业发展感兴趣的技术人士。”——Israa Abulawi, BEng, `ISACA`, 企业项目经理，医疗保健技术和数据管理，阿联酋


    “独特的资源”


    “《Shields Up》是一份真正独特的资源。它通过项目管理的视角探索了网络安全这一重要领域。我没有见过像这样详尽且建议丰富的书籍。我相信，对于任何想在我们日益数字化的世界中从事职业的人来说，这都是必读之目。”——Craig
    Langston, PhD 前言


    那是 2012 年 7 月底，我刚刚抵达阿布扎比，接受了 `IBM` 在中东和非洲的职位。我被聘请为新建医院 `阿布扎比医学中心` 建立并执行学习职，并结了我的主要客户
    Gregory Skulmoski。


    Greg 敏锐且乐观，衣着无苟，精力充沛，步履轻盈。他热情地迎接了我。尽管那时我已经拥有近 15 年的 IT 项目管理经验，但随后与 Greg 工作的几周、几个月和几年是一场教育。我的一些新同事非常讨厌向
    Greg 提交交付物（例如详细需求），因为他的审查是非常详尽的。事实上，Greg 坚持最高水平的质量，并在执行中展示了对项目管理理论和实践的深度熟悉。


    我后来得知，Greg 关注质量保证（防止错误）而非质量控制（修复缺陷），这是一项团队建设工作，其目标是加强对细节的关注并在第一次就做对技术，这是一个非常精益的方法。Greg
    的团队按时交付了所有项目，上线后的监控阶段异常平静，表明技术被成功采用。Greg 的项目提前结案，因为新技术可预测、可靠且符合用途：这些技术特征为终端用户带来了信心。当项目结束时，供应商能够干利地离开，因为质量问题从来不是问题；我很感谢
    Greg 同样照顾了他的供应商。


    Skulmoski 博士还证明自己装备完备，精通成人学习和培训理论（成人教育）、课程和科目学习成果、教学设计以及成功学习所需的许多其他组成。进入 2015
    年 3 月，我们准时开启了阿布扎比医学中心的大门，所有的护理人员都能使用顶级的系统提供关怀。

    '
