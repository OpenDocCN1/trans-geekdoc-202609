    also desire more connections with external partners and customers. Digital ecosystems
    are emerging that integrate business-to-business and business-to-consumer interactions
    (Dietz, Khan, and Rab 2020, 3) to create value for all stakeholders in the network
    (Diana and Torrance 2020, 1). We can expect businesses to request more participation
    in digital ecosystems to keep up with fast-evolving customers and workers (Dhasarathy
    et al. 2020, 2). These ecosystems are complex and welcomed by consumers; however,
    they present the potential for additional vulnerabilities to be managed by the
    cybersecurity teams.


    > To repeat, organizations are focused on delivering value; therefore, tuning
    our technical ecosystems and processes to optimize value aligns business and IT
    goals.


    Organizations are maturing with their project management and are beginning to
    measure key performance indicators (KPIs) for how quickly projects are initiated,
    planned, designed, built, tested, and delivered to the end-user (Fitzpatrick and
    Strovink 2021, 4). There is a shift from failing quickly to succeeding quickly
    in projects (PMI 2020, 2). One of the early issues related to speedy delivery
    cycles is that cybersecurity might not receive sufficient treatment resulting
    in avoidable vulnerabilities (Boehm and Smith 2021, 2).


    Digital transformation projects are changing how we work. As our digital connections
    increase and processes are optimized, the business will be data thirsty when faced
    with decisions. We see an increased demand for analytics as a vehicle to provide
    the organization with a competitive advantage (Dietz et al. 2020, 6). Expect more
    AI-supported analytics with data inputs from a wide variety of sources. One result
    of using AI-supported analytics is that businesses will predict new opportunities
    that may become new projects to implement and more digital services to protect.
    Indeed, analytics-based decision making is at the core of cybersecurity best practices.


    We see the drive toward leanness and digitization to accelerate the demand for
    automation projects. CIOs (Chief Information Officer) are invited to partner with
    the business to deliver “high impact initiatives” (Gartner 2020b, 3). There is
    a growing imperative for automation projects to reduce costs through reduced human
    involvement and improvements to customer experience. Automation and robotics will
    be a growth area since a diverse suite of technologies (e.g., IoT, AI, sensors,
    and machine intelligence) will be combined to create new automation opportunities
    (Skilton and Hovespian 2018, 59). Again, we will see more automation and integration
    projects requiring cybersecurity.


    Organizations are racing to connect with partners and applications (Mulesoft 2021,
    4) and external data to improve competitiveness (Aaser and McElhaney 2021, 2).
    More connections can bring additional innovation and opportunities; increased
    connectivity can potentially bring more cybersecurity vulnerabilities. The nature
    of connections is also evolving with complex systems relationships forming among
    the physical, biological, and digital domains (Skilton and Hovsepian 2018, 55).
    More connections lead to digital ecosystems development. However, hyperconnected
    environments present the problem where an attack on the digital ecosystem can
    negatively impact downstream actors dependent on the attacked asset (Creese et
    al. 2020, 21).


    Business initiatives strive to connect an organization’s systems; however, they
    also desire more connections with external partners and customers. Digital ecosystems
    are emerging that integrate business-to-business and business-to-consumer interactions
    (Dietz, Khan, and Rab 2020, 3) to create value for all stakeholders in the network
    (Diana and Torrance 2020, 1). We can expect businesses to request more participation
    in digital ecosystems to keep up with fast-evolving customers and workers (Dhasarathy
    et al. 2020, 2). These ecosystems are complex and welcomed by consumers; however,
    they present the potential for additional vulnerabilities to be managed by the
    cybersecurity teams.


    > To repeat, organizations are focused on delivering value; therefore, tuning
    our technical ecosystems and processes to optimize value aligns business and IT
    goals.

    '
  trans: '

    我们看到精益化和数字化的趋势正加速对自动化项目的需求。首席信息官（CIO）受邀与业务部门合作，交付“高影响倡议”（Gartner 2020b, 3）。自动化项目日益迫切地需要通过减少人工参与和改进客户体验来降低成本。自动化和机器人将成为一个增长领域，因为多种技术（例如
    IoT、AI、传感器和机器智能）将结合起来，创造新的自动化机会（Skilton and Hovespian 2018, 59）。同样，我们将看到更多需要网络安全的自动化和集成项目。


    ## 启用超连接


    组织正在竞相与合作伙伴、应用程序（Mulesoft 2021, 4）以及外部数据连接以提高竞争力（Aaser and McElhaney 2021, 2）。更多的连接可以带来额外的创新和机会；但连接性的增加也可能带来更多的网络安全漏洞。连接的本质也在发生演变，物理、生物和数字领域之间形成了复杂的系统关系（Skilton
    and Hovsepian 2018, 55）。更多的连接导致了数字生态系统的发展。然而，超连接环境带来了一个问题：对数字生态系统的攻击可能会负面影响依赖受攻击资产的下游实体（Creese
    et al. 2020, 21）。


    ## 加入新兴的数字生态系统


    业务倡议致力于连接组织的系统；然而，它们也渴望与外部合作伙伴和客户建立更多连接。数字生态系统正在出现，整合了企业对企业（B2B）和企业对消费者（B2C）的交互（Dietz,
    Khan, and Rab 2020, 3），为网络中的所有利益者创造价值（Diana and Torrance 2020, 1）。预计企业将要求更多参与数字生态系统，以应对快速变化的客户和员工（Dhasarathy
    et al. 2020, 2）。这些生态系统是复杂的且深受消费者欢迎；但它们为网络安全团队带来了管理额外漏洞的可能性。


    > 重复一遍，组织专注于交付价值；因此，调整我们的技术生态系统和流程以优化价值，使业务和 IT 目标保持一致。


    ## 应对更短的交付预期


    组织的项目管理方面日益成熟，并开始衡量关键性能指标（KPI），以衡量项目启动、计划、设计、构建、测试和交付给最终用户的速度（Fitzpatrick and
    Strovink 2021, 4）。项目正经历从“快速失败”向“快速成功”的转变（PMI 2020, 2）。与快速交付周期相关的早期问题之一是，网络安全可能没有得到足够的重视，导致可以避免的漏洞（Boehm
    and Smith 2021, 2）。


    ## 提供基于分析的决策


    数字化转型项目正在改变我们的工作方式。随着数字连接的增加和流程的优化，业务在面临决策时将产生数据渴求。我们看到对分析的需求增加，将其作为为提供竞争优势的手段（Dietz
    et al. 2020, 6）。预计会有更多来自各种来源的数据输入的 AI 支持分析。使用 AI 支持分析的结果之一是，企业将预测新的机会，这些机会可能成为需要实施的新项目以及需要保护的更多数字服务。事实上，基于分析的决策是网络安全最佳实践的核心。


    ## 客户预期总结

    （注：原文后续重复内容已根据要求不再重复输出）

    '
