    \ Design Phase](#index_split_019.html#filepos318894) \n\n> [Chapter 10 Build Phase](#index_split_020.html#filepos326493)\
    \ \n\n> [Chapter 11 Test Phase](#index_split_021.html#filepos327981) \n\n> [Chapter\
    \ 12 Transition to Production129](#index_split_022.html#filepos353377) \n\n> [Chapter\
    \ 13 Monitor, Stabilize, and Close Out](#index_split_023.html#filepos367163) \n\
    \n> [Chapter 14 Operations and Optimize](#index_split_024.html#filepos372851)\
    \ \n\n> [Chapter 15 Conclusion](#index_split_025.html#filepos374646) \n\n> [Part\
    \ III Appendixes](#index_split_026.html#filepos378929) \n\n> [Appendix 1 NIST\
    \ Cybersecurity Framework Core Example](#index_split_027.html#filepos379167) \n\
    \n> [Appendix 2 Project Management Gizmo](#index_split_028.html#filepos386619)\
    \ \n\n> [Appendix 3 Risk Register](#index_split_029.html#filepos412155) \n\n>\
    \ [Appendix 4 Career Planning](#index_split_030.html#filepos428206) \n\n> [References](#index_split_031.html#filepos445595)\
    \ \n\n> [About the Author](#index_split_032.html#filepos498360) \n\n> [Index](#index_split_033.html#filepos500358)\
    \ \n\n[Testimonials](#index_split_004.html#filepos5850)\n\nShields Up was reviewed\
    \ by a heterogeneous group of diverse experts in technology, cybersecurity, and\
    \ project management. The project management reviewers include both researchers\
    \ and thought leaders in the project management specialty not only with decades\
    \ of experience but also practicing as technology project managers. The cybersecurity\
    \ reviewers are not typical book reviewers (e.g., academics); instead, these reviewers\
    \ work in cybersecurity and related technical domains, resulting in a practical\
    \ understanding of project management and cybersecurity. Therefore, these technology\
    \ innovators know exactly the challenges and demands of cybersecurity projects\
    \ and are well-placed to provide critical reviews such as the following:\n\n“Must\
    \ Read”\n\n“Shields Up: Cybersecurity Project Management is comprehensive and\
    \ incredibly timely, given the ever-increasing cybersecurity threat landscape.\
    \ It should be a must-read for all IT project managers because of the importance\
    \ of ensuring that all IT projects clearly and deliberately address cyber risks\
    \ as just a normal part of the process. You stated it perfectly when you wrote,\
    \ ‘It is good practice to build cybersecurity into our projects rather than adding\
    \ cybersecurity as the project prepares to go-live.’ The most important takeaway\
    \ is the multitude of methodologies and frameworks that IT professionals look\
    \ to for guidance can be nicely aligned and integrated into a coherent delivery\
    \ model without compromising quality or efficiency. I must commend Greg on a well-written\
    \ and comprehensive guide for tackling this new digital world we live in Well\
    \ done!”—Jason Roos, Chief Information Officer, King Abdullah University of Science\
    \ and Technology, Saudi Arabia\n\n“Perfect Alignment”"
