    Risk management is a critical success factor for technology projects and is a
    recommended ITIL general management practice (Limited, `AXELOS 2019`, 95–97);
    get risk management right, and the probability of project success exponentially
    increases. Risk management in Shields Up is aligned with `ISO 31000:2018 Risk
    management—Guidelines` (`ISO 2018b`); therefore, when you follow risk management
    in Shields Up, you are aligned with `ISO 27000 Risk Management`. Lean risk management
    centers on the risk management process supported by a risk register, quality management,
    and simple techniques that can be used on most projects, most of the time. Risk
    management is the process of planning, identifying, analyzing, treating, and controlling
    risks and issues. Risks and issues may be negative (e.g., delays) or positive
    (e.g., opportunities to crash an activity) and can be managed with the risk management
    process and risk register.


    ## The Risk Management Process


    The risk management process (`[Figure 8.7](#index_split_018.html#filepos287002)`)
    is simple and effective; you can use this approach on most projects, most of the
    time. All project plans should include a section about risk and issue management.
    The project manager provides an overview of how risks and issues will be managed
    and communicated, the tools and processes used, and so on. For example, the project
    manager may schedule weekly risk management meetings (`[Table 8.1](#index_split_018.html#filepos269497)`)
    to review the risk register and include risks and issues on the status reports.
    The risk management process is a step-by-step approach. Once a risk is identified,
    it is analyzed qualitatively (high, medium, or low), then treated (risk prevention
    and actions), followed by documenting the risk in the risk register. ITIL and
    project management standards (e.g., `PMBOK® Guide` and `PRINCE2`) have common
    purposes and are naturally aligned. Following the risk management process complies
    with international standards and dramatically improves the probability of project
    success. The risk management process appears in `[Figure 8.7](#index_split_018.html#filepos287002)`,
    where the project team uses risk management throughout all the project phases.


    ![](images/00039.jpg)


    Figure 8.7 Risk management process


    The project manager and team follow the risk management process and identify risks.
    Risk identification includes the risk cause, event, and effect (`[Table 8.3](#index_split_018.html#filepos287865)`)
    and is documented following risk syntax. The important concept is the risk event
    is written with words that convey uncertainty that the risk may or may not occur;
    for example, we use words like `may`, `could`, and `might` to indicate the risk
    event has not yet occurred but could occur. When the proper risk syntax is used,
    understanding improves and communication risks are reduced. Thus, when we identify
    a risk, we frame the risk as a risk cause, event, and effect to aid effective
    and efficient analysis and treatment.


    ## Risk Management Framework and Syntax


    Table 8.3 Risk management framework and syntax


    | Element | Description | Syntax | Analysis | Treatment |

    | --- | --- | --- | --- | --- |

    | `Risk cause` | `Risks arise due to a cause or reason` | `Due to manufacturing
    delays` | `The probability the risk may occur` | `Actions that can prevent the
    risk` |

    | `Risk event` | `Something that may occur` | `may, could, might` | — | `Actions
    that can mitigate the risk` |

    | `Risk effect` | `The consequence of the risk` | `will, has` | — | `Actions that
    can respond to the risk` |


    When we identify a risk, we frame the risk as a risk cause, event, and effect
    to aid effective and efficient analysis and treatment.

    '
