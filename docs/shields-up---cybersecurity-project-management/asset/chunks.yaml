  trans: '


    一些项目受益于风险管理研讨会：关键项目利益相关者聚在一起会持续约两个小时，以识别、分析和处理项目风险与问题。首先，描述你针对项目的风险管理计划，并概述风险管理理论。使用黄色便利贴，并指示参与者在便利贴上画水平线和垂直线，以代表风险管理的不同元素（例如：原因、事件、影响概率、影响、预防和缓解）。共同识别前几个风险，并向参与者展示如何在黄色便利贴上填写风险信息（图
    8.8）。然后，让参与者识别一些风险。这种通用方法允许参与者提出任何风险，旨在让他们共同工作并应用风险管理理论。参与者将他们的风险贴在墙上供大家查看（在线思维导图工具等协作软件可以方便在线风险研讨会）。当参与者写下风险时，他们积极为项目做出了贡献，并发生了团队建设。


    随后，我们可以采取专注的方法，系统地检查与里程碑、关键路径、预算、阶段、采购流程、上线阶段等相关的风险。例如，检查关键路径上的每项活动，以识别、分析和处理风险与问题。我们可以重复风险管理过程来检查主要里程碑、进度、预算等。通过关注特定类别的风险，我们实现了全面性，并显著改变了信息曲线。


    一旦识别出风险，我们就可以风险矩阵对它们进行优先级排序（图 8.9）。我们根据严重程度（`概率 × 影响`）对风险进行排序，根据影响对问题排序（我们不评估问题的发生概率，因为问题已经存在）。例如，高概率/高影响风险应该是团队的重点，因为该风险发生的概率很高，且一旦发生，对项目的影响巨大。然后我们可以对风险进行排序，告知领导层严重风险，并实施我们的处理计划以预防和缓解。风险注册表说明了风险管理工作，并成为一份应与其他项目文档一同保存的历史记录（风险和问题注册表可用于争议和诉讼）。


    ![](img/00002.jpg)


    图 8.8 风险识别、分析与处理


    我们从图 8.9 中也看到我们在黄色便利贴上对自然三元组：原因–发生概率–预防属于同一类，结果–影响–缓解属于同一类。黄色便利贴和风险管理研讨会可以是强大的工具，能够快速识别和理解风险，并促进团队建设以改变所有人的信息曲线。


    ![](img/00007.jpg)


    图 8.9 风险矩阵


    风险管理是我们项目中执行的最重要活动之一。尽管我们有预算和进度，但技术项目交付延迟或超支的比例仍然很高。为什么？风险变成了问题，导致了延迟和过度支出。这些项目经理本认为他们有合适的预算和进度，但仍然超支并延迟交付；他们失败的关键在于风险管理可能没有达到必要的效果。因此，为了显著提高项目成功的概率，我们需要在管理风险和问题方面变得有效高效，这是我们在追求交付价值时使用的混合项目管理的核心。


    ### 练习


    > 思考你的组织或其他你工作过的其他组织：

    > • 你的部门如何管理和报告风险与问题？

    > • 你的组织是否使用 `Monte Carlo Simulation` 来帮助分析风险？

    > • 你所在的行业中 IT 项目的成功率是多少？

    > • 复习 `ISO 27005 Risk Management Process` 以加深对信息安全风险管理的理解。


    ### 微学习


    投资风险管理技能是非常值得的，因为我们在网络安全生态系统中做的一切都涉及风险。因此，以下微学习机会可以扩展你对这一重要主题——项目风险管理的理解。可以在网上查找更多相关信息：


    > • 风险管理定义

    > • 风险、问题和不确定性的定义

    > • 风险管理策略

    > • 风险管理计划

    > • 风险管理模板

    > • 风险管理工具

    > • 风险管理矩阵

    > • `ISO 31000:2018 Risk Management—Guidelines`

    > • 风险管理与 AI

    > • `Monte Carlo Simulation` 以及

    > • 风险管理策略


    ### 质量管理


    质量管理包含了我们用于确保项目交付预期价值的工具和过程，这些价值在项目启动时已记录在质量计划中。我们使用培训、模板和清单帮助管理质量以及其他过程（如规划），并通过阶段关卡等工具来验证产出正确的质量。


    Shields Up 使用两种质量管理过程：质量保证和质量控制（图 4.2）。我们在开展活动之前进行质量保证，以确保活动执行正确。我们可以遵循清单、程序、流程或模板，提高工作按正确质量水平完成的概率。培训也补充了质量保证；例如，团队成员学习使用
    `risk register` 一致地记录风险和问题。或者我们按照配置说明来设置服务器。质量控制在工作完成后对其进行检查；我们发现并修复缺陷。同样，清单、模板、程序和培训可以指导质量控制活动以发现并修复缺陷。例如，我们遵循测试脚本来验证构建是否按照批准的设计运行。因此，我们使用质量保证和控制在项目中交付正确数量的价值：质量保证优于质量控制：ABC。


    我们的混合项目管理方法侧重于第一次就正确完成工作；我们可以通过质量管理和风险管理提高项目成功的概率（`Done–Won–Who`）。我们倾向于质量保证而非质量控制；执行产生极少缺陷的工作，比比作为质量控制努力的一部分去发现并修复缺陷要好。带有模板和清单的质量保证引导我们的工作在第一次就正确完成。风险管理（例如预防活动）有助于确保工作被正确完成。


    我们使用治理技术来帮助确保高质量；例如，我们采用传统的项目管理交付方法构建项目，并在每个阶段结束时设置阶段关卡以验证质量。如果团队完成了高质量的设计，利益相关者将批准设计并进入下一阶段。风险和质量管理是混合项目管理方法固有的，如图
    6.2 所示。你可以看到风险管理过程发生在每个阶段，阶段关卡充当了质量控制机制。我们遵循结构化的模板（例如 `application detailed design`），以保持内容精简并引导内容开发。


    '
