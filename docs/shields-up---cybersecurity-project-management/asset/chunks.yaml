    \ book is not about the specific technologies we are interested in; instead, emerging\
    \ technologies are often sources of vulnerabilities, with many coming from bad\
    \ actors and human error (e.g., cloud misconfigurations). The barrage of attacks\
    \ on new technologies results in a narrow window to patch. Nation-state threats\
    \ will continue and become more innovative as criminal gangs partner and collaborate\
    \ to become more effective. Additionally, we are less concerned about the nature\
    \ of the threat (e.g., malware, phishing, denial of service, and password attacks)\
    \ and more troubled that new technologies bring new vulnerabilities and new methods\
    \ of cybercrime.\n\nTargets of Threats\n\nOrganizations are increasingly being\
    \ targeted by adopting more technologies with potentially more vulnerabilities.\
    \ The human attack surface is also increasing due to the pervasiveness of IoT/AI-IoT\
    \ devices, ever-broadening global hyperconnectivity, and a pivot to remote work.\
    \ Cyberattacks are more sophisticated with attempts to control computer systems\
    \ to immobilize, disturb, or control the technology. For example, we may see more\
    \ weak-link data exfiltration attacks along organizations’ supply chains. Unfortunately,\
    \ the speed and scale of cyberattacks are growing exponentially, resulting in\
    \ alert fatigue among frontline cyber-defenders (Microsoft 2020, 25).\n\nCybersecurity\
    \ Strategy Is Evolving\n\nChief information security officers (CISOs) are responsible\
    \ for developing and managing their cybersecurity strategy. Developing a cybersecurity\
    \ strategy can be daunting when “cyber-adversaries maintain an advantage over\
    \ defenders” (Oltsik 2020, 7). Adding to the challenge is that new technologies\
    \ are in a constant state of development and adoption. This accelerated change\
    \ results in best practices being slow to emerge to offer guidance (Howard 2020,\
    \ 3). The result is CISOs need to be creative when developing their strategy."
