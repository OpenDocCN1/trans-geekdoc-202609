    One can overlay the waterfall project management approach onto the Scrum method
    ([Figure 5.4](#index_split_014.html#filepos189348)) to see that the project work
    is similar in an agile and waterfall approach (e.g., plan, design, and build).
    Sound project management activities work in either approach: adaptive or predictive
    project management. Therefore, project management fundamentals are transferable
    to other project management and managerial approaches.


    Agile project work is guided by the Agile Manifesto ([Figure 5.5](#index_split_014.html#filepos189574)):
    4 values and 12 principles ([`AgileManifesto.org`](http://AgileManifesto.org)
    2001, 1). The Scrum project management delivery method is intended to be coupled
    with the Agile Manifesto; delivering projects with the Scrum method will be challenging
    without the foundation of the Agile Manifesto guiding actions and decisions.


    ![](images/00017.jpg)


    Figure 5.4 Agile project management with the Scrum


    ![](images/00021.jpg)


    Figure 5.5 Agile manifesto


    Agile project management with the Scrum delivery method is perhaps one of the
    most popular adaptive project management approaches to develop, deliver, and sustain
    “complex projects” (Schwaber and Sutherland 2017, 3). A search online will show
    you other adaptive/agile approaches like Kanban, DevOps, and extreme programming.


    While most cybersecurity projects do not need the Scrum agile delivery method
    (e.g., they usually have low ambiguity levels), the Shields Up hybrid project
    management approach works well when leveraged with the Agile Manifesto’s principles
    and values. There are other project management approaches related to agile project
    management that we might add to our hybrid project management tool kit: lean project
    management and Lean Six Sigma.


    ## Lean Project Management


    Lean operations and management are recurring themes in the press and this book;
    we do not want to do more on our projects than necessary. Lean is all about efficiency:
    doing the right things right. We try to reduce waste in our projects and deliver
    value for our stakeholders. We include a continuous improvement cycle to become
    leaner and more effective. Increasingly, many technology projects we implement
    have lean objectives: for example, we automate business processes to reduce steps
    for our customers. We should not be surprised that lean principles have been applied
    to project and information systems management.


    ### Microlearning


    Following are some activities to enhance your professional development journey:


    > • Search for “lean operations” and “lean management” to see what our customers
    are reading and their expectations to become leaner through technology and automation.
    IT holds the solution to becoming lean, and cybersecurity specialists protect
    the lean solution.


    > • Follow a lean operations or management blog to keep abreast of business trends.


    What is lean project management? We use project management methodologies in a
    way where we reduce waste, delight our customers, and look for improvement opportunities.
    Lean project management is sometimes mentioned in agile project management as
    both are somewhat new and compatible techniques. However, lean project management
    is not another project management methodology like agile or waterfall. Lean project
    management combines methodologies to create value for the sponsor by optimizing
    project resources.


    ## Lean Six Sigma


    IT professionals interested in best practices discover Lean Six Sigma as another
    improvement method related to agile project management. Lean Six Sigma combines
    lean management and Six Sigma goals ([Figure 5.6](#index_split_014.html#filepos193635)).
    Lean Six Sigma aims to improve processes by reducing waste and improving quality:


    1. Deliver the maximum value to the sponsor.

    2. Improve processes.

    3. Reduce waste.


    ![](images/00025.jpg)


    Figure 5.6 Lean Six Sigma


    ### Exercise


    > Which of these frameworks listed in [Figure 5.8](#index_split_014.html#filepos197457)
    are used in your organization? Search online for any unfamiliar frameworks.


    ![](images/00028.jpg)


    Figure 5.7 DMAIC cycle


    ## Project Management: Final Thoughts


    Project management helps to plan and deliver successful projects. Multiple project
    delivery approaches range from predictive (traditional) to adaptive (agile). Traditional
    project management is often process based, where we initiate a project, plan,
    design, build, deliver, and closeout the project. The leading project management
    standards and frameworks follow a similar process, with common theory (e.g., scope,
    quality, and risk management). One can use a hybrid project management approach
    ([Figure 5.8](#index_split_014.html#filepos197457)) to combine elements of different
    standards and approaches as projects vary by industry (Skmoski and Brendolan,
    In Press).


    Using a hybrid project management approach, the project manager can become lean
    in planning and delivering cybersecurity projects. The project manager combines
    and tailors the right project management-related standards, frameworks, processes,
    and tools to deliver their cybersecurity projects ([Figure 5.8](#index_split_014.html#filepos197457)).


    ![](images/00031.jpg)


    Figure 5.8 Cybersecurity hybrid project management

