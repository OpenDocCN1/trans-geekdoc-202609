    # 迁移到生产环境


    迁移到生产环境的检查清单的作用类似于质量保证指南，以确保项目尾阶段工作“严密而非松散”。也就是说，对从项目阶段过渡到运营阶段的最终上线活动进行计划、管理和控制，以提高成功实施和采纳的概率。T2P
    清单因项目和组织而异；但必须完成通用任务以确保服务的平稳过渡。在项目早期让部署经理参与，以规划您的发布和部署行动，并创建一个精简的 T2P 清单：


    1.  通知变更授权委员会 (`CAB`) 有新服务正准备上线。敏锐的项目经理会在上线前两到三个月或更早向 `CAB` 会议增加议程事项，以提高项目的可见性。他们还会告知
    `CAB` 他们正在使用 T2P 清单来管理和控制上线活动，以增强对有组织发布的信心。

    2.  测试备份/恢复能力。

    3.  根据实际情况移除供应商权限。

    4.  将新服务添加到信息系统管理系统中。

    5.  为新服务开发并添加 `FAQ` 到服务运营手册中。

    6.  培训支持台。

    7.  培训终端用户。

    8.  执行漏洞评估和修复。

    9.  完成系统加固审查。

    10. 进行信息系统风险审查。

    11. 完成灾难恢复测试。

    12. 制定上线沟通计划，包括应对风险的预备沟通文案（例如，实施失败需要从生产环境中卸载）。

    13. 为关键和优先项目建立上线指挥中心。

    14. 依此类推。


    根据最佳实践，项目经理仅完成将服务发布给终端用户所需的 T2P 行动。服务经过了评估和优化；在项目规划和服务过渡活动中应用了定制。


    ## CAB 审批与流程


    最终的 T2P 行动之一是获得 `CAB` 批准将新服务发布到生产环境。（某些项目不涉及发布到生产环境的系统，例如安全审计，但可能需要报告或演示。）使用变更管理流程至关重要，因为系统配置错误是主要的攻击向量，在发布到生产环境之前，通过系统和正式的审查可以进行更好的管理（Microsoft
    2020, 74）。项目经理根据项目计划和 `CAB` 会议协调发布日期。某些项目受益于项目经理在会议前与 `CAB` 审批成员讨论发布，以便对任何问题提供详细解答。


    当你的发布准备好在 `CAB` 会议上进行讨论时，首先解释你遵循的 T2P 流程（例如检查清单和为 T2P 服务提交工单），以赢得信任，证明你的服务已准备好发布，且利益相关者认可该发布。你的信息是“良好的流程带来良好的结果”。对于更关键和影响更大的项目，可以考虑使用信息图或仪表板（表
    12.1）来解释发布已准备好部署、组织已准备好发布，并且你有监控和控制发布的计划。你努力通过提供 `CAB` 审批者所需的信息来使审批变得简单。


    一旦获得 `CAB` 的允许继续，就可以开始执行你的上线计划了。某些项目受益于演练上线，包括恢复回滚和升级程序。通过检查清单引导上线活动，并以简短的“站会”会议支持，可以提高质量。这些
    T2P 程序有助于实现平稳且可预测的上线。


    ## T2P：最后思考


    我们的目标是将项目产生的产品或服务按照预期结果无缝转移到运营中。我们在规划阶段早期就确定了 T2P 行动以将服务发布到生产环境，包括回滚计划。我们包含了培训和沟通，以确保无缝过渡。我们与
    `CAB` 和发布经理合作，计划并将服务发布到生产环境。


    ### 表 12.1 CAB 上线状态报告


    | 发布元素 | 状态 | 注释 |

    | --- | --- | --- |

    | 网络安全就绪 | 绿色 | 列出已完成的安全措施和就绪状态 |

    | 系统就绪 | 绿色 | 已就绪 |

    | 新服务就绪 | 绿色 | 已就绪 |

    | 运营就绪 | 绿色 | 部分培训尚未完成；但赞助人确认组织已准备绪 |

    | 培训状态 | 黄色 | 11% 的人员尚未完成培训；正在提供额外的培训。95% 的人员将在第 2 周（上线后）完成培训 |

    | 沟通就绪 | 绿色 | 已就绪——包括回滚沟通 |

    | 报告就绪 | 绿色 | 已就绪——已发布升级程序 |

    | 支持就绪 | 绿色 | 已就绪——模拟演练完成 |

    | 风险 | 绿色 | 无高严重风险；受控制中 |

    | 问题 | 绿色 | 无高严重问题；受控制中 |

    | 其他 | — | 无 |


    ## 微学习


    以下是增强你学习的一些实际练习。请在网上搜索：


    *   ITIL 发布管理

    *   ITIL 发布管理模板

    *   ITIL 发布管理实践

    *   发布策略（例如金丝雀发布/暗色发布）

    *   变更授权委员会


    第 13 章


    监控、稳定与结项


    服务或产品已交付到运营，并达到了预期结果，项目团队正转向支持（早期支持）和结项活动。ITIL 服务价值链的最后活动是根据用户的期望和规范交付并支持新事物。团队收集有关发布质量的反馈并保持与终端用户的密切。项目团队接收服务成功的反馈，以指导支持和未来的优化规划。


    监控事件是监控新服务质量的方法。ITIL 在其事件管理实践中提供了指南。项目经理可能会查看每日事件报告（如果有），以理解采用情况和质量。例如，监控关键性能指标
    (`KPIs`)（如解决时间）并与服务水平协议 (`SLAs`) 进行比较。在检查事件时，将其分为技术事件和培训相关事件，以更好地理解实施质量。项目经理通常根据工单/天或工单/周建立结项阶段关口，或者在预定的监控期（例如四周）后结束项目。当项目团队监控和支持新服务时，他们同时进行合同合规等结项活动。一旦达到结项指标，项目即结项。


    结项流程的目的是正式终止项目，将产品或服务移交给赞助人并释放项目资源。某些项目经理使用检查清单来引导结项活动，例如：


    '
