    - Examine a business case for a project your organization has implemented to understand
    the contents of a successful business case.

    - What are system architecture best practices?

    - How to improve system architectures?

    - How to align system architectures?


    ## Project Analysis


    Selecting the best project depends upon the (i) quality of defined requirements,
    (ii) quality of the analysis, and (iii) quality of the understanding of what the
    alternative projects can produce (Daniel, Hempel, and Srinivasan 2001, 39–54).
    The quality of the requirements comes from the project sponsor (more about project
    requirements later). You can tactfully challenge the project sponsor about alternative
    projects: “Help me understand; I am new to this. Can we try this solution instead?”
    You may need to analyze the project, and the `Project Feasibility Gizmo` (Skulmoski
    2008, 1–6) is a project analysis tool you can use to gain a deep understanding
    of the project.


    ## Project Feasibility Gizmo


    The `Project Feasibility Gizmo` is a structured method to analyze a proposed project
    based on the project’s complexity and effort required to deliver the project.
    The `Gizmo` was developed by project management experts (N = 23) in a three-round
    Delphi research project. The project effort attributes represent the degree of
    complexity to deliver the project (e.g., type of work, communications, scope integration,
    and uncertainty and risk of the project environment). The project contextual complexity
    attributes are external to a project and include constraints, uncertainty, and
    risk in the external environment; relative project size; project criticality;
    and the business environment (Skulmoski 2008, 2). One can assess the project by
    its complexity attributes and the anticipated effort to complete the project.
    Using the `Project Feasibility Gizmo`, the project manager can quickly complete
    a comprehensive project assessment that can strengthen the technical analysis
    of your project or a project you have been asked to assess. (See [Appendix 2](#index_split_028.html#filepos386619)
    for the `Project Feasibility Gizmo` and instructions for use.)


    When completing a feasibility assessment with the `Gizmo`, one develops a deeper
    appreciation of the project attributes to help you tailor and manage your project.
    We begin by examining the six project complexity attributes that will impact your
    project and will help you to tailor your project:


    1. **Constraints**: The project manager will likely face some constraints that
    can impact the quality of the product or service you deliver and challenge meeting
    budget and schedule targets.

    2. **Relative project size**: The size of the project will impact how you manage
    your project: larger projects often face more governance and increased formality
    than smaller ones.

    3. **Project criticality**: Projects are prioritized, and the degree of project
    criticality relates to the amount of governance and formality required to manage
    your project. Early career project managers usually are assigned less critical
    projects. Understanding project criticality to your sponsor also contributes to
    improved project alignment.

    4. **Uncertainty and risk (external)**: All projects face uncertainty and risk;
    they impact the project and how the project manager organizes work. Projects that
    are highly uncertain with many risks are more challenging to manage and may require
    a larger team and more formality. Even projects with less uncertainty and fewer
    risks can benefit from a formal risk management approach—the secret to project
    success!

    5. **Organizational environment**: We do not manage projects in a vacuum; the
    culture and governance impact how we manage our projects.

    6. **Business environment**: The projects we manage are impacted by the external
    business environment. For example, working with a global team can add to project
    complexity.


    Understanding the complexity of your project sooner rather than later improves
    the odds of project success. By assessing each attribute with the `Gizmo`, you
    methodically evaluate project complexity. The `Project Feasibility Gizmo` helps
    us appreciate the contextual complexity of project attributes external to the
    project. For example, the same project in Helsinki will likely be managed differently
    in Abu Dhabi or Moose Jaw due to the different external project environments.
    Understanding the external environment early in the project allows us to identify
    risks and issues when they are easiest to manage.


    Next, we assess the effort required to deliver the project. We use the `Gizmo`
    to examine project effort attributes:


    1. **Type of work**: The first project effort attribute is the type of work we
    are doing: building a bridge over a river, conducting a NIST compliance audit,
    or adding new security event management software. Some projects require more and
    different types of effort the project manager needs to understand when planning
    a project. For example, are we implementing only the basic functionality, or is
    the project innovative (e.g., early adoption of technology)? Whatever our first
    projects may be, they will probably be relatively smaller, less complex, and less
    critical to the organization, with a greater degree of latitude to drift from
    approved project targets.

    2. **Communications**: The nature of the communications impacts our project and
    the type of risks and issues we must manage. For example, auditing often involves
    gathering data from others, such as our colleagues in the PMO and Infrastructure
    teams who might not be in the same building as us, while upgrading a backup tool
    will require fewer communications. Therefore, the number of stakeholders and their
    location affects our projects.

    3. **Integration scope**: The number of different project elements that need to
    be integrated affects our project effort; the more elements to integrate (e.g.,
    budget and schedule reports, status reports, external stakeholders, human resource
    management, and contract management), the more significant effort is required
    to complete the project successfully. Integration scope can be a significant source
    of risks and issues discovered using the `Gizmo`.

    4. **Uncertainty and risk (internal)**: The complexity of the effort, the type
    of work, the number of project elements that need to be integrated, and so on
    all bring risks and issues that the project manager manages. Less complex projects
    that require less effort are often the first types of projects assigned to new
    project managers.


    The output of using the `Project Feasibility Gizmo` is the project manager has
    systematically gathered valuable project information with which to plan and to
    prevent risks from becoming issues—the Achilles Heel of technology projects. The
    project manager is encouraged to repeat the exercise with the project sponsor
    and their SME team if there is more than average uncertainty (e.g., a range of
    possible outcomes). You could find that you and the sponsor have very different
    perspectives of the project feasibility attributes resulting in misalignment at
    the beginning of the project; misalignment is not uncommon and working through
    the `Gizmo` brings alignment.


    ### Exercise

    > Assess a project you have under consideration or one where you were a team member.
    Use the `Project Feasibility Assessment Gizmo` included in [Appendix 2](#index_split_028.html#filepos386619).


    A key benefit from using the `Project Feasibility Gizmo` is that you address the
    Ability to Change Paradox directly and early in the project, thereby improving
    your probability of project success.


    ## The Ability to Change Paradox

