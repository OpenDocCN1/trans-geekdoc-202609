    来自 PMI 的《PMBOK® 指南》被广泛认为是事实上的全球项目管理标准。《PMBOK® 指南》第七版包含了《项目管理标准》和《PMBOK 指南》（图 5.2）。第七版与之前的版本有所不同：早版本的《PMBOK®
    指南》指导读者如何通过遵循过程（如计划过程）来实施项目。读者会在项目管理过程中（例如在计划过程中制定进度）使用知识领域（例如：进度、成本和质量）中的信息。《PMBOK®
    指南》（第 1 至第 6 版）的关注重点是战术性的（如何如何计划和交付项目），而《PMBOK® 指南》第七版是战略性的（要管理什么）。


    ## 项目管理原则


    《PMBOK® 指南》第七版强调了项目管理原则。原则适用于所有项目，无论项目的类型和复杂性，以及项目经理和赞助人如何。原则是持久且通用的。《PMBOK® 指南》第七版的原则指导着我们在项目中的行为（PMI
    2021, 42–43）：


    ![](img/00011.jpg)


    图 5.2 PMBOK® 指南的演变


    > 1. 管理者责任：做一个勤勉、尊重且关怀的管理者。

    > 2. 协作团队：建立协作的项目团队环境。

    > 3. 利益相关者：与利益相关者有效互动。

    > 4. 价值：关注价值。

    > 5. 整体性。

    > 11. 适应性与韧性：拥抱适应性和韧性。

    > 12. 变革管理：实现变革以实现预期的未来状态。


    Shields Up 与第六版的过程和知识领域（例如从战术角度考虑质量和风险管理过程）以及第七版的原则（战略重点）保持一致，这些指导着我们在管理项目时的行为。


    > 练习

    > 这些 PMBOK® 指南原则类似于敏捷宣言和 ITIL 4 原则；花一点时间比较这些原则，发现 IT 行业长期以来一直遵循这些原则来指导我们的工作（参见敏捷项目管理，图
    5.4）。思考你如何根据这些原则完成你的工作。这些项目管理原则和其他原则指导了 Shields Up 中混合项目管理方法中的项目交付。哪些原则是你可以优先进一步开发的？


    ### 紧迫感


    另外两个额外的原则指导着成功的项目经理：带着紧迫感工作和工作前置。如果你曾经想过“我真希望我能再多一天时间来……，”，那么这两个其他原则将帮助你准时交付。项目是一天一天变延误的；因此，我们努力在可持续的速度上最大化我们每天完成的工作。我们在成功的项目经理身上看到了这种原则，即行动导向的会议准时开始，且持续时间更短。会议安排在明天而不是下周，以此此类推。业务和技术领导不仅会注意到你的紧迫感，还会注意到你的团队。效法紧迫感，这种原则就会渗透到你团队的项目行为中。


    ### 工作前置


    减少风险和问题的第二个原则是工作前置：即提前开展工作（在合理的情况下），为未来留出空间以利用机会或管理风险和问题。工作前置不是一个新概念，但已被证明是有效的；我父亲过去说：“不要把今天能做的事推迟到明天。”我们可以提前完成低风险任务，例如设置你的模板（例如：项目章程信息图、设计文档、PLO
    周期估算工作表、进度、会议纪要、状态报告、T2P 跟踪器和测试缺陷记录）以及预订会议室（例如：与团队的周会、风险管理会议和状态会议）。大部分工作可以在精力较低的下班后完成（例如：设置你的团队协作站点）。成功的项目经理通常在项目开始时加班；在项目早期工作长时间比在压力巨大的项目末期工作整个整天和周末要容易得多！做好工作前置，你就不可能希望再多一天一天了。工作前置和带着紧迫感工作使你能够在项目生命周期的早期更早地了解更多关于项目的信息。这两个原则是有效的，并且在项目中会被注意到。将紧迫感、工作前置和《PMBOK®
    指南》的原则融入到你的实践中，将提高你的项目成功率并激发信心。


    ## PRINCE2


    通过在线搜索，人们会发现 PMP 认证广受尊重且在全球范围内通用；然而， PRINCE2 项目管理框架也很流行（[PRINCE2.com](http://PRINCE2.com)
    2021, 1）。英国政府于 1989 年首次发布 PRINCE2（控制环境下的项目）以指导公共服务技术项目。PRINCE2 包含了过程、主题和原则（图 5.3）。PRINCE2
    模型是规范性的；读者会被指导在项目中应该做什么、什么时候做以及由谁来完成任务。


    ![](img/00014.jpg)


    图 5.3 PRINCE2 框架


    个人可以通过 AXELOS 组织获得 PRINCE2 认证：PRINCE2 Foundation 级或更全面的 PRINCE2 Practitioner 级。将
    PRINCE2 与 PMBOK® 指南第六版和第七版比较时，有很多相似之处，例如在原则指导下遵循过程。PMBOK® 指南越来越多地包含了敏捷组件，而 PRINCE2
    方法也扩展包含了 PRINCE2 敏捷。Shields Up 与这些基于过程的框架和敏捷原则保持一致。


    ## 敏捷项目管理


    敏捷项目管理对不同的人有不同的含义；业务领域的一些人认为敏捷项目管理是在计划和执行上灵活敏捷。然而，IT 专业人士可能将敏捷项目管理等同于 Scrum 交付方法（图
    5.4）。敏捷项目管理已被广泛研究，其优势和挑战日益被理解（Azanha, Argoud, de Camargo Junior and Antoniolli
    2019, 121–142; Drury, Conboy and Power 2012, 1239–1254; Gemino, Horner Reich,
    and Serrador 2021, 161–175; Serrador and Pinto 2015, 1040–1051）。敏捷项目管理在适当的情况下是有效的。当对于
    (i) 需要交付什么或 (ii) 如何交付产品或服务存在不确定性时，敏捷项目管理是最佳选择。当我们的项目面临高波动性和不确定性时，我们使用敏捷项目管理（PMI
    2021, 101）。


    Scrum 开始于产品所有（项目赞助人）对产品积压列表进行排序，项目团队选择并计划在一个冲刺（例如：通常为两周到一个月）内完成的工作量。在团队计划工作后，项目进入冲刺周期，产品或服务在此进行设计、构建、测试并交付给产品所有。迭代工作和持续改进/学习是敏捷项目管理固有的特征，以适应变化和反馈并交付正确的价值。然后团队回到积压列表开始新的冲刺。


