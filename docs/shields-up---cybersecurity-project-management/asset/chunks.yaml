    有些人认为，项目经理创建最重要的文档之一是项目计划，而你很可能被要求为你的项目创建一个计划。计划通常有两种常见的形式：甘特图和网络图（图 8.3 ）。你可能无法轻松地阅读其中的细节；相反，该图示的目的是展示任务宣言、WBS、甘特图和网络图之间的概念关系。甘特图是根据我们的
    WBS 导出的条形图。甘特图是通常展示给领导层查看的计划类型，因为它清晰地显示了每个阶段、里程碑以及整个项目完成日期的开始和结束日期。


    网络图说明了项目活动的开始和结束、它们的逻辑依赖关系，以及谁负责完成任务。例如，网络图说明了在对服务器进行配置、测试和供应之前必须采购服务器的逻辑。项目团队使用网络图来寻找组织项目最有效的方法。网络图是战术性的，可以在进度计划应用程序中开发。网络图允许进行深入分析，以识别关键路径（通过网络的最长路径）并理解空隙时间（也称为浮动，是指任务在不影响其他依赖任务的情况下可以延迟的时间）。


    项目经理与利益相关者合作制定甘特图和网络图。通常，高层甘特图会呈现在项目计划的正文中，以提供进度安排的概览。同时，详细的网络图包含在项目计划的附录中，并附有指向完整项目计划的链接。为了制定这些计划，项目经理向领域专家（SME）提了那个最令他们头疼的问题：“需要多久？”


    ![](img/00023.jpg)


    图 8.3 计划制定


    ### 三点估算法


    所有的计划都是根据活动持续时间估算开发的；某些估算是自上而下的，即赞助者给项目经理一个目标完成日期。自上而下的估算可能非常激进，且难以实现。另一种估算方法是自下而上的估算；我们使用
    WBS 并估算每个工作包完成所需的时间，将这些时间相加，得出所需的工作量。然后，我们将这些估算应用于网络图，以确定关键路径和空隙时间。


    最常见的估算方法是使用单点估算；例如，25 天、$25,000、8 位顾问和 60 小时。项目经理经常询问 SME 完成应用测试需要多久。SME 被要求给出一个数字，例如三周。然而，如果
    SME 遇到的缺陷比平均水平多，且某些缺陷的解决时间比平均时间长怎么办？如果来自供应商修复缺陷的技术支持延迟了怎么办？如果测试进展非常顺利，缺陷极少，我们比预期更早完成怎么办？测试
    SME 不想给出一个太低或太高的数字，但他们没有方法来传达估算的不确定性。通常，SME 会延迟回复项目经理，因为他们不知道该给出哪个数字。对于复杂、高风险且模糊的项目，从
    SME 团队收集估算可能需要几个月的时间。有一种更好的方法：三点估算（也称为 PLO：即完美、可能和离谱情况这三种不确定性状态）。


    三点估算源于经典的程序评估评审技术（PERT）进度理论。PERT 提供了一种计算完成项目所需时间的方法。PERT 计算捕捉了三种不同情况下的持续时间估算：(i)
    乐观（完成任务的最快时间）、(ii) 悲观（完成任务的最长时间）以及 (iii) 最可能（最大和最小时间之间的时间——发生了一些风险，但你也有运气）。我们使用加权平均公式根据统计数据生成计算估算。


    在 *Shields Up* 中，我们应用了由 Francis Hartman 教授开创的改进 PERT 估算技术，被称为 `PLO` 估算（1999b,
    np）。第一个改进是术语的改变：与其说乐观，我们使用完美；与其说悲观，我们使用离谱。这种方法能更准确地处理不确定性。

    '
