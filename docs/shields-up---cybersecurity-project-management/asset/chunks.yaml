- raw: "Transition to production checklists act like a quality assurance guide to\
    \ ensure that the tail end of the project is “tight, rather than loose.” That\
    \ is, the final go-live activities to transition from a project phase to operations\
    \ are planned, managed, and controlled to improve the probability of a successful\
    \ implementation and adoption. T2P checklists vary by project and organization;\
    \ however, common tasks must be completed to smooth service transition. Involve\
    \ the deployment manager early in the project to plan your release and deployment\
    \ actions and to create a lean T2P checklist:\n\n> 1\\. Inform the change authorization\
    \ board (CAB) that a new service is preparing to go live. Astute project managers\
    \ add an agenda item to the CAB meeting as much as two to three months or more\
    \ prior to going live to raise the visibility of their project. They also inform\
    \ the CAB that they use a T2P checklist to manage and control go-live activities\
    \ to improve confidence in a methodical release. \n\n> 2\\. Test the backup/restore\
    \ capabilities. \n\n> 3\\. Remove vendor access as appropriate. \n\n> 4\\. Add\
    \ the new service to the information systems management system. \n\n> 5\\. Develop\
    \ and add an FAQ for the new service to the service operations manual. \n\n> 6\\\
    . Train the support desk. \n\n> 7\\. Train the end users. \n\n> 8\\. Perform a\
    \ vulnerability assessment and remediation. \n\n> 9\\. Complete a system hardening\
    \ review. \n\n> 10\\. Conduct an information system risk review. \n\n> 11\\. Complete\
    \ a disaster recovery test. \n\n> 12\\. Develop a go-live communications plan\
    \ including prepared communications to address risks (e.g., an unsuccessful implementation\
    \ requiring an uninstall from the production environment). \n\n> 13\\. Set up\
    \ a go-live command center for critical and priority projects. \n\n> 14\\. And\
    \ so on. \n\nIn line with best practices, the project manager completes only the\
    \ T2P actions required to release the service to the end users. The services are\
    \ valued and optimized; tailoring is applied to project planning and service transition\
    \ activities.\n\nOne of the final T2P actions is getting CAB’s approval to release\
    \ the new service into the production environment. (Some projects do not involve\
    \ systems released into the production environment like cybersecurity audits but\
    \ may require a report or presentation.) Using the change management process is\
    \ essential since system misconfigurations are a prominent attack vector and can\
    \ be better managed with a systematic and formal review before being released\
    \ into the production environment (Microsoft 2020, 74). The project manager coordinates\
    \ the release date with the project schedule and a CAB meeting. Some projects\
    \ benefit from the project manager discussing the release with CAB approving members\
    \ before the meeting to provide detailed answers to any questions.\n\nWhen your\
    \ release is ready to be discussed during the CAB meeting, begin by explaining\
    \ the T2P process you followed (e.g., checklist and raising tickets for T2P services)\
    \ to win confidence that your service is ready to be released and that the stakeholders\
    \ endorse the release. Your message is “good process, good result.” For more critical\
    \ and impactful projects, consider using an infographic or a dashboard ([Table\
    \ 12.1](#index_split_022.html#filepos361485)) to explain that the release is ready\
    \ to be deployed, the organization is ready for the release, and you have a plan\
    \ to monitor and control the release. You strive to make approval easy by providing\
    \ information CAB approvers desire.\n\nOnce permission to proceed is provided\
    \ by the CAB, it is time to follow your go-live plan. Some projects benefit from\
    \ practicing their go-live, including restore backout, and escalation procedures.\
    \ Quality is improved with checklists to guide go-live activities supported with\
    \ short “standup” meetings. These T2P procedures contribute to a smooth and predictable\
    \ go live.\n\nT2P: Final Thoughts\n\nOur goal is to seamlessly transfer the product\
    \ or service produced by the project into operations with the intended outcomes.\
    \ We complete the T2P actions identified as early as the planning phase to release\
    \ the service into the production environment, including backout plans. We include\
    \ training and communications to ensure a seamless transition. We work with the\
    \ CAB and the release manager to plan and release the service into the production\
