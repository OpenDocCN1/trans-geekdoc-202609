    我在信息技术学院教授了九年项目管理，非常享受学术生活，并看到学生学习和毕业。然而，我渴望实践我所主张的内容；管理我自己的项目。我在项目启动初期加入阿布扎比克利夫兰医学中心（Cleveland
    Clinic Abu Dhabi）担任项目经理，并交付了 14 个战略性项目，涵盖了从技术类（例如 `IoT/cloud technologies`）到非技术类（例如内部审计）的项目。我在项目管理办公室（PMO）工作，遵循
    `ITIL`、`ISO 27000`、`ISO 9001` 和 `PMBOK® Guide` 等领先标准（关于这些更多信息请参阅第一部分）。我亲身经历了多种标准和框架如何共存，以支持按时、按预算并达到正确的质量水平交付项目。我从领导（包括技术和临床领导）身上学到了，并对同事和团队成员的合作精神表示感谢。`Shields
    Up` 中的工具、流程和技术在阿布扎比克利夫兰医学中心的项目交付中得到了实施和完善。我很荣幸获得了 2017 年中东安全奖首席信息安全官委员会——安全与风险领域
    100 强新星奖，以表彰我在技术项目中管理风险的能力：混合项目管理行之有效。在项目一线工作了七年后，我回到了学术界，加入了澳大利亚的邦德大学（Bond University）的项目管理课程。


    我很享受回到教室，将丰富的项目经验分享给我们的学生。我加入了一个拥有活跃且富有影响的研究人员的强大项目管理课程。我的同事 `Dr. Amir Ghanbaripour`
    审阅了 `Shields Up` 并对项目中的人员因素发表了评论：“在网络安全方面，持盾的人比盾牌（技术）本身重要得多。”我的学生也是影响力的来源：他们毕业、工作，并经常与我联系，分享他们成功应用
    `Shields Up` 中技巧的故事。在此期间，`Dr. Kam Jugdev` 联系我，希望我为 `Business Experts Press`（`BEP`）撰写一本项目管理书籍。我们曾是卡加里大学（University
    of Calgary）的 `PhD` 学生，并曾合作出版过书籍。我教授一门技术项目管理课程，其中包含了 `Shields Up` 中独特的内容。我感谢 `Dr.
    Jugdev` 和 `BEP` 丛书编辑 `Dr. Timothy Kloppenborg` 的指导。`BEP` 出版社和 `Exeter Premedia
    Services` 团队都是专业人士，他们精通并践行精益项目管理，高效地让 `Shields Up` 成真。谢谢。


    # 第一部分


    ## 网络安全需求增长


    ### 第一章


    #### 引言](#index_split_004.html#filepos6414)


    我们生活在一个非凡的时代；技术的进步每天都登上头条，例如：“在未来十年里，我们将经历比过去 100 年总和更多的进步，因为技术正在重塑健康和材料科学、能源、交通以及广泛的其他行业和领域”（Corbo
    and Ostojic 2021, 2）。这些技术承诺也伴随着网络末日论的头条新闻，如“网络攻击时代：美国正挣扎于遏制数字动荡的抬头”（Rushe and
    Borger 2021, 1）。为了享受变革性技术带来的益处，我们需要。项目是“为创造独特的产品、服务或结果而进行的的临时性活动”（PMI 2021, 28）。


    ## 项目与运营


    信息技术（`IT`）部门提供服务。然而，让我们把项目和运营区分开来。在[图 1.1](#index_split_004.html#filepos6276）中，我们看到
    IT 部门识别了一个机会。

