    Once we capture the estimates from all contributing SMEs (`[Figure 8.5a](#index_split_018.html#filepos257628)`),
    we are ready to summarize and analyze the results (`[Figure 8.5b](#index_split_018.html#filepos257628)`).
    When we summarize PLOs by the project team (or WBS work package), we can see which
    teams face the most risk: wide-range estimates (`[Figure 8.5b](#index_split_018.html#filepos257628)`).
    We further arrange the data to illustrate PLOs by team and project phase to understand
    better the effort required for each phase (`[Figure 8.5d](#index_split_018.html#filepos257628)`).
    We display the calculated estimate rather than PLOs since the reader/approver
    is unlikely to be familiar with this technique. However, they welcome single-point
    estimates; the calculated estimates appear like single-point estimates and will
    not take the attention away from your estimates to a discussion about an innovative
    estimating technique (PLO estimating). Therefore, use the calculated duration
    estimates when you develop your schedules.


    The benefits of using PLOs and the risk management process are they shift the
    information curve more than any other technique in the planning phase. Not only
    have we quickly captured duration estimates, but we also understand the risks
    and the opportunities to crash if we begin to fall behind our schedule. Few other
    project tools can deepen our understanding of the project early in the project
    life cycle as PLO estimates with risk management.


    ### Using PLOs (three-point estimates) provides many benefits, as hinted previously:


    1. **Fast estimates**: We saw the challenge single-point estimates give to SMEs
    where single-point estimates do not easily account for uncertainty. PLOs provide
    three conditions of uncertainty which makes it easier to provide high-quality
    estimates. It takes only half an hour to capture estimates from an SME for most
    projects. In one week of face-to-face meetings, the project manager can complete
    the first round of risk-informed estimating. It is common to show the SMEs the
    completed draft to see if anything was missed or if the estimates should be revised.


    2. **Risk-sensitive estimates**: The estimates account for risks and opportunities;
    therefore, the PLO estimates are more realistic than most single-point estimates.
    Even when single-point estimates are used and a 10 percent contingency is added,
    we may still be underestimating. For example, the likely estimate total is 105
    days, while the calculated estimate is 127.2 days (`[Figure 8.4](#index_split_018.html#filepos256349)`).
    If we used the likely and added a contingency (`105 + 10.5 = 115.5`), we would
    still be almost 12 days under the calculated estimate. When you search online
    for “IT project success rate” and look at the percentage of IT projects that finish
    on time, you will find that around half of all IT projects are late; that is,
    the project needed more time than was approved. Perhaps, if the project manager
    followed the three-point estimating method and used calculated estimates in the
    schedule, many of these IT projects would have finished on time using more realistic
    PLO estimates.


    3. **Risks are identified**: It becomes evident where risks exist by looking at
    wide-range estimates (`[Figure 8.4](#index_split_018.html#filepos256349)` and
    `[Figure 8.5b](#index_split_018.html#filepos257628)`). For example, activities
    A, C, and D have wide ranges between the likely and outrageous estimates; if the
    risks are not properly managed, these three activities could take much longer
    to complete than the likely estimate. We have identified three risky activities,
    and the project manager and SME can make plans to prevent and mitigate the associated
    risks. Not only have we quickly captured duration estimates, but we also know
    where key risks exist and how to treat them. Without PLOs, single-point estimates
    might mislead us to where our risks exist. For example, in `[Figure 8.4](#index_split_018.html#filepos256349)`,
    if asked which is the riskiest activity, many people would guess activity D since
    it has the largest duration (30 days). However, activities A and C are risky but
    might not have been identified as risky activities using single-point estimates
    since their duration estimates are relatively low. PLOs help us find and prioritize
    risks.


    4. **Opportunities are identified**: When we use PLOs, we can identify opportunities
    to crash activities should we fall behind and wish to make up time. For example,
    in `[Figure 8.4](#index_split_018.html#filepos256349)`, if we need to crash activities
    to catch up, we will choose activities A and D to crash (e.g., they are on the
    critical path) due to the wide range between the perfect and likely estimates.
    We would not want to prioritize activities B, C, and E to crash since there is
    little time to gain by crashing.


    5. **Improved estimate quality**: Since the estimating technique is methodical
    and estimates include risks and issues, our PLO estimates are better than single-point
    estimates. With PLO estimates, the project manager understands each estimate’s
    risks and opportunities, develops risk and issue management plans, and records
    them in the risk register. The PLO estimating technique helps shift the information
    curve resulting in better quality estimates and improved schedule success.


    6. **Enhanced professionalism**: When you efficiently complete the estimating
    process, have identified risks and opportunities, and have a risk management plan,
    your standing with your peers and leadership will be enhanced. Using the PLO method
    is a career booster since you shift the information curve by understanding risks,
    issues, and opportunities and improving project success with risk management.


    Now that we have duration estimates, we use these calculated estimates to develop
    our schedule. We add the logic of predecessors and successors and assign people
    to each task. Scheduling programs can then provide us with a detailed schedule
    to baseline. The calculated duration estimates are also used to update the Gantt
    chart. Now that scheduling is completed, we develop our budget.


    > Exercise: Set up a spreadsheet template to capture PLO estimates by phase for
    multiple teams for use in future projects.


    ### Project Budget


    Budgeting follows a similar process to schedule; rather than asking “how long
    will it take,” ask “how much will it cost,” and use the PLO estimating technique
    to derive the estimate for our budget. As noted earlier, some projects do not
    require a budget since the resources are internal and no external expenses are
    required (e.g., consultants or new hardware). Suppose your project requires a
    more sophisticated approach (e.g., you need to determine indirect and overhead
    costs). In that case, finance and procurement SMEs can guide you to develop a
    budget in-line with your organization’s budget procedures.


    However, we can follow the WBS to guide our estimates and develop the project
    budget (`[Figure 8.6](#index_split_018.html#filepos266489)`). Our WBS illustrates
    our project scope; therefore, we can develop a “bottom-up” budget with our WBS.
    The top part of a WBS has the budget categories (e.g., Workflow Design), and the
    bottom contains the activities. We estimate the cost of the activities and “roll
    them up” into our budget categories. We show leadership a budget based on the
    categories (high-level) rather than the detailed budget based on budget items.
    We can include the high-level budget in the main body of the project plan and
    a more detailed budget in the project plan’s appendix if the reader requires more
    information (We can use the same approach in the schedule, where we can show leadership
    a Gantt chart based on the top portion of the WBS: Primary Configuration through
    to Implementation. We use the bottom activities as the basis of our network diagram.)


    ![](images/00033.jpg)


    Figure 8.6 Budget development with WBS

