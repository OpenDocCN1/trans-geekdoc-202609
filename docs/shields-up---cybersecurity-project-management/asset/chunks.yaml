    ### 3.3. Impact

    The effect a successful or unsuccessful project will have on the organizations
    and stakeholders involved.


    ### 4. Uncertainty and risk

    Risk is something that leads to a change in outcomes, while uncertainty is the
    range of possible outcomes. Here, we assess the risks and uncertainty of the environment
    external to the project work itself.


    ### 5. Organizational environment

    The setting(s) that the project will be planned and managed.


    #### 5.1. Culture

    The degree the culture (customs, traditions, speech, rituals, dress, manners,
    etc.) of the organization is aligned with the project’s objectives, tools, and
    processes.


    #### 5.2. Governance

    The degree the organization oversees its operations is compatible with how those
    in the project want to plan and manage.


    ### 6. Business environment

    The degree the business environment facilitates project completion.


    #### 6.1. Culture

    The degree the culture (customs, traditions, etc.) external to the organization
    is aligned with the project’s objectives, tools, and processes.


    #### 6.2. Governance

    The degree the way the municipality/city/country is compatible with the way those
    in the project want to plan and manage.


    #### 6.3. Economy

    The degree the economy(ies) facilitate project completion.


    #### 6.4. Language

    The degree that the language used in the business setting is understood by those
    in the project.


    #### 6.5. Political climate

    The degree of stability of the political situation.


    ### Table A2.2 Gizmo effort attributes


    | Effort attributes | Simple | Rating | Complex |

    | :--- | :--- | :--- | :--- |

    | 1. Type of work | Routine, simple, uncomplicated | 1 2 3 4 N/A | Complicated,
    unpredictable, dangerous |

    | 1.1 Technology | Simple, proven, reliable | 1 2 3 4 N/A | Complicated, novel,
    unreliable |

    | 1.2 Required competencies | Low skilled, abundant | 1 2 3 4 N/A | Highly skilled,
    unavailable |

    | 1.3 Attractiveness | Desirable and sought after | 1 2 3 4 N/A | Unpleasant,
    shunned |

    | 1.4 Uniqueness | Routine, typical | 1 2 3 4 N/A | Exceptional, rare |

    | 2. Communications | Easy, effective, enjoyable | 1 2 3 4 N/A | Hostile, difficult,
    complex, confusion |

    | 2.1 Number of stake-holders | Few | 1 2 3 4 N/A | Numerous |

    | 2.2 Geographic dispersion | Close by (same building or city) | 1 2 3 4 N/A |
    Scattered (different countries) |

    | 3. Integration scope | Aligned, simple, cohesive | 1 2 3 4 N/A | Division, confusion,
    vagueness |

    | 3.1 Number of interfaces | Few, simple, regular | 1 2 3 4 N/A | Numerous, complex,
    ad hoc |

    | 3.2 Number of contracts | Few, well known to each other | 1 2 3 4 N/A | Numerous,
    new |

    | 4. Uncertainty and risk | Risks and possible outcomes are identified | 1 2 3
    4 N/A | Copious with wide possible outcomes |


    #### Effort attributes description


    - **1. Type of work**: Related to the product the project will produce (e.g.,
    implement a cybersecurity analytics application vs conducting a cybersecurity
    audit).

    - **1.1 Technology**: The degree the technology is developed, simple to use, and
    proven.

    - **1.2 Required competencies**: The degree the competencies are required is available.

    - **1.3 Attractiveness**: The degree project stakeholders want to be involved
    with the project.

    - **1.4 Uniqueness**: The degree the product and/or project has been done before.

    - **2. Communications**: The ease of which open communications are effectively
    and efficiently planned, executed, and received.

    - **2.1 Number of stakeholders**: The number of people the project team needs
    to communicate with.

    - **2.2 Geographic dispersion**: The degree of geographic dispersion.

    - **3. Integration scope**: The degree of integration scope.

    - **3.1 Number of interfaces**: The number of interfaces.

    - **3.2 Number of contracts**: The number of contracts.

    - **4. Uncertainty and risk**: Risk is something that leads to a change in outcomes,
    while uncertainty is the range of possible outcomes.


