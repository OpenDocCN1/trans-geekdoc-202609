- raw: "> • How to create a Gantt chart? \n\n> • How to create a project network diagram?\
    \ \n\n> • How to create a project budget? \n\n> • How to create a RACI chart?\
    \ \n\n> • How to manage version control? \n\n> • How to sell anything? \n\n> •\
    \ How to tell a great story? \n\n> • How to create a design and layout? \n\nSince\
    \ baselining the project plan involves gaining the trust of your team, you might\
    \ consider any approval process in the project life cycle to be a selling exercise.\
    \ Therefore, “how to sell anything” and “storytelling” are added since they are\
    \ powerful techniques to help you get approval to proceed. Design and layout considerations,\
    \ graphics, and other creative considerations will give your project plan a professional\
    \ look. You are likely to use selling, storytelling, layout, and design skills\
    \ throughout your career.\n\nWhile Shields Up is more strategically focused, we\
    \ include project management tools and methods that are lesser known but effective.\
    \ These tools help us shift the information curve to learn more about your project\
    \ sooner rather than later when changes are challenging to make and expensive.\n\
    \nPriority Triangle\n\nProject alignment is an early goal project managers work\
    \ toward since it helps to shift the information curve for the project team. Misalignment\
    \ increases risks and issues like scope creep, delays, and cost overruns. However,\
    \ when the project team is aligned, the team is more likely to become lean, and\
    \ project success is more likely. We saw that the Project Feasibility Gizmo helps\
    \ shift the information curve; the Gizmo also aligns the project team. The Priority\
    \ Triangle (Skulmoski and Hartman 2000, 33–37) is another project management tool\
    \ contributing to team alignment and risk reduction.\n\nThe Priority Triangle\
    \ ([Figure 8.2](#index_split_018.html#filepos242290)) is adapted from Martin Barnes\
    \ classical iron triangle, also known as the triple constraint theory (Kerzner\
    \ 2013, 869). Project teams are constrained by scope, time, cost, and quality;\
    \ a change in one constraint will affect the others. For example, if our client\
    \ asks to increase the scope, we may face increased costs and schedule overruns\
    \ due to the extra work to deliver the increased scope.\n\n![](images/00019.jpg)\n\
    \nFigure 8.2 Priority triangle and alignment\n\nIn practice, we can use the triple\
    \ constraint theory to help identify the project priority. We begin by drawing\
    \ the Priority Triangle (Skulmoski and Hartman 2000, 35). Time is shown to the\
    \ left of the Priority Triangle since we wish to minimize the duration of our\
    \ project. Cost is at the bottom of the Priority Triangle because we try to minimize\
    \ costs. Finally, quality and scope are to the right since we wish to optimize\
    \ scope and quality. We try to minimize delivery time; therefore, time is to the\
    \ left (earlier rather than later) on the Priority Triangle. We wish to maximize\
    \ value; therefore, quality and scope are to the right on the Priority Triangle.\
    \ However, if we ask the project sponsor to identify the priority, the project\
    \ sponsor will likely choose all constraints as the priority. Therefore, we have\
    \ added a No-Go zone in the middle to force project stakeholders to identify the\
    \ two most essential project priorities.\n\nLet’s look at the Priority Triangle\
    \ in use. Our project is to add collaborative robots to a manufacturing process.\
    \ We have three main stakeholders for our IT automation project: marketing, engineering,\
    \ and finance ([Figure 8.2](#index_split_018.html#filepos242290)). We explain\
    \ the exercise, and marketing places their X in the triangle to indicate that\
    \ delivering on time is the project priority, with quality and scope being the\
    \ second priority. Their rationale is that marketing wants to start selling the\
    \ product the project will produce. They also desire high quality since quality\
    \ products are easier to sell. Engineering has prioritized quality since high-quality\
    \ components are easier to maintain and have less frequent breakdowns. Finance\
    \ prioritizes finishing according to budget, followed by finishing on schedule.\
    \ Finance is responsible for maximizing the use of resources and therefore supports\
    \ finishing according to the approved budget. They also want to finish on time\
    \ to generate revenue once the collaborative robot automation is operational.\n\
    \nYou can see that the three stakeholders are misaligned with different project\
    \ priorities ([Figure 8.2](#index_split_018.html#filepos242290)). We become aligned\
    \ by getting project priority direction from the project sponsor using the Priority\
    \ Triangle. In this case, let us assume that finishing on time with the right\
    \ quality/scope are the sponsor’s two project priorities. The project manager\
    \ has flexibility over the budget to deliver the other two priorities.\n\nIn practice,\
    \ to deliver on time, the project manager may allow his team to work overtime\
    \ to meet project milestones, even though working overtime may increase costs.\
    \ However, to deliver on time, the right scope, and to the right level of quality,\
    \ the project manager has the authority to overspend (within reason). The project\
    \ team will know it is OK to work overtime to meet the schedule. The project manager\
    \ knows the team is working overtime since he follows best practices and is close\
    \ to his team (e.g., PMBOK® Guide principle: engage your stakeholders). The project\
    \ manager will raise a risk if there is a probability they will overspend, and\
    \ an issue if there is overspending. The project manager regularly informs status\
    \ to the sponsor of the project, especially if risks are becoming issues (see\
    \ Risk Management).\n\nThe project manager documents the priority in the project\
    \ plan, including its implications (e.g., the budget may be exceeded). However,\
    \ the project manager will work to meet budget, quality, scope and schedule targets\
    \ with proper risk management. After establishing the project priority, check\
    \ it throughout the project to determine if the priority has changed. Determining\
    \ the project priority helps to shift the information curve and reduce risks and\
    \ issues.\n\nSuccess Criteria: Done–Won–Who\n\nThere are three questions we can\
    \ ask stakeholders to establish and maintain project alignment (Skulmoski and\
    \ Hartman 2000, 34–35):\n\n> 1\\. Done: When is the project finished for you?\
    \ Most projects have staggered finish dates due to the nature of the work delivered.\
    \ For example, our procurement team might be finished our project once servers\
    \ are delivered and tested. However, the project is not finished for cybersecurity\
    \ until the application goes live and cybersecurity functionality is operationalized\
    \ and stabilized. The project manager needs to understand a team with different\
    \ completion dates; otherwise, teams may depart the project sooner than expected.\
    \ \n\n> 2\\. Won: What must be delivered for you to be delighted? Define project\
    \ success and make it measurable and objective. For example, the penetration testing\
    \ team would like two weeks’ notice for their testing services; too often, they\
    \ are asked to participate in last-minute testing that throws them off their schedule.\
    \ \n\n> 3\\. Who: Who gets to vote on the first two questions? We identify the\
    \ key stakeholders: those who can impact our project and those impacted by our\
    \ project. We engage these stakeholders early in the project to reduce changes\
    \ later due to not consulting with a critical project stakeholder. \n\nAgain,\
    \ the three-question tool helps shift the information curve as we better understand\
    \ the project completion dates and success criteria early in our project.\n\n\
    > Exercise \n\n> • For an existing or past project that you worked on, what was\
    \ the project priority? Was there team alignment? Did project priority change\
    \ during the project? \n\n> • For an existing or past project that you worked\
    \ on, complete a Done–Won–Who exercise. Did the project plan reflect the success\
    \ criteria from asking when the project is done? What must be delivered for the\
    \ project to be successful? Who gets to vote on the first two questions? \n\n\
    Project Schedule"
