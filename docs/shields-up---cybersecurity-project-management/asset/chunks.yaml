    8.2）。缺乏 RACI 表的项目的角色混乱和遗漏人员的风险。项目经理为项目参与者分配角色以改进沟通：


    -   **执行者 (Responsible)**：完成任务的人。虽然可以分配多个人完成任务，但过多的 R 会导致拥堵并延迟活动（例如，“厨多容易生汤”）。

    -   **负责人 (Accountable)**：负责授权和监督任务完成的人员（任务所有者），但可能不直接执行工作。每个任务和里程碑应只有一名负责人。负责人通常批准由执行者
    SME 完成的工作。

    -   **咨询者 (Consulted)**：可能提供专家建议的人（双向沟通）。项目经理试图平衡需要咨询的人，因为过多的 C 会延迟项目。

    -   **知情者 (Informed)**：需要了解活动进展但未直接参与工作的人；他们获得的是高层信息而非详细的项目信息（单向沟通）。


    项目经理将分析 RACI 表，以确保没有空单元，且没有 SME 工作负担过重（过多的 R）。项目经理将与团队讨论分配的角色以获得他们的认可。一旦 RACI
    表完成高层制定，计划即告完成。


