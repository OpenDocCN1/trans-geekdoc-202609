    The PMBOK® Guide from the PMI is widely regarded as the de facto global project
    management standard. The PMBOK® Guide 7th Edition contains the Standard for Project
    Management and a PMBOK® Guide ([Figure 5.2](#index_split_014.html#filepos179842)).
    The 7th Edition is a departure from previous versions: the earlier versions of
    the PMBOK® Guide directed the reader on how to implement a project by following
    processes like the planning process. The reader would use information in the knowledge
    areas (e.g., schedule, cost, and quality) during a project management process
    (e.g., develop a schedule during the planning process). The focus of the PMBOK®
    Guide (editions 1–6) was tactical (how to plan and deliver projects), while the
    PMBOK® Guide 7th Edition is strategic (what to manage).


    ## Project Management Principles


    Project management principles are emphasized in the 7th Edition of the PMBOK®
    Guide. Principles are intended to be applied to all projects, regardless of the
    type and complexity of the project, project manager, and sponsor. Principles are
    enduring and universal. The PMBOK® Guide 7th Edition principles guide our behavior
    in projects (PMI 2021, 42–43):


    ![](images/00011.jpg)


    Figure 5.2 PMBOK^® Guide Evolution


    > 1. Stewardship: Be a diligent, respectful, and caring steward.

    > 2. Collaborative team: Build a collaborative project team environment.

    > 3. Stakeholders: Effectively engage with stakeholders.

    > 4. Value: Focus on value.

    > 5. Holistics.

    > 11. Adaptability and resilience: Embrace adaptability and resiliency.

    > 12. Change management: Enable change to achieve the envisioned future state.


    Shields Up is aligned with the processes and knowledge areas of the 6th Edition
    (e.g., quality and risk management processes from a tactical perspective) and
    the principles of the 7th Edition (strategic focus) that guide our behavior when
    we manage projects.


    > Exercise

    > These PMBOK® Guide principles are like the Agile Manifesto and ITIL 4 principles;
    take a moment to compare these principles to see that the IT profession has long
    been following these principles to guide our work (see agile project management,
    [Figure 5.4](#index_split_014.html#filepos189348)). Think about how you complete
    your work according to these principles. These project management principles and
    others guide project delivery in the hybrid project management approach in Shields
    Up. Which principles can you prioritize for further development?


    ### Sense of Urgency


    Two additional principles guide successful project managers: work with a sense
    of urgency and front-end load work. If you have ever thought, “I wish I had one
    more day to ….,,” then these two other principles will help you deliver on time.
    Projects become late one day at a time; therefore, we try to maximize at a sustainable
    pace what we accomplish daily. We see this principle in successful project managers
    where action-oriented meetings start on time, with shorter durations. Meetings
    are scheduled for tomorrow rather than next week, and so on. Business and technical
    leaders notice not only your sense of urgency but also your team. Model a sense
    of urgency, and this principle will permeate your team’s project behavior.


    ### Front-End Loading


    The second principle that reduces risks and issues is to front-end load: bringing
    forward work (where it makes sense) to create space in the future to leverage
    opportunities or manage risks and issues. Front-end loading is not a new concept
    but one that is proven to work; my father used to say: “Don’t put off until tomorrow
    what you can do today.” We can pull forward low-risk tasks such as setting up
    your templates (e.g., project charter infographic, design document, PLO duration
    estimates workbook, schedule, meeting minutes, status reports, T2P tracker, and
    testing defects register) and booking your meeting rooms (e.g., weekly meeting
    with the team, risk management meetings, and status meetings). Much of this work
    can be done after hours when your energy is low (e.g., setting up your team collaboration
    site). Successful project managers often work overtime at the start of the project;
    working long hours early in the project is much easier than working long days
    and weekends at the end of the project when stress is high! Front-end load and
    you are less likely to wish for one more day. Front-end loading and working with
    a sense of urgency allows you to learn more about your project sooner in the project
    life cycle. These two principles are effective and are noticed on projects. Incorporating
    a sense of urgency, front-end loading, and the PMBOK® Guide’s principles into
    your practice will improve your project success rate and inspire confidence.


    ## PRINCE2


    With a search online, one discovers that the PMP certification is widely respected
    and globally portable; however, the PRINCE2 project management framework is also
    popular ([PRINCE2.com](http://PRINCE2.com) 2021, 1). The UK government first released
    PRINCE2 (PRojects IN Controlled Environments) to guide public service technology
    projects in 1989. PRINCE2 includes processes, themes, and principles ([Figure
    5.3](#index_split_014.html#filepos185853)). The PRINCE2 model is prescriptive;
    the reader is guided about what should be done on the project, when it should
    be done, and who should complete the task.


    ![](images/00014.jpg)


    Figure 5.3 PRINCE2 framework


    Individuals can get certified in PRINCE2 through the AXELOS organization: PRINCE2
    Foundation or the more extensive PRINCE2 Practitioner. When comparing PRINCE2
    with the PMBOK® Guide v6 and v7, there are many similarities, such as following
    processes while guided by principles. The PMBOK® Guides have increasingly included
    agile components, while the PRINCE2 method expanded to include PRINCE2 Agile.
    Shields Up is aligned with these process-based frameworks and agile principles.


    ## Agile Project Management


    Agile project management means different things to different people; some in the
    business see agile project management as being flexible and nimble in our plans
    and execution. However, the IT professional may equate agile project management
    with the Scrum delivery method ([Figure 5.4](#index_split_014.html#filepos189348)).
    Agile project management has been widely studied, and its benefits and challenges
    are increasingly understood (Azanha, Argoud, de Camargo Junior, and Antoniolli
    2019, 121–142; Drury, Conboy, and Power 2012, 1239–1254; Gemino, Horner Reich,
    and Serrador 2021, 161–175; Serrador and Pinto 2015, 1040–1051). Agile project
    management can be effective under the right circumstances. Agile project management
    is best used when there is ambiguity in (i) what needs to be delivered or (ii)
    how to deliver the product or service. We use agile project management when our
    project faces high volatility and uncertainty (PMI 2021, 101).


    A Scrum begins when a product owner (project sponsor) prioritizes work in the
    product backlog, and the project team selects and plans the amount of work they
    can complete during one sprint (e.g., typically two weeks to one month). After
    the team plans the work, the project moves to the sprint cycle, where the product
    or service is designed, built, tested, and delivered to the product owner. Iterative
    work and continuous improvement/learning are inherent in agile project management
    to adapt to changes and feedback to deliver the right amount of value. The team
    then returns to the prioritized backlog to begin a new sprint.

    '
