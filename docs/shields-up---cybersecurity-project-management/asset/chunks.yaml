    > • What can you expect from your industry and cybersecurity regulation investigation
    in the next two to five years? Understanding what may be coming to your industry
    may help you proactively prepare for new cybersecurity regulations.


    > • Search for “how to conduct a cybersecurity audit.” Consider asking your manager
    to lead an audit project.


    > • Look for cybersecurity audit tools and checklists.


    ## Cybersecurity Maturity Advancement


    Cybersecurity maturity models allow an organization to assess its current capabilities
    and position them at different levels. By developing a cybersecurity capability
    baseline, organizations can identify gaps and targets to reach. Currently, many
    cybersecurity maturity models ([Table 3.1](#index_split_012.html#filepos87855))
    have been compared and analyzed (Payette, Anegbe, Caceres, and Muegge 2015, 1–9;
    Rea-Guamán, San Feliu, Calvo-Manzano, and Sanchez-Garcia 2017, 1–15; Garba, Siraj,
    and Othman 2020, 1–8).


    Numerous cybersecurity maturity models exist, such as the NIST (see [Chapter 4](#index_split_013.html#filepos101331))
    and the Cybersecurity Capability Maturity Model (C2M2). The C2M2 can be used by
    any organization of any size or type to evaluate its cybersecurity position and
    make improvements (U.S. Department of Energy 2021, 12). The C2M2 model has 5 objectives,
    10 domains, and 3 maturity levels that an organization can use to assess its cybersecurity
    maturity ([Figure 3.1](#index_split_012.html#filepos85936)).


    One can conduct an audit to assess the organization’s maturity level for each
    of the 10 domains. Analyzing the audit results, leadership can prioritize and
    establish maturity improvement targets for prioritized domains. Achieving these
    improvement goals can trigger new cybersecurity projects.


    ![](images/00006.jpg)


    Figure 3.1 C2M2 structure


    ## Organizational Cybersecurity Certification


    Some organizations may be required to become certified within a cybersecurity
    maturity model given the increasing and persistent cybersecurity threats and accompanying
    regulation efforts. For example, over 300,000 contractors and subcontractors work
    with the U.S. Department of Defense; most contractors require level 3 CMMC certification
    for contract eligibility (Horan 2020, 1; Fox 2021, 2). Those contractors who work
    with the U.S. Department of Energy will also need to certify against the C2M2
    soon (Schwartz 2019, 1). To sell to the U.S. federal government, some technology
    manufacturers must be NIST compliant (Allied Telesis 2021, 1). Therefore, expect
    organizations to comply with frameworks and subsequent auditing increasingly;
    both sources of cybersecurity projects are coming our way!


    ## Cybersecurity Skill Shortage


    The very nature of work is changing due to a “reskilling revolution” where the
    shelf life of people’s skills is reduced, requiring regular upskilling (Skulmoski,
    Langston, Patching, and Ghanbaripour 2020, 3). Organizations report challenges
    finding competent people (World Economic Forum 2020, 11). The digital disruption
    leads to digital skills gaps generally and for project managers to implement digital
    projects.


    Table 3.1 Cybersecurity models


    | Model | Focus |

    | :--- | :--- |

    | National Institute of Standards and Technology Cybersecurity Framework (`NIST
    CSF`) | The `NIST CSF` was released in 2014 with five functions and five “tiers”
    |

    | `C2M2` | First published in 1996 by the U.S. Department of Energy with five
    maturity levels |

    | `ES-CM2` | The `ES-CM2` focused on energy with 10 domains and five levels |

    | `ONG-CM2` | The `ONG-CM2` was designed specifically for oil and gas with five
    maturity levels |

    | `CCSMM` | The `CCSMM` was released in 2006 with three domains |

    | `NICE`-Capability Maturity Model | The `NICE`-Capability Maturity Model was
    established in 2008 |

    | `FFIEC-CMM` | The `FFIEC-CMM` has five maturity levels |

    | `AUMMCS` | The `AUMMCS` was introduced in 2014 with three domains |

    | `SSE-CMM` | The `SSE-CMM` published in 2014 has 10 domains |

    | `CSIRT` | The `CSIRT` model has three tiers and four categories |

    | `CMMC` | The `CMMC` has 5 levels, 43 capabilities, and 171 practices |

    | `CERT-RMM` | The `CERT-RMM` guides organizations to assess business continuity,
    security and IT |


    Finding qualified cybersecurity professionals is one of the most challenging of
    all technical professions (Morgan 2019, 4–6). “Simply put, it is more difficult
    to hire security professionals today than it was even three or four years ago”
    (Scholtz 2021, 13); indeed, the cybersecurity profession has been characterized
    as in a deepening “crisis” (Oltsik 2020, 5). The unemployment rate for cybersecurity
    professionals is zero percent and has been so since 2011 (Morgan 2019, 6). The
    high demand for cybersecurity professionals has attracted unqualified applicants
    where less than one in four were qualified (Morgan 2019, 2).


    Compounding the problem of the cybersecurity skills gap is that the cybersecurity
    role is changing to align with changing technologies and stakeholder expectations
    (Scholtz 2021, 14).


    One strategy to mitigate the cybersecurity skills shortage is to delegate some
    cybersecurity functions to the business, corporate, and other IT teams (Scholtz
    2021, 15). An emerging corporate value is everyone has a role in cybersecurity
    since the technology ecosystem is hyperconnected and complex (Morgan 2019, 2).

