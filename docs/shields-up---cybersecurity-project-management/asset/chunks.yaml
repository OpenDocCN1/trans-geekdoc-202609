- raw: "In Shields Up: Cybersecurity Project Management, Greg artfully and scientifically\
    \ cuts a path through the thicket of the contemporary project landscape, offering\
    \ full-featured roadmaps to guide all those who might struggle with modern project\
    \ management. But his treatment is more wide-ranging than just these areas. His\
    \ framing and analyses of the current problems in business partner expectations,\
