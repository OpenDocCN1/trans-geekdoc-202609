    ## 关于作者


    Gregory J. Skulmoski (BEd, MBA, PhD, CITP, FBCS) 是一位经验项目经理，曾在澳大利亚、中东和加拿大领导过非技术项目，拥有约
    10 亿的经验。他是认证信息技术专家和英国学会终身会士。他在项目管理方面拥有博士学位，研究方向为转型和优化所需的能力。在读博期间，他获得了项目管理协会 (PMI)
    颁发的荣誉 Robert J Zak 奖。Gregory 是 PMI 2000 版《项目管理知识体系指南》(PMBOK) 修改小组的核心成员。他还 PMI
    的工作分解结构实践、组织项目成熟模型以及项目经理能力开发等其他标准做出了贡献。Skulmoski 目前在邦德大学的社会与设计学院教授项目管理。Gregory
    的教学重点是成功实施技术的实用流程和工具。他利用混合项目管理工具获得了 2017 年中东首席信息安全官奖（项目风险管理）。他喜欢打鼓、潜水，并喜欢与家人朋友一起待在户外。


