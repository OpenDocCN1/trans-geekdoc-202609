    We can expect the emergence of IoT to grow and accelerate as equipment vendors
    stay connected to their devices in the field to predict maintenance requirements
    using AI (Dahlqvist, Patel, Rajko, and Shulman 2019, 3). The technological advances
    in sensor technologies and the adoption of smart cities are also driving IoT adoption
    (Dahlqvist et al. 2019, 3). We may see nano IoT sensors attached to the human
    body, ingested, or integrated with organs to allow human body monitoring and augmentation
    (Skilton and Hovsepian 2018, 30). Innovations like ingested IoT sensors are examples
    of the rapidly growing IoT technology segment. Indeed, we may see as many as 50
    billion IoT devices by 2022, and such “rapid proliferation has made these products
    appealing targets for a growing number of cyberattacks” (Microsoft 2020, 30).
    Again, there are more opportunities for cybersecurity services delivered through
    projects.


    Unfortunately, bad actors will increasingly use AI and associated technologies
    in their cyberattacks. For example, the malicious use of AI will become more sophisticated
    and pervasive, where automating attacks can see increases to attack speed and
    scale (Creese et al. 2020, 28). Adversarial machine learning (actions to attack
    machine learning) is predicted to grow (Microsoft 2020, 35). The attackers will
    be able to extract more value from stolen data and will be able to deliver more
    damage from their attacks (Creese et al. 2020, 12). Offensive AI will find new
    ways of attacking its targets. AI defenses will also see an increase in adoption
    by organizations and individuals. AI defense capabilities will see an improving
    defense posture, dynamic threat detection, proactive defense, increased speed
    in response and recovery, and improvements to attack determination (Creese et
    al. 2020, 29). AI will help us detect threats in languages we do not understand
    and find and understand malicious patterns that no human would ever consider (CyberEdge
    Group, LLC 2020, 34). “We might even go out on a limb and say that machine learning
    and other AI technologies offer our last chance to catch up with and overtake
    the bad guys” (CyberEdge Group, LLC 2020, 35). More cybersecurity projects are
    predicted.


    # CHAPTER 2


    ## Customer’s Expectations Driving IT Departments


    We see emerging trends that impact the nature of projects and are driven by our
    customers (internal and external), resulting in an expansion of IT services delivered
    through projects; these services require cybersecurity. Organizations invest in
    digital transformation projects for quick wins, high feasibility/high-value potential
    projects, and “moonshot” projects with a high return on investment but low feasibility
    (Obwegeser, Yokoi, Wade, and Voskes 2020, 8). Business is increasingly partnering
    with IT to implement projects that will transform their business. What do our
    customers expect from IT?


    ### Quest for More Agility


    Customers desire flexibility and speed to respond to new opportunities; they desire
    agility. They need scalable systems (Barquin, Dreischmeier, Hertli, Königsfeld,
    and Roth 2020, 2) and support for business changes. We see more opportunities
    to leverage through technology (e.g., IoT) to deliver value (Corbo and Ostojic
    2021).


    ### Pursue Innovation


    Today, we hear “disrupt or be disrupted” as a call for innovation; some recommend
    a proactive defense mindset (PMI 2020). Early adopters of digital transformation
    will most likely reap benefits (Corbo and Ostojic 2021). Some of the most common
    digital transformation projects include digitizing the user-experience, scaling,
    and enhancing (Dhasarathy, Gill, and Khan 2020). We see that “companies need to
    build innovation” (Williams, Galvin, and LaBerge 2021).


    ### Optimize Lean Operations


    The quest toward lean operations is a business strategy to do more with less.
    Achieving lean operations positions the organization to be more competitive. Lean
    Six Sigma is a problem-solving technique to identify opportunities, often followed
    by a process-improvement project. Many process-improvement projects have technology,
    integration, and automation at their core. However, we see that risk management
    has not kept pace with the proliferation of digital and analytics transformations
    due to rapid implementation pace (Boehm and al. 2021). The desire to become leaner
    through technology can require more cybersecurity efforts.


    ## What Is Microlearning?


    Traditional training involves attending a course for several days. After a few
    months, the learning decays unless it is refreshed. With microlearning, learners
    continuously acquire new knowledge that can be applied to real work. The duration
    for microlearning is often only a few minutes each day to read an article at their
    time of choosing (Bleich 2021). Microlearning can be more effective when the learner
    follows a learning to list (Bersin and Zao-Sanders 2019).


    ### Microlearning


    The following topics can improve your understanding and application of lean management
    principles and methods:


    * Think about lean-oriented projects in your organization; what are the project
    sponsor’s goals? Reduce time through the process? Automate manual steps? Reduce
    costs? Understanding the high-level request will help to understand detailed requirements.

    * Learn about Lean Six Sigma as a process-improvement technique.

