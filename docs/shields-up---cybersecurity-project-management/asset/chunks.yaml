    When an information systems life-cycle approach is followed, the results are more
    predictable because the stakeholders understand the steps in the process and can
    plan accordingly. We are encouraged to build cybersecurity into the `SDLC`, including
    threat modeling, design reviews, and static and dynamic testing in environment.
    The top cybersecurity frameworks (and ISO quality management) imply a traditional
    or predictive project management approach. Therefore, this book emphasizes the
    traditional project management delivery approach to help the reader deliver routine
    cybersecurity projects.


    ## Project Management Frameworks


    There are two categories of project management frameworks: competency frameworks
    for individuals and maturity models for organizations. Like cybersecurity capability
    models, there are project management capability models like `PMI`’s `Project Management
    Maturity Model` (`ProMMM`). Since cybersecurity professionals are less likely
    to lead project management projects, `ProMMMs` are out of scope for this book.
    Instead, we look at project management frameworks (e.g., The Guide to the Project
    Management Body of Knowledge (`PMBOK Guide`) and `PRINCE2`) aimed at individuals
    to guide them in project management.


    Multiple project management frameworks can be explained on a continuum of predictive
    to adaptive delivery (Figure 5.1). We can use a predictive project management
    delivery approach to plan our project using schedules, budgets, and other tools
    to forecast task completion, phase by phase. This traditional approach is sometimes
    known as waterfall project management since it is sequential and linear; a new
    phase does not start until the previous phase finishes. Most professional organizations
    (e.g., the `PMI` and the `International Project Management Association`) support
    predictive approaches to project management.


    However, with the increasing popularity of agile project management, project management
    associations have embraced adaptive project management approaches like the `Scrum`
    method in their standards. Agile delivery approaches are appropriate when there
    is (i) ambiguity about the product or service to be delivered by the project team
    or (ii) ambiguity about how to deliver the product or service. Complex and ambiguous
    projects can benefit from an adaptive delivery approach; however, such approaches
    are out of scope for this book since (i) most cybersecurity projects have low
    ambiguity (e.g., install new software or conduct an audit), and (ii) the top cybersecurity
    frameworks imply a traditional or predictive project management approach. However,
    the hybrid project management approach in `Shields Up` accommodates adaptive project
    work when sufficient ambiguity or complexity is encountered (e.g., design challenges).


