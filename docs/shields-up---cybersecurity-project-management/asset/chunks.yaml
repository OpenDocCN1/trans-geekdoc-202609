    随着设备供应商持续保持与现场设备的连接，利用 AI 预测维护需求，我们可以预见 IoT 的增长将进一步加速（Dahlqvist, Patel, Rajko,
    and Shulman 2019, 3）。传感器技术的进步以及智慧城市的建设也推动了 IoT 的采用（Dahlqvist et al. 2019, 3）。我们可能会看到纳米
    IoT 传感器附在人体上、摄入体内或与器官整合，以实现人体的监测和增强（Skilton and Hovsepian 2018, 30）。像摄入式 IoT 传感器这样的创新是快速增长的
    IoT 技术细分领域的例子。事实上，到 2022 年，IoT 设备可能多达 500 亿个，这种“快速扩散使这些产品成为日益增加的网络攻击的青睐目标”（Microsoft
    2020, 30）。同样，通过项目交付网络安全服务将有更多机会。


    遗憾的是，坏分子将越来越多地在他们的网络攻击中使用 AI 及其相关技术。例如，AI 的恶意利用将变得更加复杂和无不在，自动化攻击可以增加攻击的速度和规模（Creese
    et al. 2020, 28）。对抗性机器学习（攻击机器学习的行动）预计将增长（Microsoft 2020, 35）。攻击者将能够从被盗数据中提取更多价值，并从其攻击造成更大的损害（Creese
    et al. 2020, 12）。进攻性 AI 将找到攻击其目标的新方法。组织和个人也将增加对 AI 防的使用。AI 防御能力将看到防御态的改进、动态威胁检测、主动防御、响应和恢复速度的提高以及对攻击判定的改进（Creese
    et al. 2020, 29）。AI 将帮助我们检测我们无法理解的语言威胁，并发现并理解人类永远不会考虑的恶意模式（CyberEdge Group, LLC
    2020, 34）。“我们甚至可以断言，机器学习和其他 AI 技术为我们追赶并超越坏人提供了最后机会”（CyberEdge Group, LLC 2020,
    35）。预计会有更多的网络安全项目。


    # 第 2 章


    ## 客户需求驱动 IT 部门


    我们看到影响项目性质的兴起趋势，这些趋势由我们的客户（内部和外部）驱动，导致通过项目交付的 IT 服务不断扩张；这些服务需要网络安全。组织投资于数字化转型项目是为了获得快速胜利、高可行性/高价值潜力项目，以及具有高投资回报但可行性较低的“登月”项目（Obwegeser,
    Yokoi, Wade, and Voskes 2020, 8）。业务部门日益与 IT 合作，实施将转型其业务的项目。我们的客户对 IT 有何期望？


    ### 追求更高的敏捷性


    客户渴望应对新机会的灵活性和速度；他们渴望敏捷。他们需要可扩展的系统（Barquin, Dreischmeier, Hertli, Königsfeld,
    and Roth 2020, 2）以及对业务变化的支持。我们看到更多通过技术（例如 IoT）来交付价值的机会（Corbo and Ostojic 2021）。


    ### 追求创新


    今天，我们听到“不颠覆就会被颠覆”作为创新的号召；一些人建议采取主动防御心态（PMI 2020）。数字化转型的早期采用者最可能获益（Corbo and Ostojic
    2021）。一些最常见的数字化转型项目包括用户体验的数字化、规模化和增强（Dhasarathy, Gill, and Khan 2020）。我们看到“公司需要构建创新”（Williams,
    Galvin, and LaBerge 2021）。


    ### 优化精益运营


    对精益运营的追求是一种以少胜多的业务策略。实现精益运营使组织更具竞争力。精益六格玛是一种识别机会的问题解决技术，通常伴随着流程改进项目。许多流程改进项目以技术、集成和自动化为核心。然而，我们看到由于实施速度快，风险管理并未跟上数字化和分析转型的扩散（Boehm
    and al. 2021）。通过技术变得更精的愿望可能更多的网络安全投入。


    ## 什么是微学习？


    传统的培训涉及参加几天的课程。几个月后，除非进行刷新，否则学习就会衰减。在微学习中，学习者不断获取可以应用于实际工作的新知识。微学习的持续时间通常每天几分钟，在他们选择的时间阅读一篇文章（Bleich
    2021）。当学习者遵循学习列表时，微学习会更有效（Bersin and Zao-Sanders 2019）。


    ### 微学习


    以下主题可以提高你对精益管理原则和方法的理解与应用：


    *   思考你组织中以精益为导向的项目；项目赞助人的目标是什么？通过流程缩短时间？自动化手动步骤？降低成本？理解高层请求有助于理解详细需求。

    *   学习精益六格玛作为一种流程改进技术。


    '
