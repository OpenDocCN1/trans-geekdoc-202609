    项目经理开启了一个问题（`I-22`），即服务器将延迟四个月到达，导致构建阶段延迟（参见表 A3.2）。采购领域专家（SME）已与供应商进行了沟通，非常有把握服务器将在
    2020 年 8 月 14 日或之前到达。项目团队已审查了进度表，并将提前开展设计、测试和 `T2P` 文档等工作，以最大限度地减少延迟带来的影响。


    ### 表 A3.2 问题注册表


    | 标题 | 描述 | 示例 |

    | --- | --- | --- |

    | 问题 ID | 每个问题都有唯一的 ID | I-22 |

    | 录入日期 | 问题录入注册表的日期 | 2020 年 3 月 16 日 |

    | 录入人 | 录入人员 | Debbie Hart, 项目经理 |

    | 项目 | 项目名称 | 大数据湖 |

    | 阶段 | 项目阶段 | 计划 |

    | 问题原因 | 问题的根本原因 | 由于制造延迟 |

    | 问题事件 | 影响项目的问题 | 服务器延迟 4 个月到达 |

    | 问题影响 | 问题事件导致的后果 | 导致构建阶段延迟 |

    | 影响 | 对项目的影响：高、中、低 | 高 |

    | 问题解决 | 解决措施 | 无 |

    | 解决人员 | 负责解决问题的人 | Barry Blanchard |

    | 解决日期 | 必须解决问题的日期 | 2020 年 8 月 14 日 |

    | 问题状态 | 问题受控程度 | 红色：问题无法及时解决 |

    | 注释 | 关于解决和关闭问题的信息 | 服务器比制造目标落后了 6 个月，但供应商承诺于 2020 年 8 月 14 日交付，导致项目延迟 4 个月（2020
    年 4 月 2 日） |


    附录 4


    职业规划


    质量改进是我们框架的核心，也是持续成功的不可或缺的组成部分。通过整体方法更有可能实现质量改进：在整个服务管理系统中寻找改进机会，以优化面向用户的价值流（Limited,
    AXELOS 2019, 83–86）。当采取整体方法时，参与价值创造的人员也可以从评估和发展其能力中获益。网络安全专业人士可以通过职业规划采取结构化的方法来提升其能力。


    在网络安全岗位上变得“精通”需要三到五年的（Oltsik 2020, 6）。网络安全专业人士可能会开发和维护与其角色直接相关的领域的技术能力。在建立技术熟能力的同时，网络安全专业人士可以开始整体规划并发展其能力。网络安全专业人士可以通过职业规划采取结构化的方法来提升其能力。


    ### 可持续的项目导向型职业


    我们发现职业的可持续性取决于两个因素：人脉网络和技能提升（Skulmoski et al. 2020, 76）。与其他专业人士建立联系有助于发现新机会。保持联系可以开启机会。技能提升或扩展能力是另一个可持续性驱动力。


    技术和网络安全技能缺口问题已得到充分研究，因为它是一个长期且可能是棘手的问题。网络安全专业人士很幸运，有很多途径可以保持胜任，例如在 `Azure` 等技术平台或在
    `CISSP` 等网络安全框架中追求技术认证。


    ### 规划 T 型职业


    如果我们观察 IT 同事们的职业晋升路径，就可以预见随时间变化的职业发展。人们将技能发展为技能集，这些技能集可以被描述为跨跨度和能力光谱的形状（图 A4.1，参考
    Demirkan and Spohrer 2015, 13）。《Shields Up》一书中对 T 型专业人士的 Basic 描绘进行了修改，其中 T 型的水平部分代表业务技能，垂直部分代表技术技能。新的大学网络安全毕业生拥有加入
    IT 部门所需的技术基础，并以 I 型技能集加入。


    '
