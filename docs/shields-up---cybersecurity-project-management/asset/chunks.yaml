    When examining the frameworks and standards that guide IT, cybersecurity, and
    project management activities, one notes they are process-based. They begin with
    a need or opportunity, and then work is completed, resulting in something of value
    ([Figure 6.3](#index_split_016.html#filepos210849); refer to the original figures
    for the details. Your eyes are fine!). They address a need by converting inputs
    into outputs by following processes to deliver value to the end user. Project
    management is the delivery method to provide value in these frameworks and standards.
    Therefore, your journey to improve your project management capabilities will help
    you succeed in these other frameworks.


    ![](images/00004.jpg)


    Figure 6.3 Hybrid project management alignment


    These frameworks and standards begin with the organization identifying a need
    or opportunity delivered through a project. A process(es) is followed, and value
    is delivered. Therefore, by following the hybrid project management approach,
    you align to best practices and processes represented in these international standards
    and frameworks.


    ## Hybrid Project Management Principles


    The hybrid project management principles are intended to guide actions and decisions
    in most projects, most of the time, including cybersecurity projects (throughout
    the spectrum of technical to nontechnical projects). These principles help shape
    project culture and align the team. In project management and technology operations,
    we interact regularly with new team members both internally and externally. Each
    new interaction offers the opportunity to bring them into our culture and operational
    frameworks as we meet needs and opportunities to deliver value to the users of
    our services. Therefore, as project managers, we can be role models of the principles
    we value when collaborating with others in projects.


    Principles are found in many frameworks such as the `PMBOK® Guide`, `ITIL`, `PRINCE2`,
    and the `Agile Manifesto`. These principles are widely applicable and are found
    in hybrid project management detailed in Shields Up. The five hybrid project management
    principles include the following:


    > 1. Value orientation: The reason we work is to deliver value! In cyber-security
    projects, we may improve our ability to protect or respond, which our organization
    values. We take a holistic approach to deliver value and prefer to deliver value
    early and frequently. We are agile and welcome managed change.


    > 2. Collaboration: To deliver value, we regularly collaborate with others to
    meet expectations and deliver requirements. Our collaborations build trust through
    open communication, leading to high-performing teams.


    > 3. Risk focus: The key reason we fail to deliver the expected value or meet
    requirements is that risks occur. Therefore, much of our time is related to managing
    risks to achieve our plans. When we collaborate with others, we discuss risks
    either formally or informally, and all decisions are informed to understand risks.


    > 4. Quality disposition: Quality management can support risk management. For
    example, we design-in quality assurance and control into our work to improve the
    probability of success along the system value chain. We take opportunities to
    reflect, learn, and optimize ourselves, processes, and technology, reducing future
    risks.


    > 5. Engaged leadership: Leaders act with a sense of urgency and look for opportunities
    to front-end load. They are customer and value focused. Engaged leaders value
    inclusiveness and are project management ambassadors.


    These hybrid project management principles apply to project managers, sponsors,
    stakeholders, and both internal and external team members in the value streams.


    Hybrid project management allows the team to combine methods and frameworks to
    tailor their delivery approach to the environment, organization, and project.
    Tailoring and combining allow a flexible, proactive, and value-focused approach
    to delivering products and services to the end users. Shields Up project management
    follows a traditional waterfall delivery approach with iterations (agile) to leverage
    opportunities or solve problems encountered during the design and testing phases
    ([Figure 6.2](#index_split_016.html#filepos202976)). Therefore, we begin our projects
    in the initiation phase when a project is proposed to address an opportunity or
    need.


    ## CHAPTER 7](#index_split_004.html#filepos7310)


    ### Initiate Phase](#index_split_004.html#filepos7310)


    The hybrid project management project includes an initiation phase ([Figure 6.2](#index_split_016.html#filepos202976)).
    Leadership will determine whether the service or product produced by the project
    (e.g., implementing a new application into the technological ecosystem) is needed.
    Some projects may include a business plan that justifies the project and outlines
    its benefits to the organization. Your organization may have a change authorization
    board that reviews and approves proposed projects. As the project’s importance,
    complexity, and cost increases, so should formality and process rigor. Some organizations
    use a project initiation document (`PID`) that includes the following:


    > 1. Project scope: a brief description of the work the project will deliver;


    > 2. Rationale: an overview of the business case that triggered the project;


    > 3. Stakeholders: a brief description of (i) the project team, (ii) those who
    can impact the project (e.g., sponsor, regulatory bodies, and leadership), and
    (iii) those who are impacted by the project (e.g., end-users);


    > 4. Risks and issues: list the most severe risks and issues;


    > 5. Project reporting and controls: include how you will control your project
    and report progress;


    > 6. Approval signatures: include the signatures of those who approved project
    initiation.


    You can check with your project management office (`PMO`) or leadership for project
    initiation guidance and content if you are responsible for initiating a project.
    The `PID` can be energized by making it a one-page infographic. Documenting and
    illustrating project information on one page becomes a powerful communications
    tool to use and reuse on your project to orient new stakeholders. Reusing project
    artifacts contributes to leanness. Supporting the `PID` is a technical analysis
    to assure that the organization approves the right project. A professional quality
    `PID` is often the first project document a new stakeholder sees and is an early
    opportunity to demonstrate your professionalism.


    ## Technology Analysis


    You might be called upon to assess the proposed technology in a project from a
    cybersecurity or technical perspective. Perhaps, our business partners have conducted
    a Lean Six Sigma study, and the process improvement solution is to reduce steps
    in their process with AI-leveraged automation. When examining a project proposal,
    assess whether the technology makes sense from a cybersecurity perspective; for
    example, a business proposal leveraging technology might not be feasible if the
    cost of securing the new service exceeds the return on investment (Creese et al.
    2020, 44). You may discuss the project with your systems architect to ensure that
    the proposed project “fits" with the system architecture. Suppose the project
    proposal is a cybersecurity project. In that case, leadership will be interested
    in how the cybersecurity project will contribute to organizational resilience
    and growth goals while reducing risk (Scholtz 2021, 4). Many resources guide your
    technology analysis; instead, we focus on analyzing the technology project from
    a project management perspective in Shields Up.


    > Exercise


    > • Develop a well-designed `PID` template that can be used for subsequent projects.
    Templates are a way to improve quality and become leaner (see Quality Management).


    > • Collect for future use project management templates your organization uses
    to gain a quick start on your project.

    '
  trans: '


    在审查指导 IT、网络安全和项目管理活动的框架和标准时，可以注意到它们是基于流程的。它们始于需求或机会，然后完成工作，从而产生价值（图 6.3；详情请参见原始图。你的眼睛没问题！）。它们通过遵循流程将输入转换为输出，为最终用户交付价值来解决需求。项目管理是这些框架和标准中提供价值的交付方法。因此，提升项目管理能力的历程将帮助你在其他框架中取得成功。


    ![](img/00004.jpg)


    图 6.3 混合项目管理对齐


    这些框架和标准始于组织识别通过项目交付的需求或机会。遵循某个流程（若干流程）并交付价值。因此，通过遵循混合项目管理方法，你对齐了这些国际标准和框架中代表的最佳实践和流程。


    ## 混合项目管理原则


    混合项目管理原则旨在指导大多数项目在大多数时间里的行动和决策，包括网络安全项目（涵盖从技术到非技术项目的整个范围）。这些原则有助于塑造项目文化并对齐团队。在项目管理和技术运营中，我们经常与内部和外部的新团队成员互动。每一次新的互动都为将他们引入我们的文化和运营框架提供了机会，同时我们满足了为服务用户交付价值的需求和机会。因此，作为项目经理，我们在与其他他人合作时，可以成为我们所重视原则的榜样。


    原则存在于许多框架中，如 `PMBOK® Guide`、`ITIL`、`PRINCE2` 和《敏捷宣言》。这些原则具有广泛的性，并出现在《Shields Up》中详述的混合项目管理中。五个混合项目管理原则包括以下内容：


    > 1. 价值导向：我们工作的初是为了交付价值！在网络安全项目中，我们可能会提高保护或响应的能力，这是我们组织重视的。我们采取整体方法交付价值，并倾向于早期且频繁地交付。我们是敏捷的，并欢迎管理的变化。


    > 2. 协作：为了交付价值，我们经常与其他协作以满足预期并交付需求。我们的协作通过开放沟通建立信任，从而形成高效团队。


    > 3. 风险关注：我们未能交付预期价值或满足需求的关键原因是发生了风险。因此，我们大部分的时间与管理风险以实现我们的计划有关。当我们与他人协作时，我们会正式或非正式地讨论风险，并且所有决策都基于对风险的了解。


    > 4. 质量倾向：质量管理可以支持风险管理。例如，我们在工作中设计并了质量保证和控制，以提高整个系统价值链的成功概率。我们利用机会进行反思、学习并优化自身、流程和技术，减少未来的风险。


    > 5. 投入型领导力：领导者的行动具有紧迫感，并寻找前置加载任务的机会。他们以客户和价值为中心。投入型领导者重视包容性，并是项目管理的大使。


    这些混合项目管理原则适用于项目经理、赞助人、利益相关者以及价值流中的内部和外部团队成员。


    混合项目管理允许团队结合各种方法和框架，以根据环境、组织和项目定制他们的交付方法。剪裁和组合允许以一种灵活、主动且以价值为中心的方法，向最终用户交付产品和服务。《Shields
    Up》项目管理遵循了传统的瀑布式交付方法，并带有迭代（敏捷），以利用设计和测试阶段遇到的机会或解决问题（图 6.2）。因此，我们在启动阶段开始项目，即当提议项目以应对某个机会或需求时。


    ## 第七章


    ### 启动阶段


    混合项目管理项目包含启动阶段（图 6.2）。领导层将决定项目产生的服务或产品（例如在技术生态系统中实施应用程序）是否必要。某些项目可能包含业务计划来证明项目的合理性并概述其收益。随着项目重要性和复杂性的增加，正式程度和流程严谨性也应之增加。一些组织使用项目启动文档（`PID`），包含以下内容：


    > 1. 项目范围：项目将交付工作的简要描述；


    > 2. 依据：触发项目的业务案例概述；


    > 3. 利益相关者：对 (i) 项目团队、(ii) 可以影响项目的人（例如赞助人、监管机构和领导）以及 (iii) 受项目影响的人（例如最终用户）的简要描述；


    > 4. 风险与问题：列出严重的风险和问题；


    > 5. 项目报告与控制：包括你如何控制项目并报告进度；


    > 6. 批准签名：包含批准启动项目的签名。


    如果你负责启动项目，可以向项目管理办公室（`PMO`）或领导层获取项目启动指南和内容。`PID` 可以通过制作单页信息图来注入活力。在单页上记录和说明项目信息成为一种强大的沟通工具，供项目中使用和重复，以引导新的利益相关者。重复使用项目资产有助于精益。支持
    `PID` 的技术分析是为了确保组织批准正确的项目。高质量的 `PID` 通常是新利益相关者看到的第一个项目文档，也是展示专业能力的早期。


    ## 技术分析


    你可能被要求从网络安全或技术角度评估项目中建议的技术。也许我们的业务合作伙伴进行了精益六格玛研究，流程改进方案是利用 AI 自动化来减少其流程步骤。在审查项目建议时，从网络安全角度评估该技术是否合理；例如，如果保护新服务的成本超过了投资回报率，那么利用技术的业务提案可能是不可行的（Creese
    et al. 2020, 44）。你可能与系统架构师讨论项目，以确保建议的项目“符合”系统架构。假设项目建议是一个网络安全项目。在这种情况下，领导层将该网络安全项目如何有助于组织的韧性和增长目标（Scholtz
    2021, 4）。许多资源可以指导你的技术分析；相反，我们关注在《Shields Up》中从项目管理的角度分析技术项目。


    > 练习


    > • 开发一个良好的 `PID` 模板供后续项目使用。模板是提高质量和变得精益的方法（参见质量管理）。


    > • 收集组织使用的项目管理模板以供未来使用，以便快速启动项目。


    '
