  trans: '

    由于人工智能、云、传感器、物联网设备以及技术驱动创新的前景等多种因素的推动，技术的采用正在以加速度进行。技术的普及意味着对网络安全服务的需求增加。监管的加强意味着对网络安全服务的需求增加。在网络安全专业人员和项目经理短缺的环境，需求的增加意味着网络安全项目的增加。因此，`Shields
    Up: 网络安全项目管理》的目的是提供一种经过验证的方法，用于规划、管理和交付与全球领先标准和最佳实践一致的网络安全项目。


    ## 第二部分：混合项目管理


    混合项目管理方法基于传统的项目管理方法（预测型），并在必要时进行迭代。混合项目管理汲取了《敏捷宣言》、《PMBOK® 指南》以及其他标准和框架的原则。项目经理可以根据组织、项目和任务的需求，定制适合的原则、流程、工具和方法。定制化可以提供一种精益的项目管理交付方法，使团队能够专注于产品和服务的生产。


    大多数网络安全项目可以通过传统的项目管理方法（启动、计划、设计、构建、测试、实施、监控/稳定和收尾）以及传统的项目管理流程（例如质量管理和风险管理）来交付。混合项目管理利用了调度、预算和变更管理等传统项目管理方法。`Shields
    Up` 包含了创新技术，例如使用“完美-可能-荒谬”（`PLO`，见“项目进度”）估算法结合 `Project Management Gizmo` 评估你的网络安全项目，以对项目建立深度理解。每个网络安全项目阶段都经过了调整，描述了一种精益的项目管理方法，并概述了流程、工具和考虑因素。


    遗憾的是，项目失败在技术和网络安全项目中异常常见。项目规划和风险管理可以提高项目成功的概率。`Shields Up` 概述了一个精益计划流程，以交付可以进入审批流程的项目计划。如果风险管理执行不当，即使是最好的项目计划也会失败。因此，质量管理和风险管理是混合项目管理的核心。风险管理不需要复杂的图表和统计分析；直观的定性风险管理方法通常是成功管理网络安全项目的基础。


    `Shields Up` 录中包含了补充材料，以进一步你的学习。`Project Management Gizmo` 工具有助于评估你的网络安全项目，经“国际项目管理协会”许可于
    2008 年在罗马展示。任何项目都可以使用 `Gizmo` 进行评估，以对项目建立全面的理解并开始规划阶段。当项目经理、项目赞助人和团队共同使用 `Gizmo`
    时，会形成对项目的共同理解，成功的概率也会随之提高。


    第二个附录引导读者完成一次与年度绩效评估同步的职业规划迭代。我们在最佳实践的指导下，不断不断改进系统，还改进我们的人力资源。我们也面临网络安全人才的短缺。因此，鼓励网络安全专业人士进行职业规划。`Shields
    Up` 引导读者通过职业规划步骤来实现职业目标并建立可持续的职业生涯。


    最后，贯穿全书的是大量的补充性练习和进一步的指导。`Shields Up` 提供了一种规划、管理和交付网络安全项目的方法。这些工具和实践可以立即应用到你的项目中，练习题将引导你应用
    `Shields Up`。书中概述的许多概念可以通过随处获取的在线材料进行补充，以扩展你对项目管理原则的理解。`Shields Up` 在每一章中提供了微学习机会，帮助读者提高自己的项目管理能力和成功率。


    ## 学习成果


    本书旨在为那些于深化项目管理理解的人士提供一条技能提升路径。本书有三个学习成果：


    1. 将混合项目管理应用于日益增长的、需要正式项目管理的网络安全项目。

    2. 实施与 `NIST` 和 `ITIL` 等全球框架一致的网络安全项目管理。

    3. 获取并使用混合项目管理技能。


    通过阅读本书并利用它来规划和实施网络安全项目，学习者将更好地理解网络安全管理背景下的项目管理，最终交付成功的网络安全项目。虽然 `Shields Up` 专注于网络安全项目，但混合项目管理方法、流程和工具可以适用于大多数技术和创新项目，如自动化、集成和机器人项目。


    ## 致谢


    我曾在财务部门处理数据，有一天，我的老板要求我作为年度预算周期的一部分购买 12 台 386 CPU 计算机：这是我的第一个 IT 项目。后来，我参加了一个新财务系统的选小组。我们实施了一个定制系统，但结果既延期又超支。我想学习更多业务知识以更好地管理项目，因此完成了传统的
    MBA。尽管掌握了这些关于劳动法、投资回报率计算和营销四支柱的新颖业务知识，我的项目依然进展不顺。我寻找答案并发现了项目管理这一专业领域。


    我在卡尔加大学参加了项目管理课程，学习了如何规划和实施项目。我有许多老师教了我关于项目管理的工具、流程和要点。感谢 `Francis Hartman` 教授、`George
    Jergeas` 教授、`Janice Thomas` 教授以及 Hanley 先生。他们都拥有丰富的项目经验，并帮助我建立了自己的项目管理方法。


    '
