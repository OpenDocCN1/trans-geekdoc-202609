    # UAT and Design Management


    During UAT, the end user sees the system perform for the first time and may request
    design changes, even though the design has been approved. Should the end user
    request significant changes that may challenge the completion schedule or otherwise,
    the project manager may raise a risk that testing may be late. Sometimes the requested
    design changes can be deferred to a postproject optimization phase and not delay
    your project. Requests for significant changes are often traced back to the design
    phase and the quality of the end user involvement. Therefore, the project manager
    is prudent to ensure that end users are fully engaged in design workshops and
    design document review. Should the end user not be fully engaged in the design
    phase, then the project manager may raise a risk during the design phase that
    the test phase may take longer to complete due to requests for changes to the
    approved design.


    To complete the design phase, some project managers review the design document
    with the approving end user during a two-hour meeting and reduce the risk of not
    understanding the design. In Shields Up, we focus on preventing risks rather than
    resolving issues (e.g., quality assurance efforts are emphasized). Once the end
    users complete UAT testing and give their approval, the requirements traceability
    matrix is updated, and the approvals are recorded in meeting minutes or in an
    email. The project manager then completes the test report; the last stage gate
    to leave the test phase.


    ## Test Report


    The test report contains the testing results and is prepared by the project manager
    ([Table 11.2](#index_split_021.html#filepos347235)). The purpose of the test report
    is to document test results as outlined in the test strategy and test plan to
    determine whether sufficient quality exists and if the product or service is ready
    for release. It is prudent to refer to the test strategy and plan when writing
    the test report to ensure completeness.


    A search online will bring many examples of test reports and templates that can
    guide the project manager and team to tailor their test report to their project
    and audience. The test report is developed and sent to the project stakeholders
    for approval. Once approved, the test phase is completed, and the transition to
    production phase begins.


    Finally, before proceeding to the transition to production phase (`T2P`), some
    cybersecurity projects do not lend themselves to technical testing such as an
    audit or training project; however, there is still a role for quality assurance
    and quality control. For example, one can use peer reviews to find defects in
    a cybersecurity audit; a colleague can review the audit results to find any defects.
    After a cybersecurity training course is developed, it is best practice to pilot
    test the training to determine if the learning outcomes are met (e.g., complete
    a quality control check).


    ### Table 11.2 Test report contents


    | Contents | Comments |

    | :--- | :--- |

    | Main body | |

    | Test report overview | State the purpose of testing and overall results (e.g.,
    the testing was successful), the first content the reader looks for in a test
    report. You may add the UAT was successful, the end users verified the system’s
    quality, and is ready for release |

    | Test results | List the testing metrics and highlight key points or anomalies
    of interest | |

    | Defects | List defects encountered and resolved and any outstanding defects.
    Refer the reader to the Appendix—Outstanding Actions—for the defect resolution
    plan |

    | Conclusion | Restate the overall results and emphasize that testing is complete
    |

    | Appendixes | |

    | Application overview | Provide a brief overview of the software application
    should the reader be unfamiliar with its functionality. Identify integration points,
    cloud storage, security, etc. |

    | Test environment, data, and tools overview | Provide an overview and assessment
    of the test environment, data, and tools used to test the application |

    | Testing scope | Identify in-scope and out-of-scope testing. Address any testing
    that was not executed and the rationale. The complete requirements traceability
    matrix may show the testing scope and the types of tests performed |

    | Outstanding actions | List any outstanding actions required to complete testing
    or fix defects. Some raise a service ticket for each action with a future completion
    date to coincide with resource availability or patch release to fix a defect |

    | Lessons learned | Identify lessons learned regarding test environment, test
    data, tools, testing process, etc. |


    ## Test Phase: Final Thoughts


    Along with planning, the testing phase is critical to project success. As the
    criticality and importance of the project increases, so does testing comprehensiveness
    and formality. Testing is a quality control exercise; if the requirements definition
    was correctly executed (quality assurance), then there should be few defects in
    the testing phase. The test plan and strategy guide testing, and the test report
    documents results and next steps. These documents can form a set of templates
    for future testing. We first test the system to find and fix defects, and then
    we invite the end users to participate in UAT. They verify that the requirements
    have been met and that the service is ready for operations. If there is any incomplete
    testing or outstanding actions, we note them and perhaps raise tickets for future
    action.


    ## Microlearning


    Testing technology has seen advances in testing the process and technologies.
    Search online and discover:


    * How does ITIL service validation and testing work?

    * How does technology defect management work?

    * How do you track testing defects?

    * What is the best testing software?

    * How does automated testing work?

    * Download test strategy, test plan, and test report templates for future use.


    ## CHAPTER 12](#index_split_004.html#filepos064)


    ### Transition to Production](#index_split_004.html#filepos7864)


    The transition to production phase (`T2P`) includes those activities to hand over
    the product or service produced through the project delivery approach to operations
    team. ITIL’s Release Management (`Limited, AXELOS 2019, 125–127`) guides a broad
    range of activities such as:


    1. Delivering the service with a waterfall or agile delivery method.

    2. Ensuring that the new release can be tracked, verified, uninstalled, and backed
    out of the production environment if necessary.

    3. Certifying deviations, risks, and issues can be managed and controlled.

    4. Completing knowledge and skills transfer to operations.


    Add cybersecurity activities to this list to bring the service or product into
    the production environment, such as adding the new product or service to the Security
    Information and Event Management (`SIEM`) system, conducting penetration testing,
    and revoking the vendor’s passwords.


    Transition to production planning can begin in the planning phase and is finished
    in the `T2P` phase. For example, cybersecurity should be designed into the product
    or service to meet cybersecurity requirements and have a smooth going-live path
    (`ISO 2018a, 7`). Critical to ITIL release and deployment, management success
    is the seamless transition between projects and operations for new services (`Limited,
    AXELOS 2019, 143–145`). Therefore, we develop formal plans to safely release the
    service to our end users to improve the probability of success and align with
    “do-it-once” thinking.


    Successful project managers create and reuse T2P checklists to guide the final
    project actions to take the product or service live.


    '
