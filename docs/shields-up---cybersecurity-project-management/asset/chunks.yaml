  trans: '


    一旦我们获取了所有参与的领域专家（SME）的估计值（图 8.5a），我们就可以对结果进行汇总和分析了（图 8.5b）。当我们按项目团队（或 WBS 工作包）汇总
    PLO 时，我们可以看到哪些团队面临的风险最大：宽范围估计（图 8.5b）。我们显示的是计算出的估计值而非 PLO，因为读者/审批者可能并不熟悉这项技术。然而，他们很欢迎单点估计；计算出的估计值看起来像单点估计，不会将注意力从你的估计值转移到对某种创新估算技术（PLO
    估算）的讨论上。因此，在制定进度时，请使用计算出的持续估计。


    使用 PLO 和风险管理过程的好处在于，它们在规划阶段比任何其他技术都能移动信息曲线。我们不仅快速获取了持续估计值，还了解了当我们开始落后于进度时的风险和压缩（crash）机会。很少其他项目工具能像
    PLO 估计结合风险管理那样，在项目生命周期早期深化对项目的理解。


    ### 使用 PLO（三点估计法）具有许多益处，正如前文提到的：


    1. **快速估算**：我们看到了单点估计给 SME 带来的挑战，因为单点估计无法容易考虑到不确定性。PLO 提供了三个不确定性条件，使得更容易提供高质量的估计。对于大多数项目，从
    SME 那里获取估计仅需半小时。在一周的面对面会议中，项目经理就可以完成第一轮基于风险的估算。向 SME 显示完成的草稿以查看是否遗漏了内容或估计值是否需要修改是常见做法。


    2. **风险敏感型估计**：估计值考虑了风险和机会；因此，PLO 估计比大多数单点估计更现实。即使使用单点估计并增加 10% 的备用金，我们可能仍然低估了。例如，可能估计总额为
    105 天，而计算出的估计值为 127.2 天（图 8.4）。如果我们使用可能值并加上备用金（`105 + 10.5 = 115.5`），我们仍然比计算估计值少约
    12 天。当你在线搜索“IT 项目成功率”并查看准时完成的 IT 项目比例时，你会发现大约一半的 IT 项目是过期的；也就是说，项目比批准的时间更多。也许，如果项目经理遵循三点估计法并在进度中使用计算估计值，这些许多
    IT 项目将使用更现实的 PLO 估计准时完成。


    3. **识别风险**：通过观察宽范围估计，可以明显看出风险在哪里（图 8.4 和 图 8.5b）。例如，活动 A、C 和 D 在可能估计和极悲估计之间之间范围很宽；如果不妥善管理风险，这三个活动的完成时间可能会比可能估计长得多。我们已经识别了三个高风险活动，项目经理和
    SME 可以制定计划来防止和缓解相关风险。我们不仅快速获取了持续估计值，还知道关键风险在哪里以及如何处理它们。如果没有 PLO，单点估计可能会误导我们判断风险所在的位置。例如，在
    `图 8.4` 中，如果被问及哪个活动风险最大，许多人会猜是活动 D，因为它的时长最长（30 天）。然而，活动 A 和 C 是有风险的，但由于它们的持续估计值较低，使用单点估计时可能不会被识别为风险活动。PLO
    帮助我们发现并优先考虑风险。


    4. **识别机会**：当我们使用 PLO 时，如果进度落后并希望赶回时间，就可以识别出压缩活动的机会。例如，在 `图 8.4` 中，如果我们需要压缩活动来追赶进度，我们将选择压缩活动
    A 和 D（例如，它们在关键路径上），因为完美估计和可能估计之间的范围很大。我们不会优先考虑压缩活动 B、C 和 E，因为通过压缩获得的时间很小。


    5. **提高估计质量**：由于估算技术是有条理的，且估计包含了风险和问题，我们的 PLO 估计比单点估计更好。通过 PLO 估计，项目经理理解每个估计值的风险和机会，制定风险和问题管理计划，并将其记录在风险登记中。PLO
    估算技术有助于移动信息曲线，从而获得更好的估计质量并提高进度的成功率。


    6. **增强专业性**：当你高效地完成估算过程、识别了风险和机会并有一份风险管理计划时，你在同事和领导层中的地位将增强。使用 PLO 方法是一种职业助推，因为通过理解风险、问题和机会并通过风险管理提高项目成功率，你移动了信息曲线。


    现在我们有了持续估计，使用这些计算出的估计值来制定进度。我们添加前置和后置逻辑，并为每个任务分配人员。进度计划软件随后可以提供详细详细的基准进度。计算出的持续估计值也用于更新甘特图。进度完成后，我们制定预算。


    > 练习：建立一个电子表格模板，按阶段获取多个团队的 PLO 估计，供未来项目使用。


    ### 项目预算


    预算编制的过程与进度制定类似；与其问“需要多久”，不如问“成本多少”，并使用 PLO 估算技术推导出预算估计。正如之前提到的，某些项目不需要预算，因为资源是内部的，不需要外部支出（例如顾问或新硬件）。假设你的项目需要更复杂的方法（例如，你需要确定间接成本和管理费用）。在这种情况下，财务和采购
    SME 可以指导你制定符合组织预算程序的预算。


    然而，我们可以遵循 WBS 来指导我们的估计并制定项目预算（图 8.6）。我们的 WBS 阐明了项目范围；因此，我们可以利用 WBS 开发一个“自下而上”的预算。WBS
    的顶部是预算类别（例如，工作流设计），底部包含活动。我们估计活动的成本并将其“向上汇总”到我们的预算类别中。我们向领导层展示基于类别（高层）的预算，而不是基于预算项目的详细预算。我们可以将高层预算包含在项目计划正文中，如果读者需要更多信息，则在项目计划附录中包含更详细的预算（在进度计划中也可以采用相同的方法，向领导层展示基于
    WBS 顶部分的甘特图：从初始配置到实施）。我们使用底部活动作为网络图的基础。）


    ![](img/00033.jpg)


    图 8.6 使用 WBS 开发预算


    '
