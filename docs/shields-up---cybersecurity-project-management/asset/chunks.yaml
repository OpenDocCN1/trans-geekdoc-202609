    当首席信息安全官（CISO）正在应对即时网络威胁时，一些人开始考虑坏法者获取并利用量子计算能力来辅助其攻击，从而产生不对称优势（Creese et al.
    2020, 44）。另一些人认为，技术的进步“将使许多当前的防御”（Creese et al. 2020, 44）。我们看到一种趋势：人类在网络攻击（攻击者和防御者）中的参与度正在减少；也就是说，机器学习算法和深度神经网络正被创建用于攻击漏洞，而防御者则依赖这些技术来阻止攻击，因为人类的“交互速度不够快”（Creese
    et al. 2020, 30）。因此，我们看到一些 CISO 正在从 100% 的保护转向通过具有固有风险的新技术来支持创新，以保持竞争力（Scholtz
    2021, 11）；也就是说，他们正在减少消除 100% 漏洞的努力，并提高他们的威胁检测和响应能力（Scholtz, 2021）。我们可能会看到更多通过
    AI 和机器学习自动化的端点安全解决方案，用于检测和阻止恶意的端点行为（CyberEdge Group, LLC 2020, 26），以及网络安全网架构的出现（Groombridge
    2021, 3）。


    ## 交付预期更加严格


    网络安全预算正在增加以支持网络安全战略，并预期通过与网络安全相关的指标和业务成功指标改进治理，以确保我们的网络安全投资是高效且高价值的（Scholtz 2021,
    9）。事实上，存在一种风险量化的趋势，以优先考虑并针对网络安全投资。我们的 CISO 向董事会承诺按时按预算交付项目，并有效高效管理变更，通过项目管道带来创新（Hale
    2017, 364; Scholtz 2021, 9）。有效高效的项目管理是 CISO 履行承诺的关键。


    ## 业务伙伴机会的出现


    为了实现项目成功，我们被鼓励更加业务化，通过支持业务结果而不仅仅是保护数字资产（Scholtz 2021, 4）。我们需要像对待我们自己的目标一样认同业务目标。也就是说，我们需要超越技术；随着组织网络安全管理的日益成熟，网络安全越来越多地被整体视为不仅是一个技术问题，而且是一个业务问题（Hale
    2017, 361–362）。为了在网络安全角色中真正发挥作用，我们被鼓励超越技术关注，像 CISO 一样思考，以改进我们的决策（Scholtz 2021,
    9）；也就是说，我们需要“从内到外了解业务”（Dhasarathy et al. 2020, 3）。因此，《Shields Up》包含了以业务为导向的练习、微学习和职业规划，以帮助读者培养出一套平衡的能力。


    ## 网络安全预算增加


    通常，我们将看到 IT 预算继续增长，因为组织正投入更多资源到提供颠覆性、创新和转型的项目中（Moyer 2021, 3）。仅仅实施技术是不够的；这些技术需要被管理和安全保护。因此，我们预测网络安全预算将继续增加（Claus
    2017, 10; CyberEdge Group, LLC 2020, 20）。事实上，网络安全支出似乎是一场永无结束的网络军备竞赛（CyberEdge
    Group, LLC 2020, 9）。由此得出结论，考虑到网络安全预算，网络安全意识对组织重要性也增加了。


    预算增加的一个挑战是网络安全服务的需求超过了能力，导致创新项目面临危险（Oltsik 2020, 42）。虽然网络安全预算在增加，但 CISO 被要求事半力大（Scholtz
    2021, 14）；似乎对于某些组织来说，对安全服务的的需求可能会超过已批准的预算。CISO 要求通过 `KPIs` 和平衡计分卡展示其在网络安全上投入资金的价值，侧重于网络安全服务和项目的高效、有效交付。因此，增加的网络安全支出增加了额外的网络安全资源（如果你能找到它们的话）以及许多通常通过项目交付的新型倡议：更多的网络安全支出、更多的网络安全项目，以及对交付和衡量价值的更多关注。


    ## 网络安全监管扩张


    出于许多原因，我们可以预计更多的网络安全监管（Creese et al. 2020, 37），例如网络攻击数量的增加以及网络攻击可能造成的损害严重程度。例如，`AustCyber`
    (2020, 1) 估计，澳大利亚经济遭受为期四周的中断会导致 300 亿美元的损失和 16.3 万人失业。（注：原文此处存在大量重复的段落，已进行合并处理）。我们预计会有更多的技术、网络攻击和监管。遗憾的是，网络安全监管可能是复杂、碎片化且冲突的，增加了合规难度（Pipikaite,
    Barrachin and Crawford 2021, 2）。


    不仅网络安全监管在增加，其范围也在扩大。随着机器学习网络安全活动的增加，政府和机构对对抗性机器学习日益关注，并正在开发认证框架。例如，`ISO` 和美国国家标准技术研究院（`NIST`）正在制定“认证标准”，以评估机器学习的可信度（Microsoft
    2020, 35）。此类行动可能会导致与机器学习相关的法规。


    存在长期的网络安全法规，例如《健康保险流动性责任法》（`HIPAA`）和《格林姆-莱奇-布莱利法》（`GLBA`）（Warsinske, Mark and
    Kevin 2020, 156）。更多的美国网络安全监管正在路上（Tucker 2020, 1），特别是在 Colonial Pipeline 和 JBS
    遭受大规模勒索软件攻击之后（Marks 2021, 1）。澳大利亚政府正在收集有关网络安全监管方向的反馈，这些监管应与国际计划接轨、自愿并基于激励（Australian
    Government 2021, 1）。


    ## 微学习


    以下是增强你的学习和职业发展的练习：


    > • 识别你组织的网络安全法规。


