    \ issue event || Resulting in a delay to the build phase |\n\n| \n\n> Impact \n\
    \n || The impact to the project: high, medium, or low || High |\n\n| \n\n> Issue\
    \ resolution \n\n || The actions to resolve the issue || None |\n\n| \n\n> Resolved\
    \ by \n\n || The person responsible for resolving the issue || Barry Blanchard\
    \ |\n\n| \n\n> Resolution date \n\n || The date the issue must be resolved ||\
    \ August 14, 2020 |\n\n| \n\n> Issue status \n\n || The degree the issue is under\
    \ control || Red: The issue cannot be resolved in time |\n\n| \n\n> Comments \n\
    \n || Information about resolving and closing the issue || Servers are 6 months\
    \ behind manufacturing targets, but the vendor has promised a delivery date of\
    \ August 14, 2020, resulting in a 4-month delay to the project (April 2, 2020)\
    \ |\n\n[APPENDIX 4](#index_split_004.html#filepos8850)\n\n[Career Planning](#index_split_004.html#filepos8850)\n\
    \nQuality improvement is central in our frameworks and an integral component for\
    \ continued success. Achieving quality improvement is more likely with a holistic\
    \ approach: look for improvement opportunities throughout the Service Management\
    \ System to optimize the value streams for our users (Limited, AXELOS 2019, 83–86).\
    \ When one takes a holistic approach, the people involved in producing value can\
    \ also benefit from assessing and developing their competencies. The cybersecurity\
    \ professional can take a structured approach to improve their capabilities with\
    \ career planning.\n\nIt takes three to five years to become “proficient” in a\
    \ cybersecurity role (Oltsik 2020, 6). The cybersecurity professional will likely\
    \ develop and maintain technical competence in areas immediately related to their\
    \ role. While technical proficiency is being established, the cybersecurity professional\
    \ can begin to plan holistically and develop business-related capabilities in\
    \ leadership, communications, and business practices (Oltsik 2020, 17). Cybersecurity\
    \ professionals can anticipate future business demands and develop capabilities\
    \ in emerging technologies of interest to their industry. For example, business\
    \ is expected to adopt process automation and advanced analytics widely; therefore,\
    \ development in these areas will benefit cybersecurity professionals. Lean and\
    \ Six Sigma techniques can improve processes and reduce statistical variations\
    \ (Stanton, Gough, Ballardie, Bartam, Bamber, and Sohal 2014, 16) and can support\
    \ process automation projects. There are multiple ways to undertake career planning;\
    \ however, let’s first look at sustainable careers that can guide career planning.\n\
    \nSustainable Project-Oriented Career\n\nWe researched project-oriented sustainable\
    \ careers and identified critical actions to improve career sustainability (Skulmoski\
    \ et al. 2020, 11–12). A sustainable career is one where the work continues at\
    \ a sustainable pace, and there is balance in one’s life. One moves from project\
    \ to project without unplanned interruptions. Career sustainability is a broad\
    \ concern ranging from boxers who face the inevitability of leaving the ring,\
    \ or mothers who take a leave of absence from paid employment to raise a family,\
    \ or lawyers who need to win cases to stay employed. Technology SMEs are challenged\
    \ to stay current with emerging technologies and master an expanding palette of\
    \ digital functionalities in their software systems. In the Gig Economy and 4th\
    \ Industrial Revolution, we are increasingly project-oriented and move from project\
    \ to project, and sometimes organization to organization.\n\nWe found that career\
    \ sustainability depends on two contributors: networking and upskilling (Skulmoski\
    \ et al. 2020, 76). Networking with other professionals helps people find new\
    \ opportunities. Staying connected increases one’s capabilities and opens opportunities;\
    \ career sustainability is improved. Upskilling or expanding one’s competencies\
    \ is another career sustainability driver. We improve career sustainability as\
    \ we learn the skills to meet emerging demands (AI collaboration with robotics).\
    \ Therefore, forward-thinking cybersecurity professionals will invest time to\
    \ plan and nurture their careers.\n\nThe technology and cybersecurity skills gap\
    \ problem has been well studied since it is a perennial and perhaps a wicked problem.\
    \ Cybersecurity professionals are fortunate that there are many pathways to remain\
    \ competent such as pursuing technical certifications in technical platforms (e.g.,\
    \ Azure) or in a cybersecurity framework (e.g., CISSP). Unfortunately, part of\
    \ the cybersecurity skills gap problem is related to poor career planning: “As\
    \ this and past reports indicate, organizations and cybersecurity professionals\
    \ are not looking at the profession strategically. There is a continuous lack\
    \ of training, career development, and long-term planning. As a result, cybersecurity\
    \ professionals often muddle through their careers with little direction, jumping\
    \ from job to job and enhancing their skill sets on the fly rather than in any\
    \ systematic way” (Oltsik 2020, 5). That is, many IT professionals do not take\
    \ a strategic approach to career planning. Some visualize competence progression\
    \ within the ITIL framework using the T-Career model (DuMoulin 2019, 7).\n\nPlanning\
    \ the T-Career\n\nOne can envision career development over time if we look to\
    \ the career progression of our IT colleagues. One develops skills into skill\
    \ sets that can be illustrated as a shape across a maturity and capability spectrum\
    \ ([Figure A4.1](#index_split_030.html#filepos435178), after Demirkan and Spohrer\
    \ 2015, 13). The basic depiction of a T-shape professional has been modified in\
    \ Shields Up, where the horizontal part of the T represents business skills and\
    \ the vertical part represents technical skills. The new university cybersecurity\
    \ graduate has a technical foundation required to join an IT department and joins\
    \ with an I-shape skill set. With time, the new cybersecurity professional settles\
    \ and continues to learn the technologies required to perform their role. They\
    \ may formally add vendor-specific technical certifications such as the Cisco\
    \ Certified Network Associate Security certification or certify in a technique\
    \ such as the Certified Ethical Hacker. The I-shape skillset broadens as SMEs\
    \ accumulate technical skills and certifications."
