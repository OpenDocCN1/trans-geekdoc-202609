    \ \n\n[About the Author](#index_split_004.html#filepos9071)\n\nGregory J. Skulmoski,\
    \ BEd, MBA, PhD, CITP, FBCS, is a seasoned (and bruised!) project manager who\
    \ has led technical and nontechnical projects in Australia, the Middle East, and\
    \ Canada, with about $10 billion project experience. He is a Certified Information\
    \ Technology Professional and a lifetime Fellow of the British Computer Society.\
    \ Greg has a PhD in project management, where he focused his research on the competencies\
    \ required for transformation and optimization projects. As a PhD student, he\
    \ won the prestigious Robert J. Yourzak Scholarship Award from the Project Management\
    \ Institute (PMI). Greg was a core member of PMI’s the Guide to the Project Management\
    \ Body of Knowledge® 2000 Update Team that revised the original PMI PMBOK® Guide\
    \ (PMI 1996). He has contributed to other standards such as PMI’s Practice Standard\
    \ for Work Breakdown Structures, the Organizational Project Management Maturity\
    \ Model, and the Project Manager Competency Development Framework. Greg has presented\
    \ his research to technical audiences in over 16 countries, and his research has\
    \ appeared in top-tier journals and books.\n\nDr. Skulmoski currently teaches\
    \ project innovation management at Bond University in the Faculty of Society and\
    \ Design. Greg’s teaching focus is on practical processes and tools to successfully\
    \ implement technology projects. Greg used these hybrid project management tools\
    \ and processes to win the Chief Information Security Officers 2017 Middle East\
    \ Security Award (for risk management in projects). Dr. Skulmoski is bringing\
    \ theory and practice together in his book Shields Up: Cybersecurity Project Management\
    \ for Business Experts Press (Due 2022). Greg plays drums, scuba dives, and likes\
    \ to be outside with his family and friends.\n\n[Index](#index_split_004.html#filepos9183)\n\
