- raw: "Some projects benefit from a risk management workshop: key project stakeholders\
    \ meet for about two hours to identify, analyze, and treat project risks and issues.\
    \ First, describe your risk management plan for the project and give an overview\
    \ of risk management theory. Use yellow stickies and instruct the participants\
    \ to draw horizontal and vertical lines on the yellow stickies for the different\
    \ elements of risk management (e.g., cause, event, effect probability, impact,\
    \ prevention, and mitigation). Work together to identify the first few risks and\
    \ show the participants how to complete the yellow stickies with risk information\
    \ ([Figure 8.8](#index_split_018.html#filepos297639)). Then ask the participants\
    \ to identify some risks. This general approach allows participants to raise any\
    \ risk and is designed to get the participants to work together and apply risk\
    \ management theory. The participants place their risks onto the wall for everyone\
    \ to see (collaborative software like online mind mapping tools can facilitate\
    \ an online risk workshop). As participants write down risks, they actively contribute\
    \ to the project and team building occurs.\n\nWe can then take a focused approach\
    \ and systematically examine risks related to milestones, critical path, budget,\
    \ phases, procurement process, go-live phase, and so on. For example, examine\
    \ each activity along the critical path to identify, analyze, and treat risks\
    \ and issues. We can repeat our risk management process to examine the main milestones,\
    \ the schedule, the budget, and so on. By focusing on specific categories of risks,\
    \ we are comprehensive and considerably shift the information curve.\n\nOnce risks\
    \ are identified, we can then prioritize them with a risk matrix ([Figure 8.9](#index_split_018.html#filepos298328)).\
    \ We prioritize risks by their severity (probability × impact) and issues by impact\
    \ (we do not assess probability of occurrence with issues since the issue exists).\
    \ For example, high probability/high impact risks should be the team’s focus as\
    \ there is a high probability the risk may occur, and if it occurs, the impact\
    \ on the project is high. We can then prioritize our risks, inform leadership\
    \ of severe risks, and implement our treatment plans to prevent and mitigate.\
    \ The risk register illustrates risk management efforts and becomes a historical\
    \ record that should be preserved with other project documents (risk and issue\
    \ registers can be used in disputes and litigation).\n\n![](images/00002.jpg)\n\
    \nFigure 8.8 Risk identification, analysis, and treatment\n\nWe also see in [Figure\
    \ 8.9](#index_split_018.html#filepos298328) that we group natural triads on the\
    \ yellow stickies: cause–probability of occurrence–prevention belong together,\
    \ and effect–impact–mitigation belong together. Yellow stickies and the risk management\
    \ workshop can be a powerful tool to quickly identify and understand risks and\
    \ foster team building to shift the information curve for all.\n\n![](images/00007.jpg)\n\
    \nFigure 8.9 Risk matrix\n\nRisk management is one of the most important activities\
    \ we need to perform in our projects. Even though we have budgets and schedules,\
    \ there is a high rate of technology projects delivered late or over budget. Why?\
    \ Risks became issues resulting in delays and overspending. These project managers\
