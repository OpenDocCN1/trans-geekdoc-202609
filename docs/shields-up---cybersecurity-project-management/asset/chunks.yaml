    The testing process diagram ([Figure 11.1](#index_split_021.html#filepos331839))
    does not illustrate the collaborative nature of planning the test strategy and
    plan; the project manager sets expectations for testing involvement when he meets
    with the sponsor and leadership early in the project and during the project planning
    workshop. Some organizations include a test strategy and plan approval process
    with a stage gate before testing commencement.


    ![](images/00005.jpg)


    ### Figure 11.1 Testing process


    A test strategy is a concise report to stakeholders that outlines at a macro-level
    the testing approach and how the test objectives will be satisfied. The following
    are the basics of a test strategy and can be tailored to your project:


    1. **Test objectives**: Document and verify the test objectives (e.g., find and
    fix defects, improve confidence in the product or service, and verify the product
    or service meets expectations).

    2. **In scope**: Identify what will be tested and why.

    3. **Out of scope**: Document what will be excluded from testing and why.

    4. **Test type**: Identify and justify the types of tests you will use ([Table
    11.1](#index_split_021.html#filepos333181)). Some add a “Rationale” column to
    justify why a particular test is in scope or out of scope. A search online reveals
    additional tests (e.g., smoke testing), and the reader can review this technical
    theory and practice to tailor the types of tests appropriate for the project.


    #### Table 11.1 System testing overview


    | Test type | Included | Due date | Responsible |

    | --- | --- | --- | --- |

    | Unit | Yes | 12 September | Jason Hawk |

    | Functional | Yes | 17 September | Saif Al Llama |

    | Integration | Yes | 24 September | Makoto Tamari |

    | Regression | No | — | — |

    | Install/uninstall | Yes | 1 October | Federico Sant Anna |

    | Performance/stress | Yes | 1 October | Irene Cornell |

    | User acceptance | Yes | 15 October | Marianne Jones |

    | Security | Yes | 29 October | Israa Alberta |


    5. **Test execution**: Describe and justify whether testing will be manual or
    automated. Some tests may be automated (e.g., functional), while others may be
    manual (e.g., unit). There is an increasing number of open source and commercial
    testing tools, and many incorporate defect management.

    6. **Defect management**: Describe how defects will be managed and controlled
    and the software that you will use to manage the defects, including any outstanding
    actions (e.g., defects that are resolved with future software patches from the
    vendor).

    7. **Communications management**: Describe how stakeholders will be informed of
    test results, including the final test report.

    8. **Test schedule**: Include a high-level schedule or Gantt chart.

    9. **Test risk and issue management**: Describe that you will use the defect management
    process in conjunction with the risk management process. If significant defects
    are identified, a risk or an issue may be raised and managed.


    Some organizations have a test strategy and plan template (quality assurance)
    to guide the project manager. The project manager can front-end load the project
    by collecting test strategy and other project-related templates early in the project
    to help guide project planning.


    ## Test Plan


    The test plan is an extension of and companion to the test strategy. The test
    plan provides the details of the test environment, test scripts, and test data.
    The subject matter experts (e.g., vendor) usually take the lead to develop the
    test plan:


    1. **Test environment**: The test environment mirrors the production environment
    and is safe for testing and experimental defect resolution. The test environment
    includes the hardware, software, and operating system that meets the minimum requirements
    for test execution.

    2. **Test scripts**: Develop the detailed test instructions to test and verify
    that the requirements have been met (e.g., Load the website landing page and click
    on the “Login” button. Verify that the Login Screen appears with the `Username`
    and `Password` fields). Some distinguish test scripts (automated testing) from
    test cases (manual testing). Test scripts often include the test ID number, test
    data, testing steps, and actual and expected results. If the actual results differ
    from the expected results, there may be a defect.

    3. **Test data**: Data used during the test is developed rather than using real
    data due to privacy concerns. The project team develops data to use in the test
    scripts to verify that the system operates as designed. Since the data are developed,
    a lean-oriented team can develop versatile data to service multiple test scripts.
    Many testers leverage data management tools to reduce the administrative burden
    of test data management.

    4. **Test metrics**: Identify the metrics that the approvers desire (e.g., number
    of test scripts planned, number of test scripts executed, and number of defects);
    sometimes, testers provide metrics that are not required from approvers. Set up
    your testing dashboard to track the required metrics and easily add them to the
    test report.


    The reader is fortunate that an online search can refresh their knowledge of test
    environments, test scripts, data, and metrics and show the current state and trends
    in application testing (e.g., automated testing with AI capabilities).


    The test plan may include a requirements traceability matrix that maps the stakeholders’
    requirements to test scripts and tracks verification ([Figure 11.2](#index_split_021.html#filepos342455)).
    The matrix is used as evidence that the project requirements have been met. The
    requirements traceability matrix is a quality assurance template that can be reused
    in future projects. The requirements traceability matrix can serve as a testing
    dashboard by adding status and results columns. Adding additional columns is an
    example of leanness in project documents.


    ![](images/00038.jpg)


    ### Figure 11.2 Requirements traceability matrix


    ## User Acceptance Testing


    User acceptance tests (UAT) verify if a system satisfies the approved stakeholder
    requirements. The UAT occurs after the testing team completes their series of
    tests (e.g., unit, functional, and integration), rectifies defects, and the SMEs
    believe the system performs as designed. Then, the project manager invites the
    end users to UAT testing workshops ([Figure 11.1](#index_split_021.html#filepos331839))
    to validate that the system performs as designed and meets stakeholder expectations.
    The testing team repeats the tests and uses the requirements traceability dashboard,
    test environment, scripts, and data. Ideally, the end user executes the scripts
    to understand the system better, resulting in finding and fixing defects before
    going live. The term “defects” is broadly used to mean the end user requires changes.
    For example, the system may operate as designed. Still, the user may request changes
    to menus—rather than a menu list in alphabetical order; the user may request the
    top five choices be prioritized and appear at the top of the drop-down menu. Or
    there could be spelling and grammar mistakes to fix. These defects are fixed and
    tracked to completion with the requirements traceability matrix or a defects tracker.
    If there are any outstanding defects or comments, they are also noted in the traceability
    matrix and defects tracker.

    '
  trans: '

    测试流程图（图 11.1）说明了测试策略和计划的协作性质；项目经理在项目早期与赞助人和领导层会，设定测试预期。某些组织在测试开始前包含测试策略和计划审批流程。


    ![](img/00005.jpg)


    ### 图 11.1 测试流程


    测试策略是一份面向利益相关者的简明报告，在宏观层面概述了测试方法以及如何满足测试目标。以下是测试策略和计划的基础内容：


    1. **测试目标**：记录并验证测试目标（例如，发现并修复缺陷，改进产品或服务，并验证符合预期）。

    2. **范围**：识别哪些内容将进行测试。

    3. **范围外**：记录哪些内容被排除在测试之外。

    4. **测试类型**：识别并说明将使用的测试类型（表 11.1）。某些组织会添加“理由”列来解释为什么特定测试在范围之内或之外。在线搜索显示了额外的测试（例如，冒烟测试），读者可以根据这些理论和实践来调整项目的测试类型。


    #### 表 11.1 测试概述


    | 测试类型 | 是否包含 | 截止日期 | 负责人 |

    | --- | --- | --- | --- |

    | 单元测试 (Unit) | 是 | 9 月 12 日 | Jason Hawk |

    | 功能性测试 (Functional) | 是 | 9 月 17 日 | Saif Llama |

    | 集成测试 (Integration) | 是 | 9 月 24 日 | Makoto Tamari |

    | 回归测试 (Regression) | 否 | — | — |

    | 安装/卸载 (Install/uninstall) | 是 | 10 月 1 日 | Federico Sant |

    | 性能/压力测试 (Performance/stress) | 是 | 10 月 1 日 | Irene Cornell |

    | 用户验收测试 (User acceptance) | 是 | 10 月 15 日 | Marianne Jones |

    | 安全测试 (Security) | 是 | 10 月 29 日 | Israa Alberta |


    5. **测试执行**：描述测试是手动还是自动。某些测试可以是自动的（例如，功能测试），而其他可能是手动的（例如，单元测试）。许多开源和商业测试工具都集成了缺陷管理功能。

    6. **缺陷管理**：描述如何管理和控制缺陷，以及将使用的缺陷进行管理，包括任何待处理的操作（通过未来的软件补丁）。

    7. **沟通管理**：描述如何告知利益相关者测试结果，包括最终测试报告。

    8. **测试进度**：包含进度表或甘特图。

    9. **测试风险和问题管理**：描述如何结合风险管理过程使用缺陷管理流程。如果发现了重大缺陷，可能会提出风险或问题。


    某些组织拥有测试策略和计划模板（质量保证）来指导项目经理。项目经理可以在项目早期通过收集测试策略和其他项目模板来帮助项目规划。


    ## 测试计划


    测试计划是测试策略的扩展和伴侣。测试计划提供了测试环境、测试脚本和数据的详细信息。领域专家（例如，供应商）通常负责开发测试计划：


    1. **测试环境**：测试环境镜像生产环境，并对于测试和缺陷解决是安全的。测试环境包含了硬件、软件和满足测试执行最低要求的操作系统。

    2. **测试脚本**：开发详细的测试指令以测试并验证需求已满足（例如，加载网站首页并点击“登录”按钮。验证登录界面出现了 `Username` 和 `Password`
    字段）。某些区分测试脚本（自动化测试）和测试用例（手动测试）。测试脚本通常包含测试 ID、测试数据、测试步骤以及实际和预期结果。如果实际结果与预期结果不同，可能存在缺陷。

    3. **测试数据**：由于隐私考虑，测试期间使用的数据是开发的而非真实数据。项目团队开发测试脚本的数据以验证系统按设计运行。精益团队可以开发适用于多个脚本的数据。许多测试人员利用数据管理工具来减轻测试数据管理的负担。

    4. **测试指标**：识别审批者所需的指标（例如，计划的测试脚本数量、执行的测试脚本数量和缺陷数量）；有时测试人员提供的指标并非审批所需。设置测试仪表板以跟踪所需的指标，并轻松将其添加到测试报告中。


    读者很幸运在线搜索可以刷新对测试环境、测试脚本、数据和指标的知识，并显示应用测试的现状和趋势（例如，具有 AI 能力的自动化测试）。


    测试计划可能包含需求跟踪矩阵，将利益相关者的需求映射到测试脚本并跟踪验证（图 11.2）。该矩阵被用作项目需求已实现的证据。需求跟踪矩阵是一个质量保证模板，可以在未来的项目中重用。通过跟踪矩阵可以通过需求跟踪可以作为测试仪表板。添加额外的列是项目文档精化的示例。


    ![](img/00038.jpg)


    ### 图 11.2 需求跟踪矩阵


    ## 用户验收测试


    用户验收测试（UAT）验证系统是否满足批准的利益相关者需求。UAT 发生在测试团队完成系列测试（例如，单元、功能和集成）、修复缺陷且领域专家认为系统按设计运行之后。然后，项目经理邀请最终用户参加
    UAT 测试工作坊（图 11.1），以验证系统按设计运行并符合利益相关者的预期。测试团队重复测试并使用需求跟踪仪表板、测试环境、脚本和数据。理想情况下，最终用户执行脚本以更好地理解系统，从而在上线前发现并修复缺陷。“缺陷”一词被广泛用于指最终用户需要更改。例如，系统可能按设计运行，尽管如此，用户可能会更改菜单——而不是按字母顺序排列菜单列表；用户可能会要求对前五个选项进行优先级排序并在下拉菜单的顶部。或者可能有拼写和语法错误需要修复。这些缺陷通过需求跟踪矩阵或缺陷跟踪器进行修复并跟踪直到完成。

    '
