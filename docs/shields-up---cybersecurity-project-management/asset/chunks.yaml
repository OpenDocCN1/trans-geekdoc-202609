    Some projects benefit from a risk management workshop: key project stakeholders
    meet for about two hours to identify, analyze, and treat project risks and issues.
    First, describe your risk management plan for the project and give an overview
    of risk management theory. Use yellow stickies and instruct the participants to
    draw horizontal and vertical lines on the yellow stickies for the different elements
    of risk management (e.g., cause, event, effect probability, impact, prevention,
    and mitigation). Work together to identify the first few risks and show the participants
    how to complete the yellow stickies with risk information ([Figure 8.8](#index_split_018.html#filepos297639)).
    Then ask the participants to identify some risks. This general approach allows
    participants to raise any risk and is designed to get the participants to work
    together and apply risk management theory. The participants place their risks
    onto the wall for everyone to see (collaborative software like online mind mapping
    tools can facilitate an online risk workshop). As participants write down risks,
    they actively contribute to the project and team building occurs.


    We can then take a focused approach and systematically examine risks related to
    milestones, critical path, budget, phases, procurement process, go-live phase,
    and so on. For example, examine each activity along the critical path to identify,
    analyze, and treat risks and issues. We can repeat our risk management process
    to examine the main milestones, the schedule, the budget, and so on. By focusing
    on specific categories of risks, we are comprehensive and considerably shift the
    information curve.


    Once risks are identified, we can then prioritize them with a risk matrix ([Figure
    8.9](#index_split_018.html#filepos298328)). We prioritize risks by their severity
    (`probability × impact`) and issues by impact (we do not assess probability of
    occurrence with issues since the issue exists). For example, high probability/high
    impact risks should be the team’s focus as there is a high probability the risk
    may occur, and if it occurs, the impact on the project is high. We can then prioritize
    our risks, inform leadership of severe risks, and implement our treatment plans
    to prevent and mitigate. The risk register illustrates risk management efforts
    and becomes a historical record that should be preserved with other project documents
    (risk and issue registers can be used in disputes and litigation).


    ![](images/00002.jpg)


    Figure 8.8 Risk identification, analysis, and treatment


    We also see in [Figure 8.9](#index_split_018.html#filepos298328) that we group
    natural triads on the yellow stickies: cause–probability of occurrence–prevention
    belong together, and effect–impact–mitigation belong together. Yellow stickies
    and the risk management workshop can be a powerful tool to quickly identify and
    understand risks and foster team building to shift the information curve for all.


    ![](images/00007.jpg)


    Figure 8.9 Risk matrix


    Risk management is one of the most important activities we need to perform in
    our projects. Even though we have budgets and schedules, there is a high rate
    of technology projects delivered late or over budget. Why? Risks became issues
    resulting in delays and overspending. These project managers thought they had
    suitable budgets and schedules yet overspent and delivered late; the critical
    reason for their failure is that risk management was likely not as effective as
    necessary. Therefore, to significantly improve the probability of project success,
    we need to become effective and efficient with managing risks and issues, the
    core of hybrid project management used in our quest to deliver value.


    ### Exercise


    > Think about your organization or another you worked for:

    > • How does your department manage and report risks and issues?

    > • Does your organization use `Monte Carlo Simulation` to help analyze risks?

    > • What is the IT project success rate in your industry?

    > • Review `ISO 27005 Risk Management Process` to deepen your understanding of
    information security risk management.


    ### Microlearning


    Investing in risk management skills is time well spent since all that we do in
    a cybersecurity ecosystem involves risk. Therefore, the following microlearning
    opportunities can expand your understanding of this important topic—project risk
    management. Look online for more information about:


    > • Risk management definition

    > • Risk, issue, and uncertainty definitions

    > • Risk management strategy

    > • Risk management plans

    > • Risk management templates

    > • Risk management tools

    > • Risk management matrix

    > • `ISO 31000:2018 Risk Management—Guidelines`

    > • Risk management and AI

    > • `Monte Carlo Simulation` and

    > • Risk management policy


    ### Quality Management


    Quality management includes tools and processes we use to ensure that the project
    will deliver the intended value for which it was initiated and documented in the
    quality management plan. We use training, templates, and checklists to help manage
    quality and other processes such as planning and tools like stage gates to verify
    the right quality is produced.


    Shields Up uses two quality management processes: quality assurance and quality
    control ([Figure 4.2](#index_split_013.html#filepos105809)). We do quality assurance
    before undertaking an activity to ensure the activity is performed correctly.
    We can follow a checklist, procedure, process, or template to improve the likelihood
    that the work will be completed to the right level of quality. Training also supplements
    quality assurance; for example, team members learn to use the `risk register`
    to document risks and issues consistently. Or we follow configuration instructions
    to set up a server. Quality control checks the work after it has been performed;
    we find and fix defects. Again, checklists, templates, procedures, and training
    can guide quality control activities to find and fix defects. For example, we
    follow testing scripts to verify that the build works as per the approved design.
    Thus, we use quality assurance and control to deliver the right amount of value
    in our projects: Quality Assurance Before Quality Control: ABC.


    Our hybrid project management approach focuses on performing the work correctly
    the first time; we can improve the probability of project success (`Done–Won–Who`)
    with quality management and risk management. We favor quality assurance over quality
    control; it is better to perform the work resulting in minimal defects than finding
    and fixing defects as part of the quality control effort. Quality assurance with
    templates and checklists guides our work to be completed the first time correctly.
    Risk management (e.g., prevention activities) helps to ensure the work is done
    correctly.


    We use governance techniques to help ensure high quality; for example, we structure
    our project with the traditional project management delivery approach with stage
    gates at the end of each phase to verify quality. If the team completes a high-quality
    design, the stakeholders approve the design, moving to the next phase. Risk and
    quality management are inherent in the hybrid project management approach, as
    seen in [Figure 6.2](#index_split_016.html#filepos202976). You can see that the
    risk management process occurs in each phase, and the stage gates act as a quality
    control mechanism. We follow templates (e.g., `application detailed design`) structured
    to keep our content lean and guide content development.

