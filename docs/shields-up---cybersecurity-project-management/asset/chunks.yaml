    (访问于 2021 年 10 月 23 日)。


    > AustCyber. 2020. “AustCyber 发布新的数字信任报告，显示工作和收入面临风险.” AustCyber. [www.austcyber.com/news-events/austcyber-launches-new-digital-trust-report-showing-jobs-and-revenue-stake](http://www.austcyber.com/news-events/austcyber-launches-new-digital-trust-report-showing-jobs-and-revenue-stake)
    (访问于 2021 年 10 月 23 日)。


