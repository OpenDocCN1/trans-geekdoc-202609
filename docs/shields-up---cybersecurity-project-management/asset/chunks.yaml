    # 混合项目管理


    ## 第 6 章：网络安全项目管理


    `第二部分` 的目的是为计划和实施网络安全项目提供实用指导。这种混合项目管理方法源于理论和标准，已被证明是实施网络安全等技术的最佳实践。其意图是，你对 `Shields
    Up` 方法的调整也将是精简的，并根据你项目和组织的独特需求量身定制。这种混合项目管理方法与领先的项目管理、`ISO 9001` 质量管理、`ISO 3100`
    风险管理、`ITIL` 以及 `NIST` 框架一致，并将帮助你成功实施网络安全和其他技术项目。事实上，交付我们组织所重视的新技术服务取决于整个价值链活动中的有效项目管理（Limited,
    AXELOS 2019, 95）。Berger 等人（2020, 5）建议 `ITIL 4` “完全有能力”整合服务管理、风险管理、`ISO 27001`
    信息安全管理以及 `NIST` 网络安全框架。人们可以整合关键框架来交付网络安全项目（图 5.8）。


    ### 混合项目管理


    混合项目管理结合了预测性和自适应性过程（PMI 2021, 100）。人们使用混合项目管理方法来适应组织环境和项目；人们意识到“没有一把刀切切”。


    `PMBOK® 指南`第 7 版强调通过“裁剪”来选择正确的过程、工具、技术和输入来交付项目（PMI 2021, 131–132）。人们从宏观到微观的角度，通过质量改进周期进行工作（图
    6.1，参考 PMI 2021, 137）。


    ![](img/00035.jpg)


    图 6.1 对你的项目进行裁剪


    因此，混合项目管理允许项目经理通过裁剪方法，根据组织的需求和项目情况微调项目交付方法（过程、工具、技术和输入，包括人员）。


    裁剪过程的第一步是选择一种项目管理方法；大多数网络安全项目可以使用混合项目交付实施（图 6.2）。事实上，`ITIL` 框架是灵活的，允许组织微调`服务价值链`
    以满足其项目的独特需求（Limited, AXELOS 2019, 18）。大多数项目经理使用传统的项目管理方法，并从领导低模糊性的常规或不复杂的项目开始职业生涯。他们按照预期推进项目阶段，特别是当阶段关由阶段关控制进度时。阶段关（也称为控制关）是领导层可以批准或终止项目的决策点。如果项目经理是项目管理新手，且领导层希望提供引导以帮助新项目经理成功交付项目，那么阶段关将是有益的。如果以下文档获得批准，我们就可以离开设计阶段并进入构建阶段：(i)
    应用详细设计，(ii) 基础设施低级设计和 (iii) 集成规范。人们也可以在项目拐点完成项目评审，审查项目状态、项目可行性以及业务案例的持续相关性。


    ![](img/00001.jpg)


    图 6.2 混合项目交付方法


    阶段关的一个关键益处是，表现糟糕的项目可以通过重新计划和批准来终止或救援。阶段关广泛用于提高严谨性、治理和质量并降低风险。阶段关易于理解、使用和实施。在你的网络安全项目中包含阶段关，记录你需要交付的内容，包括在监控期结束后终止项目。


    如果你的组织缺乏正式的阶段关，你可以与经理和赞助人建立阶段关和成功标准。与`ITIL 服务价值链`一致，项目经理会开发一些里程碑文档，例如完成计划阶段的批准项目计划，或完成测试阶段的测试报告（表
    6.1）。与精益项目管理一致，我们尽可能减少项目产生的文档量；随着经验的积累，我们文档的质量将会提高并变得更加精简。


    混合项目交付方法在每个项目阶段都包含了风险管理过程（识别、分析、处理和控制）（图 6.2）。风险管理对于交付成功项目至关重要（参见风险管理章节），并是大多数项目管理工作和决策的基础。最后，混合项目交付方法在需要时可以适应迭代（图
    6.2）。例如，我们可能会通过迭代来微调项目范围以启动正确的项目。后期，如果我们实施的技术是前沿的，我们可能会经历多次迭代来微调项目范围。同样，当我们测试应用程序时，可能会遇到缺陷，需要多次尝试以找到可行的解决方案。这些迭代取决于团队的目的，可能会或松地遵循
    `Scrum` 方法（图 5.4）。


    ### 表 6.1 阶段关示例


    | 阶段关标准 |

    | --- |

    | 启动 | 业务认可项目（会议纪要） |

    | | 提供资金（会议纪要） |

    | | 认可可行性（向变更委员会汇报） |

    | | 领导层批准继续进行（会议纪要） |

    | 计划 | 已完成项目计划工作会（会议纪要） |

    | | 预算基准化 |

    | | 进度基准化 |

    | | 项目计划文档通过批准（链接至纪要、进度和预算） |

    | 设计 | 已完成设计工作会（纪要） |

    | | 项目设计文档通过批准 |

    | 构建 | 已完成构建工作会（会议纪要） |

    | | 项目构建文档通过批准 |

    | 测试 | 测试策略文档通过批准 |

    | | 已完成测试工作会（会议纪要） |

    | | 测试报告文档通过批准 |

    | T2P | 已完成 T2P 工作会（会议纪要） |

    | | 已完成 T2P 清单 |

    | | 上线计划通过批准 |

    | | 提交变更请求 |

    | 结项 | 总结报告通过批准 |

    | | 变更委员会批准项目结项 |

    | | 项目和团队解散已记录并存档 |


