    在 IT 领域工作，我们看到了技术的不断变革。我不禁想起“除了自动售卖机，一切变化都是确定的”；很快，售卖机将变得仅支持数字支付。正在进行的变革在《第四次工业革命：世界经济论坛》中了他的详述，研究人员将第四次工业革命描述为融合了数字、生物和物理实体的数字革命（Schwab
    2016, 7）。一个显著的特征是这些技术出现呈指数级速度，带来了巨大的影响：“影响的规模和变化发生的速度，使得正在发生的变革与人类历史上任何其他工业革命都大不同”（Schwab
    2016, 109）。数据处理和通信正以不断加快的速度进行，这给数据量、存储容量、处理能力和所创造的知识带来了压力（Creese, Saunders, Axon,
    and Dixon 2020, 10），并可能触发新项目（例如升级基础设施）。我们看到一些组织正在拥抱持续的数字化转型项目（Creese et al. 2020,
    10），这体现在 IT 预算的整体增加（Columbus 2020, 1）。


    我们看到人们通过以前所未有的计算能力、存储容量和功能的移动技术连接，访问广泛的知识数据库。变革性技术正在涌现，如人工智能（AI）、数据建模、3D 打印、纳米制造、量子计算、大规模能量存储等。流行文献歌扬着数字加速和变革的新时代（表
    1.1）。


    我们的经理阅读这些来自数字思想领袖的文章，期待持续且加速的技术进步。这些带来了可以利用的数字机会和需要保护的安全漏洞。这些具有影响力的报告现在驱动着业务战略，新技术正在改变我们客户的预期。这些新兴技术的承诺往往被转化为对新项目和安全系统的请求。更多的网络安全项目正向我们走来！


    ### 表 1.1 数字加速与变革


    | 来源 | 观点 | 评论 |

    | --- | --- | --- |

    | McHugh (2020, 1) | “自动化的速度正在加快，越来越多的组织正在创建全自动价值链” | 现在我必须担心我们系统的安全以及合作伙伴系统的安全
    |

    | Mulesoft (2020, 4) | “组织正日益投资 AI 能力，以加速和个性化客户服务，减少人类偏见并提高生产力” | 这些业务需求听起来不错，但有这么多技术需要保护啊！
    |

    | Blackburn, LaBerge, O’Toole, and Schneider (2020, 3) | “大胆且紧密整合的数字战略是数字化转型的最有效方法”
    | 大胆！我已经在加班来确保我们数据和系统的安全可靠了 |

    | Gonzalo, Harreis, Altable, and Villepelet (2020, 5) | “公司必须在需求生成和运营管理方面都加速其在线能力”
    | 加速？我已经说过我在加班了！ |

    | Skilton and Hovsepian (2018, 60) | “人工智能以及智能系统融入行业、个人和社会的短期至中长期影响，将对人类在职场中的角色和人类体验产生深远影响”
    | 我 10 年前就知道了！我每天都感受着这些系统带来的深远影响！ |

    | PMI (2018, 6) | PMI 的一份报告发现，到 2030 年将出现的工作中 85% 甚至还没有被发明！ | 我几乎无力维持当前技术的安全，更不用说支持那些尚未出现的工作所需的技术了
    |

    | Scheibenreif and Raskino (2021, 1) | “机器客户代表了十年最大的新增长机会。事实上，到 2030 年，至少 25%
    的所有购买决策将委托给机器” | 现在，我需要考虑机器被黑客攻击，导致机器客户非法使用我们的信用卡！ |


    ### 颠覆性技术的加速


    创新和技术的采用正在加速，人们感觉到，如果组织不实施数字化转型战略，对于落后者来说，追上技术的早期采用者可能已经太晚了（Aaldering and Song
    2021, 12）。事实上，Covid-19 触发了数字化的巨大加速（Scholtz 2021, 2）。这些技术需要被保护，因为它们可能带来新的漏洞。然而，随着技术采用速度的加快，保护技术的需求也会之加快。因此，早期采用者可能会继续以加速的速度实施技术，而落后者将尝试追赶。结果将是更多的技术项目和以更快的节奏进行的网络安全工作。


    ### 需要保护的新技术


    在这里，具体的技术和趋势并不重要；与技术采用相关的趋势更具意义。我们看到 `5G` 技术的部署为组织和恶意行为者开启了连接、复杂性和机会的新时代。世界经济论坛（Creese
    et al. 2020, 6）预测以下变革性技术将变得越来越重要：无处不在的连接、`AI` 和 `机器学习`、`量子计算`以及下一代身份识别和访问管理。`IoT`
    和传感器等技术的结合将带来新的机会和资产。组织将越来越多地将其生态系统的组件迁移到云端，从而增加了网络安全工作的复杂性。


    我们可以预计下一代计算（如协作计算、分布式计算和量子计算）将带来变革性变化，早期采用者将拥有颠覆性优势，并改变战略、运营、供应链和市场（Corbo and
    Ostojic 2021, 2）。我们的组织中出现早期采用者提出新技术并不意外。预计会有更多包含 `AI` 技术的提案。然而，这些新兴技术改变了风险方程式，增加了并不断演变的威胁、扩大了攻击面、持续的结构性缺陷，以及由于网络攻击导致的严重后果（Creese
    et al. 2020, 13）。


    ### AI 技术成为主流


    `AI` 是下一个大趋势（PMI 2019, 2）。我们在多个行业看到了 `AI` 的早期采用者，包括广告、汽车、银行、电子、金融服务、医疗、保险、媒体、制药、电信和运输（Corbo
    and Ostojic 2021, 2）。我们可以预计 `AI` 将广泛应用于：


    1. 整个价值链的自动化和生产力提升；

    2. 下一代客户体验；

    3. 研究和开发的转型；

    4. 新的商业模式、产品和服务（Corbo and Ostojic 2021, 2）。


    因此，我们将看到更多实施应用类 `AI` 应用和服务的项目。这些由 `AI` 支持的应用和服务将需要网络安全的参与。


    '
