    将职业规划与年度绩效考核相结合，可以让你不仅在评估中获得高分，还能帮助你因考虑周全而脱颖而出。很少有 IT 专业人士在职业规划中将眼光放在一两年以后，大多数人的关注点仅集中在技术能力的开发上。如果你在培训计划中也加入项目管理和精益六格玛（Lean
    Six Sigma）等业务技能，你将会脱而出。组织支持高价值员工（例如网络安全专业人士）并资助就读顶级大学的 MBA 并不罕见。组织在寻找和留住网络安全人才方面面临困难。组织可以通过支持职业规划、为培训教育提供资金支持，以及提供外岗和任命其他职位以获得广泛经验，来留住最优秀的人。


    通过额外的培训，网络安全专业人士获得了新的知识和技能；要寻找应用这些新能力的机会。你可以争取在组织内部晋升以获得新经验。然而，横向转移到如 `Service
    Desk Queue Manager`、`IT Contracts Manager` 和 `IT Service Quality Manager`（IT 服务质量经理）等职位，也能提供宝贵的成长经验。这些职位属于技术部门，但在网络安全领域之外；在广泛领域获得经验可以增加你对整个
    IT 部门及其服务的理解。你也可以在同事休年时自愿为他们“代班”；通过代班你可以获得多样化的经验并加速学习。这些横向和覆盖的机会不仅会扩展你在周边领域的知识和技能，还能从整体上提升。


    ## 微学习


    以下是一些增强你学习的实用练习：


    * • 寻找关于微学习和持续性专业发展的文章，以更好地理解这种强大的学习模式。

    * • 在线搜索职业规划流程，并进行定制，以遵循一个符合你逻辑的流程。

    * • 搜索高级技术职位的招聘广告，以更好地了解新兴的工作需求和相关能力。确定需要开发的目标能力。

    * • 寻找平衡，使你能够开发技术能力和非技术能力（如领导力、沟通和项目管理）。

    * • 识别并开发持久性的能力（例如项目管理），这些能力不会像许多技术认证那样，随着新技术的出现而迅速过时。


    ## 参考文献


    > Aaldering, L.J., and C.H. Song. 2021. “论领军者与落后者——迈向过程工业的数字化.” Technovation 105,
    pp. 1–15. doi.10.1016/j.technovation.2020.102211


