    记录项目需求和设计的常用方法是举办一系列设计研讨会与最终用户会。其基本流程是在研讨会环境中与利益相关者会以获取设计意图，在设计文档（或多个）中记录所需的设计，然后批准该设计。一旦获得批准，设计阶段即结束，进入构建阶段。一个常见的风险是研讨会可能无法全员出席，导致批准并构建了一个有缺陷或不完整的设计。在测试期间，用户将告知技术团队该设计是有“缺陷”的。因此，需要防止和缓解研讨会出席率低的问题。一种预防措施是邀请经理参加研讨会。他们的出席传达了研讨会的重要性。如果老板参加，员工更有可能参加研讨会。一种缓解行动是针对可能错过设计研讨会的关键领域专家（SME）重复研讨会。虽然重复研讨会可能会消耗大量资源，但为了按照进度进行，考虑到关键
    SME 的输入而增加额外的研讨会有时是不可避免的。


    项目经理可以使用 PMO（项目管理办公室）的设计模板来记录设计。模板是质量保证辅助工具，用于快速开发设计文档。（如果您的组织没有自己的模板，可以在网上找到符合
    ITIL 标准的设计模板和研讨会程。）设计文档需要像项目计划一样被批准。我们可以采取与规划阶段相似的批准方法。我们告知批准者我们的进度，听取他们的意见，整合他们的反馈，然后将设计文档发给批准者进行审批。一旦设计文档通过批准，设计阶段结束。技术团队开始根据设计文档中的规范构建产品或服务，进入构建阶段。


    ## 设计阶段：结语


    设计阶段产生一个可以构建和测试并符合最终用户预期的设计。价值是在设计研讨会上与最终用户共同。业务分析师专长阐述和记录设计、需求、报告和其他元素。我们的目标是从项目管理的角度出发，产生一个准确反映最终用户和赞助者预期的设计。项目经理安排一系列设计研讨会，并邀请不同的团队成员完成各种设计，如详细的应用设计、集成设计和低级基础设施设计。存在一个潜在的高影响风险，由于其他优先事项，并非所有要求的
    SME 都能参加计划中的研讨会。因此，可以通过安排额外的研讨会来缓解代表性缺失。一旦记录了设计，就会将其发给 SME 收集反馈。反馈将用于更新设计文档并分发进行审批。


    ### 微学习


    关键工作在设计阶段完成，且在改进设计方面已有许多进展。在在线搜索之前，请查看第 7 章中“技术分析”部分中的微学习活动，因为它们可能与设计阶段的活动有关。在网上搜索：


    > • 系统分析和设计的步骤有哪些？


    > • ITIL 是如何工作的？


    > • ITIL 3 服务设计是如何工作的？


    > • 什么是服务目录管理？容量管理？可用性管理？服务连续性管理？等等。


    > • ITIL 4 业务分析实践是如何工作的？


    > • 什么是设计思维？


    > • 什么是业务流程设计？


    > • 什么是设计研讨会程程？


    > • 我们如何记录设计？


    > • “ITIL 服务设计模板”


    ## 第 10 章


    ### 构建阶段


    构建阶段的重点是遵循设计文档中的需求并构建产品或服务。构建是一项技术工作，除了根据进度跟踪和控制进度外，它通常要求项目经理提供少量的概述。ITIL 服务价值系统指导构建阶段，项目团队作为一个系统协作，为用户构建服务（Limited,
    AXELOS 2019, 17–18）。某些组织会在“竣工”文档中记录构建情况。一旦产品或服务构建完成，并且满足了构建阶段的关口标准，项目将进入测试阶段。


    ### 微学习


    以下是一些增强你对构建阶段理解的练习：


    > • 竣工文档是如何运作的？


    > • 竣工文档的最佳实践是什么？


    > • 搜索“构建阶段模板”。


    ## 第 11 章


    ### 测试阶段


    现在产品或服务已经构建完成，我们移动到测试阶段并计划测试（图 6.2）。测试是一项质量控制活动：发现并修复缺陷。我们很幸运拥有来自质量、服务和项目管理专业的持续且广泛的指导来应用于测试活动。（NIST
    网络安全框架侧重于运营，网络安全项目期间的测试未直接涉及。）例如，ISO 9001:2000 质量管理标准指导用户如何交付产品和服务：“在产品实现过程中，组织应确定以下内容：……
    c) 针对产品的所需的验证、确认、监控、检查和测试活动……”（ISO2000，30）。我们被指导要测试并让利益相关者参与验证我们交付的价值。测试对于质量管理至关重要，也是
    Shields Up 的成功因素。


    项目期间的测试在 ITIL 服务价值系统的通用管理实践——测试中有（Limited, AXELOS 2019, 24）。Shields Up 与 ITIL
    的交付方法对齐，包含了构建、测试和交付（T2P）阶段（图 6.2，项目交付方法——项目阶段）。然而，如果你有剩余容量，可以在项目的更早阶段开始开发测试策略计划。再次，可以使用模板或之前的测试策略和计划作为起点。


    测试是项目管理不可或缺的一部分；例如，测试是 PMBOK® 指南的一部分。“在规划阶段，项目经理和团队确定如何测试或检查产品、交付物或服务，以满足利益相关者的需求和预期……”（PMI2017a，285）。PMI
    标准将测试定义为项目生命周期中的一个阶段：“测试。在转换、上线或客户接受之前，对交付物进行最后的质量审查和检查”（PMI2021，105）。因此，测试是嵌入质量管理、服务管理和项目管理标准中的关键质量控制活动，也是
    Shields Up 混合项目管理方法的核心组件。在某些项目中，我们可以从规划阶段就开始开发测试策略和计划，并一直持续到测试阶段。


    #### 测试策略


    通过开发测试策略和测试计划开始测试规划。测试策略可以包含一个测试流程图（图 11.1），以说明流程和参与者。


    '
