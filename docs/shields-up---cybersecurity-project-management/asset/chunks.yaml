    # NIST Cybersecurity Framework Core Example


    The National Institute of Standards and Technology (`NIST`) Framework for Improving
    Critical Infrastructure Cybersecurity is a leading global cybersecurity framework.
    Therefore, all IT professionals, including cybersecurity professionals, should
    be aware of the `NIST` Framework since everyone has a role in cybersecurity. The
    `NIST` standard is arranged according to functions, categories, subcategories,
    and references ([Table A1.1](#); National Institute of Standards and Technology
    2018, 50).


    The `NIST` Framework helps organizations audit their cybersecurity capabilities,
    identify gaps, and set targets for improvements (more projects). Leading a cybersecurity
    audit or broader technology audit are good development projects as they are nontechnical
    and provide an overview of systems and services.


    ## Table A1.1 NIST cybersecurity framework core example


    | Function | Category | Subcategory | References |

    | --- | --- | --- | --- |

    | `Recover` | | `Recovery Planning (RC.RP)`: Recovery processes and procedures
    are executed and maintained to ensure restoration of systems or assets affected
    by cybersecurity incidents | `RC.RP-1`: Recovery plan is executed during or after
    a cybersecurity incident | `CIS CSC 10`, `COBIT 5 APO12.06`, `DSS02.05`, `DSS03.04`,
    `ISO/IEC 27001:2013 A.16.1.5`, `NIST SP 800-53 Rev. 4`, `CP-10`, `IR-4`, `IR-8`
    |

    | | `Improvements (RC.IM)`: Recovery planning and processes are improved by incorporating
    lessons learned into future activities | `RC.IM-1`: Recovery plans incorporate
    lessons learned | `COBIT 5 APO12.06`, `BAI05.07`, `DSS04.08`, `ISA 62443-2-1:2009
    4.4.3.4`, `ISO/IEC 27001:2013 A.16.1.6`, Clause 10`, `NIST SP 800-53 Rev. 4 CP-2`,
    `IR-4`, `IR-8` |

    | | | `RC.IM-2`: Recovery strategies are updated | `COBIT 5 APO12.06`, `BAI07.08`,
    `ISO/IEC 27001:2013 A.16.1.6`, Clause 10`, `NIST SP 800-53 Rev. 4 CP-2`, `IR-4`,
    `IR-8` |

    | | `Communications (RC.CO)`: Restoration activities are coordinated with internal
    and external parties (e.g., coordinating centers, Internet Service Providers,
    owners of attacking systems, victims, other CSIRTs, and vendors) | `RC.CO-1`:
    Public relations are managed | `COBIT 5 EDM03.02`, `ISO/IEC 27001:2013 A.6.1.4`,
    Clause 7.4 |

    | | | `RC.CO-2`: Reputation is repaired after an incident | `COBIT 5 MEA03.02`,
    `ISO/IEC 27001:2013 Clause 7.4` |

    | | | `RC.CO-3`: Recovery activities are communicated to internal and external
    stakeholders as well as executive and management teams | `COBIT 5 APO12.06`, `ISO/IEC
    27001:2013 Clause 7.4`, `NIST SP 800-53 Rev. 4 CP-2`, `IR-4` |


    ## APPENDIX 2


    ## Project Management Gizmo


    The `Project Management Gizmo` is a research-based tool to assess a project to
    understand the project’s complexity ([Table A2.1](#)) and the effort required
    (Table A2.2) to deliver the project successfully (Skulmoski 2008, 1). One can
    use the `Gizmo` to systematically assess a project to improve their front-end
    understanding to develop better project plans.


    The `Gizmo` becomes even more valuable when project stakeholders independently
    assess the project and compare their results. When used in a group setting, the
    `Gizmo` will help identify areas of alignment and misalignment. For example, the
    project manager might assess the type of work and give the effort to implement
    the technology a low score. In contrast, the implementing consultants give the
    effort to implement a higher score. The two then discuss why the scores are different
    and come to a consensus. Without the `Gizmo`, the project manager might underestimate
    the effort to implement the technology resulting in a schedule with insufficient
    time.


    Using the `Gizmo` improves the teams’ understanding of the project and aligns
    the team, resulting in better project plans. The `Gizmo` guides the team to analyze
    the project systematically and helps the team shift the information curve. For
    example, the team may identify risks related to effort. Shifting the information
    curve with the `Gizmo` can improve value.


    ## Table A2.1 Gizmo complexity


    | Complexity attributes | Simple | Rating |

    | --- | --- | --- |

    | `1. Constraints` | Things that get in the way of carrying out project tasks
    | |

    | `1.1. Human resources` | The people may not have the skills and/or be unavailable
    when needed | |

    | `1.2. Time/schedule` | The amount of time may or may not be enough to complete
    the project based on the approved durations | |

    | `1.3. Budget/financing` | There may or may not be enough resources to complete
    the approved scope of the work | |

    | `2. Relative size` | Projects become more complex as size increases; however,
    size is relative to the experience and capabilities of the organization | |

    | `3. Project criticality` | The degree the project affects the viability and
    operational future of the organizations involved | |

    | `3.1. Importance` | How significant the project is to an organization’s strategy
    | |

    | `3.2. Priority` | The project’s preference when another “competing” project
    is presented for managerial decision and action | |

    | `3.3. Impact` | Failure results in no long-term impacts |

    | `4. Uncertainty and risk` | Risks and possible outcomes | |

    | `5. Organizational environment` | Project management friendly and mature | |

    | `5.1. Culture` | Homogeneous and peaceful | |

    | `5.2. Governance` | Simple, clear lines of responsibility | |

    | `6. Business environment` | Project friendly | |

    | `6.1. Governance` | Fair, open, predictable | |

    | `6.2. Economy` | Stable, healthy | |

    | `6.3. Language` | Homogeneous | |

    | `6.4. Political climate` | Fair, open, predictable | |


    ## Complexity attribute description


    | Description |

    | --- | --- |

    | `1. Constraints` | Things that get in the way of carrying out project tasks
    |

    | `1.1. Human resources` | The people may not have the skills and/or be unavailable
