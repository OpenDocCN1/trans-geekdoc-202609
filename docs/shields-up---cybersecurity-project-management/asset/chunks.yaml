  trans: '


    * 如何创建甘特图？

    * 如何创建项目网络图？

    * 如何创建项目预算？

    * 如何创建 RACI 矩阵？

    * 如何管理版本控制？

    * 如何销售任何东西？

    * 如何讲述一个好故事？

    * 如何进行设计和布局？


    由于项目计划的基线制定需要获得团队的信任，你可能将项目生命周期中的任何审批过程视为一次推销活动。因此，我们增加了“如何销售任何东西”和“讲故事”，因为它们是帮助你获得批准继续执行的强大技术。设计和布局考量、图形以及其他创意考虑将使你的项目计划看起来非常专业。你在整个职业生涯中可能都会使用销售、故事、布局和设计技能。


    虽然 `Shields Up` 更加侧重于战略，但我们也包含了一些知名度不高但有效的项目管理工具和方法。这些工具帮助我们移动信息曲线，以便在变更困难且成本昂贵时，尽早地了解更多关于项目的信息。


    ## 优先级三角形 (Priority Triangle)


    项目对齐是项目经理努力实现的一个早期目标，因为它有助于转变项目团队的信息曲线。不一致会增加风险和问题，如范围蔓延、延迟和成本超支。然而，当项目团队对齐时，团队可能变得精简，项目成功的可能性也更大。我们看到
    `Project Feasibility Gizmo` 有助于移动信息曲线；`Gizmo` 也能对齐项目团队。`Priority Triangle` (Skulmoski
    and Hartman 2000, 33–37) 是另一种有助于团队对齐和降低风险的项目管理工具。


    `Priority Triangle` (图 8.2) 改编自 Martin Barnes 经典的铁三角，也称为三重约束理论（Kerzner 2013, 869）。项目团队受到范围、时间、成本和质量的约束；其中一个约束的改变都会影响其他。例如，如果客户要求增加范围，我们可能会因为交付增加范围所需的额外工作而面临成本增加和进度超支。


    ![](img/00019.jpg)


    图 8.2 优先级三角形与对齐


    在实践中，我们可以使用三重约束理论来帮助识别项目优先级。我们首先开始绘制 `Priority Triangle` (Skulmoski and Hartman
    2000, 35)。时间显示在 `Priority Triangle` 的左侧，因为我们希望缩短项目持续时间。成本位于 `Priority Triangle`
    的底部，因为我们试图最小化成本。最后，质量和范围位于右侧，因为我们希望优化范围和质量。我们努力最小化交付时间；因此，时间在 `Priority Triangle`
    的左侧（早于晚）。我们希望价值最大化；因此，质量和范围在 `Priority Triangle` 的右侧。然而，如果我们要求项目赞助人确定优先级，赞助人可能会选择所有约束为优先级。因此，我们在中间增加了一个
    `No-Go zone`（禁止区），以强制项目利益相关者识别出两个核心的项目优先级。


    让我们来看看 `Priority Triangle` 的应用。我们的项目是向制造过程中添加协作机器人。我们的 IT 自动化项目有三个主要的利益相关者：市场部、工程部和财务部
    (图 8.2)。我们解释了这项练习，市场部在三角形中放置 `X` 表示按时交付是项目优先级，质量和范围是次要优先级。他们的理由是市场部希望开始销售项目将生产的产品。他们还追求高质量，因为高质量的产品更容易销售。工程部优先考虑的是质量，因为高质量的组件更容易维护，且故障频率较低。财务部优先考虑按预算完成，其次是按计划完成。财务部负责实现资源利用最大化，因此支持按照批准的预算完成任务。他们还希望按时完成，以便在协作机器人自动化运行后产生收入。


    你可以看到，三个利益相关者在项目优先级上是不一致的 (图 8.2)。我们通过使用 `Priority Triangle` 从项目赞助人处获得项目优先级方向来实现对齐。在这种情况下，让我们假设按时完成并具有正确的质量/范围是赞助人的两个项目优先级。项目经理在预算方面具有活性来交付另外两个优先级。


    '
