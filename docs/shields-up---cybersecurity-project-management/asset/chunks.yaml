    [APPENDIX 4](#index_split_004.html#filepos8850)


    [Career Planning](#index_split_004.html#filepos8850)


    Quality improvement is central in our frameworks and an integral component for
    continued success. Achieving quality improvement is more likely with a holistic
    approach: look for improvement opportunities throughout the Service Management
    System to optimize the value streams for our users (Limited, AXELOS 2019, 83–86).
    When one takes a holistic approach, the people involved in producing value can
    also benefit from assessing and developing their competencies. The cybersecurity
    professional can take a structured approach to improve their capabilities with
    career planning.


    It takes three to five years to become “proficient” in a cybersecurity role (Oltsik
    2020, 6). The cybersecurity professional will likely develop and maintain technical
    competence in areas immediately related to their role. While technical proficiency
    is being established, the cybersecurity professional can begin to plan holistically
    and develop their competencies. The cybersecurity professional can take a structured
    approach to improve their capabilities with career planning.


    ### Sustainable Project-Oriented Career


    We found that career sustainability depends on two contributors: networking and
    upkilling (Skulmoski et al. 2020, 76). Networking with other professionals helps
    find new opportunities. Staying connected opens opportunities. Upskilling or expanding
    one’s competencies is another sustainability driver.


    The technology and cybersecurity skills gap problem has been well studied since
    it is a perennial and perhaps a wicked problem. Cybersecurity professionals are
    fortunate that there are many pathways to remain competent such as pursuing technical
    certifications in technical platforms such as `Azure` or in a cybersecurity framework
    such as `CISSP`.


    ### Planning the T-Career


    One can envision career development over time if we look to the career progression
    of our IT colleagues. One develops skills into skill sets that can be illustrated
    as a shape across a maturity and capability spectrum ([Figure A4.1](#index_split_030.html#filepos435178),
    after Demirkan and Spohrer 2015, 13). The basic depiction of a T-shape professional
    has been modified in Shields Up, where the horizontal part of the T represents
    business skills and the vertical part represents technical skills. The new university
    cybersecurity graduate has a technical foundation required to join an IT department
    and joins with an I-shape skill set.

