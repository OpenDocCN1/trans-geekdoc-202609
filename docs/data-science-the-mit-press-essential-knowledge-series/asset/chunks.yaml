  trans: '


    - 基于 Edgar F. Codd 关系型数据模型的数据库管理系统。关系型数据库将数据存储在表集中，每个表每行对应一个实例，每列对应一个属性。通过在多个表中出现键属性来创建表与之间的链接。这种结构适用于
    SQL 查询，SQL 定义了对表中数据进行的操作。


    ### 智能城市

    - 智能城市项目通常尝试将来自许多不同数据源的实时数据集成到单一数据枢纽中，并在分析后用于城市管理和规划决策。


    ### 结构化数据

    - 可以存储在表中的数据。表中的每个实例具有相同的属性集。与`非结构化数据`相对。


    ### 结构化查询语言 (SQL)

    - 定义数据库查询的国际标准。


    ### 监督学习

    - 机器学习的一种形式，其目标是学习一个函数，将实例的一组输入属性值映射到该实例目标属性缺失值的估计值。


    ### 目标属性

    - 在预测任务中，预测模型被训练用于估计其数值的属性。


    ### 事务数据

    - 事件信息，例如商品销售、发票开、货物交付、信用卡支付等。


    ### 非结构化数据

    - 一类数据，数据集中的每个实例可能有其自己的内部结构；也就是说，结构在每个实例中并不一定相同。例如，文本数据通常是非结构化的，需要对其应用一系列操作，以便为每个实例提取出结构化的表示。


    ### 无监督学习

    - 机器学习的一种形式，其目标是识别数据中的规律。这些规律可能包括数据中相似实例的聚类，或属性之间的规律。与`监督学习`相比，在无监督学习中数据集中没有定义目标属性。


    # 延伸阅读


    ## 关于数据与大数据

    1. Davenport, Thomas H. *Big Data at Work: Dispelling the Myths, Uncovering the
    Opportunities*. Cambridge, MA: Harvard Business Review, 2014.

    2. Harkness, Timandra. *Big Data: Does Size Matter?* New York: Bloomsbury Sigma,
    2016.

    3. Kitchin, Rob. *The Data Revolution: Big Data, Open Data, Data Infrastructures,
    and Their Consequences*. Los Angeles: Sage, 2014.

    4. Mayer-Schönberger, Viktor, and Kenneth Cukier. *Big Data: A Revolution That
    Will Transform How We Live, Work, and Think*. Boston: Eamon Dolan/Mariner Books,
    2014.

    5. Pomerantz, Jeffrey. *Metadata*. Cambridge, MA: MIT Press, 2015.

    6. Rudder, Christian. *Dataclysm: Who We Are (When we Think No One’s Looking)*.
    New York: Broadway Books, 2014.


    ## 关于数据科学、数据挖掘与机器学习

    1. Kelleher, John D., Brian Mac Namee, and Aoife D’Arcy. *Fundamentals of Machine
    Learning for Predictive Data Analytics*. Cambridge, MA: MIT Press, 2015.

    2. Linoff, Gordon S., and Michael J. A. Berry. *Data Mining Techniques: For Marketing,
    Sales, and Customer Relationship Management*. Indianapolis, IN: Wiley, 2011.

    3. Provost, Foster, and Tom Fawcett. *Data Science for Business: What You Need
    to Know about Data Mining and Data-Analytic Thinking*. Sebastopol, CA: O’Reilly
    Media, 2013.


    ## 关于隐私、伦理与广告

    1. Dwork, Cynthia, and Aaron Roth. 2014. “The Algorithmic Foundations of Differential
    Privacy.” *Foundations and Trends® in Theoretical Computer Science* 9 (3–4): 211–407.

    2. Nissenbaum, Helen. *Privacy in Context: Technology, Policy, and the Integrity
    of Social Life*. Stanford, CA: Stanford Law Books, 2009.

    3. Solove, Daniel J. *Nothing to Hide: The False Tradeoff between Privacy and
    Security*. New Haven, CT: Yale University Press, 2013.

    4. Turow, Joseph. *The Daily You: How the New Advertising Industry Is Defining
    Your Identity and Your Worth*. New Haven, CT: Yale University Press, 2013.


    # 参考文献

    1. Anderson, Chris. 2008. *The Long Tail: Why the Future of Business Is Selling
    Less of More*. Rev. ed. New York: Hachette Books.

    2. Baldridge, Jason. 2015. “Machine Learning and Human Bias: An Uneasy Pair.”
    *TechCrunch*, August 2. [`social.techcrunch.com/2015/08/02/machine-learning-and-human-bias-an-uneasy-pair`](http://social.techcrunch.com/2015/08/02/machine-learning-and-human-bias-an-uneasy-pair).

    3. Barry-Jester, Anna Maria, Ben Casselman, and Dana Goldstein. 2015. “Should
    Prison Sentences Be Based on Crimes That Haven’t Been Committed Yet?” *FiveThirtyEight*,
    August 4. [`fivethirtyeight.com/`](https://fivethirtyeight.com/).

    ...（后续重复参考文献已省略）

