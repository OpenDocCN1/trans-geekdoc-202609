- raw: "    As in the previous networks we have looked at, the one shown in [figure\
    \ 15](#c11140_004.xhtml#fig_015) is a fully connected, feed-forward network. However,\
    \ not all networks are fully connected, feed-forward networks. In fact, myriad\
    \ network topologies have been developed. For example, *recurrent neural networks*\
    \ (RNNs) introduce loops in the network topology: the output of a neuron for one\
    \ input is fed back into the neuron during the processing of the next input. This\
    \ loop gives the network a memory that enables it to process each input in the\
    \ context of the previous inputs it has processed. As a consequence, RNNs are\
    \ suitable for processing sequential data such as language.[⁹](#c11140_004.xhtml#FN19)\
    \ Another well-known deep neural network architecture is a *convolutional neural\
    \ network* (CNN). CNNs were originally designed for use with image data (Le Cun\
    \ 1989). A desirable characteristic of an image-recognition network is that it\
    \ should be able to recognize if a visual feature has occurred in an image irrespective\
    \ of where in the image it has occurred. For example, if a network is doing face\
    \ recognition, it needs to be able to recognize the shape of an eye whether the\
    \ eye is in the top-right corner of the image or in the center of the image. CNNs\
    \ achieve this by having groups of neurons that share the same set of weights\
    \ on their inputs. In this context, think of a set of input weights as defining\
    \ a function that returns true if a particular visual feature occurs in the set\
    \ of pixels that are passed into the function. This means that each group of neurons\
    \ that share their weights learns to identify a particular visual feature, and\
    \ each neuron in the group acts as a detector for that feature. In a CNN, the\
    \ neurons within each group are arranged so that each neuron examines a different\
    \ location in the image, and the group covers the entire image. As a consequence,\
    \ if the visual feature the group detects occurs anywhere in the image, one of\
    \ the neurons in the group will identify it.\n\n    The power of deep neural networks\
    \ comes from the fact that they can automatically learn useful attributes, such\
    \ as the feature detectors in CNNs. In fact, deep learning is sometimes known\
    \ as *representation learning* because these deep networks are essentially learning\
    \ a new representation of the input data that is better at predicting the target\
    \ output attribute than the original raw input is. Each neuron in a network defines\
    \ a function that maps the values coming into the neuron into a new output attribute.\
    \ So a neuron in the first layer of a network might learn a function that maps\
    \ the raw input values (such as weight and height) into an attribute that is more\
    \ useful than individual input values (such as BMI). However, the output of this\
    \ neuron, along with the outputs of its sister neurons in the first layer, is\
    \ then fed into the neurons in the second layer, and these second-layer neurons\
    \ try to learn functions that map the outputs of the first layer into new and\
    \ yet more useful representations. This process of mapping inputs to new attributes\
    \ and feeding these new attributes as inputs to new functions continues throughout\
    \ the network, and as a network gets deeper, it can learn more and more complex\
    \ mappings from raw inputs to new attribute representations. It is the ability\
    \ to automatically learn complex mappings of input data to useful attribute representations\
    \ that has made deep-learning models so accurate in tasks with high-dimensional\
    \ inputs (such as image and text processing).\n\n    It has been known for a long\
    \ time that making neural networks deeper allows the network to learn more complex\
    \ mappings of data. The reason that deep learning has not really taken off until\
    \ the past few years, however, is that the standard combination of using a random-weight\
    \ initialization followed by the backpropagation algorithm doesn’t work well with\
    \ deep networks. One problem with the backpropagation algorithm is that the error\
    \ gets shared out as the process goes back through the layers, so that in a deep\
    \ network by the time the algorithm reaches the early layers of the network, the\
    \ error estimates are not that useful anymore.[^(10)](#c11140_004.xhtml#FN20)\
    \ As a result, the layers in the early parts of the network don’t learn useful\
    \ transformations for the data. In the past few years, however, researchers have\
    \ developed new types of neurons and adaptations to the backpropagation algorithm\
    \ that deal with this problem. It has also been found that being careful with\
    \ how the network weights are initialized is also helpful. Two other factors that\
    \ formerly made training deep networks difficult were that it takes a great deal\
    \ of computing power to train a neural network, and neural networks work best\
    \ when there is a great deal of training data. However, as we have already discussed,\
    \ in recent years significant increases in the availability of computing power\
    \ and large data sets have made the training of deep networks more feasible.\n\
    \n    ### Decision Trees\n\n    Linear regression and neural networks work best\
    \ with numeric inputs. If the input attributes in a data set are primarily nominal\
    \ or ordinal, however, then other ML algorithms and models, such as *decision\
    \ trees*, may be more appropriate.\n\n    A decision tree encodes a set of *if\
    \ then, else* rules in a tree structure. [Figure 16](#c11140_004.xhtml#fig_016)\
    \ illustrates a decision tree for deciding whether an email is spam or not. Rectangles\
    \ with rounded corners represent tests on attributes, and the square nodes indicate\
    \ decision, or classification, nodes. This tree encodes the following rules: *if\
    \ the email is from an unknown sender, then it is spam; if it isn’t from an unknown\
    \ sender but contains suspicious words, then it is spam; if it is neither from\
    \ an unknown sender nor contains suspicious words, then it is not spam*. In a\
    \ decision tree, the decision for an instance is made by starting at the top of\
    \ the tree and navigating down through the tree by applying a sequence of attribute\
    \ tests to the instance. Each node in the tree specifies one attribute to test,\
    \ and the process descends the tree node by node by choosing the branch from the\
    \ current node with the label matching the value of the test attribute of the\
    \ instance. The final decision is the label of the terminating (or *leaf*) node\
    \ that the instance descends to.\n\n    ![Figure 16 A decision tree for determining\
    \ whether an email is spam or not.](images/11140_004_fig_016.jpg)\n\n    [Figure\
    \ 16](#c11140_004.xhtml#fig_016a) A decision tree for determining whether an email\
    \ is spam or not.\n\n    Each path in a decision tree, from root to leaf, defines\
    \ a classification rule composed of a sequence of tests. The goal of a decision-tree-learning\
    \ algorithm is to find a set of classification rules that divide the training\
    \ data set into sets of instances that have the same value for the target attribute.\
    \ The idea is that if a classification rule can separate out from a data set a\
    \ subset of instances that have the same target value, and if this classification\
    \ rule is true for a new example (i.e., the example goes down that path in the\
    \ tree), then it is likely that the correct prediction for this new example is\
    \ the target value shared by all the training instances that fit this rule."
  fmt: '

    As in the previous networks we have looked at, the one shown in [figure 15](#c11140_004.xhtml#fig_015)
    is a fully connected, feed-forward network. However, not all networks are fully
    connected, feed-forward networks. In fact, myriad network topologies have been
    developed. For example, `recurrent neural networks` (RNNs) introduce loops in
    the network topology: the output of a neuron for one input is fed back into the
    neuron during the processing of the next input. This loop gives the network a
    memory that enables it to process each input in the context of the previous inputs
    it has processed. As a consequence, RNNs are suitable for processing sequential
    data such as language.[⁹](#c11140_004.xhtml#FN19) Another well-known deep neural
    network architecture is a `convolutional neural network` (CNN). CNNs were originally
    designed for use with image data (Le Cun 1989). A desirable characteristic of
    an image-recognition network is that it should be able to recognize if a visual
    feature has occurred in an image irrespective of where in the image it has occurred.
    For example, if a network is doing face recognition, it needs to be able to recognize
    the shape of an eye whether the eye is in the top-right corner of the image or
    in the center of the image. CNNs achieve this by having groups of neurons that
    share the same set of weights on their inputs. In this context, think of a set
    of input weights as defining a function that returns true if a particular visual
    feature occurs in the set of pixels that are passed into the function. This means
    that each group of neurons that share their weights learns to identify a particular
    visual feature, and each neuron in the group acts as a detector for that feature.
    In a CNN, the neurons within each group are arranged so that each neuron examines
    a different location in the image, and the group covers the entire image. As a
    consequence, if the visual feature the group detects occurs anywhere in the image,
    one of the neurons in the group will identify it.


    The power of deep neural networks comes from the fact that they can automatically
    learn useful attributes, such as the feature detectors in CNNs. In fact, deep
    learning is sometimes known as `representation learning` because these deep networks
    are essentially learning a new representation of the input data that is better
    at predicting the target output attribute than the original raw input is. Each
    neuron in a network defines a function that maps the values coming into the neuron
    into a new output attribute. So a neuron in the first layer of a network might
    learn a function that maps the raw input values (such as weight and height) into
    an attribute that is more useful than individual input values (such as BMI). However,
    the output of this neuron, along with the outputs of its sister neurons in the
    first layer, is then fed into the neurons in the second layer, and these second-layer
    neurons try to learn functions that map the outputs of the first layer into new
    and yet more useful representations. This process of mapping inputs to new attributes
    and feeding these new attributes as inputs to new functions continues throughout
    the network, and as a network gets deeper, it can learn more and more complex
    mappings from raw inputs to new attribute representations. It is the ability to
    automatically learn complex mappings of input data to useful attribute representations
    that has made deep-learning models so accurate in tasks with high-dimensional
    inputs (such as image and text processing).


    It has been known for a long time that making neural networks deeper allows the
    network to learn more complex mappings of data. The reason that deep learning
    has not really taken off until the past few years, however, is that the standard
    combination of using a random-weight initialization followed by the backpropagation
    algorithm doesn’t work well with deep networks. One problem with the backpropagation
    algorithm is that the error gets shared out as the process goes back through the
    layers, so that in a deep network by the time the algorithm reaches the early
    layers of the network, the error estimates are not that useful anymore.[10)](#c11140_004.xhtml#FN20)
    As a result, the layers in the early parts of the network don’t learn useful transformations
    for the data. In the past few years, however, researchers have developed new types
    of neurons and adaptations to the backpropagation algorithm that deal with this
    problem. It has also been found that being careful with how the network weights
    are initialized is also helpful. Two other factors that formerly made training
    deep networks difficult were that it takes a great deal of computing power to
    train a neural network, and neural networks work best when there is a great deal
    of training data. However, as we have already discussed, in recent years significant
    increases in the availability of computing power and large data sets have made
    the training of deep networks more feasible.


    ### Decision Trees


    Linear regression and neural networks work best with numeric inputs. If the input
    attributes in a data set are primarily nominal or ordinal, however, then other
    ML algorithms and models, such as `decision trees`, may be more appropriate.


    A decision tree encodes a set of `if then, else` rules in a tree structure. [Figure
    16](#c11140_004.xhtml#fig_016) illustrates a decision tree for deciding whether
    an email is spam or not. Rectangles with rounded corners represent tests on attributes,
    and the square nodes indicate decision, or classification, nodes. This tree encodes
    the following rules: `if the email is from an unknown sender, then it is spam;
    if it isn’t from an unknown sender but contains suspicious words, then it is spam;
    if it is neither from an unknown sender nor contains suspicious words, then it
    is not spam`. In a decision tree, the decision for an instance is made by starting
    at the top of the tree and navigating down through the tree by applying a sequence
    of attribute tests to the instance. Each node in the tree specifies one attribute
    to test, and the process descends the tree node by node by choosing the branch
    from the current node with the label matching the value of the test attribute
    of the instance. The final decision is the label of the terminating (or `leaf`)
    node that the instance descends to.


    ![Figure 16 A decision tree for determining whether an email is spam or not.](images/11140_004_fig_016.jpg)


    [Figure 16](#c11140_004.xhtml#fig_016a) A decision tree for determining whether
    an email is spam or not.


    Each path in a decision tree, from root to leaf, defines a classification rule
    composed of a sequence of tests. The goal of a decision-tree-learning algorithm
    is to find a set of classification rules that divide the training data set into
    sets of instances that have the same value for the target attribute. The idea
    is that if a classification rule can separate out from a data set a subset of
    instances that have the same target value, and if this classification rule is
    true for a new example (i.e., the example goes down that path in the tree), then
    it is likely that the correct prediction for this new example is the target value
    shared by all the training instances that fit this rule.

