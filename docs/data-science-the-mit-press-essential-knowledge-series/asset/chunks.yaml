    在回归分析中，回归函数的参数最初是未知的。设置回归函数的参数等同于寻找最拟合数据的直线。设置这些参数的策略从猜测参数值开始，然后通过迭代更新参数，以减小函数在数据集上的总误差。总误差的计算分为三个步骤：


    1.  将函数应用于数据集，并对于数据集中的每个实例，它会估计目标属性的值。

    2.  通过从目标属性的实际值减去目标属性的估计值，计算出函数对每个实例的误差。

    3.  对每个实例的函数误差进行平方，然后对这些平方值求和。


    在第 3 步中，对每个实例的函数误差进行平方，是为了防止函数高估目标时的误差与低估目标时的误差相互抵消。将误差平方使得误差在两种情况下都变为正值。这种误差衡量方法被称为`误差平方和`
    (SSE)，而通过寻找最小化 SSE 的参数来拟合线性函数的策略被称为`最小二乘法`。SSE 定义为


    ![11140_e004_002.jpg](img/11140_e004_002.jpg)


    其中数据集包含 `n` 个实例，`target[i]` 是数据集中实例 `i` 的目标属性值，`prediction[i]` 是函数对同一实例的目标估计值。


    为了创建一个线性回归预测模型，以估计个人根据其 BMI 糖尿病的概率，我们将 `X` 替换为 BMI 属性，将 `Y` 替换为糖尿病属性，并应用最小二乘算法为糖尿病数据集寻找最佳拟合线。图
    11a 展示了这条最佳拟合线以及它相对于数据集中实例的位置。在图 11b 中，虚线显示了该线对每个实例的误差（或残差）。使用最小二乘法，最佳拟合线是使残差平方和最小的直线。该直线的方程为


    ![11140_e004_003.jpg](img/11140_e004_003.jpg).


    ![图 11 (a) 模型“Diabetes = −7.38431 + 0.55593 BMI.”的最佳拟合回归线。(b) 垂直虚线说明了每个实例的残差。](img/11140_004_fig_011.jpg)


    图 11 (*a*) 模型“Diabetes = −7.38431 + 0.55593 BMI.”的最佳拟合回归线。(*b*) 垂直虚线说明了每个实例的残差。


    斜率参数值 `ω[1]` = 0.55593 表示，BMI 每增加一个单位，模型估计个人患糖尿病的概率就会增加略多于百分之半。为了预测患糖尿病的概率，我们只需将他的
    BMI 输入模型中。例如，当 BMI 等于 20 时，模型返回糖尿病属性的预测概率为 3.73%；当 BMI 等于 21 时，模型预测概率为 4.29%。⁴


    在底层，使用最小二乘法拟合的线性回归模型实际上是在计算一个加权平均值。事实上，截距参数值 `ω[0]` = −7.38431 确保了拟合线通过由平均 BMI
    值和平均糖尿病定义的点。如果输入数据中的平均 BMI 值（即 24.0932），模型预测糖尿病概率为 4.29%。


    对实例的权重基于实例到直线的距离：实例距离直线越远，该实例的残差越大，算法对该实例的权重就越高。这种权重的一个后果是极端值（离群点）会对拟合过程产生不成比例的影响，导致直线被偏。因此，在使用最小二乘算法对数据集进行拟合（换句话说，在数据集上训练线性回归函数）之前，检查离群点是重要的。


    线性回归模型可以扩展为接受多个输入。每个新输入属性为模型添加一个参数，并更新模型方程以包含新属性与新参数的积。例如，为了将模型扩展到包含运动和体重属性作为输入，回归函数的结构变为


    ![11140_e004_004.jpg](img/11140_e004_004.jpg).


    在统计学中，这种从多个输入映射到单个输出的回归函数被称为`多元线性回归函数`。多输入回归函数的结构是一系列机器学习算法的基础，包括神经网络。


    相关性和回归分析在概念上是相似的，因为它们都是关注数据集中列之间关系的技术。相关性侧重于探索两个属性之间是否存在关系，而回归侧重于对属性之间的假设关系进行建模，以便根据一个或多个属性的值估计目标属性的值。


    ### 神经网络与深度学习


    `神经网络`由一组连接的神经元组成。神经元接收一组数值作为输入并将其映射到单个输出值。从本质上看，神经元只是多输入线性回归函数。两者唯一的显著区别在于，在神经元中，多输入线性回归函数的输出会通过另一个被称为`激活函数`的函数。

    '
