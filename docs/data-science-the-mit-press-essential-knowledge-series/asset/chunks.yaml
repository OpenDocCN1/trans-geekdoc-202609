- raw: "    These activation functions apply a nonlinear mapping to the output of\
    \ the multi-input linear-regression function. Two commonly used activation functions\
    \ are the *logistic function* and *tanh function* (see [figure 12](#c11140_004.xhtml#fig_012)).\
    \ Both functions take a single value *x* as input; in a neuron, this *x* value\
    \ is the output from the multi-input linear-regression function the neuron has\
    \ applied to its inputs. Also, both functions use Euler’s number *e*, which is\
    \ approximately equal to 2.71828182. These functions are sometimes called *squashing\
    \ functions* because they take any value between plus infinity and minus infinity\
    \ and map it into a small, predefined range. The output range of the logistic\
    \ function is 0 to 1, and the tanh function is −1 to 1. As a consequence, the\
    \ outputs of a neuron that uses a logistic function as its activation function\
    \ are always between 0 and 1. The fact that both the logistic and tanh functions\
    \ apply nonlinear mappings is clear in the S shape of the curves. The reason for\
    \ introducing a nonlinear mapping into a neuron is that one of the limitations\
    \ of a multi-input linear-regression function is that the function is by definition\
    \ linear, and if all the neurons within a network implement only linear mappings,\
    \ then the overall network is also limited to learning a linear functions. However,\
    \ introducing a nonlinear activation function in the neurons of a network allows\
    \ the network to learn more complex (nonlinear) functions.\n\n    ![Figure 12\
    \ Mapping the logistic and tanh functions as applied to the input x.](images/11140_004_fig_012.jpg)\n\
    \n    [Figure 12](#c11140_004.xhtml#fig_012a) Mapping the logistic and tanh functions\
    \ as applied to the input *x*.\n\n    It is worth emphasizing that each neuron\
    \ in a neural network is doing a very simple set of operations:\n\n    1.  Multiplying\
    \ each input by a weight.\n\n    2.  Adding together the results of the multiplications.\n\
    \n    3.  Pushing this result through an activation function.\n\n    Operations\
    \ 1 and 2 are just the calculation of a multi-input regression function over the\
    \ inputs, and operation 3 is the application of the activation function.\n\n \
    \   All the connections between the neurons in a neural network are directed and\
    \ have a weight associated with them. The weight on a connection coming into a\
    \ neuron is the weight that the neuron applies to the input it receives on that\
    \ connection when it is calculating the multi-input regression function over its\
    \ inputs. [Figure 13](#c11140_004.xhtml#fig_013) illustrates the topological structure\
    \ of a simple neural network. The squares on the left side of the figure, labeled\
    \ *A* and *B*, represent locations in memory that we use to present input data\
    \ to the network. No processing or transformation of data is carried out at these\
    \ locations. You can think of these nodes as input or sensing neurons, whose output\
    \ activation is set to the value of the input.[⁵](#c11140_004.xhtml#FN15) The\
    \ circles in [figure 13](#c11140_004.xhtml#fig_013) (labeled *C*, *D*, *E*, and\
    \ *F*) represent the neurons in the network. It is often useful to think of the\
    \ neurons in a network as organized into layers. This network has three layers\
    \ of neurons: the input layer contains *A* and *B*; one hidden layer contains\
    \ *C*, *D*, and *E*; and the output layer contains *F*. The term *hidden layer*\
    \ describes the fact that the neurons in a layer are in neither the input layer\
    \ nor the output layer, so in this sense they are hidden from view.\n\n    ![Figure\
    \ 13 A simple neural network.](images/11140_004_fig_013.jpg)\n\n    [Figure 13](#c11140_004.xhtml#fig_013a)\
    \ A simple neural network.\n\n    The arrows connecting the neurons in the network\
    \ represent the flow of information through the network. Technically, this particular\
    \ network is a feed-forward neural network because there are no loops in the network:\
    \ all the connections point forward from the input toward the output. Also, this\
    \ network is considered fully connected because each neuron is connected to all\
    \ the neurons in the next layer in the network. It is possible to create many\
    \ different types of neural networks by changing the number of layers, the number\
    \ of neurons in each layer, the type of activation functions used, the direction\
    \ of the connections between layers, and other parameters. In fact, much of the\
    \ work involved in developing a neural network for a particular task involves\
    \ experimenting to find the best network layout for that task.\n\n    The labels\
    \ on each arrow represent the weight that the node at the end of the arrow applies\
    \ to the information passed along that connection. For example, the arrow connecting\
    \ *C* with *F* indicates that the output from *C* is passed as an input to *F*,\
    \ and *F* will apply the weight *W[C,F]* to the input from *C*.\n\n    If we assume\
    \ that the neurons in the network in [figure 13](#c11140_004.xhtml#fig_013) use\
    \ a tanh activation function, then we can define the calculation carried out in\
    \ neuron *F* of the network as\n\n    ![11140\\_e004\\_005.jpg](images/11140_e004_005.jpg)\n\
    \n    The mathematical definition of the processing carried out in neuron *F*\
    \ shows that the final output of the network is calculated using a composition\
    \ of a set of functions. The phrase “composing functions” just means that the\
    \ output of one function is used as input to another function. In this case, the\
    \ outputs of neurons *C*, *D*, and *E* are used as inputs to neuron *F*, so the\
    \ function implemented by *F* composes the functions implemented by *C*, *D*,\
    \ and *E*.\n\n    [Figure 14](#c11140_004.xhtml#fig_014) makes this description\
    \ of neural networks more concrete, illustrating a neural network that takes a\
    \ person’s body-fat percentage and *VO*[2] max (a measure of the maximum amount\
    \ of oxygen that a person can use in a minute) as input and calculates a fitness\
    \ level for the that person.[⁶](#c11140_004.xhtml#FN16) Each neuron in the middle\
    \ layer of the network calculates a function based on the body-fat percentage\
    \ and *VO*[2] max: *f*[1](), *f*[2](), and *f*[3](). Each of these functions models\
    \ the interaction between the inputs in a different way. These functions essentially\
    \ represent new attributes that are derived from the raw inputs to the network.\
    \ They are similar to the BMI attribute described earlier, which was calculated\
    \ as a function of weight and height. Sometimes it is possible to interpret what\
    \ the output of a neuron in the network represents insofar as it is possible to\
    \ provide a domain-theoretic description of what the derived attribute represents\
    \ and to understand why this derived attribute is useful to the network. Often,\
    \ however, the derived attribute calculated by a neuron will not have a symbolic\
    \ meaning for humans. These attributes are instead capturing interactions between\
    \ the other attributes that the network has found to be useful. The final node\
    \ in the network, *f*[4], calculates another function—over the outputs of *f*[1](),\
    \ *f*[2](), and *f*[3]()—the output of which is the fitness prediction returned\
    \ by the network. Again, this function may not be meaningful to humans beyond\
    \ the fact that it defines an interaction the network has found to have a high\
    \ correlation with the target attribute.\n\n    ![Figure 14 A neural network that\
    \ predicts a person’s fitness level.](images/11140_004_fig_014.jpg)\n\n    [Figure\
    \ 14](#c11140_004.xhtml#fig_014a) A neural network that predicts a person’s fitness\
    \ level."
