- raw: "    Database vendors continuously invest in developing the scalability, performance,\
    \ security, and functionality of their databases. Modern databases are far more\
    \ advanced than traditional relational databases. They can store and query data\
    \ in variety of different formats. In addition to the traditional relational formats,\
    \ it is also possible to define object types, store documents, and store and query\
    \ JSON objects, spatial data, and so on. Most modern databases also come with\
    \ a large number of statistical functions, so that some have an equivalent number\
    \ of statistical functions as most statistical applications. For example, the\
    \ Oracle Database comes with more than 300 different statistical functions and\
    \ the SQL language built into it. These statistical functions cover the majority\
    \ of the statistical analyses needed by data science projects and include most\
    \ if not all the statistical functions available in other tools and languages,\
    \ such as R. Using the statistical functionality that is available in the databases\
    \ in an organization may allow data analytics to be performed in a more efficient\
    \ and scalable manner using SQL. Furthermore, most leading database vendors (including\
    \ Oracle, Microsoft, IBM, and EnterpriseDB) have integrated many ML algorithms\
    \ into their databases, and these algorithms can be run using SQL. ML that is\
    \ built into the database engine and is accessible using SQL is known as *in-database\
    \ machine learning*. In-database ML can lead to quicker development of models\
    \ and quicker deployment of models and results to applications and analytic dashboards.\
    \ The idea behind the in-database ML algorithms is captured in the following directive:\
    \ “*Move the algorithms to the data instead of the data to the algorithms*.”\n\
    \n    The main advantages of using the in-database ML algorithms are:\n\n    *\
    \   **No data movement**. Some data science products require the data to be exported\
    \ from the database and converted to a specialized format for input to the ML\
    \ algorithms. With in-database ML, no data movement or conversion is needed. This\
    \ makes the entire process less complex, less time-consuming, and less error prone.\n\
    \n    *   **Faster performance**. With analytical operations performed in the\
    \ database and with no data movement, it is possible to utilize the computing\
    \ capabilities of the database server, delivering performance up to 100 times\
    \ faster than the traditional approach. Most database servers have high specifications,\
    \ with many central processing units (CPUs) and efficient memory management to\
    \ process data sets containing more than one billion records.\n\n    *   **High\
    \ security**. The database provides controlled and auditable access to the data\
    \ in the database, accelerating the data scientist’s productivity while maintaining\
    \ data security. Also, in-database ML avoids the physical security risks inherent\
    \ in extracting and downloading data to alternative analytics servers. The traditional\
    \ process, in contrast, results in the creation of many copies (and potentially\
    \ different versions) of data sets in separate silos across the organization.\n\
    \n    *   **Scalability**. A database can easily scale the analytics as the data\
    \ volume increases if the ML algorithms are brought into the database. The database\
    \ software is designed to manage large volumes of data efficiently, utilizing\
    \ the multiple CPUs and memory on the server to allow the ML algorithms to run\
    \ in parallel. Databases are also very efficient at processing large data sets\
    \ that do not fit easily into memory. Databases have more than 40 years of development\
    \ work behind them to ensure that they can process datasets quickly.\n\n    *\
    \   **Real-time deployment and environments**. The models that are developed using\
    \ the in-database ML algorithms can be immediately deployed and used in real-time\
    \ environments. This allows the integration of the models into everyday applications,\
    \ providing real-time predictions to end users and customers.\n\n    *   **Production\
    \ deployment**. Models developed using stand-alone ML software may have to be\
    \ recoded into other programming languages before they can be deployed into enterprise\
    \ applications. This is not the case with in-database ML. SQL is the language\
    \ of the database; it can be used and called by any programming language and data\
    \ science tool. It is then a simple task to incorporate the in-database models\
    \ into production applications.\n\n    Many organizations are exploiting the benefits\
    \ of in-database ML. They range from small and medium organizations to large,\
    \ big-data-type organizations. Some examples of organizations that use in-database\
    \ ML technologies are:\n\n    *   Fiserv, an American provider of financial services\
    \ and fraud detection and analysis. Fiserv migrated from using multiple vendors\
    \ for data storage and ML to using just the ML capabilities in its database. By\
    \ using in-database ML, the time used for creating/updating and deploying a fraud-detection\
    \ model went from nearly a week to just a few hours.\n\n    *   84.51^° (formally\
    \ Dunnhumby USA), a customer science company. 84.51^° used many different analytic\
    \ products to create its various customer models. It typically would spend more\
    \ than 318 hours each month moving data from its database to its ML tools and\
    \ back again, plus an additional 67 hours a month to create models. When it switched\
    \ to using the ML algorithms in its database, there was no more need for data\
    \ movement. The data stayed in the database. The company immediately saved more\
    \ than 318 hours of time per month. Because it was using its database as a compute\
    \ engine, it was able to scale its analytics, and the time taken to generate or\
    \ update its ML models went from more than 67 hours to one hour per month. This\
    \ gave the company a saving of sixteen days each month. It is now able to get\
    \ significantly quicker results and can now provide its customers with results\
    \ much sooner after they have made a purchase.\n\n    *   Wargaming, the creators\
    \ of *World of Tanks* and many other games. Wargaming uses in-database ML to model\
    \ and predict how to interact with their more than 120 million customers.\n\n\
    \    ### Big Data Infrastructure\n\n    Although the traditional (modern) database\
    \ is incredibly efficient at processing transactional data, in the age of big\
    \ data new infrastructure is required to manage all the other forms of data and\
    \ for longer-term storage of the data. The modern traditional database can cope\
    \ with data volumes up to a few petabytes, but for this scale of data, traditional\
    \ database solutions may become prohibitively expensive. This cost issue is commonly\
    \ referred to as *vertical scaling*. In the traditional data paradigm, the more\
    \ data an organization has to store and process within a reasonable amount of\
    \ time, the larger the database server required and in turn the greater the cost\
    \ for server configuration and database licensing. Organizations may be able to\
    \ ingest and query one billion records on a daily/weekly bases using traditional\
    \ databases, but for this scale of processing they may need to invest more than\
    \ $100,000 just purchasing the required hardware.\n\n    Hadoop is an open-source\
    \ platform developed and released by the Apache Software Foundation. It is a well-proven\
    \ platform for ingesting and storing large volumes of data in an efficient manner\
    \ and can be much less expensive than the traditional database approach. In Hadoop,\
    \ the data are divided up and partitioned in a variety of ways, and these partitions\
    \ or portions of data are spread across the nodes of the Hadoop cluster. The various\
    \ analytic tools that work with Hadoop process the data that reside on each of\
    \ the nodes (in some instances these data can be memory resident), thus allowing\
    \ for speedy processing of the data because the analytics is performed in parallel\
    \ across the nodes. No data extraction or ETL process is needed. The data are\
    \ analyzed where they are stored."
