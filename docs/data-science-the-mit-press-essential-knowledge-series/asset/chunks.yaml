    ![图 3 数据科学金字塔（改编自 Han, Kamber, and Pei 2011）。](img/11140_002_fig_003.jpg)

    图 3 数据科学金字塔（改编自 Han, Kamber, and Pei 2011）。


    ## CRISP-DM 流程


    许多个人和公司经常就爬数据科学金字塔的最佳流程提出建议。最常用的流程是跨行业标准数据挖掘流程（CRISP-DM）。事实上，多年来，CRISP-DM 在多项行业调查中一直位居第一。CRISP-DM
    的主要优势，也是它被如此广泛使用的主要原因，是它的设计初衷是独立于任何软件、供应商或数据分析技的。


    CRISP-DM 最初由一个由领先的数据科学供应商、终端用户、咨询公司和研究人员组成的联合组织开发。最初的 CRISP-DM 项目部分由欧盟委员会在 ESPRIT
    计划下提供赞助，该流程首次在 1999 年的一次研讨会上提出。从那时起，人们尝试多次更新该流程，但原始版本仍然是主流使用。多年来，CRISP-DM 一直有一个专属网站，但最近该网站已不再可用，有时你可能会被重定向到
    IBM 的 SPSS 网站，而 IBM 是该项目的原始贡献者之一。原始联合组织发布了一份详尽（76 页）但易于阅读的流程分步指南，可以在网上免费获取（参见
    Chapman et al. 1999），但该流程的结构和主要任务可以在几页内总结。


    CRISP-DM 生命周期由六阶段组成：*业务理解*、*数据理解*、*数据准备*、*建模*、*评估*和*部署*，如图 4 所示所示。数据是所有数据科学活动的核心，这就是为什么
    CRISP-DM 图将数据放在中心的位置。阶段之间的箭头表示了流程的典型方向。该流程是半结构化的，这意味着数据科学家并不总是以线性方式通过这六个阶段。根据特定阶段的结果，数据科学家可能会返回之前的某一个阶段、重新执行当前阶段，或者移动到下一个阶段。


    ![图 4 CRISP-DM 生命周期（基于 Chapman, Clinton, Kerber, et al. 1999 中的图 2）。](img/11140_002_fig_004.jpg)

    图 4 CRISP-DM 生命周期（基于 Chapman, Clinton, Kerber, et al. 1999 中的图 2）。


    ### 业务理解与数据理解


    在最初两个阶段（即业务理解和数据理解）中，数据科学家正试图通过理解业务需求以及业务所拥有的数据来定义项目目标。在项目的早期，数据科学家通常会在“关注业务”和“探索可用数据”之间进行迭代。这种迭代通常涉及识别一个业务问题，然后探索是否有合适的数据可用用，以为该问题开发数据驱动的解决方案。如果数据可用，项目就可以继续；如果不可用，数据科学家将识别另一个替代问题来处理。在项目的这一阶段，数据科学家将花费大量时间与业务部门的同事（如销售、市场、运营）开会，以了解他们的问题，并与数据库管理员交流，以了解哪些数据可用。


    ### 数据准备


    一旦数据科学家清晰地定义了业务问题并确认合适的数据可用，她就会进入 CRISP-DM 的下一个阶段：数据准备。数据准备阶段的重点是创建一个可用于数据分析的数据集。通常情况下，创建此数据集涉及从多个数据库中整合数据源。当一个组织拥有数据仓库时，这种数据集成可以相对简单。一旦创建了数据集，就需要对数据进行检查和修复。典型的数据质量问题包括异常值和缺失值。检查数据质量非常重要，因为数据中的错误会对数据分析算法的性能产生严重影响。


    ### 建模


    CRISP-DM 的下一个阶段是建模阶段。在这一阶段，使用自动算法从数据中提取有用模式，并创建编码这些模式的模型。机器学习是专注于设计这些算法的计算机科学领域。在建模阶段，数据科学家通常会使用多个不同的机器学习（ML）算法在数据集上训练多个不同的模型。建模是在数据集上使用多个不同的
    ML 算法来训练模型，其目的是从数据中提取有用模式并创建编码这些模式的模型。


    在某些情况下，ML 算法通过为数据集设置良好的参数来拟合模板模型（例如对数据集拟合线性回归或神经网络模型）。在其他情况下，ML 算法以分段方式构建模型（例如从根节点开始逐步生长决策树）。在大多数数据科学项目中，最终由
    ML 算法生成的模型是组织部署以解决数据科学项目问题的软件。每个模型都由不同类型的 ML 算法训练，每种算法都在数据中寻找不同类型的模式。在项目的这一阶段，数据科学家通常不知道哪些是最佳模式，因此在这种背景下，对不同的算法进行实验并观察哪种算法在数据集上返回最准确的模型是合理的。第四章我们将更详细地介绍机器学习算法和模型，并解释如何创建评估模型准确性的测试计划。


    在大多数数据科学项目中，初始模型测试结果会发现数据中的问题。这些数据错误会在数据科学家调查为什么模型性能低于预期，或者注意到模型可能好得异常时显现。或者通过检查模型结构，数据科学家可能会发现模型依赖于她意想不到的属性，因此她重新查看数据以检查这些属性是否编码正确。因此，项目经历这两个阶段的几轮并不常见：建模、数据准备；建模、数据准备；以此类推。例如，Dan
    Steinberg 和他的团队报告说，在一个数据科学项目中，他们在六周内重建了 10 次数据集，并在第五周在经过多次数据清洗和准备后，他们发现了数据中的一个重大错误（Steinberg
    2013）。如果这个错误没有被发现和修复，项目将无法成功。


    '
