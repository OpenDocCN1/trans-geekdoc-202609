    The majority of ML algorithms can be classified as either `supervised learning`
    or `unsupervised learning`. The goal of supervised learning is to learn a function
    that maps from the values of the attributes describing an instance to the value
    of another attribute, known as the `target attribute`, of that instance. For example,
    when supervised learning is used to train a spam filter, the algorithm attempts
    to learn a function that maps from the attributes describing an email to a value
    (spam/not spam) for the `target attribute`; the function the algorithm learns
    is the spam-filter model returned by the algorithm. So in this context the pattern
    that the algorithm is looking for in the data is the function that maps from the
    values of the input attributes to the values of the `target attribute`, and the
    model that the algorithm returns is a computer program that implements this function.
    Supervised learning works by searching through lots of different functions to
    find the function that best maps between the inputs and output. However, for any
    data set of reasonable complexity there are so many combinations of inputs and
    possible mappings to outputs that an algorithm cannot try all possible functions.
    As a consequence, each ML algorithm is designed to look at or prefer certain types
    of functions during its search. These preferences are known as the algorithm’s
    `learning bias`. The real challenge in using ML is to find the algorithm whose
    learning bias is the best match for a particular data set. Generally, this task
    involves experiments with a number of different algorithms to find out which one
    works best on that data set.


    Supervised learning is “supervised” because each of the instances in the data
    set lists both the input values and the output (target) value for each instance.
    So the learning algorithm can guide its search for the best function by checking
    how each function it tries matches with the data set, and at the same time the
    data set acts as a supervisor for the learning process by providing feedback.
    Obviously, for supervised learning to take place, each instance in the data set
    must be labeled with the value of the `target attribute`. Often, however, the
    reason a target attribute is interesting is that it is not easy to directly measure,
    and therefore it is not possible to easily create a data set of labeled instances.
    In such scenarios, a great deal of time and effort is required to create a data
    set with the target values before a model can be trained using supervised learning.


    In unsupervised learning, there is no `target attribute`. As a consequence, unsupervised-learning
    algorithms can be used without investing the time and effort in labeling the instances
    of the data set with a `target attribute`. However, not having a target attribute
    also means that learning becomes more difficult: instead of the specific problem
    of searching for a mapping from inputs to output that matches the data, the algorithm
    has the more general task of looking for regularities in the data. The most common
    type of unsupervised learning is `cluster analysis`, where the algorithm looks
    for clusters of instances that are more similar to each other than they are to
    other instances in the data. These clustering algorithms often begin by guessing
    a set of clusters and then iteratively updating the clusters (dropping instances
    from one cluster and adding them to another) so as to increase both the within-cluster
    similarity and the diversity across clusters.


    A challenge for clustering is figuring out how to measure similarity. If all the
    attributes in a data set are numeric and have similar ranges, then it probably
    makes sense just to calculate the `Euclidean distance` (better known as the `straight-line
    distance`) between the instances (or rows). Rows that are close together in the
    Euclidean space are then treated as similar. A number of factors, however, can
    make the calculation of similarity between rows complex. In some data sets, different
    numeric attributes have different ranges, with the result that a variation in
    row values in one attribute may not be as significant as a variation of a similar
    magnitude in another attribute. In these cases, the attributes should be normalized
    so that they all have the same range. Another complicating factor in calculating
    similarity is that things can be deemed similar in many different ways. Some attributes
    are sometimes more important than other attributes, so it might make sense to
    weight some attributes in the distance calculations, or it may be that the data
    set includes nonnumeric data. These more complex scenarios may require the design
    of bespoke similarity metrics for the clustering algorithm to use.


    Unsupervised learning can be illustrated with a concrete example. Imagine we are
    interested in analyzing the causes of Type 2 diabetes in white American adult
    males. We would begin by constructing a data set, with each row representing one
    person and each column representing an attribute that we believe are relevant
    for the study. For this example, we will include the following attributes: an
    individual’s height in meters and weight in kilos, the number of minutes he exercises
    per week, his shoe size, and the likelihood that he will develop diabetes expressed
    as a percentage based on a number of clinical tests and lifestyle surveys. `Table
    2` illustrates a snippet from this data set. Obviously, other attributes could
    be included—for example, a person’s age—and some attributes could be removed—for
    example, shoe size, which wouldn’t be particularly relevant in determining someone
    will develop diabetes. As we discussed in chapter 2, the choice of which attributes
    to include and exclude from a data set is a key task in data science, but for
    the purposes of this discussion we will work with the data set as is.


    ![Table 2 Diabetes Study Data Set](images/11140_004_T2.png)


    Diabetes Study Data Set


    An unsupervised clustering algorithm will look for groups of rows that are more
    similar to each other than they are to the other rows in the data. Each of these
    groups of similar rows defines a cluster of similar instances. For instance, an
    algorithm can identify causes of a disease or disease comorbidities (diseases
    that occur together) by looking for attribute values that are relatively frequent
    within a cluster. The simple idea of looking for clusters of similar rows is very
    powerful and has applications across many areas of life. Another application of
    clustering rows is making product recommendations to customers. If a customer
    liked a book, song, or movie, then he may enjoy another book, song, or movie from
    the same cluster.


    ## Learning Prediction Models

