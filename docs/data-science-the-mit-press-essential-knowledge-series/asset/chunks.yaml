    ![Figure 3 Data science pyramid (adapted from Han, Kamber, and Pei 2011).](images/11140_002_fig_003.jpg)

    [Figure 3](#c11140_002.xhtml#fig_003a) Data science pyramid (adapted from Han,
    Kamber, and Pei 2011).


    ## The CRISP-DM Process


    Many people and companies regularly put forward suggestions on the best process
    to follow to climb the data science pyramid. The most commonly used process is
    the Cross Industry Standard Process for Data Mining (CRISP-DM). In fact, the CRISP-DM
    has regularly been in the number-one spot in various industry surveys for a number
    of years. The primary advantage of CRISP-DM, the main reason why it is so widely
    used, is that it is designed to be independent of any software, vendor, or data-analysis
    technique.


    CRISP-DM was originally developed by a consortium of organizations consisting
    of leading data science vendors, end users, consultancy companies, and researchers.
    The original CRISP-DM project was sponsored in part by the European Commission
    under the ESPRIT Program, and the process was first presented at a workshop in
    1999. Since then, a number of attempts have been made to update the process, but
    the original version is still predominantly in use. For many years, there was
    a dedicated website for CRISP-DM, but in recent years this website is no longer
    available, and on occasion you might get redirected to the SPSS website by IBM,
    which was one of the original contributors to the project. The original consortium
    published a detailed (76-page) but readable step-by-step guide to the process
    that is freely available online (see Chapman et al. 1999), but the structure and
    major tasks of the process can be summarized in a few pages.


    The CRISP-DM life cycle consists of six stages: *business understanding*, *data
    understanding*, *data preparation*, *modeling*, *evaluation*, and *deployment*,
    as shown in [figure 4](#c11140_002.xhtml#fig_004). Data are at the center of all
    data science activities, and that is why the CRISP-DM diagram has data at its
    center. The arrows between the stages indicate the typical direction of the process.
    The process is semistructured, which means that a data scientist doesn’t always
    move through these six stages in a linear fashion. Depending on the outcome of
    a particular stage, a data scientist may go back to one of the previous stages,
    redo the current stage, or move on to the next stage.


    ![Figure 4 The CRISP-DM life cycle (based on figure 2 in Chapman, Clinton, Kerber,
    et al. 1999).](images/11140_002_fig_004.jpg)

    [Figure 4](#c11140_002.xhtml#fig_004a) The CRISP-DM life cycle (based on [figure
    2](#c11140_002.xhtml#fig_002) in Chapman, Clinton, Kerber, et al. 1999).


    ### Business Understanding and Data Understanding


    In the first two stages, business understanding and data understanding, the data
    scientist is trying to define the goals of the project by understanding the business
    needs and the data that the business has available to it. In the early stages
    of a project, a data scientist will often iterate between focusing on the business
    and exploring what data are available. This iteration typically involves identifying
    a business problem and then exploring if the appropriate data are available to
    develop a data-driven solution to the problem. If the data are available, the
    project can proceed; if not, the data scientist will have to identify an alternative
    problem to tackle. During this stage of a project, a data scientist will spend
    a great deal of time in meetings with colleagues in the business-focused departments
    (e.g., sales, marketing, operations) to understand their problems and with the
    database administrators to get an understanding of what data are available.


    ### Data Preparation


    Once the data scientist has clearly defined a business problem and is happy that
    the appropriate data are available, she moves on to the next phase of the CRISP-DM:
    data preparation. The focus of the data-preparation stage is the creation of a
    data set that can be used for the data analysis. In general, creating this data
    set involves integrating data sources from a number of databases. When an organization
    has a data warehouse, this data integration can be relatively straightforward.
    Once a data set has been created, the quality of the data needs to be checked
    and fixed. Typical data-quality problems include outliers and missing values.
    Checking the quality of the data is very important because errors in the data
    can have a serious effect on the performance of the data-analysis algorithms.


    ### Modeling


    The next stage of CRISP-DM is the modeling stage. This is the stage where automatic
    algorithms are used to extract useful patterns from the data and to create models
    that encode these patterns. Machine learning is the field of computer science
    that focuses on the design of these algorithms. In the modeling stage, a data
    scientist will normally use a number of different ML algorithms to train a number
    of different models on the data set. A model is trained on a data set by running
    an ML algorithm on the data set so as to identify useful patterns in the data
    and to return a model that encodes these patterns. In some cases an ML algorithm
    works by fitting a template model structure to a data set by setting the parameters
    of the template to good values for that data set (e.g., fitting a linear regression
    or neural network model to a data set). In other cases an ML algorithm builds
    a model in a piecewise fashion (e.g. growing a decision tree one node at a time
    beginning at the root node of the tree). In most data science projects it is a
    model generated by an ML algorithm that is ultimately the software that is deployed
    by an organization to help it solve the problem the data science project is addressing.
    Each model is trained by a different type of ML algorithm, and each algorithm
    looks for different types of patterns in the data. At this stage in the project,
    the data scientist typically doesn’t know which patterns are the best ones to
    look for, so in this context it makes sense to experiment with a number of different
    algorithms and see which algorithm returns the most accurate models when run on
    the data set. In chapter 4 we will introduce ML algorithms and models in much
    more detail and explain how to create a test plan to evaluate model accuracy.


    In the majority of data science projects, the initial model test results will
    uncover problems in the data. These data errors sometimes come to light when the
    data scientist investigates why the performance of a model is lower than expected
    or notices that maybe the model’s performance is suspiciously good. Or by examining
    the structure of the models, the data scientist may find that the model is reliant
    on attributes she would not expect, and as a result she revisits the data to check
    that these attributes are correctly encoded. It is thus not uncommon for a project
    to go through several rounds of these two stages of the process: modeling, data
    preparation; modeling, data preparation; and so on. For example, Dan Steinberg
    and his team reported that during one data science project, they rebuilt their
    data set 10 times over a six-week period, and in week five, having gone through
    a number of iterations of data cleaning and preparation, they uncovered a major
    error in the data (Steinberg 2013). If this error had not been identified and
    fixed, the project would not have succeeded.

