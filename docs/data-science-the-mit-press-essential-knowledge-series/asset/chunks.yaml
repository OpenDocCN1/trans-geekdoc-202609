    \ a well-known example being when it restocked strawberry Pop-Tarts in stores\
    \ in the path of Hurricane Francis in 2004 based on an analysis of sales data\
    \ preceding Hurricane Charley, which had struck a few weeks earlier. More recently,\
    \ Walmart has used data science to drive its retail revenues in terms of introducing\
    \ new products based on analyzing social media trends, analyzing credit card activity\
    \ to make product recommendations to customers, and optimizing and personalizing\
    \ customers’ online experience on the Walmart website. Walmart attributes an increase\
    \ of 10 to 15 percent in online sales to data science optimizations (DeZyre 2015).\n\
    \n    The equivalent of up-selling and cross-selling in the online world is the\
    \ “recommender system.” If you have watched a movie on Netflix or purchased an\
    \ item on Amazon, you will know that these websites use the data they collect\
    \ to provide suggestions for what you should watch or buy next. These recommender\
    \ systems can be designed to guide you in different ways: some guide you toward\
    \ blockbusters and best sellers, whereas others guide you toward niche items that\
    \ are specific to your tastes. Chris Anderson’s book *The Long Tail* (2008) argues\
    \ that as production and distribution get less expensive, markets shift from selling\
    \ large amounts of a small number of hit items to selling smaller amounts of a\
    \ larger number of niche items. This trade-off between driving sales of hit or\
    \ niche products is a fundamental design decision for a recommender system and\
    \ affects the data science algorithms used to implement these systems.\n\n   \
    \ ### Governments Using Data Science\n\n    In recent years, governments have\
    \ recognized the advantages of adopting data science. In 2015, for example, the\
    \ US government appointed Dr. D. J. Patil as the first chief data scientist. Some\
    \ of the largest data science initiatives spearheaded by the US government have\
    \ been in health. Data science is at the core of the Cancer Moonshot[⁴](#c11140_001.xhtml#FN4)\
    \ and Precision Medicine Initiatives. The Precision Medicine Initiative combines\
    \ human genome sequencing and data science to design drugs for individual patients.\
    \ One part of the initiative is the All of Us program,[⁵](#c11140_001.xhtml#FN5)\
    \ which is gathering environment, lifestyle, and biological data from more than\
    \ one million volunteers to create the world’s biggest data sets for precision\
    \ medicine. Data science is also revolutionizing how we organize our cities: it\
    \ is used to track, analyze, and control environmental, energy, and transport\
    \ systems and to inform long-term urban planning (Kitchin 2014a). We return to\
    \ health and smart cities in chapter 7 when we discuss how data science will become\
    \ even more important in our lives over the coming decades.\n\n    The US government’s\
    \ Police Data Initiative[⁶](#c11140_001.xhtml#FN6) focuses on using data science\
    \ to help police departments understand the needs of their communities. Data science\
    \ is also being used to predict crime hot spots and recidivism. However, civil\
    \ liberty groups have criticized some of the uses of data science in criminal\
    \ justice. In chapter 6, we discuss the privacy and ethics questions raised by\
    \ data science, and one of the interesting factors in this discussion is that\
    \ the opinions people have in relation to personal privacy and data science vary\
    \ from one domain to the next. Many people who are happy for their personal data\
    \ to be used for publicly funded medical research have very different opinions\
    \ when it comes to the use of personal data for policing and criminal justice.\
    \ In chapter 6, we also discuss the use of personal data and data science in determining\
    \ life, health, car, home, and travel insurance premiums.\n\n    ### Data Science\
    \ in Professional Sports\n\n    The movie *Moneyball* (Bennett Miller, 2011),\
    \ starring Brad Pitt, showcases the growing use of data science in modern sports.\
    \ The movie is based on the book of the same title (Lewis 2004), which tells the\
    \ true story of how the Oakland A’s baseball team used data science to improve\
    \ its player recruitment. The team’s management identified that a player’s on-base\
    \ percentage and slugging percentage statistics were more informative indicators\
    \ of offensive success than the statistics traditionally emphasized in baseball,\
    \ such as a player’s batting average. This insight enabled the Oakland A’s to\
    \ recruit a roster of undervalued players and outperform its budget. The Oakland\
    \ A’s success with data science has revolutionized baseball, with most other baseball\
    \ teams now integrating similar data-driven strategies into their recruitment\
    \ processes.\n\n    The moneyball story is a very clear example of how data science\
    \ can give an organization an advantage in a competitive market space. However,\
    \ from a pure data science perspective perhaps the most important aspect of the\
    \ moneyball story is that it highlights that sometimes the primary value of data\
    \ science is the identification of informative attributes. A common belief is\
    \ that the value of data science is in the models created through the process.\
    \ However, once we know the important attributes in a domain, it is very easy\
    \ to create data-driven models. The key to success is getting the right data and\
    \ finding the right attributes. In *Freakonomics: A Rogue Economist Explores the\
    \ Hidden Side of Everything*, Steven D. Levitt and Stephen Dubner illustrate the\
    \ importance of this observation across a wide range of problems. As they put\
    \ it, the key to understanding modern life is “knowing what to measure and how\
    \ to measure it” (2009, 14). Using data science, we can uncover the important\
    \ patterns in a data set, and these patterns can reveal the important attributes\
    \ in the domain. The reason why data science is used in so many domains is that\
    \ it doesn’t matter what the problem domain is: if the right data are available\
    \ and the problem can be clearly defined, then data science can help.\n\n    ##\
    \ Why Now?\n\n    A number of factors have contributed to the recent growth of\
    \ data science. As we have already touched upon, the emergence of big data has\
    \ been driven by the relative ease with which organizations can gather data. Be\
    \ it through point-of-sales transaction records, clicks on online platforms, social\
    \ media posts, apps on smart phones, or myriad other channels, companies can now\
    \ build much richer profiles of individual customers. Another factor is the commoditization\
    \ of data storage with economies of scale, making it less expensive than ever\
    \ before to store data. There has also been tremendous growth in computer power.\
    \ Graphics cards and graphical processing units (GPUs) were originally developed\
    \ to do fast graphics rendering for computer games. The distinctive feature of\
    \ GPUs is that they can carry out fast matrix multiplications. However, matrix\
    \ multiplications are useful not only for graphics rendering but also for ML.\
    \ In recent years, GPUs have been adapted and optimized for ML use, which has\
    \ contributed to large speedups in data processing and model training. User-friendly\
    \ data science tools have also become available and lowered the barriers to entry\
    \ into data science. Taken together, these developments mean that it has never\
    \ been easier to collect, store, and process data."
