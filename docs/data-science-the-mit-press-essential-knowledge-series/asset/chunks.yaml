    除了预测分类标签外，预测模型还可以给出模型对预测结果的置信程度。这种衡量被称为 `prediction probability`（预测概率），其值于 0 到
    1 之间。值越高，预测正确的概率越大。预测概率值可用于确定关注哪些客户的优先级。例如，在客户流失预测中，机构希望关注那些最有可能离开的客户。通过使用 `prediction
    probability` 并根据该值对流失者进行排序，企业可以优先关注关键客户（最可能离开的客户），然后再转向预测概率得分较低的客户。


    ## 费用会有多少？（回归）


    价格预测是估算产品在特定时间点成本的任务。该产品可以是汽车、房屋、一桶石油、股票或某项医疗程序。对于任何考虑购买该物品的人来说，对该物品的成本有一个良好的估算显然是有价值的。价格预测模型的准确性取决于具体的领域。例如，由于股市的波动性，预测明天的股票是非常是非常的。相比之下，预测拍卖中房屋的价格可能更容易，因为房价价格的波动比股票慢得多。


    价格预测涉及对连续属性价值的估算，这意味着它被视为一个 `regression problem`（回归问题）。回归问题在结构上与分类问题非常相似；在两种情况下，数据科学解决方案都涉及构建一个模型，该模型能够根据一组输入属性来预测某个属性的缺失值。唯一的区别在于，分类涉及估算类别属性的价值，而回归涉及估算连续属性的价值。回归分析需要一个数据集，其中列出了每个历史实例的目标属性值。第
    4 章中引入的 `multi-input linear-regression`（多输入线性回归）模型展示了回归模型的基本结构，其他大多数回归模型都是这种方法的变体。无论应用于什么产品，价格预测回归模型的基本结构都是相同的；变化的仅是属性的名称和数量。例如，为了预测房屋价格，输入将包括房屋面积、房间数量、楼层数、该地区的平均房价、该地区的平均房屋面积等属性。相比之下，预测汽车价格的属性将包括车龄、里程读数、发动机尺寸、汽车品牌、车门数量等。在每种情况下，只要有适当的数据，回归算法就能计算出每个属性对最终价格的贡献。


    正如本章中给出所有示例一样，使用回归模型进行价格预测的应用示例仅说明了适合构化为 `regression-modeling task`（回归建模任务）的问题类型。回归预测可以用于许多其他现实世界问题。典型的回归预测问题包括计算利润、销售价值和量、尺寸、需求、距离和剂量。


    ## Note


    # 6 隐私与伦理


    今天数据科学面临的最大未知数是，社会将如何选择回答关于旧问题的新版本，即如何平衡个人和少数群体的自由、隐私与社会安全及利益的关系。在数据科学的背景下，这个老问题被表述为：我们作为社会的一员认为，在反恐主义、改进医学、支持公共政策研究、打击犯罪、检测欺诈、评估信用风险、提供保险承保以及针对目标群体投放广告等多元背景下，收集和使用有关个人数据的合理方式是什么？


    数据科学的承诺在于它提供了一种通过数据理解世界的方法。在当前的大数据时代，这一承诺非常有吸引力，事实上，可以使用许多论点来支持数据驱动的基础和技术的开发与采用。一个常见的论点与提高效率、有效性和竞争力有关——这一论点至少在商业背景下已得到了一些学术研究的支持。例如，2011
    年一项涉及 179 家大型上市公司的研究显示，公司的决策受数据驱动的程度越高，公司的生产力就越高：“我们发现，采用 `DDD` [数据驱动决策] 的公司，其产出和生产力比其投资和其他信息技术使用情况的预期高出
    5–6%”(Brynjolfsson, Hitt, and Kim 2011, 1)。


    另一个关于增加数据科学技术和实践应用的论点与安全性有关。长期以来，政府一直使用监视可以提高安全性的论点。自从 2001 年 9 月 11 日美国发生恐怖袭击，以及随后全球范围内发生的每次恐怖袭击后，这一论点得到了广泛关注。事实上，在爱德华·斯诺登（Edward
    Snowden）揭露美国国家安全局的 `PRISM` 监控计划及其惯常收集的美国公民数据后引发的公众辩论中，这一论点被频繁使用。这一论点力量的一个有力例子是，该机构在犹他州布拉夫代尔（Bluffdale）的一个数据中心投资了
    17 亿美元，该中心有存储海量截获通信的能力 (Carroll 2013)。


    然而，社会、政府和企业仍在努力理解大数据世界中数据科学的长期影响。考虑到数据收集、数据存储和数据分析相关技术的快速发展，现有的法律框架以及围绕数据的更广泛的伦理讨论（特别是个人隐私问题）落后于这些进展并不意外。尽管存在这些困难，但理解数据收集和使用的基本法律原则是重要的，并且几乎适用于。此外，围绕数据使用和隐私的伦理辩论已经凸显了一些我们作为个人和公民应该注意的令人担忧的趋势。


    ## 商业利益与个人隐私


    数据科学可以被描述为让世界变成一个更繁荣、更安全的居住地。但这些论点也可以被具有截然不同议程的机构所利用。例如，民权自由团体要求政府在数据的收集、使用和可用性方面更加开放和透明，以赋予公民要求这些政府负责的权利；而商业界也提出了类似的呼声，他们希望利用这些数据来增加利润
    (Kitchin 2014a)。事实上，数据科学是一把双刃剑。它可以通过更高效的政府、改进的医学和保健、更廉价的保险、更智能城市、减少犯罪等许多方式来改善我们的生活。然而，它也可以被用于监视我们的私人生活，向我们投放不想要的广告，并公开或隐蔽地控制我们的行为（对监视的恐惧对我们的影响可能不亚于监视本身）。


