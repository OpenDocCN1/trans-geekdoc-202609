    version of the model. This local update of the model is then uploaded to the cloud,
    where it is averaged with the model updates uploaded from other user phones. The
    core model is then updated using this average. With the use of this process, the
    core model can be improved, and individual users’ privacy can at the same time
    be protected to the extent that only the model updates are shared—not the users’
    usage data.


    ## Legal Frameworks for Regulating Data Use and Protecting Privacy


    There is variation across jurisdictions in the laws relating to privacy protection
    and permissible data usage. However, two core pillars are present across most
    democratic jurisdictions: antidiscrimination legislation and personal-data-protection
    legislation.


    In most jurisdictions, antidiscrimination legislation forbids discrimination based
    on any of the following grounds: disability, age, sex, race, ethnicity, nationality,
    sexual orientation, and religious or political opinion. In the United States,
    the `Civil Rights Act of 1964` prohibits discrimination based on color, race,
    sex, religion, or nationality. Later legislation has extended this list; for example,
    the `Americans with Disabilities Act of 1990` extended protection to people against
    discrimination based on disabilities. Similar legalization is in place in many
    other jurisdictions. For example, the `Charter of Fundamental Rights of the European
    Union` prohibits discrimination based on any grounds, including race, color, ethnic
    or social origin, genetic features, sex, age, birth, disability, sexual orientation,
    religion or belief, property, membership in a national minority, and political
    or any other opinion (Charter 2000).


    A similar situation of variation and overlap exists with respect to privacy legislation
    across different jurisdictions. In the United States, the `Fair Information Practice
    Principles (1973)` have provided the basis for much of the subsequent privacy
    legislation in that jurisdiction. In the EU, the `Data Protection Directive (Council
    of the European Union and European Parliament 1995)` is the basis for much of
    that jurisdiction’s privacy legislation. The `General Data Protection Regulations
    (Council of the European Union and European Parliament 2016)` expand on the data
    protection principles in the Data Protection Directive and provide consistent
    and legally enforceable data protection regulations across all EU member states.
    However, the most broadly accepted principles relating to personal privacy and
    data are the `Guidelines on the Protection of Privacy and Transborder Flows of
    Personal Data` published by the Organisation for Economic Co-operation and Development
    (OECD 1980). Within these guidelines, personal data are defined as records relating
    to an identifiable individual, known as the `data subject`. The guidelines define
    eight (overlapping) principles that are designed to protect a data subject’s privacy:


    1. `Collection Limitation Principle`: Personal data should only be obtained lawfully
    and with the knowledge and consent of the data subject.

    2. `Data Quality Principle`: Any personal data that are collected should be relevant
    to the purpose for which they are used; they should be accurate, complete, and
    up to date.

    3. `Purpose Specification Principle`: At or before the time that personal data
    are collected, the data subject should be informed of the purpose for which the
    data will be used. Furthermore, although changes of purpose are permissible, they
    should not be introduced arbitrarily (new purposes must be compatible with the
    original purpose) and should be specified to the data subject.

    '
