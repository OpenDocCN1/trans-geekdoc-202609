    Humans have always abstracted from the world and tried to understand it by identifying
    patterns in their experiences of it. Data science is the latest incarnation of
    this pattern-seeking behavior. However, although data science has a long history,
    the breadth of its impact on modern life is without precedent. In modern societies,
    the words `precision`, `smart, targeted`, and `personalized` are often indicative
    of data science projects: `precision medicine`, `precision policing`, `precision
    agriculture`, `smart cities`, `smart transport, targeted advertising, personalized
    entertainment.` The common factor across all these areas of human life is that
    decisions have to be made: What treatment should we use for this patient? Where
    should we allocate our policing resources? How much fertilizer should we spread?
    How many high schools do we need to build in the next four years? Who should we
    send this advertisement to? What movie or book should we recommend to this person?
    The power of data science to help with decision making is driving its adoption.
    Done well, data science can provide `actionable insight` that leads to better
    decisions and ultimately better outcomes.


    Data science, in its modern guise, is driven by big data, computer power, and
    human ingenuity from a number of fields of scientific endeavor (from data mining
    and database research to machine learning). This book has tried to provide an
    overview of the fundamental ideas and concepts required to understand data science.
    The `CRISP-DM` project life cycle makes the data science process explicit and
    provides a structure for the data science journey from data to wisdom: understand
    the problem, prepare the data, use `ML` to extract patterns and create models,
    use the models to get actionable insight. The book also touches on some of the
    ethical concerns relating to individual privacy in a data science world. People
    have genuine and well-founded concerns that data science has the potential to
    be used by governments and vested interests to manipulate our behaviors and police
    our actions. We, as individuals, need to develop informed opinions about what
    type of a data world we want to live in and to think about the laws we want our
    societies to develop in order to steer the use of data science in appropriate
    directions. Despite the ethical concerns we may have around data science, the
    genie is already very much out of the bottle: data science is having and will
    continue to have significant effects on our daily lives. When used appropriately,
    it has the potential to improve our lives. But if we want the organizations we
    work with, the communities we live in, and the families we share our lives with
    to benefit from data science, we need to understand and explore what data science
    is, how it works, and what it can (and can’t) do. We hope this book has given
    you the essential foundations you need to go on this journey.


    ## Notes


    ## Glossary


    ### Analytics Base Table

    : A table in which each row contains the data relating to a specific instance
    and each column describes the values of a particular attribute for each instance.
    These data are the basic input to data-mining and machine-learning algorithms.


    ### Anomaly Detection

    : Searching for and identifying examples of atypical data in a data set. These
    nonconforming cases are often referred to as `anomalies` or `outliers`. This process
    is often used in analyzing financial transactions to identify potential fraudulent
    activities and to trigger investigations.


    ### Association-Rule Mining

    : An unsupervised data-analysis technique that looks to find groups of items that
    frequently co-occur together. The classic use case is market-basket analysis,
    where retail companies try to identify sets of items that are purchased together,
    such as the hot dogs, ketchup, and beer.


    ### Attribute

    : Each instance in a data set is described by a number of attributes (also known
    as `features` or `variables`). An attribute captures one piece of information
    relating to an instance. An attribute can be either raw or derived.


    ### Backpropagation

    : The backpropagation algorithm is an `ML` algorithm used to train neural networks.
    The algorithm calculates for each neuron in a network the contribution the neuron
    makes to the error of the network. Using this error calculation for each neuron
    it is possible to update the weights on the inputs to each neuron so as to reduce
    the overall error of the network. The backpropagation algorithm is so named because
    it works in a two stage process. In the first stage an instance is input to the
    network and the information flows forward through the network until the network
    generates a prediction for that instance. In the second stage the error of the
    network on that instance is calculated by comparing the network''s prediction
    to the correct output for that instance (as specified by the training data) and
    then this error is then shared back (or backpropagated) through the neurons in
    the network on a layer by layer basis beginning at the output layer.


    ### Big Data

    : Big data are often defined in terms of the three Vs: the extreme volume of data,
    the variety of the data types, and the velocity at which the data must be processed.


    ### Captured Data

    : Data that are captured through a direct measurement process that is designed
    to gather the data. Contrast with `exhaust data`.


    ### Classification

    : The task of predicting a value for a target attribute of an instance based on
    the values of a set of input attributes, where the target attribute is a nominal
    or ordinal data type.


    ### Clustering

    : Identifying groups of similar instances in a data set.


    ### Correlation

    : The strength of association between two attributes.


    ### Cross Industry Standard Process for Data Mining (CRISP-DM)

    : The `CRISP-DM` defines a standard life cycle for a data-mining project. The
    life cycle is often adopted for data science projects.


    ### Data

    : In its most basic form, a piece of data is an abstraction (or measurement) from
    a real-world entity (person, object, or event).


    ### Data Analysis

    : Any process for extracting useful information from data. Types of data analysis
    include data visualization, summary statistics, correlation analysis, and modeling
    using machine learning.


    ### Database

    : A central repository of data. The most common database structure is a relational
    database, which stores data in tables with a structure of one row per instance
    and one column per attribute. This representation is ideal for storing data with
    a clear structure that can be decomposed into natural attributes.


    ### Data Mining

    : The process of extracting useful patterns from a data set to solve a well-defined
    problem. `CRISP-DM` defines the standard life cycle for a data-mining project.
    Closely related to data science but in general not as broad in scope.


    ### Data Science

    : An emerging field that integrates a set of problem definitions, algorithms,
    and processes that can be used to analyze data so as to extract actionable insight
    from (large) data sets. Closely related to the field of data mining but broader
    in scope and concern. Deals with both structured and unstructured (big) data and
    encompasses principles from a range of fields, including machine learning, statistics,
    data ethics and regulation, and high-performance computing.


    ### Data Set

    : A collection of data relating to a set of instances, with each instance described
    in terms of a set of attributes. In its most basic form, a data set is organized
    in an `n * m` matrix, where `n` is the number of instances (rows) and `m` is the
    number of attributes (columns).


    ### Data Warehouse

