  trans: '


    -   一个包含组织内各种来源数据的集中存储库。数据经过结构化，以支持从聚合数据生成摘要报告。`Online analytical processing`（`OLAP`）是描述数据仓库典型操作的术语。


    ### 决策树

    -   一种在树结构中编码 `if-then-else` 规则的预测模型。树中的每个节点定义了一个待测试的属性，从根节点到终止叶子节点的路径定义了一系列测试，实例必须通过这些测试，才能预测该实例的终止节点标签。


    ### 深度学习

    -   深度学习模型是一种具有多个（多于两层）隐藏单元（或神经元）的神经网络。深度网络是指网络中神经元层数较多的网络。今天，许多深度网络拥有数十到数百层。深度学习模型的强大源于后层神经元能够从前层神经元已经学到的属性中学习更有用的属性。


    ### 派生属性

    -   其值通过对其他数据应用函数生成的属性，而不是直接从实体测量的。描述群体中平均值的属性就是派生属性的示例。与 `raw attribute`（原始属性）相对。


    ### DIKW 金字塔

    -   一种描述 `data`（数据）、`information`（信息）、`knowledge`（知识）和 `wisdom`（智慧）之间结构关系的模型。在
    DIKW 金字塔中，数据领先于信息等。


    ### 废弃数据

    -   主要目的并非数据采集的副产品。例如，每张被分享、推特、转发或点赞的图片都会产生一系列废弃数据：谁分享了、谁查看了、使用了什么设备、什么时间等。与 `captured
    data`（采集数据）相对。


    ### 提取、转换和加载 (ETL)

    -   ETL 是用于描述数据库之间数据映射、合并和移动的典型过程和工具的术语。


    ### Hadoop

    -   Hadoop 是 Apache 软件基金开发的开源框架，旨在为大数据处理而设计。它在廉价硬件集群上使用分布式存储和处理。


    ### 高性能计算 (HPC)

    -   HPC 领域专注于设计和实现框架，将大量计算机连接在一起，以便生成的计算机集群能够高效地存储和处理大量数据。


    ### 数据库内机器学习

    -   使用内置在数据库解决方案中的机器学习算法。数据库内机器学习的优点是减少了为了分析而在数据库进出之间移动数据花费的时间。


    ### 实例

    -   数据集中的每行都包含与一个实例（也称为 `example`、`entity`、`case` 或 `record`）相关的信息。


    ### 物联网

    -   物理设备和传感器的联网，使这些设备能够共享信息。包括机器通信领域，该领域开发的系统使机器能够共享信息，还能对这些信息做出反应并触发操作而无需人工干预。


    ### 线性回归

    -   当在 `regression analysis` 中假设存在线性关系时，该分析被称为 `linear regression`。一种流行的预测模型类型，根据一组数值输入属性来估计数值目标属性的值。


    ### 机器学习 (ML)

    -   计算机科学研究的一个领域，专注于开发和评估能够从数据集中提取有用模式的算法。机器学习算法以 `data set` 为输入并返回一个 `model`，该模型编码了算法从数据中提取的模式。


    ### 大规模并行处理数据库 (MPP)

    -   在 MPP 数据库中，数据被分区在多个服务器上，每个服务器都可以本地且独立地处理该服务器上的数据。


    ### 元数据

    -   描述其他数据结构和属性的数据——例如，描述数据何时被收集的时间戳。元数据是最常见的 `exhaust data` 类型之一。


    ### 模型

    -   在机器学习的语境下，模型是使用机器学习从数据集中提取的模式表示。因此，模型通过训练、拟合到数据集或通过在数据集上运行机器学习算法来创建。流行的模型表示包括
    `decision trees`（决策树）和 `neural networks`（神经网络）。`prediction` 模型定义了从输入属性集到 `target
    attribute`（目标属性）值的映射（或函数）。一旦创建了模型，就可以将其应用于领域中的新实例。例如，为了训练垃圾过滤器模型，我们对已标记为垃圾邮件或非垃圾邮件的历史邮件数据集应用机器学习算法。模型训练完成后，就可以用它来标记（或过滤）不在原始数据集中的新邮件。


    ### 神经网络

    -   一种机器学习模型，实现为称为 `neurons` 神经元的简单处理单元网络。通过修改网络中神经元的拓扑结构，可以创建多种不同的神经网络。前馈全连接神经网络是一种非常常见的网络类型，可以使用
    `backpropagation`（反向传播）进行训练。


    ### 神经元

    -   神经元接收若干输入值（或激活值）作为输入并将这些值映射到单个输出激活值。这种映射通常通过对输入应用多输入线性回归函数，然后将该回归函数的结果通过非线性激活函数（如
    logistic 或 tanh 函数）来实现。


    ### 联机分析处理 (OLAP)

    -   OLAP 操作生成历史数据的摘要和来自多个源的聚合数据。OLAP 操作旨在生成报告类型的摘要，并允许用户使用数据上预定义的维度（如按商店销售、按季度销售等）对数据仓库中的数据进行切、钻和透视。与
    `Online Transaction Processing (OLTP)`（在线事务处理）相对。


    ### 在线事务处理 (OLTP)

    -   OLTP 设计用于短时间在线数据事务（如 `INSERT`、`DELETE`、`UPDATE` 等），重点是快速查询处理和在多访问环境中维护数据完整性。与
    `OLAP` 系统相对，后者旨在对历史数据进行更复杂的操作。


    ### 业务数据存储 (ODS)

    -   ODS 系统整合来自多个系统的业务或事务数据，以支持业务报表。


    ### 预测

    -   在数据科学和机器学习的语境下，根据给定实例的其他属性（或输入属性）的值估计该实例目标属性值的任务。


    ### 原始属性

    -   来自实体的抽象，是直接从实体测量的属性——例如人的身高。与 `derived attribute`（派生属性）相对。


    ### 回归分析

    -   当所有输入属性值固定时，估计数值目标属性的期望（或平均）值。回归分析假设了一个关于输入和输出之间假设关系的参数化数学模型，被称为 `regression
    function`（回归函数）。回归函数可能有多个参数，回归分析的重点是寻找这些参数的正确设置。


    ### 关系型数据库管理系统 (RDBMS)


    '
