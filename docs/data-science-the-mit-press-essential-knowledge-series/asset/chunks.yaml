    4. **Use Limitation Principle**: The use of personal data is limited to the purpose
    that the data subject has been informed of, and the data should not be disclosed
    to third parties without the data subject’s consent or by authority of law.


    5. **Safety Safeguards Principle**: Personal data should be protected by security
    safeguards against deletion, theft, disclosure, modification, or unauthorized
    use.


    6. **Openness Principle**: A data subject should be able to acquire information
    with reasonable ease regarding the collection, storage, and use of his or her
    personal data.


    7. **Individual Participation Principle**: A data subject has the right to access
    and challenge personal data.


    8. **Accountability Principle**: A data controller is accountable for complying
    with the principles.


    Many countries, including the EU and the United States, endorse the OECD guidelines.
    Indeed, the data protection principles in the EU General Data Protection Regulations
    can be broadly traced back to the OECD guidelines. The General Data Protection
    Regulations apply to the collection, storage, transfer and processing of personal
    data relating to EU citizens within the EU and has implications for the flows
    of this data outside of the EU. Currently, several countries are developing data
    protection laws similar to and consistent with the General Data Protection Regulations.


    ## Toward an Ethical Data Science


    It is well known that despite the legal frameworks that are in place, nation-states
    frequently collect personal data on their citizens and foreign nationals without
    these people’s knowledge, often in the name of security and intelligence. Examples
    include the US National Security Agency’s PRISM program; the UK Government Communications
    Headquarters’ Tempora program (Shubber 2013); and the Russian government’s System
    for Operative Investigative Activities (Soldatov and Borogan 2012). These programs
    affect the public’s perception of governments and use of modern communication
    technologies. The results of the Pew survey “Americans’ Privacy Strategies Post-Snowden”
    in 2015 indicated that 87 percent of respondents were aware of government surveillance
    of phone and Internet communications, and among those who were aware of these
    programs 61 percent stated that they were losing confidence that these programs
    served the public interest, and 25 percent reported that they had changed how
    they used technologies in response to learning about these programs (Rainie and
    Madden 2015). Similar results have been reported in European surveys, with more
    than half of Europeans aware of large-scale data collection by government agencies
    and most respondents stating that this type of surveillance had a negative impact
    on their trust with respect to how their online personal data are used (Eurobarometer
    2015).


    At the same time, many private companies avoid the regulations around personal
    data and privacy by claiming to use derived, aggregated, or anonymized data. By
    repackaging data in these ways, companies claim that the data are no longer personal
    data, which, they argue, permits them to gather data without an individual’s awareness
    or consent and without having a clear immediate purpose for the data; to hold
    the data for long periods of time; and to repurpose the data or sell the data
    when a commercial opportunity arises. Many advocates of the commercial opportunities
    of data science and big data argue that the real commercial value of data comes
    from their reuse or “optional value” (Mayer-Schönberger and Cukier 2014). The
    advocates of data reuse highlight two technical innovations that make data gathering
    and storage a sensible business strategy: first, today data can be gathered passively
    with little or no effort or awareness on the part of the individuals being tracked;
    and, second, data storage has become relatively inexpensive. In this context,
    it makes commercial sense to record and store data in case future (potentially
    unforeseeable) commercial opportunities make it valuable.


    The modern commercial practices of hoarding, repurposing, and selling data are
    completely at odds with the purpose specification and use-limitation principles
    of the OECD guidelines. Furthermore, the collection-limitation principle is undermined
    whenever a company presents a privacy agreement to a consumer that is designed
    to be unreadable or reserves the right for the company to modify the agreement
    without further consultation or notification or both. Whenever this happens, the
    process of notification and granting of consent is turned into a meaningless box-ticking
    exercise. Similar to the public opinion about government surveillance in the name
    of security, public opinion is quite negative toward commercial websites’ gathering
    and repurposing of personal data. Again using American and European surveys as
    our litmus test for wider public opinion, a survey of American Internet users
    in 2012 found that 62 percent of adults surveyed stated that they did not know
    how to limit the information collected about them by websites, and 68 percent
    stated that they did not like the practice of targeted advertising because they
    did not like their online behavior tracked and analyzed (Purcell, Brenner, and
    Rainie 2012). A recent survey of European citizens found similar results: 69 percent
    of respondents felt that the collection of their data should require their explicit
    approval, but only 18 percent of respondents actually fully read privacy statements.
    Furthermore, 67 percent of respondents stated that they don’t read privacy statements
    because they found them too long, and 38 percent stated that they found them unclear
    or too difficult to understand. The survey also found that 69 percent of respondents
    were concerned about their information being used for different purposes from
    the one it was collected for, and 53 percent of respondents were uncomfortable
    with Internet companies using their personal information to tailor advertising
    (Eurobarometer 2015).

