    \n## Guide\n\n1.  [Cover](cover.xhtml)\n\n2.  # Series Foreword\n\n    The MIT\
    \ Press Essential Knowledge series offers accessible, concise, beautifully produced\
    \ pocket-size books on topics of current interest. Written by leading thinkers,\
    \ the books in this series deliver expert overviews of subjects that range from\
    \ the cultural and the historical to the scientific and the technical.\n\n   \
    \ In today’s era of instant information gratification, we have ready access to\
    \ opinions, rationalizations, and superficial descriptions. Much harder to come\
    \ by is the foundational knowledge that informs a principled understanding of\
    \ the world. Essential Knowledge books fill that need. Synthesizing specialized\
    \ subject matter for nonspecialists and engaging critical topics through fundamentals,\
    \ each of these compact volumes offers readers a point of access to complex ideas.\n\
    \n    *Bruce Tidor*\n\n    *Professor of Biological Engineering and Computer Science*\n\
    \n    *Massachusetts Institute of Technology*\n\n    # Preface\n\n    The goal\
    \ of data science is to improve decision making by basing decisions on insights\
    \ extracted from large data sets. As a field of activity, data science encompasses\
    \ a set of principles, problem definitions, algorithms, and processes for extracting\
    \ nonobvious and useful patterns from large data sets. It is closely related to\
    \ the fields of data mining and machine learning, but it is broader in scope.\
    \ Today, data science drives decision making in nearly all parts of modern societies.\
    \ Some of the ways that data science may affect your daily life include determining\
    \ which advertisements are presented to you online; which movies, books, and friend\
    \ connections are recommended to you; which emails are filtered into your spam\
    \ folder; what offers you receive when you renew your cell phone service; the\
    \ cost of your health insurance premium; the sequencing and timing of traffic\
    \ lights in your area; how the drugs you may need were designed; and which locations\
    \ in your city the police are targeting."
