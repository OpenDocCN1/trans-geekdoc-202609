    The growth in use of data science across our societies is driven by the emergence
    of big data and social media, the speedup in computing power, the massive reduction
    in the cost of computer memory, and the development of more powerful methods for
    data analysis and modeling, such as deep learning. Together these factors mean
    that it has never been easier for organizations to gather, store, and process
    data. At the same time, these technical innovations and the broader application
    of data science means that the ethical challenges related to the use of data and
    individual privacy have never been more pressing. The aim of this book is to provide
    an introduction to data science that covers the essential elements of the field
    at a depth that provides a principled understanding of the field.


    ## Chapter Overview


    Chapter 1 introduces the field of data science and provides a brief history of
    how it has developed and evolved. It also examines why data science is important
    today and some of the factors that are driving its adoption. The chapter finishes
    by reviewing and debunking some of the myths associated with data science.


    Chapter 2 introduces fundamental concepts relating to data. It also describes
    the standard stages in a data science project: business understanding, data understanding,
    data preparation, modeling, evaluation, and deployment.


    Chapter 3 focuses on data infrastructure and the challenges posed by big data
    and the integration of data from multiple sources. One aspect of a typical data
    infrastructure that can be challenging is that data in databases and data warehouses
    often reside on servers different from the servers used for data analysis. As
    a consequence, when large data sets are handled, a surprisingly large amount of
    time can be spent moving data between the servers a database or data warehouse
    are living on and the servers used for data analysis and machine learning. Chapter
    3 begins by describing a typical data science infrastructure for an organization
    and some of the emerging solutions to the challenge of moving large data sets
    within a data infrastructure, which include the use of in-database machine learning,
    the use of `Hadoop` for data storage and processing, and the development of hybrid
    database systems that seamlessly combine traditional database software and `Hadoop`-like
    solutions. The chapter concludes by highlighting some of the challenges in integrating
    data from across an organization into a unified representation that is suitable
    for machine learning.


    Chapter 4 introduces the field of machine learning and explains some of the most
    popular machine-learning algorithms and models, including neural networks, deep
    learning, and decision-tree models.


    Chapter 5 focuses on linking machine-learning expertise with real-world problems
    by reviewing a range of standard business problems and describing how they can
    be solved by machine-learning solutions.


    Chapter 6 reviews the ethical implications of data science, recent developments
    in data regulation, and some of the new computational approaches to preserving
    the privacy of individuals within the data science process.


    Finally, chapter 7 describes some of the areas where data science will have a
    significant impact in the near future and sets out some of the principles that
    are important in determining whether a data science project will succeed.


    # Acknowledgments


    John and Brendan thank Paul McElroy and Brian Leahy for reading and commenting
    on early drafts. They also thank the two anonymous reviewers who provided detailed
    and helpful feedback on the manuscript and the staff at the MIT Press for their
    support and guidance.


    John thanks his family and friends for their support and encouragement during
    the preparation of this book and dedicates this book to his father, John Bernard
    Kelleher, in recognition of his love and friendship.


    Brendan thanks Grace, Daniel, and Eleanor for their constant support while he
    was writing yet another book (his fourth), juggling the day jobs, and traveling.


    # 1 What Is Data Science?


    Data science encompasses a set of principles, problem definitions, algorithms,
    and processes for extracting nonobvious and useful patterns from large data sets.
    Many of the elements of data science have been developed in related fields such
    as machine learning and data mining. In fact, the terms `data science`, `machine
    learning`, and `data mining` are often used interchangeably. The commonality across
    these disciplines is a focus on improving decision making through the analysis
    of data. However, although data science borrows from these fields, it is broader
    in scope. Machine learning (`ML`) focuses on the design and evaluation of algorithms
    for extracting patterns from data. Data mining generally deals with the analysis
    of structured data and often implies an emphasis on commercial applications. Data
    science takes all of these considerations into account but also takes up other
    challenges, such as the capturing, cleaning, and transforming of unstructured
    social media and web data; the use of big-data technologies to store and process
    big, unstructured data sets; and questions related to data ethics and regulation.


    Using data science, we can extract different types of patterns. For example, we
    might want to extract patterns that help us to identify groups of customers exhibiting
    similar behavior and tastes. In business jargon, this task is known as `customer
    segmentation`, and in data science terminology it is called `clustering`. Alternatively,
    we might want to extract a pattern that identifies products that are frequently
    bought together, a process called `association-rule mining`. Or we might want
    to extract patterns that identify strange or abnormal events, such as fraudulent
    insurance claims, a process known as `anomaly` or `outlier detection`. Finally,
    we might want to identify patterns that help us to classify things. For example,
    the following rule illustrates what a classification pattern extracted from an
    email data set might look like: If an email contains the phrase “Make money easily,”
    it is likely to be a spam email. Identifying these types of classification rules
    is known as `prediction`. The word prediction might seem an odd choice because
    the rule doesn’t predict what will happen in the future: the email already is
    or isn’t a spam email. So it is best to think of prediction patterns as predicting
    the missing value of an attribute rather than as predicting the future. In this
    example, we are predicting whether the email classification attribute should have
    the value “spam” or not.

