- raw: "    Another approach to anomaly detection is to train a prediction model,\
    \ such as a decision tree, to classify instances as anomalous or not. However,\
    \ training such a model normally requires a training data set that contains both\
    \ anomalous records and normal records. Also, it is not enough to have just a\
    \ few instances of anomalous records; in order to train a normal prediction model,\
    \ the data set needs to contain a reasonable number of instances from each class.\
    \ Ideally, the data set should be balanced; in a binary-outcome case, balance\
    \ would imply a 50:50 split in the data. In general, acquiring this type of training\
    \ data for anomaly detection is not feasible: by definition, anomalies are rare\
    \ events, occurring maybe in 1 to 2 percent or less of the data. This data constraint\
    \ precludes the use of normal, off-the-shelf prediction models. There are, however,\
    \ ML algorithms known as *one-class classifiers* that are designed to deal with\
    \ the type of imbalanced data that are typical of anomaly-detection data sets.\n\
    \n    The *one-class support-vector machine* (SVM) algorithm is a well-known one-class\
    \ classifier. In general terms, the one-class SVM algorithm examines the data\
    \ as one unit (i.e., a single class) and identifies the core characteristics and\
    \ expected behavior of the instances. The algorithm will then indicate how similar\
    \ or dissimilar each instance is from the core characteristics and expected behavior.\
    \ This information can then be used to identify instances that warrant further\
    \ investigation (i.e., the anomalous records). The more dissimilar an instance\
    \ is, the more likely that it should be investigated.\n\n    The fact that anomalies\
    \ are rare means that they can be easy to miss and difficult to identify. As a\
    \ result, data scientists often combine a number of different models to detect\
    \ anomalies. The idea is that different models will capture different types of\
    \ anomalies. In general, these models are used to supplement the known rules within\
    \ the business that already define various types of anomalous activity. The different\
    \ models are integrated together into a decision-management solution that enables\
    \ the predictions from each of the models to feed into a decision of the final\
    \ predicted outcome. For example, if a transaction is identified as fraudulent\
    \ by only one out of four models, the decision system may decide that it isn’t\
    \ a true case of fraud, and the transaction can be ignored. Conversely, however,\
    \ if three or four out of the four models have identified the transaction as possible\
    \ fraud, then the transaction would be flagged for a data scientist to investigate.\n\
    \n    Anomaly detection can be applied to many problem domains beyond credit card\
    \ fraud. More generally, it is used by clearinghouses to identify financial transactions\
    \ that require further investigation as potentially fraudulent or as cases of\
    \ money laundering. It is used in insurance-claims analysis to identify claims\
    \ that are not in keeping with a company’s typical claims. In cybersecurity, it\
    \ is used to identify network intrusions by detecting possible hacking or untypical\
    \ behavior by employees. In the medical domain, identifying anomalies in medical\
    \ records can be useful for diagnosing disease and in studying treatments and\
    \ their effects on the body. Finally, with the proliferation of sensors and the\
    \ increasing usage of Internet of Things technology, anomaly detection will play\
    \ an important role in monitoring data and alerting us when abnormal sensor events\
    \ occur and action is required.\n\n    ## Do You Want Fries with That? (Association-Rule\
    \ Mining)\n\n    A standard strategy in sales is cross-selling, or suggesting\
    \ to customers who are buying products that they may also want to purchase other\
    \ related or complementary products. The idea is to increase the customers’ overall\
    \ spending by getting them to purchase more products and at the same time to improve\
    \ customer service by reminding customers of products they probably wanted to\
    \ buy but may have forgotten to do so. The classic example of the cross-sell is\
    \ when a waiter in a hamburger restaurant asks a customer who has just ordered\
    \ a hamburger, “Do you want fries with that?” Supermarkets and retailer businesses\
    \ know that shoppers purchase products in groups, and they use this information\
    \ to set up cross-selling opportunities. For example, supermarket customers who\
    \ buy hot dogs are also likely to purchase ketchup and beer. Using this type of\
    \ information, a store can plan the layout of the products. Locating hot dogs,\
    \ ketchup, and beer near each other in the store helps customers to collect this\
    \ group of items quickly and may also boost the store sales because customers\
    \ who are purchasing hot dogs might see and purchase the ketchup and beer that\
    \ they forgot they needed. Understanding these types of associations between products\
    \ is the basis of all cross-selling.\n\n    Association-rule mining is an unsupervised-data-analysis\
    \ technique that looks to find groups of items that frequently co-occur together.\
    \ The classic case of association mining is *market-basket analysis*, wherein\
    \ retail companies try to identify sets of items that are purchased together,\
    \ such as hot dogs, ketchup, and beer. To do this type of data analysis, a business\
    \ keeps track of the set (or basket) of items that each customer bought during\
    \ each visit to the store. Each row in the data set describes one basket of goods\
    \ purchased by a particular customer on a particular visit to the store. So the\
    \ attributes in the data set are the products the store sells. Given these data,\
    \ association-rule mining looks for items that co-occur within each basket of\
    \ goods. Unlike clustering and anomaly detection, which focus on identifying similarities\
    \ or differences between instances (or rows) in a data set, association-rule mining\
    \ focuses on looking at relationships between attributes (or columns) in a data\
    \ set. In a general sense, it looks for correlations—measured as co-occurrences—between\
    \ products. Using association-rule mining, a business can start to answer questions\
    \ about its customers’ behaviors by looking for patterns that may exist in the\
    \ data. Questions that market-basket analysis can be used to answer include: *Did\
    \ a marketing campaign work? Have this customer’s buying patterns changed? Has\
    \ the customer had a major life event? Does the product location affect buying\
    \ behavior? Who should we target with our new product?*\n\n    The Apriori algorithm\
    \ is the main algorithm used to produce the association rules. It has a two-step\
    \ process:\n\n    1.  Find all combinations of items in a set of transactions\
    \ that occur with a specified minimum frequency. These combinations are called\
    \ *frequent itemsets*.\n\n    2.  Generate rules that express the probable co-occurrence\
    \ of items within frequent itemsets. The Apriori algorithm calculates the probability\
    \ of an item being present in a frequent itemset given that another item or items\
    \ are present.\n\n    The Apriori algorithm generates association rules that express\
    \ probabilistic relationships between items in frequent itemsets. An association\
    \ rule is of the form “IF *antecedent*, THEN *consequent*.” It states that an\
    \ item or group of items, the antecedent, implies the presence of another item\
    \ in the same basket of goods, the consequent, with some probability. For example,\
    \ a rule derived from a frequent itemset containing *A*, *B*, and *C* might state\
    \ that if *A* and *B* are included in a transaction, then *C* is likely to also\
    \ be included:\n\n    *IF {hot-dogs, ketchup}, THEN {beer}.*"
