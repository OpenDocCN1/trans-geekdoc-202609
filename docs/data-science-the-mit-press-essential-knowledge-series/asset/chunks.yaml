    Data science drives decision making in nearly all parts of modern societies. In
    this section, we describe three case studies that illustrate the impact of data
    science: consumer companies using data science for sales and marketing; governments
    using data science to improve health, criminal justice, and urban planning; and
    professional sporting franchises using data science in player recruitment.


    ### Data Science in Sales and Marketing


    Walmart has access to large data sets about its customers’ preferences by using
    point-of-sale systems, by tracking customer behavior on the Walmart website, and
    by tracking social media commentary about Walmart and its products. For more than
    a decade, Walmart has been using data science to optimize the stock levels in
    stores, a well-known example being when it restocked strawberry Pop-Tarts in stores
    in the path of Hurricane Francis (wait, the text says: "restocked strawberry Pop-Tarts
    in stores in the path of Hurricane Francis in 2004 based on an analysis of sales
    data preceding Hurricane Charley, which had struck a few weeks earlier"). More
    recently, Walmart has used data science to drive its retail revenues in terms
    of introducing new products based on analyzing social media trends, analyzing
    credit card activity to make product recommendations to customers, and optimizing
    and personalizing customers’ online experience on the Walmart website. Walmart
    attributes an increase of 10 to 15 percent in online sales to data science optimizations
    (DeZyre 2015).


    The equivalent of up-selling and cross-selling in the online world is the “recommender
    system.” If you have watched a movie on Netflix or purchased an item on Amazon,
    you will know that these websites use the data they collect to provide suggestions
    for what you should watch or buy next. These recommender systems can be designed
    to guide you in different ways: some guide you toward blockbusters and best sellers,
    whereas others guide you toward niche items that are specific to your tastes.
    Chris Anderson’s book *The Long Tail* (2008) argues that as production and distribution
    get less expensive, markets shift from selling large amounts of a small number
    of hit items to selling smaller amounts of a larger number of niche items. This
    trade-off between driving sales of hit or niche products is a fundamental design
    decision for a recommender system and affects the data science algorithms used
    to implement these systems.


    ### Governments Using Data Science


    In recent years, governments have recognized the advantages of adopting data science.
    In 2015, for example, the US government appointed Dr. D. J. Patil as the first
    chief data scientist. Some of the largest data science initiatives spearheaded
    by the US government have been in health. Data science is at the core of the Cancer
    Moonshot and Precision Medicine Initiatives. The Precision Medicine Initiative
    combines human genome sequencing and data science to design drugs for individual
    patients. One part of the initiative is the All of Us program, which is gathering
    environment, lifestyle, and biological data from more than one million volunteers
    to create the world’s biggest data sets for precision medicine. Data science is
    also revolutionizing how we organize our cities: it is used to track, analyze,
    and control environmental, energy, and transport systems and to inform long-term
    urban planning (Kitchin 2014a). We return to health and smart cities in chapter
    7 when we discuss how data science will become even more important in our lives
    over the coming decades.


    The US government’s Police Data Initiative has been used to predict crime. However,
    this has also raised concerns about privacy and ethics. Many organizations use
    data science to identify hot spots, but the bias in data can lead to issues. The
    key is to ensure the data is used ethically and transparently.


    ### Data Science in Professional Sports


    The movie *Moneyball* (2011) showcases how data science can give an advantage
    in modern sports. The insight was that statistics like on-base percentage and
    slugging percentage were more informative indicators of success than traditionally
    emphasized metrics. This enabled the Oakland As to recruit undervalued players.
    Many other teams now integrate similar data-driven strategies into their recruitment.


    The key to success is getting the right data and identifying patterns. In *Freakonomics:
    A Rogue Economist Explores the Hidden Side of Everything*, Steven D. Levitt and
    Stephen Dubner illustrate the importance of this observation. As they put it,
    the key to understanding modern life is “knowing what to measure and how to measure
    it” (2009, 14). Using data science, we can uncover important patterns.


    ### Why Now?


    A number of factors have contributed to the recent growth of data science. As
    we have already touched upon, the emergence of big data has been driven by the
    relative ease with which organizations can gather data. Be it through point-of-sales
    transaction records, clicks on online platforms, social media posts, apps on smart
    phones, or myriad other channels, companies can now build much richer profiles
    of individual customers. Another factor is the commoditization of data storage
    with economies of scale, making it less expensive than ever before to store data.
    There has also been tremendous growth in computer power. Graphics cards and graphical
    processing units (GPUs) were originally developed to do fast graphics rendering
    for computer games. The distinctive feature of GPUs is that they can carry out
    fast matrix multiplications, but matrix multiplications are useful not only for
    graphics rendering but also for ML. In recent years, GPUs have been adapted and
    optimized for ML use, which has contributed to large speedups in data processing
    and model training. User-friendly data science tools have also become available
    and lowered the barriers to entry into data science.

    '
