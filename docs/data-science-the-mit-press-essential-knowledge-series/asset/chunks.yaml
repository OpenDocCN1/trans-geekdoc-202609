    \ and analysis. This approach completely ignores the BI team and any data warehouse\
    \ that might exist. In many organizations, the BI and data-warehouse team is already\
    \ gathering, cleaning, transforming, and integrating the organization’s data into\
    \ one central repository. If a data warehouse already exists, then it probably\
    \ contains all or most of the data required by a project. Therefore, a data warehouse\
    \ can save a significant amount of time on integrating and cleaning the data.\
    \ It will also have much more data than the current transactional databases contain.\
    \ If the data warehouse is used, it is possible to go back a number of years,\
    \ build predictive models using the historic data, roll these models through various\
    \ time periods, and then measure each model’s level of predictive accuracy. This\
    \ process allows for the monitoring of changes in the data and how they affect\
    \ the models. In addition, it is possible to monitor variations in the models\
    \ that are produced by ML algorithms and how the models evolve over time. Following\
    \ this kind of approach facilitates the demonstration of how the models work and\
    \ behave over a number of years and helps with building up the customer’s confidence\
    \ in what is being done and what can be achieved. For example, in one project\
    \ where five years of historical data were available in the data warehouse, it\
