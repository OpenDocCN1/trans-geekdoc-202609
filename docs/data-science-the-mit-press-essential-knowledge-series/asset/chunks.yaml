- raw: "    If you spend time absorbing some of the commercial boosterism that surrounds\
    \ data science, you get a sense that any problem can be solved using data science\
    \ technology given enough of the right data. This marketing of the power of data\
    \ science feeds into a view that a data-driven approach to governance is the best\
    \ way to address complex social problems, such as crime, poverty, poor education,\
    \ and poor public health: all we need to do to solve these problems is to put\
    \ sensors into our societies to track everything, merge all the data, and run\
    \ the algorithms to generate the key insights that provide the solution.\n\n \
    \   When this argument is accepted, two processes are often intensified. The first\
    \ is that society becomes more technocratic in nature, and aspects of life begin\
    \ to be regulated by data-driven systems. Examples of this type of technological\
    \ regulation already exist—for example, in some jurisdictions data science is\
    \ currently used in parole hearings (Berk and Bleich 2013) and sentencing (Barry-Jester,\
    \ Casselman, and Goldstein 2015). For an example outside of the judicial system,\
    \ consider how smart-city technologies regulate traffic flows through cities with\
    \ algorithms dynamically deciding which traffic flow gets priority at a junction\
    \ at different times of day (Kitchin 2014b). A by-product of this technocratic\
    \ regulation is the proliferation of the sensors that support the automated regulating\
    \ systems. The second process is “control creep,” wherein data gathered for one\
    \ purpose is repurposed and used to regulate in another way (Innes 2001). For\
    \ example, road cameras that were installed in London with the primary purpose\
    \ of regulating congestion and implementing congestion charges (the London congestion\
    \ charge is a daily charge for driving a vehicle within London during peak times)\
    \ have been repurposed for security tasks (Dodge and Kitchin 2007). Other examples\
    \ of control creep include a technology called ShotSpotter that consists of a\
    \ city-wide network of microphones designed to identify gunshots and report the\
    \ locations of them but that also records conversations, some of which were used\
    \ to achieve criminal convictions (Weissman 2015), and the use of in-car navigation\
    \ systems to monitor and fine rental car drivers who drive out of state (Elliott\
    \ 2004; Kitchin 2014a).\n\n    An aspect of control creep is the drive to merge\
    \ data from different sources so as to provide a more complete picture of a society\
    \ and thereby potentially unlock deeper insights into the problems in the system.\
    \ There are often good reasons for the repurposing of data. Indeed, calls are\
    \ frequently made for data held by different branches of government to be merged\
    \ for legitimate purposes—for example, to support health research and for the\
    \ convenience of the state and its citizens. From a civil liberties perspective,\
    \ however, these trends are very concerning. Heightened surveillance, the integration\
    \ of data from multiple sources, control creep, and anticipatory governance (such\
    \ as the predictive-policing programs) may result in a society where an individual\
    \ may be treated with suspicion simply because a sequence of unrelated innocent\
    \ actions or encounters matches a pattern deemed suspicious by a data-driven regulatory\
    \ system. Living in this type of a society would change each of us from free citizens\
    \ into inmates in Bentham’s Panopticon,[⁵](#c11140_006.xhtml#FN29) constantly\
    \ self-disciplining our behaviors for fear of what inferences may be drawn from\
    \ them. The distinction between individuals who believe and act as though they\
    \ are free of surveillance and individuals who self-discipline out of fear that\
    \ they inhabit a Panopticon is the primary difference between a free society and\
    \ a totalitarian state.\n\n    ## Á la recherche du privacy perdu\n\n    As individuals\
    \ engage with and move through technically modern societies, they have no choice\
    \ but to leave a data trail behind them. In the real world, the proliferation\
    \ of video surveillance means that location data can be gathered about an individual\
    \ whenever she appears on a street or in a shop or car park, and the proliferation\
    \ of cell phones means that many people can be tracked via their phones. Other\
    \ examples of real-world data gathering include the recording of credit card purchases,\
    \ the use of loyalty schemes in supermarkets, the tracking of withdrawals from\
    \ ATMs, and the tracking of cell phone calls made. In the online world, data are\
    \ gathered about individuals when they visit or log in to websites; send an email;\
    \ engage in online shopping; rate a date, restaurant, or store; use an e-book\
    \ reader; watch a lecture in a massive open online course; or like or post something\
    \ on a social media site. To put into perspective the amount of data that are\
    \ gathered on the average individual in a technologically modern society, a report\
    \ from the Dutch Data Protection Authority in 2009 estimated that the average\
    \ Dutch citizen was included in 250 to 500 databases, with this figure rising\
    \ to 1,000 databases for more socially active people (Koops 2011). Taken together,\
    \ the data points relating to an individual define that person’s *digital footprint*.\n\
    \n    The data in a digital footprint can be gathered in two contexts that are\
    \ problematic from a privacy perspective. First, data can be collected about an\
    \ individual without his knowledge or awareness. Second, in some contexts an individual\
    \ may choose to share data about himself and his opinions but may have little\
    \ or no knowledge of or control over how these data are used or how they will\
    \ be shared with and repurposed by third parties. The terms *data shadow* and\
    \ *data footprint*[⁶](#c11140_006.xhtml#FN30) are used to distinguish these two\
    \ contexts of data gathering: an individual’s data shadow comprises the data gathered\
    \ about an individual without her knowledge, consent, or awareness, and an individual’s\
    \ data footprint consists of the pieces of data that she knowingly makes public\
    \ (Koops 2011).\n\n    The collection of data about an individual without her\
    \ knowledge or consent is of course worrying. However, the power of modern data\
    \ science techniques to uncover hidden patterns in data coupled with the integration\
    \ and repurposing of data from several sources means that even data collected\
    \ with an individual’s knowledge and consent in one context can have negative\
    \ effects on that individual that are impossible for them to predict. Today, with\
    \ the use of modern data science techniques, very personal information that we\
    \ may not want to be made public and choose not to share can still be reliably\
    \ inferred from seemingly unrelated data we willingly post on social media. For\
    \ example, many people are willing to like something on Facebook because they\
    \ want to demonstrate support to a friend. However, by simply using the items\
    \ that an individual has liked on Facebook, data-driven models can accurately\
    \ predict that person’s sexual orientation, political and religious views, intelligence\
    \ and personality traits, and use of addictive substances such as alcohol, drugs,\
    \ and cigarettes; they can even determine whether that person’s parents stayed\
    \ together until he or she was 21 years old (Kosinski, Stillwell, and Graepel\
    \ 2013). The out-of-context linkages made in these models is demonstrated by how\
    \ liking a human rights campaign was found to be predictive of homosexuality (both\
    \ male and female) and by how liking Hondas was found to be predictive of not\
    \ smoking (Kosinski, Stillwell, and Graepel 2013).\n\n    ## Computational Approaches\
    \ to Preserving Privacy\n\n    In recent years, there has been a growing interest\
    \ in computational approaches to preserving individual privacy throughout a data-analysis\
    \ process. Two of the best-known approaches are *differential privacy* and *federated\
    \ learning*."
