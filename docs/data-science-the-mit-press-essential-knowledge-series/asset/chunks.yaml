    \ project. The original consortium published a detailed (76-page) but readable\
    \ step-by-step guide to the process that is freely available online (see Chapman\
    \ et al. 1999), but the structure and major tasks of the process can be summarized\
    \ in a few pages.\n\n    The CRISP-DM life cycle consists of six stages: *business\
    \ understanding*, *data understanding*, *data preparation*, *modeling*, *evaluation*,\
    \ and *deployment*, as shown in [figure 4](#c11140_002.xhtml#fig_004). Data are\
    \ at the center of all data science activities, and that is why the CRISP-DM diagram\
    \ has data at its center. The arrows between the stages indicate the typical direction\
    \ of the process. The process is semistructured, which means that a data scientist\
    \ doesn’t always move through these six stages in a linear fashion. Depending\
    \ on the outcome of a particular stage, a data scientist may go back to one of\
    \ the previous stages, redo the current stage, or move on to the next stage.\n\
    \n    ![Figure 4 The CRISP-DM life cycle (based on figure 2 in Chapman, Clinton,\
    \ Kerber, et al. 1999).](images/11140_002_fig_004.jpg)\n\n    [Figure 4](#c11140_002.xhtml#fig_004a)\
    \ The CRISP-DM life cycle (based on [figure 2](#c11140_002.xhtml#fig_002) in Chapman,\
    \ Clinton, Kerber, et al. 1999).\n\n    In the first two stages, business understanding\
    \ and data understanding, the data scientist is trying to define the goals of\
    \ the project by understanding the business needs and the data that the business\
    \ has available to it. In the early stages of a project, a data scientist will\
    \ often iterate between focusing on the business and exploring what data are available.\
    \ This iteration typically involves identifying a business problem and then exploring\
    \ if the appropriate data are available to develop a data-driven solution to the\
    \ problem. If the data are available, the project can proceed; if not, the data\
    \ scientist will have to identify an alternative problem to tackle. During this\
    \ stage of a project, a data scientist will spend a great deal of time in meetings\
    \ with colleagues in the business-focused departments (e.g., sales, marketing,\
    \ operations) to understand their problems and with the database administrators\
    \ to get an understanding of what data are available.\n\n    Once the data scientist\
    \ has clearly defined a business problem and is happy that the appropriate data\
    \ are available, she moves on to the next phase of the CRISP-DM: data preparation.\
    \ The focus of the data-preparation stage is the creation of a data set that can\
    \ be used for the data analysis. In general, creating this data set involves integrating\
    \ data sources from a number of databases. When an organization has a data warehouse,\
    \ this data integration can be relatively straightforward. Once a data set has\
    \ been created, the quality of the data needs to be checked and fixed. Typical\
    \ data-quality problems include outliers and missing values. Checking the quality\
    \ of the data is very important because errors in the data can have a serious\
    \ effect on the performance of the data-analysis algorithms.\n\n    The next stage\
    \ of CRISP-DM is the modeling stage. This is the stage where automatic algorithms\
    \ are used to extract useful patterns from the data and to create models that\
    \ encode these patterns. Machine learning is the field of computer science that\
    \ focuses on the design of these algorithms. In the modeling stage, a data scientist\
    \ will normally use a number of different ML algorithms to train a number of different\
    \ models on the data set. A model is trained on a data set by running an ML algorithm\
    \ on the data set so as to identify useful patterns in the data and to return\
    \ a model that encodes these patterns. In some cases an ML algorithm works by\
    \ fitting a template model structure to a data set by setting the parameters of\
    \ the template to good values for that data set (e.g., fitting a linear regression\
