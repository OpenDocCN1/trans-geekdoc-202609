    数据存储层的第二部分负责管理由组织大数据源产生的数据。在这一架构中，`Hadoop` 平台被用于这些大数据的存储和分析。`Hadoop` 是由 Apache
    软件基金会开发的开源框架，专为大数据处理而设计。它利用跨越廉价服务器集群的分布式存储和处理。通过应用 `MapReduce` 编程模型，它加速了对大型数据集的查询处理。`MapReduce`
    实现了“拆分-应用-合并”（split-apply-combine）策略：(*a*) 将一个大型数据集拆分为不同的块，并将每个块存储在集群中不同的节点上；(*b*)
    然后对所有块并行应用查询；(*c*) 最后通过合并不同块上生成的结果来计算查询结果。


    然而，在过去的几年里，`Hadoop` 平台也被用企业数据仓库的扩展。数据仓库最初只存储三年的数据，但现在数据仓库可以存储超过 10 年的数据，而且这个数字还在不断增加。然而，随着数据仓库中数据量的增加，数据库和服务器的存储与处理需求也随之增加。这种需求可能会产生巨大的成本。另一种方法是将数据仓库中一些较旧的数据移动到
    `Hadoop` 集群中存储。例如，数据仓库存储最近期的数据（例如三年的数据），这些数据经常需要用于快速分析和展示，而较旧和使用频率较低的数据则存储在 `Hadoop`
    上。大多数企业级数据库都具有连接数据仓库与 `Hadoop` 的功能，允许数据科学家使用 `SQL` 查询这两个地方的数据，就好像它们都位于同一个环境中一样。她的查询可能涉及访问数据仓库数据库中的某些数据以及
    `Hadoop` 中的某些数据。查询处理将自动被分为两个不同的部分，每个部分独立运行，结果在返回给数据科学家之前会被自动组合和整合。


    数据分析与数据存储层的这两个部分都相关，见图 6。数据分析可以在数据层每个部分的数据上进行，而且在进行额外数据分析的同时，来自数据分析的结果可以在各部分之间共享。与从大数据源捕获的数据相比，传统源的数据通常相对清洁且信息密集。然而，许多大数据源的量和实时性意味着，准备和分析这些大数据源所付出的努力，可以通过传统数据无法提供的额外洞察获得回报。在许多不同研究领域（包括自然语言处理、计算机视觉和
    `ML`）开发的各种数据分析技术可用于将非结构化、低密度、低价值的大数据转换为高密度和高价值的数据。这些高价值数据可以与传统源的其他高价值数据整合，以便进一步的数据分析。


    本章描述并在图 6 中所示的内容是数据科学生态系统的典型架构。它适用于大多数组织，无论规模大小。然而，随着组织规模的扩大，其数据科学生态系统的复杂性也会之增加。例如，规模较小的组织可能不需要
    `Hadoop` 组件，但对于非常大的组织，`Hadoop` 组件将变得非常重要。


    ## 将算法移动到数据


    数据分析传统方法涉及从各种数据库提取数据、整合数据、清洗数据、划分数据集以及构建预测模型。一旦创建了预测模型，就可以将其应用于新数据。回想第 1 章，预测模型预测属性的缺失值：垃圾过滤器是一种预测模型，用于预测电子邮件的分类属性值应为“垃圾邮件”还是否。将预测模型应用于新数据中的实例以生成缺失值，被称为“数据评分”（scoring
    the data）。然后，对新数据进行评分后，最终结果可能会被加载回数据库，以便这些新数据作为某些工作流、报告仪表板或其他公司评估实践的一部分。图 7 说明了数据准备和分析中涉及的大部分数据处理位于独立于数据库和数据仓库的服务器上。因此，大量的时间花在了将数据移出数据库以及将结果移回数据库上。


    ![图 7 构建预测模型和数据数据的传统过程。](img/11140_003_fig_007.jpg)


    图 7 构建预测模型和数据数据的传统过程。


    都柏林理工学院进行的一个关于构建线性回归模型的实验为过程每个部分所需的时间提供了一个示例。大约 70%到 80%的时间花在提取和准备数据上；其余时间用于构建模型。对于数据评分，大约
    90%的时间花在提取数据和将评分后的数据集保存回数据库中；只有 10%的时间花在实际评分上。这些结果基于从 50,000 条到 150 万条记录的数据集。大多数企业数据库供应商已经意识到，不需要花时间在移动数据上就可以节省大量时间，并通过在它们的数据库引擎中整合数据分析功能和
    `ML` 算法来解决这一问题。后续章节将探讨 `ML` 算法如何集成到现代数据库中、`Hadoop` 大数据世界中的数据存储是如何工作的，以及结合使用这两种方法如何允许组织使用
    `SQL` 作为访问、分析以及实时执行 `ML` 和预测分析的通用语言，轻松处理其所有数据。


    ### 传统数据库或现代传统数据库


    '
