  trans: '

    一旦从数据源中提取了数据，就需要对数据质量进行检查。数据清洗是一个检测、清理或移除从提取数据中损坏或不准确数据的过程。例如，客户地址信息可能需要清洗，以便将其转换为标准化格式。此外，数据源中可能存在重复数据，在这种情况下，必须识别出应该使用的正确客户记录，并从数据移除所有其他记录。确保数据集中使用的值保持一致至关重要。例如，一个源头应用程序可能使用数值来代表客户信用评级，而另一个应用可能混合了数值和字符值。在这样的情况下，需要对使用何种值做出决策，然后将其他表示形式映射到标准化表示上。例如，假设数据集中的某一个属性是客户的鞋码。客户可以从世界各个地区购买鞋子，但欧洲、美国、英国等国家使用的鞋码尺码系统略有不同。在进行数据分析和建模之前，这些数据值需要进行标准化。


    数据转换涉及将数据从一个值变为另一个值的更改或组合。在这一步，可以使用多种技术，包括数据平滑、分箱和归一化，以及编写自定义代码来执行特定的转换。数据转换的一个常见例子是处理客户的年龄。在许多数据科学任务中，精确区分客户年龄并没有特别帮助。42
    岁客户和 43 岁客户之间的差异通常并不显著，尽管区分 42 岁客户和 52 岁客户可能具有信息量。因此，客户的年龄通常从原始年龄转换为通用的年龄范围。这种将年龄转换为年龄范围的过程是这种名为
    `binning`（分箱）的数据转换技术示例。尽管从技术角度来看，分箱相对直观，但这里的挑战在于识别出在分箱过程中应用的最合适的范围阈值。应用错误的阈值可能会忽略数据中重要的区别。然而，找到合适的阈值可能需要领域特定知识或试错实验的过程。


    数据整合的最后一步是创建作为机器学习（ML）算法输入的数据。这些数据被称为 `analytics base table`（分析基础表）。


    ## 创建分析基础表


    创建分析基础表最重要的一步是选择将包含在分析中的属性。这种选择基于领域知识以及对属性之间关系的分析。例如，考虑一个分析聚焦于某服务客户的场景。在这种情况下，一些指导属性设计和选择的频繁使用的领域概念包括客户合同详情、人口统计、使用情况、使用情况变化、特殊使用、生命周期阶段、网络链接等。此外，发现与其他属性具有高相关性的属性可能是冗余的，因此应该排除其中一个相关属性。移除冗余特征可以产生更简单、更容易理解的模型，并且减少机器学习算法返回一个拟合到数据中虚假模式模型的概率。所选包含的属性集定义了所谓的
    `analytics record`（分析记录）。一个分析记录通常包含原始属性和派生属性。分析基础表中的每个实例都由一个分析记录表示，因此分析记录中包含的属性集定义了将进行分析的实例的表示。


    在设计分析记录之后，需要提取并聚合一组记录以创建一个用于分析的数据集。当这些记录被创建并存储后（例如存储在数据库中），该数据集通常被称为 `analytics
    base table`。分析基础表是作为机器学习算法输入的数据集。下一章将介绍机器学习领域，并描述一些常用的机器学习算法。


    # 4 机器学习入门


    **注意**


    数据科学最好被理解为数据科学家与计算机之间的伙伴关系。在第二章中，我们描述了数据科学家遵循的过程：`CRISP-DM` 生命周期。`CRISP-DM` 定义了数据科学家必须做的一系列决策，以及他们应该参与以这些决策的活动。在
    `CRISP-DM` 中，数据科学家的主要任务是定义问题、设计数据集、准备数据、决定应用的数据分析类型，以及评估和解释数据分析的结果。计算机对这种伙伴关系的贡献是处理数据和搜索数据模式的能力。机器学习是一个开发算法的领域，计算机遵循这些算法从数据中识别并提取模式。机器学习算法技术主要应用于
    `CRISP-DM` 的建模阶段。机器学习涉及两个步骤的过程。


    首先，将机器学习算法应用于数据集，以识别数据中的有用模式。这些模式可以用许多不同的方式表示。我们将在本章的晚些部分描述一些流行的表示方法，但它们包括决策树、回归模型和神经网络。这些模式的表示被称为“模型”，这就是为什么
    `CRISP-DM` 生命周期中的这一阶段被称为“建模阶段”。简单来说，机器学习算法从数据中创建模型，每种算法都设计用于使用特定的表示形式（神经网络、决策树或其他）创建模型。


    其次，一旦创建了模型，就会被用于分析。在某些情况下，模型的结构是重要的。模型结构可以揭示领域中重要的属性。例如，在医学领域，我们可能会对中风患者的数据集应用机器学习算法，并利用模型结构来识别与中风密切相关的因素。在其他情况下，模型被用于对新示例进行标记或分类。例如，垃圾过滤器模型的主要目的是将新邮件标记为垃圾邮件或非垃圾邮件，而不是揭示垃圾邮件的定义属性。


    ## 监督学习与无监督学习


