    最后，世界在变，而模型没有。在数据集构建、模型训练和模型评估的机器学习过程中，隐含了这样一个假设：未来将与过去相同。这一假设被称为`平稳性假设`（stationarity
    assumption）：即被建模的过程或行为在时间上是保持平稳的（即它们不会改变）。数据集在本质上具有历史性，因为数据是对过去观测结果的表示。因此，机器学习算法实际上是在通过过去寻找可能泛化到未来的模式。显然，这一假设并不总是成立。数据科学家使用`概念漂移`（concept
    drift）一词来描述过程或行为随时间推移发生变化或漂移。这就是为什么模型会过时并需要重新训练，以及为什么 CRISP-DM 流程包含了图 4 所示的外圈，用以强调数据科学是迭代的。在模型部署后需要建立相应的流程，以确保模型没有失效，当它失效时，应该对其重新训练。这些决策中的大多数无法自动化，需要人类的洞察力和知识。计算机会回答它被提出的问题，但除非格外小心，否则很容易提出错误的问题。


    # 5 标准数据科学任务


    数据科学家最重要的技能之一是将现实世界中的问题表述为标准数据科学任务的能力。大多数数据科学项目可以归类为以下四类通用任务之一：


    *   聚类（或分群）

    *   异常（或离群点）检测

    *   关联规则挖掘

    *   预测（包括分类和回归子问题）


    了解项目目标是哪种任务有助于做出许多项目决策。例如，训练预测模型要求数据集中的每个实例都包含目标属性的值。因此，知道项目正在进行预测可以为数据集设计提供指导（通过需求实现）。理解任务也有助于使用哪种（哪些）机器学习算法。尽管有大量的机器学习算法，但每种算法都是为特定的数据挖掘任务设计的。例如，生成决策树模型的机器学习算法主要是为预测任务设计的。机器学习算法与任务之间存在“多对一”的关系，因此知道任务并不能告诉您具体应该使用哪种算法，但它定义了一组为该任务设计的算法。由于数据科学任务同时影响着数据集设计和机器学习算法的选择，关于项目将针对何种任务的决策必须在项目生命周期早期做出，最好是在
    CRISP-DM 生命周期周期的业务理解阶段。为了更好地理解这些任务，本章将描述一些标准业务问题是如何映射到任务的。


    ## 我们的客户是谁？（聚类）


    数据科学在业务中最频繁的应用领域之一是支持营销和销售活动。设计有针对性的营销活动需要对目标客户有深入。大多数企业拥有具有各种需求的化客户，因此使用“一刀切”的方法可能会导致大部分客户群体失效。更好的方法是尝试识别出若干客户画像或客户特征，每个特征都对应一个重要的细分群体。


    处理这一问题的标准数据科学方法是将问题表述为`聚类`任务。聚类涉及将实例分为子组。通常，聚类要求分析师首先决定他们想要识别的组数量。这一决策可能基于领域知识，或由项目目标启发。然后在数据上运行聚类算法，并将所需的组数量作为算法参数之一。随后算法根据属性值的相似性创建相应数量的子组。一旦算法创建了聚类，人类专家将对其进行审查，以解释它们是否具有意义。在设计营销活动的背景下，这种审查涉及检查分组是否反映了合理的画像，或者是否识别出了此前未考虑过的新画像。


    用于描述聚类客户的属性范围非常广泛。一些典型的例子包括人口统计信息（年龄、性别等）、位置（邮政编码、农村或城市地址等）、交易信息（例如他们购买过哪些产品或服务）、公司从他们身上产生的收入、成为客户多久、是否是会员卡计划成员、是否曾经退过货或对服务提出过投诉等。正如所有数据科学项目一样，聚类面临的最大挑战之一是决定包含哪些属性以及排除哪些属性，以获得最佳结果。对属性选择做出这一决策将涉及实验的迭代以及对每次迭代结果的人类分析。


    众为人知的用于聚类的机器学习算法是 `k-means` 算法。名称中的 `k` 表示该算法在数据中寻找 `k` 个聚类。`k` 的值是预先定义的，通常通过对不同
    `k` 值进行试错实验来设定。`k-means` 算法假设数据集中描述客户的所有属性都是数值。如果数据集包含非数值属性，则需要将这些属性映射为数值以便使用
    `k-means`，或者需要修改算法以处理这些非数值值。该算法将每个客户视为点云（或散点图）中的一点，客户的位置由其画像中的属性值决定。算法的目标是找到点云中每个聚类中心的位置。有
    `k` 个聚类，因此就有 `k` 个聚类中心（或均值）——这就是算法名称的由来。

