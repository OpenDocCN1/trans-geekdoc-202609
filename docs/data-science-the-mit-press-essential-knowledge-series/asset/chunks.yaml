- raw: "    The term *customer churn* is used to describe the process of customers\
    \ leaving one service and joining another. So the problem of predicting which\
    \ customers are likely to leave in the near future is known as *churn prediction*.\
    \ As the name suggests, this is a prediction task. The prediction task is to classify\
    \ a customer as being a churn risk or not. Many companies are using this kind\
    \ of analysis to predict churn customers in the telecommunications, utilities,\
    \ banking, insurance, and other industries. A growing area that companies are\
    \ focusing on is the prediction of staff turnover or staff churn: which staff\
    \ are likely to leave the company within a certain time period.\n\n    When a\
    \ prediction model returns a label or category for an input, it is known as a\
    \ *classification model*. Training a classification model requires historic data,\
    \ where each instance is labeled to indicate whether the target event has happened\
    \ for that instance. For example, customer-churn classification requires a data\
    \ set in which each customer (one row per customer) is assigned a label indicating\
    \ whether he or she has churned. The data set will include an attribute, known\
    \ as the *target attribute*, that lists this label for each customer. In some\
    \ instances, assigning a churn label to a customer record is a relatively straightforward\
    \ task. For example, the customer may have contacted the organization and explicitly\
    \ canceled his subscription or contract. However, in other cases the churn event\
    \ may not be explicitly signaled. For example, not all cell phone customers have\
    \ a monthly contract. Some customers have a pay-as-you-go (or prepay) contract\
    \ in which they top up their account at irregular intervals when they need more\
    \ phone credit. Defining whether a customer with this type of contract has churned\
    \ can be difficult: Has a customer who hasn’t made a call in two weeks churned,\
    \ or is it necessary for a customer to have a zero balance and no activity for\
    \ three weeks before she is considered to have churned? Once the churn event has\
    \ been defined from a business perspective, it is then necessary to implement\
    \ this definition in code in order to assign a target label to each customer in\
    \ the data set.\n\n    Another complicating factor in constructing the training\
    \ data set for a churn-prediction model is that time lags need to be taken into\
    \ account. The goal of churn prediction is to model the propensity (or likelihood)\
    \ that a customer will churn at some point in the future. As a consequence, this\
    \ type of model has a temporal dimension that needs to be considered during the\
    \ creation of the data set. The set of attributes in a propensity-model data set\
    \ are drawn from two separate time periods: the *observation period* and the *outcome\
    \ period*. The observation period is when the values of the input attributes are\
    \ calculated. The outcome period is when the target attribute is calculated. The\
    \ business goal of creating a customer-churn model is to enable the business to\
    \ carry out some sort of intervention before the customer churns—in other words,\
    \ to entice the customer to stay with the service. This means that the prediction\
    \ about the customer churning must be made sometime in advance of the customer’s\
    \ actually leaving the service. The length of this period is the length of the\
    \ outcome period, and the prediction that the churn model returns is actually\
    \ that a customer will churn within this outcome period. For example, the model\
    \ might be trained to predict that the customer will churn within one month or\
    \ two months, depending on the speed of the business process to carry out the\
    \ intervention.\n\n    Defining the outcome period affects what data should be\
    \ used as input to the model. If the model is designed to predict that a customer\
    \ will churn within two months from the day the model is run on that customer’s\
    \ record, then when the model is being trained, the input attributes that describe\
    \ the historic customers who have already churned should be calculated using only\
    \ the data that were available about those customers two months prior to their\
    \ leaving the service. The input attributes describing currently active customers\
    \ should similarly be calculated with the data available about these customers’\
    \ activity two months earlier. Creating the data set in this way ensures that\
    \ all the instances in the data set, including both churned and active customers,\
    \ describe the customers at the time in their individual customer journeys that\
    \ the model is being designed to make a prediction about them: in this example,\
    \ two months *before* they churn or stay.\n\n    Nearly all customer-propensity\
    \ models will use attributes describing the customer’s demographic information\
    \ as input: *age*, *gender*, *occupation*, and so on. In scenarios relating to\
    \ an ongoing service, they are also likely to include attributes describing the\
    \ customer’s position in the customer life cycle: *coming on board*, *standing\
    \ still midcycle*, *approaching end of a contract*. There are also likely to be\
    \ attributes that are specific to the industry. For example, typical attributes\
    \ used in telecommunication industry customer-churn models include the customer’s\
    \ average bill, changes in billing amount, average usage, staying within or generally\
    \ exceeding plan minutes, the ratio of calls within the network to those outside\
    \ the network, and potentially the type of phone used.[¹](#c11140_005.xhtml#FN24)\
    \ However, the specific attributes used in each model will vary from one project\
    \ to the next. Gordon Linoff and Michael Berry (2011) report that in one churn-prediction\
    \ project in South Korea, the researchers found it useful to include an attribute\
    \ that described the churn rate associated with a customer’s phone (i.e., What\
    \ percentage of customers with this particular phone churned during the observation\
    \ period?). However, when they went to build a similar customer-churn model in\
    \ Canada, the handset/churn-rate attribute was useless. The difference was that\
    \ in South Korea the cell phone service company offered large discounts on new\
    \ phones to new customers, whereas in Canada the same discounts were offered to\
    \ both existing and new customers. The overall effect was that in South Korea\
    \ phones going out of date drove customer churn; people were incentivized to leave\
    \ one operator for another in order to avail themselves of discounts, but in Canada\
    \ this incentive to leave did not exist.\n\n    Once a labeled data set has been\
    \ created, the major stage in creating a classification model is to use an ML\
    \ algorithm to build the classification model. During modeling, it is good practice\
    \ to experiment with a number of different ML algorithms to find out which algorithm\
    \ works best on the data set. Once the final model has been selected, the likely\
    \ accuracy of the predictions of this model on new instances is estimated by testing\
    \ it on a subset of the data set that was not used during the model-training phase.\
    \ If a model is deemed accurate enough and suitable for the business need, the\
    \ model is then deployed and applied to new data either in a batch process or\
    \ in real time. A really important part of deploying the model is ensuring that\
    \ the appropriate business processes and resources are put in place so that the\
    \ model is used effectively. There is no point in creating a customer-churn model\
    \ unless there is a process whereby the model’s predictions result in triggering\
    \ customer interventions so that the business retains customers."
