  trans: "\n目前，公众对政府监控以及互联网公司收集、存储和分析人员数据的行为普遍持负面态度。今天，大多数评论人士认为，数据隐私立法需要进行更新，而且这种变化正在发生。2012\
    \ 年，`EU`和美国都发布了与数据保护和隐私政策相关的审查和更新报告（欧盟委员会 2012；联邦贸易委员会 2012；Kitchin 2014a, 173）。2013\
    \ 年，`OECD` 指南得到了扩展，其更新内容在当时包含了更多关于实施问责制原则的细节说明。特别是，新准则规定了数据控制者有建立隐私管理计划的责任，并明确规定了此类计划的内容，以及在个人数据风险管理方面应如何构建框架（OECD\
    \ 2013）。\n\n2014 年，一名西班牙公民马里奥·科斯哈·冈斯莱斯在欧洲法院起诉`Google`（`C-131/12 [2014]`），成功主张了他的“被遗忘权”。法院认定，在某些条件下，个人可以请求互联网搜索引擎移除因搜索其姓名而产生的网页链接。此类此类请求的理由包括数据不准确或过时，或者数据保留时间超过了历史、统计或科学目的的必要期限。这项裁决对所有互联网搜索引擎都有重大影响，但也可能对其他大数据积聚者产生影响。例如，目前尚不清楚这对`Facebook`和`Twitter`等社交媒体网站意味着什么（Marr\
    \ 2015）。 \n\n“被遗忘权”的概念在其他司法管辖区也得到了主张。例如，加利福尼亚州的“删除法”规定未成年人有权根据其要求删除其在互联网或移动服务上发布的内容。该法律还禁止互联网、在线或手机服务公司为了精准广告之目的收集未成年人的个人数据，或允许第三方这样做。\n\
    \n作为正在发生变化的最后一个例子，2016 年签署并通过了`EU-US Privacy Shield`（隐私盾）（欧盟委员会 2016）。其重点是协调两个司法管辖区之间的数据隐私义务。其目的是在数据被转移到`EU`之外的情况下，加强`EU`公民的数据保护权利。该协议对商业公司在数据使用的透明度方面施加了更严格的义务，并规定了强大的监督机制和可能的制裁，同时也对公共机构在记录或访问个人数据方面了限制和监督机制。\n\
    \n然而，在写作此时，`EU-US Privacy Shield`的效力和有效性正在爱尔兰法院的一起法律案件中接受测试。爱尔兰法律体系之所以成为辩论的核心，是因为许多美国大型互联网公司（`Google`、`Facebook`、`Twitter`等）的欧洲、中东和非洲总部位于爱尔兰。因此，爱尔兰的数据保护专员负责执行针对这些公司跨境数据传输的`EU`法规。\n\
    \n近期历史说明，法律案件可能会导致人员数据处理规定方面发生重大且快速的变化。事实上，`EU-US Privacy Shield`是奥地利律师兼隐私活动人士马克斯·施雷姆斯（Max\
    \ Schrems）对`Facebook`提起诉讼的直接结果。施雷姆斯在 2015 年的案件结果是使现有的`EU-US Safe Harbor`（安全港）协议立刻失效，而`EU-US\
    \ Privacy Shield`则是针对这一结果的应急响应而开发的。与最初的`Safe Harbor`协议相比，`Privacy Shield`加强了`EU`公民的数据隐私权利（O’Rourke\
    \ and Kerr 2017），而且任何新框架都很可能进一步加强这些权利。例如，《欧盟通用数据保护条例》（（GDPR）将从 2018 年 5 月起为`EU`公民提供法律强制的数据保护。\n\
    \n从数据科学的角度来看，这些例子说明围绕数据隐私和保护的法规处于变动之中。诚然，这里列出的例子来自`US`和`EU`背景，但它们指示了隐私和数据监管方面更广泛的趋势。要预测这些变化长期将如何发展非常困难。该领域存在各种利益集团：考虑大型互联网、广告和保险公司、情报机构、执法部门、政府、医学和社会科学研究机构以及公民自由团体之间截然不同的议程。社会中这些不同部门在数据使用方面有不同的目标和需求，因此对数据隐私监管应如何成型有不同的观点。\n\
    \n此外，我们作为个人，观点可能会根据我们采取的视角而发生变化。例如，我们可能很乐意个人数据在医学研究背景下被共享和重复利用。然而，正如欧洲和美国的民意调查报告的那样，我们许多人对精准广告背景下的数据收集、重复利用和共享持有保留意见。\n\
    \n广而言之，关于数据隐私未来的论述有两个主题。一种观点主张加强与个人数据收集相关的法规，并在某些情况下赋予个人控制其数据如何被收集、共享和使用的。另一种观点主张放宽数据收集的监管，但也主张通过加强法律来纠正对人员数据的滥用。由于有这么多不同的利益相关者和观点，对于隐私和数据问题没有简单或显而易见的答案。最终开发的解决方案可能会根据行业定义，并由相关利益相关者通过谈判达成妥协。\n\
    \n在这样流动的背景下，最好的做法是保守且符合伦理的。当我们为业务问题开发新的数据科学解决方案时，应该考虑与个人数据相关的伦理问题。这样做有良好的业务理由。首先，在个人数据方面遵循伦理和透明将确保企业与客户建立良好关系。围绕个人数据的不当做法会对企业造成严重的声誉损害，并导致客户流向竞争对手（Buytendijk\
    \ and Heiser 2013）。其次，随着数据整合、重复利用、画像分析和定位的加强，未来公众对数据隐私的观点可能会硬化，从而导致更严格的监管。有意识地保持透明和符合伦理，是确保我们开发的数据科学解决方案不违反现有法规或未来可能出现的法规的最佳方式。\n"
