- raw: "    Japan has embraced the smart-city concept with a particular focus on reducing\
    \ energy usage. The Tokyo Electric Power Company (TEPC) has installed more than\
    \ 10 million smart meters across homes in the TEPC service area.[²](#c11140_007.xhtml#FN36)\
    \ At the same time, TEPC is developing and rolling out smart-phone applications\
    \ that enable customers to track the electricity used in their homes in real time\
    \ and to change their electricity contract. These smart-phone applications also\
    \ enable the TEPC to send each customer personalized energy-saving advice. Outside\
    \ of the home, smart-city technology can be used to reduce energy usage through\
    \ intelligent street lighting. The Glasgow Future Cities Demonstrator is piloting\
    \ street lighting that switches on and off depending on whether people are present.\
    \ Energy efficiency is also a top priority for all new buildings, particularly\
    \ for large local government and commercial buildings. These buildings’ energy\
    \ efficiency can be optimized by automatically managing climate controls through\
    \ a combination of sensor technology, big data, and data science. An extra benefit\
    \ of these smart-building monitoring systems is that they can monitor for levels\
    \ of pollution and air quality and can activate the necessary controls and warnings\
    \ in real time.\n\n    Transport is another area where cities are using data science.\
    \ Many cities have implemented traffic-monitoring and management systems. These\
    \ systems use real-time data to control the flow of traffic through the city.\
    \ For example, they can control traffic-light sequences in real time, in some\
    \ cases to give priority to public-transport vehicles. Data on city transport\
    \ networks are also useful for planning public transport. Cities are examining\
    \ the routes, schedules, and vehicle management to ensure that services support\
    \ the maximum number of people and to reduce the costs associated with delivering\
    \ the transport services. In addition to modeling the public network, data science\
    \ is also being used to monitor official city vehicles to ensure their optimal\
    \ usage. Such projects combine traffic conditions (collected by sensors along\
    \ the road network, at traffic lights, etc.), the type of task being performed,\
    \ and other conditions to optimize route planning, and dynamic route adjustments\
    \ are fed to the vehicles with live updates and changes to their routes.\n\n \
    \   Beyond energy usage and transport, data science is being used to improve the\
    \ provision of utility services and to implement longer-term planning of infrastructure\
    \ projects. The efficient provision of utility services is constantly being monitored\
    \ based on current usage and projected usages, and the monitoring takes into account\
    \ previous usage in similar conditions. Utility companies are using data science\
    \ in a number of ways. One way is monitoring the delivery network for the utility:\
    \ the supply, the quality of the supply, any network issues, areas that require\
    \ higher-than-expected usage, automated rerouting of the supply, and any anomalies\
    \ in the network. Another way that utility companies are using data science is\
    \ in monitoring their customers. They are looking for unusual usage that might\
    \ indicate some criminality (for example, a grow house), customers who may have\
    \ altered the equipment and meters for the building where they live, and customers\
    \ who are most likely to default on their payments. Data science is also being\
    \ used in examining the best way to allocate housing and associated services in\
    \ city planning. Models of population growth are built to forecast into the future,\
    \ and based on various simulations the city planners can estimate when and where\
    \ certain support services, such as high schools, are needed.\n\n    ## Data Science\
    \ Project Principles: Why Projects Succeed or Fail\n\n    A data science project\
    \ sometimes fails insofar as it doesn’t deliver what was hoped for because it\
    \ gets bogged down in some technical or political issues, does not deliver useful\
    \ results, and, more typically, is run once (or a couple of times) but never run\
    \ again. Just like Leo Tolstoy’s happy families,[³](#c11140_007.xhtml#FN37) the\
    \ success of a data science project is dependent on a number of factors. Successful\
    \ data science projects need focus, good-quality data, the right people, the willingness\
    \ to experiment with multiple models, integration into the business information\
    \ technology (IT) architecture and processes, buy-in from senior management, and\
    \ an organization’s recognition that because the world changes, models go out\
    \ of date and need to be rebuilt semiregularly. Failure in any of these areas\
    \ is likely to result in a failed project. This section details the common factors\
    \ that determine the success of data science projects as well as the typical reasons\
    \ why data science projects fail.\n\n    ### Focus\n\n    Every successful data\
    \ science project begins by clearly defining the problem that the project will\
    \ help solve. In many ways, this step is just common sense: it is difficult for\
    \ a project to be successful unless it has a clear goal. Having a well-defined\
    \ goal informs the decisions regarding which data to use, what ML algorithms to\
    \ use, how to evaluate the results, how the analysis and models will be used and\
    \ deployed, and when the optimal time might be to go through the process again\
    \ to update the analysis and models.\n\n    ### Data\n\n    A well-defined question\
    \ can be used to define what data are needed for the project. Having a clear understanding\
    \ of what data are needed helps to direct the project to where these required\
    \ data are located. It also helps with defining what data are currently unavailable\
    \ and hence identifies some additional projects that can look at capturing and\
    \ making available these data. It is important, however, to ensure that the data\
    \ used are good-quality data. Organizations may have applications that are poorly\
    \ designed, a very poor data model, and staff who are not trained correctly to\
    \ ensure that good data get entered. In fact, myriad factors can lead to bad-quality\
    \ data in systems. Indeed, the need for good-quality data is so important that\
    \ some organizations have hired people to constantly inspect the data, assess\
    \ the quality of the data, and then feed back ideas on how to improve the quality\
    \ of the data captured by the applications and by the people inputting the data.\
    \ Without good-quality data, it is very difficult for a data science project to\
    \ succeed."
