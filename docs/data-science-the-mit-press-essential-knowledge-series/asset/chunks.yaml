- raw: "    Ordinal attributes are similar to nominal attributes, with the difference\
    \ that it is possible to apply a rank order over the categories of ordinal attributes.\
    \ For example, an attribute describing the response to a survey question might\
    \ take values from the domain “strongly dislike, dislike, neutral, like, and strongly\
    \ like.” There is a natural ordering over these values from “strongly dislike”\
    \ to “strongly like” (or vice versa depending on the convention being used). However,\
    \ an important feature of ordinal data is that there is no notion of equal distance\
    \ between these values. For example, the cognitive distance between “dislike”\
    \ and “neutral” may be different from the distance between “like” and “strongly\
    \ like.” As a result, it is not appropriate to apply arithmetic operations (such\
    \ as averaging) on ordinal attributes. In [table 1](#c11140_002.xhtml#T1), the\
    \ “edition” attribute is an example of an ordinal attribute. The distinction between\
    \ nominal and ordinal data is not always clear-cut. For example, consider an attribute\
    \ that describes the weather and that can take the values “sunny,” “rainy,” “overcast.”\
    \ One person might view this attribute as being nominal, with no natural order\
    \ over the values, whereas another person might argue that the attribute is ordinal,\
    \ with “overcast” being treated as an intermediate value between “sunny” and “rainy”\
    \ (Hall, Witten, and Frank 2011).\n\n    The data type of an attribute (numeric,\
    \ ordinal, nominal) affects the methods we can use to analyze and understand the\
    \ data, including both the basic statistics we can use to describe the distribution\
    \ of values that an attribute takes and the more complex algorithms we use to\
    \ identify the patterns of relationships between attributes. At the most basic\
    \ level of analysis, numeric attributes allow arithmetic operations, and the typical\
    \ statistical analysis applied to numeric attributes is to measure the central\
    \ tendency (using the mean value of the attribute) and the dispersion of the attributes\
    \ values (using the variance or standard deviation statistics). However, it does\
    \ not make sense to apply arithmetic operations to nominal or ordinal attributes.\
    \ So the basic analysis of these types of attributes involves counting the number\
    \ of times each of the values occurs in the data set or calculating the proportion\
    \ of occurrence of each value or both.\n\n    Data are generated through a process\
    \ of abstraction, so any data are the result of human decisions and choices. For\
    \ every abstraction, somebody (or some set of people) will have made choices with\
    \ regard to what to abstract from and what categories or measurements to use in\
    \ the abstracted representation. The implication is that data are never an objective\
    \ description of the world. They are instead always partial and biased. As Alfred\
    \ Korzybski has observed, “A map is not the territory it represents, but, if correct,\
    \ it has a similar structure to the territory which accounts for its usefulness”\
    \ (1996, 58).\n\n    In other words, the data we use for data science are not\
    \ a perfect representation of the real-world entities and processes we are trying\
    \ to understand, but if we are careful in how we design and gather the data that\
    \ we use, then the results of our analysis will provide useful insights into our\
