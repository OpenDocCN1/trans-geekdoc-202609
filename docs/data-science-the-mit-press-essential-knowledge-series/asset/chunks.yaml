- raw: "    The progenitor of most modern ML algorithms for decision-tree learning\
    \ is the *ID3 algorithm* (Quinlan 1986). ID3 builds a decision tree in a recursive,\
    \ depth-first manner, adding one node at a time, starting with the root node.\
    \ It begins by selecting an attribute to test at the root node. A branch is grown\
    \ from the root for each value in the domain of this test attribute and is labeled\
    \ with that value. For example, a node with a binary test attribute will have\
    \ two branches descending from it. The data set is then divided up: each instance\
    \ in the data set is pushed down the branch and given a label that matches the\
    \ value of the test attribute for the instance. ID3 then grows each branch using\
    \ the same process used to create the root node: select a test attribute, add\
    \ a node with branches, split the data by funneling the instances down the relevant\
    \ branches. This process continues until all the instances on a branch have the\
    \ same value for the target attribute, in which case a terminating node is added\
    \ to the tree and labeled with the target attribute value shared by all the instances\
    \ on the branch.[^(11)](#c11140_004.xhtml#FN21)\n\n    ID3 chooses the attribute\
    \ to test at each node in the tree so as to minimize the number of tests required\
    \ to create pure sets (i.e., sets of instances that have the same value for the\
    \ target attribute). One way to measure the purity of a set is to use Claude Shannon’s\
    \ *entropy* metric. The minimum possible entropy for a set is zero, and a pure\
    \ set has an entropy of zero. The numeric value of the maximum possible entropy\
    \ for a set depends on the size of the set and the number of different types of\
    \ elements that can be in the set. A set will have maximum entropy when all the\
    \ elements in it are of different types.[^(12)](#c11140_004.xhtml#FN22) ID3 selects\
    \ the attribute to test at a node to be the attribute that results in the lowest-weighted\
    \ entropy after splitting the data set at the node using this attribute. The weighted\
    \ entropy for an attribute is calculated by (1) splitting the data set using the\
    \ attribute; (2) calculating the entropy of the resulting sets; (3) weighting\
    \ each of these entropies by the fraction of data that is in the set; and (4)\
    \ then summing the results.\n\n    [Table 3](#c11140_004.xhtml#T3) lists a data\
    \ set of emails in which each email is described by a number of attributes and\
    \ whether it is a spam email or not. The “attachment” attribute is true for emails\
    \ that have an attachment and false otherwise (in this sample of emails, none\
    \ of the emails has an attachment). The “suspicious words” attribute is true if\
    \ the email contains one or more words on a predefined list of suspicious words.\
    \ The “unknown sender” attribute is true if the sender of the email is not in\
    \ the recipient’s address book. This is the data set that was used to train the\
    \ decision tree shown in [figure 16](#c11140_004.xhtml#fig_016). In this data\
    \ set, the attributes “attachment,” “suspicious words,” and “unknown sender” are\
    \ the input attributes and the “spam” attribute is the target. The “unknown sender”\
    \ attribute splits the data set into purer sets more than any of the other attributes\
    \ does (one set containing instances where “Spam = True” and another set in which\
    \ “Spam = False” for the majority of instances). As a consequence, “unknown sender”\
    \ is put at the root node (see [figure 17](#c11140_004.xhtml#fig_017)). After\
    \ this initial split, all of the instances on the right branch have the same target\
    \ value. However, the instances on the left branch have different values for the\
    \ target. Splitting the instances on the left branch using the “suspicious words”\
    \ attribute results in two pure sets: one where “Spam = False” and another where\
    \ “Spam = True.” So “suspicious words” is selected as the test attribute for a\
    \ new node on the left branch (see [figure 18](#c11140_004.xhtml#fig_018)). At\
    \ this point, the data subsets at the end of each branch are pure, so the algorithm\
    \ finishes and returns the decision tree shown in [figure 16](#c11140_004.xhtml#fig_016).\n\
    \n    ![Table 3 A Data Set of Emails: Spam or Not Spam?](images/11140_004_T3.png)\n\
    \n    [Table 3](#c11140_004.xhtml#T3a) A Data Set of Emails: Spam or Not Spam?\n\
    \n    ![Figure 17 Creating the root node in the tree.](images/11140_004_fig_017.jpg)\n\
    \n    [Figure 17](#c11140_004.xhtml#fig_017a) Creating the root node in the tree.\n\
    \n    ![Figure 18 Adding the second node to the tree.](images/11140_004_fig_018.jpg)\n\
    \n    [Figure 18](#c11140_004.xhtml#fig_018a) Adding the second node to the tree.\n\
    \n    One of the strengths of decision trees is that they are simple to understand.\
    \ Also it is possible to create very accurate models based on decision trees.\
    \ For example, a *random-forest model* is composed of a set of decision trees,\
    \ where each tree is trained on a random subsample of the training data, and the\
    \ prediction returned by the model for an individual query is the majority prediction\
    \ across all the trees in the forest. Although decision trees work well with both\
    \ nominal and ordinal data, they struggle with numeric data. In a decision tree,\
    \ a separate branch descends from each node for each value in the domain of the\
    \ attribute tested at the node. Numeric attributes, however, have an infinite\
    \ number of values in their domains, with the implication that a tree would need\
    \ an infinite number of branches. One solution to this problem is to transform\
    \ numeric attributes into ordinal attributes, although doing so requires the definition\
    \ of appropriate thresholds, which can also be difficult.\n\n    Finally, because\
    \ a decision-tree-learning algorithm repeatedly divides a data set as a tree becomes\
    \ large, it becomes more sensitive to noise (such as mislabeled instances). The\
    \ subset of examples on each branch becomes smaller, and so the data sample each\
    \ classification rule is based on becomes smaller. The smaller the data sample\
    \ used to define a classification rule, the more sensitive to noise the rule becomes.\
    \ As a consequence, it is a good idea to keep decision trees shallow. One approach\
    \ is to stop the growth of a branch when the number of instances on the branch\
    \ is still less than a predefined threshold (e.g., 20 instances). Other approaches\
    \ allow the tree to grow and then prune the tree back. These approaches typically\
    \ use statistical tests or the performance of the model on a set of instances\
    \ specifically chosen for this task to identify splits near the bottom of the\
    \ tree that should be removed.\n\n    ## Bias in Data Science\n\n    The goal\
    \ of ML is to create models that encode appropriate generalizations from data\
    \ sets. Two major factors contribute to the generalization (or model) that an\
    \ ML algorithm will generate from a data set. The first is the data set the algorithm\
    \ is run on. If the data set is not representative of the population, then the\
    \ model the algorithm generates won’t be accurate. For example, earlier we developed\
    \ a regression model that predicted the likelihood that an individual will develop\
    \ Type 2 diabetes based on his BMI. This model was generated from a data set of\
    \ American white males. As a consequence, this model is unlikely to be accurate\
    \ if used to predict the likelihood of diabetes for females or for males of different\
    \ race or ethnic backgrounds. The term *sample bias* describes how the process\
    \ used to select a data set can introduce biases into later analysis, be it a\
    \ statistical analysis or the generation of predictive models using ML."
