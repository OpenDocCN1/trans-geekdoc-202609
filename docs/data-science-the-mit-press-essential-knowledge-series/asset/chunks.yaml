    数据科学的矛盾方面往往在同一个应用中显而易见。例如，在健康保险承保中，数据科学利用了第三方营销数据集，这些数据集包含了购买习惯、网络搜索历史等信息，以及与个人生活方式相关的数百个其他属性（Batty,
    Tripathi, Kroll, et al. 2010）。使用这些第三方数据是有麻烦的，因为它可能会引发“自我约束”，即人们为了担心产生更高的保费，而避免某些活动，例如访问极端运动网站（Mayer-Schönberger
    and Cukier 2014）。然而，支持使用这些数据的理由是，它们可以作为其他更具侵入性且昂贵的信息源（如血检）的替代方案，从远来看可以降低成本和保费，从而增加健康保险人数（Batty,
    Tripathi, Kroll, et al. 2010）。


    在利用数据科学的商业利益与伦理考虑的辩论中，裂痕在围绕使用个人数据进行定向营销的讨论中显而易见。从业务广告的角度来看，使用个人数据的动力在于：一方面，个性化营销、服务和产品与营销有效性之间存在某种关系。研究表明，使用个人社交网络数据（例如识别与老客户相连的消费者）将电信服务的直邮营销活动效率比传统营销方法提高三到五倍（Hill,
    Provost, and Volinsky 2006）。关于数据驱动的在线营销个性化的有效性，也有类似的此类张。例如，一项关于 2010 年美国在线定向广告成本和有效性的研究，将`run-of-the-network`营销（即将广告活动推送到一系列网站，而不对特定用户或网站进行针对性投放）与`behavioral
    targeting`¹ 进行对比（Beales 2010）。该研究发现，行为营销不仅更昂贵（高出 2.68 倍），而且更有效，其转化率是网络投放营销的两倍以上。另一项关于数据驱动在线广告有效性的知名研究是由多伦多大学和麻理工学院（MIT）的研究人员进行的（Goldfarb
    and Tucker 2011）。他们利用欧盟（EU）通过一项隐私保护法案的实施[²，该法案限制了广告公司跟踪用户在线行为的能力，以比较在这些限制下（即在欧盟境内）在线广告的有效性，以及在没有新限制下（即在美国和其他非欧盟国家）在线广告的有效性。该研究发现，在新限制下，在线广告的有效性显著下降，受访参与者所记录的购买意向报告下降了
    65%。这项研究的结果曾引起争议（参见，例如 Mayer and Mitchell 2012），但该研究被用于支持这样一个论点：关于一个人的数据越多，针对该人员投放的广告就越有效。数据驱动定向营销的支持者将这一论点定性为广告商和消费者的双赢，声称广告商降低了成本，而消费者获得了更具相关性的广告。


    这种对利用个人数据进行定向营销的乌托邦式观点，充其量只是基于对问题的选择性理解。与定向广告相关的最令人担忧的故事于 2012 年报道在《纽约时报》上（Duhigg
    2012），涉及美国折扣商店 Target。众所周知，人生中发生剧烈变化的时刻之一是受孕和出生。由于这种变化，营销人员将怀孕视为一个机会，可以在准妈妈不告诉
    Target 的情况下，为新父母触发个性化营销。³ 这种洞察使 Target 能够早期识别出孕妇客户。为了实现这一点，Target 启动了一个数据科学项目，旨在通过分析购物习惯来预测客户是否怀孕。该项目的起点是分析参加了
    Target 婴儿送宴登记（baby-shower registry）的女性的购物习惯。分析显示，孕妇在怀孕中期初期倾向于购买较数量的无味乳液，并在怀孕前
    20 周内购买某些饮食补充剂。基于这一分析，Target 创建了一个数据驱动模型，使用大约 25 种产品和指标，并为每个客户分配了一个`pregnancy-prediction`（怀孕预测）分数。找个好听的词，这个模型的成功变得显而易见，当时一个男子出现在
    Target 商店抱怨，他读高中的女儿收到了婴儿服和婴儿床的优惠券。他指责 Target 试图鼓励他的怀孕。然而，在随后的几天里，事实证明这个人的女儿确实怀孕了，但没有告诉任何人。Target
    的怀孕预测模型能够识别出一名怀孕的高中生并根据此信息采取行动。


    ## 数据科学的伦理影响：画像与歧视


    关于 Target 在未经许可或不知情的情况下识别出怀孕高中生的故事，凸显了数据科学如何被用于社会画像，不仅针对个人，也针对社会少数群体。在其著作《The
    Daily You: How the New Advertising Industry Is Defining Your Identity and Your
    Worth》（2013）中，Joseph Turow 讨论了营销人员如何利用数字画像将人分类为“目标”（`targets`）或“浪费”（`waste`），然后利用这些类别对针对个人消费者的优惠和促销进行个性化：“被视为浪费的人会被忽略，或者被推向营销人员认为与其品味或收入更相关的其他产品”（11）。这种个性化可能导致某些获得优待，而另一些人被边缘化。这种歧视的一个明显例子是网站上的差异定价，即根据客户画像，某些客户支付相同产品的价格比其他客户高（Clifford
    2012）。


