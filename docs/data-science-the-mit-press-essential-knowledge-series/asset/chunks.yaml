- raw: "    : A centralized repository containing data from a range of sources across\
    \ an organization. The data are structured to support summary reports from the\
    \ aggregated data. *Online analytical processing* (OLAP) is the term used to describe\
    \ the typical operations on a data warehouse. \n\n    Decision Tree\n\n    : A\
    \ type of prediction model that encodes *if-then-else* rules in a tree structure.\
    \ Each node in the tree defines one attribute to test, and a path from the root\
    \ node to a terminating leaf node defines a sequence of tests that an instance\
    \ must pass for the label of the terminating node to be predicted for that instance.\
    \ \n\n    Deep Learning\n\n    : A deep-learning model is a neural network that\
    \ has multiple (more than two) layers of hidden units (or neurons). Deep networks\
    \ are deep in terms of the number of layers of neurons in the network. Today many\
    \ deep networks have tens to hundreds of layers. The power of deep-learning models\
    \ comes from the ability of the neurons in the later layers to learn useful attributes\
    \ derived from attributes that were themselves learned by the neurons in the earlier\
    \ layers. \n\n    Derived Attribute\n\n    : An attribute whose value is generated\
    \ by applying a function to other data rather than a direct measurement taken\
    \ from the entity. An attribute that describes an average value in a population\
    \ is an example of a derived attribute. Contrast with **raw attribute.** \n\n\
    \    DIKW Pyramid\n\n    : A model of the structural relationships between *data*,\
    \ *information*, *knowledge*, and *wisdom*. In the DIKW pyramid, data precedes\
    \ information, which precedes knowledge, which precedes wisdom. \n\n    Exhaust\
    \ Data\n\n    : Data that are a by-product of a process whose primary purpose\
    \ is something other than data capture. For example, for every image shared, tweeted,\
    \ retweeted, or liked, a range of exhaust data is generated: who shared, who viewed,\
    \ what device was used, what time of day, and so on. Contrast with **captured\
    \ data**. \n\n    Extraction, Transformation, and Load (ETL) \n\n    : ETL is\
    \ the term used to describe the typical processes and tools used to support the\
    \ mapping, merging, and movement of data between databases. \n\n    Hadoop\n\n\
    \    : Hadoop is an open-source framework developed by the Apache Software Foundation\
    \ that is designed for the processing of big data. It uses distributed storage\
    \ and processing across clusters of commodity hardware. \n\n    High-Performance\
    \ Computing (HPC)\n\n    : The field of HPC focuses on designing and implementing\
    \ frameworks to connect large number of computers together so that the resulting\
    \ computer cluster can store and process large amounts of data efficiently. \n\
    \n    In-Database Machine Learning\n\n    : Using machine-learning algorithms\
    \ that are built into the database solution. The benefit of in-database machine\
    \ learning is that it reduces the time spent on moving data in and out of databases\
    \ for analysis. \n\n    Instance\n\n    : Each row in a data set contains the\
    \ information relating to one instance (also known as an *example*, *entity*,\
    \ *case*, or *record*). \n\n    Internet of Things\n\n    : The internetworking\
    \ of physical devices and sensors so that these devices can share information.\
    \ Includes the field of machine-to-machine communication, which develops systems\
    \ that enable machines not only to share information but also to react to this\
    \ information and trigger actions without human involvement. \n\n    Linear Regression\n\
    \n    : When a linear relationship is assumed in a **regression analysis**, the\
    \ analysis is called *linear regression*. A popular type of prediction model used\
    \ to estimate the value of a numeric target attribute based on a set of numeric\
    \ input attributes. \n\n    Machine Learning (ML)\n\n    : The field of computer\
    \ science research that focuses on developing and evaluating algorithms that can\
    \ extract useful patterns from data sets. A machine-learning algorithm takes a\
    \ **data set** as input and returns a **model** that encodes the patterns the\
    \ algorithm extracted from the data. \n\n    Massively Parallel Processing Database\
    \ (MPP)\n\n    : In an MPP database, data is partitioned across multiple servers,\
    \ and each server can process the data on that server locally and independently.\
    \ \n\n    Metadata\n\n    : Data describing the structures and properties of other\
    \ data—for example, a time stamp that describes when a piece of data was collected.\
    \ Metadata are one of the most common types of **exhaust data**. \n\n    Model\n\
    \n    : In the context of machine learning, a model is a representation of a pattern\
    \ extracted using machine learning from a data set. Consequently, models are trained,\
    \ fitted to a data set, or created by running a machine learning algorithm on\
    \ a data set. Popular model representations include **decision trees** and **neural\
    \ networks**. A **prediction** model defines a mapping (or function) from a set\
    \ of input attributes to a value for a **target attribute**. Once a model has\
    \ been created, it can then be applied to new instances from the domain. For example,\
    \ in order to train a spam filter model, we would apply a machine learning algorithm\
    \ to a data set of historic emails that have been labeled as spam or not spam.\
    \ Once the model has been trained it can be used to label (or filter) new emails\
    \ that were not in the original data set. \n\n    Neural Network\n\n    : A type\
    \ of machine-learning model that is implemented as a network of simple processing\
    \ units called **neurons**. It is possible to create a variety of different types\
    \ of neural networks by modifying the topology of the neurons in the network.\
    \ A feed-forward, fully connected neural network is a very common type of network\
    \ that can be trained using **backpropagation**. \n\n    Neuron\n\n    : A neuron\
    \ takes a number of input values (or activations) as input and maps these values\
    \ to a single output activation. This mapping is typically implemented by applying\
