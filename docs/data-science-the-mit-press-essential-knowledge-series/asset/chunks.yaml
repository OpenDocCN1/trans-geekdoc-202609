    The contradictory aspects of data science can often be apparent in the same applications.
    For example, the use of data science in health insurance underwriting uses third-party
    marketing data sets that contain information such as purchasing habits, web search
    history, along with hundreds of other attributes relating to people’s lifestyles
    (Batty, Tripathi, Kroll, et al. 2010). The use of these third-party data is troublesome
    because it may trigger self-disciplining, wherein people avoid certain activities,
    such as visiting extreme-sports websites, for fear of incurring higher insurance
    premiums (Mayer-Schönberger and Cukier 2014). However, the justification for the
    use of these data is that it acts as a proxy for more invasive and expensive information
    sources, such as blood tests, and in the long term will reduce costs and premiums
    and thereby increase the number of people with health insurance (Batty, Tripathi,
    Kroll, et al. 2010).


    The fault lines in the debate between the commercial benefits and ethical considerations
    of using data science are apparent in the discussions around the use of personal
    data for targeted marketing. From a business advertising perspective, the incentive
    to use personal data is that there is a relationship between personalizing marketing,
    services, and products, on the one hand, and the effectiveness of the marketing,
    on the other. It has been shown that the use of personal social network data—such
    as identifying consumers who are connected to prior customers—increases the effectiveness
    of a direct-mail marketing campaign for a telecommunications service by three
    to five times compared to traditional marketing approaches (Hill, Provost, and
    Volinsky 2006). Similar claims have been made about the effectiveness of data-driven
    personalization of online marketing. For example, a study of online cost and effectiveness
    of online targeted advertising in the United States in 2010 compared `run-of-the-network`
    marketing (when an advertising campaign is pushed out across a range of websites
    without specific targeting of users or sites) with `behavioral targeting`[¹](#c11140_006.xhtml#FN25)
    (Beales 2010). The study found that behavioral marketing was both more expensive
    (2.68 times more) but also more effective, with a conversion rate more than twice
    that of run-of-the-network marketing. Another well-known study on the effectiveness
    of data-driven online advertising was conducted by researchers from the University
    of Toronto and MIT (Goldfarb and Tucker 2011). They used the enactment of a privacy-protection
    bill in the European Union (EU)[[²](#c11140_006.xhtml#FN26) that limited the ability
    of advertising companies to track users’ online behavior in order to compare the
    effectiveness of online advertising under the new restrictions (i.e., in the EU)
    and the effectiveness online advertising not under the new restrictions (i.e.,
    in the United States and other non-EU countries). The study found that online
    advertising was significantly less effective under the new restrictions, with
    a reported drop of 65 percent in study participants’ recorded purchasing intent.
    The results of this study have been contested (see, for example, Mayer and Mitchell
    2012), but the study has been used to support the argument that the more data
    that are available about an individual, the more effective the advertising that
    is directed to that individual will be. Proponents of data-driven targeted marketing
    frame this argument as a win–win for both the advertiser and the consumer, claiming
    that advertisers lower costs and consumers get more relevant advertising.


    This utopian perspective on the use of personal data for targeted marketing is
    at best based on a selective understanding of the problem. Probably one of the
    most worrying stories related to targeted advertising was reported in the `New
    York Times` in 2012 (Duhigg 2012) and involves the American discount store Target.
    It is well known that one of the times in a person’s life change radically is
    at conception and birth. Because of this change, marketers see pregnancy as an
    opportunity to trigger personalized marketing for new parents without the mother-to-be
    telling Target.[³](#c11140_006.xhtml#FN27) This insight would enable Target to
    identify pregnant customers at an early stage. To achieve this, Target initiated
    a data science project with the aim of predicting whether a customer was pregnant
    based on an analysis of shopping habits. The starting point for the project was
    to analyze the shopping habits of women who had signed up for Target’s baby-shower
    registry. The analysis revealed that expectant mothers tended to purchase larger
    quantities of unscented lotion at the beginning of the second trimester as well
    as certain dietary supplements throughout the first 20 weeks of pregnancy. Based
    on this analysis, Target created a data-driven model that used around 25 products
    and indictors and assigned each customer a `pregnancy-prediction` score. The success,
    for want of a better word, of this model was made very apparent when a man turned
    up at a Target store to complain about the fact that his high-school-age daughter
    had been mailed coupons for baby clothes and cribs. He accused Target of trying
    to encourage his daughter to get pregnant. However, over the subsequent days it
    transpired that the man’s daughter was in fact pregnant but hadn’t told anyone.
    Target’s pregnancy-prediction model was able to identify a pregnant high school
    student and act on this information.


    ## Ethical Implications of Data Science: Profiling and Discrimination


    The story about Target identifying a pregnant high school student without consent
    or knowledge highlights how data science can be used for social profiling not
    only of individuals but also of minority groups in society. In his book `The Daily
    You: How the New Advertising Industry Is Defining Your Identity and Your Worth`(2013),
    Joseph Turow discusses how marketers use digital profiling to categorize people
    as either `targets` or `waste` and then use these categories to personalize the
    offers and promotions directed to individual consumers: “those considered waste
    are ignored or shunted to other products that marketers deem more relevant to
    their tastes or income” (11). This personalization can result in preferential
    treatment for some and marginalization of others. A clear example of this discrimination
    is differential pricing on websites, wherein some customers are charged more than
    other customers for the same product based on their customer profiles (Clifford
    2012).

