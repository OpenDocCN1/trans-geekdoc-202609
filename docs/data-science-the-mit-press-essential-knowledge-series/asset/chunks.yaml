    The second part of the data-storage layer deals with managing the data produced
    by an organization’s big-data sources. In this architecture, the `Hadoop` platform
    is used for the storage and analytics of these big data. `Hadoop` is an open-source
    framework developed by the Apache Software Foundation that is designed for the
    processing of big data. It uses distributed storage and processing across clusters
    of commodity servers. Applying the `MapReduce` programming model, it speeds up
    the processing of queries on large data sets. `MapReduce` implements the `split-apply-combine`
    strategy: (*a*) a large data set is split up into separate chunks, and each chunk
    is stored on a different node in the cluster; (*b*) a query is then applied to
    all the chunks in parallel; and (*c*) the result of the query is then calculated
    by combining the results generated on the different chunks.


    Over the past couple of years, however, the `Hadoop` platform is also being used
    as an extension of an enterprise’s data warehouse. Data warehouses originally
    would store three years of data, but now data warehouses can store more than 10
    years of data, and this number keeps increasing. As the amount of data in a data
    warehouse increases, however, the storage and processing requirements of the database
    and server also have to increase. This requirement can have a significant cost
    implication. An alternative is to move some of the older data in a data warehouse
    for storage into a `Hadoop` cluster. For example, the data warehouse would store
    the most recent data, say three years’ worth of data, which frequently need to
    be available for quick analysis and presentation, while the older data and the
    less frequently used data are stored on `Hadoop`. Most of the enterprise-level
    databases have features that connect the data warehouse with `Hadoop`, allowing
    a data scientist, using `SQL`, to query the data in both places as if they all
    are located in one environment. Her query could involve accessing some data in
    the data-warehouse database and some of the data in `Hadoop`. The query processing
    will be automatically divided into two distinct parts, each running independently,
    and the results will be automatically combined and integrated before being presented
    back to the data scientist.


    Data analysis is associated with both sections of the data-storage layer in [figure
    6](#c11140_003.xhtml#fig_006). Data analysis can occur on the data in each section
    of the data layer, and the results from data analysis can be shared between each
    section while additional data analysis is being performed. The data from traditional
    sources frequently are relatively clean and information dense compared to the
    data captured from big-data sources. However, the volume and real-time nature
    of many big-data sources means that the effort involved in preparing and analyzing
    these big-data sources can be repaid in terms of additional insights not available
    through the data coming from traditional sources. A variety of data-analysis techniques
    developed across a number of different fields of research (including natural-language
    processing, computer vision, and `ML`) can be used to transform unstructured,
    low-density, low-value big data into high-density and high-value data. These high-value
    data can then be integrated with the other high-value data from traditional sources
    for further data analysis.


    The description given in this chapter and illustrated in [figure 6](#c11140_003.xhtml#fig_006)
    is the typical architecture of the data science ecosystem. It is suitable for
    most organizations, both small and large. However, as an organization scales in
    size, so too will the complexity of its data science ecosystem. For example, smaller-scale
    organizations may not require the `Hadoop` component, but for very large organizations
    the `Hadoop` component will become very important.


    ## Moving the Algorithms to the Data


    The traditional approach to data analysis involves the extraction of data from
    various databases, integrating the data, cleaning the data, subsetting the data,
    and building predictive models. Once the prediction models have been created they
    can be applied to the new data. Recall from chapter 1 that a prediction model
    predicts the missing value of an attribute: a spam filter is a prediction model
    that predicts whether the classification attribute of an email should have the
    value of “spam” or not. Applying the predictive models to the instances in new
    data to generate the missing values is known as “scoring the data.” Then the final
    results, after scoring new data, may be loaded back into a database so that these
    new data can be used as part of some workflow, reporting dashboard, or some other
    company assessment practice. [Figure 7](#c11140_003.xhtml#fig_007) illustrates
    that much of the data processing involved in data preparation and analysis is
    located on a server that is separate from the databases and the data warehouse.
    Therefore, a significant amount of time can be spent just moving the data out
    of the database and moving the results back into the database.


    ![Figure 7 The traditional process for building predictive models and scoring
    data.](images/11140_003_fig_007.jpg)


    [Figure 7](#c11140_003.xhtml#fig_007a) The traditional process for building predictive
    models and scoring data.


    An experiment run at the Dublin Institute of Technology on building a linear-regression
    model supplies an example of the time involved in each part of the process. Approximately
    70 to 80 percent of the time is taken with extracting and preparing the data;
    the remaining time is spent on building the models. For scoring data, approximately
    90 percent of the time is taken with extracting the data and saving the scored
    data set back into the database; only 10 percent of the time is spent on actually
    scoring. These results are based on data sets consisting of anywhere from 50,000
    records up to 1.5 million records. Most enterprise database vendors have recognized
    the time savings that would be available if time did not have to be spent on moving
    data and have responded to this problem by incorporating data-analysis functionality
    and `ML` algorithms into their database engines. The following sections explore
    how `ML` algorithms have been integrated into modern databases, how data storage
    works in the big-data world of `Hadoop`, and how using a combination of these
    two approaches allows organizations to easily work with all their data using `SQL`
    as a common language for accessing, analyzing, and performing `ML` and predictive
    analytics in real time.


    ### The Traditional Database or the Modern Traditional Database

    '
