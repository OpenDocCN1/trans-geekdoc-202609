    `customer churn`（客户流失）一词用于描述客户离开一种服务并加入另一种服务。因此，预测哪些客户可能在不久后离开的问题被称为 `churn prediction`（流失预测）。顾名思，这是一项预测任务。该任务的目标是将客户分类为具有流失风险或无。许多公司正在使用此类分析来预测电信、公用事业、银行、保险等行业的流失客户。公司正关注的一个日益增长的领域是员工离职或员工流失的预测：即哪些员工可能在特定期间内离开公司。


    当一个预测模型对输入返回标签或类别时，它被称为 `classification model`（分类模型）。训练 `classification model`
    需要历史数据，其中每个实例都带有标签，以指示目标事件是否在该实例上发生。例如，`customer-churn` 分类需要一个数据集，其中每个客户（每个客户占一行）都被分配一个标签，指示其是否已经流失。数据集将包含一个名为
    `target attribute`（目标属性）的属性，它列出了每个客户的标签。在某些情况下，为客户记录分配流失标签是一项相对简单的任务。例如，客户可能联系了机构并明确取消了其订阅或合同。然而，在其他情况下，流失事件可能没有明确的信号。例如，并非所有手机用户都有月租合同。有些客户使用的是按需付费（或预付）合同，他们会在需要更多手机余额时不规则地为账户充值。定义这种类型合同的客户是否已经流失可能是困难的：一个两周没有拨打电话的客户是否流失了？还是说客户必须余额为零且连续三周没有活动才被视为已流失？一旦从业务角度定义了流失事件，就有必要在代码中实现这一定义，以便为数据集中的每个客户分配目标标签。


    构建流失预测模型训练数据集的另一个复杂因素是需要考虑时间滞后。`churn prediction` 的目标是模拟客户在未来某点流失的倾向（或概率）。因此，这类模型具有时间维度，在创建数据集时需要考虑该维度。倾向模型数据集中的属性集源于两个独立的时间段：`observation
    period`（观察期）和 `outcome period`（结果期）。观察期是计算输入属性值的时间。结果期是计算目标属性的时间。创建客户流失模型的业务目标是使业务能够在客户流失之前进行某种干预——换句话说，就是吸引客户留用服务。这意味着对客户流失的预测必须在客户实际离开服务之前的某个时候做出。这段时间的长度就是结果期的长度，而流失模型返回的预测实际上是客户将在该结果期内流失。例如，模型可能被训练为预测客户将在一个月或两个月内流失，这取决于业务执行干预措施的速度。


    定义结果期会影响哪些数据应该被作模型的输入。如果模型被设计为预测客户在对该客户的记录运行模型之日起两个月内会流失，那么在训练模型时，描述已流失的历史客户的输入属性，应该仅使用这些客户在离开服务两个月前所可用的数据进行计算。同样地，描述当前活跃客户的输入属性也应该使用关于这些客户在两个月前活动的可用数据进行计算。通过这种方式创建数据集，可以确保数据集中的所有实例（包括流失客户和活跃客户）描述的都是客户在个人客户旅程中的某一时刻，而模型正是为了针对该时刻进行预测设计的：在例子中，就是他们流失或留下的*之前*两个月。


    几乎所有的客户倾向模型都会使用描述客户人口统计信息的属性作为输入：`age`、`gender`、`occupation` 等。在与持续服务相关的场景中，它们可能还会包含客户在客户生命周期中位置的属性：`coming
    on board`（新加入）、`standing still midcycle`（中期停滞）、`approaching end of a contract`（合同到期）。还可能存在特定于行业的属性。例如，电信行业客户流失模型中使用的典型属性包括客户的平均账单金额、账单金额的变化、平均使用量、在计划内或通常超出计划的分数、网内通话与网外通话的比例，以及可能使用的手机类型。然而，每个模型使用的特定属性会随项目不同而异。Gordon
    Linoff 和 Michael Berry (2011) 报告说，在韩国的一个流失预测项目中，研究人员发现包含一个描述客户手机相关流失率的属性是有用的（即：在观察期间，使用这种特定手机的客户中有百分之多少流失了？）。然而，当他们去加拿大建立类似的客户流失模型时，手机/流失率属性却是没用的。区别在于，在韩国，手机服务公司为新客户提供新手机的大额折扣，而在加拿大，同样的折扣同时提供给现有客户和新客户。整体效果是，在韩国，过时的手机驱动了客户流失；人们有动力离开一家运营商转向另一家以获得折扣，但在加拿大，这种离开的动力并不存在。


    一旦创建了带标签数据集，创建分类模型的主要阶段就是使用 `ML` 算法来构建 `classification model`。在建模过程中，尝试许多不同的 `ML`
    算法是一种良好的做法，以找出哪种算法在数据集上效果最好。一旦选择了最终模型，就可以通过在模型训练阶段未使用的数据子集上进行测试，来估算该模型在新实例上预测的可能准确率。如果一个模型被认为足够准确并符合业务需求，则会将模型部署并以批处理或实时的方式应用于新数据。部署模型的一个非常重要的部分是确保落实适当的业务流程和资源，以便模型能被有效使用。如果没有一个流程能够让模型的预测结果触发客户干预从而留住客户，那么创建客户流失模型是没有意义的。

    '
