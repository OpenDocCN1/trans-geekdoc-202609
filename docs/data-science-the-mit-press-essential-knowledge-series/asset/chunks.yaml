    When the required data are sourced, it is always important to check what data
    are being captured and used across an organization. Unfortunately, the approach
    to sourcing data taken by some data science projects is to look at what data are
    available in the transactional databases (and other data sources) and then to
    integrate and clean these data before going on to data exploration and analysis.
    This approach completely ignores the BI team and any data warehouse that might
    exist. In many organizations, the BI and data-warehouse team is already gathering,
    cleaning, transforming, and integrating the organization’s data into one central
    repository. If a data warehouse already exists, then it probably contains all
    or most of the data required by a project. Therefore, a data warehouse can save
    a significant amount of time on integrating and cleaning the data. It will also
    have much more data than the current transactional databases contain. If the data
    warehouse is used, it is possible to go back a number of years, build predictive
    models using the historic data, roll these models through various time periods,
    and then measure each model’s level of predictive accuracy. This process allows
    for the monitoring of changes in the data and how they affect the models. In addition,
    it is possible to monitor variations in the models that are produced by ML algorithms
    and how the models evolve over time. Following this kind of approach facilitates
    the demonstration of how the models work and behave over a number of years and
    helps with building up the customer’s confidence in what is being done and what
    can be achieved. For example, in one project where five years of historical data
    were available in the data warehouse, it was possible to demonstrate that the
    company could have saved US$40 million or more over that time period. If the data
    warehouse had not been available or used, then it would not have been possible
    to demonstrate this conclusion. Finally, when a project is using personal data
    it is essential to ensure that the use of this data is in line with the relevant
    antidiscrimination and privacy regulations.


    ### People


    A successful data science project often involves a team of people with a blend
    of data science competencies and skills. In most organizations, a variety of people
    in existing roles can and should contribute to data science projects: people working
    with databases, people who work with the ETL process, people who perform data
    integration, project managers, business analysts, domain experts, and so on. But
    organizations often still need to hire data science specialists—that is, people
    with the skills to work with big data, to apply ML, and to frame real-world problems
    in terms of data-driven solutions. Successful data scientists are willing and
    able to work and communicate with the management team, end users, and all involved
    to show and explain what and how data science can support their work. It is difficult
    to find people who have both the required technical skill set and the ability
    to communicate and work with people across an organization. However, this blend
    is crucial to the success of data science projects in most organizations.


    ### Models


    It is import to experiment with a variety of ML algorithms to discover which works
    best with the data sets. All too often in the literature, examples are given of
    cases where only one ML algorithm was used. Maybe the authors are discussing the
    algorithm that worked best for them or that is their favorite. Currently there
    is a great deal of interest in the use of neural networks and deep learning. Many
    other algorithms can be used, however, and these alternatives should be considered
    and tested. Furthermore, for data science projects based in the EU, the General
    Data Protection Regulations, which go into effect in April 2018, may become a
    factor in the.


    ### Integration with the Business


    When the goal of a data science project is defined, it is vital to ensure the
    outputs are integrated into existing systems. The more automated this process
    is, the quicker the organization can respond to its changing profile, by using
    data science and building it into processes, thereby reducing costs and increasing
    potential profits. For example, when a customer-risk model is built for the bank,
    the employee can be given live feedback. Another example is fraud detection; it
    can take four to six weeks to identify a fraud case that needs investigation.
    By using data science and building it into transaction-monitoring systems, organizations
    can now detect fraud in near real time. By automating and integrating models,
    quicker response times are achieved. If the outputs and models created by a project
    are not integrated into the business, then these outputs will not be used, and
    ultimately, the project will fail.


    ### Buy-in


    For most projects in organizations, support by senior management is crucial. However,
    most senior IT managers are very focused on the here and now: keeping the lights
    on, making sure their day-to-day applications are up and running, making sure
    the backups and recovery processes are in place, and so on. Successful data science
    projects are sponsored by senior business managers (rather than by an IT manager)
    because the former are focused not on the technology but on the processes involved
    in the data science project and how the outputs of the data science project can
    be used to the organization’s advantage. The more focused a project sponsor is
    on these factors, the more successful the project will be. He or she will then
    act as the key to informing the rest of the organization about the project and
    selling it to them. But even when data science has a senior manager as an internal
    champion, a data science strategy can still fail in the long term if the initial
    data science project is treated as a box-ticking exercise. It takes long-term
    commitment from senior management to view data science as a strategy.


    ### Iteration


    Most data science projects will need to be updated and refreshed on a semiregular
    basis. For each new update or iteration, new data can be added, new updates can
    be added, maybe new algorithms can be used, and so on. The frequency of these
    iterations will vary from project to project; it could be daily or quarterly or
    biannually or annually. Checks should be built into the productionalized data
    science outputs to detect when models need updating (see Kelleher, Mac Namee,
    and D’Arcy 2015 for an explanation of how to use a stability index to identify
    when a model should be updated).


    ## Final Thoughts

    '
  trans: '


    当需要获取数据时，检查整个组织内部正在采集和使用哪些数据始终非常重要。遗憾的是，某些数据科学项目采取的数据获取方法是仅查看事务数据库（以及其他数据源）中有哪些可用数据，然后在进行数据探索和分析之前，对这些数据进行集成和清洗。这种方法完全忽略了
    BI（商业智能）团队以及任何可能存在的数据仓库。在许多组织中，BI 和数据仓库团队已经在收集、清洗、转换并整合组织的数据，将其存储到一个中央仓库中。如果已经存在数据仓库，那么它可能包含了项目所需的全部或大部分数据。因此，数据仓库可以节省大量集成和清洗数据的时间。它包含的数据也比当前事务数据库所包含的要多得多。如果使用数据仓库，就可以追溯多年，利用历史数据构建预测模型，并将这些模型在不同的时间段内进行回测，然后衡量每个模型的预测准确率。这一过程允许监控数据的变化及其如何影响模型。此外，还可以监控由
    ML 算法产生的模型变异，以及模型随时间演变的情况。遵循这种方法有助于展示模型在多年中的运行方式和行为，并帮助客户对所进行的工作和可以实现的目标建立信心。例如，在一个项目中，由于数据仓库中有五年的历史数据，可以证明公司在那个段时间内本可以节省
    4,000 万美元或更多资金。如果没有可用或未使用数据仓库，就无法得出这一结论。最后，当项目使用个人数据时，确保此类数据的使用符合相关的反歧视和隐私法规至关重要。


    ### 人员


    一个成功的数据科学项目通常涉及一个融合数据科学能力和技能的人员团队。在大多数组织中，现有角色中的各种人员也可以也应该为数据科学项目做出贡献：负责数据库的人员、负责
    ETL 过程的人员、执行数据集成的人员、项目经理、业务分析师、领域专家等。但组织通常仍然需要招聘数据科学专家——即具有处理大数据、应用机器学习（ML）以及将现实世界问题转化为数据驱动解决方案技能的人才。成功的数据科学家愿意并能够与管理团队、最终用户以及所有相关人员工作和沟通，以展示并解释数据科学可以如何如何支持他们的工作。要找到既具备所需技术技能，又具备跨组织沟通和合作能力的人是困难的。然而，在大多数组织中，这种技能组合对于数据科学项目的成功至关重要。


    ### 模型


    对多种 ML 算法进行实验，以发现哪种算法与数据集最匹配，这是非常重要的。文献中经常给出只使用一种 ML 算法的案例。也许作者讨论的是对他们最有效的算法，或者是他们最喜欢的算法。目前，人们对神经网络和深度学习的使用有着极大兴趣。然而，还可以使用许多其他算法，应当考虑并测试这些替代方案。此外，对于位于欧盟的数据科学项目，于
    2018 年 4 月生效的《通用数据保护条例》（GDPR）可能会成为一个考虑因素。


    ### 与业务的集成


    当定义数据科学项目的目标时，确保输出结果集成到现有系统中至关重要。这一过程越自动化，组织越能通过使用数据科学并将其融入流程来对其变化做出快速响应，从而降低成本并增加潜在利润。例如，为银行构建客户风险模型时，可以为员工提供实时反馈。另一个例子是欺诈检测；识别一个需要调查的欺诈案件可能需要四六周。通过使用数据科学并将其构建交易监控系统中，组织现在可以实时检测欺诈。通过自动化和集成模型，可以获得更快的响应速度。如果项目创建的输出和模型没有集成到业务中，那么这些输出将不会被使用，最终项目将失败。


    ### 认可（Buy-in）


    对于组织中的大多数项目来说，高层的支持至关重要。然而，大多数高级 IT 管理人员非常关注当下：维持设备运行、确保日常应用程序正常运行、确保备份和恢复流程到位等。成功的数据科学项目由高级业务管理人员（而非
    IT 管理人员）赞助，因为他们关注的不是技术，而是数据科学项目涉及的流程，以及数据科学项目的输出如何能为组织带来优势。项目赞助人对这些因素越关注，项目就越成功。他或她将成为向组织其他部分介绍项目并向他们推广项目的关键。但即使数据科学有一位高级经理作为内部推动者，如果最初的数据科学项目被视为一种“走过”的任务，数据科学策略在长期内仍然可能失败。将数据科学视为一种战略需要高层的长期承诺。


    ### 迭代


    大多数数据科学项目都需要定期进行更新和刷新。对于每次新的更新或迭代，都可以添加新数据、可以添加新更新、可能可以使用新算法等。这些迭代的频率会因项目而异；可能是每天、每季度、每半年或每年一次。应该在生产化的数据科学输出中建立检查机制，以检测模型何时需要更新（参见
    Kelleher, Mac Namee, and D’Arcy 2015，关于如何使用稳定性指数来识别何时应更新模型的说明）。


    ## 结语


    '
